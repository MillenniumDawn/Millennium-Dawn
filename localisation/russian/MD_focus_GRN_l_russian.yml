l_russian:
 greenland_focus: "Гренландское дерево фокуса"
 GRN_intro_to_greenland_shortcut: "Введение в Гренландию"
 GRN_greenland_foreign_policy_tree: "Внешняя политика Гренландии"
 GRN_focus_The_Great_Ice_Island: "Большой Ледяной остров"
 GRN_focus_The_Great_Ice_Island_desc: "Гренландия — один из крупнейших известных островов в мире после континента Австралия. На острове проживает около 58 тысяч человек, в основном инуитов. Гренландия считается последним крупным рубежом развития Земли, уступая по значимости только Северному или Южному полюсам планеты. В XXI веке Гренландия и её жители считают себя последней настоящей колонией и активно стремятся к подлинной независимости. Но обретут ли они наконец свободу или потерпят неудачу, не сумев доказать, что остров действительно способен существовать самостоятельно?"
 GRN_focus_The_People: "Народ"
 GRN_focus_The_People_desc: "Одна из главных проблем, от которой страдает наша страна, — это нехватка людей. Людям нужны еда, жилье и государственные услуги, которые могли бы оказать им помощь и поддержку в трудную минуту. Поэтому мы должны решить эти проблемы, чтобы обеспечить будущее, в котором люди захотят приезжать и оставаться в нашей стране. Чтобы они могли создать свое собственное будущее в месте, которое может казаться безжизненным."
 GRN_focus_Food_Security: "Продовольственная безопасность"
 GRN_focus_Food_Security_desc: "Основной источник продовольствия на нашем острове — это рыболовство. Но рыболовство также является нашим главным экономическим узким местом, так как же мы сможем прокормить себя, если будем импортировать то же самое? Это один из ключевых столпов, которые мы должны заложить для обеспечения стабильного будущего."
 GRN_focus_Breaking_Ground_For_Farmlands: "Начало строительства сельскохозяйственных угодий \"Farmlands\""
 GRN_focus_Breaking_Ground_For_Farmlands_desc: "Теплицы и проекты вертикального земледелия. Эти основные продукты станут основой нового продовольственного снабжения нашей страны, и поэтому нам необходимо создать оборудование для их выращивания и культивирования. Хотя этот процесс потребует больших затрат энергии, если мы создадим необходимую инфраструктуру и проанализируем имеющиеся ресурсы, мы сможем собрать воедино некоторые базовые элементы, чтобы запустить этот процесс."
 GRN_focus_East_Farmland_Projects: "Проекты East \"Farmland\""
 GRN_focus_East_Farmland_Projects_desc: "Как и в случае с нашей первоначальной работой на Западе, нам нужно будет сделать то же самое на Востоке. Небольшие продовольственные центры помогут с логистикой и распределением по всей стране и в наших довольно малонаселенных поселениях."
 GRN_focus_Growing_Staple_Foods: "Выращивание основных продуктов питания"
 GRN_focus_Growing_Staple_Foods_desc: "На начальном этапе реализации наших проектов по суровому сельскому хозяйству мы будем выращивать в основном только основные продукты питания: картофель, пшеницу и небольшой набор основных продуктов, которые помогают обеспечить достаточное потребление калорий и позволяют экономно расходовать пищу."
 GRN_focus_Strategic_Cash_Crops: "Стратегические товарные культуры"
 GRN_focus_Strategic_Cash_Crops_desc: "Программа SCC представляет собой ограниченную часть наших новых программ HFP, направленных на укрепление национального продовольственного снабжения. Мы также можем рассмотреть возможность выращивания товарных культур с ограниченными ресурсами, таких как хлопок и другие, в качестве способа стимулирования внутреннего промышленного роста."
 GRN_focus_National_Seed_Vault: "Национальное хранилище семян"
 GRN_focus_National_Seed_Vault_desc: "По мере расширения наших программ по выращиванию высокопродуктивных культур как в национальном масштабе, так и на местном уровне, мы должны иметь возможность диверсифицировать и расширить ассортимент выращиваемых нами культур. В связи с этим мы создадим национальное хранилище семян для сохранения и надлежащего распределения севооборотных культур, чтобы наша страна могла в полной мере пользоваться дарами мира."
 GRN_focus_Stable_Population_Growth: "Стабильный рост населения"
 GRN_focus_Stable_Population_Growth_desc: "Наша страна на протяжении всего своего существования сталкивалась с проблемой неспособности стабилизировать численность населения. Многие бегут из-за суровых условий или желания увидеть мир. И давайте будем честны, мы не можем винить их за желание большего в жизни, но мы можем винить себя за то, что не работаем над тем, чтобы дать людям причины остаться. Мы ничего не можем сделать с погодой, но мы можем развивать города и поселения, чтобы убедить людей остаться и помочь улучшить свои дома."
 GRN_focus_Planning_New_Settlements: "Планирование новых поселений"
 GRN_focus_Planning_New_Settlements_desc: "Возможности для роста населения сдерживаются отсутствием надлежащего жилищного строительства и планирования новых городов в целом. Вся деятельность в основном сосредоточена вокруг столицы Нуука, поэтому на этих ранних этапах планирования и развития нам пока придётся использовать столицу в качестве базы для организации логистики."
 GRN_focus_Spread_Settlement_Planning_East: "Планирование расчетов с использованием спредов на Востоке"
 GRN_focus_Spread_Settlement_Planning_East_desc: "Хотя столица Нуук является нашей логистической базой для западной части острова, нам потребуется создать своего рода \"восточная столица\" по сути. Таким образом, восточная половина также получает логистический центр для планирования и распределения ресурсов, необходимых для развития населенных пунктов и роста двух основных регионов страны."
 GRN_focus_New_Hope_Settlement: "Поселение Нью-Хоуп"
 GRN_focus_New_Hope_Settlement_desc: "Стремясь к лучшему завтра, лучшему будущему и просто лучшей жизни для наших граждан, мы решили основать совершенно новое поселение в центральной части северо-западного побережья, которое называется Нериуннек нутаак, или, по-английски, примерно переводится как «Новая надежда». Мы хотим сделать его маяком нашего прогресса в развитии страны и западной половины острова."
 GRN_focus_Great_Star_Settlement: "Великое Звездное Поселение"
 GRN_focus_Great_Star_Settlement_desc: "Чтобы равномерно распределить наше развитие и обеспечить равные логистические потребности в рамках наших непрерывных усилий по развитию, мы создадим восточное поселение на той же территории, что и западное. Названное Annertuumik Stjerne, что примерно переводится на английский как «Великая звезда» или \"Big Star\", мы надеемся использовать его в качестве основной восточной базы для начала распространения усилий по развитию, одновременно занимаясь как прибрежным ростом, так и развитием в направлении Большого ледникового шельфа."
 GRN_focus_Development_Living_Grants: "Гранты на проживание для развития"
 GRN_focus_Development_Living_Grants_desc: "Программа DLG — это государственная субсидия, призванная стимулировать иммиграцию в страну. Основной принцип заключается в том, что субсидия покрывает транспортные расходы и расходы на обустройство. После того, как человек (или люди) обустроятся и получат помощь в трудоустройстве с стабильным доходом, выплата субсидии прекращается. По сути, это инвестиции в человеческие ресурсы для стимулирования роста населения посредством активного развития страны."
 GRN_focus_Developing_Public_Services: "Развитие государственных услуг"
 GRN_focus_Developing_Public_Services_desc: "Улучшение и развитие наших государственных систем и инфраструктуры значительно повысит качество жизни наших граждан. Мы внесем ряд небольших улучшений в образование, здравоохранение, социальное обеспечение, а также разработаем более безопасный интернет-сервис для будущего нашей страны."
 GRN_focus_Recruiting_More_Teachers: "Привлечение большего количества учителей"
 GRN_focus_Recruiting_More_Teachers_desc: "Одной из главных проблем нашей системы образования является нехватка преподавательского состава. Из-за того, что на одного учителя приходится всё больше учеников, многие бросают учёбу просто потому, что у них нет реальной возможности учиться. Поэтому мы должны привлекать и стараться уговаривать больше учителей, как отечественных, так и зарубежных, чтобы они помогали обучать и развивать наших детей. Будем надеяться, что это откроет светлое будущее для всех, кто сможет учиться и развиваться, получая образование."
 GRN_focus_Improving_Medical_Stockpiles: "Улучшение запасов медицинских товаров"
 GRN_focus_Improving_Medical_Stockpiles_desc: "Лекарства, персонал и оборудование. Это основные вещи, необходимые нам для надлежащего удовлетворения потребностей наших граждан в области здравоохранения. Поэтому мы должны улучшить возможности хранения и обращения с лекарствами, чтобы обеспечить удовлетворение любых возникающих потребностей."
 GRN_focus_Creating_Concentrated_Internet_Services: "Создание концентрированных интернет-сервисов"
 GRN_focus_Creating_Concentrated_Internet_Services_desc: "Доступ к интернету в целом практически является неотъемлемой частью современных обществ и развитых экономик. Нам необходимо создать ограниченную сеть интернет-провайдеров, чтобы обеспечить нашей стране более эффективную связь с внешним миром. Наши граждане и государственные службы также могли бы пассивно извлекать выгоду из повышения эффективности, которую интернет-услуги могли бы обеспечить в определенных областях."
 GRN_focus_Recruiting_More_Social_Workers: "Набор большего числа социальных работников"
 GRN_focus_Recruiting_More_Social_Workers_desc: "Улучшение численности и качества персонала обеспечит соответствие наших социальных служб потребностям страны по мере потенциального роста населения в связи с нашими усилиями по развитию. Хотя стоимость вызывает опасения, это ничего не значит, если мы в итоге отпугнем людей, зная, что им не будет оказана помощь, когда они действительно в ней нуждаются."
 GRN_focus_Basic_Eastern_Roadworks: "Основные дорожные работы на востоке страны"
 GRN_focus_Basic_Eastern_Roadworks_desc: "Поскольку восток страны является наименее развитым регионом, мы должны помочь ему, улучшив логистическую поддержку за счет модернизации дорог. Хотя это и не является первоочередной задачей, по мере дальнейшего развития и роста региона было бы полезно заранее определить рамки, которым они могут следовать."
 GRN_focus_Greenlandic_Economy: "Экономика Гренландии"
 GRN_focus_Greenlandic_Economy_desc: "Людям нужны материалы, им нужен образ жизни, возможность работать и зарабатывать на жизнь. Поэтому развитие экономики, добыча ресурсов и развитие инфраструктуры для обеспечения всего этого должны планироваться и финансироваться."
 GRN_focus_Economic_Diversification: "Экономическая диверсификация"
 GRN_focus_Economic_Diversification_desc: "Учитывая многочисленные ограничения нашей страны, мы должны развивать и заложить основу для расширения экономических возможностей. Простое существование только в рамках рыболовства или почти феодального образа жизни ни к чему не приведет ни страну, ни ее народ. Мы должны это исправить."
 GRN_focus_Western_Zoning: "Западное зонирование"
 GRN_focus_Western_Zoning_desc: "Столица расположена на западе, поэтому мы начнем начальные этапы зонирования и развития в этом районе. Обследование территории на предмет устойчивости, а также определение потребностей и средств для запуска специализированного предприятия обойдется гораздо дороже, чем обычно. Но если мы хотим противостоять стихии в ее суровые времена, то должны понимать и осознавать цену, которую это повлечет за собой."
 GRN_focus_Eastern_Groundworks: "Восточные земляные работы"
 GRN_focus_Eastern_Groundworks_desc: "Если мы когда-либо хотим добиться экономического роста, роста населения или, по крайней мере, стабильности, то мы должны использовать все имеющиеся у нас земли. Поэтому заблаговременная подготовка к реализации наших проектов на востоке страны будет иметь важное значение на этих начальных этапах планирования."
 GRN_focus_Basic_Industrialization: "Базовая индустриализация"
 GRN_focus_Basic_Industrialization_desc: "Завершив подготовительные работы и оформив зонирование, мы можем создать небольшие, но необходимые для страны производственные мощности, которые понадобятся ей в будущем. Конечно, пока мы не решим проблему с добычей полезных ископаемых, нам придется полагаться на импорт материалов. Слава богу, мы можем использовать наши связи с ЕС через Данию, чтобы помочь нам в этом вопросе."
 GRN_focus_Basic_Coastal_Manufacturing: "Базовое прибрежное производство"
 GRN_focus_Basic_Coastal_Manufacturing_desc: "Дополняя существующие методы рыболовства, мы также можем разработать систему для создания собственных торговых судов, которые мы сможем использовать в отношениях как с Данией, так и с теми, кто желает помочь нам развиваться и расти как нация."
 GRN_focus_Babys_First_Economy: "Экономика «Первый ребенок»"
 GRN_focus_Babys_First_Economy_desc: "Теперь у нас есть прочная основа для того, чтобы люди могли приехать и работать. Нам осталось лишь развить инфраструктуру для поддержки людей и решить еще около семи важнейших проблем, которые тормозят развитие страны. Но будем двигаться шаг за шагом, когда-нибудь мы добьемся успеха."
 GRN_focus_Infrastructure_Development: "Развитие инфраструктуры"
 GRN_focus_Infrastructure_Development_desc: "Лучший способ объединить и развить нашу страну — это создать стандартизированную и гибкую инфраструктурную систему. Для этого нам потребуется привлечь экспертов в области геологии, инженерии и других областях, чтобы спланировать необходимую нам инфраструктуру. Нам также необходимо знать, как лучше всего разработать и спланировать её на максимально долгосрочную перспективу, прежде чем потребуется капитальный ремонт."
 GRN_focus_The_Network_Debate: "Сетевые дебаты"
 GRN_focus_The_Network_Debate_desc: "Создание полноценной дорожной сети будет столь же сложной задачей, как и практически любое другое начинание. Поэтому нам необходимо провести обследование и заложить основу для того, как будут выглядеть наши дороги. Начав с Нуука, мы сможем установить стандарты и создать, по крайней мере, западные прибрежные районы, являющиеся сердцем страны, откуда доставляются ресурсы и люди."
 GRN_focus_Narrow_Gauge_Standard: "Стандарт узкоколейности"
 GRN_focus_Narrow_Gauge_Standard_desc: "Создание национального стандарта для железнодорожного оборудования и перевозок определит темпы и основные направления развития наших железных дорог в будущем. Использование узкоколейных железных дорог позволяет нам быть более гибкими в условиях местности, обходится дешевле с точки зрения строительства и обслуживания, а также позволяет более эффективно обеспечить надлежащее укрепление конструкции и фундамента железнодорожного полотна."
 GRN_focus_Capital_Course: "Курс по капитальным затратам"
 GRN_focus_Capital_Course_desc: "Начав движение из столицы и разветвляясь на более мелкие населенные пункты, вы обеспечите себе большую легкость передвижения и лучшую транспортную доступность на средних расстояниях. Конечно, это всего лишь один шаг, но ведь нужно же просто ставить одну ногу перед другой, чтобы пройтись по улице, не так ли?"
 GRN_focus_Nuuk_Western_Railway: "Западная железная дорога Нуук"
 GRN_focus_Nuuk_Western_Railway_desc: "Создание Северо-Западной железной дороги в Гренландии позволяет нам лучше связать разрозненные поселения в близлежащем столичном регионе, а также использовать это в качестве основы для будущих проектов, направленных на удовлетворение экономических и транспортных потребностей страны."
 GRN_focus_Infrastructure_Infancy: "Инфраструктура в зачаточном состоянии"
 GRN_focus_Infrastructure_Infancy_desc: "Сделав эти важные, но простые шаги для создания национальной инфраструктуры, мы теперь можем задать новый, развивающийся прецедент в деле роста и развития этих земель, находящихся в нашей власти."
 GRN_focus_Ministry_For_Mineral_Affairs: "Министерство по минеральным ресурсам"
 GRN_focus_Ministry_For_Mineral_Affairs_desc: "Министерство минеральных ресурсов, или, как его иногда шутят, МММР, — это специализированный правительственный орган, который будет нанимать экспертов в области геологии, структурной целостности и общих методов горнодобывающей промышленности, чтобы гарантировать, что основные инвестиции в добычу национальных ресурсов будут осуществляться безопасным и эффективным образом с самого начала. Это обеспечит соответствие всех расширений установленным на данном этапе стандартам."
 GRN_focus_Domesticating_Energy_Needs: "Удовлетворение энергетических потребностей"
 GRN_focus_Domesticating_Energy_Needs_desc: "Нашей стране принципиально необходима энергия. Для отопления, электроснабжения и удовлетворения основных потребностей экономики и ее цепочек поставок. В связи с этим мы изучим некоторые угольные месторождения и начнем стратегические горнодобывающие операции, чтобы сократить импорт и улучшить внутренние условия."
 GRN_focus_Limited_Strategic_Resource_Extraction: "Ограниченная стратегическая добыча ресурсов"
 GRN_focus_Limited_Strategic_Resource_Extraction_desc: "Программа LSRE — это план по развитию мелкомасштабной добычи тяжелых металлов или более стратегически важных минералов в масштабах всей страны. Например, титана, месторождения которого находятся недалеко от столицы, а также имеются неплохие залежи на востоке, если мы захотим расширить их разработку."
 GRN_focus_Cornerstone_Creation: "Создание краеугольного камня"
 GRN_focus_Cornerstone_Creation_desc: "Помимо бетона, одним из главных столпов современной экономики является ее способность производить сталь. У нас есть месторождения угля и железной руды, так почему бы не построить первый в мире сталелитейный завод? Он может быть и небольшим, но мы, безусловно, сможем использовать эти материалы для развития нашей страны."
 GRN_focus_Extracting_Natural_Capital: "Добыча природного капитала"
 GRN_focus_Extracting_Natural_Capital_desc: "Говорят, в тех холмах есть золото. И это правда, ведь золото можно использовать не только для ношения на себе. В общем, так оно и есть. \"свободный капитал\" Наши ресурсы могут быть использованы для инициирования будущих проектов и содействия стабилизации бюджетов, требующих дополнительных инвестиций."
 GRN_focus_Securing_Mining_Futures: "Обеспечение стабильности в горнодобывающей отрасли"
 GRN_focus_Securing_Mining_Futures_desc: "Борьба с бюрократией, корректировка нормативных актов и уделение большего внимания энергоориентированным горным работам позволяют нам решить сразу несколько задач, используя одну энергоемкую породу."
 GRN_focus_The_Future: "Будущее"
 GRN_focus_The_Future_desc: "Решение проблем настоящего — первоочередная задача, но невозможно просто решить проблемы настоящего, не подготовившись к будущему. Поэтому конечная цель для нашей страны — обеспечить будущее не только тем, кто живет на побережье, но и создать и построить будущее для тех, кто хочет жить на шельфе. В конце концов, лед — это всего лишь замерзшая вода, а пресную воду мы можем дистиллировать, не так ли?"
 GRN_focus_Coastal_Economic_Zones: "Прибрежные экономические зоны"
 GRN_focus_Coastal_Economic_Zones_desc: "Конечная цель для будущего роста Гренландии — это освоение внутренних районов. Многие говорят, что нельзя просто жить на льду, и мы на это отвечаем: конечно. Однако что такое лед, если не пресная вода? Как же мы получаем воду из льда? Мы его растапливаем. Поэтому нам следует развивать целевые экономические зоны на побережье, чтобы создать необходимые условия и обеспечить финансовые возможности для начала процессов дистилляции шельфового льда. Это будет долгий и трудный процесс, но медленное продвижение на север через внутренние районы уже началось, если у нас хватит воли для этого."
 GRN_focus_Foreign_Logistics_Hub_One: "Зарубежный логистический центр номер один"
 GRN_focus_Foreign_Logistics_Hub_One_desc: "Наиболее подходящим местом для создания экономической зоны на побережье является самая южная точка острова. Недалеко от Тасиусака мы воспользуемся пологими фьордами, чтобы сформировать и создать обширную гавань и порт. \"город\" подобно оборудованию. Этот плацдарм поможет продвижению западных войск на великом пути на север."
 GRN_focus_Foreign_Logistics_Hub_Two: "Зарубежный логистический центр номер два"
 GRN_focus_Foreign_Logistics_Hub_Two_desc: "В дополнение к наиболее центральному местоположению для создания экономической зоны на побережье, мы создадим аналогичный механизм недалеко от города Итиллек. Этот плацдарм поможет в продвижении на восток по пути на север и объединении двух южных зон в одну объединенную прибрежную экономическую зону (ОКЗ)."
 GRN_focus_West_Hub_Distillation_Facility: "Дистилляционный завод West Hub"
 GRN_focus_West_Hub_Distillation_Facility_desc: "Создание комплексного перерабатывающего завода для начала добычи льда с шельфового ледника позволит нам увеличить водоснабжение и пассивно проложить путь на север через ледник. Этот процесс будет дорогостоящим и потребует привлечения персонала на длительный период, пока мы не обучим и не наймем местных жителей. Но долгосрочная цель освоения и использования земель, замороженных под ледяными отложениями, оправдает себя."
 GRN_focus_East_Hub_Distillation_Facility: "Восточный центр дистилляции"
 GRN_focus_East_Hub_Distillation_Facility_desc: "Расширяя общее назначение созданной нами зоны CCEZ, в настоящее время ведется строительство второго основного перегонного завода, призванного поддержать продвижение на запад. Компания East Hub Distillation будет делать то же самое, но будет работать на восток, объединяя усилия для продвижения на север."
 GRN_focus_Southern_Fjords_Railway: "Железная дорога Южных Фьордов"
 GRN_focus_Southern_Fjords_Railway_desc: "Строительство железной дороги в регионе позволит нам не только лучше соединить всю зону CCEZ, но и, по возможности, обеспечит транспортировку воды в различные районы южного региона как для жилых, так и для коммерческих нужд."
 GRN_focus_Staging_Zones_For_The_Shelf: "Зоны подготовки для размещения на полке"
 GRN_focus_Staging_Zones_For_The_Shelf_desc: "Для того чтобы осуществить нашу грандиозную цель — покорить Большой шельфовый ледник, мы должны сначала создать стратегические зоны подготовки, чтобы обеспечить реальное использование замерзшей воды, а не просто сбрасывать ее в океаны."
 GRN_focus_The_Great_Eastern_Staging_Grounds: "Великий Восточный перевалочный пункт"
 GRN_focus_The_Great_Eastern_Staging_Grounds_desc: "Восточная часть острова наименее населена, а это значит, что нам потребуется нанять и заключить контракты с экспертами, которые, по сути, будут жить там и готовить почву для будущего продвижения вглубь Большого ледникового шельфа. Для этого мы будем использовать остров Тингмиармит в качестве ключевого плацдарма и начнем с выемки и выравнивания грунта на непосредственной береговой линии главного острова."
 GRN_focus_Capital_Staging_Works: "Работы по подготовке капитального строительства"
 GRN_focus_Capital_Staging_Works_desc: "Регион вокруг столицы Нуук — один из наиболее развитых на острове. Поэтому неудивительно, что главный западный плацдарм расположен именно в столице. Здесь будет создан специализированный и всеобъемлющий кампус с перегонными установками, научно-исследовательскими центрами, а также значительная государственная субсидия на привлечение экспертов и преподавателей, что позволит в конечном итоге передать территорию гренландцам. Это потребует значительного времени и ресурсов, но растопить всю замерзшую воду и обнаружить настоящую скальную породу внутренней части острова — задача не из легких."
 GRN_focus_Meeting_Needs: "Удовлетворение потребностей"
 GRN_focus_Meeting_Needs_desc: "Для создания столь сложной системы, какую мы планируем, нам необходимо наладить местные цепочки поставок или, по крайней мере, максимально локальные. Малые предприятия, удовлетворяющие промышленные и коммерческие потребности, будут способствовать развитию подготовительных площадок и, таким образом, зададут стандарты для последующего продвижения вглубь страны."
 GRN_focus_Supplying_Outposts: "Аванпосты снабжения"
 GRN_focus_Supplying_Outposts_desc: "Хотя официально у Гренландии нет военных сил, если мы хотим добиться хоть какого-то прогресса в создании линии снабжения на Большой Шельф, мы должны обеспечить удовлетворение всех потребностей в снабжении. Поэтому мы создадим крайне незначительную оружейную промышленность, ориентированную на снабжение аванпостов оружием и боеприпасами, необходимыми для охоты и самообороны от потенциальных мародеров. В конце концов, в глуши, кто услышит твой крик?"
 GRN_focus_General_National_Investments: "Общие национальные инвестиции"
 GRN_focus_General_National_Investments_desc: "Для финансовой и внутренней стабильности нашей страны необходимы работы по развитию горнодобывающей промышленности, транспорта и общему благоустройству. С подготовкой и началом активной работы мы создали свою «театральную площадку», на которой в ближайшие годы начнется представление нашего народа, покоряющего Великий ледниковый шельф. Вместе с этим, железнодорожные компании NWR и SFR будут объединены в Великую Западную Фьордскую железную дорогу (GWFR)."
 GRN_focus_Greater_Greenland_Act: "Закон о Великой Гренландии"
 GRN_focus_Greater_Greenland_Act_desc: "Целевое финансирование направлено на улучшение положения семей страны, а также на поиск людей со схожим культурным и этническим происхождением, которые хотели бы жить в более сплоченном обществе, чем сейчас. Этот раздел закона посвящен заселению Западного региона."
 GRN_focus_Eastern_Population_Act: "Закон о населении восточных регионов"
 GRN_focus_Eastern_Population_Act_desc: "Целевое финансирование направлено на улучшение положения семей страны, а также на поиск людей со схожим культурным и этническим происхождением, которые хотели бы жить в более сплоченном обществе, чем сейчас. Этот раздел закона посвящен заселению Восточного региона в соответствии с Законом о Большой Гренландии."
 GRN_focus_Battle_For_Independence: "Битва за независимость"
 GRN_focus_Battle_For_Independence_desc: "Мы подошли к перекрестку. Датский парламент начал предпринимать шаги, касающиеся нашего статуса как государства. Независимо от того, будет ли это положительное или отрицательное решение, нам необходимо обеспечить свою безопасность, и поэтому мы начнем вкладывать значительные средства в кампании давления, чтобы повысить нашу узнаваемость среди других стран и надеяться, что сможем более или менее заставить нас принять мирное решение о независимости."
 GRN_focus_Rushed_Mobilization_Efforts: "Срочные мобилизационные усилия"
 GRN_focus_Rushed_Mobilization_Efforts_desc: "Мы решили, что больше не хотим подчиняться репрессивным маневрам Дании. Поэтому мы в срочном порядке мобилизуем минимально необходимое количество сил для защиты острова от любого серьезного датского вторжения."
 GRN_focus_Organizing_Fundamentals_In_Training: "Основы организации обучения"
 GRN_focus_Organizing_Fundamentals_In_Training_desc: "Необходимо срочно создать учебный центр для базовой подготовки, так как он необходим для проведения максимально быстрых и интенсивных курсов, если мы хотим защитить наш остров от надвигающегося вторжения."
 GRN_focus_If_It_Floats_Its_A_Boat: "Если оно плавает, значит, это лодка."
 GRN_focus_If_It_Floats_Its_A_Boat_desc: "Вероятнее всего, датский военно-морской флот возглавит операцию по захвату острова. Хотя это и потребует значительных затрат, мы должны предпринять какие-то шаги, чтобы выиграть время, если хотим когда-либо считаться серьезной державой на мировой арене."
 GRN_focus_Removing_The_Last_Loose_Ends: "Устранение последних недочетов"
 GRN_focus_Removing_The_Last_Loose_Ends_desc: "Разорвав связи с датской короной, мы теперь являемся самостоятельной нацией и, следовательно, лишились тех привилегий, которыми обладали в колониальный период. В связи с этим нам необходимо реорганизовать некоторые аспекты и попытаться устранить потенциальные недостатки, с которыми мы можем столкнуться."
 GRN_focus_Stabilizing_Domestic_Short_Comings: "Стабилизация внутренних недостатков"
 GRN_focus_Stabilizing_Domestic_Short_Comings_desc: "Перестройка административной структуры и оптимизация всех государственных услуг в рамках нашего национального правительства позволят нам получить реальное представление о текущей ситуации."
 GRN_focus_Greenland_Armed_Services: "Вооруженные силы Гренландии"
 GRN_focus_Greenland_Armed_Services_desc: "Благодаря обретенной независимости, оборона теперь полностью находится под нашим контролем. У нас не так много ресурсов, но с чего-то же нужно начинать. Верно?"
 GRN_focus_A_New_Chapter: "Новая глава"
 GRN_focus_A_New_Chapter_desc: "С этого дня мы начинаем новую главу. Мы стремимся строить, процветать и улучшать как страну, так и жизнь наших граждан, чтобы проложить путь к светлому будущему для всех, кто хочет увидеть Гренландию и жить в ней."
 GRN_focus_Northern_Political_Lights: "Северное политическое сияние"
 GRN_focus_Northern_Political_Lights_desc: "Благодаря обретенным свободам мы теперь можем открыть двери для тех, кто желает баллотироваться на государственные должности. Конечно, это означает, что нам также придется иметь дело с теми, кто потенциально может злоупотреблять системой. Однако мы — демократическая нация, и поэтому мы будем доверять системе и народу."
 GRN_focus_Atassut_Claims_Victory: "Атассут заявляет о победе"
 GRN_focus_Atassut_Claims_Victory_desc: "До обретения независимости наша политика находилась в застое. Все были сосредоточены только на освобождении от датского ига. Теперь, когда это произошло, мы можем начать прокладывать новый путь. Путь устойчивого укрепления социальных ценностей в сочетании с консервативным подходом к финансам, чтобы обеспечить баланс в нашей стране в будущем."
 GRN_focus_Making_New_Greenlandic_Standards: "Разработка новых гренландских стандартов"
 GRN_focus_Making_New_Greenlandic_Standards_desc: "Реформирование образования с использованием нашего родного языка, увеличение числа учителей и в целом повышение планки возможностей наших учеников значительно расширят потенциал нашей страны."
 GRN_focus_Improving_Medical_Facilities: "Улучшение медицинских учреждений"
 GRN_focus_Improving_Medical_Facilities_desc: "Благодаря улучшению общих процедур закупок, а также усовершенствованию планировки помещений медицинских учреждений, мы можем задать новый темп в оказании медицинской помощи и лечении, обеспечив удобство навигации и доступа к необходимым ресурсам."
 GRN_focus_Casting_Better_Social_Nets: "Как создавать более эффективные социальные сети"
 GRN_focus_Casting_Better_Social_Nets_desc: "Реформирование социальных программ с целью более эффективного распределения ресурсов обеспечит защиту тем членам нашей страны, которые оказались в трудном положении или просто подошли к концу своего жизненного пути."
 GRN_focus_Domestic_Agriculture_Projects: "Проекты отечественного сельского хозяйства"
 GRN_focus_Domestic_Agriculture_Projects_desc: "Обеспечение стабильности отечественного сельского хозяйства означает наличие более надежного источника продовольствия. Это, в сочетании с нашими проектами по борьбе с суровым сельским хозяйством (HFPs \"Harsh Farming Projects\"), будет и впредь приносить пользу и способствовать росту экономики и населения нашей страны."
 GRN_focus_Increasing_Industrial_Development: "Увеличение промышленного развития"
 GRN_focus_Increasing_Industrial_Development_desc: "Постоянный рост и диверсификация нашей экономики позволяют обеспечить более стабильный и надежный подход как к внутренней, так и к потенциальной внешней политике."
 GRN_focus_General_Armaments: "Общие вооружения"
 GRN_focus_General_Armaments_desc: "Небольшие инвестиции в улучшение вооружений как по качеству, так и по общим вопросам закупок означают, что наши оставшиеся вооруженные силы будут лучше справляться с защитой нашей страны и ее граждан."
 GRN_focus_Growing_Power_Production: "Рост производства электроэнергии"
 GRN_focus_Growing_Power_Production_desc: "Улучшение наших внутренних возможностей по производству электроэнергии позволяет нам развивать экономику, а также повышать качество жизни наших граждан за счет дешевой электроэнергии."
 GRN_focus_National_Alumina_Research_Institute: "Национальный научно-исследовательский институт глинозема"
 GRN_focus_National_Alumina_Research_Institute_desc: "Комплекс NARI — это специализированный научно-исследовательский центр по добыче глинозема и других труднодобываемых минералов. Цель — найти способы улучшить и повысить эффективность методов добычи этих минералов. Глинозем в высокой концентрации содержится в бокситовой руде, однако бокситов у нас нет. Но у нас есть множество месторождений полевого шпата, в которых содержание глинозема составляет до 20% от общей массы, и таким образом, более дорогостоящим способом мы можем обеспечить внутренние поставки. Но этого немного, а алюминий используется во многих областях, поэтому мы должны максимально расширить производство в этой сфере."
 GRN_focus_Military_Investment_Package: "Пакет военных инвестиций"
 GRN_focus_Military_Investment_Package_desc: "Этот общий инвестиционный пакет будет направлен на улучшение качества оборудования, а также на повышение заработной платы военнослужащих. Часть средств также зарезервирована для повышения стандартизации учебных объектов там, где это необходимо."
 GRN_focus_Demokraatit_Secures_Victory: "Демократия одержала победу"
 GRN_focus_Demokraatit_Secures_Victory_desc: "Партия «Демократическая партия» долгое время придерживалась почти аутсайдерского подхода к политике в Гренландии. Будучи в целом схожей с двумя основными партиями, она имеет тонкие различия, которые обычно приводят к отступлению в своего рода тенденцию к упадку. \"постоянное третье место\"Однако сегодня ситуация меняется, поскольку благодаря нашей победе в эпоху независимости мы, безусловно, можем улучшить положение страны и ее граждан в меру своих возможностей."
 GRN_focus_Economic_Assimilation_Visas: "Визы для экономической ассимиляции"
 GRN_focus_Economic_Assimilation_Visas_desc: "Использование визовой системы для содействия развитию страны и стабильному росту населения окажет значительную помощь в планировании будущего развития государства."
 GRN_focus_Improved_Community_Programs: "Улучшенные общественные программы"
 GRN_focus_Improved_Community_Programs_desc: "Взаимопонимание между полицией и гражданами, которых она защищает, является важнейшим фактором сплоченности, а не разногласий. Мы должны обеспечить принятие последовательных мер, чтобы большинство придерживалось одной точки зрения, и чтобы в случае возникновения проблем мы не оказались в ситуации, подобной, например, в Америке."
 GRN_focus_Rewriting_Mining_Regulations: "Пересмотр правил горнодобывающей промышленности"
 GRN_focus_Rewriting_Mining_Regulations_desc: "Нормативно-правовые нормы, регулирующие горнодобывающую деятельность, чрезмерно завышены и просто не соответствуют нынешнему состоянию дел в стране. Поэтому нам необходимо пересмотреть подход, чтобы лучше стандартизировать отрасль."
 GRN_focus_Hospice_Care_Funding: "Финансирование хосписной помощи"
 GRN_focus_Hospice_Care_Funding_desc: "Более качественное и целевое финансирование хосписной помощи позволит семьям сосредоточиться на своих делах, не беспокоясь о том, что их пожилые родственники будут заброшены из-за повседневной жизни."
 GRN_focus_Creating_A_Basic_Office_Sector: "Создание базового офисного сектора"
 GRN_focus_Creating_A_Basic_Office_Sector_desc: "Дальнейшая диверсификация нашей экономики означает, что нам необходимо инвестировать в небольшие, но значимые офисные и технологические отрасли, чтобы обеспечить дальнейшее улучшение жизни нашей страны и ее граждан."
 GRN_focus_Expanding_Existing_HFPs: "Расширение существующих программ поддержки здорового образа жизни"
 GRN_focus_Expanding_Existing_HFPs_desc: "Расширение наших текущих проектов по суровому земледелию за счет вертикальных ферм и необходимой инфраструктуры дистилляции для подачи воды с шельфового ледника позволит создать растущий внутренний запас продовольствия, а также внесет свой вклад в достижение нашей цели по освоению внутренних районов континента."
 GRN_focus_Growing_REM_Industries: "Развитие REM-индустрии"
 GRN_focus_Growing_REM_Industries_desc: "Для повышения нашей геостратегической значимости нам необходимо развивать отрасль добычи и переработки редких металлов. Целенаправленное создание горнодобывающих и перерабатывающих предприятий позволит нам использовать эти данные в качестве аргумента при заключении будущих торговых соглашений."
 GRN_focus_Growing_Domestic_Arms_Production: "Рост внутреннего производства вооружений"
 GRN_focus_Growing_Domestic_Arms_Production_desc: "Обеспечение наших военнослужащих вооружением позволяет нам с уверенностью понимать, что наши вооруженные силы могут и будут защищать наши земли от любых сил, совершающих злоупотребления."
 GRN_focus_Expanding_Citizen_Development_Grants: "Расширение программы грантов на развитие для граждан"
 GRN_focus_Expanding_Citizen_Development_Grants_desc: "Путь к гражданству определяется исключительно вкладом в развитие страны, и поэтому мы расширим программу стипендий, чтобы увеличить количество людей, которые смогут пройти этот путь и стать новыми гражданами Гренландии."
 GRN_focus_Siumut_Wins_Once_More: "Симут одержал очередную победу"
 GRN_focus_Siumut_Wins_Once_More_desc: "Одной из партий, дольше всех находящихся у власти, является партия «Сиумут». До обретения независимости партия одержала большинство побед на выборах, и, похоже, она сохраняет свои позиции и после независимости. Сейчас настало время сосредоточиться не только на независимости, но и на улучшении жизни граждан и трудящихся."
 GRN_focus_Encouraging_State_Sanctioned_Immigration: "Поощрение иммиграции, санкционированной государством."
 GRN_focus_Encouraging_State_Sanctioned_Immigration_desc: "Наши показатели внутреннего роста не очень высоки. Если мы хотим заполнить вакансии и обеспечить рост экономики, нам необходимо рассмотреть возможность стабильной иммиграции везде, где это возможно."
 GRN_focus_Immigration_Quotas: "Иммиграционные квоты"
 GRN_focus_Immigration_Quotas_desc: "В условиях устойчивого развития нашей страны нашей главной заботой сейчас является обеспечение населения рабочими местами. Рост экономики не всегда эффективен, когда, как это ни парадоксально, не хватает людей для заполнения вакансий. Поэтому мы начнем пытаться ввести целевые иммиграционные квоты, чтобы гарантировать, что численность населения будет соответствовать масштабам экономики."
 GRN_focus_Expanding_Schooling_Subjects: "Расширение перечня школьных предметов"
 GRN_focus_Expanding_Schooling_Subjects_desc: "Расширение списка факультативных курсов, предлагаемых нашими школами, позволяет учащимся выбирать работу и будущее, которые им интересны. При этом сохраняется возможность совершенствования основных общих навыков, которые помогут нашим ученикам развиваться и быть готовыми к взрослой жизни."
 GRN_focus_Social_Reserve_Funds: "Фонды социальных резервов"
 GRN_focus_Social_Reserve_Funds_desc: "Поскольку численность населения и экономика нашей страны продолжают расти, мы сталкиваемся с трудной задачей по обеспечению баланса между финансированием и надлежащим распределением бюджетных средств среди всех нуждающихся. Поэтому, чтобы свести к минимуму этот дефицит, мы создадим Социальный резервный фонд, который по сути является федеральным резервом для социальных программ. Это должно значительно облегчить жизнь гражданам, нуждающимся в такой социальной защите."
 GRN_focus_Tungsten_Industries: "Вольфрамовая промышленность"
 GRN_focus_Tungsten_Industries_desc: "В центрально-восточных землях находятся залежи вольфрама, готовые к разработке. В связи с этим мы создадим специализированный промышленный комплекс для добычи, переработки и очистки руды в сырьевые слитки или вторичную продукцию, требующую использования этого ресурса."
 GRN_focus_Core_Industries_Complex: "Комплекс основных отраслей промышленности"
 GRN_focus_Core_Industries_Complex_desc: "Возобновление работы старых железорудных шахт, в которых еще есть руда, а также открытие новых шахт позволит нам расширить наши промышленные возможности. С этой целью мы создадим аналогичный промышленный комплекс для переработки добытой руды и удовлетворения потребностей страны."
 GRN_focus_Growing_More_Crops: "Выращивание большего количества сельскохозяйственных культур"
 GRN_focus_Growing_More_Crops_desc: "Благодаря обеспечению постоянно растущего и разнообразного предложения продуктов питания, которое мы надеемся создать благодаря нашим инициативам в области вертикального земледелия, а также заранее спланированной инфраструктуре дистилляции для поддержки этих предприятий, мы теперь можем продолжать стабильные темпы расширения и надеемся, что спрос будет расти в районе шельфового ледника быстрее, чем ожидалось."
 GRN_focus_Naval_Investments: "Военно-морские инвестиции"
 GRN_focus_Naval_Investments_desc: "Развитие наших собственных судостроительных мощностей позволит нам создать военно-морской флот. Если мы сможем создать флот, то сможем обеспечить безопасность наших прибрежных вод, а также закрепиться на международной арене, пусть даже и в небольших масштабах на начальном этапе."
 GRN_focus_Strategic_Stockpiles: "Стратегические запасы"
 GRN_focus_Strategic_Stockpiles_desc: "Создание стратегических запасов позволит иметь резерв доступного огнестрельного оружия для оснащения нашей армии, а при необходимости и самого населения. Конечно, мы надеемся, что до этого никогда не дойдет, но кто знает, какие больные и извращенные умы существуют в этом мире."
 GRN_focus_Polar_Party_Wins: "Победа Полярной партии?"
 GRN_focus_Polar_Party_Wins_desc: "Полярная партия, считающаяся некогда прекратившей своё существование партией, вероятно, является наиболее близким аналогом более традиционной консервативной партии, которую можно найти в Гренландии. Поэтому её победа, хотя и вызывает недоумение, вселяет надежду на стабильность и социальное спокойствие в условиях внешней шумихи, с которой сталкиваются некоторые страны."
 GRN_focus_Family_Subsidies: "Семейные субсидии"
 GRN_focus_Family_Subsidies_desc: "Для стимулирования роста населения внутри страны и снижения чрезмерной зависимости от иммиграции мы создадим специальную субсидию для помощи семьям в первые годы жизни ребенка. Таким образом, основная проблема, обычно связанная с финансовыми возможностями, перестанет быть актуальной. Для предотвращения злоупотреблений мы ограничим использование субсидий только покупками и разместим их на национальной банковской карте стандартного типа."
 GRN_focus_Childcare_Act: "Закон об уходе за детьми"
 GRN_focus_Childcare_Act_desc: "Способность родителей заботиться о своих детях, одновременно пытаясь оплачивать счета и прочее, представляет собой тонкий и зачастую утомительный баланс. Поэтому Закон о детском уходе — это пакет мер, направленный на улучшение и создание детских садов и центров раннего развития, которые будут не только присматривать за детьми, но и обеспечивать им необходимый уход."
 GRN_focus_Foreign_Leasing_Act: "Закон об иностранной аренде"
 GRN_focus_Foreign_Leasing_Act_desc: "Закон о регулировании добычи полезных ископаемых (FLA) представляет собой двухэтапный законодательный акт. Первая часть направлена ​​на улучшение образования и научных исследований для повышения нашего понимания добычи полезных ископаемых и наилучших способов разработки месторождений под нашими землями. Вторая часть, по сути, призвана подтолкнуть иностранные компании к тому, чтобы они делали это за нас или, по крайней мере, заложили основы для того, чтобы мы могли взять это на себя в любой момент, если потребуется."
 GRN_focus_Steeling_Resolve_Act: "Закон о решимости укрепить оборону"
 GRN_focus_Steeling_Resolve_Act_desc: "Законодательство SRA представляет собой целевой инвестиционный пакет, направленный на расширение внутренних поставок железа и угля. Эти важнейшие ресурсы помогут укрепить основу нашей экономики и внутренние производственные возможности как в промышленности, так и в удовлетворении потребностей населения, таких как жилье и государственные учреждения."
 GRN_focus_Expand_Petrochemical_Industries: "Расширение нефтехимической промышленности"
 GRN_focus_Expand_Petrochemical_Industries_desc: "Возможность создать, а тем более расширить, нефтехимическую промышленность в различных ее формах значительно укрепит нашу внутреннюю безопасность и позволит избежать чрезмерного торгового дефицита."
 GRN_focus_Greenlandic_Forestries: "Лесное хозяйство Гренландии"
 GRN_focus_Greenlandic_Forestries_desc: "Создание новых лесных плантаций с помощью уже существующих в стране инициатив по выращиванию деревьев в теплицах и вертикальному земледелию позволит нам развивать и диверсифицировать лесопромышленный сектор."
 GRN_focus_Industrial_Projects: "Промышленные проекты"
 GRN_focus_Industrial_Projects_desc: "Улучшение развития восточного региона, чтобы привести его в соответствие с западным, значительно сократит разрыв между ними, и, следовательно, улучшение промышленного сектора там принесет большую пользу."
 GRN_focus_Eastern_Armaments: "Восточное вооружение"
 GRN_focus_Eastern_Armaments_desc: "Наш проект \"Develop the East\", на мой взгляд, развивается довольно успешно. Создание новых отраслей промышленности всех видов, а также обеспечение иммиграционных мер для трудоустройства и пополнения рабочих мест внутри страны, помогут создать устойчивую экономику и светлое будущее для нашего народа."
 GRN_focus_Defensive_Improvements: "Улучшения в обороне"
 GRN_focus_Defensive_Improvements_desc: "Улучшение нашей способности защищаться от необдуманных вторжений противника станет оплотом нашей национальной безопасности. В конце концов, высадка на остров — дело непростое."
 GRN_focus_Qulleq_Party_Secures_Victory: "Партия Куллек одержала победу"
 GRN_focus_Qulleq_Party_Secures_Victory_desc: "В неожиданном повороте событий партия «Куллек» одержала победу на выборах. Известная как партия, выступающая за промышленность, она ранее называлась «Партия независимости» (\"independence, теперь \") и являлась основной партией, не связанной с первоначальным руководством. Хотя некоторые опасаются, что это приведет к снижению качества жизни ради развития, многие в партии заверяют, что благодаря более благоприятной ситуации в стране качество жизни будет только улучшаться. В любом случае, в ближайшие недели партии придется подтвердить свои слова делом."
 GRN_focus_On_Site_Family_Support: "Поддержка семей на месте"
 GRN_focus_On_Site_Family_Support_desc: "Приводите детей на работу каждый день. Компании постепенно начнут внедрять некоторые ключевые аспекты ухода за детьми, чтобы члены семьи могли продолжать приходить на работу, не опасаясь, что им придется оставить своих детей."
 GRN_focus_Contractual_Labor_Act: "Закон о трудовых договорах"
 GRN_focus_Contractual_Labor_Act_desc: "Закон о трудовых визах (CLA) наделяет администрацию полномочиями оказывать помощь пограничным и иммиграционным службам в поиске подходящих кандидатов на получение трудовых виз. Эти визы позволят въезжать в страну на длительный срок, если кандидаты захотят здесь работать; это не гостевые визы, а лишь расширение уже существующей программы грантов на развитие."
 GRN_focus_Rewriting_The_Tax_Codes: "Переписывание налогового кодекса"
 GRN_focus_Rewriting_The_Tax_Codes_desc: "По своей сути, налоговое законодательство крайне неблагоприятно для бизнеса, и поэтому мы начнем все заново и реформируем его в соответствии с нынешней экономической ситуацией."
 GRN_focus_Building_Up_Domestic_Capital: "Наращивание внутреннего капитала"
 GRN_focus_Building_Up_Domestic_Capital_desc: "Наши золотые рудники также можно дополнить добычей небольших объемов алмазов. Мы можем использовать этот сырьевой капитал, продавая его за границу, для финансирования наших внутренних проектов развития."
 GRN_focus_Securing_Energy_Needs: "Обеспечение энергетических потребностей"
 GRN_focus_Securing_Energy_Needs_desc: "Огромные потребности нашей постоянно развивающейся страны являются краеугольным камнем самого развития. У нас есть ресурсы, поэтому нам должно быть позволено использовать их по своему усмотрению."
 GRN_focus_Military_Production_Means: "Военное производство"
 GRN_focus_Military_Production_Means_desc: "Наша способность защищать не только наших граждан, но и природные богатства, а также постоянно улучшающееся качество их жизни имеет первостепенное значение. Мы не можем почивать на лаврах, если знаем, что в любой момент какая-либо страна может попытаться растратить их в своих злонамеренных целях."
 GRN_focus_Continued_Crop_Diversification_Efforts: "Продолжение усилий по диверсификации сельскохозяйственных культур"
 GRN_focus_Continued_Crop_Diversification_Efforts_desc: "Мы продолжаем использовать центры высокопроизводительного семеноводства, созданные еще до обретения независимости, а также национальное хранилище семян продолжает расти и становиться все более разнообразным по ассортименту выращиваемых культур. Наша страна будет процветать благодаря постоянному развитию центров дистилляции, поддерживающих отечественные сельскохозяйственные предприятия в тех местах, где, как многие считали, растения никогда не смогут расти."
 GRN_focus_Expanded_Eastern_Industries: "Расширение восточной промышленности"
 GRN_focus_Expanded_Eastern_Industries_desc: "Рабочие, предприятия и так далее. Это цикл развития, который мы надеемся продолжить и использовать в большей степени на востоке, чем на западе, поскольку разница между ними, по крайней мере, с точки зрения численности населения, кажется довольно существенной. Сосредоточившись больше на востоке, мы надеемся сократить общее неравенство на национальном уровне и создать более сплоченную распределенную экономику."
 GRN_focus_Economic_Automation_Act: "Закон об экономической автоматизации"
 GRN_focus_Economic_Automation_Act_desc: "Закон об экономической автоматизации (EAA) — это законодательный акт, призванный обсудить и в конечном итоге выбрать, какой экономический сектор мы хотим полностью перевести на автоматизацию. Таким образом, работники смогут освободиться для трудоустройства в других секторах, и, будем надеяться, наша общая экономическая ситуация стабилизируется благодаря сокращению дефицита рабочей силы по отношению к имеющимся рабочим местам."
 GRN_focus_Inuit_Ataqatigiit_Election_Victory: "Победа инуитов Атакатигиит на выборах"
 GRN_focus_Inuit_Ataqatigiit_Election_Victory_desc: "Партия «Исламское государство» (ИА) в гренландской политике воспринимается как своего рода аутсайдер, занимающий промежуточное положение между распространенным демократическим социалистическим мышлением и более традиционным рыночным социализмом. Партия разделяет некоторые марксистские принципы, но, похоже, больше придерживается титовского баланса между экономическими переговорами между блоками стран и социальной сплоченностью, избегая прямого выбора стороны. Хотя, конечно, Гренландия была членом НАТО, это не обязывает ее экономически подчиняться НАТО."
 GRN_focus_Greencare_Act: "Закон о защите окружающей среды (Greencare Act)"
 GRN_focus_Greencare_Act_desc: "Закон о защите окружающей среды (Greencare Act) — это общий бюджетный законопроект, направленный на повышение заработной платы медицинского персонала, улучшение качества оборудования и обучения, а также на расширение и/или открытие новых учреждений там, где это необходимо."
 GRN_focus_Steeled_Veins_Act: "Закон о стальных венах"
 GRN_focus_Steeled_Veins_Act_desc: "Уголь и железо – жизненно важные ресурсы любой современной экономики. Хотя сам уголь уже не так полезен, как раньше, учитывая наличие альтернативных источников энергии, мы не можем просто игнорировать количество и, в некоторых районах, качество наших месторождений угля и железа. Поэтому мы начнем инвестировать в небольшие предприятия по добыче и переработке, чтобы увеличить текущие запасы для внутреннего и потенциального экспорта."
 GRN_focus_Pro_Mining_And_Miners_Act: "Закон в поддержку горнодобывающей промышленности и горняков"
 GRN_focus_Pro_Mining_And_Miners_Act_desc: "Законопроект PMMA призван улучшить качество и количество добычи полезных ископаемых, а также осуществить стратегическую автоматизацию для повышения общего статуса шахтеров путем ограничения частоты и количества работников, необходимых на шахте одновременно."
 GRN_focus_Feldspar_Extractions_Act: "Закон о добыче полевого шпата"
 GRN_focus_Feldspar_Extractions_Act_desc: "Согласно текущим данным геологической разведки, единственным реальным источником оксидов алюминия являются месторождения полевого шпата на западе. Хотя этот минерал обычно содержит более 20% своего веса в виде оксида алюминия, он не является наиболее коммерчески выгодным источником. Поэтому добыча должна полностью перейти под государственный контроль до тех пор, пока какие-либо научные открытия не изменят ситуацию. В любом случае, алюминий необходим нашей экономике, и поэтому мы будем инвестировать в постепенное развитие предприятий по добыче полевого шпата и переработке необходимых материалов из этого минерала."
 GRN_focus_Feeding_The_People_Act: "Закон о продовольственной безопасности"
 GRN_focus_Feeding_The_People_Act_desc: "Развитие нашего внутреннего производства продуктов питания за пределами основных рыболовных промыслов — отличный способ роста экономики и населения. Создание национального хранилища семян позволило нам сделать Гренландию образцом для развития методов тепличного и вертикального земледелия в сельскохозяйственной науке."
 GRN_focus_The_Continual_Industry_Act: "Закон о непрерывной трудовой деятельности"
 GRN_focus_The_Continual_Industry_Act_desc: "Развитие нашей экономики означает совершенствование нашей производственной и промышленной базы в целом. Благодаря небольшим инвестициям в первичные и вторичные отрасли промышленности мы можем и дальше наблюдать беспрецедентный рост и развитие."
 GRN_focus_Greenland_Technology_Center: "Технологический центр Гренландии"
 GRN_focus_Greenland_Technology_Center_desc: "Вложение средств в НИОКР, направленные на общее совершенствование и поддержание нашей экологической среды, будет иметь первостепенное значение для дальнейших усилий в области развития."
 GRN_focus_Arming_The_Nation: "Вооружение нации"
 GRN_focus_Arming_The_Nation_desc: "Наша оборона — ключ к сохранению нашей независимости. Если мы хотим оставаться свободными, мы должны разработать средства для этого."
 GRN_focus_Silver_And_Gold_Act: "Закон о серебре и золоте"
 GRN_focus_Silver_And_Gold_Act_desc: "Укрепление нашей внутренней безопасности за счет создания ценных козырей на международных переговорах позволит нам сдерживать потенциальных захватчиков немного дольше, чем если бы мы этого не делали. В связи с этим мы планируем начать ограниченную добычу палладия и некоторых ценных редкоземельных металлов, к которым у нас есть доступ."
 GRN_focus_Naleraq_Elective_Victory: "Победа на выборах в Налераке"
 GRN_focus_Naleraq_Elective_Victory_desc: "В условиях обретения страной независимости неудивительно, что победу одержала партия Налерака, ориентированная на национализм. Ее политика направлена ​​на прямое укрепление и доказательство добродетели Гренландии в отношении ее самопровозглашенного суверенитета. Хотя некоторые задаются вопросом, не является ли это слишком поспешным шагом к чему-то более враждебному по своей природе."
 GRN_focus_Efficiency_Education_Courses: "Курсы повышения эффективности обучения"
 GRN_focus_Efficiency_Education_Courses_desc: "Программа EE — это образовательный инвестиционный проект, цель которого — обучать и экспериментировать с новыми способами передачи, хранения и управления энергопотреблением в условиях холодного климата. Повышение эффективности в этих областях позволяет сделать нашу экономику более экономически выгодной, не беспокоясь о проблемах с занятостью."
 GRN_focus_Family_Planning_And_Assistance_Board: "Совет по планированию семьи и оказанию помощи"
 GRN_focus_Family_Planning_And_Assistance_Board_desc: "FPAB — это государственное учреждение, призванное создавать, поддерживать и развивать семьи нации. Наше население невелико, и мы не хотим наводнять страну случайными иммигрантами, если можем просто должным образом позаботиться о себе сами."
 GRN_focus_Family_Homes_Act: "Закон о семейных домах"
 GRN_focus_Family_Homes_Act_desc: "Закон о семейном жилье (Family Homes Act, FHA) — это программа, разработанная для того, чтобы семейное жилье доставалось нуждающимся семьям. Мы гарантируем, что никто не будет злоупотреблять ограниченным жилищным фондом, которым мы располагаем в стране."
 GRN_focus_Urban_Planning_Commission: "Комиссия по городскому планированию"
 GRN_focus_Urban_Planning_Commission_desc: "UPC — это государственное агентство, созданное для предварительного планирования и начала фундаментных работ для будущих жилищных проектов и разработки потенциальных стилей городского планирования по мере заселения этих новых домов людьми, которым затем потребуются рабочие места и местные цепочки поставок."
 GRN_focus_Rapid_Agriculture_Expansions: "Быстрое расширение сельского хозяйства"
 GRN_focus_Rapid_Agriculture_Expansions_desc: "Законопроект RAE направлен на расширение нашей сельскохозяйственной базы и совершенствование методов производства, чтобы мы могли и дальше обеспечивать продовольствием наших граждан и способствовать росту населения. Конечно, нам потребуется отбирать и привлекать специалистов для обучения, а затем передавать эти ресурсы местным гражданам, но пока мы можем выдавать им временные визы для развития."
 GRN_focus_Industry_Development_Act: "Закон о развитии промышленности"
 GRN_focus_Industry_Development_Act_desc: "Мы будем инвестировать в наш производственный и общий промышленный сектор, чтобы создать надежную, но диверсифицированную экономику. Небольшие улучшения и проекты будут постепенно наращиваться по мере роста нашего населения и потенциального иммигрантского контингента, который мы рассматриваем."
 GRN_focus_Military_Forces_Investment_Act: "Закон об инвестициях в вооруженные силы"
 GRN_focus_Military_Forces_Investment_Act_desc: "Этот пакет бюджетных расходов и проект по разработке вооружений будут работать рука об руку с развитием наших наземных и воздушных возможностей, поскольку мы стремимся разрабатывать собственные проекты для некоторых сложных видов техники."
 GRN_focus_Western_Strategic_Autarky_Act: "Закон о западной стратегической автаркии"
 GRN_focus_Western_Strategic_Autarky_Act_desc: "Закон о национальной автаркии — это двухэтапный план по созданию стратегических предприятий по добыче полезных ископаемых и других ресурсов для обеспечения ограниченных, но стабильных внутренних поставок в случае, если какая-либо страна предпримет попытки причинить нам вред посредством военно-морской или политической блокады. Первый этап плана известен как Закон о стратегической автаркии Запада (WSAA). Он предусматривает ограниченную добычу железной руды, полевого шпата для производства алюминия, а также нефти и угля для энергетических и каучуковых предприятий."
 GRN_focus_Eastern_Strategic_Autarky_Zone: "Восточная стратегическая зона автаркии"
 GRN_focus_Eastern_Strategic_Autarky_Zone_desc: "Второй этап Закона о национальной автаркии включает в себя развитие добычи нефти и угля для общего энергетического, а также промышленного использования. Мы также начнем ограниченную добычу редкоземельных элементов, а также лития и аналогичных технологически ориентированных минералов. Похоже, что наши внутренние ресурсы и козыри в переговорах с внешними партнерами начинают складываться в нашу пользу."
 GRN_focus_Militarize_Greenland_Party_Wins: "Милитаризация побед партии в Гренландии?"
 GRN_focus_Militarize_Greenland_Party_Wins_desc: "Хотя большинство партий в Гренландии довольно похожи друг на друга, никто не ожидал военного вмешательства, поскольку, по-видимому, совершенно неожиданная и недавно сформированная партия MGP каким-то образом одержала победу. Эта партия, по сути, являющаяся политическим продолжением недавно сформированных Вооруженных сил Гренландии (ASG), сосредоточена на национальной обороне и возможности получения средств для защиты нашей страны. Безусловно, это своего рода замкнутый круг, но многие не могут не задаться вопросом, не было ли это подсознательной потребностью, которую большинство желало удовлетворить после обретения независимости от Дании."
 GRN_focus_Military_Organized_Education_Act: "Закон об организованном военном образовании"
 GRN_focus_Military_Organized_Education_Act_desc: "Необходимо кардинально перестроить систему образования, включив в нее классы, предметы и общую структуру, придав ей военный характер. Раннее обучение дисциплине, организации, а также умению слушать, отдавать приказы и передавать информацию имеет решающее значение не только для запоминания, но и для жизни после окончания учебы и потенциальной службы."
 GRN_focus_Production_Critical_Resources_Act: "Закон о критически важных для производства ресурсах"
 GRN_focus_Production_Critical_Resources_Act_desc: "Сталь и энергия – эти два основополагающих столпа любого индустриального общества нам нужны больше всего. Будь то для гражданских или военных нужд, мы будем инвестировать и расширять производство, чтобы обеспечить удовлетворение наших внутренних и оборонных потребностей."
 GRN_focus_Advanced_Materials_And_Minerals_Act: "Закон о передовых материалах и минералах"
 GRN_focus_Advanced_Materials_And_Minerals_Act_desc: "Законопроект AMMA направлен на расширение деятельности в сфере добычи полезных ископаемых, считающихся ресурсами, необходимыми для передового производства. Яркими примерами являются разработки в области технологий и редкоземельных элементов."
 GRN_focus_Army_Armaments_Improvement_Act: "Закон об улучшении вооружения армии"
 GRN_focus_Army_Armaments_Improvement_Act_desc: "Общее совершенствование нашей армии имеет первостепенное значение для любой сухопутной обороны, которой мы располагаем. В связи с этим мы будем инвестировать в расширение наших производственных мощностей, а также в пассивное финансирование НИОКР на этих объектах для тестирования новых разработок, где это возможно."
 GRN_focus_Air_Force_Advancements_Act: "Закон о повышении квалификации военнослужащих ВВС"
 GRN_focus_Air_Force_Advancements_Act_desc: "Финансирование производственных мощностей для создания хоть какой-то формы военно-воздушных сил будет лучше, чем бездействие. В качестве бонуса мы выделим немного средств на НИОКР, чтобы попытаться запустить разработку новых самолетов для этого рода войск."
 GRN_focus_Military_Garden_Act: "Закон о военных садах"
 GRN_focus_Military_Garden_Act_desc: "Выделение части медленно, но неуклонно расширяющегося сельскохозяйственного комплекса, каким являются пункты выдачи продовольствия для нужд военнослужащих, безусловно, является полезным шагом. Это не только позволяет отделить гражданские потребности от военных, но и способствует контролю качества и количества продуктов питания для наших военнослужащих."
 GRN_focus_Bolstering_Naval_Assets: "Укрепление военно-морских сил"
 GRN_focus_Bolstering_Naval_Assets_desc: "Наша береговая линия огромна, и поэтому нам необходимо наращивать или, по крайней мере, создавать корабли, способные преодолевать умеренные расстояния. После армии военно-морской флот является нашей первой настоящей линией обороны."
 GRN_focus_Civilian_Improvements_Act: "Закон о гражданских улучшениях"
 GRN_focus_Civilian_Improvements_Act_desc: "Для укрепления и поддержания крупной армии нам также необходима достойная гражданская экономика, способная всё это поддерживать. Поэтому мы будем реализовывать целенаправленные проекты развития, чтобы гарантировать, что наши военные потребности не будут слишком сильно превышать возможности нашей реальной экономики."
 GRN_focus_Militarized_Economy_Act: "Закон о милитаризированной экономике"
 GRN_focus_Militarized_Economy_Act_desc: "Этот закон представляет собой всеобъемлющий пересмотр подхода к организации и управлению экономикой нашей страны. Заблаговременно организовав её с учётом потенциально высоких потребностей в рабочей силе для военных нужд, мы сможем сосредоточиться на более эффективной интеграции технологий и методов производства, что значительно сократит потребность в рабочей силе для производства военных вооружений. Это, в свою очередь, высвободит рабочую силу и потенциальные кадры для гражданской экономики и наших вооруженных сил."
 GRN_focus_Greenland_Monarchist_Party_Victory: "Победа Гренландской монархической партии"
 GRN_focus_Greenland_Monarchist_Party_Victory_desc: "Партия монархистов Гренландии, также известная как Партия Дома Гренландии, — это политическая партия, стремящаяся уважать и перенимать очень долгую историю пребывания Гренландии под датской монархией. Таким образом, партия ставит перед собой цель интегрировать существующую парламентскую систему в достаточно либеральную конституционную монархию. Конечно, значительная часть людей находится в замешательстве, но значительная часть, или, по крайней мере, достаточно большая для победы на выборах, считает, что политическая стабильность в Дании является ключом к тому, что мы можем сделать здесь, у себя дома, для реального развития и роста нашей страны."
 GRN_focus_Education_Investments_Act: "Закон об инвестициях в образование"
 GRN_focus_Education_Investments_Act_desc: "Программа EIA предусматривает увеличение целевых расходов для улучшения оснащения и инвестирования в повышение качества образования, а также в инновационные подразделения в отдельных учебных заведениях. Мы надеемся повысить эффективность нашей страны и продолжать развиваться и адаптировать наши возможности к постоянно возрастающей суровости окружающей среды."
 GRN_focus_Medical_Research_Initiatives: "Инициативы в области медицинских исследований"
 GRN_focus_Medical_Research_Initiatives_desc: "План МРТ предусматривает выделение отдельного финансирования для нового специализированного отдела в рамках наших ведущих медицинских учреждений. Этот новый отдел будет называться Отделом медицинских разработок (MDD). MDD будет отвечать за тестирование и поиск новых способов продвижения наших знаний и понимания медицинской науки, а также за обеспечение тестирования нового оборудования и процедур с помощью полностью волонтерской программы."
 GRN_focus_Public_Security_And_Safety_Act: "Закон об общественной безопасности и защите"
 GRN_focus_Public_Security_And_Safety_Act_desc: "Наши граждане должны иметь возможность жить без страха. Благодаря принятому новому закону будет выделено финансирование не только на программы работы с населением, но и на повышение стандартов оценки потенциальных кандидатов на работу, а также на программу обучения для будущих полицейских. Помните, что спокойный день — это хороший день, и хороший день для вас — это хороший день для общества."
 GRN_focus_Agriculture_Advancements_Act: "Закон о развитии сельского хозяйства"
 GRN_focus_Agriculture_Advancements_Act_desc: "Опираясь на нашу постоянно расширяющуюся программу HRP, мы продолжим инвестировать в теплицы и вертикальное земледелие, где это возможно. В конце концов, безопасность и стабильность нашей страны зависят от обеспечения разнообразного и стабильного продовольственного снабжения."
 GRN_focus_Economic_Strengthening_Act: "Закон об укреплении экономики"
 GRN_focus_Economic_Strengthening_Act_desc: "Развитие экономики в целом означает повышение уровня жизни всей нации косвенно или как побочный эффект, в зависимости от вашего циничного отношения или просто общего взгляда на жизнь. Независимо от того, хотим ли мы улучшить жизнь наших граждан, мы должны инвестировать в бизнес и отрасли, чтобы диверсифицировать и расширить ассортимент товаров и услуг, с которыми наши люди смогут столкнуться и которыми смогут пользоваться в течение своей жизни."
 GRN_focus_Petrochemical_Development_Efforts: "Усилия по развитию нефтехимической отрасли"
 GRN_focus_Petrochemical_Development_Efforts_desc: "Нефтехимическая промышленность — один из самых влиятельных и разнообразных секторов экономики в современную эпоху, не говоря уже о том, что её влияние ощущается практически в повседневной жизни. Поэтому мы должны взять на себя ответственность и развивать собственный сектор, если хотим действительно иметь сильную и диверсифицированную экономику. Способность синтезировать такие вещества, как каучук и другие ценные химические вещества или материалы, практически равнозначна вопросу национальной безопасности."
 GRN_focus_Lithium_Expansion_Act: "Закон о расширении использования лития"
 GRN_focus_Lithium_Expansion_Act_desc: "Инвестиции в добычу важнейших ресурсов имеют первостепенное значение в условиях растущего влияния технологий и других современных инноваций по мере дальнейшего развития нашей страны. У нас есть внутренние месторождения таких ресурсов, как редкоземельные элементы, литий и другие полезные ископаемые, необходимые для технологического развития. Поэтому мы начнем расширять и развивать добычу, чтобы удовлетворить внутренние потребности и, возможно, использовать полученные ресурсы в будущих торговых соглашениях."
 GRN_focus_Royal_Military_Development_Efforts: "Королевские усилия по развитию военной сферы"
 GRN_focus_Royal_Military_Development_Efforts_desc: "Программа RMD представляет собой общий инвестиционный пакет, направленный на повышение качества разрабатываемого оборудования для армии и флота, а также на обеспечение новых стандартов обучения в отношении постоянно развивающегося оборудования."
 GRN_focus_Establishing_The_Kingdom: "Создание Королевства"
 GRN_focus_Establishing_The_Kingdom_desc: "Завершив все приготовления, мы готовы официально переименовать страну в Королевство Гренландия. Народ ликует и сплочен, и мы полны решимости создать процветающее и гордое будущее для всех наших граждан."
 GRN_focus_Armed_Services_Of_Greenland: "Вооруженные силы Гренландии"
 GRN_focus_Armed_Services_Of_Greenland_desc: "После обеспечения нашей независимости нам теперь необходимо позаботиться о собственной национальной обороне. Нам придётся, по сути, начинать с нуля и создать систему, способную защитить обширные водные, сухопутные и воздушные территории, находящиеся под нашим контролем."
 GRN_focus_The_Frozen_Army: "Замороженная армия"
 GRN_focus_The_Frozen_Army_desc: "Наши земли холодные, замерзшие и труднопроходимые практически в любое время года. Мы должны и будем перестроить нашу армию таким образом, чтобы она воспринимала эти условия как игровую площадку, а не как вызов."
 GRN_focus_Training_Facilities_And_Standards: "Учебные помещения и стандарты"
 GRN_focus_Training_Facilities_And_Standards_desc: "Для создания полноценной армии мы должны создать и обустроить учебные центры, а также установить приемлемые стандарты, определяющие качества настоящего солдата. Эти стандарты должны быть разработаны с учетом условий нашей страны, если мы хотим по-настоящему защитить наших граждан."
 GRN_focus_Setting_Equipment_Standards: "Установление стандартов оборудования"
 GRN_focus_Setting_Equipment_Standards_desc: "Создав единый стандарт оснащения, мы сможем обеспечить единообразие как в подготовке, так и в логистике наших солдат."
 GRN_focus_Securing_Domestic_Smallarms: "Обеспечение безопасности отечественного стрелкового оружия"
 GRN_focus_Securing_Domestic_Smallarms_desc: "Создание собственных мощностей по производству стрелкового оружия и аналогичной пехотной техники позволит нам повысить боеспособность и готовность нашей армии."
 GRN_focus_Crude_Combat_Designs: "Примитивные боевые конструкции"
 GRN_focus_Crude_Combat_Designs_desc: "Эти CCD — это, по сути, образцы техники типа \"rattle me bones\". Они до смешного примитивны, но все это отечественные модели. Мы можем использовать это и, возможно, закупить немного техники других стран, чтобы провести испытания и надлежащие проектные работы, чтобы гарантировать, что по мере наращивания нашей армии она действительно сможет использовать технику, созданную для современных боевых действий."
 GRN_focus_Vehicle_Manufacturing_Plants: "Заводы по производству автомобилей"
 GRN_focus_Vehicle_Manufacturing_Plants_desc: "Имея в своем распоряжении базовые знания о конструкции транспортных средств, мы сможем производить эти учебные манекены и использовать накопленный опыт для проектирования и создания потенциального бронированного ядра для нашей армии."
 GRN_focus_Institute_For_Army_Developments: "Институт развития армии"
 GRN_focus_Institute_For_Army_Developments_desc: "Поскольку наша армия практически невелика по численности, мы должны вкладывать значительные средства в развитие и совершенствование всех аспектов нашей армейской службы. Ради страны, народа и личного состава, служащего в этой службе."
 GRN_focus_Frozen_Battlefield_Doctrine: "Доктрина замороженного поля боя"
 GRN_focus_Frozen_Battlefield_Doctrine_desc: "Наша армия, вероятно, никогда не достигнет уровня европейских вооруженных сил. Однако мы можем защищаться и обороняться. Используя наш климат и родину в качестве идеального поля боя, мы можем спровоцировать любую вражескую силу, агрессивную или нет, на нападение. Они думают, что мы будем легкой добычей? Что ж, посмотрим, что будет, когда они придут сюда и попытаются сказать нам это в лицо."
 GRN_focus_FBD_Leadership_Promotions: "FBD Leadership Promotions"
 GRN_focus_FBD_Leadership_Promotions_desc: "Для укрепления и начала реорганизации армии в соответствии с этой новой доктриной нам понадобятся лидеры, которые действительно хотят ее внедрить и понимают идеи и концепции, которые она закладывает. Поэтому мы будем продвигать по службе преданный своему делу генеральный штаб армии, чтобы он мог лучше руководить и реализовывать эти реформы."
 GRN_focus_From_Field_To_Staff_Command: "От полевого командования к штабному командованию"
 GRN_focus_From_Field_To_Staff_Command_desc: "После повышения полевых командиров мы понимаем, что этим несчастным необходимо также понимать более широкую административную структуру. Поэтому их полевые подразделения будут дополнены должностями в генеральном штабе до тех пор, пока мы не сможем обучить и повысить в звании других достойных офицеров, чтобы они могли двигаться в этом новом направлении."
 GRN_focus_Frozen_Warfare_Training_Program: "Программа подготовки к ведению боевых действий в условиях заморозки"
 GRN_focus_Frozen_Warfare_Training_Program_desc: "#VALUE!"
 GRN_focus_Polar_Logistics: "Полярная логистика"
 GRN_focus_Polar_Logistics_desc: "Предположение о том, что боевые действия всегда будут происходить на нашем острове, хотя и не является лучшим методом, безусловно, представляет собой более надежный способ защиты нашей страны. В связи с этим мы начнем совершенствовать и улучшать нашу логистическую систему, чтобы облегчить ведение боевых действий в экстремальных погодных условиях."
 GRN_focus_General_Improvement_Programs: "Программы общего улучшения"
 GRN_focus_General_Improvement_Programs_desc: "Защита нашего острова, безусловно, является нашим главным приоритетом, однако как мы можем защитить наш остров, если мы практически ничего не знаем о боевых действиях вокруг нас? Мы должны обеспечить сбалансированное и всестороннее совершенствование нашей армии, чтобы она была готова и способна справиться с как можно большим количеством различных ситуаций."
 GRN_focus_GIP_Leadership_Promotions: "Продвижение по службе в рамках программы GIP Leadership Promotions"
 GRN_focus_GIP_Leadership_Promotions_desc: "Для обеспечения нового пути развития нашей армии потребуются руководящие должности полевых офицеров и генералов. Поэтому мы будем искать лучших кандидатов, способных помочь продвинуть этот подход к достижению новых стандартов качества."
 GRN_focus_General_Staff_Roles: "Должности Генерального штаба"
 GRN_focus_General_Staff_Roles_desc: "Хотя наша армия невелика, нам пока придётся полагаться на тех, кому мы только что поручили полевое командование, и на их административные обязанности."
 GRN_focus_Artillery_Corps_Specialist: "Специалист артиллерийского корпуса"
 GRN_focus_Artillery_Corps_Specialist_desc: "Развитие и специализация артиллерийских операций как в оборонительных, так и в наступательных целях означает, что мы сможем нанести противнику больший ущерб как личным составам, так и моральному духу, чем он нам. Но артиллерию трудно перемещать, а легко перемещаемые орудия стоят дорого. Нам необходимо найти способы улучшить предотвращение потерь, если мы хотим добиться реального эффекта от такого подхода к тактическому планированию."
 GRN_focus_Clear_Skys_Project: "Проект «Чистое небо»"
 GRN_focus_Clear_Skys_Project_desc: "Программа CSP — это специализированная программа разработки зенитной техники, призванная обеспечить, чтобы боеспособность наших солдат не зависела исключительно от того, решит ли противник использовать свою авиацию или нет. Самолеты — это дорого, хотя для рядового солдата это может быть интересной новинкой, но не для всех."
 GRN_focus_Army_Officer_Training_Corps: "Корпус подготовки офицеров армии"
 GRN_focus_Army_Officer_Training_Corps_desc: "Программа подготовки офицеров запаса (AOTC) — это кульминация и результат самоотверженной работы персонала, стремящегося стать лидерами как в тактическом, так и в стратегическом смысле. Наша страна невелика, поэтому мы должны развивать и искоренять любые вредные привычки, прежде чем мы достигнем уровня, когда естественное укоренение сможет закрепиться."
 GRN_focus_Navy_Of_Greenland: "Военно-морской флот Гренландии"
 GRN_focus_Navy_Of_Greenland_desc: "Наш флот состоит всего лишь из рыболовецких судов и патрульных кораблей. Если мы хотим хотя бы задуматься о защите наших прибрежных вод, то должны обеспечить наличие флота, способного справляться с такими нестабильными условиями."
 GRN_focus_Naval_Research_Institute: "Военно-морской научно-исследовательский институт"
 GRN_focus_Naval_Research_Institute_desc: "Создание Военно-морского научно-исследовательского института Итиллек позволит нам развивать и расширять наши военно-морские знания и практическое применение в военно-морском флоте. Этот краеугольный камень развития позволит нам создать флот, который мы хотим, и обеспечить надлежащую защиту наших вод от иностранной агрессии."
 GRN_focus_Nuuk_Naval_Shipyards: "Нуукские военно-морские верфи"
 GRN_focus_Nuuk_Naval_Shipyards_desc: "Развитие региональных верфей в столице позволит нам строить новые суда как для военных, так и для потенциальных гражданских целей."
 GRN_focus_Expanding_The_Design_Department: "Расширение отдела дизайна"
 GRN_focus_Expanding_The_Design_Department_desc: "Создание стратегически важных военно-морских верфей вблизи NRI на юге страны позволит нам улучшать, проектировать и испытывать военно-морские суда, обеспечивая нашим флотам наилучшие возможные результаты. Это также поможет лучше модернизировать существующие классы кораблей и, по возможности, переоборудовать их под более современные конструкции."
 GRN_focus_Tasiilaq_Shipyards_Complex: "Судостроительный комплекс Тасиилак"
 GRN_focus_Tasiilaq_Shipyards_Complex_desc: "Сбалансированное распределение общих военно-морских разработок между стратегическими конечными точками позволяет нам обеспечивать материально-техническую поддержку и развертывать наши флоты там, где это необходимо, по всей территории нашего острова."
 GRN_focus_Rough_Raft_Designs: "Простые конструкции плотов"
 GRN_focus_Rough_Raft_Designs_desc: "Для создания и развертывания хоть каких-то военно-морских сил нам потребуется приложить дополнительные усилия в области исследований и разработок, чтобы в будущем приобрести и попытаться построить реальные образцы."
 GRN_focus_Small_Surface_Fleet_Doctrine: "Доктрина малого надводного флота"
 GRN_focus_Small_Surface_Fleet_Doctrine_desc: "В целом, у нашей страны недостаточно людских ресурсов для размещения большого количества кораблей. Поэтому мы начнем оснащать и разрабатывать нашу военно-морскую доктрину, ориентируясь на надводные суда, но меньшего калибра. В основном, мы сделаем их более модульными и адаптируемыми, но не больше, чем, скажем, эсминец, из-за проблем с обучением и численностью личного состава."
 GRN_focus_Corvette_Design_Department: "Конструкторский отдел Corvette"
 GRN_focus_Corvette_Design_Department_desc: "Первоначальная программа нашей доктрины SSF (Sustainable Solid Forces) включает в себя разработку конструкторского отдела корветов. Этот отдел будет заниматься проектированием, испытаниями и усовершенствованием инноваций, связанных со стандартным типом корпуса."
 GRN_focus_Small_Vessel_Fleet_Organization: "Организация флота малых судов"
 GRN_focus_Small_Vessel_Fleet_Organization_desc: "Наши малые флоты (SVF) будут сформированы вокруг трех основных типов кораблей: корветов, фрегатов и эсминцев. Эти три класса судов лучше всего подходят для комплектования экипажей, адаптации и создания новых, динамичных конструкций, что позволит нашим флотам наносить серьезный урон силам противника."
 GRN_focus_Submersival_Fleet_Doctrine: "Доктрина подводного флота"
 GRN_focus_Submersival_Fleet_Doctrine_desc: "Подводные лодки — они малозаметны и не слишком требовательны к численности личного состава. Однако, если их правильно организовать, подводные лодки обладают очень большой огневой мощью. От противокорабельных ракет до старых добрых торпед — мы можем сделать гораздо больше, используя гораздо меньше ресурсов."
 GRN_focus_Attack_Submarine_Pillar: "Столб ударной подводной лодки"
 GRN_focus_Attack_Submarine_Pillar_desc: "Первостепенной задачей по укреплению фундамента нашего военно-морского флота является создание ударных подводных лодок. Разработанные в основном для применения тактики прямого нападения, такой как торпедная и минная война, ударные подводные лодки станут орудием нашего флота."
 GRN_focus_Missile_Submarine_Pillar: "Опора ракетной подводной лодки"
 GRN_focus_Missile_Submarine_Pillar_desc: "Вторым столпом нашей военно-морской безопасности являются подводные лодки ракетного класса. Ракеты — это мощное оружие, но и довольно дорогостоящее. Нам необходимо улучшить и повысить эффективность боевых возможностей этого столпа военно-морского флота, если мы хотим эффективно противостоять иностранным противникам на море."
 GRN_focus_Naval_Command_Corps: "Военно-морской командный корпус"
 GRN_focus_Naval_Command_Corps_desc: "Нашему флоту необходим командный аппарат, и сегодня мы именно его и создаём. Это только начало, и дальше мы можем только двигаться вперёд. Надеюсь."
 GRN_focus_Greenlandic_Air_Force: "Военно-воздушные силы Гренландии"
 GRN_focus_Greenlandic_Air_Force_desc: "Небо над нашим островом облачное, холодное и безжизненное. Мы должны придумать, как создать и развить достаточные военно-воздушные силы для защиты нашего воздушного пространства."
 GRN_focus_West_Craft_Manufacturing: "West Craft Manufacturing"
 GRN_focus_West_Craft_Manufacturing_desc: "Завод по производству авиационной техники West готов производить и испытывать образцы для наших ВВС там, где это возможно. Мы надеемся использовать этот новый промышленный комплекс для оснащения и подготовки наших ВВС к защите нашего неба."
 GRN_focus_Preparing_Air_Institute_Manufacturing: "Подготовка к работе Института производства воздуха"
 GRN_focus_Preparing_Air_Institute_Manufacturing_desc: "Возможность производить и испытывать летательные аппараты имеет первостепенное значение для обучения и инноваций. Мы разместим производственные мощности рядом с планируемым Институтом авиационных исследований, чтобы упростить логистику и планирование разработки новых конструкций и испытаний технологий."
 GRN_focus_Tingmiarmit_Air_Research_Institute: "Научно-исследовательский институт воздушных исследований Тингмиармита"
 GRN_focus_Tingmiarmit_Air_Research_Institute_desc: "TARI — это организация, занимающаяся разработкой и внедрением инноваций в области авиации и возможностей воздушного боя. Хотя наша страна довольно большая, она в то же время и небольшая, и поэтому мы должны посвятить эти первые годы специализации на создании подлинной воздушной доктрины и обеспечении безопасности воздушного пространства от вражеских сил."
 GRN_focus_Infrequent_Flyer_Designs: "Нечастые варианты дизайна рекламных листовок"
 GRN_focus_Infrequent_Flyer_Designs_desc: "Недорогие конструкции, предназначенные для выполнения поставленных задач. Не самые лучшие, но, безусловно, отправная точка для серьезного развития наших военно-воздушных сил."
 GRN_focus_Air_Supremacy_Prioritization: "Приоритет превосходства в воздухе"
 GRN_focus_Air_Supremacy_Prioritization_desc: "Противник может превзойти наш флот, но ему ни в коем случае нельзя позволять доминировать в нашем небе. Мы должны полностью сосредоточиться на разработке и внедрении инноваций в области прямого воздушного боя. Обеспечение этого позволит нам делать все, что мы захотим, как в воздухе, так и на море и на суше, используя опосредованные средства."
 GRN_focus_General_Aviation_Innovations: "Инновации в общей авиации"
 GRN_focus_General_Aviation_Innovations_desc: "К счастью, центр TARI работает на полную мощность, потому что мы вложили в него много денег. В общем, общие улучшения в таких областях, как обнаружение радаров, топливная эффективность и снижение общего расхода топлива, а также ряд других инноваций должны в скором времени пройти полевые испытания."
 GRN_focus_Air_Dominance_Research_Programs: "Программы исследований превосходства в воздухе"
 GRN_focus_Air_Dominance_Research_Programs_desc: "Благодаря всесторонней работе над исследованиями и разработками в области истребительной авиации мы очистим небо от любых врагов, стремящихся омрачить его своими ненавистными намерениями."
 GRN_focus_Naval_Bombing_Superiority_Force: "Силы превосходства в военно-морских бомбардировках"
 GRN_focus_Naval_Bombing_Superiority_Force_desc: "Доминирование на морях с помощью воздушных средств может открыть путь к превентивным оборонительным мерам и обеспечить наступательные возможности в случае необходимости."
 GRN_focus_Bombing_Research_Priorities: "Приоритеты исследований в области бомбардировок"
 GRN_focus_Bombing_Research_Priorities_desc: "Направление наших исследовательских средств на приоритетные инновации в области бомбардировок и развития воздушного и морского боя окажется плодотворным для предотвращения любых вторжений, с которыми мы можем столкнуться."
 GRN_focus_Bomber_Air_Fleets: "Бомбардировочные авиафлоты"
 GRN_focus_Bomber_Air_Fleets_desc: "Наши военно-воздушные силы будут располагать специализированными авиапарками для всех видов бомбардировок. От стратегических до ближних, мы создадим условия, которые обеспечат, чтобы никакие силы противника не могли долгое время причинять вред нашим землям."
 GRN_focus_Air_Officer_Training_Corps: "Корпус подготовки офицеров ВВС"
 GRN_focus_Air_Officer_Training_Corps_desc: "Развитие нашего офицерского корпуса ВВС позволит и дальше совершенствовать усилия по его развитию, к которым мы стремимся по мере того, как мы продолжаем расти и совершенствовать то, чем на самом деле являются наши военно-воздушные силы."
 GRN_focus_Greenlandic_General_Staff_Corps: "Генеральный штаб Гренландии"
 GRN_focus_Greenlandic_General_Staff_Corps_desc: "В условиях постоянного расширения вооруженных сил мы достигли точки, когда нам необходимо более единая структура Генерального штаба. В связи с этим мы будем работать над созданием этого национального командования и стремиться к улучшению положения нашей страны, постоянно совершенствуя средства национальной обороны."
 GRN_focus_Thawing_The_Economy: "Размораживание экономики"
 GRN_focus_Thawing_The_Economy_desc: "Экономика нашей страны изначально основывалась исключительно на рыболовстве, и, собственно, на рыболовстве. Конечно, наше присутствие в коммерческом и других секторах экономики крайне незначительно, но основная часть экономики приходится на рыболовство. Мы должны это изменить. Конечно, мы пытались диверсифицировать экономику в борьбе за нашу независимость, но мы должны продолжать искать способы и направления для дальнейшего развития. Наша экономика имеет потенциал для роста, но мы должны что-то предпринять."
 GRN_focus_Energizing_Greenland: "Энергетическая Гренландия"
 GRN_focus_Energizing_Greenland_desc: "По мере роста нашей страны спрос на энергию продолжает неуклонно расти. Нам необходимо создать стабильный энергетический сектор, который сможет и дальше удовлетворять наши потребности."
 GRN_focus_Fossil_Fuelin: "Ископаемое топливо"
 GRN_focus_Fossil_Fuelin_desc: "В нашей стране имеются крупные неразработанные запасы угля и нефти. Мы можем использовать их для быстрого и дешевого производства энергии, чтобы поддерживать темпы роста наших энергетических потребностей по мере необходимости."
 GRN_focus_Oil_Charter_Dominance: "Доминирование в нефтяной хартии"
 GRN_focus_Oil_Charter_Dominance_desc: "Уделяя приоритетное внимание созданию новых уставов для добычи, мы сможем и дальше удовлетворять энергетические потребности за счет расширения масштабов добычи."
 GRN_focus_Renewable_Revivals: "Возрождение возобновляемых источников энергии"
 GRN_focus_Renewable_Revivals_desc: "Наши земли изобилуют ветрами, солнцем и проточной водой. У нас, пожалуй, наилучшие условия для инвестиций в стабильные возобновляемые источники энергии, и поэтому мы начнем общие и всеобъемлющие инвестиции как в строительство объектов возобновляемой энергетики, так и в разработку более совершенных методов производства энергии."
 GRN_focus_Harnessing_The_Winds_Of_Fortune: "Обуздать ветер удачи"
 GRN_focus_Harnessing_The_Winds_Of_Fortune_desc: "Мы продолжим уделять приоритетное внимание общему развитию страны и обеспечим использование природных ресурсов нашего государства на благо наших граждан, чтобы они могли жить лучше, чем прежде."
 GRN_focus_Greenlands_Green_Energy: "Зеленая энергия Гренландии"
 GRN_focus_Greenlands_Green_Energy_desc: "Наш остров — идеальное место для развития и использования ядерной энергии. Довольно стабильные погодные условия, прохладная и холодная погода почти круглый год, а также много воды, как соленой, так и пресной, включая замерзшую воду, используемую в процессе парогенерации."
 GRN_focus_Unlimited_Power: "Неограниченная мощность"
 GRN_focus_Unlimited_Power_desc: "Благодаря собственным запасам ядерных материалов мы можем обеспечивать энергией наши объекты. Мы также можем начать строительство и подготовить почву для ввода в эксплуатацию. Эти масштабные инвестиции создают прецедент, демонстрируя, что мы — страна, которой больше не нужно беспокоиться об энергетике."
 GRN_focus_Secured_Electrical_Grid: "Защищенная электрическая сеть"
 GRN_focus_Secured_Electrical_Grid_desc: "Благодаря выбранному нами направлению развития энергетики наши потребности в электроэнергии стали более стабильными или, по крайней мере, начали расти, приобретая более упреждающий, а не реактивный характер. Будем надеяться, что мы сделали правильный выбор и продолжим двигаться к светлому будущему."
 GRN_focus_Agricultural_Futurism_Plan: "План сельскохозяйственного футуризма"
 GRN_focus_Agricultural_Futurism_Plan_desc: "Наши оригинальные проекты по суровому земледелию (Hrish Farming Projects) заложили прочный фундамент экономических и научных инноваций. Хотя это и приводит к более энергоемким мерам, мы можем использовать это для того, чтобы обеспечить доминирование сельскохозяйственного сектора как в плане самообеспечения, так и в плане потенциальной внешней торговли и инвестиций."
 GRN_focus_Western_Farming_Complexes: "Западные сельскохозяйственные комплексы"
 GRN_focus_Western_Farming_Complexes_desc: "Создание фундамента, инфраструктуры и общих сооружений для поддержки этих методов требует времени, но в будущем они принесут свои плоды. Эти вертикальные фермерские комплексы (ВФК) отлично подходят для выращивания самых разных продуктов питания практически круглый год. Это также позволяет нам расширить наше оборудование для дистилляции, чтобы продолжать вносить свой вклад в освоение Большого Земельного Поля."
 GRN_focus_Eastern_Farming_Complexes: "Восточные сельскохозяйственные комплексы"
 GRN_focus_Eastern_Farming_Complexes_desc: "Непрерывное развитие нашего сектора вертикального земледелия позволит снизить стоимость продуктов питания в нашей стране до новых минимумов, сделав их очень дешевыми и обеспечив возможность круглогодичной торговли продуктами питания с соседними странами, которые в данном регионе считались бы несезонными."
 GRN_focus_Supplemental_Industries: "Дополнительные отрасли промышленности"
 GRN_focus_Supplemental_Industries_desc: "Развитие нашего промышленного сектора обеспечит нам некоторое ограниченное разнообразие в нашем сельскохозяйственном секторе, в который уже вложены значительные средства."
 GRN_focus_First_International_Farm: "Первая международная ферма"
 GRN_focus_First_International_Farm_desc: "Благодаря всем нашим инвестициям в исследования и экономическое развитие сельскохозяйственного сектора в целом, мы пришли к пониманию того, что, учитывая наши возможности по удовлетворению потребностей, мы можем стать первой международной сельскохозяйственной державой. Конечно, в мире есть продовольственные житницы, но подумайте сами: мы могли бы стать, ТЕМ САМЫМ, глобальным продовольственным банком."
 GRN_focus_Infrastructure_Projects: "Инфраструктурные проекты"
 GRN_focus_Infrastructure_Projects_desc: "Развитие нашей экономики — это, конечно, хорошо, но для её поддержания нам нужны дороги, железные дороги и всевозможная инфраструктура, которая соединит людей и обеспечит функционирование экономики. В связи с этим мы разработаем общий список проектов для лучшей интеграции нашей малонаселённой страны."
 GRN_focus_Greater_West_Highway_Project: "Проект строительства автомагистрали \"Грейтер Вест\""
 GRN_focus_Greater_West_Highway_Project_desc: "Создание прямой автомагистрали \"highway\", соединяющей западные города, позволит улучшить транспортные условия для жителей, а также сократить время и трудозатраты на поездки из одного места в другое."
 GRN_focus_Improving_Western_Internet_Towers: "Улучшение западных интернет-башен"
 GRN_focus_Improving_Western_Internet_Towers_desc: "Усовершенствование существующих вышек и строительство новых интернет-вышек позволит нашим гражданам и учреждениям работать более эффективно и согласованно в повседневной деятельности."
 GRN_focus_Sisimuit_Northern_Railway: "Северная железная дорога Сисимуит"
 GRN_focus_Sisimuit_Northern_Railway_desc: "Расширение существующей железнодорожной сети, чтобы охватить как можно большую часть западного региона, имеет первостепенное значение для логистики и обеспечения согласованности экономических цепочек поставок. Мы получим огромную выгоду от этих инвестиций, поскольку железные дороги являются наилучшим вариантом для массовых перевозок."
 GRN_focus_Great_Eastern_Highway_Project: "Проект Великой Восточной автомагистрали"
 GRN_focus_Great_Eastern_Highway_Project_desc: "Подобно нашему проекту на западе, мы сделаем все возможное, чтобы соединить города на востоке страны и тем самым значительно улучшить связь между странами, даже в самых элементарных аспектах, если это вообще возможно."
 GRN_focus_East_Region_Internet_Expansions: "Расширение интернет-сети в восточном регионе"
 GRN_focus_East_Region_Internet_Expansions_desc: "Поскольку восточный регион, как правило, менее развит по сравнению с западным, мы должны сделать все возможное для развития и выравнивания этих недостатков. В связи с этим мы будем расширять существующую в регионе интернет-инфраструктуру, чтобы привести ее в соответствие с современными стандартами."
 GRN_focus_Great_Greenlandic_Eastern_Railroad: "Великая Гренландская Восточная железная дорога"
 GRN_focus_Great_Greenlandic_Eastern_Railroad_desc: "Железнодорожная линия GGERR — один из крупнейших инфраструктурных проектов, направленных на объединение как можно большего количества прибрежных территорий в единую железнодорожную сеть. Единственным препятствием для сокращения времени в пути является Большой шельф, но, возможно, мы сможем это изменить в будущем."
 GRN_focus_Connecting_Greenland: "Соединяя Гренландию"
 GRN_focus_Connecting_Greenland_desc: "По мере роста нашей страны растет и наша потребность в инфраструктуре. Для этого мы должны продолжать инвестировать не только в саму инфраструктуру, но и в способы ее обслуживания, а также в то, как мы можем улучшить ее для окружающей среды, в которой она строится."
 GRN_focus_Economic_Modernism_Plan: "План экономического модернизма"
 GRN_focus_Economic_Modernism_Plan_desc: "Дальнейшая диверсификация нашей экономики имеет первостепенное значение для ее стабильности и здоровья. Мы должны устранить недостатки, связанные с более широким гражданским сектором и сектором офисной/технологической недвижимости."
 GRN_focus_Office_District_West: "Западный офисный район"
 GRN_focus_Office_District_West_desc: "Развитие офисного сектора в западном регионе позволит нам расширить ассортимент товаров и услуг, которыми смогут пользоваться жители."
 GRN_focus_Tech_Sector_Growth: "Рост технологического сектора"
 GRN_focus_Tech_Sector_Growth_desc: "Рост офисного и сервисного секторов обычно сопровождается общим развитием технологического сектора. Мы должны обеспечить это, чтобы добиться максимальной диверсификации нашей экономики."
 GRN_focus_Civilian_Sector_Investments: "Инвестиции в гражданский сектор"
 GRN_focus_Civilian_Sector_Investments_desc: "В дополнение к нашим усилиям по развитию и диверсификации офисного сектора, этим предприятиям необходима промышленная поддержка для производства и потенциального использования их продукции."
 GRN_focus_National_Economic_Modernity: "Национальная экономическая модернизация"
 GRN_focus_National_Economic_Modernity_desc: "Наши инвестиции были, мягко говоря, разнообразными и плодотворными, но это только начало. Мы должны сделать все возможное, чтобы обеспечить наилучший результат для наших граждан и для будущего нашей страны."
 GRN_focus_Resource_Extraction_Projects: "Проекты по добыче ресурсов"
 GRN_focus_Resource_Extraction_Projects_desc: "Остров богат неиспользованными ресурсами. Для достижения успеха в обеспечении внутренней безопасности, привлечении иностранных инвестиций и развитии торговли нам необходимо развивать сектор добычи ресурсов в соответствии с потребностями страны."
 GRN_focus_Iron_Mining_Operations: "Операции по добыче железной руды"
 GRN_focus_Iron_Mining_Operations_desc: "Железо — это важнейшая руда, которую необходимо добывать и использовать во всей экономике. Мы начнем национальные инвестиции для запуска и развития добывающих предприятий, чтобы они наилучшим образом соответствовали нашим потребностям."
 GRN_focus_Project_Alumina_Oxide: "Проект по производству оксида алюминия"
 GRN_focus_Project_Alumina_Oxide_desc: "Хотя пока нам еще не удалось обнаружить прямые месторождения бокситов, мы выяснили, что существуют способы извлечения необходимого оксида алюминия из других минералов для производства алюминия. Поэтому нам потребуются значительные инвестиции в производственные процессы и исследования в области изоляции, чтобы максимально эффективно использовать имеющиеся у нас небольшие запасы."
 GRN_focus_Lithium_Mining_Operations: "Операции по добыче лития"
 GRN_focus_Lithium_Mining_Operations_desc: "Залежи лития и подобных минералов, являющихся строительными блоками, сыграют ключевую роль в расширении наших возможностей для инноваций и развитии технологической отрасли и сектора услуг. Инвестиции в добычу таких ресурсов, как литий, кобальт и другие, значительно повысят нашу экономическую гибкость."
 GRN_focus_Project_Rare_Minerals: "Проект «Редкие минералы»"
 GRN_focus_Project_Rare_Minerals_desc: "Значительные инвестиции в редкоземельные элементы, такие как неодим, и другие доступные месторождения полезных ископаемых существенно повысят наш международный авторитет на торговых переговорах. Мы надеемся, что благодаря таким инвестициям наша страна сможет достичь новых высот и привлечь больше капиталовложений в нашу страну."
 GRN_focus_Black_Gold_Extraction_Efforts: "Усилия по добыче «черного золота»"
 GRN_focus_Black_Gold_Extraction_Efforts_desc: "Инвестиции в наши нефтяные месторождения обеспечат нас большим количеством дешевой энергии, а также станут отличным козырем на переговорах по будущим торговым сделкам. Кроме того, добытую нефть и уголь можно использовать для развития нашей синтетической и нефтехимической промышленности."
 GRN_focus_Project_Glacial_Rubber: "Проект «Ледяная резина»"
 GRN_focus_Project_Glacial_Rubber_desc: "Масштабные эксперименты и инвестиции в специализированные установки для выращивания каучуковых деревьев, а также в использование угля и нефти для производства синтетических и нефтехимических продуктов позволяют нам изучать все возможные пути обеспечения внутреннего производства каучука."
 GRN_focus_Polar_Bear_Policies: "Политика в отношении белых медведей"
 GRN_focus_Polar_Bear_Policies_desc: "Благодаря стабильности, развитию и оснащению нашей страны средствами национальной обороны и потенциального наступления, мы можем начать смотреть за пределы острова. Наша внешняя политика определит наше истинное будущее и то, чего мы хотим достичь собственными руками."
 GRN_focus_The_Atlantic_Stepping_Stone: "Атлантический ступень"
 GRN_focus_The_Atlantic_Stepping_Stone_desc: "Давайте будем честны, любое реальное направление внешней политики так или иначе так или иначе будет связано с Исландией. Поэтому давайте сразу разберемся с этим и выясним, что именно мы будем делать. Это не только задаст темп нашим будущим внешнеполитическим действиям, но и станет подходящей проверкой нашей способности ориентироваться в современном мире."
 GRN_focus_Investing_In_Brotherhood: "Инвестиции в братство"
 GRN_focus_Investing_In_Brotherhood_desc: "Если мы хотим более тесных связей и отношений, не говоря уже о планах потенциального союза между нами, нам необходимо укрепить доверие. Мы можем сделать это посредством ряда инвестиций, которые принесут больше пользы им, чем нам. Если мы будем действовать в долгосрочной перспективе, в конечном итоге это принесет пользу нам обоим. Помните: медленный и уверенный темп – залог успеха."
 GRN_focus_Reykjavik_Investment_Firm: "Инвестиционная фирма Рейкьявика"
 GRN_focus_Reykjavik_Investment_Firm_desc: "Исландия входит в НАТО, и это проблема. Мы должны найти способ уменьшить зависимость Исландии от иностранцев, а именно от помощи американцев, и тем самым снизить её предполагаемую потребность в ней, если хотим обеспечить безопасность острова. Поэтому давайте сделаем им предложение, от которого они не смогут отказаться. Не обращайте внимания на мелкий шрифт, просто подпишитесь прямо здесь."
 GRN_focus_Operation_Real_Green: "Операция: Настоящая зелень"
 GRN_focus_Operation_Real_Green_desc: "Мы исчерпали все возможности, мы должны обеспечить безопасность острова для нашей субрегиональной обороны высокогорной зоны Северной Атлантики. Рыболовство и торговля должны быть обеспечены в наших интересах и для нашей экономики. Кроме того, превентивное патрулирование против агрессивных разведывательных операций обеспечит большую стабильность в этом районе."
 GRN_focus_Passive_Administration_Act: "Закон о пассивном управлении"
 GRN_focus_Passive_Administration_Act_desc: "Теперь, когда Исландия находится под нашим более прямым контролем, мы должны способствовать интеграции и формированию более тесного союза схожих народов. В связи с этим мы будем придерживаться более пассивного подхода, по сути, формируя мягкую конфедеративную модель, несмотря на более федеративную организацию."
 GRN_focus_The_North_Sea_Gambit: "Гамбит Северного моря"
 GRN_focus_The_North_Sea_Gambit_desc: "Фарерские острова расположены посередине Северного моря. Мы будем обеспечивать безопасность островов любыми средствами, чтобы подготовить почву для провоцирования реакции Дании. Мы надеемся довести дело до того, что Дания объявит нам войну, обойдя таким образом доктрину статьи 5 НАТО. Поступая так, мы также сможем закрепиться на континенте и создать более близкую базу для операций либо на севере, либо на юге."
 GRN_focus_Friends_On_The_Other_Side: "Друзья по ту сторону"
 GRN_focus_Friends_On_The_Other_Side_desc: "Чтобы завоевать сердца и умы жителей Фарерских островов, мы должны проявлять доброжелательность. Поэтому мы будем делать все возможное, чтобы служить их интересам. Несколько ненавязчивых разговоров с местными жителями и работниками проекта о том, как Дания никогда не относилась к ним так хорошо, — это все, что нам нужно, чтобы задать темп и тон, который заставит правительство уступить нам."
 GRN_focus_Operation_Fair_Oh: "Операция: Fair Oh"
 GRN_focus_Operation_Fair_Oh_desc: "Итак, Фарерские острова находятся под контролем Дании, но, похоже, датчан это не волнует, их волнует лишь сохранение существующего положения вещей. Что если мы просто захватим острова и посмотрим, что произойдет? Если при захвате не будет пролита кровь или чего-то подобного, можно ли это считать нападением? И если мы сможем убедить людей присоединиться к нам до того, как Дания подаст апелляцию, кто действительно захочет помочь Дании в борьбе против страны, с которой, как все считают, Дания и так справится? Это идеальный агрессивный, но не агрессивный план."
 GRN_focus_Continental_Shenanigans: "Континентальные махинации"
 GRN_focus_Continental_Shenanigans_desc: "Обеспечив себе проход через Северное море, мы теперь обращаем внимание на континент. Другими словами, мы оглядываемся назад, чтобы высадиться на континенте, прежде чем определить, куда именно мы направимся дальше."
 GRN_focus_Family_Investments: "Семейные инвестиции"
 GRN_focus_Family_Investments_desc: "Поскольку Дания уже раскусила наши махинации, мы должны сбить их с толку, применив более пассивный подход. Учитывая нашу недавнюю историю, мы должны позволить им расслабиться и потерять бдительность, чтобы, по возможности, урегулировать ситуацию более мирным путем."
 GRN_focus_Jylland_Investment_Firm: "Инвестиционная фирма Ютландии"
 GRN_focus_Jylland_Investment_Firm_desc: "Мы будем тренироваться так же, как в Исландии. Серия крупных инвестиций, которая позволит нам затронуть некоторые незначительные общественные проблемы, чтобы политически изолировать Данию от ее союзнических обязательств."
 GRN_focus_Operation_Middleman: "Операция: Посредник"
 GRN_focus_Operation_Middleman_desc: "Дания выступает посредником между скандинавскими странами и континентальной вседозволенностью. Нам необходимо обеспечить это, если мы хотим добиться бесперебойной работы на пути к нашей конечной цели."
 GRN_focus_Civil_Service_Integration: "Интеграция государственной службы"
 GRN_focus_Civil_Service_Integration_desc: "Стандартизация и интеграция датской государственной службы в существующий аппарат государственной службы позволит обеспечить более согласованную и менее сбивчивую повседневную работу как самих программ, так и людей, которые в них нуждаются."
 GRN_focus_Nordic_Regional_Operations: "Региональные операции в странах Северной Европы"
 GRN_focus_Nordic_Regional_Operations_desc: "Благодаря созданию центрального командного центра в результате приобретения Дании мы теперь можем лучше обобщать наши стратегические цели и возможности. Мы сохраняем тот же формат, но теперь он будет иметь более широкий охват или, по крайней мере, более косвенный подход для лучшей согласованности."
 GRN_focus_West_Nordic_Interests: "Интересы Западной Скандинавии"
 GRN_focus_West_Nordic_Interests_desc: "Со временем мы будем стремиться к усилению внутреннего влияния, чтобы обеспечить норвежские ресурсы и заручиться поддержкой гражданского населения для более широкого скандинавского союза."
 GRN_focus_North_Fjords_Investment_Firm: "Инвестиционная фирма North Fjords"
 GRN_focus_North_Fjords_Investment_Firm_desc: "Подобно тому, как мы поступили с Исландией и Гренландией, мы будем развивать собственные интересы, развивая интересы Норвегии."
 GRN_focus_Operation_Fjordsland: "Операция: Фьордленд"
 GRN_focus_Operation_Fjordsland_desc: "Обеспечение безопасности Норвегии дает нам беспрепятственный доступ к торговым путям и ресурсам Северного моря. Это дает нам козырь в переговорах с НАТО для защиты от России и в целом обеспечивает нам плацдарм в более широком скандинавском регионе."
 GRN_focus_North_Sea_Negotiations: "Переговоры по Северному морю"
 GRN_focus_North_Sea_Negotiations_desc: "Работа с населением и выяснение того, чего оно хочет от нового положения дел, поможет улучшить и сгладить общий процесс интеграции."
 GRN_focus_Central_Nordic_Interests: "Центральные интересы Северных стран"
 GRN_focus_Central_Nordic_Interests_desc: "Прилагая все усилия для защиты наших интересов в Швеции и, следовательно, в центральном регионе скандинавских стран, мы окажем огромную пользу нашим будущим начинаниям."
 GRN_focus_Karlstad_Central_Investments_Agency: "Центральное инвестиционное агентство Карлстада"
 GRN_focus_Karlstad_Central_Investments_Agency_desc: "Работа над инвестициями и развитием региона вокруг Карлстада и других городов позволит нам не только улучшить имидж в глазах общественности, но и инвестировать не только в будущее Швеции, но и в наше собственное будущее."
 GRN_focus_Operation_Great_Northern_War: "Операция: Великая Северная война"
 GRN_focus_Operation_Great_Northern_War_desc: "Несмотря на общее настроение шведов в регионе, дружественный политический подход нас подвел. В результате мы были вынуждены прибегнуть к более жестким методам достижения наших целей."
 GRN_focus_Stockholm_Community_Programs: "Программы для местного сообщества в Стокгольме"
 GRN_focus_Stockholm_Community_Programs_desc: "Налаживание контактов с местным населением и активизация усилий по формированию стабильных и в целом более позитивных впечатлений помогут лучше наладить интеграционные процессы как среди населения, так и в отношениях с местными администрациями."
 GRN_focus_Eastern_Nordic_Interests: "Восточно-скандинавские интересы"
 GRN_focus_Eastern_Nordic_Interests_desc: "Захват Финляндии сделал бы нас отличным козырем в переговорах между двумя противоборствующими державами — США и Россией. Поскольку Финляндия имеет значительную общую границу с Финляндияю, нам стоит подумать, что мы можем сделать для достижения наших будущих целей."
 GRN_focus_Suomen_Investment_Agency: "Инвестиционное агентство Суомен"
 GRN_focus_Suomen_Investment_Agency_desc: "Обеспечение развития и будущего, которые, как кажется, хотят не только финны, но и все возможное для облегчения достижения желаемого будущего, — это отличный способ проверить, сможем ли мы обеспечить безопасность Финляндии для собственных нужд."
 GRN_focus_Operation_Mannerheim: "Операция: Маннергейм"
 GRN_focus_Operation_Mannerheim_desc: "Освобождение заснеженных земель Финляндии будет сродни обеспечению безопасности дома вдали от дома. Рельеф, хотя и в целом гораздо более равнинный, все же отличается суровостью окружающей среды. Поэтому мы должны суметь освоить эти земли без особых трудностей."
 GRN_focus_Continued_Peaceable_Autonomy: "Продолжение мирной автономии"
 GRN_focus_Continued_Peaceable_Autonomy_desc: "Финский народ – это ценный народ, который ценит как уединение, так и солидарность среди своих культурных единомышленников. Поэтому, при наличии взаимопонимания и более равноправных соглашений, мы сможем контролировать территорию с достаточной помощью, если будет обеспечено справедливое обращение и не будет применяться насильственное вооружение со стороны гражданского населения или правительства против их воли. Хотя это звучит для нас плохо, на самом деле это гораздо проще, чем многие думают."
 GRN_focus_Solidifying_Nordic_Unity: "Укрепление скандинавского единства"
 GRN_focus_Solidifying_Nordic_Unity_desc: "Поскольку наши амбиции подходят к скромному завершению, нам остается лишь расслабиться и насладиться плодами нашего труда, приступая к созданию нового скандинавского союза, который сможет соперничать с другими союзами по всему миру."
 GRN_focus_Continental_Ambitions: "Континентальные амбиции"
 GRN_focus_Continental_Ambitions_desc: "Теперь, когда скандинавские страны объединены, мы можем обратить внимание на юг. Хотя эти цели гораздо масштабнее, чем мы можем себе представить на практике, если мы будем использовать нашу дипломатическую модель, как делали это до сих пор, мы сможем достичь следующего шага в наших внешнеполитических амбициях — создания Континентального союза инуитов."
 GRN_focus_Eastern_Continental_Interests: "Восточные континентальные интересы"
 GRN_focus_Eastern_Continental_Interests_desc: "После того, как мы укрепили свои позиции на севере, мы можем теперь обратить внимание на юг. Таким образом, мы создадим мощную восточную границу, закрепившись в Балтийском регионе."
 GRN_focus_Operation_Nordic_Adjacent: "Операция: Скандинавская Соседняя"
 GRN_focus_Operation_Nordic_Adjacent_desc: "Эстония — ближайшая зона высадки с наших финских территорий. Мы можем либо высадить десант с парашютами, либо осуществить массированный военно-морской десант из Хельсинки и быстро обеспечить безопасность страны, прежде чем другие державы успеют выразить протест."
 GRN_focus_Operation_Riga_River: "Операция: река Рига"
 GRN_focus_Operation_Riga_River_desc: "Обеспечение безопасности Латвии дает нам центральное плато, с которого мы сможем расширить зону ответственности и обеспечить безопасность остальной части Балтийского региона."
 GRN_focus_Operation_Vilnius: "Операция: Вильнюс"
 GRN_focus_Operation_Vilnius_desc: "Литва, пожалуй, является самой развитой державой в Балтийском регионе, мы выбьем их из турнира, и с двумя другими будет проще простого."
 GRN_focus_Baltic_Behestment: "Балтийское Попечительство"
 GRN_focus_Baltic_Behestment_desc: "Поскольку местные власти и гражданское население начинают расслабляться и принимать новый статус-кво, мы можем начать интеграцию бывших балтийских стран. Хотя у них сильная воля как у народа, и поэтому, возможно, мы могли бы поработать над тем, чтобы предоставить им аналогичный статус, как мы это сделали с финскими местными властями."
 GRN_focus_North_Sea_Security: "Безопасность Северного моря"
 GRN_focus_North_Sea_Security_desc: "Обеспечение контроля над всей территорией Северного моря и северной части Атлантического океана окажется чрезвычайно полезным с точки зрения глобального влияния. Нам следует работать над сближением Кельтских островов и их соответствующих оккупантов, чтобы проложить путь к нашему более мирному правлению."
 GRN_focus_Operation_Albion: "Операция: Альбион"
 GRN_focus_Operation_Albion_desc: "Обеспечение безопасности ядра того, что является или было Королевством \"United\", будет иметь решающее значение для дальнейших операций на Кельтских островах. Не говоря уже о создании критически важного плацдарма для любых западных континентальных интриг."
 GRN_focus_Operation_Highlander: "Операция: Горец"
 GRN_focus_Operation_Highlander_desc: "Обеспечение безопасности шотландского региона позволит нам установить практически полный контроль над стратегической зоной Северного моря. Это заложит основу для общего продвижения на юг к главному острову."
 GRN_focus_Operation_Great_Western_Nation: "Операция: Великая Западная Нация"
 GRN_focus_Operation_Great_Western_Nation_desc: "Стратегическая оккупация Уэльса и территории, где когда-то проходила Великая Западная железная дорога, позволит нам использовать инфраструктуру для координации действий в интересах как на западе Ирландии, так и на юго-востоке Англии."
 GRN_focus_Operation_Be_My_Mann: "Операция: Будь моим парнем"
 GRN_focus_Operation_Be_My_Mann_desc: "Обеспечение безопасности стратегически важного острова Мэн станет для нас важным ориентиром при решении любых военно-морских вопросов, касающихся всего кельтского архипелага."
 GRN_focus_Operation_Ulster: "Операция: Ольстер"
 GRN_focus_Operation_Ulster_desc: "Поскольку остров до сих пор разделён, наш лучший вариант — разгромить более слабое североирландское государство Ольстер. Захватив его, мы сможем продвинуться на юг и захватить остальную часть Изумрудного острова."
 GRN_focus_Operation_Emerald_Isle: "Операция: Изумрудный остров"
 GRN_focus_Operation_Emerald_Isle_desc: "Обеспечение безопасности всей Ирландии позволит нам более эффективно продвигаться в самые западные районы континента. Не говоря уже о том, что это послужит плацдармом для других островов. \"Юнайтед\" Королевство."
 GRN_focus_Celtic_Consolidations: "Кельтские консолидации"
 GRN_focus_Celtic_Consolidations_desc: "Начало интеграционных усилий и нормализация нашего правления и власти над землями и людьми потребуют времени. Но оказание помощи, предоставление услуг и демонстрация того, что мы можем ладить друг с другом под новым знаменем, позволят всем вернуться к привычному ритму жизни."
 GRN_focus_Western_European_Advances: "Западноевропейские наступления"
 GRN_focus_Western_European_Advances_desc: "Наше неуклонное продвижение по континенту станет одним гигантским шагом вперед, поскольку мы будем ориентироваться на западную и центральную части страны."
 GRN_focus_Operation_Bonaparte: "Операция: Бонапарт"
 GRN_focus_Operation_Bonaparte_desc: "Франция — краеугольный камень западноевропейского театра военных действий. Более того, она служит воротами на Пиренейский полуостров, когда мы решим туда отправиться. Пришло время укрепить позиции самой западной страны в центральной оси континента."
 GRN_focus_Operation_Windmill: "Операция: Ветряная мельница"
 GRN_focus_Operation_Windmill_desc: "Нидерланды станут отличным плацдармом для западного вторжения на континент. Поскольку большая часть страны расположена на побережье, мы сможем закрепиться там в кратчайшие сроки."
 GRN_focus_Operation_Rhine_Rumble: "Операция: Рейнский грохот"
 GRN_focus_Operation_Rhine_Rumble_desc: "Германия является важнейшей точкой на всем европейском континенте. Мы обеспечиваем ее безопасность, и в свое время мы обеспечим безопасность всего континента."
 GRN_focus_Operation_Chocolate_Waffle: "Операция: Шоколадная вафля"
 GRN_focus_Operation_Chocolate_Waffle_desc: "Бельгия — страна, которой, по идее, не должно было бы существовать. Будучи британским детищем несколько сотен лет назад, она служит занозой в боку истинного европейского единства. Мы устраним эту занозу в кратчайшие сроки."
 GRN_focus_Operation_Speed_Bump: "Операция: Лежачий полицейский"
 GRN_focus_Operation_Speed_Bump_desc: "Это Люксембург, он не представляет угрозы, за исключением случаев, когда он вступает в коалицию других стран. Мы сейчас его захватим, ладно, пока."
 GRN_focus_French_Values_Greenlandic_Leadership: "Французские ценности, гренландское лидерство"
 GRN_focus_French_Values_Greenlandic_Leadership_desc: "Для того чтобы крайне недовольное население Франции смирилось с новым статус-кво, потребуется значительное количество времени и усилий. Но если мы сможем показать, что не хотим менять их ценности, а лишь хотим сменить руководство, то, будем надеяться, сможем гораздо эффективнее сотрудничать с народом."
 GRN_focus_German_Traditions_Greenlandic_Initiative: "Немецкие традиции, гренландские инициативы"
 GRN_focus_German_Traditions_Greenlandic_Initiative_desc: "Германия обладает богатой историей военных традиций. Если мы сможем этим воспользоваться, то нам гарантировано континентальное господство. Немецкое воинское мастерство в сочетании с гренландскими амбициями в отношении собственного достоинства."
 GRN_focus_Low_Countries_Low_Maintainance: "Низкие страны, низкие затраты на обслуживание"
 GRN_focus_Low_Countries_Low_Maintainance_desc: "Страны Бенилюкса ожидают от себя лишь справедливого отношения и возможности сохранять свободу духа. Учитывая, что мы пытаемся создать союз равных, это оказывается гораздо проще, чем ожидалось."
 GRN_focus_Iberian_Atlantic_Interests: "Иберийско-атлантические интересы"
 GRN_focus_Iberian_Atlantic_Interests_desc: "Иберийский полуостров является стратегически важным узким местом между преимущественно центральным Атлантическим регионом, а также основным пунктом доступа к Средиземному морю. Для обеспечения безопасности всего континента нам необходимо защитить этот жизненно важный торговый и логистический пункт."
 GRN_focus_Operation_Castile: "Операция: Кастилия"
 GRN_focus_Operation_Castile_desc: "Испания — главная держава на Пиренейском полуострове, мы обеспечиваем её безопасность и, по сути, безопасность всего региона."
 GRN_focus_Operation_Fontainebleau: "Операция: Фонтенбло"
 GRN_focus_Operation_Fontainebleau_desc: "Наполеон когда-то пытался завоевать Португалию посредством договора с Испанией. Сегодня все совсем иначе, ведь мы завоюем Португалию ради иберийского единства и европейского федерализма. Нас ждет новая эра, и Португалия — это ворота к иберийской консолидации."
 GRN_focus_Operation_The_Other_Galicia: "Операция: Другая Галисия"
 GRN_focus_Operation_The_Other_Galicia_desc: "Большинство людей за пределами Европы, услышав о Галиции, думают о регионе на западе Украины. Но на самом деле мы хотим сосредоточиться на галицком государстве на северо-западе Иберийского полуострова."
 GRN_focus_Operation_Basquing_In_the_Sun: "Операция: Баскский отдых на солнце"
 GRN_focus_Operation_Basquing_In_the_Sun_desc: "Если мы еще не справились, то наладим отношения с баскской нацией. А справились? Я забыл."
 GRN_focus_Operation_Barcelona: "Операция: Барселона"
 GRN_focus_Operation_Barcelona_desc: "Обеспечение безопасности северо-восточной части Иберийского полуострова позволит нам закрепиться по другую сторону горных хребтов, которые определяли франко-испанскую границу."
 GRN_focus_Operation_Casablanca: "Операция: Касабланка"
 GRN_focus_Operation_Casablanca_desc: "Южный регион, известный как Андалусия, расположенный на Пиренейском полуострове, обеспечит нам бесспорный контроль над нашей половиной Гибралтарского пролива."
 GRN_focus_Iberian_Idealism: "Иберийский идеализм"
 GRN_focus_Iberian_Idealism_desc: "Теперь, когда регион находится под нашим полным контролем, мы можем начать укреплять чувство регионального единства. Используя культуру и народы, их историю и дух, мы можем пробудить чувство новой гордости. Единство через силу и процветание, товарищество в радости и горе."
 GRN_focus_Alpine_Block_Nations: "Страны Альпийского блока"
 GRN_focus_Alpine_Block_Nations_desc: "Южно-центральный регион характеризуется преимущественно горной местностью. От Альпийских хребтов на самых северных участках итальянской границы до многочисленных горных массивов, спускающихся по территории самой Италии. Мы должны обеспечить безопасность этого региона, обладающего естественной оборонительной силой, если хотим продвинуться дальше на восток."
 GRN_focus_Operation_Neutral_No_More: "Операция: Больше никаких нейтралитетов"
 GRN_focus_Operation_Neutral_No_More_desc: "Швейцария — страна гор. Мы покорим её, и мы сможем покорить практически всё."
 GRN_focus_Operation_Vienna_Calling: "Операция: Вена зовёт"
 GRN_focus_Operation_Vienna_Calling_desc: "От Альп до венгерских равнин мы обеспечим безопасность Австрии и откроем путь на восток и юг."
 GRN_focus_Operation_Slovene_And_Slide: "Операция: словенский и слайд"
 GRN_focus_Operation_Slovene_And_Slide_desc: "Закрепление позиций на севере Балкан поможет нам обеспечить безопасность региона, когда мы обратим на него свое внимание."
 GRN_focus_Operation_Gelato: "Операция: Джелато"
 GRN_focus_Operation_Gelato_desc: "Итальянская держава занимает стратегически важное положение в южно-центральной части Европы и Средиземном море. Мы обеспечиваем это положение и гарантируем наличие жизненно важного военно-морского флота для дальнейших операций."
 GRN_focus_Securing_Local_Interests: "Защита местных интересов"
 GRN_focus_Securing_Local_Interests_desc: "Учет интересов местного населения и его потребностей поможет взглянуть на ситуацию в новом, более позитивном свете. Мы надеемся, что, лучше взаимодействуя с людьми, мы сможем обеспечить более плавную передачу власти."
 GRN_focus_Great_Eastern_Interests: "Великие восточные интересы"
 GRN_focus_Great_Eastern_Interests_desc: "Укрепив свои позиции на востоке, мы можем теперь расширить своё влияние на остальную часть Восточной Европы. От польской и чешской границ до белорусской и украинской — мы начнём наше продвижение на восток."
 GRN_focus_Operation_Heartbeat: "Операция: Сердцебиение"
 GRN_focus_Operation_Heartbeat_desc: "Польша — сердце Восточной Европы. Её называют европейским Техасом из-за значительных инвестиций в военную подготовку. Теперь мы подвергнем это серьёзному испытанию."
 GRN_focus_Operation_Carpathia: "Операция: Карпатии"
 GRN_focus_Operation_Carpathia_desc: "Большая часть Словакии расположена на северном склоне великого Карпатского хребта. Если мы хотим иметь общую основу для движения на юг, в Балканы, то нам необходимо пересечь эти горы."
 GRN_focus_Operation_Final_Rhapsody: "Операция: Последняя рапсодия"
 GRN_focus_Operation_Final_Rhapsody_desc: "Обеспечение безопасности Чехии позволяет нам практически полностью закрепить северный подход к Балканам. Это всего лишь еще один шаг к европейскому единству."
 GRN_focus_Operation_White_Russian: "Операция: Белый Русский"
 GRN_focus_Operation_White_Russian_desc: "Беларусь — это ключевой элемент, удерживающий российские интересы в Европе, помимо, конечно, давних исторических амбиций. Нам нужно будет сбить с них ветры, если мы хотим по-настоящему укрепить свой контроль на континенте."
 GRN_focus_Operation_Bread_Basket: "Операция: Хлебная корзина"
 GRN_focus_Operation_Bread_Basket_desc: "Обеспечение доступа к житнице континента принесет нам много пользы, и это то, чего мы должны добиться."
 GRN_focus_Operation_Soviet_Storm: "Операция: Советский шторм"
 GRN_focus_Operation_Soviet_Storm_desc: "Приднестровье — это страна, которая сама по себе является капсулой времени. Будучи одним из последних бастионов СССР, эта, несмотря на свои небольшие размеры, страна чрезвычайно горда и непокорна, и её почти невидимые интриги каким-то образом поддерживают её существование как нации."
 GRN_focus_Operation_Your_Right_No_Your_Other_Right: "Операция: Ваше право, нет, ваше другое право"
 GRN_focus_Operation_Your_Right_No_Your_Other_Right_desc: "Мы должны атаковать Молдову... нет, не румынский регион, а именно страну. Да, я знаю, это запутанно, но не спрашивайте меня, спросите их, когда мы туда доберемся."
 GRN_focus_Eastern_Territorial_Authority_Bureau: "Бюро Восточной Территориальной Администрации"
 GRN_focus_Eastern_Territorial_Authority_Bureau_desc: "ETAB — это специализированное агентство, призванное противостоять более свободолюбивым восточным странам. У этих людей обширные сельские территории, которые в той или иной степени до сих пор не освоены с точки зрения централизации. Мы можем реализовывать инфраструктурные проекты и программы работы с местным населением, чтобы, будем надеяться, успокоить и урегулировать любые затяжные проблемы, с которыми мы можем столкнуться."
 GRN_focus_Balkan_Bounties: "Балканские награды"
 GRN_focus_Balkan_Bounties_desc: "Последние гвозди в гвоздь нашего масштабного проекта — нации Бакан. Земля войн и истории, мы приложим огромные усилия, чтобы укротить этот нестабильный, похожий на зоопарк регион."
 GRN_focus_Operation_Nosferatu: "Операция: Носферату"
 GRN_focus_Operation_Nosferatu_desc: "Трансильванская котловина в Карпатских горах является стратегически важным оборонительным пунктом. Кроме того, Румыния обладает значительными мощностями по производству энергии, и поэтому мы можем более эффективно использовать эти ресурсы на благо всех."
 GRN_focus_Operation_Bulgar: "Операция: Болгарский"
 GRN_focus_Operation_Bulgar_desc: "Укрепление восточного участка вдоль Черного моря поможет нам консолидировать усилия в направлении внутренних районов Балкан."
 GRN_focus_Operation_Alexander_Not_So_Great: "Операция: Александр не так уж и велик"
 GRN_focus_Operation_Alexander_Not_So_Great_desc: "Македония утверждает, что в её составе находится выдающаяся историческая фигура Александра Великого. Что ж, сейчас я его не вижу, так что мы просто возьмём дело в свои руки."
 GRN_focus_Operation_Trianon: "Операция: Трианон"
 GRN_focus_Operation_Trianon_desc: "Венгерская нация расположена на северо-центральном Балканском плато. Если мы обеспечим её безопасность, у нас откроется прямой путь на юг, к Средиземному морю."
 GRN_focus_Operation_Princip: "Операция: Принцип"
 GRN_focus_Operation_Princip_desc: "От «Чёрной руки», развязавшей мировую войну, мы теперь наносим сербскому народу удар в спину, чтобы отомстить одному из главных поджигателей в регионе."
 GRN_focus_Operation_Koso_Woah: "Операция: Косо Воа"
 GRN_focus_Operation_Koso_Woah_desc: "Косово — это скорее заноза в боку Сербии, чем нам. Поэтому это должно пройти быстро."
 GRN_focus_Operation_Scissors: "Операция: Ножницы"
 GRN_focus_Operation_Scissors_desc: "Обеспечение безопасности Хорватии позволит нам защитить значительную часть береговой обороны и обеспечить позиции для фланговых атак, пока мы будем реализовывать свои амбиции на юге."
 GRN_focus_Operation_Minefield: "Операция: Минное поле"
 GRN_focus_Operation_Minefield_desc: "Наша главная опасность при подавлении сильно расколотой Боснии заключается в том, что вся страна практически представляет собой минное поле. Поэтому нам потребуется много оборудования для борьбы с минами, если мы действительно хотим добиться каких-либо результатов в ближайшее время."
 GRN_focus_Operation_Mountain_Man: "Операция: Горный человек"
 GRN_focus_Operation_Mountain_Man_desc: "Горы Черногории — довольно суровое место, но мы скоро до него доберемся."
 GRN_focus_Operation_Adriatic_Gateway: "Операция: Адриатический шлюз"
 GRN_focus_Operation_Adriatic_Gateway_desc: "Обеспечение безопасности Албании позволит нам перекрыть доступ в Адриатическое море. Таким образом, мы обеспечим себе огромный потенциал для строительства военно-морских судов и, по сути, обширную портовую сеть, которую мы сможем использовать для операций в Средиземном море."
 GRN_focus_Operation_This_Is_Sparta: "Операция: Это Спарта"
 GRN_focus_Operation_This_Is_Sparta_desc: "Греция, полуостровное островное государство, хранящее в себе значительные культурные и исторические сокровища. Мы обеспечим сохранность этого исторического центра, но при этом должны сделать все возможное, чтобы не разрушить исторические места."
 GRN_focus_Southern_Territorial_Authority_Commission: "Комиссия Южного Территориального Администрирования"
 GRN_focus_Southern_Territorial_Authority_Commission_desc: "Создание специальной комиссии позволит нам сосредоточить усилия на мерах по интеграции и единству, чтобы избежать общенациональной проблемы, возникающей из-за проблем в отдельных регионах, где люди не умеют держать себя в руках."
 GRN_focus_Establishing_The_Frozen_Federation: "Создание Федерации Замороженных"
 GRN_focus_Establishing_The_Frozen_Federation_desc: "Наконец-то мы это сделали! Мы создали единое федеративное государство, которое объединяет заснеженные северные страны с остальными странами Европейского континентального союза. Конечно, оно не идеально и, следовательно, не охватывает весь географически континентальный регион Европы. Но, несмотря ни на что, это наша роль в истории, и мы сделаем все возможное, чтобы оставаться верными ценностям и народам, которые теперь находятся под нашей защитой. За Федерацию!"
 GRN_focus_The_Great_Ice_Shelf: "Большой шельфовый ледник"
 GRN_focus_The_Great_Ice_Shelf_desc: "Обширные внутренние районы нашей страны представляют собой лишь огромный ледяной покров. Благодаря прогрессу в развитии страны, мы смогли постепенно осваивать ледяной шельф, используя замерзшую воду в контролируемых целях. Теперь мы можем с удвоенной силой направить наше внимание на внутренние районы и подготовиться к их освоению и развитию. Ведь будущее за зеленью, и мы обязательно откроем земли подо льдом."
 GRN_focus_Southern_Interior_Development_Projects: "Проекты развития южной части внутренней территории США"
 GRN_focus_Southern_Interior_Development_Projects_desc: "Мы начнем работу над южным внутренним регионом, который мы определили для развития и организации логистики."
 GRN_focus_Southern_Settlement_Projects: "Проекты южных поселений"
 GRN_focus_Southern_Settlement_Projects_desc: "Для решения логистических задач мы начнем создавать небольшую сеть стратегически расположенных поселений, чтобы не только увеличить численность местного населения, но и сформировать своего рода цепочку поставок в регионе. Это поможет нам в реализации будущих проектов, которые мы будем стремиться осуществить, чтобы наконец-то освоить значительную часть Большого ледникового шельфа."
 GRN_focus_Southern_Infrastructure_Projects: "Инфраструктурные проекты на юге США"
 GRN_focus_Southern_Infrastructure_Projects_desc: "Для того чтобы соединить наши поселения и начать любую экономическую деятельность, нам потребуется какая-либо инфраструктура, которая позволит нам установить золотой стандарт того, как по-настоящему укротить природу."
 GRN_focus_Southern_Economic_Projects: "Южные экономические проекты"
 GRN_focus_Southern_Economic_Projects_desc: "Благодаря наличию населения и инфраструктуры в южной части внутреннего региона мы можем начать постепенно создавать внутреннюю или местную экономическую базу. Этот фундамент заложит основу для значительного роста в будущем."
 GRN_focus_Southern_Mining_Projects: "Южные горнодобывающие проекты"
 GRN_focus_Southern_Mining_Projects_desc: "Поскольку экономическая и социальная ситуация в регионе постепенно стабилизируется, настало время начать проекты по глубоководной добыче полезных ископаемых. Мы будем использовать лед для непрерывной добычи, чтобы получать достоверные геологические данные, а также избегать перегрева оборудования из-за перепада температур."
 GRN_focus_Taming_The_Southern_Interior: "Укрощение внутренних районов Юга"
 GRN_focus_Taming_The_Southern_Interior_desc: "Благодаря имеющимся людям, инфраструктуре и ресурсам мы теперь можем с уверенностью сказать, что действительно покорили часть Великого шельфового ледника. Конечно, наша работа еще не закончена, далеко не закончена. Но теперь мы можем с уверенностью смотреть на великий северный горизонт и сказать, что находимся на грандиозном и плодотворном пути."
 GRN_focus_Central_Plateau_Development_Projects: "Проекты развития Центрального плато"
 GRN_focus_Central_Plateau_Development_Projects_desc: "После того, как южный регион был освоен в базовом плане, мы можем начать масштабный ледяной поход в центральный регион. Благодаря увеличению площади льда и потенциальной суши мы сможем инвестировать в более фундаментальные показатели."
 GRN_focus_Central_Settlement_Projects: "Центральные проекты поселения"
 GRN_focus_Central_Settlement_Projects_desc: "Как и в южном регионе, мы начнем создавать стратегические поселения по всему плато."
 GRN_focus_Central_Infrastructure_Projects: "Центральные инфраструктурные проекты"
 GRN_focus_Central_Infrastructure_Projects_desc: "После создания поселений мы сможем приступить к формированию достаточной инфраструктурной сети для надлежащего соединения всего воедино."
 GRN_focus_Central_Economic_Projects: "Центральные экономические проекты"
 GRN_focus_Central_Economic_Projects_desc: "Население – есть. Инфраструктура – ​​есть. Теперь переходим к созданию местного экономического аппарата."
 GRN_focus_Central_Mining_Projects: "Центральные горнодобывающие проекты"
 GRN_focus_Central_Mining_Projects_desc: "Как и в южном регионе, мы наконец-то создали необходимые экономические и социальные связи для подготовки операций по добыче ресурсов. Этот регион намного больше южного, так что желаем ему плодотворного сотрудничества."
 GRN_focus_Taming_The_Central_Plateau: "Укрощение Центрального плато"
 GRN_focus_Taming_The_Central_Plateau_desc: "Благодаря наличию населения, поселений, продовольствия, экономики и ресурсов, мы можем официально и с уверенностью заявить, что покорили Великий Ледниковый хребет. Хотя со временем нас ждут многочисленные трудности, сейчас и в обозримом будущем мы можем наслаждаться величественной полярной славой нашей великой и процветающей страны."
 GRN_eu_adjacent_nation: "Страна, граничащая с ЕС"
 GRN_eu_adjacent_nation_desc: "Гренландия находится в интересном положении. Будучи наиболее удаленной от европейского континента страной, она не является и, вероятно, никогда не станет членом ЕС. Однако благодаря своему статусу датской коронной колонии она имеет тот же миграционный и транспортный статус, что и любое другое государство-член ЕС. Таким образом, многие гренландцы используют это как способ получить лучшее образование из-за недостаточного уровня развития острова."
 GRN_economic_pains: "Экономические трудности"
 GRN_economic_pains_desc: "Население Гренландии на протяжении десятилетий колебалось около 50 тысяч человек, а затем еще больше сократилось, поскольку суровый климат и логистика страны стали ключевыми факторами ее развития. В новом тысячелетии эта проблема сохраняется, и лидерам страны необходимо предпринять шаги для адаптации и корректировки экономики, если они и страна в целом хотят выйти за рамки простого стагнации."
 GRN_idea_colonial_subsidy: "Колониальная субсидия"
 GRN_idea_colonial_subsidy_desc: "Наша страна крайне слаборазвита, до такой степени, что мы в значительной степени зависим от датских субсидий в повседневной жизни. Если мы хотим хотя бы задуматься о независимости от датской короны, то должны найти способ, как избавиться от этой необходимости в субсидиях как средстве выживания."
 GRN_idea_narrow_gauge_nation: "Узкоколейная страна"
 GRN_idea_narrow_gauge_nation_desc: "Гибкость и экономичность узкоколейных путей, а также оборудования позволят нам возглавить развитие и укрепление связей внутри страны. Кроме того, это имеет дополнительное преимущество в плане безопасности, поскольку сделать их более безопасными дешевле по сравнению с традиционными путями и оборудованием стандартной колеи."
 GRN_idea_battle_for_independence: "Битва за независимость"
 GRN_idea_battle_for_independence_desc: "Мы достигли точки, когда наша независимость обеспечена. Мы начнем масштабные кампании давления, чтобы гарантировать, что наша независимость будет обеспечена при нашей жизни."
 GRN_ideas_political_freedoms: "Политические свободы"
 GRN_ideas_political_freedoms_desc: "Поскольку в нашей стране существует свобода выбора, которого желает ее народ, мы не чувствуем никаких ограничений в отношении какой-либо одной конкретной идеологии."
 GRN_ideas_emerging_political_influences: "Возникновение политических влияний"
 GRN_ideas_emerging_political_influences_desc: "Теперь, когда наша страна обрела независимость, мы можем сосредоточиться на демонстрации современного подхода к политике, вступая в этот новый, смелый мир."
 GRN_ideas_non_aligned_political_influences: "Неприсоединившиеся политические влияния"
 GRN_ideas_non_aligned_political_influences_desc: "Поскольку наша страна свободна выбирать свой путь, ни одна геополитическая сторона, похоже, не может принести нам реальной выгоды, и поэтому мы будем стремиться сосредоточиться на себе, придерживаясь более нейтральной позиции."
 GRN_ideas_nationalist_political_influences: "Националистические политические влияния"
 GRN_ideas_nationalist_political_influences_desc: "Наша страна свободна, наш народ един, наша страна — наш главный приоритет в планировании будущего. Гренландский национализм дарит нам душевный покой."
 GRN_idea_alumina_research_institute: "Институт исследований оксида алюминия"
 GRN_idea_alumina_research_institute_desc: "Создание АРИ имеет основополагающее значение для понимания добычи, переработки и эффективного использования ресурсов. Этот специализированный научно-исследовательский комплекс поднимет нашу страну на новый уровень в сфере внешнеторговых переговоров, а также в более практичных методах реализации автаркической политики."
 GRN_idea_economic_development_visas: "Визы экономического развития"
 GRN_idea_economic_development_visas_desc: "Желающие переехать и обосноваться в стране могут подать заявку на визу 1-го класса, известную как виза экономического развития. Виза экономического развития — это, по сути, процесс адаптации, призванный помочь новым гражданам обосноваться и найти работу, чтобы они могли внести свой вклад в развитие и общий рост страны."
 GRN_idea_sanctioned_immigration_efforts: "Усилия по санкционированной иммиграции"
 GRN_idea_sanctioned_immigration_efforts_desc: "Благодаря целенаправленным усилиям мы постараемся обеспечить устойчивый рост населения за счет иммиграции."
 GRN_idea_strategic_mineral_leasing: "Стратегическая аренда минеральных ресурсов"
 GRN_idea_strategic_mineral_leasing_desc: "Предоставление иностранным компаниям права аренды месторождений полезных ископаемых — это очень острый меч, с которым нужно обращаться. Мы должны конкретно регулировать, что именно они могут добывать, где они могут добывать и куда эти полезные ископаемые будут доставляться. Таким образом, мы можем надеяться ограничить любые чрезмерные формы иностранного вмешательства в нашу политическую структуру, где это возможно, а также использовать их в качестве козыря в переговорах."
 GRN_idea_contracting_a_workforce: "Наем рабочей силы"
 GRN_idea_contracting_a_workforce_desc: "Использование таможенных и пограничных служб для обеспечения безопасности нанятой по контракту рабочей силы позволяет нам расширять бизнес и отрасли более стабильными и надежными темпами. В конце концов, они же прочитали контракт и подписали его."
 GRN_idea_agriculture_automations: "Автоматизация сельского хозяйства"
 GRN_idea_agriculture_automations_desc: "Главная проблема, стоящая перед нашей страной, — это поддержание стабильного кадрового резерва. Поэтому мы решили вложить значительные средства в сельскохозяйственный сектор, чтобы существенно сократить потребность в дополнительных кадрах."
 GRN_idea_war_production_automations: "Автоматизация военного производства"
 GRN_idea_war_production_automations_desc: "Главная проблема, стоящая перед нашей страной, — это поддержание стабильного кадрового резерва. Поэтому мы решили вложить значительные средства в сектор военного производства, чтобы существенно сократить потребность в дополнительных кадрах. Это позволит высвободить как рабочих, так и потенциальную рабочую силу для нужд армии в случае необходимости."
 GRN_idea_industrial_automations: "Промышленная автоматизация"
 GRN_idea_industrial_automations_desc: "Главная проблема, стоящая перед нашей страной, — это поддержание стабильного кадрового резерва. Поэтому мы решили вложить значительные средства в производственный сектор, чтобы существенно сократить потребность в дополнительных кадрах. Этот постоянно расширяющийся сектор, как правило, требует наибольшего количества работников из-за масштабируемости, поэтому это должно оказаться для нас наиболее выгодным."
 GRN_idea_corporate_automations: "Корпоративная автоматизация"
 GRN_idea_corporate_automations_desc: "Главная проблема, стоящая перед нашей страной, — это поддержание стабильного кадрового резерва. Поэтому мы решили вложить значительные средства в сектор офисных услуг и технологий, чтобы существенно сократить потребность в дополнительных кадрах. Этот сектор, как правило, требует наибольшего количества персонала из-за высоких требований, и поэтому это может оказаться для нас наиболее выгодным."
 GRN_idea_strategic_mining_automations: "Стратегическая автоматизация горнодобывающей промышленности"
 GRN_idea_strategic_mining_automations_desc: "Пересмотрев методы добычи ресурсов и сосредоточившись на сокращении числа людей, работающих в шахтах, мы сможем максимизировать объемы добычи без угрозы гибели людей. Конечно, это не будет идеальным решением, но эти беспилотные транспортные средства и некоторые виды оборудования должны открыть гораздо больше возможностей."
 GRN_idea_pro_military_economic_organization: "Провоенная экономическая организация"
 GRN_idea_pro_military_economic_organization_desc: "Переориентировав экономику на потребности гражданского населения и военнослужащих, мы улучшим производственные возможности наших заводов по выпуску вооружений, что позволит сократить общую численность персонала, необходимого для работы этих предприятий. Конечно, такая радикальная модернизация существенно снизит производственные мощности, но после стабилизации и ввода в эксплуатацию эти предприятия смогут производить больше продукции с гораздо меньшими затратами."
 GRN_idea_frozen_warfare_training: "Обучение ведению боевых действий в условиях заморозки"
 GRN_idea_frozen_warfare_training_desc: "Наши тренировочные программы будут в основном сосредоточены на боевых действиях в зимних условиях и в условиях холодного климата. Конечно, мы будем стараться проводить различные тренировки, когда и где это возможно, но в нашем доме холодно, поэтому мы должны должным образом тренироваться, чтобы защитить его."
 GRN_idea_polar_logistics_doctrine: "Доктрина полярной логистики"
 GRN_idea_polar_logistics_doctrine_desc: "В основе нашей стратегии лежит создание оборудования, лучше приспособленного для использования в условиях сильного холода, что позволяет нам эффективнее вести боевые действия, если вражеские силы решат высадиться на нашем острове."
 GRN_idea_artillery_specialist_corps: "Корпус артиллерийских специалистов"
 GRN_idea_artillery_specialist_corps_desc: "Артиллерия — это основа, позволяющая наносить больше урона, чем принимать, если вы находитесь в выгодной позиции. Чтобы сохранить это преимущество, нам необходимо развивать и наращивать артиллерийский корпус до такого уровня, который позволит свести к минимуму наши потери."
 GRN_idea_heavy_anti_air_investments: "Крупные инвестиции в противовоздушную оборону"
 GRN_idea_heavy_anti_air_investments_desc: "В современную эпоху боевых действий новой королевой поля боя стала авиация. Истребители, бомбардировщики — что бы ни потребовалось, они это сделают. Поскольку наша армия так мала, нам нужно найти способ лишить противника возможности делать то, что он хочет. Поэтому мы начнем масштабные инвестиции в проектирование и разработку зенитной техники, чтобы обеспечить нашим солдатам на земле реальные шансы на победу."
 GRN_idea_army_officer_corps: "Офицерский корпус армии"
 GRN_idea_army_officer_corps_desc: "Создание и стандартизация корпуса подготовки офицеров армии позволяет нам формировать, совершенствовать и улучшать тактические и стратегические навыки наших командиров, чтобы они не только лучше понимали ситуацию сами, но и лучше служили войскам, которыми командовали."
 GRN_idea_small_ship_developments: "Развитие малых судов"
 GRN_idea_small_ship_developments_desc: "Первые этапы разработок приносят свои плоды: наши первые проекты корветов показывают, что, хотя мы можем их совершенствовать и улучшать, стратегическое преимущество будет иметь значение только в том случае, если мы сможем обеспечить надлежащий укомплектование экипажей судов."
 GRN_idea_expanding_small_vessel_designs: "Расширение проектных решений для малых судов."
 GRN_idea_expanding_small_vessel_designs_desc: "Чтобы обеспечить наличие аналогичных инноваций в нашем подразделении по производству корветов, мы сосредоточимся на фрегатах и ​​эсминцах, чтобы полностью укрепить наш флот малых судов."
 GRN_idea_attack_submarine_programs: "Программы создания ударных подводных лодок"
 GRN_idea_attack_submarine_programs_desc: "Программа ASP представляет собой серию программ разработки и тестирования, призванных определить пределы возможностей и выявить наиболее эффективные способы применения новых технологий."
 GRN_idea_missile_submarine_programs: "Программы создания ракетных подводных лодок"
 GRN_idea_missile_submarine_programs_desc: "Программа MSP представляет собой серию программ разработки и испытаний, призванных доказать наиболее эффективный способ применения ракетных технологий в военно-морских боевых действиях."
 GRN_idea_navy_officer_corps: "Офицерский корпус ВМС"
 GRN_idea_navy_officer_corps_desc: "Создание Корпуса подготовки офицеров ВМС позволит нам повысить стандарты боеспособности и лидерства в нашем военно-морском флоте."
 GRN_idea_aviation_innovations: "Авиационные инновации"
 GRN_idea_aviation_innovations_desc: "Первые результаты начинают приносить плоды: центр TARI приступил к внедрению своих инноваций в общие конструкции и производственные модели для тестирования и доработки. Это может оказаться полезным в процессе дальнейшего реформирования и совершенствования нашего Плана действий по обеспечению превосходства в воздухе."
 GRN_idea_air_dominance_program: "Программа превосходства в воздухе"
 GRN_idea_air_dominance_program_desc: "Программа ADP посвящена конкретному классу истребителей и тому, как улучшить их общие боевые возможности для защиты нашего воздушного пространства от вражеских атак."
 GRN_idea_bombing_innovations: "Инновации в области бомбардировок"
 GRN_idea_bombing_innovations_desc: "Инновации в области воздушного и морского боя позволили нам специализировать наши бомбардировки, сделав их более эффективными, чем когда-либо прежде. Мы должны продолжать использовать эти возможности, если хотим предотвратить реальное высадку вражеских сил на наш остров."
 GRN_idea_bomber_design_department: "Отдел проектирования бомбардировщиков"
 GRN_idea_bomber_design_department_desc: "Созданная с целью повышения эффективности наших бомбардировочных воздушных флотов, BDD является вершиной инноваций в авиационной отрасли нашей страны."
 GRN_idea_air_officer_corps: "Офицерский корпус ВВС"
 GRN_idea_air_officer_corps_desc: "Развитие офицерского корпуса военно-воздушных сил позволяет нам повысить общую эффективность и внедрять инновации в области лидерства и тактики применения в воздушных боевых операциях."
 GRN_idea_general_staff_corps: "Корпус Генерального штаба"
 GRN_idea_general_staff_corps_desc: "Благодаря тому, что наши вооруженные силы наконец достигли уровня, когда необходимо создать единый командный штаб между всеми родами войск, наша страна добилась и будет продолжать добиваться больших успехов в национальной обороне."
 GRN_idea_agricultural_futurist_policies: "Политика сельскохозяйственного футуризма"
 GRN_idea_agricultural_futurist_policies_desc: "Приоритизация научно-исследовательских работ, а также экономических инвестиций в сельскохозяйственный сектор в целом позволяет нам оставаться в курсе инноваций и продолжать адекватно масштабировать потребности, которые возникнут, если мы сосредоточимся не только на внутренних нуждах."
 GRN_idea_polar_infrastructure_developments: "Развитие полярной инфраструктуры"
 GRN_idea_polar_infrastructure_developments_desc: "Постоянные инвестиции в развитие нашей инфраструктуры, а также в разработку способов повышения долговечности этих инвестиций позволили нам внедрять инновации в областях, о которых многие даже не подумали бы."
 GRN_idea_economic_modernity_policies: "Политика экономической модернизации"
 GRN_idea_economic_modernity_policies_desc: "Наша страна находится на передовой линии развития. Мы, несомненно, продолжим этот великий путь к процветанию страны и наших граждан."
 GRN_ideas_mining_needs: "Потребности горнодобывающей промышленности"
 GRN_ideas_mining_needs_desc: "Мы решили сосредоточить внимание горнодобывающего сектора на национальных потребностях, а не на чем-либо еще. Это позволило нам стратегически согласовывать экспортные цены, одновременно снижая потребность сектора в человеческих ресурсах."
 GRN_ideas_mining_greeds: "Жадность в горнодобывающей промышленности"
 GRN_ideas_mining_greeds_desc: "Мы решили сосредоточить усилия горнодобывающего сектора на удовлетворении национальных и международных потребностей, а не просто на том, что необходимо в данный момент. В результате мы смогли в полной мере продемонстрировать наши ресурсы и заключить несколько действительно выгодных сделок в сфере экспорта. Хотя небольшая проблема, связанная с возросшим спросом на рабочую силу, похоже, затронула весь экономический сектор, общая выгода, по-видимому, оправдывает средства достижения цели."
 GRN_ideas_intense_foreign_affairs_budgeting: "Интенсивное бюджетирование в сфере внешней политики"
 GRN_ideas_intense_foreign_affairs_budgeting_desc: "Если мы хотим всерьез продвинуться в дипломатических отношениях за рубежом, нам необходимо серьезно сосредоточиться на этих усилиях. При нашем нынешнем уровне силы и стабильности нам не хватает внутренней стабильности из-за проблем с численностью населения по сравнению с экономикой. Поэтому, если мы не разыграем свои карты должным образом, мы окажемся, по сути, твердой оболочкой с пустым внутренним пространством."
 GRN_ideas_political_shenanigans: "Политические махинации"
 GRN_ideas_political_shenanigans_desc: "В последнее время в нашей стране пролился свет на недовольство. Судя по всему, это всего лишь досадная мелочь, учитывая нынешнее благополучное состояние страны, но нам нужно будет выяснить, кто этим занимается, если мы хотим вернуться к более спокойной обстановке."
 GRN_ideas_domesticating_foreign_policy: "адаптация внешней политики к местным условиям"
 GRN_ideas_domesticating_foreign_policy_desc: "Для реализации наших внешнеполитических амбиций нам необходимо обеспечить безопасность как внутри страны, так и получить средства для использования нашего влияния за рубежом."
 GRN_ideas_the_frozen_federation: "Замороженная Федерация"
 GRN_ideas_the_frozen_federation_desc: "Что ж, мы объединили континент, насколько это было в наших силах. Теперь единственная проблема в том, что мы также объединили все проблемы под одним знаменем. Хотя это и не конец света, в обозримом будущем нас ждут непростые времена."
 GRN_domestic_and_civil_affairs_administration: "Администрация по внутренним и гражданским делам"
 GRN_domestic_and_civil_affairs_administration_desc: "Гренландия сталкивается с рядом проблем, и в основе этого лежит низкая численность населения. Администрация по внутренним и гражданским делам призвана защищать интересы граждан Гренландии и со временем реформировать, дополнять или отменять политику, чтобы обеспечить наилучшие и наиболее справедливые результаты для жителей острова."
 GRN_federal_budgets: "Национальные расходы"
 GRN_federal_budgets_desc: "На острове проживает немного людей, но его содержание и развитие требуют значительных затрат. Для обеспечения стабильного финансового будущего нам необходимо изучить более эффективные методы развития или улучшить бюджетную политику."
 GRN_revenue_collection_administration: "Администрирование сбора доходов"
 GRN_revenue_collection_administration_desc: "RCA назначена органом национального правительства по сбору и контролю налогов. Она должна сотрудничать с лицами, принимающими решения в правительстве, чтобы обеспечить справедливое и эффективное взимание налогов, а также надлежащее их исполнение для обеспечения сбалансированного национального бюджета."
 GRN_economic_development_board: "Совет по экономическому развитию"
 GRN_economic_development_board_desc: "Департамент экономического развития (EDB) является основой экономической политики и общего национального роста и развития. Эта часть правительства ставит перед собой задачу проводить политику и программы, направленные на укрепление национальной экономики, а также на повышение качества жизни граждан, где это возможно. Хотя логистические сложности являются самым большим препятствием в этом отношении, другие проблемы — это не только нехватка рабочей силы и капитала, но и непреодолимая воля к реализации этих планов."
 GRN_national_armed_services_of_greenland: "Национальные вооруженные силы Гренландии"
 GRN_national_armed_services_of_greenland_desc: "Вооруженные силы Гренландии — интересная структура, поскольку население острова настолько мало, что их возможности ограничены. Тем не менее, на острове есть определенные военные силы, и теоретически он способен их расширить. Теперь лишь будущее покажет, как именно произойдет это расширение."
 GRN_idea_the_great_ice_shelf: "Большой шельфовый ледник"
 GRN_idea_the_great_ice_shelf_desc: "Шельфовый ледник Гренландии — один из крупнейших в мире ледяных массивов, покрывающих значительную часть суши. Глубина ледника может достигать двух миль, и он является самым большим препятствием для любого серьезного развития за пределами прибрежных районов."
