 anti_infantry_tank_ammo_3_desc: "Munitions de pointe conçues pour engager et neutraliser efficacement l'infanterie en guerre moderne. Ces obus offrent des capacités avancées de fragmentation et d'effet de zone."
 anti_vehicle_tank_ammo_3: "Munitions antivéhicules modernes"
