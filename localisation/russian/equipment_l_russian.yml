 GER_MBT_1: "Leopard 1"
 GER_MBT_1_desc: "Leopard (или Leopard 1) — основной боевой танк, разработанный и произведённый компанией Porsche в Западной Германии, который впервые поступил на вооружение в 1965 году. Разработанный в эпоху, когда считалось, что кумулятивные боеприпасы делают обычную тяжёлую броню малоэффективной, Leopard сосредоточился на огневой мощи в виде немецкой версии британской 105-мм пушки L7 и улучшенных характеристиках проходимости, не имевших аналогов в других конструкциях того времени."
 GER_MBT_1_short: "Leopard 1"
 GER_MBT_2: "Leopard 1A5"
 GER_MBT_2_desc: "В 1980 году была начата исследовательская программа по изучению дальнейших усовершенствований Leopard 1, чтобы оснастить его полностью современной системой управления огнём и полностью эффективной системой ночного видения и видения в плохую погоду. Было принято решение основывать модернизацию на более ранних моделях, которые больше не были конкурентоспособными. Получившийся Leopard 1A5 был создан на базе 1225 машин модели Leopard 1A1A1. Башни снова были модифицированы для 1A5 — как для размещения всего нового оборудования, так и для перемещения большей части боеприпасов в кормовую часть башни, а не слева от механика-водителя, где они хранились ранее."
 GER_MBT_2_short: "Leopard 1A5"
 GER_MBT_3: "Leopard 2A4"
 GER_MBT_3_desc: "Самая распространённая версия семейства Leopard 2, модели 2A4 включали в себя более существенные изменения, включая автоматизированную систему пожаротушения и подавления взрывов, полностью цифровую систему управления огнем, способную обрабатывать новые типы боеприпасов, и улучшенную башню с плоской титаново-вольфрамовой броней. Leopard 2 были изготовлены в восьми партиях в период с 1985 по 1992 год. Все старые модели были модернизированы до стандарта 2A4. До 1994 года Германия эксплуатировала в общей сложности 2125 машин 2A4."
 GER_MBT_3_short: "Leopard 2A4"
 GER_MBT_4: "Leopard 2A6"
 GER_MBT_4_desc: "Leopard 2A6 включает в себя добавление гладкоствольной пушки Rheinmetall 120 мм L/55 и другие изменения."
 GER_MBT_4_short: "Leopard 2A6"
 GER_MBT_5: "Leopard 2A7+"
 GER_MBT_5_desc: "Leopard 2A7+ предназначен для работы как в условиях конфликтов низкой, так и высокой интенсивности. Защита танка была повышена за счет модульной брони; лобовая защита была улучшена за счет двойного комплекта на башне и передней части корпуса, в то время как 360-градусная защита от РПГ и противоминная защита повышают живучесть танка в городских условиях. Компоненты системы модульной брони впервые были использованы Канадой в Афганистане. Он может стрелять программируемыми боеприпасами HE, а установленный на башне MG3 был заменен стабилизированной дистанционно управляемой боевой станцией FLW 200. Также были улучшены мобильность, устойчивость и ситуационная осведомленность."
 GER_MBT_5_short: "Leopard 2A7+"
