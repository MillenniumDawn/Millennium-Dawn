 ukraine_reorganize_navy_built_simferopol_recon_ship.1.name: "Симферополь — корпус на Рыбальском стапеле"
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.desc: "Завод заложил 347 таких судов с 1971 года и знает чертежи наизусть. Прямо сейчас на стапеле стоит недостроенный 502ЭМ — рыболовное судно, но рыболовное судно с нужными нам водоизмещением, дальностью и автономностью.\n\nАльтернатива — заложить новый киль по тем же чертежам 502ЭМ, а не достраивать брошенный корпус. Завод будет в восторге. Министерство финансов — нет."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.a: "Переоборудовать корпус траулера."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.b: "Заложить новый киль по тем же чертежам."
 ukraine_reorganize_navy_built_simferopol_recon_ship.1.c: "У флота есть более срочные нужды."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.name: "Симферополь — чем он слушает"
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.desc: "Корпус — самая дешёвая часть. Корабль — это его антенны, и весь вопрос в том, чьи это антенны.\n\nНаши собственные институты способны построить пассивный комплекс: радиотехническая разведка в нескольких диапазонах, классификация, пеленгование. Это займёт больше времени, зато будет нашим. Западный комплекс РТР пришёл бы уже собранным, испытанным и дорогим — и с условиями в придачу."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.a: "Установить отечественный комплекс."
 ukraine_reorganize_navy_built_simferopol_recon_ship.2.b: "Купить западный комплекс РТР."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.name: "Симферополь — вниз по Днепру"
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.desc: "Он сходит со стапеля на Рыбальском. Теперь неудобная часть: завод в Киеве, флот — на Чёрном море, а между ними шестьсот километров реки с мостами над ней.\n\nБезопасный ответ — плавучий док до самого Херсона и дальше в море. Дешёвый ответ — вести его на собственном корпусе и надеяться, что осадка и высота под мостами сойдутся."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.a: "Перевести его в плавучем доке."
 ukraine_reorganize_navy_built_simferopol_recon_ship.3.b: "Провести его на собственном корпусе."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.name: "Симферополь — на мели на Днепре"
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.desc: "Он застрял ниже Херсона с повреждением движительно-рулевого комплекса и с крайне смущённой перегонной командой. Завод говорит, что это поправимо. Завод всегда так говорит."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.a: "Оплатить ремонт."
 ukraine_reorganize_navy_built_simferopol_recon_ship.4.b: "Оставить его в Херсоне."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.name: "Симферополь — переход завершён"
 ukraine_reorganize_navy_built_simferopol_recon_ship_program_over_flag: "Программа разведывательного корабля §YСимферополь§! завершена"
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.desc: "Мы наконец успешно провели наш новейший разведывательный корабль вниз по Днепру — без единого происшествия! Теперь можно начинать подготовку экипажа, а после этого — наконец использовать этот ценный корабль на благо флота."
 ukraine_reorganize_navy_built_simferopol_recon_ship.5.a: "Наконец-то!"
 UKR_lahuna_program_over: "Мы завершили строительство разведывательного корабля «Симферополь»"
 UKR_modernize_t55_64: "Разработка §YТ-55-64§!"
 UKR_modernize_t55_64_desc: "Т-55-64 — украинская переделка, ставящая башню Т-64 и связанные с ней системы на корпус Т-55.\nПрограмма использует имеющиеся шасси Т-55, давая машине огневую мощь и защиту уровня Т-64.\nОна задумывалась как более дешёвый способ сохранить боевую ценность старых танков без полной перестройки в Т-64."
 UKR_5BrPrK: "5-я бригада пограничных кораблей"
 UKR_develop_bmp64: "Разработка §YБМП-64§!"
 UKR_develop_bmp64_flag: "Завершено принятие решения §YРазработка БМП-64§!"
 UKR_develop_bmp64_desc: "БМП-64 — экспериментальная тяжёлая боевая машина пехоты, разработанная харьковскими конструкторами на шасси Т-64. При переделке снимается штатная танковая башня, а корпус перекомпоновывается так, чтобы обеспечить защищённое десантное отделение, при этом сохраняется большая часть тяжёлого шасси и защиты танка. Первый прототип получил дистанционно управляемый боевой модуль и кормовые двери для посадки, заложив базовую концепцию украинской тяжёлой боевой машины пехоты."
 UKR_develop_bmp64d: "Разработка §YБМП-64Д§!"
 UKR_develop_bmp64d_desc: "БМП-64Д — развитие исходной концепции БМП-64. Машина получает расширенный боевой модуль с дополнительными противотанковыми и зенитными возможностями, а также улучшенную защиту и оборудование. Проект представляет собой попытку превратить шасси Т-64 в универсальную тяжёлую пехотную платформу, способную поддерживать войска и сохраняющую живучесть корпуса танкового происхождения."
 UKR_develop_bmpt64: "Разработка §YБМПТ-64§!"
 UKR_develop_bmpt64_desc: "БМПТ-64 — дальнейшее развитие украинской тяжёлой боевой машины пехоты на базе Т-64. Переработанный корпус и необитаемая башня улучшают внутреннюю компоновку, а кормовая аппарель обеспечивает более удобный доступ в десантное отделение. Машина вобрала технологии, созданные для других украинских программ модернизации Т-64, включая улучшенную защиту и боевое оснащение. БМПТ-64 стала одной из самых совершенных концепций семейства УМР-64."
 UKR_develop_bmpk64: "Разработка §YБМП-К-64§!"
 UKR_develop_bmpk64_desc: "БМП-К-64 — необычная колёсная версия семейства боевых машин пехоты на базе Т-64. Исходное гусеничное шасси основательно переработано в платформу 8x8, а двигатель и трансмиссия приспособлены для привода колёс. Получившаяся машина заметно легче и быстрее гусеничных аналогов и при этом сохраняет значительную защиту, унаследованную от исходного танкового шасси. Прототип продемонстрировал стремление Украины использовать стареющие корпуса Т-64 как основу для новых бронемашин."
 UKR_develop_t72ag: "Разработка §YТ-72АГ§!"
 UKR_develop_t72ag_desc: "Т-72АГ — украинская экспортная модернизация Т-72 с использованием технологий, созданных для Т-80УД и Т-84. Модернизация существенно улучшает силовую установку, аппаратуру управления огнём, защиту и прочие системы, сохраняя исходные корпус и башню Т-72. Проект представляет собой одну из ранних украинских попыток соединить танковые платформы советской эпохи с отечественными постсоветскими технологиями."
 UKR_develop_t72_120: "Разработка §YТ-72-120§!"
 UKR_develop_t72_120_desc: "Т-72-120 — украинская экспортная модернизация, призванная приблизить платформу Т-72 к западным стандартам эксплуатации. Самая характерная её черта — переработанная кормовая ниша башни с автоматом заряжания и отделённым отсеком боеприпасов. Вместе с модернизированной системой управления огнём и вспомогательными системами проект демонстрирует амбициозную попытку приспособить советскую конструкцию Т-72 для зарубежных заказчиков."
 UKR_develop_t72ua1: "Разработка §YТ-72УА1§!"
 UKR_develop_t72ua1_desc: "Т-72УА1 — экономичная украинская модернизация Т-72, разработанная прежде всего для зарубежных заказчиков. Программа сосредоточена на улучшении подвижности, защиты, приборов наблюдения и управления огнём при сохранении базовой архитектуры Т-72. Её подход делает ставку на практический ремонт и модернизацию имеющихся машин, а не на создание совершенно нового танка."
 UKR_develop_t80_2019: "Разработка §YТ-80БВМ обр. 2019§!"
 UKR_develop_t80_2019_desc: "Т-80БВ обр. 2019 — модернизация Т-80БВ, выполненная для украинских десантно-штурмовых и морских пехотных частей. Программа вводит современную тепловизионную аппаратуру, обновлённые системы связи и навигации, а также улучшенную защиту и другие модернизированные узлы. Она сочетает подвижность Т-80 с оборудованием, созданным на основе более широкого украинского опыта модернизации бронетанкового парка."
 UKR_develop_skif: "Разработка БТР §YСкиф§!"
 UKR_develop_skif_desc: "«Скиф» — новый украинский гусеничный бронетранспортёр, разработанный компанией UkrArmoTech. Машина построена вокруг переднего моторного отделения и кормового десантного отделения с аппарелью, а её модульное шасси рассчитано на целое семейство машин. Прототип получил корпус из алюминиевой брони и современные украинские системы связи, навигации и электроники. Заводские испытания начались в 2026 году, когда компания приступила к оценке подвижности и общей конструкции платформы."
 UKR_develop_kevlar_e: "Разработка §YКевлар-Е§!"
 UKR_develop_kevlar_e_desc: "«Кевлар-Е» — украинская боевая машина пехоты, созданная переделкой шасси самоходной гаубицы 2С1. При перекомпоновке силовая установка переносится вперёд, а в корме образуется более просторное защищённое десантное отделение. Разнесённое бронирование, дополнительная внутренняя защита и дистанционно управляемая башня превращают артиллерийское шасси в современную пехотную платформу. Проект показывает, как стареющие советские машины можно переделать в новые бронированные платформы."