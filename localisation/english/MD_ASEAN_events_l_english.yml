l_english:

 asean.1.t: "An Invitation from ASEAN"
 asean.1.d: "[FROM.GetName], speaking for the chair, has sent a formal invitation for us to join the Association. Membership would bring the safety net, trade access, and the diplomatic weight of a bloc that includes seventy percent of the population of maritime Asia. It would also bind us to consensus, non-interference, and the need for ten capitals to speak as one."
 asean.1.a: "Accept the invitation."
 asean.1.b: "Decline for now."

 asean.2.t: "A New Member Is Seated"
 asean.2.d: "Jakarta holds the accession ceremony this morning. The Association's flag adds a stripe, and the new member's minister signs the instrument in the Secretariat chamber. ASEAN grows by one member. The meeting room changes only as far as the existing members had prepared for."
 asean.2.a: "Note the new count."

 asean.3.t: "The Invitation Is Declined"
 asean.3.d: "[FROM.GetName]'s foreign ministry has returned the letter with regret. The stated reasons are diplomatic. The unstated reasons are the ones that decide the file. The chair's office records the reply and stores it. The members can reopen the invitation later."
 asean.3.a: "File the reply."

 asean.4.t: "A Bilateral Offer"
 asean.4.d: "[FROM.GetName]'s foreign minister has arrived in the capital without ceremony. The demarche is off the record and the terms are plain. If we return to the table on the pending file, the summit record will drop specific breaches of ours. The window lasts thirty days."
 asean.4.a: "Take the offer."
 asean.4.b: "Keep the present course."

 asean.5.t: "A Joint Exercise Offer"
 asean.5.d: "[FROM.GetName]'s defence ministry proposes a joint exercise under the ADMM framework. Both militaries would drill together and bank the kind of interoperability that matters if a real crisis arrives. The invitation carries no further obligation."
 asean.5.a: "Join the exercise."
 asean.5.b: "Decline the invitation."

 asean.6.t: "The Secretariat's Quarterly Bulletin"
 asean.6.d: "The Secretariat circulates its quarterly report on treaty implementation, working groups, and the calendar of meetings ahead. Nothing in it changes our position. The paperwork exists so the members have a shared record to work from."
 asean.6.a: "File the report."

 asean.7.t: "A Counterterrorism Partnership"
 asean.7.d: "[FROM.GetName]'s security services propose a counterterrorism partnership under the Convention on Counter Terrorism. Shared watchlists, joint training slots, and a direct liaison line would lower what our own police and internal security services cost to run."
 asean.7.a: "Accept the partnership."
 asean.7.b: "Decline the partnership."

 asean.8.t: "Codify the Reef Claim"
 asean.8.d: "The Foreign Ministry has drafted language that formally codifies our exclusive economic zone claim over the disputed reefs. A formal claim gives our people something to rally behind if the dispute ever turns into a fight. Publishing it also invites Beijing's reaction, and leaving it unpublished settles nothing."
 asean.8.a: "Codify the claim."
 asean.8.b: "Leave it unpublished."

 asean.9.t: "The Malacca Patrol Rotation"
 asean.9.d: "The Malacca patrols already run under Malaysian, Singaporean, and Indonesian flags, and the rotation has room for one more. Joining puts our own vessels into the strait's busiest lanes. Staying outside leaves the patrol schedule to the members already on it."
 asean.9.a: "Join the rotation."
 asean.9.b: "Stay outside it."

 asean.10.t: "The AHA Centre Requests Access"
 asean.10.d: "[FROM.GetName] has invoked Flexible Engagement and asked the AHA Centre to bring relief teams across our border after the storm. Non-interference stretches far enough to let the relief convoys in. It does not stretch far enough to make the decision automatic."
 asean.10.a: "Grant humanitarian access."
 asean.10.b: "Deny humanitarian access."

 asean.11.t: "An IAI Infrastructure Grant"
 asean.11.d: "The Initiative for ASEAN Integration (IAI) offers a grant toward our roads, ports, or grid, the kind of gap-narrowing work the programme exists to fund. Accepting marks us as a recipient on the programme's books for the next five years."
 asean.11.a: "Accept the grant."
 asean.11.b: "Decline the grant."

 asean.20.t: "The Bangkok Treaty Protocol"
 asean.20.d: "The Association's Secretary-General has arrived in the capital with the SEANWFZ protocol and thirty minutes on the schedule. Ten member states have signed. Every other nuclear-weapon-free zone already has this signature. The stated objection is the transit of submarines. The government needs an answer for the record."
 asean.20.a: "Sign the protocol."
 asean.20.b: "Defer the signature."

 asean_summit.1.t: "The [GetYear] Summit Convenes"
 asean_summit.1.d: "The delegations arrive at the appointed venue. The chair opens with the usual address. The agenda has circulated for months, the corridor bilaterals for weeks, and the draft communiqué for days. The members will decide the year's main act this week."
 asean_summit.1.a: "The chair opens the session."

 asean_summit.2.t: "The Summit Closes"
 asean_summit.2.d: "The chair reads the joint communiqué. The press conference lasts twenty minutes and answers half the questions. Regional outlets already have working translations, and the international press files by evening. The Secretariat starts turning the paragraphs into work items."
 asean_summit.2.a: "Issue the communiqué."

 asean_summit.10.t: "A Bilateral on the Margins"
 asean_summit.10.d: "[FROM.GetName]'s delegation meets ours in a side room the schedulers did not book. Staff bring coffee without a request. The two sides discuss the file that neither foreign minister wanted to raise in plenary. They write the understanding on the back of a menu."
 asean_summit.10.a: "Record the understanding."

 asean_crisis.1.t: "The Shoal Incident"
 asean_crisis.1.d: "Chinese coast guard vessels have again driven our fishing boats off the reef. Photographs are already on the wires. The foreign ministry summons the ambassador before the day's news cycle ends. Officials must decide whether to raise the incident through ASEAN in Manila or handle it directly in Beijing."
 asean_crisis.1.a: "Raise it in Beijing."
 asean_crisis.1.b: "Raise it in Manila."
 asean_crisis.1.c: "Leave the incident alone."

 asean_crisis.2.t: "The Chair Tables the Language"
 asean_crisis.2.d: "[FROM.GetName]'s foreign ministry has asked the summit communiqué to mention the reef dispute. The chair puts that paragraph on the drafting table. Every delegation reads it. One delegation will move to strike it. The Secretariat is already preparing a version that omits the paragraph."
 asean_crisis.2.a: "Table the paragraph."

 asean_crisis.3.t: "No Joint Communiqué"
 asean_crisis.3.d: "For the first time in ASEAN's history, the summit ends without a joint communiqué. [FROM.GetName] refused any reference to the South China Sea in the final text. The chair reads a summary statement instead. Regional newspapers report the failure. The Chinese foreign ministry issues no comment."
 asean_crisis.3.a: "Close without a text."

 asean_crisis.10.t: "Emergency Summit"
 asean_crisis.10.d: "ASEAN meets in an unscheduled session. Either the core has sat below the floor for a year, or Indonesia is preparing to leave, or two members are firing across a border. The chair opens with a blunter speech than usual. The decisions of the next four days will decide what the Association still is at the end of the week."
 asean_crisis.10.a: "Keep the Association intact."
 asean_crisis.10.b: "Prepare the mainland successor."
 asean_crisis.10.c: "Prepare the maritime successor."

 asean_crisis.11.t: "The Association Dissolves"
 asean_crisis.11.d: "The joint statement is short. The Secretariat will stay open in a caretaker role until the end of the year. Member states are to consider their next arrangements. The successor groups will meet separately in Bangkok and Manila within the month."
 asean_crisis.11.a: "Note the dissolution."

 asean_crisis.12.t: "Bangkok's Choice"
 asean_crisis.12.d: "The mainland group meets in Bangkok next week. The maritime group meets in Manila the week after. Both have sent formal invitations to the Foreign Ministry, and both invitations were expected. Thailand is the swing state. The room we join will set the map."
 asean_crisis.12.a: "Join the mainland group."
 asean_crisis.12.b: "Join the maritime group."
 asean_crisis.12.c: "Join neither group."

 asean_crisis.20.t: "The Junta in Naypyidaw"
 asean_crisis.20.d: "The Tatmadaw has arrested the civilian government overnight. The State Administration Council now claims to be the state. Refugees will cross our borders within weeks. The summit will not be able to ignore the coup. The flexible-engagement debate is no longer academic. It is the file on the desk."
 asean_crisis.20.a: "Call a suspension vote."
 asean_crisis.20.b: "Uphold the ASEAN Way."
 asean_crisis.20.c: "Table the Five-Point Consensus."

 asean_crisis.21.t: "The Ballot on Suspension"
 asean_crisis.21.d: "The motion to suspend [FROM.GetName] from ASEAN summits is on the floor. The chair calls the roll. The summit minutes will record the vote, and the numbers will leak before the meeting ends. Other governments will read our vote against every later position we take."
 asean_crisis.21.a: "Vote for suspension."
 asean_crisis.21.b: "Vote against."
 asean_crisis.21.c: "Abstain."

 asean_crisis.22.t: "The Seat Is Barred"
 asean_crisis.22.d: "ASEAN has suspended [FROM.GetName] from all summits and ministerial meetings until further notice. The seat stays empty, the flag stays in the hall, and the foreign ministry receives no invitation. The Charter has no expulsion clause. The summit used suspension instead."
 asean_crisis.22.a: "Leave the seat empty."

 asean_crisis.30.t: "The Second Crisis"
 asean_crisis.30.d: "The baht is under pressure again. The peso followed within the hour. The rupiah is next. The 1997 pattern is repeating. The difference is that a regional safety net now exists. The next thirty days will show whether that net works."
 asean_crisis.30.a: "Draw on Chiang Mai."

 asean_crisis.31.t: "The Facility Is Drawn"
 asean_crisis.31.d: "We activate our line against the common pool. The money arrives faster than a Fund disbursement would have. The surveillance office is already on the way, the conditions are lighter and known in advance, and the markets settle within a week. ASEAN has come through the crisis the pool was built to handle."
 asean_crisis.31.a: "Confirm the drawdown."
