l_english:
 egypt_focus: "Egyptian Focus Tree"
 #Focuses
EGY_egyptian_politics: "Egyptian Politics"
EGY_egyptian_politics_desc: "The time has come for us to focus on political affairs."
EGY_Hosni_mubarak: "Hosni Mubarak's Government"
EGY_Hosni_mubarak_desc: "Hosni Mubarak is the long-serving President of Egypt, having assumed office in 1981. Known for his leadership stability, Mubarak has maintained Egypt's role as a key player in the Middle East."
EGY_reform_legisl: "Constitutional Amendment"
EGY_reform_legisl_desc: "Prior to this new proposal, opposition candidates were not permitted to run for President, with the position instead being reaffirmed via referendum in the People's Assembly at regular six-year intervals. This will change after a constitutional amendment which will transform it into a de jure elected office accountable to the Egyptian people."
EGY_state_security_service: "National Security Agency"
EGY_state_security_service_desc: "The National Security Agency is an Egyptian security service, the main domestic security agency of Egypt and the successor of the State Security Investigations Service. Its main responsibilities are counter-intelligence, internal and border security, counter-terrorism, and surveillance."
egyptian_intelligenc_idea: "National Security Agency"
egyptian_intelligenc_idea_desc: "The National Security Agency is an Egyptian security service, the main domestic security agency of Egypt and the successor of the State Security Investigations Service. Its main responsibilities are counter-intelligence, internal and border security, counter-terrorism, and surveillance."
EGY_affirm_friend_us: "Affirm Friendship With U.S."
EGY_affirm_friend_us_desc: "Our relations with the United States are a long story of successful cooperation and similar views on the geopolitical landscape. We need to strengthen our friendship."
Egypt.2.t: "Condemning the U.S. Invasion of Iraq"
Egypt.2.d: "Although the U.S. is not our enemy, the invasion of Iraq is an example of irresponsible decision-making. We don't want further radicalization of Middle Eastern society, therefore we may attempt to show the U.S. that we are against such actions."
Egypt.2.a: "Let's issue a diplomatic protest."
Egypt.2.b: "How about secretly supporting Iraq?"
Egypt.3.t: "Egypt Condemns War in Iraq!"
Egypt.3.d: "One of our closest allies in the Middle East, Egypt, has issued a diplomatic protest against our invasion of Iraq. They have promised not to materially support Iraq by any means, however, they said that such wars will destabilize the Middle East."
Egypt.3.a: "Very Unfortunate."
Egypt.4.t: "Secret Support From Egypt!"
Egypt.4.d: "We have never met, and we have never seen each other. Okay?"
Egypt.4.a: "Thanks, brothers!"
USA_wot_iraqi_freedom: "Operation Iraqi Freedom Has Started"
Egypt.5.a: "Sure!"
Egypt.6.a: "Ugh"
