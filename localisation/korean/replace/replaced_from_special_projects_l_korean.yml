 sp_land_generic_reward_resource_scarcity: "자원 부족"
 sp_land_generic_reward_critical_failure: "치명적 실패"
 sp_caseless_ammunition_reward_new_propellant: "신형 추진제"
 sp_caseless_ammunition_reward_new_propellant_desc: "우리 기술자들이 과열 방지에 도움이 될 내열성 추진제를 발견했습니다."
 sp_fire_support_land_drone_reward_improved_communication: "새로운 드론 통신 방식"
 sp_fire_support_land_drone_reward_improved_communication_civilian_application: "민간부문 적용"
 sp_fire_support_land_drone_reward_improved_communication_military_application: "군사적 적용"
 sp_fire_support_land_drone_reward_improved_communication_tech_bonus: "향상된 무선 통신"
 sp_tactical_augmented_reality_reward_civilian_interest: "민간의 관심"
 sp_tactical_augmented_reality_reward_civilian_interest_desc: "한 기술 기업이 군의 증강현실 연구 프로젝트에 관심을 보이고 있습니다. 이 기업은 민간과 군수 산업 복합체 사이의 협력을 늘리고자 합니다. 민간 부문에 하드웨어를 공급하는 공장을 세울 수도 있고, 이 기업의 자원을 활용해 군용 장비 생산을 도울 수도 있습니다."
 sp_tactical_augmented_reality_reward_civilian_interest_civ_factory: "민간 투자"
 sp_tactical_augmented_reality_reward_civilian_interest_mil_factory: "군사 투자"
 sp_double_shot_rifle_reward_double_shot_type: "이중 사격 방식"
 sp_double_shot_rifle_reward_double_shot_type_desc: "우리 기술자들에게 두 기업이 접근해 왔으며, 각각 초탄 화력을 높이는 고유의 방식을 제안하고 있습니다. 한 기업은 짧은 간격으로 연발 사격이 가능한 쌍열 총열 돌격소총을 설계하겠다고 합니다. 다른 기업은 도르래 장치를 적용해 한 번의 동작으로 노리쇠가 두 번 순환하여 두 발을 빠르게 연속 발사하는 방식을 제안합니다. 어느 쪽을 선택해야 할까요?"
 sp_double_shot_rifle_reward_double_shot_type_double_barrel: "쌍열 총열"
 sp_double_shot_rifle_reward_double_shot_type_pulley: "도르래 장치"
 sp_double_shot_rifle_reward_improved_firing_rate: "향상된 발사 속도"
 sp_double_shot_rifle_reward_improved_firing_rate_desc: "특수 부대를 위한 고속 발사 무기를 개발하던 중, 우리 기술자들이 정확도를 해치지 않고 기존 보병 무기의 발사 속도를 높이는 방법을 알아냈습니다. 이 방식은 주력 돌격소총이나 지원 기관총 중 한쪽에 적용할 수 있습니다."
 sp_double_shot_rifle_reward_improved_firing_rate_offence: "돌격소총"
 sp_double_shot_rifle_reward_improved_firing_rate_defence: "기관총"
 sp_experimental_exoskeleton_reward_engineers: "육군 공병대의 관심"
 sp_experimental_exoskeleton_reward_engineers_desc: "육군 공병대가 우리의 외골격 프로젝트에 관심을 보이고 있습니다. 착용자의 힘을 높여 주는 외골격이 있다면 전투 공병의 효율을 높일 수 있을 것입니다. 방어 시설 구축에 뛰어난 장비를 개발할 수도 있고, 손상된 군 장비의 회수를 돕는 장비를 개발할 수도 있습니다."
 sp_experimental_exoskeleton_reward_engineers_defence: "방어 시설 구축용 장비"
 sp_experimental_exoskeleton_reward_engineers_recovery: "회수용 장비"
 sp_tank_support_drones_reward_improved_visibility: "시야 개선"
 sp_tank_support_drones_reward_improved_visibility_desc: "신형 전차 지원 드론의 시각 표시 장치를 개발하던 중, 우리 기술자들이 전차 승무원이 차량 밖을 볼 수 있는 능력을 향상시켜 줄 카메라 체계를 개척했습니다."
 sp_tank_support_drones_reward_improved_targeting: "개선된 표적 기술"
 sp_tank_support_drones_reward_improved_targeting_desc: "전투 드론의 위협 식별 소프트웨어를 개발하던 중, 우리 기술자들이 현재 전차 소프트웨어와 호환되는 버전을 만들어 냈습니다. 이를 통해 전차의 표적 지정 컴퓨터를 개선할 수 있을 것입니다."
 sp_active_camouflage_reward_vehicle_protection: "차량 적용 위장"
 sp_active_camouflage_reward_vehicle_protection_desc: "개인 위장 장비에 관해 진행 중인 연구의 일부는 차량에도 적용할 수 있습니다. 지상의 적 또는 공중의 적 중 어느 쪽으로부터 차량을 숨기는 데 우선순위를 둘 수 있습니다."
 sp_active_camouflage_reward_vehicle_protection_ground: "지상의 적"
 sp_active_camouflage_reward_vehicle_protection_ground_air: "공중의 적"
 sp_active_protection_systems_reward_improved_targeting: "개선된 표적 기술"
 sp_active_protection_systems_reward_improved_targeting_desc: "우리 기술자들이 날아오는 발사체를 탐지하는 새로운 체계를 개발했습니다. 이 알고리즘 일부를 항공기 탐지 개선에도 활용할 수 있을 것으로 이론화하고 있습니다."
 sp_tank_electric_engine_hybrid_mode: "엔진 개선"
 sp_tank_electric_engine_hybrid_mode_desc: "전기 엔진 개발 경험을 응용하여, 기존 디젤 및 터빈 엔진 모델을 한층 더 개선할 수 있게 되었습니다."
 sp_tank_aa_launchers_reward_multi_launcher_missile: "개조형 미사일"
 sp_tank_aa_launchers_reward_multi_launcher_missile_desc: "전차용 지대공 미사일 발사기를 개발하던 중, 우리 기술자들이 포신 발사식 미사일을 잠시 실험해 보았습니다. 최적은 아니지만 대부분의 전차 포신에 맞는 미사일을 개발할 수 있다고 판단했습니다. 마찬가지로 이 미사일을 여러 세대의 휴대용 방공 미사일(MANPADS)에 호환되도록 만들 수도 있습니다."
 sp_tank_aa_launchers_reward_utlise_in_tanks: "포신 발사식으로 만들기"
 sp_tank_aa_launchers_reward_utilise_in_manpads: "세대 간 호환형으로 만들기"
 sp_tank_self_sharpening_ammo_reward_improved_alloys: "개량 합금"
 sp_tank_self_sharpening_ammo_reward_improved_alloys_desc: "텅스텐 관통자의 미세 구조를 개선하는 새로운 열처리 방법을 연구하던 중, 우리 재료 공학자들이 장갑판 처리에도 쓸 수 있는 열처리 방법을 발견했습니다."
 sp_super_heavy_tank_turrets_reward_turret_ring: "강화된 포탑 링"
 sp_super_heavy_tank_turrets_reward_turret_ring_desc: "더 무거운 포탑의 과제는 하중을 견디면서 적절한 속도로 움직이는 포탑 링을 만드는 것입니다. 초중량 포탑을 개발하며 몇 가지 교훈을 얻었으며, 이 지식을 포탑의 회전 속도 향상 또는 내구성 향상에 적용할 수 있습니다."
 sp_super_heavy_tank_turrets_reward_turret_ring_speed: "포탑 회전 속도 향상"
 sp_super_heavy_tank_turrets_reward_turret_ring_armour: "포탑 링 장갑 증가"
 sp_double_barrel_cannons_reward_improved_autoloader: "개량형 자동 장전기"
 sp_double_barrel_cannons_reward_improved_autoloader_desc: "쌍열포 재장전 체계를 연구하던 중, 우리 기술자들이 전차용 개량형 자동 장전기를 개발했습니다."
 sp_railgun_cannon_reward_improved_barrel: "개량형 포신"
 sp_railgun_cannon_reward_improved_barrel_desc: "레일건에서 발생하는 엄청난 열을 견딜 수 있는 포신을 연구하던 중, 우리 기술자들이 그 성과의 일부를 기존 포신 개량에 활용할 수 있었습니다."
 sp_railgun_cannon_2_reward_improved_barrel: "개량형 포신"
 sp_railgun_cannon_2_reward_improved_barrel_desc: "레일건에서 발생하는 엄청난 열을 견딜 수 있는 포신을 연구하던 중, 우리 기술자들이 그 성과의 일부를 기존 포신 개량에 활용할 수 있었습니다."
 sp_tank_based_laser_main_cannons_reward_air_defence: "대공 방어 레이저"
 sp_tank_based_laser_main_cannons_reward_air_defence_desc: "레이저 기반 무기의 발전으로, 우리 기술자들이 공중 표적을 격추할 수 있는 레이저를 개발했습니다."
 sp_truck_modular_seating_reward_quick_release_belt: "급속 해제식 안전벨트"
 sp_truck_modular_seating_reward_quick_release_belt_desc: "모듈식 좌석을 연구하던 중, 우리 기술자들이 새로운 4점식 안전벨트 급속 해제 장치를 개발했습니다. 이로써 차량에서 부상 인원을 후송하기가 훨씬 쉬워질 것입니다."
 sp_utility_vehicle_electric_engines_reward_fuel_efficiency: "연료 효율 개선"
 sp_utility_vehicle_electric_engines_reward_fuel_efficiency_desc: "신형 배터리 유형을 개발하는 과정에서 얻은 성과를 민간 분야에도 활용할 수 있는 방법을 찾아냈습니다."
 sp_utility_vehicle_electric_engines_reward_fuel_efficiency_option_tech_bonus: "연료 효율 개선"
 sp_automatic_twin_barrel_mortar_turret_reward_improved_mortars: "개량형 박격포"
 sp_automatic_twin_barrel_mortar_turret_reward_improved_mortars_desc: "박격포 두 문이 동시에 발사하도록 만드는 방법을 연구한 결과, 보병을 위한 더 나은 박격포 체계를 개발할 수 있게 되었습니다."
