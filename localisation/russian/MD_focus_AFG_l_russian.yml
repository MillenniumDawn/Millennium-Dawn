 AFG_ai_Weight_effect_India_aid: "Их готовность принять предложение по умолчанию §Gвысокая§!\n\nОни с меньшей вероятностью согласятся, если:\n§R -Мы не придерживаемся одинакового мировоззрения\n -У них плохое мнение о [AFG.GetNameDefCap]§!"
 AFG_available_as_leaderTT: "§GДоступен§! как §YПолитический лидер§!"
 AFG_available_as_MillleaderTT: "§GНазначен§! как §YВерховный военный командующий§!"
 AFG_import_westernism: "Импорт западничества"
 AFG_import_westernism_desc: "Афганистан долгое время придерживался своих традиционных ценностей. Однако недавняя открытость новым идеям позволила нам выборочно включать аспекты западных концепций. Такой подход позволяет нам черпать из разнообразного спектра западных идей, выбирая те, которые соответствуют нашим уникальным потребностям, и отвергая те, которые не соответствуют нашему контексту."
 AFG_atta_installs_leadership: "Атта Мухаммад Нур берет на себя руководство"
 AFG_atta_installs_leadership_desc: "Пройдя путь от военачальника до командующего, Атта Мухаммад Нур не слишком-то радуется успехам."
 AFG_liberal_society: "Либеральное общество"
 AFG_afghan_morning_taliban_by_night: "Днём — А.Н.А., ночью — талибы"
 AFG_afghan_morning_taliban_by_night_desc: "Многие наши военнослужащие в Афганской национальной армии ведут двойную жизнь. Многие из них состоят в «Талибане», одновременно служа в армии, что даёт «Талибану» значительное преимущество перед нашими силами. Эта коррупция привела к массовому взяточничеству в наших вооружённых силах и значительно подорвала боевой дух солдат, сражающихся за страну."
 AFG_safed_koh_supply_network: "Сеть поставок Safed Koh"
 AFG_safed_koh_supply_network_desc: "Благодаря сложной сети дорог, гор и подземных пещер система снабжения Цейлона смягчила последствия сурового и изолированного рельефа региона."
 AFG_tal_insurgency_new: "[TAL.GetFlag] Мятеж талибов"
 AFG_tal_insurgency_new_desc: "После нескольких поражений талибы отступили на восточные окраины Афганистана. Они окопались, готовясь к затяжной и кровопролитной партизанской войне. Численность талибов напрямую связана с их оборонительными и наступательными модификаторами. Если к моменту вывода американских войск их численность превысит 30%, они снова начнут полномасштабное вторжение.\n\n£AFG_salafist_jihadism  §HСила талибов - [?AFG.taliban_attack_strength|%]§!"
 TAL_move_into_tribal_areas: "Наступление на пакистанские племенные территории"
 TAL_move_into_tribal_areas_desc: "Чтобы выжить, нам нужно рассредоточить наши силы, чтобы они не были сосредоточены в одном месте. Племенные территории — идеальное место для укрытия, так как у нас будет свободный доступ к хорошему горному хребту."
 AFG_414_attack_1207: "Атаковать опорные пункты талибов"
 AFG_414_attack_1207_desc: "Хотя мы не сможем полностью уничтожить «Талибан», мы сможем ослабить его...  Если у нас всё получится."
 TAL_1207_attack_1154: "Удар по Кунару"
 TAL_1207_attack_1208: "Продвижение к Калату"
 AFG_414_attack_1208: "Захватите Калат"
 AFG_414_attack_1154: "Повторно возьмите Кунар"
 PAK_objected: "Мы отступаем из-за [PAK.GetFlag] возражений Пакистана"
 AFG_doing_border_raid: "В настоящее время провожу рейд на границе"
 TAL_money: "Фонды движения \" Талибан\""
 AFG_agriculture_mech: "Сельское хозяйство"
 AFG_agriculture_mech_desc: "Миндаль и гранаты — единственные афганские экспортные товары, которые мир покупает без колебаний. Государственные средства, вложенные в сады, транспорт и покупателей, превращают урожай фермера в доход государственной казны."
 AFG_pomegranate_return_tt: "Возврат: §G+6%§! ВВП в §YКазначейство§!"
 AFG_almond_return_tt: "Доходность: §G+8%§! ВВП к §YКазначейство§!"
 AFG_pomegranate_investment_limit_tt: "Оставшиеся инвестиции в гранаты: §Y[?AFG_pomegranate_investments]/5§!"
 AFG_almond_investment_limit_tt: "Оставшиеся инвестиции в миндаль: §Y[?AFG_almond_investments]/5§!"
 TAL_1207_attack_1154_desc: "Отправьте бойцов с хребтов Сафед-Кох в Кунар, чтобы обескровить афганский гарнизон прежде, чем тот успеет окапаться."
 TAL_1207_attack_1208_desc: "Наступайте с Сафед-Коха на Калат. Удержание шоссе в этом районе расколет правительственные силы на юго-востоке."
 TAL_1152_attack_415: "Рейд в Систан"
 TAL_1152_attack_415_desc: "Прорвитесь на запад из Регистана в Систан, поставив под угрозу правительственный контроль над пустынной границей с Ираном."
 AFG_415_attack_1152: "Зачистить Регистан"
 AFG_415_attack_1152_desc: "Контратакуйте из Систана, чтобы вернуть пустыню Регистан и лишить талибов их плацдарма."
 AFG_412_attack_415: "Освобождение Систана"
 AFG_412_attack_415_desc: "Наступайте из Хазараджата, чтобы выбить талибов из Систана и вернуть южные провинции под контроль правительства."
 TAL_construct_the_safed_koh_system: "Создать сеть снабжения Сафед-Кох"
 TAL_construct_the_safed_koh_system_desc: "Обустройте тайники, проложите туннели и вьючные тропы через хребет Сафед-Кох, чтобы снабжать бойцов вне досягаемости афганских патрулей."
 TAL_begin_insurgency_in_registan: "Открыть фронт в Регистане"
 TAL_begin_insurgency_in_registan_desc: "Поднимите колонны ополчения по всей пустыне Регистан и захватите провинцию, открыв второй фронт на юге."
 TAL_begin_war_again: "Возобновить войну"
 TAL_begin_war_again_desc: "Когда иностранные войска ушли, а наши силы восстановлены, разорвите перемирие и выступите на Кабул, чтобы завершить войну."
 AFG_taliban_insurgency_eliminated: "Повстанцы Талибана уничтожены"
 AFG_active_taliban_insurgency: "Талибское восстание активно"
 wot_supporting_afghan_counter_insurgency: "Поддержка афганских контрповстанческих сил"
 AFG_civil_war_shortcut: "Гражданская война"
 AFG_panjshir_shortcut: "Панджшир"
 AFG_foreign_policy_shortcut: "Внешняя политика"
 AFG_government_shortcut: "Правительство"
 AFG_reconstruction_shortcut: "Реконструкция"
 AFG_national_policy_shortcut: "Национальная политика"
 AFG_national_assembly: "Национальное собрание"
 AFG_anjuman_pass: "Лев Панджшира"
 AFG_law_of_faith: "Закон веры"
 AFG_law_of_faith_idea: "Закон веры"
 AFG_law_of_faith_idea_desc: "Религиозное право закреплено в законодательстве. Духовенство удовлетворено, и сельская местность откликнется на призыв к действию, но политическое пространство для чего-либо, выходящего за рамки консенсуса, сузилось."
 AFG_law_of_faith_desc: "Закон веры восторжествует в нашем штате, чтобы укрепить наши исламские принципы внутри штата. Наш народ будет руководствоваться нашими исламскими убеждениями, чтобы сохранить наш штат чистым и праведным."
 AFG_training_of_local_police_officers: "Обучение сотрудников местной полиции"
 AFG_training_of_local_police_officers_desc: "В рамках подготовки к возможному освобождению и стабилизации Афганистана Северный альянс должен создать дисциплинированную и эффективную полицию. Эта полиция будет иметь решающее значение для поддержания правопорядка на территориях, которые мы стремимся вернуть."
 AFG_heirs_o_the_mujahideen: "Наследники моджахедов"
 AFG_heirs_o_the_mujahideen_desc: "Вдохновляясь легендарными бойцами прошлого, нынешнее руководство стремится возродить дух и тактику моджахедов."
 AFG_the_lions_guard: "Львиная гвардия"
 AFG_the_lions_guard_desc: "Для предотвращения потенциальных нападений на Ахмада Шаха Масуда была создана новая оперативная группа в связи с опасениями по поводу непосредственной угрозы."
 AFG_the_francesc_vendrell_talks: "Переговоры Франсеска Вендрелла"
 AFG_the_francesc_vendrell_talks_desc: "В Душанбе, Таджикистан, специальный посланник ООН Франсеск Вендрелл проводит мирные переговоры с ключевыми афганскими лидерами: командующим Северным альянсом Ахмедом Шахом Масудом, бывшим губернатором Нангархара Хаджи Абдул Кадиром и бывшим членом правительства Раббани Сайедом Хуссейном Анвари, обсуждая проблемы Мухаммеда Асифа Мохсени."
 AFG_assault_on_mazar_i_sharif: "Штурм Мазари-Шарифа"
 AFG_assault_on_mazar_i_sharif_desc: "Важный город Мазари-Шариф необходимо отвоевать, и мы можем мобилизовать наших солдат, чтобы они оказали им поддержку в этом деле."
 AFG_massoud_s_mig_and_sukho: "МиГ и Сухой Масуда"
 AFG_massoud_s_mig_and_sukho_desc: "Поддержка Индии носила скрытый характер. Индия уже некоторое время оказывает Масуду помощь деньгами, радиолокационным оборудованием и запчастями для самолетов. По имеющимся данным, они направили около 30 техников, которые занимаются обслуживанием истребителей МиГ и Сухой, принадлежащих Масуду. Индийские военные советники также давали советы по борьбе с талибами. Несмотря на то, что эта помощь не афишируется, она стала одной из основных составляющих деятельности сил Масуда."
 AFG_russian_air_lift_idea: "Российский воздушный мост"
 AFG_russian_air_lift_idea_desc: "Оружие и запасные части советского образца доставляются по воздуху из России. Наши экипажи уже знакомы с этим оборудованием, поэтому оно попадает на фронт дешево и без переподготовки."
 AFG_russian_air_lift: "Российский воздушный мост"
 AFG_russian_air_lift_desc: "Россия поддерживает давний тайный союз с Северным альянсом, поставляя оружие и необходимые припасы для поддержки остатков нашего правительства. Буквально вчера министр обороны России Сергей Иванов объявил, что они будут оснащать наши ополчения хорошо известной советской техникой, с которой члены Северного альянса уже знакомы."
 AFG_mil_mi_24_gunships: "Ударный вертолет Ми-24"
 AFG_mil_mi_24_gunships_desc: "Россия объявила о планах поставить нам 12 ударных вертолетов Ми-24, которые окажут ценную поддержку нашим усилиям по наступлению против талибов."
 AFG_cia_predator_surveillance_drones: "Беспилотники наблюдения Predator ЦРУ"
 AFG_cia_predator_surveillance_drones_idea: "Беспилотники наблюдения Predator ЦРУ"
 AFG_cia_predator_surveillance_drones_idea_desc: "Американские беспилотники кружат над перевалами и передают нам информацию о том, что видят. Мы впервые начинаем планировать действия, опираясь на реальные разведывательные данные, и наши собственные сети развиваются за счет их сетей."
 AFG_cia_predator_surveillance_drones_desc: "Беспилотники наблюдения Predator, используемые ЦРУ, сыграли решающую роль в обеспечении обширного обследования местности, выявлении ключевых точек интереса и точном определении целей противника."
 AFG_appeal_to_washington_for_support: "Обращение к Вашингтону за поддержкой"
 AFG_appeal_to_washington_for_support_desc: "В условиях продолжающегося конфликта и угрозы со стороны экстремистских группировок Афганистану необходимо заручиться поддержкой международных союзников для укрепления своего военного потенциала."
 AFG_imu_countermeasures: "Меры противодействия со стороны инерциального измерительного блока (IMU)"
 AFG_imu_countermeasures_desc: "Для противодействия этой угрозе Афганистан обращается за помощью к Узбекистану для проведения целенаправленных авиаударов по опорным пунктам Исламского движения Узбекистана (ИДУ). Цель этого сотрудничества — ослабить возможности ИДУ, сорвать его операции и восстановить безопасность в приграничных районах."
 AFG_shura_system: "Укрепить систему Шуры"
 AFG_shura_system_desc: "Укрепление системы Шуры в рамках Северного альянса имеет решающее значение для поддержания единства и эффективного управления. Укрепляя эту традиционную структуру принятия решений на основе совета, мы обеспечиваем представительство всех фракций."
 AFG_anjuman_pass_desc: "Ахмад Шах Масуд, также известный как Лев Панджшира, является символом сопротивления и тактического лидерства. Сплотившись вокруг его идей, страна стремится перенять его стратегии, вдохновить войска и укрепить оборону. Его принципы лидерства направляли и будут направлять Афганистан в его нынешних трудностях."
 AFG_ghanis_plan: "План Гани"
 AFG_ghanis_plan_desc: "Гани запускает план по сокращению поддержки талибов посредством целенаправленных военных действий и проектов развития, направленный на стабилизацию ключевых регионов и восстановление государственного контроля."
 AFG_secretly_support_the_opium_industry: "Тайная поддержка опиумной индустрии"
 AFG_secretly_support_the_opium_industry_desc: "Под видом индустриализации наши урбанисты будут верить, что мы движемся к новой эре модернизации. Однако мы не можем оттолкнуть основу нации — крестьян. Мы будем тайно поддерживать торговлю опиумом как средство повышения нашего экономического процветания и умиротворения всех слоев афганского общества."
 AFG_parliamentary_illusion: "Парламентская иллюзия"
 AFG_parliamentary_illusion_idea: "Парламентская иллюзия"
 AFG_parliamentary_illusion_idea_desc: "Палата заседает, обсуждает и голосует, но не принимает никаких важных решений. Ее содержание обходится нам недорого, а видимость согласия ценнее, чем его реальное положение дел."
 AFG_parliamentary_illusion_desc: "Для чего вообще нужен парламент? Он нужен, чтобы успокоить наш народ и убедить его в том, что он имеет право голоса в управлении страной. Мы не можем полностью исключить демократический процесс, но мы можем манипулировать им, чтобы лучше удовлетворять собственные потребности."
 AFG_the_western_kleptocracy: "Западная клептократия"
 AFG_ashraf_ghani: "Ахмадзай"
 AFG_ashraf_ghani_desc: "Ашраф Гани избран новым президентом Афганистана. Получив мандат на проведение реформ, он стремится стабилизировать страну и восстановить ее институты."
 AFG_endorse_the_american_candidate: "Поддержите американского кандидата"
 AFG_endorse_the_american_candidate_desc: "С завершением работы переходного правительства контроль Хамида Карзая над правительством остается сильным. Будучи кандидатом, выбранным в соответствии с Боннским соглашением, Карзай сформировал правительство широкого толка, ориентированное на восстановление Афганистана и содействие прочному миру с нашими новыми американскими союзниками."
 AFG_the_new_chairman: "Новый председатель"
 AFG_the_new_chairman_desc: "По мере того как проходит избирательный цикл, глава государства должен не только осуществлять контроль, но и представлять интересы нации. В условиях вакантной должности Карзай должен взять на себя командование и подавать пример Афганистану."
 AFG_aptta: "АПТТА"
 AFG_aptta_desc: "Соглашение о транзитной торговле между Афганистаном и Пакистаном (APTTA) — это двустороннее торговое соглашение между Пакистаном и Афганистаном, подписанное при администрации Карзая. Цель этого соглашения — стимулировать торговлю между двумя странами, поддерживать контртеррористические операции и способствовать развитию приграничных регионов."
 AFG_saarc_membership: "Членство в СААРК"
 AFG_saarc_membership_idea: "Членство в СААРК"
 AFG_saarc_membership_idea_desc: "Место за столом переговоров в Южной Азии. Кредиты дешевле, налоговая база стабильнее, а Кабул воспринимается как сосед, а не как проблема."
 AFG_saarc_membership_desc: "Членство Афганистана в Южноазиатской ассоциации регионального сотрудничества (СААРК) демонстрирует интеграцию страны в региональную экономическую и политическую структуру. Это также предоставляет возможность вывести Афганистан из кризиса."
 AFG_rebuilding_the_state: "Восстановление штата"
 AFG_rebuilding_the_state_desc: "После падения режима талибов одной из главных задач государственного строительства в Афганистане стало восстановление и перестройка государства с нуля. Афганистан, государство с приходящей в упадок экономикой и практически полным отсутствием асфальтированных дорог и железнодорожных путей, теперь должен быть восстановлен и превращен в страну, способную занять достойное место в мировом порядке."
 AFG_drafting_the_constitution: "Разработка Конституции"
 AFG_drafting_the_constitution_desc: "Подписание Конституции знаменует собой важный поворотный момент для государства, поскольку оно закрепляет на бумаге шаги, гарантирующие права человека."
 AFG_national_solidarity_program: "Национальная программа солидарности"
 AFG_national_solidarity_program_desc: "Афганская национальная программа солидарности (НСП) представляла собой правительственную инициативу по восстановлению и развитию около 5000 деревень в Афганистане, на которую было выделено $900 млн поэтапно в течение трех лет. Целью программы было создание местных, демократически избранных институтов и контроль за восстановительными работами."
 AFG_reformist_path: "Реформистский путь"
 AFG_reformist_path_desc: "Путь реформ направлен на замену старого новым, и сейчас для этого нет лучшего времени, чем сейчас, поскольку Афганистан все еще находится на ранних этапах государственного строительства."
 AFG_next_in_line_of_succession: "Следующий в очереди на престолонаследие"
 AFG_next_in_line_of_succession_desc: "Поскольку срок полномочий Хамида Карзая подходит к концу, должен появиться преемник, который займет его место."
 AFG_sway_local_warlords: "Удержать местных военачальников"
 AFG_sway_local_warlords_desc: "Со времен советского вторжения в Афганистане доминируют местные полевые командиры, и свергнуть их будет непросто. Вместо этого нам следует выявить ключевых авторитарных лидеров и сотрудничать с ними, чтобы укрепить наши позиции."
 AFG_the_islamic_republic: "Исламская Республика"
 AFG_the_islamic_republic_desc: "По мере того как государство Афганистан угасает, начинается новая эпоха для республики, знаменующая собой новое начало и новую форму для нашей страны."
 AFG_the_mujahideen: "Моджахеды"
 AFG_the_mujahideen_desc: "Моджахеды, или афганские моджахеды, представляют собой широкую коалицию бывших командиров сопротивления и полевых командиров, многие из которых поддерживали бывший Северный альянс. Нам следует сосредоточиться на сохранении статус-кво."
 AFG_age_of_republican_leadership: "Лидерство новой эры"
 AFG_age_of_republican_leadership_desc: "С созданием Исламской Республики следует постепенно увольнять старых военачальников, отдавая предпочтение новым офицерам в составе новых национальных сил обороны."
 AFG_islamic_democracy: "Исламская демократия"
 AFG_islamic_democracy_desc: "Новая глава продолжается, и исламское общество принимает на себя управление государством Афганистан, будем надеяться, что так будет и в будущем. Однако сейчас не время для отдыха, поскольку по стране бродят полевые командиры и члены банд, представляющие угрозу, поскольку они объединяются с силами Талибана."
 AFG_reinforce_the_government: "Укрепить правительство"
 AFG_reinforce_the_government_desc: "С установлением контроля над южными регионами страны мы считаем, что это хороший шаг для того, чтобы объединить сопротивление и представить наше руководство широкой общественности."
 AFG_agricultural_modernisation: "Модернизация сельского хозяйства"
 AFG_agricultural_modernisation_desc: "Модернизация ирригации, механизации и методов ведения сельского хозяйства позволит повысить урожайность в наших сельских провинциях и обеспечит казначейству новый источник доходов от сельскохозяйственного сектора."
 AFG_the_farmer_and_their_rifle: "Фермер и его винтовка"
 AFG_the_farmer_and_their_rifle_desc: "Жажда крови и крови, с которой они защищают свою родину, сделала сельских жителей Афганистана опорой государства. Потеря поддержки со стороны этого сообщества станет первым звеном в цепи событий, ведущих к нашему падению."
 AFG_inheritor_of_afghanistan: "Наследник Афганистана"
 AFG_inheritor_of_afghanistan_desc: "В Афганистане царил настоящий мир только при нашем правлении. Мы стали наследниками афганского государства, и это достижение заслуживает похвалы, а не пренебрежительного отношения со стороны мировых держав."
 AFG_second_man_of_the_state: "Второй человек в штате"
 AFG_second_man_of_the_state_desc: "Будучи бывшим командиром сопротивления, Атта проявляет живой интерес к власти. Он зарекомендовал себя как самобытный лидер Афганистана и не боится вступать в крупномасштабные конфликты с другими полевыми командирами."
 AFG_dismantle_the_warlords: "Уничтожить военачальников"
 AFG_dismantle_the_warlords_desc: "В некоторых регионах страны заправляют бандиты и гангстеры. Для того чтобы по-настоящему превратиться в современное национальное государство, мы должны приложить усилия для решения проблемы этих военачальников."
 AFG_a_tolerant_state: "Толерантное государство"
 AFG_a_tolerant_state_desc: "В Афганистане проживает множество разных народов. Мы должны сдержать свои обещания, рассматривать каждого афганца как отдельного человека и быть едиными как единое целое."
 AFG_naveen: "Навин"
 AFG_naveen_desc: "Новая партия Афганистана, или «Навин», — это политическая партия в Афганистане, возглавляемая Юнусом Кануни. Партия была основана после того, как Кануни отошёл от Национального движения Афганистана, которое возглавляет Ахмад Вали Масуд. Юнус Кануни стремится сохранить менталитет Северного альянса."
 AFG_new_class_of_jam_iat_reformers: "Новое поколение реформаторов джамиата"
 AFG_new_class_of_jam_iat_reformers_desc: "Юнус Кануни представляет собой новую волну реформаторов из джамиатской церкви, которые более привержены исламским и традиционным ценностям. Эта группа, как правило, придерживается более реформистского подхода, сосредотачиваясь на постепенных изменениях, а не на агрессивном обращении в другую веру."
 AFG_counite_masouds_works: "Продолжайте дело Масуда."
 AFG_counite_masouds_works_desc: "После поражения Северного альянса и свержения Масуда мы по-прежнему привержены сохранению духа Северного альянса и стремлению к построению современного Афганистана."
 AFG_foster_innovation: "Содействовать инновациям"
 AFG_foster_innovation_desc: "Будучи бывшим министром образования, Юнус Кануни понимает острую необходимость инноваций в секторе образования."
 AFG_combat_electoral_corruption: "Борьба с коррупцией на выборах"
 AFG_combat_electoral_corruption_desc: "В Афганистане чиновники часто использовали взятки для накопления богатства и сохранения власти. С этого момента мы должны обеспечить, чтобы фальсификация выборов больше не допускалась."
 AFG_empowering_provincial_governance: "Укрепление полномочий провинциального управления"
 AFG_empowering_provincial_governance_desc: "Расширение полномочий провинциальных органов власти в Афганистане имеет важное значение. Как показал пример Германии, децентрализованное управление позволяет регионам развиваться и догонять остальную часть страны."
 AFG_centralise_the_apparatus_of_the_state: "Централизовать государственный аппарат"
 AFG_centralise_the_apparatus_of_the_state_desc: "Централизация усилит наш контроль, гарантируя, что все проверки и возражения будут обрабатываться непосредственно нами."
 AFG_expand_the_education_ministry: "Расширить Министерство образования"
 AFG_expand_the_education_ministry_desc: "Расширение Министерства образования принесет огромную пользу нашему государству, способствуя формированию высококвалифицированной рабочей силы и развитию более образованного общества."
 AFG_propose_a_new_constitution: "Предложить новую конституцию"
 AFG_propose_a_new_constitution_desc: "Нынешняя конституция Афганистана не соответствует современным стандартам и нуждается в существенных поправках."
 AFG_embezzle_foreign_funds: "хищение иностранных средств"
 AFG_embezzle_foreign_funds_desc: "Присвоение иностранных средств стало методом поддержания жесткого контроля над страной и обеспечения функционирования нашего правительства наряду с Национальной ассамблеей."
 AFG_enforce_afghan_centralism: "Внедрить централизм"
 AFG_enforce_afghan_centralism_desc: "Афганцы — сельский и племенной народ, и исторически они негативно реагировали на любые формы централизации. Но как может быть полезно наше правительство, если мы ограничены тем, что можем и чего не можем сделать? Мы должны проявить твердость и утвердить централизацию."
 AFG_urban_tribal_divisions: "Уступки лидерам Шуры"
 AFG_urban_tribal_divisions_desc: "Переселив часть наших соплеменников в урбанизированные районы, мы сможем предоставить определенным регионам большую автономию и контроль над их территорией, поскольку они станут более организованными."
 AFG_atlanticism: "Атлантизм"
 AFG_atlanticism_desc: "Атлантицизм — это вера в тесное сотрудничество между Северной Америкой и Европой, доктрина, получившая распространение после Второй мировой войны. Афганистан стремится перенять более западную модель в плане прогресса и управления."
 AFG_arsenal_of_democracy: "Арсенал демократии"
 AFG_arsenal_of_democracy_desc: "В условиях бурного роста американской военной экономики нам следует использовать это в своих интересах, пополняя запасы и готовясь к предстоящим вызовам."
 AFG_the_republic_survives_another_day: "Республика пережила ещё один день."
 AFG_the_republic_survives_another_day_desc: "С наступлением дня и ночи знамя афганского народа гордо возвышается. Готовый ко всему, что его ждёт, будь то мир или война. Одно остаётся неизменным: республика будет существовать до последнего вздоха."
 AFG_defenders_of_democracy: "Защитники демократии"
 AFG_defenders_of_democracy_desc: "Переход от государства, практически не имевшего представления о демократии, к новому режиму, полностью её принявшему, — это беспрецедентный шаг. Мы должны выполнить свой долг и любой ценой защитить эту нацию и её идеалы."
 AFG_root_out_the_old_cabinet: "Выкопайте старый шкаф."
 AFG_root_out_the_old_cabinet_desc: "Те, кто ранее занимал подобные должности, до сих пор работают в парламенте. Мы должны разоружить их и разоблачить как мошенников."
 AFG_moderate_islamism: "Умеренный исламизм"
 AFG_moderate_islamism_desc: "Умеренный исламизм подразумевает пассивный или традиционный подход к исламу, что отличает его от более радикальных и революционных интерпретаций."
 AFG_basej_e_milli: "Зеленый тренд"
 AFG_basej_e_milli_desc: "Баседж-е Милли, также известная как Раванд-е Сабз-е Афганистан, — это антиталибская, афганская националистическая и продемократическая политическая партия. Она играет важную роль в отстаивании демократического будущего и национального единства в Афганистане."
 AFG_knife_to_the_warlords: "Нож в лицо военачальникам"
 AFG_knife_to_the_warlords_desc: "Военачальники терзают эту страну и представляют собой устаревшее понятие. Они утверждают, что действуют от имени народа, но мы все противостоим им."
 AFG_standardised_taxation: "Стандартизированное налогообложение"
 AFG_standardised_taxation_desc: "Стандартизированное налогообложение позволит нашей экономике оправиться от многолетней войны."
 AFG_enlist_the_support_of_the_people: "Заручитесь поддержкой народа."
 AFG_enlist_the_support_of_the_people_desc: "Заручившись поддержкой народа, республика будет спасена от грядущих угроз."
 AFG_recraft_the_healthcare_system: "Перестроить систему здравоохранения"
 AFG_recraft_the_healthcare_system_desc: "Больницы старые и нуждаются в реставрации и ремонте. Мы должны внести свой вклад в решение этой проблемы."
 AFG_local_organisation: "Местная организация"
 AFG_local_organisation_desc: "Мы должны объединиться, чтобы стать самодостаточными и не зависеть от поддержки остального мира."
 AFG_lift_the_press_restrictions: "Снять ограничения для прессы"
 AFG_lift_the_press_restrictions_desc: "Свободная и независимая пресса — краеугольный камень процветающего и демократического общества."
 AFG_progressive_tax: "Прогрессивный налог"
 AFG_progressive_tax_desc: "Для обеспечения справедливого распределения богатства и ресурсов в Афганистане действует прогрессивная система налогообложения."
 AFG_return_of_dostum: "Возвращение Дотума"
 AFG_return_of_dostum_desc: "Генерал Абдул Рашид Достум, видный афганский военачальник и влиятельная фигура, возвращается на национальную политическую арену. Он известен своим грозным командованием узбекскими войсками и стратегическим чутьём."
 AFG_mission_to_tehran: "Миссия в Тегеран"
 AFG_mission_to_tehran_desc: "Стремясь укрепить региональные альянсы и противостоять внешним угрозам, Афганистан отправляет дипломатическую миссию в Тегеран. Присоединившись к возглавляемой Ираном «Оси сопротивления», Афганистан намерен заручиться поддержкой влиятельных союзников, укрепить свой военный потенциал и повысить свои геополитические позиции."
 AFG_take_command_of_rabbanis_feyzabad_forces: "Командир войск Раббани в Фейзабаде"
 AFG_take_command_of_rabbanis_feyzabad_forces_desc: "Силы Бурхануддина Раббани, дислоцированные в Фейзабаде, играют решающую роль в контроле над северо-восточными регионами Афганистана. Приняв непосредственное командование этими силами, центральное руководство стремится объединить структуры командования, улучшить координацию и укрепить оборону этого стратегически важного района."
 AFG_karim_khalilis_new_offensive: "Новое наступление Карима Халили"
 AFG_karim_khalilis_new_offensive_desc: "Карим Халили, видный лидер и стратег, возглавляет новое смелое наступление с целью отвоевать ключевые территории и дать отпор враждебным силам. Его план включает в себя сочетание партизанской тактики, мобилизации местных ополчений и стратегической координации с союзными силами."
 AFG_western_klep_tt1: "§Y Захват иностранной помощи §! влияние на §Y Дополнительный доход §! $§G0.18§! млрд"
 AFG_state_northern_stronghold_dynamic_modifier: "Ворота перевала Анджуман"
 AFG_taliban_assault_on_taloqan: "Нападение талибов на Талокан"
 AFG_state_battle_for_mazar_i_sharif_dynamic_modifier: "Наступление Мазари-Шарифа"
 AFG_increase_road_toll_tt: "Повышение платы за проезд\nУровень платы: [?AFG_toll_level]\nДенежная прибыль штата: $§G[?AFG_Toll_display_var]§!\nПотребительские товары: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_increase_road_toll_tt_desc: "Уровни платы за проезд могут повышаться до пяти раз, при этом каждое повышение увеличивает доходы, получаемые от государственных автомагистралей, в зависимости от интенсивности движения и объема перевозимых товаров. Каждый уровень выше первого обходится в определенную сумму. §Y2%§! потребительские товары в масштабах всей страны, отражающие бремя, которое они накладывают на экономику в целом."
 AFG_lower_road_toll_tt: "Снижение платы за проезд по дорогам\nУровень платы: [?AFG_toll_level]\nДенежная прибыль штата: $§G[?AFG_Toll_display_var]§!\nПотребительские товары: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_lower_road_toll_tt_desc: "Снижение уровня платы за проезд возвращает §Y2%§! Потребительские товары, стоимость которых соответствовала выручке, получаемой на данном уровне. Плата за проезд не может быть снижена ниже первого уровня."
 AFG_toll_below_maximum_tt: "В этом штате плата за проезд составляет §R, а максимальный уровень — §!."
 AFG_toll_above_minimum_tt: "В этом штате плата за проезд составляет §R на самом низком уровне§!."
 AFG_info_box: "§GTollage§!\nУровень платы за проезд: [?AFG_toll_level]\nДенежная прибыль штата: $§G[?AFG_Toll_display_var]§!\nNational Toll Monetary Gain: $§G[?ROOT.additional_income_AFG_tolls_income1]§!\nНациональные потребительские товары: §Y[?ROOT.AFG_consumer_goods_factor_toll|%]§!"
 AFG_info_box_desc_lore: "Афганские автомагистрали контролируются такими группировками, как «Талибан», и местными полевыми командирами, которые использовали местные сборы для получения дохода от торговых путей, соединяющих Центральную Азию, Иран и Пакистан. Эти сборы, уходящие корнями в традиции Шёлкового пути, являются основным источником финансирования как для режима «Талибана», так и для полевых командиров, при этом контроль над ключевыми дорогами имеет решающее значение для власти и богатства."
 AFG_usa_equipment: "Участие ЦРУ"
 AFG_usa_equipment_desc: "Американцам не нравится нынешнее положение талибов, поэтому они предложили продать нам некоторое оборудование по низкой цене."
 AFG_join_sco: "Вступите в ШОС"
 AFG_join_sco_desc: "ШОС возглавляют Китай и Россия, и это организация, которая делает акцент на региональном мире, безопасности, борьбе с терроризмом и экономическом сотрудничестве. Она может предоставить многие ресурсы, которые мы считаем необходимыми для нашей страны, такие как учения по борьбе с терроризмом и помощь в развитии. Нам следует присоединиться к ШОС на благо нашей страны."
 AFG_the_western_kleptocracy_desc: "Перемены? Кому нужны перемены? Запад может нам помочь, и ситуация улучшится, как и планировалось."
 AFG_liberal_society_desc: "Ослабление влияния клерикальной элиты дало Кабулу прессу, базар и повод для публичных дискуссий. Торговые партнеры стали относиться к нам серьезнее, хотя политический капитал, потраченный на удержание позиций, реален."
 AFG_preserve_democracy: "Сохраним демократию"
 AFG_preserve_democracy_desc: "Благодаря освобождению прессы от ограничений и предоставлению судам свободы действий, республика получает реальный шанс пустить корни до того, как следующий кризис станет для нее серьезным испытанием."
 AFG_indian_support_and_arms_trade: "Поддержка со стороны Индии и поддержка вооружений"
 AFG_indian_support_and_arms_trade_desc: "Индейцы согласились поддержать нашу страну и вооружить её против наших врагов."
 AFG_establishing_supply_lines: "Создание каналов поставок"
 AFG_establishing_supply_lines_desc: "Создав хорошо налаженные и поддерживаемые в исправном состоянии линии снабжения, наши войска будут обеспечены достаточным количеством ресурсов для продолжения боевых действий."
 AFG_russian_technical_specialists: "Российские технические специалисты"
 AFG_russian_technical_specialists_desc: "Мы привлекли специалистов из [SOV.GetFlag] Россия будет работать над нашими механизированными подразделениями."
 AFG_the_shura_system_idea: "Система Шуры"
 AFG_the_shura_system_idea_desc: "Система Шуры в Северном Альянсе — это традиционная форма управления на основе совета, уходящая корнями в племенные и общинные практики принятия решений. Эта система объединяет военных лидеров, старейшин племен и влиятельных лиц для обсуждения и принятия коллективных решений. Система Шуры укрепляет единство и обеспечивает представительство различных фракций в Северном Альянсе и их право голоса в стратегических и политических вопросах."
 AFG_civilian_exodus_taloqan: "Исход мирных жителей Талокан"
 AFG_civilian_exodus_taloqan_desc: "Бои вокруг Талокана вынудили тысячи семей бежать на север и запад. Лагеря испытывают нехватку и без того скудных ресурсов, но беженцы несут с собой всю провинцию, и уменьшение числа людей в очереди облегчает нам снабжение."
 AFG_iranian_airbridge: "Иранский воздушный мост"
 AFG_iranian_airbridge_desc: "После захвата Кабула талибами помощь Ирана Северному альянсу резко возросла. Иран создал воздушный мост между Мешхедом и афганскими авиабазами Баграм и Куляб для поставок огромных объемов оружия Северному альянсу. Сообщается, что за один день в 1997 году в Баграме приземлилось 13 иранских самолетов, и Иран до сих пор подозревается в отправке 700 тонн оружия через Таджикистан."
 AFG_junbishis: "Джунбишис"
 AFG_junbishis_desc: "§RМы не можем вручную повысить популярность §W[Conservative_L]§!, пока Абдул Рашид Достум находится в изгнании §!\n\nДжунбиш-и Милли Ислами Афганистан, широко известный как Джунбиш, является крупной фракцией в Северном альянсе, состоящей в основном из этнических узбеков. Недавно он был изгнан из своей цитадели Мазари-Шариф силами талибов, но Джунбиш продолжает играть значительную роль в Северном альянсе. Группу возглавляет генерал Абдул Рашид Достум, видный полевой командир, который в прошлом конфликтовал с другими членами Северного альянса и имеет напряженные отношения с ними во время своего изгнания."
 AFG_northern_alliance_taloqan_siege: "Осада Талокана"
 AFG_northern_alliance_taloqan_siege_desc: "В недавней истории Талокан служил стратегическим штабом Ахмада Шаха Масуда, видного лидера среди моджахедов, во время их сопротивления Советской армии. После этого периода он принял на себя роль штаба [AFG.GetFlag] [AFG.GetNameDefCap] после того, как город Мазари-Шариф был захвачен силами талибов в 1997 году."
 AFG_idea_opium_economy: "Опиумная экономика Афганистана"
 AFG_idea_opium_economy_desc: "Значительная часть афганских фермеров зарабатывает на жизнь выращиванием и продажей мака для производства опиума. Огромные маковые поля занимают большую часть наших пахотных земель."
 AFG_idea_opium_barons: "Афганские опиумные магнаты"
 AFG_idea_opium_barons_desc: "Значительная часть афганских фермеров зарабатывает на жизнь выращиванием и продажей мака для производства опиума. Огромные маковые поля занимают большую часть наших пахотных земель. Новая политика правительства привела к ситуации, когда крупная клика опиумных баронов управляет несколькими крупными торговыми сетями. Влияние этих опиумных баронов в правительстве неоспоримо."
 AFG_idea_afghan_defence: "Обширные оборонительные меры"
 AFG_idea_afghan_defence_desc: "Наша страна охвачена гражданской войной. Мы теряем позиции, но мы не сделаем ни шага назад!"
 AFG_idea_un_troops: "Миротворческие войска ООН"
 AFG_idea_un_troops_desc: "Мы обратились с просьбой о направлении миротворцев ООН в нашу страну в надежде на установление стабильности в нашей стране."
 AFG_political_events.1.t: "[AFG.GetNameDef] Запрос на вооружение"
 AFG_political_events.1.d: "[AFG.GetNameDef] направил посланника к [ROOT.capital.GetName] для переговоров о соглашении, согласно которому мы обеспечим их необходимым снаряжением для продолжения боевых действий."
 AFG_political_events.1.a: "Мы примем"
 AFG_political_events.1.b: "Не сегодня"
 AFG_political_events.2.t: "[FROM.GetNameDef] отклоняет наш запрос на поставки оружия."
 AFG_political_events.2.d: "[FROM.GetNameDef] отклонил наш запрос на оружие. Мы не будем обескуражены этим отказом и продолжим работу над достижением наших текущих целей."
 AFG_political_events.2.a: "Вперед!"
 AFG_political_events.3.t: "[FROM.GetNameDef] подписывает соглашение о поставке оружия"
 AFG_political_events.3.d: "Мы выражаем глубокую благодарность [FROM.GetNameDef] за предоставление столь необходимого оборудования, которого мы так долго ждали."
 AFG_political_events.3.a: "Отлично!"
 AFG_political_events.4.t: "Первые выборы в Афганистане"
 AFG_political_events.4.d: "Сегодня завершается подсчет голосов. Мы наконец-то на пороге избрания первого лидера Афганистана."
 AFG_political_events.4.a: "Правительство Хамида Карзая"
 AFG_political_events.4.b: "Навин"
 AFG_political_events.4.c: "Джамиат-е Ислами"
 AFG_political_events.4.e: "Правительство Салеха"
 AFG_political_events.0.t: "Атта устанавливает военную диаархию."
 AFG_political_events.0.d: "Атта Мухаммад Нур, бывший командир сопротивления моджахедов, ввел свои силы в Кабул, требуя контроля над определенными уровнями всех вооруженных сил. Поскольку большинство его сторонников перешли на его сторону, наши возможности, мягко говоря, сильно ограничены."
 AFG_political_events.0.a: "Наши руки связаны."
 AFG_events.8.t: "[AFG.GetNameDef] просит нашей защиты"
 AFG_events.8.d: "После десятилетий беспорядков афганское правительство опасается возобновления войны или внешнего вмешательства и вторжения. [AFG.GetNameWithFlag] Президент [AFG.GetLeader] посетил Белый дом и обратился к нашему президенту. [USA.GetLeader] в случае договора об обороне. Если мы согласимся защищать их, мы сможем гарантировать, что они находятся в нашей сфере влияния, но у нас также будет обязательство защищать их. [AFG.GetNameWithFlag] от внешних угроз, а также оказывать помощь в поддержании стабильности своей страны, особенно в противодействии £GFX_AFG_salafist_jihadism Восстание талибов. Учитывая ситуацию в нашей стране, следует ли нам подписать договор об обороне с [AFG.GetLeader]?"
 AFG_events.8.a: "Согласитесь их защищать."
 AFG_events.8.b: "У нас нет на это времени!"
 AFG_events.9.t: "[USA.GetNameDef] согласился нас защитить."
 AFG_events.9.d: "Благодаря нашим осмотрительным дипломатическим усилиям, президент [USA.GetNameWithFlag], [USA.GetLeader], официально подписал договор об обороне с нашим президентом [AFG.GetLeader]. Подписав этот договор об обороне, [FROM.GetNameWithFlag] не только защитит нас от внешней агрессии, но и окажет помощь в поддержании нашей внутренней стабильности."
 AFG_events.9.a: "Отличный!"
 AFG_events.10.t: "[USA.GetNameDef] отказался подписать!"
 AFG_events.10.d: "Несмотря на визит нашего президента [AFG.GetLeader] к [USA.GetNameWithFlag] для оказания помощи в сфере безопасности, [USA.GetLeader], по всей видимости, хранил молчание по поводу каких-либо договоров. [USA.GetLeader] заявил на пресс-конференции, что \" «Мы всегда будем отстаивать свободу, демократию и права человека в Афганистане». \" Но совершенно очевидно, что обещание [USA.GetLeader] остается лишь на словах, нам придется защищаться самим."
 AFG_events.10.a: "Какой катастрофический визит..."
 AFG_events.11.t: "[AFG.GetNameDef] просит нашей защиты"
 AFG_events.11.d: "После десятилетий беспорядков афганское правительство опасается возобновления войны или внешнего вмешательства и вторжения. [AFG.GetNameWithFlag] Президент [AFG.GetLeader] посетил Чжуннаньхай и обратился к генеральному секретарю. [CHI.GetLeader] в случае договора об обороне. Если мы согласимся защищать их, мы сможем гарантировать, что они находятся в нашей сфере влияния, но у нас также будет обязательство защищать их. [AFG.GetNameWithFlag] от внешних угроз, а также оказывать помощь в поддержании стабильности в стране, особенно в противодействии £GFX_AFG_salafist_jihadism  Восстание талибов. Учитывая ситуацию в нашей стране, следует ли нам подписать договор об обороне с [AFG.GetLeader]?"
 AFG_events.11.a: "Ещё один Железный Брат!"
 AFG_events.11.b: "У нас нет никаких средств на заключение договора!"
 AFG_events.12.t: "[CHI.GetNameDef] согласился нас защитить."
 AFG_events.12.d: "Благодаря нашим дипломатическим усилиям, генеральный секретарь [CHI.GetNameWithFlag] [CHI.GetLeader] официально подписал договор об обороне с нашим президентом [AFG.GetLeader]. Подписав этот договор, [FROM.GetNameWithFlag] не только защитит нас от внешней агрессии, но и окажет помощь в поддержании нашей внутренней стабильности."
 AFG_events.12.a: "Отличный!"
 AFG_events.13.t: "[CHI.GetNameDef] отказался подписать!"
 AFG_events.13.d: "Несмотря на визит нашего президента [AFG.GetLeader] к [CHI.GetNameWithFlag] для оказания помощи в вопросах безопасности, [CHI.GetLeader], по всей видимости, хранил молчание по поводу каких-либо договоров. [CHI.GetLeader] заявил нашему президенту, что \" «Мы всегда будем привержены региональной безопасности и стабильности». \" Но совершенно очевидно, что обещания [CHI.GetLeader] остаются лишь на словах, мы должны защищаться сами."
 AFG_events.13.a: "Какое разочарование..."
 AFG_events.14.t: "[AFG.GetNameDef] публично осуждает линию Дуррани"
 AFG_events.14.d: "Несколько минут назад президент [AFG.GetNameWithFlag], [AFG.GetLeader], заявил, что [AFG.GetNameWithFlag] никогда не признает линию Дюранда, произвольно установленную британцами в XX веке в качестве границы между двумя странами, и сделал громкое заявление: \"Мы, возможно, не сможем вернуть нашу священную пуштунскую землю сейчас, но наши потомки в следующих поколениях обязательно вернут эту землю, которая по праву принадлежит нам. Время покажет! \" Совершенно очевидно, что [AFG.GetNameWithFlag] сейчас переходит к враждебной внешней политике по отношению к нашей стране."
 AFG_events.14.a: "У них нет абсолютно никаких оснований так поступать!"
 AFG_events.15.t: "Убийство Бурхануддина Раббани"
 AFG_events.15.d: "Сегодня вечером Бурхануддин Раббани был убит в результате теракта смертника в своем доме в Кабуле. Сегодня ему исполнился 71 год. Двое мужчин, представившихся представителями Талибана, подошли к нему, чтобы обнять, и один из них привел в действие взрывчатку, спрятанную в его тюрбане. Смертник заявил, что является командиром Талибана и получил очень важное и позитивное послание от лидеров Талибана в Пакистане. По его словам, Талибан хотел обсудить мир с Раббани. В результате взрыва также погибли четыре других члена Высшего совета мира нашего правительства. Наши источники подтвердили, что ответственность за это убийство несет Кветтская шура, руководство Талибана, скрывающееся в Кветте, Пакистан. \n\nРаббани занимал пост председателя Высшего совета мира нашей страны после того, как покинул руководящую должность в правительстве. За это время он успешно убедил сотни боевиков Талибана мирно сложить оружие. Убийство стало серьезным ударом по мирному процессу в нашей стране, поскольку будет трудно найти человека с таким же авторитетом на этой должности."
 AFG_events.15.a: "Провести государственные похороны."
 AFG_events.16.t: "[AFG.GetNameDef] добивается признания нейтралитета"
 AFG_events.16.d: "Недавно [AFG.GetNameDef] выбрал путь нейтралитета, чтобы стать постоянно нейтральным государством. Они продемонстрировали готовность выполнять обязательства как постоянно нейтральное государство, но будет ли это выполнено, покажет время.\n\nПравительство Афганистана сейчас добивается от нашей страны гарантирования своего нейтрального статуса. Если мы это сделаем, мы будем обязаны защищать Афганистан в случае вторжения. Если же нет, другие страны могут гарантировать свой статус, и мы ничего от этого не потеряем."
 AFG_events.16.a: "Согласиться гарантировать свой статус нейтральной державы."
 AFG_events.16.b: "У нас нет времени на Афганистан."
 AFG_events.17.t: "[FROM.GetNameDef] Гарантирует наш статус нейтралитета"
 AFG_events.17.d: "В заявлении правительства [FROM.GetAdjective] говорится, что [FROM.GetNameDef] готов гарантировать наш нейтралитет и встанет на нашу защиту в случае внешнего вторжения в нашу страну.\n\nЭто значительное достижение, поскольку мы получили признание нейтралитета как минимум от одного постоянного члена Совета Безопасности ООН."
 AFG_events.17.a: "Отличный!"
 AFG_events.18.t: "Афганский народ восстал против талибов"
 AFG_events.18.d: "После операции «Несокрушимая свобода» несколько племенных и этнических меньшинств, в частности, подняли восстания против талибов в Герате. При поддержке США и Ирана эти ополчения захватили контроль над несколькими районами, ранее находившимися под контролем талибов, и присоединились к командованию Северного альянса.\n\nВосстание было встречено ликующей стрельбой со стороны местных жителей, некоторые празднования даже включали «танцы на крышах» и гудки автомобилей. Мохаммед Исмаил Хан, один из ключевых командиров Северного альянса, также известный как \"Лев Герата\"Организация предоставила амнистию бывшим боевикам Талибана, но предупредила о последствиях, если эти боевики снова возьмут в руки оружие."
 AFG_events.18.a: "Победа близка!"
 AFG_news.7.t: "[AFG.GetNameDef] объявляет о своих претензиях на территорию Пакистана."
 AFG_news.7.d: "Всего несколько минут назад, [AFG.GetNameWithFlag]Президент [AFG.GetLeader] объявил, что [AFG.GetNameWithFlag] никогда не признает линию Дюранда, произвольно установленную британцами в XX веке, границей между двумя странами, и сделал громкое заявление по этому поводу. \"Возможно, сейчас нам не удастся вернуть нашу священную пуштунскую землю, но наши потомки в будущих поколениях обязательно вернут эту землю, которая по праву принадлежит нам. Время покажет!\" [PAK.GetNameWithFlag]Президент [PAK.GetLeader] ответил, отвергнув все выдвинутые обвинения. [AFG.GetLeader] и резко раскритиковал это действие, заявив, что \"Враждебные дипломатические действия, предпринятые [AFG.GetLeader] Это не принесет ничего, кроме дальнейшего ухудшения отношений между нашими двумя странами.\" и призвали афганское правительство уважать международное право. Совершенно очевидно, что дипломатические отношения между двумя странами еще больше ухудшились."
 AFG_news.7.a: "Посмотрим, что будет дальше."
 AFG_news.8.t: "Государственный переворот в Афганистане"
 AFG_news.8.d: "Из-за коррупции в центральном правительстве, экономической нищеты и бедности населения многие афганцы, потерявшие средства к существованию и лишенные прав в условиях существующего положения вещей, присоединились к Хекматьяру. £GFX_AFG_kingdom Хезб-и-Ислами. Группа афганских военных офицеров, долгое время не получавших зарплату, совершила государственный переворот, свергнув республиканское правительство, объявив о приостановлении действия действующей афганской конституции и временном введении военного контроля. Гульбуддин Хекматьяр, дважды занимавший пост премьер-министра Афганистана в 1990-х годах, официально завершил свою ссылку и вернулся в Афганистан в качестве нового президента. Хекматьяр пообещал искоренить коррупцию, возродить экономику и вывести афганский народ на новый этап. В ответ на переворот представитель талибов выступил с заявлением, в котором говорилось, что \"Мы — настоящие афганцы, и мы продолжим бороться с Хекматьяром. \"Мясник Кабула\"\"."
 AFG_news.8.a: "Ещё одна глава в вечной войне..."
 AFG_news.9.t: "[AFG.GetNameDef] развертывает войска в городах"
 AFG_news.9.d: "В связи с недавней радикальной политикой руководства [AFG.GetLeader], такой как подавление политических и личных свобод, введение шариатского права в стиле талибов и устранение влияния племен, началась масштабная акция протеста против правящего правительства. Правительство [AFG.GetLeader] ответило развертыванием войск в городах и поселках, в результате чего некоторые протестующие были застрелены солдатами Афганской национальной армии или подразделениями Афганской национальной полиции. Похоже, [AFG.GetNameDef] скатывается к тоталитаризму."
 AFG_news.9.a: "Такова повседневная жизнь в Афганистане..."
 AFG_news.10.t: "Убийство Бурхануддина Раббани"
 AFG_news.10.d: "Бурхануддин Раббани был убит сегодня вечером в результате теракта, совершенного смертником в его доме в Кабуле. Двое смертников, представившихся представителями Талибана, заявили о желании обсудить мир с Раббани, подошли к нему, чтобы обнять, и один из них привел в действие взрывное устройство, спрятанное в его тюрбане. В результате взрыва также погибли четыре других члена Высшего совета мира Афганистана.\n\nРаббани занимал пост председателя Высшего совета мира Афганистана после того, как покинул руководящую должность в правительстве. За это время он успешно убедил сотни боевиков Талибана мирно сложить оружие. Его убийство является серьезным ударом по мирному процессу в Афганистане."
 AFG_news.10.a: "Трагические новости."
 AFG_news.11.t: "Угон рейса 805 авиакомпании Ariana Airlines"
 AFG_news.11.d: "Группа из девяти афганских мужчин во главе с братьями Али и Мохаммедом Сафи, бежавшими от режима талибов, захватила рейс 805 авиакомпании Ariana Afghan Airlines, самолет Boeing 727 с регистрационным номером YA-FAY, на борту которого находились 180 пассажиров и 7 членов экипажа. Рейс 805 был внутренним рейсом из Кабула в аэропорт Мазари-Шариф.\n\nУгонщики заставили экипаж лететь в лондонский аэропорт Станстед в Великобритании после пересадок в Ташкенте, Актюбе и Москве. Осада самолета продолжалась до 10 февраля. Будут ли угонщики осуждены, неизвестно, поскольку они ожидают суда в следующем году."
 AFG_news.11.a: "Нам следовало перехватить их одним из наших МиГов."
 AFG_news.12.t: "Угон рейса 805 авиакомпании Ariana Airlines"
 AFG_news.12.d: "Группа из девяти афганских мужчин во главе с братьями Али и Мохаммедом Сафи, бежавшими от режима талибов, захватила рейс 805 авиакомпании Ariana Afghan Airlines, самолет Boeing 727 с регистрационным номером YA-FAY, на борту которого находились 180 пассажиров и 7 членов экипажа. Рейс 805 был внутренним рейсом из Кабула в аэропорт Мазари-Шариф.\n\nУгонщики заставили экипаж лететь в лондонский аэропорт Станстед в Великобритании после пересадок в Ташкенте, Актюбе и Москве. Осада самолета продолжалась до 10 февраля. Будут ли угонщики осуждены, неизвестно, поскольку они ожидают суда в следующем году."
 AFG_news.12.a: "Интересный"
 AFG_news.12.b: "Терроризм — это бич человечества."
 AFG_news.13.t: "Иран отправляет беженцев обратно в Афганистан."
 AFG_news.13.d: "После достижения соглашения с УВКБ ООН Иран начал программу репатриации, в рамках которой в течение следующих трех недель 7700 афганских беженцев должны были вернуться на родину."
 AFG_news.13.a: "У этой войны есть конец?"
 AFG_news.14.t: "Война в Афганистане оставила тысячи людей голодающими"
 AFG_news.14.d: "Всемирная продовольственная программа сообщила, что засуха в провинциях Кандагар и Забул находится в критическом состоянии. Народ кучи потерял до 80% своего скота, а построенные для сбора дождевой воды ирригационные системы высохли. Абрикосовые и миндальные деревья засохли и не плодоносили. Верблюды умирали. С февраля ВПП обеспечивала продовольствием 30 000 семей в регионе и планировала добавить еще 10 000 семей в мае. ВПП предлагала афганцам дополнительную муку в качестве поощрения, если они останутся в своих деревнях."
 AFG_news.14.a: "Афганский народ нуждается в нас."
 AFG_events.32.t: "Замок под названием Талокан пал."
 AFG_events.32.d: "Жестокое пленение, совершенное талибами, спровоцировало массовый исход мирных жителей, которые бежали в сторону Имам-Сахиба и долины Панджшир. После жестокой осады, унесшей сотни жизней мирных жителей, наши солдаты остановили продвижение талибов к северу и востоку от города, но не смогли отвоевать его. Мы покинули наш штаб Северного альянса в городе и перенесли нашу оперативную базу в Файзабад."
 AFG_events.32.a: "Мрачный день"
 AFG_events.31.t: "Талокан продолжает борьбу. Еще один день."
 AFG_events.31.d: "После жестокой осады талибы потерпели поражение. Эта победа отражает стойкость наших предыдущих триумфов. Пусть это станет еще одним шагом на пути к окончательному падению талибов, поскольку... \"Талакан — это место сокровищ Аллаха. Эти сокровища не из золота и серебра, а состоят из людей, которые познали Аллаха так, как им следует.\""
 AFG_events.31.a: "Мрачный день"
 AFG_investment.1.t: "[AFG.GetNameDef] приглашает нас инвестировать в их проекты."
 AFG_investment.1.desc: "Правительство [AFG.GetNameWithFlag], недавно оправившееся от войны против талибов, приглашает нас инвестировать в некоторые проекты в их стране. Однако решение об инвестировании остается за нами. Если мы решим инвестировать, мы сможем получить определенное влияние на их правительство, но если террористическая угроза в Афганистане останется высокой, лучше не рисковать."
 AFG_investment.1.a: "Инвестируйте в их инфраструктуру!"
 AFG_investment.1.b: "Инвестируйте в их гражданскую промышленность!"
 AFG_investment.1.c: "Инвестируйте в их сферу услуг!"
 AFG_investment.1.d: "Лучше не рисковать."
 AFG_investment.2.t: "[FROM.GetNameDef] Инвестировали в нашу инфраструктуру!"
 AFG_investment.2.d: "После нескольких дней переговоров компания [FROM.GetNameWithFlag] согласилась инвестировать в нашу инфраструктуру в обмен на некоторые минимальные уступки. Эти инвестиции принесут пользу сельскому населению страны."
 AFG_investment.2.a: "Мы благодарны им за помощь!"
 AFG_investment.3.t: "[FROM.GetNameDef] Инвестирует в нашу гражданскую промышленность!"
 AFG_investment.3.d: "После нескольких дней переговоров [FROM.GetNameWithFlag] согласился помочь нам в строительстве нескольких гражданских заводов в обмен на некоторые незначительные уступки. Инвестиции принесут пользу промышленному сектору нашей страны и будут способствовать модернизации страны."
 AFG_investment.3.a: "Мы благодарны им за помощь!"
 AFG_investment.4.t: "[FROM.GetNameDef] Инвестиции в нашу сферу услуг!"
 AFG_investment.4.d: "После нескольких дней переговоров компания [FROM.GetNameWithFlag] согласилась инвестировать в сферу услуг нашей страны, построив несколько офисных помещений в обмен на незначительные уступки. Эти инвестиции принесут пользу финансовому сектору страны и будут способствовать ее модернизации."
 AFG_investment.4.a: "Мы благодарны им за помощь!"
 AFG_investment.5.t: "[FROM.GetNameDef] отказался от инвестиций!"
 AFG_investment.5.d: "После нескольких дней переговоров компания [FROM.GetNameWithFlag] отклонила наше предложение об инвестициях, сославшись на то, что деловая среда в нашей стране пока недостаточно безопасна, и будет тщательно оценивать будущие инвестиционные сделки с нами."
 AFG_investment.5.a: "Похоже, нам нужно еще поработать!"
 AFG_taliban_insurgency.0.t: "Начало восстания талибов"
 AFG_taliban_insurgency.0.d: "После краха основных сил талибов их батальоны распались на множество отдельных ячеек и начали вести партизанскую войну во всех уголках Афганистана, совершая чудовищные террористические акты. По оценкам, для полного подавления повстанческого движения потребуются годы, но если мы не предпримем никаких действий, стабильность в нашей стране просто никогда не будет достигнута."
 AFG_taliban_insurgency.0.a: "Пора приступать к работе!"
 AFG_taliban_insurgency.1.t: "Успешный рейд на убежище талибов"
 AFG_taliban_insurgency.1.d: "Благодаря нашим отважным спецподразделениям, обнаруженное нами убежище талибов было уничтожено, некоторые боевики пытались оказать сопротивление, но были убиты нашими спецподразделениями, а большинство других сдались, и лишь немногим удалось избежать правосудия. В целом, операция прошла с полным успехом!"
 AFG_taliban_insurgency.1.a: "Отличный!"
 AFG_taliban_insurgency.2.t: "Провал рейда"
 AFG_taliban_insurgency.2.d: "Неудачная попытка завершить рейд стала огромным ударом для нашего контртеррористического подразделения спецназа. Талибы, по-видимому, знали о наших планах заранее и предприняли превентивную атаку на некоторые из наших колонн, установив самодельные взрывные устройства на нашем маршруте и устроив засаду нашим спецназовцам после взрыва. К сожалению, несколько спецназовцев погибли в результате.\n\nВ ходе разбора ситуации некоторые военные генералы заподозрили, что среди организаторов операции могли быть сочувствующие, которые могли передать план талибам. В отчете также критикуется коррупция в правительстве, которая, возможно, привела к гибели спецназовцев. Мы должны проанализировать эту неудачу и извлечь из нее урок!"
 AFG_taliban_insurgency.2.a: "Покойся с миром, наши герои!"
 AFG_taliban_insurgency.3.t: "Авиаудар удался"
 AFG_taliban_insurgency.3.d: "Отличные новости! Наш военно-воздушный самолет, пилотируемый одним из наших опытных военнослужащих, успешно уничтожил лагерь талибов на основе координат, предоставленных нашей разведкой. Лагерь был полностью уничтожен, а многие боевики убиты.\n\nЭтот успех продемонстрировал эффективность сектора внутренней безопасности нашей страны и доказывает, что технологии играют жизненно важную роль в будущих контртеррористических операциях."
 AFG_taliban_insurgency.3.a: "Огромный успех!"
 AFG_taliban_insurgency.4.t: "Неудачный авиаудар привёл к гибели мирных жителей."
 AFG_taliban_insurgency.4.d: "Ужасные новости! Наши ВВС бомбили цель по координатам, предоставленным нашей разведкой, но теперь очевидно, что бомбы попали в гражданские объекты и привели к гибели невинных мирных жителей, а не предполагаемых боевиков Талибана.\n\nМестное население скорбит и справедливо возмущено этой провальной операцией, уже поступают сообщения о протестах в этом районе. Мы должны разобраться в причинах провала этой конкретной операции, чтобы дать объяснение нашим гражданам."
 AFG_taliban_insurgency.4.a: "Трагедия!"
 AFG_taliban_insurgency.5.t: "Самолет сбит боевиками Талибана"
 AFG_taliban_insurgency.5.d: "Трагические новости с авиаудара! Один из наших самолетов, предназначенных для борьбы с повстанцами, был сбит боевиками Талибана с помощью переносного зенитного ракетного комплекса; пилот погиб.\n\nЭтот оперативный провал показал, что нам необходимо реорганизовать наши военно-воздушные силы для будущих операций и получения более точной информации о целях, преследуемых Талибаном."
 AFG_taliban_insurgency.5.a: "Героический пилот, покойся с миром!"
 AFG_taliban_insurgency.6.t: "Успех пропаганды единства"
 AFG_taliban_insurgency.6.d: "Благодаря нашим пропагандистским усилиям по укреплению единства, некоторые боевики Талибана пришли к нашим полицейским и военным блокпостам и сложили оружие, некоторые обняли наших солдат и местных полицейских. Наши солдаты и полицейские не доставили им особых проблем, вместо этого они дали многим из сложивших оружие боевиков Талибана деньги за проезд домой. Это способствовало росту доверия населения к правительству и укреплению национального единства."
 AFG_taliban_insurgency.6.a: "Успешная разработка!"
 AFG_taliban_insurgency.7.t: "Провал пропаганды единства"
 AFG_taliban_insurgency.7.d: "Для нашего правительства стало огромным разочарованием, что наши недавние усилия по пропаганде единства не принесли положительных результатов. По словам некоторых командиров Талибана, находящихся на самых нижних ступенях иерархии, руководство Талибана считает нынешнее афганское правительство правительством воров, марионеткой иностранного правительства и совершенно не представляющим афганскую нацию. Они считают себя настоящими афганцами."
 AFG_taliban_insurgency.7.a: "Возможно, нам самим нужно приложить больше усилий..."
 AFG_taliban_insurgency.8.t: "Ликвидация повстанческого движения талибов"
 AFG_taliban_insurgency.8.d: "Несколько часов назад афганское правительство официально подтвердило, что им удалось успешно подавить повстанческое движение талибов. Согласно информации, опубликованной афганским правительством, подавляющее большинство талибов мирно сложили оружие и вернулись в свои дома.\n\nНесколько закоренелых боевиков «Талибана» бежали через афгано-пакистанскую границу в пакистанские племенные районы и присоединились к местным группам боевиков. Поскольку афганское правительство создало достаточное количество мер безопасности вдоль афгано-пакистанской границы, маловероятно, что боевики, окопавшиеся в Пакистане, смогут проникнуть обратно через границу."
 AFG_taliban_insurgency.8.a: "Закончился ли наконец затянувшийся конфликт?"
 AFG_taliban_insurgency.10.t: "Талибан развернул масштабное повстанческое движение."
 AFG_taliban_insurgency.10.d: "Недавний всплеск нападений талибов и рост насилия дали талибам возможность вновь перерасти в гражданскую войну. Талибы захватили значительную часть сельской территории, образовав главный оплот на юго-западе страны, а также некоторые другие сельские районы, перешедшие под их власть.\n\nНебольшая часть Афганской национальной армии столкнулась с дезертирством солдат, некоторые из которых присоединились к талибам; большинство же предпочли остаться и сопротивляться талибам из-за страха быть уничтоженными.\n\nПоддержка со стороны международного сообщества остается неясной, но мы должны сплотить наших солдат и бороться за победу."
 AFG_taliban_insurgency.10.a: "У нас нет другого выбора, кроме как сражаться!"
 AFG_taliban_insurgency.11.t: "Талибан развернул масштабное повстанческое движение."
 AFG_taliban_insurgency.11.d: "Недавний всплеск нападений талибов и рост насилия дали талибам возможность вновь перерасти в гражданскую войну. Талибы захватили значительную часть сельской территории, образовав главный оплот на юго-западе страны, а также некоторые другие сельские районы, перешедшие под их власть.\n\nНебольшая часть Афганской национальной армии столкнулась с дезертирством, и некоторые из этих дезертиров присоединились к талибам; большинство же предпочли остаться и сопротивляться талибам из-за страха быть уничтоженными.\n\nАфганский лидер [AFG.GetLeader] заявил, что повстанческое движение будет подавлено, и пообещал, что будет бороться до наступления мира."
 AFG_taliban_insurgency.11.a: "В Афганистане снова война..."
 AFG_taliban_insurgency.14.t: "Ситуация в Афганистане"
 AFG_taliban_insurgency.14.d: "Мы знаем, что афганское правительство разрешило нам разместить войска на своей территории, но наша военная разведка предупреждает, что талибы в настоящее время ведут повстанческую деятельность по всему Афганистану, и что множество других террористических групп пользуются нестабильной ситуацией в стране. Террористическая угроза достигла критического уровня, который может представлять реальную опасность для наших войск, дислоцированных там.\n\nЕсли мы продолжим сохранять позиции наших войск в Афганистане, они, вероятно, станут мишенью для талибов и других террористических групп, действующих в стране. Однако, если мы останемся в стране, мы можем оказать помощь афганским правительственным силам в их контртеррористических операциях. В этом случае наши военные смогут получить ценный опыт, например, в применении различных методов борьбы с повстанцами и партизанами, а также защитить наших граждан в Афганистане.\n\n[ROOT.GetLeader], если вы решите продолжить размещение войск в Афганистане, мы не будем вас останавливать, но, пожалуйста, тщательно подумайте, действительно ли это стоит риска."
 AFG_taliban_insurgency.14.a: "Мы внесем свой вклад в усилия Афганистана по борьбе с повстанцами."
 AFG_taliban_insurgency.14.b: "Нам лучше не рисковать жизнями наших военнослужащих."
 AFG_taliban_insurgency.15.t: "[FROM.GetNameDef] присоединяется к нашей борьбе"
 AFG_taliban_insurgency.15.d: "Лидер [FROM.GetLeader], [FROM.GetNameDef], сообщил нашему правительству, что военнослужащие [FROM.GetAdjective], дислоцированные в нашей стране, готовы присоединиться к нашей борьбе в контртеррористической операции против талибов, а также защищать своих граждан внутри страны.\n\nКроме того, [FROM.GetName] также окажет помощь в обеспечении безопасности, предоставив, например, устройства обнаружения взрывчатых веществ и другое современное военное оборудование."
 AFG_taliban_insurgency.15.a: "Мы благодарны за помощь!"
 AFG_taliban_insurgency.16.t: "[FROM.GetNameDef] начинает вывод войск"
 AFG_taliban_insurgency.16.d: "Лидер [FROM.GetLeader], [FROM.GetNameDef], сообщил нашему правительству, что войска [FROM.GetAdjective], дислоцированные в нашей стране, выполнили свою миссию и возвращаются домой.\n\nКомандир войск [FROM.GetAdjective] в нашей стране уже начал процедуру передачи базы нашим командирам."
 AFG_taliban_insurgency.16.a: "Прощание!"
 AFG_taliban_insurgency.17.t: "Успешный рейд на убежище талибов"
 AFG_taliban_insurgency.17.d: "Благодаря нашим отважным спецподразделениям, обнаруженное нами убежище талибов было уничтожено, некоторые боевики пытались оказать сопротивление, но были убиты нашими спецподразделениями, а большинство других сдались, и лишь немногим удалось избежать правосудия. В целом, операция прошла с полным успехом!"
 AFG_taliban_insurgency.17.a: "Отличный!"
 AFG_taliban_insurgency.18.t: "Провал рейда"
 AFG_taliban_insurgency.18.d: "Неудачная попытка завершить рейд стала огромным ударом для нашего контртеррористического подразделения спецназа. Талибы, по-видимому, знали о наших планах заранее и предприняли превентивную атаку на некоторые из наших колонн, установив самодельные взрывные устройства на нашем маршруте и устроив засаду нашим спецназовцам после взрыва. К сожалению, несколько спецназовцев погибли в результате.\n\nВ ходе разбора ситуации некоторые военные генералы заподозрили, что среди организаторов операции могли быть сочувствующие, которые могли передать план талибам. В отчете также критикуется коррупция в правительстве, которая, возможно, привела к гибели спецназовцев. Мы должны проанализировать эту неудачу и извлечь из нее урок!"
 AFG_taliban_insurgency.18.a: "Покойся с миром!"
 AFG_taliban_insurgency.21.t: "Удар беспилотника удался"
 AFG_taliban_insurgency.21.d: "Наш удар беспилотником по талибам удался! Наш беспилотник смог обнаружить, поразить и уничтожить несколько убежищ талибов вблизи городской зоны, парализовав их военные возможности в этом районе и временно дезорганизовав местное руководство.\n\nХотя поначалу местное население опасалось удара беспилотника, теперь оно радуется отступлению повстанцев Талибана, по крайней мере, на данный момент."
 AFG_taliban_insurgency.21.a: "Беспилотники — это будущее войны!"
 AFG_taliban_insurgency.22.t: "В результате неудачного удара беспилотника погибли мирные жители."
 AFG_taliban_insurgency.22.d: "Сегодня один из наших беспилотников нацелился и уничтожил то, что выглядело как убежище талибов недалеко от жилого района, но недавние разведывательные данные пришли к выводу, что целью атаки было небольшое многоквартирное здание, в котором проживали мирные жители.\n\nЖурналисты уже освещают инцидент, и многие группы критикуют наше участие в этой войне."
 AFG_taliban_insurgency.22.a: "Это была техническая ошибка!"
 AFG_taliban_insurgency.23.t: "Бомбардировочная операция прошла успешно."
 AFG_taliban_insurgency.23.d: "По данным разведки, сегодня один из наших стратегических бомбардировщиков уничтожил комплекс туннелей талибов, спрятанных в горах восточного Афганистана.\n\nНаша успешная бомбардировочная кампания начинает парализовать операции талибов в изолированных районах страны, и обрушение их инфраструктуры заставит талибов вовремя сдаться."
 AFG_taliban_insurgency.23.a: "Джихадисты научатся бояться нашей авиации!"
 AFG_taliban_insurgency.24.t: "В результате ошибочной бомбардировки погибли мирные жители."
 AFG_taliban_insurgency.24.d: "Сегодня произошёл катастрофический инцидент!\n\nНаши ВВС бомбили горный район на востоке Афганистана, пока не обнаружили, что там нет лагерей талибов, а находится небольшая деревня между горами. Деревня была полностью разрушена в результате нашей бомбардировки.\n\nДостоверность нашей воздушной кампании серьёзно подорвана. Наших политиков и военное командование обвиняют в военных преступлениях против афганского народа."
 AFG_taliban_insurgency.24.a: "Это ужасно!"
 AFG_taliban_insurgency.25.t: "[FROM.GetNameDef] предоставляет техническое оборудование"
 AFG_taliban_insurgency.25.d: "В сообщении от правительства [FROM.GetAdjective] нашему руководству говорится, что [FROM.GetNameDef] предоставит нам некоторое техническое оборудование для борьбы с повстанцами, включая устройства обнаружения взрывчатых веществ, которые можно установить на автомагистралях или у входов в дома, специально обученных собак для обнаружения скрытых взрывчатых веществ, а также другую электронику для повышения эффективности наших военных и полиции в борьбе с повстанцами Талибана.\n\nОжидается, что оборудование прибудет в течение месяца и, будем надеяться, снизит рост повстанческого движения Талибана, по крайней мере, на короткий период времени."
 AFG_taliban_insurgency.25.a: "Мы благодарны за помощь!"
 AFG_taliban_attack.0.t: "Боевики Талибана атаковали местный полицейский участок."
 AFG_taliban_attack.0.d: "Сегодня группа боевиков «Талибана» без предупреждения устроила засаду на один из контрольно-пропускных пунктов нашей правительственной полиции. Наши полицейские силы были явно не готовы и застигнуты врасплох, они доблестно сражались, пока их начальство не отдало приказ об эвакуации контрольно-пропускного пункта.\n\nБоевики «Талибана» захватили контрольно-пропускной пункт и оказывали поддержку нашим полицейским силам, пока об этом не сообщили военным. Однако в арсенале контрольно-пропускного пункта находилось оружие, которое было захвачено талибами. Во время нападения наши полицейские и военные уничтожили нескольких боевиков «Талибана», но наши полицейские также потеряли нескольких храбрых офицеров."
 AFG_taliban_attack.0.a: "За это им придётся заплатить!"
 AFG_taliban_attack.1.t: "Афганские талибы напали на полицейский участок"
 AFG_taliban_attack.1.d: "Сегодня группа афганских талибов без предупреждения устроила засаду на один из контрольно-пропускных пунктов афганской правительственной полиции. Афганские полицейские были явно не готовы и застигнуты врасплох, но доблестно сражались, пока их начальство не отдало приказ об эвакуации контрольно-пропускного пункта.\n\nБоевики «Талибана» захватили контрольно-пропускной пункт, пока об этом не сообщили афганским военным, которые оказывали поддержку полиции. Однако в арсенале контрольно-пропускного пункта находилось оружие, которое было захвачено талибами. Во время нападения афганская полиция и военные уничтожили нескольких боевиков «Талибана», но полиция также потеряла нескольких храбрых офицеров."
 AFG_taliban_attack.1.a: "Тревожное развитие событий."
 AFG_taliban_attack.2.t: "Талибан совершил теракт с использованием автобуса со взрывчаткой."
 AFG_taliban_attack.2.d: "Сегодня группа боевиков «Талибана» силой остановила автобус с помощью грузовика, расстреляла находившихся внутри мирных жителей из автоматов Калашникова, а затем взорвала заминированный автомобиль рядом с автобусом. После прибытия военной полиции боевики «Талибана» скрылись с места происшествия, некоторые были застрелены, а те немногие, кому не удалось скрыться, были задержаны и доставлены в военную полицию для допроса.\n\nИз результатов допроса и последующего расследования мы знаем, что террористическая атака была целенаправленно направлена против туристов и иностранцев. «Талибан» назначил награду за убийство иностранцев в Афганистане. В результате нападения также есть жертвы среди иностранных граждан, и страны пострадавших уже требуют от нашего правительства провести полное расследование этого нападения."
 AFG_taliban_attack.2.a: "Мы должны выследить этих террористов-талибов!"
 AFG_taliban_attack.3.t: "Взрыв автобуса, устроенный талибами, унес жизни наших граждан."
 AFG_taliban_attack.3.d: "Сегодня группа афганских боевиков «Талибана» силой остановила автобус, используя грузовик, расстреляла находившихся внутри мирных жителей из автоматов Калашникова, а затем взорвала заминированный автомобиль рядом с автобусом. После прибытия афганской военной полиции боевики «Талибана» скрылись с места происшествия, некоторые были застрелены, а те немногие, кому не удалось скрыться, были задержаны и доставлены в военную полицию для допроса.\n\nВ результате нападения также погибли наши граждане, наш посол в Афганистане связался с афганскими официальными лицами, чтобы попытаться урегулировать последствия."
 AFG_taliban_attack.3.a: "Выражаем наши соболезнования семьям погибших!"
 AFG_taliban_attack.4.t: "В результате взрыва автобуса, организованного талибами, погибли иностранцы."
 AFG_taliban_attack.4.d: "Сегодня группа афганских боевиков «Талибана» силой остановила автобус, используя грузовик, расстреляла находившихся внутри мирных жителей из автоматов Калашникова, а затем взорвала заминированный автомобиль рядом с автобусом. После прибытия афганской военной полиции боевики «Талибана» скрылись с места происшествия, некоторые были застрелены, а те немногие, кому не удалось скрыться, были задержаны и доставлены в военную полицию для допроса.\n\nВ результате нападения погибли местные жители Афганистана и иностранные граждане, и оно вызвало широкое осуждение со стороны международного сообщества."
 AFG_taliban_attack.4.a: "Выражаем наши соболезнования жертвам!"
 AFG_taliban_attack.5.t: "Талибы атаковали колонну бензовозов."
 AFG_taliban_attack.5.d: "Сегодня боевики «Талибана» атаковали колонну бензовозов, которые должны были доставить жизненно важное топливо военным и военной полиции. Боевики «Талибана» подожгли бензовозы, а водители были похищены. Местонахождение водителей пока неизвестно.\n\nСообщений о жертвах среди местных жителей пока нет, но бензовозы полностью сгорели, а близлежащие дороги полностью перекрыты военными в целях безопасности. Предполагается, что для возвращения к нормальной жизни в этом районе потребуется некоторое время."
 AFG_taliban_attack.5.a: "Мы должны спасти этих водителей!"
 AFG_taliban_attack.6.t: "Афганские талибы подожгли бензовозы"
 AFG_taliban_attack.6.d: "Сегодня афганские боевики «Талибана» атаковали колонну бензовозов, которые должны были доставить жизненно важное топливо военным и военной полиции. Боевики «Талибана» подожгли цистерны, а водители были похищены. Местонахождение водителей пока неизвестно.\n\nСообщений о жертвах среди местных жителей пока нет, но цистерны полностью сгорели, а близлежащие дороги полностью перекрыты военными в целях безопасности. Предполагается, что для возвращения к нормальной жизни в этом районе потребуется некоторое время."
 AFG_taliban_attack.6.a: "Афганистан действительно опасное место..."
 AFG_taliban_attack.7.t: "Талибы атаковали военный конвой."
 AFG_taliban_attack.7.d: "Сегодня боевики «Талибана» совершили шокирующий теракт с использованием смертников против одного из наших военных конвоев. Боевики «Талибана» подорвали обе машины, приближаясь к военным грузовикам. \n\nВ результате теракта несколько военных грузовиков были уничтожены ударной волной от взрыва, а также были зафиксированы многочисленные жертвы среди наших солдат. К счастью, большинство солдат получили лишь ранения, однако боевики «Талибана», участвовавшие в нападении, были мгновенно убиты собственными бомбами."
 AFG_taliban_attack.7.a: "Необходимо усилить досмотр транспортных средств!"
 AFG_taliban_attack.8.t: "Теракт смертника, совершенный талибами, был направлен против афганских военных."
 AFG_taliban_attack.8.d: "Сегодня афганские боевики «Талибана» совершили шокирующий теракт с использованием смертников против одного из военных конвоев Афганистана. Боевики «Талибана» подожгли две машины, приблизившись к военным грузовикам. \n\nВ результате теракта несколько военных грузовиков были уничтожены ударной волной взрыва, а также погибли несколько солдат афганской армии. Однако боевики «Талибана», участвовавшие в нападении, были мгновенно убиты собственными бомбами."
 AFG_taliban_attack.8.a: "Как афганские военные допустили это?"
 AFG_taliban_attack.9.t: "Талибан наносит удары по иностранным войскам."
 AFG_taliban_attack.9.d: "Сегодня боевик Талибана, замаскированный под местного жителя, незаметно приблизился к колонне иностранных войск, направленных в нашу страну, и взорвал бомбу, спрятанную в тюрбане. В результате первого взрыва никто не пострадал, но другая группа боевиков Талибана воспользовалась возникшим хаосом и обстреляла иностранных солдат из РПГ.\n\nСитуация успокоилась после прибытия подкрепления, но, к сожалению, эта атака привела к многочисленным жертвам и уничтожению нескольких единиц военной техники."
 AFG_taliban_attack.9.a: "Проклятие"
 AFG_taliban_attack.10.t: "Наши военнослужащие погибли в результате нападения талибов."
 AFG_taliban_attack.10.d: "Сегодня боевик Талибана, замаскированный под местного жителя, незаметно приблизился к колонне иностранных войск, направленных в нашу страну, и взорвал бомбу, спрятанную в тюрбане. В результате первого взрыва никто не пострадал, но другая группа боевиков Талибана воспользовалась возникшим хаосом и обстреляла иностранных солдат из РПГ.\n\nСитуация успокоилась после прибытия подкрепления, но, к сожалению, эта атака привела к многочисленным жертвам среди наших военнослужащих, а также к уничтожению нескольких единиц военной техники. Наш местный командир поддерживает связь с афганскими военными командирами для урегулирования последствий."
 AFG_taliban_attack.10.a: "Выразите соболезнования павшим солдатам!"
 AFG_taliban_attack.11.t: "В результате нападения талибов погибли иностранные военнослужащие."
 AFG_taliban_attack.11.d: "Сегодня боевик Талибана, замаскированный под местного жителя, незаметно приблизился к колонне иностранных войск, направленных в нашу страну, и взорвал бомбу, спрятанную в тюрбане. В результате первого взрыва никто не пострадал, но другая группа боевиков Талибана воспользовалась возникшим хаосом и обстреляла иностранных солдат из РПГ.\n\nСитуация успокоилась после прибытия подкрепления, но в результате нападения погибло много людей, а несколько единиц военной техники были уничтожены."
 AFG_taliban_attack.11.a: "Почему они не могут уничтожить талибов?"
 AFG_taliban_attack.12.t: "Талибан совершил подрыв зданий"
 AFG_taliban_attack.12.d: "Сегодня в одном из зданий, где расположены офисы иностранных инвесторов, прогремел мощный взрыв. Результаты расследования показали, что бомба, вероятно, была изготовлена из серии артиллерийских снарядов, украденных или утерянных со склада Афганской национальной армии. Ответственность за взрыв взяли на себя талибы. \n\nСреди погибших есть иностранцы, и представители нашего правительства связались со своими послами для урегулирования последствий."
 AFG_taliban_attack.12.a: "Это негативно скажется на имидже нашей страны!"
 AFG_taliban_attack.13.t: "Наши подрядчики погибли в результате взрыва, устроенного талибами."
 AFG_taliban_attack.13.d: "Сегодня в одном из зданий, где расположены офисы одного из наших подрядчиков, прогремел мощный взрыв. Результаты расследования показали, что бомба, вероятно, была изготовлена из серии артиллерийских снарядов, украденных или утерянных со склада Афганской национальной армии. Ответственность за взрыв взяли на себя талибы. \n\nСреди жертв есть и наши граждане, наш посол в Афганистане поддерживает связь с представителями афганского правительства для урегулирования последствий."
 AFG_taliban_attack.13.a: "Они обязаны защитить наших инвесторов!"
 AFG_taliban_attack.14.t: "В результате взрыва в здании, совершенного талибами, погибли иностранцы."
 AFG_taliban_attack.14.d: "Сегодня в одном из крупных городов Афганистана, где расположены офисы иностранных подрядчиков, прогремел мощный взрыв. Результаты расследования показали, что бомба, вероятно, была изготовлена из серии артиллерийских снарядов, украденных или утерянных со склада Афганской национальной армии. Ответственность за взрыв взяли на себя талибы. \n\nСреди жертв есть иностранные граждане, и представители афганского правительства связались с послами пострадавших стран для урегулирования последствий."
 AFG_taliban_attack.14.a: "Зачем какой-либо стране инвестировать в Афганистан?"
 AFG_taliban_attack.15.t: "Талибан взрывает аэропорт"
 AFG_taliban_attack.15.d: "Сегодня один из наших аэропортов двойного назначения подвергся нападению с использованием заминированного автомобиля: грузовик, перевозивший взрывное устройство, протаранил ограждение на въезде в аэропорт и привел в действие устройство, установленное в грузовике. Взрыв причинил значительный ущерб аэродрому из-за чрезвычайно высокой мощности бомбы в автомобиле. Вскоре после поступления первых сообщений ответственность за нападение взяла на себя сеть Хаккани, наиболее радикальное ответвление Талибана.\n\nВ результате нападения погибло большое количество наземного персонала и пассажиров, ожидавших в терминале. Наши службы безопасности были застигнуты врасплох, и общественность задается вопросом, как грузовик, начиненный взрывчаткой, вообще смог добраться до ворот охраняемого аэродрома."
 AFG_taliban_attack.15.a: "Террористов из числа талибов необходимо выследить!"
 AFG_taliban_attack.16.t: "Крупное нападение на аэропорт в Афганистане"
 AFG_taliban_attack.16.d: "Сегодня один из афганских аэропортов двойного назначения подвергся нападению с использованием заминированного автомобиля: грузовик, перевозивший взрывное устройство, протаранил ограждение на въезде в аэропорт и привел в действие устройство, установленное в грузовике. Взрыв причинил значительный ущерб аэропорту из-за чрезвычайно высокой мощности бомбы, находившейся в автомобиле. Вскоре после поступления сообщений об этом ответственность за нападение взяла на себя сеть Хаккани, наиболее радикальное ответвление Талибана.\n\nВ результате нападения погибло большое количество людей, но сообщений о жертвах нет. [ROOT.GetAdjective] В Афганистане погибли или получили ранения граждане. Наш лидер [ROOT.GetLeader] выразил соболезнования [AFG.GetLeader] за нападение и решительно осудил действия талибов."
 AFG_taliban_attack.16.a: "Бои талибов достигли критического уровня!"
 AFG_news.17.t: "Антиталибанское восстание в Афганистане"
 AFG_news.17.d: "После операции «Несокрушимая свобода» в Герате наблюдается всплеск сопротивления, поскольку местные ополченцы, при поддержке США и Ирана, бросают вызов контролю талибов. Улицы наполняются ликующими сценами, когда ополченцы захватывают ключевые районы и присоединяются к Северному альянсу. \"Лев Герата\" Мохаммад Исмаил Хан предлагает амнистию бывшим боевикам Талибана, но предостерегает от будущих военных действий. Восстания знаменуют собой поворотный момент в борьбе Афганистана за стабильность."
 AFG_news.17.a: "Интересный поворот событий."
 AFG_events.27.t: "Роль женщин"
 AFG_events.27.d: "Хотя концепция роли женщин в нашем обществе может показаться нетрадиционной, у государства существуют различные взгляды на то, как двигаться вперед в этом направлении."
 AFG_events.27.a: "Им следует играть более традиционную роль."
 AFG_events.27.b: "Давайте дадим им роль."
 AFG_events.28.t: "Роль религии"
 AFG_events.28.d: "Роль религии и вопрос о том, следует ли Афганистану открыться для суннитского ислама или сохранить его строгую приверженность ему, являются спорными."
 AFG_events.28.a: "Мы останемся закрытыми."
 AFG_events.28.b: "Нам следует открыться."
 AFG_events.35.t: "Воздушная перевозка в Северный альянс"
 AFG_events.35.d: "На фоне продолжающегося конфликта в Афганистане Россия оказалась вовлечена в дела региона. С 1996 года российское правительство тайно поддерживало Северный альянс, предоставляя оружие и припасы для укрепления сопротивления свергнутого афганского правительства. Эта поддержка проистекает из опасения распространения конфликта на Центральную Азию, как это было ранее с УТО в гражданской войне в Таджикистане. Теперь, когда министр обороны Иванов раскрыл масштабы этой помощи, российское руководство стоит перед важным решением: продолжать ли оказывать помощь Северному альянсу, несмотря на экономические трудности, или полностью прекратить поддержку."
 AFG_events.35.a: "Просьба к Соединенным Штатам взять на себя расходы."
 AFG_events.35.b: "Мы можем оплатить расходы."
 AFG_events.35.c: "Прекратите поток помощи"
 AFG_events.36.t: "Афганский Северный альянс открыт для размещения беспилотников."
 AFG_events.36.d: "После взрывов посольств США в 1998 году и последующих ракетных ударов США по тренировочным лагерям «Аль-Каиды» в Афганистане Соединенные Штаты активизировали усилия по ликвидации террористических сетей, в том числе потребовав выдачи Усамы бен Ладена. На встрече высокопоставленных должностных лиц в сфере национальной безопасности было решено, что талибам будет предъявлен ультиматум с требованием выдать бен Ладена. Несмотря на прежнее нежелание сотрудничать с Северным альянсом, сейчас появилась возможность для совместных действий по отслеживанию местонахождения бен Ладена."
 AFG_events.36.a: "Запустить дроны наблюдения"
 AFG_events.36.b: "Мы уже определили цель."
 AFG_events.37.t: "Усиление поддержки Северного альянса Афганистана"
 AFG_events.37.d: "В условиях разгорающегося конфликта в Афганистане Северный альянс нуждается в усиленной поддержке для борьбы с талибами и «Аль-Каидой». Тайная помощь Индии имеет решающее значение, предоставляя средства, радиолокационное оборудование, запчасти для самолетов и техническую поддержку для обслуживания истребителей. Поскольку индийские военные советники играют важную роль в борьбе с талибами, их помощь стала незаменимой для солдат [AFG.GetLeader]."
 AFG_events.37.a: "Необходимо устранить пакистанских марионеток."
 AFG_events.37.b: "Мы не хотим продолжать этот процесс."
 AFG_events.38.t: "В Афганистан прибыла российская транспортная техника, доставленная воздушным транспортом."
 AFG_events.38.d: "В Афганистан начали поступать российские военные машины, включая оружие, припасы и технику, воздушным путем. Прибытие этой техники открывает новые возможности для войны."
 AFG_events.38.a: "Добрая весть"
 AFG_events.39.t: "США одобрили поддержку беспилотников."
 AFG_events.39.d: "Соединенные Штаты одобрили запрос на использование беспилотников для нанесения ударов по тренировочным лагерям «Аль-Каиды» и отслеживания Усамы бен Ладена. Теперь мы можем использовать разведывательные данные для сбора информации и координации действий с американскими войсками."
 AFG_events.39.a: "Отличные новости!"
 AFG_events.40.t: "Поддержка со стороны Индии продолжается."
 AFG_events.40.d: "Афганистан получает поддержку от Индии, включая финансирование, радиолокационное оборудование, запчасти для самолетов и военных советников."
 AFG_events.40.a: "Большой"
 AFG_events.41.t: "Запрос в службу поддержки отклонен."
 AFG_events.41.d: "Несмотря на попытки заручиться дополнительной поддержкой, запрос о помощи был отклонен. Нам придется полагаться на имеющиеся ресурсы."
 AFG_events.41.a: "Разочарование"
 AFG_events.42.t: "Россия просит нас оплатить счет."
 AFG_events.42.d: "Россия не желает покрывать расходы на дорогостоящую операцию по воздушной переброске грузов для снабжения Северного альянса в Афганистане. Господин Иванов обратился за помощью к Соединенным Штатам, а также состоялись переговоры с представителями британского министерства обороны. США стоят перед выбором: оказывать ли России помощь в этой операции."
 AFG_events.42.a: "Мы можем это сделать"
 AFG_events.42.b: "мы не можем"
 AFG_news.18.t: "Россия обратилась к США с просьбой оплатить авиаперевозку в Афганистан."
 AFG_news.18.d: "Запрос России о помощи в финансировании операции по воздушной переброске грузов для снабжения Северного альянса в Афганистане был встречен насмешками со стороны мирового сообщества. Несмотря на свою военную мощь, нежелание России оплатить расходы вызвало критику, и многие ставят под сомнение ее приверженность этому делу. Некоторые даже предложили России пересмотреть свои приоритеты и сосредоточиться на решении собственных экономических проблем. Поставки в Афганистан начались в конце сентября, боеприпасы и военная техника доставлялись по понтонным мостам, построенным 201-й российской дивизией через реку Пяндж, разделяющую Таджикистан и Афганистан, как сообщила «Независимая газета»."
 AFG_news.18.a: "Куда же делись все деньги?"
 AFG_news.18.c: "Прилетит ли орёл снова на помощь раненому медведю?"
 AFG_news.18.b: "Э-э, вообще-то"
 AFG_news.19.t: "США развернули беспилотники Predator в Афганистане."
 AFG_news.19.d: "Соединенные Штаты развернули в Афганистане беспилотники Predator для нанесения ударов по опорным пунктам террористической организации «Аль-Каида». Эта эскалация в Афганистане знаменует собой новую эру военного присутствия США в регионе. Ожидается, что беспилотники обеспечат сбор разведывательной информации и наблюдение, что повысит эффективность операций американских вооруженных сил в стране."
 AFG_news.19.a: "Интересный"
 AFG_news.20.t: "[AFG.GetLeader] Обращение к Европейскому парламенту"
 AFG_news.20.d: "В ходе пресс-конференции в Европейском парламенте [AFG.GetLeader] призвал мировых лидеров оказать давление на Пакистан в связи с его поддержкой талибов и запросил гуманитарную помощь для облегчения страданий афганского народа. Эта просьба прозвучала на фоне его предупреждения о планируемом нападении «Аль-Каиды» на западные страны."
 AFG_news.20.a: "Это может вызывать беспокойство."
 AFG_news.21.t: "Достум присоединился к планам штурма Мазари-Шарифа."
 AFG_news.21.d: "Возвращение Достума в Афганистан из изгнания было воспринято как возможность отвоевать Мазари-Шариф. Теперь, вместе с командующим Ахмадом Шахом Масудом, Исмаилом Ханом и Мохаммадом Мохакиком, он готовится к наступлению на удерживаемый талибами город Мазари-Шариф. \n\nДостум, первоначально командовавший 374-м воинским подразделением коммунистических сил НДПА, перешел на сторону моджахедов после падения Кабула в 1992 году. Затем он основал свое протогосударство в Мазари-Шарифе, обычно известное как Северная автономная зона. Он печатал собственную валюту и даже управлял собственной авиакомпанией «Балх Эйр». \n\nПосле кратковременной потери контроля над Мазари-Шарифом в пользу талибов, Достум вернулся из изгнания в октябре 1997 года, чтобы восстановить контроль. Несмотря на его усилия, талибы вернулись в 1998 году, что вынудило Достума снова бежать в Турцию."
 AFG_news.21.a: "Посмотрим, что произойдёт."
 AFG_events.45.t: "Махмуд Сурха перешел на сторону талибов."
 AFG_events.45.d: "Командир Махмуд Сурха перешел на сторону талибов, заявив о недовольстве вмешательством России в войну. [AFG.GetLeader] отрицает это утверждение, но заявляет, что имеет право добиваться международной поддержки, поскольку является де-факто признанным правительством Афганистана."
 AFG_events.48.t: "Абдулла Джан Вахиди переходит на сторону противника"
 AFG_events.48.d: "Хаджи Абдул Кадир признал, что один из их ключевых командиров, Абдулла Джан Вахиди, перешел на сторону талибов."
 AFG_events.48.a: "Мы ничего не можем сделать."
 AFG_events.44.t: "Исмаил Хан сбежал из тюрьмы в Кандахаре."
 AFG_events.44.d: "Исмаил Хан, бывший губернатор Герата и лидер сопротивления правящему режиму талибов, сбежал из тюрьмы в Кандахаре.\nХана можно считать одним из самых уважаемых лидеров моджахедов в повстанческом движении против советских войск. В 1992 году войска моджахедов захватили Герат, и Исмаил Хан стал губернатором. В 1995 году он защищал город от талибов в сотрудничестве с Ахмадом Шахом Масудом. Хан даже предпринял наступление на оплот талибов в Кандахаре, но был отброшен. Ситуация изменилась, когда генерал Абдул Рашид Достум атаковал Герат, вынудив Исмаила Хана и его 8000 человек бежать в Иран до того, как талибы захватили контроль над провинцией Герат. Два года спустя, организуя сопротивление талибам в районе Фариаб, он был предан и захвачен Абдулом Маджидом Рузи, который перешел на сторону талибов вместе с Абдулом Маликом Пахлаваном, тогда одним из заместителей Достума."
 AFG_events.44.a: "Снова взвесив шансы"
 AFG_events.45.a: "Что мы вообще можем сделать?"
 AFG_events.65.t: "Афганистан призывает о поддержке"
 AFG_events.65.d: "В условиях сокращения техники и ресурсов Афганистан срочно просит нашей помощи в направлении бойцов для обучения местных афганских боевиков и обеспечения их необходимым снаряжением и транспортными средствами, что позволит им самостоятельно бороться с талибами и тем самым минимизировать необходимость прямого военного вмешательства."
 AFG_events.65.a: "Да, мы это сделаем."
 AFG_events.65.b: "Нет, мы не будем."
 AFG_events.66.t: "Они принимают"
 AFG_events.66.d: "Соединенные Штаты приняли запрос и направят советников вместе с оборудованием для оказания помощи Афганистану в борьбе с талибами, что является важным шагом в укреплении афганских сил и усилении сотрудничества в борьбе с повстанцами и стабилизации региона."
 AFG_events.66.a: "Мы отправимся в путь"
 AFG_border_wars.1.t: "[event_target:AFG_ATTACKER.GetName] побеждает в пограничной войне"
 AFG_border_wars.1.d: "[event_target:AFG_ATTACKER.GetName] одержал победу в пограничной войне против [event_target:AFG_DEFENDER.GetName] и продвинулся на новые территории. Вероятно, после этого они продолжат наступление."
 AFG_border_wars.1.a: "Ура!"
 AFG_border_wars.1.b: "Проклятие"
 AFG_border_wars.1.c: "Ускорьте процесс!"
 AFG_border_wars.2.t: "[event_target:AFG_ATTACKER.GetName] проигрывает пограничную войну"
 AFG_border_wars.2.d: "[event_target:AFG_ATTACKER.GetName] проиграл пограничную войну [event_target:AFG_DEFENDER.GetName]."
 AFG_border_wars.2.a: "Ура!"
 AFG_border_wars.2.b: "Проклятие"
 AFG_border_wars.3.t: "Талибан готовится к продвижению в племенные районы."
 AFG_border_wars.3.d: "Талибы планируют проникнуть в племенные районы, в первую очередь в Северный Вазиристан и регион Парачинар. Один из переговорщиков от талибов проинформировал нас об этих планах, и они надеются, что мы позволим им остаться там на «временный период». Хотя этот регион довольно незначителен в масштабах всей страны, это все равно потеря территории и вторжение радикальных террористов в страну."
 AFG_border_wars.3.a: "Пока они полезны, они могут оставаться."
 AFG_border_wars.3.b: "Категорически нет"
 AFG_border_wars.4.t: "Пакистан осуждает планы по вторжению в племенные районы."
 AFG_border_wars.4.d: "Правительство Пакистана недавно связалось с нами и выразило недовольство перспективой пребывания сил Талибана в районах Северного Вазиристана и Парачинара. Хотя это и не стало неожиданностью, это все же препятствие на пути к возвращению Афганистана под контроль государства."
 AFG_border_wars.4.a: "Отлично"
 AFG_border_wars.4.b: "К черту их возражения!"
 AFG_border_wars.5.t: "Пакистан разрешил передвижение в племенные районы."
 AFG_border_wars.5.d: "Правительство Пакистана дало понять, что намерено игнорировать наши действия в районах Северного Вазиристана и Парачинара. Это означает, что мы можем продолжать расширять наши операции и повышать свои шансы в случае начала крупного наступления со стороны Афганистана."
 AFG_border_wars.5.a: "Хороший"
 AFG_border_wars.6.t: "Талибан нас игнорирует"
 AFG_border_wars.6.d: "Талибы игнорируют нас и наши возражения против их недавних действий в Северном Вазиристане и регионе Парачинар. Похоже, у нас нет иного выбора, кроме как применить силу, чтобы показать им, что нас нельзя растоптать."
 AFG_border_wars.6.a: "Они начали это."
 AFG_border_wars.7.t: "Афганские вооруженные силы одержали победу."
 AFG_border_wars.7.d: "После столкновения с талибами афганские вооруженные силы одержали победу над силами талибов. Эта битва преподносится как победа в масштабах всей страны. [AFG.GetLeader]."
 AFG_border_wars.7.a: "Аллаху-Акбар!"
 AFG_border_wars.7.b: "Иншаллах, победа придёт."
 AFG_border_wars.8.t: "Талибанские силы одержали победу"
 AFG_border_wars.8.d: "После столкновения с Афганской национальной армией силы Талибана одержали победу над силами Афганской национальной армии. Эта битва преподносится как победа Талибана в масштабах всего региона. [TAL.GetLeader]."
 AFG_border_wars.8.a: "Аллаху-Акбар!"
 AFG_border_wars.8.b: "Иншаллах, победа придёт."
 AFG_border_wars.9.t: "Результаты расследования столкновения талибов с афганцами неубедительны."
 AFG_border_wars.9.d: "После столкновения между талибами и силами Афганской национальной армии международные силы наблюдали замершую линию фронта. Сообщается, что обе стороны замедлили наступление и отступили в районы, где находились до столкновения."
 AFG_border_wars.9.a: "Хорошо"
 AFG_uzbek_bombing_of_the_imu: "Узбекская бомбардировочная кампания"
 AFG_uzbek_bombing_of_the_imu_desc: "Узбекская авиация наносит удары по лагерям Исламского движения Узбекистана на северной границе. Эти рейды ослабляют противовоздушную оборону талибов и снижают эффективность их наступлений до тех пор, пока Ташкент продолжает полеты."
