 EMPLOYMENT_PRIORITY_TT: "§YEmployment Priority§!"
 EMPLOYMENT_PRIORITY_TT_DELAYED: "Each building type has a §YPriority§! from 1 to 10. When there are fewer workers than jobs, they are shared out in proportion to priority and to the jobs each type offers, so a priority 10 job is filled ten times as readily as a priority 1 job. Workers a full sector cannot use go to the others.\n\nWhen there are enough workers for every job, every building is fully staffed and priorities do not matter. Buildings without enough workers produce less. Healthcare and government administration are prioritised like the other sectors, with a minimum staffing of 10%."
