 EH_scientist_Jennifer_Doudna_tt: "§YJennifer Doudna§!"
 EH_scientist_Jennifer_Doudna_tt_delayed: "Jennifer Doudna é uma renomada bioquímica conhecida por seu trabalho pioneiro na tecnologia de edição genética CRISPR, ao lado de Emmanuelle Charpentier. Graças ao CRISPR, talvez possamos compreender melhor a composição genética das Quimeras e encontrar uma forma de explorar suas fraquezas.\n--------------\n§YEfeitos:§!\n[!EH_hire_Jennifer_Doudna_button_click]\n\n§YPré-requisitos:§!\n[!EH_scientist_Jennifer_Doudna_click_enabled]"
 EH_scientist_Fabiola_Gianotti_tt: "§YFabiola Gianotti§!"
 EH_scientist_Fabiola_Gianotti_tt_delayed: "Fabiola Gianotti é uma física de partículas experimental italiana e atual Diretora-Geral do CERN. Sua experiência em física de partículas e em colaborações científicas de grande escala será inestimável em nossos esforços para entender os Portais e sua conexão com outras dimensões.\n--------------\n§YEfeitos:§!\n[!EH_hire_Fabiola_Gianotti_button_click]\n\n§YPré-requisitos:§!\n[!EH_scientist_Fabiola_Gianotti_click_enabled]"
 EH_scientist_Lene_Hau_tt: "§YLene Hau§!"
 EH_scientist_Lene_Hau_tt_delayed: "Lene Hau é uma física dinamarquesa conhecida por seu trabalho revolucionário em desacelerar e parar a luz. Sua especialização em óptica quântica e física da matéria condensada pode fornecer pistas sobre a natureza dos Portais e suas emissões de energia.\n--------------\n§YEfeitos:§!\n[!EH_hire_Lene_Hau_button_click]\n\n§YPré-requisitos:§!\n[!EH_scientist_Lene_Hau_click_enabled]"
 EH_scientist_Emmanuelle_Charpentier_tt: "§YEmmanuelle Charpentier§!"
 EH_scientist_Emmanuelle_Charpentier_tt_delayed: "Emmanuelle Charpentier é uma microbiologista e bioquímica francesa. Junto com Jennifer Doudna, desenvolveu a tecnologia de edição genética CRISPR-Cas9. Seu conhecimento será crucial em nossos esforços para entender e, potencialmente, manipular a biologia das Quimeras.\n--------------\n§YEfeitos:§!\n[!EH_hire_Emmanuelle_Charpentier_button_click]\n\n§YPré-requisitos:§!\n[!EH_scientist_Emmanuelle_Charpentier_click_enabled]"
 EH_scientist_Andrzej_Trautman_tt: "§YAndrzej Trautman§!"
 EH_scientist_Andrzej_Trautman_tt_delayed: "Andrzej Trautman é um físico teórico polonês conhecido por seu trabalho em relatividade geral e física de buracos negros. Sua especialização pode nos ajudar a entender a física fundamental por trás dos Portais e seus efeitos em nosso mundo.\n--------------\n§YEfeitos:§!\n[!EH_hire_Andrzej_Trautman_button_click]\n\n§YPré-requisitos:§!\n[!EH_scientist_Andrzej_Trautman_click_enabled]"
