 RULE_OPTION_GREAT_COLLAPSE: "Wielki upadek"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "Wraz z upadkiem ZSRR w 91 roku, szalejący militaryzm Stanów Zjednoczonych powoli stawał się coraz większym obciążeniem dla podatników. Seria protestów w latach 1995-99 doprowadziła do stale rosnącej liczby ofiar i niezadowolenia wśród ludności, a rząd federalny utknął w stanie zimnej wojny. Teraz, osiągając punkt wrzenia na przełomie wieków, na szczycie obaw przed Y2K, rosną plotki o ogólnokrajowym strajku kolejowym, strajku, który może sparaliżować gospodarkę i federalne możliwości koordynowania działań kontrprotestacyjnych."
 USB_AI_BEHAVIOR: "@USB Wolne Stany Ameryki"
 RULE_OPTION_REVANCHIST_PATH: "Odzyskiwanie przeznaczenia"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "Wpływy federalne wpłyną na Wolne Stany i skłonią je do ukierunkowania swojej polityki zagranicznej na rewanżyzm wobec 48 stanów kontynentalnych.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RULE_OPTION_ISOLATION_PATH: "Wielkie wyłączenie"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "Amerykański sen umarł, świat wydaje się coraz większą pustką. W związku z tym ludzie i przywódcy polityczni decydują, że najlepszym rozwiązaniem jest odwrócenie się od świata i po prostu cieszenie się słodkim spokojem i ciszą, które ich mały zakątek, miejmy nadzieję, przyniesie.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RULE_OPTION_ARCADIA_PATH: "Tożsamość Wschodnia"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "Gdy amerykański sen stał się koszmarem, wpływy federalne słabną. W związku z tym ludzie uznali, że nowy sposób na przyszłość jest jedyny słuszny i jako taki chcą stworzyć nową „tożsamość Wschodu” poprzez Plan Arcadii.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 CSA_AI_BEHAVIOR: "@CSA Południowa Republika Ameryki"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "Ameryka Południowa"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "Ponieważ amerykański sen wciąż płonie w sercach ludów Południa, wielu wpływa na poglądy rządu, aby zreformować stare chwały i rozpocząć tworzenie nowej Ameryki. Ameryki Południowej.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "Złoty Krąg"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "Wielu mieszkańców Południa wierzy, że powinni wykuć nowe przeznaczenie, które jest wyjątkowo południowe z natury. W związku z tym wielu u władzy pragnie powrócić do starego pomysłu Konfederacji jako sposobu na umocnienie tej nowej ery wolności.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "Tożsamość Wschodnia"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "Gdy amerykański sen się wypalił i niewielu chce być zbyt uwikłanym w „stygmat Konfederacji”, wielu mieszkańców Południa zwraca się ku francuskim wpływom ludów Cajon i Kreolów, aby stworzyć nową tożsamość. Nieamerykańską ani Konfederacji, ale mimo to naszą.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "Powstanie na Florydzie"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "Na początku tour young nation, socjalistyczne szumowiny i sympatycy przejęli władzę i ukradli wybory. Teraz nadszedł czas, aby prawdziwi patrioci z południa bronili tego, co pozostało z naszych domów przed tymi czerwonymi diabłami.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 CAS_AI_BEHAVIOR: "@CAS Kaskadia"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "Opór Gór Skalistych"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "Rząd Olympii pozwoli lokalnym organom ścigania poradzić sobie z rosnącymi niepokojami w stanie Gór Skalistych Idaho. Niepowodzenie lokalnych organów ścigania w opanowaniu stale rosnącego ruchu oporu skutkuje powstaniem niepodległościowym przeciwko narodowi Cascadian.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "Pokój w naszych czasach"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "Rząd Olimpii wyśle ​​specjalną jednostkę śledczą, aby pomóc i poprowadzić ruch kontroporu. Z czasem ich pomoc przywróci prawo i porządek oraz zmusi lidera RMR do rozwiązania grupy, co doprowadzi do bardziej pokojowego i zjednoczonego narodu.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 LKT_AI_BEHAVIOR: "@LKT Republika Lakoty"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "Wojna na froncie odzyskiwania"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "Północny rząd odrzuci i zdegraduje przypadkowy napływ tubylców pod auspicjami organizacji Reclamation Front. Jako taki, nadgorliwy audytor wysłany przez rząd Lakota udaje się na własną rękę, aby spotkać się z przywódcami RF, co skutkuje szybkim powstaniem rozłamu, który ostatecznie prowadzi do militaryzacji i wojny między kontrolowanym przez RF Kansas a Republiką Lakota.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "Front Rekultywacji Spokój"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "Rozumiejąc zamieszanie w raportach, przeprowadzono by więcej dochodzeń, co doprowadziłoby do szybkiego obalenia niektórych bardziej agresywnych twierdzeń na temat organizacji RF. Dzięki temu nowo odkrytemu jedności rozmowy rozpoczęłyby pracę nad odbudową narodu i wspólną pracą nad utworzeniem lepszej unii gospodarczej i społecznej.§RMusisz mieć albo USA Game Rule Post United albo USA Game Rule Great Collapse§!"
 RUS_AI_BEHAVIOR: "@SOV Federacja Rosyjska"
 RULE_OPTION_PUTIN_AI_DESC: "Federacja Rosyjska będzie dążyć do realizacji polityki zagranicznej Jednej Rosji i wzmocnienia jej pozycji.\n"
 RULE_OPTION_PEACEFUL_REFORM_AI_DESC: "Russia will seek to make liberal reforms and pursue greater ties with the West.\n"
 RULE_OPTION_THE_RED_MENACE_AI_DESC: "Rosja zacznie dryfować w kierunku polityki marksistowskiej i podejmie próbę odbudowy Związku Radzieckiego.\n"
 RULE_OPTION_RISE_OF_RUSSIA_AI_DESC: "Russia will start to drift towards nationalist policies, and will seek to pursue an aggressive foreign policy with the aims of proclaiming Greater Russia.\n"
 RULE_OPTION_NAZBOL_RUSSIA_AI_DESC: "The National Bolsheviks are able to realize a different way for the development of their homeland. They will establish a new order in Russia in hopes of returning stability and greatness.\n"
 RULE_OPTION_IRON_DIMON_RUSSIA_AI_DESC: "Rosja potrzebuje nowego władcy, który nie będzie wiecznie ustępował i negocjował z tymi, którzy w każdej chwili mogą zdradzić naszą wielką ojczyznę.\n"
 RULE_OPTION_LIBERAL_DIMON_RUSSIA_AI_DESC: "Dmitrij Anatoliewicz w końcu pójdzie drogą liberalizmu i poprowadzi Rosję ku liberalizmowi.\n"
 RULE_OPTION_OLIGARCHS_RUSSIA_AI_DESC: "Oligarchs, already empowered heavily within Russia, will attempt to seize even more control for themselves.\n"
