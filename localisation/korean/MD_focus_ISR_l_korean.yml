 daneils_final_prophecy_4: "다니엘의 마지막 환상"
 daneils_final_prophecy_4_desc: "하나님께서 마지막으로 다니엘에게 허락하신 환상에서, 다니엘은 북방의 왕과 남방의 왕 사이의 최후의 전쟁에 대해 들었습니다. 이 전쟁은 종말의 때가 인류에게 풀려나기 전에, 누가 하나님의 종이고 누가 사탄과 손을 잡았는지를 분별하는 유대 민족의 능력을 시험하는 전쟁입니다. 오늘날 우리는 중국이라는 거인과 협력할 기회가 커지는 것과 워싱턴에 있는 최대 동맹국들의 의심 사이에 끼어 있습니다. 누구를 신뢰할지는 우리의 선택입니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_balance_favor_america$§! 또는 §Y$ISR_balance_favor_china$§! 갈래에서 다음에 완료하는 중점으로 §R제거§!됩니다."
 oslo_accords_1: "오슬로 협정"
 oslo_accords_1_desc: "1993년 9월 백악관에서 이츠하크 라빈 총리와 팔레스타인 해방기구 지도자 야세르 아라파트가 역사적인 서명을 하면서, 이스라엘은 최종 평화 협정이 이루어질 때까지의 임시 조치로서 서안지구 주요 도시 지역과 그 주변에 PLO가 운영하는 팔레스타인 자치정부의 수립을 받아들였습니다. 그러나 역사가 가르쳐 주듯이 '임시'로 서명된 것은 언제나 영구적인 것이 됩니다. 이스라엘이 PLO를 팔레스타인인의 정당한 대표로 인정하고 PLO가 이스라엘의 생존권을 인정했음에도, 최종 평화 협정은 여전히 기다리고 있습니다.\n§W--------------§!\n이 국가 정신은 §Y$ISR_tear_down_oslo$§! 중점을 완료하면 §R제거§!되며, §Y$ISR_deligitimize_abbas$§! 또는 §Y$ISR_restore_palestinian_authority$§! 중점을 완료하면 새로운 단계로 넘어갑니다."
