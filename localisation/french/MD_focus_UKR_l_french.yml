 UKR_finish_repair: "Finish the repair of all Long Range Aircraft"
 UKR_finish_repair_desc: "With the restoration of our long-range aircraft complete, the time has come to conclude the repair programme. Our strategic bombers are once again ready to serve, and the resources dedicated to their restoration can now be directed elsewhere. The repair programme will be closed, and no further aircraft will be eligible for restoration through this initiative."
