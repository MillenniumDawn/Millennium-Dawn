 lng_megaproject_6: "프렐류드 해상 LNG"
 recruitment_campaign: "온라인 모병 캠페인"
 lng_megaproject_ast_tt: "대형 프로젝트가 산업 §2결정§! 탭에서 사용 가능해집니다."
 heavy_industry_tt: "민간 산업 프로젝트가 산업 §2결정§! 탭에서 사용 가능해집니다."
 heavy_industry_project: "중공업 건설"
 ast_urban_expansion_initiative_tt: "건설 슬롯을 확장하는 §2결정§!이 산업 결정 탭에서 사용 가능해집니다."
 recruitment_campaigns_tt: "모병 캠페인이 §2군사 결정§! 탭에서 사용 가능해집니다."
 adf_acq_astuirement_program: "ADF 획득 프로그램"
 the_white_paper: "2000년 백서"
 the_white_paper_desc: "2000년 국방 백서는 우리의 현재 군사 능력과 우리 군 지도부가 요구하는 능력에 대한 종합적 검토로 작성되었습니다. 오스트레일리아가 태평양의 안보와 평화유지를 담당하는 주요 공급자라는 점에 더 무게를 두면서, 요구 사항은 주로 무기고 확충과 현장 전술의 혁신에 집중되었습니다."
 the_second_white_paper_1: "제2차 백서"
 the_second_white_paper_1_desc: "첫 백서의 성공에 이어, ADF는 태평양 방위의 요구를 계속 충족하기 위해 일련의 더 광범위한 프로그램과 구조 개편을 수행하라는 임무를 받았습니다."
 ast_we_are_many_tt: "우리나라 인구 구성의 §G미래§!는 우리 손에 달려 있습니다."
 sol_islands_intervention: "솔로몬 제도 지역지원사절단"
 sol_islands_intervention_desc: "현재 이 나라의 상황은 결코 이상적이지 않습니다. 약탈과 무장 투쟁이 일상이 되었고, 공공 서비스는 붕괴했으며, 남은 경찰은 서로 싸우는 집단들 사이에서 파벌로 갈라졌습니다. 제도의 질서를 회복하려면 대규모 안정화 및 재건 노력이 곧 이루어져야 합니다."
 sol_situation_countdown: "상황이 악화되고 있습니다..."
 organise_occupation_force: "점령군 편성"
 organise_occupation_force_desc: "대규모 작전을 개시하기 전에 점령군을 편성해야 합니다. 현재 여러 다른 국가가 지원을 약속했지만, 병력의 대부분은 우리가 맡아야 합니다. 병사 2천 명과 평화유지 훈련을 받은 인원 약 2백 명이 섬의 치안 유지를 담당하게 됩니다."
 operation_anode: "애노드 작전"
 operation_anode_desc: "제도에 대한 우리의 대규모 공세는 여러 단계로 진행되며, 일부는 해상으로, 일부는 치누크를 이용한 공중으로 이루어집니다. 첫 목표는 병참 및 전진 작전 거점으로 삼을 섬의 주요 지점 여러 곳을 장악하는 것입니다. 그다음 재건 작업을 시작할 수 있습니다. 보기 좋게 '헬렘 프렌 작전'이라 부르기로 했는데, 이는 현지 말로 '친구를 돕는다'는 뜻입니다."
 secure_honiara: "호니아라 확보"
 secure_weather_coast: "웨더 해안 확보"
 secure_rural_guadalcanal: "탐베아 농촌 지역 확보"
 secure_malaita_province: "말라이타 주 확보"
 sol_disarm_the_militias: "민병대 무장 해제"
 sol_red_cross: "적십자와 협력"
 sol_red_cross_desc: "적십자는 이미 섬에서 상당한 규모로 활동하고 있습니다. 이들과 협력하면 우리 팀이 위험에 처한 민간인을 치료하고 대피시킬 수 있습니다."
 negotiate_with_the_militias: "무장 세력과 협상"
 negotiate_with_the_militias_desc: "무장 세력과의 협상은 안정화 임무와는 거리가 멀지만, 더 합리적인 세력에 접근해 휴전을 이끌어 내면 시간을 더 벌 수 있습니다."
 disband_the_local_police: "현지 경찰 해체"
 disband_the_local_police_desc: "제도의 현지 경찰은 부패와 파벌주의가 만연하여 더 이상 국민을 위해 복무하지 않는 지경에 이르렀습니다. 무엇이든 바로잡으려면 현재의 법 집행 체계를 해체해야 합니다."
 rebuild_the_local_policeforce: "현지 경찰력 재건"
 rebuild_the_local_policeforce_desc: "이 나라의 법 집행 체계를 재건하려면 신규 경찰관 모집자를 심사하고 교육할 다국적 위원회를 구성하고, 앞으로도 제대로 굴러가도록 안전장치를 마련해야 합니다."
 run_anticorruption_campaign: "부패 척결 캠페인 실시"
 run_anticorruption_campaign_desc: "현재 이 나라의 정치 풍토는 제대로 기능하기조차 어려우며 청렴과는 거리가 멉니다. 정부에 남은 인사 중 흠이 없는 사람은 거의 없습니다. 불법 관행에 대한 전국적 단속을 시작한 뒤에 새로운 토대를 마련하는 방안을 검토할 수 있습니다."
 recruit_public_servants: "공무원 채용"
 recruit_public_servants_desc: "판을 정리하려는 우리의 노력에 이어, 참여 국가들의 공무원을 채용하여 당분간 새 정부에서 근무하게 하고, 결국에는 현지인으로 교체하는 계획을 세울 것입니다. 이러한 외부 전문성이 정부의 신속한 재건을 도울 것입니다."
 reorganise_the_army: "육군 재편"
 reorganise_the_army_desc: "이 나라는 1978년 독립 이후 제대로 된 상비군을 가져 본 적이 없습니다. 있었던 것이라곤 해상 감시 부대와 해체된 경찰에서 넘겨받은 소수의 병력이 전부였습니다. 우리 평화유지군이 상비군의 역할을 맡겠지만, 부담을 덜고 작전을 지원하도록 현지 부대 훈련을 시작할 수 있습니다."
 loans_to_the_new_government: "신정부에 대한 대출"
 loans_to_the_new_government_desc: "솔로몬 제도의 새로운 통치 체계를 계속 개발하는 동안에도 이들의 대외 부채는 여전히 미상환 상태입니다. 신규 인력의 급여와 정부 재건을 위한 자금을 대출해 주겠습니다."
 send_our_reconstruction_teams: "재건 팀 파견"
 send_our_reconstruction_teams_desc: "상황이 충분히 나아져 재건과 공공 서비스 건설을 돕기 위해 재건 팀을 안전하게 파견할 수 있게 되었습니다."
