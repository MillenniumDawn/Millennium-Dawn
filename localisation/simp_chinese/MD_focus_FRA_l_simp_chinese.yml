 france_md.509.t: "引入埃科"
 france_md.509.d: "法国提议以西非共同货币埃科取代非洲金融共同体法郎。采用埃科将赋予我们更大的货币自主权，并加强与法国的联系。"
 france_md.509.a: "采用埃科"
 france_md.509.b: "拒绝提议"
 FRA_airbus_change: "欧洲直升机公司在2014年更名为空客直升机公司"
 FRA_naval_takeover: "DCNS于2017年更名为海军集团。"
