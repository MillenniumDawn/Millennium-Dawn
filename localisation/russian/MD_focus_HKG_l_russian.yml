 HONG_KONG_POLITICS_TT: "\nПолитика §Y[HKG.GetFlag]Гонконга§! разделена на три лагеря: §C£HKG_Conservative Проправительственный лагерь§!, §8£HKG_conservatism Лагерь пандемократии§! и §G£generic_Nat_Populism_small Локалистский лагерь§!. Распределение мест в Законодательном совете определяется их рейтингом одобрения."
