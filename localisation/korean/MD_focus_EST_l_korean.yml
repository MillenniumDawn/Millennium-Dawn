 EST_foreign_research_idea: "해외 연구 추진"
 EST_foreign_research_idea_desc: "에스토니아의 군사적 야망은 분명하지만, 우리의 국내 연구 역량은 여전히 제한적입니다. 동맹국과 전략적 협력 관계를 육성함으로써 최첨단 무기 체계와 선진 군사 기술에 접근할 수 있으며, 이는 우리의 국방 현대화 노력을 가속할 것입니다."
 EST_domestic_research_idea: "국내 연구 추진"
 EST_domestic_research_idea_desc: "우리는 너무 오랫동안 외국인에게 의존해 왔습니다. 에스토니아는 무기 산업에 더 투자하여 외국 공급업체에 대한 의존을 줄임으로써 굳건히 설 것입니다."
