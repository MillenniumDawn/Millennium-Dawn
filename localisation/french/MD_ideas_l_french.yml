 shia_iranian_school: "Chiisme - École iranienne"
 shia_iranian_school_desc: "Le Chiisme (les partisans d'Ali) est une branche de l'islam selon laquelle le prophète Mahomet a désigné Ali ibn Abi Talib comme son successeur (imam). Le Chiisme s'oppose principalement au sunnisme, dont les fidèles estiment que Mahomet n'a pas nommé et reconnaissent Abou Bakr (désigné calife par une shoura, un consensus communautaire) come le premier calife légitime. L'école iranienne du chiisme écarte l'ensemble des oulémas et promeut une relation directe avec Dieu, sans passer par le clergé ni les institutions religieuses traditionnelles."
 ISI_islamic_state_early_offensive_idea: "Première offensive de l'État islamique"
 ISI_islamic_state_early_offensive_idea_desc: "L'État islamique a lancé une offensive en Syrie et en Iraq."
 ISI_islamic_state_failure_idea: "Échec de la défense contre l'État islamique"
 ISI_islamic_state_failure_idea_desc: "Le Califat a lancé son offensive et nous ne sommes pas prêt à y faire face. Nous devons renforcer nos défenses et nous préparer au pire."
 IMF_failed_to_balance_budget_idea: "Échec de l’équilibrage budgétaire"
 IMF_failed_to_balance_budget_idea_desc: "Nous avons échoué à équilibrer notre budget. Notre pays perd peu à peu en stabilité et notre influence politique s'effrite aux yeux du peuple. Il nous faut remédier à cette situation au plus vite."
 SWE_stealth_submarines: "Technologie furtive des sous-marins"
 SWE_stealth_submarines_desc: "Technologie furtive des sous-marins"
 SWE_stealth_corvettes: "Technologie furtive de la Corvette"
 SWE_stealth_corvettes_desc: "Technologie furtive de la Corvette"
 SWE_homeguard: "Garde nationale"
 AI_nationalist_drift: "Dérive nationaliste de Gamerule"
 GAME_RULE_reduce_internal_factions_cost: "Réduit les coûts liés aux factions internes"
 emerging_outlook: "Dérive des perspectives émergentes"
 emerging_outlook_desc: ""
 HLS_idea_holy_see: "Le Saint-Siège"
 HLS_idea_holy_see_desc: "The Vatican City is the center of all Catholicism, and the Pope alone rules a population hand-selected by him and his advisors. With almost no land to build on, we live on the tithes of the faithful and the administration of the Curia. This arrangement ends if the Pope retakes Rome or renounces the faith."
 combined_defense_industries_idea: "Industries de défense combinées"
 combined_defense_industries_idea_desc: ""
 reverberations_of_the_great_financial_crisis: "Répercussions de la Grande Récession"
 reverberations_of_the_great_financial_crisis_desc: "The misnomer of a recession has finally found its way to our great country. Businesses have shut their doors as their American partners are no longer able to purchase from them.\n\nIf we have §YEconomic Boom§! this national spirit will cancel early. Once this national spirit expires we will gain the national spirit §YPost Great Recession Boom§! for 180 days.\n"
 protests_garrison_damage: "Police anti-émeute active"
 additional_recruits_desc: "Des campagnes de recrutement ciblées et des politiques de conscription élargies ont accru la main-d'œuvre disponible pour nos forces armées."
 agricultural_investments_desc: "Des investissements stratégiques dans les infrastructures agricoles et les programmes de modernisation amélioreront notre capacité de production alimentaire et le développement économique rural."
 commercialized_agricultural_investments: "Investissements agricoles commercialisés"
 commercialized_agricultural_investments_desc: "Des exploitations agricoles commerciales à grande échelle et le développement de l'agro-industrie augmenteront notre production agricole tout en créant des débouchés à l'export."
 aircraft_investments_desc: "Des financements dédiés et de la capacité industrielle ont été alloués pour élargir nos capacités de fabrication aéronautique et accélérer la production."
 amphibious_expertise_desc: "Des programmes d'entraînement spécialisés et le développement de la doctrine tactique ont renforcé la capacité de notre armée à mener des opérations amphibies."
 army_morale_bonus_desc: "De meilleures conditions, un leadership amélioré et un dessein national renouvelé ont fortifié l'esprit combatif de nos forces terrestres."
 army_organization_bonus_desc: "Des réformes des structures de commandement et des systèmes logistiques ont rendu notre armée plus efficace et mieux organisée sur le terrain."
 artillery_production_bonus_desc: "Une allocation ciblée de ressources et d'installations de production a accéléré la fabrication de pièces d'artillerie et d'armes d'appui."
 drone_production_idea: "Production nationale de drones"
 drone_production_idea_desc: "L'investissement dans la technologie des véhicules aériens sans pilote et les installations de production a établi une capacité nationale de fabrication de drones."
 equipment_conversion_efforts_idea: "Efforts de conversion d’équipement"
 equipment_conversion_efforts_idea_desc: "Targeted retooling of industrial lines and factories to quickly convert equipment to more modern equipment will support our current efforts in our military modernization."
 civilian_industry_project_desc: ""
 commander_skill_bonus_desc: ""
 establishing_a_paratrooper_corps_idea: "Créer un corps de parachutistes"
 establishing_a_paratrooper_corps_idea_desc: ""
 establishing_a_marine_corps_idea: "Créer un Corps des Marines"
 establishing_a_marine_corps_idea_desc: ""
 battery_park_expansion_idea: "Projets d'agrandissement du parc de batteries"
 battery_park_expansion_idea_desc: "Élargir les parcs de batteries disponibles dans notre nation aidera à améliorer le réseau électrique, garantissant une alimentation stable pour tous nos citoyens et nos industries."
 geothermal_energy_production_idea: "Production d'énergie géothermique encouragée"
 geothermal_energy_production_idea_desc: ""
 hydroelectric_energy_production_idea: "Production d'énergie hydroélectrique encouragée"
 hydroelectric_energy_production_idea_desc: ""
 idea_focus_social_spending_expansions: "Expansion des dépenses sociales"
 idea_focus_social_spending_expansions_desc: ""
 repair_yard_focus: "Priorité aux réparations des chantiers navals"
 repair_yard_focus_desc: ""
 rifle_production_bonus_desc: ""
 convoy_production_bonus: "Focus sur la production de convois"
 convoy_production_bonus_desc: ""
 mechanized_special_forces_idea: "Priorité aux forces spéciales mécanisées"
 mechanized_special_forces_idea_desc: ""
 light_infantry_special_forces_idea: "Priorité aux forces spéciales d'infanterie légère"
 light_infantry_special_forces_idea_desc: ""
 post_great_financial_crisis_boom: "Boom après la grande récession"
 post_great_financial_crisis_boom_desc: "Notre économie s'est remise de la Grande Récession et nous commençons à revenir plus forts que jamais. Un véritable nouveau boom économique !"
 united_nations_member: "Membre des Nations unies"
 united_nations_member_desc: "L'Organisation des Nations unies (ONU) est une organisation intergouvernementale mondiale établie par la signature de la Charte des Nations unies le 26 juin 1945, avec pour mission énoncée de maintenir la paix et la sécurité internationales, de développer des relations amicales entre les États, de promouvoir la coopération internationale et de servir de centre d'harmonisation de l'action des États pour atteindre ces buts."
 unsc_restricted_volunteers_too: "Restriction des volontaires du CSNU"
 unsc_restricted_volunteers_too_desc: "Le §YConseil de sécurité§! de l'§BONU§! a adopté une résolution interdisant aux nations d'envoyer des volontaires militaires vers cette nation. Les nations qui violent cette résolution seront immédiatement §Rsanctionnées§! jusqu'à ce qu'elles retirent leurs volontaires du pays."
 un_aid_esco_member: "Membre de l'Organisation des Nations unies pour l'éducation, la science et la culture"
 un_aid_esco_member_desc: ""
 un_aid_ido_member: "§BONU§! Membre de l'Organisation des Nations unies pour le développement industriel"
 un_aid_ido_member_desc: ""
 un_aid_cdf_member: "§BONU§! Membre du Fonds d'équipement des Nations unies"
 un_aid_cdf_member_desc: ""
 unsc_arms_embargo: "Embargo sur les armes du CSNU"
 unsc_arms_embargo_decs: "Le §YConseil de sécurité§! de l'§BONU§! a adopté une résolution restreignant la vente d'armes et de munitions à cette nation. Elle sera interdite d'accès au marché international jusqu'à ce qu'elle mette fin à tous ses conflits offensifs."
 un_vote_sway_assistance: "Accord d'aide au développement"
 un_vote_sway_assistance_desc: "À la suite d'un accord échangeant un vote au §YConseil de sécurité§! ou à l'§YAssemblée générale§! de l'§BONU§!, notre nation reçoit une aide au développement de la nation qui nous a proposé l'accord."
 un_vote_sway_cost: "Fourniture d'aide au développement"
 un_vote_sway_cost_desc: "En honorant notre part d'un accord conclu dans le cadre d'un vote au §YConseil de sécurité§! ou à l'§YAssemblée générale§! de l'§BONU§!, nous fournissons une aide au développement à la nation qui a accepté nos conditions."
 unga_resolution_poverty_reduction: "Résolution : Réduction de la pauvreté"
 unga_resolution_poverty_reduction_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante engageant les États membres à élargir les filets de protection sociale et à réduire l'extrême pauvreté. Le respect de cette résolution exige une hausse des dépenses en biens de consommation pour financer les programmes sociaux."
 unga_resolution_food_security: "Résolution : Sécurité alimentaire"
 unga_resolution_food_security_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante appelant à investir dans la productivité agricole et les réseaux de distribution alimentaire. Des ressources sont détournées de la production industrielle pour soutenir les initiatives agricoles."
 unga_resolution_global_health: "Résolution : Santé mondiale"
 unga_resolution_global_health_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante visant à élargir l'accès aux soins et la préparation aux pandémies. Si l'amélioration de la santé publique stabilise la société, la demande en fournitures médicales augmente les dépenses en biens de consommation."
 unga_resolution_education_initiative: "Résolution : Initiative en matière d'éducation"
 unga_resolution_education_initiative_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante visant à investir dans les systèmes éducatifs, l'alphabétisation et la recherche scientifique. Des travailleurs sont réorientés vers les programmes éducatifs, ralentissant la construction mais accélérant la production de recherche."
 unga_resolution_clean_energy: "Résolution : Transition énergétique propre"
 unga_resolution_clean_energy_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante encourageant la transition vers les énergies renouvelables. Les infrastructures renouvelables sont encouragées tandis que la construction de centrales fossiles est pénalisée, réduisant la capacité industrielle globale pendant la transition."
 unga_resolution_economic_growth: "Résolution : Croissance économique"
 unga_resolution_economic_growth_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante encourageant une croissance économique durable et l'emploi productif. La productivité et la production des usines augmentent, mais les protections du travail haussent la demande en biens de consommation et le fardeau réglementaire draine le pouvoir politique."
 unga_resolution_infrastructure: "Résolution : Développement des infrastructures"
 unga_resolution_infrastructure_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante appelant à investir dans des infrastructures civiles résilientes. La construction civile s'accélère, mais la construction d'usines militaires ralentit à mesure que les ressources sont réorientées."
 unga_resolution_reduced_inequality: "Résolution : réduction des inégalités"
 unga_resolution_reduced_inequality_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante visant à réduire les inégalités au sein des nations et entre elles. Les programmes de redistribution de la richesse stabilisent la société mais exigent d'importantes dépenses en biens de consommation et du capital politique pour être mis en œuvre."
 unga_resolution_climate_action: "Résolution : Action pour le climat"
 unga_resolution_climate_action_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante sur une action urgente contre le changement climatique. Des objectifs d'émissions agressifs pénalisent sévèrement les infrastructures fossiles et réduisent la production des usines, bien que la bienveillance publique apporte de modestes gains de stabilité."
 unga_resolution_peace_institutions: "Résolution : Paix et institutions fortes"
 unga_resolution_peace_institutions_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante visant à renforcer l'État de droit, à réduire la corruption et à bâtir des institutions responsables. La gouvernance s'améliore et l'ingérence étrangère est combattue, mais les engagements de paix ralentissent la production militaire."
 unga_resolution_trade_partnerships: "Résolution : Partenariats commerciaux"
 unga_resolution_trade_partnerships_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante visant à renforcer les partenariats mondiaux par la coopération commerciale et le transfert de technologies. Les termes de l'échange s'améliorent, mais le respect des normes internationales draine le pouvoir politique."
 unga_resolution_digital_development: "Résolution : Développement numérique"
 unga_resolution_digital_development_desc: "L'§YAssemblée générale§! de l'§BONU§! a adopté une résolution non contraignante visant à combler la fracture numérique par les infrastructures internet et l'investissement technologique. La construction numérique et technologique s'accélère, mais des ressources sont détournées des infrastructures physiques."
 super_power: "Superpuissance"
 super_power_desc: "Nous sommes une superpuissance, dans une position extrêmement dominante dans le monde — caractérisée par notre capacité à exercer une influence et à projeter notre puissance à l'échelle mondiale. Les superpuissances peuvent plausiblement viser l'hégémonie mondiale et rivaliser avec quiconque, éclipsant les grandes puissances traditionnelles.\n\nLe statut de puissance est déterminé par la part de PIB que nous contribuons au total mondial, modifiée par notre §Yindépendance vis-à-vis de l'influence étrangère§!. Notre contribution actuelle est de §Y[?ROOT.percentage_of_global_factories|%1]§!.\n\nLes contributions requises pour les différents niveaux sont :\nPlus de §Y15 %§! pour §Y$super_power$§!\nPlus de §Y6,5 %§! pour §Y$great_power$§!\nPlus de §Y2,5 %§! pour §Y$large_power$§!\nPlus de §Y0,2 %§! pour §Y$minor_power$§!\nMoins de §Y0,2 %§! pour §Y$non_power$§!\n\nDans chaque région géographique, un certain nombre des plus fortes §Y$minor_power$s§! seront classées comme §Y$regional_power$s§! s'il n'y a pas assez de §Y$super_power$s§!, §Y$great_power$s§! et §Y$large_power$s§! dans la région. Les régions et les nombres de pays au-dessus de §Y$minor_power$§! sont :\nEurope (7)\nMoyen-Orient et Afrique du Nord (3)\nAfrique subsaharienne (3)\nAsie (7)\nAmériques (4)\n\nLe classement des puissances est mis à jour trimestriellement (février, mai, août et novembre)."
 super_power_tt: "£economy_laws_cost_texticon Coût des lois: §R+80%§!\n£economy_laws_cost_texticon §YInvestissement interne§! Emplacements: §G+4§!"
 idea_focus_generic_counter_terrorism: "Opérations antiterroristes"
 idea_focus_generic_counter_terrorism_desc: "Des unités antiterroristes dédiées sont intégrées aux services de renseignement et de sécurité, améliorant la suppression de la résistance et le recueil défensif de renseignement."
 idea_focus_generic_cyber_warfare: "Initiatives de cyberguerre"
 idea_focus_generic_cyber_warfare_desc: "L'investissement dans les capacités cyber offensives et défensives a renforcé les communications chiffrées et les réseaux de renseignement nationaux."
 healthcare_privatization: "Système de santé"
 healthcare_privatization_desc: "Détermine le degré auquel les services médicaux sont fournis par l'État plutôt que par l'entreprise privée. Les systèmes entièrement publics garantissent une couverture universelle mais imposent un fardeau budgétaire, tandis que les systèmes entièrement privés réduisent les dépenses de l'État au détriment de l'accès des populations à bas revenus."
 fully_privatized_healthcare: "Des soins de santé entièrement privatisés"
 fully_privatized_healthcare_desc: "Tous les services médicaux sont fournis par des prestataires privés opérant dans un environnement de marché. L'État n'assume aucune dépense de santé directe, mais l'accès est déterminé par la capacité à payer, et l'inégalité sociale des résultats sanitaires est généralement élevée."
 partially_privatized_healthcare: "Soins de santé partiellement privatisés"
 partially_privatized_healthcare_desc: "Les prestataires privés fournissent la majorité des services de santé, l'État ne finançant qu'un filet de sécurité limité. Les coûts restent relativement bas pour le gouvernement, bien que des lacunes de couverture demeurent pour ceux qui ne peuvent s'offrir une assurance privée."
 partially_nationalized_healthcare: "Des soins de santé partiellement nationalisés"
 partially_nationalized_healthcare_desc: "Un système mixte dans lequel hôpitaux publics et régimes d'assurance opèrent aux côtés de prestataires privés. L'État garantit un niveau de soins de base à tous les citoyens tout en permettant à l'offre privée de le compléter."
 fully_nationalized_healthcare: "Des soins de santé entièrement nationalisés"
 fully_nationalized_healthcare_desc: "La santé est traitée comme un service public universel, financé et administré entièrement par l'État. Tous les citoyens reçoivent une couverture indépendamment de leurs revenus, bien que le gouvernement assume le coût intégral et que le système exige un investissement continu important."
 mining_policies: "Règlements miniers"
 mining_policies_desc: "Régit les normes environnementales et opérationnelles appliquées à l'extraction des ressources naturelles. Des réglementations plus strictes protègent l'environnement et les communautés mais réduisent la production ; des normes plus souples maximisent les rendements au prix de dégâts écologiques."
 full_environmental_protections: "Protections environnementales complètes"
 full_environmental_protections_desc: "Une législation complète impose les normes environnementales les plus strictes à toutes les opérations d'extraction. La production industrielle est contrainte, mais la santé à long terme des écosystèmes et des communautés locales est préservée."
 partial_environmental_protections: "Protections environnementales partielles"
 partial_environmental_protections_desc: "Des normes environnementales s'appliquent aux zones les plus sensibles et aux pratiques les plus destructrices, tandis que l'extraction courante se poursuit avec une surveillance limitée. Un compromis qui modère le préjudice écologique sans entraver significativement la production."
 balanced_protections: "Règlements miniers équilibrés"
 balanced_protections_desc: "Les réglementations sont calibrées pour permettre une extraction efficace tout en imposant des sauvegardes environnementales minimales. Ni les groupes environnementaux ni les lobbies industriels ne sont pleinement satisfaits, mais production et durabilité sont maintenues à un niveau viable."
 economic_motivated_mining: "Une exploitation minière axée sur l'économie"
 economic_motivated_mining_desc: "Les réglementations environnementales sont réduites au minimum exigé par les normes internationales. Les taux d'extraction sont maximisés pour servir les objectifs économiques nationaux, les préoccupations écologiques n'étant traitées que lorsqu'elles menacent directement la productivité."
 strip_mining: "Exploitation minière à ciel ouvert"
 strip_mining_desc: "Toutes les contraintes environnementales sont levées pour poursuivre une extraction maximale. Les paysages sont rapidement épuisés et les communautés en subissent le coût environnemental, mais les rendements à court terme sont substantiellement accrus."
 critical_infrastructure: "Entretien des infrastructures"
 critical_infrastructure_desc: "Fixe le niveau d'entretien appliqué aux infrastructures nationales : routes, réseaux électriques, réseaux de communication et systèmes d'eau. Un entretien plus élevé préserve la capacité productive et le bien-être public ; le sous-investissement permet une dégradation progressive."
 minimal_maintenance: "Entretien minimal"
 minimal_maintenance_desc: "Les infrastructures ne sont maintenues fonctionnelles que là où une panne provoquerait une crise immédiate. L'entretien courant est reporté, les coûts baissent à court terme, et l'état du réseau national se détériore lentement."
 standard_maintenance: "Entretien standard"
 standard_maintenance_desc: "Les infrastructures sont entretenues au niveau requis pour préserver leur état actuel et la qualité de service. Les dépenses sont prévisibles et modérées, empêchant la détérioration sans viser d'expansion ni d'amélioration."
 extensive_maintenance: "Entretien approfondi"
 extensive_maintenance_desc: "Le gouvernement investit lourdement dans l'entretien, la modernisation et la résilience de tous les réseaux critiques. Les performances des infrastructures sont maximisées et les coûts de remplacement à long terme réduits, mais le programme exige un engagement budgétaire soutenu."
 employment_pressure: "Règlement du travail"
 employment_pressure_desc: "Lois régissant les normes du travail, les droits des travailleurs et la taille de la main-d'œuvre requise pour faire fonctionner les bâtiments."
 comprehensive_regulations: "Code complet du travail"
 comprehensive_regulations_desc: "Des protections étendues des travailleurs et des niveaux d'effectifs obligatoires augmentent les besoins en main-d'œuvre dans tous les secteurs. Les travailleurs s'attendent à un emploi sûr, rendant le chômage politiquement difficile à tolérer."
 strong_regulations: "De solides protections du travail"
 strong_regulations_desc: "De forts droits des travailleurs et des normes de sécurité exigent davantage d'employés par bâtiment. L'attente d'un emploi stable réduit la tolérance du gouvernement au chômage."
 standard_regulations: "Cadre standard du travail"
 standard_regulations_desc: "Une approche équilibrée du droit du travail fournissant des besoins en main-d'œuvre standard et une tolérance au chômage."
 light_regulations: "Surveillance légère du travail"
 light_regulations_desc: "Un fardeau réglementaire réduit permet aux entreprises de fonctionner avec moins de travailleurs. La population est plus habituée à l'insécurité de l'emploi, relevant le seuil de chômage toléré."
 minimal_regulations: "Normes minimales du travail"
 minimal_regulations_desc: "Des protections des travailleurs quasi absentes permettent des effectifs allégés dans tous les bâtiments. L'économie est conçue pour fonctionner avec un important vivier de main-d'œuvre excédentaire, accroissant fortement la tolérance à un chômage élevé."
 COVID_pandemic_origin: "Origine de la pandémie de COVID-19"
 COVID_pandemic_origin_desc: "En tant que point d'origine de la pandémie de COVID-19, notre nation affronte une grave perturbation économique et un examen international. Les systèmes de santé sont submergés et la production industrielle s'est effondrée."
 COVID_pandemic_impact: "Pandémie de COVID-19"
 COVID_pandemic_impact_desc: "La pandémie de COVID-19 a perturbé la vie quotidienne et l'activité économique. Les confinements et les mesures de santé publique sont nécessaires mais ont un coût économique élevé."
 COVID_supply_chain_disruption: "Crise mondiale de la chaîne d'approvisionnement"
 COVID_supply_chain_disruption_desc: "La pandémie a brisé les chaînes d'approvisionnement mondiales. Les pénuries de composants critiques et de matières premières ralentissent la construction et la production industrielle dans tous les secteurs."
 pandemic_swine_flu_origin: "Origine de la grippe porcine H1N1"
 pandemic_swine_flu_origin_desc: "En tant que point d'origine de la pandémie de grippe porcine H1N1, notre pays affronte un examen international accru et des coûts de santé en forte hausse tandis que le virus se propage dans la population."
 pandemic_swine_flu_impact: "Grippe porcine H1N1"
 pandemic_swine_flu_impact_desc: "La pandémie de grippe porcine H1N1 a atteint notre pays. Moins grave que redouté initialement, le virus met néanmoins à rude épreuve les systèmes de santé et perturbe l'activité économique."
 pandemic_MERS_outbreak: "Épidémie de MERS"
 pandemic_MERS_outbreak_desc: "Le syndrome respiratoire du Moyen-Orient se propage dans notre pays avec un taux de létalité élevé. Les coûts de santé explosent tandis que les hôpitaux mettent en place des salles d'isolement et des protocoles de confinement."
 pandemic_ebola_outbreak: "Épidémie d’Ebola"
 pandemic_ebola_outbreak_desc: "Le virus Ebola ravage notre pays. Des communautés entières sont mises en quarantaine, des soignants meurent en première ligne, et l'activité économique s'est arrêtée dans les régions touchées."
 pandemic_ebola_DRC: "Épidémie d’Ebola"
 pandemic_ebola_DRC_desc: "Une épidémie d'Ebola dans les provinces orientales met à rude épreuve notre système de santé. Le conflit armé dans la région complique les efforts de confinement, faisant monter les coûts et déstabilisant l'économie."
 generic_military_intervention: "Intervention militaire active"
 SWE_idea_overhalling_our_university_system_desc: ""
 reshaping_national_identity: "Refondre l'identité nationale"
 reshaping_national_identity_desc: "Forger une nation unique à partir d'États autrefois séparés est un processus tumultueux. Tant que l'union n'est pas pleinement consolidée, les loyautés concurrentes et les institutions instables pèsent sur la §Ystabilité§! nationale."
 non_state_actor: "Acteur non étatique"
 non_state_actor_desc: "De nombreux acteurs internationaux, des groupes rebelles aux ONG, ont une importance internationale mais sont gravement désavantagés de plusieurs manières du fait de n'être pas des États reconnus. Certains de ces acteurs non étatiques aspirent à prendre le contrôle d'un État existant en renversant un gouvernement injuste ou à en façonner un nouveau et à redessiner les frontières internationales. D'autres n'ont aucune ambition étatique, mais usent de la force brute pour accumuler pouvoir et richesse dans des environnements locaux où l'autorité du gouvernement central est absente."
 lacks_international_recognition: "État aspirant"
 lacks_international_recognition_desc: "Certains États possèdent tout ce que l'on associe normalement à un État. Une bureaucratie, une armée, un drapeau national, et ainsi de suite. Pourtant, leur étatité ne sera jamais complète sans les avantages supplémentaires conférés par le sceau de légitimité de la reconnaissance internationale. Ces États peuvent chercher à acquérir cette reconnaissance en militant pour leur cause à l'étranger, dans le but ultime de gagner le soutien d'une masse critique d'États pour devenir membres à part entière de la communauté internationale."
 MD_emergency_police_funding_idea: "Financement d'urgence pour la police"
 MD_emergency_police_funding_idea_desc: "Les forces de police fonctionnent sur des budgets d'heures supplémentaires et des acquisitions d'urgence. Les foules se dispersent plus vite et le respect des consignes augmente, mais la facture est salée."
 MD_jobs_for_unemployed_idea: "Programme d'emplois pour les chômeurs"
 MD_jobs_for_unemployed_idea_desc: "Un programme de travaux publics et d'embauches remet les citoyens au chômage au travail. La stabilité et l'élan politique montent, au prix d'un léger coût pour l'offre de biens de consommation."
 MD_tax_relief_promise_idea: "Programme d'allègement fiscal"
 MD_tax_relief_promise_idea_desc: "Les ménages à bas revenus paient moins d'impôts et un stimulus budgétaire est en cours. La stabilité et l'élan politique montent tandis que nous tenons la promesse."
 at_member: "Membre du traité sur l'Antarctique"
 at_member_desc: "Le traité sur l'Antarctique a été signé en 1959 par 12 pays, et de nombreux autres y ont depuis adhéré. Le traité consacre l'Antarctique comme réserve scientifique, établit la liberté d'investigation scientifique et interdit toute activité militaire sur le continent. Il a réussi à préserver le continent pour un usage pacifique et scientifique."
 NKO_nuclear_tests_idea: "Essais nucléaires"
 NKO_nuclear_tests_idea_desc: "Tous les quelques années, la RPDC procède à des essais d'armes nucléaires. Cela a suscité une large condamnation des puissances extérieures, y compris de la Chine malgré sa relation étroite avec la Corée du Nord. Si la Corée du Nord maintient que son programme nucléaire est défensif, beaucoup craignent que [NKO.GetLeader] n'utilise ces armes contre l'Amérique ou ses alliés."
 wto_member: "Membre de l'Organisation mondiale du commerce"
 wto_member_desc: "En tant que membre à part entière de l'Organisation mondiale du commerce, ce pays conserve des avantages commerciaux et industriels durables."
 WTO_permanent_membership_tt: "§gLorsque cet esprit national expire, il est remplacé par §Y$wto_member$§!, un ensemble d'avantages permanents mais plus faibles.§!"
 MON_khan_heir: "Héritier de Gengis Khan"
 MON_khan_heir_desc: "Les Mongols sont les descendants de Gengis Khan, et la gloire de nos ancêtres brillera toujours pour nous."
 CHI_war_preparations_desc: "L'Armée populaire de libération est passée sur le pied de guerre le long de la frontière coréenne. Les réservistes sont mobilisés, les cycles d'entraînement compressés et la planification offensive accélérée en vue d'une éventuelle intervention."
 CHI_foreign_investment_desc: "La libéralisation des règles d'investissement étranger et l'établissement de zones économiques spéciales attirent les multinationales de la fabrication et de la technologie. Les capitaux étrangers affluent dans les infrastructures et la construction de complexes industriels, accélérant la modernisation."
 Public_Sector_Space_Program_desc: "Une agence spatiale civile d'État pilote la capacité de lancement, le déploiement de satellites et l'exploration lointaine, ancrant le prestige national dans la réussite scientifique. Le programme attire un large investissement public dans la recherche de haute technologie, générant des retombées dans l'aviation, la science des matériaux et l'informatique qui renforcent la base industrielle plus large."
 space_combat_support_force_desc: "Une branche spatiale militaire dédiée fournit reconnaissance, positionnement et communications par satellite aux forces terrestres et navales. L'imagerie en temps réel et les liaisons de données chiffrées améliorent la planification opérationnelle, tandis que des moyens dédiés de renseignement d'origine électromagnétique affinent notre capacité à lire l'ordre de bataille adverse avant le contact."
 USA_wot_diplomatic_victory: "Victoire sans guerre"
 USA_wot_diplomatic_victory_desc: "Nous avons exigé Oussama ben Laden et on nous l'a livré, sans invasion, sans coalition, et sans un seul cercueil drapé du drapeau rentrant au pays. Le monde a pris note de ce que la pression américaine peut accomplir lorsqu'elle n'est pas appuyée par une division blindée.\n\nÀ l'intérieur, l'accueil est plus froid. Beaucoup voulaient une guerre, et ils n'en ont pas eu."
 TAL_pariah_settlement: "L'accord de Kandahar"
 TAL_pariah_settlement_desc: "Nous avons livré le cheikh, et en échange on nous a permis de garder notre pays. C'est un mauvais marché. Nous ne sommes reconnus presque par personne, sous embargo du Conseil de sécurité, surveillés par les Américains, et méprisés par les hommes qui ont combattu à nos côtés.\n\nL'Émirat survit. C'est tout ce que l'on peut en dire."
 player_instant_justification_spirit: "Casus belli"
 player_instant_justification_spirit_desc: "Le cadre juridique, les briefings à la presse et les câbles diplomatiques sont tous préparés à l'avance. Chaque fois que nous décidons qu'une guerre est nécessaire, la justification est prête le jour même."
 ISI_decapitated_leadership: "Leadership décapité"
 ISI_decapitated_leadership_desc: "Une frappe aérienne a tué un commandant senior du Califat. Ses subordonnés se battent pour le poste vacant, les ordres parviennent au front en retard ou pas du tout, et des combattants vétérans sont sacrifiés pour tenir un terrain qu'il aurait abandonné."
 vietnam.1.t: "L'armée quitte les affaires"
 vietnam.1.d: "La corruption sous contrôle et les forces armées reconstruites, le gouvernement a ordonné à l'Armée populaire vietnamienne de mettre fin à ses activités commerciales. L'armée recentrera son attention sur la défense nationale tandis que les institutions civiles assumeront la responsabilité de l'activité commerciale."
 vietnam.1.a: "L'armée doit servir la nation."
 corruption_reform_resistance: "Une résistance enracinée"
 corruption_reform_resistance_desc: "Des responsables et des réseaux d'affaires menacés par le contrôle font obstruction à de nouvelles mesures anticorruption."
 USA_white_house_burned: "La Maison Blanche incendiée"
 USA_white_house_burned_desc: "La Maison-Blanche, résidence officielle et lieu de travail du président des États-Unis, a été brûlée par les forces ennemies. Cette perte symbolique a choqué la nation et galvanisé la population dans une ferveur de rage et de détermination à se venger. Le moral militaire s'envole, mais la stabilité politique vacille tandis que le siège du pouvoir gît en ruines."
 MD_nationalist_migrant_protests: "Manifestations nationalistes de migrants"
 MD_nationalist_migrant_protests_desc: "Des foules nationalistes sont descendues dans la rue contre notre politique migratoire. Les troubles s'estompent avec le temps, mais tant qu'ils durent, ils pèsent sur l'ordre public."
