l_french:
 greenland_focus: "Arbre de concentration du Groenland"
 GRN_intro_to_greenland_shortcut: "Introduction au Groenland"
 GRN_greenland_foreign_policy_tree: "Politique étrangère du Groenland"
 GRN_focus_The_Great_Ice_Island: "La grande île de glace"
 GRN_focus_The_Great_Ice_Island_desc: "Le Groenland est une terre de glace, de fjords et de distances infinies. Notre indépendance n'a de sens que si nous savons habiter cette île, la relier et en tirer de quoi vivre."
 GRN_focus_The_People: "Le peuple"
 GRN_focus_The_People_desc: "Notre peuple est peu nombreux et dispersé. Investir dans la santé, l'éducation et le logement est la seule façon de faire d'une nation clairsemée une société viable."
 GRN_focus_Food_Security: "Sécurité alimentaire"
 GRN_focus_Food_Security_desc: "L'île ne nourrit pas d'elle-même une population moderne. Il faut des serres, des stocks et des chaînes d'approvisionnement capables de tenir l'hiver."
 GRN_focus_Breaking_Ground_For_Farmlands: "Ouvrir le chantier des \\"terres agricoles\\""
 GRN_focus_Breaking_Ground_For_Farmlands_desc: "Nous ouvrons les premières parcelles et serres à l'ouest, là où le climat et les infrastructures le permettent encore."
 GRN_focus_East_Farmland_Projects: "Projets « Terres agricoles » Est"
 GRN_focus_East_Farmland_Projects_desc: "L'est ne doit pas rester à la traîne. Des projets agricoles ciblés y poseront les bases d'une production alimentaire plus équilibrée."
 GRN_focus_Growing_Staple_Foods: "Cultiver des aliments de base"
 GRN_focus_Growing_Staple_Foods_desc: "Prioriser les cultures de base — pommes de terre, céréales sous serre, légumes-racines — pour réduire notre dépendance aux importations."
 GRN_focus_Strategic_Cash_Crops: "Cultures commerciales stratégiques"
 GRN_focus_Strategic_Cash_Crops_desc: "Certaines cultures à plus haute valeur, adaptées aux serres, peuvent générer des devises tout en diversifiant l'agriculture."
 GRN_focus_National_Seed_Vault: "Réserve nationale de semences"
 GRN_focus_National_Seed_Vault_desc: "Une banque nationale de semences préservera des variétés adaptées au froid et garantira que les récoltes futures ne dépendent pas d'un seul fournisseur étranger."
 GRN_focus_Stable_Population_Growth: "Croissance démographique stable"
 GRN_focus_Stable_Population_Growth_desc: "Une croissance démographique stable, par la natalité et une immigration soigneusement filtrée, est la condition de tout le reste."
 GRN_focus_Planning_New_Settlements: "Planifier de nouvelles colonies"
 GRN_focus_Planning_New_Settlements_desc: "Planifier de nouvelles colonies plutôt que de laisser l'habitat s'éparpiller au hasard."
 GRN_focus_Spread_Settlement_Planning_East: "Planification de l’établissement étendu à l’Est"
 GRN_focus_Spread_Settlement_Planning_East_desc: "Étendre la planification urbaine vers l'est pour équilibrer le peuplement de l'île."
 GRN_focus_New_Hope_Settlement: "Règlement du Nouvel Espoir"
 GRN_focus_New_Hope_Settlement_desc: "La colonie New Hope sera un modèle de logement, de services et d'emploi pour les décennies à venir."
 GRN_focus_Great_Star_Settlement: "Grande colonie d'étoiles"
 GRN_focus_Great_Star_Settlement_desc: "Great Star étendra l'habitat organisé et reliera davantage de familles aux services publics."
 GRN_focus_Development_Living_Grants: "Allocations de vie pour le développement"
 GRN_focus_Development_Living_Grants_desc: "Des aides au logement et à l'installation encourageront les familles à s'établir là où la nation en a besoin."
 GRN_focus_Developing_Public_Services: "Développer les services publics"
 GRN_focus_Developing_Public_Services_desc: "Écoles, cliniques et administrations locales doivent suivre la population, pas l'inverse."
 GRN_focus_Recruiting_More_Teachers: "Recruter davantage d'enseignants"
 GRN_focus_Recruiting_More_Teachers_desc: "Recruter et former davantage d'enseignants pour que chaque colonie ait une école viable."
 GRN_focus_Improving_Medical_Stockpiles: "Améliorer les stocks médicaux"
 GRN_focus_Improving_Medical_Stockpiles_desc: "Renforcer les stocks médicaux et la logistique sanitaire pour tenir les hivers isolés."
 GRN_focus_Creating_Concentrated_Internet_Services: "Création de services Internet concentrés"
 GRN_focus_Creating_Concentrated_Internet_Services_desc: "Concentrer les services internet là où ils auront le plus d'effet, puis les étendre."
 GRN_focus_Recruiting_More_Social_Workers: "Recruter davantage de travailleurs sociaux"
 GRN_focus_Recruiting_More_Social_Workers_desc: "Plus de travailleurs sociaux pour accompagner les familles, les jeunes et les aînés dans une société encore fragile."
 GRN_focus_Basic_Eastern_Roadworks: "Travaux routiers de base à l'Est"
 GRN_focus_Basic_Eastern_Roadworks_desc: "Des routes basiques à l'est pour relier les localités trop longtemps coupées."
 GRN_focus_Greenlandic_Economy: "L'économie groenlandaise"
 GRN_focus_Greenlandic_Economy_desc: "L'économie groënlandaise repose encore trop sur la pêche. Il faut diversifier, industrialiser à petite échelle et bâtir des services."
 GRN_focus_Economic_Diversification: "Diversification économique"
 GRN_focus_Economic_Diversification_desc: "Diversifier hors de la pêche : industrie légère, services, extraction et logistique."
 GRN_focus_Western_Zoning: "Zonage ouest"
 GRN_focus_Western_Zoning_desc: "Zonage économique à l'ouest pour séparer habitat, industrie et ports."
 GRN_focus_Eastern_Groundworks: "Travaux préparatoires à l'Est"
 GRN_focus_Eastern_Groundworks_desc: "Travaux de fondation à l'est pour préparer industrie et habitat."
 GRN_focus_Basic_Industrialization: "Industrialisation de base"
 GRN_focus_Basic_Industrialization_desc: "Une industrialisation de base : ateliers, transformation du poisson, petits chantiers."
 GRN_focus_Basic_Coastal_Manufacturing: "Fabrication côtière de base"
 GRN_focus_Basic_Coastal_Manufacturing_desc: "Manufactures côtières pour transformer ce que l'île produit déjà."
 GRN_focus_Babys_First_Economy: "La première économie de bébé"
 GRN_focus_Babys_First_Economy_desc: "Les premiers pas d'une économie nationale : comptabilité, crédits, petites entreprises."
 GRN_focus_Infrastructure_Development: "Développement des infrastructures"
 GRN_focus_Infrastructure_Development_desc: "Routes, ports, énergie : sans infrastructure, rien ne tient."
 GRN_focus_The_Network_Debate: "Le débat sur le réseau"
 GRN_focus_The_Network_Debate_desc: "Faut-il un réseau ferré étroit, des routes lourdes, ou les deux ? Le débat tranchera la forme de notre logistique."
 GRN_focus_Narrow_Gauge_Standard: "Le standard à voie étroite"
 GRN_focus_Narrow_Gauge_Standard_desc: "Adopter la voie étroite pour un rail moins cher, mieux adapté au pergélisol et aux faibles volumes."
 GRN_focus_Capital_Course: "Cours de capitale"
 GRN_focus_Capital_Course_desc: "Relier Nuuk au reste de l'ouest par un axe capital."
 GRN_focus_Nuuk_Western_Railway: "Chemin de fer occidental de Nuuk"
 GRN_focus_Nuuk_Western_Railway_desc: "Le chemin de fer ouest de Nuuk, première véritable artère ferroviaire du pays."
 GRN_focus_Infrastructure_Infancy: "Infrastructures naissantes"
 GRN_focus_Infrastructure_Infancy_desc: "L'infrastructure est encore en bas âge. Il faut la nourrir avant de rêver de corridors transinsulaires."
 GRN_focus_Ministry_For_Mineral_Affairs: "Ministère des affaires minières"
 GRN_focus_Ministry_For_Mineral_Affairs_desc: "Un ministère des Affaires minérales pour cartographier, concéder et contrôler l'extraction."
 GRN_focus_Domesticating_Energy_Needs: "Nationaliser les besoins énergétiques"
 GRN_focus_Domesticating_Energy_Needs_desc: "Domestiquer nos besoins énergétiques : charbon, pétrole, renouvelables, plutôt que tout importer."
 GRN_focus_Limited_Strategic_Resource_Extraction: "Extraction limitée de ressources stratégiques"
 GRN_focus_Limited_Strategic_Resource_Extraction_desc: "Une extraction stratégique limitée pour ne pas tout vendre, ni tout laisser sous la glace."
 GRN_focus_Cornerstone_Creation: "Création de la pierre angulaire"
 GRN_focus_Cornerstone_Creation_desc: "Poser la pierre angulaire d'une économie minière et énergétique nationale."
 GRN_focus_Extracting_Natural_Capital: "Extraire le capital naturel"
 GRN_focus_Extracting_Natural_Capital_desc: "Extraire le capital naturel de l'île avec méthode, pas en razzia."
 GRN_focus_Securing_Mining_Futures: "Assurer l’avenir du secteur minier"
 GRN_focus_Securing_Mining_Futures_desc: "Sécuriser l'avenir minier par des concessions, de la recherche et des stocks."
 GRN_focus_The_Future: "L'avenir"
 GRN_focus_The_Future_desc: "L'avenir du Groenland se joue maintenant : peuple, nourriture, mines, défense."
 GRN_focus_Coastal_Economic_Zones: "Zones économiques côtières"
 GRN_focus_Coastal_Economic_Zones_desc: "Des zones économiques côtières pour attirer logistique et transformation."
 GRN_focus_Foreign_Logistics_Hub_One: "Plaque tournante logistique étrangère n°1"
 GRN_focus_Foreign_Logistics_Hub_One_desc: "Un premier hub logistique étranger pour relier l'île aux routes transatlantiques."
 GRN_focus_Foreign_Logistics_Hub_Two: "Plaque tournante logistique étrangère n°2"
 GRN_focus_Foreign_Logistics_Hub_Two_desc: "Un second hub pour ne pas dépendre d'un seul partenaire ni d'un seul port."
 GRN_focus_West_Hub_Distillation_Facility: "Installation de distillation du Hub Ouest"
 GRN_focus_West_Hub_Distillation_Facility_desc: "Une distillerie-hub à l'ouest pour l'eau, les carburants et le soutien à la calotte."
 GRN_focus_East_Hub_Distillation_Facility: "Installation de distillation du pôle Est"
 GRN_focus_East_Hub_Distillation_Facility_desc: "Le pendant oriental : distiller, stocker, ravitailler l'est."
 GRN_focus_Southern_Fjords_Railway: "Chemin de fer des Fjords du Sud"
 GRN_focus_Southern_Fjords_Railway_desc: "Un rail dans les fjords du sud pour relier chantiers et ports."
 GRN_focus_Staging_Zones_For_The_Shelf: "Zones de staging pour le plateau"
 GRN_focus_Staging_Zones_For_The_Shelf_desc: "Des bases de staging face au Grand Plateau de glace, pour un jour le percer ou le contourner."
 GRN_focus_The_Great_Eastern_Staging_Grounds: "Les grands terrains de staging de l'est"
 GRN_focus_The_Great_Eastern_Staging_Grounds_desc: "L'est devient un terrain de concentration logistique pour relier la côte en un seul réseau."
 GRN_focus_Capital_Staging_Works: "Travaux de mise en scène des capitaux"
 GRN_focus_Capital_Staging_Works_desc: "Travaux de staging autour de la capitale pour soutenir l'ouest."
 GRN_focus_Meeting_Needs: "Répondre aux besoins"
 GRN_focus_Meeting_Needs_desc: "Répondre d'abord aux besoins : nourriture, chaleur, soins, puis le reste."
 GRN_focus_Supplying_Outposts: "Ravitaillement des avant-postes"
 GRN_focus_Supplying_Outposts_desc: "Ravitailler les avant-postes isolés avant qu'ils ne meurent de l'hiver."
 GRN_focus_General_National_Investments: "Investissements nationaux généraux"
 GRN_focus_General_National_Investments_desc: "Un paquet d'investissements nationaux pour que rien d'essentiel ne soit oublié."
 GRN_focus_Greater_Greenland_Act: "Loi du Grand Groenland"
 GRN_focus_Greater_Greenland_Act_desc: "La loi du Grand Groenland pose le cadre d'une nation qui ne se limite plus à quelques ports ouest."
 GRN_focus_Eastern_Population_Act: "Loi de peuplement de l'Est"
 GRN_focus_Eastern_Population_Act_desc: "Une loi pour peupler et doter l'est, trop longtemps négligé."
 GRN_focus_Battle_For_Independence: "Combat pour l'indépendance"
 GRN_focus_Battle_For_Independence_desc: "La bataille pour l'indépendance n'est pas finie tant que nous ne pouvons pas nous défendre et nous nourrir seuls."
 GRN_focus_Rushed_Mobilization_Efforts: "Efforts de mobilisation précipités"
 GRN_focus_Rushed_Mobilization_Efforts_desc: "Une mobilisation précipitée : former, armer, organiser ce que nous avons."
 GRN_focus_Organizing_Fundamentals_In_Training: "Organiser les fondamentaux de la formation"
 GRN_focus_Organizing_Fundamentals_In_Training_desc: "Les fondamentaux de l'instruction : discipline, tir, survie au froid."
 GRN_focus_If_It_Floats_Its_A_Boat: "S'il flotte, c'est un bateau"
 GRN_focus_If_It_Floats_Its_A_Boat_desc: "Si ça flotte, c'est un bateau. Nous partons de chalutiers et de patrouilleurs."
 GRN_focus_Removing_The_Last_Loose_Ends: "Trancher les derniers fils"
 GRN_focus_Removing_The_Last_Loose_Ends_desc: "Lever les derniers liens juridiques et militaires avec Copenhague."
 GRN_focus_Stabilizing_Domestic_Short_Comings: "Stabiliser les déficits intérieurs"
 GRN_focus_Stabilizing_Domestic_Short_Comings_desc: "Stabiliser les carences intérieures avant qu'elles ne fassent chuter le gouvernement."
 GRN_focus_Greenland_Armed_Services: "Services armés du Groenland"
 GRN_focus_Greenland_Armed_Services_desc: "Créer les services armés du Groenland à partir de presque rien."
 GRN_focus_A_New_Chapter: "Un nouveau chapitre"
 GRN_focus_A_New_Chapter_desc: "Un nouveau chapitre : État souverain, responsables de notre sort."
 GRN_focus_Northern_Political_Lights: "Lumières politiques du Nord"
 GRN_focus_Northern_Political_Lights_desc: "Les lumières politiques du Nord : partis, élections, une démocratie qui tient au froid."
 GRN_focus_Atassut_Claims_Victory: "Atassut revendique la victoire"
 GRN_focus_Atassut_Claims_Victory_desc: "Atassut revendique la victoire et promet une voie plus libérale et atlantiste."
 GRN_focus_Making_New_Greenlandic_Standards: "Élaborer de nouvelles normes groenlandaises"
 GRN_focus_Making_New_Greenlandic_Standards_desc: "Fixer de nouvelles normes groenlandaises en éducation, santé et administration."
 GRN_focus_Improving_Medical_Facilities: "Améliorer les installations médicales"
 GRN_focus_Improving_Medical_Facilities_desc: "Améliorer les établissements médicaux, trop petits pour une nation indépendante."
 GRN_focus_Casting_Better_Social_Nets: "Créer de meilleurs réseaux sociaux"
 GRN_focus_Casting_Better_Social_Nets_desc: "Tisser un meilleur filet social pour que l'indépendance ne rime pas avec précarité."
 GRN_focus_Domestic_Agriculture_Projects: "Projets agricoles nationaux"
 GRN_focus_Domestic_Agriculture_Projects_desc: "Des projets agricoles intérieurs pour moins dépendre des cargos danois."
 GRN_focus_Increasing_Industrial_Development: "Accroître le développement industriel"
 GRN_focus_Increasing_Industrial_Development_desc: "Accroître le développement industriel, même à petite échelle."
 GRN_focus_General_Armaments: "Armements généraux"
 GRN_focus_General_Armaments_desc: "Un effort général d'armement : fusils, munitions, véhicules légers."
 GRN_focus_Growing_Power_Production: "Production croissante d’électricité"
 GRN_focus_Growing_Power_Production_desc: "Accroître la production électrique pour l'industrie, les serres et les villes."
 GRN_focus_National_Alumina_Research_Institute: "Institut national de recherche sur l'alumine"
 GRN_focus_National_Alumina_Research_Institute_desc: "Un institut national de recherche sur l'alumine pour extraire de l'aluminium sans bauxite classique."
 GRN_focus_Military_Investment_Package: "Paquet d'investissement militaire"
 GRN_focus_Military_Investment_Package_desc: "Ce paquet d'investissement général ira à la qualité de l'équipement et à la solde. Une part est aussi réservée pour mieux standardiser les centres d'instruction."
 GRN_focus_Demokraatit_Secures_Victory: "Demokraatit remporte la victoire"
 GRN_focus_Demokraatit_Secures_Victory_desc: "Le parti Demokraatit a longtemps été l'outsider de la politique groenlandaise, souvent relégué à une « éternelle troisième place ». Aujourd'hui, avec notre victoire à l'ère de l'indépendance, nous pouvons vraiment améliorer la nation et ses citoyens."
 GRN_focus_Economic_Assimilation_Visas: "Visas d'assimilation économique"
 GRN_focus_Economic_Assimilation_Visas_desc: "Utiliser le système de visas pour développer la nation et faire croître la population de façon régulière aidera grandement la planification future."
 GRN_focus_Improved_Community_Programs: "Programmes communautaires améliorés"
 GRN_focus_Improved_Community_Programs_desc: "Une compréhension commune entre police et citoyens est un moteur de cohésion. Des mesures cohérentes pour rester sur la même longueur d'onde, et ne pas finir comme certains ailleurs."
 GRN_focus_Rewriting_Mining_Regulations: "Réécrire la réglementation minière"
 GRN_focus_Rewriting_Mining_Regulations_desc: "Les règlements miniers sont excessifs et ne correspondent plus à l'état de la nation. Il faut les reprendre pour standardiser l'industrie."
 GRN_focus_Hospice_Care_Funding: "Financement des soins palliatifs"
 GRN_focus_Hospice_Care_Funding_desc: "Un financement plus dédié aux soins palliatifs permettra aux familles de se concentrer sur l'essentiel sans craindre la négligence des aînés."
 GRN_focus_Creating_A_Basic_Office_Sector: "Créer un secteur de bureau de base"
 GRN_focus_Creating_A_Basic_Office_Sector_desc: "Diversifier encore : de petites industries de bureaux et de tech, significatives, pour améliorer le mode de vie."
 GRN_focus_Expanding_Existing_HFPs: "Expansion des HFP existants"
 GRN_focus_Expanding_Existing_HFPs_desc: "Étendre les Harsh Farming Projects par fermes verticales et distillation d'eau depuis la calotte : plus de nourriture intérieure et une percée vers l'intérieur."
 GRN_focus_Growing_REM_Industries: "Industries REM en croissance"
 GRN_focus_Growing_REM_Industries_desc: "Pour notre valeur géostratégique, développer les terres rares : mines et traitement ciblés comme jetons de négociation."
 GRN_focus_Growing_Domestic_Arms_Production: "Développer la production d'armement nationale"
 GRN_focus_Growing_Domestic_Arms_Production_desc: "Équiper nos personnels d'armements nationaux : la certitude que l'armée peut défendre nos terres."
 GRN_focus_Expanding_Citizen_Development_Grants: "Étendre les subventions citoyennes de développement"
 GRN_focus_Expanding_Citizen_Development_Grants_desc: "Le chemin vers la citoyenneté passe par la contribution au développement. Étendre les stipends pour plus de parcours simultanés vers la citoyenneté groenlandaise."
 GRN_focus_Siumut_Wins_Once_More: "Siumut l'emporte encore"
 GRN_focus_Siumut_Wins_Once_More_desc: "Siumut, l'un des plus anciens partis au pouvoir, a dominé l'avant-indépendance et tient le cap après. Il est temps de se concentrer sur autre chose que l'indépendance : la vie des citoyens et des travailleurs."
 GRN_focus_Encouraging_State_Sanctioned_Immigration: "Encourager l’immigration sanctionnée par l’État"
 GRN_focus_Encouraging_State_Sanctioned_Immigration_desc: "La croissance intérieure n'est pas fameuse. Pour remplir le marché du travail, il faut une immigration cohérente, là où c'est possible."
 GRN_focus_Immigration_Quotas: "Quotas d'immigration"
 GRN_focus_Immigration_Quotas_desc: "Le plus gros souci : des gens à employer. L'économie ne suffit pas si l'on manque de monde. Des quotas d'immigration dédiés pour aligner population et économie."
 GRN_focus_Expanding_Schooling_Subjects: "Élargir les matières scolaires"
 GRN_focus_Expanding_Schooling_Subjects_desc: "Plus d'options scolaires pour que les élèves visent les métiers qu'ils veulent, tout en gardant les compétences générales de l'âge adulte."
 GRN_focus_Social_Reserve_Funds: "Fonds de réserve sociale"
 GRN_focus_Social_Reserve_Funds_desc: "Créer le Fonds de réserve sociale, une épargne fédérale pour les programmes sociaux, afin d'équilibrer budgets et filets de sécurité."
 GRN_focus_Tungsten_Industries: "Industries du tungstène"
 GRN_focus_Tungsten_Industries_desc: "Au centre-est, des gisements de tungstène. Un complexe dédié pour extraire, traiter et raffiner en barres ou produits secondaires."
 GRN_focus_Core_Industries_Complex: "Complexe des industries de base"
 GRN_focus_Core_Industries_Complex_desc: "Rouvrir d'anciennes mines de fer encore viables et en ouvrir de nouvelles, avec un complexe industriel pour transformer le minerai."
 GRN_focus_Growing_More_Crops: "Cultiver plus de cultures"
 GRN_focus_Growing_More_Crops_desc: "Poursuivre l'expansion des fermes verticales et de la distillation pour attaquer plus vite le plateau de glace."
 GRN_focus_Naval_Investments: "Investissements navals"
 GRN_focus_Naval_Investments_desc: "Grandir la construction navale intérieure pour une marine, même petite, et une empreinte internationale."
 GRN_focus_Strategic_Stockpiles: "Stocks stratégiques"
 GRN_focus_Strategic_Stockpiles_desc: "Des stocks stratégiques d'armes à feu pour l'armée et, si besoin, le peuple. Espérons que cela n'arrive jamais."
 GRN_focus_Polar_Party_Wins: "Le parti polaire gagne-t-il ?"
 GRN_focus_Polar_Party_Wins_desc: "Jadis défunt, le Parti polaire est le plus proche d'un conservatisme traditionnel au Groenland. Une victoire déroutante, mais l'espoir d'une main ferme et d'un calme social."
 GRN_focus_Family_Subsidies: "Subventions familiales"
 GRN_focus_Family_Subsidies_desc: "Une subvention dédiée aux premières années de l'enfance, plafonnée et versée sur une carte bancaire nationale pour limiter les abus."
 GRN_focus_Childcare_Act: "Loi sur la garde d'enfants"
 GRN_focus_Childcare_Act_desc: "La loi sur la garde d'enfants finance crèches et scolarité précoce pour que les parents puissent aussi payer les factures."
 GRN_focus_Foreign_Leasing_Act: "Loi sur les concessions étrangères"
 GRN_focus_Foreign_Leasing_Act_desc: "La FLA a deux volets : mieux former à l'extraction minérale, et attirer des firmes étrangères à poser les fondations que nous pourrions reprendre."
 GRN_focus_Steeling_Resolve_Act: "Loi Acier et détermination"
 GRN_focus_Steeling_Resolve_Act_desc: "La SRA cible fer et charbon, fondation de l'économie, du logement et des institutions."
 GRN_focus_Expand_Petrochemical_Industries: "Développer les industries pétrochimiques"
 GRN_focus_Expand_Petrochemical_Industries_desc: "Établir et étendre la pétrochimie pour la sécurité intérieure face aux déficits commerciaux."
 GRN_focus_Greenlandic_Forestries: "Forêts groenlandaises"
 GRN_focus_Greenlandic_Forestries_desc: "De nouvelles fermes d'arbres via serres et fermes verticales pour un secteur du bois croissant."
 GRN_focus_Industrial_Projects: "Projets industriels"
 GRN_focus_Industrial_Projects_desc: "Rattraper l'est sur l'ouest en y améliorant l'industrie, pour réduire l'écart."
 GRN_focus_Eastern_Armaments: "Armements de l'Est"
 GRN_focus_Eastern_Armaments_desc: "Le projet « Développer l'est » avance. Nouvelles industries et immigration pour l'emploi : une économie robuste."
 GRN_focus_Defensive_Improvements: "Améliorations défensives"
 GRN_focus_Defensive_Improvements_desc: "Mieux se défendre contre une incursion brusque : le rempart de la sécurité. Débarquer ici n'est pas simple."
 GRN_focus_Qulleq_Party_Secures_Victory: "Le Parti Qulleq remporte la victoire"
 GRN_focus_Qulleq_Party_Secures_Victory_desc: "Le parti Qulleq, pro-industrialiste, autrefois « l'indépendance maintenant », l'emporte. Certains craignent le niveau de vie ; le parti promet qu'il ne fera qu'augmenter. Il va falloir le prouver."
 GRN_focus_On_Site_Family_Support: "Soutien familial sur place"
 GRN_focus_On_Site_Family_Support_desc: "Amener les enfants au travail, tous les jours. Les entreprises intègrent peu à peu des aspects de garde pour que les parents ne se sentent pas les abandonner."
 GRN_focus_Contractual_Labor_Act: "Loi sur le travail contractuel"
 GRN_focus_Contractual_Labor_Act_desc: "La CLA donne à l'administration le pouvoir d'aider frontières et immigration à trouver des candidats aux visas de travail, extension des Development Grants."
 GRN_focus_Rewriting_The_Tax_Codes: "Réécrire les codes fiscaux"
 GRN_focus_Rewriting_The_Tax_Codes_desc: "Réécrire les codes fiscaux pour une nation indépendante, plus le patchwork danois."
 GRN_focus_Building_Up_Domestic_Capital: "Construire du capital national"
 GRN_focus_Building_Up_Domestic_Capital_desc: "Nos mines d'or, plus un peu de diamants : vendre ce capital brut à l'étranger pour financer le développement."
 GRN_focus_Securing_Energy_Needs: "Sécuriser les besoins énergétiques"
 GRN_focus_Securing_Energy_Needs_desc: "Les besoins vastes d'une nation en développement sont la pierre angulaire du développement lui-même. Nous avons les ressources : il faut pouvoir les utiliser."
 GRN_focus_Military_Production_Means: "Moyens de production militaire"
 GRN_focus_Military_Production_Means_desc: "Se doter des moyens de produire armes et munitions au pays."
 GRN_focus_Continued_Crop_Diversification_Efforts: "Poursuite des efforts de diversification des cultures"
 GRN_focus_Continued_Crop_Diversification_Efforts_desc: "Continuer les HFP d'avant l'indépendance et la banque de semences. Distillation et agriculture là où l'on croyait que rien ne pousserait."
 GRN_focus_Expanded_Eastern_Industries: "Industries orientales élargies"
 GRN_focus_Expanded_Eastern_Industries_desc: "Travailleurs, entreprises : le cycle de développement, davantage à l'est pour réduire l'écart démographique et une économie plus répartie."
 GRN_focus_Economic_Automation_Act: "Loi d'automatisation économique"
 GRN_focus_Economic_Automation_Act_desc: "La EAA choisit un secteur à pousser vers l'automatisation, libérant des travailleurs pour d'autres secteurs et stabilisant le rapport emplois/main-d'œuvre."
 GRN_focus_Inuit_Ataqatigiit_Election_Victory: "Victoire électorale des Inuit Ataqatigiit"
 GRN_focus_Inuit_Ataqatigiit_Election_Victory_desc: "L'IA, outsider, entre social-démocratie et socialisme de marché, principes marxistes mais équilibre titiste entre blocs, sans obligation économique OTAN."
 GRN_focus_Greencare_Act: "Loi Greencare"
 GRN_focus_Greencare_Act_desc: "La Greencare Act (ou Greenlandcare) améliore salaires médicaux, qualité d'équipement et formation, et ouvre de nouvelles structures au besoin."
 GRN_focus_Steeled_Veins_Act: "Loi des veines d'acier"
 GRN_focus_Steeled_Veins_Act_desc: "Charbon et fer, sang d'une économie moderne. Le charbon sert moins qu'avant, mais on ne peut ignorer quantité et parfois qualité. De petites opérations pour l'intérieur et l'export."
 GRN_focus_Pro_Mining_And_Miners_Act: "Loi en faveur des mines et des mineurs"
 GRN_focus_Pro_Mining_And_Miners_Act_desc: "La PMMA améliore qualité et quantité minières, avec une automatisation stratégique pour moins de monde au fond."
 GRN_focus_Feldspar_Extractions_Act: "Loi d'extraction du feldspath"
 GRN_focus_Feldspar_Extractions_Act_desc: "Selon les enquêtes, la seule source sérieuse d'oxydes d'alumine est le feldspath de l'ouest, jusqu'à 20 % en poids, peu viable commercialement. Contrôle d'État jusqu'à une percée scientifique. Nous avons besoin d'aluminium : extraire et traiter lentement."
 GRN_focus_Feeding_The_People_Act: "Loi pour nourrir le peuple"
 GRN_focus_Feeding_The_People_Act_desc: "Une loi pour garantir l'alimentation du peuple par stocks, serres et importations ciblées."
 GRN_focus_The_Continual_Industry_Act: "Loi sur l'industrie continue"
 GRN_focus_The_Continual_Industry_Act_desc: "Une industrie qui ne s'arrête pas au premier hiver difficile."
 GRN_focus_Greenland_Technology_Center: "Centre technologique du Groenland"
 GRN_focus_Greenland_Technology_Center_desc: "Investir en R&D pour avancer et durer dans notre environnement écologique : primordial pour la suite."
 GRN_focus_Arming_The_Nation: "Armer la nation"
 GRN_focus_Arming_The_Nation_desc: "Notre défense est la clé de l'indépendance. Si nous voulons rester libres, il faut en développer les moyens."
 GRN_focus_Silver_And_Gold_Act: "Loi argent et or"
 GRN_focus_Silver_And_Gold_Act_desc: "Améliorer la sécurité intérieure en forgeant des jetons de négociation internationaux — palladium et terres rares — pour éloigner les envahisseurs un peu plus longtemps."
 GRN_focus_Naleraq_Elective_Victory: "Victoire élective de Naleraq"
 GRN_focus_Naleraq_Elective_Victory_desc: "Avec l'indépendance toute fraîche, Naleraq, plus nationaliste, l'emporte. Ses politiques visent à prouver la vertu groenlandaise de la souveraineté. Certains craignent un pas trop rapide vers quelque chose de plus hostile."
 GRN_focus_Efficiency_Education_Courses: "Cours d'éducation à l'efficacité"
 GRN_focus_Efficiency_Education_Courses_desc: "Le programme EE enseigne et expérimente transmission, stockage et usage de l'énergie par grand froid, pour une économie plus efficiente sans casser l'emploi."
 GRN_focus_Family_Planning_And_Assistance_Board: "Conseil de planification et d'assistance familiale"
 GRN_focus_Family_Planning_And_Assistance_Board_desc: "Le FPAB aide à créer, maintenir et faire grandir les familles. Notre population est petite ; mieux vaut nous occuper de nous-mêmes que d'inonder le pays d'une immigration hasardeuse."
 GRN_focus_Family_Homes_Act: "Loi sur les foyers familiaux"
 GRN_focus_Family_Homes_Act_desc: "La loi sur les foyers familiaux attribue les logements classés familiaux à ceux qui en ont besoin, sans abus sur un stock limité."
 GRN_focus_Urban_Planning_Commission: "Commission d'urbanisme"
 GRN_focus_Urban_Planning_Commission_desc: "L'UPC préplanifie fondations et styles urbains pour les futurs logements, emplois et chaînes d'approvisionnement locales."
 GRN_focus_Rapid_Agriculture_Expansions: "Expansions agricoles rapides"
 GRN_focus_Rapid_Agriculture_Expansions_desc: "La loi RAE élargit la base agricole. Il faudra importer des spécialistes le temps de former des citoyens nés ici, sous visas temporaires."
 GRN_focus_Industry_Development_Act: "Loi de développement industriel"
 GRN_focus_Industry_Development_Act_desc: "Investir dans la manufacture et l'industrie générale pour une économie fiable et diverse. Les petits projets feront boule de neige avec la population."
 GRN_focus_Military_Forces_Investment_Act: "Loi d'investissement des forces militaires"
 GRN_focus_Military_Forces_Investment_Act_desc: "Ce paquet de dépenses et de développement d'armements travaillera de concert pour nos capacités terrestres et aériennes, jusqu'à nos propres conceptions."
 GRN_focus_Western_Strategic_Autarky_Act: "Loi d'autarcie stratégique de l'Ouest"
 GRN_focus_Western_Strategic_Autarky_Act_desc: "La loi d'autarcie nationale a deux phases. La WSAA ouvre des opérations limitées sur le minerai de fer, le feldspath pour l'aluminium, le pétrole et le charbon pour l'énergie et le caoutchouc synthétique."
 GRN_focus_Eastern_Strategic_Autarky_Zone: "Zone d'autarcie stratégique de l'Est"
 GRN_focus_Eastern_Strategic_Autarky_Zone_desc: "La phase deux développe pétrole et charbon, extraction limitée de terres rares, lithium et minéraux technologiques. Sécurité intérieure et jetons diplomatiques s'accumulent."
 GRN_focus_Militarize_Greenland_Party_Wins: "Le Parti groenlandais militarisé gagne-t-il ?"
 GRN_focus_Militarize_Greenland_Party_Wins_desc: "Personne n'attendait l'intercession militaire : le MGP, outsider, l'emporte. Extension politique des nouvelles Forces armées du Groenland, axé sur la défense. Beaucoup se demandent si ce n'était pas un besoin inconscient après l'indépendance."
 GRN_focus_Military_Organized_Education_Act: "Loi d'éducation organisée militairement"
 GRN_focus_Military_Organized_Education_Act_desc: "Refondre classes et structure scolaire sur un modèle militaire : discipline, organisation, écouter et donner des ordres — utile à la mémoire comme au service."
 GRN_focus_Production_Critical_Resources_Act: "Loi de production des ressources critiques"
 GRN_focus_Production_Critical_Resources_Act_desc: "Acier et énergie : piliers de toute société industrialisée. Investir pour les besoins civils et militaires."
 GRN_focus_Advanced_Materials_And_Minerals_Act: "Loi sur les matériaux avancés et les minéraux"
 GRN_focus_Advanced_Materials_And_Minerals_Act_desc: "La loi AMMA élargit l'extraction des ressources avancées : tech et terres rares."
 GRN_focus_Army_Armaments_Improvement_Act: "Loi d'amélioration de l'armement terrestre"
 GRN_focus_Army_Armaments_Improvement_Act_desc: "Améliorer l'armée par la production et un R&D passif pour tester de nouveaux modèles."
 GRN_focus_Air_Force_Advancements_Act: "Loi de progrès de l'armée de l'air"
 GRN_focus_Air_Force_Advancements_Act_desc: "Financer des usines pour une vraie armée de l'air, plus un peu de R&D pour concevoir nos appareils."
 GRN_focus_Military_Garden_Act: "Loi des jardins militaires"
 GRN_focus_Military_Garden_Act_desc: "Dédier une part des HFP au programme de rations militaires : séparer demandes civiles et militaires, contrôler qualité et quantité."
 GRN_focus_Bolstering_Naval_Assets: "Renforcer les moyens navals"
 GRN_focus_Bolstering_Naval_Assets_desc: "Notre côte est immense. Il faut des navires capables de ces distances. Après l'armée, la marine est notre première ligne."
 GRN_focus_Civilian_Improvements_Act: "Loi d'améliorations civiles"
 GRN_focus_Civilian_Improvements_Act_desc: "Pour soutenir une force militaire, il faut une économie civile décente. Des projets ciblés pour que la demande militaire ne distance pas l'économie réelle."
 GRN_focus_Militarized_Economy_Act: "Loi d'économie militarisée"
 GRN_focus_Militarized_Economy_Act_desc: "Réorganiser l'économie autour d'éventuelles fortes demandes en main-d'œuvre militaire, en intégrant technologies et méthodes pour réduire la main-d'œuvre d'armement et en libérer pour le civil et les forces."
 GRN_focus_Greenland_Monarchist_Party_Victory: "Victoire du Parti monarchiste du Groenland"
 GRN_focus_Greenland_Monarchist_Party_Victory_desc: "Le Parti monarchiste groenlandais, ou Parti de la Maison du Groenland, veut respecter la très longue histoire sous la monarchie danoise : parlement intégré à une monarchie constitutionnelle libérale. Assez de gens y voient la stabilité danoise comme clé du développement."
 GRN_focus_Education_Investments_Act: "Loi d'investissements éducatifs"
 GRN_focus_Education_Investments_Act_desc: "La EIA augmente les dépenses pour la qualité de l'éducation et l'innovation, afin d'adapter le pays à un environnement toujours plus rude."
 GRN_focus_Medical_Research_Initiatives: "Initiatives de recherche médicale"
 GRN_focus_Medical_Research_Initiatives_desc: "Le plan MRI crée un Département du développement médical (MDD) pour avancer la science médicale et tester équipements et procédures sur volontaires."
 GRN_focus_Public_Security_And_Safety_Act: "Loi sur la sécurité publique"
 GRN_focus_Public_Security_And_Safety_Act_desc: "Les citoyens doivent vivre sans peur. Financement pour le lien communautaire, le recrutement et la formation policière. Un jour calme est un bon jour."
 GRN_focus_Agriculture_Advancements_Act: "Loi de progrès agricoles"
 GRN_focus_Agriculture_Advancements_Act_desc: "Poursuivre l'investissement dans serres et fermes verticales. La sécurité nationale repose sur une alimentation diverse et stable."
 GRN_focus_Economic_Strengthening_Act: "Loi de renforcement économique"
 GRN_focus_Economic_Strengthening_Act_desc: "Développer le bas de bilan, c'est relever le niveau de toute la nation. Investir dans entreprises et industries pour diversifier ce que nos gens peuvent produire et consommer."
 GRN_focus_Petrochemical_Development_Efforts: "Efforts de développement pétrochimique"
 GRN_focus_Petrochemical_Development_Efforts_desc: "La pétrochimie touche la vie quotidienne. Développer notre secteur, synthétiser caoutchouc et produits chimiques, est presque une affaire de sécurité nationale."
 GRN_focus_Lithium_Expansion_Act: "Loi d'expansion du lithium"
 GRN_focus_Lithium_Expansion_Act_desc: "Étendre l'extraction de lithium, terres rares et minéraux technologiques pour la demande intérieure et de futurs échanges."
 GRN_focus_Royal_Military_Development_Efforts: "Efforts royaux de développement militaire"
 GRN_focus_Royal_Military_Development_Efforts_desc: "Le programme RMD améliore le matériel d'armée et de marine et les normes d'entraînement autour d'équipements en évolution."
 GRN_focus_Establishing_The_Kingdom: "Établir le Royaume"
 GRN_focus_Establishing_The_Kingdom_desc: "Les préparatifs achevés, nous renommons officiellement la nation Royaume du Groenland. Le peuple est joyeux et uni pour un avenir prospère."
 GRN_focus_Armed_Services_Of_Greenland: "Services armés du Groenland"
 GRN_focus_Armed_Services_Of_Greenland_desc: "L'indépendance assurée, il faut notre propre défense : partir de zéro pour eaux, terres et ciel."
 GRN_focus_The_Frozen_Army: "L'armée gelée"
 GRN_focus_The_Frozen_Army_desc: "Nos terres sont froides, gelées, presque impraticables. Il faut que l'armée y voie un terrain de jeu, pas un obstacle."
 GRN_focus_Training_Facilities_And_Standards: "Installations et normes de formation"
 GRN_focus_Training_Facilities_And_Standards_desc: "Installer des centres d'instruction et des normes de soldat bâties autour des conditions du pays."
 GRN_focus_Setting_Equipment_Standards: "Établir des normes d’équipement"
 GRN_focus_Setting_Equipment_Standards_desc: "Un standard d'équipement pour l'uniforme de l'instruction et une logistique plus simple."
 GRN_focus_Securing_Domestic_Smallarms: "Sécuriser les armes légères nationales"
 GRN_focus_Securing_Domestic_Smallarms_desc: "Produire armes légères et équipement d'infanterie au pays pour la préparation au combat."
 GRN_focus_Crude_Combat_Designs: "Conceptions de combat grossières"
 GRN_focus_Crude_Combat_Designs_desc: "Les CCD sont des véhicules « rattle me bones » : squelettiques mais nationaux. Acheter quelques matériels étrangers pour tester et concevoir du vrai combat moderne."
 GRN_focus_Vehicle_Manufacturing_Plants: "Usines de fabrication de véhicules"
 GRN_focus_Vehicle_Manufacturing_Plants_desc: "Avec des bases de conception, fabriquer ces mannequins d'entraînement et en tirer un possible noyau blindé."
 GRN_focus_Institute_For_Army_Developments: "Institut de développement de l'armée"
 GRN_focus_Institute_For_Army_Developments_desc: "L'armée est plus petite qu'un nourrisson. Investir lourdement pour la développer, pour la nation et ceux qui servent."
 GRN_focus_Frozen_Battlefield_Doctrine: "Doctrine du champ de bataille gelé"
 GRN_focus_Frozen_Battlefield_Doctrine_desc: "Nous n'égalerons jamais les armées du continent. Nous pouvons défendre. Faire de notre climat le champ de bataille ultime et y attirer l'ennemi."
 GRN_focus_FBD_Leadership_Promotions: "Promotions de leadership FBD"
 GRN_focus_FBD_Leadership_Promotions_desc: "Promouvoir un état-major dédié pour implémenter la doctrine du champ gelé."
 GRN_focus_From_Field_To_Staff_Command: "Du terrain à l'état-major"
 GRN_focus_From_Field_To_Staff_Command_desc: "Les commandants de terrain devront aussi comprendre l'administration : postes d'état-major en complément jusqu'à former d'autres officiers."
 GRN_focus_Frozen_Warfare_Training_Program: "Programme d'entraînement au combat arctique"
 GRN_focus_Frozen_Warfare_Training_Program_desc: "Défendre la patrie froide : entraîner les troupes à combattre dans ces conditions le plus longtemps possible."
 GRN_focus_Polar_Logistics: "Logistique polaire"
 GRN_focus_Polar_Logistics_desc: "Affiner la logistique pour que combattre par extrême froid soit plus tenable."
 GRN_focus_General_Improvement_Programs: "Programmes d'amélioration générale"
 GRN_focus_General_Improvement_Programs_desc: "Défendre l'île, oui, mais aussi comprendre les guerres ailleurs. Une amélioration générale et équilibrée de l'armée."
 GRN_focus_GIP_Leadership_Promotions: "Promotions des dirigeants du GIP"
 GRN_focus_GIP_Leadership_Promotions_desc: "Trouver les meilleurs candidats officiers de terrain et généraux pour porter cette voie à l'excellence."
 GRN_focus_General_Staff_Roles: "Rôles de l'état-major général"
 GRN_focus_General_Staff_Roles_desc: "Armée petite : ceux qui ont le commandement de terrain prendront aussi des rôles administratifs pour l'instant."
 GRN_focus_Artillery_Corps_Specialist: "Spécialiste du corps d'artillerie"
 GRN_focus_Artillery_Corps_Specialist_desc: "Spécialiser l'artillerie en défense et en attaque. Les pièces lourdes bougent mal, les légères coûtent cher : prévenir les pertes."
 GRN_focus_Clear_Skys_Project: "Projet Ciel clair"
 GRN_focus_Clear_Skys_Project_desc: "Le CSP développe l'anti-aérien pour que nos soldats ne dépendent pas du bon vouloir de l'aviation ennemie."
 GRN_focus_Army_Officer_Training_Corps: "Corps de formation des officiers de l'armée"
 GRN_focus_Army_Officer_Training_Corps_desc: "L'AOTC forme des chefs tactiques et stratégiques. Petite nation : corriger les mauvaises habitudes avant qu'elles ne s'enracinent."
 GRN_focus_Navy_Of_Greenland: "Marine du Groenland"
 GRN_focus_Navy_Of_Greenland_desc: "Notre marine n'est que pêche et patrouille. Pour défendre les eaux côtières, il faut une vraie marine, capable du climat."
 GRN_focus_Naval_Research_Institute: "Institut de recherche navale"
 GRN_focus_Naval_Research_Institute_desc: "L'Institut naval d'Itilleq développera savoir et applications navales pour défendre nos eaux."
 GRN_focus_Nuuk_Naval_Shipyards: "Chantiers navals de Nuuk"
 GRN_focus_Nuuk_Naval_Shipyards_desc: "Développer les chantiers de la capitale pour bâtiments militaires et civils."
 GRN_focus_Expanding_The_Design_Department: "Élargir le bureau d'études"
 GRN_focus_Expanding_The_Design_Department_desc: "Des chantiers stratégiques près de l'INM au sud pour concevoir, tester et moderniser les classes en service."
 GRN_focus_Tasiilaq_Shipyards_Complex: "Complexe des chantiers navals de Tasiilaq"
 GRN_focus_Tasiilaq_Shipyards_Complex_desc: "Équilibrer les développements navals entre extrémités de l'île pour soutenir les flottes partout."
 GRN_focus_Rough_Raft_Designs: "Conceptions de radeaux bruts"
 GRN_focus_Rough_Raft_Designs_desc: "Le minimum pour une force navale : un R&D acharné vers de vrais modèles."
 GRN_focus_Small_Surface_Fleet_Doctrine: "Doctrine de petite flotte de surface"
 GRN_focus_Small_Surface_Fleet_Doctrine_desc: "Peu d'hommes, peu de navires. Doctrine de surface sur petits calibres, modulaires, rien au-delà du destroyer."
 GRN_focus_Corvette_Design_Department: "Département de conception de Corvette"
 GRN_focus_Corvette_Design_Department_desc: "Le bureau corvettes de la doctrine SSF : concevoir, tester, innover sur la coque standard."
 GRN_focus_Small_Vessel_Fleet_Organization: "Organisation de la flotte de petits navires"
 GRN_focus_Small_Vessel_Fleet_Organization_desc: "Les petites flottes s'organisent autour du trio : corvettes, frégates, destroyers."
 GRN_focus_Submersival_Fleet_Doctrine: "Doctrine de flotte sous-marine"
 GRN_focus_Submersival_Fleet_Doctrine_desc: "Sous-marins : furtifs, peu gourmands en hommes, gros punch si bien organisés — missiles et torpilles."
 GRN_focus_Attack_Submarine_Pillar: "Pilier sous-marin d'attaque"
 GRN_focus_Attack_Submarine_Pillar_desc: "Premier pilier : l'attaque, torpilles et mines, lances de la marine."
 GRN_focus_Missile_Submarine_Pillar: "Pilier sous-marin lance-missiles"
 GRN_focus_Missile_Submarine_Pillar_desc: "Second pilier : missiles, coûteux mais décisifs. Il faut en améliorer l'efficacité au combat."
 GRN_focus_Naval_Command_Corps: "Corps de commandement naval"
 GRN_focus_Naval_Command_Corps_desc: "Établir enfin un appareil de commandement naval. On ne peut que monter."
 GRN_focus_Greenlandic_Air_Force: "Armée de l'air groenlandaise"
 GRN_focus_Greenlandic_Air_Force_desc: "Ciels nuageux, froids, vides. Il faut une armée de l'air capable de les défendre."
 GRN_focus_West_Craft_Manufacturing: "Fabrication artisanale de l'Ouest"
 GRN_focus_West_Craft_Manufacturing_desc: "L'usine West Craft produira et testera des modèles pour équiper l'armée de l'air."
 GRN_focus_Preparing_Air_Institute_Manufacturing: "Préparation de la fabrication de l'Air Institute"
 GRN_focus_Preparing_Air_Institute_Manufacturing_desc: "Installer la production près de l'Institut de recherche aérienne pour la logistique des nouveaux modèles."
 GRN_focus_Tingmiarmit_Air_Research_Institute: "Institut de recherche aérienne Tingmiarmit"
 GRN_focus_Tingmiarmit_Air_Research_Institute_desc: "Le TARI développe aéronefs et combat aérien. Petite nation : spécialiser tôt doctrine et sécurité aérienne."
 GRN_focus_Infrequent_Flyer_Designs: "Modèles de flyers peu fréquents"
 GRN_focus_Infrequent_Flyer_Designs_desc: "Des modèles bon marché pour les rôles assignés. Pas le meilleur, mais un point de départ."
 GRN_focus_Air_Supremacy_Prioritization: "Priorité à la suprématie aérienne"
 GRN_focus_Air_Supremacy_Prioritization_desc: "L'ennemi peut submerger la marine, jamais nos ciels. Priorité au combat air-air."
 GRN_focus_General_Aviation_Innovations: "Innovations en aviation générale"
 GRN_focus_General_Aviation_Innovations_desc: "Le TARI a coûté cher : radar, efficacité carburant et autres innovations bientôt en essai."
 GRN_focus_Air_Dominance_Research_Programs: "Programmes de recherche de domination aérienne"
 GRN_focus_Air_Dominance_Research_Programs_desc: "Par le seul R&D chasse, chasser des ciels ceux qui voudraient les noircir."
 GRN_focus_Naval_Bombing_Superiority_Force: "Force de supériorité des bombardements navals"
 GRN_focus_Naval_Bombing_Superiority_Force_desc: "Dominer les mers par les airs ouvre des mesures défensives préemptives."
 GRN_focus_Bombing_Research_Priorities: "Priorités de recherche sur le bombardement"
 GRN_focus_Bombing_Research_Priorities_desc: "Prioriser le bombardement air-sol et air-navire pour prévenir toute invasion."
 GRN_focus_Bomber_Air_Fleets: "Flottes aériennes de bombardiers"
 GRN_focus_Bomber_Air_Fleets_desc: "Des flottes aériennes dédiées du stratégique à l'appui rapproché."
 GRN_focus_Air_Officer_Training_Corps: "Corps de formation des officiers de l'air"
 GRN_focus_Air_Officer_Training_Corps_desc: "Développer le corps des officiers de l'air pour affiner ce qu'est vraiment cette arme."
 GRN_focus_Greenlandic_General_Staff_Corps: "Corps d'état-major groenlandais"
 GRN_focus_Greenlandic_General_Staff_Corps_desc: "L'armée grandit : un état-major général unifié pour la défense nationale."
 GRN_focus_Thawing_The_Economy: "Dégeler l'économie"
 GRN_focus_Thawing_The_Economy_desc: "L'économie, c'était la pêche, encore la pêche. Il faut changer cela, continuer à diversifier après l'indépendance."
 GRN_focus_Energizing_Greenland: "Dynamiser le Groenland"
 GRN_focus_Energizing_Greenland_desc: "La demande énergétique monte. Il faut un secteur stable capable de la suivre."
 GRN_focus_Fossil_Fuelin: "Combustible fossile"
 GRN_focus_Fossil_Fuelin_desc: "Charbon et pétrole inexploités : énergie rapide et bon marché pour suivre la demande."
 GRN_focus_Oil_Charter_Dominance: "Dominance de la Charte pétrolière"
 GRN_focus_Oil_Charter_Dominance_desc: "Prioriser de nouvelles chartes d'extraction pour élargir l'effort pétrolier."
 GRN_focus_Renewable_Revivals: "Reprises renouvelables"
 GRN_focus_Renewable_Revivals_desc: "Vents, soleil, eaux : investir dans les renouvelables et de meilleures méthodes."
 GRN_focus_Harnessing_The_Winds_Of_Fortune: "Exploiter les vents de la fortune"
 GRN_focus_Harnessing_The_Winds_Of_Fortune_desc: "Prioriser le développement pour que la nature même de l'île serve de meilleures vies."
 GRN_focus_Greenlands_Green_Energy: "Énergie verte du Groenland"
 GRN_focus_Greenlands_Green_Energy_desc: "L'île est idéale pour le nucléaire : météo assez stable, froid presque toute l'année, eau salée et douce — gelée — pour la vapeur."
 GRN_focus_Unlimited_Power: "Puissance illimitée"
 GRN_focus_Unlimited_Power_desc: "Des minerais nucléaires nationaux peuvent alimenter nos installations. Ce vaste investissement dit que nous n'avons plus à craindre pour l'énergie."
 GRN_focus_Secured_Electrical_Grid: "Réseau électrique sécurisé"
 GRN_focus_Secured_Electrical_Grid_desc: "Notre cap énergétique fixé, le réseau est plus stable, plus préemptif que réactif. Espérons le bon choix."
 GRN_focus_Agricultural_Futurism_Plan: "Plan de futurisme agricole"
 GRN_focus_Agricultural_Futurism_Plan_desc: "Les HFP ont posé un socle d'innovations. Plus énergivores, elles peuvent mener à l'autosuffisance et à l'export alimentaire."
 GRN_focus_Western_Farming_Complexes: "Complexes agricoles occidentaux"
 GRN_focus_Western_Farming_Complexes_desc: "Les VFC, fermes verticales, produisent presque toute l'année et alimentent l'appareil de distillation contre le Grand Plateau."
 GRN_focus_Eastern_Farming_Complexes: "Complexes agricoles de l’Est"
 GRN_focus_Eastern_Farming_Complexes_desc: "Poursuivre les fermes verticales à l'est fera chuter le coût de la nourriture et permettra l'export hors saison."
 GRN_focus_Supplemental_Industries: "Industries supplémentaires"
 GRN_focus_Supplemental_Industries_desc: "Développer l'industrie pour un peu de diversité à côté d'une agriculture très investie."
 GRN_focus_First_International_Farm: "Première ferme internationale"
 GRN_focus_First_International_Farm_desc: "Nous pourrions devenir la première nation agricole internationale — pas un grenier de plus, LA banque alimentaire mondiale."
 GRN_focus_Infrastructure_Projects: "Projets d'infrastructure"
 GRN_focus_Infrastructure_Projects_desc: "Routes, rails, réseaux : relier un pays clairsemé pour que l'économie fonctionne vraiment."
 GRN_focus_Greater_West_Highway_Project: "Projet d'autoroute du Grand Ouest"
 GRN_focus_Greater_West_Highway_Project_desc: "Une « autoroute » reliant les villes de l'ouest, moins de temps et de fardeau de voyage."
 GRN_focus_Improving_Western_Internet_Towers: "Améliorer les tours Internet occidentales"
 GRN_focus_Improving_Western_Internet_Towers_desc: "Améliorer et construire des tours internet à l'ouest pour un travail plus cohérent au quotidien."
 GRN_focus_Sisimuit_Northern_Railway: "Chemin de fer du Nord Sisimuit"
 GRN_focus_Sisimuit_Northern_Railway_desc: "Étendre le rail à tout l'ouest : meilleure logistique et chaînes d'approvisionnement."
 GRN_focus_Great_Eastern_Highway_Project: "Projet de grande route de l'Est"
 GRN_focus_Great_Eastern_Highway_Project_desc: "Comme à l'ouest, relier les villes de l'est, même par le plus basique."
 GRN_focus_East_Region_Internet_Expansions: "Expansions Internet dans la région Est"
 GRN_focus_East_Region_Internet_Expansions_desc: "L'est est moins développé : étendre l'internet pour rattraper la norme."
 GRN_focus_Great_Greenlandic_Eastern_Railroad: "Grand chemin de fer oriental du Groenland"
 GRN_focus_Great_Greenlandic_Eastern_Railroad_desc: "Le GGERR est l'un des plus grands investissements d'infrastructure : relier le plus de côtes possible. Seul le Grand Plateau de glace barre encore des temps de trajet plus courts."
 GRN_focus_Connecting_Greenland: "Connecter le Groenland"
 GRN_focus_Connecting_Greenland_desc: "La nation grandit, l'infrastructure aussi. Investir dans l'entretien et l'adaptation à l'environnement."
 GRN_focus_Economic_Modernism_Plan: "Plan de modernisme économique"
 GRN_focus_Economic_Modernism_Plan_desc: "Continuer à diversifier, surtout le civil et le secteur bureaux/tech."
 GRN_focus_Office_District_West: "Quartier de bureaux Ouest"
 GRN_focus_Office_District_West_desc: "Développer le tertiaire à l'ouest pour élargir produits et services."
 GRN_focus_Tech_Sector_Growth: "Croissance du secteur technologique"
 GRN_focus_Tech_Sector_Growth_desc: "Le tertiaire va de pair avec la tech. L'assurer pour maximiser la diversité économique."
 GRN_focus_Civilian_Sector_Investments: "Investissements dans le secteur civil"
 GRN_focus_Civilian_Sector_Investments_desc: "Le tertiaire a besoin d'un appui industriel pour fabriquer et utiliser ses produits."
 GRN_focus_National_Economic_Modernity: "Modernité économique nationale"
 GRN_focus_National_Economic_Modernity_desc: "Des investissements divers et fructueux, mais ce n'est qu'un début. Le meilleur pour les citoyens et l'avenir."
 GRN_focus_Resource_Extraction_Projects: "Projets d'extraction de ressources"
 GRN_focus_Resource_Extraction_Projects_desc: "L'île grouille de ressources. Pour la sécurité intérieure et les échanges, développer l'extraction selon l'intérêt national."
 GRN_focus_Iron_Mining_Operations: "Opérations minières de fer"
 GRN_focus_Iron_Mining_Operations_desc: "Le fer est fondamental. Investissements nationaux pour lancer et faire croître l'extraction."
 GRN_focus_Project_Alumina_Oxide: "Projet Oxyde d'alumine"
 GRN_focus_Project_Alumina_Oxide_desc: "Pas de bauxite directe, mais on peut extraire l'oxyde d'alumine d'autres minéraux. Lourds investissements et recherche d'isolation."
 GRN_focus_Lithium_Mining_Operations: "Opérations minières de lithium"
 GRN_focus_Lithium_Mining_Operations_desc: "Lithium, cobalt et minéraux de base pour la tech : un énorme coup de pouce à la flexibilité économique."
 GRN_focus_Project_Rare_Minerals: "Projet Minéraux Rares"
 GRN_focus_Project_Rare_Minerals_desc: "Terres rares comme le néodyme : hausser notre standing commercial et attirer des capitaux."
 GRN_focus_Black_Gold_Extraction_Efforts: "Efforts d’extraction d’or noir"
 GRN_focus_Black_Gold_Extraction_Efforts_desc: "Le pétrole : énergie bon marché et jeton de négociation, plus synthétiques et pétrochimie."
 GRN_focus_Project_Glacial_Rubber: "Projet Caoutchouc Glaciaire"
 GRN_focus_Project_Glacial_Rubber_desc: "VFF dédiées aux hévéas, charbon et pétrole en synthétiques : toutes les voies vers un caoutchouc national."
 GRN_focus_Polar_Bear_Policies: "Politiques relatives aux ours polaires"
 GRN_focus_Polar_Bear_Policies_desc: "Nation stable et armée, regarder au-delà de l'île. La politique étrangère dictera le vrai avenir."
 GRN_focus_The_Atlantic_Stepping_Stone: "Le tremplin atlantique"
 GRN_focus_The_Atlantic_Stepping_Stone_desc: "Soyons honnêtes : toute politique étrangère finira par l'Islande. Réglons cela. Cela donnera le rythme et testera notre navigation moderne."
 GRN_focus_Investing_In_Brotherhood: "Investir dans la fraternité"
 GRN_focus_Investing_In_Brotherhood_desc: "Pour des liens plus étroits, voire une union, il faut la confiance. Des investissements qui les avantagent d'abord. Lent et sûr gagne la course."
 GRN_focus_Reykjavik_Investment_Firm: "Société d'investissement de Reykjavik"
 GRN_focus_Reykjavik_Investment_Firm_desc: "L'Islande est dans l'OTAN. Il faut réduire sa dépendance aux étrangers, surtout américains. Une offre qu'ils ne peuvent refuser. Oubliez les petites lignes."
 GRN_focus_Operation_Real_Green: "Opération : Vraiment vert"
 GRN_focus_Operation_Real_Green_desc: "Toutes les options épuisées : sécuriser l'île pour la défense sub-régionale du haut Atlantique nord. Pêche, commerce, patrouilles contre les sondages agressifs."
 GRN_focus_Passive_Administration_Act: "Loi d'administration passive"
 GRN_focus_Passive_Administration_Act_desc: "L'Islande sous contrôle plus direct : une approche passive, confédérale douce malgré l'organisation fédérale."
 GRN_focus_The_North_Sea_Gambit: "Le gambit de la mer du Nord"
 GRN_focus_The_North_Sea_Gambit_desc: "Les Féroé sont à mi-chemin. Les prendre pour pousser le Danemark à nous déclarer la guerre et contourner l'article 5, plus une tête de pont continentale."
 GRN_focus_Friends_On_The_Other_Side: "Des amis de l'autre côté"
 GRN_focus_Friends_On_The_Other_Side_desc: "Gagner cœurs et esprits féroïens par la bienveillance. Quelques conversations : le Danemark ne les a jamais traités si bien."
 GRN_focus_Operation_Fair_Oh: "Opération : Fair Oh"
 GRN_focus_Operation_Fair_Oh_desc: "Et si on « yoinkait » les Féroé ? Sans sang versé, est-ce vraiment une attaque ? Le plan agressif mais pas agressif parfait."
 GRN_focus_Continental_Shenanigans: "Manigances continentales"
 GRN_focus_Continental_Shenanigans_desc: "Tremplins de mer du Nord sécurisés : vers le continent, vers l'ancien suzerain."
 GRN_focus_Family_Investments: "Investissements familiaux"
 GRN_focus_Family_Investments_desc: "Le Danemark se méfie : approche plus passive pour qu'il baisse la garde."
 GRN_focus_Jylland_Investment_Firm: "Société d'investissement du Jylland"
 GRN_focus_Jylland_Investment_Firm_desc: "Comme en Islande : un paquet d'investissements pour isoler politiquement le Danemark de ses engagements d'alliance."
 GRN_focus_Operation_Middleman: "Opération : Intermédiaire"
 GRN_focus_Operation_Middleman_desc: "Le Danemark est l'intermédiaire entre la famille nordique et le continent. Il faut le sécuriser."
 GRN_focus_Civil_Service_Integration: "Intégration de la fonction publique"
 GRN_focus_Civil_Service_Integration_desc: "Intégrer les services civils danois pour des opérations quotidiennes moins disruptives."
 GRN_focus_Nordic_Regional_Operations: "Opérations régionales nordiques"
 GRN_focus_Nordic_Regional_Operations_desc: "Le centre de commandement danois obtenu, élargir les objectifs stratégiques, plus indirects."
 GRN_focus_West_Nordic_Interests: "Intérêts des pays nordiques occidentaux"
 GRN_focus_West_Nordic_Interests_desc: "Gagner de l'influence en Norvège pour les ressources et l'approbation civile d'une plus grande union nordique."
 GRN_focus_North_Fjords_Investment_Firm: "Société d'investissement des fjords du Nord"
 GRN_focus_North_Fjords_Investment_Firm_desc: "Comme Islande et Groenland : nos intérêts par le développement des leurs."
 GRN_focus_Operation_Fjordsland: "Opération : Fjordsland"
 GRN_focus_Operation_Fjordsland_desc: "La Norvège : routes et ressources de mer du Nord, jeton OTAN contre la Russie, pied dans le Grand Nord."
 GRN_focus_North_Sea_Negotiations: "Négociations de la mer du Nord"
 GRN_focus_North_Sea_Negotiations_desc: "Travailler avec la population sur le nouveau statu quo pour lisser l'intégration."
 GRN_focus_Central_Nordic_Interests: "Intérêts des pays nordiques centraux"
 GRN_focus_Central_Nordic_Interests_desc: "Sécuriser nos intérêts en Suède, cœur des nations nordiques."
 GRN_focus_Karlstad_Central_Investments_Agency: "Agence centrale des investissements de Karlstad"
 GRN_focus_Karlstad_Central_Investments_Agency_desc: "Investir autour de Karlstad : opinions plus favorables, avenir suédois et le nôtre."
 GRN_focus_Operation_Great_Northern_War: "Opération : grande guerre du Nord"
 GRN_focus_Operation_Great_Northern_War_desc: "Le côté amical de la politique a échoué malgré le tempérament suédois. Moyens plus musclés."
 GRN_focus_Stockholm_Community_Programs: "Programmes communautaires de Stockholm"
 GRN_focus_Stockholm_Community_Programs_desc: "Aller vers les communautés de Stockholm pour des impressions plus positives et une intégration plus douce."
 GRN_focus_Eastern_Nordic_Interests: "Intérêts des pays nordiques orientaux"
 GRN_focus_Eastern_Nordic_Interests_desc: "La Finlande : jeton entre USA et Russie, longue frontière avec l'Ours de l'Est."
 GRN_focus_Suomen_Investment_Agency: "Agence d'investissement Suomen"
 GRN_focus_Suomen_Investment_Agency_desc: "Développer ce que les Finlandais semblent vouloir, et ce qui sert nos buts."
 GRN_focus_Operation_Mannerheim: "Opération : Mannerheim"
 GRN_focus_Operation_Mannerheim_desc: "Sécuriser les terres gelées finlandaises : un chez-soi loin de chez soi, environnement rude, pas trop difficile."
 GRN_focus_Continued_Peaceable_Autonomy: "Autonomie pacifique continue"
 GRN_focus_Continued_Peaceable_Autonomy_desc: "Le peuple finlandais chérit solitude et solidarité. Un accord d'égaux, sans forcer civils ni gouvernement : plus facile qu'on ne croit."
 GRN_focus_Solidifying_Nordic_Unity: "Solidifier l’unité nordique"
 GRN_focus_Solidifying_Nordic_Unity_desc: "Ambitions modestement conclues : une nouvelle union nordique rivalisant avec les autres unions du monde."
 GRN_focus_Continental_Ambitions: "Ambitions continentales"
 GRN_focus_Continental_Ambitions_desc: "Nordiques consolidés, regarder au sud. Le modèle diplomatique jusqu'ici : prochaine étape, l'Union continentale inuite."
 GRN_focus_Eastern_Continental_Interests: "Intérêts du continent oriental"
 GRN_focus_Eastern_Continental_Interests_desc: "Vers le sud : une grande frontière est par un pied dans les Baltiques."
 GRN_focus_Operation_Nordic_Adjacent: "Opération : Adjacent nordique"
 GRN_focus_Operation_Nordic_Adjacent_desc: "L'Estonie est la plus proche depuis la Finlande : para ou invasion navale depuis Helsinki, vite, avant les protestations."
 GRN_focus_Operation_Riga_River: "Opération : Rivière Riga"
 GRN_focus_Operation_Riga_River_desc: "La Lettonie : plateau central pour le reste de la Baltique."
 GRN_focus_Operation_Vilnius: "Opération : Vilnius"
 GRN_focus_Operation_Vilnius_desc: "La Lituanie, la plus développée des Baltiques : la faire tomber, les deux autres seront une promenade."
 GRN_focus_Baltic_Behestment: "Ordre balte"
 GRN_focus_Baltic_Behestment_desc: "Intégrer les anciennes nations baltes, volonté forte : un standing similaire à celui des autorités finlandaises."
 GRN_focus_North_Sea_Security: "Sécurité en mer du Nord"
 GRN_focus_North_Sea_Security_desc: "Toute la mer du Nord et l'Atlantique nord : aligner les îles celtiques et leurs occupants."
 GRN_focus_Operation_Albion: "Opération : Albion"
 GRN_focus_Operation_Albion_desc: "Sécuriser le cœur de ce qui est ou fut le « Royaume-Uni », crucial pour les îles celtiques et l'ouest du continent."
 GRN_focus_Operation_Highlander: "Opération : Highlander"
 GRN_focus_Operation_Highlander_desc: "L'Écosse : quasi contrôle total de la zone stratégique de mer du Nord, base d'une avance vers le sud."
 GRN_focus_Operation_Great_Western_Nation: "Opération : Great Western Nation"
 GRN_focus_Operation_Great_Western_Nation_desc: "Pays de Galles et ancienne Great Western Railway : infra vers l'Irlande à l'ouest et l'Angleterre au sud-est."
 GRN_focus_Operation_Be_My_Mann: "Opération : Sois mon homme"
 GRN_focus_Operation_Be_My_Mann_desc: "L'île de Man : note de bas de page navale critique pour tout l'ensemble celtique."
 GRN_focus_Operation_Ulster: "Opération : Ulster"
 GRN_focus_Operation_Ulster_desc: "Île encore divisée : frapper l'Ulster plus faible, puis marcher au sud."
 GRN_focus_Operation_Emerald_Isle: "Opération : Île d'Émeraude"
 GRN_focus_Operation_Emerald_Isle_desc: "Toute l'Irlande : avances vers l'ouest du continent et tremplin vers l'autre île."
 GRN_focus_Celtic_Consolidations: "Consolidations celtiques"
 GRN_focus_Celtic_Consolidations_desc: "Intégrer, normaliser l'autorité : aide, services, montrer qu'on peut vivre sous la nouvelle bannière."
 GRN_focus_Western_European_Advances: "Avancées de l’Europe occidentale"
 GRN_focus_Western_European_Advances_desc: "Marche vers la section ouest-centrale des nations."
 GRN_focus_Operation_Bonaparte: "Opération : Bonaparte"
 GRN_focus_Operation_Bonaparte_desc: "La France, pierre angulaire de l'ouest européen, porte de l'Ibérie. Consolider la nation la plus occidentale de l'axe central."
 GRN_focus_Operation_Windmill: "Fonctionnement : Moulin à vent"
 GRN_focus_Operation_Windmill_desc: "Les Pays-Bas, tête de pont ouest, surtout côte : vite faits."
 GRN_focus_Operation_Rhine_Rumble: "Opération : Rumble du Rhin"
 GRN_focus_Operation_Rhine_Rumble_desc: "L'Allemagne définit le centre de l'Europe. La prendre, c'est prendre le continent à terme."
 GRN_focus_Operation_Chocolate_Waffle: "Opération : Gaufre au chocolat"
 GRN_focus_Operation_Chocolate_Waffle_desc: "La Belgique, création britannique, épine de l'unité européenne. L'ôter sans délai."
 GRN_focus_Operation_Speed_Bump: "Opération : Ralentisseur"
 GRN_focus_Operation_Speed_Bump_desc: "C'est le Luxembourg, ce n'est pas une menace sauf s'il rejoint une coalition d'autres nations. On le prend maintenant, d'accord, salut."
 GRN_focus_French_Values_Greenlandic_Leadership: "Valeurs françaises, leadership groenlandais"
 GRN_focus_French_Values_Greenlandic_Leadership_desc: "La France agité : du temps pour montrer qu'on ne change pas les valeurs, seulement le leadership."
 GRN_focus_German_Traditions_Greenlandic_Initiative: "Traditions allemandes, initiatives groenlandaises"
 GRN_focus_German_Traditions_Greenlandic_Initiative_desc: "Traditions militaires allemandes plus ambitions groenlandaises : hégémonie continentale."
 GRN_focus_Low_Countries_Low_Maintainance: "Pays Bas, faible maintenance"
 GRN_focus_Low_Countries_Low_Maintainance_desc: "Les Pays-Bas veulent équité et esprit libre. Union d'égaux : plus facile que prévu."
 GRN_focus_Iberian_Atlantic_Interests: "Intérêts ibériques atlantiques"
 GRN_focus_Iberian_Atlantic_Interests_desc: "L'Ibérie : goulet atlantique et accès méditerranéen. Il faut ce point vital."
 GRN_focus_Operation_Castile: "Opération : Castille"
 GRN_focus_Operation_Castile_desc: "L'Espagne est le grand chien ibérique : la prendre, c'est presque la région."
 GRN_focus_Operation_Fontainebleau: "Opération : Fontainebleau"
 GRN_focus_Operation_Fontainebleau_desc: "Napoléon tenta le Portugal par un traité avec l'Espagne. Aujourd'hui nous prendrons le Portugal pour l'unité ibérique et le fédéralisme européen."
 GRN_focus_Operation_The_Other_Galicia: "Opération : l'autre Galice"
 GRN_focus_Operation_The_Other_Galicia_desc: "Hors d'Europe, Galice évoque l'ouest ukrainien. Ici : la nation galicienne au nord-ouest ibérique."
 GRN_focus_Operation_Basquing_In_the_Sun: "Opération : basquer au soleil"
 GRN_focus_Operation_Basquing_In_the_Sun_desc: "Traiter la nation basque sera simple, si ce n'est déjà fait. L'avons-nous fait ? J'oublie."
 GRN_focus_Operation_Barcelona: "Opération : Barcelone"
 GRN_focus_Operation_Barcelona_desc: "Le nord-est ibérique : pied de l'autre côté des montagnes de l'ancienne frontière franco-espagnole."
 GRN_focus_Operation_Casablanca: "Opération : Casablanca"
 GRN_focus_Operation_Casablanca_desc: "L'Andalousie : contrôle incontesté de notre moitié du détroit de Gibraltar."
 GRN_focus_Iberian_Idealism: "Idéalisme ibérique"
 GRN_focus_Iberian_Idealism_desc: "Contrôle total : unité régionale par cultures, histoire et esprit. Unité par la force et la prospérité."
 GRN_focus_Alpine_Block_Nations: "Nations du bloc alpin"
 GRN_focus_Alpine_Block_Nations_desc: "Le centre-sud montagneux, des Alpes aux chaînes italiennes. Le sécuriser avant d'aller plus à l'est."
 GRN_focus_Operation_Neutral_No_More: "Fonctionnement : Neutre, plus rien"
 GRN_focus_Operation_Neutral_No_More_desc: "La Suisse, nation de montagnes. La conquérir, c'est pouvoir tout conquérir."
 GRN_focus_Operation_Vienna_Calling: "Opération : Appel de Vienne"
 GRN_focus_Operation_Vienna_Calling_desc: "Des Alpes à la plaine hongroise : l'Autriche, voie vers l'est et le sud."
 GRN_focus_Operation_Slovene_And_Slide: "Opération : Slovene And Slide"
 GRN_focus_Operation_Slovene_And_Slide_desc: "Prendre pied dans les Balkans du nord nous aidera à sécuriser la région une fois que nous y porterons notre attention."
 GRN_focus_Operation_Gelato: "Opération : Gelato"
 GRN_focus_Operation_Gelato_desc: "La nation italienne siège stratégiquement au centre-sud de l'Europe et de la Méditerranée. La sécuriser, c'est sécuriser un appareil naval vital pour les opérations suivantes."
 GRN_focus_Securing_Local_Interests: "Garantir les intérêts locaux"
 GRN_focus_Securing_Local_Interests_desc: "Veiller aux intérêts des populations locales et à leurs besoins aidera à jeter une lumière nouvelle et plus positive sur la situation. Nous espérons qu'en nous rapprochant davantage du peuple, la transition du pouvoir sera plus fluide."
 GRN_focus_Great_Eastern_Interests: "Grands intérêts orientaux"
 GRN_focus_Great_Eastern_Interests_desc: "Notre pied-à-terre à l'est étant assuré, nous pouvons désormais rayonner vers le reste de l'Europe orientale. Des confins polonais et tchèques aux frontières biélorusses et ukrainiennes. Nous commencerons notre marche vers l'est."
 GRN_focus_Operation_Heartbeat: "Opération : Battement de coeur"
 GRN_focus_Operation_Heartbeat_desc: "La Pologne est le cœur battant de l'Europe de l'Est. On l'a appelée le Texas européen en raison de son lourd investissement dans la préparation militaire. Nous allons maintenant la mettre à l'épreuve ultime."
 GRN_focus_Operation_Carpathia: "Opération : Carpathia"
 GRN_focus_Operation_Carpathia_desc: "La majeure partie de la nation slovaque siège sur la courbe nord de la grande chaîne des Carpates. Si nous voulons une plateforme générale pour descendre vers les Balkans, il faudra franchir ces montagnes."
 GRN_focus_Operation_Final_Rhapsody: "Opération : Rhapsodie finale"
 GRN_focus_Operation_Final_Rhapsody_desc: "Sécuriser la Tchéquie nous permet à peu près de solidifier l'approche nord complète vers les Balkans. Ce n'est qu'un pas de plus vers l'unité européenne."
 GRN_focus_Operation_White_Russian: "Opération : Russe Blanc"
 GRN_focus_Operation_White_Russian_desc: "La Biélorussie est le pivot qui tient l'intérêt russe en Europe, au-delà des vieilles ambitions historiques. Il nous faudra leur couper le vent des voiles si nous voulons vraiment solidifier notre contrôle du continent."
 GRN_focus_Operation_Bread_Basket: "Opération : Corbeille à Pain"
 GRN_focus_Operation_Bread_Basket_desc: "Sécuriser le grenier du continent nous profiterait de bien des façons : c'est une certitude que nous devons obtenir."
 GRN_focus_Operation_Soviet_Storm: "Opération : Tempête soviétique"
 GRN_focus_Operation_Soviet_Storm_desc: "La Transnistrie est une nation qui est en elle-même une capsule temporelle. L'un des derniers bastions de l'URSS, ce pays, petit, est extrêmement fier et défiant par des machinations quasi-occultes qui le maintiennent en vie en tant que nation."
 GRN_focus_Operation_Your_Right_No_Your_Other_Right: "Opération : à droite, non, l'autre droite"
 GRN_focus_Operation_Your_Right_No_Your_Other_Right_desc: "Il faut attaquer la Moldavie… non, pas la région roumaine, l'État. Oui, je sais, c'est confus, mais ne me le demandez pas : demandez-leur quand nous y serons."
 GRN_focus_Eastern_Territorial_Authority_Bureau: "Bureau de l'Autorité territoriale de l'Est"
 GRN_focus_Eastern_Territorial_Authority_Bureau_desc: "L'ETAB est une agence dédiée à composer avec les nations de l'est plus libres d'esprit. Ces gens ont de vastes terres rurales plus ou moins encore indomptées en termes de centralisation. Nous pouvons mener des projets d'infrastructure et des programmes de proximité communautaire pour calmer et apaiser les problèmes prolongés que nous pourrions rencontrer."
 GRN_focus_Balkan_Bounties: "Primes des Balkans"
 GRN_focus_Balkan_Bounties_desc: "Les derniers clous de ce vaste projet : les nations balkaniques. Une terre de guerres et d'histoire que nous travaillerons longuement à apprivoiser, ce zoo volatil d'une région."
 GRN_focus_Operation_Nosferatu: "Opération : Nosferatu"
 GRN_focus_Operation_Nosferatu_desc: "Le bassin transylvain au sein des Carpates est une position défensive stratégique. La Roumanie elle-même accueille aussi une part non négligeable de production énergétique, et nous pourrons mieux utiliser ces ressources au bénéfice de tous."
 GRN_focus_Operation_Bulgar: "Opération : Bulgare"
 GRN_focus_Operation_Bulgar_desc: "La solidification de la section orientale le long de la mer Noire nous aidera à consolider nos efforts vers l'intérieur des Balkans."
 GRN_focus_Operation_Alexander_Not_So_Great: "Opération : Alexandre pas si Grand"
 GRN_focus_Operation_Alexander_Not_So_Great_desc: "La nation de Macédoine prétend détenir la fière figure historique d'Alexandre le Grand. Eh bien, je ne le vois pas maintenant, alors nous allons simplement prendre les choses en main d'ici."
 GRN_focus_Operation_Trianon: "Opération : Trianon"
 GRN_focus_Operation_Trianon_desc: "La nation hongroise chevauche le plateau nord-central des Balkans. Si nous la sécurisons, nous avons une voie claire vers le sud et la Méditerranée."
 GRN_focus_Operation_Princip: "Opération : Principe"
 GRN_focus_Operation_Princip_desc: "De la Main noire qui causa une guerre mondiale, nous donnons maintenant à la nation serbe une claque pour régler l'un des plus grands allumeurs d'incendie de la région."
 GRN_focus_Operation_Koso_Woah: "Opération : Koso Woah"
 GRN_focus_Operation_Koso_Woah_desc: "Le dos-d'âne qu'est le Kosovo est davantage une épine dans le flanc de la Serbie qu'il ne le sera pour nous. Aussi cela devrait-il être une affaire rapide."
 GRN_focus_Operation_Scissors: "Opération : Ciseaux"
 GRN_focus_Operation_Scissors_desc: "Sécuriser la Croatie nous permet de sécuriser un appareil côtier significatif et des positions de flanc tandis que nous poursuivons des ambitions plus méridionales."
 GRN_focus_Operation_Minefield: "Opération : Champ de mines"
 GRN_focus_Operation_Minefield_desc: "Notre plus grande inquiétude en soumettant la nation très divisée de Bosnie est que le pays entier est pratiquement un champ de mines déjà posé. Aussi nous faudra-t-il beaucoup d'équipement pour les traiter si nous voulons réellement avancer de bon train."
 GRN_focus_Operation_Mountain_Man: "Opération : Homme de la Montagne"
 GRN_focus_Operation_Mountain_Man_desc: "Les montagnes du Monténégro sont un dur morceau à casser, mais nous y arriverons assez tôt."
 GRN_focus_Operation_Adriatic_Gateway: "Opération : Passerelle Adriatique"
 GRN_focus_Operation_Adriatic_Gateway_desc: "Sécuriser l'Albanie nous permet de fermer l'Adriatique. Ce faisant, nous assurons un énorme potentiel de construction navale et un vaste réseau portuaire que nous pourrions utiliser pour des opérations en Méditerranée."
 GRN_focus_Operation_This_Is_Sparta: "Opération : C'est Sparte"
 GRN_focus_Operation_This_Is_Sparta_desc: "La Grèce, nation péninsulaire et insulaire qui détient d'importants trésors culturels et historiques. Nous sécuriserons ce carrefour de l'histoire elle-même, mais nous devrons faire de notre mieux pour ne pas détruire les sites historiques."
 GRN_focus_Southern_Territorial_Authority_Commission: "Commission d'autorité territoriale du Sud"
 GRN_focus_Southern_Territorial_Authority_Commission_desc: "Créer une commission dédiée nous permettra de concentrer les mesures d'intégration et d'unité afin de ne pas avoir un problème national à cause d'une zone qui n'arrive pas à garder les mains pour elle."
 GRN_focus_Establishing_The_Frozen_Federation: "Établir la Fédération gelée"
 GRN_focus_Establishing_The_Frozen_Federation_desc: "Nous l'avons enfin fait. Nous avons créé une nation fédérale unie qui relie les nations nordiques gelées au reste des nations de l'Union continentale européenne. Bien sûr, ce n'est pas parfait, et donc pas l'ensemble de la région géographiquement continentale de l'Europe. Mais c'est notre part d'histoire, et nous ferons tout notre possible pour rester fidèles aux valeurs et aux peuples que nous tenons désormais sous nos ailes. À la Fédération !"
 GRN_focus_The_Great_Ice_Shelf: "Le Grand Plateau de glace"
 GRN_focus_The_Great_Ice_Shelf_desc: "Le vaste intérieur de notre nation n'est qu'une immense nappe de glace. Avec l'avancée du développement de notre pays, nous avons pu entamer le plateau par une utilisation contrôlée de l'eau gelée. Nous pouvons désormais porter toute notre attention vers l'intérieur et nous préparer à le peupler et le développer convenablement. Car l'avenir est vert et nous découvrirons les terres sous la glace."
 GRN_focus_Southern_Interior_Development_Projects: "Projets de développement de l'intérieur sud"
 GRN_focus_Southern_Interior_Development_Projects_desc: "Nous commencerons à nous attaquer à la région intérieure du sud que nous avons marquée pour le développement et la mise en place logistique."
 GRN_focus_Southern_Settlement_Projects: "Projets de colonisation du Sud"
 GRN_focus_Southern_Settlement_Projects_desc: "Pour aider la logistique, nous établirons une petite série d'établissements stratégiquement situés afin de renforcer non seulement la population locale mais aussi de créer une sorte de chaîne d'approvisionnement dans la région. Cela nous aidera à faciliter les projets futurs que nous entreprendrons pour enfin apprivoiser une bonne portion du Grand Plateau de glace."
 GRN_focus_Southern_Infrastructure_Projects: "Projets d'infrastructure du Sud"
 GRN_focus_Southern_Infrastructure_Projects_desc: "Pour relier nos établissements et commencer toute activité économique, il nous faudra une forme d'infrastructure afin de poser l'étalon-or de la façon de vraiment apprivoiser la nature."
 GRN_focus_Southern_Economic_Projects: "Projets économiques du Sud"
 GRN_focus_Southern_Economic_Projects_desc: "Avec des gens et des infrastructures désormais présents dans la région intérieure du sud, nous pouvons commencer à bâtir lentement une base économique interne ou locale. Cette fondation préparera une croissance considérable à mesure que le temps avance."
 GRN_focus_Southern_Mining_Projects: "Projets miniers du Sud"
 GRN_focus_Southern_Mining_Projects_desc: "La région se stabilisant lentement sur le plan économique et social, il est temps de lancer des projets de forage profond. Nous utiliserons la glace pour miner en continu vers le bas afin d'obtenir de vraies données géologiques et d'éviter la surchauffe du matériel due au différentiel de température."
 GRN_focus_Taming_The_Southern_Interior: "Apprivoiser l'intérieur du sud"
 GRN_focus_Taming_The_Southern_Interior_desc: "Avec les gens, les infrastructures et les ressources disponibles, nous pouvons désormais dire que nous avons vraiment apprivoisé une part du Grand Plateau de glace. Bien sûr, notre travail n'est pas fini, loin de là. Mais nous pouvons maintenant regarder avec confiance le grand horizon nord et dire que nous sommes sur un voyage grand et fécond."
 GRN_focus_Central_Plateau_Development_Projects: "Projets de développement du plateau central"
 GRN_focus_Central_Plateau_Development_Projects_desc: "L'intérieur du sud étant apprivoisé sur le plan fondateur, nous pouvons désormais porter la grande croisade de glace dans la région centrale. Avec plus de glace et de terres potentielles, nous pourrons investir dans davantage de métriques fondatrices."
 GRN_focus_Central_Settlement_Projects: "Projets de règlement centraux"
 GRN_focus_Central_Settlement_Projects_desc: "Comme dans la région du sud, nous commencerons à établir des établissements stratégiques à travers le plateau."
 GRN_focus_Central_Infrastructure_Projects: "Projets d'infrastructure du plateau central"
 GRN_focus_Central_Infrastructure_Projects_desc: "Nos établissements étant établis, nous pouvons commencer à créer un réseau d'infrastructure suffisant pour tout relier convenablement."
 GRN_focus_Central_Economic_Projects: "Projets économiques du plateau central"
 GRN_focus_Central_Economic_Projects_desc: "Population, fait. Infrastructure, fait. Nous avançons maintenant pour établir un appareil économique local."
 GRN_focus_Central_Mining_Projects: "Projets miniers centraux"
 GRN_focus_Central_Mining_Projects_desc: "Comme pour la région du sud, nous avons enfin créé le réseau à la fois économique et social pour préparer les opérations d'extraction. La zone est bien plus vaste que le sud, alors à une entreprise féconde."
 GRN_focus_Taming_The_Central_Plateau: "Apprivoiser le plateau central"
 GRN_focus_Taming_The_Central_Plateau_desc: "Avec les gens, les établissements, la nourriture, l'économie et les ressources en place, nous pouvons désormais dire officiellement et avec confiance que nous avons apprivoisé le Grand Plateau de glace. Il y aura encore bien des difficultés à mesure que le temps avance, mais pour l'instant et l'avenir prévisible, nous pouvons nous prélasser dans la grande gloire polaire de notre nation grande et prospère."
 GRN_eu_adjacent_nation: "Une nation adjacente à l’UE"
 GRN_eu_adjacent_nation_desc: "Le Groenland est dans une situation particulière. Étant le plus éloigné du continent européen, il n'est et ne sera probablement jamais un État membre de l'UE. Toutefois, du fait de son statut de colonie de la Couronne danoise, il bénéficie du même régime de migration et de voyage que tout autre État membre. Aussi de nombreux Groenlandais s'en servent-ils pour chercher de meilleures opportunités d'éducation, vu le manque de développement général de l'île."
 GRN_economic_pains: "Maux économiques"
 GRN_economic_pains_desc: "La population du Groenland stagne autour de 50 000 habitants depuis des décennies, et a même été plus faible encore, le climat rude et la logistique devenant le pivot du développement. Au nouveau millénaire, le problème continue et les dirigeants du pays doivent trouver comment adapter l'économie si elle et la nation elle-même doivent devenir plus qu'une stagnation."
 GRN_idea_colonial_subsidy: "Subvention coloniale"
 GRN_idea_colonial_subsidy_desc: "Notre nation est extrêmement sous-développée au point de dépendre lourdement des subventions danoises pour le quotidien. Si nous voulons seulement penser à l'indépendance vis-à-vis de la Couronne danoise, il nous faudra cesser d'avoir besoin de cette subvention simplement pour survivre."
 GRN_idea_narrow_gauge_nation: "Nation à voie étroite"
 GRN_idea_narrow_gauge_nation_desc: "La souplesse et le rapport coût-efficacité de la voie étroite et de son matériel nous permettront de lancer le développement et la connectivité de la nation dans son ensemble. Elle a de plus l'avantage de sécurité d'être moins chère à rendre plus sûre que la voie normale et son matériel conventionnels."
 GRN_idea_battle_for_independence: "Combat pour l'indépendance"
 GRN_idea_battle_for_independence_desc: "Nous avons atteint un point où notre indépendance est assurée. Nous lancerons d'immenses campagnes de pression pour qu'elle soit garantie de notre vivant."
 GRN_ideas_political_freedoms: "Libertés politiques"
 GRN_ideas_political_freedoms_desc: "Notre nation étant libre de choisir ce que son peuple désire, nous ne nous sentons liés à aucune idéologie particulière."
 GRN_ideas_emerging_political_influences: "Influences politiques émergentes"
 GRN_ideas_emerging_political_influences_desc: "Notre nation désormais indépendante, nous pouvons nous concentrer sur une approche moderne de notre politique en émergeant dans ce monde nouveau."
 GRN_ideas_non_aligned_political_influences: "Influences politiques non-alignées"
 GRN_ideas_non_aligned_political_influences_desc: "Notre nation étant libre de tracer la voie que nous voulons, aucun camp géopolitique ne semble vraiment nous profiter, aussi nous concentrerons-nous sur nous-mêmes d'une façon plus neutre."
 GRN_ideas_nationalist_political_influences: "Influences politiques nationalistes"
 GRN_ideas_nationalist_political_influences_desc: "Notre nation est libre, notre peuple est uni, notre nation est la priorité pour notre regard sur l'avenir. Le nationalisme groenlandais nous donne la paix de l'esprit."
 GRN_idea_alumina_research_institute: "Institut de recherche sur l'alumine"
 GRN_idea_alumina_research_institute_desc: "La création de l'ARI est fondamentale pour comprendre l'extraction, le raffinage et l'utilisation efficace des ressources. Ce complexe de R&D dédié propulsera notre nation vers de nouveaux sommets en matière de négociations commerciales étrangères comme de moyens plus pratiques de politiques autarciques."
 GRN_idea_economic_development_visas: "Visas de développement économique"
 GRN_idea_economic_development_visas_desc: "Ceux qui cherchent à s'installer dans le pays peuvent demander un visa de classe 1, dit visa de développement économique. Le VDE est essentiellement un processus d'accueil pour aider les nouveaux citoyens à s'installer et trouver un emploi où ils contribueront au développement et à la croissance globale de la nation."
 GRN_idea_sanctioned_immigration_efforts: "Efforts d’immigration sanctionnés"
 GRN_idea_sanctioned_immigration_efforts_desc: "Par des efforts ciblés, nous tenterons d'assurer une croissance démographique régulière grâce à l'immigration."
 GRN_idea_strategic_mineral_leasing: "Concessions minières stratégiques"
 GRN_idea_strategic_mineral_leasing_desc: "La déclaration de concession minière à des sociétés étrangères est une épée très tranchante à manier. Il faut réglementer précisément ce qu'elles peuvent extraire, où elles peuvent extraire et où iront ces minéraux. Ainsi pouvons-nous espérer limiter les formes les plus excessives d'ingérence étrangère dans notre structure politique, tout en les utilisant pour développer nos atouts de négociation."
 GRN_idea_contracting_a_workforce: "Embaucher une main-d’œuvre"
 GRN_idea_contracting_a_workforce_desc: "User de l'appareil des douanes et de la sécurité des frontières pour sécuriser une main-d'œuvre sous contrat nous permet d'étendre les entreprises et les industries à un rythme régulier et plus fiable. Après tout, ils ont lu le contrat et l'ont signé."
 GRN_idea_agriculture_automations: "Automatisations agricoles"
 GRN_idea_agriculture_automations_desc: "Le problème principal de notre nation est simplement de garder une main-d'œuvre stable à employer. Aussi avons-nous décidé d'investir lourdement dans le secteur agricole afin de réduire grandement le besoin de ressources humaines supplémentaires dans ce secteur."
 GRN_idea_war_production_automations: "Automatisations de production de guerre"
 GRN_idea_war_production_automations_desc: "Le problème principal de notre nation est simplement de garder une main-d'œuvre stable à employer. Aussi avons-nous décidé d'investir lourdement dans le secteur de la production de guerre afin de réduire grandement le besoin de ressources humaines supplémentaires. Cela libère à la fois des travailleurs et une main-d'œuvre potentielle pour l'armée si besoin."
 GRN_idea_industrial_automations: "Automatisations industrielles"
 GRN_idea_industrial_automations_desc: "Le problème principal de notre nation est simplement de garder une main-d'œuvre stable à employer. Aussi avons-nous décidé d'investir lourdement dans le secteur manufacturier afin de réduire grandement le besoin de ressources humaines supplémentaires. Ce secteur en expansion permanente exige d'ordinaire le plus de travailleurs du fait de l'échelle, aussi cela devrait-il nous être le plus bénéfique."
 GRN_idea_corporate_automations: "Automatisations d'entreprise"
 GRN_idea_corporate_automations_desc: "Le problème principal de notre nation est simplement de garder une main-d'œuvre stable à employer. Aussi avons-nous décidé d'investir lourdement dans les secteurs des services de bureau et des technologies afin de réduire grandement le besoin de ressources humaines supplémentaires. Ce secteur très gourmand en personnel exige d'ordinaire le plus de travailleurs du fait de ses demandes brutes, aussi cela pourrait-il nous être le plus bénéfique."
 GRN_idea_strategic_mining_automations: "Automatisations minières stratégiques"
 GRN_idea_strategic_mining_automations_desc: "En retravaillant la façon dont nous extrayons les ressources et en nous concentrant sur la capacité d'envoyer moins de gens dans les mines lorsque c'est possible, nous pouvons maximiser l'effort minier sans le risque imminent de pertes humaines. Ce ne sera pas parfait, mais ces véhicules autonomes et certains équipements devraient ouvrir de bien meilleures opportunités."
 GRN_idea_pro_military_economic_organization: "Organisation économique pro-militaire"
 GRN_idea_pro_military_economic_organization_desc: "En réorientant l'économie autour d'exigences plus civiles et d'enrôlement, nous améliorerons les capacités de fabrication de nos usines d'armement afin de réduire la main-d'œuvre nécessaire à leur fonctionnement. Un tel bouleversement paralysera certes les capacités de production brutes, mais une fois les opérations stabilisées et en ligne, ces installations devraient produire davantage avec bien moins."
 GRN_idea_frozen_warfare_training: "Entraînement à la guerre gelée"
 GRN_idea_frozen_warfare_training_desc: "Nos programmes d'entraînement se concentreront principalement sur le combat hivernal et en climat froid. Bien sûr, nous tenterons d'autres entraînements lorsque ce sera possible, mais notre foyer est froid et nous devons nous entraîner convenablement pour le défendre."
 GRN_idea_polar_logistics_doctrine: "Doctrine logistique polaire"
 GRN_idea_polar_logistics_doctrine_desc: "Construire fondamentalement notre équipement pour mieux servir dans le froid extrême nous permet de mieux combattre comme nous le voulons si une force ennemie décide de débarquer sur notre île."
 GRN_idea_artillery_specialist_corps: "Corps spécialisé en artillerie"
 GRN_idea_artillery_specialist_corps_desc: "L'artillerie est le pain quotidien pour infliger plus de dégâts qu'on n'en reçoit si l'on est en bonne position. Pour garder cet avantage, il nous faudra développer et faire grandir notre corps d'artillerie à un standard qui rende nos pertes aussi limitées que possible."
 GRN_idea_heavy_anti_air_investments: "De lourds investissements anti-aériens"
 GRN_idea_heavy_anti_air_investments_desc: "À l'âge moderne du combat, la nouvelle reine du champ de bataille est l'aéronef. Chasseurs, bombardiers, quoi que vous ayez besoin, ils le feront. Notre armée étant si petite, il nous faut trouver le moyen d'empêcher l'ennemi de faire ce qu'il veut. Aussi lancerons-nous un lourd investissement dans la conception et le développement d'équipements antiaériens afin que nos soldats au sol aient une réelle chance de combattre."
 GRN_idea_army_officer_corps: "Corps des officiers de l'armée"
 GRN_idea_army_officer_corps_desc: "L'établissement et la standardisation d'un corps de formation des officiers d'armée nous permettent de modeler, affiner et améliorer nos chefs tactiques et stratégiques, pour mieux leur propre compréhension et mieux les troupes qu'ils mènent."
 GRN_idea_small_ship_developments: "Développements de petits navires"
 GRN_idea_small_ship_developments_desc: "Les premiers développements portent leurs fruits : nos premiers dessins de corvettes nous montrent que, si nous pouvons affiner et améliorer, ce gain stratégique ne vaut que si nous trouvons les gens pour équiper convenablement les navires."
 GRN_idea_expanding_small_vessel_designs: "Expansion des conceptions de petits navires"
 GRN_idea_expanding_small_vessel_designs_desc: "Pour que notre département corvettes soit complété par des innovations similaires, nous nous concentrerons sur les types frégate et destroyer afin de doter pleinement nos flottes de petits bâtiments."
 GRN_idea_attack_submarine_programs: "Programmes de sous-marins d'attaque"
 GRN_idea_attack_submarine_programs_desc: "L'ASP est une série de programmes de développement et d'essais conçus pour prouver les limites et les moyens d'emploi les plus efficaces des nouvelles technologies."
 GRN_idea_missile_submarine_programs: "Programmes de sous-marins lance-missiles"
 GRN_idea_missile_submarine_programs_desc: "Le MSP est une série de programmes de développement et d'essais conçus pour prouver le moyen le plus efficace d'employer la technologie missile au combat naval."
 GRN_idea_navy_officer_corps: "Corps des officiers de la marine"
 GRN_idea_navy_officer_corps_desc: "Établir le Corps de formation des officiers de marine nous permettra d'élever les standards d'excellence au combat et au commandement pour notre branche navale."
 GRN_idea_aviation_innovations: "Innovations aéronautiques"
 GRN_idea_aviation_innovations_desc: "Les premiers résultats commencent à porter leurs fruits alors que l'installation TARI a commencé à déployer ses innovations dans les modèles généraux de conception et de production pour essais et affinage. Elles pourraient s'avérer utiles tandis que nous continuons à réformer et parfaire notre plan d'action de suprématie aérienne."
 GRN_idea_air_dominance_program: "Programme de domination aérienne"
 GRN_idea_air_dominance_program_desc: "L'ADP est dédié à la classe spécifique des chasseurs et à l'amélioration de leurs capacités de combat globales afin de préserver nos cieux du harcèlement ennemi."
 GRN_idea_bombing_innovations: "Innovations en matière de bombardement"
 GRN_idea_bombing_innovations_desc: "Les innovations dans le combat air-sol comme air-navire nous ont permis de spécialiser nos efforts de bombardement généraux pour les rendre plus efficaces que jamais. Il faut continuer à capitaliser sur ces efforts si nous voulons empêcher tout véritable débarquement ennemi sur notre île."
 GRN_idea_bomber_design_department: "Département de conception de bombardiers"
 GRN_idea_bomber_design_department_desc: "Dédié à améliorer et accroître l'efficacité de nos flottes de bombardement, le BDD est le sommet de l'innovation aérienne pour notre nation."
 GRN_idea_air_officer_corps: "Corps des officiers de l'air"
 GRN_idea_air_officer_corps_desc: "Développer le corps des officiers de l'armée de l'air nous permet d'améliorer l'efficacité générale et d'innover en matière de commandement et de tactiques appliquées aux opérations de combat aérien."
 GRN_idea_general_staff_corps: "Corps d'état-major général"
 GRN_idea_general_staff_corps_desc: "Notre armée étant enfin développée au point qu'un état-major unifié soit nécessaire entre les branches, notre nation a fait et continuera de faire de grands pas dans sa défense nationale."
 GRN_idea_agricultural_futurist_policies: "Politiques agricoles futuristes"
 GRN_idea_agricultural_futurist_policies_desc: "Prioriser les efforts de recherche comme les investissements économiques dans le grand secteur agricole nous permet de rester au fait des innovations et de continuer à dimensionner correctement les demandes si nous visons plus que les seuls besoins intérieurs."
 GRN_idea_polar_infrastructure_developments: "Développements d'infrastructure polaire"
 GRN_idea_polar_infrastructure_developments_desc: "Nos investissements continus dans la construction d'infrastructures comme dans les moyens de les rendre plus durables nous ont permis d'innover dans des domaines auxquels beaucoup ne penseraient même pas."
 GRN_idea_economic_modernity_policies: "Politiques de modernité économique"
 GRN_idea_economic_modernity_policies_desc: "Notre nation est à l'avant-garde du développement. Nous poursuivrons assurément cette grande marche vers la prospérité pour la nation et nos citoyens."
 GRN_ideas_mining_needs: "Besoins miniers"
 GRN_ideas_mining_needs_desc: "Nous avons décidé de concentrer le secteur minier autour des besoins nationaux plutôt que de quoi que ce soit au-delà. Cela nous a permis de négocier stratégiquement nos prix d'exportation tout en allégeant les demandes du secteur en ressources humaines."
 GRN_ideas_mining_greeds: "La cupidité minière"
 GRN_ideas_mining_greeds_desc: "Nous avons décidé de concentrer le secteur minier autour des besoins nationaux et internationaux plutôt que de ce qui est simplement nécessaire dans l'instant. En résultat, nous avons pu largement faire valoir nos ressources et négocier de vrais accords à l'export. Un petit problème de demandes accrues en travailleurs semble toutefois s'être infiltré dans le secteur économique ; le bénéfice global paraît justifier les moyens."
 GRN_ideas_intense_foreign_affairs_budgeting: "Budgétisation intensive des affaires étrangères"
 GRN_ideas_intense_foreign_affairs_budgeting_desc: "Si nous voulons sérieusement gagner du terrain dans les affaires diplomatiques à l'étranger, il faut nous concentrer sérieusement sur ces efforts. Avec notre force actuelle, nous manquons de stabilité intérieure du fait de nos préoccupations démographiques comparées à notre économie. Nous sommes essentiellement une carapace dure à l'intérieur vide si nous ne jouons pas bien nos cartes."
 GRN_ideas_political_shenanigans: "Manigances politiques"
 GRN_ideas_political_shenanigans_desc: "Une lumière récente a été jetée sur des efforts de mécontentement au sein de notre nation. Ils ne semblent guère plus qu'une nuisance vu l'état sain où nous sommes, mais il nous faudra identifier qui fait ça si nous voulons revenir à un calme plus grand."
 GRN_ideas_domesticating_foreign_policy: "Nationaliser la politique étrangère"
 GRN_ideas_domesticating_foreign_policy_desc: "Assurer nos ambitions étrangères signifie assurer aussi le front intérieur et les moyens de faire valoir notre influence à l'étranger."
 GRN_ideas_the_frozen_federation: "La Fédération gelée"
 GRN_ideas_the_frozen_federation_desc: "Nous avons uni le continent du mieux que nous pouvions. Reste que nous avons aussi uni tous les problèmes sous une même bannière. Ce n'est pas la fin du monde, mais ce sera certainement un chemin rude pour l'avenir prévisible."
 GRN_domestic_and_civil_affairs_administration: "L'administration des affaires intérieures et civiles"
 GRN_domestic_and_civil_affairs_administration_desc: "Le Groenland a un certain nombre de problèmes dont le cœur vient de sa faible population. L'administration des affaires intérieures et civiles a pour tâche de veiller aux citoyens du Groenland et de réformer, ajouter ou retirer des politiques au fil du temps afin d'assurer le meilleur et le plus équitable des résultats possibles pour les citoyens de l'île."
 GRN_federal_budgets: "Dépenses nationales"
 GRN_federal_budgets_desc: "L'île n'a pas beaucoup de gens mais exige encore des dépenses significatives pour l'entretien et le développement convenable. Il nous faudra chercher de meilleures méthodes de développement ou de budgétisation générale si nous voulons un avenir fiscal stable."
 GRN_revenue_collection_administration: "Administration de la collecte des recettes"
 GRN_revenue_collection_administration_desc: "La RCA est désignée comme l'agence de recouvrement et d'application fiscale du gouvernement national. Elle doit travailler avec les décideurs politiques pour que les impôts soient levés de façon juste, efficace et correctement appliqués afin d'assurer un budget national équilibré."
 GRN_economic_development_board: "Conseil de développement économique"
 GRN_economic_development_board_desc: "L'EDB est l'épine dorsale de l'élaboration de la politique économique et de la croissance et du développement nationaux. Cette partie du gouvernement vise à prendre politiques et programmes et à bâtir l'économie de la nation autant qu'à élever la qualité de vie des citoyens partout où c'est possible. La logistique est le plus grand obstacle à cet égard ; l'autre est simplement la main-d'œuvre et le capital, ainsi que la volonté pure de le faire."
 GRN_national_armed_services_of_greenland: "Services armés nationaux du Groenland"
 GRN_national_armed_services_of_greenland_desc: "Les forces armées du Groenland sont une institution particulière, la population de l'île étant si petite qu'elles ne peuvent pas faire grand-chose. Pourtant l'île a bien une force militaire et a théoriquement la capacité de l'étendre. Il reste à l'avenir des événements de dire comment cette expansion pourra se produire."
 GRN_idea_the_great_ice_shelf: "Le Grand Plateau de glace"
 GRN_idea_the_great_ice_shelf_desc: "L'inlandsis du Groenland est l'une des plus grandes masses de glace du monde à recouvrir une terre significative. Il peut atteindre deux milles de profondeur et constitue le plus grand obstacle à tout développement sérieux hors des zones côtières."
