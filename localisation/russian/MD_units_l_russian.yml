l_russian:
 fighter: "Истребитель превосходства в воздухе"
 Strike_fighter: "Ударный истребитель"
 L_Strike_fighter: "Легкий ударный истребитель"
 CV_L_Strike_fighter: "Палубный ударный истребитель"
 multi_role_fighter: "Многоцелевой истребитель"
 cv_multi_role: "Палубный многоцелевой истребитель"
 cas: "Штурмовик"
 strat_bomber: "Стратегический бомбардировщик"
 transport_plane: "Транспортный самолет"
 attack_helicopter: "Ударный вертолёт"
 Air_UAV: "Беспилотный летательный аппарат"
 transport_helicopter: "Транспортный вертолет"
 Militia_Bat: "Ополчение"
 Militia_Bat_desc: "Пешая рота ополчения. Ополчение отличается тем, что у него меньше тяжёлого вооружения и средств связи, чем у обычной пехоты. Это делает его очень подвижным и эффективным на трудной местности, но на равнине против бронетанкового противника оно быстро тает.\n\n§GПодсказка дизайнера: ополчение даёт дешёвую оборонительную ширину фронта и подавление. Лучше всего оно действует в городах, лесах и на холмах, но у него слабые оборона и прорыв, и оно особенно уязвимо перед бронетехникой и в бою на открытой или суровой местности.§!"
 Mot_Militia_Bat: "Моторизованная военная полиция"
 Mot_Militia_Bat_desc: "Рота ополчения на пикапах или даже на бронированных вспомогательных машинах. Ополчение отличается тем, что у него меньше тяжёлого вооружения и средств связи, чем у обычной пехоты. Это делает его очень подвижным и эффективным на трудной местности, но на равнине против бронетанкового противника оно быстро тает.\n\n§GПодсказка дизайнера: моторизованное ополчение меняет часть экономичности на скорость и большее подавление. Применяйте его для подвижной охраны и дешёвого развития успеха на равнинах и в пустынях, но помните: слабые боевые показатели и штрафы на пересечённой местности делают его плохими штурмовыми войсками.§!"
 L_Inf_Bat: "Легкая пехота"
 L_Inf_Bat_desc: "Рота лёгкой пехоты без транспорта. На современном поле боя встречается редко, но существуют части, приспособленные к очень трудной местности вроде джунглей и гор, где они крайне эффективны. Годится и как городской гарнизон.\n\n§GПодсказка дизайнера: лёгкая пехота даёт высокую организацию и хорошие боевые показатели на холмах, в лесах, горах, джунглях, на болотах и в городах, не требуя техники. Применяйте её для удержания или штурма трудной местности, но будьте готовы к медленным стратегическим переброскам и слабым атакам на равнинах и в пустынях.§!"
 Mot_Inf_Bat: "Моторизованная пехота"
 Mot_Inf_Bat_desc: "Рота моторизованной пехоты использует в качестве транспорта самые разные вспомогательные машины — от пикапов до современных бронемашин с противоминной защитой. Она обеспечивает быстрое передвижение там, где дороги и открытая местность благоприятствуют технике.\n\n§GПодсказка дизайнера: моторизованная пехота даёт недорогую скорость и хорошие показатели на открытой местности. Применяйте её для развития прорывов и поддержки быстрых участков фронта, но помните: машины увеличивают потребность в снаряжении и теряют эффективность в лесах, горах, джунглях, на болотах и в городах.§!"
 Mech_Inf_Bat: "Механизированная пехота"
 Mech_Inf_Bat_desc: "Рота механизированной пехоты использует в качестве транспорта бронетранспортёры. Она хорошо подходит для бронетанкового боя на равнине.\n\n§GПодсказка дизайнера: механизированная пехота сочетает крепкую оборону и бронированную подвижность с хорошими показателями на равнинах и в пустынях. Применяйте её для удержания рубежей в быстрых бронетанковых соединениях, но помните: БТР дороги, а атака и подвижность падают в лесах, горах, джунглях и городах.§!"
 Arm_Inf_Bat: "Бронированная пехота"
 Arm_Inf_Bat_desc: "Рота бронированной пехоты использует в качестве транспорта боевые машины пехоты. Она хорошо подходит для бронетанкового боя на равнине, но пропадает зря на трудной местности, где ей приходится действовать пешком вдали от своих БМП.\n\n§GПодсказка дизайнера: бронированная пехота на БМП превосходит механизированную по огневой мощи, броне и прорыву. Применяйте её вместе с танками на открытой местности, но помните: более низкая организация, дорогое снаряжение и тяжёлые штрафы в горах, джунглях, болотах и городах требуют осторожности.§!"
 L_Air_Inf_Bat: "Воздушно-десантная пехота"
 L_Air_Inf_Bat_desc: "Рота лёгкой воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах или переброске вертолётами. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Однако способ переброски жёстко ограничивает количество тяжёлого вооружения, которое они могут взять с собой.\n\n§GПодсказка дизайнера: воздушно-десантная пехота сочетает высокую организацию с возможностью десантирования и хорошими показателями на трудной местности. Применяйте её для захвата и удержания изолированных объектов, но помните: подготовка как у сил специального назначения и повышенный расход пехотного снаряжения делают её дорогой для рутинного линейного боя.§!"
 Mot_Air_Inf_Bat: "Моторизованная воздушно-десантная пехота"
 Mot_Air_Inf_Bat_desc: "Рота моторизованной воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах или переброске вертолётами. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Вспомогательные машины дают им отличную подвижность сразу после высадки и позволяют взять в бой больше тяжёлого вооружения. Однако десантировать их вместе с машинами намного тяжелее в смысле снабжения.\n\n§GПодсказка дизайнера: моторизованная воздушно-десантная пехота добавляет скорость после высадки и хорошо действует на открытой местности. Применяйте её, когда десанту нужно быстро развить успех или усилиться, но помните: машины увеличивают потребность в снаряжении и снижают организацию и показатели на пересечённой местности по сравнению с пешим десантом.§!"
 Mech_Air_Inf_Bat: "Механизированная воздушно-десантная пехота"
 Mech_Air_Inf_Bat_desc: "Рота механизированной воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Специально созданные лёгкие бронетранспортёры дают им отличную подвижность сразу после высадки и позволяют брать в бой гораздо больше тяжёлого вооружения, чем более лёгким десантным частям. Однако десантировать их вместе с такими машинами намного тяжелее в смысле снабжения.\n\n§GПодсказка дизайнера: механизированная воздушно-десантная пехота приносит на парашютах защиту БТР, скорость и более тяжёлую огневую мощь. Применяйте её, когда отрезанному десанту нужно выжить в подвижном бою после высадки, но помните: более низкая организация, большая потребность в снаряжении и тяжёлые штрафы на пересечённой местности делают её дорогим узкоспециальным выбором.§!"
 Arm_Air_Inf_Bat: "Бронированная воздушно-десантная пехота"
 Arm_Air_Inf_Bat_desc: "Рота бронированной воздушно-десантной пехоты — элитные бойцы, специально обученные высадке с транспортных самолётов на парашютах. Они способны быстро реагировать на угрозы за тысячи километров и высаживаться в тылу противника, чтобы захватить ключевые объекты до подхода основных сил. Специально созданные лёгкие боевые машины пехоты дают им отличную подвижность и позволяют на равных драться с обычными механизированными соединениями. Однако десантировать их вместе с БМП крайне тяжело в смысле снабжения: по состоянию на 2017 год такими силами располагала только Россия.\n\n§GПодсказка дизайнера: бронированная воздушно-десантная пехота доставляет по воздуху огневую мощь БМП, броню и прорыв. Применяйте её, чтобы оспаривать защищённые объекты или драться с подвижными резервами противника после высадки, но помните: очень высокая потребность в снаряжении, низкая организация и штрафы на трудной местности делают потери дорогими.§!"
 L_Marine_Bat: "Морская пехота"
 L_Marine_Bat_desc: "Рота морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Поскольку техники у них нет, количество тяжёлого вооружения, которое они могут взять с собой, жёстко ограничено.\n\n§GПодсказка дизайнера: морская пехота даёт высокую организацию и хорошие показатели при высадке и на болотах, не требуя расходов на технику. Применяйте её для создания плацдармов и боёв в заболоченной местности, но помните: после высадки она медлительна, занимает место в лимите сил специального назначения и менее эффективна на открытой местности.§!"
 Mot_Marine_Bat: "Моторизованная морская пехота"
 Mot_Marine_Bat_desc: "Рота моторизованной морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Высаживаются они как лёгкая пехота, но на суше располагают вспомогательными машинами, что даёт отличную подвижность и позволяет брать в бой много тяжёлого вооружения.\n\n§GПодсказка дизайнера: моторизованная морская пехота сохраняет сильный бонус при высадке и добавляет скорость для быстрого расширения плацдарма. Применяйте её, когда десанту нужно стремительно продвигаться вглубь, но помните: машины требуют больше снаряжения и снижают организацию и показатели в горах по сравнению с пешей морской пехотой.§!"
 Mech_Marine_Bat: "Механизированная морская пехота"
 Mech_Marine_Bat_desc: "Рота механизированной морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Поскольку они высаживаются под защитой специально созданных плавающих бронетранспортёров, они полностью готовы бить сразу и с большой подвижностью, принося в бой много тяжёлого вооружения.\n\n§GПодсказка дизайнера: механизированная морская пехота сочетает бонус при высадке с защитой БТР и высокой подвижностью после выхода на берег. Применяйте её для расширения и удержания механизированных плацдармов, но помните: организации у неё меньше, чем у более лёгкой морской пехоты, а её машины плохо показывают себя в лесах и горах.§!"
 Arm_Marine_Bat: "Бронированная морская пехота"
 Arm_Marine_Bat_desc: "Рота бронированной морской пехоты — элитные бойцы, специально обученные действиям на воде: форсированию рек, боям на болотах и морским десантам. Они способны преодолевать большие расстояния по воде на своих тяжелобронированных БМП с водомётным движителем и, выйдя на берег, тут же умело вести бой из тех же машин.\n\n§GПодсказка дизайнера: бронированная морская пехота даёт самую высокую среди морской пехоты огневую мощь БМП, броню и способность к городскому бою, сохраняя при этом бонус к высадке. Применяйте её против хорошо защищённых портов, но помните: низкая организация, высокая стоимость и тяжёлые штрафы в горах и джунглях требуют более лёгких войск для сложной местности в глубине суши.§!"
 L_Air_assault_Bat: "ВДВ"
 L_Air_assault_Bat_desc: "Рота десантно-штурмовой пехоты — элитные бойцы, обученные спуску по канату и переброске по воздуху; их снаряжение порой специально создаётся или дорабатывается в войсках, чтобы лучше помещаться в летательные аппараты. Их часто используют, чтобы захватить и удержать ключевые участки местности, ещё не взятые под полный контроль, и чтобы напрямую драться с противником в его тылу.\n\n§GПодсказка дизайнера: десантно-штурмовая пехота использует транспортные вертолёты для стремительных действий и получает боевые бонусы почти на всей трудной местности. Применяйте её для захвата удалённых холмов, лесов, гор, джунглей, болот и городов, но помните: низкая прочность, слабое окапывание и дорогие вертолёты делают затяжной линейный бой рискованным.§!"
 attack_helo_bat: "Эскадрилья ударных вертолётов"
 attack_helo_bat_desc: "Эскадрильи ударных вертолётов собирают винтокрылые боевые машины в кулак для быстрых противотанковых ударов и непосредственной поддержки на широком фронте.\n\n§GПодсказка дизайнера: ударные вертолёты дают быструю бронированную огневую мощь и сильные атаки на равнинах и в пустынях. Применяйте их для развития прорывов или охоты за бронетехникой на открытой местности, но помните: крайне низкая организация и прочность, дорогие машины и слабые показатели в городах, горах, лесах и джунглях делают затяжной бой опасным.§!"
 attack_helo_comp: "Звено ударных вертолётов"
 attack_helo_comp_desc: "Звено ударных вертолётов обеспечивает передовым соединениям быструю поддержку боевыми вертолётами и подвижную противотанковую огневую мощь.\n\n§GПодсказка дизайнера: звено ударных вертолётов добавляет быструю бронированную огневую мощь, не занимая ширины фронта. Применяйте его как гибкую поддержку пехотных, подвижных, бронетанковых или морских дивизий, но помните: машины и командное снаряжение дороги, а в городах и джунглях звено атакует хуже.§!"
 Special_Forces: "Силы специального назначения"
 Special_Forces_desc: "Силы специальных операций — элита любой армии, где они есть: их подготовка дольше и тяжелее, чем у кого бы то ни было. Они мастера трудной местности, воздушно-десантных операций и морских десантов. Однако вооружены они очень легко, поскольку им приходится подвижно действовать в тылу противника.\n\n§GПодсказка дизайнера: силы специальных операций дают исключительные организацию и восстановление, широкие бонусы по местности, возможность десантирования и эвакуации с побережья. Применяйте их для самых тяжёлых рейдов и спорных объектов, но помните: большая ширина фронта, очень долгая подготовка, лимит сил специального назначения и лёгкое вооружение делают их непригодными в роли обычной линейной пехоты.§!"
 armor_Bat: "Танковая рота"
 armor_Bat_desc: "Рота танков состоит исключительно из самых защищённых машин, какие только существуют, — основных боевых танков. Обладая прекрасной подвижностью на равнине и мощным огнём прямой наводкой, они предназначены пробивать бреши в передовых рубежах противника, которые затем быстро развивает идущая следом механизированная пехота.\n\n§GПодсказка дизайнера: танки дают высокую броню, прорыв и огневую мощь против бронетехники, а также отличные бонусы на равнинах и в пустынях. Применяйте их как остриё наступательных дивизий, но помните: они расходуют дорогие танки и командное снаряжение, имеют низкую организацию и получают серьёзные штрафы в лесах, горах, джунглях, на болотах и в городах.§!"
 armor_Comp: "Танковый взвод"
 armor_Comp_desc: "Танковый взвод состоит исключительно из самых защищённых машин, какие только существуют, — основных боевых танков. Обладая прекрасной подвижностью на равнине и мощным огнём прямой наводкой, они предназначены пробивать бреши в передовых рубежах противника, которые затем быстро развивает идущая следом механизированная пехота.\n\n§GПодсказка дизайнера: танковый взвод добавляет броню, прорыв и подвижную огневую мощь, не занимая ширины фронта. Применяйте его, чтобы усилить подходящие пехотные или подвижные соединения для боя на открытой местности, но помните: танки и командное снаряжение дороги, а в горах, джунглях и на болотах взвод замедляется и плохо атакует.§!"
 L_Recce_Comp: "Пехотный разведывательный взвод"
 L_Recce_Comp_desc: "Пехотные разведывательные роты действуют пешком и потому лишены значительной части тяжёлого вооружения, которое сделало бы их полноценной боевой единицей. Они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они способны и на ограниченные налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: пехотная разведка добавляет разведку и инициативу, не занимая ширины фронта, и сохраняет небольшие бонусы в лесах, горах, джунглях и на холмах. Применяйте её в пеших, воздушно-десантных, аэромобильных, морских дивизиях и в соединениях специального назначения, но помните: живой силы она требует больше других разведподразделений, а огневой мощи почти не даёт.§!"
 Mot_Recce_Comp: "Моторизованный разведывательный взвод"
 Mot_Recce_Comp_desc: "Моторизованные разведывательные роты действуют на вспомогательных машинах и располагают почти тем же снаряжением, что и пехотные. Но задачи у них иные: они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они способны и на ограниченные налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: моторизованная разведка даёт больше разведки и инициативы, чем пешие разведчики, поспевает за подвижными соединениями и улучшает подвижность на открытой местности. Применяйте её в моторизованных или морских дивизиях, но помните: вспомогательные машины повышают стоимость, а в горах, джунглях и на болотах она замедляется.§!"
 Mech_Recce_Comp: "Механизированный разведывательный взвод"
 Mech_Recce_Comp_desc: "Механизированные разведывательные роты действуют на бронетранспортёрах и располагают почти тем же снаряжением, что и пехотные. Но задачи у них иные: они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они способны и на ограниченные налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: механизированная разведка даёт высокую разведку и инициативу, не занимая ширины фронта, поспевает за соединениями на БТР и улучшает подвижность на равнинах. Применяйте её в бронетанковых или морских дивизиях, но помните: БТР и вспомогательное снаряжение обходятся дорого, а в горах и на болотах она замедляется.§!"
 Arm_Recce_Comp: "Взвод тяжёлой механизированной разведки"
 Arm_Recce_Comp_desc: "Роты тяжёлой механизированной разведки действуют на боевых машинах пехоты и располагают почти тем же снаряжением, что и бронированная пехота. Но задачи у них иные: они скрытно подбираются к противнику, наблюдают за ним и докладывают о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Они также совершают налёты и засады. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: тяжёлая механизированная разведка даёт высокую разведку и инициативу под защитой БМП и не занимает ширины фронта. Применяйте её в бронетанковых или морских дивизиях, действующих на равнинах и в пустынях, но помните: БМП дороги, а подвижность падает в лесах, горах, джунглях и на болотах.§!"
 L_arm_Bat: "Рота лёгких танков"
 L_arm_Bat_desc: "Рота лёгких танков действует на особых, часто колёсных, лёгких танках, которые сочетают невероятную подвижность с внушительной огневой мощью. Она способна на равных драться с любой пехотой в прямом бою, хотя прямой бой — не её задача: она скрытно подбирается к противнику, наблюдает за ним и докладывает о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Она также совершает налёты и засады на важные объекты и механизированные соединения противника.\n\n§GПодсказка дизайнера: лёгкие танки дают быструю бронированную огневую мощь и сильные атаки на равнинах и в пустынях. Применяйте их для разведки боем и развития успеха, но помните: защита и мощь в прямом бою у них скромнее, а на пересечённой местности эффективность резко падает.§!"
 armor_Recce_Comp: "Бронированный разведывательный взвод"
 armor_Recce_Comp_desc: "Бронированный разведывательный взвод действует на особых разведывательных лёгких танках, которые сочетают невероятную подвижность с внушительной огневой мощью. Он способен на равных драться с любой пехотой в прямом бою, хотя прямой бой — не его задача: он скрытно подбирается к противнику, наблюдает за ним и докладывает о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Он также совершает налёты и засады на важные объекты и механизированные соединения противника. Разведывательные роты часто называют «эскадронами» — в память об их кавалерийском прошлом.\n\n§GПодсказка дизайнера: бронированная разведка даёт самые высокие среди обычных разведчиков разведку и инициативу, добавляя противотанковую подвижность и не занимая ширины фронта. Применяйте её в танковых соединениях на открытой местности, но помните: разведывательные танки и командное снаряжение дороги, а подвижность резко падает в лесах, горах, джунглях и на болотах.§!"
 L_Engi_Comp: "Сапёрная рота"
 L_Engi_Comp_desc: "Сапёры наводят временные мосты и возводят оборонительные рубежи, ставят и снимают мины, а также обезвреживают боеприпасы. Для самообороны они несут обычное пехотное оружие.\n\n§GПодсказка дизайнера: сапёрные роты улучшают окапывание, помогают пехоте атаковать и обороняться в укреплениях, городах, лесах и на болотах, а также повышают защиту и подвижность в горах. Применяйте их в оборонительных дивизиях или на пересечённой местности, но помните: они занимают ширину фронта, требуют живой силы и снаряжения и почти не дают прямой огневой мощи.§!"
 H_Engi_Comp: "Тяжёлая сапёрная рота"
 H_Engi_Comp_desc: "Сапёры наводят временные мосты и возводят оборонительные рубежи, ставят и снимают мины, а также обезвреживают боеприпасы. Для самообороны они несут обычное пехотное оружие. Располагая специальными инженерными и эвакуационными машинами, они хорошо приспособлены для вывода с передовой выбывшей из боя техники.\n\n§GПодсказка дизайнера: тяжёлые сапёрные роты дают большее окапывание и более сильные бонусы в укреплениях, городах, горах и на болотах, чем обычные сапёры. Применяйте их в ценных штурмовых или оборонительных соединениях, но помните: высокие требования к живой силе и снаряжению делают их дорогим выбором.§!"
 Arty_Bat: "Артиллерийская батарея"
 Arty_Bat_desc: "Благодаря мощному огню с закрытых позиций артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам. Поскольку для передвижения ей нужны тягачи, между ударами её бывает трудно перемещать, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы малого калибра можно перекатывать вручную, и они пригодны для воздушно-десантных операций, так как помещаются в транспортные самолёты.\n\n§GПодсказка дизайнера: артиллерийская батарея заметно повышает атаку по пехоте и может десантироваться на парашютах, что делает её эффективной против войск с большой долей пехоты. Применяйте её, чтобы дать пешим соединениям наступательную огневую мощь, но помните: низкая организация и прочность, занимаемая ширина фронта и штрафы к подвижности на пересечённой местности требуют достаточного пехотного прикрытия.§!"
 Arty_Battery: "Артиллерийский взвод"
 Arty_Battery_desc: "Благодаря мощному огню с закрытых позиций артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам. Поскольку для передвижения ей нужны тягачи, между ударами её бывает трудно перемещать, что делает её уязвимой для контрбатарейного огня противника. Лёгкие системы малого калибра можно перекатывать вручную, и они пригодны для воздушно-десантных операций, так как помещаются в транспортные самолёты.\n\n§GПодсказка дизайнера: артиллерийский взвод добавляет атаку по пехоте, не занимая ширины фронта, и обходится гораздо дешевле полноценной батареи. Применяйте его как экономную огневую поддержку подходящих пеших соединений, но помните: крайне низкая организация и штрафы на пересечённой местности ограничивают его пользу в дивизиях без прикрытия или в высокоподвижных.§!"
 SP_Arty_Bat: "Батарея самоходной артиллерии"
 SP_Arty_Bat_desc: "Благодаря мощному огню с закрытых позиций самоходная артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам, а собственный ход позволяет уходить из-под контрбатарейного огня противника.\n\n§GПодсказка дизайнера: батарея самоходной артиллерии добавляет тяжёлую атаку по пехоте, поспевая за бронетанковыми соединениями, и превосходна на равнинах. Применяйте её для взлома рубежей с большой долей пехоты, но помните: низкая организация, занимаемая ширина фронта, дорогое шасси и штрафы на пересечённой местности требуют бронированного прикрытия и открытого пространства.§!"
 SP_Arty_Battery: "Взвод самоходной артиллерии"
 SP_Arty_Battery_desc: "Благодаря мощному огню с закрытых позиций самоходная артиллерия наносит непрерывные точные удары там, где это нужно на поле боя, причём далеко за пределами прямой видимости. Расчёт перезаряжает орудия сам, а собственный ход позволяет уходить из-под контрбатарейного огня противника.\n\n§GПодсказка дизайнера: взвод самоходной артиллерии добавляет подвижную атаку по пехоте, не занимая ширины фронта. Применяйте его как компактную огневую поддержку подвижных, бронетанковых, морских или ополченческих соединений, но помните: специальное шасси дороже буксируемых орудий и плохо проходит горы, джунгли и болота.§!"
 SP_R_Arty_Bat: "Батарея РСЗО"
 SP_R_Arty_Bat_desc: "Батарея реактивной артиллерии с установками залпового огня способна выжечь целый район с большого расстояния. Применяется против тылов противника, поскольку неизбирательный огонь не годится для точечных ударов на поле боя. Ей нужны особые транспортно-заряжающие машины, а перезарядка идёт медленно.\n\n§GПодсказка дизайнера: батарея РСЗО даёт очень высокие атаку по пехоте и прорыв, поспевая за подвижными соединениями на открытой местности. Применяйте её как сосредоточенную наступательную огневую мощь, но помните: низкая организация, занимаемая ширина фронта, дорогие пусковые машины и трудности в горах, джунглях, на болотах и в городах.§!"
 SP_R_Arty_Battery: "Взвод РСЗО"
 SP_R_Arty_Battery_desc: "Взвод реактивной артиллерии с установками залпового огня способен выжигать районы с большого расстояния. Применяется против тылов противника, поскольку неизбирательный огонь не годится для точечных ударов на поле боя. Ему нужны особые транспортно-заряжающие машины, а перезарядка идёт медленно.\n\n§GПодсказка дизайнера: взвод РСЗО добавляет сильную подвижную атаку по пехоте и некоторый прорыв, не занимая ширины фронта. Применяйте его как компактную наступательную поддержку в подвижных или бронетанковых дивизиях, но помните: пусковые машины дороги, живучесть у них слабая, а в горах и на болотах подвижность падает.§!"
 SP_AA_Bat: "Самоходная зенитная батарея"
 SP_AA_Bat_desc: "Используя самоходные зенитные ракетные комплексы малой и средней дальности, зенитная батарея прикрывает своё подразделение от ударов авиации непосредственной поддержки противника.\n\n§GПодсказка дизайнера: самоходная ПВО даёт высокую атаку по авиации и подвижное прикрытие бронетанковым соединениям. Применяйте её, когда авиация противника угрожает ценным ударным группировкам, но помните: она занимает ширину фронта, требует специальных машин, почти не добавляет наземной огневой мощи и плохо движется в горах, джунглях и на болотах.§!"
 SP_AA_Battery: "Самоходный зенитный взвод"
 SP_AA_Battery_desc: "Используя самоходные зенитные ракетные комплексы малой и средней дальности, зенитный взвод прикрывает своё подразделение от ударов авиации непосредственной поддержки противника.\n\n§GПодсказка дизайнера: взвод самоходной ПВО добавляет подвижную атаку по авиации, не занимая ширины фронта. Применяйте его для прикрытия подвижных, бронетанковых или морских дивизий под вражеским небом, но помните: его специальное шасси почти бесполезно против наземных сил и хуже движется в горах и на болотах.§!"
 combat_service_support_company: "Батальон боевого обеспечения"
 combat_service_support_company_desc: "Тыловой и медицинский состав дивизии организует подвоз снабжения, эвакуацию раненых и поступление пополнений.\n\n§GПодсказка дизайнера: тыловое обеспечение снижает расход снабжения и топлива, сберегая живую силу и боевой опыт части за счёт возвращения раненых в строй. Применяйте его в крупных, опытных или прожорливых по снабжению дивизиях, но помните: оно занимает ширину фронта, требует снаряжения и резко снижает прямые боевые показатели.§!"
 helicopter_combat_service_support: "Вертолётная эскадрилья тылового обеспечения"
 helicopter_combat_service_support_desc: "Перебрасываемые вертолётами тыловые и медицинские группы обеспечивают быстро развёрнутые войска и эвакуируют раненых с передовых позиций.\n\n§GПодсказка дизайнера: вертолётное тыловое обеспечение возвращает в строй больше раненых и сильнее экономит снабжение и топливо, требуя меньше живой силы, чем наземное. Применяйте его в дорогих аэромобильных или быстрых соединениях, но помните: транспортные вертолёты дороги, оно занимает ширину фронта, а вклад в бой минимален.§!"
 L_Marine_Cdo_Bat: "Морские коммандос"
 L_Marine_Cdo_Bat_desc: "Рота морских коммандос — более крупные формирования морских рейдеров, обученные налётам с немедленным отходом и прочим задачам лёгкой пехоты.\n\n§GПодсказка дизайнера: морские коммандос сочетают высокую организацию с отличными атаками при высадке, на болотах, в лесах и городах. Применяйте их для элитных рейдов и высадок на обороняемое побережье, но помните: лимит сил специального назначения, долгая подготовка, лёгкое вооружение и слабые атаки на открытой местности не дают применять их массово.§!"
 air_assault_Arty_Battery: "Аэромобильный артиллерийский взвод"
 air_assault_Arty_Battery_desc: "Эти подразделения используют буксируемые орудия и повышают свою подвижность, перевозя их на внешней подвеске вертолётов, что позволяет им поспевать за более быстрой аэромобильной пехотой.\n\n§GПодсказка дизайнера: аэромобильный артиллерийский взвод добавляет атаку по пехоте, не занимая ширины фронта, и лучше всего действует на холмах, в горах, лесах, джунглях и городах. Применяйте его как компактную огневую поддержку аэромобильных или морских соединений, но учтите, что потребность в вертолётах и орудиях обходится дорого, а на равнинах и в пустынях он слабее.§!"
 drone_tactical_company: "Взвод FPV-беспилотников"
 drone_tactical_company_desc: "Используя FPV-беспилотники самолётного типа и квадрокоптеры, эти подразделения ведут разведку и наносят точечные удары в интересах линейных частей.\n\n§GПодсказка дизайнера: рота FPV-беспилотников добавляет эффективную атаку по пехоте и по бронетехнике, не занимая ширины фронта, и может десантироваться на парашютах. Применяйте её как гибкую огневую поддержку в дивизиях, способных снабжать наземные беспилотники, но помните: организации у неё почти нет, а на скромную живучесть уходит немало дронов.§!"
 group_headquarters_title: "Штаб"
 arm_inf_hq: "Штаб бронетанковой пехоты"
 arm_inf_hq_desc: "Штабной элемент механизированной и бронетанковой пехоты."
 arm_hq: "Бронетанковый штаб"
 arm_hq_desc: "Штабное подразделение для лёгких и основных боевых танков"
 L_Ranger_Bat: "Рейнджеры"
 L_Ranger_Recce_Comp: "Разведывательный взвод рейнджеров"
 group_headquarters_title_desc: "Штабные подразделения, оснащенные для ведения подразделений в бой"
 light_inf_hq: "Штаб легкой пехоты"
 light_inf_hq_desc: "Штабное подразделение легкой и моторизованной пехоты"
 helo_hq: "Штаб - квартира вертолета"
 helo_hq_desc: "Элемент штаб-квартиры для вертолетных подразделений"
 group_light_bat_title: "Единицы измерения недостаточной прочности"
 group_light_bat_title_desc: "Недостаточно мощные боевые элементы, предназначенные для умножения силы, с уменьшенными возможностями, но сокращенными временем и затратами на обучение."
 Light_Mech_Inf_Bat: "Недоукомплектованный мехбатальон"
 Light_Mech_Inf_Bat_desc: "Сокращённое механизированное подразделение использует небольшое количество бронетранспортёров для усиления соединения, не занимая обычной ширины фронта.\n\n§GПодсказка дизайнера: сокращённая механизированная пехота добавляет защиту БТР и оборону, не занимая ширины фронта. Применяйте её для усиления подходящих соединений на равнинах, холмах и в городах, но помните: стоимость машин, низкая прочность и тяжёлые штрафы в горах, джунглях, на болотах, реках и при высадке ограничивают её самостоятельную боевую ценность.§!"
 Light_Arm_Inf_Bat: "Недостаточно укомплектованный бронетанковый пехотный батальон"
 Light_Arm_Inf_Bat_desc: "Сокращённое подразделение бронированной пехоты использует небольшое количество боевых машин пехоты, добавляя защищённую огневую мощь и не занимая обычной ширины фронта.\n\n§GПодсказка дизайнера: сокращённая бронированная пехота добавляет броню и огневую мощь БМП, не занимая ширины фронта, и лучше всего действует на равнинах и в пустынях. Применяйте её для усиления ценных соединений, но помните: низкая организация, дорогие машины и крайне тяжёлые штрафы на пересечённой местности, реках и при высадке делают её узкоспециальной.§!"
 Light_L_Air_assault_Bat: "Недоукомплектованный воздушно-десантный пехотный батальон"
 Light_L_Air_assault_Bat_desc: "Десантно-штурмовая пехота — элитные бойцы, обученные спуску по канату и переброске по воздуху; их снаряжение порой специально создаётся или дорабатывается в войсках, чтобы лучше помещаться в летательные аппараты. Их часто используют, чтобы захватить и удержать ключевые участки местности, ещё не взятые под полный контроль, и чтобы напрямую драться с противником в его тылу.\n\n§GПодсказка дизайнера: это сокращённое десантно-штурмовое подразделение добавляет организацию и мощные бонусы в городах, горах, лесах, джунглях и на болотах, не занимая ширины фронта. Применяйте его для усиления специализированных соединений на трудной местности, но помните: потребность в вертолётах обходится дорого, а на равнинах, в пустынях и при высадке подразделение слабо.§!"
 Light_attack_helo_bat: "Недоукомплектованный ударный полк"
 Light_attack_helo_bat_desc: "Небольшое подразделение ударных вертолётов обеспечивает быструю поддержку боевыми вертолётами без разворачивания целого полка.\n\n§GПодсказка дизайнера: сокращённые ударные вертолёты добавляют быструю бронированную огневую мощь, не занимая ширины фронта, и превосходно действуют на равнинах и в пустынях. Применяйте их как компактную подвижную поддержку, но помните: крайне низкая организация и прочность, дорогие машины и тяжёлые штрафы в горах, джунглях, на болотах и в городах делают потери труднопереносимыми.§!"
 Light_armor_Bat: "Недоукомплектованный танковый батальон"
 Light_armor_Bat_desc: "Сокращённое танковое подразделение собирает ограниченное число основных боевых танков для усиления соединения, не занимая обычной ширины фронта.\n\n§GПодсказка дизайнера: сокращённые танки добавляют броню, прорыв и сильные атаки на равнинах и в пустынях, не занимая ширины фронта. Применяйте их для экономного усиления наступательных соединений, но помните: низкая организация и прочность, стоимость танков и крайне тяжёлые штрафы на пересечённой местности и в городах делают их плохой универсальной поддержкой.§!"
 Light_L_arm_Bat: "Недоукомплектованный легкотанковый батальон"
 Light_L_arm_Bat_desc: "Сокращённое подразделение лёгких танков даёт подвижную противотанковую огневую мощь и возможность разведки боем при меньшем количестве машин.\n\n§GПодсказка дизайнера: сокращённые лёгкие танки добавляют подвижную противотанковую огневую мощь, не занимая ширины фронта, и превосходно действуют на равнинах и в пустынях. Применяйте их для усиления быстрых соединений против техники, но помните: низкая прочность, специальное шасси и тяжёлые штрафы на пересечённой местности, реках и при высадке ограничивают их гибкость.§!"
 Light_SP_Arty_Bat: "Недоукомплектованный самоходно-артиллерийский дивизион"
 Light_SP_Arty_Bat_desc: "Сокращённое подразделение самоходной артиллерии ведёт подвижный огонь с закрытых позиций, обходясь меньшим числом машин, чем полный батальон.\n\n§GПодсказка дизайнера: сокращённая самоходная артиллерия добавляет подвижную атаку по пехоте, не занимая ширины фронта, и особенно хороша на равнинах, в пустынях и городах. Применяйте её как компактную наступательную поддержку, но помните: организации у неё почти нет, прочность низкая, специальное шасси дорого, а в лесах, горах и джунглях показатели хуже.§!"
 Light_SP_R_Arty_Bat: "Недоукомплектованный самоходно-реактивный артиллерийский дивизион"
 Light_SP_R_Arty_Bat_desc: "Сокращённое подразделение реактивной артиллерии ведёт сосредоточенный огонь по площадям, обходясь меньшим числом машин, чем полный батальон.\n\n§GПодсказка дизайнера: сокращённая реактивная артиллерия добавляет мощную подвижную атаку по пехоте, не занимая ширины фронта, и превосходна на равнинах, в пустынях и городах. Применяйте её для усиления наступательных соединений, но помните: ничтожная организация, низкая прочность, стоимость пусковых машин и штрафы на пересечённой местности требуют прикрытия.§!"
 Light_SP_AA_Bat: "Недоукомплектованный самоходный батальон ПВО"
 Light_SP_AA_Bat_desc: "Сокращённое подразделение самоходной ПВО прикрывает соединение небольшим количеством подвижных зенитных комплексов.\n\n§GПодсказка дизайнера: сокращённая самоходная ПВО добавляет атаку по авиации, не занимая ширины фронта и почти не требуя живой силы. Применяйте её для компактного прикрытия подвижных соединений под вражеской авиацией, но помните: организации у неё почти нет, прочность низкая, а специальные зенитные машины почти не добавляют наземной огневой мощи.§!"
 Drone_Recce_Comp: "Взвод беспилотной разведки"
 Drone_Recce_Comp_desc: "Применяя малые беспилотники для наблюдения за пределами прямой видимости, взвод беспилотной разведки улучшает понимание обстановки, не подставляя разведчиков под огонь. Эти аппараты быстро просматривают маршруты, вскрывают позиции противника и подтверждают цели на сложной местности, ускоряя принятие решений и повышая точность огня.\n\n§GПодсказка дизайнера: беспилотная разведка даёт высокую разведку и инициативу, усиливает другие разведывательные подразделения и повышает эффективность артиллерийского огня. Применяйте её в подвижных или бронетанковых дивизиях, которые могут позволить себе беспилотники, но помните: она занимает ширину фронта, увеличивает расход снабжения, снижает окапывание и плохо работает в городах и горах.§!"
 medium_walker_battalion: "Рота средних шагоходов"
 medium_walker_battalion_desc: "Задуманная как универсальная основа шагающих соединений, рота средних шагоходов сочетает сбалансированные защиту, подвижность и грузоподъёмность для прямого боя.\n\n§GПодсказка дизайнера: средние шагоходы дают гибкую бронированную мощь на передовой, зависящую от установленного шагающего шасси. Применяйте их как универсальное ядро шагающих соединений, но помните: большая ширина фронта, низкая организация, долгая подготовка и потребность в большом количестве шасси делают их дорогими в развёртывании и восполнении.§!"
 light_walker_tank_battalion: "Рота лёгких шагоходов"
 light_walker_tank_battalion_desc: "Построенная вокруг противотанковых шагающих шасси, рота лёгких шагоходов нацелена на охоту за защищёнными целями и использование прорывов, а не на затяжной линейный бой.\n\n§GПодсказка дизайнера: лёгкие шагоходы специализируются на бронированных целях за счёт шасси шагающих истребителей танков. Применяйте их, когда вражеская бронетехника требует сосредоточенной бронепробиваемости и атаки по бронетехнике, но помните: большая ширина фронта, низкая организация, долгая подготовка и дорогое специальное шасси делают их неэффективными против пехоты.§!"
 heavy_walker_tank_battalion: "Рота тяжёлых шагоходов"
 heavy_walker_tank_battalion_desc: "Роты тяжёлых шагоходов несут артиллерийское вооружение на огромных шагающих платформах, обеспечивая защищённую огневую поддержку в боевых порядках основного соединения.\n\n§GПодсказка дизайнера: тяжёлые шагоходы дают бронированную артиллерийскую огневую мощь на шагающем артиллерийском шасси. Применяйте их как мощную поддержку против пехоты и укреплённых рубежей, но помните: большая ширина фронта, низкая организация, долгая подготовка и дорогое специальное шасси требуют хорошо обеспеченного соединения.§!"
 space_artillery_support_company: "Батарея космической артиллерийской поддержки"
 space_artillery_support_company_desc: "Применяя артиллерийские снаряды, выпускаемые с орбитальных платформ, батарея космической артиллерийской поддержки наносит из космоса точные удары по целям на поле боя далеко за пределами досягаемости обычных систем. Такие удары способны быстро подавить укреплённые позиции, уничтожить особо важные объекты и рассеять скопления противника почти без предупреждения.\n\n§GПодсказка дизайнера: космическая артиллерия удваивает вклад артиллерийских батарей в атаку, не занимая ширины фронта, и может десантироваться на парашютах. Применяйте её для усиления соединений с большим количеством артиллерии, но помните: редкое оборудование управления орбитальными средствами, долгая подготовка и слабые собственные боевые показатели делают её бесполезной в дивизиях почти без артиллерии.§!"
 space_artillery_equipment_type: "Орбитальный ретранслятор управления огнём"
 space_artillery_equipment_type_desc: "Упрочнённый ретранслятор связи и целеуказания, предназначенный для запроса, координации и подтверждения орбитальных артиллерийских ударов в реальном времени. Он связывает наблюдателей на передовой с орбитальными батареями, обеспечивая быстрые огневые миссии, точное время срабатывания и надёжное предотвращение конфликтов с дружественными силами. Система дорогостоящая и ресурсоёмкая, но без неё орбитальная артиллерия остаётся слепой, медленной и опасно неэффективной."
 space_artillery_equipment_1: "$space_artillery_equipment_type$ I"
 space_artillery_equipment_1_desc: "$space_artillery_equipment_type_desc$"
 HACS_Mech: "Система высокоманёвренного боя 1-го поколения"
 HACS_Mech_desc: "Высокоманёвренный боевой комплекс первого поколения сочетает передовую броню, вооружение и подвижность в платформе, перебрасываемой по воздуху.\n\n§GПодсказка дизайнера: ВБК первого поколения даёт очень высокую организацию и прочность, всестороннюю огневую мощь и возможность десантирования, а также сильные бонусы на холмах и равнинах. Применяйте его как элитное бронированное остриё, но помните: большая ширина фронта, очень долгая подготовка, редкое снаряжение и штрафы в лесах и джунглях делают небрежные потери тяжёлыми.§!"
 HACS_Mech_2: "Система высокоманёвренного боя 2-го поколения"
 HACS_Mech_2_desc: "Высокоманёвренный боевой комплекс второго поколения улучшает защиту, вооружение и живучесть в бою, сохраняя гибкость стратегической переброски.\n\n§GПодсказка дизайнера: ВБК второго поколения повышает организацию, прочность и прорыв, сохраняя десантирование и эвакуацию с побережья. Применяйте его для элитных атак на холмах, равнинах, в пустынях и на болотах, но помните: большая ширина фронта, редкое снаряжение, долгая подготовка и сохраняющийся штраф в джунглях требуют избирательности.§!"
 HACS_Mech_3: "Система высокоманёвренного боя 3-го поколения"
 HACS_Mech_3_desc: "Высокоманёвренный боевой комплекс третьего поколения сочетает передовую защиту, модульное вооружение и исключительную живучесть в бою.\n\n§GПодсказка дизайнера: ВБК третьего поколения даёт исключительные организацию, прочность и окапывание, широкую огневую мощь, возможность десантирования и сильные бонусы по местности. Применяйте его для самых тяжёлых бронетанковых операций, но помните: большая ширина фронта, долгая подготовка и незаменимое передовое снаряжение по-прежнему наказывают за потери.§!"
 ALN_bellatoris: "Беллаторис"
 ALN_bellatoris_desc: "Беллаторис — передовой боец роя химер, выведенный для непрерывного ближнего штурма. Быстрый и агрессивный, он подавляет оборонительные рубежи одной лишь численностью и яростью.\n\n§GПодсказка дизайнера: беллаторисы сочетают очень высокую организацию и прочность со сбалансированными атаками, защитой, прорывом и быстрым обучением. Применяйте их как универсальные линейные войска химер в лесах, на холмах, болотах, равнинах и в пустынях, но помните: атаки по авиации у них нет, а в горах и джунглях им приходится тяжело.§!"
 ALN_brachionis: "Бракионис"
 ALN_brachionis_desc: "Брахионис — многоконечная химера, созданная, чтобы захватывать и разрывать бронированные цели в ближнем бою.\n\n§GПодсказка дизайнера: брахионисы жертвуют частью защиты ради большей атаки по пехоте и по бронетехнике, сохраняя высокую организацию и быстрое обучение. Применяйте их как агрессивные штурмовые войска на открытой местности, но в горах и джунглях они по-прежнему слабее.§!"
 ALN_gravis: "Gravis"
 ALN_gravis_desc: "Гравис — самый тяжёлый штамм химер, бронированная громада, которая удерживает продвижение роя и силой взламывает укреплённые позиции.\n\n§GПодсказка дизайнера: грависы дают самые мощные среди химер атаки, прорыв и инициативу при высокой организации и быстром обучении. Применяйте их как ударную опору на открытой местности, но помните: они потребляют больше снабжения, уступают более лёгким штаммам в защите и организации и плохо чувствуют себя в горах и джунглях.§!"
 Hvy_Mot_Inf_Bat: "Тяжелая моторизованная пехота"
 Hvy_Mot_Inf_Bat_desc: "Рота тяжёлой моторизованной пехоты использует в качестве транспорта бронемашины с повышенной противоминной защитой (MRAP). Такие машины намного лучше защищают экипаж от мин, самодельных взрывных устройств и стрелкового огня, что делает их незаменимыми там, где высока угроза засад.\n\n§GПодсказка дизайнера: тяжёлая моторизованная пехота использует более защищённые машины для быстрых действий на передовой в равнинах и пустынях. Она требует больше снаряжения и уступает более лёгкой пехоте в организации и окапывании, по-прежнему получая заметные штрафы на пересечённой местности.§!"
 L_Ranger_Bat_desc: "Рейнджеры — элитная лёгкая пехота, приспособленная для налётов, прямых действий и стремительной переброски впереди основных сил. Они идут налегке ради подвижности и внезапности, захватывают ключевые объекты и удерживают их до подхода обычных частей. Плата за это — скудное тяжёлое вооружение, из-за чего они уязвимы перед бронетехникой на открытой местности.\n\n§GПодсказка дизайнера: рейнджеры сочетают высокую организацию и исключительные бонусы на трудной местности при малой ширине фронта. Применяйте их как элитные горные, лесные, джунглевые, болотные или городские соединения, но помните: долгая подготовка, лимит сил специального назначения и нехватка тяжёлого вооружения делают массовое применение дорогим и оставляют их беззащитными на равнине.§!"
 L_Ranger_Recce_Comp_desc: "Разведывательное подразделение из состава рейнджеров, обученное пешком проникать глубоко в тыл противника и докладывать о его перемещениях. Сочетая скрытность с беспилотной разведкой и радиоэлектронным наблюдением, оно собирает сведения и наводит на цели свой огонь, а при случае проводит ограниченные налёты и засады.\n\n§GПодсказка дизайнера: разведка рейнджеров добавляет разведку и инициативу, повышает атаку артиллерии по пехоте и хорошо дерётся на трудной местности. Применяйте её в соединениях специального назначения, которым нужна элитная разведка, но помните: она занимает ширину фронта, расходует лимит сил специального назначения и даёт мало прямой огневой мощи.§!"
 A_L_arm_Bat: "Рота воздушно-десантных лёгких танков"
 A_L_arm_Bat_desc: "Рота лёгких танков действует на особых, часто колёсных, лёгких танках, которые сочетают невероятную подвижность с внушительной огневой мощью. Она способна на равных драться с любой пехотой в прямом бою, хотя прямой бой — не её задача: она скрытно подбирается к противнику, наблюдает за ним и докладывает о его действиях, собирая сведения с помощью беспилотной разведки и радиоэлектронного наблюдения. Она также совершает налёты и засады на важные объекты и механизированные соединения противника. Эти подразделения способны участвовать в воздушно-десантных операциях вместе с парашютистами, немедленно обеспечивая им бронированную поддержку.\n\n§GПодсказка дизайнера: десантируемые лёгкие танки дают парашютным соединениям подвижную броню и противотанковую огневую мощь сразу после высадки. Применяйте их для поддержки десанта против мобильного противника на открытой местности, но помните: специализированные машины дороги и получают серьёзные штрафы в горах, джунглях, болотах и городах.§!"
 air_assault_Arty_Bat: "Аэромобильная артиллерийская батарея"
 air_assault_Arty_Bat_desc: "Полноценная батарея буксируемых орудий, перебрасываемая вертолётами на внешней подвеске. Обеспечивает непрерывную огневую поддержку аэромобильных операций, поспевая за десантно-штурмовой пехотой за счёт быстрой переброски по воздуху.\n\n§GПодсказка дизайнера: аэромобильная артиллерия заметно повышает атаку по пехоте у вертолётных соединений и хорошо показывает себя на холмах, в горах, лесах, джунглях и городах. Применяйте её для поддержки десантно-штурмовых войск на трудной местности, но помните: она занимает ширину фронта, имеет низкую организацию и прочность и требует дорогих транспортных вертолётов.§!"
 Weapons_company: "Оружейная рота"
 Weapons_company_desc: "Рота тяжёлого оружия, состоящая из средств огневой поддержки пехоты прямой наводкой: расчётов единых и крупнокалиберных пулемётов, автоматических гранатомётов и другого тяжёлого пехотного вооружения. Она предназначена обеспечивать огневую поддержку любому пехотному подразделению, которому придана, в самых разных войсках.\n\n§GПодсказка дизайнера: рота тяжёлого оружия добавляет широкий набор показателей огня прямой наводкой, особенно бронепробиваемость, не занимая ширины фронта. Применяйте её для усиления универсальной пехоты, но помните: заметная потребность в пехотном снаряжении и штраф к окапыванию делают её менее привлекательной для дешёвых статичных защитников.§!"
 Heavy_mortar_company: "Миномётная батарея"
 Heavy_mortar_company_desc: "Миномёты предназначены давать линейным частям быструю и собственную огневую поддержку, не запрашивая её у старших начальников. Они ведут огонь с закрытых позиций в интересах линейных подразделений и обходятся гораздо дешевле полноценной артиллерийской части.\n\n§GПодсказка дизайнера: миномётная батарея даёт сильную атаку по пехоте, не требуя артиллерийского снаряжения и не занимая ширины фронта. Применяйте её как дешёвую собственную огневую поддержку против пехоты, но помните: атаки по бронетехнике и бронепробиваемости она почти не даёт и снижает окапывание.§!"
 Sniper_company: "Снайперский взвод"
 Sniper_company_desc: "Укомплектованный меткими стрелками, работающими в парах с корректировщиками, снайперский взвод ведёт избирательный огонь на большой дальности по особо важным целям — офицерам, расчётам и связистам. Он превосходно изматывает и дезорганизует части противника из укрытий, снижая их боеспособность и при этом оставаясь труднообнаружимым.\n\n§GПодсказка дизайнера: снайперский взвод добавляет атаку по пехоте и разведку, повышает инициативу разведывательных подразделений и огневую мощь артиллерии. Применяйте его против пехоты и для лучшей слаженности на поле боя, но помните: он занимает ширину фронта и имеет очень слабые прорыв, атаку по бронетехнике и бронепробиваемость.§!"
 AT_company: "Пехотный противотанковый взвод"
 AT_company_desc: "Этот противотанковый взвод вооружён пехотными противотанковыми средствами и предназначен для работы именно с лёгкой пехотой. Легко действуя в городах, лесах и других укрытых или стеснённых местах, он способен без труда бить по бронетехнике противника и тут же уходить обратно в свои укрытия.\n\n§GПодсказка дизайнера: пехотные противотанковые средства дают высокую атаку по бронетехнике и бронепробиваемость, не занимая ширины фронта, для пеших, воздушно-десантных, морских и специальных соединений. Применяйте их, когда таким дивизиям нужно держать удар бронетехники, но помните: прочие боевые показатели при этом падают, а специальное снаряжение стоит денег.§!"
 Mot_AT_company: "Возимая противотанковая батарея"
 Mot_AT_company_desc: "Батарея, предназначенная для борьбы с танками и ведущая огонь с установленных на машинах позиций. Она рассчитана прежде всего на скорость, чтобы поспевать за быстро движущимися подвижными и бронетанковыми частями, сохраняя при этом усиленные противотанковые возможности.\n\n§GПодсказка дизайнера: возимые противотанковые средства дают высокую атаку по бронетехнике и бронепробиваемость, не замедляя подвижные соединения. Применяйте их в моторизованных, бронетанковых, воздушно-десантных и морских дивизиях против танков, но помните: тяжёлое противотанковое вооружение и вспомогательные машины обходятся дороже, а против небронированных целей толку мало.§!"
 AA_company: "Зенитная батарея"
 AA_company_desc: "Подразделение, специально оснащённое для борьбы с авиацией противника и защиты от его вертолётов и прочих летательных аппаратов.\n\n§GПодсказка дизайнера: зенитная батарея даёт высокую атаку по авиации, не занимая ширины фронта. Применяйте её для прикрытия дивизий, действующих под вражеским господством в воздухе, но учтите, что в наземном бою она слаба и расходует специальное зенитное снаряжение, почти бесполезное при чистом небе.§!"
 Combat_engineer_company: "Рота боевых инженеров"
 Combat_engineer_company_desc: "Боевые сапёры выполняют инженерные работы непосредственно в интересах линейных частей. Они обучены и оснащены для преодоления трудной местности — рек или противотанковых рвов. Они же проделывают проходы в минных полях и других заграждениях и расчищают участки, чтобы остальные войска могли пройти беспрепятственно.\n\n§GПодсказка дизайнера: боевые сапёры добавляют защиту, прорыв и умеренные бонусы к атаке и защите в лесах, горах, джунглях и городах, не занимая ширины фронта. Применяйте их для наступления через трудную местность, но помните: они требуют немало пехотного снаряжения и приносят меньше пользы на открытом пространстве.§!"
 pathfinder_company: "Взвод передовых авианаводчиков"
 pathfinder_company_desc: "Элитные группы парашютистов, обученные прыгать заранее, до начала воздушно-десантной операции, чтобы отыскать самые безопасные площадки приземления и районы сбора. Эти бойцы обеспечивают важнейшее управление на ключевых этапах любой воздушно-десантной или аэромобильной операции.\n\n§GПодсказка дизайнера: передовые авианаводчики повышают организацию и атаку по пехоте у воздушно-десантной пехоты и могут десантироваться на парашютах. Применяйте их для усиления воздушно-десантных и десантно-штурмовых дивизий, но помните: они занимают ширину фронта, доступны только таким соединениям и почти не дают прямой боевой мощи.§!"
 amphibious_landing_detachment: "Морской десантный отряд"
 amphibious_landing_detachment_desc: "Приданные флотом подразделения, позволяющие быстро и эффективно проводить морские десантные операции. Располагая специальными десантными кораблями и снаряжением, они обеспечивают стремительную высадку с корабля на берег или из-за горизонта. Платой за включение такого подразделения становится падение способности вести неамфибийные операции.\n\n§GПодсказка дизайнера: морской десантный отряд резко повышает атаку, защиту и подвижность морских соединений при высадке. Применяйте его в дивизиях, предназначенных для штурма побережья, но помните: он занимает ширину фронта, требует живой силы и снаряжения и накладывает тяжёлые штрафы почти на всех видах суши.§!"
 combat_maintenance_company: "Ремонтная рота"
 combat_maintenance_company_desc: "Ремонтная рота удерживает в строю технику и тяжёлое вооружение соединения: она ведёт полевой ремонт и эвакуирует повреждённые машины до того, как те будут потеряны окончательно. Восстанавливая выбывшую из боя технику вблизи фронта, она поддерживает бронетанковую мощь в затяжных операциях и снижает потери от износа.\n\n§GПодсказка дизайнера: ремонтная рота повышает надёжность, восстановление и захват снаряжения у дивизий с большим количеством техники. Применяйте её, чтобы сдержать потери от износа и сберечь дорогое снаряжение в долгих операциях, но помните: она занимает ширину фронта, требует живой силы и вспомогательных машин и почти не даёт прямой огневой мощи.§!"
 airmobile_maintenance_company: "Аэромобильная ремонтная рота"
 airmobile_maintenance_company_desc: "Ремонтное подразделение, приспособленное для обслуживания аэромобильных и вертолётных сил: оно располагает более лёгким и транспортабельным оборудованием, необходимым для поддержания в строю винтокрылых машин и быстро перебрасываемых частей. Оно восстанавливает повреждённую технику в передовых районах, позволяя вести десантно-штурмовые операции вдали от постоянных баз.\n\n§GПодсказка дизайнера: аэромобильное ремонтное подразделение повышает захват снаряжения и надёжность, поспевая за вертолётными соединениями. Применяйте его для сбережения дорогой винтокрылой техники, но помните: восстановление у него ниже, чем у наземного ремонтного подразделения, оно занимает ширину фронта и требует множества транспортных вертолётов.§!"
 communications_company: "Рота связи"
 communications_company_desc: "Рота связи содержит радио-, информационные и командные сети, связывающие соединение воедино, и обеспечивает надёжное прохождение приказов и донесений по всему полю боя. Устойчивая связь улучшает взаимодействие и сокращает время реакции, а также защищает соединение от помех и радиоэлектронного подавления.\n\n§GПодсказка дизайнера: рота связи повышает организацию, восстановление и инициативу передовых батальонов. Применяйте её в крупных или ценных боевых дивизиях, которым выгодна слаженность, но помните: она занимает ширину фронта и требует немалых расходов на аппаратуру управления и связи, почти не давая прямой огневой мощи.§!"
 military_police_attachment: "Отряд военной полиции"
 military_police_attachment_desc: "Военная полиция регулирует движение, обеспечивает безопасность тыла и работает с пленными, освобождая линейные части для боя. Поддерживая порядок на путях снабжения и прикрывая тыл от просочившихся групп и отставших, она сохраняет дисциплину и позволяет соединению двигаться без задержек.\n\n§GПодсказка дизайнера: военная полиция умножает подавление, даваемое пехотой, и добавляет своё, не занимая ширины фронта. Применяйте её в шаблонах для оккупации и охраны тыла, но помните: затраты живой силы и снаряжения почти ничего не дают боевым дивизиям на передовой.§!"
 hq_mech: "Штабная рота механизированной пехоты"
 hq_mot: "Штабная рота моторизованной пехоты"
 hq_armor: "Штабная рота тяжёлой кавалерии"
 hq_Mot_Inf_Bat: "Штабной охранный отряд мотопехоты"
 hq_Mech_Inf_Bat: "Штабной охранный отряд механизированной пехоты"
 hq_Arm_Inf_Bat: "Штабной охранный отряд бронетехники"
 hq_Mech_Marine_Bat: "Штабной охранный отряд морской пехоты"
 hq_Mech_Air_Inf_Bat: "Штабной охранный отряд воздушно-штурмовых войск"
 Militia_Recce_Comp: "Разведывательный взвод ополчения"
 Militia_Recce_Comp_desc: "Разведывательные роты ополчения используют вспомогательные машины и скромные средства связи, чтобы вести разведку впереди ополченческих соединений. Они дёшево вскрывают позиции противника, особенно в застроенной местности.\n\n§GПодсказка дизайнера: разведка ополчения добавляет разведку и инициативу, не занимая ширины фронта, и особенно хороша в городах и мегаполисах. Применяйте её, чтобы дёшево улучшить тактику ополчения, но помните: она доступна только ополчению и почти не даёт прямой боевой мощи.§!"
 light_medium_walker_battalion: "Рота средних шагоходов (сокращённая)"
 light_medium_walker_battalion_desc: "Сокращённое подразделение средних шагоходов усиливает соединение небольшим количеством универсальных шагающих шасси.\n\n§GПодсказка дизайнера: сокращённые средние шагоходы добавляют гибкую бронированную мощь при меньшей ширине фронта и гораздо меньшем числе шасси, чем полная шагающая рота. Применяйте их, когда производство не тянет полноценное подразделение, но помните: у них остаются низкая организация, долгая подготовка и ограниченная стойкость.§!"
 light_light_walker_tank_battalion: "Рота лёгких шагоходов (сокращённая)"
 light_light_walker_tank_battalion_desc: "Сокращённое подразделение лёгких шагоходов даёт небольшую группу противотанковых шагающих платформ для точечного усиления.\n\n§GПодсказка дизайнера: сокращённые лёгкие шагоходы добавляют сосредоточенную противотанковую мощь при меньшей ширине фронта и меньшем числе шасси истребителей танков. Применяйте их для усиления дивизий против защищённых целей, но помните: у них сохраняются низкая организация, долгая подготовка и узкая роль — против небронированного противника они мало что дают.§!"
 light_heavy_walker_tank_battalion: "Рота тяжёлых шагоходов (сокращённая)"
 light_heavy_walker_tank_battalion_desc: "Сокращённое подразделение тяжёлых шагоходов даёт шагающие платформы с артиллерийским вооружением без нагрузки полноценной роты.\n\n§GПодсказка дизайнера: сокращённые тяжёлые шагоходы добавляют бронированную артиллерийскую огневую мощь при меньшей ширине фронта и меньшем числе шасси, чем полное подразделение. Применяйте их для компактной огневой поддержки, но низкая организация, долгая подготовка и специальное артиллерийское шасси всё равно делают их дорогими.§!"
 hq_support_company: "Штабная рота обеспечения"
 hq_support_company_desc: "Штабная рота обеспечения даёт командованию персонал, связь, транспорт и охрану, необходимые для управления полевым соединением.\n\n§GПодсказка дизайнера: штабная рота обеспечения усиливает бонусы, которые развёрнутый командующий получает от своего мастерства. Это универсальный выбор для шаблона штаба армии, но он занимает ширину фронта, требует живой силы и снаряжения и не даёт специальных боевых или оперативных бонусов.§!"
 hq_engineer: "Штабная сапёрная рота"
 hq_engineer_desc: "Штабная сапёрная рота координирует проделывание проходов, возведение укреплений и обеспечение подвижности в рамках всего соединения.\n\n§GПодсказка дизайнера: штабная сапёрная рота повышает урон по укреплениям и защиту от морского десанта, добавляя окапывание и прорыв. Применяйте её при осадах, в обороне и на побережье, но помните: она занимает ширину фронта и даёт мало прямой огневой мощи.§!"
 hq_recon: "Штабная разведывательная рота"
 hq_recon_desc: "Штабная разведывательная рота собирает и доводит до командования сведения о местности и противнике.\n\n§GПодсказка дизайнера: штабная разведывательная рота повышает разведку и накопление опыта по чертам местности у развёрнутого командующего, добавляя штабу разведку. Применяйте её в подвижных командованиях или там, где важна местность, но помните: она занимает ширину фронта и почти не участвует в бою.§!"
 hq_maintenance: "Штабная ремонтная рота"
 hq_maintenance_desc: "Штабная ремонтная рота координирует эвакуацию, ремонт и сбор трофейного снаряжения в рамках всего соединения.\n\n§GПодсказка дизайнера: штабная ремонтная рота снижает потери от износа и повышает захват снаряжения у развёрнутого командующего, добавляя штабу надёжность и захват снаряжения. Применяйте её в командованиях с большим количеством техники, но помните: она занимает ширину фронта и слаба в бою.§!"
 hq_logistics: "Штабная рота материального обеспечения"
 hq_logistics_desc: "Штабная рота материального обеспечения планирует подвоз снабжения и перемещение топлива для всего соединения.\n\n§GПодсказка дизайнера: штабная рота материального обеспечения снижает расход снабжения у развёрнутого командующего и расход топлива у штаба. Применяйте её на фронтах с нехваткой снабжения или большим расходом топлива, но помните: она занимает ширину фронта и почти не участвует в бою.§!"
 hq_naval_liaison: "Штабная рота морского взаимодействия"
 hq_naval_liaison_desc: "Группы морского взаимодействия связывают штаб с командующими флотами и системами поддержки с моря на берег.\n\n§GПодсказка дизайнера: штабная рота морского взаимодействия улучшает обстрел побережья, морской десант и запас снабжения морской пехоты у развёрнутого командующего. Применяйте её в прибрежных и десантных кампаниях, но помните: она занимает ширину фронта и почти бесполезна в глубине суши.§!"
 hq_air_liaison: "Рота авиационного наведения при штабе"
 hq_air_liaison_desc: "Группы авиационного наведения обеспечивают взаимодействие штаба с транспортной авиацией, авиацией непосредственной поддержки и истребительной авиацией.\n\n§GПодсказка дизайнера: рота авиационного наведения при штабе сокращает подготовку воздушного десанта, повышает устойчивость к ударам авиации непосредственной поддержки и усиливает боевой эффект от господства в воздухе. Применяйте её там, где важно взаимодействие авиации и наземных войск, но помните: она занимает ширину фронта и почти не добавляет наземной огневой мощи.§!"
 hq_specops: "Штабная рота специальных операций"
 hq_specops_desc: "Штаб специальных операций координирует элитные части, действующие вне обычных линий снабжения и управления.\n\n§GПодсказка дизайнера: штабная рота специальных операций повышает атаку, защиту и живучесть без снабжения у сил специального назначения развёрнутого командующего, не занимая ширины фронта. Применяйте её для управления элитными соединениями, но помните: затраты живой силы и снаряжения пропадают зря при обычных войсках.§!"
 hq_mech_desc: "Штаб механизированных операций координирует действия бронетранспортёров и перевозимой на них пехоты в рамках всего соединения.\n\n§GПодсказка дизайнера: штабная рота механизированной пехоты повышает атаку и защиту механизированных частей у развёрнутого командующего. Применяйте её для управления механизированными соединениями, но помните: ей нужны БТР и немало вспомогательного снаряжения, а прочим родам войск она почти ничего не даёт.§!"
 hq_mot_desc: "Штаб моторизованных операций координирует перевозимую на машинах пехоту и быстрые перемещения соединения.\n\n§GПодсказка дизайнера: штабная рота моторизованной пехоты повышает атаку и защиту моторизованных частей у развёрнутого командующего. Применяйте её для управления моторизованными соединениями, но помните: расходы на вспомогательные машины и снаряжение мало что дают пешим и бронетанковым войскам.§!"
 hq_armor_desc: "Штаб бронетанковых операций координирует действия танков, бронированной пехоты и приданных им подразделений в рамках всего соединения.\n\n§GПодсказка дизайнера: штабная рота тяжёлой кавалерии повышает атаку и защиту брони у развёрнутого командующего. Применяйте её для управления преимущественно танковыми силами, но помните: БМП и широкий перечень снаряжения делают её одним из самых дорогих штабных вариантов.§!"
 hq_infantry: "Штабной отряд пехотной охраны"
 hq_infantry_desc: "Отряд лёгкой пехоты защищает штабной персонал, узлы связи и командные пункты от прямого нападения.\n\n§GПодсказка дизайнера: штабной отряд пехотной охраны даёт высокую прочность и организацию при умеренных расходах на снаряжение для штаба армии. Применяйте его как базовый рубеж охраны, но помните: он занимает ширину фронта, не получает бонусов по местности и уступает обычной линейной пехоте по боевым показателям.§!"
 hq_Mot_Inf_Bat_desc: "Отряд моторизованной пехоты обеспечивает подвижную охрану штабного персонала и командных пунктов.\n\n§GПодсказка дизайнера: штабной отряд моторизованной охраны добавляет штабу армии скорость, крепкую организацию и хорошие показатели на холмах и в городах. Применяйте его в подвижном командном соединении, но помните: машины стоят денег, а в пустынях, джунглях, на болотах, реках и при морских десантах отряд слаб.§!"
 hq_Mech_Inf_Bat_desc: "Отряд механизированной пехоты охраняет подвижный штаб, используя бронетранспортёры.\n\n§GПодсказка дизайнера: штабной отряд механизированной охраны добавляет бронированную подвижность и сильную защиту на холмах и в городах. Применяйте его для охраны механизированного штаба армии, но помните: БТР дороги, а в горах, джунглях, на болотах, реках и при морских десантах отряд получает тяжёлые штрафы.§!"
 hq_Arm_Inf_Bat_desc: "Отряд бронированной пехоты на боевых машинах пехоты обеспечивает усиленную охрану штаба.\n\n§GПодсказка дизайнера: штабной отряд бронированной охраны даёт защиту на базе БМП и хорошие показатели на открытой местности для штаба армии. Применяйте его при бронетанковых командованиях, но помните: у него ниже организация, дорогое снаряжение и тяжёлые штрафы на трудной местности и при морских десантах.§!"
 hq_Mech_Marine_Bat_desc: "Отряд механизированной морской пехоты охраняет штаб при высадке с кораблей и действиях на побережье.\n\n§GПодсказка дизайнера: штабной отряд морской охраны сочетает бронированную подвижность с сильной атакой при высадке и форсировании рек для штаба армии. Применяйте его в морских командованиях и на плацдармах, но помните: стоимость БТР и штрафы на пересечённой местности делают его невыгодным для кампаний в глубине суши.§!"
 hq_Mech_Air_Inf_Bat_desc: "Лёгкий механизированный отряд охраняет штабы воздушно-десантных и быстро развёртываемых соединений.\n\n§GПодсказка дизайнера: штабной отряд десантно-штурмовой охраны даёт бронированную охрану, которую можно десантировать вместе со штабом армии. Применяйте его в воздушно-десантных командованиях, но помните: БТР и вспомогательное снаряжение обходятся дорого, а на трудной местности, реках и при морских десантах отряд получает серьёзные штрафы.§!"
 Mech_Militia_Bat: "Механизированное ополчение"
 Mech_Militia_Bat_desc: "Рота ополчения на бронетранспортёрах. Ополчение отличается тем, что у него меньше тяжёлого вооружения и средств связи, чем у обычной пехоты. Это делает его очень подвижным и эффективным на трудной местности, но на равнине против бронетанкового противника оно быстро тает.\n\n§GПодсказка дизайнера: механизированное ополчение ещё сильнее меняет экономичность на скорость и большую бронированность. Применяйте его как недорогую более тяжёлую подвижную охрану и для давления на пешую пехоту и артиллерию, но помните: слабые по сравнению с профессиональными механизированными частями боевые показатели не позволяют ему тягаться с хорошо оснащённой армией.§!"