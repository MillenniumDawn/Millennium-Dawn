 sp_secure_military_network: "Réseau militaire sécurisé"
 sp_secure_military_network_desc: "Une dorsale nationale de communications durcie et chiffrée reliant commandement, capteurs et forces par des liaisons de données résilientes à faible latence."
 scientist_trait_antarctica_specialist: "Spécialiste de la recherche polaire"
 scientist_trait_antarctica_specialist_desc: "Un chercheur aguerri qui s'épanouit dans l'environnement le plus rude du monde, spécialisé dans le maintien et le développement des opérations sur la glace antarctique."
 scientist_trait_naval_armament_specialist: "Spécialiste de l'armement naval"
 scientist_trait_naval_armament_specialist_desc: "Un spécialiste de l'armement naval, des railguns et torpilles aux essaims de drones et modules de contre-mesures."
 scientist_trait_naval_propulsion_specialist: "Spécialiste de la propulsion navale"
 scientist_trait_naval_propulsion_specialist_desc: "Un expert des centrales marines avancées, poussant les navires de guerre plus vite et plus loin grâce à la propulsion nucléaire et à fusion."
 scientist_trait_tank_firepower_specialist: "Spécialiste de la puissance de feu des chars"
 scientist_trait_tank_firepower_specialist_desc: "Une autorité en armement des véhicules blindés, des canons avancés et chargeurs automatiques aux railguns et lasers embarqués."
 scientist_trait_tank_armor_specialist: "Spécialiste de la protection des réservoirs"
 scientist_trait_tank_armor_specialist_desc: "Un spécialiste de la survivabilité des véhicules blindés, développant blindage composite, systèmes de protection active et camouflage adaptatif."
 scientist_trait_tank_mobility_specialist: "Spécialiste de la mobilité des chars"
 scientist_trait_tank_mobility_specialist_desc: "Un expert des groupes motopropulseurs et châssis de véhicules blindés, des transmissions électriques aux suspensions de marcheurs."
 scientist_trait_robotics_specialist: "Expert en Robotique & Autonomie"
 scientist_trait_robotics_specialist_desc: "Un pionnier des systèmes autonomes, enseignant aux machines sur terre, mer et air à penser, chasser et travailler sans humain dans la boucle."
 sp_amws_combat_system_desc: "Développer un système d'arme avancé pour nos plateformes HACS. La réalisation de ce projet permettra de débloquer le module du §Ysystème de combat AMWS-21§!."
 sp_zamws_advanced_mws_desc: "Développer un système d'armes multiples plus avancé pour nos plateformes HACS. La réalisation de ce projet débloquera le module §YXAMWS-24, système d'armes multiples avancé§!."
 sp_xciws_close_in_weapon_system_desc: "Développer un système d'arme rapprochée pour nos plateformes HACS. La réalisation de ce projet permettra de débloquer le module §YXCIWS-2B Close In Weapon System§!."
 sp_close_range_battle_halberd_desc: "Concevoir une hallebarde de combat rapproché pour nos plateformes HACS. L'achèvement de ce projet débloque le module de §Yhallebarde de combat rapproché Type-77§!."
 sp_great_sword_desc: "Concevez une puissante épée longue pour nos plateformes HACS. L'achèvement de ce projet débloque le module §YÉpée longue BWS-3§!."