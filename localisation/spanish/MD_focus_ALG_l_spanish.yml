 ALG_state_hospitals_idea: "Hospitales estatales"
 ALG_transparent_budget: "Presupuesto transparente"
 ALG_appoint_sellal: "Nombrar a Abdelmalek Sellal"
 ALG_appoint_sellal_desc: "Tecnócrata y partidario leal de Bouteflika, Sellal representa la continuidad y una gobernanza pragmática, con un enfoque centrado en la estabilidad y la gestión de las instituciones estatales."
 ALG_sellal_gets_appointed: "Abdelmalek Sellal ha sido nombrado primer ministro."
 ALG_sellal_modifiers: "§YEfectos del nombramiento de Sellal:§!\nDeriva democrática: §G+0.10§!\nCostes de burocracia: §G-10%§!\nIngresos fiscales: §G+3%§!\nGasto policial esperado: §R-1§!\nGasto sanitario esperado: §R-1§!"
 ALG_appoint_ouyahia: "Nombrar a Ahmed Ouyahia"
 ALG_appoint_ouyahia_desc: "Ouyahia es un político veterano con reputación de aplicar una dura austeridad y de mantener su lealtad al sistema gobernante. Su estilo de liderazgo favorece el control centralizado y la disciplina financiera."
 ALG_ouyahia_gets_appointed: "Ahmed Ouyahia ha sido nombrado primer ministro."
 ALG_ouyahia_modifiers: "§YEfectos del nombramiento de Ouyahia:§!\nDeriva democrática: §G+0.10§!\nCostes de burocracia: §G-10%§!\nIngresos fiscales: §G+3%§!\nGasto policial esperado: §R-1§!\nGasto sanitario esperado: §R-1§!"
 ALG_appoint_bedoui: "Nombrar a Noureddine Bedoui"
 ALG_appoint_bedoui_desc: "Bedoui, burócrata y ministro de carrera, encarna la lealtad tecnocrática hacia la presidencia. Su estilo de gobernanza enfatiza la eficiencia administrativa y las reformas limitadas."
 ALG_bedoui_gets_appointed: "Noureddine Bedoui ha sido nombrado primer ministro."
 ALG_bedoui_modifiers: "§YEfectos del nombramiento de Bedoui:§!\nDeriva democrática: §G+0.10§!\nCostes de burocracia: §G-10%§!\nIngresos fiscales: §G+3%§!\nGasto policial esperado: §R-1§!\nGasto sanitario esperado: §R-1§!"
 ALG_no_pm_set: "§RNingún primer ministro nombrado§!"
 ALG_ahmed_gaid_salah_desc: "Jefe de Estado Mayor del Ejército Nacional Popular, Ahmed Gaïd Salah fue un oficial de carrera que ascendió entre las filas durante la Guerra de la Independencia y, más tarde, se convirtió en una de las figuras más influyentes en los asuntos políticos y militares de Argelia."
 ALG_smain_lamari_desc: "Jefe de los servicios de inteligencia y contraespionaje de Argelia, Smaïn Lamari desempeñó un papel central en la «Guerra Sucia» contra los insurgentes islamistas durante la Década Negra."
 ALG_kaidi_mohamed_desc: "Un oficial respetado con experiencia en formaciones mecanizadas, Kaïdi Mohamed se especializó en la guerra blindada y en la modernización de las fuerzas terrestres de Argelia."
 ALG_ahcene_tafer_desc: "Ahcène Tafer fue conocido por su liderazgo en las unidades mecanizadas de Argelia y su papel en la reestructuración del ejército durante los años posteriores a la guerra civil."
 ALG_mohammed_larbi_haouli_desc: "Mohammed Larbi Haouli comandó la Armada Argelina durante un periodo de modernización, equilibrando la defensa costera con la cooperación regional."
 ALG_ammar_atamnia_desc: "Un alto oficial que ejerció como estratega en las fuerzas terrestres de Argelia, Ammar Atamnia destacó por su énfasis en la guerra defensiva y el entrenamiento militar."
 ALG_mohammed_al_arabi_hawalli_desc: "Mohammed Al-Arabi Hawalli ocupó puestos de mando naval y contribuyó a la reforma de las fuerzas marítimas de Argelia."
 ALG_mahmoud_laraba_desc: "Comandante de la fuerza aérea, Mahmoud Laraba estuvo involucrado en el entrenamiento de pilotos y en la reorganización de la red de defensa aérea de Argelia."
 ALG_mohamed_lamari_desc: "Como jefe de Estado Mayor durante la Década Negra, Mohamed Lamari fue una de las figuras clave en la dirección de las operaciones de contrainsurgencia de Argelia."
 ALG_said_chengriha_desc: "Saïd Chengriha se especializó en guerra blindada y logística, ascendiendo más tarde al mando de las fuerzas terrestres de Argelia y ejerciendo finalmente como jefe de Estado Mayor."
 ALG_ben_ali_ben_ali_desc: "Comandante de las unidades de élite de Argelia, Ben Ali Ben Ali se labró una reputación de profesionalidad y disciplina dentro de la infantería."
 ALG_fatima_zohra_ardjoune_desc: "Una de las primeras mujeres en Argelia en alcanzar el rango de general, Fatima Zohra Ardjoune fue una médica militar y un símbolo de la modernización en las fuerzas armadas."
 ALG_mohamed_mediene_desc: "Conocido como «Toufik», Mohamed Mediène fue el jefe del poderoso servicio de inteligencia de Argelia (DRS) desde 1990 hasta 2015, convirtiéndose en una de las figuras más influyentes de la historia moderna de Argelia."
 ALG_abdelmalek_guenaizia_desc: "Abdelmalek Guenaizia ejerció como viceministro de Defensa y, posteriormente, como jefe de Estado Mayor, desempeñando un papel clave en la modernización del ejército argelino."
 ALG_ahmed_bousteila_desc: "Comandante de la Gendarmería Argelina, Ahmed Bousteila supervisó la seguridad de las zonas rurales de Argelia y la lucha contra el contrabando y el terrorismo."
 ALG_fatima_boudouani_desc: "La primera mujer ascendida a general en el ejército argelino (2009), Fatima Boudouani representó un hito en la integración de género dentro de las fuerzas armadas."
 alg_medal_1: "Orden del 1 de Noviembre"
 alg_medal_1_desc: "Concedida por valentía excepcional en la defensa de la nación."
 alg_medal_2: "Medalla de la Liberación Nacional"
 alg_medal_2_desc: "Conmemora las contribuciones sobresalientes a la lucha por la independencia de Argelia."
 alg_medal_3: "Medalla al Mérito Militar"
 alg_medal_3_desc: "Otorgada por la excelencia en el mando y el servicio."
 alg_medal_4: "Medalla al Valor"
 alg_medal_4_desc: "Reconoce actos de valentía en el campo de batalla."
 alg_medal_5: "Medalla al Servicio del Pueblo"
 alg_medal_5_desc: "Otorgada por el servicio desinteresado en la protección de los civiles."
 alg_medal_6: "Medalla del Legado del Mártir"
 alg_medal_6_desc: "Símbolo del máximo sacrificio por la nación."
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_0: "Subteniente"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_1: "Teniente"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_2: "Capitán"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_3: "Mayor"
 ALG_DIVISION_EXPERIENCE_TITLE_ARMY_EXPERIENCE_4: "Coronel"
 algeria_intro.1.t: "La República Argelina Democrática y Popular"
 algeria_intro.1.d: "Argelia entra en el siglo XXI marcada por la sangrienta Década Negra, pero sigue en pie. El Estado ha sobrevivido a la insurgencia islamista, pero las heridas de la guerra civil siguen siendo profundas. El presidente Abdelaziz Bouteflika promete reconciliación y reconstrucción, pero los desafíos que se avecinan son formidables: reactivar la economía, reformar el ejército, reconstruir la confianza entre el pueblo y el Estado, y maniobrar entre poderosos socios extranjeros. ¿Consolidará Argelia la estabilidad y se alzará como una potencia regional, o caerá una vez más en las luchas internas?"
 algeria_intro.1.a: "Una nación herida, pero inquebrantable."
 ALG_resistance_window_title: "Movimiento de Resistencia Argelino"
 ALG_resistance_window_desc: "La nación se encuentra sacudida por protestas generalizadas, disturbios y resistencia. Le Pouvoir busca suprimir la disidencia, pero cuanta más presión se ejerce, más fuerte se vuelve la resistencia."
 ALG_protester_exhaustion_TT: "§YLos manifestantes§! se han agotado debido a las contramedidas del gobierno."
 ALG_deploys_security_TT: "§YEl Estado despliega fuertes fuerzas de seguridad para suprimir los disturbios.§!"
 ALG_presidential_decisions_only_one_is_available_TT: "Solo puede haber una medida de represión activa a la vez."
 ALG_resistance_movement: "Movimiento Hirak"
 ALG_resistance_movement_desc: "Las protestas populares a escala nacional conocidas como el Hirak continúan exigiendo reformas políticas, transparencia y justicia social en toda Argelia."
 ALG_throttle_internet_speeds: "Decreto n.º 24-17: Regulación de las Telecomunicaciones"
 ALG_throttle_internet_speeds_desc: "Bajo el Decreto 24-17, las autoridades restringen el acceso a las plataformas en línea y redes sociales para desorganizar a los convocantes del Hirak. Esto limita la coordinación de las protestas, pero frustra a los ciudadanos y ralentiza la actividad económica."
 ALG_nationwide_security_presence: "Operación Halcón del Desierto: Presencia de Seguridad Nacional"
 ALG_fund_pro_government_protests: "Programa de Solidaridad Nacional: Iniciativa «Baraka»"
 ALG_fund_pro_government_protests_desc: "El gobierno financia y organiza manifestaciones a favor del régimen bajo el Proyecto Baraka para contrarrestar al movimiento Hirak. Esto puede mitigar el impulso de la oposición, pero es costoso y arriesga exacerbar el resentimiento público."
 ALG_deploy_security_kabylia_1: "Desplegar tropas de seguridad en Cabilia"
 ALG_deploy_security_kabylia_1_desc: "Cabilia se ha convertido en un foco de disturbios. El despliegue de fuerzas de seguridad puede pacificar la región, pero arriesga exacerbar aún más el resentimiento local."
 ALG_deploy_security_mzab_1: "Desplegar tropas de seguridad en el valle de M'zab"
 ALG_deploy_security_mzab_1_desc: "Las tensiones en el valle de M'zab se han intensificado. El envío de destacamentos de seguridad puede frenar los disturbios a nivel local, pero las operaciones con mano dura arriesgan alienar a las comunidades y socavar la confianza a largo plazo."
 ALG_deploy_security_aures_1: "Desplegar tropas de seguridad en las tierras altas de Aurès"
 ALG_deploy_security_aures_1_desc: "Las tierras altas de Aurès se han convertido en un punto central para las manifestaciones. Un despliegue de seguridad puede disolver las grandes concentraciones, aunque sobrecargará la logística en un terreno accidentado y podría inflamar los agravios regionales."
 ALG_deploy_security_tamanrasset_1: "Desplegar tropas de seguridad en la provincia de Tamanrasset"
 ALG_deploy_security_tamanrasset_1_desc: "Las provincias del sur de Tamanrasset registran un aumento de los disturbios. El despliegue de fuerzas puede estabilizar las rutas de transporte e instalaciones clave, pero arriesga dañar las relaciones con las comunidades locales y perturbar el comercio transahariano."
 ALG_deploy_security_granderg_1: "Desplegar tropas de seguridad en el Gran Erg Occidental"
 ALG_deploy_security_granderg_1_desc: "Los disturbios en torno al Gran Erg Occidental han amenazado a los asentamientos remotos y a las infraestructuras críticas. Las patrullas de seguridad pueden traer orden a corto plazo, aunque el entorno hostil hace que las operaciones sostenidas sean costosas y políticamente sensibles."
 ALG_deploy_security_atlas_1: "Desplegar tropas de seguridad en las estribaciones del Atlas"
 ALG_deploy_security_atlas_1_desc: "Las estribaciones del Atlas han albergado protestas recurrentes y acciones sindicales. Un despliegue focalizado puede evitar movilizaciones masivas a lo largo de los corredores de transporte, pero podría avivar el resentimiento entre las poblaciones rurales."
 ALG_deploy_security_constantinois_1: "Desplegar tropas de seguridad en la región de Constantinois"
 ALG_deploy_security_constantinois_1_desc: "Constantina y sus alrededores experimentan frecuentes manifestaciones. Concentrar los activos de seguridad aquí puede proteger las instalaciones gubernamentales y los puertos, pero aumenta la probabilidad de enfrentamientos en distritos urbanos densos."
 ALG_deploy_security_algerois_1: "Desplegar tropas de seguridad en el área metropolitana de Argel"
 ALG_deploy_security_algerois_1_desc: "Argel sigue siendo el centro de la actividad del Hirak. Una presencia de seguridad masiva puede disuadir las movilizaciones callejeras y asegurar las instituciones, pero arriesga visibilizar la represión en la capital y generar importantes repercusiones políticas."
 ALG_deploy_security_oranais_1: "Desplegar tropas de seguridad en Orán y la costa occidental"
 ALG_deploy_security_oranais_1_desc: "La región de Orán ha visto crecer las manifestaciones vinculadas a redes laborales y juveniles. El despliegue de fuerzas puede proteger los puertos y los centros económicos, pero podría perturbar el comercio y agravar las tensiones con los líderes locales."
 ALG_doing_decision: "Aplicando actualmente una medida de represión"
 ALG_doing_decision_y: "Aplicando actualmente una medida de represión"
 ALG_protests_ongoing: "Protestas en curso a escala nacional"
 ALG_locals_swayed: "Los residentes simpatizan con los manifestantes"
 ALG_kabylia_fell_recently: "Cabilia fue pacificada recientemente"
 ALG_oranais_fell_recently: "La región de Oranais fue pacificada recientemente"
 ALG_algerois_fell_recently: "El área metropolitana de Argel fue pacificada recientemente"
 ALG_constantinois_fell_recently: "La región de Constantinois fue pacificada recientemente"
 ALG_atlas_fell_recently: "Las estribaciones del Atlas fueron pacificadas recientemente"
 ALG_granderg_fell_recently: "El Gran Erg Occidental fue pacificado recientemente"
 ALG_tamanrasset_fell_recently: "La provincia de Tamanrasset fue pacificada recientemente"
 ALG_aures_fell_recently: "Las tierras altas de Aurès fueron pacificadas recientemente"
 ALG_mzab_fell_recently: "El valle de M'zab fue pacificado recientemente"
 ALG_state_falls_TT: "§YEste estado§! ha caído bajo la influencia de los manifestantes."
 algerian_events.201.t: "M'zab ha caído ante los manifestantes"
 algerian_events.201.a: "Otra región que se nos escapa"
 algerian_events.202.t: "Aurès ha caído ante los manifestantes"
 algerian_events.202.a: "Las protestas se extienden"
 algerian_events.203.t: "Tamanrasset ha caído ante los manifestantes"
 algerian_events.203.a: "El sur está inestable"
 algerian_events.204.t: "El Gran Erg Occidental ha caído ante los manifestantes"
 algerian_events.204.a: "Incluso el desierto se levanta"
 algerian_events.205.t: "El Atlas argelino ha caído ante los manifestantes"
 algerian_events.205.a: "Los disturbios se amplían"
 algerian_events.206.t: "Constantinois ha caído ante los manifestantes"
 algerian_events.206.a: "The east erupts"
 algerian_events.207.t: "Cabilia ha caído ante los manifestantes"
 algerian_events.207.a: "Cabilia se levanta de nuevo"
 algerian_events.208.t: "Algérois ha caído ante los manifestantes"
 algerian_events.208.a: "El corazón de Argelia tiembla"
 algerian_events.209.t: "Oranais ha caído ante los manifestantes"
 algerian_events.209.a: "El oeste se ha perdido"
 algerian_events.201.d: "El pueblo de la región de M'zab ha desafiado el control del gobierno y se ha tomado las calles.\nDescontento público: [ALG_grievance_text]"
 algerian_events.202.d: "In las montañas de Aurès, los disturbios han desembocado en un abierto desafío.\nDescontento público: [ALG_grievance_text]"
 algerian_events.203.d: "A pesar del aislamiento, Tamanrasset ha estallado, perdiendo el gobierno el control de la zona.\nDescontento público: [ALG_grievance_text]"
 algerian_events.204.d: "Las comunidades desérticas del Gran Erg Occidental se han unido a la ola de protestas.\nDescontento público: [ALG_grievance_text]"
 algerian_events.205.d: "La región del Atlas, antes tranquila, se ha convertido en un hervidero de disturbios antigubernamentales.\nDescontento público: [ALG_grievance_text]"
 algerian_events.206.d: "Las protestas en el este desbordan a las fuerzas de seguridad locales, y Constantinois ha caído.\nDescontento público: [ALG_grievance_text]"
 algerian_events.207.d: "Cabilia, con su larga tradición de disidencia, vuelve a desafiar abiertamente al Estado.\nEstado de ánimo cabila: [ALG_kabyle_satisfaction_text]"
 algerian_events.208.d: "Incluso la región de la capital se ha visto sacudida por protestas incontrolables.\nControl militar: [ALG_army_grip_text]"
 algerian_events.209.d: "In the west, Oranais joins the wave of unrest sweeping across Algeria.\nArab mood: [ALG_arab_satisfaction_text]"
 algerian_events.200.t: "Protestas suprimidas"
 algerian_events.200.d: "Las fuerzas de seguridad han logrado suprimir la última oleada de manifestaciones, aunque la indignación pública se mantiene latente bajo la superficie."
 algerian_events.200.a: "Se restaura el orden, por ahora."
 algerian_events.2015.t: "La represión sale el tiro por la culata"
 algerian_events.2015.d: "Los intentos de reprimir las protestas solo han avivado más indignación, armando de valor a los manifestantes y debilitando la autoridad del gobierno."
 algerian_events.2015.a: "La situación empeora."
 algerian_events.2025.t: "Fin de las protestas"
 algerian_events.2025.d: "Tras meses de lucha, la última oleada de protestas se ha disipado. Las tensiones persisten, pero por ahora las calles vuelven a estar tranquilas."
 algerian_events.2025.a: "Finalmente, regresa la calma."
 algerian_events.301.t: "¡Estallan protestas en todo el país!"
 algerian_events.301.d: "Parece que nuestras acciones recientes no fueron tomadas a la ligera por el pueblo, y han estallado protestas a escala nacional. De forma lenta pero segura, parece que cada vez más personas exigen la dimisión del gobierno, aunque nosotros no nos vamos a ir a ninguna parte."
 algerian_events.301.a: "¡Deberíamos haberlo visto venir!"
 ALG_khenchela_arms_manufacturer: "Complejo de Fabricación de Armas de Khenchela"
 ALG_khenchela_arms_manufacturer_desc: "Una instalación estatal en la provincia de Khenchela que produce armas de infantería y equipamiento para el Ejército Nacional Popular de Argelia. Establecido para reducir la dependencia de las importaciones de armas extranjeras y garantizar la autosuficiencia en la producción de armas ligeras."
 ALG_seriana_small_arms: "Fábrica de Armas Ligeras de Seriana"
 ALG_seriana_small_arms_desc: "Ubicada en el este de Argelia, la instalación de Seriana produce fusiles, pistolas y municiones para las fuerzas de seguridad argelinas. La fábrica opera bajo la supervisión del Ministerio de Defensa Nacional."
 ALG_dgi_missile_systems: "DGI - Direction Générale de l'Industrie Militaire"
 ALG_dgi_missile_systems_desc: "La Dirección General de la Industria Militar supervisa los sectores de fabricación de defensa de Argelia, incluidos el armamento guiado, los sistemas antitanque/antiaéreos y el desarrollo de artillería. Subordinada al Ministerio de Defensa Nacional, la DGI coordina las empresas estatales y las asociaciones técnico-militares para garantizar la autonomía estratégica."
 ALG_bcl_armored_development: "BCL - Brigade des Constructions Logistiques"
 ALG_bcl_armored_development_desc: "La Brigada de Construcciones Logísticas Militares se encarga del mantenimiento, la actualización y la producción nacional limitada de vehículos blindados. BCL se especializa en reacondicionar equipamiento de la era soviética y adaptar los vehículos a las condiciones operativas del Sáhara."
 ALG_snvi_vehicle_manufacturer: "SNVI - Société Nationale des Véhicules Industriels"
 ALG_snvi_vehicle_manufacturer_desc: "El fabricante nacional de vehículos de Argelia, establecido en 1967. SNVI produce camiones militares, vehículos utilitarios y vehículos blindados ligeros a través de asociaciones con Mercedes-Benz y otros fabricantes, con todos los diseños adaptados al terreno y al clima del norte de África."
 ALG_enmib_helicopter_unit: "ENMIB - Entreprise Nationale des Matériels et Infrastructures de Base"
 ALG_enmib_helicopter_unit_desc: "La instalación de mantenimiento y ensamblaje de helicópteros de Argelia, que presta servicios de revisión y producción limitada para la Fuerza Aérea Argelina. ENMIB se encarga del ensamblaje bajo licencia de diseños de helicópteros extranjeros."
 ALG_mers_el_kebir_shipyards: "Astillero Naval de Mers El-Kébir"
 ALG_mers_el_kebir_shipyards_desc: "Ubicada en el puerto estratégico de Mers El-Kébir, cerca de Orán, esta histórica instalación naval se encarga de la construcción y el mantenimiento de patrulleros y embarcaciones navales ligeras para la Armada Argelina."
 ALG_el_djazair_naval_industry: "CNAN - Compagnie Nationale Algérienne de Navigation"
 ALG_el_djazair_naval_industry_desc: "Compañía marítima nacional de Argelia. CNAN opera astilleros en Argel capaces de construir corbetas, fragatas y submarinos con asistencia técnica extranjera. La empresa también se encarga del transporte comercial y la logística naval."
 ALG_ersa_aircraft_manufacturer: "ERSA - Entreprise de Réparation et de Service Aéronautique"
 ALG_ersa_aircraft_manufacturer_desc: "La principal instalación de mantenimiento, reparación y revisión de aeronaves de Argelia. ERSA se encarga del ensamblaje limitado de aviones bajo licencia para la Fuerza Aérea Argelina y proporciona servicios técnicos aeronáuticos integrales."
 ALG_mio_header_equipment_reliability: "Fiabilidad del equipamiento"
