 SAU_shura_rebalanced_tt: "§YA Все три скамьи переоборудованы под 40 мест. §! - выборы в Совет остаются спорными, и устав не издан."
 SAU_shura_charter_ulema: "Совет старших ученых"
 SAU_shura_charter_ulema_desc: "Религиозное крыло Совета закреплено в Основном законе. Законодательство проверяется на соответствие нормам прежде, чем рассматриваться в каком-либо другом контексте, и учёные подчиняются исключительно королю.\n\nКоролевство сложнее сдвинуть с места и гораздо сложнее подорвать. Оно также перестаёт учиться так же быстро, как его соседи."
 SAU_shura_charter_technocrats: "Планировочный совет"
 SAU_shura_charter_technocrats_desc: "Совет становится тем, чем, по мнению его технократов, он всегда должен был быть — органом планирования, укомплектованным людьми, умеющими читать бухгалтерский баланс, с постоянным мандатом на промышленную и образовательную политику.\n\nКоролевство модернизируется быстрее, чем кто-либо ожидал. Это замечают те люди, с которыми с ним перестали консультироваться."
 SAU_shura_charter_notables: "Палата семей"
 SAU_shura_charter_notables_desc: "Крупные купеческие и племенные дома занимают постоянные места, а Совет становится местом, где вопросы покровительства Королевства обсуждаются открыто, а не в частном порядке.\n\nОн работает бесперебойно и недорого. Он не будет просить страну ни о чем сложном."
 SAU_events.220.t: "Планировщики требуют мандата."
 SAU_events.220.d: "Теперь технократы полностью контролируют Совет. Они подготовили проект, который сделает это положение постоянным — постоянный мандат на планирование в сфере промышленности, образования и бюджета, при этом состав Совета будет зафиксирован в Основном законе.\n\nКороль может подписать его и получить работающее правительство, или отказаться и сохранить палату, состав которой он сможет перераспределять по своему усмотрению."
 SAU_events.220.a: "Учредить Совет по планированию."
 SAU_events.220.b: "Совет остаётся таким, каким я его настройю."
 SAU_events.221.t: "Семьи излагают свою позицию."
 SAU_events.221.d: "В Совете заседают знатные люди, и они пришли в Диван с предложением, составленным людьми, которые вели переговоры с этой семьей на протяжении столетия: постоянные места для знатных домов в обмен на спокойствие, на сохранение которого король всегда рассчитывал.\n\nЭто самое дешевое и наименее амбициозное правительство из всех возможных."
 SAU_events.221.a: "Учредить Палату семей."
 SAU_events.221.b: "Совет остаётся таким, каким я его настройю."
 SAU_events.222.t: "Ученые просят внести их имена в список."
 SAU_events.222.d: "Улемы контролируют Совет и желают, чтобы он был включен в Основной закон — постоянный орган старших ученых, имеющий право первого чтения по каждому принятому Королевством закону.\n\nЭто решило бы вопрос о религиозной власти в Королевстве на целое поколение в пользу ученых, и это не может быть отменено последующим королем в плохом настроении."
 SAU_events.222.a: "Учредить Совет старших ученых."
 SAU_events.222.b: "Совет остаётся таким, каким я его настройю."
 SAU_junta_grip_firm: "Выдача судебных предписаний Советом"
 SAU_junta_grip_firm_desc: "Приказы, отданные в Эр-Рияде, исполняются в Джизане в ту же неделю. Губернаторы провинций отвечают на телефонные звонки, службы безопасности отчитываются перед вышестоящими инстанциями, а не перед подчиненными, и никто не ждет спокойно, чем все это закончится.\n\nЭто единственное преимущество правительства, состоящего из чиновников, перед тем, которое оно сменило."
 SAU_junta_grip_uneven: "Неравномерное письмо"
 SAU_junta_grip_uneven_desc: "Совет надлежащим образом управляет столицей и Восточной провинцией, а также остальной частью Королевства. Указания выполняются там, где за ними кто-то наблюдает.\n\nДостаточно удерживать страну. Недостаточно её изменить."
 SAU_junta_grip_slipping: "Действие судебного приказа прекращается на Кольцевой дороге."
 SAU_junta_grip_slipping_desc: "За пределами Эр-Рияда приказы Совета принимаются, архивируются и игнорируются людьми, которые подсчитывают, как долго это продлится. Командиры гарнизонов начали переписываться друг с другом, а не со столицей.\n\nПравительство, которому нельзя подчиняться, еще не пало, но разница между ними становится все тоньше."
 SAU_regency_deadline_tt: "§YРасплата наступит через пять лет.§! - указ должен быть продлен, возобновлен или ему должно быть позволено утратить силу."
 SAU_debug_shura_seat_jump: "§Y(DEBUG) Технократы +30 мест§!"
 SAU_debug_shura_seat_jump_desc: "Это позволяет увеличить число членов чартерного совета до более чем 70 человек, что и приводит к запуску чартерного мероприятия."
 SAU_debug_corp_readout: "§Y(DEBUG) Корпоративная политика§!: налог [?SAU_corp_tax|%1] миграция [?SAU_corp_migration|%1] работники [?SAU_corp_civ_workers|%1] ПИИ [?SAU_corp_fdi_cost|%1]"
 SAU_debug_corp_readout_desc: "Считывает переменные корпоративной и трудовой политики, в которые записываются пути Nitaqat и Kafala."
 SAU_debug_junta_control_up: "§Y(ОТЛАДКА) Контроль хунты +25§!"
 SAU_debug_junta_control_up_desc: "Повышает уровень поддержки Совета, чтобы проверить уровни его влияния."
 SAU_debug_junta_control_down: "§Y(ОТЛАДКА) Контроль хунты -25§!"
 SAU_debug_junta_control_down_desc: "Ослабляет контроль Совета, чтобы проверить эффективность штрафных санкций, применяемых в порядке упрощенного судопроизводства."
 SAU_water_national_company: "Национальная водопроводная компания"
 SAU_water_national_company_desc: "Опреснение, распределение и выставление счетов объединены в одном государственном предприятии, подотчетном министерству. Оно строит там, где Королевству нужна вода, а не там, где есть запасы, в чем и заключается его смысл, а также проблема.\n\nВода доходит до внутренних районов. Предприятие никогда не будет приносить прибыль, да и не было его создано."
 SAU_water_foreign_operators: "Иностранные операторы водоснабжения"
 SAU_water_foreign_operators_desc: "Заводы строятся, эксплуатируются и обслуживаются по контракту фирмами, которые делали это сотни раз до этого, на уровне, которого Королевство пока не могло бы достичь самостоятельно.\n\nВода чище и дешевле за кубометр. Контракты заключаются в долларах, и специалисты уезжают по мере необходимости."
 SAU_events.223.t: "Королевство, вкратце"
 SAU_events.223.d: "Краткое описание того, как будет вестись игра в этом королевстве, от тех, кому предстоит им управлять.\n\n§HБудущее Королевства§! — Это не кнопка, а баланс. Он меняется в зависимости от приоритетов, событий и реформ, проводимых королем, и определяет, насколько страна восприимчива к модернизации. Следите за ним; вы не можете им управлять.\n§HНефтяная зависимость§! - число от 0 до 100, которое постепенно увеличивается. §Yодин пункт каждые три месяца§! Сама по себе эта идея не имеет смысла. Решения о диверсификации и выборе приоритетных направлений её сводят на нет. Это главный аргумент всей кампании.\n§HКорпоративная и трудовая политика§! - в экономическом дереве. Выберите §Oквоты Нитакат§! (облагать налогами и нанимать саудовцев, терять иностранную рабочую силу) или §Yлиберализация Кафала§! (Дешевая рабочая сила и иностранный капитал за счет налоговых поступлений и рабочих мест для граждан). И то, и другое подпитывает реальный уровень безработицы в Королевстве.\n§HСоветы§! - Маджлис аш-Шура начинает заседание с самого начала. Посадите... §Oулема§!, §Yтехнократы§! или §Gизвестные люди§!Какая бы скамья ни возглавляла команду, она определяет свой характер и прошлое. §Y70 мест§! Вы можете присвоить ему постоянный статус. Народный совет формируется позже, принимает законопроекты, и его решения могут быть отклонены — за определенную плату.\n§HНаследование§! — Когда Фахд умирает, принцы начинают маневрировать. Они отступают назад, через решения наследного принца; тот, кто возглавит династию после смерти короля, займет трон, и каждый из них будет иметь свои собственные указания. §YСуд рассматривает лишь одно распоряжение за раз.§!\n§HАрмия§! — Сотрудники ведут собственный учет причитающихся им сумм. Пусть он идет своим чередом, и они примут соответствующие меры. §RВнимательно прочитайте протокол рассмотрения жалобы и урегулируйте спор, пока не поздно.§! — Переворот можно предотвратить, но нельзя отменить.\n§HАрабская весна§! — Если ситуация в регионе обострится, число участников беспорядков возрастет. В критической точке король выбирает: переждать и сохранить стабильность, или же §Rпусть монархия падет§! и передать страну переходному совету.\n§HРеспублика Аравия§! - трон не вечен, и есть §Yтри дороги от него§!Пусть офицеры захватят Эр-Рияд и §OПровозгласить Республику§! при военном правлении; сохранить трон в целости, но §Oпривести к власти партию, отличную от династии Аль Саудов.§!, что открывает возможность провозгласить Республику Аравия из Королевского Центра; или пусть §OАрабская весна достигла критической точки.§! и отойдите в сторону, кто объявит об этом за вас. §RВоенная дорога перекрывает две другие.§! - Королевство, в котором уже произошёл переворот, не может совершить гражданский переворот.\n\nВся вышеизложенная информация отображается на вкладках с вашими решениями. Ничего запоминать не нужно — всё написано на кнопках."
 SAU_events.223.a: "Понятно. Давайте начнём."
 SAU_tadawul_needs_market_tt: "§RТребуется, чтобы Tadawul был первым в списке. §! - завершить §HTadawul, Саудовская фондовая биржа. §! и каждое действие в этой ветви повысит ее уровень:"
 SAU_trials_of_the_old_order_choice_tt: "§YДалее следует выбор.§! — «В открытом судебном заседании, транслируемом по телевидению» / «Разрешите это в отеле «Ритц», как и прежде» / «Простите, по действующей цене». Это движется §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_crackdown_on_the_opposition_choice_tt: "§YДалее следует выбор.§! — «Начните с комитетов Восточной провинции» / «Поставьте проповеди на рассмотрение» / «Начните с подписавших петицию» / «Объедините все три дела». Это движется. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_water_pride_open_tt: "§YОткрывает суверенные воды§! — девять рангов от катастрофического до триумфального. Он отслеживает §Hстабильность§!: уверенная в себе страна верит, что вода потечет, потрясенная — нет. Он стабилизируется каждый месяц сам по себе."
 SAU_unif_road_still_open_tt: "§YСовет пока не обратился к другим вариантам. §! — обращение к новым партнерам или объявление автономии навсегда перекрывает путь для Америки."
 SAU_unif_usa_refused_tt: "§YВашингтон до сих пор не взял Мексиканский залив под свою опеку.§! - открыть, если вы не просили, или если американцы §Rотказался§!."
 SAU_unif_partners_refused_tt: "§YНи один сторонний партнер не взял Персидский залив под свое крыло§! - открыто, если вы не просили или если они §Rотказались§!."
 SAU_unif_not_yet_autonomous_tt: "§YСовет не провозгласил свою независимость§! - действовать в одиночку означает закрыть этот путь."
 SAU_unif_no_member_aligned_tt: "§YНи один член Совета не приглашал иностранную державу.§! - Турецкие или индийские базы, российские советники, внешние гарантии безопасности, закупки оружия или иностранные закупки — всё это перекрывает этот путь."
 SAU_intel_surveillance_bypass_tt: "§YОбходит собственные требования агентства§! - не требуется §HУлучшенные вычислительные ресурсы§! и не требуется §HДепартамент форм §! обновление не требуется"
 SAU_Intelligence_category_desc: "Главное разведывательное управление (ГРУ) является основным разведывательным органом Королевства, ответственным за сбор и анализ разведывательной информации как внутри страны, так и за рубежом. Оно играет решающую роль в обеспечении национальной безопасности, борьбе с терроризмом и стратегическом планировании.\n\n§GРазблокировка GIP§! Это позволит вам принимать решения, которые повысят ваши разведывательные возможности, предоставляя ценную информацию и преимущества как во внутренних, так и в международных делах.\n\nПринятие решения начнётся, когда вы достигнете определённого уровня. §G70%§! Уровень проникновения сети GIP в стране, и вероятность появления контента будет выше при высоком уровне проникновения. Если уровень проникновения упадет ниже 70%, контент станет недоступным."
 SAU_Foregin_affairs_category_desc: "§G Внешняя политика Саудовской Аравии§!\nВнешняя политика Королевства определяется тонким дипломатическим балансом. Будучи региональной державой и хранителем самых святых мест ислама, мы должны уметь выстраивать сложные альянсы, обеспечивать экономические интересы и поддерживать стабильность на Ближнем Востоке. Независимо от того, будем ли мы тесно сотрудничать с нашими традиционными западными союзниками, переориентируемся на развивающиеся восточные рынки или утвердим себя в качестве независимого регионального гегемона, наш дипломатический корпус проложит нам путь.\n\n Чтобы получить доступ к дополнительным решениям, связанным с зарубежными делами, необходимо выполнить задания или принять участие в специальном событии в процессе игры.\n\n Все принятые решения снова отобразятся через год после того, как вы их выбрали."
 SAU_domestic_external_category_desc: "Рычаги влияния Королевства на свою внутреннюю территорию, нефтяную отрасль и будущее за ее пределами.\n\n§HКак выглядят эти решения:§!\n§GОдомашненный§! Меры – строительные проекты, фонд развития и реформа рынка труда – откроются с помощью §Y«Экономическая либерализация»§!.\n§GМасло§! Действия - увеличение добычи, новые месторождения, сохранение запасов, нефтяное эмбарго и рычаги ОПЕК - разблокируются с помощью §Y«Сауди Арамко»§! и ее экспортную доктрину.\n§GДиверсификация§! Проекты — инвестиции PIF, гигапроекты, возобновляемые источники энергии, цифровая экономика, туризм и оборонная промышленность — открываются по мере их выполнения. §Y«Видение 2030»§! дерево.\n\n§HНекоторые решения требуют от вас больших усилий:§! а §Yновое нефтяное месторождение§! необходима производственная стратегия Aramco; §Yнефтяное эмбарго§! может быть только провозглашен §Gв мирное время§! пока ваша нефтяная экономика функционирует. Каждая из них требует времени и финансовых вложений, и большинство из них подталкивают вас к... §Hнефтяная зависимость§! вверх или вниз."
 SAU_vision2030_category_desc: "Гигапроекты Саудовской Аравии, каждый со своим сроком завершения. Необходимо профинансировать и завершить их вовремя, чтобы воплотить в жизнь концепцию «Видение 2030». Если сроки истекут, проекты превратятся в дорогостоящие памятники амбициям, тянущие «Видение» к провалу.\n\n Для каждого проекта будет приниматься решение, у каждого проекта есть срок, который отображается при наведении курсора на проект. Если сейчас 1848 год, следующее обновление срока принятия решения будет 1841 год (-7 дней).\n\n Если вы не завершили проект и срок истек, это приведет к снижению показателей в рамках концепции «Видение 2030». В противном случае, после завершения проекта, показатель будет увеличен."
 SAU_military_category_desc: "Долгосрочная программа восстановления вооруженных сил Королевства после потрясения §LОперация «Буря в пустыне»§! - от военных, которым это было необходимо §Lамериканский§! Воздушная мощь, логистика и командование для ведения боевых действий – все это в сочетании с современными вооруженными силами и настоящим противовесом. §LИран§!.\n\n§HКак это работает:§!\nКаждая реформа — это §Yрешение§! разблокировано военным §Yфокус§!Каждый открывает §Gвыбор доктрин§! - и каждая доктрина является преднамеренной §Rкомпромисс§!Укрепление сил одним способом, но издержки другим. Вы можете повторно провести реформу позже. §Yдоктрина переключения§!.\n\n§HТри этапа:§!\nПодготовка к действиям осуществляется поэтапно. §RНемодернизированный§! к §YВ реформе§! к §YМодернизация§! к §GМодернизированный§!Каждый этап раскрывает свой набор реформ, и вы должны §Yвыполнить все из них§! Перед открытием следующего этапа. Все начинается с победы. §LВоенные игры: уроки Персидского залива§!.\n\nКаждая выбранная вами доктрина влияет на... §LСаудовские военные§! национальный дух, где проявляется его совокупный эффект."
 SAU_crown_prince_category_desc: "[ROOT.GetSAUSuccessionPanel]"
 SAU_king_abdullah_category_desc: "Абдулла правил королевством с первого года его существования в качестве регента, пока Фахд был жив и правил как король с 2005 года. Его смерть в январе 2015 года решает вопрос о престолонаследии, и кто бы из них ни умер, этот вопрос будет решен. §YСалман§!, §YМохаммед бин Найеф§! или §YМутаиб§! Накопивший наибольшее влияние наследует как трон, так и собственный свод директив. Используйте §Yнаследный принц§! решения, принятые во время его правления, касались определения того, какие именно. Каждая директива занимает время суда. §Y60 дней§!И никакая вторая директива не может быть издана до тех пор, пока не будет выполнена первая."
 SAU_king_salman_category_desc: "Правление Салмана открывает второй поединок, §YМохаммед бин Салман§! против §YМохаммед бин Найеф§!, исход которого был решен в июне 2017 года. Вы можете короновать победителя сразу или оставить его наследным принцем. Если вы подождете, он займет трон, когда здоровье короля окончательно ухудшится, самое позднее к 2032 году. Следите за этим во вкладке §YНаследный принц§! и поддерживайте его или ослабляйте по своему усмотрению. Каждая директива занимает двор §Y60 дней§!, и вторая директива не может быть издана, пока не будет выполнена первая."
 SAU_king_mbs_category_desc: "Достичь этого можно, поддержав Мухаммеда бин Салмана в борьбе за престол во время правления короля Салмана, а затем либо объявив его королем в 2017 году, либо дождавшись ухудшения здоровья Салмана. Каждое из этих решений занимает важное место в дискуссиях. §Y60 дней§!И никакая вторая директива не может быть издана до тех пор, пока не будет выполнена первая."
 SAU_king_mbn_category_desc: "Достичь цели можно двумя способами: либо продвинуть Мухаммеда бин Найефа вперед Салмана и Мутаиба в гонке за престолонаследие в эпоху Абдаллы, либо назначить его наследным принцем при короле Салмане, и он переживет короля. Каждое из этих решений занимает время при дворе. §Y60 дней§!И никакая вторая директива не может быть издана до тех пор, пока не будет выполнена первая."
 SAU_king_mutaib_category_desc: "Достичь этого можно только одержав безоговорочную победу в гонке за преемственность в эпоху Абдуллы, опередив Салмана и Мохаммеда бин Найефа — путь аутсайдера. Дальнейшая преемственность после него не предопределена. Каждое новое распоряжение занимает место в суде. §Y60 дней§!И никакая вторая директива не может быть издана до тех пор, пока не будет выполнена первая."
 SAU_faisalite_category_desc: "Фейсал ибн Абдулазиз никогда не был изоляционистом. Он основал Всемирную мусульманскую лигу, и когда в 1969 году сгорела Аль-Акса, он в течение нескольких недель организовал встречу глав мусульманских государств в Рабате — создание Организации исламской конференции было его заслугой. После 1967 года он открыл казну Египту и Иордании в Хартуме, остановил экспедиционную армию Насера в горах Йемена, учредил Исламский банк развития, а в 1973 году превратил саму нефть в оружие и заставил Запад почувствовать это на себе. Самостоятельность никогда не была его целью. Это было его средством — силой, необходимой королевству, прежде чем оно могло говорить от имени уммы, не спрашивая ни у кого разрешения.\n\nЕго наследники унаследуют учение без участия самого человека, а вместе с ним и вопрос, на который ему никогда не приходилось отвечать. §OИзоляционизм§! Самостоятельность воспринимается как награда: закрытая граница, отсутствие клиентов, отсутствие крестовых походов, королевство, никому не подотчетное. §RИнтервенционизм§! Он поступает так же, как и Фейсал — закладывает фундамент, чтобы Эр-Рияд мог возглавить верующих и стоять вооруженным между блоками, а не позади какого-либо из них.\n\n§HГде сегодня находится Королевство§! - [ROOT.GetSAUFaisaliteLean]\n[ROOT.GetSAUFaisaliteLeanEffect]\n\n§HДирективы находятся в стадии реализации.§!: §Y[?SAU_faisalite_active|0]§! из §Y2§!Одновременно могут двигаться две дорожки с любой стороны, и каждая из них выплачивает выигрыш только после завершения своего хода.\n\nНаправления, события и решения, принимаемые ниже, — всё это влияет на эти показатели, и здесь ничего не покупается дёшево. Тот, кто окажется выше, когда будут воздвигнуты опоры, решит исход последнего из них. §RДоктрина Третьего Пути§! или §OВеликолепная изоляция§!."
 SAU_junta_category_desc: "Совет управляет двумя вещами и не владеет ни тем, ни другим в полной мере. §HКонтроль§! Это то, что она может обеспечить — гарнизоны, контрольно-пропускные пункты, штабы, люди, которые откликаются на призыв. §HЛегитимность§! Ему должны и то, и другое, а также ничего: ни выборов, ни фетвы, ни преемственности, только тот факт, что доспехи прибыли первыми.\n\nВсе, что приносит один доход, финансируется за счет другого. Легитимность падает на единицу каждый месяц, независимо от обстоятельств — хунта, которая просто тихо правит, — это хунта, у которой заканчивается время.\n\n§HВ нулевой момент у Совета есть девяносто дней, чтобы найти причину для своего существования. Если ему это не удастся, Королевство решит вопрос на месте.§!"
 SAU_officer_crisis_category_desc: "Расходы на устранение последствий аварии понесла регулярная армия, а Национальная гвардия — нет, и офицерский корпус выяснил, какой из этих фактов был преднамеренным. Ничто из этого не должно закончиться танками на улице Олайя. Так будет только в том случае, если ничего не будет предпринято.\n\n§HОфицерский корпус§! - [ROOT.GetSAUArmyGrievance] (§Y[?SAU_army_grievance|0]§! из §Y100§!)\n[ROOT.GetSAUArmyGrievanceEffect]\n\nКоличество жалоб растет каждый месяц само по себе. Доведите его до предела. §Y0§! И вы можете окончательно уладить все дела с офицерами; пусть это пройдет. §Y75§! Получив приказ о развертывании, они сами все уладят."
 SAU_modernisation_balance_of_power_category_desc: "Две точки зрения борются за душу §LКоролевство Саудовская Аравия§!. The §Rтрадиционалист§! лагерь - §LСовет старших ученых§!, то §Lкоролевский двор§!, то §Lстарейшины племени§! - хранит старые обычаи. §Gлиберализация§! лагерь - технократы, инженеры, получившие образование за рубежом, §LВидение 2030§! Сторонники – это те, кто добивается открытости, реформ и места за столом современного мира. Баланс меняется с каждым завершенным проектом и каждым принятым решением."
 SAU_spread_revolution_category_desc: "Народная Республика Аравия — это лишь первая искра. Революция должна распространиться до тех пор, пока каждый арабский рабочий не сбросит с себя оковы.\n\nЭта категория разблокируется один раз. §YНародная Республика Аравия§! завершено, и правит коммунистическое правительство. §YТранслируйте революцию§! повышает поддержку коммунистов внутри арабских стран, в то время как §YОсновал Арабский Коминтерн§! Объединяет штаты сослуживцев. §YНачало социалистической революции§! отсрочка принятия решения §Rскрытый§! в каждой арабской стране, пока ее коммунисты не достигнут §Y30%§! Поддержка, поэтому продолжайте трансляцию, пока она не появится. Как только она появится, зачеркните: в §Y50%§! или, точнее, революция полностью захватывает государство, в то время как §Y30-50%§! разжигает революционную гражданскую войну. Рабочие государства никогда не свергаются, их лишь принимают в свои ряды. §YАрабский Коминтерн§! через §YПриглашение в Арабский Коминтерн§!."
 SAU_pipeline_sabotage_category_desc: "Нефть из Королевства вывозится по трубопроводам, как и из всех остальных стран.\n\n§RЗаход на линию конкурента приводит к повышению цены на нефть и повышению температуры в регионе.§! в равной мере."
 SAU_coalition_member_category_desc: "Мы ответили на приглашение Эр-Рияда, и наши самолеты включены в график полетов. Сколько это стоит и как долго мы намерены продолжать платить за это – вопрос только для нас, и выход не закрыт."
 SAU_debug_category_desc: "Инструменты тестирования систем престолонаследия, правления и здоровья короля Салмана. Эта категория существует только в отладочной сборке — она невидима при обычном запуске и в многопользовательском режиме."
 SAU_proxy_aggression_desc: "Мы финансируем нападения на их народ. Они этого ещё долго не забудут."
 SAU_traditionalist_bop_left_side_desc: "Он §LВаххабитское духовенство§!консервативных князей и племенных шейхов. Они сохраняют характер Королевства, но сопротивляются переменам, которых требует мир."
 SAU_liberalisation_bop_right_side_desc: "Он §Lтехнократы§!инженеры, получившие образование за рубежом, и князья-реформаторы. Они открывают двери Королевства — ценой нарушения установленного порядка."
 SAU_modernisation_bop_centre_range_desc: "Ни традиции, ни реформы не доминируют. Королевство держится стабильно — пока что."
 SAU_traditionalist_bop_low_range_desc: "Духовенство и консерваторы имеют §Yнебольшое преимущество§!Королевство действует осторожно."
 SAU_traditionalist_bop_medium_range_desc: "Традиция – это §Hнаправляющая рука§!Предложенные реформы оцениваются с учетом многовекового опыта и, как правило, оказываются несостоятельными."
 SAU_traditionalist_bop_advanced_range_desc: "Он §LСовет старших ученых§! Определяет повестку дня. Модернисты — это... §Yмаргинализированные§! или §Yизгнанный§!Царство обращено внутрь себя."
 SAU_traditionalist_bop_win_range_desc: "Правление §Lulema§! существует лишь формально. Мир взывает, но Царствие не отвечает. Традиция §Rwon§!, и цена за это — потерянные десятилетия."
 SAU_liberalisation_bop_low_range_desc: "У реформаторов есть §Gзацепка§!Новые офисы, новые школы, новые идеи просачиваются сквозь щели."
 SAU_liberalisation_bop_medium_range_desc: "Программа §Lнаследного принца§! — это новая ортодоксия. Университеты расширяются, открывается туризм, женщины садятся за руль."
 SAU_liberalisation_bop_advanced_range_desc: "Реформы наслаиваются на реформы. §Lулема§! ворчание; §Lплемена§! роптать; но §Gшаг§! Не замедляется. Королевство меняется быстрее, чем его жители успевают это усваивать."
 SAU_liberalisation_bop_win_range_desc: "Саудовская Аравия §Gнеузнаваемый§! из Королевства 2000 года. Иностранный капитал, иностранный туризм, иностранная культура. Реформаторы имеют §Gвыиграл§! - но §Yсвященнослужители§! не забыл."
 SAU_Monarchy_house_of_al_saud_desc: "Дом Аль Саудов — правящая семья Королевства Саудовская Аравия. Он был основан Абдулазизом ибн Саудом в 1932 году и с тех пор сохраняет контроль над страной благодаря сочетанию политических союзов, религиозной легитимности и экономической мощи, полученной за счет нефтяных богатств."
 SAU_Military_Rule_desc: "Королевством управляет Высший военный совет. Трон остается за властью, министерства подчиняются другим ведомствам, а офицеры, захватившие Эр-Рияд, обнаруживают, что удерживать страну гораздо сложнее, чем захватить ее."
 SAU_gip_network: "§HGIP Сеть станций§!"
 SAU_gip_network_tt: "Штаб, офицеры по обеспечению безопасности и оперативной работе — постоянный резерв администрации президента.\n"
 SAU_gip_slots_cap_tt: "§YПрезидентство может содержать максимум 3 дополнительных офицера§! - станции построены, и больше открывать нечего."
 SAU_stage1_decision_gate_tt: "§YЭто решение появляется после начала первого этапа.§!"
 SAU_stage2_decision_gate_tt: "§YЭто решение будет принято после начала второго этапа.§!"
 SAU_stage3_decision_gate_tt: "§YЭто решение вступает в силу после начала III этапа.§!"
 SAU_vision2030_commitment_tt: "§RКоролевство теперь взяло на себя обязательство: завершить проекты, иначе его ждут последствия в виде невыполненных обещаний.§!"
 SAU_tadawul_matured_tt: "§GБиржа Tadawul достигла полного листинга§! - дальнейшее привлечение средств невозможно, поэтому средства, выделенные на размещение акций, пойдут на строительство новых офисных помещений§H§!:"
 SAU_events.402.t: "Соперничество отложено в сторону"
 SAU_events.402.d: "Предложение Тегерана принято. Посольства откроются, кампания против Исламской Республики завершится, а проповеди священнослужителей, называвших нас узурпаторами, будут тихо отредактированы. Оружие «Хезболлы» отвернется от нас вместе с оружием их покровителя. Соперничество не забыто, но пока отложено в сторону."
 SAU_events.402.a: "Более холодный мир, чем дружба, и лучше, чем альтернатива."
 SAU_accession_to_the_sco: "Вступление в ШОС"
 SAU_accession_to_the_sco_desc: "Эр-Рияд стал партнером по диалогу Шанхайской организации сотрудничества в 2023 году. Полноправное членство углубит отношения с Китаем и Россией, но также потребует более тесного сотрудничества с Ираном."
 SAU_the_royal_saudi_air_force: "Королевские военно-воздушные силы Саудовской Аравии"
 SAU_the_royal_saudi_air_force_desc: "Превратить Королевские военно-воздушные силы Саудовской Аравии (RSAF) в сильнейшие военно-воздушные силы в Персидском заливе."
 SAU_peace_sun_f_15_eagle_program: "Peace Sun: Программа F-15 Eagle"
 SAU_peace_sun_f_15_eagle_program_desc: "Запуск программы «Солнце мира» совместно с Соединенными Штатами с целью поставки истребителей F-15 Eagle в Королевство."
 SAU_f_15c_d_eagle_squadrons: "Эскадрильи истребителей F-15C/D «Игл»"
 SAU_f_15c_d_eagle_squadrons_desc: "Выставить эскадрильи истребителей F-15C/D Eagle для завоевания и удержания превосходства в воздухе над Саудовской Аравией."
 SAU_f_15s_eagle: "F-15S Eagle"
 SAU_f_15s_eagle_desc: "Приобретите истребитель F-15S Eagle в рамках IX Мирного Солнца, способный вести воздушные бои и наносить удары вглубь территории противника."
 SAU_tornado_gr4: "Торнадо GR4"
 SAU_tornado_gr4_desc: "Соглашение «Аль-Ямама» с Великобританией позволит принять на вооружение Саудовской Аравии самолеты Tornado GR4. Их ударные возможности обусловлены длительной зависимостью от британской подготовки, поставок запчастей и технического обслуживания."
 SAU_panavia_tornado: "Панавия Торнадо"
 SAU_panavia_tornado_desc: "Эскадрильи самолетов Panavia Tornado выполняют задачи по нанесению ударов, разведке и противовоздушной обороне."
 SAU_the_european_typhoon_al_salam_deal: "Европейский тайфун: сделка по Аль-Саламу"
 SAU_the_european_typhoon_al_salam_deal_desc: "Подписать соглашение с компанией Al Salam о поставке истребителя Typhoon, современного многоцелевого истребителя для нового столетия."
 SAU_f_15sa_advanced_eagle: "F-15SA Advanced Eagle"
 SAU_f_15sa_advanced_eagle_desc: "F-15SA — это больше, чем просто покупка. Его авионика, вооружение и требования к техническому обслуживанию обуславливают необходимость наличия у Саудовской Аравии базы поддержки, способной обеспечить бесперебойную работу этого передового истребителя."
 SAU_e_3_sentry_awacs: "E-3 Sentry ДРЛО"
 SAU_e_3_sentry_awacs_desc: "Управляйте самолетом ДРЛО E-3 Sentry, чтобы видеть и контролировать всю воздушную обстановку и направлять истребители."
 SAU_aerial_refueling_fleet: "Флот самолетов-заправщиков"
 SAU_aerial_refueling_fleet_desc: "Создать флот самолетов-заправщиков, чтобы саудовские истребители могли патрулировать все королевство и наносить удары на большие расстояния."
 SAU_c_130_hercules_airlift: "Самолет C-130 Hercules Airlift"
 SAU_c_130_hercules_airlift_desc: "Расширьте флот самолетов C-130 Hercules, чтобы быстро перебрасывать войска и припасы в любую точку мира."
 SAU_king_abdulaziz_air_base: "Авиабаза имени короля Абдулазиза"
 SAU_king_abdulaziz_air_base_desc: "Развитие авиабазы имени короля Абдулазиза в Дахране, обеспечивающей охрану Восточной провинции и Персидского залива."
 SAU_king_khalid_air_base: "Авиабаза имени короля Халида"
 SAU_king_khalid_air_base_desc: "Развитие авиабазы имени короля Халида в Хамис-Мушайте, укрепленной базы на юге Йемена, охватывающей границу с этим регионом."
 SAU_prince_sultan_air_base: "Авиабаза принца Султана"
 SAU_prince_sultan_air_base_desc: "Развитие авиабазы имени принца Султана в Аль-Хардже, центрального транспортного узла в глубине Королевства."
 SAU_precision_guided_munitions: "Высокоточные управляемые боеприпасы"
 SAU_precision_guided_munitions_desc: "Накопить высокоточные бомбы и ракеты, чтобы одним вылетом можно было уничтожить то, что раньше требовало множества вылетов."
 SAU_saudi_uav_program: "Саудовская программа беспилотных летательных аппаратов"
 SAU_saudi_uav_program_desc: "Запустить саудовскую программу по использованию беспилотников для наблюдения на больших расстояниях и нанесения высокоточных ударов."
 SAU_air_operations_command: "Командование воздушных операций"
 SAU_air_operations_command_desc: "Создать центральное командование воздушных операций для планирования и проведения всей воздушной кампании как единого целого."
 SAU_secure_support_in_the_al_madinah_province: "Оказание поддержки в провинции Медина"
 SAU_secure_support_in_the_al_madinah_province_desc: "В Медине находится мечеть Пророка и влиятельная духовная элита. Заручившись поддержкой её учёных, можно будет легитимизировать Собор и уменьшить религиозную оппозицию."
 SAU_the_house_of_al_saud: "Дом Аль Саудов"
 SAU_the_house_of_al_saud_desc: "Абдулазиз ибн Сауд установил систему престолонаследия, согласно которой трон передавался между его сыновьями по старшинству. После шести королей и семидесяти лет оставшиеся достойные братья стареют, и королевство должно подготовиться к передаче престола следующему поколению."
 SAU_ground_broken_at_rabigh: "Началось строительство в Рабигхе."
 SAU_ground_broken_at_rabigh_desc: "Королевство начнет строительство экономического города площадью 68 квадратных километров в Рабиге, рассчитанного на два миллиона жителей и являющегося крупным портом на Красном море. Это крупнейший из шести экономических городов, призванных привлечь частные инвестиции наряду с государственным финансированием."
 SAU_hold_municipal_elections: "Провести муниципальные выборы"
 SAU_hold_municipal_elections_desc: "Мужчины старше двадцати одного года будут избирать половину членов муниципального совета, а остальные места назначает правительство. Советы обладают ограниченными полномочиями в таких вопросах, как водоотведение, уличное освещение и выдача разрешений, но это голосование создает важный политический прецедент."
 SAU_establish_the_peoples_council: "Создать Народный совет"
 SAU_establish_the_peoples_council_desc: "Королевство создаст выборный совет, уполномоченный предлагать законы по внутренним делам. Король сохранит абсолютное право вето, но его осуществление повлечет за собой ощутимые политические издержки."
 SAU_securing_our_future: "Обеспечение нашего будущего"
 SAU_securing_our_future_desc: "Королевство ужесточит контроль над публикациями посредством лицензирования, назначения редакторов и ограничений на освещение деликатных тем. Это ослабит организованную оппозицию и укрепит режим, но также отпугнет квалифицированных выпускников от возвращения в страну и помешает министерствам получать честную критику."
 SAU_intervention_in_bahrain: "Вмешательство в Бахрейне"
 SAU_intervention_in_bahrain_desc: "В марте 2011 года силы «Щит полуострова» вмешались в ситуацию в Бахрейне по просьбе правительства Бахрейна и помогли подавить беспорядки в Манаме. Королевство возобновит эту поддержку и подготовится к защите Дома Халифы, не дожидаясь очередного саммита ССГПЗ."
 SAU_investigate_the_east: "Исследуйте Восток"
 SAU_investigate_the_east_desc: "Протесты в Катифе и Авамии вышли за рамки требований, связанных с безработицей и задержанными, и переросли в более широкие политические претензии. Министерство внутренних дел проведет расследование деятельности оппозиции в Восточной провинции и примет меры против выявленных угроз."
 SAU_women_in_the_shura_council: "Женщины в Совете Шуры"
 SAU_women_in_the_shura_council_desc: "В состав Консультативного совета не входила ни одна женщина, хотя Основной закон не запрещает их назначение. Король может назначать женщин напрямую, но он обязан это делать, несмотря на ожидаемое противодействие со стороны консервативных ученых."
 SAU_the_oil_defense_strategy: "Стратегия защиты нефтяной отрасли"
 SAU_the_oil_defense_strategy_desc: "Королевство зависит от небольшого количества нефтяных установок вдоль побережья Персидского залива. Единая стратегия защиты нефтяных объектов позволит скоординировать бюджет и обеспечить безопасность этих сооружений, пока государство разрабатывает им альтернативные варианты."
 SAU_national_security_threats: "Угрозы национальной безопасности"
 SAU_national_security_threats_desc: "Национальная безопасность Саудовской Аравии сталкивается с четырьмя взаимосвязанными угрозами: войной на южной границе, вербовкой джихадистов, беспорядками среди шиитского населения вблизи нефтяных месторождений и поддерживаемыми Ираном группировками на границах Королевства. Будет создана единая служба для оценки и координации политики по борьбе со всеми четырьмя угрозами."
 SAU_the_riyadh_meeting_operation_decisive_storm: "Встреча в Эр-Рияде: Операция «Решающий шторм»"
 SAU_the_riyadh_meeting_operation_decisive_storm_desc: "Коалиция из девяти государств собралась в Эр-Рияде и 26 марта 2015 года начала операцию «Решительный шторм», сочетающую воздушные операции с морской блокадой. Саудовские планировщики ожидали короткой кампании, несмотря на предупреждения йеменцев, знакомых с конфликтом."
 SAU_the_tenth_five_year_plan: "Десятый пятилетний план"
 SAU_the_tenth_five_year_plan_desc: "Десятый пятилетний план устанавливает целевые показатели роста экономики за счет несырьевых источников, повышения занятости в Саудовской Аравии и диверсификации экономики. Предыдущие планы содержали аналогичные обещания, но сокращение запасов делает их реализацию все более актуальной."
 SAU_defying_the_ajam: "Вопреки Аджаму"
 SAU_defying_the_ajam_desc: "Казнь Нимра аль-Нимра, поджог посольства Саудовской Аравии в Тегеране и разрыв дипломатических отношений резко обострили соперничество с Ираном. Королевство скорее примет экономические и дипломатические издержки, чем продемонстрирует готовность уступить."
 SAU_aramco_ipo: "IPO компании Aramco"
 SAU_aramco_ipo_desc: "В декабре 2019 года Саудовская Аравия разместила 1,5% акций Aramco на бирже Tadawul, получив около $25 млрд. Продажа не достигла предложенной наследным принцем оценки в два триллиона долларов и не привела к выходу на зарубежные рынки, но осталась крупнейшей продажей государственных активов в регионе."
 SAU_vision_2030_announced: "Объявлена программа «Видение 2030»."
 SAU_vision_2030_announced_desc: "Программа «Видение 2030» была объявлена в апреле 2016 года и включала в себя цели по созданию суверенного фонда в размере двух триллионов долларов, снижению зависимости от нефти, увеличению занятости в частном секторе и масштабным социальным реформам. В отличие от более ранних планов диверсификации, она устанавливает четкий срок для их реализации."
 SAU_saudi_israel_normalization_track: "Путь нормализации отношений между Саудовской Аравией и Израилем"
 SAU_saudi_israel_normalization_track_desc: "У Саудовской Аравии нет договорных отношений или посольских связей с Израилем, но она разрешает израильские полеты и поддерживает конфиденциальные контакты в разведывательных службах. Эр-Рияд продолжает публично требовать прогресса в палестинском вопросе, в то время как в частном порядке обсуждает нормализацию отношений на других условиях."
 SAU_establish_corruption_courts: "Создать суды по борьбе с коррупцией"
 SAU_establish_corruption_courts_desc: "Королевство создаст специализированные суды по борьбе с коррупцией и постоянную комиссию, в юрисдикцию которой будут входить министры и князья. Их авторитет будет зависеть от того, будут ли они преследовать в судебном порядке как высокопоставленных обвиняемых, так и рядовых чиновников."
 SAU_the_ritz_carlton_purge: "«Чистка в Ритц-Карлтоне»"
 SAU_the_ritz_carlton_purge_desc: "В ходе антикоррупционной кампании было задержано около двухсот принцев и бизнесменов в отеле Ritz-Carlton, а также возвращены значительные активы. Кроме того, это укрепило власть наследного принца над королевской семьей."
 SAU_backdoor_deals: "Сделки через обратный канал"
 SAU_backdoor_deals_desc: "Задержанные из отеля Ritz-Carlton будут освобождены после заключения частных соглашений о разделе имущества, а не в результате публичных судебных разбирательств. Это позволит быстро вернуть активы, но отсутствие прозрачности в судебных процессах подорвет доверие к верховенству права."
 SAU_a_new_kingdom: "Новое царство"
 SAU_a_new_kingdom_desc: "Абдулла правил от имени Фахда на протяжении большей части десятилетия, предшествовавшего его смерти. Его вступление в должность оставляет конституционный порядок неизменным, но наделяет его прямыми полномочиями по реализации политики, которую он ранее лишь предлагал."
 SAU_consolidating_the_crown: "Укрепление короны"
 SAU_consolidating_the_crown_desc: "Королевский указ создаст Совет верности, состоящий из сыновей и внуков Абдулазиза, для утверждения наследных принцев и оценки пригодности короля к престолонаследию. Это создаст первую письменную процедуру престолонаследия, хотя способность Совета ограничивать короля остается неопределенной."
 SAU_scholarship_programs_abroad: "Стипендиальные программы за рубежом"
 SAU_scholarship_programs_abroad_desc: "Программа стипендий позволит десяткам тысяч саудовцев и их семьям получить образование за рубежом. Она расширит квалифицированную рабочую силу Королевства, а также познакомит студентов с политическими и социальными системами, отличающимися от саудовской."
 SAU_expand_the_national_guard: "Расширить Национальную гвардию"
 SAU_expand_the_national_guard_desc: "Национальная гвардия формируется из племен, исторически лояльных Абдулазизу, и действует вне рамок регулярного военного командования. Ее расширение обеспечивает защиту трона и предотвращает контроль над всеми вооруженными силами в королевстве со стороны регулярного офицерского корпуса."
 SAU_joining_the_wto: "Вступление в ВТО"
 SAU_joining_the_wto_desc: "После двенадцати лет переговоров Королевство вступит в ВТО, установив обязательные тарифы, открыв сектор услуг, приняв иностранные банки и страховые компании, а также пересмотрев коммерческое право. Членство ограничивает некоторую коммерческую автономию, но дает Саудовской Аравии право голоса в системе, регулирующей ее экспорт нефти."
 SAU_al_saud_national_dialogue: "Национальный диалог"
 SAU_al_saud_national_dialogue_desc: "Национальный диалог объединяет шиитских священнослужителей, салафитских ученых, женщин и мужчин для обсуждения национальных проблем и представления своих выводов королю. Он не имеет законодательной силы, но позволяет вести необычайно широкую общественную дискуссию."
 SAU_counter_terrorism_cooperation: "Сотрудничество в борьбе с терроризмом"
 SAU_counter_terrorism_cooperation_desc: "Теракты 2003 года показали, что «Аль-Каида» нацелена как на саудовское государство, так и на американцев, находящихся в Королевстве. Саудовская Аравия ответит рейдами, составлением списков наблюдения, финансовыми расследованиями и программами реабилитации боевиков в тесном сотрудничестве с американской разведкой."
 SAU_the_atlantic_realignment: "Атлантическая перестройка"
 SAU_the_atlantic_realignment_desc: "Совет будет добиваться признания и поддержки со стороны Вашингтона, подчеркивая, что экспорт саудовской нефти продолжится при новом правительстве. Это покажет, ценят ли Соединенные Штаты свои отношения с саудовским государством больше, чем свергнутую монархию."
 SAU_foreign_water_operators: "Иностранные операторы водоснабжения"
 SAU_foreign_water_operators_desc: "Программа по опреснению воды выставляется на международный тендер. Заводы строятся быстрее, чем любые другие сооружения, возведенные Королевством самостоятельно, а управляющие ими люди подчиняются головному офису за границей.\n\n§GГранты иностранным операторам водоснабжения§! и §Yоблегчает водный кризис на один шаг§!ценой §RАмериканское влияние в Королевстве§!.\n\nЭффективно и всегда под рукой."
 SAU_among_the_major_powers: "Среди крупнейших держав"
 SAU_among_the_major_powers_desc: "Нефть делает Королевство незаменимым, но незаменимость — это не то же самое, что безопасность. Необходимо выйти за пределы региона и обратиться к державам, формирующим мировой порядок, чтобы решить, на кого из них Эр-Рияд будет опираться."
 SAU_anti_iranian_propaganda: "Антииранская пропаганда"
 SAU_anti_iranian_propaganda_desc: "Королевство будет использовать свои медиасети для критики Исламской Республики и укрепления поддержки суннитов в противостоянии иранскому влиянию."
 SAU_appoint_loyalists_in_the_provinces: "Назначить лоялистов в провинциях"
 SAU_appoint_loyalists_in_the_provinces_desc: "Новое правительство заменит королевских губернаторов провинций лояльными действующими офицерами. Это устранит важный источник власти княжеств и передаст провинции под военный контроль."
 SAU_unity_freedom_socialism: "Единство, свобода, социализм"
 SAU_unity_freedom_socialism_desc: "Три слова партии Баас стали законом страны: единство арабской нации, освобождение от колонизатора и социализм для народа."
 SAU_cells_across_the_arab_world: "Клетки по всему арабскому миру"
 SAU_cells_across_the_arab_world_desc: "Партия создаст баасистские ячейки в арабских столицах для организации и поддержки будущих революций."
 SAU_the_sword_of_unity: "Меч Единства"
 SAU_the_sword_of_unity_desc: "Арабские государства, отвергающие добровольное объединение, будут силой втянуты в новый порядок."
 SAU_purge_the_reactionaries: "Изгнать реакционеров"
 SAU_purge_the_reactionaries_desc: "Революционное правительство свергнет монархистов, исламистов и иностранных агентов, угрожающих правлению партии Баас."
 SAU_the_united_arab_republic: "Объединенная Арабская Республика"
 SAU_the_united_arab_republic_desc: "Арабские земли будут объединены в единое революционное государство, которое будет называться Объединенной Арабской Республикой."
 SAU_one_arab_nation: "Единая арабская нация"
 SAU_one_arab_nation_desc: "Сотрите границы, проведенные Сайксом и Пико, и научите целое поколение тому, что существует лишь одна арабская нация, несущая вечное послание."
 SAU_the_vanguard_of_the_arabs: "Авангард арабов"
 SAU_the_vanguard_of_the_arabs_desc: "Аравия будет претендовать на лидерство в арабском мире от Атлантики до Персидского залива и возглавит более широкое националистическое движение."
 SAU_expel_the_imperialists: "Изгнать империалистов"
 SAU_expel_the_imperialists_desc: "Вытесните последние иностранные базы и советников с арабской земли и разорвите неравноправные договоры колониальной эпохи."
 SAU_industrialize_the_nation: "Индустриализировать страну"
 SAU_industrialize_the_nation_desc: "В рамках национального плана промышленного развития будут построены металлургические заводы, плотины и фабрики, чтобы республика могла производить собственные товары первой необходимости и оружие."
 SAU_the_revolutionary_command_council: "Революционный командный совет"
 SAU_the_revolutionary_command_council_desc: "Возложить высшую власть на совет лидеров партии, объединив партию и государство в единую революционную волю."
 SAU_pan_arab_solidarity: "Панарабская солидарность"
 SAU_pan_arab_solidarity_desc: "Поддержите все арабские борьбы от Палестины до Магриба и сделайте Аравию покровительницей националистического дела."
 SAU_build_the_party: "Создайте вечеринку"
 SAU_build_the_party_desc: "Революция организует дисциплинированную партию с ячейками, простирающимися от деревень до национального руководства."
 SAU_arab_republic_secular_republic: "Светская республика"
 SAU_arab_republic_secular_republic_desc: "Отделить мечеть от государства и объединить нацию на основе арабской идентичности, а не секты, чтобы сунниты и шииты, мусульмане и христиане стояли единым целым."
 SAU_the_arab_socialist_path: "Арабский социалистический путь"
 SAU_the_arab_socialist_path_desc: "Отвергнуть и капитализм, и советский коммунизм в пользу особого арабского социализма: господствующие позиции в руках народа, свобода мелкого торговца."
 SAU_nationalize_the_heights: "Национализировать Высоты"
 SAU_nationalize_the_heights_desc: "Захватить нефть, банки и крупные предприятия у иностранных концессионеров и старых семей и направить их богатства на благо нации."
 SAU_land_to_the_peasants: "Земля крестьянам"
 SAU_land_to_the_peasants_desc: "Разделить крупные поместья и передать землю феллахам, которые будут ее обрабатывать, положив конец феодальному господству над сельской местностью."
 SAU_the_officer_corps: "Офицерский корпус"
 SAU_the_officer_corps_desc: "Партия будет набирать молодых офицеров и использовать вооруженные силы для обучения и навязывания доктрины баасизма."
 SAU_arm_the_vanguard: "Вооружите авангард"
 SAU_arm_the_vanguard_desc: "Наряду с регулярной армией будет создана политически надежная партийная милиция."
 SAU_forge_the_national_army: "Создайте национальную армию"
 SAU_forge_the_national_army_desc: "Создать современную механизированную армию, достойную арабского народа и способную вывести революцию за пределы наших границ."
 SAU_saudi_aramco: "Саудовская Арамко"
 SAU_saudi_aramco_desc: "Он §YСаудовская нефтяная компания§! Это крупнейшее нефтяное предприятие в мире и основа Королевства. Это подразделение строит нефтяной сектор месторождение за месторождением, а затем обязуется перед Aramco выполнить ряд задач. §Yстратегическая доктрина§! - §YУвеличьте добычу, переработайте больше сырья или экспортируйте продукцию для получения максимальной прибыли.§! - все питают одинокого человека §YСаудовская Арамко§! национальный дух."
 SAU_arm_the_anti_iranian_groups: "Вооружите антииранские группировки"
 SAU_arm_the_anti_iranian_groups_desc: "Королевство будет вооружать антиправительственные группировки среди белуджского и арабского меньшинств Ирана, распространяя конфликт на территорию Ирана."
 SAU_the_saudi_armed_forces: "Вооруженные силы Саудовской Аравии"
 SAU_the_saudi_armed_forces_desc: "Объединить и модернизировать сухопутные, морские и воздушные силы Королевства в единую профессиональную армию."
 SAU_lessons_of_the_gulf_war: "Уроки войны в Персидском заливе"
 SAU_lessons_of_the_gulf_war_desc: "В 1990 году Ирак Саддама Хусейна захватил Кувейт и сосредоточил силы на нашей границе; только иностранная коалиция спасла Королевство, и битва при Хафджи произошла на саудовской земле. Операция «Буря в пустыне» показала, насколько мы зависимы от других — этого никогда больше не повторится."
 SAU_ministry_of_defence_and_aviation: "Министерство обороны и авиации"
 SAU_ministry_of_defence_and_aviation_desc: "Реорганизовать Министерство обороны и авиации (МОА) в современное командование, способное планировать, составлять бюджет и руководить всеми вооруженными силами."
 SAU_the_general_staff: "Генеральный штаб"
 SAU_the_general_staff_desc: "Создайте профессиональный Генеральный штаб для разработки военных планов, проведения учений и управления операциями."
 SAU_the_royal_saudi_land_forces: "Королевские сухопутные войска Саудовской Аравии"
 SAU_the_royal_saudi_land_forces_desc: "Превратить Королевские сухопутные войска Саудовской Аравии (РССФ) в современную мобильную армию со штабом в Эр-Рияде."
 SAU_saudi_arabian_national_guard: "Национальная гвардия Саудовской Аравии"
 SAU_saudi_arabian_national_guard_desc: "Расширить Национальную гвардию Саудовской Аравии (SANG), племенное формирование, лояльное трону и охраняющее королевскую семью и священные города."
 SAU_king_abdulaziz_royal_guard: "Королевская гвардия короля Абдулазиза"
 SAU_king_abdulaziz_royal_guard_desc: "Укрепить Королевский гвардейский полк, элитное подразделение, поклявшееся защищать личность короля."
 SAU_m1a2_abrams_main_battle_tank: "Основной боевой танк M1A2 Abrams"
 SAU_m1a2_abrams_main_battle_tank_desc: "Приобретите американский танк M1A2 Abrams, самый тяжелый и боеспособный танк в регионе и основу бронетехники Саудовской Аравии."
 SAU_armored_brigades: "Бронетанковые бригады"
 SAU_armored_brigades_desc: "Формировать и оснащать бригады тяжелой бронетехники для решающих маневренных боевых действий в открытой пустыне."
 SAU_mechanized_infantry: "Механизированная пехота"
 SAU_mechanized_infantry_desc: "Сформируйте механизированную пехоту для удержания позиций и поддержки бронированных передовых отрядов."
 SAU_m109_self_propelled_artillery: "Самоходная артиллерийская установка М109"
 SAU_m109_self_propelled_artillery_desc: "Внедрение самоходной гаубицы М109 обеспечит дивизиям мобильную и защищенную огневую поддержку."
 SAU_astros_ii_rocket_artillery: "Ракетная артиллерия ASTROS II"
 SAU_astros_ii_rocket_artillery_desc: "Приобретите бразильский реактивный ракетный комплекс ASTROS II для массированных бомбардировок на большие расстояния."
 SAU_royal_saudi_strategic_missile_force: "Королевские стратегические ракетные силы Саудовской Аравии"
 SAU_royal_saudi_strategic_missile_force_desc: "Создать Стратегические ракетные силы как отдельное подразделение, являющееся стратегическим сдерживающим фактором Королевства."
 SAU_df_3_ballistic_missiles: "Баллистические ракеты DF-3"
 SAU_df_3_ballistic_missiles_desc: "Секретная закупка китайских ракет DF-3 в 1988 году обеспечила Эр-Рияду стратегический потенциал, который не могла игнорировать ни одна соседняя столица. Необходимо создать силы, которые обеспечат надежность этого сдерживающего потенциала."
 SAU_army_aviation_and_apache_gunships: "Армейская авиация и боевые вертолёты Apache"
 SAU_army_aviation_and_apache_gunships_desc: "Создайте командование армейской авиации и приобретите вертолет AH-64 Apache, истребитель танков, для собственных военно-воздушных сил армии."
 SAU_special_forces_command: "Командование Сил специального назначения"
 SAU_special_forces_command_desc: "Создайте командование спецназа для проведения рейдов, борьбы с терроризмом и разведки в тылу врага."
 SAU_roll_back_iran_in_the_gulf: "Остановить Иран в Персидском заливе"
 SAU_roll_back_iran_in_the_gulf_desc: "Иран использует политические и военизированные сети для расширения своего влияния в Бахрейне, Ираке и других странах Персидского залива. Королевство будет оказывать поддержку местным правительствам и фракциям, способным ослабить это влияние."
 SAU_the_basra_grid_connection: "Подключение к электросети Басры"
 SAU_the_basra_grid_connection_desc: "Южный Ирак страдает от отключений электроэнергии, одновременно используя иранские источники. Необходимо подключить Басру к энергосистеме Персидского залива и заменить иранскую электроэнергию саудовской."
 SAU_counter_iranian_influence: "Противодействие иранскому влиянию"
 SAU_counter_iranian_influence_desc: "Иранские ополченцы и деньги хлынули в вакуум, образовавшийся после ухода Саддама. Начинается долгая кампания по освобождению Ирака от власти Исламской Республики."
 SAU_buy_the_iraqi_parliament: "Купите иракский парламент"
 SAU_buy_the_iraqi_parliament_desc: "Королевство будет использовать финансовую поддержку для обеспечения расположения иракских парламентских блоков и министров. Цель состоит в том, чтобы сместить Багдад от Тегерана к Эр-Рияду."
 SAU_chinese_mediation: "Китайское посредничество"
 SAU_chinese_mediation_desc: "Китай является крупным клиентом как Саудовской Аравии, так и Ирана и предложил выступить посредником между ними. Принятие им этой роли может стабилизировать отношения, но не разрешить более широкое стратегическое соперничество."
 SAU_the_agrarian_revolution: "Аграрная революция"
 SAU_the_agrarian_revolution_desc: "Преобразование сельской местности завершено, ее излишки питают города и способствуют революции."
 SAU_collectivization: "Коллективизация"
 SAU_collectivization_desc: "Частные фермы объединяются в огромные коллективы, работающие сообща и в соответствии с планом."
 SAU_dictatorship_of_the_proletariat: "Диктатура пролетариата"
 SAU_dictatorship_of_the_proletariat_desc: "Власть сосредоточена в руках рабочего класса через единственную революционную партию, не терпящую оппозиции."
 SAU_ignite_the_gulf: "Разжечь пламя в Персидском заливе"
 SAU_ignite_the_gulf_desc: "Рабочее государство будет поставлять агентов и оружие революционным движениям в монархиях Персидского залива."
 SAU_land_to_the_fellahin: "Земля для Феллахина"
 SAU_land_to_the_fellahin_desc: "Крупные имения разделяются и передаются крестьянам, которые их обрабатывают."
 SAU_embrace_moscow: "Обнимите Москву"
 SAU_embrace_moscow_desc: "Аравия присоединится к советскому блоку и будет обменивать нефть на оружие и политическую поддержку."
 SAU_nationalize_the_oil_fields: "Национализировать нефтяные месторождения"
 SAU_nationalize_the_oil_fields_desc: "Богатства, скрытые под песками, принадлежат народу, а не князьям. Компания ARAMCO конфискована и передана под контроль рабочих."
 SAU_the_new_arab_man: "Новый арабский человек"
 SAU_the_new_arab_man_desc: "Формируется новая революционная культура, сметая суеверия и иерархии старого порядка."
 SAU_the_non_aligned_road: "Неприсоединившаяся дорога"
 SAU_the_non_aligned_road_desc: "Аравия выбирает независимый курс, возглавляя неприсоединившиеся страны в борьбе против империализма и советского господства."
 SAU_soviets_of_the_oil_workers: "Советы нефтяников"
 SAU_soviets_of_the_oil_workers_desc: "Избранные рабочие советы будут управлять нефтяными месторождениями и сформируют центральный институт пролетарского государства."
 SAU_toward_pan_arab_union: "На пути к Панарабскому союзу"
 SAU_toward_pan_arab_union_desc: "Революция распространяется за пределы арабских государств, стремясь к объединению с другими прогрессивными арабскими государствами."
 SAU_the_peoples_republic_of_arabia: "Народная Республика Аравия"
 SAU_the_peoples_republic_of_arabia_desc: "Временный указ уступает место полноценному рабочему государству: Народной Республике Аравия."
 SAU_progressive_islam: "Прогрессивный ислам"
 SAU_progressive_islam_desc: "Вместо того чтобы сокрушать веру, партия привлекает прогрессивных священнослужителей для проповеди социализма, совместимого с исламом."
 SAU_a_proletarian_nation: "Пролетарская нация"
 SAU_a_proletarian_nation_desc: "В Аравии национальная идентичность будет определяться через труд и принадлежность к рабочим, а не через племенную принадлежность или лояльность к монархии."
 SAU_form_the_red_guard: "Сформируйте Красную гвардию"
 SAU_regularize_the_red_guard: "Упорядочить деятельность Красной гвардии."
 SAU_regularize_the_red_guard_desc: "Превратите революционные ополчения в профессиональную Красную армию со стандартизированным снаряжением, обученными офицерами и военной промышленностью для ее вооружения."
 SAU_the_peoples_militia: "Народное ополчение"
 SAU_the_peoples_militia_desc: "Сохраните революцию в руках народа, вооружив каждого рабочего и крестьянина в качестве ополченца, готового защищать республику."
 SAU_form_the_red_guard_desc: "Революционное ополчение, сформированное из нефтяников и городской бедноты, поклявшееся защищать революцию."
 SAU_rural_literacy_brigades: "Бригады по повышению грамотности в сельской местности"
 SAU_rural_literacy_brigades_desc: "Кадровые отряды рассредоточиваются по сельской местности, чтобы обучать чтению, письму и революционной доктрине."
 SAU_state_atheism: "Государственный атеизм"
 SAU_state_atheism_desc: "Религия объявляется опиумом для народа. Духовенство лишается власти, и мечети замолкают."
 SAU_state_industrialization: "Государственная индустриализация"
 SAU_state_industrialization_desc: "Правительство будет использовать ускоренные государственные программы для строительства металлургических заводов, плотин и фабрик по всей территории Аравии."
 SAU_vanguard_of_the_region: "Авангард региона"
 SAU_vanguard_of_the_region_desc: "Аравия позиционирует себя как авангард революции во всем арабском мире и странах Персидского залива."
 SAU_womens_emancipation: "Эмансипация женщин"
 SAU_womens_emancipation_desc: "Женщины войдут в состав рабочей силы и партии на равных правах в юридической и политической сферах, положив конец ограничениям на их участие, существовавшим ранее."
 SAU_a_strategic_partnership_with_china: "Стратегическое партнерство с Китаем"
 SAU_a_strategic_partnership_with_china_desc: "Выберите Пекин вместо Вашингтона в качестве главного партнера Королевства среди великих держав. Китайский капитал и китайское оружие поставляются без нравоучений, но и без прежних американских гарантий."
 SAU_conscript_the_kingdom: "Призвать в королевство"
 SAU_conscript_the_kingdom_desc: "Королевство традиционно полагалось на добровольцев из проверенных племен, а не на призыв. Совет готов принять на себя политические риски, связанные с созданием многочисленной армии, чтобы увеличить численность личного состава."
 SAU_oil_for_security: "Нефть для безопасности"
 SAU_oil_for_security_desc: "Договоренность стара как мир, еще со встречи на борту авианосца USS Quincy: саудовская нефть поддерживает работу американской экономики, а американское оружие обеспечивает безопасность Королевства. Необходимо укрепить партнерство в сфере нефтедолларов, которое является основой экономики страны."
 SAU_cooperation_with_the_east: "Сотрудничество с Востоком"
 SAU_cooperation_with_the_east_desc: "Центр тяжести мировой экономики смещается в сторону Азии, а Азия испытывает острую потребность в нефти. Откройте Королевство для восходящих держав Востока и застрахуйтесь от ненадежного Запада."
 SAU_cooperation_with_the_west: "Сотрудничество с Западом"
 SAU_cooperation_with_the_west_desc: "Вашингтон и его союзники гарантируют безопасность стран Персидского залива со времен короля Абдазиза. Необходимо прочно закрепить Королевство в западном лагере и обменивать мировые запасы нефти на защиту всего мира."
 SAU_engage_the_new_baghdad: "Взаимодействуйте с Новым Багдадом"
 SAU_engage_the_new_baghdad_desc: "В Багдаде сформировалось новое правительство, возглавляемое шиитами и пользующееся поддержкой Тегерана. Это позволит преодолеть старые разногласия и приблизить новый Ирак к арабскому миру."
 SAU_counter_the_baathist_remnant: "Противостояние остаткам баасистской партии"
 SAU_counter_the_baathist_remnant_desc: "Независимо от того, пал ли Саддам или просто пошатнулся, партия Баас остается силой в тени Ирака. Не допускайте возвращения к власти у непримиримых сторонников старого режима."
 SAU_declare_the_republic_of_arabia: "Провозгласить Республику Аравия"
 SAU_declare_the_republic_of_arabia_desc: "Монархия пала, и временный совет удерживает власть от имени народа. Теперь старое королевство окончательно распущено, и провозглашено новое государство: Республика Аравия, построенная на воле своих граждан, а не на кровной линии династии."
 SAU_the_defense_industries_act: "Закон об оборонной промышленности"
 SAU_the_defense_industries_act_desc: "Саудовская Аравия долгое время зависела от импортного оружия и зарубежных запасных частей. Закон об оборонной промышленности потребует, по возможности, внутреннего производства, а при необходимости — лицензионного, несмотря на более высокие затраты и меньшую краткосрочную эффективность."
 SAU_disband_the_national_guard: "Расформировать Национальную гвардию"
 SAU_disband_the_national_guard_desc: "Национальная гвардия была создана из лояльных племен для защиты престола от регулярной армии. Совет распустит ее полки и предложит их личному составу места в регулярных вооруженных силах, лишив монархию независимой военной базы."
 SAU_the_economy_under_military_order: "Экономика при военном порядке"
 SAU_the_economy_under_military_order_desc: "Офицеры возьмут под контроль Aramco, SABIC, порты и основных подрядчиков. Нефтедобывающие операции могут продолжаться под руководством существующих инженеров, но военное управление, вероятно, снизит эффективность в других секторах экономики."
 SAU_emergency_tribunal: "Чрезвычайный трибунал"
 SAU_emergency_tribunal_desc: "Суды, созданные под военным командованием, заседали без права обжалования и рассматривали преступления, которые обычные суды никогда не рассматривали. С улемами консультировались по форме судебных разбирательств, а не по вердиктам."
 SAU_energy_subsidies_for_jordan: "Энергетические субсидии для Иордании"
 SAU_energy_subsidies_for_jordan_desc: "Иордания не имеет собственных запасов нефти и ощущает на себе все колебания цен. Необходимо заручиться поддержкой Саудовской Аравии, предоставив королевству дешевое топливо и нефть по сниженным ценам."
 SAU_aid_sudan: "Помощь Судану"
 SAU_aid_sudan_desc: "Хартуму необходимо финансирование, которое Тегеран не предоставил. Саудовская помощь может обеспечить разрыв с Ираном, но она также привязывает Эр-Рияд к правительству, уже изолированному западными санкциями."
 SAU_side_with_algeria: "Встаньте на сторону Алжира."
 SAU_side_with_algeria_desc: "Эр-Рияд не может с одинаковой теплотой заигрывать с Алжиром и Рабатом, пока их соперничество разделяет Магриб. Алжир предлагает ценный опыт борьбы с исламистскими повстанцами, но выбор этой страны означает охлаждение отношений с другой монархией — Марокко."
 SAU_back_the_brotherhood: "Поддержите Братство"
 SAU_back_the_brotherhood_desc: "Египет является одновременно родиной «Братьев-мусульман» и центром арабского мира. Поддержка движения обеспечила бы Эр-Рияду популярную исламистскую сеть за рубежом, но создала бы риск трений с правительствами, которые опасаются влияния «Братьев-мусульман» на выборах."
 SAU_back_the_strongman: "Поддержите сильного человека"
 SAU_back_the_strongman_desc: "Египетские генералы обещают порядок, враждебность к «Братьям-мусульманам» и государство, достаточно сильное, чтобы удерживать центр арабского мира. Саудовские деньги могут обеспечить сохранение этого порядка и сближение Каира с Эр-Риядом."
 SAU_befriend_the_turks: "Подружитесь с турками"
 SAU_befriend_the_turks_desc: "[befriend_the_turks_description]"
 SAU_contain_the_turks: "Сдержать турок"
 SAU_contain_the_turks_desc: "Мы не можем позволить Турции преследовать свои интересы на Ближнем Востоке. Поддержка [TUR.GetLeader] политического ислама чревата усилением опасного популистского движения, которое может стремиться свергнуть наше правительство."
 SAU_influence_muslim_europe: "Влияние на мусульманскую Европу"
 SAU_influence_muslim_europe_desc: "На Балканах существуют мусульманские общины, у которых мало причин обращаться за поддержкой в Эр-Рияд. Стипендии, мечети и благотворительные сети могут превратить общую веру в устойчивое влияние Саудовской Аравии в Европе."
 SAU_influence_north_africa: "Влияние на Северную Африку"
 SAU_influence_north_africa_desc: "Страны Магриба чаще смотрят на север, в Европу, и на юг, в Африку, чем на восток, в сторону Эр-Рияда. Саудовские деньги и дипломатия могут это изменить, но каждый шаг вступает в противостояние между Алжиром и Марокко."
 SAU_side_with_morocco: "Встаньте на сторону Марокко"
 SAU_side_with_morocco_desc: "Марокко разделяет интересы Королевства в сохранении монархического правления и ограничении влияния Алжира. Поддержка Рабата укрепляет позиции естественного партнера, но закрывает двери в Алжире."
 SAU_sanction_sudan: "Санкции против Судана"
 SAU_sanction_sudan_desc: "Руководство [SUD.GetLeader] постоянно сталкивалось с международными противоречиями. При его правлении Судан обвиняли в государственной поддержке терроризма, а также в серьезных нарушениях прав человека. Западные страны впоследствии ввели санкции против этого государства-изгоя, и этому примеру следует следовать."
 SAU_sanction_turkey: "Ввести санкции против Турции"
 SAU_sanction_turkey_desc: "Несмотря на наши предупреждения, Турция продолжает вмешиваться в дела арабского мира. У нас нет иного выбора, кроме как использовать принудительные меры, чтобы отговорить Турцию от продвижения своих империалистических амбиций."
 SAU_security_guarantees: "Гарантии безопасности"
 SAU_security_guarantees_desc: "Тесные отношения с Анкарой мало чего стоят, если они исчезнут во время кризиса. Взаимные гарантии сплотили бы безопасность Турции и Саудовской Аравии и предупредили бы любого врага, что нападение на одну сторону означает столкновение с обеими."
 SAU_turkish_bases: "Турецкие базы"
 SAU_turkish_bases_desc: "Предоставление Турции военного доступа дало бы Анкаре прямой повод защищать Королевство. Это также дало бы конкурирующей региональной державе плацдарм на территории Саудовской Аравии."
 SAU_libyan_arms_shipments: "Ливийские поставки оружия"
 SAU_libyan_arms_shipments_desc: "Раздробленное государство Ливия превратилось в аукцион по продаже иностранного оружия и денег. По мере отступления западных держав, саудовские поставки могут обеспечить поддержку дружественной фракции и место в борьбе за нефть и порты страны."
 SAU_the_faisalite_resurgence: "Возрождение файсалитизма"
 SAU_the_faisalite_resurgence_desc: "Программа Фейсалита возвращается после целого поколения пренебрежения. Она призывает к экономии, самодостаточности и созданию Королевства, которое представляет умму, а не зависит от Вашингтона."
 SAU_centralization_of_the_provincial_emirates: "Централизация провинциальных эмиратов"
 SAU_centralization_of_the_provincial_emirates_desc: "Провинциальные эмиры управляли своими регионами как частными владениями с момента основания государства. Эр-Рияд отзывает их хартии и издает новые — более короткие, отзываемые и подписываемые королем."
 SAU_the_sovereign_civil_service: "Суверенная гражданская служба"
 SAU_the_sovereign_civil_service_desc: "В государственной службе для назначения на должности будут использоваться экзамены, а для продвижения по службе — служебные записи. Это позволит уменьшить влияние семейных связей на занятость в государственных учреждениях."
 SAU_reorganization_of_the_majlis_ash_shura: "Реорганизация Меджлиса аш-Шура"
 SAU_reorganization_of_the_majlis_ash_shura_desc: "Митеб расширит и реорганизует Меджлис аш-Шура, предоставив ему доступ к важным государственным делам. Он останется подчиненным королю, но получит более четкую консультативную и административную роль."
 SAU_the_national_cadre_initiative: "Национальная инициатива по формированию кадров"
 SAU_the_national_cadre_initiative_desc: "Королевство будет обучать граждан Саудовской Аравии для замены иностранных рабочих на стратегически важных должностях. В краткосрочной перспективе эффективность может снизиться, в то время как национальные работники будут набирать опыт."
 SAU_the_fortress_kingdom: "Крепостное Королевство"
 SAU_the_fortress_kingdom_desc: "Правительство Фейсалита укрепило свои институты, устранило оппонентов и сократило иностранное влияние. Теперь Королевству предстоит решить, будет ли эта автономия способствовать изоляции или более активной независимой политике."
 SAU_the_spirit_of_73: "Дух 73-го"
 SAU_the_spirit_of_73_desc: "Нефтяное эмбарго 1973 года продемонстрировало, что саудовская производственная политика может оказывать влияние на западные правительства. Королевство рассмотрит возможность использования этого рычага для достижения дальнейших политических уступок."
 SAU_the_international_forums_question: "Вопрос международных форумов"
 SAU_the_international_forums_question_desc: "Королевству предстоит решить, следует ли отстаивать свои интересы через такие институты, как Организация Объединенных Наций и МВФ, или же выйти из системы, в разработке правил которой оно играло незначительную роль."
 SAU_the_superpower_engagement_question: "Вопрос взаимодействия сверхдержав"
 SAU_the_superpower_engagement_question_desc: "Оба блока сверхдержав стремятся к сближению с Саудовской Аравией. Эр-Рияд может оставаться независимым, покупая вооружения у обеих стран, или уменьшить свою зависимость, развивая собственное производство вооружений."
 SAU_eradicate_foreign_dependency: "Искоренить иностранную зависимость"
 SAU_eradicate_foreign_dependency_desc: "Королевство будет рассматривать зависимость от основных импортных товаров как стратегическую уязвимость. Поэтому приоритет будет отдаваться внутреннему замещению, даже если импортные товары будут дешевле."
 SAU_the_foreign_wealth_question: "Вопрос о внешнем богатстве"
 SAU_the_foreign_wealth_question_desc: "Саудовская Аравия хранит сотни миллиардов долларов в западных банках и государственных ценных бумагах. Репатриация этих средств позволила бы снизить иностранную зависимость, но оставление их за рубежом остается более безопасным и прибыльным вариантом."
 SAU_increase_the_ulemas_authority: "Укрепить авторитет улемов"
 SAU_increase_the_ulemas_authority_desc: "Учёные вновь вошли в состав советов, из которых их незаметно вывели. Фейсал правил, опираясь на поддержку улемов, и его наследники не будут делать вид, что это не так."
 SAU_the_domestic_supply_quota: "Квота внутреннего предложения"
 SAU_the_domestic_supply_quota_desc: "Каждое министерство, подрядчик и нефтеперерабатывающий завод будут обязаны закупать минимальную долю товаров саудовского производства. Отечественная продукция может первоначально стоить дороже и иметь худшие характеристики, но квоты будут способствовать наращиванию национального потенциала."
 SAU_the_sovereign_aid_question: "Вопрос о суверенной помощи"
 SAU_the_sovereign_aid_question_desc: "Саудовская помощь может распределяться как безусловная поддержка мусульманских общин или использоваться для обеспечения политических уступок. Королевству предстоит решить, что будет определять оказываемую помощь: религиозная солидарность или стратегическое влияние."
 SAU_islamic_solidarity_conference: "Исламская конференция солидарности"
 SAU_islamic_solidarity_conference_desc: "Эр-Рияд созовет конференцию по исламской солидарности и профинансирует ее проведение. На встрече будет возобновлен подход Фейсала, предполагающий использование спонсируемых Саудовской Аравией институтов для координации действий мусульманского мира."
 SAU_the_expatriate_workforce_question: "Вопрос о рабочей силе за рубежом"
 SAU_the_expatriate_workforce_question_desc: "Девять миллионов иностранных рабочих поддерживают экономику Саудовской Аравии, но это противоречит цели Фейсалита по достижению национальной самодостаточности. Сокращение их роли обойдется дорого с экономической точки зрения, в то время как их сохранение ограничит процесс саудизации."
 SAU_reclaim_the_oic_leadership: "Возвращение лидерства в ОИК"
 SAU_reclaim_the_oic_leadership_desc: "Организация исламского сотрудничества базируется в Джидде. Эр-Рияд будет использовать свое финансирование и положение принимающей страны для более активного управления деятельностью организации."
 SAU_the_global_ummah_question: "Глобальный вопрос об умме"
 SAU_the_global_ummah_question_desc: "Контроль Королевства над двумя священными мечетями дает ему уникальные основания претендовать на лидерство среди мусульман всего мира. Ему предстоит решить, превратить ли этот статус в активную ответственность перед всемирной уммой."
 SAU_splendid_isolation: "Великолепная изоляция"
 SAU_splendid_isolation_desc: "Королевство откажется от блокировок, зависимых отношений и внешних войн. Оно сосредоточится на защите своих границ, сохранении веры и управлении нефтяными ресурсами."
 SAU_the_virtue_committees_return: "Возвращение комитетов добродетели"
 SAU_the_virtue_committees_return_desc: "Комитет по поощрению добродетели и предотвращению порока возвращает себе утраченные улицы. Его патрули снова заметны, как и несущееся ими послание."
 SAU_the_third_way_doctrine: "Доктрина Третьего Пути"
 SAU_the_third_way_doctrine_desc: "Королевство откажется от союза с Вашингтоном и Москвой и организует независимый блок мусульманских государств во главе с Эр-Риядом. Этот блок будет полагаться на собственное производство вооружений и подчиняться только умме."
 SAU_ban_foreign_media: "Запретить иностранные СМИ"
 SAU_ban_foreign_media_desc: "Спутниковые антенны демонтируют, бюро закрываются, и новости Королевства пишутся в Королевстве. То, что мир говорит о Саудовской Аравии, перестает быть внутренним делом."
 SAU_the_closed_frontier: "Закрытая граница"
 SAU_the_closed_frontier_desc: "Визовые ограничения ужесточаются, контракты истекают, а жилье для экспатриантов начинает пустеть. Королевство решает, что лучше быть беднее и принадлежать самому себе."
 SAU_purge_the_westernized_elite: "Избавиться от вестернизированной элиты"
 SAU_purge_the_westernized_elite_desc: "Министерства начинают заполняться людьми, получившими образование в Эр-Рияде, а не в Бостоне. Тех, кто вернулся домой с иностранными дипломами и чуждыми привычками, пересматривают, а их должности перераспределяют."
 SAU_the_foreign_bases_question: "Вопрос о зарубежных военных базах"
 SAU_the_foreign_bases_question_desc: "Доступ иностранных военных сил обеспечивает Королевству внешнюю защиту, но вызывает гнев духовенства, которое рассматривает присутствие иностранных войск в Аравии как оскорбление. Эр-Рияд должен решить, стоит ли эта защита того, что она наносит ущерб его суверенитету и религиозной легитимности."
 SAU_sever_the_western_pact: "Разорвать Западный пакт"
 SAU_sever_the_western_pact_desc: "Королевство закроет иностранные базы и потребует от их гарнизонов покинуть их. Это восстановит саудовский контроль над своей территорией, но положит конец важной гарантии внешней безопасности."
 SAU_the_base_retention_edict: "Указ о сохранении основания"
 SAU_the_base_retention_edict_desc: "Иностранные базы и соглашения об их снабжении сохранятся. Правительство будет отстаивать это решение перед улемами как необходимость обеспечения безопасности, несмотря на их религиозные возражения."
 SAU_fight_iran_indirectly: "Бороться с Ираном косвенно"
 SAU_fight_iran_indirectly_desc: "Открытое сражение с Исламской Республикой погубило бы обе стороны. Вместо этого, нужно истощать Тегеран через его марионеток и неспокойные провинции, никогда не переходя черту в открытую войну."
 SAU_modon_industrial_cities: "Промышленные города МОДОН"
 SAU_modon_industrial_cities_desc: "В Янбу, Рас-эль-Хайре и Джубайле найдется место не только для нефтяных терминалов. MODON заполнит их цементными заводами, алюминиевыми плавильными заводами и заводами по производству удобрений, заменив импорт товарами отечественного производства."
 SAU_the_return_of_national_capital: "Возвращение национального капитала"
 SAU_the_return_of_national_capital_desc: "Состояния Саудовской Аравии сосредоточены в иностранной недвижимости, банках и ценных бумагах, в то время как проекты внутри страны ждут финансирования. Министерство торговли даст этому капиталу повод вернуться и работать внутри Королевства."
 SAU_jeddah_islamic_port_expansion: "Расширение исламского порта Джидды"
 SAU_jeddah_islamic_port_expansion_desc: "Джидда — это ворота Королевства к Красному морю. Новые терминалы для погрузки и разгрузки грузов, а также железнодорожные линии позволят увеличить объемы грузоперевозок вглубь страны и обеспечат порту опережающее развитие в условиях растущего объема торговли."
 SAU_the_supreme_economic_council: "Высший экономический совет"
 SAU_the_supreme_economic_council_desc: "Четыре министерства претендуют на контроль над экономической политикой, и ни одно из них не подчиняется другим. Высший экономический совет предоставляет им единый стол, единую повестку дня и единые полномочия для разрешения споров."
 SAU_sabics_global_expansion: "Глобальная экспансия SABIC"
 SAU_sabics_global_expansion_desc: "Компания SABIC переросла внутренний рынок. Приобретения, такие как GE Plastics, обеспечат компании новые материалы, патенты и клиентов далеко за пределами стран Персидского залива."
 SAU_the_jubail_ii_expansion: "Расширение Джубайла II"
 SAU_the_jubail_ii_expansion_desc: "Развитие Джубайла II будет сосредоточено не только на нефтехимии. Расширение сталелитейного комплекса Хадид обеспечит саудовскую строительную отрасль внутренним источником арматуры и листового металла."
 SAU_the_saudi_export_program: "Саудовская экспортная программа"
 SAU_the_saudi_export_program_desc: "Саудовские заводы не могут развиваться только за счет внутреннего рынка. Экспортная программа будет поставлять пластмассы, очищенное топливо и цемент на рынки Азии, Африки и Латинской Америки, которые ранее знали Королевство прежде всего как страну, производящую нефть."
 SAU_sabic_agri_nutrients: "SABIC Agri-Nutrients"
 SAU_king_abdullah_financial_district: "Финансовый район имени короля Абдуллы"
 SAU_king_abdullah_financial_district_desc: "Финансовый район имени короля Абдаллы предоставит банкам, инвестиционным фондам и многонациональным партнерам единый адрес в Эр-Рияде. Сделки, заключенные в его небоскребах, могут привлечь иностранный капитал и опыт в саудовскую промышленность."
 SAU_sabic_agri_nutrients_desc: "Компания SABIC уже перерабатывает саудовский газ в химические продукты. Расширение производства аммиака и мочевины сделает Королевство крупным поставщиком удобрений и обеспечит продовольствием фермы далеко за пределами Аравии."
 SAU_economic_diversification: "Экономическая диверсификация"
 SAU_economic_diversification_desc: "Нефтяная промышленность останется крупнейшим бизнесом Королевства, но это не обязательно должно касаться всех отраслей. Капитал будет перетекать в производство, сферу услуг и логистику, поэтому падение цен на нефть больше не будет отражаться на зарплатах всех жителей Саудовской Аравии."
 SAU_non_oil_exports: "Экспорт товаров, не относящихся к нефти"
 SAU_non_oil_exports_desc: "Танкер не должен быть единственным экспортным товаром Саудовской Аравии, который кто-либо признает. Пластмассы, химикаты, цемент и оборудование могут занять свое место в торговом балансе и сделать валютные поступления менее зависимыми от нефти."
 SAU_economic_liberalization: "Экономическая либерализация"
 SAU_economic_liberalization_desc: "Частной фирме не должны требоваться принц, субсидии и год подписей, чтобы открыть свои двери. Уберите лабиринт лицензирования и позвольте предприятиям конкурировать за клиентов, а не за услуги."
 SAU_sabic_technology_and_innovation: "Технологии и инновации SABIC"
 SAU_sabic_technology_and_innovation_desc: "Одного лишь дешевого сырья недостаточно, чтобы SABIC всегда оставалась конкурентоспособной. Исследования в области катализаторов, полимеров и методов производства могут поставить саудовские патенты в один ряд с патентами с саудовскими предприятиями."
 SAU_the_2000s_oil_boom: "Нефтяной бум 2000-х годов"
 SAU_the_2000s_oil_boom_desc: "Цены на нефть растут, пополняя казну и поднимая вместе с ней уровень экономики Тадавула. Этот бум может профинансировать развитие новых отраслей промышленности, если Королевство инвестирует средства до того, как цикл снова изменится."
 SAU_the_national_industrial_strategy: "Национальная промышленная стратегия"
 SAU_the_national_industrial_strategy_desc: "Десятилетняя промышленная стратегия объединит министерства и предприятия для достижения общих целей в области стали, машиностроения, занятости в Саудовской Аравии и роста экспорта. Наконец-то прогресс можно будет измерять не только размером бюджета."
 SAU_the_mining_sector: "Горнодобывающий сектор"
 SAU_the_mining_sector_desc: "Компания Ma'aden, основанная в 1997 году, занимается добычей полезных ископаемых. §Yтретий столп§! Помимо нефти и нефтехимической продукции, экономика страны включает фосфаты в Аль-Джаламиде, золото в Махд-ад-Дахабе, а также бокситы и алюминий, предназначенные для Рас-эль-Хайра."
 SAU_the_tourism_sector: "Туристический сектор"
 SAU_the_tourism_sector_desc: "Созданная в 2000 году Высшая комиссия по туризму (§YSupreme Commission for Tourism§!) превращает культурное наследие королевства, его побережье Красного моря и, прежде всего, паломничество в Мекку и Медину (§YPolgression to Mecca and Medina§!) в постоянную круглогодичную отрасль."
 SAU_the_construction_boom: "Строительный бум"
 SAU_the_construction_boom_desc: "Инвестиции, полученные в результате нефтяного бума, будут направлены на финансирование масштабного строительства в Эр-Рияде, Джидде и Даммаме, включая высотные здания, торговые центры, дороги и другую городскую инфраструктуру."
 SAU_the_digital_economy: "Цифровая экономика"
 SAU_the_digital_economy_desc: "Он §YКомиссия по связи и информационным технологиям§! В 2001 году была положена конец телекоммуникационной монополии, и королевство было обеспечено мобильной связью, широкополосным доступом в интернет, а первые электронные государственные услуги стали доступны в каждой провинции."
 SAU_the_eighth_development_plan: "Восьмой план развития"
 SAU_the_eighth_development_plan_desc: "Для планирования пяти лет расходов достаточно лишь списка министерств. Восьмой план развития будет координировать экономические и социальные проекты правительства до 2009 года."
 SAU_the_industrial_path: "Индустриальный путь"
 SAU_the_industrial_path_desc: "Сталелитейная промышленность, плавка и металлообработка ставят заводы выше офисов. Индустриальный путь создает производственные мощности внутри страны, но требует больше капитала, рабочей силы и импортного оборудования."
 SAU_the_services_path: "Путь к услугам"
 SAU_the_services_path_desc: "Банковское дело, логистика, финансы и туризм могут обеспечить работой саудовских выпускников без необходимости ждать строительства новых сталелитейных заводов. Экономика, ориентированная на сферу услуг, требует меньших инвестиций в тяжелую промышленность и оставляет большую часть материальных потребностей Королевства на импорт."
 SAU_the_balanced_path: "Сбалансированный путь"
 SAU_the_balanced_path_desc: "Промышленность и сфера услуг будут развиваться вместе, распределяя инвестиции между ними. Компромисс позволяет избежать зависимости от одного сектора. Ни одна из сторон не получит весь необходимый капитал."
 SAU_the_ninth_development_plan: "Девятый план развития"
 SAU_the_ninth_development_plan_desc: "Экономика Саудовской Аравии в 2015 году совершенно не похожа на экономику 1995 года. Только производственный сектор превосходит по объему экспорт нефти десятилетие назад."
 SAU_the_saudi_landbridge: "Саудовский сухопутный мост"
 SAU_the_saudi_landbridge_desc: "«Саудовский сухопутный мост» соединит исламский порт Джидды на Красном море с Эр-Риядом и Даммамом на побережье Персидского залива по железной дороге. Грузовые перевозки будут осуществляться через полуостров без обхода морских путей вокруг Аравийского полуострова."
 SAU_stc_privatization: "Приватизация STC"
 SAU_stc_privatization_desc: "Компания STC больше не может развиваться темпами министерства. Приватизация направит новые средства на развитие волоконно-оптических и мобильных сетей, но государственный контроль над национальным оператором связи ослабнет."
 SAU_the_saudi_electricity_company: "Саудовская электроэнергетическая компания"
 SAU_the_saudi_electricity_company_desc: "Заводы и города растут быстрее, чем энергосистема. Саудовская электроэнергетическая компания подключит новые газовые турбины к общенациональной линии электропередачи и предотвратит отключения электроэнергии, которые могут ограничить темпы развития."
 SAU_urban_development: "Градостроительство"
 SAU_urban_development_desc: "Эр-Рияд, Джидда и Даммам растут быстрее, чем развиваются их дороги, коммунальные службы и жилищное строительство. Градостроительство должно наверстать упущенное, прежде чем пробки станут следующим узким местом в Королевстве."
 SAU_the_real_estate_development_fund: "Фонд развития недвижимости"
 SAU_the_real_estate_development_fund_desc: "Доступ к жилью в крупных городах становится недоступным для обычных саудовских семей. Фонд развития недвижимости будет финансировать строительство новых кварталов и сократит очередь на жилье."
 SAU_the_north_south_railway: "Железная дорога Север-Юг"
 SAU_the_north_south_railway_desc: "Железнодорожная линия Север-Юг будет перевозить фосфаты и бокситы с северных рудников в страны Персидского залива, одновременно соединяя внутренние города, долгое время зависевшие от автомобильных дорог. Железнодорожный транспорт позволит снизить стоимость грузоперевозок по всему Королевству."
 SAU_king_abdullah_economic_city: "Экономический город короля Абдаллы"
 SAU_king_abdullah_economic_city_desc: "Планируемые города Рабиг, Медина и Джазан призваны избежать бюрократической волокиты, замедляющей остальную экономику. Упрощенные правила их строительства проверят, сможет ли новый город обойти старую бюрократию."
 SAU_the_labour_law_of_2005: "Трудовой закон 2005 года"
 SAU_the_labour_law_of_2005_desc: "Труд иностранных рабочих стал основой современного Королевства, но система спонсорства привязывает работников к работодателям, а саудовцев лишает возможности получать заработную плату в частном секторе. Закон 2005 года ослабит некоторые положения кафалы, одновременно оказывая давление на компании с целью найма граждан."
 SAU_tatweer_education_reform: "Реформа образования Татвира"
 SAU_tatweer_education_reform_desc: "Зубрежка не сможет подготовить инженеров и менеджеров, необходимых новой экономике. Татвир пересмотрит учебную программу, сократит количество часов религиозного обучения и введёт английский язык в классы, начиная с четвёртого класса."
 SAU_king_fahd_medical_city: "Медицинский город имени короля Фахда"
 SAU_king_fahd_medical_city_desc: "Специализированная медицинская помощь сосредоточена в нескольких больницах и нескольких городах. Медицинский город имени короля Фахда и новые региональные учреждения сделают этот уровень доступным для саудовцев, которые не могут приехать в Эр-Рияд для лечения."
 SAU_kaust: "КАУС"
 SAU_kaust_desc: "Репутация университета формируется благодаря работе, проводимой внутри него, а не по названию над его воротами. Увеличение исследовательских бюджетов в KAUST, KFUPM и KAU предоставит саудовским ученым лаборатории и гранты, позволяющие конкурировать за рубежом."
 SAU_k_a_care_renewable_energy: "K.A.CARE Возобновляемая энергия"
 SAU_k_a_care_renewable_energy_desc: "Несмотря на то, что в Королевстве наблюдается один из самых сильных солнечных периодов в мире, оно сжигает ценную нефть для производства электроэнергии. Компания K.A.CARE проведет испытания еще одного перспективного проекта в Сакаке и Думат-эль-Джандале, объединив солнечную энергию с северным ветром."
 SAU_royal_decree_m_30_capital_market_law: "Королевский указ М/30, Закон о рынке капитала"
 SAU_royal_decree_m_30_capital_market_law_desc: "Королевский указ M/30, изданный королем Фахдом 31 июля 2003 года, ввел в действие Закон о рынке капитала. Он устанавливает современную правовую основу для системы Tadawul и регулирования саудовского рынка капитала."
 SAU_the_2007_legal_reforms: "Правовые реформы 2007 года"
 SAU_the_2007_legal_reforms_desc: "Правовые реформы Королевства 2007 года кодифицируют формальную регистрацию компаний и устанавливают четкие правила создания признанных юридических лиц. Теперь компании могут работать в рамках более предсказуемой корпоративной структуры."
 SAU_the_qualified_foreign_investor_program: "Программа для квалифицированных иностранных инвесторов"
 SAU_the_qualified_foreign_investor_program_desc: "§Y15 июня 2015 г.§! §YУправление по рынку капитала§! впервые открывает §YТадавул§! для прямых иностранных институциональных инвестиций. Фонды, имеющие в управлении активами как минимум §Y$5 млрд§!, получают право покупать саудовские акции без местных посредников — так начинается путь к включению в §YMSCI Emerging Markets§!."
 SAU_msci_emerging_markets_inclusion: "Включение индекса MSCI Emerging Markets"
 SAU_msci_emerging_markets_inclusion_desc: "В §Yиюне 2018 г.§! §YMSCI§! объявляет о повышении статуса Саудовской Аравии с самостоятельного рынка до развивающегося. Внедрение начинается в §Yмае 2019 г.§! и завершается вторым этапом в §Yавгусте 2019 г.§! Завершённое включение даёт §YТадавулу§! около §G2.83%§! веса в индексе и, как ожидается, принесёт §Gот $14 до $16 млрд§! пассивных инвестиций."
 SAU_the_kafalah_sme_program: "Программа «Кафалах» для малых и средних предприятий"
 SAU_the_kafalah_sme_program_desc: "Программа «Кафалах» предоставит льготные кредиты, упростит процедуры и обеспечит обучение, чтобы помочь саудовским предпринимателям создавать малые и средние предприятия."
 SAU_the_aramco_ipo: "IPO компании Aramco"
 SAU_the_aramco_ipo_desc: "На §Y11 декабря 2019 г.§!, §YСаудовская Арамко§! списки на §YТадавул§!, поднимая §G$ 25.6 billion§! initially and §G$ 29,4 миллиарда§! после опции \"зеленого башмака\". Она становится §Gкрупнейшее IPO в истории§!превосходя §YРазмещение акций Alibaba на бирже в 2014 году§!и остается в списке §YЭр-Рияд§! скорее, чем §YНью-Йорк§! или §YЛондон§!."
 SAU_the_saudi_financial_and_banking_laws: "Финансовое и банковское законодательство Саудовской Аравии"
 SAU_the_saudi_financial_and_banking_laws_desc: "Закон о банковском контроле 1966 года и законы о рынке капитала и кооперативном страховании, принятые в 2003 году, составляют основную правовую основу для саудовских финансов. Вместе они устанавливают четкие обязательства и санкции для банков, страховщиков и участников рынка."
 SAU_the_capital_market_authority: "Управление по рынку капитала"
 SAU_the_capital_market_authority_desc: "Фондовая биржа не может контролировать себя сама, пока от цен на ее акции зависит судьба саудовских домохозяйств. Управление по рынку капитала будет устанавливать правила листинга, расследовать злоупотребления и заставит компанию Tadawul отчитываться перед регулирующим органом."
 SAU_edaa_the_securities_depository: "Edaa: Депозитарий ценных бумаг"
 SAU_edaa_the_securities_depository_desc: "Центр депозитария ценных бумаг §YEdaa§! будет осуществлять расчеты по сделкам Tadawul и вести электронный учет прав собственности. Эта современная инфраструктура повысит надежность рынка для отечественных и зарубежных инвесторов."
 SAU_the_saudi_logistics_hub: "Саудовский логистический центр"
 SAU_the_saudi_logistics_hub_desc: "Королевство планирует использовать Джидду, Даммам и Эр-Рияд для создания логистического центра, связывающего торговые пути через Азию, Африку и Европу."
 SAU_establish_joint_stock_conglomerates_jsc: "Создание акционерных конгломератов (АО)"
 SAU_establish_joint_stock_conglomerates_jsc_desc: "Преобразование крупных государственных предприятий в публичные акционерные компании позволит гражданам и институциональным инвесторам предоставлять капитал для расширения промышленности. Это снизит зависимость новых проектов от прямого финансирования из государственного бюджета."
 SAU_the_saudi_sukuk_programme: "Программа саудовских исламских облигаций (сукук)"
 SAU_the_saudi_sukuk_programme_desc: "С §Y2017 года§! §YМинистерство финансов§! запускает постоянную программу суверенных облигаций сукук — только на первом международном выпуске §G$9 млрд§!. Соответствующие шариату облигации становятся основным инструментом привлечения государственного финансирования и корпоративного капитала Саудовской Аравии. Королевство и §YМалайзия§! делят между собой мировой рынок исламских облигаций."
 SAU_limited_liability_company_llc: "Общество с ограниченной ответственностью (ООО)"
 SAU_limited_liability_company_llc_desc: "Закон о компаниях 2015 года, вступивший в силу в 2016 году, устанавливает современную правовую структуру для обществ с ограниченной ответственностью наряду с акционерными обществами. Защищенный капитал и признанный правовой статус помогут отечественным фирмам создавать цепочки поставок и заключать партнерские соглашения с международными компаниями."
 SAU_the_gulfs_economic_engine: "Экономический двигатель Персидского залива"
 SAU_the_gulfs_economic_engine_desc: "Более сильная экономика Королевства привлечет в Эр-Рияд региональных работников, финансовых специалистов и капитал, вместо того чтобы отпугнуть их от соседних рынков."
 SAU_one_stop_shop: "Магазин «все в одном»"
 SAU_one_stop_shop_desc: "Иностранные компании когда-то потратили §Yгоды§! Взаимодействие с несколькими министерствами для регистрации бизнеса. SAGIA §YМагазин «все в одном»§! объединяет эти этапы лицензирования в одном месте. §Gодин счетчик§!сокращая задержки и возможности для §Yкоррупция§!."
 SAU_open_strategic_sectors: "Открытые стратегические сектора"
 SAU_open_strategic_sectors_desc: "§YТелекоммуникации§!, §Yстрахование§!, и §Yдобыча полезных ископаемых§! откроется для иностранного капитала. Новые конкуренты привнесут §Yтехнологии§! и §Yэкспертиза§! при этом вынуждая поддерживаемые государством фирмы к модернизации."
 SAU_foreign_investment_law_of_2000: "Закон об иностранных инвестициях 2000 года"
 SAU_foreign_investment_law_of_2000_desc: "Он §YАпрель 2000 г.§! Закон об иностранных инвестициях разрешает иностранным гражданам владеть недвижимостью. §G100%§! Саудовские компании представлены в большинстве секторов экономики. Отмена ранее действовавших ограничений на владение акциями призвана привлечь значительно больше международного капитала."
 SAU_economic_cities_drive: "Экономические города движутся вперед"
 SAU_economic_cities_drive_desc: "Планируется создание шести новых экономических городов, в том числе §YЭкономический город короля Абдаллы§! на Красном море, §YГород экономических знаний§! в Медине и §YГород принца Абдулазиза бин Мусаеда§! В граде. Каждый из них будет §Yспециально построенный центр§! для промышленности, сферы услуг и торговли за пределами основных нефтедобывающих районов."
 SAU_international_partnerships: "Международное партнерство"
 SAU_international_partnerships_desc: "Совместные предприятия с §YГенерал Электрик§!, §YДоу Химикал§!, §YСумитомо§!, и §YМитсубиси§! придёт §Yтехнологии§! и §Yуправленческий опыт§! в Королевство. Саудовские инженеры будут работать с этими партнерами и развивать навыки, необходимые для управления будущими проектами внутри страны."
 SAU_tax_incentive_package: "Пакет налоговых льгот"
 SAU_tax_incentive_package_desc: "Ставка корпоративного налога для иностранных инвесторов снизится с §Y45%§! к §G20%§!при этом личный доход остается §Gне облагаемый налогом§!SAGIA будет продвигать эти условия на международном уровне для привлечения иностранного капитала."
 SAU_saudi_arabia_open_for_business: "Саудовская Аравия открыта для бизнеса."
 SAU_saudi_arabia_open_for_business_desc: "Теперь лицензии оформляются в одном офисе вместо множества, иностранные фирмы могут владеть тем, что они строят, а новые экономические города конкурируют за их капитал. Саудовская Аравия больше не просит инвесторов игнорировать бюрократию; она открыта для бизнеса."
 SAU_ras_tanura_and_abqaiq: "Рас Танура и Абкаик"
 SAU_complete_nationalization: "Полная национализация"
 SAU_complete_nationalization_desc: "Между §Y1973 и 1980§! Королевство выкупает доли американских партнеров Арабско-американской нефтяной компании. ARAMCO становится полностью саудовской компанией. §YСаудовская Арамко§!."
 SAU_the_master_gas_system: "Главная газовая система"
 SAU_the_master_gas_system_desc: "Запущено в §Y1975§!Система Master Gas System улавливает газ один раз. §Yотскочила§! на скважинах, обеспечивая дешевую энергию и сырье для новых отраслей промышленности Королевства."
 SAU_saudi_petroleum_engineers: "Саудовские инженеры-нефтяники"
 SAU_saudi_petroleum_engineers_desc: "§YКФУПМ§! В Дахране готовят целое поколение саудовских инженеров-нефтяников и геологов. Рабочая сила Aramco становится самой высококвалифицированной. §YСаудовская Аравия§! в Королевстве."
 SAU_the_ghawar_field: "Поле Гавар"
 SAU_the_ghawar_field_desc: "§YGhawar§! — крупнейшее из когда-либо обнаруженных традиционных нефтяных месторождений, простирающееся на 280 км под Восточной провинцией. На протяжении десятилетий оно в одиночку добывает более половины всей нефти Королевства."
 SAU_ras_tanura_and_abqaiq_desc: "Крупнейший в мире нефтяной порт Танура (§YRas Tanura§!) и стабилизационный комплекс Абкай (§YAbqaiq§!) собирают, перерабатывают и экспортируют большую часть добываемой компанией Aramco нефти. Расширение и защита этих объектов имеют важное значение для нефтяного сектора Королевства."
 SAU_downstream_integration: "Интеграция на последующих этапах производства"
 SAU_downstream_integration_desc: "Прекратите продажу сырой нефти. Нефтеперерабатывающие и нефтехимические комплексы в §YДжубайл, Янбу и Рабиг§! превратить каждую бочку в более ценное топливо и пластмассы. §Yдома§! - и покормить SABIC."
 SAU_petrorabigh_and_satorp: "PetroRabigh и SATORP"
 SAU_petrorabigh_and_satorp_desc: "§YПетроРабиг§! (совместно с японской компанией Sumitomo, 2005) и §YСАТОРП§! В Джубайле (совместно с французской компанией Total) действуют масштабные совместные предприятия, которые перерабатывают саудовскую нефть в топливо и химикаты. Королевство прекращает экспорт сырой нефти и начинает экспортировать... §Yпродукты§!."
 SAU_doctrine_maximize_production: "Доктрина: Максимизация производства"
 SAU_doctrine_maximize_production_desc: "Повысить потенциал Aramco в области устойчивого развития §Y12 миллионов баррелей в день§!Открытие новых полей в Восточной провинции и в районе Руб-эль-Хали.\n\n§GПромывочное масло§! по всему Королевству и повышает топливную эффективность — основу §Yвоенная экономика§!.\n§YВзаимоисключающая с двумя другими доктринами.§!"
 SAU_doctrine_export_powerhouse: "Доктрина: Экспортная держава"
 SAU_doctrine_export_powerhouse_desc: "Нефть перетекает на восток и запад по супертанкерам. Как это происходит в странах ОПЕК. §Yсвинг-продюсер§!Королевство превращает свою нефть в самую надежную в мире. §Yнефтедоллар§! поток доходов.\n\n§GДоходы от экспорта ресурсов§! и регулярные казначейские платежи — основа §Yденежная экономика§!.\n§YВзаимоисключающая с двумя другими доктринами.§!"
 SAU_new_mega_fields: "Новые мега-месторождения"
 SAU_new_mega_fields_desc: "§YShaybah§! (1998) в глубине пустыни Руб-эль-Хали, §YKhurais§! (2009) и на шельфе §YManifa§! (2013) — новое поколение гигантских месторождений еще больше увеличивает мощности Aramco. §GБольше нефти.§!"
 SAU_opec_swing_producer: "ОПЕК, колеблющийся производитель"
 SAU_opec_swing_producer_desc: "Наличие резервных производственных мощностей позволяет Королевству выступать в роли союзника ОПЕК. §Yсвинг-продюсер§! и влиять на мировые цены на нефть. Это открывает возможности для... §YНефтяной рычаг ОПЕК§! решения о повышении цен для получения прибыли или о снижении цен для оказания давления на конкурентов."
 SAU_the_council_of_economic_and_development_affairs: "Совет по экономическим вопросам и вопросам развития"
 SAU_the_council_of_economic_and_development_affairs_desc: "Созданный в 2015 году, §YСовет по экономическим и вопросам развития§! Координирует работу министерств и контролирует реализацию правительственной программы экономических реформ."
 SAU_the_worlds_most_valuable_company: "Самая ценная компания в мире"
 SAU_the_worlds_most_valuable_company_desc: "Компания Saudi Aramco стала §Yсамой ценной компанией на Земле§! и остаётся центральным элементом нефтяного сектора Королевства и государственных финансов.\n§YДля этого требуется национальный ВВП свыше $1800 млрд.§!"
 SAU_the_national_transformation_program: "Национальная программа преобразований"
 SAU_the_national_transformation_program_desc: "В рамках программы «Видение 2030» необходимы сроки, которые сохранятся и после церемонии объявления. §YНациональная программа преобразований§! Это позволит каждому министерству установить целевые показатели, составить бюджет и предоставить публичную оценку того, насколько успешно оно их выполнило."
 SAU_nazaha_the_anti_corruption_authority: "Назаха: Управление по борьбе с коррупцией"
 SAU_nazaha_the_anti_corruption_authority_desc: "§YНазаха§!Национальная антикоррупционная комиссия была создана в 2011 году для расследования финансовой и административной коррупции в государственных органах. Ее мандат направлен на усиление надзора за государственными учреждениями и должностными лицами."
 SAU_the_judicial_reform_of_2007: "Судебная реформа 2007 года"
 SAU_the_judicial_reform_of_2007_desc: "Король Абдалла §YСудебная реформа 2007 года§! Это позволит кодифицировать судебные процедуры, создать Верховный суд и специализированные трибуналы, а также обеспечить предприятиям более предсказуемую правовую систему."
 SAU_tayseer_regulatory_reform: "Tayseer: Реформа регулирования"
 SAU_tayseer_regulatory_reform_desc: "Национальный центр конкурентоспособности (§YTayseer§!) сократит количество лицензий, разрешений и других административных требований, которые задерживают инвестиции."
 SAU_the_ministry_of_investment_misa: "Министерство инвестиций (МИСА)"
 SAU_the_ministry_of_investment_misa_desc: "SAGIA станет §YМинистерство инвестиций§! в 2020 году централизация государственных услуг и политики для иностранных инвесторов."
 SAU_expec_research_centre: "Научно-исследовательский центр EXPEC"
 SAU_expec_research_centre_desc: "Центр разведки и нефтедобычи §Y§! будет заниматься разработкой отечественных технологий моделирования месторождений и бурения. Это позволит Aramco расширить свои технические возможности и улучшить понимание геологии Саудовской Аравии."
 SAU_strong_saudi_banks: "Сильные саудовские банки"
 SAU_strong_saudi_banks_desc: "Банки Al Rajhi, NCB, Riyad Bank и Samba будут расширяться до тех пор, пока саудовские банки не войдут в сотню крупнейших в мире."
 SAU_insurance_for_all: "Страхование для всех"
 SAU_insurance_for_all_desc: "Королевство расширит сферу страхования здоровья, автомобилей и имущества после десятилетий ограниченного развития рынка."
 SAU_grow_the_capital_markets: "Развивать рынки капитала"
 SAU_grow_the_capital_markets_desc: "Большее количество IPO, повышение ликвидности и доступ иностранных квалифицированных финансовых институтов позволят бирже Tadawul стать более крупной и зрелой."
 SAU_a_saudi_bond_market: "Саудовский рынок облигаций"
 SAU_a_saudi_bond_market_desc: "Королевство будет развивать рынки суверенных сукуков, корпоративных сукуков и обычных облигаций, которые смогут привлечь инвесторов из Лондона в Токио."
 SAU_the_sakani_housing_program: "Жилищная программа Сакани"
 SAU_the_sakani_housing_program_desc: "Программа §YSakani§! делает владение собственным жильем доступным для обычных граждан Саудовской Аравии — земля, финансирование и готовые к заселению квартиры предоставляются в больших масштабах."
 SAU_the_national_housing_company: "Национальная жилищная компания"
 SAU_the_national_housing_company_desc: "Он §YНациональная жилищная компания§! Будут использоваться стандартизированные методы строительства и комплексные планы застройки для расширения жилищного строительства вокруг крупных городов."
 SAU_the_saudi_cement_industry: "Саудовская цементная промышленность"
 SAU_the_saudi_cement_industry_desc: "Компания Saudi Cement, Yamama и другие отечественные производители будут поставлять цемент для строительной программы и сократят импорт цемента."
 SAU_glass_and_building_materials: "Стекло и строительные материалы"
 SAU_glass_and_building_materials_desc: "Королевство будет производить листовое стекло, керамику и конструкционную сталь внутри страны для снабжения строительного сектора."
 SAU_vision_2030: "Видение 2030"
 SAU_vision_2030_desc: "План «Vision 2030» (§YVision 2030§!) наследного принца направлен на снижение зависимости от нефти за счет развития туризма, промышленности, индустрии развлечений и крупных проектов развития. Установленный в нем 2030 год делает правительство непосредственно ответственным за реализацию этих реформ."
 SAU_qiddiya_and_the_line: "Киддия и Линия"
 SAU_qiddiya_and_the_line_desc: "§YQiddiya§! и §YThe Line§! представят концепции развлечений и городского развития, предшествующие реализации более масштабного комплекса гигапроектов Королевства."
 SAU_the_red_sea_project: "Проект «Красное море»"
 SAU_the_red_sea_project_desc: "Проект «Красное море» (§YRed Sea Project§!) будет способствовать развитию элитного туризма вдоль побережья и откроет для иностранных туристов отдельные острова Саудовской Аравии."
 SAU_king_salman_international_airport: "Международный аэропорт имени короля Салмана"
 SAU_king_fahd_international_airport: "Международный аэропорт имени короля Фахда"
 SAU_king_fahd_international_airport_desc: "Огромный международный аэропорт имени короля Фахда в Даммаме имеет потенциал стать не просто рекордсменом. Необходимо расширить его взлетно-посадочные полосы и аэродромную вместимость, превратив его в восточные ворота для пассажиров и грузов Саудовской Аравии."
 SAU_king_salman_international_airport_desc: "Новый §YМеждународный аэропорт имени короля Салмана§! В Эр-Рияде планируется строительство терминала, рассчитанного на 100 миллионов пассажиров в год, который будет способствовать достижению целей Королевства в области туризма и логистики."
 SAU_king_abdullah_port: "Порт короля Абдуллы"
 SAU_king_abdullah_port_desc: "§YПорт короля Абдуллы§!Первый в регионе полностью частный порт превратится в крупный контейнерный хаб."
 SAU_the_digital_government_authority: "Управление цифрового правительства"
 SAU_the_digital_government_authority_desc: "Он §YУправление цифрового правительства§! Это позволит разместить государственные услуги на единой онлайн-платформе и сократить объем бумажной административной работы."
 SAU_the_e_commerce_boom: "Бум электронной коммерции"
 SAU_the_e_commerce_boom_desc: "Рост таких стартапов, как Salla, Noon и других, приведет к перемещению большей части розничной торговли в Саудовской Аравии в онлайн-среду и расширению сектора электронной коммерции."
 SAU_fintech_saudi: "Финтех Саудовская Аравия"
 SAU_fintech_saudi_desc: "STC Pay, Tamara и платформа открытого банкинга позволят компании §YFintech Saudi§! превратить Эр-Рияд в региональный центр финансовых технологий."
 SAU_kacst_science_and_technology: "КАЦСТ: Наука и технологии"
 SAU_kacst_science_and_technology_desc: "Научно-технологический город имени короля Абдулазиза (§YKing Abdulaziz City for Science and Technology§!) является центром научно-исследовательской базы Королевства, охватывающей широкий спектр областей — от передовых материалов до космоса."
 SAU_the_human_capability_program: "Программа развития человеческого потенциала"
 SAU_the_human_capability_program_desc: "Новым отраслям промышленности нужны специалисты из Саудовской Аравии, обученные для управления ими. Программа развития человеческого потенциала (§YHuman Capability Development Program§!) свяжет школьные классы, профессиональные училища и профессиональную подготовку с рабочими местами, которые Королевство стремится создать."
 SAU_the_national_technology_development_program: "Национальная программа развития технологий"
 SAU_the_national_technology_development_program_desc: "Национальная программа развития технологий финансирует стартапы и высокотехнологичные предприятия, которые понадобятся Королевству в период сокращения доходов от нефти."
 SAU_the_saudi_space_commission: "Саудовская космическая комиссия"
 SAU_the_saudi_space_commission_desc: "Созданная в 2018 году Саудовская космическая комиссия (§YSaudi Space Commission§!) будет заниматься разработкой программ подготовки космонавтов, наращиванием потенциала запусков и расширением участия Саудовской Аравии в международном космическом секторе."
 SAU_saudi_satellites_and_arabsat: "Саудовские спутники и Arabat"
 SAU_saudi_satellites_and_arabsat_desc: "Программа SaudiSat и доля Королевства в спутнике §YArabsat§! расширят возможности Саудовской Аравии в области связи и наблюдения на орбите."
 SAU_sami_saudi_arabian_military_industries: "SAMI: Военно-промышленный комплекс Саудовской Аравии"
 SAU_sami_saudi_arabian_military_industries_desc: "§YВоенно-промышленный комплекс Саудовской Аравии§! Компания была основана в 2017 году с целью локализации оборонного сектора — к 2030 году половина бюджета на вооружения должна расходоваться внутри страны."
 SAU_gami_localise_the_arms_industry: "GAMI: Локализация оружейной промышленности"
 SAU_gami_localise_the_arms_industry_desc: "Он §YГенеральное управление военной промышленности§! выдает лицензии и развивает внутренний сектор вооружений практически с нуля."
 SAU_the_saudi_drone_program: "Саудовская программа беспилотников"
 SAU_the_saudi_drone_program_desc: "Барражирующие боеприпасы и разведывательные дроны §YDrones§!, разработанные и произведенные в Королевстве."
 SAU_the_national_cybersecurity_authority: "Национальное управление по кибербезопасности"
 SAU_the_national_cybersecurity_authority_desc: "Он §YНациональное управление по кибербезопасности§! (2017) усиливает противодействие в Королевстве после десятилетия нападений на Aramco и министерства."
 SAU_sdaia_data_and_artificial_intelligence: "SDAIA: Данные и искусственный интеллект"
 SAU_sdaia_data_and_artificial_intelligence_desc: "Управление по данным и искусственному интеллекту Саудовской Аравии (§YSaudi Data and AI Authority§!), созданное в 2019 году, будет координировать национальную стратегию в области ИИ, расширять использование суперкомпьютеров и предоставлять государственные данные для практического применения."
 SAU_the_national_data_centres: "Национальные центры обработки данных"
 SAU_the_national_data_centres_desc: "Для центров обработки данных требуются значительные объемы электроэнергии и масштабное строительство. Королевство может обеспечить и то, и другое, а гипермасштабные кампусы способны поддерживать отечественную облачную индустрию, обслуживающую весь регион."
 SAU_the_5g_network: "Сеть 5G"
 SAU_the_5g_network_desc: "STC и Mobily обеспечивают покрытие всей территории Королевства в районе §Y5G§!, что является одним из самых быстрых развертываний в мире."
 SAU_absher_and_yesser_e_government: "Электронное правительство Absher & Yesser"
 SAU_absher_and_yesser_e_government_desc: "Йессер, §YAbsher§! и Таваккална переведут государственные услуги на мобильные платформы и заменят миллионы личных транзакций."
 SAU_the_health_sector_transformation: "Трансформация сектора здравоохранения"
 SAU_the_health_sector_transformation_desc: "Программа трансформации сектора здравоохранения предусматривает объединение больниц в подотчетные кластеры, расширение виртуальной больницы Seha и усиление роли частного страхования."
 SAU_madrasati_and_curriculum_reform: "Медресе и реформа учебной программы"
 SAU_madrasati_and_curriculum_reform_desc: "Платформа §YMadrasati§! и пересмотренные учебные планы позволят повысить уровень преподавания критического мышления, английского языка и программирования, одновременно снижая зависимость от механического запоминания."
 SAU_the_riyadh_metro: "Метро Эр-Рияда"
 SAU_the_riyadh_metro_desc: "Шесть линий под столицей — метро Эр-Рияда (§YRiyadh Metro§!), один из крупнейших проектов городского транспорта, когда-либо построенных в один этап."
 SAU_the_national_renewable_energy_program: "Национальная программа возобновляемой энергетики"
 SAU_the_national_renewable_energy_program_desc: "Он §YНациональная программа возобновляемой энергетики§! будет создана солнечная и ветровая энергетика мощностью в десятки гигаватт, что позволит экспортировать больше сырой нефти вместо ее сжигания для производства электроэнергии."
 SAU_the_sakaka_solar_plant: "Солнечная электростанция Сакака"
 SAU_the_sakaka_solar_plant_desc: "Строительство электростанции §YSakaka§! началось в 2018 году, а её официальное открытие состоялось в 2021 году, став первой в Королевстве солнечной электростанцией промышленного масштаба. Низкая цена на электроэнергию демонстрирует коммерческий потенциал солнечной энергетики Саудовской Аравии."
 SAU_the_dumat_al_jandal_wind_farm: "Ветроэлектростанция Думат аль-Джандал"
 SAU_the_dumat_al_jandal_wind_farm_desc: "Ветроэлектростанция мощностью 400 мегаватт (§YDumat al-Jandal§!) будет использовать сильные северные ветры для выработки возобновляемой электроэнергии и станет крупнейшей ветроэлектростанцией на Ближнем Востоке."
 SAU_neom_green_hydrogen: "Зеленый водород NEOM"
 SAU_neom_green_hydrogen_desc: "На территории NEOM разместится крупнейшая в мире электростанция, производящая зеленый водород (§Ygreen-hydrogen§!). Цель проекта — преобразование недорогой возобновляемой электроэнергии в топливо, пригодное для экспорта."
 SAU_the_civil_nuclear_program: "Гражданская ядерная программа"
 SAU_the_civil_nuclear_program_desc: "Солнечная энергия с каждым вечером иссякает, в то время как спрос на электроэнергию и опресненную воду остается неизменным. Гражданская атомная энергетика может обеспечивать и то, и другое круглосуточно, при условии, что Королевство примет на себя расходы и строгий контроль, которые следят за каждым реактором."
 SAU_battery_energy_storage: "Аккумуляторные накопители энергии"
 SAU_battery_energy_storage_desc: "Аккумуляторные батареи промышленного масштаба будут накапливать солнечную энергию, вырабатываемую в полдень, для использования в часы пиковой нагрузки вечером, повышая надежность возобновляемой энергетики."
 SAU_modernise_the_national_grid: "Модернизация национальной энергосистемы"
 SAU_modernise_the_national_grid_desc: "Умный §Yнациональная энергосеть§!Эта система, интегрированная с сетью стран Персидского залива, позволит сократить отключения электроэнергии и сбалансировать выработку электроэнергии из возобновляемых источников с переменной генерацией."
 SAU_ceer_the_saudi_electric_car: "Ceer: Саудовский электромобиль"
 SAU_ceer_the_saudi_electric_car_desc: "Компания §YCeer§!, основанная в 2022 году, и завод Lucid недалеко от Джидды создадут собственное производство электромобилей. Это позволит Саудовской Аравии производить автомобили самостоятельно, а не полностью зависеть от импорта."
 SAU_fund_vision_2030: "Видение Фонда до 2030 года"
 SAU_fund_vision_2030_desc: "Такой масштабный план не может существовать только на словах. Необходимо направить средства казначейства и капитал государственного инвестиционного фонда на проекты, которые позволят снизить зависимость от нефти, создать рабочие места в частном секторе и доказать, что «Видение 2030» вышло за рамки стадии планирования."
 SAU_the_standardized_interest_law: "Закон о стандартизированных процентах"
 SAU_the_standardized_interest_law_desc: "Процентная ставка находится на грани между шариатом и современной банковской системой. Королевству предстоит сделать выбор: полностью ли запретить ростовщичество (риба), разрешить традиционное кредитование или допустить наличие процентов, основанных на исламских принципах."
 SAU_fractional_reserve_mandates: "Обязательства по частичному резервированию"
 SAU_fractional_reserve_mandates_desc: "Снижение резервов высвобождает больше депозитов для кредитования, но снижает способность банков противостоять изъятиям средств. Новый мандат должен определить, какой объем кредита саудовские банки смогут создавать с каждого внесенного риала."
 SAU_the_anti_speculation_directives: "Директивы по борьбе со спекуляциями"
 SAU_the_anti_speculation_directives_desc: "Производные финансовые инструменты позволяют компаниям хеджировать риски, связанные с колебаниями цен, однако те же самые инструменты могут превратить рынки в казино. Регуляторы должны провести грань между эффективным управлением рисками и чрезмерным гараром, запрещенным шариатом."
 SAU_the_interbank_lending_code: "Кодекс межбанковского кредитования"
 SAU_the_interbank_lending_code_desc: "Саудовским банкам необходим рынок краткосрочной овернайт для перемещения денежных средств между ними. Эр-Рияду предстоит выбрать, будет ли эта ликвидность поступать через традиционную процентную ставку, товарную мурабаху или через две параллельные системы."
 SAU_the_banking_control_law: "Закон о банковском контроле"
 SAU_the_banking_control_law_desc: "Дискуссия о банковской системе завершается вопросом об авторитете. Будет ли SAMA регулировать деятельность как независимый технократический орган, будет ли право вето обладать советом шариата, или же обе организации будут контролировать свои собственные учреждения?"
 SAU_bastion_of_islamic_finance: "Оплот исламских финансов"
 SAU_bastion_of_islamic_finance_desc: "Исламские финансы могут быть защищенной саудовской ортодоксией или бизнесом, проданным более широкому мусульманскому миру. Строгие правила обеспечивают доверие улемов; прагматичные правила привлекают в Эр-Рияд больше клиентов."
 SAU_the_secularization_of_finance: "Секуляризация финансов"
 SAU_the_secularization_of_finance_desc: "Открытие доступа ко всем западным финансовым инструментам привлечет иностранный капитал и вырвет банковскую систему из-под контроля чиновников. Постепенный переход может смягчить негативную реакцию, но разрыв с традициями останется."
 SAU_a_defensive_deal_with_pakistan: "Оборонительное соглашение с Пакистаном"
 SAU_a_defensive_deal_with_pakistan_desc: "Пакистан располагает самой большой армией в мусульманском мире, и его бомба — единственная, которой обладает суннитское государство. Привяжите Исламабад к защите двух священных мечетей."
 SAU_sabic_industrialization: "Индустриализация SABIC"
 SAU_sabic_industrialization_desc: "§GSABIC§! (Saudi Basic Industries Corporation) — это крупнейший нефтехимический гигант Королевства, основанный в 1976 году. Он перерабатывает саудовскую нефть в пластмассы, удобрения и химикаты — строительные блоки современной экономики."
 SAU_establish_sagia: "Создать SAGIA"
 SAU_establish_sagia_desc: "Королевский указ установит §YГенеральное инвестиционное управление Саудовской Аравии§! привлечь §Gиностранный капитал§!SAGIA упростит процесс лицензирования, будет работать напрямую с международными инвесторами и содействовать развитию. §YЭр-Рияд§! как центр для §Yглобальный бизнес§!."
 SAU_tadawul_the_saudi_stock_exchange: "Тадавул, Саудовская фондовая биржа"
 SAU_tadawul_the_saudi_stock_exchange_desc: "Торговля акциями в Саудовской Аравии выросла из неформального рынка в... §Gобмен Тадавул§!Современному рынку капитала теперь необходимы формальные правила листинга, раскрытия информации и торговли, прежде чем он сможет реализовать инвестиционные амбиции Королевства."
 SAU_the_water_crisis: "Водный кризис"
 SAU_the_water_crisis_desc: "Водоносные горизонты Королевства истощаются. §Yопреснительные установки§! находятся под растущим давлением, и потребление воды на душу населения входит в число наиболее проблемных областей. §Yсамая высокая в мире§!Правительство должно официально признать кризис, прежде чем сможет предпринять какие-либо действия в масштабах всей страны."
 SAU_saudi_foreign_policy: "Внешняя политика Саудовской Аравии"
 SAU_saudi_foreign_policy_desc: "Трон, священные города и каждый танкер, покидающий Персидский залив, зависят от действий Эр-Рияда за рубежом. Саудовская дипломатия должна поддерживать тесные связи с великими державами, не позволяя ни одной из них брать на себя ответственность за безопасность Королевства."
 SAU_fortify_the_kingdom: "Укрепите Царство"
 SAU_fortify_the_kingdom_desc: "Если холодная война с Ираном перерастет в горячую, удар придется по Восточной провинции и проливу. Необходимо укрепить оборону государства на тот случай, когда сдерживание окажется неэффективным."
 SAU_freedom_or_death: "Свобода или смерть"
 SAU_freedom_or_death_desc: "Сирийская война стала проверкой силы воли между Эр-Риядом и Тегераном. Необходимо полностью поддержать восстание и поставить на карту престиж Саудовской Аравии в случае падения режима Асада."
 SAU_fund_the_jordanian_army: "Финансирование иорданской армии"
 SAU_fund_the_jordanian_army_desc: "Сильная иорданская армия охраняет протяженный северный фланг Королевства. Необходимо обеспечить солдат Аммана финансовой поддержкой, чтобы в критических ситуациях они отвечали перед Эр-Риядом."
 SAU_fund_the_lebanese_army: "Финансируйте ливанскую армию"
 SAU_fund_the_lebanese_army_desc: "В Ливане национальная армия является единственным противовесом государству «Хезболла» в рамках концепции «государства в государстве». Необходимо финансировать Ливанскую армию как конкурирующий полюс иранской милиции."
 SAU_fund_the_free_syrian_army: "Профинансируйте Свободную сирийскую армию"
 SAU_fund_the_free_syrian_army_desc: "Восстание против династии Асадов — это шанс разрушить мост Ирана к морю. Необходимо направлять деньги и оружие повстанцам, воюющим во имя свободной Сирии."
 SAU_guardians_of_the_two_mosques: "Стражи двух мечетей"
 SAU_guardians_of_the_two_mosques_desc: "Титул Хранителя двух священных мечетей дает королю религиозные права, недоступные другим мусульманским правителям. Совет не может присвоить себе этот титул, но он может укрепить свою легитимность, публично поддержав короля в этой роли."
 SAU_the_hormuz_shield: "Щит Ормуз"
 SAU_the_hormuz_shield_desc: "Иран угрожает перекрыть пролив при первых признаках войны. Необходимо создать воздушно-морской и военно-морской щит, с помощью союзников, который обеспечит бесперебойное движение танкеров, независимо от угроз со стороны Тегерана."
 SAU_the_india_middle_east_corridor: "Индийско-Ближневосточный коридор"
 SAU_the_india_middle_east_corridor_desc: "Новая железнодорожная сеть, включающая порты и трубопроводы, могла бы пройти от Мумбаи через Аравию в самое сердце Европы. Это сделало бы Королевство незаменимым звеном в коридоре, позволяющем обойти узкие места, находящиеся под контролем Ирана."
 SAU_install_a_loyalist_in_the_government: "Назначьте в правительство лоялиста."
 SAU_install_a_loyalist_in_the_government_desc: "К каждому важному министерству будет прикреплен действующий офицер, уполномоченный подписывать его решения. Министры сохранят свои звания, но военные получат прямой контроль над гражданской службой."
 SAU_king_fahd_university_of_petroleum_and_minerals: "Университет нефти и минералов имени короля Фахда"
 SAU_king_fahd_university_of_petroleum_and_minerals_desc: "Наука, технологии, инженерия и математика имеют приоритет. Королевству нужны инженеры, а не священнослужители. Соответственно, меняется и учебная программа."
 SAU_the_tatweer_education_project: "Образовательный проект Татвир"
 SAU_the_tatweer_education_project_desc: "Проект Tatweer будет делать упор на критическое мышление, анализ и дискуссии, а не на заучивание наизусть. Эта реформа меняет как методы обучения, так и образовательную культуру в целом."
 SAU_english_language_education: "Образование в области английского языка"
 SAU_english_language_education_desc: "Английский язык будет преподаваться с начальной школы, чтобы саудовские выпускники могли более эффективно участвовать в глобальной экономике."
 SAU_the_teachers_colleges: "Педагогические колледжи"
 SAU_the_teachers_colleges_desc: "Преподаватели пройдут современную подготовку в области педагогики, управления классом и образовательных технологий."
 SAU_tatweer_smart_schools: "Умные школы Татвира"
 SAU_tatweer_smart_schools_desc: "В рамках проекта Tatweer Smart Schools будут внедрены планшеты для использования в классах, онлайн-платформы для обучения и репетиторство с помощью искусственного интеллекта."
 SAU_king_abdulaziz_university: "Университет имени короля Абдулазиза"
 SAU_king_abdulaziz_university_desc: "Университеты, включая Университет короля Сауда, KAUST, KFUPM и Университет принцессы Нуры, расширят свою деятельность по всему Королевству и улучшат доступ к высшему образованию."
 SAU_king_abdullah_university_of_science_and_technology: "Университет науки и технологий имени короля Абдаллы"
 SAU_king_abdullah_university_of_science_and_technology_desc: "Партнерские отношения с Массачусетским технологическим институтом, Оксфордским университетом и Сорбонной, а также с зарубежными кампусами в Саудовской Аравии, позволят привлечь в Королевство международный академический опыт."
 SAU_the_king_abdullah_scholarship_program: "Стипендиальная программа короля Абдаллы"
 SAU_the_king_abdullah_scholarship_program_desc: "Программа стипендий имени короля Абдаллы предоставит финансовую поддержку тысячам саудовских студентов для обучения в ведущих зарубежных университетах. Выпускники вернутся с углубленной квалификацией и международным опытом."
 SAU_integrate_gosi_payrolls: "Интеграция системы расчета заработной платы GOSI."
 SAU_integrate_gosi_payrolls_desc: "Генеральная организация социального страхования уже знает, кто числится в штате каждого жителя Королевства, поскольку она собирает взносы. Никому не приходило в голову использовать эту базу данных для решения вопроса о квотах.\n\nКак только она подключается, номер Nitaqat компании автоматически подсчитывается, и количество фактически занятых саудовцев перестает соответствовать тому, что компания в последний раз указала в форме."
 SAU_reform_the_kafala_system: "Реформировать систему кафала"
 SAU_reform_the_kafala_system_desc: "Миллионы иностранных рабочих живут в Королевстве, привязанные к одному работодателю, который хранит их документы и разрешение на выезд. Реформа не прекращает эту систему — она делает ее понятной, мобильной и значительно упрощает въезд.\n\nПриток растет и становится упорядоченным. Фирмы перестают платить за работу в обход системы, которую никто не смог бы защитить публично."
 SAU_platinum_tier_privileges: "Привилегии платинового уровня"
 SAU_platinum_tier_privileges_desc: "Фирмы, входящие в высшую категорию, получают продление разрешений сразу же, их контракты утверждаются в первую очередь, и их расширение разрешается без проблем, в то время как конкуренты еще стоят в очереди.\n\nЭто ничего не стоит казначейству и обеспечивает большую степень соблюдения требований, чем любой штраф, когда-либо наложенный министерством."
 SAU_red_zone_visa_freezes: "Замораживание виз в «красной зоне»"
 SAU_red_zone_visa_freezes_desc: "Фирмы, находящиеся в нижней категории, не могут продлевать ни одного разрешения на работу, пока не выйдут из нее. Ограничения не распространяются — действие заморожено.\n\nНекоторые проводят реструктуризацию в течение квартала. Некоторые нанимают саудовцев, которые им не нужны. Некоторые просто прекращают свою деятельность, и министерство решило, что может с этим смириться."
 SAU_launch_the_qiwa_platform: "Запуск платформы Qiwa"
 SAU_launch_the_qiwa_platform_desc: "Один портал для всех трудовых операций в Королевстве — контракты, переводы, квоты, заявки на разрешения. То, что раньше занимало месяц работы с документами, доставляемыми курьером, теперь занимает всего один день.\n\nЭто наименее привлекательная часть этой программы, и именно по этому вопросу согласны обе стороны."
 SAU_repeal_the_expatriate_levy: "Отменить налог на иностранных работников"
 SAU_repeal_the_expatriate_levy_desc: "Ежемесячный сбор с каждого иностранного работника должен был вернуть саудовцев на частные рабочие места. На самом деле это привело к закрытию фирм с самой низкой рентабельностью и вынудило остальные компании нанимать сотрудников неофициально.\n\nОтмена этого сбора возвращает рабочую силу, на которой держится экономика, и ничего не возвращает в казну."
 SAU_high_skill_visa_fast_track: "Ускоренное оформление визы для высококвалифицированных специалистов"
 SAU_high_skill_visa_fast_track_desc: "Инженеры, хирурги и системные архитекторы, которых Королевство пока не может подготовить, проходят таможенный контроль за считанные дни, а не месяцы, вместе со своими семьями и без спонсора, имеющего паспорт.\n\nКоролевство покупает специалистов, которых оно еще не успело вырастить."
 SAU_abolish_the_noc_requirement: "Отменить требование о наличии разрешения на строительство (NOC)."
 SAU_abolish_the_noc_requirement_desc: "Работник может сменить работодателя без письменного разрешения своего нынешнего работодателя. Это один из пунктов, исключенных из трудового кодекса, и он прекращает действие системы, которая определяла ее функционирование.\n\nУведомления о капитале. То же самое касается всех, кто пользовался преимуществами старого правила."
 SAU_the_doroob_training_initiative: "Инициатива обучения Doroob"
 SAU_the_doroob_training_initiative_desc: "Национальная платформа электронного обучения для специалистов, востребованных в частном секторе, бесплатная для всех, кто имеет национальное удостоверение личности.\n\nОна не решит проблему рынка труда. Она устранит оправдание, что никто не прошел обучение."
 SAU_the_taqat_employment_portal: "Портал по трудоустройству Taqat"
 SAU_the_taqat_employment_portal_desc: "Национальный портал по трудоустройству: каждый соискатель работы в одном реестре, каждая соответствующая требованиям вакансия в другом, и министерство, которое наконец-то видит разрыв между ними.\n\nДжазан и северные приграничные районы впервые появляются в данных."
 SAU_the_saudization_quotas: "Квоты на саудизацию"
 SAU_the_saudization_quotas_desc: "Квота перестаёт быть единой общенациональной цифрой и превращается в график — для строительства, розничной торговли, телекоммуникаций и транспорта устанавливается минимальный уровень, взвешенный в зависимости от того, сколько саудовцев этот сектор может реально принять.\n\nМинистерство уже ошибалось в этой цифре раньше."
 SAU_subsidize_sme_compliance: "Субсидирование соблюдения требований для малых и средних предприятий"
 SAU_subsidize_sme_compliance_desc: "Конгломерат может установить квоту. Фирма из тридцати человек этого сделать не может, и такие фирмы нанимают больше саудовцев на каждый риал выручки, чем любой конгломерат в Королевстве.\n\nДешевый кредит, более щадящий график проверок и офисные помещения для роста."
 SAU_the_industrial_cadre_mandate: "Мандат на формирование кадров для промышленности"
 SAU_the_industrial_cadre_mandate_desc: "Тяжелой промышленности указывают, какая доля технического персонала должна состоять из саудовцев, и дают десятилетие на достижение этой цели. Нефтехимические гиганты могут это поглотить; подрядчикам вокруг них придется этому научиться.\n\nКоролевство прекращает импорт всех инженеров, работающих на трубопроводах."
 SAU_hrdf_wage_subsidies: "Субсидии на заработную плату от HRDF"
 SAU_hrdf_wage_subsidies_desc: "Фонд развития человеческих ресурсов выплачивает часть заработной платы нанятому из Саудовской Аравии сотруднику в течение первых лет работы, исходя из того, что разница между гражданином страны и иностранцем в основном заключается в разнице в опыте.\n\nКомпании получают субсидию. Вопрос о том, сохранится ли сотрудник после истечения срока действия субсидии, остается открытым."
 SAU_the_wusool_transport_subsidy: "Транспортная субсидия Wusool"
 SAU_the_wusool_transport_subsidy_desc: "Половина выпускников вузов в Королевстве — женщины, и почти ни одна из них не работает, а ограничивающим фактором является не талант или разрешение, а невозможность добраться до офиса.\n\nГосударство субсидирует проезд. Численность рабочей силы растет в таких масштабах, которые не смогла бы обеспечить никакая миграционная политика."
 SAU_foreign_ownership_deregulation: "Дерегулирование иностранной собственности"
 SAU_foreign_ownership_deregulation_desc: "Иностранная фирма может полностью владеть своим саудовским подразделением, без споров репатриировать прибыль и игнорировать местного партнера, который внес свою лепту и получил третью долю.\n\nКапитал поступает быстро. Как и вопрос о том, кому принадлежит промышленность Королевства."
 SAU_secondary_education_expansion: "Расширение среднего образования"
 SAU_secondary_education_expansion_desc: "Расширение сети средних школ. Развитие профессионального обучения. Каждый саудовский подросток имеет доступ к среднему образованию — академическому или профессиональному."
 SAU_technical_and_vocational_training_corporation: "Корпорация технического и профессионального обучения"
 SAU_technical_and_vocational_training_corporation_desc: "Технические колледжи готовят сантехников, электриков, механиков и сварщиков. Не каждому саудовцу нужен университетский диплом. Экономике нужны квалифицированные специалисты."
 SAU_saudi_internal_affairs: "Внутренние дела Саудовской Аравии"
 SAU_saudi_internal_affairs_desc: "Внутренняя политика Королевства будет направлена на обеспечение общественной безопасности, образования, здравоохранения и экономического благополучия. Эти системы обеспечивают основу для долгосрочной стабильности и развития."
 SAU_confront_the_literacy_crisis: "Противостояние кризису грамотности"
 SAU_the_anglo_style_curriculum: "Учебная программа англоязычного образца"
 SAU_the_anglo_style_curriculum_desc: "Учебная программа в англоязычном стиле привнесет в саудовские школы больше критического мышления, научных исследований и дискуссий. Экономике необходимы эти навыки, даже если улемы рассматривают их как иностранное вторжение."
 SAU_confront_the_literacy_crisis_desc: "В 2000 году более одного из пяти саудовцев не умели читать, что оставляло Королевство с проблемой... §Yуровень грамотности составляет всего 79%.§!Нефтяные деньги не смогут модернизировать страну без учителей, инженеров и служащих. Эр-Рияду предстоит сделать выбор между… §YУчебная программа в англоязычном стиле§! и а §Yотечественная система академических и профессиональных направлений§!.\n\n§GЛюбое направление работы в сфере образования способствует повышению уровня грамотности.§! к полной грамотности."
 SAU_education_transformation_complete: "Трансформация образования завершена."
 SAU_education_transformation_complete_desc: "Университеты расширились, учебные программы изменились, а уровень грамотности растет по всему Королевству. Реформы не решили всех проблем, но саудовские школы лучше подготовлены к предстоящей работе."
 SAU_domestic_secondary_tracks: "Внутренние второстепенные трассы"
 SAU_domestic_secondary_tracks_desc: "В саудовских средних школах разделение будет осуществляться на академическое и профессиональное направления, каждое из которых будет построено вокруг навыков, необходимых на родине. Создание такой системы обходится дороже, чем импорт зарубежной модели, но она отвечает приоритетам Саудовской Аравии."
 SAU_ministry_of_human_resources_mandate: "Мандат Министерства людских ресурсов"
 SAU_the_nitaqat_decree: "Указ Нитакат"
 SAU_the_nitaqat_decree_desc: "Королевство прекращает требовать от компаний найма саудовцев и начинает оценивать их выполнение. Каждой фирме присваивается цвет, который определяет, что фирме разрешено делать, и этот цвет рассчитывается на основе данных о заработной плате, которые министерство уже может видеть.\n\nЭто первая в истории Королевства трудовая политика с механизмом обеспечения ее соблюдения."
 SAU_ministry_of_human_resources_mandate_desc: "Министерство наделено полномочиями, которые, как предполагалось, у него всегда были: устанавливать квоты по секторам, отказывать в визе без объяснения причин и закрывать фирму, которая отказывается соблюдать требования.\n\nФирмы, которые годами лоббировали не тот департамент, обнаруживают, что теперь есть правильный, и он не заинтересован."
 SAU_fast_track_government_contracts: "Ускоренное оформление государственных контрактов"
 SAU_fast_track_government_contracts_desc: "Каждый риал, потраченный государством на инфраструктуру, становится инструментом трудовой политики. Добросовестные фирмы первыми подают заявки, первыми получают оплату и публично об этом сообщают.\n\nКоролевство является крупнейшим покупателем в Королевстве. Наконец, оно решило делать покупки в соответствии со своими потребностями."
 SAU_gip: "ГИП"
 SAU_gip_desc: "GIP повышает свой профессионализм. Обучение, оборудование и процедуры соответствуют международным стандартам. Внутренняя безопасность королевства становится более эффективной и заметной."
 SAU_the_open_market: "Открытый рынок"
 SAU_the_open_market_desc: "Решение состоит в том, чтобы перестать обращаться к государству. Правила собственности отменяются, контроль за движением капитала отменяется, и рынок решает, какие фирмы заслуживают существования и какие саудовцы им нужны.\n\nЭто более быстрый и более сложный путь. Никто из тех, кто потеряет работу на этом пути, не пострадает ни от чего."
 SAU_opec_agreement: "Соглашение ОПЕК+"
 SAU_opec_agreement_desc: "Москва и Эр-Рияд — соперники на нефтяном рынке и находятся по разные стороны баррикад в Сирии, но вместе они могут устанавливать цену на нефть. Им нужно заключить сделку, которая позволит сохранить целостность картеля из двух стран."
 SAU_command_of_the_gulf: "Командование Персидского залива"
 SAU_command_of_the_gulf_desc: "После разгрома иранского флота и сохранения открытого доступа к проливу, Королевство стало хозяином вод Персидского залива. Долгая борьба за море выиграна."
 SAU_the_iraq_war: "Иракская война"
 SAU_the_iraq_war_desc: "Американские танки катятся к Багдаду, и старый порядок в Месопотамии вот-вот будет сметен. Королевству предстоит подготовиться к тому, что возникнет из руин."
 SAU_king_in_name_heir_in_uniform: "Король по имени, наследник по званию"
 SAU_king_in_name_heir_in_uniform_desc: "Трон сохранится, но наследником станет одновременно принц и действующий офицер, приемлемый для Совета. Этот компромисс сохраняет династию, но ставит вопрос о престолонаследии под военный надзор."
 SAU_the_kingdom_unbeholden: "Королевство Без Покровителей"
 SAU_the_kingdom_unbeholden_desc: "Королевство откажется от иностранных гарантий безопасности и покровительства и будет полагаться исключительно на собственную оборону. Это самый дорогостоящий вариант, но он сохраняет полную стратегическую независимость."
 SAU_martial_law_issues: "Вопросы военного положения"
 SAU_martial_law_issues_desc: "Военные власти будут контролировать публичные собрания, передвижение между провинциями и прессу. Поскольку в Королевстве нет конституции, действие которой можно было бы приостановить, эти ограничения могут быть введены непосредственно указом."
 SAU_secure_support_in_the_mecca_province: "Оказание поддержки в провинции Мекка"
 SAU_secure_support_in_the_mecca_province_desc: "Провинция Мекка включает в себя Джидду, центры паломничества, влиятельные купеческие семьи и хиджазское население, проживающее здесь еще до прихода к власти Саудовской Аравии. Совет будет использовать патронаж, силы безопасности и политические уступки для обеспечения безопасности провинции."
 SAU_the_mecca_summit: "Саммит в Мекке"
 SAU_the_mecca_summit_desc: "Королевство проведет переговоры в Мекке и использует саммит для укрепления позиций Эр-Рияда как посредника в мусульманском мире."
 SAU_memories_of_khafji: "Воспоминания о Хафджи"
 SAU_memories_of_khafji_desc: "В 1991 году иракские бронетанковые войска ненадолго захватили приграничный с Саудовской Аравией город, и это унижение Королевство никогда не забудет. Пусть память о Хафджи укрепит оборону страны, предотвратив повторение подобного."
 SAU_the_military_takeover: "Военный переворот"
 SAU_the_military_takeover_desc: "Вооруженные силы захватили министерства, телерадиовещательные компании и подъездные пути к королевским дворцам. Национальная гвардия, созданная для предотвращения подобного переворота, оказалась в окружении, в результате чего контроль над королевством перешел к военным."
 SAU_the_monarchy_under_military_rule: "Монархия при военном правлении"
 SAU_the_monarchy_under_military_rule_desc: "Король останется во дворце и продолжит подписывать указы, но Совет будет контролировать вооруженные силы и определять государственную политику. Монархия сохранится как формальный институт, не обладающий независимой властью."
 SAU_the_royal_saudi_naval_forces: "Королевские военно-морские силы Саудовской Аравии"
 SAU_the_royal_saudi_naval_forces_desc: "Укрепить Королевские военно-морские силы Саудовской Аравии (КСВ), рассредоточенные по двум морям, для охраны протяженного побережья Королевства."
 SAU_eastern_fleet_jubail: "Восточный флот (Джубайль)"
 SAU_eastern_fleet_jubail_desc: "Разместите Восточный флот в Джубайле для установления господства в Персидском заливе и защиты нефтяных терминалов."
 SAU_western_fleet_jeddah: "Западный флот (Джедда)"
 SAU_western_fleet_jeddah_desc: "Разместите Западный флот в Джидде для обеспечения безопасности побережья Красного моря и подходов к Баб-эль-Мандебскому проливу."
 SAU_sawari_ii_frigate_programme: "Программа создания фрегата «Савари II»"
 SAU_sawari_ii_frigate_programme_desc: "Приобретите построенные во Франции фрегаты класса «Аль-Рияд» в рамках программы «Савари II», самые мощные корабли флота."
 SAU_badr_class_corvettes: "Корветы класса «Бадр»"
 SAU_badr_class_corvettes_desc: "Используйте построенные в США корветы класса «Бадр» для патрулирования, сопровождения и нанесения ударов по прибрежным водам."
 SAU_royal_saudi_marines: "Королевская саудовская морская пехота"
 SAU_royal_saudi_marines_desc: "Создать Королевский морской пехотный корпус Саудовской Аравии для проведения десантных операций и обороны побережья и островов."
 SAU_king_faisal_naval_base: "Военно-морская база имени короля Фейсала"
 SAU_king_faisal_naval_base_desc: "Развивать крупные военно-морские базы в Джидде и Джубайле для обеспечения существования флота из двух флотов."
 SAU_neom_aqaba_synergy: "Синергия NEOM-Акаба"
 SAU_neom_aqaba_synergy_desc: "Там, где саудовский мегаполис NEOM граничит с иорданским портом Акаба, единая экономическая зона могла бы преодолеть пропасть между ними. Объединить два берега в один двигатель роста."
 SAU_deal_with_the_french: "Договоритесь с французами"
 SAU_deal_with_the_french_desc: "Париж продает оружие кому попало и читает всем лекции, но бизнес есть бизнес. Тщательно продуманное инвестиционное соглашение позволяет Королевству получать прибыль от французской промышленности, сохраняя при этом доступ к лучшим альтернативам."
 SAU_a_new_iraqi_alignment: "Новая иракская коалиция"
 SAU_a_new_iraqi_alignment_desc: "Годы терпеливой дипломатии и покровительства приносят свои плоды: Багдад, наконец, склоняется к Эр-Рияду. Необходимо закрепить новый курс, прежде чем он снова сместится в сторону Тегерана."
 SAU_major_non_nato_ally: "Крупный союзник, не входящий в НАТО"
 SAU_major_non_nato_ally_desc: "В отсутствие договорного союза, ближайшим аналогом для страны, находящейся рядом с атлантическими державами, является статус привилегированного партнера. Необходимо обеспечить Королевству статус крупного союзника, не входящего в НАТО."
 SAU_the_palestine_question: "Палестинский вопрос"
 SAU_the_cause_above_all: "Главное дело"
 SAU_the_cause_above_all_desc: "Королевство сделает поддержку Палестины центральным элементом своих претензий на лидерство в мусульманском мире и своей роли Хранителя двух священных мечетей."
 SAU_open_the_backchannel: "Откройте обратный канал"
 SAU_open_the_backchannel_desc: "Тихие, сдержанные и терпеливые люди в третьих странах выясняют, что Тель-Авив может принять, прежде чем какая-либо из сторон выскажется вслух."
 SAU_the_arab_peace_initiative: "Арабская мирная инициатива"
 SAU_the_arab_peace_initiative_desc: "Собственный план Королевства, предложенный в Бейруте в 2002 году и никогда не отзывавшийся: полная нормализация отношений со всем арабским миром в обмен на независимую Палестину в границах 1967 года. Эр-Рияд вновь выносит его на обсуждение, официально и в письменном виде."
 SAU_sweeten_the_deal: "Сделать предложение более привлекательным"
 SAU_sweeten_the_deal_desc: "Инвестиционные фонды, технологические коридоры и открытое небо. Эр-Рияд показывает Тель-Авиву, чего стоит мир с крупнейшей экономикой Персидского залива."
 SAU_the_talks_collapse: "Переговоры провалились"
 SAU_the_talks_collapse_desc: "Израиль не станет платить такую цену, а Эр-Рияд не станет ее снижать. Делегации улетают домой, и вопрос возвращается к своему прежнему ответу."
 SAU_the_riyadh_accords: "Эр-Риядские соглашения"
 SAU_the_riyadh_accords_desc: "Израиль принял Арабскую мирную инициативу. Признание государственности в соответствии с границами 1967 года, с гарантией образования новой Палестины со стороны Саудовской Аравии и Иордании: сделка века, подписанная в Эр-Рияде."
 SAU_embassies_and_trade: "Посольства и торговля"
 SAU_embassies_and_trade_desc: "Авиарейсы, торговые миссии и приток капитала между Эр-Риядом и Тель-Авивом. Мир начинает окупать себя."
 SAU_silicon_and_sand: "Кремний и песок"
 SAU_silicon_and_sand_desc: "Израильские технологии и саудовский капитал — естественные партнеры. Совместные предприятия в сфере кибербезопасности, водоснабжения и агротехнологий успешно развиваются в обеих пустынях."
 SAU_double_down_on_palestine: "Удвоить усилия в отношении Палестины"
 SAU_double_down_on_palestine_desc: "Если Израиль не предоставит государство, Королевство все равно его построит: деньги, институты и влияние Саудовской Аравии в Рамалле."
 SAU_rally_the_arab_league: "Объединить Лигу арабских государств"
 SAU_rally_the_arab_league_desc: "Провал переговоров подтвердил правоту каждой колеблющейся столицы. Эр-Рияд объединяет Лигу за одной линией: нормализация отношений невозможна без Палестины."
 SAU_no_peace_without_palestine: "Нет мира без Палестины"
 SAU_the_fate_of_palestine: "Судьба Палестины"
 SAU_the_fate_of_palestine_desc: "Будь то договором или сопротивлением, Королевство связало себя с будущим Палестины. Хранитель двух священных мечетей не покидает Иерусалим."
 SAU_no_peace_without_palestine_desc: "Пока Палестина остается оккупированной, в Тель-Авиве не будет посольства. Королевство придерживается линии, установленной арабским миром в 2002 году."
 SAU_normalization_with_conditions: "Нормализация с условиями"
 SAU_normalization_with_conditions_desc: "Цена, которую Эр-Рияд требует со времен Арабской мирной инициативы, не изменилась: признание государственности. Если Израиль хочет получить от Королевства поддержку, он примет независимую Палестину."
 SAU_normalization_without_conditions: "Нормализация без условий"
 SAU_normalization_without_conditions_desc: "Королевство признает Израиль без каких-либо уступок по Палестине. Это улучшит отношения с Соединенными Штатами и будет способствовать развитию торговли, но вызовет значительное сопротивление во всем арабском мире."
 SAU_normalization_champion_the_palestinian_cause: "Поддержите палестинское дело"
 SAU_normalization_champion_the_palestinian_cause_desc: "Благодаря саудовским деньгам в Рамалле продолжают работать власти, а в каждой арабской столице продолжается поддержка этого дела."
 SAU_strengthen_the_resistance: "Укрепить сопротивление"
 SAU_strengthen_the_resistance_desc: "Фракции, сопротивляющиеся оккупации, не будут испытывать недостатка в средствах или друзьях, пока Эр-Рияд их поддерживает."
 SAU_boycott_israeli_goods: "Бойкот израильских товаров"
 SAU_boycott_israeli_goods_desc: "Ни один саудовский риал не коснется израильской полки. Рынок Королевства закрывается."
 SAU_pressure_the_normalizers: "Оказывайте давление на нормализаторы"
 SAU_pressure_the_normalizers_desc: "Любое арабское правительство, соблазненное рукопожатием Тель-Авива, первым почувствует недовольство Эр-Рияда. Ряды держатся, потому что их удерживает Королевство."
 SAU_an_arab_consensus: "Арабский консенсус"
 SAU_an_arab_consensus_desc: "От Рабата до Багдада Королевство выражает в адрес Израиля единый арабский голос: никакого признания, никаких отношений, никаких исключений."
 SAU_the_palestine_question_desc: "У каждой арабской столицы есть свой ответ на израильский вопрос; единого мнения нет. Теперь Эр-Рияду предстоит сделать свой выбор: мир без условий, мир с ценой определенных жертв или полное отсутствие мира."
 SAU_a_deal_with_south_korea: "Сделка с Южной Кореей"
 SAU_a_deal_with_south_korea_desc: "Корейские верфи, реакторы и строительные гиганты внесли значительный вклад в создание современной инфраструктуры Персидского залива. Компания Court Seoul выступает партнером в области атомной энергетики, оборонной промышленности и мегапроектов программы Vision 2030."
 SAU_saudi_china_deal: "Саудовско-китайская сделка"
 SAU_saudi_china_deal_desc: "Китайские фирмы жаждут нефтяных контрактов и закрепления на рынке Персидского залива. Предложите им доступ к саудовским сельскохозяйственным и энергетическим проектам в обмен на инвестиции в Королевство."
 SAU_operation_red_gulf: "Операция «Красный залив»"
 SAU_operation_red_gulf_desc: "В случае начала холодной войны Королевство должно быть готово перенести боевые действия на иранский берег. Необходимо разработать планы решающей кампании в водах Персидского залива."
 SAU_palestine_champion_the_palestinian_cause: "Поддержите палестинское дело"
 SAU_bankroll_the_resistance: "Финансируйте Сопротивление"
 SAU_bankroll_the_resistance_desc: "Слова ничего не стоят. Необходимо направлять реальные деньги и оружие палестинским группировкам, чтобы борьбу определяло влияние Саудовской Аравии, а не Ирана."
 SAU_arm_the_militants: "Вооружите боевиков"
 SAU_arm_the_militants_desc: "Окажите всестороннюю поддержку вооруженным группировкам. Эр-Рияд становится главным поставщиком оружия, борясь с Тегераном за лояльность каждого бойца в Газе."
 SAU_guardian_of_al_aqsa: "Хранитель Аль-Аксы"
 SAU_guardian_of_al_aqsa_desc: "Поддержка Саудовской Аравии обеспечила Эр-Рияду прочную роль в Палестине и укрепила его претензии на охрану мечети Аль-Акса."
 SAU_broker_a_two_state_peace: "Выступал посредником в достижении мира между двумя государствами."
 SAU_broker_a_two_state_peace_desc: "Королевство выступит посредником в урегулировании конфликта на основе принципа двух государств. Успешное соглашение, достигнутое при поддержке Саудовской Аравии, расширит дипломатическое влияние Эр-Рияда в арабском мире."
 SAU_palestine_champion_the_palestinian_cause_desc: "Палестина остается одним из наиболее важных политических вопросов в арабском мире. Поддержка палестинского дела укрепит претензии Королевства на лидерство среди мусульман и противодействует иранскому влиянию."
 SAU_ceasefire_with_the_houthis: "Прекращение огня с хуситами"
 SAU_ceasefire_with_the_houthis_desc: "Предложите хуситам прекращение огня, которое остановит потери Саудовской Аравии и заморозит фронт. Если они согласятся, мир будет означать сосуществование с вооруженным врагом на южной границе."
 SAU_the_great_pipeline_game: "Великая игра трубопроводов"
 SAU_the_great_pipeline_game_desc: "Большая часть саудовского экспорта нефти проходит через Ормузский пролив, что делает его уязвимым для иранского вмешательства. Королевство рассмотрит три альтернативных маршрута трубопроводов: через Йемен к Аравийскому морю, через Сирию к Средиземному морю или через Ирак и Турцию в Европу; каждый из них проходит через нестабильный регион и конкурирует с российскими энергетическими интересами."
 SAU_prepare_defences_against_saddam: "Подготовка обороны против Саддама"
 SAU_prepare_defences_against_saddam_desc: "Загнанный в угол Саддам — опасная фигура. Укрепите северную границу против армии, которая когда-то базировалась в Кувейте, в дне езды от нефтяных месторождений."
 SAU_proclaim_the_republic: "Провозгласите Республику"
 SAU_proclaim_the_republic_desc: "Совет официально упразднит монархию и провозгласит республику. Институты нового государства остаются неупорядоченными, но трон Аль Саудов не переживет этого провозглашения."
 SAU_reaffirming_the_quincy_agreement: "Подтверждение соглашения с Куинси"
 SAU_reaffirming_the_quincy_agreement_desc: "В феврале 1945 года Рузвельт и Абдулазиз заложили основу саудовско-американских отношений на борту линкора USS Quincy: американская поддержка в сфере безопасности в обмен на надежные поставки саудовской нефти. Совет будет добиваться подтверждения того, что это соглашение распространяется на саудовское государство, а не только на монархию."
 SAU_the_regency_decree: "Указ эпохи Регентства"
 SAU_the_regency_decree_desc: "Король подпишет указ о передаче исполнительной и оборонной власти Совету на неопределенный период недееспособности. Указ сохраняет юридическую видимость, но при этом устанавливает военный контроль над правительством."
 SAU_master_the_crisis: "Преодолейте кризис"
 SAU_master_the_crisis_desc: "Как бы ни была организована подача воды, теперь она течет, и министерство наконец-то может планировать на год, а не на сезон.\n\n§YУстраняет последние остатки водного кризиса§!. Будет доступно, как только Рас-эль-Хайр или Шуайба будут подключены к водоснабжению.\n\nКоролевство прекращает нормирование и начинает строительство."
 SAU_arm_the_faithful: "Вооружите верных"
 SAU_arm_the_faithful_desc: "Обеспечить вооружением и подготовкой ополченцев революции."
 SAU_hezbollah_brigades: "Бригады Хезболлы"
 SAU_hezbollah_brigades_desc: "Превратить ополчение в дисциплинированные бригады по образцу ливанского сопротивления."
 SAU_shia_civil_rights: "Гражданские права шиитов"
 SAU_shia_civil_rights_desc: "Гарантировать шиитской общине равные права перед законом, положив конец десятилетиям официальной дискриминации."
 SAU_sectarian_coexistence: "Сектантское сосуществование"
 SAU_sectarian_coexistence_desc: "Сформировать национальный договор между суннитами и шиитами, основанный на принципах общего гражданства."
 SAU_the_constitutional_shia_republic: "Конституционная шиитская республика"
 SAU_the_federal_welfare_state: "Федеральное государство всеобщего благосостояния"
 SAU_the_federal_welfare_state_desc: "Развивать институты конституционной республики: федеративного государства всеобщего благосостояния, которое объединяет общины посредством общего процветания и верховенства права."
 SAU_the_constitutional_shia_republic_desc: "Увенчайте умеренный путь конституционной республикой, гарантирующей права шиитов в рамках плюралистического порядка."
 SAU_develop_the_eastern_province: "Развивайте Восточную провинцию"
 SAU_develop_the_eastern_province_desc: "Направить нефтяные богатства республики в давно заброшенный шиитский регион на востоке."
 SAU_export_the_revolution: "Экспортируйте революцию"
 SAU_export_the_revolution_desc: "Распространить революцию за пределы Аравии, к шиитам Персидского залива."
 SAU_federal_autonomy: "Федеральная автономия"
 SAU_federal_autonomy_desc: "Передать реальную власть шиитским провинциям в рамках федеративного, плюралистического союза."
 SAU_alliance_with_iran: "Союз с Ираном"
 SAU_alliance_with_iran_desc: "Привязать новое государство к Тегерану, покровителю шиитской революции во всем регионе."
 SAU_the_islamic_republic_of_arabia: "Исламская Республика Аравия"
 SAU_the_revolutionary_state: "Революционное государство"
 SAU_the_revolutionary_state_desc: "Исламская Республика централизует свои институты, ополчение и духовенство под руководством дисциплинированного революционного правительства, действующего в союзе с сопротивлением."
 SAU_the_islamic_republic_of_arabia_desc: "Провозгласить Исламскую Республику под опекой юриста, входящего в ось сопротивления."
 SAU_shia_national_dialogue: "Национальный диалог"
 SAU_shia_national_dialogue_desc: "Стремитесь к защите прав шиитов путем переговоров и голосования, а не путем конфронтации."
 SAU_the_parliamentary_path: "Парламентский путь"
 SAU_the_parliamentary_path_desc: "Передайте движение в руки выборного собрания, открыто оспаривая власть как лояльная оппозиция."
 SAU_reconcile_with_the_republic: "Примириться с Республикой"
 SAU_reconcile_with_the_republic_desc: "Забудьте о старых обидах и займите место в рамках национальной системы, променяв революцию на представительство."
 SAU_guarantee_religious_freedom: "Гарантия свободы вероисповедания"
 SAU_guarantee_religious_freedom_desc: "Защитить обряды и семинарии каждой общины в условиях толерантной светской республики."
 SAU_the_republic_endures: "Республика существует"
 SAU_the_republic_endures_desc: "Временный период закончился. Теперь шиитская республика управляет страной посредством постоянных институтов, и граждане должны считать её нерушимым государством Аравии."
 SAU_the_resistance: "Сопротивление"
 SAU_the_resistance_desc: "Призовите верующих к вооруженной борьбе в духе «Хиджазской Хезболлы»."
 SAU_the_revolutionary_vanguard: "Революционный авангард"
 SAU_the_revolutionary_vanguard_desc: "Поставьте вооруженное духовенство во главу государства, выше партии и парламента."
 SAU_wilayat_al_faqih: "Вилаят аль-Факих"
 SAU_wilayat_al_faqih_desc: "Закрепить за собой опеку над юристом, наделив высшим авторитетом верховного религиозного лидера."
 SAU_the_national_charter: "Национальная хартия"
 SAU_the_national_charter_desc: "Провозгласите писаную конституцию, которая обязывает как правителя, так и подданных соблюдать закон."
 SAU_liberalize_the_economy: "Либерализация экономики"
 SAU_liberalize_the_economy_desc: "Открыть закрытую экономику для конкуренции и частного предпринимательства."
 SAU_privatize_the_state_sector: "Приватизировать государственный сектор"
 SAU_privatize_the_state_sector_desc: "Продайте раздутые государственные предприятия в частные руки и позвольте рынку работать."
 SAU_open_to_foreign_investment: "Открыт для иностранных инвестиций"
 SAU_open_to_foreign_investment_desc: "Приветствуем приток иностранного капитала для строительства заводов, которых в королевстве никогда не было."
 SAU_diversify_beyond_oil: "Диверсификация экономики за пределами нефтяной отрасли."
 SAU_diversify_beyond_oil_desc: "Отучить республику от использования нефти, построив экономику, которая переживет период добычи нефти."
 SAU_secure_property_rights: "Надежные права собственности"
 SAU_secure_property_rights_desc: "Закрепите право собственности и право сохранять то, что вы построили."
 SAU_free_trade_agreements: "Соглашения о свободной торговле"
 SAU_free_trade_agreements_desc: "Подписать соглашения об открытой торговле, которые свяжут Аравию с мировыми рынками."
 SAU_an_independent_central_bank: "Независимый центральный банк"
 SAU_an_independent_central_bank_desc: "Освободите денежно-кредитную систему от политического вмешательства."
 SAU_champion_the_private_sector: "Поддержите частный сектор"
 SAU_champion_the_private_sector_desc: "Поддержите предпринимателей и малый бизнес, которые являются движущей силой свободной экономики."
 SAU_equality_for_women: "Равенство для женщин"
 SAU_equality_for_women_desc: "Отменить законы об опеке и обеспечить женщинам равные права в общественной жизни."
 SAU_reform_the_schools: "Реформировать школы"
 SAU_reform_the_schools_desc: "Замените механическое заучивание наизусть современной светской учебной программой."
 SAU_an_elected_majlis_al_shura: "Избранный Меджлис аш-Шура"
 SAU_an_elected_majlis_al_shura_desc: "Преобразовать назначенный Консультативный совет в свободно избранный национальный парламент."
 SAU_freedom_of_religion: "Свобода вероисповедания"
 SAU_freedom_of_religion_desc: "Гарантировать каждой конфессии право свободно и открыто исповедовать свою веру."
 SAU_nda_secular_republic: "Светская республика"
 SAU_nda_secular_republic_desc: "Проведите четкую границу между мечетью и государством."
 SAU_empower_civil_society: "Расширение прав и возможностей гражданского общества"
 SAU_empower_civil_society_desc: "Легализовать профсоюзы, благотворительные организации и объединения, которые сплачивают свободный народ."
 SAU_guarantee_labor_rights: "Гарантия трудовых прав"
 SAU_guarantee_labor_rights_desc: "Обеспечьте право на организацию, забастовку и справедливую заработную плату."
 SAU_a_human_rights_charter: "Хартия прав человека"
 SAU_a_human_rights_charter_desc: "Обязать республику соблюдать всеобщие права всех своих граждан."
 SAU_realign_with_the_west: "Возобновить сближение с Западом"
 SAU_realign_with_the_west_desc: "Направить республику в сторону Вашингтона и Брюсселя как партнеров среди демократических государств."
 SAU_mend_the_gulf: "Исцелить Персидский залив"
 SAU_mend_the_gulf_desc: "Примириться с государствами Персидского залива как с арабской нацией, со всеми монархиями."
 SAU_join_the_worlds_institutions: "Присоединяйтесь к мировым институциям"
 SAU_join_the_worlds_institutions_desc: "Займите место Аравии в советах международного порядка."
 SAU_open_the_borders: "Открыть границы"
 SAU_open_the_borders_desc: "Облегчите перемещение людей и товаров через более свободную границу."
 SAU_an_arab_democratic_league: "Арабская демократическая лига"
 SAU_an_arab_democratic_league_desc: "Объединить демократические страны арабского мира под единым знаменем во главе с Эр-Риядом."
 SAU_the_first_free_elections: "Первые свободные выборы"
 SAU_the_first_free_elections_desc: "Предоставить право голоса каждому гражданину и позволить народу выбирать собственное правительство."
 SAU_an_independent_judiciary: "Независимая судебная система"
 SAU_an_independent_judiciary_desc: "Освободить суды от дворцового влияния, создав судебную систему, подотчетную только закону."
 SAU_freedom_of_the_press: "Свобода печати"
 SAU_freedom_of_the_press_desc: "Освободите газеты и эфир от цензурных ограничений."
 SAU_the_anti_corruption_commission: "Антикоррупционная комиссия"
 SAU_the_anti_corruption_commission_desc: "Нашли независимую организацию по надзору, чтобы искоренить коррупцию в высших эшелонах власти."
 SAU_decentralize_the_provinces: "Децентрализовать провинции"
 SAU_decentralize_the_provinces_desc: "Передать реальную власть выборным провинциальным советам по всему королевству."
 SAU_limit_the_executive: "Ограничение полномочий исполнительной власти"
 SAU_limit_the_executive_desc: "Ограничить президентскую должность сроками полномочий, чтобы ни один лидер не правил пожизненно."
 SAU_the_provisional_government: "Временное правительство"
 SAU_convene_the_national_assembly: "Созовите Национальное собрание"
 SAU_convene_the_national_assembly_desc: "Временное правительство созовет политические партии новой республики и определит, какое движение возглавит постоянное государство."
 SAU_the_communist_party: "Коммунистическая партия"
 SAU_the_communist_party_desc: "Коммунистическая партия Саудовской Аравии провела четыре десятилетия в подполье, в изгнании или в тюрьме. Ее оставшееся руководство возвращается в Эр-Рияд с небольшим, но хорошо организованным движением."
 SAU_the_national_democratic_assembly: "Национальное демократическое собрание"
 SAU_the_national_democratic_assembly_desc: "Передайте новую республику либеральным демократам из Национального демократического собрания. Они обещают писаную конституцию, выборный парламент и открытую экономику, подотчетную избирательной урне."
 SAU_the_arab_baath_party: "Арабская партия Баас"
 SAU_the_arab_baath_party_desc: "Передайте республику в руки Арабской социалистической партии Баас, светских панарабских националистов, мечтающих о единой арабской нации."
 SAU_the_islamic_parties: "Исламские партии"
 SAU_the_islamic_parties_desc: "Представители движения «Сахва», сети «Братьев-мусульман» и исламские благотворительные общества пережили неоднократные запреты и теперь требуют участия в постреволюционном правительстве."
 SAU_the_provisional_government_desc: "Переходный национальный совет управляет страной без конституции, без выборов и без четко определенного будущего. Его первоочередная задача — просто поддерживать порядок и заложить основу для будущей республики."
 SAU_restoration_of_relations: "Восстановление отношений"
 SAU_restoration_of_relations_desc: "Многолетние разрывы связей осторожно сменяются возобновлением работы посольств. Необходимо сдерживать опасную разрядку в отношениях с Исламской Республикой, не уступая при этом интересам Королевства."
 SAU_the_house_that_rules_the_kingdom: "Дом, правящий королевством"
 SAU_the_house_that_rules_the_kingdom_desc: "Династия Аль-Сауд правит центральной Аравией на протяжении многих поколений. После инсульта короля Фахда в 1995 году... §Yэффективная мощность§! Теперь же за контроль над престолонаследием соревнуются старшие принцы."
 SAU_sanction_the_southern_bloc: "Ввести санкции против Южного блока"
 SAU_sanction_the_southern_bloc_desc: "Задушить финансы проиранских фракций по всему региону. Санкции и черные списки лишают друзей Тегерана денег, которые обеспечивают их лояльность."
 SAU_saddam_falls: "Водопад Саддама"
 SAU_saddam_falls_desc: "Статуи сносят, режим рушится, оставляя вакуум там, где когда-то стояло великое арабское государство. Эр-Рияд должен действовать, прежде чем Тегеран заполнит его."
 SAU_saddam_endures: "Саддам остаётся на своем посту"
 SAU_saddam_endures_desc: "Баасистский режим переживает бурю, раненый, но не сломленный. Старый враг остается по ту сторону северной границы, и Королевству придется еще какое-то время жить с тираном Багдада."
 SAU_saudi_economic_focus_tree: "Дерево экономических приоритетов Саудовской Аравии"
 SAU_saudi_economic_focus_tree_desc: "Нефть покрывает все расходы, значительная часть работы выполняется иностранными рабочими, а саудовский капитал слишком часто покидает страну. Следующая экономика должна производить больше продукции внутри страны, нанимать больше саудовцев и предоставлять городам за пределами Эр-Рияда долю в экономическом росте."
 SAU_national_water_company: "Национальная водопроводная компания"
 SAU_national_water_company_desc: "Королевство строит собственные водопроводные сети. Одна государственная компания, одно распоряжение, и трубопроводы ведут в города, инвестиции в которые с коммерческой точки зрения никогда бы не оправдали себя.\n\n§GГранты Национальной водопроводной компании§! и §Gодна инфраструктура в Наджд§!, и §Yоблегчает водный кризис на один шаг§!.\n\nЭто медленнее и дороже, чем передать дело на аутсорсинг. Оно останется в Саудовской Аравии."
 SAU_a_saudi_spanish_partnership: "Саудовско-испанское партнерство"
 SAU_a_saudi_spanish_partnership_desc: "Испанские верфи строят новые корветы для Королевства, а испанские фирмы — высокоскоростную железную дорогу в Мекку. Необходимо развивать Мадрид как полезного европейского партнера за пределами привычного круга."
 SAU_sermons_from_the_ministry: "Проповеди из служения"
 SAU_sermons_from_the_ministry_desc: "Министерство пересмотрит пятничную хутбу, распространяемую в мечетях по всему Королевству. Единый текст, зачитываемый примерно с пятнадцати тысяч кафедр, даст правительству прямое влияние на религиозные послания."
 SAU_recognize_the_shia_clergy: "Признайте шиитское духовенство."
 SAU_recognize_the_shia_clergy_desc: "Предоставьте §YШиитские улемы§! официальный статус наравне с ваххабитской элитой.\n\n§G+Стабильность, +Шиитское население§!."
 SAU_crackdown_on_shia_dissent: "Преследование шиитского инакомыслия"
 SAU_crackdown_on_shia_dissent_desc: "Отвечайте на несогласие с помощью §YMabahith§! и §YNational Guard§!. За шиитами будут следить, их будут сдерживать и оттеснять на периферию, а суннитское большинство будет от этого спокойнее.\n\n§R+Шиитское сопротивление§!, §R-Шиитское население§!, §G+Стабильность, +Поддержка войны§!."
 SAU_sunni_shia_dialogue: "Диалог между суннитами и шиитами"
 SAU_sunni_shia_dialogue_desc: "Национальный диалог, призванный положить начало исцелению от четырнадцативекового раскола.\n\n§G-Сопротивление шиитов, +Стабильность, +Шиитское население§!."
 SAU_invest_in_the_eastern_province: "Инвестируйте в Восточную провинцию."
 SAU_invest_in_the_eastern_province_desc: "Вливайте нефтедоллары в шиитский центр — дороги, больницы, порты.\n\n§G+Стабильность, +Шиитское население§!."
 SAU_resettling_the_eastern_province: "Переселение Восточной провинции"
 SAU_resettling_the_eastern_province_desc: "Шиитский вопрос наконец-то решен. §YВосточная провинция§! Проблема замалчивания усугубляется путем переселения пациентов на протяжении целого поколения.\n\n§R--Шиитское население§!, §Gсопротивление нарушено§!, §G++Стабильность§!."
 SAU_economic_inclusion: "Экономическая интеграция"
 SAU_economic_inclusion_desc: "Разделите богатства нефтяных месторождений с теми, кто живет над ними. Наконец-то начинает заживать рана, нанесенная межконфессиональной рознью.\n\n§GСопротивление закончилось, +Стабильность, +Шиитское население§!."
 SAU_equal_educational_access: "Равный доступ к образованию"
 SAU_equal_educational_access_desc: "Постройте школы и университеты в §YQatif§! и §YAl-Ahsa§!, чтобы они соответствовали школам и университетам Наджд.\n\n§G+Стабильность, +Шиитское население§!."
 SAU_embrace_shia_citizens: "Примите граждан-шиитов."
 SAU_embrace_shia_citizens_desc: "Примите шиитов как полноправных граждан — и начните путь, который может завершиться §YДом Саудов§! переосмысление веры, которую оно было призвано подавить.\n\n§G+Шиитское население, -Шиитское сопротивление§!."
 SAU_sectarian_harmony: "Сектантская гармония"
 SAU_sectarian_harmony_desc: "Сунниты и шииты, одна нация под одной короной.\n\n§GСопротивление закончилось, +Стабильность, +Шиитское население§!."
 SAU_integrate_the_communities: "Интегрировать общины"
 SAU_integrate_the_communities_desc: "Открыть армию, полицию и бюрократию для граждан-шиитов, присягнувших на верность короне.\n\n§G-Сопротивление шиитов, +Стабильность, +Шиитское население§!."
 SAU_the_shia_question: "Шиитский вопрос"
 SAU_the_shia_question_desc: "Около двух миллионов §YШииты§! граждане живут в нефтедобывающих регионах §YВосточная провинция§!. The §YДом Саудов§! ей предстоит сделать выбор между репрессиями, уступками или фундаментальным изменением своей религиозной политики."
 SAU_rehabilitate_the_detainees: "Реабилитировать задержанных"
 SAU_rehabilitate_the_detainees_desc: "Освободите политических заключенных Восточной провинции и верните их в саудовское общество.\n\n§G-Шиитское сопротивление, +Стабильность§!."
 SAU_shia_political_representation: "Политическое представительство шиитов"
 SAU_shia_political_representation_desc: "Места в §YСовет Шуры§! для шиитов Восточной провинции.\n\n§G-Сопротивление шиитов, +Стабильность, +Шиитское население§!."
 SAU_security_clampdown: "Ужесточение мер безопасности"
 SAU_security_clampdown_desc: "Наводнить Восточную провинцию блокпостами, информаторами и силами быстрого реагирования.\n\n§R+Сопротивление шиитов§!, §R-Шиитское население§!, §G+Военная поддержка§!."
 SAU_sectarian_settlement: "Сектантское поселение"
 SAU_sectarian_settlement_desc: "Королевство урегулировало шиитский вопрос путем репрессий, компромиссов или обращения в другую веру и теперь может закрепить достигнутую в результате политику.\n\n§G+Стабильность, +Политическая власть§!."
 SAU_the_house_of_saud_embraces_shiaism: "Дом Саудов принимает шиизм."
 SAU_the_house_of_saud_embraces_shiaism_desc: "Немыслимое: §YКоролевская семья§! официально принимает §YШиизм двенадцати имамов§!Многовековая ваххабитская ортодоксия была опровергнута одним-единственным указом. §YВосточная провинция§! ликует; §YНаджд§! и §Yулема§! катушка.\n\n§G++Шиитское население§!, §GСопротивление закончилось§!, §Rпринять шиитскую веру§!, §R-Стабильность§! (на данный момент)."
 SAU_sunni_supremacy: "Суннитское превосходство"
 SAU_sunni_supremacy_desc: "Утвердите превосходство суннитов в законе, школах и мечетях. В Королевстве существует одна истинная вера, и она не принадлежит им.\n\n§R-Шиитское население§!, §G+Стабильность, +Поддержка в войне§!."
 SAU_suppress_the_clerics: "Подавить духовенство"
 SAU_suppress_the_clerics_desc: "Заставьте замолчать пламенных проповедников §YQatif§! и §YAwamiyah§!, прежде чем их проповеди превратятся в лозунги.\n\n§R+Шиитское сопротивление§!, §R-Шиитское население§!."
 SAU_sunni_shia_tolerance: "Толерантность к суннитам и шиитам"
 SAU_sunni_shia_tolerance_desc: "Не преследуйте и не обращайте в свою веру — просто сосуществуйте. Ослабьте ограничения, позвольте шиитам совершать богослужения в мире и дайте Королевству дышать.\n\n§G-Сопротивление шиитов, +Стабильность, +Шиитское население§! (без изменения веры)."
 SAU_stir_the_axis_of_resistance: "Встряхните ось сопротивления"
 SAU_stir_the_axis_of_resistance_desc: "Сила Ирана — это цепочка марионеточных сил от Ливана до Йемена, и каждое звено порождает недовольство. Финансируйте протесты и расколы, которые превращают союзников Тегерана в обузу."
 SAU_foreign_volunteers_for_the_rebels: "Иностранные добровольцы на стороне повстанцев"
 SAU_foreign_volunteers_for_the_rebels_desc: "Одних денег недостаточно, чтобы выиграть войну. Необходимо открыть каналы, по которым боевики и материальные средства доставляются через границы на передовую линию противника."
 SAU_direct_intervention_in_yemen: "Прямое вмешательство в Йемене"
 SAU_direct_intervention_in_yemen_desc: "Ввести саудовскую армию. Прямая военная операция обещает более быстрое решение и более явную победу, но рискует загнать Королевство в трясину, которая будет истощать его ресурсы долгие годы."
 SAU_a_proxy_war_in_yemen: "Опосредованная война в Йемене"
 SAU_a_proxy_war_in_yemen_desc: "Ведите войну через других. Финансируйте правительство в изгнании, южные ополчения и племена, и пусть йеменцы умирают, пока саудовские самолеты наблюдают сверху."
 SAU_supreme_military_council: "Верховный Военный Совет"
 SAU_supreme_military_council_desc: "Временный военный совет получит постоянный устав и официальные правила членства. Членство будет определяться званием, а командование во время переворота продолжит оказывать влияние внутри Совета."
 SAU_the_amman_bailout: "Программа спасения Аммана"
 SAU_the_amman_bailout_desc: "Хашимитское Королевство — хрупкий буфер против хаоса на севере, и оно разорено. Поддерживайте платежеспособность и лояльность Иордании, финансируя Королевство."
 SAU_the_battle_for_the_straits: "Битва за проливы"
 SAU_the_battle_for_the_straits_desc: "Тот, кто контролирует Ормузский пролив, контролирует пятую часть мировых запасов нефти. Подготовьте Королевство и его союзников к тому, чтобы сломить контроль Ирана над важнейшей водной артерией мира."
 SAU_the_islamic_rivalry: "Исламское соперничество"
 SAU_the_islamic_rivalry_desc: "Иран продвигает свою революционную модель и поддерживает вооруженные группировки от Ливана до Йемена. Саудовская Аравия будет оспаривать иранское лидерство через СМИ, региональных партнеров и подготовку к возможному конфликту в Персидском заливе."
 SAU_the_levant_strategy: "Левантийская стратегия"
 SAU_the_levant_strategy_desc: "Сирия горит, Иордания шатается, а за ними лежит дорога к Средиземному морю. Нужно перестроить Левант в интересах Саудовской Аравии, прежде чем это сделают Иран и его друзья."
 SAU_the_new_order_over_the_kingdom: "Новый порядок над королевством"
 SAU_the_new_order_over_the_kingdom_desc: "Чрезвычайное правительство превратилось в постоянный политический порядок. Многократное возобновление военной власти устранило любое практическое различие между временными мерами и нормальным правлением."
 SAU_the_silk_road_pivot: "Поворот на Шёлковый путь"
 SAU_the_silk_road_pivot_desc: "Китай является крупнейшим покупателем саудовской нефти и не обуславливает экономическое сотрудничество внутриполитическими реформами. Инициатива «Один пояс и один путь» предлагает порты, железные дороги и капитал, но отношения остаются преимущественно транзакционными."
 SAU_the_silk_web_network: "Сеть «Шёлковая паутина»"
 SAU_the_silk_web_network_desc: "Информация — это оружие, и Королевство намерено использовать его. Необходимо создать сеть из средств массовой информации, религиозных деятелей и онлайн-голосов, которая будет распространять послание Эр-Рияда по всему региону."
 SAU_the_american_shield: "Американский щит"
 SAU_the_american_shield_desc: "Оборона Королевства должна быть необратимо связана с Соединенными Штатами: размещение баз, разведка и негласная гарантия того, что нападение на Эр-Рияд — это нападение на интересы Вашингтона. Цена за это — зависимость от единственного покровителя."
 SAU_the_succession_question: "Вопрос о преемственности"
 SAU_the_succession_question_desc: "Тысячи князей сохраняют свой статус и потенциальные права на престол в рамках старого порядка. Правительству предстоит решить, отправить ли их на пенсию, сослать в ссылку, привлечь к ответственности или подвергнуть политической маргинализации."
 SAU_the_spirit_of_taif: "Дух Таифа"
 SAU_the_spirit_of_taif_desc: "Таифское соглашение, заключенное при посредничестве Саудовской Аравии, когда-то положило конец гражданской войне в Ливане и оказало Королевству помощь в Бейруте. Необходимо возродить эту роль и вывести Ливан из-под влияния Ирана."
 SAU_the_yemen_quagmire: "Йеменское болото"
 SAU_the_yemen_quagmire_desc: "Война в Йемене дорого обошлась Ирану, но она также затянула его в ловушку, показав, что он является покровителем ракетных обстрелов Эр-Рияда со стороны хуситов. Превратите эту трясину в дипломатическое оружие."
 SAU_the_yemeni_peace_talks: "Йеменские мирные переговоры"
 SAU_the_yemeni_peace_talks_desc: "Каждая война заканчивается за столом переговоров. Необходимо привести йеменские фракции к соглашению на условиях, которые обеспечат безопасность южной границы Королевства."
 SAU_defeat_in_syria: "Поражение в Сирии"
 SAU_defeat_in_syria_desc: "Режим продолжает существовать, поддерживаемый российскими самолетами и иранскими ополченцами. Королевству необходимо минимизировать потери и сохранить хоть какое-то влияние, полученное в войне, которую оно не смогло выиграть."
 SAU_total_victory_in_the_civil_war: "Полная победа в Гражданской войне"
 SAU_total_victory_in_the_civil_war_desc: "Полностью подавить хуситов и восстановить единое правительство, полностью подчиняющееся Эр-Рияду. Йемен фактически становится саудовским протекторатом."
 SAU_victory_in_syria: "Победа в Сирии"
 SAU_victory_in_syria_desc: "Падение Дамаска, а вместе с ним и сухопутный мост Ирана к «Хезболле». Дружественное правительство в Сирии открывает Левант для влияния Саудовской Аравии, а Средиземное море — для саудовских трубопроводов."
 SAU_a_partnership_with_britain: "Партнерство с Великобританией"
 SAU_a_partnership_with_britain_desc: "Начиная с контрактов с компанией «Аль-Ямама» и заканчивая подготовкой саудовских офицеров, Лондон был более тихим, но более надежным другом, чем большинство других стран. Необходимо официально оформить стратегическое партнерство с Соединенным Королевством."
 SAU_benign_dominance: "Доброкачественное доминирование"
 SAU_benign_dominance_desc: "Эр-Рияд лидирует с §Gболее легкое прикосновение§!Инвестиции, покровительство и уважение к достоинству малых эмиратов. Гегемония без унижения."
 SAU_command_and_control: "Управление и контроль"
 SAU_command_and_control_desc: "Объединенный командный центр, интегрированная система противовоздушной обороны и обмен разведывательной информацией обеспечат операции «Щит полуострова» единую оперативную структуру."
 SAU_common_market: "Общий рынок"
 SAU_common_market_desc: "Единая нормативно-правовая база: один набор стандартов, один таможенный документ, один региональный рынок. §Y50 миллионов потребителей§!."
 SAU_cross_border_transit_systems: "Трансграничные транзитные системы"
 SAU_cross_border_transit_systems_desc: "Автомагистрали, железные дороги и трубопроводы связывают полуостров воедино. Долго обсуждавшаяся, но так и не построенная железная дорога §YGCC Railway§! наконец-то начала строиться."
 SAU_economic_union: "Экономический Союз"
 SAU_economic_union_desc: "единый §Yтаможенная зона§!гармонизированные правила и основы §Yобщий рынок§! через весь полуостров. Купцы §YДжидда§! и §YДубай§! Ждали целое поколение."
 SAU_exploit_authority: "Эксплуатационный орган"
 SAU_exploit_authority_desc: "Саудовская Аравия будет укреплять свою гегемонию посредством §Yэкономическое давление§! и другие принудительные меры против государств-членов, не соблюдающих условия. Альянс будет функционировать как §Gблок, в котором доминирует Саудовская Аравия§!."
 SAU_the_gulf_cooperation_council: "Совет сотрудничества стран Персидского залива"
 SAU_the_gulf_cooperation_council_desc: "На протяжении двух десятилетий §YGCC§! функционировал в основном как форум для консультаций между монархиями Персидского залива. Эр-Рияд планирует расширить его деятельность и превратить в более эффективную региональную организацию."
 SAU_the_gulf_academy: "Академия Персидского залива"
 SAU_the_gulf_academy_desc: "Объединенная академия подготовки офицеров в §YЭр-Рияд§!Будущие генералы из каждого государства Персидского залива будут учиться в одном классе, разделять доктрину и... §Yлояльность к Альянсу§!."
 SAU_increase_autonomy: "Увеличение автономии"
 SAU_increase_autonomy_desc: "Ещё §Yнезависимая внешняя политика§!Страны Персидского залива говорят сами за себя на международных форумах — не как американский клиент, а как... §Yрегиональная власть§!.\n\n§YОдна из трех дорог, посвященных покровителю городского совета.§! - §YВашингтон§!, §Yновые партнеры§!, или §Yсовсем нет§!Они открываются в таком порядке: вы можете обратиться к новым партнерам только после того, как американцы... §Rотказался§! ты, и только когда оба это сделают, иди один. §RКаждая дорога, по которой вы едете, навсегда закрывает дороги, расположенные выше.§!"
 SAU_intra_gcc_trade: "Внутрирегиональная торговля стран Персидского залива"
 SAU_intra_gcc_trade_desc: "Снять последние тарифные барьеры между государствами-членами. Товары, капитал и рабочая сила будут свободно перемещаться из одного региона в другой. §YМаскат§! к §YКувейт-Сити§!."
 SAU_joint_defense_agreement: "Соглашение о совместной обороне"
 SAU_joint_defense_agreement_desc: "Взаимный оборонительный пакт в стиле §YArticle 5§!: нападение на одного — это нападение на всех. §YIran§! обращает на это внимание."
 SAU_joint_research_initiatives: "Совместные исследовательские инициативы"
 SAU_joint_research_initiatives_desc: "Общий технологический фонд §Y§! объединяет ресурсы для исследований и разработок в области опреснения воды, солнечной энергетики и нефтехимии. §YKAUST§! становится региональным центром."
 SAU_gcc_joint_ventures: "Совместные предприятия стран Персидского залива"
 SAU_gcc_joint_ventures_desc: "ССГПЗ будет координировать производство, закупку и техническое обслуживание оборонной продукции. Столица Саудовской Аравии, §YЭмиратская логистика§!, и §YБахрейнские верфи§! будет поддерживать общую военно-промышленную систему."
 SAU_the_khaleeji_union: "Союз стран Персидского залива"
 SAU_the_khaleeji_union_desc: "Шесть монархий образуют конфедерацию с разделением полномочий в области внешней политики, обороны и валюты. §YСоюз Халиджи§! будет руководить из §YЭр-Рияд§!."
 SAU_military_union: "Военный Союз"
 SAU_military_union_desc: "Боевая машина §YPeninsula Shield§! существует с 1984 года, но ее практическая интеграция ограничена. Эр-Рияд создаст объединенное командование, систему совместных закупок и общую доктрину."
 SAU_new_partners: "Новые партнеры"
 SAU_new_partners_desc: "За пределами Вашингтона: сделки с §YПекин§!, §YМосква§!, §YДели§!, и §YБрюссель§!Полуостров отличается разнообразием своих посетителей.\n\n§YОдна из трех дорог, посвященных покровителю городского совета.§! - §YВашингтон§!, §Yновые партнеры§!, или §Yсовсем нет§!Они открываются в таком порядке: вы можете обратиться к новым партнерам только после того, как американцы... §Rотказался§! ты, и только когда оба это сделают, иди один. §RКаждая дорога, по которой вы едете, навсегда закрывает дороги, расположенные выше.§!"
 SAU_political_union: "Политический союз"
 SAU_political_union_desc: "Скоординированная внешняя политика. Единая дипломатическая линия. Этого опасаются малые эмираты. §YСаудовское господство§! — но Эр-Рияд настаивает на том, что это партнерство §Yравные среди монархов§!."
 SAU_solidify_pro_american_alignment: "Укрепить проамериканскую ориентацию"
 SAU_solidify_pro_american_alignment_desc: "§YGCC§! формализует свое партнерство в области безопасности с Вашингтоном. Базы, обучение, оружие, разведка — все проходит через Эр-Рияд.\n\n§YОдин из трех путей для покровителя Совета§! - §YВашингтон§!, §Yновые партнеры§! или §Yникаких партнеров§!. Они открываются в таком порядке: вы можете обратиться к новым партнерам только после того, как американцы §Rоткажут§! вам, и действовать в одиночку только после того, как обе стороны откажутся. §REКаждый выбранный вами путь навсегда закрывает предыдущие.§!"
 SAU_pursue_hegemony: "Стремление к гегемонии"
 SAU_pursue_hegemony_desc: "Эр-Рияд заменит неформальное руководство прямой властью над другими монархиями Персидского залива. Они могут возражать, но экономическое и военное давление со стороны Саудовской Аравии ограничит их возможности сопротивления."
 SAU_a_robust_alliance: "Прочный альянс"
 SAU_a_robust_alliance_desc: "В состав оперативной группы §YPeninsula Shield§! войдут 100 000 военнослужащих, оснащенных современным оборудованием и объединенной доктриной."
 SAU_shared_currency: "Единая валюта"
 SAU_shared_currency_desc: "Он §Yхалиджи динар§! - Единая валюта для стран Персидского залива, привязанная не к доллару, а к валютной корзине. Самый смелый экономический шаг, когда-либо предпринятый полуостровом."
 SAU_the_yemeni_civil_war: "Гражданская война в Йемене"
 SAU_the_yemeni_civil_war_desc: "Хуситы захватили столицу и вынудили признанное правительство отправиться в изгнание, а Иран укрепляет свои позиции у границ Аравии. Королевству предстоит решить, на что оно готово пойти, чтобы это остановить."
 SAU_sabotage_the_regimes_backers: "Саботаж сторонников режима"
 SAU_sabotage_the_regimes_backers_desc: "На каждое оружие, отправленное Королевством, Тегеран и Москва отправляют по два. Действуйте в тени, чтобы нарушить линии снабжения и связи с марионетками, поддерживающими Дамаск."
 SAU_the_national_industrial_strategy_gdp_tt: "Национальный бюджет §YGDP§! превышает §G$1500 миллиардов§!"
 SAU_stc_privatization_gdp_tt: "Национальный бюджет §YGDP§! превышает §G$1500 миллиардов§!"
 SAU_kaust_gdp_tt: "Национальный §YGDP§! превышает §G$1600 миллиардов§!"
 SAU_the_gulfs_economic_engine_gdp_tt: "Национальный бюджет §YGDP§! превышает §G$1500 миллиардов§!"
 SAU_the_worlds_most_valuable_company_gdp_tt: "Национальный фонд §YGDP§! превышает §G$1800 миллиардов§!"
 SAU_vision_2030_gdp_tt: "Национальный §YGDP§! превышает §G$1600 миллиардов§!"
 SAU_sdaia_data_and_artificial_intelligence_gdp_tt: "Национальный §YGDP§! превышает §G$2000 миллиардов§!"
 SAU_the_civil_nuclear_program_gdp_tt: "Национальный бюджет §YGDP§! превышает §G$1700 миллиардов§!"
 SAU_fund_vision_2030_gdp_tt: "Национальный фонд §YGDP§! превышает §G$1800 миллиардов§!"
 SAU_the_dynamic_tiering_formula: "Формула динамического ранжирования"
 SAU_the_dynamic_tiering_formula_desc: "Квота, которая для фирмы с девятью тысячами сотрудников означает одно, а для фирмы с девятью — другое, не может быть одним числом. Формула масштабирует требование в зависимости от численности персонала, выручки и отрасли, и пересчитывает его каждый квартал.\n\nФирмы прекращают манипулировать пороговым значением, разделяясь на две части."
 SAU_high_green_zone_incentives: "Льготы для предприятий, расположенных в «зеленых зонах» с высоким уровнем развития."
 SAU_high_green_zone_incentives_desc: "Ниже платинового пояса находится пояс, в котором фактически проживает большинство серьезных работодателей Королевства. Они послушны, они не являются исключением, и до сих пор система ничего им за это не давала.\n\nПриоритетная обработка и более мягкий график проверок, исходя из теории, что поощрять почти послушных дешевле, чем наказывать их."
 SAU_the_yellow_band_warnings: "Предупреждения о желтой полосе"
 SAU_the_yellow_band_warnings_desc: "Компании, отмеченной желтым цветом, в письменной форме с указанием даты сообщают, насколько сильно она не соответствует прогнозам и что произойдет по итогам квартала.\n\nБольшинство из них исправляют ситуацию. Предупреждение обходится Министерству всего в одно письмо и предотвращает заморозку."
 SAU_the_secularization_of_finance_choice_tt: "Выбор §YA следует за §! - «Полностью англосаксонский стиль - разрешены все инструменты» / «Постепенный - западная практика с элементами шариата»."
 SAU_bastion_of_islamic_finance_choice_tt: "Выбор §YA следует за §! - «Строгое соблюдение ортодоксальных взглядов - без компромиссов» / «Прагматичный подход - лидерство на мировом рынке исламских финансов»."
 SAU_the_banking_control_law_choice_tt: "Выбор §YA следует за §! - 'SAMA - независимый светский регулятор' / 'SAMA + Совет шариата с обязательным правом вето' / 'Гибрид - две параллельные структуры'."
 SAU_the_interbank_lending_code_choice_tt: "Выбор §YA следует за §! - «Традиционный межбанковский рынок с процентной ставкой» / «Исламский межбанковский рынок на основе мурабаха» / «Гибридный — оба функционируют независимо»."
 SAU_the_anti_speculation_directives_choice_tt: "Выбор §YA следует за §! - «Мягкое регулирование - разрешено использование деривативов и фьючерсов» / «Строгий запрет - никаких гараров, никаких азартных игр» / «Только регулируемые деривативы - сбалансированный подход»."
 SAU_fractional_reserve_mandates_choice_tt: "Выбор §YA следует за §! - «Современная система частичного резервирования - рост за счет стабильности» / «Только обеспеченные активами - стабильные, но более медленные» / «Умеренные требования к резервам»."
 SAU_the_standardized_interest_law_choice_tt: "Выбор §YA следует за §! - «Разрешить обычные процентные счета» / «Строгий запрет ростовщичества - шариат имеет первостепенное значение» / «Сукук в публичном порядке, прагматичные проценты в частном порядке»."
 SAU_conscript_the_kingdom_choice_tt: "§YДалее следует выбор.§! — «Всеобщая служба. Каждый совершеннолетний мужчина, без исключений» / «Призывная служба. Племена сохраняют свои льготы». Это движется. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_emergency_tribunal_choice_tt: "§YДалее следует выбор.§! — «Князья. Пусть страна увидит, как они отчитаются за это» / «Диссиденты. Дела уже сделаны» / «И те, и другие. Мы захватили государство не для того, чтобы действовать избирательно». Это трогает за душу. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_the_defense_industries_act_choice_tt: "§YДалее следует выбор.§! — «Лицензируйте проекты. Нам нужно производство, а не гордость» / «Постройте сами, с нуля». Это движется. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_martial_law_issues_choice_tt: "§YДалее следует выбор.§! — «Весь аппарат. Комендантский час, трибуналы, цензоры» / «Только чрезвычайные полномочия. Оставьте улицы в покое». Это трогает до глубины души. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_the_regency_decree_choice_tt: "§YДалее следует выбор.§! — «Узкое регентство. Он сохраняет трон и мечети» / «Полное регентство. Вся власть, без исключения» / «Регентство на пять лет. Назовите точную дату». Это движется. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_the_succession_question_choice_tt: "Выбор §YA следует за§! - «Щедро и навсегда обеспечить им пенсию» / «Изгнать старших офицеров» / «Преследовать в судебном порядке и конфисковать все найденное» / «Оставить их богатыми и богатыми». Это подрывает §H контроль офицеров над государством и легитимность хунты§!."
 SAU_the_silk_road_pivot_choice_tt: "Выбор §YA следует за§! - «Порты, железная дорога и северный коридор» / «Столица, без каких-либо условий». Это влияет на §H контроль офицеров над государством и легитимность хунты§!."
 SAU_guardians_of_the_two_mosques_choice_tt: "§YДалее следует выбор.§! — «Стойте за королём. Заимствуйте титул, но не присваивайте его себе» / «Опека принадлежит государству, а не человеку». Это трогает до глубины души. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_secure_support_in_the_al_madinah_province_choice_tt: "Выбор §YA следует за§! - «Заискивайте перед ними. Уступите то, что необходимо уступить» / «Переставьте стулья. Нам нужна формулировка прямо сейчас». Это влияет на §Hвласть офицеров над государством и легитимность хунты§!."
 SAU_secure_support_in_the_mecca_province_choice_tt: "Выбор §YA следует за §! — «Расплатитесь с торговыми домами. Купите Хиджаз как следует» / «Разместите там гарнизон. Они приспособятся». Это влияет на §H контроль офицеров над государством и легитимность хунты§!."
 SAU_appoint_loyalists_in_the_provinces_choice_tt: "§YДалее следует выбор.§! — «Старшие князья. Их имена до сих пор несут на себе отпечаток страны» / «Забытые кузены. Благодарность дешевле престижа» / «Богатые недовольные. Приведите их и проверьте позже». Это трогает. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_disband_the_national_guard_choice_tt: "§YДалее следует выбор.§! — «Примите их. Пусть носят нашу форму» / «Расформируйте охрану полностью. Отправьте их домой» / «Оставьте остатки под нашим командованием». Это движется. §Hконтроль офицеров над государством и легитимность хунты§!."
 SAU_the_riyadh_meeting_operation_decisive_storm_choice_tt: "§YA выбор следует§! - 'Значит, договорились. Задайте им всем вопрос' / 'Королевство само ответит Йемену'."
 SAU_the_oil_defense_strategy_choice_tt: "Выбор §YA следует за §! - «Насос. Стратегия заключается в месторождениях» / «Создайте отрасль, которая переживет скважины» / «Обследуйте. Там еще много чего есть»."
 SAU_women_in_the_shura_council_choice_tt: "Выбор §YA следует за §! - «Тридцать мест по королевскому указу» / «Зал остается таким, какой он есть»."
 SAU_hold_municipal_elections_choice_tt: "Выбор §YA следует за §! - «Половина мест, и мужчины в списках» / «Назначить их всех и назвать это консультацией» / «Включить в списки и женщин»."
 SAU_counter_terrorism_cooperation_choice_tt: "§YA выбор следует§! - 'Примите предложение Вашингтона в полном объеме' / 'Мабахит позаботится о своих' / 'Реабилитируйте их. Тюрьмы только порождают новых'."
 SAU_al_saud_national_dialogue_choice_tt: "Выбор §YA следует за §! - «Пусть говорят, и пусть публикуют то, что говорят» / «Они могут собираться. Повестка дня наша»."
 SAU_consolidating_the_crown_choice_tt: "§YA выбор следует§! - 'Пусть Совет Верности вынесет решение о престолонаследии' / 'Король назначит своего наследника. Совет ему аплодирует' / 'Вместо этого купите согласие семьи'."
 SAU_a_new_kingdom_choice_tt: "Выбор следует за §YA §! - «Реформы в той мере, в какой это позволят министерства» / «Изменилось только название указов» / «Откройте экономику, а политика пусть идет своим чередом»."
 SAU_the_global_ummah_question_choice_tt: "Выбор §YA следует §! - «Мечети — это долг, а не предписание» / «Мы говорим от имени верующих». Это меняет §H курс Королевства за рубежом§!."
 SAU_reclaim_the_oic_leadership_choice_tt: "Выбор §YA следует за §! - 'Финансировать' / 'Укомплектовать персоналом'."
 SAU_the_expatriate_workforce_question_choice_tt: "Выбор §YA следует §! - «Отправить их домой» / «Натурализовать полезных». Это направляет §Hкурс Королевства за границу§!."
 SAU_islamic_solidarity_conference_choice_tt: "§YДалее следует выбор§! — «Провести её в Мекке» / «Провести её за рубежом»."
 SAU_the_sovereign_aid_question_choice_tt: "Выбор §YA следует §! - «Милостыня, безвозмездно предоставленная» / «Помощь с условиями». Это направляет §Hкурс Королевства за рубежом§!."
 SAU_the_domestic_supply_quota_choice_tt: "Выбор §YA следует за §! - «Строгая квота» / «Поэтапная квота»."
 SAU_the_foreign_wealth_question_choice_tt: "Выбор §YA следует §! - «Верните все домой» / «Оставьте там, где это приносит пользу». Это направляет §Hкурс Королевства за границу§!."
 SAU_eradicate_foreign_dependency_choice_tt: "Выбор §YA следует за §! - «Оружие прежде всего» / «Все остальное прежде всего»."
 SAU_the_superpower_engagement_question_choice_tt: "Выбор §YA следует §! - «Мандат самодостаточности» / «Вооруженное равноудаленность». Он меняет §Hкурс Королевства за рубежом§!."
 SAU_the_international_forums_question_choice_tt: "Выбор §YA следует §! - «Откажитесь от того, что мы не написали» / «Работайте с ними изнутри». Это направляет §Hкурс Королевства за границу§!."
 SAU_the_spirit_of_73_choice_tt: "Выбор §YA следует за §! - «Открыто угрожать эмбарго» / «Применять его тихо»."
 SAU_the_fortress_kingdom_choice_tt: "Выбор §YA следует за §! - «Укрепить побережье» / «Укрепить внутренние районы»."
 SAU_the_national_cadre_initiative_choice_tt: "§YA выбирает §! - «Технические институты» / «Военные академии»."
 SAU_the_sovereign_civil_service_choice_tt: "Выбор §YA следует за §! - «Назначение по результатам экзамена» / «Назначение по лояльности»."
 SAU_centralization_of_the_provincial_emirates_choice_tt: "Выбор §YA следует за §! - «Выкупить их чартеры» / «Полностью заменить их»."
 SAU_the_foreign_bases_question_choice_tt: "Выбор §YA следует §! - 'Сбить чужие флаги. Они уходят домой' / 'Договор остаётся в силе. Необходимость позволяет то, что запрещает принцип'."
 SAU_purge_the_westernized_elite_choice_tt: "Выбор §YA следует за §! - «Изгнать их» / «Перевоспитать их»."
 SAU_the_closed_frontier_choice_tt: "Выбор §YA следует за §! - «Полностью запечатать» / «Признать тех, кто нам нужен»."
 SAU_ban_foreign_media_choice_tt: "Выбор §YA следует за §! - «Глушить спутники» / «Купить сети»."
 SAU_the_virtue_committees_return_choice_tt: "Выбор §YA следует за §! - «Пусть патрулируют большими силами» / «Держите их в режиме настороженности»."
 SAU_increase_the_ulemas_authority_choice_tt: "Выбор §YA следует за §! - 'Отдайте им суды' / 'Отдайте им школы'."
 SAU_the_faisalite_resurgence_choice_tt: "§YA choice follows§! - 'Провозгласите это с кафедры' / 'Провозгласите это из дворца'."
 SAU_the_2007_legal_reforms_choice_tt: "Выбор §YA следует за §! - «Англосаксонская структура» / «Структура, в которой шариат стоит на первом месте» / «Гибридная модель»."
 SAU_royal_decree_m_30_capital_market_law_choice_tt: "Выбор §YA следует за §! - «Независимые технократы» / «Королевский надзор необходим» / «Привлекайте иностранных экспертов»."
 SAU_establish_corruption_courts_choice_tt: "§YПравление перестраивается§! - суды борются с коррупцией, а вместе с ней растут налоговая и политическая власть. §RИнвесторы учитывают новый риск§!, а у обвиняемых появляются друзья."
 SAU_the_ritz_carlton_purge_choice_tt: "§YПравление перестраивается§! — чистка позволяет купить политическую власть, снизить коррупцию и повысить уровень разведки. §RИностранный капитал воспринимает это как экспроприацию§! и соответствующим образом оценивает Королевство."
 SAU_backdoor_deals_choice_tt: "§YПравление переформатировано.§! - Доходность, рыночный доход и инвестиции улучшаются. §RКоррупция углубляется вдвое.§!, а суд расплачивается за это политической властью."
 SAU_new_partners_choice_tt: "§YДалее следует выбор.§! - Совет выбирает гаранта за пределами Персидского залива: «Турцию» / «Иран» / «Индию» / «Пакистан» / «Россию». Выбранному лицу предлагается ответить."
 SAU_the_khaleeji_union_choice_tt: "§GЗалив становится одним государством§! - все оставшиеся члены ССГПЗ §Hаннексирован вместе со своими войсками§!Их земли стали частью архипелага, и королевство получило это название. §HХалидж§!."
 SAU_ras_al_khair_complex: "Комплекс Рас-эль-Хайр"
 SAU_ras_al_khair_complex_desc: "На побережье Персидского залива к северу от Джубайла Королевство заливает бетоном строительство комплекса по опреснению воды и выработке электроэнергии в масштабах, невиданных ранее. Это государственные деньги, государственная земля и государственная рабочая сила, и он будет функционировать и после того, как уйдут те, кто подписал соглашение.\n\n§GСтроит электростанцию, работающую на ископаемом топливе, и соответствующую инфраструктуру в Хаасе.§! и стабилизирует ситуацию в стране.\n\n§RСтоимость составляет 60 млрд.§!Построено Королевством, принадлежит Королевству."
 SAU_the_shuaibah_iwpp: "Shuaibah IWPP"
 SAU_the_shuaibah_iwpp_desc: "К югу от Джидды консорциум берет на себя управление водо- и электростанцией и продает вырабатываемую электроэнергию Королевству по двадцатилетнему контракту. Это дешевле, быстрее, а показания счетчика снимаются в другой столице.\n\n§GСтроит электростанцию, работающую на ископаемом топливе, и энергетическую инфраструктуру в Хиджазе.§!.\n\n§RОбойдется в $30 млрд и усилит американское влияние.§!Вдвое дешевле, и не полностью принадлежит вам."
 SAU_the_sovereign_saudi_water_company: "Суверенная саудовская водопроводная компания"
 SAU_the_sovereign_saudi_water_company_desc: "Кто бы ни прокладывал трубопровод, теперь Королевство управляет всем этим в рамках единой суверенной компании — тарифами, резервами, распределением между провинциями. Впервые появился единый стол, где можно найти ответ на вопрос «сколько воды в Королевстве».\n\n§GОткрывает суверенные воды§!Королевство расположено на воде и наделяется политической властью.\n\nОно не производит воду. Оно делает Царство ответственным за неё."
 SAU_throttle_pipeline_yemen: "Ограничить пропускную способность трубопровода через Аравийское море"
 SAU_throttle_pipeline_yemen_desc: "Сократим южную линию на один уровень. Мы будем отправлять меньше грузов и зарабатывать меньше, но вместе с этим снизится и плата за транзит для Саны, и они почувствуют давление гораздо раньше, чем мы."
 SAU_throttle_pipeline_syria: "Остановить Левантийский трубопровод"
 SAU_throttle_pipeline_syria_desc: "Сократите средиземноморскую линию на один уровень. Амман и Дамаск получат меньшую долю, и им обоим напомнят, чья нефть заполняет трубопровод."
 SAU_throttle_pipeline_iraq: "Остановить поток в Европу"
 SAU_throttle_pipeline_iraq_desc: "Сократите северную линию на один уровень. Соответственно, плата за проезд в Багдаде уменьшится — давление будет приложено без полного перекрытия вентилей."
 SAU_tt_pipeline_shutdown_dependence: "§GСнижает зависимость от нефти.§! Благодаря закрытию трубопровода Королевство меньше зависит от экспорта сырой нефти."
 SAU_shutdown_pipeline_yemen: "Остановить строительство Аравийского морского трубопровода"
 SAU_shutdown_pipeline_yemen_desc: "Перекройте вентили в Аль-Махре. Экспортные доходы прекратятся, но прекратятся и транзитные сборы, которые мы платим Сане, — и Йемен не простит нам отключения от энергоснабжения."
 SAU_shutdown_pipeline_syria: "Остановить Левантийский трубопровод"
 SAU_shutdown_pipeline_syria_desc: "Закройте Средиземноморскую линию. И Амман, и Дамаск потеряют свои транзитные сборы, и оба запомнят, кто отключил насосы."
 SAU_shutdown_pipeline_iraq: "Остановить европейский трубопровод"
 SAU_shutdown_pipeline_iraq_desc: "Закройте северную магистраль. Турецкая ветка, не имеющая запаса пропускной способности, будет закрыта вместе с ней; Багдад и Анкара потеряют свои доходы."
 SAU_shutdown_pipeline_turkey: "Заблокировать турецкое расширение"
 SAU_shutdown_pipeline_turkey_desc: "Прекратите перекачку нефти за иракскую границу. Магистральный трубопровод останется открытым — свою долю потеряет только Анкара, и Анкара это заметит."
 SAU_events.355.a: "Одобрить продажу."
 SAU_events.355.b: "Отклонить запрос."
 SAU_events.355.desc: "Эр-Рияд хочет получить «Паладин», и хочет его в больших количествах. Королевство использует американские 155-мм орудия с 1970-х годов, поэтому экипажи, калибр и вся система управления огнём уже принадлежат нам; они же покупают цифровую башню, которая позволяет батарее вести огонь и смещаться до того, как сработает контрбатарейный радар. Саудовцы заплатят наличными и вовремя, и эта сделка не позволит конкуренту занять территорию, которую мы контролируем уже тридцать лет. Это также позволит нашим гаубицам оказаться в зоне досягаемости пограничной войны, которую мы не контролируем."
 SAU_events.355.t: "Саудовская Аравия обратилась к США с просьбой о поставке американской артиллерии."
 SAU_events.356.a: "Одобрить продажу."
 SAU_events.356.b: "Отклонить запрос."
 SAU_events.356.desc: "Из Эр-Рияда поступил необычный запрос: саудовцы хотят приобрести пулемет Мста-С. Королевство никогда не закупало российские орудия, а его артиллеристы всю свою карьеру тренировались на западных калибрах, поэтому практическое обоснование этого шага весьма слабое. Политическое же обоснование – нет. Продажа оружия самой обеспеченной армии в Персидском заливе откроет рынок, который Вашингтон считал закрытым со времен нефтяного эмбарго, и все остальные столицы Персидского залива заметят, куда посмотрел Эр-Рияд."
 SAU_events.356.t: "Саудовская Аравия запрашивает российскую артиллерию."
 SAU_events.357.a: "Одобрить продажу."
 SAU_events.357.b: "Отклонить запрос."
 SAU_events.357.desc: "Эр-Рияд запросил CAESAR, и на этот раз аргументы в пользу покупки говорят сами за себя. Орудие, установленное на грузовике, преодолевает расстояния по всей территории Королевства своим ходом, не нуждается в транспортёре и может вернуться в движение через минуту после последнего выстрела. Саудовцы наблюдали за действиями колёсной гаубицы на своей южной границе и пришли к очевидному выводу. Этот заказ будет держать линию обороны в Роанне в напряжении годами и привяжет Эр-Рияд к французским снарядам, французским стволам и французским специалистам."
 SAU_events.357.t: "Саудовская Аравия обратилась к французской артиллерии с просьбой о помощи."
 SAU_events.358.a: "Одобрить продажу."
 SAU_events.358.b: "Отклонить запрос."
 SAU_events.358.desc: "Саудовская Аравия хочет получить PzH 2000, что одновременно и лестно, и неловко. Это лучшая гаубица в мире, и все в этой отрасли это знают; именно поэтому Бундестаг две недели будет спорить о том, куда в итоге попадут эти орудия. Королевство — платящий клиент, ведущий войну на своей южной границе, и лицензия должна быть подписана правительством, которое пообещало быть осторожным именно в этом вопросе. Промышленность хочет получить этот заказ. Коалиция может не выжить, не выполнив его."
 SAU_events.358.t: "Саудовская Аравия запрашивает немецкую артиллерию."
 SAU_events.364.a: "Одобрить продажу."
 SAU_events.364.b: "Отклонить запрос."
 SAU_events.364.desc: "Эр-Рияд запрашивает M270, и это не очередная продажа артиллерии. Пусковая установка, способная за минуту выставить на поле боя количество снарядов, эквивалентное батальону, — это стратегическое оружие, и ракеты, которые она выпускает, находятся в нашей собственности, и мы можем поставлять их или нет, пока Королевство владеет этими пусковыми установками. Это рычаг влияния, а также возможность привлечь внимание: независимо от того, для чего будут использоваться эти пусковые установки, об этом будет сообщено с нашим флагом на ящике."
 SAU_events.364.t: "Саудовская Аравия запросила американскую ракетную артиллерию."
 SAU_events.365.a: "Одобрить продажу."
 SAU_events.365.b: "Отклонить запрос."
 SAU_events.365.desc: "Эр-Рияд запросил покупку пусковой установки «Смерч», и этот запрос говорит больше, чем сам заказ. Никто не продаст 300-мм пусковую установку стране, которая может купить американскую продукцию, если только этой стране не было отказано. Королевству нужна дальность стрельбы, которую оно не может получить в Вашингтоне, и оно готово приехать в Москву, чтобы её найти. Продажа орудий — выгодная сделка. Прецедент же лучше."
 SAU_events.365.t: "Саудовская Аравия запросила российскую ракетную артиллерию."