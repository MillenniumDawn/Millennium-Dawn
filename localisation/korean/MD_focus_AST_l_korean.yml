 the_great_australia_act: "§2위대한 오스트레일리아법§!"
 the_great_australia_act_desc: "우리나라 역사상 가장 큰 사회 개혁 프로그램일 것입니다. 오스트레일리아의 평등을 증진하고 수백만 명을 빈곤에서 구하려는 대규모 사업입니다. 복지 수용 능력의 전면적 확대, 수급 자격과 적용 범위의 개편, 지원금 인상, 그리고 소외된 오스트레일리아인이 앞서 나갈 수 있도록 돕는 여러 프로그램이 포함됩니다."
