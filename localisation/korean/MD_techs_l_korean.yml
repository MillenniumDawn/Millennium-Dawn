 battleship_hull_3_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 battle_cruiser_hull_3: "2020년형 순양전함 선체"
 battle_cruiser_hull_3_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 missile_non_got_folder: "유도 미사일 기술"
 missile_non_got_folder_desc: "순항 미사일 및 지대공 미사일"
 battle_cruiser: "순양전함"
 battle_cruiser_desc: "20세기의 주력함인 순양전함은 순양함과 전함의 장점을 최대한 결합했습니다. 광범위한 무기와 장비를 갖춘 이 함정은 대규모 전력 투사를 가능하게 하면서도, 완전한 전함에 비해 자원과 생산 능력을 덜 필요로 합니다."
 battleship: "전함"
 AIR_TITLE_ATTACK_HELICOPTER_DESC: "공격 헬리콥터는 아군에 신속한 화력 지원을 제공하는 역할을 하며, 어떤 위치의 적이든 타격할 수 있게 합니다. 대공 능력이 제한적이기 때문에 특히 전차에 대해 효율적입니다. 다만 적 항공기에는 상당히 취약합니다."
 GLCM: "GLCM"
 GLCM_desc: "지상 발사 순항 미사일(GLCM)은 전술 및 전략 표적을 타격하도록 설계된 지상 기반 순항 미사일입니다."
 marine_raider_beach_preparation: "해병 특공대 해안 사전 준비"
 marine_raider_beach_preparation_desc: "해병 특공대를 활용하여, 병력이 해안에 상륙하기 전에 해안 장애물을 파괴하고 통로를 확보해 둘 것입니다."
 armored_spearhead: "기갑 선봉"
 armored_spearhead_desc: "기갑 선봉은 전투 중 공세 돌파의 선두를 이루는, 주로 전차로 구성된 장갑 전투 차량 편대입니다."
 cruise_missile_non_got: "순항 미사일"
 cruise_missile_non_got_desc: "순항 미사일은 비행 경로의 대부분에서 공기역학적 양력으로 비행을 유지하는 무인 자력 추진 유도 미사일입니다. 순항 미사일은 고정밀로 먼 거리에 대형 탄두를 전달하도록 설계되었습니다. 현대의 순항 미사일은 고아음속, 초음속 또는 극초음속으로 비행할 수 있고, 자체 항법이 가능하며, 비탄도식의 극저고도 궤적으로 비행할 수 있습니다."
 GLCM_non_got: "GLCM"
 GLCM_non_got_desc: "지상 발사 순항 미사일(GLCM)은 전술 및 전략 표적을 타격하도록 설계된 지상 기반 순항 미사일입니다."
 air_defense_non_got: "대공 방어"
 air_defense_non_got_desc: "대공 방어는 지상 기반, 수중 기반(잠수함 발사), 공중 기반 무기 체계와 이에 연관된 센서 체계, 지휘통제 체계, 수동적 대응 수단을 포괄합니다."
