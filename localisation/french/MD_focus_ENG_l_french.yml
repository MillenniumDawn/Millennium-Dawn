 ENG_build_something_you_bum_TT: "Si nous construisons 5 infrastructures dans le §HGrand Londres§! d'ici l'an prochain, il recevra :\n - §HProductivité :§! §G50.000§!"
 ENG_military.007.t: "Avant-poste sur la Lune"
 ENG_military.007.d: "Nos scientifiques et ingénieurs sont prêts à envoyer des astronautes et du matériel pour vivre de façon semi-permanente sur la Lune. Une douzaine d'astronautes environ y seront envoyés, avec des dizaines de millions de dollars d'équipements, de vivres, d'habitats et d'effets personnels. Cet avant-poste devra être régulièrement déplacé car le jour lunaire dure 29 jours terrestres, trop long pour que les batteries conservent l'énergie.\n\nLa base sera aux pôles, facilement déplaçable, pour maximiser l'usage de nos panneaux solaires. Des expériences détermineront aussi les conditions de vie à long terme. L'extraction de glace lunaire pourrait fournir de l'eau liquide pour les plantes et la nourriture des astronautes, mais aussi de l'oxygène et de l'hydrogène, carburant de fusée.\n\nIl faudra des mois ou des années pour obtenir les recherches nécessaires. Pendant ce temps, grâce aux fonds du projet, nous construirons un dépôt en orbite lunaire pour faciliter l'accès à la Lune et le ravitaillement vers la Terre.\n\nTout cela est réalisable d'ici dix ans. L'heure du lancement est venue."
 ENG_military.007.a: "Lancez-vous !"
 ENG_military.008.t: "Base lunaire Alpha"
 ENG_military.008.d: "Nos scientifiques et ingénieurs ont officiellement atterri sur la Lune et installent la base lunaire. Chaque section est divisée en « modules », pas tout à fait des bâtiments à eux seuls, mais pas un ensemble unique. Il y a un module d'habitation, pour le repos, un module alimentaire, pour cultiver, un module laboratoire, le plus grand avec l'essentiel du matériel scientifique, un module de maintenance, contenant les outils de réparation, un module d'agréments, car ces personnes restent six mois et travailler sans relâche n'est pas bon pour l'esprit, et un bon nombre de panneaux solaires. \n\nLes livraisons de nourriture seront fréquentes ces premiers mois, le temps que les cultures poussent. L'eau et l'oxygène viendront de la glace lunaire. Enfin, ces scientifiques resteront jusqu'à peu après le déplacement vers le prochain site, dans environ six mois, lorsque les panneaux solaires cesseront de fonctionner à cause du jour et de la nuit lunaires de six mois à cet emplacement.\n\nMoonbase Alpha est achevée."
 ENG_military.008.a: "Sciences!"
 ENG_military.009.t: "Progrès de la colonie"
 ENG_military.009.d: "Notre avant-poste scientifique sur la Lune a réalisé une percée majeure. Avec l'extension de leur réseau de panneaux solaires et de récentes découvertes rendant plus aisée la séparation de l'eau en oxygène et hydrogène, ils ont pu produire assez d'oxygène et d'hydrogène pour ravitailler entièrement la dernière fusée de ravitaillement. Cette percée indispensable permettra, avec le temps et l'investissement, que la Lune elle-même devienne un carrefour pour les futures aventures spatiales.\n\nL'espace se rétrécit."
 ENG_military.009.a: "Nous savons être des pionniers"
 ENG_military.010.t: "Crise sur la Lune"
 ENG_military.010.d: "Des mesures drastiques doivent être prises immédiatement. Pour des raisons encore inconnues, le module d'habitation s'est rompu et a « explosé ».\n\nIl y a une heure, les 12 scientifiques vaquaient à leurs tâches lorsqu'une rupture massive s'est produite dans le module d'habitation.\n\nLes ondes ne se propageant pas dans le vide, la plupart n'ont rien compris avant de voir de leurs yeux ce qui s'était passé.\n\nIl existe un fonds d'urgence au budget, inutile d'allouer davantage au projet, et les scientifiques peuvent dormir dans les autres modules isolés ; toutefois, beaucoup sont ébranlés : quelques-uns, beaucoup, voire tous nos scientifiques auraient pu mourir, et le moral a chuté. Poursuivre l'avant-poste lunaire sera donc politiquement coûteux, et une rotation des scientifiques pourrait s'imposer plus tôt que prévu.\n\nQue ferons-nous ?"
 ENG_military.010.a: "Envoyer une aide d'urgence !"
 ENG_military.010.b: "Abandonner le projet. Ce n'est pas pour nous"
 ENG_military.011.t: "La colonie progresse encore"
 ENG_military.011.d: "Notre avant-poste lunaire a réalisé une autre percée majeure. Ils ont réussi à expédier de l'hydrogène 3, un gaz qui semble parfait pour la fusion, vers la Terre, et les scientifiques au pays ont compris comment réaliser la fusion avec ! Non seulement cela, mais l'énergie produite est proche de celle consommée par la réaction. Avec quelques améliorations, cela pourrait donner une fusion réussie ! Outre d'immenses bénéfices au pays et des connaissances applicables à d'autres matériaux, nous pourrons l'utiliser sur la Lune, permettant un avant-poste permanent plutôt que des avant-postes mobiles !\n\nTout cela est bien en avance sur le calendrier, ce qui surprend, et beaucoup à l'UKSC n'étaient pas prêts à l'intégrer à la base actuelle. Une nouvelle base lunaire est donc nécessaire, dans un emplacement bien mieux adapté à une expansion rapide que Moonbase Alpha. Il est temps de préparer Moonbase Beta."
 ENG_military.011.a: "La vie continue"
 ENG_military.012.t: "Nouvelle crise sur la Lune"
 ENG_military.012.d: "Des mesures encore plus drastiques s'imposent. Deux modules de plus se sont rompus. Cette fois, ce sont les modules alimentaire et d'agréments.\n\nIl y a environ quarante minutes, un scientifique s'apprêtait à entrer dans le module alimentaire lorsqu'il a soudain explosé. Le scientifique va bien, et seuls les plants ont été touchés. Mais il était adjacent au module d'agréments, qui s'est rompu et a explosé. Là encore, personne n'a été blessé.\n\nCet incident a toutefois hérissé plus d'un au pays, mettant en cause la sécurité des modules. Après l'explosion précédente, l'UKSC les avait remplacés, jurant qu'ils n'exploseraient plus, mais une pression prolongée semble fragiliser bien plus facilement. L'UKSC a déjà réagi, commandant de nouveaux modules et une inspection minutieuse de tous les modules actuels (on ne peut pas « rappeler » des modules depuis la Lune pour l'instant).\n\nAvec la pression croissante au pays pour interrompre le projet jusqu'à résolution de tous les problèmes de sécurité, la poursuite du programme lunaire est en question. Outre le recul politique, le fonds d'urgence a été réduit de moitié, et l'UKSC demande encore 5 milliards de dollars pour traiter les préoccupations futures. C'est à vous de décider de continuer."
 ENG_military.012.a: "Envoyez davantage d'aide d'urgence !"
 ENG_military.012.b: "Nous ne pouvons pas continuer ainsi"
 ENG_military.013.t: "Bêta de la base lunaire"
 ENG_military.013.d: "À ce stade, nos scientifiques et ingénieurs sur la Lune doivent se déplacer vers un autre emplacement aux pôles. Les coûts sont déjà inscrits au budget de long terme, inutile d'ajouter de nouveaux fonds pour l'instant.\n\nAvec cette nouvelle base, nous pourrons utiliser les découvertes récentes pour l'établir de façon permanente, contrairement à la précédente. Grâce à de meilleures fusées, une meilleure production d'énergie, une meilleure extraction et séparation de la glace, nous pourrons, sur un site plus adapté à une expansion rapide, faciliter la colonisation de la Lune. Ce n'est pas la seule bonne nouvelle : entrepreneurs et entreprises affluent en masse vers l'UKSC pour installer leurs nouveaux systèmes miniers sur la Lune. D'autres programmes spatiaux étrangers s'intéressent désormais fortement à des avant-postes scientifiques et miniers lunaires ; toutefois, grâce à vos efforts, nous avons une avance considérable et sommes le seul pays à tenter activement de coloniser la Lune.\n\nL'avenir sur notre Lune est brillant et chinois."
 ENG_military.013.a: "Enfin le thé de l'après-midi sur la Lune !"
 ENG_Moonbase_beta_completed: "Bêta de Moonbase terminée"
 ENG_military.014.t: "Mission rover sur Mars"
 ENG_military.014.d: "Nos scientifiques et ingénieurs sont prêts à envoyer notre rover sur Mars. Il emporte environ 14 capteurs, ainsi que des dizaines de millions de dollars d'équipements. Ce rover devra être régulièrement déplacé car le jour martien dure 1 1/5 jour terrestre, trop long pour que les batteries conservent l'énergie.\n\nLe rover sera aux pôles, facilement déplaçable, pour maximiser l'usage de nos panneaux solaires. Des expériences détermineront aussi les conditions de vie à long terme sur Mars. L'extraction de glace pourrait fournir de l'eau liquide pour les plantes et la nourriture des futurs astronautes, mais aussi de l'oxygène et de l'hydrogène, carburant de fusée.\n\nIl faudra des mois ou des années pour obtenir les recherches nécessaires. Pendant ce temps, grâce aux fonds du projet, nous construirons un dépôt en orbite martienne pour faciliter l'accès à Mars et le ravitaillement vers la Terre.\n\nTout cela est réalisable d'ici dix ans. L'heure du lancement est venue."
 ENG_military.014.a: "Lancez-vous !"
 ENG_military.015.t: "Projet de colonie martienne"
 ENG_military.015.d: "Si l'humanité veut coloniser Mars, elle doit établir une base permanente autosuffisante. C'est le rêve d'innombrables explorateurs spatiaux et le seul moyen pour l'homme de poser vraiment le pied dans l'espace. Tout cela deviendra réalité aujourd'hui."
 ENG_military.015.a: "Mars, nous voilà !"
 ENG_military.016.t: "Panne du système d'atterrissage"
 ENG_military.016.d: "Après un voyage de près de 60 millions de kilomètres, notre vaisseau est enfin apparu au-dessus de Mars. L'oxyde de fer partout à la surface lui donne un aspect rouge. La planète, longtemps visible seulement à travers une lentille, est désormais à portée de vue. \nLe vaisseau entre en mode d'atterrissage. Le capitaine, qui s'était entraîné d'innombrables fois sur le simulateur, donna l'ordre, mais le dispositif d'atterrissage sembla défaillir. De grosses gouttes de sueur couvrirent soudain son front."
 ENG_military.016.a: "Londres, nous avons un problème."
 ENG_military.017.t: "Panne de véhicule"
 ENG_military.017.d: "Après une demi-heure palpitante, le vaisseau échappa enfin au risque de crash et atterrit de travers sur la plaine d'Utopia. C'est aussi le site d'atterrissage du précédent rover Beagle. On y reconnaît le plus grand bassin d'impact de Mars et du système solaire, d'un diamètre estimé à 3 300 kilomètres. \nAprès l'atterrissage, l'équipage passera sur un rover spécial et se dirigera vers le sud de la plaine pour établir une base, mais les vibrations de l'atterrissage semblent avoir affecté le rover. Il est clair que la situation n'a pas forcément tourné à l'avantage de l'équipage"
 ENG_military.017.a: "Il y a quelque chose qui cloche avec notre fichu véhicule aujourd'hui."
 ENG_military.018.t: "Arrivée à la base"
 ENG_military.018.d: "Quarante kilomètres : la première fois que l'humanité a parcouru une telle marche sur une autre planète que la Terre. Une distance ordinaire sur Terre, une percée dans l'histoire du vol spatial. \nAprès le processus tendu d'installation du camp, la transmission de toutes les données nécessaires vers la Terre et la vérification des paramètres de tous les équipements, le capitaine assis sur son lit put enfin boire une gorgée de thé. \nPar la fenêtre de matériau synthétique transparent au-dessus de sa tête, un point lumineux parmi les étoiles brillait d'un peu de bleu, et c'était la Terre. \n\n« Mieux. » murmura le capitaine."
 ENG_military.018.a: "N'ayez pas peur d'arriver en retard pour un bon repas."
 ENG_military.019.t: "Atterrissage réussi"
 ENG_military.019.d: "Tout était parfait, comme prévu : le vaisseau a atterri exactement sur le site désigné, et le voyage humain vers Mars a commencé dans le calme. \n"
 ENG_military.019.a: "Je savais que notre équipage mènerait la mission à bien."
 ENG_military.020.t: "Arrivée à la base"
 ENG_military.020.d: "Le point d'atterrissage du vaisseau était l'adresse prévue de la base, et l'équipage commença à camper sur place pour préparer la construction de la première base permanente de l'humanité sur Mars. Personne ne remarqua que les bottes spatiales laissaient d'innombrables empreintes désordonnées dans le sol martien."
 ENG_military.020.a: "Un petit pas pour Mars, un bond de géant pour l'humanité."
 ENG_military.021.t: "Localiser la source d'eau"
 ENG_military.021.d: "L'eau est une ressource essentielle à la survie humaine. L'un des principaux objectifs des précédentes explorations martiennes était de trouver des sources d'eau. S'il n'y a pas de lacs ni de rivières de surface comme sur Terre, les ressources en eau de Mars existent essentiellement sous forme de glace sous la surface. \nToutefois, un positionnement précis exige que quelqu'un mène des relevés sur place."
 ENG_military.021.a: "Nous ne survivrons pas sans notre thé !"
 ENG_military.022.t: "Radioprotection souterraine"
 ENG_military.022.d: "En raison de l'atmosphère ténue de Mars et de l'absence de champ magnétique planétaire, le rayonnement spatial atteint la surface sans obstacle. La base ne pouvait pas offrir assez d'abri à ses débuts, creuser un nid sous terre devint donc le premier choix pour éviter les radiations. \nTémoins de la fierté de créer une nouvelle base pour le Royaume-Uni, l'équipage se souvint des grands jours de l'Empire britannique."
 ENG_military.022.a: "Britannia règne sur l'espace"
 ENG_military.023.t: "La première récolte sur Mars"
 ENG_military.023.d: "Le problème de l'eau est résolu, et l'énergie est provisoirement fournie par le solaire. La production de nourriture (et de thé) sur Mars est donc devenue l'affaire la plus urgente. \nLes céréales traditionnelles ont été écartées en raison de leurs cycles de croissance et de récolte, et la pomme de terre est devenue la première culture humaine sur Mars. Bien que Mars soit moins lumineuse que la Terre en raison de la distance au Soleil, les pommes de terre de la serre semblent pousser plus drues. La première récolte de l'humanité sur Mars est en vue."
 ENG_military.023.a: "Des pommes de terre 100 % naturelles, bio, cultivées sur Mars."
 ENG_military.024.t: "Tempête de sable"
 ENG_military.024.d: "Les tempêtes de sable sont fréquentes sur Mars. Bien que la pression atmosphérique martienne soit bien inférieure à celle de la Terre, la tempête n'est pas aussi dévastatrice que les légendes — comme dans ce film. \nLa poussière soulevée pose toutefois de nombreux dangers cachés aux bases humaines, d'autant que le solaire est une énergie indispensable aux bases actuelles."
 ENG_military.024.a: "Nous n'avons aucune chance de sauver Matt Damon ici."
 ENG_military.025.t: "Accident"
 ENG_military.025.d: "Qui trop va à la montagne finit par rencontrer le tigre. La tempête de poussière martienne a duré bien plus longtemps que prévu, et l'autonomie des batteries à l'intérieur de la base semble très pessimiste. \nPour poursuivre la mission de colonie martienne, nous devons décider : évacuer et trouver un nouvel emplacement, ou continuer à réparer les installations endommagées."
 ENG_military.025.a: "Évacuer"
 ENG_military.025.b: "Base fixe"
 ENG_military.026.t: "Évacuer"
 ENG_military.026.d: "Nous ne pouvons plus attendre. La situation est désormais critique et il est temps d'utiliser les fusées de secours pour évacuer. Après s'être assuré que tous les membres d'équipe étaient à bord, le capitaine jeta un dernier regard réticent au bâtiment de la base encore en construction. Il étouffa le chagrin et donna l'ordre au guide d'intelligence artificielle de lancer le vaisseau. \n« Nous reviendrons ! » Tandis qu'un énorme panache de fumée s'élevait, le vaisseau se détacha du sol martien et monta lentement vers le ciel."
 ENG_military.026.a: "Tant qu'il y a de la vie, il y a de l'espoir."
 ENG_military.027.t: "Réparer la base endommagée"
 ENG_military.027.d: "Nous ne pouvons pas rester les bras croisés : il faut commencer immédiatement les réparations de la base, quel qu'en soit le coût, sinon tous nos acquis sur Mars seront ruinés, et personne ne survivra dans ce chaos. Sauver la base, c'est nous sauver nous-mêmes."
 ENG_military.027.a: "Pour le sacrifice et la grande ambition, osons un monde nouveau."
 ENG_military.028.t: "Projet Mars City"
 ENG_military.028.d: "Nous avons réalisé des avancées remarquables dans la construction d'une colonie martienne. Mais il reste du chemin avant d'atteindre pleinement notre but. Voulons-nous encore investir dans la construction martienne ?"
 ENG_military.028.a: "Mise à niveau"
 ENG_military.028.b: "Je n'en ai pas besoin"
 ENG_military.029.t: "Oui"
 ENG_military.029.d: "Encore un pas, et notre mission sur Mars sera pleinement achevée. Il n'y a pas de demi-mesure à notre ordre du jour."
 ENG_military.029.a: "Ne pas renvoyer la responsabilité à la génération suivante."
 ENG_military.030.t: "Non."
 ENG_military.030.d: "La base martienne actuelle est suffisamment complète, et il serait imprudent d'investir davantage. Nous avons encore bien des problèmes à affronter sur Terre, et il est impossible de jeter l'argent dans l'espace."
 ENG_military.030.a: "Faire confiance à la sagesse des générations futures."
 ENG_military.031.t: "Mars City terminé"
 ENG_military.031.d: "Après nos efforts inlassables, notre colonie sur Mars est enfin achevée. L'humanité n'oubliera jamais ces efforts, et un jour elle posera le pied dans toute la galaxie."
 ENG_military.031.a: "Notre voyage, c'est toute la galaxie."
 ENG_military.032.t: "Création d'une nouvelle sous-base"
 ENG_military.032.d: "Tandis que davantage de vaisseaux amenaient plus de personnel et de matériel, la base martienne d'origine commença à prospérer. Les ressources en eau sous la base initiale ne pouvaient plus porter davantage de monde, et il devenait urgent d'établir une nouvelle sous-base. \nTandis que le vaisseau de la première équipe disparaissait peu à peu, l'ancien capitaine, aujourd'hui maire de la première nouvelle ville de Londres, se souvint du jour où le rover martien était tombé dans une tranchée."
 ENG_military.032.a: "Maman, je pars aujourd'hui pour un long voyage."
 ENG_military.033.t: "Monument de la ville de Mars"
 ENG_military.033.d: "L'humanité ayant parcouru Mars, Mars est devenue le nouveau foyer des Terriens. La terraformation de Mars avance de façon ordonnée. Au premier point d'atterrissage du vaisseau humain, un immense monument a été érigé pour commémorer les hommes et les femmes qui ont donné leur vie durant le voyage et la construction. Ils seront à jamais gravés dans le parcours de la civilisation humaine."
 ENG_military.033.a: "Pour l'humanité !"
 ENG_mars_city_building_completed: "Le bâtiment de Mars City est terminé"
 ENG_military.001.t: "Lancement de l'initiative d'exploitation minière d'astéroïdes"
 ENG_military.001.d: "L'exploitation minière d'astéroïdes n'était qu'un fantasme pour beaucoup avant nous. Les astéroïdes recèlent des métaux du groupe du platine, de l'or, de l'argent et des métaux du groupe du fer. Cela pourrait devenir extrêmement lucratif pour tout pays spatial. Aujourd'hui, la création d'une British Royal Asteroid Mining Company, ou BRAMC, constituera le premier pas vers l'exploitation des astéroïdes. Grâce à de vastes réseaux de télescopes à travers l'Empire, nous pourrons chercher des astéroïdes adaptés dans l'espace proche, puis les placer en orbite et les extraire. Repérer un astéroïde convenable sera difficile : relativement à leur distance, ils sont assez petits. Heureusement, il en passe assez souvent près de la Terre, et il ne faudrait pas longtemps pour en garder un en orbite terrestre."
 ENG_military.001.a: "Il n'y a plus qu'à attendre un astéroïde..."
 ENG_military.002.t: "Astéroïde repéré"
 ENG_military.002.d: "Récemment, nos scientifiques de la BRAMC ont repéré un astéroïde adapté passant près de la Terre. C'est un soulagement pour la BRAMC, certains doutaient que nous en trouvions jamais un d'intérêt économique. Cet astéroïde se déplace assez lentement, est assez grand et assez riche pour être mis en orbite et extrait. Il est, en fait, plus grand que le pays de Galles. L'étape suivante consiste simplement à le placer en orbite terrestre, ce qui n'a jamais été fait. Entre-temps, les ingénieurs du British Space Command, et même des entreprises privées comme Virgin Galactic, ont inventé des mécanismes d'extraction, prêts pour l'arrivée de l'astéroïde en orbite."
 ENG_military.002.a: "Mettons ce bébé en orbite"
 ENG_military.003.t: "Astéroïde en orbite"
 ENG_military.003.d: "L'astéroïde en orbite, l'UKSC et Virgin envoient tous deux des missions. L'UKSC se préoccupe surtout de collecter des données scientifiques, Virgin Galactic davantage d'extraire le matériau. C'est sans doute un exploit notable, qui nous donne un avantage dans l'espace. On parle même d'amener d'autres astéroïdes, mais beaucoup disent que cela peut attendre, celui-ci étant très grand et bien adapté. D'autres pays nous regardent déjà avec envie et envisagent leurs propres programmes. Les coûts sont extrêmement élevés ne serait-ce que pour développer la technologie d'accès, et Virgin Galactic comme l'UKSC s'inquiètent peu d'une concurrence prochaine."
 ENG_military.003.a: "Que l'extraction commence"
 ENG_military.004.t: "Les profits miniers commencent à affluer"
 ENG_military.004.d: "Après l'établissement des opérations minières, Virgin Galactic et l'UKSC ont renvoyé leurs premiers chargements de matériau spatial vers des laboratoires et des marchés du monde entier. Le monde nous a regardés avec jalousie, et des débats ouverts ont eu lieu dans leurs chambres législatives respectives pour lancer leurs propres opérations. Nous aurons bientôt de la concurrence, mais nous pouvons jouir du monopole pour l'instant."
 ENG_military.004.a: "Je suis aux anges !"
 ENG_military.005.t: "Profits de l'exploitation minière d'astéroïdes"
 ENG_military.005.d: "Les derniers chargements de nos opérations minières d'astéroïdes sont arrivés et ont généré de nombreuses recettes. Ces envois comprennent du platine, de l'or et de l'argent. En faire bon usage serait sage."
 ENG_military.005.a: "Excellent!"
 ENG_military.006.t: "Potentiel de l'exploitation minière d'astéroïdes"
 ENG_military.006.d: "Récemment, la Chambre des communes a autorisé l'UKSC et Virgin Galactic, entreprise spatiale privée, à amener un astéroïde assez grand en orbite terrestre et à l'exploiter. Nos conseillers recommandent d'investir dans ce nouvel espace, qui pourrait livrer des matériaux rares directement dans notre pays. Certains, toutefois, ont cité la facture colossale que le Royaume-Uni a dû payer pour lancer les opérations, et s'opposent à l'expansion spatiale. Le retour sur investissement est incertain, et il faudra peut-être 25 ans pour simplement rentrer dans nos frais. Un investissement plus substantiel pourrait réduire ce délai, mais nous resterions longtemps à la traîne. \n\nQue ferons-nous concernant l'exploitation minière d'astéroïdes ? Lancer un programme national, ou l'ignorer ?"
 ENG_military.006.a: "Investir dans l'exploitation minière des astéroïdes"
 ENG_military.006.b: "Trop cher et une perte de temps !"
 Mobile_Fires_Platorm_Program.1.t: "Choix du partenaire du programme de plateforme d'appui-feu mobile"
 Mobile_Fires_Platorm_Program.1.d: "Après la fin de la guerre froide et l'anticipation émoussée d'un conflit sur les plaines allemandes, le stock de systèmes d'artillerie de 155 mm de l'armée a décliné, et désormais, face à de nouvelles menaces, le ministère de la Défense a décidé de ressusciter cette capacité. De nombreux programmes et partenaires se sont présentés pour ce contrat, dont un seul l'emportera."
 ENG_military.034.a: "Alliance d'artillerie Archer"
 ENG_military.034.b: "Groupe de développement K9A1 Thunder"
 ENG_military.034.c: "Programme Boxer"
 ENG_military.034.e: "Collaboration à cesser"
 ENG_military.035.t: "La Grande-Bretagne nous invite à une force expéditionnaire conjointe"
 ENG_military.035.d: "Le Royaume-Uni adresse une invitation cordiale à [Receiving Country] à rejoindre la Joint Expeditionary Force (JEF), une initiative de coopération internationale visant à renforcer la sécurité collective. Cet événement marquant ouvre un nouveau chapitre de notre engagement commun à promouvoir la stabilité, à répondre aux défis mondiaux et à sauvegarder les valeurs qui nous sont chères."
 ENG_military.035.a: "Nous rejoignons !"
 ENG_military.035.b: "Non merci, mon vieux"
 ENG_military.036.t: "[From.GetName] Accepte !"
 ENG_military.036.d: "[From.GetName] rejoindra notre Joint Expeditionary Force. Ensemble, nous pourrons préparer nos forces à une réaction rapide"
 ENG_military.036.a: "Bienvenue"
 ENG_military.037.t: "[From.GetName] Refuse !"
 ENG_military.037.d: "[From.GetName] ne rejoindra pas notre Joint Expeditionary Force. Ils préfèrent se tenir seuls"
 ENG_military.037.a: "Ils le regretteront avec le temps"
 ENG_military.038.t: "Agrandissement du Collège naval de Dartmouth"
 ENG_military.038.d: "Axé sur la technologie de pointe, la pensée stratégique et l'expérience pratique, le Dartmouth Naval College est appelé à jouer un rôle central dans la formation de la prochaine génération de chefs navals."
 ENG_military.038.a: "Les porte-avions sont l'avenir de la guerre navale"
 ENG_military.038.b: "Nous avons besoin de destroyers et de croiseurs pour vaincre nos ennemis en mer"
 ENG_military.040.t: "Débat sur la tranche 1 du typhon"
 ENG_military.040.d: "Des parties prenantes — responsables militaires, analystes de défense et représentants du gouvernement — débattent de l'efficacité de l'appareil face aux menaces évolutives, de son rôle dans les stratégies de défense nationale et de son potentiel d'exportation. Le débat sur le Typhoon Tranche 1 joue un rôle crucial dans les décisions d'acquisition, de déploiement et de développement futur de ce chasseur avancé."
 ENG_military.040.a: "Continuer la production"
 ENG_military.040.b: "Étudier son successeur"
 ENG_military.040.c: "Réduire le stock"
 ENG_military.039.t: "Spécialisation des forces armées"
 ENG_military.039.d: "Choisissez votre spécialisation"
 ENG_military.039.a: "Army"
 ENG_military.039.b: "Armée de l'air"
 ENG_military.039.c: "Navy"
 ENG_military.039.e: "Staff"
 ENG_military.041.t: "Le Royaume-Uni nous invite à acheter son innovation aéronautique"
 ENG_military.041.d: "Le Royaume-Uni a massivement investi dans ses capacités aéronautiques. En raison de notre relation spéciale, ils proposent de partager leur innovation pour un petit prix. Ils sont britanniques, après tout"
 ENG_military.041.a: "Innover ? Oui s'il vous plait!"
 ENG_military.041.b: "Non merci mon vieux"
 ENG_military.042.t: "Le Royaume-Uni nous invite à acheter son innovation aéronautique"
 ENG_military.042.d: "Le Royaume-Uni a massivement investi dans ses capacités aéronautiques. En raison de notre relation spéciale, ils proposent de partager leur innovation pour un petit prix. Ils sont britanniques, après tout"
 ENG_military.042.a: "Innover ? Oui s'il vous plait!"
 ENG_military.042.b: "Non merci mon vieux"
 ENG_military.043.t: "Les États-Unis acceptent"
 ENG_military.043.d: "Les États-Unis ont accepté notre offre de vendre notre innovation"
 ENG_military.043.a: "Comme prévu"
 ENG_military.044.t: "Les États-Unis refusent"
 ENG_military.044.d: "Les États-Unis ont refusé notre offre de vente d'innovation. Ils estiment que le Royaume-Uni n'est pas le partenaire viable dont ils ont besoin"
 ENG_military.044.a: "Ils le sauront un jour"
 United_Kingdom.002.t: "Silicon Glen tient ses promesses"
 United_Kingdom.002.d: "Nos investissements dans la Silicon Glen écossaise portent leurs fruits. Universités locales, concepteurs de puces et éditeurs de logiciels signalent une nouvelle année de croissance, de nouveaux brevets et un flux régulier de diplômés qualifiés dans l'économie élargie."
 United_Kingdom.002.a: "Que la Glen continue de reculer la frontière"
 United_Kingdom.003.t: "Proposition de coopération transfrontalière"
 United_Kingdom.003.d: "Le Royaume-Uni nous a soumis une proposition visant à améliorer la logistique commerciale et à réduire les formalités à notre frontière commune. Le cadre de coopération proposé porte sur l'alignement des infrastructures, la simplification douanière et des comités réglementaires conjoints.\n\nDevons-nous accepter ?"
 United_Kingdom.003.a: "Accepter le cadre"
 United_Kingdom.003.b: "Refuser l'offre"
 United_Kingdom.004.t: "L'Irlande accepte la coopération transfrontalière"
 United_Kingdom.004.d: "Le gouvernement irlandais a accepté notre proposition de coordination économique transfrontalière simplifiée. Des comités ont été créés pour réduire la bureaucratie, aligner les normes et faciliter la circulation des marchandises à travers la mer d'Irlande et la frontière terrestre."
 United_Kingdom.004.a: "Progresser grâce au partenariat"
 United_Kingdom.005.t: "L'Irlande refuse l'offre transfrontalière"
 United_Kingdom.005.d: "Malgré un intérêt initial, le gouvernement irlandais a finalement décidé de ne pas participer à notre cadre de coopération transfrontalière. Les responsables ont cité la complexité juridique et l'hésitation politique comme raisons principales du refus."
 United_Kingdom.005.a: "Dommage mais attendu"
 scottish.1.t: "Élections parlementaires écossaises"
 scottish.1.d: "Les résultats des élections au Parlement écossais sont connus, et nous pouvons enfin voir si le peuple écossais a voté pour des partis pro-indépendance."
 scottish.1.a: "D'accord"
 britain_md.1.a: "Alors, en route"
 britain_md.2.a: "Nous prendrons le risque"
 britain_md.2.b: "Ces chances ne me plaisent pas"
 britain_md.3.a: "Faire appel aux syndicats"
 britain_md.3.b: "Faire appel au complexe militaro-industriel"
 britain_md.3.c: "Faire appel à l'industrie des combustibles fossiles"
 britain_md.4.a: "Taxer les industriels"
 britain_md.4.b: "Taxer l'armée"
 britain_md.4.c: "Taxer les industries des combustibles fossiles"
 britain_md.4.d1: "Faut-il vraiment taxer qui que ce soit ?"
 britain_md.5.a: "En avant !"
 britain_md.6.d: "Nos infrastructures ont un besoin urgent de modernisation. Elles ne sont pas nécessairement mauvaises, mais pour rivaliser avec les acteurs mondiaux, il nous faudra agrandir nos villes. Plutôt que de nous concentrer uniquement sur une expansion large des infrastructures, nous choisirons une région précise. Ainsi, nous pourrons créer de nouveaux pôles d'investissement et faire prospérer ces zones."
 britain_md.6.a: "Travailler sur le Nord"
 britain_md.6.b: "Travailler sur le Centre"
 britain_md.6.c: "Travailler sur le Sud"
 britain_md.7.a: "Au travail"
 britain_md.8.a: "Ils n'ont certainement aucun lien ! Les migrants, ça va"
 britain_md.8.b: "Eh bien, les données ne mentent pas"
 britain_md.9.a: "Pas de temps à perdre, allons-y"
 britain_md.10.a: "Changeons ça un peu"
 britain_md.10.b: "Absolument pas"
 britain_md.11.a: "Bien, maintenant allons-y"
 britain_md.12.a: "D'accord"
 britain_md.12.b: "Non."
 britain_md.13.a: "D'accord"
 britain_md.14.a: "Bâtards"
 britain_md.15.a: "D'accord"
 britain_md.16.a: "Un coup d'État en douceur, sans chercher plus de contrôle"
 britain_md.16.b: "Un coup dur : nous pousserons à un État satellite"
 britain_md.17.a: "Good"
 britain_md.18.a: "Shit"
 britain_md.19.a: "Good"
 britain_md.20.a: "Comme prévu"
 britain_md.21.a: "Absurdité ! Mais que pouvons-nous faire ?"
 britain_md.21.b: "Absurdité ! Mobiliser l'armée !"
 britain_md.22.a: "Il n'y a plus de retour en arrière"
 britain_md.22.b: "Attendez un peu, et si nous les rendions ?"
 britain_md.23.a: "La peur va-t-elle te gouverner ?"
 britain_md.24.a: "Ambitions pour la Grande-Bretagne"
 britain_md.24.b: "La Grande-Bretagne en avant, pas en arrière"
 britain_md.24.c: "Un avenir équitable pour tous"
 britain_md.24.a1: "L'heure du bon sens"
 britain_md.24.b1: "Pensez-vous ce que nous pensons ?"
 britain_md.24.c1: "Invitation au gouvernement de Grande-Bretagne"
 britain_md.25.a: "Allons-y!"
 britain_md.26.a: "Se concentrer sur l'intégration des îles"
 britain_md.26.b: "Nous devons pousser plus à l'ouest"
 britain_md.26.c: "Rendre les îles"
 britain_md.27.t: "La Grande-Bretagne rend les Malouines"
 britain_md.27.d: "Dans un retournement astronomiquement stupéfiant, [ENG.GetName], un État qui nous a combattus pour les Malouines dans les années 80, a décidé de nous rendre les îles. Nous ignorons ce qui a motivé ce geste, mais nos forces se dirigent déjà vers l'île pour s'y stationner. Le gouvernement britannique a déclaré que la mesure visait à « réchauffer les relations » avec nous et la région sud-américaine au sens large."
 britain_md.27.a: "Cela nous convient !"
 britain_md.28.t: "Opération de changement de régime réussie au Zimbabwe"
 britain_md.28.d: "À la suite d'une opération pour renverser le dictateur zimbabwéen, le parti Movement for Change (MDC) a été installé par nos forces. Cela fait suite à une planification extensive et à une opération des forces spéciales britanniques pour renverser le régime de longue date du pays."
 britain_md.28.a: "Bien, nous n'attendions rien de moins"
 britain_md.29.t: "[ENG.GetName] mène un coup d'État !"
 britain_md.29.d: "Il apparaît que [ENG.GetName] a mené une opération clandestine dans notre pays, aboutissant au renversement de notre précédent régime et à l'installation d'un nouveau gouvernement. Les forces militaires avaient été contactées au préalable et ont même pavé la voie aux forces britanniques pour entrer dans le pays sans être remarquées."
 britain_md.29.a: "What?"
 britain_md.30.t: "À l’approche de l’opération Eastern Divide"
 britain_md.30.d: "Les Égyptiens contrôlent actuellement entièrement le Sinaï, avec des accrochages occasionnels avec les Israéliens au fil des ans. Notre nation a toutefois un besoin désespéré de routes commerciales plus efficaces, et les taxes que nous subissons à chaque passage par Suez ont commencé à s'accumuler au-delà de toute compréhension. Il nous faudra conclure un accord avec les Égyptiens, ou nous serons contraints d'aller plus loin."
 britain_md.30.a: "Commençons les négociations"
 britain_md.30.b: "Pas le temps de négocier, avancer"
 britain_md.31.t: "La Grande-Bretagne demande un contrôle conjoint du Sinaï"
 britain_md.31.d: "Le gouvernement britannique a envoyé des diplomates saluer nos ministres à [EGY.capital.GetCapitalVictoryPointName] pour discuter d'un possible contrôle conjoint du Sinaï. Ils affirment que leurs navires et marchands ont été traités trop injustement, et qu'accepter démontrerait que notre gouvernement est digne de confiance."
 britain_md.31.a: "Chaque Égyptien mourra avant que nous cédions le Sinaï !"
 britain_md.31.b: "Peut-être pouvons-nous trouver un arrangement..."
 britain_md.32.t: "L'Egypte refuse les négociations"
 britain_md.32.d: "Les Égyptiens ont déclaré n'avoir aucun intérêt à négocier avec nous le contrôle de Suez, même si nous sommes prêts à d'importantes concessions. Il ne nous reste plus qu'à envisager une intervention militaire."
 britain_md.32.a: "Il est temps d'intervenir"
 britain_md.32.b: "Oublie ça"
 britain_md.33.t: "L'Egypte propose des négociations"
 britain_md.33.d: "Les Égyptiens ont accepté nos demandes de négociations sur le Sinaï, et ont demandé une somme d'argent en échange d'un accès direct militaire et commercial au Sinaï avec des taxes réduites."
 britain_md.33.a: "Cela nous convient"
 britain_md.33.b: "Vraiment ? C'est une insulte !"
 britain_md.34.t: "Opération Eastern Divide : en cours"
 britain_md.34.d: "L'opération Eastern Divide est en cours, des troupes ayant débarqué dans le Sinaï. Nous devons commencer à mobiliser un plus grand volume de forces qui permettra une opération de plus grande ampleur."
 britain_md.34.a: "Go, go, go!"
 britain_md.35.t: "[FROM.GetName] appelle à une intégration plus poussée"
 britain_md.35.d: "[ENG.GetName] a appelé à une intégration plus profonde, affirmant qu'en cédant un peu de notre souveraineté, nous pourrons rassembler nos forces et ramener notre position à celle d'une puissance mondiale. Beaucoup de nos citoyens se méfient d'une telle proposition, mais [ENG.GetName] s'est récemment révélé un concurrent sérieux en nous surpassant dans tous les secteurs."
 britain_md.35.a: "Nous devons nous unir"
 britain_md.35.b: "Nous ne céderons pas notre souveraineté"
 britain_md.36.t: "[FROM.GetName] recherche une plus grande intégration"
 britain_md.36.d: "[FROM.GetName] a indiqué être bel et bien intéressé par une intégration plus profonde, proposant plusieurs feuilles de route pour fusionner les institutions et organes bureaucratiques essentiels. Nos diplomates et bureaucrates travaillent d'arrache-pied pour assurer une transition fluide, sûre et stable."
 britain_md.36.a: "Good"
 britain_md.37.t: "[FROM.GetName] refuse une intégration plus poussée"
 britain_md.37.d: "Il apparaît que le gouvernement [FROM.GetAdjective] n'est pas intéressé par une intégration plus poussée, insistant au contraire sur le fait que nos récents mouvements portent atteinte à leur souveraineté."
 britain_md.37.a: "D'accord"
 britain_md.39.t: "Élire une figure de proue"
 britain_md.39.d: "Nous comprenons les implications de donner une forme de pouvoir à un autre politicien, mais il faut reconnaître le besoin d'un représentant qui apaise les foules méfiantes d'un chef militaire à la tête de l'État. Nous trouverons rapidement quelqu'un à hisser comme marionnette pour représenter l'État."
 britain_md.39.a: "Mettre ce fou de Farage"
 britain_md.39.b: "Trouver où se cache Griffin"
 britain_md.39.c: "Michael Holmes est-il dans les parages ?"
 britain_md.39.d1: "L'armée nous suffira très bien"
 british_flavor.1.t: "Nissan cherche à agrandir son usine près de Sunderland"
 british_flavor.1.d: "Le constructeur automobile japonais Nissan cherche à agrandir son usine de Sunderland pour y inclure sa nouvelle génération d'Almera Hatchback et de berline, bientôt en vente. Les responsables gouvernementaux craignent que l'expansion ne rende plus difficile la concurrence des usines locales et des constructeurs nationaux."
 british_flavor.1.a: "Approuvez-le"
 british_flavor.1.b: "Non, nous ne pouvons pas laisser faire"
 british_flavor.2.t: "Extradition d'Augusto Pinochet"
 british_flavor.2.d: "Les preuves médicales ont conclu qu'Augusto Pinochet, l'ancien dictateur chilien, est inapte à être jugé. À la suite de cette enquête, les appels à renvoyer l'ancien dictateur au Chili se sont multipliés, mais face à ceux qui veulent son expulsion, un groupe réclame la poursuite de son procès ici au Royaume-Uni."
 british_flavor.2.a: "Le renvoyer"
 british_flavor.2.b: "Il reste"
 british_flavor.3.t: "Éviers de moissonneuse Solway"
 british_flavor.3.d: "Le Solway Harvester a été signalé coulé au large de l'île de Man par gros temps. On rapporte aussi que les 11 membres d'équipage ont péri, et que le navire serait récupérable mais gravement endommagé."
 british_flavor.3.a: "On s'en occupera plus tard"
 british_flavor.3.b: "Récupérer les corps de l'équipage et préparer les funérailles"
 british_flavor.4.t: "Ariana Afghan Airways détournée"
 british_flavor.4.d: "Un groupe de pirates de l'air en Afghanistan a pris un vol et l'a forcé à se rendre au [ENG.GetName], le faisant atterrir à Londres. Les autorités s'apprêtent à envoyer une petite force affronter les pirates, mais nous ignorons ce que nous en ferons ensuite."
 british_flavor.4.a: "Les arrêter puis les expulser"
 british_flavor.4.b: "Les arrêter puis les renvoyer en jugement !"
 british_flavor.5.t: "OPA hostile sur la NatWest Bank"
 british_flavor.5.d: "Une banque écossaise tente actuellement une OPA hostile sur une banque anglaise, NatWest Bank. La Royal Bank of Scotland est actuellement la plus petite des deux, et son succès dépend largement d'une autre offre d'une autre banque, la Bank of Scotland."
 british_flavor.5.a: "Ce n'est pas notre affaire"
 british_flavor.5.b: "Sauver la banque"
 british_flavor.6.t: "BMW annonce son intention de vendre le Rover Group"
 british_flavor.6.d: "Le constructeur allemand BMW a annoncé son intention de vendre le Rover Group, le consortium londonien Alchemy émergeant comme principal candidat à la reprise. Si cette reprise peut nous donner plus d'influence dans l'automobile, elle se traduira par un passif supplémentaire dans un secteur déjà fragile."
 british_flavor.6.a: "Cela nous convient"
 british_flavor.6.b: "Peut-être devraient-ils reconsidérer..."
 british_flavor.7.t: "David Trimble remporte l'élection à la tête de l'Ulster Unionist Party"
 british_flavor.7.d: "David Trimble a remporté l'élection à la direction de l'Ulster Unionist Party, parti pro-union et troisième plus ancien parti de Grande-Bretagne. Sa victoire est célébrée parmi les conservateurs, tandis que ceux qui souhaitent davantage d'autonomie sont indifférents ou contrariés, comme toujours."
 british_flavor.7.a: "Féliciter le vainqueur"
 british_flavor.8.t: "Loi sur l'immigration et l'asile"
 british_flavor.8.d: "L'Immigration and Asylum Act est actuellement débattu, et s'il est adopté, tous les réfugiés et migrants auront droit à des bons pour couvrir le coût de la nourriture et des vêtements. Opposer son veto peut sembler un peu inhumain, mais cela aboutira en définitive à des coûts plus élevés pour le contribuable britannique."
 british_flavor.8.a: "Approuvez-le"
 british_flavor.8.b: "Mettez votre veto"
 british_flavor.9.t: "Émeute anticapitaliste sur la place du Parlement"
 british_flavor.9.d: "Des émeutiers anticapitalistes ont descendu dans la rue et ont dégradé une statue de l'ancien Premier ministre britannique Winston Churchill. Les émeutes sont surnommées les émeutes du « May Day », et les foules ne semblent pas près de se disperser. Certains réclament une action, d'autres suggèrent qu'ils se lasseront et rentreront chez eux."
 british_flavor.9.a: "Nous attendrons que ça passe"
 british_flavor.9.b: "Envoyer des équipes de nettoyage et la police"
 british_flavor.10.t: "[ENG.GetLeader] hué à l'Institut des femmes"
 british_flavor.10.d: "[ENG.GetLeader] a essuyé un accueil hostile à l'Institut des femmes, où il a été hué et accueilli par des applaudissements lents de membres en colère. Cette réception embarrassante a suscité des discussions parmi les membres du parti, et le public interroge des aspects de notre direction."
 british_flavor.10.a: "Ignore-le"
 british_flavor.10.b: "Répondre aux critiques"
 british_flavor.11.t: "L'Écosse cherche à abroger l'article 28"
 british_flavor.11.d: "Le Parlement écossais cherche à abroger l'article 28 controversé du Local Government Act de 1988, qui empêche les autorités locales de « propager l'homosexualité ». Les laisser abroger cette loi pourrait entraîner des appels à l'abroger ailleurs, causant une instabilité politique."
 british_flavor.11.a: "Arrêtez-les"
 british_flavor.11.b: "Nous n'en avons cure"
 british_flavor.12.t: "Alex Salmond démissionne du SNP"
 british_flavor.12.d: "Alex Salmond a quitté son rôle de dirigeant du Scottish National Party pour des différends sur les stratégies financières internes du parti. Sa démission nous donne l'occasion d'attaquer le SNP pendant qu'il est faible, permettant une plus grande division dans ses rangs."
 british_flavor.12.a: "Mieux vaut ne rien faire"
 british_flavor.12.b: "Lancer une attaque politique"
 british_flavor.13.t: "Les quatre-vingts derniers"
 british_flavor.13.d: "Dans le cadre du processus de paix en Irlande du Nord, des dispositions ont été prises pour libérer les 80 derniers prisonniers détenus à la prison de Maze. Ces prisonniers étaient membres de l'Irish National Liberation Army, ou y étaient fortement liés, un incident s'étant produit en 1997 où ces prisonniers ont tué et abattu un chef de la force volontaire loyaliste."
 british_flavor.13.a: "Peut-être que nous les garderons..."
 british_flavor.13.b: "Très bien, qu'ils s'en aillent"
 british_flavor.14.t: "Des émeutes éclatent dans le domaine de Paulsgrove"
 british_flavor.14.d: "Des émeutes ont éclaté dans le domaine de Paulsgrove à Portsmouth après que plus de 100 personnes ont assiégé un immeuble qui abritait soi-disant un délinquant sexuel condamné. C'est le dernier épisode de violence vigilante contre des délinquants sexuels présumés depuis le début de la campagne de « naming and shaming » du News of the World."
 british_flavor.14.a: "Eh bien, nous n'y pouvions rien"
 british_flavor.14.b: "Envoyer la police"
 british_flavor.15.t: "Des manifestations contre le carburant éclatent"
 british_flavor.15.d: "Des manifestants ont bloqué l'entrée de raffineries de pétrole pour protester contre les prix élevés du carburant. Les automobilistes se sont rués sur l'essence, ce qui commence à provoquer une pénurie nationale et une nouvelle hausse des prix. On rapporte qu'un grand nombre de stations-service commencent à fermer, et le gouvernement s'empresse de trouver une solution."
 british_flavor.15.a: "Blâmer les industries des combustibles fossiles"
 british_flavor.15.b: "Imposer des quotas stricts d’utilisation du pétrole"
 british_flavor.15.c: "§RNe rien faire§!"
 british_flavor.151.t: "Des émeutes éclatent faute d'action gouvernementale"
 british_flavor.151.d: "Il apparaît que notre manque de résolution à résoudre la pénurie de carburant n'a fait qu'alimenter la colère, de plus en plus de gens descendant dans la rue pour exiger une solution gouvernementale. Pour l'heure, les manifestants marchent vers les bâtiments gouvernementaux et vandalisent statues, immeubles et symboles de l'État."
 british_flavor.151.a: "Nous essayons !"
 british_flavor.152.t: "Les appels au changement se renforcent"
 british_flavor.152.d: "Il apparaît que la détermination du peuple n'a fait que croître, la haine et la colère se dirigeant contre [ENG.GetLeader] et l'establishment au pouvoir. En outre, les appels à réaffecter les fonds royaux aux subventions au carburant se sont multipliés, certains allant jusqu'à demander à la monarchie de se retirer dans la honte."
 british_flavor.152.a: "Ridicule!"
 british_flavor.153.t: "Incendie à la Chambre des communes"
 british_flavor.153.d: "L'état d'urgence a été déclaré alors que les manifestations et émeutes ont basculé vers l'anarchie pure plutôt que la désobéissance civile organisée. La Chambre des communes a été incendiée par des manifestants en colère, la police n'ayant pu retenir les foules. On rapporte que les manifestants prévoient de marcher vers d'autres institutions de l'État, mais on ignore encore quelle sera la prochaine cible."
 british_flavor.153.a: "Oh seigneur"
 british_flavor.154.t: "La reine abdique !"
 british_flavor.154.d: "À la lumière du récent soulèvement et des échecs gouvernementaux persistants, la reine a officiellement déclaré qu'elle abdiquerait et prévoit de s'adresser à la nation dans un discours formel plus tard dans l'après-midi. Si beaucoup s'attristent de son départ, on ignore encore si elle sera remplacée, la haine envers la monarchie n'ayant fait que croître depuis le début des manifestations."
 british_flavor.154.a: "Adieu au joyau de la couronne et à la robe de velours"
 british_flavor.155.t: "[ENG.GetLeader] démissionne sans successeur clair"
 british_flavor.155.d: "[ENG.GetLeader] a démissionné, son parti n'ayant pu trouver rapidement un remplaçant convenable. Cet état d'anarchie a plongé le pays dans le désarroi, la confusion et la vulnérabilité. Jamais la Grande-Bretagne n'a affronté une telle crise, et le gouvernement a montré son incompétence à résoudre quoi que ce soit pour l'instant."
 british_flavor.155.a: "Que se passe-t-il ensuite ?!"
 british_flavor.156.t: "L'armée a pris le contrôle"
 british_flavor.156.d: "Les forces armées britanniques ont déclaré leur implication directe pour rétablir l'autorité, un porte-parole annonçant que quiconque violera le couvre-feu de 16 h sera « traité promptement », et que tout ce qu'ils entendent faire le sera pour « le bien supérieur de tous les Britanniques ». Cela a provoqué l'indignation au sein du Labour et des Conservateurs, qualifiant cette prise de pouvoir d'usurpation, certains dénonçant même un basculement radical vers la dictature. Les politiciens ont toutefois prouvé leur incapacité à résoudre les affaires de l'État, sans successeur clair après la démission de [ENG.GetLeader]."
 british_flavor.156.a: "Que nous réserve l'avenir ?"
 british_flavor.157.t: "Rapport : état des lieux du nouveau gouvernement"
 british_flavor.157.d: "Adressé à son excellence, [ENG.GetLeader],\nDate : [GetDateText]\n\nSujet I : État de l'ordre\nVotre excellence, les forces armées britanniques ont promptement sécurisé le contrôle des grandes zones urbaines telles que Londres, Birmingham, Manchester et Liverpool, entre autres. Pour l'instant du moins, les gens commencent lentement à se disperser et à rentrer chez eux tandis que nous établissons des subventions pétrolières financées par l'État et des programmes pour remettre le pays sur pied.\n\nSujet II : Appels de la gauche et de la droite\nLes politiciens travaillistes et conservateurs ont commencé à demander à notre administration d'urgence d'engager le processus requis pour rétablir le régime démocratique dans le pays, certains déclarant la nouvelle administration symbole d'autoritarisme et de dépassement militaire. Un politicien travailliste a même déclaré que « les hommes avec des fusils doivent rester dans leurs bases, et les hommes avec des plumes reprendre leur devoir de fonctionnaires ».\n\nSujet III : Consolidation supplémentaire\nNos hommes ont commencé à trouver des politiciens et bureaucrates mécontents de l'ancien système, les appelant à servir à la place des anciens politiciens du bipartisme. Saisir l'autorité de cette manière équivaudra presque certainement à un conflit national d'une sorte ou d'une autre ; toutefois, pour l'heure, nous n'avons pas d'autre moyen de consolider notre contrôle."
 british_flavor.157.a: "Bon à savoir"
 british_flavor.16.t: "Les conservateurs en hausse dans les sondages"
 british_flavor.16.d: "Les partisans du parti conservateur célèbrent après avoir appris que les Tories devancent le Labour de deux points, à 38 %, dans un sondage d'opinion MORI. C'est la première fois que les conservateurs mènent le Parti travailliste dans un sondage national depuis 1993. "
 british_flavor.16.a: "D'accord"
 british_flavor.17.t: "Tremblement de terre dans le Warwickshire"
 british_flavor.17.d: "Un séisme a frappé le comté cérémoniel du Warwickshire, causant des dégâts à des bâtiments voisins. Des appels à l'aide gouvernementale pour reconstruire certains bâtiments endommagés se font entendre, mais récemment le budget de l'État n'a cessé de se resserrer, rendant difficile pour Westminster d'arriver à une conclusion cohérente."
 british_flavor.17.a: "Il faudra simplement espérer que tout aille bien"
 british_flavor.17.b: "Autoriser l'aide gouvernementale"
 british_flavor.18.t: "Donald Dewar transporté d'urgence à l'hôpital"
 british_flavor.18.d: "Donald Dewar, Premier ministre d'Écosse, a été transporté d'urgence à l'hôpital après une chute devant Bute House, sa résidence officielle à Édimbourg. Sa santé se dégrade rapidement et les appels à une intervention gouvernementale pour envoyer des équipes médicales avancées se multiplient."
 british_flavor.18.a: "Prier pour son rétablissement"
 british_flavor.18.b: "Autoriser des équipes médicales spécialisées à lui porter secours"
 United_Kingdom_News.2.t: "Des émeutes éclatent au Royaume-Uni"
 United_Kingdom_News.2.d: "Après une pénurie nationale de carburant et une flambée des prix de l'essence, les autorités britanniques ont choisi d'attendre, espérant un rebond naturel de l'économie. La situation ne s'est toutefois pas améliorée ; elle n'a fait qu'empirer, dégénérant plus tôt cette semaine lorsque des manifestants ont mis le feu à la Chambre des communes. Les autorités britanniques ont affirmé n'être pas responsables des pénuries et ont déclaré que le problème était simplement naturel et passerait. Un manifestant a déclaré : « Je n'ai pas de carburant à mettre dans ma voiture ! Je n'ai aucun moyen d'aller au travail, et pas de chauffage chez moi pour tenir ma famille au chaud, ce qui se passe aujourd'hui est le résultat d'un système et d'un gouvernement inefficaces ».\nLe gouvernement a insisté qu'il faisait tout le possible pour atténuer la situation, mais pour l'heure les manifestations ne s'essoufflent pas."
 United_Kingdom_News.2.a: "La colère éclate à nouveau"
 United_Kingdom_News.3.t: "La reine Elizabeth II a abdiqué"
 United_Kingdom_News.3.d: "À la lumière des événements récents, la reine du Royaume-Uni, Élisabeth II, a annoncé son abdication officielle. Cela survient alors que les manifestants exigeaient la fin de la monarchie, l'associant à des symboles de corruption, d'avidité et de gouffres financiers. Plus précisément, la colère visait cette fois la monarchie parce que le peuple demandait que l'argent soit réaffecté aux subventions au carburant ; leurs appels sont toutefois restés lettre morte à Westminster. On ignore si un autre royal montera sur le trône, mais pour l'heure la monarchie ne peut que regarder le pays brûler."
 United_Kingdom_News.3.a: "Le trône s'effondre"
 United_Kingdom_News.4.t: "Les forces armées britanniques s'emparent de Londres"
 United_Kingdom_News.4.d: "Les forces armées britanniques ont déclaré leur implication officielle pour faire appliquer l'état d'urgence décrété, indiquant explicitement que quiconque violera le couvre-feu de 16 h sera traité « promptement ». Cela survient après des semaines de manifestations et d'émeutes au Royaume-Uni, les manifestants ayant incendié la Chambre des communes dans un accès de rage. On ne connaît pas encore les intentions de ce nouvel organe administratif, mais il serait composé d'hommes forts militaires qui entendent réduire le pouvoir que le Labour et les Conservateurs exercent sur l'establishment britannique."
 United_Kingdom_News.4.a: "Est-ce la fin du Royaume-Uni ?"
 ENG_inner_circle.01.t: "L'ascension de [GetAscendingAdvisorName]"
 ENG_inner_circle.01.desc: "[GetAscendingAdvisorName] a fait preuve d'une ambition aiguë et a discrètement étendu son influence au sein de la Maison royale. Chaque pas vers davantage d'autorité a toutefois suscité des objections d'autres courtisans et figures seniors, et le palais vibre désormais d'une lutte familière pour l'accès et la préséance. La question est de savoir si [GetAscendingAdvisorName] a suffisamment impressionné la reine pour gagner une véritable place dans le Cercle intérieur de la Reine."
 ENG_inner_circle.01.a: "Remplacer [ENGGetAscendedAdvisorName1]"
 ENG_inner_circle.01.b: "Remplacer [ENGGetAscendedAdvisorName2]"
 ENG_inner_circle.01.c: "Remplacer [ENGGetAscendedAdvisorName3]"
 ENG_inner_circle.01.d: "[GetAscendingAdvisorName] n'en est pas digne."
 ENG_inner_circle_charles.03.t: "La visite Harmonie du Prince"
 ENG_inner_circle_charles.03.desc: "Le prince de Galles est arrivé en visite, mêlant diplomatie de cour et message clair sur la gérance environnementale. Les réunions avec des responsables seniors et des dirigeants de la société civile ont porté sur le rétablissement de la confiance, l'élargissement d'une coopération pratique, et le cadrage de la résilience climatique comme intérêt stratégique partagé plutôt que simple élément de langage."
 ENG_inner_circle_charles.03.a: "Que l'harmonie guide nos relations."
 ENG_inner_circle_charles.04.t: "Le prince Charles défend la protection de la forêt tropicale"
 ENG_inner_circle_charles.04.desc: "Nous avons été informés que Son Altesse royale le prince Charles, prince de Galles, a appelé à une action mondiale accrue pour protéger les forêts tropicales. Fondateur du Prince's Rainforests Project, il a usé de son influence pour travailler avec gouvernements, entreprises et société civile afin de souligner l'importance d'arrêter la déforestation et de préserver ces écosystèmes critiques pour la stabilité climatique et la biodiversité."
 ENG_inner_circle_charles.04.a: "Nous saluons le prince Charles pour la protection des forêts tropicales"
 ENG_inner_circle_charles.05.t: "La diplomatie environnementale du prince Charles"
 ENG_inner_circle_charles.05.desc: "Nous avons appris que Son Altesse royale le prince Charles, prince de Galles, a achevé une tournée de diplomatie environnementale dans notre pays, plaidant pour la coopération sur le climat, la durabilité et la résilience écologique. Voix parmi les plus anciennes de l'action environnementale depuis des décennies, le prince a souligné le besoin d'efforts collectifs entre nations et secteurs pour relever les défis environnementaux mondiaux et promouvoir des solutions durables."
 ENG_inner_circle_charles.05.a: "Soutenir la durabilité."
 ENG_inner_circle_charles.06.t: "Le prince Charles promeut l'agriculture biologique"
 ENG_inner_circle_charles.06.desc: "Nous avons appris que Son Altesse royale le prince Charles, prince de Galles, a pris des mesures concrètes pour soutenir le développement de l'agriculture biologique et durable dans notre nation. S'appuyant sur des décennies de travail pionnier sur les méthodes biologiques à Highgrove et Duchy Home Farm, il a insisté sur les bénéfices environnementaux et sociaux des pratiques biologiques et encouragé la coopération sur la durabilité agricole."
 ENG_inner_circle_charles.06.a: "Soutenez l’agriculture durable."
 ENG_inner_circle_andrew.04.t: "Le prince Andrew en mission commerciale"
 ENG_inner_circle_andrew.04.desc: "Son Altesse royale le prince Andrew, agissant comme représentant commercial du Royaume-Uni, a visité notre nation pour promouvoir des liens commerciaux plus forts et la coopération économique. Durant sa mission, il a rencontré des responsables gouvernementaux, des chefs d'entreprise et des investisseurs potentiels pour souligner les opportunités de commerce et d'investissement bénéfiques à notre économie comme à celle du Royaume-Uni."
 ENG_inner_circle_andrew.04.a: "Bienvenue"
 ENG_inner_circle_andrew.05.t: "Accord commercial conclu"
 ENG_inner_circle_andrew.05.desc: "Nous avons le plaisir de rapporter qu'à la suite de discussions et négociations récentes menées par Son Altesse royale le prince Andrew, duc d'York, un nouvel accord commercial a été conclu entre notre nation et le Royaume-Uni. L'accord ouvre des voies à un échange commercial accru, à la coopération sur des industries clés et à un bénéfice économique mutuel, reflétant des intérêts partagés et des liens renforcés entre nos économies."
 ENG_inner_circle_andrew.05.a: "Accepter le partenariat."
 ENG_military.045.t: "Demande britannique de partenariat stratégique"
 ENG_military.045.d: "Le Royaume-Uni, dirigé par un monarque constitutionnel et engagé dans la coopération occidentale, a officiellement demandé le statut d'allié majeur non membre de l'OTAN. L'accorder renforcerait les relations transatlantiques et sécuriserait un partenaire clé en Europe."
 ENG_military.045.a: "Approuver leur demande, un allié précieux."
 ENG_military.045.b: "Refuser, nous devons rester prudents avec de telles désignations."
 ENG_integrate_ireland: "Intégrer [IRE.GetFlag] Irlande"
 ENG_integrate_ireland_desc: "Après des décennies, nous avons enfin soumis et intégré les terres d'Irlande ; il est temps de formaliser le processus d'intégration."
 ENG_a_more_united_kingdom_decisions: "Unir le Royaume"
 ENG_a_more_united_kingdom_decisions_desc: "Après le déclin progressif de l'Empire britannique et la décolonisation durant la guerre froide, notre royaume a connu un recul constant. Par des moyens diplomatiques et une croissance hégémonique, nous pourrons réunifier notre royaume.\n\nSurvolez le texte coloré pour plus d'informations."
 ENG_core_objectives_text: "Objectifs fondamentaux"
 ENG_econ_hegemony_text: "Hégémonie économique"
 ENG_military_hegemony_text: "Hégémonie militaire"
 ENG_political_hegemony_text: "Hégémonie politique"
 ENG_declare_economic_hegemony: "Déclarer l'hégémonie économique"
 ENG_declare_economic_hegemony_desc: "L'heure est venue de nous déclarer hégémon économique du Commonwealth."
 ENG_declare_military_hegemony: "Déclarer l'hégémonie militaire"
 ENG_declare_military_hegemony_desc: "L'heure est venue de nous déclarer hégémon militaire du Commonwealth."
 ENG_declare_political_hegemony: "Déclarer l'hégémonie politique"
 ENG_declare_political_hegemony_desc: "L'heure est venue de nous déclarer hégémon politique du Commonwealth."
 ENG_fractured_kingdom_united_state_decisions: "L'ère suivante"
 ENG_fractured_kingdom_united_state_decisions_desc: "Avec l'avènement d'un nouveau régime en [ENG.GetFlag] Grande-Bretagne, nous pourrons enfin étendre notre influence vers l'extérieur, rapidement, vivement et agressivement.\n\nNous pourrons établir une organisation de SMP sous notre commandement pour semer le chaos dans le monde."
 ENG_grant_land_in_isle_of_man: "Transformer l'île de Man"
 ENG_grant_land_in_isle_of_man_desc: "Malgré son importance historique, l'île de Man nous sert aujourd'hui à bien peu de chose hors de l'extraction de ressources. Toutefois, si nous concédons cette terre à notre nouvelle organisation de SMP, elle pourra pleinement libérer son potentiel et s'en servir de possible base pour ses opérations."
 ENG_devolved_matters: "Questions décentralisées"
 ENG_devolved_matters_desc: "Nos États constitutifs ont poussé pour un §HÉtat plus dévolu§! afin d'obtenir une indépendance nominale ou franche. Les trois États principaux : [SCO.GetFlag] §Hl'Écosse§!, [NIR.GetFlag] §Hl'Irlande du Nord§! et [WAS.GetFlag] §Hle pays de Galles§!.\n\nSi l'état de notre nation empire, les constituants tenteront de faire passer des projets de loi réduisant leur dépendance, que nous pourrons vetoter au risque d'accroître leur agitation.\n\nDes décisions deviendront disponibles à mesure que la dévolution progressera, et davantage d'informations se trouvent dans l'interface de dévolution en bas à droite de l'écran, représentée par la pièce de puzzle.\n\nProchaine élection constitutive : [?ROOT.ENG_election_var|Y0] mois"
 ENG_appease_scotland: "Subventions ciblées pour [SCO.GetFlag] l'Écosse"
 ENG_appease_nireland: "Subventions ciblées pour [NIR.GetFlag] l'Irlande du Nord"
 ENG_appease_wales: "Subventions ciblées pour [WAS.GetFlag] le pays de Galles"
 ENG_doing_other_decision: "Prendre une autre décision"
 ENG_welsh_referendum: "Référendum d'indépendance gallois [GetYear] [WAS.GetFlag]"
 ENG_welsh_referendum_desc: "The [WAS.GetFlag] Welsh people will vote on a referendum that will determine their future as a nation, constituent, and a player in the British Isles. The campaign runs until polling day, and the result will be whatever Welsh opinion has become by the time it is counted. Westminster can spend political capital and Treasury money to move it.\n\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_release_scotland: "Approuver le référendum [SCO.GetFlag] écossais d'indépendance de [GetYear]"
 ENG_release_scotland_desc: "« Scotland Foreeeeeeever ! »\n\nPeut-être avons-nous vetoté trop hâtivement la précédente tentative de référendum ; nous pouvons revenir sur cette erreur."
 ENG_release_ireland: "Approuver le référendum [NIR.GetFlag] nord-irlandais d'indépendance de [GetYear]"
 ENG_release_ireland_desc: "Peut-être avons-nous vetoté trop hâtivement la précédente tentative de référendum ; nous pouvons revenir sur cette erreur."
 ENG_release_wales: "Approuver le référendum [WAS.GetFlag] gallois d'indépendance de [GetYear]"
 ENG_release_wales_desc: "Peut-être avons-nous vetoté trop hâtivement la précédente tentative de référendum ; nous pouvons revenir sur cette erreur."
 decisions_ENG: "Décisions du Royaume-Uni"
 decisions_ENG_desc: "Ici le gouvernement peut lancer des missions et prendre des mesures décisives pour guider le cours de la Grande-Bretagne, soutenir l'industrie, orienter la recherche, renforcer les régions et répondre aux besoins changeants de la nation."
 falkland_policy: "Politique des îles Falkland"
 denounce_status_as_the_commonwealth_of_nation_member: "§YDénoncer§! notre statut d'État membre du Commonwealth"
 denounce_status_as_the_commonwealth_of_nation_member_desc: "Coupez les liens avec le passé. Dénoncez votre appartenance au Commonwealth et tracez une voie vers une véritable souveraineté nationale. Reprenez votre destin en main. Forgez votre propre chemin. L'indépendance vous attend."
 ENG_bankers_switch_faction: "Soutenir les banquiers internationaux"
 ENG_bankers_switch_faction_desc: "Nous recomposons nos alliances internes pour favoriser la faction des banquiers internationaux, inclinant la politique vers la finance mondiale, les flux de capitaux ouverts et une économie tertiaire."
 ENG_scottish_parliament: "[SCO.GetFlag] Parlement écossais"
 ENG_scottish_parliament_desc: "Les membres du Parlement [SCO.GetFlag] écossais n'ont pas toujours été, et ne seront pas toujours, loyaux à Londres. Il y aura des parlementaires §Hpro-indépendance§! qui se battront pour la création d'une [SCO.GetFlag] Écosse autonome ou indépendante.\n\nSi les parlementaires §Hpro-indépendance§! tiennent la majorité, ils commenceront à faire passer des projets de loi pour plus d'autonomie que nous pourrons approuver ou vetoter. Si nous acceptons constamment leurs demandes, nous aurons un État constitutif [SCO.GetFlag] écossais amical et loyal. Mais si nous les refusons de façon répétée, leur §Hagitation§! pourra aboutir à une situation très confuse. Si l'§Hagitation écossaise§! [SCO.GetFlag] atteint §H100§!, ils exigeront l'indépendance.\n\n§HSièges pro-indépendance§! : [?ENG_scottish_nationalists]/129\n\n[SCO.GetFlag] §HAgitation écossaise§! : [?ENG_scottish_agitation]"
 ENG_invest_northern_ireland_mission: "Investir le rendement de la construction en Irlande du Nord"
 ENG_ireland_border_cooperation: "Traité de coopération frontalière irlandaise"
 ENG_clydach_nickel_decision: "Moderniser la raffinerie de nickel de Clydach"
 ENG_clydach_nickel_decision_desc: "Nous modernisons la raffinerie de nickel de Clydach dans le sud du pays de Galles, élargissant la capacité pour les métaux de batteries et les alliages de haute qualité afin de renforcer notre approvisionnement en minerais critiques."
 ENG_alloys_modernisation: "Moderniser la production d'alliages"
 ENG_alloys_modernisation_desc: "Nous investissons dans de nouveaux hauts fourneaux et lignes de laminage pour alliages spécialisés, améliorant la qualité et le débit, des turbines et plaques de blindage aux composants haute performance."
 ENG_ellesmere_port_decision: "Usine d'aimants de terres rares d'Ellesmere Port"
 ENG_ellesmere_port_decision_desc: "Nous élargissons le traitement des terres rares à Ellesmere Port, produisant des aimants de haute qualité pour éoliennes, véhicules électriques et systèmes de défense avancés."
 ENG_shetland_hydrocarbon_decision: "Poussée des hydrocarbures à l'ouest des Shetland"
 ENG_shetland_hydrocarbon_decision_desc: "Nous accélérons le développement des champs de pétrole et de gaz à l'ouest des Shetland, tapant des réserves en eaux profondes pour renforcer les hydrocarbures nationaux et la sécurité énergétique."
 ENG_rosebank_field_decision: "Développer le champ pétrolier de Rosebank"
 ENG_rosebank_field_decision_desc: "Nous donnons le feu vert au développement complet du champ pétrolier et gazier de Rosebank, mettant en service de nouvelles plateformes offshore et des oléoducs pour renforcer nos approvisionnements énergétiques de long terme."
 ENG_cambo_offshore_decision: "Développer le champ offshore de Cambo"
 ENG_cambo_offshore_decision_desc: "Nous poursuivons le projet offshore de Cambo, ajoutant de nouveaux puits et liaisons sous-marines pour mettre en production ses réserves de pétrole et de gaz."
 ENG_hornsea_wind_farm_decision: "Agrandir le parc éolien de Hornsea"
 ENG_hornsea_wind_farm_decision_desc: "Nous soutenons d'autres phases de la zone éolienne offshore de Hornsea en mer du Nord, ajoutant des turbines et des liaisons au réseau pour livrer davantage d'électricité propre depuis le plus grand parc éolien du monde."
 ENG_drakeland_tungsten_decision: "Rouvrir la mine de tungstène de Drakelands"
 ENG_drakeland_tungsten_decision_desc: "Nous relançons la mine de Drakelands près de Plymouth, remettant en production l'étain et le tungstène pour renforcer l'approvisionnement britannique en métaux technologiques critiques."
 ENG_south_crofty_tin_decision: "Rouvrir la mine d’étain South Crofty"
 ENG_south_crofty_tin_decision_desc: "Nous finançons la réouverture de South Crofty en Cornouailles, relançant l'extraction profonde d'étain et ajoutant une source nationale régulière de minerai de haute qualité pour notre industrie."
 ENG_scottish_industry_mission: "Une aubaine pour l’industrie écossaise"
 ENG_scottish_industry_mission_desc: "Nos investissements dans l'acier et l'industrie lourde écossais pourront débloquer de nouveaux filons, contrats et projets connexes. Il y a de bonnes chances que l'activité renouvelée dans les usines et chantiers révèle des ressources supplémentaires que nous pourrons mettre en production."
 ENG_celsa_steel_mission: "Examen de la production d'acier Celsa"
 ENG_celsa_steel_mission_desc: "Chaque année, nous examinons l'aciérie Celsa de Cardiff pour voir si de nouvelles commandes, des gains d'efficacité ou des flux de ferraille peuvent justifier une nouvelle hausse de la production d'acier."
 ENG_roysth_naval_port_decision: "Agrandir le port naval de Rosyth"
 ENG_roysth_naval_port_decision_desc: "Nous élargissons les docks et les installations de soutien à Rosyth, faisant de l'estuaire du Forth une base plus solide pour le carénage, le soutien et la construction future de navires de guerre."
 ENG_expand_belfast_decision: "Étendre la zone industrielle de Belfast"
 ENG_expand_belfast_decision_desc: "Nous dégageons et viabilisons de nouvelles parcelles autour des docks et des faubourgs de Belfast, ouvrant un espace supplémentaire pour usines, chantiers et bureaux à travers l'Irlande du Nord."
 ENG_highland_main_line_decision: "Moderniser la Highland Main Line"
 ENG_highland_main_line_decision_desc: "Nous modernisons la Highland Main Line entre Perth et Inverness, réduisant les temps de trajet et donnant aux villes le long de la ligne un coup de pouce bienvenu en connectivité et productivité."
 ENG_titanic_quarter_decision: "Développer le Titanic Quarter"
 ENG_titanic_quarter_decision_desc: "Nous reconvertissons les anciennes terres de chantier naval de Belfast en Titanic Quarter, mêlant bureaux, studios et industrie riveraine pour insuffler une nouvelle vie à l'ancien site Harland & Wolff."
 ENG_productivity_gap_mission: "Perte de productivité"
 ENG_hs2_mission: "Construction de High Speed 2"
 ENG_northen_powerhouse_mission: "Construction de Northern Powerhouse Rail"
 ENG_build_london: "Développer le Grand Londres"
 ENG_build_london_desc: "Nous avons promis à nos constituants du Grand Londres que des rénovations arrivaient. Et à ce titre, nous devons tenir cette promesse."
 ENG_promise_labour: "Promesse aux syndicats"
 ENG_promise_labour_desc: "Nous avons fait une promesse aux syndicats, et nous devons agir en conséquence."
 ENG_promise_military: "Promesse au complexe militaro-industriel"
 ENG_promise_military_desc: "Nous avons fait une promesse au complexe militaro-industriel, et nous devons agir en conséquence."
 ENG_promise_fossil_fuel: "Promesse aux industries des combustibles fossiles"
 ENG_promise_fossil_fuel_desc: "Nous avons fait une promesse aux industries des combustibles fossiles, et nous devons agir en conséquence."
 ENG_monarchy_decision_category: "Maison de Windsor"
 ENG_monarchy_decision_category_desc: "La maison de Windsor règne depuis 1917, portant la monarchie moderne à travers la guerre, le changement social et les pressions d'un siècle nouveau. Elle se tient au centre de la vie publique britannique, une dynastie tissée dans le cérémonial, le service et les routines discrètes qui tiennent le royaume. Ses membres exercent une influence par le mécénat, les visites et une intervention discrète, atteignant les œuvres, la diplomatie et les forces armées d'une manière que la seule politique ne peut. Ici s'affichent les entreprises de la famille royale, montrant quelles initiatives chaque royal peut poursuivre et ce que sa présence peut mettre en mouvement."
 ENG_monarchy: "Maison de Windsor"
 ENG_charles_youth_sustainability_decision: "Autonomiser la jeunesse pour la durabilité"
 ENG_charles_youth_sustainability_decision_desc: "Son Altesse royale le prince Charles lancera un programme pour aider les jeunes à mener des initiatives durables et favorables au climat. S'appuyant sur des décennies de travail avec des œuvres de jeunesse et des causes environnementales, le prince de Galles promouvra l'éducation, le développement des compétences et l'entreprise alignés sur la résilience écologique. Ce programme reconnaît le rôle vital des générations plus jeunes pour bâtir un avenir plus durable."
 ENG_charles_sustainable_urban_planning_decision: "Promouvoir une planification urbaine durable"
 ENG_charles_sustainable_urban_planning_decision_desc: "Son Altesse royale le prince Charles défendra un urbanisme et un aménagement communautaires durables, fondés sur des principes de conception holistique privilégiant les personnes, l'environnement et la résilience de long terme. S'appuyant sur son plaidoyer de longue date pour des communautés respectueuses du climat et du contexte culturel, ce programme promouvra des approches traditionnelles et écologiquement sensibles de l'architecture, des infrastructures et de l'usage des terres."
 ENG_charles_organic_agriculture_decision: "Défendre l'agriculture biologique et durable"
 ENG_charles_organic_agriculture_decision_desc: "Son Altesse royale le prince Charles usera de son influence pour défendre les méthodes agricoles biologiques et durables dans les communautés rurales comme mondiales. S'appuyant sur des décennies d'engagement envers la gérance écologique et l'agriculture régénératrice, le prince promouvra des pratiques qui renforcent la santé des sols, soutiennent les fermes familiales et réduisent l'impact environnemental."
 ENG_charles_environmental_diplomacy_tour_decision: "Tournée de diplomatie environnementale"
 ENG_charles_environmental_diplomacy_tour_decision_desc: "Son Altesse royale le prince Charles entreprendra une tournée internationale de diplomatie environnementale pour promouvoir la coopération sur la durabilité et les initiatives climatiques. Tout au long de ses décennies de service comme prince de Galles, il a visité de nombreuses nations et dialogué avec dirigeants et communautés pour encourager l'action sur le changement climatique, la protection des forêts tropicales et le développement durable. Cette tournée visera à renforcer les partenariats mondiaux et à mettre en lumière des engagements partagés à sauvegarder le monde naturel."
 ENG_charles_rainforest_help_decision: "Soutenir la protection mondiale des forêts tropicales"
 ENG_charles_rainforest_help_decision_desc: "Son Altesse royale le prince Charles dirigera un programme pour promouvoir une action mondiale contre la destruction des forêts tropicales. Fondateur du Prince's Rainforests Project, il travaillera avec gouvernements, organisations et société civile pour souligner l'importance de préserver les forêts tropicales et leur rôle dans la lutte contre le changement climatique."
 ENG_charles_charities_network_decision: "Activer le réseau des œuvres du Prince"
 ENG_charles_charities_network_decision_desc: "Son Altesse royale le prince Charles activera son vaste réseau d'organisations caritatives pour soutenir des causes sociales, éducatives et environnementales au pays et à l'étranger. Président de The Prince's Charities, un groupe d'organisations fondées ou patronnées par le prince de Galles, il s'appuiera sur leur expertise collective pour bâtir des communautés durables, promouvoir l'opportunité et améliorer le bien-être dans plusieurs régions."
 ENG_charles_harmony_tour_decision: "Entreprendre une tournée diplomatique Harmony"
 ENG_charles_harmony_tour_decision_desc: "Son Altesse royale le prince Charles entreprendra une tournée internationale pour promouvoir sa philosophie de l'Harmonie et encourager la coopération sur les questions environnementales et de durabilité. Tout au long de ses décennies de service comme prince de Galles, il a constamment usé de son influence pour souligner le besoin d'action climatique, de protection des forêts tropicales et de développement durable, et cette tournée visera à renforcer les partenariats mondiaux autour de ces objectifs partagés."
 ENG_andrew_naval_haritage_decision: "Adoptez le patrimoine naval"
 ENG_andrew_naval_haritage_decision_desc: "Le prince Andrew s'appuiera sur sa longue carrière navale pour mettre en lumière les traditions maritimes et le service de sa nation. Ayant servi comme pilote d'hélicoptère, instructeur et commandant de la Royal Navy, avec un service actif durant le conflit des Malouines, il encouragera le respect de l'héritage naval et favorisera la coopération avec les flottes alliées et les institutions de formation maritime du monde entier."
 ENG_andrew_trade_representive_decision: "Mission du représentant commercial"
 ENG_andrew_trade_representive_decision_desc: "Le prince Andrew entreprendra une mission de représentant commercial pour promouvoir les intérêts commerciaux britanniques à l'étranger. S'appuyant sur son expérience de représentant spécial du Royaume-Uni pour le commerce et l'investissement internationaux, il dialoguera avec gouvernements étrangers, chefs d'entreprise et investisseurs pour souligner les opportunités d'exportations britanniques et d'investissements entrants, renforçant les liens économiques et favorisant la coopération commerciale."
 ENG_andrew_emerging_trade_agreement_decision: "Poursuivre des accords commerciaux émergents"
 ENG_andrew_emerging_trade_agreement_decision_desc: "Le prince Andrew dirigera les efforts pour conclure des accords commerciaux et des partenariats d'affaires sur les marchés mondiaux émergents. S'appuyant sur sa vaste expérience de représentation des intérêts commerciaux britanniques à l'étranger, il cherchera à ouvrir des opportunités d'exportations, de partenariats et d'investissements avec des économies en développement à fort potentiel de croissance et de coopération futures."
 ENG_andrew_emerging_economy_benefits_decision: "Tirer parti des partenariats avec les économies émergentes"
 ENG_andrew_emerging_economy_benefits_decision_desc: "Le prince Andrew se concentrera sur le renforcement des partenariats avec les économies émergentes pour élargir les opportunités de commerce, d'investissement et de croissance économique partagée. S'appuyant sur sa vaste expérience de promotion des intérêts commerciaux britanniques dans le monde, cette initiative vise à attirer l'investissement et l'expertise de marchés en développement rapide, à booster la productivité nationale et à favoriser un environnement d'affaires plus dynamique."
 ENG_andrew_digital_enterprise_decision: "Initiative pour l'entreprise numérique"
 ENG_andrew_digital_enterprise_decision_desc: "Le prince Andrew lancera une initiative d'entreprise numérique pour promouvoir les compétences numériques et l'entrepreneuriat dans tout le pays. S'appuyant sur son travail avec des prix d'entreprise numérique qui ont aidé les gens à développer des compétences en ligne, techniques et commerciales, ce programme vise à soutenir les innovateurs numériques en herbe, à encourager la culture technologique et à bâtir une base plus solide pour l'économie numérique."
 ENG_anne_national_charity_decision: "Œuvres nationales de la princesse royale"
 ENG_anne_national_charity_decision_desc: "La princesse royale élargira et coordonnera ses patronages nationaux pour pousser des résultats concrets plutôt que des occasions de photo. Collectes de fonds, mobilisation de bénévoles et attention publique seront dirigées là où les capacités se brisent."
 ENG_anne_carers_promotion_decision: "Campagne de reconnaissance des soignants"
 ENG_anne_carers_promotion_decision_desc: "Anne placera les aidants non rémunérés au centre de l'attention nationale, pressant les institutions de traiter le soin comme un service essentiel plutôt qu'un fardeau privé. La campagne élève le soutien de répit, la flexibilité au travail et le respect public par le patronage royal et une visibilité implacable."
 ENG_anne_military_readiness_decision: "Normes de préparation"
 ENG_anne_military_readiness_decision_desc: "La princesse royale usera de ses nominations militaires pour exiger le professionnalisme, la discipline d'entraînement et les routines sans éclat qui maintiennent les unités déployables. Inspections, exercices et suivi logistique seront poussés comme mesure du sérieux."
 ENG_anne_navy_readiness_decision: "Inspections de préparation de la flotte"
 ENG_anne_navy_readiness_decision_desc: "La Royal Navy sera pressée de prouver qu'elle peut appareiller, combattre et se soutenir sous pression. La présence d'Anne impose des normes : maintenance, compétence des équipages et tempo opérationnel seront traités comme non négociables."
 ENG_anne_tourism_decision: "Une poussée touristique royale"
 ENG_anne_tourism_decision_desc: "La réputation de la Grande-Bretagne est un atout, et la princesse royale le dépensera avec dessein. Une poussée touristique ciblée mettra en lumière le patrimoine, les événements et les économies locales qui ont besoin de demande, transformant les engagements royaux en réservations et en investissements."
 ENG_edward_beach_youth_decision: "Sensibilisation des jeunes côtiers"
 ENG_edward_beach_youth_decision_desc: "Le comte de Wessex portera le travail de jeunesse de la Couronne jusqu'au littoral, usant de visites, de programmes de distinctions et de partenariats locaux pour attirer les jeunes vers les compétences et le service. Le message est pratique : confiance, discipline et une voie à suivre. "
 ENG_edward_global_youth_decision: "Engagement mondial des jeunes"
 ENG_edward_global_youth_decision_desc: "Edward étendra l'engagement de jeunesse au-delà de la Grande-Bretagne, renforçant les liens par des échanges, des formations et des projets civiques partagés avec des partenaires à l'étranger."
 ENG_edward_arts_culture_patronage_decision: "Patronage des arts et de la culture"
 ENG_edward_arts_culture_patronage_decision_desc: "La Couronne défendra le secteur des arts et de la culture britanniques comme identité et influence stratégique. Le patronage royal relèvera la visibilité, débloquera des financements et protégera les institutions qui façonnent le récit national au pays et à l'étranger."
 ENG_edward_production_guild_decision: "Soutenir les guildes de production"
 ENG_edward_production_guild_decision_desc: "Les guildes britanniques et les métiers de production qualifiés sont l'épine dorsale de la qualité et de la force à l'export. Edward soutiendra les guildes de production par la reconnaissance, des liens de formation et une coordination industrielle qui maintient les métiers en vie et les filières ouvertes. "
 ENG_edward_veteran_support_decision: "Soutien aux vétérans du Wessex"
 ENG_edward_veteran_support_decision_desc: "Le service ne s'arrête pas à la libération, et la Couronne ne traitera pas les anciens combattants comme une arrière-pensée. Le comte de Wessex coordonnera œuvres, employeurs et autorités locales pour améliorer le soutien à la transition, la stabilité du logement et les parcours d'emploi. "
 ENG_philip_award_medal_decision: "Remettre la médaille du prince Philip"
 ENG_philip_award_medal_decision_desc: "Le prince Philip entreprendra sa propre mission pour remettre la médaille du prince Philip à un ingénieur de premier plan d'un impact mondial exceptionnel. Cette distinction reconnaît une réalisation exceptionnelle dans la pratique et l'innovation de l'ingénierie sous son patronage personnel."
 ENG_philip_award_expansion_decision: "Élargir les distinctions de jeunesse du Duc"
 ENG_philip_award_expansion_decision_desc: "Le prince Philip se déplacera pour lancer un élargissement du Duke of Edinburgh's Award, visant à ouvrir ce programme de jeunesse à un public international plus large. Ses efforts cherchent à renforcer la résilience des jeunes et les compétences civiques dans de nombreuses nations."
 ENG_philip_trust_funds_grants_decision: "Activer les subventions du Prince Philip Trust"
 ENG_philip_trust_funds_grants_decision_desc: "Le prince Philip supervisera personnellement le versement de subventions du Prince Philip Trust Fund à des projets communautaires et éducatifs locaux. Son implication directe assure le soutien d'initiatives qui améliorent les loisirs, l'apprentissage et la vie civique."
 ENG_philip_faith_conservation_decision: "Lancer l'initiative Foi et conservation"
 ENG_philip_faith_conservation_decision_desc: "Le prince Philip entreprendra un programme pour unir communautés religieuses et groupes environnementaux pour une gérance conjointe de la nature. Il vise à mobiliser les ressources morales et communautaires derrière des objectifs de conservation durables."
 ENG_philip_innovation_recognition_decision: "Instituer une reconnaissance nationale de l'innovation"
 ENG_philip_innovation_recognition_decision_desc: "Le prince Philip lancera un dispositif national pour récompenser le design industriel, la science et la résolution pratique de problèmes exceptionnels. Son initiative met en lumière l'ingéniosité comme pilier de la croissance économique et du succès national."
 ENG_william_air_ambulance_decision: "Effectuer un quart de travail en ambulance aérienne"
 ENG_william_air_ambulance_decision_desc: "Le prince William part pour une nouvelle vacation d'ambulance aérienne, volant des missions d'urgence et rencontrant les équipages au sol."
 ENG_william_mental_health_at_work_decision: "Santé mentale au travail"
 ENG_william_mental_health_at_work_decision_desc: "Le prince William se met en route pour rassembler employeurs et œuvres derrière une poussée de santé mentale au travail."
 ENG_william_step_into_health_decision: "Campagne Entrez dans la santé"
 ENG_william_step_into_health_decision_desc: "Le prince William part sur les routes pour soutenir Step into Health et ouvrir des parcours NHS aux anciens combattants et aux familles de militaires."
 ENG_william_early_years_forum_decision: "Convoquer le forum Petite enfance"
 ENG_william_early_years_forum_decision_desc: "Le prince William convoque un forum Petite enfance pour réunir experts, œuvres et entreprises dans la même pièce."
 ENG_william_chogm_youth_decision: "Message des jeunes du CHOGM"
 ENG_william_chogm_youth_decision_desc: "Le prince William assiste à une session jeunesse du sommet des chefs de gouvernement du Commonwealth (CHOGM) pour signaler que la génération suivante compte pour l'avenir du Commonwealth."
 ENG_seize_sierra_leone_resources: "Exploiter [SIE.GetFlag] Sierra Leone"
 ENG_seize_sierra_leone_resources_desc: "Il est temps de tirer quelque chose de l'opération Barras. Nous saisirons des ressources vitales en Sierra Leone et établirons une influence économique pour une période de 500 jours."
 ENG_war_for_delta: "Guerre pour le Delta"
 ENG_war_for_delta_desc: "Nous avons peut-être un peu trop poussé les Nigérians, permettant à leur ego d'étouffer toute crainte d'affronter nos forces. Quoi qu'il en soit, il nous faudra prendre leur capitale pour leur montrer qui mène vraiment la danse ici."
 ENG_end_of_the_world: "Conquérir le bout du monde"
 ENG_end_of_the_world_desc: "La Terre de Feu, aussi surnommée « le bout du monde », est un archipel important et la porte de l'Antarctique. Prendre cet emplacement vital pourrait avoir d'énormes bénéfices pour la nation dans son ensemble, au point que nous sommes prêts à nous battre pour lui."
 ENG_operation_eastern_divide: "Opération Eastern Divide"
 ENG_operation_eastern_divide_desc: "Les Égyptiens n'ont pas satisfait nos appels à un accès juste et égal par Suez, et par conséquent il ne nous reste plus d'autre choix que de recourir à l'action militaire."
 ENG_a_more_united_kingdom: "Un Royaume-Uni plus"
 ENG_a_more_united_kingdom_desc: "Si notre État est uni tel qu'il se présente, des parties de notre royaume se sont fracturées et sont devenues des États indépendants. Pour être véritablement un Royaume-Uni, nous devons réunifier les États du Commonwealth de tous les coins du monde."
 ENG_fractured_kingdom_united_state: "Royaume fracturé, États-Unis"
 ENG_fractured_kingdom_united_state_desc: "§R« Citoyen, pas sujet »§!\nTandis que la monarchie et le régime précédent s'effaçaient dans l'oubli, l'État n'a fait que se renforcer. L'heure est venue d'adopter une posture plus assertive et dominante sur la scène mondiale et de enfin punir ceux qui ont pillé cette terre pendant des siècles."
 ENG_deeper_commonwealth_integration: "Intégration plus approfondie du Commonwealth"
 ENG_deeper_commonwealth_integration_desc: "Pour devenir un État véritablement uni, nous devrons d'abord convaincre ceux que nous souhaitons intégrer que nous sommes un hôte convenable. Ce n'est qu'alors que nous pourrons franchir les étapes suivantes."
 ENG_sovereignty_above_all: "La souveraineté avant tout"
 ENG_sovereignty_above_all_desc: "Rien n'importe davantage que la capacité de nos administrateurs à déterminer l'avenir de notre peuple. Aucun autre État que le nôtre ne devrait avoir son mot à dire sur la façon dont nous gérons les choses."
 ENG_establishing_new_leadership: "Établir le nouveau régime"
 ENG_establishing_new_leadership_desc: "Avant de pouvoir nous mettre au travail, il nous faudra établir un nouveau régime. Un déracinement sociétal sera requis, et nous devons commencer à planifier une nouvelle autorité transitoire pour prendre en charge des parties du pays afin de lisser le processus."
 ENG_two_way_concessions: "Concessions bidirectionnelles"
 ENG_two_way_concessions_desc: "Nous ne pouvons pas attendre de progrès vers un accord sur la dévolution si un seul camp fait un effort. Nous ferons quelques concessions et attendrons aussi que l'autre camp en Écosse fasse de même."
 ENG_uniting_the_isle: "Unir l'île"
 ENG_uniting_the_isle_desc: "Les Irlandais sont la cause d'une grande partie de nos problèmes, de l'attisement des tensions aux partis politiques qui appellent au séparatisme nord-irlandais. Il est grand temps d'intervenir et de leur donner une leçon."
 ENG_revolution_not_devolution: "La révolution, pas la dévolution"
 ENG_revolution_not_devolution_desc: "Pour un État réellement uni, il faut d'abord détruire la cause de la dévolution. Nous avons besoin d'une révolution nationale, pas de la dévolution !"
 ENG_bring_in_canada: "Faire entrer le Canada"
 ENG_bring_in_canada_desc: "Nous devons tendre la main au Canada, le plus vaste membre du Commonwealth. Nos amis canadiens ont su rester proches au fil du temps : les embarquer ne devrait pas être trop difficile."
 ENG_the_realm_of_britain: "Le Royaume de Bretagne"
 ENG_the_realm_of_britain_desc: "Le Royaume de Bretagne est une chose que l'on ne peut briser, l'esprit du peuple britannique persévérant dans les épreuves les plus rudes."
 ENG_glory_of_pax_britannica: "La gloire de la Pax Britannica"
 ENG_glory_of_pax_britannica_desc: "Notre passé est glorieux, et certains disent qu'il n'est pas réellement révolu, mais plutôt le présage de ce qui vient. Il nous faut réaliser les rêves de nos aïeux et restaurer la gloire de la Pax Britannica !"
 ENG_australian_outreach: "Sensibilisation australienne"
 ENG_australian_outreach_desc: "Nous ne saurions oublier les sacrifices que les Australiens ont faits tout au long de l'histoire pour notre cause. Il est donc impératif de les inviter à nous rejoindre dans l'avenir qui s'ouvre."
 ENG_new_zealands_offer: "Offre néo-zélandaise"
 ENG_new_zealands_offer_desc: "Le peuple kiwi est depuis toujours un allié indéfectible, et dans le bon comme dans le mauvais il est resté à nos côtés. Il n'est que juste de leur demander de nous rejoindre."
 ENG_fracture_nato_unity: "Fracturer l’unité de l’OTAN"
 ENG_fracture_nato_unity_desc: "S'il est vrai que nous avons longtemps bénéficié de la sécurité de l'OTAN, ce n'est plus le cas. Nos anciens amis ne cherchent plus qu'à diviser et fracturer notre État, et notre peuple doit en être informé."
 ENG_end_eastern_suffering: "Mettre fin aux souffrances orientales"
 ENG_end_eastern_suffering_desc: "Le pitoyable amas d'États d'Europe de l'Est mené par la Russie s'enfonce dans un déclin lent et terrible. Mieux vaut intervenir et y instaurer une véritable prospérité et l'ordre."
 ENG_declare_the_commonwealth: "Proclamer le Commonwealth"
 ENG_declare_the_commonwealth_desc: "Maintenant que toutes les terres (les importantes, du moins) du Commonwealth nous ont rejoints sous une même bannière, il convient d'annoncer au monde que la Fédération du Commonwealth est là, et qu'elle est là pour rester."
 ENG_active_resource_project: "§YProjet de minéraux critiques en cours§!"
 ENG_active_productivity_project: "§YProjet national de productivité actif§!"
 ENG_ucl_east_campus: "Campus Est de l'UCL"
 ENG_mechanic_menu_explanation: "Décentralisation"
 ENG_devolution_HEADER_TITTLE_LOC: "Questions décentralisées"
 ENG_mechanic_menu_explanation_2: "La dévolution nous permet de remettre une part du pouvoir entre les mains de nos entités. Nous les gérons en cliquant sur leur État. Chaque entité dispose d'un §CParlement§!, d'un niveau d'§RAgitation§! et d'un niveau de §GDépendance§!. Survolez le bouton §Ginfo§! pour une explication détaillée."
 ENG_parliament_gui_tooltip: "Chaque entité aura son propre parlement. Selon l'agitation de chacune, le peuple sera plus ou moins enclin à élire un parlementaire pro-indépendance. Une fois un parlementaire pro-indépendance en fonction, il sera toutefois très difficile de le faire battre. Si les parlementaires pro-indépendance deviennent majoritaires, ils pourront pousser des projets de loi réduisant leur dépendance et, à terme, exiger un référendum.\n\nNos sujets auront une opinion de nous, représentée par leur Agitation. Une entité peut s'agiter davantage selon notre parti politique, le nombre de lois que nous opposons ou si nous augmentons de force sa dépendance. L'agitation peut être affectée par certains événements, décisions ou focuses. Une entité qui s'appuie fortement sur Westminster se calmera d'elle-même chaque mois, tandis que celle qui n'a plus besoin de nous s'emportera progressivement.\n\nLa Dépendance mesure la capacité d'une entité à se gérer seule. Si la Dépendance est basse, elle pourra réclamer davantage de libertés, capable de se passer du Royaume. Nous pourrons baisser ou hausser cette dépendance selon les événements reçus et les focuses choisis.\n\nNationalisme, Agitation et part d'autonomie se combinent en un score de Pression indépendantiste. Dès qu'une entité a une majorité pro-indépendance et que sa pression dépasse §R60§!, une campagne référendaire commence. Nous avons alors un an pour ramener cette pression sous §G50§! avant que le référendum ne soit réellement convoqué. Une seule entité peut mener une campagne à la fois, et aucune autre ne pourra suivre pendant cinq ans.\n\nLa Tension nord-irlandaise représente la tension entre protestants unionistes et catholiques républicains. Nos décisions peuvent l'attiser : à 50 %, des heurts violents occasionnels surviennent. Si elle continue de croître au-delà de 50 %, le rythme de ces heurts s'accélérera."
 ENG_dependency_gui_tooltip2: "La Dépendance mesure la capacité d'une entité à se gérer seule. Si la Dépendance est basse, elle pourra réclamer davantage de libertés, capable de se passer du Royaume. Nous pourrons baisser ou hausser cette dépendance selon les événements reçus et les focuses choisis."
 ENG_parliament_gui_tooltip2: "Chaque entité aura son propre parlement. Selon l'agitation de chacune, le peuple sera plus ou moins enclin à élire un parlementaire pro-indépendance. Une fois un parlementaire pro-indépendance en fonction, il sera toutefois très difficile de le faire battre. Si les parlementaires pro-indépendance deviennent majoritaires, ils pourront pousser des projets de loi réduisant leur dépendance et, à terme, exiger un référendum."
 ENG_agitation_gui_tooltip2: "Nos sujets auront une opinion de nous, représentée par leur Agitation. Une entité peut s'agiter davantage selon notre parti politique, le nombre de lois que nous opposons ou si nous augmentons de force sa dépendance. L'agitation peut être affectée par certains événements, décisions ou focuses. Une entité qui s'appuie fortement sur Westminster se calmera d'elle-même chaque mois, tandis que celle qui n'a plus besoin de nous s'emportera progressivement. L'agitation alimente le score de Pression indépendantiste qui décide si une campagne référendaire commence."
 ENG_irish_tension_tooltip: "La Tension nord-irlandaise représente la tension entre protestants unionistes et catholiques républicains. Nos décisions peuvent l'attiser : à 50 %, des heurts violents occasionnels surviennent. Si elle continue de croître au-delà de 50 %, le rythme de ces heurts s'accélérera."
