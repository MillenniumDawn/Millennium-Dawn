 ADY.socialism: "£KHM_western_social_democrat (PSZ) - 社会保障党"
 ADY.socialism_icon: "£KHM_western_social_democrat"
 ADY.socialism_desc: "（社会民主主义）- 社会保障党\n\n社会保障党是2012年政党法自由化后注册的小党之一，于2012年5月5日召开成立大会，并于6月19日获得注册。该党主张落实宪法第七条，即俄罗斯是一个社会国家，并主张将工资和养老金提高到领先工业国家的水平，而这笔资金将通过国家重新掌控经济来实现。\n\n该党在议会中几乎没有影响力，从未在任何地方获得过席位门槛，但它为那些关注福利的选民提供了一个克里姆林宫控制的政党之外的标签。该党自2019年9月起由弗拉基米尔·米哈伊洛夫领导，后因司法部提起诉讼，指控其参加的选举数量不足，最终被最高法院解散。"
