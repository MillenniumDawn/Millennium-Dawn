 CARTEL_narco_wars_triggered: "마약과의 전쟁 발생"
 cartels_equipment_theft_small_tt: "소량의 장비가 손실 될 수 있습니다."
 cartels_equipment_theft_large_tt: "많은 양의 장비를 잃어버릴 가능성이 있습니다."
 random_celebrity_death_opinion: "범죄자에게 살해당한 유명인"
 random_oligarchy_opinion: "올리가르히 자산 압류"
 random_denied_our_demands: "\"우리의 국경 통제 요구를 거부했다"
 seized_a_contraband_ship: "압류된 화물선"
 seized_a_contraband_container: "밀수품이 들어 있는 압류된 컨테이너"
 cartel_penalties: "카르텔"
 cartel_penalties_desc: "Drug violence and gang activity constitute a significant portion of this nation's criminal landscape. These powerful criminal organizations operate throughout the entire country, instilling fear in many residents who worry the situation will only deteriorate further. However, depending on our government's approach, we may be able to transform this hindrance into a strategic asset."
 has_cartels_tt: "국민정신 §Y$cartel_penalties$§!(을)를 가지고 있음\n"
 defeated_the_cartels: "카르텔의 끝"
 hard_drug_trade_restrictions: "카르텔 협력에 대한 엄격한 규제"
 light_drug_trade_restrictions: "카르텔 협력에 대한 느슨한 규제"
 narco_state_bonuses: "마약 국가"
 narco_state_bonuses_desc: "카르텔이 국가를 장악하면서 수년간의 투쟁은 천천히 끝났습니다."
 narcos_state: "마약국가"
 narcos_state_desc: "수년간의 투쟁 끝에, 마약 조직이 이제 국가기관 자체를 통제하게 되었습니다."
 cartels_decision_category: "범죄"
 cartels_decision_category_desc: "범죄 조직이 우리 사회의 모든 계층에 침투했습니다. 마피아 조직, 마약 카르텔, 폭력 갱단이 권력과 영토를 두고 무자비한 효율로 다투며 지나간 자리마다 유혈의 흔적을 남깁니다. 단호한 조치를 취하지 않으면 우리 나라는 범죄 군벌이 지배하는 실패 국가로 전락할 위험이 있습니다.\n\n§Y정치적 영향력§!은 카르텔이 우리 제도를 얼마나 깊이 부패시켰는지를 나타냅니다. 그들의 영향력이 커질수록 내부 방해 공작과 뇌물 때문에 우리의 수사가 실패할 가능성이 점점 높아집니다.\n\n§Y권력§!은 카르텔의 군사적 능력과 영토 통제력을 나타냅니다. 권력이 높을수록 우리의 급습은 더 큰 저항과 더 많은 사상자에 직면합니다.\n\n둘 중 하나라도 위험한 수준에 이르면 카르텔은 부패한 쿠데타나 직접적인 군사 대결을 통해 국가를 완전히 장악하려 시도할 수 있습니다.\n\n$political_influence_of_cartels$: [?ROOT.cartel_political_influence|1]\n$strength_of_cartels$: [?ROOT.strength_of_cartels|1]\n"
 narcos_crisis: "마약 위기"
 narcos_crisis_desc: "우리 정부의 권위는 만연한 부패와 조직범죄 활동으로 인해 심각하게 훼손되었습니다. 카르텔이 핵심 기관에 침투하여 우리의 법 집행 능력과 국가의 폭력 독점 권한이 위태로워졌습니다. 정보 보고에 따르면 우리는 곧 카르텔 연계 장교들이 주도하는 군사 쿠데타나 카르텔 자체의 조직적인 무장 봉기를 맞이할 위기에 처해 있습니다. 국가 권위의 완전한 붕괴를 막기 위해 즉각적인 조치가 필요합니다."
 mafia_crisis: "마피아 위기"
 mafia_crisis_desc: "만연한 부패와 조직범죄로 인해 우리 정부의 권위가 심각하게 훼손되었습니다. 마피아가 핵심 기관들에 침투하여 우리의 법 집행 능력과 국가의 폭력 독점권 유지 능력이 위협받고 있습니다. 정보 보고에 따르면 우리는 마피아와 결탁한 장교들이 주도하는 군사 쿠데타나 범죄 조직들의 조직적인 무장 봉기 중 하나가 일어나기 직전입니다. 국가 권위의 완전한 붕괴를 막으려면 즉각적이고 단호한 조치가 필요합니다."
 mexican_cartel_war: "멕시코 카르텔 전쟁"
 mexican_cartel_war_desc: "The ability of our government to enforce laws and monopolize force has been compromised by increasing corruption and criminal activity. Our military and political infrastructure have been completely compromised and there is no telling who can be trusted anymore. The chaos will soon reach a fever pitch and then, we will be in the midst of a new civil war."
 anti_cartel_propaganda_decision: "반카르텔 선전"
 anti_cartel_propaganda_decision_desc: "There has always been a growing myth surrounding the cartels, that they are like the banditos of the rose-tinted past. Lovable rogues that may do bad things but only do them for the good of their people. Like all myths, it is a fabrication. One that anyone living under the influence of the cartels knows to be false. By exposing the horrors inflicted by them upon their own in a nation-wide media campaign, we can work towards dispelling this myth once and for all."
 police_investments_decision: "경찰력 투자"
 police_investments_decision_desc: "카르텔과 같은 범죄 조직은 막대한 자원과 자금, 무기를 갖춘 정교한 기업체와 같습니다. 이들은 최소한의 병력이나 일반적인 치안 방식으로는 억제할 수 없습니다. 우리 경찰은 이러한 조직에 맞서는 일차 방어선이지만, 그들이 마주하는 극단적인 폭력에 대응할 자원이 부족한 경우가 많습니다. 경찰을 군사화하는 데에는 일정한 사회적 비용이 따르지만, 더 나은 장비와 고도의 전술 훈련, 충원된 인력을 갖춰 주는 것이 카르텔 활동에 맞설 효과적인 방벽을 만드는 데 필수적입니다. 이러한 전환에는 막대한 재정 투자가 필요하지만, 조직범죄에 효과적으로 대처하는 데 필요한 국가 안보의 토대를 세우려면 반드시 필요합니다."
 utilize_the_military_decisions: "군대 활용"
 utilize_the_military_decisions_desc: "우리 경찰력이 장비를 잘 갖추고 있더라도, 제한된 인력과 지역 관료주의, 그리고 잠재적 부패라는 제약에서 벗어나지 못한다. 군을 투입하면 우월한 화력과 견고한 지휘 체계, 그리고 지역 행정상의 장애물을 우회할 수 있는 폭넓은 자원을 얻을 수 있다. 또한 군의 전국적 조직 덕분에 카르텔이 활동하는 여러 지역에 걸쳐 협조된 작전을 수행할 수 있다. 그러나 이 접근법에는 상당한 단점이 따른다. 민간인들은 자신들의 지역 사회에 군이 주둔하는 것을 두려워하는 경우가 많고, 지역 경찰은 자신들의 노력이 부족하다는 암시에 반감을 품을 수 있으며, 작전 중 민간 기반 시설이 피해를 입을 수 있다. 또한 군 투입은 인권 문제 우려를 낳을 위험이 있고 정부 기관에 대한 대중의 신뢰를 약화시킬 수 있다. 전술적 이점과 대중의 지지 및 정당성을 잃을 가능성을 신중히 저울질해야 한다."
 target_cartel_money_laundering_decision: "돈 세탁 작전 목표 설정"
 target_cartel_money_laundering_decision_desc: "Cartels must launder their illicit profits to acquire legitimate assets, transforming 'dirty money' through a three-stage process: placement into the financial system, layering to obscure origins, and integration into legal holdings. These laundered funds enable them to purchase property, businesses, and influence government officials. By targeting the layering and integration phases, we can disrupt their financial infrastructure and stem corruption. This involves methodical investigation and shutdown of complicit financial institutions and shell companies. However, this strategy carries significant risk. Failed operations may provoke violent retaliation as cartels defend their cash flow, potentially intensifying their hostility toward government forces and civilians alike."
 investigate_the_casinos: "카지노 수사"
 investigate_the_casinos_desc: "카지노는 규제의 회색지대에서 운영되기 때문에 불법 자금을 세탁하기에 이상적인 진입점입니다. 높은 현금 회전율 덕분에 막대한 금액이 의심을 받지 않고 처리될 수 있으며, 익명적이면서도 합법적인 것처럼 보이기도 합니다. 우리의 전략은 알려진 카르텔 관계자들이 자주 드나드는 업소를 파악하고 그들의 금융 운영에 대해 철저한 감사를 실시하는 것입니다. 의심스러운 거래를 면밀히 추적하고 범죄 조직과의 직접적인 연결고리를 입증함으로써, 이러한 위장 업체들에 대해 빈틈없는 사건을 구성할 수 있습니다. 충분한 증거가 확보되면 합동 단속을 실시하여 이들 사업장을 폐쇄하고 자산을 압수함으로써, 카르텔의 금융 기반에 큰 타격을 입히는 동시에 국가를 위해 자금을 회수할 것입니다."
 investigates_the_banks: "은행 수사"
 investigates_the_banks_desc: "Banks, though typically legitimate institutions, are critical conduits in sophisticated money laundering operations. Through strategic investigation of senior banking officials and financial analysts, combined with comprehensive analysis of transaction records, we can intercept suspicious fund movements before they're completed. By exercising patience and surveillance, we can strike when illicit funds reach their maximum concentration, typically as they approach their final destination. This approach inflicts maximum financial damage on criminal organizations while removing substantial capital from their operations. However, maintaining effective monitoring presents significant challenges, as criminal enterprises continuously evolve their methods to circumvent detection. Furthermore, shutting down implicated banking institutions remains politically unfeasible due to their economic importance and powerful connections."
 investigate_shell_companies: "페이퍼 컴퍼니 수사"
 investigate_shell_companies_desc: "Shell companies serve as crucial intermediaries in sophisticated money laundering operations, functioning as both midpoint and final repositories for criminal assets. These legal entities hold property and capital on behalf of cartels while gradually transferring these assets toward legitimate destinations. They present a significant investigative challenge, as establishing direct connections to criminal organizations requires extensive financial forensics and intelligence gathering. Despite this difficulty, successfully targeting shell companies can devastatingly disrupt a cartel's financial infrastructure. Rather than yielding large cash seizures, these operations typically result in the confiscation of substantial physical assets: commercial real estate, luxury vehicles, industrial equipment, and legally acquired weapons, as criminals typically move money through these fronts in smaller, consistent transactions designed to avoid detection."
 target_cartel_drug_running_decision: "마약 밀매 작전 목표 설정"
 target_cartel_drug_running_decision_desc: "Drug-running operations constitute the largest illegal revenue source for cartels. While some cartels cultivate drugs themselves, many generate profits by moving refined or unrefined products through the supply chain. By systematically targeting and monitoring these transportation routes, we can identify origin points, destinations, and transit hubs. This intelligence enables us to conduct strategic raids on equipment depots, refineries, farms, drug houses, and operational bases. Alternatively, we can intercept shipments in transit, though this approach typically proves ineffective against larger operations. However, it can significantly destabilize smaller groups with limited resources to recover from such losses."
 raid_drug_convoys_decision: "마약 운반선 기습"
 raid_drug_convoys_decision_desc: "이동 중인 마약 운반선을 차단하면 최소한의 작전 비용으로 공급망을 효율적으로 교란할 수 있습니다. 대형 카르텔은 경로와 운송 방식을 신속히 바꿀 자원을 갖추고 있지만, 소규모 조직은 이러한 작전에 특히 취약합니다. 물자와 수익을 갑자기 잃으면 재정적 안정이 무너질 수 있으며, 줄어드는 자원 속에서 지도부가 통제력을 유지하려 애쓰다 보니 내부 갈등이 일어나는 경우가 많습니다. 이러한 표적 차단 작전은 정부의 대응을 보여 주는 눈에 띄는 성과를 가져다주는 동시에 범죄 조직 내부의 분열을 이용할 수 있게 해 줍니다."
 raid_cartel_hideouts_decision: "카르텔 아지트 기습"
 raid_cartel_hideouts_decision_desc: "Targeting cartel strongholds and supply depots directly disrupts their operational infrastructure, severely limiting their capacity to transport narcotics, coordinate activities, and defend their territory. These raids typically yield significant seizures of tactical vehicles and weaponry that would otherwise be deployed against government forces or rival organizations. A strategic consequence of these operations is the potential destabilization of cartel power dynamics. Weakened organizations often become targets for territorial expansion by competitors, which can either fragment criminal networks to our advantage or trigger escalated violence as power vacuums emerge."
 raid_distribution_centres_decision: "물류 센터 기습"
 raid_distribution_centres_decision_desc: "Targeting cartel distribution centers, including drug houses and stockpiles, allows us to intercept substantial quantities of narcotics before they reach the streets. These operations yield significant seizures of illicit cash and result in the arrest of key distribution personnel, disrupting the supply chain for weeks or months. However, these raids carry heightened risk of violent retaliation, as they directly impact cartel profits while leaving their enforcement capabilities intact. Intelligence gathering before such operations is critical, as distribution centers are typically well-guarded and strategically positioned to facilitate quick dispersal of products and personnel."
 raid_refinement_centres_decision: "정제 센터 습격"
 raid_refinement_centres_decision_desc: "마약 실험실, 재배지 또는 재배하우스를 습격함으로써, 우리는 카르텔이 새로운 마약을 생산하여 유통하는 능력을 방해하고, 그들을 크게 후퇴시킬 수 있습니다. 이 후퇴는 보통 몇 달 동안 마약 생산을 방해할 만큼 충분히 큰 손실을 입히며, 카르텔이 손실을 만회하려고 시도하는 동안 생산에 큰 영향을 미칩니다. 동시에, 대부분의 카르텔 자원이 자국 영토를 보호하는 데 사용되기 때문에 보복 공격이 일어날 가능성은 낮습니다."
 target_local_cartel_leaders_decision: "지역 카르텔 지도자들 목표 설정"
 target_local_cartel_leaders_decision_desc: "Cartels, like any sophisticated organization, rely on a hierarchical leadership structure to coordinate their operations. By strategically targeting and neutralizing local cartel leaders, whether through arrests or more permanent means, we can severely disrupt their command chain. This destabilization produces multiple benefits: recruitment efforts falter without proper direction, operational capacity diminishes significantly, and internal power struggles erupt as subordinates compete for vacant leadership positions. Additionally, these high-profile captures or eliminations generate substantial positive media coverage, boosting public morale and demonstrating the government's effectiveness in combating organized crime. Each successful operation against these figures not only weakens the cartel's infrastructure but also erodes their perceived invincibility."
 MEX_baja_california_sinaloa_cartel: "시날로아 카르텔 영향력 감소"
 MEX_baja_california_sinaloa_cartel_desc: "시날로아 카르텔이 너무 강해지고 있습니다. 바하칼리포르니아에서의 영향력을 억제해야 합니다"
 MEX_baja_california_tierra_cartel: "티에라 칼리엔테의 영향력 감소"
 MEX_baja_california_tierra_cartel_desc: "티에라 칼리엔테가 너무 강해지고 있습니다. 바하칼리포르니아에서의 영향력을 억제해야 합니다"
 MEX_sonora_sinaloa_cartel: "시날로아 카르텔 영향력 감소"
 MEX_sonora_sinaloa_cartel_desc: "시날로아 카르텔이 너무 강해지고 있습니다. 소노라에서의 영향력을 억제해야 합니다"
 MEX_chihuahua_sinola_cartel: "시날로아 카르텔 영향력 감소"
 MEX_chihuahua_sinola_cartel_desc: "시날로아 카르텔이 너무 강해지고 있습니다. 치와와에서의 영향력을 억제해야 합니다"
 MEX_sinola_durango_sinola_cartel: "시날로아 카르텔 영향력 감소"
 MEX_sinola_durango_sinola_cartel_desc: "시날로아 카르텔이 너무 강해지고 있습니다. 시날로아·두랑고에서의 영향력을 억제해야 합니다"
 MEX_jalisco_tierra_cartel: "티에라 칼리엔테의 영향력 감소"
 MEX_jalisco_tierra_cartel_desc: "티에라 칼리엔테가 너무 강해지고 있습니다. 할리스코에서의 영향력을 억제해야 합니다"
 MEX_guerrero_oaxaco_tierra_cartel: "티에라 칼리엔테의 영향력 감소"
 MEX_guerrero_oaxaco_tierra_cartel_desc: "티에라 칼리엔테가 너무 강해지고 있습니다. 게레로·오악사카에서의 영향력을 억제해야 합니다"
 MEX_mexico_tierra_cartel: "티에라 칼리엔테의 영향력 감소"
 MEX_mexico_tierra_cartel_desc: "티에라 칼리엔테가 너무 강해지고 있습니다. 멕시코시티에서의 영향력을 억제해야 합니다"
 MEX_mexico_sinaloa_cartel: "시날로아 카르텔 영향력 감소"
 MEX_mexico_sinaloa_cartel_desc: "시날로아 카르텔이 너무 강해지고 있습니다. 멕시코시티에서의 영향력을 억제해야 합니다"
 MEX_veracruz_tierra_cartel: "티에라 칼리엔테의 영향력 감소"
 MEX_veracruz_tierra_cartel_desc: "티에라 칼리엔테가 너무 강해지고 있습니다. 베라크루스에서의 영향력을 억제해야 합니다"
 MEX_already_attacking_cartels_flag: "이미 카르텔 영향력을 감소시키는 중"
 flag_mexico_cartel_war: "멕시코 카르텔 전쟁"
 reduce_cartel_influece_sinola_TT: "이 주에서 시날로아 카르텔의 영향력이 감소합니다"
 reduce_cartel_influece_tierra_TT: "이 주에서 티에라 칼리엔테의 영향력이 감소합니다"
 cartel_event.1.t: "카르텔의 끝"
 cartel_event.1.d: "우리나라에서 주요 카르텔의 영향력이 충분히 줄어들어, 이제 농촌 지역의 통제권을 되찾는 일을 진지하게 고려할 수 있게 되었습니다. 남은 일은 출동 명령을 내리는 것뿐입니다."
 cartel_event.1.a: "마약 조직은 자신의 죄값을 치르게 될 것이다!"
 cartel_event.3.t: "멕시코의 운명"
 cartel_event.3.d: "카르텔을 제거하려는 우리의 노력은 간과되지 않았으며, 그들은 멕시코 정부에 맞서 무기를 들었습니다. 멕시코의 마약과의 전쟁이 마지막 단계에 접어들었습니다."
 cartel_event.3.a: "시날로아 카르텔에 가입하다."
 cartel_event.3.b: "티에라 칼리엔테에 가입하다"
 cartel_event.3.c: "Join the Tamaulipas Cartel."
 cartel_event.3.e: "멕시코는 영원하다!"
 cartel_event.10.t: "마약과의 전쟁의 끝"
 cartel_event.10.d: "After months of fighting through the streets of our major cities, the jungles, plains, and the deserts, we've managed to eliminate every major cartel stronghold and route, detain, or kill every important cartel leader. The end draws near for the Narcos and soon Mexico will breathe free again."
 cartel_event.10.a: "The nightmare draws to an end."
 cartel_event.12.t: "카르텔의 반격"
 cartel_event.12.d: "The cartels refuse to sit idly by while we disrupt their operations and attack their members. In response, they've launched a series of bombings and retaliatory strikes against our local forces."
 cartel_event.12.a: "저주받은 마약!"
 cartel_event.15.t: "실종된 소총과 탄약"
 cartel_event.15.d: "In a recent audit of our nation's military bases as part of a measure to curtail the movement of equipment onto the black market, a considerable deficit of small arms and ammunition was uncovered. While the chance remains that it is a numerical error it is more likely that the equipment has been fenced or is in the process of being fenced. Luckily, the issue is isolated to a single military base where we can bring down our full force."
 cartel_event.15.a: "기지 내 활동을 단속한다."
 cartel_event.15.b: "우리는 이미 너무 과부하 상태다."
 cartel_event.16.t: "사라진 다목적 차량"
 cartel_event.16.d: "In a recent audit of our nation's military bases as part of a measure to curtail the movement of equipment onto the black market, a considerable deficit of trucks and their spare parts was uncovered. While the chance remains that it is a numerical error it is more likely that the equipment has been fenced or is in the process of being fenced. Luckily, the issue is isolated to a single military base where we can bring down our full force."
 cartel_event.16.a: "기지 내 활동을 단속한다."
 cartel_event.16.b: "우리는 이미 너무 과부하 상태다."
 cartel_event.17.t: "사라진 헬리콥터"
 cartel_event.17.d: "In a recent audit of our nation's military bases as part of a measure to curtail the movement of equipment onto the black market, a considerable deficit of helicopters and their spare parts was uncovered. While the chance remains that it is a numerical error it is more likely that the equipment has been fenced or is in the process of being fenced. Luckily, the issue is isolated to a single military base where we can bring down our full force."
 cartel_event.17.a: "기지 내 활동을 단속한다."
 cartel_event.17.b: "우리는 이미 너무 과부하 상태다."
 cartel_event.18.t: "항구에서 압수된 전차"
 cartel_event.18.d: "우리 주요 항구 중 하나에서, 항만 당국은 구식이지만 완전히 무장하고 작동하는 소련 T-55 전차 한 선적과 예비 부품 및 탄약을 발견했습니다. 이들의 목적지나 출발 지점을 확인할 수 없지만, 문서가 전혀 없는 것을 보면 두 가지 모두 불법일 가능성이 큽니다. 다행히도, 이들의 최종 목적지는 전적으로 우리의 손에 달려 있습니다."
 cartel_event.18.a: "고철로 팔아넘긴다."
 cartel_event.18.b: "현역으로 투입한다."
 cartel_event.18.c: "우방에게 넘겨준다."
 cartel_event.19.t: "전국 뉴스로 보도된 시신 유기"
 cartel_event.19.d: "우리 주요 도시 중 하나에서 대규모 시체 매립지가 발견된 불행한 사건이 뉴스에 보도되었으며, 모든 화면과 라디오를 통해 퍼지고 있습니다. 정보의 흐름을 다시 장악할 기회가 점점 사라지고 있습니다. 우리가 아무것도 하지 않으면, 공포는 우리 국민에게 더 깊이 뿌리내리고, 이 일을 저지른 괴물들이 그들을 더 쉽게 짓밟을 수 있을 것입니다."
 cartel_event.19.a: "여론의 주도권을 되찾는다."
 cartel_event.19.b: "우리는 이미 너무 과부하 상태다."
 cartel_event.20.t: "외국 유명인 살해"
 cartel_event.20.d: "지난 주, [?var:foreign_celeb_country.GetName] 출신의 유명인이 한 지역 주민에 의해 살해되었습니다. 살인범에 대한 간단한 조사는 그가 우리 나라에서 가장 큰 범죄 조직 중 하나와 연관이 있음을 밝혀냈습니다. 이미 우리는 이 살인에 대해 어떤 방식으로든 책임을 지라는 외부의 압박을 받고 있습니다. 몇 가지 제안이 제시되었지만, 가장 덜 간섭적인 방법은 그 유명인의 자선단체를 지지하는 것입니다."
 cartel_event.20.a: "자선 단체를 지지한다."
 cartel_event.20.b: "범죄자들과 어울리지 말았어야 했다."
 cartel_event.21.t: "카르텔의 이국적 동물 수입"
 cartel_event.21.d: "A fascination with exotic animals has spread among the highest ranking members of our nation's cartels. Usually obtained illegally, these animals are used as signs of power and of office while occasionally being tied to gruesome killings. By tightening our grip on the influx of animals, we could expose the ridiculousness of those engaged in it by forcing an artificial increase in price. While a tiger may be intimidating, spending ten million dollars on it is an obvious sign of opulence."
 cartel_event.21.a: "거래를 근절한다."
 cartel_event.21.b: "거래를 무시한다."
 cartel_event.22.t: "지역 갱단 충돌"
 cartel_event.22.d: "A gang war has erupted on the streets of one of our larger cities, hampering the local economy, claiming lives, and making residents afraid to leave their homes. While our analysts predict the violence will not last for long, the public is unlikely to be comfortable with the idea of simply waiting out wanton killings. An intervention by our police forces could end the crisis early but would result in large overhead and possible loss of life."
 cartel_event.22.a: "경찰을 투입한다."
 cartel_event.22.b: "우리는 이미 너무 과부하 상태다."
 cartel_event.23.t: "미국의 범죄인 인도 요구"
 cartel_event.23.d: "미국은 최근 우리가 구속한 마약 밀매상에 대한 송환을 요구했습니다. 향후 다른 마약 밀매상에 대한 지원을 기대하며 미국과 좋은 관계를 유지하는 것이 유리할 것입니다. 하지만 미국의 법적 간섭은 우리의 자립성을 저하시킬 가능성이 있습니다."
 cartel_event.23.a: "데려가도 좋다."
 cartel_event.23.b: "우리의 범죄자는 우리가 처리할 수 있다."
 cartel_event.24.t: "영화 계약을 따낸 정보원"
 cartel_event.24.d: "우리나라 최대 범죄 조직의 전 구성원이었던 한 정보원이, 자신의 이야기가 입소문을 통해 알려져 영화 제작자가 이를 영화로 만들고 싶다는 제안을 받았습니다. 이 정보원은 이에 대해 긍정적인 반응을 보이고 있지만, 영화 제작이 그의 생명에 위험을 초래할 수 있습니다. 우리는 이 거래를 지원하고 영화 제작을 허용할 수도 있고, 아니면 가까운 미래에 그의 꿈을 완전히 차단할 수도 있습니다."
 cartel_event.24.a: "영화 계약을 허용한다."
 cartel_event.24.b: "너무 위험하다."
 cartel_event.25.t: "회고록을 출간한 정보원"
 cartel_event.25.d: "최근 정보원이 영화 제작자와의 접촉을 통해 자신의 이야기를 세상에 공개하려는 마음을 굳힌 것 같습니다. 지난 몇 주 동안 그는 여러 작가 및 정부 관계자들과 협력하여 익명으로 출판할 수 있는 회고록을 작성했습니다. 관련된 모든 사람에 따르면, 이 회고록은 매우 흥미진진하며 마약 밀매 조직에서의 삶의 잔혹한 현실을 그대로 보여주고 있다고 합니다."
 cartel_event.25.a: "베스트셀러가 될지 궁금하군."
 cartel_event.26.t: "촬영 현장에서 살해된 정보원"
 cartel_event.26.d: "중요한 장면을 감독하러 방문한 뒤, 우리 정보원의 시신이 촬영 현장에서 발견되었습니다. 시신의 상태로 미루어 카르텔 조직원들의 보복 살인으로 결론이 내려졌습니다. 목숨의 위협을 느낀 것은 당연하게도, 영화 제작진은 제작을 중단하기로 결정했습니다."
 cartel_event.26.a: "유감이다."
 cartel_event.27.t: "범죄 활동을 조장하는 영화"
 cartel_event.27.d: "의사소통의 착오로 보이는 일이 벌어져, 우리 정보원의 삶을 다룬 새 영화가 냉혹한 범죄 비극이라기보다 데 바케로스 영화처럼 받아들여지고 있습니다. 이로 인해 젊은이들이 영화 속 희화화된 인물들을 흉내 내기를 바라면서, 우리나라의 여러 범죄 조직에서 신규 모집이 늘어났습니다."
 cartel_event.27.a: "유감이다."
 cartel_event.28.t: "범죄 활동을 억제하는 영화"
 cartel_event.28.d: "우리 정보원이 제작을 도운 영화가 개봉 첫 주 만에 비평가들의 찬사를 받았습니다. 게다가 카르텔의 참상을 사실적으로 묘사한 덕분에 카르텔에 대한 반발이 더욱 커졌습니다. 이제 우리 젊은이들은 카르텔에 가담하는 대신 카르텔과 싸우는 사람으로 자라기를 원하는 듯합니다."
 cartel_event.28.a: "훌륭하군."
 cartel_event.29.t: "카르텔의 국경 침투"
 cartel_event.29.d: "이웃 국가의 한 카르텔이 대규모 국경 침투를 감행했으나, 양국의 국경 통제 기관 모두 이를 막으려 움직이지 않고 책임을 상대에게 떠넘겼습니다. 이로 인해 우리 정치권에서는 이웃 국가의 국경 단속 강화를 요구하자는 움직임이 일고 있으며, 이 모든 것이 우리만의 잘못일 수는 없다는 주장입니다."
 cartel_event.29.a: "이웃 국가에 더 엄격한 국경 통제를 요구한다."
 cartel_event.29.b: "요구를 하면 관계가 손상될 수 있다."
 cartel_event.30.t: "이웃 국가의 국경 통제 요구"
 cartel_event.30.d: "최근 우리나라에서 [FROM.GetName]으로의 카르텔 국경 침투가 있은 후, 이웃 국가가 우리에게 국경 보안을 강화하라고 요구했습니다. 지금까지 이 문제는 우리 외교 부서 내에서 많은 논쟁을 불러일으켰습니다."
 cartel_event.30.a: "좋다, 보안을 강화하겠다."
 cartel_event.30.b: "그쪽이 국경 보안을 강화하면 되지 않는가?"
 cartel_event.31.t: "이웃 국가의 요구 수용"
 cartel_event.31.d: "이웃 국가 [FROM.GetName]이(가) 국경 통제 강화에 대한 우리의 요구를 수용했습니다. 우리 지지층이 이번 승리를 매우 반길 것임은 의심할 여지가 없습니다."
 cartel_event.31.a: "훌륭하군."
 cartel_event.32.t: "이웃 국가의 우리 요구 무시"
 cartel_event.32.d: "이웃 국가 [FROM.GetName]이(가) 국경 통제 강화에 대한 우리의 요구를 무시했습니다. 우리는 벌써부터 정치적 실패를 두고 언론의 맹비난을 받고 있습니다."
 cartel_event.32.a: "유감이다."
 cartel_event.33.t: "과두 재벌과 연관된 수상한 송금"
 cartel_event.33.d: "최근의 수사 중 우리는 국내의 특정 과두 재벌의 자금에서 나온 수상한, 그러나 불법은 아닌 송금을 발견했습니다. 정치적 톱니바퀴에 기름칠을 해 그들을 이번 수사에 연루시키는 것은 쉬운 일일 것입니다. 그러나 이러한 월권은 국내외 과두 재벌 모두를 분노하게 할 것이 분명합니다."
 cartel_event.33.a: "자산을 압류한다."
 cartel_event.33.b: "내버려 둔다."
 cartel_event.34.t: "카르텔 전차 포착"
 cartel_event.34.d: "카르텔 표적에 대한 최근의 실패한 급습 중, 카르텔이 전차를 운용하는 모습이 포착되었습니다. 크게 개조된 소련제 T-34로 보이는 이 전차는 주포 사격까지 가능했습니다."
 cartel_event.34.a: "최근의 급습 이후, 카르텔이 우리 경찰서 중 하나를 보복 공격했습니다. 그들은 최근 목격된 T-34를 이용해 울타리를 부수고 건물 내부를 향해 무차별 사격을 가하며 건물을 파괴했습니다. 이로 인해 상당한 인명 피해가 발생했으며, 사건은 전국 뉴스에 보도되었습니다."
 cartel_event.35.t: "카르텔 전차 파괴"
 cartel_event.35.d: "최근 카르텔 목표를 대상으로 한 성공적인 급습 중, 우리 요원들은 이전 작전 실패 당시 목격된 T-34를 찾아내어 파괴하는 데 성공했습니다. 특히 대전차 무기 없이 수행된 이번 승리는 크게 언론에 보도되며 주목받고 있습니다."
 cartel_event.35.a: "하느님과 용감한 병사들에게 감사한다."
 cartel_event.36.t: "공격에 동원된 카르텔 전차"
 cartel_event.36.d: "최근의 급습 이후, 카르텔이 우리 경찰서 중 하나를 대상으로 보복 공격을 감행했습니다. 그들은 최근 목격된 T-34를 이용해 울타리를 부수고 건물 내부를 향해 무차별 사격을 가하며 건물을 파괴했습니다. 이 사건으로 인해 상당한 사상자가 발생했으며, 사건은 전국적으로 보도되었습니다."
 cartel_event.36.a: "최근의 급습 이후, 카르텔이 우리 경찰서 중 하나를 보복 공격했습니다. 그들은 최근 목격된 T-34를 이용해 울타리를 부수고 건물 내부를 향해 무차별 사격을 가하며 건물을 파괴했습니다. 이로 인해 상당한 인명 피해가 발생했으며, 사건은 전국 뉴스에 보도되었습니다."
 cartel_event.37.t: "유령 운수회사"
 cartel_event.37.d: "While evaluating the assets of one of the companies we seized recently, it was noticed that one had been registered with a large number of former military 6x6 trucks. After a short search, the vehicles were located in a warehouse owned by the company. The vehicles are now commonly used on farms and in a variety of other industries but are also still used in some legacy roles within our military."
 cartel_event.37.a: "군 복무에 투입한다."
 cartel_event.37.b: "민간 기업에 트럭을 되판다."
 cartel_event.38.t: "우연히 체포된 범죄 조직 두목"
 cartel_event.38.d: "하급 카르텔 조직원으로만 여겨졌던 이들에 대한 최근의 일련의 검거에서 우연히 거물 범죄 조직 두목이 붙잡힌 것으로 드러났습니다. 그는 처음에는 신분을 숨겼으나, 그를 알고 있던 경찰관이 알아보았습니다. 그는 지금 석방을 요구하며 상당한 보석금을 내겠다고 제안하고 있습니다."
 cartel_event.38.a: "아, 그렇소, 모두 계획의 일부였지."
 cartel_event.38.b: "죄송합니다, 선생님."
 cartel_event.39.t: "우연히 발견된 마약 재배지"
 cartel_event.39.d: "우리나라 농촌 지역에서 일상적인 순찰을 하던 중, 지방 경찰이 마약 재배지로 추정되는 곳을 우연히 발견했습니다. 지침에 따라 이들은 상부에 소식을 보냈으며 지금은 증원군이나 조치에 대한 지시를 기다리고 있습니다."
 cartel_event.39.a: "농지를 불태우고 장비를 파괴한다."
 cartel_event.39.b: "모든 증거와 장비를 압수한다."
 cartel_event.39.c: "재배지를 내버려 둔다."
 cartel_event.40.t: "익명의 제보"
 cartel_event.40.d: "취약한 카르텔 전초 기지에 대한 익명의 제보를 받았습니다. 신속히 행동하면 해당 거점을 제압할 수 있습니다. 그러나 이는 장난이거나, 우리를 진지에서 끌어내 매복하려는 카르텔의 계략일 수도 있습니다."
 cartel_event.40.a: "제보에 따라 행동한다. 모든 기회는 진짜 기회다!"
 cartel_event.40.b: "제보를 무시한다. 십중팔구 장난일 것이다."
 cartel_event.41.t: "Local Businesses Cooperate with Cartels"
 cartel_event.41.d: "외곽 도시 중 한 곳의 여러 기업이 때로는 공공연하게 카르텔과 손잡고 일하고 있다는 사실이 드러났습니다. 이를 방치하면 우리가 통치할 의지가 없거나 능력이 없다는 분명한 메시지를 국민에게 전하게 됩니다. 그러나 카르텔에게는 그들의 통치 권위를 우리가 인정한다는 메시지를 전하게 됩니다."
 cartel_event.41.a: "소유주들의 행위를 문책한다."
 cartel_event.41.b: "활동을 모른 척한다."
 cartel_event.42.t: "밀수품을 은닉해 주는 산업 복합 기업들"
 cartel_event.42.d: "최근 제보를 통해 우리의 대기업 다수가 카르텔이 자사 창고에 밀수품을 보관하도록 허용해 왔다는 사실을 알게 되었습니다. 이는 노골적인 부패의 징후일 수 있으나, 협박의 결과일 가능성도 있습니다. 어느 쪽이든 우리의 어떤 대응이 필요합니다. 그렇지 않으면 제보자가 언론에 알릴 가능성이 높습니다."
 cartel_event.42.a: "창고를 압류하고 복합 기업에 벌금을 부과한다!"
 cartel_event.42.b: "밀수품을 압수하고 기업에는 가벼운 경고만 한다."
 cartel_event.42.c: "그들의 창고이긴 하지만, 이제 모두가 알게 되었다."
 cartel_event.43.t: "부패한 관료들"
 cartel_event.43.d: "We have recently received an anonymous tip which led to a short investigation into one of our local politician's campaign investments. The investigation revealed that most of the campaign funds had been sourced from individuals and companies tied to cartel activities. Many signs in the investigation also point towards an intricate web of appointees, investors, and political allies."
 cartel_event.43.a: "가능한 한 많은 이들을 공직에서 제거한다. 이를 용납할 수 없다."
 cartel_event.43.b: "민간인의 선거 자금 투자는 우리가 상관할 바가 아니다."
 cartel_event.44.t: "항만청의 밀수품 발견"
 cartel_event.44.d: "우리의 주요 항구 중 한 곳에서 항만청이 일상적인 검사 중 밀수품이 가득한 선적 컨테이너를 적발했습니다. 지침에 따라 항만청은 선박을 일시 압류하고, 처리 방침에 대한 결정은 우리에게 넘겼습니다."
 cartel_event.44.a: "마약 거래에 협조한 선박을 압류한다."
 cartel_event.44.b: "컨테이너를 압수한다. 여기서 불법인 것은 그것뿐이다."
 cartel_event.44.c: "눈감아 준다. 장사는 장사다."
 cartel_event.45.t: "모른 척하는 은행가들"
 cartel_event.45.d: "여러 고위 은행가들이 카르텔 활동을 모른 척하고 있으며 때로는 직접 가담하기까지 한다는 익명의 제보를 받았습니다. 이 정보로 아무 조치도 취하지 않으면 제보자가 언론에 유출할 가능성이 높습니다."
 cartel_event.45.a: "해당 은행가들을 투옥하고 수사에 착수한다."
 cartel_event.45.b: "우리 손을 벗어난 일이다..."
 cartel_event.46.t: "카르텔의 솔깃한 뇌물"
 cartel_event.46.d: "우리 정치 기득권층의 여러 인사가 최근 흥미로운 제안을 받았습니다. 우리가 카르텔을 여느 이익 단체와 다름없이 대우하여 그들이 원하는 대로 활동할 공간을 주면, 그들은 앞으로 있을 여러 중요한 선거의 자금을 대겠다는 것입니다. 이념적으로 더 유연한 당 인사들이 우리에게 방향을 묻고 있습니다."
 cartel_event.46.a: "물론이다! 이렇게 중요한 이익 단체와 협력하게 되어 기쁘다."
 cartel_event.46.b: "터무니없다! 그들은 국민의 최선의 이익을 대변하지 않는다."
 cartel_event.47.t: "악마와의 거래"
 cartel_event.47.d: "우리 정치 기득권층의 여러 고위 인사가 최근 우리나라 최대 카르텔 중 한 곳의 우두머리들과의 회동에 초청받았습니다. 회동에서 카르텔 우두머리들은 자신들의 의도를 분명히 밝혔습니다. 그들은 우리의 적일 필요가 없으며, 오히려 정치적 동맹이 될 수 있다는 것입니다. 그들은 이미 우리의 협력에 대한 대가로 상당한 몫을 제안했고, 동반자 관계가 이어지면 더 많은 것을 약속했습니다."
 cartel_event.47.a: "세금은 국가가 기능하는 능력의 중요한 일부이다."
 cartel_event.47.b: "저 악마들이 발을 들여놓게 해서는 안 된다."
 cartel_event.48.t: "마약 거래 규제"
 cartel_event.48.d: "여러 대형 카르텔이 자신들의 이윤을 잠식하기 시작한 비카르텔 범죄를 줄이기 위해 협력하자는 제안을 최근 내놓았습니다. 그 대가로 그들은 계열 기업들이 더 정확한 수익을 신고하도록 하는 데 협조하겠다고 제안했습니다. 그리고 그것이 무슨 의미든, 그들의 거래를 더 인도적으로 만들겠다고도 했습니다."
 cartel_event.48.a: "엄격히 규제되는 국가·카르텔 협력을 협상한다."
 cartel_event.48.b: "느슨하게 규제되는 국가·카르텔 협력을 협상한다."
 cartel_event.48.c: "우리는 범죄자들과 협상하지 않는다."
 cartel_event.49.t: "신뢰를 잃어 가는 청년층"
 cartel_event.49.d: "우리 인구 중 가장 영향을 받기 쉬운 계층 중 하나는 청년층이며, 카르텔로 인한 우리나라의 상황은 이들이 우리 정치 기득권층에 등을 돌리게 하기 시작했습니다. 조사에 따르면 많은 청년이 떠날 수 있게 되면 떠날 계획이며, 남기로 한 이들은 다음 선거에서 우리에게 반대표를 던지려는 듯합니다. 우리는 이들 중 가장 열정적인 이들이 우리와 함께 조국을 바로잡도록 이끌기 위해 지원 프로그램을 시도합니다."
 cartel_event.49.a: "지원 프로그램으로 손을 내민다."
 cartel_event.49.b: "자기 연민에 빠져 있게 두자. 우리는 그들이 필요 없다."
 cartel_event.53.t: "카르텔의 보복 공격"
 cartel_event.53.d: "최근의 급습 직후, 카르텔은 우리 경찰서 중 한 곳에 보복 공격을 가했습니다. 그들은 방어선을 돌파하여 우리 경찰관들을 마을 밖으로 몰아냈으며 뒤에 파괴의 흔적을 남겼습니다. 이로 인해 다수의 사상자가 발생했고 이 사건은 전국 뉴스로 보도되었습니다."
 cartel_event.53.a: "유감이다."
 cartel_event.54.t: "카르텔 보복 공격 실패"
 cartel_event.54.d: "최근의 급습 직후, 카르텔은 우리 경찰서 중 한 곳에 보복 공격을 가했습니다. 우리 경찰관들은 소수의 사상자만 낸 채 용감히 버텨 냈습니다. 몇 시간 후 증원군이 도착하여 카르텔을 흩어 놓는 데 성공했습니다. 이 사건은 전국 뉴스에서 카르텔에 맞서는 결집의 구심점이 되었습니다."
 cartel_event.54.a: "훌륭하군"
 cartel_event.55.t: "카르텔의 헬리콥터 격추"
 cartel_event.55.d: "최근의 급습 중 우리 경찰 헬리콥터 한 대가 카르텔에 의해 격추되었습니다. 사건 검토 결과, 유탄이 조종사의 목에 맞았고 부조종사가 제때 통제력을 되찾지 못해 참사로 이어진 것으로 드러났습니다. 승무원은 말할 것도 없고 그토록 중요한 장비를 잃은 것은 유감스러운 일입니다."
 cartel_event.55.a: "유감이다."
 cartel_event.56.t: "카르텔 처형의 생존자"
 cartel_event.56.d: "선의의 시민에게 발견되어 병원으로 급히 이송된 우리나라 카르텔 소굴 지역 출신의 한 남성은 곧 임종의 자리가 될 수도 있는 침대에 누워 있습니다. 그러나 우리에게는 그를 도울 기회가 주어졌습니다. 그는 시설이 더 나은 병원으로 옮겨져야 하는데, 이는 인근의 우리 군 헬리콥터 한 대가 해낼 수 있는 일입니다."
 cartel_event.56.a: "그는 우리의 새로운 엘 푸시라도(El Fusilado)가 될 것입니다!"
 cartel_event.56.b: "우리 의사들이 그를 살릴 수 없었던 건 정말 안타까운 일이다..."
 cartel_event.50.t1: "성공적인 카지노 조사"
 cartel_event.50.d1: "몇 주간의 계획과 감시 끝에, 우리 경찰은 국가의 하나인 카지노에 진입하여 수백만 달러의 불법 자금을 압수하고, 중요한 물리적 증거를 수집하며, 카르텔의 돈세탁 계획에 연루된 주요 인물들을 체포했습니다. 수집된 증거를 바탕으로 우리는 카지노와 그 운영자와 관련된 모든 합법적인 자산에 대해 동결 조치를 취했습니다. 이번 타격으로 우리는 중요한 인프라를 제거하고, 그들이 사용할 수 있는 자금을 축적하는 능력을 약화시켰습니다."
 cartel_event.50.t2: "성공적인 은행 조사"
 cartel_event.50.d2: "몇 주간의 대기와 돈 이체 모니터링 끝에, 오늘 우리는 카르텔의 돈세탁 작업과 연관된 수십 개의 회사와 개인들의 자산을 동결했습니다. 체포 영장이 발부되었고, 일부 회사와 저급 정치인 및 관료들 간의 의심스러운 이체에 대한 여러 작은 조사들이 시작되었습니다. 카르텔이 결국 회복할 것임은 틀림없지만, 이렇게 한 번에 많은 자산을 잃은 것은 그들의 인프라에 큰 타격을 줄 것입니다."
 cartel_event.50.t3: "성공적인 페이퍼 컴퍼니 조사"
 cartel_event.50.d3: "몇 주간의 조사 끝에, 우리는 몇몇 의심스러운 회사를 차단하고 그들의 자산을 압수했습니다. 비록 수집된 금액은 적지만, 우리는 많은 수의 부동산, 민간 차량 및 기타 물품을 압수했습니다. 이것은 그들의 돈세탁 작업뿐만 아니라, 그들이 모든 작업을 유지할 수 있는 능력에 대한 강력한 타격이 될 것입니다."
 cartel_event.50.t4: "실패한 카지노 조사"
 cartel_event.50.d4: "In spite of our best efforts, our analysts have been unable to draw a connection between the cartels and the casino upon which our investigation has fallen. What's worse, people have started asking questions about where the money used in the investigation has been going, leading to successful political attacks on our candidates by the opposition. To add further insult to injury, the cartels continue their operations unimpeded."
 cartel_event.50.t5: "실패한 은행 조사"
 cartel_event.50.d5: "수주 동안 우리 요원들이 컴퓨터 앞에 앉아 은행 이체를 모니터링하며 노력했음에도 불구하고, 카르텔에 타격을 입힐 명확한 기회를 찾지 못했습니다. 더 나쁜 점은 사람들이 조사에 사용된 자금의 흐름에 대해 질문을 하기 시작했고, 이로 인해 야당의 정치적 공격을 받은 우리 후보들이 성공적으로 타격을 입었습니다. 더욱 심각한 점은, 카르텔들이 여전히 방해받지 않고 그들의 작전을 계속하고 있다는 것입니다."
 cartel_event.50.t6: "실패한 페이퍼 컴퍼니 조사"
 cartel_event.50.d6: "In spite of the time and money funnelled into our investigations, all we've uncovered are divorce-security funds and liability protection schemes. What's worse, in the process we have managed to step on the toes of just enough people to have our investigation exposed on the national news. Such an embarrassment has more than likely damaged our future election prospects. To add further insult to injury, the cartels continue their operations unimpeded."
 cartel_event.50.a: "조사가 종료되었다."
 cartel_event.51.t1: "성공적인 마약 호송차 습격"
 cartel_event.51.d1: "최근 알려진 마약 경로에서의 공격에서, 우리는 수백 킬로그램의 마약을 압수하고, 몇 명의 저급 카르텔 구성원들을 체포했으며, 몇 대의 민간 차량을 압수하면서 사상자는 적었습니다. 이로 인해 마약 거래를 잠시 중단시킬 수 있을 정도의 타격을 입혔지만, 이러한 손실은 충분히 큰 카르텔이라면 쉽게 회복할 수 있습니다."
 cartel_event.51.t2: "성공적인 카르텔 은신처 습격"
 cartel_event.51.d2: "최근 알려진 카르텔 거점에 대한 공격에서, 우리는 수십 명의 카르텔 구성원들을 처치하거나 체포하고, 여러 대의 군사용 장비와 즉석 무기를 압수하거나 파괴했습니다. 이 타격은 다른 조직들이 순간적인 약점을 이용하려 할 수 있기 때문에 연쇄적인 영향을 미칠 수 있습니다."
 cartel_event.51.t3: "성공적인 유통 센터 습격"
 cartel_event.51.d3: "최근 알려진 유통 센터에 대한 공격에서, 우리는 수십만 달러 가치의 불법 자금과 마약을 압수했습니다. 또한 이 장소와 연관된 많은 마약 밀매상들을 체포하기 시작했으며, 이로 인해 그들이 마약을 시장에 공급하고 이익을 창출하는 능력을 심각하게 약화시켰습니다. 우리의 성공에도 불구하고, 보복 공격의 가능성에 대해 경계해야 합니다."
 cartel_event.51.t4: "성공적인 정제 센터 습격"
 cartel_event.51.d4: "최근 알려진 정제 센터에 대한 공격에서, 우리는 수십만 달러 가치의 장비와 마약을 파괴했습니다. 또한 정제에 연루된 많은 사람들을 체포했으며, 이로 인해 그들이 미래에 더 많은 마약을 생산하는 데 어려움을 겪을 것입니다. 우리의 성공에도 불구하고, 보복 공격의 가능성에 대해 경계해야 합니다."
 cartel_event.51.t5: "실패한 마약 호송차 습격"
 cartel_event.51.d5: "최근 알려진 마약 경로에서의 공격에서, 우리의 군은 압도당하여 철수해야 했고, 몇 명의 사상자가 남겨졌습니다. 사건에 대한 정보는 이미 공개되어 우리 정부에 대한 신뢰를 약화시켰습니다. 보복 공격의 가능성에 대해 경계해야 합니다."
 cartel_event.51.t6: "실패한 카르텔 은신처 습격"
 cartel_event.51.d6: "최근 알려진 카르텔 거점에 대한 공격에서, 우리의 군은 압도당하여 철수해야 했고, 몇 명의 사상자가 남겨졌습니다. 사건에 대한 정보는 이미 공개되어 우리 정부에 대한 신뢰를 약화시켰습니다. 보복 공격의 가능성에 대해 경계해야 합니다."
 cartel_event.51.t7: "실패한 물류 센터 기습"
 cartel_event.51.d7: "최근 알려진 카르텔 유통 센터에 대한 공격에서, 우리의 군은 압도당하여 철수해야 했고, 몇 명의 사상자가 남겨졌습니다. 사건에 대한 정보는 이미 공개되어 우리 정부에 대한 신뢰를 약화시켰습니다. 이 지역과 관련된 사람들은 이제 모두 흩어졌습니다. 보복 공격의 가능성에 대해 경계해야 합니다."
 cartel_event.51.t8: "실패한 정제 센터 습격"
 cartel_event.51.d8: "최근 알려진 카르텔 정제 센터에 대한 공격에서, 우리의 군은 압도당하여 철수해야 했고, 몇 명의 사상자가 남겨졌습니다. 사건에 대한 정보는 이미 공개되어 우리 정부에 대한 신뢰를 약화시켰습니다. 보복 공격의 가능성에 대해 경계해야 합니다."
 cartel_event.51.a: "습격이 종료되다."
 cartel_event.52.t: "카르텔의 끝"
 cartel_event.52.d: "수십 년 간의 고난과 많은 이들의 희생 끝에, 우리는 카르텔의 잔여 세력을 우리 나라에서 완전히 제거했습니다. 그러나 여전히 그들의 영향력에서 벗어난 것은 아닙니다. 우리 지역의 다른 나라들은 여전히 이 괴물들의 지배를 겪고 있으며, 이제 우리는 괴물 사냥에 풍부한 전문 지식을 보유하게 되었습니다."
 cartel_event.52.a: "이것은 [ROOT.GetName]의 새로운 시대다."
 cartel_event.100.t: "[FROM.GetName]은(는) 그들의 카르텔을 물리쳤다."
 cartel_event.100.d: "News has breached from [FROM.GetName] as they have succeeded against their cartels. Stability and peace have returned to the region."
 cartel_event.100.a: "새로운 시장인가?"
 cartel_event.100.b: "[FROM.GetName]의 안정"
