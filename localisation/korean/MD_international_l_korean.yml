 pmc_global_management: "국제 민간군사기업 관리"
 pmc_global_management_desc: "\n\n\n\n\n\n£CHVK_desctext_pmc\n\n\n\n\n\n\n\n\nThis screen allows us to operate globally with our loyal PMC and manage it.\nWe can expand our capacity up to 7. We can improve our quality up to level 4.\n\n[PMC_global_header]"
