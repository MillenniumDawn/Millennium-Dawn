l_braz_por:
 greenland_focus: "Árvore de Foco da Groenlândia"
 GRN_intro_to_greenland_shortcut: "Introdução à Groenlândia"
 GRN_greenland_foreign_policy_tree: "Política Externa da Groenlândia"
 GRN_focus_The_Great_Ice_Island: "A Grande Ilha de Gelo"
 GRN_focus_The_Great_Ice_Island_desc: "A Groenlândia é uma das maiores ilhas conhecidas do mundo, depois da Austrália, que tecnicamente é um continente. A ilha abriga cerca de 58 mil cidadãos, que vêm principalmente do grupo cultural inuíte. A Groenlândia é vista como a última grande fronteira do desenvolvimento da Terra, atrás apenas de fazer algo concreto com os polos norte ou sul do próprio planeta. Agora, no século XXI, a Groenlândia e seu povo se veem como a última colônia de verdade e buscam ativamente a independência plena. Mas será que se verão finalmente livres, ou fracassarão em provar que a ilha realmente pode se sustentar sozinha?"
 GRN_focus_The_People: "O Povo"
 GRN_focus_The_People_desc: "Um dos problemas centrais que nossa nação sofre é a falta de gente. As pessoas precisam de comida, abrigo e serviços civis que cuidem delas e as ajudem quando necessário. Assim, devemos tratar esses pontos para assegurar um futuro em que as pessoas queiram vir e ficar em nossa nação. Para criar um futuro próprio no que pode parecer um lugar sem futuro."
 GRN_focus_Food_Security: "Segurança Alimentar"
 GRN_focus_Food_Security_desc: "Nossa principal fonte de alimento na ilha é a pesca. Mas a pesca também é nosso principal gargalo econômico, então como podemos nos alimentar se também importamos as mesmas coisas? Pois bem, este é um dos pilares fundamentais que devemos estabelecer se quisermos ter algum futuro estável."
 GRN_focus_Breaking_Ground_For_Farmlands: "Abrindo Terreno para \"Terras Agrícolas\""
 GRN_focus_Breaking_Ground_For_Farmlands_desc: "Estufas e projetos de agricultura vertical. Esses alimentos básicos serão a base do novo suprimento alimentar de nossa nação e, por isso, precisamos criar o aparato para cultivá-los. Embora o processo exija muita energia, se montarmos nossa infraestrutura e revisitarmos nossos recursos, poderemos juntar o básico para pôr a bola em movimento."
 GRN_focus_East_Farmland_Projects: "Projetos de \"Terras Agrícolas\" no Leste"
 GRN_focus_East_Farmland_Projects_desc: "Assim como em nosso trabalho fundamental inicial no oeste, precisaremos fazer o mesmo no leste. Pequenos polos de alimentos para ajudar na logística e na distribuição por toda a nação e por nossos assentamentos bastante esparsos."
 GRN_focus_Growing_Staple_Foods: "Cultivando Alimentos Básicos"
 GRN_focus_Growing_Staple_Foods_desc: "Nossos primeiros avanços em projetos agrícolas em condições hostis farão com que, por ora, só se cultivem alimentos básicos. Batatas, trigo e um pequeno conjunto de alimentos essenciais que ajudam no aporte calórico e rendem bastante nas refeições."
 GRN_focus_Strategic_Cash_Crops: "Culturas Comerciais Estratégicas"
 GRN_focus_Strategic_Cash_Crops_desc: "O programa SCC é um canto limitado de nossos novos HFPs: enquanto tentamos reforçar o suprimento alimentar interno, também podemos explorar culturas comerciais limitadas, como o algodão, como forma de fomentar também o crescimento industrial nacional."
 GRN_focus_National_Seed_Vault: "Banco Nacional de Sementes"
 GRN_focus_National_Seed_Vault_desc: "À medida que expandimos nossos HFPs, tanto em escala nacional quanto em operações locais, precisamos ser capazes de diversificar e ampliar os tipos de cultivos que podemos produzir. Por isso criaremos um banco nacional de sementes para preservar e distribuir adequadamente culturas rotativas, de modo que nossa nação possa desfrutar o máximo possível das riquezas do mundo."
 GRN_focus_Stable_Population_Growth: "Crescimento Populacional Estável"
 GRN_focus_Stable_Population_Growth_desc: "Ao longo de toda a sua existência, nossa nação foi prejudicada pela incapacidade de estabilizar a população. Muitos fogem das condições duras ou para conhecer o mundo. Sejamos realistas: não podemos culpá-los por quererem mais da vida, mas podemos nos culpar por não trabalharmos para dar às pessoas motivos para ficar. Não podemos fazer nada quanto ao clima, mas podemos desenvolver cidades e assentamentos mais convincentes, para que as pessoas queiram ficar e ajudar a melhorar seus lares."
 GRN_focus_Planning_New_Settlements: "Planejando Novos Assentamentos"
 GRN_focus_Planning_New_Settlements_desc: "Nossa capacidade de aumentar a população é prejudicada pela falta de moradia adequada e de planejamento de novas cidades como um todo. Tudo se formou, em sua maior parte, em torno da capital, Nuuk; assim, nestas fases iniciais de planejamento e desenvolvimento, teremos de usar a capital como base de onde escoar a logística por enquanto."
 GRN_focus_Spread_Settlement_Planning_East: "Estender o Planejamento de Assentamentos ao Leste"
 GRN_focus_Spread_Settlement_Planning_East_desc: "Embora a capital, Nuuk, seja nossa base logística para a parte oeste da ilha, precisaremos estabelecer uma espécie de \"capital do leste\", por assim dizer. Assim, a metade oriental também terá um polo logístico para planejar e distribuir a capacidade de desenvolvimento de assentamentos e o crescimento das duas principais regiões da nação."
 GRN_focus_New_Hope_Settlement: "Assentamento Nova Esperança"
 GRN_focus_New_Hope_Settlement_desc: "Para lutar por um amanhã melhor, um futuro melhor e simplesmente uma vida melhor para nossos cidadãos, decidimos fundar um assentamento totalmente novo no centro-noroeste, chamado Neriunneq nutaaq, que em português significa, grosso modo, Nova Esperança. Queremos fazer dele um farol de nosso progresso no desenvolvimento da nação e da metade ocidental da ilha."
 GRN_focus_Great_Star_Settlement: "Assentamento Grande Estrela"
 GRN_focus_Great_Star_Settlement_desc: "Para tentar distribuir nosso desenvolvimento de forma equilibrada e garantir necessidades logísticas uniformes ao longo de nossos esforços contínuos, criaremos um assentamento oriental na mesma faixa lateral do assentamento ocidental. Chamado Annertuumik Stjerne, que em português significa, grosso modo, Grande Estrela ou \"Estrela Grande\", esperamos usá-lo como base oriental central para começar a espalhar os esforços de desenvolvimento enquanto cuidamos do crescimento costeiro e olhamos para o interior, rumo à Grande Plataforma de Gelo."
 GRN_focus_Development_Living_Grants: "Subsídios de Moradia para o Desenvolvimento"
 GRN_focus_Development_Living_Grants_desc: "O programa DLG é um subsídio governamental para incentivar a imigração para a nação. O princípio central é que o subsídio cobrirá os custos de viagem e de instalação. Quando o indivíduo ou os indivíduos estiverem instalados e colocados em um local de trabalho com renda estável, o subsídio cessará. Em essência, é um investimento em recursos humanos para estimular o crescimento populacional por meio do desenvolvimento ativo da nação."
 GRN_focus_Developing_Public_Services: "Desenvolvendo os Serviços Públicos"
 GRN_focus_Developing_Public_Services_desc: "Melhorar e ampliar nossos sistemas e infraestrutura públicos elevará muito a qualidade de vida de nossos cidadãos. Faremos um pequeno conjunto de melhorias em educação, saúde e assistência social, além de desenvolver um serviço de internet mais seguro para o futuro de nossa nação."
 GRN_focus_Recruiting_More_Teachers: "Recrutando Mais Professores"
 GRN_focus_Recruiting_More_Teachers_desc: "Um grande problema de nosso sistema educacional é a falta de professores. Com turmas cada vez maiores por professor, muitos alunos abandonam os estudos simplesmente porque não têm como aprender de verdade. Por isso, devemos recrutar e tentar trazer mais professores, nacionais e estrangeiros, para ensinar e formar nossas crianças. Esta chave, esperamos, abrirá um futuro mais brilhante para todos que puderem aprender e crescer com uma educação."
 GRN_focus_Improving_Medical_Stockpiles: "Melhorando os Estoques Médicos"
 GRN_focus_Improving_Medical_Stockpiles_desc: "Medicamentos, pessoal e equipamentos. Estas são as principais coisas de que precisamos para atender adequadamente às necessidades de saúde de nossos cidadãos. Por isso, devemos melhorar a capacidade de armazenamento e o manuseio para garantir que possamos atender a qualquer necessidade que surja."
 GRN_focus_Creating_Concentrated_Internet_Services: "Criando Serviços de Internet Concentrados"
 GRN_focus_Creating_Concentrated_Internet_Services_desc: "O acesso à internet, como um todo, é praticamente um pilar das sociedades modernas e das economias desenvolvidas. Devemos montar algumas formas limitadas de aparato de internet para garantir que nossa nação possa se conectar melhor com o resto do mundo. Nossos cidadãos e serviços públicos também poderiam se beneficiar passivamente das eficiências que a internet pode oferecer em certas áreas."
 GRN_focus_Recruiting_More_Social_Workers: "Recrutando Mais Assistentes Sociais"
 GRN_focus_Recruiting_More_Social_Workers_desc: "Melhorar a quantidade e a qualidade do pessoal garantirá que nossos serviços sociais estejam à altura das necessidades da nação, caso a população cresça com nossos esforços de desenvolvimento. Embora o custo seja uma preocupação, ele não significa nada se acabarmos afastando as pessoas por elas saberem que não seriam cuidadas em caso de real necessidade."
 GRN_focus_Basic_Eastern_Roadworks: "Obras Rodoviárias Básicas no Leste"
 GRN_focus_Basic_Eastern_Roadworks_desc: "Sendo o leste a região menos desenvolvida da nação, devemos dar-lhe um impulso melhorando seu apoio logístico com estradas melhores. Embora não seja a maior das prioridades, à medida que continuamos a desenvolver e expandir a região, seria benéfico traçar de antemão a estrutura que eles poderão seguir, por falta de palavra melhor."
 GRN_focus_Greenlandic_Economy: "A Economia Groenlandesa"
 GRN_focus_Greenlandic_Economy_desc: "As pessoas precisam de materiais, precisam de um meio de vida e precisam da capacidade de trabalhar e ganhar o sustento. Por isso, desenvolver a economia, a capacidade de extrair recursos e a infraestrutura que sustente essas coisas precisará ser planejado e financiado."
 GRN_focus_Economic_Diversification: "Diversificação Econômica"
 GRN_focus_Economic_Diversification_desc: "Como nossa nação é limitada em muitos fatores, devemos desenvolver e garantir que a base esteja lançada para ampliarmos os meios de nossa economia. Depender apenas da pesca ou de formas quase feudais de sustento econômico não levará a nação nem seu povo a lugar nenhum. Devemos corrigir isso."
 GRN_focus_Western_Zoning: "Zoneamento Ocidental"
 GRN_focus_Western_Zoning_desc: "A capital fica no oeste, então iniciaremos as fases iniciais de zoneamento e desenvolvimento ali. Fazer o levantamento do terreno quanto à estabilidade e às necessidades, além dos meios para pôr uma indústria dedicada em funcionamento, custará muito mais que o normal. Mas, se vamos enfrentar os elementos em seu estado mais severo, devemos suportar e entender o custo que isso trará."
 GRN_focus_Eastern_Groundworks: "Obras Preliminares no Leste"
 GRN_focus_Eastern_Groundworks_desc: "Se quisermos chegar a algum lugar economicamente, em crescimento populacional ou, no mínimo, em estabilidade, devemos utilizar todas as terras disponíveis. Por isso, lançar as obras preliminares de nossos projetos no leste será essencial nestas fases iniciais de planejamento."
 GRN_focus_Basic_Industrialization: "Industrialização Básica"
 GRN_focus_Basic_Industrialization_desc: "Com a base e o zoneamento concluídos, podemos estabelecer uma manufatura pequena, mas fundamental, de que a nação precisará no futuro. É claro que, até resolvermos a situação da mineração, teremos de depender de importações de materiais. Graças a Deus podemos usar nossa conexão com a UE, via Dinamarca, para nos ajudar nisso."
 GRN_focus_Basic_Coastal_Manufacturing: "Manufatura Costeira Básica"
 GRN_focus_Basic_Coastal_Manufacturing_desc: "Ao complementar as práticas de pesca existentes, também podemos montar a estrutura para criar nossas próprias embarcações comerciais, que poderemos usar em negócios com a Dinamarca e com aqueles que desejam nos ajudar a desenvolver e crescer como nação."
 GRN_focus_Babys_First_Economy: "A Primeira Economia do Bebê"
 GRN_focus_Babys_First_Economy_desc: "Agora temos uma base central para preparar o terreno para que as pessoas venham trabalhar. Falta apenas desenvolver a infraestrutura para sustentá-las e cerca de outros sete problemas críticos que estagnam a nação. Mas um passo de cada vez, um passo de cada vez, chegaremos lá algum dia."
 GRN_focus_Infrastructure_Development: "Desenvolvimento de Infraestrutura"
 GRN_focus_Infrastructure_Development_desc: "A melhor forma de conectar e fazer crescer nossa nação é estabelecer um aparato de infraestrutura padronizado e flexível. Para isso, precisaremos contratar especialistas em geologia, engenharia e áreas afins para planejar os tipos de infraestrutura de que precisamos. Também precisaremos saber a melhor forma de desenvolvê-la e planejá-la pelo maior prazo possível antes que reformas sejam necessárias."
 GRN_focus_The_Network_Debate: "O Debate da Rede"
 GRN_focus_The_Network_Debate_desc: "Estabelecer uma rede rodoviária adequada será tão desafiador quanto praticamente qualquer coisa que tentaremos fazer. Por isso, precisaremos fazer o levantamento e lançar a base para o início do que serão nossas estradas. Começar pela capital, Nuuk, ajudará a definir um padrão e a criar, ao menos nas áreas costeiras do oeste, o coração pulsante que bombeia recursos e pessoas por todas as terras."
 GRN_focus_Narrow_Gauge_Standard: "O Padrão de Bitola Estreita"
 GRN_focus_Narrow_Gauge_Standard_desc: "Criar o padrão nacional para equipamentos e viagens ferroviárias definirá o ritmo e o piso de como desenvolveremos nossas ferrovias no futuro. A bitola estreita nos permite mais flexibilidade com o terreno, é mais barata de construir e manter, e será mais econômico garantir adequadamente a estrutura e a fundação do leito da via."
 GRN_focus_Capital_Course: "Rota da Capital"
 GRN_focus_Capital_Course_desc: "Partir da capital e se ramificar para assentamentos menores facilitará as viagens e melhorará a conectividade em distâncias médias. Claro que este é apenas um único passo, mas é preciso pôr um pé na frente do outro só para atravessar a sala, não é mesmo?"
 GRN_focus_Nuuk_Western_Railway: "Ferrovia Ocidental de Nuuk"
 GRN_focus_Nuuk_Western_Railway_desc: "Com a criação da NWR na Groenlândia, agora podemos conectar melhor os assentamentos dispersos na região próxima à capital e usá-la como base para futuros empreendimentos nas necessidades de transporte econômico e de pessoal da nação."
 GRN_focus_Infrastructure_Infancy: "Infância da Infraestrutura"
 GRN_focus_Infrastructure_Infancy_desc: "Com esses passos de bebê, cruciais, mas simples, dados para iniciar nossa infraestrutura nacional, agora podemos estabelecer um novo precedente, em evolução, para o crescimento e o desenvolvimento destas terras que controlamos."
 GRN_focus_Ministry_For_Mineral_Affairs: "Ministério de Assuntos Minerais"
 GRN_focus_Ministry_For_Mineral_Affairs_desc: "O Ministério de Assuntos Minerais, ou MMA, como alguns gostam de chamá-lo de brincadeira, é um órgão governamental dedicado que contratará especialistas em geologia, integridade estrutural e práticas gerais de mineração para garantir que os investimentos iniciais na extração de nossos recursos nacionais sejam feitos de forma segura e eficaz desde o começo. Isso garantirá que todas as expansões estejam alinhadas ao precedente estabelecido nestes primeiros dias."
 GRN_focus_Domesticating_Energy_Needs: "Domesticando as Necessidades Energéticas"
 GRN_focus_Domesticating_Energy_Needs_desc: "Nossa nação precisa de energia por princípio. Para aquecimento, eletricidade e as necessidades básicas da economia e de suas cadeias de suprimento. Por isso, investigaremos alguns depósitos de carvão e iniciaremos operações estratégicas de mineração para reduzir importações e melhorar as condições internas."
 GRN_focus_Limited_Strategic_Resource_Extraction: "Extração Limitada de Recursos Estratégicos"
 GRN_focus_Limited_Strategic_Resource_Extraction_desc: "O esforço LSRE é um plano para desenvolver operações de mineração em pequena escala de metais pesados ou minerais mais estratégicos dentro da nação. Coisas como o titânio, encontrado não longe da própria capital, mas que também tem bons depósitos no leste, caso queiramos ampliá-los."
 GRN_focus_Cornerstone_Creation: "Criação da Pedra Angular"
 GRN_focus_Cornerstone_Creation_desc: "Além do concreto, um dos principais pilares de uma economia moderna é sua capacidade de produzir aço. Bem, temos depósitos de carvão e minério de ferro, então por que não começar a primeira siderúrgica do bebê? Pode ser pequena, mas certamente poderemos usar os materiais para o desenvolvimento de nossa nação."
 GRN_focus_Extracting_Natural_Capital: "Extraindo Capital Natural"
 GRN_focus_Extracting_Natural_Capital_desc: "Dizem que há ouro naquelas colinas. Pois bem, dizem certo, e o ouro serve para muito mais do que se usar no corpo. Esse \"capital grátis\", mais ou menos, pode ser usado para instigar projetos futuros e ajudar a estabilizar orçamentos que exijam investimentos acima do normal."
 GRN_focus_Securing_Mining_Futures: "Garantindo o Futuro da Mineração"
 GRN_focus_Securing_Mining_Futures_desc: "Lidar com a burocracia, ajustar regulamentos e dar mais ênfase a operações de mineração voltadas à energia nos permite matar vários coelhos com uma só rocha cheia de energia."
 GRN_focus_The_Future: "O Futuro"
 GRN_focus_The_Future_desc: "Consertar o presente é a prioridade máxima, mas não se pode simplesmente consertar o presente sem se preparar para o futuro. Assim, o objetivo final de nossa nação será assegurar o futuro não apenas dos que vivem nas áreas costeiras, mas criar e construir um futuro para aqueles que querem viver na plataforma. Afinal, gelo é só água congelada e agora podemos destilar água doce, não é mesmo?"
 GRN_focus_Coastal_Economic_Zones: "Zonas Econômicas Costeiras"
 GRN_focus_Coastal_Economic_Zones_desc: "O objetivo final para um futuro de crescimento da Groenlândia é nossa capacidade de domar o interior. Muitos dizem que não se pode simplesmente viver sobre o gelo, e a isso respondemos: claro que não. No entanto, o que é o gelo senão água doce, e como obtemos água do gelo? Derretendo-o. Por isso, devemos desenvolver zonas econômicas específicas no litoral para preparar o terreno e nos dar a capacidade fiscal de iniciar os processos de destilação da Plataforma de Gelo. Será um empreendimento longo e tedioso, mas a lenta marcha para o norte pelo interior estará diante de nós se mantivermos a força de vontade para fazê-lo."
 GRN_focus_Foreign_Logistics_Hub_One: "Polo Logístico Estrangeiro Número Um"
 GRN_focus_Foreign_Logistics_Hub_One_desc: "O local mais central para montar uma zona econômica na costa é, na verdade, o ponto mais ao sul da ilha. Não longe de Tasiusaq, usaremos alguns dos fiordes de declives mais suaves para moldar e criar um extenso aparato de porto e ancoradouro, como uma \"cidade\". Esta área de concentração ajudará nos avanços do oeste na grande jornada rumo ao norte."
 GRN_focus_Foreign_Logistics_Hub_Two: "Polo Logístico Estrangeiro Número Dois"
 GRN_focus_Foreign_Logistics_Hub_Two_desc: "Complementando o local mais central para montar uma zona econômica na costa, estabeleceremos um aparato semelhante perto da cidade de Itilleq. Esta área de concentração ajudará nos avanços do leste na grande jornada rumo ao norte e unirá as duas zonas do sul em uma só CCEZ, ou Zona Econômica Costeira Conectada."
 GRN_focus_West_Hub_Distillation_Facility: "Instalação de Destilação do Polo Oeste"
 GRN_focus_West_Hub_Distillation_Facility_desc: "Estabelecer uma instalação de destilação abrangente para iniciar as operações de extração de gelo da Plataforma de Gelo nos permitirá aumentar o suprimento interno de água e criar passivamente um caminho para o norte através da plataforma. Esse processo será caro e nos obrigará a importar pessoal por um período prolongado, até podermos treinar e contratar locais. Mas a meta de longo prazo de desenvolver e tornar utilizáveis as terras aprisionadas sob os ermos congelados valerá a pena."
 GRN_focus_East_Hub_Distillation_Facility: "Instalação de Destilação do Polo Leste"
 GRN_focus_East_Hub_Distillation_Facility_desc: "Ampliando o uso geral da CCEZ que criamos, a segunda grande instalação de destilação, para complementar os avanços do oeste, está agora em obras. A destilação do Polo Leste fará o mesmo, mas trabalhando pelo progresso do leste por meio de um avanço unificado rumo ao norte."
 GRN_focus_Southern_Fjords_Railway: "Ferrovia dos Fiordes do Sul"
 GRN_focus_Southern_Fjords_Railway_desc: "Estabelecer uma ferrovia na região nos permite não apenas conectar melhor toda a CCEZ, mas também ajuda a transportar o suprimento de água a diferentes áreas da região sul, para uso residencial e comercial onde possível."
 GRN_focus_Staging_Zones_For_The_Shelf: "Zonas de Concentração para a Plataforma"
 GRN_focus_Staging_Zones_For_The_Shelf_desc: "Ao lançar nossa grande ambição de domar a Grande Plataforma de Gelo, primeiro devemos montar zonas de concentração estratégicas para garantir que possamos de fato aproveitar as águas congeladas, em vez de simplesmente jogá-las nos oceanos."
 GRN_focus_The_Great_Eastern_Staging_Grounds: "As Grandes Áreas de Concentração do Leste"
 GRN_focus_The_Great_Eastern_Staging_Grounds_desc: "O leste é a parte menos povoada da ilha; com isso em mente, precisaremos contratar especialistas para essencialmente viver ali e montar a base para a eventual marcha rumo ao interior da Grande Plataforma de Gelo. Para isso, usaremos a ilha de Tingmiarmit como área de concentração-chave e começaremos extraindo e aplainando o terreno do litoral imediato da própria ilha principal."
 GRN_focus_Capital_Staging_Works: "Obras de Concentração da Capital"
 GRN_focus_Capital_Staging_Works_desc: "A região em torno da capital, Nuuk, é uma das áreas mais desenvolvidas da ilha. Faz sentido, portanto, que a principal área de concentração do oeste seja montada na região da capital. Um campus dedicado e abrangente de usinas de destilação e centros de pesquisa e desenvolvimento, além de um considerável subsídio governamental para importar especialistas e professores, permitirá a eventual transferência das instalações aos groenlandeses. Isso levará considerável tempo e recursos, mas derreter toda aquela água congelada e descobrir o verdadeiro leito rochoso do interior da ilha não é tarefa pequena."
 GRN_focus_Meeting_Needs: "Atendendo às Necessidades"
 GRN_focus_Meeting_Needs_desc: "Para criar um aparato tão elaborado quanto pretendemos, devemos montar cadeias de suprimento locais ou, ao menos, o mais locais possível. Pequenos negócios para atender às necessidades industriais e comerciais complementarão o desenvolvimento das áreas de concentração e, assim, definirão os padrões para o eventual avanço rumo ao interior."
 GRN_focus_Supplying_Outposts: "Abastecendo os Postos Avançados"
 GRN_focus_Supplying_Outposts_desc: "Embora oficialmente a Groenlândia não tenha força militar, se quisermos ter algum avanço razoável na criação de uma linha de suprimento para dentro da Grande Plataforma, devemos garantir que todo tipo de necessidade de suprimento seja atendido. Por isso estabeleceremos uma indústria de armas extremamente pequena, voltada a abastecer os postos com armas e munições úteis para a caça e para a autodefesa contra possíveis saqueadores. Afinal, no meio do nada, quem pode ouvir você gritar?"
 GRN_focus_General_National_Investments: "Investimentos Nacionais Gerais"
 GRN_focus_General_National_Investments_desc: "Mineração, transporte e melhorias gerais devem ser feitos para a estabilidade fiscal e interna de nossa nação. Com o palco montado e as obras preliminares começando para valer, agora temos o teatro em que daremos início à peça de nossos povos enquanto domamos a Grande Plataforma de Gelo nos próximos anos. Com isso, as ferroviárias NWR e SFR serão ligadas para formar a Ferrovia dos Grandes Fiordes Ocidentais, ou GWFR."
 GRN_focus_Greater_Greenland_Act: "Lei da Grande Groenlândia"
 GRN_focus_Greater_Greenland_Act_desc: "Financiamento dedicado para melhorar as famílias da nação e para buscar aqueles de origens culturais e étnicas semelhantes que talvez queiram viver em um reino mais unido do que o atual. Esta seção da lei é dedicada a povoar a Região Oeste."
 GRN_focus_Eastern_Population_Act: "Lei da População do Leste"
 GRN_focus_Eastern_Population_Act_desc: "Financiamento dedicado para melhorar as famílias da nação e para buscar aqueles de origens culturais e étnicas semelhantes que talvez queiram viver em um reino mais unido do que o atual. Esta seção da lei, derivada da Lei da Grande Groenlândia, é dedicada a povoar a Região Leste."
 GRN_focus_Battle_For_Independence: "Batalha pela Independência"
 GRN_focus_Battle_For_Independence_desc: "Chegamos a uma encruzilhada. O parlamento dinamarquês começou a tomar medidas relacionadas ao nosso status como nação. Seja o movimento positivo ou negativo, precisaremos nos proteger e, por isso, começaremos a investir pesado em campanhas de pressão para aumentar nosso reconhecimento entre as nações, esperando forçar, mais ou menos, uma resolução pacífica para a independência."
 GRN_focus_Rushed_Mobilization_Efforts: "Esforços de Mobilização Apressados"
 GRN_focus_Rushed_Mobilization_Efforts_desc: "Decidimos que não queremos mais nos curvar às manobras opressivas dinamarquesas. Por isso, mobilizaremos às pressas o mínimo indispensável de que sabemos que precisaremos para defender a ilha de qualquer incursão dinamarquesa séria."
 GRN_focus_Organizing_Fundamentals_In_Training: "Organizando os Fundamentos do Treinamento"
 GRN_focus_Organizing_Fundamentals_In_Training_desc: "Apressando a criação de uma instalação básica de treinamento, precisaremos dela para dar o mais rápido dos cursos intensivos se quisermos defender nossa ilha da força de invasão que se aproxima."
 GRN_focus_If_It_Floats_Its_A_Boat: "Se Flutua, É um Barco"
 GRN_focus_If_It_Floats_Its_A_Boat_desc: "A marinha dinamarquesa provavelmente liderará a investida para tomar a ilha. Embora seja custoso, devemos improvisar alguma coisa para ganhar tempo se quisermos ser considerados uma nação séria no cenário mundial."
 GRN_focus_Removing_The_Last_Loose_Ends: "Removendo as Últimas Pontas Soltas"
 GRN_focus_Removing_The_Last_Loose_Ends_desc: "Ao romper nossos laços com a Coroa Dinamarquesa, agora somos nossa própria nação e, assim, não temos os privilégios originais que o status colonial que tínhamos outrora nos dava. Por isso, precisaremos reorganizar certos aspectos e procurar sanar possíveis deficiências que encontrarmos."
 GRN_focus_Stabilizing_Domestic_Short_Comings: "Estabilizando as Deficiências Internas"
 GRN_focus_Stabilizing_Domestic_Short_Comings_desc: "Reformular os esforços administrativos e simplificar todos os serviços governamentais sob nosso governo nacional nos permitirá obter um retrato real da situação atual."
 GRN_focus_Greenland_Armed_Services: "Forças Armadas da Groenlândia"
 GRN_focus_Greenland_Armed_Services_desc: "Com nossa recém-conquistada independência, agora temos a defesa totalmente sob nosso controle. Não temos muito, mas é preciso começar por algum lugar. Certo?"
 GRN_focus_A_New_Chapter: "Um Novo Capítulo"
 GRN_focus_A_New_Chapter_desc: "A partir de hoje, viramos a página. Buscamos construir, prosperar e melhorar tanto a nação quanto a vida de nossos cidadãos, a fim de traçar o rumo de um futuro mais brilhante para todos que desejam ver e viver na Groenlândia."
 GRN_focus_Northern_Political_Lights: "Luzes Políticas do Norte"
 GRN_focus_Northern_Political_Lights_desc: "Com nossas liberdades recém-conquistadas, agora podemos abrir as portas àqueles que desejam disputar cargos públicos. Claro que isso também significa que teremos de lidar com aqueles que potencialmente querem abusar do sistema. No entanto, somos uma nação de valores democráticos e, por isso, depositaremos nossa confiança no sistema e no povo."
 GRN_focus_Atassut_Claims_Victory: "Atassut Reivindica a Vitória"
 GRN_focus_Atassut_Claims_Victory_desc: "Antes dos dias da independência, nossa política estava estagnada. Todos só se concentravam em se libertar do jugo dinamarquês. Agora que estamos livres, podemos começar a forjar um novo caminho. Um caminho de construção constante de valores sociais, combinada com uma mentalidade fiscalmente conservadora, para equilibrar nossa nação rumo ao futuro."
 GRN_focus_Making_New_Greenlandic_Standards: "Criando Novos Padrões Groenlandeses"
 GRN_focus_Making_New_Greenlandic_Standards_desc: "Reformar a educação em torno de nosso idioma nativo, aumentar o número de professores e, em geral, elevar o nível do que nossos alunos podem fazer ampliará muito o potencial de nossa nação."
 GRN_focus_Improving_Medical_Facilities: "Melhorando as Instalações Médicas"
 GRN_focus_Improving_Medical_Facilities_desc: "Por meio de melhorias gerais nas aquisições e na melhoria das plantas das instalações médicas, podemos estabelecer um novo ritmo de cuidado e tratamento, com maior facilidade de circulação e acesso aos recursos necessários."
 GRN_focus_Casting_Better_Social_Nets: "Lançando Melhores Redes de Proteção Social"
 GRN_focus_Casting_Better_Social_Nets_desc: "Reformar os programas sociais para permitir uma melhor alocação de recursos amparará aqueles de nossa nação que talvez estejam passando por má sorte ou simplesmente no fim de sua jornada."
 GRN_focus_Domestic_Agriculture_Projects: "Projetos de Agricultura Nacional"
 GRN_focus_Domestic_Agriculture_Projects_desc: "Garantir a agricultura nacional significa ter uma fonte de alimento mais estável. Isso, somado a nossos HFPs, \"Projetos Agrícolas em Condições Hostis\", continuará a beneficiar e a fazer crescer a economia e a população de nossa nação."
 GRN_focus_Increasing_Industrial_Development: "Aumentando o Desenvolvimento Industrial"
 GRN_focus_Increasing_Industrial_Development_desc: "Crescer e diversificar a economia de forma constante permite uma abordagem mais estável e robusta tanto dos assuntos internos quanto de possíveis assuntos externos."
 GRN_focus_General_Armaments: "Armamentos Gerais"
 GRN_focus_General_Armaments_desc: "Pequenos investimentos para melhorar os armamentos, tanto em qualidade quanto em aquisição geral, significam que nossas modestas forças armadas estarão em melhores condições de defender nossa nação e seus cidadãos."
 GRN_focus_Growing_Power_Production: "Ampliando a Produção de Energia"
 GRN_focus_Growing_Power_Production_desc: "Melhorar nossa capacidade nacional de produção de energia nos permite fazer crescer a economia e melhorar a qualidade de vida de nossos cidadãos por meio de eletricidade barata."
 GRN_focus_National_Alumina_Research_Institute: "Instituto Nacional de Pesquisa de Alumina"
 GRN_focus_National_Alumina_Research_Institute_desc: "O complexo NARI é um centro dedicado de pesquisa e desenvolvimento de alumina e de outros minerais de difícil extração. O objetivo é encontrar formas de melhorar e tornar mais eficientes os meios de obter esses minerais. A alumina é encontrada principalmente em alta concentração no minério de bauxita, mas não temos bauxita. Temos, porém, muitos depósitos de feldspato, e os minerais de feldspato costumam ter até quase 20% de seu peso em alumina; assim, por meio de uma medida mais custosa, conseguimos assegurar um suprimento nacional. Mas não é muito, e o alumínio é usado em muitas coisas, então devemos expandir nesse campo o máximo possível."
 GRN_focus_Military_Investment_Package: "Pacote de Investimento Militar"
 GRN_focus_Military_Investment_Package_desc: "Este pacote geral de investimento será destinado a melhorar a qualidade do equipamento e a aumentar o soldo dos soldados. Parte dos recursos também está sendo reservada para padronizar melhor as instalações de treinamento onde necessário."
 GRN_focus_Demokraatit_Secures_Victory: "Demokraatit Garante a Vitória"
 GRN_focus_Demokraatit_Secures_Victory_desc: "O Partido Demokraatit teve por muito tempo uma abordagem quase de azarão na política groenlandesa. Por estar bastante alinhado aos dois principais partidos, há diferenças sutis que costumam empurrar o partido para uma espécie de \"terceiro lugar perpétuo\". Contudo, isso muda hoje, pois, com nossa vitória na era da independência, agora podemos melhorar com segurança a nação e seus cidadãos da melhor forma possível."
 GRN_focus_Economic_Assimilation_Visas: "Vistos de Assimilação Econômica"
 GRN_focus_Economic_Assimilation_Visas_desc: "Usar o sistema de vistos para ajudar a desenvolver a nação e fazer crescer a população de forma constante ajudará muito no planejamento futuro da própria nação."
 GRN_focus_Improved_Community_Programs: "Programas Comunitários Aprimorados"
 GRN_focus_Improved_Community_Programs_desc: "O entendimento comum entre a polícia e os cidadãos que ela protege é um dos principais motores de coesão em oposição à discórdia. Devemos garantir que medidas consistentes sejam tomadas para manter a maioria na mesma página, de modo que, se e quando algo acontecer, não acabemos como os dos Estados Unidos, por exemplo."
 GRN_focus_Rewriting_Mining_Regulations: "Reescrevendo os Regulamentos de Mineração"
 GRN_focus_Rewriting_Mining_Regulations_desc: "Os regulamentos relativos às práticas de mineração são grosseiramente exagerados e simplesmente não correspondem ao estado atual da nação. Por isso, precisaremos abordar as coisas de novo para padronizar melhor o setor."
 GRN_focus_Hospice_Care_Funding: "Financiamento de Cuidados Paliativos"
 GRN_focus_Hospice_Care_Funding_desc: "Fornecer financiamento melhor e mais dedicado aos cuidados paliativos garantirá que as famílias possam se concentrar melhor no que precisam fazer, sem se preocupar com a negligência de seus idosos pelo simples fato de viverem o dia a dia."
 GRN_focus_Creating_A_Basic_Office_Sector: "Criando um Setor de Escritórios Básico"
 GRN_focus_Creating_A_Basic_Office_Sector_desc: "Continuar a diversificar nossa economia significa que precisaremos investir em indústrias pequenas, mas significativas, de escritório e de tecnologia, para garantir que possamos continuar a melhorar nossa nação e o modo de vida de seus cidadãos."
 GRN_focus_Expanding_Existing_HFPs: "Expandindo os HFPs Existentes"
 GRN_focus_Expanding_Existing_HFPs_desc: "Expandir nossos atuais Projetos Agrícolas em Condições Hostis por meio de instalações de agricultura vertical e da infraestrutura de destilação necessária para abastecê-los de água da Plataforma de Gelo criará um suprimento interno crescente de alimentos e, ao mesmo tempo, contribuirá para nosso objetivo de avançar rumo ao interior."
 GRN_focus_Growing_REM_Industries: "Ampliando as Indústrias de REM"
 GRN_focus_Growing_REM_Industries_desc: "Para melhorar nosso valor geoestratégico, precisaremos ampliar nossas indústrias de REM, ou o setor de Metais de Terras Raras. Instalações direcionadas de mineração e processamento nos permitirão usá-los como moeda de negociação em futuros acordos comerciais."
 GRN_focus_Growing_Domestic_Arms_Production: "Ampliando a Produção Nacional de Armas"
 GRN_focus_Growing_Domestic_Arms_Production_desc: "Garantir que possamos equipar nossos militares com armamentos nos dá o conforto de saber que nossas forças armadas podem e vão defender nossas terras de quaisquer forças abusivas."
 GRN_focus_Expanding_Citizen_Development_Grants: "Expandindo os Subsídios de Desenvolvimento Cidadão"
 GRN_focus_Expanding_Citizen_Development_Grants_desc: "O caminho para a cidadania é marcado unicamente pela contribuição ao desenvolvimento da nação e, por isso, ampliaremos o programa de bolsas para aumentar a capacidade de indivíduos que podem, ao mesmo tempo, vir e percorrer o caminho para se tornarem novos cidadãos groenlandeses."
 GRN_focus_Siumut_Wins_Once_More: "Siumut Vence Mais Uma Vez"
 GRN_focus_Siumut_Wins_Once_More_desc: "Um dos partidos que mais tempo esteve no comando é o Partido Siumut. O partido detém a maioria das vitórias eleitorais da era pré-independência e parece manter o rumo na era pós-independência. Agora é hora de nos concentrarmos em mais do que apenas a independência; agora nos concentramos em melhorar a vida dos cidadãos e dos trabalhadores."
 GRN_focus_Encouraging_State_Sanctioned_Immigration: "Incentivando a Imigração Autorizada pelo Estado"
 GRN_focus_Encouraging_State_Sanctioned_Immigration_desc: "Nosso crescimento interno não é lá muito bom. Se quisermos preencher nosso mercado de trabalho e fazer crescer nossa economia, temos de buscar uma forma de imigração constante sempre que possível."
 GRN_focus_Immigration_Quotas: "Cotas de Imigração"
 GRN_focus_Immigration_Quotas_desc: "Com o desenvolvimento constante de nossa nação, nossa maior preocupação agora passa a ser ter gente para empregar. Fazer a economia crescer só adianta até certo ponto quando, sem ironia, faltam pessoas para ocupar as vagas. Por isso, começaremos a tentar atingir cotas de imigração específicas para garantir que nossa população acompanhe nossa economia."
 GRN_focus_Expanding_Schooling_Subjects: "Ampliando as Disciplinas Escolares"
 GRN_focus_Expanding_Schooling_Subjects_desc: "Ampliar os cursos eletivos oferecidos por nossas escolas permite que os alunos busquem empregos e futuros que desejam ter, ao mesmo tempo mantendo a melhoria das habilidades gerais essenciais que ajudam nossos alunos a crescer e se preparar para a vida adulta."
 GRN_focus_Social_Reserve_Funds: "Fundos de Reserva Social"
 GRN_focus_Social_Reserve_Funds_desc: "À medida que nossa nação continua crescendo tanto em população quanto em economia, encontramos um difícil equilíbrio em financiar e alocar adequadamente orçamentos a todos os necessitados. Por isso, para manter essas carências sob controle, criaremos o Fundo de Reserva Social, que é essencialmente uma poupança federal para programas sociais. Deve dar mais tranquilidade aos cidadãos que precisarem dessas redes de proteção."
 GRN_focus_Tungsten_Industries: "Indústrias de Tungstênio"
 GRN_focus_Tungsten_Industries_desc: "Nas terras do centro-leste há montes de depósitos de tungstênio prontos para a colheita. Por isso, criaremos um complexo industrial dedicado para minerar, processar e refinar o minério em barras brutas ou produtos secundários que exijam o recurso."
 GRN_focus_Core_Industries_Complex: "Complexo de Indústrias Centrais"
 GRN_focus_Core_Industries_Complex_desc: "Reabrir antigas minas de ferro que ainda têm material a extrair, além de abrir novas minas, nos permitirá ampliar nossas capacidades industriais. Com isso em mente, criaremos um complexo industrial semelhante para transformar o minério extraído nas necessidades da nação."
 GRN_focus_Growing_More_Crops: "Cultivando Mais Alimentos"
 GRN_focus_Growing_More_Crops_desc: "Garantindo o suprimento alimentar cada vez maior e diversificado que esperamos criar por meio de nossas iniciativas de agricultura vertical, assim como a infraestrutura de destilação pré-planejada para sustentar essas instalações, agora podemos continuar num ritmo constante de expansão e esperar que as demandas avancem sobre a Plataforma de Gelo com mais rapidez do que o previsto."
 GRN_focus_Naval_Investments: "Investimentos Navais"
 GRN_focus_Naval_Investments_desc: "Ampliar nossa capacidade nacional de construção naval nos permite ter uma marinha. Se pudermos ter uma marinha, então poderemos proteger nossas águas costeiras e ter algum tipo de presença internacional, por menor que seja a princípio."
 GRN_focus_Strategic_Stockpiles: "Estoques Estratégicos"
 GRN_focus_Strategic_Stockpiles_desc: "Estabelecer estoques estratégicos permite uma reserva de armas de fogo acessíveis para equipar nossos militares e, se necessário, o próprio povo. Claro que esperamos que nunca se chegue a isso, mas quem sabe que mentes doentias e distorcidas existem por aí."
 GRN_focus_Polar_Party_Wins: "O Partido Polar Vence?"
 GRN_focus_Polar_Party_Wins_desc: "Considerado outrora um partido extinto, o partido polar é provavelmente o mais próximo de um partido conservador mais tradicional que se pode ter na Groenlândia. Assim, sua vitória, embora confusa, inspira esperança de uma mão firme e de calma social em meio a toda a algazarra externa com a qual algumas nações estão lutando."
 GRN_focus_Family_Subsidies: "Subsídios Familiares"
 GRN_focus_Family_Subsidies_desc: "Para melhorar o crescimento populacional interno e não depender demais dos esforços de imigração, criaremos um subsídio dedicado para ajudar as famílias nos primeiros anos da infância. Dessa forma, a principal preocupação, que costuma ser a capacidade financeira, deixa de ser uma preocupação real. Para evitar abusos, limitaremos a forma como os subsídios são aplicados nas compras e os colocaremos em um cartão bancário de padrão nacional."
 GRN_focus_Childcare_Act: "Lei da Assistência à Infância"
 GRN_focus_Childcare_Act_desc: "A capacidade de os pais cuidarem dos filhos enquanto tentam pagar as contas e afins é um equilíbrio delicado e muitas vezes tedioso. Por isso, a Lei da Assistência à Infância é um pacote de gastos para melhorar e montar creches e centros de educação infantil para cuidar e zelar pelas crianças."
 GRN_focus_Foreign_Leasing_Act: "Lei do Arrendamento Estrangeiro"
 GRN_focus_Foreign_Leasing_Act_desc: "A FLA é uma legislação em dois golpes. A primeira parte é melhorar os esforços de educação e pesquisa para aprimorar nossa compreensão da extração mineral e da melhor forma de minerar o que há sob nossas terras. A segunda é, essencialmente, instigar empresas estrangeiras a fazê-lo por nós ou, no mínimo, montar as bases para que pudéssemos assumir tudo a qualquer momento, se necessário."
 GRN_focus_Steeling_Resolve_Act: "Lei do Fortalecimento da Determinação"
 GRN_focus_Steeling_Resolve_Act_desc: "A legislação da SRA é um pacote de investimentos direcionado à ampliação da oferta doméstica de ferro e carvão. Esses recursos críticos ajudarão a expandir a base de nossa economia e a capacidade doméstica de produzir tanto para as indústrias quanto para necessidades da população, como moradia e instituições públicas."
 GRN_focus_Expand_Petrochemical_Industries: "Expandir as Indústrias Petroquímicas"
 GRN_focus_Expand_Petrochemical_Industries_desc: "Ser capaz de estabelecer, quanto mais expandir, qualquer forma do setor da indústria petroquímica fortalecerá bastante nossa segurança doméstica contra déficits comerciais excessivos."
 GRN_focus_Greenlandic_Forestries: "Silvicultura Groenlandesa"
 GRN_focus_Greenlandic_Forestries_desc: "Criar novas fazendas de árvores por meio das iniciativas de Estufas e Agricultura Vertical que a nação já possui nos permitirá ter um setor madeireiro crescente e diversificado."
 GRN_focus_Industrial_Projects: "Projetos Industriais"
 GRN_focus_Industrial_Projects_desc: "Melhorar o desenvolvimento do leste para equipará-lo ao da região oeste reduzirá bastante a disparidade entre eles; assim, melhorar o setor industrial por lá deve ser muito benéfico."
 GRN_focus_Eastern_Armaments: "Armamentos do Leste"
 GRN_focus_Eastern_Armaments_desc: "Nosso projeto \"Desenvolver o Leste\" segue indo muito bem, se me permitem dizer. Criar novas indústrias de todos os tipos, além de garantir esforços de imigração para ajudar a empregar e complementar o preenchimento de vagas domésticas, ajudará a criar uma economia robusta e um futuro brilhante para o nosso povo."
 GRN_focus_Defensive_Improvements: "Melhorias Defensivas"
 GRN_focus_Defensive_Improvements_desc: "Melhorar nossa capacidade de nos defender de incursões inimigas precipitadas será o baluarte de nossa segurança nacional. Afinal, realizar um desembarque na ilha não é algo simples."
 GRN_focus_Qulleq_Party_Secures_Victory: "Partido Qulleq Garante a Vitória"
 GRN_focus_Qulleq_Party_Secures_Victory_desc: "Numa reviravolta interessante, o Partido Qulleq venceu a eleição. Conhecido como um partido pró-industrialização, ele já foi o principal partido do \"independência já\", fora dos detentores originais do poder no passado. Embora alguns se preocupem que isso signifique uma qualidade de vida menor em nome do desenvolvimento, muitos no partido garantem que, devido à situação mais interessante em que a nação se encontra, a qualidade de vida só vai melhorar. Seja como for, o partido terá que provar o que diz nas próximas semanas."
 GRN_focus_On_Site_Family_Support: "Apoio Familiar no Local de Trabalho"
 GRN_focus_On_Site_Family_Support_desc: "Dia de levar os filhos ao trabalho, todos os dias. As empresas começarão aos poucos a integrar certos aspectos essenciais do cuidado infantil, permitindo que os familiares continuem indo trabalhar sem sentir que abandonarão seus filhos."
 GRN_focus_Contractual_Labor_Act: "Lei do Trabalho Contratual"
 GRN_focus_Contractual_Labor_Act_desc: "A CLA é uma legislação que dá poder à administração para ajudar os serviços de fronteira e imigração a encontrar candidatos adequados a Vistos de Trabalho. Esses vistos permitirão a entrada no país por um período prolongado para quem desejar trabalhar aqui; não são vistos de visita, mas apenas uma expansão do Programa de Subsídios ao Desenvolvimento que já temos."
 GRN_focus_Rewriting_The_Tax_Codes: "Reescrevendo os Códigos Tributários"
 GRN_focus_Rewriting_The_Tax_Codes_desc: "Fundamentalmente, os códigos tributários são muito hostis aos negócios; por isso, vamos recomeçar e reformá-los com base na composição econômica atual."
 GRN_focus_Building_Up_Domestic_Capital: "Construindo o Capital Doméstico"
 GRN_focus_Building_Up_Domestic_Capital_desc: "Nossas minas de ouro também podem ser complementadas com a extração de pequenas quantidades de diamantes. Podemos usar esse capital bruto, vendendo-o no exterior, para financiar nossos esforços de desenvolvimento doméstico."
 GRN_focus_Securing_Energy_Needs: "Garantindo as Necessidades Energéticas"
 GRN_focus_Securing_Energy_Needs_desc: "As vastas necessidades de nossa nação em constante desenvolvimento são a pedra angular do próprio desenvolvimento. Temos os recursos e, portanto, devemos poder usá-los como bem entendermos."
 GRN_focus_Military_Production_Means: "Meios de Produção Militar"
 GRN_focus_Military_Production_Means_desc: "Nossa capacidade de defender e proteger não apenas nossos cidadãos, mas também a riqueza natural e a qualidade de vida cada vez maior deles, é fundamental. Não podemos nos acomodar no conforto sabendo que, a qualquer momento, alguma nação pode tentar dilapidá-lo para seus próprios fins maliciosos."
 GRN_focus_Continued_Crop_Diversification_Efforts: "Esforços Contínuos de Diversificação de Culturas"
 GRN_focus_Continued_Crop_Diversification_Efforts_desc: "Continuamos a usar as HFPs criadas nos tempos anteriores à independência, enquanto o próprio banco nacional de sementes também continua a crescer e a se diversificar nas culturas que abriga. Nossa nação prosperará por meio do desenvolvimento contínuo de centros de destilação que apoiam instalações agrícolas domésticas onde muitos achavam que plantas jamais cresceriam."
 GRN_focus_Expanded_Eastern_Industries: "Indústrias do Leste Ampliadas"
 GRN_focus_Expanded_Eastern_Industries_desc: "Trabalhadores, empresas e assim por diante. Esse é o ciclo de desenvolvimento que esperamos continuar e também aplicar mais no leste do que no oeste, já que a disparidade entre os dois, ao menos em números brutos de população, parece ser bastante grande. Ao focar mais no leste, esperamos reduzir a disparidade geral em nível nacional e criar uma economia mais coesa e distribuída."
 GRN_focus_Economic_Automation_Act: "Lei da Automação Econômica"
 GRN_focus_Economic_Automation_Act_desc: "A EAA é uma legislação para deliberar e, por fim, escolher qual setor econômico queremos impulsionar essencialmente por completo rumo à automação. Assim, os trabalhadores ficam livres para buscar emprego em outros setores e nossa situação econômica geral, com sorte, se estabilizará melhor devido a esse déficit de mão de obra em relação aos empregos disponíveis."
 GRN_focus_Inuit_Ataqatigiit_Election_Victory: "Vitória Eleitoral do Inuit Ataqatigiit"
 GRN_focus_Inuit_Ataqatigiit_Election_Victory_desc: "Uma espécie de azarão na política groenlandesa, o IA é visto como um meio-termo entre o pensamento socialista democrático mais comum e um socialismo de mercado mais tradicional. O partido acredita em certos princípios marxistas, mas parece seguir mais o equilíbrio titoísta entre a barganha econômica entre blocos de nações e a coesão social para evitar escolher um lado diretamente. Embora a Groenlândia, é claro, tenha estado na OTAN, não há obrigação de se conformar economicamente."
 GRN_focus_Greencare_Act: "Lei Greencare"
 GRN_focus_Greencare_Act_desc: "A Lei Greencare, ou Lei Greenlandcare, é um projeto orçamentário geral para melhorar os salários da equipe médica, a qualidade dos equipamentos e o treinamento, além de buscar expandir e/ou abrir novas instalações onde for necessário."
 GRN_focus_Steeled_Veins_Act: "Lei das Veias de Aço"
 GRN_focus_Steeled_Veins_Act_desc: "Carvão e ferro, o sangue vital de qualquer economia moderna. Embora o carvão em si não seja tão útil quanto já foi, dadas as alternativas energéticas disponíveis, não podemos simplesmente ignorar a quantidade e, em algumas áreas, a qualidade bruta de nossas jazidas de carvão e ferro. Portanto, começaremos a investir em operações de pequena escala em ambos para reforçar os suprimentos atuais para uso doméstico e potencial exportação."
 GRN_focus_Pro_Mining_And_Miners_Act: "Lei Pró-Mineração e Mineiros"
 GRN_focus_Pro_Mining_And_Miners_Act_desc: "O projeto PMMA foi concebido para melhorar a qualidade e a quantidade da mineração, ao mesmo tempo em que adota esforços estratégicos de automação para melhorar a condição geral de ser mineiro, limitando a frequência e o número de trabalhadores de que precisaríamos na mina a qualquer momento."
 GRN_focus_Feldspar_Extractions_Act: "Lei de Extração de Feldspato"
 GRN_focus_Feldspar_Extractions_Act_desc: "Segundo os dados atuais de levantamento geológico, a única fonte séria de óxidos de alumina está nas jazidas de feldspato no oeste. Embora o mineral costume ter mais de 20% de seu peso em óxido de alumina, não é a fonte mais viável comercialmente. Assim, a operação de mineração precisa ficar sob controle total do governo até que algum avanço científico mude essa realidade. De todo modo, precisamos de alumínio para nossa economia e, por isso, investiremos em operações de crescimento lento para extrair o feldspato e processar os materiais necessários a partir do mineral."
 GRN_focus_Feeding_The_People_Act: "Lei de Alimentar o Povo"
 GRN_focus_Feeding_The_People_Act_desc: "Ampliar nossa situação alimentar doméstica, além das proeminentes pescarias, é uma ótima forma de crescer nossa economia e nossa população. Com a criação do banco nacional de sementes, estamos bem encaminhados para fazer da Groenlândia um modelo de avanços nos parâmetros de estufas e agricultura vertical da ciência agrícola."
 GRN_focus_The_Continual_Industry_Act: "Lei da Indústria Contínua"
 GRN_focus_The_Continual_Industry_Act_desc: "Crescer nossa economia significa melhorar nossa manufatura e nossa base industrial em geral. Por meio de pequenos investimentos nas indústrias primárias e secundárias, podemos continuar a ver um crescimento e um desenvolvimento como nunca antes."
 GRN_focus_Greenland_Technology_Center: "Centro de Tecnologia da Groenlândia"
 GRN_focus_Greenland_Technology_Center_desc: "Investir em P&D voltado a avanços gerais de desenvolvimento e sustentação em nosso ambiente ecológico será fundamental para os esforços de desenvolvimento daqui para frente."
 GRN_focus_Arming_The_Nation: "Armando a Nação"
 GRN_focus_Arming_The_Nation_desc: "Nossa defesa é a chave para a continuidade de nossa independência. Se queremos continuar livres, devemos desenvolver os meios para isso."
 GRN_focus_Silver_And_Gold_Act: "Lei da Prata e do Ouro"
 GRN_focus_Silver_And_Gold_Act_desc: "Melhorar nossa segurança doméstica criando valiosas moedas de troca em negociações internacionais nos permitirá afastar possíveis invasores por um pouco mais de tempo do que sem isso. Assim, buscaremos iniciar operações de mineração limitadas de paládio e de alguns metais de terras raras valiosos aos quais temos acesso."
 GRN_focus_Naleraq_Elective_Victory: "Vitória Eleitoral do Naleraq"
 GRN_focus_Naleraq_Elective_Victory_desc: "Com a nação nas garras de uma independência recente, não é de se admirar que o partido mais nacionalista, o Naleraq, tenha acabado vencendo. Suas políticas buscam fortalecer diretamente e comprovar a virtude groenlandesa rumo à sua soberania conquistada por si mesma. Ainda assim, alguns se perguntam se isso não seria um passo rápido demais rumo a algo de natureza um pouco mais hostil."
 GRN_focus_Efficiency_Education_Courses: "Cursos de Educação em Eficiência"
 GRN_focus_Efficiency_Education_Courses_desc: "O programa EE é um projeto de investimento educacional que busca ensinar, além de experimentar, novas formas de transmitir, armazenar e gerenciar o uso de energia em climas mais frios. Aumentar a eficiência nessas áreas torna nossa economia mais econômica sem que precisemos nos preocupar com problemas de emprego."
 GRN_focus_Family_Planning_And_Assistance_Board: "Conselho de Planejamento e Assistência Familiar"
 GRN_focus_Family_Planning_And_Assistance_Board_desc: "O FPAB é uma instituição governamental dedicada a criar, manter e fazer crescer as famílias da nação. Nossa população é pequena e não queremos inundar o país com imigrantes aleatórios se pudermos simplesmente cuidar bem de nós mesmos."
 GRN_focus_Family_Homes_Act: "Lei das Casas Familiares"
 GRN_focus_Family_Homes_Act_desc: "A Lei das Casas Familiares, ou FHA, é um programa criado para garantir que as moradias classificadas como familiares cheguem às famílias que precisam. Garantiremos que ninguém abuse do limitado estoque habitacional que temos no país."
 GRN_focus_Urban_Planning_Commission: "Comissão de Planejamento Urbano"
 GRN_focus_Urban_Planning_Commission_desc: "The UPC is a government agency designed to pre-plan and begin foundational works for future housing projects and potential city planning styles to work with as these new houses get filled with people who then need jobs and local suppply chains at that rate."
 GRN_focus_Rapid_Agriculture_Expansions: "Expansões Agrícolas Rápidas"
 GRN_focus_Rapid_Agriculture_Expansions_desc: "O projeto RAE é dedicado a expandir nossa base agrícola e nossos métodos de produção para que possamos continuar alimentando nossos cidadãos e crescer melhor nossa população. É claro que precisaremos selecionar e importar especialistas para treinar e, por fim, entregar as instalações a cidadãos nativos, mas por ora podemos conceder a eles vistos temporários de desenvolvimento."
 GRN_focus_Industry_Development_Act: "Lei de Desenvolvimento da Indústria"
 GRN_focus_Industry_Development_Act_desc: "Investiremos em nossa manufatura e em nosso setor industrial em geral para criar uma economia confiável, porém diversificada. Pequenas melhorias e projetos crescerão aos poucos como uma bola de neve, à medida que nossa população e o potencial grupo de imigrantes que selecionamos também aumentarem."
 GRN_focus_Military_Forces_Investment_Act: "Lei de Investimento nas Forças Militares"
 GRN_focus_Military_Forces_Investment_Act_desc: "Este pacote de gastos e projeto de desenvolvimento de armas trabalharão lado a lado para desenvolver nossas capacidades terrestres e aéreas, enquanto buscamos elaborar nossos próprios projetos para certos equipamentos complexos."
 GRN_focus_Western_Strategic_Autarky_Act: "Lei da Autarquia Estratégica do Oeste"
 GRN_focus_Western_Strategic_Autarky_Act_desc: "The National Autarky Act is a two phase plan to create strategic mining and general resource extraction operations to ensure a limited but stable domestic supply should any nation come to do us harm via naval or political blockades of sort. Phase one of the plan is known as the WSAA or west strategic autarky act. This creates limited operations on iron ore, feldspar for aluminum as well as oil and coal for for both energy and rubber synthetic operations."
 GRN_focus_Eastern_Strategic_Autarky_Zone: "Zona de Autarquia Estratégica do Leste"
 GRN_focus_Eastern_Strategic_Autarky_Zone_desc: "A segunda fase da Lei da Autarquia Nacional é desenvolver operações de petróleo e carvão para uso energético geral e industrial. Também iniciaremos esforços limitados de extração de terras raras, além de lítio e minerais semelhantes voltados à tecnologia. Nossa segurança doméstica e nossas moedas de troca no exterior parecem começar a pender a nosso favor."
 GRN_focus_Militarize_Greenland_Party_Wins: "Partido Militarizar a Groenlândia Vence?"
 GRN_focus_Militarize_Greenland_Party_Wins_desc: "Embora a maioria dos partidos na Groenlândia seja bastante parecida, ninguém esperava a intervenção militar, já que o MGP, azarão absoluto e recém-formado, de algum modo conquistou a vitória. O partido, essencialmente uma extensão política das recém-formadas Forças Armadas da Groenlândia, ou ASG, foca na defesa nacional e na capacidade de obter os meios para defender nossa nação. Uma espécie de lógica circular, sem dúvida, mas muitos não deixam de se perguntar se essa não era uma necessidade subconsciente que a maioria desejava após a independência da Dinamarca."
 GRN_focus_Military_Organized_Education_Act: "Lei de Educação de Organização Militar"
 GRN_focus_Military_Organized_Education_Act_desc: "A reformulação de como as aulas, as disciplinas e a estrutura geral de nossa educação devem e serão reestruturadas num formato militar. O ensino precoce de disciplina, organização e de como tanto ouvir quanto dar ordens e informações é crucial, não só para a retenção da memória, mas também para a vida pós-escolar e a possível vida de serviço."
 GRN_focus_Production_Critical_Resources_Act: "Lei de Recursos Críticos de Produção"
 GRN_focus_Production_Critical_Resources_Act_desc: "Aço e energia, esses dois pilares fundamentais de qualquer sociedade industrializada, são o que mais precisamos. Seja para necessidades civis ou militares, investiremos e expandiremos operações para garantir que nossas necessidades domésticas e de defesa sejam atendidas."
 GRN_focus_Advanced_Materials_And_Minerals_Act: "Lei de Materiais e Minerais Avançados"
 GRN_focus_Advanced_Materials_And_Minerals_Act_desc: "O projeto AMMA foca em expandir as operações de extração mineral do que é considerado recurso necessário à produção avançada. Itens ligados ao desenvolvimento tecnológico e aos elementos de terras raras são alguns dos principais exemplos."
 GRN_focus_Army_Armaments_Improvement_Act: "Lei de Melhoria dos Armamentos do Exército"
 GRN_focus_Army_Armaments_Improvement_Act_desc: "A melhoria geral de nosso exército é fundamental para qualquer defesa terrestre que possamos ter. Assim, investiremos na expansão de nossa capacidade de produção, além de financiamento passivo de P&D para essas instalações testarem novos projetos sempre que possível."
 GRN_focus_Air_Force_Advancements_Act: "Lei de Avanços da Força Aérea"
 GRN_focus_Air_Force_Advancements_Act_desc: "Financiar as instalações de produção para de fato estabelecer algum tipo de força aérea será melhor do que não fazer nada. De bônus, acrescentaremos um pouco de financiamento de P&D para tentar dar o pontapé inicial no projeto de novas aeronaves para esse ramo de serviço."
 GRN_focus_Military_Garden_Act: "Lei da Horta Militar"
 GRN_focus_Military_Garden_Act_desc: "Dedicar uma parte do aparato agrícola, lento mas em constante expansão, que são as HFPs ao programa de rações militares é de fato algo benéfico. Isso não só separa a demanda civil da militar, como também ajuda no controle de qualidade e quantidade da alimentação de nossos militares."
 GRN_focus_Bolstering_Naval_Assets: "Reforçando os Ativos Navais"
 GRN_focus_Bolstering_Naval_Assets_desc: "Nosso litoral é imenso e, por isso, precisaremos ampliar ou ao menos criar navios capazes de lidar de forma razoável com as distâncias a cobrir. Depois do exército, a marinha é nossa primeira linha de defesa de verdade."
 GRN_focus_Civilian_Improvements_Act: "Lei de Melhorias Civis"
 GRN_focus_Civilian_Improvements_Act_desc: "Para reforçar e sustentar uma grande força militar, também precisamos de uma economia civil decente que sirva de base para tudo. Assim, faremos projetos de desenvolvimento direcionados para garantir que as demandas militares não se distanciem demais do que nossa economia real consegue suportar."
 GRN_focus_Militarized_Economy_Act: "Lei da Economia Militarizada"
 GRN_focus_Militarized_Economy_Act_desc: "Esta legislação é uma nova abordagem abrangente de como organizamos e tratamos a economia de nossa nação. Ao organizá-la de forma preventiva em torno de possíveis grandes demandas de mão de obra militar, podemos nos concentrar em integrar melhor tecnologias e métodos de produção para reduzir bastante a necessidade de alocar mão de obra na produção de armamentos militares. Isso, por sua vez, liberará trabalhadores e potencial de mão de obra para a economia civil e para nossas forças armadas."
 GRN_focus_Greenland_Monarchist_Party_Victory: "Vitória do Partido Monarquista da Groenlândia"
 GRN_focus_Greenland_Monarchist_Party_Victory_desc: "O Partido Monarquista da Groenlândia, também conhecido como Partido Casa da Groenlândia, é um partido político que busca respeitar e emular a longuíssima história da Groenlândia sob a monarquia dinamarquesa. Assim, o partido pretende pegar o sistema parlamentar existente e integrá-lo a uma monarquia constitucional bastante liberal. Muitas pessoas, é claro, estão confusas, mas uma parcela considerável, ou ao menos o suficiente para garantir uma vitória eleitoral, acredita que a estabilidade política dinamarquesa é a chave para o que podemos fazer aqui em casa para realmente desenvolver e fazer crescer nossa nação."
 GRN_focus_Education_Investments_Act: "Lei de Investimentos em Educação"
 GRN_focus_Education_Investments_Act_desc: "A EIA é um aumento de despesas dedicado a equipar melhor e investir de modo geral na qualidade da educação, bem como nos departamentos de inovação de certas instituições. Esperamos melhorar a eficiência de nossa nação e continuar a crescer e a adaptar nossas capacidades à crescente dureza que é o nosso ambiente."
 GRN_focus_Medical_Research_Initiatives: "Iniciativas de Pesquisa Médica"
 GRN_focus_Medical_Research_Initiatives_desc: "O plano MRI consiste em criar financiamento separado para um novo departamento dedicado dentro de nossas principais instituições médicas. Esse novo departamento se chamará Departamento de Desenvolvimento Médico, ou MDD. O MDD é responsável por fazer o que puder para testar e encontrar novas formas de avançar nosso conhecimento e compreensão da ciência médica, além de garantir o teste de novos equipamentos e procedimentos por meio de um programa totalmente voluntário."
 GRN_focus_Public_Security_And_Safety_Act: "Lei de Segurança e Proteção Pública"
 GRN_focus_Public_Security_And_Safety_Act_desc: "Nossos cidadãos devem poder viver suas vidas sem medo. Com esta nova legislação aprovada, serão liberados recursos não apenas para programas de aproximação com a comunidade, mas também para melhores padrões de avaliação de candidatos à contratação e para o programa de treinamento para se tornar policial. Lembre-se: um dia tranquilo é um bom dia, e um bom dia para você é um bom dia para o público."
 GRN_focus_Agriculture_Advancements_Act: "Lei de Avanços Agrícolas"
 GRN_focus_Agriculture_Advancements_Act_desc: "Com base em nosso programa HRP, em constante crescimento, continuaremos a investir em instalações de estufas e agricultura vertical sempre que possível. Afinal, a segurança e a estabilidade de nossa nação dependem de conseguir um suprimento de alimentos diversificado e estável."
 GRN_focus_Economic_Strengthening_Act: "Lei de Fortalecimento Econômico"
 GRN_focus_Economic_Strengthening_Act_desc: "Desenvolver a base significa que os padrões de toda a nação sobem por tabela ou como subproduto, dependendo de suas influências cínicas ou apenas de sua disposição geral diante da vida. Seja como for, se queremos melhorar a vida de nossos cidadãos, devemos investir em negócios e indústrias para diversificar e ampliar os produtos e meios que nosso povo pode encontrar e usar ao longo da vida."
 GRN_focus_Petrochemical_Development_Efforts: "Esforços de Desenvolvimento Petroquímico"
 GRN_focus_Petrochemical_Development_Efforts_desc: "A indústria petroquímica é um dos setores econômicos mais influentes e diversificados da era moderna, sem falar que seus impactos são sentidos praticamente no dia a dia. Assim, devemos assumir o desafio e desenvolver nosso próprio setor se quisermos ter uma economia realmente robusta e diversificada. A capacidade de sintetizar coisas como borracha e outros produtos químicos ou materiais valiosos é quase uma questão de segurança nacional."
 GRN_focus_Lithium_Expansion_Act: "Lei de Expansão do Lítio"
 GRN_focus_Lithium_Expansion_Act_desc: "Investir em operações de extração de recursos críticos é fundamental diante da influência crescente da tecnologia e de outras inovações modernas à medida que nossa nação continua a crescer. Temos jazidas domésticas de elementos de terras raras, lítio e outros minerais usados na produção de tecnologia. Assim, começaremos a expandir e desenvolver esforços de extração para suprir nossas demandas domésticas e, potencialmente, usar em futuros acordos comerciais."
 GRN_focus_Royal_Military_Development_Efforts: "Esforços de Desenvolvimento Militar Real"
 GRN_focus_Royal_Military_Development_Efforts_desc: "O programa RMD é um pacote geral de investimento para melhorar a qualidade do desenvolvimento de equipamentos para o exército e a marinha, além de assegurar novos padrões de treinamento em torno de equipamentos em constante evolução."
 GRN_focus_Establishing_The_Kingdom: "Estabelecendo o Reino"
 GRN_focus_Establishing_The_Kingdom_desc: "Com toda a nossa preparação concluída, estamos prontos para renomear oficialmente a nação como Reino da Groenlândia. O povo está radiante e unido enquanto nos lançamos à criação de um futuro próspero e orgulhoso para todos os nossos cidadãos."
 GRN_focus_Armed_Services_Of_Greenland: "Forças Armadas da Groenlândia"
 GRN_focus_Armed_Services_Of_Greenland_desc: "Com nossa independência assegurada, agora precisamos cuidar de nossa própria defesa nacional. Teremos que, essencialmente, começar do zero e criar algo capaz de defender as vastas águas, terras e espaço aéreo que controlamos."
 GRN_focus_The_Frozen_Army: "O Exército Congelado"
 GRN_focus_The_Frozen_Army_desc: "Nossas terras são frias, congeladas e difíceis de atravessar em quase qualquer época do ano. Devemos moldar nosso ramo do exército para que veja essas condições como um playground, e não como um desafio."
 GRN_focus_Training_Facilities_And_Standards: "Instalações e Padrões de Treinamento"
 GRN_focus_Training_Facilities_And_Standards_desc: "Para criar um exército de verdade, precisamos estabelecer instalações de treinamento e definir padrões aceitáveis do que constitui um soldado adequado. Esses padrões devem ser construídos em torno das condições de nossa pátria se quisermos realmente defender nossos cidadãos."
 GRN_focus_Setting_Equipment_Standards: "Definindo Padrões de Equipamento"
 GRN_focus_Setting_Equipment_Standards_desc: "Ao criar um padrão de equipamento, podemos gerar uma sensação de uniformidade tanto no treinamento quanto na melhoria da logística em torno de nossos soldados."
 GRN_focus_Securing_Domestic_Smallarms: "Garantindo Armas Leves Domésticas"
 GRN_focus_Securing_Domestic_Smallarms_desc: "Montar nossa própria capacidade de produzir armas leves e equipamentos afins à infantaria significa que podemos aumentar a capacidade de combate e a prontidão de nosso exército."
 GRN_focus_Crude_Combat_Designs: "Projetos de Combate Rudimentares"
 GRN_focus_Crude_Combat_Designs_desc: "Os CCDs são essencialmente projetos de veículos do tipo \"chacoalha-ossos\". São absurdamente básicos, mas todos são modelos domésticos. Podemos usá-los e talvez comprar um punhado de equipamentos de outras nações para realizar testes e trabalhos de projeto adequados, garantindo que, à medida que formamos nosso exército, ele possa realmente empregar equipamentos feitos para o combate moderno."
 GRN_focus_Vehicle_Manufacturing_Plants: "Fábricas de Veículos"
 GRN_focus_Vehicle_Manufacturing_Plants_desc: "Com o básico dos projetos básicos de veículos à nossa disposição, deveremos ser capazes de fabricar esses bonecos de treinamento e usar a experiência coletiva para de fato projetar e construir um possível núcleo blindado para nossas forças armadas."
 GRN_focus_Institute_For_Army_Developments: "Instituto de Desenvolvimento do Exército"
 GRN_focus_Institute_For_Army_Developments_desc: "Com um exército praticamente menor que um bebê, devemos investir pesado nos meios de desenvolver e melhorar todos os aspectos de nosso ramo do exército. Pelo bem da nação, do povo e do pessoal que serve no ramo."
 GRN_focus_Frozen_Battlefield_Doctrine: "Doutrina do Campo de Batalha Congelado"
 GRN_focus_Frozen_Battlefield_Doctrine_desc: "Nossas forças militares provavelmente nunca chegarão realmente à escala das do continente europeu. No entanto, o que podemos fazer é defender e proteger. Usando nosso clima e nossa pátria como o campo de batalha definitivo, podemos provocar qualquer força inimiga, agressiva ou não, a vir nos atacar. Eles acham que seremos moleza; bem, veremos o que acontece quando vierem aqui e tentarem dizer isso na nossa cara."
 GRN_focus_FBD_Leadership_Promotions: "Promoções de Liderança da FBD"
 GRN_focus_FBD_Leadership_Promotions_desc: "Para consolidar e começar a reorganizar o exército em torno dessa nova doutrina, precisaremos de líderes que realmente queiram implementá-la e entendam as ideias e conceitos que ela estabelece. Assim, promoveremos um estado-maior dedicado do exército para liderar melhor e implementar essas reformas."
 GRN_focus_From_Field_To_Staff_Command: "Do Campo ao Comando do Estado-Maior"
 GRN_focus_From_Field_To_Staff_Command_desc: "Com os comandantes de campo promovidos, percebemos que essas pobres almas também precisam compreender a administração em sentido mais amplo. Assim, seus comandos de campo serão complementados por cargos de estado-maior até que possamos treinar e promover outros oficiais dignos a esse novo caminho."
 GRN_focus_Frozen_Warfare_Training_Program: "Programa de Treinamento para Guerra no Gelo"
 GRN_focus_Frozen_Warfare_Training_Program_desc: "Nosso foco é defender nossa pátria; essa pátria é fria e congelada, portanto devemos treinar e garantir que nossas tropas consigam lutar nessas condições pelo maior tempo possível."
 GRN_focus_Polar_Logistics: "Logística Polar"
 GRN_focus_Polar_Logistics_desc: "Presumir que nosso combate sempre será em nossa ilha, embora não seja o melhor método, é certamente uma forma segura de pensar a defesa de nossa nação. Assim, começaremos a refinar e melhorar nosso aparato logístico para tornar mais fácil lutar em condições climáticas extremas."
 GRN_focus_General_Improvement_Programs: "Programas de Melhoria Geral"
 GRN_focus_General_Improvement_Programs_desc: "A defesa de nossa ilha é obviamente nossa principal prioridade; porém, como podemos defendê-la se sabemos pouco ou nada sobre os mundos de combate à nossa volta? Devemos garantir uma melhoria equilibrada e geral de nosso exército para que ele esteja disposto e apto a lidar com o maior número possível de situações diferentes."
 GRN_focus_GIP_Leadership_Promotions: "Promoções de Liderança da GIP"
 GRN_focus_GIP_Leadership_Promotions_desc: "Assegurar o novo caminho de como queremos crescer e desenvolver nosso exército exigirá oficiais de campo e papéis de liderança de oficiais-generais. Assim, buscaremos os melhores candidatos possíveis para que possam ajudar a elevar essa forma de pensar a novos padrões de excelência."
 GRN_focus_General_Staff_Roles: "Funções do Estado-Maior"
 GRN_focus_General_Staff_Roles_desc: "Como nosso exército é pequeno, precisaremos que aqueles a quem acabamos de dar comandos de campo também assumam funções administrativas por ora."
 GRN_focus_Artillery_Corps_Specialist: "Especialista do Corpo de Artilharia"
 GRN_focus_Artillery_Corps_Specialist_desc: "Desenvolver e nos especializar em operações de artilharia, tanto defensivas quanto ofensivas, significa que poderemos causar mais dano ao pessoal e ao moral do inimigo do que ele poderia causar a nós. Mas a artilharia é difícil de mover, e as peças fáceis de mover são caras. Precisaremos encontrar formas de melhorar a prevenção de perdas se quisermos obter algum sentido real desse tipo de planejamento tático."
 GRN_focus_Clear_Skys_Project: "Projeto Céus Limpos"
 GRN_focus_Clear_Skys_Project_desc: "O CSP é um programa dedicado ao desenvolvimento de equipamentos antiaéreos para garantir que os meios de nossos soldados lutarem não dependam apenas de o inimigo decidir ou não usar seu poder aéreo. Aeronaves são caras; brinquedos novos e divertidos para o soldado comum, nem tanto."
 GRN_focus_Army_Officer_Training_Corps: "Corpo de Treinamento de Oficiais do Exército"
 GRN_focus_Army_Officer_Training_Corps_desc: "O AOTC é a culminação e a dedicação de pessoal para se tornarem líderes tanto no sentido tático quanto no estratégico. Nossa nação é pequena e, por isso, devemos desenvolver e podar quaisquer maus hábitos antes de chegarmos a um ponto em que o entrincheiramento natural possa se firmar."
 GRN_focus_Navy_Of_Greenland: "Marinha da Groenlândia"
 GRN_focus_Navy_Of_Greenland_desc: "Nossa marinha não passa de barcos de pesca e embarcações de patrulha. Se queremos sequer pensar em defender nossas águas costeiras, precisamos garantir que tenhamos uma marinha para começar, mas também uma que consiga lidar com condições por vezes tão voláteis."
 GRN_focus_Naval_Research_Institute: "Instituto de Pesquisa Naval"
 GRN_focus_Naval_Research_Institute_desc: "Estabelecer o Instituto de Pesquisa Naval de Itilleq nos permitirá desenvolver e ampliar nosso conhecimento naval e as aplicações práticas em nossa marinha. Essa pedra angular do desenvolvimento nos permitirá criar a marinha que queremos e defender adequadamente nossas águas contra a agressão estrangeira."
 GRN_focus_Nuuk_Naval_Shipyards: "Estaleiros Navais de Nuuk"
 GRN_focus_Nuuk_Naval_Shipyards_desc: "Desenvolver os estaleiros regionais da capital nos permitirá construir novas embarcações tanto para fins militares quanto, potencialmente, civis."
 GRN_focus_Expanding_The_Design_Department: "Expandindo o Departamento de Projetos"
 GRN_focus_Expanding_The_Design_Department_desc: "Estaleiros navais estratégicos próximos ao NRI, no sul da nação, nos permitirão melhorar, projetar e testar embarcações navais e dar à nossa marinha os melhores resultados possíveis. Isso também ajudará a atualizar melhor as classes de navios atualmente em serviço e a reformá-las para projetos mais novos sempre que possível."
 GRN_focus_Tasiilaq_Shipyards_Complex: "Complexo de Estaleiros de Tasiilaq"
 GRN_focus_Tasiilaq_Shipyards_Complex_desc: "Equilibrar o desenvolvimento naval geral entre pontos estratégicos nos permite apoiar logisticamente e empregar nossas frotas onde forem necessárias em toda a extensão de nossa ilha."
 GRN_focus_Rough_Raft_Designs: "Projetos de Jangadas Rústicas"
 GRN_focus_Rough_Raft_Designs_desc: "O mínimo para projetar e empregar algum tipo de força naval significa que teremos de trabalhar dobrado nos esforços de P&D para, no futuro, de fato adquirir e tentar construir projetos reais."
 GRN_focus_Small_Surface_Fleet_Doctrine: "Doutrina da Pequena Frota de Superfície"
 GRN_focus_Small_Surface_Fleet_Doctrine_desc: "Nossa nação não tem mão de obra para empregar muitos navios em geral. Assim, começaremos a estruturar e trabalhar nossa doutrina naval em torno de embarcações de superfície, mas de calibre menor. Torná-las mais modulares e adaptáveis, essencialmente, embora nada maior que, digamos, um contratorpedeiro, devido a preocupações com treinamento e mão de obra."
 GRN_focus_Corvette_Design_Department: "Departamento de Projeto de Corvetas"
 GRN_focus_Corvette_Design_Department_desc: "O programa inicial de nossa doutrina SSF é o departamento de projeto de corvetas. O departamento cuidará de projetar, testar e melhorar as inovações em torno do tipo de casco padrão."
 GRN_focus_Small_Vessel_Fleet_Organization: "Organização da Frota de Pequenas Embarcações"
 GRN_focus_Small_Vessel_Fleet_Organization_desc: "Nossas SVFs, ou Pequenas Frotas, serão organizadas em torno dos três grandes: corvetas, fragatas e contratorpedeiros. Essas três classes de navios serão as melhores para tripular, adaptar e criar projetos novos e dinâmicos, fazendo nossas frotas desferirem um golpe sério contra uma força inimiga."
 GRN_focus_Submersival_Fleet_Doctrine: "Doutrina da Frota Submersível"
 GRN_focus_Submersival_Fleet_Doctrine_desc: "Submarinos são furtivos e não exigem tanta mão de obra. Porém, submarinos desferem golpes muito fortes se forem organizados da forma certa. De mísseis antinavio a bons e velhos torpedos, podemos fazer muito mais com muito menos."
 GRN_focus_Attack_Submarine_Pillar: "Pilar dos Submarinos de Ataque"
 GRN_focus_Attack_Submarine_Pillar_desc: "O primeiro pilar principal para assegurar a base de nossa marinha é a classe de submarinos de ataque. Projetada principalmente em torno de táticas de assalto direto, como torpedos e guerra de minas, a classe de ataque será a lança da marinha de nossa nação."
 GRN_focus_Missile_Submarine_Pillar: "Pilar dos Submarinos de Mísseis"
 GRN_focus_Missile_Submarine_Pillar_desc: "O segundo pilar de nossa segurança naval é a classe de submarinos de mísseis. Mísseis são peso-pesados, mas também são meio caros. Precisamos melhorar e aprimorar as capacidades efetivas de combate desse pilar do poderio naval se quisermos combater adequadamente inimigos estrangeiros no mar."
 GRN_focus_Naval_Command_Corps: "Corpo de Comando Naval"
 GRN_focus_Naval_Command_Corps_desc: "Nossa marinha precisa de um aparato de comando e hoje estabelecemos exatamente isso. É um começo e só podemos melhorar daqui para frente. Espero."
 GRN_focus_Greenlandic_Air_Force: "Força Aérea Groenlandesa"
 GRN_focus_Greenlandic_Air_Force_desc: "Os céus sobre nossa ilha são nublados, frios e desolados. Precisamos descobrir como desenvolver e criar uma força aérea suficiente para defender nossos céus."
 GRN_focus_West_Craft_Manufacturing: "Manufatura West Craft"
 GRN_focus_West_Craft_Manufacturing_desc: "A instalação de manufatura West Craft está pronta para produzir e testar projetos para nossa força aérea onde e quando possível. Esperamos usar esse novo complexo industrial para equipar e preparar nossa força aérea para defender nossos céus."
 GRN_focus_Preparing_Air_Institute_Manufacturing: "Preparando a Manufatura do Instituto Aéreo"
 GRN_focus_Preparing_Air_Institute_Manufacturing_desc: "A capacidade de produzir e testar aeronaves é fundamental para aprender e inovar. Montaremos capacidades de manufatura perto do planejado Instituto de Pesquisa Aérea para facilitar a logística e o planejamento em torno do desenvolvimento de novos projetos e do teste de tecnologias."
 GRN_focus_Tingmiarmit_Air_Research_Institute: "Instituto de Pesquisa Aérea Tingmiarmit"
 GRN_focus_Tingmiarmit_Air_Research_Institute_desc: "O TARI é uma instituição dedicada ao desenvolvimento e às inovações em torno de aeronaves e capacidades de combate aéreo. Embora nossa nação seja de certo modo grande, ela também é pequena ao mesmo tempo e, por isso, devemos dedicar estes primeiros anos a especializar uma verdadeira forma de doutrina aérea e de segurança aérea contra forças inimigas."
 GRN_focus_Infrequent_Flyer_Designs: "Projetos de Passageiro Pouco Frequente"
 GRN_focus_Infrequent_Flyer_Designs_desc: "Projetos baratos para cumprir as funções que lhes foram atribuídas. Não são os melhores, mas certamente um ponto de partida para iniciar um desenvolvimento sério de nossa força aérea."
 GRN_focus_Air_Supremacy_Prioritization: "Priorização da Supremacia Aérea"
 GRN_focus_Air_Supremacy_Prioritization_desc: "O inimigo pode até superar nossa marinha, mas jamais deve poder dominar nossos céus. Devemos nos focar por inteiro em produzir e inovar nas capacidades de combate ar-ar diretas. Garantir isso nos permite fazer o que quisermos no ar, no mar e em terra, por tabela."
 GRN_focus_General_Aviation_Innovations: "Inovações Gerais da Aviação"
 GRN_focus_General_Aviation_Innovations_desc: "A instalação TARI tem trabalhado duro, graças a Deus, porque investimos muito dinheiro nela, mas enfim. Melhorias gerais em itens como detecção por radar, eficiência de combustível e esforços de consumo geral, além de um pequeno conjunto de outras inovações, devem chegar aos testes em campo em breve."
 GRN_focus_Air_Dominance_Research_Programs: "Programas de Pesquisa de Domínio Aéreo"
 GRN_focus_Air_Dominance_Research_Programs_desc: "Com dedicação exclusiva aos esforços de P&D de caças, livraremos os céus de quaisquer inimigos que busquem escurecer nossos céus com suas intenções odiosas."
 GRN_focus_Naval_Bombing_Superiority_Force: "Força de Superioridade em Bombardeio Naval"
 GRN_focus_Naval_Bombing_Superiority_Force_desc: "Dominar os mares por meios aéreos poderia abrir caminho para medidas defensivas preventivas e garantir capacidades ofensivas caso a necessidade algum dia surja."
 GRN_focus_Bombing_Research_Priorities: "Prioridades de Pesquisa em Bombardeio"
 GRN_focus_Bombing_Research_Priorities_desc: "Investir nosso financiamento de pesquisa para priorizar inovações em bombardeio e em combate ar-solo e ar-navio se provará frutífero para antecipar-se a qualquer força de invasão que possamos vir a enfrentar."
 GRN_focus_Bomber_Air_Fleets: "Frotas Aéreas de Bombardeiros"
 GRN_focus_Bomber_Air_Fleets_desc: "Nossa força aérea terá frotas aéreas dedicadas a todo tipo de esforço de bombardeio. Do estratégico ao apoio aéreo aproximado, montaremos o cenário para garantir que nenhuma força inimiga prejudique nossas terras por muito tempo."
 GRN_focus_Air_Officer_Training_Corps: "Corpo de Treinamento de Oficiais Aéreos"
 GRN_focus_Air_Officer_Training_Corps_desc: "Desenvolver nosso Corpo de Oficiais da Força Aérea continuará a melhorar os esforços de desenvolvimento que buscamos à medida que crescemos e refinamos o que de fato é nosso ramo de serviço da força aérea."
 GRN_focus_Greenlandic_General_Staff_Corps: "Corpo do Estado-Maior Groenlandês"
 GRN_focus_Greenlandic_General_Staff_Corps_desc: "Com as forças armadas agora em constante expansão, chegamos a um ponto em que precisamos de um comando de estado-maior mais unificado. Assim, trabalharemos para criar esse estado-maior nacional e para melhorar nossa nação, buscando sempre aprimorar os meios de nossa defesa nacional."
 GRN_focus_Thawing_The_Economy: "Degelando a Economia"
 GRN_focus_Thawing_The_Economy_desc: "A economia de nossa nação originalmente é apenas pesca e, bem, pesca. É claro que temos presença bastante reduzida no comércio e em outros setores econômicos, mas a verdadeira maior parte da economia vem de nossas pescarias. Temos que mudar isso. É claro que tentamos diversificar para travar a batalha pela nossa independência, mas devemos continuar a descobrir o que podemos fazer e como fazê-lo. Nossa economia tem potencial para crescer, mas precisamos fazer algo."
 GRN_focus_Energizing_Greenland: "Energizando a Groenlândia"
 GRN_focus_Energizing_Greenland_desc: "À medida que nossa nação cresce, nossa demanda por energia continua a subir e subir. Precisamos estabelecer um setor energético estável que continue atendendo às demandas que buscamos."
 GRN_focus_Fossil_Fuelin: "Combustível Fóssil"
 GRN_focus_Fossil_Fuelin_desc: "Nossa nação possui grandes jazidas inexploradas de carvão e petróleo. Podemos usá-las para obter energia rápida e barata e manter o ritmo de nossas demandas energéticas conforme julgarmos necessário."
 GRN_focus_Oil_Charter_Dominance: "Domínio das Concessões de Petróleo"
 GRN_focus_Oil_Charter_Dominance_desc: "Priorizando a criação de novas concessões de extração, podemos continuar atendendo às demandas de energia por meio da expansão dos esforços gerais de extração."
 GRN_focus_Renewable_Revivals: "Renascimento das Renováveis"
 GRN_focus_Renewable_Revivals_desc: "Nossas terras são fartas em ventos, sol e águas em movimento. Temos, possivelmente, o melhor ambiente para investir em energias renováveis estáveis e, por isso, iniciaremos um investimento geral e abrangente tanto na construção de instalações renováveis quanto no desenvolvimento de métodos melhores de gerar energia."
 GRN_focus_Harnessing_The_Winds_Of_Fortune: "Aproveitando os Ventos da Fortuna"
 GRN_focus_Harnessing_The_Winds_Of_Fortune_desc: "Continuaremos a priorizar nossos desenvolvimentos gerais e a garantir que possamos aproveitar a própria natureza de nossa nação para que nossos cidadãos vivam melhor do que antes."
 GRN_focus_Greenlands_Green_Energy: "A Energia Verde da Groenlândia"
 GRN_focus_Greenlands_Green_Energy_desc: "Nossa ilha é o lugar perfeito para desenvolver e usar energia nuclear. Padrões climáticos razoavelmente estáveis, temperaturas frescas e frias quase o ano todo e muita água, tanto salgada quanto doce... água congelada para ser usada no processo de geração de vapor."
 GRN_focus_Unlimited_Power: "Poder Ilimitado"
 GRN_focus_Unlimited_Power_desc: "Com jazidas domésticas de materiais nucleares, podemos abastecer nossas próprias instalações. Também podemos começar a construir e preparar o terreno para colocar as operações em andamento. Com esse investimento maciço, estabelecemos o precedente de que somos uma nação que não precisa mais se preocupar com energia."
 GRN_focus_Secured_Electrical_Grid: "Rede Elétrica Segura"
 GRN_focus_Secured_Electrical_Grid_desc: "Com nosso rumo energético definido, nossas necessidades de energia agora estão mais estáveis ou, ao menos, caminhando para serem de natureza mais preventiva do que reativa. Esperemos que tenhamos feito a escolha certa e continuemos avançando rumo a um futuro mais brilhante."
 GRN_focus_Agricultural_Futurism_Plan: "Plano de Futurismo Agrícola"
 GRN_focus_Agricultural_Futurism_Plan_desc: "Nossos HFPs originais, ou Projetos de Agricultura Rigorosa, consolidaram uma base de inovações econômicas e científicas. Embora isso leve a medidas mais intensivas em energia, podemos usar isso para liderar o domínio do setor agrícola, tanto em autossuficiência quanto em potenciais comércios e investimentos estrangeiros."
 GRN_focus_Western_Farming_Complexes: "Complexos Agrícolas do Oeste"
 GRN_focus_Western_Farming_Complexes_desc: "Criar fundações, infraestrutura e estruturas gerais para sustentar esses métodos leva tempo, mas se provarão frutíferas no futuro. Esses VFCs, ou Complexos de Agricultura Vertical, são ótimos para cultivar todo tipo de alimento praticamente o ano todo. Isso também nos permite expandir nosso aparato de instalações de destilação para continuar desgastando a Grande Plataforma."
 GRN_focus_Eastern_Farming_Complexes: "Complexos Agrícolas do Leste"
 GRN_focus_Eastern_Farming_Complexes_desc: "O desenvolvimento contínuo de nosso Setor de Agricultura Vertical levará os custos de alimentação de nossa nação a novos mínimos, tornando a comida muito barata e nos permitindo trocar alimentos com outras nações quase o ano inteiro por itens que, regionalmente, seriam considerados fora de estação."
 GRN_focus_Supplemental_Industries: "Indústrias Complementares"
 GRN_focus_Supplemental_Industries_desc: "Desenvolver nosso setor industrial nos dará alguma diversidade limitada em meio ao nosso setor agrícola, no qual investimos pesadamente."
 GRN_focus_First_International_Farm: "Primeira Fazenda Internacional"
 GRN_focus_First_International_Farm_desc: "Com todos os nossos investimentos em pesquisa e desenvolvimento econômico do setor agrícola em geral, percebemos que, com as demandas que talvez consigamos atender, podemos ser a primeira nação agrícola internacional. Claro, existem celeiros pelo mundo, mas pense bem: poderíamos ser O banco global de alimentos."
 GRN_focus_Infrastructure_Projects: "Projetos de Infraestrutura"
 GRN_focus_Infrastructure_Projects_desc: "Crescer nossa economia é tudo muito bonito, mas, para mantê-la, precisamos de estradas, ferrovias e todo tipo de infraestrutura para conectar pessoas e serviços e fazer a economia realmente funcionar. Assim, instituiremos uma lista geral de projetos para integrar melhor nossa nação de população escassa."
 GRN_focus_Greater_West_Highway_Project: "Projeto da Grande Rodovia do Oeste"
 GRN_focus_Greater_West_Highway_Project_desc: "Criar uma \"rodovia\" direta que ligue as cidades do oeste proporcionará melhores condições de viagem aos cidadãos, além de reduzir o esforço e o tempo para ir de um local a outro."
 GRN_focus_Improving_Western_Internet_Towers: "Melhorando as Torres de Internet do Oeste"
 GRN_focus_Improving_Western_Internet_Towers_desc: "Melhorar as torres existentes e construir novas torres de internet permitirá que nossos cidadãos e instituições trabalhem de maneira mais eficiente e coesa nas atividades diárias."
 GRN_focus_Sisimuit_Northern_Railway: "Ferrovia Norte de Sisimiut"
 GRN_focus_Sisimuit_Northern_Railway_desc: "Expandir a rede ferroviária atual para abranger o máximo possível da região oeste é fundamental para a logística e a coesão da cadeia de suprimentos econômica. Nos beneficiaremos muito desse investimento, pois as ferrovias são o melhor meio para transporte em grande volume."
 GRN_focus_Great_Eastern_Highway_Project: "Projeto da Grande Rodovia do Leste"
 GRN_focus_Great_Eastern_Highway_Project_desc: "Semelhante ao nosso projeto do oeste, faremos o possível para conectar as cidades do leste e deixar a nação muito mais conectada, ainda que pelos meios mais básicos, se possível."
 GRN_focus_East_Region_Internet_Expansions: "Expansões de Internet da Região Leste"
 GRN_focus_East_Region_Internet_Expansions_desc: "Como a região leste costuma ser menos desenvolvida em comparação com o oeste, devemos fazer o que pudermos para crescer e equalizar essas defasagens. Assim, expandiremos a infraestrutura de internet que temos na região para elevá-la aos padrões."
 GRN_focus_Great_Greenlandic_Eastern_Railroad: "Grande Ferrovia Groenlandesa do Leste"
 GRN_focus_Great_Greenlandic_Eastern_Railroad_desc: "A GGERR é um dos maiores investimentos em infraestrutura, pois buscamos conectar o máximo possível das terras costeiras em uma rede ferroviária unificada. A única barreira para tempos de viagem menores é a Grande Plataforma de gelo, mas talvez possamos mudar isso um dia desses."
 GRN_focus_Connecting_Greenland: "Conectando a Groenlândia"
 GRN_focus_Connecting_Greenland_desc: "À medida que nossa nação cresce, cresce também nossa necessidade de infraestrutura. Para isso, devemos continuar investindo não só na infraestrutura em si, mas também nas formas de mantê-la e em como torná-la melhor para o ambiente em que a construímos."
 GRN_focus_Economic_Modernism_Plan: "Plano de Modernismo Econômico"
 GRN_focus_Economic_Modernism_Plan_desc: "A diversificação contínua de nossa economia é fundamental para sua estabilidade e saúde. Devemos melhorar em nossas deficiências relacionadas ao setor civil mais amplo e ao setor de escritórios/tecnologia."
 GRN_focus_Office_District_West: "Distrito de Escritórios do Oeste"
 GRN_focus_Office_District_West_desc: "Desenvolver o setor de escritórios em geral na região oeste nos permitirá ampliar os produtos e serviços que os cidadãos poderão desfrutar."
 GRN_focus_Tech_Sector_Growth: "Crescimento do Setor de Tecnologia"
 GRN_focus_Tech_Sector_Growth_desc: "O crescimento dos setores de escritórios e serviços costuma ser complementado também pelo desenvolvimento geral do setor de tecnologia. Devemos garantir isso para que nossa economia alcance a maior diversidade possível."
 GRN_focus_Civilian_Sector_Investments: "Investimentos no Setor Civil"
 GRN_focus_Civilian_Sector_Investments_desc: "Complementando nosso esforço de desenvolver e diversificar o setor de escritórios, essas empresas precisam de respaldo industrial para fabricar e, potencialmente, usar seus produtos."
 GRN_focus_National_Economic_Modernity: "Modernidade Econômica Nacional"
 GRN_focus_National_Economic_Modernity_desc: "Nossos investimentos foram diversos e frutíferos, para dizer o mínimo, mas isso é só o começo. Devemos fazer o melhor possível para proporcionar o melhor resultado para nossos cidadãos e para o futuro de nossa nação."
 GRN_focus_Resource_Extraction_Projects: "Projetos de Extração de Recursos"
 GRN_focus_Resource_Extraction_Projects_desc: "A ilha está repleta de recursos inexplorados. Se quisermos chegar a algum lugar em termos de segurança doméstica e investimento e/ou comércio exterior, devemos desenvolver nosso setor de extração de recursos de acordo com o que acreditamos ser o melhor para a nação."
 GRN_focus_Iron_Mining_Operations: "Operações de Mineração de Ferro"
 GRN_focus_Iron_Mining_Operations_desc: "O ferro é um minério fundamental para minerar e usar em toda a economia. Começaremos investimentos nacionais para iniciar e expandir operações de extração que melhor atendam às nossas necessidades."
 GRN_focus_Project_Alumina_Oxide: "Projeto Óxido de Alumina"
 GRN_focus_Project_Alumina_Oxide_desc: "Embora até agora não tenhamos descoberto nenhuma jazida direta de bauxita, descobrimos que há formas de extrair o óxido de alumina necessário de outros minerais para produzir alumínio. Assim, precisaremos de investimentos pesados em operações e em pesquisa de isolamento para aproveitar ao máximo o pouco que temos."
 GRN_focus_Lithium_Mining_Operations: "Operações de Mineração de Lítio"
 GRN_focus_Lithium_Mining_Operations_desc: "As jazidas de lítio e de minerais semelhantes, que servem de blocos de construção, serão a chave para ampliar nossa capacidade de inovar e fazer crescer as indústrias de tecnologia e o setor de serviços. Investir na mineração de itens como lítio, cobalto e outros será um enorme impulso à nossa flexibilidade econômica."
 GRN_focus_Project_Rare_Minerals: "Projeto Minerais Raros"
 GRN_focus_Project_Rare_Minerals_desc: "Investir pesado em elementos de terras raras, como o neodímio, e em outras jazidas minerais disponíveis elevará bastante nossa posição internacional nas negociações comerciais. Esperamos que, com esses investimentos, nossa nação alcance novos patamares e traga mais investimentos de capital para o país."
 GRN_focus_Black_Gold_Extraction_Efforts: "Esforços de Extração do Ouro Negro"
 GRN_focus_Black_Gold_Extraction_Efforts_desc: "Investir em nossas jazidas de petróleo nos dará bastante energia barata, além de ser uma ótima moeda de troca em futuros acordos comerciais. Além disso, podemos usar o petróleo e o carvão extraídos para reforçar nossas indústrias de sintéticos e petroquímicas."
 GRN_focus_Project_Glacial_Rubber: "Projeto Borracha Glacial"
 GRN_focus_Project_Glacial_Rubber_desc: "Experimentação ampla e investimentos em VFFs dedicadas, feitas sob medida para cultivar seringueiras, além do uso de carvão e petróleo em sintéticos e petroquímicos, significam que podemos explorar todas as vias possíveis para garantir um suprimento doméstico de borracha."
 GRN_focus_Polar_Bear_Policies: "Políticas do Urso Polar"
 GRN_focus_Polar_Bear_Policies_desc: "Com nossa nação estável, desenvolvida e equipada para a defesa nacional e para uma possível ofensiva, agora podemos começar a olhar além da ilha. Nossa política externa ditará nosso verdadeiro futuro e os desejos que queremos alcançar com as próprias mãos."
 GRN_focus_The_Atlantic_Stepping_Stone: "O Trampolim do Atlântico"
 GRN_focus_The_Atlantic_Stepping_Stone_desc: "Sejamos sinceros: qualquer direção real de política externa sempre vai envolver a Islândia em algum momento. Então vamos resolver isso logo e definir exatamente o que faremos. Isso não só ditará o ritmo de nossos futuros empreendimentos de política externa, como também será um teste adequado de nossa capacidade de navegar pelo cenário moderno."
 GRN_focus_Investing_In_Brotherhood: "Investindo na Irmandade"
 GRN_focus_Investing_In_Brotherhood_desc: "Se queremos laços e relações mais estreitos, quanto mais qualquer plano futuro de uma possível união entre nós dois, precisaremos construir confiança. Podemos fazer isso com uma série de investimentos que os beneficiem mais do que a nós. Se jogarmos o jogo longo, no fim isso beneficiará a ambos. Lembre-se: devagar e sempre se vence a corrida."
 GRN_focus_Reykjavik_Investment_Firm: "Firma de Investimentos de Reykjavik"
 GRN_focus_Reykjavik_Investment_Firm_desc: "A Islândia está na OTAN, e isso é um problema. Devemos encontrar uma forma de reduzir a dependência e a suposta necessidade que a Islândia tem de estrangeiros, a saber, da ajuda dos americanos, se quisermos garantir a ilha para nós. Então vamos fazer a eles uma oferta que não podem recusar. Esqueça as letras miúdas, é só assinar aqui."
 GRN_focus_Operation_Real_Green: "Operação: Verde de Verdade"
 GRN_focus_Operation_Real_Green_desc: "Esgotamos todas as nossas opções; devemos garantir a ilha para a defesa sub-regional da área do Atlântico Norte alto. Pesca e comércio assegurados para nosso interesse e nossa economia, além de patrulhamento preventivo contra medidas de sondagem agressivas, trarão mais estabilidade à região."
 GRN_focus_Passive_Administration_Act: "Lei da Administração Passiva"
 GRN_focus_Passive_Administration_Act_desc: "Com a Islândia agora sob nosso controle mais direto, devemos ajudar a integrar e formar uma união mais estreita de povos semelhantes. Assim, adotaremos uma abordagem mais passiva, formando essencialmente uma abordagem confederal suave, apesar da organização mais federal."
 GRN_focus_The_North_Sea_Gambit: "O Gambito do Mar do Norte"
 GRN_focus_The_North_Sea_Gambit_desc: "As Ilhas Faroé ficam no meio do Mar do Norte. Garantiremos as ilhas por quaisquer meios para preparar o terreno e instigar uma reação dinamarquesa. Esperamos conseguir que a Dinamarca nos declare guerra e, assim, contornar a doutrina do Artigo 5 da OTAN. Com isso, também poderemos obter uma posição no continente, para uma base de operações mais próxima, ao norte ou ao sul."
 GRN_focus_Friends_On_The_Other_Side: "Amigos do Outro Lado"
 GRN_focus_Friends_On_The_Other_Side_desc: "Veja bem, para conquistar corações e mentes dos faroenses, devemos ser benevolentes por natureza. Assim, faremos tudo que for de nosso interesse para servir ao interesse deles. Algumas conversas sutis e casuais pela ilha com os moradores e os trabalhadores dos projetos, sobre como a Dinamarca nunca os tratou tão bem, é tudo de que precisamos para definir o ritmo e o tom e fazer o governo ceder a nós."
 GRN_focus_Operation_Fair_Oh: "Operação: Faroé"
 GRN_focus_Operation_Fair_Oh_desc: "As Ilhas Faroé estão sob controle dinamarquês, mas parece que os dinamarqueses não se importam muito além do status quo. E se simplesmente pegássemos as ilhas para ver o que acontece? Se não houver derramamento de sangue na tomada, será mesmo um ataque? E se conseguirmos convencer o povo a se juntar a nós antes que a Dinamarca faça um apelo, quem iria realmente se esforçar para ajudar a Dinamarca a lutar contra uma nação que todos provavelmente acham que a Dinamarca daria conta mesmo assim? É o plano perfeito, agressivo mas não agressivo."
 GRN_focus_Continental_Shenanigans: "Travessuras Continentais"
 GRN_focus_Continental_Shenanigans_desc: "Com nossos trampolins no Mar do Norte garantidos, agora voltamos nossa atenção ao continente. Em outras palavras, olhamos de volta para nosso antigo suserano para desembarcar no continente antes de descobrirmos exatamente para onde iremos em seguida."
 GRN_focus_Family_Investments: "Investimentos em Família"
 GRN_focus_Family_Investments_desc: "Como a Dinamarca está ciente de nossas travessuras, devemos despistá-la com uma abordagem mais passiva. Dado como foi nossa história recente, devemos deixá-los relaxar e baixar a guarda para que possamos resolver as coisas de forma mais pacífica, se possível."
 GRN_focus_Jylland_Investment_Firm: "Firma de Investimentos da Jutlândia"
 GRN_focus_Jylland_Investment_Firm_desc: "Faremos como na Islândia. Uma série em massa de investimentos que nos permitirá semear alguns pequenos problemas públicos para isolar politicamente a Dinamarca de seus compromissos de aliança."
 GRN_focus_Operation_Middleman: "Operação: Intermediário"
 GRN_focus_Operation_Middleman_desc: "A Dinamarca é o intermediário entre os membros da família nórdica e a terra de ninguém continental. Precisamos garantir isso se quisermos assegurar operações tranquilas mais adiante rumo ao nosso objetivo final."
 GRN_focus_Civil_Service_Integration: "Integração do Serviço Civil"
 GRN_focus_Civil_Service_Integration_desc: "Padronizar e integrar os serviços civis dinamarqueses ao atual aparato de serviço civil permitirá operações diárias mais coesas e menos disruptivas, tanto para os próprios programas quanto para as pessoas que precisam deles."
 GRN_focus_Nordic_Regional_Operations: "Operações Regionais Nórdicas"
 GRN_focus_Nordic_Regional_Operations_desc: "Com o centro de comando central obtido pela aquisição da Dinamarca, agora podemos generalizar melhor nossos objetivos e capacidades estratégicos. Ainda temos o mesmo formato, mas ele seguirá escopos mais amplos e/ou, ao menos, abordagens mais indiretas para melhor coesão."
 GRN_focus_West_Nordic_Interests: "Interesses do Oeste Nórdico"
 GRN_focus_West_Nordic_Interests_desc: "Buscaremos ganhar influência interna ao longo do tempo para garantir os recursos noruegueses e a aprovação civil de uma união nórdica maior à medida que o tempo passa."
 GRN_focus_North_Fjords_Investment_Firm: "Firma de Investimentos dos Fiordes do Norte"
 GRN_focus_North_Fjords_Investment_Firm_desc: "Semelhante ao que fizemos com a Islândia e a Groenlândia, desenvolveremos nossos próprios interesses por meio do desenvolvimento dos interesses noruegueses."
 GRN_focus_Operation_Fjordsland: "Operação: Fjordsland"
 GRN_focus_Operation_Fjordsland_desc: "Garantir a Noruega nos dá acesso irrestrito às rotas comerciais e aos recursos do Mar do Norte. Dá-nos uma moeda de troca com a OTAN para ajudar a nos defender da Rússia e, em geral, assegura uma posição na região nórdica mais ampla."
 GRN_focus_North_Sea_Negotiations: "Negociações do Mar do Norte"
 GRN_focus_North_Sea_Negotiations_desc: "Trabalhar com a população e descobrir o que ela quer do novo status quo ajudará a melhorar e suavizar o processo geral de integração."
 GRN_focus_Central_Nordic_Interests: "Interesses do Centro Nórdico"
 GRN_focus_Central_Nordic_Interests_desc: "Fazer o possível para garantir nossos interesses na Suécia e, assim, na região central das nações nórdicas seria extremamente benéfico para nossos empreendimentos futuros."
 GRN_focus_Karlstad_Central_Investments_Agency: "Agência Central de Investimentos de Karlstad"
 GRN_focus_Karlstad_Central_Investments_Agency_desc: "Trabalhar para investir e desenvolver a região em torno de Karlstad e de outras cidades criará opiniões mais favoráveis a nós, mas também nos permitirá investir não apenas no futuro da Suécia, mas também no nosso."
 GRN_focus_Operation_Great_Northern_War: "Operação: Grande Guerra do Norte"
 GRN_focus_Operation_Great_Northern_War_desc: "O lado amigável da política falhou conosco, apesar da disposição geral dos suecos na região. Assim, fomos forçados a recorrer a meios mais contundentes para alcançar nossos objetivos finais."
 GRN_focus_Stockholm_Community_Programs: "Programas Comunitários de Estocolmo"
 GRN_focus_Stockholm_Community_Programs_desc: "Aproximar-se das comunidades e fazer mais para fomentar impressões estáveis e, de modo geral, mais positivas ajudará a assentar melhor os esforços de integração, tanto com a população quanto com as administrações locais."
 GRN_focus_Eastern_Nordic_Interests: "Interesses do Leste Nórdico"
 GRN_focus_Eastern_Nordic_Interests_desc: "Garantir a Finlândia nos daria uma ótima moeda de troca entre as potências que medem forças, EUA e Rússia. Como a Finlândia compartilha uma fronteira significativa com o Grande Urso do Leste, podemos muito bem ver o que podemos fazer para beneficiar nossos objetivos futuros."
 GRN_focus_Suomen_Investment_Agency: "Agência de Investimentos Suomen"
 GRN_focus_Suomen_Investment_Agency_desc: "Garantir os desenvolvimentos e o futuro que não apenas parecem ser o que o povo finlandês quer, mas também fazer o que pudermos para facilitar o futuro que desejamos, é uma ótima forma de ver se conseguimos garantir a Finlândia para nossos próprios fins."
 GRN_focus_Operation_Mannerheim: "Operação: Mannerheim"
 GRN_focus_Operation_Mannerheim_desc: "Garantir as terras congeladas da Finlândia será como garantir um lar longe de casa. O terreno, embora em geral muito mais plano, ainda tem uma aspereza semelhante em seu ambiente. Assim, devemos conseguir garantir essas terras sem muita dificuldade no geral."
 GRN_focus_Continued_Peaceable_Autonomy: "Autonomia Pacífica Contínua"
 GRN_focus_Continued_Peaceable_Autonomy_desc: "O povo finlandês é um povo estimado, que aprecia tanto a solidão quanto a solidariedade entre seus semelhantes culturais. Assim, com entendimento mútuo e acordos de mesmo nível, poderemos controlar o território com ampla ajuda, desde que haja tratamento justo e nenhuma coação dos civis ou do governo para agirem contra a própria vontade. Embora isso soe ruim para nós, na verdade é muito mais fácil do que muitos parecem perceber."
 GRN_focus_Solidifying_Nordic_Unity: "Solidificando a Unidade Nórdica"
 GRN_focus_Solidifying_Nordic_Unity_desc: "Com nossas ambições chegando a uma conclusão humilde, devemos simplesmente relaxar e desfrutar dos frutos de nosso trabalho enquanto nos dedicamos a criar uma nova união nórdica que rivalizará com as outras uniões ao redor do mundo."
 GRN_focus_Continental_Ambitions: "Ambições Continentais"
 GRN_focus_Continental_Ambitions_desc: "Com as nações nórdicas agora consolidadas, podemos voltar nossa atenção ao sul. Embora esses objetivos sejam maiores do que poderíamos realmente conceber na prática, se usarmos nosso modelo diplomático como fizemos até agora, devemos conseguir alcançar o próximo passo de nossas ambições externas: a União Continental Inuit."
 GRN_focus_Eastern_Continental_Interests: "Interesses Continentais do Leste"
 GRN_focus_Eastern_Continental_Interests_desc: "Com nossas consolidações no norte concluídas, agora podemos olhar para o sul. Assim, criaremos uma grande fronteira oriental ao obter uma posição na região do Báltico."
 GRN_focus_Operation_Nordic_Adjacent: "Operação: Vizinhança Nórdica"
 GRN_focus_Operation_Nordic_Adjacent_desc: "A Estônia é a zona de desembarque mais próxima de nossas posses finlandesas. Podemos lançar paraquedistas ou realizar uma ampla invasão naval a partir de Helsinque e garantir rapidamente a nação antes que outras potências pensem em protestar."
 GRN_focus_Operation_Riga_River: "Operação: Rio Riga"
 GRN_focus_Operation_Riga_River_desc: "Garantir a Letônia nos dá um planalto central para nos espalharmos e garantirmos o restante da região do Báltico."
 GRN_focus_Operation_Vilnius: "Operação: Vilnius"
 GRN_focus_Operation_Vilnius_desc: "A Lituânia é, possivelmente, a potência mais desenvolvida da região do Báltico; se a derrubarmos, as outras duas serão um passeio no parque."
 GRN_focus_Baltic_Behestment: "Ordem Báltica"
 GRN_focus_Baltic_Behestment_desc: "Com as autoridades locais e as populações civis começando a relaxar e aceitar o novo status quo, agora podemos começar a integrar as antigas nações bálticas. Embora sejam um povo de vontade forte e, por isso, talvez possamos trabalhar para lhes dar um status semelhante ao que acertamos com as autoridades locais finlandesas."
 GRN_focus_North_Sea_Security: "Segurança do Mar do Norte"
 GRN_focus_North_Sea_Security_desc: "Garantir a totalidade do Mar do Norte e do Atlântico Norte se provará imensamente útil em termos de influência global. Devemos trabalhar para alinhar as Ilhas Célticas e seus respectivos ocupantes, de modo a pavimentar o caminho para nosso governo mais benevolente."
 GRN_focus_Operation_Albion: "Operação: Albion"
 GRN_focus_Operation_Albion_desc: "Garantir o núcleo do que é e/ou foi o Reino \"Unido\" será crucial para novas operações nas Ilhas Célticas. Sem falar em estabelecer uma posição crítica para quaisquer travessuras no continente ocidental."
 GRN_focus_Operation_Highlander: "Operação: Highlander"
 GRN_focus_Operation_Highlander_desc: "Garantir a região escocesa nos dá controle quase total da zona estratégica do Mar do Norte. Isso lançará as bases para um avanço geral rumo ao sul, para a ilha principal."
 GRN_focus_Operation_Great_Western_Nation: "Operação: Grande Nação Ocidental"
 GRN_focus_Operation_Great_Western_Nation_desc: "A ocupação estratégica do País de Gales e do que foi a Great Western Railway nos permitirá usar a infraestrutura para coordenar interesses tanto no oeste, rumo à Irlanda, quanto no sudeste, rumo à Inglaterra."
 GRN_focus_Operation_Be_My_Mann: "Operação: Be My Mann"
 GRN_focus_Operation_Be_My_Mann_desc: "Garantir a estratégica Ilha de Man nos dará uma nota de rodapé crítica ao lidar com quaisquer questões navais relativas à totalidade das Ilhas Célticas."
 GRN_focus_Operation_Ulster: "Operação: Ulster"
 GRN_focus_Operation_Ulster_desc: "Com a ilha ainda dividida até hoje, nossa melhor aposta é derrubar o estado irlandês do norte, mais fraco, o Ulster. Garantir isso nos permite marchar para o sul e garantir o restante da ilha esmeralda."
 GRN_focus_Operation_Emerald_Isle: "Operação: Ilha Esmeralda"
 GRN_focus_Operation_Emerald_Isle_desc: "Garantir toda a Irlanda nos permitirá preparar melhores avanços rumo aos confins mais ocidentais do continente. Sem falar que servirá de área de preparação para a outra ilha do Reino \"Unido\"."
 GRN_focus_Celtic_Consolidations: "Consolidações Célticas"
 GRN_focus_Celtic_Consolidations_desc: "Iniciar esforços de integração e normalizar nosso governo e nossa autoridade sobre as terras e o povo levará tempo. Mas prestar auxílio, oferecer serviços e mostrar que podemos nos dar bem sob a nova bandeira permitirá que todos voltem à rotina."
 GRN_focus_Western_European_Advances: "Avanços na Europa Ocidental"
 GRN_focus_Western_European_Advances_desc: "Nossa marcha constante pelo continente será um salto gigante à frente enquanto olhamos para a seção centro-oeste das nações."
 GRN_focus_Operation_Bonaparte: "Operação: Bonaparte"
 GRN_focus_Operation_Bonaparte_desc: "A França é a pedra angular do teatro de operações da Europa Ocidental. Não só isso, mas serve de porta de entrada para a Ibéria quando decidirmos descer até lá. É hora de consolidar a nação mais ocidental do eixo central do continente."
 GRN_focus_Operation_Windmill: "Operação: Moinho de Vento"
 GRN_focus_Operation_Windmill_desc: "Os Países Baixos servirão como uma ótima base ocidental no continente. Com a maior parte do país sendo litoral, devemos conseguir garanti-lo num piscar de olhos."
 GRN_focus_Operation_Rhine_Rumble: "Operação: Estrondo do Reno"
 GRN_focus_Operation_Rhine_Rumble_desc: "A Alemanha define o ponto mais central de todo o continente europeu. Se a garantirmos, garantimos todo o continente no devido tempo."
 GRN_focus_Operation_Chocolate_Waffle: "Operação: Waffle de Chocolate"
 GRN_focus_Operation_Chocolate_Waffle_desc: "A Bélgica, uma nação que razoavelmente não deveria existir. Sendo uma criação britânica de algumas centenas de anos atrás, a nação é um espinho no lado da verdadeira unidade europeia. Removeremos esse espinho com a máxima pressa."
 GRN_focus_Operation_Speed_Bump: "Operação: Lombada"
 GRN_focus_Operation_Speed_Bump_desc: "É Luxemburgo, não é uma ameaça, exceto quando se une a uma coalizão de outras nações. Vamos tomá-lo agora, tchauzinho."
 GRN_focus_French_Values_Greenlandic_Leadership: "Valores Franceses, Liderança Groenlandesa"
 GRN_focus_French_Values_Greenlandic_Leadership_desc: "Garantir que a população altamente agitada da França se conforme ao novo status quo exigirá grandes quantidades de tempo e esforço. Mas, se pudermos mostrar que não queremos mudar seus valores, apenas a liderança no comando, poderemos, com sorte, trabalhar muito mais com o povo."
 GRN_focus_German_Traditions_Greenlandic_Initiative: "Tradições Alemãs, Iniciativas Groenlandesas"
 GRN_focus_German_Traditions_Greenlandic_Initiative_desc: "A Alemanha tem uma rica história de tradições militares. Se pudermos capitalizar isso, teremos certeza da hegemonia continental. A destreza marcial alemã misturada com as ambições groenlandesas de autovalorização."
 GRN_focus_Low_Countries_Low_Maintainance: "Países Baixos, Baixa Manutenção"
 GRN_focus_Low_Countries_Low_Maintainance_desc: "A expectativa dos Países Baixos é simplesmente ser tratados com justiça e poder permanecer de espírito livre. Considerando que tentamos criar uma união de iguais, isso está se mostrando muito mais fácil do que o esperado."
 GRN_focus_Iberian_Atlantic_Interests: "Interesses do Atlântico Ibérico"
 GRN_focus_Iberian_Atlantic_Interests_desc: "A região ibérica abriga um ponto de estrangulamento estratégico entre a região do Atlântico, majoritariamente central, e também um ponto de acesso principal ao Mediterrâneo. Devemos garantir esse ponto vital de comércio e logística se quisermos garantir o continente como um todo."
 GRN_focus_Operation_Castile: "Operação: Castela"
 GRN_focus_Operation_Castile_desc: "A Espanha é o cão mais forte da Ibéria; se a garantirmos, praticamente garantimos a região."
 GRN_focus_Operation_Fontainebleau: "Operação: Fontainebleau"
 GRN_focus_Operation_Fontainebleau_desc: "Napoleão tentou certa vez conquistar os portugueses por meio de um tratado com a Espanha da época. Hoje não é nada disso, pois conquistaremos Portugal em nome da unidade ibérica e do federalismo europeu. Um novo amanhecer nos aguarda, e Portugal é a porta de entrada para a consolidação ibérica."
 GRN_focus_Operation_The_Other_Galicia: "Operação: A Outra Galícia"
 GRN_focus_Operation_The_Other_Galicia_desc: "A maioria das pessoas fora da Europa, ao ouvir falar de Galícia, pensa na região do oeste da Ucrânia. Mas, na verdade, pretendemos lidar com a nação galega no noroeste da Ibéria."
 GRN_focus_Operation_Basquing_In_the_Sun: "Operação: Tomando Sol Basco"
 GRN_focus_Operation_Basquing_In_the_Sun_desc: "Lidar com a nação basca será uma tarefa simples, se é que já não lidamos. Lidamos? Esqueci."
 GRN_focus_Operation_Barcelona: "Operação: Barcelona"
 GRN_focus_Operation_Barcelona_desc: "Garantir a seção nordeste da Ibéria nos permite ter uma posição do outro lado das cadeias de montanhas que definiam a fronteira franco-espanhola."
 GRN_focus_Operation_Casablanca: "Operação: Casablanca"
 GRN_focus_Operation_Casablanca_desc: "A região sul conhecida como Andaluzia, dentro da Ibéria, nos dará controle incontestado de nossa metade do estreito de Gibraltar."
 GRN_focus_Iberian_Idealism: "Idealismo Ibérico"
 GRN_focus_Iberian_Idealism_desc: "Com a região sob nosso controle total, agora podemos começar a fomentar um senso de unidade regional. Usando as culturas e os povos, sua história e seu espírito para impulsionar um novo senso de orgulho. Unidade pela força e prosperidade, camaradagem nos bons e nos maus momentos."
 GRN_focus_Alpine_Block_Nations: "Nações do Bloco Alpino"
 GRN_focus_Alpine_Block_Nations_desc: "A região centro-sul é dominada por terrenos montanhosos. Das cadeias alpinas nas partes mais ao norte das fronteiras da Itália às várias cadeias que descem pela própria nação italiana. Devemos garantir essa região naturalmente defensiva se quisermos avançar mais a leste."
 GRN_focus_Operation_Neutral_No_More: "Operação: Chega de Neutralidade"
 GRN_focus_Operation_Neutral_No_More_desc: "A Suíça é uma nação de montanhas. Se a conquistarmos, podemos conquistar praticamente qualquer coisa."
 GRN_focus_Operation_Vienna_Calling: "Operação: Viena Chamando"
 GRN_focus_Operation_Vienna_Calling_desc: "Dos Alpes às planícies húngaras, garantiremos a nação da Áustria e abriremos o caminho para o leste e o sul."
 GRN_focus_Operation_Slovene_And_Slide: "Operação: Eslovênia e Deslize"
 GRN_focus_Operation_Slovene_And_Slide_desc: "Obter uma posição nos Bálcãs do norte nos ajudará a garantir a região quando voltarmos nossa atenção para ela."
 GRN_focus_Operation_Gelato: "Operação: Gelato"
 GRN_focus_Operation_Gelato_desc: "A nação italiana fica estrategicamente no centro-sul da Europa e do Mar Mediterrâneo. Se a garantirmos, garantimos um aparato naval vital para novas operações."
 GRN_focus_Securing_Local_Interests: "Garantindo os Interesses Locais"
 GRN_focus_Securing_Local_Interests_desc: "Zelar pelos interesses das populações locais e por suas necessidades ajudará a lançar uma luz nova e mais positiva sobre a situação. Esperamos que, ao nos aproximarmos melhor do povo, possamos ter uma transição de poder mais suave."
 GRN_focus_Great_Eastern_Interests: "Grandes Interesses do Leste"
 GRN_focus_Great_Eastern_Interests_desc: "Com nossa posição no leste garantida, agora podemos nos expandir para o restante da Europa Oriental. Das regiões de fronteira polonesas e tchecas às fronteiras bielorrussa e ucraniana. Iniciaremos nossa marcha rumo ao leste."
 GRN_focus_Operation_Heartbeat: "Operação: Batimento Cardíaco"
 GRN_focus_Operation_Heartbeat_desc: "A Polônia é o coração pulsante da Europa Oriental. Foi chamada de o Texas europeu devido ao seu pesado investimento em preparo militar. Agora colocaremos isso à prova definitiva."
 GRN_focus_Operation_Carpathia: "Operação: Cárpatos"
 GRN_focus_Operation_Carpathia_desc: "A maior parte da nação eslovaca fica na curva norte da grande cordilheira dos Cárpatos. Se quisermos uma plataforma geral para seguir ao sul, rumo aos Bálcãs, devemos cruzar essas montanhas."
 GRN_focus_Operation_Final_Rhapsody: "Operação: Rapsódia Final"
 GRN_focus_Operation_Final_Rhapsody_desc: "Garantir a Tchéquia nos permite praticamente solidificar toda a abordagem norte rumo aos Bálcãs. É apenas mais um passo rumo à unidade europeia."
 GRN_focus_Operation_White_Russian: "Operação: Russo Branco"
 GRN_focus_Operation_White_Russian_desc: "A Bielorrússia é o pino que sustenta o interesse russo na Europa, além das velhas ambições históricas, é claro. Precisaremos tirar o vento das velas deles se quisermos solidificar de verdade nosso controle no continente."
 GRN_focus_Operation_Bread_Basket: "Operação: Celeiro"
 GRN_focus_Operation_Bread_Basket_desc: "Garantir o celeiro do continente nos beneficiaria de muitas formas; é uma certeza que devemos obter."
 GRN_focus_Operation_Soviet_Storm: "Operação: Tempestade Soviética"
 GRN_focus_Operation_Soviet_Storm_desc: "A Transnístria é uma nação que, em si, é uma cápsula do tempo. Sendo um dos últimos bastiões da URSS, essa nação, embora pequena, é extremamente orgulhosa e desafiadora por meio de suas maquinações quase sombrias, que de algum modo a mantêm viva como nação."
 GRN_focus_Operation_Your_Right_No_Your_Other_Right: "Operação: Sua Direita, Não, a Outra Direita"
 GRN_focus_Operation_Your_Right_No_Your_Other_Right_desc: "Devemos atacar a Moldávia... não, não a região romena, a nação. Sim, eu sei que é confuso, mas não me pergunte, pergunte a eles quando chegarmos lá."
 GRN_focus_Eastern_Territorial_Authority_Bureau: "Gabinete da Autoridade Territorial do Leste"
 GRN_focus_Eastern_Territorial_Authority_Bureau_desc: "O ETAB é uma agência dedicada a lidar com as nações orientais, mais de espírito livre. Essa gente tem terras vastas e rurais que, mais ou menos, ainda são indomadas em termos de centralização. Podemos realizar projetos de infraestrutura e programas de aproximação com a comunidade para, com sorte, acalmar e conter quaisquer problemas prolongados que possamos enfrentar."
 GRN_focus_Balkan_Bounties: "Fartura dos Bálcãs"
 GRN_focus_Balkan_Bounties_desc: "Os últimos pregos neste nosso extenso projeto: as nações balcânicas. Uma terra de guerras e história; trabalharemos bastante para domar esse zoológico volátil de região."
 GRN_focus_Operation_Nosferatu: "Operação: Nosferatu"
 GRN_focus_Operation_Nosferatu_desc: "A bacia da Transilvânia, dentro dos Montes Cárpatos, é uma posição defensiva estratégica. A própria Romênia também abriga uma boa quantidade de produção de energia e, por isso, podemos usar melhor esses recursos em benefício de todos."
 GRN_focus_Operation_Bulgar: "Operação: Búlgaro"
 GRN_focus_Operation_Bulgar_desc: "A solidificação da seção leste ao longo do Mar Negro nos ajudará a consolidar nossos esforços rumo ao interior dos Bálcãs."
 GRN_focus_Operation_Alexander_Not_So_Great: "Operação: Alexandre Nem Tão Grande"
 GRN_focus_Operation_Alexander_Not_So_Great_desc: "A nação da Macedônia alega ter a orgulhosa figura histórica de Alexandre, o Grande. Bem, não o vejo agora, então vamos simplesmente assumir daqui."
 GRN_focus_Operation_Trianon: "Operação: Trianon"
 GRN_focus_Operation_Trianon_desc: "A nação húngara se estende pelo planalto centro-norte dos Bálcãs. Se a garantirmos, teremos um caminho livre rumo ao sul, em direção ao Mar Mediterrâneo."
 GRN_focus_Operation_Princip: "Operação: Princip"
 GRN_focus_Operation_Princip_desc: "Da Mão Negra que causou uma guerra mundial, agora damos à nação sérvia um revés para resolver um dos maiores estopins da região."
 GRN_focus_Operation_Koso_Woah: "Operação: Koso Uau"
 GRN_focus_Operation_Koso_Woah_desc: "A lombada que é o Kosovo é mais um espinho no lado da Sérvia do que será para nós. Assim, isso deve ser um empreendimento rápido."
 GRN_focus_Operation_Scissors: "Operação: Tesoura"
 GRN_focus_Operation_Scissors_desc: "Garantir a Croácia nos permite assegurar um aparato costeiro significativo e posições de ataque pelo flanco enquanto perseguimos ambições mais ao sul."
 GRN_focus_Operation_Minefield: "Operação: Campo Minado"
 GRN_focus_Operation_Minefield_desc: "Nossa maior preocupação em subjugar a nação muito dividida da Bósnia é o fato de que o país inteiro é praticamente um campo minado pré-instalado. Assim, precisaremos levar muito equipamento para lidar com isso se quisermos realmente chegar a algum lugar em breve."
 GRN_focus_Operation_Mountain_Man: "Operação: Homem da Montanha"
 GRN_focus_Operation_Mountain_Man_desc: "As montanhas de Montenegro são um osso duro de roer, mas chegaremos lá em breve."
 GRN_focus_Operation_Adriatic_Gateway: "Operação: Portal do Adriático"
 GRN_focus_Operation_Adriatic_Gateway_desc: "Garantir a Albânia nos permite fechar o Mar Adriático. Com isso, asseguramos um enorme potencial de construção naval e, essencialmente, uma enorme rede de portos que poderíamos usar para operações no Mar Mediterrâneo."
 GRN_focus_Operation_This_Is_Sparta: "Operação: Isto É Esparta"
 GRN_focus_Operation_This_Is_Sparta_desc: "A Grécia, nação peninsular e insular que detém tesouros culturais e históricos significativos. Garantiremos esse centro da própria história, mas devemos fazer o possível para não destruir sítios históricos."
 GRN_focus_Southern_Territorial_Authority_Commission: "Comissão da Autoridade Territorial do Sul"
 GRN_focus_Southern_Territorial_Authority_Commission_desc: "Criar uma comissão dedicada nos permitirá focar as medidas de integração e unidade para que não tenhamos um problema nacional por causa dos problemas de uma área específica que não consegue manter as mãos para si."
 GRN_focus_Establishing_The_Frozen_Federation: "Estabelecendo a Federação Congelada"
 GRN_focus_Establishing_The_Frozen_Federation_desc: "Finalmente conseguimos. Criamos uma nação federal unida que une as nações congeladas do norte com o restante das nações da União Continental Europeia. É claro que não é perfeita e, portanto, não abrange toda a região geograficamente continental da Europa. Mas, de qualquer forma, esta é a nossa marca na história e faremos o possível para honrar os valores e os povos que agora abrigamos sob nossas asas. À Federação!"
 GRN_focus_The_Great_Ice_Shelf: "A Grande Plataforma de Gelo"
 GRN_focus_The_Great_Ice_Shelf_desc: "O vasto interior de nossa nação nada mais é do que uma imensa camada de gelo. Bem, com o andamento do desenvolvimento de nossa nação, temos conseguido desgastar a plataforma por meio do uso controlado da água congelada. Agora podemos direcionar nossa atenção ao interior com total empenho e nos preparar para povoá-lo e desenvolvê-lo adequadamente. Pois o futuro é verde e descobriremos as terras sob o gelo."
 GRN_focus_Southern_Interior_Development_Projects: "Projetos de Desenvolvimento do Interior Sul"
 GRN_focus_Southern_Interior_Development_Projects_desc: "Começaremos a enfrentar a região do interior sul que marcamos para desenvolvimento e preparação logística."
 GRN_focus_Southern_Settlement_Projects: "Projetos de Assentamento no Sul"
 GRN_focus_Southern_Settlement_Projects_desc: "Para ajudar logisticamente, começaremos a estabelecer uma pequena série de assentamentos em locais estratégicos para impulsionar não só a população local, mas também criar uma espécie de cadeia de suprimentos na região. Isso nos ajudará a viabilizar projetos futuros que nos empenharemos em realizar para finalmente domar uma boa parte da Grande Plataforma de Gelo."
 GRN_focus_Southern_Infrastructure_Projects: "Projetos de Infraestrutura no Sul"
 GRN_focus_Southern_Infrastructure_Projects_desc: "Para conectar nossos assentamentos e dar início a qualquer tipo de atividade econômica, precisaremos de alguma forma de infraestrutura para garantir que estabeleçamos o padrão-ouro de como domar a natureza de verdade."
 GRN_focus_Southern_Economic_Projects: "Projetos Econômicos do Sul"
 GRN_focus_Southern_Economic_Projects_desc: "Com pessoas e infraestrutura agora presentes na região do Interior Sul, podemos começar a construir aos poucos uma base econômica interna e/ou local. Essa fundação preparará o terreno para um crescimento considerável com o passar do tempo."
 GRN_focus_Southern_Mining_Projects: "Projetos de Mineração do Sul"
 GRN_focus_Southern_Mining_Projects_desc: "Com a região se estabilizando aos poucos nos assuntos econômicos e sociais, é hora de iniciar projetos de mineração em furos profundos. Usaremos o gelo para minerar continuamente em profundidade, obtendo dados geológicos reais e evitando o superaquecimento dos equipamentos devido ao diferencial de temperatura."
 GRN_focus_Taming_The_Southern_Interior: "Domando o Interior Sul"
 GRN_focus_Taming_The_Southern_Interior_desc: "Com as pessoas, a infraestrutura e os recursos disponíveis, agora podemos dizer que domamos de fato parte da Grande Plataforma de Gelo. É claro que nosso trabalho não está concluído, longe disso. Mas agora podemos olhar com confiança para o grande horizonte do norte e dizer que estamos numa jornada grandiosa e frutífera."
 GRN_focus_Central_Plateau_Development_Projects: "Projetos de Desenvolvimento do Planalto Central"
 GRN_focus_Central_Plateau_Development_Projects_desc: "Com a região sul domada em termos de fundação, agora podemos começar a levar a grande cruzada do gelo para a região central. Com mais gelo e potencial de área de terra, poderemos investir em mais indicadores fundamentais."
 GRN_focus_Central_Settlement_Projects: "Projetos de Assentamento no Centro"
 GRN_focus_Central_Settlement_Projects_desc: "Assim como na região sul, começaremos a estabelecer assentamentos estratégicos por todo o planalto."
 GRN_focus_Central_Infrastructure_Projects: "Projetos de Infraestrutura no Centro"
 GRN_focus_Central_Infrastructure_Projects_desc: "Com nossos assentamentos estabelecidos, podemos começar a criar uma rede de infraestrutura suficiente para ligar tudo adequadamente."
 GRN_focus_Central_Economic_Projects: "Projetos Econômicos do Centro"
 GRN_focus_Central_Economic_Projects_desc: "População, ok. Infraestrutura, ok. Agora seguimos adiante para estabelecer um aparato econômico local."
 GRN_focus_Central_Mining_Projects: "Projetos de Mineração do Centro"
 GRN_focus_Central_Mining_Projects_desc: "Assim como na região sul, finalmente criamos a rede, tanto econômica quanto social, para preparar as operações de extração de recursos. A área é muito maior que a do sul; que seja um empreendimento frutífero."
 GRN_focus_Taming_The_Central_Plateau: "Domando o Planalto Central"
 GRN_focus_Taming_The_Central_Plateau_desc: "Com as pessoas, os assentamentos, a comida, a economia e os recursos todos em seus lugares, agora podemos dizer oficialmente e com confiança que domamos a Grande Plataforma de Gelo. Haverá muitas dificuldades com o passar do tempo, mas por ora, e no futuro previsível, podemos nos deleitar na grandiosa glória polar de nossa grande e próspera nação."
 GRN_eu_adjacent_nation: "Uma Nação Adjacente à UE"
 GRN_eu_adjacent_nation_desc: "A Groenlândia está numa situação interessante. Sendo a mais afastada do continente europeu, ela não é e provavelmente nunca será um Estado-membro da UE. No entanto, devido ao seu status de Colônia da Coroa Dinamarquesa, recebe o mesmo status de migração e viagem de qualquer outro Estado-membro da UE. Assim, muitos groenlandeses usam isso para buscar melhores oportunidades de educação, devido à falta de desenvolvimento geral da ilha."
 GRN_economic_pains: "Dores Econômicas"
 GRN_economic_pains_desc: "A população da Groenlândia gira em torno de 50 mil há décadas e já foi ainda menor, já que o clima rigoroso e a logística da nação se tornam o fator central do desenvolvimento. No novo milênio o problema persiste, e os líderes da nação devem procurar fazer algo para adaptar e ajustar as necessidades da economia se ela e a própria nação quiserem ser mais do que apenas estagnadas."
 GRN_idea_colonial_subsidy: "Subsídio Colonial"
 GRN_idea_colonial_subsidy_desc: "Nossa nação é extremamente subdesenvolvida, a ponto de depender muito dos subsídios dinamarqueses para as operações diárias. Se quisermos sequer pensar em independência da coroa dinamarquesa, precisamos encontrar uma forma de não mais exigir esse subsídio como meio de simples sobrevivência."
 GRN_idea_narrow_gauge_nation: "Nação de Bitola Estreita"
 GRN_idea_narrow_gauge_nation_desc: "A flexibilidade e a economia de custos dos trilhos e equipamentos de bitola estreita nos permitirão liderar o desenvolvimento e a conectividade da nação como um todo. Além disso, há o benefício adicional de segurança, por ser mais barato torná-los seguros em comparação com os trilhos e equipamentos de bitola padrão convencional."
 GRN_idea_battle_for_independence: "Batalha pela Independência"
 GRN_idea_battle_for_independence_desc: "Chegamos a um ponto em que nossa independência está assegurada. Iniciaremos campanhas de pressão maciças para garantir que nossa independência seja assegurada ainda em nossa geração."
 GRN_ideas_political_freedoms: "Liberdades Políticas"
 GRN_ideas_political_freedoms_desc: "Com nossa nação livre para escolher o que seu povo deseja, não sentimos restrições a nenhuma ideologia específica."
 GRN_ideas_emerging_political_influences: "Influências Políticas Emergentes"
 GRN_ideas_emerging_political_influences_desc: "Com nossa nação agora independente, podemos nos concentrar em mostrar uma abordagem moderna em nossa política enquanto emergimos neste admirável mundo novo."
 GRN_ideas_non_aligned_political_influences: "Influências Políticas Não Alinhadas"
 GRN_ideas_non_aligned_political_influences_desc: "Com nossa nação livre para traçar o caminho que quiser, nenhum lado geopolítico parece realmente nos beneficiar e, por isso, buscaremos focar em nós mesmos de uma forma mais próxima da neutralidade."
 GRN_ideas_nationalist_political_influences: "Influências Políticas Nacionalistas"
 GRN_ideas_nationalist_political_influences_desc: "Nossa nação é livre, nosso povo é unido, nossa nação é a prioridade máxima de nosso foco no futuro. O Nacionalismo Groenlandês Nos Dá Tranquilidade."
 GRN_idea_alumina_research_institute: "Instituto de Pesquisa de Alumina"
 GRN_idea_alumina_research_institute_desc: "A criação do ARI é fundamental para compreender a extração, o refino e a utilização eficiente de recursos. Esse complexo dedicado de P&D levará nossa nação a novos patamares nas negociações de comércio exterior, bem como em meios mais práticos de políticas autárquicas."
 GRN_idea_economic_development_visas: "Vistos de Desenvolvimento Econômico"
 GRN_idea_economic_development_visas_desc: "Quem deseja se mudar e se estabelecer na nação pode solicitar um visto de classe 1, conhecido como Visto de Desenvolvimento Econômico. O EDV é essencialmente um processo de integração para ajudar os novos cidadãos a se estabelecer e encontrar emprego, onde possam contribuir para o desenvolvimento e o crescimento geral da nação."
 GRN_idea_sanctioned_immigration_efforts: "Esforços de Imigração Autorizada"
 GRN_idea_sanctioned_immigration_efforts_desc: "Por meio de esforços dedicados, tentaremos garantir um crescimento populacional constante por meio da imigração."
 GRN_idea_strategic_mineral_leasing: "Arrendamento Mineral Estratégico"
 GRN_idea_strategic_mineral_leasing_desc: "A declaração de arrendamento mineral a empresas estrangeiras é uma espada muito afiada de se manejar. Devemos regular especificamente o que elas podem minerar, onde podem minerar e para onde esses minerais irão. Assim, podemos esperar limitar as formas mais excessivas de interferência estrangeira em nossa estrutura política sempre que possível, ao mesmo tempo em que as usamos para desenvolver nossas moedas de troca."
 GRN_idea_contracting_a_workforce: "Contratando uma Força de Trabalho"
 GRN_idea_contracting_a_workforce_desc: "Usar o aparato de alfândega e segurança de fronteira para ajudar a garantir uma força de trabalho contratada nos permite expandir empresas e indústrias num ritmo constante e mais confiável. Afinal, eles leram o contrato e o assinaram."
 GRN_idea_agriculture_automations: "Automações Agrícolas"
 GRN_idea_agriculture_automations_desc: "Nosso principal problema como nação é simplesmente manter uma força de trabalho estável para empregar. Assim, decidimos investir pesado no Setor Agrícola para reduzir bastante a necessidade de recursos humanos adicionais nele."
 GRN_idea_war_production_automations: "Automações da Produção de Guerra"
 GRN_idea_war_production_automations_desc: "Nosso principal problema como nação é simplesmente manter uma força de trabalho estável para empregar. Assim, decidimos investir pesado no Setor de Produção de Guerra para reduzir bastante a necessidade de recursos humanos adicionais nele. Liberando tanto trabalhadores quanto potencial de mão de obra para os militares, se necessário."
 GRN_idea_industrial_automations: "Automações Industriais"
 GRN_idea_industrial_automations_desc: "Nosso principal problema como nação é simplesmente manter uma força de trabalho estável para empregar. Assim, decidimos investir pesado no Setor Manufatureiro para reduzir bastante a necessidade de recursos humanos adicionais nele. Esse setor em constante expansão costuma exigir o maior número de trabalhadores devido à escala e, por isso, isso pode se mostrar o mais benéfico para nós."
 GRN_idea_corporate_automations: "Automações Corporativas"
 GRN_idea_corporate_automations_desc: "Nosso principal problema como nação é simplesmente manter uma força de trabalho estável para empregar. Assim, decidimos investir pesado nos Setores de Serviços de Escritório e Tecnologia para reduzir bastante a necessidade de recursos humanos adicionais neles. Esse setor, bastante dependente de recursos humanos, costuma exigir o maior número de trabalhadores devido às demandas brutas do setor e, por isso, isso pode se mostrar o mais benéfico para nós."
 GRN_idea_strategic_mining_automations: "Automações Estratégicas de Mineração"
 GRN_idea_strategic_mining_automations_desc: "Ao reformular a forma como mineramos recursos e focar na capacidade de enviar menos gente às minas sempre que possível, podemos maximizar os esforços de mineração sem o risco iminente de perda de vidas. É claro que não será perfeito, mas esses veículos autônomos e certos equipamentos devem permitir oportunidades muito melhores."
 GRN_idea_pro_military_economic_organization: "Organização Econômica Pró-Militar"
 GRN_idea_pro_military_economic_organization_desc: "Ao reorientar a economia em torno de mais requisitos civis e de alistamento, melhoraremos as capacidades de manufatura de nossas fábricas de armas para reduzir a mão de obra total necessária para operar as instalações. É claro que uma reformulação tão drástica prejudicará a capacidade bruta de produção, mas, assim que as operações estiverem estabilizadas e em funcionamento, essas instalações deverão produzir mais com muito menos."
 GRN_idea_frozen_warfare_training: "Treinamento para Guerra no Gelo"
 GRN_idea_frozen_warfare_training_desc: "Nossos programas de treinamento focarão principalmente no combate em inverno e em climas frios. É claro que tentaremos realizar outros treinamentos quando e onde possível, mas nossa casa é fria e, portanto, devemos treinar adequadamente para defendê-la."
 GRN_idea_polar_logistics_doctrine: "Doutrina de Logística Polar"
 GRN_idea_polar_logistics_doctrine_desc: "Construir fundamentalmente nossos equipamentos para serem mais bem usados no frio extremo nos permite lutar melhor como queremos, caso uma força inimiga decida desembarcar em nossa ilha."
 GRN_idea_artillery_specialist_corps: "Corpo de Especialistas em Artilharia"
 GRN_idea_artillery_specialist_corps_desc: "A artilharia é o essencial para causar mais dano do que receber, se você estiver em boa posição. Para manter isso a nosso favor, precisaremos desenvolver e expandir nosso corpo de artilharia a um padrão que torne nossas baixas as menores possíveis."
 GRN_idea_heavy_anti_air_investments: "Pesados Investimentos Antiaéreos"
 GRN_idea_heavy_anti_air_investments_desc: "Na era moderna do combate, a nova rainha do campo de batalha é a aeronave. Caças, bombardeiros, o que quer que você precise, eles farão. Bem, como nossas forças armadas são tão pequenas, precisamos encontrar uma forma de impedir que o inimigo faça o que quer. Assim, iniciaremos um pesado investimento no projeto e desenvolvimento de equipamentos antiaéreos para garantir que nossos soldados em terra tenham uma chance real de luta."
 GRN_idea_army_officer_corps: "Corpo de Oficiais do Exército"
 GRN_idea_army_officer_corps_desc: "O estabelecimento e a padronização de um corpo de treinamento de oficiais do exército nos permite moldar, refinar e melhorar nossos líderes táticos e estratégicos para aprimorar não apenas o entendimento deles, mas também as tropas que lideram."
 GRN_idea_small_ship_developments: "Desenvolvimentos de Navios Pequenos"
 GRN_idea_small_ship_developments_desc: "Os primeiros desenvolvimentos estão se mostrando frutíferos; nossos primeiros projetos de corvetas mostram que, embora possamos refinar e melhorar, esse ganho estratégico só tem significado se conseguirmos que as pessoas tripulem adequadamente as embarcações."
 GRN_idea_expanding_small_vessel_designs: "Ampliando os Projetos de Pequenas Embarcações"
 GRN_idea_expanding_small_vessel_designs_desc: "Para garantir que nosso departamento de corvetas seja complementado por inovações semelhantes, focaremos nos tipos fragata e contratorpedeiro para compor por completo nossas frotas de pequenas embarcações."
 GRN_idea_attack_submarine_programs: "Programas de Submarinos de Ataque"
 GRN_idea_attack_submarine_programs_desc: "O ASP é uma série de programas de desenvolvimento e teste criados para comprovar os limites e os meios de uso mais eficazes das novas tecnologias."
 GRN_idea_missile_submarine_programs: "Programas de Submarinos de Mísseis"
 GRN_idea_missile_submarine_programs_desc: "O MSP é uma série de programas de desenvolvimento e teste criados para comprovar a forma mais eficaz de usar a tecnologia de mísseis no combate naval."
 GRN_idea_navy_officer_corps: "Corpo de Oficiais da Marinha"
 GRN_idea_navy_officer_corps_desc: "Estabelecer o Corpo de Treinamento de Oficiais Navais nos permitirá elevar os padrões de excelência em combate e liderança de nosso ramo de serviço naval."
 GRN_idea_aviation_innovations: "Inovações da Aviação"
 GRN_idea_aviation_innovations_desc: "Os primeiros resultados começam a dar frutos, pois a instalação TARI começou a lançar suas inovações nos modelos gerais de projeto e produção para teste e refinamento. Elas podem se mostrar úteis à medida que continuamos a reformar e aperfeiçoar nosso Plano de Ação de Supremacia Aérea."
 GRN_idea_air_dominance_program: "Programa de Domínio Aéreo"
 GRN_idea_air_dominance_program_desc: "O ADP é dedicado à classe específica de aeronaves de caça e a como melhorar suas capacidades gerais de combate para preservar nossos céus do assédio inimigo."
 GRN_idea_bombing_innovations: "Inovações em Bombardeio"
 GRN_idea_bombing_innovations_desc: "As inovações nas capacidades de combate ar-solo e ar-navio nos permitiram especializar nossos esforços gerais de bombardeio para serem mais eficazes do que nunca. Devemos continuar capitalizando esses esforços se quisermos evitar qualquer desembarque real de forças inimigas em nossa ilha."
 GRN_idea_bomber_design_department: "Departamento de Projeto de Bombardeiros"
 GRN_idea_bomber_design_department_desc: "Dedicado a melhorar e ampliar a eficácia de nossas frotas aéreas de bombardeio, o BDD é o auge da inovação aérea de nossa nação."
 GRN_idea_air_officer_corps: "Corpo de Oficiais Aéreos"
 GRN_idea_air_officer_corps_desc: "Desenvolver o corpo de oficiais da força aérea nos permite melhorar a eficácia geral e inovar em liderança e táticas aplicadas às operações de combate aéreo."
 GRN_idea_general_staff_corps: "Corpo do Estado-Maior"
 GRN_idea_general_staff_corps_desc: "Com nossas forças armadas finalmente desenvolvidas a ponto de ser necessário um estado-maior de comando unificado entre os ramos, nossa nação deu e continuará a dar grandes passos em nossa defesa nacional."
 GRN_idea_agricultural_futurist_policies: "Políticas Agrícolas Futuristas"
 GRN_idea_agricultural_futurist_policies_desc: "Priorizar esforços de pesquisa e investimentos econômicos no setor agrícola em geral nos permite ficar à frente das inovações e continuar a escalar adequadamente as demandas de que precisaremos se focarmos em mais do que apenas as necessidades domésticas."
 GRN_idea_polar_infrastructure_developments: "Desenvolvimentos de Infraestrutura Polar"
 GRN_idea_polar_infrastructure_developments_desc: "Nossos investimentos contínuos na construção de nossa infraestrutura, bem como em formas de tornar esses investimentos mais duradouros, nos permitiram inovar em áreas em que muitos nem pensariam."
 GRN_idea_economic_modernity_policies: "Políticas de Modernidade Econômica"
 GRN_idea_economic_modernity_policies_desc: "Nossa nação está na vanguarda do desenvolvimento. Certamente continuaremos essa grande marcha rumo à prosperidade da nação e de nossos cidadãos."
 GRN_ideas_mining_needs: "Necessidades de Mineração"
 GRN_ideas_mining_needs_desc: "Decidimos focar o setor de mineração nas necessidades nacionais, em vez de algo realmente além disso. Isso nos permitiu negociar estrategicamente nossos preços de exportação, ao mesmo tempo em que reduz as demandas do setor em termos de recursos humanos."
 GRN_ideas_mining_greeds: "Ganância da Mineração"
 GRN_ideas_mining_greeds_desc: "Decidimos focar o setor de mineração nas necessidades nacionais e internacionais, em vez de apenas no que é necessário no momento. Como resultado, conseguimos exibir bastante nossos recursos e negociar acordos de verdade em nossos esforços de exportação. Embora um pequeno problema de aumento na demanda por trabalhadores pareça ter permeado o setor econômico, o benefício geral parece justificar os meios para atingir o fim."
 GRN_ideas_intense_foreign_affairs_budgeting: "Orçamento Intenso de Relações Exteriores"
 GRN_ideas_intense_foreign_affairs_budgeting_desc: "Se quisermos ganhar alguma tração real nas negociações diplomáticas no exterior, precisamos nos concentrar seriamente nesses empreendimentos. Com nossa força atual, nos falta estabilidade interna devido às preocupações com nossa população em comparação com nossa economia. Então somos, essencialmente, uma casca dura com um interior vazio se não jogarmos bem nossas cartas."
 GRN_ideas_political_shenanigans: "Travessuras Políticas"
 GRN_ideas_political_shenanigans_desc: "Foi lançada alguma luz recente sobre esforços de descontentes em nossa nação. Não parecem ser mais que um incômodo, dado o estado saudável em que estamos, mas precisaremos descobrir quem está fazendo essa porcaria se quisermos voltar a um estado mais calmo."
 GRN_ideas_domesticating_foreign_policy: "Domesticando a Política Externa"
 GRN_ideas_domesticating_foreign_policy_desc: "Garantir nossas ambições externas significa que precisamos garantir também a frente doméstica, além de garantir os meios para alavancar nossa capacidade de influência externa."
 GRN_ideas_the_frozen_federation: "A Federação Congelada"
 GRN_ideas_the_frozen_federation_desc: "Bem, unimos o continente da melhor forma que pudemos. Agora a única coisa é que também unimos todos os problemas sob uma só bandeira. Embora não seja o fim do mundo, certamente será uma viagem turbulenta no futuro previsível."
 GRN_domestic_and_civil_affairs_administration: "Administração de Assuntos Domésticos e Civis"
 GRN_domestic_and_civil_affairs_administration_desc: "A Groenlândia tem uma série de problemas, e o cerne deles decorre de sua baixa população. A administração de assuntos domésticos e civis tem a tarefa de zelar pelos cidadãos da Groenlândia e de reformar, acrescentar ou remover políticas ao longo do tempo para garantir o melhor e mais justo resultado possível para os cidadãos da ilha."
 GRN_federal_budgets: "Despesas Nacionais"
 GRN_federal_budgets_desc: "A ilha não tem muita gente, mas ainda exige gastos significativos para manter e desenvolver as coisas adequadamente. Precisaremos buscar melhores métodos de desenvolvimento ou orçamento geral se quisermos um futuro fiscal estável."
 GRN_revenue_collection_administration: "Administração de Arrecadação de Receitas"
 GRN_revenue_collection_administration_desc: "A RCA é designada como a agência de arrecadação e fiscalização de impostos do governo nacional. Deve trabalhar com os formuladores de políticas governamentais para garantir que os impostos sejam cobrados de forma justa e eficiente e sejam devidamente fiscalizados, para assegurar um orçamento nacional equilibrado."
 GRN_economic_development_board: "Conselho de Desenvolvimento Econômico"
 GRN_economic_development_board_desc: "O EDB é a espinha dorsal da formulação de políticas econômicas e do crescimento e desenvolvimento nacional geral. Essa parte do governo se propõe a pegar políticas e programas e tentar construir a economia da nação, além de elevar a qualidade de vida dos cidadãos sempre que possível. Embora a logística seja o maior obstáculo nesse sentido, o outro é simplesmente a mão de obra e o capital, além da pura força de vontade para simplesmente fazer."
 GRN_national_armed_services_of_greenland: "Forças Armadas Nacionais da Groenlândia"
 GRN_national_armed_services_of_greenland_desc: "As Forças Armadas da Groenlândia são uma instituição interessante, pois a população da ilha é tão pequena que não há muito que ela possa fazer. No entanto, apesar disso, a ilha tem algum tipo de força militar e, em teoria, tem a capacidade de expandi-la. Agora cabe ao futuro dos acontecimentos dizer como essa expansão pode ocorrer."
 GRN_idea_the_great_ice_shelf: "A Grande Plataforma de Gelo"
 GRN_idea_the_great_ice_shelf_desc: "A Plataforma de Gelo da Groenlândia é uma das maiores massas de gelo do mundo a cobrir uma quantidade significativa de terra. A plataforma de gelo pode chegar a até três quilômetros de profundidade e é o maior obstáculo a qualquer desenvolvimento sério fora das áreas costeiras."
