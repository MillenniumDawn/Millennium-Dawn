 econ_forum_pivot_east: "Pivot to the East"
 econ_forum_pivot_east_desc: "Western governments will not come while the sanctions stand. Our organizers can fill the halls with delegations from our BRICS partners and from Asia instead."
 econ_forum_pivot_east_tt: "For a year, every §YBRICS§! member and Asian nation receives a standing invitation to our next summits and is likelier to attend."
 econ_forum_pivot_east_active_tt: "Our forum is already courting the East."
 econ_forum_news.7.t: "The West Stays Away From the [econ_forum_name_founded]"
 econ_forum_news.7.d: "No government from NATO or the European Union has sent a delegation to this year's [econ_forum_name_founded]. With Western sanctions on [FROM.GetNameDef] still in force, officials and executives from those countries have been told to stay home, and the organizers have turned to partners who are still willing to come."
 econ_forum_news.7.a: "The empty seats are noticed"
 econ_forum.5.t: "Our Agenda at the [econ_forum_name_invited]"
 econ_forum.5.d: "Our delegation is going to the [econ_forum_name_invited]. Every government there wants something from the week. We should decide what ours is."
 econ_forum.5.a: "Court the investors"
 econ_forum.5.a_tt: "If our delegation attends, investment in our country costs less for a year, on top of the usual delegation bonus. The saving grows with the forum's prestige and doubles for a head of government."
 econ_forum.5.b: "Strike deals on the sidelines"
 econ_forum.5.b_tt: "If our delegation attends, we and the host, and we and every other government there, gain §G15§! opinion of each other."
 econ_forum.5.c: "Showcase our industry"
 econ_forum.5.c_tt: "If our delegation attends, we gain influence in the host, scaled by the forum's prestige and doubled for a head of government. Every program track that matters to us gains §G2§! prestige at this forum."
 econ_forum.5.e: "No set agenda"
 econ_forum_investor_pitch_modifier: "Forum Investor Pitch"
 econ_forum_summit_deal: "Struck deals at an economic forum"
 econ_forum_row_sponsor: "Sponsor"
 econ_forum_row_sponsor_tt: "§YSponsor a session§! at this forum's next summit: §R$1.5§! billion and §R10§! Political Power.\nThe forum gains §G3§! sponsor points, up to 25 a summit, and the host gains §G10§! opinion of us.\nOnce a summit, while the forum is preparing, and not while we boycott it or are at war with the host."
 econ_forum_row_speak: "Speak"
 econ_forum_row_speak_tt: "§YBid for a headline slot§! at this summit: §R25§! Political Power.\nOur delegation must be going, and the summit must have a free slot (3 a summit). The bid wins 40% of the time, plus 20% if our head of government attends and 10% as a great or super power.\nA win books a headline speaker for the summit. When the summit is held and our delegation attends, the keynote raises our foreign influence for a year, more at prestigious forums. Once a summit."
 econ_forum_row_boycott: "Boycott"
 econ_forum_row_unboycott: "Rejoin"
 econ_forum_row_boycott_tt: "§YBoycott this forum§!: §R25§! Political Power. Any delegation we planned stays home.\nThe forum loses §R2§! prestige, or §R5§! if we are a great or super power, and the host loses §R30§! opinion of us. We receive no invitations until we rejoin, which is free. A great or super power's boycott makes the news. Boycotting again in the same summit cycle repeats neither the prestige loss nor the news.\nA great or super power's boycott can lead AI governments in its faction out with it. If we host a forum of our own, it gains a point of prestige for each and invites them while they stay out."
 econ_forum.6.t: "Our Keynote at the [econ_forum_name_bid]"
 econ_forum.6.d_won: "The organizers of the [econ_forum_name_bid] have given our head of delegation a headline slot. The speech will draw the cameras, and our standing abroad with them."
 econ_forum.6.d_lost: "The organizers of the [econ_forum_name_bid] have declined to give our delegation a headline slot. Our delegation will still attend from the audience."
 econ_forum.6.a: "Noted"
 econ_forum.6.b: "Take a hard line"
 econ_forum.6.b_tt: "Our keynote pulls no punches: when it is delivered, its foreign influence bonus is §G50%§! larger, but the host loses §R15§! opinion of us."
 econ_forum_row_request: "Request"
 econ_forum_row_request_tt: "§YAsk for an invitation§! to this summit: §R15§! Political Power.\nThe organizers say yes 30% of the time, plus up to 30% the less prestigious the forum, 20% as a great or super power and 15% if the host likes us (opinion above 25). A host that dislikes us (opinion below -25) is 20% less likely to agree.\nOnly while the forum prepares and its invitations are open, until a month before the summit, and only if we hold no invitation, have not declined one and do not boycott it. Once a summit. Forums run by other players invite through their own decisions."
 econ_forum.7.t: "No Invitation to the [econ_forum_name_request]"
 econ_forum.7.d: "The organizers of the [econ_forum_name_request] have answered our request politely and firmly: there is no seat for our delegation this year. Our diplomats can try again when the next summit opens its preparations."
 econ_forum.7.a: "Their loss"
 econ_forum_invite_to_private_room: "Seat [FROM.GetName] in the Private Room"
 econ_forum_invite_to_private_room_desc: "The real business of a summit happens in a room the cameras never see, where a handful of heads of state sit down with the chief executives and investors who matter."
 econ_forum_invite_to_private_room_tt: "[FROM.GetName] gets a seat in our summit's invitation-only private room, up to four seats a summit. If its delegation attends, it gains a year of §G5%§! cheaper investment, everyone in the room gains §G15§! opinion of each other, us included, and each seated government adds §G2§! to the summit score. Its delegation is §G10%§! more likely to come. One session in seven leaks."
 econ_forum.11.t: "A Seat in the Private Room"
 econ_forum.11.d: "The organizers of the [econ_forum_name_room] have offered us a seat in their invitation-only private room: a closed session where a few heads of state sit down with the chief executives and investors who matter. Nothing said there is on the record. Usually."
 econ_forum.11.a: "Take the seat"
 econ_forum.11.a_tt: "If our delegation attends, we gain a year of §G5%§! cheaper investment and §G15§! opinion with everyone else in the room. There is a small chance the session leaks, which costs everyone in the room §R2%§! stability."
 econ_forum.11.b: "Decline the seat"
 econ_forum.12.t: "Talks on the Sidelines"
 econ_forum.12.d: "The organizers of the [econ_forum_name_talks] in [econ_forum_talks_host.GetName] have arranged for our delegation to meet [econ_forum_talks_other.GetName] away from the cameras during this year's summit. Neither side has to promise anything. Both will be judged on whether they show up."
 econ_forum.12.a: "We will sit down with them"
 econ_forum.12.a_tt: "If both delegations attend, the talks reach an accord, worth §G25§! opinion between us and [econ_forum_talks_other.GetName], or collapse, costing §R10§!. Talks go better at a more prestigious forum, when heads of government attend, and between less bitter rivals."
 econ_forum.12.b: "We will not be seen with them"
 econ_forum.12.b_tt: "The talks are called off."
 econ_forum.13.t: "Our Competitiveness Report Is Out"
 econ_forum.13.d: "The [econ_forum_name_hosted]'s competitiveness report ranks [?ROOT.econ_forum_report_news_top.GetName] first among this year's guests and [?ROOT.econ_forum_report_news_bottom.GetName] last. The top three gain a year of cheaper investment. The bottom three will pay more for it, and they will not thank us."
 econ_forum.13.a: "Investors will read it closely"
 econ_forum.14.t: "A Summer Davos in China"
 econ_forum.14.d: "The World Economic Forum wants a second meeting every year, held in China each September: an Annual Meeting of the New Champions for the fast-growing companies and governments of the emerging economies. The organizers ask us to co-host it. Davos would come to us, on our ground."
 econ_forum.14.a: "Welcome the New Champions"
 econ_forum.14.a_tt: "Summer Davos can meet in China each September from now on. Emerging economies that attend gain cheaper investment and a little research, and give us influence and opinion. Its standing also adds to the WEF's January score. It is not a forum we host, so any forum of our own is unaffected."
 econ_forum.14.b: "Our own forums are enough"
 econ_forum.14.b_tt: "There will be no Summer Davos."
 econ_forum.15.t: "Summer Davos Meets"
 econ_forum.15.d: "This year's Annual Meeting of the New Champions in [CHI.GetName] drew §Y[?global.econ_forum_new_champions_last|0]§! delegations from the emerging economies. Its standing is now §Y[?global.econ_forum_new_champions_prestige|0]§!."
 econ_forum.15.a: "The New Champions have arrived"
 econ_forum.16.t: "A Young Global Leader"
 econ_forum.16.d: "The World Economic Forum has named one of our rising ministers to its Forum of Young Global Leaders. For five years they will join the politicians, executives and founders who meet each year in Davos, and the doors the network opens already help our government."
 econ_forum.16.a: "An honor for the whole government"
 econ_forum.17.t: "\"Davos Runs Our Government\""
 econ_forum.17.d: "Since the World Economic Forum launched its Great Reset, a claim has spread online that its Young Global Leaders take their orders from Davos. Our ministers on the list are now its favorite example, and opposition parties are asking whom the government really serves."
 econ_forum.17.a: "We stand by our record"
 econ_forum.17.b: "Quietly leave the forum's network"
 econ_forum_book_star_speaker: "Invite a Star Speaker"
 econ_forum_book_star_speaker_desc: "Some names fill a hall on their own. A star on our stage costs more than an ordinary keynote, but nobody else can take them from us."
 econ_forum_book_star_speaker_tt: "We invite a star headline speaker to our summit, no roll needed and safe from rival forums. The star fills a speaker slot, raises our standing in their sector by §G3§!, and governments that care about that sector are §G10%§! more likely to attend."
 econ_forum.10.t: "A Star for the Stage"
 econ_forum.10.desc: "Our organizers have reached the agents of the most sought-after speakers in the world. Whoever we choose will headline the summit and draw the governments who care about their field."
 econ_forum.10.a: "Jensen Huang"
 econ_forum.10.a_tt: "The founder of NVIDIA speaks on chips and accelerated computing. Our §YAI and Technology§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.b: "Demis Hassabis"
 econ_forum.10.b_tt: "The co-founder of DeepMind speaks on artificial intelligence and scientific discovery. Our §YAI and Technology§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.c: "Dario Amodei"
 econ_forum.10.c_tt: "The chief executive of Anthropic speaks on frontier AI and how to make it safe. Our §YAI and Technology§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.d: "Fatih Birol"
 econ_forum.10.d_tt: "The executive director of the International Energy Agency speaks on energy security. Our §YEnergy§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.e: "Warren Buffett"
 econ_forum.10.e_tt: "The chairman of Berkshire Hathaway speaks on long-term investing. Our §YFinance§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.f: "Christine Lagarde"
 econ_forum.10.f_tt: "The head of the International Monetary Fund, and later the European Central Bank, speaks on the world economy. Our §YFinance§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.g: "Jens Stoltenberg"
 econ_forum.10.g_tt: "The former Norwegian prime minister and NATO Secretary General speaks on defense and alliances. Our §YDefense Industry§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.h: "Ngozi Okonjo-Iweala"
 econ_forum.10.h_tt: "The Director-General of the World Trade Organization speaks on trade and supply chains. Our §YInfrastructure and Trade§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.i: "Muhammad Yunus"
 econ_forum.10.i_tt: "The founder of Grameen Bank speaks on microfinance and lifting people out of poverty. Our §YDevelopment§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.j: "Bill Gates"
 econ_forum.10.j_tt: "The co-founder of Microsoft and of the Gates Foundation speaks on global health and development. Our §YDevelopment§! standing rises by §G3§!, and governments that care about it are §G10%§! more likely to attend."
 econ_forum.10.l: "More speakers"
 econ_forum.10.k: "Cancel the invitation"
 econ_forum_book_controversial_speaker: "Book a Controversial Speaker"
 econ_forum_book_controversial_speaker_desc: "A headline speaker who divides the room fills the press gallery. Some governments will stay home rather than share a stage with them."
 econ_forum_book_controversial_speaker_tt: "We choose a controversial headline speaker for our summit. Each fills a speaker slot, raises our standing in their sector by §G5§! and adds §G4§! to the summit score, but the governments that object are §R15%§! less likely to attend, and their regional powers lose §R10§! opinion of us."
 econ_forum.9.t: "A Provocateur for the Stage"
 econ_forum.9.desc: "Our organizers have a short list of speakers who are guaranteed to fill the press gallery and empty a few delegation seats. Which voice should headline our summit?"
 econ_forum.9.a: "Nick Land"
 econ_forum.9.a_tt: "The accelerationist philosopher, a leading figure of Warwick's Cybernetic Culture Research Unit, speaks on artificial intelligence and capital. Our §YAI and Technology§! standing rises by §G5§! and the summit gains §G4§! score from the attention, but democratic governments object."
 econ_forum.9.b: "Reza Negarestani"
 econ_forum.9.b_tt: "The Iranian philosopher, author of Cyclonopedia, speaks on oil as the hidden engine of world politics. Our §YEnergy§! standing rises by §G5§! and the summit gains §G4§! score from the attention, but major oil exporters object."
 econ_forum.9.c: "Neema Parvini"
 econ_forum.9.c_tt: "The British scholar and critic of managerial elites speaks on who really rules. Our §YFinance§! standing rises by §G5§! and the summit gains §G4§! score from the attention, but European Union members object."
 econ_forum.9.d: "Aleksandr Dugin"
 econ_forum.9.d_tt: "The Russian philosopher of Eurasianism speaks on geopolitics and a multipolar world. Our §YDefense Industry§! standing rises by §G5§! and the summit gains §G4§! score from the attention, but NATO members object."
 econ_forum.9.e: "Slavoj Žižek"
 econ_forum.9.e_tt: "The Slovenian philosopher and critic of global capitalism speaks on ideology and inequality. Our §YDevelopment§! standing rises by §G5§! and the summit gains §G4§! score from the attention, but nationalist and fascist governments object."
 econ_forum.9.f: "Jamie Dimon"
 econ_forum.9.f_tt: "The chief of JPMorgan Chase speaks on banks, markets and regulation. Our §YFinance§! standing rises by §G5§! and the summit gains §G4§! score from the attention, but communist governments object."
 econ_forum.9.g: "Howard Lutnick"
 econ_forum.9.g_tt: "The Cantor Fitzgerald chief and champion of tariffs speaks on trade and reshoring. Our §YInfrastructure and Trade§! standing rises by §G5§! and the summit gains §G4§! score from the attention, but BRICS members object."
 econ_forum.9.i: "More speakers"
 econ_forum.9.h: "Cancel the booking"
 econ_forum.8.t: "A Signing Ceremony at the [econ_forum_name_ceremony]"
 econ_forum.8.d: "The organizers of the [econ_forum_name_ceremony] want an agreement with us signed on their stage at the coming summit. If our delegation attends, both governments will trade warmer words and investors on each side will take note."
 econ_forum.8.a: "We will sign"
 econ_forum.8.a_tt: "If our delegation attends the summit, we sign: §G20§! opinion both ways with the host, and its investors favour us for a year."
 econ_forum.8.b: "Decline the ceremony"
 econ_forum_news.8.t: "[?FROM.econ_forum_news_boycotter.GetName] Boycotts the [econ_forum_name_founded]"
 econ_forum_news.8.d: "[?FROM.econ_forum_news_boycotter.GetName] has announced that it will send no delegation to the [econ_forum_name_founded] in [FROM.GetName] while the dispute lasts. The organizers insist the summit will go ahead, but the empty seats will be hard to miss."
 econ_forum_news.8.a: "A pointed absence"
 econ_forum_news.9.t: "[?FROM.econ_forum_news_boycotter.GetName] Leads a Walkout from the [econ_forum_name_founded]"
 econ_forum_news.9.d: "[?FROM.econ_forum_news_boycotter.GetName] has announced that it will send no delegation to the [econ_forum_name_founded] in [FROM.GetName]. Allied delegations that walked out with it: §Y[?FROM.econ_forum_news_walkouts|0]§!. The summit will still meet, but it no longer speaks for the whole room."
 econ_forum_news.9.d_rival: "[?FROM.econ_forum_news_boycotter.GetName] has announced that it will send no delegation to the [econ_forum_name_founded] in [FROM.GetName]. Allied delegations that walked out with it: §Y[?FROM.econ_forum_news_walkouts|0]§!. Their delegations are expected at the [econ_forum_name_news_rival] instead, where the organizers are already rewriting the guest list."
 econ_forum_news.9.a: "The room splits"
 econ_forum_news.10.t: "[FROM.GetName] Founds the [econ_forum_name_founded]"
 econ_forum_news.10.d_rival: "[FROM.GetName] has founded the [econ_forum_name_founded], a rival to the [econ_forum_name_news_rival] it has been boycotting. Its allies are expected to fill the first summit, and the old forum's organizers are counting the empty chairs."
 econ_forum_news.10.d: "[FROM.GetName] has founded the [econ_forum_name_founded], a summit for the governments that no longer trust the old forums to speak for them."
 econ_forum_news.10.a: "A second table"
 econ_forum_council_name_0: "AI and Technology Council"
 econ_forum_council_name_1: "Energy Council"
 econ_forum_council_name_2: "Finance Council"
 econ_forum_council_name_3: "Defense Industry Council"
 econ_forum_council_name_4: "Infrastructure and Trade Council"
 econ_forum_council_name_5: "Development Council"
 econ_forum_news.11.t: "The [econ_forum_name_founded] Launches the [econ_forum_council_name]"
 econ_forum_news.11.d: "The [econ_forum_name_founded] has set up a standing [econ_forum_council_name] for the governments that keep coming back. Its members will meet between summits, and the organizers hope the habit will keep them coming."
 econ_forum_news.11.a: "Another committee"
 econ_forum_news.12.t: "Leaked: The [econ_forum_name_founded]'s Private Room"
 econ_forum_news.12.d: "Notes from the invitation-only session at the [econ_forum_name_founded] in [FROM.GetName] have reached the press: heads of state and chief executives trading favors behind closed doors. The governments in the room face awkward questions at home, and the forum has never had so much coverage."
 econ_forum_news.12.a: "Nothing to see here"
 econ_forum_message_open: "Summit Message: Open for Business"
 econ_forum_message_open_desc: "Tell the world our summit is for everyone with money to invest and deals to sign, whatever flag they fly."
 econ_forum_message_open_tt: "For this summit: every invited AI government is §G10%§! more likely to attend, and the summit score gains §G3§!. One message a summit."
 econ_forum_message_autonomy: "Summit Message: Strategic Autonomy"
 econ_forum_message_autonomy_desc: "Tell the world our summit is for partners who build their own future, not for those who would dictate it."
 econ_forum_message_autonomy_tt: "For this summit: invited AI governments that are our core members or in our faction are §G15%§! more likely to attend, and every other invited AI government §R10%§! less likely. One message a summit."
 econ_forum_message_media: "Summit Message: Media Blitz"
 econ_forum_media_treasury_tt: "We have more than §Y$2§! billion in the treasury"
 econ_forum_message_media_desc: "Buy every screen from the airport to the conference hall. If the summit goes well, the world will hear of it. If it goes badly, the world will hear of that too."
 econ_forum_message_media_tt: "Costs §R$2§! billion. For this summit: the score gains §G5§!, and the forum's prestige moves §Y50%§! of the way to the score instead of 30%, up or down. One message a summit."
 econ_forum_audience_eu: "Court the European Union"
 econ_forum_audience_eu_desc: "Make this summit the place where Brussels and the European capitals come to talk business with us."
 econ_forum_audience_eu_tt: "For this summit: EU governments that are regional or greater powers get standing invitations. Invited AI EU governments are §G15%§! more likely to attend, and every other invited AI government §R5%§! less likely. Each EU government that attends adds §G2§! to the summit score, up to §G6§!, and it and we warm to each other. One audience a summit."
 econ_forum_audience_usa: "Court the United States"
 econ_forum_audience_usa_desc: "Make this summit the place where Washington and its allies come to talk business with us."
 econ_forum_audience_usa_tt: "For this summit: the United States and NATO's regional and greater powers get standing invitations. If they are AI, the United States is §G25%§! more likely to attend and NATO members §G15%§!, and every other invited AI government is §R5%§! less likely. Each of them that attends adds §G2§! to the summit score, up to §G6§!, and it and we warm to each other. One audience a summit."
 econ_forum_audience_china: "Court China"
 econ_forum_audience_china_desc: "Make this summit the place where Beijing and its partners come to talk business with us."
 econ_forum_audience_china_tt: "For this summit: China and the regional and greater powers in its faction get standing invitations. If they are AI, China is §G25%§! more likely to attend and its faction §G15%§!, and every other invited AI government is §R5%§! less likely. Each of them that attends adds §G2§! to the summit score, up to §G6§!, and it and we warm to each other. One audience a summit."
 econ_forum_audience_russia: "Court Russia"
 econ_forum_audience_russia_desc: "Make this summit the place where Moscow and its partners come to talk business with us."
 econ_forum_audience_russia_tt: "For this summit: Russia and the regional and greater powers in its faction get standing invitations. If they are AI, Russia is §G25%§! more likely to attend and its faction §G15%§!, and every other invited AI government is §R5%§! less likely. Each of them that attends adds §G2§! to the summit score, up to §G6§!, and it and we warm to each other. One audience a summit."
 econ_forum_launch_council: "Launch a Forum Council"
 econ_forum_council_prestige_tt: "Our forum has at least §Y50§! prestige"
 econ_forum_launch_council_desc: "Governments that come back year after year want more than a seat in the hall. A standing council on our strongest sector would give them a reason to keep returning."
 econ_forum_launch_council_tt: "Our forum gets a standing council on its strongest sector, once and for good. Every government that attends two summits in a row is a member: after each summit it attends, it gains a sector bonus for a year, it is §G10%§! more likely to attend, and each member present adds §G1§! to the summit score, up to §G10§!.\nAI and technology: §G+2%§! research speed. Energy: §G+3%§! energy output. Finance: §G5%§! cheaper investment. Defense industry: §G+3%§! factory efficiency growth. Infrastructure and trade: §G+5%§! infrastructure construction speed. Development: §G+2%§! stability."
