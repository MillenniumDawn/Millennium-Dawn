 EST.conservatism_1_desc: "(国家保守主义) - 祖国联盟\n\n祖国联盟是爱沙尼亚的基督教民主和民族保守派政党。该党信奉社会保守和经济自由的价值观。该党还利用爱沙尼亚的民族主义，其名称意为“祖国联盟”。"
