 ARM_assemble_meliq_union: "Reunir a União Meliq"
 ARM_assemble_meliq_union_desc: "A União Meliq é uma organização aristocrática tradicionalista na Armênia. Devemos reunir todos os membros dessa organização para eleger um novo Tagavor."
 ARM_armeno_ari_union: "União Armeno-Ariana"
 ARM_armeno_ari_union_desc: "A União Armeno-Ariana é um partido político na Armênia que defende o retorno às antigas tradições pagãs armênias e a restauração do Reino da Armênia como era na antiguidade."
 ARM_going_to_roots: "Voltar às Nossas Raízes"
 ARM_going_to_roots_desc: "A Armênia é um dos países mais antigos que sobreviveram até hoje. Nem todos os povos conseguiram sobreviver, mas foi a nossa nação que trilhou um caminho espinhoso, que muitos não teriam suportado. A fé de nossos ancestrais, seus feitos gloriosos e suas tradições foram o que nos ajudou a sobreviver e a continuar lutando."
 ARM_glory_of_tigr: "Glória de Tigranes, o Grande"
 ARM_glory_of_tigr_desc: "Chegou a hora de a Armênia se reerguer e se unir em torno de seu novo reino renascido, que deve alcançar as alturas atingidas por Tigranes, o Grande, e até mesmo superá-las!"
 ARM_state_christianity: "Cristianismo de Estado"
 ARM_state_christianity_desc: "A constituição de nosso Estado já descreve a importância da Igreja Armênia na vida de nosso povo. No entanto, chegou a hora de tornar a igreja parte do Estado e integrá-la a todos os aspectos da vida."
 ARM_restoring_aspets: "Restaurar os Aspets"
 ARM_restoring_aspets_desc: "Os Aspet Dziavors ou Ayrudzis eram cavaleiros armênios que serviam como guerreiros leais aos tagavors armênios ou às famílias nobres. Devemos restaurar esse título dentro de nossas forças armadas, combinando antigas tradições com a guerra moderna."
 ARM_support_pan_iranists: "Ira Parta"
 ARM_support_pan_iranists_desc: "Nós, armênios, somos tudo o que restou do Império Arsácida, que, numa infeliz sequência de eventos, foi destruído pelos sassânidas. Agora, devemos decidir: devemos nos aliar e nos unir aos persas, ou devemos restaurar nossa dinastia no Irã?"
 ARM_give_money_to_kob: "Apoiar o KOB"
 ARM_give_money_to_kob_desc: "Konstantin Petrov's movement offers us a way to challenge the Russian government from within. Funding its organizers could give us an ally in Moscow, but Russian investigators may uncover the operation."
 ARM_supporting_chechens: "Apoiar a Ichkéria"
 ARM_supporting_chechens_desc: "Durante a Primeira Guerra da Chechênia, Roland von Bagratuni manteve correspondência com Dzhokhar Dudaev, na qual ambos discutiram a resistência à Rússia e ambições pan-caucasianistas."
 ARM_crusader_legacy: "Legado Cruzado"
 ARM_crusader_legacy_desc: "Entre as boas obras que o povo armênio fez pela igreja e pelo mundo cristão, deve-se destacar especialmente que, naqueles tempos em que os príncipes e guerreiros cristãos foram retomar a Terra Santa, nenhum povo ou nação, com o mesmo entusiasmo, alegria e fé, veio em seu auxílio como os armênios, que forneceram aos cruzados cavalos, provisões e guias. Os armênios auxiliaram esses guerreiros com total coragem e lealdade durante as guerras santas. - Papa Gregório XIII"
 ARM_our_old_realm: "Dívida de Eduardo"
 ARM_our_old_realm_desc: "O último rei da Cilícia Armênia, em seus esforços para convocar uma nova cruzada para a libertação da Armênia, visitou o rei da Inglaterra, Eduardo III. Na esperança de restaurar o Reino da Cilícia, Levon colocou o tesouro do Estado sob custódia, confiando-o ao rei inglês. As partes firmaram um acordo de que o tesouro seria mantido na Inglaterra até a libertação e a restauração do Reino Armênio. É hora de exigir nosso dinheiro de volta."
 ARM_renewed_nobility: "Nobreza Renovada"
 ARM_renewed_nobility_desc: "Não devemos apenas integrar a antiga nobreza, que pode hesitar em cooperar conosco, mas também criar uma nova casta de aristocracia a partir de nossos comandantes militares."
 ARM_polish_hung_dilem: "Dilema Polonês"
 ARM_polish_hung_dilem_desc: "Roland von Bagratuni veio para a Armênia a partir da Polônia e está disposto a apoiar o movimento monarquista em sua primeira pátria."
 ARM_fate_of_italy: "Destino da Itália"
 ARM_fate_of_italy_desc: "A Casa de Saboia possui por direito o título de Reis da Itália. Devemos começar a pensar em como nos unir à nossa segunda coroa."
 ARM_true_tseghakronism: "Verdadeiro Tseghakronismo"
 ARM_true_tseghakronism_desc: "Como monarquia recém-estabelecida, devemos apoiar as ideias tseghakronistas, pois elas se alinham plenamente com nossa orientação tradicionalista."
 ARM_new_religious_thought: "Novo Pensamento Religioso"
 ARM_new_religious_thought_desc: "Os líderes de nosso conselho acreditam que está no espírito de nossos ideais reviver a antiga fé nativa armênia e integrá-la à nossa sociedade."
 ARM_support_ossetia: "Apoiar a Ossétia"
 ARM_support_ossetia_desc: "A Ossétia é um dos poucos países do Cáucaso que não apenas são do mesmo sangue que nós, mas também compartilham os mesmos ideais. Devemos apoiar sua causa."
 ARM_pan_caucasianism: "Pan-Caucasianismo"
 ARM_pan_caucasianism_desc: "A unificação de todo o Cáucaso sob nossa bandeira é o objetivo de nosso rei, e sua vontade deve ser cumprida."
 ARM_liberating_levant: "Libertação do Levante"
 ARM_liberating_levant_desc: "Assim como fizeram nossos ancestrais ocidentais e armênios, devemos iniciar uma nova cruzada para libertar o Levante e restabelecer os antigos Estados cruzados."
 ARM_true_urheimat: "Verdadeira Urheimat"
 ARM_true_urheimat_desc: "A Armênia é a verdadeira pátria de todos os indo-europeus. Assim como nosso partido declarou originalmente:\n\nO Planalto Armênio\nPátria dos armênios,\nBerço da Civilização Ariana.\nArianos de todo o mundo,\nlibertem-no,\nlibertem-se."
 arm_empire.2.t: "Unificação com Nossos Irmãos Armênios"
 arm_empire.2.d: "É hora de nos unirmos e ficarmos lado a lado com nossos irmãos armênios. Juntos construiremos um grande futuro, punindo nossos inimigos comuns e conduzindo nossos povos à prosperidade."
 arm_empire.2.a: "Vamos nos unir"
 arm_empire.2.b: "Então vamos cruzar os braços"
 arm_empire.2.c: "Estamos em caminhos diferentes"
 arm_empire.3.t: "Eles Concordaram em se Unificar"
 arm_empire.3.d: "Nosso sonho se realizou e agora os povos armênio e persa estão unidos novamente"
 arm_empire.3.a: "Ótimo"
 arm_empire.4.t: "Eles Rejeitaram Nossa Oferta"
 arm_empire.4.d: "Não conseguimos convencê-los a se juntar a nós."
 arm_empire.4.a: "Ok"
 arm_empire.5.t: "Eles Escolheram uma Aliança Conosco"
 arm_empire.5.d: "Eles decidiram que a melhor opção era tornar-se nosso aliado."
 arm_empire.5.a: "Ótimo"
 arm_empire.6.t: "A Armênia Oferece Comprar [SOO.GetName]"
 arm_empire.6.d: "O governo armênio nos procurou hoje com uma proposta incomum. Eles pretendem comprar de nós o território de [SOO.GetName] por uma soma muito considerável. Estamos chocados com tal oferta; além disso, os diplomatas armênios deixaram claro que nossa recusa levaria a consequências negativas."
 arm_empire.6.a: "É um absurdo!"
 arm_empire.6.b: "Concordamos"
 arm_empire.7.t: "A Armênia Oferece Comprar [SOO.GetName]"
 arm_empire.7.d: "O governo armênio nos procurou hoje com uma proposta incomum. Eles pretendem comprar de nós o território de [SOO.GetName] por uma soma muito considerável. Estamos chocados com tal oferta; além disso, os diplomatas armênios deixaram claro que a recusa deles levaria a consequências negativas."
 arm_empire.7.a: "É um absurdo!"
 arm_empire.7.b: "Concordamos"
 arm_empire.8.t: "A Armênia Oferece nos Comprar"
 arm_empire.8.d: "O governo armênio entrou em contato diplomático conosco hoje com uma proposta muito incomum. Eles pretendem literalmente comprar nosso país para colocá-lo sob seu controle por uma soma muito grande. O valor, é claro, será apresentado de forma mais diplomática na mídia oficial, mas a quantia que oferecem é bastante elevada, além de seu patrocínio, ao contrário da Rússia, que por muitos anos não concordou em nos tornar parte de seu país."
 arm_empire.8.a: "Maravilhoso!"
 arm_empire.8.b: "Concordamos"
 arm_empire.9.t: "[SOO.GetName] Recusou a Oferta"
 arm_empire.9.d: "O governo deles recusou nossa generosa oferta. Bem, parece que teremos de procurar outras formas de influenciá-los."
 arm_empire.9.a: "Triste"
 arm_empire.10.t: "A Armênia Exige a Devolução do Dinheiro"
 arm_empire.10.d: "Agora que o Reino da Armênia foi restaurado, é hora de cumprirmos os termos do antigo tratado, segundo o qual o tesouro armênio guardado na Grã-Bretanha foi transferido para lá por tratado em 1378. No caso de a Armênia recuperar a condição de Estado, o tesouro deve ser devolvido"
 arm_empire.10.a: "Cumprimos nossas promessas"
 arm_empire.10.b: "Esta não é a Armênia com a qual o tratado foi feito."
 arm_empire.11.t: "A Grã-Bretanha Recusa Devolver o Dinheiro"
 arm_empire.11.d: "Não é de admirar que não se possa confiar nada aos britânicos, nem mesmo o nosso dinheiro"
 arm_empire.11.a: "Vamos fazê-los devolver o dinheiro, mas não agora"
 arm_empire.12.t: "A Grã-Bretanha Honra os Termos do Tratado"
 arm_empire.12.d: "O governo britânico concordou em nos devolver o nosso dinheiro"
 arm_empire.12.a: "Talvez possamos mesmo contar com os britânicos em tempos de necessidade"
 arm_empire.14.t: "Unificação Sob Uma Só Coroa"
 arm_empire.14.d: "Agora, depois que a Casa de Saboia chegou ao poder na Armênia, temos a oportunidade de nos reunir sob uma única coroa"
 arm_empire.14.a: "Concordamos em nos unir à Armênia"
 arm_empire.14.b: "Vamos conversar sobre integração"
 arm_empire.14.c: "Não"
 arm_empire.15.t: "A Itália Concorda em se Tornar Nosso Território"
 arm_empire.15.d: "A coroa italiana concordou em se unir a nós sob a supremacia de nossa Casa"
 arm_empire.15.a: "Perfeito"
 arm_empire.16.t: "A Itália Rejeitou Nossa Oferta"
 arm_empire.16.d: "A Itália recusou nossa oferta, demonstrando assim um grau extremo de desrespeito por nós"
 arm_empire.16.a: "Problema deles"
 arm_empire.17.t: "A Itália Oferece Unir-se Sob Sua Bandeira"
 arm_empire.17.d: "A Itália está nos oferecendo tornar-nos parte dela, o que nos traria grandes benefícios financeiros e políticos. Também poderemos preservar nossa soberania"
 arm_empire.17.a: "Que tal vocês?"
 arm_empire.17.b: "Concordamos"
 arm_empire.18.t: "A Armênia Rejeita Nossa Proposta e Nos Oferece Tornar-nos Parte Dela"
 arm_empire.18.d: "A Armênia nos convida a fazer parte dela. Poderemos manter parte de nossa soberania"
 arm_empire.18.a: "Não"
 arm_empire.18.b: "Vamos nos Unir"
 arm_empire.19.t: "A Insurreição na Chechênia"
 arm_empire.19.d: "A guerra recomeçou na Chechênia. Segundo nossa inteligência, os rebeldes chechenos foram patrocinados pelos serviços especiais armênios para provocar uma insurreição. Parece que o governo armênio tem interesse na instabilidade em nosso país"
 arm_empire.19.a: "A Terceira Guerra da Chechênia começou"
 arm_empire.20.t: "A Insurreição na Chechênia"
 arm_empire.20.d: "A guerra recomeçou na Chechênia. Segundo nossa inteligência, os rebeldes chechenos foram patrocinados pelos serviços especiais armênios para provocar uma insurreição. Parece que o governo armênio tem interesse na instabilidade em nosso país"
 arm_empire.20.a: "A Terceira Guerra da Chechênia começou"
 arm_empire.21.t: "Unificação Sob Uma Só Bandeira"
 arm_empire.21.d: "Agora, depois que a Casa de Saboia chegou ao poder na Armênia, temos a oportunidade de nos reunir sob uma única bandeira"
 arm_empire.21.a: "Concordamos em nos unir à Armênia"
 arm_empire.21.b: "Vamos conversar sobre integração"
 arm_empire.21.c: "Não"
 arm_empire.22.t: "A Chechênia Concorda em se Tornar Nosso Território"
 arm_empire.22.d: "O governo checheno concordou em se unir a nós sob nossa bandeira"
 arm_empire.22.a: "Perfeito"
 arm_empire.23.t: "A Chechênia Rejeitou Nossa Oferta"
 arm_empire.23.d: "A Chechênia recusou nossa oferta, demonstrando assim um grau extremo de desrespeito por nós"
 arm_empire.23.a: "Problema deles"
 arm_empire.24.t: "A Chechênia Oferece Unir-se Sob Sua Bandeira"
 arm_empire.24.d: "A Chechênia está nos oferecendo tornar-nos parte dela, o que nos traria grandes benefícios financeiros e políticos. Também poderemos preservar nossa soberania"
 arm_empire.24.a: "Que tal vocês?"
 arm_empire.24.b: "Concordamos"
 arm_empire.25.t: "A Armênia Rejeita Nossa Proposta e Nos Oferece Tornar-nos Parte Dela"
 arm_empire.25.d: "A Armênia nos convida a fazer parte dela. Poderemos manter parte de nossa soberania"
 arm_empire.25.a: "Não"
 arm_empire.25.b: "Vamos nos Unir"
 arm_empire.26.t: "A Guerra Civil Polonesa"
 arm_empire.26.d: "Devido aos acontecimentos recentes e, de fato, à transferência do poder para um governo fantoche pró-armênio, nem todas as forças políticas concordaram com essa posição da Polônia. Muitos generais do exército polonês, com o apoio de partidos políticos ocidentais, organizaram uma rebelião contra nós!"
 arm_empire.26.a: "Deus Nos Salve"
 arm_empire.26.b: "Um desdobramento preocupante."
 arm_empire.27.t: "A Guerra Civil Italiana"
 arm_empire.27.d: "Na Itália, após os acontecimentos ocorridos, uma crise política começou imediatamente. Muitos no país ficaram descontentes com o regime abertamente fantoche que tomou o controle do país. Como resultado, tudo culminou em um levante armado liderado por forças políticas pró-ocidentais."
 arm_empire.27.a: "Deus Nos Salve"
 arm_empire.27.b: "Um desdobramento preocupante."
 arm_empire.29.t: "Foreign Funding for Unity"
 arm_empire.29.d: "Our security services have traced Armenian funds to Konstantin Petrov's Conceptual Party Unity. Its organizers are recruiting supporters within the armed forces and regional administrations. We can investigate the network and expose its organizers."
 arm_empire.29.a: "Prepare our countermeasures."
 arm_empire.30.t: "Unity Moves Against the Government"
 arm_empire.30.d: "Petrov's organizers have begun their attempt to seize power, backed by Armenia. Loyal officials are asking for orders as the conspirators try to win over military units."
 arm_empire.30.a: "Fund emergency arrests and secure communications."
 arm_empire.30.b: "Rely on our existing security preparations."
 arm_empire.32.t: "O Partido Conceitual 'Unidade' Tomou o Poder na Rússia"
 arm_empire.32.d: "O Partido Conceitual 'Unidade', liderado por Konstantin Petrov, tomou o poder na Rússia sem muita resistência, e a desunião política parece ter enfraquecido as defesas internas do país."
 arm_empire.32.a: "Estamos perdendo o país."
 arm_empire.32.b: "Vitória!"
 arm_empire.33.t: "Rebelião do Partido Conceitual 'Unidade'"
 arm_empire.33.d: "O Partido Conceitual 'Unidade', liderado por Konstantin Petrov, tentou tomar o poder em Moscou por meio de um golpe, mas os serviços especiais conseguiram impedi-lo. Infelizmente, o partido tinha muitos apoiadores nas regiões, e isso provocou levantes por todo o país."
 arm_empire.33.a: "Estamos perdendo o país."
 arm_empire.33.b: "Vitória Parcial"
 arm_empire.34.t: "Rebelião do Partido Conceitual 'Unidade' Fracassou"
 arm_empire.34.d: "O Partido Conceitual 'Unidade', liderado por Konstantin Petrov, tentou tomar o poder em Moscou por meio de um golpe, mas os serviços especiais conseguiram impedi-lo. Além disso, todos os apoiadores de seu partido nas regiões foram presos, e tudo transcorreu pacificamente."
 arm_empire.34.a: "A Rússia Foi Salva Novamente."
 arm_empire.34.b: "Perdemos."
 arm_empire_news.1.t: "A Guerra Civil Polonesa"
 arm_empire_news.1.d: "Um governo pró-armênio chegou ao poder na Polônia, cultivado diligentemente pela Armênia durante muitos anos. Mas nem todas as forças políticas do país ficaram satisfeitas com essa situação. Muitos generais, assim como partidos políticos pró-ocidentais, organizaram uma rebelião para derrubar o governo fantoche."
 arm_empire_news.1.a: "Pobre Polônia"
 arm_empire_news.2.t: "A Guerra Civil Italiana"
 arm_empire_news.2.d: "Há uma crise na Itália. O governo pró-armênio assumiu o controle do país e, como resultado, algumas forças políticas entraram em conflito armado aberto com a autoridade política central do país."
 arm_empire_news.2.a: "Pobre Itália"
 arm_empire_news.3.t: "Tumultos nas Regiões da Rússia"
 arm_empire_news.3.d: "O Partido Conceitual 'Unidade', liderado por Konstantin Petrov, tendo fracassado em tomar o poder no Kremlin, aproveitou-se da fraqueza dos serviços especiais regionais e organizou tumultos em algumas regiões da Rússia onde o partido tinha alto apoio."
 arm_empire_news.3.a: "Loucura"
 arm_empire_news.4.t: "Estados Unidos da Armênia"
 arm_empire_news.4.d: "Um evento histórico ocorreu hoje na Armênia. O governo armênio anunciou a criação de um Estado completamente novo, baseado em princípios e leis radicalmente diferentes de seu antecessor: os Estados Unidos da Armênia. Agora a Armênia é como os Estados Unidos, mas já no Cáucaso, um acontecimento realmente surpreendente."
 arm_empire_news.4.a: "OK... certo?"
 ARM_new_nobility_idea: "Nova Nobreza"
 ARM_new_nobility_idea_desc: "A nova aristocracia de nosso Estado não é composta apenas pelas antigas casas restauradas em seus títulos, mas também por uma nova e jovem aristocracia militar.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os monarquistas nacionalistas não estiverem mais no poder."
 ARM_armenian_paganism_idea: "Hetanismo"
 ARM_armenian_paganism_idea_desc: "A Fé Nativa Armênia, também chamada de Hetanismo, é um novo movimento religioso pagão moderno que remonta aos sistemas de crenças históricos pré-cristãos e às religiões étnicas dos armênios."
 ARM_glory_of_tigran_idea: "Glória de Tigranes"
 ARM_crusade_legacy_idea: "Espírito Cruzado"
 ARM_urheimat_restored_idea: "Urheimat Restaurada"
 ARM_tseghakronism_one_idea: "Tseghakronismo"
 ARM_renewed_knighthood_idea: "Cavalaria Renovada"
 ARM_tseghakronism_two_idea: "Tseghakronismo"
 ARM_state_christianity_idea: "Todo Cidadão é Cristão"
 ARM_restore_armenian_empire_tt: "Agora poderemos §GIntegrar os Antigos Territórios Armênios§!"
 ARM_house_elections_warning_tt: "§RDevemos ter Cuidado ao Escolher o Chefe da Casa§!"
 ARM_bagratuni_house_chosen_tt: "A §RCasa de Bagratuni§! se tornará a casa governante do Estado"
 ARM_savoya_house_chosen_tt: "A §YCasa de Saboia§! Se Tornará a Casa Governante da Armênia!"
 ARM_kob_go_tt: "The coup can succeed, fail, or provoke a regional uprising. If it fails with Unity at §Y35%§! support or higher and Russia owns and controls more than one state, a second roll with the same chance determines whether an uprising begins. If support is below §Y20%§! or the campaign requirements are not met when Russia receives its final response, the coup fails without an uprising."
 ARM_legacy_of_fedayi: "Legado dos Fedayi"
 ARM_legacy_of_fedayi_desc: "Devemos reverenciar os fedayis armênios que lutaram contra a tirania turca no século passado. Devemos nos preparar para a guerra, caso contrário os turcos nos atacarão e nos massacrarão novamente!"
 ARM_end_to_democr: "Fim da Democracia"
 ARM_end_to_democr_desc: "Já é mais do que hora de parar de construir ilusões e destruir qualquer bastião de falsa democracia estabelecido na Armênia."
 ARM_bring_sefily: "Trazer Sefilyan de Volta"
 ARM_bring_sefily_desc: "Sefilyan era um dashnak devoto até que a ala emergente de nosso partido começou a apaziguar demais a Rússia. Devemos nos unir novamente ao NDP!"
 ARM_venerate_nemesis: "Venerar a Operação Nêmesis"
 ARM_venerate_nemesis_desc: "A Operação Nêmesis foi um programa da Federação Revolucionária Armênia para assassinar tanto os perpetradores otomanos do genocídio armênio quanto os oficiais da República Democrática do Azerbaijão mais responsáveis pelo massacre de armênios durante os Dias de Setembro de 1918 em Baku."
 ARM_nzhdehs_thought: "Integrar o Pensamento de Nzhdeh"
 ARM_nzhdehs_thought_desc: "Garegin Nzhdeh rompeu com os dashnaks em algum momento, divergindo de nossa agenda social-nacionalista. No entanto, devemos tentar integrar seu pensamento à nossa filosofia e usar sua imagem para promover o partido."
 ARM_soc_nationalism: "Social-Nacionalismo"
 ARM_soc_nationalism_desc: "Em sua essência, a Dashnaktsutyun é ao mesmo tempo um partido socialista e nacionalista armênio. Não importa o que tenha acontecido no século XX, devemos reforçar mais nossa ideologia e construir uma nova Armênia!"
 ARM_just_like_eagle: "Como a Águia de Taron"
 ARM_just_like_eagle_desc: "Ao usar ainda mais a retórica nzhdehista, podemos trazer mais nacionalistas armênios para nossas fileiras e construir uma sociedade verdadeiramente nacional."
 ARM_harmonize_economy: "Harmonizar a Economia"
 ARM_harmonize_economy_desc: "Devemos usar sindicatos e a nacionalização da indústria para harmonizar a economia, tirando o capital das mãos dos capitalistas."
 ARM_scout_movem_ref: "Reformar o Movimento Escoteiro"
 ARM_scout_movem_ref_desc: "O movimento escoteiro armênio é patrocinado e apoiado pelos dashnaks há muito tempo. Agora devemos militarizá-lo e treinar os jovens futuros combatentes."
 ARM_militarized_society: "Sociedade Militarizada"
 ARM_militarized_society_desc: "Nossa sociedade deve ser um grande exército, um exército de pessoas com o espírito dedicado a esmagar nossos inimigos."
 ARM_incr_contr_diaspora: "Aumentar o Controle na Diáspora"
 ARM_incr_contr_diaspora_desc: "Ao longo de sua história de confronto com a Turquia e na questão da sobrevivência do povo, os armênios contaram com a cooperação conjunta entre comunidades grandes e pequenas. Grupos guerrilheiros voluntários, assim como a influência da diáspora com foco em interesses de lobby, são as chaves para a prosperidade da Armênia."
 ARM_first_republic_decl: "Herdeiros da Primeira República"
 ARM_first_republic_decl_desc: "Somos os legítimos herdeiros da República Armênia e é nosso dever sagrado recuperar todas as terras de nosso país!"
 ARM_lebanon_coup: "Apoiar os Dashnaks Libaneses"
 ARM_lebanon_coup_desc: "A comunidade armênia é bastante ativa politicamente no Líbano. Podemos apoiar o braço de nosso partido no Líbano para dar um golpe."
 ARM_prevail_of_east_looking_ideas: "Predomínio das Ideias Voltadas ao Oriente"
 ARM_prevail_of_east_looking_ideas_desc: "Não devemos olhar apenas para nós mesmos em nossa agenda política. Devemos cooperar com todos para combater a influência ocidental!"
 ARM_review_all_with_koch: "Renovar Nossa Aliança com Kocharyan"
 ARM_review_all_with_koch_desc: "Kocharyan há muito mantém nosso partido refém de suas ambições políticas. Agora, quando estamos no poder, podemos decidir para que ele nos serve. Kocharyan tem séria influência na política armênia. Podemos usá-lo como uma das ferramentas para ganhar influência na Armênia."
 ARM_ishkhan_saghat: "Posição de Ishkhan Saghatelyan"
 ARM_ishkhan_saghat_desc: "A posição de Ishkhan Saghatelyan é muito mais moderada em relação às políticas socialistas, embora ele seja muito conhecido por suas declarações pró-Rússia."
 ARM_leftwing_origins: "Abraçar as Origens de Esquerda"
 ARM_leftwing_origins_desc: "Devemos lembrar as raízes de nosso partido e voltar às ideias do marxismo com características armênias."
 ARM_marxist_thought_integr: "Integrar o Pensamento Marxista"
 ARM_marxist_thought_integr_desc: "Devemos integrar novamente o pensamento marxista à nossa agenda social-nacionalista e construir um Estado verdadeiramente revolucionário!"
 ARM_spirit_of_revol: "Espírito de Revolução"
 ARM_spirit_of_revol_desc: "Devemos fazer de nosso país uma vanguarda da revolução. Revolução contra o imperialismo turco!"
 ARM_revol_selhoz: "Revolução Agrícola"
 ARM_revol_selhoz_desc: "Nosso país precisa ser capaz de se alimentar; muita terra permanece sem uso para necessidades agrícolas, é hora de consertar isso!"
 ARM_seize_oligs_stuff: "Confiscar os Bens dos Oligarcas"
 ARM_seize_oligs_stuff_desc: "Os oligarcas devem ser subjugados por nosso Estado e seus bens devem ser nacionalizados!"
 ARM_letter_to_russia: "Carta à Rússia"
 ARM_letter_to_russia_desc: "Devemos mostrar à Rússia que agora ela não está sozinha em sua resistência ao Ocidente liberal!"
 ARM_soc_welfare: "Estado de Bem-Estar Social"
 ARM_soc_welfare_desc: "A nova agenda política armênia deve ser um Estado de bem-estar social pleno, onde todo cidadão seja amparado."
 ARM_hold_oligs_gunpoint: "Manter os Oligarcas sob a Mira"
 ARM_hold_oligs_gunpoint_desc: "Talvez não devamos ser tão radicais com os oligarcas e nacionalizar todos os seus bens, mas devemos garantir que seus impostos sejam altos e que eles prestem contas de forma suficiente."
 ARM_pkk_negotiat: "Ajudar o PKK"
 ARM_pkk_negotiat_desc: "A luta de nossos irmãos curdos deve ser apoiada e venerada! Devemos dedicar todos os nossos esforços a apoiar a causa deles."
 ARM_union_states: "Proposta do Estado da União"
 ARM_union_states_desc: "Finalmente, podemos tentar aderir ao projeto do Estado de União para nossa prosperidade futura."
 ARM_armenia_dashnak_idea: "Armênia Dashnak"
 ARM_dashnak_mitia_idea: "Novas Milícias Dashnak"
 ARM_legacy_of_nzhden: "Legado de Nzhdeh"
