 FRA_knds_european_champion: "欧洲工业冠军"
 FRA_knds_fg_partnership: "法德伙伴关系"
 FRA_knds_fg_partnership_desc: "2015年成立的KANT统一了克劳斯-玛菲·威格曼和奈克斯特系统，由法德双方各持50%股份，将两国各自龙头企业整合在单一工业基础之上。"
 FRA_knds_kant_holding: "KANT控股集团整合"
 FRA_knds_kant_holding_desc: "跨境工程团队、统一采购和共享行政服务降低了同时运营两个传统防务机构的额外成本。"
 FRA_knds_embt: "EMBT演示样车"
 FRA_knds_embt_desc: "增强型主战坦克将勒克莱尔炮塔与豹2底盘相结合，预示着未来主战地面作战系统的混合设计理念。"
 FRA_knds_joint_rnd: "联合研究预算"
 FRA_knds_joint_rnd_desc: "法德联合研究预算加速了装甲、电子与含能材料领域并行走廓的推进，这是任何一家企业单凭自身都无法实现的。"
 FRA_knds_mgcs_modular: "MGCS模块化架构"
 FRA_knds_mgcs_modular_desc: "主战地面战斗系统被构想为一个多平台家族，配备可互换的防护、火力和电子战模块，计划在2040年代前取代豹2和勒克莱尔坦克。"
 FRA_knds_mgcs_integration: "MGCS系统整合"
 FRA_knds_mgcs_integration_desc: "MGCS整合了法德装甲编队间共享的数字骨干网、源自SCORPION的战场管理系统以及通用传感器融合技术。"
 FRA_knds_turret_leadership: "炮塔为主（奈克斯特）"
 FRA_knds_turret_leadership_desc: "炮塔设计、自动装填系统工程与火炮制造整合至原奈克斯特团队，延续勒克莱尔时代的火力专长。"
 FRA_knds_hull_leadership: "车体为主（奈克斯特）"
 FRA_knds_hull_leadership_desc: "车体、动力包和行走装置的研发整合至原KMW团队，借鉴豹2和美洲狮的结构经验。"
 FRA_knds_nato_standardisation: "北约火炮标准化"
 FRA_knds_nato_standardisation_desc: "KNDS向北约支持与采购局供应符合STANAG标准的155毫米弹药，一举使新整合企业定位为欧洲默认炮兵供应商。"
 FRA_knds_rch155: "RCH-155 远程自行榴弹炮"
 FRA_knds_rch155_desc: "RCH-155将自动化155毫米炮塔安装在拳击手底盘上，仅需两名乘员即可在行进间射击，最大射程达54公里。"
 FRA_knds_leopard_sustainment: "豹2车队维护"
 FRA_knds_leopard_sustainment_desc: "统一后勤、备件生产以及豹2车队的翻新工作均归属于合并后的实体，这使得KNDS在欧洲获得了长达数十年的维护收入流。"
 FRA_knds_boxer_puma: "“拳击手”与“山猫”装备管理"
 FRA_knds_boxer_puma_desc: "拳击手模块化装甲输送车和美洲狮步兵战车仍是KMW主导的项目，现由KNDS的联合工业力量提供支持。"
 FRA_knds_bonus_katana: "BONUS & KATANA弹药"
 FRA_knds_bonus_katana_desc: "传感器引爆式 BONUS 与制导型 KATANA 弹药扩展了 KNDS 的精确制导火炮产品系列，目前作为一个单一的泛欧洲产品线进行市场推广。"
 FRA_knds_export_leadership: "出口为主"
 FRA_knds_export_leadership_desc: "积极的出口姿态吸引了波斯湾、东南亚和东欧的买家，他们提供装甲、火炮和弹药捆绑包。"
 FRA_knds_strategic_autonomy: "战略自主"
 FRA_knds_strategic_autonomy_desc: "国内优先原则将最佳生产槽位与敏感技术保留给法德部队，通过强化欧洲战略自主性来替代开放市场销售。"
