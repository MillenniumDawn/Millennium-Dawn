 NKO_specialise_commanders_tt: "§GLes commandants blindés, défensifs, offensifs et interarmes gagnent chacun un trait approfondissant leur spécialité.§!"
 NKO_specialise_guerrilla_tt: "§GLes commandants formés à la guérilla apprennent à tendre des embuscades.§!"
 NKO_specialise_commando_tt: "§GLes commandants formés au commando sont promus pour diriger les forces spéciales.§!"
 NKO_sso_new_general_tt: "§GLes forces d'opérations spéciales nomment §!§YKim Yong Bok§!§G, spécialiste des forces spéciales, comme nouveau commandant de corps.§!"
 NKO_arms_export: "Bureau des affaires étrangères"
 NKO_arms_export_desc: "Le bureau derrière KOMID et le commerce d'armes à l'étranger. Fournir armes, missiles, troupes et satellites aux nations en guerre contre devises, technologie et une base industrielle en croissance permanente."
 NKO_arms_export_modifiers: "Bureau des affaires étrangères"
 NKO_arms_export_modifiers_desc: "Le bureau d'exportation d'armes de Pyongyang. Chaque nation que nous approvisionnons relève durablement notre §Yproduction d'usines§! et notre §Yefficacité de production§!, un bonus qui croît à mesure que l'arsenal multipolaire s'étend."
 NKO_arms_export_title: "§YBureau des affaires étrangères§!"
 NKO_arms_export_clients_readout: "Nations fournies : §Y[?NKO_arms_export_clients|0]§!  Offres conclues : §Y[?NKO_arms_export_deals|0]§!"
 NKO_arms_export_output_readout: "Sortie d'usine permanente : §G+[?NKO_arms_export_clients|0]%§!"
 NKO_arms_export_revenue_readout: "Devises fortes gagnées : §G$[?NKO_arms_export_revenue|0]§! milliards"
 NKO_arms_export_sanctions_readout: "Pression des sanctions : [NKO_arms_export_sanctions_status]"
 NKO_arms_export_hint: "Ouvrez la section §YConventionnel§! pour armer toute nation §Wnon occidentale§! §Ren train de perdre sa guerre§! (30 %+ de reddition). Chaque client accorde §G+1 % de production d'usines permanent§!, des devises et de la technologie, mais relève les §Rsanctions§!. Faites pression sur vos patrons pour les assouplir."
 NKO_arms_export_capstone_status_progress: "§OArsenal du monde multipolaire : approvisionnez 10 nations pour débloquer le couronnement.§!"
 NKO_arms_export_capstone_status_ready: "§GL'Arsenal du monde multipolaire est à portée. Convoquez le Bureau.§!"
 NKO_arms_export_capstone_status_done: "§GArsenal du monde multipolaire atteint.§!"
 NKO_arms_export_sanctions_max: "§RMaximum (CSNU)§!"
 NKO_arms_export_sanctions_severe: "§RSévère§!"
 NKO_arms_export_sanctions_heavy: "§OLourd§!"
 NKO_arms_export_sanctions_moderate: "§OModéré§!"
 NKO_arms_export_sanctions_light: "§YLéger§!"
 NKO_arms_export_sanctions_none: "§GAucun§!"
 NKO_arms_export_conv_open: "§YOuvrir§! les exportations d'armes conventionnelles"
 NKO_arms_export_conv_open_desc: "Afficher les décisions d'approvisionnement conventionnel : obus d'artillerie et volontaires du Storm Corps pour chaque nation en guerre."
 NKO_arms_export_conv_close: "§YFermer§! les exportations d'armes conventionnelles"
 NKO_arms_export_conv_close_desc: "Masquer les décisions d'approvisionnement conventionnel pour alléger le panneau."
 NKO_export_munitions: "Expédier un paquet d'armes conventionnelles à [FROM.GetNameWithFlag]"
 NKO_export_munitions_desc: "Expédier par rail un colis d'armes des dépôts de l'Armée populaire vers le front. [FROM.GetName] choisit le type de division dont elle a le plus besoin (§Yinfanterie légère§!, §Ymotorisée§!, §Yblindée§! ou §Ymécanisée§!) et nous expédions assez de matériel moderne, 1995 ou plus récent, pour §Ytrois bataillons§!, prélevé directement sur nos stocks. Les colis blindés et mécanisés exigent une conception de char moderne. Nous ne fournissons pas d'aéronefs. Ils se battent plus dur, et nous sommes payés en devises."
 NKO_deploy_storm_corps: "Déployer le Storm Corps vers [FROM.GetNameWithFlag]"
 NKO_deploy_storm_corps_desc: "Proposer une intervention nord-coréenne à [FROM.GetName]. S'ils acceptent, nous débloquons l'envoi de §Ydivisions de volontaires§! sur leur front, liant davantage notre patron et gagnant sa gratitude. Un déploiement vers la §YRussie§! ou la §YChine§! ouvre une subvention permanente en devises qui continue même après le retour du corps. Exige la politique étrangère §YInterventionnisme mondial§!."
 NKO_arms_export_lobby_relief: "Faire pression pour un allègement des sanctions"
 NKO_arms_export_lobby_relief_desc: "Dépenser le poids diplomatique de nos partenaires bien armés, et une somme discrète, pour obtenir un assouplissement d'un cran des sanctions internationales à l'ONU."
 NKO_arms_export_capstone: "Arsenal du monde multipolaire"
 NKO_arms_export_capstone_desc: "Ayant armé une coalition de nations contre l'ordre impérialiste, formaliser le rôle de Pyongyang comme atelier du monde multipolaire."
 NKO_arms_export_relief_deals_tt: "A conclu au moins §Y5§! marchés d'exportation"
 NKO_arms_export_relief_sanctions_tt: "Est actuellement sous sanctions internationales"
 NKO_arms_export_unlock_tt: "§GDébloque le Bureau des affaires étrangères, le programme d'exportation d'armes et de main-d'œuvre.§!"
 NKO_export_munitions_effect_tt: "S'ils acceptent, le client demande un colis de division et nous livrons assez de matériel §Y1995 ou plus récent§! pour §Ytrois bataillons§!, §Yprélevé sur nos propres stocks§!. Les colis blindés et mécanisés exigent une §Yconception de char moderne§! (au moins la moitié des modules post-guerre froide). §RAucun aéronef n'est fourni.§! Nous sommes payés en §Ydevises§!, et un nouveau client accorde un bonus permanent de production d'usines selon le colis : §G+1 %§! infanterie légère, §G+2 %§! motorisée, §G+3 %§! blindée ou mécanisée. La pression des sanctions monte.\n\nLe client gagne §YMunitions nord-coréennes§! pendant §Y365§! jours :\n §G+5 %§! Attaque de division\n §G+5 %§! Taux de récupération de division\n §G-5 %§! Consommation de ravitaillement"
 NKO_export_troops_effect_tt: "Nous proposons de déployer des forces d'intervention. Si l'hôte accepte, nous débloquons l'envoi de §Ydivisions de volontaires§! dans sa guerre, et nous gagnons faveur politique et devises. Aucune main-d'œuvre n'est perdue chez nous."
 NKO_storm_corps_permanent_income_tt: "En tant que patron grande puissance, ils accordent une subvention hebdomadaire §Ypermanente§! en devises qui continue même après le retour du Storm Corps."
 NKO_arms_client_munitions: "Munitions nord-coréennes"
 NKO_arms_client_munitions_desc: "Des caisses d'obus et de fusils nord-coréens maintiennent les canons en feu."
 NKO_arms_client_troops: "Volontaires de l'Armée populaire coréenne"
 NKO_arms_client_troops_desc: "Les vétérans du Storm Corps raidissent le front et tiennent la ligne."
 NKO_storm_corps_abroad: "Storm Corps déployé à l’étranger"
 NKO_storm_corps_abroad_desc: "Nos meilleures troupes combattent une guerre étrangère. Leur absence se fait sentir chez nous en effectifs et en moral."
 NKO_arms_export_capstone_spirit: "Arsenal du monde multipolaire"
 NKO_arms_export_capstone_spirit_desc: "Pyongyang est devenu un fournisseur indispensable aux nations qui résistent à l'Occident. Nos usines tournent à plein régime, isolées de la pression des sanctions."
 NKO_export.1.t: "Moscou a besoin d'obus"
 NKO_export.1.d: "L'offensive russe dévore les munitions plus vite que ses usines ne peuvent fournir. Par des canaux discrets, le Kremlin demande à Pyongyang obus d'artillerie, roquettes et tout ce que l'Armée populaire peut épargner. Le paiement sera généreux : liquidités, grain et la technologie militaire que nous convoitions depuis longtemps."
 NKO_export.1.a: "Honorer la commande"
 NKO_export.1.b: "Pas pour le moment"
 NKO_export.10.t: "[FROM.GetNameWithFlag] propose un paquet d'armes"
 NKO_export.10.d: "Pyongyang propose d'acheminer par rail un colis d'armes modernes vers nos forces en difficulté, payé en devises. Nous pouvons demander l'équipement du type de division dont nous avons le plus besoin : assez de matériel pour §Ytrois bataillons§!, prélevé directement sur les stocks nord-coréens."
 NKO_export.10.a: "Demander un paquet d'§Yinfanterie légère§! : fusils et équipement de commandement"
 NKO_export.10.b: "Refuser l'offre"
 NKO_export.11.t: "[FROM.GetNameWithFlag] accepte nos armes"
 NKO_export.11.d: "[FROM.GetName] a accepté notre offre. L'envoi quitte nos dépôts pour le front, et les devises sont déjà sur nos comptes."
 NKO_export.11.a: "Charger les trains"
 NKO_export.12.t: "[FROM.GetNameWithFlag] refuse nos armes"
 NKO_export.12.d: "[FROM.GetName] a refusé nos armes. Les caisses restent dans nos entrepôts."
 NKO_export.12.a: "Ainsi soit-il."
 NKO_export.99.t: "L'arsenal du monde multipolaire"
 NKO_export.99.d: "De Moscou à Téhéran, les canons d'une douzaine d'armées sont alimentés par les usines nord-coréennes. Ce qui commença comme un commerce désespéré de devises a rendu la République populaire démocratique indispensable à chaque puissance qui défie Washington. L'atelier de la révolution a trouvé ses clients."
 NKO_export.99.a: "Que le monde dépende de nous"
 NKO_export.22.t: "Pyongyang propose des forces d'intervention"
 NKO_export.22.d: "[FROM.GetName] propose de déployer des divisions de volontaires coréens sur notre front. Leurs soldats combattraient à nos côtés contre nos ennemis, une offre d'intervention de Pyongyang que nous pouvons difficilement refuser."
 NKO_export.22.a: "Accepter leurs soldats"
 NKO_export.22.b: "Refuser l'offre"
 NKO_export.20.t: "[FROM.GetNameWithFlag] a besoin d'hommes"
 NKO_export.20.d: "[FROM.GetName], où notre Storm Corps combat déjà, a épuisé ses réserves d'effectifs. Leur commandement en appelle à Pyongyang pour envoyer des hommes frais tenir la ligne."
 NKO_export.20.a: "Envoyer des renforts"
 NKO_export.20.b: "Nous ne pouvons pas épargner les hommes"
 NKO_export_send_manpower_tt: "§GEnvoie des effectifs égaux à §Y10 %§! du vivier recrutable de [FROM.GetName], prélevés sur nos réserves.§!"
 NKO_export.40.t: "L'Occident répond par des sanctions"
 NKO_export.40.d: "Notre matériel continue d'apparaître sur des fronts que les impérialistes voulaient nous fermer. [USA.GetName], rejoint par [FRA.GetName], [GER.GetName] et [JAP.GetName], a déployé un nouveau train de sanctions : comptes gelés, maisons de commerce listées, et avertissements à quiconque continue d'acheter à Pyongyang. Nous avons déjà enduré leur pression."
 NKO_export.40.a: "Que les impérialistes ragent"
 NKO_export.40.b: "Absorber le coup en silence"
 NKO_arms_contract_title: "§YEngagements bénévoles du patron§!"
 NKO_expeditions_readout: "Expéditions engagées : §G[?NKO_expeditions_completed|0]§!"
 NKO_commit_volunteers: "Engager une expédition de volontaires vers [FROM.GetName]"
 NKO_commit_volunteers_desc: "Formaliser le déploiement de nos divisions de volontaires combattant en [FROM.GetName]. Pyongyang facture son patron pour les effectifs, encaissant des devises. [FROM.GetName] paie une prime pour nos divisions."
 NKO_commit_volunteers_req_tt: "[FROM.GetName] accueille au moins §Y6§! de nos divisions de volontaires"
 NKO_commit_volunteers_effect_tt: "Encaisse une prime en devises dans notre §Ytrésor§!. Tant que nos §Ydivisions de volontaires§! combattent à l'étranger, le déploiement soutenu entraîne notre armée, accordant une §Ymaîtrise de doctrine terrestre§! chaque semaine."
 NKO_economy_shortcut: "Économie"
 NKO_military_shortcut: "Armée"
 NKO_38th_parallel_shortcut: "38e parallèle"
 NKO_political_shortcut: "Politique"
 NKO_overcome_the_arduous_march: "Surmonter la Marche pénible"
 NKO_overcome_the_arduous_march_desc: "Les années de famine sont derrière nous. L'agriculture a été rétablie, Huichon reconstruite, et les classes de marché émergentes ramenées dans le giron. Nous pouvons enfin déclarer la Marche pénible surmontée et tourner toute la force de l'État vers le relèvement national."
 NKO_renovate_water_supply_facilities: "Rénover les installations d’approvisionnement en eau"
 NKO_renovate_water_supply_facilities_desc: "Rénover et étendre nos installations d'approvisionnement en eau est essentiel pour la santé publique et le développement industriel. Nous assurerons un accès à l'eau propre et fiable pour tous les citoyens et industries."
 NKO_national_power_grid: "Réseau électrique national"
 NKO_national_power_grid_desc: "Relier nos stations renouvelables et centrales hydroélectriques en un réseau national unifié stabilisera l'électricité des usines comme des foyers, mettant fin aux coupures tournantes qui ont longtemps paralysé la production."
 NKO_pojon_field_responsibility: "Système de responsabilité sur le terrain Pojon"
 NKO_pojon_field_responsibility_desc: "Le système Pojon accorde aux petites équipes familiales l'autonomie sur le surplus agricole au-dessus des quotas d'État. En laissant les paysans garder des récoltes d'incitation, la production s'étend et la sécurité alimentaire se renforce."
 NKO_rason_ftz: "Zone économique spéciale de Rasŏn"
 NKO_rason_ftz_desc: "La zone de libre-échange de Rason, au nord-est, développée conjointement avec des investissements chinois et russes, ouvre la porte de la Corée du Nord au commerce transfrontalier légal. Le contrôle du port de Rajin et de l'accès frontalier débloque un commerce économique soutenu."
 NKO_koryolink_network: "Réseau mobile Koryolink"
 NKO_koryolink_network_desc: "Koryolink, lancée en 2008 comme réseau 3G construit avec Orascom Telecom, fournit des télécommunications modernes à des millions d'abonnés. Un réseau mobile modernise le flux d'information et réduit la dépendance aux médias contrôlés par l'État."
 NKO_pyongyang_prestige_streets: "Les rues prestigieuses de Pyongyang"
 NKO_pyongyang_prestige_streets_desc: "Des avenues-vitrines comme la rue des Scientifiques Mirae et la rue Ryomyong, construites à un rythme rapide pour projeter modernité nationale et défi malgré les sanctions. Ces symboles urbains renforcent le moral populaire et le prestige international."
 NKO_ryugyong_hotel: "Achèvement de l’hôtel Ryugyong"
 NKO_ryugyong_hotel_desc: "L'hôtel Ryugyong, pyramide de 105 étages longtemps en sommeil, reçoit son habillage de verre complet entre 2008 et 2011. Ce landmark architectural symbolise l'ambition technologique nationale et le relèvement économique."
 NKO_exporting_workforce: "Exporter la main d’œuvre"
 NKO_chollima_speed: "Vitesse Chollima"
 NKO_field_responsibility_system: "Système de responsabilité sur le terrain"
 NKO_field_responsibility_system_desc: "Le système Pojon de responsabilité des champs donne aux brigades paysannes le droit de garder les surplus au-dessus des quotas d'État, créant des incitations à la production. Une production agricole soutenue améliore la sécurité alimentaire et le moral populaire."
 NKO_mobile_network: "Réseau mobile Koryolink"
 NKO_mobile_network_desc: "Un réseau de télécommunications 3G moderne atteint des millions d'abonnés, modernisant l'infrastructure de communications. Un meilleur accès à l'information et une moindre dépendance aux médias d'État réduisent la tension sociétale."
 NKO_people_army: "L'Armée du peuple"
 NKO_people_army_desc: "L'Armée du peuple devait être prête à la guerre, même pendant la période difficile de la « Marche pénible », afin de se défendre contre l'impérialisme américain et ses marionnettes sud-coréennes."
 NKO_national_defence_force: "Défense nationale"
 NKO_national_defence_force_desc: "Nous augmenterons nos dépenses militaires pour égaler celles de notre homologue du Sud, afin de garder la nation sûre face à toute menace."
 NKO_red_dawn: "Aube rouge"
 NKO_red_dawn_desc: "L'aube de notre esprit révolutionnaire brillera à nouveau tandis que nous renforçons notre puissance militaire. Que ce soit le début de notre marche implacable vers la suprématie."
 NKO_studying_their_airforce: "Étudier les forces aériennes ennemies"
 NKO_studying_their_airforce_desc: "Pour préparer les conflits inévitables, nous devons étudier les forces aériennes de nos ennemis, apprendre leurs forces et faiblesses, et concevoir des contre-stratégies."
 NKO_focus_on_the_f_35: "Se concentrer sur le F-35"
 NKO_focus_on_the_f_35_desc: "Nous analyserons la technologie du F-35, en nous inspirant de sa conception pour améliorer nos propres capacités aériennes et contrer quiconque manie ce chasseur avancé."
 NKO_focus_on_the_f_16: "Se concentrer sur le F-16"
 NKO_focus_on_the_f_16_desc: "Le F-16 a fait ses preuves comme chasseur capable. Nous disséquerons ses tactiques et sa technologie, renforçant notre propre flotte de chasseurs au passage."
 NKO_focus_on_the_future_kai_kf_21: "Se concentrer sur le KF-21"
 NKO_focus_on_the_future_kai_kf_21_desc: "Le KF-21 est le chasseur de nouvelle génération de la Corée du Sud. En analysant son potentiel, nous préparons notre force aérienne à contrer toute menace qu'il pourrait poser."
 NKO_begin_uranium_enrichment: "Commencer l’enrichissement de l’uranium"
 NKO_begin_uranium_enrichment_desc: "Que ce soit pour la libération du peuple sud-coréen ou pour la défense de notre grande patrie contre la menace nucléaire des impérialistes américains, nous devons continuer résolument et courageusement à développer des armes nucléaires !"
 NKO_remove_monitoring_devices: "Supprimer les appareils de surveillance"
 NKO_remove_monitoring_devices_desc: "Notre enrichissement d'uranium sera forcément résisté par la communauté internationale. Le mieux que nous puissions faire, alors, pour cacher l'enrichissement d'uranium, c'est ----- de rendre la communauté internationale aveugle."
 NKO_expel_inspectors: "Expulser les inspecteurs"
 NKO_expel_inspectors_desc: "L'Agence internationale de l'énergie atomique a envoyé de nombreux inspecteurs dans notre pays pour s'assurer que nous n'utilisons la technologie nucléaire que pour l'énergie. Puisque nous sommes sur le point de nous en détacher, autant déporter ces espions impérialistes au passage."
 NKO_withdraw_from_npt: "Se retirer du TNP"
 NKO_withdraw_from_npt_desc: "Une étape importante pour notre programme nucléaire, liée à notre indépendance et à notre sécurité, est de se retirer du TNP. Nous ne pouvons limiter notre capacité à défendre l'indépendance et la sécurité de notre pays à cause des traités inégaux d'impérialistes ridicules !"
 NKO_missile_tests: "Essais de missiles"
 NKO_missile_tests_desc: "Les essais de missiles de la Corée du Nord démontrent ses capacités balistiques croissantes, d'une gamme de systèmes allant des missiles à courte portée aux missiles balistiques intercontinentaux (ICBM). Ces essais sont pivots pour avancer sa technologie militaire, affirmer une influence régionale et signaler des intentions stratégiques, souvent en aggravant les tensions et en suscitant des réponses internationales."
 NKO_nuclear_tests: "Essais nucléaires"
 NKO_nuclear_tests_desc: "Tous les deux ans, la RPDC procède à des essais d'armes nucléaires. Ces essais ont été largement condamnés par les puissances extérieures, y compris la Chine, malgré ses relations étroites avec la Corée du Nord. Bien que la Corée du Nord maintienne que son programme d'armes nucléaires est de nature défensive, beaucoup craignent que [NKO.GetLeader] puisse utiliser ces armes contre les États-Unis ou ses alliés."
 NKO_our_pride_and_joy: "Notre fierté et notre joie"
 NKO_our_pride_and_joy_desc: "Réjouissez-vous ! Face au blocus sévère des impérialistes américains et de leurs pays subordonnés, sous la direction du cher camarade [NKO.GetLeader], nous, République populaire démocratique de Corée, avons enfin notre propre contre-force nucléaire ! Les jours où les agresseurs impérialistes américains tentaient de nous faire chanter avec un bâton nucléaire sont révolus !"
 NKO_nuclear_approval_not_sco: "Nous ne devons pas être membre de l'OCS"
 NKO_people_air_force: "Force aérienne populaire"
 NKO_people_air_force_desc: "Les cieux de Choson doivent rester à l'abri de toute intrusion des impérialistes américains ou de leurs alliés du sud. Ce sera une tâche difficile si nous n'améliorons pas nos capacités aériennes."
 NKO_self_produced_rifles: "Fusils auto-produits"
 NKO_self_produced_rifles_desc: "L'Armée populaire de Corée ne peut dépendre de fournisseurs étrangers pour son fusil de service standard. Les arsenaux intérieurs s'équiperont pour fabriquer des armes légères en quantité, assurant que chaque soldat soit armé d'une arme faite dans la patrie."
 NKO_model_master: "Maître modèle"
 NKO_model_master_desc: "Le développement des chars de la Corée du Nord vise à produire des véhicules blindés indigènes adaptés à son terrain et à sa doctrine. Des modèles d'inspiration soviétique aux conceptions modernisées, ces chars jouent un rôle critique dans les forces terrestres, insistant sur la mobilité, la puissance de feu et la capacité d'opérer dans des scénarios de combat divers."
 NKO_artillery: "Notre artillerie"
 NKO_artillery_desc: "L'artillerie de la Corée du Nord est une pierre angulaire de sa stratégie militaire, avec un vaste éventail de systèmes, des obusiers traditionnels à l'artillerie-roquettes avancée. Réputée pour son stock massif, elle est conçue pour une puissance de feu écrasante, capable de viser installations militaires et zones civiles, notamment en Corée du Sud voisine, en faisant un élément clé de dissuasion et d'offensive."
 NKO_spaa: "Notre défense aérienne"
 NKO_spaa_desc: "Le système de défense aérienne de la Corée du Nord mélange technologie d'ère soviétique et plateformes développées dans le pays, conçu pour protéger l'infrastructure critique et contrer les menaces aériennes. Il comprend missiles surface-air, canons antiaériens et radars, insistant sur une défense en couches. Malgré des limites face aux systèmes modernes, il reflète l'accent du pays sur l'autosuffisance et la dissuasion."
 NKO_rocket_artillery: "Artillerie de fusée"
 NKO_rocket_artillery_desc: "L'artillerie-roquettes de la Corée du Nord est un composant critique de son armée, avec une large gamme de systèmes, dont les puissants KN-09 et KN-25. Ces plateformes sont conçues pour des frappes de précision à longue portée, capables de livrer une puissance de feu significative contre des cibles militaires et stratégiques. Leur mobilité et leur déploiement rapide renforcent la capacité de la Corée du Nord à projeter la force et à soutenir des opérations offensives."
 NKO_naval_modernization: "Modernisation navale"
 NKO_naval_modernization_desc: "La modernisation navale de la Corée du Nord vise à renforcer ses capacités avec des bâtiments plus petits et agiles et des systèmes de missiles avancés. Cela inclut le développement de sous-marins capables de lancer des missiles balistiques (SLBM) et la modernisation des navires de surface. L'effort reflète une stratégie de guerre asymétrique, s'appuyant sur des atouts côtiers et sous-marins pour contrer de plus grandes puissances navales et projeter la force dans les eaux régionales."
 NKO_anti_submarine: "Capacités anti-sous-marines"
 NKO_anti_submarine_desc: "Les capacités anti-sous-marines de la Corée du Nord sont limitées mais en évolution, s'appuyant sur un mélange de patrouilleurs, de charges de profondeur et de bâtiments équipés de sonar. Les efforts d'amélioration incluent le déploiement de navires plus petits et agiles et l'expérimentation de technologie indigène. Ces capacités visent à défendre les eaux côtières et à contrer d'éventuelles incursions sous-marines, assurant la sécurité maritime près de ses rives."
 NKO_infiltration_by_sea: "Infiltration par la mer"
 NKO_infiltration_by_sea_desc: "La stratégie d'infiltration par mer de la Corée du Nord s'appuie sur sa flotte de petits bâtiments rapides, sous-marins et semi-submersibles pour des opérations couvertes. Ces atouts permettent le transport de forces spéciales et d'équipement, souvent indétecté, pour reconnaissance, sabotage ou guerre non conventionnelle. Cette approche souligne l'accent de la Corée du Nord sur les tactiques asymétriques pour exploiter les vulnérabilités des côtes ennemies."
 NKO_submarine_development: "Développement des sous-marins"
 NKO_submarine_development_desc: ""
 NKO_upgrade_shipyards: "Améliorer les chantiers navals"
 NKO_upgrade_shipyards_desc: "Le développement sous-marin de la Corée du Nord vise à étendre sa flotte de bâtiments conventionnels et stratégiques, dont des sous-marins lanceurs de missiles balistiques (SLBM) comme la classe Sinpo. Ce programme souligne l'ambition du pays d'établir une dissuasion sous-marine crédible, renforçant furtivité et survabilité dans sa stratégie nucléaire. Avec un mélange de conceptions indigènes et de modernisation d'anciens modèles, la Corée du Nord priorise des capacités navales asymétriques pour renforcer sa défense et sa portée stratégique."
 NKO_expand_bases: "Développer les bases"
 NKO_expand_bases_desc: "La stratégie de la Corée du Nord d'étendre ses bases militaires reflète son accent sur le renforcement de la défense et de la préparation. Cela inclut la modernisation des installations existantes, la construction de nouveaux abris souterrains et le renforcement des hubs logistiques. L'expansion des bases vise à améliorer l'efficacité du déploiement des troupes, protéger les atouts critiques et fournir une profondeur stratégique, assurant la survabilité face à d'éventuelles attaques tout en projetant la puissance le long de points stratégiques. Ces développements visent aussi à soutenir les avancées en missiles, sous-marins et autre matériel."
 NKO_green_water_navy: "Marine d'eau verte"
 NKO_green_water_navy_desc: "Le développement d'une marine d'eaux vertes par la Corée du Nord vise à étendre sa portée opérationnelle au-delà des eaux côtières vers les mers régionales. Cette stratégie implique le déploiement de petites frégates, corvettes et vedettes lance-missiles, ainsi que des efforts pour renforcer les capacités sous-marines. Le but est de protéger les revendications territoriales, soutenir des stratégies de guerre asymétrique et projeter une puissance limitée dans les eaux régionales, notamment en mer Jaune et en mer du Japon. Cette approche souligne l'ambition de la Corée du Nord d'équilibrer une modernisation rentable et ses objectifs militaires stratégiques."
 NKO_revolutionary_military_spirit: "Esprit militaire révolutionnaire"
 NKO_revolutionary_military_spirit_desc: "Le concept nord-coréen d'« Esprit militaire révolutionnaire » est une idéologie centrale qui insiste sur une loyauté inébranlable, la discipline et l'engagement envers l'État et sa direction. Il sert de cadre motivationnel aux forces armées, encourageant résilience, autosuffisance et disposition au sacrifice face à l'adversité. Cet esprit national sous-tend la culture militaire de la nation, nourrissant unité et détermination pour atteindre des objectifs stratégiques malgré les défis économiques et technologiques. Il reflète l'intégration de l'idéologie politique à la stratégie militaire comme force motrice des initiatives de défense de la Corée du Nord."
 NKO_expand_peasant_militia: "Étendre la milice paysanne"
 NKO_domestic_naval_strategy: "Stratégie navale nationale"
 NKO_domestic_naval_strategy_desc: "Poser les fondations d'une doctrine navale moderne. Chaque branche du programme — sous-marins, vedettes lance-missiles, défense côtière et opérations spéciales — recevra sa part de ressources pour commencer le développement."
 NKO_domestic_submarine_program: "Programme de sous-marins nationaux"
 NKO_domestic_submarine_program_desc: "Concentrer les efforts du bureau sur la construction sous-marine indigène. Une production de coques affinée et une instruction intensifiée des équipages nous donneront le bras frappant silencieux dont nous avons besoin pour menacer les ennemis loin de notre côte."
 NKO_domestic_destroyer_buildup: "Accumulation de destroyers domestiques"
 NKO_domestic_destroyer_buildup_desc: "Produire en masse des vedettes lance-missiles et de petits combattants de surface pour essaimer les flottes ennemies dans les eaux côtières. Nos chantiers peuvent aligner des coques plus vite que le Sud ne peut déployer de lourds destroyers."
 NKO_destroyer_unleashed: "Destructeur déchaîné"
 NKO_destroyer_unleashed_desc: "Aligner une nouvelle génération de destroyers équipés de canons plus lourds et de batteries antiaériennes dédiées. La flotte pourra enfin contester les engagements en eaux bleues plutôt que de se cacher le long de la côte."
 NKO_navy_projects: "Projets de la marine nord-coréenne"
 NKO_navy_projects_desc: "Le focus §YModernisation navale§! ouvre ce programme. Gagnez des points d'accumulation navale avec les décisions de financement, de chantiers et de poussée Juche, puis dépensez-les sur les pistes §HForce sous-marine§!, §HFlottilles de vedettes lance-missiles§!, §HRéseau de défense côtière§! et §HOpérations spéciales navales§! jusqu'à ce que les quatre atteignent §Y100§!."
 NKO_expand_peasant_militia_desc: "L'expansion de la milice paysanne de la Corée du Nord, connue comme les Gardes rouges ouvriers-paysans, est un geste stratégique pour renforcer la défense nationale par la mobilisation de masse. Cette force paramilitaire, composée de civils, doit compléter les opérations militaires régulières, défendre les communautés locales et assurer la sécurité intérieure. Les efforts d'expansion incluent davantage d'instruction, l'équipement des miliciens en armes légères et leur intégration à des exercices militaires plus larges. Cette approche reflète l'accent de la Corée du Nord sur la guerre asymétrique et sa stratégie de « défense de tout le peuple », assurant une force large et décentralisée capable de résister aux menaces extérieures et de maintenir la stabilité intérieure."
 NKO_bolster_young_red_guards: "Renforcer les Jeunes Gardes rouges"
 NKO_bolster_young_red_guards_desc: "Renforcer les Jeunes Gardes rouges, organisation paramilitaire de jeunesse de la Corée du Nord, est une initiative clé visant à inculquer loyauté idéologique et préparation militaire à sa population plus jeune. Cela implique d'améliorer l'instruction militaire, l'éducation politique et le conditionnement physique des étudiants, souvent en les intégrant aux exercices de défense nationale. En équipant les Jeunes Gardes rouges d'armement de base et de compétences de survie, la Corée du Nord assure un flux régulier d'individus idéologiquement engagés et prêts au combat, capables de soutenir les forces armées régulières en temps de conflit. Cette initiative souligne le recours du régime à la mobilisation de la jeunesse dans sa stratégie de « défense de tout le peuple »."
 NKO_rebuild_sso: "Réforme des forces spéciales"
 NKO_rebuild_sso_desc: "La réforme des forces spéciales de la Corée du Nord vise à moderniser et renforcer les capacités de ses unités d'élite pour la guerre asymétrique, les opérations non conventionnelles et les missions de réponse rapide. Cette réforme inclut l'amélioration des régimes d'instruction, l'incorporation de tactiques avancées et l'équipement des forces en armement et systèmes de communication modernes. Les forces spéciales sont conçues pour exceller en infiltration, sabotage, reconnaissance et action directe, visant souvent des atouts stratégiques ou une infrastructure critique. Les réformes visent à accroître leur efficacité dans les conflits régionaux, renforcer la dissuasion et maintenir la préparation pour une variété de missions à enjeux élevés. Cet accent reflète le recours stratégique de la Corée du Nord à des unités hautement qualifiées et agiles pour compenser les limites militaires conventionnelles."
 NKO_rebuild_kim_il_sung_military_university: "Reconstruire l'Université militaire Kim Il-sung"
 NKO_rebuild_kim_il_sung_military_university_desc: "L'Université militaire Kim Il-sung, collège clé de défense nationale à Pyongyang, rassemble depuis 1952 un grand nombre des meilleurs commandants du pays. En entrant dans le nouveau siècle, les anciennes installations de cette université deviennent de plus en plus inadaptées au nouveau style de guerre. Il est temps de restaurer cette institution à sa gloire d'antan."
 NKO_revolutionary_spirits: "Esprit militaire révolutionnaire"
 NKO_the_green_water_navy: "La marine d'eaux vertes"
 NKO_the_green_water_navy_desc: "Cet esprit national sera §Yamélioré§! si nous achevons les focuses de §HModernisation navale§!. \n§W--------------§!\nUne marine d'eaux vertes est une force maritime capable d'opérer dans les zones littorales de son État et ayant une compétence limitée dans les mers marginales environnantes. C'est un terme relativement nouveau, créé pour mieux distinguer, et nuancer, deux descripteurs de longue date : marine d'eaux bleues (eaux profondes des océans ouverts) et marine d'eaux brunes (eaux littorales et près du rivage)."
 NKO_the_blue_water_navy: "La marine d'eaux bleues"
 NKO_the_blue_water_navy_desc: "Des années d'expansion des chantiers, de réforme doctrinale et d'exercices conjoints ont transformé notre flotte d'une force côtière en une vraie marine océanique. Nous pouvons désormais sortir bien au-delà de nos rives, avec des équipages et des coques égaux à tout rival de la région.\n§W--------------§!\nUne marine d'eaux bleues est une force maritime capable d'opérations soutenues à travers les eaux profondes des océans ouverts, projetant la puissance bien au-delà de sa côte d'attache."
 NKO_planned_economy: "Économie planifiée"
 NKO_planned_economy_desc: "La Corée du Nord, officiellement la République populaire démocratique de Corée (RPDC), a une économie de commandement isolée et étroitement contrôlée. Dans une économie de commandement, l'économie est planifiée et coordonnée au centre par le gouvernement, composante standard de tout pays communiste."
 NKO_the_38th_parallel: "Le 38e parallèle"
 NKO_the_38th_parallel_desc: "En juillet 1953, l'accord d'armistice coréen fut signé entre les deux Corées et les volontaires chinois, ainsi que les forces des Nations unies, établissant une zone démilitarisée basée sur le 38e parallèle, séparant le Nord et le Sud. Cette ligne de partage existe depuis quelque 50 ans et il est peut-être temps d'avancer vers la réunification, d'une façon ou d'une autre."
 NKO_the_road_to_peace: "La voie de la paix ?"
 NKO_the_road_to_peace_desc: "La « politique du rayon de soleil » de la Corée du Sud semble démontrer un désir sincère de réunification. Peut-être est-il temps que les camarades intercoréens travaillent ensemble vers la réunification."
 NKO_the_road_to_war: "La voie de la guerre"
 NKO_the_road_to_war_desc: "Les impérialistes américains et leurs marionnettes sud-coréennes n'ont jamais pu, ne peuvent et ne pourront jamais permettre une vraie réunification de la Corée. La réunification par la force est la vérité éternelle."
 NKO_end_six_party_negotiations: "Armes nucléaires prêtes"
 NKO_end_six_party_negotiations_desc: "Les pourparlers à six n'ont livré que du délai. Nous quitterons la table de négociation et porterons notre dissuasion nucléaire à pleine préparation. La Corée du Sud, le Japon et les États-Unis apprendront que notre sécurité n'est pas à négocier."
 NKO_remilitarize_the_dmz: "Remilitariser la DMZ"
 NKO_remilitarize_the_dmz_desc: "Remilitariser la DMZ marquera une escalade significative de notre conflit avec le Sud, mais donnera indubitablement un avantage à nos troupes dans le conflit à venir."
 NKO_struggle_for_power: "La lutte pour le pouvoir"
 NKO_struggle_for_power_desc: "La lutte de pouvoir entre Kim Jong-un et son frère Kim Jong-nam fut une bataille secrète de succession au sein de la famille dirigeante de la Corée du Nord. Après la mort de leur père Kim Jong-il, les deux frères étaient des candidats potentiels. Kim Jong-nam, jadis héritier favori, tomba en disgrâce pour ses critiques publiques du régime et son exil à Macao. Kim Jong-un, soutenu par des élites influentes, solidifia sa position par des alliances stratégiques et des purges internes. La lutte s'acheva par l'ascension de Kim Jong-un au pouvoir en 2011, marquée par l'assassinat mystérieux de Kim Jong-nam en 2017, que beaucoup croient orchestré par le gouvernement nord-coréen. Ce conflit a souligné la nature impitoyable des dynamiques de pouvoir dans l'un des régimes les plus secrets du monde."
 NKO_orthodox_successor: "Le successeur orthodoxe"
 NKO_orthodox_successor_desc: "Dans les années 1990, Kim Jong-un fut choisi par le grand général Kim Jong-il comme successeur au pouvoir en raison de ses qualifications exceptionnelles. Le cher camarade Kim Jong-un, que Dieu a donné au peuple coréen dans le passé, le présent et l'avenir, protégera toujours la sécurité et la prospérité de la Corée du Juche."
 NKO_promote_self_reliance: "Promouvoir l'autosuffisance"
 NKO_promote_self_reliance_desc: "Un pays ne peut jamais être riche et fort en s'appuyant sur les autres : seule l'autosuffisance le rend fort !"
 NKO_ostracize_kim_jong_nam: "Ostraciser Kim Jong-nam"
 NKO_ostracize_kim_jong_nam_desc: "En ostracisant Kim Jong-nam, pour que le \\"père\\" se méfie encore davantage de lui, nous avons davantage de chances de prendre le pouvoir."
 NKO_bribe_kpa_seniors: "Soudoyer les anciens de l'APC"
 NKO_bribe_kpa_seniors_desc: "Les généraux de l'APC détiennent le pouvoir militaire, et le soutien de ces anciens a plus de chances de nous placer aux commandes."
 NKO_oppose_to_chinese_reform_road: "S'opposer ouvertement à la voie chinoise des réformes"
 NKO_oppose_to_chinese_reform_road_desc: "Le modèle de réforme chinois découle de leur direction collégiale. Transposé à la Corée du Nord, il mènerait inévitablement au chaos social. Et le \\"père\\" n'y est pas favorable non plus. Pour que la lignée du mont Paektu perdure, nous devons nous opposer ouvertement à l'application du modèle chinois."
 NKO_discredit_jang_seong_taek: "Discréditer Jang Seong-taek"
 NKO_discredit_jang_seong_taek_desc: "Jang Seong-taek est une figure notoirement pro-chinoise en Corée du Nord et un proche du père. Un tel traître, qui a bradé les intérêts de la nation, ne saurait être toléré. Pour prendre le pouvoir, nous devons rassembler les preuves de sa culpabilité et le dénoncer devant le Père."
 NKO_call_for_change: "L'appel au changement"
 NKO_call_for_change_desc: "La RPDC fonctionne sous économie planifiée depuis près de cinquante ans. Mais la succession des \\"révolutions de 1989\\" et de la \\"Marche ardue\\" a prouvé que l'économie d'État n'était plus adaptée au siècle nouveau. Une réforme audacieuse et profonde est nécessaire pour que la Corée du Nord redevienne forte."
 NKO_pull_in_young_military_officers: "Attirer les jeunes officiers"
 NKO_pull_in_young_military_officers_desc: "Attirer de jeunes officiers ouverts d'esprit de l'APC ne nous fera aucun mal : plus proches de la troupe, ils faciliteront notre contrôle des unités."
 NKO_frame_opposition: "Accabler l'opposition"
 NKO_frame_opposition_desc: "La stratégie pour accabler Kim Jong-un consiste à le présenter comme une force irresponsable et déstabilisatrice au sein de la direction nord-coréenne. En soulignant ses purges agressives, ses décisions volatiles et son manque de doigté diplomatique, nous pouvons le positionner comme un danger pour la stabilité du régime et la sécurité régionale. Ce cadrage contrasté avec une vision de direction stable et rationnelle mettra en avant le besoin d'une figure plus équilibrée et acceptable à l'étranger. Par des récits soigneusement construits, des messages ciblés et des témoignages d'initiés, le but est de saper sa crédibilité et d'influencer l'opinion intérieure comme internationale."
 NKO_stir_up_father_son_relations: "Attiser le conflit père-fils"
 NKO_stir_up_father_son_relations_desc: "Il ne sera pas facile de semer le conflit entre Kim Jong-un et Kim Jong-il, mais cela nous vaudra davantage de soutiens."
 NKO_place_loyalists_in_kpa: "Placer des loyalistes dans l'APC"
 NKO_place_loyalists_in_kpa_desc: "Il y a vingt ans, lorsque Kim Jong-il et son demi-frère pouvaient prétendre à la direction de la Corée du Nord, le soutien des anciens partisans à Kim Jong-il fut décisif pour son élection comme dirigeant suprême. L'Armée populaire de Corée a aujourd'hui hérité de cette position. Plaçons des loyalistes dans l'APC pour accroître notre contrôle."
 NKO_finding_reformist_of_party: "Trouver les réformateurs du Parti"
 NKO_finding_reformist_of_party_desc: "Ce n'est pas que les réformateurs n'existent pas au Parti, mais ils n'osent pas parler face à l'opposition de Kim Jong-il. Si nous gagnons leur soutien, nous aurons davantage de chances de changer le Chosŏn."
 NKO_power_struggle: "Lutte de pouvoir"
 NKO_power_struggle_desc: "Tôt ou tard, le grand dirigeant actuel de la Corée du Nord, le camarade Kim Jong-il, mourra et son successeur sera sans doute l'un de ses deux fils, Kim Jong-nam et Kim Jong-un. Mais « un pays ne peut avoir deux maîtres », et tous deux doivent gagner la confiance de leur père. Soutenir un candidat plutôt que l'autre jusqu'au choix du successeur fera perdre de la £stability_texticon §YStabilité§!.\n\nSi nous n'avons pas plus de £stability_texticon §YStabilité§! que 45 %, la junte cherchera à s'emparer du pouvoir une fois Kim Jong-il mort.\n\n£stability_texticon §YStabilité§! actuelle : [?NKO.stability|1%]\n\nActuellement,\nOrthodoxie de §OKim Jong-un§! : §Y[?ROOT.NKO_kim_jong_un]%§!\n\n§YLe successeur choisi par Kim Jong-il§! : [ROOT.GetChosenSuccessor]\n\nNotre dirigeant, §YKim Jong-il§!, pourrait ne pas voir 2012 : préparez-vous à choisir un successeur en §Y2011§!"
 NKO_1_increase_kim_jong_un_tt: "Le soutien à Kim Jong-un §Yaugmente§! de 1 %"
 NKO_2_increase_kim_jong_nam_tt: "Le soutien à Kim Jong-nam §Yaugmente§! de 2 %"
 NKO_3_increase_kim_jong_un_tt: "Le soutien à Kim Jong-un §Yaugmente§! de 3 %"
 NKO_3_increase_kim_jong_nam_tt: "Le soutien à Kim Jong-nam §Yaugmente§! de 3 %"
 NKO_2_5_increase_kim_jong_un_tt: "Le soutien à Kim Jong-un §Yaugmente§! de 2 % ~ 5 %"
 NKO_2_5_increase_kim_jong_nam_tt: "Le soutien à Kim Jong-nam §Yaugmente§! de 2 % ~ 5 %"
 NKO_5_decrease_kim_jong_un_tt: "Le soutien à Kim Jong-un §Ydiminue§! de 5 %"
 NKO_2_decrease_kim_jong_nam_tt: "Le soutien à Kim Jong-nam §Ydiminue§! de 2 %"
 NKO_3_decrease_kim_jong_un_tt: "Le soutien à Kim Jong-un §Ydiminue§! de 3 %"
 NKO_4_increase_kim_jong_nam_tt: "Le soutien à Kim Jong-nam §Yaugmente§! de 4 %"
 NKO_5_increase_kim_jong_nam_tt: "Le soutien à Kim Jong-nam §Yaugmente§! de 5 %"
 NKO_kim_jong_il_death: "La mort de Kim Jong-il"
 NKO_kim_jong_il_death_desc: "\n--------------\nCe focus se §Ydéverrouillera§! le §Y17 décembre 2011 à 8 h 30§!. Le bien-aimé Grand Dirigeant, fondateur de la République populaire démocratique de Corée et Président éternel de la République, Kim Jong-il, est mort à 8 h 30 le 17 décembre 2011 d'un infarctus du myocarde aigu compliqué d'un choc cardiogénique, alors qu'il se rendait en train visiter une région."
 NKO_junta: "Coup d'État de la Junte"
 NKO_junta_desc: "Les réformes réussies en Chine et au Vietnam nous offrent un bon exemple, mais elles n'ont pas été sans accroc. Si les nôtres échouaient, nous mourrions et serions annexés par le Sud. Kim Jong-un et Kim Jong-nam veulent des niveaux de réforme différents. Nous aurons à faire le choix le plus dur pour ne perdre ni le pays ni le Parti..."
 NKO_preserve_songun: "Préserver Songun"
 NKO_preserve_songun_desc: "Le Songun est le fondement de l'armée et nous devons défendre son idéologie."
 NKO_entrench_military_authority: "Ancrer l'autorité militaire"
 NKO_entrench_military_authority_desc: "Bien que nous ayons utilisé l'armée pour arracher le pouvoir à la dynastie Kim, il reste des loyalistes kimistes dans ses rangs ; nous userons de nos « moyens » pour les convaincre..."
 NKO_smash_black_market: "Briser le « marché »"
 NKO_smash_black_market_desc: "Les forces du « marché » causent de graves dégâts à notre pays et doivent être arrêtées immédiatement !"
 NKO_determining_the_loyalty_of_army: "Déterminer la loyauté de l'armée"
 NKO_determining_the_loyalty_of_army_desc: "Nous pouvons désormais promouvoir certains de nos loyalistes et les rendre plus soumis."
 NKO_purge_dissenters: "Purger les dissidents"
 NKO_purge_dissenters_desc: "Pour maintenir la stabilité du pays en cette transition critique du pouvoir, nous devons arrêter immédiatement tous les dissidents potentiels !"
 NKO_crush_the_kims: "Exécution des Kim"
 NKO_crush_the_kims_desc: "Laisser en vie les fils de Kim Jong-il est en définitive un facteur de déstabilisation : exécutez-les en secret !"
 NKO_constrain_the_donju: "Encadrer les Donju"
 NKO_constrain_the_donju_desc: "Les Donju ont déjà un peu contribué au développement économique du pays ; maintenons-les actifs..."
 NKO_end_the_donju: "Répression de la contrebande"
 NKO_end_the_donju_desc: "La contrebande est un crime. Malgré sa contribution à l'économie, il est temps d'éliminer une fois pour toutes ces hors-la-loi."
 NKO_high_pressure_politics: "Politique sous haute pression"
 NKO_high_pressure_politics_desc: "Le mécontentement populaire a atteint un tel niveau que nous devons user de moyens coercitifs pour maintenir notre pouvoir."
 NKO_empower_the_state_security_department: "Renforcer le Bureau général de reconnaissance"
 NKO_empower_the_state_security_department_desc: "Nous devons désormais autoriser le Bureau général de reconnaissance de l'armée à assumer davantage de responsabilités et à devenir le service de renseignement dominant du pays. Il détectera, arrêtera et éliminera saboteurs potentiels et espions impérialistes."
 NKO_chi_military_support: "Soutien militaire chinois"
 NKO_chi_military_support_desc: "La Chine est notre frère et allié éternel. Pour survivre sur la scène internationale, nous reviendrons dans les bras de Pékin."
 NKO_chi_invest_resources: "Aide à l’extraction des ressources"
 NKO_chi_invest_resources_desc: "Nous sommes prêts à laisser les compagnies minières chinoises entrer sur notre territoire."
 NKO_chi_banks: "Banques chinoises"
 NKO_chi_banks_desc: "Nous sommes prêts à laisser les banques chinoises entrer dans le pays."
 NKO_chi_help_factories: "Usines chinoises"
 NKO_chi_help_factories_desc: "Nous entendons demander au gouvernement chinois son aide pour construire de nouvelles usines sur notre territoire."
 NKO_chi_huawei: "Coopération avec Huawei"
 NKO_chi_huawei_desc: "Huawei est l'une des entreprises les plus célèbres au monde et nous voulons que le gouvernement chinois l'autorise à opérer sur notre territoire."
 NKO_military_collectives: "Règle de la junte"
 NKO_military_collectives_desc: "Notre peuple n'est pas prêt à embrasser l'Occident ; nous devons continuer à maintenir notre pouvoir."
 NKO_encourage_private_enterprise: "Encourager l’entreprise privée"
 NKO_encourage_private_enterprise_desc: "L'entrepreneuriat privé est le moteur futur du progrès économique, et nous entendons l'encourager."
 NKO_market_based_economy: "Économie de marché"
 NKO_market_based_economy_desc: "Notre système économique ne nous a apporté que des problèmes et des crises permanentes ; il est temps de le changer."
 NKO_reorganising_government: "Réorganiser le gouvernement"
 NKO_reorganising_government_desc: "Il est temps de réorganiser le gouvernement ; le pays a besoin d'un nouvel exécutif."
 NKO_kim_jong_un: "Kim Jong Un"
 NKO_kim_jong_un_desc: "Successeur de Kim Jong-il sur qui reposent de grands espoirs, Kim Jong-un souhaite des réformes économiques adaptées pour relancer l'économie tout en maintenant le pays stable et uni. Il ne veut toutefois pas perdre son emprise ni son statut élevé de « lignée du mont Paektu »..."
 NKO_consolidate_power: "Consolider le pouvoir"
 NKO_consolidate_power_desc: ""
 NKO_light_industry_develop: "Développer l’industrie légère"
 NKO_light_industry_develop_desc: ""
 NKO_criticize_ineptitude: "Critiquer l'ineptie"
 NKO_criticize_ineptitude_desc: ""
 NKO_improvement_of_people_live: "Amélioration des conditions de vie de la population"
 NKO_improvement_of_people_live_desc: ""
 NKO_people_support: "Le soutien du peuple"
 NKO_people_support_desc: ""
 NKO_centralize_power: "Centraliser le pouvoir"
 NKO_centralize_power_desc: ""
 NKO_root_out_corruption: "Éradiquer la corruption"
 NKO_root_out_corruption_desc: ""
 NKO_formalize_power_structures: "Formaliser les structures de pouvoir"
 NKO_formalize_power_structures_desc: ""
 NKO_assassinate_kim_jong_nam: "Assassiner Kim Jong-nam"
 NKO_assassinate_kim_jong_nam_desc: "Kim Jong-nam restera une menace pour la stabilité de notre régime tant qu'il vivra ; éliminez-le à tout prix."
 NKO_appoint_loyalists: "Nommer des loyalistes"
 NKO_appoint_loyalists_desc: ""
 NKO_civilian_control_of_the_economy: "Contrôle civil de l'économie"
 NKO_civilian_control_of_the_economy_desc: ""
 NKO_party_state_army: "Parti, État, armée"
 NKO_party_state_army_desc: ""
 NKO_party_unchecked: "Le Parti éternel"
 NKO_party_unchecked_desc: ""
 NKO_eternal_juche_sasang: "Juche Sasang éternel"
 NKO_eternal_juche_sasang_desc: ""
 NKO_kim_jong_nam: "Kim Jong Nam"
 NKO_kim_jong_nam_desc: "Kim Jong-nam, fils aîné de Kim Jong-il, est depuis longtemps une figure controversée de la politique nord-coréenne. Un temps héritier présomptif, ses critiques publiques du régime et son exil en ont fait un symbole de dissidence. Avocat de réformes économiques et d'un engagement international, sa vision contraste fortement avec l'approche traditionaliste de son cadet Kim Jong-un. Son retour en Corée du Nord pourrait annoncer un virage vers des politiques plus ouvertes et un défi à l'ordre établi."
 NKO_face_world: "Faire face au monde"
 NKO_face_world_desc: "La réforme institutionnelle du pays ne peut se faire sans soutien extérieur ; nous devons donc nous concentrer sur la diplomatie et entretenir de bonnes relations avec le monde."
 NKO_diplomatic_overtures: "Établir des relations diplomatiques"
 NKO_diplomatic_overtures_desc: "La deuxième étape de la diplomatie nord-coréenne est l'établissement de relations diplomatiques formelles avec divers pays, ce qui aplanira la voie des réformes."
 NKO_step_up_joint_ventures: "Inviter davantage de coentreprises"
 NKO_step_up_joint_ventures_desc: "L'investissement étranger est un canal pour aider à réformer notre économie et nous l'accueillons."
 NKO_embrace_the_people: "Embrasser le peuple"
 NKO_embrace_the_people_desc: "Notre pays ne peut rester fermé pour toujours. Il est temps d'ouvrir les bras, d'embrasser notre peuple et de créer une Corée du Nord différente."
 NKO_loosen_information_monopoly: "Assouplir le monopole de l’information"
 NKO_loosen_information_monopoly_desc: "Le peuple est libre d'exprimer ses opinions."
 NKO_tone_down_propaganda: "Publicité officielle réduite"
 NKO_tone_down_propaganda_desc: "Si les médias officiels incarnaient autrefois la volonté de l'État, nos réformes de démocratisation n'ont plus besoin de leur imposer la « démocratie »."
 NKO_end_forced_labor: "Mettre fin au travail forcé"
 NKO_end_forced_labor_desc: "Plus de travail forcé : nous passons au monde ouvert."
 NKO_expand_sezs: "Développer les ZES"
 NKO_expand_sezs_desc: "Nous ne pouvons réformer l'économie sans l'aide des zones économiques spéciales de Rasŏn et Kaesŏng ; nous pouvons en établir davantage pour que certains s'enrichissent d'abord."
 NKO_end_juche: "Fin du Juche"
 NKO_end_juche_desc: "Le Juche n'est pas une panacée ; nous avons besoin d'un modèle de guidance plus scientifique."
 NKO_foreign_knowledge: "Talents de recherche extérieurs"
 NKO_foreign_knowledge_desc: "La RPDC a perdu beaucoup de talents à cause de politiques oppressives depuis des décennies ; pour combler le fossé, nous pourrions faire venir des chercheurs étrangers."
 NKO_join_the_wto: "Adhérer à l'OMC"
 NKO_join_the_wto_desc: "Trop longtemps, nous avons été exclus des bénéfices commerciaux mondiaux partagés par les membres de l'Organisation mondiale du commerce. Désormais nous changerons cela et pourrons mieux utiliser les mécanismes de l'ordre économique libéral occidental au service de nos réformes."
 NKO_preserve_the_party: "Conserver la direction du PTC"
 NKO_preserve_the_party_desc: "Réforme et ouverture ne signifient pas la fin de la direction du Parti du travail, qui peut mener le peuple vers un avenir lumineux et prospère."
 NKO_appeal_to_the_youth: "Faire appel à la jeunesse"
 NKO_appeal_to_the_youth_desc: "C'est la jeunesse qui est l'épine dorsale de notre réforme."
 NKO_the_choson_dream: "Le rêve chosŏn"
 NKO_the_choson_dream_desc: "Le « rêve chosŏn » est un concept nouveau introduit par le président [NKO.GetLeader], qui résume les buts personnels et nationaux de la nation coréenne. Il embrasse des aspirations dans de nombreux domaines, économiques, politiques et internationaux."
 NKO_democracy_with_north_characteristics: "Démocratie aux caractéristiques nord-coréennes"
 NKO_democracy_with_north_characteristics_desc: "La démocratie à l'occidentale ne convient pas entièrement à la RPDC, qui a besoin d'une démocratie à ses propres caractéristiques."
 NKO_people_before_party: "Les gens avant la fête"
 NKO_people_before_party_desc: "Le peuple est maître de son pays !"
 NKO_elections: "Élections locales"
 NKO_elections_desc: "Nos réformes incluent la démocratisation du système politique et le peuple aura le pouvoir de choisir les dirigeants qu'il veut."
 NKO_free_expression: "Libre expression"
 NKO_free_expression_desc: "Le peuple nord-coréen a trop longtemps été muselé ; la première liberté à lui accorder est celle d'expression."
 NKO_byungjin: "Byungjin"
 NKO_byungjin_desc: "Durant la Marche ardue, le sage général Kim Jong-il a maintenu le pays à flot en adoptant la politique du « Songun » pour préserver sa stabilité. Mais maintenant que l'économie a rebondi, il est temps d'abandonner l'approche exclusivement militaire et de développer armée et économie de concert !"
 NKO_scale_back_spending: "Réduire les dépenses publiques"
 NKO_scale_back_spending_desc: ""
 NKO_encourage_consumption: "Encourager la consommation"
 NKO_encourage_consumption_desc: ""
 NKO_loosen_grip_on_soes: "Relâcher l'emprise sur les entreprises d'État"
 NKO_loosen_grip_on_soes_desc: ""
 NKO_state_owned_enterprises_competition: "Concurrence des entreprises publiques"
 NKO_state_owned_enterprises_competition_desc: ""
 NKO_resorts_and_tourism: "Stations et tourisme"
 NKO_resorts_and_tourism_desc: "Sous sanctions internationales, nous n'avons que peu de moyens d'accéder aux devises. Renforçons le tourisme, que le monde vienne voir la beauté de la Corée du Nord !"
 NKO_samjiyon: "Samjiyon"
 NKO_samjiyon_desc: "Samjiyŏn est notre grand sanctuaire révolutionnaire. Il a un statut comparable à Yan'an en Chine. Nous devons y construire pour que le peuple reçoive davantage d'éducation patriotique."
 NKO_incentive_based_economy: "Économie incitative"
 NKO_incentive_based_economy_desc: "Assouplir le contrôle central sur les entreprises a porté ses fruits. En laissant les dirigeants récompenser la productivité et conserver une part de la production, l'État met l'intérêt personnel au service de la croissance sans abandonner les hauteurs de commande de l'économie."
 NKO_empower_the_donju: "Renforcer les Donju"
 NKO_empower_the_donju_desc: "Le pays ne peut trop dépendre de l'extérieur pour son développement. Mais sans les Donju, notre économie serait insoutenable. Donnons-leur davantage de droits favorables au commerce, qu'ils soient les chefs de l'économie nationale, et que le cheval aux mille li de l'économie coréenne galope !"
 NKO_weaken_the_donju: "Affaiblir les Donju"
 NKO_weaken_the_donju_desc: "Rebaptiser et revendre des produits chinois et sud-coréens n'a pas enrichi le pays. Nous devons nous concentrer sur nos propres marques industrielles et les hisser au sommet du marché mondial !"
 NKO_protect_state_owned_business: "Protéger les entreprises publiques"
 NKO_protect_state_owned_business_desc: ""
 NKO_encourage_foreign_investment: "Encourager l'investissement étranger"
 NKO_encourage_foreign_investment_desc: "Aussi résilientes que soient nos industries, leur plein potentiel économique ne peut s'exprimer sans investissement étranger. Nous devrions offrir des incitations pour encourager l'investissement direct étranger."
 NKO_privatize_means_of_production: "Privatiser les moyens de production"
 NKO_privatize_means_of_production_desc: ""
 NKO_economy_revival: "Relance économique"
 NKO_economy_revival_desc: "Avec la fin de la « Marche ardue », il est temps de relancer l'économie."
 NKO_priorit_for_civilian_industry: "Priorité à l'industrie civile"
 NKO_priorit_for_civilian_industry_desc: ""
 NKO_priorit_for_army_industry: "Priorité à l'industrie militaire"
 NKO_priorit_for_army_industry_desc: "L'industrie militaire nous est vitale, tant pour stimuler la demande intérieure que pour renforcer nos forces de défense."
 NKO_arms_trafficking: "Trafic d'armes"
 NKO_arms_trafficking_desc: "Pourquoi laisser d'innombrables armes s'empiler dans les entrepôts ? Nous pourrions les échanger contre de l'or."
 NKO_sinuiju: "Région administrative spéciale de Sinŭiju"
 NKO_sinuiju_desc: "Sinuiju a toujours été un port important pour le commerce avec la Chine. Nous pourrions suivre l'approche chinoise « un pays, deux systèmes » pour le rendre plus adapté au commerce étranger."
 NKO_recognition_of_economic_backwardness: "Reconnaissance du retard économique"
 NKO_recognition_of_economic_backwardness_desc: "L'économie nord-coréenne a pris du retard après la « Marche ardue ». Nous avons besoin de réformes radicales."
 NKO_2009_revaluation: "Réévaluation"
 NKO_2009_revaluation_desc: "Durant la Marche ardue, notre économie nationale, et surtout notre système monétaire, a été durement frappée. Le peuple ne faisait plus confiance à notre monnaie et le troc envahissait le quotidien. Pour changer cela, il faut une réforme monétaire et une réévaluation audacieuses."
 NKO_revaluation_failure: "Échec de la réévaluation..."
 NKO_revaluation_failure_desc: ""
 NKO_air_koryo: "Air Koryo"
 NKO_air_koryo_desc: ""
 NKO_reform_of_the_privatisation_of_collective_farms: "Privatisation des fermes collectives"
 NKO_reform_of_the_privatisation_of_collective_farms_desc: "Assouplir le contrôle des fermes collectives locales pour accroître leur incitation à produire."
 NKO_construction_of_hydraulic_facilities: "Construction d'installations hydrauliques"
 NKO_construction_of_hydraulic_facilities_desc: "Pour augmenter les rendements agricoles sans trop dépendre des engrais chimiques, nous devons construire davantage d'installations hydrauliques."
 NKO_free_housing: "Logement supplémentaire gratuit"
 NKO_free_housing_desc: "Construire davantage de logements pour que les gens puissent s'y loger !"
 NKO_expand_compulsory_education: "Étendre l'enseignement obligatoire"
 NKO_expand_compulsory_education_desc: "L'éducation est le fondement d'une nation forte. Élargir l'enseignement obligatoire, donner à plus d'enfants accès à des niveaux supérieurs."
 NKO_chollima_speed_desc: "Le développement des infrastructures est une étape importante sur la voie de la reconstruction économique, tant pour le développement que pour des usages militaires : routes capables de porter du matériel lourd et voies ferrées pour trains de missiles."
 NKO_arduous_march: "La Marche ardue"
 NKO_arduous_march_desc: "§RLa famine nord-coréenne§! fut une période de famine de masse et de crise économique générale à partir de 1994, aussi connue sous le nom de « Marche ardue »."
 NKO_dmz_remilitarized: "DMZ remilitarisée"
 NKO_dmz_remilitarized_desc: "Remilitariser la DMZ marquera une escalade significative du conflit avec le Sud, mais donnera indéniablement un avantage à nos troupes dans le conflit à venir."
 NKO_kor_hostile_action_tt: "N'a pas été antagonisé par des actions hostiles récentes."
 NKO_broken_juche: "Le Juche brisé"
 NKO_eternal_juche: "Le Juche éternel"
 NKO_marxism_leninism: "Marxisme-léninisme"
 NKO_democratic_land: "La terre démocratique"
 NKO_songun_junta: "Songun"
 NKO_songun_junta_desc: "Le Songun est une politique nord-coréenne. Elle exige qu'en politique et en économie, « tout passe d'abord par l'APC »."
 NKO_self_reliance: "Autonomie"
 NKO_choson_dream: "Le rêve chosŏn"
 NKO_anti_tatmadaw_sentiment: "Sentiment anti-Armée populaire"
 NKO_anti_tatmadaw_sentiment_desc: "Lorsque l'APC a choisi de bouleverser la situation politique en Corée, l'hostilité du peuple à la règle militaire a atteint un niveau sans précédent."
 NKO_simhwajo_sageon_legacy: "L'héritage du Simhwajo Sageon"
 NKO_simhwajo_sageon_legacy_desc: "Le Simhwajo Sageon est une vaste campagne de purge menée par Kim Jong-il pour écarter les hommes de son père Kim Il-sung, entre 1997 et 2000 en RPDC.\nCertains l'ont appelée « version nord-coréenne du maccarthysme » ou « version nord-coréenne de la Révolution culturelle »."
 NKO_close_dmz: "Fermer la DMZ"
 NKO_close_dmz_desc: ""
 NKO_superiority_of_dprk_model: "Supériorité du modèle RPDC"
 NKO_superiority_of_dprk_model_desc: ""
 NKO_abolish_life_time_system_for_cadres_in_leadership: "Abolir le système à vie des cadres à la direction"
 NKO_abolish_life_time_system_for_cadres_in_leadership_desc: ""
 NKO_allow_donju_to_join_wpk: "Autoriser les Donju à rejoindre le PTC"
 NKO_allow_donju_to_join_wpk_desc: "Les Donju ne sont que des hommes d'affaires légaux qui paient leurs impôts. Pourquoi ne pourraient-ils pas rejoindre le PTC ?"
 NKO_kim_jong_un_successor: "§YKim Jong-un§! a obtenu le trône."
 NKO_kim_jong_nam_successor: "§YKim Jong-nam§! a obtenu le trône."
 NKO_chi_propose_trade_agreement_tooltip: "A un accord commercial avec §Y[CHI.GetNameWithFlag]§!\n"
 NKO_russian_friendship: "Alliance russo-nord-coréenne"
 NKO_russian_friendship_desc: "La Russie a toujours été l'un de nos principaux alliés, et l'URSS l'est d'autant plus dans notre apparition et notre existence. Nous entendons relancer les relations d'alliance entre nos pays."
 NKO_south_korea_influency_tt: "[KOR.GetFlag] §HMultiplicateur d'influence§! sud-coréen en §Y[ROOT.GetNameWithFlag]§! : §R+5%§!"
 NKO_national_recovery_plan_started_tooltip: "§Y$NKO_national_recovery_plan$§! achevé il y a plus d'§Y1§! an"
 NKO_export.10.a.tt: "Livre des §Yfusils§! et de l'§Yéquipement de commandement§! suffisants pour §Ytrois bataillons d'infanterie légère§! (3× besoin de bataillon)."
 NKO_export.10.c: "Demander un paquet d'§Yinfanterie motorisée§! : fusils, véhicules utilitaires et équipement de commandement"
 NKO_export.10.c.tt: "Livre des §Yfusils§!, des §Yvéhicules utilitaires§! et de l'§Yéquipement de commandement§! suffisants pour §Ytrois bataillons d'infanterie motorisée§! (3× besoin de bataillon)."
 NKO_export.10.e: "Demander un paquet §Yblindé§! : chars de bataille principaux et équipement de commandement"
 NKO_export.10.e.tt: "Livre des §Ychars de combat§! et de l'§Yéquipement de commandement§! suffisants pour §Ytrois bataillons blindés§! (3× besoin de bataillon). Exige une conception de char nord-coréenne moderne."
 NKO_export.10.f: "Demander un paquet d'§Yinfanterie mécanisée§! : VCI, VTT, fusils et équipement de commandement"
 NKO_export.10.f.tt: "Livre des §YVCI§!, des §YVTT§!, des §Yfusils§! et de l'§Yéquipement de commandement§! suffisants pour §Ytrois bataillons d'infanterie mécanisée§! (3× besoin de bataillon). Exige des modules de véhicules nord-coréens modernes."
 korea.50.b: "L'Asie de l'Est ne sera plus jamais la même."
 NKO_tank_facility_foundry_trait: "Fonderie d'installations de réservoirs"
 NKO_second_economic_committee_trait: "Deuxième comité économique"
 NKO_kim_jong_il_death_tt: "Kim Jong-il est mort"
 NKO_5_increase_kim_jong_un_tt: "Le soutien à Kim Jong-un §Yaugmente§! de 5 %"
 NKO_5_decrease_kim_jong_nam_tt: "Le soutien à Kim Jong-nam §Ydiminue§! de 5 %"
 NKO_korean_repair_frontline_workers_desc: "En vertu du traité de 2024, des brigades de travail nord-coréennes œuvrent à l'arrière des districts occidentaux russes, reconstruisant gares de triage, aérodromes, chantiers navals et usines d'armement. Pyongyang est payée en espèces et en carburant."
 NKO_korean_repair_frontline_workers_sov_desc: "Des milliers de travailleurs ont été envoyés sur des chantiers de reconstruction russes sous contrat d'État. Leurs salaires reviennent à Pyongyang en devises, mais les hommes sont tirés du même vivier que l'Armée populaire de Corée."
 NKO_korean_repair_civil_workers_desc: "Des équipes de construction nord-coréennes sont affectées à la reconstruction civile en Russie, réparant usines, logements et routes. Moscou couvre leur entretien et paie Pyongyang pour le contrat."
 NKO_korean_repair_civil_workers_sov_desc: "Des équipes civiles sont placées auprès de combines de construction russes sous contrat d'État. Ces placements rapportent des devises à l'étranger au prix de la main-d'œuvre chez nous."
 NKO_korean_ratnik_conversion_desc: "Le kit d'infanterie Ratnik fourni par la Russie parvient à l'APC : gilets pare-balles, harnais, optiques et vêtements d'hiver. L'équipement est nettement supérieur à l'ordinaire national, et son entretien coûte en conséquence."
 NKO_naval_point_spend_tt: "Point de regroupement naval : §R-1§! (§Y[?NKO_naval_points|0]§! tenu)"
 NKO_naval_allocate_party_funds_tt: "Point de regroupement naval : §G+1§! (§Y[?NKO_naval_points|0]§! tenu)"
 NKO_naval_mobilize_nampo_shipyards_tt: "Points de montée navale à l'achèvement des chantiers : §G+2§!  (§Y[?NKO_naval_points|0]§! détenus)"
 NKO_naval_juche_drive_tt: "Points de construction navale : §G+4§! (§Y[?NKO_naval_points|0]§! tenu)"
 NKO_spa_picks_remaining: "§GMandats en session : §!§Y[?NKO_spa_picks_made|0]§!§G/2§!"
 NKO_spa_chain_industry_tt: "§GRapport d'avancement du Parti déposé : §!§Y+1§!§G.§!\n§Y[?NKO_spa_chain_industry|0]§!§G rapports sur 10 déposés pour ce mandat jusqu'ici. Tant que moins de 10, chaque rapport ouvre un suivi en trois étapes sur les deux mois suivants et comporte §!§Y25 %§!§G de chances d'un gain extraordinaire en plus.§!"
