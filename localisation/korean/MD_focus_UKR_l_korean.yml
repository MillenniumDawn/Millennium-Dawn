 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_started_flag: "§YNVK 테크임펙스§!가 §YBRDM-2T§! 작업에 착수했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol_flag: "§YBRDM-2T 얀홀§!을 채택함."
 ukraine_modernize_sov_equipment_brdm_2_modernization_brdm_2dp_flag: "§YBRDM-2DP§!를 채택했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_brdm_2i_flag: "§YBRDM-2I§!를 채택했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_brdm_2_vepr_flag: "§YBRDM-2 '베프르'§!를 채택했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_flag: "§YVEPR§! 기업의 제안을 받아들였습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_flag: "§Y제45 시험 기계공장§!의 제안을 받아들였습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m: "미콜라이우에 §YBTR-60M§! 주문"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60m_for_tooltip\n\n\n\n\n\n\n\n\n§WHundreds of §RSoviet§! §YBTR-60PB§! still serve in our army. Their two gasoline engines are thirsty and catch fire easily. The §LMorozov design bureau§! in Kharkiv has designed the §YBTR-60M§!, where a single 300 hp §YUTD-20§! diesel from the §YBMP-1§! replaces them, while the original turret with its 14.5 mm §YKPVT§! stays. The §LMykolayiv Armored Plant§! is ready to build it.\n\nLater §YBTR-60§! upgrades build on this variant.\n------------------\nThis Decision is a §Rprerequisite§! for the §YBTR-60MK§! decision. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete it.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission: "마지막 기회: §YBTR-60M§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach: "우리 §YBTR-60§!의 미래 선택"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60_for_tooltip\n\n\n\n\n\n\n\n\n§WThe war in the east has shown that we still need every armored personnel carrier we have. The Ministry of Defence wants to decide how to keep our old §YBTR-60§! in service. If we already have the §YBTR-60M§!, §LKORT§! can develop it further. §LNVK Techimpex§! offers a smaller upgrade that works on any §YBTR-60PB§!.\n------------------\nThis Decision is a §Rprerequisite§! for the §YBTR-60MK§! and §YBTR-60PB-T§! decisions. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete them.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission: "기한: 우리 §YBTR-60§!의 미래"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc$\n\n§R타이머가 끝나면 어쨌든 선택해야 합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk: "Order the §YBTR-60MK§! from §LKORT§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60mk_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §LKORT§! company builds on our §YBTR-60M§! work. Its §YBTR-60MK§! gets two §LCummins§! diesels, add-on armor and larger side hatches for the troops. Later, the turret can give way to a Mykolayiv combat module with a 14.5 mm and a 7.62 mm machine gun and an §YAGS-17§! grenade launcher.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission: "마지막 기회: §YBTR-60MK§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc$\n\n§R타이머가 끝나면 KORT사가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t: "Order the §YBTR-60PB-T§! from §LTechimpex§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60pb_t_for_tooltip\n\n\n\n\n\n\n\n\n§W§LNVK Techimpex§! offers the §YBTR-60PB-T§!. The old turret gives way to the §YBM-23-2§! combat module, diesels replace the gasoline engines, and the engine cooling, the water jet drive and the electrical equipment are renewed.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission: "마지막 기회: §YBTR-60PB-T§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§R타이머가 끝나면 테크임펙스가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech: "Develop the §YBTR-60PB-T§! with §LTechimpex§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§WWe have no unmanned turrets of our own yet, so §LNVK Techimpex§! has to develop the mount for the §YBM-23-2§! from scratch. The work takes longer and costs more, but it gives us the technology.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission: "마지막 기회: §YBTR-60PB-T§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc$\n\n§R타이머가 끝나면 테크임펙스가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_unmanned_turret_tt: "§YBTR-60PB-T§!를 채택하면 §Y현대식 전투 지휘 장비 및 보조 장비§! 기술도 함께 얻으며, 이 기술로 §Y무인 포탑§!이 해금됩니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.name: "BTR-60M 준비 완료"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.desc: "미콜라이우 공장이 §YBTR-60M§!을 완성했습니다. 이제 UTD-20 디젤 엔진 한 기가 가솔린 엔진 두 기의 역할을 해내므로 연료 소모와 화재 위험이 줄었으며, 기존 포탑은 14.5mm KPVT와 7.62mm PKT를 유지합니다. 앞으로 다른 기업들이 이 설계를 바탕으로 개발할 수 있습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.a: "§YBTR-60M§!을 채택한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.b: "계획을 보류한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.name: "우리 BTR-60의 미래"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.desc: "국방부에 BTR-60 관련 제안이 두 건 올라와 있습니다. §YKORT§!사는 커민스 디젤 엔진, 추가 장갑, 더 큰 해치로 우리의 §YBTR-60M§!을 더 발전시키려 합니다. §YNVK 테크임펙스§!는 낡은 차량을 재무장하고 디젤 엔진을 달아 주는 §YBTR-60PB-T§!를 제안합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.2.a: "KORT사와 함께 §YBTR-60M§!을 더 발전시킨다"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.b: "테크임펙스의 §YBTR-60PB-T§!로 방향을 돌린다"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.name: "우리 BTR-60의 미래"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.desc: "우리는 §YBTR-60M§!을 만든 적이 없으므로 BTR-60의 대규모 개량은 처음부터 시작해야 합니다. 대신 §YNVK 테크임펙스§!가 소규모 개량을 제안합니다. §YBTR-60PB-T§!는 낡은 차량을 재무장하고 디젤 엔진을 달아 줍니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.3.a: "테크임펙스에 소규모 업그레이드를 주문한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.name: "BTR-60MK 준비 완료"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.desc: "§YKORT§!사가 커민스 디젤 엔진 두 기, 추가 장갑, 병력용 확대 측면 해치를 갖춘 §YBTR-60MK§!를 완성했습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.4.a: "§YBTR-60MK§!를 채택한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.b: "계획을 보류한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.name: "BTR-60PB-T 준비 완료"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.desc: "§YNVK 테크임펙스§!가 BM-23-2 전투 모듈, 디젤 엔진, 새로 교체한 냉각·수류 추진·전기 계통을 갖춘 §YBTR-60PB-T§!를 인도했습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.5.a: "§YBTR-60PB-T§!를 채택한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.b: "계획을 보류한다"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_unlocks_tt: "§YBTR-60M으로 이후 결정이 열립니다.§! §YKORT§!사의 §YBTR-60MK§!는 이것을 바탕으로만 만들 수 있습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_plan_tt: "§YNVK 테크임펙스§!는 §Y2019년§! 중반까지 §YBTR-60PB-T§!를 제안합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_plan_tt: "§YKORT§!사는 §Y2019년§! 중반까지 §YBTR-60MK§!를 제안합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_mykolayiv_wait_tt: "§Y미콜라이우 장갑차 공장§!이 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_wait_tt: "§YKORT§!사가 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_wait_tt: "§YNVK 테크임펙스§!가 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_convert_tt: "이제 생산 라인에서 우리의 구형 1세대 장갑차를 이 형식으로 §G전환§!할 수 있습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_stockpile_100_tt: "비축분에 §YBTR-60§! 세대 장갑 수송차를 최소 §Y100§!대 보유 (현재: §Y[?num_equipment@medium_tank_amphibious_chassis_0|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_stockpile_100_tt_legacy: "비축분에 §YBTR-60§! 세대 장갑 수송차를 최소 §Y100§!대 보유 (현재: §Y[?num_equipment@APC_1|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_mykolayiv_expired_tt: "공장이 제안을 철회합니다. §YKORT§!사의 §YBTR-60MK§!는 더 이상 불가능해집니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_expired_tt: "§YKORT§!사가 제안을 철회합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_expired_tt: "§YNVK 테크임펙스§!가 제안을 철회합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_image_btr_60m_tt: "§YBTR-60M§!\n\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60m_for_tooltip\n\n\n\n\n\n\n\n\n"
 ukraine_modernize_sov_equipment_btr_60_modernization_image_btr_60mk_tt: "§YBTR-60MK§!\n\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60mk_for_tooltip\n\n\n\n\n\n\n\n\n"
 ukraine_modernize_sov_equipment_btr_60_modernization_image_btr_60pb_t_tt: "§YBTR-60PB-T§!\n\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60pb_t_for_tooltip\n\n\n\n\n\n\n\n\n"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d: "Ask [BUL.GetNameWithFlag] for its old §YBTR-60PB§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60d_for_tooltip\n\n\n\n\n\n\n\n\n§WThe war with [SOV.GetFlag] Russia eats through our armored vehicles. [BUL.GetFlag] Bulgaria still keeps old §YBTR-60PB§! in storage and is ready to hand them over as military aid. We can put them into service as they are, or overhaul them at home and replace their worn §YGAZ-40P§! gasoline engines with two [GER.GetFlag] German §LDeutz§! §YBF4M2012§! diesels and a new gearbox. That upgrade is the §YBTR-60D§!.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.name: "불가리아의 첫 BTR-60PB"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.desc: "We can ask §YBulgaria§! for the first §Y20§! §YBTR-60PB§! from its storage. They are old and worn, but they still float, run and can carry a squad. If §YBulgaria§! agrees, we can send them to the front right away, or first overhaul them and fit §YDeutz§! diesels."
 ukraine_modernize_sov_equipment_btr_60_modernization.6.a: "그대로 배치한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.b: "정비하여 §YBTR-60D§!로 만든다"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.c: "불가리아에는 더 내줄 여유가 없다"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.name: "인도된 첫 BTR-60D"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.desc: "우리 정비 공장이 첫 §Y20§!대의 §YBTR-60D§!를 완성했습니다. 각 102마력의 도이츠 BF4M2012 디젤 엔진 두 기가 낡은 GAZ-40P 가솔린 엔진을 대체하여 차량의 신뢰성이 높아지고 출력도 약간 늘었습니다. 첫 차량들은 기계화 여단으로 갑니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.7.a: "전선으로 보낸다"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.name: "불가리아의 다음 BTR-60PB 물량"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.desc: "We can ask §YBulgaria§! for another §Y40§! §YBTR-60PB§! from its storage. Again, we can use them as they are, or overhaul them into the §YBTR-60D§!. Our plants already know the work, so it goes faster. §YBulgaria§! has to agree first."
 ukraine_modernize_sov_equipment_btr_60_modernization.8.a: "그대로 배치한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.b: "정비하여 §YBTR-60D§!로 만든다"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.c: "$ukraine_modernize_sov_equipment_btr_60_modernization.6.c$"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.name: "인도된 BTR-60D 물량"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.desc: "또 다른 §Y40§!대의 §YBTR-60D§!가 새 도이츠 디젤 엔진과 변속기를 달고 우리 정비 공장을 떠났습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.9.a: "전선으로 보낸다"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_stockpile_tt: "[BUL.GetNameWithFlag] §YBulgaria§! keeps at least §Y100§! first-generation armored personnel carriers in storage (now: §Y[?BUL.num_equipment@medium_tank_amphibious_chassis_0|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_stockpile_tt_legacy: "[BUL.GetNameWithFlag] §YBulgaria§! keeps at least §Y100§! first-generation armored personnel carriers in storage (now: §Y[?BUL.num_equipment@APC_1|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_plan_tt: "We ask §YBulgaria§! for §Y100§! §YBTR-60PB§! in three batches: §Y20§!, then §Y40§! and §Y40§!. Each batch needs the consent of §YBulgaria§! and can go into service as it is or be overhauled into the §YBTR-60D§!."
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_wait_tt: "첫 물량이 약 §Y$DAYS$§!일 뒤 도착합니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_next_batch_tt: "If §YBulgaria§! accepts, we can ask for the next batch of §Y40§! §YBTR-60PB§! in about §Y60§! days."
 ukraine_modernize_sov_equipment_btr_60_modernization_overhaul_wait_tt: "우리 공장이 약 §Y$DAYS$§!일 뒤 정비를 마칩니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_batch_20_tt: "§Y불가리아§!가 BTR-60PB를 창고에 최소 §Y20§!대 보유 중"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_batch_40_tt: "§Y불가리아§!가 BTR-60PB를 창고에 최소 §Y40§!대 보유 중"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_empty_tt: "§Y불가리아§!에 남는 BTR-60PB가 바닥나 인도가 끝납니다."
 ukraine_modernize_sov_equipment_btr_60_modernization_image_btr_60pb_tt: "§YBTR-60PB§!\n\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60_for_tooltip\n\n\n\n\n\n\n\n\n"
 ukraine_modernize_sov_equipment_btr_60_modernization_image_btr_60d_tt: "§YBTR-60D§!\n\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60d_for_tooltip\n\n\n\n\n\n\n\n\n"
