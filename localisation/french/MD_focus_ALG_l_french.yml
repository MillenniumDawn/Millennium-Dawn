 AlgeriaFocusNews.100.t: "Initiative de Casablanca : courtiser les grandes puissances"
 AlgeriaFocusNews.100.d: "L'Algérie a choisi de courtiser les grandes puissances pour appuyer son Initiative de Casablanca. C'est coûteux mais accroît la chance d'un fort résultat à l'UA."
 AlgeriaFocusNews.101.t: "Initiative de Casablanca : approche régionale"
 AlgeriaFocusNews.101.d: "L'Algérie poursuit une voie diplomatique uniquement régionale, s'appuyant sur les États voisins et les alliés de l'Union africaine."
 AlgeriaFocusNews.102.t: "Initiative de Casablanca : stratégie mixte"
 AlgeriaFocusNews.102.d: "L'Algérie combinera efforts régionaux et internationaux pour accroître la pression tout en couvrant les risques."
 AlgeriaFocusNews.103.t: "Initiative de Casablanca : succès majeur"
 AlgeriaFocusNews.103.d: "L'Initiative de Casablanca a obtenu un résultat décisif dans le processus UA/ONU. La pression diplomatique a un vrai élan ; l'Algérie est en position forte pour pousser le Maroc à abandonner ses revendications diplomatiques (et, selon votre focus, à retirer les cœurs)."
 AlgeriaFocusNews.104.t: "Initiative de Casablanca : succès modéré"
 AlgeriaFocusNews.104.d: "L'Initiative de Casablanca a produit un résultat diplomatique significatif. La pression sur le Maroc a augmenté ; l'UA est favorable mais pas décisive."
 AlgeriaFocusNews.105.t: "Initiative de Casablanca : résultat modeste"
 AlgeriaFocusNews.105.d: "L'Initiative de Casablanca n'a produit qu'une sympathie modeste à l'UA. Il faudra davantage d'efforts pour forcer des concessions majeures."
 AlgeriaFocusNews.106.t: "Initiative de Casablanca : mission expirée"
 AlgeriaFocusNews.106.d: "Le temps s'est écoulé sans résultat substantiel. L'élan diplomatique est perdu."
