 ENG_scottish_union_settlement_referendum_desc: "웨스트민스터는 헌법 문제를 스스로 정한 조건으로 스코틀랜드 유권자에게 제시했습니다. 그 결과가 권한 이양 문제를 영구히 종결하는 데 필요한 위임에 반영되는 합의 주민투표입니다. 투표는 어디까지나 투표이며, 분리주의 정당들은 가진 모든 것을 동원해 반대 운동을 펼치고 있습니다. 독립에 대한 결정적 거부가 이 합의를 성사시킵니다. 그에 못 미치면 문제는 정확히 제자리에 남으며, 신용을 소진하고 패배한 정부만 남게 됩니다.\n\n승리한 주민투표: §Y[?ENG_scottish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_north_irish_union_settlement_referendum: "[GetYear] [NIR.GetFlag] 북아일랜드 연합 합의 주민투표"
 ENG_north_irish_union_settlement_referendum_desc: "웨스트민스터는 헌법 문제를 스스로 정한 조건으로 북아일랜드 유권자에게 제시했습니다. 그 결과가 권한 이양 문제를 영구히 종결하는 데 필요한 위임에 반영되는 합의 주민투표입니다. 투표는 어디까지나 투표이며, 공화주의 정치 세력은 가진 모든 것을 동원해 반대 운동을 펼치고 있습니다. 독립에 대한 결정적 거부가 이 합의를 성사시킵니다. 그에 못 미치면 문제는 정확히 제자리에 남으며, 신용을 소진하고 패배한 정부만 남게 됩니다.\n\n승리한 주민투표: §Y[?ENG_north_irish_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
 ENG_welsh_union_settlement_referendum: "[GetYear] [WAS.GetFlag] 웨일스 연합 합의 주민투표"
 ENG_welsh_union_settlement_referendum_desc: "웨스트민스터는 헌법 문제를 스스로 정한 조건으로 웨일스 유권자에게 제시했습니다. 그 결과가 권한 이양 문제를 영구히 종결하는 데 필요한 위임에 반영되는 합의 주민투표입니다. 투표는 어디까지나 투표이며, 분리주의 정당들은 가진 모든 것을 동원해 반대 운동을 펼치고 있습니다. 독립에 대한 결정적 거부가 이 합의를 성사시킵니다. 그에 못 미치면 문제는 정확히 제자리에 남으며, 신용을 소진하고 패배한 정부만 남게 됩니다.\n\n승리한 주민투표: §Y[?ENG_welsh_referendum_success|0]§!/§G3§!\n$ENG_integration_vote$: §Y[?ENG_referendum_stay_vote|0]§!%"
