 CAN_infantry_weapons_1: "C1A2"
 CAN_infantry_weapons_1_desc: "C1A2 была крупной модификацией винтовки C1A1, выполненной компанией Canadian Arsenals Limited. В неё вошли несколько изменений, направленных на повышение надёжности оружия и упрощение ремонта в полевых условиях."
 CAN_infantry_weapons_2: "C7"
 CAN_infantry_weapons_2_desc: "Лицензированная версия платформы Colt M16 с рядом особенностей, запрошенных канадской стороной, в результате чего получилась винтовка, похожая на M16A2, но с прицельными приспособлениями от M16A1 и возможностью ведения полностью автоматического огня."
 CAN_infantry_weapons_3: "C7A1"
 CAN_infantry_weapons_3_desc: "C7A1 заменяет узел механического прицела и рукоятки для переноски, использовавшийся на C7, на модифицированную планку Weaver для установки оптики. Крепление может использовать традиционные механические прицелы или оптический прицел ELCAN C79 Optical Sight 3.4x28."
 CAN_infantry_weapons_4: "C7A2"
 CAN_infantry_weapons_4_desc: "В связи с участием Канады в войне в Афганистане компания Diemaco и Канадские вооружённые силы доработали C7A1, чтобы винтовка лучше отвечала условиям боевых операций. В результате появилась винтовка C7A2, оснащённая четырёхпозиционным телескопическим прикладом и трёхпланочным модулем TRIAD, который крепится на основании мушки и позволяет устанавливать дополнительные аксессуары. Переключатель режимов огня, кнопка сброса магазина и защёлка рукоятки взведения стали двусторонними."
 CAN_infantry_weapons_5: "C8A3"
 CAN_infantry_weapons_5_desc: "C8A3 — это модернизированная версия карабина C8, оснащённая стволом холодной ковки и верхним ресивером с плоской планкой, а также всеми обновлениями среднего жизненного цикла, появившимися на C7A2, такими как зелёная фурнитура, двусторонняя защёлка рукоятки взведения, кнопка сброса магазина и переключатель режимов огня. Также включает планку TRIAD I."
 CAN_infantry_weapons_6: "C8A4"
 CAN_infantry_weapons_6_desc: "C8A4 основан на Colt MRR и включает глушитель, интегрированную верхнюю планку, более современную оптику, новую спусковую систему и несколько других улучшений, ранее появившихся на винтовках C7 и C8."
 CAN_infantry_weapons_7: "CMAR"
 CAN_infantry_weapons_7_desc: "Канадская модульная штурмовая винтовка — это дальнейший набор модернизаций C8A4, сосредоточенный на использовании переменной оптики, улучшенной эргономике и расширенных возможностях адаптации оружия под конкретного оператора."
 CAN_util_vehicle_8: "AOPIMU"
 CAN_transport_helicopter_1: "Bell CH-135 Twin Huey"
 CAN_transport_helicopter_1_desc: "Вертолёт Bell CH-135 Iroquois (прозвище «Twin Huey») — это многоцелевой военный вертолёт с двумя турбовальными двигателями и двухлопастными несущим и хвостовым винтами. Модернизированный представитель многочисленного семейства Huey был разработан компанией Bell Helicopter для удовлетворения требований Канадских сил 1968 года к многоцелевому вертолёту."
 CAN_transport_helicopter_1_short: "CH-135 Twin Huey"
 CAN_transport_helicopter_2: "Bell CH-146 Griffon"
 CAN_transport_helicopter_2_desc: "Bell CH-146 Griffon — это четырёхлопастный двухдвигательный многоцелевой вертолёт производства компании Bell Helicopters."
