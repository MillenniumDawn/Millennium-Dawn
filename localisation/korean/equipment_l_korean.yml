 NOV_infantry_weapons_5_desc: "AK-103 돌격소총은 7.62x39mm M43 탄약을 사용하는 AK-74M의 파생형입니다. 구형 AKM과 마찬가지로 AK-103은 야간 투시경과 망원 조준경을 포함한 다양한 조준기를 사용할 수 있으며, 총검이나 유탄 발사기도 장착할 수 있습니다. 대부분의 AK 소총과의 차이점은 AK-103이 플라스틱 및 저렴한 재료를 사용한다는 점입니다."
 NOV_infantry_weapons_6_desc: "AK-12는 러시아의 신형 돌격소총입니다. 라트니크 미래 보병 훈련 프로그램의 일환으로 개발되었으며, 특수부대용으로 제작되어 AK-103의 생산을 대체할 예정입니다. AK-12는 균형감각과 인체공학적 설계가 개선되어 현재까지 러시아에서 가장 정예화된 돌격소총으로 평가받고 있습니다."
 LPR_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 LPR_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 LPR_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 LPR_infantry_weapons_4_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
 LPR_infantry_weapons_5_desc: "AK-103 돌격소총은 7.62x39mm M43 탄약을 사용하는 AK-74M의 파생형입니다. 구형 AKM과 마찬가지로 AK-103은 야간 투시경과 망원 조준경을 포함한 다양한 조준기를 사용할 수 있으며, 총검이나 유탄 발사기도 장착할 수 있습니다. 대부분의 AK 소총과의 차이점은 AK-103이 플라스틱 및 저렴한 재료를 사용한다는 점입니다."
 LPR_infantry_weapons_6_desc: "AK-12는 러시아의 신형 돌격소총입니다. 라트니크 미래 보병 훈련 프로그램의 일환으로 개발되었으며, 특수부대용으로 제작되어 AK-103의 생산을 대체할 예정입니다. AK-12는 균형감각과 인체공학적 설계가 개선되어 현재까지 러시아에서 가장 정예화된 돌격소총으로 평가받고 있습니다."
 SPR_infantry_weapons_5_desc: "G36A2 모델은 G36 모델의 개량형입니다. G36A2는 기존의 듀얼 컴뱃 사이팅 시스템의 레드닷 조준경을 대체하는, 피카티니 레일에 장착된 탈착식 자이스 RSA 반사식 레드닷 조준경을 특징으로 합니다. G36A2 업그레이드 키트에는 더 짧은 G36C 개머리판, 옵션으로 4개의 피카티니 레일을 장착할 수 있는 알루미늄 재질의 새로운 핸드가드, 그리고 오를리콘 콘트라베스 LLM01 레이저 라이트 모듈 작동 스위치가 내장된 수직형 포어그립이 포함됩니다."
 SPR_infantry_weapons_6_desc: "G36A3 소총은 G36 플랫폼을 더욱 현대화한 모델로, 더 커진 피카티니 레일, 4단계 조절식 개머리판, 그리고 통합형 자이스 RSA 반사식 레드닷 조준경/운반 손잡이가 헨솔트 조준경으로 교체된 것이 특징입니다."
 SPR_infantry_weapons_8_desc: "헤클러앤코흐 433(HK433)은 5.56mm x 45 구경의 현대적이고 모듈식이며 소형화된 돌격소총으로, 기존 G36과 HK416 제식소총의 장점과 뛰어난 특징들을 결합한 제품입니다. HK433에는 정확도 향상을 위해 높이 조절이 가능한 뺨받침대가 있는 접이식 개머리판이 새롭게 장착되었습니다. 또한, 근접전 상황에서는 개머리판을 접은 상태로 사용할 수 있습니다."
 TAI_infantry_weapons_2_desc: "M16 소총(공식 명칭: 5.56mm 구경 M16 소총)은 미군을 위해 ArmaLite AR-15 소총을 개량한 군용 소총 계열입니다. 초기 M16 소총은 20발들이 탄창을 사용하는 5.56mm 자동 소총이었습니다."
 VIE_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 train_equipment_4: "열차 2075"
 infantry_weapons_9: "2045년형 소화기"
 infantry_weapons_9_desc: "소형 화기는 돌격소총, 지정사수소총, 저격소총, 유탄발사기, 무반동총, 경기관총, 방탄복 등 소총 분대가 사용하는 장비를 나타냅니다."
 infantry_weapons_10: "2055년형 소화기"
