 EH_event.406.d: "Com as recentes unificações na América do Norte e Central, o governo de [FROM.GetName] propôs um caminho semelhante para as nossas nações sul-americanas. O objetivo é criar uma frente unificada contra a ameaça da Quimera, reunindo recursos, força militar e vontade política para garantir a sobrevivência. Embora algumas ideologias e governos difiram, a situação pode fazê-los mudar de ideia."
 EH_randallite_limit_TT: "Estoque atual de §YRandallita§!: §Y[?EH_randallite_stockpile]§! / §Y300§!."
 EH_event.311.t: "O Portal Se Estabiliza por Completo"
 EH_event.311.d: "Imagens térmicas de satélite confirmam o que os analistas temiam: o portal sobre o Chifre da África parou de oscilar e se fixou em um estado estável e permanente. Drones de reconhecimento relatam o enxame se concentrando do outro lado em números grandes demais para contar."
 EH_event.311.a: "A invasão começou de verdade"
 EH_europe_defense_line_category: "Linha de Defesa Europeia"
 EH_europe_defense_line_category_desc: "As Linhas de Defesa Europeias são nossa melhor chance de conter as forças da Quimera na Europa. As linhas serão fortificadas com artilharia pesada e defesas antiaéreas, além de uma rede de trincheiras e bunkers. Os exércitos da maioria das nações europeias ficarão estacionados ali. Precisamos garantir que as linhas resistam quando a Rússia cair."
 EH_construct_europe_defense_line: "Construir Linha de Defesa §GEuropeia§!"
 EH_europe_defense_line_destruction: "Linha de Defesa Europeia Ruindo"
 EH_event.810.t: "Linha de Defesa Europeia em Construção"
 EH_event.810.d: "Devido à importância da fronteira oriental da Europa, uma nova linha está sendo construída para separar o continente da Ásia. É atualmente o maior investimento para proteger a região crítica da invasão da Quimera. Algumas pessoas a chamam de \"a primeira e a última defesa da Europa\"."
 EH_event.810.a: "Interessante"
 EH_event.811.t: "A Linha Europeia Foi Rompida"
 EH_event.811.d: "As forças da Quimera romperam hoje de manhã a enorme Muralha de Defesa Europeia. Com um poder esmagador, a Quimera conseguiu romper as fortificações e agora marcha rumo às nações europeias. Se a Federação Europeia não preparar um plano eficaz para detê-las, a Europa estará perdida."
 EH_event.811.a: "E agora?"
