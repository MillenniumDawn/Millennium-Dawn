 SAU_pipeline_transit_JOR_t1: "Transit par pipeline saoudien (niveau I)"
 SAU_pipeline_transit_JOR_t1_desc: "Le pétrole saoudien traverse la Jordanie, et les droits de transit gonflent le Trésor. L'oléoduc élève la vitesse de construction de la nation. §GRevenu supplémentaire : 1,00 Md $§!"
