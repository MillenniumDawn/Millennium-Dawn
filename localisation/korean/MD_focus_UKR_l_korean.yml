 UKR_modernize_mi24pu1_flag: "완료된 결정: §YMi-24PU1 현대화 개발§!"
 UKR_modernize_mi24pu2: "§YMi-24PU2§! 현대화 개발"
 UKR_modernize_mi24pu2_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu2_for_tooltip\n\n\n\n\n\n\n\n\n§W§YMi-24PU2§!는 §L코노톱 항공기 수리 공장 아비아콘§!이 §YMi-24PU1§!을 더 본격적으로 현대화한 형식입니다. §Y프랑스§!제 조준·야간 투시 장비, 향상된 자기 방어 체계, §L루치 설계국§!의 §Y'바리어-V'§! 대전차 유도 미사일이 추가됩니다.\n------------------\n프랑스제 장비는 우리에 대한 §Y[FRA.GetNameWithFlag]§!의 우호도가 높은 동안에만 이용할 수 있습니다.§!"
 UKR_develop_domestic_atgm_category: "자국산 대전차 유도 미사일 개발"
 UKR_develop_domestic_atgm_category_desc: "\n\n\n\n\n\n£UKR_desctext_atgm_main\n\n\n\n\n\n\n\n\n키이우의 §L루치 설계국§!과 함께 자국산 대전차 유도 미사일 체계를 개발하고 현대화하는 데 시간과 자원을 투입할 수 있습니다."
 UKR_develop_domestic_atgm_barrier: "§Y'바리어'§! 대전차 유도 미사일 개발"
 UKR_develop_domestic_atgm_barrier_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_barrier_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'바리어'§!는 §L루치 설계국§!이 장갑차와 헬리콥터용으로 개발한 §Y[ROOT.GetFlag]우크라이나§!제 대전차 유도 미사일입니다.\n탠덤 탄두를 갖춘 130mm 레이저 빔 라이딩 미사일로, 최대 5km 거리에서 폭발 반응 장갑(ERA)으로 방호된 장갑 표적을 격파하도록 설계되었습니다.\n------------------\n이 결정은 같은 장비 범주의 다른 모든 결정과 §YMi-24PU2§! 현대화를 해금하기 위한 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정들을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_develop_domestic_atgm_barrier_flag: "완료된 결정: §Y'바리어' 대전차 유도 미사일 개발§!"
 ukraine_equipment_develop_domestic_atgm.6.name: "'바리어' 대전차 유도 미사일: 개발 완료"
 ukraine_equipment_develop_domestic_atgm.6.desc: "루치 설계국이 '바리어' 대전차 유도 미사일 개발을 마쳤습니다. 레이저 빔 라이딩 유도 방식에서 쌓은 경험은 새로운 세대의 [ROOT.GetAdjective] 대전차 유도 미사일로 가는 길을 열어 줍니다."
 ukraine_equipment_develop_domestic_atgm.6.a: "작업을 계속한다"
 UKR_develop_domestic_atgm_barrier_s: "§Y'바리어-S'§! 대전차 유도 미사일 개발"
 UKR_develop_domestic_atgm_barrier_s_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_barrier_s_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'바리어-S'§!는 §L루치 설계국§!이 §Y'슈투름-S'§! 대전차 유도 미사일을 기반으로 개발한 [ROOT.GetFlag]우크라이나제 대전차 유도 미사일 체계입니다.\n§Y'바리어-S'§!는 복합 장갑, 이격 장갑, 단일 장갑은 물론 폭발 반응 장갑(ERA)까지 갖춘 현대식 장갑 표적을 파괴하도록 설계되었습니다.§!"
 ukraine_equipment_develop_domestic_atgm.7.name: "'바리어-S' 대전차 유도 미사일: 개발 완료"
 ukraine_equipment_develop_domestic_atgm.7.desc: "루치 설계국이 '슈투름-S' 전차 파괴 차량에 '바리어' 미사일을 장착하는 개조를 마쳤으며, '바리어-S'를 우리 [ROOT.GetFlag] [ROOT.GetAdjective] 군에 도입하기 위한 다음 단계를 선택할 수 있습니다."
 ukraine_equipment_develop_domestic_atgm.7.a: "설계만 확보한다"
 ukraine_equipment_develop_domestic_atgm.7.b: "본격적인 생산을 개시한다"
 UKR_equipment_develop_domestic_stuhna_p_atgm: "§YRK-2 '스투흐나-P'§! 대전차 유도 미사일 개발"
 UKR_equipment_develop_domestic_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\n§W§YRK-2 '스투흐나-P'§!는 수출형 명칭 §Y'스키프'§!로도 알려진, 2010년대 초에 §L루치 설계국§!이 개발한 §Y[ROOT.GetFlag]우크라이나§!제 대전차 유도 미사일 체계입니다.\n§Y스투흐나-P§!는 복합 장갑, 이격 장갑, 단일 장갑은 물론 폭발 반응 장갑(ERA)까지 갖춘 현대식 장갑 표적을 파괴하도록 설계되었습니다.\n§Y스투흐나-P§!는 주간 최대 5km의 장거리와 100m 이상의 근거리 모두에서 고정 표적과 이동 표적을 공격할 수 있습니다.\n------------------\n이 결정은 같은 장비 범주의 다음 §Y7§!개 결정, 그리고 §YT-84-140 '바히라'§! 및 §YObject 477A1 '노타'§! 전차 결정을 해금하기 위한 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 이후 결정들을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_equipment_develop_domestic_stuhna_p_atgm_flag: "완료된 결정: §YRK-2 '스투흐나-P' 대전차 유도 미사일 개발§!"
 ukraine_equipment_develop_domestic_atgm.1.name: "RK-2 '스투흐나-P' 대전차 유도 미사일: 개발 완료"
 ukraine_equipment_develop_domestic_atgm.1.desc: "루치 설계국의 훌륭한 사람들이 RK-2 '스투흐나-P' 대전차 유도 미사일 개발을 마쳤으며, 이 신형 체계를 우리 [ROOT.GetFlag] [ROOT.GetAdjective] 군에 도입하기 위한 다음 단계를 선택할 수 있습니다."
