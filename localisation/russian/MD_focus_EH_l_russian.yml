 EH_event.406.d: "В связи с недавним объединением Северной и Центральной Америки правительство [FROM.GetName] предложило аналогичный путь для наших южноамериканских стран. Цель состоит в создании единого фронта против угрозы Химеры, объединении ресурсов, военной мощи и политической воли для обеспечения выживания. Хотя некоторые идеологии и правительства различаются, ситуация может заставить их изменить свое мнение."
