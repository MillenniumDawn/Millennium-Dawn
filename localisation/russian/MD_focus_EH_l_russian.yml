 EH_any_controlled_state_1000_to_any_portal_TT: "Любой регион, контролируемый §Y[ROOT.GetNameWithFlag]§! или союзником, находится не далее §Y1000 км§! от любого §Rпортала§!."
 EH_drone_mission_unlock_TT: "Открывает категорию решений §YМиссия дронов§!, позволяющую подготовить и отправить разведывательную миссию к ближайшему §Rпорталу§!. Успех операции даст дополнительные сведения о структуре §Rпортала§!, что повысит эффективность войск в бою."
 EH_research_sites_enabled_TT: "Небольшое расстояние до §Rпорталов§! позволяет разместить §Yисследовательские площадки§! достаточно далеко, чтобы было безопасно, и достаточно близко, чтобы собирать больше информации без особого риска.\n\nОдновременно можно содержать до 10 §Yисследовательских площадок§!: каждая даёт бонус к исследованиям для спецпроектов, а также открывает для найма самых квалифицированных §Yучёных§!.\n\nСилы §RХимеры§! могут нападать на §Yисследовательские площадки§!, поэтому их стоит как следует защитить."
