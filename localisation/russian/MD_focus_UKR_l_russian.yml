 ukr_modernize_sov_equipment_s75_orders_tt: "Один полк (§Y2–3§! дивизиона) уходит покупателю за §G0.08§! млрд. Нужно его мнение о нас не ниже §Y10§! или §Y0§!, если он уже покупал с наших складов.\nОбласть, где стоит полк, теряет §R1§! уровень ПВО; покупатель получает §G1§! в одном из своих регионов.\nЕсли мы выберем одну страну Кавказа, две другие получат §R-10§! к мнению о нас."
