 HOL_Naval_Group_naval_equipment_organisation_desc:0 "A Direction des Constructions Navales (DCNS) é uma grande parceira da indústria naval [HOL.GetAdjectiveCap], fornecendo navios de guerra e tecnologia de submarinos de primeira linha à Marinha Real Holandesa. Com décadas de experiência em engenharia naval, a Naval Group fortalece a frota [HOL.GetAdjectiveCap]."
