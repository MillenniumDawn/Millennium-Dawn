 ARM_economy_lavash: "Économie arménienne"
 ARM_economy_lavash_desc: "Notre économie est dans un état déplorable après l'effondrement de l'URSS, et nous avons également traversé une vague de privatisations sévères pour sauver notre budget d'une ruine complète. Peut-être qu'au nouveau millénaire, nous récupérerons tout ce qui nous a été pris."
 ARM_economy_tourism: "Développement du tourisme"
 ARM_economy_tourism_desc: "Le tourisme en Arménie représente une grande partie du budget du pays, et nous avons l'intention de développer et d'investir dans cette industrie."
 ARM_economy_historic: "Reconstruction d'objets historiques"
 ARM_economy_historic_desc: "Les touristes sont facilement attirés par les sites anciens, nous allons donc les restaurer."
 ARM_economy_longest: "Téléphérique le plus long"
 ARM_economy_longest_desc: "Qui n'aime pas admirer de magnifiques paysages ? Les touristes vont certainement adorer."
 ARM_economy_sewani: "Sevani Khorowats"
 ARM_economy_sewani_desc: "Nous avons l'intention de développer sérieusement le secteur gastronomique autour des sites touristiques."
 ARM_economy_hotels: "Question des hôtels"
 ARM_economy_hotels_desc: "Les hôtels doivent se conformer aux normes internationales, sinon le flux de touristes diminuera très rapidement."
 ARM_economy_tobacco: "Problème du tabac arménien"
 ARM_economy_tobacco_desc: "Le commerce du tabac en Arménie occupe une niche importante, apportant des taxes à notre trésor, mais en quantités insuffisantes, de plus, à travers cette industrie, certains pays étrangers peuvent très bien nous influencer par des leviers économiques."
 ARM_economy_shady: "Questionner les affaires douteuses"
 ARM_economy_shady_desc: "L'économie parallèle a un impact négatif sur la collecte des impôts à travers le pays. Il est temps pour nous de résoudre ce grave problème."
 ARM_economy_casino: "Destin des casinos en ligne"
 ARM_economy_casino_desc: "Le dernier bastion de l'économie parallèle, les casinos en ligne, sera enfin fermé, et nous serons libérés de l'influence néfaste des affaires occultes."
 ARM_economy_armenian_card: "Armenian Card"
 ARM_economy_armenian_card_desc: "Armenian Card is an Armenian payment processor and card issuer. 'Armenian Card' CJSC was founded in 2000 by the Central Bank of Armenia and ten commercial banks, with the support of USAID, in order to introduce and develop a new payment accounting system in the banking sector of Armenia"
 ARM_economy_evocabank: "Evocabank"
 ARM_economy_evocabank_desc: "Evocabank is an Armenian commercial bank with headquarters in Yerevan. Now that digitalization has reached a large scale, the bank is ready to become one of the most advanced and technologically advanced banks in Armenia."
 ARM_economy_artsakhbank: "Artsakhbank"
 ARM_economy_artsakhbank_desc: "La banque est située à Artsakh et constitue une sorte d'instrument d'influence économique sur Artsakh."
 ARM_economy_ardshinbank: "Ardshinbank"
 ARM_economy_ardshinbank_desc: "Ardshinbank est une institution financière et de crédit universelle offrant une gamme complète de services bancaires. Les domaines prioritaires incluent le financement de projets pour les grands clients corporatifs, principalement dans les industries stratégiques et le secteur énergétique de l'Arménie, ainsi que le prêt aux petites et moyennes entreprises, l'émission et la gestion de cartes plastiques, la banque en ligne, les transferts internationaux d'argent, ainsi que le prêt hypothécaire pour différents groupes de population et les projets salariaux."
 ARM_economy_inecobank: "Inecobank"
 ARM_economy_inecobank_desc: "INECOBANK est l'une des principales banques du Caucase du Sud, basée à Erevan, en Arménie. La banque propose une gamme complète de services bancaires, y compris des services bancaires numériques pour les particuliers, les PME et les clients corporatifs."
 ARM_economy_vtb: "Laisser entrer VTB russe"
 ARM_economy_vtb_desc: "La banque russe VTB cherche à ouvrir des succursales dans notre pays, et le capital russe sera assez utile pour notre économie."
 ARM_economy_hsbc: "Problème avec HSBC"
 ARM_economy_hsbc_desc: "La banque HSBC est présente dans notre pays depuis les années 90. Maintenant que le secteur bancaire commence à croître, il est temps pour nous de décider quoi en faire."
 ARM_economy_ycrdi: "YCRDI"
 ARM_economy_ycrdi_desc: "The Yerevan Computer Research and Development Institute, is a scientific research institute and the pioneer of the IT and software industry in Armenia. It was founded by the government of USSR in 1956 in Yerevan for the development of computer equipment. The institution is currently involved in the development of computers and automatic control systems for civil and defense purposes. Now this institute is in a terrible financial situation, and we are faced with a choice between selling it to Russia so that the Russian Ministry of Education supports it, or investing financially in our own institution."
 ARM_economy_orange: "UCOM"
 ARM_economy_orange_desc: "Enfin, nous aurons notre propre opérateur télécom national, qui n'appartient pas à un investisseur étranger."
 ARM_economy_veon: "VEON"
 ARM_economy_veon_desc: "VEON Ltd also known as VEON Group, is a multinational telecommunication and digital services company. Headquartered in the Netherlands, the company is publicly traded on the U.S.-based NASDAQ stock exchange. We intend to let this operator into our country to develop communication networks, thereby improving the lives of our citizens."
 ARM_economy_electric_networks: "CJSC « Réseaux électriques d'Arménie »"
 ARM_economy_electric_networks_desc: "La SA « Réseaux électriques d'Arménie » est issue de la fusion de quatre entreprises publiques régionales de distribution et de vente d'énergie électrique. Son activité principale est la distribution et la vente réglementées d'énergie électrique. Son réseau s'étend sur 36 000 km. La distribution d'électricité est réalisée selon des tarifs approuvés par la Commission de régulation des services publics d'Arménie. L'entreprise dessert plus d'un million de clients."
 ARM_economy_hrazdan_thermal: "Centrale thermique de Hrazdan"
 ARM_economy_hrazdan_thermal_desc: "Hrazdan Thermal Power Plant is a natural gas-fired power plant in the northwestern part of Hrazdan city, generating electricity in Armenia. It is one of the largest power plants in Armenia. This power plant was built in 1963-1974, and the first unit became operational in 1966. In its current state, the plant needs to be completely renovated and fully funded, so the question arises again. Transfer it under the control of Russia, or support the station at the expense of its budget"
 ARM_economy_rosneft: "Rosneft-Arménie"
 ARM_economy_rosneft_desc: "We intend to conclude an agreement on the construction of oil facilities with the Russian Company Rosneft. Our oil industry has absolutely zero development, so we are once again forced to rely on our Russian colleagues."
 ARM_economy_techout_mining: "Teghout Mining"
 ARM_economy_techout_mining_desc: "Teghout Mining was established to develop the Teghout deposit in the Lori region, the second largest copper and molybdenum deposit in the Republic of Armenia."
 ARM_economy_ml_mining: "ML Mining"
 ARM_economy_ml_mining_desc: "Une autre entreprise minière sera créée, ce qui aidera à élargir le pool de ressources que nous pouvons extraire dans notre pays."
 ARM_economy_elnor: "Elnor"
 ARM_economy_elnor_desc: "Elnor est une autre entreprise produisant des produits agro-industriels qui commence activement à apparaître sur le marché."
 ARM_economy_techout_more: "Expansion des activités"
 ARM_economy_techout_more_desc: "Les activités de Teghout seront élargies, ce qui est un indicateur clair que la production est à un bon niveau."
 ARM_economy_grand_candy: "Grand Candy"
 ARM_economy_grand_candy_desc: "Grand Candy est l'une des plus grandes entreprises de l'industrie alimentaire. Les produits de cette entreprise reçoivent toujours des critiques positives de la part des clients."
 ARM_economy_agro_support: "Spaika"
 ARM_economy_agro_support_desc: "The company holds a leading position in the field of international freight transportation and has also been the largest producer and exporter of fruit and vegetable products to the CIS countries, Europe and the Persian Gulf."
 ARM_economy_daily_products: "Marianna"
 ARM_economy_daily_products_desc: "Depuis les premiers jours de son fonctionnement, le travail de Marianna repose sur le principe du maintien de produits de haute qualité, et un travail constant et un dévouement sont devenus la clé de l'expansion et du développement de l'entreprise. Nous offrons les meilleurs produits aux meilleurs consommateurs."
 ARM_economy_free_energy: "Énergie verte"
 ARM_economy_free_energy_desc: "L'énergie verte sera toujours l'une des priorités de l'économie arménienne, car le 21e siècle est le siècle de l'énergie verte. N'est-ce pas ?"
 ARM_economy_green_armenia: "Programme Arménie verte"
 ARM_economy_green_armenia_desc: "Notre programme environnemental sera élargi, et notre pays devrait devenir un modèle pour le succès des programmes environnementaux."
 ARM_economy_nuclear: "Énergie nucléaire"
 ARM_economy_nuclear_desc: "Il est temps de se lancer dans le développement de l'énergie nucléaire, nous ne pouvons compter que sur nous-mêmes."
 ARM_economy_nuclear_expand: "Expansion de l'énergie nucléaire"
 ARM_economy_nuclear_expand_desc: "Une centrale nucléaire est toujours une question importante, il est temps de décider quoi en faire."
 ARM_economy_zangezur_copper: "Combinat de cuivre et de molybdène de Zangezur"
 ARM_economy_zangezur_copper_desc: "Zangezur Copper-Molybdenum Combine is the largest mining company in Armenia and one of the 10 leading molybdenum producers in the world. The history of ZCMC goes back to the Soviet era. In the spring of 1952, the combine released its first serial product. Initially, the mine was operated by combining underground and open pit mining. From 1957-1959 the operation was solely open pit mining. Zangezur Copper-Molybdenum Combine is located in the southeastern part of Armenia, in the city of Kajaran of the Syunik region of Armenia, 30 km west of the regional center Kapan and about 350 km from the capital Yerevan."
 ARM_economy_yerevan_factori_restore: "Usine de confiserie et de macaronis d'Erevan"
 ARM_economy_yerevan_factori_restore_desc: "L'usine de confiserie et de macaronis d'Erevan était une entreprise industrielle basée en Arménie. Construite en 1933, les départements de confiserie et de macaronis ont été fusionnés en 1951. En 1977, l'usine est devenue le premier producteur de chewing-gum en Union soviétique, bien que le chewing-gum ne contienne pas de chicle. L'usine a presque cessé sa production lors de l'effondrement de l'Union soviétique dans les années 1990 et a été ensuite privatisée et restaurée par la société Grand Candy."
 ARM_economy_yerevan_ararat_factory: "Usine de brandy Ararat d'Erevan"
 ARM_economy_yerevan_ararat_factory_desc: "L'usine de brandy, vin et vodka Ararat d'Erevan, officiellement connue sous son célèbre nom de marque Noy, est une entreprise leader de production de brandy arménien à Erevan, en Arménie."
 ARM_economy_yerevan_destiny_brandy: "Compagnie de brandy d'Erevan"
 ARM_economy_yerevan_destiny_brandy_desc: "La Compagnie de brandy d'Erevan, communément connue sous sa célèbre marque 'ArArAt', est la principale entreprise d'Arménie pour la production de cognac. Fondée en 1887, pendant la période de l'Empire russe. Après la soviétisation de l'Arménie, l'usine est devenue une entreprise d'État. En 1999, le gouvernement de l'Arménie indépendante a vendu l'usine à la société française Pernod Ricard pour les boissons distillées. La variété des produits de cognac de l'entreprise est étiquetée et promue sous le nom d'ArArAt."
 ARM_economy_eraz: "ErAZ"
 ARM_economy_eraz_desc: "ErAZ, ou Yerevanskiy Avtomobilny Zavod, était un constructeur automobile arménien à Erevan, en Arménie, principalement connu pour avoir produit la camionnette RAF-977K de 1966 à 1996. Les plans pour établir l'usine ErAZ ont été lancés le 31 décembre 1964 par le Conseil des ministres de la République socialiste soviétique d'Arménie. Le personnel initial a été formé à l'usine d'autobus de Riga en Lettonie et à l'UAZ en Russie. ErAZ a été privatisé en 1995."
 ARM_economy_kotayk: "Brasserie Kotayk"
 ARM_economy_kotayk_desc: "La brasserie Kotayk est une entreprise brassicole fondée en 1974 à Abovyan, dans la province de Kotayk, en Arménie."
 ARM_economy_ashvar: "Usine de vin Avshar"
 ARM_economy_ashvar_desc: "Avshar Wine Factory, is one of the leading producers of alcoholic drinks in Armenia, located in the village of Avshar of Ararat Province. It was founded in 1968 to process the grapes of the fertile villages of Ararat plain, one of Armenia's leading agricultural areas. Armenian traditions and folklore suggest that wine production in the region dates back to Noah planting grapes upon his descent from Mount Ararat in the Book of Genesis."
 ARM_economy_hrazdan_cement: "Ciment Hrazdan"
 ARM_economy_hrazdan_cement_desc: "Hrazdan Cement CJSC est une société par actions fermée située dans la ville de Hrazdan, le centre provincial de la province de Kotayk, en Arménie. Fondée en 1970 sous le nom de 'Hrazdan Cement Factory' par le gouvernement soviétique."
 ARM_economy_multi_group: "Multi Group Stone"
 ARM_economy_multi_group_desc: "Multi Group Stone CJSC a été créé par 'Multi Group Concern' dans la ville d'Abovyan, en Arménie. L'entreprise est impliquée dans l'extraction et le traitement de minéraux, c'est-à-dire l'extraction de blocs de pierre naturelle, de travertin, dans sa propre carrière et le cycle complet de fabrication et de traitement final des carreaux à l'usine."
 ARM_economy_alrosa: "Cooperation With ALROSA"
 ARM_economy_alrosa_desc: "Nous avons l'intention d'introduire cette entreprise russe sur notre marché afin d'améliorer la situation financière et en ressources de notre république."
 ARM_economy_gazprom: "Coopération avec Gazprom"
 ARM_economy_gazprom_desc: "Nous avons l'intention d'introduire cette entreprise russe sur notre marché afin d'améliorer la situation financière et en ressources de notre république."
 ARM_economy_armenal: "RUSAL-Armenal"
 ARM_economy_armenal_desc: "Nous avons l'intention d'introduire cette entreprise russe sur notre marché afin d'améliorer la situation financière et en ressources de notre république."
 ARM_economy_mts: "Coopération avec MTS"
 ARM_economy_mts_desc: "Nous avons l'intention de lancer cette entreprise russe sur le marché des télécommunications, car elle a fait ses preuves positivement sur le marché russe."
 ARM_government_subsid_it_sphere: "Subvention gouvernementale du secteur IT"
 ARM_government_subsid_it_sphere_desc: "Il est temps de développer notre secteur IT national, le pays a besoin de technologies modernes et de spécialistes IT modernes."
 ARM_invite_microsoft: "Inviter Microsoft"
 ARM_invite_microsoft_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_invite_oracle: "Inviter Oracle"
 ARM_invite_oracle_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_nvidia_invite: "Inviter NVIDIA"
 ARM_nvidia_invite_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_adobe_invite: "Inviter Adobe"
 ARM_adobe_invite_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_invite_amd: "Inviter AMD"
 ARM_invite_amd_desc: "$ARM_invite_it_corp_shared_desc$"
 ARM_economy_deep: "Exploitation des ressources profondes"
 ARM_economy_deep_desc: "Les sous-sols de l'Arménie contiennent de nombreuses ressources qui étaient auparavant inaccessibles en raison de technologies faibles, mais nous avons maintenant l'opportunité de libérer tout le potentiel de ressources de notre pays."
 ARM_economy_heavy: "Industries lourdes arméniennes"
 ARM_economy_heavy_desc: "De nouvelles ressources ont donné un élan au développement de notre industrie, maintenant l'industrie lourde en Arménie n'est pas un conte de fées, c'est une réalité."
 ARM_economy_new_uranium: "Nouvelles méthodes pour l'extraction d'uranium"
 ARM_economy_new_uranium_desc: "De nouvelles méthodes d'extraction d'uranium ont été découvertes par nos industriels, et nous sommes prêts à développer davantage cette industrie."
 ARM_economy_steel: "Usines d'acier"
 ARM_economy_steel_desc: "Les énormes réserves que nous avons découvertes nécessitent de nouvelles usines pour leur développement, tant pour les industries civiles que militaires."
 ARM_economy_chemical: "Usines chimiques lourdes"
 ARM_economy_chemical_desc: "De nouvelles industries émergent comme des champignons après la pluie, et l'industrie chimique lourde commence à se développer en Arménie."
 ARM_economy_metal: "Alliages métalliques"
 ARM_economy_metal_desc: "Nous allons élargir notre focus sur la production d'alliages métalliques, ce qui donnera un coup de pouce nécessaire à notre industrie lourde."
 ARM_economy_heavy_ebat: "Coopérative des industries lourdes arméniennes"
 ARM_economy_heavy_ebat_desc: "Nous sommes prêts à combiner toutes les réalisations de notre industrie lourde en une seule coopérative."
 ARM_economy_wto: "Rejoindre l'OMC"
 ARM_economy_wto_desc: "Rejoindre l'Organisation mondiale du commerce nous aidera à nous intégrer et à nous développer davantage dans l'économie mondiale, et apportera la prospérité à notre nation et à notre peuple."
 ARM_higher_educ_sph_development: "Développement de l'enseignement supérieur"
 ARM_higher_educ_sph_development_desc: "L'enseignement supérieur dans notre pays est dans un état déplorable, mais nous avons l'intention de changer cela en attirant les meilleures institutions éducatives et centres mondiaux pour un accès diversifié à diverses universités mondiales."
 ARM_tumo_project: "Centre Tumo pour les technologies créatives"
 ARM_tumo_project_desc: "Le TUMO Center for Creative Technologies est un programme éducatif gratuit destiné aux adolescents de 12 à 18 ans, spécialisé dans la technologie et le design, et dont les cours sont dispensés dans différents centres et pôles TUMO."
 ARM_support_aua: "Université américaine d’Arménie"
 ARM_support_aua_desc: "Nous considérons l’éducation américaine comme l’une des meilleures au monde, et nous voulons que nos citoyens y aient accès."
 ARM_erasmus_coop: "Erasmus+ Arménie"
 ARM_erasmus_coop_desc: "Les normes éducatives européennes sont toujours pertinentes et prioritaires pour nous, nous sommes donc prêts à collaborer avec les principales universités de l'UE."
 ARM_ayb_school: "École Ayb"
 ARM_ayb_school_desc: "L'école Ayb est un établissement scolaire privé situé à Erevan, en Arménie, et fondé par la Fondation éducative Ayb. Son nom, Ayb, provient de la première lettre de l'alphabet arménien. Il s'agit d'une organisation à but non lucratif, enregistrée sous le nom de Fondation Ayb Learning Hub. Sa devise est « Savoir et créer ». L'école est administrée par un conseil d'administration présidé par Ruben Arutynyan. Le directeur est David Sahakyan."
 ARM_educ_coop_brit: "Collaboration avec Cambridge"
 ARM_educ_coop_brit_desc: "L'éducation de Cambridge est très appréciée dans le monde, et nous avons l'intention de créer un accès à celle-ci dans notre pays."
 ARM_armenia_mgu: "Coopération avec l'Université d'État de Moscou"
 ARM_armenia_mgu_desc: "Nous avons l'intention d'ouvrir une antenne de l'Université d'État de Moscou dans notre pays afin que nos citoyens puissent recevoir une éducation russe et l'appliquer dans l'espace post-soviétique."
 ARM_economy_category: "Économie arménienne"
 ARM_economy_category_desc: "Pendant l'§RUnion soviétique§!, l'économie arménienne £text_icon_armdram §Yarménienne§! était orientée vers l'industrie. L'§Reffondrement de l'URSS§! a radicalement changé cette situation. [ARM.GetFlag]§YArménie§! est passée d'un grand secteur industriel à une agriculture à petite échelle. La situation politique et économique du pays dans les années 1990 a forcé le pays à contracter des prêts pour que l'économie £text_icon_armdram §Yéconomie§! ne stagne pas ou, §Rpire encore§!, ne commence à §Rdécliner§!."
 ARM_economy_russian_tourists: "Stimuler l'afflux de touristes §Yrusses§! [SOV.GetFlag]"
 ARM_economy_tourism_integrate_azer: "Intégration des stations balnéaires §Yazerbaïdjanaises§! [AZE.GetFlag]"
 ARM_economy_tourism_integrate_abkhazia: "Intégration des stations balnéaires §Yabkhazes§! [ABK.GetFlag]"
 ARM_economy_shadow_economy_destroy: "Poursuivre la lutte contre l'§Réconomie parallèle§!"
 ARM_economy_shady_idea: "Économie parallèle"
 ARM_economy_shady_idea4: "Économie parallèle faible"
 ARM_Eraz_idea: "ErAZ"
 ARM_multigroup_idea: "Multigroup"
 ARM_armbel_trade_center: "Maison de commerce arméno-biélorusse"
 ARM_armbel_trade_center_desc: "Nous pouvons établir la maison de commerce arméno-biélorusse pour accroître la production agricole et alimentaire ainsi que le commerce entre nos pays.\n--------------\nCet esprit national sera §Rretiré§! si nous entrons en guerre contre le Bélarus ou si son opinion à notre égard devient négative."
 NKR_gaz_energy_problems: "Faible gazéification"
 NKR_corruption_in_police_idea: "Police corrompue"
 ARM_new_decision_economic_unlock_tt: "£text_icon_armdram §YArmenian Economy§!: §YUnlocks§! New Decisions"
 ARM_tourism_expand_TT: "£text_icon_armdram §YRevenus du tourisme§! seront §Gaugmentés§!"
 ARM_tourism_expand_territories_ABK_TT: "£text_icon_armdram Nous intégrons les §Ystations balnéaires abkhazes§! [ABK.GetFlag]"
 ARM_tourism_expand_territories_AZE_TT: "£text_icon_armdram Nous intégrons les §Ystations balnéaires azerbaïdjanaises§! [AZE.GetFlag]"
 ARM_Economy_unfluency_ycrdi_SOV_TT: "[SOV.GetFlag] Multiplicateur d'§Hinfluence§! russe en §Y[ROOT.GetNameWithFlag]§! : §R+10 %§!"
 ARM_Economy_unfluency_it_USA_TT: "[USA.GetFlag] Multiplicateur d'§Hinfluence§! américaine en §Y[ROOT.GetNameWithFlag]§! : §R+10 %§!"
 ARM_Economy_unfluency_armbel_BLR_TT: "[BLR.GetFlag] Multiplicateur d'§Hinfluence§! bélarussienne en §Y[ROOT.GetNameWithFlag]§! : §R+10 %§!"
 ARM_Leave_NGO_USA_TT: "[USA.GetFlag] Multiplicateur d'§Hinfluence américaine§! dans §Y[ROOT.GetNameWithFlag]§! : §G-15 %§!\n"
 ARM_Zhirair_SOV_TT: "[SOV.GetFlag] Multiplicateur d'§Hinfluence russe§! dans §Y[ROOT.GetNameWithFlag]§! : §G-15 %§!\n"
 ARM_Zhirair_UKR_BLR_TT: "[ARM.GetFlag] Multiplicateur d'§Hinfluence arménienne§! dans §Y[ROOT.GetNameWithFlag]§! : §R-15 %§!\n"
 arm_economic.2.t: "Le sort de la banque HSBC"
 arm_economic.2.d: "La banque HSBC opère sur notre territoire depuis les années 90. Maintenant que notre économie se redresse, il est temps de décider quoi faire de cette banque, car nous sommes désormais prêts à nous passer d’autant d’entreprises étrangères qu’auparavant."
 arm_economic.2.a: "Ardshinbank va racheter des succursales bancaires."
 arm_economic.2.b: "Qu'ils restent en Arménie."
 arm_economic.3.t: "Le sort de l’YCRDI"
 arm_economic.3.d: "The Yerevan Scientific Research Institute of Mathematical Machines, a famous institute founded during the Soviet era, is now in decline and it is important for us to decide its fate. Russia offers to acquire ownership of it from us, or we will invest in the reorganization of the Institute with our own finances."
 arm_economic.3.a: "Nous accepterons l'offre de Moscou."
 arm_economic.3.b: "Nous sauverons l’institut."
 arm_economic.4.t: "Le sort de VEON"
 arm_economic.4.d: "VEON est prêt à entrer pleinement sur le marché des télécommunications de notre pays, mais nous avons la possibilité de les racheter et de les transférer à notre opérateur national. Quelle est la priorité pour nous, les investissements étrangers ou le soutien aux entreprises nationales ?"
 arm_economic.4.a: "Ne les touchons pas."
 arm_economic.4.b: "Nous racheterons leurs actifs."
 arm_economic.5.t: "Centrale thermique de Hrazdan"
 arm_economic.5.d: "La centrale thermique de Hrazdan est la plus grande centrale thermique de notre pays. Malheureusement, le moment est venu de décider de son sort. Soit nous la plaçons entièrement sous le contrôle de Gazprom russe, soit nous investissons nos propres finances pour la soutenir."
 arm_economic.5.a: "Laissons Gazprom s’en charger."
 arm_economic.5.b: "Nous continuerons à investir."
 arm_economic.6.t: "Le sort de Shoghakn"
 arm_economic.6.d: "L’usine de Shoghakn a été fondée en 1971, et maintenant, une entreprise israélienne créée par un compatriote en revendique la propriété. Nous devons décider si nous investirons dans l’usine ou si nous la cédons à un propriétaire privé."
 arm_economic.6.a: "Laissons-les la prendre."
 arm_economic.6.b: "Nous continuerons à investir."
 arm_economic.7.t: "Centrale nucléaire"
 arm_economic.7.d: "Notre pays doit choisir à qui confier la construction d’une nouvelle centrale nucléaire. La Russie, les États-Unis, ou peut-être prendrons-nous le risque d’investir nous-mêmes dans un projet aussi complexe ?"
 arm_economic.7.a: "Les États-Unis peuvent s’en charger."
 arm_economic.7.b: "La Russie est experte en la matière."
 arm_economic.7.c: "Les Arméniens sont de véritables experts nucléaires."
 arm_economic.8.t: "Faillite de l’usine de Shoghakn"
 arm_economic.8.d: "Le propriétaire de l'usine Shoghakn a officiellement annoncé la fermeture de l'usine pour cause de faillite."
 arm_economic.8.a: "Comment avons-nous laissé cela arriver ?"
 arm_economic.9.t: "Combinat de cuivre et molybdène de Zangezur"
 arm_economic.9.d: "Nous devons maintenant décider de son avenir, car il doit être entièrement reconstruit. La Russie propose de le faire à ses frais et d’en prendre le contrôle, ou nous le reconstruirons nous-mêmes."
 arm_economic.9.a: "Nous pouvons gérer cela."
 arm_economic.9.b: "Donnons-le à la Russie."
 arm_economic.10.t: "ErAZ"
 arm_economic.10.d: "ErAZ was an Armenian automobile manufacturer in Yerevan, Armenia, mostly known for producing the van RAF-977K from 1966 to 1996. Plans to establish the ErAZ factory came about on December 31, 1964, by the Council of Ministers of the Armenian Soviet Socialist Republic. The fate of the plant is hanging in the balance, either we will privatize it for a Russian Investor, or we will rebuild it on our own."
 arm_economic.10.a: "Nous pouvons gérer cela."
 arm_economic.10.b: "Donnons-le à la Russie."
 arm_economic.11.t: "Brasserie Kotayk"
 arm_economic.11.d: "Kotayk Brewery was founded in 1974 as a state-owned enterprise by the government of the Armenian Soviet Socialist Republic, with a limited scale of production. After the completion of the entire equipment, the factory started large-scale production in 1978. After the dissolution of the Soviet Union, Gagik Tsarukyan took over the brewery in 1995 and started to produce beer under the brands Kotayk and Artsakh. In 1997, Castel Group became the major shareholder of the brewery through an investment of US$17 million, being one of the earliest foreign investors in Armenia. Now we have to decide whether to privatize the plant or subordinate it to the state."
 arm_economic.11.a: "Nous pouvons gérer cela."
 arm_economic.11.b: "Nous la donnerons pour la privatisation."
 arm_economic.12.t: "Usine de brandy d’Erevan Ararat"
 arm_economic.12.d: "Yerevan Ararat Brandy Factory, officially known as the Yerevan Ararat Brandy-Wine-Vodka Factory, commonly known by its famous brand Noy, is a leading Armenian brandy production company in Yerevan, Armenia. The factory is in a sad state, and a private investor wants to restore it by privatizing it completely, or the state will take care of the famous factory."
 arm_economic.12.a: "Nous pouvons gérer cela."
 arm_economic.12.b: "Nous la donnerons pour la privatisation."
 arm_economic.13.t: "Compagnie de brandy d’Erevan"
 arm_economic.13.d: "Yerevan Brandy Company, commonly known with its famous brand \"ArArAt\", is the leading enterprise of Armenia for the production of cognac. It was founded in 1887, during the period of the Russian Empire. After the Sovietization of Armenia, the factory became a state-owned enterprise. In 1999, the government of independent Armenia sold the factory to the French Pernod Ricard company for distilled beverages. The variety of the company's cognac products are labeled and publicized as ArArAt. Perhaps we will want to change our decision and take control of this plant, or we will finally decide to leave the plant in the possession of a French investor."
 arm_economic.13.a: "Nous reprendrons l’usine."
 arm_economic.13.b: "Laissons-la aux Français."
 arm_economic.14.t: "ErAZ"
 arm_economic.14.d: "Malheureusement, l’usine ErAZ n’a pas pu concurrencer sur le marché mondial et a dû déclarer faillite. Devrions-nous envisager notre propre tentative pour relancer l’usine ?"
 arm_economic.14.a: "Non."
 arm_economic.14.b: "Nous pouvons gérer cela."
 arm_economic.15.t: "Nouveaux acteurs dans le secteur informatique national"
 arm_economic.15.d: "Notre industrie informatique s’est enrichie de nouvelles entreprises qui stimuleront la croissance de notre secteur informatique."
 arm_economic.15.a: "Oui"
 arm_economic.16.t: "Nouveaux acteurs dans le secteur informatique national"
 arm_economic.16.d: "Notre industrie informatique s’est enrichie de nouvelles entreprises qui stimuleront la croissance de notre secteur informatique."
 arm_economic.16.a: "Oui"
 arm_economic.17.t: "Antenne de l’UMM en Arménie"
 arm_economic.17.d: "L'Université d'État de Moscou (MSU) a conclu un accord avec le ministère de l'Éducation arménien pour ouvrir une antenne en Arménie. Les citoyens arméniens auront désormais un large accès aux programmes de cette université russe."
 arm_economic.17.a: "Super"
 arm_economic.17.b: "D’accord"
 arm_economic.18.t: "Ouverture de Tumo"
 arm_economic.18.d: "Tumo was originally conceived as a center for post-secondary education for teenagers. Sam Simonyan, an American entrepreneur of Armenian origin, and Silva Simonyan became the founders of the center. Now our educational system has been expanded with another wonderful institution. The grand opening of the Tumo Center took place and was accompanied by a concert by rock musicians Serj Tankian and Dorians."
 arm_economic.18.a: "Super"
 arm_economic.19.t: "Université américaine d’Arménie"
 arm_economic.19.d: "The American University of Armenia was founded in the 1990s, and with the completion of the Paramaz Avedisyan Building it is now a fully realized institution. Armenian citizens can access American-standard education and earn internationally recognized degrees."
 arm_economic.19.a: "Super"
 arm_economic.19.b: "D’accord"
 arm_economic.20.t: "ERASMUS+ en Arménie"
 arm_economic.20.d: "L’Arménie a rejoint le programme ERASMUS+ et a commencé un échange complet d’étudiants avec des institutions éducatives européennes, en particulier avec les françaises et allemandes, leaders dans le programme d’échange."
 arm_economic.20.a: "Super!"
 arm_economic.20.b: "D’accord"
 arm_economic.21.t: "École Ayb"
 arm_economic.21.d: "Depuis sa création, la Fondation éducative Ayb a mis en place des cours avancés pour les lycéens, établi des laboratoires éducatifs modernes dans les écoles de différentes régions d’Arménie, organisé des compétitions scolaires internationales prisées en Arménie et en Artsakh, effectué des formations pour les enseignants, développé des méthodologies d’enseignement, traduit certains des meilleurs manuels scolaires au monde en arménien, développé et testé des systèmes d’uniformité de l’éducation et de gestion de la structure éducative, etc. Sur la base de ces cinq années d’expérience dans tous ces programmes et initiatives éducatifs, il a été décidé de créer une nouvelle école arménienne répondant à toutes les exigences éducatives modernes et basée sur les meilleures réalisations de l’écriture arménienne."
 arm_economic.21.a: "Super!"
 arm_economic.22.t: "Cambridge en Arménie"
 arm_economic.22.d: "L’Arménie a entamé une coopération avec l’Université de Cambridge pour permettre aux citoyens arméniens de recevoir une éducation britannique et d’en bénéficier au même titre que les autres étudiants britanniques."
 arm_economic.22.a: "Super!"
 arm_economic.22.b: "D’accord"
 arm_economic.23.t: "AmeriaBank"
 arm_economic.23.d: "Ameriabank est la plus ancienne banque d’Arménie. Grâce au développement du système bancaire, la banque pourra désormais avoir un impact plus positif sur le développement de notre économie."
 arm_economic.23.a: "Super!"
 arm_economic.1.t: "La question du tabac"
 arm_economic.1.d: "Les compagnies de tabac occupent une large part de l’économie de notre État, malheureusement elles se portent trop bien. De plus, certains pays étrangers pourraient influencer notre pays à travers elles. Peut-être est-il temps de régler cette question."
 arm_economic.1.a: "Nous les rachèterons."
 arm_economic.1.b: "Nous utiliserons la police pour les saisir."
 arm_economic.1.c: "Nous utiliserons les forces spéciales de l’armée pour les saisir."
 arm_economic.1.f: "Accepter leur pot-de-vin"
 NKR_economy_start: "Économie au nouveau millénaire"
 NKR_economy_start_desc: "Notre belle région entre dans un nouveau millénaire, nous venons d’obtenir notre indépendance et nous faisons encore face aux conséquences du conflit et de la guerre pour notre indépendance."
 NKR_economy_police: "Réorganisation de la police"
 NKR_economy_police_desc: "Nous avons l’intention de mener une réforme majeure de la police, d’expulser tous les corrompus de là-bas, et de renouveler complètement le personnel."
 NKR_economy_corruption: "Expulser les officiels corrompus"
 NKR_economy_corruption_desc: "Tous les fonctionnaires corrompus recevront un ultimatum. Nul n'échappera à la justice. Nous entendons purger entièrement les agences gouvernementales de leurs corrompus."
 NKR_economy_nalog: "Réforme fiscale"
 NKR_economy_nalog_desc: "Nous allons réduire la pression fiscale sur nos citoyens et alléger la pression sur notre économie."
 NKR_economy_construction: "Faciliter la délivrance des permis de construire"
 NKR_economy_construction_desc: "Nous avons l’intention de simplifier la procédure de délivrance des permis de construire. Arrêtons d’accabler les citoyens de bureaucratie ; s’ils en sont capables, qu’ils construisent !"
 NKR_economy_land: "Distribution des terres sans propriétaire"
 NKR_economy_land_desc: "Nous sommes prêts à littéralement distribuer des terres à nos citoyens pour qu’ils puissent y créer ce qu’ils veulent, y compris leurs propres entreprises."
 NKR_economy_selhoz: "Soutien aux producteurs agricoles"
 NKR_economy_selhoz_desc: "Le secteur agricole sera toujours l’une de nos plus grandes industries, et nous avons l’intention de le soutenir financièrement en permanence."
 NKR_economy_antimonopol: "Dissoudre les autorités antimonopole"
 NKR_economy_antimonopol_desc: "Nous dissoudrons l’autorité antimonopole, il n’est pas nécessaire de réguler la concurrence dans notre petit État."
 NKR_economy_gas: "Mener à bien la gazéification"
 NKR_economy_gas_desc: "Nous mènerons un programme de gazéification à grande échelle dans toute la république pour que les citoyens aient toujours accès au gaz !"
 NKR_economy_fermers: "Réduire les impôts pour les agriculteurs"
 NKR_economy_fermers_desc: "Nous voulons stimuler encore plus l’industrie agricole, et pour cela, nous avons l’intention de réduire les impôts pour tous ceux impliqués dans les activités agricoles."
 NKR_economy_copper_gold: "Investissements dans le cuivre et l’or"
 NKR_economy_copper_gold_desc: "Il n’y a peut-être pas beaucoup de ressources dans notre république, mais nous avons l’intention d’utiliser même ce que nous avons pour le bénéfice de l’économie."
 NKR_economy_gornaya: "Industrie minière"
 NKR_economy_gornaya_desc: "Nous avons l’intention d’investir dans l’industrie minière, car même dans notre position, nous pouvons facilement développer les ressources sur le territoire de notre république."
 NKR_economy_support_local: "Soutenir les producteurs locaux"
 NKR_economy_support_local_desc: "Le soutien de nos fabricants est la principale priorité de notre programme économique, nous ne pouvons pas dépendre de produits importés en grande quantité."
 NKR_economy_invest_climate: "Soutien au climat d’investissement"
 NKR_economy_invest_climate_desc: "Bien que nous soyons sceptiques à l’égard des produits étrangers, nous continuerons d’essayer de créer un climat d’investissement, et les investissements ne seront pas de trop."
 NKR_economy_forest: "Industrie forestière"
 NKR_economy_forest_desc: "Nous avons besoin de sources supplémentaires de carburant et d’énergie. L’industrie forestière, complémentaire à toutes les autres, peut être assez efficace."
 NKR_economy_boring_10: "Croissance ennuyeuse de 10 %"
 NKR_economy_boring_10_desc: "Our economy is growing at about 10% a year, not the biggest growth we would like, but our citizens value this stability more than sky-high promises."
 NKR_safe_start: "Sur la garde de l’Artsakh"
 NKR_safe_start_desc: "Notre patrie est constamment en danger. Nous devons réfléchir attentivement à la protection de nos frontières et nous souvenir que notre sécurité repose à la fois sur une économie forte et sur le courage de nos soldats et de nos policiers."
 NKR_safe_army: "Armée de défense de l’Artsakh"
 NKR_safe_army_desc: "L’Armée de défense de l’Artsakh était la force de défense de la République autoproclamée de l’Artsakh. Établie en 1992, elle a unifié des unités de défense désorganisées formées au début des années 1990."
 NKR_planes: "Nos avions"
 NKR_planes_desc: "Notre armée a désespérément besoin d’avions, nous devons en faire la demande à l’Arménie."
 NKR_safe_special_forces: "Forces spéciales de l’Artsakh"
 NKR_safe_special_forces_desc: "En plus des soldats ordinaires, comme toute armée moderne, nous devons avoir des forces spéciales dans nos rangs pour accomplir les tâches les plus dangereuses."
 NKR_safe_univer: "Collège militaire Kristapor Ivanyan"
 NKR_safe_univer_desc: "Le Collège militaire Kristapor Ivanyan était une institution éducative militaire basée à Stepanakert et gérée par l’Armée de défense de l’Artsakh."
 NKR_safe_anti_air: "Force de défense aérienne"
 NKR_safe_anti_air_desc: "À l’image des forces armées arméniennes, nous créerons également nos propres forces de défense aérienne."
 NKR_safe_mo_ra: "Université d’aviation militaire Armenak Khanperyants"
 NKR_safe_mo_ra_desc: "Nous avons l’intention d’envoyer nos cadets étudier dans cette université arménienne, car la clé d’une armée forte est un personnel militaire formé."
 NKR_safe_vazgen: "Université militaire Vazgen Sargsyan"
 NKR_safe_vazgen_desc: "Nous avons l’intention d’envoyer nos cadets étudier dans cette université arménienne, car la clé d’une armée forte est un personnel militaire formé."
 NKR_safe_aspar: "Armes Aspar"
 NKR_safe_aspar_desc: "Nous avons l’intention d’acheter les produits de cette entreprise arménienne pour les besoins de nos forces armées."
 NKR_safe_davisur: "Davisur"
 NKR_safe_davisur_desc: "Nous avons l’intention d’acheter les produits de cette entreprise arménienne pour les besoins de nos forces armées."
 NKR_safe_full_integrate_army: "Intégration complète avec les forces armées arméniennes"
 NKR_safe_full_integrate_army_desc: "Nous avons l’intention de renforcer au maximum notre intégration avec les forces armées arméniennes, car seules nos forces combinées pourront repousser l’attaque de n’importe quel ennemi."
 NKR_safe_mvd: "Ministère des Affaires intérieures"
 NKR_safe_mvd_desc: "Notre sécurité repose non seulement sur les forces armées, mais aussi sur la police et les services de sécurité. Nous devons veiller à ce qu'ils reçoivent l'attention et les ressources nécessaires."
 NKR_safe_border_troops: "Troupes frontalières"
 NKR_safe_border_troops_desc: "Les troupes frontalières sont aussi vitales que l'aviation. Nos ennemis ne connaissent aucun répit, et nos frontières doivent être sous surveillance constante."
 NKR_safe_police_troops: "Troupes de police"
 NKR_safe_police_troops_desc: "S'inspirant du modèle des forces de l'ordre arméniennes, nos forces de police maintiennent l'ordre intérieur et sont prêtes à intervenir en cas d'urgence."
 NKR_safe_nss: "National Security Service of Artsakh"
 NKR_safe_nss_desc: "Ce n’est pas seulement la police qui doit protéger le pays, mais aussi les services spéciaux, que le service de sécurité nationale gère avec succès."
 NKR_we_are_at_war: "Nous sommes en guerre !"
 NKR_we_are_at_war_desc: "L’Azerbaïdjan nous a attaqués, maintenant nous devons combattre !"
 NKR_scorched_earth: "Terre brûlée"
 NKR_scorched_earth_desc: "Nous devons nous préparer à détruire certaines de nos industries pour qu’elles ne puissent pas être utilisées par l’Azerbaïdjan."
 NKR_plant_minefields: "Poser des champs de mines"
 NKR_plant_minefields_desc: "Même si nous nous retirons de certains territoires, nous devons poser des mines partout pour qu’ils ne puissent pas les traverser facilement."
 NKR_final_defense: "Défense finale"
 NKR_final_defense_desc: "L’heure de la défense finale est venue. Mieux vaut mourir debout que vivre à genoux."
 ARM_landmines: "Mines d'Artsakh"
 mines_lostprov_tt: "Des mines terrestres seront posées dans les territoires perdus !"
 NKR_last_defense: "Dernière défense"
 arm_dashnak.1.t: "Our Alliance with Kocharyan"
 arm_dashnak.1.d: "Kotcharian, même après avoir quitté son poste de chef d’État, conserve une influence sérieuse sur les élites et la société arméniennes. Nous pourrions négocier avec lui pour le rallier à notre cause, ou nous en débarrasser définitivement."
 arm_dashnak.1.a: "Nous avons un nouvel ami !"
 arm_dashnak.1.b: "Pas question"
 arm_dashnak.2.t: "L’Arménie souhaite élargir la coopération militaire"
 arm_dashnak.2.d: "La délégation arménienne nous a officiellement informés de leur souhait d’élargir la coopération militaire entre nos pays. Selon eux, cette étape est bénéfique pour les deux parties. Devrions-nous accepter ?"
 arm_dashnak.2.a: "Bien sûr !"
 arm_dashnak.2.b: "Cela ne nous intéresse pas."
 arm_dashnak.3.t: "La Russie a accepté"
 arm_dashnak.3.d: "Les délégations russe et arménienne ont signé des accords pour élargir la coopération militaire, incluant des exercices militaires conjoints dans un avenir proche ! C’est une nouvelle étape dans les relations entre les deux pays."
 arm_dashnak.3.a: "Génial !"
 arm_dashnak.4.t: "La Russie a refusé"
 arm_dashnak.4.d: "La Russie nous a notifié son refus. Selon eux, ils ne sont pas intéressés par le développement de la coopération militaire avec nous."
 arm_dashnak.4.a: "Nous trouverons un autre allié !"
 ARM_in_between_empires: "Entre l'aigle et le lion"
 ARM_in_between_empires_desc: "Tout au long de l'histoire, l'Arménie a été déchirée par des empires qui ont tenté de dominer son territoire. Les anciens empires ont reçu de nouveaux noms et apparences, mais l'essence reste la même. Nous devrons trouver un terrain d'entente avec eux pour survivre."
 ARM_relations_with_europe: "Relations avec l'Europe"
 ARM_relations_with_europe_desc: "Nous devons nous concentrer sur nos relations avec l'Europe et déterminer nos relations actuelles et futures avec elle."
 ARM_relations_with_russia: "Relations avec la Russie"
 ARM_relations_with_russia_desc: "De nombreuses personnes en Arménie ont une opinion très polarisée sur la Russie. Indépendamment de l'opinion publique, nous devons construire nos relations avec la Russie en fonction de nos intérêts."
 ARM_partn_coop_agrem: "Partenariat et coopération"
 ARM_partn_coop_agrem_desc: "Nous entamons notre long voyage de coopération avec l'Union européenne, et cet accord marquera le début de notre progression vers l'intégration dans la grande famille européenne."
 ARM_open_action_plan: "Plan d'action d'ouverture"
 ARM_open_action_plan_desc: "Nous sommes plus proches que jamais en termes diplomatiques pour une coopération avec l'Union européenne."
 ARM_arm_eu_compr_agre: "Accord de partenariat renforcé"
 ARM_arm_eu_compr_agre_desc: "Notre partenariat avec l'Union européenne atteint des sommets sans précédent, peut-être sommes-nous à un pas de rejoindre la famille européenne amicale."
 ARM_join_council_of_europe: "Rejoindre le Conseil de l'Europe"
 ARM_join_council_of_europe_desc: "Nous avons l'intention de coopérer avec le Conseil de l'Europe, en tant que l'un des organes politiques européens, que nous considérons comme important, y compris pour nous-mêmes."
 ARM_standing_comitee_eu_integr: "Comité permanent pour l’intégration européenne"
 ARM_standing_comitee_eu_integr_desc: "L’intégration dans la communauté européenne est notre voie, et nous avons l’intention d’élargir notre participation aux organisations, documents et autres liens entre nous et l’UE."
 ARM_open_up_for_ngos: "Ouvrir les portes aux ONG"
 ARM_open_up_for_ngos_desc: "Nous avons l'intention d'autoriser les ONG européennes dans notre pays pour améliorer le développement de notre société civile et démocratique."
 ARM_instanbul_conventions_discuss: "Discussions sur la Convention d'Istanbul"
 ARM_instanbul_conventions_discuss_desc: "Il est temps de décider enfin du sort des citoyens LGBT dans notre pays."
 ARM_prep_article_fortynine: "Préparer l'Arménie pour l'article 49"
 ARM_prep_article_fortynine_desc: "Enfin, nous approchons de l'étape vers laquelle nous nous dirigeons depuis longtemps, peut-être que cette année nous deviendrons membres de l'Union européenne."
 ARM_prop_against_west_values: "Propagande contre les valeurs 'européennes'"
 ARM_prop_against_west_values_desc: "Les valeurs européennes du 21e siècle nous sont étrangères, elles entraîneront notre société vers la dégradation plutôt que vers le développement."
 ARM_closing_ngos: "Fermer les ONG"
 ARM_closing_ngos_desc: "Les ONG européennes n'ont pas leur place dans notre magnifique pays, leur influence est trop nuisible pour nos citoyens."
 ARM_seizing_eu_funds: "Saisie des fonds de l'UE"
 ARM_seizing_eu_funds_desc: "Les investissements occidentaux nous serviront bien, il est temps de les prendre pour nous-mêmes."
 ARM_diplomatic_distance_eu: "Distanciation diplomatique de l'UE"
 ARM_diplomatic_distance_eu_desc: "Nous avons l'intention de nous distancier de l'Union européenne et de cesser d'entretenir des relations très amicales avec elle."
 ARM_slander_pro_europ_parties: "Diffamer les partis pro-européens"
 ARM_slander_pro_europ_parties_desc: "Tous les partis pro-européens doivent être contrôlés et limités dans leurs capacités, et les propagandistes pro-occidentaux ne doivent pas être autorisés à sévir en Arménie."
 ARM_close_integr_orgs: "Fermer toutes les organisations d'intégration"
 ARM_close_integr_orgs_desc: "Nous mettons fin à la coopération avec toutes les organisations d'intégration européenne, nous en avons assez du modèle européen."
 ARM_negot_individ_trade_agreements: "Négocier des accords commerciaux individuels"
 ARM_negot_individ_trade_agreements_desc: "Nous avons l'intention de mener des interactions individuelles avec les pays de l'UE, nous ne reconnaissons pas l'UE comme représentante de ces pays en politique internationale."
 ARM_support_euroscept: "Soutenir l’euroscepticisme"
 ARM_support_euroscept_desc: "L’euroscepticisme est l’une des bases de notre relation avec l’Europe, et il en restera ainsi."
 ARM_levons_legacy: "Héritage du roi Levon"
 ARM_levons_legacy_desc: "Les liens fraternels entre la France et l'Arménie ont perduré à travers les années et continueront malgré tous les problèmes."
 ARM_cultural_econ_fra: "Relations culturelles et économiques"
 ARM_cultural_econ_fra_desc: "France and Armenia are connected by many cultural and historical aspects, and we intend to expand cooperation with them for the benefit of the two peoples."
 ARM_french_educ_arm: "Éducation française en Arménie"
 ARM_french_educ_arm_desc: "L'éducation française est considérée comme l'une des meilleures au monde, et nous avons l'intention d'ouvrir des antennes d'universités françaises dans notre pays."
 ARM_military_coop_fra: "Coopération militaire avec la France"
 ARM_military_coop_fra_desc: "Nous avons l'intention d'élargir la coopération entre les forces armées de l'Arménie et de la France à un niveau sans précédent."
 ARM_francophonie_membership: "Adhésion à la Francophonie"
 ARM_francophonie_membership_desc: "Nous avons l'intention de devenir membre de la Francophonie, ce qui renforcera considérablement nos liens avec la France."
 ARM_armenia_eu_idea: "Arménie - Union européenne"
 ARM_eu_coop_agreement: "Accord de partenariat et de coopération"
 ARM_eu_council: "Conseil de l'Europe"
 ARM_eu_commitie: "Comité permanent sur l'intégration européenne"
 ARM_eu_ngos: "ONG"
 ARM_eu_lgbt: "Position sur le LGBTQIA"
 ARM_eu_article_49: "Préparation à l'article 49"
 ARM_usa_ngo_leave_idea: "Départ des ONG américaines"
 ARM_usa_noembaracy_idea: "Fermeture de l’ambassade américaine"
 ARM_usa_embaracy_idea: "Expansion de l’ambassade américaine"
 ARM_help_siryan_idea: "Aide de l'armée arménienne"
