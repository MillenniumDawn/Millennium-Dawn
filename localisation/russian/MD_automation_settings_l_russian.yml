l_russian:
 AUTOMATION_SETTINGS_OPEN_TT: "Открыть настройки автоматизации"
 AUTOMATION_SETTINGS_TITLE: "Настройки автоматизации"
 AUTOMATION_SETTINGS_DESC: "Управляйте повторяющимися действиями и настройками уведомлений с одной панели. Существующие элементы управления в других разделах остаются доступными."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "Общие"
 AUTOMATION_SETTINGS_SPACE_PAGE: "Спутники"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "Влияние"
 AUTOMATION_SETTINGS_SPACE_DESC: "Настройте автоматическое производство спутников, запуски и улучшения группировки."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "Настройте повторяющиеся действия, защищающие наше правительство от иностранного влияния."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "Сохраните подготовленный манифест полезной нагрузки в Космической программе как план §YПользовательский§! и переключитесь на него.\n\n§YТребования:§!\n[!automation_space_save_button_click_enabled]"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "Повышайте каждую группировку до новейшего исследованного поколения везде, где текущее орбитальное покрытие это позволяет.\n\n§YТребования:§!\n[!automation_space_upgrade_button_click_enabled]"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "Уведомления и предпочтения"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "Экономика"
 AUTOMATION_SETTINGS_UN_HEADER: "ООН"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "Дипломатия"
 AUTOMATION_SETTINGS_NATO_HEADER: "НАТО"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "Энергетика"
 AUTOMATION_SETTINGS_PP_RESERVE: "Резерв политической власти"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Автоматические действия, расходующие политическую власть, будут ждать, пока не смогут оплатить свою стоимость, не снижая политическую власть ниже этого резерва. Ручные действия не затрагиваются.\n\n£click_left §YЛКМ§!: Изменяет на §Y1§!\n£key_ctrl + £click_left §YCtrl ЛКМ§!: Изменяет на §Y10§!\n£key_shift + £click_left §YShift ЛКМ§!: Изменяет на §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §YЛКМ§!: Увеличивает на §Y1§!\n£key_ctrl + £click_left §YCtrl ЛКМ§!: Увеличивает на §Y10§!\n£key_shift + £click_left §YShift ЛКМ§!: Увеличивает на §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §YЛКМ§!: Уменьшает на §Y1§!\n£key_ctrl + £click_left §YCtrl ЛКМ§!: Уменьшает на §Y10§!\n£key_shift + £click_left §YShift ЛКМ§!: Уменьшает на §Y100§!"
 AUTOMATION_SETTINGS_CORRUPTION: "Автоматически отклонять предложения о коррупции"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "Автоматически пропускать предложения о коррупции. События и их возможные награды не будут появляться, пока это включено."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "Уведомления об иностранных выборах"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "Показывать новостные уведомления о выборах в других странах."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "Уведомления о рейдах влияния"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "Показывать события о рейдах влияния между другими странами. Рейды против нас всё равно будут отображаться, если это отключено."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "Ежемесячный отчёт об авто-влиянии"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "Показывать ежемесячный отчёт со списком стран, затронутых автоматическим влиянием."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "Автоматически принимать предложения об инвестициях"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "Автоматически принимать каждое входящее предложение о международных инвестициях. Включение этого отключает автоматический отказ."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "Автоматически отклонять предложения об инвестициях"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "Автоматически отклонять каждое входящее предложение о международных инвестициях. Включение этого отключает автоматическое принятие."
 AUTOMATION_SETTINGS_REINVESTMENT: "Реинвестирование международных инвестиций"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "Выберите, как еженедельная прибыль от международных инвестиций распределяется между казной и реинвестированием."
 AUTOMATION_SETTINGS_REINVEST_OFF: "Выкл."
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "Отправлять всю прибыль от международных инвестиций в казну."
 AUTOMATION_SETTINGS_REINVEST_FULL: "Полное"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "Реинвестировать всю прибыль от международных инвестиций."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "Разделить"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "Отправлять половину прибыли от международных инвестиций в казну и реинвестировать другую половину."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "Автоматическая закупка топлива"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "Немедленно закупать топливо, затем проверять каждые 28 дней и закупать снова, когда запасы топлива опускаются ниже 20 процентов. Отключите это, чтобы отменить будущие закупки."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "Повторять выбранные внутренние инвестиции"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Ежедневно платить £pol_power §R0,15§! политической власти, пока включено. Щёлкните правой кнопкой по кнопкам внутренних инвестиций в окне штата, чтобы выбрать штат и типы инвестиций для повтора. Выбранные инвестиции проверяются еженедельно и выполняются, пока есть свободный слот, казна может оплатить текущую стоимость и резерв политической власти может поддерживаться."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "Автоматически снабжать антарктическую станцию"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "Автоматически заказывать топливо для нашей антарктической станции, когда остаётся 15 дней или меньше с ноября по март, или 30 дней или меньше с апреля по октябрь. Поставки стоят §R$0,25 млрд за 1000 топлива§!, удваиваются в антарктическую зиму. Заказы ждут, пока казна сможет оплатить полную стоимость."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "Автоматическая политика потребления"
 AUTOMATION_SETTINGS_SC_VOTE: "Голосование по умолчанию в Совете Безопасности"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "Выберите, как мы автоматически голосуем по резолюциям Совета Безопасности. Нажмите выбранный вариант ещё раз, чтобы вернуться к ручному голосованию."
 AUTOMATION_SETTINGS_GA_VOTE: "Голосование по умолчанию в Генеральной Ассамблее"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "Выберите, как мы автоматически голосуем по резолюциям Генеральной Ассамблеи. Нажмите выбранный вариант ещё раз, чтобы вернуться к ручному голосованию."
 AUTOMATION_SETTINGS_VOTE_YES: "Да"
 AUTOMATION_SETTINGS_VOTE_NO: "Нет"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "Воздержаться"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Автоматически голосовать «Да» по каждой резолюции Совета Безопасности."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Автоматически голосовать «Нет» по каждой резолюции Совета Безопасности. Постоянные члены будут накладывать вето, когда это применимо."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Автоматически воздерживаться по каждой резолюции Совета Безопасности."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Автоматически голосовать «Да» по каждой резолюции Генеральной Ассамблеи."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Автоматически голосовать «Нет» по каждой резолюции Генеральной Ассамблеи."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "Автоматически воздерживаться по каждой резолюции Генеральной Ассамблеи."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Блокировать предложения ИИ о доступе к спутникам"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Запрещает странам под управлением ИИ предлагать общий доступ к их военным и гражданским спутниковым системам. Игроки-люди всё ещё могут отправлять предложения."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "Автоматически ратифицировать вступление в НАТО"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Автоматически тратить £pol_power §Y20§!, чтобы ратифицировать каждого кандидата на вступление в НАТО. Ратификация ждёт, пока резерв политической власти сможет поддерживаться."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "Защита от влияния"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "Автоматически противодействовать иностранному влиянию"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Ежедневно платить £pol_power §R0,05§! политической власти, пока включено. Когда доступно, автоматически тратить £pol_power §Y100§!, чтобы увеличить внутреннюю независимость на §G2,5%§!. Повторяется через 100 дней. Автоматизация приостанавливается, пока правительство подвергается лоббированию или когда любая из затрат снизит политическую власть ниже резерва."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "Автоматически атаковать иностранных влиятелей"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Ежедневно платить £pol_power §R0,05§! политической власти, пока включено. Автоматически тратить £pol_power §Y125§!, чтобы начать 60-дневную кампанию против самого сильного подходящего иностранного влиятеля. Одновременно идёт только одна кампания. Неподходящие, лоббируемые и восстанавливающиеся цели пропускаются. Автоматизация приостанавливается, когда любая из затрат снизит политическую власть ниже резерва."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Каждая включённая опция стоит £pol_power §R0,05§! ежедневно. Обе опции вместе стоят £pol_power §R0,10§! ежедневно."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "Экономика"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "Выберите, какими налогами и государственными расходами управлять автоматически. Изменения пересматриваются еженедельно и учитывают резерв политической власти."
 AUTOMATION_SETTINGS_TAX_HEADER: "Налоговые ставки"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "Бюджетные законы"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "Включённые налоги меняются не более чем на один процентный пункт в неделю в ответ на бюджетный баланс, долг и стабильность.\n\nРучные изменения оставляют автоматизацию включённой."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "Включённые бюджеты сдвигаются на один уровень в сторону ожидаемых расходов. Не более одного бюджета меняется каждую неделю с ротацией приоритета. Увеличения требуют бюджетного профицита. Ручные изменения законов оставляют автоматизацию включённой."
 AUTOMATION_SETTINGS_POPULATION_TAX: "Налог на население: [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "Корпоративный налог: [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "Автоматически корректировать налог на население на один процентный пункт в неделю, используя бюджетный баланс, долг и стабильность. Соблюдает ограничения на изменение налогов и оплачивает обычную стоимость политической власти сверх резерва. Ручные изменения налогов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "Автоматически корректировать корпоративный налог на один процентный пункт в неделю, используя бюджетный баланс, долг и доступные гражданские фабрики. Соблюдает ограничения на изменение налогов и оплачивает обычную стоимость политической власти сверх резерва. Ручные изменения налогов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "Администрация: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "Автоматически сдвигать администрацию к её ожидаемому уровню расходов, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Применяются обычные ограничения законов и затраты политической власти. Увеличения требуют профицита и приостанавливаются при приближающемся банкротстве. Резерв политической власти сохраняется. Ручные изменения законов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "Полиция: [?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "Автоматически сдвигать полицию к её ожидаемому уровню расходов, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Применяются обычные ограничения законов и затраты политической власти. Увеличения требуют профицита и приостанавливаются при приближающемся банкротстве. Резерв политической власти сохраняется. Ручные изменения законов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "Образование: [?education_law|0] / [?expected_edu_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "Автоматически сдвигать образование к его ожидаемому уровню расходов, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Применяются обычные ограничения законов и затраты политической власти. Увеличения требуют профицита и приостанавливаются при приближающемся банкротстве. Резерв политической власти сохраняется. Ручные изменения законов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "Здравоохранение: [?health_law|0] / [?expected_health_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "Автоматически сдвигать здравоохранение к его ожидаемому уровню расходов, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Применяются обычные ограничения законов и затраты политической власти. Увеличения требуют профицита и приостанавливаются при приближающемся банкротстве. Резерв политической власти сохраняется. Ручные изменения законов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "Социальное обеспечение: [?social_law|0] / [?expected_welfare_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET_TT: "Автоматически сдвигать социальное обеспечение к его ожидаемому уровню расходов, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Применяются обычные ограничения законов и затраты политической власти. Увеличения требуют профицита и приостанавливаются при приближающемся банкротстве. Резерв политической власти сохраняется. Ручные изменения законов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING: "Военные расходы: [?military_law|0] / [?expected_military_sp|0]"
 AUTOMATION_SETTINGS_BUDGET_MILITARY_SPENDING_TT: "Автоматически сдвигать военные расходы к их ожидаемому уровню расходов, по одному уровню за раз. Числа показывают текущий и ожидаемый уровни. Применяются обычные ограничения законов и затраты политической власти. Увеличения требуют профицита и приостанавливаются при приближающемся банкротстве. Резерв политической власти сохраняется. Ручные изменения законов оставляют эту опцию включённой."
 AUTOMATION_SETTINGS_GENERAL_PAGE_TT: "Настройте общую автоматизацию, например действия ООН, настройки уведомлений и другие второстепенные автоматические действия."
 AUTOMATION_SETTINGS_SPACE_PAGE_TT: "Настройте автоматическое производство спутников, запуски и улучшения группировки.\n\n§YТребования:§!\n[!automation_settings_space_page_button_click_enabled]"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE_TT: "Настройте автоматизацию влияния, например защиту и атаку влияния."
 AUTOMATION_SETTINGS_ECONOMY_PAGE_TT: "Настройте экономическую автоматизацию, например налоговые ставки и законы."
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT: "Блокировать предложения ИИ о ядерном топливе"
 AUTOMATION_SETTINGS_NUCLEAR_ENRICHMENT_TT: "Запрещает странам под управлением ИИ отправлять запросы на покупку §Yядерного топлива§! какой-либо стране. Игроки-люди всё ещё могут отправлять предложения."