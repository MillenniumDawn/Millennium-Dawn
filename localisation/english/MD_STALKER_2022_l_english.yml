l_english:
 STALKER.30.t: "The Battle for the Zone"
 STALKER.30.d: "A new emission storm has torn open paths into the heart of [event_target:STALKER_zone_display.GetName], and every faction is racing for the center: the Ward, the Spark, the resurgent Monolith and a lone stalker the others call Skif. Our perimeter is failing while they fight."
 STALKER.30.a: "Send in the army."
 STALKER.30.a_tt: "Costs §R50§! political power. Zone §Ycontainment§! rises by §G20§! and the §Ystalker§! population falls by up to §Y10§!. The military seals the eighth pod, restores activity and the stalker population, and prevents global spread."
 STALKER.30.b: "Back the Ward."
 STALKER.30.b_tt: "Zone §Ycontainment§! and §Yexploitation§! each rise by §G10§!, and §YFreedom§! influence falls by up to §Y10§!. If the Ward’s approach prevails, Skif’s eighth-pod choice leads to global Zones that start more contained and less active. The §YWard§! gains §G15§! influence."
 STALKER.30.c: "Let the stalkers settle it."
 STALKER.30.c_tt: "The §Ystalker§! population rises by §Y10§! and §YBandit§! influence rises by §R10§!. If the perimeter collapses and Skif enters the eighth pod, global Zones start more active and less contained. The §YSpark§! gains §Y10§! influence."
 STALKER.30.a_tt_contained: "Costs §R50§! political power. Zone §Ycontainment§! rises by §G20§!, and the §Ystalker§! population falls by up to §Y10§!. Military sealing closes the eighth pod, keeping the Zone in Ukraine."
 STALKER.30.b_tt_contained: "Zone §Ycontainment§! and §Yexploitation§! each rise by §G10§!, and §YFreedom§! influence falls by up to §Y10§!. If the Ward’s approach prevails with Global Zones disabled, Skif’s choice leaves the crisis in Ukraine. The §YWard§! gains §G15§! influence."
 STALKER.30.c_tt_contained: "The §Ystalker§! population rises by §Y10§! and §YBandit§! influence rises by §R10§!. If the perimeter collapses and Skif enters the eighth pod with Global Zones disabled, no new Zones appear abroad. The §YSpark§! gains §Y10§! influence."
 STALKER.31.t: "Skif Enters the Eighth Pod"
 STALKER.31.d: "At the heart of the Zone, the stalker known as Skif has defied Strelok, spared Dr. Kaymanov, the man called the Doctor, and entered the eighth pod of the C-Consciousness. He has given the Zone its will. Scientists across the world report the same readings within the hour: the Zone is no longer tied to Chornobyl."
 STALKER.31.a: "What happens now?"
 STALKER.32.t: "Anomalies Reported Worldwide"
 STALKER.32.d: "Governments on every continent are reporting anomalous activity: dead birds in circles, compasses spinning, whole villages losing radio contact. The UN Security Council has called an emergency session, and no delegation yet knows what to ask for."
 STALKER.32.d_ward: "Governments on every continent are reporting anomalous activity. The Ward is advising new Zone administrations on containment and access as national scientists coordinate their response."
 STALKER.32.d_stalkers: "Governments on every continent are reporting anomalous activity. With no shared containment plan, stalker networks and local authorities are improvising while smugglers race to the new sites."
 STALKER.32.a: "The Zone is everywhere now."
 STALKER.33.t: "After the Eighth Pod"
 STALKER.33.d: "Whatever Skif did in the heart of the Zone, [event_target:STALKER_zone_display.GetName] is more violent than it has ever been. Our generals want a new perimeter; our scientists say the world will need what they learn inside."
 STALKER.33.a: "Rebuild the perimeter."
 STALKER.33.a_tt: "Costs §R50§! political power. Zone §Ycontainment§! rises by §G20§!."
 STALKER.33.b: "Open the Zone to the world's scientists."
 STALKER.33.b_tt: "Zone §Yexploitation§! rises by §G15§!, increasing our Zone research."
 STALKER.31.d_contained: "At the heart of the Zone, the stalker known as Skif has defied Strelok, spared Dr. Kaymanov, the man called the Doctor, and entered the eighth pod of the C-Consciousness. The Zone has lashed out across the north of Ukraine, but instruments abroad register nothing unusual."
 STALKER.33.d_known: "Our Project X files described a link between the eighth pod and the noosphere. Skif spared Dr. Kaymanov and entered the pod, and the instruments around [event_target:STALKER_zone_display.GetName] now show the pattern our investigators feared. The surviving files may help us limit the damage here."
 STALKER.33.c: "Apply the Project X containment files."
 STALKER.33.c_tt: "Zone containment rises by up to §G15§!, exploitation rises by up to §G10§!, and activity falls by up to §G10§!. Available because we completed the X-Lab investigation."
 STALKER.36.t: "The Eighth Pod Is Sealed"
 STALKER.36.d: "The army has closed the route to the eighth pod, and containment around the Zone is stabilizing. Ukrainian instruments still register anomalous activity, but monitoring stations abroad report no new Zones."
 STALKER.36.a: "The perimeter holds."
