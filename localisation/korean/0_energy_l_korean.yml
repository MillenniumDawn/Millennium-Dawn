 renewable_01: "기초 태양광 패널"
 renewable_01_desc: "결정질 실리콘 패널은 연료도 움직이는 부품도 없이 햇빛을 전기로 바꿉니다. 값은 비싸고 받아들인 빛의 10분의 1을 조금 넘게만 전기로 바꾸지만, 지붕과 외딴 지역에 처음으로 태양광 발전을 가져다줍니다."
 renewable_02: "풍력 터빈 발전"
 renewable_02_desc: "더 큰 회전날개, 가변속 발전기, 개선된 공기역학 덕분에 터빈 한 기가 메가와트급 출력을 냅니다. 풍력 발전단지는 시범 사업을 벗어나 전력망에 상업적으로 전력을 공급하게 됩니다."
 renewable_03: "고효율 태양광 발전"
 renewable_03_desc: "더 순도 높은 실리콘과 개선된 셀 설계로 패널 효율이 20%에 가까워지고, 대형 공장 덕분에 모듈 단가는 떨어집니다. 지붕형 설비 옆으로 대규모 태양광 발전단지가 등장하기 시작합니다."
 renewable_04: "복합재 풍력 날개"
 renewable_04_desc: "유리섬유와 탄소섬유 날개는 이전 설계보다 가볍고 뻣뻣해서, 탑에 휘어 닿지 않고도 회전날개를 더 길게 만들 수 있습니다. 더 긴 날개는 더 많은 공기를 쓸어 담아 약한 바람에도 터빈을 돌립니다."
 renewable_05: "박막 태양광 기술"
 renewable_05_desc: "박막 전지는 빛을 흡수하는 물질을 유리나 휘어지는 판 위에 몇 마이크로미터 두께로 입힙니다. 실리콘 웨이퍼보다 원료가 훨씬 적게 들고 넓은 면적을 빠르게 코팅할 수 있어, 태양광 발전단지의 비용이 크게 줄어듭니다."
 renewable_06: "해상 풍력 발전단지"
 renewable_06_desc: "바다에 세운 터빈은 어느 육상 부지보다 강하고 꾸준한 바람을 받습니다. 전용 설치선과 고정식 기초 덕분에 개발업체는 해안에서 멀리 떨어진 곳에 수백 기 규모의 발전단지를 지을 수 있습니다."
 renewable_07: "양면 태양광 패널"
 renewable_07_desc: "양면 패널은 앞뒤 양면으로 빛을 받아 직사광선뿐 아니라 지면에서 반사된 햇빛도 모읍니다. 하늘을 가로지르는 태양을 따라 움직이는 추적 장치에 얹으면, 땅을 더 쓰지 않고도 발전단지의 출력을 높일 수 있습니다."
 renewable_08: "첨단 풍력 터빈 제어"
 renewable_08_desc: "날개 센서와, 회전날개 앞쪽의 바람을 읽는 라이다 덕분에 터빈은 돌풍이 닥치기 전에 피치와 요를 조정합니다. 발전단지 전체를 하나의 체계로 조종하므로 앞줄 터빈이 뒷줄 터빈의 바람을 더는 빼앗지 않습니다."
 renewable_09: "페로브스카이트 태양전지"
 renewable_09_desc: "실리콘 위에 쌓은 페로브스카이트 층은 실리콘만으로는 버려지는 일부 파장의 빛까지 받아들여 패널 효율을 30% 이상으로 끌어올립니다. 이 층은 저렴한 재료로 낮은 온도에서 만들어 제조 비용이 거의 늘지 않습니다."
 renewable_10: "조력 발전소"
 renewable_10_desc: "조류 수로에 고정한 터빈은 수년 전에 미리 알 수 있는 일정에 따라 오르내리는 조류로 돌아갑니다. 조력 발전은 날씨에 좌우되지 않는 재생에너지를 전력망에 공급합니다."
 renewable_11: "조력 발전 확대"
 renewable_11_desc: "부유식 플랫폼과 더 촘촘한 터빈 배열 덕분에 조력 발전은 몇몇 좁은 수로를 넘어 탁 트인 연안 해역으로 퍼집니다. 해저 케이블을 공유하고 모듈을 표준화하면서 새 배열을 지을 때마다 비용이 줄어듭니다."
 renewable_12: "화산 에너지 발전소"
 renewable_12_desc: "활화산 근처에 시추한 갱정은 마그마에 데워진 물에서 기존 지열 지대보다 훨씬 높은 온도의 열을 끌어옵니다. 이런 갱정 하나가 일반 지열 시추공의 몇 배에 이르는 전력을 낼 수 있습니다."
 renewable_13: "연약권 열 채취"
 renewable_13_desc: "활성 단층대를 따라 깊이 판 시추공은 뜨겁고 부분적으로 녹아 있는 연약권 암석에 닿습니다. 그 깊이에서 얻는 열은 바닥나지 않으며, 지각이 뚫을 수 있을 만큼 얇은 곳이라면 어디서든 쓸 수 있습니다."
 fuel_efficiency_01: "첨단 연소 공학"
 fuel_efficiency_01_desc: "단계식 버너와 더 정밀한 공기·연료 혼합 제어 덕분에 보일러가 연료를 더 완전히 태웁니다. 우리 발전소는 석탄 1톤, 가스 1세제곱미터당 더 많은 전기를 얻습니다."
 fuel_efficiency_02: "석탄가스화 복합발전(IGCC)"
 fuel_efficiency_02_desc: "IGCC 발전소는 석탄을 합성가스로 바꾸고 불순물을 걸러낸 뒤 가스터빈에서 태우며, 배기열은 증기 사이클로 다시 회수합니다. 이 2단계 설계는 같은 연료에서 훨씬 많은 전력을 짜냅니다."
 fuel_efficiency_03: "고효율 저배출 기술"
 fuel_efficiency_03_desc: "HELE 발전소는 초임계 및 초초임계 온도와 압력에서 증기를 돌립니다. 증기가 뜨거울수록 연료 1톤당 전력이 늘고 메가와트시당 이산화탄소는 줄어듭니다."
 fuel_efficiency_04: "탄소 포집·저장(CCS) 통합"
 fuel_efficiency_04_desc: "포집 설비가 발전소 배기가스에서 이산화탄소를 걸러내 깊은 암반층으로 보내 저장합니다. 나중에 덧붙이지 않고 처음부터 포집 설비를 발전소에 포함해 설계하면 소모되는 에너지를 최소로 줄일 수 있습니다."
 fuel_efficiency_05: "AI 기반 최적화 및 감시"
 fuel_efficiency_05_desc: "머신러닝 모델이 수천 개의 발전소 센서를 읽고 연료 흐름, 공기 공급, 터빈 부하를 초 단위로 조정합니다. 마모된 부품은 고장 나기 훨씬 전에 찾아내므로 우리 발전소는 최고 효율에 가깝게 더 오래 가동됩니다."
 fuel_efficiency_06: "준무배출 화석연료 발전소"
 fuel_efficiency_06_desc: "순산소 연소는 연료를 순수한 산소에서 태워, 수증기와 거의 순수한 이산화탄소만 배기로 남기므로 포집이 간단합니다. 이제 우리 화석연료 발전소는 대기 중으로 거의 아무것도 내보내지 않습니다."
 fuel_efficiency_07: "양자 연료 최적화"
 fuel_efficiency_07_desc: "양자컴퓨터는 기존 컴퓨터가 근사치만 낼 수 있었던 연소 화학을 분자 하나하나 단위로 시뮬레이션합니다. 기술자들은 그 결과로 연료 단위당 더 많은 에너지를 내는 연료, 촉매, 버너를 설계합니다."
 fuel_efficiency_08: "AGI 도입"
 fuel_efficiency_08_desc: "범용 AI가 연료 구매와 정비 인력부터 전력망 배분까지, 우리 발전소 전체를 하나의 국가 발전 설비군으로 운영합니다. 부하는 그 순간 연료를 가장 효율적으로 태우는 발전소로 언제나 옮겨 갑니다."
 fuel_efficiency_09: "특수 연료 나노섬유"
 fuel_efficiency_09_desc: "나노섬유 단열재를 보일러, 배관, 터빈 외피에 둘러 열이 아직 증기를 만들 수 있는 사이클 안에 머물게 합니다. 발전소 벽으로 새는 에너지가 줄어 연료 한 차례 물량에서 더 많은 몫이 발전기에 닿습니다."