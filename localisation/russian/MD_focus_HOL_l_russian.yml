 BEL_sabiex_international_tank_manufacturer_desc: "Основанная в 1988 году и работающая в Монсе и Турне, Sabiex International восстанавливает и модернизирует бронетехнику и военные грузовики. Ныне дочерняя компания Elbit, она перебирает силовые блоки, трансмиссии и боевые системы гусеничных транспортёров, колёсной бронетехники и тыловых парков."
