 CZE_petr_pavel_card_one_button_TT: "§G연락 장교§!"
 CZE_petr_pavel_card_one_button_delayed_TT: "페트르 파벨은 오랫동안 연락 장교로 복무했습니다. 그는 이미 많은 훈련을 거쳤지만 여전히 새로운 과제가 남아 있습니다. 군사 기술은 계속 발전하고 있으며 구식 장비는 더 이상 현대의 적에게 효과적이지 않습니다.\n\n현재 경험은 다음과 같은 이점을 제공합니다.\n[CZE_petr_pavel_liaison_officer_loc]"
 CZE_petr_pavel_card_two_button_TT: "§G특수 부대§!"
 CZE_petr_pavel_card_two_button_delayed_TT: "특수 작전에 참여하려면 높은 집중력과 경험, 그리고 분대와의 조율이 필요합니다. 이 훈련은 다른 숙련된 병사들과의 협력을 향상시키고 페트르 파벨을 더욱 뛰어난 지휘관으로 만들 것입니다.\n\n현재 경험은 다음과 같은 이점을 제공합니다.\n[CZE_petr_pavel_special_forces_loc]"
 CZE_petr_pavel_card_three_button_TT: "§G사막 훈련§!"
 CZE_petr_pavel_card_three_button_delayed_TT: "사막 훈련은 지금까지 핵심적인 역할을 하지 못했습니다. 그러나 이는 곧 바뀔 수도 있습니다. 아프가니스탄은 내전에 휩싸여 있고 중동은 여전히 불안정한 지역입니다. 이 훈련을 소홀히 해서는 안 되는데, 몇 년 후에 매우 유용해질 수도 있기 때문입니다...\n\n현재 경험은 다음과 같은 이점을 제공합니다.\n[CZE_petr_pavel_desert_training_loc]"
 CZE_petr_pavel_card_four_button_TT: "§G방어 스타일§!"
 CZE_petr_pavel_card_four_button_delayed_TT: "페트르 파벨은 연락 장교이자 계획 전문가이지만, 무엇보다 중요한 점은 그가 조국을 지킬 더 나은 방법을 늘 모색한다는 것입니다. 군은 어떤 적에게도 맞서 지킬 수 있을 만큼 강해야 하며, 이것이 이 훈련의 요점입니다.\n\n현재 경험은 다음과 같은 이점을 제공합니다.\n[CZE_petr_pavel_defensive_style_loc]"
 CZE_petr_pavel_card_five_button_TT: "§G공격 스타일§!"
 CZE_petr_pavel_card_five_button_delayed_TT: "훌륭한 방어자이자 전략가라 하더라도 전장에서 병사들을 승리로 이끄는 법을 알아야 합니다. 이 훈련 프로그램은 페트르 파벨에게 병사들을 효과적으로 지휘하고 적의 방어선을 분쇄하는 방법을 가르쳐 줄 것입니다.\n\n현재 경험은 다음과 같은 이점을 제공합니다.\n[CZE_petr_pavel_offensive_style_loc]"
 CZE_petr_pavel_card_six_button_TT: "§G계획 전문가§!"
 CZE_petr_pavel_card_six_button_delayed_TT: "페트르 파벨은 전략 수립의 전문가로, 중요한 훈련과 작전에서 상급 장성들과 자주 협력합니다. 조국을 안전한 나라로 지키는 방법을 인정받는 것이 중요하며, 이는 완벽한 억지 전략으로만 가능합니다.\n\n현재 경험은 다음과 같은 이점을 제공합니다.\n[CZE_petr_pavel_planning_expert_loc]"
 CZE_petr_pavel_liaison_officer_loc_one: "§Y+3%§! §R이동 시 조직도 손실§!\n§Y-2%§! §R정찰§!"
