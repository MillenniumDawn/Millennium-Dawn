 ukr_modernize_sov_equipment_9p148_caucasus_offer: "캅카스에 보관 중인 §Y9P148 콩쿠르스§! 운반차 매각 제안"
 ukr_modernize_sov_equipment_9p148_caucasus_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_9p48_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[GEO.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§!, §Y[ARM.GetNameWithFlag]§!은(는) 지금도 §YBRDM-2§! 차체 기반 구축전차를 운용하고 있습니다. 우리가 보관 중인 §Y9P148 콩쿠르스§! 운반차를 이 중 한 곳에 팔 수 있습니다.\n선택받지 못한 나라는 §R반감을 품을 것입니다§!.\n------------------\n거래가 무산되거나 일부 운반차가 남으면 다음에는 아프리카에 제안할 수 있습니다.§!"
 ukr_modernize_sov_equipment_9p148_africa_offer: "아프리카에 보관 중인 §Y9P148 콩쿠르스§! 운반차 매각 제안"
 ukr_modernize_sov_equipment_9p148_africa_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_9p48_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[SUD.GetNameWithFlag]§!, §Y[ETH.GetNameWithFlag]§!, §Y[CHA.GetNameWithFlag]§!은(는) 소련 시대 무기라면 구할 수 있는 곳 어디서든 싸게 사들입니다. 우리가 보관 중인 §Y9P148 콩쿠르스§! 운반차를 이 중 한 곳에 제안할 수 있습니다.§!"
 ukr_modernize_sov_equipment_atgm_barrier_v: "§YBRDM-2§! 대전차 유도 미사일 운반차를 §Y바리어-V§!로 개조"
 ukr_modernize_sov_equipment_atgm_barrier_v_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_9p48_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y바리어§! 미사일이 실전 배치된 만큼, §Y루치 설계국§!과 우리 정비 공장이 낡은 §YBRDM-2§! 구축전차에 §Y바리어-V§! 발사대를 장착해 개조할 수 있습니다.\n주문 1건당 보관 중인 §Y9P148 콩쿠르스§! 운반차를 최대 §Y18§!대까지 씁니다.\n------------------\n운반차가 남아 있는 동안은 이 결정을 반복할 수 있습니다.§!\n\n$UKR_rada_modernization_design_tt$\n\n개발 비용 §R[?UKR_storage_barrier_development_cost|2]§!십억은 첫 주문 때만 지불합니다. 이후 물량마다 별도로 §R0.04§!십억이 듭니다."
 ukr_modernize_sov_equipment_tu16_egypt_offer: "§Y[EGY.GetNameWithFlag]§!에 보관 중인 §YTu-16§! 매각 제안"
 ukr_modernize_sov_equipment_tu16_egypt_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_tu16_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[EGY.GetNameWithFlag]§!은(는) 지금도 낡은 §YTu-16§! 폭격기 몇 대를 날리고 있습니다. 우리가 보관 중인 §YTu-16§!이 있으면 이 기체들을 계속 띄우거나, 최소한 예비 부품이라도 확보할 수 있습니다.\n------------------\n장거리 폭격기를 팔면 한동안 §YNATO§!와 §Y[SOV.GetNameWithFlag]§!의 §R분노를 삽니다§!.§!"
 ukr_modernize_sov_equipment_tu16_china_offer: "§Y[CHI.GetNameWithFlag]§!에 보관 중인 §YTu-16§! 매각 제안"
 ukr_modernize_sov_equipment_tu16_china_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_tu16_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[CHI.GetNameWithFlag]§!은(는) §YTu-16§!의 자국판 복제형인 §YH-6§!를 생산합니다. 우리가 보관 중인 §YTu-16§!은 §Y[CHI.GetNameWithFlag]§!에서 개조되어 그 수를 더 늘려 줄 것입니다.\n------------------\n장거리 폭격기를 팔면 한동안 §YNATO§!와 §Y[SOV.GetNameWithFlag]§!의 §R분노를 삽니다§!.§!"
 ukr_modernize_sov_equipment_tu16_scrap: "보관 중인 §YTu-16§! 폐기"
 ukr_modernize_sov_equipment_tu16_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_tu16_for_tooltip\n\n\n\n\n\n\n\n\n§W이제 우리가 보관 중인 §YTu-16§!을 원하는 곳은 없습니다. 폐기에는 남은 수량에 따라 §R1천만~2천만§!이 들지만, 하르키우의 공장들이 1년 동안 §G알루미늄, 강철, 마이크로칩§!을 되돌려 받습니다.§!"
