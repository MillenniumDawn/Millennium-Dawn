 NIG_islamic_majority_1_idea: "이슬람 우세 - 1"
 NIG_nigerian_secularism_idea: "나이지리아 세속주의"
 NIG_nigerian_secularism_idea_desc: "나이지리아의 종교적 차이는 정부가 어느 한쪽도 택하지 않도록 만들었습니다. 세속주의는 진정으로 나이지리아에 최선의 이익이 됩니다."
 NIG_nigerian_land_of_harmony_idea: "화합의 영토"
 NIG_unrestrained_piracy_idea: "통제불가능한 해적"
 NIG_unrestrained_piracy_idea_desc: "최근 국내의 불안정과 종교 분쟁은 해적 행위의 새로운 부상을 낳았습니다. 만연하고 통제되지 않는 해적 행위는 나이지리아 정부의 주요 문제입니다. 이는 특히 니제르 삼각주 지역을 중심으로 국내 석유 및 가스 사업에 영향을 미치고 있습니다. 이 지역의 끊임없는 전투와 불안, 그리고 연방 정부의 추가적인 지원이 없는 한, 해적들은 우리 해안과 강에서 계속 피해를 입힐 것입니다."
 NIG_restrained_piracy_idea: "통제된 해적"
 NIG_restrained_piracy_idea_desc: "연방 정부는 나이지리아 해역의 해적 행위에 맞서기 위해 전략적 조치를 시행했습니다. 이러한 노력으로 해적 활동은 이전 수준에 비해 크게 줄었으나, 위협이 완전히 제거된 것은 아닙니다. 해군 순찰과 국제 협력은 주요 해상 교통로를 지키는 데 도움이 되었지만, 특히 외진 해안 지역과 니제르 삼각주를 따라 산발적인 사건은 여전히 발생합니다."
 NIG_state_run_markets_idea: "국가 운영 시장"
 NIG_armor_production_idea: "나이지리아 무기 생산"
 NIG_coastal_forces_production_idea: "Coastal Forces Production"
 NIG_nigerian_peacekeepers_idea: "아프리카의 평화지킴이"
 NIG_victory_is_from_god_alone_idea: "승리는 오로지 신으로부터"
 NIG_the_new_nigerian_caliph_idea: "신 칼리프"
 NIG_uncontrollable_population_growth_idea: "통제되지 않는 인구 성장"
 NIG_uncontrollable_population_growth_idea_desc: "Nigeria is experiencing unprecedented population growth, with one of the highest fertility rates in the world. This demographic explosion presents significant challenges for infrastructure, education, healthcare, and economic development. Without comprehensive family planning programs and substantial investment in social services, our nation will continue to struggle with the socioeconomic pressures of this rapid expansion, potentially undermining our development goals for decades to come."
 NIG_controlled_population_program_idea: "통제된 인구 성장"
 NIG_reformed_ndcc_idea: "NDCC 개혁 완료"
 NIG_religious_divide_decisions_category: "종교 분열"
 NIG_religious_divide_decisions_category_desc: "종교 분열이 우리나라 내부의 균열을 서서히 넓히고 있습니다. 나라를 안정시키기 위해 반대 종교로의 개종을 시작할 때입니다."
 NIG_convert_state_332: "비아프라로 교체"
 NIG_convert_state_332_desc: "비아프라는 나이지리아 내에서 기독교도가 다수인 지역입니다. 그러나 경제적으로는 국가 석유 공급의 상당 부분을 생산합니다. 니제르 삼각주 해방 운동(MEND)은 지역 생산을 방해하는 대규모 민병대 조직입니다."
 NIG_convert_state_339: "카노로 교체"
 NIG_convert_state_339_desc: "카노는 나이지리아 북부에서 이슬람교도가 다수인 지역입니다. 카두나와 카노의 주요 도시 중심지는 이 지역을 상당한 산업 역량을 갖춘 중요한 제조업 거점으로 자리 잡게 했습니다. 이 도시들은 나이지리아 북부 발전의 핵심 경제 중심지이며 이슬람 문화와 전통의 깊은 영향을 받고 있습니다."
 NIG_convert_state_338: "소코토로 교체"
 NIG_convert_state_340: "보르노로 교체"
 NIG_convert_state_334: "라고스로 교체"
 NIG_convert_state_336: "베누에로 교체"
 NIG_convert_state_322: "암바조니아로 교체"
 NIG_convert_state_337: "아부자로 교체"
 NIG_convert_state_337_desc: "나이지리아의 수도 아부자는 무슬림과 기독교도가 거의 같은 비율로 나란히 공존하는, 나라의 종교 분열을 축소해 놓은 곳입니다. 연방 수도 구역에는 웅장한 국립 모스크와 화려한 국립 기독교 센터를 비롯해 이 나라에서 가장 인상적인 종교 건축물들이 있으며, 이는 나이지리아 사회를 규정하는 미묘한 종교적 균형을 상징합니다."
 NIG_religious_civil_war_mission: "종교 내전!"
 NIG_religious_civil_war_mission_desc: "나이지리아 전역에서 종교적 긴장이 한계점에 이르렀으며, 종파를 따라 무장 민병대가 결성되고 있습니다. 남부의 기독교도와 북부의 무슬림은 빠르게 동원되어 무기를 비축하고 전투원을 모집하고 있습니다. 이미 여러 주에서 폭력 사태가 발생했으며, 이는 국가 전체를 참혹한 종교 내전으로 몰아넣을 위험이 있습니다. 국가 단결의 완전한 붕괴를 막고 통일 국가로서 나이지리아의 미래를 지키기 위해 즉각적인 조치가 필요합니다."
 NIG_hold_off_on_conversion_decision: "개종 보류"
 NIG_hold_off_on_conversion_decision_desc: "우리의 공격적인 종교 개종 노력이 위험할 만큼 빠른 속도로 진행되어 국가의 섬세한 사회 구조를 위협하고 있습니다. 이러한 강압적인 접근을 계속하면 광범위한 사회 불안, 종파 간 폭력, 그리고 국가 단결에 돌이킬 수 없는 피해를 초래할 위험이 있습니다. 긴장이 가라앉도록 개종 활동을 일시 중단하고, 나이지리아의 복잡한 종교 지형을 존중하는 보다 절제되고 지속 가능한 접근법을 마련해야 합니다."
 nigeria_md.1.t: "[NIG_religious_conversion_state.GetName]에서의 평화적 개종"
 nigeria_md.1.d1: "우리의 다와(이슬람 포교) 활동은 [NIG_religious_conversion_state.GetName]에서 평화적인 개종을 이끌기 시작했습니다. 현지 이맘들은 모스크 참석자가 늘고 있다고 보고하며, 많은 가정이 우리의 교육 프로그램을 통해 이슬람의 가르침을 받아들이고 있습니다. 개종 과정은 놀랄 만큼 화목하게 진행되고 있으며, 지역 지도자들이 서로 다른 신앙 집단 사이의 대화를 이끌고 있습니다. 새로운 이슬람 학교가 세워지고 있으며, 한때 기독교도가 다수였던 동네 곳곳에 이제 기도 시간을 알리는 아잔이 울려 퍼집니다. 이 지역에서 우리의 움마가 성장하는 것을 지켜보는 오늘은 이슬람에게 참으로 멋진 날입니다. 알라를 찬양하라!"
 nigeria_md.1.d2: "우리의 기독교 선교사들은 [NIG_religious_conversion_state.GetName]에서 놀라운 성과를 거두었으며, 오늘 마지막 집단 세례식으로 그 정점을 맞았습니다. 현지 교회들은 참석자가 급증하고 있다고 보고하며, 가정들은 우리의 교육 프로그램을 통해 기독교의 가르침을 받아들이고 있습니다. 지역 지도자들은 서로 다른 신앙 집단 사이의 평화로운 대화를 이끌어 전환을 수월하게 했습니다. 이 지역 곳곳에 새 교회와 기독교 학교가 세워지고 있으며, 한때 무슬림이 다수였던 동네에 이제 찬송가가 울려 퍼집니다. 이 지역에서 하나님의 왕국이 성장하는 것을 지켜보는 오늘은 기독교에게 참으로 축복받은 날입니다."
 nigeria_md.1.a: "훌륭하군!"
 nigeria_md.2.t: "[NIG_religious_conversion_state.GetName]에서의 비폭력 시위"
 nigeria_md.2.d1: "[NIG_religious_conversion_state.GetName]의 이슬람 소수자들이 우리의 개종 노력에 반대하여 평화적인 시위를 조직했습니다. 현지 이맘들이 이끈 기도 모임이 비폭력 시위로 발전했으며, 참가자들은 자신의 종교의 자유를 옹호하는 팻말을 들고 있습니다. 이 시위는 질서를 유지하고 있으나 지역에 눈에 띄는 긴장을 조성하여 안정도에 영향을 미치고 우리의 선교 활동을 늦추고 있습니다. 현지 당국은 이슬람 소수자들이 자신들의 신앙 전통을 지키기 위해 결집하면서 종교 공동체 간의 양극화가 심해지고 있다고 보고합니다."
 nigeria_md.2.d2: "[NIG_religious_conversion_state.GetName]의 기독교 소수자들이 우리의 개종 노력에 반대하여 평화적인 시위를 조직했습니다. 현지 교회 지도자들이 조직한 기도 모임이 비폭력 시위로 발전했으며, 참가자들은 자신의 종교의 자유를 옹호하는 팻말을 들고 있습니다. 이 시위는 지역에 눈에 띄는 긴장을 조성했으며, 더 독실한 기독교도들은 우리 이슬람 선교사들의 활동을 적극적으로 방해하고 있습니다. 현지 당국은 기독교도들이 자신들의 신앙 전통을 지키기 위해 결집하면서 종교 공동체 간의 양극화가 심해지고 있다고 보고합니다."
 nigeria_md.2.a: "기독교에게 좋은 날"
 nigeria_md.2.b: "알라를 위하여!"
 nigeria_md.3.t: "우리 선교사들에 대한 폭력적 저항!"
 nigeria_md.3.d1: "[NIG_religious_conversion_state.GetName] 전역에서 우리 선교사들에 대한 폭력적 반대가 터져 나왔습니다. 평화적인 시위로 시작된 것이 조직적 저항으로 확대되었으며, 이슬람 무장 세력이 기독교 전초 기지를 공격하고 개종 노력을 방해하고 있습니다. 정보 보고에 따르면 보코 하람 반군이 현지 저항 단체에 무기, 자금, 전술적 지원을 제공하고 있으며, 이는 종교적 긴장을 지역 안정을 위협하는 무력 충돌로 바꾸어 놓고 있습니다."
 nigeria_md.3.d2: "기독교 민병대가 우리 선교사들을 숙소에서 강제로 쫓아내면서 [NIG_religious_conversion_state.GetName]에서 폭력적인 저항이 터져 나왔습니다. 무장한 기독교 집단이 지역 경찰 및 이슬람 선교사들과 직접 충돌하면서 이 지역은 혼란에 빠지고 있습니다. 폭력이 격화되면서 도로가 봉쇄되고 상점이 문을 닫으며 민간인의 이동이 심각하게 제한되고 있습니다. 정보 보고에 따르면 이 민병대들은 외부 기독교 단체의 지원을 받고 있으며, 이는 종교적 긴장으로 시작된 것을 점점 더 조직적인 무장 저항으로 바꾸어 놓고 있습니다."
 nigeria_md.3.a: "유감스럽군"
 nigeria_md.4.t1: "보코 하람 반란!"
 nigeria_md.4.t2: "기독교도 봉기!"
 nigeria_md.4.d1: "국민이 알라의 이름으로 무기를 들었습니다. 보코 하람 반군은 정부를 전복하고 전국에 이슬람 통치를 수립하려는 의도를 공공연히 선언하고 있습니다. 그들이 통제하는 영토에서는 민간인들이 빠르게 무장하며 운동에 충성을 맹세하고 있습니다. 군 정보 보고에 따르면 반군이 장기전을 준비하면서 외진 지역에 조직적인 훈련 캠프가 형성되고 있습니다. 상황은 고립된 사건을 넘어 국가 안보를 위협하는 전면적인 반란으로 악화되었습니다."
 nigeria_md.4.d2: "기독교 민병대가 우리 정부에 대해 공개적인 무장 반란을 일으켰습니다. 그들은 우리가 자신들의 기본적 인권을 침해하고 있다고 주장하며, 그들의 반란은 급속히 힘을 얻고 있습니다. 이 봉기가 국경 너머로 번져 지역 안정을 위협하기 전에 진압하기 위해 즉각적인 군사 행동에 대비해야 합니다. 이 상황은 국가 단결을 지키기 위한 신속하고 결정적인 개입을 요구합니다."
 nigeria_md.4.a: "반역자들에게 죽음을!"
 nigeria_md.5.t: "PDP의 부활"
 nigeria_md.5.d: "국민민주당(PDP)은 나이지리아 전역에서 인기가 극적으로 되살아났습니다. 한때 회의적이던 유권자들이 이제 경제 개혁과 국가 단결이라는 PDP의 강령 뒤로 결집하고 있습니다. PDP 후보들은 주요 지역의 여론조사를 석권하고 있으며, 지방 정부 관리들은 전례 없는 규모로 이 당으로 넘어오고 있습니다. 정치 분석가들은 이러한 변화가 안보 위기와 경제 쇠퇴에 대처하지 못한 현 행정부의 실패에 대한 광범위한 환멸 때문이라고 분석합니다. 안정과 번영을 약속하며 PDP는 나이지리아의 미래 지도부를 위한 가장 신뢰할 수 있는 대안으로 자리매김했습니다."
 nigeria_md.5.a: "PDP야말로 올바른 선택이다"
 nigeria_md.6.t: "ANPP의 부상"
 nigeria_md.6.d: "전 나이지리아 인민당(ANPP)은 1999년 창당 이래 이 나라에서 가장 영향력 있는 야당 세력 중 하나로 부상했습니다. 최근 몇 년간 이 당은 진보적 정책을 내세우고 더 강력한 경제 규제를 주장하며 상당한 추진력을 얻었고, 더 보수적인 PDP와의 뚜렷한 이념적 차별성을 만들어 냈습니다. 나이지리아의 다양한 민족 및 종교 공동체에 걸쳐 빠르게 확장하는 풀뿌리 네트워크를 바탕으로, ANPP는 평범한 시민들의 진정한 대변자로 자리매김하는 데 성공했습니다. 포괄적인 사회 복지 프로그램에 초점을 맞추고 정부에 더 큰 책임성을 요구하는 이 당의 강령은 현 상태에 점점 환멸을 느끼는 국민들에게 깊은 공감을 얻었습니다."
 nigeria_md.6.a: "ANPP야말로 국민의 선택이다"
 nigeria_md.7.t: "해외 보조금을 모색하는 나이지리아"
 nigeria_md.7.d: "나이지리아 정부가 해외 개발 보조금을 얻기 위해 우리 외교관과 대사들에게 적극적으로 접근하기 시작했습니다. 이들은 자국의 기반시설을 대폭 확충하고자 하며, 특히 우리나라의 탄탄한 도로 및 철도망을 본뜨는 데 관심을 표명했습니다. 이들의 대표단은 우리의 재정 지원이 나이지리아의 교통망을 어떻게 탈바꿈시킬 수 있는지를 강조한 상세한 제안서를 제시했습니다. 이들의 야심 찬 개발 계획을 뒷받침하기 위해 요청된 원조를 제공해야 하겠습니까?"
 nigeria_md.7.a: "나이지리아 측에 도와주겠다고 전하라."
 nigeria_md.7.b: "그럴 여유가 없다."
 nigeria_md.8.t: "나이지리아의 투자"
 nigeria_md.8.d: "나이지리아 정부가 우리의 기반시설, 에너지 부문, 산업 개발을 겨냥한 대규모 투자 제안을 가지고 접근해 왔습니다. 이들의 대표단은 우리의 경제 성장을 크게 가속할 것으로 약속하는 장기 자본 투입 계획을 포괄적으로 제시했습니다. 그러나 이는 경제 주권에 관한 중대한 문제를 제기합니다. 나이지리아 기업들에게 상당한 시장 점유율을 허용하면 의존 관계가 생길 수 있고, 그들이 우리의 국내 경제 정책에 영향력을 행사할 수도 있습니다. 당면한 개발상의 이익과 우리 국가 경제의 독립 및 안보에 미칠 수 있는 장기적 영향 사이에서 신중하게 균형을 잡아야 합니다."
 nigeria_md.8.a: "물론이지"
 nigeria_md.8.b: "절대 안된다"
 nigeria_md.9.t: "이슬람 국가 연합 초청"
 nigeria_md.9.d: "나이지리아 이슬람 공화국이 우리에게 이슬람 국가 연합 가입을 위한 공식 초청을 보내왔습니다. 나이지리아 외교관은 확신에 차서 말합니다. '우리 무슬림 국가들은 서방 제국주의와 세속적 영향력에 맞서 단결해야 합니다. 함께라면 우리의 이슬람 가치를 지키고 주권을 보존하는 경제적·군사적 동맹을 만들 수 있습니다. 분열된다면 우리는 문화적 침식과 정치적 예속에 취약한 채로 남게 됩니다.'\n\n이 동맹은 상호 방위 조약, 특혜 무역 협정, 이슬람 세계 전반에 걸친 종교적 연대를 약속합니다. 이 범이슬람 연합에서 우리의 무슬림 형제들과 뜻을 같이해야 하겠습니까?"
 nigeria_md.9.a: "함께하면 더 강하다!"
 nigeria_md.9.b: "우리는 스스로 지하드를 수행해야 한다!"
 nigeria_focus: "나이지리아 중점계통도"
 NIG_islamic_majority_10_idea_desc: "이슬람 세력이 다수를 차지하며 선택되었습니다!"
 NIG_cores_equatorial_guinea_cameroon_central_tt: "§Y[EGU.GetNameWithFlag]§!, §Y[CAM.GetNameWithFlag]§!, §Y[CAR.GetNameWithFlag]§!의 주를 중핵으로 삼습니다.\n"
 NIG_cores_benin_togo_states_tt: "§Y[BEN.GetNameWithFlag]§!과(와) §Y[TOG.GetNameWithFlag]§!의 주를 중핵으로 삼습니다.\n"
 NIG_cores_niger_states_tt: "§Y[NGR.GetNameWithFlag]§!의 주를 중핵으로 삼습니다."
 NIG_efficient_government_spending_idea: "효율적인 정부 지출"
 NIG_efficient_government_spending_idea_desc: "나이지리아 정부는 재정 관리와 예산 유지에서 놀라운 효율성을 보여 왔습니다. 이러한 성공은 상당 부분 국가의 탄탄한 석유 수출과 생산 덕분이며, 이는 자원의 전략적 배분을 가능하게 하는 안정적인 수입원이 됩니다. 행정부는 낭비성 지출을 최소화하면서 나이지리아의 천연자원으로부터 얻는 이익을 극대화하는 신중한 재정 정책을 시행해 왔습니다."
 NIG_nigerian_education_idea: "나이지리아 교육 프로그램"
 NIG_nigerian_education_idea_desc: "나이지리아 정부는 국내 교육의 질을 높이기 위한 포괄적인 교육 개혁을 시행했습니다. 이 개혁에는 새로운 교육 과정의 도입, 교사 연수 확대, 학교 기반시설 개선이 포함됩니다."
 NIG_blood_oil_idea: "피의 석유"
 NIG_blood_oil_idea_desc: "나이지리아의 석유 수출은 '피의 석유'라는 불길한 별칭을 얻었습니다. 이 암울한 꼬리표는 석유가 풍부한 지역, 특히 니제르 삼각주를 괴롭히는 만연한 폭력, 무력 충돌, 인권 침해에서 비롯되었습니다. 지역 사회는 환경 파괴에 시달리고 무장 단체는 송유관을 파괴하고 석유 노동자를 납치하여, 나이지리아의 가장 귀중한 자원을 유혈과 부패로 더럽히는 불안정의 악순환을 만들어 내고 있습니다."
 NIG_controlled_population_program_idea_desc: "포괄적인 가족계획 구상, 교육 캠페인, 그리고 세심하게 마련된 법안을 통해 나이지리아는 이전의 유례없던 인구 증가를 지속 가능한 수준으로 성공적으로 완화했습니다. 이러한 정책은 문화적 민감성과 경제적 필요 사이의 균형을 이루어, 의료, 교육, 기반시설 개발에 대한 자원 배분을 개선할 수 있게 했습니다. 이러한 통제된 인구 구조 전환은 나이지리아가 보다 안정적인 장기 경제 성장과 국민의 삶의 질 향상을 이루도록 합니다."
 NIG_separation_of_church_and_state: "정교 분리"
 NIG_separation_of_church_and_state_desc: "진정한 조화 속에서 살고자 한다면 교회와 국가는 분리되어야 합니다."
 NIG_suppression_of_islam: "이슬람 탄압"
 NIG_suppression_of_islam_desc: "이슬람 교리를 따르는 이슬람 인구는 자신들의 잘못된 길을 깨달아야 합니다. 먼저 지역 이슬람 신문을 폐쇄하고 기타 지원 수단을 차단하는 것부터 시작할 것입니다."
 NIG_lagos_financial_centre: "라고스 금융 중심지"
 NIG_lagos_financial_centre_desc: "라고스시는 인구 기준으로 아프리카 최대의 도시입니다. 또한 아프리카의 모든 주요 도시 가운데 가장 강력한 금융 부문 중 하나를 자랑합니다. 경제부는 이 산업을 부진한 경제를 개선하기 위한 다음 단계 중 하나로 보고 있습니다."
 NIG_hydroelectric_power_projects: "수력 발전 사업"
 NIG_hydroelectric_power_projects_desc: "수력 발전은 나이지리아에서 점점 인기를 얻고 있는 재생 에너지원입니다. 이는 전기를 생산하는 깨끗하고 효율적인 방법이며 비용 효과도 높습니다. 수력 발전 사업을 건설하여 전력을 생산하고 외국산 석유에 대한 의존을 줄이는 방안을 검토해야 합니다."
 NIG_strike_fighters: "공격 전투기"
 NIG_strike_fighters_desc: "국내 산업을 전용하여 노후화된 우리 공군을 위한 더 저렴하고 효과적인 전투기를 생산할 수 있습니다. 알파 제트 또는 청두 기종의 보유 규모를 늘릴 수도 있습니다."
 NIG_controls_ambazonia_tt: "\n§Y[322.GetName]§!을(를) 통제하고 있거나 §Y[322.GetName]§!에 대한 자원 권리를 보유한 경우:\n"
 NIG_the_bakassi_peninsula: "바카시 반도"
 NIG_the_bakassi_peninsula_tt: "우리는 §Y바카시 반도를 장악했습니다§!. 이 선택은 앞으로 몇 주의 전개에 따라 §Y[CAM.GetNameWithFlag]§!과(와)의 전쟁으로 이어질 수 있습니다.\n"
 NIG_sharia_law_warning_tt: "북부 주들에서 §Y샤리아 법§!을 중단하면 나중에 개종을 추진하기로 하더라도 주를 개종시키기가 더 어려워집니다...\n"
 NIG_ambazonia.1.a_tt: "우리는 [NIG.GetAdjective] 정부에 외교적으로 접근할 것입니다. §Y바카시 반도§!를 양도하지 않으면 갈등이 확대될 수 있습니다."
 NIG_ambazonia.1.b_tt: "우리는 [NIG.GetNameWithFlag]과(와) 교전을 벌일 것입니다. §Y바카시 반도§!를 양도하지 않으면 갈등이 확대될 수 있으며, 이로 인해 일부 병사가 사망할 것이고 이는 노골적인 적대 행위로 간주됩니다."
 NIG_accepted_the_icj_ruling: "국제사법재판소 판결 수용"
 NIG_rejected_the_icj_ruling: "국제사법재판소 판결 거부"
 NIG_rejected_the_icj_ruling_2: "국제사법재판소 판결 거부"
 NIG_occupying_ambazonia: "암바조니아 점령"
 NIG_occupying_ambazonia_2: "암바조니아 점령"
 NIG_nigerian_land_of_harmony_idea_desc: "나이지리아의 종교적 차이는 정부가 어느 한쪽도 택하지 않도록 만들었습니다. 세속주의는 진정으로 나이지리아에 최선의 이익이 되며, 이 나라의 미래를 세속 국가로서 보장합니다. 아울러 기독교도와 무슬림을 포함한 모든 종교를 위한 진정한 화합과 평화의 땅으로서 아프리카에서 나이지리아의 입지를 영구히 굳혀 줍니다."
 NIG_state_run_markets_idea_desc: "나이지리아 정부는 시장에 대한 더 강력한 규제와 추가적인 정부 통제에 초점을 맞춘 일련의 새로운 법안을 통과시켰습니다. 추가 규제와 강화된 통제는 정부 건설 사업과 기반시설 개발의 새로운 성장을 가져왔습니다."
 NIG_armor_production_idea_desc: "전차, 장갑차, 보병전투차 등 기갑 차량의 국내 생산을 강조하면 기계화 부대에 필요한 핵심 장비를 생산하기 위한 해외 국가에 대한 의존을 줄일 수 있습니다. 나아가 나이지리아 국민을 위한 일자리와 기회를 추가로 창출하고, 국가에 새로운 부의 통로를 열어 줄 가능성도 있습니다."
 NIG_coastal_forces_production_idea_desc: "나이지리아 정부는 나이지리아 해군의 효율성을 높이기 위해 일련의 표적 투자와 추가 정책을 시행했습니다. 이를 통해 우리 해안과 해역에 대한 올바른 주권을 보장하기 위한 해군 함정과 연안 전력의 추가 생산을 늘릴 수 있게 되었습니다."
 NIG_nigerian_peacekeepers_idea_desc: "나이지리아 군은 분쟁 해결에서 쌓은 폭넓은 경험을 바탕으로 아프리카 전역에서 평화유지군을 제공하는 선도국으로 자리매김했습니다. 우리 병력은 불안정한 지역을 안정시키는 전문성과 효율성으로 높은 존경을 받고 있습니다. 평화유지군을 파견하고 인접국에 군사적 지원을 제공함으로써, 나이지리아는 지역 안보와 대륙의 번영에 대한 헌신을 보여 줍니다. 이러한 노력은 우리의 외교적 위상을 높일 뿐 아니라 아프리카가 지속적인 평화와 발전으로 나아가는 여정에도 크게 기여합니다."
 NIG_victory_is_from_god_alone_idea_desc: "'승리는 오직 신으로부터'라는 문구는 1960년대 창설 이래 나이지리아 육군의 표어였습니다. 이는 나이지리아 국민에게 종교가 지니는 중요성을 담고 있습니다."
 NIG_the_new_nigerian_caliph_idea_desc: "나이지리아 정부는 새로운 칼리파국을 세우기 위한 일련의 법안을 통과시켰습니다. 이로써 이슬람 활동이 새롭게 부상하고 새로운 칼리파국이 형성될 수 있게 되었습니다."
 NIG_reformed_ndcc_idea_desc: "니제르 삼각주 개발 위원회(NDDC)는 니제르 삼각주 지역의 필요에 더 잘 부응하도록 개혁되었습니다. 새 위원회는 이 지역의 기반시설 개발, 교육, 의료, 경제 개발에 집중할 것입니다."
 NIG_bakassi_occupation_idea: "바카시 반도"
 NIG_bakassi_occupation_idea_desc: "니제르 삼각주의 자원이 풍부한 지역인 바카시 반도는 카메룬의 영유권 주장에도 불구하고 여전히 우리의 통제하에 있습니다. 카메룬이 반도의 반환을 청원했으나 우리는 입장을 유지해 왔습니다. 국제사법재판소가 현재 이 영토의 정당한 소유권을 심의하고 있습니다. 이 기간 동안 우리는 반도에서 석유를 계속 채굴하고 수출하여 국내 경제와 국제 무역 모두에 이익을 얻고 있습니다."
 NIG_bakassi_occupation_idea_tt: "우리가 §Y바카시 반도§!를 통제하는 동안, §Y[322.GetName]§!에 대한 §G자원 권리§!를 보유합니다.\n"
 NIG_reckless_growth_idea: "무모한 성장"
 NIG_reckless_growth_idea_desc: "유례없고 급속한 경제 성장을 추구한 나이지리아 정부의 노선은 심각한 대가를 치렀습니다. 부족민과 도시 주민을 막론하고 지역 사회가 이 무모한 개발 전략의 타격을 고스란히 받고 있습니다."
 NIG_convert_state_338_desc: "소코토 주는 나이지리아 북부에서 가장 북서쪽에 위치한 주입니다. 하우사-풀라니족과의 역사적 유대, 그리고 과거 소코토 칼리파국과의 역사적 유대로 인해 나이지리아 무슬림에게 매우 중요한 주입니다. 또한 이 나라와 서아프리카 지역 전체에서 이슬람 교학의 가장 중요한 거점 중 하나이기도 합니다."
 NIG_convert_state_340_desc: ""
 NIG_convert_state_334_desc: "라고스 주는 같은 이름의 도시가 이끄는, 나이지리아와 아프리카에서 가장 큰 대도시권 중 하나가 자리한 곳입니다. 이 주는 경제 활동의 주요 원천 중 하나이자 국가 인구의 상당 부분이 거주하는 고밀도 도시 중심지입니다. 이 지역은 다종교 지역이지만, 과거 영국 식민 통치와 서아프리카 해안의 주요 항구라는 위치 때문에 기독교도가 다수입니다."
 NIG_convert_state_336_desc: ""
 NIG_convert_state_322_desc: ""
 NIG_expand_hydro_decisions_category: "수력 발전 사업 확대"
 NIG_expand_hydro_decisions_category_desc: "나이지리아 연방 정부는 전국에서 수력 발전 사업의 확대를 가능하게 하는 일련의 새로운 계획과 법안을 마련했습니다. 전력을 생산하고 석유 의존도를 줄이며, 나이지리아가 세계 재생 에너지 분야의 선도국이 되는 동시에 수출용 석유를 확보할 수 있도록 이 사업들에 투자하는 방안을 검토해야 합니다."
 NIG_construct_the_mambilla_hydroelectric_power_plant: "맘빌라 수력 발전소 건설"
 NIG_construct_the_mambilla_hydroelectric_power_plant_desc: "맘빌라 사업은 아프리카 전체에서 가장 큰 수력 발전 사업 중 하나입니다. 완공까지 수십억 달러가 들 것으로 추산되며, 완공 시 설비 용량은 3050MW로 세계에서 가장 큰 용량의 수력 발전소 중 하나이자 아프리카 최대급 발전소가 됩니다. 동가 강 위에 들어서는 이 발전소는 댐 4개와 지하 발전소 2기로 구성되며, 인근 지역에 일자리가 대거 창출되는 큰 혜택이 될 것으로 기대됩니다."
 NIG_construct_the_kashimbila_hydroelectric_power_plant: "카심빌라 수력 발전소 건설"
 NIG_construct_the_kashimbila_hydroelectric_power_plant_desc: "나이지리아 북동부 타라바 주에 위치한 카심빌라 수력 발전소는 카치나알라 강 위에 자리한 발전소입니다. 이 수력 발전소를 건설하면 완공 후 타라바 주 전력 수요의 80~90% 이상을 충당할 것으로 추산됩니다."
 NIG_construct_the_zungeru_hydroelectric_power_plant: "중게루 수력 발전소 건설"
 NIG_construct_the_zungeru_hydroelectric_power_plant_desc: "니제르 주의 카두나 강 일대에 건설되는 이 발전소는 700MW 규모의 대형 수력 발전소입니다. 연간 2800GWh 이상의 전력을 생산할 것으로 추산되며, 카인지 수력 발전소에 이어 국내에서 두 번째로 큰 수력 발전소가 됩니다."
 NIG_construct_the_gurara_hydroelectric_power_plant: "구라라 II 수력 발전소 건설"
 NIG_construct_the_gurara_hydroelectric_power_plant_desc: "구라라 II 수력 발전소는 인상적인 360MW의 전력을 생산할 대규모 수력 발전 사업입니다. 구라라 강 위에 위치하며 연간 발전량은 1130GWh로 예상되는 이 발전소는 우리나라를 계속 현대화하고 현대화된 산업 국가라는 목표에 한 걸음 더 다가가게 할 절호의 기회입니다."
 nigeria_md.100.t: "잠파라의 샤리아 법"
 nigeria_md.100.d: "놀라운 사건 전개로 잠파라 주가 샤리아 법을 법 체계로 확립했습니다. 이것이 예상치 못한 일도, 이 지역에 낯선 일도 아니지만, 국가에는 여전히 중대한 변화이며 우리나라 북부에 큰 영향을 미칠 것입니다. 이 지역의 기독교 활동가들은 이미 결집하기 시작했으며 지역 정부와 샤리아 법 도입에 반대하는 소규모 표적 시위를 준비하고 있습니다. 샤리아가 이 나라의 모든 무슬림 지역을 장악하는 것은 시간문제입니다."
 nigeria_md.100.a: "우려스러운 전개로군..."
 nigeria_md.100.b: "경고를 전달한다"
 nigeria_md.101.t: "카두나의 종교 폭력"
 nigeria_md.101.d: "여러 주가 샤리아 법을 시행하기로 선택한 뒤, 카두나 주의 기독교 소수자들이 결집하기 시작했으며 지역 정부와 샤리아 법 도입에 반대하는 소규모 표적 시위를 준비하고 있습니다. 샤리아가 이 나라의 모든 무슬림 지역을 장악하는 것은 시간문제입니다."
 nigeria_md.101.a: "상황을 완화한다"
 nigeria_md.101.b: "상황을 무시한다"
 nigeria_md.102.t: "미스 월드를 둘러싼 아부자의 종교 폭동"
 nigeria_md.102.d: "미스 월드 대회가 아부자에서 열릴 예정이며 사람들이 이를 두고 폭동을 일으키고 있습니다. 기독교 다수파는 무슬림 국가가 대회를 개최한다는 사실에 폭동을 일으키고, 무슬림은 기독교 국가가 대회를 개최한다는 사실에 폭동을 일으키고 있습니다. 상황은 긴박하며 폭력 사태로 이어질 수 있습니다."
 nigeria_md.102.a: "대회를 금지한다"
 nigeria_md.102.b: "현지에서 알아서 처리하도록 맡긴다"
 nigeria_md.103.t: "바카시 반도"
 nigeria_md.103.d: "바카시 반도는 암바조니아 남부의 석유가 풍부한 지역으로, 40년 가까이 우리나라의 일부였습니다. 그러나 국제사법재판소는 카메룬에 유리한 판결을 내리고 나이지리아가 반도를 카메룬에 양도할 것을 명령했습니다. 어떻게 해야 합니까? 국제사법재판소의 결정을 받아들이고 철수할 수도 있고, 카메룬이 반도에 대해 어떠한 권리가 있다는 이 터무니없는 주장을 포기하도록 밀어붙일 수도 있습니다."
 nigeria_md.103.a: "국제사법재판소의 결정을 수용한다"
 nigeria_md.103.b: "국제사법재판소의 결정을 거부한다"
 nigeria_md.104.t: "라고스 건물 붕괴"
 nigeria_md.104.d: "라고스에서 건물이 붕괴했으며, 적절한 건축 규정과 규제의 부재가 원인으로 여겨집니다. 이 건물은 라고스시에 새로 지어진 쇼핑센터였습니다. 건물이 적절한 허가 없이 지어졌고 규정에 부합하지 않았던 것으로 여겨집니다."
 nigeria_md.104.a: "피해를 배상한다"
 nigeria_md.104.b: "지방 당국이 처리하도록 맡긴다"
 nigeria_md.105.t: "제1회 아프리카 영화 아카데미상"
 nigeria_md.105.d: "제1회 아프리카 영화 아카데미상 시상식이 예나고아에서 열립니다. 이 행사에는 대륙 전역에서 많은 참석자가 모일 것으로 예상됩니다. 이는 우리의 문화를 선보이고 우리나라를 사업하기 좋은 곳으로 홍보할 절호의 기회입니다."
 nigeria_md.105.a: "멋진 기분 전환이다"
 nigeria_md.106.t: "라고스 무기고 폭발"
 nigeria_md.106.d: "라고스 무기고에서 폭탄이 터졌으며, 적절한 보안 조치의 부재가 원인으로 여겨집니다. 폭발은 나이지리아 정부에 반대하는 무장 단체가 설치한 폭탄 때문에 일어났습니다. 이 폭발로 무기고에 막대한 피해가 발생했고 다수의 사망자가 나왔습니다."
 nigeria_md.106.a: "폭발을 조사한다"
 nigeria_md.106.b: "피해는 이미 발생했다. 이제 넘어갈 때다."
 nigeria_md.107.t: "포트하커트에서 나이지리아 무장 세력의 공격"
 nigeria_md.107.d: "한 무장 세력이 포트하커트 항구를 공격했으며 이들은 나이지리아 정부에 반대하는 것으로 여겨집니다. 무장 세력은 다수의 사람을 살해했고 항구에 막대한 피해를 입혔습니다."
 nigeria_md.107.a: "군을 투입한다"
 nigeria_md.107.b: "지방 경찰이 처리하도록 맡긴다"
 nigeria_md.108.t: "라고스 송유관 폭발"
 nigeria_md.108.d: "라고스에서 송유관이 폭발했으며, 적절한 유지 관리의 부재가 원인으로 여겨집니다. 폭발은 제대로 유지 관리되지 않았고 규정에 부합하지 않았던 송유관 때문에 일어났습니다."
 nigeria_md.108.a: "폭발을 조사한다"
 nigeria_md.108.b: "지방 당국이 처리하도록 맡긴다"
 nigeria_md.109.t: "잠파라의 댐 붕괴"
 nigeria_md.109.d: "잠파라에서 댐이 붕괴했으며, 적절한 유지 관리의 부재가 원인으로 여겨집니다. 이 댐은 잠파라 주에 새로 지어진 댐이었습니다. 댐이 적절한 허가 없이 지어졌고 규정에 부합하지 않았던 것으로 여겨집니다."
 nigeria_md.109.a: "붕괴를 조사한다"
 nigeria_md.109.b: "지방 당국이 처리하도록 맡긴다"
 nigeria_md.110.t: "선거를 앞두고 격화되는 폭력"
 nigeria_md.110.d: "선거가 다가오면서 폭력이 늘어나기 시작하고 있습니다. 기독교 다수파는 무슬림 국가가 선거를 주관한다는 사실에 폭동을 일으키기 시작했고, 무슬림은 기독교 국가가 선거를 주관한다는 사실에 폭동을 일으키기 시작했습니다. 상황은 긴박하며 폭력 사태로 이어질 수 있습니다."
 nigeria_md.110.a: "경비를 강화하고 투표함을 보호한다"
 nigeria_md.110.b: "상황이 흘러가는 대로 둔다"
 nigeria_md.111.t: "카두나 주의 휘발유 유출"
 nigeria_md.111.d: "카두나 주에서 휘발유 유출 사고가 발생했으며, 적절한 유지 관리의 부재가 원인으로 여겨집니다. 유출은 제대로 유지 관리되지 않았고 규정에 부합하지 않았던 휘발유 탱크 때문에 일어났습니다."
 nigeria_md.111.a: "해당 지역에 연방군을 배치한다"
 nigeria_md.111.b: "지방 당국이 처리하도록 맡긴다"
 nigeria_md.112.t: "이제군 송유관 폭발"
 nigeria_md.112.d: "이제군에서 송유관이 폭발했으며, 적절한 유지 관리의 부재가 원인으로 여겨집니다. 폭발은 제대로 유지 관리되지 않았고 규정에 부합하지 않았던 송유관 때문에 일어났습니다."
 nigeria_md.112.a: "폭발을 조사한다"
 nigeria_md.112.b: "지방 당국이 처리하도록 맡긴다"
 nigeria_md.113.t: "바우치 주에서 이슬람 극단주의자의 공격"
 nigeria_md.113.d: "한 이슬람 극단주의 집단이 바우치 주를 공격했으며 이들은 나이지리아 정부에 반대하는 것으로 여겨집니다. 극단주의자들은 다수의 사람을 살해했고 주에 막대한 피해를 입혔습니다."
 nigeria_md.113.a: "군을 투입한다"
 nigeria_md.113.b: "지방 당국이 처리하도록 맡긴다"
 nigeria_md.114.t: "아페 바발롤라 대학교 설립"
 nigeria_md.114.d: "나이지리아에 설립자 아페 바발롤라의 이름을 딴 새 대학교가 설립되었습니다. 이 대학교는 사립 대학교이며 국가 교육 부문에서 주요한 역할을 할 것으로 기대됩니다."
 nigeria_md.114.a: "멋진 기회다"
 nigeria_md.115.t: "나이지리아 홍수"
 nigeria_md.115.d: "나이지리아 정부는 전국을 덮친 홍수로 인해 비상사태를 선포했습니다. 홍수는 나라에 막대한 피해를 입혔고 다수의 사망자를 냈습니다."
 nigeria_md.115.a: "자연의 흐름에 맡겨야 한다"
 nigeria_md.115.b: "해당 지역에 군을 배치한다"
 nigeria_md.115.c: "지방 당국에 자금을 지원한다"
 nigeria_md.116.t: "피로 물든 50주년 기념식"
 nigeria_md.116.d: "나이지리아가 독립 50주년을 기념하는 가운데, 즐거워야 했을 행사가 비극으로 변했습니다. 니제르 삼각주 해방 운동(MEND)은 앞서 기념식 기간 중 공격을 계획하고 있다고 경고했으며, 그 위협을 실행에 옮겼습니다. 아부자에서 일어난 폭탄 테러로 여러 명이 사망하고 더 많은 사람이 부상을 입어 나라의 50주년 기념식에 그늘을 드리웠습니다. 이번 공격은 나라가 이미 정부의 비상사태 선포를 불러온 참혹한 홍수에 대처하고 있는 특히 어려운 시기에 일어났습니다."
 nigeria_md.116.a: "참으로 비극적인 날이다"
 nigeria_md.117.t: "자키비암 학살"
 nigeria_md.117.d: "자키비암에서 학살이 발생했으며, 적절한 보안 조치의 부재가 원인으로 여겨집니다. 이 학살은 나이지리아 정부에 반대하는 무장 단체가 일으켰습니다. 학살로 다수의 사람이 목숨을 잃었고 주에 막대한 피해가 발생했습니다."
 nigeria_md.117.a: "지방 당국에 추가 자금을 지원한다"
 nigeria_md.117.b: "군이 내부적으로 상황을 조사하도록 허용한다"
 nigeria_ambazonia.1.t: "우리에게 선택의 여지가 있는가?"
 nigeria_ambazonia.1.d: "나이지리아가 바카시 반도를 우리에게 양도하라는 국제사법재판소의 결정을 거부하기로 했습니다. 우리의 선택지가 무엇인지 분명하지 않습니다. 양보하고 반도에서 철수할 수도, 반도를 위해 싸울 수도, 아니면 나이지리아에 결정을 재고하라고 호소할 수도 있습니다. 어떻게 해야 합니까?"
 nigeria_ambazonia.1.a: "바카시는 정당하게 우리 것이다"
 nigeria_ambazonia.1.b: "우리 스스로 해결한다"
 nigeria_ambazonia.1.c: "바카시에서 철수한다"
 nigeria_ambazonia.2.t: "첫 발포"
 nigeria_ambazonia.2.d: "카메룬 병사들이 바카시 반도에서 우리 군과 교전을 벌였습니다. 이 지역의 병력은 진지를 지키려 했고 카메룬군의 선봉을 저지했습니다. 우리가 조치를 취하지 않으면 이는 시간문제로 확대될 것이며, 그렇지 않으면 계속 격화될 것입니다. 어떻게 해야 합니까?"
 nigeria_ambazonia.2.a: "반격하라!"
 nigeria_ambazonia.2.b: "나이지리아, 바카시를 양보하다"
 nigeria_ambazonia.3.t: "항복"
 nigeria_ambazonia.3.d: "카메룬이 바카시 반도를 우리에게 넘겨주었습니다. 이제 우리의 승리를 축하하고, 바카시 지역과 주변 지역을 통치하는 우리 관계의 다음 장으로 나아갈 때입니다."
 nigeria_ambazonia.3.a: "바카시는 정당하게 우리 것이다!"
 nigeria_ambazonia.4.t: "요청"
 nigeria_ambazonia.4.d: "카메룬이 우리에게 바카시 반도에서 철수할 것을 요청했습니다. 어떻게 해야 합니까? 입장을 더욱 굳히고 반도를 위해 싸울 수도 있고, 양보하고 반도에서 철수할 수도 있습니다. 이 선택은 이 지역의 미래와 우리나라와 카메룬 간의 관계를 결정할 것입니다."
 nigeria_ambazonia.4.a: "반격하라!"
 nigeria_ambazonia.4.b: "반도를 양보한다"
 nigeria_ambazonia.5.t: "바카시를 방어하는 나이지리아"
 nigeria_ambazonia.5.d: "나이지리아가 카메룬으로부터 바카시 반도를 방어했습니다. 이것이 나이지리아 정부의 다른 조치로 이어질지는 불분명하지만, 당분간 반도는 나이지리아의 수중에 남아 있으며 카메룬은 다음 행보를 결정해야 합니다."
 nigeria_ambazonia.5.a: "바카시를 양보한다"
 nigeria_ambazonia.5.b: "갈등을 확대한다"
 nigeria_ambazonia.6.t: "바카시를 양보한 나이지리아"
 nigeria_ambazonia.6.d: "나이지리아가 바카시 반도를 카메룬에 양도했습니다. 국제사법재판소의 판결을 따르는 데 처음에는 주저했으나, 마침내 반도를 카메룬에 넘겨주었습니다. 이것이 나이지리아 정부의 다른 조치로 이어질지는 불분명하지만, 카메룬이 전면전 없이 이번 외교 분쟁에서 승리했음은 분명합니다."
 nigeria_ambazonia.6.a: "바카시는 정당하게 우리 것이다!"
 nigeria_ambazonia.7.t: "암바조니아를 병합한 나이지리아"
 nigeria_ambazonia.7.d: "국제사법재판소의 판결에도 불구하고 카메룬은 바카시 반도를 나이지리아에 양보했으며, 암바조니아의 나머지 지역도 나이지리아에 병합되었습니다. 이것이 카메룬 정부의 다른 조치로 이어질지는 불분명하지만, 나이지리아가 이제 바카시 반도 전체와 이 지역의 나머지를 통제하게 된 만큼 이번 싸움에서 대체로 승리했음은 분명합니다."
 nigeria_ambazonia.7.a: "또 한 번의 긴장 고조."
 nigeria_ambazonia.8.t: "제2차 암바조니아 전쟁"
 nigeria_ambazonia.8.d: "카메룬과 나이지리아 사이의 오랜 긴장이 최근 폭발한 뒤, 오늘 카메룬 남서부 지역에서 전투가 벌어졌습니다. 이번 전쟁의 발단은 국제사법재판소가 두 나라가 분쟁을 벌이던 석유가 풍부한 영토인 바카시 반도를 카메룬에 이양하라고 판결한 데 있습니다. 나이지리아는 이 결정에 강경하게 맞서고 있습니다."
 nigeria_ambazonia.8.a: "불안정한 지역."
 nigeria_ambazonia.9.t: "암바조니아에서 철수한 나이지리아"
 nigeria_ambazonia.9.d: "나이지리아가 더 이상의 확전 없이 암바조니아에서 철수했습니다. 이것이 나이지리아 정부의 다른 조치로 이어질지는 불분명하지만, 카메룬이 유혈 사태 없이 이번 외교 분쟁에서 승리했음은 분명합니다."
 nigeria_ambazonia.9.a: "냉철한 판단이 승리했다."
 nigeria_ambazonia.10.t: "바카시를 양보한 카메룬"
 nigeria_ambazonia.10.d: "카메룬 정부가 바카시 반도를 나이지리아에 양보했습니다. 이것이 카메룬 정부의 다른 조치로 이어질지는 불분명하지만, 현재로서는 나이지리아가 유혈 사태 없이 외교적으로 우위에 섰습니다."
 nigeria_ambazonia.10.a: "카메룬에게 힘든 하루다."
 NIG_has_converted_everything: "모든 [NIG.GetNameWithFlag] [NIG.GetAdjective] 주가 개종되었습니다."
 nigeria_md.11.t: "개종된 나라, 하나 된 나라들"
 nigeria_md.11.a: "만족스러운 결말이군..."
 nigeria_md.11.d: "[NIG.GetNameWithFlag] [NIG.GetAdjective] 주가 후원한 몇 달간의 맹렬한 종교 개종과 집중적인 종교 활동 끝에, 이 나라는 개종되었습니다. [NIG.GetNameWithFlag] [NIG.GetAdjective] 주는 이슬람으로, [NIG.GetNameWithFlag] [NIG.GetAdjective] 주는 기독교로 개종되었습니다. 이제 이 나라는 이슬람의 깃발 아래 하나로 통합된 나라입니다."
 NIG_military_solution: "군사적 해법"
 NIG_military_solution_desc: "니제르 삼각주 무장 세력은 오직 무력만을 이해합니다. 육군과 해군 요소를 결합한 합동 임무 부대를 투입하면 석유 기반시설을 확보하고 개울과 늪지의 무장 세력 거점을 제거할 수 있습니다. 이 접근법은 인명과 국제적 평판 면에서 대가가 클 수 있으나, 위기에 대한 결정적인 해결책을 제공합니다."
 NIG_address_niger_delta: "니제르 삼각주의 불만 해소"
 NIG_address_niger_delta_desc: "니제르 삼각주 위기의 근본 원인은 수십 년에 걸친 환경 파괴, 빈곤, 그리고 지역 사회에 대한 방치에 있습니다. 개발 프로그램과 지역 지도자들과의 진정한 소통을 통해 이러한 근본적 불만을 해소하면, 군사 행동에 따른 유혈 사태 없이 지속적인 평화를 만들어 낼 수 있습니다."
 NIG_negotiate_peace: "평화 협상"
 NIG_negotiate_peace_desc: "폭력에 폭력으로 맞서기보다 무장 세력 지도자들과 대화의 문을 열어야 합니다. 신중한 협상과 타협을 통해, 나이지리아의 핵심 석유 산업을 보호하면서 니제르 삼각주 지역 사회의 정당한 우려를 해소하는 평화적 해결을 이룰 수 있을 것입니다."
 NIG_nddc_reform: "NDDC 개혁"
 NIG_nddc_reform_desc: "니제르 삼각주 개발 위원회는 설립 이래 부패와 비효율에 시달려 왔습니다. 전면적인 개혁을 단행하고 유능한 지도부를 앉히며 적절한 감독을 보장함으로써, NDDC를 설립 취지대로 지역 사회에 실제로 혜택이 닿는 효과적인 개발 수단으로 탈바꿈시킬 수 있습니다."
 NIG_amnesty_program: "대통령 사면 프로그램"
 NIG_amnesty_program_desc: "전 세계의 성공적인 무장 해제 프로그램을 본받아, 무기를 내려놓는 니제르 삼각주 무장 세력에게 전면 사면을 제공할 것입니다. 전직 전투원들은 사회 복귀를 돕기 위한 재활, 직업 훈련, 월 수당을 받게 됩니다. 이 대담한 도박이 지속적인 평화를 위한 최선의 기회일 수 있습니다."
 NIG_oil_revenue_sharing: "석유 수익 분배 협정"
 NIG_oil_revenue_sharing_desc: "니제르 삼각주 지역 사회의 핵심 불만은 자신들의 땅에서 채굴되는 막대한 석유 부로부터 거의 혜택을 보지 못한다는 점입니다. 연방 정부, 주 정부, 지역 사회 간의 석유 수익을 보다 공정하게 분배하도록 협상함으로써, 이러한 불의를 바로잡고 반란의 주요 동력을 제거할 수 있습니다."
 NIG_niger_delta_resolved: "니제르 삼각주 문제 해결"
 NIG_niger_delta_resolved_desc: "개발, 협상, 개혁을 결합하여 마침내 니제르 삼각주 위기를 해결했습니다. 석유 생산은 최대 가동 수준으로 회복되었고, 전직 무장 세력은 성공적으로 사회에 복귀했으며, 지역 사회는 유례없는 번영을 누리고 있습니다. 니제르 삼각주는 분쟁 해결과 포용적 개발의 모범으로 자리 잡았습니다."
 nigeria_delta.1.t: "MEND의 부상"
 nigeria_delta.1.d: "니제르 삼각주의 개울과 늪지에서 나이지리아 석유 산업에 대한 새로운 위협이 등장했습니다. MEND로 알려진 니제르 삼각주 해방 운동은 NDPVF와 여러 민족 민병대를 포함한 무장 단체들의 연합으로 결성되었습니다. '조모 그봄보'라는 이름으로만 알려진 정체불명의 인물이 이끄는 MEND는 외국 석유 회사와 나이지리아 정부에 선전포고를 하며, 지역 사회에 석유 수익에 대한 더 큰 통제권을 부여하고 수십 년간의 채굴이 초래한 환경 파괴를 중단할 것을 요구하고 있습니다.\n\n그들의 첫 주요 행동인 외국인 석유 노동자 네 명의 납치는 국제 에너지 업계를 충격에 빠뜨렸습니다. 아프리카 최대 산유국이라는 나이지리아의 입지가 이제 직접적인 위협을 받고 있습니다. 이 커져 가는 반란에 어떻게 대응해야 합니까?"
 nigeria_delta.1.a: "군을 투입하여 무장 세력을 진압한다."
 nigeria_delta.1.b: "무장 세력 지도자들과 협상을 시작한다."
 nigeria_delta.1.c: "당분간 상황을 주시한다."
 nigeria_delta.2.t: "공격받는 석유 시추 시설"
 nigeria_delta.2.d: "MEND 무장 세력이 니제르 삼각주에서 셸이 운영하는 주요 석유 시추 시설에 치명적인 공격을 감행했습니다. 무장한 고속정들이 새벽에 시설을 에워싸 경비 병력을 제압하고 외국인 노동자들을 대피하게 했습니다. 핵심 기반시설의 피해는 이 지역의 석유 생산에 상당한 영향을 미칠 것입니다.\n\n국제 석유 회사들은 안전이 보장되지 않으면 사업을 전면 철수하겠다고 위협하고 있습니다. 우리는 이 격화되는 위기에 어떻게 대응할지 결정해야 합니다."
 nigeria_delta.2.a: "모든 석유 시설의 경비를 강화한다."
 nigeria_delta.2.b: "석유 회사들이 자체 경비를 맡도록 한다."
 nigeria_delta.3.t: "외국인 노동자 납치"
 nigeria_delta.3.d: "MEND가 니제르 삼각주의 셰브런 시설에서 외국인 석유 노동자 여러 명을 납치했습니다. 이 무장 단체는 수감된 조직원의 석방과 막대한 몸값 지급을 요구하고 있습니다. 인질의 무사 귀환을 위한 국제적 압력이 거세지고 있습니다.\n\n납치된 노동자들의 가족은 이들의 무사 석방을 호소하고 있습니다. 전 세계의 시선이 우리에게 쏠려 있으며, 이 상황을 어떻게 다루느냐가 국제 무대에서 나이지리아의 평판을 좌우할 것입니다."
 nigeria_delta.3.a: "몸값을 지불하여 석방을 확보한다."
 nigeria_delta.3.b: "군사 구출 작전을 개시한다."
 nigeria_delta.3.c: "협상을 통한 석방을 시도한다."
 nigeria_delta.4.t: "주요 송유관 파괴"
 nigeria_delta.4.d: "무장 세력이 니제르 삼각주의 주요 송유관을 따라 폭발물을 터뜨려 대형 화재와 심각한 환경 피해를 일으켰습니다. 원유를 삼각주에서 수출 터미널로 수송하는 트랜스니제르 송유관이 심하게 손상되었습니다.\n\n피해 지역의 석유 생산이 중단되었으며 정화 작업에는 수개월이 걸릴 것입니다. 지역 어업 공동체에 미친 환경적 영향은 파국적이며, 더 많은 신병이 무장 세력의 품으로 들어가도록 몰아갈 가능성이 있습니다."
 nigeria_delta.4.a: "남은 송유관을 보호하기 위해 군을 배치한다."
 nigeria_delta.4.b: "복구에 집중하고 군사 행동은 미룬다."
 nigeria_delta.5.t: "거세지는 국제적 압력"
 nigeria_delta.5.d: "미국과 영국이 니제르 삼각주의 악화되는 치안 상황에 대해 심각한 우려를 표명했습니다. 두 나라 모두 나이지리아 석유에 상당한 투자를 하고 있으며, 위기가 해결되지 않으면 외교적 결과를 초래하겠다고 위협하고 있습니다.\n\n이들은 반란에 대처하는 데 도움이 되는 재정 및 기술 지원을 제안했으나, 이 도움을 받아들이면 우리 내정에 대한 외세의 영향력이 커지는 것을 용인하게 됩니다. 반면 단독으로 대처하는 것은 비용이 많이 들고 효과가 없을 수도 있습니다."
 nigeria_delta.5.a: "국제 원조를 받아들인다."
 nigeria_delta.5.b: "이 위기는 우리 스스로 처리한다."
 nigeria_delta.10.t: "사면 제안"
 nigeria_delta.10.d: "나이지리아의 석유 생산을 3분의 1로 줄인 수년간의 분쟁 끝에, 정부는 대담한 새로운 접근법을 고려하고 있습니다. 바로 무장 해제를 대가로 니제르 삼각주 무장 세력에게 전면 사면을 제공하는 것입니다. 야라두아 대통령이 지지하는 이 제안은 전직 전투원들에게 재활, 훈련, 월 수당을 제공합니다.\n\n비판론자들은 무장 반란에 보상을 주는 것은 위험한 선례를 남긴다고 주장하는 반면, 지지자들은 군사적 접근이 실패했으며 대화만이 지속적인 평화로 가는 길이라고 주장합니다. 이 결정으로 약 2만 6천 명의 무장 세력이 영향을 받을 수 있습니다."
 nigeria_delta.10.a: "모든 무장 세력에게 전면 사면을 제공한다."
 nigeria_delta.10.b: "엄격한 조건을 단 조건부 사면을 제공한다."
 nigeria_delta.10.c: "대신 군사 작전을 계속한다."
 nigeria_delta.11.t: "사면 프로그램: 결과"
 nigeria_delta.11.d: "대통령 사면 프로그램이 종료되었습니다. 수천 명의 전직 무장 세력이 무기를 내려놓고 재활 프로그램에 들어갔습니다. 니제르 삼각주의 개울은 수년 만에 가장 조용해졌습니다.\n\n이 프로그램의 성공은 회수된 무기의 수뿐 아니라 이 지역에서 지속적인 평화가 유지될 수 있는지 여부로 판단될 것입니다. 환경 파괴, 빈곤, 개발 부족이라는 근본적인 불만은 대부분 해결되지 않은 채 남아 있습니다."
 nigeria_delta.11.a: "사면은 성공했다 - 삼각주에 평화가 돌아왔다."
 nigeria_delta.11.b: "부분적 성공이다 - 그러나 과제는 남아 있다."
 nigeria_delta.11.c: "사면은 실패했다 - 폭력이 되돌아올 것이다."
 nigeria_delta.12.t: "사면 프로그램 붕괴"
 nigeria_delta.12.d: "대통령 사면 프로그램이 붕괴했습니다. 전직 무장 세력은 약속된 지급이 이루어지지 않았고, 훈련 프로그램이 부실하며, 부패로 인해 재활을 위한 자금이 빼돌려졌다고 불평합니다. 많은 이들이 예전의 방식으로 돌아갔으며, 개울에서는 새로운 세대의 전투원이 출현하고 있습니다.\n\n협상으로 얻은 위태로운 평화가 깨졌습니다. 니제르 삼각주에서의 재개된 분쟁에 대비해야 합니다."
 nigeria_delta.12.a: "최악에 대비한다."
 nigeria_delta.20.t: "니제르 삼각주 복수자들"
 nigeria_delta.20.d: "니제르 삼각주에 새로운 무장 단체가 등장했습니다. '니제르 삼각주 복수자들'이라 자칭하는 이들은 MEND의 이전 공격마저 능가하는 석유 기반시설 파괴 공작을 조직적으로 벌이기 시작했습니다. 이들의 정교한 작전은 전직 MEND 지휘관들과의 연계를 시사합니다.\n\n복수자들은 정부가 니제르 삼각주 주민들과의 약속을 깼으며 오직 무력만이 변화를 강제할 수 있다고 주장합니다. 나이지리아의 석유 생산이 이 새로운 반란으로 다시 위협받고 있습니다."
 nigeria_delta.20.a: "합동 임무 부대를 즉시 투입한다."
 nigeria_delta.20.b: "대화를 통해 상황을 해결한다."
 nigeria_delta.21.t: "니제르 삼각주 비상사태"
 nigeria_delta.21.d: "니제르 삼각주의 치안 상황은 정상적인 통치가 불가능한 수준까지 악화되었습니다. 무장 세력이 이 지역의 넓은 지역을 장악했고, 석유 생산은 붕괴했으며, 폭력은 확산되고 있습니다.\n\n군은 위기에 대처하기 위한 비상 권한을 요청하고 있습니다. 비상사태는 통행금지, 대규모 체포, 민간의 감독 없는 군사 작전을 가능하게 합니다. 이것이 질서를 회복하는 유일한 방법일 수 있으나, 이 지역을 더 큰 혼란으로 몰아넣을 수도 있습니다."
 nigeria_delta.21.a: "비상사태를 선포한다."
 nigeria_delta.21.b: "평시 체제를 유지한다."
 nigeria_delta.30.t: "니제르 삼각주의 평화"
 nigeria_delta.30.d: "수년간의 분쟁, 협상, 그리고 신중한 개혁 끝에 니제르 삼각주 위기가 마침내 해결되었습니다. 석유 생산은 최대 가동 수준으로 회복되었고 이 지역은 유례없는 발전을 누리고 있습니다. 전직 무장 세력은 성공적으로 사회에 복귀했으며, 지역 사회는 마침내 나이지리아 석유 부의 혜택을 보고 있습니다.\n\n분쟁의 상처는 남아 있으나 미래는 수십 년 만에 가장 밝아 보입니다. 니제르 삼각주는 불만이 해소되고 모든 이해관계자가 평화를 위해 함께 노력할 때 무엇을 이룰 수 있는지를 보여 주는 증거로 서 있습니다."
 nigeria_delta.30.a: "니제르 삼각주에 새로운 장이 열린다."
 nigeria_delta.100.t: "나이지리아에 MEND 등장"
 nigeria_delta.100.d: "니제르 삼각주 해방 운동이라는 새로운 무장 단체가 나이지리아에 등장하여 아프리카 최대 산유국이라는 이 나라의 입지를 위협하고 있습니다. 국제 석유 회사들은 고도의 경계 태세에 들어갔습니다."
 nigeria_delta.100.a: "실로 우려스러운 전개로군."
 nigeria_delta.102.t: "니제르 삼각주 복수자들의 공격"
 nigeria_delta.102.d: "'니제르 삼각주 복수자들'이라 자칭하는 새로운 무장 단체가 나이지리아 석유 기반시설에 공격을 개시했습니다. 정부가 이 새로운 위협에 대응하기 위해 허둥대는 가운데 생산에 상당한 타격이 발생했습니다."
 nigeria_delta.102.a: "폭력의 악순환이 이어지는군."
 NIG_amnesty_success_tt: "사면 프로그램이 성공했습니다. 2만 6천 명이 넘는 무장 세력이 무기를 내려놓고 재활에 들어갔습니다."
 NIG_niger_delta_crisis_1: "니제르 삼각주 무장 세력 불안"
 NIG_niger_delta_crisis_1_desc: "니제르 삼각주의 무장 단체들이 석유 생산을 방해하고 외국인 노동자들을 위협하고 있습니다. 아직은 관리 가능한 수준이지만, 확대를 막기 위해 주의가 필요한 상황입니다."
 NIG_niger_delta_crisis_2: "MEND 반란"
 NIG_niger_delta_crisis_2_desc: "니제르 삼각주 해방 운동이 석유 회사와 정부군을 상대로 전면적인 반란을 일으켰습니다. 기반시설에 대한 공격이 격화되면서 석유 생산이 크게 감소했습니다."
 NIG_niger_delta_crisis_3: "전면 봉기한 니제르 삼각주"
 NIG_niger_delta_crisis_3_desc: "니제르 삼각주가 공공연한 봉기 상태에 있습니다. 무장 세력이 이 지역의 넓은 지역을 장악했고, 석유 생산은 3분의 1로 붕괴했으며, 외국 기업들은 인원을 철수시키고 있습니다. 이는 나이지리아 경제에 대한 존립 위협입니다."
 NIG_amnesty_program_idea: "대통령 사면 프로그램"
 NIG_amnesty_program_idea_desc: "정부는 무기를 내려놓는 전직 무장 세력에게 재활, 훈련, 수당을 제공하는 야심 찬 사면 프로그램을 시작했습니다. 이 프로그램은 상당한 자원을 필요로 하지만 지속적인 평화에 대한 희망을 줍니다."
 NIG_failed_amnesty_idea: "실패한 사면 프로그램"
 NIG_failed_amnesty_idea_desc: "대통령 사면 프로그램이 실패했습니다. 전직 무장 세력은 깨진 약속에 대해 불평하고 있으며 많은 이들이 폭력으로 돌아갔습니다. 니제르 삼각주의 개울에서는 새로운 세대의 전투원이 출현하고 있습니다."
 NIG_niger_delta_avengers_idea: "니제르 삼각주 복수자들"
 NIG_niger_delta_avengers_idea_desc: "새로운 무장 단체인 니제르 삼각주 복수자들이 석유 기반시설에 정교한 공격을 감행했습니다. 이들의 작전은 전직 MEND 지휘관들과의 연계를 시사하며 석유 생산에 심각한 타격을 입혔습니다."
 NIG_nddc_reformed_idea: "개혁된 NDDC"
 NIG_nddc_reformed_idea_desc: "니제르 삼각주 개발 위원회가 지역 사회의 필요에 더 잘 부응하도록 개혁되었습니다. 부패가 줄었으며 개발 사업이 실제로 지원 대상인 사람들에게 닿고 있습니다."
 NIG_oil_revenue_sharing_idea: "석유 수익 분배 협정"
 NIG_oil_revenue_sharing_idea_desc: "새로운 협정으로 석유 수익의 더 큰 몫이 니제르 삼각주 지역 사회로 흘러가게 되었습니다. 이는 불만을 크게 줄였으며 정부와 지역 주민 사이의 관계를 개선했습니다."
 NIG_joint_task_force_idea: "합동 임무 부대 활동 중"
 NIG_joint_task_force_idea_desc: "무장 세력에 대한 작전을 수행하기 위해 합동 군사 임무 부대가 니제르 삼각주에 배치되었습니다. 공격을 줄이는 데는 효과적이지만, 군의 주둔은 지역 사회와의 마찰도 일으키고 있습니다."
 NIG_niger_delta_resolved_idea: "니제르 삼각주 평화"
 NIG_niger_delta_resolved_idea_desc: "니제르 삼각주 위기는 협상, 개발, 안보 조치의 결합을 통해 해결되었습니다. 이 지역은 유례없는 평화와 번영을 누리고 있으며 석유 생산은 사상 최고치에 도달했습니다."
 NIG_niger_delta_decisions_category: "니제르 삼각주 위기"
 NIG_niger_delta_decisions_category_desc: "니제르 삼각주 반란을 관리하고 위기에 대한 해법을 시행하는 것과 관련된 결정입니다."
 NIG_naval_patrol_gulf_of_guinea: "해군 순찰 - 기니 만"
 NIG_naval_patrol_gulf_of_guinea_desc: "해적을 퇴치하고 해상 석유 시추 시설을 보호하기 위해 기니 만에 해군 순찰대를 배치합니다."
 NIG_protect_oil_infrastructure: "석유 기반시설 보호"
 NIG_protect_oil_infrastructure_desc: "무장 세력의 공격으로부터 니제르 삼각주의 핵심 석유 기반시설을 보호하기 위해 보안 병력을 배치합니다."
 NIG_negotiate_with_militant_leaders: "무장 세력 지도자들과 협상"
 NIG_negotiate_with_militant_leaders_desc: "평화의 가능성을 모색하기 위해 니제르 삼각주 무장 세력 지도자들과 비공식 협상을 시작합니다."
 NIG_implement_amnesty_program: "사면 프로그램 시행"
 NIG_implement_amnesty_program_desc: "무기를 내려놓는 무장 세력에게 재활과 수당을 제공하는 대통령 사면 프로그램을 시작합니다."
 NIG_reintegration_training: "사회 복귀 훈련"
 NIG_reintegration_training_desc: "전직 무장 세력의 성공적인 사회 복귀 가능성을 높이기 위해 추가 훈련 및 재활 프로그램에 자금을 지원합니다."
 NIG_oil_revenue_sharing_agreement: "석유 수익 분배 협정"
 NIG_oil_revenue_sharing_agreement_desc: "석유 수익의 더 공정한 분배를 보장하기 위해 석유 회사 및 지역 사회와 협정을 협상합니다."
 NIG_environmental_cleanup_program: "환경 정화 프로그램"
 NIG_environmental_cleanup_program_desc: "환경 피해를 해결하고 니제르 삼각주의 반체제 인사들을 달래기 위해 대규모 정화 프로그램을 시작합니다."
 NIG_request_international_mediation: "국제 중재 요청"
 NIG_request_international_mediation_desc: "니제르 삼각주 위기를 중재하는 데 도움을 얻기 위해 국제 사회에 지원을 요청합니다."
 NIG_reform_nddc: "NDDC 개혁"
 NIG_reform_nddc_desc: "부패를 줄이고 지역 사회에 대한 개발 사업의 전달을 개선하기 위해 니제르 삼각주 개발 위원회를 개혁합니다."
 NIG_islamic_state: "나이지리아 이슬람 국가"
 NIG_islamic_states_response_TT: "§Y수락하는 각 국가는 나이지리아의 이슬람 국가 연합에 가입합니다.§!"
 NIG_military_solution_path: "니제르 삼각주 위기에 대한 군사적 해법 추진"
 NIG_amnesty_succeeded: "사면 프로그램 성공"
 NIG_amnesty_partial: "사면 프로그램 부분적 성공"
 NIG_amnesty_failed: "사면 프로그램 실패"
 NIG_negotiating_with_militants: "니제르 삼각주 무장 세력과 협상 중"
 NIG_amnesty_active: "사면 프로그램 진행 중"
 NIG_accepted_international_help: "삼각주에서 해외 지원 수용"
 NIG_delta_military_tt: "§Y석유를 더 많이 채굴할 수 있으나 정치적 안정도에는 해가 될 수 있습니다!§!"
 NIG_delta_negotiation_tt: "§Y정치적 안정도는 뒷받침할 수 있으나 석유 생산량에는 해가 될 수 있습니다!§!"
 nigeria_delta.19.t: "대통령 사면 프로그램 갱신"
 nigeria_delta.19.d: "대통령 사면 프로그램은 니제르 삼각주의 무장 활동을 억제하는 데 효과적이었으나, 일각에서는 이것이 뇌물이나 다름없다고 주장합니다. 정부는 지역 지도자들을 달래고 전직 무장 세력의 사회 복귀 훈련을 제공하는 데 터무니없는 금액을 쓰고 있습니다. 어쩌면 이 프로그램을 폐지해야 할지도 모릅니다."
 nigeria_delta.19.a: "프로그램을 종료할 때다."
 nigeria_delta.19.b: "프로그램을 계속해야 한다."
 NIG_amnesty_renewal_warning_tt: "§Y지역 지도자들의 반발을 불러올 수 있으나, 장기적으로는 성과가 있을 수 있습니다!§!"
 NIG_oil_sharing_tt: "§Y협정의 결과는 위기에 대해 어떤 해법을 추구하느냐에 따라 달라집니다! §!"
 NIG_suppress_delta_militants: "무장 활동 진압"
 NIG_suppress_delta_militants_desc: "군과 경찰력을 동원하여 석유 기반시설을 파괴하는 니제르 삼각주의 무장 세력을 진압합니다."
 NIG_ongoing_negotiations: "진행 중인 협상"
 NIG_ongoing_negotiations_desc: "위기에 대한 해법을 찾기 위해 정부와 니제르 삼각주 무장 세력 사이의 평화 회담이 진행되고 있습니다."
 NIG_enlist_the_militias: "민병대 편입"
 NIG_enlist_the_militias_desc: "중부 벨트와 남부의 기독교 민병대는 나이지리아 육군과 경찰이 실패한 곳에서 급진주의로 돌아섰습니다. 국가의 기독교 지역은 이들과 자신들의 신앙 공동체를 더 잘 보호하기 위해 이들을 지원병 부대로 편입하기를 바랍니다."
 NIG_dicon_ordnance_header: "카두나 병기 공장"
 NIG_dicon_ammunition_header: "탄약 생산 라인"
 NIG_dicon_vehicle_header: "특수 차량 공장"
 NIG_dicon_materiel_manufacturer_trait: "나이지리아 육군 병기창"
 NIG_dicon_fritz_werner_heritage: "프리츠 베르너의 유산"
 NIG_dicon_nr1_battle_rifle: "NR-1 전투소총"
 NIG_dicon_fn_mag_licence: "FN MAG 면허"
 NIG_dicon_pmg12_production: "PMG-12 생산"
 NIG_dicon_obj006_rifle: "OBJ-006 소총"
 NIG_dicon_beryl_m762_licence: "베릴 M762 면허"
