 antarctica_reports_warning_tt: "§RWarning:§!\nIf the amount of reports breaches 7, the Antarctic Treaty Consultative Parties may take diplomatic actions against your nation, including potential heavy sanctions and loss of ATCP status, if present. It is recommended to keep the amount of reports below 7 to avoid negative consequences.\n\nIf the breach will happen while having detected a nuclear research, each Antarctic Treaty nation will get an event to place an embargo on your nation."
