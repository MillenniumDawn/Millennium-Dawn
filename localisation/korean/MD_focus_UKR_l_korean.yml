 ukr_modernize_sov_equipment_s75_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s75_for_tooltip\n\n\n\n\n\n\n\n\n§W1997년 이후 스트리, 코벨, 우만, 스비틀로보츠크, 도네츠크, 자포리자, 예우파토리야의 §YS-75 드비나§! 연대는 차세대 체계에 자리를 내주고 있습니다. §Y[EGY.GetNameWithFlag]§!, §Y[LBA.GetNameWithFlag]§!, 캅카스 국가들은 여전히 이 기종을 씁니다.\n------------------\n판매할 때마다 연대가 있던 주에서 대공 §R1§!단계가 사라집니다. §Y[LBA.GetNameWithFlag]§!에 판매하면 §R나토가 분노합니다§!.§!"
