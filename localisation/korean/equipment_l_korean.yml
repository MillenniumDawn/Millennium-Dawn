 ITA_infantry_weapons_2: "AR70/223"
 ITA_infantry_weapons_2_desc: ""
 ITA_infantry_weapons_3: "AR70/90"
 ITA_infantry_weapons_3_desc: "베레타 AR70/90은 5.56x45mm NATO 탄을 사용하는 가스 작동식 돌격소총으로, 이탈리아군의 표준 지급 제식 소총입니다. 이 무기는 소총 유탄을 장착할 수 있도록 설계되었으며 유탄 조준기도 갖추고 있습니다."
 ITA_infantry_weapons_4: "SCP70/90"
 ITA_infantry_weapons_4_desc: "접이식 개머리판을 갖춘 SC70/90 파생형(특수 카빈)이 채택되어 주로 알피니 부대가 사용했으며, 낙하산 강하 시 사용하는 소총 케이스에 넣을 수 있도록 반동 완충 패드가 있는 접이식 개머리판과 SC보다 짧은 총열을 갖춘 SCP70/90(공수부대용 특수 카빈) 소총도 채택되었습니다."
 ITA_infantry_weapons_5: "ARX160"
 ITA_infantry_weapons_5_desc: "베레타 ARX160은 베레타가 제조한 이탈리아의 모듈식 돌격소총입니다. 이탈리아군의 솔다토 푸투로(영어: \\"Future Soldier\\", 미래의 병사) 사업의 일환으로 개발된 ARX160은 2008년에 솔다토 푸투로 장비 일체와는 별개의 상용 무기 체계로 출시되었으며, 소총 하부에 장착하거나 전용 개머리판 체계와 함께 독립 무기로 사용할 수 있는 단발식 40x46mm NATO 저속 유탄발사기 GLX160이 함께 제공됩니다."
 ITA_infantry_weapons_6: "ARX160A3"
 ITA_infantry_weapons_6_desc: "베레타 ARX160 A3는 몇 가지 설계 변경이 이루어진 ARX160의 개량형입니다. 변경 사항에는 재설계된 총열 덮개가 포함되며, 상단 통풍구 슬릿이 더 큰 사각형 절개구로 대체되었으나 하단 통풍구는 여전히 더 얇은 슬릿을 유지합니다. 이 더 큰 절개구는 소총 무게를 일부 줄이면서 총열 주위로 더 많은 공기가 순환하도록 합니다."
 ITA_infantry_weapons_7: "ARX180 6.8"
 ITA_infantry_weapons_8: "FN SCAR-NG"
 ITA_cnc_equipment_1: "BFT"
 ITA_cnc_equipment_1_desc: "냉전 시절 체코슬로바키아 시대에 슬로바키아와 함께 생산한 지휘&통제 장비입니다."
 ITA_cnc_equipment_2: "LC2"
 ITA_cnc_equipment_2_desc: "C2(지휘 및 통제)는 1세대 C2 장비입니다. 지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다."
 ITA_cnc_equipment_3: "LC2EVO"
 ITA_cnc_equipment_3_desc: "C3(지휘, 통제 및 통신)는 2세대 C2 장비입니다. 지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다."
 ITA_cnc_equipment_4: "SIACCON"
 ITA_cnc_equipment_4_desc: "C3ISTAR(지휘, 통제, 통신, 정보, 감시, 표적 획득 및 정찰)는 3세대 C2 장비입니다. 지휘통제 장비는 지휘부가 임무와 과제를 완수하기 위해 배속된 부대에 대한 권한을 행사하고 지휘를 수행할 수 있도록 지원하는 시스템입니다. 효율적인 지휘통제는 조직의 체계성과 사기를 높여줍니다."
 ITA_cnc_equipment_5: "SIACCON ADV"
 ITA_cnc_equipment_5_desc: "SIACCON ADV (Command, Control, Communications, Computers, Intelligence, and Interoperability) is the fourth generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
 ITA_cnc_equipment_6: "SIACCON NCW"
 ITA_cnc_equipment_6_desc: "SIACCON NCW (Command, Control, Communications, Computers, Collaboration and Intelligence) is the Fifth generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
 ITA_cnc_equipment_7: "SIACCON NCW ADV"
 ITA_cnc_equipment_7_desc: "SIACCON NCW ADV (Command, Control, Communications, Computers, Collaboration, Intelligence, Interoperability, Surveillance, Target Acquisition, and Reconnaissance ) is the Seventh generation of C2 equipment. Command and Control Equipment is the system empowering leadership to exercise authority and direction over assigned forces for the accomplishment of missions and tasks. Efficient Command and Control leads to greater organization and morale."
