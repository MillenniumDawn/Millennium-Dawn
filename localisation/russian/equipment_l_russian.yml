 FRA_infantry_weapons_2_desc: "Fusil d'Assault de la Manufacture d'Arme de Saint-étienne — французская автоматическая винтовка компоновки буллпап, созданная в 70-х годах для французской армии."
 FRA_infantry_weapons_3: "FAMAS G1"
 FRA_infantry_weapons_3_desc: "FAMAS G1 — вариант FAMAS производства GIAT Industries с новым цевьём, рассчитанным на стрельбу в перчатках в арктических условиях."
 FRA_infantry_weapons_4: "FAMAS G2"
 FRA_infantry_weapons_4_desc: "FAMAS G2 — вариант FAMAS, разработанный в 1994 году под стандартные патроны НАТО калибра 5,56 мм."
 FRA_infantry_weapons_5: "FAMAS Félin"
 FRA_infantry_weapons_5_desc: "Модель FAMAS Félin (от «Пехотинец со снаряжением и интегрированными средствами связи») дополнена вертикальной рукояткой спереди с пультом управления радиостанцией и новым тепловизионным прицелом."
 FRA_infantry_weapons_6: "HK416F"
 FRA_infantry_weapons_6_desc: "Оружие представляет собой французскую смесь HK416 и HK416A5, выпущенную в двух вариантах: стандартном и коротком."
