 MER_MEX_industrial_investment_agreement: "対メキシコ産業投資協定"
 MER_MEX_industrial_investment_agreement_desc: "首都を中心とした大規模投資協定を通じて、メキシコ加盟パッケージの産業面を支援する。"
 MER_MEX_commercial_investment_framework: "対メキシコ商業投資枠組み"
 MER_MEX_commercial_investment_framework_desc: "より広範な商業投資枠組みをメキシコと確立し、正式加盟に向けた制度的・経済的基盤を強化する。"
 MER_MEX_financial_cooperation_package: "対メキシコ金融協力パッケージ"
