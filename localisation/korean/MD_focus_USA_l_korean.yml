 moonbase_chain_end_tt: "이것은 달 탐사 사건 연쇄의 끝입니다.\n"
 usa.7.o1_tt: "§Y엘리안 곤잘레스§!의 공습이 §Y실패§!할 조금의 가능성\n"
 USA_not_total_support_tt: "Does Not Have Total Support of the §YSenate§! and §YHouse of Representatives§!"
 USA_deploy_e_brigade_tt: "바르샤바에 §YE 여단§!을 배치합니다.\n"
 USA_deploy_ankara_s_brigade_tt: "앙카라에 §YS-여단§!을 배치합니다\n"
 USA_secure_fence_act_tooltip: "§Y남쪽 국경선에 울타리를 건설하자§!"
 USA_build_the_wall_tooltip: "울타리를 벽으로 확장하자"
 USA_given_isis_subsidies: "Despite our efforts, enemies of ISIS in the Middle East have given nothing for our generous involvement."
 USA_not_given_isis_subsidies: "Governments around ISIS in the Middle East have decided to subsidize our efforts, showing a genuine appreciation for our intervention."
 united_states_focus: "미합중국 중점 계통도"
 USA_focus_ending_clintonomics: "클린턴 경제의 마지막 단계"
 USA_focus_ending_clintonomics_desc: "행정부의 마지막이 다가오고 있으니 우리는 다음 선거의 준비를 시작해야 합니다."
 USA_focus_enjoy_surplus: "끊임없는 흑자"
 USA_focus_enjoy_surplus_desc: "예산에 초록 불이 켜졌으니 돈이 굴러들어오는 것을 볼 수 있습니다."
 USA_focus_rise_internet: "인터넷의 성장"
 USA_focus_rise_internet_desc: "새로운 시대의 새벽이 찾아오고 있습니다. 그렇기에 우린 새로운 형태의 기술을 수용하여 이 경쟁에서 우위를 점해야 할 것입니다."
 USA_focus_limited_indust_expansion: "제한적인 산업 확장"
 USA_focus_limited_indust_expansion_desc: "The administration isn't over quite yet, as such we must leave a mark and target economic growth in the Blue Collar heartland that is the Rust Belt."
 USA_focus_late_renew_investments: "늦은 재생 가능 에너지 산업 투자"
 USA_focus_late_renew_investments_desc: "화석 연료 고갈률에 대한 과거의 우려는 걱정할 만한 충분한 이유입니다. 한 가지 형태의 에너지에 지나치게 의존하지 않는다면, 때가 왔을 때 변화하는 세계에 적응하는 것이 필연적입니다."
 USA_focus_43rd_administration: "Gearing up for the 43rd Administration"
 USA_focus_43rd_administration_desc: "내가 퇴임할 때가 왔지만 당은 여전히 승리할 수 있습니다. 따라서 우리 당이 이끄는 또 한 번의 임기를 확보하기를 바라며 마지막 몇 주를 쏟아부어야 합니다."
 USA_focus_2000_democrats: "2000년 민주당 승리"
 USA_focus_2000_democrats_desc: "Through determination we have won over our Republican adversaries."
 USA_focus_early_green_energy_invest: "초기 녹색 에너지 투자"
 USA_focus_early_green_energy_invest_desc: "우리는 국가의 미래를 내다보아야 하며, 재생 에너지가 부상하고 있으므로 이 추진력을 유지해야 합니다."
 USA_focus_inc_health_spending: "의료 비용 확대"
 USA_focus_inc_health_spending_desc: "의료 부문으로 예산을 재편성하면 인구를 유지하고 늘리는 데 도움이 되며, 공화당 행정부 아래서도, 나아가 장기적인 미래에도 이를 유지할 수 있기를 바랍니다."
 USA_focus_new_millennia_tax_reforms: "새천년의 첫 조세 개혁"
 USA_focus_new_millennia_tax_reforms_desc: "우리가 계획하는 최신 세제 개혁은 경제를 성장시키기 위해 자동화와 건설 부문으로 재원을 돌려 경제 성장을 촉진할 것입니다."
 USA_focus_2000_targeted_regulations: "집중 규제"
 USA_focus_2000_targeted_regulations_desc: "도시화가 더 진행된 주들을 겨냥하면 그곳의 경제 부문을 확장할 수 있으며, 이는 경제 전체를 끌어올릴 것입니다."
 USA_focus_social_security_improvements: "사회 보장 개선"
 USA_focus_social_security_improvements_desc: "사회보장 부문으로 예산을 재편성하면 인구를 유지하고 늘리며 국내 시장과 소비를 확대하는 데 도움이 되며, 공화당 행정부 아래서도, 나아가 장기적인 미래에도 이를 유지할 수 있기를 바랍니다."
 USA_focus_green_reg_commission: "녹색 규제 위원회"
 USA_focus_green_reg_commission_desc: "녹색 규제 위원회를 설립하면 향후 건설 사업의 환경 영향을 우선시할 수 있으나 건설 효율을 희생할 수도 있습니다. 그럼에도 우리는 지구와 국민의 건강을 돌보기 시작해야 합니다."
 USA_focus_2000_trade_agreements: "주변국과의 무역 협정"
 USA_focus_2000_trade_agreements_desc: "협상과 우리가 공정하다고 믿는 무역 협정을 통해, 북미 시장을 확보하려는 희망으로 이웃 국가들에 대한 무역 영향력을 확대할 것입니다."
 USA_focus_2000_republicans: "2000년 공화당 승리"
 USA_focus_2000_republicans_desc: "Through determination we have won over our Democrat adversaries."
 USA_focus_early_admin_dereg: "초기 행정부 규제 완화"
 USA_focus_early_admin_dereg_desc: "이전 행정부는 경제 성장을 가로막았습니다. 일부 관료적 절차를 줄이면 특정 주들이 경제를 더 빠르게 확장할 수 있습니다."
 USA_focus_2000_increase_military: "군비 지출 증가"
 USA_focus_2000_increase_military_desc: "세계는 끊임없이 변하는 곳이며, 세계적 초강대국으로 남으려면 우리 군의 실효성을 최고 수준으로 유지해야 합니다."
 USA_focus_2001_tax_cuts: "2001년 세금 감면"
 USA_focus_2001_tax_cuts_desc: "국민들은 자신에게 필요한 것이 무엇인지 알고 있으므로, 이러한 감세 조치는 국민들의 필요를 충족시키는 데 도움이 될 것입니다."
 USA_focus_2000_education_reforms: "교육 개혁"
 USA_focus_2000_education_reforms_desc: "Children are the nation's future; as such we must begin to reform the school systems with the latest technologies."
 USA_focus_2000_limited_deregulation: "제한적인 규제 완화 효과"
 USA_focus_2000_limited_deregulation_desc: "주요 정부 법안으로 인해 경제 성장이 전반적으로 둔화되었습니다. 따라서 상품과 서비스의 더 빠른 개발과 생산이 가능하도록 이러한 법안을 줄여야 합니다."
 USA_focus_2000_reform_financial: "금융 부문 개혁"
 USA_focus_2000_reform_financial_desc: "금융 부문은 GDP를 가장 크게 키우는 분야이므로, 그 부문 자체의 지속적이고 이른바 탁월한 성장을 가능하게 하도록 개혁해야 합니다."
 USA_focus_2000_central_free_trade: "중앙아메리카 자유 무역 협정"
 USA_focus_2000_central_free_trade_desc: "먼로 독트린은 오늘날에도 지켜져야 하지만, 아메리카 시장에서 정치적·경제적 우위를 확보하려면 파나마 운하 인근 및 주변 국가들과 더 우호적인 관계를 모색해야 합니다."
 USA_focus_2004_democrats: "2004년 민주당 승리"
 USA_focus_2004_democrats_desc: "Through determination we have won over our Republican adversaries."
 USA_focus_light_green_deal: "가벼운 그린 딜 (Green Deal) 정책"
 USA_focus_light_green_deal_desc: "우리가 환경에 이미 저지른 것보다 더 많은 피해를 입히기 전에 가벼운 그린 딜이 절실히 필요합니다."
 USA_focus_2004_education_investments: "교육 투자"
 USA_focus_2004_education_investments_desc: "교육에 투자하는 것은 우리 아이들의 미래에 투자하는 것이며, 따라서 앞으로 올 세대를 위한 미래를 만드는 데 도움이 되도록 해야 합니다."
 USA_focus_2004_economic_crackdowns: "경제 산업 대규모 단속"
 USA_focus_2004_economic_crackdowns_desc: "기업이 국민을 착취하고 있는 만큼 엄격한 규제 정책을 수립해 더 이상의 사업 확장을 선제적으로 막아야 합니다."
 USA_focus_2004_social_security: "사회 보장 확대"
 USA_focus_2004_social_security_desc: "국민은 은퇴 후의 혜택을 누려야 합니다. 그러나 현재 사회보장 제도의 상태는 엉망입니다. 기존 예산과 자원을 재구성하고 재배분하면 제도를 더 효율적으로 만들고 평균적인 납세자의 부담을 줄일 수 있습니다."
 USA_focus_2004_federal_funding: "연방 경제 지원 계획"
 USA_focus_2004_federal_funding_desc: "우리는 GDP 성장에서 세계와 겨뤄야 하며, 따라서 현대의 돈줄인 사무 구조물과 금융 시장에 투자해야 합니다."
 USA_focus_2004_public_works: "공공사업"
 USA_focus_2004_public_works_desc: "공공 일자리 프로젝트를 통해 지역 소비와 경제 성장을 장려하는 상호 연결성을 구축할 수 있습니다."
 USA_focus_2007_tax_reform: "2007년 세금 개혁"
 USA_focus_2007_tax_reform_desc: "이 새로운 세금은 새로운 정부 구상을 충당하는 데 도움이 될 것입니다. 결국 국민을 돕는 것이 정부의 일입니다."
 USA_focus_2004_urbanization: "전국 도시화 I"
 USA_focus_2004_urbanization_desc: "세대가 바뀌고 경제가 성장함에 따라, 국가 전체도 함께 확장되고 있는 것으로 보입니다."
 USA_focus_2004_republicans: "2004년 공화당 승리"
 USA_focus_2004_republicans_desc: "민주당 반대파를 상대로 승리한 또 한 번의 임기를 위하여."
 USA_focus_2004_military_contracts: "군사 계약"
 USA_focus_2004_military_contracts_desc: "우리 군의 재고를 유지하려면 수요를 따라잡을 수 있는 군사 계약의 성장을 모색해야 합니다."
 USA_focus_2004_economic_deregulation: "경제 규제 완화"
 USA_focus_2004_investments: "사업 투자"
 USA_focus_2004_healthcare: "의료 개혁"
 USA_focus_2004_healthcare_desc: "의료 제도는 주도적 노력과 연구를 마비시키는 규제로 지나치게 큰 부담을 안고 있으므로, 제도 전체에 핵심적인 변화를 가져와야 합니다."
 USA_focus_2004_less_red_Tape: "관료주의 감소"
 USA_focus_2004_less_red_Tape_desc: "대상 주들이 각자의 규제 위원회를 통해 자체적으로 필요와 신규 사업을 세울 수 있는 여유 공간을 평가하면 경제를 확장할 수 있게 될 것입니다."
 USA_focus_2004_budget_balancing: "예산 조정"
 USA_focus_2004_budget_balancing_desc: "경제가 원활하게 돌아가도록 예산의 균형을 맞추고 적자를 최소화할 방법을 찾아야 합니다."
 USA_focus_2007_tax_cuts: "2007년 감세"
 USA_focus_2007_tax_cuts_desc: "감세는 경제에 좋은 자극이 되며, 제품을 구매하고 개인 사업을 위해 저축하려는 자발적 유인을 제공하고, 기업이 여분의 자본을 확장과 일자리 창출에 쓸 수 있게 합니다."
 USA_focus_2008_democrats: "2008년 민주당 승리"
 USA_focus_2008_democrats_desc: "승자인 우리는 야당을 상대로 또 한 번의 잠재적 임기를 확보했습니다."
 USA_focus_2009_tax_reforms: "2009년 세금 개혁"
 USA_focus_2009_tax_reforms_desc: "새로운 세금을 통해 우리는 중요하다고 아는 곳에서 GDP 성장을 촉진할 수 있습니다."
 USA_focus_2008_environmental_safeguards: "환경 보호 정책 확장"
 USA_focus_2008_environmental_safeguards_desc: "환경은 무엇보다 중요하며, 주변에 환경이 더 많은 주일수록 더 엄격한 지침을 가져야 합니다."
 USA_focus_2008_inter_economic_deals: "내수 시장 집중"
 USA_focus_2008_inter_economic_deals_desc: "중국은 값싼 상품을 구할 수 있는 최고의 거점이므로, 우리는 태평양 건너편의 동료들에게 문을 열고 그들을 받아들여야 합니다."
 USA_focus_2008_social_security: "사회 보장 개선"
 USA_focus_2008_social_security_desc: "처리 데이터와 수요를 더욱 재구성하고 효율화하면 납세자는 사회보장에 더 적게 납부하면서도 은퇴 시 받는 혜택은 확대까지는 아니더라도 유지할 수 있습니다. 이는 신뢰와 사기를 높여 사람들이 직장에서 더 생산적으로 일하게 만들 수 있습니다."
 USA_focus_2008_healthcare: "의료 개선"
 USA_focus_2008_police: "치안 비용 감소"
 USA_focus_2008_police_desc: "범죄는 일부 지역에서는 줄고 다른 지역에서는 늘고 있으므로, 필요하다면 치안 활동을 \\"제한\\"하고 다른 수단으로 \\"전환\\"해야 합니다."
 USA_focus_2008_urbanization: "도시화 지속"
 USA_focus_2008_urbanization_desc: "도시화는 제조 공정의 각 단계 사이에 긴 시간 없이 사람과 경제가 돌아가게 하는 가장 효율적인 방법입니다. 따라서 우리는 경제 중심지를 통합하고 성장시켜야 합니다."
 USA_focus_2008_republicans: "2008년 공화당 승리"
 USA_focus_2008_republicans_desc: "우리 당은 또 한 번의 승리를 확보했으니, 이를 최대한 활용합시다."
 USA_focus_2008_rural_redevelopment: "농촌 재개발"
 USA_focus_2008_rural_redevelopment_desc: "우리는 국가의 핵심, 즉 블루칼라 개인들과 광활한 농촌 지역에 집중해야 하며, 그러기 위해서는 이러한 조건에 부합하는 주 경제에 투자해야 합니다."
 USA_focus_2008_trade_deal: "해외 무역 협정"
 USA_focus_2008_trade_deal_desc: "우리는 세계적인 재정적 입지를 유지해야 하며, 따라서 각자의 대륙 또는 지역 시장에서 중요하다고 여겨지는 국가들과 협력하는 분위기를 조성해야 합니다."
 USA_focus_2008_environment_deregulation: "환경 규제 완화"
 USA_focus_2008_policing_initiatives: "치안 개선 계획"
 USA_focus_2008_policing_initiatives_desc: "새로운 경찰 프로그램이 시행되면 지역사회 참여를 더 잘 이끌어 내고, 주요 범죄 다발 지역이 더 이상 커지지 않도록 막고 다른 곳은 근절할 수 있을 것입니다."
 USA_focus_2008_military_industry: "군산복합체"
 USA_focus_2008_military_industry_desc: "핵심 군 계약을 확대·갱신하면 우리 군은 더 나은 장비를 갖추고 군수 지원의 부족을 덜 겪게 될 것입니다."
 USA_focus_2008_military_budget: "군비 예산 증가"
 USA_focus_2008_military_budget_desc: "새 회계연도는 세계 정세의 고조되는 변화에 맞게 조정될 것이며, 따라서 속도를 맞추려면 군에 더 많은 자금을 투입해야 합니다."
 USA_focus_2011_tax_cuts: "2011년 감세"
 USA_focus_2011_tax_cuts_desc: "국내 소비와 성장을 더 잘 촉진하려면 핵심 세금을 인하하고 모든 계층의 시민에게 영향을 미치는 세법을 바꾸거나 축소하는 방향으로 조정해야 합니다. 그러면 기업은 여분의 자본을 일자리 창출에 재투자할 수 있고, 노동자는 더 많은 물건을 구매할 수 있으며, 더 많은 사람이 자신의 사업을 일굴 기회를 얻을 수 있기를 바랍니다."
 USA_focus_ending_2011_fiscal_year: "2011 회계 연도 마무리"
 USA_focus_ending_2011_fiscal_year_desc: "대통령 임기가 끝나가고 있으며, 우리 경제 의제에 더 많은 진전을 가져올 승리를 확보할 수 있기를 바랍니다."
 USA_focus_2012_democrats: "2012 민주당 승리"
 USA_focus_2012_democrats_desc: "승자인 우리는 야당을 상대로 또 한 번의 잠재적 임기를 확보했습니다."
 USA_focus_riding_green_wave: "녹색주의 열풍과 함께하라"
 USA_focus_riding_green_wave_desc: "국민은 더 친환경적인 내일을 원하며, 우리는 이 열기를 이용해 계획을 추진할 수 있습니다."
 USA_focus_2012_renewable_invest: "재생에너지 투자"
 USA_focus_2012_renewable_invest_desc: "우리는 가장 강력한 지지 기반에 호소해야 하며, 그러려면 그들에게 투표 투자의 결실을 보여 주어야 합니다."
 USA_focus_2012_renewable_refitting: "재생에너지 산업 재정비"
 USA_focus_2012_renewable_refitting_desc: "탄소 배출의 전반적 증가에 대응하려면 새로운 산업이 시작하거나 기존 산업이 확장하려 할 때 적용할 새로운 건축 기준을 마련해야 합니다."
 USA_focus_2012_renewable_research: "합동 재생에너지 부서"
 USA_focus_2012_renewable_research_desc: "모든 교통수단이 전기로 효율적일 수 있는 것은 아니므로, 도로뿐 아니라 더 폭넓게 채택될 수 있도록 모든 재생 가능한 형태에 더 많이 투자해야 합니다."
 USA_focus_2014_infrastructure: "2014년 기반시설법"
 USA_focus_2014_infrastructure_desc: "북동부 회랑이 무너져 가고 있으므로 계속 운영할 수 있도록 직접 투자해야 합니다."
 USA_focus_2012_blue_chip: "일류 기업 투자"
 USA_focus_2012_blue_chip_desc: "다가올 선거에서 유권자들의 인기를 유지하려면 지지 기반에 집중해야 합니다."
 USA_focus_2012_digital_classroom: "교육 디지털화 법안"
 USA_focus_2012_digital_classroom_desc: "모두가 사립학교의 호사를 누릴 수 있는 것은 아니며, 이에 우리는 공립학교를 같은 수준으로 현대화해야 한다고 말하고 싶습니다. 결국 젊은이들이 우리의 미래이기 때문입니다."
 USA_focus_2012_republicans: "2012년 공화당 승리"
 USA_focus_2012_republicans_desc: "우리 당은 또 한 번의 승리를 확보했으니, 이를 최대한 활용합시다."
 USA_focus_2012_opium: "마약 규제 정책"
 USA_focus_2012_opium_desc: "오늘날 미국을 집어삼키고 있는 현대판 아편 전쟁에 더 효과적으로 대응해야 하며, 어떤 실효성 있는 조치든 시작하려면 마약 단속 부대와 특수 카르텔 추적 부대의 예산을 늘려야 합니다."
 USA_focus_2012_deregulation: "재생에너지 산업 규제 완화"
 USA_focus_2012_deregulation_desc: "환경주의의 부상은 우리 자신의 방식으로 대처해야 하며, 그러한 우려가 있다면 재생 가능 자원 시장에 더 많은 이들이 투자할 수 있도록 핵심 규제를 축소해야 합니다."
 USA_focus_2012_osmium: "오스뮴 법"
 USA_focus_2012_osmium_desc: "지속적으로 기술 개발에 희귀한 지구 자원이 요구되고 있습니다. 우리는 희귀 자원의 국내 생산량을 늘려 해외 시장과의 경쟁력을 키워야 합니다. "
 USA_focus_2012_defence: "걸프만 방위 법"
 USA_focus_2012_defence_desc: "최근의 사이버 공포와 알려졌거나 알려지지 않은 적대 세력들의 더욱 대담해진 행동을 고려할 때, 걸프 연안 주들이라는 중요한 무역 거점을 봉쇄하기 위해 해군 병력을 보내려 하지 못하도록 멕시코만을 철통같이 장악해야 합니다."
 USA_focus_2012_standard_classroom: "공교육 법"
 USA_focus_2012_standard_classroom_desc: "민간 부문은 학교가 공평하면서도 교육적일 수 있음을 보여 주었으나, 공정하고 명확한 교육과정을 허용하려면 국가 차원의 표준화가 필요합니다. 표준 교실법이 이를 이루고 이에 대한 연방 예산도 줄일 것입니다."
 USA_focus_2012_red_chip: "기업 소유국에 대한 직접 투자"
 USA_focus_2012_red_chip_desc: "다음 대통령 임기를 앞두고, 충성스럽거나 경합 주로 바뀌어 가는 것으로 보이는 주들에 직접 투자하여 그들의 충성을 지켜 지지를 공고히 해야 합니다."
 USA_focus_2012_great_plains: "대평원 투자"
 USA_focus_2012_great_plains_desc: "일자리 증가를 촉진하고 대규모 도시화에 대응하려면 그레이트플레인스와 같은 인구가 적은 주들에 눈을 돌려야 합니다. 이 주들은 국내 소비와 수출에 충분하고도 남을 식량을 생산하므로, 경제를 다각화하는 데 투자하여 애틀랜타, 뉴욕 등 붐비는 도시의 더 많은 사람을 끌어와야 합니다."
 USA_focus_2016_democrat_victory: "2016 민주당 승리"
 USA_focus_2016_democrat_victory_desc: "결의를 통해 우리는 공화당 반대파를 이겼습니다."
 USA_focus_blue_cross_act: "청십자 법"
 USA_focus_blue_cross_act_desc: "The medical care of our citizens matters, but we must be able to incentivize the growth in jobs, so we must create building and staffing standards for all facilities to increase quality and quantity of treatments."
 USA_focus_red_shield_act: "붉은 방패"
 USA_focus_red_shield_act_desc: "우리는 이전 입법을 또 다른 입법으로 보완해야 하며, 미국의 의료가 최고의 의료임을 세계에 보여 주어야 합니다."
 USA_focus_the_better_tomorrow_act: "더 나은 내일을 위해"
 USA_focus_the_better_tomorrow_act_desc: "용도 지역 지정과 건축에 관련된 일부 규제를 바꾸고 상충하는 규제를 더 잘 표준화하면 개발 가능한 토지가 더 많이 확보되겠지만, 이러한 새 건물을 기준에 맞게 짓는 데에는 조금 더 시간이 걸릴 것입니다."
 USA_focus_blue_states_bailout: "Blue States Bailout"
 USA_focus_blue_states_bailout_desc: "우리의 이미지를 공고히 하려면 민주당 우세 주나 경합 주에서 굳건히 버텨야 하며, 이는 다가올 선거 주기에 도움이 될 것입니다."
 USA_focus_were_not_them: "We're Not Them"
 USA_focus_urbanization_ii: "도시화 II"
 USA_focus_urbanization_ii_desc: "일자리 시장이 상승세입니다... 우리에게 필요한 것이니 다행입니다."
 USA_focus_2016_republican_victory: "2016 공화당 승리"
 USA_focus_2016_republican_victory_desc: "우리 당은 또 한 번의 승리를 확보했으니, 이를 최대한 활용합시다."
 USA_focus_lithium_act: "리튬 법"
 USA_focus_lithium_act_desc: "기술의 새로운 성과는 점점 더 많은 희토류 원소를 요구하며, 해외 의존에 대응하려면 국내 생산을 늘려야 합니다."
 USA_focus_greater_plains_act: "교외 선전"
 USA_focus_greater_plains_act_desc: "우리의 핵심 지지 기반은 더 농촌적인 주들에 있으며, 이 주들을 성장시킬 일자리를 잘 분산할 수 있다면 인구조사를 통해 선거인단과 하원 자체를 바꿀 수 있습니다."
 USA_focus_the_better_business_act: "사업 규제 완화"
 USA_focus_the_better_business_act_desc: "인구가 계속 늘어나고 있으므로, 새로운 일자리를 창출하기 위한 건설 노력을 가속하려면 불필요한 중복 규제를 더 걷어내야 합니다."
 USA_focus_blue_collar_programs: "육체 노동자 (blue-collar) 선전"
 USA_focus_blue_collar_programs_desc: "오바마케어 같은 것들에 대한 신뢰를 잃는 사람이 늘고 있는 만큼, 기업이 제공하는 보험에 관한 규제를 바꾸고 강화하여 평범한 사람들에게 호소할 수 있습니다. 이러한 접근을 좋아하지 않는 사람도 있겠지만, 반대하는 사람보다 호응하는 사람이 더 많을 것입니다."
 USA_focus_we_arent_like_them: "We Aren't Like Them"
 USA_focus_the_2000_joint_exercises: "2000년 합동 군사 훈련"
 USA_focus_the_2000_joint_exercises_desc: "미군은 일부 NATO 동맹국들과 관련하여 연합 군사 훈련을 실시할 것입니다."
 USA_focus_pushing_the_anti_smoking_initiative: "흡연 금지 법안 계획 "
 USA_focus_pushing_the_anti_smoking_initiative_desc: "시민들에게는 더 건강한 삶이 필요하며, 따라서 담배 산업 전반의 부정적 영향을 알리는 캠페인을 추진해야 합니다."
 USA_focus_dealing_with_anti_globalist_protest: "반세계화 시위 대응"
 USA_focus_dealing_with_anti_globalist_protest_desc: "선동가들이 외국 경제와의 통합과 협력을 강화하려는 우리의 최근 변화에 항의하러 나섰습니다. 따라서 대중의 시선이 닿는 곳에서는 신중한 방식으로 이 무지한 자들을 처리해야 합니다."
 USA_focus_state_visit_to_vietnam: "베트남으로 국빈 방문"
 USA_focus_state_visit_to_vietnam_desc: "베트남과의 관계 역사는 불안정하지만, 앉아서 긴장이 소극적으로 쌓이게 두는 것보다는 늦게라도 이를 바로잡는 것이 낫습니다. 따라서 베트남 국빈 방문을 추진해야 합니다."
 USA_focus_helping_al_gore_in_the_coming_election: "다음 선거에서 알 고어 지원"
 USA_focus_helping_al_gore_in_the_coming_election_desc: "대통령의 임기가 거의 끝나가고 있으며, 부통령인 앨 고어가 다음 임기의 최선의 후임으로 보입니다. 그가 당선되도록 대중의 눈에 호감을 얻게 해야 합니다."
 USA_focus_the_2001_attacks: "2001년의 습격"
 USA_focus_the_2001_attacks_desc: "미국이 통제하는 가장 큰 도시 중 하나인 본토에서 공격을 받았습니다. 국가는 충격에 빠졌지만 이러한 테러 행위에 대응하겠다는 결의가 빠르게 커지고 있습니다."
 USA_focus_avoiding_an_illegal_war: "불법적인 전쟁 회피"
 USA_focus_avoiding_an_illegal_war_desc: "국민들은 분노하면서도 신중합니다. 이번 공격에 대처하기를 원하면서도, 일부가 완전히 납득하지 못하는 전쟁에 파견되어 죽을 수도 있는 만큼 삶을 압박할 장기전은 원하지 않기 때문입니다. 특히 \\"문제 국가\\"로 분류될 국가들에 대해 더 소극적이고 공세적이지 않은 대외 외교 접근을 취함으로써 이러한 정서를 해소할 수 있습니다."
 USA_focus_the_self_security_option: "내부 안전에 집중"
 USA_focus_the_self_security_option_desc: "장기화될 수 있는 전쟁을 치를 만한 의지가 충분하지 않으므로 내부로 눈을 돌려야 합니다. 이러한 테러 행위가 일어난 것은 공항 보안의 실패 때문이었기 때문입니다."
 USA_focus_the_war_on_terror: "테러와의 전쟁"
 USA_focus_the_war_on_terror_desc: "패는 돌려졌고 우리는 승산을 따져보았습니다. 우리 국민의 복수를 하고 향후 공격을 선제적으로 막으려면, 이러한 광기 어린 자들의 근원과 싸워야 합니다."
 USA_focus_foreign_policy: "외교 정책"
 USA_focus_foreign_policy_desc: "미국은 최근 외교에서 느슨했으며, 따라서 우리 국익의 이 측면을 되살려야 합니다."
 USA_focus_foreign_policy_plan: "미국의 외교 정책"
 USA_focus_foreign_policy_plan_desc: "서아프리카에서 진행 중인 내전은 우리 외교 정책을 가다듬을 좋은 시험장이 되겠지만, 그것이 외교 정책을 규정할지는 확신할 수 없습니다."
 USA_focus_support_the_democratic_movement: "민주주의 운동 지원"
 USA_focus_support_the_democratic_movement_desc: "그들은 자유와 강한 국가를 원하는 것으로 보이며, 우리는 그들을 지원해야 합니다."
 USA_focus_support_the_nationalist_movement: "국가주의 운동 지원"
 USA_focus_support_the_nationalist_movement_desc: "그들은 자유와 강한 국가를 원하는 것으로 보이며, 우리는 그들을 지원해야 합니다."
 USA_focus_the_salesman_approach: "사업가의 관점으로"
 USA_focus_the_salesman_approach_desc: "국민은 전쟁을 원하지 않지만, 그렇다고 가만히 앉아 있기도 원하지 않습니다. 이를 위해 도움이 필요한 이들에게 훈련 및 장비 거래를 홍보하기 시작하면 우리 국민과 세계를 위해 이득을 얻을 수 있습니다."
 USA_focus_supplying_our_sierra_leone: "시에라리온 지원"
 USA_focus_supplying_our_sierra_leone_desc: "시에라리온 국민은 장비가 부족하며 우리는 그들을 도와야 합니다."
 USA_focus_meeting_with_african_union_members: "아프리카 연합 회원국 회담"
 USA_focus_meeting_with_african_union_members_desc: "아프리카 대륙은 광활하고 기껏해야 예측할 수 없는 곳입니다. 이를 해소하려면 아프리카 연합 지도자들을 만나 복잡한 사정과 우리가 확보할 수 있는 고객층을 더 잘 이해해야 합니다."
 USA_focus_securing_trade_with_africa: "아프리카와의 무역 보호"
 USA_focus_securing_trade_with_africa_desc: "이 대륙은 자원이 풍부하며, 따라서 상호 무역을 증진하면 우리 국가와 대륙에서의 영향력이 향상될 것입니다."
 USA_focus_the_humanitarian_approach: "인도주의적 접근"
 USA_focus_the_humanitarian_approach_desc: "국민은 전쟁을 원하지 않지만, 그렇다고 가만히 앉아 있기도 원하지 않습니다. 우리는 메시지를 보내야 하며, 그 가장 좋은 방법은 인도주의를 통하는 것입니다."
 USA_focus_advising_sierra_leone: "시에라리온에 조언"
 USA_focus_advising_sierra_leone_desc: "이 나라는 장비는 어느 정도 갖추었으나 훈련은 무계획적입니다. 그들의 승리를 기대하려면 더 많은 훈련을 받도록 도와야 합니다."
 USA_focus_meeting_eu_leadership: "유럽연합 지도부와의 회담"
 USA_focus_meeting_eu_leadership_desc: "The Europeans held the continent of Africa for centuries to where they must have the most info about how to handle the continent. We can get a better understanding of the trouble we may have if we talk with them."
 USA_focus_coordinated_help: "조직적인 도움"
 USA_focus_coordinated_help_desc: "프랑스에는 외인부대가 있으며 우리도 그래야 합니다. 우리의 이미지를 바꾸고 세계 평화와 자유에 대한 우리의 주장을 공고히 해야 합니다."
 USA_focus_the_interventionist_will: "간섭주의자 의지"
 USA_focus_the_interventionist_will_desc: "국민은 전쟁을 원하지만 우리는 가만히 있을 수 없습니다. 우리는 메시지를 보내 우리 국가의 적들에게 공포를 심어주고 우리가 여전히 굳건히 서 있음을 보여주어야 합니다."
 USA_focus_state_visit_to_the_united_kingdom: "영국에 국빈 방문"
 USA_focus_state_visit_to_the_united_kingdom_desc: "영국은 과거 시에라리온 영토의 식민 종주국이었으며, 이번 사업에 도움이 될 최고의 지식을 갖고 있을 것입니다. 이는 과거 영국 제국 영토의 다른 분쟁에서도 도움이 될 수 있습니다."
 USA_focus_the_afghanistan_question: "아프가니스탄 문제"
 USA_focus_the_afghanistan_question_desc: "최근 국가에 대한 공격과 함께, 테러리스트가 촉발한 아프가니스탄 내전은 한동안 우리 군의 관심사였으며, 우리는 공격의 지도자가 이 도당을 이끌고 있다고 믿을 만한 이유가 있습니다. 따라서 어떻게 대응할지 생각해야 합니다."
 USA_focus_arming_our_horse: "해외 파병군을 무장시켜라"
 USA_focus_arming_our_horse_desc: "아프가니스탄의 곤란한 상황은 국제적으로 매우 중요한 사안이므로, 더 안정적인 세력을 지원하기 위해 할 수 있는 일을 해야 합니다."
 USA_focus_muslim_legion: "무슬림 군단"
 USA_focus_muslim_legion_desc: "우리 이슬람교도 인구 일부는 한때 고향이었던 곳을 지키기 위해 가서 싸우기를 원합니다. 분쟁이 기껏해야 교착 상태로 보이는 만큼 이는 좋은 기회가 될 수 있습니다."
 USA_focus_arming_the_legion: "군단 무장"
 USA_focus_arming_the_legion_desc: "군단은 장비가 그리 충분하지 않으므로, 최소한 예의상으로라도 그들에게 보급해야 합니다."
 USA_focus_advising_the_legion: "군단에 조언"
 USA_focus_advising_the_legion_desc: "북부 동맹은 좋게 말해도 그다지… 숙련되어 있지 않지만, 약간의 교육만 있으면 충분한 수준으로 다듬을 수 있습니다. 이러한 보다 느긋하지만 핵심을 겨냥한 방식을 통해 많은 이들이 외교부가 시도 중인 소극적 공세 전략의 성격을 이해하기 시작하고 있습니다."
 USA_focus_indirect_support_of_freedom: "자유를 위한 간접적인 지원"
 USA_focus_indirect_support_of_freedom_desc: "중동의 안정이 위협받고 있습니다. 우리는 시에라리온에서 스스로를 시험해 보았지만 이제는 진정한 도전에 직면했습니다."
 USA_focus_supplying_democracy: "민주주의 지원"
 USA_focus_supplying_democracy_desc: "북부 동맹은 맞서고 있는 원리주의 세력에 비해 열악한 상태이며, 따라서 핵심 보급품으로 그들을 도와야 합니다."
 USA_focus_modern_war_advisors: "현대 전쟁 고문"
 USA_focus_modern_war_advisors_desc: "북부 동맹은 적의 전술을 알고 있지만 규율과 의지가 부족합니다. 그들이 진정한 전투 부대가 되려면 훈련 프로그램을 개혁해야 합니다."
 USA_focus_anti_terror_training: "대테러 훈련"
 USA_focus_anti_terror_training_desc: "현대의 적에게는 현대적인 훈련 프로그램이 필요합니다. 우리 군이 적응하도록 돕기 위해 대테러 중심의 훈련 프로그램을 개혁하고 도입해야 합니다."
 USA_focus_starting_the_war_on_terror: "테러와의 전쟁 시작"
 USA_focus_starting_the_war_on_terror_desc: "테러와의 전쟁이 시작되었고 첫 국제적 위협은 중앙아시아에서 왔습니다. 아프가니스탄은 우리 국가에 해를 끼친 자들의 근거지이며, 우리는 복수심을 품고 반격할 것입니다."
 USA_focus_establishing_a_force: "군대 파병"
 USA_focus_establishing_a_force_desc: "북부 동맹이라 불리는 세력은 오합지졸입니다. 이 지역을 확보하려면 그들이 지키지 못하는 곳을 보강하기 위해 일부 병력을 파견해야 합니다."
 USA_focus_changing_the_rules: "전략 변경"
 USA_focus_changing_the_rules_desc: "이 테러리스트들은 짧은 기간 동안 너무나 많은 골칫거리를 일으켰습니다. 많은 이들에게는 마치 우리가 베트남에 다시 들어선 것처럼 보이지만, 안타깝게도 상황은 훨씬 더 나쁩니다. 우리 군은 소모전으로 지쳐가고 있으며 현지인들의 우리에 대한 여론은 이리저리 흔들리고 있습니다."
 USA_focus_adaptive_tactics: "적응형 전술"
 USA_focus_adaptive_tactics_desc: "우리 병력은 적응해야 하며, 실질적인 진전을 이루려면 전쟁 교리를 바꾸는 데 투자해야 합니다."
 USA_focus_state_visit_to_india: "인도 국빈 방문"
 USA_focus_state_visit_to_india_desc: "인도는 성장하는 강국입니다. 우호 및 동반자 관계를 구축하는 데 투자한다면 우리의 이익을 확보함과 동시에 확대된 중동 및 중앙아시아 지역 내에서 강력한 협력국을 얻게 될 것입니다."
 USA_focus_state_visit_to_russia: "러시아에 국빈 방문"
 USA_focus_state_visit_to_russia_desc: "우리의 가장 큰 경쟁자는 물론 이제 사라진 소련의 후계 국가입니다. 이 지역에서 우리의 이익을 공고히 하려면 러시아 연방의 주의를 분산시켜야 합니다."
 USA_focus_state_visit_to_iran: "이란에 국빈 방문"
 USA_focus_state_visit_to_iran_desc: "우리가 고려해야 할 지역 내 가장 큰 경쟁자는 이란이라는 국가입니다. 불안정한 존재이긴 하지만, 우리가 너무 자극하면 말썽을 일으킬 수 있습니다."
 USA_focus_iraq_leadership_problems: "이라크 정권 문제"
 USA_focus_iraq_leadership_problems_desc: "이라크 지도자의 최근 침탈 행위는 쿠웨이트에 이미 막대한 투자를 한 우리에게 큰 우려를 낳았습니다. 중동에서 우리의 이익을 공고히 하려면 해결책을 찾아야 합니다."
 USA_focus_oil_for_aid: "지도자 회유"
 USA_focus_oil_for_aid_desc: "이라크의 지도자는 카리스마와 활력이 넘치는 인물이지만, 장기화되는 사태를 피하려면 그의 더 이기적인 면을 억제할 방법을 찾아야 합니다."
 USA_focus_integrated_defenses: "통합 방어"
 USA_focus_integrated_defenses_desc: "협상이 성사되었고 전투가 벌어질 수도 있어 보입니다. 세부 사항에 따라 우리는 소극적 또는 보다 공세적인 방식으로 개입할 수 있으며, 국민은 이러한 전망에 분명 불만을 가질 것입니다."
 USA_focus_every_man_a_tow: "모든 이들에게 토우를"
 USA_focus_every_man_a_tow_desc: "새로운 분쟁의 여명이 밝았습니다. 우리는 이로부터 상당한 이득을 얻을 수 있으며, 따라서 다가올 사업에서 얻을 수 있는 장기적 목표와 대가를 파악하려면 최선의 단기 이익을 챙겨야 합니다."
 USA_focus_political_oligarchs: "정치적 과두제"
 USA_focus_political_oligarchs_desc: "중동의 현재 혼란은 결과와 관계없이 가라앉기 시작했습니다. 가장 좋은 점은 우리가 원하던 것을 확보했고, 이번 최근 성과에서 나올 더 저렴한 물품으로 우리 국민이 만족하게 되리라는 것입니다."
 USA_focus_kuwait_defensive_aid: "쿠웨이트 방어 원조"
 USA_focus_kuwait_defensive_aid_desc: "쿠웨이트의 석유는 막대하며 이라크 지도부도 이를 알고 있습니다. 따라서 우리는 이 지역의 자원과 안정에 막대한 이해관계가 걸려 있으며, 쿠웨이트 국민과 국가를 보존해야 합니다."
 USA_focus_limited_supplies: "제한된 물자"
 USA_focus_limited_supplies_desc: "쿠웨이트 경제는 대부분 석유에 의존하며, 우리는 이를 보존할 수 있지만 대가가 따릅니다. 그들의 병력을 지원할 단순하지만 직접적인 무기와 수송 수단을 보낼 것입니다."
 USA_focus_increased_advisors: "조언가 확대"
 USA_focus_increased_advisors_desc: "쿠웨이트 군은 최상은 아니지만 훈련 면에서 이라크 군과 비견할 수 있습니다. 이를 보완하려면 현대적인 고문을 파견하여 쿠웨이트 군의 결의와 전투 능력을 훈련하고 단련해야 합니다."
 USA_focus_arab_legion: "아랍 군단"
 USA_focus_arab_legion_desc: "우리 국가의 아랍계 국민은 옛 고향을 지키고, 지역의 안정을 수호하며, 자국민을 학대하는 자들에게 메시지를 보내기를 원합니다. 따라서 아랍 군단이 창설될 것입니다. 이는 물론 우리 군에서 싸우기를 원하는 이들을 일부 빼앗겠지만, 분명 쿠웨이트 군의 전력을 강화할 것입니다."
 USA_focus_war_on_terror_phase_two: "테러와의 전쟁 - 2차전"
 USA_focus_war_on_terror_phase_two_desc: "이라크 지도자의 위협 증대는 중동의 안정에 큰 우려를 낳고 있으며, 이를 인지한 이상 우리가 겪을 수 있는 잠재적 반발에도 불구하고 행동해야 합니다."
 USA_focus_protecting_our_assets: "우리 자산 보호"
 USA_focus_protecting_our_assets_desc: "쿠웨이트의 유전은 매우 중요하며, 도발이 있을 경우 우리는 온 힘을 다해 이를 방어할 것입니다."
 USA_focus_increased_deployment: "파병 확대"
 USA_focus_increased_deployment_desc: "이라크 국민과 쿠웨이트의 국가 주권에 대해 매우 적대적인 행위가 자행되고 있다는 소문과 정보가 있으며, 대비하려면 준비를 시작해야 합니다. 우리 국민은 다소 불만을 품겠지만 그 감정은 지나갈 것입니다."
 USA_focus_the_wmd_cause: "대량살상무기 문제"
 USA_focus_the_wmd_cause_desc: "우리 정보기관은 이라크 내에 대량살상무기가 존재할 가능성을 보고했으며, 이는 우리도 자유 세계도 용납할 수 없는 일입니다. 따라서 이라크 자유 작전이 개시될 것이며 우리는 사담을 직접 처리하고 이라크 국민을 해방할 것입니다."
 USA_focus_state_visit_to_turkey: "국빈의 터키 방문"
 USA_focus_state_visit_to_turkey_desc: "튀르키예는 러시아와 중동 사이의 훌륭한 완충지입니다. 우리의 이익이 확보되도록 우리의 입지를 개선해야 합니다."
 USA_focus_state_visit_to_egypt: "국빈의 이집트 방문"
 USA_focus_state_visit_to_egypt_desc: "이집트는 이 지역에서 가장 강력한 국가 중 하나이며, 그 힘을 활용해 수에즈 무역과 우리에게 필요한 자원을 보호할 수 있습니다."
 USA_focus_state_visit_to_saudi_arabia: "국빈의 사우디 방문"
 USA_focus_state_visit_to_saudi_arabia_desc: "사우디아라비아는 석유가 가장 풍부한 국가이자 아라비아 반도에서 가장 큰 국가 중 하나이므로, 경제적, 전략적 이유로 우호 관계를 확보해야 합니다."
 USA_focus_the_arab_spring: "아랍의 봄"
 USA_focus_the_arab_spring_desc: "시리아 정권은 의심스러운 행위를 해 왔고 안타깝게도 사태가 끓어 넘친 듯합니다. 아랍의 봄이 시리아에도 밝아온 것으로 보이며, 그 결과 일어난 시위는 전면적인 내전으로 번졌습니다."
 USA_focus_question_of_intervention: "개입 문제"
 USA_focus_question_of_intervention_desc: "시리아 내전이 다른 나라로 번지기 시작했습니다. 이것이 계속되어 걷잡을 수 없게 되면 우리가 투자한 자원이 풍부한 지역이 불안정해질 수 있습니다. 계획을 세우고 최선의 방식으로 나아가야 합니다."
 USA_focus_monetary_policy: "통화 정책"
 USA_focus_monetary_policy_desc: "국내 공급과 다른 지역에 대한 투자가 우리를 뒷받침하므로 중동은 큰 걱정거리가 아니지만, 그렇다고 가만히 앉아 있어서는 안 됩니다. 우리 방위 계약업체들에게 할 일을 줍시다."
 USA_focus_arms_to_the_highest_bidder: "최고 입찰자에게 무기를"
 USA_focus_arms_to_the_highest_bidder_desc: "시리아를 둘러싼 전쟁은 격렬하지만 사실상 교착 상태입니다. 그러니 물밑 제안을 내놓아 분위기를 띄워 봅시다."
 USA_focus_foreign_aid: "해외 원조"
 USA_focus_everyone_has_their_price: "모든 건 그 대가가 따른다"
 USA_focus_advisory_policy: "조언 위주 정책"
 USA_focus_advisory_policy_desc: "시리아 내전은 중동 전역의 안정에 영향을 미치는 국제적 위기이며, 우리가 돕지 않으면 분명 우리와 동맹국에도 영향을 미칠 것입니다."
 USA_focus_sending_advisors: "고문단 파견"
 USA_focus_sending_advisors_desc: "고문을 파견해도 국제 사회는 아무것도 알지 못하겠지만, 이 고문들에게는 훈련에 쓸 장비가 필요하니 장비를 제공합시다."
 USA_focus_back_door_arms_dealing: "비밀 무기 거래"
 USA_focus_back_door_arms_dealing_desc: "훈련은 더디고 장비 손실은 늘어나고 있습니다. 시리아군의 장비 보존 개념을 확실히 하기 위해 대중의 눈을 피해 거래를 조직합시다."
 USA_focus_forming_the_damascus_legion: "다마스쿠스 군단 창설"
 USA_focus_forming_the_damascus_legion_desc: "미국 외인부대가 확대되고 있으며, 아랍계 또는 전 시리아인 지원자들이 고향을 위해 싸우기를 원하고 있습니다. 국가가 더 불쾌한 자들의 손에 넘어가지 않도록 이들의 권리를 거부할 수 없습니다."
 USA_focus_war_on_terror_policy: "시리아 테러"
 USA_focus_war_on_terror_policy_desc: "권위주의 시리아 정부를 이루는 테러리스트들과 전쟁으로 인해 생겨나는 테러 조직들은 우리의 자산과 세계 경제를 보호하기 위해 해결되어야 합니다. 지금 행동하지 않으면 또 다른 석유 위기를 볼 위험이 있습니다."
 USA_focus_sending_volunteer_forces: "자원병 파병"
 USA_focus_sending_volunteer_forces_desc: "국제 사회는 시리아의 민주주의 반군을 돕기 위한 연합군을 조직하고 있으며, 따라서 우리는 눈에 띄고 선두에 서기 위해 우리 자체 병력을 소집해야 합니다."
 USA_focus_keeping_supplies_steady: "보급라인 정상 유지"
 USA_focus_keeping_supplies_steady_desc: "전쟁은 빠르게 끝나겠지만 그 속도는 우리의 병참이 버티는 만큼에 불과합니다. 지상 병력이 전투 문제와 사기 문제를 겪지 않도록 보급 흐름을 안정시킬 방안을 마련해야 합니다."
 USA_focus_indiscriminate_bombings: "무분별한 폭격"
 USA_focus_indiscriminate_bombings_desc: "테러리스트들은 전쟁의 경계를 흐려 베트남이 장기 놀이처럼 보일 지경입니다. 너무 신중하면 중요한 표적을 놓칠 위험이 있고, 너무 공격적이면 민간인과 국제 사회가 우리에게 등을 돌릴 위험이 있습니다... 전쟁은 정말 지옥입니다."
 USA_focus_second_state_visit_to_russia: "러시아에 국빈 방문"
 USA_focus_second_state_visit_to_russia_desc: "옛 숙적과의 관계 개선은 모두에게 이득이 됩니다. 러시아 국민과 정부에 더 우호적으로 대해야 합니다."
 USA_focus_second_state_visit_to_saudi_arabia: "사우디로 국빈의 두번째 방문"
 USA_focus_second_state_visit_to_saudi_arabia_desc: "사우디 국가는 중동 내의 훌륭한 지역 강국이며, 따라서 이 지역에서의 우리 이익을 확보하기 위해 관계를 구축해야 합니다."
 USA_focus_second_state_visit_to_arab_union: "아랍 연방에 국빈 방문"
 USA_focus_second_state_visit_to_arab_union_desc: "아랍 연합은 아프리카와 중동의 많은 전략적 요충지를 수호하는 국가들의 집합체입니다. 따라서 그 지도자들과의 관계를 개선하면 향후 협상이 원활해지거나, 바라건대 우리에게 유리하게 쉬워질 것입니다."
 USA_focus_the_regulatory_merry_go_round: "규제의 회전목마"
 USA_focus_the_regulatory_merry_go_round_desc: "의회 규제 당국은 무엇을 규제해야 하고 무엇을 규제하지 말아야 하는지를 두고 항상 장난을 치려는 것 같습니다. 그래서 많은 이들은 이것을 바퀴를 돌려 최선의 결과를 바라는 것으로 봅니다."
 USA_focus_pacific_states_region: "태평양 해안 지역"
 USA_focus_pacific_states_region_desc: "태평양 연안 주들은 매우 아슬아슬한 균형 위에 있습니다. 풍부한 자원에서부터 끔찍한 수자원 배분에 이르기까지, 의회는 국민과 이 지역 및 더 넓은 미국의 미래를 위해 무엇이 우선인지 결정해야 합니다."
 USA_focus_targeted_growth_programs: "특정 지역 집중 개발 프로그램"
 USA_focus_targeted_growth_programs_desc: "태평양 연안 주들의 저개발 지역을 겨냥함으로써, 배정된 자금이 세금으로 스스로 회수되기를 기대합니다."
 USA_focus_mini_minerals_act: "고무 개발"
 USA_focus_mini_minerals_act_desc: "의회는 지역 경제와 국가 공급을 돕기 위해 국내 고무 공급원을 개발하는 제한적 계획인 소형 광물법을 통과시켰습니다."
 USA_focus_the_conservation_act: "The Conservation Act"
 USA_focus_the_conservation_act_desc: "보전법의 통과로 태평양 연안 주의 지방들은 국민과 각 지역 경제에 도움이 되는 범위에서 개간하고 보전할 수 있게 될 것입니다."
 USA_focus_rare_elements_initiative: "희귀 광물 위원회"
 USA_focus_rare_elements_initiative_desc: "채굴 규제를 겨냥하고 주 규제를 무효화함으로써 국내 소비에 필요한 희소 금속과 자재의 국내 공급을 시작할 수 있습니다. 이는 지역 경제를 활성화하고 장기적으로 우리 국가에 도움이 될 것입니다."
 USA_focus_loosening_pacific_zoning_laws: "해안 지역 토지 사용 제한 완화"
 USA_focus_loosening_pacific_zoning_laws_desc: "번거롭고 거의 역효과를 낳는 토지 이용 규제 법률이 제대로 된 개발을 정체시켜 왔습니다. 이를 완화하면 지역 개발을 촉진하고 더 많은 세수를 창출할 수 있습니다."
 USA_focus_the_reservoir_act: "저수지 확대"
 USA_focus_the_reservoir_act_desc: "저수지법은 지역 경제를 성장시키고 물 접근성이 낮거나 최소 수준인 지역의 물 공급을 늘리는 방법으로서 새로운 저수지 조성을 가능하게 할 것입니다."
 USA_focus_near_western_states_region: "서부 지역"
 USA_focus_near_western_states_region_desc: "대평원과 태평양 연안 주들 사이의 공백이 바로 근서부 주들입니다. 로키 산맥으로 유명한 이 지역은 가장 개발이 덜 되었으며 가장 어려운 지역 중 하나입니다. 의회는 근서부 주들의 사막과 산, 광대한 지형을 헤쳐 나갈 때 신중하게 접근해야 합니다."
 USA_focus_salt_lake_commission: "솔트레이크 규제 위원회"
 USA_focus_salt_lake_commission_desc: "솔트레이크 규제 위원회는 현재의 채굴 작업을 감독하고 접근하며, 환경 영향을 최소화하면서 확대하려 할 것입니다."
 USA_focus_rocky_preservation_act: "록키 산맥 보존 법"
 USA_focus_rocky_preservation_act_desc: "로키 산맥은 국가적 명소이며 많은 이들은 이러한 미국의 상징이 파괴되는 것을 보고 싶어하지 않습니다. 이에 따라 설립된 위원회는 관광을 보존 운동으로 전환할 방법을 찾았습니다. 이는 지역 경제와 환경 운동가들 모두를 만족시킬 것입니다."
 USA_focus_phoenix_arms_contract: "피닉스 무기 거래"
 USA_focus_phoenix_arms_contract_desc: "군 계약업체들은 피닉스와 애리조나 전역의 지역을 물색해 왔으며 일부 제조 시설을 설립하려 하고 있습니다. 우리는 일자리를 통해 군과 지역 경제를 활성화하도록 노력해야 합니다."
 USA_focus_rocky_mount_go_a: "록키 산맥 개발 추진"
 USA_focus_rocky_mount_go_a_desc: "영화 록키처럼 우리는 상대를 더 잘 이해하기 위해 배우고 훈련해야 합니다. 다만 영화와 달리 우리의 적수는 지질 구조입니다. 산맥 채굴 작업에 대한 규제를 완화함으로써 국내 공급과 생산 수단을 위한 새롭고 더 많은 자원을 채취할 수 있습니다."
 USA_focus_breach_the_western_gap: "서부 지역 개발로 격차 완화"
 USA_focus_breach_the_western_gap_desc: "시민의 원활한 이동을 가로막는 사막과 산맥은 공급망과 지역 상업을 혼란에 빠뜨립니다. 근서부 주들에 간선로를 만들고 일자리와 사람, 더 자유로운 이동을 가져올 방법을 찾아야 합니다."
 USA_focus_more_than_potatoes: "단순히 감자 농장 그 이상으로"
 USA_focus_more_than_potatoes_desc: "아이다호는 감자로 유명한 푸른 농지이지만, 농업만이 이 주의 알려진 모습이어서는 안 됩니다. 지역 산업에 투자하고 확대함으로써 아이다호를 근서부의 상징으로 만들 수 있습니다."
 USA_focus_great_plains_states_region: "대평원 지역"
 USA_focus_great_plains_states_region_desc: "넓은 영토를 아우르는 대평원은 국가의 곡창지대로 여겨집니다. 좋은 식량 공급원을 갖게 되어 기쁘지만, 이 지역의 경제적 다양성은 매우 부족합니다. 이를 위해 의회는 적절하다고 판단되는 계획을 시행하여 이 지역을 더 발전시키고 나머지 연방 지역을 따라잡도록 도와야 합니다."
 USA_focus_dakota_risk_assessment_committee: "다코다 주 평가 위원회"
 USA_focus_dakota_risk_assessment_committee_desc: "이 위원회는 주 간 합작 기업으로 설립되어 노스다코타의 석유 공급을 활용해 고무 기반 제품을 개발하고, 새로운 일자리와 물론 새로운 고무 공급원을 창출할 것입니다."
 USA_focus_great_plains_great_cities: "대평원의 대도시"
 USA_focus_great_plains_great_cities_desc: "이 인구가 드문 주들의 도시 중심지는 매우 저개발 상태이며, 따라서 도시 확산의 도미노 효과를 돕는 표적 계획을 시행하여 이 주들의 발전을 도울 것입니다."
 USA_focus_kansas_city_arms_manufacturer: "캔자스시티 무기 제조사"
 USA_focus_kansas_city_arms_manufacturer_desc: "새로운 계약이 체결되었고 협력사들은 이 새 공장들을 캔자스시티에 설립하는 데 동의했습니다. 도시이면서도 고립된 성격 덕분에 공장이 방해받을 가능성이 낮습니다."
 USA_focus_nebraska_act: "네브래스카 법"
 USA_focus_nebraska_act_desc: "국가의 곡창지대를 이어, 노스다코타에서 캔자스까지의 중앙 지대가 있습니다. 네브래스카를 거점으로 삼아 더 많은 일자리와 사람을 끌어들여 지나치게 특화된 이 지역을 더 잘 발전시킬 것입니다."
 USA_focus_minraculture_act: "광업과 농업에 대한 평가"
 USA_focus_minraculture_act_desc: "대평원 지역의 광업과 농업은 매우 다양하지만 아직 개발되지 않았습니다. 지질 조사와 위험 평가를 활용하여 새로운 채굴 작업을 시작하고 필요한 광물 자원의 국내 공급을 늘릴 수 있을 것입니다."
 USA_focus_hydroponics_act: "수경재배 법"
 USA_focus_hydroponics_act_desc: "수경 재배는 아직 초기 단계의 방식이지만, 이를 더 깊이 이해하도록 끌어올리지 못할 이유는 없습니다. 이러한 대규모 실험의 개발과 시험을 위한 지정 구역을 조성하는 구상이 마련될 것입니다."
 USA_focus_the_lone_south: "외로운 남부 지역"
 USA_focus_the_lone_south_desc: "외로운 남부는 텍사스, 아칸소, 루이지애나, 오클라호마, 뉴멕시코로 구성됩니다. 이 주들은 매우 발전한 곳과 전혀 발전하지 못한 곳이 크게 뒤섞여 있으므로, 의회는 이 주들과 부족한 부분의 균형을 맞춰 이 지역이 번영하고 국가와 함께하도록 해야 합니다."
 USA_focus_red_river_commission: "레드 강 위원회"
 USA_focus_red_river_commission_desc: "레드리버 위원회는 텍사스와 오클라호마 출신 위원으로 구성된 공동 기구로, 두 주가 효과적인 자원 확장을 모색하도록 묶어 주기 위한 것입니다. 텍사스 석유를 활용한 새로운 석유화학 관련 일자리와 자원, 그리고 오클라호마의 주목할 만한 철광석 매장지는 양측의 이목을 끌어 합의에 이르게 했습니다."
 USA_focus_censouth_zoning_reforms: "남부중앙 영토 경계 평준화"
 USA_focus_censouth_zoning_reforms_desc: "광활한 평원과 뒤섞인 지형으로 인해 토지 이용 구획이 혼란스러웠습니다. 따라서 이 구획 개혁법은 주 내 부진한 지역을 개발하는 데 필요한 건설 구역을 간소화하고 효율화하는 데 사용될 것입니다."
 USA_focus_rio_grande_shipyard: "리오그란데 조선소"
 USA_focus_rio_grande_shipyard_desc: "텍사스 조선소는 필요한 수준에서는 보통이지만, 국가 안보에 대한 관심이 높아지고 국내외 수요가 늘어나면서 많은 이들이 이 기존 일자리 시장의 증설이나 확장을 청원해 왔습니다. 이를 염두에 두고 의회는 텍사스 주 의회와 함께 이 수요를 충족하기 위해 리오그란데 조선소라는 합작 기업을 설립했습니다."
 USA_focus_austin_investment_firm: "오스틴 투자 기업"
 USA_focus_austin_investment_firm_desc: "오스틴 투자 회사는 텍사스를 중심 거점으로 투자를 진행하여 외로운 남부 주들의 더 농촌적인 지역에 일자리를 만들기 위한 정부 구상입니다."
 USA_focus_unregulated_destiny_to_manifest: "자유로운 영토 확장론"
 USA_focus_unregulated_destiny_to_manifest_desc: "많은 이들은 명백한 운명을 지나간 역사의 한 페이지로 보지만, 현대 시민은 자신의 운명을 스스로 개척해야 합니다. 토지 취득을 제한하는 법이 이를 가로막게 둘 수 없으며, 따라서 이 분야의 규제 철폐가 이루어질 것입니다."
 USA_focus_lone_mining_company: "로네 산맥 광산 회사"
 USA_focus_lone_mining_company_desc: "현대판 명백한 운명 정신에 따라 의회와 뉴멕시코, 오클라호마 주는 오스틴 투자 회사의 후원을 받는 외로운 광업 회사를 설립했습니다. 이 지역의 토지 취득법과 광업법이 바뀌면서, 이 회사는 필요한 원자재의 국내 공급원을 찾아 확대하여 국내 일자리 창출을 뒷받침하기를 바랍니다."
 USA_focus_greater_lakes_region: "오대호 지역"
 USA_focus_greater_lakes_region_desc: "오대호 인접 주들은 오대호 주들로 여겨지지만, 미네소타, 아이오와, 미주리, 켄터키 등 그 주변 주들은 \\"연관된\\" 지역의 문화가 뒤섞여 있어 일부에서는 대오대호 주들이라 부릅니다. 이 주들은 농업이 활발한 지역과 한때 대규모였던 산업 부문으로 이루어져 있습니다. 이제 이 지역에 균형과 개혁을 가져오는 것은 의회의 몫입니다."
 USA_focus_milwaukee_mining_firm: "밀워키 광산업"
 USA_focus_milwaukee_mining_firm_desc: "지역 광물 채취 회사가 밀워키에 설립되었습니다. 목표는 단순합니다. 국내 일자리 증가를 뒷받침하기 위해 핵심 자원 사업을 세우거나 기존 사업을 확장하는 것입니다."
 USA_focus_from_rust_to_refined: "구식 생산라인 교체"
 USA_focus_from_rust_to_refined_desc: "러스트 벨트라는 이름은 제조업 부문의 활력이 계속 떨어지는 데서 비롯되었습니다. 따라서 이 산업 지대가 더 이상 녹슬지 않도록 활력을 되찾는 데 투자해야 합니다."
 USA_focus_lakeside_hubs: "호수 주변의 잠재성"
 USA_focus_lakeside_hubs_desc: "오대호는 매력적인 관광지입니다. 이러한 명소의 토지 이용 구획을 우선시함으로써 사업과 관광 사업을 더 잘 개발할 수 있을 것입니다."
 USA_focus_erie_boom_act: "이리 강 지역 산업 활성화"
 USA_focus_erie_boom_act_desc: "이리 호는 캐나다와의 무역과 관광 및 기타 사업이 뒤섞인 중심 거점입니다. 이 지역은 한동안 상태가 좋지 않았으므로, 이 거대한 호수 주변 지방 경제를 다변화하고 활성화하기 위해 직접 투자를 투입해야 합니다."
 USA_focus_diversity_act: "다양성 법"
 USA_focus_diversity_act_desc: "다양성법은 경제 다변화의 필요를 요청하는 주들에 자금이 배정되도록 합니다. 이는 전체 자금 수요를 제한하고, 주들이 \\"지나치게 특화된\\" 분야에 대해 경제적으로 그다지 의존하지 않게 하는 합의를 이끌어낼 수 있습니다."
 USA_focus_sprawling_act: "미지의 호수 자원 개발"
 USA_focus_sprawling_act_desc: "심해 생물의 촉수처럼 이 지역의 광업 부문은 극도로 부족합니다. 따라서 이 후원 구상에서는 지역 광업 회사들이 필요한 희소 광물 자원을 확대하고 집중하는 데 중점을 둘 것입니다."
 USA_focus_the_southeastern_region: "남동부 지역"
 USA_focus_the_southeastern_region_desc: "\\"딥 사우스\\"라고도 불리는 남동부는 극단이 공존하는 지역입니다. 일부 지역은 매우 훌륭하게 개발되었지만, 다른 곳은 정착민이 와 본 적도 없는 것처럼 보입니다. 우리 국가의 아름다움을 보존하고자 하지만, 그럼에도 의회는 미국 남부 주들의 균형을 맞추기 위해 노력해야 합니다."
 USA_focus_gulf_ports_act: "걸프만 항구 확장"
 USA_focus_gulf_ports_act_desc: "걸프 지역은 전략적 거점이자 자원이 풍부한 곳입니다. 이 지역은 해운업이 활발하며, 따라서 각 주의 전반적인 향상을 위해 항만과 조선소를 확장하고 정비해야 합니다."
 USA_focus_urbanized_forest_act: "도시의 숲"
 USA_focus_urbanized_forest_act_desc: "의회가 통과시킨 이 법은 미시시피와 같은 주들의 도시화된 인구를 이동시키고 더 잘 분산시키기 위한 개발 유인책을 만들고자 합니다. 이렇게 하면 더 넓은 기반이 조성되어 각 주와 그 경제가 더 큰 규모로 또는 더 빠르게 다변화하고 확대될 수 있습니다."
 USA_focus_mobile_mineral_act: "광물 추출 자동화"
 USA_focus_mobile_mineral_act_desc: "모바일 광물법은 채굴이 그리 쉽지 않은 광물로 알려진 주들에서 광업의 개발과 제한적이고 전략적인 확장을 개혁하고 장려하는 법안입니다. 이러한 구상은 일자리를 만들고 국내 공급을 늘리는 데 도움이 될 것입니다."
 USA_focus_dixie_development_scheme: "딕시 개발 계획 (DDS)"
 USA_focus_dixie_development_scheme_desc: "DDS는 안쪽에서 바깥으로 작동하도록 설계된 계획입니다. \\"딕시의 심장\\"으로 여겨지는 앨라배마와 미시시피 두 주에 강력한 기반을 만들어, 이 주들이 더 넓은 남동부 지역 개발에 파급 효과를 일으키도록 할 것입니다."
 USA_focus_carolina_cultivation_program: "캐롤라이나 경작 프로그램"
 USA_focus_carolina_cultivation_program_desc: "캐롤라이나는 혼합된 성격의 지역이며, 따라서 산업 일자리 증가를 더 잘 뒷받침하도록 주 농업 기반을 개발하는 데 도움을 주어야 합니다. 도시를 위한 식량은 어딘가에서 나와야 한다는 점을 기억하십시오."
 USA_focus_shining_act: "전면적인 광업 중심 개혁"
 USA_focus_shining_act_desc: "샤이닝법은 국내 지역 광업을 확대하여 확보 가능한 광석을 더 잘 시험하고 해당 사업이 장기적으로 수익을 낼 수 있게 하는 광업 개혁 모음입니다."
 USA_focus_the_capital_region: "수도권 지역"
 USA_focus_the_capital_region_desc: "워싱턴 D.C. 수도권을 둘러싼 주들은 상당히 부유한 지역입니다. 그렇다고 이들을 경제 투자에서 제외해야 한다는 뜻은 아니며, 그 투자가 무엇이 될지는 의회에 달려 있습니다."
 USA_focus_parkersburg_economic_committee: "파커즈버그 경제위원회"
 USA_focus_parkersburg_economic_committee_desc: "PEC는 주 간 통상 합동 위원회로, 표적화된 경제 안전망을 평가하고 키워 이 지역 주들의 덜 발전된 지역의 지방 경제를 활성화하기 위한 것입니다."
 USA_focus_atlantic_act: "대서양 법"
 USA_focus_atlantic_act_desc: "대서양법은 지역 사회와 관련 산업을 활성화하기 위한 해양 개발 계획입니다."
 USA_focus_the_roanoke_mineral_act: "로아노크 광물 개발"
 USA_focus_the_roanoke_mineral_act_desc: "이 광물법은 지역 일자리와 원자재의 국내 공급을 확대하는 표적 성장법이며, 대상 주들에 개발의 파급 효과를 불러일으키도록 장려할 것입니다."
 USA_focus_the_mary_lands_act: "지역간 상호 협력"
 USA_focus_the_mary_lands_act_desc: "의회는 상호 연결 경제법을 통과시켰으며, 이에 따라 한 주의 발전이 다른 주의 발전을 돕는 것과 함께 이루어져야 합니다. 국내 무역과 소비, 그리고 보다 \\"지역 상품 구매\\" 식의 사고방식을 장려하는 것이 목표입니다."
 USA_focus_the_appalachian_reforms: "애팔래치아 개발"
 USA_focus_the_appalachian_reforms_desc: "애팔래치아 개혁은 철광석과 에너지 자원 등에서 기존 광업의 지역 개발과 확장을 장려하는 일련의 광업 개혁입니다."
 USA_focus_the_delaware_act: "델라웨어 관광법"
 USA_focus_the_delaware_act_desc: "델라웨어법의 주된 목표는 다음과 같습니다. 해양 및 관광 산업 성장 계획을 결합하여 서로의 필요를 키우고 연결할 방법을 찾는 것입니다."
 USA_focus_the_northeastern_region: "북동부 지역"
 USA_focus_the_northeastern_region_desc: "북동부 회랑으로 유명한 미국 북동부는 거의 끊임없이 이어진 도시 확산 지대입니다. 그러나 이 주들의 내륙으로 갈수록 자연이 더 많아집니다. 의회는 이 지역의 자연 보전을 최대한 높게 유지할 수 있도록 어디를 개발할지 균형을 맞추는 정책을 마련해야 합니다."
 USA_focus_the_vershire_act: "버셔 투자 법"
 USA_focus_the_vershire_act_desc: "주를 테트리스 조각에 비유한 기반 위에서, 버몬트와 뉴햄프셔가 표적 투자 계획을 주도하여 이 지역의 다른 주로 더욱 확대되도록 도울 것입니다."
 USA_focus_albany_development_program: "올버니 개발 프로그램"
 USA_focus_albany_development_program_desc: "ADP는 올버니 광역권에서 시작하여 동쪽으로 나아가며 지역 경제를 다변화하도록 돕기 위해 예정된 계획입니다."
 USA_focus_the_hartford_mining_act: "하트퍼드 채굴 법"
 USA_focus_the_hartford_mining_act_desc: "이 법으로 지역 광업 회사와 새로운 광물 투자가 이루어질 것입니다. 그 영향이 크지는 않을 것으로 예상되지만, 예상 채굴 자원은 상당히 다양해 보입니다."
 USA_focus_the_kingston_reforms: "킹스턴 개혁"
 USA_focus_the_kingston_reforms_desc: "이 개혁은 재개발 회사를 중심으로 하며 토지 이용 구획 규제를 완화하여, 공터를 더 빨리 확보하고 계획 및 후속 건설 과정을 앞당기는 것을 목표로 합니다."
 USA_focus_new_haven_mineral_reforms: "뉴헤이븐 광업 개혁"
 USA_focus_new_haven_mineral_reforms_desc: "이 광물 입법으로 부족한 희소 자원과 관련된 광산이 개발될 것입니다. 북동부가 본래 광업의 중심지는 아니지만, 그럼에도 이 지역은 지금보다 더 많은 것을 제공할 수 있습니다."
 USA_focus_the_newer_england_act: "뉴잉글랜드 개혁"
 USA_focus_the_newer_england_act_desc: "새로운 개혁, 새로운 개발, 그리고 이 지역 경제 번영의 새 장과 함께 오래된 지역에 더 새로운 변화를 세우는 것이 마땅합니다. 따라서 이 지역의 핵심과 관련된 개발이 시행되어 자연과 도시로 가득한 북동부의 아름다움을 완전히 되살리고 키울 것입니다."
 USA_new_millennia_new_media: "새로운 천년, 새로운 미디어"
 USA_new_millennia_new_media_desc: "새로운 천년기가 열리면서 기술은 우리가 깨달은 것 이상으로 발전했습니다. TV와 인터넷은 일반 시민의 삶에서 새로운 주류가 되었습니다. 이에 따라 더 많은 정보가 더 빠른 방식으로 더 많은 사람에게 도달하고 있으며, 대부분은 이를 긍정적으로 보지만 잘못된 사람들이 이러한 새로운 방식을 자신의 목적을 위해 이용할까 경계하는 소수가 늘고 있습니다."
 USA_more_opinion_pieces: "표현의 자유 극대화"
 USA_more_opinion_pieces_desc: "대중에게는 우리의 지혜와 인도가 필요합니다. 그렇지 않다면 어떻게 시사 현안의 실체를 이해하겠습니까. 정치 지도자들의 결점에 대한 인식을 확산하려면 가장 강력한 인물들을 동원해야 합니다."
 USA_redefining_news_channel: "언론 미디어 재정립"
 USA_redefining_news_channel_desc: "많은 이들이 여전히 뉴스 채널이 무엇인지 갈피를 잡지 못하고 있으며, 따라서 변화하는 시대를 온전히 이해하지 못합니다. 이를 염두에 두고 현대 뉴스 채널이 무엇인지에 대한 공감을 얻고 우리 자신을 재정의해야 합니다."
 USA_appealing_to_the_masses: "대중들에 호소"
 USA_appealing_to_the_masses_desc: "대중이 더 많은 것, 가장 듣고 싶은 것을 갈망하는 만큼 우리는 그들이 원하는 것을 주어야 합니다. 우리가 신뢰하는 것은 국민이며 국민은 언제나 옳기 때문입니다."
 USA_party_lines_and_view_times: "모든 정당 사안은 대중의 뜻에 따라"
 USA_party_lines_and_view_times_desc: "우리 사랑하는 공화국의 정당들이 국가를 움직이게 합니다. 국민이 빨강을 원하면 빨강을, 파랑을 원하면 파랑을 줄 것이니 우리는 정당과 국민이 바라는 바를 살펴야 합니다. 국민은 자신이 무엇을 원하는지 알고 있으며 우리는 국민이 원하는 것을 주어야 합니다."
 USA_more_defined_coverage: "더욱 정확한 보도"
 USA_more_defined_coverage_desc: "오물이 쌓였지만 한동안 아무도 치우지 않았습니다. 국민이 현대의 의견 기사에 동조하게 되면서, 입은 피해를 바로잡으려면 먼 길이 남아 있습니다."
 USA_keeping_business_standards: "산업 기준 유지"
 USA_keeping_business_standards_desc: "오늘날의 기준은 기껏해야 수준 이하이고 최악의 경우 반역에 가깝습니다. 국가와 더 넓은 세계의 현대적 문제에 맞는 현대적 기준을 세워야 합니다."
 USA_informing_the_masses: "대중에게 알리기"
 USA_informing_the_masses_desc: "국민은 정치 지도자들의 연출이 갈수록 늘어나면서 오늘날의 현안에 눈이 가려졌습니다. 국민이 너무 오래 겪어 온 이러한 부당함을 바로잡아야 합니다."
 USA_there_are_more_options: "또 다른 선택지?"
 USA_there_are_more_options_desc: "국민은 깨어 있고, 로비스트는 위축되었으며, 월스트리트는 단순한 거리에 지나지 않게 되었습니다. 인식이 높아지면서 사람들은 서서히 현 상태에서 벗어나기 시작하고 있으며, 이를 배경으로 신생 정당들이 미국 정치 무대의 떠오르는 별이 되었습니다. 이 정당들이 새롭고 더 밝은 길로 이끌 것인가, 아니면 우리의 노력은 진정한 변화를 만들기에는 너무 늦었는가..."
 USA_scars_from_the_forever_war: "영원한 전쟁의 흉터"
 USA_scars_from_the_forever_war_desc: "마약과의 전쟁은 국가에 거의 영원에 가까운 전쟁이었습니다. 시간이 흐르면서 새로운 형태를 띠게 되었고, 과거의 대응은 현재의 영향에 대해 거의 아무런 효과가 없었던 것 같습니다. 의회는 너무 커서 무너뜨릴 수 없게 되기 전에 이 점점 커지는 문제에 주목해야 합니다."
 USA_redrafting_targeting_legislations: "법의 목적 재개정"
 USA_redrafting_targeting_legislations_desc: "마약과의 전쟁은 많은 입법을 낳았는데, 지금 돌아보면 좋게 말해도 매우... 표적 지향적이었습니다. 이 심각하게 시대에 뒤떨어진 문서들을 다시 작성하고 개혁해야 합니다."
 USA_the_amnesty_initiative: "사면 위원회"
 USA_the_amnesty_initiative_desc: "마약과의 전쟁은 부당하게 긴 형벌로 수많은 가정의 삶을 망쳐 놓았습니다. 독립 위원회가 설립되어 마약과의 전쟁 사건을 가능한 한 많이 검토하여 진정한 정의가 실현되도록 할 것입니다."
 USA_pulling_back_from_the_war: "전쟁에서 물러설 시기"
 USA_pulling_back_from_the_war_desc: "우리는 무대를 마련하고 개혁을 계획했으며, 이제 전쟁에서 완전히 물러설 때입니다... 이미 오래전에 이루어졌어야 했습니다."
 USA_cutting_failed_programs: "실패한 프로젝트 정리"
 USA_cutting_failed_programs_desc: "마약과의 전쟁이 최선의 구상은 아니었지만 완전한 실패도 아니었습니다. 따라서 마약과의 전쟁을 구성했던 중복되거나 명백히 실패한 사업을 되돌아가 정리해야 합니다."
 USA_repurposing_budgets: "예산 재분배"
 USA_repurposing_budgets_desc: "여러 사업은 예산 배정이 혼란스러웠고, 일부 사업은 서로 다른 부처를 위해 만들어졌으면서도 같은 목적에 기여했습니다. 이 혼란을 재작성하고 간소화하여 마약과의 전쟁을 더 효율적으로 만들어야 합니다."
 USA_holding_our_ground: "우리의 땅에 굳건히"
 USA_holding_our_ground_desc: "지고 있지는 않지만 이기고 있지도 않습니다. 이 문제를 진정으로 해결하는 방법을 이해하려면 미래 세대와 미래 전체를 내다봐야 합니다... 지금은 방어에 만족할 수밖에 없습니다."
 USA_reinvesting_in_the_war: "갈등에 대한 새로운 접근"
 USA_reinvesting_in_the_war_desc: "마약 남용 문제에 대한 우리의 방종이 문제를 악화시켰으며, 이 문제 전반에 대한 우리의 구상을 질책하고 재고해야 합니다."
 USA_new_wave_thinking: "신세대 이념으로 생각하자"
 USA_new_wave_thinking_desc: "새로운 세대는 이 정도 규모의 문제를 완전히 해결할 방법이 없음을 이해하지만, 전반적인 과잉을 완화하고 줄일 방법은 있습니다. 제한적 비범죄화의 형태와 낡은 법률의 재평가 등이 이 노력에 도움이 될 것입니다."
 USA_going_on_the_offensive: "확실한 공격의 대상"
 USA_going_on_the_offensive_desc: "우리는 이 문제에 배수진을 치고 있습니다. 연방 정부에 상당한 비용이 들겠지만, 국민의 미래가 마약의 영향에서 벗어나도록 보장하기 위해 치러야 할 대가는 국민의 안전입니다."
 USA_the_tides_of_the_peoples_will: "The Tides Change Of The People's Will"
 USA_the_tides_of_the_peoples_will_desc: "공화당과 민주당의 양당 독점은 국민의 마음에 큰 파문을 일으켰습니다. 정치적 기득권은 오랫동안 분열만을 낳았지만, 이제 변화의 바람이 불기 시작했고 국민은 돛을 펼치고 있습니다."
 USA_people_seeking: "시민들의 정부에 대한 정당성 추구"
 USA_people_seeking_desc: "국민은 운명의 바뀌는 물결을 보았고, 이제 스스로 정체성의 길을 찾고 있으며 국가와 국민은 이제 자유롭게 선택할 수 있을 것입니다."
 USA_true_representative: "진실된 대표자"
 USA_true_representative_desc: "양당 독점을 걷어내야 합니다. 국민의 의지는 자신들의 목소리를 대변할 진정한 대표자를 찾을 것입니다."
 USA_electoral_rainbow: "선거의 무지개"
 USA_electoral_rainbow_desc: "변화의 바람이 국가를 휩쓸었고, 따라서 미래는 선택지의 무지개가 허락하는 만큼만 밝습니다."
 USA_demsoc_victory: "붉은 민주당의 승리"
 USA_demsoc_victory_desc: "양당 독점이 대중의 호감을 잃은 이후, 유럽 등지의 민주사회주의 운동에 동조하던 많은 이들이 당나귀 당에서 갈라져 나와 새로운 정당을 만들었습니다. 이 새 정당은 정책 결정에서 유럽 측 대응 세력의 많은 흐름을 따를 것입니다. 붉은 민주당은 옛 정당이 만들어낸 사회적, 경제적 격차를 잇는 다리입니다. 이제 우리의 울새는 변화의 새벽을 향해 날아갑니다."
 USA_bull_moose_charges_ahead: "푸른 불 무스 (Bull Moose)의 승리"
 USA_bull_moose_charges_ahead_desc: "이전의 루스벨트들처럼 우리는 이제 불무스의 뿔을 갖고 있고, 국민의 의지를 갖고 있으며, 다시 한번 대통령직을 갖게 되었습니다. 이 빛 속에 머물려면 앞으로 돌진하여 국가의 고난을 해결해야 합니다."
 USA_green_victory: "더 푸른 내일"
 USA_green_victory_desc: "우리의 승리와 함께 미국을 녹색 빛의 등대로 만들어, 우리 국민뿐 아니라 이 세계의 모든 사람들에게 빛을 비추고 도움이 되도록 할 것입니다."
 USA_yellow_victory: "자유와 함께 태양이 빛나네"
 USA_yellow_victory_desc: "마침내 때가 왔습니다. 자유지상당이 사상 처음으로 대통령 선거에서 승리하여, 우리는 오랜 세월 자유로운 이 땅을 괴롭혀 온 암덩어리와 종기를 이제 바로잡을 수 있습니다."
 USA_reform_victory: "개혁에서의 승리"
 USA_reform_victory_desc: "로스 페로가 대통령직에 도전하던 시절 이래로 개혁당은 한때 붉은 우산이었던 공화당의 각주에 불과했습니다. 이제 위대한 구당이 더는 위대하지 않게 된 지금, 우리는 다시 무대에 올라 자체 유권자와 추종자 기반으로 승리의 길을 확보했으며, 이제 우리나라의 개혁의 길에 나섭니다."
 USA_constitutional_party_victory: "헌법에서의 승리"
 USA_constitutional_party_victory_desc: "붉은색과 푸른색의 양당 체제는 진정으로 끝났습니다. 이 승리와 함께 우리는 건국 원칙에서 벗어난 이들의 태만을 바로잡기 위해 굳건히 서 있습니다. 라이노의 승리. 건국의 아버지들의 승리. 헌법의 승리."
 USA_political_and_economic_reforms: "정치 및 경제 개혁"
 USA_political_and_economic_reforms_desc: "인생의 길에는 굴곡이 많으며, 미국의 길은 일종의 순환하는 여정을 겪어 왔습니다. 정치적 양당 체제와 풀뿌리 운동을 뒤흔드는 만연한 로비 활동 등이 수렁을 만들어 냈습니다. 그러나 변화의 바람이 시민들 사이로 불어옴에 따라, 그 바람이 정치 지도자들의 생각에도 닿기를 바라게 됩니다. 미래는 실로 수수께끼이며, 미래가 무엇을 품고 있는지는 오직 시간만이 말해 줄 것입니다."
 USA_anti_trust_department: "독점금지 부서"
 USA_anti_trust_department_desc: "DoAA는 우리가 반독점 사건을 다루고 관심 대상 인물이나 단체를 조사하는 방식을 혁신하게 될 것입니다. 전담 부서가 생기면 국가의 일상 활동에서 제기되는 거의 무수한 우려와 주장에 부서의 모든 역량을 쏟을 수 있습니다."
 USA_union_act: "4차 산업혁명법"
 USA_union_act_desc: "기술의 시대가 우리나라와 경제, 그리고 우리의 생활 방식 자체를 휩쓸었습니다. 이 급격한 변화와 함께 일반 시민들이 터무니없는 이유로, 혹은 아무 이유 없이 감시당하고 일자리에서 쫓겨나는 수상한 기업 압박 수단이 계속 늘고 있습니다. 이 법안은 논란이 많은 노동권(Right To Work) 법을 폐지하고 노조 설립 권한을 개혁하게 될 것입니다. 성장하는 기술 기업의 많은 경영진이 강하게 반대하지만, 지금으로서는 우리가 아니라 그들의 문제일 뿐입니다."
 USA_automation_act: "자동화 진보 법"
 USA_automation_act_desc: "APA는 노동 집약적인 작업 환경에서 자동화 기술의 도입을 규제하고 조정할 것입니다. 이 법은 대중이 자동화라는 개념에 익숙해지도록 돕고 제4차 산업혁명으로의 전환을 원활하게 하기 위한 것입니다. 많은 경영진이 불평하지만, 대중은 끊임없이 변하는 세상에 맞춰 재교육과 갱신을 받을 시간을 얻을 수 있다는 점에서 이 구상을 환영합니다."
 USA_safe_banking_act: "안전한 은행 법"
 USA_safe_banking_act_desc: "안전 은행법은 민간 투자자와 은행이 개인 저축과 개인 소득을 건드리지 못하도록 제한하고 개혁할 것입니다. 우리는 1920~30년대에 우리 것이 아닌 돈을 과도하게 쓴 일에서 교훈을 얻지 못한 듯하지만, 이제 역사에서 진정으로 배우고 국가를 경제적 번영의 길로 나아가게 할 기회가 있습니다."
 USA_political_diversity_act: "정지척 다양성 법"
 USA_political_diversity_act_desc: "PDA는 모든 주 단위 공직 선거에서 언론과 투표 등록 사무소가 제3당을 공정하게 보도하고 등록하도록 의무화합니다. 이는 주지사 이하 선거 운동이 필요한 모든 직위에서 투표소와 후보자 언론 보도가 공화당이나 민주당 후보에만 집중되어서는 안 된다는 뜻입니다. 이 법안의 부칙으로 유권자는 이 선거에서 투표할 때 자신이 속한 정당을 등록할 수 있게 됩니다."
 USA_political_Fairness_act: "정치적 공정성 법"
 USA_political_Fairness_act_desc: "PFA는 의회 선거에서 제3당의 참여에 관한 연방 기준을 만드는 법안입니다. 최소 요건은 제3당이 투표 연령 인구의 유권자 등록 1% 이상을 확보해야 한다는 것입니다. 또한 모든 참여 정당을 균형 있게 보도하기 위해 언론사가 각 정당의 예비선거와 최종 후보 경쟁자를 따라가도록 보도를 조직하는 내용도 포함됩니다."
 USA_federal_elections_act: "연방 선거법"
 USA_federal_elections_act_desc: "FEA는 양당 체제가 생긴 이래 미국에 필요했던 핵심 입법입니다. 투표 개혁과 투표 접근성을 강제함으로써 대중은 이제 더 효율적이고 효과적으로 투표할 수 있습니다. 게다가 제3당 후보들은 정치 공정법과 같은 원칙을 따라 대통령직에 출마할 수 있게 되며, 주된 차이는 요건이 의회 선거의 주별 요건이 아닌 전국 유권자를 대상으로 한다는 점입니다. 이를 계기로 많은 이들이 국가가 완수한 개혁을 축하하기 시작했으며, 새로운 아이디어와 타협의 수단이 늘어남에 따라 미국의 독수리는 다시 한번 날아오를 것입니다."
 public_ignored1: "§Y자유지상주의§! 운동을 무시함"
 public_ignored3: "§Y사회주의§! 운동을 무시함"
 public_ignored5: "§Y환경주의§! 운동을 무시함"
 anti_trust_awareness1: "§!유죄§Y 판결을 받은 제너럴 다이내믹스"
 anti_trust_awareness2: "VAW CARBON이 §Y유죄§!로 판명됨"
 anti_trust_awareness3: "블루스타 메탈 리사이클링이 §Y유죄§!로 판명됨"
 anti_trust_awareness4: "듀에인 메이너드가 §Y유죄§!로 판명됨"
 econ_reforms1: "§Y반독점국 법§!을 통과시킴"
 econ_reforms2: "§Y제4차 산업혁명법§!을 통과시킴"
 econ_reforms3: "§Y자동화 진전법§!을 통과시킴"
 econ_reforms4: "§Y안전 은행법§!을 통과시킴"
 voting_reforms1: "§Y정치 다양성법§!을 통과시킴"
 voting_reforms2: "§Y정치 공정법§!을 통과시킴"
 voting_reforms3: "§Y연방 선거법§!을 통과시킴"
 anti_military_push_flag: "지정학에 §Y정의롭게§! 접근했다"
 compromising_approach_flag: "§Y세계 정세를 중재§!하기로 선택했다"
 militarism_grows_flag: "이 지구상에 §Y우리의 영유권을 주장§!할 것이다"
 focus_arming_our_horse_tooltip: "우리는 외국 분쟁에서 수완을 발휘해, 분쟁 당사국에 최선의 결과를 안겨 줄 뿐 아니라 장기적으로 우리 자신에게도 이득이 되도록 할 것입니다. 협상 테이블에서 그럴듯한 이야기를 꾸며낼 수 있다면 자원 권리와 잠재적 영향력 등이 손에 들어올 것입니다."
 USA_the_internet_recession: "2001년 경기후퇴"
 USA_the_internet_recession_desc: "닷컴 버블이 붕괴하자 경제는 여러모로 더디게 기어가게 되었고, 이 경제 재앙은 발생 시기 때문에 \\"01년\\" 불황이라 불렸습니다."
 USA_anti_big_business_movement: "반대기업 운동"
 USA_anti_big_business_movement_desc: "대기업의 부상이 일반 대중의 눈에 더 띄게 되면서 일부는 불만을 품고 경제의 독점화 심화를 풍자한 \\"빅 인더스트리\\"라는 말을 퍼뜨리기 시작했습니다."
 USA_the_global_financial_crisis: "국제 금융 위기"
 USA_the_global_financial_crisis_desc: "닷컴 버블의 여파와 이어진 불황은 미국 경제의 큰 둔화를 낳았고, 이는 \\"08년\\" 금융 붕괴라 알려진 사태로 절정에 이르렀습니다."
 USA_subprime_mortgage_crisis: "서브프라임 모기지 위기"
 USA_subprime_mortgage_crisis_desc: "세계 금융 위기의 파급 효과는 서브프라임 모기지를 통해 금융 부문에서 제한적이고 잘 알려지지 않은 위기로 이어졌고, 시장의 추가 불안정과 경제 기관에 대한 신뢰 하락을 낳았습니다."
 USA_2008_housing_crash: "2008년 주택시장 붕괴"
 USA_2008_housing_crash_desc: "\\"08년\\" 금융 또는 주택 붕괴라 불리게 된 사태는 수많은 요인이 겹친 결과이며, 이 요인들은 오늘날까지 논란이 크지만, 부실한 입법과 용도 지역 규제, 그리고 통제되지 않은 주택 단기 전매가 문제의 전반적인 \\"원인\\"에 상당한 요인이었다는 데에는 많은 이들이 동의합니다."
 USA_focus_the_long_recession: "긴 불황"
 USA_focus_the_long_recession_desc: "대불황의 정점이 한참 지났음에도 그 여파는 사라지지 않았습니다. 양당 간의 모순된 정책 수립이 회복 노력을 가로막고 정체시켜, 일부가 \\"긴 불황\\"이라 부르는 사태로 이어졌습니다."
 USA_focus_growing_politicalization: "커지는 정치화"
 USA_focus_growing_politicalization_desc: "정치적 쇼맨십과 로비스트가 영향력을 키우면서, 이 영향력은 겉보기에 평범하고 일상적인 대화를 사소한 것에 기반한 지나치게 주관적인 논쟁으로 쪼개기 시작했습니다. 이러한 분열의 심화는 한때 하나로 뭉쳤던 주제들에서 정치적 무관심과 양극화를 키웠습니다."
 USA_focus_growing_plutocratic_influences: "커지는 금권 정치의 영향력"
 USA_focus_growing_plutocratic_influences_desc: "시간이 흐르면서 정치 지도부, 기업 거물, 만연한 로비스트들이 느슨한 연합을 이루어 다수를 희생시키며 서로의 이익을 도모함에 따라, 그 다수는 점점 더 급진적이 되고 불신을 키우고 있습니다. 이 불신은 이른바 양당 체제 안에서 파벌 상태를 점점 심화시켰고, 일부는 실제 문제에 대한 이성과 실용주의를 버린 채 갈수록 극단적인 견해로 기울고 있습니다. 많은 이들이 이를 미국의 제2의 도금 시대라 부르기 시작했습니다."
 USA_focus_growing_political_radicalization: "커지는 정치적 급진화"
 USA_focus_growing_political_radicalization_desc: "정치적 쇼맨십이 늘고 미국 국민들이 점점 더 불신을 키우면서, 신념의 급진화는 불가피해집니다. 기성 체제가 버텨 낼 것인가, 아니면 자신들이 만든 산물에 굴복할 것인가."
 USA_domestic_policies: "미국 국내 정책"
 USA_domestic_policies_desc: "수십 년간 의회가 내린 선택들은 미국의 문화와 사회 구조를 빚어내고 변형시켰습니다. 누구에게 묻느냐에 따라 우리가 퇴보하고 있다고도, 전진하고 있다고도, 혹은 아무 데도 가지 못하고 있다고도 합니다. 이를 염두에 두면, 오늘날의 의회는 사건이 전개되고 새로운 문제가 생길수록 더 많은 문제에 직면할 것입니다."
 us_military_advisors_to_sierra_leone: "미국 군사 고문단"
 us_military_advisors_to_sierra_leone_desc: "미국은 우리 병사들에게 현대 전술을 훈련시키도록 고문단을 파견했습니다."
 red_white_blue_helmets: "적백청 헬멧"
 red_white_blue_helmets_desc: "미국의 군단은 미국적 자부심의 지혜를 담아 헬멧을 색으로 구분하되 구분하지 않기로 했고, 많은 이들이 UN의 옅은 파랑 일색과 달리 이들을 적백청 헬멧이라 부르게 되었습니다."
 joint_police_action: "합동 경찰 행동 정책"
 joint_police_action_desc: "베트남과 한국에서 실패한 것으로부터 배움으로써, 우리는 앞으로의 분쟁에 이를 적용해 스스로를 더 잘 지킬 수 있습니다."
 muslim_legion: "무슬림 군단"
 muslim_legion_desc: "무슬림 형제들이 자유 세계에서 건너와 우리나라의 해방을 돕고 있으며, 많지는 않지만 없는 것보다는 낫습니다."
 passive_aggressive_policy: "수동 공격적 정책"
 passive_aggressive_policy_desc: "한쪽에 물자를 공급하고 거기서 돈을 버는 방식으로, 우리가 분쟁에서 특정 편에 완전히 헌신하고 있다는 생각을 다른 이들이 갖지 못하도록 하려 합니다."
 us_military_advisors_to_afghanistan: "미국 군사 고문단"
 us_military_advisors_to_afghanistan_desc: "미국은 우리 병사들을 비정규전에 맞게 단련시키도록 훈련을 돕는 고문단을 파견했습니다."
 us_mass_media_problems: "대중 매체 문제"
 us_mass_media_problems_desc: "1970년대 이래 미국의 뉴스 채널은 뉴스 채널이 무엇을 뜻하는지를 바꾸어 놓았습니다. 반전 정서가 커지고 당시의 문화적, 사회적 혁명이 점점 두드러지자, 많은 이들이 정보를 얻기 위해 텔레비전, 특히 뉴스에 의존했습니다. 이와 함께 두 개의 사상 진영이 생겨났습니다. 그날의 사안을 다룰 때 뉴스는 엄격하게 비정치적이어야 한다는 전통주의적 사고가 있었고, 활동가 진영이 있었습니다. 뉴스가 의견 기사를 통해 중요한 사안을 알리고 인식을 확산하는 데 쓰일 수 있다는 현대적 사고입니다. 결국 활동가 진영이 승리한 듯하지만, 정치적 참호화의 징후가 뚜렷해지기 시작하면서 전통주의자들의 우려가 현실이 되기 시작했습니다."
 us_war_on_drugs: "마약과의 전쟁의 상흔"
 us_war_on_drugs_desc: "거의 태곳적부터 이어져 온 마약과의 전쟁은 1970년대 닉슨 행정부 때 대중화되었습니다. 노력은 시들해졌으나, 범죄에 매우 강경한 입장을 취한 레이건 행정부 아래에서 WoD 캠페인이 되살아났습니다. 그러나 최근 몇 년 동안 카르텔이 아편을 쏟아붓고 일반 의약품에 대한 의존이 뒤섞여 중독 위기를 낳으면서, 이 전쟁이 결국 패배했음을 점점 더 많은 이들이 깨닫고 있습니다. 21세기로 접어든 지금, 의회 의원들과 대통령은 미국 전역으로 번지고 있는 이 커져 가는 상흔을 해결하려 애써야 합니다."
 us_public_disorder: "Public Disorder"
 us_public_disorder_desc: "국민이 불안해하고 있으니, 걷잡을 수 없게 되기 전에 대처해야 합니다."
 political_establishment: "정치적 확립"
 political_establishment_desc: "미국은 조지 워싱턴 대통령직 이후 첫 선거부터 정치적 양당 체제였습니다. 많은 이들이 선택지가 달라지기를 바라지만, 현존하는 양당 체제만이 유일한 옳은 혹은 그른 선택이라는 인식이 미국 문화에 깊이 새겨져 있습니다. 물론 그 전제에 대한 시각은 다르지만 말입니다. 그러나 나라에 안정과 질서가 유지되고 있는 동안에도, 그러한 환상이 진실의 산물인지, 아니면 변화에 대한 방조와 무관심의 산물인지 궁금해집니다. 새로운 천년과 함께 새로운 문제가 오고, 현대 양당 체제와 그들의 아버지 세대가 어렵게 지켜 온 질서를 유지할 이들의 능력에 새로운 시대가 열릴 것입니다."
 congress_authority: "의회의 권위"
 congress_authority_desc: "전쟁에 나설 때 미국은 실제로 그러한 사업에 헌신하기 위해 의회를 거쳐야 하며, 이러한 의존은 그런 사안에 대한 의사 결정과 대응 속도를 늦춥니다. 지금은 평화의 시대이고 전쟁에 나서게 된다면 의회가 분명 그 결정에 일치단결할 것이니, 현대에는 문제가 되지 않을 것입니다... 그렇지 않을까요?"
 USA_rise_of_internet: "인터넷의 성장"
 USA_rise_of_internet_desc: "새로운 시대와 함께 새로운 기술의 시대가 열렸으며, 인터넷은 통신 기술의 최신 진보로 선전되고 있고 일부 설명에 따르면 평범한 사람들의 일상을 혁신하게 될 것입니다. 이것이 어떻게 전개될지는 시간만이 말해 줄 것입니다."
 USA_war_on_terror: "테러와의 전쟁"
