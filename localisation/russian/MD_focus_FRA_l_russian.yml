 FRA_GREEN_EU_assistance_decision_category: "Европейский экологический переход"
 FRA_activate_vigipirate: "Активировать Вигипирата"
 FRA_activate_vigipirate_desc: "Активировать французскую национальную систему оповещения о чрезвычайных ситуациях, развернуть вооруженных солдат для патрулирования общественных мест и усилить меры безопасности в особо важных местах. Это обеспечит защиту от террористических атак, но повлечет за собой постоянные расходы."
 FRA_declare_state_of_emergency: "Объявить чрезвычайное положение"
 FRA_declare_state_of_emergency_desc: "В ответ на критическую террористическую угрозу объявить чрезвычайное положение в стране. Это предоставит силам безопасности расширенные полномочия, но приостановит действие некоторых гражданских свобод."
 FRA_end_state_of_emergency: "Отмена режима чрезвычайного положения"
 FRA_end_state_of_emergency_desc: "По мере снижения непосредственной угрозы следует отменить режим чрезвычайного положения и восстановить нормальные гражданские свободы. Это поможет нормализовать повседневную жизнь и снизить политическую напряженность."
 FRA_intelligence_surge: "Интеллектуальный всплеск"
 FRA_intelligence_surge_desc: "Значительно увеличить финансирование и ресурсы для разведывательных служб с целью улучшения возможностей наблюдения и контртеррористических операций. Это позволит проводить упреждающие операции против террористических сетей."
 FRA_secure_critical_infrastructure: "Обеспечение безопасности критически важной инфраструктуры"
 FRA_secure_critical_infrastructure_desc: "Инвестируйте в укрепление критически важной инфраструктуры — электростанций, транспортных узлов, телекоммуникаций — от террористических атак. Это дорогостоящее мероприятие, но оно снижает уязвимость перед крупными нападениями."
 FRA_operation_sentinelle: "Операция «Сентинель»"
 FRA_operation_sentinelle_desc: "Для обеспечения внутренней безопасности необходимо задействовать тысячи солдат, патрулировать улицы, охранять важные объекты и поддерживать полицейские операции. Такое видимое военное присутствие успокаивает общественность, но создает дополнительную нагрузку на вооруженные силы."
 FRA_anti_terror_raid: "Провести антитеррористический рейд"
 FRA_anti_terror_raid_desc: "На основе собранной разведывательной информации провести рейды против предполагаемых террористических ячеек. Успех может сорвать запланированные атаки и снизить общий уровень угрозы."
 FRA_terrorism_defeated: "Объявить победу над терроризмом"
 FRA_terrorism_defeated_desc: "После восстановления стабильности и отсутствия недавних нападений, официально объявить о нейтрализации террористической угрозы. Это поднимет моральный дух и позволит стране двигаться вперед."
 FRA_rebuild_after_attack: "Восстановить поврежденную инфраструктуру"
 FRA_rebuild_after_attack_desc: "Инвестируйте в восстановление инфраструктуры, поврежденной в результате террористических атак. Восстановление этих объектов имеет решающее значение для возвращения к нормальной жизни и демонстрации устойчивости."
 FRA_tourism_recovery_campaign: "Кампания по восстановлению туризма"
 FRA_tourism_recovery_campaign_desc: "Запустить масштабную международную кампанию по продвижению Франции как безопасного туристического направления. Восстановление туризма жизненно важно для экономики и демонстрирует, что террористы не могут разрушить французский образ жизни."
 FRA_6threp_mission: "Народный энтузиазм"
 FRA_6threp_mission_desc: "Наша приверженность реформированию политической системы осчастливила многих людей. Многие хотят перемен, но нас нельзя воспринимать как тех, кто пытается затянуть этот процесс."
 FRA_rally_support: "Показать наш прогресс"
 FRA_rally_support_desc: "Наши оппоненты пытаются замедлить процесс и ставят под сомнение каждое наше изменение. Но мы должны оставаться непоколебимыми. Мы многого добились, и мы должны это показать."
 FRA_rally_ennemy: "Оппозиция критикует наши реформы."
 FRA_rally_ennemy_desc: "Хотя эти изменения необходимы, они не всегда находят одобрение у всех. Наша оппозиция делает все возможное, чтобы критиковать каждое решение, касающееся будущего нашей Республики."
 FRA_timebomb_mission: "Неизбежный развод"
 FRA_timebomb_mission_desc: "Две основные фракции внутри Социалистической партии угрожают выйти из партии, если мы не урегулируем ситуацию. Мы должны показать им, что у Социалистической партии есть будущее, пока не стало слишком поздно."
 FRA_support_decrease_mission: "Наша партия раскалывается."
 FRA_support_decrease_mission_desc: "Чем дольше мы будем медлить с тем, чтобы успокоить членов нашей партии, тем больше из них покинут нас и присоединятся к группам, более близким к их идеологии. Мы должны быстро исправить ситуацию."
 FRA_campaign_against_extremism: "Кампания против экстремизма"
 FRA_campaign_against_extremism_desc: "В эти неспокойные времена мы должны напомнить левым и центристам, что мы, социалисты, являемся правильным выбором в противостоянии набирающему силу политическому экстремизму."
 FRA_campaign_clash_traitors: "Отомстить предателям партии"
 FRA_campaign_clash_traitors_desc: "Любой, кто уходит от нас ради более модной вечеринки, должен ожидать, что мы разоблачим его в СМИ. Они — не что иное, как оппортунисты и агенты хаоса."
 FRA_boost_eurosceptism: "Кампания против Европейского союза"
 FRA_boost_eurosceptism_desc: "От публичных дебатов до уличных плакатов — всё наше общество должно излучать евроскептицизм. Мы должны дать понять французскому народу, что европейские бюрократы являются причиной всех наших проблем."
 FRA_disobey_treaties: "Нарушение европейских договоров"
 FRA_disobey_treaties_desc: "Мы больше не должны склоняться перед этими глупыми законами. Мы хозяева в своем доме, и в любом случае, наш выход из Европейского союза — лишь вопрос времени."
 FRA_denounce_eu_policies: "Разоблачение европейской политики"
 FRA_denounce_eu_policies_desc: "Мы должны сосредоточить свой протест на несправедливых законах, принимаемых Европейским парламентом без возможности им противостоять. Какой смысл голосовать на выборах, если их результат уже не зависит от нас?"
 FRA_threaten_media: "Угрожать проевропейским СМИ"
 FRA_threaten_media_desc: "Проевропейские настроения проникли в наши институты, вплоть до средств массовой информации. Мы должны напомнить этим бюрократам, чтобы они занимались темами, более соответствующими их уровню, и перестали идти против течения."
 FRA_red_benelux: "Освободите Бенилюкс"
 FRA_red_benelux_desc: "Мы должны освободить страны Бенилюкса от капитализма и европейского либерализма."
 FRA_benelux_boost: "Интегрировать культуры стран Бенилюкса"
 FRA_benelux_boost_desc: "Голландские, фламандские и валлонские рабочие теперь присоединяются к революции как единое целое, их фабрики и профсоюзы поглощены нашим социалистическим проектом."
 FRA_done_with_dumping: "Конец налоговых убежищ"
 FRA_done_with_dumping_desc: "Само существование этих стран, которые посвящают себя выполнению функций налоговых убежищ, является оскорблением самой концепции равенства и солидарности. Мы должны положить этому конец."
 FRA_dumping_boost: "Интегрируйте швейцарскую культуру."
 FRA_dumping_boost_desc: "Мы разрушили банковские структуры, поддерживавшие налоговую гавань, и швейцарские работники реинтегрируются в наш экономический проект."
 FRA_red_iberia: "Никогда больше диктаторов"
 FRA_red_iberia_desc: "Мы должны обеспечить, чтобы наш южный фланг не попал снова под влияние фашизма."
 FRA_iberia_boost: "Интегрировать иберийские культуры"
 FRA_iberia_boost_desc: "Испанское и португальское рабочие движения наконец-то увидели потенциал, который не был реализован в 1936 году, и присоединились к нашей революции на равных."
 FRA_ciao_bella: "Чао Белла"
 FRA_ciao_bella_desc: "Коммунистическая революция в Италии потерпела неудачу, но оставила неизгладимый след в сердцах итальянского народа. Пришло время исправить ошибки прошлого."
 FRA_italy_boost: "Интегрируйте итальянскую культуру."
 FRA_italy_boost_desc: "Наследие PCI продолжает жить. Мы завершаем проект «biennio rosso», начатый и так и не законченный итальянскими рабочими."
 FRA_avenge_long_knife: "Ночь длинных серпов"
 FRA_avenge_long_knife_desc: "Мы должны совершить революцию в германских государствах, чтобы освободить их от капитализма и предотвратить очередную победу национализма."
 FRA_ger_aus_boost: "Интеграция германских культур"
 FRA_ger_aus_boost_desc: "Восточногерманские промышленные кадры и австрийские профсоюзы вносят свою дисциплину и опыт в наш революционный проект."
 FRA_ostalgia: "Возродить революцию в Восточной Европе"
 FRA_ostalgia_desc: "Страны Восточной Европы сильно пострадали от советской оккупации. Мы должны показать им, что у коммунизма тоже есть свои положительные стороны."
 FRA_ostalgia_boost: "Интегрировать культуры Восточной Европы"
 FRA_ostalgia_boost_desc: "Мы преобразуем остаточную ностальгию, которая до сих пор сохраняется в Восточной Европе, в подлинный энтузиазм по отношению к нашей революции."
 FRA_birthplace_revolution: "Верните колыбель коммунизма"
 FRA_birthplace_revolution_desc: "Мы должны вернуть революцию русским, которые забыли былую славу коммунизма."
 FRA_birthplace_boost: "Интеграция славянских культур"
 FRA_birthplace_boost_desc: "Мы возвращаем себе колыбель революции, приветствуя возвращение русского и славянских народов в движение, которое они когда-то возглавляли."
 FRA_no_more_neutrality: "Разрушить нейтралитет Севера"
 FRA_no_more_neutrality_desc: "Страны Северной Европы слишком долго избегали выбора между социализмом и капитализмом. Пришло время им сделать этот выбор."
 FRA_neutrality_boost: "Интеграция скандинавских культур"
 FRA_neutrality_boost_desc: "Наконец-то скандинавская социал-демократия преобразилась, ее рабочие и институты стали частью нашего более широкого революционного проекта."
 FRA_cold_war2: "Холодная война окончена."
 FRA_cold_war2_desc: "Мы собираемся отомстить СССР и за распад Варшавского договора, уничтожив то, что осталось от НАТО."
 FRA_cold_war_boost: "Интегрировать английскую культуру"
 FRA_cold_war_boost_desc: "Рабочие всего мира, объединяйтесь! Собственная трудовая традиция англосферы наконец-то находит свое место в нашей революции."
 FRA_red_Europe: "Завершить Европейскую революцию"
 FRA_red_Europe_desc: "Мы собираемся принести революцию во всю Европу, которая до сих пор находится под гнётом капиталистов."
 FRA_red_victory: "Триумф европейской революции"
 FRA_red_victory_desc: "Мы освободили европейские государства от оков капитализма. Это великая победа революции."
 FRA_annex_puppet_napo: "Обеспечьте исполнение наших требований"
 FRA_annex_puppet_napo_desc: "Одна из наших зависимых территорий претендует на нашу территорию. Пришло время вернуть эту территорию нам."
 FRA_reunionism: "Реализация реюнионизма"
 FRA_reunionism_desc: "Пришло время объединить людей, разделяющих французскую культуру. И на этот раз — навсегда."
 FRA_Never_another_guerilla: "Обеспечьте безопасность Юго-Запада"
 FRA_Never_another_guerilla_desc: "Мы движемся на восток, поэтому нам нужно убедиться, что никто не нападёт нам вслед. На этот раз партизанской войны не будет, потому что мы подавим любое сопротивление."
 FRA_Avenge_Sedan: "Седан \"Мститель\""
 FRA_Avenge_Sedan_desc: "Именно возвышение Германской империи положило конец существованию бывшей Французской империи. Мы должны отомстить за это злодеяние и вернуть себе наши естественные границы."
 FRA_natural_border: "Интегрируйте естественные границы."
 FRA_natural_border_desc: "Население завоеванных территорий в конце концов смирилось с новой реальностью. Рейн образует границу Франции."
 FRA_crush_coalition: "Безопасная Центральная Европа"
 FRA_crush_coalition_desc: "Эти территории будут иметь решающее значение для долгого пути к Москве, который в настоящее время готовится."
 FRA_napoleon_empire: "Интегрировать Наполеоновскую империю"
 FRA_napoleon_empire_desc: "Жители захваченных территорий в конце концов смирились с новой реальностью. Теперь они являются полноправными гражданами Третьей Французской империи."
 FRA_prepare_russia: "Объединить Восточную Европу"
 FRA_prepare_russia_desc: "Наше вторжение в Россию неизбежно; мы должны обеспечить безопасность наших союзников и подготовить их к высокоинтенсивному конфликту с Россией."
 FRA_2nd_empire_colonies: "Возродить колониальную империю"
 FRA_2nd_empire_colonies_desc: "Мы завершим то, что начали Наполеон III и Третья республика. Мы построим стабильную колониальную империю."
 FRA_no_more_berezina: "Операция «Тисл»"
 FRA_no_more_berezina_desc: "Пришло время раз и навсегда уничтожить Российскую империю. На этот раз у них не будет времени сжечь Москву."
 FRA_the_Foe: "Покончим с коварным Альбионом"
 FRA_the_Foe_desc: "Мы раз и навсегда прорвем эту континентальную блокаду. Главный враг революции падет."
 FRA_new_order: "Провозгласите Новый Европейский Порядок"
 FRA_new_order_desc: "Наше господство над континентом обеспечено. Мы объединили Европу под нашей империей. Начинается новая глава в европейской истории."
 FRA_Expansion_policy: "Выберите нашу политику расширения"
 FRA_Expansion_policy_desc: "Новое Франкское королевство должно поставить перед собой цель завоевания."
 FRA_operation_clovis: "Операция «Кловис»"
 FRA_operation_clovis_desc: "Мы вернем колыбель франкской цивилизации, отвоевав ее у так называемых государств Бенилюкса."
 FRA_operation_bouvines: "Операция «Бувин»"
 FRA_operation_bouvines_desc: "Для возникновения Франкской империи необходимо, чтобы Священная Римская империя пала ещё раз."
 FRA_operation_marignan: "Операция «Мариньян»"
 FRA_operation_marignan_desc: "Мы должны отвоевать Итальянский полуостров. Вернуть контроль над резиденцией Католической Церкви. Только Папа Римский сможет короновать нас императором."
 FRA_operation_roland: "Операция «Роланд»"
 FRA_operation_roland_desc: "Арьергард больше не падет."
 FRA_unite_frank_europe: "Объединить франкский народ"
 FRA_unite_frank_europe_desc: "Мы воссоединили все народы, которые, как и мы, являются потомками франков. Это великий день для франкского народа."
 FRA_frankish_empire: "Интегрировать Франкскую империю"
 FRA_frankish_empire_desc: "Франкская империя воссоединилась. Несправедливость Верденского договора исправлена."
 FRA_annex_puppet_king: "Обеспечьте исполнение наших требований"
 FRA_annex_puppet_king_desc: "Одна из наших зависимых территорий претендует на нашу территорию. Пришло время вернуть эту территорию нам."
 FRA_glacis: "Прорваться сквозь гласис"
 FRA_glacis_desc: "Страны Востока стоят между нами и нашей судьбой. Мы должны объединить Запад под нашим знаменем."
 FRA_a_war_for_europe: "Война за Европу"
 FRA_a_war_for_europe_desc: "Западноевропейские державы и Россия всегда боролись за контроль над Европой. Пришло время положить конец этому спору и объединить Запад."
 FRA_operation_hastings: "Операция «Гастингс»"
 FRA_operation_hastings_desc: "Пришло время положить конец соперничеству, изменившему историю. Обещаю, оно не продлится и ста лет."
 FRA_king_europe_victory: "Провозгласите победу в Европе!"
 FRA_king_europe_victory_desc: "Наших врагов больше нет. Мы — единственная оставшаяся европейская держава. Западу придётся сплотиться вокруг нас."
 FRA_recover_7_year_war_charlemagne: "Верните колонии Королевства!"
 FRA_recover_7_year_war_charlemagne_desc: "Европа в безопасности. Теперь мы можем вернуть контроль над колониями, которые у нас отняли."
 FRA_start_crusade: "Обеспечьте безопасность Средиземноморья"
 FRA_start_crusade_desc: "Для того чтобы крестовый поход отправился в Святую Землю, нам необходимо установить контроль над островами вдоль нашего маршрута. Необходимо обеспечить безопасность нашей цепочки поставок."
 FRA_crusade_siege: "Опорный пункт на Святой Земле"
 FRA_crusade_siege_desc: "Для возвращения Святой Земли путем прямого нападения на ее оккупантов нам потребуется задействовать все наши силы. Мы должны обеспечить возможность их размещения в этом районе."
 FRA_claim_jerusalem: "Верните Святую Землю"
 FRA_claim_jerusalem_desc: "Пришло время отвоевать Иерусалим и Святую Землю. Десятый крестовый поход достиг своей цели."
 FRA_revenge_over_saladin: "Обеспечить стабильность на Ближнем Востоке"
 FRA_revenge_over_saladin_desc: "Мы должны стабилизировать регион, подавив каждую из его региональных держав, конфликты с которыми его дестабилизируют."
 FRA_king_crusade1_victory: "Провозгласите триумф Десятого крестового похода!"
 FRA_king_crusade1_victory_desc: "Мы отвоевали Святую Землю."
 FRA_kingdom_heaven: "Провозгласите Царство Иерусалимское"
 FRA_kingdom_heaven_desc: "Иерусалимское Царство восстанет вновь."
 FRA_rally_frank: "Защитите франков"
 FRA_rally_frank_desc: "Вскоре Европа станет ареной новой войны. В этих обстоятельствах мы должны обеспечить, чтобы наши франкские братья не стали её жертвами."
 FRA_unite_frank: "Реинтегрировать франков"
 FRA_unite_frank_desc: "Мы воссоединили все народы, которые, как и мы, являются потомками франков. Это великий день для франкского народа."
 FRA_noah_ark: "Объединить католические нации"
 FRA_noah_ark_desc: "Мы объединим католические народы Европы под нашим знаменем."
 FRA_war_against_protestantism: "Война против протестантизма"
 FRA_war_against_protestantism_desc: "Первые восемь крестовых походов против еретиков потерпели неудачу. Мы не потерпим неудачу в девятый раз."
 FRA_end_the_schism: "Может быть только один."
 FRA_end_the_schism_desc: "Мы должны противостоять всем православным народам Европы, став их хранителями. Тогда Церковь будет в безопасности навсегда."
 FRA_king_crusade2_victory: "Провозгласите полную победу Церкви"
 FRA_king_crusade2_victory_desc: "Мы безраздельно господствуем над Европой."
 FRA_recover_7_year_war_holy: "Верните колонии Королевства!"
 FRA_recover_7_year_war_holy_desc: "Наших врагов больше нет. Мы — единственная оставшаяся европейская держава. Западу придётся сплотиться вокруг нас."
 FRA_inst_civ_GER: "Инвестируйте в немецкую экономику"
 FRA_inst_civ_GER_desc: "Мы напрямую инвестируем в немецкие машиностроительные компании, укрепляя промышленную основу нашего общего союза."
 FRA_inst_civ_GRE: "Инвестируйте в греческую экономику"
 FRA_inst_civ_GRE_desc: "Греческое судоходство остается основой экономики страны, и наши инвестиции укрепляют эту жизненно важную морскую отрасль."
 FRA_inst_civ_ITA: "Инвестируйте в итальянскую экономику"
 FRA_inst_civ_ITA_desc: "Мы поддерживаем итальянскую станкостроительную отрасль, укрепляя базу высокоточной машиностроения, лежащую в основе ее промышленности."
 FRA_inst_civ_BEL: "Инвестируйте в бельгийскую экономику"
 FRA_inst_civ_BEL_desc: "Химическая промышленность Бельгии является основой ее экономики, и наша столица расширит свои производственные и экспортные мощности."
 FRA_inst_civ_SPR: "Инвестируйте в испанскую экономику"
 FRA_inst_civ_SPR_desc: "Мы инвестируем в автомобильный сектор Испании, поддерживая сборочные линии, на которых работают сотни тысяч человек."
 FRA_inst_civ_POL: "Инвестируйте в польскую экономику"
 FRA_inst_civ_POL_desc: "Польские верфи когда-то были лидерами европейского судостроения, и наши инвестиции помогут восстановить их промышленный потенциал."
 FRA_inst_inf_GER: "Инвестируйте в транспортную сеть Германии."
 FRA_inst_inf_GER_desc: "Мы финансируем улучшение Рейнско-Ронского коридора, что облегчает поток товаров между экономиками наших двух стран."
 FRA_inst_inf_GRE: "Инвестируйте в транспортную сеть Греции."
 FRA_inst_inf_GRE_desc: "Инвестиции в коридор Афины-Салоники позволят модернизировать главную транспортную артерию Греции, идущую с севера на юг."
 FRA_inst_inf_ITA: "Инвестируйте в транспортную сеть Италии."
 FRA_inst_inf_ITA_desc: "Мы поддерживаем модернизацию коридора Бреннер, укрепляющего жизненно важное железнодорожное сообщение между Италией и Северной Европой."
 FRA_inst_inf_BEL: "Инвестируйте в транспортную сеть Бельгии."
 FRA_inst_inf_BEL_desc: "Мы инвестируем в железнодорожный коридор Северное море — Средиземное море, укрепляя грузовую магистраль, проходящую через порты Бельгии."
 FRA_inst_inf_SPR: "Инвестируйте в транспортную сеть Испании."
 FRA_inst_inf_SPR_desc: "Наши инвестиции в железнодорожные переправы через Пиренеи наконец-то обеспечат надлежащее соединение иберийской и французской железнодорожных сетей."
 FRA_inst_inf_POL: "Инвестируйте в транспортную сеть Польши."
 FRA_inst_inf_POL_desc: "Мы финансируем коридор Via Baltica, который наконец-то соединит Польшу с более широкой европейской транспортной сетью."
 FRA_inst_eco_GER: "Инвестируйте в экологическую трансформацию Германии."
 FRA_inst_eco_GER_desc: "Мы поддерживаем переход Германии от атомной энергетики, финансируя необходимые мощности возобновляемых источников энергии для восполнения этого дефицита."
 FRA_inst_eco_GRE: "Инвестируйте в экологический переход Греции."
 FRA_inst_eco_GRE_desc: "Греция по-прежнему сильно зависит от бурого угля, и наши инвестиции ускорят переход к более чистым источникам энергии."
 FRA_inst_eco_ITA: "Инвестируйте в экологический переход Италии."
 FRA_inst_eco_ITA_desc: "Италия по-прежнему опасно зависит от импортного газа, и наши инвестиции поддерживают диверсификацию ее энергоснабжения в сторону возобновляемых источников энергии."
 FRA_inst_eco_BEL: "Инвестируйте в экологический переход Бельгии."
 FRA_inst_eco_BEL_desc: "Мы помогаем Бельгии в управлении процессом поэтапного отказа от атомной энергетики, финансируя необходимые мощности энергосистемы для обеспечения бесперебойного электроснабжения."
 FRA_inst_eco_SPR: "Инвестируйте в экологический переход Испании."
 FRA_inst_eco_SPR_desc: "Испания обладает огромным солнечным потенциалом, и наши инвестиции помогут расширить ее мощности по производству возобновляемой энергии."
 FRA_inst_eco_POL: "Инвестируйте в польский экологический переход."
 FRA_inst_eco_POL_desc: "Польша по-прежнему в значительной степени зависит от угля для обеспечения своих энергоснабжений, и наши инвестиции поддерживают ее переход к более чистым источникам энергии."
