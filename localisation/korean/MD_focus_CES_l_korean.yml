 drugs.1.t: "마약 밀매업자 수색 결과"
 drugs.1.d: "최근 우리는 국내 최대 마약 밀매업자들에 대한 수색을 마쳤습니다. 그들을 찾아냈습니다! 이제 마약 밀매는 예전만큼 기승을 부리지 못합니다."
 drugs.1.a: "매우 좋군"
 drugs.2.t: "마약 밀매업자 수색 결과"
 drugs.2.d: "최근 우리는 국내 최대 마약 밀매업자들에 대한 수색을 마쳤습니다. 안타깝게도 그들을 찾아내지 못했습니다. 다시 시도해 볼 만합니다."
 drugs.2.a: "슬프군"
 drugs.3.t: "마약 밀매업자 수색 결과"
 drugs.3.d: "최근 우리는 국내 최대 마약 밀매업자들에 대한 수색을 마쳤습니다. 안타깝게도 그들을 찾아내지 못했습니다. 다시 시도해 볼 만합니다."
 drugs.3.a: "슬프군"
 drugs.4.t: "마약 밀매업자 재판"
 drugs.4.d: "우리는 마약 밀매업자들을 찾아내 법정에 세웠습니다. 이제 우리나라를 경유하는 마약 밀매는 없을 것입니다. 우리는 밀수업자로부터 자유로워졌습니다!"
 drugs.4.a: "매우 좋군"
 ces_post_soviet_legacy_idea: "소련 이후의 유산"
 ces_post_soviet_legacy_idea_desc: "소련 이후 유산의 핵심적인 측면 하나는 중앙 계획경제에서 시장 관계로의 전환입니다. 이 시기에는 경제 불안정, 인플레이션, 부의 재분배가 뒤따랐으며, 이는 생계와 소비에 영향을 미쳤습니다."
 ces_neutral_idea: "우즈베크 중립"
 ces_neutral_idea_desc: "우즈베크 중립은 평화와 불침략을 바라는 우즈베키스탄의 염원을 상징합니다. 이는 국제 분쟁에 휘말리지 않고 자국 영토를 군사 행동에 사용하도록 허용하지 않겠다는 약속입니다. 이 원칙은 지역의 안정에 기여하며 국제 분쟁 해결에서 중재자로서 우즈베키스탄의 역할을 강화합니다."
 CES_our_state_kaz: "우리의 [ROOT.GetName]"
 CES_our_state_kaz_desc: "오늘은 새천년을 맞은 나라의 여정이 시작되는 날입니다."
 CES_newly_reestab_militar: "[ROOT.GetName]의 군대"
 CES_newly_reestab_militar_desc: "[ROOT.GetName]의 군대는 개혁이 필요합니다."
 CES_assemble_generals: "장군 소집"
 CES_assemble_generals_desc: "이는 우리 전략적 여정에서 중요한 단계입니다. 성공과 번영을 추구하는 우리는 육군의 모든 진정한 장군과 전문가, 지도자를 한자리에 모아 건실한 발전 계획을 논의하고 수립해야 합니다."
 CES_improve_borderline_guards: "국경 수비대 개선"
 CES_improve_borderline_guards_desc: "국경 안보를 강화하는 것은 국가 안보와 안정을 보장하기 위한 중요한 전략적 조치입니다."
 CES_establish_the_doctrine: "교육 개혁"
 CES_establish_the_doctrine_desc: "국가 안보를 지키고 군의 효율성을 높이려면 양질의 군 교육이 필요합니다."
 CES_broken_economy_idea_1: "심각하게 붕괴된 경제 체제"
 CES_broken_economy_idea_1_desc: "소련식 계획경제의 유산은 소련 붕괴 이후 [FROM.GetName]을(를) 어려운 처지에 빠뜨렸습니다. 경제 기반이 중앙에서 관리되었기 때문에 시장경제로의 전환은 더 어렵고 고통스러운 과정이 되었습니다. 많은 자원 지역의 상실과 에너지 공급 의존 또한 [FROM.GetName]의 경제에 영향을 미쳤습니다. 공화국은 소련이 통제하던 일부 천연자원에 대한 접근권을 잃었습니다. 이는 경제 불안정과 소득 부족으로 이어졌습니다."
 CES_broken_economy_idea_2: "중간 정도로 붕괴된 경제 체제"
 CES_broken_economy_idea_2_desc: "소련식 계획경제의 유산은 소련 붕괴 이후 [FROM.GetName]을(를) 어려운 처지에 빠뜨렸습니다. 경제 기반이 중앙에서 관리되었기 때문에 시장경제로의 전환은 더 어렵고 고통스러운 과정이 되었습니다. 많은 자원 지역의 상실과 에너지 공급 의존 또한 [FROM.GetName]의 경제에 영향을 미쳤습니다. 공화국은 소련이 통제하던 일부 천연자원에 대한 접근권을 잃었습니다. 이는 경제 불안정과 소득 부족으로 이어졌습니다."
 CES_broken_economy_idea_3: "다소 붕괴된 경제 체제"
 CES_broken_economy_idea_3_desc: "소련식 계획경제의 유산은 소련 붕괴 이후 [FROM.GetName]을(를) 어려운 처지에 빠뜨렸습니다. 경제 기반이 중앙에서 관리되었기 때문에 시장경제로의 전환은 더 어렵고 고통스러운 과정이 되었습니다. 많은 자원 지역의 상실과 에너지 공급 의존 또한 [FROM.GetName]의 경제에 영향을 미쳤습니다. 공화국은 소련이 통제하던 일부 천연자원에 대한 접근권을 잃었습니다. 이는 경제 불안정과 소득 부족으로 이어졌습니다."
 CES_outdated_army_idea: "군의 혼란"
 CES_outdated_army_idea_desc: "소련의 붕괴는 우리나라를 새로운 지정학적 환경에 놓이게 했고, 이는 옛 소련 공화국 및 신생 독립국과의 관계에 불확실성을 낳았습니다. 이로 인해 군대 관리가 복잡해졌으며 군의 전략과 구조를 재검토할 필요가 생겼습니다."
 CES_outdated_army_idea_1: "무질서한 군 통제"
 CES_outdated_army_idea_1_desc: "소련의 붕괴는 우리나라를 새로운 지정학적 환경에 놓이게 했고, 이는 옛 소련 공화국 및 신생 독립국과의 관계에 불확실성을 낳았습니다. 이로 인해 군대 관리가 복잡해졌으며 군의 전략과 구조를 재검토할 필요가 생겼습니다."
 CES_outdated_army_idea_2: "부패한 군 통제"
 CES_outdated_army_idea_2_desc: "소련의 붕괴는 우리나라를 새로운 지정학적 환경에 놓이게 했고, 이는 옛 소련 공화국 및 신생 독립국과의 관계에 불확실성을 낳았습니다. 이로 인해 군대 관리가 복잡해졌으며 군의 전략과 구조를 재검토할 필요가 생겼습니다."
 CES_outdated_army_idea_3: "비효율적인 군 통제"
 CES_outdated_army_idea_3_desc: "소련의 붕괴는 우리나라를 새로운 지정학적 환경에 놓이게 했고, 이는 옛 소련 공화국 및 신생 독립국과의 관계에 불확실성을 낳았습니다. 이로 인해 군대 관리가 복잡해졌으며 군의 전략과 구조를 재검토할 필요가 생겼습니다."
 CES_army_modernization: "육군 현대화"
 CES_army_modernization_desc: "우리 육군의 현대화는 군대 형성의 중요한 열쇠입니다."
 CES_create_territorial_defence: "영토방위군 창설"
 CES_create_territorial_defence_desc: "영토방위군의 창설은 우리 방위 능력을 형성하는 중요한 요소입니다."
 CES_airforce_trainings: "공군 훈련"
 CES_airforce_trainings_desc: "공군 훈련 프로그램은 항공 요원의 준비 태세와 전문성을 보장하는 데 필수적입니다. 이 프로그램은 비행 시뮬레이션, 기술 역량 개발, 국제 협력 등 다양한 활동을 아우릅니다. 이는 국가 방위 능력을 높이고 영공을 수호하는 데 필수적이며, 중앙아시아의 국가 안보와 지역 안정에 기여합니다."
 CES_india_air: "인도 항공기"
 CES_india_air_desc: "우리와 인도 간에 무기 거래를 성사시켜 공군을 위한 새로운 현대식 항공기를 구매할 수 있습니다."
 CES_russian_air: "러시아 항공기"
 CES_russian_air_desc: "우리와 러시아 간에 무기 거래를 성사시켜 공군을 위한 새로운 현대식 항공기를 구매할 수 있습니다."
 CES_european_air: "유럽 항공기"
 CES_european_air_desc: "우리와 유럽 국가들 간에 무기 거래를 성사시켜 공군을 위한 새로운 현대식 항공기를 구매할 수 있습니다."
 CES_china_air: "중국 항공기"
 CES_china_air_desc: "우리와 중국 간에 무기 거래를 성사시켜 공군을 위한 새로운 현대식 항공기를 구매할 수 있습니다."
 CES_us_air: "미국 항공기"
 CES_us_air_desc: "우리와 미국 간에 무기 거래를 성사시켜 공군을 위한 새로운 현대식 항공기를 구매할 수 있습니다."
 CES_wing_loong: "중국 드론"
 CES_wing_loong_desc: "우리와 중국 간에 무기 거래를 성사시켜 공군을 위한 새로운 현대식 드론을 구매할 수 있습니다."
 CES_predator_xp: "프레데터 XP"
 CES_predator_xp_desc: "제너럴 아토믹스 MQ-1 프레데터(흔히 프레데터 드론으로 불림)는 제너럴 아토믹스가 제작한 미국의 원격 조종 항공기(RPA)로, 주로 미 공군(USAF)과 중앙정보국(CIA)이 사용했습니다."
 CES_airbus_stuff: "에어버스 수송기"
 CES_airbus_stuff_desc: "에어버스와 계약을 맺어 공군의 군수 지원 수요에 필요한 수송기를 구매할 수 있습니다."
 CES_euro_helicopters: "유럽 헬리콥터"
 CES_euro_helicopters_desc: "최신 유럽 헬리콥터를 구매하면 우리 공군에 큰 도움이 될 것입니다."
 CES_czech_jets: "체코슬로바키아 훈련기"
 CES_czech_jets_desc: "동구권이 몰락한 뒤 많은 탈공산주의 국가가 퇴역한 장비를 매각했습니다. 우리 공군을 위해 일부를 구입해야 할 수도 있습니다."
 CES_tai_anka: "튀르키예 드론"
 CES_tai_anka_desc: "튀르키예 드론은 최근 분쟁에서 매우 효과적임이 입증되었습니다. 일부를 구입해야 할 수도 있습니다."
 CES_bell_uh: "BELL-UH"
 CES_bell_uh_desc: "벨 UH-1 이로쿼이는 미국 항공우주 기업 벨 헬리콥터가 설계 및 생산한 다목적 군용 헬리콥터입니다. 수많은 파생형을 낳은 휴이 계열의 첫 번째 기종이자, 미군에서 운용된 최초의 터빈 동력 헬리콥터입니다."
 CES_infantr_guns: "보병 개혁"
 CES_infantr_guns_desc: "병력의 협동과 단결을 높이려면 보병 개혁이 필요합니다."
 CES_us_guns: "미국제 소총"
 CES_us_guns_desc: "AR 소총은 AK만큼 신뢰성이 높지는 않을 수 있지만, 모듈성과 정확도가 매우 뛰어난 무기임이 입증되었습니다. 우리는 이를 도입해야 합니다."
 CES_us_equip: "NATO급 장비"
 CES_us_equip_desc: "NATO급 장비는 세계 최고입니다!"
 CES_rus_equip: "러시아 장비"
 CES_rus_equip_desc: "러시아 장비는 세계 최고입니다!"
 CES_russian_guns: "AK 소총"
 CES_russian_guns_desc: "AK 소총은 AR만큼 모듈성이 높지는 않을 수 있지만, 매우 튼튼하고 신뢰할 만한 무기임이 입증되었습니다. 우리는 이를 도입해야 합니다."
 CES_chinese_guns: "중국제 소총"
 CES_chinese_guns_desc: "QBZ-95는 우리 국방부의 관심을 끈 유망한 무기 플랫폼입니다. 이를 조달해야 할 수도 있습니다."
 CES_chinese_equip: "새로운 중국산 대안"
 CES_chinese_equip_desc: "새로운 중국 장비는 세계 최고입니다!"
 CES_us_art: "미국 포병 전력"
 CES_us_art_desc: "우리나라의 미국 포병 장비 도입은 방위 능력을 높이기 위한 전략적 조치입니다. 이 조달은 미국의 첨단 포병 체계를 구매하는 것으로, 우리의 군사 대비 태세를 강화합니다. 이러한 도입은 국가 안보 전략에서 필수적이며, 방위 현대화를 촉진하고 지역 안보 과제에 효과적으로 대응하는 능력을 뒷받침합니다."
 CES_rus_art: "러시아 포병 전력"
 CES_rus_art_desc: "우리나라의 러시아 포병 장비 도입은 방위 능력을 높이기 위한 전략적 조치입니다. 이 조달은 러시아의 첨단 포병 체계를 구매하는 것으로, 우리의 군사 대비 태세를 강화합니다. 이러한 도입은 국가 안보 전략에서 필수적이며, 방위 현대화를 촉진하고 지역 안보 과제에 효과적으로 대응하는 능력을 뒷받침합니다."
 CES_chinese_art: "중국 포병 전력"
 CES_chinese_art_desc: "우리나라의 중국 포병 장비 도입은 방위 능력을 높이기 위한 전략적 조치입니다. 이 조달은 중국의 첨단 포병 체계를 구매하는 것으로, 우리의 군사 대비 태세를 강화합니다. 이러한 도입은 국가 안보 전략에서 필수적이며, 방위 현대화를 촉진하고 지역 안보 과제에 효과적으로 대응하는 능력을 뒷받침합니다."
 CES_buying_tanks: "[ROOT.GetName]의 전차"
 CES_buying_tanks_desc: "[ROOT.GetName]의 전차 수요를 평가하고 연구해야 합니다."
 CES_chinese_tanks: "중국 전차"
 CES_chinese_tanks_desc: "[ROOT.GetName]의 중국 전차 도입은 군대 현대화에 대한 의지를 보여 줍니다. 이 구매는 국가의 군사 능력을 강화하기 위해 중국의 첨단 전차 체계를 조달하는 것입니다. 이 전략적 투자는 [ROOT.GetName]의 방위 대비 태세를 높이며, 지역 안보 수요에 대처할 강력하고 잘 갖춰진 군대를 유지하려는 헌신을 보여 줍니다."
 CES_russian_tanks: "러시아 전차"
 CES_russian_tanks_desc: "[ROOT.GetName]의 러시아 전차 도입은 군대 현대화에 대한 의지를 보여 줍니다. 이 구매는 국가의 군사 능력을 강화하기 위해 러시아의 첨단 전차 체계를 조달하는 것입니다. 이 전략적 투자는 [ROOT.GetName]의 방위 대비 태세를 높이며, 지역 안보 수요에 대처할 강력하고 잘 갖춰진 군대를 유지하려는 헌신을 보여 줍니다."
 CES_american_tanks: "미국 전차"
 CES_american_tanks_desc: "[ROOT.GetName]의 미국 전차 도입은 군대 현대화에 대한 의지를 보여 줍니다. 이 구매는 국가의 군사 능력을 강화하기 위해 미국의 첨단 전차 체계를 조달하는 것입니다. 이 전략적 투자는 [ROOT.GetName]의 방위 대비 태세를 높이며, 지역 안보 수요에 대처할 강력하고 잘 갖춰진 군대를 유지하려는 헌신을 보여 줍니다."
 CES_urainian_btr: "우크라이나 BTR"
 CES_urainian_btr_desc: "[ROOT.GetName]의 우크라이나 BTR(장갑 수송차) 구매 결정은 군사 능력을 높이기 위한 전략적 조치입니다. 이 도입은 [ROOT.GetName]의 군대를 강화하기 위해 우크라이나로부터 이 다목적 장갑차량을 조달하는 것입니다. 이 BTR은 국가 방위 전략에서 기동성, 병력 수송, 국경 보안을 지원하는 핵심 역할을 하여 궁극적으로 국가 안보와 지역 안정에 기여할 것입니다."
 CES_rus_bars: "러시아 BARS"
 CES_rus_bars_desc: "[ROOT.GetName]의 러시아 BARS 차량 구매 결정은 군사 능력을 높이기 위한 전략적 조치입니다. 이 도입은 [ROOT.GetName]의 군대를 강화하기 위해 러시아로부터 이 다목적 장갑차량을 조달하는 것입니다. 이 차량은 국가 방위 전략에서 기동성, 병력 수송, 국경 보안을 지원하는 핵심 역할을 하여 궁극적으로 국가 안보와 지역 안정에 기여할 것입니다."
 CES_polaris: "폴라리스"
 CES_polaris_desc: "폴라리스의 정부 및 방위용 차량은 어떤 요구에도 우리 조직의 임무 중심 수요에 부합하는 성능과 신뢰성을 제공합니다."
 CES_navy: "[ROOT.GetName]의 해군"
 CES_navy_desc: "[ROOT.GetName]의 해군은 개혁이 필요합니다."
 CES_navy_dockyard: "우리의 조선소"
 CES_navy_dockyard_desc: "함선을 건조하고 보관하려면 새로운 부두를 건설해야 합니다."
 CES_navy_corvette: "초계함"
 CES_navy_corvette_desc: "초계함은 소형 전투함입니다. 전통적으로 정식 전투함으로 간주되는 가장 작은 함급입니다. 초계함 위의 함급은 호위함이며, 그 아래 함급은 역사적으로 슬루프형 전투함이었습니다."
 CES_navy_frigates: "호위함"
 CES_navy_frigates_desc: "호위함은 전투함의 한 종류입니다. 시대에 따라 호위함으로 분류된 함선의 역할과 능력은 다소 달랐습니다. 17세기에서 18세기 초에 프리깃이라는 이름은 속도와 기동성을 위해 건조되어 정찰, 호위, 순찰 임무에 쓰이는 모든 전장 범선에 붙었습니다."
 CES_navy_doctrine: "교리 개혁"
 CES_navy_doctrine_desc: "우리의 해군 교리는 쇄신이 필요합니다."
 CES_western_start: "민주주의의 길"
 CES_western_start_desc: "이제 우리나라가 민주주의 정부의 길에 나설 때입니다."
 CES_western_reform_govern: "정부 개혁"
 CES_western_reform_govern_desc: "우리 정부는 시급한 개혁이 필요합니다."
 CES_western_decentr: "지방 분권"
 CES_western_decentr_desc: "지방에 더 많은 권리를 부여할 때입니다."
 CES_western_defend_people_rights: "인권과 자유"
 CES_western_defend_people_rights_desc: "우리 국가는 이제부터 모든 시민의 권리와 자유를 존중할 것입니다."
 CES_western_anti_corruption: "부패 척결"
 CES_western_anti_corruption_desc: "부패한 관리들은 처벌받을 것입니다!"
 CES_western_prave_rabochich: "노동자의 권리"
 CES_western_prave_rabochich_desc: "우리 노동자들은 사회적 보장으로 보호받아야 합니다."
 CES_western_freedom_smi: "언론의 자유"
 CES_western_freedom_smi_desc: "언론의 자유는 우리 국가의 기본 원칙 중 하나입니다."
 CES_western_welfare: "의료 투자"
 CES_western_welfare_desc: "우리 국민은 건강해야 합니다."
 CES_western_mothers_posobia: "출산 수당"
 CES_western_mothers_posobia_desc: "출산 수당에 가능한 한 많은 자금을 배정할 것입니다."
 CES_western_economic_rost: "경제 성장"
 CES_western_economic_rost_desc: "우리의 유능한 정책이 경제 성장을 이끌었습니다."
 CES_western_infrastructure: "인프라 투자"
 CES_western_infrastructure_desc: "우리나라의 인프라는 개발되고 현대화되어야 합니다."
 CES_western_education_reform: "교육 개혁"
 CES_western_education_reform_desc: "교육 개혁에 아낌없이 투자할 것입니다."
 CES_western_science_reform: "과학 투자"
 CES_western_science_reform_desc: "과학은 우리나라의 미래이므로 우리는 과학에 투자할 것입니다!"
 CES_western_sport: "스포츠 진흥"
 CES_western_sport_desc: "건강한 국민이 강한 국가입니다!"
 CES_western_ciphrovisation: "전면적 디지털화"
 CES_western_ciphrovisation_desc: "디지털화는 우리 경제의 성장을 강화할 것입니다."
 CES_western_liberal_heaven: "중앙아시아 자유주의 쇼케이스"
 CES_western_liberal_heaven_desc: "우리는 중앙아시아에 자유주의 국가를 세우는 본보기입니다."
 CES_liberals_modifier: "중앙아시아 민주주의"
 CES_liberals_modifier_desc: "민주주의 체제는 원칙적으로 중앙아시아 지역에서 독특한 것입니다. 이는 모든 면에서 서구 민주주의를 따라잡으려는 급격하고 신속한 시도를 나타냅니다."
 CES_exploit_natural_resources: "천연자원 개발"
 CES_exploit_natural_resources_desc: "다양한 지형과 풍부한 천연자원으로 알려진 중앙아시아는 역사 내내 자원 개발의 중심지였습니다."
 CES_uranium_extraction: "우라늄 채굴"
 CES_uranium_extraction_desc: "중앙아시아의 우라늄 채굴은 이 방사성 원소의 채광, 가공, 수출을 아우르며 전 세계의 에너지 생산과 핵 기술에 기여합니다. 이 자원은 지역에 경제적 의미가 있으며 우라늄 자원 관리를 둘러싼 국제 협력과 규제로 이어졌습니다."
 CES_support_gold_mining: "금 채굴 지원"
 CES_support_gold_mining_desc: "중앙아시아는 풍부한 금 매장량으로 유명하며, 이 귀금속의 채굴은 지역 경제에서 중추적인 역할을 합니다. 카자흐스탄, 키르기스스탄, 우즈베키스탄 같은 나라는 금 채굴 산업의 핵심 주체입니다."
 CES_keep_it_governmental: "국유 유지"
 CES_keep_it_governmental_desc: "채굴 산업은 우리의 자율성을 보장하므로 국유로 유지해야 합니다."
 CES_metal_extraction: "금속 채굴"
 CES_metal_extraction_desc: "중앙아시아는 구리, 은, 희토류 원소를 비롯한 다양한 금속 채굴의 중심지입니다. 이 지역의 방대한 광물 매장량은 활발한 광업을 촉진했습니다."
 CES_increase_privatisation: "민영화 확대"
 CES_increase_privatisation_desc: "민영화로 더 큰 이익을 얻겠지만, 외세의 영향에는 더 취약해질 것입니다."
 CES_natural_gas: "천연가스"
 CES_natural_gas_desc: "중앙아시아의 가스 채굴은 국내외 에너지 수요를 충족하기 위한 천연가스의 시추, 가공, 수송을 아우릅니다. 이 지역의 가스 자원은 상당한 경제적 중요성을 지니며 지역 협력과 세계 에너지 무역을 모두 촉진합니다."
 CES_oil_extraction: "석유 채굴"
 CES_oil_extraction_desc: "중앙아시아에는 상당한 석유 매장량이 있으며, 특히 카자흐스탄이 이 지역 석유 채굴 산업의 주요 주체입니다."
 CES_invite_exxon: "엑슨 초청"
 CES_invite_exxon_desc: "엑슨모빌은 미국의 다국적 석유 및 가스 기업으로, 존 D. 록펠러의 스탠더드 오일의 가장 큰 직계 후신입니다."
 CES_invite_chevron: "셰브런 초청"
 CES_invite_chevron_desc: "셰브런은 석유와 가스를 주력으로 하는 미국의 다국적 에너지 기업입니다."
 CES_invite_lukoil: "루크오일 초청"
 CES_invite_lukoil_desc: "PJSC 루크오일은 모스크바에 본사를 둔 러시아의 다국적 에너지 기업으로, 석유, 천연가스, 석유 제품, 전력의 채굴, 생산, 수송, 판매 사업을 전문으로 합니다."
 CES_united_joint_venture: "합작 투자"
 CES_united_joint_venture_desc: "지분을 합쳐 그 이익을 누릴 것입니다."
 CES_trade_idea: "무역 확대"
 CES_supporting_what_has_left: "남은 것을 지원하라"
 CES_supporting_what_has_left_desc: "우리 경제는 소련의 붕괴로 산산조각 났습니다. 이제 남아 있는 것을 지원할 때입니다."
 CES_establishing_relations_with_world_bank: "WTO 가입"
 CES_establishing_relations_with_world_bank_desc: "WTO 가입은 우리의 무역 경제를 확대하는 데 매우 중요합니다."
 CES_establishing_relations_with_asian_bank: "아시아 은행 지원"
 CES_establishing_relations_with_asian_bank_desc: "ADB의 지원을 받는 것은 우리가 더 많은 혜택을 얻을 좋은 기회입니다."
 centrasiaev.1.t: "아시아 은행 지원 협상"
 centrasiaev.1.d: "아시아 은행이 우리의 지원 요청을 수락했습니다. 이제 무엇을 요청할지 선택해야 합니다."
 centrasiaev.1.a: "교육 지원"
 centrasiaev.1.b: "경제 지원"
 centrasiaev.1.c: "사회 지원"
 CES_national_invest_strategy: "국가 투자 전략"
 CES_national_invest_strategy_desc: "국가 투자 전략의 수립과 시행은 현대 경제 발전에서 필수적인 부분이 되고 있습니다."
 centrasiaev.2.t: "카자흐스탄의 투자 요청"
 centrasiaev.2.d: "그들이 경제 투자를 요청하고 있습니다. 수락해야 합니까?"
 centrasiaev.2.a: "물론이지"
 centrasiaev.2.b: "미안하지만, 안된다"
 centrasiaev.3.t: "우즈베키스탄의 투자 요청"
 centrasiaev.3.d: "그들이 경제 투자를 요청하고 있습니다. 수락해야 합니까?"
 centrasiaev.3.a: "물론이지"
 centrasiaev.3.b: "미안하지만, 안된다"
 centrasiaev.4.t: "키르기스스탄의 투자 요청"
 centrasiaev.4.d: "그들이 경제 투자를 요청하고 있습니다. 수락해야 합니까?"
 centrasiaev.4.a: "물론이지"
 centrasiaev.4.b: "미안하지만, 안된다"
 CES_special_economic_zones: "경제특구"
 CES_special_economic_zones_desc: "중앙아시아는 경제 발전을 촉진하기 위해 경제특구(SEZ)를 설립할 필요성을 인식하고 있습니다. 이 구역들은 국내외 투자를 유치하기 위해 세금 감면, 규제 완화, 행정 절차 간소화 같은 유인책을 제공합니다. 중앙아시아에서 경제특구는 경제 다변화, 혁신 촉진, 일자리 창출, 특히 제조업, 기술, 무역 분야의 촉매 역할을 합니다. 기업 친화적 환경을 조성함으로써 이 구역들은 투자 유치, 인프라 개선, 경제 성장 견인을 위한 지역의 노력에서 중추적인 역할을 합니다."
 CES_infr_investment: "인프라 투자"
 CES_infr_investment_desc: "중앙아시아는 운송, 에너지, 통신망을 현대화하고 확장하기 위해 인프라 투자를 우선시하고 있습니다. 이러한 투자는 지역의 여러 국가를 연결하고 인접국과의 무역 및 연결성을 촉진하는 데 중요한 역할을 합니다."
 CES_industrial_revival: "산업 부흥"
 CES_industrial_revival_desc: "중앙아시아의 산업 투자는 지역 경제 성장의 핵심 동력입니다. 이러한 투자는 제조업, 에너지, 기술, 인프라 같은 다양한 분야를 겨냥합니다. 이는 생산성을 높이고 일자리를 창출하며 세계 무대에서 지역의 경쟁력을 높이는 데 중추적인 역할을 합니다. 중앙아시아는 경제적 잠재력을 활용하고 지역 발전을 촉진하기 위해 국내외 산업 투자를 적극적으로 모색하고 있으며, 이는 지역 정부와 민간 기업 모두의 핵심 과제입니다."
 CES_invite_daewoo: "대우 초청"
 CES_invite_daewoo_desc: "대우는 문자 그대로 '큰 우주'라는 뜻으로, 큰 것을 뜻하는 '대'와 창업주이자 회장인 김우중의 이름을 합친 말이며 대우그룹으로도 알려진 한국의 주요 재벌(복합기업의 한 유형)이자 자동차 제조업체였습니다."
 CES_invite_toyota: "도요타 초청"
 CES_invite_toyota_desc: "도요타 자동차는 일본 아이치현 도요타시에 본사를 둔 일본의 다국적 자동차 제조업체입니다. 도요타는 세계 최대 자동차 제조업체 가운데 하나로, 연간 약 천만 대의 차량을 생산합니다."
 CES_invite_avtovas: "아프토바즈 초청"
 CES_invite_avtovas_desc: "아프토바즈는 러시아의 국영 자동차 제조 기업입니다. 이전에는 러시아어로 볼가 자동차 공장의 약자인 VAZ로 알려져 있었습니다. 아프토바즈는 주력 차종인 라다 시리즈로 가장 잘 알려져 있습니다."
 CES_fostering_productive_innovation_project: "혁신 육성 프로젝트"
 CES_fostering_productive_innovation_project_desc: "중앙아시아의 혁신 육성 프로젝트는 지역의 혁신과 기술 발전을 촉진하기 위한 전략적 구상입니다. 연구, 교육, 기업가 정신에 대한 집중 투자를 통해 이 프로젝트는 창의성과 혁신을 자극하고자 합니다. 이는 중앙아시아 국가들의 경쟁력과 경제 다변화를 높이고, 21세기에 지속 가능한 성장과 세계적 위상을 확보하는 데 중요한 역할을 합니다."
 CES_russian_it_companies: "러시아 IT 기업"
 CES_russian_it_companies_desc: "러시아 IT 기업들은 중앙아시아에서 존재감을 키우며 지역의 디지털 전환에 기여하고 있습니다. 이들 기업은 금융, 의료, 교육을 비롯한 다양한 분야에 기술 전문성과 혁신적인 솔루션을 제공합니다. 이들의 존재는 국경을 넘는 협력, 지식 공유, 경제 발전을 촉진하며, 중앙아시아가 러시아의 기술력과 투자를 활용하면서 디지털 미래로 나아가는 것을 뒷받침합니다."
 CES_restructuring_the_army: "육군 재편"
 CES_restructuring_the_army_desc: "[ROOT.GetName]은(는) 방위 능력을 현대화하고 강화하기 위해 포괄적인 육군 재편을 진행하고 있습니다. 이 구상은 장비 갱신, 병력 배치 최적화, 훈련과 기술 개선을 포함합니다. 군대를 현대의 안보 과제에 맞춤으로써 [ROOT.GetName]은(는) 국가 안보를 강화하고 지역 안정에 기여하여 더 유능하고 기민한 군사력으로 자리매김하고자 합니다."
 CES_develop_turism: "관광개발"
 CES_attract_tourists: "관광객 유치"
 CES_attract_tourists_desc: "관광객 유치"
 CES_special_gambling_regions: "특별 도박 구역"
 CES_special_gambling_regions_desc: "경제부 장관이 경제를 부양하기 위해 특별 도박 구역 사업을 제안했습니다."
 CES_russian_it_specialists: "러시아 IT 전문가"
 CES_russian_it_specialists_desc: "러시아 IT 전문가들이 기업을 세울 새로운 장소를 찾고 있습니다. 우리나라가 최적의 행선지입니다!"
 CES_agricultural_reneissance: "농업 부흥"
 CES_agricultural_reneissance_desc: "우리 농업을 되살리기 시작해야 합니다."
 CES_supporting_wheat_production: "샤와르마 생산 지원"
 CES_supporting_wheat_production_desc: "우리의 샤와르마는 세계 모든 나라를 통틀어 최고 중의 최고여야 합니다!"
 CES_foster_horse_production: "말 사육 육성"
 CES_foster_horse_production_desc: "말 사육은 우리 경제에서 빼놓을 수 없는 부분이며, 이를 확대해야 합니다!"
 CES_export_of_kumis: "쿠미스 수출"
 CES_export_of_kumis_desc: "쿠미스는 우리의 민족 음료이며, 그 위대함을 온 세계에 보여 주어야 합니다!"
 CES_agricultural_subsidies: "농업 보조금"
 CES_agricultural_subsidies_desc: "우리나라 농업에 보조금을 지급하는 것은 필수적입니다."
 CES_farming_encoruraging: "영농 장려"
 CES_farming_encoruraging_desc: "우리 인구의 상당수가 실업 상태입니다. 영농이 경제에 참여하는 실현 가능한 방법임을 보여 주어야 합니다."
 CES_supporting_wheat_production_one: "밀 생산 지원"
 CES_supporting_wheat_production_one_desc: "밀은 우리 농촌에서 번성해야 하며, 이를 수출하여 수익을 얻을 수 있을 것입니다."
 CES_supporting_wheat_production_two: "대체 영농 방식"
 CES_supporting_wheat_production_two_desc: "효율이 최우선이어야 합니다. 수확이 많을수록 좋습니다."
 CES_farming_encouragement_one: "양질의 영농 장려"
 CES_farming_encouragement_one_desc: "효과성이 우선이어야 합니다. 우리만의 틈새를 찾으려면 품질을 보장해야 합니다."
 CES_cotton_production: "면화 생산"
 CES_cotton_production_desc: "우리 땅은 예로부터 양질의 면화 생산지로 알려져 있습니다. 우리는 이 기대에 부응할 것입니다."
 CES_connection_with_educational_abroad: "해외 교육 기관과의 연계"
 CES_connection_with_educational_abroad_desc: "농민을 교육하기 위해 농업 연구 기관들과 연계를 맺어야 합니다."
 CES_connection_with_educational_abroad_one: "해외 교육 기관과의 연계 1"
 CES_connection_with_educational_abroad_one_desc: "농민을 교육하기 위해 농업 연구 기관들과 연계를 맺어야 합니다."
 CES_voluonteer_labor: "자원 노동"
 CES_voluonteer_labor_desc: "교도소에서... 어... 자원봉사자들을 뽑아 들판에서 일하게 해야 합니다. 이러면 번영만 가져오겠지요?"
 CES_keep_it_civil: "시민적 노동 유지"
 CES_keep_it_civil_desc: "우리 농업 부문에서는 시민적이고 공정한 노동만 장려해야 합니다."
 CES_agricultural_institutes: "농업 연구소"
 CES_agricultural_institutes_desc: "우리 자체의 농업 기관을 설립하고 우리의 경험에 따라 교육해야 합니다."
 CES_agriculture_policy: "농업 정책"
 CES_switzerland_investments_idea: "스위스와의 무역"
 CES_new_markets: "신시장"
 CES_new_markets_desc: "신시장 개척은 세계 경제 공간에서 성공의 열쇠입니다. 한편으로는 해외 판매를 확대하고 전체 사업 수익을 늘릴 기회를 제공합니다. 다른 한편으로 다른 나라와의 무역은 문화적 다양성과 민족 간 이해를 키우는 데 도움이 되며, 이는 국가 간 평화와 협력을 증진합니다."
 CES_trade_with_china: "중국과의 무역"
 CES_trade_with_china_desc: "중국과의 무역은 중국의 영향력, 기술력, 자원 때문에 세계 경제에서 결정적인 요인이 되고 있습니다. 이는 상호 발전과 혁신, 지속 가능한 경제 관계의 형성을 촉진합니다."
 CES_trade_with_south_korea: "남한과의 무역"
 CES_trade_with_south_korea_desc: "한국과의 무역은 우리 세계 경제의 번영과 다양성의 열쇠입니다. 이 중요한 무역 파트너는 우리의 시야를 넓히고 여러 분야에서 관계를 풍성하게 할 독특한 기회를 제공합니다."
 CES_trade_with_north_korea: "북한과의 무역"
 CES_trade_with_north_korea_desc: "북한은 소수만이 알고 있는 엄청난 잠재력을 지닌 시장입니다. 석탄, 광물, 심지어 잠재적으로 값진 금속을 포함한 풍부한 천연자원이 있습니다. 이 나라와의 무역은 새로운 시장과 원자재 공급원을 찾는 기업들에게 흥미로울 수 있습니다."
 CES_trade_with_india: "인도와의 무역"
 CES_trade_with_india_desc: "인도는 상품과 서비스 수출에 있어 거대한 시장입니다. 10억 이상의 인구와 성장하는 중산층을 가진 인도는 세계 무역의 중요한 파트너가 될 수 있습니다. 인도로의 수출은 고객 기반을 넓히고 판매를 늘리는 데 도움이 될 수 있습니다."
 CES_trade_with_turkey: "튀르키예와의 무역"
 CES_trade_with_turkey_desc: "튀르키예는 유럽과 아시아를 잇는 다리로서 대륙 간 무역 발전의 핵심 파트너입니다. 이 나라는 방대한 인프라와 현대적인 항만 및 수송로를 갖추고 있어 효율적인 물류와 다양한 시장으로의 접근을 보장합니다."
 CES_trade_with_mongolia: "몽골과의 무역"
 CES_trade_with_mongolia_desc: "몽골에는 광물, 석탄, 육류, 양모를 비롯한 방대한 천연자원이 있습니다. 몽골과의 무역은 저렴하고 양질의 원자재 공급원이 될 수 있으며, 이는 우리 산업에 긍정적인 영향을 줄 것입니다."
 CES_trade_with_pakistan: "파키스탄과의 무역"
 CES_trade_with_pakistan_desc: "파키스탄은 상당한 경제적, 지정학적 이점을 지닌 나라이며 이들과의 협력은 매우 유익할 수 있습니다."
 CES_trade_with_russia: "러시아와의 무역"
 CES_trade_with_russia_desc: "러시아는 잠재력이 크고 이점이 많은 나라이며, 이들과의 협력은 상당한 이익을 가져올 수 있습니다."
 CES_trade_with_ukraine: "우크라이나와의 무역"
 CES_trade_with_ukraine_desc: "우크라이나는 4천만 명 이상의 인구를 가진 큰 시장으로, 우리의 무역 활동을 넓히고 판매를 늘리는 데 매력적인 파트너입니다."
 CES_trade_with_azerbaijan: "아제르바이잔과의 무역"
 CES_trade_with_azerbaijan_desc: "아제르바이잔은 막대한 석유와 천연가스 매장량을 가진 에너지 산업의 핵심 주체입니다. 아제르바이잔과의 협력은 이 중요한 자원에 대한 접근을 제공하고 에너지 원자재 공급의 다양성에 기여할 수 있습니다."
 CES_trade_with_belarus: "벨라루스와의 무역"
 CES_trade_with_belarus_desc: "벨라루스는 수백만 명의 인구를 가진 큰 시장입니다. 벨라루스로 상품과 서비스를 수출하면 판매를 늘리고 고객 기반을 넓힐 전망이 열립니다."
 CES_trade_with_armenia: "아르메니아와의 무역"
 CES_trade_with_armenia_desc: "아르메니아는 경제가 활발히 발전하고 있는 나라이며, 이들과의 협력은 우리에게 새로운 시장과 파트너로의 접근을 제공할 수 있습니다. 아르메니아로 상품과 서비스를 수출하면 사업을 확장하고 판매를 늘릴 새로운 전망이 열립니다."
 CES_trade_with_georgia: "조지아와의 무역"
 CES_trade_with_georgia_desc: "조지아는 풍부한 문화유산과 협력 전망을 지닌 나라로, 우리 경제의 중요한 파트너입니다."
 CES_trade_with_iran: "이란과의 무역"
 CES_trade_with_iran_desc: "이란은 석유와 가스를 포함한 상당한 에너지 자원 매장량을 보유하고 있습니다. 이란과의 무역은 우리에게 에너지 안보와 중요 자원에 대한 접근 기회를 제공합니다."
 CES_trade_with_europe: "유럽과의 무역"
 CES_trade_with_europe_desc: "유럽에는 세계 최대 규모의 경제가 여럿 있습니다. 유럽 국가들과의 무역은 우리에게 사업을 확장하고 판매를 늘릴 기회를 제공합니다."
 CES_trade_with_switzerland: "스위스와의 무역"
 CES_trade_with_switzerland_desc: "스위스는 시계, 제약, 식품 가공을 포함한 제조업으로 유명합니다. 스위스와의 무역은 고품질의 상품과 제품에 대한 접근을 제공하여 우리 사업 운영의 성장을 뒷받침할 수 있습니다."
 CES_trade_with_greece: "그리스와의 무역"
 CES_trade_with_greece_desc: "그리스는 관광 자원이 풍부하며, 이들과의 협력은 관광 산업의 발전과 경험 교류의 기회를 만들 수 있습니다."
 CES_trade_with_united_kingdom: "영국과의 무역"
 CES_trade_with_united_kingdom_desc: "영국은 구매력이 높은 큰 시장으로, 사업 기회를 넓히고 판매를 늘리는 데 매력적인 파트너입니다."
 CES_trade_with_france: "프랑스와의 무역"
 CES_trade_with_france_desc: "프랑스는 예술과 문화, 역동적인 경제가 풍부한 나라로, 우리의 무역 관계를 발전시키는 데 매력적인 파트너입니다."
 CES_trade_with_usa: "미국과의 무역"
 CES_trade_with_usa_desc: "미국은 막강한 경제력, 뛰어난 혁신 역량, 엄청난 협력 전망을 지닌 나라로, 국제 사업 관계를 발전시키는 핵심 파트너입니다."
 CES_trade_with_spain: "스페인과의 무역"
 CES_trade_with_spain_desc: "스페인은 사업 성장 잠재력이 높은 큰 시장입니다. 스페인 기업 및 기업가들과의 협력은 우리의 사업을 확장하고 판매를 늘릴 새로운 기회를 열어 줍니다."
 TRK_berli_modifier: "부활한 정치국"
 nat_coalit_tt: "§Y다른 민족주의자들과 연합합니다§!"
 nationalists.1.t: "군사 협력 제안"
 nationalists.1.d: "세계 무대에서의 공통된 지정학적 이해관계 때문에 군사 협력의 가능성에 관한 문제가 양국 정부 앞에 제기되었습니다. 우리가 보기에 이러한 협력은 우리가 중앙아시아의 튀르크 형제들과 더욱 가까워질 것이므로 민족 정신을 고취할 것입니다."
 nationalists.1.a: "우리 민족들에게 역사적인 순간이다. 튀르크 민족은 더욱 강해질 것이다!"
 nationalists.1.b: "중앙아시아? 그게 뭔데?"
 CES_nationalist_policy: "민족주의 정책"
 CES_kaz_modifier: "카자흐스탄의 군사 및 정치 개혁"
 CES_kaz_modifier_desc: "우리 군대와 국가 보안 기관은 개혁이 필요하며, 카자흐스탄이 방어나 전쟁에 대비하지 않으면 적에 맞설 수 없을 것입니다."
 CES_kaz_reform_vs: "전면 개혁"
 CES_kaz_reform_vs_desc: "우리 군대와 보안 기관은 전면적인 개혁이 필요하며, 지금 시작할 것입니다."
 CES_kaz_ter_oborna: "영토방위군"
 CES_kaz_ter_oborna_desc: "우리나라는 광대하여 더 많은 방어가 필요합니다. 영토방위군이 이 수요를 해결할 것입니다."
 CES_kaz_nat_gurad: "국가방위군"
 CES_kaz_nat_gurad_desc: "효율을 높이기 위해 내무군을 국가방위군으로 개편할 것입니다."
 CES_kaz_gos_ohrana: "국가경호국"
 CES_kaz_gos_ohrana_desc: "카자흐스탄 대통령에게 직속되어 책임을 지는 특별 국가 기관으로, 국가 안보 부대의 일부를 이루며 법으로 정한 권한 범위 안에서 대통령과 기타 보호 대상 인물 및 시설을 경호하기 위한 안전 조치를 수행합니다."
 CES_kaz_reog_kadet: "군사 학교 재편"
 CES_kaz_reog_kadet_desc: "우리 병사들은 최고의 국제 기준에 따라 훈련받아야 합니다."
 CES_kaz_defence_doctrine: "방어 교리"
 CES_kaz_defence_doctrine_desc: "우리나라는 평화를 지향하지만 스스로를 지킬 준비가 되어 있어야 합니다."
 CES_kaz_sso: "특수작전군"
 CES_kaz_sso_desc: "우리 자체의 특수작전군을 창설할 것입니다."
 CES_ter_oborona_tt: "§Y영토방위군§!이 창설됩니다"
 nationalists.2.t: "우리 미래의 문제"
 nationalists.2.d: "우리의 새 정부는 나라를 강화하는 데 많은 노력을 기울였으며, 이제 우리는 영향권을 앞으로 어떻게 확장할 것인가 하는 문제에 직면했습니다. 우리는 황금 군단의 옛 권력을 되살리는 길을 따를 수도 있고, 튀르크 민족을 통합한다는 비교적 새로운 구상을 따를 수도 있습니다."
 nationalists.2.a: "황금 군단은 우리나라의 최고 전성기였다. 그 힘을 되살리겠다!"
 nationalists.2.b: "오직 통합해야만 튀르크 민족이 더 강해질 것이다!"
 mongolempire.path: "§Y우리는 황금 군단의 길을 택했습니다§!"
 turan.path: "§Y우리는 대투란의 길을 택했습니다§!"
 CES_new_turkic_state: "신 튀르크 국가"
 CES_new_turkic_state_desc: "튀르크 민족은 언제나 아시아에서, 때로는 유럽에서도 지배적인 민족이었습니다. 강력한 튀르크 국가를 세워 우리 민족의 영광을 되찾아야 합니다."
 CES_national_counc: "국민 평의회"
 CES_national_counc_desc: "여러 군사화된 민족주의 정당과 그 추종자들의 지지가 없으면 우리는 장기적으로 정권을 유지할 수 없을 것입니다."
 CES_look_hist: "역사를 돌아보라"
 CES_look_hist_desc: "한때 우리에게 속했던 일부 영토가 이제 다른 국가의 통제하에 있습니다. 우리는 이를 되찾아야 합니다."
 CES_revive_nomad_spirit: "유목 정신 부활"
 CES_revive_nomad_spirit_desc: "유목은 우리의 참된 삶의 방식입니다. 우리 조상은 수많은 땅을 누비며 우리의 문화를 다른 영토에 퍼뜨렸습니다. 우리는 이 유산을 자랑스러워해야 합니다."
 CES_ignite_turkic_militar: "튀르크 군국주의 점화"
 CES_ignite_turkic_militar_desc: "튀르크 민족은 외부 위협에 맞서기 위해 단결해야 합니다."
 CES_promote_pan_turk: "범튀르크주의 증진"
 CES_promote_pan_turk_desc: "수많은 튀르크 사람들의 뜻을 하나로 모아야만 우리 민족을 통합한다는 목표에 가까워질 수 있습니다."
 CES_establish_loyal_natgov: "충성스러운 민족 정부 수립"
 CES_establish_loyal_natgov_desc: "충성스러운 지도부를 앉히면 내부 분쟁을 걱정하지 않아도 될 것입니다."
 CES_trukism_is_our_body: "튀르크주의는 우리의 몸"
 CES_trukism_is_our_body_desc: "우리는 우리의 정체성을 자랑스러워하고 하나의 깃발 아래 우리 민족들을 통합한다는 이상을 널리 알려야 합니다."
 CES_connect_grey_wolves: "회색 늑대 연계"
 CES_connect_grey_wolves_desc: "튀르키예는 우리의 잠재적인 전략적, 이념적 동맹입니다. 우리의 영향력을 더욱 강하게 투사하기 위해 교류를 강화해야 합니다."
 CES_turkic_army: "튀르크 군대"
 CES_turkic_army_desc: "외교 정책을 성공적으로 수행하려면 우리의 군산복합체에 자금을 대야 합니다."
 CES_purge_disloyals: "쥐새끼 숙청"
 CES_purge_disloyals_desc: "우리나라에는 여전히 우리의 입장에 반대하는 이들이 많습니다. 이러한 반대를 뿌리 뽑아야 합니다."
 CES_anti_russian_nat_prop: "반러시아 민족 선전"
 CES_anti_russian_nat_prop_desc: "우리의 가장 큰 적과 관계를 끊을 때가 왔습니다. 더 이상 러시아의 군홧발이 우리 땅을 밟지 못할 것입니다."
 CES_no_other_lang: "타 언어 금지"
 CES_no_other_lang_desc: "러시아는 오랫동안 우리 땅과 우리 국민을 고향에서 먼 곳의 무의미하고 피비린내 나는 전쟁에 이용해 왔습니다. 우리는 더 이상 그들이 우리나라에 있는 것을 용납하지 않을 것입니다."
 CES_embrace_traditions: "전통 수용"
 CES_embrace_traditions_desc: "민족 정신을 강화하려면 우리의 전통을 살려 두어야 합니다."
 CES_paramilitar_stuff: "준군사 조직"
 CES_paramilitar_stuff_desc: "사회에 군사주의적 사고방식을 유지함으로써 우리의 의제를 더 큰 성공으로 밀어붙일 수 있을 것입니다."
 CES_milyouth_nat: "군사 청년 민족주의"
 CES_milyouth_nat_desc: "청년은 우리 체제의 필수적인 부분입니다. 어릴 때부터 이들의 투지를 키움으로써 우리나라의 방어를 강화할 수 있습니다."
 CES_nat_tengri_spir: "민족 텡그리 정신"
 CES_nat_tengri_spir_desc: "우리 국민이 다시 한번 자신의 땅의 정당한 주인으로 인정받을 수 있도록 튀르크 칸국의 영광을 되살려야 합니다."
 CES_back_to_genghis_khan: "칭기즈 칸에게로"
 CES_back_to_genghis_khan_desc: "몽골은 우리나라 위대함의 출발점입니다. 우리는 역사적 정의를 바로잡기 위해 이 땅으로 돌아갈 것입니다."
 CES_kipchak_chak: "킵차크 차크"
 CES_kipchak_chak_desc: "루마니아의 억압에서 해방하여 가가우즈인을 우리나라로 되돌려 놓을 것입니다."
 CES_free_uighurs: "위구르 해방"
 CES_free_uighurs_desc: "위구르인은 중국 내에서 억압받는 민족입니다. 그들은 자신들을 해방하도록 우리에게 도움을 요청하고 있습니다."
 CES_invade_jap: "일본 침공"
 CES_invade_jap_desc: "이번에는 또 다른 가미카제 폭풍이 그들을 구해 주지 못할 것입니다."
 CES_march_to_siberia: "시베리아 진군"
 CES_march_to_siberia_desc: "러시아는 우리가 너무 약해서 뒤에서 칠 수 없다고 생각하는가? 그들은 크게 착각하고 있다."
 CES_those_whorej: "거부한 자들"
 CES_those_whorej_desc: "중앙아시아의 민족들이 하나의 깃발 아래 우리와 통합하든가, 이곳에는 혼돈만이 있을 것입니다. 이 지역의 운명을 결정할 때가 왔습니다."
 CES_revive_khanate: "칸국 부활"
 CES_revive_khanate_desc: "튀르크 칸국은 미국조차 우리의 의견에 귀를 기울일 만큼 위대한 나라가 될 것입니다. 모든 일이 우리의 허락 아래 이루어질 것입니다!"
 CES_tribute_to_khan: "칸에 대한 조공"
 CES_tribute_to_khan_desc: "우리 정권에 충성하는 모든 사람은 새로운 칸에게 조공을 바쳐야 합니다."
 CES_finally_united: "마침내 하나로"
 CES_finally_united_desc: "이제 대부분의 튀르크 국가가 우리 깃발 아래 통합되었으므로, 우리나라가 다시 위대해졌다고 온전히 말할 수 있습니다."
 CES_cultural_unif: "문화 통합"
 CES_cultural_unif_desc: "우리 인구가 대체로 튀르크계임에도 불구하고, 우리나라에는 여전히 완전한 통합을 가로막는 다양한 문화가 많이 있습니다. 문화적 통일을 위한 새로운 이념을 찾아야 합니다."
 CES_turkify_finland: "핀란드의 튀르크화"
 CES_turkify_finland_desc: "핀란드는 우리 칸국이 닿지 못한 영토입니다. 핀란드인을 복속시키고 튀르크화하여 이를 바로잡을 것입니다."
 CES_nat_islam_spir: "민족 이슬람 정신"
 CES_nat_islam_spir_desc: "이슬람이 우리 민족을 위대함으로 이끌었습니다. 문화와 종교의 형제들과 다시 합쳐 그 위대함을 되찾아야 합니다."
 CES_path_of_seljuk: "셀주크의 길"
 CES_path_of_seljuk_desc: "이란의 영토를 복속시키면 이 지역에서 전략적 우위를 확보할 수 있습니다."
 CES_idelural: "이델-우랄"
 CES_idelural_desc: "바시키리아는 정당하게 우리에게 속한 영토입니다. 우리는 이를 되찾아야 합니다."
 CES_ottoman_spirit: "오스만 정신"
 CES_ottoman_spirit_desc: "튀르키예는 가장 큰 튀르크계 이웃이며, 더 정의로운 사회를 건설하기 위해 우리 민족들을 재통합해야 합니다."
 CES_reunite_azer: "아제르바이잔과의 재결합"
 CES_reunite_azer_desc: "아제르바이잔은 튀르크 민족의 나라이지만 제법 말을 듣지 않습니다. 우리가 이를 바로잡을 것입니다."
 CES_crush_who_reject: "거부한 자들을 분쇄하라"
 CES_crush_who_reject_desc: "이번에는 우리의 영향력을 중앙아시아 전역으로 확장할 것입니다. 모든 반대자는 제거될 것입니다."
 CES_finish_the_deed: "아르메니아의 위협"
 CES_finish_the_deed_desc: "아르메니아는 현재 우리의 튀르크 형제들을 지배하고 있습니다. 우리는 그들을 아르메니아의 지배에서 해방할 것입니다."
 CES_declare_turan: "투란 선포"
 CES_declare_turan_desc: "마침내 우리 민족의 완전한 통일을 선포할 수 있게 되었습니다. 많은 나라가 우리의 우월함을 인정했으며, 우리는 이제 세계에 더 전 지구적인 영향을 미칠 수 있습니다."
 CES_turkic_equality: "튀르크 평등"
 CES_turkic_equality_desc: "우리나라의 모든 주민은 과거 다른 나라의 통제하에서 가졌던 경제적 지위와 관계없이 동등한 권리를 누릴 것입니다."
 CES_raise_from_ash: "잿더미에서 일어서다"
 CES_raise_from_ash_desc: "독립 국가로서의 [FROM.GetNameDef]은(는) 소련 붕괴 이후 힘든 역사적 시기를 겪었습니다. 1991년에 국가가 얻은 독립은 지난 시대의 잿더미에서 일어서는 상징이었습니다."
 CES_raise_from_ash_idea: "잿더미에서 일어서다"
 CES_raise_from_ash_idea_desc: "독립 국가로서의 [FROM.GetNameDef]은(는) 소련 붕괴 이후 힘든 역사적 시기를 겪었습니다. 1991년에 국가가 얻은 독립은 지난 시대의 잿더미에서 일어서는 상징이었습니다."
 CES_establ_absolu_loy: "절대적 충성 확립"
 CES_establ_absolu_loy_desc: "이는 지도자가 과두 지배층이 자신의 정책을 전적으로 지지하도록 만들려는 시도입니다. 그러나 그들 중 일부가 정부와 국가 지도부를 비판하기 시작했으며, 이는 엘리트 사이의 세력 분열로 이어져 국제 무대에서 대통령의 권위를 약화시킬 수 있습니다."
 CES_our_beloved_autocrat_kaz: "당 강화"
 CES_our_beloved_autocrat_kaz_desc: "[CES_our_beloved_autocrat_kaz_desc]"
 KAZ_our_beloved_autocrat_kaz_desc: "우리가 가장 아끼는 독재자로서 누르술탄 아비슈울리 나자르바예프는 오랜 통치 기간(1989-2019) 동안 카자흐스탄의 경제를 탈바꿈시켰습니다. 주로 그의 정책과 전략적 사고 덕분에 중앙아시아 국가들은 새로운 안정과 번영을 얻었습니다. 독재자 나자르바예프의 성공의 핵심 요인 중 하나는 국가 경제를 효과적으로 운영할 수 있는 강력한 국가 기구를 만들어 낸 것입니다. 그 결과 카자흐스탄은 산업과 농업에서 상당한 진전을 이룰 수 있었고, 이는 국민 소득 증가와 국민의 삶의 질 향상으로 이어졌습니다."
 UZB_our_beloved_autocrat_kaz_desc: "우리가 가장 아끼는 독재자로서 이슬람 압두가니예비치 카리모프는 오랜 통치 기간(1991-2016) 동안 우즈베키스탄의 경제를 탈바꿈시켰습니다. 주로 그의 정책과 전략적 사고 덕분에 중앙아시아 국가들은 새로운 안정과 번영을 얻었습니다. 독재자 카리모프의 성공의 핵심 요인 중 하나는 국가 경제를 효과적으로 운영할 수 있는 강력한 국가 기구를 만들어 낸 것입니다. 그 결과 우즈베키스탄은 산업과 농업에서 상당한 진전을 이룰 수 있었고, 이는 국민 소득 증가와 국민의 삶의 질 향상으로 이어졌습니다."
 KYR_our_beloved_autocrat_kaz_desc: "우리가 가장 아끼는 독재자로서 아스카르 아카예프는 오랜 통치 기간(1991-2005) 동안 키르기스스탄의 경제를 탈바꿈시켰습니다. 주로 그의 정책과 전략적 사고 덕분에 중앙아시아 국가들은 새로운 안정과 번영을 얻었습니다. 독재자 아카예프의 성공의 핵심 요인 중 하나는 국가 경제를 효과적으로 운영할 수 있는 강력한 국가 기구를 만들어 낸 것입니다. 그 결과 키르기스스탄은 산업과 농업에서 상당한 진전을 이룰 수 있었고, 이는 국민 소득 증가와 국민의 삶의 질 향상으로 이어졌습니다."
 CES_purge_unloyal_polit: "불충한 정치인 숙청"
 CES_purge_unloyal_polit_desc: "우리 지도자는 강경한 정치 개혁을 시행하기로 결정했습니다. 이 개혁은 우리의 권력을 강화하고 정권에 불충하다고 여겨지는 반대 세력을 억누르는 것을 목표로 합니다."
 nursultan: "누르술탄"
 akmolinsk: "악몰린스크"
 uzbekgrad: "우즈베크그라드"
 chachkent: "차치켄트"
 kyrgyzgrad: "키르기스그라드"
 frunze: "프룬제"
 CES_oligarchic_drift: "과두 지배층 비위 맞추기"
 CES_oligarchic_drift_desc: "당분간 과두 지배층의 비위를 맞추는 것은 우리 외교를 본궤도에 올리는 좋은 방법입니다."
 CES_populistic_sentiment: "포퓰리즘 정서"
 CES_populistic_sentiment_desc: "대중을 달래기 위해 약간의 자금을 쓸 수 있습니다."
 CES_common_soviet_legacy: "공통의 소련 유산"
 CES_common_soviet_legacy_desc: "공통의 소련 유산은 모든 소련 이후 국가와 그 너머를 하나로 묶습니다. 이를 우리의 외교 노력에 활용할 것입니다."
 CES_cis_ties: "CIS와의 유대"
 CES_cis_ties_desc: "CIS 국가들은 함께 걸어온 공통의 역사적 길 덕분에 우리와 가장 가깝습니다."
 CES_us_ties: "미국과의 유대"
 CES_us_ties_desc: "USAID와의 협력은 빈곤 퇴치, 보건 강화, 교육 같은 핵심 과제를 해결하기 위한 기술 지원, 전문성, 자원에 대한 접근을 제공할 수 있습니다."
 CES_diplo_startup: "외교 개시"
 CES_diplo_startup_desc: "이제 우리의 외교는 다른 나라들과 더 적극적인 교류를 시작해야 합니다."
 centrasiaev.5.t: "[FROM.GetName]의 투자 요청"
 centrasiaev.5.d: "[FROM.GetName]이(가) 투자를 요청합니다"
 centrasiaev.5.a: "물론이지!"
 centrasiaev.5.b: "안된다"
 centrasiaev.6.t: "[FROM.GetName]의 우리 제안 거절"
 centrasiaev.6.d: "[FROM.GetName]이(가) 우리의 제안을 거절했습니다."
 centrasiaev.6.a: "아 진짜"
 centrasiaev.7.t: "[FROM.GetName]의 우리 제안 수락"
 centrasiaev.7.d: "[FROM.GetName]이(가) 우리의 제안을 수락했습니다."
 centrasiaev.7.a: "훌륭하다!"
 centrasiaev.8.t: "[FROM.GetName]의 부채 감면 요청"
 centrasiaev.8.d: "[FROM.GetName]이(가) 부채 재협상을 위해 우리에게 접근했습니다. 수락하면 그들의 부채를 120억 달러 줄여 줄 수 있고, 거절할 수도 있습니다. 잃을 것은 거의 없고, 그 나라에 대한 우리의 영향력 면에서는 얻을 것이 많습니다."
 centrasiaev.8.a: "좋아..."
 centrasiaev.8.b: "미안하지만, 안된다"
 centrasiaev.9.t: "러시아의 우리 제안 거절"
 centrasiaev.9.d: "러시아가 우리의 제안을 거절했습니다."
 centrasiaev.9.a: "젠장!"
 centrasiaev.10.t: "러시아의 우리 제안 수락"
 centrasiaev.10.d: "러시아가 우리의 제안을 수락했습니다."
 centrasiaev.10.a: "고맙다"
 centralnato.1.t: "카자흐스탄의 NATO 가입 희망"
 centralnato.1.d: "카자흐스탄은 최근 몇 년간 서방과 훨씬 더 가까워졌습니다. 우리 장관과 외교관 다수가 카자흐스탄에 NATO 가입을 권유하자고 제안했습니다. 그렇게 하시겠습니까?"
 centralnato.1.a: "초청하자!"
 centralnato.1.b: "응? 안 돼!"
 centralnato.2.t: "우즈베키스탄의 NATO 가입 희망"
 centralnato.2.d: "우즈베키스탄은 최근 몇 년간 서방과 훨씬 더 가까워졌습니다. 우리 장관과 외교관 다수가 우즈베키스탄에 NATO 가입을 권유하자고 제안했습니다. 그렇게 하시겠습니까?"
 centralnato.2.a: "초청하자!"
 centralnato.2.b: "응? 안 돼!"
 centralnato.3.t: "키르기스스탄의 NATO 가입 희망"
 centralnato.3.d: "키르기스스탄은 최근 몇 년간 서방과 훨씬 더 가까워졌습니다. 우리 장관과 외교관 다수가 키르기스스탄에 NATO 가입을 권유하자고 제안했습니다. 그렇게 하시겠습니까?"
 centralnato.3.a: "초청하자!"
 centralnato.3.b: "응? 안 돼!"
 centralnato.4.t: "[From.GetNameDef]의 우리 제안 수락"
 centralnato.4.d: "우리는 최근 NATO에 가입 신청서를 제출했습니다. [From.GetNameDef]이(가) 이를 검토하여 결정을 내렸으며, 우리는 동맹의 새로운 회원국이 되었습니다."
 centralnato.4.a: "매우 좋군!"
 centralnato.5.t: "[From.GetNameDef]의 우리 제안 거절"
 centralnato.5.d: "우리는 최근 NATO에 가입 신청서를 제출했습니다. [From.GetNameDef]이(가) 이를 검토했으나 안타깝게도 거절했습니다."
 centralnato.5.a: "슬프군"
 centralasianunion.1.t: "[From.GetNameDef]의 중앙아시아 연합 초청"
 centralasianunion.1.d: "[From.GetNameDef]이(가) 우리를 중앙아시아 연합에 가입하도록 초청했습니다. 수락해야 합니까?"
 centralasianunion.1.a: "물론이지"
 centralasianunion.1.b: "미안하지만, 안된다"
 centralasianunion.2.t: "[From.GetNameDef]의 중앙아시아 연합 가입 동의"
 centralasianunion.2.d: "우리는 최근 [From.GetNameDef]에 중앙아시아 연합 가입을 제안했습니다. 그리고 그들이 긍정적으로 답했습니다!"
 centralasianunion.2.a: "매우 좋군!"
 centralasianunion.3.t: "[From.GetNameDef]의 중앙아시아 연합 가입 거절"
 centralasianunion.3.d: "우리는 최근 [From.GetNameDef]에 중앙아시아 연합 가입을 제안했습니다. 안타깝게도 그들은 그 제안을 거절했습니다."
 centralasianunion.3.a: "슬프군"
 centralkaz.1.t: "우리의 카자흐스탄"
 centralkaz.1.d: "카자흐스탄은 역사와 자연이 풍부한 놀라운 나라입니다. 그 역사는 스키타이인과 사카인 같은 유목 민족이 이 땅에 거주하던 고대로부터 수천 년을 거슬러 올라갑니다. 카자흐스탄 역사의 중요한 부분은 독특한 문화와 생활 방식이 형성된 대초원의 형성이었습니다.\n\n카자흐스탄 역사의 중요한 단계 중 하나는 카자흐 칸국과 중가르 칸국 같은 칸국의 형성이었습니다. 이 시기는 무역, 문화, 예술의 발전이 특징이었습니다.\n\n19세기에 카자흐스탄은 열강의 관심 대상이 되었고 결국 러시아 제국에 편입되었습니다. 이 시기는 카자흐스탄의 사회와 경제에 상당한 변화를 가져왔습니다.\n\n카자흐스탄은 광대한 초원, 장엄한 산맥, 수많은 호수와 강을 포함한 독특한 자연의 부를 지니고 있습니다. 이러한 자연은 이제 지역의 생태적 균형을 유지하는 데 점점 더 중요해지고 있습니다."
 centralkaz.1.a: "흥미롭군"
 centraluzb.1.t: "우리의 우즈베키스탄"
 centraluzb.1.d: "1991년 우즈베키스탄은 소련으로부터 독립을 얻었으며 이는 그 역사의 중요한 순간이었습니다. 우즈베키스탄의 초대 대통령 이슬람 카리모프는 오랜 기간 나라를 이끌며 경제, 교육, 보건 분야에서 개혁을 도입했습니다. 우즈베키스탄은 세계 최대의 면화 생산국 중 하나가 되었고 수출 산업을 적극적으로 발전시켰습니다.\n\n우즈베키스탄의 독립 시기는 극단주의 및 테러와의 싸움 같은 도전에 직면했지만, 나라는 안보와 안정을 강화하기 위해 열심히 노력했습니다.\n\n한편 독립 시기의 우즈베키스탄 역사는 경제적, 정치적 측면에만 국한되지 않습니다. 이 나라는 문화유산이 풍부하며 국민은 자신들의 전통과 역사를 자랑스러워합니다. 국가 기념일과 축제는 우즈베크 문화와 전통의 풍요로움을 반영합니다."
 centraluzb.1.a: "흥미롭군"
 centralkyr.1.t: "우리의 키르기스스탄"
 centralkyr.1.d: "키르기스스탄은 1991년 소련 붕괴와 함께 독립을 얻었습니다. 이 역사적 순간은 이제 스스로의 운명을 개척할 수 있게 된 키르기스스탄 국민에게 이정표였습니다. 이 시기에 나라는 민주적 제도 구축, 경제 개혁, 국가적 변혁을 포함한 여러 도전에 직면했습니다.\n\n시간이 흐르면서 키르기스스탄은 인상적인 성과를 거두었습니다. 나라는 안정된 사회를 형성했으며 국제 무대에서 적극적인 역할을 하고 있습니다. 키르기스스탄은 전통 노래와 춤을 비롯한 문화적 풍요와 톈산 산맥을 비롯한 아름다운 자연으로 유명합니다."
 centralkyr.1.a: "흥미롭군"
 centralkaz.2.t: "카자흐스탄군"
 centralkaz.2.d: "카자흐스탄군은 국가 안보와 나라의 자부심을 이루는 중요한 구성 요소입니다. 1991년 독립을 얻은 이래 카자흐스탄은 현대적이고 잘 훈련되었으며 보급이 충실한 군대를 만들고자 군대를 적극적으로 발전시켜 왔습니다.\n\n카자흐스탄군은 국가 방위 능력 보장, 평화유지 임무 참여, 국경 방어를 비롯한 많은 임무를 맡고 있습니다. 또한 안보 문제에서 다른 나라들과 적극적으로 협력하고 합동 훈련을 실시합니다."
 centralkaz.2.a: "흥미롭군"
 centraluzb.2.t: "우즈베키스탄군"
 centraluzb.2.d: "우즈베키스탄군은 국가 안보를 보장하고 나라의 이익을 지키는 데 핵심적인 역할을 합니다. 1991년 독립을 얻은 이래 우즈베키스탄은 현대적이고 전문적인 군대를 만들며 군대를 적극적으로 발전시켜 왔습니다.\n\n우즈베크군은 국경 방어, 내부 안정 유지, 국제 평화 임무 참여를 포함한 폭넓은 기능을 수행합니다. 오늘날 세계에서 발생할 수 있는 다양한 도전에 대비해 훈련되어 있고 준비되어 있습니다."
 centraluzb.2.a: "흥미롭군"
 centralkyr.2.t: "키르기스스탄군"
 centralkyr.2.d: "키르기스스탄군은 국가 안보의 중요한 요소이자 나라의 자부심입니다. 1991년 독립 이래 키르기스스탄은 전문적이고 현대적인 군대를 만들기 위해 군대를 적극적으로 발전시켜 왔습니다.\n\n키르기스군은 국경 방어, 내부 안정 유지, 평화유지 임무 참여를 포함한 다양한 기능을 수행합니다. 현대 세계가 맞닥뜨릴 수 있는 다양한 도전에 대비해 훈련되고 준비된 병사와 장교들을 자랑스러워합니다."
 centralkyr.2.a: "흥미롭군"
 centralkaz.3.t: "카자흐스탄 공화국 독립 10주년"
 centralkaz.3.d: "10년 전 카자흐스탄 공화국은 독립 국가가 되었고, 그 이후 많은 변화와 변혁이 있었습니다. 이 중요한 기념일은 자유와 독립을 향한 국민의 열망을 상징하며, 나라의 과거와 현재, 미래에 관한 중요한 물음을 제기합니다.\n\n오늘 우리는 식민지 의존의 짐으로부터 벗어난 자유를 기념할 뿐 아니라 나라의 내적 성장과 발전도 기립니다. 경제, 교육, 문화의 발전은 우리 국가의 중요한 우선순위가 되었습니다. 카자흐스탄은 국제 사회에 더욱 개방되었고, 다른 나라들과의 관계를 강화했으며, 지구적 문제의 해결에 적극 참여했습니다.\n\n이 기념일은 또한 희망과 낙관 속에 미래를 바라볼 기회입니다. 우리는 민족 정체성을 강화하고 나라의 지속 가능한 발전을 촉진하기 위해 계속 노력해야 합니다.\n\n그러므로 카자흐스탄 공화국 독립 10주년은 우리의 성과를 기념하고, 우리 앞에 놓인 과제를 바라보며, 나라의 독립과 번영을 지키고 강화하겠다는 의지를 재확인하는 계기입니다."
 centralkaz.3.a: "흥미롭군"
 centralkaz.4.t: "누르술탄 나자르바예프 사임"
 centralkaz.4.d: "30년간의 집권 끝에 카자흐스탄의 초대 대통령 누르술탄 나자르바예프가 사임을 결정했습니다. 이 결정은 국내외에서 놀라움과 논의의 물결을 일으켰습니다.\n\n누르술탄 나자르바예프는 소련의 공화국이던 카자흐스탄이 강력한 경제와 지정학적 역할을 가진 독립 국가로 발전하는 데 막대한 기여를 했습니다. 그의 사임은 한 시대의 끝을 알렸지만, 동시에 카자흐스탄의 추가적인 발전과 민주화에 대한 열망을 알리는 신호이기도 했습니다.\n\n카자흐스탄의 새 대통령은 의회에서 선출된 카심조마르트 토카예프였습니다. 이 권력 이양은 민주 사회를 구축하는 데 있어 법적 절차와 제도를 준수하는 것의 중요성을 강조하는 나라의 헌법에 따라 이루어졌습니다.\n\n이러한 사건들은 카자흐스탄뿐 아니라 지역 전체의 정치 지형에도 틀림없이 영향을 미쳤습니다. 이는 카자흐스탄의 미래와 세계 무대에서 이 나라의 역할에 관한 논의를 요구합니다. 누르술탄 나자르바예프의 결정과 카심조마르트 토카예프의 등장은 카자흐스탄 역사의 새로운 장의 시작일 수 있습니다."
 centralkaz.4.a: "흥미롭군"
 centralkaz.5.t: "헌법 개정"
 centralkaz.5.d: "국민투표에서 나라의 정부 형태를 크게 바꾸는 헌법 개정안이 승인되었습니다. 이 변화는 초대통령제에서 강력한 의회와 책임 있는 정부를 갖춘 대통령제 공화국으로의 전환을 의미했습니다.\n\n이 개정안의 핵심 사항 중 하나는 헌법에서 누르술탄 나자르바예프의 카자흐스탄 초대 대통령 지위에 대한 모든 언급을 삭제한 것이었습니다. 이는 민주적 원칙과 권력 분립에 기반한 나라 정치 역사의 새 시대로의 전환을 상징했습니다.\n\n헌법 개정은 또한 의회의 역할을 강화하고 의사 결정에서 국가 기관의 중요성을 강조했습니다. 카자흐스탄은 이 길을 따라 더 민주적이고 개방된 사회가 되고자 노력하고 있습니다.\n\n누르술탄 나자르바예프가 초대 대통령 지위에서 물러난 것은 카자흐스탄 역사의 한 장이 끝났음을 뜻하지만, 시민 사회와 정치 제도의 역할이 더 중요해지는 새로운 장의 시작이기도 합니다. 이러한 변화는 나라의 향후 발전에서 통치에 대한 균형 잡힌 접근과 시민의 민주적 참여를 모색하고 있음을 알립니다."
 centralkaz.5.a: "흥미롭군"
 centralkaz.6.t: "시위의 시작"
 centralkaz.6.d: "오늘 카자흐스탄에서 벌어진 사건은 많은 시민을 충격과 불안에 빠뜨렸습니다. 나라에서 시위가 시작되면서 국내외에서 우려가 일고 있습니다. 시민적 입장의 평화로운 표현은 어느 나라에나 중요하지만, 이번에는 문제가 임계점에 이른 것으로 보입니다.\n\n시위의 시작으로 이어진 과거의 사건들은 사회적 불의, 부패, 정치 개혁 문제를 전면에 부각시켰습니다. 카자흐스탄 시민들은 불만을 표출하며 변화를 요구하고 있습니다. 그러나 시위가 나라의 어려운 시기에 벌어지고 있음을 기억하고, 분열 속에서도 평화와 안정을 유지하는 것이 중요합니다.\n\n어쩌면 카자흐스탄은 지금 갈등의 악화를 막고 대화와 갈등 해결의 방안을 찾기 위해 집단안보조약기구(CSTO)의 도움을 구해야 할지도 모릅니다. 국제기구의 협력과 지원은 안정을 회복하고 나라를 개혁과 발전의 길에 올려놓는 데 중요한 역할을 할 수 있습니다."
 centralkaz.6.a: "시위를 폭력적으로 진압한다"
 centralkaz.6.b: "선거를 실시한다"
 centralkaz.7.t: "시위 지속, 카자흐스탄이 CSTO에 지원 요청"
 centralkaz.7.d: "카자흐스탄에서 시위가 계속되고 나라가 집단안보조약기구(CSTO)에 지원을 요청한 것은 심각한 주의와 분석이 필요한 사태입니다. 당국이 갈등을 해결하려 시도했음에도 시위가 계속되고 있으며, 이는 나라 안에 심각한 문제가 있음을 보여 줍니다.\n\n이러한 상황은 위기의 순간에 국제 협력과 지원이 얼마나 중요한지를 강조합니다. 지역의 안보와 안정을 보장하는 데 특화된 국제기구인 CSTO는 갈등을 해결하고 카자흐스탄에 필요한 지원을 제공하는 데 중요한 역할을 할 수 있습니다."
 centralkaz.7.a: "CSTO의 지원을 요청한다"
 centralkaz.7.b: "선거를 실시한다"
 centralkaz.8.t: "카자흐스탄의 지원 요청"
 centralkaz.8.d: "카자흐스탄의 집단안보조약기구(CSTO)에 대한 지원 요청은 국제 사회의 진지한 논의와 분석이 필요한 사건입니다. 이 요청에 대한 우리의 대응은 숙고되고 균형 잡혀야 합니다.\n\n우선 CSTO는 국제기구로서 국가의 주권과 독립을 존중한다는 원칙을 고려해야 합니다. 우리의 대응은 카자흐스탄이 지역의 안정과 평화를 달성하도록 지원하는 것의 중요성을 강조해야 합니다.\n\n그러나 CSTO의 지원이 갈등을 악화시키거나 인권 침해로 이어지지 않도록 해야 합니다. 우리의 대응에는 상황을 감시하고 해결하는 장치와 정부와 야당 간 대화를 촉진하는 방안이 포함되어야 합니다.\n\n카자흐스탄의 요청에 대한 우리의 대응이 갈등 해결과 지역의 평화 및 안정 유지를 위해 협력하고 지원하겠다는 우리의 의지를 강조하는 것이 중요합니다. 우리는 카자흐스탄이 어려움을 극복하고 국민의 안녕을 보장하도록 돕기 위해 국제 규범과 원칙에 따라 행동해야 합니다."
 centralkaz.8.a: "그들을 돕자"
 centralkaz.8.b: "스스로 해결하게 두자"
 centralkaz.9.t: "우리를 돕기로 동의한 [FROM.GetNameWithFlag]"
 centralkaz.9.d: "[FROM.GetNameWithFlag]이(가) 우리나라의 시위를 진압하는 것을 돕기로 동의했습니다."
 centralkaz.9.a: "그들에게 감사한다!"
 centralkaz.10.t: "우리를 돕기를 거절한 [FROM.GetNameWithFlag]"
 centralkaz.10.d: "[FROM.GetNameWithFlag]이(가) 안타깝게도 시위 진압을 돕기를 거절했습니다."
 centralkaz.10.a: "꺼지라고 해라!"
 centralkaz.11.t: "시위 진압을 위한 우리 지원 요청을 수락한 CSTO 회원국"
 centralkaz.11.d: "CSTO 회원국이 카자흐스탄의 시위 진압을 위한 우리의 지원 요청을 수락했습니다."
 centralkaz.11.a: "흥미롭군"
 centralkaz.12.t: "알마티에 도착한 CSTO 병력"
 centralkaz.12.d: "CSTO 병력이 시위 진압을 돕기 위해 알마티에 도착했습니다."
 centralkaz.12.a: "흥미롭군"
 centralkaz.13.t: "시위 종료, 정부가 CSTO 병력과 함께 진압"
 centralkaz.13.d: "카자흐스탄에서 벌어진 사건은 평화적 시위의 권리와 나라의 질서 및 안전을 유지할 필요성 사이의 어려운 균형을 부각시킵니다. 시위의 진압은 사회에 씁쓸한 뒷맛을 남길 수 있으며 당국 조치의 공정성과 적법성에 의문을 제기할 수 있습니다.\n\nCSTO의 개입은 또한 카자흐스탄의 주권과 나라의 내정에 대한 외부 세력의 영향에 의문을 제기합니다. 이는 국가의 이익과 국제적 이익 사이에서 균형을 잡는 것이 얼마나 어려운지를 상기시켜 줍니다.\n\n이제 시위가 끝났으므로, 카자흐스탄은 나라 안팎에서 신뢰를 재건하기 위한 길고 힘든 길을 앞두고 있습니다. 정부가 인권을 존중하며 행동하고 격화된 문제를 해결할 건설적인 방법을 찾으려 노력하는 것이 중요합니다."
 centralkaz.13.a: "흥미롭군"
 centralkaz.14.t: "카자흐스탄의 시위 종료"
 centralkaz.14.d: "카자흐스탄의 시위가 끝났습니다. 우리 병력이 귀환하고 있습니다."
 centralkaz.14.a: "흥미롭군"
 centralkaz.15.t: "귀환한 우리 병력"
 centralkaz.15.d: "우리 병력은 카자흐스탄의 시위를 진압했으며, 시위가 끝난 후 이제 귀환했습니다."
 centralkaz.15.a: "흥미롭군"
 centraluzb.3.t: "안디잔 소요"
 centraluzb.3.d: "오늘은 우즈베키스탄 역사에 지울 수 없는 흔적을 남길 날입니다. 아침에 안디잔 시는 시위의 소리와 변화와 정의를 요구하는 수많은 목소리와 함께 깨어났습니다. 시위는 막 시작되었을 뿐이지만 이미 국민 의지의 강력한 표출이 되었습니다.\n\n주로 청년과 노동자인 시위대는 정치 개혁과 더 나은 생활 조건을 요구하며 거리로 나섰습니다. 그들은 자유와 정의의 구호가 적힌 팻말을 들었고, 목소리는 열정과 희망으로 가득했습니다. 사람들은 변화와 나라의 미래에 영향을 미칠 기회를 원했습니다."
 centraluzb.3.a: "시위를 폭력적으로 진압한다"
 centraluzb.3.b: "민주적 선거를 실시한다"
 centraluzb.4.t: "안디잔 시위 격화"
 centraluzb.4.d: "안디잔의 시위가 격화되었고 당국의 대응은 가혹하고 폭력적이었습니다. 특수부대가 평화적인 시위대에 무력을 사용했으며, 이는 우즈베키스탄 안팎에서 분노의 물결을 일으켰습니다. 평화적 시위는 유혈 충돌로 변했고 많은 이들이 목숨을 잃었습니다."
 centraluzb.4.a: "시위를 폭력적으로 진압한다"
 centraluzb.4.b: "민주적 선거를 실시한다"
 centraluzb.5.t: "안디잔 시위의 결과"
 centraluzb.5.d: "2005년 5월 우즈베키스탄 도시 안디잔에서 벌어진 사건은 우즈베키스탄 역사에 지울 수 없는 흔적을 남겼으며 국제 사회 전반에 널리 반향을 일으켰습니다. 안디잔 소요는 우즈베키스탄 당국에 심각한 도전이었고 사회에 깊은 균열을 일으켰습니다.\n\n안디잔의 시위대는 정치 개혁과 언론의 자유를 요구했지만 당국의 대응은 가혹하고 피비린내 나는 것이었습니다. 대량 총격의 영상과 보도는 국제 언론의 관심을 끌었고 이슬람 카리모프 정권에 대한 광범위한 비난으로 이어졌습니다.\n\n안디잔 소요는 우즈베키스탄에 대화의 필요성과 폭력에 의존하지 않고 사회 문제를 해결하는 것의 중요성을 가르친 교훈이었습니다. 이 사건은 또한 인권과 민주적 가치를 존중하는 것의 중요성을 강조했습니다.\n\n국제 사회에게 안디잔 사건은 인권이 침해되는 지역에서 인권과 민주적 구상을 지원하는 것의 중요성을 부각시켰습니다. 이 사건들은 또한 권위주의 정권이 있는 나라에서 일어나는 사건에 대한 신중한 분석과 대응의 필요성을 드러냈습니다.\n\n안디잔 소요는 비극적인 사건이었지만, 우즈베키스탄뿐 아니라 전 세계 공동체에도 여전히 유효한 중요한 인권 및 민주주의 문제에 대한 관심을 불러일으켰습니다."
 centraluzb.5.a: "슬프군"
 centraluzb.6.t: "이슬람 압두가니예비치 카리모프 사망"
 centraluzb.6.d: "오늘 이슬람 카리모프 대통령이 뇌출혈로 사망했습니다. 우즈베키스탄 공화국의 현 총리인 샤브카트 미로모노비치 미르지요예프가 우즈베키스탄의 대통령이 되었습니다."
 centraluzb.6.a: "슬프군"
 centralkyr.3.t: "미국 공군 기지 마나스"
 centralkyr.3.d: "2001년 9월 11일의 비극적인 사건 이후 세계는 테러의 위협에 직면했고, 이 도전에 대응해 많은 나라가 세계 테러에 맞선 싸움에서 힘을 합쳤습니다. 우리 또한 테러를 격퇴하는 데 도움을 줄 수 있으며 마나스 기지를 위한 영토를 제공할 수 있습니다. 그렇게 하시겠습니까?"
 centralkyr.3.a: "기지를 내주겠다"
 centralkyr.3.b: "테러와는 그들이 스스로 싸우게 두자"
 centralkyr.4.t: "기지를 위한 영토를 제공한 키르기스스탄"
 centralkyr.4.d: "키르기스스탄은 세계 테러에 맞선 싸움에서 우리를 돕기로 결정하고, 우리의 미국 기지 마나스를 수용할 영토를 제공했습니다."
 centralkyr.4.a: "흥미롭군"
 centralkyr.5.t: "미국 공군 기지 마나스"
 centralkyr.5.d: "우리는 미국 마나스 공군 기지를 우리 영토에 유치하기로 결정했습니다. 미국 마나스 공군 기지는 \"항구적 자유 작전(Operation Enduring Freedom)\" 동안 중요한 중심지가 되었으며, 키르기스스탄뿐만 아니라 전체 지역의 안전과 안정성에 중요한 영향을 미쳤습니다. 이 기지는 테러와의 싸움에 대한 공동 노력의 장소이자 아프가니스탄에 대한 인도적 지원을 제공하는 중요한 거점이었습니다."
 centralkyr.5.a: "흥미롭군"
 centralkyr.6.t: "항의하는 지역 주민들"
 centralkyr.6.d: "키르기스스탄 잘랄아바트 주 악시 군 보스피예크 마을의 지역 주민들이 키르기스 영토의 일부(9만 헥타르)를 중국에 넘기는 데 항의하고 있습니다. 이에 대한 우리의 대응은 무엇이어야 합니까?"
 centralkyr.6.a: "땅을 넘기고 시위대에게 발포하라!!!"
 centralkyr.6.b: "좋다, 양보하여 땅을 넘기지 않겠다."
 centralkyr.7.t: "악시 사건"
 centralkyr.7.d: "악시 사건은 2002년 3월 17일 키르기스스탄 잘랄아바트 주 악시 군 보스피예크 마을의 지역 주민들이 키르기스 영토의 일부(9만 헥타르)를 중국에 넘기는 데 항의하며 벌인 시위에 가해진 총격을 가리킵니다."
 centralkyr.7.a: "거리로 나올 이유가 없었다!!!"
 centralkyr.8.t: "튤립 혁명의 시작"
 centralkyr.8.d: "오늘은 튤립 혁명의 시작으로 키르기스스탄 역사에 영원히 기록될 날입니다. 이 날은 나라 구석구석에 영향을 미친 대규모 시위와 시민 행동주의로 특징지어졌습니다.\n\n아스카르 아카예프 대통령이 주민들의 불만을 일으킨 개혁을 승인한 지 며칠이 지났습니다. 처음에는 아무도 이 조치가 나라를 혁명의 문턱으로 몰아넣으리라고 짐작하지 못했습니다. 그러나 변화에 대한 열망으로 하나가 된 청년, 학생, 평범한 시민들이 수도와 다른 도시의 거리로 나섰습니다.\n\n알라투 광장과 비슈케크의 거리에서 민주주의, 공정한 선거, 언론의 자유를 요구하는 구호가 울려 퍼졌습니다. 수천 송이의 튤립은 평화와 더 나은 미래에 대한 희망의 상징이 되었습니다. 며칠 동안 끊임없는 집회와 시위가 이어졌고, 이 격동의 위기는 거대한 혁명이 된 듯합니다."
 centralkyr.8.a: "물러서지 않는다"
 centralkyr.8.b: "야당 인사를 모두 투옥하라"
 centralkyr.8.c: "야당 인사를 모두 사살하라"
 centralkyr.8.d1: "민주적 선거를 실시하라, 우리는 국민을 위한다!"
 centralkyr.9.t: "거리로 나서는 점점 늘어나는 사람들"
 centralkyr.9.d: "키르기스스탄에서 튤립 혁명이 시작된 지 며칠이 지났지만 흥분과 대중의 행동주의는 수그러들지 않았습니다. 키르기스 도시들의 거리는 여전히 국민의 분노와 변화에 대한 갈망을 표출하는 무대로 남아 있습니다.\n\n날마다 더 많은 시민이 최전선에 선 이들의 결의와 연대에 고무되어 거리로 나옵니다. 집회와 대규모 시위는 일상의 필수적인 일부가 되었습니다. 비슈케크의 알라투 광장을 비롯한 공공장소들은 사람들이 불만을 토로하고 변화를 요구하는 활동의 중심지가 되었습니다.\n\n혁명의 상징인 튤립은 어디에나 있습니다. 소녀들의 머리에, 외투 옷깃에, 심지어 자동차에도 달려 있습니다. 이는 더 나은 미래에 대한 희망과 민주주의와 정의에 대한 열망을 나타냅니다."
 centralkyr.9.a: "흥미롭군"
 centralkyr.10.t: "비워진 첫 번째 행정 건물"
 centralkyr.10.d: "키르기스스탄의 혁명 세력은 수그러들지 않았고, 국민은 계속해서 자신의 권리와 민주적 변화를 위해 싸우고 있습니다. 이 운동의 새로운 중요한 이정표는 권력과 통제의 상징이 된 지방 행정 건물의 해방이었습니다.\n\n이 순간은 시민들이 요구와 불만을 표출한 며칠간의 시위와 집회 끝에 찾아왔습니다. 이전에는 평범한 시민이 접근할 수 없던 행정 건물이 이제 그들의 통제 아래 있습니다. 이는 일종의 국민 의지의 승리이자 정부가 국민의 이익에 봉사해야 한다는 상징이었습니다.\n\n행정 건물의 해방은 키르기스 국민의 결의와 연대, 정권 교체와 민주주의 수립을 위해 싸우려는 의지를 강조합니다. 이 순간들에 혁명의 상징인 튤립이 건물과 사람들을 장식하며 모두에게 더 밝은 미래에 대한 희망을 일깨워 줍니다."
 centralkyr.10.a: "Interesting."
 centralkyr.11.t: "아카예프의 초상화를 불태우는 사람들"
 centralkyr.11.d: "혁명의 오케스트라 음악에 맞춰 아카예프의 초상화가 여러 곳에서 수거되어 광장으로 옮겨졌습니다. 그곳에서 타오르는 횃불 앞에서 군중의 환호성 속에 초상화들이 불길 속으로 던져졌습니다. 불길은 전 지도자의 모습을 집어삼켰고, 이 생생한 광경은 과거와의 최종적인 단절의 상징이 되었습니다.\n\n아카예프의 초상화를 불태우는 이 행위는 오랫동안 나라를 뒤덮어 온 권위주의와 부패에서 벗어나겠다는 국민의 결의를 상징합니다. 이는 권력이 독재를 구현하는 대신 국민의 이익에 봉사하는 새로운 시작에 대한 희망을 말해 줍니다. 이는 키르기스 국민의 기억 속에 나라의 새 시대가 열린 상징으로 남을 행위입니다."
 centralkyr.11.a: "흥미롭군"
 centralkyr.12.t: "막바지에 이른 혁명과 해방된 내각"
 centralkyr.12.d: "키르기스스탄의 혁명은 최종 단계에 접어들었고 변화에 대한 희망은 점점 더 분명해졌습니다. 이 운동의 중요한 순간은 오랫동안 기다려 온 권위주의 정권의 종식을 상징하는 각료 내각의 해방이었습니다.\n\n몇 달간의 대규모 시위와 시민 불복종 끝에, 내각 건물에서 전직 관리들과 법 위반 및 국민의 신뢰 훼손으로 이어진 행태가 일소되었습니다. 이 순간은 부패와 권위주의에 대한 국민의 승리를 상징했습니다.\n\n이전에는 오로지 정권의 이익에만 봉사하던 건물이 이제 민주주의 정신에 따라 키르기스스탄의 미래를 논의하고 만들어 갈 수 있는 자유로운 공간이 되었습니다. 혁명의 상징인 튤립이 일대를 장식하며 이 중요한 순간과 함께 찾아온 희망과 자유를 일깨워 줍니다."
 centralkyr.12.a: "흥미롭군"
 centralkyr.13.t: "혁명 종료, 조기 대통령 선거"
 centralkyr.13.d: "몇 달간의 정치적 격변과 대규모 시위 끝에, 키르기스스탄의 튤립 혁명은 임시 대통령 선거의 실시와 함께 결말을 맞았습니다. 이 날은 나라의 민주적 변화를 위한 오랜 투쟁의 종결을 상징했습니다.\n\n선거는 키르기스스탄의 새로운 미래를 규정하는 기대된 역사적 순간이었습니다. 광범위한 정당과 후보가 참여했지만, 쿠르만벡 바키예프가 국민의 가장 큰 지지를 받았습니다. 그의 승리는 결정적이었고, 나라의 변화와 안정을 보고자 하는 국민의 염원을 표현한 것이었습니다.\n\n선거 결과는 새로운 통치에 대한 희망과 민주주의에 대한 열망을 반영했습니다. 키르기스스탄은 바키예프에게서 새로운 지도자를 찾았으며, 이제 안정 회복, 부패 척결, 민주적 제도 발전이라는 복잡한 과제에 직면했습니다.\n\n이 순간은 한 시대의 종말이자 키르기스스탄 역사의 새로운 장의 시작을 알렸으며, 더 나은 미래에 대한 희망과 민주주의에 대한 열망은 여전히 살아 있고 강건했습니다."
 centralkyr.13.a: "새로운 시대다!"
 centralkyr.14.t: "4월 혁명의 시작"
 centralkyr.14.d: "역사적인 4월 혁명이 오늘 키르기스스탄에서 시작되어 변화를 바라는 국민의 염원에 대한 평화로운 메시지를 전했습니다. 수천 명의 시민이 수도 비슈케크의 알라투 광장에 모여 권위주의 정권에 항의했습니다. 이 날의 사건들은 키르기스스탄 역사에서 중요한 지점을 이룹니다.\n\n시위대는 정의, 민주주의, 인권 존중을 요구했습니다. 거리에는 긴장이 감돌았지만 더 나은 미래에 대한 희망도 있었습니다. 의회와 정부가 주목의 중심에 섰고, 사람들은 그들의 사임을 요구했습니다.\n\n자발적으로 조직된 민간 자경단이 도시를 순찰하며 질서와 안전을 보장했습니다. 평화적인 행동은 기도와 노래를 동반했으며, 이는 변화를 일으키려는 키르기스 국민의 결의를 상징했습니다.\n\n키르기스스탄에서 4월 혁명의 시작은 시민 참여와 단결의 힘이 나라에 변화를 가져올 수 있음을 보여 주었습니다. 이 사건은 키르기스스탄 역사에 새 시대를 열어 준 큰 정치적 변화의 출발점이었습니다."
 centralkyr.14.a: "물러서지 않는다"
 centralkyr.14.b: "야당 인사를 모두 투옥하라"
 centralkyr.14.c: "야당 인사를 모두 사살하라"
 centralkyr.14.d1: "민주적 선거를 실시하라, 우리는 국민을 위한다!"
 centralkyr.15.t: "바키예프의 초상화를 불태우는 사람들"
 centralkyr.15.d: "쿠르만베크 바키예프 대통령의 권위주의적 통치에 대한 민중의 불만이 정점에 달한 키르기스스탄 역사의 순간입니다. 충격적인 상징적 항의 행위로, 수천 명의 시민이 지도자의 초상화를 들고 거리로 나와 이를 불길 속에 태웠습니다.\n\n이 사건은 장기간에 걸친 정치적 불안정, 경제 악화, 그리고 바키예프 정부의 부패 의혹 끝에 일어났습니다. 국민은 자신들의 이익과 권리가 체계적으로 무시당해 왔다고 느꼈고, 분노와 절망을 표출하기로 결심했습니다. 바키예프의 초상화를 불태운 것은 그의 권력으로부터의 상징적 해방 행위였습니다."
 centralkyr.15.a: "흥미롭군"
 centralkyr.16.t: "장갑차를 탈취한 국민"
 centralkyr.16.d: "항의라는 공동의 목표로 뭉친 국민은 정부 권위와 힘의 상징이던 장갑차(APC)를 장악하는 데 성공했습니다. 이 행위는 시위대의 결의와 단결을 분명하게 보여 준 것이었습니다. 국민은 평소 정부가 시위를 진압하는 데 쓰던 군사 장비를 말 그대로 해방시켜 자신들의 힘과 결의의 상징으로 바꾸어 놓았습니다. 장갑차 탈취는 국가 내 권력 관계의 변화를 알리는 강력한 신호였으며, 국민에게 자신들의 이익을 위해 변화를 이끌어 낼 수 있다는 확신을 주었습니다."
 centralkyr.16.a: "흥미롭군"
 centralkyr.17.t: "아카예프의 초상화를 불태운 국민"
 centralkyr.17.d: "혁명의 오케스트라 선율 속에서 아카예프의 초상화가 여러 곳에서 수거되어 광장으로 옮겨졌습니다. 그곳에서 타오르는 횃불 앞에서 군중의 환호성과 함께 초상화는 불길 속에 던져졌습니다. 불꽃은 전임 지도자의 모습을 삼켰고, 이 생생한 광경은 과거와의 완전한 단절을 상징하게 되었습니다.\n\n아카예프의 초상화를 불태운 이 행위는 오랫동안 나라를 뒤덮어 온 권위주의와 부패에서 벗어나겠다는 국민의 결의를 집약합니다. 이는 권력이 독재를 상징하는 대신 국민의 이익에 봉사하는 새로운 시작에 대한 희망을 말해 줍니다. 이 행위는 키르기스 국민의 기억 속에 자국의 새로운 시대가 시작된 상징으로 남을 것입니다."
 centralkyr.17.a: "흥미롭군"
 centralkyr.18.t: "비슈케크에 있는 키르기스스탄 대통령 쿠르만베크 바키예프 저택의 약탈"
 centralkyr.18.d: "국민이 쿠르만베크 바키예프의 권위주의 정권에 항의한 4월 혁명이 발발한 뒤, 많은 시민이 분노와 불만은 물론 권리를 박탈당했다는 감정과 당국의 부패에 대한 감정을 표출했습니다.\n\n대통령 저택의 약탈은 민중의 거부와 복수를 상징하는 행위였습니다. 약탈자들은 이 행동을 수년간의 부당한 통치에 대한 보복으로 여겼을지도 모릅니다. 사건을 둘러싼 불길과 혼란은 정부와 시민 사이의 깊은 분열을 부각시켰습니다.\n\n이 사건은 또한 감정과 민중의 불만이 때때로 통제 불능으로 치닫기도 하는 혁명 운동의 복잡성과 예측 불가능성을 보여 주었습니다. 이는 변화를 위해 싸우는 국민의 끈기를 상기시켰으며, 키르기스스탄의 미래와 국가 안정을 위한 장기적 해법 모색의 필요성에 대한 중요한 의문을 제기했습니다."
 centralkyr.18.a: "흥미롭군"
 centralkyr.19.t: "혁명의 종결과 키르기스스탄 과도 대통령으로 임명된 로자 오툰바예바"
 centralkyr.19.d: "이는 쿠르만베크 바키예프 대통령의 몰락으로 이어진 불안정과 대규모 시위의 시기를 지난 키르기스스탄 역사의 중요한 전환점입니다.\n\n경험 많은 정치인이자 외교관인 로자 오툰바예바는 국가에 안정을 가져오고 질서를 회복하는 핵심적인 과도기 역할을 맡도록 선출되었습니다. 그녀의 임명은 정치적 변화의 필요성과 민주적 통치 원칙으로의 복귀에 관한 중요한 메시지를 전했습니다.\n\n이는 또한 키르기스스탄에서 여성의 정치 참여가 갖는 중요성과, 평화와 새로운 정치 질서로의 이행 과정에서 여성이 핵심적인 역할을 할 수 있는 능력을 강조했습니다. 로자 오툰바예바는 중앙아시아 최초의 여성 대통령이 되었으며, 인권과 민주주의, 사회 정의에 대한 존중에 기반한 미래에 대한 희망을 키웠습니다.\n\n이 사건은 혁명적 변화의 시기에서 키르기스스탄의 새로운 통치 구조와 민주 사회를 건설하는 과정으로 넘어가는 이행을 나타냅니다."
 centralkyr.19.a: "선거 때까지 로자를 임시 대통령으로 유지한다"
 centralkyr.19.b: "로자가 예정보다 일찍 대통령이 된다"
 centralkyr.20.t: "아탐바예프의 압승으로 끝난 임시 대통령 선거"
 centralkyr.20.d: "조기 대통령 선거는 민주적 변화를 향해 나아가겠다는 국민의 결의를 반영한 키르기스스탄 정치사의 중요한 순간이었습니다. 이 선거는 국민에게 지도자를 자유롭게 선택할 기회를 주었으며, 그 결과는 국민의 의지를 분명히 표현한 것이었습니다.\n\n뛰어난 정치인이자 야당 지도자인 아탐바예프는 압도적인 과반수로 승리했습니다. 그의 승리는 국민의 신뢰와 지지를 반영한 것으로 인정받았습니다. 그에게는 과도기 동안 국가를 이끌고 키르기스스탄을 안정, 민주주의, 발전의 길로 되돌려 놓을 임무가 맡겨졌습니다."
 centralkyr.20.a: "새로운 시대다!"
 centralkyr.21.t: "제3차 혁명의 시작"
 centralkyr.21.d: "2020년 10월의 키르기스스탄은 변화의 새로운 시대를 목격했습니다. 오늘 이 나라의 역사는 앞으로 수 세기 동안 기억될 새로운 장을 쓰기 시작했습니다. 분출한 대규모 시위와 사회 불안은 키르기스스탄 제3차 혁명의 시작이었습니다.\n\n수천 명의 시민이 수도와 다른 도시의 거리에 모여 변화를 요구하면서 나라의 정세는 불안정해졌습니다. 시위대의 주요 요구는 부패와의 싸움, 정부 체제의 민주화, 그리고 경제 상황의 개선이었습니다.\n\n다양한 계층의 젊은 세대와 활동가들이 이 혁명을 이끌었으며, 소셜 미디어와 여러 소통 수단을 활용해 활동을 조율했습니다. 그들은 자유와 정의의 구호 아래 자신들의 미래를 위해 싸울 준비가 되어 있습니다."
 centralkyr.21.a: "우리는 물러서지 않는다"
 centralkyr.21.b: "야당 인사들을 모두 투옥한다"
 centralkyr.21.c: "야당 인사들을 모두 총살한다"
 centralkyr.21.d1: "민주적 선거를 실시한다. 우리는 국민을 위한다!"
 centralkyr.22.t: "비슈케크 조고르쿠 케네시 건물 정문을 부순 시위대"
 centralkyr.22.d: "주로 젊은 시민들로 이루어진 시위대가 키르기스스탄 의회인 조고르쿠 케네시 앞에 모여 변화와 자신들의 요구에 대한 답변을 촉구했습니다.\n\n갑자기 분위기가 더 긴장되었고 공기 중에 흥분이 느껴졌습니다. 정부의 눈에 띄는 변화가 없는 데 분노한 시위대 무리가 의회 정문을 부수기 시작했습니다. 이러한 상황은 도시의 긴장과 불안을 고조시켰습니다.\n\n시민들의 이러한 행동은 깊은 불만과 그들이 보고자 하는 오랫동안 기다려 온 변화를 나타냅니다. 이 행동의 결과가 어떠할지는 시간이 말해 주겠지만, 시위대가 굴하지 않고 자신들의 권리와 이상을 위해 계속 싸우겠다는 결의를 분명히 보여 주었습니다."
 centralkyr.22.a: "흥미롭군"
 centralkyr.23.t: "조고르쿠 케네시 점거를 축하하는 시위대"
 centralkyr.23.d: "키르기스스탄의 제3차 혁명이 새로운 정점에 이르면서 비슈케크는 변화의 시대가 계속되는 것을 목격했습니다. 분노와 결의에 찬 시위대는 흥분과 변화에 대한 열망에 사로잡혀 조고르쿠 케네시 건물을 점거했을 뿐 아니라 의회 앞에서 자신들의 성과를 축하하기까지 했습니다.\n\n웅장한 의회 건물 앞에는 희망과 자유의 불꽃이 타오르는 수많은 모닥불이 있었습니다. 시민 군중은 이 모닥불 주위에 모여 불길을 하늘 높이 피워 올리며 자신들의 정신과 결의를 상징했습니다.\n\n밤은 변화를 향한 열망으로 하나가 된 국민의 일종의 축제로 변했습니다. 청년, 활동가, 평범한 시민들은 자신들의 행동과 결의가 부패와 불관용에서 자유로운 새로운 미래의 길을 열 것임을 알고 희망과 꿈을 나누었습니다. 의회 앞에서의 이 축하의 순간은 조국의 정의와 민주주의를 위해 싸우겠다는 키르기스 국민의 흔들리지 않는 결의를 상징했습니다."
 centralkyr.23.a: "흥미롭군"
 centralkyr.24.t: "대통령 집무실의 시위대"
 centralkyr.24.d: "대규모 시위의 물결과 변화에 대한 열망에 이어, 비슈케크의 시위대는 현 정치 체제에 대한 항의와 불만을 상징하기 위해 대통령 집무실을 습격하기로 결정했습니다. 제3차 혁명의 기념비적인 이 순간, 오늘 그들은 현직 대통령 소오론바이 샤리포비치 젱베코프의 초상화가 걸려 있던 대통령 집무실을 습격했습니다.\n\n귀를 멍하게 하는 소음과 흥분이 방을 가득 채운 가운데, 시위대는 파괴적인 결의로 대통령의 초상화를 벽에서 떼어 내 찢기 시작했습니다. 이 행위는 현 지도자에 대한 불만뿐 아니라 조국의 변화와 새로운 미래를 보고자 하는 국민의 열망을 상징했습니다."
 centralkyr.24.a: "흥미롭군"
 centralkyr.25.t: "혁명의 종결과 조기 대통령 선거 실시"
 centralkyr.25.d: "수일간의 격렬한 시위와 대규모 집회, 정치적 변화 끝에 키르기스스탄은 마침내 민주적 미래로 가는 길을 찾았습니다. 2020년에 시작된 사건들은 오랫동안 기다려 온 변화에 승리를 가져다준 임시 대통령 선거와 함께 정점에 달했습니다.\n\n이번 선거에서 수백만 키르기스 국민이 자신들의 의지를 표명했으며, 결과는 명백했습니다. 민주주의와 반부패의 이상을 상징하는 후보인 사디르 자파로프가 압승을 거두었습니다. 그의 당선은 변화와 민주적 개혁을 바라던 많은 시민의 목소리를 반영했습니다.\n\n새 대통령은 엄청난 변화와 부패 척결을 약속하며 취임했습니다. 또한 이는 시민 참여와 민주주의 추구가 국가에 긍정적인 변화를 가져올 수 있다는 상징이기도 했습니다. 키르기스스탄은 희망과 밝은 미래에 대한 기대로 가득 찬 새로운 역사의 장을 엽니다."
 centralkyr.25.a: "새로운 시대다!"
 centralkyr.26.t: "야당 인사 전원 체포"
 centralkyr.26.d: "오늘 수도의 혁명 운동은 핵심 인물 전원이 체포되어 사회에서 격리되면서 갑자기 잠잠해졌습니다. 야권에 대한 이 갑작스러운 탄압은 국내에 혼란을 일으켰고 변화에 대한 희망은 좌절되었습니다. 당국은 반체제 인사들에게 강경한 반대 입장을 보였고, 대화와 평화적 운동의 여지를 거의 남기지 않았습니다."
 centralkyr.26.a: "폭동을 일으킬 이유가 없었다!"
 centralkyr.27.t: "야당 인사 전원 총살"
 centralkyr.27.d: "오늘 수도의 혁명 운동은 당국이 야권 성향 시민들에 대한 집단 총살에 의존하면서 극도의 잔혹함으로 진압되었습니다. 이 비극적인 사태의 전개는 국내외에서 깊은 혐오와 분노를 불러일으켰습니다. 이 탄압은 비참한 결과를 낳았고 기본적 인권과 도덕적 가치에 대한 존중이라는 문제를 제기했습니다."
 centralkyr.27.a: "폭동을 일으킬 이유가 없었다!"
 centralkyr.28.t: "또 한 번의 대통령 선거"
 centralkyr.28.d: "키르기스스탄의 또 한 번의 대통령 선거는 경험 많고 저명한 두 정치인, 소오론바이 젱베코프와 알마즈벡 아탐바예프를 내세워 국가에 중요한 결정을 요구합니다. 이 선택은 나라의 미래에 결정적이며 키르기스 사회가 직면한 복잡한 정치적 딜레마를 반영합니다.\n\n소오론바이 젱베코프와 알마즈벡 아탐바예프는 모두 풍부한 정치 경험을 지닌 국민적 인물입니다. 두 사람은 각자 키르기스스탄의 미래에 대한 자신의 비전을 대표하며 지지자들을 거느리고 있습니다.\n\n두 사람 사이의 선택은 정치 과정에 흔히 따르는 안정과 변화 사이의 변증법을 반영합니다. 이 선택은 키르기스스탄의 발전에 중요한 걸음이 될 것이며 미래의 진로를 결정할 것입니다."
 centralkyr.28.a: "소오론바이 젱베코프, 우리의 선택!"
 centralkyr.28.b: "현직 대통령을 유지한다."
 centralinvestments.1.t: "대통령 방문"
 centralinvestments.1.d: "대통령은 국제 관계를 강화하고 경제 협력을 발전시키기 위해 다른 나라를 방문하기로 결정했습니다. 대통령은 일자리 창출과 경제 발전에 도움이 되는 이 나라에 투자할 의사를 표명했습니다. 투자하기에 가장 유망한 나라는 어디입니까?"
 centralinvestments.1.a: "첫 번째 제안"
 centralinvestments.1.b: "두 번째 제안"
 centralinvestments.1.c: "세 번째 제안"
 centralinvestments.1.d1: "아무도 없다!"
 CES_russian_debt_negotiations: "러시아 부채 협상"
 CES_russian_debt_negotiations_desc: "러시아 부채 협상은 우리와 러시아 양측 모두에게 매우 유익할 수 있습니다."
 CES_western_invest_negotiations: "서방에 투자 요청"
 CES_western_invest_negotiations_desc: "서방 국가들은 우리가 매력적인 조건을 제시한다면 우리에게 투자하는 것을 고려할 수도 있습니다."
 CES_econ_Partnership: "러시아와의 경제 동반자 관계"
 CES_econ_Partnership_desc: "최근 몇 년간 우리나라와 러시아는 다양한 분야에서 무역 관계와 협력을 계속 발전시켜 왔습니다."
 CES_asking_money: "영국에 자금 요청"
 CES_asking_money_desc: "이 자금은 우리나라를 강화하기 위한 몇 가지 핵심 사업에 사용될 것입니다."
 CES_our_stance: "우리의 입장"
 CES_our_stance_desc: "우리는 우리나라가 세계 무대에서 적극적인 위치를 차지하여 글로벌 문제 해결과 평화 및 안정 유지에 기여하기를 추구합니다."
 CES_indian_diplomacy: "인도 외교"
 CES_indian_diplomacy_desc: "인도는 세계에서 가장 큰 경제 대국이자 국가 중 하나입니다. 인도와의 협력은 우리에게 거대한 시장과 무역 및 투자의 잠재력에 대한 접근권을 주며, 이는 우리 경제의 성장에 기여합니다."
 CES_enter_act_east: "동방과의 협력"
 CES_enter_act_east_desc: "동방 국가들은 거대한 시장이자 투자의 원천입니다. 이들과의 협력은 우리 경제 성장과 발전을 위한 새로운 기회를 열어 주고 무역 및 투자 관계를 확대합니다."
 CES_indian_protection: "인도의 보호"
 CES_indian_protection_desc: "인도는 지역과 세계에서 크고 영향력 있는 나라입니다. 인도와의 동반자 관계를 유지하는 것은 지역의 안정과 안보에 기여하며, 이는 우리 국가 안보의 중요한 요소입니다."
 CES_central_asian_union: "중앙아시아 연합"
 CES_central_asian_union_desc: "중앙아시아는 천연자원과 문화유산이 풍부한 독특한 지역입니다. 연합의 창설은 지역 국가들이 협력을 강화하고 자원을 최대한 활용할 수 있게 해 줄 것입니다."
 CES_individual_trade_partner: "개별 무역 파트너"
 CES_individual_trade_partner_desc: "중앙아시아 지역의 각 나라는 고유한 자원과 특성, 잠재력을 지니고 있습니다. 개별 무역 파트너를 찾으면 이러한 자원을 최대한 활용하고 상호 이익이 되는 재화 및 서비스 교환을 위한 조건을 조성할 수 있습니다."
 CES_russian_military_bases: "러시아 군사 기지"
 CES_russian_military_bases_desc: "러시아와의 협력은 오랜 역사를 지니고 있으며 상호 존중과 신뢰에 기반합니다. 우리 영토 내 러시아 군사 기지는 전략적 관계 강화에 기여하고 공동 안보를 보장합니다."
 CES_partner_cis_un: "CIS와의 동반자 관계"
 CES_partner_cis_un_desc: "CIS는 경제, 안보, 교육, 문화를 포함한 다양한 분야에서 협력하는 플랫폼입니다."
 CES_full_eaeu_integr: "EAEU로의 완전한 통합"
 CES_full_eaeu_integr_desc: "EAEU는 역내에서 재화, 서비스, 자본, 노동의 자유로운 이동을 보장합니다. 이는 경제 성장, 기업 활동, 일자리 창출에 기여합니다."
 CES_entering_CSTO: "CSTO의 보장"
 CES_entering_CSTO_desc: "CSTO는 위협이 발생할 경우 군사적 지원과 연대를 보장하며, 지역 안정의 중요성을 강조합니다."
 CES_china_ties_un: "중국과의 연계"
 CES_china_ties_un_desc: "중국은 세계에서 가장 큰 경제 대국 중 하나입니다. 중국과의 협력은 우리에게 거대한 시장과 투자에 대한 접근권을 주며, 이는 우리 경제의 발전에 기여합니다."
 CES_chinese_agreement: "중국과의 협정"
 CES_chinese_agreement_desc: "중국과의 무역 협정은 관세 및 비관세 장벽을 줄이는 데 도움이 되어 상호 무역을 촉진하고 투자를 장려합니다."
 CES_ask_china_protect: "중국에 보호 요청"
 CES_ask_china_protect_desc: "중국은 이제 우리와 공통점이 많습니다. 그들은 우리에게도 보호를 확대해 주어야 합니다."
 CES_eu_kazuz: "EU와의 동반자 관계"
 CES_eu_kazuz_desc: "EU는 우리와 비교적 멀리 떨어져 있지만, 그들의 모델은 매우 매력적이며 우리는 이를 따라야 합니다."
 CES_korean_pact_trade: "한국과의 무역 협정"
 CES_korean_pact_trade_desc: "대한민국은 동방에서 가장 번영한 민주주의 국가 중 하나입니다. 우리는 이들과의 무역을 늘려야 합니다."
 CES_entering_nato: "미국의 보장"
 CES_entering_nato_desc: "나토가 우리 지역을 포괄하고 있지는 않지만, 서방에 우리를 받아들여 달라고 요청해 볼 수도 있습니다."
 jihad.1.t: "상호 군사 협력"
 jihad.1.d: "중앙아시아의 외교관들이 이슬람 혁명의 이름으로 공동의 목표를 달성하기 위한 군사 협력을 제안하고 있습니다. 이러한 협력은 우리가 세계 무대에서 입지를 강화할 수 있게 해 줄 것입니다."
 jihad.1.a: "이러한 협력이 성공의 열쇠이다"
 jihad.1.b: "우리는 스스로를 지킬 수 있다. 탈레반에게는 도움이 필요 없다."
 CES_revolution_1_tt: "§Y우리가 물러서지 않으면 대통령은 야당에 의해 전복될 것이며, 다음 혁명도 머지않아 일어날 것입니다.§!\n\n"
 CES_revolution_2_tt: "§Y야당 인사를 모두 투옥하면 현 대통령을 유지하게 됩니다.§!\n\n"
 CES_revolution_3_tt: "§Y야당 인사를 모두 총살하면 현 대통령을 유지하게 되며 다음 혁명은 일어나지 않습니다.§!\n\n"
 CES_revolution_4_tt: "§Y민주적 선거를 실시하면 민주적인 대통령이 들어서므로 우리나라에서 더 이상 혁명이 일어나지 않습니다.§!\n\n"
 gla_forces_tt: "§YGLA 군대를 편성합니다§!"
 chechenskaya_machina_tt: "체첸에서 이슬람 반란을 일으킵니다"
 imamat_turkestan: "튀르키스탄 이맘국"
 jihad.2.t: "탈레반과 재결합하는 법"
 jihad.2.d: "탈레반은 정치적으로나 종교적으로 우리와 매우 가까운 관계에 있으므로, 우리가 어떻게 최종적으로 국가를 재통합할지를 결정해야 합니다. 만약 그들의 정부가 평화적으로 재통합을 원하지 않는다면, 우리는 우리의 방법을 사용할 수 있습니다. 그러나 외교적 방법을 선택하지 않고, 세계에 진정한 지역 강국이 누구인지 보여줄 수 있습니다."
 jihad.2.a: "우리는 사람과 장비를 낭비하기 전에 그들이 어떻게 반응하는지 지켜봐야 한다고 생각한다."
 jihad.2.b: "외교? 하! 개소리 하지마라 외교는 교활한 세속 세계의 그림자일 뿐이야!"
 jihad.3.t: "우리나라들의 재통합 제안"
 jihad.3.d: "이념적으로 종교적으로 연결되어 있고 이슬람 국가 건설이라는 공동의 목표를 가진 우리는 이 꿈에 한 걸음 더 다가갈 기회를 제안받았습니다. 그들의 정부는 오해가 생길 경우 엇갈린 반응이 뒤따를 수 있다고 우리에게 넌지시 암시했습니다"
 jihad.3.a: "우리는 함께 세속 세계를 무너뜨릴 것이다!"
 jihad.3.b: "복종? 여기서 권력의 중심은 우리이지 너희가 아니다!"
 CES_main_enemies_of_islamism: "중앙아시아 반란"
 CES_commie_start: "붉은 길"
 CES_commie_start_desc: "우리나라는 소비에트 권력의 시대를 잊을 틈이 없었으며, 이제 다시 한번 그곳으로 돌아갑니다."
 CES_bring_soviet: "소비에트의 권력 복원"
 CES_bring_soviet_desc: "우리가 80년 동안 성공적으로 살아온 통치 체제를 복원할 때입니다."
 CES_promote_ideology: "공산주의 선전"
 CES_promote_ideology_desc: "우리는 다시 한번 국민에게 공산주의의 힘을 설득해야 합니다."
 CES_free_the_people: "자본주의의 사슬을 타도하라"
 CES_free_the_people_desc: "국민은 자본가와 부르주아의 노예가 되는 데 지쳤습니다."
 CES_central_plan: "5개년 계획으로의 복귀"
 CES_central_plan_desc: "5개년 계획 체제가 우리 국가에서 다시 작동할 것입니다."
 CES_work_unions: "노동조합에 권력 반환"
 CES_work_unions_desc: "노동자는 보호받아야 합니다!"
 CES_soviet_nostalgia: "소비에트 시절에 대한 향수"
 CES_soviet_nostalgia_desc: "향수는 우리 권력을 강화하는 최고의 동기입니다."
 CES_forceful_unific: "무력으로 공산주의 확산"
 CES_forceful_unific_desc: "평화적 방법은 더 이상 통하지 않습니다. 우리는 힘으로 행동할 것입니다."
 CES_peaceful_unific: "평화적 통합"
 CES_peaceful_unific_desc: "우리는 목표를 달성하기 위해 외교적 방법을 사용합니다."
 CES_chinese_model: "중국식 경제 모델"
 CES_chinese_model_desc: "중국의 국가 발전 경험은 우리에게 매우 유용할 것입니다."
 CES_support_afghan_guys: "아프가니스탄 형제들 지원"
 CES_support_afghan_guys_desc: "아프가니스탄 민중은 자유로워질 것입니다!"
 CES_communist_education: "무상 교육"
 CES_communist_education_desc: "우리나라의 모든 시민은 무상 교육을 받을 권리가 있습니다."
 CES_anti_religion: "무신론 선전"
 CES_anti_religion_desc: "우리는 사회를 중독시키는 도구인 종교와 맞서 싸울 것입니다."
 CES_communist_militias: "인민 민병대"
 CES_communist_militias_desc: "우리 시민들은 기꺼이 민병대의 대열에 입대할 것입니다!"
 CES_ca_union_sov: "중앙아시아 소비에트 사회주의 공화국"
 CES_ca_union_sov_desc: "중앙아시아의 공산주의 인민 만세!"
 CES_state_business_ventures: "국영 사업"
 CES_state_business_ventures_desc: "우리 국가는 자체적인 수입 창출 수단을 갖출 필요가 있습니다."
 CES_western_opposition_idea: "민주주의 야당"
 CES_western_opposition_idea_desc: "민주주의 야당은 국내에서 끊임없이 성장하고 있으며 색깔 혁명을 준비하고 있습니다."
 CES_political_instability_idea: "불안정한 정치"
 CES_political_instability_idea_desc: "우리의 정치는 불안정하며 때때로 시위가 일어납니다."
 CES_political_instability_less_idea: "정치적 불안정 감소"
 CES_political_instability_less_idea_desc: "우리의 정치는 불안정하며 때때로 시위가 일어납니다."
 CES_family_in_politics: "정치 속의 가족"
 CES_family_in_politics_desc: "우리 지도자의 가족 구성원들이 정부의 핵심 직책을 차지하고 있습니다."
 CES_jihadism: "중앙아시아의 지하디즘"
 CES_independent_politics: "독립적인 정치 직위"
 CES_independent_politics_desc: "우리 정부의 정치 직위는 지도자와의 개인적 인맥과 무관하게 수여됩니다."
 centrasiaev.11.t: "정치 속의 가족"
 centrasiaev.11.d: "현재 우리 정부는 지도자를 중심으로 돌아가고 있습니다. 이를 그의 가족 구성원들을 중심으로 중앙집권화해야 합니까, 아니면 독립적으로 놔두어야 합니까? 두 선택 모두 장단점이 있습니다."
 centrasiaev.11.a: "내 친구들을 의회에 앉히고, 나라의 자원을 친척들에게 나눠 준다."
 centrasiaev.11.b: "기술 관료를 들여오는 게 어떨까? 충성스럽지는 않지만..."
 centrasiaev.12.a: "행정 분야 제안을 살펴보자..."
 centrasiaev.12.b: "치안 분야 제안을 살펴보자..."
 centrasiaev.12.c: "군사 분야 제안을 살펴보자..."
 centrasiaev.12.t: "부패 딜레마"
 centrasiaev.12.d: "우리 내각의 일부 정치 인사들이 귀하에게 부패한 제안을 하려고 준비하고 있습니다. 일반적인 부패 스캔들과 달리, 이번 제안은 실제로 우리에게 이로울 수도 있습니다."
 centrasiaev.13.t: "[ROOT.GetName]와(과) 유네스코의 협력"
 centrasiaev.13.d: "중앙아시아 국가들은 유네스코와 협력적 동반자 관계를 구축하여, 풍부한 문화유산, 천연자원, 교육 체계의 보존과 증진을 우선시하는 견고한 동맹을 형성했습니다. 이들은 함께 역사 유적 보호, 포용적 교육 증진, 지역 협력 강화라는 공동의 목표를 위해 노력합니다. 이 동맹은 중앙아시아 국가들 사이의 유대를 강화할 뿐 아니라, 이 지역의 평화, 문화적 다양성, 지속 가능한 발전을 촉진한다는 유네스코의 사명에 대한 이들의 헌신을 강조합니다."
 centrasiaev.13.a: "좋아"
 centralmigration.1.t: "이주 통제 성공"
 centralmigration.1.d: "성공적인 이주 관리는 안정과 통제를 가져옵니다. 시행된 조치와 노력은 이주민 유입의 효과적인 규제로 이어졌고 우호적인 환경을 조성했습니다."
 centralmigration.1.a: "매우 좋다!"
 centralmigration.2.t: "이주 통제 실패"
 centralmigration.2.d: "우리의 시도에도 불구하고 이주 흐름을 관리하는 데 어려움이 생겼고, 이 분야에는 해결되지 않은 문제가 남게 되었습니다."
 centralmigration.2.a: "슬프군"
 centralcity.1.t: "수도 이름 변경"
 centralcity.1.d: "오늘 우리는 수도의 이름을 이전보다 더 현대적인 이름으로 바꿀 기회를 얻었습니다. 이 중 어느 것이 우리의 관심을 끌겠습니까?"
 centralcity.1.a: "누르술탄!"
 centralcity.1.b: "아크몰린스크, 우리는 옛 소비에트식 이름에 찬성한다!"
 centralcity.1.c: "아스타나, 현재 이름을 유지하자!"
 centralcity.2.t: "수도 이름 변경"
 centralcity.2.d: "오늘 우리는 수도의 이름을 이전보다 더 현대적인 이름으로 바꿀 기회를 얻었습니다. 이 중 어느 것이 우리의 관심을 끌겠습니까?"
 centralcity.2.a: "우즈베크그라드!"
 centralcity.2.b: "차치켄트, 우리는 옛 이름에 찬성한다!"
 centralcity.2.c: "타슈켄트, 현재 이름을 유지하자!"
 centralcity.3.t: "수도 이름 변경"
 centralcity.3.d: "오늘 우리는 수도의 이름을 이전보다 더 현대적인 이름으로 바꿀 기회를 얻었습니다. 이 중 어느 것이 우리의 관심을 끌겠습니까?"
 centralcity.3.a: "키르기즈그라드!"
 centralcity.3.b: "프룬제, 우리는 옛 소비에트식 이름에 찬성한다!"
 centralcity.3.c: "비슈케크, 현재 이름을 유지하자!"
 CES_red_zaraza: "중앙아시아의 사회주의"
 CES_red_zaraza_desc: "붉은 깃발이 중앙아시아에서 다시 올라가고 있습니다. 사회주의 경제의 과거 경험은 이 지역 지도자들의 일을 수월하게 해 줍니다. 이미 이루어진 일을 성공적으로 되풀이하기만 하면 되기 때문입니다."
 CES_border_reform_idea: "국경 개혁"
 CES_peaceful_prowestern_idea: "친서방 노선"
 CES_changing_the_course_idea: "중립의 길"
 CES_peaceful_eastern_idea: "친동방 입장"
 CES_promote_nostalgia: "향수 고취"
 CES_promote_nostalgia_desc: "공산주의에 대한 향수는 과거의 이상으로 돌아가고 잃어버린 가치를 되찾자는 개념입니다. 자본주의와 개인주의가 사회의 주요 문제로 여겨지는 오늘날의 세계에서, 공산주의에 대한 향수를 고취하는 것은 많은 사람에게 특히 매력적일 수 있습니다."
 CES_corruption_dilemma: "부패 딜레마"
 CES_corruption_dilemma_desc: "우리 내각의 일부 정치 인사들이 귀하에게 부패한 제안을 하려고 준비하고 있습니다. 일반적인 부패 스캔들과 달리, 이번 제안은 실제로 우리에게 이로울 수도 있습니다."
 CES_supp_oppos: "야당 탄압"
 CES_supp_oppos_desc: "야당은 우리의 권력을 파괴하고 사회를 불안정하게 하려 하므로 우리 정부에 심각한 위협이 됩니다. 다수 시민의 이익을 보호하고 국가 체제의 안정을 보장하려면 야권 세력을 억누르고 우리 정부의 신뢰를 실추시키려는 그들의 시도를 막아야 합니다."
 CES_befr_oligrachs: "과두 재벌과의 우호"
 CES_befr_oligrachs_desc: "과두 재벌은 경제적 유대를 발전시키는 데 많은 이점을 제공할 수 있는 부유하고 영향력 있는 인물들입니다. 과두 재벌과의 우호는 우리나라에 자원, 투자, 일자리를 제공할 수 있으며, 이는 경제 성장과 번영하는 사회에 기여합니다."
 CES_empow_famil_mem: "가족 구성원에게 권력 부여"
 CES_empow_famil_mem_desc: "우리 정부는 지도자를 중심으로 돌아갑니다. 국가를 그의 가족 구성원들을 중심으로 더욱 중앙집권화해야 합니까, 아니면 독립적으로 놔두는 편이 낫습니까? 각 선택지에는 저마다 찬반 논거가 있습니다."
 CES_form_new_gov: "새 정부 구성"
 CES_form_new_gov_desc: "새 정부는 경제, 안보, 사회 정책과 같은 국가의 중요한 문제에 새로운 아이디어와 해법을 가져올 수 있습니다."
 CES_national_consolidation: "민족 통합"
 CES_national_consolidation_desc: "세계화로 문화, 종교, 전통이 다양해지는 오늘날의 세계에서 민족 통합은 국가의 단결을 유지하는 데 점점 더 중요해지고 있습니다. 이는 서로 다른 집단 사이의 정직, 공정, 협력에 기반한 여론이 형성되도록 합니다."
 CES_changing_city_names: "도시 이름 변경"
 CES_changing_city_names_desc: "우리나라 많은 도시의 이름은 역사적 사건, 지리, 혹은 문화적 전통과 관련이 있을 수 있습니다. 그러나 경우에 따라서는 이러한 이름이 지역 주민과 그들의 역사에 부적절하거나 심지어 모욕적일 수도 있습니다."
 CES_governmental_propaganda: "정부 선전"
 CES_governmental_propaganda_desc: "정부 선전은 정부 프로그램과 사업에 대한 정보를 전파하고 다양한 주제에 대한 여론을 형성하는 데 중요한 역할을 할 수 있습니다."
 CES_cultural_effort: "문화적 노력"
 CES_cultural_effort_desc: "문화는 사회의 성격을 규정하는 지식, 가치, 관습의 복합체입니다. 문화적 노력은 우리의 전통, 예술, 과학을 보존하고 발전시키는 데 중요한 역할을 합니다."
 CES_ally_turkic_council: "튀르크 평의회 동맹"
 CES_ally_turkic_council_desc: "튀르크 평의회는 튀르크어를 사용하는 국가들을 결속시키고 회원국 간 협력 강화를 추구하는 기구입니다. 국제 협력이 안정과 발전에 점점 더 중요한 요소가 되고 있는 오늘날의 세계에서, 튀르크 평의회의 설립은 튀르크어권 민족들 사이의 조화로운 소통을 보장하는 데 핵심적인 역할을 할 수 있습니다."
 CES_turkic_council: "튀르크 평의회"
 invitation_turkic_council_tt1: "\n우리는 §C튀르크 평의회§!를 창설하고 다음 국가들을 초청합니다. §Y[AZE.GetNameWithFlag], [KYR.GetNameWithFlag], [TUR.GetNameWithFlag], [UZB.GetNameWithFlag]§!."
 invitation_turkic_council_tt2: "\n우리는 §C튀르크 평의회§!를 창설하고 다음 국가들을 초청합니다. §Y[AZE.GetNameWithFlag], [KYR.GetNameWithFlag], [TUR.GetNameWithFlag], [KAZ.GetNameWithFlag]§!."
 invitation_turkic_council_tt3: "\n우리는 §C튀르크 평의회§!를 창설하고 다음 국가들을 초청합니다. §Y[AZE.GetNameWithFlag], [KAZ.GetNameWithFlag], [TUR.GetNameWithFlag], [UZB.GetNameWithFlag]§!."
 CES_partnership_with_unesco: "유네스코와의 동반자 관계"
 CES_partnership_with_unesco_desc: "유네스코와의 동반자 관계는 이 분야에서 공동의 목표를 달성하기 위해 유엔 교육과학문화기구와 맺는 전략적 협력입니다."
 CES_healthcare_reform: "의료 개혁"
 CES_healthcare_reform_desc: "의료 개혁은 주민의 필요를 충족하기 위해 의료 서비스의 질, 접근성, 효율성을 높이는 것을 목표로 의료 체계를 변화시키는 체계적인 과정입니다."
 CES_attempt_migration_control: "이주 통제 시도"
 CES_attempt_migration_control_desc: "이주 규제 시도는 국가의 경제적, 사회적, 안보적 이익 사이의 균형을 이루기 위해 이주민의 유입을 통제하고 제한하는 노력과 정책입니다."
 CES_increase_border_reform: "국경 개혁 확대"
 CES_increase_border_reform_desc: "국경 개혁 확대는 국경 업무의 안전성과 효율성을 높이고 법률에 대한 더 엄격한 통제와 집행을 보장하기 위한 일련의 조치를 도입하는 것을 의미합니다."
 CES_strongarm_militar: "강력한 군대"
 CES_strongarm_militar_desc: "군대의 전략적 중요성은 우리나라와 지역의 안보를 보장하는 데 있습니다. 테러를 비롯한 국가 안보에 대한 다양한 위협이 존재하는 오늘날의 세계에서, 군사 역량의 지속적인 발전은 우리 사회의 안정과 평화를 지키는 핵심 요소입니다."
 CES_personal_guard: "개인 경호대"
 CES_personal_guard_desc: "현대 사회는 절도, 폭행, 협박과 같은 범죄의 위험이 커지는 상황에 직면해 있습니다. 이러한 상황에서 개인 경호는 시민과 그 가족, 그들의 사업장의 안전을 보장하는 데 매우 중요할 수 있습니다."
 CES_put_diss_in_jail: "불충한 정치인 투옥"
 CES_put_diss_in_jail_desc: "불충한 정치인은 우리 통치 체제의 안정적인 운영에 위협이 됩니다. 이들은 합법적인 정부를 전복하려 하고, 증오의 기반을 만들며, 서로 다른 시민 집단 간의 갈등을 부추길 수 있습니다."
 CES_social_network_control_kaz: "소셜 네트워크 통제"
 CES_social_network_control_kaz_desc: "소셜 네트워크는 현대인의 소통에서 중요한 요소입니다. 그러나 긍정적인 측면과 더불어 허위 정보를 퍼뜨리고 사회의 기본 가치에 어긋나는 사상을 전파하는 데 이용될 수도 있습니다."
 CES_constitutional_reform: "헌법 개혁"
 CES_constitutional_reform_desc: "헌법 개혁은 우리의 통치 체제를 쇄신하고 강화하는 데 필요한 조치입니다. 사회가 새로운 도전과 변화에 직면하는 오늘날의 세계에서, 정부 기관과 정책 결정 과정의 효과적인 재편은 필수적인 성공 요인이 될 수 있습니다."
 CES_strongman_dream_kaz: "강력한 지도자의 꿈"
 CES_strongman_dream_kaz_desc: "[CES_strongman_dream_kaz_desc]"
 KAZ_strongman_dream_kaz_desc: "우리나라의 이념적 꿈을 반영하는 몇 가지 주요 측면을 확인할 수 있습니다. 카자흐스탄은 세계 여러 나라와의 경제적, 정치적, 문화적 유대를 강화함으로써 지역의 선두 주자가 되고 세계 정치에서 적극적인 역할을 하기를 열망합니다. 카자흐스탄에 대한 강력한 지도자의 꿈은 국가 산업과 과학 연구를 발전시켜 우리나라가 기술과 혁신의 선두 주자가 되게 하는 것입니다. 이는 새로운 일자리 창출, 국내총생산(GDP) 증가, 카자흐스탄의 국제적 위신 향상으로 이어질 수 있습니다."
 UZB_strongman_dream_kaz_desc: "우리나라의 이념적 꿈을 반영하는 몇 가지 주요 측면을 확인할 수 있습니다. 우즈베키스탄은 세계 여러 나라와의 경제적, 정치적, 문화적 유대를 강화함으로써 지역의 선두 주자가 되고 세계 정치에서 적극적인 역할을 하기를 열망합니다. 우즈베키스탄에 대한 강력한 지도자의 꿈은 국가 산업과 과학 연구를 발전시켜 우리나라가 기술과 혁신의 선두 주자가 되게 하는 것입니다. 이는 새로운 일자리 창출, 국내총생산(GDP) 증가, 우즈베키스탄의 국제적 위신 향상으로 이어질 수 있습니다."
 KYR_strongman_dream_kaz_desc: "우리나라의 이념적 꿈을 반영하는 몇 가지 주요 측면을 확인할 수 있습니다. 키르기스스탄은 세계 여러 나라와의 경제적, 정치적, 문화적 유대를 강화함으로써 지역의 선두 주자가 되고 세계 정치에서 적극적인 역할을 하기를 열망합니다. 키르기스스탄에 대한 강력한 지도자의 꿈은 국가 산업과 과학 연구를 발전시켜 우리나라가 기술과 혁신의 선두 주자가 되게 하는 것입니다. 이는 새로운 일자리 창출, 국내총생산(GDP) 증가, 키르기스스탄의 국제적 위신 향상으로 이어질 수 있습니다."
 CES_pensions_increase: "연금 인상"
 CES_pensions_increase_desc: "연금은 많은 고령 시민의 주된 수입원입니다. 그러나 최근 인플레이션과 실질 소득 감소로 연금의 가치가 줄어들었습니다. 그 결과 많은 연금 수급자가 안락한 생활을 영위하고 기본적인 필요를 충족할 능력을 잃어 가고 있습니다."
 CES_president_visit_kaz: "대통령 방문"
 CES_president_visit_kaz_desc: "외교 관계를 발전시키기 위한 대통령의 중앙아시아 국가 방문에는 몇 가지 중요한 측면이 있습니다. 첫째, 이러한 방문은 양국 간 경제적, 정치적 유대를 강화하는 데 도움이 되며, 이는 무역로 확대, 투자 기회, 과학, 문화, 교육 분야의 협력으로 이어질 수 있습니다. 둘째, 대통령의 방문은 다양한 지역 안보 문제에 대한 정보와 견해의 교환을 촉진하여 분쟁 위험을 줄이고 방위 협력을 강화할 수 있습니다."
 CES_peaceful_prowestern: "평화적 친서방"
 CES_peaceful_prowestern_desc: "이는 다른 국가, 특히 서방 민주주의 국가와의 보다 개방적이고 협력적인 관계를 향한 정치 노선의 근본적인 변화입니다. 이는 외교 관계 강화, 경제적 유대 발전, 문화 및 교육 분야의 교류를 통해 달성할 수 있습니다. 친서방 노선에는 민주주의 제도를 강화하고 인권을 보장하기 위한 국내 정치 체제의 개혁도 포함됩니다. 이는 시민 사회의 발전, 언론 및 매체의 자유 확대, 국정 운영의 투명성 제고로 이어질 수 있습니다."
 CES_changing_the_course: "노선 변경"
 CES_changing_the_course_desc: "이는 국제 관계에 대해 보다 거리를 두고 참여하지 않는 접근을 향한 정치 노선의 근본적인 변화입니다. 이는 국가의 중립을 강화하고, 세계 여러 지역과 경제적 유대를 발전시키며, 국제 무대에서 독자적인 목소리를 유지함으로써 달성할 수 있습니다. 중립 노선에는 정치적 견해나 이념과 관계없이 모든 국가와의 관계를 개선하려는 노력도 포함됩니다. 이는 다른 나라와의 문화 및 과학 협력의 발전, 그리고 평화 유지 활동에 참여하고 대립하는 당사자 간의 대화를 지원함으로써 국제 무대의 안보를 보장하는 방식으로 달성할 수 있습니다."
 CES_peaceful_eastern: "평화적 친동방"
 CES_peaceful_eastern_desc: "이는 다른 국가, 특히 러시아와 CSTO와의 보다 개방적이고 협력적인 관계를 향한 정치 노선의 근본적인 변화입니다. 이는 외교 관계 강화, 경제적 유대 발전, 문화 및 교육 분야의 교류를 통해 달성할 수 있습니다. 친러시아 노선에는 국내 정치 체제와 그 제도의 개혁도 포함됩니다."
 CES_prowestern_stance: "친서방 입장"
 CES_prowestern_stance_desc: "친서방 입장에서 우리는 아메리카 합중국 및 다른 민주주의 국가들과의 유대를 강화하고 평등과 협력에 기반한 경제 관계를 발전시키고자 합니다. 이 과정에서 정부는 국가 경제를 더욱 발전시키기 위해 투자와 재화 및 서비스의 수출입에 유리한 조건을 조성하는 데 모든 노력을 기울이고 있습니다."
 CES_european_model: "유럽 모델"
 CES_european_model_desc: "유럽 모델은 우리가 높은 수준의 경제 발전과 사회적 진보를 이루도록 도와줄 일련의 원칙과 전략입니다. 이 모델은 민주주의가 잘 작동하는 안정적인 정치 체제의 구축, 인권과 시민의 자유 보호를 전제로 합니다. 그 목표 중 하나는 국가 기반시설을 발전시키는 것으로, 교통 접근성을 높이고 다른 나라와의 무역 관계를 원활하게 하기 위해 현대적인 도로, 교량, 비행장, 항만을 건설하는 것입니다."
 CES_protecting_neutrality: "중립 수호"
 CES_protecting_neutrality_desc: "중립의 입장에서 우리는 우리의 독립과 타국 내정에 대한 불간섭을 유지하고자 노력합니다. 이 과정에서 정부는 세계 여러 나라와의 외교 관계를 유지하고, 분쟁을 예방하며 분쟁의 평화적 해결을 지원하는 국제기구와 활동에 참여하기 위해 노력해 왔습니다."
 CES_diplomatic_powerhouse: "외교 강국"
 CES_diplomatic_powerhouse_desc: "외교는 다른 나라와의 국제 관계와 협력을 발전시키는 핵심 분야입니다. 독립 국가로서 우리는 세계 무대에서 입지를 강화하고 정치, 경제, 안보 분야에서 다양한 지역 및 세계 행위자들과의 대화를 확대하고자 합니다."
 CES_proeastern_stance: "친동방 입장"
 CES_proeastern_stance_desc: "친러시아 입장에서 우리는 집단안전보장조약기구(CSTO)의 틀 안에서 러시아 연방 및 다른 CIS 국가들과의 유대를 강화하고자 합니다. 이 과정에서 정부는 러시아 및 다른 CSTO 국가들과의 경제적, 문화적, 과학적 유대를 발전시키기 위해 모든 노력을 기울이고 있습니다."
 CES_csto_doctrine: "CSTO 교리"
 CES_csto_doctrine_desc: "집단안전보장조약기구(CSTO) 군사 교리의 틀 안에서 우리는 군사 협력 정책과 CSTO 가입 계획에 따른 모든 의무의 완벽한 이행을 고수합니다. 우리는 외부 위협으로부터 국경을 방어하고 기구의 다른 회원국들과 함께 지역 안정을 유지할 준비가 되어 있어야 합니다."
 CES_clear_the_fifth_column: "제5열 일소"
 CES_clear_the_fifth_column_desc: "제5열의 숙청은 국가 안보와 정치 과정의 통합에 매우 중요합니다. 이는 외부 세력의 간섭을 막고 법률 준수를 보장합니다."
 CES_radicals_in_power: "권력을 잡은 급진주의자들"
 CES_radicals_in_power_desc: "지하디스트 급진주의자들이 최고위 권력층에 진입하면서 우리나라에 예상치 못한 정치적 변혁이 일어났습니다."
 CES_jihadi_haven: "지하디스트의 안식처"
 CES_jihadi_haven_desc: "지하디스트들이 권력을 잡았고, 얼마 지나지 않아 우리나라는 그들에게 이상적인 안식처가 되었습니다."
 CES_dab_on_resistance: "저항 억제"
 CES_dab_on_resistance_desc: "우리는 지하디스트 저항에 합류해야 합니다!"
 CES_recruit_loyalists: "충성파 모집"
 CES_recruit_loyalists_desc: "충성스러운 지지자들은 귀하의 입지와 영향력을 크게 강화할 수 있습니다."
 CES_assert_pretens: "우리의 주장 관철"
 CES_assert_pretens_desc: "아시아 국가들에 대한 우리의 영유권을 주장합시다."
 CES_form_gla: "GLA 창설"
 CES_form_gla_desc: "다른 나라들과 적극적으로 맞서기 위해 GLA 군대를 창설해야 합니다."
 CES_gasify_army: "군대의 가스화"
 CES_gasify_army_desc: "세계가 주시하는 가운데 긴장이 고조되고 위험은 점점 더 심각해지고 있습니다. GLA는 화학 및 생물 무기를 사용하여 힘의 균형을 재편할 것입니까, 아니면 국제사회가 단결하여 다가오는 이 위협을 억누를 것입니까?"
 CES_black_market: "암시장"
 CES_black_market_desc: "우리는 암시장을 통해 무기와 장비를 조달해야 합니다."
 CES_symbol_power: "상징의 힘"
 CES_symbol_power_desc: "상징의 힘은 정체성 형성에 중요한 역할을 할 수 있습니다."
 CES_make_them_obey: "복종시키기"
 CES_make_them_obey_desc: "더 나은 조직을 위해 우리 군대가 우리에게 복종하도록 만들어야 합니다."
 CES_invade_turkmens: "투르크멘인 침공"
 CES_invade_turkmens_desc: "투르크메니스탄 침공은 우리나라에 중요합니다."
 CES_invade_uzbekistan: "우즈베키스탄 침공"
 CES_invade_uzbekistan_desc: "우즈베키스탄 침공은 우리나라에 중요합니다."
 CES_invade_kazakhstan: "카자흐스탄 침공"
 CES_invade_kazakhstan_desc: "카자흐스탄 침공은 우리나라에 중요합니다."
 CES_invade_tajiks: "타지크인 침공"
 CES_invade_tajiks_desc: "타지키스탄 침공은 우리나라에 중요합니다."
 CES_annex_kyrgyz: "키르기스스탄 합병"
 CES_annex_kyrgyz_desc: "키르기스스탄 침공은 우리나라에 중요합니다."
 CES_reunite_talib: "탈레반 재통합"
 CES_reunite_talib_desc: "아프가니스탄에서 탈레반의 재통합은 우리나라에 중요합니다."
 CES_khurasan_form: "호라산 수립"
 CES_khurasan_form_desc: "호라산의 수립은 지역 내 서로 다른 문화와 종교 사이의 평화, 관용, 상호 존중의 이상을 증진하는 데도 도움이 될 수 있습니다. 이는 역사적 뿌리뿐 아니라 경제, 사회, 문화 발전에서의 공동 목표와 사업에 기반한 지역 전체의 정체성을 형성하는 데 이바지할 수 있습니다."
 CES_promote_centralasian_jihad: "중앙아시아 지하드 고취"
 CES_promote_centralasian_jihad_desc: "지하드의 고취는 지역 기반시설과 경제적 유대를 발전시키는 데 도움이 될 수 있으며, 이는 주민의 복지와 중앙아시아 국가들의 안정적인 발전에 기여합니다. 동시에 이는 서로 다른 문화와 종교 사이의 평화, 관용, 상호 존중의 이상을 증진함으로써 국제 무대에서 이슬람 세계의 입지를 강화하는 데도 도움이 됩니다."
 CES_hizb_u_tahrir: "히즈브 우트타흐리르"
 CES_hizb_u_tahrir_desc: "히즈브 우트타흐리르 알이슬라미는 1953년 동예루살렘에서 창립된 국제적 범이슬람주의 정당입니다."
 CES_ally_isis: "ISIS와 동맹"
 CES_ally_isis_desc: "우리 체제의 안정과 지원을 위해 이슬람 국가와 친교를 맺어야 합니다."
 CES_ally_alqaeda: "알카에다와 동맹"
 CES_ally_alqaeda_desc: "우리 체제의 안정과 지원을 위해 알카에다와 친교를 맺어야 합니다."
 CES_befriend_taliban: "탈레반과의 우호"
 CES_befriend_taliban_desc: "우리 체제의 안정과 지원을 위해 탈레반과 친교를 맺어야 합니다."
 CES_freedom_to_eastturkestan: "동튀르키스탄의 자유"
 CES_freedom_to_eastturkestan_desc: "동튀르키스탄은 오랫동안 자유를 필요로 해 왔으며, 우리가 그들에게 자유를 주겠습니다!"
 CES_uprising_in_russia: "러시아 내 봉기"
 CES_uprising_in_russia_desc: "러시아는 체첸을 불법적으로 점령했습니다. 우리는 진정한 체첸인들이 이 지역에서 이슬람 혁명을 일으키도록 도울 것입니다."
 CES_uniting_the_force: "세력 결집"
 CES_uniting_the_force_desc: "지하드를 전 세계로 더욱 확산시키기 위해 우리 세력을 결집해야 합니다!"
 CES_uniting_with_bros: "세계 지하드 촉구"
 CES_uniting_with_bros_desc: "형제들과의 결속은 세계 지하드에서 핵심적인 역할을 할 것입니다."
 CES_sword_of_right: "정의의 검"
 CES_sword_of_right_desc: "우리는 오랜 적들에게 우리의 검을 꽂을 것입니다."
 CES_behead_the_snake: "뱀의 머리를 베라"
 CES_behead_the_snake_desc: "미국은 끊임없이 우리를 간섭해 왔습니다. 이제 마침내 이를 끝내야 합니다."
 CES_cuts_traitors: "이란 정복"
 CES_cuts_traitors_desc: "이란은 우리를 배신했습니다. 그리고 우리는 그들의 땅에 정의를 되돌려 놓을 것입니다!"
 CES_unleash_wrath: "분노의 해방"
 CES_unleash_wrath_desc: "우리는 마침내 이스라엘을 영원히 제거할 것입니다!"
 CES_kyr_reform_vs: "분쟁 대비"
 CES_kyr_reform_vs_desc: ""
 CES_border_guards_exp: "국경 분쟁의 경험"
 CES_border_guards_exp_desc: ""
 CES_build_fortif: "요새 건설"
 CES_build_fortif_desc: ""
 CES_analyze_taj_army: "타지크군 분석"
 CES_analyze_taj_army_desc: ""
 CES_suppress_pamir: "파미르 진압"
 CES_suppress_pamir_desc: ""
 CES_prepare_sold: "병사 준비"
 CES_prepare_sold_desc: ""
 elbasy: "엘바시"
 yurtbashi: "유르트바시"
 CES_idea_diplomatic_powerhouse: "외교적 실용주의"
 CES_idea_eacu_cooperation: "EACU 협력"
 CES_idea_eacu_cooperation_desc: "유라시아 관세 동맹(원래는 유라시아 경제 공동체)은 대부분의 구소련 국가들 사이의 경제적 유대를 증진합니다. 이 동맹은 동맹 내로 들어오는 모든 상품에 공동 대외 관세를 부과하며, 무역 협정과 협상을 체결할 때 하나의 단일 주체로 행동합니다."
 CES_idea_eacu_cooperation_2: "EACU 통합 협력"
 CES_idea_eacu_cooperation_2_desc: "유라시아 관세 동맹(원래는 유라시아 경제 공동체)은 대부분의 구소련 국가들 사이의 경제적 유대를 증진합니다. 이 동맹은 동맹 내로 들어오는 모든 상품에 공동 대외 관세를 부과하며, 무역 협정과 협상을 체결할 때 하나의 단일 주체로 행동합니다."
 CES_debt_reafctoring: "부채 재조정"
 CES_debt_reafctoring_desc: "부채를 재조정하면 정부 지출에서 더 많은 자유를 얻을 수 있습니다."
 KAZ_narcotraffic_1_desc: "중앙아시아의 마약 밀매는 이 지역의 지정학적 위치, 마약 생산국의 존재, 복잡한 경제와 사회적 어려움 때문에 발생하며 안보와 안정에 도전을 안깁니다."
 KAZ_narcotraffic_2_desc: "중앙아시아의 마약 밀매는 이 지역의 지정학적 위치, 마약 생산국의 존재, 복잡한 경제와 사회적 어려움 때문에 발생하며 안보와 안정에 도전을 안깁니다."
 KAZ_narcotraffic_3_desc: "중앙아시아의 마약 밀매는 이 지역의 지정학적 위치, 마약 생산국의 존재, 복잡한 경제와 사회적 어려움 때문에 발생하며 안보와 안정에 도전을 안깁니다."
