 ISR_visa_free_moroc: "Acordo de Vistos Israel-Marrocos"
 israel_economy.147.t: "Israel propõe acordo de vistos!"
 israel_economy.147.d: "O governo israelense propõe um novo acordo sobre viagens indiretas de cidadãos israelenses ao Marrocos por meio de países terceiros. Devemos concordar?"
 israel_economy.147.a: "Claro!"
 israel_economy.147.b: "Não."
 israel_economy.148.t: "[FROM.GetNameWithFlag] concorda!"
 israel_economy.148.d: "Eles concordaram com nossa proposta e agora nossos cidadãos poderão viajar ao Marrocos."
 israel_economy.148.a: "Ótimo!"
 israel_economy.149.t: "[FROM.GetNameWithFlag] recusa!"
 israel_economy.149.d: "Eles não concordaram com nossa oferta."
 israel_economy.149.a: "Muito lamentável."
 israel_economy.150.t: "Israel propõe apoio conjunto ao Marrocos!"
 israel_economy.150.d: "Israel nos pede para apoiar o Marrocos em sua disputa com o movimento Polisario. Eles querem que ambos façamos uma declaração conjunta e apoiemos o governo legítimo do Marrocos. Devemos concordar?"
 israel_economy.150.a: "Claro! Enviem nossos diplomatas!"
 israel_economy.150.b: "Eles têm que fazer isso sozinhos."
 israel_economy.151.t: "EUA e Israel apoiam o governo marroquino!"
 israel_economy.151.d: "Recentemente, os Estados Unidos e Israel emitiram uma declaração conjunta apoiando o governo marroquino e denunciando o movimento separatista Polisario."
 israel_economy.151.a: "Ótimo!"
 israel_economy.152.t: "Israel apoia o governo marroquino!"
 israel_economy.152.d: "Recentemente, Israel emitiu uma declaração apoiando o governo marroquino e denunciando o movimento separatista Polisario!"
 israel_economy.152.a: "Ótimo!"
 israel_economy.153.t: "Israel propõe os Acordos de Abraão!"
 israel_economy.153.d: "Como parte da normalização das relações com Israel, eles propõem assinar um novo documento. O acordo também contém o reconhecimento da soberania de Israel e permite o estabelecimento de plenas relações diplomáticas. Devemos assiná-lo?"
 israel_economy.153.a: "Claro!"
 israel_economy.153.b: "Não!"
 israel_economy.154.t: "[FROM.GetNameWithFlag] concorda!"
 israel_economy.154.d: "[FROM.GetNameWithFlag] concordou em assinar os Acordos de Abraão, reconhecendo a soberania de Israel e permitindo o estabelecimento de plenas relações diplomáticas!"
 israel_economy.154.a: "Ótimo!"
 israel_economy.155.t: "[FROM.GetNameWithFlag] recusa!"
 israel_economy.155.d: "Eles não quiseram normalizar as relações conosco nem assinar os Acordos de Abraão."
 israel_economy.155.a: "Muito lamentável."
 norm_rel_infl_tt: "As §YRelações§! entre nós e os signatários §Gmelhorarão§!, e a §Yinfluência mútua§! entre nós §Gaumentará§!."
 idea_israel_negev_forum: "Parceria do Fórum do Negev"
 israel_economy.156.t: "Israel nos convida para o Fórum do Negev!"
 israel_economy.156.d: "Após a assinatura dos Acordos de Abraão em Washington e o avanço da normalização entre Israel e muitos de seus vizinhos árabes, os formuladores de políticas israelenses desejam tanto evitar que essa paz se torne tão fria quanto foi a longo prazo com o Egito e a Jordânia, quanto garantir uma coalizão regional mais forte para assegurar seu futuro na região, criar oportunidades econômicas e combater a influência iraniana. Assim, fomos convidados pelo Ministro das Relações Exteriores de Israel e pelo Secretário de Estado dos EUA a participar de uma reunião no deserto do Negev para discutir a formação de um bloco político destinado a combater o terrorismo, as mudanças climáticas, o isolamento econômico e a escassez de água na região, e fortalecer a cooperação árabe-israelense. Devemos comparecer a essa reunião?"
 israel_economy.156.a: "O Ministro das Relações Exteriores [Root.GetAdjective] comparecerá."
 israel_economy.157.t: "[FROM.GetNameWithFlag] entra no Fórum do Negev!"
 israel_economy.157.d: "[FROM.GetNameWithFlag] decidiu participar do Fórum do Negev."
 israel_economy.157.a: "Ótimo!"
 israel_economy.158.t: "[FROM.GetNameWithFlag] boicota o Fórum do Negev!"
 israel_economy.158.d: "Eles não querem participar."
 israel_economy.158.a: "Affe."
 neg_for_tt: "Eles ganharão a §Yideia§!, nossa §Yinfluência§! sobre eles §Gaumentará§! e nossas §Yrelações comerciais§! §Gaumentarão§!."
 israel_economy.159.t: "Israel propõe Acordo de Cooperação."
 israel_economy.159.d: "Israel nos propôs um novo acordo no qual estabeleceremos um novo e pleno tratado de paz entre nossos países. O tratado também inclui pontos sobre cooperação militar e garantias. O que devemos fazer?"
 israel_economy.159.a: "Concordamos!"
 israel_economy.159.b: "Não!"
 israel_economy.160.t: "[FROM.GetNameWithFlag] concorda!"
 israel_economy.160.d: "[FROM.GetNameWithFlag] concordou com nossa proposta e o tratado de não agressão foi assinado!"
 israel_economy.160.a: "Ótimo!"
 israel_economy.161.t: "[FROM.GetNameWithFlag] recusa!"
 israel_economy.161.d: "[FROM.GetNameWithFlag] recusou nossa proposta."
 israel_economy.161.a: "Ah..."
 full_mil_tt: "Estabeleceremos §Ygarantias plenas§!, ganharemos §Ginfluência§! sobre os §Ysignatários§!, §3pactos de não agressão§! serão assinados e §7bases militares§! serão §Yestabelecidas§!."
 ideological_alliance: "Aliança Ideológica"
 israel_observer_african_union: "Estado Observador da União Africana"
 israel_economy.162.t: "Israel quer se tornar Estado observador da UA!"
 israel_economy.162.d: "As relações israelenses com a África Subsaariana floresceram nas décadas de 1950 e 1960. No entanto, na Guerra do Yom Kippur, as forças israelenses cruzaram o canal e ocuparam solo africano. Isso levou a maior parte do continente - basicamente todos, exceto Malawi e o regime do Apartheid na África do Sul, incluindo nós - a romper relações com o país. Essas relações foram gradualmente restauradas na década de 1990 após os Acordos de Oslo, e muitos no governo israelense veem a África como o continente a partir do qual Israel pode melhorar sua imagem internacional. O Primeiro-Ministro [ISR.GetLeader] lançou recentemente uma campanha de 'Retorno à África', usando nossas tecnologias de dessalinização e outras startups inovadoras para melhorar a vida do povo africano. Assim, Jerusalém nos procurou pedindo para ingressar na União Africana como Estado observador, de forma semelhante à OLP. Embora muitos, especialmente na CAO, apoiariam, a Argélia e especialmente a África do Sul declararam forte oposição à medida."
 israel_economy.162.a: "[ISR.GetLeader] é um verdadeiro amigo da África."
 israel_economy.162.b: "Estados do Apartheid não têm nada a fazer na África."
 israel_economy.163.t: "A Etiópia concorda!"
 israel_economy.163.d: "Ontem, na cerimônia de abertura da União Africana em Adis Abeba, o embaixador de Israel na Etiópia entregou à Presidente da Comissão da União Africana a carta de Israel como membro observador da União Africana. Na década de 1990, Israel era membro observador da Organização da Unidade Africana, até ela ser dissolvida e substituída pela União Africana. No entanto, não conseguiu reingressar devido à pressão da África do Sul e da Argélia - duas das maiores nações do continente. Mas não mais. Um bloco político, liderado principalmente por Botsuana, Etiópia e membros da Comunidade da África Oriental, conseguiu superar o bloco árabe-sul-africano e impulsionar essa admissão. Essa conquista diplomática é resultado de esforços incansáveis do Ministério das Relações Exteriores, da Divisão Africana e das embaixadas israelenses no continente. É um passo corretivo para a anomalia que prevaleceu por quase duas décadas e uma parte importante do fortalecimento do tecido de relações exteriores de Israel."
 israel_economy.163.a: "Ótimo!"
 israel_economy.164.t: "A Etiópia veta nosso status!"
 israel_economy.164.d: "Em uma votação hoje na Comissão da União Africana sobre a adesão de Israel, nossas esperanças se mostraram inúteis. Apesar do forte apoio de Botsuana, Etiópia, membros da Comunidade da África Oriental e da República Democrática do Congo, não foi suficiente para superar as vozes contrárias à nossa adesão ao status de Estado observador na União Africana. Na década de 1990, Israel era membro observador da Organização da Unidade Africana, até ela ser dissolvida e substituída pela União Africana. No entanto, não conseguiu reingressar devido à pressão dos Estados árabes e da África do Sul. De fato, é entristecedor ver a União Africana tomada como refém por um pequeno número de Estados extremistas como a Argélia e a África do Sul, movidos pelo ódio e controlados por interesses iranianos e catarianos. Israel continuará a aprofundar seus laços com a África, seja por meio da União Africana, seja por canais alternativos, e não importa quão humilhante tenha sido ver nossos diplomatas expulsos violentamente do plenário após a votação."
 israel_economy.164.a: "Certo..."
 israel_economy.165.t: "Israel oferece investimentos!"
 israel_economy.165.d: "Israel quer investir em nossa economia construindo um complexo industrial em nosso país. Devemos concordar?"
 israel_economy.165.a: "Claro!"
 israel_economy.165.b: "Não."
 israel_economy.166.t: "[FROM.GetNameWithFlag] concorda!"
 israel_economy.166.d: "Eles aceitaram nossa oferta de investimento!"
 israel_economy.166.a: "Ótimo!"
 israel_economy.167.t: "[FROM.GetNameWithFlag] recusa!"
 israel_economy.167.d: "Eles não concordaram com nossa oferta de investimento."
 israel_economy.167.a: "Certo."
 israel_economy.168.t: "Israel apoia a Etiópia na disputa do Nilo!"
 israel_economy.168.d: "Durante negociações recentes, o governo israelense declarou que apoia plenamente o governo etíope na disputa do Nilo entre Etiópia e Egito."
 israel_economy.168.a: "Interessante."
 israel_economy.169.t: "Israel apoia o Egito na disputa do Nilo!"
 israel_economy.169.d: "Durante negociações recentes, o governo israelense declarou que apoia plenamente o governo egípcio na disputa do Nilo entre Etiópia e Egito."
 israel_economy.169.a: "Interessante."
