 sino_aus_peacekeeping: "中澳维和行动"
 sino_aus_peacekeeping_desc: "虽然这只是此类倡议的开端，但该协议为未来在太平洋地区的维和行动奠定了基础。通过在情报收集、反恐和贸易保护方面的合作，我们可以继续维护两国之间的海洋安全，并弥合两国之间的分歧。"
