 ukraine_develop_btr4_tests_bonus: "Повышенная надежность БТР-4 в результате расширенных испытаний."
 UKR_develop_t84u: "Разработка §YТ-84У «Оплот»§!"
 UKR_develop_t84u_desc: "§WТ-84У «Оплот» — украинский основной боевой танк третьего поколения, разработанный Харьковским конструкторским бюро имени О. О. Морозова на базе танка Т-84.\nТанк получил новую сварно-катаную башню с цельноштампованной крышей, изготовленной методом электрошлаковой переплавки, благодаря чему она обладает большей прочностью и живучестью.\nБлагодаря упрощенной форме башни удалось успешно разместить в ней многослойную броню. Также был увеличен её внутренний объём.\nВ лобовую проекцию башни установлена новая украинская система динамической защиты третьего поколения «Ниж».\nТанк оснащён украинской динамической и активной защитой, зарубежными прицельными устройствами и увеличенными боковыми экранами.§!"
 UKR_develop_yatahan: "Разработка §YТ-84-120 «Ятаган»§!"
 UKR_develop_yatahan_desc: "§WТ-84-120 «Ятаган» — это модификация танка Т-84У «Оплот», оснащенная 120-мм пушкой, адаптированной под стандарты НАТО, вместо стандартной 125-мм пушки. Она разработана Харьковским конструкторским бюро имени О. О. Морозова.\nТанк имеет 120-мм пушку КБМ2, использующую 120-мм боеприпасы НАТО.\nВ задней части башни расположен карусельный автомат заряжания (первоначально французский, затем украинского производства).\nВозможна установка новой 140-мм пушки «Багира».\nСборка осуществляется из компонентов украинского производства, хотя танк полностью совместим с компонентами зарубежного производства.§!"
 UKR_develop_bahira: "Разработка §YТ-84-140 «Багира»§!"
 UKR_develop_bahira_desc: "§WТ-84-140 «Багира» — это предлагаемая модификация танка Т-84-120 «Ятаган», которая должна была быть оснащена 140-мм пушкой «Багира», разработанной Харьковским конструкторским бюро имени О. О. Морозова.\nКарусельный автомат заряжания расположен в кормовой части башни.\nСобран из компонентов украинского производства, хотя полностью совместим с компонентами зарубежного производства.§!"
 UKR_develop_bm_oplot: "Разработка §YТ-84 «БМ Оплот»§!"
 UKR_develop_bm_oplot_desc: "§WТ-84 «БМ Оплот» — новейшая и наиболее совершенная модификация основного боевого танка Т-84У «Оплот», разработанная Харьковским конструкторским бюро имени О. О. Морозова.\nСреди её отличительных особенностей — более совершенная броня, новые системы радиоэлектронной борьбы и другие.\nОдной из заметных особенностей является новый панорамный прицел ПНК-6.\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!"
 UKR_develop_bastion: "Разработка §YТ-84 «Бастион»§!"
 UKR_develop_bastion_desc: "§WТ-84 «Бастион» — это, по сообщениям, программа модернизации, согласно которой танк будет избавлен от деталей российского производства.\nВ варианте Т-84 «БМ Оплот», принятом на вооружение в 2009 году, имелось определенное количество компонентов и материалов российского происхождения: отдельные компоненты электрооборудования, компоненты блоков и систем.\nСообщалось, что их относительно немного, но все они должны быть полностью заменены.\nПланировалось, что элементная база должна не только избавиться от российских компонентов, но и быть значительно модернизирована.§!"
 UKR_develop_t84u_flag: "Выполнено решение §YРазработка Т-84У «Оплот»§!"
 UKR_develop_t84_yatahan_flag: "Выполнено решение §YРазработка Т-84-120 «Ятаган»§!"
 UKR_develop_bm_oplot_flag: "Выполнено решение §YРазработка Т-84 «БМ Оплот»§!"
 UKR_develop_donets_spaa: "Разработать §Y«Донец»§! SPAA system"
 UKR_develop_donets_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_donets_spaa_for_tooltip\n\n\n\n\n\n\n\n\n§W«Донец» — зенитный ракетно-пушечный комплекс, разработанный заводом имени Малышева в Харькове главным образом на экспорт.\n«Донец» соединяет модернизированную башню советской ЗСУ-23-4 «Шилка» с шасси основного танка Т-80УД/Т-84.\nПо бокам башни установлены два спаренных транспортно-пусковых контейнера с ракетами комплекса «Стрела-10М». \nЭти ракеты с автономной пассивной головкой самонаведения поражают воздушные цели на дальности до 4500 м и высоте до 3500 м.§!"
 UKR_modernize_zsu_23_4m_a1_spaa: "Модернизация §YЗСУ-23-4М-А1 «Рокач»§!"
 UKR_modernize_s125_spaa: "Модернизация §YС-125-2Д§!"
 UKR_modernize_s125m_spaa: "Модернизация §YС-125М§!"
 UKR_modernize_kvadrat_spaa: "Модернизация §Y2К12М1-2Л «Квадрат-2Л»§!"
 UKR_develop_t38_stylet_spaa: "Разработка ЗСУ §YТ-38 «Стилет»§!"
 UKR_modernize_rk10_spaa: "Интеграция «Стрелы-10» §YРК-10§!"
