 module_naval_missile_mount_single: "단장 미사일 거치대"
 module_naval_missile_mount_single_desc: "유도 미사일을 위한 갑판 장착식 캐니스터 또는 선회식 암 발사기입니다. VLS 발사대보다 가볍고 저렴하지만 용량이 제한적이며 일제 사격 속도가 느립니다.\n\n§G설계 조언: 미사일 거치대는 대형 VLS 발사대보다 낮은 비용으로 함선의 미사일 임무 전투 능력치를 배가시킵니다. 소형 전투함에 적합하지만 미사일 화력이 낮고, 연료 사용량과 수상 피탐성이 다소 늘어납니다.§!"
 module_naval_missile_mount_twin: "쌍장 미사일 거치대"
 module_naval_missile_mount_twin_desc: "$module_naval_missile_mount_single_desc$"
 module_naval_missile_mount_quad: "4연장 미사일 거치대"
 module_naval_missile_mount_quad_desc: "$module_naval_missile_mount_single_desc$"
 module_naval_ammo_anti_ship_1: "대함 미사일 적재 I"
 module_naval_ammo_anti_ship_1_desc: "장거리에서 수상 전투함을 교전하기 위한 대함 순항 미사일 중심의 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
 module_naval_ammo_air_defense_1: "방공 미사일 적재 I"
 module_naval_ammo_air_defense_1_desc: "함선과 호위함을 항공기와 날아오는 미사일로부터 보호하는 지역 방공 미사일 중심의 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
 module_naval_ammo_land_attack_1: "대지 공격 미사일 적재 I"
 module_naval_ammo_land_attack_1_desc: "육상 표적을 타격하기 위한 대지 공격 순항 미사일 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
 module_naval_ammo_asw_1: "대잠 미사일 적재 I"
 module_naval_ammo_asw_1_desc: "원거리에서 잠수함 접촉을 추적 공격하기 위한, 미사일로 운반되는 어뢰의 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
 module_naval_ammo_balanced_1: "균형 미사일 적재 I"
 module_naval_ammo_balanced_1_desc: "대함, 방공, 대지 공격, 대잠 미사일의 균형을 맞춘 혼합 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
 module_naval_sub_ammo_anti_ship_1: "잠수함 대함 미사일 적재 I"
 module_naval_sub_ammo_anti_ship_1_desc: "수직 발사관에서 발사되는 대함 순항 미사일의 잠수함용 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
 module_naval_sub_ammo_land_attack_1: "잠수함 대지 공격 미사일 적재 I"
 module_naval_sub_ammo_land_attack_1_desc: "수직 발사관에서 발사되는 대지 공격 순항 미사일의 잠수함용 탄약고 적재입니다. 미사일 거치대 또는 VLS 발사대가 있어야 사용할 수 있습니다. 탄약 적재는 임무 유연성을 위해 신속하게 재장비하여 변경할 수도 있습니다."
