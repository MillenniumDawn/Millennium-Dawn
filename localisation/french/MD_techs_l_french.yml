 tech_point_defense_system_1: "Système d'arme rapproché I"
 tech_point_defense_system_1_desc: "Le système d'arme rapproché (SAR) a été développé en tant que dernière ligne de défense automatisée (défense terminale ou défense ponctuelle) contre les missiles antinavires (AShM ou ASM) et les avions d'attaque, y compris les engins à haute gravité et les engins de mer manœuvrants."
 tech_point_defense_system_2: "Système d'arme rapproché II"
