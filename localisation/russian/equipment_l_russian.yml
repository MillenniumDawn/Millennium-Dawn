 UKR_APC_1: "БТР-60"
 UKR_APC_1_desc: "Одна из старейших машин, до сих пор находящихся на вооружении, — БТР-60 — оснащена 14,5-мм крупнокалиберным пулемётом КПВТ с боезапасом 500 патронов. Вспомогательное вооружение — спаренный 7,62-мм пулемёт ПКТ с боезапасом 3,00 патрона. Отлично подходит для переброски лёгкой пехоты и сил быстрого реагирования (QRF)."
 UKR_APC_1_short: "БТР-60"
 UKR_APC_2: "МТ-ЛБ"
 UKR_APC_2_desc: "МТ-ЛБ был создан в 1970-х годах. Дешёвые и быстрые в производстве, эти машины использовались Советским Союзом для лёгкой ПВО и пехотных боёв."
 UKR_APC_2_short: "МТ-ЛБ"
 UKR_APC_3: "БТР-70"
 UKR_APC_3_desc: "БТР-70 используется с 1972 года; в советско-афганской войне эти машины применялись для переброски войск и последующей огневой поддержки. Единственное отличие от БТР-60 — более тяжёлая броня."
 UKR_APC_3_short: "БТР-70"
 UKR_APC_4: "БТР-80"
 UKR_APC_4_desc: "БТР-80 — колёсный БТР-амфибия с колёсной формулой 8х8, разработанный в СССР. Он был принят на вооружение в 1986 году и заменил в Советской армии предыдущие машины БТР-60 и БТР-70. Впервые он был применён во время советской войны в Афганистане."
 UKR_APC_4_short: "БТР-80"
 UKR_APC_5: "БТР-3"
 UKR_APC_5_desc: "БТР-3 — украинский колёсный бронетранспортёр с колёсной формулой 8х8. Это усовершенствованная версия советского БТР-80 с усиленной бронезащитой, повышенной мобильностью и огневой мощью. БТР-3 оснащён 30-мм автоматической пушкой и 7,62-мм спаренным пулемётом, что позволяет использовать его как для перевозки личного состава, так и для огневой поддержки."
 UKR_APC_5_short: "БТР-3"
 UKR_APC_6: "БТР-4"
 UKR_APC_6_desc: "БТР-4 — украинский колёсный бронетранспортёр с колёсной формулой 8х8. Это усовершенствованная версия советского БТР-80 с усиленной бронезащитой, повышенной мобильностью и огневой мощью. БТР-4 оснащён 30-мм автоматической пушкой и 7,62-мм спаренным пулемётом, что позволяет использовать его как для перевозки личного состава, так и для огневой поддержки."
 UKR_APC_6_short: "БТР-4"
 UKR_APC_7: "БТР-4МВ"
 UKR_APC_7_desc: "БТР-4МВ — это модернизированная версия БТР-4, обеспечивающая повышенную защиту и огневую мощь. Он оснащён улучшенной бронёй, более мощным двигателем и усовершенствованными системами вооружения, включая 30-мм автоматическую пушку и противотанковые управляемые ракеты. БТР-4МВ способен перевозить полное пехотное отделение и подходит для различных боевых сценариев."
 UKR_APC_7_short: "БТР-4МВ"
 UKR_APC_8: "БМП-В"
 UKR_APC_8_desc: "БМП-В — украинская плавающая гусеничная боевая машина пехоты. Она предназначена для транспортировки пехоты на поле боя с одновременной огневой поддержкой. БМП-В оснащена 30-мм автоматической пушкой, спаренным пулемётом и может нести противотанковые управляемые ракеты. По сравнению со своими предшественниками она обладает улучшенной бронезащитой и мобильностью, что делает её пригодной для современных боевых действий."
 UKR_APC_8_short: "БМП-В"
 UKR_IFV_1: "БМП-1"
 UKR_IFV_1_desc: "БМП-1 — советская плавающая гусеничная боевая машина пехоты. Использовалась во время советско-афганской войны для перевозки войск и борьбы с джихадистами. Вооружена 73-мм орудием 2А28 и пусковой установкой ПТУР."
 UKR_IFV_1_short: "БМП-1"
 UKR_IFV_2: "БМП-1У"
 UKR_IFV_2_desc: "Усовершенствованная версия БМП-1 с улучшенными огневыми характеристиками."
