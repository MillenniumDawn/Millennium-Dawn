 SMA_vatican_union: "Union avec le Saint-Siège"
 SMA_vatican_union_desc: "Notre évêque propose une union formelle entre Saint-Marin et le Saint-Siège, fusionnant les deux États sous une seule couronne. Cela placerait la papauté à la tête de notre gouvernement et nous lierait durablement à l'autorité de l'Église."