 formable_buy.1.t: "Территориальное предложение от [?formable_offer_buyer_id.GetNameDef]"
 formable_buy.1.d: "[?formable_offer_buyer_id.GetNameDef] официально предложил нашему правительству §H£treasury 100 миллиардов§! за [?formable_offer_state_id.GetName], территорию, которую они считают историческим центром.\n\nНашему кабинету министров предстоит решить: принять платеж и передать землю или отклонить предложение и сохранить нашу территорию в целости."
 formable_buy.1.a: "Предложение, от которого мы не можем отказаться."
 formable_buy.1.b: "Наша земля не продаётся."
 formable_buy.2.t: "[?formable_offer_holder_id.GetNameDef] принимает наше предложение"
 formable_buy.2.d: "[?formable_offer_holder_id.GetNameDef] передал [?formable_offer_state_id.GetName] в нашу администрацию. Средства переведены, и территория теперь наша."
 formable_buy.2.a: "Достойное вложение."
 formable_buy.3.t: "[?formable_offer_holder_id.GetNameDef] отклоняет наше предложение"
 formable_buy.3.d: "[?formable_offer_holder_id.GetNameDef] отклонил наше предложение по [?formable_offer_state_id.GetName]. Средства были возвращены в нашу казну, и государство остается под их контролем."
 formable_buy.3.a: "Мы рассмотрим другие варианты."
