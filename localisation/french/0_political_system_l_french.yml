 generic.communist_state_desc: "Le communisme désigne de manière générale une idéologie prônant la fin du système capitaliste pour créer un paradis des travailleurs communautaire. En réalité, les nations communistes conservent des systèmes économiques capitalistes et sont souvent de nature non démocratique"
