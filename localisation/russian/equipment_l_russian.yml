 SOV_Anti_Air_0: "9К32 «Стрела-2»"
 SOV_Anti_Air_0_desc: "Разработан в начале холодной войны с использованием метода пропорциональной навигации для захвата и уничтожения американских ядерных бомбардировщиков. Одна из самых простых систем ПВО, способная поражать цели на расстоянии 3700-4200 м."
 SOV_Anti_Air_1: "9К38 «Игла»"
 SOV_Anti_Air_1_desc: "«Игла» — более современная версия «Стрелы», принятая Россией на вооружение в 2004 году. Она использует двухдиапазонную инфракрасную систему наведения (версия «С»), которая намного лучше, чем у «Стрелы»."
 SOV_Anti_Air_2: "9К333 «Верба»"
 SOV_Anti_Air_3: "9К335 «Верба-С»"
 SOV_Anti_Air_4: "9К48"
 SOV_APC_1: "БТР-60"
 SOV_APC_1_desc: "Одна из старейших машин, до сих пор находящихся на вооружении, БТР-60 оснащена 14,5-мм крупнокалиберным пулемётом КПВТ с боезапасом 500 патронов. Вспомогательное вооружение — спаренный пулемёт ПКТ калибра 7,62 мм с боезапасом 3,00 патрона. Отлично подходит для переброски лёгкой пехоты и сил быстрого реагирования."
 SOV_APC_1_short: "БТР-60"
 SOV_APC_2: "МТ-ЛБ"
 SOV_APC_2_desc: "МТ-ЛБ был создан в 1970-х годах. Изготовлены дешево и быстро. Советы использовали их для легких противовоздушных и пехотных боев."
 SOV_APC_2_short: "МТ-ЛБ"
 SOV_APC_3: "БТР-70"
 SOV_APC_3_desc: "БТР-70 используется с 1972 года; в ходе советско-афганской войны эти машины применялись для переброски войск и последующей огневой поддержки. Единственное отличие от БТР-60 — более тяжёлая броня."
 SOV_APC_3_short: "БТР-70"
 SOV_APC_4: "БТР-80"
 SOV_APC_4_desc: "БТР-80 — колесный БТР-амфибия с колесной формулой 8х8, разработанный в СССР. Он был принят на вооружение в 1986 году и заменил в Советской Армии предыдущие машины БТР-60 и БТР-70. Впервые он был применен во время советской войны в Афганистане."
 SOV_APC_4_short: "БТР-80"
 SOV_APC_5: "БТР-90"
 SOV_APC_5_desc: "Разработан в 1994 году для борьбы с боевиками. Оснащен мощной 30-мм пушкой Шипунова 2А42 с 500 патронами."
 SOV_APC_5_short: "БТР-90"
 SOV_APC_6: "Курганец-25"
 SOV_APC_6_desc: "Одна из наиболее современных российских машин — «Курганец-25» — создана в 2015 году. Разработанная как БМП, она оснащена лёгкой пушкой «Бумеранг-БМ» и 12,7-мм пулемётом «Корд». По конструкции близка к американской БМП Bradley."
 SOV_APC_6_short: "Курганец-25"
 SOV_APC_7: "Курганец-35"
 SOV_APC_7_desc: "Так же, как 25, который в первую очередь является БМП, 35 — БТР, который может перевозить 12 человек и делает примерно то же самое, что и 25 в операциях БМП."
 SOV_APC_7_short: "Курганец-35"
 SOV_APC_8: "Курганец-45"
 SOV_APC_8_desc: "Об этом супер БТР известно немного, но он оснащен 40-мм пушкой и может перевозить 12 человек."
 SOV_APC_8_short: "Курганец-45"
 SOV_Heavy_Anti_tank_1: "9П133 «Малютка»"
 SOV_Heavy_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах. Эффективная дальность — 500–3000 м."
 SOV_Heavy_Anti_tank_2: "9П148 «Конкурс»"
 SOV_Heavy_Anti_tank_3: "9М123 «Хризантема»"
 SOV_Heavy_Anti_tank_4: "«Корнет-ДМ»"
 SOV_IFV_1: "БМП-1"
 SOV_IFV_1_desc: "БМП-1 — советская гусеничная боевая машина пехоты-амфибия. Использовалась во время советско-афганской войны для перевозки войск и борьбы с джихадистами. Вооружена 73-мм орудием 2А28 и пусковой установкой ПТУР."
 SOV_IFV_1_short: "БМП-1"
 SOV_IFV_2: "БМП-2"
 SOV_IFV_2_desc: "Самый большой страх джихадистов — это БМП-2, чрезвычайно быстрая и эффективная с 30-мм пушкой и гусеницами."
 SOV_IFV_2_short: "БМП-2"
 SOV_IFV_3: "БМП-2М"
 SOV_IFV_3_short: "БМП-2М"
 SOV_IFV_4: "БМП-3"
 SOV_IFV_4_desc: "БМП-3 — советская боевая машина пехоты, преемница БМП-1 и БМП-2. Стрельба из 100-мм пушки тяжелыми фугасными снарядами."
 SOV_IFV_4_short: "БМП-3"
 SOV_IFV_5: "БМП-3М"
 SOV_IFV_5_desc: "БМП-3М — советская боевая машина пехоты, преемница БМП-1 и БМП-2 и вариант БМП-3. Использует модернизированную пушку и двигатель."
 SOV_IFV_5_short: "БМП-3М"
 SOV_IFV_6: "Т-15 «Армата»"
 SOV_IFV_6_desc: ""
 SOV_IFV_6_short: "Т-15"
 SOV_IFV_7: "Т-15М"
 SOV_IFV_7_short: "Т-15М"
 SOV_IFV_8: "Т-16"
 SOV_IFV_8_short: "Т-16"
 SOV_Anti_tank_1: "РПГ-7"
 SOV_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах."
 SOV_Anti_tank_2: "9К111 «Фагот»"
 SOV_Anti_tank_2_desc: "Гораздо легче и старше других ПТРК. Эта ПТУР поражает цели лишь на дальности 70–2500 м, что значительно меньше, чем у других комплексов, зато она дешевле."
 SOV_Anti_tank_3: "9М133М «Корнет-М»"
 SOV_Anti_tank_4: "9М134М «Булат-М»"
 SOV_MBT_1: "Т-55"
 SOV_MBT_1_desc: "Т-54/55, пожалуй, самый массовый танк в мире. Разработанный и производившийся в первые годы холодной войны, он был воплощением мощи и основой Красной армии. Когда-то внушавший страх как символ русской мощи, он стал хрестоматийным образом ближневосточных бронетанковых войск, уничтожаемых американскими авиаударами."
 SOV_MBT_1_short: "Т-55"
 SOV_MBT_2: "Т-72"
 SOV_MBT_2_desc: "Т-72, пожалуй, самая успешная разработка, созданная Россией. Это была вершина советской военной мощи на завершающем этапе холодной войны, производившаяся тысячами и служащая основой российской армии даже сегодня. Хотя она стала печально известной из-за своих катастрофических неудач в конфликтах на Ближнем Востоке, Т-72 по-прежнему используется в качестве платформы для разработки будущих российских танков и постоянно подвергается модификациям и обновлениям, чтобы соответствовать стандартам современной войны. Не стоит недооценивать танк, который когда-то был копьём советских войск."
 SOV_MBT_2_short: "Т-72"
 SOV_MBT_3: "Т-80"
 SOV_MBT_3_desc: "Этот танк стоимостью $2 млн — настоящий зверь поля боя — использовал ту же пушку, что и Т-72, но с дополнительной бронёй и ПТУР «Кобра»."
 SOV_MBT_3_short: "Т-80"
 SOV_MBT_4: "Т-90"
 SOV_MBT_4_desc: "Т-90 — российский основной боевой танк, созданный как глубокая модернизация Т-72Б и принятый на вооружение в 1992 году. Он получил систему управления огнём на базе аппаратуры Т-80У, комплекс оптико-электронного подавления «Штора-1» и встроенную динамическую защиту «Контакт-5», что заметно подняло его защищённость. Вооружение — 125-мм гладкоствольная пушка 2А46М с автоматом заряжания, способная запускать управляемые ракеты через ствол. Т-90 стал самым массовым российским танком постсоветского периода и одним из главных экспортных образцов."
 SOV_MBT_4_short: "Т-90"
 SOV_MBT_5: "Т-14 «Армата»"
 SOV_MBT_5_desc: "Самый передовой боевой танк в российской армии с гладкими очертаниями и мощной 152-мм пушкой."
 SOV_MBT_5_short: "Т-14"
 SOV_MBT_7: "Т-14М"
 SOV_MBT_7_short: "Т-14М"
 SOV_MBT_8: "Т-99 «Чёрный орёл»"
 SOV_MBT_8_short: "Т-99"
 SOV_mbt_equipment_0: "Т-62"
 SOV_mbt_equipment_1: "Т-72"
 SOV_mbt_equipment_2: "Т-90М"
 SOV_mbt_equipment_3: "Т-14"
 SOV_mbt_equipment_4: "Т-24"
 SOV_Rec_tank_0: "ПТ-76"
 SOV_Rec_tank_0_desc: "Этот сверхбыстрый лёгкий амфибийный танк может подкрасться к вражеским позициям через реку и устроить ад. С 76,2-мм нарезной танковой пушкой Д-56Т."
 SOV_Rec_tank_0_short: "ПТ-76"
 SOV_Rec_tank_1: "2С25 «Спрут-СД»"
 SOV_Rec_tank_1_desc: "Эта самоходная противотанковая пушка-амфибия может подкрасться к вражеским танкам и открыть огонь из своей 125-мм пушки, такой же, как у Т-72 и Т-80."
 SOV_Rec_tank_1_short: "2С25 «Спрут-СД»"
 SOV_Rec_tank_2: "БМПТ «Терминатор»"
 SOV_Rec_tank_2_desc: "Вероятно, одна из самых смертоносных «стеклянных пушек», когда-либо созданных. Она не может противостоять танку, но может уничтожить целую колонну. Имеет 4 130-мм пусковые установки и 2 30-мм автоматические пушки."
 SOV_Rec_tank_2_short: "БМПТ «Терминатор»"
 SOV_Rec_tank_3: "К-18 «Бумеранг»"
 SOV_Rec_tank_3_desc: "Впервые «Бумеранг» был представлен как экономичный БТР и БМП для современной российской армии. Однако «Бумеранг» будет использоваться и как специализированная противотанковая платформа, оснащенная 125-мм пушкой, подробности о которой были представлены в 2018 году. Как и американский Stryker MGS, «Бумеранг» будет выполнять функции машины огневой поддержки, подобно БМПТ."
 SOV_Rec_tank_4: "Разведывательный танк 2025 года"
 SOV_Rec_tank_4_short: "Разведывательный танк 2025 года"
 SOV_Rec_tank_5: "Разведывательный танк 2035 года"
 SOV_Rec_tank_5_short: "Разведывательный танк 2035 года"
 SOV_SP_Anti_Air_0: "ЗСУ-23-4 «Шилка»"
 SOV_SP_Anti_Air_1: "9К35 «Стрела-10»"
 SOV_SP_Anti_Air_2: "2К22 «Тунгуска»"
 SOV_SP_Anti_Air_2_desc: "Выпуская до 8 ракет, эта машина может уничтожить любой самолёт, который попадётся на её пути. Более того, она может также разорвать транспортные самолёты своими автоматическими пушками."
 SOV_SP_Anti_Air_3: "Панцирь-С1М"
 SOV_SP_Anti_Air_4: "Панцирь-С4Л"
 SOV_SP_R_arty_0: "БМ-21 «Град»"
 SOV_SP_R_arty_0_desc: "Этот дедушка ЗРК и РСЗО мало применяется в современных операциях — в основном он использовался во Второй мировой войне и в Афганистане. Эффективная дальность — 20 км."
 SOV_SP_R_arty_1: "БМ-30 «Смерч»"
 SOV_SP_R_arty_1_desc: "Эта машина — более современная версия «Града», способная действовать где угодно в мире: в снегах, во льдах или в пустыне. Эффективная дальность стрельбы — 35 км."
 SOV_SP_R_arty_2: "9А52-4 «Торнадо»"
 SOV_SP_R_arty_2_desc: "Чрезвычайно тяжелая артиллерийская батарея, которая, если её не остановить, способна разрушить целые города. Максимальная дальность — до 90 км."
 SOV_SP_arty_0: "2С1 «Гвоздика»"
 SOV_SP_arty_0_desc: "2С1 «Гвоздика» — советская самоходная гаубица на базе многоцелевого шасси МТ-ЛБу, оснащённая 122-мм гаубицей 2А18. «2С1» — её индекс по ГРАУ. Альтернативное российское обозначение — САУ-122, но в российской армии она обычно известна как «Гвоздика»."
 SOV_SP_arty_1: "2С3 «Акация»"
 SOV_SP_arty_1_desc: "Вооружённая 152,4-мм пушкой Д-22, способной при необходимости «выстрелить в солнце с небес». Это выдающаяся артиллерийская батарея с дальностью стрельбы до 50 км."
 SOV_SP_arty_2: "2С19М2 «Мста-СМ»"
 SOV_SP_arty_2_desc: "2С19 «Мста-С» была разработана в конце холодной войны: в ней применены новые технологии и увеличена дальность стрельбы по сравнению с предшественницей."
 SOV_SP_arty_3: "2С35 «Коалиция-СВ»"
 SOV_SP_arty_3_desc: "2С35 — это настоящая артиллерийская платформа 21-го века с широкой автоматизацией, автоматическим выбором типа снарядов и унифицированными системами управления и контроля."
 SOV_SP_arty_4: "2С38 «Коалиция-М»"
 SOV_artillery_1: "Д-30"
 SOV_artillery_1_desc: "122-мм буксируемая артиллерия, применявшаяся советскими войсками во многих войнах. Дальность стрельбы — 15–25 км."
 SOV_artillery_2: "2А65 «Мста-Б»"
 SOV_artillery_3: "Д-40"
 SOV_artillery_4: "Д-50"
