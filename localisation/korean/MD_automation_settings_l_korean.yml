l_korean:
 AUTOMATION_SETTINGS_OPEN_TT: "자동화 설정 열기"
 AUTOMATION_SETTINGS_TITLE: "자동화 설정"
 AUTOMATION_SETTINGS_DESC: "반복되는 행동과 알림 설정을 하나의 패널에서 관리합니다. 다른 곳에 위치한 기존 제어 기능도 그대로 사용할 수 있습니다."
 AUTOMATION_SETTINGS_GENERAL_PAGE: "일반"
 AUTOMATION_SETTINGS_SPACE_PAGE: "인공위성"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "영향력"
 AUTOMATION_SETTINGS_SPACE_DESC: "인공위성 자동 생산, 발사 및 위성군 업그레이드를 설정합니다."
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "외국의 영향력으로부터 정부를 방어하는 반복 행동을 설정합니다."
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "[!automation_space_save_button_click_enabled]우주 프로그램에 대기 중인 탑재체 목록을 §Y커스텀§! 계획으로 저장하고 전환합니다."
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "[!automation_space_upgrade_button_click_enabled]현재 궤도 적용 범위가 지원되는 곳마다 각 위성군을 최근 연구된 최신 세대로 업그레이드합니다."
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "알림 및 환경 설정"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "경제"
 AUTOMATION_SETTINGS_UN_HEADER: "국제연합(United Nations)"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "외교"
 AUTOMATION_SETTINGS_NATO_HEADER: "나토(NATO)"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "에너지"
 AUTOMATION_SETTINGS_PP_RESERVE: "정치력 비축량"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "정치력을 소모하는 자동화 행동은 정치력이 이 비축량 미만으로 떨어지지 않고 비용을 지불할 수 있을 때까지 대기합니다. 수동 행동은 영향을 받지 않습니다.\n\n£click_left §Y좌클릭§!: §Y1§! 조절\n£key_ctrl + £click_left §YCtrl + 좌클릭§!: §Y10§! 조절\n£key_shift + £click_left §YShift + 좌클릭§!: §Y100§! 조절"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §Y좌클릭§!: §Y1§! 증가\n£key_ctrl + £click_left §YCtrl + 좌클릭§!: §Y10§! 증가\n£key_shift + £click_left §YShift + 좌클릭§!: §Y100§! 증가"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §Y좌클릭§!: §Y1§! 감소\n£key_ctrl + £click_left §YCtrl + 좌클릭§!: §Y10§! 감소\n£key_shift + £click_left §YShift + 좌클릭§!: §Y100§! 감소"
 AUTOMATION_SETTINGS_CORRUPTION: "부패 제안 자동 거절"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "부패 제안을 자동으로 건너뜁니다. 활성화되어 있는 동안에는 관련 이벤트와 보상이 표시되지 않습니다."
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "해외 선거 알림"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "다른 국가의 선거에 관한 뉴스 알림을 표시합니다."
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "영향력 공격 알림"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "다른 국가 간의 영향력 공격에 대한 이벤트를 표시합니다. 비활성화하더라도 우리를 향한 공격은 계속 보고됩니다."
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "월간 자동 영향력 보고서"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "자동 영향력의 영향을 받은 국가 목록을 보여주는 월간 보고서를 표시합니다."
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "투자 제안 자동 수락"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "들어오는 모든 국제 투자 제안을 자동으로 수락합니다. 이를 활성화하면 자동 거절은 비활성화됩니다."
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "투자 제안 자동 거절"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "들어오는 모든 국제 투자 제안을 자동으로 거절합니다. 이를 활성화하면 자동 수락은 비활성화됩니다."
 AUTOMATION_SETTINGS_REINVESTMENT: "국제 투자 재투자"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "국제 투자로 얻는 주간 수익을 국고와 재투자에 어떻게 분배할지 선택합니다."
 AUTOMATION_SETTINGS_REINVEST_OFF: "끔"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "모든 국제 투자 수익을 국고로 보냅니다."
 AUTOMATION_SETTINGS_REINVEST_FULL: "전액"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "모든 국제 투자 수익을 전액 재투자합니다."
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "분할"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "국제 투자 수익의 절반은 국고로 보내고 나머지 절반은 재투자합니다."
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "연료 자동 구매"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "즉시 연료를 구매한 후 28일마다 확인하여 연료 비축량이 20% 미만으로 떨어질 때마다 다시 구매합니다. 비활성화하면 향후 구매를 취소합니다."
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "선택한 내부 투자 반복"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "활성화되어 있는 동안 매일 £pol_power §R0.15§!의 정치력을 소모합니다. 주(State) 화면에서 내부 투자 버튼을 우클릭하여 반복할 주와 투자 유형을 선택할 수 있습니다. 선택된 투자는 매주 점검되며, 슬롯이 비어 있고 국고로 현재 비용을 지불할 수 있으며 정치력 비축량을 유지할 수 있을 때 실행됩니다."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "남극 기지 자동 보급"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "남극 기지의 연료 잔여량이 11월~3월에는 15일 이하, 4월~10월에는 30일 이하일 때 자동으로 연료를 주문합니다. 보급 비용은 §R연료 1000당 2억 5천만 달러($0.25b)§!이며, 남극의 겨울철에는 2배로 증가합니다. 주문은 국고로 전체 비용을 지불할 수 있을 때까지 대기합니다."
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "자동 소비 정책"
 AUTOMATION_SETTINGS_SC_VOTE: "안보리 기본 투표"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "안전보장이사회 결의안에 자동으로 투표할 방식을 선택합니다. 선택된 옵션을 다시 클릭하면 수동 투표로 돌아갑니다."
 AUTOMATION_SETTINGS_GA_VOTE: "총회 기본 투표"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "유엔 총회 결의안에 자동으로 투표할 방식을 선택합니다. 선택된 옵션을 다시 클릭하면 수동 투표로 돌아갑니다."
 AUTOMATION_SETTINGS_VOTE_YES: "찬성"
 AUTOMATION_SETTINGS_VOTE_NO: "반대"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "기권"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "모든 안전보장이사회 결의안에 자동으로 찬성 투표합니다."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "모든 안전보장이사회 결의안에 자동으로 반대 투표합니다. 상임이사국인 경우 거부권을 행사합니다."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "모든 안전보장이사회 결의안에 자동으로 기권합니다."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "모든 유엔 총회 결의안에 자동으로 찬성 투표합니다."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "모든 유엔 총회 결의안에 자동으로 반대 투표합니다."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "모든 유엔 총회 결의안에 자동으로 기권합니다."
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "AI 위성 접근 제안 차단"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "AI 국가가 군사 및 민간 위성 시스템에 대한 공유 접근 권한을 제안하지 못하도록 차단합니다. 플레이어의 제안은 계속 받을 수 있습니다."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "나토 가입 자동 비준"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "나토 가입 후보국을 비준하기 위해 자동으로 £pol_power §Y20§!의 정치력을 소모합니다. 비준은 정치력 비축량을 유지할 수 있을 때까지 대기합니다."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "영향력 방어"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "외국 영향력 자동 대응"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "활성화되어 있는 동안 매일 £pol_power §R0.05§!의 정치력을 소모합니다. 가능할 때마다 £pol_power §Y100§!의 정치력을 소모하여 국내 자주성을 §G2.5%§! 증가시킵니다. 100일마다 반복됩니다. 정부가 로비를 받고 있거나 비용 지불 시 정치력이 비축량 미만으로 떨어질 경우 자동화가 일시 정지됩니다."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "외국 영향력 행사국 자동 공격"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "활성화되어 있는 동안 매일 £pol_power §R0.05§!의 정치력을 소모합니다. 자동으로 £pol_power §Y125§!의 정치력을 소모하여 조건에 맞는 가장 강력한 외국 영향력 행사국을 상대로 60일간의 캠페인을 시작합니다. 한 번에 하나의 캠페인만 진행됩니다. 부적격, 로비 중, 쿨다운 상태인 대상은 건너뜁니다. 비용 지불 시 정치력이 비축량 미만으로 떨어질 경우 자동화가 일시 정지됩니다."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "각 옵션을 활성화할 때마다 매일 £pol_power §R0.05§!가 소모됩니다. 두 옵션을 모두 켜면 매일 £pol_power §R0.10§!가 소모됩니다."
 AUTOMATION_SETTINGS_ECONOMY_PAGE: "경제"
 AUTOMATION_SETTINGS_ECONOMY_DESC: "자동으로 관리할 세금 및 공공 지출을 선택합니다. 변경 사항은 매주 검토되며 정치력 비축량을 준수합니다."
 AUTOMATION_SETTINGS_TAX_HEADER: "세율"
 AUTOMATION_SETTINGS_BUDGET_HEADER: "예산 법률"
 AUTOMATION_SETTINGS_TAX_SUMMARY: "활성화된 세금은 예산 수지, 부채 및 안정도에 따라 매주 최대 1%p씩 조정됩니다.\n\n수동으로 변경하더라도 자동화 상태는 유지됩니다."
 AUTOMATION_SETTINGS_BUDGET_SUMMARY: "활성화된 예산은 예상 지출 수준을 향해 한 단계씩 조정됩니다. 매주 최대 하나의 예산만 순환 우선순위에 따라 변경됩니다. 예산 증액에는 흑자가 필요합니다. 수동으로 법률을 변경하더라도 자동화 상태는 유지됩니다."
 AUTOMATION_SETTINGS_POPULATION_TAX: "주민세: [?population_tax_rate|0]%"
 AUTOMATION_SETTINGS_CORPORATE_TAX: "법인세: [?corporate_tax_rate|0]%"
 AUTOMATION_SETTINGS_POPULATION_TAX_TT: "예산 수지, 부채, 안정도를 고려하여 매주 주민세를 1%p씩 자동으로 조정합니다. 세금 변경 제한 사항을 준수하며 비축량 이상의 일반적인 정치력 비용을 지불합니다. 수동으로 세금을 변경하더라도 이 옵션은 계속 유지됩니다."
 AUTOMATION_SETTINGS_CORPORATE_TAX_TT: "예산 수지, 부채, 사용 가능한 민간 공장을 고려하여 매주 법인세를 1%p씩 자동으로 조정합니다. 세금 변경 제한 사항을 준수하며 비축량 이상의 일반적인 정치력 비용을 지불합니다. 수동으로 세금을 변경하더라도 이 옵션은 계속 유지됩니다."
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY: "행정: [?bureau_law|0] / [?expected_adm_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_BUREAUCRACY_TT: "행정 예산을 예상 지출 수준에 맞추어 한 단계씩 자동으로 조정합니다. 숫자는 현재 수준과 예상 수준을 나타냅니다. 일반적인 법률 제한과 정치력 비용이 적용됩니다. 증액에는 흑자가 필요하며 파산 위험 시 일시 정지됩니다. 정치력 비축량은 유지됩니다. 수동으로 법률을 변경하더라도 이 옵션은 계속 유지됩니다."
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING: "치안: [?police_law|0] / [?expected_police_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_CRIME_FIGHTING_TT: "치안 예산을 예상 지출 수준에 맞추어 한 단계씩 자동으로 조정합니다. 숫자는 현재 수준과 예상 수준을 나타냅니다. 일반적인 법률 제한과 정치력 비용이 적용됩니다. 증액에는 흑자가 필요하며 파산 위험 시 일시 정지됩니다. 정치력 비축량은 유지됩니다. 수동으로 법률을 변경하더라도 이 옵션은 계속 유지됩니다."
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET: "교육: [?education_law|0] / [?expected_edu_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_EDUCATION_BUDGET_TT: "교육 예산을 예상 지출 수준에 맞추어 한 단계씩 자동으로 조정합니다. 숫자는 현재 수준과 예상 수준을 나타냅니다. 일반적인 법률 제한과 정치력 비용이 적용됩니다. 증액에는 흑자가 필요하며 파산 위험 시 일시 정지됩니다. 정치력 비축량은 유지됩니다. 수동으로 법률을 변경하더라도 이 옵션은 계속 유지됩니다."
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET: "보건의료: [?health_law|0] / [?expected_health_spending|0]"
 AUTOMATION_SETTINGS_BUDGET_HEALTH_BUDGET_TT: "보건의료 예산을 예상 지출 수준에 맞추어 한 단계씩 자동으로 조정합니다. 숫자는 현재 수준과 예상 수준을 나타냅니다. 일반적인 법률 제한과 정치력 비용이 적용됩니다. 증액에는 흑자가 필요하며 파산 위험 시 일시 정지됩니다. 정치력 비축량은 유지됩니다. 수동으로 법률을 변경하더라도 이 옵션은 계속 유지됩니다."
 AUTOMATION_SETTINGS_BUDGET_SOCIAL_BUDGET: "복지: [?social_law|0] / [?expected_welfare_spending|0]"
