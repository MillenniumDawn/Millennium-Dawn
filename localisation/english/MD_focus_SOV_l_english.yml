 SOV_democracy_in_trk_desc: "A staff study of what we would do if Ashgabat's succession turned into a fight over the gas fields."
 SOV_democracy_in_uzb: "Contingency Plan: [UZB.GetNameWithFlag]"
 SOV_democracy_in_uzb_desc: "A staff study for the Fergana Valley, which Tashkent will not let us enter without a crisis."
 sov_foreign.1.t: "The Union State Roadmap"
 sov_foreign.1.d: "Moscow has tabled the first stage of the Union State: a joint council, a budget chamber and a coordinating ministry. Our president can sign it and keep the gas flowing, or tell Moscow that Belarus wants Russian energy prices for any union."
 sov_foreign.1.a: "Sign the roadmap"
 sov_foreign.1.b: "The price is gas at domestic rates"
 sov_foreign.2.t: "Minsk Names Its Price"
 sov_foreign.2.d: "Belarus will sign the first stage of the Union State if we sell it gas and oil at Russian domestic prices. The cost is real, but the alternative is a long argument with a man who likes arguing."
 sov_foreign.2.a: "Pay the price"
 sov_foreign.2.b: "Raise the oil export duty"
 sov_foreign.3.t: "A Single Currency?"
 sov_foreign.3.d: "Moscow wants the Russian ruble as the common currency, a shared civil code and a single economic space. Belarus would give up its central bank and a large share of its sovereignty."
 sov_foreign.3.a: "Sign the second stage"
 sov_foreign.3.b: "Not without compensation"
 sov_foreign.4.t: "Minsk Wants Paying for the Ruble"
 sov_foreign.4.d: "Belarus will adopt the ruble only if we cover the cost of replacing its currency and write off its debt to Gazprom. Refusing means a public quarrel, and Minsk can make it loud."
 sov_foreign.4.a: "Cover the cost"
 sov_foreign.4.b: "Remind them who holds the debt"
 sov_foreign.5.t: "Gazprom Closes the Valve"
 sov_foreign.5.d: "Russia has stopped gas deliveries to Ukraine and demands a market price. European buyers downstream are already calling Kyiv, which also owes Gazprom for last year."
 sov_foreign.5.a: "Pay the new price"
 sov_foreign.5.b: "Hold out and appeal to Brussels"
 sov_foreign.6.t: "The Kozak Memorandum"
 sov_foreign.6.d: "Moscow offers a federal Moldova with Transnistria as a guarantor of every decision. Russian troops would stay for twenty years. Opposition parties call it a surrender, and Voronin has to answer."
 sov_foreign.6.a: "Sign the memorandum"
 sov_foreign.6.b: "Walk away from it"
 sov_foreign.7.t: "A Russian Presence"
 sov_foreign.7.d: "Moscow asks for access to our airfields and ports, with rent and a pledge of protection. The bases would serve Russian operations beyond our borders, and our neighbors will notice."
 sov_foreign.7.a: "Accept the rent and the base"
 sov_foreign.7.b: "Refuse"
 sov_foreign.8.t: "The Customs Union"
 sov_foreign.8.d: "Russia invites us to a common external tariff with no checks at the border. Our exporters want the Russian market, and our finance ministry fears the revenue loss."
 sov_foreign.8.a: "Join the Customs Union"
 sov_foreign.8.b: "Stay outside"
 sov_foreign.9.t: "Power of Siberia 2"
 sov_foreign.9.d: "Russia offers a second gas pipeline to China, paid in part in yuan. Beijing can lock in a thirty-year price far below the one Europe pays."
 sov_foreign.9.a: "Sign at our price"
 sov_foreign.9.b: "Not at that price"
 sov_foreign.10.t: "New START"
 sov_foreign.10.d: "Moscow proposes a treaty cutting deployed strategic warheads to 1,550 each, with inspections and a research partnership in civil industry. Hawks in Congress say the treaty costs us more than it costs them."
 sov_foreign.10.a: "Sign in Prague"
 sov_foreign.10.b: "Let it lapse"
 sov_foreign.11.t: "The Eurasian Economic Union"
 sov_foreign.11.d: "Russia invites us into a full economic union with common rules and a supranational commission in Moscow. Members trade freely, but our budget policy would answer to Russia as well."
 sov_foreign.11.a: "Join the Union"
 sov_foreign.11.b: "Stay outside"
 sov_foreign.12.t: "Gazprom Offers a Long Contract"
 sov_foreign.12.d: "Moscow proposes a twenty-year purchase contract for Turkmen gas, with Russian money for the Galkynysh field in advance. Ashgabat would gain a reliable buyer and lose its leverage with other customers."
 sov_foreign.12.a: "Sign the contract"
 sov_foreign.12.b: "Keep our options open"


 rosgvardia_wagner: "Yevgeny Prigozhin was killed"

 SOV_wagner_rosguard_idea: "PMCs Wagner as part of Rosgvardia"
 SOV_rosguard_wagner: "Accept the Wagner PMCs into the Rosgvardiya"
 SOV_rosguard_wagner_desc: "After the death of Yevgeny Prigozhin, his PMCs began to fall apart: some remained in Belarus, many quit, but others are ready to come under our direct control. We are prepared to integrate them into the Rosgvardiya."

 ##########ARMY TREE##########
 ##########Focuses##########

 SOV_groznyy_offensive: "The Grozny Offensive"
 SOV_groznyy_offensive_desc: "Federal troops fought for Grozny from December 1999 and held it by February 2000, at a heavy cost. The army has real combat experience for the first time since Afghanistan, and the republic still has to be settled."
 SOV_finish_1998_reforms: "Finish the 1998 Reforms"
 SOV_finish_1998_reforms_desc: "After the August 1998 default the Defense Ministry could not pay its officers for months. We clear the wage arrears and put military spending under Finance Ministry control."
 SOV_2001_military_reforms: "The 2001 Military Reforms"
 SOV_2001_military_reforms_desc: "Sergei Ivanov, the first civilian defense minister, cuts the Strategic Rocket Forces and forces the General Staff to accept a smaller, cheaper army."


 SOV_2008_military_reforms: "The 2008 Military Reforms"
 SOV_2008_military_reforms_desc: "The old Soviet command structure is finally wound up, whichever way we chose to reform. The August 2008 war in Georgia shows which parts of the army worked and which did not."


 SOV_kosmo_voiska: "Plesetsk Space Complex"
 SOV_kosmo_voiska_desc: "Plesetsk in Arkhangelsk Oblast launches most military satellites, and its radars watch the northern approaches. The state pays for the cosmodrome's upgrades and the rocket plants that supply it."
 SOV_space_troops: "The Space Forces"
 SOV_space_troops_desc: "In June 2001 the Space Forces became a separate arm, taking over launches from Plesetsk and the missile warning network."
 SOV_russian_airspace_forces: "Aerospace Forces"
 SOV_russian_airspace_forces_desc: "The Air Force merges with the Air Defense and Space forces under a single command for aircraft, missiles and satellites."

 SOV_airforce_far_aviation: "Long-Range Aviation"
 SOV_airforce_far_aviation_desc: "Tu-95, Tu-160 and Tu-22M3 crews fly again after years on the ground. The command gets spares, fuel and a modernization program, with the PAK DA planned to replace the old airframes."
 SOV_airforce_transport_aviation: "Military Transport Aviation"
 SOV_airforce_transport_aviation_desc: "The Il-76MD-90A replaces an aging fleet that could not lift a brigade. Airlift decides whether the paratroopers reach their target in days or weeks."

 SOV_air_rocket_defence: "Aerospace Defense"
 SOV_air_rocket_defence_desc: "S-400 Triumf regiments ring Moscow, Kaliningrad and the Kola Peninsula. The system reaches 400 kilometres and forces any opponent to plan around it."
 SOV_missile_defense_investments: "Missile Warning and Defense"
 SOV_missile_defense_investments_desc: "Voronezh radars replace the old Soviet Daryal stations, and the A-135 system around Moscow is rebuilt."


 SOV_fighter_production: "Strengthen the Production of Fighters"
 SOV_fighter_production_desc: "More fighters mean a safer and more peaceful sky."

 SOV_uav_production: "Expand the Production of Drones"
 SOV_uav_production_desc: "We aim to have drones widely deployed across our forces."

 SOV_bombers_production: "Increase Bomber Production"
 SOV_bombers_production_desc: "Our enemies will be overwhelmed by the might of our bombers."

 SOV_pakfa: "PAK FA and the Su-57"
 SOV_pakfa_desc: "The T-50 first flew in January 2010 and later became the Su-57. Komsomolsk-on-Amur builds it, and Sukhoi needs either a partner or a very large budget to finish it."



 SOV_hypersonic_missiles: "Hypersonic Weapons"
 SOV_hypersonic_missiles_desc: "The air-launched Kinzhal and the Avangard glide vehicle are meant to defeat any missile defence. Their value is political first and military second."

 SOV_space_forces_improvement: "More Investment in Aviation"
 SOV_space_forces_improvement_desc: "We will increase funding for our space troops."

 SOV_mechanized_infantry_renovations: "Mechanized Infantry Renovation"
 SOV_mechanized_infantry_renovations_desc: "BMP-3 and BTR-82 upgrades come first, then the Kurganets-25 and Bumerang platforms from Kurganmash. The motor-rifle brigades get new armored vehicles before the tank units do."

 SOV_armata_universal_combat_platform: "The Armata Platform"
 SOV_armata_universal_combat_platform_desc: "The T-14 Armata promises an unmanned turret, active protection and a family of vehicles on one chassis. It is also expensive, and its first appearance on Red Square will force a decision on how many we can afford."

 SOV_reform_army: "New Army Reform"
 SOV_reform_army_desc: "It's time to modernize our army to meet contemporary warfare standards."





 SOV_railway_troops: "Railway Troops"
 SOV_railway_troops_desc: "Russia fights on its railways, and the Railway Troops rebuild track and bridges behind the advance."


 SOV_arta: "Artillery is the God of War"
 SOV_arta_desc: "We will maintain the Soviet-era principle of artillery supremacy, ensuring our artillery remains the best."

 SOV_mechanize: "Mechanization of the Army"
 SOV_mechanize_desc: "Our army must be mobile and mechanized, and we will dedicate all efforts to achieve this."

 SOV_ratnik_program: "The Ratnik Program"
 SOV_ratnik_program_desc: "Ratnik is a complete kit for the infantryman: body armor, helmet, radio, night sights and a modern rifle. Rostec runs the program and the Defense Ministry wants it fielded by 2015."
 SOV_rostech: "Rostec"
 SOV_rostech_desc: "KAMAZ trucks, Kazan helicopter plants and a new arms line now share one industrial park in Tatarstan. Chemezov's managers promise civilian spin-offs from every military contract."





 SOV_rosgvardia: "Rosgvardia"
 SOV_rosgvardia_desc: "In April 2016 Putin created the National Guard from the internal troops, OMON and SOBR, under Viktor Zolotov and answerable to the president alone. The army sees a rival force with its own tanks."









 SOV_The_high_seas_fleet: "The High Seas Fleet"
 SOV_The_high_seas_fleet_desc: "A blue-water navy needs carriers, destroyers and the tankers to supply them. The yards at Severodvinsk and St Petersburg start on a real programme."


















 SOV_leib_guard: "The Leib-Guard"
 SOV_leib_guard_desc: "A household guard of picked special forces is raised in Saint Petersburg and equipped from a new plant on the Neva. It answers to the sovereign and nobody else, which is the point."





 ##########Ideas##########
 SOV_army_mto: "Logistical Support of the Russian Armed Forces"
 SOV_army_ipso: "Information Operations Troops"
 SOV_army_anti_air: "Air Defense Troops of Ground Forces"
 SOV_army_engineer: "Engineer Troops"
 SOV_army_railway: "Railway Troops"
 SOV_army_radioelectric: "Electronic Warfare Troops"
 SOV_russian_spaceforce: "Russian Space Forces"
 SOV_far_aviation_idea: "Long-Range Aviation Command"
 SOV_transport_aviation_idea: "Military Transport Aviation"
 SOV_air_missile_defence_idea: "Air and Missile Defense Forces"
 SOV_anti_aircraft_forces_idea: "Anti-Aircraft Missile Forces"
 SOV_radio_technical_troops_idea: "Radio-Technical Troops"
 SOV_russian_satellite_idea: "The Russian Satellite Grouping"
 SOV_rocket_forces_idea: "Strategic Rocket Forces"
 SOV_outdated_army_idea: "£text_icon_sov_army Outdated Army"
 SOV_outdated_army_idea_desc: "The Russian Army is a shadow of its former self, short of modern equipment and of the money to train the conscripts it still calls up.\n§W--------------§!\nThis national spirit will §GImprove§! with the §Y$SOV_finish_1998_reforms$§! focus."
 SOV_outdated_army_idea_1: "£text_icon_sov_army Outdated Army"
 SOV_outdated_army_idea_1_desc: "The worst of the 1998 collapse has been dealt with, but the army still fights with Soviet stocks and a conscript intake it cannot train properly.\n§W--------------§!\nThis national spirit will §GImprove§! with the §Y$SOV_2001_military_reforms$§! focus."
 SOV_outdated_army_idea_2: "£text_icon_sov_army Outdated Army"
 SOV_outdated_army_idea_2_desc: "The army is smaller and cheaper after the 2001 reforms, but it still keeps the Soviet divisions and the officers who commanded them.\n§W--------------§!\nThis national spirit will §GImprove§! with the §Y$SOV_serdyukov_new_look$§! focus, or be §RRemoved§! by the §Y$SOV_2008_military_reforms$§! focus."
 SOV_outdated_army_idea_3: "£text_icon_sov_army Outdated Army"
 SOV_outdated_army_idea_3_desc: "What remains is an officer corps trained for a war that no longer exists, and a reserve system that produces numbers rather than soldiers.\n§W--------------§!\nThis national spirit will be §RRemoved§! by the §Y$SOV_2008_military_reforms$§! focus."
 SOV_russian_airforce_idea_1: "£text_icon_sov_army Russian Air Force"
 SOV_russian_airforce_idea_1_desc: "The Air Force flies a fleet it cannot fuel and trains pilots it cannot afford to keep current. Accident rates are climbing and readiness is nominal.\n§W--------------§!\nThis national spirit will §GImprove§! with each of the §Y$SOV_russian_airspace_forces$§!, §Y$SOV_airforce_transport_aviation$§! and §Y$SOV_airforce_far_aviation$§! focuses, and be §RRemoved§! by the §Y$SOV_pakfa$§! focus."
 SOV_russian_airforce_idea_2: "£text_icon_sov_army Russian Air Force"
 SOV_russian_airforce_idea_2_desc: "Flight hours are recovering and the worst of the airframe backlog has been cleared, but crew training still lags well behind what the aircraft can do.\n§W--------------§!\nThis national spirit will §GImprove§! with each of the §Y$SOV_russian_airspace_forces$§!, §Y$SOV_airforce_transport_aviation$§! and §Y$SOV_airforce_far_aviation$§! focuses, and be §RRemoved§! by the §Y$SOV_pakfa$§! focus."
 SOV_russian_airforce_idea_3: "£text_icon_sov_army Russian Air Force"
 SOV_russian_airforce_idea_3_desc: "Consolidating design and production under a single corporation has steadied the fleet, though the training pipeline is still thinner than the force it has to supply.\n§W--------------§!\nThis national spirit will §GImprove§! with each of the §Y$SOV_russian_airspace_forces$§!, §Y$SOV_airforce_transport_aviation$§! and §Y$SOV_airforce_far_aviation$§! focuses, and be §RRemoved§! by the §Y$SOV_pakfa$§! focus."
 SOV_russian_airforce_idea_4: "£text_icon_sov_army Russian Air Force"
 SOV_russian_airforce_idea_4_desc: "Little is left of the old malaise beyond a training tempo that has yet to catch up with the rest of the force.\n§W--------------§!\nThis national spirit will be §RRemoved§! by the §Y$SOV_pakfa$§! focus."
 SOV_the_plundered_russian_navy1: "The Plundered Russian Navy"
 SOV_the_plundered_russian_navy1_desc: "A decade of unpaid crews and cannibalized hulls has left most of the fleet alongside. What still sails does so on borrowed parts and shortened patrols.\n§W--------------§!\nThis national spirit will §GImprove§! with the §Y$SOV_northern_fleet$§! focus."
 SOV_the_plundered_russian_navy2: "Partially Rebuilt Fleet"
 SOV_the_plundered_russian_navy2_desc: "The yards are working again and the worst of the rust has been cut away, but the fleet is still built around hulls laid down for another navy.\n§W--------------§!\nThis national spirit will §GImprove§! with the §Y$SOV_submarine_force$§! focus."
 SOV_the_plundered_russian_navy3: "Almost Rebuilt Fleet"
 SOV_the_plundered_russian_navy3_desc: "A doctrine now exists for the fleet Russia can actually afford. Only the modernization program itself is outstanding.\n§W--------------§!\nThis national spirit will be §RRemoved§! by the §Y$SOV_The_high_seas_fleet$§! focus."
 SOV_otkos_army_idea: "Pay-off From Military Service"
 SOV_otkos_army_idea_desc: "Conscripts who can pay do not serve. The bribe money keeps the officer corps quiet and the Duma cooperative, at the cost of the intake the army was promised.\n§W--------------§!\nThis national spirit is §RLost§! if the §Y[communist_state_L]§! or the §Y[Neutral_Communism_L]§! take power."
 SOV_pmc_idea: "Russian PMCs"
 SOV_oligarch_supply_army_idea: "Outsourced Military Supply"
 SOV_oligarch_supply_army_idea_desc: "Civilian contractors now feed, fuel and house the army, which saves money and removes a generation of quartermasters. The contracts are only as honest as the people who sign them."
 SOV_idea_new_look: "The New Look Army"
 SOV_idea_new_look_desc: "Permanent-readiness brigades train faster and cost less than the old skeleton divisions. The price is a smaller conscript intake and fewer officers who remember the old system."
 SOV_idea_new_look_turmoil: "New Look Turmoil"
 SOV_idea_new_look_turmoil_desc: "Officers have been dismissed, bases closed and units renamed in a hurry. The army needs time to find its new shape."
 SOV_idea_chechen_counterinsurgency: "Chechen Counter-Terrorist Regime"
 SOV_idea_chechen_counterinsurgency_desc: "Federal prefects, checkpoints and permanent garrisons hold Chechnya. The army learns from it, and the country pays in conscripts and in unrest. §RThe regime ends through the events that follow the Direct Federal Rule focus.§!"
 SOV_idea_chechen_veterans: "Chechen War Veterans"
 SOV_idea_chechen_veterans_desc: "A generation of officers learned counterinsurgency in Chechnya and brought the habits home with them."
 SOV_leib_guard_idea: "Imperial Guard"
 SOV_leib_guard_idea_desc: "The historic guards regiments have been reconstituted as a sovereign's escort, drawing the best of the special forces into a formation that answers to the throne.\n§W--------------§!\nThis national spirit is §RLost§! if the §Y[communist_state_L]§! or the §Y[Neutral_Communism_L]§! take power."
 SOV_storm_z_idea: "Storm-Z"
 SOV_volunteer_assault_coprs_idea: "Volunteer Assault Corps"
 SOV_gazprom_pmc_idea: "Gazprom's PMCs"
 S0V_Federation_Army_idea: "Federal Army"
 SOV_military_priests: "Military Priests"
 SOV_military_priests_desc: "Regimental chaplains have been written back into the establishment, and the Patriarchate now blesses the colors of every formation that asks.\n§W--------------§!\nThis national spirit is held only while the §Y[Monarchist_L]§! or the §Y[Nat_Populism_L]§! govern, and is §RLost§! the moment anyone else does."
