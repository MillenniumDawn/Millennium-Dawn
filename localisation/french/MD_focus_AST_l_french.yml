 auslink_in_nt: "AusLink dans le Territoire du Nord"
 auslink_in_nt_desc: "Le cadre AusLink a permis par le passé de réparer et moderniser rapidement nos routes régionales. Nous pouvons réutiliser ce système pour améliorer vite les lignes logistiques de nos communautés du nord, en construisant des ponts, des axes de fret lourd et des infrastructures agricoles."
 national_partnership_agreement_ast: "Accord de partenariat national"
 national_partnership_agreement_ast_desc: "En travaillant étroitement avec les communautés autochtones du Territoire du Nord et d'Australie-Occidentale, nous pouvons lutter contre le surpeuplement grave en construisant des centaines de nouveaux logements pour les habitants. Les contrats nous vaudront aussi un peu de soutien auprès des groupes d'intérêt du logement, et du travail pour les entrepreneurs locaux."
 foundation_for_regional_renewal_ast: "Subventions de renouveau rural"
 foundation_for_regional_renewal_ast_desc: "Nous pouvons établir un partenariat conjoint entre le gouvernement fédéral et le Sydney Myer Fund pour créer un véhicule de financement agricole local. Les subventions iront aux petites entreprises de villages et aux conseils pour financer salles communales, systèmes d'eau ruraux et projets agricoles."
 grain_line_upgrades_ast: "Améliorations des lignes à grains"
 grain_line_upgrades_ast_desc: "Les gouvernements de Nouvelle-Galles du Sud et du Victoria nous ont transmis des plans de modernisation structurelle majeure des lignes céréalières de la région. Presque tous les agriculteurs régionaux les utilisent pour acheminer les récoltes vers les ports, et les moderniser pourrait fortement améliorer leur rendement et réduire le recours au transport routier, diminuant ainsi l'usure des routes."
 grain_lines_upgraded_ast: "Ligne céréalière régionale améliorée"
 peter_costello_desc: "Peu d'hommes dans l'histoire de la politique australienne sont aussi versés dans la gestion économique que Peter Costello. Oscillant entre le barreau et le conseil juridique avant d'atterrir au Parti libéral, Costello plaiderait pour une réorganisation radicale de l'économie. Il rejoindrait finalement la faction réformiste économique du parti, où il rencontrerait l'ancien chef de l'opposition John Howard. \n\nAprès l'élection de 1996, et comme chef adjoint et trésorier du gouvernement Howard, Costello supervisa sa réforme rapide. En conséquence, pour la première fois depuis plus d'une décennie, le budget était excédentaire, et ensemble ils firent passer la réforme « impossible» du système fiscal. \n\nMême lorsque la relation entre les deux commença à se détériorer, Costello ne s'éloigna jamais des leviers du pouvoir. Aujourd'hui, alors qu'il manie le plus grand levier de la nation, ses rêves de domination économique ne sont plus qu'à un pas de la réalité."
 western_mining_corp_research_ast: "Recherche de Western Mining Corp"
 ast_an_open_ear_tt: "La situation §Rclimatique§! dans notre nation peut §Rs'aggraver.§!"
 literacy_progress_the_gap_ast: "Progrès de Combler l’écart"
 literacy_progress_the_gap_ast_1: "Poursuivre l'écart"
 closing_the_gap_event.2.t: "Résultats de Closing the Gap"
 closing_the_gap_event.2.d: "Après quelques années de suivi de notre campagne d'alphabétisation et de soutien social, les résultats sont malheureusement mitigés. Si davantage d'enfants sont scolarisés et moins d'adultes incarcérés dans l'ensemble, les taux de placement hors du foyer et la délinquance juvénile augmentent régulièrement. Il semble donc que notre effort pour ramener les Australiens défavorisés vers le courant dominant soit en partie jugé un échec. \n\nNous pouvons investir davantage dans le programme pour poursuivre le travail et peut-être l'affiner, ou couper nos pertes maintenant et tout arrêter."
 closing_the_gap_event.2.a: "Poursuivre le travail."
 closing_the_gap_event.2.b: "Arrêtez-le."
 closing_the_gap_event.3.d: "Après quelques années de suivi de notre campagne d'alphabétisation et de soutien social, les résultats sont positifs. Davantage d'enfants sont scolarisés, moins d'adultes sont incarcérés dans l'ensemble, les taux de placement hors du foyer et la délinquance juvénile diminuent régulièrement. Il semble que notre effort pour ramener les Australiens défavorisés vers le courant dominant porte réellement ses fruits."
 closing_the_gap_event.3.a: "Encore un succès."
