 varyag_prepare_refit_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_refit_for_tooltip\n\n\n\n\n\n\n\n\n§WОбследовать имеющиеся механизмы и провести тендеры на электронику и оборонительное вооружение авианосца.§!"
 UKR_varyag_install_catapults: "Одобрить установку катапульт"
 UKR_varyag_install_catapults_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_refit_for_tooltip\n\n\n\n\n\n\n\n\n§WПриспособить §!§Y«Варяг»§!§W к катапультному старту до начала работ. Переоборудование позволит использовать §!§YF/A-18C Hornet§!§W и §!§YRafale M§!§W. Оно заменяет проект с трамплином для §!§YМиГ-29К§!§W.§!"
 varyag_complete_the_carrier: "Достроить §Y«Варяг»§!"
 varyag_complete_the_carrier_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_hull_for_tooltip\n\n\n\n\n\n\n\n\n§WУстановить выбранное оборудование и ввести авианосец в строй после двух лет работ. Потеря верфи §!§Rостановит строительство, а вложенные средства будут потеряны§!§W.§!"
