 SIA_strike_momentum_status_idle: "§LНе активна§!"
 SIA_strike_student_walkout: "Студенты выходят на улицы"
 SIA_strike_student_walkout_desc: "Студенты университетов Таммасат и Чулалонгкорн за сутки покидают аудитории и выходят на улицы. У тайского студенческого движения есть на то прецеденты: восстание октября 1973 года свалило правительство Танома, а бойня в Таммасате в октябре 1976 года положила конец последовавшему демократическому периоду. Мобилизация кампусов идёт быстро и почти не требует подготовки, но опустошает университеты и повышает риск столкновений.\n\nДлится §Y7 дней§!, затем повторяется через §Y20 дней§! после окончания. Стоит §R3%§! стабильности и на 30 дней замедляет исследования."
 SIA_strike_foreign_press: "Пригласить иностранную прессу"
 SIA_strike_foreign_press_desc: "Стачечный комитет организует доступ иностранным корреспондентам, выводя баррикады в новостные выпуски Токио, Лондона и Нью-Йорка. Международное внимание не помешает армии зачистить улицы, но повышает дипломатическую цену этого шага и обычно оттягивает решение. Та же огласка рекламирует неустойчивость Королевства правительствам, способным этим воспользоваться.\n\nДлится §Y7 дней§!, затем повторяется через §Y60 дней§! после окончания. Стоит §R3%§! поддержки войны и на 30 дней открывает страну иностранному влиянию."