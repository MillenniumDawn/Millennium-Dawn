 ALG_cabinet_loyal: "충성파 내각"
 ALG_cabinet_loyal_desc: "현 내각은 주로 충성파로 구성되어 있습니다. 정치적 신뢰성은 높지만 행정 인재는 부족합니다."
 ALG_cabinet_competent: "유능한 내각"
 ALG_cabinet_competent_desc: "현 내각은 유능한 기술 관료와 경험 많은 행정가로 이루어져 있습니다. 국정 운영은 효과적이지만 충성이 항상 보장되는 것은 아닙니다."
 ALG_cabinet_balanced: "균형 잡힌 내각"
 ALG_cabinet_balanced_desc: "현 내각은 정치적 신뢰성과 기술적 능력 사이에서 합리적인 균형을 이루고 있습니다."
 ALG_cabinet_reformist: "개혁파 내각"
 ALG_cabinet_reformist_desc: "현 내각은 딥 스테이트와의 연계가 제한적인 개혁 지향 인사들 쪽으로 기울어 있습니다. 국정 운영은 개선될 수 있으나 군 기득권층은 불안해하고 있습니다."
 ALG_cabinet_disloyal: "불충한 내각"
 ALG_cabinet_disloyal_desc: "핵심 내각 구성원들의 충성이 의심스럽습니다. 국정 운영은 파벌 경쟁과 불신으로 마비되어 있습니다."
 ALG_cabinet_incompetent: "무능한 내각"
 ALG_cabinet_incompetent_desc: "내각에는 행정 인재가 부족합니다. 정책 시행이 느리고 믿을 수 없습니다."
 ALG_cabinet_deep_state_dominated: "딥 스테이트 내각"
 ALG_cabinet_deep_state_dominated_desc: "내각이 군과 정보 기득권층에 깊이 침투당했습니다. 민간 통제는 기껏해야 명목상일 뿐입니다."
 ALG_economic_liberalization: "경제 자유화"
 ALG_economic_liberalization_desc: "재무부가 자유주의적 경제 개혁을 추진하여 시장을 개방하고 국가 개입을 줄이고 있습니다."
