 EUvote.1.t: "유럽연합 의회 투표 시작됨"
 EUvote.1.d: "유럽 의회(EP)에 안건이 투표에 부쳐졌습니다! 유럽연합(EU) 창의 의회 섹션을 확인하여 법안을 검토하거나 통과를 지원하십시오."
 EUvote.1.a: "투표소로!"
 EUvote.2.t: "유럽연합 이사회 투표 시작됨"
 EUvote.2.d: "유럽연합 이사회에서 신규 법안에 대한 투표가 시작되었습니다! 유로 투표 섹션을 확인하여 한 표를 행사하고 다른 국가들에게 영향력을 행사하십시오!"
 EUvote.2.a: "투표소로!"
 EUU_idea_gdpr: "일반데이터보호규정(GDPR)"
 EUU_idea_gdpr_desc: "§Y일반데이터보호규정(GDPR)§!은 유럽연합(EU) 및 유럽경제지역(EEA) 내 정보 프라이버시에 관한 유럽연합(EU) 규정입니다. 이는 유럽연합(EU) 프라이버시 및 인권법, 특히 §Y유럽연합 기본권 헌장§! 제8조 제1항의 핵심 요소로 평가받습니다. 이 규정의 주요 목적은 자신의 데이터 및 개인정보에 대한 개인이 가지는 통제권을 강화하고, 국제 비즈니스를 위한 규제 환경을 단순화하는 데 있습니다."
 foreign_data_kraken: "크라켄 역외 데이터"
 foreign_data_kraken_desc: "크라켄 역외 데이터는 일반데이터보호규정(GDPR) 이전의 법제 모음을 상징합니다. 과거의 법제들에는 허점과 사각지대가 많아 유럽연합(EU) 회원국들의 장기적인 안보에 상당한 문제를 야기했습니다."
 EU_copyright: "디지털 단일 시장 저작권 지침"
 EU_copyright_desc: "§Y디지털 단일 시장 저작권 지침§!은 저작권 시장의 원활한 작동을 보장하기 위해 채택된 유럽연합 지침입니다. 이는 유럽연합 저작권법을 확대하여 단일 디지털 시장으로 그 범위를 넓힙니다."
 asylum_shopping: "망명 쇼핑"
 asylum_shopping_desc: "전 세계에서 온 망명 신청자들이 자신들에게 가장 유리한 조건을 제공하는 국가를 찾아 유럽연합 곳곳을 전전하고 있습니다. 이는 유럽연합 전역에 행정적 하중을 야기하고 있으며, 우리는 가능한 한 빨리 이에 대한 구제책을 마련해야 합니다."
 relocation_asylum_seekers: "망명 신청자 재배치 및 재정착"
 relocation_asylum_seekers_desc: "우리는 감당하기 힘든 이민자 수를 통제하기 위해 망명 신청자들의 재배치 및 재정착을 단행했습니다. 이제 날로 커지는 이 문제에 대해 더 영구적인 해결책을 모색해야 합니다."
 EU_Turkey_deal: "유럽연합(EU)-튀르키예 협정"
 EU_Turkey_deal_desc: "유럽연합-튀르키예 협정은 튀르키예에서 그리스 섬들로 비정규적으로 이동하는 인류의 흐름을 억제하기 위해 고안되었습니다. 이는 유럽연합으로의 불법 이민을 억제하려는 기념비적인 협정이지만, 과연 이것이 망명 신청자들의 거센 파도를 막을 수 있을지는 두고 보아야 합니다."
 European_Asylum_Agency: "유럽망명청(EUAA)"
 European_Asylum_Agency_desc: "§Y유럽망명청(EUAA)§!은 망명 정책에 대한 회원국 간의 협력을 강화하고, 공동 유럽 망명 시스템(CEAS)의 이행을 개선하며, 망명 신청자들로 압박받는 회원국들을 지원하기 위해 설립된 유럽연합 산하 기관입니다."
 Frontex: "프론텍스(Frontex)"
 Frontex_desc: "공식적으로 유럽국경해안경비청(EBCG), 통칭 프론텍스(Frontex)라 불리는 이 기관은 유럽연합(EU) 산하 기관입니다. 각 회원국의 국경 및 해안 경비대와 협력하여 유럽 솅겐 지역의 국경 통제를 수행합니다."
 EU_commission_president: "유럽집행위원회(EC) 위원장"
 EU_commission_president_desc: "§Y유럽집행위원회 위원장§!은 §C[EUU.GetFlag][EUU.GetName]§! 행정부의 수반입니다. 위원장은 유럽 의회에 공동으로 책임을 지는 위원단(위원회의)을 이끌고 있습니다. 위원장은 필요에 따라 위원들 간의 포트폴리오를 분배하거나 개각 및 해임할 권한을 가집니다. 유럽집행위원회는 유럽연합 법률이 될 법안을 제안할 수 있는 유일한 기구입니다."
 EU_council_president: "유럽 정상회의 상임의장"
 EU_council_president_desc: "§Y유럽 정상회의 상임의장§!은 27개 회원국 국가원수 및 정부수반으로 구성된 유럽 정상회의의 회의를 주재하고 작업을 추진하며, 세계 무대에서 §C[EUU.GetFlag][EUU.GetName]§!을(를) 대표하는 수석 대표입니다. 이 기구는 국가원수 및 정부수반 회의와 유럽집행위원회 위원장으로 구성되며, 유럽연합 전체에 정치적 방향을 제시합니다."
 EU_parliament_president: "유럽 의회 의장"
 EU_parliament_president_desc: "§Y유럽 의회 의장§!은 유럽 의회의 토론과 활동을 주재합니다. 이들은 모든 법적 문제 및 대외 관계, 특히 국제 관계에서 유럽 의회를 대표합니다. 임기는 2년 6개월이며, 유럽연합 예산안 및 공동결정절차에 따라 채택된 연합 법안의 서명에 의장의 서명이 필수적입니다."
 frontex_ExDir: "유럽 국경·해안경비청(Frontex) 상임 이사"
 frontex_ExDir_desc: "§Y프론텍스(Frontex) 사무총장§!은 유럽국경해안경비청(EBCG, 통칭 프론텍스)을 통괄합니다. 프론텍스(Frontex)의 목적은 유럽의 대외 국경을 수호하기 위한 현장 회원국들의 노력을 지원하는 것입니다. 또한 자유·안보·정의 영역(AFSJ)을 지원하기 위해 솅겐 지역에 대한 국경 통제를 수행합니다."
 European_Defence_Fund: "유럽방위기금(EDF)"
 European_Defence_Fund_desc: "§Y유럽방위기금(EDF)§!은 유럽연합 공동안보방위정책(CSDP)의 핵심 요소 중 하나로, 방위 연구에 대한 국가적 투자를 조정·확대하고 회원국 군대 간의 상호 운용성을 높이는 것을 목표로 합니다. 특히 유럽방위기금은 공동 방위 프로젝트에 자금을 지원하는 프로그램입니다."
 European_Security_Council: "유럽안전보장이사회(ESC)"
 European_Security_Council_desc: "§Y유럽안전보장이사회(ESC)§!는 유럽연합이 개입된 모든 상황에서 신속하고 효과적으로 전략적인 사고와 행동을 할 수 있도록 돕는 안보 보장 회의체입니다."
 EUU_euroarmy_sc: "유로아미(EuroArmy) 사무총장"
 EUU_euroarmy_sc_desc: "§Y유로아미(EuroArmy) 사무총장§!은 유럽연합 유로아미의 수장입니다. 회원국들의 연합 및 공동 군대인 유로아미의 조율을 담당합니다."
 EUU_euronavy_sc: "유로네이비(EuroNavy) 사무총장"
 EUU_euronavy_sc_desc: "§Y유로네이비(EuroNavy) 사무총장§!은 유럽연합 유로네이비의 수장입니다. 유럽연합의 연합 및 공동 해군 전력인 유로네이비의 조율을 담당합니다."
 EUU_cfr_eu: "유럽연합 기본권 헌장"
 EUU_cfr_eu_desc: "§Y유럽연합 기본권 헌장§!은 유럽연합 시민 및 거주자의 정치적, 사회적, 경제적 권리를 유럽 법률로 성문화합니다. 이 헌장은 유럽연합의 자유·안보·정의 영역(AFSJ) 정책 영역의 일부를 구성합니다. 이는 헌장의 조항에 따라 행동하고 입법해야 하는 유럽연합 및 유럽원자력공동체(Euratom)의 모든 영역에 적용됩니다."
 european_spirit: "유럽 정신"
 european_spirit_desc: "언제나, 우리는 분열되었을 때보다 뭉쳤을 때 더 강합니다. 우리는 우리 대륙과 전 세계의 발전을 위해 유럽연합을 계속해서 강화해 나가야 합니다."
 EU_foreign_minister: "외교안보정책 고위대표"
 EU_foreign_minister_desc: "§Y외교안보정책 고위대표§!는 유럽연합(EU) 내 공동외교안보정책(CFSP)의 총괄 조정자이자 대표입니다. 종종 '유럽연합(EU) 외교장관'으로 줄여 부르며, 주로 회원국들을 대신해 외교 정책을 조율합니다."
 ECB_president: "유럽중앙은행(ECB) 총재"
 ECB_president_desc: "§Y유럽중앙은행 총재§!는 유로화 관리와 유로존 내 유럽연합()의 통화 정책을 담당하는 유럽중앙은행(ECB)을 이끌며 중추적인 위치를 가집니다. 집행이사회, 정책이사회, 일반이사회의 수장을 맡으며 대외적으로 유럽중앙은행을 대표합니다."
 ECB_zero_interest_rate_policy: "유럽중앙은행 제로 금리 정책"
 ECB_zero_interest_rate_policy_desc: "유럽중앙은행 제로 금리 정책은 제시된 통화 정책 결정을 달성하기 위해 유럽중앙은행(ECB)이 고안한 거시경제적 개념의 일부입니다. 제로 금리 정책은 저성장, 디플레이션 및 디레버리징과 흔히 연관되기 때문에 다소의 부작용을 겪기도 합니다."
 EUU_national_dept_crisis_eu: "국가 부채 위기"
 EUU_national_dept_crisis_eu_desc: "미국에서 시작된 대침체(Great Recession)는 전 세계 여러 지역에 계속해서 파급 효과를 미치고 있습니다. 유럽의 국가 부채 위기는 이러한 파급 효과의 한 예에 불과합니다. 우리 국가의 치솟는 부채가 이제 유로화 전반을 위협하기 시작했습니다."
 european_debt_crisis: "유럽 부채 위기"
 european_debt_crisis_desc: "미국의 대침체는 전 세계 여러 지역에 계속해서 파급 효과를 미치고 있습니다. 여러 유럽연합(EU) 회원국들이 대침체의 여파로 몸살을 앓고 있습니다."
 euro_bonds: "유로본드"
 euro_bonds_desc: "유럽공동채권(Eurobonds, 유로본드)은 공공 부채 조달을 위한 새로운 선택지입니다. 유로존 회원국들에게 채무 조달을 돕기 위해 유로본드를 발행함으로써, 미국 채권 시장과 경쟁할 수 있는 안전하고 유동적인 투자 기회를 저축가들에게 제공합니다."
 euro_rescue_package: "유럽 종합 구제 정책"
 euro_rescue_package_desc: "유럽중앙은행(ECB)은 부채 위기의 확산을 막고 이를 다시 통제하에 두기 위해 구제 패키지를 발동했습니다. 막대한 비용이 드는 조치지만, 유로존의 현재 경제 상황을 안정시킬 수 있을 것입니다."
 fiscal_union: "재정 동맹"
 fiscal_union_desc: "유럽연합의 재정 동맹 수립을 통해 우리는 공통 예산을 더욱 공유할 수 있게 됩니다. 이는 유럽연합 내에서 성장하는 연대감과 연합 전체의 발전을 위해 이뤄지는 양보의 가치를 더욱 공고히 해줄 것입니다."
 European_Economic_Government: "유럽 경제 정부"
 European_Economic_Government_desc: "유럽 경제 정부의 수립으로 이제 [EUU.GetFlag][EUU.GetName] 전체가 자체적인 조세 당국을 설립하고 회원국들의 지출 목표를 설정할 수 있는 선례와 능력이 갖추어졌습니다."
 EU_finance_minister: "유럽 경제재정장관"
 EU_finance_minister_desc: "§Y유럽 경제재정장관§!은 유럽 경제 정부를 수반으로 이끌며, 재정 동맹에 의해 부여된 권한을 행사합니다. 장관은 조세 당국, 회원국의 최저 임금 및 기타 경제·재정적 결정을 감독할 책임을 집니다."
 EUU_ambassador_unsc: "유엔 주재 유럽연합(EU) 대사"
 EUU_ambassador_unsc_desc: "§Y유엔 주재 유럽연합 대사§!는 유럽연합 모든 회원국들의 외교 사절단과 조율하여 유엔에서 유럽연합을 대표합니다."
 EU_president: "유럽 연방 대통령"
 EU_president_desc: "§Y유럽 연방 대통령§!은 합법적인 선거를 통해 선출된 유럽 연방의 지도자입니다. 유럽 연방은 유럽연합의 최종 연방화 단계 중 하나로, 이 직위는 매우 막강한 권력을 가집니다."
 withdrawal_treaty: "탈퇴 조약"
 withdrawal_treaty_desc: "우리가 유럽연합을 탈퇴하면서 무역 합의나 기타 정치적 양보를 유지한 채 유럽연합을 빠져나갈 수 있도록 하는 탈퇴 조약을 타결했습니다."
 no_deal_exit: "노 딜(No Deal) 엑시트"
 no_deal_exit_desc: "우리는 노 딜(No Deal) 엑시트를 선택했습니다. 우리 국가가 유럽연합(EU)을 떠나는 세부 조건에 대해 서로 합의에 도달하지 못했습니다."
 austerity: "긴축 재정"
 austerity_desc: "우리는 유럽집행위원회(EC) 트로이카 개혁의 목표를 완수했습니다. 국가를 위해 긴축 재정을 단행했으며, 그 결과 우리 경제는 계속해서 안정을 되찾고 있습니다."
 EUU_voting_rights_suspended: "이사회 내 유럽연합(EU) 투표권 정지"
 EUU_voting_rights_suspended_desc: "유럽의 가치를 반복적으로 위반함에 따라 유럽연합 내 우리의 투표권이 정지되었습니다. 이제 국가를 이끄는 방향을 바꾸거나, 아니면 연합 탈퇴를 진지하게 모색해야 할 때입니다."
 EUU_subsidies_suspended: "유럽연합(EU) 보조금 지급 정지"
 EUU_subsidies_suspended_desc: "우리가 받던 유럽연합(EU) 보조금 지급이 이제 정지되었습니다. 갑작스러운 예산 변화에 적응하려면 시간이 좀 걸릴 것이며, 우리에게 할당된 보조금을 다시 받을 수 있도록 상황 개선을 모색해야 합니다."
 EU_office_category: "유럽연합(EU) 부서"
 EU_office_category_desc: "[EUU.GetFlag]\n\n[POTEF_polls_loc]"
