 ECONOMY_TITLE: "Aperçu"
 REFRESH_ECONOMYVIEW_TOOLTIP: "£click_left §YL Clic§! pour actualiser la vue économique."
 BALANCE_TITLE: "Solde"
 BALANCE_VALUE: "§Y[?treasury_rate|+3]§!"
 BALANCE_TOOLTIP: "Notre solde hebdomadaire est de $[?treasury_rate|+3] §Hmilliards§!."
 BALANCE_TOOLTIP_DELAYED: "Le solde est la variation nette du Trésor chaque semaine, égale aux recettes totales moins les dépenses totales. Un solde négatif vide le Trésor et force l'émission de dette hebdomadaire une fois les caisses à sec."
 TREASURY_TITLE: "Trésor"
 TREASURY_VALUE: "§Y[?treasury|3]§!"
 TREASURY_TOOLTIP: "Nous disposons de $[?treasury] §Hmilliards§! en trésorerie.\nNotre solde hebdomadaire est de $[?treasury_rate|+3] §Hmilliards§!."
 TREASURY_TOOLTIP_DELAYED: "Notre trésorerie reflète le montant d'argent que nous pouvons dépenser et qui peut être utilisé pour des achats et des investissements. Si la trésorerie passe dans le rouge, une dette sera automatiquement contractée chaque semaine pour qu'elle reste positive.\n\n§tL'écran Économie est déplacé vers l'onglet Commerce.§!"
 DEBT_TITLE: "Dette"
 DEBT_VALUE: "§R[?debt|3]§!"
 INVESTMENTS_TITLE: "Investissements"
 INVESTMENTS_VALUE: "§G[?int_investments|3]§!"
 STATS_TITLE: "Statistiques"
 GDP_TOTAL: "PIB"
 GDP_TOTAL_DESC: "Our §YGross Domestic Product§! (GDP) is the value measure of all products and services produced in the country. Millennium Dawn uses GDP adjusted with PPP (Purchasing Power Parity) as this value takes local economic conditions into account, making the country comparison more useful."
 NUM_GDP_TOTAL: "§Y[?ROOT.gdp_total|1]§! Mrd $$"
 NUM_GDP_TOTAL_DESC: "Notre §YPIB§! est actuellement de §Y[?ROOT.gdp_total|3]§!$ milliards\n\n§YTaux de croissance trimestriel du PIB§! :[?last_quarter_gdp_growth_rate|%Y]\n\nAstuce : plus votre §Ytaux de croissance trimestriel du PIB§! est élevé plus vous avez de chances d’obtenir des événements économiques positifs."
 NUM_GDP_TOTAL_DELAYED_DESC: "Contribution approximative des industries en pourcentage:\n§PIndustries civiles§!: [?ROOT.civil_fac_percent|%]\n§OIndustries militaires§!: [?ROOT.military_fac_percent|%]\n§BChantiers navals§!: [?ROOT.dockyard_fac_percent|%]\n§CIndustries de services§!: [?ROOT.office_fac_percent|%]\n§GAgriculture non commercialisée§!: [?ROOT.agriculture_percent|%]\n§YDistricts agricoles commercialisés§!: [?ROOT.agriculture_district_fac_percent|%]\n§GExtraction de ressources§!: [?ROOT.resources_percent|%]\n"
 GDP_PER_CAPITA: "PIB/hab"
 GDP_PER_CAPITA_DESC: "Ce chiffre représente notre §YPIB par habitant§! ou §YPIB/hab§!. Il représente la production de chaque personne dans la nation."
 GDP_PER_CAPITA_DELAYED_DESC: "Impact actuel du §YPIB par habitant§! sur notre nation:\nVitesse de construction: [?production_speed_buildings_factor_gdp_modifier|%+]\nPopulation mensuelle: [?monthly_population_gdp_modifier|%+1]\nVitesse de recherche: [?research_speed_factor_gdp_modifier|%+]\nStabilité: [?stability_factor_gdp_modifier|%+]\nMain d'oeuvre totale: [?total_workforce_gdp_c_modifier_var|%+]\nVitesse de construction des centrales à combustibles fossile: [?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "§Y[?ROOT.gdp_per_capita]§! K $$"
 NUM_GDP_PER_CAPITA_DESC: "Notre §YPIB/hab§! est actuellement de §Y[?ROOT.gdp_per_capita|3]§!$ milliers"
 PRODUCTIVITY: "Productivité"
 PRODUCTIVITY_DESC: "Ce nombre représente la §Yproductivité§! de notre nation."
 NUM_PRODUCTIVITY_DELAYED_DESC: "Croissance mensuelle de la productivité: [?productivity_growth_scaled|3+]\n\nEffet de la productivité:\n§YProduction d'usines:§! [?productivity_tax_effect_display|%+1]\n§YVitesse de construction:§! [?productivity_tax_effect_display|%+1]\n§YImpôt sur les sociétés:§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon Vitesse de construction des §Ydistricts agricoles commercialisés§! :§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "La §Yproductivité§! mesure l'efficacité avec laquelle nous transformons les ressources en biens et services pour notre population, en faisant évoluer le PIB, l'impôt sur les sociétés et la production industrielle. Une productivité plus élevée signifie une plus grande efficacité, mais la croissance ralentit à mesure que les États deviennent plus productifs par rapport à la moyenne mondiale, tandis que les États moins productifs rattrapent plus vite.\n\n§YMoyenne mondiale :§! [?global.average_world_productivity|3]\n§YNotre productivité :§! [?ROOT.overall_productivity|3]\n"
 INFLATION: "Inflation"
 INFLATION_DESC: "Ce chiffre représente l'§Yinflation§! de notre nation"
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§YL'inflation§! est la valeur qui détermine si le pouvoir d'achat de votre nation croît ou décroît. Plus l'inflation monte, moins vos citoyens et votre gouvernement ont de pouvoir d'achat, car la monnaie perd de la valeur. L'inflation se calcule par la moyenne des 4 derniers trimestres du §Ytaux de croissance trimestriel du PIB/hab.§!, multipliée par votre §Ytaux d'imposition§! moyen, puis ajustée par les §Ycycles économiques§!, la §Yplanche à billets§!, le §Ytaux directeur§! et d'autres événements économiques.\n\nPlus votre §Ytaux de croissance trimestriel du PIB/hab.§! moyen est élevé, et plus votre §YPIB/hab.§! est grand, plus le taux d'inflation sera haut. Un §Ytaux d'imposition§! plus élevé réduira l'inflation, un taux plus bas l'augmentera. Un §Ytaux directeur§! plus élevé diminuera l'inflation mais augmentera les §Rintérêts de la dette§!, un taux plus bas fera l'inverse.\n\nLes §Ycycles économiques§! au-dessus de §Ycroissance stable§! augmenteront votre §Yinflation§!, simulant une demande accrue de biens et de dépenses, tandis que les §Ycycles économiques§! en dessous de §Ycroissance stable§! la diminueront, simulant moins de dépenses et une moindre demande de biens de consommation.\n\nLa §Ydéflation§! peut survenir si vous obtenez un taux d'§Yinflation§! négatif. La §Ydéflation§! peut réduire les dépenses publiques, mais aussi provoquer des reculs économiques, car les gens cessent de dépenser en attendant que les prix baissent encore, ce qui peut faire §Réchouer§! marchés et entreprises si la déflation est trop forte ou trop rapide."
 NUM_INFLATION_DELAYED_DESC: "§H4 derniers trimestres :§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\nLe taux affiché est la §Ymoyenne glissante sur quatre trimestres§!, représentant une inflation annuelle moyenne, chiffre utilisé pour tous les effets économiques."
 POPULATION_TAX_RATE: "Taux taxes pop."
 POPULATION_TAX_RATE_TT: "Le taux d'imposition de la population comprend toutes les taxes imposées au public. Cela peut inclure, sans toutefois s'y limiter, l'impôt sur le revenu, la TVA, la taxe de vente et les taxes foncières.\n\n§YModificateurs des taxes sur la population:§!\n£stability_texticon Stabilité: [?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "Taux taxes sociétés"
 CORPORATE_TAX_RATE_TT: "Le taux d'imposition des sociétés comprend tous les impôts imposés aux sociétés. La valeur comprend l'impôt sur le revenu des sociétés, les impôts des employeurs, etc.\n\n§YModificateurs des taxes sur les sociétés:§!\n£consumer_goods_texticon Coût fiscal: [?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §YReçu des investissements étrangers§! Modificateur de coût: [?receiving_investment_cost_form_corporate_tax|%-]\nCroissance mensuelle de la productivité: [?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "Taux directeur"
 CB_POLICY_RATE_TT: "The §YCentral Bank Policy Rate§! is the benchmark interest rate set by the central bank. It controls the cost of borrowing across the economy.\n\n§YRaising the rate§! tightens the money supply, suppressing inflation but increasing the cost of sovereign debt and slowing economic activity.\n§YLowering the rate§! stimulates borrowing and investment but allows inflation to rise more freely.\nEach point of the rate also cuts how much of our inflation carries into the next quarter, however high inflation is.\nA rate more than 1pp above inflation supports §YCurrency Strength§!, and a lower rate weakens it.\n\nEach adjustment costs §Y25§! £pol_power_icon and has a §Y30-day§! cooldown.\n\n§YCurrent Rate:§! [?cb_policy_rate]%\n§YInflation Carryover:§! [?cb_policy_rate|+0]% × 2.5pp less each quarter\n§YDebt Interest Premium:§! [?cb_policy_rate|+0]% × 0.5pp added to §YInterest Rate§!"
 TOTAL_INCOME_TITLE: "Revenu national :"
