 ALG_kabyle_appeased_recently: "Appeased Kabyle Sentiments"
 ALG_sahara_expansion: "Sahara Desertification"
 ALG_sahara_expansion_desc: "The Sahara covers most of Algeria and pushes steadily north into the steppe and the country's limited farmland. Overgrazing, unsustainable irrigation and resource extraction speed the process up; conservation, sustainable farming and renewable energy slow it down.\n\nOnce a year we receive an update on the state of the desert. It may expand (§YDesertification§!, one tier worse), hold (§YStabilisation§!) or give ground back (§YOasification§!, one tier better).\n\nLikelihood of §YDesertification§!: §R[?sahara_expands]%§!\nLikelihood of §YStabilisation§!: [?sahara_steady]%\nLikelihood of §YOasification§!: §G[?sahara_retreats]%§!\n\nEach of these odds shifts by §Y5%§! through focuses. Agricultural and industrial expansion such as §Y$ALG_increase_cattle_grazing$§!, §Y$ALG_oil_production$§! and §Y$ALG_hassi_massoud_exploitation$§! makes desertification more likely. Conservation and renewables such as §Y$ALG_optimize_pastoral_practices$§!, §Y$ALG_expand_nature_reserves_sahara$§! and §Y$ALG_solar_panel_grid$§! make it less likely."
 ALG_ethnic_relations_desc: "Algeria is a mosaic of peoples whose loyalty to the state varies greatly.\n\n§YArab population:§! [ALG_arab_satisfaction_text]\n§YKabyle population:§! [ALG_kabyle_satisfaction_text]\n§YChaoui population:§! [ALG_chaoui_satisfaction_text]\n§YTuareg population:§! [ALG_tuareg_satisfaction_text]\n§YMozabite population:§! [ALG_mozabite_satisfaction_text]"
 ALG_black_spring_event_desc: "Protests have erupted across Kabylia. The population's mood: [ALG_kabyle_satisfaction_text]. The regime must decide how to respond."
