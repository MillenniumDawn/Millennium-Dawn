l_simp_chinese:
 AUTOMATION_SETTINGS_OPEN_TT: "打开自动化设置"
 AUTOMATION_SETTINGS_TITLE: "自动化设置"
 AUTOMATION_SETTINGS_DESC: "在一个面板中管理重复性操作和通知偏好设置。其他位置的现有控件仍然可用。"
 AUTOMATION_SETTINGS_GENERAL_PAGE: "通用"
 AUTOMATION_SETTINGS_SPACE_PAGE: "卫星"
 AUTOMATION_SETTINGS_INFLUENCE_PAGE: "影响力"
 AUTOMATION_SETTINGS_SPACE_DESC: "配置卫星自动生产、发射和卫星升级。"
 AUTOMATION_SETTINGS_INFLUENCE_DESC: "配置定期执行的操作，以保护我国政府免受外国影响。"
 AUTOMATION_SETTINGS_SPACE_SAVE_BUTTON_TT: "[!automation_space_save_button_click_enabled]将上面暂存的有效负载清单存储为§Y自定义§!计划并切换到该计划。"
 AUTOMATION_SETTINGS_SPACE_UPGRADE_BUTTON_TT: "[!automation_space_upgrade_button_click_enabled]在当前轨道覆盖范围允许的情况下，将每个卫星升级到最新研究的一代。"
 AUTOMATION_SETTINGS_NOTIFICATIONS_HEADER: "通知和偏好设置"
 AUTOMATION_SETTINGS_ECONOMY_HEADER: "经济"
 AUTOMATION_SETTINGS_UN_HEADER: "联合国"
 AUTOMATION_SETTINGS_DIPLOMACY_HEADER: "外交"
 AUTOMATION_SETTINGS_NATO_HEADER: "北约"
 AUTOMATION_SETTINGS_ENERGY_HEADER: "能源"
 AUTOMATION_SETTINGS_PP_RESERVE: "政治点数储备"
 AUTOMATION_SETTINGS_PP_RESERVE_VALUE: "£pol_power [?automation_pp_reserve|0]"
 AUTOMATION_SETTINGS_PP_RESERVE_TT: "Automated actions that spend Political Power will wait until they can pay their cost without reducing Political Power below this reserve. Manual actions are unaffected.\n\n£click_left §YL Click§!: Adjust by §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Adjust by §Y10§!\n£key_shift + £click_left §YShift L Click§!: Adjust by §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_PLUS_TT: "£click_left §YL Click§!: Increase by §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Increase by §Y10§!\n£key_shift + £click_left §YShift L Click§!: Increase by §Y100§!"
 AUTOMATION_SETTINGS_PP_RESERVE_MINUS_TT: "£click_left §YL Click§!: Decrease by §Y1§!\n£key_ctrl + £click_left §YCtrl L Click§!: Decrease by §Y10§!\n£key_shift + £click_left §YShift L Click§!: Decrease by §Y100§!"
 AUTOMATION_SETTINGS_CORRUPTION: "自动拒绝腐败提议"
 AUTOMATION_SETTINGS_CORRUPTION_TT: "自动跳过腐败提议。启用此功能后，相关活动及其加成将不会显示。"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION: "外国选举通知"
 AUTOMATION_SETTINGS_FOREIGN_ELECTION_TT: "显示其他国家选举的新闻通知。"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS: "影响突袭通知"
 AUTOMATION_SETTINGS_RAID_NOTIFICATIONS_TT: "显示其他国家之间的影响力突袭事件。即使禁用此功能，针对我们的突袭事件仍会被报告。"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT: "月度自动影响力报告"
 AUTOMATION_SETTINGS_INFLUENCE_REPORT_TT: "显示受自动影响国家/地区的月度报告。"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE: "自动接受投资提议"
 AUTOMATION_SETTINGS_INVESTMENT_ACCEPTANCE_TT: "自动接受所有收到的国际投资提议。启用此功能将禁用自动拒绝功能。"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION: "自动拒绝投资提议"
 AUTOMATION_SETTINGS_INVESTMENT_REJECTION_TT: "自动拒绝所有国际投资提议。启用此功能将禁用自动接受提议。"
 AUTOMATION_SETTINGS_REINVESTMENT: "国际投资再投资"
 AUTOMATION_SETTINGS_REINVESTMENT_TT: "选择国际投资的每周收益如何在国库和再投资之间分配。"
 AUTOMATION_SETTINGS_REINVEST_OFF: "禁用"
 AUTOMATION_SETTINGS_REINVEST_OFF_TT: "将所有国际投资收益上缴国库。"
 AUTOMATION_SETTINGS_REINVEST_FULL: "全面"
 AUTOMATION_SETTINGS_REINVEST_FULL_TT: "将所有国际投资收益进行再投资。"
 AUTOMATION_SETTINGS_REINVEST_SPLIT: "拆分"
 AUTOMATION_SETTINGS_REINVEST_SPLIT_TT: "将国际投资收益的一半上缴国库，另一半进行再投资。"
 AUTOMATION_SETTINGS_FUEL_PURCHASE: "自动购买燃料"
 AUTOMATION_SETTINGS_FUEL_PURCHASE_TT: "立即购买燃料，然后每28天检查一次，当燃料储备低于20%时再次购买。禁用此功能可取消未来的购买。"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS: "重复选定的内部投资"
 AUTOMATION_SETTINGS_INTERNAL_INVESTMENTS_TT: "Pay £pol_power §R0.15§! Political Power daily while enabled. Right-click internal investment buttons in the state view to select the state and investment types to repeat. Selected investments are checked weekly and run while a slot is free, the treasury can pay the current cost, and the Political Power Reserve can be maintained."
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY: "自动补给南极站点"
 AUTOMATION_SETTINGS_ANTARCTICA_RESUPPLY_TT: "从11月到3月，在剩余燃料使用时间不足15天时自动为我们的南极科考站订购燃料；从4月到10月，在剩余燃料使用时间不足30天时自动为我们的南极科考站订购燃料。运输费用§R$0.25b/1000单位燃料§!，极地冬季费用翻倍。订单要等到国库能够支付全部费用后才能执行。"
 AUTOMATION_SETTINGS_ENERGY_CONSUMPTION_POLICY: "自动消费政策"
 AUTOMATION_SETTINGS_SC_VOTE: "安理会默认投票"
 AUTOMATION_SETTINGS_SC_VOTE_TT: "选择我们如何对安全理事会决议进行自动投票。再次单击所选选项即可返回手动投票模式。"
 AUTOMATION_SETTINGS_GA_VOTE: "大会默认投票"
 AUTOMATION_SETTINGS_GA_VOTE_TT: "选择我们如何对大会决议进行自动投票。再次单击所选选项即可返回手动投票模式。"
 AUTOMATION_SETTINGS_VOTE_YES: "是"
 AUTOMATION_SETTINGS_VOTE_NO: "否"
 AUTOMATION_SETTINGS_VOTE_ABSTAIN: "弃权"
 AUTOMATION_SETTINGS_SC_ACCEPT_TT: "Vote Yes automatically on every Security Council resolution."
 AUTOMATION_SETTINGS_SC_REJECT_TT: "Vote No automatically on every Security Council resolution. Permanent members will cast a veto when applicable."
 AUTOMATION_SETTINGS_SC_ABSTAIN_TT: "Abstain automatically from every Security Council resolution."
 AUTOMATION_SETTINGS_GA_ACCEPT_TT: "Vote Yes automatically on every General Assembly resolution."
 AUTOMATION_SETTINGS_GA_REJECT_TT: "Vote No automatically on every General Assembly resolution."
 AUTOMATION_SETTINGS_GA_ABSTAIN_TT: "自动对大会所有决议投弃权票。"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION: "Block AI Satellite Access Offers"
 AUTOMATION_SETTINGS_SATELLITE_REJECTION_TT: "Prevent AI countries from offering shared access to their military and civilian satellite systems. Human players can still send offers."
 AUTOMATION_SETTINGS_NATO_RATIFICATION: "自动批准北约成员国身份"
 AUTOMATION_SETTINGS_NATO_RATIFICATION_TT: "Automatically spend £pol_power §Y20§! to ratify each NATO accession candidate. Ratification waits until the Political Power Reserve can be maintained."
 AUTOMATION_SETTINGS_INFLUENCE_HEADER: "影响力防御"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE: "自动对抗外国影响"
 AUTOMATION_SETTINGS_COMBAT_FOREIGN_INFLUENCE_TT: "Pay £pol_power §R0.05§! Political Power daily while enabled. When available, automatically spend £pol_power §Y100§! to increase Domestic Independence by §G2.5%§!. Repeats after 100 days. Automation pauses while the government is being lobbied or when either cost would reduce Political Power below the reserve."
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS: "自动攻击外国影响者"
 AUTOMATION_SETTINGS_ATTACK_FOREIGN_INFLUENCERS_TT: "Pay £pol_power §R0.05§! Political Power daily while enabled. Automatically spend £pol_power §Y125§! to begin a 60-day campaign against the strongest eligible foreign influencer. Only one campaign runs at a time. Ineligible, lobbied, and cooling-down targets are skipped. Automation pauses when either cost would reduce Political Power below the reserve."
 AUTOMATION_SETTINGS_INFLUENCE_COST_NOTE: "Each enabled option costs £pol_power §R0.05§! daily. Both options together cost £pol_power §R0.10§! daily."