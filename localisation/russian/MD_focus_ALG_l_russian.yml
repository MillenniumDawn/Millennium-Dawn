 ALG_minister_vacant: "Вакантный"
 ALG_military_industrial_complex: "Военно-промышленный комплекс"
 ALG_patronage_networks: "Сети покровительства"
 ALG_crush_all_opposition: "Сокрушить всю оппозицию"
 ALG_control_hydrocarbons: "Контролируйте углеводороды"
 ALG_fortress_algeria: "Крепость Алжир"
 ALG_military_industrial_complex_desc: "Военные расширяют свою экономическую империю, строя оружейные заводы и заключая выгодные оборонные контракты. Офицерский корпус превращается в бизнес-класс, генералы заседают в советах директоров корпораций и накапливают огромные состояния."
 ALG_patronage_networks_desc: "Разветвленная сеть патронажа связывает режим с бизнес-элитой и региональными влиятельными лицами. Лояльность покупается контрактами, лицензиями и доступом. Государство становится инструментом частного обогащения."
 ALG_crush_all_opposition_desc: "Режим подавляет всю организованную оппозицию посредством арестов, цензуры и запугивания. Политические партии подкупаются или запрещаются. Гражданское общество уничтожается. Слышен только голос режима."
 ALG_control_hydrocarbons_desc: "Государство устанавливает полный контроль над углеводородным сектором, направляя доходы от нефти и газа непосредственно в казну режима. Иностранные партнеры оказываются в затруднительном положении, независимые операторы поглощаются, а «глубинное государство» контролирует «кран» поставок."
 ALG_fortress_algeria_desc: "Алжир превращается в государство-гарнизон — милитаризированное, закрытое и подозрительное к внешнему миру. Армия сильна, границы закрыты, а население держится под контролем за счет сочетания нефтяного богатства и репрессий."
 ALG_oil_crash_weakens_regime_tt: "Обвал цен на нефть серьезно ослабил способность режима обеспечивать общественный порядок. Растет народное недовольство."
 ALG_hirak_wins_tt: "Движение «Хирак» одержало победу. Новая Алжир возможна."
 ALG_military_wins_tt: "«Глубинное государство» одержало победу. Военное правление продолжается под новым руководством."
 ALG_republic_new_era_tt: "Для Алжирской Республики начинается новая эра. Старая система демонтируется."
 ALG_parliamentary_republic_tt: "В Алжире принята парламентская система правления. Верховным органом власти является Национальное собрание."
 ALG_semi_presidential_republic_tt: "В Алжире принята полупрезидентская система правления. Власть разделена между президентом и парламентом."
 ALG_presidential_republic_tt: "В Алжире принята президентская система правления. Президент обладает доминирующей исполнительной властью."
 ALG_patronage_enriches_regime_tt: "Покровительские сети обогащают режим и его союзников за счет алжирского народа."
 ALG_fortress_state_tt: "Алжир превратился в государство-крепость. Глубинное государство правит абсолютно, и страна закрыта для всего мира."
 ALG_military_industrial_economy: "Военно-промышленная экономика"
 ALG_state_hydrocarbon_monopoly: "Государственная монополия на углеводороды"
 ALG_fortress_state: "Крепостное государство"
 ALG_military_industrial_economy_desc: "Военные расширили свою деятельность в сфере производства вооружений и оборонной промышленности, создав самодостаточную экономическую базу для режима. Генералы входят в советы директоров корпораций, а грань между военной формой и деловым костюмом размыта."
 ALG_state_hydrocarbon_monopoly_desc: "Полный государственный контроль над доходами от нефти и газа финансирует режим и его патронажные сети. Углеводородный сектор — это закрытый мир, где могут действовать только те, кто имеет к нему отношение."
 ALG_fortress_state_desc: "Алжир превратился в закрытое, милитаризованное государство. Армия могущественна, общество контролируется, а «глубинное государство» правит беспрепятственно. Стабильность куплена ценой свободы."
 ALG_redmed_group_expansion: "Расширение группы компаний RedMed"
 ALG_redmed_group_expansion_desc: "Группа компаний RedMed зарекомендовала себя как надежный логистический партнер для нефтегазового сектора в районе Хасси-Мессауда. При правильных инвестициях она может превратиться в более крупную промышленную силу."
 ALG_star_aviation_operations: "Операции Star Aviation"
 ALG_star_aviation_operations_desc: "Авиационная дочерняя компания RedMed Group с момента своего основания демонстрирует безупречную безопасность. Мы должны использовать эту репутацию для углубления нашего участия в авиационном секторе."
 ALG_military_aviation_contract: "Контракты в области военной авиации"
 ALG_military_aviation_contract_desc: "Операционная эффективность компании Star Aviation привлекла внимание военных. Получение оборонных контрактов откроет двери для передовых разработок в аэрокосмической отрасли и позволит профинансировать следующий этап расширения."
 ALG_missile_development_initiative: "Инициатива по разработке ракет"
 ALG_missile_development_initiative_desc: "Современная армия не может полагаться только на иностранное вооружение. Мы начнем собственную ракетную программу через группу «Красная Медь», заложив основу для стратегического сдерживания."
 ALG_star_aviation_uav_division: "Подразделение беспилотных летательных аппаратов Star Aviation"
 ALG_star_aviation_uav_division_desc: "Обладая зарубежными технологиями в области беспилотных летательных аппаратов, компания Star Aviation готова создать специализированное подразделение по разработке дронов. Алжирские инженеры будут изучать, адаптировать и в конечном итоге превзойти полученные возможности."
 ALG_domestic_uav_production: "Производство беспилотных летательных аппаратов в стране"
 ALG_domestic_uav_production_desc: "Этап обратного проектирования завершен. Производственные мощности Star Aviation готовы к массовому выпуску беспилотных летательных аппаратов алжирской разработки. Речь идет уже не об импорте, а о суверенитете."
 ALG_russian_missile_cooperation: "Российское ракетное сотрудничество"
 ALG_russian_missile_cooperation_desc: "Российская ракетная промышленность является одной из самых передовых в мире. Партнерство с Москвой значительно ускорит нашу программу, но ценой углубления нашей зависимости от доброй воли России."
 ALG_chinese_missile_cooperation: "Китайское ракетное сотрудничество"
 ALG_chinese_missile_cooperation_desc: "Китай продемонстрировал готовность делиться ракетными технологиями с дружественными государствами. Соглашение с Пекином обеспечит доступ к современным системам и укрепит наши позиции в формирующемся многополярном мире."
 ALG_redmed_star_convergence: "Конвергенция RedMed-Star"
 ALG_redmed_star_convergence_desc: "Пришло время объединить ракетное подразделение RedMed с возможностями беспилотных летательных аппаратов Star Aviation в рамках единой интегрированной оборонной структуры. Алжир больше не будет импортировать средства обеспечения безопасности, он будет производить их сам."
 ALG_regional_defense_leader: "Лидер обороны Магриба"
 ALG_regional_defense_leader_desc: "Оборонная промышленность Алжира сегодня не имеет себе равных в Магрибе. Наши беспилотники патрулируют Сахару, наши ракеты сдерживают наших соперников, а наши технологии востребованы соседями, которые когда-то смотрели в сторону Европы. Вот как выглядит суверенитет."
 ALG_uav_procurement_category: "Закупка БПЛА"
 ALG_uav_procurement_category_desc: "Для начала обратного проектирования компании Star Aviation необходима эталонная платформа. Выберите иностранного поставщика БПЛА."
 ALG_drone_program_category: "Программа разработки беспилотных летательных аппаратов"
 ALG_drone_program_category_desc: "Подразделение беспилотных летательных аппаратов компании Star Aviation готово разработать первый в Алжире беспилотник отечественного производства. Выберите направление разработки."
 ALG_purchase_turkish_uavs: "Приобретите турецкие беспилотники."
 ALG_purchase_turkish_uavs_desc: "Беспилотник Bayraktar TB2 зарекомендовал себя в многочисленных конфликтах. Приобретение его у Турции обеспечит опыт эксплуатации БПЛА и надежную платформу для обратного проектирования, но ценой сближения с Анкарой."
 ALG_purchase_chinese_uavs: "Приобретение китайских беспилотников"
 ALG_purchase_chinese_uavs_desc: "Китайский вертолет Wing Loong II обладает возможностями, сопоставимыми с западными системами, но при этом стоит значительно дешевле. Пекин также продемонстрировал готовность включать положения о передаче технологий в подобные сделки."
 ALG_purchase_iranian_uavs: "Приобретение иранских беспилотников"
 ALG_purchase_iranian_uavs_desc: "Иранская ракета «Мохаджер-6» экономична и проверена в боях. Приобретение её у Тегерана — самый дешёвый вариант, который укрепляет связи с естественным стратегическим партнёром, хотя и может привлечь международное внимание."
 ALG_develop_amel_recon_uav: "Разработка беспилотного летательного аппарата «Амель»"
 ALG_develop_amel_recon_uav_desc: "«Амель» станет первым в Алжире разведывательным беспилотным летательным аппаратом собственной разработки, высокоэффективной платформой, оптимизированной для наблюдения за границей и сбора разведывательной информации на обширной территории южной Сахары."
 ALG_develop_el_djazair_ucav: "Разработать беспилотный летательный аппарат El-Djazair."
 ALG_develop_el_djazair_ucav_desc: "«Эль-Джазаир» станет настоящим боевым беспилотником, вооруженным боевым летательным аппаратом, способным наносить высокоточные удары. Он будет дороже и технически сложнее, чем разведывательная платформа, но станет гораздо более мощным военным средством."
 ALG_develop_swarm_loitering: "Разработать боеприпасы для роевого барражирования"
 ALG_develop_swarm_loitering_desc: "Вместо одного большого беспилотника Алжир инвестирует в рои небольших, дешевых и скоординированных барражирующих боеприпасов. Их сложнее перехватить, они разрушительны в больших количествах и дешевле в массовом производстве."
 ALG_redmed_group_tt: "§GГруппа компаний RedMed расширяет свою деятельность за пределы логистики в нефтегазовой отрасли, охватывая более широкий спектр промышленных возможностей.§!"
 ALG_star_aviation_founded_tt: "§GВысокий уровень операционной эффективности компании Star Aviation позволяет ей претендовать на военные контракты.§!"
 ALG_military_contract_tt: "§GКомпания Star Aviation получила военные контракты. Результаты закупок беспилотных летательных аппаратов уже доступны.§!"
 ALG_uav_division_tt: "§GСоздано специализированное подразделение по разработке беспилотных летательных аппаратов. Теперь можно принимать решения по разработке дронов.§!"
 ALG_domestic_production_tt: "§GТеперь Алжир может производить беспилотные летательные аппараты собственными силами.§!"
 ALG_amel_developed_tt: "§GРазведывательный БПЛА «Амель» успешно разработан.§!"
 ALG_ucav_developed_tt: "§GБоевой беспилотник «Эль-Джазаир» введен в эксплуатацию.§!"
 ALG_swarm_developed_tt: "§GАлжир разработал систему барражирующих боеприпасов.§!"
 ALG_missile_division_tt: "§GГруппа компаний RedMed создала специализированное подразделение по разработке ракет.§!"
 ALG_redmed_leader_tt: "§GКомпании RedMed Group и Star Aviation объединились в единый оборонно-промышленный комплекс.§!"
 ALG_defense_leader_tt: "§GАлжир признан ведущей державой Магриба в области оборонных технологий.§!"
 ALG_redmed_group_logistics: "Логистика RedMed Group"
 ALG_redmed_group_logistics_desc: "Группа компаний RedMed предоставляет комплексные логистические услуги нефтегазовому сектору Алжира."
 ALG_redmed_star_aviation: "Операции Star Aviation"
 ALG_redmed_star_aviation_desc: "Компания Star Aviation поддерживает безупречную репутацию в области безопасности. Ее оперативная точность переориентируется на развитие аэрокосмической отрасли."
 ALG_star_aviation_military: "Военные контракты компании Star Aviation"
 ALG_star_aviation_military_desc: "Компания Star Aviation получила военные контракты, перенеся свой опыт в гражданской сфере в оборонный сектор."
 ALG_star_aviation_uav_division_idea: "Подразделение беспилотных летательных аппаратов Star Aviation"
 ALG_star_aviation_uav_division_idea_desc: "Специальное подразделение по разработке беспилотных летательных аппаратов изучает зарубежные платформы БПЛА для развития собственных возможностей Алжира."
 ALG_star_aviation_uav_production: "Производство БПЛА Star Aviation"
 ALG_star_aviation_uav_production_desc: "Компания Star Aviation теперь производит беспилотные летательные аппараты алжирской разработки в больших масштабах."
 ALG_redmed_integrated_defense_systems: "RedMed Интегрированная оборона"
 ALG_redmed_integrated_defense_systems_desc: "Группа компаний RedMed объединила свои программы по разработке беспилотных летательных аппаратов и ракет в единый передовой комплекс вооружений."
 ALG_maghreb_defense_powerhouse: "Оборонная мощь Магриба"
 ALG_maghreb_defense_powerhouse_desc: "Оборонная промышленность Алжира, возглавляемая RedMed Group и Star Aviation, является самой передовой в Северной Африке."
 ALG_aerospace_training_program: "Программа подготовки специалистов в аэрокосмической отрасли"
 ALG_aerospace_training_program_desc: "Национальная программа подготовки инженеров аэрокосмической отрасли и специалистов по беспилотным летательным аппаратам для обеспечения процветания оборонной промышленности Алжира."
 ALG_combat_uav_program: "Программа боевых беспилотных летательных аппаратов"
 ALG_combat_uav_program_desc: "Активная разработка вооруженных беспилотных летательных аппаратов повышает ударный потенциал ВВС Алжира."
 ALG_redmed_missile_division_idea: "Ракетное подразделение Красная Медь"
 ALG_redmed_missile_division_idea_desc: "Специализированное подразделение RedMed Group по разработке ракет создает с нуля стратегический потенциал сдерживания Алжира."
 ALG_cruise_missile_development: "Разработка крылатых ракет"
 ALG_cruise_missile_development_desc: "Активно реализуемая программа создания крылатых ракет впервые обеспечивает Алжиру возможность нанесения высокоточных ударов на большие расстояния."
 ALG_precision_strike_capability: "Возможность нанесения высокоточных ударов"
 ALG_precision_strike_capability_desc: "Интегрированные ракетные и беспилотные системы обеспечили Алжиру возможность нанесения действительно высокоточных ударов."
 ALG_defense_export_industry: "Оборонная экспортная промышленность"
 ALG_defense_export_industry_desc: "Алжирские беспилотные летательные аппараты и ракеты теперь доступны для экспорта. Каждая продажа приносит как прибыль, так и дипломатический рычаг."
 ALG_redmed_group_concern: "Группа RedMed"
 ALG_redmed_group_concern_desc: "Ведущий алжирский промышленный конгломерат, корни которого уходят в логистику нефтегазовой отрасли. Группа компаний RedMed превратилась в основного производителя оборонной продукции в Алжире, выпускающего беспилотные летательные аппараты и ракетные системы для вооруженных сил."
 ALG_star_aviation_concern: "Star Aviation"
 ALG_star_aviation_concern_desc: "Авиационная дочерняя компания RedMed Group. Основанная в 2001 году и имеющая безупречную репутацию в области безопасности, компания Star Aviation в настоящее время лидирует в Алжире в области производства аэрокосмической техники и беспилотных летательных аппаратов."
 ALG_arrest_opponents_started_tt: "Силовые структуры начинают операции по задержанию..."
 ALG_surveillance_started_tt: "Ведется расширение сети видеонаблюдения..."
 ALG_ban_parties_started_tt: "Начались судебные разбирательства по запрету оппозиционных партий..."
 ALG_imf_loan_started_tt: "Переговоры с МВФ по поводу кредита продолжаются..."
 ALG_oil_licensing_started_tt: "Начались переговоры с иностранными компаниями о выдаче лицензий на добычу нефти..."
 ALG_repay_imf_started_tt: "Начался процесс погашения кредита МВФ..."
 ALG_pardon_islamist_started_tt: "Начались процедуры помилования умеренных исламистов..."
 ALG_dialogue_started_tt: "Организуются сессии национального диалога..."
 ALG_reintegrate_fighters_started_tt: "Начинаются программы реинтеграции бывших бойцов..."
 ALG_arrest_opponents_complete_tt: "Операции по задержанию завершены. Оппозиция ослабла."
 ALG_surveillance_complete_tt: "Сеть видеонаблюдения полностью введена в эксплуатацию."
 ALG_ban_parties_complete_tt: "Оппозиционные партии официально запрещены."
 ALG_imf_loan_complete_tt: "Средства кредита МВФ получены."
 ALG_oil_licensing_complete_tt: "Соглашения о лицензировании нефтедобычи вступили в силу."
 ALG_repay_imf_complete_tt: "Кредит МВФ полностью погашен."
 ALG_pardon_islamist_complete_tt: "Помилования были вынесены. Политическое примирение продвигается."
 ALG_dialogue_complete_tt: "Национальный диалог успешно завершился."
 ALG_reintegrate_fighters_complete_tt: "Бывшие бойцы успешно реинтегрировались в общество."
 ALG_fis_return_threat: "Возвращение Исламского фронта спасения в Алжире"
 ALG_fis_return_western_concern: "Обеспокоены действиями салафитского правительства в Алжире."
 ALG_fis_return_salafi_solidarity: "Поддерживает салафитское правительство в Алжире"
 ALG_fis_return_islamist_sympathy: "Осторожно приветствует исламистское правительство в Алжире"
 ALG_fis_return_neighbor_alarm: "Обеспокоены захватом власти исламистами в Алжире"
 ALG_fis_return_anti_political_islam: "Выступает против политического ислама в Алжире"
 ALG_world_tension_security_ended_tt: "Меры безопасности отменены."
 ALG_world_tension_high_security_ended_tt: "Уровень повышенной готовности к обеспечению безопасности снят."
 ALG_crackdown_momentum_ended_tt: "Темпы ужесточения мер ослабли."
 ALG_reconciliation_momentum_ended_tt: "Импульс к примирению ослаб."
 ALG_by_the_people_for_the_people: "От народа, для народа"
 ALG_by_the_people_for_the_people_desc: "Движение «Хирак» потрясло Алжир до основания. Народ требует полной трансформации политической системы, не просто смены лиц, а фундаментальной перестройки власти. Старая гвардия не сдастся без боя."
 ALG_by_the_people_for_the_people_tt: "Механизм §YHirak§! должен обладать достаточным импульсом (баланс мощности выше §G70%§!)."
 ALG_break_the_oligarchs: "Сломить олигархов"
 ALG_break_the_oligarchs_desc: "Сеть бизнесменов, извлекавших выгоду из близости к режиму, должна быть ликвидирована. Их активы будут конфискованы, контракты пересмотрены, а их влияние на государство прекращено навсегда."
 ALG_dismantle_le_pouvoir: "Разобрать \"Le Pouvoir\""
 ALG_dismantle_le_pouvoir_desc: "Теневое государство, генералы, разведывательные службы, невидимая рука, которая руководит Алжиром со времен обретения независимости, должны быть выведены на свет и лишены своей власти."
 ALG_new_economic_model: "Новая экономическая модель"
 ALG_new_economic_model_desc: "После свержения олигархов Алжиру необходима новая экономическая концепция. Модель рентного государства мертва. На смену ей приходит диверсифицированная экономика, основанная на промышленности, технологиях и человеческом капитале."
 ALG_unleash_civil_society: "Дать волю гражданскому обществу"
 ALG_unleash_civil_society_desc: "Свободная пресса, независимые профсоюзы и политические партии, представляющие реальные интересы избирателей, — вот фундамент, на котором строится демократия."
 ALG_constitutional_convention: "Конституционный съезд"
 ALG_constitutional_convention_desc: "Представители со всей Алжира соберутся, чтобы разработать новую конституцию. Впервые этот документ будет написан народом, а не навязан власть имущими."
 ALG_presidential_republic: "Президентская республика"
 ALG_presidential_republic_desc: "В Алжире будет внедрена президентская система с сильной исполнительной властью, четкой структурой полномочий и демократической подотчетностью. Президент будет управлять страной решительно, а конституционные гарантии предотвратят злоупотребление властью."
 ALG_parliamentary_republic: "Парламентская республика"
 ALG_parliamentary_republic_desc: "В Алжире будет внедрена парламентская система, в которой власть будет разделена между избранными представителями. Формирование коалиций и достижение консенсуса гарантируют, что ни один человек больше не сможет доминировать в государстве."
 ALG_civilian_military_control: "Гражданский военный контроль"
 ALG_civilian_military_control_desc: "Военные должны служить государству, а не управлять им. Профессиональные офицеры заменяют политических генералов. Армия модернизируется, деполитизируется и полностью подчиняется гражданской власти."
 ALG_democratic_dividend: "Демократический дивиденд"
 ALG_democratic_dividend_desc: "Прозрачная, демократичная Алжир привлекает иностранные инвестиции, международное партнерство и возвращение диаспоры. Экономика диверсифицируется, выходя за рамки углеводородов, и это привлекает внимание всего мира."
 ALG_a_new_algeria: "Новая Алжир"
 ALG_a_new_algeria_desc: "Из пепла старого режима возникает новое государство. Коррупционные сети ликвидированы. Утечка мозгов прекратилась. Алжир является доказательством того, что подлинная демократия может быть построена по воле собственного народа."
 ALG_transitional_instability: "Переходная нестабильность"
 ALG_transitional_instability_desc: "Крах старого порядка оставил после себя вакуум власти. Институты ослаблены, экономика дезорганизована, а политические силы борются за право определять будущее."
 ALG_economic_disruption: "Экономические потрясения"
 ALG_economic_disruption_desc: "Конфискация активов олигархов и реструктуризация коррупционных контрактов временно нарушили экономическую активность."
 ALG_free_press_and_assembly: "Свободная пресса и сборка"
 ALG_free_press_and_assembly_desc: "Независимые газеты издаются без страха. Граждане свободно организуются. Общественное пространство принадлежит народу."
 ALG_diversified_economy: "Диверсифицированная экономика"
 ALG_diversified_economy_desc: "Экономика Алжира выходит за рамки зависимости от нефти, переходя к промышленности, технологиям и устойчивому развитию."
 ALG_new_constitution_permanent: "Народная конституция"
 ALG_new_constitution_permanent_desc: "Новая конституция Алжира, разработанная избранными делегатами и ратифицированная путем всенародного референдума, закрепляет демократические права, разделение властей и верховенство права."
 ALG_presidential_system: "Президентская система"
 ALG_presidential_system_desc: "Сильное правительство с четко определенными полномочиями и демократической подотчетностью управляет Алжиром решительно."
 ALG_parliamentary_system: "Парламентская система"
 ALG_parliamentary_system_desc: "Система принятия решений на основе обсуждения, в которой избранные представители обсуждают, ведут переговоры и достигают консенсуса. Власть распределяется между партиями и коалициями."
 ALG_professional_military: "Профессиональные вооруженные силы"
 ALG_professional_military_desc: "Деполитизированная, модернизированная и находящаяся под гражданским командованием. Алжирская армия служит нации, а не контролирует её."
 ALG_foreign_investment_boom: "Бум иностранных инвестиций"
 ALG_foreign_investment_boom_desc: "Международный капитал поступает в демократический Алжир. Прозрачное управление и верховенство права делают страну привлекательным местом для инвестиций."
 ALG_beacon_of_democracy: "Маяк демократии"
 ALG_beacon_of_democracy_desc: "Алжир является живым доказательством того, что подлинные демократические преобразования возможны. Эта страна вдохновляет движения по всему региону и вызывает восхищение во всем мире."
 ALG_the_nation_stands_at_a_crossroads_desc: "Алжир выходит из «Черного десятилетия» израненным. Более 200 000 погибших, целые деревни разрушены, экономика подорвана гражданской войной. Президент Бутефлика поставил свой мандат на Гражданское соглашение, предложив амнистию боевикам и обещая реформы. Но за ним стоит «Ле Пувуар», теневая сеть генералов и сотрудников разведки, правившая Алжиром с момента обретения независимости. Путь вперед принадлежит тому, кто будет контролировать будущее."
 ALG_counterterrorism_agency_desc: "Департамент разведки и безопасности (DRS) был воссоздан из остатков старой военной разведывательной службы «Военная безопасность» (SM) после гражданской войны. Действуя практически в полной автономии от гражданского надзора, DRS стал самым влиятельным институтом в Алжире, внушающим больший страх, чем сама президентская власть."
 ALG_investments_in_iraq: "Иракская дружба"
 ALG_investments_in_iraq_desc: "Несмотря на то, что в прошлом отношения Ирака с нами были не самыми лучшими, лучше всего нам наладить взаимную симпатию. Мы можем инвестировать в иракскую инфраструктуру и завоевать их доверие."
 ALG_diplo: "Дипломатия МСП"
 ALG_diplo_desc: "Мы должны реформировать нашу дипломатию в соответствии с политикой нашего нового правительства."
 ALG_balance_islamists_and_secularists: "Уравновесить исламистов и секуляристов"
 ALG_balance_islamists_and_secularists_desc: "Необходимо поддерживать хрупкое равновесие между религиозными движениями и светской элитой; в противном случае существует риск возобновления конфликта."
 ALG_new_constutition_reforms: "Конституционные реформы"
 ALG_new_constutition_reforms_desc: "Требования реформ нельзя игнорировать вечно. Новая конституция может открыть путь к более плюралистическому управлению."
 ALG_denounce_previous_colonialist_regimes: "Осудить французский закон о колониализме"
 ALG_denounce_previous_colonialist_regimes_desc: "Французский спорный закон, прославляющий колониальное прошлое страны, вызвал волну возмущения. Фронт национального освобождения должен возглавить движение по осуждению колониальных преступлений и подтвердить борьбу Алжира против колониализма."
 ALG_share_power: "Поделиться властью"
 ALG_share_power_desc: "Вместо того чтобы править в одиночку, Фронт национального освобождения может осторожно делиться властью с отдельными оппозиционными и технократическими силами. Это может сохранить стабильность и одновременно снизить народное недовольство режимом."
 ALG_legacy_revolution: "ФЛН"
 ALG_legacy_revolution_desc: "Фронт национального освобождения (Фронт национального освобождения) — алжирская националистическая партия. До 1989 года она была единственной легальной партией, после чего стала однопартийным государством в Алжире. После гражданской войны в Алжире она вернула себе власть в 2002 году, став самой популярной партией, и сохраняет этот статус до сих пор. Её идеология основана на панарабском националистическом мышлении, а антиколониализм является её основной ценностью. Она поддерживает социализм, особенно арабский социализм, поскольку выступает против марксистских идей."
 ALG_devlop_industry: "Развитие национальной промышленности"
 ALG_devlop_industry_desc: "Будущее Алжира зависит от укрепления его промышленной базы. Сосредоточившись на развитии ключевых секторов, таких как обрабатывающая промышленность, энергетика и технологии, мы можем снизить зависимость от импорта и построить самодостаточную экономику."
 ALG_expand_hydro: "Расширение гидроэнергетической инфраструктуры"
 ALG_expand_hydro_desc: "Для удовлетворения растущих энергетических потребностей нашей страны и снижения зависимости от иностранных ресурсов мы должны инвестировать в расширение гидроэнергетики. Использование потенциала наших рек не только обеспечит чистую энергию, но и укрепит нашу промышленную базу и улучшит условия жизни наших граждан."
 ALG_optimize_water_management: "Оптимизация управления водными ресурсами"
 ALG_optimize_water_management_desc: "Для борьбы с нехваткой воды и повышения урожайности сельского хозяйства необходимо внедрять современные системы управления водными ресурсами. Эффективное распределение и сохранение водных ресурсов поддержат как сельские общины, так и растущие городские центры, а также повысят устойчивость наших земель к засухе."
 ALG_hydroelectric_authority: "Национальное управление гидроэнергетики"
 ALG_hydroelectric_authority_desc: "Создание централизованного управления гидроэнергетикой позволит нам систематически осваивать неиспользованные водные ресурсы Алжира. Это обеспечит надежное электроснабжение для промышленности, а также создаст рабочие места и привлечет квалифицированных специалистов в секторах возобновляемой энергетики."
 ALG_electrify_rural_algeria: "Электрифицировать сельские районы Алжира"
 ALG_electrify_rural_algeria_desc: "Обеспечение электроэнергией сельской местности Алжира имеет важное значение для современного развития. Благодаря расширению электросетей и реализации местных гидропроектов мы можем повысить уровень жизни, внедрить механизацию сельского хозяйства и связать отдаленные населенные пункты с прогрессом страны."
 ALG_foreign_investment: "Привлечение иностранных инвестиций"
 ALG_foreign_investment_desc: "Для ускорения нашего экономического развития мы должны создать благоприятные условия для международного капитала. Стратегическое партнерство в инфраструктурных и энергетических проектах обеспечит как финансирование, так и технические знания, сохраняя при этом национальный суверенитет."
 ALG_algeria_islamic: "МСП"
 ALG_algeria_islamic_desc: "«Движение за мир» (Mouvement de la société pour la paix) — правая и крайне правая политическая партия в Алжире. Она была основана в 1990 году «Братьями-мусульманами», с которыми и остается связана до сих пор. Партия является суннитской исламистской и придерживается исламской, консервативной демократии. Наибольшего успеха она добилась на парламентских выборах 1997 года, став второй по величине партией и получив 69 из 380 мест. Она также однажды участвовала в президентских выборах в 1995 году, получив 25,6% голосов. В 2012 году она вошла в избирательную коалицию с «Братьями-мусульманами» (MRN) и «Братьями-мусульманами» (MRI). Партия также известна как \"Hamas\", как сокращение от ее арабского названия \"Harakat mujtama' as-silm\"."
 ALG_algerian_islamic_movement: "Алжирское исламское движение"
 ALG_algerian_islamic_movement_desc: "Исламское движение, если коротко, представляло собой исламистское движение в Турции, пользовавшееся большой популярностью среди студентов и отстаивавшее пацифистский и современный взгляд на ислам. Мы будем черпать вдохновение из их учений и реформировать наши школьные программы, чтобы пропагандировать исламские ценности и обучать им учащихся, а также улучшать образование в целом."
 ALG_nationwide_security_presence_desc: "В рамках операции «Пустынный ястреб» по всей стране мобилизованы силы безопасности для предотвращения демонстраций в поддержку движения «Хирак». Хотя эта мера эффективна в сдерживании протестов, она увеличивает затраты и подрывает доверие общественности."
 algerian_events.300.t: "Растущее недовольство"
 algerian_events.300.d: "Сообщения о спорадических протестах и актах гражданского неповиновения поступают со всей страны. Общественное недовольство коррупцией, безработицей и отсутствием политических реформ достигает критической точки. Пока демонстрации носят разрозненный характер, но они легко могут перерасти в нечто гораздо более масштабное."
 algerian_events.300.a: "Всё само собой утихнет."
 algerian_events.300.b: "Ситуация может выйти из-под контроля."
 algerian_events.230.t: "В Алжире прокатилась волна массовых протестов."
 algerian_events.230.d: "Алжир потрясли массовые и продолжительные протесты с требованиями политических реформ и свержения правящей власти. Сотни тысяч людей вышли на улицы городов по всей стране в рамках движения, которое называют новым движением «Хирак». Международное сообщество внимательно следит за развитием ситуации."
 algerian_events.230.a: "Переломный момент для Алжира."
 ALG_deepen_african_union: "Углублять сотрудничество Африканского союза"
 ALG_deepen_african_union_desc: "Алжир долгое время был одним из столпов африканской дипломатии. Активно укрепляя свою роль в Африканском союзе, мы можем улучшить наше влияние на континенте, укрепить солидарность и продвинуть инициативы по миру и экономической интеграции. Хотя это потребует финансовых затрат, это укрепит нашу легитимность в Африке."
 ALG_strengthen_maghreb_union: "Укрепить Союз Магриба"
 ALG_strengthen_maghreb_union_desc: "Мечта о региональной интеграции в Северной Африке остается недостижимой, но Алжир обладает потенциалом для ее возрождения. Развивая сотрудничество с нашими магрибскими соседями, мы можем снизить торговые барьеры, повысить дипломатическое доверие и укрепить наши общие культурные и исторические связи."
 ALG_restoration_of_the_ummah: "Восстановление уммы"
 ALG_restoration_of_the_ummah_desc: "Видение единого исламского мира вполне достижимо. Верующие вновь поднимутся под единым знаменем."
 ALG_guidance_council: "Совет по руководству"
 ALG_guidance_council_desc: "Совет ведущих ученых будет контролировать нашу политику и обеспечивать, чтобы правительство оставалось верным божественным указаниям."
 ALG_restore_the_ummah_experiment: "Эксперимент «Умма»"
 ALG_restore_the_ummah_experiment_desc: "Мы попытаемся создать новую модель управления, сочетающую веру, право и лидерство, чтобы вдохновить мусульманский мир."
 ALG_victory_of_the_faithful: "Победа верных"
 ALG_victory_of_the_faithful_desc: "Наша настойчивость и преданность принесли победу. Алжир теперь станет оплотом верующих по всему миру."
 ALG_exterminate_corruption: "Искоренить коррупцию"
 ALG_exterminate_corruption_desc: "Мы искореним коррупцию во всех учреждениях. Ни один чиновник, ни один солдат, ни один священнослужитель не должны стоять выше божественной справедливости."
 ALG_to_serve_allah: "Служить Аллаху"
 ALG_to_serve_allah_desc: "Наше правление не продиктовано мирскими амбициями, а предназначено лишь для Аллаха. Каждая политика, каждая реформа и каждая борьба должны отражать подчинение Его божественной воле. Служение Аллаху – это очищение как народа, так и души."
 ALG_economic_islamization: "Экономическая исламизация"
 ALG_economic_islamization_desc: "Мы перестроим нашу экономику на исламских основах. Системы, основанные на процентах, и коррупция будут заменены финансовыми системами, соответствующими шариату, торговой этикой и справедливым распределением богатства."
 ALG_rust_belt_rejuvenation_desc: "Заброшенные в годы потрясений заводы вновь оживут. Наши рабочие, движимые верой и целеустремленностью, восстановят промышленное сердце Алжира."
 ALG_rule_to_perfection_desc: "Наше управление должно быть усовершенствовано и доведено до совершенства. Халифат разума, состояние души, совершенство в управлении посредством божественной дисциплины."
 ALG_new_islamic_architecture_desc: "Новая эпоха требует нового облика для нашей страны. Красота исламского искусства, воплощенная в мечетях, школах и общественных зданиях, станет символом возрождения Алжира."
 ALG_prioritize_military_industries_desc: "Верная армия должна быть вооружена верной промышленностью. Мы будем уделять приоритетное внимание военному производству, обеспечивая, чтобы наша оборона опиралась на внутренние ресурсы."
 ALG_industrialize_the_umma_desc: "Промышленность должна служить исламу, а не жадности. Умма должна стать самодостаточной, продуктивной и гордой, цивилизацией, движимой как сталью, так и верой."
 ALG_militarize_the_nation: "Милитаризировать страну"
 ALG_militarize_the_nation_desc: "Каждый верующий должен быть готов защитить умму. Мы подготовим наше общество к тотальной мобилизации по божественному повелению."
 ALG_soldiers_of_faith: "Солдаты Веры"
 ALG_soldiers_of_faith_desc: "Наши солдаты сражаются не за землю или власть, а за саму веру. Армия Веры станет щитом ислама и мечом нации."
 ALG_forged_in_belief: "Выкованные в вере"
 ALG_forged_in_belief_desc: "Вера — наша сталь, нерушимая, непоколебимая. Солдаты Алжира закалены в вере и руководствуются божественными убеждениями."
 ALG_disciplined_army_of_god: "Дисциплинированная армия Бога"
 ALG_disciplined_army_of_god_desc: "Мы создадим армию, основанную на послушании, чистоте и непоколебимой преданности. Каждый солдат — это одновременно и воин, и слуга Божий."
 ALG_made_of_steel_and_faith: "Сделано из стали и веры"
 ALG_made_of_steel_and_faith_desc: "Наши легионы будут шествовать с железной силой и верой пророков. Дисциплина и вера сольются в несокрушимую силу."
 ALG_unrestricted_research: "Неограниченные исследования"
 ALG_unrestricted_research_desc: "Наука не является врагом веры. Руководствуясь божественным замыслом, мы будем использовать современные исследования для развития наших военных и технологических возможностей."
 ALG_ai_military_integration: "Интеграция ИИ в военную сферу"
 ALG_ai_military_integration_desc: "Искусственный интеллект и автоматизация станут инструментами, служащими божественному порядку. Мы интегрируем эти системы в нашу оборонную структуру для повышения точности и контроля."
 ALG_new_executors_continent: "Новые исполнители завещаний континента"
 ALG_new_executors_continent_desc: "Алжир готов установить божественное правосудие по всей Африке. Наша вера и несгибаемая воля определят судьбу континента."
 ALG_the_future_in_the_present: "Будущее в настоящем"
 ALG_the_future_in_the_present_desc: "Будущее уже наступило, ведомое мудростью Аллаха и укрепленное человеческими новациями. Наша страна поведет верующих в новую эпоху."
 ALG_destroy_their_will: "Уничтожьте их волю"
 ALG_destroy_their_will_desc: "Мы сокрушим всех, кто противостоит вере, — разумом, волей и телом. Сопротивление будет сломлено, и восторжествует божественный порядок."
 ALG_declare_jihad: "Провозгласите джихад"
 ALG_declare_jihad_desc: "Наше движение повзрослело. Мы больше не будем ограничиваться проповедями и реформами. Пришло время объединить верующих под ружьем, объявить джихад против коррупции и тирании на землях ислама."
 ALG_tharir_al_aqsa: "Тахрир аль-Акса"
 ALG_tharir_al_aqsa_desc: "Освобождение Аль-Аксы — вечный долг уммы. Мы объединим верующих по всему Ближнему Востоку, создав священный союз под одним знаменем сопротивления и единства."
 ALG_faction_with_middle_east: "Объединитесь с Ближневосточным фронтом"
 ALG_faction_with_middle_east_desc: "Ближний Восток остается духовным сердцем ислама. От Дамаска до Мекки наш призыв будет звучать повсюду, объединяя суннитские народы, стремящиеся защитить Аль-Аксу и противостоять угнетателям."
 ALG_faction_with_north_africa: "Объединитесь с Североафриканским фронтом"
 ALG_faction_with_north_africa_desc: "Наши братья в Северной Африке, от пустынь Ливии до улиц Каира, пережили те же трудности. Пришло время протянуть им руку помощи и пригласить их присоединиться к нашему делу."
 ALG_faction_with_asia: "Объединитесь с Восточным фронтом"
 ALG_faction_with_asia_desc: "Свет ислама сияет за пределами Аравии. Народы Центральной и Южной Азии должны быть призваны присоединиться к восстанию уммы, от степей до островов Востока."
 ALG_faction.1.t: "Приглашение из Алжира"
 ALG_faction.1.d: "В наше правительство поступило дипломатическое сообщение из Алжира. Исламский фронт спасения, находящийся сейчас у власти в Алжире, приглашает страны Ближнего Востока присоединиться к новой коалиции — Фронту освобождения Аль-Аксы, призванному координировать политическую и материальную поддержку защиты и освобождения Аль-Аксы. Принятие этого предложения привяжет нас к региональному делу; отказ же отвлечёт нас от алжирского проекта. Как нам следует отреагировать?"
 ALG_faction.1.a: "Примите предложение и присоединитесь к Фронту освобождения Аль-Аксы."
 ALG_faction.1.b: "Отказываемся? Мы не будем вступать в эту региональную коалицию."
 ALG_faction.2.t: "Предложение из Магриба"
 ALG_faction.2.d: "Делегации из Алжира официально пригласили правительства стран Северной Африки заключить соглашение о сотрудничестве в рамках новой коалиции — Фронта освобождения Аль-Аксы. Предложение предусматривает создание магрибского фронта для координации политического давления и гуманитарной поддержки Палестины. Присоединение укрепит связи с Алжиром; отказ сохранит нашу нынешнюю автономию. Как нам ответить?"
 ALG_faction.2.a: "Да, Магриб будет един."
 ALG_faction.2.b: "Нет, мы не пойдем этим путем."
 ALG_faction.3.t: "Обращение из Алжира на Восток"
 ALG_faction.3.d: "Алжирские посланники обратились к мусульманским странам Азии с предложением: присоединиться к Фронту освобождения Аль-Аксы, коалиции, целью которой является координация дипломатических, политических и материальных усилий по защите Аль-Аксы. Эта инициатива призывает к солидарности между регионами, но также рискует втянуть нас в более масштабные конфликты. Присоединимся ли мы к алжирской коалиции?"
 ALG_faction.3.a: "Присоединяйтесь, мы откликаемся на призыв солидарности!"
 ALG_faction.3.b: "Отказ, мы должны избежать этой ввязок."
 ALG_islamic_offices: "Создать исламские офисы"
 ALG_islamic_offices_desc: "Для управления в соответствии с принципами ислама наше движение должно создать организованную структуру, способную управлять как верой, так и государством. Создав исламские управления по всей стране, мы будем контролировать религиозное образование, социальные вопросы и нравственное воспитание, обеспечивая соответствие управления ценностям уммы. Эти управления станут основой нашего нового порядка, объединяя людей под знаменем веры, дисциплины и справедливости."
 ALG_integrate_kabylie_tt: "§GМирно интегрировать Кабили §!"
 ALG_improve_relations_with_egypt: "Улучшение отношений с Египтом"
 ALG_improve_relations_with_egypt_desc: "Египет и Алжир связывают глубокие связи как ведущие арабские страны. Партия мусульманского социального планирования (МСП), корни которой уходят в традиции «Братьев-мусульман», рассматривает Каир как естественного партнера. Укрепление отношений с Египтом повысит наш авторитет в арабском мире и откроет двери для экономического и религиозного сотрудничества."
 ALG_el_karaouin_uni: "Университет Аль-Карауйин"
 ALG_el_karaouin_uni_desc: "Установив связи с одним из старейших исламских университетов мира, ФИС будет воспитывать поколение ученых, лояльных новому порядку, дистанцируясь от религиозной власти."
 ALG_father_of_the_ummah: "Отец уммы"
 ALG_father_of_the_ummah_desc: "Лидер Исламского фронта спасения будет позиционировать себя как духовного отца всей мусульманской общины, культивируя культ личности, основанный на благочестии и божественном предписании."
 ALG_followers_of_the_prophet: "Последователи Пророка"
 ALG_followers_of_the_prophet_desc: "Государство будет преобразовано в соответствии со строгим следованием Сунне. От граждан ожидается, что они будут жить так, как жил Пророк, а государственные институты будут реструктурированы в соответствии с этим видением."
 ALG_governmental_cleansing: "Государственная чистка"
 ALG_governmental_cleansing_desc: "Тех представителей государственного аппарата, которые будут признаны недостаточно набожными или идеологически нечистыми, будут систематически увольнять и заменять верными сторонниками движения."
 ALG_make_our_nation_pure: "Сделаем нашу нацию чистой"
 ALG_make_our_nation_pure_desc: "Исламский фронт запустит масштабную социальную кампанию по искоренению западного влияния в алжирском обществе, направленную на внедрение исламских ценностей в образование, одежду и общественное поведение."
 ALG_new_patriotism: "Новый патриотизм"
 ALG_new_patriotism_desc: "Любовь к Алжиру и любовь к исламу — это одно и то же. ФИШ (Федерация исламского сопротивления) создаст новую национальную идентичность, где вера станет основой гражданской гордости и коллективной цели."
 ALG_restore_the_soul_of_the_ummah: "Восстановить душу уммы"
 ALG_restore_the_soul_of_the_ummah_desc: "Алжир возьмет на себя священный долг возродить духовное пламя мусульманского мира, позиционируя государство как моральный ориентир для всех исламских стран."
 ALG_sharia_through_discipline: "Шариат через дисциплину"
 ALG_sharia_through_discipline_desc: "Законы шариата будут применяться не путем убеждения, а путем жесткой дисциплины. Государство расширит свои полномочия по контролю и наказанию, чтобы обеспечить полное соблюдение исламского права."
 ALG_strength_and_virtue: "Сила и добродетель"
 ALG_strength_and_virtue_desc: "Сильное государство и добродетельный народ неразделимы. ФИШ будет инвестировать как в нравственное воспитание, так и в институциональную дисциплину, чтобы построить общество, праведное по характеру и твердое в своих решимости."
 ALG_strict_authority: "Строгий авторитет"
 ALG_strict_authority_desc: "Новому Алжиру необходима твердая рука. ФИСС централизует власть и увеличит бюджет полиции, обеспечивая соблюдение населением норм поведения движения."
 ALG_the_people_are_not_to_be_trusted: "Людям нельзя доверять."
 ALG_the_people_are_not_to_be_trusted_desc: "Демократия доказала свою способность открывать путь к коррупции и безбожию. ФИШ (Федерация исламского правосудия) демонтирует демократический процесс и передаст управление в руки тех, кто знает, чего требует Аллах."
 ALG_urban_preachers: "Городские проповедники"
 ALG_urban_preachers_desc: "ФИС направит в города Алжира сеть проповедников, которые будут распространять идеологию движения и укреплять государственный ислам как доминирующую силу в общественной жизни."
 ALG_jamiat_al_karaouin_desc: "Связи с древним институтом Аль-Карауийин породили новый класс исламских ученых, лояльных государству ФИС и враждебно настроенных к военному вмешательству в религиозные дела."
 ALG_coalition_economic_program: "Коалиционная экономическая программа"
 ALG_coalition_economic_program_desc: "Президентская коалиция должна представить единую экономическую концепцию. Координируя экономическую политику наших партнеров по коалиции, мы сможем привлечь инвестиции, поддержать малый бизнес и заложить основу для устойчивого роста. Сильная экономика придаст легитимность коалиции и заставит замолчать наших критиков."
 ALG_governmental_transparency: "Прозрачность государственного управления"
 ALG_governmental_transparency_desc: "Если наш демократический путь должен иметь смысл, мы должны придерживаться более высоких стандартов, чем те, кто был до нас. Внедряя меры по обеспечению прозрачности и открывая правительственные документы для общественного контроля, мы можем искоренить коррупцию и восстановить доверие народа к своим институтам, даже если это означает нажить врагов среди старой гвардии."
 ALG_support_mujahideen: "Поддержите моджахедов"
 ALG_support_mujahideen_desc: "Внутри государства существуют силы, выступающие за тайную поддержку исламистских боевиков, действующих в регионе. Хотя такие действия могут укрепить наше влияние в радикальных сетях и дестабилизировать враждебных деятелей, они чреваты серьезным международным противодействием и долгосрочными внутренними последствиями."
