 GEO_COMMUNISM_DESC: "格鲁吉亚将走共产主义道路。他们将恢复苏维埃共和国，并依靠游戏规则中的共产主义行为，他们要么接受外高加索社会主义联邦苏维埃共和国，要么遵循自己的道路。"
