 UKR_repair_slots_expand_desc: "\n\n\n\n\n\n£UKR_desctext_strategic_aviation_narp\n\n\n\n\n\n\n\n\nВыделить средства на дополнительные сборочные линии НАРП, чтобы увеличить число одновременно ремонтируемых самолётов на §C1§!, но не более §C6§!."
 UKR_repair_slots_expand_effect_tt: "Максимум одновременных ремонтов: §C+1§!"
 UKR_bureau_open_desc: "Выносит расходы на §Yбюрократию§! на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ повышают готовность депутатов одобрить §Gсокращение§! бюджета."
 UKR_bureau_close_desc: "Снимает расходы на §Yбюрократию§! с повестки дня §YВерховной Рады§!. Запросы по расходам исчезнут, пока мы снова не откроем дебаты."
 UKR_military_open_desc: "Выносит §Oвоенные§! расходы на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ и оборонных проектов повышают готовность депутатов одобрить §Rувеличение§! бюджета."
 UKR_military_close_desc: "Снимает §Oвоенные§! расходы с повестки дня §YВерховной Рады§!. Запросы по расходам исчезнут, пока мы снова не откроем дебаты."
 UKR_police_open_desc: "Выносит расходы на §Cбезопасность§! на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ повышают готовность депутатов одобрить §Rувеличение§! бюджета."
 UKR_police_close_desc: "Снимает расходы на §Cбезопасность§! с повестки дня §YВерховной Рады§!. Запросы по расходам исчезнут, пока мы снова не откроем дебаты."
 UKR_education_open_desc: "Выносит расходы на §Gобразование§! на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ повышают готовность депутатов одобрить §Rувеличение§! бюджета."
 UKR_education_close_desc: "Снимает расходы на §Gобразование§! с повестки дня §YВерховной Рады§!. Запросы по расходам исчезнут, пока мы снова не откроем дебаты."
 UKR_medical_open_desc: "Выносит расходы на §Rздравоохранение§! на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ повышают готовность депутатов одобрить §Rувеличение§! бюджета."
 UKR_medical_close_desc: "Снимает расходы на §Rздравоохранение§! с повестки дня §YВерховной Рады§!. Запросы по расходам исчезнут, пока мы снова не откроем дебаты."
 UKR_pension_open_desc: "Выносит §Oпенсионные§! расходы на повестку дня §YВерховной Рады§!. Пока идут дебаты, мы можем запросить §Rувеличение§! или §Gсокращение§! бюджета. Рассмотрение запроса занимает §Y30§! дней, после чего депутаты голосуют. Шанс одобрения зависит от того, сколько мест в Раде нас поддерживает и насколько велико наше влияние на неё. Бонусы от наших реформ повышают готовность депутатов одобрить §Rувеличение§! бюджета."
 UKR_pension_close_desc: "Снимает §Oпенсионные§! расходы с повестки дня §YВерховной Рады§!. Запросы по расходам исчезнут, пока мы снова не откроем дебаты."
 UKR_foreign_finances_category: "Иностранные финансы и влияние"
 UKR_foreign_finances_category_desc: "Независимая Украина унаследовала разрушенную экономику, и значительная часть денег, на которые живёт государство, поступает из-за рубежа. Здесь мы можем продавать государственные активы, просить кредиторов реструктурировать наши долги или обращаться за займами к §7Западу§! или §tВостоку§!. Мы также можем продвигать среди населения [SOV.GetFlag] §Yроссийские§! или [USA.GetFlag] §Yзападные§! интересы.\n\nНи один заём не даётся без условий. Каждый кредитор получает §Yвлияние§! на нашу политику, а баланс иностранного влияния определяет, какой блок победит на следующих выборах в §YВерховную Раду§!."
