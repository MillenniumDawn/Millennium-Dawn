 CZE_SLO_reformed_czechoslovakia: "§Y상대가 지역 강국이거나 열강일수록 수락할 가능성이 낮아집니다.§!\n\n   §G수락하면 귀국은 §Y체코슬로바키아§!로 불리게 되며 이웃 나라를 병합합니다. 또한 §Y체코슬로바키아 정세§! 결정 탭이 비활성화됩니다.§!\n\n   §R거부하면 대체 경로인 §Y지배적 지역§!이 잠금 해제될 수 있으며, 이를 따르기로 하면 두 나라가 강제로 통합됩니다.§!"
