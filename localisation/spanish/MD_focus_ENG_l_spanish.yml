 ENG_celsa_steel_idea: "Asociación siderúrgica con Celsa"
 ENG_celsa_steel_idea_desc: "Una asociación a largo plazo con la fundición de Celsa en Cardiff asegura un flujo constante de chatarra reciclada para convertirla en acero nuevo, mejorando el rendimiento de nuestros recursos y dándonos la influencia necesaria para presionar por nuevos incrementos de producción cada año."
 ENG_celsa_steel_tt: "§YYearly 50% Chance of gaining§! §G+2§! §Y$country_resource_steel$§! (up to §Y10§! times)"
 ENG_coal_opencast_mining: "Carbón escocés a cielo abierto"
 ENG_coal_opencast_mining_desc: "Las nuevas minas a cielo abierto en las cuencas carboníferas de Escocia mantienen un flujo constante de combustible barato hacia nuestras centrales eléctricas de combustibles fósiles, lo que les permite trabajar a mayor capacidad y generar más electricidad para la red eléctrica."
 ENG_glasgow_shipbuilding_idea1: "Centro de construcción naval de Glasgow"
 ENG_glasgow_shipbuilding_idea1_desc: "La inversión en los astilleros del Clyde ha optimizado el diseño, la soldadura y el equipamiento, reduciendo el coste de producción de todos nuestros buques de guerra construidos en Glasgow y más allá."
 ENG_glasgow_shipbuilding_idea1_tt: "§YCoste de construcción de todos los buques navales:§! §G-5%§!"
 ENG_glasgow_shipbuilding_idea2: "Centro de construcción naval de Glasgow"
 ENG_glasgow_shipbuilding_idea2_desc: "La inversión en los astilleros del Clyde ha optimizado el diseño, la soldadura y el equipamiento, reduciendo el coste de producción de todos nuestros buques de guerra construidos en Glasgow y más allá."
 ENG_glasgow_shipbuilding_idea2_tt: "§YCoste de construcción de todos los buques navales:§! §G-5%§!\n §YCoste de diseño de todos los buques navales:§! §G-20%§!"
 ENG_highland_main_line: "Highland Main Line"
 ENG_highland_main_line_desc: "La modernizada línea ferroviaria Highland Main Line conecta Perth e Inverness con trenes más rápidos y fiables, ayudando a las empresas locales a llegar a los mercados, trabajadores y servicios con mayor facilidad."
 ENG_crossrail: "Red Crossrail"
 ENG_crossrail_desc: "La Elizabeth Line unifica a Heathrow, el West End, la City y Canary Wharf en un único mercado laboral, facilitando los desplazamientos diarios, aliviando las líneas saturadas y elevando la productividad de la economía de oficinas de Londres."
 ENG_high_value_manufacturing_zone: "Zona de manufactura de alto valor"
 ENG_hs2_idea: "High-Speed 2"
 ENG_northern_powerhouse_rail_idea: "Ferrocarril de la Potencia del Norte"
 ENG_andrew_digital_enterprise_modifier: "Campaña real de digitalización empresarial"
 ENG_andrew_digital_enterprise_modifier_desc: "Respaldada por las redes de patronazgo del duque de York, ha surgido una nueva iniciativa para conectar a inversores, empresas regionales y proyectos tecnológicos a través de un marco comercial más moderno. Se están utilizando oficinas de promoción comercial, foros empresariales y asociaciones con el sector privado para acelerar la adopción digital y mejorar la visibilidad de las empresas británicas tanto en el país como en el extranjero."
 ENG_edward_beach_youth_modifier: "Campaña de alcance juvenil del duque"
 ENG_edward_beach_youth_modifier_desc: "Bajo el patronazgo del conde de Wessex, se han ampliado las iniciativas de compromiso juvenil mediante programas de premios, redes comunitarias y eventos públicos en todo el país. La campaña hace hincapié en la confianza, el servicio cívico y las habilidades prácticas, fortaleciendo la cohesión social al tiempo que alienta a una nueva generación a participar en la vida nacional."
