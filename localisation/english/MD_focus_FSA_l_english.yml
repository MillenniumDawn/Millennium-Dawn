 #Decisions
 FSA_internal_revolt_category: "Wolves in Sheep's Clothing"
 FSA_internal_revolt_category_desc: "As the conflict drags on the Free Syrian Army has become a patchwork of brigades with differing goals, loyalties, and ideologies. Islamist factions and other Salafi-aligned movements have embedded themselves within the broader FSA structure. While they offer experienced fighters and hold key territory, their long-term ambitions pose a direct threat to any attempt at building a democratic or pluralistic post-conflict Syria."
 FSA_defection_to_extremist: "Defection to Extremism"
 FSA_defection_to_extremist_desc: "Radical Islamist groups are gaining influence within our ranks. Each expired countdown raises radical influence by one level, up to $FSA_extremism5$. Capturing the listed cities delays the next increase. The penalties end when our war against the Syrian government ends or Salafists take power."
 FSA_capture_aleppo: "Capture Aleppo"
 FSA_capture_aleppo_desc: "Taking Aleppo before the deadline will delay the next rise in radical influence."
 FSA_capture_ar_raqqah: "Capture al-Raqqa"
 FSA_capture_ar_raqqah_desc: "Taking al-Raqqa before the deadline will delay the next rise in radical influence."
 FSA_capture_damascus: "Capture Damascus"
 FSA_capture_damascus_desc: "Taking Damascus before the deadline will delay the next rise in radical influence."
 FSA_capture_deir_ez_zur: "Capture Deir ez-Zor"
 FSA_capture_deir_ez_zur_desc: "Taking Deir ez-Zor before the deadline will delay the next rise in radical influence."
 FSA_capture_hama: "Capture Hama"
 FSA_capture_hama_desc: "Taking Hama before the deadline will delay the next rise in radical influence."
 FSA_capture_homs: "Capture Homs"
 FSA_capture_homs_desc: "Taking Homs before the deadline will delay the next rise in radical influence."
 FSA_capture_latakia: "Capture Latakia"
 FSA_capture_latakia_desc: "Taking Latakia before the deadline will delay the next rise in radical influence."
 FSA_capture_tartus: "Capture Tartus"
 FSA_capture_tartus_desc: "Taking Tartus before the deadline will delay the next rise in radical influence."
 FSA_war_effort_category: "The Revolution's War Effort"
 FSA_war_effort_category_desc: "The revolution runs on local committees, defectors, and whatever help reaches us across the borders. We can arm the neighborhoods, call on soldiers to leave the regime, and ask foreign capitals for weapons and money."
 FSA_raise_local_militia: "Arm the Local Committees"
 FSA_raise_local_militia_desc: "The coordination committees in our towns can field two militia brigades within a week if we give them rifles and a command."
 FSA_appeal_to_defectors: "Call on Soldiers to Defect"
 FSA_appeal_to_defectors_desc: "Broadcasts, leaflets, and messages to relatives in the army remind the regime's conscripts that they have a place with the revolution. Every point of support the regime loses makes the next wave of defections more likely and larger."
 FSA_request_foreign_support: "Ask [From.GetNameDef] for Support"
 FSA_request_foreign_support_desc: "Our envoys will spend ten days pressing [From.GetNameDef] for weapons, money, or military advisors. They may refuse, and they will not hear a second appeal for three months."
 FSA_turkish_border_route: "Smuggle Arms through Turkey"
 FSA_turkish_border_route_desc: "Bab al-Hawa and the crossings north of Azaz stay open while Ankara looks away. Weapons bought on the black market reach our brigades within two weeks."
 FSA_turkish_border_route_tt: "If [TUR.GetNameDef] backs the revolution, it sends §Ytwice§! as many weapons."
 FSA_jordanian_southern_front: "Arm the Southern Front"
 FSA_jordanian_southern_front_desc: "Supply lines from Jordan reach our brigades around Daraa. As long as Amman stays out of the war, rifles, anti-tank weapons, and a few air defense systems come north."


 #Dynamic (State) Modifiers
 SYR_free_syrian_offensive: "Free Syrian Offensive"
 SYR_free_syrian_offensive_desc: "What began as isolated demonstrations has erupted into nationwide unrest. Protests have spread across cities and towns, overwhelming regime security forces and inspiring mass defections. With momentum on their side, Free Syrian forces are preparing coordinated offensives to seize control and push the uprising into a new phase."
