 ARM_defence: "Em Guarda da Armênia"
 ARM_defence_desc: "Nosso país precisa de melhor proteção, e somente os melhores serviços especiais podem oferecê-la, os quais financiaremos generosamente."
 ARM_police: "Polícia da Armênia"
 ARM_police_desc: "A Polícia da República da Armênia é a polícia nacional da Armênia. Agora estamos prontos para reformas globais dessa estrutura: contrataremos novo pessoal, eliminaremos funcionários corruptos e aumentaremos o financiamento da polícia."
 ARM_police_troops: "Tropas Policiais"
 ARM_police_troops_desc: "As Tropas Policiais Armênias participaram de todas as grandes operações ao lado das antigas Tropas Internas e de seus predecessores soviéticos. Seu mandato abrange a proteção de instalações especiais, a manutenção da ordem pública, a segurança pública e o treinamento preliminar de recrutas e suboficiais."
 ARM_national_central_bureua: "Escritório Central Nacional"
 ARM_national_central_bureua_desc: "O Escritório Central Nacional divide seu trabalho em três divisões, abrangendo criminologia, apoio operacional e assistência técnica. Aumentaremos o financiamento e realizaremos reformas de pessoal para que as três funcionem em plena capacidade."
 ARM_special_oper_forces: "Forças de Operações Especiais"
 ARM_special_oper_forces_desc: "Forças especiais de elite da polícia armênia, encarregadas de combater ameaças armadas ao Estado. Sua composição e equipamento atuais ficam aquém dos padrões modernos, e pretendemos reformular ambos por completo."
 ARM_black_panters: "Panteras Negras"
 ARM_black_panters_desc: "As Panteras Negras são ex-militares integrados às forças especiais da polícia. Sua experiência de combate e métodos de campo são um ativo valioso para nossas estruturas de aplicação da lei."
 ARM_nss: "Serviço de Segurança Nacional"
 ARM_nss_desc: "O Serviço de Segurança Nacional é a principal agência de segurança nacional e inteligência da Armênia. Ainda relativamente jovem, carece de pessoal experiente. Resolveremos isso com reformas direcionadas e maior financiamento."
 ARM_take_border_troops: "Guarda de Fronteira"
 ARM_take_border_troops_desc: "A Guarda de Fronteira Armênia monitora e protege as fronteiras da Armênia com a Turquia, o Azerbaijão, o Irã e a Geórgia. Cronicamente subfinanciada, atualmente desempenha apenas uma fração de suas funções determinadas. Vamos corrigir isso."
 ARM_economic_corruption_security: "Segurança Econômica e Combate à Corrupção"
 ARM_economic_corruption_security_desc: "Esta unidade é responsável por combater a corrupção e proteger a economia armênia contra sabotagem interna. Com a segurança econômica mais crítica do que nunca, investir neste departamento é uma necessidade, não um luxo."
 ARM_constitutional_teerorism: "Segurança e a Constituição"
 ARM_constitutional_teerorism_desc: "Este departamento existe para defender a ordem constitucional e combater o terrorismo. Financiamento adicional aprimorará suas capacidades e melhorará sua capacidade de resposta."
 ARM_alpha: "Forças Especiais Alpha"
 ARM_alpha_desc: "As forças especiais de elite dos serviços de inteligência armênios, cobrindo uma ampla gama de tarefas, do combate ao crime organizado ao contraterrorismo. A renovação de pessoal e o aumento do financiamento melhorarão significativamente suas capacidades."
 ARM_fis_desc: "O Serviço de Inteligência Estrangeira é a principal agência de inteligência externa da Armênia. Nosso próprio serviço de inteligência estatal, que será responsável por todas as nossas ações não oficiais de política externa."
 ARM_special_services_category: "Serviços Especiais da Armênia"
 ARM_special_services_category_desc: "[ARM.GetFlag]§YArmênia§! é protegida não apenas por um valente exército que superou o [NKR.GetFlag]§Rconflito de Karabakh§! com §Gvitória§!, mas também por valentes £text_icon_armnss §2forças de segurança e serviços especiais§!, com os quais o Estado não deve economizar, pois essa é a chave para a §Y£text_icon_armnss segurança interna do país§!.\n\n§GConcluindo§! focos no £text_icon_armnss §Yramo dos serviços especiais§!, você §Gdesbloqueará§! cada vez mais §Yespíritos nacionais§!, que serão exibidos abaixo."
