 israel_mechanic.15.t: "Ataque cibernético a instalações nucleares iranianas!"
 israel_mechanic.15.d: "Recentemente, uma suposta e ainda não reconhecida campanha de sabotagem por meio de interrupção cibernética foi direcionada a instalações nucleares iranianas. O Irã afirma que os responsáveis são Israel e os EUA. No entanto, esses países não confirmaram tais alegações."
 israel_mechanic.15.a: "Interessante."
 israel_mechanic.16.t: "Ataque cibernético fracassado a instalações nucleares iranianas!"
 israel_mechanic.16.d: "Recentemente, os firewalls iranianos detectaram um novo worm cibernético que foi implantado nos sistemas das instalações nucleares iranianas para interromper o desenvolvimento nuclear do Irã."
 israel_mechanic.17.t: "Nossos agentes em Teerã!"
 israel_mechanic.17.d: "Nossos agentes estão perto do armazém onde supostamente fica o arquivo nuclear do Irã. O turno da manhã dos guardas iranianos chegaria por volta das 7h, revelou um ano de nossa vigilância do armazém, e os agentes têm ordens de partir antes das 5h. Precisamos agir rápido e decidir logo o que fazer."
 israel_mechanic.17.a: "Pegar maçaricos e cortar os cofres."
 israel_mechanic.17.b: "Pegar C4 e explodir a entrada rapidamente."
 israel_mechanic.1711.t: "Explosão nos arredores de Teerã"
 israel_mechanic.1711.d: "Nossas fontes internas nos transmitem uma mensagem sobre uma explosão perto do armazém onde guardamos nosso arquivo nuclear."
 israel_mechanic.1711.a: "Mandem os Guardas!"
 israel_mechanic.18.t: "Operação bem-sucedida!"
 israel_mechanic.18.d: "Nossos agentes extraíram com sucesso o arquivo nuclear iraniano. Assim que os custodiantes iranianos chegaram, ficou instantaneamente claro que alguém havia roubado grande parte do arquivo nuclear clandestino do país, que documentava anos de trabalho em armas atômicas, projetos de ogivas e planos de produção."
 israel_mechanic.18.a: "Maravilhoso!"
 israel_mechanic.1811.t: "Nosso arquivo nuclear foi roubado!"
 israel_mechanic.1811.d: "Agentes do Mossad conseguiram roubar nosso arquivo nuclear e agora Israel tem todos os nossos planos e documentos de pesquisa sobre nossos projetos nucleares."
 israel_mechanic.1811.a: "Maldição!"
 israel_mechanic.19.t: "Operação fracassada!"
 israel_mechanic.19.d: "Nossos agentes foram capturados e serão interrogados pelo ministério do interior iraniano. Eles não conseguiram transferir os documentos antes de serem capturados."
 israel_mechanic.19.a: "Ah, dro..."
 israel_mechanic.1911.t: "Agentes israelenses capturados!"
 israel_mechanic.1911.d: "Recentemente, agentes israelenses foram capturados nos arredores de Teerã tentando roubar nosso arquivo nuclear. Esses agentes serão mantidos reféns e interrogados."
 israel_mechanic.1911.a: "Condecorem nossos Guardas!"
 israel_mechanic.20.t: "Operação inconclusiva!"
 israel_mechanic.20.d: "Nossos agentes conseguiram escapar, porém o prédio foi destruído e todas as informações que poderíamos ter obtido foram destruídas também."
 israel_mechanic.20.a: "Bem..."
 ISR_archive_stolen: "Nosso Arquivo Nuclear Roubado"
 ISR_archive_destroyed: "Arquivo Nuclear Destruído"
 israel_mechanic.2011.t: "Nosso arquivo nuclear foi destruído!"
 israel_mechanic.2011.d: "Parece que os agentes do Mossad queriam roubar os documentos do nosso armazém secreto nos arredores de Teerã, mas simplesmente destruíram o prédio, por incompetência. Provavelmente já fugiram do país, mas talvez esse desfecho não seja o pior de todos os possíveis."
 israel_mechanic.2011.a: "Bem..."
 full_blockades_isr: "Boicota Israel"
 part_blockades_isr: "Boicota Parcialmente Israel"
 full_isr_boycotte: "§YBoicote§! §OTotal§! a [ISR.GetNameWithFlag]"
 full_isr_boycotte_desc: "O bloqueio a [ISR.GetNameWithFlag] por muitas nações do Oriente Médio envolveu várias formas de restrições econômicas, diplomáticas e militares.\n\nPaíses como [ROOT.GetNameWithFlag] participam dos esforços para isolar [ISR.GetNameWithFlag] fechando seu espaço aéreo às aeronaves de [ISR.GetNameWithFlag], proibindo o comércio e recusando-se a reconhecer o direito de [ISR.GetNameWithFlag] de existir.\n\nTais ações fazem parte de uma estratégia mais ampla da §7Liga Árabe§! e de países simpatizantes do Oriente Médio para enfraquecer a economia de [ISR.GetNameWithFlag] e restringir sua influência regional. O bloqueio também incluiu o boicote a empresas que faziam negócios com [ISR.GetNameWithFlag] e o apoio a movimentos de §Gresistência§! §8palestinos§!."
 pol_isr_boycotte: "§YBoicote§! §CPolítico§! a [ISR.GetNameWithFlag]"
 pol_isr_boycotte_desc: "O bloqueio a [ISR.GetNameWithFlag] por muitas nações do Oriente Médio envolveu várias formas de restrições econômicas, diplomáticas e militares.\n\nPaíses como [ROOT.GetNameWithFlag] participam dos esforços para isolar [ISR.GetNameWithFlag] apenas politicamente, às vezes recusando-se a reconhecer o direito de [ISR.GetNameWithFlag] de existir, não aceitando passaportes de [ISR.GetNameWithFlag] e não mantendo laços políticos diretos, mas mantendo a possibilidade de comércio.\n\nTais ações fazem parte de uma estratégia mais ampla da §7Liga Árabe§! e de países simpatizantes do Oriente Médio para enfraquecer a economia de [ISR.GetNameWithFlag] e restringir sua influência regional. O bloqueio também incluiu o boicote a empresas que faziam negócios com [ISR.GetNameWithFlag] e o apoio a movimentos de §Gresistência§! §8palestinos§!."
 econ_isr_boycotte: "§YBoicote§! §7Econômico§! a [ISR.GetNameWithFlag]"
 econ_isr_boycotte_desc: "O bloqueio a [ISR.GetNameWithFlag] por muitas nações do Oriente Médio envolveu várias formas de restrições econômicas, diplomáticas e militares.\n\nPaíses como [ROOT.GetNameWithFlag] participam dos esforços para isolar [ISR.GetNameWithFlag] fechando seu espaço aéreo às aeronaves de [ISR.GetNameWithFlag], proibindo o comércio e não participando de projetos de investimento, mas mantendo a possibilidade de negociações políticas.\n\nTais ações fazem parte de uma estratégia mais ampla da §7Liga Árabe§! e de §7países do Oriente Médio§! simpatizantes para enfraquecer a economia de [ISR.GetNameWithFlag] e restringir sua influência regional. O bloqueio também incluiu o boicote a empresas que faziam negócios com [ISR.GetNameWithFlag] e o apoio a movimentos de §Gresistência§! §8palestinos§!."
 ISR_boycott_map: "Países que podem boicotar nosso país:"
 ISR_juj_map: "Ir para [ISR.GetNameWithFlag] no mapa"
 israel_boycott_arabside_category: "Boicote a [ISR.GetNameWithFlag]"
 israel_boycott_arabside_category_desc: "Nosso país, [ROOT.GetNameWithFlag], como país muçulmano, pode boicotar [ISR.GetNameWithFlag] para deter sua §8expansão econômica ou política§!, ou suspender o boicote para cooperar mais com [ISR.GetNameWithFlag].\nSe continuarmos o boicote parcial, apenas §Orestringiremos§! [ISR.GetNameWithFlag] em uma esfera específica - nas relações econômicas ou políticas conosco.\nSe optarmos por §Rboicotar totalmente§! Israel, não poderemos ter nenhuma relação diplomática ou econômica com [ISR.GetNameWithFlag]."
 stop_boyc_me: "§YEncerrar§! o Boicote"
 strict_the_boyc: "§OEndurecer§! o Boicote"
 leave_the_boyc: "§7Abandonar§! o Boicote por Completo"
 aband_boyc: "Abandonou o boicote"
 decreses_boyc_tt: "§YIsto reduzirá o boicote do país ou países em questão!§!"
 israel_economy.221.t: "[FROM.GetNameWithFlag] decidiu encerrar o boicote!"
 israel_economy.221.d: "Recentemente, o governo de [FROM.GetNameWithFlag] decidiu parar de boicotar nosso país. Todos os laços necessários foram restabelecidos. No entanto, dizem que podem voltar a nos boicotar se nossas políticas tiverem impacto negativo sobre eles ou sobre a região."
 israel_economy.221.a: "Ótimo!"
 israel_economy.222.t: "[FROM.GetNameWithFlag] decidiu endurecer o boicote!"
 israel_economy.222.d: "Recentemente, o governo de [FROM.GetNameWithFlag] decidiu endurecer o boicote ao nosso país. Muitos laços com eles estão agora interrompidos... No entanto, dizem que podem voltar a não nos boicotar se nossas políticas tiverem impacto positivo sobre eles ou sobre a região."
 israel_economy.222.a: "Já era de se esperar!"
 israel_economy.223.t: "[FROM.GetNameWithFlag] decidiu abandonar o boicote!"
 israel_economy.223.d: "Recentemente, o governo de [FROM.GetNameWithFlag] decidiu abandonar para sempre o boicote ao nosso país. Todos os laços necessários foram restabelecidos e têm continuidade garantida. Isso não significa que tolerarão qualquer hostilidade nossa contra eles, mas o espírito de amizade nos laços entre nós agora é evidente."
 israel_economy.223.a: "Ótimo!"
 Cat_GENES: "Pesquisa Genética"
 israel.5.t: "Exercícios conjuntos EUA-Israel!"
 israel.5.d: "Recentemente, nossas forças armadas realizaram exercícios militares com [ISR.GetNameWithFlag], dos quais ambos os países obtiveram mais experiência em combate urbano, coordenação e logística."
 israel.5.a: "Ótimo!"
 will_appear_after_dec_tt: "§YO efeito deste foco aparecerá depois que decidirmos qual plano militar usar!§!"
 golan_fort_tt: "§YAdiciona forte terrestre de nível 2 na fronteira com o Hezbollah e a Síria!§!"
 israel.6.t: "Exercícios conjuntos Chipre-Israel!"
 israel.6.d: "Recentemente, nossas forças armadas realizaram exercícios militares com [ISR.GetNameWithFlag], dos quais ambos os países obtiveram mais experiência em combate em montanha, coordenação e logística."
 israel.6.a: "Ótimo!"
 israel.7.t: "Israel quer comprar nossos aviões"
 israel.7.d: "Israel quer comprar várias dezenas de nossas aeronaves de treinamento para seu exército de defesa e as FDI. Concordamos?"
 israel.7.a: "Claro."
 israel.7.b: "Não."
 israel.8.t: "A Alemanha concordou"
 israel.8.d: "A Alemanha aprovou oficialmente a entrega de suas aeronaves de treinamento a nós. O primeiro lote de aeronaves chegará em breve ao nosso país."
 israel.8.a: "Ótimo."
 israel.9.t: "A Alemanha nos rejeitou"
 israel.9.d: "A Alemanha rejeitou nossa oferta de comprar suas aeronaves de treinamento. Parece que precisamos procurar outro fornecedor confiável."
 israel.9.a: "Triste."
 israel.10.t: "Israel quer comprar um lote de nossos aviões"
 israel.10.d: "Israel está pedindo nossos F-35 para seus regimentos aéreos. Essas aeronaves estão entre as mais avançadas, mas com elas podemos aumentar nossa influência no Oriente Médio e em Israel. Devemos vendê-las?"
 israel.10.a: "Claro."
 israel.10.b: "Não."
 israel.11.t: "A América concordou em vender o F-35"
 israel.11.d: "A América concordou em nos vender suas aeronaves mais recentes. Com a ajuda delas, poderemos obter superioridade aérea em nossa região. O primeiro lote de aviões já chegou ao nosso país."
 israel.11.a: "Ótimo."
 israel.12.t: "A América recusou"
 israel.12.d: "A América se recusou a nos fornecer seus aviões. Eles não querem que suas aeronaves caiam em mãos erradas. Teremos que encontrar um novo fornecedor de caças modernos."
 israel.12.a: "Triste."
 ISR_modernization_of_armored_forces_idea: "Corpo Blindado Modernizado"
 ISR_ger_fleet_tt: "Enviaremos um pedido a §Y[GER.GetNameWithFlag]§! para a compra de §Y3 Submarinos Alemães§! por $3.6 bilhões."
 ISR_ger_fleet_again_tt: "Enviaremos um pedido a §Y[GER.GetNameWithFlag]§! para a compra de §Y3 Submarinos Alemães§! por $3.6 bilhões novamente.\nNo entanto, o §Yestablishment§! pode ficar §Rcético§! quanto a realizar o mesmo acordo outra vez."
 ISR_GER_agree_to_sell_tt: "Concordamos em construir §Y3 submarinos§! por $3.6 bilhões"
 israel.13.t: "[ISR.GetNameWithFlag] enviou uma proposta interessante"
 israel.13.d: "Uma delegação de [ISR.GetNameWithFlag] chegou ao nosso país com uma proposta interessante. Eles oferecem muito dinheiro em troca de construirmos alguns navios para eles."
 israel.13.a: "Vamos fazer isso!"
 israel.13.b: "Nossa frota não é mercadoria à venda."
 israel.14.t: "[FROM.GetNameWithFlag] aceita!"
 israel.14.d: "[FROM.GetNameWithFlag] aceita nossa proposta de construir alguns navios para nós!"
 israel.14.a: "Ótimo!"
 israel.15.t: "[FROM.GetNameWithFlag] rejeita!"
 israel.15.d: "[FROM.GetNameWithFlag] rejeita nossa proposta de construir alguns navios para nós!"
 israel.15.a: "Droga!"
 madan_idea: "Divisão de Inteligência Naval Israelense"
 ISR_air_reservists_idea: "Estratégia de Reservistas"
 ISR_air_profs_idea: "Pilotos Profissionais"
 cheap_solut_tt: "§YEste foco§! é §Gmais barato§! e §Gnão§! precisa da aprovação do §4Knesset§!!"
 ISR_intelligence_lahak: "O Lahak da Inteligência"
 ISR_idid_rest: "Domínio do IDI"
 kirya_ontop: "Domínio da Kirya"
 gilot_ontop: "Domínio de Gilot"
 kirya_gilot_middle: "Equilíbrio Kirya-Gilot"
 israel.16.t: "Voo espacial STS-107, Ônibus Espacial Columbia"
 israel.16.d: "O voo espacial STS-107 está pronto para o lançamento. Por vários anos, astronautas israelenses e americanos treinaram para este voo. O povo de nossas nações aguarda o lançamento.\nO STS-107 Columbia está planejado como um voo de 16 dias, com uma missão dedicada de ciência e pesquisa. Se o voo for §Gbem-sucedido§!, nós e [ISR.GetNameWithFlag] ganharemos um bônus de pesquisa de mísseis. Devemos iniciar o lançamento?"
 israel.16.a: "Claro!"
 israel.16.b: "Cancelar o lançamento."
 israel.17.t: "O STS-107 é lançado!"
 israel.17.d: "O STS-107 Columbia está planejado como um voo de 16 dias, com uma missão dedicada de ciência e pesquisa. No entanto, a borda da asa esquerda do ônibus espacial foi atingida por destroços do tanque externo durante o lançamento. Esperemos que tudo corra bem..."
 israel.17.a: "Boa sorte"
 israel.18.t: "Lançamento do STS-107 cancelado!"
 israel.18.d: "A NASA decidiu cancelar o lançamento, devido a problemas de segurança e outras preocupações. Ilan Ramon voltará para Israel."
 israel.18.a: "Muito lamentável."
 israel.19.t: "O STS-107 se prepara para retornar!"
 israel.19.d: "O STS-107 está se preparando para retornar à Terra. Esperemos que o dano no ônibus espacial não afete o pouso."
 israel.19.a: "Que Deus os proteja..."
 israel.20.t: "Desastre do Ônibus Espacial Columbia!"
 israel.20.d: "O Ônibus Espacial Columbia se desintegrou ao reentrar na atmosfera sobre o Texas e a Luisiana, matando todos os sete astronautas a bordo. Foi a segunda missão do Ônibus Espacial a terminar em desastre, depois da perda do Challenger e de sua tripulação em 1986.\nAntes da reentrada, os gestores da NASA haviam limitado a investigação, argumentando que a tripulação não poderia ter corrigido o problema caso ele fosse confirmado. Quando o Columbia reentrou na atmosfera da Terra, o dano permitiu que gases atmosféricos quentes penetrassem o escudo térmico e destruíssem a estrutura interna da asa, o que fez o orbitador se tornar instável e se desintegrar."
 israel.20.a: "Lamentamos a perda deles."
 israel.21.t: "STS-107 pousa com sucesso!"
 israel.21.d: "Apesar do dano sofrido pelo ônibus espacial, a tripulação conseguiu pousar em segurança na Terra. Todo o material de pesquisa foi recuperado com sucesso!"
 israel.21.a: "Ótimo!"
 isr_usa_flight_tt: "Gastaremos §G$10 bilhões§!, se [USA.GetNameWithFlag] concordar com o voo conjunto.\nHá §Y50% de chance§! de o voo ser §Rmalsucedido.§!\nSe o voo for §Gbem-sucedido§!, nós e [USA.GetNameWithFlag] ganharemos um bônus de pesquisa de mísseis."
 israel.22.t: "Beresheet chega à Lua!"
 israel.22.d: "A Beresheet1 é uma missão privada à Lua da organização sem fins lucrativos israelense SpaceIL. A Beresheet1 tinha o objetivo de inspirar mais israelenses a seguir carreiras em CTEM. A Beresheet1 chegou à Lua com sucesso, mas fez um pouso forçado."
 israel.22.a: "Interessante!"
 ISR_sion_production: "Produção Avançada de Drones"
 israel_mechanic.21.t: "Preparando o Assassinato..."
 israel_mechanic.21.d: "Nosso quartel-general de comando se preparou para uma reunião hoje sobre nosso plano de eliminar o líder do Hamas. Recebemos duas opções de como proceder. Nossos agentes podem rastrear a localização do inimigo e plantar um artefato explosivo improvisado em seu quarto de hotel e detoná-lo assim que ele chegar. Ou podemos tentar lançar um míssil do Curdistão Iraquiano, se tivermos capacidade. O que fazemos?"
 israel_mechanic.21.a: "Plantar a bomba!"
 israel_mechanic.21.b: "Usar os mísseis."
 israel_mechanic.22.t: "Assassinato do Líder de [HAM.GetNameWithFlag]!"
 israel_mechanic.22.d: "[HAM.GetLeader], chefe do politburo de [HAM.GetNameWithFlag], foi morto em um ataque israelense. A mídia de língua árabe informou que o ataque à residência de [HAM.GetNameWithFlag] foi realizado por um míssil lançado de fora do Irã. Ao mesmo tempo, o líder da Jihad Islâmica Palestina, Ziyad al-Nahala, estava em outro andar do mesmo prédio e não ficou ferido, o que levanta suspeitas sobre a veracidade dessas informações."
 israel_mechanic.22.a: "Hum."
 israel_mechanic.23.t: "Assassinato fracassado do Líder de [HAM.GetNameWithFlag]!"
 israel_mechanic.23.d: "Recentemente, um ataque terrorista ocorreu no Irã, quando [HAM.GetLeader], líder de [HAM.GetNameWithFlag], visitava o Irã. No entanto, a tentativa de assassinato fracassou e [HAM.GetLeader] sobreviveu. Autoridades iranianas agora afirmam tratar-se de uma provocação perigosa de terroristas israelenses que tentam desestabilizar o eixo da resistência."
 israel_mechanic.23.a: "Interessante."
 wesill_be_creful2_tt: "Nossos agentes do §4Mossad§! entrarão em [PER.GetNameWithFlag] pelo §YCáucaso do Sul§! e tentarão §GAssassinar o líder de [HAM.GetNameWithFlag]§!. Precisaremos ser §Ycuidadosos§! com o que escolhermos ao dar nossas ordens."
 israel_lebanon_occup_category: "Cinturão de Segurança do Sul do Líbano"
 israel_lebanon_occup_category_desc: "A administração do cinturão de segurança do §YSul do Líbano§! é um órgão de governança provisória local no §YSul do Líbano§!, nas áreas do cinturão de segurança do Sul do Líbano. Substituiu as instituições do §YEstado do Líbano Livre§! e opera desde 1985 com pleno apoio logístico e militar de [ISR.GetNameWithFlag].\n§YNossa população§! é contra a continuação da §Rocupação§! e o atual líder [ISR.GetLeader] prometeu retirar nossas tropas. No entanto, podemos optar por §Ymanter§! as tropas no Sul do Líbano, o que pode causar reação pública negativa, mas nos ajudará caso ocorra uma guerra no futuro."
 south_lebanon_occupation_ticker_mission: "Reação Política!"
 south_lebanon_occupation_ticker_mission_desc: "Devemos decidir nossa posição sobre a ocupação do Sul do Líbano. Se não tomarmos nenhuma ação, teremos problemas em dobro, manteremos as forças e não poderemos mudar isso depois.\nDevemos concluir o foco §YAs Tropas Ficam§! ou §YTrazer Nossos Rapazes para Casa§!."
 result_dep_on_pol_tt: "O resultado dependerá de nossas decisões!"
 israel_mechanic.24.t: "Protestos Políticos!"
 israel_mechanic.24.d: "A ocupação do Sul do Líbano continua, porém nossa população reduziu drasticamente o apoio ao nosso governo."
 israel_mechanic.24.a: "Eles nos agradecerão depois."
 israel_mechanic.25.t: "Apoio político aumenta!"
 israel_mechanic.25.d: "Após a retirada de nossas tropas do Sul do Líbano, o apoio político ao nosso governo aumentou drasticamente e a população nos apoia!"
 israel_mechanic.25.a: "Bem..."
 ISR_not_withdraw_from_the_security_belt: "As Tropas Ficam"
 ISR_not_withdraw_from_the_security_belt_desc: "Devemos continuar a ocupação do Sul do Líbano, apesar da reação pública. Isso nos dará mais vantagens caso o Hezbollah nos ataque no futuro."
 israel_mechanic.26.t: "Forte reação política!"
 israel_mechanic.26.d: "A ocupação do Sul do Líbano continua, porém nossa população reduziu drasticamente o apoio ao nosso governo e protestos começaram. O governo sequer tratou do assunto e ignorou os eleitores."
 israel_mechanic.26.a: "Que estupidez!"
 israel_mechanic.27.t: "Migração do Líbano!"
 israel_mechanic.27.d: "Recentemente, devido à retirada de Israel do Sul do Líbano, muitos cristãos libaneses decidiram migrar para a França como forma de fugir da perseguição do Hezbollah."
 israel_mechanic.27.a: "Bem-vindos, eu acho?"
 israel_mechanic.28.t: "Destino da Prisão de Ansar"
 israel_mechanic.28.d: "Durante nossa longa ocupação do Sul do Líbano, controlamos uma prisão na qual mantivemos muitos militantes do Hezbollah como prisioneiros. Agora, antes de decidirmos nos retirar ou não, devemos decidir o destino dessa prisão."
 israel_mechanic.28.a: "Vamos deixar a prisão."
 israel_mechanic.28.b: "Transferir os cativos para Israel."
 we_willget_events_tt: "§YA contagem regressiva terminará e receberemos eventos!§!"
 israel_nationalist.1.t: "Os Julgamentos de Kaplan começaram"
 israel_nationalist.1.d: "O julgamento atraiu a atenção nacional. O tribunal agora deve decidir sobre a sentença apropriada."
 israel_nationalist.1.o1: "Prisão Perpétua"
 israel_nationalist.1.o2: "Pena de Morte"
 we_willget_events2_tt: "§YA contagem regressiva terminará e receberemos eventos!§!\n§RTeremos uma forte reação política!§!"
 camp_david_tt: "§YIsrael e Palestina receberão eventos e a Palestina escolherá ações após a reunião!§!"
 israel_nationalist.2.t: "Israel expulsa o Waqf de Jerusalém!"
 israel_nationalist.2.d: "O Waqf de Jerusalém é a organização jordaniana responsável por controlar a mesquita de Al-Aqsa na cidade velha de Jerusalém, uma das mesquitas mais importantes do mundo inteiro. O Waqf é um conselho composto por 18 membros, todos nomeados pelo Reino da Jordânia.\nIsrael está expulsando nossa organização de Jerusalém, não poderemos mais administrar a mesquita de Al-Aqsa!"
 israel_nationalist.2.o1: "Eles enfrentarão toda a nossa fúria!"
 israel_nationalist.2.o2: "Isto é inaceitável"
 israel_nationalist.2.o3: "Ah, paciência"
 israel_nationalist.3.t: "Israel construiu o Terceiro Templo"
 israel_nationalist.3.d: "Ignorando completamente as preocupações de muitas instituições internacionais, Israel decidiu construir o Terceiro Templo, reprimindo os protestos com sangue e tomando a terra de muçulmanos e cristãos que também consideram Jerusalém um solo sagrado."
 israel_nationalist.3.o1: "Como ousam?!?"
 israel_nationalist.3.o2: "Isto não é aceitável"
 israel_nationalist.3.o3: "Ah, paciência"
 israel_nationalist.3.o4: "Bem feito!"
 israel_nationalist.4.t: "Os Pilares da Sociedade"
 israel_nationalist.4.d: "Como não temos recursos ilimitados, precisamos nos concentrar em um dos núcleos ideológicos de nossa agenda:"
 israel_nationalist.4.o1: "Forças de Defesa de Israel"
 israel_nationalist.4.o2: "Colonos"
 israel_nationalist.4.o3: "Comunidades Sionistas"
 israel.23.t: "Reunião de Camp David"
 israel.23.d: "Após uma reunião diplomática tripartite entre Israel, Palestina e EUA em Camp David, as partes não chegaram a um entendimento e o acordo foi cancelado. As partes prometeram continuar as negociações, mas o prosseguimento do diálogo depende da vontade delas de cooperar e promover a paz..."
 israel.23.a: "Cortar a coordenação militar com Israel!"
 israel.23.b: "Certamente chegaremos a um acordo na próxima vez."
 israel.23.c: "Não há parceiro para negociações de paz"
 israel.23.e: "Esperemos que tudo fique bem."
 no_militar_coord: "Cortar a coordenação militar!"
 israel.24.t: "A Palestina corta a coordenação militar!"
 israel.24.d: "Após a reunião de Camp David, Yasser Arafat cortou a coordenação militar com Israel e promete assinar uma trégua política com o Hamas para competir com Israel."
 israel.24.a: "Que droga!"
 israel.25.t: "Mensagem da ANP!"
 israel.25.d: "Apesar do fracasso das negociações de Camp David, a Autoridade Nacional Palestina ainda espera se reunir no futuro e discutir os assuntos novamente."
 israel.25.a: "Poderia ter sido pior."
 israel.26.t: "Anúncio de Ariel Sharon!"
 israel.26.d: "Em resposta à recente reunião de Camp David, Ariel Sharon (líder da oposição do Likud) declarou que visitará o Monte do Templo no mês que vem, durante o Rosh HaShana. Se não o convencermos em 30 dias, isso pode levar a consequências graves."
 israel.26.a: "Temos que fazer algo a respeito..."
 ahsrfoc_tt: "Precisamos concluir o foco §YConversar com Sharon§! para convencê-lo a não visitar o Monte do Templo!"
 sharon_announce: "Sharon anunciou que visitará o Monte do Templo"
 sharnotconv_tt: "§YSharon não foi convencido!§!"
 sharconv_tt: "§YSharon foi convencido!§!"
 resthirdday_tt: "§YO resultado será conhecido depois!§!"
 israel.27.t: "A Decisão de Sharon..."
 israel.27.d: "Após nossas conversas com Ariel Sharon, vamos ver o que ele decide..."
 israel.27.a: "Aguardamos uma nova Intifada?"
 israel.27.b: "Que bom que ele concordou!"
 israel.28.t: "Sharon visita o Monte do Templo!"
 israel.28.d: "Cercado por centenas de policiais de choque israelenses, o Sr. Sharon e um punhado de políticos do Likud subiram até o Haram al-Sharif, local da dourada Cúpula da Rocha, o terceiro santuário mais sagrado do Islã."
 israel.28.a: "Merda."
 israel.28.b: "Isto é inaceitável!"
 israel.29.t: "Preparativos para a Intifada!"
 israel.29.d: "Após os atos ultrajantes de Ariel Sharon, devemos decidir o que fazer em resposta! O povo aguarda nossas ordens."
 israel.29.a: "Declarar a Segunda Intifada!"
 israel.29.b: "Não vamos acender o pavio demais..."
 israel.30.t: "Árabes Israelenses Protestam!"
 israel.30.d: "Árabes israelenses iniciaram protestos em massa em apoio aos palestinos em cidades específicas, sendo a mais notável Kafr Kanna. A violência está nas ruas, e precisamos fazer algo rapidamente!"
 israel.30.a: "Bastardos!"
 israel.30.b: "Ótimo!"
 ISR_arab_protests: "Protesto dos Árabes Israelenses!"
 ISR_arab_protests_desc: "A população árabe iniciou protestos contra o nosso governo!"
 israel.31.t: "A Detenção de Ariel Sharon!"
 israel.31.d: "Recentemente, após as manifestações dos árabes israelenses, o polêmico político de direita Ariel Sharon foi detido e está prestes a passar por um julgamento que dará o veredito final sobre seus atos recentes."
 israel.31.a: "Tentamos conversar com ele!"
 ISR_good_size_knesset: "Apoio da Maioria do Knesset!"
 ISR_big_size_knesset: "Apoio Esmagador da Maioria do Knesset!"
 ISR_small_knesset: "Apoio da Minoria do Knesset!"
 israel.32.t: "Repressão aos Protestos!"
 israel.32.d: "A polícia israelense reprimiu com sucesso os protestos, mas 13 árabes israelenses e 1 judeu israelense foram mortos no processo. A repressão violenta dos protestos diminuiu o apoio dos árabes israelenses ao nosso governo. A Palestina também condenou as ações do governo israelense."
 israel.32.a: "Não tivemos escolha."
 israel.33.t: "Proposta de Incursão Transfronteiriça!"
 israel.33.d: "No momento, as tropas do regime sionista estão muito dispersas devido aos protestos internos e às recentes tensões entre Israel e a Cisjordânia, além de manobras burocráticas internas. Nossos conselheiros sugerem uma incursão e a tomada de reféns do exército israelense."
 israel.33.a: "Avante!"
 raidhas_happ_hez: "O Hezbollah Realizou a Incursão!"
 israel.34.t: "Incursão Transfronteiriça do Hezbollah!"
 israel.34.d: "Militantes do Hezbollah capturaram três soldados israelenses enquanto patrulhavam a cerca de segurança e depois os levaram para o Líbano. Eles fizeram 3 soldados das IDF cativos e os mantêm como reféns."
 israel.34.a: "Maldição!"
 israel_utj.1.t: "Mulheres do Muro"
 israel_utj.1.d: "As Mulheres do Muro (Neshot HaKotel) são uma organização feminista judaica cujo objetivo é garantir o direito das mulheres de rezar no Muro das Lamentações, também chamado de Kotel."
 israel_utj.1.o1: "Absurdo, manteremos a segregação de gênero"
 israel_utj.1.o2: "Vamos fazer algumas concessões a elas"
 ISR_2000_show_hezbollah: "Mostrando Força ao Hezbollah!"
 ISR_2000_show_hezbollah_desc: "Os recentes atos dos terroristas do norte são ultrajantes! Devemos mostrar a eles que não toleraremos mais isso!"
 israel.35.t: "Operação Lição Merecida"
 israel.35.d: "Nossa cadeia de comando oferece duas opções de retaliação contra o Hezbollah. O primeiro cenário é lançar uma operação militar limitada contra o Hezbollah na tentativa de resgatar nossos prisioneiros do controle deles. A segunda opção é atingir o posto avançado mais próximo com nossos mísseis, seguindo a doutrina da Diretiva Hannibal. Como devemos proceder?"
 israel.35.a: "Enviar nossas forças para resgatar nossos homens!"
 israel.35.b: "Devemos seguir a Diretiva Hannibal."
 israel.36.t: "Israel Conduz com Sucesso a Operação Lição Merecida!"
 israel.36.d: "Recentemente, após a incursão transfronteiriça do Hezbollah, Israel lançou uma operação especial em resposta a esses eventos e resgatou com sucesso seus soldados do cativeiro do Hezbollah!"
 israel.36.a: "Ótimo!"
 israel.36.b: "Devíamos tê-los executado!"
 israel.37.t: "Israel Fracassa na Operação Lição Merecida!"
 israel.37.d: "Recentemente, após a incursão transfronteiriça do Hezbollah, Israel lançou uma operação especial em resposta a esses eventos e não conseguiu resgatar seus soldados do cativeiro do Hezbollah!"
 israel.37.a: "Serão lembrados."
 israel.37.b: "Nosso poder é grande!"
 israel.38.t: "Guerra de Fronteira Inconclusiva!"
 israel.38.d: "Recentemente, após a incursão transfronteiriça do Hezbollah, Israel lançou uma operação especial em resposta a esses eventos. No entanto, o resultado desses confrontos é considerado inconclusivo."
 israel.38.a: "Até a próxima, sionistas!"
 israel.38.b: "Devemos discutir isso em nosso quartel-general..."
 israel.39.t: "Ataque de Mísseis Israelense ao Hezbollah!"
 israel.39.d: "Recentemente, após a incursão transfronteiriça do Hezbollah, Israel lançou um ataque de mísseis contra postos avançados do Hezbollah onde estavam soldados capturados das IDF e um importante oficial do Hezbollah."
 israel.39.a: "Vamos vingá-los!"
 israel.39.b: "Ótimo!"
 israel.40.t: "Ataque de Mísseis Fracassado!"
 israel.40.d: "Recentemente, após a incursão transfronteiriça do Hezbollah, Israel lançou um ataque de mísseis contra postos avançados do Hezbollah onde estavam soldados capturados das IDF e um importante oficial do Hezbollah. No entanto, os mísseis foram interceptados e a operação fracassou."
 israel.40.a: "Mais uma Vitória!"
 israel.40.b: "Argh..."
 mis_borwar_tt: "Poderemos iniciar uma §Yoperação especial§! na fronteira com §R[HEZ.GetNameWithFlag]§! ou realizar um §Yataque de mísseis§! limitado contra o §Rcomplexo§! deles!"
 ISR_tolerate_hezbollah: "Acordo de Troca"
 ISR_tolerate_hezbollah_desc: "É óbvio que, apesar de o Hezbollah provavelmente já ter matado os soldados que capturou, eles o fizeram para iniciar uma nova troca de reféns. Considerando nossos problemas atuais, não escalaremos a situação."
 israel.41.t: "Troca de prisioneiros"
 israel.41.d: "O governo de Israel anunciou que foi concluído um acordo sobre o retorno dos três soldados das IDF desaparecidos, bem como do empresário israelense sequestrado e coronel da reserva das IDF Elchanan Tenenbaum, que havia sido capturado pelo Hezbollah após ser atraído a Dubai para um negócio de drogas.\nO Hezbollah deu início às negociações para a libertação de 14 prisioneiros libaneses, juntamente com alguns prisioneiros palestinos. 30 prisioneiros libaneses e árabes, 400 prisioneiros palestinos, o cidadão alemão e membro do Hezbollah Steven Smyrek e os restos mortais de 59 militantes e civis libaneses foram entregues ao Hezbollah, junto com mapas mostrando as minas israelenses no sul do Líbano, em troca de Tenenbaum e dos restos mortais dos três soldados mortos."
 israel.41.a: "Muito bom!"
 israel.41.b: "Fizemos o que era preciso."
 israel.42.t: "Investigação dos Eventos de Outubro!"
 israel.42.d: "Após a repressão dos protestos, devemos investigar a má conduta da polícia e encontrar os responsáveis pelos protestos. O Comitê Árabe de Israel quer participar da investigação, como uma reparação parcial nossa pelo que aconteceu. Devemos permitir que supervisionem o trabalho da polícia?"
 israel.42.a: "Claro!"
 israel.42.b: "A polícia fará o trabalho."
 israel.43.t: "Posição sobre Kafr Qasim!"
 israel.43.d: "O massacre de Kafr Qasim ocorreu na aldeia árabe-israelense de Kafr Qasim, situada na Linha Verde, na época a fronteira de fato entre Israel e a Cisjordânia jordaniana, em 29 de outubro de 1956. Foi executado pela Polícia de Fronteira de Israel, que matou civis árabes que voltavam do trabalho durante um toque de recolher do qual não tinham conhecimento, imposto no início do dia, na véspera da Guerra do Sinai.\nApós as ações recentes, podemos reconhecer esses eventos e pedir desculpas aos árabes israelenses."
 israel.43.a: "Devemos pedir desculpas."
 israel.43.b: "Isso não aconteceu!"
 israel.44.t: "Negociações com a Síria!"
 israel.44.d: "Na tentativa de tirar a Síria da esfera de influência iraniana, podemos tentar negociar os termos da normalização das relações com eles. De que posição devemos falar?"
 israel.44.a: "Normalização sem quaisquer condições."
 israel.44.b: "Estamos prontos para ceder as colinas de Golã!"
 israel.45.t: "Israel oferece a normalização das relações!"
 israel.45.d: "Recentemente, o governo israelense ofereceu ao nosso país a normalização das relações sem nenhuma pré-condição de sua parte. A única coisa que eles querem é que renunciemos às reivindicações sobre as colinas de Golã."
 israel.45.a: "Tudo bem, renunciamos às nossas reivindicações."
 israel.45.b: "Fora daqui, diplomata sionista!"
 syracc_negot: "A Síria aceitou a proposta israelense"
 israel.46.t: "A Síria Aceita!"
 israel.46.d: "Eles renunciarão às reivindicações sobre Golã e normalizarão as relações com o nosso país!"
 israel.46.a: "Ótimo!"
 israel.47.t: "A Síria Recusa!"
 israel.47.d: "A Síria recusou quaisquer negociações adicionais com o nosso país. Nossas condições e as deles são absolutamente diferentes, e eles veem o problema não apenas na nossa falta de cooperação, mas na nossa própria existência."
 israel.47.a: "Argh."
 israel.48.t: "Israel oferece ceder Golã ao nosso país!"
 israel.48.d: "Israel oferece ceder Golã ao nosso país se assinarmos um pacto de não agressão com eles e normalizarmos as relações."
 israel.48.a: "Onde assinamos?"
 israel.48.b: "Será um truque sionista?"
 israel.49.t: "A Síria Aceita!"
 israel.49.d: "A Síria assinou o acordo de transferência de Golã e agora é amistosa com o nosso país."
 israel.49.a: "Pelo menos assim..."
 syr_negotgol_tt: "Poderemos escolher entre §Ypedir a normalização sem condições§! com §Y[SYR.GetNameWithFlag]§! ou ceder §YGolã§! a §Y[SYR.GetNameWithFlag]§! em troca de §Grelações amistosas§!."
 israel.50.t: "Israel Ataca as Bases do Hezbollah na Síria!"
 israel.50.d: "Recentemente, ataques aéreos israelenses tiveram como alvo bases do Hezbollah na Síria. As autoridades sírias ainda não comentaram o caso, mas o Hezbollah já prometeu vingar as ações do chamado regime sionista. Alguns oficiais do Hezbollah foram mortos e dezenas de soldados ficaram feridos."
 israel.50.a: "Ótimo!"
 israel.50.b: "Maldição!"
 israel.50.c: "Malditos sionistas!"
 israel.50.e: "Malditos sionistas!"
 syrhez_tt: "Atacaremos as bases de §R[HEZ.GetNameWithFlag]§! em §R[SYR.GetNameWithFlag]§!, reduzindo a influência de §R[HEZ.GetNameWithFlag]§! sobre §R[SYR.GetNameWithFlag]§! e danificando aleatoriamente construções em regiões sírias!"
 istspechez_tt: "Atacaremos §R[HEZ.GetNameWithFlag]§! diretamente, enviando nossas forças especiais ao §YSul do Líbano§!. Elas sabotarão os objetos estratégicos de §R[HEZ.GetNameWithFlag]§! e depois serão extraídas pela §YGalileia§!."
 israel.51.t: "Forças Especiais de [ISR.GetNameWithFlag] Realizam Ataque contra [HEZ.GetNameWithFlag]!"
 israel.51.d: "Recentemente, forças especiais israelenses se infiltraram pela fronteira com o Líbano em pequenos grupos e atacaram combatentes do Hezbollah. Em seguida, sabotaram instalações estratégicas no sul do Líbano. Sem alterar a posição geral da frente, as forças especiais israelenses conseguiram escapar com sucesso pela Galileia."
 israel.51.a: "Bom trabalho, rapazes!"
 israel.51.b: "A vingança virá em breve!"
 israel.51.c: "A vingança virá em breve!"
 ISR_collapsed_tunnels: "Túneis Desabados!"
 ISR_collapsed_tunnels_desc: "As tropas israelenses explodiram nossos túneis que cruzavam a fronteira israelense; levará um tempo considerável para cavar novos túneis e consertar os restantes."
 israel.52.t: "Israel Explode Nossos Túneis!"
 israel.52.d: "As tropas israelenses explodiram nossos túneis que cruzavam a fronteira israelense; levará um tempo considerável para cavar novos túneis e consertar os restantes."
 israel.52.a: "Claro!"
 israel.53.t: "As Forças Radwan Foram Infiltradas!"
 israel.53.d: "Israel conseguiu infiltrar nossas forças especiais e descobrir alguns de nossos planos."
 israel.53.a: "Maldição!"
 ISR_leb_air: "Nossa Força Aérea sobre o Líbano"
 ISR_bibi_power: "O Likud Se Dividiu"
 leb_willris_tt: "Os grupos pró-[ISR.GetNameWithFlag] no Líbano se levantarão se sua popularidade for de pelo menos 10% quando a guerra começar."
 isr_will_attack_leb_tt: "§G[ISR.GetNameWithFlag]§! invadirá o §YSul do Líbano§! para eliminar §R[HEZ.GetNameWithFlag]!§!\nSe os grupos pró-§G[ISR.GetNameWithFlag]§! no Líbano tiverem popularidade de pelo menos 10%, eles se levantarão contra §R[HEZ.GetNameWithFlag]!§!"
 ISR_ben_gvir_easy_trigger_1: "Regras de Engajamento - Flexibilizadas"
 ISR_ben_gvir_easy_trigger_1_desc: "Lidar diariamente com o terrorismo palestino exige regras de engajamento especiais e mais frouxas."
 ISR_ben_gvir_easy_trigger_2: "Regras de Engajamento - Mínimas"
 ISR_ben_gvir_easy_trigger_2_desc: "Um passo adiante na proteção de nossos heróis contra regras de engajamento absurdas que limitam nossa capacidade operacional."
 ISR_freedom_of_teaching_1: "Educação Independente - LIBA Suspenso"
 ISR_freedom_of_teaching_1_desc: "O LIBA, o currículo básico do Ministério da Educação, que inclui o ensino de inglês, foi introduzido para evitar que certos grupos ensinem apenas hebraico e outros temas religiosos. Essa decisão precisa ser revertida, pois afeta nossa independência de ensinar nossa cultura aos jovens. Que eles decidam se querem ensinar inglês ou não."
 ISR_freedom_of_teaching_2: "Educação Independente - Mamach"
 ISR_freedom_of_teaching_2_desc: "O passo seguinte no sistema educacional haredi: ensinaremos o nosso próprio inglês, reforçaremos o ensino de História com as tradições de Israel e proibiremos o ensino de teorias absurdas como as de Gênero ou de Darwin."
 ISR_only_pikuach_nefesh: "Apenas Pikuach Nefesh"
 ISR_only_pikuach_nefesh_desc: "Nenhum trabalho é permitido no Shabat, nem mesmo construção, exceto por Pikuach Nefesh, que é a salvaguarda da vida humana, um conceito conhecido como Halakhá."
 ISR_gender_equality: "Igualdade de Gênero"
 ISR_gender_equality_desc: "Nenhum gênero é superior; todos contribuirão igualmente para a sociedade, independentemente de seu gênero."
 ISR_renewable_energy_focused: "Foco em Energia Renovável"
 ISR_renewable_energy_focused_desc: "Nossa Terra não suporta mais danos causados pela nossa poluição e devastação humanas; vamos focar em energia renovável para sustentar nosso crescimento."
 bomcatisra_tt: "Isso §Gnos permitirá contrapor§! a §Rinfluência de [PER.GetNameWithFlag]§! na §Yregião§! e §Yconduzir operações encobertas!§!"
 israel.54.t: "Israel bombardeia um suposto reator nuclear na Síria!"
 israel.54.d: "Recentemente, forças israelenses realizaram um ataque aéreo contra um suposto reator nuclear, conhecido como o local de Al Kibar, no qual a Síria supostamente tentava construir um reator nuclear para fins desconhecidos. As forças especiais israelenses também conseguiram entrar em território sírio e recuperar os restos do local."
 israel.54.a: "Ótimo!"
 israel.54.b: "Malditos sionistas!"
 israel.54.c: "Interessante."
 israel.55.t: "Aviões Israelenses Abatidos na Síria!"
 israel.55.d: "Vários caças militares israelenses foram recentemente abatidos na Síria quando tentavam entrar em território sírio. Israel não fez nenhum comentário sobre a situação."
 israel.55.a: "Ah, droga."
 israel.55.b: "Mais uma Vitória!"
 israel.55.c: "Os sírios se saíram bem."
 syr_ope_aa_tt: "A porcentagem de §GSucesso§! está diretamente ligada ao §Ynível geral de defesa antiaérea§! de [SYR.GetNameWithFlag]."
 israel.56.t: "Mensagem Secreta de [ISR.GetNameWithFlag]!"
 israel.56.d: "Recentemente, Israel nos enviou uma mensagem, oferecendo um acordo obscuro no qual expulsaremos todas as tropas iranianas da Síria, e Israel nos protegerá caso o Irã faça qualquer coisa contra a Síria."
 israel.56.a: "Irã, vá para casa!"
 israel.56.b: "Mais uma trama sionista estúpida!"
 israel.57.t: "A Síria Aceita!"
 israel.57.d: "Apesar das diferenças ideológicas entre nós e a Síria, eles aceitaram nossa proposta e a Síria expulsou todas as forças iranianas de sua terra."
 israel.57.a: "Ótimo!"
 israel.58.t: "A Síria retira nossas tropas de seu território!"
 israel.58.d: "Our agents have given us information that Syria and Israel have agreed upon countering our influence in the region. Syria has driven our our forces from their territory. What should we do?"
 israel.58.a: "Nos vingaremos depois..."
 israel.58.b: "Reúnam as tropas!"
 israel.59.t: "A Síria Recusa!"
 israel.59.d: "A Síria rejeitou nossa proposta secreta e continuará sendo aliada do Irã e parte do Eixo da Resistência."
 israel.59.a: "Muito lamentável."
 syr_manip_tt: "Exigiremos a §Gretirada§! das tropas de §R[PER.GetNameWithFlag]§! de §Y[SYR.GetNameWithFlag]§! e §Ggarantiremos§! a independência de §Y[SYR.GetNameWithFlag]§! se eles aceitarem. No entanto, §R[PER.GetNameWithFlag]§! pode atacar §Y[SYR.GetNameWithFlag]§! se as tensões mundiais estiverem altas!\nO fator de aceitação de §Y[SYR.GetNameWithFlag]§! depende do §Ypartido governante§! em §Y[SYR.GetNameWithFlag]§!."
 lba_ope_aa_tt: "A porcentagem de §GSucesso§! está diretamente ligada ao §Ynível geral de defesa antiaérea§! de [LBA.GetNameWithFlag]."
 israel.60.t: "Israel Bombardeia Nosso Reator Nuclear!"
 israel.60.d: "Aviões israelenses entraram em nosso espaço aéreo e bombardearam alguns de nossos reatores nucleares!"
 israel.60.a: "Maldição!"
 israel.62.t: "Bombardeio Bem-Sucedido em [FROM.GetNameWithFlag]!"
 israel.62.d: "Nossos aviões entraram com sucesso no espaço aéreo de [FROM.GetNameWithFlag] e bombardearam os reatores nucleares. Isso os deterá por um tempo."
 israel.62.a: "Ótimo!"
 israel.61.t: "Israel Falha ao Bombardear Instalações Nucleares!"
 israel.61.d: "Os caças israelenses foram abatidos; as instalações nucleares de [FROM.GetNameWithFlag] permanecem seguras."
 israel.61.a: "Um resultado amargo."
 israel.61.b: "Boa!"
 irq_ope_aa_tt: "A porcentagem de §GSucesso§! está diretamente ligada ao §Ynível geral de defesa antiaérea§! de [IRQ.GetNameWithFlag]."
 per_ope_aa_tt: "A porcentagem de §GSucesso§! está diretamente ligada ao §Ynível geral de defesa antiaérea§! de [PER.GetNameWithFlag]."
 israel_news.14.t: "Israel desclassificou os documentos sobre Ammonia!"
 israel_news.14.d: "Israel anunciou o fechamento de sua instalação nuclear secreta e prometeu abandonar completamente as armas nucleares que havia cuidadosamente ocultado. No entanto, muitos países do Oriente Médio expressaram preocupação quanto a Israel enganá-los novamente."
 israel_news.14.o1: "Interessante."
 israel_palestine_category: "Tensões [ISR.GetNameWithFlag] - [PAL.GetNameWithFlag]"
 ISR_palestine_desc_loc: "Nossas §RTensões§! atuais [?ISR_palestine_situation|0+]\n\n[?PAL_arab_popularity|=0+] das pesquisas de §Ypartidos árabes§! £ISR_Communist_State £ISR_Autocracy £ISR_anarchist_communism £ISR_Neutral_Muslim_Brotherhood\n[?PAL_war_support_in_isr|=0+] do apoio à guerra §4israelense§! atual\n\n[?PAL_arab_parties_rulling|=0+] do isolamento dos §Ypartidos árabes§! £ISR_Communist_State £ISR_Autocracy £ISR_anarchist_communism £ISR_Neutral_Muslim_Brotherhood no §YGoverno§! de [ISR.GetNameWithFlag]\n\n[select_thingie_palisr]\n\nApós inúmeras §Yguerras árabe-israelenses e intifadas§!, a situação em [PAL.GetNameWithFlag] está sob controle §4israelense§! quase completo. No entanto, o aumento da §Rtensão§! entre \n[ISR.GetNameWithFlag] e [PAL.GetNameWithFlag] pode levar a §Rinquietação, guerras e possíveis levantes§! e §Ymudar o equilíbrio de poder§! e a §Ysituação geral§!.\n\nQuanto mais as §Rtensões aumentarem§!, mais §Rviolenta§! será a situação!\n\nO §Rnível de tensão§! também depende do §YNível de Autonomia§! de [PAL.GetNameWithFlag]!"
 gu_westbank_select: "Cisjordânia"
 gu_gaza_select: "Faixa de Gaza"
 gu_mainisr_select: "Israel Continental"
 select_westbank_tt: "Região Selecionada: §YCisjordânia§!"
 select_mainisr_tt: "Região Selecionada: §YIsrael Continental§!"
 select_gaza_tt: "Região Selecionada: §YFaixa de Gaza§!"
 select_nothing_tt: "Região Selecionada: §tNenhuma Região Selecionada!§!"
 isr_cancel: "Cancelar Seleção"
 isr_tension_decrease_2_TT: "As §RTensões§! serão §GReduzidas§! em §Y2§!"
 isr_tension_decrease_5_TT: "A §GTensão§! será §Greduzida§! em §Y5§!."
 isr_tension_decrease_10_TT: "A §GTensão§! será §Greduzida§! em §Y10§!."
 isr_tension_decrease_15_TT: "A §GTensão§! será §Greduzida§! em §Y15§!."
 isr_tension_decrease_20_TT: "As §GTensões§! serão §GReduzidas§! em §Y20§!"
 isr_tension_increase_5_TT: "A §RTensão§! §Raumentará§! em §Y5§!."
 isr_tension_increase_7_TT: "As §RTensões§! serão §YAumentadas§! em §Y7§!"
 isr_tension_increase_10_TT: "A §RTensão§! §Raumentará§! em §Y10§!."
 isr_tension_increase_40_TT: "As §RTensões§! serão §YAumentadas§! em §Y40§!"
 isr_tension_increase_20_TT: "As §RTensões§! serão §YAumentadas§! em §Y20§!"
 israel_news.15.t: "[PAL.GetName] Inicia Nova Intifada"
 israel_news.15.d: "Após a recente visita de Ariel Sharon ao Monte do Templo, a Palestina iniciou uma nova intifada contra Israel, elevando as tensões ao máximo possível. Dezenas de jovens palestinos estão se manifestando, queimando pneus e atirando pedras contra soldados israelenses por todo o país"
 israel_news.15.o1: "O Oriente Médio está em chamas..."
 intifada_darkest_TT: "§YPoderemos começar a organizar a resistência à intifada e tentar formar um comando!§!"
 ISR_shabac_dominance: "Domínio do Shabak"
 ISR_8200_dominance: "Domínio da Unidade 8200"
 ISR_tzamams: "Tzamams"
 israel.63.t: "O Destino do Túmulo de José"
 israel.63.d: "Recentemente, uma nova questão foi levada à discussão no Knesset. Devemos permitir que os religiosos continuem indo em veículos blindados ao Túmulo de José, em Nablus? Isso pode aumentar as tensões, mas, se não permitirmos que visitem o Túmulo de José, eles podem ficar realmente insatisfeitos, para dizer o mínimo."
 israel.63.a: "Que o visitem!"
 israel.63.b: "Proibir as visitas."
 jos_tomb_fate_tt: "We will either §tprohibit§! visiting §YJoseph's tomb§! or will §5alllow§! visiting. However, both choices might have §5pros§! and §tcons!§!"
 israel.64.t: "Massacre da Páscoa em hotel israelense mata 19!"
 israel.64.d: "Um homem-bomba matou pelo menos 19 pessoas e feriu 172 em um popular hotel à beira-mar na quarta-feira, início do feriado religioso judaico da Páscoa. Pelo menos 48 dos feridos foram descritos como gravemente feridos.\nO atentado ocorreu em um salão de jantar lotado no Park Hotel, um resort costeiro, durante a refeição tradicional que marca o início da Páscoa.\nRa'anan Gissin, assessor sênior do Primeiro-Ministro israelense Ariel Sharon, chamou o ataque de massacre da Páscoa e disse que o governo usaria todas as medidas necessárias para impedir novos ataques terroristas."
 israel.64.a: "Ó Deus!"
 israel.64.b: "Eles procuraram por isso!"
 israel.65.t: "Terroristas Atacam Hotel Israelense e Matam 3!"
 israel.65.d: "Recentemente, as Forças Policiais de Israel detiveram um homem-bomba perto de um popular hotel à beira-mar. As forças policiais rastrearam o terrorista com sucesso e o atacaram perto da entrada do hotel. No entanto, a bomba detonou, matando 3 pessoas, um policial e dois transeuntes.\nRa'anan Gissin, assessor sênior do Primeiro-Ministro israelense Ariel Sharon, chamou o ataque de tentativa de massacre e disse que o governo usaria todas as medidas necessárias para impedir novos ataques terroristas."
 israel.65.a: "Poderia ter sido pior!"
 israel.65.b: "Eles procuraram por isso!"
 israel.66.t: "Terroristas Capturados em Israel!"
 israel.66.d: "Recentemente, as Forças Policiais de Israel descobriram uma célula terrorista secreta de palestinos ligados ao Hamas, que planejavam detonar uma bomba perto do Park Hotel."
 israel.66.a: "Bom trabalho, rapazes!"
 israel.66.b: "Interessante."
 israel.67.t: "Mensagem Urgente do Departamento de Polícia!"
 israel.67.d: "A polícia nos enviou o relatório mais recente sobre os acontecimentos recentes.\nDê uma olhada. Pode surpreendê-lo."
 israel.67.a: "O Que Aconteceu?!"
 outc_polsped_tt: "§YO resultado deste evento depende inteiramente do seu nível de gastos com a polícia!§!"
 pass_happened: "O Ataque da Páscoa Aconteceu!"
 israel.68.t: "Exigência de Israel!"
 israel.68.d: "Israel exige a entrega dos responsáveis pelo planejamento do recente ataque terrorista em Israel. Se não cooperarmos, eles conduzirão uma operação punitiva sem o nosso consentimento!\nVale notar que os autores deste ataque foram o HAMAS e a PIJ, nossos aliados temporários contra Israel, que ao mesmo tempo são nossos rivais políticos.\nDevemos concordar em cooperar?"
 israel.68.a: "Não cooperaremos!"
 israel.68.b: "Os terroristas devem ser punidos."
 didnot_coop_isr_pas: "A Palestina não cooperou com Israel na busca pelos autores do Massacre da Páscoa."
 did_coop_isr_pas: "A Palestina cooperou com Israel na busca pelos autores do Massacre da Páscoa."
 israel.69.t: "A Palestina Concorda!"
 israel.69.d: "O líder palestino [PAL.GetLeader] condena o ataque terrorista e concorda em cooperar conosco para encontrá-los e puni-los."
 israel.69.a: "Surpreendentemente bom!"
 israel.70.t: "A Palestina Recusa!"
 israel.70.d: "O líder palestino [PAL.GetLeader] condenou o ataque terrorista, mas não concordou em cooperar conosco para encontrá-los e puni-los, vendo isso como uma ameaça direta à sua existência."
 israel.70.a: "Pior para eles, então!"
 ISR_peaceful_approach: "Procedimentos Humanitários"
 ISR_neighbor_procedure: "Procedimento do Vizinho"
 israel.71.t: "Ajuda aos Irmãos Palestinos!"
 israel.71.d: "A Palestina lançou uma nova intifada contra o regime sionista. Podemos tentar enviar armas para lá pelos portos marítimos de Gaza. Devemos fazê-lo?"
 israel.71.a: "Entrar em contato com eles!"
 israel.71.b: "Não é do nosso interesse"
 israel.75.t: "O Irã está nos oferecendo ajuda!"
 israel.75.d: "O Irã propõe enviar um grande carregamento de armas bem debaixo do nariz de Israel, introduzindo um navio mercante falso no porto de Gaza. Aceitamos tal aposta?"
 israel.75.a: "Não precisamos de ajuda alguma!"
 israel.75.b: "Deem-nos armas!"
 israel.72.t: "A Palestina Concorda!"
 israel.72.d: "A Palestina concordou em aceitar nosso carregamento e está preparando um porto secreto em Gaza para receber nosso carregamento de armas. No entanto, isso pode já ter sido descoberto pelo Mossad..."
 israel.72.a: "Esperamos que nossa ajuda chegue lá!"
 israel.74.t: "A Palestina Recusa!"
 israel.74.d: "As autoridades palestinas disseram que lidarão com a situação por conta própria e não precisam de nossa ajuda."
 israel.74.a: "Idiotas!"
 israel.73.t: "Navio com Suprimentos do Irã!"
 israel.73.d: "Nossos agentes do Mossad descobriram um plano das autoridades iranianas e palestinas para enviar armas por mar diretamente à Faixa de Gaza. Devemos impedir que isso aconteça."
 israel.73.a: "Temos que nos apressar!"
 israel.76.t: "Carregamento de armas iraniano bem-sucedido!"
 israel.76.d: "Recentemente, as autoridades iranianas conseguiram enviar uma quantidade significativa de armamentos para a Palestina, bem debaixo do nariz das autoridades israelenses. Não se sabe se Israel tinha informações sobre esse carregamento ou não, mas a evidência do fracasso não deixa dúvidas."
 israel.76.a: "Nossas preciosas armas."
 israel.77.t: "Carregamento de armas iraniano bem-sucedido!"
 israel.77.d: "Recentemente, as autoridades iranianas conseguiram enviar uma quantidade significativa de armamentos para a Palestina, bem debaixo do nariz das autoridades israelenses. Não se sabe se Israel tinha informações sobre esse carregamento ou não, mas a evidência do fracasso não deixa dúvidas."
 israel.77.a: "Como ousam!"
 israel.78.t: "O Caso Karine A!"
 israel.78.d: "Nossas unidades capturaram um grande cargueiro de propriedade da Autoridade Palestina, carregado com 50 toneladas de armas, incluindo 345 foguetes Katyusha de longo alcance, vindo do Irã com o envolvimento do Hezbollah. O navio seguia para descarregar em Gaza, mas foi detido e todas as armas foram confiscadas."
 israel.78.a: "Bom trabalho!"
 israel.79.t: "Carregamento de armas iraniano bem-sucedido!"
 israel.79.d: "Conseguimos enviar uma quantidade significativa de armamentos para a Palestina, bem debaixo do nariz das autoridades israelenses. Não se sabe se Israel tinha informações sobre esse carregamento ou não, mas a evidência do fracasso não deixa dúvidas."
 israel.79.a: "Allahu Akbar!"
 israel.80.t: "O Caso Karine A!"
 israel.80.d: "Recentemente, unidades da Marinha e da Força Aérea de Israel capturaram nosso cargueiro carregado com 50 toneladas de armas, incluindo 345 foguetes Katyusha de longo alcance, vindo do Irã com o envolvimento do Hezbollah. O navio seguia para descarregar em Gaza, mas foi detido e todas as armas foram confiscadas."
 israel.80.a: "Como ousam!"
