 CHI_TAI_intl_isolation_modifier: "국제적 고립 지수"
 CHI_TAI_intl_isolation_modifier_desc: "공식 외교 승인을 유지하는 국제연합 회원국 수에 반비례하여 변하는 대만의 외교적 고립에 대한 동적 척도입니다. 승인국이 적을수록 무역 관계, 해외 영향력, 중국과의 관계 개선 비용에 대한 불이익이 심해지며, 승인이 넓어지면 반대로 이러한 관계가 개선되고 대만의 외교적 영향력이 커집니다."
 CHI_recognition_embargo: "승인 금수"
 CHI_recognition_embargo_desc: "중국은 대만에 대한 공식 외교 승인을 유지하는 모든 국가에 엄격한 경제적, 외교적 제재를 가했습니다. 중국과의 무역 비용이 크게 올랐고 중국 시장 접근이 심각하게 제한됩니다."
 china_sar.038.t: "베이징의 양안 경제 협력 제안"
 china_sar.038.d: "베이징은 타이베이에 양안 경제 협력 틀에 대한 공식 제안을 내놓았습니다. 본토 관료들은 이를 주권 문제를 완전히 비켜 가는 실용적이고 상호 이익이 되는 합의라고 설명합니다. 대만 기업 단체들은 호의적이지만, 독립 성향의 야당은 본토 경제에 대한 의존으로 서서히 빠져들 것이라고 경고합니다."
 china_sar.038.a: "틀에 참여한다."
 china_sar.038.b: "제안을 거절한다."
 china_sar.039.t: "베이징의 양안 무역 확대 제안"
 china_sar.039.d: "경제 대화의 개시를 토대로 베이징은 관세를 낮추고 대만의 본토 수출에 대한 제한을 완화하는 양안 무역의 대폭 확대를 제안합니다. 이 제안은 경제협력기본협정(ECFA)을 연상시키며 거대한 본토 시장에 대한 접근을 미끼로 내놓습니다. 타이베이의 비판자들은 이 양보에 정치적 조건이 붙어 있을까 우려합니다."
 china_sar.039.a: "본토와의 무역을 확대한다."
 china_sar.039.b: "무역 확대를 거부한다."
 china_sar.040.t: "대만 기업의 본토 시장 접근"
 china_sar.040.d: "베이징은 타이완 기업들이 우대 조건으로 본토에서 사업을 운영하도록 초청하며, 사무 공간, 건물 공동 사용권, 간소화된 인허가를 제공합니다. 수출 중심인 타이완 경제에는 상당한 기회이지만, 본토와의 상업적 얽힘이 깊어지는 것은 타이베이에서 여전히 정치적으로 민감한 사안입니다."
 china_sar.040.a: "우대 시장 접근을 수락한다."
 china_sar.040.b: "우리 기업들을 일정한 거리에 둔다."
 china_sar.041.t: "양안 반도체 협력"
 china_sar.041.d: "베이징은 본토와 세계 최고 수준인 타이완 반도체 산업 간의 협력을 제안하며, 여기에는 공동 제조 시설과 연구 공유가 포함됩니다. 타이완의 반도체 부문은 가장 큰 전략 자산이자 가장 강력한 방패입니다. 이를 본토와 공유하면 막대한 이익이 되겠지만, 타이베이의 파트너들이 계속 관여하게 만드는 바로 그 지렛대를 약화시킬 것입니다."
 china_sar.041.a: "반도체 분야에서 협력한다."
 china_sar.041.b: "우리 반도체 산업을 보호한다."
 china_sar.042.t: "기업 대표단 교환"
 china_sar.042.d: "베이징은 해협 양쪽의 산업 거점을 시찰할 상호 기업 대표단을 초청하여 본토와 타이완 경영인 간의 개인적 유대를 형성하려 합니다. 이러한 방문은 위험이 적고 상업적으로 유용하지만, 방문이 거듭될수록 양안 경제 상호 의존의 그물망은 더욱 촘촘해집니다."
 china_sar.042.a: "대표단을 교환한다."
 china_sar.042.b: "방문을 거절한다."
 china_sar.043.t: "양안 직항 교통망"
 china_sar.043.d: "베이징은 3통 정책을 토대로 새로운 항로, 항공편, 기반시설을 갖추어 해협 간 직항 교통망을 확대할 것을 제안합니다. 직항 연결은 기업과 여행객 모두의 비용을 줄여 주며, 두 경제를 더욱 긴밀히 결속시킬 것입니다."
 china_sar.043.a: "직항 교통망을 개설한다."
 china_sar.043.b: "직항 연결을 제한한다."
 china_sar.044.t: "양안 투자 보호 장치"
 china_sar.044.d: "베이징은 본토에서의 타이완 투자에 대한 법적 보호를 보장하는 공식 협정을 제안하며, 오래된 재산권과 중재 문제에 대한 우려를 해소하려 합니다. 이 보호 장치는 신중한 투자자들을 안심시키겠지만, 타이베이가 경제적 동반자로서 베이징과 협상하는 틀을 고착시키기도 합니다."
 china_sar.044.a: "투자 보호 협정에 서명한다."
 china_sar.044.b: "협정을 거부한다."
 china_sar.045.t: "양안 공동 산업 계획"
 china_sar.045.d: "베이징은 공급망, 표준, 주요 사업을 일치시키는 양안 공동 산업 계획을 제안합니다. 이러한 통합은 실질적인 효율성을 가져오겠지만, 타이완 경제를 본토의 장기 전략 속으로 편입시키는 일이기도 하여 주권을 중시하는 타이베이 유권자들을 불안하게 합니다."
 china_sar.045.a: "우리의 산업 계획을 일치시킨다."
 china_sar.045.b: "우리 경제를 독자적으로 계획한다."
 china_sar.046.t: "양안 경제 심층 통합"
 china_sar.046.d: "베이징은 양안 경제 통합의 마지막 단계로서, 규제가 조화되고 상품과 자본이 자유롭게 이동하는 깊이 통합된 시장을 제안합니다. 찬성하는 쪽은 그것이 가져올 번영을 내세우고, 반대하는 쪽은 이 정도의 깊이라면 경제 통합과 정치적 흡수를 구별하기 어려워진다고 경고합니다."
 china_sar.046.a: "경제 통합을 완성한다."
 china_sar.046.b: "해협의 경계에서 멈춘다."
 china_sar.047.t: "통일 협정을 저울질하는 타이베이"
 china_sar.047.d: "베이징은 평화 통일을 위한 최종 틀을 제시했습니다. 타이완은 특별행정구로서 중화인민공화국에 복귀하되, 일국양제 모델에 따라 고유의 행정, 법체계, 경제를 유지합니다. 수년간의 양안 긴장 완화 끝에 이 협정은 이제 비준을 위해 타이베이의 손에 놓여 있습니다."
 china_sar.047.a: "협정을 비준하고 통일한다."
 china_sar.047.b: "이 섬은 아직 준비되지 않았다."
 CHI_calm_hong_kong_protests: "홍콩 질서 회복"
 CHI_calm_hong_kong_protests_desc: "우리의 선거 개혁으로 촉발된 시위는 특별행정구를 계속 교란하고 있습니다. 보안군이 현지에 배치되고 상황이 안정되어 가면서, 중앙정부는 소요를 조용히 가라앉히고 홍콩에 일상을 회복시킬 수 있습니다."
