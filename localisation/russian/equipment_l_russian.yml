 CRM_MBT_1: "Т-55"
 CRM_MBT_1_desc: "Танк Т-54/55, пожалуй, самый массовый в мире. Разработанный и произведённый в первые годы холодной войны, он был могуществом и основой Красной Армии. Когда-то внушавший страх как символ российской мощи, он стал культовым изображением ближневосточных бронетанковых войск, уничтожаемых в результате американского воздушного удара."
 CRM_MBT_1_short: "Т-55"
 CRM_MBT_2: "Т-72"
 CRM_MBT_2_desc: "Т-72, пожалуй, самая успешная разработка, созданная Россией. Это была вершина советской военной мощи на завершающем этапе Холодной войны, производившаяся тысячами, и служащая основой российской армии даже сегодня. Хотя она стала печально известной из-за своих катастрофических неудач в конфликтах на Ближнем Востоке, Т-72 по-прежнему используется в качестве платформы для разработки будущих российских танков и постоянно подвергается модификациям и обновлениям, чтобы соответствовать стандартам современной войны сегодня. Не стоит недооценивать танк, который когда-то был копьём советских войск."
 CRM_MBT_2_short: "Т-72"
 CRM_MBT_3: "Т-80"
 CRM_MBT_3_desc: "Этот танк стоимостью $2 млн — настоящий зверь поля боя — использовал ту же пушку, что и Т-72, но с усиленной бронёй и ПТУР «Кобра»."
 CRM_MBT_3_short: "Т-80"
 CRM_MBT_4: "Т-90"
 CRM_MBT_4_desc: "Т-90 — российский основной боевой танк, созданный как глубокая модернизация Т-72Б и принятый на вооружение в 1992 году. Он получил систему управления огнём на базе аппаратуры Т-80У, комплекс оптико-электронного подавления «Штора-1» и встроенную динамическую защиту «Контакт-5», что заметно подняло его защищённость. Вооружение — 125-мм гладкоствольная пушка 2А46М с автоматом заряжания, способная запускать управляемые ракеты через ствол. Т-90 стал самым массовым российским танком постсоветского периода и одним из главных экспортных образцов."
 CRM_MBT_4_short: "Т-90"
 CRM_MBT_5: "Т-14 «Армата»"
 CRM_MBT_5_desc: "Самый передовой боевой танк в российской армии с гладкими очертаниями и мощной 152-мм пушкой."
 CRM_MBT_5_short: "Т-14"
 CRM_MBT_7: "Т-14М"
 CRM_MBT_7_short: "Т-14М"
 CRM_MBT_8: "Т-99 «Чёрный орел»"
 CRM_MBT_8_short: "Т-99"
 CRM_mbt_equipment_0: "Т-62"
 CRM_mbt_equipment_1: "Т-72"
 CRM_mbt_equipment_2: "Т-90"
 CRM_mbt_equipment_3: "Т-14"
 CRM_mbt_equipment_4: "Т-24"
 CRM_Rec_tank_0: "ПТ-76"
 CRM_Rec_tank_0_desc: "Этот сверхбыстрый лёгкий амфибийный танк может подкрасться к вражеским позициям через реку и устроить ад. С 76,2-мм нарезной танковой пушкой Д-56Т."
 CRM_Rec_tank_0_short: "ПТ-76"
 CRM_Rec_tank_1: "2С25 «Спрут-СД»"
 CRM_Rec_tank_1_desc: "Самоходная амфибийная машина для уничтожения танков может подкрадываться к вражеским танкам и стрелять из 125-мм пушки, которую несут Т-72-80."
 CRM_Rec_tank_1_short: "2С25 «Спрут-СД»"
 CRM_Rec_tank_2: "БМПТ «Терминатор»"
 CRM_Rec_tank_2_desc: "Вероятно, одна из самых смертоносных «стеклянных пушек», когда-либо созданных. Она не может противостоять танку, но может уничтожить целую колонну. Имеет 4 130-мм пусковые установки и 2 30-мм автоматические пушки."
 CRM_Rec_tank_2_short: "БМПТ «Терминатор»"
 CRM_Rec_tank_3: "К-18 «Бумеранг»"
 CRM_Rec_tank_3_desc: "Впервые «Бумеранг» был представлен как экономичный БТР и БМП для современной российской армии. Однако «Бумеранг» будет использоваться и как специализированная противотанковая платформа, оснащенная 125-мм пушкой, подробности о которой были представлены в 2018 году. Как и американский Stryker MGS, «Бумеранг» будет выполнять функции машины огневой поддержки, подобно БМПТ."
 CRM_Rec_tank_4: "Разведывательный танк 2025 года"
 CRM_Rec_tank_4_short: "Разведывательный танк 2025 года"
 CRM_Rec_tank_5: "Разведывательный танк 2035 года"
 CRM_Rec_tank_5_short: "Разведывательный танк 2035 года"
 CRM_SP_Anti_Air_0: "ЗСУ-23-4 «Шилка»"
 CRM_SP_Anti_Air_1: "9К35 «Стрела-10»"
 CRM_SP_Anti_Air_2: "2К22 «Тунгуска»"
 CRM_SP_Anti_Air_2_desc: "Выпуская до 8 ракет, эта машина может уничтожить любой самолёт, который попадётся на её пути. Более того, она может также уничтожать транспортные самолёты с помощью своих автопушек."
 CRM_SP_Anti_Air_3: "Панцирь-С1М"
 CRM_SP_Anti_Air_4: "Панцирь-С4Л"
 CRM_SP_R_arty_0: "БМ-21 «Град»"
 CRM_SP_R_arty_0_desc: "Мало используемый в современных операциях «дедушка» САУ и РСЗО применялся в основном во Второй мировой войне и в Афганистане. Эффективен на расстоянии 20 км."
 CRM_SP_R_arty_1: "БМ-30 «Смерч»"
 CRM_SP_R_arty_1_desc: "Эта машина представляет собой более современную версию «Града». Она способна пройти по снегу, льду или пустыне в любой точке земного шара. Её эффективная дальность стрельбы — 35 км."
 CRM_SP_R_arty_2: "9А52-4 «Торнадо»"
 CRM_SP_R_arty_2_desc: "Чрезвычайно тяжелая артиллерийская батарея, которая, если её не остановить, способна разрушить целые города. Максимальная дальность — до 90 км."
 CRM_SP_arty_0: "2С1 «Гвоздика»"
 CRM_SP_arty_0_desc: "2С1 «Гвоздика» — советская самоходная гаубица на базе универсального шасси МТ-ЛБу, оснащённая 122-мм гаубицей 2А18. «2С1» — это обозначение ГРАУ. Альтернативное российское обозначение — САУ-122, но в российской армии она обычно известна как «Гвоздика»."
 CRM_SP_arty_1: "2С3 «Акация»"
 CRM_SP_arty_1_desc: "Вооружённая 152,4-мм пушкой Д-22, способной при необходимости «выстрелить в солнце с небес». Это выдающаяся артиллерийская батарея с дальностью стрельбы до 50 км."
 CRM_SP_arty_2: "2С19М2 «Мста-С»"
 CRM_SP_arty_2_desc: "2С19 «Мста-С» была разработана в конце холодной войны: в ней применены новые технологии и увеличена дальность стрельбы по сравнению с предшественницей."
 CRM_SP_arty_3: "2С35 «Коалиция-СВ»"
 CRM_SP_arty_3_desc: "2С35 — настоящая артиллерийская платформа 21-го века с широкой автоматизацией, автоматическим выбором типа снарядов и унифицированными системами боевого управления."
 CRM_SP_arty_4: "2С38 «Коалиция-М»"
 CRM_artillery_1: "Д-30"
 CRM_artillery_1_desc: "122-мм буксируемая артиллерия, применявшаяся советскими войсками во многих войнах. Дальность стрельбы — 15–25 км."
 CRM_artillery_2: "2А65 «Мста-Б»"
 CRM_artillery_3: "Д-40"
 CRM_artillery_4: "Д-50"
 CRM_util_vehicle_1: "ЗИЛ-131"
 CRM_util_vehicle_1_desc: "Грузовик тылового обеспечения и перевозчик войск, используемый многими военными по всему миру."
 CRM_util_vehicle_2: "Урал-4320"
 CRM_util_vehicle_2_desc: "Грузовик тылового обеспечения и перевозчик войск, используемый многими военными по всему миру."
 CRM_util_vehicle_3: "КамАЗ-4310"
 CRM_util_vehicle_3_desc: "Грузовик и транспортное средство для перевозки войск, используемые многими армиями мира."
 CRM_util_vehicle_4: "КамАЗ-4350"
 CRM_util_vehicle_4_desc: "Как и «Волк», может перевозить 8 человек, а сверху на нём можно установить крупнокалиберные пулемёты. Используется во главе колонн."
 CRM_util_vehicle_5: "ГАЗ «Тигр»"
 CRM_util_vehicle_5_desc: "Этот бронетранспортер может быть вооружен различным оружием и перевозить до 11 человек."
 CRM_util_vehicle_6: "ВПК-3927 «Волк»"
 CRM_util_vehicle_6_desc: "ВПК может перевозить 2+8 человек. Имеет бронезащиту по STANAG 4569 уровня 3. Отлично подходит для спецназа и полиции."
 CRM_util_vehicle_7: "З-СТС «Ахмат»"
 CRM_util_vehicle_7_desc: "Z-STS «Ахмат» построен на шасси КАМАЗ-5350 с трехосным полным приводом. Обладает высокими характеристиками проходимости и маневренности, а кроме того, не отличается сложностью эксплуатации. Любопытно, что бронеавтомобиль, в отличие от базового грузовика, выполнен по капотной схеме. Это позволило сместить места экипажа назад и повысить их безопасность."
 TAT_Anti_Air_0: "9К32 «Стрела-2»"
 TAT_Anti_Air_0_desc: "Разработан в начале холодной войны с использованием метода пропорциональной навигации для захвата и уничтожения американских ядерных бомбардировщиков. Одна из самых простых систем ПВО, способная поражать цели на расстоянии 3700–4200 м."
 TAT_Anti_Air_1: "9К38 «Игла»"
 TAT_Anti_Air_1_desc: "«Игла» — более современная версия «Стрелы», принятая на вооружение в России в 2004 году. Она использует двухдиапазонную инфракрасную систему наведения (версия «С»), которая намного лучше, чем у «Стрелы»."
 TAT_Anti_Air_2: "9К38 «Игла-С»"
 TAT_Anti_Air_2_desc: "Новейший вариант, который является существенно улучшенным вариантом с большей дальностью действия, более чувствительным искателем, повышенной устойчивостью к последним мерам противодействия и более тяжелой боеголовкой. Производитель сообщает, что вероятность попадания составляет 0,8-0,9."
 TAT_Anti_Air_3: "9К42"
 TAT_Anti_Air_4: "9К48"
 TAT_APC_1: "БТР-60"
 TAT_APC_1_desc: "Одна из старейших машин, до сих пор находящихся на вооружении, БТР-60, оснащена 14,5-мм крупнокалиберным пулемётом КПВТ с боезапасом 500 патронов. Вспомогательное вооружение — спаренный пулемёт ПКТ калибра 7,62 мм с боезапасом 3,00 патрона. Отлично подходит для переброски лёгкой пехоты и сил быстрого реагирования (QRF)."
 TAT_APC_1_short: "БТР-60"
 TAT_APC_2: "МТ-ЛБ"
 TAT_APC_2_desc: "МТ-ЛБ был создан в 1970-х годах. Изготовлены дешево и быстро. Советы использовали их для легких противовоздушных и пехотных боев."
 TAT_APC_2_short: "МТ-ЛБ"
 TAT_APC_3: "БТР-70"
 TAT_APC_3_desc: "БТР-70 использовались с 1972 года, в советско-афганской войне они использовались для передвижения войск и последующей огневой поддержки. Единственное отличие от БТР-60 — более тяжелая броня."
 TAT_APC_3_short: "БТР-70"
 TAT_APC_4: "БТР-80"
 TAT_APC_4_desc: "БТР-80 — колесный БТР-амфибия с колесной формулой 8х8, разработанный в СССР. Он был принят на вооружение в 1986 году и заменил в Советской Армии предыдущие машины БТР-60 и БТР-70. Впервые он был применен во время советской войны в Афганистане."
 TAT_APC_4_short: "БТР-80"
 TAT_APC_5: "БТР-90"
 TAT_APC_5_desc: "Разработан в 1994 году для борьбы с боевиками. Оснащен мощной 30-мм пушкой Шипунова 2А42 с 500 патронами."
 TAT_APC_5_short: "БТР-90"
 TAT_APC_6: "Курганец-25"
 TAT_APC_6_desc: "«Курганец-25», одна из самых современных российских машин, был создан в 2015 году. Как БМП он вооружён лёгкой пушкой «Бумеранг-БМ» и 12,7-мм пулемётом «Корд». Во многом повторяет американскую БМП Bradley."
 TAT_APC_6_short: "Курганец-25"
 TAT_APC_7: "Курганец-35"
 TAT_APC_7_desc: "Во многом подобно «Курганцу-25», который в первую очередь является БМП, «Курганец-35» — это БТР: он может перевозить 12 человек и выполнять в операциях БМП примерно те же задачи, что и 25-й."
 TAT_APC_7_short: "Курганец-35"
 TAT_APC_8: "Курганец-45"
 TAT_APC_8_desc: "Об этом супер БТР известно немного, но он оснащен 40-мм пушкой и может перевозить 12 человек."
 TAT_APC_8_short: "Курганец-45"
 TAT_Heavy_Anti_tank_1: "БРДМ-2 9П148 «Конкурс»"
 TAT_Heavy_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах. Эффективная дальность — 500–3000 м."
 TAT_Heavy_Anti_tank_2: "МТ-ЛБ «Конкурс»"
 TAT_Heavy_Anti_tank_3: "«Корнет-Э»"
 TAT_Heavy_Anti_tank_4: "«Корнет-ДМ»"
 TAT_IFV_1: "БМП-1"
 TAT_IFV_1_desc: "БМП-1 — советская гусеничная плавающая боевая машина пехоты. Применялась в советско-афганской войне для перевозки войск и борьбы с джихадистами. Вооружена 73-мм орудием 2А28 и пусковой установкой ПТУР."
 TAT_IFV_1_short: "БМП-1"
 TAT_IFV_2: "БМП-2"
 TAT_IFV_2_desc: "Самый большой страх джихадистов — это БМП-2, чрезвычайно быстрая и эффективная благодаря 30-мм пушке и перемалывающим гусеницам."
 TAT_IFV_2_short: "БМП-2"
 TAT_IFV_3: "БМП-2М"
 TAT_IFV_3_short: "БМП-2М"
 TAT_IFV_4: "БМП-3"
 TAT_IFV_4_desc: "БМП-3 — советская боевая машина пехоты, преемница БМП-1 и БМП-2. Стрельба из 100-мм пушки тяжелыми фугасными снарядами."
 TAT_IFV_4_short: "БМП-3"
 TAT_IFV_5: "БМП-3М"
 TAT_IFV_5_desc: "БМП-3М — советская боевая машина пехоты, преемница БМП-1 и БМП-2 и вариант БМП-3. Использует модернизированную пушку и двигатель."
 TAT_IFV_5_short: "БМП-3М"
 TAT_IFV_6: "Т-15 «Армата»"
 TAT_IFV_6_desc: ""
 TAT_IFV_6_short: "Т-15"
 TAT_IFV_7: "Т-15М"
 TAT_IFV_7_short: "Т-15М"
 TAT_IFV_8: "Т-16"
 TAT_IFV_8_short: "Т-16"
 TAT_Anti_tank_1: "РПГ-7"
 TAT_Anti_tank_1_desc: "Применялся во многих войнах и на многих машинах."
 TAT_Anti_tank_2: "АТ-4 «Фагот»"
 TAT_Anti_tank_2_desc: "Гораздо легче и старше других ПТРК. Эта ПТУР поражает цели лишь на дальности 70–2500 м, что значительно меньше, чем у других комплексов, зато она дешевле."
 TAT_Anti_tank_3: "9М133М «Корнет-М»"
 TAT_Anti_tank_4: "9М134М «Булат-М»"
 TAT_MBT_1: "Т-55"
 TAT_MBT_1_desc: "Танк Т-54/55, пожалуй, самый массовый в мире. Разработанный и произведённый в первые годы холодной войны, он был могуществом и основой Красной Армии. Когда-то внушавший страх как символ российской мощи, он стал культовым изображением ближневосточных бронетанковых войск, уничтожаемых в результате американского воздушного удара."
 TAT_MBT_1_short: "Т-55"
 TAT_MBT_2: "Т-72"
 TAT_MBT_2_desc: "Т-72, пожалуй, самая успешная разработка, созданная Россией. Это была вершина советской военной мощи на завершающем этапе Холодной войны, производившаяся тысячами, и служащая основой российской армии даже сегодня. Хотя она стала печально известной из-за своих катастрофических неудач в конфликтах на Ближнем Востоке, Т-72 по-прежнему используется в качестве платформы для разработки будущих российских танков и постоянно подвергается модификациям и обновлениям, чтобы соответствовать стандартам современной войны сегодня. Не стоит недооценивать танк, который когда-то был копьём советских войск."
 TAT_MBT_2_short: "Т-72"
 TAT_MBT_3: "Т-80"
 TAT_MBT_3_desc: "Этот танк стоимостью $2 млн — настоящий зверь поля боя — использовал ту же пушку, что и Т-72, но с усиленной бронёй и ПТУР «Кобра»."
 TAT_MBT_3_short: "Т-80"
 TAT_MBT_4: "Т-90"
 TAT_MBT_4_desc: "Т-90 — российский основной боевой танк, созданный как глубокая модернизация Т-72Б и принятый на вооружение в 1992 году. Он получил систему управления огнём на базе аппаратуры Т-80У, комплекс оптико-электронного подавления «Штора-1» и встроенную динамическую защиту «Контакт-5», что заметно подняло его защищённость. Вооружение — 125-мм гладкоствольная пушка 2А46М с автоматом заряжания, способная запускать управляемые ракеты через ствол. Т-90 стал самым массовым российским танком постсоветского периода и одним из главных экспортных образцов."
 TAT_MBT_4_short: "Т-90"
 TAT_MBT_5: "Т-14 «Армата»"
 TAT_MBT_5_desc: "Самый передовой боевой танк в российской армии с гладкими очертаниями и мощной 152-мм пушкой."
 TAT_MBT_5_short: "Т-14"
 TAT_MBT_7: "Т-14М"
 TAT_MBT_7_short: "Т-14М"
 TAT_MBT_8: "Т-99 «Чёрный орел»"
 TAT_MBT_8_short: "Т-99"
 TAT_mbt_equipment_0: "Т-62"
 TAT_mbt_equipment_1: "Т-72"
 TAT_mbt_equipment_2: "Т-90"
 TAT_mbt_equipment_3: "Т-14"
 TAT_mbt_equipment_4: "Т-24"
 TAT_Rec_tank_0: "ПТ-76"
 TAT_Rec_tank_0_desc: "Этот сверхбыстрый лёгкий амфибийный танк может подкрасться к вражеским позициям через реку и устроить ад. С 76,2-мм нарезной танковой пушкой Д-56Т."
 TAT_Rec_tank_0_short: "ПТ-76"
 TAT_Rec_tank_1: "2С25 «Спрут-СД»"
 TAT_Rec_tank_1_desc: "Самоходная амфибийная машина для уничтожения танков может подкрадываться к вражеским танкам и стрелять из 125-мм пушки, которую несут Т-72-80."
 TAT_Rec_tank_1_short: "2С25 «Спрут-СД»"
 TAT_Rec_tank_2: "БМПТ «Терминатор»"
 TAT_Rec_tank_2_desc: "Вероятно, одна из самых смертоносных «стеклянных пушек», когда-либо созданных. Она не может противостоять танку, но может уничтожить целую колонну. Имеет 4 130-мм пусковые установки и 2 30-мм автоматические пушки."
 TAT_Rec_tank_2_short: "БМПТ «Терминатор»"
 TAT_Rec_tank_3: "К-18 «Бумеранг»"
 TAT_Rec_tank_3_desc: "Впервые «Бумеранг» был представлен как экономичный БТР и БМП для современной российской армии. Однако «Бумеранг» будет использоваться и как специализированная противотанковая платформа, оснащенная 125-мм пушкой, подробности о которой были представлены в 2018 году. Как и американский Stryker MGS, «Бумеранг» будет выполнять функции машины огневой поддержки, подобно БМПТ."
 TAT_Rec_tank_4: "Разведывательный танк 2025 года"
 TAT_Rec_tank_4_short: "Разведывательный танк 2025 года"
 TAT_Rec_tank_5: "Разведывательный танк 2035 года"
 TAT_Rec_tank_5_short: "Разведывательный танк 2035 года"
 TAT_SP_Anti_Air_0: "ЗСУ-23-4 «Шилка»"
 TAT_SP_Anti_Air_1: "9К35 «Стрела-10»"
 TAT_SP_Anti_Air_2: "2К22 «Тунгуска»"
 TAT_SP_Anti_Air_2_desc: "Выпуская до 8 ракет, эта машина может уничтожить любой самолёт, который попадётся на её пути. Более того, она может также уничтожать транспортные самолёты с помощью своих автопушек."
 TAT_SP_Anti_Air_3: "Панцирь-С1М"
 TAT_SP_Anti_Air_4: "Панцирь-С4Л"
 TAT_SP_R_arty_0: "БМ-21 «Град»"
 TAT_SP_R_arty_0_desc: "Мало используемый в современных операциях «дедушка» САУ и РСЗО применялся в основном во Второй мировой войне и в Афганистане. Эффективен на расстоянии 20 км."
 TAT_SP_R_arty_1: "БМ-30 «Смерч»"
 TAT_SP_R_arty_1_desc: "Эта машина представляет собой более современную версию «Града». Она способна пройти по снегу, льду или пустыне в любой точке земного шара. Её эффективная дальность стрельбы — 35 км."
 TAT_SP_R_arty_2: "9А52-4 «Торнадо»"
 TAT_SP_R_arty_2_desc: "Чрезвычайно тяжелая артиллерийская батарея, которая, если её не остановить, способна разрушить целые города. Максимальная дальность — до 90 км."
 TAT_SP_arty_0: "2С1 «Гвоздика»"
 TAT_SP_arty_0_desc: "2С1 «Гвоздика» — советская самоходная гаубица на базе универсального шасси МТ-ЛБу, оснащённая 122-мм гаубицей 2А18. «2С1» — это обозначение ГРАУ. Альтернативное российское обозначение — САУ-122, но в российской армии она обычно известна как «Гвоздика»."
