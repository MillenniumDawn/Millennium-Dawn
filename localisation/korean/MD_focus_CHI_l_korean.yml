 CHI_hainan_free_trade_port: "하이난 자유무역항"
 CHI_hainan_free_trade_port_desc: "2018년 베이징은 하이난 전역을 시범 자유무역구로 지정했으며, 2020년에 발표된 총체 계획은 2025년까지 완전히 독립된 관세 구역에 이르는 경로를 제시합니다. 하이커우와 양푸 심수항의 확장 공사와 보아오 포럼 부지는 섬 전체 관세 봉쇄에 앞서 섬의 물류 및 회의 역량을 끌어올립니다. 봉쇄가 완료되면 물품은 하이난 안에서 자유롭게 이동하고 본토 관세 구역으로 넘어갈 때만 관세가 부과됩니다."
 CHI_hainan_zero_tariff_zone: "하이난 무관세 구역"
 CHI_hainan_zero_tariff_zone_desc: "공시된 무관세 물품 목록에 따라 자격을 갖춘 수입품은 관세 없이 하이난에 들어올 수 있으며, 법인세와 개인소득세율은 적격 거주자와 장려 산업에 대해 15퍼센트로 상한이 정해집니다. 역외 면세 소매 한도는 본토보다 훨씬 확대되어, 예전에는 홍콩이나 해외로 갔던 관광 소비를 끌어들입니다. 이러한 세금 및 관세 체제는 하이난이 플랜테이션과 어업 경제에서 관광, 역외 서비스, 고부가가치 가공 무역으로 전환하는 것을 가속합니다."
 CHI_kra_canal_underwriting: "크라 운하 보증"
 CHI_kra_canal_underwriting_desc: "국가개발은행과 중국수출입은행이 크라 지협을 가로지르는 운하의 다음 굴착 단계에 양허성 금융을 제공합니다. 이 신용 한도는 방콕이 국내 예산 주기를 기다리지 않고 즉시 공사를 진행하게 해 주는 한편, 프로젝트의 완공을 중국의 지속적인 호의에 묶어 둡니다. 분할금이 집행될 때마다 중국 선박이 말라카 해협을 우회할 수 있게 해 줄 수로에 대한 베이징의 금융 지분이 깊어집니다."
 CHI_kra_canal_underwriting_phase_tt: "§Y크라 운하§!는 아직 건설 중입니다."
 CHI_kra_transit_corridor: "크라 통과 회랑"
 CHI_kra_transit_corridor_desc: "중국 국영 해운 및 에너지 기업들이 완공된 크라 운하에 환적 및 급유 터미널을 설립하여 페르시아만에서 광둥까지 유조선 항해 거리를 약 1,200킬로미터 단축하고, 혼잡하고 요충지로서 취약한 말라카 해협에 대한 의존을 줄입니다. 이 구상은 단순한 통과권이 아니라 중국 기업이 운하 통행에 대한 운영 양허권을 보유할 때 가장 가치가 큽니다."
 CHI_thaad_escalate_count_tt: "THAAD 보복 확대: $RIGHT|+=0$"
 SCO_military_research_desc: "상하이협력기구의 회원국과 옵서버는 공동 프로그램을 통해 군사 연구를 공유합니다."
 SCO_military_research_name: "SCO 군사 연구"
 CHI_HKG_patriotic_education_drive: "애국 교육 추진"
 CHI_HKG_patriotic_education_drive_desc: "본토에서 설계한 공민 및 국가 정체성 교육과정을 홍콩의 보조금 지급 학교 전반에 도입하고, 푸퉁화 수업을 확대하며, 교사들의 내륙 연수 여행 비용을 지원합니다. 교육국이 비용을 부담하며, 도덕·국민교육 반발이 되풀이되지 않도록 점진적으로 시행합니다."
 CHI_HKG_liaison_office_expansion: "중앙연락판공실 확대"
 CHI_HKG_liaison_office_expansion_desc: "중앙인민정부 홍콩연락판공실과 국가안전수호공서를 확대하고, 본토 간부를 홍콩 공무원 조직에 파견하며, 사법부의 심사 위원회에 검증된 인사를 임명합니다. 행정 통제는 빠르게 진전되지만, 눈에 띄는 개입은 하나하나가 군중을 다시 거리로 불러낼 위험이 있습니다."
 CHI_MAC_cross_border_administration: "국경 간 행정 통합"
 CHI_MAC_cross_border_administration_desc: "마카오에서 본토의 전문 자격과 운전면허를 인정하고, 위안화 청산을 본토가 감독하는 은행을 통해 처리하며, 궁베이와 롄화대교 검문소의 세관 업무를 단일 허가증으로 통합합니다. 마카오는 자신의 법규를 유지하는 가운데 행정 기구는 광둥의 것과 수렴해 갑니다."
 CHI_MAC_hengqin_integration_zone: "헝친 심층협력구"
 CHI_MAC_hengqin_integration_zone_desc: "헝친섬의 광둥-마카오 심층협력구를 확대합니다. 마카오 노동자에게 본토 거주권을 부여하고, 세금 및 관세 제도를 통일하며, 도박 관련 기업을 해협 건너편으로 이전합니다. 주하이는 성장을 흡수하고, 그와 함께 지방 정부의 지렛대도 흡수합니다."
 CHI_TIB_monastic_patriotic_education: "사원 애국 교육"
 CHI_TIB_monastic_patriotic_education_desc: "등록된 모든 사원에 민주관리위원회를 상주시키고, 승려와 비구니가 국가 종교 정책에 대한 시험을 통과하도록 요구하며, 수련생 등록 인원에 상한을 둡니다. 기관들은 계속 운영되지만 영구적인 행정 감독 아래 놓입니다."
 CHI_TIB_village_cadre_teams: "마을 상주 간부 업무팀"
 CHI_TIB_village_cadre_teams_desc: "모든 행정 마을에 당 업무팀을 상주시키고, 호적 감사, 보조금 지급 주택 집약, 흩어져 사는 목축 가정의 기반시설 갖춘 마을로의 이주를 병행합니다. 행정의 침투는 전면적이 되며, 그로 인해 쌓이는 원한도 마찬가지입니다."
 CHI_ETK_bilingual_boarding_schools: "이중언어 기숙학교 제도"
 CHI_ETK_bilingual_boarding_schools_desc: "내륙 성에서 채용한 교사들이 근무하는, 표준 중국어를 교육 언어로 하는 기숙 교육기관으로 농촌 학교 교육을 통합합니다. 위구르어는 교육 언어가 아닌 한 과목으로만 유지되며, 한 세대가 고향 마을에서 떨어진 채 교육받게 됩니다."
 CHI_ETK_labour_transfer_scheme: "잉여 노동력 이전 계획"
 CHI_ETK_labour_transfer_scheme_desc: "조직적인 이전 할당량에 따라 위구르 농촌 노동자를 해안 공장과 지역 산업단지에 배치하고, 마을 간부에게 모집 목표 달성의 책임을 지웁니다. 가계 소득은 오르고 공동체의 유대는 약해지지만, 이 계획은 공급망을 추적하는 외국 감사관들에게 분명히 드러납니다."
 CHI_OMG_mandarin_curriculum_rollout: "통일 교육과정 도입"
 CHI_OMG_mandarin_curriculum_rollout_desc: "정치, 역사, 언어 과목의 몽골어 교과서를 국가 통일 교재로 교체하고 교원단을 그에 맞춰 재교육합니다. 평등한 기회를 위한 조치로 포장되며, 목축 지역이 잠잠하도록 천천히 시행됩니다."
 CHI_OMG_pastoral_sedentarisation: "목축민 정주화 계획"
 CHI_OMG_pastoral_sedentarisation_desc: "황폐화된 초원 전역에 방목 금지를 시행하고, 가축을 내놓은 목축 가정에 보상하며, 보조금이 지급되는 마을 주택에 정착시키고 직업 재교육을 실시합니다. 유목 목축은 임금 노동에 자리를 내주고, 몽골 정체성의 사회적 기반도 함께 사라집니다."
 CHI_national_common_language_campaign: "국가 공용어 캠페인"
 CHI_national_common_language_campaign_desc: "국가통용어언문자법을 모든 특별행정구에 동시에 일률적으로 적용합니다. 단일 교재 시리즈, 공공 부문 고용을 위한 국가 공용어 인증, 방송 할당제가 포함됩니다. 단 한 번의 조직적 추진으로, 중앙정부가 아직 행정적 지렛대를 쥔 모든 곳에서 통합이 진전됩니다."
 CHI_second_generation_ethnic_policy: "제2세대 민족 정책"
 CHI_second_generation_ethnic_policy_desc: "당의 개혁파 이론가들이 촉구하는 탈정치화된 민족 업무 모델을 채택합니다. 우대 할당제를 폐지하고, 조직 원리로서의 지역 자치를 버리며, 시민권을 오직 중화민족을 통해서만 규정합니다. 모든 특별행정구에 동시에 적용되는 이 조치는 가능한 통합 조치 가운데 가장 영향이 크며 가장 불안정을 초래합니다."
 CHI_HKG_sinicization_slot_free: "현재 진행 중인 §Y홍콩§! 통합 계획이 없음"
 CHI_MAC_sinicization_slot_free: "현재 진행 중인 §Y마카오§! 통합 계획이 없음"
 CHI_TIB_sinicization_slot_free: "현재 진행 중인 §Y티베트§! 통합 계획이 없음"
 CHI_ETK_sinicization_slot_free: "현재 진행 중인 §Y신장§! 통합 계획이 없음"
 CHI_OMG_sinicization_slot_free: "현재 진행 중인 §Y네이멍구§! 통합 계획이 없음"
 CHI_national_sinicization_slot_free: "현재 진행 중인 전국 통합 캠페인이 없음"
 CHI_any_SAR_awaiting_integration: "통합을 기다리는 특별행정구가 최소 하나 있음"
 CHI_sinicization_all_SARs_tt: "통합을 기다리는 모든 특별행정구에서 §Y중국화§!가 진전됨"
 CHI_bri_reduce_loan_tt: "그들의 미상환 일대일로 부채가 §G사업 비용 1건§!만큼 감소합니다"
 CHI_bri_restructure_loan_tt: "그들의 대출 금리가 §G2%§!로 떨어지고 상환이 §Y1년§!간 중단됩니다"
 CHI_bri_application_approved_tt: "최종 자격 확인 후 건설이 시작됩니다. 수혜국은 자국 국고에서 §Y40§!을(를) 지불하거나 부족분에 대해 중국의 대출을 받습니다."
 CHI_bri_dual_treasury_50_tt: "BRI 기금과 국고 모두에 최소 §Y50§!이(가) 필요합니다"
 CHI_bri_state_port: "일대일로 항만 프로젝트"
 CHI_bri_state_port_desc: "중국이 후원하는 항만 개발이 현지 물류와 해상 건설 역량을 확대합니다."
 CHI_bri_state_rail: "일대일로 철도 프로젝트"
 CHI_bri_state_rail_desc: "중국이 후원하는 철도 회랑이 육상 물류와 기반시설 건설을 개선합니다."
 CHI_bri_state_pipeline: "일대일로 송유관 프로젝트"
 CHI_bri_state_pipeline_desc: "중국이 후원하는 송유관이 자원 처리량과 지역 보급 역량을 확대합니다."
 CHI_bri_state_telecom: "일대일로 통신 프로젝트"
 CHI_bri_state_telecom_desc: "중국이 후원하는 디지털 백본망이 네트워크 기반시설과 향후 건설을 뒷받침합니다."
 CHI_bri_state_sez: "일대일로 경제특구"
 CHI_bri_state_sez_desc: "중국이 후원하는 경제특구가 현지 공장 용량과 건축 공간을 확대합니다."
 CHI_bri_state_mine: "일대일로 광산 프로젝트"
 CHI_bri_state_mine_desc: "중국의 투자가 해당 주의 광물 매장지에서의 채굴을 확대합니다."
 CHI_bri_state_energy: "일대일로 에너지 프로젝트"
 CHI_bri_state_energy_desc: "중국이 건설한 발전 용량이 현지 산업을 뒷받침합니다."
 CHI_bri_state_prestige: "일대일로 상징 프로젝트"
 CHI_bri_state_prestige_desc: "중국이 후원하는 랜드마크와 사무 단지가 지역 수도의 면모를 바꿉니다."
 CHI_BRI_recipient_finance: "일대일로 금융"
 CHI_BRI_recipient_finance_desc: "우리의 일대일로 부채와 양허권을 관리합니다.\n\n§Y미상환 일대일로 부채:§! [?bri_debt_owed_to_china|2]\n§Y주간 이자 지급액:§! [?bri_loan_payment|2]"
 CHI_huawei_consumer_ecosystem_power: "소비자 생태계 강자"
 CHI_huawei_consumer_ecosystem_power_desc: "기기, 소프트웨어, 서비스, 개발자가 화웨이의 폭넓은 기술 기반의 뒷받침을 받는 세계적 경쟁력을 갖춘 소비자 플랫폼을 이룹니다."
 CHI_huawei_global_telecom_challenger: "글로벌 통신 도전자"
 CHI_huawei_global_telecom_challenger_desc: "국제 연구 센터, 통신사 관계, 확대되는 판매망이 화웨이를 글로벌 통신 분야의 도전자로 만들고 있습니다."
 CHI_huawei_resilient_technology_fortress: "견고한 기술 요새"
 CHI_huawei_resilient_technology_fortress_desc: "화웨이는 여전히 끈질기고 기술력 있는 대표 기업이지만, 지리적 제약과 제한된 신뢰로 인해 상업적 영향권이 좁아졌습니다."
 CHI_huawei_sovereign_full_stack: "자주 풀스택"
 CHI_huawei_sovereign_full_stack_desc: "독자적인 칩, 소프트웨어, AI, 클라우드 서비스, 기기와 견고한 공급 체계가 폭넓은 국내 기술 스택을 이룹니다."
 CHI_semiconductor_events.300.a: "분산된 글로벌 연구개발 네트워크를 지원한다"
 CHI_semiconductor_events.300.b: "국내 통신사 시장을 우선시한다"
 CHI_semiconductor_events.300.d: "1987년 선전에서 설립된 화웨이는 해외 연구 및 판매 사업을 구축하기에 앞서 중국 통신 시장에서 초기 입지를 다졌습니다. 국가 산업 정책은 분산된 글로벌 연구 네트워크에 자금을 댈 수도 있고, 회사의 비중을 국내 통신사 시장에 계속 둘 수도 있습니다."
 CHI_semiconductor_events.300.t: "내수 시장 너머로"
 CHI_semiconductor_events.301.a: "종단 간 LTE 모델을 지원한다"
 CHI_semiconductor_events.301.b: "중국 통신사에 계속 집중한다"
 CHI_semiconductor_events.301.d: "텔리아소네라는 오슬로에서 화웨이 네트워크를 이용해 상용 LTE 서비스를 개시했습니다. 베이징은 계약을 따낸 종단 간 모델을 지원하여 유럽 전역으로 확대할 수도 있고, 회사의 기술자들을 중국 통신사에 계속 투입할 수도 있습니다."
 CHI_semiconductor_events.301.t: "북유럽 LTE 돌파구"
 CHI_semiconductor_events.302.a: "5G 문샷 전체에 자금을 댄다"
 CHI_semiconductor_events.302.b: "대신 무선 장비를 점진적으로 개선한다"
 CHI_semiconductor_events.302.d: "화웨이는 2018년까지 최소 6억 달러의 5G 연구 투자를 발표했습니다. 국가의 지원은 5G 선도를 위한 통합 추진에 자금을 댈 수도 있고, 비용이 훨씬 적게 드는 점진적 무선 장비 개선을 고수할 수도 있습니다."
 CHI_semiconductor_events.302.t: "5G 문샷"
 CHI_semiconductor_events.303.a: "화웨이를 옹호하고 연속성을 지킨다"
 CHI_semiconductor_events.303.b: "협상을 통한 규정 준수 경로를 추구한다"
 CHI_semiconductor_events.303.d: "미국은 화웨이와 수많은 계열사를 거래 제한 명단에 올려 미국 기술에 대한 접근을 크게 제한했습니다. 별개로 제기된 검찰의 혐의에 대해서는 화웨이가 이의를 제기하고 있습니다. 베이징은 회사를 옹호하며 연속성을 지킬 수도 있고, 협상을 통한 규정 준수 경로를 모색할 수도 있습니다."
 CHI_semiconductor_events.303.t: "거래 제한 명단"
 CHI_semiconductor_events.304.a: "비용이 얼마가 들든 국내 제조를 밀어붙인다"
 CHI_semiconductor_events.304.b: "가능한 만큼 비축하고 통제가 풀리기를 기다린다"
 CHI_semiconductor_events.304.d: "확대된 해외 직접 제품 규제로 화웨이의 첨단 반도체 접근이 좁아졌습니다. 국가 정책은 비용이 얼마가 들든 국내 제조를 강력히 추진할 수도 있고, 남아 있는 물량을 비축하며 통제가 풀리기를 기다릴 수도 있습니다."
 CHI_semiconductor_events.304.t: "반도체 병목"
 CHI_semiconductor_events.305.a: "실리콘에서 소프트웨어까지, 자주 풀스택"
 CHI_semiconductor_events.305.b: "통제보다 오래 버티는 기술 요새"
 CHI_semiconductor_events.305.c: "세계로 뻗은 통신 도전자"
 CHI_semiconductor_events.305.e: "독자 플랫폼 위에 세워진 소비자 생태계"
 CHI_semiconductor_events.305.d: "20년에 걸친 확장, 제재, 대체를 거치며 화웨이의 정체성이 정해졌습니다. 국내에서 제조한 프로세서로 만든 휴대전화는 수출 통제가 막으려던 문제에 대한 해답을 내놓았습니다. 이제 국가 전략은 회사가 갖춘 모습을 중심으로 정리됩니다."
 CHI_semiconductor_events.305.t: "두 번째 도약"
 CHI_semiconductor_events.310.t: "IBM 고객 자산"
 CHI_semiconductor_events.310.d: "IBM은 자신들이 발명한 개인용 컴퓨터 사업을, 모든 기업 구매자가 이미 신뢰하는 씽크패드 브랜드까지 포함하여 기꺼이 매각하려 합니다. 이를 인수하면 레노버는 하룻밤 사이에 세계 3위 제조업체가 되지만, IBM이 사업을 포기하게 만든 손실도 함께 떠안게 됩니다."
 CHI_semiconductor_events.310.a: "개인용 컴퓨터 사업을 인수한다"
 CHI_semiconductor_events.310.b: "우리가 직접 만든 것으로 성장한다"
 CHI_semiconductor_events.311.t: "거래를 승인한 워싱턴"
 CHI_semiconductor_events.311.d: "미국 규제 당국은 조건부로 IBM의 레노버 매각을 승인할 것입니다. 조건은 시설 분리, 정부 고객 기록에 대한 접근 제한, 누가 어디서 일하는지에 대한 감독입니다. 이를 수락하면 거래가 성사되지만 중국인 소유주가 안보 문제임을 인정하는 셈입니다. 거부하면 원칙은 지키되 아마도 사업을 잃게 될 것입니다."
 CHI_semiconductor_events.311.a: "안보 서약을 수락한다"
 CHI_semiconductor_events.311.b: "다른 인수자에게는 없을 조건을 거부한다"
 CHI_semiconductor_events.312.t: "자체 이름"
 CHI_semiconductor_events.312.d: "레노버가 씽크패드에 IBM 이름을 붙일 수 있는 라이선스가 끝나가고 있으며, 기업 구매자들은 그 뒤의 회사가 아니라 상표를 사 왔습니다. 제품에 레노버 이름을 붙이는 것은 5년간의 소유가 신뢰를 얼마나 쌓았는지 시험하는 일입니다. 낡은 상표를 가능한 한 오래 유지하면 그 질문은 뒤로 미뤄집니다."
 CHI_semiconductor_events.312.a: "제품에 우리 이름을 붙인다"
 CHI_semiconductor_events.312.b: "물려받은 브랜드를 가능한 한 오래 유지한다"
 CHI_semiconductor_events.313.t: "무르익는 제휴"
 CHI_semiconductor_events.313.d: "일본의 NEC와 독일의 메디온은 완전히 인수되는 대신 레노버와의 합작 투자에 사업을 합칠 것입니다. 합작 투자는 인수에 저항할 국가들에서 시장 점유율을 확보해 주지만, 파트너에게 무엇을 만들지에 대한 발언권을 남깁니다. 직접 인수하면 비용은 더 들지만 누구에게도 얽매이지 않습니다."
 CHI_semiconductor_events.313.a: "합작 투자를 구축한다"
 CHI_semiconductor_events.313.b: "직접 확장하고 통제권을 유지한다"
 CHI_semiconductor_events.314.t: "시스템 x"
 CHI_semiconductor_events.314.d: "IBM은 이제 대량 서버 사업에서도 철수하고 있으며, 같은 논리가 더 큰 규모와 더 높은 가격으로 적용됩니다. System x를 인수하면 레노버는 이미 선도하는 범용 시장 밖으로 나아갑니다. 개인용 컴퓨터에 머무르면 해마다 이윤이 줄어드는 사업을 지켜야 합니다."
 CHI_semiconductor_events.314.a: "서버 사업도 인수한다"
 CHI_semiconductor_events.314.b: "개인용 컴퓨터 사업을 지킨다"
 CHI_semiconductor_events.315.t: "레노버가 된 모습"
 CHI_semiconductor_events.315.d: "서구 기업들이 더는 원하지 않던 것을 사들인 레노버의 20년은, 중국의 컴퓨팅 제조가 무엇이며 세계 하드웨어의 얼마나 많은 부분이 그곳을 거치는지를 정해 놓았습니다."
 CHI_semiconductor_events.315.a: "서버에서 데스크톱까지 아우르는 기업 플랫폼"
 CHI_semiconductor_events.315.b: "세계의 개인용 컴퓨터 제조업체"
 CHI_semiconductor_events.315.c: "중국의 규모와 외국 브랜드를 잇는 다리"
 CHI_semiconductor_events.315.e: "국내 대표 기업"
 CHI_lenovo_enterprise_server_platform: "기업 플랫폼"
 CHI_lenovo_enterprise_server_platform_desc: "데스크톱, 노트북, 그리고 그 뒤의 서버가 모두 한 회사에서 만들어지며, 이 회사는 각 사업을 이전 소유주가 포기했을 때 인수했습니다. 판매자들이 찾지 못한 이윤은 대규모로 제조하면 거기에 있습니다."
 CHI_lenovo_global_pc_platform: "세계적 제조업체"
 CHI_lenovo_global_pc_platform_desc: "하나의 상표 아래 중국 생산 라인에서 출하되는 개인용 컴퓨터가 다른 어느 곳보다 많습니다. 이윤이 얇은 범용 사업이며 물량에서 현실적인 도전자는 없습니다."
 CHI_lenovo_strategic_bridge: "전략적 가교"
 CHI_lenovo_strategic_bridge_desc: "합작 투자가 현지 파트너와 현지 이름을 내세우기에, 중국 소유주를 거부할 시장에도 중국 제조품이 닿습니다. 통제권은 공유되고 문은 열려 있습니다."
 CHI_lenovo_domestic_champion: "국내 대표 기업"
 CHI_lenovo_domestic_champion_desc: "이 회사는 사들인 것이 아니라 스스로 만든 것으로 성장했으며, 외국 주주 명부가 아닌 베이징에 책임을 집니다. 영향력은 더 작지만 어느 것도 타인의 허가에 달려 있지 않습니다."
 china_sar.021.b: "그 섬은 함대를 걸 만한 가치가 없다. 최후통첩을 철회한다."
 CHI_TAI_lift_full_blockade: "전면 봉쇄 해제"
 CHI_TAI_lift_full_blockade_desc: "봉쇄선을 부분 봉쇄 수준으로 완화합니다. 타이베이에 대한 압박이 줄고 워싱턴의 경계심도 가라앉지만, 섬의 항구들이 다시 열립니다."
 CHI_ernie_national_champion_decision: "어니를 국가 모델로 지정"
 CHI_ernie_national_champion_decision_desc: "바이두의 모델을 국가 및 성 단위 배치의 기준 시스템으로 지정합니다. 선점자 지위는 공식적 위상이 되고, 각 부처는 여섯 개 대신 하나의 아키텍처만 인증하면 됩니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_ernie_consumer_search_decision: "어니를 검색에 통합"
 CHI_ernie_consumer_search_decision_desc: "기업 계약을 쫓는 대신 모델을 이용자들이 이미 있는 곳에 둡니다. 보급은 즉각적이고 수익은 실재하지만, 표준을 정하는 역할은 포기해야 합니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_qwen_open_ecosystem_decision: "치원을 개방형 플랫폼으로 지원"
 CHI_qwen_open_ecosystem_decision_desc: "가중치를 공개하여 국내 생태계가 그 위에 구축하도록 하는 것을 지원합니다. 모든 하위 개발자는 중국 인프라에 대한 의존이 되며, 이는 시간이 갈수록 라이선스 수입보다 가치가 큽니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_qwen_cloud_captive_decision: "치원을 클라우드 사업에 종속"
 CHI_qwen_cloud_captive_decision_desc: "최첨단 모델을 알리바바 클라우드 안에 두어 연산 자원을 구매할 이유로 삼습니다. 이윤은 플랫폼에 남고 영향력도 그러합니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_zhipu_academic_pipeline_decision: "칭화 인재 파이프라인 지원"
 CHI_zhipu_academic_pipeline_decision_desc: "연구소를 제품 회사가 아니라 차세대 연구자를 길러내는 훈련장으로 다룹니다. 시장 진입은 더디지만 성과가 복리로 쌓입니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_zhipu_state_procurement_decision: "즈푸를 국가 조달로 연결"
 CHI_zhipu_state_procurement_decision_desc: "부처 및 성 단위 계약을 통해 수요를 보장합니다. 연구소는 시장을 찾을 필요가 없으며, 시장에 책임질 필요도 없습니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_doubao_consumer_scale_decision: "더우바오를 대중 규모로 확대"
 CHI_doubao_consumer_scale_decision_desc: "아무도 맞출 수 없는 가격으로 수억 명의 이용자 앞에 어시스턴트를 내놓습니다. 지표는 채택이며, 연산 비용 청구서는 그 대가입니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_doubao_recommendation_core_decision: "더우바오를 추천 시스템 안에 유지"
 CHI_doubao_recommendation_core_decision_desc: "작업을 이미 수익을 내는 순위 및 추천 시스템으로 되돌립니다. 소비자용 어시스턴트보다 눈에 덜 띄지만 수익성은 훨씬 높습니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_deepseek_open_weight_release_decision: "딥시크 가중치 공개"
 CHI_deepseek_open_weight_release_decision_desc: "최첨단급 모델을 공개적으로 발표하여 세계 나머지 나라가 중국의 연구 위에 구축하도록 합니다. 수출 통제는 연산 자원을 막으려는 것이었지만, 공개는 그 제약을 누가 조건을 정하느냐에 대한 논쟁으로 바꿔 놓습니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_deepseek_state_aligned_lab_decision: "딥시크를 국가 사업에 편입"
 CHI_deepseek_state_aligned_lab_decision_desc: "연구소를 자금과 감독이 따르는 국가 계획에 편입합니다. 효율성 연구는 감독 아래 계속되지만, 더 이상 누구나 읽을 수 있는 것이 아니게 됩니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_moonshot_long_context_decision: "롱 컨텍스트 승부수 지원"
 CHI_moonshot_long_context_decision_desc: "다른 곳에서는 제공하지 않는 컨텍스트 길이를 추구하는 데 자금을 댑니다. 하나의 능력에 건 좁은 도박이며, 이를 가장 먼저 달성하는 연구소가 한 분야를 차지합니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_moonshot_enterprise_pivot_decision: "문샷을 기업용으로 전환"
 CHI_moonshot_enterprise_pivot_decision_desc: "소비자 경쟁을 포기하고 수익을 예측할 수 있는 계약 기반 배치와 맞바꿉니다. 기업 가치의 상승은 멈추지만 재무제표의 출혈도 멈춥니다.\n\n§Y이로 인한 국가 정신은 365일간 지속됩니다. AI 연구소 계획은 한 번에 하나만 활성화할 수 있습니다.§!"
 CHI_ernie_national_champion: "국가 기준 모델"
 CHI_ernie_national_champion_desc: "인증된 하나의 아키텍처가 부처, 성, 국유 기업 전반에서 구동됩니다. 조달은 단순해지고, 표준은 중국의 것이며, 기존 선두 주자는 서둘러 움직일 이유가 별로 없습니다."
 CHI_ernie_consumer_search: "검색 통합 어시스턴트"
 CHI_ernie_consumer_search_desc: "모델은 영업팀이 아니라 검색 제품을 통해 이용자에게 닿습니다. 수익은 즉시 들어오지만 표준을 정하는 역할은 다른 누군가에게 넘어갑니다."
 CHI_qwen_open_ecosystem: "공개 가중치 생태계"
 CHI_qwen_open_ecosystem_desc: "공개된 가중치는 플랫폼을 세계가 라이선스를 받아 쓰는 것이 아니라 그 위에 구축하는 것으로 만들었습니다. 직접적인 수입은 적지만 의존의 방향은 올바릅니다."
 CHI_qwen_cloud_captive: "클라우드 종속형 최전선"
 CHI_qwen_cloud_captive_desc: "최고의 모델은 연산 자원을 임대할 이유이며 다른 어디서도 구동되지 않습니다. 이윤과 협상력 모두 플랫폼에 남습니다."
 CHI_zhipu_academic_pipeline: "학술 연구 인재 파이프라인"
 CHI_zhipu_academic_pipeline_desc: "연구소는 모델만큼이나 연구자를 길러내며, 대학은 둘 모두를 계속 공급합니다. 상업적 산출은 크지 않지만 인재 기반은 그렇지 않습니다."
 CHI_zhipu_state_procurement: "국가 조달 연구소"
 CHI_zhipu_state_procurement_desc: "부처 계약이 수요를 보장하고 방향을 정합니다. 자금은 안정적이며, 경쟁 압력이 전혀 없다는 점도 마찬가지입니다."
 CHI_doubao_consumer_scale: "대중 소비자 배치"
 CHI_doubao_consumer_scale_desc: "경쟁을 차단하는 가격으로 하루 수억 명의 이용자를 확보합니다. 채택률은 비할 데가 없고 추론 비용 청구서는 막대합니다."
 CHI_doubao_recommendation_core: "추천 핵심"
 CHI_doubao_recommendation_core_desc: "연구는 독립 어시스턴트가 아니라 이미 돈을 찍어내는 순위 시스템으로 흘러갑니다. 화려하지는 않지만 수익은 즉각적입니다."
 CHI_deepseek_open_weight_release: "최전선 모델 공개"
 CHI_deepseek_open_weight_release_desc: "기존 강자들이 쓰는 비용의 일부만으로 학습한 최첨단급 모델이 공개적으로 발표되었습니다. 효율성이라는 논거는 모델보다 더 멀리 퍼집니다."
 CHI_deepseek_state_aligned_lab: "국가 연계 최전선 연구소"
 CHI_deepseek_state_aligned_lab_desc: "효율성 연구는 국가 자금과 국가 감독 아래 계속됩니다. 역량은 계속 복리로 쌓이지만 결과는 더 이상 공개되지 않습니다."
 CHI_moonshot_long_context: "롱 컨텍스트 전문"
 CHI_moonshot_long_context_desc: "나머지 업계가 제공할 수 없는 컨텍스트 길이를 제공하겠다는 의도적인 도박입니다. 좁은 분야이지만 안착하는 곳에서는 경쟁자가 없습니다."
 CHI_moonshot_enterprise_pivot: "기업 배치 실무"
 CHI_moonshot_enterprise_pivot_desc: "계약 기반 배치가 소비자 경쟁을 대체했습니다. 성장은 더디지만 수익은 예측 가능하며, 연구소는 자금 혹한기를 견뎌냅니다."
 CHI_ai_lab_treasury_15_tt: "국고 보유액이 §Y150억§!을 초과함"
 CHI_ai_lab_treasury_20_tt: "국고 보유액이 §Y200억§!을 초과함"
 CHI_pacific_pivot_partner_exists_tt: "최소 한 개의 태평양 국가가 §Y태평양 회귀 파트너§!입니다"
 CHI_TAI_full_blockade_active: "타이완 전면 봉쇄 중"
 CHI_semiconductor_events.320.t: "텐센트 절반을 3,200만 달러에"
 CHI_semiconductor_events.320.d: "텐센트는 아무도 돈을 내고 쓰지 않는 메신저에 현금을 쏟아붓고 있으며, 어떤 중국 투자자도 자금을 대려 하지 않습니다. 남아프리카 미디어 그룹인 MIH가 지분 46.5퍼센트에 3,200만 달러를 제시하며 포니 마가 계속 회사를 운영하도록 두겠다고 합니다. 대안은 베이징이 정한 조건의 국내 자금입니다."
 CHI_semiconductor_events.320.a: "지분을 MIH에 매각한다"
 CHI_semiconductor_events.320.b: "국내에서 자금을 조달한다"
 CHI_semiconductor_events.321.t: "홍콩에 상장한 텐센트"
 CHI_semiconductor_events.321.d: "텐센트는 어떤 시장도 가치를 매겨 본 적 없는 이용자 기반을 근거로 홍콩 거래소에 주식을 올리고 외국 자본을 조달할 수 있습니다. 상장은 그 이후의 모든 것에 자금을 댑니다. 그러나 매 분기 중국 메신저 기업의 회계를 읽고 싶은 누구에게나 공개하게 되기도 합니다."
 CHI_semiconductor_events.321.a: "홍콩 거래소에 상장한다"
 CHI_semiconductor_events.321.b: "비상장을 유지하고 현금 흐름으로 성장한다"
 CHI_semiconductor_events.322.t: "웨이신"
 CHI_semiconductor_events.322.d: "메일 제품 때문에 인수한 광저우의 텐센트 팀이 QQ와 직접 경쟁할 휴대전화 메신저를 만들고자 합니다. QQ는 회사 전체가 기대고 있는 사업입니다. 팀을 지원하면 자사의 경쟁자에게 자금을 대는 셈이고, 거부하면 QQ가 스마트폰 시대를 홀로 맞이하게 됩니다."
 CHI_semiconductor_events.322.a: "광저우 팀이 만들도록 둔다"
 CHI_semiconductor_events.322.b: "휴대전화에서 QQ를 지킨다"
 CHI_semiconductor_events.323.t: "슈퍼셀"
 CHI_semiconductor_events.323.d: "텐센트는 클래시 오브 클랜을 만든 핀란드 스튜디오 슈퍼셀의 지배권을 86억 달러에 사들여, 게임을 중국에 라이선스하는 대신 직접 소유할 수 있습니다. 중국 기업이 게임 사업에 지불한 금액으로는 사상 최대입니다. 다른 이들의 작품을 퍼블리싱하는 것은 비용이 들지 않지만 수익은 그 일부에 불과합니다."
 CHI_semiconductor_events.323.a: "스튜디오를 완전히 인수한다"
 CHI_semiconductor_events.323.b: "라이선스를 받아 대신 퍼블리싱한다"
 CHI_semiconductor_events.324.t: "판호 동결"
 CHI_semiconductor_events.324.d: "규제 당국은 신규 게임 판호 승인을 중단했으며 언제 재개할지도 밝히지 않았고, 텐센트의 매출은 합법적으로 출시할 수 없는 작품에 달려 있습니다. 시가총액 약 2천억 달러가 사라졌습니다. 국가가 원하는 준법 체계를 구축하는 일은 더디고 비용이 많이 들지만, 해외 시장을 통해 사업을 돌리는 일은 그렇지 않습니다."
 CHI_semiconductor_events.324.a: "규제 당국이 요구하는 것을 구축한다"
 CHI_semiconductor_events.324.b: "해외 시장을 통해 매출을 돌린다"
 CHI_semiconductor_events.325.t: "텐센트가 된 모습"
 CHI_semiconductor_events.325.d: "누가 텐센트에 자금을 대는지, 해외에서 무엇을 소유하는지, 규제 당국에 얼마나 굽히는지에 대한 25년간의 결정들이 중국 소비자 인터넷이 무엇인지를 정해 놓았습니다."
 CHI_semiconductor_events.325.a: "글로벌 플랫폼 복합기업"
 CHI_semiconductor_events.325.b: "국내 슈퍼앱"
 CHI_semiconductor_events.325.c: "허가받은 게임 퍼블리셔"
 CHI_semiconductor_events.325.e: "독립 메신저 그룹"
 CHI_tencent_global_platform_conglomerate: "글로벌 플랫폼 복합기업"
 CHI_tencent_global_platform_conglomerate_desc: "텐센트는 네 개 대륙에 걸쳐 스튜디오, 결제망, 메신저를 소유하고 있으며, 해외 수익의 대부분은 직접 만든 것이 아니라 인수한 회사들을 통해 벌어들입니다. 보유 자산은 시장이 평가하는 만큼의 가치를 가집니다."
 CHI_tencent_domestic_superapp: "국내 슈퍼앱"
 CHI_tencent_domestic_superapp_desc: "메신저, 결제, 교통, 행정 서비스가 모두 중국 내 기반시설 위에서 하나의 애플리케이션을 통해 운영됩니다. 텐센트는 사람들이 쓰는 회사가 아니라 다른 모든 것이 그 위에 세워지는 계층이 되었습니다."
 CHI_tencent_licensed_games_publisher: "허가받은 게임 퍼블리셔"
 CHI_tencent_licensed_games_publisher_desc: "텐센트는 규제 당국이 승인한 것을 당국이 정한 일정에 따라 출시하며, 요구받기 전에 준법 체계를 구축해 두었기에 승인이 도착합니다. 더 작은 사업이지만 안정적입니다."
 CHI_tencent_independent_messaging: "독립 메신저 그룹"
 CHI_tencent_independent_messaging_desc: "텐센트는 QQ를 지키고, 기술자들을 지키고, 나머지 중국 인터넷을 집어삼킨 논쟁에서 비켜서 있었습니다. 그 영향권은 메신저를 벗어난 적이 없습니다."
 CHI_semiconductor_events.330.t: "도쿄에서 온 2천만 달러"
 CHI_semiconductor_events.330.d: "마사요시 손은 몇 분 만에 끝난 만남 이후 알리바바에 2천만 달러를 제안했으며, 소프트뱅크는 매출이 없는 회사의 상당한 지분을 원합니다. 마윈은 일본의 자금과 그에 따라오는 소유권 문제를 받아들일 수 있습니다. 아니면 사이트의 수출업자들이 아직 사이트의 용도를 익히는 중인 지금 당장 그들에게 수수료를 물리기 시작할 수도 있습니다."
 CHI_semiconductor_events.330.a: "소프트뱅크의 자금을 받는다"
 CHI_semiconductor_events.330.b: "상인들에게 수수료를 물리고 자력으로 조달한다"
 CHI_semiconductor_events.331.t: "타오바오 대 이베이"
 CHI_semiconductor_events.331.d: "이베이는 이치넷을 소유하여 중국 소비자 거래의 대부분을 차지하고 있으며, 시장에 승부는 끝났다고 알렸습니다. 알리바바는 항저우의 아파트에 팀을 꾸려 필요한 기간만큼 판매자에게 수수료를 전혀 받지 않는 경쟁자를 만들 수 있습니다. 기업 간 거래에 머무르면 수익은 나지만 소비자 시장을 영구히 내주게 됩니다."
 CHI_semiconductor_events.331.a: "타오바오를 만들고 판매자에게 수수료를 받지 않는다"
 CHI_semiconductor_events.331.b: "기업 간 거래를 지킨다"
 CHI_semiconductor_events.332.t: "야후의 10억 달러"
 CHI_semiconductor_events.332.d: "야후는 알리바바 지분 40퍼센트를 대가로 10억 달러를 지불하고 중국 사업을 넘겨주려 하며, 이는 중국 인터넷 기업에 이루어진 외국인 투자로는 사상 최대입니다. 이 자금은 10년간 자금 문제를 해결해 줍니다. 그러나 나라의 상거래를 운영하는 회사 위에 외국인 이사 자리도 올려 놓게 됩니다."
 CHI_semiconductor_events.332.a: "10억 달러와 이사 자리를 함께 받는다"
 CHI_semiconductor_events.332.b: "주주 명부를 중국인 손에 둔다"
 CHI_semiconductor_events.333.t: "그룹을 떠난 알리페이"
 CHI_semiconductor_events.333.d: "중앙은행은 국내 자본 소유의 결제 사업자에게만 허가를 내줄 것이며, 알리페이는 알리바바 이사회에 상정되지 않은 채 마윈이 지배하는 회사로 옮겨졌습니다. 이사들은 사후에야 이를 알게 되었습니다. 이전을 되돌리려면 규제 당국과 허가를 놓고 다투어야 하며, 그동안 알리바바의 결제 사업은 동결됩니다."
 CHI_semiconductor_events.333.a: "이전을 유지하고 주주들과 합의한다"
 CHI_semiconductor_events.333.b: "되돌리고 허가를 협상한다"
 CHI_semiconductor_events.334.t: "앤트 상장 중단"
 CHI_semiconductor_events.334.d: "역대 최대 규모로 추진되던 앤트 그룹의 상장이, 마윈이 상하이 청중 앞에서 규제 당국이 전당포를 운영한다고 말한 뒤 거래 이틀 전에 중단되었습니다. 알리바바는 철회하고 앤트를 감독받는 금융지주회사로 재편할 수 있습니다. 밀어붙인다면 국가가 민간 기업이 중국 신용의 그만큼을 쥐도록 놔둘지 시험하는 일이 됩니다."
 CHI_semiconductor_events.334.a: "철회하고 감독을 수용한다"
 CHI_semiconductor_events.334.b: "상장을 밀어붙인다"
 CHI_semiconductor_events.335.t: "알리바바가 된 모습"
 CHI_semiconductor_events.335.d: "외국 자본, 소비자 거래, 그리고 한 민간 기업이 중국 금융의 얼마를 쥘 수 있는지에 대한 사반세기의 결정들이 알리바바가 무엇인지를 정해 놓았습니다."
 CHI_semiconductor_events.335.a: "감독받는 상거래 기간망"
 CHI_semiconductor_events.335.b: "개방된 소비자 마켓플레이스"
 CHI_semiconductor_events.335.c: "외국 자본으로 세운 무역 회사"
 CHI_semiconductor_events.335.e: "도매 수출 중개업체"
 CHI_alibaba_supervised_commerce_backbone: "감독받는 상거래 기간망"
 CHI_alibaba_supervised_commerce_backbone_desc: "중국 내 창고, 배송망, 데이터 센터가 나라가 사들이는 대부분을 실어 나르며, 그곳을 지나는 신용 위에는 규제 당국이 자리합니다. 알리바바는 누가 감독하느냐를 두고 다투기를 그만두고 대체할 수 없는 것을 만들었습니다."
 CHI_alibaba_open_consumer_marketplace: "개방된 소비자 마켓플레이스"
 CHI_alibaba_open_consumer_marketplace_desc: "누구나 상품을 올릴 수 있으며 플랫폼은 팔리는 것에서 수수료를 가져갑니다. 알리바바는 금융 부문에 대한 감독을 결코 받아들이지 않았고, 이 체제는 아무도 요구하지 않는 동안만 지속됩니다."
 CHI_alibaba_foreign_capitalised_trading_house: "외국 자본으로 세운 무역 회사"
 CHI_alibaba_foreign_capitalised_trading_house_desc: "알리바바는 무역을 운영하고 외국 주주들은 주주 명부를 운영합니다. 자본은 사업보다 더 멀리 닿았습니다."
 CHI_alibaba_wholesale_export_broker: "도매 수출 중개업체"
 CHI_alibaba_wholesale_export_broker_desc: "알리바바는 중국 공장과 외국 구매자를 연결하고 소개 수수료를 받습니다. 소비자 시장에는 발을 들인 적이 없으며 계속하는 데 누구의 허가도 필요하지 않았습니다."
 CHI_semiconductor_events.340.t: "편집자가 없는 터우탸오"
 CHI_semiconductor_events.340.d: "바이트댄스의 뉴스 애플리케이션은 편집자가 고른 것이 아니라 독자가 연 것을 기준으로 기사를 순위 매기며, 장이밍은 그 위에 편집국을 아예 두고 싶어 하지 않습니다. 기계는 어떤 편집 데스크보다 빠르게 독자를 찾아냅니다. 그러나 독자가 계속 클릭하는 것은 무엇이든 보여 줄 것이고, 언젠가 누군가는 누가 그렇게 결정했느냐고 물을 것입니다."
 CHI_semiconductor_events.340.a: "순위 시스템이 결정하도록 둔다"
 CHI_semiconductor_events.340.b: "피드 위에 편집 데스크를 둔다"
 CHI_semiconductor_events.341.t: "더우인"
 CHI_semiconductor_events.341.d: "바이트댄스는 같은 순위 시스템을 15초 영상 뒤에 놓고 낯선 사람이 다음에 볼 것을 고르게 할 수 있습니다. 모델의 어떤 부분도 텍스트 외의 용도로 만들어지지 않았습니다. 뉴스에 머무르는 것은 이미 잘 돌아가는 사업입니다."
 CHI_semiconductor_events.341.a: "순위 시스템을 숏폼 영상 뒤에 놓는다"
 CHI_semiconductor_events.341.b: "뉴스와 텍스트에 머무른다"
 CHI_semiconductor_events.342.t: "장이밍의 사과"
 CHI_semiconductor_events.342.d: "규제 당국은 네이한돤쯔를 영구 폐쇄하고 앱스토어에서 터우탸오를 내렸으며, 바이트댄스의 알고리즘이 사회주의 핵심 가치를 앞질러 달렸다고 통보했습니다. 장이밍은 자아비판문을 게시하고 국가가 기대하는 수천 명의 검수 인력을 채용할 수 있습니다. 명령에 맞서는 것은 기계의 산출물이 회사의 발언이 아니라고 주장하는 일입니다."
 CHI_semiconductor_events.342.a: "사과문을 게시하고 검수 인력을 채용한다"
 CHI_semiconductor_events.342.b: "명령에 맞선다"
 CHI_semiconductor_events.343.t: "틱톡을 팔거나 잃거나"
 CHI_semiconductor_events.343.d: "워싱턴은 바이트댄스에 틱톡의 미국 사업을 매각하라고 명령했고, 오라클과 월마트는 몇 주 만에 입찰 컨소시엄을 구성했습니다. 베이징은 방금 추천 알고리즘을 수출 통제 목록에 추가하여 허가 없이는 모델을 반출할 수 없습니다. 바이트댄스는 수출을 거부하고 미국 시장을 잃을 수도 있고, 회사와 함께 기술을 넘길 수도 있습니다."
 CHI_semiconductor_events.343.a: "알고리즘 수출을 거부한다"
 CHI_semiconductor_events.343.b: "기술과 함께 미국 사업을 매각한다"
 CHI_semiconductor_events.344.t: "매각하거나 금지되거나"
 CHI_semiconductor_events.344.d: "의회는 바이트댄스에 틱톡의 미국 사업을 매각하거나 앱스토어에서 퇴출되기까지 1년 미만의 시한을 주었으며, 남은 길은 법원뿐입니다. 소송은 상당한 비용을 치르며 회사를 하나로 유지시켜 주지만 어차피 실패할 수도 있습니다. 미국 사업을 분리하면 싸움은 끝나지만 소유권도 함께 사라집니다."
 CHI_semiconductor_events.344.a: "소송을 하며 회사를 온전히 유지한다"
 CHI_semiconductor_events.344.b: "미국 사업을 분리한다"
 CHI_semiconductor_events.345.t: "바이트댄스가 된 모습"
 CHI_semiconductor_events.345.d: "누가 피드의 순위를 매기는지, 누가 검수하는지, 모델이 중국을 떠날 수 있는지에 대한 14년간의 결정들이 바이트댄스가 무엇인지를 정해 놓았습니다."
 CHI_semiconductor_events.345.a: "자주적 추천 엔진"
 CHI_semiconductor_events.345.b: "글로벌 주목 플랫폼"
 CHI_semiconductor_events.345.c: "허가받은 정보 공공재"
 CHI_semiconductor_events.345.e: "편집 뉴스 그룹"
 CHI_bytedance_sovereign_recommendation_engine: "자주적 추천 엔진"
 CHI_bytedance_sovereign_recommendation_engine_desc: "10억 명이 다음에 무엇을 볼지 결정하는 모델은 중국에서 학습되고 중국에서 구동되며 허가 없이는 반출될 수 없습니다. 바이트댄스는 가중치를 넘기느니 미국 시장을 포기했습니다."
 CHI_bytedance_global_attention_platform: "글로벌 주목 플랫폼"
 CHI_bytedance_global_attention_platform_desc: "바이트댄스는 어떤 중국 기업도 닿은 적 없는 곳까지 뻗어 있으며, 그것도 외국 정부들이 원할 때마다 재협상하는 조건 위에서 그렇습니다. 이용자는 실재하지만 허가는 영구적이지 않습니다."
 CHI_bytedance_licensed_information_utility: "허가받은 정보 공공재"
 CHI_bytedance_licensed_information_utility_desc: "바이트댄스는 순위를 매기도록 허가받은 것만 순위를 매기고 제공하기 전에 모든 것을 검수합니다. 규제 당국은 이를 문제로 여기기를 그만두었습니다."
 CHI_bytedance_editorial_news_group: "편집 뉴스 그룹"
 CHI_bytedance_editorial_news_group_desc: "바이트댄스는 피드 위에 편집국을 유지했고 영상 플랫폼은 결코 만들지 않았습니다. 뉴스를 발행하며, 누가 순위를 정했느냐는 논쟁은 일어나지 않았습니다."
 CHI_TAI_intl_org_blockade_embargo_tt: "[TAI.GetNameWithFlag]을(를) 여전히 승인하는 모든 국가에 §Y무역 금수§!가 부과됩니다."
 CHI_taiwan_us_support_collapse_tt: "$CHI_taiwan_us_support$이(가) §Y0§!으로 붕괴합니다"
 china_sar.049.t: "보장을 철회한 워싱턴"
 china_sar.049.d: "미국은 타이베이에 안보 보장이 더 이상 유효하지 않으며 대만의 주요 비NATO 동맹국 지정도 취소되었음을 통보했습니다. 무기 이전은 중단되고, 합동 훈련은 취소되며, 연락 인력은 상징적인 수준으로 줄어듭니다. 대만은 이제 주된 안보 보증자 없이 홀로 서 있습니다."
 china_sar.049.a: "우리 스스로를 지켜야 할 것이다."
