 ELS.oligarchism_desc: ""
 ERI.anarchist_communism: "£ERI_anarchist_communism (PFDJ) - 民主与正义人民阵线"
 ERI.anarchist_communism_desc: "（厄立特里亚左翼民族主义）- 民主与正义人民阵线\n\n民主与正义人民阵线是厄立特里亚人民解放阵线的继承党。在独立战争期间，厄立特里亚人民解放阵线成为这个新兴国家政治机器中的新兴力量，轻松超越了远不那么激进的厄立特里亚解放阵线。1993年以全民投票的形式正式独立后，厄立特里亚人民解放阵线改组为合法政党，并于1994年更名为人民民主与正义阵线。"
 ERI.neutral_Social: "£ERI_neutral_social (SAGEM) - 厄立特里亚人民民主解放阵线"
 ERI.neutral_Social_desc: "（中立非洲社会主义） - 厄立特里亚人民民主解放阵线\n\n该党曾在厄立特里亚独立战争期间与厄立特里亚人民解放阵线结盟。这种关系并没有维持太久，结果厄立特里亚人民民主解放阵线被淘汰了。他们在提格雷人的提格雷人民解放阵线中拥有共同的盟友，他们在部落归属的联邦化问题上分享各自的观点，同时维持由上述部落团体的代表组成的中央政府。"
 EST.conservatism: "£EST_conservatism (I) - 祖国党"
 EST.conservatism_icon: "£EST_conservatism"
 EST.conservatism_desc: "（国家保守主义）- 祖国党\n\n祖国党是爱沙尼亚的基督教民主和民族保守党派。该党信奉社会保守和经济自由的价值观。该党还利用爱沙尼亚的民族主义，其名称意为“祖国党”。"
 EST.liberalism: "£EST_western_liberal (RE)  - 爱沙尼亚改革党"
 EST.liberalism_desc: "（自由改革主义）- 爱沙尼亚改革党\n\n改革党是一个自由派政党，俗称“松鼠党”。这是一个偏中立到中右翼的政党，经常被描述为保守自由派、自由保守派、古典自由派和自由派。他们一贯主张经济自由主义和财政保守主义政策。它是该国信奉新自由主义的主要政党，并支持几个与其他政党不同的独特政党。"
 EST.socialism: "£EST_western_social_democrat (SDE)  - 社会民主党"
 EST.socialism_desc: "（社会民主主义）- 社会民主党\n\n社会民主党是爱沙尼亚的一个中左翼政党。该党主要以社会民主主义原则为导向，是加入欧盟的积极支持者，并且极度亲西方。该党还致力于社会市场经济模式、社会正义以及在该国建立强大的福利国家。"
 EST.oligarchism: "£EST_oligarchic (EK)  - 爱沙尼亚中间党"
 EST.oligarchism_icon: "£EST_oligarchic"
 EST.oligarchism_desc: "（中间派民粹主义） - 爱沙尼亚中间党\n\n中间党是一个社会自由主义民粹主义政党，拥护支持社会市场经济的社会自由主义。它是俄语公民的主要政治堡垒，经常被描述为中间派、中左派和左翼民粹主义者。其主要目标是建立强大的中产阶级并建立左倾政策；然而，其意识形态指南针仍然根据党内个别成员而变化。"
 EST.anarchist_communism: "£EST_anarchist_communism (EVP)  - 爱沙尼亚左翼党"
 EST.anarchist_communism_desc: "（民主社会主义）- 爱沙尼亚左翼党\n\n爱沙尼亚左翼党是由前爱沙尼亚共产党成员组建的左翼社会主义政党。该党的民主社会主义政策与前爱沙尼亚共产党类似，相当一致。该党自1990年起注册为爱沙尼亚政党，并曾两次更名，但仍然是爱沙尼亚政坛的一股小力量。"
 EST.Neutral_conservatism: "£EST_neutral_conservatism (EEKD)  - 爱沙尼亚基督教民主党"
 EST.Neutral_conservatism_desc: "（基督教保守主义） - 爱沙尼亚基督教民主党\n\n爱沙尼亚基督教民主党是一个基督教保守党，反对欧洲宪法，反对爱沙尼亚加入欧盟。该党是欧洲基督教政治运动的成员。"
 EST.Neutral_green: "£EST_neutral_greens (EER)  - 爱沙尼亚绿党"
 EST.Neutral_green_desc: "（环保主义） - 爱沙尼亚绿党\n\n爱沙尼亚绿党是爱沙尼亚的绿色政党，致力于建设环保经济、树立民主价值观和经济高效的政策。该党支持以科学为基础的政策，让研究人员参与决策过程，并为制定国家政策提供客观指标。此外，该党致力于实施基于定期公投的直接民主，并支持所有部长必须拥有硕士学位。"
 EST.Nat_Autocracy: "£EST_military_junta (K) -  爱沙尼亚防卫联盟"
 EST.Nat_Autocracy_desc: "（军国主义） - 爱沙尼亚防卫联盟\n\n爱沙尼亚防卫联盟是爱沙尼亚共和国的一个自愿国防准军事组织，由国防部管理。其目的是保证爱沙尼亚国家的安全与独立以及其领土的完整。该党发挥着多种作用，例如支持扑灭野火等民事机构、志愿担任助理警察以及确保全国各地各种活动的安全。"
 EST.Nat_Fascism: "£EST_Nat_Fascism_2000 (EIP)  - 爱沙尼亚独立党"
 EST.Nat_Fascism_desc: "（爱沙尼亚民族主义） - 爱沙尼亚独立党\n\n爱沙尼亚独立党是爱沙尼亚的一个极右翼民族主义政党。该党提倡新自给自足的地缘政治空间理论，在东西方之间保持地缘政治中立。该党纲领称，爱沙尼亚拥有极其丰富的自然资源，并且极度怀疑欧洲。"
 EST.Nat_Populism: "£EST_national_populsm (RP)  - 爱沙尼亚共和国党"
 EST.Nat_Populism_desc: "（保守农业主义）- 爱沙尼亚人民联盟\n\n爱沙尼亚人民联盟是一个农业社会保守党，主要关注农业政策，具有社会民主主义和民粹主义的影响。由于该党专注于农村政策和政治，因此未能在大城市和城镇获得支持。"
 ETH.liberalism: "£ETH_western_liberal 民主正义统一党"
 ETH.liberalism_desc: ""
 ETH.anarchist_communism: "£ETH_left_wing_radical (EPRDF) - 埃塞俄比亚人民革命民主阵线"
 ETH.anarchist_communism_desc: "（多民族民族主义） -  埃塞俄比亚人民革命民主阵线\n\n与其说它是一个政党，不如说是一个政治联盟。其成员虽普遍认同\"民族联邦制\"的核心主张，但也融合了社会主义、马克思列宁主义乃至部分霍查派思想的多元色彩。\n\n在埃塞俄比亚内战期间，该阵线先后与德格军及工人党交战。随着埃塞俄比亚人民民主共和国及其执政党工人党的解体，该阵线获得了西方盟友的支持，并大幅调整其理念，转向所谓的\"革命民主\"道路。然而，许多人仍认为其马克思列宁主义的本质信仰并未改变，只是暂时掩藏了起来。"
 ETH.Neutral_conservatism: "£ETH_non_aligned_autocracy (EDP) - 埃塞俄比亚民主党"
 ETH.Neutral_conservatism_desc: "（保守自由主义） - 埃塞俄比亚民主党\n\n至少五个自由党和保守自由党合并的结果。该党起源于1974年的埃塞俄比亚民主联盟，作为君主制抵抗运动的一部分，旨在对抗社会主义埃塞俄比亚临时军政府这一军事独裁政权。"
 ETH.neutral_Social: "£generic_neutral_Social_small 埃塞俄比亚索马里人民民主党"
 ETH.neutral_Social_desc: ""
 ETH.Nat_Autocracy: "£ETH_nationalist_military_junta (ENDF) - 埃塞俄比亚国防军"
 ETH.Nat_Autocracy_desc: "（军政府） - 埃塞俄比亚国防军\n\n目前这支军队自1996年以来一直在服役，尽管军队最早的现代军事交战可以追溯到阿杜瓦战役以及随后于1907年‘正式’成立正是这支战斗部队使埃塞俄比亚得以维持在争夺非洲期间获得独立，这是唯一做到的非洲国家。"
 ETH.Monarchist: "£ETH_nationalist_monarchist (HoS) - 所罗门王朝"
 ETH.Monarchist_desc: "（君主制） - 所罗门王朝\n\n作为全球统治时间最长的王朝之一，也是非洲历史上延续最久的王朝，自127年起共统治了705年，直至1975年被强制废除。有观点认为该王朝可追溯至所罗门王本人的统治时期，因而得名；这种与圣经人物的关联性，主要促成了以加勒比地区为中心的拉斯塔法里运动的兴起。"
 FIJ.conservatism: "£FIJ_western_conservative 斐济协会党(FAP)"
 FIJ.conservatism_desc: "斐济协会党于1994年由原住民土地信托委员会主席、前财政部长何塞法塔·卡米卡米加创立。1992年议会选举后，卡米卡米加和他的五名支持者离开了西蒂维尼拉布卡的斐济政党，并试图与印度-斐济反对派建立联合政府，挑战他的总理职位，但没有成功。该党在1994年大选中赢得了五个席位，由于政治不稳定，大选提前三年举行。1996年卡米卡米加因癌症去世后，拉图·马拉（时任总统拉图· 卡米塞斯·马拉爵士的儿子）接任领导职务。1998 年，他被斐济工党前总理蒂莫西·巴瓦德拉的遗孀阿迪·库伊尼·斯皮德取代。1987年，蒂莫西·巴瓦德拉在时任陆军中校的拉布卡领导的政变中被废黜。1995年，她与已故丈夫所在的政党因新党魁马亨德拉·乔杜里的发展方向发生争执，随后于1995年退出斐济协会党。"
 FIJ.liberalism: "£FIJ_western_liberal 斐济族政治党(SVT)"
 FIJ.liberalism_desc: "斐济政党是20世纪90年代主导斐济政坛的政党，也是1992年至1999年联合政府的中流砥柱。"
 FIJ.socialism: "£FIJ_socialism 斐济工党(FLP)"
 FIJ.socialism_desc: "到了1985年，反对党全国联邦党再次分崩离析，执政联盟党的右翼政策又疏远了斐济政坛，斐济人民渴望出现第三股力量。1982年选举后不久，人们开始对政府政策表示不满，教师长期罢工，就业保障不再保障的年轻毕业生也绝食抗议。在劳资纠纷中，政府站在雇主一边。1984年11月，当政府宣布冻结工资时，斐济最大的工会斐济公共服务协会没有号召全国罢工，而是于1985年3月以2914票对326票的优势决定， 决定“与任何组织建立联系，以维护工人的权利。” 斐济工党于1985年7月6日在斐济工会代表大会的主持下在苏瓦的斐济教师协会大厅成立。"
 FIJ.Nat_Autocracy: "£FIJ_nationalist_military_junta 斐济共和国军队(RFMF)"
 FIJ.Nat_Autocracy_desc: "斐济军队有着一段坎坷的历史。自独立以来，文职政府遭遇政变，军队本身也受到野心勃勃的人士的控制，斐济共和国军事部队大量参与了岛屿政治。然而到目前为止，主要的坚持似乎是他们至少遵守了共和国宪法，问题是这种观念能持续多久。"
 FIJ.Nat_Populism: "£generic_Nat_Populism_small 民族主义者瓦努阿塔科拉沃党(NVTLP)"
 FIJ.Nat_Populism_desc: "该党于20世纪90年代末由萨基亚西·布塔德罗卡的斐济民族主义党和伊列萨·杜武洛科的瓦努阿塔科拉沃党合并而成。两位领导人都强烈反对现行宪法的通过，并在议会通过后公开焚烧了宪法。正如布塔德罗卡所说，该党的竞选纲领是“斐济属于斐济人，他们的权利在任何时候都应得到保护”。"
