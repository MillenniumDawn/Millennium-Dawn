 # Extremist Faction Foreign Policy Events
 france_md.800.t: "France Turns Against America"
 france_md.800.d: "The new French government has adopted an openly anti-American stance, rejecting cooperation with Washington and criticizing American foreign policy in harsh terms. This represents a dramatic shift in transatlantic relations. How should the United States respond to this hostile turn in Paris?"
 france_md.800.a: "Condemn this hostile policy"
 france_md.800.b: "Attempt diplomatic outreach"

 france_md.801.t: "American Diplomatic Overture"
 france_md.801.d: "Despite our anti-American stance, Washington has made diplomatic overtures, seeking to maintain some level of cooperation. The State Department appears willing to overlook our rhetoric in exchange for limited engagement. How should we respond to these American efforts?"
 france_md.801.a: "Reject American overtures entirely"
 france_md.801.b: "Consider limited cooperation"

 france_md.802.t: "France Turns Toward Russia"
 france_md.802.d: "The new French government has signaled a dramatic shift in foreign policy, seeking closer ties with Moscow while distancing itself from Washington. This represents a historic opportunity to expand Russian influence in Western Europe. How should we respond to this French realignment?"
 france_md.802.a: "Strengthen ties with France"
 france_md.802.b: "Proceed cautiously"

 france_md.803.t: "Communist Foreign Policy Consequences"
 france_md.803.d: "Our communist foreign policy has isolated us from traditional Western allies but opened doors with socialist and anti-imperialist movements worldwide. Cuba, Venezuela, and other leftist governments welcome our new orientation. However, this comes at a cost to our relations with NATO allies and traditional partners."
 france_md.803.a: "Embrace socialist solidarity"
 france_md.803.b: "Moderate our approach"

 france_md.804.t: "France Distances from NATO"
 france_md.804.d: "[FRA.GetNameWithFlag] has announced a policy of distance from NATO, echoing De Gaulle's 1966 withdrawal from the integrated command structure. The French government has emphasized 'strategic independence' and rejected subordination to American military command. How should we view this development?"
 france_md.804.a: "Express concern about alliance cohesion"
 france_md.804.b: "Remain neutral on French policy"

 france_md.805.t: "Palestine Recognition"
 france_md.805.d: "Our far-left foreign policy commits us to recognizing the State of Palestine and supporting the two-state solution. This will improve relations with Arab states and align with our anti-imperialist principles, but will damage relations with Israel and potentially the United States. Should we proceed with formal recognition?"
 france_md.805.a: "Recognize Palestine immediately"
 france_md.805.b: "Delay recognition for now"

 france_md.806.t: "France Recognizes Palestine"
 france_md.806.d: "The French government has formally recognized the State of Palestine, marking a significant shift in Parisian foreign policy. This decision aligns France with many European nations but represents a departure from the previous cautious approach. How should Israel respond to this diplomatic development?"
 france_md.806.a: "Strongly condemn French recognition"
 france_md.806.b: "Issue a measured response"

 france_md.807.t: "The Ukraine War Dilemma"
 france_md.807.d: "Russia's invasion of Ukraine presents a crisis for our pro-Russian foreign policy. Our previous alignment with Moscow is now deeply problematic as Russian tanks roll into a sovereign European nation. The political cost of maintaining neutrality is enormous, but condemning Russia would be a complete reversal. What position should France take?"
 france_md.807.a: "Condemn Russian aggression"
 france_md.807.b: "Maintain neutrality"
 france_md.807.c: "Support Russia's position"

 france_md.808.t: "French Sovereigntist Policy"
 france_md.808.d: "[FRA.GetNameWithFlag] has adopted a strongly sovereigntist stance within the European Union, blocking further integration and vetoing transfers of sovereignty to Brussels. The French government argues for a 'Europe of Nations' rather than a federal superstate. How should we respond to this French obstructionism?"
 france_md.808.a: "Oppose French obstructionism"
 france_md.808.b: "Sympathize with sovereignty concerns"

 france_md.809.t: "Non-Aligned Movement Initiative"
 france_md.809.d: "Our non-aligned foreign policy has attracted interest from other nations seeking alternatives to both American and Russian spheres of influence. We have an opportunity to position France as a leader of a new non-aligned movement, working with India, Brazil, and other major powers outside the traditional blocs."
 france_md.809.a: "Pursue non-aligned leadership"
 france_md.809.b: "Focus on domestic priorities"

 france_md.810.t: "French Strategic Independence"
 france_md.810.d: "[FRA.GetNameWithFlag] has announced a policy of complete strategic independence, refusing subordination to any foreign power and emphasizing the role of the French nuclear deterrent. This could have implications for the Franco-German partnership that has been the foundation of European cooperation. How should Germany respond?"
 france_md.810.a: "Express concern about bilateral relations"
 france_md.810.b: "Respect French sovereignty"

 france_md.811.t: "France Embraces Multipolarity"
 france_md.811.d: "The French government has announced support for a multipolar world order, rejecting American hegemony and seeking closer ties with rising powers. This represents an opportunity for China to expand influence in Europe. How should Beijing respond to this French opening?"
 france_md.811.a: "Strengthen ties with France"
 france_md.811.b: "Maintain cautious engagement"

 france_md.812.t: "France Leaves NATO"
 france_md.812.d: "We have formally withdrawn from the North Atlantic Treaty Organization, completing our break with American hegemony. France now stands alone, neither bound by Article 5 nor subject to American military command. This historic decision opens new possibilities but also new dangers. What path should France pursue?"
 france_md.812.a: "Embrace complete strategic independence"
 france_md.812.b: "Seek new alliances"

 # Extremist Foreign Policy Decisions
 FRA_extremist_foreign_policy_category: "Extremist Foreign Policy"
 FRA_extremist_foreign_policy_category_desc: "Diplomatic and foreign policy actions available to France under extremist or Gaullist governance."

 FRA_rejoin_nato_command: "Rejoin NATO Integrated Command"
 FRA_rejoin_nato_command_desc: "After distancing ourselves from NATO, we may choose to rejoin the integrated military command structure. This would restore our position within the alliance and improve relations with American and European allies."

 FRA_seek_russian_partnership: "Seek Russian Partnership"
 FRA_seek_russian_partnership_desc: "Our independent foreign policy creates an opportunity to strengthen ties with Moscow. We can pursue closer diplomatic and economic relations with Russia, though this will further strain relations with Washington."

 FRA_recognize_palestine: "Recognize Palestine"
 FRA_recognize_palestine_desc: "Our anti-imperialist foreign policy demands we recognize the State of Palestine and support the Palestinian people's right to self-determination. This will improve relations with Arab states but damage ties with Israel."

 FRA_condemn_russia_ukraine: "Condemn Russian Aggression"
 FRA_condemn_russia_ukraine_desc: "Russia's invasion of Ukraine has made our pro-Russian stance politically untenable. We can choose to condemn the aggression and distance ourselves from Moscow, though this represents a significant policy reversal."

 FRA_non_aligned_initiative: "Non-Aligned Leadership Initiative"
 FRA_non_aligned_initiative_desc: "Our non-aligned foreign policy positions France to lead a new movement of nations seeking alternatives to both American hegemony and Russian influence. We can strengthen ties with India, Brazil, and other major powers outside traditional blocs."

 FRA_socialist_solidarity: "Socialist Solidarity"
 FRA_socialist_solidarity_desc: "Our communist foreign policy calls for solidarity with socialist states worldwide. We can strengthen ties with Cuba, Venezuela, and other leftist governments, building an international network of anti-capitalist cooperation."

 FRA_veto_eu_federalization: "Veto EU Federalization"
 FRA_veto_eu_federalization_desc: "As a sovereign nation within the EU, we can use our veto power to block further federalization and transfers of sovereignty to Brussels. This defends French independence but strains relations with pro-integration member states."

 # Immigration Wave Focus
 FRA_immigration_wave: "Capitalize on Immigration Wave"
 FRA_immigration_wave_desc: "France's current liberal immigration policies have led to a significant influx of migrants. While some see this as a humanitarian necessity or economic opportunity, others view it with growing concern. The National Rally can capitalize on these sentiments, presenting itself as the defender of French identity and security. The more open our borders, the stronger the backlash we can harness."
 FRA_high_immigration_tooltip: "France must have §YOpen Borders§! or §YSlightly Regulated Immigration§! law"

 # Immigration Backlash Idea
 FRA_immigration_backlash: "Immigration Backlash"
 FRA_immigration_backlash_desc: "A wave of anti-immigration sentiment is sweeping through French society. The National Rally's messaging on immigration, security, and national identity is resonating with an increasing portion of the population, shifting the political landscape rightward and weakening support for the status quo."

 # Green Extraction Ban Focus and Idea
 FRA_end_extraction: "Restrict Resource Extraction"
 FRA_end_extraction_desc: "In pursuit of our environmental vision, we will implement strict regulations on mining operations, oil extraction, and heavy industrial activities across mainland France. This will reduce domestic resource production by approximately one-third, but represents a necessary step for environmental protection. Future governments may reverse this policy if circumstances change."

 FRA_green_extraction_ban: "Environmental Extraction Restrictions"
 FRA_green_extraction_ban_desc: "France has implemented comprehensive environmental restrictions on resource extraction. Mining operations face strict limits, oil drilling is heavily regulated, and industrial extraction must meet demanding environmental standards. While this has reduced domestic resource availability by about a third, the reduction in pollution has led to measurable health improvements - cancer rates in former industrial regions have dropped significantly, and healthcare costs are declining."

 # Decision Category and Decision for reversing extraction ban
 FRA_environmental_policy_decisions: "Environmental Policy"
 FRA_environmental_policy_decisions_desc: "Decisions related to France's environmental policies and resource extraction regulations."

 FRA_reverse_extraction_ban: "Lift Extraction Restrictions"
 FRA_reverse_extraction_ban_desc: "The environmental restrictions on resource extraction have proven economically challenging. We can lift these regulations to restore full domestic resource production, though this will anger environmental groups and reduce Green party support."

 # EU Reaction Event (960)
 france_md.960.t: "France Restricts Resource Extraction"
 france_md.960.d: "[FRA.GetNameWithFlag] has announced sweeping environmental regulations that will restrict resource extraction across mainland France. Mining operations will face strict limits, oil drilling is being heavily regulated, and industrial extraction must now meet demanding environmental standards. This will reduce French domestic resource production by roughly one-third. Environmental groups are celebrating, while industry representatives warn of economic consequences."
 france_md.960.a: "A bold step for the environment"
 france_md.960.b: "This will hurt European competitiveness"

 ###################################
 # FRENCH POLITICAL FLAVOR EVENTS #
 ###################################

 # Budget Minister Tax Scandal (900-901)
 france_md.900.t: "Budget Minister Tax Scandal"
 france_md.900.d: "A shocking revelation has emerged: our Budget Minister, the very person responsible for fighting tax fraud, has been found to have a secret foreign bank account with undeclared funds. After months of denial, the evidence has become overwhelming. The media is in a frenzy, opposition parties are demanding accountability, and public trust in the government has been severely shaken. How should we respond to this crisis?"
 france_md.900.a: "Immediate dismissal and prosecution"
 france_md.900.b: "Force resignation only"
 france_md.900.c: "Defend the minister for now"

 france_md.901.t: "Scandal Fallout: Reform Opportunity"
 france_md.901.d: "In the wake of the budget minister scandal, there are calls for comprehensive transparency reforms. A new authority to investigate and prevent corruption could be established, along with mandatory financial disclosure requirements for all elected officials. This would be expensive and time-consuming, but it might restore public faith in our institutions."
 france_md.901.a: "Implement comprehensive transparency reforms"
 france_md.901.b: "Minimal changes - this will blow over"

 # Presidential Candidate Scandal (902)
 france_md.902.t: "Presidential Candidate Employment Scandal"
 france_md.902.d: "An investigative newspaper has revealed that a leading presidential candidate allegedly paid family members substantial sums for parliamentary assistant jobs they never actually performed. The timing could not be worse - coming just months before the election. The candidate denies all wrongdoing and claims the investigation is politically motivated. The scandal threatens to upend the entire electoral landscape."
 france_md.902.a: "The candidate should withdraw from the race"
 france_md.902.b: "Continue the campaign despite the scandal"
 france_md.902.c: "Attack the media as politically biased"

 # Former President Legal Troubles (903)
 france_md.903.t: "Former President Faces Trial"
 france_md.903.d: "In an unprecedented development, a former President of the Republic has been indicted on corruption charges. The trial will mark the first time a former head of state faces criminal prosecution for acts committed during their time in office. The case has divided the nation: some see it as proof that no one is above the law, while others view it as a politically motivated witch hunt."
 france_md.903.a: "Justice must be served - no one is above the law"
 france_md.903.b: "This is a political witch hunt"

 # Yellow Vests Movement (910-912)
 france_md.910.t: "The Yellow Vests Movement"
 france_md.910.d: "What began as protests against fuel tax increases has exploded into a massive populist movement. Every Saturday, hundreds of thousands of protesters wearing yellow high-visibility vests flood the streets and block roundabouts across the country. They represent a broad coalition of citizens angry about the high cost of living, declining purchasing power, and what they see as government indifference to ordinary people's struggles. The movement has no leaders and no clear political affiliation - it represents raw popular anger."
 france_md.910.a: "Cancel the fuel tax increases"
 france_md.910.b: "Maintain the tax but increase dialogue"
 france_md.910.c: "Stand firm - the reforms are necessary"

 france_md.911.t: "Yellow Vests: Protests Escalate"
 france_md.911.d: "The protests have intensified dramatically. Clashes with police are becoming more violent, and the images of burning cars and vandalized storefronts on the Champs-Elysees are being broadcast around the world. Shops are closing, tourism is suffering, and the economy is taking a serious hit. Public opinion polls show strong support for the protesters' grievances. The government must act decisively to resolve this crisis."
 france_md.911.a: "Launch a Grand National Debate"
 france_md.911.b: "Offer major economic concessions"
 france_md.911.c: "Crack down on the protests"

 france_md.912.t: "Yellow Vests: Crisis Point"
 france_md.912.d: "France is at a breaking point. The protests have continued for months, causing billions in economic damage. Riot police are exhausted, and some are now being accused of using excessive force. The government's approval rating has collapsed. Senior advisors are warning that unless dramatic action is taken immediately, the situation could spiral out of control entirely. This may be our last chance to avoid a complete breakdown."
 france_md.912.a: "Announce a major social emergency package"
 france_md.912.b: "Declare a state of emergency"

 # Socialist Party Crisis (920)
 france_md.920.t: "Socialist Party Internal Crisis"
 france_md.920.d: "The Socialist Party is tearing itself apart. Years of declining electoral performance, ideological conflicts between traditional leftists and modernizers, and a series of scandals have left the party demoralized and divided. Some advocate returning to core socialist values, while others argue the party must modernize to remain relevant. Meanwhile, voters are defecting to both centrist and far-left alternatives."
 france_md.920.a: "Rally the party around core socialist values"
 france_md.920.b: "Accept modernization - move to the center"
 france_md.920.c: "The party splits between factions"

 # National Rally De-demonization (921-922)
 france_md.921.t: "The De-demonization Debate"
 france_md.921.d: "The National Rally faces a fundamental strategic choice. For years, the party has been treated as a pariah by mainstream politics - a 'cordon sanitaire' preventing any cooperation with it. Now, some within the party argue for softening its image, distancing itself from its most extreme elements, and presenting a more moderate face to broaden its appeal. Others insist this would be a betrayal of the party's core identity."
 france_md.921.a: "Embrace a moderate image"
 france_md.921.b: "Maintain hardline positions"
 france_md.921.c: "This sparks internal family conflict"

 france_md.922.t: "National Rally: Family Conflict"
 france_md.922.d: "The internal tensions have erupted into open family conflict. The party founder, whose controversial statements have repeatedly undermined the de-demonization strategy, has clashed publicly with the younger generation of leadership. The conflict threatens to tear the party apart at the very moment it seems poised for breakthrough success."
 france_md.922.a: "The new generation takes control"
 france_md.922.b: "The founder is expelled from the party"

 # Republican Party Alliance Crisis (923)
 france_md.923.t: "Republican Party Alliance Crisis"
 france_md.923.d: "A bombshell has hit French politics: a leader of the traditional center-right party has announced a unilateral alliance with the National Rally, breaking the decades-old 'cordon sanitaire' that kept the far-right isolated from mainstream politics. The party establishment is in uproar, with many members refusing to accept this alliance. Some are calling it pragmatic politics; others call it a betrayal of fundamental values."
 france_md.923.a: "Reject alliance with the far-right"
 france_md.923.b: "Form a tactical alliance"
 france_md.923.c: "The party splits over this decision"

 # Pension Reform Crisis (930-931)
 france_md.930.t: "Pension Reform Crisis"
 france_md.930.d: "The government has proposed raising the retirement age to address the pension system's financial sustainability. The unions have responded with fury - all eight major unions have united in opposition, an unprecedented show of solidarity. Millions have taken to the streets in the largest demonstrations France has seen in decades. Transport workers have paralyzed the country with rolling strikes. The government can back down, negotiate, or force through the reform using constitutional mechanisms."
 france_md.930.a: "Push through with Article 49.3"
 france_md.930.b: "Negotiate with the unions"
 france_md.930.c: "Withdraw the reform"

 france_md.931.t: "Pension Reform Negotiations"
 france_md.931.d: "After weeks of intense negotiations with union leaders, we have reached a critical moment. The unions have offered a compromise: a more gradual increase in the retirement age, combined with exceptions for workers in physically demanding jobs. This would achieve some savings while reducing public anger. Alternatively, we can reject their terms and face continued strikes."
 france_md.931.a: "Accept the compromise"
 france_md.931.b: "Negotiations have broken down"

 # Student Uprising (932)
 france_md.932.t: "Student and Youth Uprising"
 france_md.932.d: "Universities across France have erupted in protest. Students are occupying buildings, blocking entrances, and clashing with riot police. The immediate trigger was a controversial labor law that students see as an attack on worker protections, but their grievances run deeper - high youth unemployment, precarious job prospects, and a sense that the political system ignores their concerns. The protests evoke memories of May 1968."
 france_md.932.a: "Withdraw the controversial policy"
 france_md.932.b: "Negotiate with student unions"
 france_md.932.c: "Clear the occupied universities"

 # Election Upset (940)
 france_md.940.t: "Shocking Election Upset"
 france_md.940.d: "French politics has been rocked by an earthquake. An extremist candidate has reached the second round of the presidential election, eliminating a mainstream candidate who was favored to win. The shock has reverberated through the political establishment. Many are calling for a 'Republican Front' - a cross-party alliance to prevent the extremist from winning. But others question whether such tactical voting undermines democracy."
 france_md.940.a: "Call for a Republican Front against extremism"
 france_md.940.b: "Let voters decide without intervention"
 france_md.940.c: "This is a wake-up call for political reform"

 # New Political Movement (941)
 france_md.941.t: "A New Political Movement Emerges"
 france_md.941.d: "From seemingly nowhere, a new political movement has captured the public imagination. Led by a charismatic figure who claims to transcend the traditional left-right divide, the movement promises to break the deadlock of French politics and offer a fresh alternative to voters disillusioned with both major parties. Traditional party structures are watching nervously as their supporters consider defecting to this insurgent force."
 france_md.941.a: "Support the new movement"
 france_md.941.b: "Oppose it as a flash in the pan"
 france_md.941.c: "Traditional parties must adapt to survive"

 # Suburban Riots (950)
 france_md.950.t: "Suburban Riots"
 france_md.950.d: "Violence has erupted in the banlieues - the suburban housing projects that ring France's major cities. What began as isolated incidents after a confrontation with police has spread across the country, with thousands of cars burned and dozens of buildings damaged. The riots have exposed deep social fractures - high unemployment, discrimination, and a sense of abandonment among communities that feel left behind by French society. The government must decide how to respond."
 france_md.950.a: "Declare a state of emergency"
 france_md.950.b: "Launch integration and social programs"
 france_md.950.c: "Hardline crackdown rhetoric"

 # Terrorist Attack (949)
 france_md.949.t: "Terror Strikes France"
 france_md.949.d: "Chaos in the streets of Paris. Coordinated attacks have struck multiple locations across the city - cafes, a concert hall, the national stadium. The death toll is climbing as emergency services struggle to cope. Sirens wail through the night as France confronts its worst nightmare. The nation is in shock, and the world watches in horror."
 france_md.949.a: "France mourns..."

 # Terror Attack Response (951)
 france_md.951.t: "France's Response"
 france_md.951.d: "The initial shock has passed, but the nation's grief remains raw. Millions have gathered in solidarity - 'Je suis Paris' echoing across the globe. Now the government must decide how to respond. There are calls for enhanced security measures, a stronger military response abroad, and declarations of national emergency. But some warn that an overreaction could undermine the very values that make France what it is."
 france_md.951.a: "National unity and enhanced security"
 france_md.951.b: "Military response abroad"
 france_md.951.c: "Prioritize civil liberties concerns"

 # EU Referendum (952)
 france_md.952.t: "European Constitution Referendum"
 france_md.952.d: "A referendum on European integration has been proposed. Supporters argue that deeper integration will strengthen France's position in the world and secure economic prosperity. Opponents - spanning both left and right - argue that it undermines French sovereignty and benefits elites at the expense of ordinary citizens. The vote is too close to call, and the government must decide how actively to campaign for a 'Yes' vote."
 france_md.952.a: "Campaign vigorously for Yes"
 france_md.952.b: "Let the campaign unfold naturally"
 france_md.952.c: "Avoid risking a referendum"

 # Left Coalition (953)
 france_md.953.t: "Left-Wing Coalition Forms"
 france_md.953.d: "In response to the fractured political landscape, left-wing parties are attempting to form a unified coalition. Socialists, communists, greens, and the radical left are in negotiations to present a common front to voters. But fundamental disagreements remain - over economic policy, European integration, and foreign affairs. The coalition could transform French politics, or collapse under the weight of its contradictions."
 france_md.953.a: "Unite under pragmatic leadership"
 france_md.953.b: "Let the radical wing lead"
 france_md.953.c: "The coalition collapses over disagreements"

 # Hung Parliament (954)
 france_md.954.t: "Hung Parliament Crisis"
 france_md.954.d: "The election has produced a hung parliament, with no party or bloc able to command a majority. Government formation is proving impossible, and France risks political paralysis at a critical moment. Some are calling for a technocratic government to manage affairs, others want snap elections, and still others are proposing an unprecedented grand coalition across traditional political divides."
 france_md.954.a: "Form a technocratic government"
 france_md.954.b: "Call snap elections"
 france_md.954.c: "Attempt a grand coalition"

 ###################################
 # FRENCH POLITICAL FLAVOR IDEAS #
 ###################################

 FRA_idea_transparency_reforms: "Transparency Reforms"
 FRA_idea_transparency_reforms_desc: "In the wake of political scandals, comprehensive transparency reforms have been implemented. A new anti-corruption authority investigates wrongdoing, and all elected officials must now disclose their financial assets. These measures have begun to restore public trust in French institutions."

 FRA_idea_national_debate: "Grand National Debate"
 FRA_idea_national_debate_desc: "In response to popular discontent, the government has launched an ambitious program of citizen consultations. Town halls across France are hosting debates on taxation, public services, and democracy. This unprecedented exercise in participatory democracy is time-consuming and expensive, but may help bridge the gap between citizens and their government."

 FRA_idea_social_emergency_measures: "Social Emergency Measures"
 FRA_idea_social_emergency_measures_desc: "Facing a social crisis, the government has announced an emergency package of measures: increases to the minimum wage, tax cuts for low-income workers, and expanded social benefits. These measures have calmed popular anger, but at a significant cost to the treasury."

 FRA_idea_pension_reform_passed: "Pension Reform Passed"
 FRA_idea_pension_reform_passed_desc: "The controversial pension reform has been pushed through despite massive opposition, using constitutional mechanisms to bypass a hostile parliament. The retirement age has been raised, reducing long-term costs to the social security system. But the manner of passage has damaged public trust in the government."

 FRA_idea_pension_compromise: "Pension Reform Compromise"
 FRA_idea_pension_compromise_desc: "After difficult negotiations with unions, a compromise on pension reform has been reached. The retirement age will increase gradually, with exceptions for physically demanding jobs. This balanced approach achieves some fiscal savings while maintaining social dialogue."

 FRA_idea_political_renewal: "Political Renewal"
 FRA_idea_political_renewal_desc: "A shock to the political system has sparked a wave of renewal. New faces are entering politics, old parties are reforming, and citizens are engaging with democracy in new ways. This period of upheaval is unsettling, but it may lead to a healthier political system."

 FRA_idea_urban_renewal: "Urban Renewal Programs"
 FRA_idea_urban_renewal_desc: "Major investment is flowing into disadvantaged neighborhoods. New housing is being built, schools are being renovated, and job training programs are expanding. These long-term investments in social cohesion aim to address the root causes of urban unrest."

 FRA_idea_national_unity: "National Unity"
 FRA_idea_national_unity_desc: "In the aftermath of tragedy, France has come together in an extraordinary display of national unity. Political differences have been set aside, and citizens from all backgrounds stand shoulder to shoulder. This spirit of solidarity strengthens the nation's resolve and resilience."

 FRA_idea_technocratic_government: "Technocratic Government"
 FRA_idea_technocratic_government_desc: "With no party able to command a majority, a technocratic government of experts has been formed to manage affairs. These unelected administrators may lack democratic legitimacy, but they bring competence and freedom from partisan conflict to the task of governing."

 ###################################
 # COUNTER-TERRORISM SYSTEM #
 ###################################

 # Security Ideas
 FRA_heightened_security: "Vigipirate Plan Active"
 FRA_heightened_security_desc: "France's national security alert system, Plan Vigipirate, has been activated. Armed soldiers patrol major public spaces, security checkpoints have been established at sensitive locations, and police forces are on heightened alert. While these measures provide protection against potential attacks, they also remind citizens of the ever-present threat and carry significant costs."

 FRA_state_of_emergency_terrorism: "State of Emergency"
 FRA_state_of_emergency_terrorism_desc: "In response to severe terrorist threats, France has declared a state of emergency. Security forces have been granted expanded powers of search, detention, and surveillance. Public gatherings are restricted, and the military has been deployed to protect critical infrastructure. Civil liberties have been curtailed in the name of security, sparking debate about the balance between freedom and safety."

 FRA_terror_threat_elevated: "Elevated Terror Threat"
 FRA_terror_threat_elevated_desc: "Intelligence agencies have identified an elevated risk of terrorist attacks on French soil. Security forces are on high alert, and the public has been warned to remain vigilant. This constant state of tension affects daily life and the national psyche, as France grapples with threats both foreign and domestic."

 FRA_terror_threat_critical: "Critical Terror Threat"
 FRA_terror_threat_critical_desc: "France faces an imminent and severe terrorist threat. Multiple credible plots have been uncovered, and an attack could come at any moment. All available security resources have been mobilized, but the sheer number of potential targets makes complete protection impossible. The nation holds its breath, waiting for the storm to break."

 FRA_national_mourning: "National Mourning"
 FRA_national_mourning_desc: "France mourns the victims of a devastating terrorist attack. Flags fly at half-mast, memorial services bring communities together, and the nation reflects on its loss. In this time of grief, the French people draw strength from their shared values and their determination to overcome adversity."

 FRA_damaged_infrastructure: "Damaged Critical Infrastructure"
 FRA_damaged_infrastructure_desc: "Terrorist attacks have damaged critical French infrastructure. Repairs are underway, but the disruption affects transportation, energy, and communications. The visible scars of violence serve as a painful reminder of the nation's vulnerability and the need for continued vigilance."

 FRA_tourism_crisis: "Tourism Crisis"
 FRA_tourism_crisis_desc: "In the aftermath of terrorist attacks, France's crucial tourism industry has suffered a devastating blow. Visitors are canceling trips, hotels stand empty, and businesses that depend on tourism face ruin. Recovery will require not just time, but active efforts to reassure the world that France remains a safe destination."

 # Terrorist Attack Events
 france_md.970.t: "Metro Bombing"
 france_md.970.d: "A devastating explosion has rocked the Paris Metro during the morning rush hour. The blast, which occurred at a major interchange station, has killed dozens and injured hundreds. Chaos reigns as emergency services struggle to reach the scene through the underground tunnels. This is the nightmare scenario security forces have long feared - a soft target with thousands of daily commuters, struck without warning."
 france_md.970.a: "Mobilize emergency response"
 france_md.970.b: "Declare a day of national mourning"
 france_md.970.c: "Keep the city running and refuse emergency powers"

 france_md.971.t: "Police Station Attack"
 france_md.971.d: "A coordinated attack has struck a major police station in the Paris suburbs. Gunmen armed with automatic weapons and explosives fought a prolonged battle with police officers before being neutralized. Several officers have been killed or wounded, and the station itself has suffered significant damage. This brazen assault on the forces of order sends a chilling message about the terrorists' capabilities and intentions."
 france_md.971.a: "Launch immediate manhunt for accomplices"
 france_md.971.b: "Increase security at all police facilities"

 france_md.972.t: "Mass Casualty Attack"
 france_md.972.d: "Horror has struck at a crowded public gathering. Multiple attackers, armed with assault rifles and suicide vests, have killed over a hundred people in a coordinated assault. The death toll continues to rise as victims succumb to their wounds. France is in shock - this is the deadliest attack on French soil since the Second World War. The world watches in horror as the City of Light is plunged into darkness."
 france_md.972.a: "Declare national state of emergency"
 france_md.972.b: "Appeal for international solidarity"
 france_md.972.c: "Intensify military operations against terrorists abroad"

 france_md.973.t: "Attack on the Louvre"
 france_md.973.d: "The unthinkable has happened - terrorists have attacked the Louvre, the world's most famous museum. Explosions and gunfire have shattered the peace of the Tuileries Garden, and attackers have penetrated the museum itself. Priceless artworks, including some of humanity's greatest treasures, are at risk. The attack strikes not just at France, but at the cultural heritage of all civilization."
 france_md.973.a: "Priority is civilian lives - secure the building"
 france_md.973.b: "Protect the irreplaceable artwork at all costs"

 france_md.974.t: "Military Base Infiltration"
 france_md.974.d: "A sophisticated attack has targeted a French military installation. Terrorists, demonstrating alarming insider knowledge, have breached the perimeter and engaged military personnel in combat. While the base is now secured, the implications are grave - how did the attackers obtain such detailed intelligence? An investigation into security breaches and possible infiltration of the armed forces has begun."
 france_md.974.a: "Launch comprehensive security review"
 france_md.974.b: "Conduct internal counter-intelligence sweep"

 france_md.975.t: "Siege of the Eiffel Tower"
 france_md.975.d: "In the most audacious terrorist attack in French history, armed militants have seized control of the Eiffel Tower. Hundreds of tourists and staff are being held hostage at the top of the tower, and the attackers have threatened to destroy the iconic monument unless their demands are met. The eyes of the world are fixed on Paris as France faces an impossible choice - and the tower that symbolizes the nation hangs in the balance."
 france_md.975.a: "Deploy GIGN tactical units for rescue operation"
 france_md.975.b: "Negotiate to buy time"
 france_md.975.c: "Refuse all demands - no negotiation with terrorists"

 france_md.976.t: "Nuclear Facility Threat"
 france_md.976.d: "The nightmare scenario has come to pass - terrorists have launched an assault on a French nuclear power plant. While the reactor itself appears secured, attackers have taken control of administrative buildings and are threatening to cause a catastrophic incident. The potential for a nuclear disaster that could contaminate all of Europe has the world holding its breath. Every resource of the French state must now be mobilized to prevent catastrophe."
 france_md.976.a: "Emergency reactor shutdown and GIGN deployment"
 france_md.976.b: "Military assault with maximum force"

 # Global News Events
 france_md.980.t: "Mass Casualty Attack in France"
 france_md.980.d: "The world reacts in horror to news of a devastating terrorist attack in France. Over a hundred people have been killed in coordinated assaults, making this one of the deadliest terrorist incidents in European history. World leaders have expressed their condolences and solidarity with France, while security forces across the globe review their own vulnerabilities."
 france_md.980.a: "We stand with France"

 france_md.981.t: "Louvre Museum Under Attack"
 france_md.981.d: "Shocking footage from Paris shows the Louvre Museum, home to priceless treasures including the Mona Lisa, under terrorist attack. The assault on this symbol of human civilization has sparked outrage worldwide. Art institutions around the globe are reviewing their security, and many question whether any cultural site can truly be protected against determined attackers."
 france_md.981.a: "Offer assistance to France"

 france_md.982.t: "Hostage Crisis at Eiffel Tower"
 france_md.982.d: "The world watches in disbelief as terrorists hold the Eiffel Tower and hundreds of hostages. The iconic symbol of France and Paris has become the setting for a terrifying standoff. Television networks around the globe carry live coverage as French special forces prepare for a potential rescue operation. The outcome of this crisis will shape the future of counter-terrorism for years to come."
 france_md.982.a: "Our thoughts are with the hostages"

 france_md.983.t: "French Nuclear Plant Under Attack"
 france_md.983.d: "Emergency alerts have been issued across Europe as terrorists attack a French nuclear facility. While authorities insist there is no immediate radiation risk, the potential for a Chernobyl-scale disaster has sent shockwaves across the continent. Governments are preparing contingency plans, and populations near the facility have been ordered to shelter in place."
 france_md.983.a: "Prepare emergency response plans"

 # Intelligence Success Event
 france_md.985.t: "Terror Plot Foiled"
 france_md.985.d: "French intelligence services have successfully disrupted a major terrorist plot. Months of surveillance, undercover operations, and international cooperation led to coordinated raids that captured the plotters before they could strike. The details remain classified, but sources indicate the planned attack could have been catastrophic. This success validates the heavy investment in counter-terrorism capabilities."
 france_md.985.a: "Commend the intelligence services"
 france_md.985.b: "Maintain heightened security"

 # Decision Category
 FRA_counter_terrorism_category: "Counter-Terrorism Operations"
 FRA_french_communism_expansionism_decision_category: "The War Against Capitalism"
 FRA_3rd_empire_decision_category: "Expand the Third Empire"
 FRA_LFI6th_decision_category: "The Dawn of a new Republic"
 FRA_french_socialist_downfall_decision_category: "The Fall of Socialism"
 FRA_frexit_decision_category: "Leaving the European Union"
 FRA_royalist_expansion_decision_category: "The Reconquest"
 FRA_EU_assistance_decision_category: "European Economical Partnership"
 FRA_GREEN_EU_assistance_decision_category: "The European Ecological Transition"

 # Decision Names and Descriptions
 FRA_activate_vigipirate: "Activate Vigipirate"
 FRA_activate_vigipirate_desc: "Activate France's national security alert system, deploying armed soldiers to patrol public spaces and increasing security at sensitive locations. This provides protection against terrorist attacks but carries ongoing costs."

 FRA_declare_state_of_emergency: "Declare State of Emergency"
 FRA_declare_state_of_emergency_desc: "In response to the critical terrorist threat, declare a national state of emergency. This grants security forces expanded powers but suspends certain civil liberties."

 FRA_end_state_of_emergency: "End State of Emergency"
 FRA_end_state_of_emergency_desc: "With the immediate threat reduced, end the state of emergency and restore normal civil liberties. This will help normalize daily life and reduce political tensions."

 FRA_intelligence_surge: "Intelligence Surge"
 FRA_intelligence_surge_desc: "Significantly increase funding and resources for intelligence services to improve surveillance capabilities and counter-terrorism operations. This enables proactive operations against terrorist networks."

 FRA_secure_critical_infrastructure: "Secure Critical Infrastructure"
 FRA_secure_critical_infrastructure_desc: "Invest in hardening critical infrastructure - power plants, transportation hubs, telecommunications - against terrorist attacks. This is expensive but reduces vulnerability to major attacks."

 FRA_operation_sentinelle: "Operation Sentinelle"
 FRA_operation_sentinelle_desc: "Deploy thousands of soldiers for domestic security duties, patrolling streets, protecting sensitive sites, and supporting police operations. This visible military presence reassures the public but strains armed forces."

 FRA_anti_terror_raid: "Conduct Anti-Terror Raid"
 FRA_anti_terror_raid_desc: "Based on intelligence gathered, conduct raids against suspected terrorist cells. Success could disrupt planned attacks and reduce the overall threat level."

 FRA_terrorism_defeated: "Declare Victory Over Terrorism"
 FRA_terrorism_defeated_desc: "With stability restored and no recent attacks, formally declare that the terrorist threat has been neutralized. This provides a morale boost and allows the nation to move forward."

 FRA_rebuild_after_attack: "Rebuild Damaged Infrastructure"
 FRA_rebuild_after_attack_desc: "Invest in repairing infrastructure damaged by terrorist attacks. Restoring these facilities is essential for returning to normal life and demonstrating resilience."

 FRA_tourism_recovery_campaign: "Tourism Recovery Campaign"
 FRA_tourism_recovery_campaign_desc: "Launch a major international campaign to promote France as a safe tourist destination. Restoring tourism is vital for the economy and demonstrates that terrorists cannot destroy the French way of life."

 FRA_6threp_mission: "Popular Enthusiasm"
 FRA_6threp_mission_desc: "Our commitment to reforming the political system has made a lot of people happy. Many people want change, but we must not be seen as those who are trying to delay the process."

 FRA_rally_support: "Display our Progress"
 FRA_rally_support_desc: "Our opponents are trying to slow the process down and question every single change we make. But we must stand firm. We have accomplished a lot and we have to show it."

 FRA_rally_ennemy: "The Opposition Criticising Our Reforms"
 FRA_rally_ennemy_desc: "Whilst these changes are essential, they do not always go down well with everyone. Our opposition is doing everything in its power to criticise every decision concerning the future of our Republic."

 FRA_timebomb_mission: "The Inevitable Divorce"
 FRA_timebomb_mission_desc: "The two main factions within the Socialist Party are threatening to leave the party if we do not resolve the situation. We must show them that there is a future with the Socialist Party before it is too late."

 FRA_support_decrease_mission: "Our Party is Splitting"
 FRA_support_decrease_mission_desc: "The longer we delay in reassuring our party members, the more of them will leave us to join groups that are closer to their ideologies. We must rectify the situation quickly."

 FRA_campaign_against_extremism: "Campaigning Against Extremism"
 FRA_campaign_against_extremism_desc: "In these troubled times, we must remind the left and the centre that we the socialists are the right choice against the political extremism that is rising."

 FRA_campaign_clash_traitors: "Retaliate Against Party Traitors"
 FRA_campaign_clash_traitors_desc: "Anyone who leaves us for a more fashionable party should expect us to expose them in the media. They are nothing but opportunists and agents of chaos."

 FRA_boost_eurosceptism: "Campaign Against the European Union"
 FRA_boost_eurosceptism_desc: "From public debates to street posters, our whole society must exude Euroscepticism. We must make the French people understand that European bureaucrats are the cause of all our problems."

 FRA_disobey_treaties: "Breaching the European Treaties"
 FRA_disobey_treaties_desc: "We must no longer bow to these stupid laws. We are masters in our own house, and in any case it is only a matter of time before we leave the European Union."

 FRA_denounce_eu_policies: "Exposing European Policy"
 FRA_denounce_eu_policies_desc: "We must focus our protest on the unjust laws that come out of the European Parliament without us being able to oppose them. What's the point of voting in an election if the result no longer really depends on us?"

 FRA_threaten_media: "Threaten pro-European media"
 FRA_threaten_media_desc: "Pro-European sentiment has infiltrated our institutions, right down to the media. We should remind these pen-pushers to stick to topics more suited to their level,and to stop going against the grain."

 FRA_red_benelux: "Liberate the Benelux"
 FRA_red_benelux_desc: "We have to liberate the Benelux of Capitalism and European liberalism"

 FRA_benelux_boost: "Integrate the cultures of the Benelux"
 FRA_benelux_boost_desc: "Workers of the world, unite!"

 FRA_done_with_dumping: "The End of Tax Havens"
 FRA_done_with_dumping_desc: "The very existence of these countries, which devote their existence to acting as tax havens, is an affront to the very concept of equality and solidarity. We must put an end to this."

 FRA_dumping_boost: "Integrate the Swiss Culture"
 FRA_dumping_boost_desc: "Workers of the world, unite!"

 FRA_red_iberia: "Never Another Dictaror"
 FRA_red_iberia_desc: "We must ensure that our southern flank does not fall back under the influence of fascism."

 FRA_iberia_boost: "Integrate Iberian Cultures"
 FRA_iberia_boost_desc: "Workers of the world, unite!"

 FRA_ciao_bella: "Ciao Bella"
 FRA_ciao_bella_desc: "The Communist Revolution failed in Italy, but it left a lasting impression on the Italian people. It is time to right the wrongs of the past."

 FRA_italy_boost: "Integrate The Italian Culture"
 FRA_italy_boost_desc: "Workers of the world, unite!"

 FRA_avenge_long_knife: "The Night of the Long Sickles"
 FRA_avenge_long_knife_desc: "We must bring about a revolution in the Germanic states to free them from capitalism and prevent nationalism from triumphing once again."

 FRA_ger_aus_boost: "Integrate Germanic Cultures"
 FRA_ger_aus_boost_desc: "Workers of the world, unite!"

 FRA_ostalgia: "Bring Back the Revolution to Eastern Europe"
 FRA_ostalgia_desc: "The countries of Eastern Europe suffered greatly under Soviet occupation. We must show them that communism has its good points too."

 FRA_ostalgia_boost: "Integrate the cultures of Eastern Europe"
 FRA_ostalgia_boost_desc: "Workers of the world, unite!"

 FRA_birthplace_revolution: "Reclaim the Birthplace of Communism"
 FRA_birthplace_revolution_desc: "We must bring the revolution back to the Russians who have forgotten the past glory of communism."

 FRA_birthplace_boost: "Integrate Slavic Cultures"
 FRA_birthplace_boost_desc: "Workers of the world, unite!"

 FRA_no_more_neutrality: "Break the Northern Neutrality"
 FRA_no_more_neutrality_desc: "The countries of Northern Europe have for too long avoided choosing between socialism and capitalism. It is time for them to make that choice."

 FRA_neutrality_boost: "Integrate Nordic Cultures"
 FRA_neutrality_boost_desc: "Workers of the world, unite!"

 FRA_cold_war2: "No More Cold War"
 FRA_cold_war2_desc: "We are going to avenge the USSR and the collapse of the Warsaw Pact by destroying what remains of NATO."

 FRA_cold_war_boost: "Integrate English Cultures"
 FRA_cold_war_boost_desc: "Workers of the world, unite!"

 FRA_red_Europe: "Complete the European Revolution"
 FRA_red_Europe_desc: "We are going to bring the revolution to the whole of Europe, which is still under the oppression of the capitalists."

 FRA_red_victory: "Triumph of the European Revolution"
 FRA_red_victory_desc: "We have freed the European states from the shackles of capitalism. This is a great victory for the revolution."

 FRA_annex_puppet_napo: "Enforce Our Claims"
 FRA_annex_puppet_napo_desc: "One of our dependencies has a territory that we are laying claim to. It is time for that territory to be returned to us."

 FRA_reunionism: "Realise Reunionism"
 FRA_reunionism_desc: "It is time to bring together the people of French culture. And this time, for good."

 FRA_Never_another_guerilla: "Secure the South West"
 FRA_Never_another_guerilla_desc: "We're heading east, so we need to make sure no one comes up behind us. This time there'll be no guerrilla warfare because we'll crush any resistance."

 FRA_Avenge_Sedan: "Avenge Sedan"
 FRA_Avenge_Sedan_desc: "It was the rise of the German Empire that brought an end to the former French Empire. We must avenge this outrage and reclaim our natural borders."

 FRA_natural_border: "Integrate the Natural Borders"
 FRA_natural_border_desc: "The people of the conquered territories eventually came to accept the new reality. The Rhine forms the border of France."

 FRA_crush_coalition: "Secure Central Europe"
 FRA_crush_coalition_desc: "These territories will be crucial to the long march towards Moscow that is currently being prepared."

 FRA_napoleon_empire: "Integrate the Napoleonic Empire"
 FRA_napoleon_empire_desc: "The people of the conquered territories eventually came to accept the new reality. They are now full citizens of the Third French Empire."

 FRA_prepare_russia: "Unify Eastern Europe"
 FRA_prepare_russia_desc: "Our invasion of Russia is imminent; we must ensure the safety of our allies and prepare them for a high-intensity conflict with Russia."

 FRA_2nd_empire_colonies: "Recover the Colonial Empire"
 FRA_2nd_empire_colonies_desc: "We shall complete what Napoleon II and the Third Republic began. We shall build a stable colonial empire."

 FRA_no_more_berezina: "Operation Tislit"
 FRA_no_more_berezina_desc: "The time has come to destroy the Russian Empire once and for all. This time, they won't have time to burn Moscow."

 FRA_the_Foe: "End the Perfidious Albion"
 FRA_the_Foe_desc: "We are going to break this continental blockade once and for all. The Revolution's number one enemy will fall."

 FRA_new_order: "Proclaim the New European Order"
 FRA_new_order_desc: "Our dominance over the continent is assured. We have united Europe under our Empire. A new chapter in European history is beginning."

 FRA_Expansion_policy: "Choose Our Expansion Policy"
 FRA_Expansion_policy_desc: "The new Frankish Kingdom must set itself a goal of conquest."

 FRA_operation_clovis: "Operation Clovis"
 FRA_operation_clovis_desc: "We shall reclaim the cradle of Frankish civilisation from the so-called Benelux states."

 FRA_operation_bouvines: "Operation Bouvines"
 FRA_operation_bouvines_desc: "For the Frankish Empire to come into being, the Holy Roman Empire must fall once more."

 FRA_operation_marignan: "Operation Marignan"
 FRA_operation_marignan_desc: "We must reconquer the Italian peninsula. To regain control of the seat of the Catholic Church. Only the Pope in Rome will be able to crown us Emperor."

 FRA_operation_roland: "Operation Roland"
 FRA_operation_roland_desc: "The rearguard will not fall again."

 FRA_unite_frank_europe: "Unify the Frankish People"
 FRA_unite_frank_europe_desc: "We have reintegrated all the peoples who, like us, are descended from the Franks. This is a great day for the Frankish nation."

 FRA_frankish_empire: "Integrate the Frankish Empire"
 FRA_frankish_empire_desc: "The Frankish Empire has been reunified. The injustice of the Treaty of Verdun has been redressed."

 FRA_annex_puppet_king: "Enforce Our Claims"
 FRA_annex_puppet_king_desc: "One of our dependencies has a territory that we are laying claim to. It is time for that territory to be returned to us."

 FRA_glacis: "Break Through the Glacis"
 FRA_glacis_desc: "The Eastern countries stand between us and our destiny. We must unite the West behind our banner."

 FRA_a_war_for_europe: "The War for Europe"
 FRA_a_war_for_europe_desc: "The powers of Western Europe and Russia have always vied for control of Europe. It is time to put an end to this dispute and unify the West."

 FRA_operation_hastings: "Operation Hastings"
 FRA_operation_hastings_desc: "It is time to put an end to a rivalry that has shaped history. I promise you this one won't last one hundred years."

 FRA_king_europe_victory: "Proclaim Victory in Europe"
 FRA_king_europe_victory_desc: "Our enemies are no more. We are the only European power still standing. The West will have to rally behind us."

 FRA_recover_7_year_war_charlemagne: "Reclaim the Kingdom's colonies"
 FRA_recover_7_year_war_charlemagne_desc: "Europe is secure. Now we can regain control of the colonies that were taken from us."

 FRA_start_crusade: "Secure the Mediterranean"
 FRA_start_crusade_desc: "In order for the crusade to set out for the Holy Land, we need to gain control of the islands along our route. Our supply chain must be secured."

 FRA_crusade_siege: "A Foothold in the Holy Land"
 FRA_crusade_siege_desc: "Reclaiming the Holy Land by launching a head-on attack against its occupiers will require us to commit all our forces. We must ensure that we can deploy them in the vicinity."

 FRA_claim_jerusalem: "Reclaim the Holy Land"
 FRA_claim_jerusalem_desc: "The time has come to recapture Jerusalem and the Holy Land. The Tenth Crusade has achieved its goal."

 FRA_revenge_over_saladin: "Ensure Stability in the Middle East"
 FRA_revenge_over_saladin_desc: "We must stabilise the region by crushing each of its regional powers, whose conflicts are destabilising it."

 FRA_king_crusade1_victory: "Proclaim the Triumph of the Tenth Crusade"
 FRA_king_crusade1_victory_desc: "We have recaptured the Holy Land."

 FRA_kingdom_heaven: "Proclaim the Kingdom of Jerusalem"
 FRA_kingdom_heaven_desc: "The Kindgom of Jerusalem shall rise again"

 FRA_rally_frank: "Protect the Franks"
 FRA_rally_frank_desc: "Europe will soon be the scene of a new war. In these circumstances, we must ensure that our Frankish brothers do not fall victim to it."

 FRA_unite_frank: "Reintegreat the Franks"
 FRA_unite_frank_desc: "We have reintegrated all the peoples who, like us, are descended from the Franks. This is a great day for the Frankish nation."

 FRA_noah_ark: "Rally the Catholic Nations"
 FRA_noah_ark_desc: "We shall unite the Catholic Nations of Europe under our banner."

 FRA_war_against_protestantism: "The War Against Protestantism"
 FRA_war_against_protestantism_desc: "9th time the charm..."

 FRA_end_the_schism: "There Can Only be One"
 FRA_end_the_schism_desc: "We must take on all the Orthodox nations of Europe by becoming the guardians of Europe. The Church will be safe forever."

 FRA_king_crusade2_victory: "Proclaim Total Victory of the Church"
 FRA_king_crusade2_victory_desc: "We reign supreme over Europe"

 FRA_recover_7_year_war_holy: "Reclaim the Kingdom's colonies"
 FRA_recover_7_year_war_holy_desc: "Our enemies are no more. We are the only European power still standing. The West will have to rally behind us."

