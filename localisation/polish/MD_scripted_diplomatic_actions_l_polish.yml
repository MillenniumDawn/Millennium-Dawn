 REVOKE_MIL_SPY_ACCESS_ACCEPTED_DESC: "Odwołują dostęp do swojego wojskowego systemu satelitarnego rozpoznania."
 REQUEST_CIV_SPY_ACCESS_TITLE: "Cywilny dostęp do SPYSATU"
 REQUEST_CIV_SPY_ACCESS_ACTION_DESC: "Prośba o dostęp integracyjny do ich cywilnego systemu satelitów rozpoznawczych w celu zwiększenia możliwości obserwacji i monitorowania Ziemi. Obejmuje to standardowe umowy o wymianie zobrazowań, koordynację technicznych formatów danych oraz ustanowienie protokołów pobierania danych dla naszych systemów analitycznych. Uzyskanie takiego dostępu pozwala na usprawnienie monitoringu środowiska, planowanie reagowania kryzysowego oraz ocenę infrastruktury. W przypadku akceptacji uzyskają oni dostęp do naszej §YCywilnej sieci satelitów szpiegowskich SPYSAT§!."
