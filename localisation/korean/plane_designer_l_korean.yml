 small_plane_airframe: "경전투기"
 small_plane_airframe_desc: "제작 비용이 저렴하고 운용 유지비가 적게 드는 경전투기는 산업 기반이 없는 국가들에게 더 낮은 비용으로 공중 우세를 확보할 수 있는 옵션을 제공합니다. 전용 공중우세기를 상대로는 제 성능을 발휘하지 못하겠지만, 대규모로 운용될 경우 이 가벼운 항공기들은 심각한 위협이 됩니다."
 small_plane_strike_airframe: "경 다목적 전투기"
 small_plane_strike_airframe_desc: "신속히 침투해 목표를 타격하고 지역을 이탈하도록 설계된 저렴한 타격기입니다. 이 전투기는 진정한 다목적 전투기보다 훨씬 저렴합니다."
 small_plane_cas_airframe: "경 근접항공지원기"
 small_plane_cas_airframe_desc: "긴 체공 시간을 갖춘 저렴한 항공기로 설계된 이 경항공기는 지상군에 근접 항공 지원을 제공할 수 있지만, 낮은 생산 품질로 인해 치열한 분쟁 공역에서는 큰 타격을 입습니다."
 small_plane_naval_bomber_airframe: "경뇌격기"
 small_plane_naval_bomber_airframe_desc: "이 항공기는 적 수상함과 잠수함을 추적해 격침하도록 설계되었으나, 초계 항속 거리가 극히 제한적이며 주로 알려진 목표에 대한 제한적 타격에 사용됩니다."
 small_plane_suicide_airframe: "드론"
 small_plane_suicide_airframe_desc: "무인 전투 항공기는 조종사를 전투 위험에 노출시키지 않고도 공군이 전투 작전을 수행할 수 있게 합니다."
 cv_small_plane_airframe: "함재 경전투기"
 cv_small_plane_airframe_desc: "제작 비용이 저렴하고 운용 유지비가 적게 드는 경전투기는 산업 기반이 없는 국가들에게 더 낮은 비용으로 공중 우세를 확보할 수 있는 옵션을 제공합니다. 전용 공중우세기를 상대로는 제 성능을 발휘하지 못하겠지만, 대규모로 운용될 경우 이 가벼운 항공기들은 심각한 위협이 됩니다."
 cv_small_plane_strike_airframe: "함재 경 타격 전투기"
 cv_small_plane_strike_airframe_desc: "신속히 침투해 목표를 타격하고 지역을 이탈하도록 설계된 저렴한 타격기입니다. 이 전투기는 진정한 다목적 전투기보다 훨씬 저렴합니다."
 cv_small_plane_cas_airframe: "함재 경 근접항공지원기"
 cv_small_plane_cas_airframe_desc: "긴 체공 시간을 갖춘 저렴한 항공기로 설계된 이 경항공기는 지상군에 근접 항공 지원을 제공할 수 있지만, 낮은 생산 품질로 인해 치열한 분쟁 공역에서는 큰 타격을 입습니다."
 cv_small_plane_naval_bomber_airframe: "함재 경뇌격기"
 cv_small_plane_naval_bomber_airframe_desc: "이 항공기는 적 수상함과 잠수함을 추적해 격침하도록 설계되었으나, 초계 항속 거리가 극히 제한적이며 주로 알려진 목표에 대한 제한적 타격에 사용됩니다."
 cv_small_plane_suicide_airframe: "함재 드론"
 cv_small_plane_suicide_airframe_desc: "무인 전투 항공기는 조종사를 전투 위험에 노출시키지 않고도 공군이 전투 작전을 수행할 수 있게 합니다."
 medium_plane_airframe: "다목적 전투기"
 medium_plane_airframe_desc: "모든 현대 공군의 중추인 이 범용 항공기는 다양한 임무를 수행할 수 있지만 어느 한 분야에서 특출나지는 않습니다. 전문 항공기보다 저렴하지만, 효과적으로 운용하려면 상당한 훈련과 병참 지원이 필요합니다."
 medium_plane_suicide_airframe: "자폭 드론"
 medium_plane_suicide_airframe_desc: "자폭 드론은 조종사를 위험에 빠뜨리지 않고 목표를 타격하는 인기 있는 선택지가 되었습니다. 공격할 때마다 기체 전체를 희생하지만, 이 드론은 기존 탄약에 비해 더 큰 탄두와 더 높은 정밀도를 제공합니다."
 medium_plane_fighter_airframe: "공중우세기"
 medium_plane_fighter_airframe_desc: "제공권 확보를 위해 설계된 이 항공기는 적 항공기와 교전하고 격파하는 데 뛰어나 하늘의 통제권을 보장합니다. 그 전문성은 지상 공격 능력을 희생한 대가입니다."
 medium_plane_cas_airframe: "근접항공지원기"
 medium_plane_cas_airframe_desc: "전장 지상 공격 전용 항공기로, 아군 지상군을 지원하기 위해 전장의 목표에 대량의 폭장을 투하하도록 설계되었습니다."
 medium_plane_maritime_patrol_airframe: "해상 초계기"
 medium_plane_maritime_patrol_airframe_desc: "적 잠수함을 탐색하고 파괴하도록 설계된 중거리 해상 초계기로, 기뢰 부설과 기뢰 소해 작전도 수행할 수 있습니다."
 medium_plane_air_transport_airframe: "중형 수송기"
 medium_plane_air_transport_airframe_desc: "중거리에서 공수부대와 화물에 대한 항공 수송 지원을 제공할 수 있는 중형 수송기입니다."
 cv_medium_plane_airframe: "함재 다목적 전투기"
 cv_medium_plane_airframe_desc: "모든 현대 항모 항공단의 중추인 이 범용 항공기는 제공권 확보부터 지상 공격까지 다양한 임무를 수행할 수 있습니다. 어느 한 분야에서 특출나지는 않지만 그 유연성 덕분에 매우 귀중합니다. 생산 비용이 어느 정도 들며 해상에서 효과적으로 운용하려면 광범위한 훈련과 탄탄한 병참이 필요합니다."
 cv_medium_plane_fighter_airframe: "함재 공중우세기"
 cv_medium_plane_fighter_airframe_desc: "제공권 확보를 위해 설계된 이 항공기는 적 항공기와 교전하고 격파하는 데 뛰어나 하늘의 통제권을 보장합니다. 그 전문성은 지상 공격 능력을 희생한 대가입니다."
 cv_medium_plane_cas_airframe: "함재 근접항공지원기"
 cv_medium_plane_cas_airframe_desc: "전장 지상 공격 전용 항공기로, 아군 지상군을 지원하기 위해 전장의 목표에 대량의 폭장을 투하하도록 설계되었습니다."
 cv_medium_plane_maritime_patrol_airframe: "함재 해상 초계기"
 cv_medium_plane_maritime_patrol_airframe_desc: "적 잠수함을 탐색하고 파괴하도록 설계된 중거리 해상 초계기로, 기뢰 부설과 기뢰 소해 작전도 수행할 수 있습니다."
 cv_medium_plane_air_transport_airframe: "함재 수송기"
 cv_medium_plane_air_transport_airframe_desc: "중거리에서 공수부대와 화물에 대한 항공 수송 지원을 제공할 수 있는 중형 수송기입니다."
 cv_medium_plane_scout_airframe: "함재 공중조기경보통제기"
 cv_medium_plane_scout_airframe_desc: "공중 지휘통제 항공기로, 전투기에 공중 정찰 지원과 공중 통제를 제공하여 제공권 임무의 전력 승수 효과를 냅니다."
 large_plane_airframe: "전략폭격기"
 large_plane_airframe_desc: "전략 목표에 대량의 폭장을 투하하기 위한 대형 대용량 폭격기로, 핵 운반 능력과 순항 미사일 타격 능력을 포함합니다."
 large_plane_cas_airframe: "건쉽"
 large_plane_cas_airframe_desc: "적 항공기와 지대공 미사일에 극도로 취약하지만, 분쟁이 없는 공역에서는 이 항공기가 다양한 정밀 무기로 전투 중인 지상군에 상당한 규모의 정밀 항공 지원을 제공합니다."
 large_plane_awacs_airframe: "공중조기경보통제기"
 large_plane_awacs_airframe_desc: "공중 지휘통제 항공기로, 전투기에 공중 정찰 지원과 공중 통제를 제공하여 제공권 임무의 전력 승수 효과를 냅니다."
 large_plane_air_transport_airframe: "중수송기"
 large_plane_air_transport_airframe_desc: "공수부대와 항공 보급 임무를 위한 장거리 항공 수송 능력을 제공할 수 있는 대형 수송기입니다."
 large_plane_maritime_patrol_airframe: "장거리 해상 초계기"
 large_plane_maritime_patrol_airframe_desc: "훨씬 넓은 해역을 담당하여 적 해군 전력과 잠수함을 탐색하고 격침할 수 있는 장거리 해상 초계기입니다."
