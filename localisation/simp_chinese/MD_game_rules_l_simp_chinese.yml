 RULE_OPTION_RISE_OF_BOKO_HARAM: "博科圣地的崛起"
 RULE_OPTION_RISE_OF_BOKO_HARAM_AI_DESC: "迫使尼日利亚允许博科圣地组织控制全国。"
 RULE_OPTION_PDP_EMPOWERED: "人民民主党"
 RULE_OPTION_PDP_EMPOWERED_AI_DESC: "人民民主党是尼日利亚最大的政党之一。它的主要主张基督教是宗教信仰的终结，秉持着不结盟精神。"
 RULE_OPTION_ANPP_EMPOWERED: "全尼日利亚人民党"
 RULE_OPTION_ANPP_EMPOWERED_AI_DESC: "在2000年，全尼日利亚人民党（在2013年并入全体进步大会党）是尼日利亚主要的反对党。必须指明的是，他们与欧洲的社会民主主义非常相似，并推动了尼日利亚的重大改革。"
 FRA_AI_BEHAVIOR_MD: "@FRA 法兰西共和国"
 RULE_OPTION_FRA_HISTORICAL: "史实AI"
 RULE_OPTION_FRA_HISTORICAL_DESC: "法国将继续保持西方地位，并继续担任欧盟领导成员国之一，轮值主席国将依次由其历史上的几位担任：萨科齐于2007年担任，奥朗德于2012年担任，马克龙于2017年担任。法国将努力推动欧盟走向更加集中化，同时保持其在前殖民地的影响力。"
 ITA_AI_BEHAVIOR_MD: "@ITA 意大利共和国"
 BRM_AI_BEHAVIOR: "@BRM 缅甸联邦"
 RULE_OPTION_BEACON_OF_DEMOCRACY: "民主灯塔"
 RULE_OPTION_BEACON_OF_DEMOCRACY_AI_DESC: "缅甸将毫不妥协地推行改革，迅速推动全国民主联盟掌权。比起让步于缅甸国防军，缅甸将会动员各种政治自由化的支持者，包括民族反叛团体，旨在一劳永逸地结束军队对政治的影响。"
 RULE_OPTION_AN_IRON_FIST: "铁腕政治"
 RULE_OPTION_AN_IRON_FIST_AI_DESC: "此游戏规则仅适用于2000年开始游戏，这将令缅甸保持独裁统治，与历史上那样积极回应改革压力相对，他会走向压制和极权主义。此外，为了转移对其合法性不足的注意，军政府不仅将与本国的叛乱组织作战，而且也将发动对邻国的战争。"
 RULE_OPTION_NORTHERN_AMBITION: "北方雄心"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "瑞典极右翼势力将迎来支持率飙升，最终企图在北欧建立瑞典帝国。"
 SYR_AI_BEHAVIOR: "@SYR 阿拉伯叙利亚共和国"
 RULE_OPTION_SYR_HISTORICAL: "史实AI"
 RULE_OPTION_SYR_HISTORICAL_DESC: "哈菲兹·阿萨德的长子巴沙尔·阿萨德将成功继任。巴沙尔将使叙利亚继续与俄罗斯结盟，并会同样重视外交、军事和经济。"
 RULE_OPTION_SYR_IRON_LADY: "叙利亚铁娘子"
 RULE_OPTION_SYR_IRON_LADY_DESC: "哈菲兹·阿萨德的女儿布莎拉·阿萨德将成功继任。布莎拉将在大国之间采取更加中立的态度，并着重于外交和经济。"
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "叙利亚暴君"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "哈菲兹·阿萨德的小儿子马希尔·阿萨德将成功继任。马希尔将试图组建大叙利亚，在中东地区塑造一个新的强国。他将专注于军事和经济扩张。"
 RULE_OPTION_SYR_NEW_ASSAD: "新的阿萨德"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "哈菲兹·阿萨德的弟弟里法特·阿萨德将在大马士革之春之后成功继任。里法特将专注于亲沙特政策，特别是在外交和经济上。"
 RULE_OPTION_SYR_DAMASCUS_SPRING: "大马士革之春"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "在大马士革之春运动之后，叙利亚将会迎头赶上并成为民主国家。"
 BHR_AI_BEHAVIOR: "@BHR 巴林"
 SAU_AI_BEHAVIOR: "@SAU 沙特阿拉伯王国"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST: "全球圣战 - 海合会优先"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST_AI_DESC: "沙特阿拉伯将努力改革其经济，并将海合会统一为一个超级国家。随后，沙特君主制将被基地组织起义者摧毁，并建立一个寻求通过暴力手段传播其原教旨主义意识形态的激进伊斯兰国家。"
 RULE_OPTION_GLOBAL_JIHAD: "全球圣战"
 RULE_OPTION_GLOBAL_JIHAD_AI_DESC: "沙特君主制将被基地组织的起义推翻，这将会建立一个激进的伊斯兰国家，这个国家将试图通过暴力手段传播其原教旨主义意识形态。"
 RULE_OPTION_ISLAMIC_AWAKENING: "伊斯兰觉醒"
 RULE_OPTION_ISLAMIC_AWAKENING_AI_DESC: "受穆斯林兄弟会影响的萨赫瓦，即觉醒运动，将成功地向沙特君主制施压，使其让位于多元化的伊斯兰民主制度。"
 RULE_OPTION_RETURN_OF_THE_BAATH: "复兴党归来"
 RULE_OPTION_RETURN_OF_THE_BAATH_AI_DESC: "沙特阿拉伯将逐步实现自由化，为复兴党独特的社会主义阿拉伯民族主义意识形态提供了在该国立足的机会。 复兴主义阿拉伯将寻求驱逐中东的外国军队，并扩张自己的领土。"
 RULE_OPTION_SHIA_REVIVAL: "什叶派复兴"
 RULE_OPTION_SHIA_REVIVAL_AI_DESC: "沙特阿拉伯的什叶派将以政治自由化为契机接管沙特阿拉伯，并与伊朗和俄罗斯站在一条战线上。"
 BRI_AI_BEHAVIOR: "@ENG 英国"
 RULE_OPTION_RULE_BRITANNIA: "统治吧，不列颠尼亚"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "曾几何时，这片君临天下的岛屿举世闻名，令人生畏。英国君主统治着日不落帝国。然而如今，英国的国际地位已然衰落，沦为美国的附庸，昔日荣光不再。大英帝国复兴的时机已到。王室的拥护者将打破两党制，在未来十年内建立起自己的运动，并在2010年彻底夺取政权 - 然后，舰队将扬帆起航。\n"
 RULE_HELLENIC_REPUBLIC: "史实"
 RULE_HELLENIC_REPUBLIC_DESC: "希腊将维持民主制度，并试图通过紧缩措施解决希腊债务危机。"
 RULE_OPTION_KKE: "希腊共产党"
 RULE_OPTION_KKE_DESC: "由于债务危机造成的问题，民众对政府的不满情绪日益增长，这将加强希腊共产党的力量，并试图建立一个共产主义国家。"
 RULE_OPTION_GOLDEN_DAWN: "金色黎明"
 RULE_OPTION_GOLDEN_DAWN_DESC: "由于债务危机造成的问题，民众对政府的不满情绪日益增长，这将加强民族主义金色黎明党的力量，并试图建立一个强大的希腊国家。"
 RULE_NORTH_AMERICAN_STATUS_QUO: "北美现状"
 RULE_NORTH_AMERICAN_STATUS_QUO_DESC: "在北美现状下，加拿大将留在北约，并与北约和美国保持相对的位置。"
