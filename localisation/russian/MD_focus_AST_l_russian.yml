 julia_gilard_desc: "As a Welsh-born activist and legal partner, Gillard has risen through the ranks of the Australian government and become the country's first female leader. \n \nInitially a Left Faction Socialist in Victoria's ALP, Gillard came to prominence by utilising her connections to the business sector. An ability gained from years as an industrial solicitor. Striving in a traditionally male dominated field, and defying the odds despite remaining unmarried and lacking any religious belief, Gillard has officially broken the status quo of Parliament. \n\nWhichever direction she goes, the party follows with tentative unease, as it departs from traditional certainty. Any misstep could shatter the party's newfound stability, send Gillard over before her leadership has even begun."
