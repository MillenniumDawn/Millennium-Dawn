 counter_terrorism_goal_name: "Coopération antiterroriste"
 semiconductor_supremacy_goal_name: "Suprématie des semi-conducteurs"
 strategic_resource_security_goal_name: "Sécurité stratégique des ressources"
 collective_cyber_defense_goal_name: "Cyberdéfense collective"
 economic_powerhouse_goal_name: "Une puissance économique"
 joint_military_exercises_goal_desc: "La guerre moderne exige l'interopérabilité entre forces alliées. En menant des exercices conjoints et en atteignant une force combinée de 100 divisions équipées, notre faction démontre sa préparation à répondre à toute menace."
 economic_integration_goal_desc: "Une économie forte est le fondement de toute alliance durable. En veillant à ce que chaque État membre maintienne au moins 15 usines civiles, nous bâtissons la base industrielle nécessaire à la prospérité collective et à l'aide mutuelle."
 technology_sharing_goal_desc: "La supériorité technologique est un multiplicateur de force. Par des programmes de recherche partagés et l'investissement dans les infrastructures numériques, notre faction peut distancer ses rivaux et conserver l'avantage dans chaque domaine."
 regional_stability_goal_desc: "Une alliance n'est aussi forte que son maillon le plus faible. En maintenant la stabilité au-dessus de 50 % dans tous les États membres, nous présentons un front uni qui dissuade l'agression opportuniste et la subversion interne."
 counter_terrorism_goal_desc: "Le terrorisme ne connaît pas de frontières. Établir des agences de renseignement dans chaque État membre crée un réseau capable d'intercepter les menaces avant qu'elles ne se matérialisent, protégeant nos citoyens et nos intérêts collectifs."
 semiconductor_supremacy_goal_desc: "La fabrication de microprocesseurs est l'industrie stratégique du XXIe siècle. En construisant un total de 50 usines de puces à travers notre faction, nous sécurisons l'indépendance de la chaîne d'approvisionnement et une domination technologique pour des décennies."
 strategic_resource_security_goal_desc: "L'accès aux matières premières critiques sous-tend à la fois la croissance économique et la préparation militaire. Notre faction doit extraire collectivement assez de pétrole, de caoutchouc et d'aluminium pour qu'aucun membre ne soit vulnérable à la coercition par les ressources."
 collective_cyber_defense_goal_desc: "À l'ère numérique, la sécurité cryptographique est aussi vitale que les fortifications physiques. En veillant à ce que chaque État membre atteigne des capacités de chiffrement avancées, nous protégeons nos communications, notre renseignement et nos infrastructures critiques."
 economic_powerhouse_goal_desc: "La puissance économique se traduit directement en influence géopolitique. Lorsque le chef de notre faction atteint un PIB par habitant élevé et que chaque membre dépasse un seuil de base, nous devenons un bloc économique qu'on ne peut ignorer."
 faction_gdp_per_capita_target_tt: "PIB par habitant du chef de faction au-dessus de 15 et tous les membres au-dessus de 5"
 faction_economic_integration_idea: "Pacte d'intégration économique"
 faction_economic_integration_idea_desc: "Par des politiques commerciales coordonnées et des barrières réduites, les États membres jouissent d'une meilleure coopération économique et d'un développement plus rapide."