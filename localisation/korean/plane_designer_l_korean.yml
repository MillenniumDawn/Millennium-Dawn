 internal_weapons_4: "초첨단 내부 무기"
 internal_weapons_4_desc: "내부 무장창의 크기 제한 때문에 많은 양의 무장을 탑재할 수 없다는 전투기 조종사들의 불만에 따라, 설계자들은 탑재 능력을 더욱 높이기 위해 무장창을 더 크게 만들고자 노력했습니다."
 internal_weapons_5: "극초첨단 내부 무기"
