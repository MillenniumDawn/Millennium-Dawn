 GER_Anti_tank_5: "MAC II"
 GER_Heavy_Anti_tank_1_desc: "Raketenjagdpanzer 1 — истребитель танков, вооружённый противотанковыми управляемыми ракетами. Он построен на шасси Hispano-Suiza HS.30, которое также использовалось на Schützenpanzer SPz 12-3. Снаружи одновременно видна только одна пусковая установка: вторая убрана в корпус для перезарядки, пока первая готова к пуску."
