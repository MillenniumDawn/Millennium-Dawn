l_japanese:
 lithuania.1.t: "マジェイケイ・ナフタ問題"
 lithuania.1.d: "リトアニア唯一の石油精製所であるマジェイケイ・ナフタは、地政学上の火種となっている。ポーランドのエネルギー大手PKNオルレンとロシアのコンソーシアムの双方が、同施設の買収に関心を示しているのだ。国が所有し続けるという選択肢も残されているが、それには多額の費用がかかる。"
 lithuania.1.a: "PKNオルレンに売却する"
 lithuania.1.b: "ロシアのコンソーシアムに売却する"
 lithuania.1.c: "国有化を維持すべきだ"
 lithuania.2.t: "PKNオルレンがリトアニアの製油所を買収"
 lithuania.2.d: "PKNオルレンは、リトアニアのマジェイケイ・ナフタ製油所の買収を完了し、バルト海地域におけるポーランドのエネルギー事業を拡大した。"
 lithuania.2.a: "賢明な投資だ"
 lithuania.3.t: "マジェイケイ製油所での火災"
 lithuania.3.d: "マジェイケイ製油所で不審な火災が発生した。ロシア系企業への売却直後というタイミングから、妨害工作ではないかと憶測が飛び交い、リトアニアのエネルギーインフラの安全性に疑問が投げかけられている。"
 lithuania.3.a: "モスクワを非難する"
 lithuania.3.b: "ひそかに調査を開始する"
 lithuania.10.t: "イグナリナの未来"
 lithuania.10.d: "欧州連合は、リトアニアに対し、2基のRBMK型原子炉を擁するイグナリナ原子力発電所の閉鎖を要求した。この原子炉は、チェルノブイリで事故を起こしたのと同じ設計である。閉鎖はEU加盟の条件となっているが、イグナリナ発電所はリトアニアの電力の大部分を供給している。代替発電所は、ポーランドやバルト三国と共同で建設される可能性がある。"
 lithuania.10.a: "近隣国家と代替発電所について協議する"
 lithuania.10.b: "イグナリナ原発の稼働を継続せよ"
 lithuania.10.c: "代替品なしで閉じる"
 lithuania.11.t: "リトアニアの原子力協力提案"
 lithuania.11.d: "リトアニアは、老朽化したイグナリナ原子力発電所に代わるヴィサギナス原子力発電所の建設について、ポーランドに共同出資を提案した。このプロジェクトは、バルト諸国のエネルギー自立を強化し、地域間の絆を深めることになるが、多額の投資が必要となる。"
 lithuania.11.a: "本プロジェクトへの共同出資に同意する"
 lithuania.11.b: "他にも優先すべきことがある"
 lithuania.12.t: "ポーランドが原子力協力に合意"
 lithuania.12.d: "ポーランドはヴィサギナス原子力発電所の建設費用を共同出資することに合意した。建設は開始できるが、プロジェクトの完成には数年を要し、多額の資金が必要となる。"
 lithuania.12.a: "着工せよ"
 lithuania.13.t: "ポーランドが原子力協力を拒否"
 lithuania.13.d: "ポーランドはヴィサギナス計画への参加を見送った。リトアニアは今後、イグナリナ原発の行方を独自に決定しなければならない。"
 lithuania.13.a: "リスクはあるが、イグナリナ原発の稼働を継続する"
 lithuania.13.b: "閉鎖しろ。我々だけで何とかする。"
 lithuania.14.t: "ヴィサギナス原子力発電所に関する住民投票"
 lithuania.14.d: "長年にわたる建設を経て、ヴィサギナス原子力発電所プロジェクトは国民投票の行方を迎えている。世論は、エネルギー安全保障に不可欠だと考える層と、原子力の安全性やコスト超過を懸念する層との間で二分されている。"
 lithuania.14.a: "住民たちは発電所の建設を承認した"
 lithuania.14.b: "住民たちはこの計画を拒否した"
 lithuania.15.t: "ヴィサギナス発電所が完成"
 lithuania.15.d: "リトアニアとポーランドの共同事業であるヴィサギナス原子力発電所が稼働を開始した。このプロジェクトは、バルト諸国のエネルギー協力およびロシア産ガスへの依存からの脱却において、重要な節目となるものである。"
 lithuania.15.a: "協力の成果だ"
 lithuania.16.t: "イグナリナに対する国際的な圧力"
 lithuania.16.d: "欧州連合は、リトアニアがイグナリナ原子力発電所の運転を継続していることに対し、正式な警告を発した。チェルノブイリ型原子炉が閉鎖されない場合、制裁措置やEU構造基金の交付停止が検討されている。"
 lithuania.16.a: "他に選択肢はない。閉鎖しよう。"
 lithuania.16.b: "圧力には負けない。"
 LIT_refinery_sale_revenue: "製油所の売上高"
 LIT_refinery_sale_revenue_desc: "マジェイケイ・ナフタの売却益は、国家予算に一時的な追い風をもたらしている。"
 LIT_russian_energy_leverage: "ロシアのエネルギーを武器とした影響力"
 LIT_russian_energy_leverage_desc: "リトアニアで唯一の製油所がロシアの資本に売却されたことで、モスクワはリトアニアのエネルギー政策に対して経済的な影響力を持つことになった。"
 LIT_nationalized_refinery: "国有製油所"
 LIT_nationalized_refinery_desc: "リトアニアはマジェイケイ・ナフタの国有化を維持している。これにより、経営効率を犠牲にして資源の安全保障を確保している。"
 LIT_energy_deficit: "エネルギー不足"
 LIT_energy_deficit_desc: "イグナリナ原子力発電所が代替施設のないまま閉鎖されたため、リトアニアは高価なエネルギー輸入に依存せざるを得なくなっている。"
 LIT_visaginas_nuclear_plant: "ヴィサギナス原子力発電所"
 LIT_visaginas_nuclear_plant_desc: "新しいヴィサギナス発電所は、クリーンで信頼性の高いエネルギーを供給しており、バルト諸国間の地域協力の象徴となっている。"
 lithuania_news.1.t: "マジェイケイ・ナフタの売却"
 lithuania_news.1.d_poland: "リトアニアは、国内唯一の石油精製所であるマジェイケイ・ナフタを、ポーランドのエネルギー大手PKNオルレンに売却した。この取引は、バルト諸国とポーランドの経済関係をさらに深めるものであり、ブリュッセルでは、同地域におけるロシアへのエネルギー依存度を低減するための一歩と見なされている。"
 lithuania_news.1.d_russia: "リトアニアは、国内唯一の石油精製所であるマジェイケイ・ナフタを、ロシアが支援するコンソーシアムに売却した。批判派は、この取引により、モスクワがリトアニアのエネルギーインフラに対して戦略的な影響力を握ることになると警告している。"
 lithuania_news.1.a: "我々のエネルギーの未来を支える礎となるだろう"
 lithuania_news.1.b: "バルト海市場への歓迎すべき進出だ"
 lithuania_news.1.c: "この地域におけるさらなる前進だ"
 lithuania_news.1.d: "バルト諸国におけるエネルギー安全保障の情勢が変化している"
 lithuania_news.1.e: "ヨーロッパのエネルギー政治における一節となるだろう"
 lithuania_news.2.t: "イグナリナ原子力発電所が閉鎖された"
 lithuania_news.2.d: "リトアニアはイグナリナ原子力発電所を閉鎖し、ソ連時代のRBMK型原子炉の最後の一基を廃止措置した。この閉鎖により、EU加盟の主要な要件の一つは満たされたが、代替エネルギー源が見つかるまでは、同国はエネルギー輸入に依存せざるを得ない状況が続く。"
 lithuania_news.2.a: "明かりは、どうにかして灯り続けるだろう"
 lithuania_news.2.b: "ヨーロッパにおける原子力安全の勝利だ"
 lithuania_news.2.c: "世界から原子炉が1基減った"
 lithuania_news.3.t: "ヴィサギナス原子力発電所が完成"
 lithuania_news.3.desc: "ポーランドの共同出資により建設されたリトアニアの新しいヴィサギナス原子力発電所が稼働を開始した。この施設は、同国のエネルギー自給自足を回復させるものであり、バルト海地域の協力における画期的な成果となっている。"
 lithuania_news.3.a: "ついにエネルギー自給を実現した"
 lithuania_news.3.b: "この地域への投資が実を結んでいる"
 lithuania_news.3.c: "バルト諸国のエネルギー政策における新たな一章だ"
 lithuania_news.3.d: "バルト諸国がエネルギーの将来を確保した"