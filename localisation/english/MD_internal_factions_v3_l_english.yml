 internal_faction_policy_smbo_startup_grants_desc: "We fund grants for new small firms, easing their start-up costs at the expense of civilian industry tax income.\n\n$modifier_production_speed_industrial_complex_factor$: §G+5%§!\n$civilian_industry_tax_modifier$: §R-5%§!"
 internal_faction_policy_smbo_deregulation_desc: "We cut licensing red tape for small firms, letting them run more productively at the cost of corporate tax revenue.\n\n$civilian_factories_productivity$: §G+5%§!\n$corporate_tax_income_multiplier_modifier$: §R-3%§!"
 internal_faction_policy_smbo_procurement_quota_desc: "We reserve a share of government contracts for small firms, speeding internet infrastructure build-out while nudging up consumer goods costs.\n\n$modifier_production_speed_internet_station_factor$: §G+10%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §R+2%§!"
 internal_faction_policy_smbo_licensing_crackdown_desc: "We tighten licensing rules on small firms, raising their tax burden and choking their productivity.\n\n$civilian_industry_tax_modifier$: §G+8%§!\n$civilian_factories_productivity$: §R-5%§!"
 internal_faction_policy_bankers_deregulation_desc: "We deregulate the banking sector, lowering interest rates and the cost of managing economic cycles for financiers.\n\n$interest_rate_multiplier_modifier$: §G-0.5§!\n$econ_cycle_upg_cost_multiplier_modifier$: §G-5%§!"
 internal_faction_policy_bankers_bailout_guarantee_desc: "We guarantee state bailouts for troubled banks, cutting their exposure to economic cycles at the expense of corporate tax revenue.\n\n$econ_cycle_upg_cost_multiplier_modifier$: §G-10%§!\n$corporate_tax_income_multiplier_modifier$: §R-3%§!"
 internal_faction_policy_bankers_capital_freedom_desc: "We free capital flows across borders, cutting the cost of sending and receiving investment for financial interests.\n\n$investment_cost_modifier$: §G-10%§!\n$receiving_investment_cost_modifier$: §G-5%§!"
 internal_faction_policy_bankers_capital_controls_desc: "We impose capital controls on the banking sector, raising the tax take while souring our trade relations.\n\n$tax_gain_multiplier_modifier$: §G+4%§!\n$MODIFIER_TRADE_OPINION_FACTOR$: §R-10%§!"
 internal_faction_policy_fossil_drilling_permits_desc: "We issue new drilling permits, boosting oil extraction and exports for the fossil fuel industry.\n\n$oil_export_multiplier_modifier$: §G+10%§!\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+5%§!"
 internal_faction_policy_fossil_fuel_subsidy_desc: "We subsidize fuel production, raising national fuel output and cutting the fuel our power plants burn.\n\n$MODIFIER_BASE_FUEL_GAIN_FACTOR$: §G+10%§!\n$fossil_pp_fuel_consumption_modifier$: §G-5%§!"
 internal_faction_policy_fossil_export_terminals_desc: "We fund new export terminals, speeding fuel silo construction and resource exports for the industry.\n\n$resource_export_multiplier_modifier$: §G+5%§!\n$modifier_production_speed_fuel_silo_factor$: §G+10%§!"
 internal_faction_policy_fossil_windfall_tax_desc: "We levy a windfall tax on oil profits, raising the take while choking off oil exports.\n\n$corporate_tax_income_multiplier_modifier$: §G+5%§!\n$oil_export_multiplier_modifier$: §R-10%§!"
 internal_faction_policy_conglomerates_industrial_policy_desc: "We steer industrial policy toward the big conglomerates, expanding factory capacity at the cost of civilian tax revenue.\n\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+3%§!\n$civilian_industry_tax_modifier$: §R-5%§!"
 internal_faction_policy_conglomerates_export_credits_desc: "We extend export credits to the conglomerates, boosting their resource exports and international market earnings.\n\n$resource_export_multiplier_modifier$: §G+5%§!\n$international_market_income_modifier$: §G+5%§!"
 internal_faction_policy_conglomerates_infrastructure_contracts_desc: "We award infrastructure contracts to the conglomerates, speeding construction while raising its cost to the state.\n\n$modifier_production_speed_infrastructure_factor$: §G+10%§!\n$infrastructure_cost_multiplier_modifier$: §R+5%§!"
 internal_faction_policy_conglomerates_antitrust_desc: "We pursue antitrust action against the conglomerates, raising their tax burden and shrinking their factory capacity.\n\n$civilian_industry_tax_modifier$: §G+8%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §R-5%§!"
 internal_faction_policy_oligarchs_privatisation_deals_desc: "We hand state industry to the oligarchs through privatization deals, speeding construction while feeding corruption.\n\n$modifier_production_speed_industrial_complex_factor$: §G+5%§!\n$corruption_cost_factor$: §R+10%§!"
 internal_faction_policy_oligarchs_resource_concessions_desc: "We grant resource concessions to the oligarchs, boosting local resource output and exports.\n\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+5%§!\n$resource_export_multiplier_modifier$: §G+5%§!"
 internal_faction_policy_oligarchs_media_holdings_desc: "We let the oligarchs consolidate media holdings, boosting our political power and our defense against ideological drift.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$MODIFIER_DRIFT_DEFENCE_FACTOR$: §G+10%§!"
 internal_faction_policy_oligarchs_asset_seizure_desc: "We seize oligarch assets, raising the tax take while souring our trade relations.\n\n$tax_gain_multiplier_modifier$: §G+4%§!\n$MODIFIER_TRADE_OPINION_FACTOR$: §R-5%§!"
 internal_faction_policy_maritime_shipbuilding_subsidy_desc: "We subsidize shipyards, speeding dockyard construction while cutting the tax bite on maritime income.\n\n$modifier_production_speed_dockyard_factor$: §G+10%§!\n$dockyard_income_tax_modifier$: §R-5%§!"
 internal_faction_policy_maritime_cabotage_law_desc: "We pass a cabotage law reserving domestic shipping for national carriers, boosting dockyard capacity at the cost of trade relations.\n\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §G+5%§!\n$MODIFIER_TRADE_OPINION_FACTOR$: §R-5%§!"
 internal_faction_policy_maritime_port_authority_desc: "We expand port authority powers, speeding naval base construction and extending our operating range at sea.\n\n$modifier_production_speed_naval_base_factor$: §G+10%§!\n$MODIFIER_NAVY_MAX_RANGE_FACTOR$: §G+5%§!"
 internal_faction_policy_maritime_tonnage_levy_desc: "We impose a tonnage levy on shipowners, raising the tax on maritime income while shrinking dockyard capacity.\n\n$dockyard_income_tax_modifier$: §G+8%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §R-5%§!"
 internal_faction_policy_military_officer_pay_rise_desc: "We raise officer pay, boosting army morale at a higher cost to the defense budget.\n\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+5%§!\n$personnel_cost_multiplier_modifier$: §R+5%§!"
 internal_faction_policy_military_procurement_priority_desc: "We give the military first call on factory output, boosting military production at the expense of civilian industry.\n\n$military_factories_productivity$: §G+5%§!\n$civilian_factories_productivity$: §R-2%§!"
 internal_faction_policy_military_promotion_autonomy_desc: "We let the officer corps handle its own promotions, sharpening army experience at the cost of political oversight.\n\n$MODIFIER_XP_GAIN_ARMY$: §G+5%§!\n$MODIFIER_POLITICAL_POWER_FACTOR$: §R-3%§!"
 internal_faction_policy_military_political_commissars_desc: "We place political commissars in every unit, watching the officer corps at the cost of army organization.\n\n$MODIFIER_ARMY_ORG_FACTOR$: §R-5%§!\n$MODIFIER_DRIFT_DEFENCE_FACTOR$: §G+10%§!\nFreezes the coup plot"
 internal_faction_policy_defense_domestic_procurement_desc: "We favor domestic arms procurement, speeding arms factory construction while raising the cost of buying from abroad.\n\n$modifier_production_speed_arms_factory_factor$: §G+10%§!\n$international_market_purchase_modifier$: §R+5%§!"
 internal_faction_policy_defense_export_licenses_desc: "We loosen arms export licensing, boosting international market income for defense firms at some cost to trade relations.\n\n$international_market_income_modifier$: §G+10%§!\n$MODIFIER_TRADE_OPINION_FACTOR$: §R-3%§!"
 internal_faction_policy_defense_rnd_grants_desc: "We fund research grants for defense contractors, speeding factory efficiency gains while cutting their tax burden.\n\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+5%§!\n$military_industry_tax_modifier$: §R-5%§!"
 internal_faction_policy_defense_contractor_audit_desc: "We audit defense contractors for overcharging, raising their tax burden and slowing military factory output.\n\n$military_industry_tax_modifier$: §G+8%§!\n$military_factories_productivity$: §R-5%§!"
 internal_faction_policy_intel_surveillance_powers_desc: "We expand domestic surveillance powers, cutting foreign subversive activity at some cost to public stability.\n\n$MODIFIER_FOREIGN_SUBVERSIVE_ACTIVITIES$: §G-10%§!\n$MODIFIER_STABILITY_FACTOR$: §R-2%§!"
 internal_faction_policy_intel_black_budget_desc: "We fund a black budget for the intelligence services, boosting decryption capability while raising policing costs.\n\n$MODIFIER_DECRYPTION_FACTOR$: §G+10%§!\n$police_cost_multiplier_modifier$: §R+5%§!"
 internal_faction_policy_intel_covert_action_authority_desc: "We authorize covert action abroad, boosting our foreign influence and our own encryption capability.\n\n$foreign_influence_modifier$: §G+5%§!\n$MODIFIER_ENCRYPTION_FACTOR$: §G+5%§!"
 internal_faction_policy_intel_service_purge_desc: "We purge the intelligence services of suspect officers, tightening political control while leaving us more exposed to foreign subversion.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$MODIFIER_FOREIGN_SUBVERSIVE_ACTIVITIES$: §R+10%§!"
 internal_faction_policy_unions_collective_bargaining_desc: "We recognize collective bargaining rights, cutting the cost of social programs while raising demand for consumer goods.\n\n$social_cost_multiplier_modifier$: §G-5%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §R+2%§!"
 internal_faction_policy_unions_strike_protection_desc: "We protect the right to strike, speeding factory efficiency gains for workers at some cost to public stability.\n\n$MODIFIER_PRODUCTION_FACTORY_EFFICIENCY_GAIN_FACTOR$: §G+5%§!\n$MODIFIER_STABILITY_FACTOR$: §R-2%§!"
 internal_faction_policy_unions_board_seats_desc: "We give union representatives seats on company boards, boosting their political power at some cost to civilian factory output.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$civilian_factories_productivity$: §R-2%§!"
 internal_faction_policy_unions_strike_ban_desc: "We ban strikes outright, forcing factories back to full capacity at the cost of public stability.\n\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+5%§!\n$MODIFIER_STABILITY_FACTOR$: §R-3%§!\nProtest strength §R+1§! per month"
 internal_faction_policy_landowners_estate_tax_relief_desc: "We grant estate tax relief to landowners, easing their tax burden and calming rural discontent.\n\n$agriculture_district_income_tax_modifier$: §R-5%§!\n$MODIFIER_STABILITY_FACTOR$: §G+2%§!"
 internal_faction_policy_landowners_tenancy_law_desc: "We rewrite tenancy law in favor of landowners, boosting farm productivity while easing the burden of conscription on tenants.\n\n$agricolture_productivity_modifier$: §G+5%§!\n$MODIFIER_CONSCRIPTION_FACTOR$: §R-2%§!"
 internal_faction_policy_landowners_land_registry_desc: "We formalize land registries for large estates, boosting local resource output and cutting their labor requirements.\n\n$MODIFIER_LOCAL_RESOURCES_FACTOR$: §G+3%§!\n$agriculture_district_worker_requirement_modifier$: §G-5%§!"
 internal_faction_policy_landowners_land_reform_desc: "We push through land reform against the great estates, raising their tax burden and stirring rural unrest.\n\n$agriculture_district_income_tax_modifier$: §G+8%§!\n$MODIFIER_STABILITY_FACTOR$: §R-2%§!"
 internal_faction_policy_farmers_price_supports_desc: "We guarantee price supports for farmers, boosting agricultural productivity while raising demand for consumer goods.\n\n$agricolture_productivity_modifier$: §G+5%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §R+2%§!"
 internal_faction_policy_farmers_rural_credit_desc: "We extend rural credit to farmers, speeding agricultural development and easing their tax burden.\n\n$modifier_production_speed_agriculture_district_factor$: §G+10%§!\n$agriculture_district_income_tax_modifier$: §R-3%§!"
 internal_faction_policy_farmers_draft_exemption_desc: "We exempt farm labor from the draft, keeping families on the land and easing the burden of conscription.\n\n$MODIFIER_GLOBAL_MONTHLY_POPULATION$: §G+2%§!\n$MODIFIER_CONSCRIPTION_FACTOR$: §R-3%§!"
 internal_faction_policy_farmers_land_tax_desc: "We raise the land tax on smallholders, squeezing farm income and dragging down agricultural productivity.\n\n$agriculture_district_income_tax_modifier$: §G+6%§!\n$agricolture_productivity_modifier$: §R-5%§!"
 internal_faction_policy_cadres_party_schools_desc: "We fund party schools to train loyal cadres, boosting political power at a higher cost to the education system.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$education_cost_multiplier_modifier$: §R+3%§!"
 internal_faction_policy_cadres_nomenklatura_posts_desc: "We reserve bureaucratic posts for the party nomenklatura, cutting administrative costs while feeding corruption.\n\n$bureaucracy_cost_multiplier_modifier$: §G-5%§!\n$corruption_cost_factor$: §R+10%§!"
 internal_faction_policy_cadres_mass_mobilisation_desc: "We organize mass mobilization campaigns through the cadres, speeding military mobilization while raising demand for consumer goods.\n\n$MODIFIER_MOBILIZATION_SPEED$: §G+10%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §R+2%§!"
 internal_faction_policy_cadres_anti_corruption_purge_desc: "We purge the party of corrupt cadres, cutting corruption at the cost of the party's own political authority.\n\n$corruption_cost_factor$: §G-10%§!\n$MODIFIER_POLITICAL_POWER_FACTOR$: §R-5%§!"
 internal_faction_policy_priesthood_religious_schools_desc: "We let the priesthood run religious schools, cutting education costs while slowing scientific research.\n\n$education_cost_multiplier_modifier$: §G-5%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-3%§!"
 internal_faction_policy_priesthood_morality_laws_desc: "We enact morality laws backed by the priesthood, calming public stability.\n\n$MODIFIER_STABILITY_FACTOR$: §G+3%§!\nDoubles this faction's pull on party popularity"
 internal_faction_policy_priesthood_tax_exemption_desc: "We grant the priesthood tax-exempt status, boosting political power while trimming state tax revenue.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$tax_gain_multiplier_modifier$: §R-2%§!"
 internal_faction_policy_priesthood_secularisation_desc: "We push secularization against the priesthood, speeding research while unsettling public stability.\n\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+3%§!\n$MODIFIER_STABILITY_FACTOR$: §R-3%§!"
 internal_faction_policy_ulema_religious_schools_desc: "We let the ulema run religious schools, cutting education costs while slowing scientific research.\n\n$education_cost_multiplier_modifier$: §G-5%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-3%§!"
 internal_faction_policy_ulema_morality_laws_desc: "We enact morality laws backed by the ulema, calming public stability.\n\n$MODIFIER_STABILITY_FACTOR$: §G+3%§!\nDoubles this faction's pull on party popularity"
 internal_faction_policy_ulema_tax_exemption_desc: "We grant the ulema tax-exempt status, boosting political power while trimming state tax revenue.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$tax_gain_multiplier_modifier$: §R-2%§!"
 internal_faction_policy_ulema_secularisation_desc: "We push secularization against the ulema, speeding research while unsettling public stability.\n\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+3%§!\n$MODIFIER_STABILITY_FACTOR$: §R-3%§!"
 internal_faction_policy_clergy_religious_schools_desc: "We let the clergy run religious schools, cutting education costs while slowing scientific research.\n\n$education_cost_multiplier_modifier$: §G-5%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-3%§!"
 internal_faction_policy_clergy_morality_laws_desc: "We enact morality laws backed by the clergy, calming public stability.\n\n$MODIFIER_STABILITY_FACTOR$: §G+3%§!\nDoubles this faction's pull on party popularity"
 internal_faction_policy_clergy_tax_exemption_desc: "We grant the clergy tax-exempt status, boosting political power while trimming state tax revenue.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$tax_gain_multiplier_modifier$: §R-2%§!"
 internal_faction_policy_clergy_secularisation_desc: "We push secularization against the clergy, speeding research while unsettling public stability.\n\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+3%§!\n$MODIFIER_STABILITY_FACTOR$: §R-3%§!"
 internal_faction_policy_wahabi_religious_schools_desc: "We let the wahabi ulema run religious schools, cutting education costs while slowing scientific research.\n\n$education_cost_multiplier_modifier$: §G-5%§!\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §R-3%§!"
 internal_faction_policy_wahabi_religious_police_desc: "We deploy religious police backed by the wahabi ulema, calming public stability while raising policing costs.\n\n$MODIFIER_STABILITY_FACTOR$: §G+3%§!\n$police_cost_multiplier_modifier$: §R+5%§!"
 internal_faction_policy_wahabi_charity_exemption_desc: "We grant the wahabi ulema tax-exempt status for their charitable endowments, boosting political power while trimming state tax revenue.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$tax_gain_multiplier_modifier$: §R-2%§!"
 internal_faction_policy_wahabi_secularisation_desc: "We push secularization against the wahabi ulema, speeding research while unsettling public stability.\n\n$MODIFIER_RESEARCH_SPEED_FACTOR$: §G+3%§!\n$MODIFIER_STABILITY_FACTOR$: §R-3%§!"
 internal_faction_policy_donju_market_tolerance_desc: "We tolerate donju market activity, speeding industrial construction while feeding corruption.\n\n$modifier_production_speed_industrial_complex_factor$: §G+5%§!\n$corruption_cost_factor$: §R+10%§!"
 internal_faction_policy_donju_trade_permits_desc: "We grant the donju trade permits, boosting their resource exports and international market earnings.\n\n$resource_export_multiplier_modifier$: §G+5%§!\n$international_market_income_modifier$: §G+5%§!"
 internal_faction_policy_donju_foreign_currency_shops_desc: "We let the donju run foreign currency shops, raising state tax revenue while easing demand for consumer goods.\n\n$tax_gain_multiplier_modifier$: §G+3%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §G-2%§!"
 internal_faction_policy_donju_market_closures_desc: "We shut down donju markets, tightening political control at the cost of consumer goods supply.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$MODIFIER_CONSUMER_GOODS_FACTOR$: §R+3%§!"
 internal_faction_policy_sarf_royal_stipends_desc: "We pay royal stipends to the extended family, calming public stability while raising social program costs.\n\n$MODIFIER_STABILITY_FACTOR$: §G+3%§!\n$social_cost_multiplier_modifier$: §R+5%§!"
 internal_faction_policy_sarf_court_appointments_desc: "We fill bureaucratic posts with royal court appointees, boosting political power while raising administrative costs.\n\n$MODIFIER_POLITICAL_POWER_FACTOR$: §G+5%§!\n$bureaucracy_cost_multiplier_modifier$: §R+5%§!"
 internal_faction_policy_sarf_family_council_desc: "We empower the family council to police succession, shoring up the state against ideological drift while feeding corruption.\n\n$MODIFIER_DRIFT_DEFENCE_FACTOR$: §G+10%§!\n$corruption_cost_factor$: §R+10%§!"
 internal_faction_policy_sarf_anti_corruption_detentions_desc: "We detain royal family members in an anti-corruption sweep, raising the tax take while shaking public stability.\n\n$tax_gain_multiplier_modifier$: §G+4%§!\n$MODIFIER_STABILITY_FACTOR$: §R-3%§!"
 internal_faction_policy_quds_proxy_funding_desc: "We fund proxy militias abroad through the Quds Force, expanding our volunteer deployments while trimming state tax revenue.\n\n$MODIFIER_SEND_VOLUNTEER_SIZE$: §G+1§!\n$tax_gain_multiplier_modifier$: §R-2%§!"
 internal_faction_policy_quds_training_camps_desc: "We host Quds Force training camps for special forces, expanding our special forces capacity at some political cost.\n\n$MODIFIER_SPECIAL_FORCES_CAP$: §G+5%§!\n$MODIFIER_POLITICAL_POWER_FACTOR$: §R-2%§!"
 internal_faction_policy_quds_smuggling_networks_desc: "We rely on Quds Force smuggling networks to bypass sanctions, cutting the cost of foreign purchases while souring trade relations.\n\n$international_market_purchase_modifier$: §G-5%§!\n$MODIFIER_TRADE_OPINION_FACTOR$: §R-5%§!"
 internal_faction_policy_quds_operations_freeze_desc: "We freeze Quds Force operations abroad, mending trade relations at the cost of our foreign influence.\n\n$MODIFIER_TRADE_OPINION_FACTOR$: §G+10%§!\n$foreign_influence_modifier$: §R-5%§!"
 internal_faction_policy_jihadis_recruitment_drive_desc: "We back a jihadi recruitment drive, swelling our manpower pool while unsettling public stability.\n\n$MODIFIER_WEEKLY_MANPOWER$: §G+250§!\n$MODIFIER_STABILITY_FACTOR$: §R-2%§!"
 internal_faction_policy_jihadis_frontline_autonomy_desc: "We give jihadi fighters autonomy on the frontline, sharpening our attack power there at some cost to organization.\n\nArmy Attack: §G+3%§!\n$MODIFIER_ARMY_ORG_FACTOR$: §R-2%§!"
 internal_faction_policy_jihadis_martyr_glorification_desc: "We glorify jihadi martyrdom in state media, boosting war support while souring our trade relations.\n\n$MODIFIER_WAR_SUPPORT_FACTOR$: §G+5%§!\n$MODIFIER_TRADE_OPINION_FACTOR$: §R-5%§!"
 internal_faction_policy_jihadis_foreign_fighter_purge_desc: "We purge foreign fighters from our ranks, calming public stability at the cost of war support.\n\n$MODIFIER_STABILITY_FACTOR$: §G+3%§!\n$MODIFIER_WAR_SUPPORT_FACTOR$: §R-5%§!"
 internal_faction_policy_wall_street_deregulation_desc: "We deregulate Wall Street, lowering interest rates and the cost of managing economic cycles for financiers.\n\n$interest_rate_multiplier_modifier$: §G-0.5§!\n$econ_cycle_upg_cost_multiplier_modifier$: §G-5%§!"
 internal_faction_policy_wall_street_bailout_guarantee_desc: "We guarantee bailouts for Wall Street banks, cutting their exposure to economic cycles at the expense of corporate tax revenue.\n\n$econ_cycle_upg_cost_multiplier_modifier$: §G-10%§!\n$corporate_tax_income_multiplier_modifier$: §R-3%§!"
 internal_faction_policy_wall_street_dollar_diplomacy_desc: "We back dollar diplomacy abroad on behalf of Wall Street, boosting returns on investment and our foreign influence.\n\n$return_on_investment_modifier$: §G+1%§!\n$foreign_influence_modifier$: §G+5%§!"
 internal_faction_policy_wall_street_financial_regulation_desc: "We impose new financial regulation on Wall Street, raising the tax take while souring trade relations.\n\n$tax_gain_multiplier_modifier$: §G+4%§!\n$MODIFIER_TRADE_OPINION_FACTOR$: §R-5%§!"
 internal_faction_policy_chaebols_industrial_policy_desc: "We steer industrial policy toward the chaebols, expanding factory capacity at the cost of civilian tax revenue.\n\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §G+3%§!\n$civilian_industry_tax_modifier$: §R-5%§!"
 internal_faction_policy_chaebols_export_credits_desc: "We extend export credits to the chaebols, boosting their resource exports and international market earnings.\n\n$resource_export_multiplier_modifier$: §G+5%§!\n$international_market_income_modifier$: §G+5%§!"
 internal_faction_policy_chaebols_cross_shareholding_desc: "We tolerate cross-shareholding among the chaebols, cutting their investment costs while feeding corruption.\n\n$investment_cost_modifier$: §G-10%§!\n$corruption_cost_factor$: §R+10%§!"
 internal_faction_policy_chaebols_governance_reform_desc: "We force governance reform on the chaebols, raising their tax burden and shrinking their factory capacity.\n\n$civilian_industry_tax_modifier$: §G+8%§!\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: §R-5%§!"
