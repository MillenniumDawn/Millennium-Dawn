 VEN_mission_vuelta_al_campo_modifier: "ヴエルタ・アル・カンポ"
 VEN_mission_vuelta_al_campo_modifier_desc: "Mission Vuelta Al Campo (Return to the Countryside) sought to assist willing impoverished and unemployed Venezuelans in the cities to move to the countryside. It would help spur economic growth in areas while also providing a new life for these destitute Venezuelans and expand the economic base of the country."
