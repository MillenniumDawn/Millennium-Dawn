 module_naval_asw_nuclear_torpedoes_5: "핵 대잠 어뢰 V"
 module_naval_asw_nuclear_torpedoes_5_desc: "핵 대잠 어뢰는 대잠 운반 방식에 매우 강력한 탄두를 결합하여 잠항 중인 표적에 대한 치사율을 극대화합니다.\n\n§G설계 힌트: 핵 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 탁월한 대잠수함전 능력을 제공합니다. 전담 잠수함 사냥함에 적합하지만 기존 대잠 어뢰보다 IC와 인력 비용이 높습니다.§!"
 module_naval_asw_nuclear_torpedoes_6: "핵 대잠 어뢰 VI"
 module_naval_asw_nuclear_torpedoes_6_desc: "핵 대잠 어뢰는 대잠 운반 방식에 매우 강력한 탄두를 결합하여 잠항 중인 표적에 대한 치사율을 극대화합니다.\n\n§G설계 힌트: 핵 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 탁월한 대잠수함전 능력을 제공합니다. 전담 잠수함 사냥함에 적합하지만 기존 대잠 어뢰보다 IC와 인력 비용이 높습니다.§!"
 module_anti_ship_torpedoes_7: "겸용 어뢰 VII"
 module_anti_ship_torpedoes_7_desc: "근미래 겸용 어뢰는 어뢰 기술의 정점으로서 인공지능 보조 유도, 극한의 속도, 첨단 대대응책 체계를 결합하여 수중과 수상 전장을 모두 지배합니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_anti_ship_torpedoes_8: "겸용 어뢰 VIII"
 module_anti_ship_torpedoes_8_desc: "근미래 겸용 어뢰는 어뢰 기술의 정점으로서 인공지능 보조 유도, 극한의 속도, 첨단 대대응책 체계를 결합하여 수중과 수상 전장을 모두 지배합니다.\n\n§G설계 힌트: 겸용 어뢰는 수상함에 대한 어뢰 공격력과 잠수함에 대한 대잠수함전 능력을 제공합니다. 적정한 IC 비용으로 유연한 무장을 갖출 수 있지만 전용 대잠 무기보다는 특화도가 떨어집니다.§!"
 module_aa_guns_6: "대공포 VI"
 module_aa_guns_6_desc: "하이퍼 첨단 대공포는 속사 능력, 통합 센서 네트워크, 뛰어난 정확도를 결합하여 현대 및 신흥 항공 위협에 대한 포괄적인 방공을 제공합니다.\n\n§G설계 힌트: 대공포는 대공과 장갑을 향상시켜, 적 항공기로부터 전담 방호가 필요한 함선에 유용합니다.§!"
 module_aa_guns_7: "대공포 VII"
 module_aa_guns_7_desc: "울트라 첨단 대공포는 속사 능력, 통합 센서 네트워크, 뛰어난 정확도를 결합하여 현대 및 신흥 항공 위협에 대한 포괄적인 방공을 제공합니다.\n\n§G설계 힌트: 대공포는 대공과 장갑을 향상시켜, 적 항공기로부터 전담 방호가 필요한 함선에 유용합니다.§!"
 module_radar_8: "레이더 VIII"
 module_radar_8_desc: "하이퍼 첨단 레이더 기술은 네트워크 센서 융합, 극한 거리 탐지, 자동 위협 우선순위 판별을 통합하여 해군 탐지 및 표적 획득 능력의 정점을 보여줍니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
 module_radar_9: "레이더 IX"
 module_radar_9_desc: "울트라 첨단 레이더 기술은 네트워크 센서 융합, 극한 거리 탐지, 자동 위협 우선순위 판별을 통합하여 해군 탐지 및 표적 획득 능력의 정점을 보여줍니다.\n\n§G설계 힌트: 레이더는 수상 탐지와 잠수함 탐지를 향상시키는 동시에 대함 미사일, 어뢰 공격력, 대공을 강화합니다. 범용 전투함에 적합하지만 소나보다 IC와 마이크로칩 비용이 높습니다.§!"
