 JAP_diplomacy.11.t: "헌법 제9조 재해석에 대한 미국의 요청"
 JAP_diplomacy.11.d: "미국 정부가 우리 헌법 제9조를 추가로 재해석해 달라는 공식 요청을 해 왔습니다. 워싱턴은 지역 안보 환경이 크게 악화되어 일본이 집단 방위 부담을 더 많이 짊어져야 한다고 주장합니다. 이 요청을 받아들이면 자위권에 대한 더 폭넓은 해석과 더욱 긴밀한 군사 협력의 길이 열리겠지만, 국내의 논란이 없지는 않을 것입니다."
 JAP_diplomacy.11.a: "미국의 요청을 승인한다"
 JAP_diplomacy.11.b: "이 요청은 받아들일 수 없다"
 JAP_diplomacy.12.t: "일본의 제9조 재해석 거부"
 JAP_diplomacy.12.d: "도쿄는 현 시점에서 제9조를 추가로 재해석할 준비가 되어 있지 않다고 알려 왔습니다. 국내 여론, 헌법상의 제약, 정치적 안정에 대한 우려로 인해 일본 정부는 우리의 요청을 거절했습니다. 이제 우리는 그들의 결정을 존중할지, 아니면 외교적·안보적 압박을 높일지 결정해야 합니다."
 JAP_diplomacy.12.a: "그들의 결정을 존중한다"
 JAP_diplomacy.12.b: "일본에 대한 압박을 높인다"
 JAP_diplomacy.13.t: "일본의 제9조 재해석 수용"
 JAP_diplomacy.13.d: "도쿄는 제9조의 해석 수준을 변경하는 데 찬성하며 보다 적극적인 방위 파트너가 되기 위해 노력하겠다고 밝혔습니다."
 JAP_diplomacy.13.a: "드디어"
 JAP_diplomacy.14.t: "제9조에 대한 미국의 압박"
 JAP_diplomacy.14.d: "우리가 제9조의 해석 확대를 거부하자, 미국은 우리 정부에 대한 외교적·안보적 압박을 은밀히 높이기 시작했습니다. 동맹 협의, 언론 브리핑, 막후 메시지 모두 같은 방향을 가리킵니다. 워싱턴은 일본이 더 많은 책임을 짊어지기를 기대하고 있습니다. 우리는 버틸 수도, 조용히 입장을 바꿀 수도 있습니다."
 JAP_diplomacy.14.a: "굳건히 버틴다"
 JAP_diplomacy.14.b: "조용히 입장을 조정한다"
 JAP_diplomacy.15.t: "압박에 못 이긴 일본의 수용"
 JAP_diplomacy.15.d: "외교적·전략적 압박이 고조된 시기를 거쳐, 도쿄는 제9조에 관한 우리 입장에 더 가까이 다가갈 용의가 있음을 시사했습니다. 일본의 평화주의 원칙은 변함없다고 공개적으로 주장하면서도, 정부는 우리의 기대에 부합하는 방식으로 자위권 해석을 확대했습니다."
 JAP_diplomacy.15.a: "훌륭하군"
 JAP_diplomacy.17.t: "일본 상품에 대한 미국의 관세"
 JAP_diplomacy.17.d: "미국은 경제 불균형과 국내 정치적 압력을 이유로 일본의 주요 수출품을 겨냥한 새로운 관세 패키지를 발표했습니다. 이 조치는 '공정한 경쟁 환경'을 만들기 위한 것으로 포장되었지만, 도쿄에서는 우리 경제와 동맹 전반에 부담을 주는 정치적 동기의 조치로 널리 받아들여지고 있습니다."
 JAP_diplomacy.17.a: "이 새로운 현실에 적응해야 할 것이다"
 JAP_diplomacy.18.t: "일본의 관세 완화 요청"
 JAP_diplomacy.18.d: "도쿄는 일본 상품에 부과된 관세를 철폐해 달라고 공식 요청했습니다. 일본 대표들은 그 대가로 자국 정부가 안보 협력을 심화하고 방위 정책에서 더 나아갈 용의가 있을 수 있다고 암시합니다. 우리는 이 경제 분쟁을 전략적 기회로 전환할지, 아니면 압박을 유지할지 결정해야 합니다."
 JAP_diplomacy.18.a: "안보상의 양보를 대가로 관세를 철폐한다"
 JAP_diplomacy.18.b: "거절하고 관세를 유지한다"
 JAP_diplomacy.19.t: "관세 철폐, 안보상의 양보 요구"
 JAP_diplomacy.19.d: "미국은 일본산 수출품에 대한 관세를 철폐하는 데 동의했으나, 이는 안보와 방위에 관한 보다 폭넓은 합의의 일환일 뿐입니다. 사실상 일본이 제9조의 해석을 더욱 확대하고, 워싱턴과의 군사 협력을 심화하며, 지역 안보에서 더 큰 역할을 맡을 것으로 기대된다는 뜻입니다."
 JAP_diplomacy.19.a: "우리 경제와 동맹을 위해 이 부담을 받아들이겠다"
 JAP_diplomacy.20.t: "미국의 관세 철폐 거부"
 JAP_diplomacy.20.d: "미국 관세를 철폐해 달라는 우리의 공식 요청이 거절되었습니다. 워싱턴은 국내 정치적 압력과 안보 정책을 둘러싼 해소되지 않은 이견을 이유로 해당 조치가 유지될 것이라고 주장합니다. 국내에서는 수출업자와 기업 지도자들의 불만이 커지고 있으며, 전략가들은 이 분쟁이 동맹을 더욱 복잡하게 만들 수 있다고 경고합니다."
 JAP_diplomacy.20.a: "당분간은 압박을 견뎌야 할 것이다"
 JAP_diplomacy.21.t: "일본의 안전 보장 갱신 요청"
 JAP_diplomacy.21.d: "일본 정부는 미국에 갱신되었거나 강화된 안전 보장을 공식적으로 요청했습니다. 도쿄는 지역 안보 환경이 악화되었으며 보다 분명한 미국의 공약이 상황 안정에 도움이 될 것이라고 주장합니다. 비공식적으로 일본 관리들은 워싱턴이 명시적인 공약을 할 용의가 있다면 제9조 해석을 추가로 변경하는 것도 가능할 수 있음을 인정합니다."
 JAP_diplomacy.21.a: "더 깊은 공약을 대가로 안전 보장을 회복한다"
 JAP_diplomacy.21.b: "안전 보장의 연장을 거부한다"
 JAP_diplomacy.22.t: "안전 보장 회복"
 JAP_diplomacy.22.d: "미국은 일본에 대한 안전 보장을 갱신하고 명확히 하는 데 동의했습니다. 그 대가로 워싱턴은 도쿄가 제9조의 해석을 넓히고 지역 안보 책임을 더 많이 분담하는 추가 조치를 취하기를 기대합니다. 동맹은 더 강해지겠지만, 우리의 평화주의 원칙을 둘러싼 국내 논쟁은 격화될 것입니다."
 JAP_diplomacy.22.a: "우리의 안보를 위해 이 공약을 받아들이겠다"
 JAP_diplomacy.23.t: "미국의 강화된 안전 보장 거부"
 JAP_diplomacy.23.d: "갱신되었거나 강화된 안전 보장을 요청한 우리의 청이 거절되었습니다. 미국은 기존 합의로 충분하며 국내 정치적 제약 때문에 추가 공약에는 한계가 있다고 주장합니다. 일본 국내에서는 이 거부가 우리의 장기적 안보와 동맹의 신뢰성에 대한 우려를 부채질할 것입니다."
 JAP_diplomacy.23.a: "그렇다면 우리의 길을 재고해야 한다"
 JAP_diplomacy.24.t: "일본의 미국 해상 압박 중단 요청"
 JAP_diplomacy.24.d: "도쿄는 주요 해상 교통로와 요충지 주변에서 우리가 강화한 해군 주둔과 압박을 축소하거나 중단해 달라고 공식 요청했습니다. 일본 관리들은 현재의 태세가 긴장 고조의 위험이 있고 동맹에 대한 국내 지지를 약화시킨다고 주장합니다. 비공식적으로 그들은 우리가 태세를 완화한다면 제9조 해석을 추가로 변경하는 것도 가능할 수 있다고 시사합니다."
 JAP_diplomacy.24.a: "안보상의 양보를 대가로 해상 압박을 중단한다"
 JAP_diplomacy.24.b: "일본 주변의 해상 압박을 유지한다"
 JAP_diplomacy.25.t: "해상 압박 완화, 공약 심화"
 JAP_diplomacy.25.d: "미국은 일본이 더 깊은 안보 공약을 하는 대가로 일본의 해상 교통로 주변에서 강화했던 해군 주둔을 완화하기로 동의했습니다. 사실상 제9조 해석을 넓히고 지역 안보에서 우리의 역할을 확대하는 또 한 걸음을 뜻합니다. 동맹은 더욱 강해진 듯 보이지만, 우리의 평화주의 정체성을 둘러싼 국내 논쟁은 더욱 거세지기만 할 것입니다."
 JAP_diplomacy.25.a: "안정을 위해 이 거래를 이행하겠다"
 JAP_diplomacy.26.t: "미국의 해상 압박 중단 거부"
 JAP_diplomacy.26.d: "우리 해상 교통로 주변에서 강화된 미국의 해군 주둔을 완화하거나 중단해 달라는 우리의 요청이 거절되었습니다. 워싱턴은 지역적 위협을 고려할 때 현재의 태세가 필요하다고 주장합니다. 국내에서는 이 거부가 더 큰 분쟁에 휘말릴 것이라는 두려움과 일본 자체의 방위력을 더욱 강화하라는 목소리를 모두 부추길 것입니다."
 JAP_diplomacy.26.a: "그렇다면 압박 속에서 적응해야 한다"
 JAP_diplomacy.28.t: "가구야 달 탐사선 설계상의 난관"
 JAP_diplomacy.28.d: "야심 찬 가구야 달 탐사 임무가 심각한 설계상의 난관에 부딪히고 있습니다. 유도 및 전력 관리부터 열 방호에 이르기까지 핵심 시스템이 예상보다 복잡한 것으로 드러나고 있습니다. 기술자들은 추가 자금과 시간이 있으면 핵심 부품을 재설계하고 전반적인 신뢰성을 높일 수 있다고 주장하지만, 그에 드는 비용은 이미 내각에서 눈살을 찌푸리게 하고 있습니다."
 JAP_diplomacy.28.a: "재설계에 투자하고 일정을 빡빡하게 유지한다"
 JAP_diplomacy.28.b: "비용을 통제하고 더 긴 일정을 받아들인다"
 JAP_diplomacy.29.t: "가구야 통신 취약점"
 JAP_diplomacy.29.d: "시험이 계속되면서 가구야 계획은 심우주 통신과 데이터 링크의 약점을 드러내고 있습니다. 신호 무결성, 대역폭, 간섭 저항력이 모두 목표에 못 미칩니다. 전문가들은 새 안테나, 개선된 지상국, 더욱 견고한 암호화를 제안하지만, 이러한 개선에는 추가적인 정치적·재정적 자본이 필요할 것입니다."
 JAP_diplomacy.29.a: "통신 구조를 개선한다"
 JAP_diplomacy.29.b: "기존 시스템으로 진행하고 잘되기를 바란다"
 JAP_diplomacy.30.t: "가구야 임무의 추가 지연"
 JAP_diplomacy.30.d: "기술적 차질, 통합 문제, 발사 시설과의 일정 충돌로 인해 가구야 달 탐사 임무가 또다시 지연되었습니다. 핵심 시스템은 여전히 유망하지만, 이 사업은 점점 더디고 문제가 많은 것으로 여겨지고 있습니다. 과학자들은 인내가 보상받을 것이라고 주장하지만, 대중의 관심은 다른 곳으로 옮겨 가기 시작했습니다."
 JAP_diplomacy.30.a: "지연을 받아들이고 달을 향해 계속 나아간다"
 JAP_diplomacy.31.t: "달 표면에 도달한 가구야"
 JAP_diplomacy.31.d: "수년간의 설계 수정, 통신 개선, 어려운 지연 끝에 가구야 임무가 마침내 성공했습니다. 이제 일본의 하드웨어가 달 표면과 그 주변에서 작동하며 고해상도 영상과 귀중한 과학 데이터를 보내오고 있습니다. 이 성과는 일본의 첨단 기술 역량을 과시하며, 위성 개발과 심우주 탐사, 전략적 우주 활용을 위한 새로운 길을 열어 줍니다."
 JAP_diplomacy.31.a: "가구야를 일본 기술의 승리로 기념한다"
 jap_kaguya_satellite_invest_tt: "§G우주선의 설계 개선에 투자했으므로 다음을 얻었습니다.§!"
 jap_kaguya_rocketry_invest_tt: "§G우주선과의 통신 개선에 투자했으므로 다음을 얻었습니다.§!"
 JAP_diplomacy.32.t: "유도 소프트웨어 이상"
 JAP_diplomacy.32.d: "화성 탐사 임무의 기술자들이 유도 소프트웨어에서 반복적인 이상 현상이 발생하고 있다고 보고합니다. 아직 심각한 수준은 아니지만, 방치하면 중대한 항법 오류로 커질 수 있습니다. 완전히 고치려면 다른 프로젝트의 자원을 끌어와야 하며 전체 일정에 영향을 줄 수 있습니다."
 JAP_diplomacy.32.a: "자원을 돌려 제대로 해결한다"
 JAP_diplomacy.32.b: "지연을 받아들이고 점진적으로 패치한다"
 JAP_diplomacy.33.t: "화성 식민지 명명"
 JAP_diplomacy.33.d: "일본은 화성에 영구적인 발판을 확보했습니다. 거주 시설이 가동되고 첫 장기 체류 승무원들이 자리를 잡으면서, 상징적인 결정이 기다리고 있습니다. 바로 식민지의 공식 명칭과 성격입니다."
 JAP_diplomacy.33.a: "'아마테라스', 통합을 상징하는 찬란한 빛"
 JAP_diplomacy.33.b: "'가구쓰치', 타오르는 산업의 용광로"
 JAP_diplomacy.33.c: "'쓰쿠요미', 어둠 속의 고요한 관측소"
 JAP_diplomacy.33.e: "'스사노오', 폭풍이 스친 호전적 변경"
 JAP_diplomacy.68.t: "일본의 사할린 요구"
 JAP_diplomacy.68.d: "일본은 사할린의 반환을 공식 요구했습니다. 받아들이면 긴장은 누그러지겠지만, 굴욕적인 양보로 여겨질 것입니다."
 JAP_diplomacy.68.a: "요구를 승인한다"
 JAP_diplomacy.68.b: "단호히 거부한다"
 JAP_diplomacy.69.t: "사할린 반환"
 JAP_diplomacy.69.d: "모스크바가 우리의 요구를 받아들였습니다. 사할린은 이제 일본의 통치 아래 있습니다. 정부는 이를 제국의 질서가 돌아오고 있다는 증거로 내세울 것입니다."
 JAP_diplomacy.69.a: "역사적 바로잡음"
 JAP_diplomacy.70.t: "러시아의 거부"
 JAP_diplomacy.70.d: "모스크바는 사할린에 대한 우리의 요구를 거부했습니다. 우리는 일단 모욕을 삼키거나, 제한적인 국경 분쟁으로 러시아를 시험하거나, 전면전에 나설 수 있습니다."
 JAP_diplomacy.70.a: "일단은 물러선다"
 JAP_diplomacy.70.b: "국경 전쟁을 개시한다"
 JAP_diplomacy.70.c: "총력전을 선포한다"
 JAP_diplomacy.71.t: "일본의 북방 쿠릴 열도 요구"
 JAP_diplomacy.71.d: "일본은 북방 쿠릴 열도의 반환을 공식 요구했습니다. 받아들이면 긴장은 누그러지겠지만, 굴욕적인 양보로 여겨질 것입니다."
 JAP_diplomacy.71.a: "요구를 승인한다"
 JAP_diplomacy.71.b: "단호히 거부한다"
 JAP_diplomacy.72.t: "북방 쿠릴 열도 반환"
 JAP_diplomacy.72.d: "모스크바가 우리의 요구를 받아들였습니다. 북방 쿠릴 열도는 이제 일본의 통치 아래 있습니다. 정부는 이를 제국의 질서가 돌아오고 있다는 증거로 내세울 것입니다."
 JAP_diplomacy.72.a: "역사적 바로잡음"
 JAP_diplomacy.73.t: "러시아의 거부"
 JAP_diplomacy.73.d: "모스크바는 북방 쿠릴 열도에 대한 우리의 요구를 거부했습니다. 우리는 일단 모욕을 삼키거나, 제한적인 국경 분쟁으로 러시아를 시험하거나, 전면전에 나설 수 있습니다."
 JAP_diplomacy.73.a: "일단은 물러선다"
 JAP_diplomacy.73.b: "국경 전쟁을 개시한다"
 JAP_diplomacy.73.c: "총력전을 선포한다"
 JAP_diplomacy.74.t: "일본의 남방 쿠릴 열도 요구"
 JAP_diplomacy.74.d: "일본은 남방 쿠릴 열도의 반환을 공식 요구했습니다. 받아들이면 긴장은 누그러지겠지만, 굴욕적인 양보로 여겨질 것입니다."
 JAP_diplomacy.74.a: "요구를 승인한다"
 JAP_diplomacy.74.b: "단호히 거부한다"
 JAP_diplomacy.75.t: "남방 쿠릴 열도 반환"
 JAP_diplomacy.75.d: "모스크바가 우리의 요구를 받아들였습니다. 남방 쿠릴 열도는 이제 일본의 통치 아래 있습니다. 정부는 이를 제국의 질서가 돌아오고 있다는 증거로 내세울 것입니다."
 JAP_diplomacy.75.a: "역사적 바로잡음"
 JAP_diplomacy.76.t: "러시아의 거부"
 JAP_diplomacy.76.d: "모스크바는 남방 쿠릴 열도에 대한 우리의 요구를 거부했습니다. 우리는 일단 모욕을 삼키거나, 제한적인 국경 분쟁으로 러시아를 시험하거나, 전면전에 나설 수 있습니다."
 JAP_diplomacy.76.a: "일단은 물러선다"
 JAP_diplomacy.76.b: "국경 전쟁을 개시한다"
 JAP_diplomacy.76.c: "총력전을 선포한다"
 JAP_diplomacy.77.t: "도쿄의 합의안 제안"
 JAP_diplomacy.77.d: "쿠릴 열도와 사할린이 이제 일본의 통제 아래 놓이면서, 도쿄는 전장에서의 성과를 공식적인 합의로 전환하기 위해 재빨리 움직였습니다. 일본 외교관들은 전쟁이 이미 사안을 결정지었으며 더 이상의 전투는 불가피한 결과를 늦출 뿐이라고 주장하며, 분쟁을 끝내자는 제안을 들고 모스크바에 접근했습니다.\n그들의 제안은 간단합니다. 러시아가 쿠릴 열도와 사할린에 대한 일본의 지배를 공식적으로 인정하는 대가로 평화를 맺자는 것입니다. 도쿄의 관점에서 이는 지역을 안정시키고 전쟁의 추가 확대를 막기 위한 현실적인 조치입니다. 이제 결정은 우리에게 달려 있습니다. 새로운 현실을 받아들이고 전쟁을 끝낼 것인가, 아니면 제안을 거부하고 투쟁을 계속할 것인가."
 JAP_diplomacy.77.a: "합의를 받아들인다."
 JAP_diplomacy.77.b: "거부한다. 전쟁은 계속된다."
 JAP_diplomacy.78.t: "합의 수락"
 JAP_diplomacy.78.d: "제안이 받아들여지고, 총성이 잦아들기 시작합니다. 교전 중단 명령이 내려지고, 외교 채널이 다시 열리며, 전쟁은 일련의 조항과 좌표로 축소됩니다.\n\n북방의 섬들은 평화의 대가로 양도되며, 모든 당사자는 이제 결과를 자국민에게 설득해야 합니다. 전역은 끝나지만, 그 기억은 사라지지 않을 것입니다."
 JAP_diplomacy.78.a: "그렇게 하자. 피 대신 잉크가 흐르게 하라."
 JAP_diplomacy.79.t: "합의 거부"
 JAP_diplomacy.79.d: "상대방의 대답은 단호한 거절입니다. 서명도, 인정도, 숨 돌릴 틈도 없을 것입니다.\n\n도쿄는 우리의 결의를 잘못 읽었으며, 분쟁은 어느 한쪽이 더는 버틸 수 없을 때까지 계속될 것입니다. 평화가 온다면 그것은 강제로 이루어질 것입니다."
 JAP_diplomacy.79.a: "그렇다면 계속 싸운다."
 JAP_diplomacy.80.t: "출구를 모색하는 모스크바"
 JAP_diplomacy.80.d: "북방에서 일본이 진격한 이후, 러시아 외교관들은 상황이 악화되기 전에 전투를 끝낼 의사가 있음을 내비칩니다. 메시지는 실용적입니다. 출혈을 멈추고, 전선을 동결하며, 어느 쪽도 정당화할 수 없을 만큼 전쟁이 자원을 소모하는 것을 막자는 것입니다.\n\n제안은 단순한 평화로, 계속되는 확전 대신 즉각적인 적대 행위 종식을 맞바꾸자는 것입니다. 우리는 불완전한 합의를 받아들일지, 우위를 더 밀어붙일지 결정해야 합니다."
 JAP_diplomacy.80.a: "평화를 받아들인다."
 JAP_diplomacy.80.b: "아니다. 계속 밀어붙인다."
 JAP_diplomacy.81.t: "평화를 받아들인 도쿄"
 JAP_diplomacy.81.d: "일본은 전쟁을 확대하는 대신 끝내는 쪽을 택하여 조건에 동의합니다. 이 결정은 일부 지역에서 인기가 없으며, 신뢰가 흔들리고 국민이 애초에 왜 전투가 시작되었는지 의문을 품으면서 그 대가가 국내에서 체감됩니다.\n\n무승부 평화가 선언되고 영토 양보가 집행됩니다. 전장은 조용해지지만 정치적 타격은 오래 남을 것입니다."
 JAP_diplomacy.81.a: "이를 삼키고 견딜 것이다."
 JAP_diplomacy.82.t: "도쿄의 거부"
 JAP_diplomacy.82.d: "일본은 제안을 거부하며, 약함에서 나온 합의는 받아들이지 않겠다고 시사합니다. 전투는 계속될 것이며, 시간이 흐를수록 판돈은 커집니다.\n\n평화가 온다면 그것은 주어지는 것이 아니라 쟁취하는 것이 될 것입니다."
 JAP_diplomacy.82.a: "그렇다면 어쩔 수 없다."
 JAP_unlock_sikhalin_raid_tt: "§Y$STATE_691$§!에서 §Y특수 부대 습격§! 잠금 해제"
 JAP_diplomacy.83.t: "남방 쿠릴 열도에서의 승리"
 JAP_diplomacy.83.d: "일본군이 남방 쿠릴 열도에서 승리하여 러시아 부대를 밀어내고 분쟁 지역을 장악했습니다. 지도상으로는 작은 결과이지만 그 메시지는 요란합니다. 일본은 자신이 주장하는 것을 취할 수 있고 압박 속에서도 지켜 낼 수 있다는 것입니다.\n\n깃발이 오르고, 수비대는 참호를 파며, 도쿄는 다음 수를 준비합니다. 모스크바는 이를 잊지 않을 것입니다."
 JAP_diplomacy.83.a: "섬들을 확보한다."
 JAP_diplomacy.84.t: "남방 쿠릴 열도에서의 패배"
 JAP_diplomacy.84.d: "남방 쿠릴 열도의 국경 충돌은 우리에게 불리하게 전개되었습니다. 러시아의 저항은 굳건했고, 우리 부대는 포화 속에서 철수할 수밖에 없었으며, 주권 문제는 해결되지 않은 채 우리 지도부는 비판의 도마에 올랐습니다.\n\n그 과정에서 우리는 뼈아픈 교훈을 얻었습니다. 다음 시도는 더 잘 계획되고, 더 잘 보급되며, 막기가 더 어려울 것입니다."
 JAP_diplomacy.84.a: "차질에서 교훈을 얻는다."
 JAP_diplomacy.85.t: "남방 쿠릴 열도에서의 차질"
 JAP_diplomacy.85.d: "러시아군은 일본의 단호한 공세 앞에서 남방 쿠릴 열도를 지키지 못했습니다. 당장의 전술적 손실은 뼈아프지만, 정치적 신호는 더욱 날카롭습니다. 국경은 취약하며 상대는 이를 바꾸기 위해 대가를 치를 용의가 있다는 것입니다.\n\n모스크바는 확전할지, 아니면 현지에서의 굴욕적인 새 사실을 받아들일지 결정해야 할 것입니다."
 JAP_diplomacy.85.a: "쓰라린 교훈이다."
 JAP_diplomacy.86.t: "남방 쿠릴 열도 확보"
 JAP_diplomacy.86.d: "러시아군이 국경 충돌에서 승리하여 남방 쿠릴 열도를 확보했고, 일본 부대를 몰아내 전선 전반의 통제권을 회복했습니다. 이 작전은 즉각적인 대응 태세와 침범을 신속히 응징할 능력을 보여 줍니다.\n\n도쿄는 일시적 차질이라 부를지 모르나 메시지는 분명합니다. 이 섬들은 값싸게 빼앗기지 않을 것입니다."
 JAP_diplomacy.86.a: "전선을 사수한다."
 JAP_diplomacy.87.t: "북방 쿠릴 열도에서의 승리"
 JAP_diplomacy.87.d: "일본은 북방 쿠릴 열도에서 돌파구를 마련하여 러시아 부대를 후퇴시켰고 섬들은 우리의 통제 아래 놓였습니다. 이 작전은 계획, 타이밍, 결의가 맞아떨어지면 외딴 지형조차 점령할 수 있음을 증명합니다.\n\n점령은 즉시 시작됩니다. 보급품이 흘러들고, 방어 시설이 올라가며, 북방 국경은 행동으로 다시 쓰입니다."
 JAP_diplomacy.87.a: "참호를 파고 대비한다."
 JAP_diplomacy.88.t: "북방 쿠릴 열도에서의 패배"
 JAP_diplomacy.88.d: "북방 쿠릴 열도는 우리의 공격을 버텨 냈습니다. 전투는 가혹했고 환경은 더 나빴으며, 러시아군은 우리의 진격을 무디게 하고 철수를 강요하는 데 성공했습니다.\n\n우리는 피와 피로로 치른 경험을 안고 돌아옵니다. 다음에는 준비 없이 도착하지 않을 것입니다."
 JAP_diplomacy.88.a: "적응할 것이다."
 JAP_diplomacy.89.t: "북방 쿠릴 열도에서의 상실"
 JAP_diplomacy.89.d: "일본의 성공적인 작전으로 러시아는 북방 쿠릴 열도의 진지에서 밀려났습니다. 이 손실은 영토적일 뿐 아니라 심리적이기도 하여, 거리와 날씨가 더 이상 믿을 만한 방어책이 아님을 보여 줍니다.\n\n대응이 요구되겠지만 보복에는 그 나름의 위험이 따릅니다. 상황은 빠르게 악화되고 있습니다."
 JAP_diplomacy.89.a: "이대로 둘 수 없다."
 JAP_diplomacy.90.t: "북방 쿠릴 열도 사수"
 JAP_diplomacy.90.d: "러시아군은 침공을 격퇴하고 북방 쿠릴 열도를 지켜 냈으며, 일본 부대를 물리치고 어려운 조건 속에서 통제권을 회복했습니다. 이 방어전은 교리를 날카롭게 다듬고 지휘 계통 전반의 자신감을 높였습니다.\n\n일본이 이 섬들을 원한다면 국경 충돌보다 훨씬 더 많은 것을 걸어야 할 것입니다."
 JAP_diplomacy.90.a: "대응 태세를 유지한다."
 JAP_diplomacy.91.t: "사할린에 대한 러시아의 대응"
 JAP_diplomacy.91.d: "사할린에서의 일본의 움직임은 모스크바의 즉각적인 대응을 촉발했습니다. 러시아 지도부는 이 행동을 주권에 대한 직접적 도전으로 규정하고, 추가 진격을 결과 없이 용인하지 않겠다고 시사합니다.\n\n위기는 이제 두 갈래로 나뉩니다. 전면전으로의 확전, 아니면 경제 조치와 해상 제한을 통한 강압적 압박입니다. 어느 쪽이든 온도는 차분한 외교의 한계를 넘어 올랐습니다."
 JAP_diplomacy.91.a: "이것은 전쟁이 될 것이다."
 JAP_diplomacy.91.b: "금수 조치와 봉쇄로 목을 조른다."
 JAP_diplomacy.92.t: "사할린 점령에 대한 러시아의 응수"
 JAP_diplomacy.92.d: "사할린의 주인이 바뀌었고, 모스크바는 이제 자국 코앞에서 당한 굴욕에 어떻게 대응할지 결정해야 합니다. 전쟁은 큰 대가를 치르겠지만, 대응하지 않으면 추가적인 손실을 부르고 국가의 권위를 약화시킬 것입니다.\n\n러시아는 확전을 택해 무력으로 결과를 되돌리려 하거나, 사할린의 반환을 전투 중단의 대가로 요구하면서 전투를 끝내는 일시적 평화를 받아들일 수 있습니다. 이 결정이 분쟁의 다음 국면을 규정할 것입니다."
 JAP_diplomacy.92.a: "무력으로 되찾을 것이다."
 JAP_diplomacy.92.b: "합의를 강요한다. 사할린은 반환되어야 한다."
 JAP_diplomacy.94.t: "도쿄의 보호국화 요구"
 JAP_diplomacy.94.d: "외교적 수사를 걷어 낸 채 의도가 짙게 밴 공식 문서가 일본에서 도착했습니다. 서울에는 안정이라는 이름으로 제시된 선택지가 주어졌습니다. 외교 정책과 안보 사안에 대한 일본의 감독을 받아들이고, 제도를 도쿄의 방향에 맞추며, 파괴적인 대결을 피하라는 것입니다.\n\n메시지는 분명합니다. 일본은 더 이상 협력을 요청하는 것이 아니라 조건을 강요하고 있습니다. 거부는 반항으로 취급될 것이며, 반항에는 대가가 따를 것입니다."
 JAP_diplomacy.94.a: "받아들일 수밖에 없다."
 JAP_diplomacy.94.b: "거부한다. 한국은 굴복하지 않는다."
 JAP_diplomacy.95.t: "대한민국의 굴복"
 JAP_diplomacy.95.d: "서울은 주권 대신 생존을 택하여 조건을 받아들입니다. 압박 속에서 협정이 체결되고, 고문단이 도착하며, 국가의 대외 노선은 일본의 전략 구상에 편입됩니다.\n\n전쟁은 끝나지만 다른 종류의 투쟁이 시작됩니다. 한국은 여전히 지도 위에 남아 있지만, 그 방향은 더 이상 스스로의 것이 아닙니다."
 JAP_diplomacy.95.a: "보호국을 수립한다."
 JAP_diplomacy.96.t: "도쿄에 맞선 대한민국"
 JAP_diplomacy.96.d: "서울은 최후통첩을 거부하며 주권은 협상의 대상이 아니라고 선언합니다. 이 거부로 위기는 강압에서 대결로 바뀌었고, 도쿄는 이제 이 문제가 무력으로만 해결될 수 있다고 주장할 모든 구실을 얻었습니다.\n\n일본이 굴복을 원했다면, 그 대신 도전을 받은 셈입니다."
 JAP_diplomacy.96.a: "그렇다면 우리의 뜻을 관철할 것이다."
 JAP_diplomacy.97.t: "도쿄의 평양 최후통첩"
 JAP_diplomacy.97.d: "일본은 평양에 최후통첩을 전달했습니다. 감독 하의 봉쇄된 미래, 또는 폭격 아래의 파멸된 미래를 제시하는 것입니다. 조건은 노골적입니다. 대외 정책과 전략적 자율성을 도쿄의 지시에 넘기고, 감시받는 안보 체제를 받아들이며, 북쪽이 다시는 위협이 되지 못하도록 설계된 틀에 복종하라는 것입니다.\n\n정권에게 이것은 굴욕입니다. 일본에게는 위험 관리입니다. 문제는 평양이 생존을 택할지 반항을 택할지입니다."
 JAP_diplomacy.97.a: "받아들인다. 어떤 대가를 치르더라도 국가를 보존한다."
 JAP_diplomacy.97.b: "거부한다. 굴복하지 않는다."
 JAP_diplomacy.98.t: "평양의 굴복"
 JAP_diplomacy.98.d: "모든 예상을 뒤엎고 북측이 조건을 받아들입니다. 정권은 상징을 유지하지만, 일본의 감독이 국경, 안보, 대외 관계를 재편하면서 행동의 자유는 꺾입니다.\n\n전투는 끝나고, 한반도 북부는 통제된 완충 지대가 됩니다. 위협은 무력화되었으며, 도쿄는 쉽게 놓지 않을 지렛대를 얻었습니다."
 JAP_diplomacy.98.a: "보호국을 수립한다."
 JAP_diplomacy.99.t: "도쿄에 맞선 평양"
 JAP_diplomacy.99.d: "평양은 최후통첩을 거부하고 반항을 택하며, 공포와 확전이 정권을 지켜 주리라 내기를 겁니다. 이 거부로 위기는 의지의 시험대가 되었고, 도쿄는 이제 북측을 무력으로만 제압할 수 있다고 주장할 명분을 얻었습니다.\n\n한반도는 전쟁에 대비합니다. 다음 메시지는 문서가 아니라 불이 될 것입니다."
 JAP_diplomacy.99.a: "그렇다면 우리가 직접 위협을 끝내겠다."
 JAP_diplomacy.101.t: "도쿄의 대만 복종 요구"
 JAP_diplomacy.101.d: "일본은 타이베이에 직접적인 요구를 전달했습니다. 보호국 체제를 받아들이고 외교 정책과 방위 협력을 도쿄의 감독 아래 두거나, 아니면 고립과 무력에 직면하라는 것입니다. 이 제안은 안보와 안정이라는 이름으로 포장되어, 정치적 복종의 대가로 외부 위협으로부터의 보호를 약속합니다.\n\n공식적인 언어 뒤에는 단순한 메시지가 있습니다. 이 섬은 독립된 채로 두기에는 너무 중요하며, 일본이 그 미래를 결정할 작정이라는 것입니다."
 JAP_diplomacy.101.a: "조건을 받아들인다. 재앙을 피한다."
 JAP_diplomacy.101.b: "거부한다. 대만은 굴복하지 않는다."
 JAP_diplomacy.102.t: "타이베이의 수락"
 JAP_diplomacy.102.d: "대만은 공개적인 분쟁 대신 생존과 존속을 택하여 최후통첩을 받아들입니다. 새로운 협정이 대외 노선을 일본에 묶고, 고문단이 도착하며, 전략적 의사 결정은 조용히 도쿄 쪽으로 옮겨 갑니다.\n\n전쟁은 끝나지만 주권은 보호국이 허용하는 범위로 좁아집니다. 섬은 남아 있으나 그 방향은 더 이상 온전히 스스로의 것이 아닙니다."
 JAP_diplomacy.102.a: "보호국을 수립한다."
 JAP_diplomacy.103.t: "타이베이의 거부"
 JAP_diplomacy.103.d: "대만은 일본의 요구를 거부하고 보호의 약속과 자율성을 맞바꾸기를 거절합니다. 이 결정으로 외교적 압박은 무력 위기로 바뀌었고, 도쿄는 이제 이 섬을 정복으로만 확보할 수 있다고 주장할 명분을 얻었습니다.\n\n해협은 단층선이 됩니다. 다음 단계는 협상이 아니라 동원이 될 것입니다."
 JAP_diplomacy.103.a: "그렇다면 필요한 것을 취하겠다."
 JAP_diplomacy.105.t: "도쿄의 필리핀 보호국화 요구"
 JAP_diplomacy.105.d: "일본은 마닐라에 오해의 여지가 거의 없는 요구를 제시했습니다. 보호국 체제를 받아들이고, 외교 정책과 방위 계획을 도쿄에 맞추며, 주요 안보 체제에 대한 일본의 감독을 허용하거나, 아니면 거부의 결과에 직면하라는 것입니다.\n\n이 제안은 안정과 보호로 포장되어 있으나, 그 목적은 해상 교통로와 두 대양 사이의 관문을 장악하는 것입니다. 필리핀은 이제 복종과 대결 사이에서 선택해야 합니다."
 JAP_diplomacy.105.a: "받아들인다. 국가가 파괴되는 것을 막는다."
 JAP_diplomacy.105.b: "거부한다. 도쿄의 지배를 받지 않겠다."
 JAP_diplomacy.106.t: "마닐라의 굴복"
 JAP_diplomacy.106.d: "필리핀 정부가 일본의 조건을 받아들입니다. 협정이 체결되고, 고문단이 도착하며, 나라의 대외 노선은 일본의 해양 구상에 편입됩니다.\n\n전투는 끝나지만 그 대가는 주권입니다. 군도는 남아 있으나 그 전략적 결정은 도쿄가 모든 어깨너머로 지켜보는 가운데 내려질 것입니다."
 JAP_diplomacy.106.a: "보호국을 수립한다."
 JAP_diplomacy.107.t: "도쿄에 맞선 마닐라"
 JAP_diplomacy.107.d: "필리핀은 최후통첩을 거부하고 보호의 약속과 독립을 맞바꾸기를 거절합니다. 이 거부로 일본의 강압은 무력의 시험대가 되었고, 도쿄는 이제 군도를 무력으로 확보해야 한다고 주장할 모든 구실을 얻었습니다.\n\n해상 교통로는 조여지고, 함대는 위세를 과시하기 시작하며, 지역은 전쟁에 대비합니다. 다음 수는 외교적이지 않을 것입니다."
 JAP_diplomacy.107.a: "그렇다면 군도를 점령하겠다."
 JAP_diplomacy.109.t: "해협 최후통첩"
 JAP_diplomacy.109.d: "불가피함을 담은 차분한 어조의 일본 문서가 도착합니다. 쿠알라룸푸르에는 외교 정책과 안보 협조를 도쿄의 방향에 묶는 보호국 체제가 제시되었으며, 이는 해상 교통로와 요충지가 생존을 좌우하는 지역에서의 안정의 대가로 정당화됩니다.\n\n이 메시지는 요청이 아닙니다. 일본은 해협을 장악할 작정이며, 말라야는 따르기를 기대받고 있습니다. 수락은 보호를 약속하고, 거부는 해양 강압의 전면적인 무게를 불러들입니다."
 JAP_diplomacy.109.a: "받아들인다. 시류에 맞서 싸울 수는 없다."
 JAP_diplomacy.109.b: "거부한다. 우리의 주권은 팔 물건이 아니다."
 JAP_diplomacy.110.t: "떠오르는 태양에 고개를 숙인 쿠알라룸푸르"
 JAP_diplomacy.110.d: "말레이시아는 전략적 독립을 당장의 생존과 맞바꾸며 조건을 받아들입니다. 협정이 체결되고, 연락 사절단이 도착하며, 도쿄는 두 대양을 잇는 통로의 열쇠를 손에 넣습니다.\n\n전쟁은 끝나지만 그 대가는 분명합니다. 말라야는 온전히 남아 있으나 그 대외 노선은 이제 일본의 그림자 속에서 움직입니다."
 JAP_diplomacy.110.a: "보호국을 수립한다."
 JAP_diplomacy.111.t: "해협 질서를 거부한 말라야"
 JAP_diplomacy.111.d: "말레이시아는 최후통첩을 거부하고 자국의 미래를 도쿄가 좌우하도록 두지 않겠다고 합니다. 이 결정으로 일본의 압박은 지역에서 가장 가치 있는 해상 통로를 둘러싼 대결로 바뀌었습니다.\n\n도쿄는 해협에서의 반항을 용납하지 않을 것입니다. 말라야가 조약으로 복종하지 않는다면, 일본은 무력으로 복종을 받아 내려 할 것입니다."
 JAP_diplomacy.111.a: "그렇다면 해협을 점령하겠다."
 JAP_diplomacy.113.t: "군도 칙령"
 JAP_diplomacy.113.d: "도쿄는 자카르타에 인도네시아 독립의 핵심을 겨냥한 요구를 제시했습니다. 이 제안은 외교 정책과 전략적 안보를 일본의 감독 아래 두는 보호국 체제로, 두 대양을 잇는 도서 열도 전체의 안정을 보장하는 유일한 방법이라는 이유로 정당화됩니다.\n\n표현은 정중하지만 의도는 절대적입니다. 일본은 인도네시아 군도를 주권을 가진 파트너가 아닌 통제된 통로로 원합니다. 수락은 그림자 아래의 안전을, 거부는 그림자가 폭풍이 됨을 의미합니다."
 JAP_diplomacy.113.a: "받아들인다. 해상 교살은 견딜 수 없다."
 JAP_diplomacy.113.b: "거부한다. 인도네시아는 명령받지 않는다."
 JAP_diplomacy.114.t: "칙령을 수락한 자카르타"
 JAP_diplomacy.114.d: "인도네시아는 조건을 받아들이고 새로운 해양 현실에 복종합니다. 일본 사절단이 도착하여 안보 협조, 기지 사용권, 대외 노선을 감독하며, 군도를 도쿄의 전략권 안에서 관리되는 통로로 바꿔 놓습니다.\n\n전쟁은 끝나지만 독립은 허용된 범위로 좁아집니다. 섬들은 이름만 인도네시아의 것으로 남아 있으며, 그 방향은 이제 일본의 힘에 의해 제약받습니다."
 JAP_diplomacy.114.a: "보호국을 수립한다."
 JAP_diplomacy.115.t: "군도 칙령을 거부한 인도네시아"
 JAP_diplomacy.115.d: "자카르타는 일본의 요구를 거부하고 안정의 약속과 주권을 맞바꾸기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 인도네시아의 독립을 존중해야 할 사실이 아니라 제거해야 할 장애물로 취급합니다.\n\n군도 주변의 바다는 긴장이 고조됩니다. 인도네시아가 조약으로 굴복하지 않는다면, 일본은 무력으로 복종을 강요하려 할 것입니다."
 JAP_diplomacy.115.a: "그렇다면 통로를 장악하겠다."
 JAP_diplomacy.117.t: "통킹의 선택"
 JAP_diplomacy.117.d: "도쿄는 하노이에 베트남을 일본의 해양 질서에 묶어 두려는 요구를 전달했습니다. 이 제안은 이름만 아닐 뿐 보호국 체제입니다. 외교 정책을 맞추고, 일본의 안보 감독을 받아들이며, 베트남의 해안선을 일본의 영향권 확장으로 바꾸는 전략적 접근을 허용하라는 것입니다.\n\n이 메시지는 더 큰 포식자들로부터의 보호로 포장되어 있지만, 동시에 목줄이기도 합니다. 베트남은 제약 속의 생존을 받아들일지, 아니면 저항하여 자국 해안을 따라 벌어질 전쟁을 불러들일지 결정해야 합니다."
 JAP_diplomacy.117.a: "받아들인다. 당분간은 굽히겠다."
 JAP_diplomacy.117.b: "거부한다. 베트남은 묶이지 않는다."
 JAP_diplomacy.118.t: "도쿄 조건을 수락한 하노이"
 JAP_diplomacy.118.d: "베트남이 최후통첩을 받아들입니다. 협정이 체결되고, 연락 장교들이 도착하며, 일본은 베트남의 대외 노선과 해안 안보에 결정적인 영향력을 얻습니다.\n\n전쟁은 끝나지만 독립은 좁아집니다. 베트남은 남아 있으나 그 전략적 노선은 이제 도쿄에서 쓰인 틀 안에서 움직입니다."
 JAP_diplomacy.118.a: "보호국을 수립한다."
 JAP_diplomacy.119.t: "하노이의 통킹 선택 거부"
 JAP_diplomacy.119.d: "베트남은 일본의 요구를 거부하고 안보의 약속과 주권을 맞바꾸기를 거절합니다. 이 거부로 강압은 대결로 바뀌었고, 도쿄는 이제 베트남을 자신의 지역 구상에서 제거해야 할 장벽으로 취급합니다.\n\n해안선은 최전선이 됩니다. 베트남이 조약으로 복종하지 않는다면, 일본은 무력으로 복종을 받아 내려 할 것입니다."
 JAP_diplomacy.119.a: "그렇다면 해안을 점령하겠다."
 JAP_diplomacy.121.t: "메콩 최후통첩"
 JAP_diplomacy.121.d: "외교라기보다 판결문에 가까운 제안을 든 일본 대표단이 도착합니다. 캄보디아에는 도쿄의 감독 아래 보호가 제안되었으며, 외교 정책 조율과 안보 체제가 일본의 지역 틀 안에 놓이게 됩니다.\n\n내세우는 것은 안정, 투자, 더 강한 이웃으로부터의 안전입니다. 현실은 종속입니다. 프놈펜은 지켜지는 미래를 받아들일지, 아니면 거부하여 전장이 될 위험을 감수할지 선택해야 합니다."
 JAP_diplomacy.121.a: "받아들인다. 생존이 우선이다."
 JAP_diplomacy.121.b: "거부한다. 캄보디아는 굴복하지 않는다."
 JAP_diplomacy.122.t: "프놈펜의 수락"
 JAP_diplomacy.122.d: "캄보디아는 이길 수 없는 전쟁을 피하기 위해 조건을 받아들이고 전략적 자율성을 양보합니다. 새로운 협정이 국가를 일본의 방향에 묶고, 도쿄의 고문단은 서둘러 주요 부처와 접근 지점을 확보합니다.\n\n전투는 시작되기도 전에 끝납니다. 캄보디아는 이름만 주권국으로 남아 있으나 그 길은 이제 일본의 힘에 의해 제약받습니다."
 JAP_diplomacy.122.a: "보호국을 수립한다."
 JAP_diplomacy.123.t: "메콩 최후통첩을 거부한 캄보디아"
 JAP_diplomacy.123.d: "프놈펜은 일본의 요구를 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 캄보디아를 바로잡아야 할 약한 고리로 취급합니다.\n\n외교는 실패했습니다. 캄보디아가 이 틀을 받아들이지 않는다면, 일본은 무력으로 이를 강요하려 할 것입니다."
 JAP_diplomacy.123.a: "그렇다면 복종을 강제하겠다."
 JAP_diplomacy.125.t: "메콩 배후지 지령"
 JAP_diplomacy.125.d: "일본은 해안 뒤편의 조용한 종심을 확보하려는 요구를 비엔티안에 제시했습니다. 이 제안은 라오스를 도쿄의 전략적 방향에 묶고 외교 정책과 안보 협조를 일본의 감독 아래 두는 보호국 체제입니다.\n\n이 제안은 발전과 보호로 제시됩니다. 그 의미는 분명합니다. 통로, 강, 국경이 일본의 더 넓은 세력권에 봉사하도록 관리되리라는 것입니다. 라오스는 지령을 받아들일지, 저항에 도박을 걸지 결정해야 합니다."
 JAP_diplomacy.125.a: "받아들인다. 홀로 설 수는 없다."
 JAP_diplomacy.125.b: "거부한다. 라오스는 지시받지 않는다."
 JAP_diplomacy.126.t: "비엔티안의 수락"
 JAP_diplomacy.126.d: "라오스는 감당할 수 없는 전쟁 대신 생존과 안정을 택하여 일본의 조건을 받아들입니다. 협정이 체결되고, 조율 사무소가 설치되며, 라오스는 통제된 배후지로서 도쿄의 지역 틀에 편입됩니다.\n\n전투는 끝나지만 자율성은 줄어듭니다. 라오스는 남아 있으나 그 전략적 선택은 이제 일본이 정한 한계 안에서 움직입니다."
 JAP_diplomacy.126.a: "보호국을 수립한다."
 JAP_diplomacy.127.t: "지령을 거부한 라오스"
 JAP_diplomacy.127.d: "비엔티안은 일본의 요구를 거부하고 자국의 미래를 외부의 감독에 넘기기를 거절합니다. 이 거부로 강압은 대결로 바뀌었고, 도쿄는 이제 라오스를 구애할 파트너가 아니라 통로 장악의 장애물로 취급합니다.\n\n라오스가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 이를 강요하려 할 것입니다."
 JAP_diplomacy.127.a: "그렇다면 그들을 굴복시키겠다."
 JAP_diplomacy.129.t: "남방 닻 최후통첩"
 JAP_diplomacy.129.d: "도쿄는 캔버라에 오스트레일리아를 먼 대륙이 아닌 남태평양의 쐐기돌로 취급하는 최후통첩을 전달했습니다. 조건은 냉혹합니다. 보호국 체제를 받아들이고, 외교 정책과 방위 계획을 일본에 맞추며, 남태평양을 도쿄의 영향권에 묶어 둘 기지 사용 및 접근 체제를 허용하라는 것입니다.\n\n이 제안은 안정과 보장된 안보로 위장되어 있습니다. 현실은 전략적 복종입니다. 오스트레일리아는 일본의 그림자 아래의 삶을 받아들일지, 아니면 바다 자체를 두고 다툴 준비를 할지 결정해야 합니다."
 JAP_diplomacy.129.a: "받아들인다. 태평양을 건 전쟁에서는 이길 수 없다."
 JAP_diplomacy.129.b: "거부한다. 오스트레일리아는 굴복하지 않는다."
 JAP_diplomacy.130.t: "닻 조건을 수락한 캔버라"
 JAP_diplomacy.130.d: "오스트레일리아는 위험을 무릅쓸 수 없는 대륙 전쟁 대신 당장의 생존을 택하여 일본의 최후통첩을 받아들입니다. 협정이 체결되고, 전략적 접근권이 부여되며, 일본은 더 넓은 대양을 지배하기 위해 추구했던 남방의 닻을 얻습니다.\n\n총성은 멎지만 태평양의 균형은 하룻밤 사이에 바뀝니다. 오스트레일리아는 지도에 남아 있으나 그 전략적 결정은 이제 도쿄가 정한 한계 안에서 움직입니다."
 JAP_diplomacy.130.a: "보호국을 수립한다."
 JAP_diplomacy.131.t: "최후통첩을 거부한 오스트레일리아"
 JAP_diplomacy.131.d: "캔버라는 일본의 요구를 거부하고 대륙의 독립을 외국의 위임 통치에 넘기기를 거절합니다. 이 거부로 도쿄의 압박은 직접적인 도전이 되었고, 일본은 이제 오스트레일리아를 자국이 통제하는 태평양 질서의 마지막 장애물로 규정합니다.\n\n바다를 둘러싼 다툼은 피할 수 없습니다. 오스트레일리아가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 이를 강요하려 할 것입니다."
 JAP_diplomacy.131.a: "그렇다면 무력으로 남방을 확보하겠다."
 JAP_diplomacy.133.t: "태즈먼 선 요구"
 JAP_diplomacy.133.d: "도쿄는 웰링턴에 남태평양의 마지막 열린 측면을 닫기 위한 요구를 전달했습니다. 이 제안은 뉴질랜드의 외교 정책과 방위 태세를 일본의 방향에 묶는 보호국 체제로, 무력으로 재편되고 있는 대양의 안정을 위한 대가로 정당화됩니다.\n\n표현은 보호와 동반자 관계를 말하지만, 구조는 통제입니다. 뉴질랜드는 일본의 그림자 아래 제약된 평화와 바다 건너의 독립 전쟁 사이에서 선택해야 합니다."
 JAP_diplomacy.133.a: "받아들인다. 견디고 살아남겠다."
 JAP_diplomacy.133.b: "거부한다. 흡수되지 않겠다."
 JAP_diplomacy.134.t: "웰링턴의 태즈먼 선 수락"
 JAP_diplomacy.134.d: "뉴질랜드는 적대 행위의 종식을 위해 전략적 자율성을 맞바꾸며 일본의 조건을 받아들입니다. 협정이 체결되고, 접근 체제가 마련되며, 도쿄는 더 넓은 대양을 좌우할 안전한 남방 전초기지를 얻습니다.\n\n전쟁은 끝나지만 독립은 좁아집니다. 뉴질랜드는 남아 있으나 그 대외 노선은 이제 도쿄에서 그어진 경계 안에서 움직입니다."
 JAP_diplomacy.134.a: "보호국을 수립한다."
 JAP_diplomacy.135.t: "요구를 거부한 웰링턴"
 JAP_diplomacy.135.d: "뉴질랜드는 일본의 최후통첩을 거부하고 자국의 미래를 외국의 위임 통치에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 웰링턴의 독립을 자신의 남방 방어선에 대한 위협으로 취급합니다.\n\n태평양은 전선으로 굳어 갑니다. 뉴질랜드가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 이를 강요하려 할 것입니다."
 JAP_diplomacy.135.a: "그렇다면 남방 전초기지를 점령하겠다."
 JAP_diplomacy.137.t: "이라와디 관문 최후통첩"
 JAP_diplomacy.137.d: "도쿄는 네피도에 미얀마를 두 대양 사이의 육교로 확보하려는 요구를 제시했습니다. 조건은 사실상 보호국 체제입니다. 외교 정책을 일본에 맞추고, 일본의 안보 감독을 받아들이며, 벵골만에서 동남아시아로 이어지는 통로를 장악하는 데 필요한 접근권을 부여하라는 것입니다.\n\n이 제안은 안정과 발전으로 제시됩니다. 진실은 전략적 포획입니다. 미얀마는 통제된 평화를 받아들일지, 아니면 관문이 전장으로 변할 전쟁에 직면할지 결정해야 합니다."
 JAP_diplomacy.137.a: "받아들인다. 이 압박을 버틸 수 없다."
 JAP_diplomacy.137.b: "거부한다. 한낱 통로로 전락하지 않겠다."
 JAP_diplomacy.138.t: "관문 조건을 수락한 미얀마"
 JAP_diplomacy.138.d: "미얀마는 적대 행위의 종식과 질서의 약속을 위해 전략적 자율성을 맞바꾸며 일본의 최후통첩을 받아들입니다. 협정이 체결되고, 연락 사절단이 도착하며, 일본은 미얀마의 대외 노선과 안보 태세에 대한 결정적인 영향력을 얻습니다.\n\n전투는 끝나지만 대가는 주권입니다. 미얀마는 남아 있으나 그 관문들은 이제 도쿄에서 쓰인 지역 구상에 봉사합니다."
 JAP_diplomacy.138.a: "보호국을 수립한다."
 JAP_diplomacy.139.t: "최후통첩을 거부한 미얀마"
 JAP_diplomacy.139.d: "네피도는 일본의 요구를 거부하고 자국의 미래를 외부의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 미얀마를 바로잡아야 할 통로 장악의 장애물로 규정합니다.\n\n미얀마가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 이를 강요하려 할 것입니다. 관문은 어떤 방식으로든 확보될 것입니다."
 JAP_diplomacy.139.a: "그렇다면 관문을 점령하겠다."
 JAP_diplomacy.141.t: "북부 고원 최후통첩"
 JAP_diplomacy.141.d: "일본은 고개와 자원, 더 넓은 지역으로 향하는 접근로를 쥐고 있는 험준한 북부 고원 지대인 카친으로 시선을 돌렸습니다. 도쿄의 요구는 보호와 승인으로 제시되지만, 그 구조는 보호국입니다. 대외적으로 일본과 보조를 맞추고, 안보 감독을 받아들이며, 국경을 확보하는 전략적 접근을 허용하라는 것입니다.\n\n카친에게 이것은 이름뿐인 자치와 사실상의 절멸 사이의 선택입니다. 수락은 방패를 제공합니다. 거부는 산악과 마을에서 치러질 전쟁을 불러옵니다."
 JAP_diplomacy.141.a: "받아들인다. 살아남으려면 후원자가 필요하다."
 JAP_diplomacy.141.b: "거부한다. 한 주인을 다른 주인과 맞바꾸지 않겠다."
 JAP_diplomacy.143.t: "카친의 일본 보호 수락"
 JAP_diplomacy.143.d: "카친은 홀로 버틸 수 없는 싸움 대신 생존과 안정을 택하여 조건을 받아들입니다. 협정이 체결되고, 연락 사무소가 설치되며, 일본은 북부 고원과 그 전략적 통로를 확고히 장악합니다.\n\n분쟁은 끝나지만 카친의 자유는 허용된 범위로 줄어듭니다. 산은 남아 있으나 그 미래는 이제 도쿄와 묶여 있습니다."
 JAP_diplomacy.143.a: "보호국을 수립한다."
 JAP_diplomacy.144.t: "최후통첩을 거부한 카친"
 JAP_diplomacy.144.d: "카친은 일본의 요구를 거부하고 외부의 위임 통치에 복종하기를 거절합니다. 이 거부로 강압은 대결로 바뀌었고, 도쿄는 이제 고원 지대를 무력으로 해결해야 할 안보 문제로 규정합니다.\n\n카친이 조약에 의한 보호를 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 산은 중립으로 남지 않을 것입니다."
 JAP_diplomacy.144.a: "그렇다면 고원 지대를 점령하겠다."
 JAP_diplomacy.145.t: "샨 통로 요구"
 JAP_diplomacy.145.d: "일본은 밀수로, 산악 고개, 내륙의 동맥이 놓인 국경 지대를 겨냥한 조건을 와 당국에 전달했습니다. 이 제안은 승인과 보호로 포장되어 있으나 실상은 보호국 체제입니다. 대외적으로 도쿄와 보조를 맞추고, 일본의 안보 감독을 받아들이며, 통로를 확보하는 접근을 허용하라는 것입니다.\n\n와에게 이 선택은 잔혹합니다. 복종하여 새로운 우산 아래에서 지역 권력을 유지하거나, 거부하여 산도 민병대도 가리지 않을 전쟁에 직면해야 합니다."
 JAP_diplomacy.145.a: "받아들인다. 절멸보다는 방패가 낫다."
 JAP_diplomacy.145.b: "거부한다. 흡수되지 않겠다."
 JAP_diplomacy.146.t: "와주의 일본 보호 수락"
 JAP_diplomacy.146.d: "와는 더 강한 후원자 아래의 생존과 공식 승인을 위해 전략적 독립을 맞바꾸며 일본의 조건을 받아들입니다. 연락팀이 도착하고, 통로가 확보되며, 국경 지대는 일본의 지역 틀에 편입됩니다.\n\n전투는 끝나지만 자율성은 좁아집니다. 와는 지역 권한을 유지하나 그 대외 방향은 이제 도쿄에 응답합니다."
 JAP_diplomacy.146.a: "보호국을 수립한다."
 JAP_diplomacy.147.t: "요구를 거부한 와주"
 JAP_diplomacy.147.d: "와는 일본의 최후통첩을 거부하고 자국 영토를 외국의 감독 아래 두기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 국경 지대를 자신의 통로 전략에서 통제되지 않는 틈으로 취급합니다.\n\n와가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 산악 지대는 쟁탈의 대상이 될 것입니다."
 JAP_diplomacy.147.a: "그렇다면 통로를 확보하겠다."
 JAP_diplomacy.148.t: "샨 관문 최후통첩"
 JAP_diplomacy.148.d: "일본은 내륙과 더 넓은 지역을 잇는 고원 경로를 겨냥한 요구를 남샨주 당국에 제시했습니다. 이 제안은 보호국 체제입니다. 대외 관계를 도쿄에 맞추고, 일본의 안보 감독을 받아들이며, 도로, 고개, 보급 통로를 확보하기 위한 전략적 접근을 허용하라는 것입니다.\n\n이 제안은 보호와 승인을 약속합니다. 그 의미는 통제입니다. 남샨은 일본의 우산 아래 관리되는 미래를 받아들일지, 아니면 구릉과 계곡 전역에서 벌어질 전쟁의 위험을 감수할지 결정해야 합니다."
 JAP_diplomacy.148.a: "받아들인다. 절멸을 감당할 수 없다."
 JAP_diplomacy.148.b: "거부한다. 한낱 통로로 전락하지 않겠다."
 JAP_diplomacy.149.t: "남샨의 굴복"
 JAP_diplomacy.149.d: "남샨주가 일본의 조건을 받아들입니다. 연락 사무소가 설치되고, 통로가 확보되며, 이 지역은 독립된 행위자가 아니라 통제된 관문으로서 도쿄의 통로 전략에 편입됩니다.\n\n전투는 끝나지만 자율성은 위축됩니다. 지역 권한은 남아 있으나 전략적 방향은 이제 일본에 응답합니다."
 JAP_diplomacy.149.a: "보호국을 수립한다."
 JAP_diplomacy.150.t: "최후통첩을 거부한 남샨"
 JAP_diplomacy.150.d: "남샨주는 일본의 요구를 거부하고 자국의 미래를 외국의 감독 아래 두기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 지역을 자신의 전략적 방어선에서 위험한 틈으로 취급합니다.\n\n남샨이 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 이를 강요할 것입니다. 관문은 확보될 것입니다."
 JAP_diplomacy.150.a: "그렇다면 무력으로 관문을 점령하겠다."
 JAP_diplomacy.151.t: "살윈 위임 통치"
 JAP_diplomacy.151.d: "일본은 강 계곡과 국경 경로가 남쪽 접근로를 열거나 닫을 수 있는 카렌주로 시선을 돌렸습니다. 도쿄의 요구는 보호와 승인으로 제시되지만, 실상은 보호국 체제입니다. 대외 관계를 일본에 맞추고, 안보 감독을 받아들이며, 살윈 통로를 확보하는 접근을 부여하라는 것입니다.\n\n이 제안은 권력이 분열된 지역에서의 안정을 약속합니다. 대가는 복종입니다. 카렌주는 일본의 우산 아래 지켜지는 평화와 도하 지점과 정착지를 불태울 전쟁 사이에서 선택해야 합니다."
 JAP_diplomacy.151.a: "받아들인다. 내일을 볼 수 있도록 살아남겠다."
 JAP_diplomacy.151.b: "거부한다. 지배받지 않겠다."
 JAP_diplomacy.152.t: "카렌주의 굴복"
 JAP_diplomacy.152.d: "카렌주는 생존과 당면한 압박의 종식을 위해 전략적 자율성을 맞바꾸며 일본의 조건을 받아들입니다. 연락 사절단이 도착하고, 통로가 확보되며, 이 지역은 독립된 행위자가 아니라 통제된 통로로서 도쿄의 방어선에 편입됩니다.\n\n분쟁은 끝나지만 자유의 경계는 줄어듭니다. 카렌의 권한은 지역에 머물고, 전략적 방향은 이제 일본에 응답합니다."
 JAP_diplomacy.152.a: "보호국을 수립한다."
 JAP_diplomacy.153.t: "카렌주의 위임 통치 거부"
 JAP_diplomacy.153.d: "카렌주는 일본의 요구를 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 강압은 대결로 바뀌었고, 도쿄는 이제 살윈 도하 지점을 무력으로 해결해야 할 전략적 문제로 취급합니다.\n\n카렌주가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 이를 강요할 것입니다. 통로는 확보될 것입니다."
 JAP_diplomacy.153.a: "그렇다면 도하 지점을 장악하겠다."
 JAP_diplomacy.154.t: "팔라우 정박지 요구"
 JAP_diplomacy.154.d: "도쿄는 넓은 바다 한 자락에 자리한 작은 나라 팔라우에 요구를 전달했습니다. 조건은 보호와 보장된 번영으로 포장되어 있으나 구조는 보호국입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 팔라우를 제국의 전진 정박지로 바꾸는 기지 사용권을 부여하라는 것입니다.\n\n이 제안은 정치적·군사적 폭풍 모두로부터의 안전을 약속합니다. 대가는 주권입니다. 팔라우는 떠오르는 태양 아래의 복종과 강대국의 해군력을 상대로 버틸 수 없는 싸움 사이에서 선택해야 합니다."
 JAP_diplomacy.154.a: "받아들인다. 무덤보다는 보호자가 낫다."
 JAP_diplomacy.154.b: "거부한다. 우리의 독립을 넘겨주지 않겠다."
 JAP_diplomacy.155.t: "팔라우의 일본 보호 수락"
 JAP_diplomacy.155.d: "팔라우가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬들은 도쿄의 항구와 비행장 네트워크에서 규율 잡힌 거점이 됩니다.\n\n위기는 전투 없이 끝나지만 변화는 실재합니다. 팔라우는 이름만 남아 있으며, 그 대외 방향은 이제 일본의 나침반을 따릅니다."
 JAP_diplomacy.155.a: "보호국을 수립한다."
 JAP_diplomacy.156.t: "요구를 거부한 팔라우"
 JAP_diplomacy.156.d: "팔라우는 일본의 최후통첩을 거부하고 보호의 약속과 주권을 맞바꾸기를 거절합니다. 이 거부로 도쿄의 압박은 무력의 문제가 되었고, 일본은 이제 섬들을 자신의 해양 방어선에서 확보되지 않은 틈으로 취급합니다.\n\n팔라우가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 정박지는 확보될 것입니다."
 JAP_diplomacy.156.a: "그렇다면 정박지를 점령하겠다."
 JAP_diplomacy.157.t: "미크로네시아 제도 최후통첩"
 JAP_diplomacy.157.d: "일본은 미크로네시아에 요구를 제시했으며, 이 섬들을 흩어진 공동체가 아니라 중부 태평양을 가로지르는 징검다리의 사슬로 봅니다. 이 제안은 보호와 투자로 포장되어 있으나 구조는 보호국입니다. 외교 정책을 도쿄에 맞추고, 안보 감독을 받아들이며, 섬들을 일본 함대와 공군력의 기착지로 바꾸는 접근을 부여하라는 것입니다.\n\n메시지는 단순합니다. 이 해역은 하나의 권위 아래 조직될 것입니다. 미크로네시아는 일본의 우산 아래 관리되는 평화와 감당할 수 없는 대결 사이에서 선택해야 합니다."
 JAP_diplomacy.157.a: "받아들인다. 시류에 저항할 수 없다."
 JAP_diplomacy.157.b: "거부한다. 전초기지가 되지 않겠다."
 JAP_diplomacy.158.t: "미크로네시아의 제도 수락"
 JAP_diplomacy.158.d: "미크로네시아가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬들은 도쿄의 해양 방어선 안에서 항구, 비행장, 감시 거점으로 이루어진 통제된 통로가 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 미크로네시아는 남아 있으나 그 대외 방향은 이제 일본의 전략적 나침반을 따릅니다."
 JAP_diplomacy.158.a: "보호국을 수립한다."
 JAP_diplomacy.159.t: "최후통첩을 거부한 미크로네시아"
 JAP_diplomacy.159.d: "미크로네시아는 일본의 요구를 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 도서 열도를 자신의 태평양 네트워크에서 메워야 할 틈으로 취급합니다.\n\n미크로네시아가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 제도는 확보될 것입니다."
 JAP_diplomacy.159.a: "그렇다면 징검다리를 점령하겠다."
 JAP_diplomacy.160.t: "나우루 전초기지 요구"
 JAP_diplomacy.160.d: "도쿄는 나우루에 요구를 전달했으며, 이 섬을 탁 트인 바다 너머로 감시, 급유, 투사 능력을 뒷받침할 수 있는 지도상의 핀으로 취급합니다. 이 제안은 보호와 보장된 지원으로 포장되어 있으나 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 나우루를 제국의 전초기지로 바꾸는 접근을 부여하라는 것입니다.\n\n나우루에게 선택은 냉혹합니다. 더 큰 강대국 아래에서 복종하며 살아남거나, 거부하여 일본의 논지를 입증하는 전장이 될 위험을 감수해야 합니다."
 JAP_diplomacy.160.a: "받아들인다. 홀로 설 수는 없다."
 JAP_diplomacy.160.b: "거부한다. 한낱 기착지로 전락하지 않겠다."
 JAP_diplomacy.161.t: "나우루의 일본 보호 수락"
 JAP_diplomacy.161.d: "나우루가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬은 도쿄의 태평양 네트워크에서 작지만 중요한 거점이 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 나우루는 남아 있으나 그 대외 방향은 이제 일본의 전략 노선을 따릅니다."
 JAP_diplomacy.161.a: "보호국을 수립한다."
 JAP_diplomacy.162.t: "요구를 거부한 나우루"
 JAP_diplomacy.162.d: "나우루는 일본의 최후통첩을 거부하고 보호의 약속과 독립을 맞바꾸기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 섬을 자신의 해양 방어선에서 확보되지 않은 틈으로 취급합니다.\n\n나우루가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 전초기지는 확보될 것입니다."
 JAP_diplomacy.162.a: "그렇다면 섬을 점령하겠다."
 JAP_diplomacy.163.t: "적도선 최후통첩"
 JAP_diplomacy.163.d: "일본은 항해사의 해도 위 표식처럼 적도를 따라 흩어진 나라 키리바시에 요구를 제시했습니다. 도쿄의 제안은 보호와 발전으로 포장되어 있으나 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 키리바시를 감시와 해군 투사를 위한 기착지의 사슬로 바꾸는 접근을 부여하라는 것입니다.\n\n메시지는 단순합니다. 새로운 태평양 질서에는 빈 공간이 없습니다. 키리바시는 일본의 우산 아래 복종하거나, 해상 교통로를 소유하려는 강대국에 맞서 대결하는 것 중에서 선택해야 합니다."
 JAP_diplomacy.163.a: "받아들인다. 대양의 새 주인에게 저항할 수 없다."
 JAP_diplomacy.163.b: "거부한다. 제국에 흡수되지 않겠다."
 JAP_diplomacy.164.t: "키리바시의 적도선 수락"
 JAP_diplomacy.164.d: "키리바시가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 흩어진 환초들은 도쿄의 태평양 네트워크에서 조용하지만 가치 있는 일부가 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 키리바시는 남아 있으나 그 대외 방향은 이제 일본의 나침반을 따릅니다."
 JAP_diplomacy.164.a: "보호국을 수립한다."
 JAP_diplomacy.165.t: "최후통첩을 거부한 키리바시"
 JAP_diplomacy.165.d: "키리바시는 일본의 최후통첩을 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 적도 제도를 자신의 해양 방어선에서의 틈으로 취급합니다.\n\n키리바시가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 적도선은 확보될 것입니다."
 JAP_diplomacy.165.a: "그렇다면 제도를 점령하겠다."
 JAP_diplomacy.166.t: "환초 보루 요구"
 JAP_diplomacy.166.d: "도쿄는 마셜 제도에 요구를 제시했으며, 환초를 비행장, 병참, 제해권 수단을 수용할 수 있는 천연 요새로 봅니다. 이 제안은 보호와 보장된 지원으로 포장되어 있으나 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 마셜 제도를 일본의 중부 태평양 방어선의 보루로 바꾸는 접근을 부여하라는 것입니다.\n\n메시지는 분명합니다. 이 섬들은 해도 위의 중립적인 점으로 남겨지지 않을 것입니다. 마셜 제도는 일본의 우산 아래 관리되는 평화와 산호초와 활주로를 둘러싼 전쟁 사이에서 선택해야 합니다."
 JAP_diplomacy.166.a: "받아들인다. 포위를 견뎌 낼 수 없다."
 JAP_diplomacy.166.b: "거부한다. 다른 강국의 요새가 되지 않겠다."
 JAP_diplomacy.167.t: "마셜 제도의 굴복"
 JAP_diplomacy.167.d: "마셜 제도가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 환초들은 도쿄의 해양 네트워크 안에서 규율 잡힌 보루가 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 마셜 제도는 남아 있으나 그 대외 방향은 이제 일본의 방어선 계획을 따릅니다."
 JAP_diplomacy.167.a: "보호국을 수립한다."
 JAP_diplomacy.168.t: "요구를 거부한 마셜 제도"
 JAP_diplomacy.168.d: "마셜 제도는 일본의 최후통첩을 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 환초들을 자신의 중부 태평양 방어선에서 확보되지 않은 틈으로 취급합니다.\n\n마셜 제도가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 보루는 확보될 것입니다."
 JAP_diplomacy.168.a: "그렇다면 환초를 점령하겠다."
 JAP_diplomacy.169.t: "암초선 최후통첩"
 JAP_diplomacy.169.d: "일본은 도달 거리와 급유 지점으로 가늠되는 대양에서 여전히 중요한 가느다란 암초의 사슬 투발루에 요구를 제시했습니다. 도쿄는 보호와 지원을 제안하지만 구조는 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 투발루를 일본 남방 방어선의 기착지로 바꾸는 접근을 부여하라는 것입니다.\n\n메시지는 단순해서 잔혹합니다. 분쟁 중인 태평양에 중립적인 섬은 없을 것입니다. 투발루는 일본의 우산 아래 복종하거나, 작은 나라를 강대국 전쟁에 빠뜨릴 대결 중에서 선택해야 합니다."
 JAP_diplomacy.169.a: "받아들인다. 강철의 폭풍을 견딜 수 없다."
 JAP_diplomacy.169.b: "거부한다. 우리의 깃발을 넘겨주지 않겠다."
 JAP_diplomacy.170.t: "투발루의 일본 보호 수락"
 JAP_diplomacy.170.d: "투발루가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬들은 도쿄의 해양 네트워크에서 조용한 거점이 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 투발루는 남아 있으나 그 대외 방향은 이제 일본의 방어선 계획을 따릅니다."
 JAP_diplomacy.170.a: "보호국을 수립한다."
 JAP_diplomacy.171.t: "최후통첩을 거부한 투발루"
 JAP_diplomacy.171.d: "투발루는 일본의 최후통첩을 거부하고 보호의 약속과 독립을 맞바꾸기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 암초선을 자신의 남방 사슬에서 확보되지 않은 틈으로 취급합니다.\n\n투발루가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 기착지는 확보될 것입니다."
 JAP_diplomacy.171.a: "그렇다면 섬들을 점령하겠다."
 JAP_diplomacy.172.t: "솔로몬 장벽 최후통첩"
 JAP_diplomacy.172.d: "도쿄는 솔로몬 제도에 요구를 제시했으며, 이 열도를 남서 태평양을 봉쇄할 수 있는 천연 장벽으로 봅니다. 이 제안은 보호와 발전으로 포장되어 있으나 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 솔로몬 제도를 일본 해양 방어선의 요새화된 차폐막으로 바꾸는 기지 접근권을 부여하라는 것입니다.\n\n메시지는 분명합니다. 이 섬들은 일본의 질서에 봉사하거나, 적의 교두보로 취급될 것입니다. 솔로몬 제도는 떠오르는 태양 아래의 복종과 밀림 활주로와 좁은 바다에서 벌어질 전쟁 사이에서 선택해야 합니다."
 JAP_diplomacy.172.a: "받아들인다. 봉쇄를 견뎌 낼 수 없다."
 JAP_diplomacy.172.b: "거부한다. 다른 제국의 요새가 되지 않겠다."
 JAP_diplomacy.173.t: "솔로몬 제도의 굴복"
 JAP_diplomacy.173.d: "솔로몬 제도가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 열도는 도쿄의 지휘 아래 항구, 비행장, 초계 구역으로 이루어진 규율 잡힌 장벽이 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 솔로몬 제도는 남아 있으나 그 대외 노선은 이제 일본의 방어선 계획을 따릅니다."
 JAP_diplomacy.173.a: "보호국을 수립한다."
 JAP_diplomacy.174.t: "최후통첩을 거부한 솔로몬 제도"
 JAP_diplomacy.174.d: "솔로몬 제도는 일본의 요구를 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 열도를 자신의 남서 태평양 차폐막에서 위험한 틈으로 취급합니다.\n\n솔로몬 제도가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 장벽은 확보될 것입니다."
 JAP_diplomacy.174.a: "그렇다면 열도를 장악하겠다."
 JAP_diplomacy.175.t: "뉴기니 보루 최후통첩"
 JAP_diplomacy.175.d: "일본은 파푸아뉴기니에 요구를 제시했으며, 이 섬을 동남아시아와 태평양 사이의 접근로를 지배할 수 있는 대륙형 보루로 취급합니다. 이 제안은 보호와 보장된 지원으로 포장되어 있으나 보호국 체제입니다. 외교 정책을 도쿄에 맞추고, 안보 감독을 받아들이며, 뉴기니를 공군력, 병참, 전진 방어의 요새로 바꾸는 기지 접근권을 부여하라는 것입니다.\n\n메시지에는 의심의 여지가 거의 없습니다. 일본은 이곳에 남방 전구의 닻을 내릴 작정입니다. 파푸아뉴기니는 일본의 방패 아래의 복종과 해안과 고원을 전선으로 바꿀 전쟁 사이에서 선택해야 합니다."
 JAP_diplomacy.175.a: "받아들인다. 전장이 되는 것은 감당할 수 없다."
 JAP_diplomacy.175.b: "거부한다. 다른 강국의 요새가 되지 않겠다."
 JAP_diplomacy.176.t: "포트모르즈비의 수락"
 JAP_diplomacy.176.d: "파푸아뉴기니가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬은 비행장, 항구, 병참 거점을 중심으로 도쿄의 남방 방어선 안에서 규율 잡힌 보루가 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 파푸아뉴기니는 남아 있으나 그 전략적 방향은 이제 일본의 요새 계획을 따릅니다."
 JAP_diplomacy.176.a: "보호국을 수립한다."
 JAP_diplomacy.177.t: "최후통첩을 거부한 파푸아뉴기니"
 JAP_diplomacy.177.d: "파푸아뉴기니는 일본의 요구를 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 섬을 남방 전구 확보의 핵심 장애물로 취급합니다.\n\n파푸아뉴기니가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 보루는 점령될 것입니다."
 JAP_diplomacy.177.a: "그렇다면 보루를 장악하겠다."
 JAP_diplomacy.178.t: "남태평양 사슬 요구"
 JAP_diplomacy.178.d: "도쿄는 바누아투에 요구를 제시했으며, 이 섬들을 남서 태평양을 봉쇄할 수 있는 사슬의 또 다른 고리로 취급합니다. 이 제안은 보호와 개발 원조로 포장되어 있으나 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 바누아투를 초계, 급유, 지역 통제의 기착지로 바꾸는 접근을 부여하라는 것입니다.\n\n메시지는 분명합니다. 일본은 섬 하나하나씩 방어선을 쌓고 있습니다. 바누아투는 떠오르는 태양 아래 관리되는 평화와 감당할 수 없는 대결 사이에서 선택해야 합니다."
 JAP_diplomacy.178.a: "받아들인다. 바다에서 제국과 싸울 수는 없다."
 JAP_diplomacy.178.b: "거부한다. 흡수되지 않겠다."
 JAP_diplomacy.179.t: "바누아투의 일본 보호 수락"
 JAP_diplomacy.179.d: "바누아투가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬들은 도쿄의 남방 방어선 안에서 조용하지만 쓸모 있는 거점이 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 바누아투는 남아 있으나 그 대외 방향은 이제 일본의 전략 노선을 따릅니다."
 JAP_diplomacy.179.a: "보호국을 수립한다."
 JAP_diplomacy.180.t: "요구를 거부한 바누아투"
 JAP_diplomacy.180.d: "바누아투는 일본의 최후통첩을 거부하고 보호의 약속과 독립을 맞바꾸기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 섬들을 자신의 남서 태평양 사슬에서 확보되지 않은 틈으로 취급합니다.\n\n바누아투가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 이 고리는 확보될 것입니다."
 JAP_diplomacy.180.a: "그렇다면 섬들을 점령하겠다."
 JAP_diplomacy.181.t: "남태평양 쐐기돌 최후통첩"
 JAP_diplomacy.181.d: "일본은 피지에 요구를 제시했으며, 이 섬들을 남태평양의 넓은 호를 따라 함대 병참과 항공 작전을 지원할 수 있는 허브로 취급합니다. 이 제안은 보호와 보장된 지원으로 포장되어 있으나 보호국 체제입니다. 외교 정책을 도쿄에 맞추고, 안보 감독을 받아들이며, 피지를 일본 남방 방어선의 쐐기돌로 바꾸는 기지 접근권을 부여하라는 것입니다.\n\n메시지는 명백합니다. 일본은 친구를 구하는 것이 아니라 질서를 세우고 있습니다. 피지는 일본의 우산 아래 관리되는 평화와 해군력이 승패를 가를 대결 사이에서 선택해야 합니다."
 JAP_diplomacy.181.a: "받아들인다. 본보기가 되는 것은 감당할 수 없다."
 JAP_diplomacy.181.b: "거부한다. 피지는 굴복하지 않는다."
 JAP_diplomacy.182.t: "쐐기돌 조건을 수락한 피지"
 JAP_diplomacy.182.d: "피지가 일본의 최후통첩을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬들은 도쿄의 남태평양 항구, 비행장, 초계 구역 네트워크의 중심 거점이 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 피지는 남아 있으나 그 대외 방향은 이제 일본의 방어선 계획을 따릅니다."
 JAP_diplomacy.182.a: "보호국을 수립한다."
 JAP_diplomacy.183.t: "최후통첩을 거부한 피지"
 JAP_diplomacy.183.d: "피지는 일본의 요구를 거부하고 자국의 미래를 외국의 감독에 넘기기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 섬들을 자신이 닫으려는 남방 방어선의 마지막 틈으로 취급합니다.\n\n피지가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 쐐기돌은 확보될 것입니다."
 JAP_diplomacy.183.a: "그렇다면 허브를 점령하겠다."
 JAP_diplomacy.184.t: "사모아 선 최후통첩"
 JAP_diplomacy.184.d: "도쿄는 사모아에 요구를 제시했으며, 이 섬들을 중부 태평양과 남방 접근로 사이의 요충으로 취급합니다. 이 제안은 보호와 보장된 지원으로 포장되어 있으나 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 사모아를 일본의 확장하는 해양 방어선의 기착지로 바꾸는 접근을 부여하라는 것입니다.\n\n메시지는 노골적입니다. 일본은 바다 위에 선을 긋고 있으며, 사모아는 그 선들 중 하나 위에 있습니다. 수락은 더 큰 강국 아래의 안전을 제공하고, 거부는 다른 나라들을 납득시킬 본보기가 될 위험을 안습니다."
 JAP_diplomacy.184.a: "받아들인다. 복종해야 하더라도 살아남겠다."
 JAP_diplomacy.184.b: "거부한다. 사모아는 굴복하지 않는다."
 JAP_diplomacy.185.t: "사모아의 일본 보호 수락"
 JAP_diplomacy.185.d: "사모아가 일본의 최후통첩을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 섬들은 도쿄의 태평양 네트워크에서 조용하지만 쓸모 있는 거점이 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 사모아는 남아 있으나 그 대외 방향은 이제 일본의 전략 노선을 따릅니다."
 JAP_diplomacy.185.a: "보호국을 수립한다."
 JAP_diplomacy.186.t: "최후통첩을 거부한 사모아"
 JAP_diplomacy.186.d: "사모아는 일본의 요구를 거부하고 보호의 약속과 독립을 맞바꾸기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 섬들을 자신의 해양 방어선에서 확보되지 않은 틈으로 취급합니다.\n\n사모아가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 이 선은 확보될 것입니다."
 JAP_diplomacy.186.a: "그렇다면 섬들을 점령하겠다."
 JAP_diplomacy.187.t: "통가 왕관 요구"
 JAP_diplomacy.187.d: "도쿄는 항구와 해상 교통로가 태평양 남방 호 위에 놓인 왕국 통가에 요구를 제시했습니다. 이 제안은 보호와 동반자 관계로 포장되어 있으나 보호국 체제입니다. 외교 정책을 일본에 맞추고, 안보 감독을 받아들이며, 통가를 일본의 확장하는 해양 방어선 안의 기착지로 바꾸는 접근을 부여하라는 것입니다.\n\n메시지는 분명합니다. 일본은 독립적인 요충을 허용하지 않는 대양 질서를 구축하고 있습니다. 통가는 일본의 그림자 아래 지켜지는 평화와 함대가 결정할 대결 사이에서 선택해야 합니다."
 JAP_diplomacy.187.a: "받아들인다. 그림자 아래에서라도 왕관은 지키겠다."
 JAP_diplomacy.187.b: "거부한다. 통가는 굴복하지 않는다."
 JAP_diplomacy.188.t: "통가의 일본 보호 수락"
 JAP_diplomacy.188.d: "통가가 일본의 조건을 받아들입니다. 협정이 체결되고, 접근권이 부여되며, 왕국은 도쿄의 남방 네트워크에서 규율 잡힌 거점이 됩니다.\n\n위기는 전투 없이 끝나지만 주권은 좁아집니다. 통가는 남아 있으나 그 대외 방향은 이제 일본의 전략 노선을 따릅니다."
 JAP_diplomacy.188.a: "보호국을 수립한다."
 JAP_diplomacy.189.t: "요구를 거부한 통가"
 JAP_diplomacy.189.d: "통가는 일본의 최후통첩을 거부하고 자국의 미래를 외국의 감독 아래 두기를 거절합니다. 이 거부로 압박은 대결로 바뀌었고, 도쿄는 이제 이 왕국을 자신의 남방 호에서 확보되지 않은 틈으로 취급합니다.\n\n통가가 조약으로 이 틀을 받아들이지 않는다면, 일본은 무력으로 통제를 강요할 것입니다. 기착지는 확보될 것입니다."
 JAP_diplomacy.189.a: "그렇다면 섬들을 점령하겠다."
 JAP_diplomacy.190.t: "워싱턴에 보내는 통첩: 태평양 철수"
 JAP_diplomacy.190.d: "도쿄는 워싱턴에 미국이 보유한 주요 태평양 도서의 이양을 요구하는 공식 요구를 전달했습니다. 메시지는 노골적입니다. 일본의 해양 방어선 안에 있는 외국의 발판은 더 이상 용인되지 않으며, 추가적인 확전을 막기 위해 이 전초기지들을 포기해야 한다는 것입니다.\n\n이 요구는 전쟁을 피할 기회로 포장되어 있으나 동시에 결의의 시험이기도 합니다. 받아들여 힘의 징검다리를 내주거나, 거부하여 태평양을 거인들의 전장으로 만들 위험을 감수해야 합니다."
 JAP_diplomacy.190.a: "이양을 승인한다."
 JAP_diplomacy.190.b: "거부한다. 태평양은 그들이 차지할 곳이 아니다."
 JAP_diplomacy.191.t: "워싱턴의 전초기지 양도"
 JAP_diplomacy.191.d: "예상과 달리 미국이 요구를 받아들입니다. 섬들이 이양되고, 기지에서 병력이 철수하며, 일본의 해양 방어선은 단번에 확장됩니다.\n\n위기는 전쟁 없이 끝나지만 그 의미는 명백합니다. 강대국이 물러섰고, 태평양의 균형은 도쿄 쪽으로 기웁니다."
 JAP_diplomacy.191.a: "섬들을 확보한다."
 JAP_diplomacy.192.t: "워싱턴의 거부"
 JAP_diplomacy.192.d: "미국은 일본의 요구를 거부하고 태평양의 발판을 내주기를 거절합니다. 이 거부로 도쿄의 최후통첩은 강대국 간의 직접 대결이 되었고, 일본은 이제 전초기지들을 무력으로 얻으려 할 명분과 동기를 모두 갖게 되었습니다.\n\n태평양은 전선으로 조여 옵니다. 이 섬들이 조약으로 양도되지 않는다면, 전쟁으로 빼앗길 것입니다."
 JAP_diplomacy.192.a: "그렇다면 무력으로 차지하겠다."
 JAP_diplomacy.193.t: "파리에 보내는 최후통첩: 비워야 할 태평양"
 JAP_diplomacy.193.d: "도쿄는 파리에 프랑스의 태평양 도서 보유지를 이양하라는 공식 요구를 전달했습니다. 문서는 정중한 어휘로 감싸여 있으나 그 의미는 명백합니다. 먼 제국들은 더 이상 일본의 해양 방어선 안에 발판을 유지하지 못할 것이라는 것입니다.\n\n일본은 확전을 피할 좁은 길을 제시합니다. 프랑스는 잉크와 서명으로 철수하거나, 거부하여 분쟁이 외교관이 아닌 함대에 의해 해결되리라는 것을 받아들일 수 있습니다."
 JAP_diplomacy.193.a: "이양을 승인한다."
 JAP_diplomacy.193.b: "거부한다. 프랑스는 밀려나지 않는다."
 JAP_diplomacy.194.t: "파리의 태평양 철수"
 JAP_diplomacy.194.d: "프랑스가 일본의 요구를 받아들입니다. 깃발이 내려지고, 수비대에 철수 명령이 떨어지며, 섬들은 도쿄의 통제로 이양됩니다.\n\n위기는 전쟁 없이 끝나지만 그 메시지는 세계 전역에 울려 퍼집니다. 일본은 세력권을 협상하는 것이 아니라 강제하고 있습니다."
 JAP_diplomacy.194.a: "섬들을 확보한다."
 JAP_diplomacy.195.t: "파리의 거부"
 JAP_diplomacy.195.d: "프랑스는 일본의 최후통첩을 거부하고 태평양 보유지를 내주기를 거절합니다. 이 거부로 도쿄의 요구는 직접적인 대결이 되었고, 일본은 이제 섬들을 무력으로 차지할 명분을 얻었습니다.\n\n강대국들이 충돌하면 대양은 좁아집니다. 프랑스가 조약으로 철수하지 않는다면, 일본은 전쟁으로 몰아내려 할 것입니다."
 JAP_diplomacy.195.a: "그렇다면 점령하겠다."
 JAP_diplomacy.196.t: "런던에 보내는 통첩: 태평양 보유지를 포기하라"
 JAP_diplomacy.196.d: "도쿄는 런던에 영국의 마지막 남은 태평양 도서 보유지를 이양하라는 공식 요구를 전달했습니다. 문서는 지역 안정과 먼 곳의 간섭 종식을 말하지만, 그 목적은 분명합니다. 일본은 이제 자신이 치안을 담당한다고 주장하는 대양에서 외국 깃발을 치울 작정입니다.\n\n영국에는 질서 있는 철수와 본토에서 먼 곳에서의 불필요한 전쟁 중 하나가 제시됩니다. 수락하면 문제는 서류상으로 끝납니다. 거부하면 태평양은 제국들이 서로의 의지를 시험하는 또 하나의 전구가 됩니다."
 JAP_diplomacy.196.a: "이양을 승인한다."
 JAP_diplomacy.196.b: "거부한다. 영국은 쫓겨나지 않는다."
 JAP_diplomacy.197.t: "런던의 후퇴"
 JAP_diplomacy.197.d: "영국이 일본의 요구를 받아들입니다. 영토가 이양되고, 깃발이 내려지며, 도쿄는 강제로 구축한 해양 방어선에 또 하나의 조각을 더합니다.\n\n위기는 전쟁 없이 끝나지만 상징성은 무겁습니다. 오랜 해양 강국이 양보했고, 일본의 태평양 영유 주장은 양보가 있을 때마다 더 대담해집니다."
 JAP_diplomacy.197.a: "영토를 확보한다."
 JAP_diplomacy.198.t: "요구를 거부한 런던"
 JAP_diplomacy.198.d: "영국은 일본의 최후통첩을 거부하고 태평양 보유지를 내주기를 거절합니다. 이 거부로 도쿄의 요구는 직접적인 도전이 되었고, 일본은 이제 이 영토를 무력으로 점령할 동기와 구실을 모두 갖게 되었습니다.\n\n외교는 한계에 다다랐습니다. 영국이 조약으로 철수하지 않는다면, 일본은 전쟁으로 제거하려 할 것입니다."
 JAP_diplomacy.198.a: "그렇다면 우리가 차지하겠다."
 JAP_diplomacy.199.t: "평양 내 일본의 채널 확장"
 JAP_diplomacy.199.d: "북측에 대한 일본의 정책이 새로운 국면에 접어들었습니다. 중개인, 정보 접촉, 신중하게 관리된 압박을 통해 도쿄는 이전에는 제한적이거나 닫혀 있던 우리 정치 환경 내부의 채널을 열었습니다.\n\n이것은 신뢰를 뜻하지 않으며 보조를 맞춘다는 뜻도 아닙니다. 일본이 이제 결정을 형성하고, 파벌에 영향을 미치며, 외부뿐 아니라 내부에서도 우리의 결의를 시험할 일시적인 기회를 얻었다는 뜻입니다."
 JAP_diplomacy.199.a: "이 채널들을 면밀히 주시하겠다."
 JAP_diplomacy.200.t: "사할린과 쿠릴 열도의 상실"
 JAP_diplomacy.200.d: "러시아군이 사할린과 쿠릴 열도의 완전한 통제권을 되찾아, 이번 전역에서 거둔 모든 성과가 원점으로 돌아갔습니다. 작전은 붕괴했고 도쿄는 더 이상 이 노력을 지속할 수 없습니다. 휴전만이 남은 유일한 선택지입니다.\n\n이 실패는 후과를 남길 것입니다. 정부의 군사적 판단에 대한 국민의 신뢰가 흔들렸고, 이 무모한 모험의 정치적 대가는 수년간 체감될 것입니다."
 JAP_diplomacy.200.a: "패배를 받아들일 수밖에 없다."
 JAP_failed_sakhalin_war: "사할린 전쟁의 여파"
 JAP_failed_sakhalin_war_desc: "사할린과 쿠릴 열도를 둘러싼 실패한 군사 작전은 일본의 정치 지형에 깊은 상처를 남겼습니다. 정부의 전략적 역량에 대한 국민의 신뢰는 약화되었고, 군의 사기는 저하되었으며, 외교적 후폭풍은 도쿄의 외교 정책 선택지를 계속 제약하고 있습니다."
 JAP_mars_colony1: "화성 식민지 아마테라스"
 JAP_mars_colony1_desc: "하늘을 비추는 태양의 여신 아마테라스에서 이름을 딴 화성 식민지 '아마테라스'는 일본의 통합과 지도력을 상징하는 찬란한 빛입니다. 그 존재는 국내에는 자신감을, 국외에는 존경을 불러일으킵니다."
 JAP_mars_colony2: "화성 식민지 가구쓰치"
 JAP_mars_colony2_desc: "불의 신 가구쓰치에서 이름을 딴 화성 식민지 '가구쓰치'는 용광로, 정제소, 중공업을 중심으로 건설되었습니다. 그 목적은 분명합니다. 화성의 광석과 에너지를 일본 공장의 힘으로 바꾸는 것입니다."
 JAP_mars_colony3: "화성 식민지 쓰쿠요미"
 JAP_mars_colony3_desc: "달과 밤의 신 쓰쿠요미에서 이름을 딴 화성 식민지 '쓰쿠요미'는 고요한 관측소이자 연구 단지의 역할을 합니다. 이곳의 실험실과 장비에서 일본으로 데이터가 흘러들어 과학적 이해를 심화시킵니다."
 JAP_mars_colony4: "화성 식민지 스사노오"
 JAP_mars_colony4_desc: "폭풍을 부르는 신 스사노오에서 이름을 딴 화성 식민지 '스사노오'는 거친 변경 전초기지로 조성되었습니다. 훈련장과 실험 사격장 덕분에 이곳은 일본 군대와 교리의 단련장이 됩니다."
 JAP_american_pressure_article_nine: "미국 관세의 압박 하에"
 JAP_JP_USA_SOFA_1: "미일 SOFA 체제"
 JAP_JP_USA_SOFA_1_desc: "주일 미군은 대부분의 인원을 일본의 법원과 세금으로부터 보호하고 기지에 대한 미국의 폭넓은 통제권을 보장하는 주둔군 지위 협정(SOFA)에 따라 활동합니다. 지역 경찰, 지사, 주민은 워싱턴과 도쿄에서 협상된 규칙을 우회하여 일해야 하며, 기지 인근의 모든 범죄, 사고, 소음 민원은 일본이 조치를 취하기 전에 SOFA 절차를 거쳐 걸러집니다."
 JAP_maritime_heavy_industry_corridor: "해양 중공업 회랑"
 JAP_maritime_heavy_industry_corridor_desc: "일본은 주요 해안 지역을 따라 조선소, 제철소, 해양 공학 기업이 이어진 연속 지대를 개발합니다. 이 회랑에 투자를 집중하면 군함, 잠수함, 지원함의 건조와 정비 능력이 늘어나 함대의 산업적 근간이 강화됩니다."
 JAP_moon_base_completed: "가구야 달 기지 건설"
 JAP_usa_article_nine_refused: "제9조 해석 변경 거부"
 JAP_diplomacy_shortcut: "외교"
 JAP_political: "정치"
 JAP_economy: "경제"
 JAP_military: "군사"
 JAP_monarchism: "군주주의자"
 JAP_great_east_japan_earthquake_shortcut: "동일본 대지진"
 JAP_article_nine_remove_flag: "헌법 제9조가 삭제되었습니다"
 JAP_usa_article_nine_accepted: "제9조 해석 변경 수용"
 JAP_tokyo_startup_special_zone: "도쿄 스타트업 특구"
 JAP_tokyo_startup_special_zone_desc: "도쿄 수도권에 규제 완화, 벤처 지원, 투자 유인책을 집중하여 스타트업의 창업과 사업화를 육성하겠습니다."
 JAP_tokyo_startup_special_zone_idea: "도쿄 스타트업 특구"
 JAP_tokyo_startup_special_zone_idea_desc: "도쿄는 스타트업, 벤처 캐피털, 신규 사업 설립을 지원하는 규제 개혁 특구로 지정되었습니다. 수도권에 규제 완화, 투자 접근성, 사업화 지원을 집중함으로써 정부는 제한적인 개혁을 눈에 보이는 성장 동력으로 전환하고자 합니다."
 JAP_kansai_medical_special_zone: "간사이 의료 혁신 특구"
 JAP_kansai_medical_special_zone_desc: "간사이에 의료, 요양, 생명과학 혁신을 위한 특구를 조성하여 민간 투자와 실용화를 가속하겠습니다."
 JAP_kansai_medical_special_zone_idea: "간사이 의료 혁신 특구"
 JAP_kansai_medical_special_zone_idea_desc: "간사이는 규제 유연화와 집중 투자를 통해 의료, 요양, 생명과학 혁신 특구로 개발되고 있습니다."
 JAP_kyushu_logistics_special_zone: "규슈 물류 및 항만 특구"
 JAP_kyushu_logistics_special_zone_desc: "규슈의 물류와 항만 절차를 간소화하여 무역 흐름을 강화하고 지역 산업의 효율을 높이겠습니다."
 JAP_kyushu_logistics_special_zone_idea: "규슈 물류 및 항만 특구"
 JAP_kyushu_logistics_special_zone_idea_desc: "규슈는 무역 효율과 지역 연결성을 높이기 위한 물류 및 항만 개혁 특구로 지정되었습니다. 간소화된 절차, 기반시설 우선 투자, 규제 완화를 통해 수출 역량을 강화하고 이 지역을 산업과 상업의 더욱 매력적인 거점으로 만들고자 합니다."
 JAP_expand_special_zones_nationwide: "특구 전국 확대"
 JAP_expand_special_zones_nationwide_desc: "선정된 전략 특구에서 거둔 성과를 전국으로 확대하여, 규제 개혁을 제한적인 예외에서 보다 폭넓은 성장 틀로 전환하겠습니다."
