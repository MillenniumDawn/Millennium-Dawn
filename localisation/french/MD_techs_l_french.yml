 nsb_atgm_tech_1: "ATGM 1ère génération"
 nsb_atgm_tech_1_desc: "Les nacelles de missiles air-sol (ATGM) sont des systèmes externes montés sur des hélicoptères, permettant le déploiement de missiles guidés conçus pour engager et détruire les véhicules blindés, les fortifications et d'autres cibles au sol avec une grande précision. Ces nacelles améliorent considérablement les capacités offensives d'un hélicoptère, permettant un engagement efficace dans divers scénarios de combat."
 nsb_atgm_tech_2: "ATGM 2ème génération"
