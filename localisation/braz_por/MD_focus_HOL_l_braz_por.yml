 HOL_asml_tsmc_group:0 "Aliança Tecnológica ASML-TSMC"
 HOL_asml_tsmc_group_desc:0 "A Aliança Tecnológica ASML-TSMC representa a vanguarda da pesquisa e produção de semicondutores. Combinando a expertise holandesa em litografia com a liderança de Taiwan na fabricação de semicondutores, essa parceria busca dominar o cenário tecnológico global, garantindo acesso incomparável a microchips avançados e inovação tecnológica."
