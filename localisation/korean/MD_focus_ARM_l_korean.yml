 NKR_artsakh_desc_loc: "[select_thingie_artsakh]\n\n[discussion_phase_arts]\n\n[artsakh_strong_or_weak]\n\n§Y제1차 아르차흐 전쟁§!에서 §Y아르메니아§!가 승리한 이후 국경 분쟁은 오늘날까지 계속되고 있습니다. 이 전쟁은 양측 모두에게 정당한 것으로 여겨졌으며, 전투는 결국 §Y아르메니아§!와 §Y아제르바이잔§! 모두를 불안정하게 만들었습니다. 새천년에는 분쟁을 격화시키거나 완화하여 분쟁을 우리에게 유리하게 만들 수 있습니다.\n\n외교 §Y논의 단계§!는 §Y양측§!이 §C평화적 해결책§!을 찾으려는 §G의지§!를 나타냅니다!"
