 MD_FORMABLE_RULES: "Flaggen und formbare Nationen"
 MD_ORGANISATION_RULES: "Organisationsoptionen"
 MD_INFLUENCE_RULES: "Einflusssystemoptionen"
 MD_OPTIMISATION_RULES: "Optimierung und Leistung"
