 HEZ_weekly_incomes_from_influence: "Ganancias Semanales por Influencia"
 HEZ_weekly_incomes_from_influence_desc: "We will gain §YMoney§!, §YEquipment§!, and §YManpower§! every week based on our influence in non-ally countries out of our faction.\n\nCurrent International Influence is §Y[?total_influence_in_countries]%§!.\n\nWeekly gains are as follows:\n      £personnel_cost_multiplier_modifier_texticon    Manpower: §G[?hezbollah_weekly_manpower]§!\n   £treasury  Money: $§G[?hezbollah_weekly_money]§! billion\n    £equipment_cost_multiplier_modifier_texticon     Small Arms: §G[?hezbollah_weekly_small_arms]§!\n   £GFX_unit_category_support_battalions_icon_small C&C Equipment: §G[?hezbollah_weekly_cnc]§!\n   £air_superiority_efficiency_texticon    MANPADS: §G[?hezbollah_weekly_manpads]§!\n   £cas_efficiency_texticon  ATGM: §G[?hezbollah_weekly_atgm]§!\n £GFX_unit_Mech_Inf_Bat_icon_small  APC: §G[?hezbollah_weekly_apc]§!\n £GFX_unit_Arm_Inf_Bat_icon_small  IFV: §G[?hezbollah_weekly_ifv]§!\n£GFX_unit_category_all_armor_icon_small   MBT: §G[?hezbollah_weekly_mbt]§!\n  £GFX_rocket_modifiericons_texticon   MLRS: §G[?hezbollah_weekly_mlrs]§!\n£GFX_unit_Mot_Inf_Bat_icon_small   Utility Vehicle: §G[?hezbollah_weekly_mrf]§!\n\n§RThe list above will be updated every week.§!"
