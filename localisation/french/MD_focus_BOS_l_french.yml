 BOS_politicized_army: "Armée politisée"
 BOS_srpska_lead_government_desc: "Les partis politiques serbes, notamment l'Alliance des sociaux-démocrates indépendants (SNSD) et le Parti démocratique serbe (SDS), ont joué un rôle important au sein du gouvernement de la Republika Srpska. Ces partis ont souvent fait partie de coalitions gouvernementales et ont occupé plusieurs postes clés, notamment la présidence et le poste de Premier ministre. Les politiciens serbes ont également exercé une influence au Parlement de la Republika Srpska et au Parlement national de Bosnie-Herzégovine. Globalement, les partis et les politiciens serbes ont joué un rôle important dans l'élaboration de l'orientation et des politiques du gouvernement de la Republika Srpska et dans la défense des intérêts de la communauté serbe de Bosnie-Herzégovine."
 BOS_expand_federalization_desc: "Une plus grande autorité des entités protégera les institutions locales tout en maintenant cohérentes la politique étrangère et de défense de la Bosnie."
 BOS_politicized_army_desc: "Les loyautés d'entité et les nominations politiques divisent encore les forces armées. Une intégration progressive peut créer une institution nationale professionnelle."
 BOS_anti_government_demonstrations: "Manifestations antigouvernementales"
 BOS_politicized_army_idea: "Armée politisée"
 BOS_politicized_army_idea_desc: "L'armée bosniaque n'est utile que pour les parades et pour frapper les assaillants à coups de bâton. Elle est profondément divisée en interne selon des critères ethniques, ce qui conduira presque certainement à une unité désorganisée au déclenchement de la guerre, si un tel événement devait se produire."
