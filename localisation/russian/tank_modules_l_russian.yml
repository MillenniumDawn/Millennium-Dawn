 medium_tank_destroyer_chassis_0: "Корпус лёгкого танка 1-го поколения"
 medium_tank_destroyer_chassis_0_desc: "Роль легких танков — разведка и воздушно-десантные операции, но у них есть недостаток — слабая броня и низкая выживаемость под различными противотанковыми средствами сегодня. В сочетании с появлением пехотных танков развитие легких танков пошло на спад."
