 ENG_royal_navy_Idea4_desc: "영국 왕립 해군은 수 세기에 걸친 유서 깊은 유산을 지닌 세계 최고의 해상 전력 중 하나입니다. 뛰어난 적응력과 기술력으로 명성이 높은 왕립 해군은 영국의 해양 이익을 수호하고 전 세계에 힘을 투사하는 데 중요한 역할을 합니다."
 ENG_royal_navy_Idea5: "영국 왕립 해군"
 ENG_royal_navy_Idea5_desc: "영국 왕립 해군은 수 세기에 걸친 유서 깊은 유산을 지닌 세계 최고의 해상 전력 중 하나입니다. 뛰어난 적응력과 기술력으로 명성이 높은 왕립 해군은 영국의 해양 이익을 수호하고 전 세계에 힘을 투사하는 데 중요한 역할을 합니다."
 ENG_british_foregin_legion_idea: "영국 외인부대"
 ENG_british_foregin_legion_idea_desc: "영국의 이익을 추구하기 위해 전 세계의 병사들이 영국군에 입대하는 것을 허용합니다."
 ENG_field_army_expansion_idea: "야전군 확장"
 ENG_field_army_expansion_idea_desc: "확장된 야전군은 재래식 전쟁에서 평화 유지 임무에 이르기까지 다양한 작전 환경에서 탁월한 능력을 발휘하도록 설계되었습니다. 이 구상은 대비 태세, 기동성, 동맹군과의 상호 운용성을 강조하는 영국의 폭넓은 방위 전략에 부합합니다. 야전군의 성장과 현대화에 투자함으로써 영국은 21세기의 변화하는 위협에 대응할 수 있는 다재다능하고 기민한 지상군을 유지하겠다는 의지를 강화합니다."
 ENG_multi_ocean_training: "다대양 훈련"
 ENG_multi_ocean_training_desc: "이 전략 프로그램은 전문 훈련 연습, 시뮬레이션, 실전 시나리오를 통해 왕립 해군의 역량과 대비 태세를 높이는 데 중점을 둡니다. 해군 인원을 대서양에서 태평양, 그 너머에 이르기까지 각 대양의 고유한 도전에 노출시킴으로써, 이 구상은 적응력, 다재다능함, 그리고 세계적 규모의 효과적인 해상 작전을 보장합니다."
 ENG_carrier_wing_procurement: "항공모함 항공단 조달"
 ENG_carrier_wing_procurement_desc: "확장된 항공모함 항공단 조달 구상은 퀸 엘리자베스급 항공모함의 항공 전력을 강화하겠다는 영국의 의지를 강조합니다. 이 전략적 노력은 함재기의 획득과 확충을 포함하며, 항공모함 항공단의 작전 범위와 다재다능함을 높이기 위한 첨단 플랫폼에 초점을 맞춥니다. 조달 구상에는 F-35B 라이트닝 II 같은 최첨단 항공기와 지원 및 정찰 자산의 통합이 포함됩니다. 이 확충은 항공모함의 역량을 강화하여 다양한 임무를 수행할 수 있는 강력한 항모 전단을 보장하도록 설계되었습니다."
 ENG_strategic_aircraft_strategy_idea: "전략 항공기 전략"
 ENG_strategic_aircraft_strategy_idea_desc: "전략 항공기 전략은 영국이 국가 방위 목표를 효과적으로 지원하고, 국제 안보 노력에 기여하며, 세계 안보 환경의 새로운 위협에 적응할 수 있는 강력하고 유능한 전략 항공기 전력을 유지하도록 하는 것을 목표로 합니다."
 ENG_army_specialization_army: "육군 전문화 "
 ENG_army_specialization_army_desc: ""
 ENG_army_specialization_air: "공군 전문화"
 ENG_army_specialization_air_desc: ""
 ENG_army_specialization_navy: "해군 전문화"
 ENG_army_specialization_navy_desc: ""
 ENG_army_specialization_staff: "참모 전문화"
 ENG_army_specialization_staff_desc: ""
 ENG_auxiliary_navy1: "왕립 보조 해군"
 ENG_auxiliary_navy1_desc: "왕립 보조 해군 개념은 해군 작전에서 민간 지원의 중요성을 강조하며, 왕립 해군이 해양 책무를 수행하는 데 있어 효율성과 대비 태세를 보장하기 위한 군 인원과 민간 인원의 협력 노력을 부각합니다."
 ENG_auxiliary_navy2: "왕립 보조 해군"
 ENG_auxiliary_navy2_desc: "왕립 보조 해군 개념은 해군 작전에서 민간 지원의 중요성을 강조하며, 왕립 해군이 해양 책무를 수행하는 데 있어 효율성과 대비 태세를 보장하기 위한 군 인원과 민간 인원의 협력 노력을 부각합니다."
 ENG_royal_army1: "영국 왕립 육군"
 ENG_royal_army1_desc: "영국 육군은 영국군의 지상전 부문으로, 영국의 주된 지상 군사력입니다. 수 세기에 걸친 풍부한 역사를 가진 영국 육군은 전문성, 적응력, 작전 효율로 명성이 높습니다. 다양한 배경을 가진 고도로 훈련된 병사들로 구성된 육군은 전투 작전, 평화 유지 임무, 재난 구호 활동, 인도주의 지원 임무를 포함한 광범위한 임무를 수행할 수 있는 장비를 갖추고 있습니다."
 ENG_royal_army2: "영국 왕립 육군"
 ENG_royal_army2_desc: "영국 육군은 영국군의 지상전 부문으로, 영국의 주된 지상 군사력입니다. 수 세기에 걸친 풍부한 역사를 가진 영국 육군은 전문성, 적응력, 작전 효율로 명성이 높습니다. 다양한 배경을 가진 고도로 훈련된 병사들로 구성된 육군은 전투 작전, 평화 유지 임무, 재난 구호 활동, 인도주의 지원 임무를 포함한 광범위한 임무를 수행할 수 있는 장비를 갖추고 있습니다."
 ENG_royal_army3: "영국 왕립 육군"
 ENG_royal_army3_desc: "영국 육군은 영국군의 지상전 부문으로, 영국의 주된 지상 군사력입니다. 수 세기에 걸친 풍부한 역사를 가진 영국 육군은 전문성, 적응력, 작전 효율로 명성이 높습니다. 다양한 배경을 가진 고도로 훈련된 병사들로 구성된 육군은 전투 작전, 평화 유지 임무, 재난 구호 활동, 인도주의 지원 임무를 포함한 광범위한 임무를 수행할 수 있는 장비를 갖추고 있습니다."
 ENG_royal_airforce1: "왕립 공군의 유령들"
 ENG_royal_airforce1_desc: "유서 깊은 역사에도 불구하고 시대에 뒤처진 왕립 공군(RAF)은 노후한 장비와 제한된 역량의 시대를 반영합니다. 구식 항공기와 부족한 현대화 노력에 발목이 잡힌 이 국가 정신은 낡은 기술로 제공권을 유지하는 데 따르는 어려움을 상징합니다. 그러나 이러한 제약 속에서도 RAF 유산의 정신은 이어지며, 적응하고 극복하려는 회복력과 결의를 북돋웁니다."
 ENG_royal_airforce2: "현대화 중인 왕립 공군"
 ENG_royal_airforce2_desc: "현대화 중인 왕립 공군은 종합적인 현대화 노력을 통해 항공 전력 역량을 되살리는 전략적 전환을 구현합니다. 항공기 개량, 기술 역량 강화, 최첨단 체계에 대한 투자에 중점을 둔 이 국가 정신은 변화하는 전장 공간에서 RAF가 계속 제공권의 최전선에 서도록 보장하려는 능동적 접근을 반영합니다."
 ENG_royal_airforce3: "현대화된 왕립 공군"
 ENG_royal_airforce3_desc: "제공권과 신속 대응에 중점을 둔 현대화된 왕립 공군은 최첨단 전투기와 첨단 전투 역량을 갖춘 막강한 전력을 나타냅니다. 하늘을 지배하고 비길 데 없는 속도와 정밀도로 적과 교전할 수 있는 기민한 전투기를 갖춘 이 국가 정신은, 비견할 데 없는 항공 전력으로 제공권을 유지하고 국익을 수호하겠다는 RAF의 의지를 보여줍니다."
 ENG_royal_airforce4: "현대화된 왕립 공군"
 ENG_royal_airforce4_desc: "현대화된 왕립 공군은 최신예 폭격기와 정밀 타격 능력으로 특징지어지는 전략적 항공 전력 투사의 새 시대를 알립니다. 장거리 임무와 정밀 유도 무기를 갖춘 첨단 폭격기를 통해 이 국가 정신은 고가치 표적에 결정적이고 정밀한 공습을 가하고, 비할 데 없는 정밀도로 힘을 투사하며 적을 억제하는 RAF의 능력을 강조합니다."
 ENG_royal_airforce5: "현대화된 왕립 공군"
 ENG_royal_airforce5_desc: "현대화된 왕립 공군은 최신예 폭격기와 정밀 타격 능력으로 특징지어지는 전략적 항공 전력 투사의 새 시대를 알립니다. 장거리 임무와 정밀 유도 무기를 갖춘 첨단 폭격기를 통해 이 국가 정신은 고가치 표적에 결정적이고 정밀한 공습을 가하고, 비할 데 없는 정밀도로 힘을 투사하며 적을 억제하는 RAF의 능력을 강조합니다."
 ENG_airbus_expansion: "에어버스 확장"
 ENG_airbus_expansion_desc: "에어버스 확장은 혁신, 탁월함, 고객 만족에 대한 기업의 의지를 강조하는 동시에, 영국 항공우주 산업의 경제 발전, 일자리 창출, 기술 진보에도 기여합니다."
 ENG_homegrown_innovation: "자생적 혁신"
 ENG_homegrown_innovation_desc: "자생적 혁신 추진은 영국 항공우주 및 항공 분야 내에 혁신과 기업가 정신의 문화를 조성하는 것을 목표로 합니다."
 ENG_homegrown_innovation_us1: "미·영 공군 혁신 협력"
 ENG_homegrown_innovation_us1_desc: "미국은 공군을 혁신하기 위해 영국과 협력하고 있습니다."
 ENG_joint_strike_fighter_project_US1: "미·영 공군 혁신 협력"
 ENG_joint_strike_fighter_project_US1_desc: "미국은 공군을 혁신하기 위해 영국과 협력하고 있습니다."
 ENG_trans_atlantic_defence: "대서양 횡단 방위"
 ENG_harmony_doctrine_idea: "조화 교리"
 ENG_harmony_doctrine_idea_desc: "조화 교리는 환경적 균형을 국익으로 간주하여 토지, 물, 기후 회복력의 관리를 위해 왕실의 영향력을 결집합니다. 안정을 희생하지 않으면서 정부와 산업계를 지속 가능한 생산, 더 깨끗한 에너지, 장기적 보전으로 이끕니다. 영국은 분수에 맞게 살아감으로써 번영할 것이며, 왕궁은 자연이 국정 운영의 일부임을 강조할 것입니다."
 ENG_abolish_devolution_TT: "권한 이양에 관한 모든 정책을 되돌립니다!\n - [SCO.GetFlag] 스코틀랜드, [WAS.GetFlag] 웨일스, [NIR.GetFlag] 북아일랜드에서 봉기가 일어납니다.\n - 권한 이양 체계를 사용할 수 없게 됩니다"
 ENG_annex_ireland_TT: "결정을 통해 [IRE.GetFlag] §H아일랜드§!를 중핵으로 삼을 수 있게 됩니다!"
 ENG_still_can_TT: "§O다른 수단으로 이들을 괴뢰국으로 만든다면 우리는 여전히 영연방 연방을 수립할 수 있습니다!§!"
 ENG_declares_commonwealth_federation_TT: "§H영연방 연방§!을 선포합니다\n - 주요 영연방 종속국들을 §H병합§!하고 §H중핵화§!합니다\n- 우리나라의 국기와 국명이 변경됩니다"
 ENG_has_overthrown_current_system_TT: "웨스트민스터 체제를 전복했음"
 ENG_unlock_uniting_the_realm_decisions_TT: "£decision_icon_small §Y잠금 해제§!: 왕국 통합 결정\n - 이 결정들을 통해 다른 영연방 국가들을 우리의 영향권으로 끌어들일 수 있습니다"
 ENG_unlock_the_next_era_TT: "[IOM.GetFlag] 맨 섬을 [ADS.GetFlag] §H앨비어니스 방위군§!으로 이관합니다\n - 이는 우리의 직접 통제를 받는 새로운 민간 군사 기업(PMC) 집단이 됩니다\n - 이들을 활용하여 NATO 내 군 지도자, 정치인, 민간인을 모집, 매수, 설득함으로써 NATO를 분열시킬 수 있습니다\n - 이들은 우리의 예산으로 운영되며 자체 상비 직업군을 보유하게 됩니다"
 ENG_raid_enalbed_TT: "§H새로운 습격 잠금 해제§!: 델타 수비 작전\n - 델타 지역 일대의 [NIG.GetFlag] 나이지리아 유전을 진입하여 장악할 수 있습니다\n £text_icon_kaldanger [NIG.GetFlag] 나이지리아가 보복할 경우 장기전에 휘말릴 수 있습니다"
 ENG_raid_enabled_2_TT: "§H새로운 습격 잠금 해제§!: 세이프가드 작전\n - [ENG.GetFlag] 영국 특수 부대가 진입하여 [ZIM.GetFlag] 짐바브웨의 독재자를 축출하고 [ENG.GetFlag] 영국이 지원하는 강권 통치자로 교체함으로써 [ZIM.GetName]에 대한 영향력을 얻을 수 있습니다"
 ENG_raid_enabled_3_TT: "§H새로운 습격 잠금 해제§!: 동부 분할 작전\n - [ENG.GetFlag] 영국 특수 부대가 진입하여 [EGY.GetFlag] 시나이의 요충 지역을 점령함으로써 해당 지역에서 영국의 항만 접근을 용이하게 할 수 있습니다.\n - 시나이에서 습격이 가능해집니다"
 ENG_every_non_nato_eu_TT: "NATO에 가입하지 않은 §H유럽§!의 모든 국가:"
 ENG_migrants_welcomed_TT: "§H이민법§!을 완화함으로써 다음과 같은 결과가 발생합니다.\n - 5년에 걸쳐 무작위 주에 새로운 공장이 생겨납니다\n - 반이민 정서가 고조되어 불안정이 증가합니다"
 ENG_shatter_two_party_system_TT: "§H양당제§!를 개혁함으로써 다음과 같은 결과가 발생합니다.\n - 더 많은 정당이 의회에서 권력을 얻을 수 있게 됩니다\n - 다른 정당이 집권할 가능성이 높아집니다"
 additional_income_visit_britain_TT: "관광객으로부터 자금을 얻습니다"
 additional_income_aston_martin_TT: "제임스 본드가 자랑스러워합니다"
 ENG_joint_expeditionary_force_tt: "해당 국가들과 §G높은 관계§!를 유지하면 귀국의 초청을 수락할 가능성이 높아집니다"
