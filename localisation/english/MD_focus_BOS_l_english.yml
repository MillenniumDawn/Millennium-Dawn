 # Focuses
 BOS_army_of_the_federation_bosnia_herzegovina: "Federation Army"
 BOS_army_of_the_federation_bosnia_herzegovina_desc: "The Federation's Bosniak and Croat formations must enter the national command structure without losing operational readiness."
 BOS_army_of_republic_of_srpska: "Republika Srpska Army"
 BOS_army_of_republic_of_srpska_desc: "Republika Srpska's formations must be represented in the new armed forces if military unification is to endure."
 BOS_air_doctrine: "Review Air Doctrine"
 BOS_air_doctrine_desc: "Bosnia's small air arm needs a doctrine suited to territorial defense, transport, and support of ground forces."
 BOS_mechanization_of_the_army: "Mechanize the Army"
 BOS_mechanization_of_the_army_desc: "Protected mobility will let a small army move reserves quickly and survive on a modern battlefield."
 BOS_national_high_command: "National High Command"
 BOS_national_high_command_desc: "A joint high command will place the entity armies under national civilian authority and establish common planning standards."
 BOS_air_defence_initiative: "Air Defence Initiative"
 BOS_air_defence_initiative_desc: "A layered air defense network offers Bosnia a practical answer to hostile aircraft without requiring a large fighter fleet."
 BOS_aerial_dominance: "Aerial Dominance"
 BOS_aerial_dominance_desc: "A combat aviation program will prioritize fighter readiness, pilot quality, and control of Bosnian airspace."
 BOS_transportation_methods: "Modernize Army Transport"
 BOS_transportation_methods_desc: "Modern utility vehicles and logistics procedures will improve deployment speed and reduce supply failures."
 BOS_apc_armament: "Armored Personnel Carriers"
 BOS_apc_armament_desc: "Equipping units with armored personnel carriers will protect infantry while giving mechanized formations greater firepower."
 BOS_wave_tactics: "Massed Infantry Tactics"
 BOS_wave_tactics_desc: "A reserve-heavy doctrine will use concentrated infantry formations to hold ground and absorb sustained pressure."
 BOS_civilian_training: "Expand Reserve Training"
 BOS_civilian_training_desc: "Expanded reserve instruction will prepare civilians for mobilization without maintaining an unaffordable standing force."
 BOS_re_enlist_ratko_mladic: "Re-Enlist Ratko Mladić"
 BOS_re_enlist_ratko_mladic_desc: "Returning Ratko Mladić to command would provide experience at the cost of reconciliation and international legitimacy."
 BOS_detain_ratko_mladic: "Detain Ratko Mladić"
 BOS_detain_ratko_mladic_desc: "Cooperation with international justice will remove Ratko Mladić from military affairs, but anger many Bosnian Serbs."
 BOS_sam_systems: "Deploy SAM Systems"
 BOS_sam_systems_desc: "Fixed surface-to-air missile sites will protect Sarajevo and major military infrastructure from air attack."
 BOS_aa_personnel_equipment: "Equip Air Defense Units"
 BOS_aa_personnel_equipment_desc: "Mobile air defense teams need modern launchers, sensors, and training to accompany ground formations."
 BOS_restoration_of_old_aircraft: "Restore the Air Fleet"
 BOS_restoration_of_old_aircraft_desc: "Repairing inherited helicopters and rebuilding an air base will restore a limited transport aviation capability."
 BOS_aircraft_acquiring: "Acquire Russian Aircraft"
 BOS_aircraft_acquiring_desc: "Russian fighters offer a rapid route to combat aviation, though procurement and basing costs will strain the treasury."
 BOS_helicopter_transportation: "Expand Helicopter Transport"
 BOS_helicopter_transportation_desc: "A larger transport helicopter fleet will support rapid deployment, evacuation, and disaster relief."
 BOS_personal_carriers: "Infantry Fighting Vehicles"
 BOS_personal_carriers_desc: "Infantry fighting vehicles will complete the transition from motorized transport to protected combined arms units."
 BOS_resupply_equipment: "Modernize Support Equipment"
 BOS_resupply_equipment_desc: "Modern radios, support weapons, and logistics equipment will make frontline units more self-sufficient."
 BOS_artillery_refurbishment: "Refurbish the Artillery"
 BOS_artillery_refurbishment_desc: "Refurbishing inherited guns and standardizing ammunition will restore reliable fire support."
 BOS_small_arms_purchase: "Small Arms Purchase"
 BOS_small_arms_purchase_desc: "Foreign rifles can fill immediate stockpile shortages while domestic production is reorganized."
 BOS_mobilization_requirements: "Revise Mobilization Requirements"
 BOS_mobilization_requirements_desc: "Clear reserve obligations and call-up procedures will let the government expand the army during an emergency."
 BOS_combine_the_armies: "Combine the Armies"
 BOS_combine_the_armies_desc: "Full integration will dissolve parallel entity commands and create a single national chain of command."
 BOS_great_level_of_cooperation: "Coordinate the Entity Armies"
 BOS_great_level_of_cooperation_desc: "Entity formations can retain distinct traditions while adopting joint planning, training, and procurement."
 BOS_radar_detection_advancement: "Advance Radar Detection"
 BOS_radar_detection_advancement_desc: "A modern radar station will connect Bosnia's air defense units and provide earlier warning of approaching aircraft."
 BOS_domestic_production: "Domestic Aircraft Production"
 BOS_domestic_production_desc: "A domestic military plant will sustain air force equipment and reduce dependence on uncertain foreign suppliers."
 BOS_national_air_force_scheme: "National Air Force Program"
 BOS_national_air_force_scheme_desc: "A national air force program will combine fighter, support, and basing investments under one procurement plan."
 BOS_the_land_fleet: "Integrated Mechanized Fleet"
 BOS_the_land_fleet_desc: "Common vehicle standards will consolidate transports, carriers, and support vehicles into a maintainable mechanized force."
 BOS_main_battle_line: "Modern Anti-Armor Doctrine"
 BOS_main_battle_line_desc: "Anti-armor weapons and mobile reserves will let Bosnia counter heavier formations without funding a large tank fleet."
 BOS_boots_on_the_ground: "Infantry-Centered Army"
 BOS_boots_on_the_ground_desc: "Bosnia can center its defense on trained infantry, prepared positions, and a broad reserve rather than expensive vehicles."
 BOS_streamline_production: "Streamline Production"
 BOS_streamline_production_desc: "Standardized contracts and assembly methods will lower the cost of supplying infantry equipment."
 BOS_provide_equipment_updates: "Update Infantry Equipment"
 BOS_provide_equipment_updates_desc: "A scheduled modernization cycle will keep rifles and support weapons compatible across the armed forces."
 BOS_general_staff_reforms: "General Staff Reforms"
 BOS_general_staff_reforms_desc: "Professional planning, common staff procedures, and modern protective equipment will replace wartime improvisation."
 BOS_aerial_cooperation: "Integrate Air Operations"
 BOS_aerial_cooperation_desc: "Air defense and aviation commands will share surveillance data, basing plans, and operational control."
 BOS_officer_training: "Officer Training"
 BOS_officer_training_desc: "A national officer curriculum will build a professional corps loyal to state institutions rather than entity commands."
 BOS_military_drills: "Military Drills"
 BOS_military_drills_desc: "Joint exercises will test the new command structure and expose remaining failures in coordination."
 BOS_house_of_representatives: "Empower the House"
 BOS_house_of_representatives_desc: "A stronger House of Representatives will give national legislation a clear democratic mandate while preserving constitutional representation for each constituent people."
 BOS_prepping_an_offensive: "Prepare an Offensive"
 BOS_prepping_an_offensive_desc: "Staff officers will identify a decisive axis of advance and stockpile supplies before the next phase of the civil war."
 BOS_bosnian_elections: "Respond to the Financial Crisis"
 BOS_bosnian_elections_desc: "The global financial crisis has exposed Bosnia's dependence on foreign credit, weak exports, and divided institutions. The government must choose a recovery policy before the downturn becomes entrenched."
 BOS_bosnian_elections_crisis_gate_tt: "Only available while the country is under financial crisis conditions."
 BOS_economic_revision: "Revise Economic Policy"
 BOS_economic_revision_desc: "Tax policy must be revised to fund recovery without suppressing investment or household demand."
 BOS_post_war_effort: "Renew Postwar Recovery"
 BOS_post_war_effort_desc: "Unfinished reconstruction, displaced communities, and damaged institutions still constrain development years after the war."
 BOS_the_federation: "Renew the Federal Compact"
 BOS_the_federation_desc: "Renewing the federal compact will clarify entity powers and reduce foreign influence, though every constituent leadership must surrender some freedom of action."
 BOS_elections_political: "Reform the Electoral System"
 BOS_elections_political_desc: "Electoral reform will establish a durable mandate for the rotating presidency and determine which national coalition controls the modernization program."
 BOS_rally_the_troops: "Rally the Troops"
 BOS_rally_the_troops_desc: "Local commanders will recall reservists and rebuild units depleted by the opening battles."
 BOS_commence_the_offensives: "Commence the Offensive"
 BOS_commence_the_offensives_desc: "Coordinated attacks will exploit the preparations made by our field commands and force the enemy from key positions."
 BOS_dig_in: "Dig In"
 BOS_dig_in_desc: "Fortified positions and prepared fallback lines will preserve our forces if the offensive stalls."
 BOS_detain_serbian_generals: "Prosecute Serbian Generals"
 BOS_detain_serbian_generals_desc: "Prosecuting officers accused of wartime crimes will strengthen international confidence and the rule of law, but deepen resistance in Republika Srpska."
 BOS_release_serbian_generals: "Release Serbian Generals"
 BOS_release_serbian_generals_desc: "Releasing detained Serbian officers will support reconciliation with Republika Srpska and Serbia, despite criticism from victims' groups."
 BOS_grant_more_rights_to_serbian_peoples: "Protect Serbian Rights"
 BOS_grant_more_rights_to_serbian_peoples_desc: "Stronger guarantees for Serbian representation can reduce separatist pressure and direct investment toward neglected communities."
 BOS_oppress_serbian_back_supports: "Attract Foreign Motor Industry"
 BOS_oppress_serbian_back_supports_desc: "Foreign motor manufacturers can provide jobs and productive capital, but their influence will shape Bosnia's industrial policy."
 BOS_the_state: "Rebuild State Capacity"
 BOS_the_state_desc: "Capable national institutions are needed to coordinate recovery while respecting Bosnia's constitutional division of authority."
 BOS_grant_herzegovinians_more_rights: "Increase Police Funding"
 BOS_grant_herzegovinians_more_rights_desc: "Higher police funding will improve local security and enforcement, though the added expenditure will burden the national budget."
 BOS_limit_herzegovinians: "Remove the Police Money Pit"
 BOS_limit_herzegovinians_desc: "Reducing police expenditure will preserve public funds, but weaker enforcement may allow organized crime to expand."
 BOS_bosniak_lead_government: "Bosniak-Led Government"
 BOS_bosniak_lead_government_desc: "A Bosniak-led coalition will prioritize national institutions and open either reconciliation with the West or a more confrontational revanchist program."
 BOS_balkan_backyard: "Balkan Backyard"
 BOS_balkan_backyard_desc: "Shared memory of Yugoslav prosperity can support a voluntary regional project, but neighboring governments must be persuaded rather than pressured or coerced."
 BOS_srpska_lead_government: "Srpska-Led Government"
 BOS_srpska_lead_government_desc: "A Srpska-led coalition will defend entity institutions and pursue eastern partners, then choose between cooperative federalism and political supremacy."
 BOS_mobilize_the_nation: "Mobilize the Nation"
 BOS_mobilize_the_nation_desc: "Emergency mobilization will expand the pool of trained replacements available to the armed forces."
 BOS_request_military_supplies: "Request Military Supplies"
 BOS_request_military_supplies_desc: "Turkey and Albania may provide infantry weapons, but each government will decide whether it can spare the equipment."
 BOS_fight_or_perish: "Fight or Perish"
 BOS_fight_or_perish_desc: "The state will draw on its remaining manpower and accept the strain required to survive the civil war."
 BOS_bosnians_will_lead_the_military: "Civilian National Command"
 BOS_bosnians_will_lead_the_military_desc: "A civilian national command will complete the pro-integration recovery program and end emergency financial measures."
 BOS_unified_armed_forces: "Unified Armed Forces"
 BOS_unified_armed_forces_desc: "A unified force acceptable to all constituent peoples will complete the cooperative recovery program and end emergency financial measures."
 BOS_anti_serbian_propaganda: "Nationalize Foreign Industry"
 BOS_anti_serbian_propaganda_desc: "Nationalizing foreign industrial holdings will expand state control, but damage investor confidence and relations with Germany."
 BOS_anti_federation_propaganda: "Challenge the Federation"
 BOS_anti_federation_propaganda_desc: "Challenge federal authority, direct new industry toward Republika Srpska, and deepen ties with Serbia at the cost of national stability."
 BOS_improve_road_quality_in_sarajevo: "Improve Road Quality in Sarajevo"
 BOS_improve_road_quality_in_sarajevo_desc: "Repairing Sarajevo's road network will reconnect neighborhoods, reduce freight delays, and support further service-sector investment."
 BOS_improvement_of_the_health_care_system: "Improvements to the Health Care System"
 BOS_improvement_of_the_health_care_system_desc: "A national health care standard will expand access and replace the fragmented postwar system."
 BOS_secure_regional_support_for_government: "Secure Regional Support for the Government"
 BOS_secure_regional_support_for_government_desc: "A stable government requires cooperation from municipal and entity leaders, not only a parliamentary majority in Sarajevo."
 BOS_alija_izetbegovic_legacy: "Alija Izetbegović Legacy"
 BOS_alija_izetbegovic_legacy_desc: "Alija Izetbegović's legacy links Bosniak statehood to both democratic institutions and wartime mobilization. His successors must decide which part of that inheritance will guide Bosnia."
 BOS_european_relations: "Revive the Yugoslav Legacy"
 BOS_european_relations_desc: "Cultural and political outreach across the former Yugoslavia will turn nostalgia into support for regional cooperation."
 BOS_revive_relation_with_serbia_yugoslavia: "Revive Relations with [SER.GetName]"
 BOS_revive_relation_with_serbia_yugoslavia_desc: "Restoring official ties with Serbia will strengthen the Srpska-led government while alarming Bosniak and Croat leaders."
 BOS_crackdown_of_anti_war_propaganda: "Counter Antiwar Propaganda"
 BOS_crackdown_of_anti_war_propaganda_desc: "Wartime censorship and counterpropaganda will sustain public resolve at the cost of open political debate."
 BOS_formation_of_a_junta: "Form a Wartime Junta"
 BOS_formation_of_a_junta_desc: "A military council can impose unity on the war effort, but civilian institutions will lose control of the state."
 BOS_removal_of_the_dayton_accords: "Reform the Dayton Order"
 BOS_removal_of_the_dayton_accords_desc: "Reforming the Dayton system will transfer more responsibility to national institutions while preserving the peace settlement's protections."
 BOS_post_war_clean_up: "Postwar Cleanup"
 BOS_post_war_clean_up_desc: "Clearing ruins, unexploded ordnance, and abandoned sites will prepare damaged regions for reconstruction."
 BOS_improve_service_industry: "Improve Service Industry"
 BOS_improve_service_industry_desc: "Modern offices, reliable utilities, and lower business taxes will help Sarajevo develop a competitive service economy."
 BOS_improvement_of_the_education_system: "Improvements to the Educational System"
 BOS_improvement_of_the_education_system_desc: "Common education standards and better schools will improve skills while limiting corruption in public administration."
 BOS_banja_luka_mine: "Banja Luka Mine"
 BOS_banja_luka_mine_desc: "Modern equipment and safety standards can return Banja Luka's mining sector to profitable production."
 BOS_farming_sector: "Farming Sector"
 BOS_farming_sector_desc: "Mine clearance and agricultural investment will help family farms modernize and supply domestic markets."
 BOS_eu_loans: "EU Development Loans"
 BOS_eu_loans_desc: "European development credit will provide immediate liquidity for reconstruction while adding a measured debt obligation."
 BOS_end_nato: "Confront NATO"
 BOS_end_nato_desc: "The Islamist government will challenge NATO's regional position and prepare for a confrontation it may not be able to control."
 BOS_bosnian_revanchism: "Bosnian Revanchism"
 BOS_bosnian_revanchism_desc: "Revanchist leaders will place Bosniak wartime claims above the Dayton compromise, strengthening military interests while risking renewed communal conflict."
 BOS_national_appeasement: "National Reconciliation"
 BOS_national_appeasement_desc: "A reconciliation program will improve relations among Bosniaks, Croats, and Serbs and commit the government to peaceful constitutional reform."
 BOS_western_objectives: "Western Alignment"
 BOS_western_objectives_desc: "A firm Western alignment will open Euro-Atlantic institutions and security assistance while closing the eastern alternative."
 BOS_eastern_frontier: "Eastern Alignment"
 BOS_eastern_frontier_desc: "Bosnia will pursue Russian and Serbian partnerships as an eastern counterweight to Western oversight."
 BOS_role_the_dice: "Risky Consolidation"
 BOS_role_the_dice_desc: "Srpska leaders can force rapid consolidation, accepting severe instability and a renewed risk of civil conflict."
 BOS_popular_support: "Build Popular Support"
 BOS_popular_support_desc: "A negotiated mandate across all three constituent peoples will give the Srpska-led government a safer route to reform."
 BOS_develop_national_sentiment: "Foster National Resolve"
 BOS_develop_national_sentiment_desc: "A sustained patriotic campaign will reinforce the wartime regime and keep national mobilization intact."
 BOS_land_mine_removal: "Land Mine Removal"
 BOS_land_mine_removal_desc: "A national demining program will map contaminated land, train clearance teams, and reduce the continuing human cost of the war."
 BOS_rebuild_infrastructure_in_sarajevo: "Rebuild Infrastructure in Sarajevo"
 BOS_rebuild_infrastructure_in_sarajevo_desc: "Reconstruction in Sarajevo will reinforce the capital's electrical grid and reopen its rail terminal, signaling that national recovery remains a priority."
 BOS_rebuild_infrastructure_in_srpska: "Rebuild Infrastructure in Srpska"
 BOS_rebuild_infrastructure_in_srpska_desc: "Rebuilding the grid at Banja Luka and the rail terminal at Bijeljina will connect Republika Srpska's communities to national markets and institutions."
 BOS_rebuild_infrastructure_in_herzegovina: "Rebuild Infrastructure in Herzegovina"
 BOS_rebuild_infrastructure_in_herzegovina_desc: "A reinforced grid and a working rail terminal in Herzegovina will improve access to Mostar and revive trade across the south."
 BOS_build_a_war_memorials: "Build War Memorials"
 BOS_build_a_war_memorials_desc: "Memorials will recognize civilian and military losses while giving communities places for public remembrance."
 BOS_make_way_for_more_industry: "Coordinate Rural Industry"
 BOS_make_way_for_more_industry_desc: "Mining and agriculture can support a broader rural industrial base if both sectors receive the required preparation."
 BOS_a_new_struggle: "A New Struggle"
 BOS_a_new_struggle_desc: "Revanchist organizers will mobilize nationalist networks and weaken the postwar political settlement."
 BOS_military_industrialization: "Defense Industrialization"
 BOS_military_industrialization_desc: "A costed arms plant in Sarajevo will support rearmament, provided the economy can staff and finance it."
 BOS_autonomy_advancements: "Expand Entity Autonomy"
 BOS_autonomy_advancements_desc: "Releasing Herzegovina and Republika Srpska as autonomous subjects will formalize entity self-government within Bosnia."
 BOS_us_assistance: "American Assistance"
 BOS_us_assistance_desc: "Closer commercial ties with the United States will replace broad NATO trade links with a focused bilateral partnership."
 BOS_bosnian_euro_defence_clause: "European Defense Guarantees"
 BOS_bosnian_euro_defence_clause_desc: "Key European states will decide individually whether to guarantee Bosnia as EUFOR transfers responsibility to national institutions."
 BOS_russo_bosnian_alignment: "Russian Partnership"
 BOS_russo_bosnian_alignment_desc: "A formal partnership with Russia will deepen eastern trade and political support without erasing Bosnia's sovereignty."
 BOS_serbian_bosnian_arms_treaty: "[SER.GetName] Bosnian Arms Treaty"
 BOS_serbian_bosnian_arms_treaty_desc: "Serbian production licenses will accelerate rearmament while increasing Belgrade's influence over Bosnian defense policy."
 BOS_srpska_supremacy: "Srpska Supremacy"
 BOS_srpska_supremacy_desc: "A supremacist program will dismantle power sharing and place the state under Srpska institutions, provoking the other constituent peoples."
 BOS_cooperative_effort: "Cooperative Federalism"
 BOS_cooperative_effort_desc: "A cooperative Srpska program will preserve federal institutions and pursue eastern alignment through consent rather than coercion."
 BOS_removal_of_lands_in_herzegovina: "Clear Mines in Herzegovina"
 BOS_removal_of_lands_in_herzegovina_desc: "Clearance teams will reopen contaminated land in Herzegovina for settlement, farming, and transport."
 BOS_removal_of_lands_in_central_bosnia: "Removal of Mines in Central Bosnia"
 BOS_removal_of_lands_in_central_bosnia_desc: "Removing mines from central Bosnia will protect its dense communities and restore productive land."
 BOS_removal_of_lands_in_central_srpska: "Clear Mines in Central Srpska"
 BOS_removal_of_lands_in_central_srpska_desc: "Mine clearance in central Republika Srpska will make damaged rural districts safe for recovery."
 BOS_rebuild_factories_in_sarajevo: "Rebuild Factories in Sarajevo"
 BOS_rebuild_factories_in_sarajevo_desc: "A rebuilt civilian factory and supporting infrastructure will restore industrial employment in Sarajevo."
 BOS_the_repair_of_srpska_and_herzegovina: "Repair Srpska and Herzegovina"
 BOS_the_repair_of_srpska_and_herzegovina_desc: "Balanced industrial and infrastructure investment in Srpska and Herzegovina will demonstrate that recovery extends beyond Sarajevo."
 BOS_national_unrest: "Labor Unrest"
 BOS_national_unrest_desc: "Falling stability and communal hostility have opened a path for labor organizations to challenge both nationalist blocs."
 BOS_national_awakening: "National Awakening"
 BOS_national_awakening_desc: "The revanchist movement will break with international oversight and prepare an Islamist seizure of state power."
 BOS_state_opposition: "State Opposition"
 BOS_state_opposition_desc: "A civic opposition will contest Srpska nationalist parties through elections, balancing federal authority against the risk of further alienating Serbian voters."
 BOS_relax_conscription_laws: "Relax Conscription Laws"
 BOS_relax_conscription_laws_desc: "Reducing compulsory service will ease the burden on households as entity forces return to national civilian control."
 BOS_cooperation_alignment: "Cooperative Alignment"
 BOS_cooperation_alignment_desc: "Joint administration and anti-corruption measures will align the entities with Sarajevo without abolishing their autonomy."
 BOS_bosnian_trade_alliance: "Western Arms Partnership"
 BOS_bosnian_trade_alliance_desc: "American aircraft and infantry weapon licenses will anchor a Western arms partnership."
 BOS_eastern_trade_bloc: "Eastern Trade Bloc"
 BOS_eastern_trade_bloc_desc: "Mutual trade agreements with Russia and Serbia will convert political alignment into sustained commercial access."
 BOS_beograd_conference: "Belgrade Conference"
 BOS_beograd_conference_desc: "A conference in Belgrade will settle security and economic disputes before Bosnia seeks a broader eastern alliance."
 BOS_commence_centralization: "Centralize the State"
 BOS_commence_centralization_desc: "Srpska authorities will transfer entity powers to the central government and suppress competing constitutional centers."
 BOS_national_agenda: "National Agenda"
 BOS_national_agenda_desc: "A shared legislative program will combine social stability, fiscal reform, and recognition of all three constituent peoples."
 BOS_expand_federalization: "Expand Federalization"
 BOS_expand_federalization_desc: "Greater entity authority will protect local institutions while keeping Bosnia's foreign and defense policy coherent."
 BOS_final_land_mine_removal_efforts: "Complete Landmine Clearance"
 BOS_final_land_mine_removal_efforts_desc: "Coordinating the regional programs will clear the remaining mapped minefields and close Bosnia's postwar demining campaign."
 BOS_workers_front: "Workers' Front"
 BOS_workers_front_desc: "A Workers' Front will organize disaffected unions into a national political force with its own economic program."
 BOS_muslim_strong_arm: "Islamist Vanguard"
 BOS_muslim_strong_arm_desc: "An Islamist vanguard will consolidate the new regime and seek support from sympathetic governments abroad."
 BOS_muslim_nationalism: "Muslim Nationalism"
 BOS_muslim_nationalism_desc: "Muslim nationalism will combine religious authority, mobilization, and an interventionist foreign policy."
 BOS_demote_serbian_irrational_nationalism_new: "Contain Serbian Hardliners"
 BOS_demote_serbian_irrational_nationalism_new_desc: "Federal parties will isolate hardline Serbian factions, trading short-term tension for a stronger civic state."
 BOS_accommodate_serbian_pride_new: "Accommodate Serbian Autonomy"
 BOS_accommodate_serbian_pride_new_desc: "Constitutional concessions will recognize Serbian autonomy and draw moderate Srpska parties into government."
 BOS_national_unity: "National Unity"
 BOS_national_unity_desc: "The entities will return to direct national administration after a negotiated transition, restoring a pluralist federal state."
 BOS_nato_status: "Seek NATO Membership"
 BOS_nato_status_desc: "Bosnia will seek NATO membership only after domestic reconciliation and the end of emergency foreign oversight."
 BOS_cooperative_alliance: "CSTO Partnership"
 BOS_cooperative_alliance_desc: "Russia will decide whether Bosnia's eastern partnership warrants admission to the CSTO."
 BOS_union_with_serbia: "Union with Serbia"
 BOS_union_with_serbia_desc: "Serbia will receive a negotiated proposal for political union and may accept or reject incorporation of Bosnia."
 BOS_introduction_of_mandatory_conscription: "Mandatory Conscription"
 BOS_introduction_of_mandatory_conscription_desc: "Mandatory service will expand the reserve at the cost of a heavier obligation on households and employers."
 BOS_decrease_poverty_rate: "Reduce Poverty"
 BOS_decrease_poverty_rate_desc: "Targeted social spending will reduce poverty and stabilize communities neglected during postwar recovery."
 BOS_the_teachings_of_orthodox: "Orthodox Social Compact"
 BOS_the_teachings_of_orthodox_desc: "Cooperation with the Orthodox clergy will strengthen the eastern social compact while displacing Islamic institutions from government."
 BOS_concessions_to_the_work_unions_new: "Union Compact"
 BOS_concessions_to_the_work_unions_new_desc: "A binding union compact will exchange social expenditure and workplace rights for political stability."
 BOS_puppet_economics_new: "Worker-Managed Economy"
 BOS_puppet_economics_new_desc: "Worker councils will receive a formal role in management while higher corporate taxation funds the new system."
 BOS_mosque_construction: "Mosque Construction Program"
 BOS_mosque_construction_desc: "State support for mosques and religious institutions will deepen the regime's Islamic identity."
 BOS_religious_identity: "Religious State"
 BOS_religious_identity_desc: "The Islamist state will claim leadership of Bosniak communities beyond its borders and prepare coercive regional policy."
 BOS_milorad_dodik_new: "Sideline Milorad Dodik"
 BOS_milorad_dodik_new_desc: "Removing Milorad Dodik's patronage network will reduce corruption but alienate parts of the Srpska electorate."
 BOS_european_affairs: "European Affairs"
 BOS_european_affairs_desc: "European trade and democratic institutions will become the foundation of Bosnia's peaceful foreign policy."
 BOS_tax_reforms: "Tax Reform"
 BOS_tax_reforms_desc: "Lower household and corporate tax rates will broaden political support while reducing immediate state revenue."
 BOS_state_atheism_new: "State Atheism"
 BOS_state_atheism_new_desc: "The worker government will remove religious privilege from state institutions, gaining administrative freedom at the clergy's expense."
 BOS_mechanical_production_new: "Mechanize Production"
 BOS_mechanical_production_new_desc: "Mechanized production and technical training will raise productivity and complete the worker economy's industrial transition."
 BOS_pathway_towards_eu_membership: "EU Membership Path"
 BOS_pathway_towards_eu_membership_desc: "Bosnia will meet European infrastructure and governance requirements while EU members decide whether to invest."
 BOS_formation_of_bonds_with_the_eu: "Build EU Economic Ties"
 BOS_formation_of_bonds_with_the_eu_desc: "Expanded commercial ties with the European Union will deepen market access and reduce financing costs."
 BOS_yugoslav_cultural_revival: "Yugoslav Cultural Revival"
 BOS_yugoslav_cultural_revival_desc: "State-funded film, music, and shared war memorials will present the Yugoslav decades as a common inheritance rather than a failed experiment."
 BOS_common_market_proposal: "Common Market Proposal"
 BOS_common_market_proposal_desc: "An offer of tariff-free trade among the successor states will rebuild the commercial ties severed in the 1990s."
 BOS_federal_charter: "Draft a Federal Charter"
 BOS_federal_charter_desc: "A published draft constitution for a voluntary federation will give the reunification movement a concrete political program."
 BOS_reconciliation_commission: "Reconciliation Commission"
 BOS_reconciliation_commission_desc: "A joint commission on wartime grievances will hear testimony from all three constituent peoples and lower the domestic cost of the Yugoslav project."
 BOS_convene_the_federation: "Convene the Federation"
 BOS_convene_the_federation_desc: "Sarajevo will summon the successor governments to negotiate a restored federation once popular support allows it."
 BOS_greater_srpska_state: "A Greater Srpska State"
 BOS_greater_srpska_state_desc: "The centralized state will be rebuilt around Srpska's institutions, replacing the union project with entity supremacy at home."
 BOS_purge_the_federation: "Purge the Federation"
 BOS_purge_the_federation_desc: "Bosniak and Croat officials will be removed from ministries, courts, and police commands, ending organized resistance to Srpska rule."
 BOS_srpska_command_primacy: "Srpska Command Primacy"
 BOS_srpska_command_primacy_desc: "Srpska officers will fill every senior post in the armed forces, binding the military to the entity's leadership."
 BOS_dominant_entity: "The Dominant Entity"
 BOS_dominant_entity_desc: "Srpska now governs Bosnia in fact and in law. The remaining federal institutions exist to serve the entity."
 BOS_council_democracy: "Council Democracy"
 BOS_council_democracy_desc: "Workplace councils will elect delegates to national bodies, giving organized labor a permanent constitutional role."
 BOS_nationalize_heavy_industry: "Nationalize Heavy Industry"
 BOS_nationalize_heavy_industry_desc: "The state will take controlling stakes in mills, mines, and machine plants and place them under council management."
 BOS_workers_republic: "Proclaim the Workers' Republic"
 BOS_workers_republic_desc: "The labor movement will replace the post-Dayton order with a socialist republic governed through its councils."
 BOS_business_sector_management: "Develop the Business Sector"
 BOS_business_sector_management_desc: "A costed office project in Sarajevo will formalize the service economy, provided enough workers are available to staff it."
 BOS_lumber_harvesting: "Develop the Forestry Sector"
 BOS_lumber_harvesting_desc: "Sustainable forestry and processing standards will expand rural exports without relying on another permanent subsidy program."
 BOS_politicized_army: "Politicized Army"
 BOS_politicized_army_desc: "Entity loyalties and political appointments still divide the armed forces. Gradual integration can create a professional national institution."
 BOS_land_doctrine: "Land Doctrine"
 BOS_land_doctrine_desc: "Bosnia needs a defensive doctrine suited to mountainous terrain, limited manpower, and a modest procurement budget."
 BOS_rifle_advancements: "Advance Service Rifles"
 BOS_rifle_advancements_desc: "Modern service rifles, body armor, and production methods will improve infantry effectiveness and domestic supply."

 #Decisions title
 BOS_land_mines: "Landmines"
 BOS_land_mines_desc: "Wartime minefields continue to kill civilians, restrict settlement, and remove productive land from use."
 BOS_prep_for_civil_war_map: "Civil War Preparations"
 BOS_prep_for_civil_war: "Civil War Preparation Operations"
 BOS_prep_for_civil_war_desc: "Republika Srpska is rearming as Bosnia approaches renewed civil conflict. Preparatory operations can secure weapons and improve the government's readiness before fighting begins."
 BOS_bosnian_faction_management: "Constituent Group Management"
 BOS_internal_factions: "The Peoples of Bosnia"
 BOS_internal_factions_desc: "The Dayton settlement divides authority among national institutions, the Federation of Bosnia and Herzegovina, and Republika Srpska. Government policy changes each constituent group's Attitude, Stability, and willingness to provide Manpower."
 BOS_return_of_entitled_lands: "Integrate Controlled Lands"
 BOS_return_of_entitled_lands_desc: "Integrate a neighboring controlled state after it reaches at least 80% Compliance and falls below 10% Resistance."
 BOS_islamic_uprising: "Fate of the Bosnian Civil War"
 BOS_islamic_uprising_desc: "El Mudžahid fighters may turn against both Sarajevo and Republika Srpska if the civil war outlasts their patience."
 BOS_declare_islamic_takeover: "El Mudžahid Revolt"
 BOS_declare_islamic_takeover_desc: "Foreign Islamist fighters are preparing to break with the government and establish their own state while the civil war continues."
 #Decisions
 BOS_core_states_2: "Integrate [FROM.GetName]"
 BOS_core_states_2_desc: "Commit political and industrial resources to integrating this compliant neighboring state."
 BOS_raid_weapon_stockpiles: "Raid Weapon Stockpiles"
 BOS_raid_weapon_stockpiles_desc: "Seize infantry weapons from unsecured wartime depots before renewed civil conflict begins."
 BOS_civil_war: "The Brewing Storm"
 BOS_civil_war_desc: "Republika Srpska is preparing to secede. If the crisis is not resolved, civil war will begin when this mission expires."
 BOS_croats_declare_independence: "Croats Declare Independence"
 BOS_croats_declare_independence_desc: "Hostile Croat communities may support a Herzegovinian secession if national Stability remains low."
 BOS_srpska_declares_independence: "Republika Srpska Declares Independence"
 BOS_srpska_declares_independence_desc: "Hostile Serb communities may support secession if national Stability remains low."
 BOS_quell_serbians: "Suppress Serb Opposition"
 BOS_quell_serbians_desc: "Use coercive measures against hostile Serb organizations, reducing their Attitude and Stability while shifting party support."
 BOS_gain_srpska_popular_support: "Gain Serbian Popular Support"
 BOS_gain_srpska_popular_support_desc: "Fund outreach and local programs to improve Serb Attitude and Stability."
 BOS_fund_bosniak_community_programs: "Fund Bosniak Community Programs"
 BOS_fund_bosniak_community_programs_desc: "Pay for schools, clinics, and local services in Bosniak areas out of the treasury. It rebuilds Bosniak Trust the way a political drive would, but with money instead of Political Power."
 BOS_fund_croat_community_programs: "Fund Croat Community Programs"
 BOS_fund_croat_community_programs_desc: "Pay for schools, clinics, and local services in Croat areas out of the treasury. It rebuilds Croat Trust the way a political drive would, but with money instead of Political Power."
 BOS_fund_srpska_community_programs: "Fund Serb Community Programs"
 BOS_fund_srpska_community_programs_desc: "Pay for schools, clinics, and local services in Serb areas out of the treasury. It rebuilds Serb Trust the way a political drive would, but with money instead of Political Power."
 BOS_collaboration_with_serbians: "Cooperate with Serb Leaders"
 BOS_collaboration_with_serbians_desc: "Turn friendly Serb leaders into loyal partners through sustained political cooperation."
 BOS_quell_bosniaks: "Suppress Bosniak Opposition"
 BOS_quell_bosniaks_desc: "Use coercive measures against hostile Bosniak organizations, accepting immediate instability to reshape party support."
 BOS_collaboration_with_bosniaks: "Cooperate with Bosniak Leaders"
 BOS_collaboration_with_bosniaks_desc: "Turn friendly Bosniak leaders into loyal partners through sustained political cooperation."
 BOS_quell_croats: "Suppress Croat Opposition"
 BOS_quell_croats_desc: "Use coercive measures against hostile Croat organizations, accepting immediate instability to reshape party support."
 BOS_gain_bosniak_popular_support: "Gain Bosniak Popular Support"
 BOS_gain_bosniak_popular_support_desc: "Fund outreach and local programs to improve Bosniak Attitude and Stability."
 BOS_collaboration_with_croats: "Cooperate with Croat Leaders"
 BOS_collaboration_with_croats_desc: "Turn friendly Croat leaders into loyal partners through sustained political cooperation."
 BOS_gain_croat_popular_support: "Gain Croat Popular Support"
 BOS_gain_croat_popular_support_desc: "Fund outreach and local programs to improve Croat Attitude and Stability."
 BOS_destabilize_the_government: "Destabilize the Government"
 BOS_destabilize_the_government_desc: "Deliberately collapse public confidence and war readiness. With stability and war support driven this low, hostile Serb or Croat entities can move to declare independence."
