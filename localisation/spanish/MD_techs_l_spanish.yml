 tech_light_guns_4: "Cañones navales 2045"
 tech_light_guns_4_desc: "Sistemas de armas navales tanto de pequeño como de gran calibre, diseñados para permitir el combate contra objetivos tanto de superficie como aéreos."
 module_naval_submarine_drone_control: "Control autónomo de submarinos"
 module_naval_submarine_drone_control_desc: "Las suites de control autónomo reducen la carga de la tripulación en las operaciones de submarinos al delegar la navegación rutinaria, la gestión de sensores y el mantenimiento de la posición a sistemas de decisión a bordo.\n\n§GConsejo de diseño: El control autónomo reduce drásticamente las necesidades de mano de obra al tiempo que mejora de forma generalizada los sensores, las armas, la protección y la velocidad. Es ideal para combatientes avanzados de tripulación reducida, pero tiene altos costes de capacidad industrial (IC) y microchips.§!"
 module_naval_patrol_boat_drone_control: "Control autónomo de patrulleros"
 module_naval_patrol_boat_drone_control_desc: "Los sistemas de control autónomo permiten que los patrulleros operen con requisitos reducidos de tripulación, manejando la navegación rutinaria, el mantenimiento de la posición y la gestión de sensores a través de una lógica de decisión a bordo y supervisión remota.\n\n§GConsejo de diseño: El control autónomo reduce drásticamente las necesidades de mano de obra al tiempo que mejora de forma generalizada los sensores, las armas, la protección y la velocidad. Es ideal para combatientes avanzados de tripulación reducida, pero tiene altos costes de capacidad industrial (IC) y microchips.§!"
 module_naval_corvette_drone_control: "Control autónomo de corbetas"
 module_naval_corvette_drone_control_desc: "Las suites de control autónomo permiten que las corbetas operen con requisitos reducidos de tripulación, automatizando la navegación rutinaria, la gestión de sensores y la asistencia en el control de daños, al tiempo que permiten la supervisión remota cuando sea necesario.\n\n§GConsejo de diseño: El control autónomo reduce drásticamente las necesidades de mano de obra al tiempo que mejora de forma generalizada los sensores, las armas, la protección y la velocidad. Es ideal para combatientes avanzados de tripulación reducida, pero tiene altos costes de capacidad industrial (IC) y microchips.§!"
 tech_tank_nuclear_engine_1: "Motor nuclear de tanque II"
 tech_tank_nuclear_engine_1_desc: "Los primeros conceptos de propulsión nuclear prometen un alcance operativo casi ilimitado y una reducción drástica en la logística de combustible convencional para las formaciones blindadas. La contrapartida es una complejidad extrema, requisitos de blindaje pesado contra la radiación y unos costes enormes de producción y mantenimiento, lo que convierte a este motor en un activo estratégico más que en un componente estándar."
 tech_tank_nuclear_engine_2: "Motor nuclear de tanque III"
 tech_tank_nuclear_engine_2_desc: "La miniaturización refinada de los reactores y la contención más segura hacen que el blindaje propulsado por energía nuclear sea más práctico en el terreno, mejorando la fiabilidad y la potencia de salida para las plataformas pesadas. Aunque siguen siendo prohibitivamente caros y de uso intensivo de recursos, estos motores permiten operaciones sostenidas a un ritmo elevado sin las limitaciones de combustible que normalmente definen la guerra blindada."
 tech_tank_hover_suspension_1: "Suspensión hover para APC II"
 tech_tank_hover_suspension_1_desc: "La suspensión por colchón de aire (hover) temprana reemplaza las orugas con módulos de sustentación que permiten a los APC deslizarse sobre terrenos difíciles, barro y aguas poco profundas, reduciendo la resistencia y acelerando el movimiento a campo traviesa. El sistema mejora la movilidad y la estabilidad de la marcha, pero incrementa el coste de producción y exige más energía y mantenimiento que un tren de rodaje convencional."
 tech_tank_hover_suspension_2: "Suspensión hover para APC III"
 tech_tank_hover_suspension_2_desc: "Un control de sustentación optimizado y una mayor eficiencia energética hacen que los APC hover sean más fiables en terrenos variados, reduciendo los picos en sus firmas térmicas/visuales y mejorando el manejo a alta velocidad. Los faldones y la estabilización mejorados limitan los problemas de polvo y escombros, manteniendo a las formaciones más rápidas y previsibles bajo situaciones de estrés."
 tech_tank_hover_suspension_3: "Suspensión hover para APC IV"
 tech_tank_hover_suspension_3_desc: "La suspensión hover de próxima generación integra sensores de terreno avanzados y corrección automática del equilibrio, permitiendo maniobras a alta velocidad en entornos urbanos saturados y terrenos rotos con una mínima pérdida de control. Gracias a una mayor durabilidad y una gestión de energía más inteligente, los APC hover obtienen una movilidad operativa sostenida, aunque la tecnología sigue siendo costosa y pesada en recursos."
