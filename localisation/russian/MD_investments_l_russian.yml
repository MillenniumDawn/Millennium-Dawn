 investments_standby_project: "Рассматривается"
 investments_standby_project_desc: "[THIS.GetName] анализирует наш запрос"
 investments_build_button_tt: "[investments_get_build_button_tt]"
 investments_build_button_tt_1: "Инвестиции в строительные проекты увеличат ваше влияние на выбранную страну и принесут инвестиционный доход вашей стране.\n\n§YКак уровень коррупции в стране, так и уровень инфраструктуры в регионе повлияют на общее время строительства. По умолчанию время строительства увеличено на 35%, независимо от модификаторов.§!\n\n§LЕсли целевая страна примет ваше предложение об инвестициях, по окончании периода строительства она получит здание.§!\nИИ отклонит инвестиции, если у него проблемы с экономикой или его внутреннее влияние слишком низкое.\nНам также нужно будет подождать 3 дня после отмены проекта в регионе, прежде чем снова инвестировать в него.\n\n[investments_gain_tooltip]"
 investments_build_button_tt_delayed: "§YПредпосылки§!:\n[!invest_button_click_enabled]\n§YЭффекты§!:\n[!invest_button_click]"
 investments_14_cooldown_tt: "Если страна примет его, запустится таймер на §Y14 дней§!, который начнёт отсчитываться с момента принятия.  Вы не получите больше влияния, сколько бы денег ни вложили в эту страну за время действия таймера."
 investments_30_cooldown_tt: "Если страна примет предложение, запустится таймер на §Y30 дней§!, который начнёт отсчитываться с момента принятия.  Вы не получите больше влияния, сколько бы денег ни вложили в эту страну за время действия таймера."
 investments_build_button_tt_2: "Отменить активный проект (в этом регионе можно делать не больше одной инвестиции в день)."
 investments_build_button_tt_b: "При нажатии на эту кнопку будет запрошено разрешение у владельца региона. Если он согласится, на вкладке «Решения» начнётся строительный проект. Этот проект будет повторяться до тех пор, пока не будут завершены все здания, стоящие в очереди.\n\n§YСкорость строительства снижается на 25% по сравнению с обычной (с учетом модификаторов скорости строительства в вашей стране).§!\n\n§LОдновременно может быть активен только один строительный проект.\n\nВ одном регионе не могут одновременно вести строительство несколько стран.\n\nВладелец этого региона откажет вам, если у него сложилось о вас негативное мнение.§!"
 investments_gain_tooltip: "[investments_gain_tooltip]"
 investments_event.1.t: "Инвестиционное предложение от [FROM.GetNameWithFlag]"
 investments_event.1.d: "[FROM.GetName] предлагает построить [?pending_offer_amount]x [investments_get_pending_offer_construction_type] в [?pending_offer_state.GetName].\n\nПолная стоимость проекта оценивается в $$[?pending_offer_total_cost] млрд. Ориентировочно на завершение проекта уйдёт [?pending_offer_duration] дней.  [FROM.GetName] предлагает нам сделку, по условиям которой мы вносим 10% от стоимости строительства. [FROM.GetNameWithFlag] потенциально может усилить своё влияние благодаря этой работе.  [FROM.GetNameWithFlag] получит прибыль от этого проекта.\n\n\nДней до завершения: [?pending_offer_duration]\nОбщая стоимость проекта ([FROM.GetNameWithFlag]): $$[?pending_offer_total_cost] млрд\nТип здания: [investments_get_pending_offer_construction_type]\nНаши расходы ([THIS.GetNameWithFlag]): $$[?investor_cost]\nМестоположение: [?pending_offer_state.GetName]"
 investments_event.1.o1: "Принять предложение"
 investments_event.1.o2: "Отклонить предложение"
 investments_event.2.t: "Отказано в разрешении на строительство"
 investments_event.2.d: "Мы получили отказ от нашего потенциального нового инвестиционного партнёра. Невероятно, что они отказались от нашего проекта! Мы же не получим никакого влияния или контроля над их правительством, помогая развивать их страну! Что ж, инвестиционная сделка с [FROM.GetName] в [?ROOT.investments_state_target.GetName] сорвалась, так что можно предложить её кому-нибудь ещё."
 investments_event.2.o1: "Может быть, их сосед..."
 investments_event.3.t: "Строительный проект отменён"
 investments_event.3.d: "К сожалению, мы не смогли завершить инвестиционную сделку с нашими партнёрами в [FROM.GetName]. Причин может быть много: отношения с правительством, нехватка финансирования или просто отсутствие интереса со стороны местных жителей. Мы всегда можем попробовать в другой раз."
 investments_event.3.o1: "Им же хуже!"
 investments_build_cost_tt: "§YСтоимость иностранных инвестиций§!\n\n§YСтоимость иностранных инвестиций§! §g— это первоначальные затраты на проект, который мы планируем запустить. Они напрямую списываются из казны и добавляются к нашим§! §Yмеждународным инвестициям§! §gпосле утверждения проекта.§!\n\n§gЕсли вы только что нажали на кнопку из другой страны или региона, увеличьте количество зданий или нажмите на другое здание, чтобы обновить всплывающую подсказку и увидеть реальную стоимость.§!\n\n§gНа стоимость инвестиционного проекта могут повлиять коррупция, национальные духи и многое другое. Коррупция в стране, в которую инвестируют, увеличит стоимость проекта в зависимости от уровня коррупции.§!\n"
 investments_build_cost_tt_delayed: "Модификаторы:\n§YСтоимость инвестиций в [PREV.CONTROLLER.GetNameWithFlag]:§! [?ROOT.displayable_monetary_cost_modifier|%0-] \n"
 investments_clock_tt: "§YВремя реализации инвестиций:§! [?ROOT.project_total_construction_duration_display^-1] дней\n\n§YВремя реализации инвестиций§! §gили продолжительность проекта — это общее время, которое потребуется для реализации предложенного нами проекта в [PREV.GetName]. Чем больше зданий вы предлагаете §Y[PREV.CONTROLLER.GetNameWithFlag]§! для реализации, тем дольше будет длиться проект.§!\n\n§gЕсли вы только что перешли из другой страны или региона, увеличьте количество зданий или выберите другое здание, чтобы обновить всплывающую подсказку и увидеть реальную стоимость.§!\n"
 investments_clock_tt_delayed: "Модификаторы:\n[investments_get_infrastructure]\n§YМодификатор инвестиций в [PREV.CONTROLLER.GetNameWithFlag]:§! [?ROOT.displayable_construction_modifier|%]\n"
