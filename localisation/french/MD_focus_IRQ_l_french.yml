 IRQ_constitutional_manipulation: "Manipulation constitutionnelle"
 IRQ_islam_over_state: "L’islam avant l’État"
 IRQ_war_against_propaganda: "Guerre contre la propagande"
 IRQ_gate_to_the_world: "Porte vers le monde"
 IRQ_quds_advice: "Conseils de Quds"
 IRQ_irgc_expertise: "Expertise du CGRI"
 IRQ_equality_society: "Égalité dans la société"
 IRQ_al_ansar_resurgence: "Résurgence d’Al-Ansar"
 IRQ_expulsion_of_iranian_idea: "Expulsion of Iranians"
 IRQ_expulsion_of_foreigners_idea: "Expulsion des étrangers"
 IRQ_democratic_youth_federation_idea: "Fédération de la jeunesse démocratique"
 IRQ_power_of_the_unions: "Pouvoir des syndicats"
 IRQ_al_hawasim: "Al Hawasim"
 IRQ_mahdi_army_expansion_idea: "Expansion de l’armée du Mahdi"
 IRQ_untrustworthy_neighbors: "Voisins peu fiables"
 IRQ_the_lions_den: "The Lion's Den"
 IRQ_strategic_partnerships: "Partenariats stratégiques"
 IRQ_sadrist_militias: "Mouvement sadriste"
 IRQ_sadrist_militias_desc: "Saraya al-Salam, the latest incarnation of the Mahdi Army, is the militia of the Sadrist Movement which is fighting on the frontlines together with the Iraqi Army. Its leader, Muqtada al-Sadr is a popular Iraqi Shia cleric and politician who has inherited his movement from his popular father. His platform is based on a cocktail of political Shiite Islam, Anti-Americanism, Iraqi independence from Iranian influence and Iraqi populist nationalism."
 IRQ_threat_of_al_qaeda: "Désastre imminent"
 IRQ_threat_of_al_qaeda_desc: "La dissolution des [IRQ.GetFlag] forces armées irakiennes a laissé de nombreux soldats et commandants sans emploi. Cela a conduit de nombreux éléments de l'armée à s'aligner sur divers groupes extrémistes du pays, dont [AIQ.GetFlag] Al-Qaïda en Irak. Si on les laisse faire, ce groupe pourrait lancer une attaque contre notre gouvernement.\n§W-----------------------------------------------------------------§!\nCet esprit national sera §Rretiré§! si nous résolvons la §Hcrise insurrectionnelle§!"
 IRQ_sunni_dynamic_idea: "Influence politique sunnite"
 IRQ_sunni_dynamic_idea_desc: "The Sunni community within our nation has mobilized in order to preserve their identity, way of life, and sense of being. Due to the rise of Shi'ism, and the marginalization of the Sunnis in political life, their mobilization will work against our nation's interests.\n§W-----------------------------------------------------------------§!\nThis national spirit will change dynamically every §H10§! levels that the §HSunni Political Variable§! changes by. Currently, Sunni Political Influence is at §H[?IRQ_sunni_political_influence]/100§!\n§W-----------------------------------------------------------------§!\nWhile this national spirit is active, §H[AIQ.GetFlag] Al-Qaeda in Iraq§! can start a §Rcivil war§! if Salafism is §H20%§! or greater, stability is less than §H55%§!, and our state religion is §HShia§!"
 IRQ_triumph_over_america: "Triomphe sur l’Amérique"
 IRQ_triumph_over_america_desc: "Our soldiers taught a lesson to the Americans that they will never forget."
 IRQ_mosque_income_idea: "Augmentation des taxes sur les mosquées"
 IRQ_mosque_income_idea_desc: "Pour financer divers projets dans le pays, nous avons augmenté les taxes prélevées sur les mosquées."
 IRQ_PIJ_idea: "Brigades du PIJ"
 IRQ_PIJ_idea_desc: "Les brigades du PIJ opèrent actuellement dans notre nation, et nous aideront à riposter contre l'État sioniste.\n§W-----------------------------------------------------------------§!\nCet esprit national sera §Rretiré§! si le §Hparti baasiste§! n'est plus au pouvoir, ou si [ISR.GetFlag] §HIsraël§! n'existe plus."
 IRQ_cult_of_saddam: "Culte de Saddam"
 IRQ_cult_of_saddam_desc: "Our great leader, Saddam Hussein, has brought great wealth and dignity to [IRQ.GetFlag] Iraq. His contributions must be cherished while he is still around.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or if §HSaddam Hussein§! is no longer the leader."
 IRQ_air_support_granted: "Soutien aérien contre les insurgés"
 IRQ_air_support_granted_desc: "Notre armée de l’air travaille sans relâche pour fournir un soutien aérien contre les insurgés dans notre nation."
 IRQ_recovering_from_the_gulf_war: "Récupération après la guerre du Golfe"
 IRQ_recovering_from_the_gulf_war_desc: "Après la guerre du Golfe dévastatrice, l’Irak se trouve dans un état de désarroi et de destruction. Ce conflit, marqué par d’intenses opérations aériennes et terrestres, a vu des batailles significatives qui ont laissé une empreinte durable sur la nation. Des premiers bombardements à la libération du Koweït en passant par la campagne terrestre qui a repoussé les forces irakiennes, la guerre a eu un lourd tribut."
 IRQ_MEK_bases: "Bases du MEK"
 IRQ_MEK_bases_desc: "Recognizing the strategic importance of the Mojahedin e Khalq (MEK) during the Iran-Iraq War, Iraq seeks to leverage their assistance and establish bases to enhance its military capabilities. This allows for the establishment of MEK bases within Iraq to threaten Iran, enabling an increase in the maximum number of volunteer forces that can be mobilized. Like its use in 1991 against the Kurds."
 IRQ_high_political_opposition: "Forte opposition politique"
 IRQ_high_political_opposition_desc: "L’Irak fait face à un défi majeur avec une forte opposition politique, englobant divers groupes ethniques minoritaires et communautés religieuses."
 IRQ_bastion_of_baathism: "Bastion du baasisme"
 IRQ_bastion_of_baathism_desc: "Dans les terres fertiles de l’Irak, les graines du baasisme ont été semées, germant au milieu des défis et des aspirations de l’époque. Des leaders visionnaires ont émergé, animés par un désir d’unité nationale, de nationalisme arabe et de justice sociale. Que les Arabes soient unis pour toujours !"
 IRQ_international_sanctions: "Sanctions internationales"
 IRQ_international_sanctions_desc: "En l’an 2000, l’Irak a subi les effets néfastes des sanctions internationales imposées après la guerre du Golfe en 1991. Ces sanctions ont sévèrement restreint la capacité de l’Irak à s’engager dans le commerce international, entravé sa reprise économique et entraîné une baisse des conditions de vie pour le peuple irakien. Elles ont également eu des conséquences humanitaires importantes, affectant l’accès aux soins de santé, aux services essentiels et aux ressources nécessaires aux besoins de base. Les effets durables de ces sanctions ont façonné le paysage économique et social de l’Irak durant cette période."
 IRQ_conscriptions_in_schools: "Conscription dans les écoles"
 IRQ_conscriptions_in_schools_desc: "Nous laissons les enfants quitter les cours pour les enrôler dans nos forces armées."
 IRQ_fadayyene_saddam: "Milices Fedayeen Saddam"
 IRQ_fadayyene_saddam_desc: "Nous avons ordonné à plusieurs unités des Fedayeen Saddam d’établir des positions défensives à travers le pays."
 IRQ_kurdish_friends: "Amis des Kurdes [KUR.GetFlag]"
 IRQ_kurdish_friends_desc: "The [KUR.GetFlag] Kurds have historically been ousted by most nations in the region, thus isolating them and leaving them with little to no friends. It's about time that we strengthen our friendship with the [KUR.GetFlag] Kurds, so that we may get what we want, liberation, freedom, and independence from foreign powers."
 IRQ_negotiations_with_kurdish_government: "Négociations avec le gouvernement kurde [KUR.GetFlag]"
 IRQ_negotiations_with_kurdish_government_desc: "En ouvrant des lignes de communication avec le gouvernement kurde [KUR.GetFlag], nous pourrions réintégrer le peuple kurde dans notre État sans effusion de sang."
 IRQ_bolster_communist_party_of_kurdistan_iraq: "Renforcer les idéaux communistes £KUR_Neutral_Communism_small au Kurdistan [KUR.GetFlag]"
 IRQ_bolster_communist_party_of_kurdistan_iraq_desc: "The [KUR.GetFlag] Kurdish people need one thing, and that is independence and liberation from all forms of foreign exploitation. By promoting communist ideals in [KUR.GetFlag] Kurdistan, we may be able to sway their people to finally join us hand in hand in this movement."
 IRQ_request_an_election: "Demander une élection"
 IRQ_request_an_election_desc: "En pressant le gouvernement kurde actuel [KUR.GetFlag] d’organiser une élection, les communistes kurdes [KUR.GetFlag] pourraient enfin avoir une chance de remporter leur siège légitime."
 IRQ_rojava_shipments: "Commencer les livraisons vers Rojava [ROJ.GetFlag]"
 IRQ_rojava_shipments_desc: "Le gouvernement syrien [SYR.GetFlag] a historiquement réprimé les Kurdes dans la région de Rojava [ROJ.GetFlag], et nous devons trouver des moyens de libérer ces peuples en leur apportant le soutien nécessaire là où c’est possible."
 IRQ_shipping_to_rojava: "Livraisons en cours…"
 IRQ_shipping_to_rojava_desc: "Les roues des camions de marchandises tournent en rond sur le sol syrien."
 IRQ_political_decisions: "Politique intérieure irakienne"
 IRQ_recall_nsa_bahrain: "Récupérer la NSA Bahreïn"
 IRQ_recall_nsa_bahrain_desc: "Il est temps de saisir et de consolider notre contrôle sur la NSA Bahreïn, un terrain occupé par les Américains !"
 IRQ_mek_revolt_trig: "La révolte"
 IRQ_mek_revolt_trig_desc: "Aujourd’hui, nous pouvons demander à nos amis du MEK de lancer une incursion transfrontalière en Iran et de renverser le régime des mollahs une fois pour toutes !"
 IRQ_the_blood_quran: "Terminer le « Coran de sang »"
 IRQ_the_blood_quran_desc: "En achevant et en annonçant le Coran de sang, écrit avec le sang de Saddam Hussein, notre gouvernement pourra tenter de montrer sa piété auprès du peuple irakien [IRQ.GetFlag], mais cela pourrait aussi se retourner contre nous…"
 IRQ_smuggle_goods_from_jordan: "Contrebande de marchandises depuis la Jordanie [JOR.GetFlag]"
 IRQ_smuggle_goods_from_jordan_desc: "La famille Hussein a de nombreuses connexions avec certains individus en Jordanie [JOR.GetFlag], et en utilisant ces relations, nous pouvons faire passer des marchandises en contrebande à travers la frontière sans que le gouvernement s’en rende compte."
 IRQ_al_salam_palace: "Redessiner le palais Al-Salam"
 IRQ_al_salam_palace_desc: "The Al-Salam Palace was initially designed in 1950, more than 50 years ago, and since then the palace has begun showing its age. Redesigning certain aspects of it could be useful in helping [IRQ.GetLeader] clear his mind when he needs to."
 IRQ_arrest_muqtada: "Arrêter Muqtada al-Sadr"
 IRQ_arrest_muqtada_desc: "That cockroach Muqtada has been running his mouth recently, and just like his father, we might need to find a solution."
 IRQ_civil_war_mechanic: "Crise de l’insurrection"
 IRQ_civil_war_mechanic_desc: "L’effondrement du §Hrégime de Saddam§! a conduit à l’effondrement total de l’armée irakienne. Beaucoup de nos §Hanciens militaires§! ont dédié leur vie à mener une guerre §Rcontre§! notre État, que ce soit pour leurs propres organisations ou des groupes §Rdjihadistes§!. Nous serons initialement en conflit avec les §Rsalafistes§!, mais les §Hchiites§! pourraient rapidement devenir hostiles si nous ne les rallions pas. Nous devrons attaquer les insurgés dans chaque État jusqu’à ce qu’ils §Hse rendent§! lorsqu’ils seront assez affaiblis. Notre §Hpréparation§! déterminera le succès de nos opérations. §HPréparation§! s’améliorera avec plus d’opérations ou en prenant certains focus.\n\nNous pouvons lancer des opérations en cliquant sur l’État. Nous perdrons §Héquipement§! et §Hpersonnel§! à chaque opération menée.\n\nLa carte changera §Hdynamiquement§! de couleur pour afficher notre §Hprogrès§!.\n\n§pViolet§! - Forces kurdes\n§RRouge§! - Forces djihadistes salafistes\n§YJaune§! - Forces chiites\n§OOrange§! - Insurrection moyenne\n§GVert§! - Faible insurrection\n\n§HPréparation§! : [?IRQ_government_readiness]%\n§HPersonnel§! : [?IRQ_government_troops]\n§HÉtats sécurisés§! : [?IRQ_variable_for_win]"
 IRQ_start_negotiations_shias: "Entamer des négociations avec les milices chiites"
 IRQ_start_negotiations_shias_desc: "Nous viendrons à la table des négociations avec les nombreuses milices chiites qui se sont formées pour conclure un accord visant à détruire notre ennemi commun. Si nous ne les rallions pas assez vite, elles pourraient devenir hostiles !"
 IRQ_request_coalition_forces: "Demander un soutien aérien"
 IRQ_request_coalition_forces_desc: "Si l’armée de l’air ne fait rien toute la journée, pourquoi payons-nous les pilotes ? Nous devons utiliser notre avantage dans les airs pour écraser les insurgés jusqu’à leur soumission."
 IRQ_request_awakening_council_militias: "Favoriser les discussions pour Al-Sahwah"
 IRQ_request_awakening_council_militias_desc: "Al-Sahwah, ou les Fils de l’Irak, est une alliance proposée entre les tribus sunnites et d’autres groupes pour combattre les insurgés. Nous pouvons intégrer leurs forces pour obtenir un avantage numérique sur les insurgés."
 IRQ_militarize_police_force: "Militariser la police"
 IRQ_militarize_police_force_desc: "Nous saisirons les armes et le personnel de la police pour les enrôler dans notre armée afin de repousser les insurgés, même si cela signifie couper les coins ronds sur leur formation."
 IRQ_recruitment_campaign: "Effort de formation"
 IRQ_recruitment_campaign_desc: "Nous devons entraîner et conditionner nos hommes pour gérer les insurgés de manière sûre et efficace. Cela réduira également les risques pour leurs vies."
 IRQ_iraq_war: "Le combat pour la survie"
 IRQ_iraq_war_desc: "The war for Iraq and its lands has begun. The United States will have a maximum of 6 months to capitulate the Iraqi government, or else they will have to order an immediate withdrawal from the nation and risk their influence."
 IRQ_war_phase_one: "Phase I"
 IRQ_war_phase_two: "Phase II"
 IRQ_war_phase_two_desc: "Les Américains faibliront, leurs efforts seront vains !"
 IRQ_preparation_for_the_war: "La guerre"
 IRQ_preparation_for_the_war_desc: "Ces impérialistes de [USA.GetFlag] §H[USA.GetName]§! ont lancé une campagne §Rinjustifiée§! contre notre nation !\n\nNous devrons rassembler notre force nationale et nos ressources pour §Hpréparer une guerre de survie§!. Avec ce que nous avons et l’expérience des guerres §Hd’Iran§! et §Hdu Golfe§!, nous créerons un enfer absolu pour tout envahisseur.\n\nSi nous parvenons à repousser les Américains pendant §Hau moins 6 mois§!, leur population les poussera à un §Hcessez-le-feu§! en raison de l’impopularité de la guerre !"
 IRQ_threaten_kuwait: "Menacer le Koweït [KUW.GetFlag]"
 IRQ_threaten_kuwait_desc: "The Americans have a base right under our nose, and the Kuwaitis are at fault for this. We will demand that they swiftly take control so that the Americans cannot attack us from Middle Eastern lands."
 IRQ_restore_the_iron_ring: "Restaurer l’Anneau de fer"
 IRQ_restore_the_iron_ring_desc: "L’Anneau de fer s’est révélé utile pour se défendre contre les Iraniens pendant la guerre Iran-Irak des années 80. Nous devons le remettre en place rapidement."
 IRQ_golden_guard_divisions: "Former des divisions de la Garde dorée"
 IRQ_golden_guard_divisions_desc: "Nous mobiliserons quelques divisions de la Garde dorée pour défendre notre nation et les entraînerons au plus haut niveau possible."
 IRQ_conscription_in_schools: "Conscription dans les écoles"
 IRQ_conscription_in_schools_desc: "We absolutely must get more manpower to field our units in the time of war, and schools are a perfect location for this very reason. They can get an education later."
 IRQ_kurdish_compromise: "Compromis kurde [KUR.GetFlag]"
 IRQ_kurdish_compromise_desc: "We will come to an agreement with the [KUR.GetFlag] Kurds, and secure our northern front from any sudden attacks if they accept, that is."
 IRQ_faddayean_saddam: "Mobiliser les Fedayeen Saddam"
 IRQ_faddayean_saddam_desc: "We need to prepare the Fedayeen Saddam for the incoming invasion, and by all means we must equip and train more divisions to continue the fight no matter what."
 IRQ_weapons_concealment: "Accélérer le programme de missiles"
 IRQ_weapons_concealment_desc: "Nous devons rapidement intensifier notre programme de missiles pour dévaster l’ennemi à distance si nécessaire."
 IRQ_contract_the_MEK: "Engager le £PER_anarchist_communism MEK"
 IRQ_contract_the_MEK_desc: "Mojahedin-e Khalq, or the £PER_anarchist_communism MEK have been residing in our country for a very long time. It is about time that we have them do something actually useful for our nation."
 IRQ_economic_union_menu: "Union de la prospérité islamique"
 IRQ_invite_to_economic_union_targeted_decision: "Invite [FROM.GetName]"
 IRQ_kick_from_economic_union_targeted_decision: "Exclure [FROM.GetName]"
 IRQ_the_constitution: "La Constitution irakienne"
 IRQ_the_constitution_desc: "Après le renversement de §YSaddam Hussein§! et du parti §Ybaasiste§! qui s'ensuivit, notre nation a été chargée de §Yrédiger une nouvelle constitution§! pour un Irak plus §Ydémocratique et libre§!. Chaque §Yarticle§! de la §YConstitution§! que nous rédigeons aura un §Yimpact§! sur l'avenir des partis politiques qui pourront être élus, et sur qui pourra faire de la politique."
 IRQ_constitution_draft_government_type: "Article I : Le gouvernement de l’Irak"
 IRQ_constitution_draft_government_type_desc: "Notre constitution doit préciser si notre nation sera une République islamique ou un État laïque."
 IRQ_constitution_draft_languages: "Article II : La langue de l’Irak"
 IRQ_constitution_draft_languages_desc: "La langue unit notre peuple, mais une large partie parle une langue autre que l’arabe. Nous devons décider si d’autres langues seront autorisées comme langues officielles de l’État."
 IRQ_constitution_draft_nationalism: "Article III : Le patriotisme en Irak"
 IRQ_constitution_draft_nationalism_desc: "Comme l’histoire l’a montré, un nationalisme et un patriotisme exacerbés ont conduit à la chute de notre nation. Nous devons clarifier cela dans l’Article III."
 IRQ_constitution_draft_democratic_form: "Article IV : La fédéralisation de l’Irak"
 IRQ_constitution_draft_democratic_form_desc: "Notre nation est composée de nombreux groupes ethniques – Kurdes, Assyriens, Turkmènes, et bien d’autres – ainsi que d’une division majeure entre les sects religieuses chiites et sunnites. Tout cela doit être pris en compte dans notre constitution."
 IRQ_constitution_draft_militias: "Article V : La sécurité de l’Irak"
 IRQ_constitution_draft_militias_desc: "Bien que notre nation disposera de forces armées, beaucoup de nos citoyens ne font pas confiance au gouvernement pour assurer leur sécurité et ont formé des milices. Nous devons préciser si ces milices sont légales ou non."
 IRQ_constitution_draft_identity: "Article VI : L’identité de l’Irak"
 IRQ_constitution_draft_identity_desc: "L’Irak est constitué de nombreux peuples, et nous devons clarifier si l’Irak adoptera une identité arabe ou une identité multiculturelle."
 IRQ_black_gold_decisions: "Or noir"
 IRQ_black_gold_decisions_desc: "Part of our post-victory plan is to secure economic domination in the region. Through the exploitation of corruption amongst the Southern Khaleeji states, we are able to slowly increase our grip over their most precious resource, oil. We will need to increase our influence in these nations in order to gain access to new decisions (such as buying up more shares) that will allow us to get one step closer to seizing these precious resources. Once we get more than 50% control over Aramco, we will be able to make an attempt to seize the company. The higher the control we have, the higher the chance of success will be.\n\n[SAU.GetFlag] Aramco Control: [?IRQ_aramco_control]/100"
 IRQ_open_aramco_scheme: "Ouvrir les décisions du plan Aramco [SAU.GetFlag]"
 IRQ_close_aramco_scheme: "Fermer les décisions du plan Aramco [SAU.GetFlag]"
 IRQ_find_dirt_on_saudi_king: "Trouver des secrets sur [SAU.GetLeader]"
 IRQ_find_dirt_on_saudi_king_desc: "La première étape pour mettre la main sur les actions d’Aramco sera de trouver de quoi faire chanter [SAU.GetFlag] [SAU.GetLeader]."
 IRQ_establish_the_hussein_fund: "Créer le Fonds Hussein"
 IRQ_establish_the_hussein_fund_desc: "En établissant le Fonds Hussein, nous pourrons injecter de l’argent dans les actions d’Aramco [SAU.GetFlag] via cette organisation sans attirer trop d’attention."
 IRQ_buy_shares_of_aramco: "Acheter des actions"
 IRQ_buy_shares_of_aramco_desc: "Nous pouvons maintenant acheter une petite quantité d’actions d’Aramco [SAU.GetFlag] grâce au Fonds Hussein, ce qui nous permettra d’acquérir des montants plus importants par la suite."
 IRQ_prop_up_iraqi_ceo: "Placer un PDG irakien [IRQ.GetFlag]"
 IRQ_prop_up_iraqi_ceo_desc: "En tirant quelques ficelles, nous pouvons imposer un PDG irakien [IRQ.GetFlag] comme nouveau dirigeant d’Aramco [SAU.GetFlag], augmentant ainsi notre contrôle sur l’entreprise."
 IRQ_seize_aramco: "Saisir Aramco [SAU.GetFlag]"
 IRQ_seize_aramco_desc: "Le moment est venu, nous devons lancer une prise de contrôle agressive de l’entreprise pour sécuriser les précieuses ressources de [SAU.GetFlag] [SAU.GetName] !"
 IRQ_send_over_iraqis_to_saudi_arabia: "Send over [IRQ.GetFlag] Iraqis to [SAU.GetFlag] [SAU.GetName]"
 IRQ_send_over_iraqis_to_saudi_arabia_desc: "By paying for the flights of thousands of [IRQ.GetFlag] Iraqis, we are able to ensure proper [IRQ.GetFlag] Iraqi influence in [SAU.GetFlag] [SAU.GetName]."
 IRQ_encourage_iraqis_to_work_for_aramco: "Encourage [IRQ.GetFlag] Iraqis to Work for [SAU.GetFlag] Aramco"
 IRQ_encourage_iraqis_to_work_for_aramco_desc: "Grâce aux personnes envoyées en [SAU.GetName], nous pouvons les inciter à travailler pour Aramco [SAU.GetFlag] afin d’établir des connexions potentielles au sein de l’entreprise."
 IRQ_buy_more_shares: "Acheter plus d’actions"
 IRQ_buy_more_shares_desc: "Nous pouvons accroître notre contrôle sur Aramco [SAU.GetFlag] en achetant davantage d’actions via notre Fonds Hussein."
 IRQ_regional_baathism_decisions: "£IRQ_Nat_Autocracy_small Baasisme régional"
 IRQ_regional_baathism_decisions_desc: "Notre faction compte des partisans à travers la région et le monde. En ralliant les adeptes de l’idéologie baasiste, nous pouvons créer un réseau de commandements régionaux sous notre contrôle. En plaçant des officiels irakiens loyaux et de haut rang à leur tête, nous assurons une fidélité totale de ces États."
 IRQ_appoint_control_syria: "Établir le commandement régional syrien £IRQ_Nat_Autocracy_small [SBP.GetFlag]"
 IRQ_appoint_control_egypt: "Establish the £IRQ_Nat_Autocracy_small [EBP.GetFlag] Egyptian Regional Command"
 IRQ_appoint_control_jordan: "Establish the £IRQ_Nat_Autocracy_small [JBP.GetFlag] Jordanian Regional Command"
 IRQ_clergy_balance_of_power_category: "§HRCampagne de retour à la foi§!"
 IRQ_secularists_bop_mid_range: "Entre islamisme et laïcité"
 IRQ_secularists_bop_left_win_range: "État laïcisé"
 IRQ_secularists_bop_left_advanced_range: "Société hautement laïque"
 IRQ_secularists_bop_left_medium_range: "Croissance du libéralisme dans la société"
 IRQ_secularists_bop_left_low_range: "Société modérément laïque"
 IRQ_clergy_bop_right_win_range: "État sous la charia"
 IRQ_clergy_bop_right_advanced_range: "Société islamique"
 IRQ_clergy_bop_right_medium_range: "Résurgence des idéaux islamiques"
 IRQ_clergy_bop_right_low_range: "Société islamique modérée"
 IRQ_promote_female_participation: "Promotion de la participation des femmes"
 IRQ_promote_female_participation_desc: "Nous encouragerons nos femmes à participer à la société et à devenir une partie vitale de la main-d’œuvre."
 IRQ_promotion_of_iraqi_identity: "Promotion de l’identité irakienne"
 IRQ_promotion_of_iraqi_identity_desc: "Our people must know who they are, and their history, culture, and language are a part of their identity that must be reinforced."
 IRQ_restoration_of_ancient_sights: "Renovation of Historical Sites"
 IRQ_restoration_of_ancient_sights_desc: "Notre passé est une composante cruciale de notre nation. Notre peuple doit réaliser la grandeur qu’il a jadis atteinte et celle qu’il doit à nouveau viser."
 IRQ_promotion_of_saddam: "Promotion des réalisations baasistes"
 IRQ_promotion_of_saddam_desc: "Dans chaque rue, maison, bureau et école, un portrait du plus grand leader de l’histoire baasiste doit être affiché. Notre peuple doit savoir qui a bâti cette nation et à qui il doit rendre grâce."
 IRQ_power_of_mosques: "Étendre le pouvoir des mosquées"
 IRQ_power_of_mosques_desc: "Les mosquées détiennent le pouvoir dans cette nation, et nous devons l’accepter. En élargissant leur influence, nous leur montrons que nous sommes de leur côté."
 IRQ_crack_down_on_haram: "Lutter contre les activités immorales"
 IRQ_crack_down_on_haram_desc: "Notre société ne doit pas être corrompue par le voile de l’impérialisme occidental. Nous devons combattre ces infiltrations dans la société irakienne par tous les moyens possibles."
 IRQ_upholding_sharia: "Maintenir la charia"
 IRQ_upholding_sharia_desc: "La loi du pays est la charia, et il est de notre devoir de la faire respecter face à ceux qui voudraient contourner les normes sociétales."
 IRQ_clergy_right_side: "Islamistes"
 IRQ_secularists_bop_left_side: "Laïcistes"
 IRQ_debaath_balance_of_power_category: "£IRQ_Nat_Autocracy_small §HDe-Baathification de [IRQ.GetFlag] Irak§!"
 IRQ_baathists_bop_right_low_range: "Cercles baasistes"
 IRQ_baathists_bop_right_medium_range: "Manifestations baasistes"
 IRQ_baathists_bop_right_advanced_range: "Résurgence baasiste"
 IRQ_baathists_bop_right_win_range: "Coup d’État baasiste"
 IRQ_antibaathists_bop_left_low_range: "Débaasification du gouvernement"
 IRQ_antibaathists_bop_left_medium_range: "Persécution des baasistes"
 IRQ_antibaathists_bop_left_advanced_range: "Débaasification de la vie quotidienne"
 IRQ_antibaathists_bop_left_win_range: "Fin du baasisme en Irak"
 IRQ_antibaathists_bop_mid_range: "Gouvernement vulnérable"
 IRQ_antibaathists_bop_left_side: "Anti-baasistes"
 IRQ_baathists_right_side: "Baasistes"
 IRQ_anti_baath_sentiment_schools: "Sentiment anti-baasiste dans les écoles"
 IRQ_anti_baath_sentiment_schools_desc: "Les Hussein ont gravement affecté le système éducatif irakien pendant leur règne, empoisonnant l’esprit des élèves avec la propagande gouvernementale. Nous devons réparer ces dommages et faire comprendre aux étudiants les véritables horreurs des baasistes."
 IRQ_anti_baath_ad_campaigns: "Campagne télévisée anti-baasiste"
 IRQ_anti_baath_ad_campaigns_desc: "The Iraqi populace spends a lot of their time on their couches, watching television either alone or with their families. We need to make sure that in between their shows, they don't forget about the atrocities committed by the Ba'athists."
 IRQ_persecute_potential_baathists: "Enquêter sur les potentiels baasistes"
 IRQ_persecute_potential_baathists_desc: "Il reste encore beaucoup de sympathisants baasistes dans la société irakienne, qui se sont glissés dans les interstices. Lancer une enquête contre ces individus sera bénéfique."
 IRQ_sunni_in_politics: "Tremblement de terre sectaire"
 IRQ_sunni_in_politics_desc: "Our government will need to manage 3 factors regarding the Sunnis in the nation, §HSatisfaction§!, §HRadicalization§!, and §HPolitical Influence§!\n\nSatisfaction will determine the Sunnis' overall happiness with the government's decision making. If Sunni §HSatisfaction§! is lower than §H30/50§!, then §HRadicalization§! will start gradually increasing. Lower §HSatisfaction§! will also exponentially increase the rate of §HRadicalization§! anytime it increases (Will begin to multiply).\n\n§HRadicalization§! will be the frequency that Iraqi Sunnis join extremist groups, as well as how politically active they will be. Anytime the §HRadicalization§! amongst the Sunnis increases, they will become more politically active and will have a higher §HPolitical Influence§!.\n\n§HPolitical Influence§! will determine the growth in Sunni-led political parties within our nation. There is also a random chance that our Sunni Generals will launch a coup if Sunni §HPolitical Influence§! and §HRadicalization§! is high.\n\nSunni Satisfaction: §H[?IRQ_sunni_satisfaction]/50§!\nSunni Radicalization: §H[?IRQ_sunni_radicalization]/75§!\nSunni Political Influence: §H[?IRQ_sunni_political_influence]/100§!"
 IRQ_satisfy_sunnis: "Satisfaire les besoins sunnites"
 IRQ_satisfy_sunnis_desc: "In order to get on the good side of our Sunnis, we are going to have to direct more resources in developing their standard of living, and giving them a greater voice in our government which is primarily led by Shi'ite individuals."
 IRQ_redirect_sunni_resources: "Rediriger les ressources sunnites"
 IRQ_redirect_sunni_resources_desc: "Les communautés sunnites ne verront sûrement pas d’inconvénient à avoir moins de ressources, surtout que notre gouvernement pourrait bien utiliser ces ressources vitales."
 IRQ_make_a_promise: "Faire une promesse"
 IRQ_make_a_promise_desc: "Face à la faible satisfaction de la population sunnite, nous pouvons faire une promesse qui nous donnera une chance de prouver que notre gouvernement est digne de remplir ses devoirs.\n§W-----------------------------------------------------------------§!\nCette décision sera à nouveau disponible après 180 jours."
 IRQ_resolve_the_crisis: "Résoudre la crise"
 IRQ_resolve_the_crisis_desc: "The time has come for us to resolve the sectarian earthquake that has rocked our nation."
 IRQ_lower_iranian_influence_1: "Réduire l’influence iranienne [PER.GetFlag]"
 IRQ_lower_iranian_influence_1_desc: "We have promised our Sunnis that we will lower Iranian influence."
 IRQ_anbar_infrastructure: "Améliorer les infrastructures à Anbar"
 IRQ_anbar_infrastructure_desc: "Nous avons promis d’améliorer les infrastructures à Anbar."
 IRQ_salahuddin_infrastructure: "Améliorer les infrastructures à Salahuddin"
 IRQ_salahuddin_infrastructure_desc: "Nous avons promis d’améliorer les infrastructures à Salahuddin."
 IRQ_nineveh_infrastructure: "Améliorer les infrastructures à Ninive"
 IRQ_nineveh_infrastructure_desc: "Nous avons promis d’améliorer les infrastructures à Ninive."
 IRQ_anbar_airbase: "Améliorer les aéroports à Anbar"
 IRQ_anbar_airbase_desc: "Nous avons promis d’améliorer les aéroports situés à Anbar."
 IRQ_salahuddin_airbase: "Améliorer les aéroports à Salahuddin"
 IRQ_salahuddin_airbase_desc: "Nous avons promis d’améliorer les aéroports situés à Salahuddin."
 IRQ_nineveh_airbase: "Améliorer les aéroports à Ninive"
 IRQ_nineveh_airbase_desc: "Nous avons promis d’améliorer les aéroports situés à Ninive."
 IRQ_economic_prosperity: "Améliorer la situation économique"
 IRQ_economic_prosperity_desc: "Nous avons promis d’améliorer la situation économique en Irak."
 IRQ_smaller_government: "Limit the Government's Reach"
 IRQ_smaller_government_desc: "Nous avons promis de garantir que le gouvernement joue un rôle moindre dans la société irakienne."
 IRQ_sunni_internet: "Améliorer l’infrastructure internet"
 IRQ_sunni_internet_desc: "We've promised to improve internet infrastructure in the Western Regions populated by Sunnis."
 IRQ_pmf_decisions: "Forces de mobilisation populaire"
 IRQ_pmf_decisions_desc: "The §HPMF§!, or §HPopular Mobilization Forces§! are a series of §HMilitias§! that have banded together to form an umbrella group for the security of the nation. We are able to §HMobilize§! these §HMilitias§! at a cost in order to prepare for a war against our enemies. Total mobilization could take years, however we are able to deploy the §HPMF§! at any time relative to the mobilization rate.\n\nWhile the §HPMF§! is deployed, we will suffer from §Rincreased troop up-keep§!, but we are able to §HDemobilize§! them in order to save our budget.\n\nIf we are at war, mobilization will progress §HDouble§! its standard rate monthly."
 IRQ_begin_mobilization: "Commencer la mobilisation"
 IRQ_begin_mobilization_desc: "En mobilisant les FMP, nous disposerons de la quantité nécessaire de forces pour faire face à toute menace dans la région."
 IRQ_stop_mobilization: "Cesser la mobilisation"
 IRQ_stop_mobilization_desc: "Maintenir la mobilisation des FMP est une tâche coûteuse, et pour éviter l’effondrement économique de notre nation, il est nécessaire d’y mettre fin."
 IRQ_deploy_the_pmf: "Déployer les FMP"
 IRQ_demobilize_the_pmf: "Démobiliser les FMP"
 IRQ_demobilize_the_pmf_desc: "Il est temps de démobiliser les FMP, leur aide n’étant plus utile à nos forces armées."
 IRQ_spring_of_islam: "Le Printemps de l’Islam"
 IRQ_spring_of_islam_desc: "In order to expand the reach of our alliance and ideology, we will need to export §HShi'ite Revolutions§! in nations with some semblance of §HShi'ite Movements§!. We will disguise the movements as Islamic in nature, but will have them spearheaded by §HShi'ite§! leaders and groups to ensure that there is no hijacking of our influence. We will expand our influence within the nations in order to influence their §HMilitaries and Governmental Bodies§! to win them over when the revolution comes. The first stage will be arming and funding the rebels, which will then allow us to give them the greenlight to start their §HRevolution§!.\n"
 IRQ_arm_rebels_in_jordan: "Armer les rebelles en Jordanie [JOR.GetFlag]"
 IRQ_arm_rebels_in_jordan_desc: "We can fund, train, and arm Shi'ites in [JOR.GetFlag] Jordan and prepare them to overthrow the [JOR.GetFlag] Jordanian government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_jordan: "Printemps islamique en Jordanie [JOR.GetFlag]"
 IRQ_islamic_spring_in_jordan_desc: "Le moment est venu, nos partenaires jordaniens [JOR.GetFlag] sont prêts à déclencher leur révolution islamique !"
 IRQ_arm_rebels_in_kuwait: "Armer les rebelles au Koweït [KUW.GetFlag]"
 IRQ_arm_rebels_in_kuwait_desc: "We can fund, train, and arm Shi'ites in [KUW.GetFlag] Kuwait and prepare them to overthrow the [KUW.GetFlag] Kuwaiti government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_kuwait: "Islamic Spring in [KUW.GetFlag] Kuwait"
 IRQ_islamic_spring_in_kuwait_desc: "Le moment est venu, nos partenaires koweïtiens [KUW.GetFlag] sont prêts à déclencher leur révolution islamique !"
 IRQ_arm_rebels_in_turkey: "Armer les rebelles en Turquie [TUR.GetFlag]"
 IRQ_arm_rebels_in_turkey_desc: "We can fund, train, and arm Shi'ites in [TUR.GetFlag] Turkey and prepare them to overthrow the [TUR.GetFlag] Turkish government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_turkey: "Printemps islamique en Turquie [TUR.GetFlag]"
 IRQ_islamic_spring_in_turkey_desc: "Le moment est venu, nos partenaires turcs [TUR.GetFlag] sont prêts à déclencher leur révolution islamique !"
 IRQ_arm_rebels_in_afghanistan: "Armer les rebelles en Afghanistan [AFG.GetFlag]"
 IRQ_arm_rebels_in_afghanistan_desc: "We can fund, train, and arm Shi'ites in [AFG.GetFlag] Afghanistan and prepare them to overthrow the [AFG.GetFlag] Afghan government in order to install an Islamic Republic."
 IRQ_islamic_spring_in_afghanistan: "Printemps islamique en Afghanistan [AFG.GetFlag]"
 IRQ_islamic_spring_in_afghanistan_desc: "Le moment est venu, nos partenaires afghans [AFG.GetFlag] sont prêts à déclencher leur révolution islamique !"
 IRQ_fao_decisions: "Le Front contre l’oppression"
 IRQ_fao_decisions_desc: "Having founded a new regional alliance, the §HFront Against Oppression§! (FAO) will contest any and all semblances of non-Islamic influence. We will be able to invite countries that are §HShi'ites§!, and we will be able to expand our network of potential FAO candidates by preparing the §HSpring of Islam§! plan."
 IRQ_ask_for_iranian_arms: "Demander des armements iraniens [PER.GetFlag]"
 IRQ_ask_for_iranian_arms_desc: "Les Iraniens [PER.GetFlag] possèdent de grands stocks d’armes qu’ils n’utiliseront probablement jamais. Nous pourrions leur demander de nous en envoyer pour notre usage."
 IRQ_ask_for_iranian_funds: "Demander un financement iranien [PER.GetFlag]"
 IRQ_ask_for_iranian_funds_desc: "Nous pouvons demander aux Iraniens [PER.GetFlag] de nous envoyer des palettes de liquidités pour financer notre développement."
 IRQ_open_invites: "Ouvrir les invitations"
 IRQ_open_invites_desc: "Nous pouvons voir qui est éligible pour rejoindre notre faction."
 IRQ_close_invites: "Fermer les invitations"
 IRQ_close_invites_desc: "Le menu est trop encombré, fermez-le."
 IRQ_invite_jordan: "Inviter la Jordanie [JOR.GetFlag] [JOR.GetName]"
 IRQ_invite_kuwait: "Inviter le Koweït [KUW.GetFlag] [KUW.GetName]"
 IRQ_invite_egypt: "Inviter l’Égypte [EGY.GetFlag] [EGY.GetName]"
 IRQ_invite_azerbaijan: "Inviter l’Azerbaïdjan [AZE.GetFlag] [AZE.GetName]"
 IRQ_invite_turkey: "Inviter la Turquie [TUR.GetFlag] [TUR.GetName]"
 IRQ_invite_arabia: "Inviter l’Arabie [SAU.GetFlag] [SAU.GetName]"
 IRQ_invite_bahrain: "Inviter Bahreïn [BHR.GetFlag] [BHR.GetName]"
 IRQ_invite_yemen: "Inviter le Yémen [YEM.GetFlag] [YEM.GetName]"
 IRQ_if_we_accept_TT: "§HEffet si nous acceptons :§!"
 IRQ_meets_requirements_TT: "La §HSatisfaction sunnite§! est à §H40§! ou plus\nL’§HInfluence sunnite§! est inférieure à §H35§!\nLa §HRadicalisation sunnite§! est inférieure à §H25§!"
 IRQ_play_junta_TT: "Jouera en tant que §OJunte militaire§!"
 IRQ_play_shia_revolutionary_TT: "Jouera en tant que §YRévolutionnaires chiites§!"
