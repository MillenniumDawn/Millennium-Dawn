 DIVISION_MODIFICATION_NEED_NOT_FILLED_GARRISON: "\t- $AMOUNT|H0$ additional $EQUIPMENT|H$ needed to fill brigades and garrisons ( §R$STOCK_AMOUNT|H0^$ available§! )"
 DIVISION_MODIFICATION_NEED_FILLED_GARRISON: "\t- $AMOUNT|H0$ additional $EQUIPMENT|H$ needed to fill brigades and garrisons ( $STOCK_AMOUNT|H0^$ available )"
