 TAJ_badakhshani_unrest: "[BDA.GetFlag]バダフシャンの断層線"
 TAJ_badakhshani_unrest_desc: "\n£TAJ_desctext_BDA\n\n\n\n[BDA.GetFlag]§Hゴルノ・バダフシャン§!の人々は、\n[TAJ.GetFlag]§Hタジキスタン§!の他の地域とは異なる発展を遂げ、独自の明確なアイデンティティを保持してきた。これは、治安部隊と抗議者の間の衝突が珍しくないため、地域における我が政府にとっていくつかの行政上の問題を引き起こしている。活発な武装反乱のリスクはないものの、地域は我々の武器備蓄と人的資源を消費し続けるだろう。\n\n現在の[BDA.GetFlag]§Hバダフシャン§!の不安：[?TAJ_badakhshan_unrest_var]%"
 TAJ_subsidies_in_badakhshan: "[BDA.GetFlag]ゴルノ・バダフシャンで補助金を発行"
 TAJ_subsidies_in_badakhshan_desc: "We can issue subsidies on essentials like food, medicine and healthcare in order to improve our government's image in the region."
 TAJ_monopolize_state_industries: "バダフシャン産業の独占"
 TAJ_monopolize_state_industries_desc: "地域への中国の投資は、産業が我が政府による独占に適した状態にしている。"
 TAJ_visit_the_regional_governor: "地域知事を訪問"
 TAJ_visit_the_regional_governor_desc: "地域知事を訪問することで、彼らの自治権と地方政府に対する連邦政府の支援を再確認することができる。"
 TAJ_sack_regional_governor: "地域知事を解任"
 TAJ_sack_regional_governor_desc: "パミール人の知事を置くことは、地域に対する十分な統制を維持するのに役立たない。代わりに、知事をタジク人に置き換えることに焦点を当てるべきだ。"
 TAJ_dig_for_badakhshani_resources: "バダフシャン資源の採掘"
 TAJ_dig_for_badakhshani_resources_desc: "The region has many precious gems and jewels that are just waiting to be mined up. And aside from a few angry locals, what's stopping us from digging them up?"
 TAJ_conscript_badakhshani_troops: "バダフシャン部隊の徴兵"
 TAJ_conscript_badakhshani_troops_desc: "Badakhshanis are no different to the other [TAJ.GetFlag] Tajiks residing in the nation, and we must treat everyone the same. All must serve in the nation's military, it is their national duty after all."
 TAJ_permit_religious_freedoms: "宗教の自由を許可"
 TAJ_permit_religious_freedoms_desc: "[TAJ.GetFlag]タジキスタンのほとんどがスンニ派イスラム教を実践しているにもかかわらず、バダフシャン人は国家の他の地域とは異なるシーア派の一派に従っている。"
 TAJ_badakhshani_representation: "バダフシャン代表権の改善"
 TAJ_badakhshani_representation_desc: "Perhaps the Badakhshani people are a little under-represented in state matters, and could use a bit more recognition in the central government."
 TAJ_permit_pamiri_language: "パミール語を許可"
 TAJ_permit_pamiri_language_desc: "パミール語を許可することで、我々は国家からの報復の恐れなしにバダフシャン人にアイデンティティの感覚を与えることができる。"
 TAJ_restrict_troop_movement: "部隊移動の制限"
 TAJ_restrict_troop_movement_desc: "バダフシャンでの部隊移動を制限することで、我々は地元住民に危害を加える意図がないことを示すことができる。"
 TAJ_infrastructure_of_badakhshan: "バダフシャンのインフラ"
 TAJ_infrastructure_of_badakhshan_desc: "バダフシャン人はより良い道路、家、そして生活の質を求めてきた。彼らにそれを提供することで、我々は和解に向けて一歩前進することができる。"
 TAJ_form_badakhshani_armed_forces: "バダフシャン防衛軍の編成"
 TAJ_form_badakhshani_armed_forces_desc: "バダフシャンの人々は自衛する権利を持っており、我々は常に彼らにそのような支援を提供する資源を持っているわけではないだろう。"
 TAJ_khorugh_accord: "ホルグ合意"
 TAJ_khorugh_accord_desc: "The time has come to meet with Badakhshani representatives and agree on the terms of the Khorugh accord. This is a major step towards decentralizing our control over the Badakhshan region."
 TAJ_settle_the_unrest: "不安の鎮静"
 TAJ_settle_the_unrest_desc: "我が国の独立以来ゴルノ・バダフシャン地域を悩ませてきた不安を鎮める時が来た。"
 TAJ_badakhshan_area: "バダフシャンの不安"
 TAJ_situation_in_pamirs: "パミールの状況"
 TAJ_situation_in_pamirs_desc: "\n£TAJ_desctext_pamir\n\n\n\n§Hパミール§!国境の形成中のソビエト最高司令部の選択が悪かった結果、多くの飛び地が作られ、その結果、町は本土の国から切り離された。交渉と妥協の欠如は、[KYR.GetFlag][KYR.GetName]、[TAJ.GetFlag]タジキスタン、そして[UZB.GetFlag]ウズベキスタンの間で時折暴力が発生する原因となった。§Hパミール§!州を攻撃して占領するためには、まず兵站上の必要性を満たし、それから攻撃しなければならない。もし我々が州を占領し、継続的に§H9ヶ月§!保持することができれば、その州は§H永久に§!我々のものとなるだろう。"
 TAJ_attack_batken: "バトケンへの攻撃開始"
 TAJ_attack_batken_desc: "バトケンを攻撃することで、陸路の回廊を作り、北部パミールへの容易なアクセスを可能にするだろう。"
 TAJ_batken_occupation: "バトケンの占領"
 TAJ_batken_occupation_desc: "地元住民が最終的に彼らの領土に対するタジクの支配を受け入れる前に、我々はバトケンを約270日間保持しなければならない。"
 TAJ_attack_pamir: "パミールへの攻撃開始"
 TAJ_attack_pamir_desc: "パミールを攻撃することで、陸路の回廊を作り、南部パミールとバトケンへの容易なアクセスを可能にするだろう。"
 TAJ_pamir_occupation_desc: "地元住民が最終的に彼らの領土に対するタジクの支配を受け入れる前に、我々はパミールを約270日間保持しなければならない。"
