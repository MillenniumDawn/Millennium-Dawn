 expand_local_fortification_efforts_tt: "§YÉtendre les efforts de fortification locaux§! dans §Y[THIS.GetName]§!\n---------\nLes capacités défensives de §Y[THIS.GetName]§! doivent être renforcées. Nous devrions envisager d'étendre les fortifications et structures défensives locales pour mieux protéger cette région stratégiquement importante."
