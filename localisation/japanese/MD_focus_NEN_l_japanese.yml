l_japanese:
 New_England_focus: "ニューイングランド 国家方針ツリー"
 NEN_new_nation_new_problems: "新たな国家、新たな問題"
 NEN_new_nation_new_problems_desc: "混乱が収まりつつある今、ようやく我々の「本拠地」、すなわち国の首都をどこに設置するかを考え始めることができる。"
 NEN_focus_maine_mayhem: "メイン メイヘム"
 NEN_focus_maine_mayhem_desc: "メイン州は土地面積で最大の州であると同時に、森林や山地に人々が隠れようとするため、統制が最も難しい州でもある。したがって、基本的な経済構造を構築することで、彼らを引き出さなければならない。食料は生存と生活のための権利であり、メイン州はこうした基本的な経済構造の出発点として適している。"
 NEN_focus_greenville_gallantries: "グリーンビル ギャラントリーズ"
 NEN_focus_greenville_gallantries_desc: "人々が協力し始め、社会的一体感が平和な形で形成されつつある今こそ、行政および市民サービスを実施し始める時である。メイン州はやがて、この若き国家において驚異的な存在になるだろう。"
 NEN_focus_hampshire_havoc: "ニューハンプシャーの大混乱"
 NEN_focus_hampshire_havoc_desc: "ニューハンプシャー州は新しい国家のほぼ中央に位置しており、国全体の秩序回復において戦略的に重要な州である。したがって、「再統合」に向けて州を準備するためにインフラと経済活動を確立する必要がある。"
 NEN_focus_concord_concrete: "コンコード・コンクリート"
 NEN_focus_concord_concrete_desc: "経済的および社会的一体感は許容レベルに達し、生活の改善と、法と秩序の回復に向けた行政及び緊急サービスの実装を開始できる段階に至った。こうした中で、主要な経済力となっているのは建設会社のコンコード・コンクリートであり、彼らは文字通り若い国家の未来の礎を築いてきた。"
 NEN_focus_messychusetts: "混乱のマサチューセッツ"
 NEN_focus_messychusetts_desc: "マサチューセッツ州は旧共和国の崩壊以来、完全な混乱状態に陥った。これは若き国家にとって壊滅的な打撃である。国内の多くの人々がボストンを、ニューイングランド人であることの意味を広く象徴する文化的首都と捉えているからである。したがって、我々はこの文化を再び脚光を浴びる道へと導くために、できる限りの浄化と再建をするだろう。"
 NEN_focus_boston_beauty: "ボストンの美しさ"
 NEN_focus_boston_beauty_desc: "たゆまぬ汗と努力によって、たゆまぬ努力と汗によって、我々はかつて美しく輝いたこの都市と土地の栄光を今、取り戻しつつある。この復興を礎に、新たに得た栄光と情熱を確固たるものとし、公共及び行政サービスを実施することで、我が偉大なる国家のもう一つの地域の秩序と平和を完全に回復させるのである。"
 NEN_focus_vermont_violence: "バーモントの暴力"
 NEN_focus_vermont_violence_desc: "「三角形の双子」のもう一方であるバーモント州は、ニューヨークとの境界にあり、その発展にもかかわらずかなり孤立した州だ。この孤立によって、街は蔓延する暴力に飲み込まれてしまっている。我々の仕事はバーモントの平和と安定を回復させ、北東部の家族に再び迎え入れることである。まずはマサチューセッツ州やニューハンプシャー州との州境に沿った限定的な経済投資および基礎インフラ整備から始め、そこから展開していく。"
 NEN_focus_virtuous_vermont: "高潔なバーモント"
 NEN_focus_virtuous_vermont_desc: "時間はかかったが、地元住民の懸命な努力と称賛に値する献身により、我々はかつて不安定だったこの地に平和と美徳を取り戻し始めた。今、我々は政府行政と法執行機関を設立し、州の再統合の基盤をより良く組織化し整備することができる。"
 NEN_focus_connecticut_crutch: "コネチカットの松葉杖"
 NEN_focus_connecticut_crutch_desc: "2番目に小さい州でありながら、海岸線の約3分の1を占めるコネチカット州は、その存在自体が一種の賭けと言える。非常に多くの海岸線と作業する内陸地が少ない中で、その経済的多様性を維持することは困難であるからだ。したがって、州とその住民が他の州と同程度の機会を持てるよう、経済面における多様性の基準を確立することが我々の責務である。"
 NEN_focus_middletown_miracle: "ミドルタウンの奇跡"
 NEN_focus_middletown_miracle_desc: "農業および食品加工産業への若干の投資により、我々は単なる「重工業または海運」ではない基準を設定することができた。今、我々は行政サービスを実施し、州に秩序と平和を再確立し始め、それをニューイングランドのパズルのもう一つのピースにすることができる。"
 NEN_focus_rhode_island_riots: "ロードアイランドでの暴動"
 NEN_focus_rhode_island_riots_desc: "ロードアイランド州は我が国で最も小さな州であるにもかかわらず、暴徒に乗っ取られている。このような不安定な状況下では、暴徒の侵入を阻止するため、基本的に国境沿いの拠点のみを設置する必要がある。そこから、法執行機関を徐々に導入することで、この「組織化された混沌」を徐々に解体していくことが可能となるだろう。"
 NEN_focus_providence_parties: "プロビデンスのパーティー"
 NEN_focus_providence_parties_desc: "時間はかかったが、ついにやり遂げた。暴徒の規模はかなり縮小し、州民の間で社会的一体感が優先事項となり始めた。この安定化の潮流がますます強まる中、今こそ地方の法執行機関、消防、政府行政のような公共サービスを導入し、この流れを最大限に活用すべき時である。やがて我々は再び一つになるだろう。"
 NEN_focus_new_new_england: "新たなニューイングランド"
 NEN_focus_new_new_england_desc: "長く危険な旅路であったが、献身、決意、そして偉大なる国民の意志をもって、我々は勝利した。我々の国家は統一され、この統一をもって創造すべき道を切り開く。未来は今であり、未来は我々のものとなる。"
 NEN_Augusta_capital: "§Yオーガスタ§!を首都にした"
 NEN_Concord_capital: "§Yコンコード§!を首都にした"
 NEN_Boston_capital: "§Yボストン§!を首都にした"
 NEN_end_of_teaser: "ティーザーツリーの公式な終了。あなたは今やこの土地の支配者だ。だから今のところは好きなようにしても構わない……"
 NEN_decisions_war_time_mobilization_category: "戦時動員"
 NEN_decisions_war_time_mobilization_category_desc: "必要が生じたとき、我々は少なくとも戦線の隙間を埋めるために義勇軍を召集することができる。戦争がいつ来るかは分からないが、我々の上に降りかかることは確実だからだ。"
 NEN_war_time_mobilization: "第一次動員"
 NEN_war_time_mobilization_desc: "戦いの時が迫っている。我々は故郷を守るため、一丸となって立ち上がらなければならない。ディキシーの若者たちよ、武器を手に取れ！"
 NEN_war_second_wave_defenders: "第二次防衛隊"
 NEN_war_second_wave_defenders_desc: "敵が攻勢を強めているため、我々は新たな防衛部隊を動員しなければならない。国民の士気は低下するだろうが、兵力は必要だ。"
 NEN_war_desperate_defenders: "絶望的防衛隊"
 NEN_war_desperate_defenders_desc: "事態は深刻化している。戦線を維持するためには、能力の有無にかかわらず、動ける人間は全員必要だ。もしかしたら、もしかしたらだが、まだこの戦いに勝てるかもしれない。"
 NEN_event.1.t: "政府の所在地"
 NEN_event.1.d: "旧共和国から新たな国家が誕生した今、我々は国の首都をどこに置くかを検討しなければならない。多くの人々は、日々の生活を営み、国家の安定に向けて取り組めるよう、物事をシンプルにしたいと願っているため、どの州都を首都とするかについて激しい議論が繰り広げられている。現時点での候補地は、メイン州、ニューハンプシャー州、マサチューセッツ州のようだ。いずれの州が選ばれようとも、これらは互いに比較的近い位置にあるため、どの選択も妥当なものとなるだろう。"
 NEN_event.1.o1: "もうさっさと始めよう"
 NEN_event.2.t: "首都の選択"
 NEN_event.2.d: "前述の通り、オーガスタ、コンコード、ボストンをめぐる議論は依然として激しさを増している。多くの人は、ボストンがすでにニューイングランドのアイデンティティを象徴する非公式な拠点であると信じているが、一方で、ボストンは文化の中心地として残すべきであり、実際の州都としてはふさわしくないとする意見もある。"
 NEN_event.2.o1: "メイン州のオーガスタ"
 NEN_event.2.o2: "ニューハンプシャー州のコンコード"
 NEN_event.2.o3: "マサチューセッツ州のボストン"
 NEN_letting_loose_the_dogs: "犬を放つ"
 NEN_letting_loose_the_dogs_desc: "我が国民はまるでブルドッグのようだ。呼びかけに応えて団結し、敵がどこにいようとも戦う。"
 NEN_creating_infantry_reserves: "予備役の創設"
 NEN_creating_infantry_reserves_desc: "大陸の至る所で不穏な動きが見られ、我々はそれらに警戒しなければならない。間違いなくトラブルが襲ってくるだろうから、それに正面から立ち向かう準備を整えなければならない。最悪の事態に備えるため、即応可能な予備部隊を編成しよう。"
 NEN_mobilizing_the_reserves: "予備役の動員"
 NEN_mobilizing_the_reserves_desc: "我々の安全と自立を守るため、今こそ行動を起こし、予備役を動員しなければならない。我らのより平和な明日への希望に、神が彼の疲れ果てた魂を安らかに導いてくださいますように。"
 NEN_event.3.t: "バーモント州での運動"
 NEN_event.3.d: "首都移転をめぐる議論が続く中、バーモント州は議論の場に参加していなかったため、同州の多くの人々が多少の疎外感を抱いている。バーモント州出身者の中には、連帯を示すために州に戻ってくる人もいる。こうしたデモの真の目的が何なのかは定かではないが、せいぜい些細な口論に過ぎないと言えるだろう。この運動の中には、火に油を注ぎ、すでに生じている混乱を長引かせようとする過激派も一部存在している。"
 NEN_event.3.o1: "どうか仲良くしてくれないか？"
 NEN_event.4.t: "バーモント州での抗議活動が続く"
 NEN_event.4.d: "国をほぼ正常な状態に戻したにもかかわらず、不満を抱くバーモント州民の中には、驚くほど多くの声高な人物が、かつての州民たちを結束させようとしている。新国家政府への挑戦を目的とした動きとして、知事や有力な政治指導者たちの熱心な呼びかけに応じ、数千人の元バーモント州民が州へ戻りつつある。その指導者の一人であるハワード・ブラッシュ・ディーン3世は、州へ戻ってきた「家族」の雇用支援に取り組んでいる。一見すると善意の表れのように見えるが、新国家政府に対する積極的な妨害活動は、国民の団結を大きく阻害し、バーモント州の過激派をさらに勢いづかせている。"
 NEN_event.4.o1: "よし、ちょっと落ち着こうじゃないか"
 NEN_event.5.t: "バーモント州民の要求"
 NEN_event.5.d: "本日早朝、我々は次のような、かなり衝撃的な手紙を受け取った。「この緊張と葛藤に満ちた時代において、我々という文化、すなわちニューイングランドの文化は団結すべきであることを改めて思い知らされます。しかし、我々が共有する文化を形作る重要な州の一つを排除することで、現在の連邦政府はそのような団結を示せていないのです。さて、なぜコネチカット州やロードアイランド州のような州は立ち上がらないのか、と疑問に思うかもしれません。その答えは単純です。彼らは立ち上がらないからです。彼らが置かれているこの荒廃した状況を政府が立て直してくれる限り、連邦政府が何を言おうと気にしないのです。しかし、もうそんなことは許されません。私たちバーモント州民は、首都をめぐる議論から締め出されてきました。人数は多くありませんが、私たちは団結し、共同体の繁栄を誇りに思っています。地元の指導者たちや故郷に戻ってきた人々の政策のおかげで、私たちの経済はすでに追い上げを始めています。そこで今、私たちは、現在の連邦政府の所在地をバーモント州の州都モンペリエに移すことを要求します。さもなければ、このいわゆる「新国家」の一地域全体を排除することになる結果を覚悟してください。」"
 NEN_event.5.o1: "いい...だろう？"
 NEN_event.5.o2: "首都がどこにあるか、実際気にする人なんているのか？"
 NEN_event.6.t: "緊張が急激に高まる"
 NEN_event.6.d: "事態が雪だるま式に拡大し始めたため、双方は戦力を整え、最悪の事態に備え始めている。いつ火がつけられるかは神のみぞ知るが、確かなのは、我々がまだ暗闇から抜け出せていないということだ。"
 NEN_event.6.o1: "この苦しみはいつになったら終わるのだろうか？"
 NEN_event.7.t: "グリーン・マウンテン反乱軍"
 NEN_event.7.d: "バーモント州全域で巻き起こっている動揺が広まっており、噂によると彼らは自らを「グリーン・マウンテンの反乱」と名乗っているそうだ。これは明らかに、彼らが「民心掌握」などという戯言を振りかざそうとしているに過ぎず、我々はそんな手口には乗らない。"
 NEN_event.7.o1: "その山をほんの小さな丘に変えてみせる"
 NEN_event.8.t: "国家動員"
 NEN_event.8.d: "我々は自由の瀬戸際に立っているが、いわゆる「ニューイングランド政府」が我々に対して動員を開始するにつれ、抑圧の影が迫っている。我々は国家と国民、そしてわずかな産業を総動員し、断固として立ち向かわなければならない。そうすれば、我々は再び自由を取り戻すことができるのだ。"
 NEN_event.8.o1: "持ちこたえろ！"
 NEN_event.9.t: "グリーンマウンテンの反乱"
 NEN_event.9.d: "さて、時が来た。もはや話し合いでは解決できず、武器を取るしかなくなったのだ。この馬鹿げた事態にきっぱりと決着をつけよう。"
 NEN_event.9.o1: "モンテプリエへ進軍だ！"