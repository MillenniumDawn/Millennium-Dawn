 ADO.conservatism: "£generic_conservatism_small (PD) - 民主党"
 ADO.conservatism_desc: "（基督教民主主义）- 民主党\n\n民主党是安道尔民族民主联盟的基督教民主党派别。该联盟由奥斯卡·里瓦斯·雷格领导，在1993年安道尔首次政党选举中获胜。在2001年大选前夕，该联盟分裂，民主党获得了约五分之一的选票和五个席位。此后，民主党再未参加过选举：其候选人逐渐转向安道尔民主中心和世纪21联盟，后来又转向民主复兴党。不过，在执政的自由党之外，民主党曾是主要的保守派替代选择。"
