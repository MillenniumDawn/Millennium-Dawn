 UKR_develop_btr3rk: "§YBTR-3RK§! 대전차 파생형 개발"
 UKR_develop_btr3rk_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3rk_for_tooltip\n\n\n\n\n\n\n\n\n\n§WBTR-3RK는 BTR-3 계열에 차량 탑재 중형 대전차 유도 미사일 체계를 장착하여, 기계화 부대에 자체 편성의 장거리 대기갑 능력을 부여합니다.\n새로운 차체가 아니라, 우리가 보유한 기존 중형 대전차 유도 미사일 체계를 BTR-3에 맞게 재포장한 것이며 전자 장비와 탄두는 우리 대전차 부대가 이미 사용하는 것과 동일하게 유지합니다.§!"
 UKR_develop_btr3rk_flag: "완료된 결정: §YBTR-3RK 개발§!"
