 formable_buy.1.t: "[?formable_offer_buyer_id.GetNameDef]의 영토 제안"
 formable_buy.1.d: "[?formable_offer_buyer_id.GetNameDef] has formally offered our government §H£treasury 100 billion§! for [?formable_offer_state_id.GetName], a state they claim as a historical core.\n\nOur cabinet must decide: accept the payment and surrender the land, or reject the offer and keep our territory intact."
 formable_buy.1.a: "거절할 수 없는 제안이군."
 formable_buy.1.b: "우리의 땅은 판매 대상이 아니다."
 formable_buy.2.t: "[?formable_offer_holder_id.GetNameDef]의 제안 수락"
 formable_buy.2.d: "[?formable_offer_holder_id.GetNameDef] 측이 [?formable_offer_state_id.GetName]의 행정권을 우리에게 양도하는 데 서명했습니다. 자금은 무사히 이체되었으며, 이제 해당 영토는 우리의 것입니다."
 formable_buy.2.a: "가치 있는 투자였다."
 formable_buy.3.t: "[?formable_offer_holder_id.GetNameDef]의 제안 거절"
 formable_buy.3.d: "[?formable_offer_holder_id.GetNameDef] 측이 [?formable_offer_state_id.GetName]에 대한 우리의 매입 제안을 거절했습니다. 자금은 국고로 반환되었으며, 해당 주는 여전히 그들의 통제하에 남습니다."
 formable_buy.3.a: "다른 방안을 고려해 보겠다."
