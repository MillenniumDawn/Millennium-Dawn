 floating_harbor_equipment: "Sistema de calzada modular"
 floating_harbor_equipment_desc: "Secciones de pontones prefabricados remolcadas hasta su posición y ancladas frente a una costa sin desarrollar, lo que permite a una fuerza de desembarco descargar suministros donde no existe un puerto funcional. Queda expuesto a ataques aéreos y navales, y se desmantela en cuestión de semanas."
 floating_harbor_equipment_1: "Sistema de calzada modular"
 floating_harbor_equipment_1_desc: "Secciones de pontones prefabricados remolcadas hasta su posición y ancladas frente a una costa sin desarrollar, lo que permite a una fuerza de desembarco descargar suministros donde no existe un puerto funcional. Queda expuesto a ataques aéreos y navales, y se desmantela en cuestión de semanas."
 module_light_surface_fut_reactor_power: "Reactor ligero de vanguardia"
 module_light_surface_fut_reactor_power_desc: "Los reactores ligeros de próxima generación mejoran la densidad de potencia y la autonomía, otorgando a los buques de combate de superficie pequeños una mayor velocidad y un alcance operativo global.\n\n§GConsejo de diseño: Este motor proporciona alta velocidad y alcance sin coste de combustible, pero es extremadamente costoso de producir. Recomendado para naciones que necesitan buques ligeros capaces de proyectar poder a nivel global.§!"
 module_light_surface_fut_reactor_power2: "Reactor ligero hiperavanzado"
 module_light_surface_fut_reactor_power2_desc: "$module_light_surface_fut_reactor_power_desc$"
 UKR_module_light_helipad_1: "Ka-25/Ka-27"
 UKR_module_helipads_1: "Ka-25"
 UKR_module_helipads_2: "Ka-27"
 UKR_module_chain_gun: "2M-3M"
 UKR_module_chain_gun_desc: "El 2M-3 es un montaje de artillería naval soviético automático de 25 mm y doble cañón. Es un medio de autodefensa para los buques y puede utilizarse para batir objetivos a un alcance inclinado de hasta 3000 m."
 UKR_module_ciws_1: "AK-230"
 UKR_module_ciws_1_desc: "El AK-230 es un cañón naval soviético doble de 30 mm totalmente automático. Su función principal es la defensa antiaérea. Está montado en una torreta automática cerrada y dirigido por radar."
 UKR_module_ciws_2: "AK-630"
 UKR_module_ciws_2_desc: "El AK-630 es un sistema de armas de defensa próxima (CIWS) naval soviético y ruso, totalmente automático y con cañón rotativo. La designación '630' se refiere a los seis cañones del arma y a su calibre de 30 mm."
 UKR_module_ciws_3: "35 mm Oerlikon Millennium"
 UKR_module_ciws_3_desc: "El cañón Rheinmetall Oerlikon Millennium o Rheinmetall GDM-008 es un sistema de armas de defensa próxima diseñado por Rheinmetall Air Defence AG (anteriormente conocida como Oerlikon Contraves) para su instalación en buques. Se basa en el sistema de defensa aérea terrestre de cañón revólver 35/1000 y utiliza munición avanzada de alta eficiencia de impacto y destrucción (AHEAD)."
 UKR_module_naval_ammo_air_defense_2: "S-300F Fort"
 UKR_module_naval_ammo_air_defense_2_desc: "The S-300F Fort is a Soviet SAM system, that was introduced in 1984. It is a sea-based anti-aircraft missile system with a vertical launch system designed to destroy high-speed, maneuverable and small-sized targets in the entire range of heights from ultra-low to large."
 UKR_module_naval_ammo_air_defense_4: "Dnipro"
 UKR_module_naval_ammo_air_defense_4_desc: "El Dnipro es un proyecto ucraniano de sistema de misiles antiaéreos de medio alcance (SAMS) desarrollado por un conjunto de empresas del complejo industrial de defensa de Ucrania. Estaba previsto para ser montado en las corbetas de la clase 'Volodymyr Velykyi'."
 UKR_module_ram_3: "3M87 Kortik"
 UKR_module_ram_3_desc: "El CIWS 3M87 Kortik es un moderno sistema combinado de cañones y misiles de defensa aérea naval desplegado por la Armada rusa. Su versión de exportación se conoce como 'Kashtan'."
 UKR_module_naval_ammo_anti_ship_1: "P-15 Termit"
 UKR_module_naval_ammo_anti_ship_1_desc: "El P-15 Termit es un misil antibuque desarrollado por la oficina de diseño Raduga de la Unión Soviética en la década de 1950. La variante P-15M es más pesada y larga que el P-15 original, disponía de un alcance de 80 km (50 millas) y varias mejoras menores."
 UKR_module_naval_ammo_anti_ship_2: "P-270 Moskit"
 UKR_module_naval_ammo_anti_ship_2_desc: "El P-270 Moskit es un misil de crucero antibuque soviético propulsado por un estatorreactor supersónico. Su designación GRAU es 3M80, y la variante de lanzamiento aéreo es el Kh-41. El sistema de misiles fue diseñado por la Oficina de Diseño Raduga durante la década de 1970 como continuación del P-120 'Malakhit' y como reemplazo del P-15 Termit."
 UKR_module_naval_ammo_anti_ship_3: "P-500 Bazalt"
 UKR_module_naval_ammo_anti_ship_3_desc: "El P-500 Bazalt es un misil de crucero supersónico propulsado por turborreactor utilizado por las armadas soviética y rusa. En los cruceros de la clase Slava se utiliza una versión del P-500 Bazalt con guía y motores mejorados. Los dieciséis tubos de lanzamiento que flanquean la superestructura son una característica inconfundible de esta clase de cruceros."
 UKR_module_naval_ammo_anti_ship_4: "R-360 Neptun"
 UKR_module_naval_ammo_anti_ship_4_desc: "El R-360 Neptune es un misil de crucero subsónico ucraniano con capacidades para todo tipo de clima desarrollado por la Oficina de Diseño Luch en Kiev. Con un alcance de más de 200 kilómetros, está destinado a neutralizar objetivos navales de hasta 9000 toneladas."
 UKR_module_naval_ammo_anti_ship_5: "Korshun-2"
 UKR_module_naval_ammo_anti_ship_5_desc: "Korshun-2 es un prometedor proyecto ucraniano de misil de de de crucero subsónico. El misil puede colocarse tanto en un chasis terrestre móvil o en un buque, como en un pilón bajo un avión. La Oficina de Diseño 'Pivdenne' lo presentó por primera vez en la exposición militar internacional 'Weapons and Security-2014'."
 UKR_module_naval_ammo_anti_ship_6: "Korshun-2M"
 UKR_module_naval_ammo_anti_ship_6_desc: "Korshun-2M es un proyecto de modernización planificado para el misil de de de de crucero Korshun-2, preparado por la Oficina de Diseño Pivdenne."
 UKR_naval_ammo_asw_1: "RPK-1 Vikhr"
 UKR_naval_ammo_asw_1_desc: "The RPK-1 Vikhr (NATO reporting name SUW-N-1) was a Soviet nuclear anti submarine missile system. FRAS-1 was the NATO code for the missile round itself. The development of the missile was ordered in 1960 in order to combat the new American nuclear submarines."
 UKR_naval_ammo_asw_2: "URK-5 Rastrub-B"
 UKR_naval_ammo_asw_2_desc: "El URK-5 Rastrub-B es un sistema de misiles antisubmarinos soviético embarcado. El complejo es una modernización del complejo URPK-3 'Metel'. Se utiliza para destruir submarinos, así como buques de combate de superficie y embarcaciones de un enemigo potencial."
 UKR_module_torpedoes_1: "SET-40"
 UKR_module_torpedoes_1_desc: "El SET-40 es un tipo de torpedo acústico soviético de autodirección eléctrico y tamaño reducido para la destrucción de submarinos de bajo ruido. El torpedo fue desarrollado en la década de 1960 y estuvo en servicio en buques de superficie, submarinos y la aviación naval de la URSS y de los países del Pacto de Varsovia."
 UKR_module_torpedoes_2: "SET-65"
 UKR_module_torpedoes_2_desc: "El SET-65 es un torpedo eléctrico antisubmarino soviético de calibre 533 mm con autodirección, diseñado para destruir submarinos. Fue desarrollado por el Instituto de Investigación Gidropribor bajo la dirección de V. A. Golubkov e ingresó en servicio en 1965."
 UKR_module_torpedoes_3: "MU90 Impact"
 UKR_module_torpedoes_3_desc: "El MU90 Impact es un avanzado torpedo antisubmarino ligero franco-italiano de tercera generación desarrollado para las armadas francesa e italiana, así como para la exportación."
 UKR_module_anti_ship_torpedoes_1: "53-57"
 UKR_module_anti_ship_torpedoes_1_desc: "El 53-57 es un torpedo soviético directo, de largo alcance y sin estela para la destrucción de buques de superficie y embarcaciones, así como para la destrucción de estructuras costeras situadas en la línea de agua."
 UKR_module_anti_ship_torpedoes_2: "53-65K"
 UKR_module_anti_ship_torpedoes_2_desc: "La familia de torpedos 53-65 son torpedos de fabricación rusa guiados por estela diseñados para destruir buques de superficie. El 53-65 entró en servicio operativo en 1965, mientras que el 53-65K y el 53-65M entraron en servicio operativo en 1969."
 UKR_module_aa_missiles_1: "MTU-4 Igla-1"
 UKR_module_aa_missiles_1_desc: "El sistema de misiles de defensa aérea se encuentra en la popa y consiste en una instalación de pedestal naval estabilizada con cuatro guías para misiles antiaéreos 9K310 'Igla-1'."
 UKR_module_aa_missiles_2: "M-4 Osa-M"
 UKR_module_aa_missiles_2_desc: "El M-4 Osa-M es un sistema de misiles antiaéreos automatizado militar ruso embarcado de doble brazo, versión naval del sistema de defensa aérea Osa."
 UKR_module_aa_missiles_4: "Koral"
 UKR_module_aa_missiles_4_desc: "Koral es un proyecto ucraniano para crear un misil guiado antiaéreo para sistemas de medio alcance. Desarrollado por la Oficina de Diseño 'Luch' desde 2016. El producto debería convertirse en un misil unificado básico de diseño modular para sistemas de misiles antiaéreos navales y terrestres, así como para las fuerzas aéreas."
 UKR_module_esm_1: "Vympel-R2 con\nPK-16 / PK-10"
 UKR_module_esm_1_desc: "El radar de guerra electrónica Vympel-R2 está diseñado para detectar la radiación de los radares operativos de buques y aviones, así como de las cabezas de guiado de los misiles, y crear interferencias activas para ellos.\nLos PK-16/PK-10 son sistemas soviéticos de interferencia electrónica a bordo de buques para establecer interferencias pasivas (reflectores dipolo y falsos objetivos térmicos)."
 UKR_module_esm_2: "MP-401S Start-S\ncon PK-10 / PK-2"
 UKR_module_esm_2_desc: "El complejo de adquisición de objetivos e interferencias MP-401S 'Start-S' está diseñado para suprimir los radares de detección y control de armas, así como los radares de los misiles antibuque.\nLos PK-2/PK-10 son sistemas soviéticos de interferencia electrónica a bordo de buques para establecer interferencias pasivas (reflectores dipolo y falsos objetivos térmicos)."
 UKR_module_esm_3: "TK-25E\ncon PK-10 / PK-2"
 UKR_module_esm_3_desc: "El TK-25E está diseñado para interceptar la radiación de las estaciones de radar de detección y control de armas de aviones y buques, así como de las cabezas de guiado por radar de los misiles antibuque, analizar automáticamente la radiación, determinar las direcciones más peligrosas del ataque a un buque y crear interferencias en las direcciones de peligro.\nLos PK-2/PK-10 son sistemas soviéticos de interferencia electrónica a bordo de buques para establecer interferencias pasivas (reflectores dipolo y falsos objetivos térmicos)."
 UKR_module_76mm_battery: "2x2 57mm AK-725"
 UKR_module_76mm_battery_desc: "El AK-725 es un montaje de artillería naval doble universal soviético de calibre 57 mm. Se trata de un sistema de artillería automático de la segunda generación de posguerra."
 UKR_module_100mm_battery: "2x2 76mm AK-726"
 UKR_module_100mm_battery_desc: "El AK-726 es un cañón naval doble de 76 milímetros (3 pulgadas), desarrollado en la Unión Soviética y que todavía se encuentra en servicio en varias armadas."
 UKR_module_127mm_battery: "2x1 100mm AK-100"
 UKR_module_127mm_battery_desc: "El AK-100 es un cañón naval soviético de 100 mm con una cadencia máxima de tiro de 60 disparos por minuto, capaz de disparar munición de 26.8 kg en variantes antiaéreas HE o de fragmentación HE."
 UKR_module_76mm_gun_1: "57mm AK-725"
 UKR_module_76mm_gun_1_desc: "El AK-725 es un montaje de artillería naval doble universal soviético de calibre 57 mm. Se trata de un sistema de artillería automático de la segunda generación de posguerra."
 UKR_module_76mm_gun_2: "76mm AK-176"
 UKR_module_76mm_gun_2_desc: "El AK-176 es un cañón naval soviético de 76 mm montado en una torreta cerrada, que puede utilizarse contra objetivos marítimos, costeros y aéreos, incluidos los misiles antibuque de bajo vuelo. El sistema está diseñado para armar a buques de pequeño desplazamiento y consta del montaje del cañón junto con un sistema de radar de control de tiro MR-123-02/76."
 UKR_module_76mm_gun_3: "76mm OTO Melara"
 UKR_module_76mm_gun_3_desc: "El cañón OTO Melara de 76 mm, comercializado como montaje de cañón OTO 76/62, es un cañón automático naval diseñado y fabricado por la empresa de defensa italiana OTO Melara. Se basa en el OTO Melara 76/62C y evolucionó hacia las variantes 76/62 SR y 76/62 Strales."
 UKR_module_127mm_guns_1: "100mm AK-100"
 UKR_module_127mm_guns_1_desc: "El AK-100 es un cañón naval soviético de 100 mm con una cadencia máxima de tiro de 60 disparos por minuto, capaz de disparar munición de 26.8 kg en variantes antiaéreas HE o de fragmentación HE."
 UKR_module_127mm_guns_2: "130mm AK-130"
 UKR_module_127mm_guns_2_desc: "El AK-130 es un cañón naval automático de doble tubo y diseño ruso con un calibre de 130 milímetros (5.1 pulgadas), capaz de disparar de 10 a 40 proyectiles por minuto (por cada tubo del cañón)."
 UKR_module_radar_1: "MR-302 §7Rubka§! / MR-310 §7Angara§!"
 UKR_module_radar_1_desc: "MR-302 Rubka is operating in the F-band air and surface search radar that was developed since 1960.\nMR-331 Rangout was operating in the X-band naval radar used by small ships for navigation, air and surface search, and target acquisition for surface-to-surface missiles of type P-15 Termit."
 UKR_module_radar_2: "MR-220 §7Reyd§! / MR-352 §7Positiv§!"
 UKR_module_radar_2_desc: "MR-302 Rubka is operating in the F-band air and surface search radar that was developed since 1960.\nMR-331 Rangout was operating in the X-band naval radar used by small ships for navigation, air and surface search, and target acquisition for surface-to-surface missiles of type P-15 Termit."
 UKR_module_radar_3: "MR-750 §7Fregat-M§! / MR-755 §7Fregat-MA§!"
 UKR_module_radar_3_desc: "Instalación de radar naval polivalente diseñada para la vigilancia tridimensional del espacio aéreo y de superficie, ofreciendo una alta capacidad de adquisición de objetivos en entornos con fuertes interferencias."
 UKR_module_radar_4: "MR-800 §7Flag§!"
 UKR_module_radar_4_desc: "El MR-800 Flag es el complejo del MR-600 Voskhod, un radar de vigilancia aérea tridimensional de largo alcance que opera en la banda D utilizando diversidad de frecuencias, acoplado con el radar MR-500 'Cleaver' para la búsqueda de superficie."
 UKR_module_radar_5: "Thales SMART-S"
 UKR_module_radar_5_desc: "El SMART-S es un sistema de radar de vigilancia e indicación de objetivos tridimensional para todo tipo de clima que opera en la banda S, destinado a todo tipo de buques navales a partir de patrulleros rápidos. Su aplicación principal es como sensor principal para el manejo de datos y el control de sistemas de armas, ofreciendo un rendimiento muy alto ante la presencia de intensas interferencias de fondo (clutter) y contramedidas electrónicas."
 UKR_module_sonar_1: "MG-322 §7Agrun§! con MG-339 §7Shelon§!"
 UKR_module_sonar_1_desc: "§7Agrun§! es un sonar soviético de §72.ª generación§! de baja frecuencia montado en el casco para obtener visibilidad §7panorámica§! y asignación de objetivos.\n§7Shelon§! es un sonar remolcado soviético de §72.ª generación§! de frecuencia media con una antena desplegable en la superestructura de popa."
 UKR_module_sonar_2: "MG-332 §7Titan-2§! con MG-325 §7Vega§!"
 UKR_module_sonar_2_desc: "§7Titan-2§! es un sonar soviético de §72.ª generación§! de baja frecuencia montado en el casco para obtener visibilidad §7panorámica§! y asignación de objetivos.\n§7Vega§! es un sonar remolcado soviético de §72.ª generación§! de frecuencia media con una antena desplegable en la superestructura de popa."
 UKR_module_sonar_3: "MG-335 §7Platina§! con MG-345 §7Bronza§!"
 UKR_module_sonar_3_desc: "§7Platina§! es un sonar soviético de §73.ª generación§! de baja frecuencia montado en el casco para obtener visibilidad §7panorámica§! y asignación de objetivos.\n§7Bronza§! es un sonar remolcado soviético de §73.ª generación§! de frecuencia media con una antena desplegable en la superestructura de popa."
 UKR_module_sonar_4: "MGK-365 §7Zvezda M1§!"
 UKR_module_sonar_4_desc: "§7Zvezda§! es un sonar soviético de §74.ª generación§! de baja frecuencia montado en el casco para obtener visibilidad §7panorámica§! y asignación de objetivos."
 UKR_module_naval_radar_jammer_2: "§7Protydiya§!"
 UKR_module_naval_radar_jammer_2_desc: "§7Protydiya§! es una suite de guerra electrónica naval propuesta, diseñada para instalarse en las corbetas del Proyecto 28250 de la clase Volodymyr Velykyi. El propósito del sistema es interceptar e inhibir las señales de radar enemigas, así como proporcionar contramedidas electrónicas contra los misiles entrantes."
