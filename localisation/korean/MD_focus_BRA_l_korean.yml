 BRA_idea_braco_forte_mao_amiga: "강한 무기와 우호국의 도움"
 BRA_idea_underwater_flotilla: "잠수함 전단"
 BRA_idea_reform_the_navy: "해군을 개혁"
 BRA_idea_french_naval_studies: "프랑스 해군 연구"
 BRA_idea_protegendo_nossas_riquezas: "Protegendo Nossas Riquezas"
 BRA_idea_mercosur_member_state: "메르코수르 회원국"
 BRA_idea_mercosur_member_state_desc: "MERCOSUR, or MERCOSUL, was a customs and political pact signed in the early '90s by Brazil, Argentina, Uruguay and Paraguay. Later, the rest of South America became associated members of MERCOSUR. The organization is a worthy organization to bring needed prosperity and unity to South America."
 BRA_idea_observer: "메르코수르 참관국"
 BRA_idea_observer_desc: "[THIS.GetNameWithFlag] is an Observer State in MERCOSUR. The observer state participates in active discussion similar to the Associated Mercosur Member State, but are not voting members in the organization."
 BRA_idea_associate_states: "Associated Mercosur Member State"
 BRA_idea_mercosur_trade_agreement: "메르코수르 무역 협정"
 BRA_idea_mercosur_education_integration: "교육 통합"
 BRA_idea_mercosur_people_goods: "소비자와 상품"
 BRA_idea_eu_trade_agreement: "유럽 연합 무역 협정"
 BRA_idea_improved_military_conditions: "군사 환경 개선"
 BRA_idea_volunteer_reformation: "스스로의 개혁"
 BRA_idea_harsher_conscription: "가혹한 징병"
 BRA_idea_liberal_economy: "자유주의 경제"
 BRA_idea_nationalism_rise: "와해된 정당"
 BRA_idea_nationalism_rise_desc: "Following several arrests of big representatives of the Workers' Party, including the ex-president Luiz Inácio Lula da Silva, the Workers' Party is rapidly losing approval and power, seeing the rise of new right-wing movements."
 BRA_idea_globo_influence: "헤지 글로보 (Globo) 방송국에 영향"
 BRA_idea_nationalism_rise2: "국가주의 성장"
 BRA_idea_opposition_media: "헤지 글로보 (Globo) 방송국과의 적대적 대립"
 BRA_idea_globo_disbanded: "헤지 글로보 (Globo) 방송국의 해산"
 BRA_idea_nationalised_globo: "국유화된 헤지 글로보 (Globo) 방송국"
 BRA_idea_christian_values: "기독교 가치"
 BRA_idea_christian_values_desc: "대부분의 브라질 국민들은 기독교를 믿습니다. 우리는 기독교 가치관을 중요시해야 합니다!"
 BRA_idea_tax_reformation: "Tax Reforms"
 BRA_idea_tax_reformation_desc: "A series of targeted and well-thought-out tax reforms have been passed, spurring economic growth in many sectors of the Brazilian economy."
 BRA_idea_liberalism: "브라질 자유주의 "
 BRA_idea_social_democracy: "브라질 사회민주주의"
 BRA_idea_pro_psdb_youth: "브라질 사회민주당 (PSDB)을 지지하는 청년층"
 BRA_idea_agrarian_reform: "농업 개혁"
 BRA_idea_fossil_fuel_industry: "[BRA.GetAdjective] Fossil Fuel Industry"
 BRA_idea_lulismo: "룰라주의 (Lulismo)"
 BRA_idea_guns_allowed: "총기 허용"
 BRA_idea_mbl: "자유 브라질 운동 (MBL)"
 BRA_idea_mbl_desc: "자유 브라질 운동(MBL)은 2014년에 설립된 브라질의 자유주의 운동입니다. 처음에는 브라질 지부의 '자유를 위한 학생들(Students for Liberty)'에서 갈라져 나왔으며, 2013년 브라질 시위 이후 커진 정치적 불만 속에서 성장하며 내외부로부터 자금을 지원받았습니다. 지도자는 활동가이자 입법가인 킴 카타기리입니다."
 BRA_idea_pax_brasilis: "팍스 브라질리스"
 BRA_idea_bolsonaro_conservative_influence: "보수주의 지원"
 BRA_idea_bolsonaro_liberal_influence: "자유주의 지원"
 BRA_idea_supporting_private_sector: "민간 분야 지원"
 BRA_idea_supporting_military: "군사 지원"
 BRA_idea_brazilian_space_force: "브라질 우주군"
 brazil.3.t: "아마존 개발 사업"
 brazil.3.d: "아마존은 우리 경제를 성장시키는 데 활용할 수 있는 미개발 보물입니다. 우리 산업과 해외 산업에서 쓸 금속, 목재, 석유를 채취할 수 있습니다. 기업들이 금전적 이익을 위해 아마존을 개발하도록 허용해야 합니까?"
 brazil.3.a: "나무는 어차피 다시 자란다."
 brazil.3.b: "환경은 팔 물건이 아니다."
 brazil.6.t: "사업: 아마존 황폐화"
 brazil.6.d: "아마존은 이미 존재하는 천연 자원으로 가능성을 보여 주었습니다. 더 새롭고 더 공격적인 사업안이 검토되고 있습니다. 이는 우리의 부채를 상쇄하고 외국인 투자를 장려하는 데 도움이 될 수 있습니다."
 brazil.6.a: "사업이 하찮은 나무들보다 더 중요하다!"
 brazil.6.b: "우리의 국가적 보물을 미래 세대를 위해 보존해야 한다."
 brazil.4.t: "룰라 당선"
 brazil.4.d: "룰라는 역사상 가장 인기 있는 대통령 중 한 명이다. 우리는 이 인기를 이용해 정부를 통해 우리가 원하는 것을 추진할 수 있습니다. 노동자당은 브라질 내에서 가장 좌파적인 급진 정당 중 하나였습니다. 이제 그들은 사회민주주의의 새로운 브랜드로 떠오르고 있습니다."
 brazil.4.a: "이제 시작이다"
 brazil.5.t: "수출 현황"
 brazil.5.d: "우리나라에는 전 세계 산업의 자금을 댈 수 있는 막대한 부의 자원이 있습니다. 이러한 원자재 수출은 지금 당장 우리에게 막대한 현금을 가져다줄 것입니다. 그러나 무역에 보호주의 정책을 도입하여 이 자원들을 국내에서 사용하기 위해 보유할 수도 있습니다. 어떻게 해야 합니까?"
 brazil.5.a: "대량 수출"
 brazil.5.b: "Our Land, Our Resources\" # Workers Party Alignment Set - Branch"
 brazil.7.t: "신공산주의자"
 brazil.7.d: "당은 민주주의에서 멀어졌습니다."
 brazil.7.a: "노동자를 위하여!"
 brazil.8.t: "급진 좌파 정부"
 brazil.8.d: "우리 당은 이제 대통령의 공약 일부를 이행한 당이 되었습니다."
 brazil.8.a: "권력의 이동"
 brazil.9.t: "다소 급진화된 정부"
 brazil.9.d: "노동자당은 급진적이라고까지는 못 해도 의문스러운 정책 변화를 단행했습니다."
 brazil.9.a: "권력의 변화"
 brazil.10.t: "균형 잡힌 정부"
 brazil.10.d: "정부는 급진적 입법과 개혁을 지향하는 입법 사이에서 흥미로운 균형을 찾았습니다."
 brazil.10.a: "완벽한 균형"
 brazil.11.t: "다소 개혁적인 정부"
 brazil.11.d: "정부는 국민을 더 위하는 정부로 개혁하는 방향으로 한 걸음 더 다가갔습니다."
 brazil.11.a: "권력의 변화"
 brazil.12.t: "개혁적 정부"
 brazil.12.d: "정부는 국민의 삶을 개선하고 정치 기구를 개선하기 위해 많은 조치를 취했습니다."
 brazil.12.a: "권력의 이동"
 brazil.13.t: "진보당"
 brazil.13.d: "노동자당은 개혁을 옹호했고 우리에게 더 새롭고 더 밝은 미래를 건설해 주었습니다."
 brazil.13.a: "브라질의 진보"
 brazil.14.t: "소외된 이들의 행진"
 brazil.14.d: "약 500년 전 포르투갈인들이 처음으로 우리 해안에 발을 디뎠습니다. 그들은 드넓고 풍요로운 땅에서 현지인들의 다소 열린 환영을 받았습니다. 그러나 지금 현지인들은 공적 삶에서 제거되지는 않았더라도 배제되어 있습니다. 2000년 브라질 건국 500주년은 잔혹하고 폭력적인 날이었습니다. 브라질 헌병 장교들은 '소외된 이들의 행진'이라 불린 원주민 시위를 해산시키기 위해 무력을 사용했습니다. 이는 원주민들을 이미 그랬던 것보다 정부로부터 더욱더 고립시키는 결과밖에 낳지 못했습니다."
 brazil.14.a: "분열의 날"
 brazil.15.t: "프랑스 해군 연구"
 brazil.15.d: "브라질이 해군을 발전시킬 목적으로 우리와 새로운 협정을 맺을 가능성을 논의하고자 접촉해 왔습니다. 브라질 해군의 가장 뛰어난 인재들이 우리의 교리와 방법을 연구하는 내용입니다. 그들의 기술자들이 우리 기술자들 밑에서 연구하며 우리가 함선을 건조하는 방식을 배우게 됩니다. 그들은 해군을 개선할 방법을 논의하기 위해 우리를 찾아왔습니다. 제안을 승인하겠습니까, 거절하겠습니까?"
 brazil.15.a: "승인한다"
 brazil.15.b: "절대 안 된다"
 brazil.18.t: "2018년 대통령 선거"
 brazil.18.d: "세 명의 주요 후보를 놓고 치열하게 다투고 있어 선거 결과는 아직 정해지지 않았습니다. 소속 정당인 PSL과 함께 최근 두각을 나타낸 우파 지도자 자이르 보우소나루가 라바 자투(Lava Jato) 작전 이후 잃은 권력을 되찾는 데 주력하는 노동자당의 페르난두 아다지, 그리고 전통 정당인 PSDB의 제라우두 아우키민과 맞붙습니다. 누가 승리를 거머쥘까요?"
 brazil.18.a: "보우소나루, 새 정부 구성"
 brazil.18.b: "노동자당, 집권 유지"
 brazil.18.c: "제라우두 아우키민, PSDB로 승리"
 brazil.19.t: "세차 작전 재판"
 brazil.19.d: "브라질 역대 최대의 반부패 작전은 좌익 정당과 중도파, 포괄 정당에서부터 극우에 이르기까지 스펙트럼의 모든 편에 미칩니다. 수년간의 수감, 수사, 추적과 감시 끝에, 이제 부패 세력을 처단할 때입니다. 브라질의 썩은 사과를 제거하는 데 성공할 것입니까, 아니면 스스로 그 하나가 될 것입니까?"
 brazil.20.t: "언론, 야권에 합류"
 brazil.20.d: "보우소나루의 승리 몇 주 뒤, 나라 최대의 언론사인 글로부 네트워크가 선거 결과에 반대하며 일간 저널의 모든 판에서 보우소나루와 그 측근들을 거론하고 있음이 분명해졌습니다. 이로 인해 우리의 인기도가 꾸준히 하락하기 시작하는 것은 시간문제임이 분명합니다."
 brazil.20.a: "왜 입을 다물지 않는 것인가!"
 brazil.22.t: "새 정당 창당"
 brazil.22.d: "보우소나루는 PSL과 내부 문제를 겪고 있으며 결국 당을 떠날 것입니다. 그러나 새로운 정당이 필요합니다. 그 정당은 \\"동맹당(Aliança)\\"이며 보수 정당이 될 것입니다."
 brazil.22.a: "정당 창당을 시작한다!"
 brazil.23.t: "민족주의 운동의 부상"
 brazil.23.d: "좌파가 정치적으로 약해진 시기에, 나라가 몇 년 전에 걸었던 방향과 반대의 방향을 추구하는 민족주의 및 우익 운동이 전국에서 부상하고 있습니다."
 brazil.23.a: "이 나라는 어떻게 될 것인가?"
 brazil.24.t: "브라질 군주제?"
 brazil.24.d: "나라를 안정시키려면 군주제를 부활시킬 필요가 있습니다. 그러나 이것이 가능할까요?"
 brazil.24.a: "두고 보자..."
 brazil.25.t: "헤지 글로보에 대한 정부의 영향"
 brazil.25.d: "PT가 대통령 아래 확고한 정당으로 부활한 이후, 최대 언론사인 글로부에 대해 한때 지녔던 영향력을 되찾았습니다."
 brazil.25.a: "결국 승리다"
 brazil.26.t: "센트랑과의 동맹"
 brazil.26.a: "DEM, PSDB와 동맹을 맺자!"
 brazil.26.b: "DEM과 동맹을 맺자!"
 brazil.26.c: "연립은 구성하지 말고 지지만 얻자."
 brazil.26.d: "To expand our influence, we need to ally ourselves with the Centrão, or we can just follow our own path."
 brazil.27.t: "글로부 문제"
 brazil.27.d: "언론은 우리의 가장 큰 적입니다. 그들은 대중을 우리에게 반대하도록 조종하여 우리 체제를 인기 없게 만들고 있습니다. 최대 언론 채널인 글로부 그룹을 침묵시킴으로써 우리는 보우소나루와 당에 대한 대중의 지지를 확보합니다."
 brazil.27.a: "모든 TV 채널을 검열하겠다!"
 brazil.27.b: "국유화한다, 그들의 넓은 시청 범위를 잘 활용할 수 있다"
 brazil.27.c: "해체한다, 입을 막아야 할 거짓말쟁이들이다!"
 brazil.28.t: "트럭 운전사 파업"
 brazil.28.d: "몇 달간 우리나라의 석유 가격이 치솟고 있으며, 주된 원인은 테메르의 경제 정책과 헤알화의 평가절하입니다. 트럭 운전사 노조들이 이제 대응에 나서, 디젤 가격 인하를 요구하며 그렇지 않으면 석유와 자원 공급을 마비시킬 전국적 파업을 벌이겠다고 위협하고 있습니다. 어떻게 해야 합니까?"
 brazil.28.a: "디젤 가격을 낮춘다"
 brazil.28.b: "현재 가격을 감수하게 한다"
 brazil.29.t: "Choose our USA Ambassador"
 brazil.29.d: "우리는 이전 정권이 세운 모든 정치 구조를 바꾸어야 하며, 여기에는 대사 교체도 포함됩니다. 미국에서 우리의 외교를 대표할 인물을 골라야 합니다. 대통령의 아들 에두아르두 보우소나루입니까, 아니면 이미 경험 있는 외교관인 네스토르 포르스테르입니까?"
 brazil.29.a: "에두아르두 보우소나루, 이것이 길이다!"
 brazil.29.b: "네스토르가 이 직무에 더 경험이 많다"
 brazil.30.t: "민족주의 지도자 정상회의"
 brazil.30.d: "전 세계의 수많은 민족주의 지도자들이 공산주의자들과 세계주의 자유주의자들에 맞서는 방안을 논의하기 위해 브라질에서 열리는 정상회의에 초청되었습니다!"
 brazil.30.a: "이 집단들과 싸우고 우리나라들의 질서를 지키자!"
 brazil.31.t: "벌목 개혁"
 brazil.31.d: "아마존을 보존하기 위해 벌목 산업에 더 엄격한 규제를 시행해야 합니다."
 brazil.31.a: "개혁을 시작하자!"
 brazil.33.t: "아마존 문제"
 brazil.33.d: "아마존은 세계 최대의 열대우림입니다. 그러나 최근 몇 년간 열대우림에서 발생한 화재로 인해 황폐화되었습니다. 국제연합이 대응에 나서고 있으며, 일부 국가들은 이 문제에 간섭하려 하고 있습니다. 어떻게 해야 합니까?"
 brazil.33.a: "이 화재는 우리가 직접 진압할 것이다. 아마존은 브라질 영토에 있으니 브라질의 것이다!"
 brazil.33.b: "어쩌면 도움을 받을 수도 있다."
 brazil.35.t: "다른 정당과 연대"
 brazil.35.d: "우리는 브라질을 홀로 통치할 수 없습니다. 다른 정당들, 특히 우리의 이해관계를 충족해 주는 정당들과 함께 통치해야 합니다. 그렇다면 어느 정당을 택할 것입니까?"
 brazil.35.a: "DEM이다!"
 brazil.35.b: "MBL이다!"
 brazil.35.c: "둘 다다!"
 brazil_news.1.t: "보우소나루, 브라질 정부를 쿠데타로 전복!"
 brazil_news.1.d: "민주주의에 대한 수개월간의 언어적 공격과 의회를 상대로 한 행동 끝에, 보우소나루는 마침내 정부를 상대로 쿠데타를 일으켜 포고령으로 스스로를 지도자에 앉혔습니다. 그토록 많은 정치적 격동을 겪은 나라 브라질은 이제 50년도 채 안 되는 기간에 두 번째 군사 독재를 맞이하고 있는데, 앞으로 어떻게 될까요?"
 brazil_news.1.a: "모든 것 위에 브라질, 모든 것 위에 신!"
 brazil_news.1.b: "좋은 일만 있길 바라자..."
 brazil_news.2.t: "브라질, 페트로브라스 민영화"
 brazil_news.2.d: "파울루 게지스의 경제 자유화 계획에 따라, DOU(연방 관보)는 이번 주 초 브라질 정부가 다수 지분을 보유한 다국적 기업 페트로브라스가 시장을 외부 주주들에게 전면 개방한다고 발표했습니다."
 brazil_news.2.a: "브라질은 진보하려면 국가에 대한 장악력을 느슨하게 해야 한다!"
 brazil_news.2.b: "그들이 옳은 일을 하고 있기를 바란다"
 brazil_news.3.t: "루이스 1세, 브라질에 군주제 복원"
 brazil_news.3.d: "지난 몇 주 동안 브라질의 군주주의 정치 운동이 기하급수적으로 성장한 데 이어, 오늘 루이스 1세가 브라질 제국의 제3대 황제로 즉위했습니다. 참석한 모든 군 지도자와 정치인들이 경의를 표했으며, 기자회견에서 브라질의 국기와 국명 변경이 발표되었습니다. 이 조치가 나라를 더욱 흔들지, 아니면 안정시켜 평화와 번영을 가져올지는 지켜봐야 합니다."
 brazil_news.3.a: "루이스 1세가 우리를 번영으로 이끌 것이다!"
 brazil_news.3.b: "그들에게 행운이 있기를..."
