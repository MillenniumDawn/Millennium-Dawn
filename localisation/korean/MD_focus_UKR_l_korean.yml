 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d: "[BUL.GetNameWithFlag] §Y불가리아§!에 낡은 §YBTR-60PB§! 요청"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_btr_60d_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60d_for_tooltip\n\n\n\n\n\n\n\n\n§W러시아와의 전쟁이 우리 장갑차를 집어삼키고 있습니다. §Y불가리아§!는 아직 낡은 §YBTR-60PB§!를 창고에 보관 중이며 군사 원조로 넘겨줄 준비가 되어 있습니다. 이를 그대로 배치할 수도 있고, 국내에서 정비하여 마모된 §YGAZ-40P§! 가솔린 엔진을 독일제 §YDeutz BF4M2012§! 디젤 엔진 두 기와 새 변속기로 교체할 수도 있습니다. 이 개량형이 §YBTR-60D§!입니다.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.name: "불가리아의 첫 BTR-60PB"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.desc: "§Y불가리아§!가 창고에 아직 남아 있다면 첫 §Y20§!대의 BTR-60PB를 보낼 준비가 되어 있습니다. 낡고 닳았지만 여전히 물에 뜨고, 달리고, 분대 하나를 태울 수 있습니다. 곧바로 전선에 보낼 수도 있고, 먼저 정비하여 도이츠 디젤 엔진을 장착할 수도 있습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.6.a: "그대로 배치한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.b: "정비하여 §YBTR-60D§!로 만든다"
 ukraine_modernize_sov_equipment_btr_60_modernization.6.c: "불가리아에는 더 내줄 여유가 없다"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.name: "인도된 첫 BTR-60D"
 ukraine_modernize_sov_equipment_btr_60_modernization.7.desc: "우리 정비 공장이 첫 §Y20§!대의 §YBTR-60D§!를 완성했습니다. 각 102마력의 도이츠 BF4M2012 디젤 엔진 두 기가 낡은 GAZ-40P 가솔린 엔진을 대체하여 차량의 신뢰성이 높아지고 출력도 약간 늘었습니다. 첫 차량들은 기계화 여단으로 갑니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.7.a: "전선으로 보낸다"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.name: "불가리아의 다음 BTR-60PB 물량"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.desc: "§Y불가리아§!가 창고에 아직 남아 있다면 §Y40§!대의 BTR-60PB를 추가로 보낼 준비가 되어 있습니다. 이번에도 그대로 쓸 수도 있고 정비하여 §YBTR-60D§!로 만들 수도 있습니다. 우리 공장은 이미 작업에 익숙하므로 더 빨리 끝납니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.8.a: "그대로 배치한다"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.b: "정비하여 §YBTR-60D§!로 만든다"
 ukraine_modernize_sov_equipment_btr_60_modernization.8.c: "$ukraine_modernize_sov_equipment_btr_60_modernization.6.c$"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.name: "인도된 BTR-60D 물량"
 ukraine_modernize_sov_equipment_btr_60_modernization.9.desc: "또 다른 §Y40§!대의 §YBTR-60D§!가 새 도이츠 디젤 엔진과 변속기를 달고 우리 정비 공장을 떠났습니다."
 ukraine_modernize_sov_equipment_btr_60_modernization.9.a: "전선으로 보낸다"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_stockpile_tt: "[BUL.GetNameWithFlag] §Y불가리아§!가 1세대 장갑 수송차를 최소 §Y100§!대 보관 중 (현재: §Y[?BUL.num_equipment@medium_tank_amphibious_chassis_0|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_stockpile_tt_legacy: "[BUL.GetNameWithFlag] §Y불가리아§!가 1세대 장갑 수송차를 최소 §Y100§!대 보관 중 (현재: §Y[?BUL.num_equipment@APC_1|0]§!)"
 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_plan_tt: "§Y불가리아§!는 BTR-60PB §Y100§!대를 세 차례에 나누어 넘겨줍니다. §Y20§!대, 이어서 §Y40§!대와 §Y40§!대입니다. 각 물량은 그대로 배치하거나 정비하여 §YBTR-60D§!로 만들 수 있습니다."
