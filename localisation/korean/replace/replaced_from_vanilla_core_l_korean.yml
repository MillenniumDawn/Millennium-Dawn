 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR: "§H해상 상륙 명령 (모듈식 둑길 체계 지원 포함)§!\n1단계) 강조 표시된 지역 중 하나를 §G클릭§!하여 상륙 출발지를 설정합니다.\n2단계) 상륙할 해안 지역을 §G우클릭§!합니다.\n계획이 활성화되면 상륙 준비가 시작되며 비축분에서 수송 선단과 모듈식 둑길 체계가 예약됩니다."
