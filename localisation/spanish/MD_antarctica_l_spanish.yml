 ANTARCTICA_STATION_SEND_SUPPLIES_TEXT_DELAYED: "§YRequisitos previos§!\n[!antarctica_station_send_supplies_button_click_enabled]\n§YEfectos:§!\nRepostar hasta alcanzar la capacidad máxima de combustible.\nPrecio:§R $0.25b por cada 1 000 de combustible§!(se duplica durante el invierno antártico).\nEl importe se cobra por adelantado y el combustible llega una vez transcurrido el plazo de entrega.\n\n§YPlazo de entrega:§!§G15 días(noviembre-marzo)§! o §R30 días (abril-octubre)§!."
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT: "Enviar observadores"
 ANTARCTICA_STATION_SEND_OBSERVERS_TEXT_DELAYED: "§YRequisitos previos:§!\n[!antarctica_station_send_observers_button_click_enabled]§YEstado de la tormenta de nieve:§![MD_antarctica_observer_blizzard_status]\n\n§YEfectos:§!\nEnvía una misión de observadores a la estación seleccionada.\nSe notifica inmediatamente al país de destino.\nLos observadores llegan después de§Y7 días§!y comprobar si hay actividades de laboratorio ilegales o si se utilizan servicios de suministro de agua y gas sin conexión a la red."
