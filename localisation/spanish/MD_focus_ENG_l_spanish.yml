 ENG_made_smarter_programme: "Made Smarter Programme"
 ENG_made_smarter_programme_desc: "Acting on the Made Smarter Review, we fund the adoption of industrial digital technologies across manufacturing supply chains. Robotics, additive manufacturing and data analytics reach the shop floor of smaller firms, so lines retool faster and run closer to full efficiency."
