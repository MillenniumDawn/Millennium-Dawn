 SAU_succession_panel_dormant: "The throne is occupied and the succession is not in contest. Should it reopen, the princes and their factions will be set out here.[ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_named: "The Crown Prince has been named: §H[ROOT.GetSAUCrownPrinceName]§!. The contest is over and the arrangement will hold exactly as long as the King does.\n\n§YThe King's health:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race1: "King Fahd is dead and King Abdullah now reigns, but he too is old and the succession is unsettled. Three princes contend to be named heir: Salman bin Abdulaziz, standard-bearer of the Sudairi establishment; Mohammed bin Nayef, master of the security services; and Mutaib bin Abdullah, commander of the National Guard.\n\nBack one prince and rally the family and the state behind him while undermining his rivals. Each faction also schemes for itself, so the balance of influence shifts every month. When King Abdullah dies, the prince holding the greatest share of influence ascends the throne.\n\n§YSalman bin Abdulaziz:§! [?SAU_salman_share|0]%\n§YMohammed bin Nayef:§! [?SAU_mbn_share|0]%\n§YMutaib bin Abdullah:§! [?SAU_mutaib_share|0]%\n\n§YHeir apparent, were Abdullah to die today:§! §H[ROOT.GetSAUCrownFrontrunner]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race2: "King Salman reigns, and the contest has narrowed to two men and one title. Mohammed bin Nayef holds the Interior Ministry, the counter-terrorism file and the confidence of Washington. Mohammed bin Salman holds the economy, the defence portfolio and his father's ear, which in this family has always counted for more.\n\nBack one and rally the state behind him while undermining the other. Whoever holds the greater share when the King names his heir - or when he dies without naming one - takes the throne after him.\n\n§YMohammed bin Salman:§! [?SAU_heir_mbs_share|0]%\n§YMohammed bin Nayef:§! [?SAU_heir_mbn_share|0]%\n\n§YHeir apparent today:§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§YThe King's health:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
