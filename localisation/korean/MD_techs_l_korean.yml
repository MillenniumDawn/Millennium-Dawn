 module_sonar_8: "소나 VIII"
 module_sonar_8_desc: "하이퍼 첨단 소나 기술은 극한 거리 탐지, 실시간 위협 우선순위 판별, 첨단 소음 저감을 결합하여 수중 탐지 및 대잠수함전 능력의 정점을 보여줍니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_sonar_9: "소나 IX"
 module_sonar_9_desc: "울트라 첨단 소나 기술은 극한 거리 탐지, 실시간 위협 우선순위 판별, 첨단 소음 저감을 결합하여 수중 탐지 및 대잠수함전 능력의 정점을 보여줍니다.\n\n§G설계 힌트: 소나는 잠수함 탐지를 중점적으로 향상시키며 수상 탐지, 대함 미사일, 어뢰 공격력도 높여 줍니다. 대잠 함선에 비용 대비 효율적인 선택이지만 레이더보다 전투 지원 범위는 좁습니다.§!"
 module_naval_radar_jammer_6: "해군 레이더 재머 VI"
 module_naval_radar_jammer_6_desc: "$module_naval_radar_jammer_1_desc$"
 module_surface_diesel_power_1_desc: "개량된 디젤 기관은 더 나은 연료 효율과 신뢰성을 제공하여 더 긴 전개와 완만한 속도 향상을 가능하게 합니다.\n\n§G설계 힌트: 디젤 추진은 낮은 생산 비용으로 완만한 속력과 최대 항속거리를 제공합니다. 저비용 연안 및 지역 함대에 적합하지만 연료 소모와 수상 가시성이 증가합니다.§!"
