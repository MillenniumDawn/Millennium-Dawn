 UKR_t62_egypt_independent_development_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t62_egypt_for_tooltip\n\n\n\n\n\n\n\n\n§Y[EGY.GetNameWithFlag]§! эксплуатирует большой парк §YТ-62§!. §YХКБМ§! может разработать пакет §YТ-62-5ТДФ§!, не завершая сначала нашу программу §YТ-55§!, но без этого опыта работа займёт §Y300 дн.§! и обойдётся в §R[?UKR_storage_t62_independent_development_cost|2]§! млрд.\nПринятие проекта на вооружение открывает нашу программу закупки и выполняет требование о более ранней модели для египетских предложений. Их прежние дипломатические и исторические условия по-прежнему действуют.\n\n$UKR_rada_modernization_adoption_tt$"
 UKR_t62_egypt_independent_development_cost: "£treasury [?UKR_storage_t62_independent_development_cost|2]   £pol_power §Y5§!   £army_experience §Y2§!"
 UKR_t62_egypt_independent_development_cost_blocked: "£treasury §R[?UKR_storage_t62_independent_development_cost|2]§!   £pol_power  §R5§!   £army_experience  §R2§!"
 UKR_t62_egypt_independent_development_cost_tooltip: "Требуется £pol_power §Y5§! и £army_experience §Y2§!, обойдётся нам в §Y[?UKR_storage_t62_independent_development_cost|2] млрд§!"
 UKR_t62_egypt_independent_development_tt: "После испытаний принятие на вооружение §YТ-62-5ТДФ§! выполняет требование о более ранней модели для предложений по модернизации (§Y[EGY.GetNameWithFlag]§!) без программы §YТ-55§!."
 UKR_t62_egypt_kmdb_free_tt: "§YХКБМ§! не обследует хранящиеся танки и не разрабатывает другой проект §YТ-55§! или §YТ-62§!"
 UKR_Rafale: "Rafale"
 UKR_Rafale_desc: "Нашим ВВС нужно обновить парк: мы можем купить французский истребитель Rafale на замену устаревшим советским самолётам. Rafale — универсальная машина, способная завоёвывать превосходство в воздухе, наносить удары по наземным целям и вести разведку."
 UKR_gripen: "JAS 39 Gripen"
 UKR_gripen_desc: "Нашим ВВС нужно обновить парк, и Gripen стал бы для нас лучшим выбором: это универсальный самолёт, способный завоёвывать превосходство в воздухе, наносить удары по наземным целям и вести разведку. Кроме того, Gripen известен низкой стоимостью эксплуатации и простотой обслуживания."
 UKR_An178: "Разработка Ан-178"
 UKR_An178_desc: "Ан-178 — военно-транспортный самолёт средней грузоподъёмности, разработанный «Антоновым». Это новая конструкция на основе регионального пассажирского самолёта Ан-148 с кормовой рампой для погрузки и выгрузки грузов. Ан-178 должен заменить устаревший парк старых транспортных самолётов «Антонова» в Воздушных силах Украины."
 UKR_ukrainian_swedish_cooperation: "Украинско-шведское сотрудничество"
 UKR_ukrainian_french_cooperation: "Украинско-французское сотрудничество"
 UKR_trade_ukrainian_swedish_cooperation: "Украинско-шведское торговое сотрудничество"
 UKR_trade_ukrainian_french_cooperation: "Украинско-французское торговое сотрудничество"
 UKR_an178_development.1.t: "Программа Ан-178"
 UKR_an178_development.1.d: "Транспортная авиация Украины стареет и всё больше зависит от устаревших конструкций, поэтому «Антонов» предложил Ан-178 как современный средний транспортный самолёт и уже три года готовит этот проект. Призванный заменить старые платформы и укрепить отечественную авиакосмическую отрасль, он открывает возможности и для армии, и для промышленности."
 UKR_an178_development.1.a: "Выделить больше средств"
 UKR_an178_development.2.t: "Выбор двигателя для Ан-178"
 UKR_an178_development.2.d: "Одно из важнейших решений при разработке Ан-178 — выбор силовой установки. Изначально самолёт проектировался под турбовентиляторный двигатель Д-436-148ФМ, проверенный двигатель из отработанного семейства Д-436. Однако предложенный АИ-28 — более амбициозная альтернатива: благодаря передовой схеме с редуктором он даёт большую тягу и лучшую топливную экономичность. Его разработка потребует значительно больше времени и денег, но может заметно улучшить характеристики самолёта."
 UKR_an178_development.2.a: "Оставить проверенный Д-436-148ФМ"
 UKR_an178_development.2.b: "Вложиться в АИ-28 нового поколения"
 UKR_an178_development.3.t: "Выбор авионики для Ан-178"
 UKR_an178_development.3.d: "Двигатель выбран, теперь пора заняться комплексом авионики. У Украины есть опыт для разработки собственной авионики, но это потребует дополнительных вложений и времени. Сотрудничество с российскими производителями дало бы доступ к отработанным решениям и ускорило бы разработку, но усилило бы нашу зависимость от иностранных технологий."
 UKR_an178_development.3.a: "Сотрудничать с российскими производителями"
 UKR_an178_development.3.b: "Разработать отечественную авионику"
 UKR_an178_development.4.t: "Испытания Ан-178"
 UKR_an178_development.4.d: "Проект Ан-178 вошёл в решающую фазу разработки. От достаточности финансирования будут зависеть объём испытаний, готовность к производству и долговременная надёжность самолёта."
 UKR_an178_development.4.a: "Выделить базовое финансирование и ограниченные испытания"
 UKR_an178_development.4.b: "Обеспечить полное финансирование и полноценные испытания"
 UKR_an178_development.5.t: "Ан-178 поступает на вооружение"
 UKR_an178_development.5.d: "После многих лет разработки и испытаний Ан-178 успешно прошёл все проверки и готов к эксплуатации. Самолёт усиливает транспортную авиацию Украины, повышает гибкость снабжения и становится важным достижением национальной авиакосмической отрасли."
 UKR_an178_development.5.a: "Принять Ан-178 на вооружение"
