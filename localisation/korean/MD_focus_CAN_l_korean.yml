l_korean:
 canada_focus: "캐나다 중점 계통도"
 CAN_Canadian_Economy: "캐나다 경제"
 CAN_Canadian_Economy_desc: "The Canadian economy is the tenth largest economy in the world by GDP. It is predominantly a service economy which employs around three-quarters of the entire country's work force. Furthermore, it also has the third highest total estimated value of natural resources as well as the world's third largest petroleum reserves."
 CAN_Prospects_Oil: "석유 시추"
 CAN_Prospects_Oil_desc: "석유는 우리 위대한 나라를 위한 추가 자금을 생산하는 데 큰 자원입니다. 캐나다나 해외의 석유 회사에 보조금을 지급하는 것은 천연 자원의 재무상태를 강화하는 데 도움이 될 수 있습니다. "
 CAN_National_Companies: "국립 회사"
 CAN_National_Companies_desc: "여기 국내 회사들은 우리의 목표에 부합합니다. 그들은 열심히 일하는 캐나다인들을 고용하고 우리를 부자로 유지합니다! "
 CAN_Suncor_Energy: "선코 에너지"
 CAN_Suncor_Energy_desc: "선코르는 오일샌드에서 합성원유를 생산하는 데 집중하고 있습니다. 회사는 캐나다의 지역 석유 생산의 핵심적인 부분을 차지하고 있으며 회사는 1995년 공개 상장한 후 떠오르는 석유 기업으로 주목 받았습니다."
 CAN_Oil_Sands: "오일샌드"
 CAN_Oil_Sands_desc: "오일샌드는 석유 매장층의 한 종류입니다. 오일샌드는 모래, 점토, 물이 자연적으로 섞여 있는 느슨한 모래 또는 부분적으로 굳은 사암에 밀도가 높고 점성이 큰 형태의 석유가 스며든 것입니다."
 CAN_Alberta: "앨버타"
 CAN_Alberta_desc: "앨버타에는 애서배스카 오일샌드가 있습니다. 이 지역은 오일샌드가 풍부하며 앨버타의 주요 천연자원 중 하나입니다."
 CAN_Athabasca_Oil_Refineries: "애서배스카 석유 정제소"
 CAN_Athabasca_Oil_Refineries_desc: "애서배스카 오일샌드를 계속 개발하면 캐나다의 석유 수출을 확대하는 데 도움이 될 수 있습니다."
 CAN_Saskatchewan: "서스캐처원"
 CAN_Saskatchewan_desc: "서스캐처원은 캐나다의 두 주요 오일샌드 지역 중 하나입니다. 이곳은 이 자원의 정제와 수송에 크게 의존하고 있습니다."
 CAN_Bakken_Shale_Refineries: "박켄 셰일 정제소"
 CAN_Bakken_Shale_Refineries_desc: "배컨 셰일에서 나오는 석유를 정제하면 우리의 석유 자립도를 높이는 데 도움이 될 것입니다."
 CAN_Keystone_Pipeline: "키스톤 송유관"
 CAN_Keystone_Pipeline_desc: "키스톤 송유관은 캐나다와 미국 역사상 가장 논란이 많았던 송유관 중 하나입니다. 계획된 안은 현재의 송유관보다 더 짧은 거리로 더 많은 석유를 수송할 수 있게 해 줄 것입니다."
 CAN_Imperial_Oil: "임페리얼 오일"
 CAN_Imperial_Oil_desc: "임페리얼 오일은 캐나다의 주요 석유 정제 및 탐사 기업입니다. 통합 석유 기업으로는 두 번째로 큽니다."
 CAN_International_Companies: "국제 회사"
 CAN_International_Companies_desc: "외국 기업을 유치하고 해외 다국적 기업과 거래를 맺는 것은 그들뿐 아니라 우리 석유 산업에도 도움이 될 것입니다."
 CAN_Exxon_Mobile: "엑슨모빌"
 CAN_Exxon_Mobile_desc: "엑슨모빌은 세계 최대 기업 중 하나입니다. 엑슨모빌은 존 록펠러의 스탠더드 오일의 가장 큰 직계 후손으로, 1999년 엑슨과 모빌의 합병으로 설립되었습니다. 이 기업은 계속 성장하며 세계 최대 석유 기업 중 하나로 남아 있습니다."
 CAN_NA_Oil_Treaty: "북아메리카 석유 협약"
 CAN_NA_Oil_Treaty_desc: "북미석유조약은 북미자유무역협정의 연장선이다. 주로 미국과 캐나다 간의 석유 조약을 중심으로 진행됩니다."
 CAN_Increase_Local_Refining: "국내 정재량 증대"
 CAN_Increase_Local_Refining_desc: "국내 정제 능력을 개선하면 셰일과 샌드에서 생산하는 \\"더러운\\" 석유를 보다 효율적으로 다룰 수 있게 될 것입니다."
 CAN_Mutual_Extraction_Research: "공동 시추 연구"
 CAN_Mutual_Extraction_Research_desc: "석유를 처리하는 더 효율적인 방법을 연구하는 것은 우리나라에 매우 유익할 수 있습니다. 캐나다의 이 핵심 산업에 집중하는 것이 중요합니다."
 CAN_Saudi_Aramco: "사우디아람코 정유 회사"
 CAN_Saudi_Aramco_desc: "사우디 아람코는 매출 기준 세계 최대 기업 중 하나이며, 세계 2위의 원유 확인 매장량을 자랑합니다. 또한 석유 생산 기업 가운데 일일 석유 생산량이 가장 많아, 사우디아라비아가 세계 2위 산유국으로서의 입지를 더욱 굳히고 있습니다."
 CAN_european_military: "유럽식 군대"
 CAN_european_military_desc: "유럽식의 분권화된 여단 체제에 가깝게 군을 더욱 재편하면 신속 대응 임무를 더 효율적으로 수행할 수 있을 것입니다."
 CAN_american_canadian_military: "미국-캐나다 군사 협력"
 CAN_american_canadian_military_desc: "남쪽의 거대한 이웃 나라와 협력하면 우리 병사들에게 새로운 기술을 가르칠 수 있습니다."
 CAN_Rosneft: "로스네프트"
 CAN_Rosneft_desc: "가즈프롬보다는 작지만, 로스네프트는 러시아 출신의 또 다른 주요 석유 기업입니다. 러시아 내 3위 기업으로서 세계적인 명성을 쌓았습니다. 2013년에는 세계 최대 상장 석유 기업 중 하나가 되었습니다."
 CAN_Refineries_Abroad: "해외 정제소"
 CAN_Refineries_Abroad_desc: "해외 정제소에 투자하면 우리의 대차대조표를 강화하고, 더 큰 협력을 모색해 온 해외 국가들과의 관계를 심화하는 데 도움이 될 것입니다."
 CAN_Local_Investing: "국내 투자"
 CAN_Local_Investing_desc: "석유 자급자족은 더 큰 경제적 번영의 길을 열어 줄 것입니다. 이 \\"검은 황금\\"을 정제하여 캐나다의 저력을 세계에 보여 줍시다."
 CAN_Abqaiq_Refineries: "아프케이 정제소"
 CAN_Abqaiq_Refineries_desc: "사우디 아람코와의 제휴가 그 가치를 드러내기 시작했습니다. 아브카이크 정제소에 투자하면 이 거대 기업의 수익을 더 큰 몫으로 가져올 수 있을 것입니다!"
 CAN_Volgograd_Refineries: "볼고그라드 정제소"
 CAN_Volgograd_Refineries_desc: "루코일의 정제소들은 개선이 필요합니다. 러시아의 이 정제소들에 자금을 더 잘 댈수록 이 지역에 대한 해외 투자에서 더 많은 수익을 기대할 수 있습니다."
 CAN_Focus_Oil_Sands: "오일샌드에 중점"
 CAN_Focus_Oil_Sands_desc: "현재 에너지 중점을 오일샌드에 맞추어 구성하면 우리 연구개발 부서가 더 나은 채굴 및 정제 방식을 만들어 내는 데 도움이 될 것입니다."
 CAN_Focus_Oil_Shales: "오일셰일에 중점"
 CAN_Focus_Oil_Shales_desc: "현재 에너지 중점을 오일 셰일에 맞추어 구성하면 우리 연구개발 부서가 더 나은 채굴 및 정제 방식을 만들어 내는 데 도움이 될 것입니다."
 CAN_Efficient_Oil_Production: "효율적인 석유 생산"
 CAN_Efficient_Oil_Production_desc: "정제 공정을 개선하면 우리나라의 석유 생산량은 늘어날 수밖에 없습니다."
 CAN_Oil_Expansion_Expertise: "Oil Barons of the Americas"
 CAN_Oil_Expansion_Expertise_desc: "캐나다를 따라올 자는 아무도 없다!"
 CAN_Canadian_Infrastructure: "캐나다 기반시설"
 CAN_Canadian_Infrastructure_desc: "인프라는 우리 경제의 생명줄이며, 필요한 자원을 여기에 투입하는 것을 주저해서는 안 됩니다."
 CAN_Provincial_Funding_Of_Road_Infrastructure: "도로건설을 위한 지방자금 조성"
 CAN_Provincial_Funding_Of_Road_Infrastructure_desc: "인프라의 질은 주마다 다릅니다. 우리는 지역 간 격차를 해소하기 위해 할 수 있는 모든 것을 해야 합니다."
 CAN_Federal_Gas_Tax_Fund: "연방 가스세 기금"
 CAN_Federal_Gas_Tax_Fund_desc: "연방 가스세 기금을 통해 화석 연료에서 나오는 수입을 대중교통, 폐기물 관리, 재난 완화 등 여러 분야의 지역 인프라 사업을 지원하는 데 사용할 수 있습니다."
 CAN_Provincial_Territorial_Base_Fund: "지방 개간 기금 조성"
 CAN_Provincial_Territorial_Base_Fund_desc: "이 기금을 통해 캐나다 각 주와 준주의 핵심 인프라 우선 사업에 기본 수준의 자금을 지원할 수 있습니다."
 CAN_Building_Canada_Fund: "캐나다 기금 조성"
 CAN_Building_Canada_Fund_desc: "빌딩 캐나다 계획의 일환인 이 새로운 기금은 국가, 지역, 지방 차원의 인프라 우선 사업을 다루어 더 강한 경제, 더 깨끗한 환경, 강하고 번영하는 공동체라는 세 가지 우선 과제를 달성할 수 있습니다."
 CAN_Canada_Strategic_Infrastructure_Fund: "캐나다 전략 기반시설 기금 조성"
 CAN_Canada_Strategic_Infrastructure_Fund_desc: "일부 인프라는 국가가 제대로 기능하는 데 필수적입니다. 철도와 상수도 인프라 같은 자산은 특별한 관심을 받을 만하며, 따라서 전담 기금이 필요합니다."
 CAN_P3_Projects: "P3 계획"
 CAN_P3_Projects_desc: "민간 부문이 성장함에 따라 정부가 대규모 인프라 사업을 홀로 떠맡을 필요가 더는 없습니다. 캐나다 정부와 산업계 간의 민관 파트너십은 의료, 교통, 환경, 사법, 여가, 교육과 관련된 사업의 자금을 조달하는 유용한 방법을 제공합니다."
 CAN_Trans_Canada_Highway_Expansion: "캐나다 고속도로 확장"
 CAN_Trans_Canada_Highway_Expansion_desc: "매우 넓은 나라이기에 캐나다의 양 끝을 연결하는 일은 결코 쉽지 않습니다. 우리나라의 연결성을 높이기 위해 트랜스캐나다 고속도로를 개선해야 합니다."
 CAN_Heavy_Industries_Focus: "중공업 중점"
 CAN_Heavy_Industries_Focus_desc: "캐나다가 세계 최대 경제 중 하나로서의 자리를 지키려면, 국내 산업에 필요한 투자를 해야 합니다."
 CAN_Centralized_Industry: "중앙 집중화 산업"
 CAN_Centralized_Industry_desc: "우리나라의 경제 동력을 면밀히 주시하는 것이 중요합니다."
 CAN_AECON_Industries: "AECON 건설 회사 산업"
 CAN_AECON_Industries_desc: "에이콘 인더스트리얼은 에이콘 그룹 Inc.의 한 부서로, 산업과 관련된 분야에서 공공 및 민간 부문에 건설 서비스를 제공하는 것을 전문으로 합니다."
 CAN_Petrochemical_Industrialization: "석유 산업화"
 CAN_Petrochemical_Industrialization_desc: "캐나다의 방대한 화석 연료 매장량을 고려하면, 석유화학 생산은 집중할 만한 수익성 높은 분야가 될 수 있습니다."
 CAN_Nuclear_Energy_Developments: "핵에너지 개발"
 CAN_Nuclear_Energy_Developments_desc: "화석 연료는 캐나다에 많은 것을 안겨 주었지만, 그 공급이 무한하지 않다는 것을 우리는 알고 있습니다. 에너지원을 다변화하기 시작해야 하며, 원자력은 존재하는 대안 중 가장 유망한 것 중 하나입니다."
 CAN_Allow_Foreign_Companies: "외국 회사 용인"
 CAN_Allow_Foreign_Companies_desc: "캐나다는 언제나 세계 자본주의의 필수적인 일부였으며, 외국 다국적 기업을 두 팔 벌려 환영함으로써 이 역할을 계속 수행할 것입니다."
 CAN_Seek_US_Companies: "미국 회사 몰색"
 CAN_Seek_US_Companies_desc: "미국과 인접해 있는 만큼, 국경 남쪽의 미국 거대 기업들은 캐나다 시장에 특히 관심이 많습니다. 그러지 않을 이유가 있겠습니까?"
 CAN_Strengthen_NA_Agreements: "북미자유무역협정 지원"
 CAN_Strengthen_NA_Agreements_desc: "우리는 NAFTA와 다른 형태의 협력이 북미 내에서 형성되기 시작한 공동 유대를 강화해야 합니다."
 CAN_Expand_Automobile_Manufactoring: "Expand Automobile Manufacturing"
 CAN_Expand_Automobile_Manufactoring_desc: "수년 동안 미국, 일본 등의 외국 자동차 제조사들이 캐나다 조립 공장에서 제품을 생산해 왔습니다. 이 기반을 토대로 발전시키면 더 많은 캐나다인 일자리와 더 강한 캐나다 경제를 보장할 수 있습니다."
 CAN_seek_british_companies: "영국 회사 물색"
 CAN_seek_british_companies_desc: "대서양에 한 발을 걸쳐 두려는 영국 기업들은 우리나라에서 경제적 기회를 찾고자 열의를 보이고 있습니다."
 CAN_Strengthen_EU_Cooperations: "유럽과의 협력 지원"
 CAN_Strengthen_EU_Cooperations_desc: "유럽 각국은 예전 같은 경제적 비중을 갖고 있지 않을 수 있으나, 함께 모이면 우리가 무시할 수 없는 세계 경제의 중요한 일부를 이룹니다."
 CAN_Expand_Shipbuilding: "조선업 지원"
 CAN_Expand_Shipbuilding_desc: "수십억 달러의 수익을 올리고 1만 개가 넘는 일자리를 유지하는 캐나다의 해양 산업은 더욱 발전시킬 수 있는 유용한 경제 부문입니다."
 CAN_Industrial_Expertise: "산업 기술"
 CAN_Industrial_Expertise_desc: "이제 우리는 캐나다의 이미 인상적인 산업 역량을 향상시켰으므로 이 특정 분야에 대해 어느 정도 전문 지식을 갖고 있다고 주장할 수 있습니다."
 CAN_Focus_On_Political_Spectrum: "정치 중점"
 CAN_Focus_On_Political_Spectrum_desc: "캐나다의 정치사 전반에 걸쳐 자유주의적이고 평등주의적이며 온건한 가치가 지배해 왔습니다. 그러나 전 세계에서 포퓰리즘 세력이 꿈틀대기 시작하고 신흥 강국들이 냉전 종식 이래 국제 질서를 이끌어 온 자유주의적 합의를 바꾸려 하는 지금, 이 전통은 유지될 수 있을까요?"
 CAN_Ministry_Of_Culture: "문화부"
 CAN_Ministry_Of_Culture_desc: "캐나다 문화유산부는 캐나다 문화의 보존과 증진을 담당하는 캐나다 정부 부처입니다."
 CAN_Two_Language_State: "이언어 국가"
 CAN_Two_Language_State_desc: "캐나다는 언제나 영어와 프랑스어가 동등한 지위를 공유하는 나라였으며, 앞으로도 그러할 것입니다."
 CAN_maintain_the_status_quo: "현상 유지"
 CAN_maintain_the_status_quo_desc: "이중 언어주의는 캐나다 헌법에 명시되어 있으며, 국가의 통합을 보장하는 근간입니다."
 CAN_crush_anti_quebecois_movements: "반-퀘벡 운동 진압"
 CAN_crush_anti_quebecois_movements_desc: "퀘벡 사람들은 캐나다 영어권 언론의 퀘벡에 대한 부정적 묘사로 인해 점점 더 소외감을 느껴 왔습니다. 퀘벡 시민들이 이 나라에서 계속 환영받는다고 느끼도록 이러한 \\"퀘벡 때리기\\"를 막아야 합니다."
 CAN_educational_focuses: "캐나다 교육 개선"
 CAN_educational_focuses_desc: "캐나다의 영어권 시민과 프랑스어권 시민 사이의 간극을 줄이기 위해, 어린 시절부터 공동의 정체성을 키울 수 있도록 국가 교육 제도에 투자해야 합니다."
 CAN_restore_quebec_to_glory: "퀘백의 영광을 되찾아라"
 CAN_restore_quebec_to_glory_desc: "누벨프랑스가 영국에 정복되기 전에는 아메리카에서 프랑스 문화와 영향력의 인상적인 전초 기지였습니다. 퀘벡이 이 자랑스러운 유산을 계승할 것입니다."
 CAN_redraft_langauge_laws: "언어법 개정"
 CAN_redraft_langauge_laws_desc: "우리의 현행 언어법은 이중 언어를 쓰는 우리나라의 본질을 제대로 반영하도록 개정되어야 합니다."
 CAN_multi_language_forces: "다국어 국가"
 CAN_multi_language_forces_desc: "더 이상 우리나라는 서로 다른 언어를 사용하는 두 개의 분리된 부분이 되지 않을 것입니다. 대신 우리는 진정으로 통합된 다국어 국가를 만들기 위해 노력해야 합니다."
 CAN_a_nation_of_culture: "문화적 중심지"
 CAN_a_nation_of_culture_desc: "몬트리올은 오랫동안 \\"캐나다의 문화 수도\\"로 여겨져 왔습니다. 이 도시가 계속 캐나다 문화의 보루로 남을 수 있도록 필요한 모든 것을 제공해야 합니다."
 CAN_reoriented_vision: "군대의 목적과 비전의 변화"
 CAN_reoriented_vision_desc: "캐나다군은 우리가 건설하고자 하는 새로운 캐나다의 국민을 가장 잘 대변하기 위해 새로운 근본 비전이 필요합니다."
 CAN_a_nation_of_diversity: "다양성이 공존하는 국가"
 CAN_a_nation_of_diversity_desc: "오늘날의 캐나다에서는 다름이 조롱받지 않고 존중받습니다. 어떤 언어를 쓰든 모든 진정한 캐나다인은 이곳에서 환영받는다고 느낄 수 있습니다."
 CAN_federal_reorganization: "연방 조직 개편"
 CAN_federal_reorganization_desc: "주에 부여된 권한을 재분배함으로써 퀘벡 독립에 대한 요구를 더욱 줄일 수 있습니다."
 CAN_the_new_order: "새로운 캐나다"
 CAN_the_new_order_desc: "우리의 노력으로 우리는 새로운 캐나다를 건설했으며, 이 나라는 내부의 다양성과 화해함으로써 더욱 강해졌습니다."
 CAN_One_Language_State: "단일어 국가"
 CAN_One_Language_State_desc: "캐나다의 현행 이중 언어주의는 불안정과 결국에는 재앙으로 가는 지름길입니다. 한 언어가 다른 언어를 이겨야 합니다."
 CAN_French_Government: "프랑스어를 사용하는 정부"
 CAN_French_Government_desc: "너무 오랫동안 캐나다의 프랑스어권 국민은 오만한 영어권 사촌들에게 밀려나고 억눌려 왔습니다. 가자, 시민들이여! 캐나다의 미래는 프랑스어권에 있다!"
 CAN_Glorification_Of_Quebec: "퀘벡 선전"
 CAN_Glorification_Of_Quebec_desc: "누벨프랑스의 유산을 이어받은 계승자로서, 퀘벡의 역사와 문화는 캐나다 국가 정체성에서 마땅히 자랑스러운 자리를 차지해야 합니다."
 CAN_English_Government: "영어를 사용하는 정부"
 CAN_English_Government_desc: "캐나다 내의 체제 전복적인 프랑스어권 세력은 너무 오랫동안 우리의 눈엣가시였습니다. 이제 우리 선대가 의존해 온 이중 언어주의라는 허울을 벗어던지고 캐나다의 영어권 정체성을 받아들일 때입니다."
 CAN_Integration_Of_Quebec: "퀘벡 통합"
 CAN_Integration_Of_Quebec_desc: "퀘벡은 나머지 국가에 순응해야 합니다. 이 제멋대로인 주의 완전한 통합을 이루기 위해 개혁에 착수해야 합니다."
 CAN_Address_Native_Question: "토착민 문제 제기"
 CAN_Address_Native_Question_desc: "원주민 퍼스트 네이션은 캐나다의 토착민이며, 오래전부터 차별, 열악한 사회경제적 여건, 원주민 토지권에 대한 존중 부족을 호소해 왔습니다."
 CAN_Continue_Societal_Integration: "사회 통합 지속"
 CAN_Continue_Societal_Integration_desc: "퍼스트 네이션 사람들은 현재 실업과 건강 문제를 비롯한 수많은 문제로 고통받고 있으며, 그 생활 수준은 아이티와 같은 개발도상국과 맞먹습니다. 우리는 이러한 불평등을 바로잡고 캐나다 원주민의 생활 수준을 개선하기 위해 할 수 있는 모든 일을 해야 합니다."
 CAN_Native_Peoples_Act: "토착민 법"
 CAN_Native_Peoples_Act_desc: "퍼스트 네이션의 문화를 존중하고 차별을 방지하는 새로운 입법은 원주민들에게 오늘날의 캐나다에서 환영받고 있음을 보여 주는 데 큰 역할을 할 것입니다."
 CAN_Focus_On_Canada: "캐나다 중점"
 CAN_Focus_On_Canada_desc: "점점 혼란스러워지는 세계에서 우리는 우리 자신의 이익을 챙겨야 합니다. 결국 우리가 아니면 누가 캐나다를 지키겠습니까?"
 CAN_Canada_First: "캐나다 제일주의"
 CAN_Canada_First_desc: "국제 사회의 사건들은 우리가 신경쓸 일이 아닙니다. 캐나다의 국민들만이 우리의 최대이자 유일한 지원을 받을 자격이 있습니다. "
 CAN_NA_Proposal: "북아메리카 제안서"
 CAN_NA_Proposal_desc: "대외 문제에 몰두해서는 안 되지만, 캐나다의 지리적 위치를 부정할 수는 없습니다. 우리가 세계로부터 등을 돌리더라도 이웃 나라와의 관계가 위태로워지지 않을 것임을 안심시켜야 합니다."
 CAN_Stand_Alone: "홀로서기"
 CAN_Stand_Alone_desc: "NATO를 통해 우리를 유럽에 묶어 둔 족쇄를 벗어던질 때가 왔습니다. 캐나다는 우리 해안에서 멀리 떨어진 나라들의 안보 이익에 얽매이기를 거부합니다."
 CAN_strength_at_home: "자국의 힘"
 CAN_strength_at_home_desc: "자립도를 높이기 위해 우리 자신의 경제 역량에 투자해야 합니다."
 CAN_a_neutral_rhetoric: "중립적인 마무리"
 CAN_a_neutral_rhetoric_desc: "냉전 이후의 시대가 한때 많은 이들이 믿었던 것만큼 단극 체제가 아니라는 사실이 점점 분명해지고 있습니다. 격화되는 강대국 간 경쟁에 휘말리지 않도록 캐나다의 중립을 천명하기 시작해야 합니다."
 CAN_shred_the_constitution_act: "헌법 조항 폐쇄"
 CAN_shred_the_constitution_act_desc: "헌법 제35조는 원주민에게 특별한 권리와 보호를 부여합니다. 퍼스트 네이션과 관련된 사회 문제를 완전히 해결하려면 이 권리들을 박탈해야 합니다."
 CAN_destroy_reservations: "원주민 보호구역 파괴"
 CAN_destroy_reservations_desc: "수십만 달러의 정부 투자를 받았음에도 이른바 \\"인디언 보호구역\\"은 비참한 상태에 놓여 있습니다. 우리에게는 이를 영구적으로 폐쇄하는 것 외에 선택의 여지가 없습니다."
 CAN_discredit_western_identitiy: "서방 세계의 정체성에 대한 의문"
 CAN_discredit_western_identitiy_desc: "우리 캐나다인은 더 이상 \\"서방\\"과 동일시되어서는 안 됩니다. 지리적 위치와 연관되었다는 이 모호하고 무의미한 개념은 우리를 아무런 쓸모도 없는 미국·유럽 중심의 외교 정책으로 몰아넣습니다."
 CAN_end_foriegn_entanglment: "End Foreign Entanglement"
 CAN_end_foriegn_entanglment_desc: "캐나다의 해외 개입은 무의미하고 비용만 많이 듭니다. 우리는 물러나 국내 여건을 개선하는 데 집중해야 합니다."
 CAN_military_autarky: "군사 자립정책"
 CAN_military_autarky_desc: "우리 군은 현재 과거의 \\"동맹국\\"들에 지나치게 의존하고 있습니다. 전쟁이 발발했을 때 우리 자신 외에는 누구에게도 의존할 필요가 없도록 우리 자체의 역량을 키워야 합니다."
 CAN_a_redefinition: "재정립"
 CAN_a_redefinition_desc: "새로운 외교 정책에 온전히 전념하려면 캐나다의 정체성이 근본적으로 재정립되어야 합니다."
 CAN_canadian_isolationism: "Canadian Isolationism"
 CAN_canadian_isolationism_desc: "한때 국경 남쪽의 이웃이 그랬던 것처럼, 우리도 세계의 수많은 문제에서 손을 떼고 시선을 안으로 돌려야 합니다."
 CAN_revised_foreign_policy: "외교 정책 개정"
 CAN_revised_foreign_policy_desc: "캐나다의 영구 중립을 선언할 때가 왔습니다. 우리는 더 이상 다른 국가의 지정학적 게임에서 볼모가 되지 않을 것입니다."
 CAN_industrial_might: "산업력"
 CAN_industrial_might_desc: "이제 우리는 캐나다의 이익을 최우선으로 선택했기 때문에 캐나다를 경제 강국으로 만드는 데 집중할 수 있습니다."
 CAN_bureaucracy: "관료제"
 CAN_bureaucracy_desc: "캐나다와 같은 거대한 나라를 효과적으로 통치하려면 그에 못지않게 거대한 관료제가 필요합니다."
 CAN_domestic: "국가적 독립"
 CAN_domestic_desc: "캐나다 국경 안의 외국 이익 집단은 계속해서 우려스러운 문제입니다. 이러한 외국 세력이 우리 정부 정책에 영향력을 행사하지 못하도록 해야 합니다."
 CAN_redistribution_of_balance: "재조정된 예산"
 CAN_redistribution_of_balance_desc: "국제적 책무를 줄인 덕분에 이제 국내 지출 프로그램에 더 많은 자금을 투입할 여력이 생겼습니다."
 CAN_tax_cuts: "감세"
 CAN_tax_cuts_desc: "국제적 발자취가 줄어든 만큼 더 이상 캐나다 국민에게 예전만큼 세금을 부과할 필요가 없습니다."
 CAN_State_Of_Terror: "테러 국가"
 CAN_State_Of_Terror_desc: "퍼스트 네이션에 대한 우리의 논란 많은 정책이 벌집을 건드리고 말았습니다. 이러한 불안정은 한때 온건하고 안정적이던 나라에 불안감을 고조시켰습니다."
 CAN_Western_Shift: "서부로 수도 이전"
 CAN_Western_Shift_desc: "최근의 국제적 변화를 활용하여 서방이 주도하는 자유주의적 국제 질서에 대한 우리의 헌신을 거듭 천명해야 합니다."
 CAN_Strengthen_Ties_With_Nato: "NATO와의 관계 증진"
 CAN_Strengthen_Ties_With_Nato_desc: "NATO가 국제 안보의 없어서는 안 될 기둥이라는 것이 캐나다의 변함없는 입장입니다."
 CAN_European_Investments: "유럽의 투자"
 CAN_European_Investments_desc: "우리와 유럽 파트너들 사이의 우정의 유대는 후한 투자자들이 대는 반가운 자금으로 한층 수월해질 수 있습니다."
 CAN_Propose_NAFTA_Improvements: "NAFTA 개선 제의"
 CAN_Propose_NAFTA_Improvements_desc: "NAFTA는 북미 이웃 국가와의 관계를 위한 견고한 기반이지만 항상 개선의 여지가 있습니다."
 CAN_US_Investments: "미국의 투자"
 CAN_US_Investments_desc: "남쪽의 경제 대국은 우리나라 경제를 지탱하는 데 도움이 될 완벽한 투자처입니다."
 CAN_Strengthen_Position_In_Nato: "NATO에서의 발의권 증대"
 CAN_Strengthen_Position_In_Nato_desc: "지금까지 캐나다는 NATO에서 대체로 뒷자리에 앉아 동맹국들이 주도하도록 내버려 두었습니다. 캐나다가 동맹에 훨씬 더 많은 것을 줄 수 있음을 보여 주어야 합니다."
 CAN_nato_exercises: "NATO 합동 훈련"
 CAN_nato_exercises_desc: "장차 있을 분쟁에 대비하는 방법으로 NATO 회원국 간의 합동 훈련을 요청해야 합니다."
 CAN_greater_military_cooperation: "대규모 군사 협력"
 CAN_greater_military_cooperation_desc: "캐나다가 NATO에 더 실질적인 기여를 하도록 보장하기 위해 우리 자체의 군대를 강화해야 합니다."
 CAN_investments_in_nato: "나토에 투자"
 CAN_investments_in_nato_desc: "NATO가 계속 유의미하고 효과적으로 남을 수 있도록 자원을 정기적으로 투입하지 않으면 NATO는 정체되다가 결국 쇠퇴할 것입니다."
 CAN_reinforce_western_ideals: "서방 이념 강화"
 CAN_reinforce_western_ideals_desc: "서방 이념은 언제나 캐나다의 기반이 되었습니다. 우리는 무엇이 캐나다인의 정체성을 의미하는지 다시 한번 기억해야합니다."
 CAN_study_american_war_doctrine: "미국 전쟁 교리 연구"
 CAN_study_american_war_doctrine_desc: "미국의 방대한 실전 경험은 그들이 얻은 교훈을 참고하여 우리가 활용해야 할 자산입니다."
 CAN_canadian_peacekeepers: "캐나다 평화유지군"
 CAN_canadian_peacekeepers_desc: "중견국인 캐나다는 언제나 국제연합과 같은 국제적 노력에 열정적으로 참여해 왔습니다. 국제 질서에 대한 우리의 헌신을 보여 주기 위해 UN 평화유지 작전에 대한 약속을 강화해야 합니다."
 CAN_support_the_mutual_defense: "상호방위조약 지지"
 CAN_support_the_mutual_defense_desc: "NATO 조약 제5조는 한 나라에 대한 공격이 모두에 대한 공격이라고 규정합니다. 이러한 상호 방위 약속에 대한 신뢰가 흔들리지 않도록 해야 합니다."
 CAN_draw_in_mexico: "멕시코와의 우호"
 CAN_draw_in_mexico_desc: "대서양 및 북미 국가인 멕시코는 NATO의 추가 확장에 적합한 파트너입니다."
 CAN_Eastern_Shift: "동부로 수도 이전"
 CAN_Eastern_Shift_desc: "캐나다는 오랫동안 미국과 서유럽의 충실한 친구였습니다. 그런데 그 대가가 무엇입니까? 냉전 시대의 이념적 적대감에서 자유로운 부활한 러시아와 부상하는 중국은 캐나다에 줄 것이 많습니다."
 CAN_Russian_Cooperationism: "러시아와의 협력"
 CAN_Russian_Cooperationism_desc: "화석 연료가 풍부한 같은 북극 국가로서 러시아는 앞으로 우리나라에 적합한 파트너입니다."
 CAN_Chinese_Agreements: "중국과의 협정"
 CAN_Chinese_Agreements_desc: "중국의 부상은 피할 수 없습니다. 따라서 가능한 한 일찍 중국의 방대한 시장과 금융 자산으로부터 최대한 이익을 얻어야 합니다."
 CAN_Investments_From_East: "동부 투자"
 CAN_Investments_From_East_desc: "러시아와 중국의 자금은 캐나다가 신흥 강국들과 보조를 맞추도록 보장하고 우리나라의 경제 성장을 이끄는 데 도움이 될 것입니다."
 CAN_Expand_Arctic_Routes: "북극해로 확장"
 CAN_Expand_Arctic_Routes_desc: "다른 북극 국가들의 협력을 확보했으니, 이제 확장된 북극 해운 항로의 혜택을 누릴 수 있습니다."
 CAN_Russo_Canadian_Trade_Agreement: "러시아-캐나다 무역협정"
 CAN_Russo_Canadian_Trade_Agreement_desc: "캐나다와 러시아 연방 간의 무역은 우리 화석 연료 채굴 산업의 성장을 촉진하는 데 도움이 될 것입니다."
 CAN_China_Canada_Commerce_Council: "중국 - 캐나다 상업 위원회"
 CAN_China_Canada_Commerce_Council_desc: "캐나다와 중국 간의 상업적 교류를 촉진하는 위원회를 설립함으로써 양국 기업의 사업 편의성을 크게 개선할 수 있습니다."
 CAN_Russo_Chinese_Canadian_Sphere: "러시아-중국-캐나다 협력체"
 CAN_Russo_Chinese_Canadian_Sphere_desc: "러시아, 중국과의 교류를 통해 세 대륙에 걸쳐 공동 이익권이 형성되고 있다는 점이 갈수록 분명해지고 있습니다. 우리는 이 권역의 출현을 인정하고 공고히 해야 합니다."
 CAN_Canadian_Armed_Forces: "캐나다군"
 CAN_Canadian_Armed_Forces_desc: "캐나다군은 캐나다 본토 방어, 북미 대륙 방어, 국제 안보라는 세 가지 주요 목표를 수행합니다. 이 세 가지 목표를 달성하기 위해서는 우리 군이 필요한 지원을 받아야 합니다."
 CAN_the_infantry: "보병 개선"
 CAN_the_infantry_desc: "우리는 보병의 전투 능력을 향상하는 데 집중해야 합니다."
 CAN_new_rifles: "신형 소총"
 CAN_new_rifles_desc: "보병은 모든 군대에서 가장 중요한 부분이므로, 최신이자 최고의 기술을 갖추도록 해야 합니다."
 CAN_new_manufacturers: "새로운 제조업체"
 CAN_new_manufacturers_desc: "우리의 새로운 장비 라인을 생산할 새롭고 더 효율적인 무기 제조업체를 찾아야 합니다."
 CAN_manufacturer_companys: "러시아 군사 지원"
 CAN_manufacturer_companys_desc: "러시아인들은 우리 군에 필요한 제식 소총을 공급할 수 있는 유력한 후보임을 입증했습니다."
 CAN_manufacturer_companys_2: "미국 무기 체계"
 CAN_manufacturer_companys_2_desc: "항상 함께 가는 두 가지, 총과 더 큰 총입니다. 그들이 우리에게 최고의 제식 소총을 제공할 것입니다."
 CAN_rcaf: "Royal Canadian Air Force"
 CAN_rcaf_desc: "하늘을 지배하는 자가 전장을 지배합니다. 전장에서 우리의 힘을 행사하려면 공군을 크게 개선해야 합니다."
 CAN_navy: "캐나다 왕립해군"
 CAN_navy_desc: "대양 해군만이 의미 있는 차이를 만들어 냅니다. 우리는 그러한 유능한 해군을 창설하는 데 자원을 돌려야 합니다."
 CAN_navy_carrier: "떠다니는 비행장"
 CAN_navy_carrier_desc: "항공모함은 모든 해군의 핵심 기술로, 본국에서 멀리 떨어진 곳에서의 대규모 군사 작전을 가능하게 합니다. 자체 항공모함을 보유하면 전장에서 우리가 훨씬 더 강력해질 것입니다."
 CAN_air_focus: "전투기 모델"
 CAN_air_focus_desc: "낡고 구식인 전투기를 대체할 새로운 전투기 모델에 투자해야 합니다."
 CAN_air_model_us: "미국식 설계"
 CAN_air_model_us_desc: "우리는 미국에 손을 내밀어 새로운 전투기를 함께 개발할 것입니다."
 CAN_air_model_uk: "영국식 설계"
 CAN_air_model_uk_desc: "우리는 새로운 제트기 개발에 영국의 지원을 요청할 것입니다."
 CAN_air_factories: "항공기 공장"
 CAN_air_factories_desc: "우리의 새로운 항공기 라인을 생산하기 위해 새로운 시설에 투자해야 합니다."
 CAN_new_helicopters: "신형 헬리콥터"
 CAN_new_helicopters_desc: "우리는 새로운 수송 및 공격 헬리콥터 라인의 연구개발에 착수할 것입니다."
 CAN_international_wargames: "전쟁 대회 주최"
 CAN_international_wargames_desc: "워게임은 군사 계획과 전략을 최신 상태로 유지하는 데 중요한 역할을 합니다. 동맹국을 합동 워게임에 초청하면 우리의 기량을 더욱 발전시킬 수 있습니다."
 CAN_destroyers: "구축함"
 CAN_destroyers_desc: "구축함은 모든 해군의 근간이며, 많이 보유할수록 해상에서의 우리 우위도 더욱 강해질 것입니다."
 CAN_ship_training: "해군 훈련"
 CAN_ship_training_desc: "우리는 새로운 함선의 능력을 향상하기 위해 대규모 해상 훈련을 실시할 것입니다."
 CAN_naval_aircraft: "Air Support Anywhere"
 CAN_naval_aircraft_desc: "항공모함은 우리가 세계 어디에 있든 항공 지원을 받을 수 있게 해 줍니다. 이를 우리에게 유리하게 활용해야 합니다."
 CAN_naval_doctrines: "재평가된 해군 전략"
 CAN_naval_doctrines_desc: "애로사항을 막기 위해 우리는 새로운 장비들의 전략을 조정해야만 합니다."
 CAN_naval_dockyards: "핼리팩스 조선소"
 CAN_naval_dockyards_desc: "우리는 핼리팩스에 조선소를 지을 것 입니다."
 CAN_bluewater: "대양해군 (A Bluewater Navy)"
 CAN_bluewater_desc: "대양 해군의 창설로 우리는 원하는 곳이면 어디서든 자유롭게 해군력을 행사할 수 있게 되었습니다."
 CAN_rus_training: "시베리아 훈련 대회"
 CAN_rus_training_desc: "캐나다와 러시아는 모두 추운 기후에서 싸우고 살아남는 데 능숙한 나라입니다. 우리는 기량을 더욱 향상하고 새로운 동맹을 강화하기 위해 시베리아에서 러시아군과 합동 훈련에 참가할 것입니다."
 CAN_chinese_industry: "캐나다-중국 산업 협력 (CCID)"
 CAN_chinese_industry_desc: "캐나다-중국 산업 협력 (CCID)은 양 국가 모두의 산업 발전을 위하여 캐나다와 중국 간 맺어진 합동 프로젝트입니다."
 CAN_chinese_lavs: "중국 군사 설비"
 CAN_chinese_lavs_desc: "중국은 성장하는 우리 군을 위한 군수 산업을 발전시키는 데 도움을 줄 것입니다."
 CAN_rus_dockyards: "러시아 잠수함 설계"
 CAN_rus_dockyards_desc: "일부 최신 설계를 러시아의 것을 본떠 만들면 우리 잠수함이 북극권 안팎에서 더 효율적으로 작전할 수 있게 될 것입니다."
 CAN_bc_ports: "태평양 항구"
 CAN_bc_ports_desc: "서부의 항구들은 브리티시컬럼비아의 발전은 물론 우리 천연자원 산업에도 매우 중요합니다."
 CAN_naval_investments_desc: "러시아 덕분에 우리는 새로 얻은 기술적 전문성을 해군 강화에 활용할 수 있습니다."
 CAN_naval_investments2: "핼리팩스 조선소"
 CAN_naval_investments2_desc: "핼리팩스에는 캐나다 최대 규모의 조선 시설 중 하나가 있습니다. 필요한 자원을 투입하여 이 기존 시설을 개선할 수 있습니다."
 CAN_tank_facilities: "전차 생산"
 CAN_tank_facilities_desc: "중국의 지원으로 이제 우리 전차 생산 시설을 보강할 수 있습니다."
 CAN_heavy_industry: "캐나다-중국 산업 협력 (CCID) 프로젝트"
 CAN_heavy_industry_desc: "CCID의 지원으로 우리나라 공장들의 산업 생산량을 강화할 수 있습니다."
 CAN_national: "국가주의 쿠데타"
 CAN_national_desc: "민주 정부와 민족주의 정당들 사이의 긴장이 고조되면서 마침내 무언가가 터져 나왔습니다. 앞으로 이 사태는 어떻게 전개될까요?"
 CAN_global_influence: "내정"
 CAN_global_influence_desc: "이제 나라에 대한 통제력을 확보한 이상 내부 문제에 집중하여 지배력을 강화해야 합니다."
 CAN_regional_diplomacy: "지역 외교"
 CAN_regional_diplomacy_desc: "우리 앞에는 캐나다의 팽창을 위한 가능성으로 가득한 세계가 놓여 있습니다. 이러한 가능성을 무시하는 것은 어리석은 일일 것입니다."
 CAN_fortify_the_borders: "국경 요새화"
 CAN_fortify_the_borders_desc: "우리의 노력은 눈에 띄지 않고 넘어가지 않을 것입니다. 나라의 위대함을 확장하려는 우리의 노력에 대한 불가피한 반발에 대비해야 합니다."
 CAN_greenland: "그린란드 문제"
 CAN_greenland_desc: "덴마크의 그린란드 통치는 과거의 유물입니다. 이제 캐나다가 문턱에 놓인 이 유럽 식민지에 대한 지배력을 행사할 때입니다."
 CAN_dominate_america: "미국을 점령하라"
 CAN_dominate_america_desc: "너무 오랫동안 우리는 남부 이웃들에게 보조 바이올린을 연주해 왔습니다. 이제 우리가 북미 대륙의 패권국으로서 정당한 자리를 차지할 때가 왔습니다."
 CAN_opposition: "야당 탄압"
 CAN_opposition_desc: "우리 정부에 반대하는 자들은 반역자이자 범죄자에 불과합니다. 우리는 그들을 거리에서 몰아내 계속 늘어나는 수많은 교도소에 가둘 것입니다."
 CAN_nationlist_agenda: "국가주의 계획"
 CAN_nationlist_agenda_desc: "우리 통치에 대한 반대를 억누른 만큼, 이제 새 정부의 야심 찬 의제를 추진할 수 있습니다."
 CAN_destroy_charter: "헌법을 폐지하라"
 CAN_destroy_charter_desc: "이른바 \\"권리와 자유\\"에 관한 캐나다 헌장은 캐나다의 위대함을 가로막는 구속복에 불과합니다. 폐지되어야 합니다."
 CAN_french_schools: "프랑스어 학교"
 CAN_french_schools_desc: "이제부터 캐나다인들은 프랑스어로 교육받게 될 것입니다. 영어를 사용하는 캐나다는 더 이상 우리 언어를 부가적이고 중요하지 않은 언어로 생각하지 않을 것입니다."
 CAN_russian_military: "러시아 군사 전문가"
 CAN_russian_military_desc: "러시아는 세계에서 가장 효율적인 군대 중 하나를 보유하고 있습니다. 그들이 제공하는 전문성의 혜택을 보는 것이 현명할 것입니다."
 CAN_global_army: "국제적인 군대"
 CAN_global_army_desc: "새로운 동맹국들의 지원으로 캐나다군은 이제 전 세계에서 존경받고 두려움의 대상이 되었습니다."
 CAN_railway_projects: "대규모 철도 계획"
 CAN_railway_projects_desc: "중국인은 대규모 인프라 프로젝트에 자금을 조달하는 데 탁월합니다. 이제 양국 관계가 안정되었으니 우리는 야심찬 철도 건설 사업에 착수할 수 있게 되었습니다."
 CAN_industry_projects: "산업 촉진"
 CAN_industry_projects_desc: "대규모 중국 투자 덕분에 우리의 산업 역량은 기하급수적으로 성장하고 있습니다."
 CAN_global_companys: "다국적 기업"
 CAN_global_companys_desc: "세계화된 금융 체제에서 일자리, 투자, 세수를 가져오는 강력한 다국적 기업을 끌어들이는 것은 모든 정부의 가장 중요한 우선 과제 중 하나입니다."
 CAN_huawai: "Huawei"
 CAN_huawai_desc: "중국의 거대 기술 기업은 캐나다에 줄 것이 많습니다. \\"국가 안보\\" 우려를 제기하는 이들은 자기가 무슨 말을 하는지 전혀 모르고 있습니다."
 CAN_hyundai_desc: "현대는 소박한 출발에서 벗어나 세계에서 가장 크고 가장 앞선 자동차 제조사 중 하나로 성장했습니다."
 CAN_ak: "칼라시니코프"
 CAN_ak_desc: "러시아의 칼라시니코프 콘체른은 소형 화기 제조에 오랜 역사를 갖고 있습니다. 칼라시니코프가 세계에서 가장 흔한 화기인 데는 이유가 있습니다."
 CAN_weapons_expert: "특별 무기 제조"
 CAN_weapons_expert_desc: "칼라시니코프의 전문성은 소형 화기에만 그치지 않고, 우리 분대 단위의 능력을 강화하는 데 쓸 수 있는 다른 경무기에도 미칩니다."
 CAN_airburst_weapons: "공중폭발탄 발사기"
 CAN_airburst_weapons_desc: "공중 폭발 무기는 개별 병사가 엄폐물 뒤에 숨은 적에게 효과적으로 대응할 수 있게 해 주는 신흥 기술입니다."
 CAN_vehicle_industry: "차량화 기반 생산"
 CAN_vehicle_industry_desc: "With Hyundai's expertise we can improve upon the existing capabilities of our vehicle production industry."
 CAN_advanced_ultility_vehicle: "개선된 다용도 차량"
 CAN_advanced_ultility_vehicle_desc: "우리 병력은 이동 중에 자신을 보호해 줄 새로운 다목적 차량이 필요할 수 있습니다."
 CAN_sat_tech: "위성 기술"
 CAN_sat_tech_desc: "화웨이의 지원으로 캐나다의 위성을 새롭고 개선된 수준으로 끌어올릴 수 있습니다."
 CAN_advanced_radar: "발전된 레이더 시스템"
 CAN_advanced_radar_desc: "화웨이의 기술은 우리 병력에게 가능한 한 최고의 전장 상황 인식을 제공할 더 진보된 레이더 체계를 구축하려는 노력에 유용하게 쓰일 것입니다."
 CAN_secret_police_desc: "반대 의견을 억누르려는 우리의 노력에도 불구하고 국민 가운데 불순 분자들이 계속 존재하고 있습니다. 이러한 체제 전복 분자들을 뿌리 뽑기 위해 새로운 보안 기관을 설립해야 합니다."
 CAN_isolation: "캐나다 군국주의 계획"
 CAN_isolation_desc: "해외에 캐나다의 군사력을 투사하겠다는 새로운 약속으로 캐나다 국민의 불같은 기개를 달래야 합니다."
 CAN_expel_us: "군대 동원"
 CAN_expel_us_desc: "전쟁은 한 나라의 역사에서 불가피한 부분입니다. 다가오는 분쟁에 대비하도록 군대를 결집시켜야 합니다."
 CAN_iron_curtain: "디지털화된 철의 장막"
 CAN_iron_curtain_desc: "캐나다인들이 인터넷에서 대안적인 정보원에 계속 접근한다는 사실은 우리 정부의 권위를 훼손하고 있습니다. 국민을 나머지 세계의 위험한 영향으로부터 격리하기 위해 체계적인 디지털 검열을 도입해야 합니다."
 CAN_the_state: "국가 개혁"
 CAN_the_state_desc: "이제 우리는 우리 의제의 주요 부분을 달성했으며 캐나다를 새롭고 훨씬 더 강력한 국가로 성공적으로 변화시켰습니다."
 CAN_move_capital: "수도를 이전하라"
 CAN_move_capital_desc: "오타와는 더 이상 우리 국민과 문화를 무시하지 않을 것입니다. 퀘벡과 캐나다 전체가 퀘벡 시티에서 통치됩니다!"
 CAN_reclaim_canada: "프랑스령 캐나다"
 CAN_reclaim_canada_desc: "마침내, 캐나다는 프랑스의 소유가 될 것입니다!\n(Finalement, le Canada sera français!)"
 CAN_new_charter: "새로운 프랑스 헌법"
 CAN_new_charter_desc: "새로운 캐나다에는 새로운 헌장이 필요합니다."
 CAN_quebec_conscription: "퀘벡 징병"
 CAN_quebec_conscription_desc: "캐나다군의 인구 구성 불균형을 바로잡기 위해 퀘벡의 젊은이들을 징집해야 합니다. 캐나다를 프랑스어권 국가로 만들려는 우리의 노력에서 어떤 희생도 지나치지 않습니다."
 CAN_french_companies: "Encourage French Companies"
 CAN_french_companies_desc: "프랑스는 언제나 우리나라와 특별한 관계를 누릴 것입니다. 따라서 프랑스 기업에 우리 시장에 대한 우선 접근권을 주는 것은 당연한 일입니다."
 CAN_enforce_language: "단일어 정책 실시"
 CAN_enforce_language_desc: "한동안 우리는 프랑스어와 나란히 영어가 계속 존재하는 것을 용인해 왔습니다. 그러나 이러한 관용은 남용되고 오해되었으며, 이제 끝내야 합니다."
 CAN_tax_english_companies: "영어권 기업 세금 부과"
 CAN_tax_english_companies_desc: "영어권 캐나다 기업들은 여전히 막대한 영향력을 행사하고 있습니다. 그들의 위세를 꺾어야 합니다."
 CAN_new_sectors: "새로운 사업 기회"
 CAN_new_sectors_desc: "프랑스계 캐나다인 기업들이 번창하여 우리 경제의 정상에서 마땅한 자리를 차지할 수 있도록 특별한 기회를 주어야 합니다."
 CAN_nation_divided: "불꽃에 휩싸인 나라"
 CAN_nation_divided_desc: "캐나다를 프랑스어권 국가로 만들려는 우리의 노력이 예상만큼 순조롭지 않았음을 인정해야 합니다. 새로운 캐나다를 확고히 하려면 대중의 반발을 통제하고 새 국가의 초기 진통에서 관심을 돌리기 위해 국가 기구를 장악해야 합니다."
 CAN_french_industry: "새로운 산업 단지"
 CAN_french_industry_desc: "충분한 자원만 있다면 퀘벡은 언제나 캐나다의 산업 중심지가 될 잠재력을 지니고 있었습니다."
 CAN_discharge_generals: "영어권 장교 해임"
 CAN_discharge_generals_desc: "영어권 장군들은 군 내에서 부당한 영향력을 계속 행사하고 있습니다. 그 자리는 프랑스어권 장교들이 채우는 편이 낫다는 구실로 그들을 직위에서 해임해야 합니다."
 CAN_ccp_military: "퀘벡 군국주의"
 CAN_ccp_military_desc: "새로운 캐나다를 건설하려는 우리의 사업이 퀘벡인들의 민족주의 정서를 되살렸습니다. 이 에너지를 잘 활용해야 합니다."
 CAN_renewable_energy_projects: "재생 가능 에너지"
 CAN_renewable_energy_projects_desc: "화석 연료는 빠르게 과거의 유물이 되고 있습니다. 캐나다는 에너지 수요를 충족하기 위해 풍력, 태양광, 수력 발전으로 눈을 돌려야 합니다."
 CAN_forced_integration: "퀘벡의 정체성 파괴"
 CAN_forced_integration_desc: "퀘벡인들은 우리가 그들의 문화를 파괴하려 한다고 오랫동안 불평해 왔습니다. 차라리 그 비난대로 행동하여 퀘벡 분리주의에 생명을 불어넣는 독자적 정체성을 단번에 근절하는 편이 낫겠습니다."
 CAN_treaty_of_quebec: "퀘벡 조약"
 CAN_treaty_of_quebec_desc: "우리가 퀘벡인의 정체성을 파괴하려 한다는 두려움을 불식하도록 신중해야 합니다. 새로운 퀘벡 조약은 퀘벡인의 정치적 권리가 축소되었더라도 그들의 정체성에 대한 우리의 존중은 변함없음을 확약해 줄 것입니다."
 CAN_clean_energy: "청정에너지 조항"
 CAN_clean_energy_desc: "청정 에너지에 대한 우리의 의지를 문서로 남기고 야심 찬 새 입법을 추진해야 합니다."
 CAN_clean_vehicles: "전기자동차 조항"
 CAN_clean_vehicles_desc: "전기 자동차는 화석 연료 의존도를 줄이는 데 중요한 진전입니다. 이러한 차량의 생산자들이 비전기 경쟁자들과 경쟁하는 데 필요한 모든 정부 지원을 받도록 해야 합니다."
 CAN_co2_tax: "탄소세 (The Carbon Tax)"
 CAN_co2_tax_desc: "배출에 세금을 부과함으로써 오염을 일으키는 기업들이 앞으로의 캐나다 세대가 마실 공기를 오염시키지 못하게 막을 수 있습니다."
 CAN_carbon_negative: "탄소 네거티브 (Carbon Negative) 국가"
 CAN_carbon_negative_desc: "야심 찬 의제를 밀어붙인 결과, 이제 캐나다가 탄소 중립을 넘어 탄소 마이너스 국가임을 선언할 수 있습니다."
 CAN_increase_ship_production: "해군 수용량 증대"
 CAN_increase_ship_production_desc: "해군 연구를 더 많이 포함하도록 예산을 확대하면 어려움을 겪는 우리 해상 함대에 도움이 될 것입니다."
 CAN_nato_research: "NATO 합동 연구"
 CAN_nato_research_desc: "중국, 러시아에 뒤처지지 않으려면 NATO 회원국들이 집단적 전문성을 한데 모아 연구개발을 가속해야 합니다."
 CAN_economy: "세계의 캐나다"
 CAN_economy_desc: "캐나다는 전 세계 국가들과 긴밀히 협력하며 훌륭한 관계를 맺어 온 역사가 있습니다. 이 유산을 유지하고 계속 키워 나가는 것이 중요합니다!"
 CAN_economy_investments_global: "국제 투자"
 CAN_economy_investments_global_desc: "전 세계에는 투자와 경제 원조가 필요한 곳이 많습니다. 그들이 필요로 할 때 도움을 주는 나라가 캐나다가 되도록 합시다."
 CAN_project_canadian_influence: "캐나다 영향력 예상"
 CAN_project_canadian_influence_desc: "캐나다의 외교 정책은 종종 형제 국가인 미국을 따릅니다. 그러나 우리가 그 길에서 벗어나 더 가까운 나라들에 집중한 사례도 있습니다."
 CAN_align_to_belize: "벨리즈에 영향"
 CAN_align_to_belize_desc: "벨리즈는 유카탄 반도의 전략적 위치에 자리하여 멕시코만에 쉽게 접근할 수 있으며, 이 지역에서 부상하는 경제이기도 합니다."
 CAN_align_saint_kitts: "세인트 키츠에 영향"
 CAN_align_saint_kitts_desc: "세인트키츠는 캐나다가 좋은 관계와 무역 협정을 맺어 온 카리브 공동체(CARICOM)의 작은 나라입니다. 이러한 협력을 유지하는 것이 중요합니다."
 CAN_align_barbados: "바베이도스에 영향"
 CAN_align_barbados_desc: "바베이도스는 캐나다의 해외 직접 투자를 가장 많이 받는 나라 중 하나입니다. 두 나라의 관계는 흔히 긴밀한 무역과 정치·문화적 공생 관계입니다."
 CAN_align_grenada: "그레나다와의 제휴"
 CAN_align_dominica: "도미니카와의 제휴"
 CAN_align_dominica_desc: "도미니카가 1978년 독립한 이래, 우리는 도미니카와 긴밀한 외교 및 무역 관계를 누려 왔습니다."
 CAN_align_guyana: "기아나와의 제휴"
 CAN_align_guyana_desc: "캐나다와 가이아나는 영연방 공동 회원국이라는 점과 캐나다 내 상당한 가이아나 디아스포라 덕분에 긴밀한 관계를 누리고 있습니다."
 CAN_align_jamaica: "자메이카와의 제휴"
 CAN_align_jamaica_desc: "캐나다는 자메이카와 안보, 무역, 개발, 관광 등의 분야로 뻗어 나가는 긴밀하고 폭넓은 관계를 누리고 있습니다. 카리브 해에서 가장 큰 나라 중 하나인 자메이카는 더 많은 협력을 이어 가기에 적합한 파트너입니다."
 CAN_align_saint_lucia: "세인트루시아와의 제휴"
 CAN_align_saint_lucia_desc: "세인트루시아와의 오랜 상업적 유대를 토대로 이 나라와의 관계를 더욱 강화할 수 있습니다."
 CAN_align_suriname: "수리남과의 제휴"
 CAN_align_suriname_desc: "전 독일 식민지였던 수리남은 우리의 현존하는 영향력을 확장시킬 수 있는 국가입니다."
 CAN_align_st_vincent: "세인트 빈센트 그레나딘과의 제휴"
 CAN_align_st_vincent_desc: "우리는 무역과 국제기구 참여를 통해 이루어진 세인트빈센트와의 좋은 관계를 오랫동안 누려 왔습니다. 이 관계에는 여전히 성장하고 더 개선될 여지가 있습니다."
 CAN_align_trindad: "트리니다드 토바고와의 제휴"
 CAN_align_trindad_desc: "캐나다와 트리니다드토바고는 교육, 무역, 과학, 문화, 환경, 스포츠, 보건 등의 분야를 아우르는 오랜 관계를 맺고 있습니다. 트리니다드토바고가 카리브 해에서 가장 크고 가장 다변화된 경제이므로 우리의 무역 관계는 매우 수익성이 높고, 따라서 주목할 가치가 있습니다."
 CAN_align_cuba: "쿠바와의 제휴"
 CAN_align_cuba_desc: "미국과 쿠바의 관계가 긴장 상태임에도 캐나다는 카리브 해에서 인구가 가장 많은 이 나라와 단절 없는 외교 관계를 누려 왔습니다. 무역과 관광이 우리 관계의 토대이며, 이 관계는 더 많은 관심을 기울이면 이득을 볼 수 있습니다."
 CAN_align_haiti: "아이티와의 제휴"
 CAN_align_haiti_desc: "아메리카에서 유일한 독립 프랑스어권 국가들로서 캐나다와 아이티는 공통의 유대를 공유합니다. 아이티와의 관계는 개입과 원조 제공이 특징이었으나, 두 나라 사이에는 더 깊고 결실 있는 동반자 관계로 발전할 가능성이 있습니다."
 CAN_align_the_bahamas: "바하마와의 제휴"
 CAN_align_the_bahamas_desc: "바하마는 카리브 해에서 캐나다의 가장 큰 무역 상대 중 하나이며, 트리니다드토바고에 이어 이 지역에서 두 번째로 큰 수출 시장입니다. 이 카리브 국가와의 우정을 공고히 하기 위해 이 무역 관계와 상당한 인적 교류를 토대로 발전시켜야 합니다."
 CAN_strength_in_the_americas: "아메리카의 지배자"
 CAN_strength_in_the_americas_desc: "우리의 외교적 매력 공세를 통해 아메리카 지역에서 더욱 강력한 입지를 확보했습니다."
 CAN_align_the_americans: "미국에 영향"
 CAN_align_the_americans_desc: "남쪽 이웃과의 관계는 우리 외교 관계 중 가장 가깝고 중요한 관계 중 하나입니다. 우리가 곁에 둘 만한 가치가 있는 동맹임을 미국에 보여 주어야 합니다."
 CAN_europe_invest: "유럽에 투자"
 CAN_europe_invest_desc: "캐나다는 언제나 유럽 대륙과 긴밀한 관계를 누려 왔습니다. NATO와 같은 기구에서의 공동 회원 자격과 EU와의 교류를 토대로 유럽 대륙에 더 투자함으로써 관계를 발전시킬 수 있습니다."
 CAN_asia_invest: "아시아 투자"
 CAN_asia_invest_desc: "태평양 국가로서 캐나다가 신흥 아시아 경제들과 긴밀한 관계를 누리는 것은 당연한 일입니다."
 CAN_greece_invest: "그리스 계획"
 CAN_greece_invest_desc: "캐나다 내 대규모 그리스 디아스포라의 존재와 다양한 조약, 폭넓은 무역 관계는 두 나라 사이의 강력한 관계의 토대입니다. 그리스 경제에 대한 캐나다의 투자는 아테네의 우리 친구들에게 틀림없이 환영받을 것입니다."
 CAN_norway_invest: "노르웨이 계획"
 CAN_norway_invest_desc: "오랜 상호작용의 역사와 다양한 공통 이해관계를 지닌 중견국으로서 캐나다와 노르웨이는 긴밀한 동맹국입니다. 우리는 노르웨이 친구들에게 캐나다 투자의 형태로 도움을 제공함으로써 우리의 긴밀한 우정을 더욱 공고히 할 수 있습니다."
 CAN_estonian_invest: "에스토니아 계획"
 CAN_estonian_invest_desc: "1991년 에스토니아의 독립을 가장 먼저 승인한 나라 중 하나인 캐나다와 에스토니아는 NATO와 같은 기구의 틀을 통해 굳건한 우정을 계속 쌓아 왔습니다. 에스토니아는 금융 투자의 형태로 캐나다의 추가 지원을 받으면 도움이 될 수 있습니다."
 CAN_vietnam_invest: "베트남 계획"
 CAN_vietnam_invest_desc: "캐나다와 베트남은 프랑스 식민지 통치를 받았던 역사를 공유하며, 베트남 전쟁 당시 중립을 지키겠다는 캐나다의 결정 덕분에 양국 관계는 훼손되지 않았습니다. 오늘날 베트남은 활기차게 성장하는 경제이므로 투자하는 것이 현명할 것입니다."
 CAN_southkor_invest: "대한민국의 철도"
 CAN_southkor_invest_desc: "한국은 가난한 옛 식민지에서 세계에서 가장 앞선 경제 중 하나로 성장했습니다. 그들의 전문성에도 불구하고, 한국의 철도망에 투자하는 일에서는 캐나다가 여전히 제공할 것이 있습니다."
 CAN_indonesia_invest: "인도네시아 산업"
 CAN_indonesia_invest_desc: "캐나다는 아시아 최대 경제 중 하나의 발전을 오랫동안 지원해 왔습니다. 이 지역에서 가장 중요한 경제 강국 중 하나가 될 것이 확실한 이 나라에 계속 투자해야 합니다."
 CAN_mining: "캐나다 광업"
 CAN_mining_desc: "우리의 광업은 세계 최대 규모 중 하나로, 국가 GDP의 5%를 차지합니다."
 CAN_mining_expansion: "광산 확장"
 CAN_mining_expansion_desc: "광업을 확대하면 수출이 증가하고, 세수가 늘며, 특히 퍼스트 네이션에게 절실히 필요한 일자리를 제공할 수 있습니다."
 CAN_quebec_mines: "퀘벡 광산 확장"
 CAN_quebec_mines_desc: "퀘벡의 수많은 광산도 광업 개선 노력에서 제외되어서는 안 됩니다. 그러나 다른 주를 희생하며 퀘벡에 집중하면 지역 주민들을 달랠 수는 있어도 경제적 이득은 더 낮을 수 있습니다."
 CAN_quebec_steel: "퀘벡 철강 산업"
 CAN_quebec_steel_desc: "퀘벡산 강철의 품질이 전 세계에 알려질 것입니다!"
 CAN_quebec_aluminium: "퀘벡 알루미늄 산업"
 CAN_quebec_aluminium_desc: "퀘벡의 알루미늄 매장량은 개발할 때가 무르익은 경제 자원입니다."
 CAN_quebec_steel_exports: "퀘벡 철강 수출"
 CAN_quebec_steel_exports_desc: "퀘벡에서 채굴한 강철로 우리나라의 수출을 늘려 캐나다에 부와 위신을 가져올 수 있습니다."
 CAN_north_mines: "북부 광산 확장"
 CAN_north_mines_desc: "캐나다 북부는 차세대 광업 개척지로 간주되며 많은 유망한 기회를 보유하고 있습니다."
 CAN_north_tungsten: "북부 텅스텐 산업"
 CAN_north_tungsten_desc: "텅스텐 광산은 캐나다에서 가장 수익성이 높은 광산 중 하나이므로 현재 우리 노력의 중점이 되어야 합니다."
 CAN_north_steel: "북부 철강"
 CAN_north_steel_desc: "강철은 캐나다 북부에 풍부하게 매장된 중요한 자원입니다."
 CAN_north_steel_exports: "북부 철강 수출"
 CAN_north_steel_exports_desc: "채굴한 강철을 수출하면 캐나다 경제에 유용한 활력이 될 것입니다."
 CAN_mine_expert: "광업 전문가"
 CAN_mine_expert_desc: "광업을 개선하려는 노력을 통해 쌓은 지식 덕분에 우리는 이 특정 분야의 세계적 선두 주자가 되었습니다."
 CAN_mechanized: "기계화 중심"
 CAN_mechanized_desc: "새로운 기술이 발전했음에도 기계화는 여전히 현대전의 핵심이며 우리 군이 도입해야 합니다."
 CAN_infantry_focus: "Maintain Focus on the Infantry"
 CAN_infantry_focus_desc: "군대의 핵심은 언제나 개개의 병사입니다. 캐나다 보병은 믿음직하고 적응력이 뛰어나며 우리 군이 제공할 수 있는 최고의 전력입니다."
 CAN_specops: "엘리트 특수 작전 부대"
 CAN_specops_desc: "합동 임무 부대 2와 같은 캐나다 부대는 오늘날 세계에서 가장 정예인 특수 부대 중 하나로 널리 알려져 있습니다. 이 부대들에 현존하는 최고의 장비를 지급하도록 해야 합니다."
 CAN_recruits: "모병 캠페인"
 CAN_recruits_desc: "캐나다군은 더 많은 인력이 필요합니다. 신병 풀을 키우기 위해 모병 캠페인에 투자해야 합니다."
 CAN_profesional_army: "직업 군인"
 CAN_profesional_army_desc: "보병에 집중함으로써 우리 군은 세계에서 가장 존경받는 군대 중 하나가 되었습니다."
 CAN_tanks: "세계적 수준의 전차"
 CAN_tanks_desc: "전차는 모든 군대에서 막강한 전력이며, 캐나다도 예외가 아닐 것입니다."
 CAN_motorized: "기계화보병"
 CAN_motorized_desc: "기계화 보병 병력을 도입함으로써 우리 병사들은 전장에서 더 빠른 속도와 더 나은 방호를 누릴 것입니다."
 CAN_armed: "롤링 썬더 (Rolling Thunder)"
 CAN_armed_desc: "우리 장갑 차량의 맹공은 어떤 적도 보고 싶어 하지 않을 광경이 될 것입니다."
 CAN_nato_air: "Maintain NATO Doctrines"
 CAN_nato_air_desc: "공군을 이용해 지상 병력의 작전에 대한 항공 엄호를 제공함으로써 NATO의 정통 노선을 계속 따라야 합니다."
 CAN_nato_train: "합동 공군 훈련"
 CAN_nato_train_desc: "다른 NATO 회원국들과 함께라면 캐나다 공군은 공중전 숙련도에서 새로운 경지에 오를 수 있습니다."
 CAN_us_planes: "미국산 제트기"
 CAN_us_planes_desc: "미국의 전투기는 세계에서 가장 앞서 있습니다. 그들의 전문성을 활용하여 우리 항공기를 개선해야 합니다."
 CAN_new_doctrine: "새로운 교리"
 CAN_new_doctrine_desc: "NATO의 통념에서 벗어나 공중에서 싸우는 새로운 방식을 도입할 때가 왔습니다."
 CAN_russia_train: "러시아 훈련"
 CAN_russia_train_desc: "러시아 조종사들은 세계에서 가장 강력한 조종사들 중 하나입니다. 그들을 초청해 우리 조종사들에게 공중전의 정교한 기술을 훈련시켜야 합니다."
 CAN_russia_planes: "러시아 폭격기"
 CAN_russia_planes_desc: "폭격기 제조에 관한 러시아의 노하우는 우리 폭격기 함대를 개선하는 데 활용할 수 있습니다."
 CAN_air_force: "전문적인 공군 장교"
 CAN_air_force_desc: "공군을 개선하려는 우리의 노력은 사실상 어떤 적도 압도할 수 있는 항공기 함대로 결실을 맺었습니다."
 CAN_decimate_mexico: "멕시코의 최후"
 CAN_decimate_mexico_desc: "멕시코는 북미에 대한 궁극적인 통제권을 가로막고 있습니다. 그들은 분쇄되어야 한다!"
 CAN_national_companies_subsidies: "캐나다 정제 회사 보조금 지급"
 CAN_national_companies_subsidies_desc: "석유 기업에 보조금을 지급하는 것은 석유 생산에 이득이 될 뿐만 아니라, 세계 석유 시장에서 우리의 점유율을 확대하고 높이는 데에도 도움이 될 것입니다!"
 CAN_national_companies_subsidies1: "캐나다 정제 회사 보조금 지급"
 CAN_national_companies_subsidies1_desc: "석유 기업에 보조금을 지급하는 것은 석유 생산에 이득이 될 뿐만 아니라, 세계 석유 시장에서 우리의 점유율을 확대하고 높이는 데에도 도움이 될 것입니다!"
