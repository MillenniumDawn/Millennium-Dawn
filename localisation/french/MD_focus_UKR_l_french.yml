 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m: "Order the §YBTR-60M§! in Mykolayiv"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60m_for_tooltip\n\n\n\n\n\n\n\n\n§WHundreds of Soviet §YBTR-60PB§! still serve in our army. Their two gasoline engines are thirsty and catch fire easily. The Morozov design bureau in Kharkiv has designed the §YBTR-60M§!, where a single 300 hp UTD-20 diesel from the BMP-1 replaces them, while the original turret with its 14.5 mm KPVT stays. The §YMykolayiv Armored Plant§! is ready to build it.\n\nLater BTR-60 upgrades build on this variant.\n------------------\nThis Decision is a §Rprerequisite§! for the §YBTR-60MK§! decision. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete it.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission: "Last chance: §YBTR-60M§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_desc$\n\n§RThe plant withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach: "Choose the future of our §YBTR-60§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60_for_tooltip\n\n\n\n\n\n\n\n\n§WThe war in the east has shown that we still need every armored personnel carrier we have. The Ministry of Defence wants to decide how to keep our old BTR-60 in service. If we already have the §YBTR-60M§!, §YKORT§! can develop it further. §YNVK Techimpex§! offers a smaller upgrade that works on any BTR-60PB.\n------------------\nThis Decision is a §Rprerequisite§! for the §YBTR-60MK§! and §YBTR-60PB-T§! decisions. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete them.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission: "Deadline: the future of our §YBTR-60§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_approach_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_approach_desc$\n\n§RWhen the timer runs out, we have to choose anyway.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk: "Order the §YBTR-60MK§! from KORT"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60mk_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YKORT§! company builds on our §YBTR-60M§! work. Its §YBTR-60MK§! gets two Cummins diesels, add-on armor and larger side hatches for the troops. Later, the turret can give way to a Mykolayiv combat module with a 14.5 mm and a 7.62 mm machine gun and an AGS-17 grenade launcher.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission: "Last chance: §YBTR-60MK§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_kort_btr_60mk_desc$\n\n§RKORT withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t: "Order the §YBTR-60PB-T§! from Techimpex"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr60pb_t_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVK Techimpex§! offers the §YBTR-60PB-T§!. The old turret gives way to the BM-23-2 combat module, diesels replace the gasoline engines, and the engine cooling, the water jet drive and the electrical equipment are renewed.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission: "Last chance: §YBTR-60PB-T§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§RTechimpex withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech: "Develop the §YBTR-60PB-T§! with Techimpex"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_desc$\n\n§WWe have no unmanned turrets of our own yet, so §YNVK Techimpex§! has to develop the mount for the BM-23-2 from scratch. The work takes longer and costs more, but it gives us the technology.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission: "Last chance: §YBTR-60PB-T§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_mission_desc: "$ukraine_modernize_sov_equipment_btr_60_modernization_techimpex_btr_60pb_t_no_tech_desc$\n\n§RTechimpex withdraws the offer when the timer runs out.§!"
 ukraine_modernize_sov_equipment_btr_60_modernization_unmanned_turret_tt: "When the §YBTR-60PB-T§! is adopted, we also get the §YModern Battlestation And Auxiliaries§! technology, which unlocks the §YUnmanned Turret§!."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.name: "BTR-60M Ready"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.desc: "The Mykolayiv plant has finished the §YBTR-60M§!. One UTD-20 diesel now does the work of two gasoline engines, which cuts the fuel use and the fire risk, while the original turret keeps its 14.5 mm KPVT and 7.62 mm PKT. Other companies may build on this design in the future."
 ukraine_modernize_sov_equipment_btr_60_modernization.1.a: "Adopt the §YBTR-60M§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.1.b: "Put the project on hold"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.name: "The Future of Our BTR-60"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.desc: "The Ministry of Defence has two BTR-60 proposals on the table. §YKORT§! wants to develop our §YBTR-60M§! further with Cummins diesels, add-on armor and larger hatches. §YNVK Techimpex§! offers the §YBTR-60PB-T§!, which rearms the old vehicles and gives them diesel engines."
 ukraine_modernize_sov_equipment_btr_60_modernization.2.a: "Develop the §YBTR-60M§! further with KORT"
 ukraine_modernize_sov_equipment_btr_60_modernization.2.b: "Turn to the §YBTR-60PB-T§! from Techimpex"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.name: "The Future of Our BTR-60"
 ukraine_modernize_sov_equipment_btr_60_modernization.3.desc: "We never built the §YBTR-60M§!, so a deep upgrade of our BTR-60 would have to start from scratch. §YNVK Techimpex§! offers a smaller one instead: the §YBTR-60PB-T§! rearms the old vehicles and gives them diesel engines."
 ukraine_modernize_sov_equipment_btr_60_modernization.3.a: "Order the small upgrade from Techimpex"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.name: "BTR-60MK Ready"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.desc: "§YKORT§! has finished the §YBTR-60MK§! with two Cummins diesels, add-on armor and larger side hatches for the troops."
 ukraine_modernize_sov_equipment_btr_60_modernization.4.a: "Adopt the §YBTR-60MK§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.4.b: "Put the project on hold"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.name: "BTR-60PB-T Ready"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.desc: "§YNVK Techimpex§! has delivered the §YBTR-60PB-T§! with the BM-23-2 combat module, diesel engines and renewed cooling, water jet and electrical systems."
 ukraine_modernize_sov_equipment_btr_60_modernization.5.a: "Adopt the §YBTR-60PB-T§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.5.b: "Shelve the project"
 ukraine_modernize_sov_equipment_btr_60_modernization_btr_60m_unlocks_tt: "§YThe BTR-60M opens a later decision:§! the §YBTR-60MK§! from §YKORT§! can only be built on it."
