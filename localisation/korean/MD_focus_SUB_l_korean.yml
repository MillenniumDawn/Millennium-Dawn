 ural_event.1.t: "[URA.GetNameWithFlag] 투자"
 ural_event.1.d: "[URA.GetFlag]우랄 정부가 협력과 동반자 관계 발전을 위해 자신들의 지역에 대한 투자 협정을 체결할 것을 제안했습니다."
 ural_event.1.a: "물론이지"
 ural_event.1.b: "아니요"
 ural_event.2.t: "[FROM.GetNameWithFlag]의 투자"
 ural_event.2.d: "그들이 투자 협정에 대한 우리의 제안에 동의했습니다."
 ural_event.2.a: "알았다"
 ural_event.3.t: "[FROM.GetNameWithFlag]의 투자"
