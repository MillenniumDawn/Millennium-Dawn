 UKR_promote_russian_interests: "[SOV.GetFlag] 러시아의 이익 증진"
 UKR_promote_russian_interests_desc: "다음 선거에서 친러시아 블록의 인기를 높이기 위해 국내에서 [SOV.GetFlag] 러시아의 이익을 증진할 것입니다."
 UKR_promote_western_interests: "[USA.GetFlag] 서방의 이익 증진"
 UKR_promote_western_interests_desc: "다음 선거에서 친서방 블록의 인기를 높이기 위해 국내에서 [USA.GetFlag] 미국의 이익을 증진할 것입니다."
 UKR_dissolved_verkhovna: "의회를 해산하였음"
 UKR_get_50_buggies: "범용 차량 50대 조립"
 UKR_party_regions_start: "지역당"
 UKR_party_regions_start_desc: "야누코비치가 나라의 권력을 손에 넣었으니, 이제 지역들의 시대입니다!"
 UKR_party_regions_decrease: "행정 인력 감축"
 UKR_party_regions_decrease_desc: "국가 기구의 직원 수를 줄일 것입니다."
 UKR_party_regions_anti_corrupt: "국가반부패위원회"
 UKR_party_regions_anti_corrupt_desc: "우리나라의 부패 관리들에 맞서 싸우기 위해 국가반부패위원회라는 새로운 부처를 만들 것입니다."
 UKR_party_regions_unifed_window: "단일 창구 투자"
 UKR_party_regions_unifed_window_desc: "우리나라 투자자들을 위한 새로운 규정을 도입하여 당국과 더 쉽게 소통할 수 있게 할 것입니다."
 UKR_party_regions_decrease_agro: "농업 규제 완화"
 UKR_party_regions_decrease_agro_desc: "농업 산업이 새로운 혜택을 받게 되며, 이를 통해 생산성이 높아지기를 기대합니다."
 UKR_party_regions_laizes: "자유방임"
 UKR_party_regions_laizes_desc: "경제 정책에서 자유지상주의 원칙 가운데 하나를 부분적으로 채택하고 경제 과정에 개입하지 않을 것입니다."
 UKR_party_regions_taxx: "세법 개정"
 UKR_party_regions_taxx_desc: "필요하다고 판단되는 세법 개정을 단행할 것입니다. 우리의 양보로 지방세가 세 배 줄어들 것입니다!"
 UKR_party_regions_autocracy: "전제주의 강화"
 UKR_party_regions_autocracy_desc: "강력한 정부는 통제할 수 있는 모든 것을 통제해야 하며, 그렇지 않으면 우리 집권 이전에 있었던 혼돈과 무질서가 됩니다."
 UKR_party_regions_pressure_media: "언론 압박"
 UKR_party_regions_pressure_media_desc: "언론이 지나치게 자유로워졌으니 그 열기를 식힐 필요가 있습니다."
 UKR_party_regions_stability_reform: "안정과 개혁"
 UKR_party_regions_stability_reform_desc: "우리의 계획과 이념을 적극적으로 추진할 충성스러운 정치인 연립을 구성하고 이를 \\"안정과 개혁\\"이라 부를 것입니다."
 UKR_party_regions_stability_restricting_freedom_speech: "언론의 자유 제한"
 UKR_party_regions_stability_restricting_freedom_speech_desc: "언론의 자유는 우리를 불쾌하게 하기 시작하는 곳에서 끝납니다."
 UKR_party_regions_stability_purge_opposition: "정치적 야당 숙청 시도"
 UKR_party_regions_stability_purge_opposition_desc: "야당은 지나치게 제멋대로이며 자신들의 자유를 이용해 권력 기관을 훼손하고 있으니, 이를 바로잡을 때입니다."
 UKR_party_regions_lustration: "도지사단과 보안 기관의 정화"
 UKR_party_regions_lustration_desc: "이들 조직 내의 충성스럽지 않고 국가에 공공연히 해로운 인물들을 정화하는 일은 오래전부터 필요하였습니다."
 UKR_party_regions_agreement_opposition: "야당과의 합의"
 UKR_party_regions_agreement_opposition_desc: "야당의 일부와 관계를 맺어 야당을 분열시키려 시도할 것입니다."
 UKR_party_regions_appease_the_westermists: "서구주의자 달래기"
 UKR_party_regions_appease_the_westermists_desc: "서부 우크라이나는 오랫동안 불만과 불안정의 온상이었으니 이들을 달래겠습니다. 그들이 원하는 것, 즉 약속을 주도록 하겠습니다."
 UKR_party_regions_request_russian: "러시아 투자 요청"
 UKR_party_regions_request_russian_desc: "러시아의 투자를 요청할 것입니다. 분명 쓸모없지 않을 것입니다."
 UKR_party_regions_personal_gain: "개인 이득 추구"
 UKR_party_regions_personal_gain_desc: "나라도 물론 중요하지만 자기 자신도 생각해 볼 만합니다."
 UKR_party_regions_titushki: "티투시키 동원"
 UKR_party_regions_titushki_desc: "야당 집회의 신뢰를 떨어뜨리는 새로운 방법인 티투시키를 사용할 것입니다."
 UKR_party_regions_regional_council: "지방 협의회"
 UKR_party_regions_regional_council_desc: "지방과 국가 당국 간의 상호작용을 원활히 하기 위해 지방 협의회라는 새로운 기구를 도입할 것입니다."
 UKR_party_regions_optimise_east_ukraine_gamble: "동부 우크라이나 도박"
 UKR_party_regions_optimise_east_ukraine_gamble_desc: "동부 우크라이나는 언제나 우리의 세습 영지였습니다. 사실상 그들이 우리의 주요 유권자이므로 적극적으로 그들의 지지를 얻으려 할 것입니다."
 UKR_party_regions_optimise_prior_loyals: "충성파 우선"
 UKR_party_regions_optimise_prior_loyals_desc: "우리에게 충성하는 사람들이 훨씬 더 중요하므로 적극적으로 이들을 승진시킬 것입니다."
 UKR_party_regions_western_oligarch: "서부 과두 재벌 접근"
 UKR_party_regions_western_oligarch_desc: "서부 우크라이나의 과두 재벌들이 우리의 우선순위가 될 것입니다. 서부와 동부 사이의 균형을 찾고자 하며, 어쩌면 그들의 과두 재벌들이 도움이 될 것입니다."
 UKR_party_regions_meet_akhmetov: "아흐메토프와의 면담"
 UKR_party_regions_meet_akhmetov_desc: "도네츠크 과두 재벌 가문과 그 대표 리나트 아흐메토프는 우리가 권력을 유지하는 데 활용하는 중요한 정치적 자원이므로 그의 말에 귀를 기울일 만합니다."
 UKR_party_regions_informational_act: "정보 공개법"
 UKR_party_regions_informational_act_desc: "새로운 법은 정치인들의 활동에 대한 접근을 대중에게 개방하여 그들의 활동에서 부패 요소를 줄일 것입니다."
 UKR_party_regions_optimise_ministries: "부처 최적화"
 UKR_party_regions_optimise_ministries_desc: "정부 조직이 지나치게 비대해졌으니 줄일 때입니다."
 UKR_party_regions_reform_constituion: "헌법 개정"
 UKR_party_regions_reform_constituion_desc: "헌법 개정을 적극적으로 추진할 것입니다. 우리나라가 전면적인 변화를 향해 나아갈 때입니다!"
 UKR_party_regions_compulsory: "의무 복무제 개편"
 UKR_party_regions_compulsory_desc: "우리 군의 복무 제도를 바꾸어 말 그대로 계약제로 전환할 것입니다."
 UKR_party_regions_pension_reform: "연금 개혁"
 UKR_party_regions_pension_reform_desc: "연금 개혁은 오래전부터 준비되어 왔으며 이제 이를 시행할 것입니다."
 UKR_party_regions_kozhara: "코자라, 외무부 수장"
 UKR_party_regions_kozhara_desc: "우리의 친구이자 동반자 가운데 한 명을 외무장관에 임명할 것입니다."
 UKR_party_regions_youth_region: "청년 지역 조직 확대"
 UKR_party_regions_youth_region_desc: "우리 당의 청년 조직이 더 많은 권력과 영향력을 얻게 될 것이며, 그들에게 접근 권한을 열어 줄 것입니다."
 UKR_party_regions_berkut_reforms: "베르쿠트 개혁"
 UKR_party_regions_berkut_reforms_desc: "베르쿠트는 경찰 조직으로서 우리를 지킬 수 있도록 개혁이 필요합니다."
 UKR_party_regions_berkut_extreme_training: "베르쿠트 극한 훈련"
 UKR_party_regions_berkut_extreme_training_desc: "베르쿠트는 기량을 높이기 위해 경연과 훈련 과정을 더욱 활발히 실시할 것입니다."
 UKR_dual_language: "이중 언어 국가"
 UKR_dual_language_desc: "러시아어는 우크라이나 생활의 중요한 부분을 차지하고 있으며 이를 부정하는 것은 어리석은 일입니다. 우리나라에서 러시아어를 폐지하자는 어리석은 정치적 발상은 추진하지 않을 것입니다."
 UKR_cancel_decommunization: "탈공산화 반대"
 UKR_cancel_decommunization_desc: "우리가 파시즘과 나치즘에 맞서 싸웠던 소련의 과거와의 투쟁을 허용하지 않을 것입니다."
 UKR_donbass_autonomy_pass: "돈바스 특별 자치"
 UKR_donbass_autonomy_pass_desc: "돈바스는 우리나라의 특별한 지역이며, 이 지역의 특별 자치에 관한 논의를 시작할 때일지도 모릅니다."
 UKR_sng_integrate: "CIS 통합"
 UKR_sng_integrate_desc: "CIS 국가들 간 협력의 틀 안에서 통합 과정을 계속 이어 갈 것입니다."
 UKR_europe_negotiat: "EU 협상"
 UKR_europe_negotiat_desc: "오랫동안 우리 정치 의제에 올라 있던 문제인 유럽 연합과의 연합 협정에 관해 유럽 연합과 협상을 시작할 것입니다."
 UKR_russian_ukrainian_military_coop: "우크라이나-러시아 군사 협력"
 UKR_russian_ukrainian_military_coop_desc: "러시아군과의 협력을 강화할 것입니다."
 UKR_party_regions_european_chart: "유럽 언어 헌장"
 UKR_party_regions_european_chart_desc: "소수 민족에 대한 우리의 민주적 태도를 보여 주는 지표로서 유럽 지역 언어 헌장에 서명할 것입니다."
 UKR_parti_regions_anti_corruption_commitie: "국가반부패위원회"
 UKR_parti_regions_anti_corruption_commitie_desc: "새 위원회는 모든 수준의 부패 관리들에 맞서 싸우도록 설계되었습니다."
 UKR_parti_regions_invest_open_window: "단일 창구 투자"
 UKR_parti_regions_taxx: "개정된 세법"
 UKR_parti_regions_laizes: "자유방임"
 UKR_parti_regions_stability_reform: "안정과 개혁"
 UKR_parti_regions_lustration: "정화"
 UKR_parti_regions_opposition_agree: "야당과의 협력"
 UKR_parti_regions_titushki: "티투시키"
 UKR_parti_regions_optimise_ministers: "부처 최적화"
 UKR_parti_regions_inform_act: "정보 공개법"
 UKR_parti_regions_pension_reform: "연금 개혁"
 UKR_parti_regions_youth_regions: "청년 지역 조직"
 UKR_parti_regions_autocracy: "야누코비치의 전제주의"
 UKR_parti_regions_autocracy_desc: "야누코비치의 행태는 진정한 전제주의로 널리 불리게 되었지만, 그것이 국가의 이익을 위해 중요한 것일까요?"
 ukraine_regions.7.t: "우크라이나 투자"
 ukraine_regions.7.d: "우크라이나 대통령이 자국에 투자해 달라고 요청하였습니다. 그의 제안에 동의해야 하겠습니까?"
 ukraine_regions.7.a: "좋다"
 ukraine_regions.7.b: "안된다"
 ukraine_regions.8.t: "우크라이나 투자"
 ukraine_regions.8.d: "러시아가 우리나라에 투자하기로 동의하였습니다."
 ukraine_regions.8.a: "좋아"
 ukraine_regions.9.t: "우크라이나 투자"
 ukraine_regions.9.d: "러시아가 우리나라에 투자하기를 거부하였습니다."
 ukraine_regions.9.a: "슬프군"
 ukraine_regions.10.t: "CIS와의 협력"
 ukraine_regions.10.d: "우리는 최근 몇 년 동안 CIS 국가들과 적극적으로 협력하지 않았으며, 협력을 계속하겠다는 우리의 결정에 야당 성향의 일부 국민이 분노할 수도 있습니다. 그러나 이를 해야 할지 결정해야 합니다."
 ukraine_regions.10.a: "물론이지"
 ukraine_regions.10.b: "안된다"
 ukraine_regions.11.t: "EU와의 연합 협상"
 ukraine_regions.11.d: "오랫동안 시작하려고 애써 온 유럽 연합과의 연합 협상을 시작할 때가 되었습니다. 이를 시작할 것인지 마침내 결정할 때입니다."
 ukraine_regions.11.a: "물론이지"
 ukraine_regions.11.b: "안된다"
 ukraine_regions.12.t: "돈바스 지위 문제"
 ukraine_regions.12.d: "수년 동안 우리는 돈바스에 특별한 지위를 부여하자는 제안을 들어 왔으며, 이는 우크라이나 연방화라는 더딘 과정의 시작이 될 것입니다. 이는 되돌릴 수 없다는 것을 인식한 상태에서 내려야 하는 중대한 결정입니다."
 ukraine_regions.12.a: "그들에게 특별한 지위를 부여하겠다"
 ukraine_regions.12.b: "현 상태로 두자"
 ukraine_nato_help.1.t: "동맹의 원조 물자 도착"
 ukraine_nato_help.1.d: "[GetUKRNatoAidDonorLine]"
 ukraine_nato_help.1.a: "Take stock"
 ukraine_parliament.100.d: "러시아 정부가 현재 우크라이나에 행사하고 있는 높은 수준의 영향력으로 인해, 우리 의회의 친러시아 블록이 의회 의석의 과반을 차지하였습니다."
 ukraine_parliament.100.t: "친러시아 블록, 의석 과반 확보"
 ukraine_parliament.100.a: "어떻게 하는지 지켜보자"
 ukraine_parliament.200.d: "미국 정부가 현재 우크라이나에 행사하고 있는 높은 수준의 영향력으로 인해, 우리 의회의 친서방 블록이 의회 의석의 과반을 차지하였습니다."
 ukraine_parliament.200.t: "친서방 블록, 의석 과반 확보"
 ukraine_parliament.200.a: "어떻게 하는지 지켜보자"
 ukraine_parliament.300.t: "친우크라이나 블록, 의석 과반 확보"
 ukraine_parliament.300.d: "미국 정부와 러시아 정부의 영향력이 흔들린 결과, 우리 의회의 친우크라이나 블록이 최근 선거에서 의석의 과반을 차지하였습니다."
 ukraine_parliament.300.a: "어떻게 하는지 지켜보자"
 ukraine_parliament.400.t: "의회 선거"
 ukraine_parliament.400.d: "다시 한번 선거철이 돌아왔고 전국의 투표소가 문을 열기 시작하였습니다. 투표율이 충분히 높아 나라에 좋은 변화를 가져오기를 바랍니다."
 ukraine_parliament.400.a: "어떻게 되는지 지켜보자"
 ukraine_parliament.1.t: "의회, 중앙집권법 승인"
 ukraine_parliament.1.d: "의회는 며칠 전 우리가 제출한 제안에 따라 행정 예산을 늘리는 법안을 통과시키기로 결정하였습니다."
 ukraine_parliament.1.a: "좋아"
 ukraine_parliament.2.t: "의회, 새로운 중앙집권법 부결"
 ukraine_parliament.2.d: "의회는 행정 예산을 늘리는 법안을 부결하기로 결정하였습니다. 이는 며칠 전 우리가 제출한 제안에 따른 것이며, 해당 발의에 대한 지지가 충분하지 않았던 것으로 보입니다."
 ukraine_parliament.2.a: "유감이다"
 ukraine_parliament.2.b: "어쩌면 약간의 뇌물이 그들의 마음을 바꿀지도 모른다..."
 ukraine_parliament.3.t: "의회, 지방분권법 승인"
 ukraine_parliament.3.d: "의회가 행정 예산을 줄이자는 우리의 요청을 승인하였습니다. 이는 며칠 전 우리가 제출한 제안에 따른 것이며, 해당 발의가 많은 인기와 지지를 얻은 것으로 보입니다."
 ukraine_parliament.3.a: "좋아"
