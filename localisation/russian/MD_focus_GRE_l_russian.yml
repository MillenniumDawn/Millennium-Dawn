 GRE_eastern_vars_initialized: "Восточное братство: трек запущен"
 GRE_migration_deal_active: "Миграционное сотрудничество с Турцией активно ведется."
 GRE_assertive_patrols: "В Эгейском море действует активный режим патрулирования."
 GRE_lost_continental_shelf_claims: "Турция признала свои претензии на континентальный шельф."
 GRE_aegean_de_escalation: "Отступил от турецкого ультиматума"
 GRE_confederation_active: "Цепочка принятия решений в Конфедерации активна."
 GRE_confederation_autonomy_done: "Согласована структура автономии Конфедерации"
 GRE_confederation_economy_done: "Соглашение о распределении экономической помощи в рамках Конфедерации"
 GRE_confederation_security_done: "Согласованы рамки безопасности Конфедерации."
 GRE_defending_sovereignty: "Защита греческого суверенитета"
 GRE_defending_sovereignty_desc: "Устойчивая военная готовность направлена на сдерживание турецкого вторжения в Эгейское море и на Кипр. Греческий военно-морской флот и военно-воздушные силы сохраняют повышенную бдительность, а расходы на оборону расходуют ресурсы, которые могли бы быть направлены на производство товаров народного потребления. Это целенаправленное сдерживание укрепляет решимость Греции, но влечет за собой экономические издержки."
 GRE_aegean_naval_supremacy: "Эгейское военно-морское превосходство"
 GRE_aegean_naval_supremacy_desc: "Развертывание передовых патрулей и постоянное присутствие на поверхности дают ВМС Греции преимущество в спорных водах Эгейского моря."
 GRE_migration_cooperation_idea: "Соглашение о миграции между ЕС и Турцией"
 GRE_migration_cooperation_idea_desc: "Турция обрабатывает потоки мигрантов на своей территории в обмен на уступки со стороны Греции и ЕС, что снижает нагрузку на острова Эгейского моря."
 GRE_migration_crisis_idea: "Миграционный кризис"
 GRE_migration_crisis_idea_desc: "Турция вышла из миграционного соглашения, что привело к новым волнам прибытий через Эгейское море и перегрузке греческих пунктов приема беженцев."
 GRE_confederation_category: "Кипрская конфедерация"
 GRE_confederation_category_desc: "Необходимо решить структурные вопросы предлагаемой кипрской конфедерации: автономия, распределение экономических ресурсов и безопасность."
 GRE_eastern_missions_category: "Миссии Восточного Братства"
 GRE_eastern_missions_category_desc: "Повторяющиеся политические вызовы, возникающие в связи с событиями в Эгейском море и на Кипре."
 GRE_decide_autonomy_level: "Решить вопрос об автономии Конфедерации"
 GRE_decide_autonomy_level_desc: "Необходимо определить, примет ли новое государство федеративную модель с сильными центральными институтами или более свободную конфедерацию, предоставляющую каждому сообществу широкое самоуправление."
 GRE_decide_economic_distribution: "Определить экономическое распределение"
 GRE_decide_economic_distribution_desc: "Решите, будет ли федеральный бюджет распределяться поровну между двумя общинами или же будет взвешен с учетом вклада в ВВП."
 GRE_decide_security_guarantees: "Определите гарантии безопасности"
 GRE_decide_security_guarantees_desc: "Решите, будет ли объединенное государство подпадать под зонтик безопасности НАТО или займет нейтральную оборонную позицию."
 GRE_aegean_dialogue_mission: "Эгейский диалог"
 GRE_aegean_dialogue_mission_desc: "Каждые шесть месяцев греческие и турецкие переговорщики должны решать, насколько далеко можно зайти в отстаивании своих требований. Миссия завершается, если диалог перерастает в открытую конфронтацию или войну."
 greece.700.t: "Эгейский диалог: обзор за шесть месяцев"
 greece.700.d: "Последний раунд переговоров зашел в знакомую точку. Турецкие коллеги настаивают на частичных уступках Греции по континентальному шельфу в обмен на дальнейшую деэскалацию. Твердая позиция защищает наши претензии, но страсти накалятся."
 greece.700.a: "Предлагайте взвешенные уступки."
 greece.700.b: "Держите оборону"
 greece.701.t: "Анкара выходит из Миграционного соглашения."
 greece.701.d: "Ссылаясь на дипломатическую позицию Греции, турецкие власти приостановили сотрудничество по вопросам возвращения и обработки заявлений мигрантов. Сообщения о новых прибывших уже поступают с островов Эгейского моря; центры приема столкнутся с кризисом в течение нескольких недель."
 greece.701.a: "Готовьтесь к наплыву"
 greece.702.t: "Эгейский инцидент"
 greece.702.d: "Ночью турецкий патруль пересек воздушное пространство, на которое претендует Греция. Вмешались греческие истребители. Выстрелов не было, но дистанция сближения была опасно мала. Теперь нужно решить, следует ли разрядить обстановку или оказать более сильное сопротивление."
 greece.702.a: "Снижение напряженности"
 greece.702.b: "Усильте ответные меры"
 greece.703.t: "Анкара укрепляет позиции на Северном Кипре"
 greece.703.d: "Турецкие государственные СМИ подтвердили расширение поддержки администрации в Северном Кипре. Этот шаг выглядит скорее продуманным, чем провокационным, и сигнализирует о том, что Афины не могут решать кипрский вопрос на своих собственных условиях."
 greece.703.a: "Примечание для протокола"
 greece.704.t: "Газовый кризис в Восточном Средиземноморье"
 greece.704.d: "Турецкие буровые суда вошли в воды, которые Греция и Кипр считают исключительной экономической зоной. Афинам предстоит решить, следует ли урегулировать конфликт или удерживать месторождение, рискуя спровоцировать более масштабную конфронтацию."
 greece.704.a: "Уступите позиции на данный момент."
 greece.704.b: "Удерживайте поле"
 greece.705.t: "Турецкий ультиматум"
 greece.705.d: "Анкара выступила с жестким предупреждением: дальнейшие действия Греции в отношении Кипра повлекут за собой неопределенные, но ощутимые последствия. Министерство иностранных дел должно ответить."
 greece.705.a: "Отступите от края пропасти"
 greece.705.b: "Не поддавайтесь запугиванию"
 greece.706.t: "Плановый инцидент в воздушном пространстве"
 greece.706.d: "Зафиксирован очередной случай пролета турецких самолетов над территорией, по которому поданы протесты по обычным каналам. Ситуация остается прежней: ни одна из сторон не желает эскалации, ни одна не готова отступить."
 greece.706.a: "Подайте протест"
 greece.710.t: "Конфедерация: вопрос автономии"
 greece.710.d: "Участники переговоров предложили две модели: федеративное устройство с сильными центральными институтами или конфедерацию, которая делегирует большую часть полномочий общинам. Выбор этой модели определит характер нового государства."
 greece.710.a: "Федеральная модель"
 greece.710.b: "Конфедеративная модель"
 greece.711.t: "Конфедерация: экономическое распределение"
 greece.711.d: "Как будут распределяться федеральные доходы? Строгое равенство успокаивает небольшие населенные пункты, но формула, взвешенная по ВВП, отражает экономическую реальность и ее было бы легче защитить внутри страны."
 greece.711.a: "Распределение на основе паритета"
 greece.711.b: "Распределение, взвешенное по ВВП"
 greece.712.t: "Конфедерация: Рамки безопасности"
 greece.712.d: "Подпадет ли объединенное государство под эгиду НАТО или займет нейтральную оборонную позицию? У каждого пути есть свои сторонники в Афинах и Никосии."
 greece.712.a: "Зонт безопасности НАТО"
 greece.712.b: "Нейтральная оборонная позиция"
 greece.720.t: "Требования о создании Кипрского союза"
 greece.720.d: "После нескольких месяцев дипломатических маневров и давления на Турцию Афины готовы выдвинуть официальные требования об объединении Кипра и Северного Кипра с Грецией. Греция заручилась достаточной поддержкой среди греко-кипрского населения, и, если Турция уступит под международным давлением, руководство Северного Кипра также может быть убеждено. Момент истины близок."
 greece.720.a: "Выдвинуть требования"
 greece.721.t: "Война возвращается на Кипр"
 greece.721.d: "Одно или оба кипрских правительства отказали Греции в требованиях об объединении, и военный конфликт неизбежен. Анкара выступила с резкими осуждениями и предупреждениями. Турецкие военные сохраняют готовность, но не взяли на себя прямых обязательств по вмешательству. Международное сообщество с напряжением наблюдает за тем, задействуют ли Афины собственные вооруженные силы или продолжат оказывать тайную поддержку."
 greece.721.a: "Обратите внимание на реакцию"
 greece.722.t: "Насколько далеко зайдут Афины? (Кипр)"
 greece.722.d: "Республика Кипр отвергла требование о присоединении, и военный конфликт неизбежен. Мы можем вооружать и снабжать греко-кипрские силы, выступающие за присоединение, из добровольцев и материальных средств, или же открыто задействовать греческие вооруженные силы для осуществления аннексии. Первый вариант позволит Греции сохранить хорошие отношения с НАТО. Второй же приведет к участию греческих солдат в боевых действиях, потребует выхода из альянса и может спровоцировать прямое вмешательство Турции. Но он также гарантирует быстрое завоевание и интеграцию южного острова."
 greece.722.a: "Только волонтеры и материальные средства."
 greece.722.b: "Задействовать Вооруженные силы Греции; объявить войну Кипру."
 greece.730.t: "Давление НАТО на Турцию"
 greece.730.d: "Афины обращаются к союзнику по НАТО с просьбой использовать дипломатические каналы, чтобы убедить Турцию смягчить свою агрессивную позицию в Эгейском море. Такое давление со стороны западной державы может побудить Анкару пересмотреть свою позицию."
 greece.730.a: "Поддержите Афины!"
 greece.730.b: "Это не предмет нашего спора."
 greece.731.t: "Союзническая поддержка обеспечена"
 greece.731.d: "Наш партнер по НАТО согласился вступить в диалог с Анкарой по вопросу напряженности в Эгейском море. Дипломатическая поддержка со стороны Запада должна помочь смягчить противостояние и подтвердить нашу решительную позицию."
 greece.731.a: "Дипломатическая победа"
 greece.732.t: "Наш запрос отклонен."
 greece.732.d: "Союзник по НАТО вежливо отказался от прямых переговоров с Турцией по спорам в Эгейском море. Они предпочитают сохранять нейтралитет в двусторонних морских вопросах."
 greece.732.a: "Мы остаемся непреклонными."
 greece.733.t: "Предлагаемая экономическая интеграция Кипра"
 greece.733.d: "Афины предлагают глубокую экономическую интеграцию с Республикой Кипр, включая таможенный союз, гармонизацию банковской системы и скоординированную энергетическую политику. Такие связи тесно свяжут остров с греческой экономикой и повысят уровень жизни в Никосии."
 greece.733.a: "Интегрироваться с Грецией"
 greece.733.b: "Сохраним нашу автономию"
 greece.734.t: "Кипр принимает интеграцию"
 greece.734.d: "Никосия поддержала это предложение. Греческие и кипрские предприятия сейчас гармонизируют правила, банковские системы консолидируются, и происходит обмен инвестиционными потоками через Эгейское море. Экономический союз укрепляет позиции Афин в любом будущем политическом урегулировании."
 greece.734.a: "Единство приносит процветание."
 greece.735.t: "Кипр отказывается от глубокой интеграции"
 greece.735.d: "Никосия с уважением отклонила предложение о глубокой экономической интеграции. Республика Кипр предпочитает пока сохранять свою независимость в экономических вопросах, даже ценой замедления экономического роста."
 greece.735.a: "Мы по-прежнему привержены"
 greece.736.t: "Предлагаемая разработка газового месторождения в Восточном Средиземноморье"
 greece.736.d: "Афины предлагают совместную разработку морских месторождений природного газа в водах к югу от Кипра и к востоку от Крита. Совместная программа добычи будет способствовать развитию экономики обеих стран и обеспечит долгосрочные доходы от энергоносителей."
 greece.736.a: "Развивайте эти области совместно."
 greece.736.b: "Слишком провокационно на данный момент."
 greece.737.t: "На Кипре начались работы газовых месторождений."
 greece.737.d: "Греческие и кипрские буровые установки начали добычу природного газа на совместных месторождениях. Введены в эксплуатацию новые нефтеперерабатывающие мощности, и обе экономики получают выгоду от стабильных доходов от энергоносителей. Этот шаг посылает Анкаре сигнал о том, что греки готовы развивать свою исключительную экономическую зону, несмотря на возражения Турции."
 greece.737.a: "Ресурсы обеспечивают наше будущее."
 greece.738.t: "Кипр отклонил газовый проект."
 greece.738.d: "Республика Кипр отказалась от участия в совместной разработке газовых месторождений, опасаясь дипломатической реакции со стороны Турции. Афины не будут настаивать на этом вопросе."
 greece.738.a: "Упущенная возможность"
 greece.739.t: "Работа с турками-киприотами"
 greece.739.d: "Афины протягивают руку экономической и культурной поддержки турецко-кипрской общине на севере. Афины предлагают инвестиции, торговые привилегии и программы культурного обмена, демонстрируя, что воссоединение под эгидой Греции отвечает интересам севера в той же мере, что и интересам греко-кипрской стороны."
 greece.739.a: "Принять греческие инвестиции"
 greece.739.b: "Мы сохраняем осторожность."
 greece.740.t: "Северный Кипр приветствует инвестиции."
 greece.740.d: "Турецко-кипрское руководство приняло греческие инвестиции и укрепило экономические связи. Деньги текут на север, формируются деловые партнерства, и влияние постепенно смещается в пользу Афин. С каждым месяцем укрепляется основа для eventualьного воссоединения."
 greece.740.a: "Посеяны семена единства."
 greece.741.t: "Северный Кипр отвергает инициативу по налаживанию контактов."
 greece.741.d: "Турецко-кипрская община, с опаской относящаяся к намерениям Греции, отклонила инвестиционный пакет. Поддержка Анкары остается их защитой, и предложения Афин не смогли убедить их в обратном."
 greece.741.a: "Очередная неудача"
 greece.742.t: "Предложено соглашение о суверенных военных базах"
 greece.742.d: "Афины требуют от Соединенного Королевства передачи контроля над суверенными военными базами Акротири и Декелия. В обмен Греция предлагает компенсацию, сохранение доступа НАТО и гарантии сохранения британских военных объектов. Передача этих баз изменит стратегический баланс на Кипре."
 greece.742.a: "Передайте базы Греции"
 greece.742.b: "Базы остаются британскими."
 greece.743.t: "Соединенное Королевство согласилось на передачу"
 greece.743.d: "Лондон решил, что перенос баз отвечает долгосрочным интересам обеих стран. Греческие войска теперь занимают Акротири и Декелию, а Афины получают стратегическую глубину и контроль над ключевыми аэродромами и портами. Этот сдвиг решительно меняет военный баланс в пользу Эносиса."
 greece.743.a: "Историческое приобретение"
 greece.744.t: "Соединенное Королевство отказывается от перевода"
 greece.744.d: "Британское правительство отказалось передать суверенные военные базы. Они остаются британской территорией и британскими военными объектами, как это было с 1960 года."
 greece.744.a: "Наши руки связаны."
 GRE_western_commitment: "Греческая западная ориентация"
 GRE_western_commitment_tt: "$GRE_western_commitment$: $RIGHT|+=0Y$"
 greece.745.t: "Кампания по оказанию давления завершилась."
 greece.745.d: "Кампания по оказанию давления на Турцию по Кипру завершилась. Несколько великих держав выразили поддержку греческой позиции, ссылаясь на необходимость стабильности в Восточном Средиземноморье и права кипрского народа. Теперь Афины обладают значительным дипломатическим влиянием. Судя по числу голосов союзников, у Анкары есть [GRE_GetTurkeyConcessionChance] шанс отступить и согласиться на уменьшение своего влияния на Кипре. Если же Турция откажется, напряженность в Эгейском море возрастет."
 greece.745.a: "Посмотрите, как отреагирует Анкара."
 greece.724.t: "Афины требуют объединения"
 greece.724.d: "Греческое правительство официально потребовало от Республики Кипр принять союз с Грецией. Предложение ясно: добровольное присоединение, и переходный период будет плавным и процветающим. Исходя из настроений греко-кипрских жителей и влияния Турции, шансы на принятие составляют [GRE_GetCyprusAcceptanceChance]. Правительство в Никосии стоит перед историческим выбором."
 greece.724.a: "Принять союз с Грецией"
 greece.724.b: "Отклонить требование"
 greece.725.t: "Афины требуют от Севера подчиниться"
 greece.725.d: "Греция теперь обратила свое внимание на Северный Кипр, требуя от турецко-кипрского руководства также принять объединение с Афинами. Позиция турецко-кипрской стороны более сложная: север долгое время полагался на военную защиту Турции и культурные связи. Шансы на принятие объединения оцениваются в [GRE_GetNorthernCyprusAcceptanceChance] и зависят от того, уступит ли Турция под давлением НАТО и от силы греческо-кипрского импульса. Если Северный Кипр откажется, остров останется разделенным, и вооруженный конфликт станет вероятным."
 greece.725.a: "Принять союз с Грецией"
 greece.725.b: "Обратитесь за турецкой защитой; откажитесь от этого требования."
 greece.726.t: "Насколько далеко зайдут Афины?"
 greece.726.d: "Северный Кипр отказывается добровольно подчиниться, и турецко-кипрское правительство дает понять, что будет добиваться военной поддержки Турции для сопротивления поглощению. Теперь Греция стоит перед выбором: продолжать тайную помощь силам, поддерживающим Союз, и надеяться на мирное разрешение ситуации, или направить греческие вооруженные силы непосредственно на аннексию севера силой. Прямые военные действия означают выход из НАТО, поскольку альянс не поддержит наступательную войну с целью захвата территорий из сферы влияния члена НАТО."
 greece.726.a: "Только волонтеры и материальные средства."
 greece.726.b: "Задействовать Вооруженные силы Греции; объявить войну Северному Кипру."
 greece.723.t: "Кипр воссоединился"
 greece.723.d: "Два кипрских государства объединены под греческим флагом. Южные и северные территории теперь полностью включены в состав Греции в качестве основных государств. Впервые с 1974 года остров находится под единым управлением. Это кульминация десятилетий кипрского национализма и греческих ирредентистских амбиций: наконец-то достигнут энозис."
 greece.723.a: "Исторический день для эллинизма."
 GRE_turkey_concedes_tt: "Турция отступает: ее влияние на Кипре и в Северном Кипре существенно снижается, напряженность в Эгейском море ослабевает, а импульс развития Кипра возрастает."
 GRE_turkey_holds_firm_tt: "Турция отказывается уступать; напряженность в Эгейском море растет."
 GRE_gain_cyprus_tt: "Республика Кипр объединяется с Грецией и становится основной греческой территорией."
 GRE_gain_north_cyprus_tt: "Северный Кипр объединяется с Грецией и становится основной греческой территорией."
 GRE_enosis_demand_refused_tt: "Отказ вызывает международное осуждение и вынуждает Афины выбирать, насколько далеко можно зайти в эскалации; кризис может закончиться войной."
 GRE_eastern_neighborhood_setup_tt: "Открывает досье на отношения с Турцией и Кипром; закладывает основы греческого влияния в кипрских общинах."
 GRE_cypriot_economic_integration_reject_tt: "Кипр сопротивляется углублению экономической интеграции; динамика отношений между Грецией и Кипром снижается."
 GRE_northern_outreach_accept_tt: "Северный Кипр принимает греческие инвестиции и участвует в культурном обмене; его влияние и динамика растут."
 GRE_british_bases_accord_accept_tt: "Великобритания передает Греции суверенные военные базы; Греция предоставляет британским войскам военный доступ. Территория может быть полностью интегрирована, как только уровень согласия местного населения станет достаточно высоким."
 GRE_british_bases_accord_reject_tt: "Великобритания отказывается уступить суверенные военные базы."
 GRE_integrate_sovereign_bases: "Интегрировать суверенные базовые зоны"
 GRE_integrate_sovereign_bases_desc: "Акротири и Декелия достались нам как оккупированные территории, а не как греческая земля. Завоевав расположение местного населения и наладив администрацию, мы сможем заявить права на эти базы как на полноправную и постоянную часть Греческой Республики."
 GRE_sovereign_bases_compliance_tt: "Уровень соблюдения требований в суверенных военных базах превышает 80%."
 GRE_integrate_sovereign_bases_effect_tt: "Греция получает контрольный пункт на территории суверенных военных баз."
 GRE_defense_innovation_funding_tt: "Каждый исследовательский грант финансируется из государственного бюджета (средства направляются в государственный долг, а платежи откладываются)."
 GRE_cyprus_reunification_accept_tt: "Кипр и Северный Кипр присоединяются к Греции и полностью интегрированы в качестве основной греческой территории."
 GRE_cyprus_reunification_reject_tt: "Кипрские правительства сохраняют независимость; это небольшое негативное влияние на общественное мнение в отношении Греции."
