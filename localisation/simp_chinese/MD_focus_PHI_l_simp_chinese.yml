 PHI_islamism_dynamic_modifier: "激进伊斯兰主义的兴起"
 PHI_islamism_dynamic_modifier_tooltip: "伊斯兰主义在菲律宾已有数百年历史。但近年来，这种情况开始发生变化，该国南部地区出现了极端激进化现象。"
 PHI_npa_insurgency_dynamic_modifier: "旷日持久的人民战争"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "自1969年以来，菲律宾共产党通过其新人民军在农村地区开展游击战。其干部向村庄征税、伏击巡逻队，并在吕宋岛、萨马岛和棉兰老岛东部地区争夺地方政府的控制权。"
 PHI_milf_decisions_category: "摩洛冲突"
 PHI_milf_decisions_category_desc: "摩洛冲突指的是棉兰老岛省内的一系列武装冲突。摩洛冲突始于1935年菲律宾联邦时期实施的“重新安置政策”。冲突在科雷吉多岛爆发，当时11名穆斯林军事学员遭到杀害。此后不久，摩洛伊斯兰民族阵线于1969年成立，并一直与政府军处于公开冲突状态。\n£generic_anarchist_communism_small §R摩洛伊斯兰民族阵线实力：§![?PHI.PHI_strength_of_milf|20]%"
 PHI_anti_muslim_propaganda: "反穆斯林宣传"
 PHI_anti_muslim_propaganda_desc: "直接利用国家媒体和公共信息来对抗在棉兰老岛活动的激进伊斯兰叛乱组织的影响。"
 PHI_crush_the_moro_insurgency: "Crush the Moro Insurgency"
 PHI_crush_the_moro_insurgency_desc: "With the Moro Islamic Liberation Front reduced to scattered remnants, the Armed Forces can declare the Mindanao campaign concluded. Command of the southern provinces returns to civilian government, and the insurgency ends by force of arms rather than negotiation."
 PHI_sign_the_bangsamoro_agreement: "Sign the Bangsamoro Agreement"
 PHI_sign_the_bangsamoro_agreement_desc: "Malaysian-brokered talks in Kuala Lumpur have brought the Front to the table. A comprehensive agreement would decommission its fighters, replace the Autonomous Region in Muslim Mindanao with a Bangsamoro entity holding real fiscal and legislative powers, and commit Manila to funding the transition."
 PHI_communist_insurgency_category: "New People's Army Rebellion"
 PHI_communist_insurgency_category_desc: "The New People's Army Rebellion is the world's oldest Communist insurgency. The NPA has been fighting constantly since 1969 against the Filipino national government.\n\nIt is time we put forth effort in crushing this rebellion.\n £generic_Communist_State_small §RStrength of the NPA:§! [?PHI.PHI_strength_of_npa|20]%"
 PHI_sustained_military_offensive: "Sustained Military Offensive"
 PHI_sustained_military_offensive_desc: "Commit army and constabulary units to clearing guerrilla fronts in the Sierra Madre, Samar, and the Davao hinterland. Sweeps degrade the New People's Army faster than any other method, but prolonged operations in the countryside cost the government support among the rural population."
 PHI_peace_and_development_teams: "Peace and Development Teams"
 PHI_peace_and_development_teams_desc: "Deploy joint civil-military teams to barangays under guerrilla influence, pairing road and school construction with local governance work. Denying the insurgency its recruiting base is slower than a sweep, and considerably more expensive, but it costs no stability."
 PHI_amnesty_for_returning_cadres: "Amnesty for Returning Cadres"
 PHI_amnesty_for_returning_cadres_desc: "Offer legal immunity, cash assistance, and livelihood support to fighters who surrender their weapons. Mass defections hollow out the guerrilla fronts, though pardoning insurgents costs the government standing with the officer corps and the victims of the rebellion."
 PHI_defeat_the_new_peoples_army: "Defeat the New People's Army"
 PHI_defeat_the_new_peoples_army_desc: "The guerrilla fronts have been broken and the Central Committee is scattered abroad. Declaring the rebellion militarily defeated closes the longest running Communist insurgency in the world."
 PHI_conclude_the_oslo_talks: "Conclude the Oslo Talks"
 PHI_conclude_the_oslo_talks_desc: "Norwegian mediators have kept a channel open to the National Democratic Front for years. A final settlement would exchange political amnesty and agrarian reform commitments for the permanent demobilisation of the New People's Army."
 PHI_anti_dynasty_law: "Anti-Dynasty Law"
 PHI_anti_dynasty_law_desc: "Article II, Section 26 of the 1987 Constitution prohibits political dynasties, but Congress has never passed the enabling legislation, and the families that dominate the legislature have no reason to. Forcing a bill through would bar relatives of incumbents from succeeding them in office, breaking the hold of the provincial clans on national politics and opening the leadership of every party to candidates from outside the great families."
 PHI_corruption_battle_mechanic_category: "The Corruption Battle"
 PHI_corruption_battle_mechanic_category_desc: "Decades of patronage politics, weak institutions, and entrenched interests have left corruption deeply embedded in nearly every level of government. Rooting it out will require sustained, targeted investigations across the bureaucracy, the military, and the private sector. As reforms take hold and institutions strengthen, future investigations will become easier and more effective.\n\nCurrent Corruption Level:  [Root.GetPHI_corruption_tier_number] [Root.GetPHI_corruption_tier_name]\nCurrent Corruption Strength: [?PHI_corruption_strength|Y0]"
 PHI_change_the_strength_of_corruption_tt: "§YCorruption Strength§! changes by [?temp_change|0+] (Current: [?PHI.PHI_corruption_strength|Y0])\n"
