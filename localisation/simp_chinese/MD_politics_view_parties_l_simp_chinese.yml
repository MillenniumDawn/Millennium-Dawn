 WAA.Monarchist: "£generic_Monarchist_small 土司统治"
 WAA.Monarchist_desc: "（宗教君主主义） - “召法\"，或称“天之主\"，是掸邦地区早期历史上统治者的传统头衔。由于地处偏远，英国赋予其一定自治权，这种封建结构和统治一直持续到1959年，最终才将控制权移交给中央政府。"
 SOV.Nat_Autocracy: "£SOV_nationalist_military_junta (AFRF) 俄罗斯联邦武装力量"
 SOV.Nat_Autocracy_icon: "£SOV_nationalist_military_junta"
 SOV.Nat_Autocracy_desc: "（军政府）俄罗斯联邦武装力量\n\n俄罗斯武装力量由总统鲍里斯·叶利钦于1992年创建。武装力量的使命是抵御侵略、保卫领土完整和主权以及根据国际条约履行任务。"
