 ALG_deep_state_oversight_desc: "Военная верхушка держит под серьёзным надзором решения правительства. Крупные политические инициативы требуют одобрения генералов перед исполнением.\n\n§YГлубинное государство, стадия 3 — активна§!"
 ALG_deep_state_control_desc: "Le pouvoir — глубинное государство — фактически правит Алжиром из тени. Гражданские политики стали ширмой.\n\n§RГлубинное государство, стадия 4 — КРИТИЧЕСКАЯ!§!\n§YРиск переворота резко растёт!§!"
 ALG_surveillance_state_1_desc: "Спецслужбы следят за жизнью граждан почти без всякого надзора. Частная жизнь стала роскошью.\n\n§RЭто заметно усиливает глубинное государство.§!"
 ALG_military_junta_1_desc: "Военные взяли прямую власть над алжирским государством. Страной теперь правит совет генералов.\n\n§RПРОИЗОШЁЛ ВОЕННЫЙ ПЕРЕВОРОТ!§!\n\nДемократическому правлению конец. Глубинное государство правит в открытую."
 ALG_state_of_emergency_desc: "Чрезвычайные полномочия введены для борьбы с растущим влиянием глубинного государства. Гражданские свободы временно приостановлены.\n\n§GПока это действует, глубинное государство НЕ РАСТЁТ.§!\n§RБесконечно так продолжаться не может.§!"
 ALG_post_coup_recovery_desc: "Алжир оправляется от неудавшегося военного переворота. Институты повреждены, доверия к власти мало.\n\n§YСтране предстоит отстроиться заново.§!"
 ALG_promised_elections_desc: "Военное правительство обещало провести выборы и вернуть гражданское правление. Мир следит.\n\n§YВыборы должны пройти до истечения срока.§!"
 ALG_deep_state_oversight_added_tt: "§YУстановлен военный надзор§!\nАрмия официально контролирует решения правительства.\n\n§RВлияние глубинного государства ВЫСОКОЕ.§!"
 ALG_deep_state_control_added_tt: "§RГлубинное государство установило контроль§!\nLe pouvoir правит Алжиром из тени.\n\n§RРИСК ПЕРЕВОРОТА КРИТИЧЕСКИЙ!§!"
 ALG_surveillance_state_added_tt: "§RВключено государство слежки§!\nСпецслужбы широко следят за жизнью граждан."
 ALG_military_junta_added_tt: "§R£generic_warning УСТАНОВЛЕНА ВОЕННАЯ ХУНТА!§!\nГенералы захватили власть. В Алжире военное правление."
 ALG_state_of_emergency_added_tt: "§YВВЕДЕНО ЧРЕЗВЫЧАЙНОЕ ПОЛОЖЕНИЕ§!\nЧрезвычайные полномочия вступили в силу.\n§GРост глубинного государства заморожен на 180 дней.§!"
 ALG_state_of_emergency_removed_tt: "§YЧрезвычайное положение отменено.§!\n§RГлубинное государство снова может расти.§!"
 ALG_post_coup_recovery_added_tt: "§YВосстановление после переворота§!\nАлжир приходит в себя после неудавшегося переворота."
 ALG_promised_elections_added_tt: "§YВыборы обещаны.§!\nУ военных есть 2 года, чтобы сдержать обещание."
