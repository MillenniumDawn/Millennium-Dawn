 senbu_occupation_law_fake_idea: "선무 평정 행정"
 senbu_occupation_law_fake_idea_desc: "민정 장교들은 수비대 지휘관이 아닌 지역 유지들을 통해 점령 지구를 운영하며, 생산을 요구하기에 앞서 시장, 학교, 쌀 배급을 복구합니다. 복종은 꾸준히 늘고 수비대 소요는 낮게 유지되지만, 유화적인 방식은 징벌적 체제보다 조직적인 저항에 더 많은 여지를 줍니다."
 JAP_sabotaged_russians: "파괴된 러시아 시설"
 JAP_usa_trade_pressure: "미국의 무역 압박"
 JAP_article_nine_balance_of_power_category: "제9조"
 JAP_article_nine_balance_of_power_category_desc: "헌법 제9조의 전쟁 포기는 확정된 문제가 아니라 내각, 법원, 미국과의 동맹, 그리고 대중 사이에서 진행 중인 논쟁입니다. 재해석이 이루어질 때마다 엄격한 방어 태세와 정상적인 군대 사이의 균형이 이동합니다."
 JAP_cool_japan_doctrine_desc: "일본의 디자인이 낯선 것은 외국 표준에 맞추지 못해서가 아닙니다. 대안을 단 한 번도 고려하지 않은 사람들이 일본 소비자를 위해 만들었기 때문에 낯선 것이며, 바로 그 점이 사 볼 만한 가치를 만듭니다. 노동성은 문화를 하드웨어의 쇼윈도로 포장하는 일을 멈추고, 그 차이 자체를 수출하기 시작합니다.\n\n§R이 경로는 §Y$JAP_galapagos_syndrome$§!을(를) 영구히 유지합니다.§! 오직 §Y$JAP_world_integration$§!만이 이를 제거하며, 둘은 상호 배타적입니다. 일본은 세계의 표준에 수렴하거나, 세계에 자신만의 것을 팔거나 둘 중 하나입니다."
 JAP_galapagos_sphere_modifier: "문화권"
 JAP_galapagos_sphere_modifier_desc: "노동성은 일본의 영향력이 20퍼센트 이상인 국가의 수를 분기마다 집계하여, 그 총합을 그 자체로 하나의 수출 지표로 취급합니다. 명단에 오른 모든 나라는 이해하라고 요구받지 않고도 일본 디자인을 사들이는 소비층을 넓히며, 이는 무역 대표단에게 가치가 있고 그 뒤를 따라 진출하는 기업들에게는 더 큰 가치가 있습니다. 집계는 분기마다 한 번 이루어지며 수익도 이에 따라 움직입니다. 더 이상 커지지 않는 문화권은 더 이상 수익을 내지 않습니다."
 JAP_galapagos_sphere_tt: "§Y문화권§!: 일본의 영향력이 §G20%§! 이상인 국가는 [?JAP_galapagos_sphere_count|Y0]개국이며, §Y쿨 재팬 독트린§!을 채택한 이후 분기마다 집계됩니다. 수익은 §Y$JAP_electronics_superpower$§!으로 절반만큼, §Y$JAP_home_electronics$§!으로 다시 4분의 1만큼 증가합니다."
 JAP_cool_japan_sphere_payout_tt: "분기마다 노동성은 일본의 §Y영향력§!이 §G20%§! 이상인 국가를 집계하여 그 총합을 §Y문화권§!으로 보고합니다. 각 국가는 §Y문화권§!을 통해 지급되는 §G+1%§! §Y해외 영향력§!과 §G+0.2%§! §Y투자 수익률§!을 더하며, 문화권이 넓어질수록 늘어납니다. §Y$JAP_electronics_superpower$§!은(는) 수익을 다시 절반만큼 높이고, §Y$JAP_home_electronics$§!은(는) 다시 4분의 1만큼 높입니다.\n-------------\n이는 §Y연구 표류§!에는 영향을 주지 않습니다. 이 독트린은 해외에서의 영향권을 얻을 뿐, 국내의 표준 격차를 좁히지는 못합니다."
 JAP_creative_industries_office: "창조산업진흥국"
 JAP_creative_industries_office_desc: "경제산업성은 애니메이션, 디자인, 패션, 음식을 문화가 아닌 수출 부문으로 다루기 위해 창조산업진흥국을 설립합니다. 이어서 쿨 재팬 기금이 500억 엔과 보조금 대신 공동 투자를 하라는 임무를 안고 출범하여, 어떤 일본 이사회도 단독으로는 승인하지 않았을 해외 소매 매장, 아시아 스트리밍 플랫폼, 유통 사업에 지분을 사들입니다. 관료들은 형편없는 벤처 투자가이고 기금은 수년간 적자를 내지만, 민간 자본이 뒤따라 들어오는 사업들의 첫 손실을 떠안습니다."
 JAP_visit_japan_campaign: "비지트 재팬 캠페인"
 JAP_visit_japan_campaign_desc: "비지트 재팬 캠페인이 어떤 부처도 믿지 않는 목표, 곧 연간 외국인 방문객 4천만 명을 내걸고 재개됩니다. 정부는 아시아 여행객에 대한 비자 제도를 완화하고, 화장품과 의약품에 대해서는 계산대에서 소비세를 면제하며, 번역되지 않는 부분들로 나라를 홍보합니다. 일본을 팔기 위해 일본다움을 덜어내는 일은 없습니다."
 JAP_content_export_offensive: "콘텐츠 수출 공세"
 JAP_content_export_offensive_desc: "지적재산기본법과 콘텐츠진흥법은 애니메이션, 게임, 만화를 전략 자산으로 법령에 명시했지만, 업계는 팬 번역가들이 유통을 맡는 동안 해외 시청자를 용인해야 할 해적 행위로 여기고 있습니다. 정부는 대신 합법적인 경로를 구축합니다. 동시 공개, 전문 자막, 스튜디오 하나씩이 아닌 집단으로 협상하는 저작권자들이 그것입니다. 해외 시장은 이미 애니메이션 수익의 더 큰 절반을 차지하고 있으나 그중 거의 아무것도 거둬지지 않고 있습니다."
 JAP_washoku_to_the_world: "세계로 나아가는 와쇼쿠"
 JAP_washoku_to_the_world_desc: "와쇼쿠가 유네스코 무형문화유산 목록에 등재되면서, 정부는 하나의 요리가 아닌 하나의 관행을 홍보합니다. 제철 재료, 상차림, 설날 상이 그것입니다. 노동성의 초기 본능은 이를 단속하는 것이었으나, 해외 정통 일식당 인증 구상은 외신이 '스시 경찰'이라는 별명을 붙이자 폐기되었습니다. 캘리포니아 롤과 방콕의 라멘은 어떤 감독 기관보다도 많은 일본 쌀, 간장, 사케를 팔며, 1조 엔 수출 목표는 그 교역에 기대고 있습니다."
 JAP_japan_house_network: "재팬 하우스 네트워크"
 JAP_japan_house_network_desc: "JET 프로그램은 수천 명의 외국 청년을 일본의 학교와 시청에 보냈다가 유창한 일본어 구사자로 돌려보냈으며, 이들은 이제 외교부, 로펌, 편집국에 앉아 있습니다. 재팬 하우스는 그 네트워크에 정문을 만들어 줍니다. 상파울루, 로스앤젤레스, 런던의 값비싼 거리에 있는 갤러리, 도서관, 상점, 식당은 외무성이 운영하며 의도적으로 국기와 정책 성명이 없습니다. 개관 후 도시마다 일본어 강좌 신청자가 세 배로 늘었습니다."
 JAP_gross_national_cool: "국민총쿨"
 JAP_gross_national_cool_desc: "갈라파고스 증후군은 남습니다. 규격은 계속 일본식이고 연구 표류도 이어집니다. 그 대신 각 부처가 구축한 것은 오직 자신만이 만들 수 있는 것, 곧 스튜디오, 주방, 게임사, 디자인 사무소, 그리고 그저 보기 위해 해마다 찾아오는 수백만 명을 통해 해외에서 돈을 버는 나라입니다. 고립은 치유된 적이 없고 그저 일하게 되었을 뿐입니다."
 JAP_cool_japan_spirit_kept_tt: "§Y갈라파고스 증후군§!은(는) §R그대로 유지됩니다§!. 일본은 차이를 치유하는 대신 파는 쪽을 택했습니다"
 JAP_electronics_anchor_bonus_tt: "§Y전자 초강대국§!: 일본의 하드웨어가 일본의 콘텐츠를 모든 시장에 실어 나르며 그에 따라 수익도 커집니다"
 JAP_world_integration: "세계와의 통합"
 JAP_world_integration_desc: "일본은 더 이상 섬이 아닙니다. 표준은 다른 나라의 초안에 맞춰 다시 쓰이고, 관세율표는 내려가며, 각 부처는 외국의 입찰이 적절한지를 묻는 일을 멈추고, 30년 동안 이 나라를 돌아서 가던 자본이 안으로 들어오기 시작합니다. 포기되는 것은 보호 장치 그 자체입니다. 소비재를 싸게 만든 종속 시장과, 어떤 경쟁자도 넘지 못한 외부 영향력에 대한 장벽이 그것이며, 일본 기업들은 이제 자신들이 소유하던 시장을 스스로 따내야 합니다."
 JAP_structural_reform_zones: "구조개혁 특구"
 JAP_structural_reform_zones_desc: "규제 법규를 그것을 만든 부처들과 한 줄씩 논쟁하는 대신, 정부는 현이나 마을이 규정 면제를 신청하게 한 뒤 하늘이 무너지지 않음을 입증하게 합니다. 농민들은 전국 최소 양조량 미만으로 술을 빚고, 주식회사가 학교를 운영하고 농지를 임차하며, 국가전략특구는 같은 수단을 도쿄에는 금융, 후쿠오카에는 창업 고용 규칙, 간사이에는 의료 시험에 겨눕니다. 이는 도매가 아닌 소매 규제 완화이며, 실제로 무언가를 움직여 본 유일한 방법입니다."
 JAP_corporate_governance_code: "기업 지배구조 코드"
 JAP_corporate_governance_code_desc: "이토 보고서는 실패에 수치를 매깁니다. 일본 기업이 소비하는 자본만큼의 가치를 하려면 자기자본이익률이 최소 8퍼센트는 되어야 하는데, 대부분은 이를 넘지 못합니다. 스튜어드십 코드는 연금 기금과 보험사에 손님이 아닌 주인처럼 의결권을 행사하라고 요구하며, 기업 지배구조 코드가 준수 또는 설명 원칙으로 뒤따릅니다. 사외이사는 이사회의 3분의 1에 근접하고 상호 지분은 매각되기 시작하는데, 이는 일본 기업을 외국 기업으로 만든다기보다 주식을 사려는 누구에게나 읽을 수 있게 만듭니다."
 JAP_economic_partnership_agreements: "경제 동반자 협정"
 JAP_economic_partnership_agreements_desc: "농업은 전후 내내 일본 무역 정책에 대한 거부권을 쥐어 왔고, 수출업자들은 이제 관세 항목 하나만으로 한국 기업에 입찰을 빼앗기고 있습니다. 일본은 유럽연합과 양측이 지금껏 서명한 가장 큰 양자 협정을 체결한 뒤, 워싱턴이 빠져나가자 미국 조항을 삭제하는 대신 정지시킨 채 환태평양경제동반자협정의 의장직을 맡습니다. 이어 RCEP이 뒤따라 일본, 중국, 한국을 처음으로 하나의 무역 틀 안에 두며, 그 모든 협정에서 쌀은 보호됩니다."
 JAP_open_capital_markets: "자본 시장 개방"
 JAP_open_capital_markets_desc: "경제 규모에 비하면 일본은 거의 모든 선진국보다 외국 자본을 적게 보유하고 있으며, 이는 상호 지분, 읽을 수 없는 공시, 외국 입찰을 관리해야 할 문제로 여겨 온 40년의 관료적 태도 때문입니다. 개선책은 화려하지 않으며 거의 전적으로 행정적입니다. 외국 기업이 법인을 설립하도록 안내하는 JETRO의 인베스트 재팬 창구, 일본어로 공시되는 날 영어로 발표되는 실적, 외국 자회사를 열기 위해 이곳으로 옮겨 와야 하는 인력을 위한 점수제 체류 제도가 그것입니다. 사람에 관한 완전한 문제는 §Y$JAP_an_open_nation$§!에 속하며, 이는 자본이 문을 찾을 수 있느냐 하는 더 좁은 문제입니다."
 JAP_the_third_opening: "제3의 개국"
 JAP_the_third_opening_desc: "일본은 스스로를 별개의 경제로 만들었던 마지막 보호 장치를 포기합니다. 정부는 내수 시장을 외국과의 경쟁에 개방하고, 표준을 국제 초안에 맞춰 다시 쓰며, 외국 자본이 일본 자본과 동일한 조건으로 투자하도록 허용합니다. 종속 시장과 외부 영향력에 대한 장벽은 둘 다 포기되어, 나라는 여럿 중 하나의 서명국으로서 교역하게 됩니다."
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: 이미 세계의 사람들에게 문을 연 나라는 세계의 자본에 문을 열 때 따질 것이 훨씬 적습니다"
 JAP_zombie_report_credible_tt: "조사가 최소한 §Y부분 보고서§!를 작성함"
 JAP_zombie_investigation_concluded_tt: "조사 결과와 관계없이 조사가 §Y종결§!됨"
 JAP_zombie_case_files_up_1_tt: "$JAP_case_files$: $RIGHT|+=1$"
 JAP_zombie_case_files_up_2_tt: "$JAP_case_files$: $RIGHT|+=2$"
 JAP_zombie_case_files_down_1_tt: "$JAP_case_files$: §R-1§!"
 JAP_zombie_case_files_down_2_tt: "$JAP_case_files$: §R-2§!"
 JAP_zombie_obstruction_up_2_tt: "$JAP_obstruction$: §R+2§!"
 JAP_zombie_obstruction_up_5_tt: "$JAP_obstruction$: §R+5§!"
 JAP_zombie_obstruction_up_6_tt: "$JAP_obstruction$: §R+6§!"
 JAP_zombie_obstruction_up_8_tt: "$JAP_obstruction$: §R+8§!"
 JAP_zombie_obstruction_up_10_tt: "$JAP_obstruction$: §R+10§!"
 JAP_zombie_obstruction_up_15_tt: "$JAP_obstruction$: §R+15§!"
 JAP_zombie_obstruction_down_3_tt: "$JAP_obstruction$: §G-3§!"
 JAP_zombie_obstruction_down_8_tt: "$JAP_obstruction$: §G-8§!"
 JAP_zombie_obstruction_down_10_tt: "$JAP_obstruction$: §G-10§!"
 JAP_zombie_obstruction_down_12_tt: "$JAP_obstruction$: §G-12§!"
 JAP_zombie_obstruction_down_15_tt: "$JAP_obstruction$: §G-15§!"
 JAP_zombie_obstruction_down_18_tt: "$JAP_obstruction$: §G-18§!"
 JAP_zombie_obstruction_down_20_tt: "$JAP_obstruction$: §G-20§!"
 JAP_whistleblower_protection_act: "공익신고자 보호법"
 JAP_whistleblower_protection_act_desc: "감사관은 기업이 내주는 것만 읽을 수 있지만, 직원들은 어떤 대출이 만기 연장되었고 어떤 송장이 날짜를 소급해 작성되었는지 압니다. 이들은 자신이 고발해야 할 회사에서 일하며, 직업이 하나뿐이고 두 번째 기회가 없는 노동 시장에 놓여 있습니다. 공개를 이유로 한 해고를 불법으로 하는 법령은 침묵하는 증인을 증언하는 사람으로 바꿉니다."
 JAP_financial_revival_program: "금융 재생 프로그램"
 JAP_financial_revival_program_desc: "은행은 자신의 차입자에게 등급을 매기는데, 그 등급은 상환 불능을 감춥니다. 금융 재생 프로그램은 모든 주요 익스포저에 현금흐름 할인 평가를 적용하고, 자산 대비 자본 한도를 강화하며, 부실 채권 비율을 절반으로 줄이는 목표를 공표합니다. 경제 단체들은 이를 산업에 대한 전쟁이라 부를 것이며, 그들이 완전히 틀린 것은 아닙니다."
 JAP_special_investigation_unit: "특수부"
 JAP_special_investigation_unit_desc: "감사는 발견 사항을 낳고, 검사는 피고인을 낳습니다. 도쿄지방검찰청 특수부는 내각의 장관들을 무너뜨린 적이 있으며, 게이레쓰 이사회가 조용히 합의를 볼 수 없는 유일한 기관입니다. 이들의 칼끝이 재무제표를 향합니다."
 JAP_special_investigation_unit_TT: "방해가 이제 §G25% 더 느리게§! 누적됩니다"
 JAP_the_lost_decade_ends: "잃어버린 10년의 끝"
 JAP_the_lost_decade_ends_desc: "마지막 남은 지급 불능 기업이 법정을 거치고 등록부가 닫힙니다. 아무것도 차환되지 않았고, 모든 손실은 발생한 곳에서 장부에 기록되었으며, 신용은 이제 상환할 수 있는 기업에만 닿습니다. 장부가 실제로 참인 것을 말하는 경제만이 다른 어떤 것을 세울 수 있는 유일한 토대입니다.\n-------------\n이 중점은 §Y$JAP_zombie_companies$§!과(와) 정리와 함께 따라온 §Y$JAP_liquidation_wave$§!을(를) §G제거§!합니다."
 JAP_controlled_downsize_TT: "§Y청산 물결§!을 시작합니다. 기업들은 합병 프로그램의 §G두 배 속도§!로 정리되며, 정리가 끝날 때까지 §R가혹한 국가 정신§!을 감수해야 합니다"
 JAP_forced_mergers_TT: "§Y합병 프로그램§!을 시작합니다. 지금은 비용이 적고 완만하지만 §R정리 속도의 절반§!이며, 이후 일본 산업에 영구적인 흔적을 남깁니다"
 JAP_liquidation_wave: "청산의 물결"
 JAP_liquidation_wave_desc: "청산이 진행 중입니다. 파산 공고가 경제면을 채우고, 건설 현장은 시행사가 정리되면서 멈춰 서며, 실업이 급증하고, 정부는 충격을 완화하기 위해 차입해야 합니다. 고통은 극심하고 집중되어 있지만 일시적입니다.\n-------------\n§Y기업 구조조정 진행도§!가 좀비 기업의 정리를 마치면 해제됩니다."
 JAP_fusion_restructuring: "행정 지도"
 JAP_fusion_restructuring_desc: "노동성은 경계선을 긋고 은행은 혼수를 댑니다. 아무도 해고되지 않고 아무도 실패를 인정하지 않으며, 30년간 서로를 증오해 온 두 영업 조직은 이제 한 회사라는 통보를 받습니다. 등록부는 분기마다 짧아집니다. 비용은 실업이 아닌 침체에 있습니다.\n-------------\n§Y기업 구조조정 진행도§!가 좀비 기업의 흡수를 마치면 해제됩니다."
 JAP_consolidated_conglomerates: "통합 재팬 주식회사"
 JAP_consolidated_conglomerates_desc: "지급 불능 기업의 이름은 등록부에서 사라졌고, 정리된 것이 아니라 흡수되었습니다. 그 자리를 대신한 것은 중복된 공장, 중복된 연구 부서, 그리고 자신의 뜻과 무관하게 그들을 사들인 이사회에 답해야 하는 경영진을 안은 더 큰 그룹들입니다. 국가는 요구했던 국가대표 기업을 얻었습니다. 동시에 출발할 때보다 더 느리게 혁신하는 산업 기반도 얻었습니다."
 JAP_zombie_investigation_category: "좀비 기업 조사"
 JAP_zombie_investigation_category_desc: "감사관과 검사들이 일본의 지급 불능 차입자들의 장부를 파헤치고 있으며, 기업들은 이를 막기 위해 똑같이 열심히 움직이고 있습니다.\n\n$JAP_case_files$: [?JAP_zombie_case_files|0] / 14\n$JAP_obstruction$: [?JAP_zombie_obstruction|0] / 100\n\n§Y할 수 있는 일§!\n아래 각 사건은 기소하거나, 조용히 구제하거나, 묵인할 수 있습니다. 기소는 가장 탄탄한 자료를 만들지만 실제 생산에 영향을 미치는 §Y산업 재벌§!과의 관계에서 가장 큰 손실을 입힙니다. 구제는 납세자의 부담으로 더 얇은 자료를 만듭니다. 묵인은 아무것도 만들지 않습니다.\n\n§G보고서§!\n조사가 종결될 때 등급이 매겨집니다.\n자료 §G10건 이상§!: 더 빠른 정리를 이끄는 전면적인 청산.\n§G3~9건§!: 부분 보고서.\n§R3건 미만§!: 수집된 자료를 지우고 정리를 늦추는 은폐.\n§Y$JAP_controlled_downsize$§!은(는) 자료 10건 이상이 필요합니다. §Y$JAP_forced_mergers$§!은(는) 자료 3건 이상이 필요합니다. 조사가 포기되거나 은폐되더라도 어느 쪽 분기도 영구히 닫히지는 않습니다.\n\n§R방해§!\n파헤치는 매달 상승하며 재벌의 분노가 클수록 더 빠릅니다. §R30§!에서 노동성이 정보를 흘리고, §R55§!에서 경제 단체가 최후통첩을 내리며, §R80§!에서 조사가 스캔들로 중단됩니다. 아래의 결정들은 이를 다시 낮춰 줍니다."
 JAP_zombie_investigation_mission: "조사 종결"
 JAP_zombie_investigation_mission_desc: "조사는 영원히 계속될 수 없습니다. 정치적 의지가 바닥나기 전에 공표할 만한 사건 자료를 구축하십시오."
 JAP_zombie_investigation_mission_TT: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 10"
 JAP_keidanren_ultimatum_mission: "게이단렌의 최후통첩"
 JAP_keidanren_ultimatum_mission_desc: "경제 단체는 가능한 한 정중한 말로 정부에 조사가 신뢰를 해치고 있으니 접어야 한다고 전했습니다. 그들은 이 눈치를 알아차릴 시한을 회계연도 반기 말까지로 주었습니다."
 JAP_keidanren_ultimatum_TT: "$JAP_obstruction$을(를) §Y45§! 미만으로 낮추십시오"
 JAP_case_ltcb_shinsei: "사건 자료: 신세이의 풋옵션"
 JAP_case_ltcb_shinsei_desc: "일본장기신용은행은 국유화되어 공적 비용으로 정리된 뒤 외국 투자 그룹에 명목상의 금액으로 매각되었습니다. 계약은 매수자에게 가치의 5분의 1이 하락한 모든 대출을 장부가로 예금보험기구에 되돌릴 권리를 주었습니다. 새 소유주들은 이를 행사하고 있으며, 손실은 1엔도 빠짐없이 납세자에게 떨어집니다. 노동성의 누군가가 그 조항에 서명했습니다."
 JAP_case_sogo_collapse: "사건 자료: 소고의 붕괴"
 JAP_case_sogo_collapse_desc: "백화점 체인은 2조 엔에 가까운 부채를 지고 있으며 수년간 실질적인 이익을 내지 못했습니다. 노동성 책상 위의 계획은 부채의 공적 몫을 탕감하고 영업을 계속하게 하는 것입니다. 신문들도 이 계획을 알고 있으며, 일반 기업은 신용을 거절당하는 동안 소매업체를 구제하는 데 대한 여론의 반응은 누구나 예측할 수 있는 그대로였습니다."
 JAP_case_mycal_bankruptcy: "사건 자료: 마이칼"
 JAP_case_mycal_bankruptcy_desc: "오사카의 슈퍼마켓 그룹은 주거래 은행이 돌려받으리라 기대하지 않았던 돈으로 버블기에 확장했으며, 그 후 수년간 구조조정이 아닌 차환으로 연명해 왔습니다. 이 기업이 무너지면 일본이 기록한 최대의 소매업 파산이 될 것이며, 간사이의 납품업체 연쇄를 함께 끌고 내려갈 것입니다."
 JAP_case_resona_injection: "사건 자료: 리소나"
 JAP_case_resona_injection_desc: "감사관들은 은행 자본 중 이연법인세자산, 즉 현실적으로 벌어들일 전망이 없는 미래 이익이 얼마나 되는지 인증하기를 거부했습니다. 그 허구가 없으면 은행은 자본이 부족합니다. 2조 엔에 가까운 공적 자금이 은행을 온전하게 하겠지만 사실상 국가에 넘기는 셈입니다. 거부하면 정부가 허용하는 최초의 주요 은행 파산이 됩니다."
 JAP_case_ashikaga_bank: "사건 자료: 아시카가 은행"
 JAP_case_ashikaga_bank_desc: "이곳은 전국 은행이 아닙니다. 현청 계좌와 대부분의 지역 기업, 다른 은행을 이용해 본 적 없는 수많은 가계의 계좌를 보유한 도치기의 은행입니다. 그리고 지급 불능이기도 합니다. 국유화하면 예금자는 보호되지만 주주는 파멸하며, 전국의 모든 지방 대출 기관이 이 결정을 의지의 표명으로 읽을 것입니다."
 JAP_case_daiei_ircj: "사건 자료: 다이에"
 JAP_case_daiei_ircj_desc: "일본에 할인 가격을 가르친 소매업체는 수조 엔의 부채를 안고 있으며, 대출의 실제 가치를 인정할 여력이 없는 은행들 덕분에 간신히 서 있습니다. 산업재생기구는 이를 인수하여 경영진을 교체하고 조각을 매각할 수 있습니다. 당내 창업주의 동맹들은 한 번 더 차환되기를 바랍니다."
 JAP_case_kanebo_accounts: "사건 자료: 가네보 회계"
 JAP_case_kanebo_accounts_desc: "화장품 및 섬유 그룹은 5년간 벌지 않은 이익을, 2천억 엔 규모로 보고해 왔습니다. 분식 자체에는 이견이 없습니다. 논쟁이 되는 것은 그 모든 재무제표에 서명한 회계법인이며, 감사인이 감사 대상 기업에 상업적으로 응답하는 한 나라가 정직한 장부를 가질 수 있는가 하는 문제입니다."
 JAP_press_the_prosecutors: "검사들의 고삐를 풀다"
 JAP_press_the_prosecutors_desc: "특수부가 송치가 아닌 체포를 하게 합니다. 영장을 든 사람들이 이사를 사무실에서 끌고 나가는 것만큼 로비 활동을 빨리 잠재우는 것은 없습니다."
 JAP_whistleblower_immunity_decision: "정보 제공자에게 면책 부여"
 JAP_whistleblower_immunity_decision_desc: "지시를 실행한 중간 관리자들에게 지시를 내린 자들에 대한 증언의 대가로 기소로부터의 보호를 제안합니다. 재벌 그룹은 이를 동료를 배신하라는 초대라 부를 것입니다. 실제로 그렇습니다."
 JAP_publish_inspection_manual_decision: "검사 결과 공표"
 JAP_publish_inspection_manual_decision_desc: "감독 평가를 노동성을 위해 요약하는 대신 전문 그대로 공개합니다. 시장은 이를 읽는 것을 달가워하지 않겠지만, 온 나라가 이미 본 수치에 맞서 로비할 수 있는 기업은 없습니다."
 JAP_cooperating_bank_amnesty_decision: "협조 은행 사면"
 JAP_cooperating_bank_amnesty_decision_desc: "자발적으로 장부를 공개하는 모든 은행에 임원이 추궁받지 않으리라는 보장을 제공합니다. 평화는 얻지만, 그들을 겨냥해 구축하던 사건 자료를 조사 측이 잃게 됩니다."
 JAP_zombie_probe_abandoned_TT: "조사가 §R중단§!되며 은폐로 공표되어, 지금까지 수집한 사건 자료가 삭제되고 정리가 늦춰집니다"
 JAP_zombie_report_strong_TT: "§G전면적인 청산.§! 정리가 §G25% 더 빨라집니다§!"
 JAP_zombie_report_partial_TT: "§Y부분 보고서.§! 정리가 보통 속도로 진행됩니다"
 JAP_zombie_report_whitewash_TT: "정리 §R25% 느려짐§!"
 Japan_economy.06.c: "모든 것을 중단한다"
 Japan_economy.08.b: "가진 것을 공표한다"
 Japan_economy.08.c: "공표하되 아무도 요약 이후를 읽지 않기를 바란다"
 Japan_economy.09.b: "그를 찾아내 본보기로 삼는다"
 Japan_economy.23.b: "조용히 재협상하여 조항을 매입한다"
 Japan_economy.23.c: "매각은 끝났다. 그대로 두자."
 Japan_economy.24.b: "헤드라인에서 사라지도록 구조조정한다"
 Japan_economy.24.c: "부채를 탕감하고 넘어간다"
 Japan_economy.25.b: "수익성 있는 점포의 질서 있는 매각을 주선한다"
 Japan_economy.25.c: "은행을 압박해 1년 더 버티게 한다"
 Japan_economy.26.b: "자금을 투입하고 경영진은 유임한다"
 Japan_economy.26.c: "감사관들이 설득되게 한다"
 Japan_economy.27.b: "증자하여 민간 소유로 유지한다"
 Japan_economy.27.c: "현이 구제 합병을 주선하게 한다"
 Japan_economy.28.b: "협의에 의한 구조조정을 지원한다"
 Japan_economy.28.c: "차환을 허용한다"
 Japan_economy.29.b: "회사를 상장 폐지하고 감사인은 합의하게 둔다"
 Japan_economy.29.c: "고립된 실패로 취급한다"
 Japan_economy.33.t: "조사 재개"
 Japan_economy.33.d: "검토는 검토가 보통 찾아내는 것을 찾아냈습니다. 새 책임자가 임명되고 자료가 반환되었으며, 조사는 이전보다 역풍이 훨씬 거센 가운데 재개됩니다. 기업들은 6개월간 준비할 시간이 있었고 그 시간을 활용했습니다."
 Japan_economy.33.a: "다시 시작한다."
 Japan_economy.34.t: "깨끗해진 등록부"
 Japan_economy.34.d: "마지막 남은 지급 불능 차입자가 정리되었습니다. 수년이 걸렸고, 대가는 파산과 실업, 그리고 고통이 필요하다고 주장하며 정치적 자본 대부분을 소모한 정부로 치러졌습니다. 남은 것은 신용이 상환할 수 있는 기업으로 가고, 재무제표가 적힌 대로의 의미를 갖는 경제입니다."
 Japan_economy.34.a: "그만한 값어치가 있었다."
 Japan_economy.35.t: "무너진 것 없음"
 Japan_economy.35.d: "지급 불능 기업의 이름은 등록부에서 사라졌습니다. 어느 곳도 파산하지 않았습니다. 노동성의 주선으로 더 큰 그룹에 흡수되었고, 더 큰 그룹들은 이제 중복된 공장, 중복된 연구소, 그리고 금요일에 월요일부터 경쟁사 소속이라는 통보를 받은 직원들을 안고 있습니다. 일자리는 사라지지 않았고 아무것도 인정되지 않았습니다. 일본의 산업은 통합되고, 안정되었으며, 예전보다 느려졌습니다."
 Japan_economy.35.a: "합의는 유지되었다."
 JAP_electronics_resilience_complete_TT: "§Y전자 회복력§!이 §G5§! 이상임 (현재 [?JAP_electronics_resilience|Y0])"
 JAP_electronics_war_won_tt: "서울, 타이베이, 상하이가 이후 무엇을 하든 §Y$JAP_model_competition$§!은(는) 영구히 끝나며 다시 돌아올 수 없습니다."
 JAP_seismic_retrofitting: "국가 내진 보강 프로그램"
 JAP_seismic_retrofitting_desc: "1981년 건축기준법은 상한이 아닌 하한을 정했고, 주택 재고의 3분의 2는 그 이전에 지어졌습니다. 국가 보강 프로그램은 지역별로 나라를 훑으며, 병원과 시청에는 면진 장치를, 학교에는 전단벽과 기둥 보강을, 고베에서 극적으로 붕괴했던 고가 고속도로에는 강재 가새를 지원합니다. 검사관이 다녀간 곳은 건설이 더 느려지고 비싸지지만, 보강된 지역은 큰 지진도 기반시설이 온전한 채로 넘깁니다."
 JAP_news.04.t: "헌법 제9조를 넘어서려는 일본의 움직임"
 JAP_news.04.d: "국회는 방위 전환 위원회의 최종 보고서를 접수했으며, 이로써 일본은 전후 헌법 제9조로부터 벗어나는 결정적인 걸음을 내디뎠습니다. 수십 년 동안 전쟁 포기와 전력 불보유를 규정한 이 조항은 개정이 아니라 거듭된 재해석을 통해 운용되어 왔습니다. 자위대는 필요 최소한의 능력으로서 합헌으로 선언되었고, 해외 파병은 재건 및 후방 지원으로 정당화되었으며, 집단적 자위권 금지는 동맹국의 함선과 항공기를 한정된 조건 아래 방어할 수 있을 때까지 좁혀졌습니다. 위원회의 결론은 이렇게 누적된 해석의 총체가 더 이상 일본의 안보 요구를 감당하도록 늘어날 수 없으며, 그 제약은 다시 한번 문구를 고치는 대신 치워 놓아야 한다는 것입니다.\n\n실질적 결과는 즉각적입니다. 일본 부대의 규모와 구성에 대한 제한이 사라지고, 자위대는 본토 방어를 넘어서는 작전을 자유로이 계획할 수 있으며, 도쿄는 다른 모든 주요국이 당연하게 여기는 전쟁과 동맹 주도의 주권적 수단을 되찾습니다. 일본 관리들은 연속성을 강조하며 이 변화를 70년간의 절제와의 단절이 아니라 정상 국가의 권리에 대한 공식적 인정이라고 설명했습니다. 베이징, 서울, 평양에서의 해석은 크게 다르며, 워싱턴은 이제 기지 접근과 후방 지원 이상을 해낼 수 있는 파트너와 동맹을 맺게 되었습니다. 어떤 프레임이 우세하든 동아시아의 안보 구조는 국회에서 단 한나절 만에 다시 쓰였습니다."
 JAP_news.04.a: "도쿄의 평화주의 시대는 끝났다."
 JAP_seismic_retrofit: "내진 보강"
 JAP_seismic_retrofit_desc: "이 지역의 모든 구조물은 큰 지진을 견디도록 조사되고, 보강되거나 재건되었습니다. 병원은 면진 장치 위에 서 있고, 오래된 학교는 보강되거나 철거되었으며, 고속도로 교각에는 강철 띠가 둘러져 있습니다. 더 엄격한 기준, 의무 검사, 더 무거운 기초는 모든 신규 사업을 늦추지만, 다음 지진은 이 지역에 도로 몇 개 이상의 손실을 입히지 못할 것입니다."
 JAP_seismic_retrofit_category: "내진 보강"
 JAP_seismic_retrofit_category_desc: "지역을 내진화하는 일은 현 단위로, 건물 단위로 진행되는 십 년 규모의 토목 사업입니다. 보강된 지역도 여전히 흔들리지만, 지진이 닥쳐도 기반시설 일부만 잃을 뿐 공장과 기지는 버텨 내며, 그 대가로 더 엄격한 건축 기준 때문에 건설 속도가 영구적으로 느려집니다. 지진 위험 지역을 모두 보강하는 것은 §Y$JAP_ring_of_fire$§!을 해제하기 위한 두 가지 조건 중 하나입니다."
 JAP_seismic_retrofit_decision: "[FROM.GetName] 보강"
 JAP_seismic_retrofit_decision_desc: "지역 내 모든 구조물을 조사하여 현대적 내진 기준에 맞게 개선합니다. 1년간의 작업과 국가 생산량의 상당 부분이 소요되나, 지진 피해가 훨씬 가벼워지는 대신 지역 건설 속도가 지속적으로 둔화됩니다."
 JAP_zombie_companies_1: "좀비 기업"
 JAP_zombie_companies_1_desc: "수년간의 관용으로 수익성 없고 과다 채무를 진 기업들이 값싼 신용에 의지해 연명하며, 더 건전한 산업이 필요로 하는 자본, 노동력, 경영 역량을 묶어 두고 있습니다. 아무도 손실을 상각하지 않았고, 아무도 공장을 폐쇄하지 않았으며, 은행 체계의 얼마나 많은 부분이 허구인지 아무도 말하지 못합니다.\n-------------\n§Y기업 구조조정 진행도§!가 §G30§!에 도달하면 §Y$JAP_restructure_next_tranche$§!을(를) 시행하여 이 국가 정신을 한 단계 완화할 수 있습니다. 현재 수치는 §Y$JAP_corporate_reform_category$§!에서 확인하십시오."
 JAP_zombie_companies_2: "좀비 기업: 정리 단계"
 JAP_zombie_companies_2_desc: "첫 번째 분할 정리가 마무리되었습니다. 대출은 만기 연장 대신 상각되었고, 가장 심각한 부실 기업들은 법정 절차를 거쳤으며, 10년간 죽어 있던 자본이 다시 움직이고 있습니다. 남은 기업들은 규모가 더 크고, 더 긴밀히 연결되어 있으며, 손을 대기가 훨씬 어렵습니다.\n-------------\n§Y기업 구조조정 진행도§!가 §G60§!에 도달하면 §Y$JAP_restructure_next_tranche$§!을(를) 시행하여 이 국가 정신을 한 단계 더 완화할 수 있습니다. 현재 수치는 §Y$JAP_corporate_reform_category$§!에서 확인하십시오."
 JAP_zombie_companies_3: "좀비 기업: 마지막 장부"
 JAP_zombie_companies_3_desc: "이제 마지막 장부만이 열려 있습니다. 남은 기업들은 은행과의 관계가 가장 깊고 정치적 비호가 가장 두터운 곳들이며, 각자 자신을 겨냥한 정부보다 오래 살아남을 것이라 기대합니다. 더 넓은 경제에 대한 부담은 이제 크지 않지만 아직 사라지지는 않았습니다.\n-------------\n§Y기업 구조조정 진행도§!가 §G85§!에 도달하면 선택한 경로의 끝에 있는 해결 중점이 이 국가 정신을 영구히 §G제거§!합니다. 현재 수치는 §Y$JAP_corporate_reform_category$§!에서 확인하십시오."
 JAP_saburoku_audit_campaign: "사부로쿠 협정 감사"
 JAP_saburoku_audit_campaign_desc: "노동기준법 제36조는 기업이 노동자 대표와 협정을 맺어 신고하면 법정 8시간 근로를 초과할 수 있게 하는데, 수십 년간 이 협정에 적힌 상한은 고용주가 적고 싶은 대로였습니다. 이제 감독관들은 신고서를 가져와 출퇴근 기록, 출입증 기록, 건물 출입 데이터와 대조하며, 일하는 방식 개혁법은 월 45시간, 연 360시간이라는 비교 기준을 제시합니다."
 JAP_paid_leave_enforcement_campaign: "닷새 휴가 집행"
 JAP_paid_leave_enforcement_campaign_desc: "일본 노동자들에게는 연차가 주어졌으나 쓰는 사람은 눈에 띄었기에 쓰지 않았습니다. 2019년부터 의무는 반대편으로 향합니다. 직원이 열흘 이상의 휴가를 가진 고용주는 그중 닷새가 실제로 사용되도록 해야 하며, 노동자가 쓰지 않으면 직접 날짜를 지정해야 합니다. 노동성은 휴가 대장을 점검하고 장부상 휴가가 손대지 않은 채 남아 있는 기업에 벌금을 부과합니다."
 JAP_equal_pay_audit_campaign: "임금 격차 감사"
 JAP_equal_pay_audit_campaign_desc: "일본 노동자 열 명 중 네 명은 비정규직으로, 정규직 동료 옆에서 같은 일을 하면서 임금은 약 60퍼센트 수준이고 보너스는 전혀 받지 못합니다. 단시간·유기고용노동법은 요청이 있으면 대우 차이를 서면으로 설명하도록 고용주에게 의무를 지우며, 그 설명은 한 회사 안에서 묻히지 않고 산업 전체에서 수집되어 비교됩니다."
 JAP_inspector_sweep_campaign: "최악의 위반 기업 일제 단속"
 JAP_inspector_sweep_campaign_desc: "노동기준감독서는 한 업종을 골라 예고 없이 들이닥쳐 그 업종 모든 기업의 출퇴근 기록을 샅샅이 확인합니다. 노동성은 중대한 위반이 드러난 기업의 이름을 공표하는데, 이는 벌금보다 채용 담당자에게 훨씬 큰 타격이 됩니다. 명단을 읽은 졸업생은 지원하지 않기 때문입니다."
 JAP_keidanren_review_campaign: "헌장 준수 여부 검토"
 JAP_keidanren_review_campaign_desc: "게이단렌의 기업행동헌장은 회원사에 대부분이 감사하지 않고 아무도 공개하지 않는 근무 관행을 약속하게 합니다. 연합은 회원사별로 실질적인 결과가 따르는 준수 점검 주기를 운영하고 종합 결과를 노동성에 보고하도록 설득됩니다. 어떤 것도 의무가 아니고 어떤 기업도 이름이 공개되지 않으며, 바로 그 때문에 기업 집단들이 이에 동의합니다."
 JAP_shunto_wage_round_campaign: "춘투 임금 협상 지원"
 JAP_shunto_wage_round_campaign_desc: "해마다 봄이면 렌고 산하 노조들이 고용주에게 수치를 제시하고 고용주는 더 작은 수치로 응수하는데, 20년간 그 타결의 기본급 인상분은 0이었습니다. 정부는 기업 집단에 실질적인 인상을 양보하도록 압박합니다. 생활할 만큼 받는 노동자는 자신을 죽이는 초과근무를 하지 않게 되기 때문이며, 정부는 이 압박에 먼저 움직이는 기업에 대한 세금 감면을 병행합니다."
 JAP_health_stock_listing_campaign: "건강경영 선정 확대"
 JAP_health_stock_listing_campaign_desc: "노동성과 도쿄증권거래소는 직원을 소진시키지 않는 기업이 더 나은 장기 투자처라는 이론에 따라 매년 몇 개 상장사를 건강경영 우량 종목으로 공동 선정합니다. 선정 범위를 넓히고 평가 점수를 공개하면 직장 건강은 펀드 매니저가 가격을 매길 수 있는 대상이 되며, 이는 노동 감독관이 결코 닿지 못하는 이사회에 영향을 미칩니다."
 JAP_shift_rotation_campaign: "아침 근무제 보조금 지급"
 JAP_shift_rotation_campaign_desc: "근무일을 앞당기고, 늦은 시간 대신 이른 시간에 할증을 지급하며, 저녁에는 작업장의 전원을 끊어 남는 것이 선택지가 되지 않게 합니다. 이토추는 이를 시행하여 생산성이 올랐고 출산율도 함께 올랐음을 확인했습니다. 국가는 이제 따르려는 모든 기업에 전환 비용의 일부를 지급합니다."
 JAP_overcome_the_slump: "회복을 계속 밀어붙이다"
 JAP_overcome_the_slump_desc: "이미 시행 중인 조치들은 장부의 상당 부분을 움직여 공고히 할 만한 수준에 이르렀습니다. 한시적이라고 청구되던 지원은 기본 예산에 편입되고, 각 부처는 침체를 업무 전제로 삼는 것을 그만두며, 기업들은 수요가 유지될 것으로 기대된다는 점을 분명히 통보받습니다. 각 단계는 §Y$JAP_entrenched_demand_shortfall_idea_1$§!을(를) 한 단계씩 완화하며, 마지막에 이르면 긴 침체를 영구히 끝냅니다."
 JAP_demand_recovery_progress_tier_1_TT: "§Y수요 회복 진행도§!가 최소 §G30§!"
 JAP_demand_recovery_progress_tier_2_TT: "§Y수요 회복 진행도§!가 최소 §G60§!"
 JAP_demand_recovery_progress_complete_TT: "§Y수요 회복 진행도§!가 최소 §G85§!"
 JAP_demand_shortfall_resolved: "일본의 §Y수요 침체§!를 극복했습니다"
 JAP_restructure_next_tranche: "다음 분할분 정리"
 JAP_restructure_next_tranche_desc: "장부의 상당 부분이 처리되어 한 묶음을 영구히 종결할 수 있게 되었습니다. 감독 당국은 처리된 사례를 공표하고, 은행들은 미뤄 왔던 손실을 장부에 반영하며, 해당 분할분의 기업들은 건전해져 살아남거나 존재를 멈춥니다. 각 분할분은 §Y$JAP_zombie_companies$§!을(를) 한 단계씩 완화하며, 최종 정리는 선택한 경로의 끝에 있는 중점으로 이루어집니다."
 JAP_enforce_next_reforms: "다음 개혁 시행"
 JAP_enforce_next_reforms_desc: "이미 제정된 조치들을 의도로 남겨 두지 않고 시행합니다. 권고에 그쳤던 상한이 집행 가능해지고, 대기업을 위해 작성된 예외 조항이 좁혀지며, 감독 기관에는 자신이 발견한 것을 후속 조치할 인력이 주어집니다. 각 회차는 §Y$JAP_karoshi_crisis$§!을(를) 한 단계씩 완화하며, 위기는 선택한 경로의 끝에 있는 중점으로 영구히 해소됩니다."
 JAP_galapagos_drift_review_mission: "표준 격차"
 JAP_galapagos_drift_review_mission_desc: "경제산업성은 일본 규격이 고객이 사용하는 규격으로부터 얼마나 벗어났는지에 대한 상시 평가를 유지하며 30일마다 그 수치를 보고합니다. 보고서는 매번 이전보다 나쁜데, 아무것도 하지 않는 동안 괴리가 누적되고 인증 기관들이 계속 국내 조항을 먼저 쓰기 때문입니다. §Y개방성§!이 낮을수록 격차는 더 빨리 벌어지며, §G100§!에서는 더 이상 벌어지지 않습니다.\n-------------\n일본이 §Y$JAP_world_integration$§! 경로에서 §Y개방성§! §G85§!에 도달하면 평가는 영구히 종료됩니다. 다른 어떤 것도 이를 끝내지 못합니다."
 JAP_galapagos_cure_condition_TT: "§Y개방성§!이 §G85§! 이상(현재 [?JAP_galapagos_openness|Y0])이어서 §Y$JAP_galapagos_syndrome$§!이 해소됨"
 JAP_cool_japan_sphere_count_mission: "분기별 문화권 집계"
 JAP_cool_japan_sphere_count_mission_desc: "분기마다 창조산업진흥국은 일본의 영향력이 20퍼센트 이상인 모든 국가를 집계하여 그 총합을 수출 지표로 제출합니다. 무역 대표단은 이 명단을 기준으로 다음 분기를 계획하고, 이들을 따라 해외로 나가는 기업들은 대표단을 기준으로 계획합니다. 더 이상 커지지 않는 문화권은 더 이상 수익을 내지 않으며, 그 사실은 수익보다 먼저 이 집계에서만 드러납니다."
 JAP_cool_japan_sphere_count_step_tt: "§Y문화권§!: 지난 집계 기준 일본의 영향력이 §G20%§! 이상인 국가는 [?JAP_galapagos_sphere_count|Y0]개국입니다. 각 국가는 §G+1%§! §Y해외 영향력§!과 §G+0.2%§! §Y투자 수익률§!의 가치가 있으며, §Y$JAP_electronics_superpower$§!으로 절반만큼, §Y$JAP_home_electronics$§!으로 다시 4분의 1만큼 증가합니다."
 JAP_zombie_companies_resolved: "일본의 §Y좀비 기업§!이 완전히 정리되었습니다"
 JAP_corporate_restructuring_complete_TT: "§Y기업 구조조정 진행도§!가 최소 §G85§!"
 JAP_restructure_tranche_1_TT: "§Y기업 구조조정 진행도§!가 최소 §G30§!"
 JAP_restructure_tranche_2_TT: "§Y기업 구조조정 진행도§!가 최소 §G60§!"
 JAP_karoshi_wellbeing_tier_1_TT: "$JAP_worker_wellbeing$이(가) 최소 §G30§!"
 JAP_karoshi_wellbeing_tier_2_TT: "$JAP_worker_wellbeing$이(가) 최소 §G60§!"
 JAP_karoshi_wellbeing_complete_TT: "$JAP_worker_wellbeing$이(가) 최소 §G85§!"
 JAP_zombie_case_files_down_3_tt: "$JAP_case_files$: §R-3§!"
 JAP_zombie_case_files_downsize_tt: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 10"
 JAP_zombie_case_files_fusion_tt: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 3"
 JAP_zombie_case_choice_TT: "가능한 결과:\n\n기소:\n §G+2§! $JAP_case_files$\n§R+8§! $JAP_obstruction$\n\n조용한 구제:\n§G+1§! $JAP_case_files$\n§R+2§! $JAP_obstruction$\n\n묵인:\n §G-3§! $JAP_obstruction$"
 JAP_zombie_whitewash_penalty_TT: "은폐는 지금까지 수집한 §R사건 자료를 삭제§!하고 정리를 §R25%§! 늦춥니다. 두 방안 모두 상실되지는 않으며, 남은 사건은 여전히 다룰 수 있습니다"
 JAP_seismic_retrofit_tt: "£trigger_yes §Y내진 건축물§!"
 JAP_electronics_resilience_below_5_tt: "§Y전자 회복력§!이 §G5§! 미만임 (현재 [?JAP_electronics_resilience|Y0])"
 intellectual_platform_rejected: "중일한 지식인 플랫폼 거부됨"
 JAP_seek_permanent_unsc_seat: "유엔 안보리 상임이사국 진출 추진"
 JAP_seek_permanent_unsc_seat_desc: "일본의 경제적 영향력과 국제연합에 대한 기여는 국제 안보에서의 상임 역할을 정당화합니다. 이를 확보하려면 국제연합 체제 양원의 지속적인 로비와 승인이 필요합니다."
 JAP_zombie_probe_abandoned: "좀비 기업 조사 포기"
 JAP_electronics.300.t: "소니 에릭슨 설립"
 JAP_electronics.300.d_agreed: "에릭슨은 자사의 휴대전화 사업을 소니와 합치는 데 동의했습니다. 어느 회사도 혼자서는 노키아와 모토로라에 맞설 만큼 많은 전화기를 팔지 못하며, 합치면 스웨덴의 무선 공학과 일본의 소비자 디자인이 하나의 합작사에 담기게 됩니다. 소니는 이에 참여하거나, 이동통신을 그룹 안에 두고 홀로 갈 수 있습니다."
 JAP_electronics.300.d_alone: "소니가 제휴하기를 바랐던 스웨덴 휴대전화 사업은 다른 길을 택했습니다. 소니는 여전히 가능한 조건으로 이동통신 합작사를 세울 수 있으며, 아니면 휴대전화를 그룹 안에 두고 자신이 선두가 아닌 시장에서 더 작은 점유율을 받아들일 수 있습니다."
 JAP_electronics.300.a: "이동통신 합작사에 참여한다"
 JAP_electronics.300.b: "이동통신을 그룹 안에 둔다"
 JAP_electronics.301.t: "디지털 음악의 딜레마"
 JAP_electronics.301.d: "소니는 음악을 재생하는 하드웨어와 그 안을 채우는 카탈로그를 모두 소유하고 있으며, 두 부문은 정반대의 것을 원합니다. 카탈로그를 보호한다는 것은 청취자가 이미 쓰는 포맷을 거부하는 플레이어를 뜻합니다. 플레이어를 개방한다는 것은 음반 부문이 자사 기기가 남의 파일을 실어 나르는 것을 지켜본다는 뜻입니다."
 JAP_electronics.301.a: "자체 포맷으로 카탈로그를 보호한다"
 JAP_electronics.301.b: "사람들이 이미 가진 것에 플레이어를 개방한다"
 JAP_electronics.302.t: "플레이스테이션 3의 도박"
 JAP_electronics.302.d: "플레이스테이션 3은 소니가 IBM, 도시바와 함께 맨바닥에서 설계한 프로세서 셀을 중심으로 만들 수 있지만, 이는 프로그래밍이 어렵고 업계의 어떤 것과도 다릅니다. 그러면 콘솔은 소프트웨어가 따라잡기를 바라며 수년간 원가 이하로 팔릴 것입니다. 아니면 마이크로소프트가 Xbox 360을 만든 방식으로 더 빨리, 더 저렴하게 출시할 수 있습니다."
 JAP_electronics.302.a: "새로운 구조를 중심으로 기기를 만든다"
 JAP_electronics.302.b: "기존 방식의 콘솔을 만들어 더 빨리 출시한다"
 JAP_electronics.303.t: "하나의 소니"
 JAP_electronics.303.d: "소니의 부문들은 수십 년간 독자적으로 운영되어 왔고, 이는 서로 연동되지 않는 제품과 같은 공학이 네 번씩 중복되는 데서 드러납니다. 이들을 하나의 전략 아래 두는 것은 전에 옳았던 사람들의 뜻을 꺾는다는 뜻입니다. 그대로 두면 독립성이 일구어 낸 것을 지킵니다."
 JAP_electronics.303.a: "부문들을 하나의 전략 아래 둔다"
 JAP_electronics.303.b: "부문들의 독립성을 유지한다"
 JAP_electronics.304.t: "이미지 센서로의 전환"
 JAP_electronics.304.d: "소니의 이미지 센서는 소니가 경쟁하는 기업들이 만든 휴대전화 안에 들어 있으며, 수요는 공장이 감당하는 속도보다 빠르게 늘고 있습니다. 센서를 회사의 중심에 놓는다는 것은 소비자 부문에 약속되어 있던 자본을 뜻합니다. 그러지 않는다는 것은 가장 먼저 생산 능력을 갖추는 이에게 선두를 팔아넘긴다는 뜻입니다."
 JAP_electronics.304.a: "이미지 센서를 회사의 중심으로 삼는다"
 JAP_electronics.304.b: "자본을 소비자 제품에 유지한다"
 JAP_electronics.305.t: "소니가 된 것"
 JAP_electronics.305.d: "사반세기에 걸친 벤처, 포맷, 구조, 구조조정은 소니가 무엇이며 일본 가전이 무엇을 위한 것인지를 정리했습니다. 한때 제품을 팔던 회사는 이제 다른 모두의 제품 안에 들어가는 부품을 공급합니다."
 JAP_electronics.305.a: "하드웨어, 콘텐츠, 서비스를 아우르는 하나의 기업"
 JAP_electronics.305.b: "하드웨어 사업의 연합체"
 JAP_electronics.305.c: "주권적 컴퓨팅 구조"
 JAP_electronics.305.e: "열린 디지털 공동체"
 JAP_sony_one_sony_ecosystem: "하나의 소니"
 JAP_sony_one_sony_ecosystem_desc: "부문들은 하나의 전략에 응답하며, 센서, 카탈로그, 콘솔, 서비스는 같은 예산을 두고 경쟁하는 대신 서로를 강화하도록 만들어졌습니다. 조율은 속도에서 대가를 치르지만, 모든 것이 하나로 출시된다는 점에서 이를 되돌려 줍니다."
 JAP_sony_hardware_federation: "하드웨어 연합"
 JAP_sony_hardware_federation_desc: "부문들은 독립성을 유지했고 각자 자기 분야에서 막강해졌습니다. 소니가 만드는 어떤 것도 소니의 나머지 부분을 염두에 두고 설계되지 않았으며, 그 하나하나는 매우 훌륭합니다."
 JAP_sony_cell_sovereign_compute: "주권적 컴퓨팅 구조"
 JAP_sony_cell_sovereign_compute_desc: "일본은 독자적인 프로세서 아키텍처를 구축했고 그 대가를 콘솔 한 세대로 치렀습니다. 업계가 그 프로그래밍을 통해 얻은 교훈은 그것을 실었던 기기보다 오래 살아남았습니다."
 JAP_sony_open_digital_commonwealth: "개방형 디지털 연합"
 JAP_sony_open_digital_commonwealth_desc: "규격이 개방되고 카탈로그가 널리 퍼졌으며, 하드웨어는 사람들이 이미 가진 기기와 더 이상 충돌하지 않게 되었습니다. 소니는 기기당 수익이 줄었지만 제품은 훨씬 더 많은 사람의 손에 들어가 있습니다."
 JAP_electronics.310.t: "두 개의 화면, 두 개의 기기"
 JAP_electronics.310.d: "닌텐도의 게임보이 어드밴스와 게임큐브는 팀도, 아키텍처도, 라이브러리도 따로이며, 모든 게임은 둘 중 하나를 위해서만 만들어야 합니다. 둘 다 유지한다는 것은 한 회사가 두 개의 플랫폼에 자금을 댄다는 뜻입니다. 둘을 합치면 나머지 모든 사업을 떠받치는 휴대용 게임기 사업이 끝나게 됩니다."
 JAP_electronics.310.a: "휴대용 게임기와 콘솔 모두에 투자한다"
 JAP_electronics.310.b: "하나의 플랫폼에 모든 역량을 집중한다"
 JAP_electronics.311.t: "Wii와 더 넓은 소비층"
 JAP_electronics.311.d: "닌텐도의 차세대 콘솔은 콘솔을 사지 않는 사람들을 노릴 수 있습니다. 더 저렴한 하드웨어와 아무도 출시한 적 없는 조작 방식을 내세우되, 언론이 평가하는 그래픽 성능은 포기하는 것입니다. 아니면 업계가 이미 합의한 기준에 따라 소니, 마이크로소프트와 맞붙어 그 기준으로 평가받을 수도 있습니다."
 JAP_electronics.311.a: "콘솔을 사지 않는 사람들을 위해 만든다"
 JAP_electronics.311.b: "성능으로 경쟁한다"
 JAP_electronics.312.t: "설명할 수 없는 Wii U"
 JAP_electronics.312.d: "신형 콘솔은 판매가 몹시 부진하여 아무도 묻고 싶지 않았던 질문을 불러왔습니다. 닌텐도가 과연 하드웨어를 만들어야 하는가 하는 질문입니다. 소프트웨어는 어느 기기에서든 팔릴 것이고 손실도 멈출 것입니다. 하드웨어에 남는다는 것은 직전 세대의 실패를 발판으로 또 한 세대에 자금을 댄다는 뜻입니다."
 JAP_electronics.312.a: "하드웨어에 남아 다음 세대에 투자한다"
 JAP_electronics.312.b: "하드웨어를 떠나 게임을 모든 곳에 공급한다"
 JAP_electronics.313.t: "닌텐도와 휴대전화"
 JAP_electronics.313.d: "닌텐도의 캐릭터는 하드웨어보다 가치가 높으며, 세계의 모든 휴대전화가 그 캐릭터를 실을 수 있습니다. 캐릭터를 라이선스하면 콘솔이 닿지 못한 소비층에서 수익을 올릴 수 있습니다. 거부하면 닌텐도가 통제하는 기기에서만 캐릭터를 즐길 수 있게 되며, 사람들이 그 기기를 사는 이유가 바로 그것입니다."
 JAP_electronics.313.a: "캐릭터를 모바일에 라이선스한다"
 JAP_electronics.313.b: "자사 하드웨어 독점으로 유지한다"
 JAP_electronics.314.t: "스위치"
 JAP_electronics.314.d: "휴대용 게임기이자 콘솔인 기기 하나는 20년 동안 회사의 엔지니어링을 갈라놓았던 분열을 끝낼 것입니다. 그것은 하나의 라이브러리, 하나의 팀을 뜻하며, 실패하면 단 한 번의 실패로 끝난다는 뜻이기도 합니다. 두 라인을 분리해 유지하는 것은 닌텐도가 잘 아는 방식입니다."
 JAP_electronics.314.a: "둘을 겸하는 하나의 기기를 만든다"
 JAP_electronics.314.b: "휴대용 게임기와 콘솔을 분리해 유지한다"
 JAP_electronics.315.t: "닌텐도가 된 모습"
 JAP_electronics.315.d: "4반세기 동안 다른 누구도 만들지 않았을 하드웨어를 만들어 온 끝에, 닌텐도가 무엇이며 일본 엔터테인먼트의 얼마나 많은 부분이 닌텐도를 통해 움직이는지가 정해졌습니다. 캐릭터는 자신을 실었던 모든 기기보다 오래 살아남았습니다."
 JAP_electronics.315.a: "절제된 하이브리드 플랫폼"
 JAP_electronics.315.b: "통합 엔터테인먼트 생태계"
 JAP_electronics.315.c: "세계적인 캐릭터 라이선스 사업자"
 JAP_electronics.315.e: "개방형 개발자 연합"
 JAP_nintendo_disciplined_hybrid_platform: "절제된 하이브리드 플랫폼"
 JAP_nintendo_disciplined_hybrid_platform_desc: "하나의 기기, 하나의 라이브러리, 그리고 그 둘을 뒷받침하는 하나의 엔지니어링 조직입니다. 닌텐도는 다른 모든 업체가 내세우는 사양 경쟁을 그만두고, 판매가보다 제작비가 낮은 하드웨어를 내놓기 시작했습니다."
 JAP_nintendo_integrated_entertainment_ecosystem: "통합 엔터테인먼트 생태계"
 JAP_nintendo_integrated_entertainment_ecosystem_desc: "캐릭터는 기기만큼이나 테마파크, 영화, 상품을 통해서도 퍼져 나가며, 각 부문이 서로를 팔아 줍니다. 일본 엔터테인먼트 수출은 여전히 한 회사가 온전히 소유한 지적 재산에 기대고 있습니다."
 JAP_nintendo_global_ip_licensor: "세계적인 라이선스 사업자"
 JAP_nintendo_global_ip_licensor_desc: "하드웨어는 여러 유통 경로 가운데 하나가 되었습니다. 닌텐도는 자사가 만들지 않는 기기에 캐릭터가 등장하는 것, 그리고 자사 콘솔이 닿지 못한 시장에서 수익을 얻습니다."
 JAP_nintendo_open_developer_commonwealth: "개방형 개발자 연합"
 JAP_nintendo_open_developer_commonwealth_desc: "플랫폼은 사전 허가를 요구하지 않는 조건으로 개발자에게 개방되었습니다. 닌텐도는 훨씬 커진 카탈로그에서 더 작은 몫을 가져가며, 기기에는 닌텐도가 결코 의뢰하지 않았을 작품들이 실립니다."
