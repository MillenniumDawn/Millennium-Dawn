 EGY_evergreen_category: "에버그로 에버그린 비료 무역"
 EGY_evergreen_category_desc: "이집트의 선도적인 비료 기업 에버그로는 농업 지형을 혁신할 최신 제품 에버그린을 자랑스럽게 선보입니다. 최첨단 비료 배합인 에버그린은 첨단 영양소 기술을 활용하여 작물 수확량을 최적화하고 토양 건강을 증진합니다. 지속 가능한 농업에 대한 의지를 바탕으로, 에버그로는 에버그린의 모든 알갱이에 정밀함과 친환경적 방식이 담겨 있음을 보장합니다. 이집트의 농업 전문성을 활용하여 에버그린은 이제 전 세계의 농지를 풍요롭게 할 준비를 마쳤으며, 기업은 전략적 수출을 통해 자신 있게 영역을 넓혀 전 세계 농민들에게 더 건강하고 더 강인한 작물을 재배할 강력한 해법을 제공하고 있습니다.\n\n무역에서 얻는 수입은 체결한 계약 수에 10퍼센트를 곱한 값으로 결정됩니다.\n§Y현재 비료 계약:§! [?current_evergreen_capacity]/[?current_max_evergreen_capacity]\n§Y비료 상한:§! [?current_max_evergreen_capacity]/[?max_evergreen_capacity]"
 EGY_can_send_evergreen_mission_TT: "무역 사절단을 보내도 §Y현재 비료 상한§!을 초과하지 않습니다 (§Y현재 비료 상한:§! [?current_evergreen_capacity]/[?current_max_evergreen_capacity])\n"
 EGY_evergreen_fertilizers_idea: "화학 비료 접근성"
 EGY_evergreen_fertilizers_idea_desc: "화학 비료는 특히 기후가 열악한 곳에서 좋은 작황을 위해 필수적입니다."
 EGY_evergreen_fertilizers_income: "에버그린 비료"
 EGY_evergreen_fertilizers_income_desc: "에버그린은 세계 여러 나라에 제품을 성공적으로 판매하며 우리나라에 훌륭한 판매 수입을 가져다줍니다"
