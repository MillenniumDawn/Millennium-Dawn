 state_based_investments_screen_delayed_tt: "아래 메뉴는 [THIS.GetName]에서 다양한 개발을 장려하기 위해 취할 수 있는 여러 결정입니다. 투자 버튼을 마우스 오른쪽 버튼으로 클릭하면 자동 반복 대상으로 선택됩니다. 선택한 투자를 처리하려면 자동화 설정에서 §Y선택한 내부 투자 반복§!을 활성화하십시오.\n\n모든 국가는 전국의 어느 주에서든 사용할 수 있는 슬롯을 최소 두 개 보유합니다. 한 주에서 여러 프로젝트를 진행할 수도 있고, 프로젝트를 전국에 분산할 수도 있습니다. 국가의 §Y강대국 순위§!를 높이면 슬롯을 추가로 얻을 수 있습니다.\n\n강대국 순위별 슬롯:\n- §Y초강대국§!: 6\n- §Y강대국§!: 5\n- §Y주요 강국§!: 4\n- §Y지역 강국§!: 3\n"
 available_internal_investments_screen_tt: "사용 가능한 §H내부 투자§! 슬롯: [current_soi_count] / [?ROOT.modifier@internal_investment_slot_number|0]"
 available_internal_investments_tt: "모든 국가는 전국의 어느 주에서든 사용할 수 있는 슬롯을 최소 두 개 보유합니다. 한 주에서 여러 프로젝트를 진행할 수도 있고, 프로젝트를 전국에 분산할 수도 있습니다. 국가의 §Y강대국 순위§!를 높이면 슬롯을 추가로 얻을 수 있습니다.\n\n진행 중인 프로젝트:\n[ROOT.soi_timer_6][ROOT.soi_timer_5][ROOT.soi_timer_4][ROOT.soi_timer_3][ROOT.soi_timer_2][ROOT.soi_timer_1]"
