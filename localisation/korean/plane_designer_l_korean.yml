 air_tech_gunship_railgun_4: "레일건 건십 V"
 air_tech_gunship_railgun_4_desc: "차세대 설계는 전력 효율과 열 안정성을 최적화하고 첨단 표적 지정 및 전자전 저항 능력을 통합합니다. 이로써 레일건 건십은 분쟁 지역 공역에서도 생존하며 다층 방어를 해체할 수 있는 지속적이고 치명적인 플랫폼이 되지만, 주요 강대국만이 감당할 수 있는 가격이 따릅니다."
 air_tech_gunship_railgun_5: "레일건 건십 VI"
