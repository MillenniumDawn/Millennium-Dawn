l_english:

 ASEAN_decisions: "ASEAN"
 ASEAN_decisions_desc: "The Association of Southeast Asian Nations was founded in Bangkok in 1967 and has ten member states. Its Secretariat is in Jakarta. The 2007 Charter organises the Association's work into three Communities: Political-Security, Economic and Socio-Cultural. Article 20 makes consultation and consensus the basis of decision-making, so no member is bound by a measure it has not agreed to.\n\n§HOur standing§!\nSeat: [ASEAN_own_standing]\nBreach points: §Y[?ASEAN_breach|0]§!\nSuspension: [ASEAN_suspension_status]\nThis year's chair: [ASEAN_chair_status]\nCohesion: [ASEAN_cohesion_status]\n\n§HThe membership§!\n[?global.ASEAN_committed_count|0] §GCommitted§! (0 to 1 points)\n[?global.ASEAN_drifting_count|0] §YDrifting§! (2 to 3 points)\n[?global.ASEAN_detached_count|0] §ODetached§! (4 to 5 points)\n[?global.ASEAN_estranged_count|0] §REstranged§! (6 or more)\n\n§HHow standing is scored§!\nThe Secretariat rescores every member once a month. Points cannot total less than zero.\n§R+3§! At war with another member\n§R+2§! A civil war is under way\n§R+2§! A coup succeeded within the last two years\n§R+2§! Suspended from the summits\n§R+1§! Elections are not held\n§R+1§! Stability below 30%\n§R+1§! A formal objection stands against us\n§R+1§! Condemned by another member\n§R+1§! Corruption at level 6 or worse\n§G-1§! At peace with stability above 65%\n§G-2§! At peace with stability above 80%\n\n§HMembership rules§!\n§GCommitted§!: votes at the summit, may take the chair, and may use every decision listed here.\n§YDrifting§!: keeps the shared focus tree. The membership spirit pays less on every line.\n§ODetached§!: loses the shared focus tree. Only the political power and interest rate lines remain.\n§REstranged§!: keeps the seat. The spirit carries no benefit.\n\nA member on 4 points or more may be referred to a suspension ballot, as may any member that has suffered a coup in the last two years or that is at war with another member."

 ASEAN_accession_decisions: "ASEAN Accession"
 ASEAN_accession_decisions_desc: "Article 6 of the Charter sets out admission. An applicant must be located in Southeast Asia, be recognised by every sitting member, accept the obligations of the Charter, and be admitted by consensus. In practice the members endorse a candidacy first, and the chair issues the invitation once four capitals have signed on. Any Committed member may enter a formal block, which withdraws an endorsement from the file. The admissions of Vietnam in 1995, Laos and Myanmar in 1997 and Cambodia in 1999 each followed years of preparation.\n\n§HOpen application§!\nEndorsements: §Y[?global.ASEAN_membership_endorsements|0]§! of 4 required\n\n§HStanding candidacies§!\nTimor-Leste: §Y[?global.ASEAN_endorsements_TIM|0]§!\nPapua New Guinea: §Y[?global.ASEAN_endorsements_PAP|0]§!"

 ASEAN_standing_committed: "§GCommitted§!"
 ASEAN_standing_drifting: "§YDrifting§!"
 ASEAN_standing_detached: "§ODetached§!"
 ASEAN_standing_estranged: "§ROne foot out§!"
 ASEAN_standing_none: "§RNot a member§!"

 ASEAN_suspension_yes: "§RSuspended from the summits§!"
 ASEAN_suspension_no: "§GIn good standing§!"

 ASEAN_chair_yes: "§GWe hold the chair§!"
 ASEAN_chair_named: "§Y[?global.ASEAN_chair.GetName]§!"
 ASEAN_chair_none: "No summit convened this year"

 ASEAN_cohesion_at_risk: "§RFracture risk§!"
 ASEAN_cohesion_stable: "§GStable§!"

 ASEAN_mediation_rounds_left_tt: "We have run §Y[?ASEAN_mediation_rounds|0]§! of 3 permitted rounds of mediation"
 ASEAN_harmonisation_rounds_left_tt: "We have run §Y[?ASEAN_harmonisation_rounds|0]§! of 3 permitted harmonisation drives"
 ASEAN_grid_rounds_left_tt: "We have funded §Y[?ASEAN_grid_rounds|0]§! of 3 permitted grid expansions"

 ASEAN_chinese_credit_line: "Draw on the Chinese Credit Line"
 ASEAN_chinese_credit_line_desc: "Request a tranche from Beijing on the terms our alignment secured. Disbursement is quick and the contractors arrive with it. The loan is a matter of public record in Washington as much as here."

 ASEAN_american_security_assistance: "Request American Security Assistance"
 ASEAN_american_security_assistance_desc: "Apply for a training and equipment package on the terms our alignment secured. American instructors work alongside our formations for six months and the exercise cycle shortens. The deployment is a matter of public record in Beijing as much as here."

 ASEAN_apply_membership: "Apply for Membership"
 ASEAN_apply_membership_desc: "Submit our formal application. The chair will send it to the ten capitals. The vote will take time, and consensus lets any one of those capitals bury the file without a public fight."

 ASEAN_application_already_open_tt: "One membership application is already before the chair. The Secretariat will not open a second file until that one is resolved."

 ASEAN_endorse_applicant: "Endorse the Applicant"
 ASEAN_endorse_applicant_desc: "Add our capital's endorsement to the sitting application. Each endorsement leaves the sceptics less room. One blocker can still stop the vote."

 ASEAN_invite_applicant: "Invite the Applicant"
 ASEAN_invite_applicant_desc: "With enough endorsements in hand, send the formal invitation from the chair. The applicant receives the summit letter and can accept or decline on its own timeline."

 ASEAN_block_applicant: "Block the Applicant"
 ASEAN_block_applicant_desc: "Place our objection against the sitting application. Consensus requires our consent, and we have the right to withhold it. The reasons we put on the record must stay defensible for as long as the bid remains open."

 ASEAN_leave_organisation: "Withdraw from ASEAN"
 ASEAN_leave_organisation_desc: "File notice of departure with the Secretariat. Membership ends on the effective date. Shared benefits, the safety net, and the seat at the table end with it. We would wait three years before we could apply again, if the members would still accept an application."

 ASEAN_lodge_objection: "Lodge a Formal Objection"
 ASEAN_lodge_objection_desc: "Enter a formal objection against [FROM.GetNameDef] in the summit record. It counts as a breach against their standing for six months, or until we withdraw it. The rest of the membership will hold the broken consensus against us, and so will the government we name."

 ASEAN_withdraw_objection: "Withdraw Our Objection"
 ASEAN_withdraw_objection_desc: "Strike our objection to [FROM.GetNameDef] from the summit record before it lapses. The breach against their standing is lifted at once and relations recover. Only the government that entered an objection may withdraw it."

 ASEAN_engage_member: "Extend an Engagement Offer"
 ASEAN_engage_member_desc: "Open a private demarche with [FROM.GetNameDef] and offer terms their government can accept without losing face. If they take the offer, the objections and condemnations standing against them are struck from the summit record and their standing is rescored at once."

 ASEAN_propose_summit: "Convene the Annual Summit"
 ASEAN_propose_summit_desc: "Open the year's summit at the appointed venue. Ministers arrive with prepared statements and with bilateral meetings they have not scheduled in public. The summit mandate resets for the year. The Association's largest act this year will take place in the room this decision opens."

 ASEAN_mediate_dispute: "Offer Mediation"
 ASEAN_mediate_dispute_desc: "Offer the Secretariat's good offices to the two members in dispute. Use formal mediation under the Enhanced Dispute Settlement Protocol. The process produces a written finding, not a binding award. We spend political capital by standing between the two parties."

 ASEAN_arbitrate_dispute: "Refer to the Court"
 ASEAN_arbitrate_dispute_desc: "Refer the dispute to the Court. The ruling is written, binding, and not subject to appeal. The claimant wins or loses on the merits, and the other capitals will read the ruling on the record. Neither party can leave afterwards and treat the result as unofficial."

 ASEAN_humanitarian_access: "Demand Humanitarian Access"
 ASEAN_humanitarian_access_desc: "Use Flexible Engagement authority to demand AHA access to the affected member's territory. Non-interference stretches far enough to let relief workers in. It does not stretch beyond that, and their government knows the limit."

 ASEAN_opt_in_cept: "Ratify the Revised CEPT"
 ASEAN_opt_in_cept_desc: "Sign our capital onto the new tariff schedule. Duties fall on the agreed list, the exemptions we bargained for stay in the annex, and customs officers receive the new codes by the end of the quarter."

 ASEAN_opt_in_atiga: "Ratify ATIGA"
 ASEAN_opt_in_atiga_desc: "Cut our intra-bloc tariffs to zero on the agreed schedule. The industries that lobbied for sensitive-list status received it. The industries that did not will face a harder year."

 ASEAN_opt_in_cmim: "Sign the Chiang Mai Facility"
 ASEAN_opt_in_cmim_desc: "Deposit our share in the common pool and open our line of credit against it. The rate beats the IMF rate and the surveillance is lighter. The facility still has a cost."

 ASEAN_opt_in_currency: "Adopt the ACU"
 ASEAN_opt_in_currency_desc: "Peg to the Asian Currency Unit, converge to it, and retire the local currency in the appointed year. The central bank keeps its building and loses its independence. Trade denomination then has a regional answer."

 ASEAN_call_suspension_vote: "Call a Suspension Vote"
 ASEAN_call_suspension_vote_desc: "Refer [FROM.GetNameDef]'s conduct to the summit for a suspension ballot. Every other member votes. The procedure follows the Myanmar model whether or not Myanmar is the present target. Our default vote is for suspension."

 ASEAN_suspension_vote_already_open_tt: "A suspension ballot is already before the summit. The chair will not open a second motion until that one is resolved."

 ASEAN_veto_suspension: "Veto the Suspension"
 ASEAN_veto_suspension_desc: "Cast our vote against the ballot. Our patron will notice, and so will the other members. The government under the motion will remember the vote longer than either of them."

 ASEAN_lift_suspension: "Move to Reintegrate"
 ASEAN_lift_suspension_desc: "Table a motion to lift the suspension. The resolution will cite the conditions the suspended government has met. The debate will cover the conditions it has not met."

 ASEAN_endorse_TIM: "Endorse Timor-Leste"
 ASEAN_endorse_TIM_desc: "Add our capital's endorsement to Timor-Leste's bid. Each endorsement leaves the sceptics less room. One blocker can still stop the vote."

 ASEAN_invite_TIM: "Invite Timor-Leste"
 ASEAN_invite_TIM_desc: "With every endorsement in hand, send the formal invitation from the chair. Timor-Leste receives the summit letter and can accept or decline on its own timeline."

 ASEAN_block_TIM: "Block Timor-Leste"
 ASEAN_block_TIM_desc: "Place our objection against Timor-Leste's accession. Consensus requires our consent, and we have the right to withhold it. The reasons we put on the record must stay defensible for as long as the bid remains open."

 ASEAN_endorse_PAP: "Endorse Papua New Guinea"
 ASEAN_endorse_PAP_desc: "Add our capital's endorsement to Papua New Guinea's bid. Each endorsement leaves the sceptics less room. One blocker can still stop the vote."

 ASEAN_invite_PAP: "Invite Papua New Guinea"
 ASEAN_invite_PAP_desc: "With every endorsement in hand, send the formal invitation from the chair. Papua New Guinea receives the summit letter and can accept or decline on its own timeline."

 ASEAN_block_PAP: "Block Papua New Guinea"
 ASEAN_block_PAP_desc: "Place our objection against Papua New Guinea's accession. Consensus requires our consent, and we have the right to withhold it. The reasons we put on the record must stay defensible for as long as the bid remains open."

 ASEAN_offer_joint_exercise: "Offer a Joint Exercise"
 ASEAN_offer_joint_exercise_desc: "Propose a joint military exercise with [FROM.GetNameDef] under the ADMM framework. Our own defence ministry covers the costs of hosting and travel, and the other capital decides whether to accept."

 ASEAN_domestic_arms_expansion: "Expand Domestic Arms Production"
 ASEAN_domestic_arms_expansion_desc: "Direct state investment into our own arms industry instead of buying from either patron. Production runs faster while the programme is underway, and it leaves us less exposed to any foreign supplier's terms."

 ASEAN_offer_ct_cooperation: "Offer Counterterrorism Cooperation"
 ASEAN_offer_ct_cooperation_desc: "Extend a counterterrorism partnership to [FROM.GetNameDef] under the Convention on Counter Terrorism. Shared watchlists and a direct liaison line lower the cost of running our own police and internal security services, if the offer is accepted."

 ASEAN_condemn_junta: "Condemn the Junta"
 ASEAN_condemn_junta_desc: "Issue a formal condemnation of the coup in [FROM.GetNameDef] under Flexible Engagement authority. Washington, Tokyo, Seoul, and London take note of where we stand, and the condemnation counts against [FROM.GetNameDef]'s standing at the summit for six months."

 ASEAN_breach_recorded_tt: "The condemnation is entered against [FROM.GetNameDef]'s standing. It counts as a breach for six months."

 ASEAN_customs_harmonisation_drive: "Launch a Customs Harmonisation Drive"
 ASEAN_customs_harmonisation_drive_desc: "Fund the rollout of harmonised customs codes and the Single Window across our ports. Clearance times fall, and our paperwork lines up with what every other member's customs office already uses."

 ASEAN_grid_expansion: "Expand the Power Grid"
 ASEAN_grid_expansion_desc: "Fund cross-border transmission lines and connect two of our provinces to the ASEAN Power Grid. New capacity comes online at each site, and the regional link takes some of the pressure off our own consumer-goods bill."

 ASEAN_release_infrastructure_fund_round: "Release an Infrastructure Fund Round"
 ASEAN_release_infrastructure_fund_round_desc: "Call on the pooled infrastructure fund built up under the Power Grid and the Singapore-Kunming Rail Link. Every current member draws a tranche and puts it straight into ongoing road, rail, and grid work."
 ASEAN_infrastructure_fund_round_tt: "The following will execute for every §HASEAN member state§!:\n"
