l_korean:
 CSTO.1.t: "[From.GetNameDef]의 CSTO 가입 요청"
 CSTO.1.d: "[From.GetAdjective] delegations have come forth with an interesting proposition. The delegation is explaining how [From.GetNameDef] wishes to sign the joint agreements and become a part of the CSTO. They are requesting a hearing to begin the process of signing a new declaration of friendship and allowing [From.GetNameDef]'s entrance into our alliance."
 CSTO.1.a: "당연히"
 CSTO.1.b: "절대 안된다"
 CSTO.2.t: "[SOV.GetNameDef]의 CSTO 가입 요청 거부"
 CSTO.2.d: "[SOV.GetNameDef]가(이) 우리의 CSTO 가입 요청을 거절했습니다."
 CSTO.2.a: "실망스럽군."
 CSTO.3.t: "CSTO로의 초대"
 CSTO.3.d: "[SOV.GetNameDef] and their allies want to invite us into the CSTO. What are we going to do?"
 CSTO.3.a: "받아들인다!"
 CSTO.3.b: "여기에 신경 쓸 시간이 없다."
 CSTO.4.t: "[ROOT.GetNameDef]의 CSTO 가입"
 CSTO.4.d: "오늘 [SOV.GetNameDef]와(과) [ROOT.GetNameDef]은(는) [ROOT.GetNameDef]의 집단 안보 조약 기구 가입을 공표하였습니다. [SOV.GetNameDef]와(과) [ROOT.GetNameDef]은(는) 그들의 경쟁국은 제쳐두고 [ROOT.GetNameDef]가(이) 그들의 동맹에 가입했다는 사실이 그들의 가장 큰 관심거리라고 결정했습니다."
 CSTO.4.a: "멋진 날이군!"
 CSTO.4.b: "새로운 동맹"
 CSTO.4.c: "흥미로운 전개로군."
 CSTO.5.t: "[ROOT.GetNameDef]가(이) CSTO를 떠났습니다!"
 CSTO.5.d: "오늘, [ROOT.GetNameDef]의 지도자, [ROOT.GetLeader]은(는) 집단 안보 조약 기구와 산하 동맹국들로부터 즉시 탈퇴하겠다는 국가의 의도를 발표하였습니다. 이것은 군사 협정을 약화시킬 것입니다."
 CSTO.5.a: "좋은 선택이다"
 CSTO.5.b: "흥미롭군"
 CSTO.6.t: "CSTO가 본격적인 군사 동맹으로 거듭나다"
 CSTO.6.d: "[SOV.GetNameDef]이(가) 중대한 정책 전환으로, 집단안보조약기구를 완전한 공세적 군사 동맹으로 개편하겠다고 발표했습니다. 이제 회원국들은 방어전뿐만 아니라 동맹 지도국이 선포한 모든 전쟁에 참전할 의무를 지게 됩니다. 이는 [SOV.GetAdjective] 군사적 야망의 중대한 확대를 의미하며, 서방 강대국들 사이에서 우려를 불러일으켰습니다."
 CSTO.6.a: "우리는 모스크바와 함께한다"
 CSTO.6.b: "우려스러운 사태이다"
 CSTO_management: "CSTO 관리"
 SOV_convert_csto_to_offensive: "CSTO를 공세적 동맹으로 전환"
 SOV_convert_csto_to_offensive_desc: "현재 CSTO는 방어적 동맹으로 운영되고 있어, 회원국은 우리가 공격받을 때에만 참전하도록 소집될 수 있습니다. 조약을 개편하면 이를 회원국이 공세 작전을 포함한 우리의 모든 전쟁에 참전해야 하는 완전한 군사 동맹으로 전환할 수 있습니다. 이를 통해 우리가 개시하는 모든 분쟁에 동맹국과 괴뢰국을 소집할 수 있게 됩니다."
 SOV_csto_has_at_least_one_member_tt: "CSTO에 다른 회원국이 최소 한 곳 있음"