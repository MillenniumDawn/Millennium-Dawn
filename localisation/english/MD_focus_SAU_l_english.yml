 SAU_pipeline_transit_TUR_t3_desc: "Saudi oil crosses Turkey, and the transit fees swell the treasury. The pipeline lifts the nation's steel and chromium output. §GAdditional Income: $1.25B§!"
 SAU_pipeline_transit_YEM_t1: "Saudi Pipeline Transit (Tier I)"
 SAU_pipeline_transit_YEM_t1_desc: "Saudi oil crosses Yemen, and the transit fees swell the treasury. The pipeline lifts the nation's oil output. §GAdditional Income: $1.00B§!"
