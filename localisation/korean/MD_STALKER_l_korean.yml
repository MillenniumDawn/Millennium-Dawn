 STALKER_military_cordon_mandate: "[FROM.GetName]에 군사 봉쇄 승인"
 STALKER_military_cordon_mandate_desc: "군이 지역 세력들을 주도하면 외곽 경계선을 장악할 수 있습니다. 구역 하나에는 180일에 한 번만 세력 위임령을 내릴 수 있습니다. 군이 강력할수록 2022년의 최초 구역 봉쇄에 드는 비용이 줄어듭니다."
 STALKER_military_cordon_mandate_tt: "군 영향력이 §G5§!, 봉쇄가 §G15§! 상승합니다. 스토커 인구는 최대 §R8§!, 개발도는 최대 §R5§! 감소합니다."
 STALKER_ecologist_field_mandate: "[FROM.GetName]에 생태학자 현장 위임령 승인"
 STALKER_ecologist_field_mandate_desc: "생태학자들이 지역 세력들을 주도하면 이들의 현장 연구소가 외곽 경계선 안에서 활동할 수 있습니다. 구역 하나에는 180일에 한 번만 세력 위임령을 내릴 수 있습니다."
 STALKER_ecologist_field_mandate_tt: "생태학자 영향력이 §G5§!, 개발도가 §G10§! 상승합니다. 봉쇄는 최대 §R5§! 감소합니다. 국가 비축고에 아티팩트 §G2§!개가 추가됩니다."
 STALKER_issue_emission_shelter: "[FROM.GetName]에 방출 대피령 발령"
 STALKER_issue_emission_shelter_desc: "다음 대분출이 오기 전에 [FROM.GetName] 안의 모든 사람을 대피시키도록 명령합니다. 명령은 120일간 유효하며 다음 방출이 닥치면 소진됩니다."
 STALKER_issue_emission_shelter_tt: "[FROM.GetName]에서 다음 방출이 일어나도 안정도 손실이 줄고, 활동이 §Y10§! 대신 §Y4§!만 오르며, 돌연변이도 덜 늘어납니다."
 STALKER_field_medical_artifacts: "야전 의료용 아티팩트"
 STALKER_field_medical_artifacts_desc: "회수한 의료용 아티팩트를 병원에 지급합니다. 대부분은 병동이 안정을 찾습니다. 가끔은 아티팩트가 전혀 다른 일을 벌이기도 합니다."
 STALKER_field_medical_artifacts_tt: "아티팩트 §Y5§!개를 소모합니다. 180일 동안 매주 안정도가 오릅니다. §R15%§! 확률로 지급이 실패하며, 이 경우 대신 안정도가 §R3%§! 떨어집니다."
 STALKER_issue_psi_shielding: "정신파 차폐 지급"
 STALKER_issue_psi_shielding_desc: "회수한 정신파 아티팩트로 만든 차폐 장비를 수비대에 보급합니다. 다음 방출이 닥쳐도 차폐 없이 대분출을 맞았을 때처럼 나라가 흔들리지는 않을 것입니다."
 STALKER_issue_psi_shielding_tt: "아티팩트 §Y3§!개를 소모합니다. 180일 동안 방출로 인한 안정도 손실이 없습니다."
 STALKER_issue_psi_shielding_available_tt: "국가 비축고에 아티팩트가 최소 §Y3§!개 필요합니다."
 STALKER_psi_shielding: "정신파 차폐 장비가 이미 아군에 지급되었습니다."
 STALKER_medical_artifacts: "보급된 의료용 아티팩트"
 STALKER_medical_artifacts_desc: "수비대 진료소에 의료용 아티팩트가 배치되었습니다. 불량품이 섞여 있지 않은 한 나라는 매주 조금씩 안정을 찾아갑니다."
 STALKER_xlab_expedition: "[FROM.GetName]에 X-연구소 탐사 자금 지원"
 STALKER_xlab_expedition_desc: "스토커 안내인들을 고용해 구역 지하에 봉인된 소련 연구소로 향하는 과학 조사단을 이끌게 합니다.\n\n조사 단계: §Y[ROOT.STALKER_xlab_stage_name]§!\n다음 발견까지의 진척도: §Y[?ROOT.STALKER_xlab_progress|0]§! / 100\n스토커: §Y[?FROM.STALKER_zone_stalkers|0]§! | 개발도: §Y[?FROM.STALKER_zone_exploitation|0]§!"
 STALKER_xlab_expedition_tt: "조사 진척도가 §Y20§! 오르고, 구역의 §Y스토커§! 및 §Y개발도§! 1포인트마다 §Y0.1§!이 더해지며, §Y모놀리스§! 영향력 1포인트마다 §R0.2§!이 깎입니다(합계 최소 §Y5§!). §R25%§! 확률로 탐사대가 안내인을 잃어 §Y스토커§! 인구가 최대 §R5§! 감소합니다. 진척도가 §Y100§!에 이르면 조사가 다음 단계를 밝혀냅니다."
 STALKER_xlab_stage_reward_tt: "국가 비축고에 아티팩트 §G5§!개가 추가되고, X-연구소 발견 성과로 연구 속도가 §G+1%§! 오릅니다."
 STALKER_xlab_findings: "X-연구소 발견 성과"
 STALKER_xlab_findings_desc: "구역 지하의 소련 연구소에서 회수한 연구 자료입니다."
 STALKER.10.t: "X-18 연구소"
 STALKER.10.d: "우리 탐사대가 [STALKER_zone_name] 인근 어둠의 계곡, 버려진 공장 지하에서 봉인된 소련 연구소를 발견했습니다. 표식은 X-18뿐입니다. 상당 부분이 침수되었지만 살아남은 장비와 보관고의 아티팩트 표본은 소련이 만들었다고 인정한 그 어떤 것보다 수십 년은 앞서 있습니다."
 STALKER.10.a: "연구소를 샅샅이 털어라."
 STALKER.11.t: "프로젝트 X"
 STALKER.11.d: "얀타르의 X-16 연구소에 숨겨진 정신파 방사기가 스토커들을 정신 나간 방랑자로 만들고 있었습니다. 그 옆에서 나온 문서에는 이 장치를 만든 계획의 이름이 적혀 있었습니다. 프로젝트 X. 연구자들은 구역을 연구한 것이 아니라 정신권을 개조하려 했고, 구역은 그들의 실수였습니다."
 STALKER.11.a: "방사기를 정지시켜라."
 STALKER.12.t: "C-의식체"
 STALKER.12.d: "X-10 연구소는 북부 구역에 아무도 접근하지 못하게 막아 온 정신파 시설 브레인 스코처를 가동하고 있습니다. 이곳의 기록에는 C-의식체가 나옵니다. 서로의 정신을 연결하고, 그들이 정신권이라 부른 무언가와도 연결한 과학자들이었습니다. 구역, 방출, 모놀리스는 멈추지 않고 계속 돌아가는 실험의 부작용에 불과했습니다."
 STALKER.12.a: "브레인 스코처를 무력화하라."
 STALKER.13.t: "더 넓은 연결망"
 STALKER.13.d: "X-연구소 문서를 교차 대조하자 더 불길한 사실이 드러났습니다. 프로젝트 X의 자금, 인력, 장비는 구역에서 한참 떨어진 기관들을 거쳐 흘러갔으며, 그중 일부 경로는 아직 살아 있을지 모릅니다. 우리 분석관들은 자국을 포함한 여러 정부가 침투당했을 가능성이 있다고 봅니다."
 STALKER.13.a: "방첩 검토에 착수한다."
 STALKER.13.a_tt: "프로젝트 X의 잔존 경로를 찾기 위해 자국 부처와 연구 기관을 은밀히 점검하기 시작합니다. §Y180일§! 뒤에 결과가 보고됩니다."
 STALKER.13.b: "소수 인원만 알도록 한다."
 STALKER.13.b_tt: "조사 결과를 소수의 관료에게만 공개합니다. 1년 안에 유출될 확률이 §R40%§!입니다."
 STALKER.10.a_tt: "국가 비축고에 아티팩트 §G5§!개가 더 추가됩니다."
 STALKER.10.b: "봉인하고 경비를 세워라."
 STALKER.10.b_tt: "구역 §Y봉쇄§!가 §G10§! 상승합니다."
 STALKER.11.a_tt: "구역 §Y활동§!이 최대 §G10§! 감소합니다."
 STALKER.11.b: "연구용으로 계속 가동한다."
 STALKER.11.b_tt: "X-연구소 발견 성과로 연구 속도가 §G+1%§! 더 오릅니다. §Y스토커§! 인구는 최대 §R10§! 감소합니다."
 STALKER.12.a_tt: "정치력 §R50§!을 소모합니다. 북부 구역이 개방되어 §Y개발도§!가 §G10§! 오르고 §Y스토커§! 인구가 §Y10§! 늘어납니다."
 STALKER.12.b: "장벽으로 계속 가동시켜라."
 STALKER.12.b_tt: "구역 §Y봉쇄§!가 §G10§! 상승합니다."
 STALKER.14.t: "방첩 검토 결과 보고"
 STALKER.14.d_found: "우리 조사관들은 프로젝트 X의 자금이 한 연구 기관과 두 방위 산업체를 거쳐 아직 국가 봉급을 받는 관리들에게 닿는 경로를 추적했습니다. 이 연결망은 조용히 해체되었고, 이를 적발한 관리들 덕분에 정부는 얼마간 신망을 얻었습니다."
 STALKER.14.d_dead_end: "검토 결과 아무것도 찾지 못했습니다. 프로젝트 X의 경로가 오래전에 닫혔거나, 아직 그것을 운영하는 자가 조사관들이 쫓을 수 있는 수준을 넘어 흔적을 지운 것입니다."
 STALKER.14.a: "수고했다."
 STALKER.14.b: "파일은 계속 열어 둔다."
 STALKER.15.t: "X-연구소 문서 유출"
 STALKER.15.d: "기밀로 분류된 X-연구소 조사 결과의 일부가 외국 언론에 등장했습니다. 국민은 구역이 우연의 산물이 아니었음을 알게 되었고, 정부가 언제부터 알고 있었는지 따져 묻고 있습니다."
 STALKER.15.a: "전부 부인한다."
 STALKER_xlab_final_stage_reward_tt: "X-연구소 발견 성과로 연구 속도가 §G+1%§! 더 오릅니다."
 STALKER.14.a_tt: "MDST 침투도가 최대 §G20§! 감소합니다."
 STALKER_polar_artifact_study: "극지 아티팩트 연구"
 STALKER_polar_artifact_study_desc: "회수한 아티팩트를 우리 남극 기지로 보내 방사선 연구소에서 구역과 멀리 떨어진 곳에서 연구하게 합니다. 남극 조약은 이런 연구를 금지하며, 연구 중에 방문하는 감시관에게 발각될 것입니다."
 STALKER_polar_artifact_study_artifacts_tt: "아티팩트를 최소 §Y5§!개 보유해야 합니다."
 STALKER_polar_artifact_study_lab_tt: "남극 기지에서 §Y방사선 연구소§!가 가동 중이어야 합니다."
 STALKER_polar_artifact_study_tt: "아티팩트 §Y5§!개를 소모합니다.\n§Y180§!일 동안 연구 속도 §G+3%§!, 남극 기지 개선 진척도 §G+15%§!.\n연구 기간에 기지를 방문한 조약 감시관은 표본을 압수하고 불법 연구를 보고합니다.\n방사선 연구소가 가동을 멈추면 연구는 성과 없이 일찍 끝납니다."
 STALKER_polar_artifact_samples: "극지 아티팩트 표본"
 STALKER_polar_artifacts_returned_tt: "아티팩트 §Y3§!개를 비축고로 되돌립니다."
 STALKER.190.t: "차가운 표본, 선명한 결과"
 STALKER.190.d: "남극의 추위 속에서 여섯 달을 보내자 아티팩트의 활동이 둔해져 측정이 가능해졌습니다. 우리 물리학자들은 구역 인근의 어떤 연구소도 얻을 수 없던 측정값을 손에 넣었습니다. 이 성과를 원자로 계획에 쓸 수도 있고, 남은 표본을 본국으로 들여올 수도 있습니다."
 STALKER.190.a: "연구 성과를 원자로 연구에 투입한다."
 STALKER.190.b: "남은 표본을 본국으로 가져온다."
 STALKER.191.t: "조약 감시관, 남극에서 구역 아티팩트 발견"
 STALKER.191.d: "남극 조약 감시관들이 [FROM.GetAdjective] 연구 기지를 시찰하다가 방사선 연구소에서 구역에서 나온 아티팩트를 발견했습니다. 표본은 압수되었고, 조약은 이 연구를 불법 연구로 기록했습니다."
 STALKER.191.a: "얼음 땅조차 충분히 멀지 않았구나."
 STALKER_export_artifacts: "아티팩트 수출"
 STALKER_export_artifacts_desc: "국가 비축고의 물량 일부를 세계 시세로 해외 구매자에게 팔아넘깁니다.\n\n아티팩트 비축고: §Y[?ROOT.STALKER_artifact_stockpile|1]§!"
 STALKER_export_artifacts_available_tt: "국가 비축고에 아티팩트가 최소 §Y5§!개 있어야 합니다(현재 §Y[?ROOT.STALKER_artifact_stockpile|1]§!)."
 STALKER_export_artifacts_tt: "아티팩트 §Y5§!개를 개당 §G$[?global.STALKER_artifact_price|2]§!십억에 판매합니다. 수출할 때마다 세계 시세가 §Y$0.02§!십억 하락하며, 최저 §Y$0.10§!십억까지 내려갑니다. 시세는 매달 §Y$0.005§!십억씩 §Y$0.20§!십억 쪽으로 되돌아옵니다."
 STALKER_buy_market_artifacts: "해외 아티팩트 구매"
 STALKER_buy_market_artifacts_desc: "우리 연구소에서 쓸 아티팩트를 공개 시장에서 한꺼번에 사들입니다.\n\n공개 시장의 아티팩트: §Y[?global.STALKER_market_artifacts|0]§!"
 STALKER_buy_market_artifacts_available_tt: "공개 시장에 아티팩트가 최소 §Y5§!개 있어야 합니다(현재 §Y[?global.STALKER_market_artifacts|0]§!)."
 STALKER_buy_market_artifacts_treasury_tt: "국고로 아티팩트 §Y5§!개를 개당 §Y$[?global.STALKER_artifact_price|2]§!십억에 살 수 있어야 합니다."
 STALKER_buy_market_artifacts_tt: "아티팩트 §Y5§!개를 개당 §R$[?global.STALKER_artifact_price|2]§!십억에 구매합니다. §Y180일§! 동안 연구 속도가 §G+3%§! 오릅니다. 구매할 때마다 세계 시세가 §Y$0.02§!십억 상승하며, 최고 §Y$0.50§!십억까지 오릅니다. 시세는 매달 §Y$0.005§!십억씩 §Y$0.20§!십억 쪽으로 되돌아옵니다."
 STALKER_found_zone_consortium: "구역 연구 컨소시엄 설립"
 STALKER_found_zone_consortium_desc: "어느 정부도 혼자서 모든 구역을 연구할 수는 없습니다. 세계의 연구소들을 초청해 연구 성과를 공유합시다."
 STALKER_found_zone_consortium_tt: "새 컨소시엄에 가입하여 연구 속도가 §G+2%§! 오릅니다. 이후 모든 국가가 가입할 수 있으며, 회원국은 서로의 구역에 봉쇄 자금을 지원할 수 있습니다."
 STALKER_join_zone_consortium: "구역 연구 컨소시엄 가입"
 STALKER_join_zone_consortium_desc: "[?global.STALKER_consortium_founder.GetName]이(가) 설립한 컨소시엄에 우리의 구역 연구를 공유하고, 그 대가로 그쪽 연구에 접근합니다."
 STALKER_join_zone_consortium_tt: "연구 속도가 §G+2%§! 오르며, 다른 회원국이 보유한 구역의 봉쇄에 자금을 지원할 수 있습니다."
 STALKER_consortium_membership: "구역 연구 컨소시엄"
 STALKER_consortium_membership_desc: "우리 연구소는 이상 구역에서 얻은 성과를 컨소시엄의 다른 회원국과 공유합니다."
 STALKER_fund_consortium_containment: "[FROM.GetName]의 봉쇄 자금 지원"
 STALKER_fund_consortium_containment_desc: "컨소시엄 회원국이 보유한 구역의 외곽 경계 공사 비용을 대신 부담합니다."
 STALKER_fund_consortium_containment_tt: "GDP의 §Y0.4%§!가 소요됩니다. [FROM.GetName]의 §Y봉쇄§!가 §G10§! 오르고 §Y도적§! 영향력이 최대 §G5§! 줄어듭니다. 해당 구역의 통제국이 우리를 더 좋게 봅니다."
 STALKER.50.t: "구역 연구 컨소시엄 설립"
 STALKER.50.d: "[?global.STALKER_consortium_founder.GetName]이(가) 세계 곳곳에 나타나고 있는 이상 구역을 연구할 국제 컨소시엄을 설립했습니다. 회원국은 연구 성과를 공유하고 서로의 구역을 봉쇄하는 비용을 함께 부담합니다."
 STALKER.50.a: "과학이 구역을 따라잡을 날이 올지도 모른다."
 STALKER_establish_anomalous_materials_bureau: "이상 물질국 설립"
 STALKER_establish_anomalous_materials_bureau_desc: "회수한 아티팩트를 전담 산업 연구 계획에 투입합니다. 이상 물질국은 규모 1단계로 시작하며, 보병 및 포병 연구를 활용해 장비를 개발합니다."
 STALKER_establish_anomalous_materials_bureau_available_tt: "국가 비축고에 아티팩트가 최소 §Y5§!개 필요합니다."
 STALKER_establish_anomalous_materials_bureau_tt: "아티팩트 §Y5§!개를 소모하여 이상 물질국을 설립하고, 규모를 §Y1§! 늘리며, 무료 특성 선택권 §Y1§!개를 부여합니다."
 STALKER_fund_anomalous_materials_bureau: "이상 물질 연구 자금 지원"
 STALKER_fund_anomalous_materials_bureau_desc: "회수한 아티팩트를 이상 물질국의 연구 예산에 투입합니다. 이 자금은 개발 기준에 도달하면 MIO 규모를 키우고 추가 특성 선택지를 열어 줍니다."
 STALKER_fund_anomalous_materials_bureau_available_tt: "국가 비축고에 아티팩트가 최소 §Y5§!개 필요합니다."
 STALKER_fund_anomalous_materials_bureau_tt: "아티팩트 §Y5§!개를 소모하여 이상 물질국에 MIO 자금 §Y150§!을 더합니다."
 STALKER_anomalous_materials_bureau_available_tt: "카이마노프 결말로 세계 곳곳에 이상 구역이 퍼졌습니다."
 generic_STALKER_anomalous_materials_bureau: "이상 물질국"
 generic_STALKER_anomalous_materials_bureau_trait: "회수 아티팩트 분석"
 STALKER_anomalous_materials_production_header: "산업 응용"
 STALKER_anomalous_materials_sample_characterization: "표본 특성 규명"
 STALKER_anomalous_materials_stabilized_alloys: "안정화 합금 가공"
 STALKER_anomalous_materials_reproducible_fabrication: "재현 가능한 제작 기술"
 STALKER_anomalous_materials_gauss_prototypes: "가우스 시제품"
 STALKER_purge_mdst_channels: "MDST 경로 소탕"
 STALKER_purge_mdst_channels_desc: "우리 조사관들이 MDST와 연루된 것으로 밝혀낸 관료, 연구자, 계약업체를 체포합니다."
 STALKER_purge_mdst_channels_tt: "MDST 침투도가 최대 §G25§! 감소합니다."
 STALKER_warn_foreign_government: "[FROM.GetName]에 MDST 경고"
 STALKER_warn_foreign_government_desc: "우리가 추적한 경로 가운데 일부는 [FROM.GetName]을(를) 거쳐 갑니다. 아는 바를 공유하면 우리 쪽 경로를 차단하는 데도 도움이 될 것입니다."
 STALKER_warn_foreign_government_tt: "우리의 MDST 침투도가 최대 §G5§! 감소합니다. [FROM.GetName]은(는) MDST의 존재와 자국 기관에 얼마나 깊이 침투했는지를 알게 됩니다."
 STALKER.80.t: "제 발로 사라진 연구 성과"
 STALKER.80.d: "구역 연구소 한 곳에서 표본과 문서가 사라졌습니다. 반출 기록은 없고, 접근 권한이 있던 사람들은 우리의 모든 신원 조회를 통과한 이들뿐입니다."
 STALKER.80.a: "유출자를 찾아라."
 STALKER.80.a_tt: "MDST 침투도가 최대 §G10§! 감소합니다. 이미 비축 아티팩트 최대 §R5§!개가 암시장으로 빠져나갔고, X-연구소 탐사 진척도가 최대 §R20§! 손실되었습니다."
 STALKER.80.b: "조용히 접근을 통제한다."
 STALKER.80.b_tt: "이미 비축 아티팩트 최대 §R5§!개가 암시장으로 빠져나갔고, X-연구소 탐사 진척도가 최대 §R20§! 손실되었습니다."
 STALKER.81.t: "MDST에 대한 경고"
 STALKER.81.d: "[FROM.GetName]이(가) MDST에 관한 정보를 넘겨주었습니다. 국방 및 비밀기술부(MDST)는 프로젝트 X가 중단된 뒤에도 이를 이어 간 조직입니다. 그쪽 분석관들은 MDST가 우리 부처와 연구 기관에도 손을 뻗쳤다고 봅니다."
 STALKER.81.a: "경고에 따라 움직인다."
 STALKER.81.a_tt: "MDST 침투도가 최대 §G10§! 감소하며, [FROM.GetName]에 대한 우리의 평가가 좋아집니다."
 STALKER.81.b: "우리가 직접 조사하겠다."
 STALKER_purge_mdst_channels_available_tt: "MDST 침투도가 최소 §Y5§!이어야 합니다(현재 §Y[?ROOT.STALKER_mdst_penetration|0]§!)."
 STALKER_strike_monolith: "[FROM.GetName]의 모놀리스 타격"
 STALKER_strike_monolith_desc: "발전소로 기갑 종대를 보내 구역 중심부에 대한 모놀리스의 장악을 깨뜨립니다.$STALKER_zone_society_readout$"
 STALKER_strike_monolith_tt: "GDP의 §Y0.4%§!가 소요됩니다. [FROM.GetName]은(는) §Y모놀리스§! 영향력이 최대 §G25§! 줄고 손실로 §Y봉쇄§!가 §R5§! 떨어지며, §Y듀티§! 영향력이 §G5§! 늘어납니다. 절반의 확률로 와해된 모놀리스 전투원이 §Y정오단§!으로 투항합니다(§G+10§!)."
 STALKER.70.t: "모놀리스 공세"
 STALKER.70.d: "모놀리스 전투원들이 발전소에서 남쪽으로 쏟아져 내려와 [STALKER_zone_name]의 외곽 초소 두 곳을 유린했습니다. 생존자들은 소리 한 번 내지 않고 싸우며 부상자를 돌보려 멈추지도 않는 병사들이었다고 증언합니다."
 STALKER.70.a: "놈들이 자리 잡기 전에 반격하라."
 STALKER.70.a_tt: "이번 공세로 구역은 이미 §Y봉쇄§! §R10§!과 스토커 §R5§!명을 잃었습니다. 정치력 §R50§!을 소모합니다. 구역의 §Y모놀리스§! 영향력이 최대 §G20§! 줄고 §Y듀티§! 영향력이 §G5§! 늘어납니다. 절반의 확률로 와해된 모놀리스 전투원이 §Y정오단§!으로 투항합니다(§G+10§!)."
 STALKER.70.b: "후퇴하여 새 방어선을 지켜라."
 STALKER.70.b_tt: "구역의 §Y봉쇄§!가 §G5§! 회복됩니다. 이번 공세로 이미 §Y봉쇄§! §R10§!과 스토커 §R5§!명을 잃었습니다."
 STALKER.71.t: "북쪽으로 향하는 순례자들"
 STALKER.71.d: "지난주 스토커 한 무리가 발전소를 향해 코돈을 지나갔습니다. 동료들은 이들이 며칠 동안 소원을 들어주는 존재 '위시 그랜터'를 입에 올렸다고 전합니다. 돌아온 이는 아무도 없습니다."
 STALKER.71.a: "스스로 선택한 길이다."
 STALKER.71.a_tt: "구역은 이미 스토커 §R10§!명을 잃었고, §Y모놀리스§! 영향력이 §R5§! 상승했습니다."
 STALKER.71.b: "북쪽으로 향하는 길을 막아라."
 STALKER.71.b_tt: "구역은 이미 스토커 §R10§!명을 잃었고, §Y모놀리스§! 영향력이 §R5§! 상승했습니다. 정치력 §R25§!이(가) 듭니다. 구역은 §Y모놀리스§! 영향력을 최대 §G5§! 잃고 §Y봉쇄§!를 §G5§! 얻습니다."
 STALKER_mutant_incursion: "돌연변이 출몰"
 STALKER_mutant_incursion_desc: "돌연변이들이 인근 이상 구역을 벗어나 이 주를 배회하고 있습니다."
 STALKER_organize_mutant_cull: "[FROM.GetName]에서 돌연변이 소탕 조직"
 STALKER_organize_mutant_cull_desc: "사냥꾼을 고용하고 순찰대를 보내, 방출 때문에 구역에서 쫓겨나는 의사견과 흡혈귀, 그보다 더한 놈들의 수를 줄입니다.\n\n돌연변이: §Y[?FROM.STALKER_zone_mutants|0]§!\n돌연변이는 매달 개체 수의 §Y5%§!만큼 스토커를 죽입니다. 방출이 일어날 때마다 §R15§!이(가) 늘어납니다. §Y49§!을 넘으면 인접한 주로 넘어갈 수 있습니다."
 STALKER_organize_mutant_cull_tt: "GDP의 §Y0.2%§!이(가) 듭니다. [FROM.GetName]에서 돌연변이가 최대 §G25§! 줄어듭니다."
 STALKER_fortify_perimeter_defenses: "[FROM.GetName]의 외곽 방어 강화"
 STALKER_fortify_perimeter_defenses_desc: "취약한 구간마다 전기 철조망과 자동 감지 장치, 지뢰대를 설치해 돌연변이의 탈출을 저지합니다.\n\n돌연변이: §Y[?FROM.STALKER_zone_mutants|0]§!\n봉쇄: §Y[?FROM.STALKER_zone_containment|0]%§!"
 STALKER_fortify_perimeter_defenses_tt: "정치력 §Y40§!과(와) GDP의 §Y0.2%§!이(가) 듭니다. [FROM.GetName]은(는) §Y봉쇄§!를 §G15§! 얻고 돌연변이가 최대 §G15§! 줄며, §Y1년§! 동안 돌연변이 탈출 위험이 낮아집니다."
 STALKER_deploy_acoustic_deterrents: "[FROM.GetName]에 음향 퇴치 장치 배치"
 STALKER_deploy_acoustic_deterrents_desc: "연구 야영지 주변에 지향성 고주파 음향 발생기를 설치해 눈먼 개 떼와 스노크를 쫓아냅니다.\n\n돌연변이: §Y[?FROM.STALKER_zone_mutants|0]§!\n개발도: §Y[?FROM.STALKER_zone_exploitation|0]%§!"
 STALKER_deploy_acoustic_deterrents_tt: "정치력 §Y25§!과(와) GDP의 §Y0.1%§!이(가) 듭니다. [FROM.GetName]은(는) 돌연변이가 최대 §G20§! 줄고 §Y개발도§!이 §G5§! 늘지만, §Y프리덤§! 영향력을 §R5§! 잃습니다."
 STALKER.90.t: "돌연변이의 방어선 돌파"
 STALKER.90.d: "지난 방출에 쫓겨난 돌연변이 무리가 [STALKER_zone_name]의 방어선을 뚫었습니다. 울타리 너머 마을에서는 가축이 죽고 도로가 막혔다는 보고가 들어옵니다. 우리가 통제하는 인접 주 한 곳이 60일간 돌연변이 출몰을 겪게 됩니다."
 STALKER.90.a: "사냥꾼들을 보내라."
 STALKER.90.a_tt: "정치력 §R25§!이(가) 듭니다. 구역은 돌연변이가 최대 §G20§! 줄고 스토커가 §G5§! 늘어납니다."
 STALKER.90.b: "도로를 막고 지나가길 기다려라."
 STALKER.90.b_tt: "구역이 §Y봉쇄§!를 §G5§! 얻습니다."
 STALKER.91.t: "흡혈귀 소굴 발견"
 STALKER.91.d: "[STALKER_zone_name]을(를) 정찰하던 순찰대가 버려진 산업 시설 지하에서 흡혈귀 번식지를 찾아냈습니다. 무리의 이동 때문에 인접 구역의 통행이 마비되고 있습니다."
 STALKER.91.a: "군의 폭파 공격을 명령하라."
 STALKER.91.a_tt: "정치력 §R25§!과(와) GDP의 §Y0.2%§!이(가) 듭니다. 구역은 돌연변이가 최대 §G20§! 줄고 §Y봉쇄§!를 §G5§! 얻으며 §Y도적§! 영향력을 §G5§! 잃습니다."
 STALKER.91.b: "현지 스토커와 현상금 사냥을 계약하라."
 STALKER.91.b_tt: "정치력 §R15§!이(가) 듭니다. 구역은 돌연변이가 최대 §G15§! 줄고 §Y스토커§!가 §G10§! 늘며, 이상 표본 §G1§!개가 국가 아티팩트 비축고에 입고됩니다."
 STALKER.91.c: "지상 출입구를 봉인하고 관찰하라."
 STALKER.91.c_tt: "행동 관찰을 통해 구역이 §Y개발도§!을 §G5§! 얻으며, 돌연변이 개체군은 건드리지 않습니다."
 STALKER.92.t: "방어선의 초능력장 교란"
 STALKER.92.d: "정신 감응 조종형 개체들이 [STALKER_zone_name]의 방어선 쪽으로 떠내려왔습니다. 검문소 보초들이 극심한 편두통과 환각을 호소하면서 일대에 공황이 번지고 초소를 일시적으로 이탈하는 사태가 벌어졌습니다."
 STALKER.92.a: "장갑 화력조와 초능력 차단 헬멧을 배치하라."
 STALKER.92.a_tt: "정치력 §R30§!이(가) 듭니다. 구역은 돌연변이가 최대 §G15§! 줄고 §Y봉쇄§!를 §G10§! 얻습니다."
 STALKER.92.b: "보강된 제2 코돈으로 후퇴하라."
 STALKER.92.b_tt: "안정도 §R1%§!이(가) 듭니다. 구역은 §Y봉쇄§!를 §R10§! 잃고 §Y활동§!이 §R5§! 늘어납니다."
 STALKER.92.c: "듀티 지원자들을 돌파구로 보내라."
 STALKER.92.c_tt: "§Y듀티§! 영향력이 최소 §Y15§! 필요합니다. 구역은 돌연변이가 최대 §G20§! 줄고 §Y듀티§! 영향력이 §G10§! 늘며, §Y프리덤§! 영향력을 §R5§! 잃고 §Y봉쇄§!를 §G5§! 얻습니다."
 STALKER.93.t: "코돈에 나타난 의사거인"
 STALKER.93.d: "거대한 의사거인이 [STALKER_zone_name]의 전방 완충지대를 돌파해, 지진 같은 충격파로 방어 시설과 민간 바리케이드를 짓뭉개고 있습니다."
 STALKER.93.a: "중포와 대물 저격 팀을 투입하라."
 STALKER.93.a_tt: "정치력 §R40§!이(가) 듭니다. 구역은 돌연변이가 최대 §G25§! 줄고 §Y봉쇄§!를 §G10§! 얻지만, 파손된 연구 감시 장치 탓에 §Y개발도§!을 §R5§! 잃습니다."
 STALKER.93.b: "괴물을 이상 지대로 유인하라."
 STALKER.93.b_tt: "§Y활동§!이 최소 §Y20§! 필요합니다. 구역은 돌연변이가 최대 §G15§! 줄고 §Y스토커§!가 §G5§! 늘며, §Y활동§!이 §R5§! 증가합니다."
 STALKER.94.t: "돌연변이 생체 채취 수요"
 STALKER.94.d: "국제 생명공학 기업과 방위산업체들이 [STALKER_zone_name]에서 채취한 신선한 돌연변이 조직 표본에 막대한 현상금을 내걸고 있습니다."
 STALKER.94.a: "표본 거래를 위한 국가 허가 위원회 설립"
 STALKER.94.a_tt: "GDP의 §G0.4%§!에 해당하는 수입을 얻습니다. 구역은 §Y개발도§!이 §G10§! 늘고 §Y봉쇄§!를 §R5§! 잃으며, 돌연변이가 최대 §G10§! 줄어듭니다."
 STALKER.94.b: "상업적 채취를 금지하고 모든 표본을 징발하라."
 STALKER.94.b_tt: "정치력 §R15§!이(가) 듭니다. 이상 표본 §G2§!개가 아티팩트 비축고에 입고되고, §Y봉쇄§!가 §G10§! 오르며, §Y도적§! 영향력이 §G5§! 낮아집니다."