 ISR_likud_good_TT: "§Y크네세트§!에서 §Y우리 법안을 통과시킬§! §Y확률§!이 §Y5§! §G증가§!합니다"
 ISR_national_camp_TT: "모든 §B우파 정당§!과 §Y협력§!할 수 있게 되지만 §Y자유주의자들§!은 §R분노§!할 것입니다"
