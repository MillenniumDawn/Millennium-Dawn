 NKO_southern_propaganda_broadcasts: "Émissions de propagande sud-coréennes"
 NKO_southern_propaganda_broadcasts_desc: "Cet esprit national sera §Rretiré§! si nous achevons le focus §HCesser les émissions de propagande§!. \n§W--------------§!\n 2 à 6 heures par jour, l'armée sud-coréenne utilise des haut-parleurs pour diffuser des messages aux troupes nord-coréennes qui gardent la DMZ. Les messages vont des bulletins météo à la K-pop et, plus significativement, à des rapports critiques sur le Nord ainsi qu'à des portraits positifs du Sud."
 KOR_northern_propaganda_broadcasts: "Émissions de propagande nord-coréennes"
 KOR_northern_propaganda_broadcasts_desc: "L’équivalent nord-coréen des émissions de nouvelles et de K-pop du Sud à travers la frontière cherche à fournir un récit alternatif à celui de la ROK. Les émissions nord-coréennes vantent le système de gouvernance de la RPDC tout en dénigrant le système capitaliste du Sud. Soumises à des problèmes techniques, ces émissions nordiques représentent moins une menace qu’un rappel persistant des tensions sur la péninsule coréenne."
 KOR_idea_growth_by_innovation: "Croissance par l’innovation"
 NKO_southern_balloon_leaflets: "Ballons à tracts sud-coréens"
 NKO_southern_balloon_leaflets_desc: "Cet esprit national sera §Rretiré§! si la §HCorée du Sud est annexée§!. \n§W--------------§!\n Des Sud-Coréens et des défecteurs nord-coréens envoient régulièrement des ballons vers le Nord qui larguent des milliers de tracts sur le territoire nord-coréen, suscitant de vives réactions de Pyongyang. Tandis que ceux qui envoient les tracts affirment vouloir aider leurs compatriotes du Nord contre un régime dictatorial, leurs critiques soutiennent que les tracts antagonisent inutilement le Nord et mettent en danger les Sud-Coréens vivant près de la frontière."
 KOR_intensified_propaganda: "Propagande sudiste intensifiée"
 KOR_intensified_propaganda_desc: "À travers une grande variété de moyens, le gouvernement sudiste cherche à miner notre légitimité. Il nous faudra du temps pour pouvoir contrer cette gigantesque offensive de propagande."
 KOR_global_korea: "Corée globale"
 KOR_global_korea_desc: "The days when Korea had no need to preoccupy itself with foreign affairs are over. A Global Korea will seek to engage the world as a power within its own right."
 KOR_reunification_shocks: "Chocs de la réunification"
 KOR_reunification_shocks_desc: "Après des décennies de séparation, les deux Corées sont enfin officiellement réunifiées. Mais les deux moitiés du pays restent extrêmement polarisées, et le coût économique de la réunification a eu un lourd tribut. Le nouveau gouvernement doit prendre des mesures rapides pour résoudre les différences qui persistent de part et d’autre du 38e parallèle, sous peine de risquer la dissolution du jeune État coréen."
 KOR_divided_military: "Armée divisée"
 KOR_divided_military_desc: "La nation coréenne réunifiée hérite de deux forces de combat redoutables de ses prédécesseurs. Cependant, le nouvel État doit trouver un moyen de surmonter de sérieuses difficultés dans ses tentatives de gérer cette armée pléthorique, ingérable et intérieurement divisée s’il veut assurer sa sécurité."
 KOR_mass_migration: "Migration de masse"
 KOR_mass_migration_desc: "Une conséquence significative de la réunification est la migration massive de familles à la recherche de meilleures opportunités de part et d’autre du 38e parallèle. L’ampleur et la vitesse immenses de ce mouvement sont hautement déstabilisantes, provoquant le chaos à travers le pays."
 KOR_fragmented_governance: "Gouvernance fragmentée"
 KOR_fragmented_governance_desc: "Bien que la Corée existe désormais formellement comme un État souverain unique, en réalité, il subsiste deux cultures politiques très différentes de part et d’autre du 38e parallèle. La question de savoir comment gouverner le pays est une question qui doit être résolue rapidement."
 KOR_uneven_economy_2: "Économie inégale"
 KOR_uneven_economy_2_desc: "Inévitablement, l’écart significatif dans les niveaux de développement économique entre les deux Corées a un impact post-réunification. Pour que la nouvelle nation coréenne libère tout son potentiel économique, cet déséquilibre doit être corrigé."
 KOR_uneven_economy_3: "Économie planifiée"
 KOR_uneven_economy_3_desc: "Une économie planifiée est un type de système économique où les investissements, la production et l’allocation des biens de capital se font selon des plans économiques et de production à l’échelle de l’économie. Une économie planifiée peut utiliser des formes centralisées, décentralisées, participatives ou de type soviétique de planification économique. Le niveau de centralisation ou de décentralisation dans la prise de décision et la participation dépend du type spécifique de mécanisme de planification employé."
 KOR_uneven_economy_3_1: "Économie planifiée"
 KOR_uneven_economy_3_1_desc: "Une économie planifiée est un type de système économique où les investissements, la production et l’allocation des biens de capital se font selon des plans économiques et de production à l’échelle de l’économie. Une économie planifiée peut utiliser des formes centralisées, décentralisées, participatives ou de type soviétique de planification économique. Le niveau de centralisation ou de décentralisation dans la prise de décision et la participation dépend du type spécifique de mécanisme de planification employé."
 KOR_uneven_economy_3_2: "Économie planifiée"
 KOR_uneven_economy_3_2_desc: "Une économie planifiée est un type de système économique où les investissements, la production et l’allocation des biens de capital se font selon des plans économiques et de production à l’échelle de l’économie. Une économie planifiée peut utiliser des formes centralisées, décentralisées, participatives ou de type soviétique de planification économique. Le niveau de centralisation ou de décentralisation dans la prise de décision et la participation dépend du type spécifique de mécanisme de planification employé."
 KOR_uneven_economy_4: "Soutenir le marché"
 KOR_uneven_economy_4_desc: "We will keep a hand under our economy. While not dictating the market, we will support business and do what we can to support the entirety of our economy"
 KOR_uneven_economy_4_1: "Soutenir le marché"
 KOR_uneven_economy_4_1_desc: "Nous garderons une main sous notre économie ; sans dicter le marché, nous soutiendrons les entreprises et ferons ce que nous pouvons pour soutenir l’ensemble de notre économie."
 KOR_uneven_economy_4_2: "Soutenir le marché"
 KOR_uneven_economy_4_2_desc: "Nous garderons une main sous notre économie ; sans dicter le marché, nous soutiendrons les entreprises et ferons ce que nous pouvons pour soutenir l’ensemble de notre économie."
 KOR_uneven_economy_5: "Marché libre"
 KOR_uneven_economy_5_desc: "En économie, un marché libre est un modèle cognitif idéalisé d’un système économique dans lequel les prix des biens et des services sont déterminés par l’offre et la demande exprimées par les vendeurs et les acheteurs. Ces marchés, tels que modélisés, fonctionnent sans l’intervention du gouvernement ou de toute autre autorité extérieure. Les partisans du marché libre comme idéal normatif le contrastent avec un marché régulé, dans lequel un gouvernement intervient dans l’offre et la demande par divers moyens tels que les taxes ou les régulations. Dans une économie de marché libre idéalisée, les prix des biens et des services sont fixés uniquement par les offres et les demandes des participants."
 KOR_uneven_economy_5_1: "Marché libre"
 KOR_uneven_economy_5_1_desc: "En économie, un marché libre est un modèle cognitif idéalisé d’un système économique dans lequel les prix des biens et des services sont déterminés par l’offre et la demande exprimées par les vendeurs et les acheteurs. Ces marchés, tels que modélisés, fonctionnent sans l’intervention du gouvernement ou de toute autre autorité extérieure. Les partisans du marché libre comme idéal normatif le contrastent avec un marché régulé, dans lequel un gouvernement intervient dans l’offre et la demande par divers moyens tels que les taxes ou les régulations. Dans une économie de marché libre idéalisée, les prix des biens et des services sont fixés uniquement par les offres et les demandes des participants."
 KOR_uneven_economy_5_2: "Marché libre"
 KOR_uneven_economy_5_2_desc: "En économie, un marché libre est un modèle cognitif idéalisé d’un système économique dans lequel les prix des biens et des services sont déterminés par l’offre et la demande exprimées par les vendeurs et les acheteurs. Ces marchés, tels que modélisés, fonctionnent sans l’intervention du gouvernement ou de toute autre autorité extérieure. Les partisans du marché libre comme idéal normatif le contrastent avec un marché régulé, dans lequel un gouvernement intervient dans l’offre et la demande par divers moyens tels que les taxes ou les régulations. Dans une économie de marché libre idéalisée, les prix des biens et des services sont fixés uniquement par les offres et les demandes des participants."
