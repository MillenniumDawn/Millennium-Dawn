 EMPLOYMENT_CHANGE_HEALTH_TT_DELAYED: "Приоритет: §Y[?ROOT.healthcare_priority|0]§! из 10\nУкомплектованность: §Y[?ROOT.healthcare_manpower_fulfillment|%0]§!\nРаботники: §Y[?ROOT.workers_in_healthcare|2] млн§! / §Y[?ROOT.max_workers_in_healthcare|2] млн§!\nДоля рабочей силы: §Y[?ROOT.healthcare_workforce_share|%1]§! / §Y[?ROOT.healthcare_workforce_max_share|%1]§!\nВВП: $§Y[?ROOT.healthcare_gdp_current|1]§! млрд / $§Y[?ROOT.healthcare_gdp_max|1]§! млрд\nОт укомплектованности также зависит доход от корпоративного налога в здравоохранении. Она никогда не опускается ниже 10%."
 EMPLOYMENT_CHANGE_BUREAU_TT: "§YГосударственное управление§!"
 EMPLOYMENT_CHANGE_BUREAU_TT_DELAYED: "Приоритет: §Y[?ROOT.bureaucracy_priority|0]§! из 10\nУкомплектованность: §Y[?ROOT.bureaucracy_manpower_fulfillment|%0]§!\nРаботники: §Y[?ROOT.workers_in_bureaucracy|2] млн§! / §Y[?ROOT.max_workers_in_bureaucracy|2] млн§!\nДоля рабочей силы: §Y[?ROOT.bureaucracy_workforce_share|%1]§! / §Y[?ROOT.bureaucracy_workforce_max_share|%1]§!\nФонд оплаты труда: $§Y[?ROOT.bureaucracy_wages_current|3]§! млрд / $§Y[?ROOT.bureaucracy_wages_max|3]§! млрд\nУкомплектованность определяет фонд оплаты труда госслужащих и учитывается в укомплектованности рабочей силой. Она никогда не опускается ниже 10%."
