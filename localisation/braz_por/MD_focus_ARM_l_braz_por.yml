 ARM_vazgen_academy: "Universidade Militar Vazgen Sargsyan"
 ARM_vazgen_academy_desc: "A Universidade Militar Vazgen Sargsyan é uma instituição de ensino superior que funciona no sistema do Ministério da Defesa da Armênia. Sua missão é preparar e treinar oficiais capazes de cumprir tarefas de defesa em tempos de paz e de guerra."
 ARM_inner_troops: "Tropas Internas"
 ARM_inner_troops_desc: "Além das tropas principais e dos guardas de fronteira, devemos criar tropas internas do país para estabelecer uma ordem plena no interior e manter reservas."
 ARM_institute_mo_ra: "Universidade de Aviação Militar"
 ARM_institute_mo_ra_desc: "A Universidade de Aviação Militar Armenak Khanperyants é uma instituição de ensino superior da Força Aérea Armênia que funciona sob o Ministério da Defesa da Armênia."
 ARM_pvo_troops: "Força de Defesa Aérea"
 ARM_pvo_troops_desc: "Devemos considerar a criação de forças de defesa aérea para garantir a segurança de nossos céus."
 ARM_intern_cooperat: "Cooperação Internacional"
 ARM_intern_cooperat_desc: "Para desenvolver nossas forças armadas e melhorar o profissionalismo de nossos oficiais, precisamos interagir com países amigos ao redor do mundo."
 ARM_peace_brigade: "Brigada de Manutenção da Paz"
 ARM_peace_brigade_desc: "Para obter e adotar a experiência estrangeira na condução da guerra, precisamos desenvolver nossas tropas de manutenção da paz a fim de enviá-las a missões militares e humanitárias."
 ARM_air_fedence_force: "Treinamentos Aéreos Sistematizados"
 ARM_air_fedence_force_desc: "Nossa aviação não possui um programa sistemático de treinamento de pilotos, e os manuais não são atualizados desde a época soviética. Devemos unir as academias de aviação e conduzir um programa de treinamento sistemático."
 ARM_davisur_arm: "Davisur"
 ARM_davisur_arm_desc: "Uma das fábricas de costura de Yerevan pode ser convertida em uma empresa completa que produzirá uniformes padronizados com um novo camuflado pixelado, que podemos copiar do Canadá ou dos EUA."
 ARM_aspar_arms_desc: "A Aspar Arms é uma empresa que lida com a exportação e importação de armas para a República da Armênia. Recentemente, ela começou a desenvolver protótipos promissores de seus próprios modelos de armas leves. Devemos conceder-lhe uma licença de fabricação e apoiar sua fábrica."
 ARM_k3_prototype: "Protótipos do Fuzil K-3"
 ARM_k3_prototype_desc: "A empresa armênia Garni-Ler fabrica armas artesanais na Armênia desde os anos 90. Devemos modernizar seus antigos protótipos e subsidiar sua empresa."
 ARM_uav_krunk: "VANT Krunk"
 ARM_uav_krunk_desc: "O Krunk é um veículo aéreo não tripulado armênio em serviço nas Forças Armadas da Armênia. Destina-se ao reconhecimento de curto alcance, à transmissão de dados de vídeo em tempo real (visuais ou infravermelhos) ou à captura de imagens estáticas de maior resolução."
 ARM_sso: "Forças de Operações Especiais"
 ARM_sso_desc: "É hora de modernizar nossas forças de operações especiais com base em nossos desenvolvimentos e experiência militar."
 ARM_new_army: "O Novo Exército Armênio"
 ARM_new_army_desc: "O exército armênio está entrando em uma nova era de modernização e evolução, deixando seus problemas no passado!"
 ARM_militia: "Criar uma Milícia Popular"
 ARM_militia_desc: "A Armênia tem, desde os anos 1990, uma lei que legaliza a criação de milícias paramilitares civis não estatais e sua integração às forças armadas em caso de conflito. É hora de colocar essa lei em prática."
 ARM_national_guard: "Criar uma Guarda Nacional"
 ARM_national_guard_desc: "Talvez devamos considerar a opção de criar uma guarda nacional da Armênia, que seria diretamente responsável pela manutenção da ordem na Armênia e estreitamente ligada ao Ministério do Interior."
 ARM_vdv: "Criar Força Aerotransportada"
 ARM_vdv_desc: "A doutrina militar soviética pressupunha uma diversidade significativa de ramos das forças armadas. Devemos adotar uma estratégia semelhante, criando unidades aerotransportadas completas."
 ARM_morpehi: "Criar Corpo de Fuzileiros Navais"
 ARM_morpehi_desc: "Junto com o acesso ao mar, também devemos levar em conta a experiência de outros países e criar unidades de fuzileiros navais."
 ARM_fleet: "Criar Marinha"
 ARM_fleet_desc: "O mar das vitórias envolveu nossa terra! Desde os tempos da Armênia da Cilícia, finalmente temos acesso ao mar. Vale a pena começar a criar nossa nova frota."
 ARM_n2: "N-2"
 ARM_n2_desc: "O N-2 é um projeto armênio de lançador múltiplo de foguetes da Associação Científica e Produtiva Garni-Ler. Podemos aprovar o projeto deles para iniciar a fabricação do referido lançador de foguetes."
 ARM_lusan: "Lusan"
 ARM_lusan_desc: "A Fábrica de Máquinas-Ferramenta de Charentsavan busca recursos para iniciar a produção em massa dos veículos militares LUSAN. Talvez devamos considerar investir nela."
 ARM_mortars_prod: "Produção de Morteiros"
 ARM_mortars_prod_desc: "Os morteiros são bastante fáceis de produzir e não exigem muito equipamento técnico. Devemos analisar isso."
 ARM_hayk_car: "Protótipo do Veículo Hayk"
 ARM_hayk_car_desc: "O veículo de combate Hayk é um protótipo criado sob a supervisão do projetista Karen Gevorkyan. Embora não seja o tipo de transporte militar mais eficaz, é um desenvolvimento nosso, inovador e confiável, que vale a pena apoiar."
 ARM_rockets_modern: "Modernização de Foguetes"
 ARM_rockets_modern_desc: "Considerando nossas capacidades técnicas, podemos tentar modernizar os antigos foguetes soviéticos e russos."
 ARM_mlrs_proto: "Protótipos de MLRS"
 ARM_mlrs_proto_desc: "A Garni-Ler propôs a criação de protótipos de MLRS. Devemos apoiar seus esforços nessa direção."
 ARM_our_own_armor: "Produção de Blindagem Cerâmica"
 ARM_our_own_armor_desc: "Além das placas de aço fabricadas pela Davisur, podemos iniciar a produção de placas de blindagem cerâmica copiando os projetos comerciais disponíveis."
 ARM_radars_arm: "Radares Armênios"
 ARM_radars_arm_desc: "Para garantir nossa confiança na capacidade de detectar com precisão aeronaves inimigas sobre nosso solo, devemos investir na construção de radares militares."
 ARM_night_vis_arm: "Implantar Visão Noturna"
 ARM_night_vis_arm_desc: "Se nossa situação econômica permitir, podemos começar a implantar miras e óculos de visão noturna em nossas forças armadas."
 ARM_new_unif_proj: "Projeto do Novo Uniforme"
 ARM_voma_center: "Centro VOMA"
 ARM_voma_center_desc: "A VOMA (em armênio, literalmente, Arte da Sobrevivência) é uma organização não governamental armênia, criada por um grupo de militares profissionais e veteranos que anunciaram seu propósito de desenvolver uma sociedade capaz de se defender em uma guerra."
 ARM_warfare_analysis_center: "Centro de Análise de Guerra"
 ARM_warfare_analysis_center_desc: "A coordenação de nossas forças armadas, a reavaliação da experiência de combate e a análise das operações de combate modernas. Tudo isso precisa ser unificado em um único órgão das forças armadas, que será este centro."
 ARM_reform_army: "Exército Reformado"
 ARM_reform_army_desc: "Nosso exército precisa ser reformado para estar pronto para repelir ataques inimigos ao nosso país. A estratégia defensiva é a base de nossa política militar"
 ARM_swiss_model_desc: "Começaremos a reformar nosso exército segundo o modelo suíço, a fim de otimizar nossas forças armadas conforme necessário."
 ARM_fortress: "Defesa de Montanha"
 ARM_fortress_desc: "Transformaremos nosso país em uma verdadeira fortaleza; as táticas defensivas da Suíça serão nossa base."
 ARM_territorial_defence: "Defesa Territorial"
 ARM_territorial_defence_desc: "Pretendemos criar uma defesa territorial para proteção adicional de nosso Estado."
 ARM_soviet_army: "Exército Soviético"
 ARM_soviet_army_desc: "O exército soviético era, em nossa opinião, o padrão das forças armadas. Pretendemos criar novos ramos das forças armadas que atendam às nossas necessidades logísticas."
 ARM_engineer_troops: "Tropas de Engenharia"
 ARM_engineer_troops_desc: "Forças especiais das Forças Armadas destinadas ao apoio de engenharia: preparação do território de operações militares (de combate), reconhecimento de engenharia e escolta de tropas (forças) na ofensiva, e assim por diante"
 ARM_radio_troops: "Tropas de Rádio"
 ARM_radio_troops_desc: "Forças especiais destinadas ao desdobramento e à operação de sistemas de comunicação, a fim de garantir o controle das tropas e forças subordinadas ao Ministério da Defesa em todas as suas atividades"
 ARM_railway_troops: "Tropas Ferroviárias"
 ARM_railway_troops_desc: "As ferrovias destinavam-se ao apoio ferroviário das Forças Armadas. As tropas ferroviárias incluíam órgãos de gestão, formações, unidades, instituições e empresas"
 ARM_border_troops_desc: "Tropas destinadas a proteger e defender a fronteira do Estado, prevenir e reprimir atentados à soberania e à integridade territorial"
 ARM_nationalist_army: "Exército Nacional"
 ARM_nationalist_army_desc: "Nosso país precisa de um exército nacional forte, que será criado com base em uma doutrina militar única."
 ARM_nationalists_in_army: "Recrutamento de Radicais para o Exército"
 ARM_nationalists_in_army_desc: "Pretendemos contar com a ajuda de elementos nacionalistas radicais. Apesar da desordem que possam causar, eles elevarão o moral e reforçarão o compromisso ideológico."
 ARM_univeristy_army: "Novas Universidades Militares"
 ARM_univeristy_army_desc: "Pretendemos construir novas universidades militares para melhorar a qualidade da educação militar no país."
 ARM_polk_dziavory: "Dziavory"
 ARM_polk_dziavory_desc: "Os Dziavors (cavalaria armênia), cavaleiros da Cilícia ou cavaleiros armênios são cavaleiros cruzados da Armênia Cilícia. Pretendemos reorganizar a Companhia da Guarda de Honra em uma unidade de combate de nosso exército."
 ARM_102: "Unidade 102"
 ARM_102_desc: "A Unidade 102 é uma unidade especial do exército armênio, formada a partir de comunidades armênias de todo o mundo para conduzir operações encobertas contra Estados adversários."
 ARM_ar15_west_contr: "Contrato para Produção de Padrão AR"
 ARM_ar15_west_contr_desc: "Os fuzis americanos mais novos são a melhor opção para nossa futura produção de fuzis. Poderemos produzi-los como são, mas também aplicar engenharia reversa em nosso próprio benefício."
 ARM_ak12_rus_contr: "Licença de Produção de Fuzis Padrão AK"
 ARM_ak12_rus_contr_desc: "Os fuzis russos mais novos são a melhor opção para nossa futura produção de fuzis. Poderemos produzi-los como são, mas também aplicar engenharia reversa em nosso próprio benefício."
 ARM_orsis_dilemma: "Dilema de Orsis"
 ARM_orsis_dilemma_desc: "A Orsis demonstrou interesse em investir em nosso complexo militar-industrial. No entanto, nossos generais têm outra proposta."
 ARM_start_foreign_legion: "Criação da Legião Estrangeira"
 ARM_start_foreign_legion_desc: "A Legião Estrangeira, como conceito de uma parte das forças armadas, há muito nos atrai, e agora estamos prontos para implementar essa ideia, com a ajuda de alguns Estados."
 ARM_foreign_legion_france: "Armas e Especialistas Franceses"
 ARM_foreign_legion_france_desc: "Pretendemos adquirir equipamentos franceses e especialistas dispostos a operá-los para nossa legião estrangeira."
 ARM_foreign_legion_india: "Armas e Especialistas Indianos"
 ARM_foreign_legion_india_desc: "Pretendemos adquirir equipamentos indianos e especialistas dispostos a operá-los para nossa legião estrangeira."
 ARM_foreign_legion_create: "Legião Estrangeira Armênia"
 ARM_foreign_legion_create_desc: "Temos orgulho de anunciar a criação da Legião Estrangeira Armênia, onde aguardaremos cidadãos de qualquer país!"
 ARM_outdated_airforce_idea: "Força Aérea Obsoleta"
 ARM_outdated_army_idea: "Exército Obsoleto"
 ARM_nati_army_idea: "Nacionalistas Radicais no Exército"
 ARM_swiss_model: "Modelo de Exército Suíço"
 ARM_border_troops: "Tropas de Fronteira"
 ARM_dziavory_idea: "Dziavory"
 ARM_102_idea: "Unidade 102"
 ARM_corrupt_military: "Militares corruptos"
 ARM_corrupt_military_desc: "A corrupção nas forças armadas armênias é generalizada e sufocante. Muitos generais se enriquecem vendendo equipamentos e saqueando depósitos em vez de manter a prontidão.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se a corrupção estiver abaixo de §H$corruption_level_04$§!."
 ARM_armenian_foreign_legion_idea: "Legião Estrangeira"
 ARM_armenian_foreign_legion_moblize_idea: "[ARM.GetFlag]Legião Estrangeira Armênia"
 ARM_joint_exercises_gre_idea: "Exercícios Conjuntos com [GRE.GetName]"
 ARM_joint_exercises_arm_idea: "Exercícios Conjuntos com [ARM.GetName]"
 ARM_joint_exercises_russia_idea: "Exercícios Conjuntos com [SOV.GetName]"
 ARM_joint_exercises_france_idea: "Exercícios Conjuntos com [FRA.GetName]"
 ARM_joint_exercises_iran_idea: "Exercícios Conjuntos com [PER.GetName]"
 ARM_army_category: "[ARM.GetFlag]Exército Armênio"
 ARM_army_category_desc: "£text_icon_armarmy O Exército da [ARM.GetFlag]§YRepública da Armênia§! existe há cerca de 10 anos e, durante esse tempo, conseguiu atravessar toda a §Rguerra pela independência§! de §Y[NKR.GetFlag]Artsakh§! na luta contra o §Y[AZE.GetFlag]Azerbaijão§!.\n\nMas devemos lembrar que [ARM.GetFlag]§Ynosso Estado§! enfrenta inevitavelmente a questão de uma repetição desses acontecimentos, e devemos estar §Gpreparados§!, assim como £text_icon_armarmy nosso exército."
 ARM_new_decision_army_unlock_tt: "£text_icon_armarmy §YExército da Armênia§!: §YDesbloqueia§! Novas Decisões"
 ARM_coop_west: "Abrir/Fechar Cooperação com o §3Ocidente§!"
 ARM_coop_east: "Abrir/Fechar Cooperação com o §7Oriente§!"
 east_dec_open: "Cooperação Oriental Aberta"
 west_dec_open: "Cooperação Ocidental Aberta"
