 SER_export_idea: "Yugoimport SDPR"
 SER_export_idea_desc: "A Yugoimport SDPR é uma fabricante estatal de armas sérvia e também uma empresa intermediária para importação e exportação de equipamentos relacionados à defesa."
 KOS_drop_unity: "Impulsionará a §Hderrubará a unidade Kosovo-Albânia§! em §G-2%§!"
 TT_SER_montenegro_independence_violent: "Os protestos em Montenegro não se tornaram violentos."
 KOS_international_aid: "Ajuda Internacional"
 KOS_international_aid_desc: "In the aftermath of the Kosovo War, international organizations such as UNMIK, USAID, and various European development agencies have provided substantial financial and developmental assistance to help rebuild our shattered economy and institutions.\n§W--------------§!\nThis national spirit provides weekly income from international donors."
 SER_nationalized_industries_idea: "State-Controlled Industries"
 SER_nationalized_industries_idea_desc: "Key industries including steel, petroleum, and manufacturing have been brought under direct state control, generating revenue through population taxation and resource exports at the cost of reduced corporate investment."
 SER_state_infrastructure_program: "State Infrastructure Program"
 SER_state_infrastructure_program_desc: "A state-directed program to modernize roads, rail, and utilities across Serbia, boosting construction capacity and tax revenue."
 SER_smederevo_steel_idea: "Smederevo Steelworks"
 SER_smederevo_steel_idea_desc: "The Smederevo Steelworks, one of the largest industrial complexes in the Balkans, has been brought under full state control. Its output strengthens domestic steel production and feeds the national industrial base."
 SER_nis_petroleum_idea: "NIS State Petroleum"
 SER_nis_petroleum_idea_desc: "The Naftna Industrija Srbije has been consolidated under state ownership, securing domestic fuel supply and oil extraction revenue for the national budget."
 SER_nationalized_industries_idea_2: "Consolidated State Industries"
 SER_nationalized_industries_idea_2_desc: "State control over steel, petroleum, and manufacturing has been consolidated into a unified industrial policy, maximizing output and export revenue at the cost of private sector investment."
 SER_war_economy_idea: "War Economy Preparation"
 SER_war_economy_idea_desc: "The state has redirected civilian production capacity toward military industry, increasing arms output at the cost of consumer goods availability."
 SER_non_aligned_trade_idea: "Non-Aligned Trade Network"
 SER_non_aligned_trade_idea_desc: "Serbia has established trade partnerships with non-aligned and sympathetic nations, diversifying export markets beyond the Western embargo."
 SER_smederevo_steelworks: "Nationalize Smederevo Steelworks"
 SER_smederevo_steelworks_desc: "The Smederevo Steelworks is one of the largest industrial facilities in southeastern Europe. Under state control, it will anchor our heavy industry and supply steel for national construction."
 SER_nis_petroleum: "Nationalize NIS Petroleum"
 SER_nis_petroleum_desc: "Naftna Industrija Srbije controls oil extraction, refining, and distribution across the country. Full state ownership will secure energy independence and fuel revenue."
 SER_state_industrial_consolidation: "Consolidate State Industries"
 SER_state_industrial_consolidation_desc: "With steel, petroleum, and manufacturing under state control, we can now unify industrial policy to maximize output and efficiency across all sectors."
 SER_war_economy_preparation: "Prepare War Economy"
 SER_war_economy_preparation_desc: "The state must redirect production capacity toward military needs. Civilian consumption will be reduced, but our arms industry will grow to match the challenges ahead."
 SER_non_aligned_partners: "Seek Non-Aligned Partners"
 SER_non_aligned_partners_desc: "Western sanctions have isolated us, but the world is larger than Europe and America. We must build trade networks with nations willing to do business outside the Western sphere."
 SER_indian_arms_trade: "Indian Arms Trade"
 SER_indian_arms_trade_desc: "India has historically been a major customer for Yugoslav and Serbian weapons systems. Reviving this arms trade relationship will bring both revenue and a strategic partnership."
 SER_belarusian_partnership: "Belarusian Partnership"
 SER_belarusian_partnership_desc: "Belarus under Lukashenko shares our political outlook and faces similar Western pressure. A bilateral trade and cooperation agreement will strengthen both nations."
 SER_middle_east_exports: "Middle Eastern Export Contracts"
 SER_middle_east_exports_desc: "Iraq and Libya have been longstanding customers for Serbian arms and industrial goods. Renewing these export contracts will generate significant revenue for the state."
 MNT_yug_exp: "Experience of Yugoslavia"
