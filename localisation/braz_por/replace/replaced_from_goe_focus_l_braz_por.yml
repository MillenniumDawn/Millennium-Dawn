l_braz_por:
 PER_iran_first: "Irã em Primeiro"
 AFG_graveyard_of_empires: "Cemitério dos Impérios"
 PER_iran_first_desc: "Embora tenhamos aliados regionais e internacionais, devemos priorizar o Irã em primeiro lugar quando se trata do bem-estar do nosso povo. O dinheiro deve ser alocado para desenvolver as indústrias locais."
 AFG_graveyard_of_empires_desc: "Os impérios vêm e vão, mas nosso povo permanece como o senhor indiscutível desta região. Enquanto nosso povo permanecer unido e conectado à sua herança, qualquer agressor descobrirá que [AFG.GetNameWithFlag] é verdadeiramente seu cemitério."