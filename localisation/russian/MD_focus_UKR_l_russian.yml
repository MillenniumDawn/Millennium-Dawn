 ukr_modernize_sov_equipment_btr50_indonesia_offer: "Предложить хранящиеся §YБТР-50§!: §Y[IND.GetNameWithFlag]§!"
 ukr_modernize_sov_equipment_btr50_indonesia_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[IND.GetNameWithFlag]§! всё ещё использует в морской пехоте советскую плавающую бронетехнику. Мы можем предложить взвод или роту хранящихся у нас §YБТР-50§!, пока там не купили технику в другом месте. Предложение действует до середины 2001 года.\n------------------\nЕсли сделка сорвётся или часть машин останется у нас, следующим можно будет сделать предложение: §Y[EGY.GetNameWithFlag]§!.§!"
 ukr_modernize_sov_equipment_btr50_egypt_offer: "Предложить хранящиеся §YБТР-50§!: §Y[EGY.GetNameWithFlag]§!"
 ukr_modernize_sov_equipment_btr50_egypt_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[EGY.GetNameWithFlag]§! всё ещё эксплуатирует §YБТР-50§! и нуждается в запасных машинах. Сделка сейчас также расположит Каир к нашему предложению по §YТ-62-5ТДФ§!.\n------------------\nЕсли сделка сорвётся или часть машин останется у нас, следующим шагом можно предложить их в Европе.§!"
 ukr_modernize_sov_equipment_btr50_europe_offer: "Предложить хранящиеся §YБТР-50§! в Европе"
 ukr_modernize_sov_equipment_btr50_europe_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[HUN.GetNameWithFlag]§!, §Y[ROM.GetNameWithFlag]§! и §Y[CRO.GetNameWithFlag]§! всё ещё используют советскую бронетехнику и ищут дешёвые машины. Мы можем предложить хранящиеся §YБТР-50§! одной из этих стран.\n------------------\nЕсли их никто не купит, §YХКБМ§! может перестроить их для нашей армии.§!"
 ukr_modernize_sov_equipment_btr50_kmdb_modernization: "Перестроить хранящиеся §YБТР-50§! в §YБТР-50М§!"
 ukr_modernize_sov_equipment_btr50_kmdb_modernization_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_kmdb_modernization_for_tooltip\n\n\n\n\n\n\n\n\n§W§YХКБМ§! предлагает модернизацию §YБТР-50М§!: новый боевой модуль с 30-мм пушкой, спаренным пулемётом, пусковой установкой ПТУР §Y«Конкурс»§! и гранатомётом §YАГС-17§!, украинский дизель §YУТД-20§! и улучшенную подвеску. Все §YБТР-50§!, ещё остающиеся на хранении, перестраиваются §Gдля нашей армии§!.§!\n\n$UKR_rada_modernization_design_tt$\n\nРазработка стоит §R[?UKR_storage_btr50_development_cost|2]§! млрд; перестройка хранящихся машин отдельно стоит §R0.03§! млрд. Оба платежа вносятся при начале работ."
 ukr_modernize_sov_equipment_pt76_indonesia_offer: "Предложить хранящиеся §YПТ-76Б§!: §Y[IND.GetNameWithFlag]§!"
 ukr_modernize_sov_equipment_pt76_indonesia_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_pt76_for_tooltip\n\n\n\n\n\n\n\n\n§WМорская пехота (§Y[IND.GetNameWithFlag]§!) всё ещё полагается на плавающий танк §YПТ-76§!. Мы можем предложить ей батальон хранящихся у нас §YПТ-76Б§!. Предложение действует до середины 2001 года.\n------------------\nЕсли сделка сорвётся или часть танков останется у нас, следующим шагом можно предложить их в Европе.§!"
 ukr_modernize_sov_equipment_pt76_europe_offer: "Предложить хранящиеся §YПТ-76Б§! в Европе"
 ukr_modernize_sov_equipment_pt76_europe_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_pt76_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[CRO.GetNameWithFlag]§! и §Y[BOS.GetNameWithFlag]§! всё ещё используют советскую бронетехнику, и им пригодился бы батальон лёгких плавающих танков. Мы можем предложить хранящиеся §YПТ-76Б§! одной из этих стран.§!"
 ukr_modernize_sov_equipment_pt76_scrap: "Утилизировать хранящиеся §YПТ-76Б§!"
 ukr_modernize_sov_equipment_pt76_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_pt76_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши хранящиеся §YПТ-76Б§! больше никому не нужны. Утилизация обойдётся в §Rот 10 до 20 млн§! в зависимости от того, сколько их осталось, зато заводы в Харькове на год получат обратно §Gмикросхемы, алюминий и сталь§!.§!"
 ukr_modernize_sov_equipment_2k11_caucasus_offer: "Предложить хранящиеся §Y2К11 «Круг»§! на Кавказе"
 ukr_modernize_sov_equipment_2k11_caucasus_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_2k11_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[GEO.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§! и §Y[ARM.GetNameWithFlag]§! хотят получить ПВО большой дальности. Мы можем продать хранящиеся §Y2К11 «Круг»§! одной из этих стран, не более двух дивизионов из трёх батарей по девять пусковых установок.\nТе, кого мы обойдём, §Rзатаят обиду§!.§!"
 ukr_modernize_sov_equipment_2k11_central_asia_offer: "Предложить хранящиеся §Y2К11 «Круг»§! в Центральной Азии"
 ukr_modernize_sov_equipment_2k11_central_asia_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_2k11_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[KAZ.GetNameWithFlag]§!, §Y[TRK.GetNameWithFlag]§! и §Y[KYR.GetNameWithFlag]§! могут купить до двух дивизионов хранящихся у нас §Y2К11 «Круг»§!.\n§Y[SOV.GetNameWithFlag]§! считает регион своим, и её давление может §Rотпугнуть покупателя§!. Если один откажется, можно попробовать других.§!"
 ukr_modernize_sov_equipment_2k11_scrap: "Утилизировать хранящиеся §Y2К11 «Круг»§!"
 ukr_modernize_sov_equipment_2k11_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_2k11_for_tooltip\n\n\n\n\n\n\n\n\n§WНаши хранящиеся §Y2К11 «Круг»§! больше никому не нужны. Утилизация обойдётся в §Rот 10 до 20 млн§! в зависимости от того, сколько их осталось, зато заводы в Харькове на год получат обратно §Gмикросхемы, сталь и резину§!.§!"
 ukr_modernize_sov_equipment_btr50_orders_tt: "Заказы, которые может сделать покупатель:\n• Для взвода из §Y13§! машин нужно их мнение о нас не ниже §Y10§!.\n• Для роты из §Y40§! машин нужно их мнение о нас не ниже §Y25§!.\nОплата при поставке."
 ukr_modernize_sov_equipment_pt76_orders_tt: "Для батальона из §Y40§! танков нужно мнение покупателя о нас не ниже §Y20§!. Оплата при поставке."
 ukr_modernize_sov_equipment_2k11_orders_tt: "Заказы, которые может сделать покупатель (дивизион — три батареи по девять пусковых установок):\n• Для одного дивизиона из §Y27§! пусковых установок нужно их мнение о нас не ниже §Y10§!.\n• Для двух дивизионов из §Y54§! пусковых установок нужно их мнение о нас не ниже §Y25§!.\nВ каждом регионе мы продаём не более двух дивизионов."
 ukr_modernize_sov_equipment_storage_indonesia_bundle_tt: "Если §Y[IND.GetNameWithFlag]§! уже купила наши §YБТР-50§! или §YПТ-76Б§!, для другой сделки нужно мнение о нас на §G10 ниже§!."
 ukr_modernize_sov_equipment_btr50_egypt_bonus_tt: "Если §Y[EGY.GetNameWithFlag]§! купит наши §YБТР-50§!, для предложения и контрактов по §YТ-62-5ТДФ§! понадобится мнение о нас на §G10 ниже§!."
 ukr_modernize_sov_equipment_2k11_caucasus_rivals_tt: "Две страны, которые мы обойдём, получают §R-15§! к мнению о нас."
 ukr_modernize_sov_equipment_2k11_russia_tt: "§Y[SOV.GetNameWithFlag]§! может отговорить покупателя от сделки. Чем сильнее её влияние там превышает наше, тем §Rвыше вероятность§! отказа покупателя."
 ukr_modernize_sov_equipment_t62_egypt_5tdf_opinion_tt: "Мнение о нас (§Y[EGY.GetNameWithFlag]§!) не ниже §Y15§! (§Y5§! после покупки наших §YБТР-50§!)"
