 ukr_modernize_sov_equipment_btr50_indonesia_offer: "§Y[IND.GetNameWithFlag]§!에 비축 §YBTR-50§! 제안"
 ukr_modernize_sov_equipment_btr50_indonesia_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[IND.GetNameWithFlag]§!은(는) 아직 해병대에서 소련제 수륙양용 장갑차를 씁니다. 다른 곳에서 사들이기 전에 비축된 §YBTR-50§! 한 개 소대 또는 한 개 중대 분량을 제안할 수 있습니다. 제안은 2001년 중반까지 유효합니다.\n------------------\n실패하거나 일부 차량을 남겨 둘 경우, 다음으로 §Y[EGY.GetNameWithFlag]§!에 제안할 수 있습니다.§!"
 ukr_modernize_sov_equipment_btr50_egypt_offer: "§Y[EGY.GetNameWithFlag]§!에 비축 §YBTR-50§! 제안"
 ukr_modernize_sov_equipment_btr50_egypt_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[EGY.GetNameWithFlag]§!은(는) 아직 §YBTR-50§!를 운용하며 예비 차량이 필요합니다. 지금 거래하면 우리의 §YT-62-5TDF§! 제안에 대한 카이로의 태도도 누그러집니다.\n------------------\n실패하거나 일부 차량을 남겨 둘 경우, 다음으로 유럽에 제안할 수 있습니다.§!"
 ukr_modernize_sov_equipment_btr50_europe_offer: "유럽에 비축 §YBTR-50§! 제안"
 ukr_modernize_sov_equipment_btr50_europe_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[HUN.GetNameWithFlag]§!, §Y[ROM.GetNameWithFlag]§!, §Y[CRO.GetNameWithFlag]§!은(는) 아직 소련제 장갑차를 운용하며 값싼 차량을 찾고 있습니다. 비축된 §YBTR-50§!를 이 가운데 한 나라에 제안할 수 있습니다.\n------------------\n아무도 사지 않으면 §YKhKBM§!이 우리 군용으로 개조할 수 있습니다.§!"
 ukr_modernize_sov_equipment_btr50_kmdb_modernization: "비축 §YBTR-50§!를 §YBTR-50M§!으로 개조"
 ukr_modernize_sov_equipment_btr50_kmdb_modernization_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr50_kmdb_modernization_for_tooltip\n\n\n\n\n\n\n\n\n§W§YKhKBM§!이 §YBTR-50M§! 업그레이드를 제안합니다. 30mm 기관포, 동축 기관총, §YKonkurs§! 대전차 유도 미사일 발사기, §YAGS-17§! 유탄발사기를 갖춘 새 전투 모듈과 우크라이나제 §YUTD-20§! 디젤 엔진, 개선된 현가장치를 장착합니다. 비축고에 남은 §YBTR-50§!는 전부 §G우리 군용§!으로 개조됩니다.§!\n\n$UKR_rada_modernization_design_tt$\n\n개발 비용은 §R[?UKR_storage_btr50_development_cost|2]§!십억이며, 비축 차량 개조에는 별도로 §R0.03§!십억이 듭니다. 두 비용 모두 작업을 시작할 때 지불합니다."
 ukr_modernize_sov_equipment_pt76_indonesia_offer: "§Y[IND.GetNameWithFlag]§!에 비축 §YPT-76B§! 제안"
 ukr_modernize_sov_equipment_pt76_indonesia_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_pt76_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[IND.GetNameWithFlag]§! 해병대는 아직 §YPT-76§! 수륙양용 전차에 의존합니다. 비축된 §YPT-76B§! 한 개 대대 분량을 제안할 수 있습니다. 제안은 2001년 중반까지 유효합니다.\n------------------\n실패하거나 일부 전차를 남겨 둘 경우, 다음으로 유럽에 제안할 수 있습니다.§!"
