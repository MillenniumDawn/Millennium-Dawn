 alice_miller_v_ministry_of_defence: "Decisão Alice Miller Não Aplicada"
 alice_miller_v_ministry_of_defence_desc: "Em abril de 1994, a oficial da força aérea Tenente Alice Miller processou o Ministério da Defesa perante a Suprema Corte de Justiça, denunciando a injustiça da recusa da Força Aérea Israelense em permitir que mulheres se candidatassem à Academia de Voo e se tornassem pilotos. A Suprema Corte decidiu a seu favor em dezembro de 1995, e ainda assim a formatura de mulheres na academia de voo tem sido limitada e tratada de forma pouco profissional.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §Y$ISR_miller_case$§!, §Y$ISR_matkal_women$§! ou §Y$ISR_ban_women_from_military$§!."
 daneils_final_prophecy_1: "A Visão Final de Daniel"
 daneils_final_prophecy_1_desc: "Na última visão concedida a ele por Deus, Daniel viu uma guerra final entre o Rei do Norte e o Rei do Sul, uma guerra que testaria a capacidade do Povo Judeu de ver quem é servo de Deus e quem é aliado de Satanás, antes que o Fim dos Tempos seja desencadeado sobre a humanidade. Hoje, nos encontramos presos entre as oportunidades crescentes de colaborar com o gigante chinês e as suspeitas de nossos maiores aliados em Washington. A escolha de em quem confiar é nossa.\n§W--------------§!\nEste espírito nacional §GMelhorará§! a cada foco que concluirmos no ramo §Y$ISR_balance_favor_america$§! ou §Y$ISR_balance_favor_china$§!, e será §RRemovido§! quando esse ramo for concluído."
