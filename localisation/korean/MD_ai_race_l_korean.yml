l_korean:
 AI_RACE_debug_category: "디버그: AI 경쟁"
 AI_RACE_debug_category_desc: "AI 경쟁을 점검하고 복구하는 개발자용 제어 메뉴입니다. 이 분류는 디버그 빌드에서만 보입니다."
 AI_RACE_debug_readout: "디버그: AI 경쟁 상태 확인"
 AI_RACE_debug_readout_desc: "§H국가 상태§!\n역량: §Y[?ROOT.ai_race_capability|0]§! | 국가: §Y[?ROOT.ai_race_capability_external|0]§! | 비축: §Y[?ROOT.ai_race_capability_stock|0]§!\n선두와의 격차: §Y[?ROOT.ai_race_frontier_gap|+0]§! | 순위: §Y[?ROOT.ai_race_rank|0]§!\n\n§H전 세계 상태§!\n선두: §Y[?global.ai_race_frontier_capability|0]§! | 에포크: §Y[?global.ai_race_epoch|0]§! | 참가국: §Y[?global.ai_race_participants^num|0]§!"
 AI_RACE_debug_repair: "디버그: AI 경쟁 상태 복구"
 AI_RACE_debug_repair_desc: "누락된 AI 경쟁 상태를 초기화하고, 파생된 국가 및 전 세계 상태를 다시 만들며, 한계가 있는 값을 범위 안으로 조정합니다. 분기별 에포크는 진행시키지 않습니다."
 AI_RACE_category: "AI 경쟁"
 AI_RACE_category_desc: "AI 경쟁에서 앞서 나가기 위해 우리의 산업 역량, 전력 공급, 자재 공급을 키웁니다. 국가 자금을 투입하기 전에 투자 건마다 검토하십시오."
 AI_RACE_stage_0: "자금 투입 단계 없음"
 AI_RACE_stage_1: "연구"
 AI_RACE_stage_2: "구현"
 AI_RACE_stage_3: "확장"
 AI_RACE_stage_4: "프런티어 AI"
 AI_RACE_first_finisher_none: "선점국 없음"
 AI_RACE_first_finisher_country: "[?global.ai_race_first_finisher_id.GetName]"
 AI_RACE_dashboard_title: "AI 경쟁"
 AI_RACE_dashboard_stage: "단계: §Y[ai_race_stage_name]§!\n[ai_race_stage_work]"
 AI_RACE_dashboard_capacity: "§H가동 역량: 보유 / 필요§!\n민간 공장: [?ROOT.ai_race_current_civs_available|0] / [?ROOT.ai_race_current_civs_required|0] ([?ROOT.ai_race_current_civs_ratio|%0]; [ai_race_current_civs_status])\n네트워크 기반시설: [?ROOT.ai_race_current_network_available|0] / [?ROOT.ai_race_current_network_required|0] ([?ROOT.ai_race_current_network_ratio|%0]; [ai_race_current_network_status])\n지속 전력: [?ROOT.ai_race_current_power_available|1] / [?ROOT.ai_race_current_power_required|1] GW ([?ROOT.ai_race_current_power_ratio|%0]; [ai_race_current_power_status])\n마이크로칩: [?ROOT.ai_race_current_microchips_available|1] / [?ROOT.ai_race_current_microchips_required|0] ([?ROOT.ai_race_current_microchips_ratio|%0]; [ai_race_current_microchips_status])\n첨단 복합재: [?ROOT.ai_race_current_composites_available|1] / [?ROOT.ai_race_current_composites_required|0] ([?ROOT.ai_race_current_composites_ratio|%0]; [ai_race_current_composites_status])\n석유: [?ROOT.ai_race_current_oil_available|1] / [?ROOT.ai_race_current_oil_required|0] ([?ROOT.ai_race_current_oil_ratio|%0]; [ai_race_current_oil_status])\n§Y제한 요건§!: [ai_race_current_bottleneck]."
 AI_RACE_dashboard_benefits: "가동 효율: §Y[?ROOT.ai_race_current_readiness|%1]§!\n혜택: 연구 속도,\n생산 효율 성장, 사무소 수입에 각각 §G[?ROOT.ai_race_bonus|%1]§!."
 AI_RACE_dashboard_ranking: "분기 순위: §Y[?ROOT.ai_race_rank|0]§! | 역량: §Y[?ROOT.ai_race_effective_capability|1]§!\n역량 내역은 여기에 마우스를 올려 확인하십시오.\n역대 최초 달성국: §Y[ai_race_first_finisher_name]§!"
 AI_RACE_capability_breakdown_funded: "§H역량 내역§!\n상한 적용 후 국가 역량: §Y[?ROOT.ai_race_capability_external|1]§!\n투입 자금 비축: §Y[?ROOT.ai_race_capability_stock|1]§! | 현재 가동 준비도에서 사용 가능: §Y[?ROOT.ai_race_capability_funded_usable|1]§!\n최종 상한 적용 후 실효 역량: §Y[?ROOT.ai_race_effective_capability|1]§!"
 AI_RACE_capability_breakdown_unfunded: "§H역량 내역§!\n상한 적용 후 국가 역량: §Y[?ROOT.ai_race_capability_external|1]§!\n실효 역량: §Y[?ROOT.ai_race_effective_capability|1]§!"
 AI_RACE_bottleneck_none: "현재 병목 없음"
 AI_RACE_bottleneck_civs: "민간 공장"
 AI_RACE_bottleneck_network: "네트워크 기반시설"
 AI_RACE_bottleneck_power: "지속 전력"
 AI_RACE_bottleneck_microchips: "마이크로칩"
 AI_RACE_bottleneck_composites: "첨단 복합재"
 AI_RACE_bottleneck_oil: "석유"
 AI_RACE_dashboard_investment: "다음 투자: §Y[?ROOT.ai_race_offer_cost|1]십억 달러§!\n다음 단계 가동 준비도: §Y[?ROOT.ai_race_offer_readiness|%1]§!\n아래에서 검토를 열어 역량과 자금 조달 조건을 확인하십시오."
 AI_RACE_dashboard_financing: "§H미상환 AI 금융§!: §Y[?ROOT.ai_race_finance_outstanding|2]십억 달러§!\n총 상환액: §Y매주 [?ROOT.ai_race_finance_weekly|3]십억 달러§!\n§H남은 원금 / 원금 (십억 달러); 주간 상환액 (십억 달러); 남은 납입 횟수§!\n연구: [?ROOT.ai_race_finance_remaining_1|2] / [?ROOT.ai_race_finance_original_1|2]; [?ROOT.ai_race_finance_due_1|3]; [?ROOT.ai_race_finance_installments_1|0]\n구현: [?ROOT.ai_race_finance_remaining_2|2] / [?ROOT.ai_race_finance_original_2|2]; [?ROOT.ai_race_finance_due_2|3]; [?ROOT.ai_race_finance_installments_2|0]\n확장: [?ROOT.ai_race_finance_remaining_3|2] / [?ROOT.ai_race_finance_original_3|2]; [?ROOT.ai_race_finance_due_3|3]; [?ROOT.ai_race_finance_installments_3|0]\n프런티어 AI: [?ROOT.ai_race_finance_remaining_4|2] / [?ROOT.ai_race_finance_original_4|2]; [?ROOT.ai_race_finance_due_4|3]; [?ROOT.ai_race_finance_installments_4|0]"
 AI_RACE_dashboard_rival: "§Y[?THIS.ai_race_rank|0].§! [THIS.GetNameWithFlag] | [ai_race_stage_name] | 역량 [?THIS.ai_race_effective_capability|1]"
 AI_RACE_review_available_tt: "다음 단계는 시기, 기술, 이전 단계 작업 요건을 충족했으며 보류 중인 투자 검토도 없습니다. 구매를 확정할 때 국고와 파산 여부를 확인합니다."
 AI_RACE_review_investment_tt: "선행 투자, 역량 요건별 현황, 긴급 AI 금융 여부를 무료로 검토할 수 있습니다. 확정까지 7일이 주어지며, 응답하지 않으면 투자는 보류됩니다."
 AI_RACE_defer_investment_tt: "국고 자금을 쓰거나 금융 조달을 만들지 않고 투자를 보류합니다. 응답하지 않은 검토는 7일 뒤 만료됩니다."
 AI_RACE_pay_direct_tt: "국고에서 §Y[?ROOT.ai_race_quote_cost|2]십억 달러§!를 지불하고, 새 금융 조달 없이 검토한 단계를 시작합니다. 시작한 달은 완료된 단계 작업으로 치지 않습니다."
 AI_RACE_pay_financed_tt: "국고에서 §Y[?ROOT.ai_race_quote_cost|2]십억 달러§!를 지불하고 검토한 단계를 시작하며, 추가로 매주 상환하는 §Y긴급 AI 금융§!을 받습니다. 용량 부족 중에도 단계 작업은 계속되며, 가장 약한 물리적 요건이 혜택을 결정합니다. 시작한 달은 완료된 단계 작업으로 치지 않습니다."
 AI_RACE_quote_capacity_tt: "§H견적 역량: 보유 / 필요§!\n민간 공장: [?ROOT.ai_race_quote_civs_available|0] / [?ROOT.ai_race_quote_civs_required|0] ([?ROOT.ai_race_quote_civs_ratio|%1]; [ai_race_quote_civs_status])\n네트워크 기반시설: [?ROOT.ai_race_quote_network_available|0] / [?ROOT.ai_race_quote_network_required|0] ([?ROOT.ai_race_quote_network_ratio|%1]; [ai_race_quote_network_status])\n지속 전력: [?ROOT.ai_race_quote_power_available|1] / [?ROOT.ai_race_quote_power_required|1] GW ([?ROOT.ai_race_quote_power_ratio|%1]; [ai_race_quote_power_status])\n마이크로칩: [?ROOT.ai_race_quote_microchips_available|1] / [?ROOT.ai_race_quote_microchips_required|0] ([?ROOT.ai_race_quote_microchips_ratio|%1]; [ai_race_quote_microchips_status])\n첨단 복합재: [?ROOT.ai_race_quote_composites_available|1] / [?ROOT.ai_race_quote_composites_required|0] ([?ROOT.ai_race_quote_composites_ratio|%1]; [ai_race_quote_composites_status])\n석유: [?ROOT.ai_race_quote_oil_available|1] / [?ROOT.ai_race_quote_oil_required|0] ([?ROOT.ai_race_quote_oil_ratio|%1]; [ai_race_quote_oil_status])\n§Y용량 부족§!: 100%에 못 미치는 요건이 하나라도 있는 상태. 가장 약한 요건이 가동 효율을 결정합니다. 인도된 수입품은 공급으로 셉니다. 손상되지 않은 건물만 계산하며, 배터리 방전으로는 지속 전력 수요를 충당할 수 없습니다."
 AI_RACE_quote_financing_tt: "§H긴급 AI 금융§!\n용량 부족 시 선행 투자에 더해 이용할 수 있습니다.\n선행 투자: §Y[?ROOT.ai_race_quote_cost|2]십억 달러§!\n승인 시점 GDP: §Y[?ROOT.ai_race_quote_gdp|2]십억 달러§!\n고정 조달액: §Y[?ROOT.ai_race_quote_principal|2]십억 달러§!, 승인 시점 GDP의 §Y[?ROOT.ai_race_quote_rate|%1]§!에 해당합니다.\n상환: 10년 만기 동안 §Y520회 주간 분할 납입§!으로 §Y매주 [?ROOT.ai_race_quote_payment|3]십억 달러§!. 마지막 납입에서 남은 금액을 정확히 정산합니다.\n패키지마다 주간 상환액이 따로 더해집니다. 수리, 인플레이션, 이후의 GDP 변화는 승인된 원금을 바꾸거나 상환을 취소하지 않습니다. 견적이 바뀌면 새로 검토해야 하며 비용은 청구되지 않습니다."
 ai_race.10.t: "프런티어 AI 달성"
 ai_race.10.d: "우리 국가 AI 프로그램이 프런티어 AI에 이르렀습니다. 우리 연구진과 산업계가 이룬 이 이정표는 이제 지속적인 국가적 지원에 달려 있습니다."
 ai_race.10.a: "성과를 인정한다."
 ai_race.11.t: "투자 검토 무효화"
 ai_race.11.d: "이 투자는 검토한 조건대로 더는 진행할 수 없습니다. 자금은 청구되지 않았고 금융 조달 패키지도 만들어지지 않았습니다. 진입 요건을 충족하면 AI 경쟁 결정에서 새로 검토를 요청할 수 있습니다."
 ai_race.11.a: "제안을 다시 검토한다."
 ai_race_news.1.t: "프런티어 AI 최초 달성"
 ai_race_news.1.d: "[?global.ai_race_first_finisher_id.GetName]이(가) 프런티어 AI를 처음으로 달성한 국가가 되었습니다. 이 나라의 연구진과 산업 파트너는 인공지능 역사에 길이 남을 자리를 차지했으며, 경쟁국들의 국가 프로그램은 계속 이어지고 있습니다."
 ai_race_news.1.a: "경쟁은 계속된다."
 AI_RACE_review_research: "연구 투자 검토"
 AI_RACE_review_research_desc: "500억 달러 규모의 연구 투자를 비용 없이 검토합니다. 현대식 딥러닝을 연구하면 2016년 1월부터 진입할 수 있습니다. 다음 단계로 나아가려면 연구를 36개월 완료해야 합니다."
 ai_race.1.t: "연구 투자 검토"
 ai_race.1.d: "우리 연구 기관들이 고립된 실험에 머물던 첨단 인공지능을 끌어내 줄 국가 프로그램을 제안했습니다. 제안은 이제 투자 결정을 기다리고 있습니다."
 ai_race.1.a: "투자를 보류한다."
 ai_race.1.b: "국고에서 [?ROOT.ai_race_quote_cost|1]십억 달러를 투자한다."
 ai_race.1.c: "긴급 AI 금융으로 투자한다."
 AI_RACE_review_implementation: "구현 투자 검토"
 AI_RACE_review_implementation_desc: "1500억 달러 규모의 구현 투자를 비용 없이 검토합니다. 현대식 딥러닝을 연구하고 연구를 36개월 완료하면 2019년 1월부터 진입할 수 있습니다. 다음 단계로 나아가려면 구현을 60개월 완료해야 합니다."
 ai_race.2.t: "구현 투자 검토"
 ai_race.2.d: "우리 연구 프로그램이 더 폭넓은 도입의 토대를 닦았습니다. 산업계와 공공 기관이 다음 국가 투자를 제안했습니다."
 ai_race.2.a: "투자를 보류한다."
 ai_race.2.b: "국고에서 [?ROOT.ai_race_quote_cost|1]십억 달러를 투자한다."
 ai_race.2.c: "긴급 AI 금융으로 투자한다."
 AI_RACE_review_expansion: "확장 투자 검토"
 AI_RACE_review_expansion_desc: "4000억 달러 규모의 확장 투자를 비용 없이 검토합니다. 인간 모방 AI를 연구하고 구현을 60개월 완료하면 2024년 1월부터 진입할 수 있습니다. 다음 단계로 나아가려면 확장을 12개월 완료해야 합니다."
 ai_race.3.t: "확장 투자 검토"
 ai_race.3.d: "인공지능이 산업과 기반시설에 갈수록 큰 부담을 지우는 국가적 사업이 되어 가고 있습니다. 우리의 확장 제안은 이러한 야망을 한데 모아 검토에 부칩니다."
 ai_race.3.a: "투자를 보류한다."
 ai_race.3.b: "국고에서 [?ROOT.ai_race_quote_cost|1]십억 달러를 투자한다."
 ai_race.3.c: "긴급 AI 금융으로 투자한다."
 AI_RACE_review_frontier: "최첨단 AI 투자 검토"
 AI_RACE_review_frontier_desc: "비용 없이 1,000십억 달러 규모의 최첨단 AI 투자를 검토합니다. 2025년 1월부터 인간 모방 AI를 연구하고 확장 단계를 12개월간 마치면 진입할 수 있습니다. 최첨단 AI를 달성하면 국가 간 경쟁이 끝나며, 이후의 AI 기술은 각자의 연구 시점과 효과를 그대로 유지합니다."
 ai_race.4.t: "최첨단 AI 투자 검토"
 ai_race.4.d: "우리의 국가 프로그램이 AI 경쟁의 최전선에 다가서고 있습니다. 최종 투자안에는 그 위치를 유지하는 데 필요한 역량이 정리되어 있습니다."
 ai_race.4.a: "투자를 미룬다."
 ai_race.4.b: "국고에서 $[?ROOT.ai_race_quote_cost|1]십억을 투자한다."
 ai_race.4.c: "긴급 AI 금융 지원으로 투자한다."
 AI_RACE_refresh_assessment: "평가 갱신"
 ai_race_operating_modifier: "국가 AI 프로그램"
 ai_race_operating_modifier_desc: "자금이 투입된 우리 AI 프로그램은 국가의 산업, 전력, 자재 공급을 끌어다 씁니다. 그 이점은 우리가 지속적으로 감당할 수 있는 역량에 달려 있습니다."
 ai_race_applied_power: "AI 전력 요구량"
 ai_race_applied_microchips: "AI 마이크로칩 요구량"
 ai_race_applied_composites: "AI 복합재 요구량"
 ai_race_applied_oil: "AI 석유 요구량"
 AI_RACE_stage_work_pending: "연구에 자금을 투입하면 작업이 시작됩니다."
 AI_RACE_stage_work_progress: "단계 작업: §Y[?ROOT.ai_race_stage_months|0] / [?ROOT.ai_race_current_required_months|0]개월§!"
 AI_RACE_stage_work_terminal: "최첨단 AI 달성. 남은 경쟁 단계가 없습니다."
 AI_RACE_capacity_pending: "자금이 투입된 단계가 없습니다.\n연구 단계를 검토해 필요 역량을 확인하십시오."
 AI_RACE_benefits_pending: "활성화된 단계 이점이 없습니다."
