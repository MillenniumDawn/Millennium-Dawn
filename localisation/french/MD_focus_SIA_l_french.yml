l_french:
 charoenchai_hinthao: "Charoenchai Hinthao"
 charoenchai_hinthao_desc: "A Royal Thai Army chief of the 2020s generation who built his reputation on defensive doctrine and the hard lessons of the southern border. He drills his formations to hold ground and bleed an attacker dry."
 songwit_noonpakdee: "Songwit Noonpakdee"
 songwit_noonpakdee_desc: "Un officier supérieur de l'armée royale thaïlandaise connu pour le travail d'état-major et l'organisation plutôt que pour le spectacle. Il tient les formations de l'armée pourvues, ravitaillées et prêtes, et il est à l'aise avec la politique qui vient avec le haut commandement."
 adung_phaniam: "Adung Phan-iam"
 adung_phaniam_desc: "Un officier général de la marine royale thaïlandaise de la flotte moderne, à l'aise avec les bâtiments de ligne et la doctrine d'action de surface. Il plaide pour une marine qui se fasse sentir au-delà du golfe de Thaïlande."
 punpakdee_pattanakul: "Punpakdee Pattanakul"
 punpakdee_pattanakul_desc: "Un officier de la force aérienne royale thaïlandaise de la génération réformatrice qui pousse le service vers des standards professionnels, des cellules modernes et une filière de formation qui produit des équipages plutôt que des formations de parade."
 intel_chief_nia: "Directeur, Agence nationale du renseignement"
 intel_chief_nia_desc: "Le chef de l'Agence nationale de renseignement de Thaïlande dirige l'effort de renseignement civil du pays, tissant les rapports des provinces, des frontières et du réseau palatial en un tableau unique pour le gouvernement."
 thailand_focus: "Arbre de concentration thaïlandais"
 SIA_the_2001_election_shortcut: "L'élection de 2001"
 SIA_lost_territories_shortcut: "Les territoires perdus"
 SIA_armed_forces_modernization_shortcut: "Modernisation des forces armées"
 SIA_recover_from_97_crisis_shortcut: "Tom Yum Kung Crise"
 SIA_asean_centrality_shortcut: "Centralité de l’ASEAN"
 SIA_the_southern_question_shortcut: "La question du Sud"
 SIA_kra_gateway_shortcut: "La porte de Kra"
 SIA_recover_from_97_crisis: "Reprise après la crise Tom Yum Kung"
 SIA_recover_from_97_crisis_desc: "En 1997, la crise Tom Yum Kung commença à Bangkok. Après avoir brûlé ses réserves de change à défendre le peg du baht, la Thaïlande fut forcée de flotter la monnaie et d'accepter un accord de stand-by du FMI. Le paquet garda le pays solvable, mais au prix d'une supervision intrusive et d'une perte de dignité économique. La dernière étape demeure : achever la reprise, rembourser le Fonds par anticipation, et reconquérir la pleine souveraineté."
 SIA_the_1997_constitution: "La Constitution du peuple"
 SIA_the_1997_constitution_desc: "The 1997 Constitution is drafted with unprecedented public participation, promises an elected Senate, human-rights guarantees, and strong anti-corruption bodies. Will it survive Thai politics?"
 SIA_repay_the_imf: "Rembourser le FMI par anticipation"
 SIA_repay_the_imf_desc: "Thailand cleared the last of the standby facility in July 2003, two years ahead of schedule. Paying it off early is less about the principal and more about the signal. Markets stop pricing Thai debt as a bailout risk and the Kingdom borrows at a cheaper rate again."
 SIA_amazing_thailand: "Thaïlande incroyable"
 SIA_amazing_thailand_desc: "La campagne touristique qui nous a portés pendant les années de crise devient stratégie nationale. De Phuket à Chiang Mai, le monde est invité au Pays du sourire, et le monde paie en devises fortes."
 SIA_rice_and_rubber: "Grenier à riz de l'Asie"
 SIA_rice_and_rubber_desc: "La Thaïlande est le premier exportateur mondial de riz et une superpuissance du caoutchouc. Moderniser l'économie agricole de l'Isaan et du Sud et transformer le muscle agricole en recettes d'exportation."
 SIA_detroit_of_asia: "Le Détroit de l'Asie"
 SIA_detroit_of_asia_desc: "Les constructeurs japonais et américains ont fait de la côte orientale leur usine régionale. Doubler la mise sur l'automobile et faire de « made in Thailand » un standard mondial."
 SIA_suvarnabhumi_airport: "Aéroport Suvarnabhumi"
 SIA_suvarnabhumi_airport_desc: "Décennies de planification, le nouvel aéroport de Bangkok sera le grand hub aérien de l'Asie du Sud-Est. Des portes provinciales comme Phuket y alimentent le trafic et élèvent l'aviation thaïlandaise dans son ensemble, si nous pouvons finir de le bâtir."
 SIA_eastern_economic_corridor: "La côte orientale"
 SIA_eastern_economic_corridor_desc: "Approfondir le corridor industriel de Chonburi à Rayong avec ports, raffineries, usines et rail. La salle des machines de l'économie thaïlandaise."
 SIA_medical_hub: "Pôle médical de l'Asie"
 SIA_medical_hub_desc: "Des hôpitaux de classe mondiale à des prix de pays en développement. Le tourisme médical amène des patients, et du prestige, du monde entier."
 SIA_education_for_the_future: "Éduquer le Royaume"
 SIA_education_for_the_future_desc: "Les salles de classe thaïlandaises récompensent encore l'apprentissage par cœur plutôt que la résolution de problèmes, et la qualité des enseignants varie énormément entre Bangkok et les provinces. Un programme moderne, des enseignants mieux formés et des filières professionnelles alignées sur les besoins de l'industrie sont le fondement de toute poussée vers une économie à haut revenu."
 SIA_asean_centrality: "Centralité de l’ASEAN"
 SIA_asean_centrality_desc: "Bangkok est le lieu de fondation de l'ASEAN en 1967. Réinvestir dans le voisinage, car une Asie du Sud-Est stable et amie est la meilleure garantie de sécurité de la Thaïlande."
 SIA_treaty_ally: "Allié majeur non membre de l'OTAN"
 SIA_treaty_ally_desc: "La plus ancienne relation de traité américaine en Asie. Approfondir Cobra Gold, accueillir le matériel américain, et encaisser la garantie de sécurité tant qu'elle dure."
 SIA_bamboo_bends_east: "Le bambou plie vers l'Est"
 SIA_bamboo_bends_east_desc: "La diplomatie thaïlandaise plie avec le vent, et le vent souffle de Pékin. Investissement chinois, chemins de fer chinois, marchés chinois, tout cela à un prix encore en négociation."
 SIA_the_2001_election: "L'élection de 2001"
 SIA_the_2001_election_desc: "La première élection de la Constitution du peuple. La crise a brisé le vieux consensus. De nouvelles forces populistes, le réseau de pouvoir traditionnel et les démocrates se disputent désormais la direction de la nation."
 SIA_thai_rak_thai: "Thaï Rak Thaï"
 SIA_thai_rak_thai_desc: "Les Thaïlandais aiment les Thaïlandais. Le raz-de-marée de Thaksin Shinawatra redessine la carte électorale. Le Nord et le Nord-Est ruraux décident désormais qui gouverne, et ils ont choisi leur champion."
 SIA_thaksinomics: "Thaksinomique"
 SIA_thaksinomics_desc: "Une économie à double voie. La première priorise les exportations mondiales et la seconde l'entrepreneuriat de base et intérieur. Cette approche renforce la croissance mais les critiques disent qu'elle élargit l'écart de richesse."
 SIA_30_baht_healthcare: "Soins de santé à 30 bahts"
 SIA_30_baht_healthcare_desc: "Toute maladie, tout hôpital, trente bahts. La couverture universelle transforme la vie de millions de Thaïlandais ruraux, et cimente leur loyauté au parti Shinawatra."
 SIA_village_fund: "Le fonds villageois d'un million de bahts"
 SIA_village_fund_desc: "Un million de bahts de microcrédit renouvelable pour chaque village et communauté urbaine du Royaume, l'un des plus vastes programmes de microfinance jamais tentés."
 SIA_otop: "Un Tambon Un Produit"
 SIA_otop_desc: "Chaque sous-district développe, marque et exporte un produit local signature. L'industrie artisanale devient stratégie nationale."
 SIA_dual_track_economy: "L'économie à double voie"
 SIA_dual_track_economy_desc: "Exportations en hausse, revenus ruraux en hausse, dette remboursée tôt. Quoi que disent les critiques sur la manière, le tableau de bord penche en faveur du gouvernement."
 SIA_war_on_drugs: "Guerre contre la drogue"
 SIA_war_on_drugs_desc: "Une campagne de trois mois pour briser le trafic de méthamphétamine. Elle sera populaire. Elle attirera aussi un grave examen des droits de l'homme qui suivra le gouvernement pendant des années."
 SIA_ceo_premier: "Le Premier ministre PDG"
 SIA_ceo_premier_desc: "Diriger le pays comme une entreprise. KPI pour les ministères, réunions de cabinet mobiles dans les provinces, impatience envers la bureaucratie. Efficace et corrosif pour chaque institution conçue pour dire non."
 SIA_dominant_party_state: "Un parti, une Thaïlande"
 SIA_dominant_party_state_desc: "Absorber les partenaires de coalition, dominer les ondes, gagner chaque partielle. La politique électorale continue mais il n'y a plus qu'un choix écrasant."
 SIA_consolidate_democracy: "Consolider la démocratie"
 SIA_consolidate_democracy_desc: "Gagner le pouvoir par les urnes, le tenir par les résultats, et laisser les institutions debout. La machine populiste se soumet à la Constitution du peuple."
 SIA_normalization_friction: "Friction de normalisation"
 SIA_normalization_friction_desc: "The old machine's patronage networks do not dissolve on schedule. They resist deregistration even as the party goes straight, and cleaning them up takes longer than anyone promised."
 SIA_thaksin_forever: "Thaksin pour toujours"
 SIA_thaksin_forever_desc: "L'opposition est irrelevante, les tribunaux sont achetés et le sénat est loyal. Pourquoi le projet devrait-il jamais finir ? Le parti dominant devient le parti permanent."
 SIA_shinawatra_dynasty: "La dynastie Shinawatra"
 SIA_shinawatra_dynasty_desc: "Le mouvement survit à tout leader. Le visage du parti peut changer pour une sœur ou une fille, le vrai pouvoir appartient encore à Thaksin Shinawatra et aux siens."
 SIA_the_old_order: "La monarchie de réseau"
 SIA_the_old_order_desc: "Palace, army, judiciary, bureaucracy. These are the institutions that have steered Thailand through every storm. They did not survive seven decades of upheaval by letting civilian elections decide everything."
 SIA_privy_council: "Le Conseil privé"
 SIA_privy_council_desc: "Les conseillers du roi, généraux à la retraite, juges et hommes d'État, siègent au centre silencieux de la toile de l'establishment. Renforcer les canaux qui contournent le gouvernement élu."
 SIA_royal_guidance: "La parole du roi"
 SIA_royal_guidance_desc: "Chaque décembre le roi parle et la nation écoute. Un discours d'anniversaire peut bénir un gouvernement ou lui retirer discrètement sa bénédiction, le pouvoir du respect qu'aucun bulletin ni ministre n'ose combattre. La voix du trône ramène le pays de la folie politique."
 SIA_three_pillars: "Nation, Religion, Roi"
 SIA_three_pillars_desc: "Chat, Sasana, Phra Maha Kasat, le drapeau tricolore fait catéchisme civique. Des moines dans les écoles, le roi sur chaque mur, la nation comme un seul corps moral. C'est une colle puissante, sauf là où les mosquées sont pleines et le catéchisme se lit comme une porte qui se ferme."
 SIA_yellow_shirts: "Les rassemblements de l'Alliance populaire"
 SIA_yellow_shirts_desc: "L'Alliance populaire pour la démocratie emplit les rues de Bangkok en jaune royal, exigeant le départ du gouvernement élu. La classe moyenne urbaine a choisi son camp."
 SIA_the_2006_coup: "Le coup de septembre"
 SIA_the_2006_coup_desc: "While the Prime Minister is abroad, tanks roll into Bangkok. The constitution is suspended, and the Council for Democratic Reform assumes control. The political cycle begins again."
 SIA_guardian_of_the_nation: "Gardien de la nation"
 SIA_guardian_of_the_nation_desc: "L'image que l'armée a d'elle-même, faite doctrine. Au-dessus de la politique, et pourtant en droit de mettre fin à toute politique qui menace la nation. Institutionaliser le veto militaire."
 SIA_judicial_activism: "La judiciarisation"
 SIA_judicial_activism_desc: "Pourquoi envoyer des chars quand un arrêt de cour suffira ? Dissolutions de partis et disqualifications deviennent le scalpel de choix de l'establishment."
 SIA_the_2014_coup: "Le NCPO"
 SIA_the_2014_coup_desc: "Martial law first, coup second. The National Council for Peace and Order suspends politics indefinitely and brings an \"attitude adjustment\" to the whole country."
 SIA_lese_majeste_enforcement: "Défendre l'institution sacrée"
 SIA_lese_majeste_enforcement_desc: "L'article 112 du code pénal protège la monarchie de l'insulte. L'appliquer sans retenue, et regarder chaque mouvement d'opposition peser ses mots."
 SIA_isoc_state: "L'État ISOC"
 SIA_isoc_state_desc: "Le Commandement des opérations de sécurité intérieure, le bras politique de l'armée dans chaque province, devient un gouvernement parallèle pour les affaires de « sécurité », le Deep South surtout."
 SIA_isoc_overreach_backlash: "Malaise public feutré"
 SIA_isoc_overreach_backlash_desc: "The internal-security apparatus reaches further into daily life than the Deep South alone. Ordinary Thais start to notice the patrols, checkpoints, and heightened security from military movements."
 SIA_the_2017_constitution: "Une démocratie guidée"
 SIA_the_2017_constitution_desc: "Un Sénat entièrement nommé, une clause de Premier ministre non élu, une stratégie nationale de vingt ans liant les gouvernements futurs. Les élections reprendront, dans une cage."
 SIA_perpetual_guardianship: "Tutelle perpétuelle"
 SIA_perpetual_guardianship_desc: "Formalize what was always implicitly known. The armed forces become the permanent constitutional umpire. A kind of stability that is now engraved into the constitution."
 SIA_royal_restoration: "Restauration du trône"
 SIA_royal_restoration_desc: "Go further than any government has dared. Gather the threads of the political network and place them formally in the palace's hands. The Chakri dynasty resumes direct stewardship of the realm as an absolute monarchy."
 SIA_seeds_of_reform: "Germes de réforme"
 SIA_seeds_of_reform_desc: "Outside the old binary of populists and royalists, a third force gathers. Young, urban, online, and done with coups.\n\nBacking the third force retires whatever political path the Kingdom was on and commits the Kingdom to the reformist trunk."
 SIA_future_forward: "Un avenir vers l'avant"
 SIA_future_forward_desc: "A new party of first-time politicians promises to break the cycle. Demilitarize, decentralize, democratize. The establishment reaches for its usual tools and finds this new opposition rallying stronger than it expected."
 SIA_three_demands: "Les trois exigences"
 SIA_three_demands_desc: "Dissoudre le parlement. Cesser d'intimider le peuple et rédiger une nouvelle constitution. Les étudiants disent à voix haute ce qui ne pouvait l'être, et le plafond de la politique thaïlandaise bouge."
 SIA_demilitarize_politics: "Les militaires hors de la politique"
 SIA_demilitarize_politics_desc: "Mettre fin aux abus de la conscription, couper les empires médiatiques et sièges d'administrateurs des généraux, et écrire l'armée hors de la politique. Ils ne nous en sauront pas gré."
 SIA_civilian_control: "Suprématie civile"
 SIA_civilian_control_desc: "Un ministère de la Défense dirigé par des civils, des promotions examinées par le parlement, et un budget militaire qui rend compte aux auditeurs. Radical seulement à Bangkok."
 SIA_amend_section_112: "Modifier l'article 112"
 SIA_amend_section_112_desc: "Réformer la loi de lèse-majesté. Limiter qui peut porter plainte, plafonner les peines, cesser de s'en servir contre le discours politique. Considéré comme le projet le plus dangereux de Thaïlande : il se peut qu'il n'y ait ni passage ni retour."
 SIA_decentralize: "Au-delà de Bangkok"
 SIA_decentralize_desc: "Des gouverneurs élus pour chaque province et des budgets qui ne passent plus par la capitale. Bangkok a été le pays tout entier trop longtemps."
 SIA_break_the_monopolies: "Briser les monopoles"
 SIA_break_the_monopolies_desc: "Duopoles de l'alcool, concessions télécoms, participations croisées des conglomérats. Ouvrir les goulets de l'économie thaïe et laisser entrer la concurrence loyale."
 SIA_welfare_state: "Un État providence thaïlandais"
 SIA_welfare_state_desc: "D'un patchwork de subventions à un vrai filet de pensions, de garde d'enfants et d'assurance-chômage. Coûteux, et aucun gouvernement suivant n'osera le défaire."
 SIA_marriage_equality: "Premier en Asie du Sud-Est"
 SIA_marriage_equality_desc: "L'égalité du mariage devient loi, la première en Asie du Sud-Est. Une réforme que le monde entier remarque, et la rare que l'establishment ne combat pas."
 SIA_deep_south_peace: "Paix dans le Grand Sud"
 SIA_deep_south_peace_desc: "Autonomie au sein du Royaume, justice pour les abus passés, identité malaise-patani respectée. L'insurrection s'achève à une table de négociation, pas à un checkpoint."
 SIA_consolidated_democracy: "La démocratie consolidée"
 SIA_consolidated_democracy_desc: "A constitution written by citizens, soldiers in barracks, courts that judge and do not rule. The cycle of coups is finally broken and made unthinkable."
 SIA_reform_transition_costs: "Assiette fiscale en transition"
 SIA_reform_transition_costs_desc: "Rénover les institutions, c'est rénover leur financement. La collecte des recettes traîne derrière le nouveau système le temps qu'il s'installe."
 SIA_a_new_republic: "Une nouvelle république"
 SIA_a_new_republic_desc: "La question qu'on n'avait jamais le droit de poser est mise au vote. Quel qu'en soit le résultat, la Thaïlande qui en sortira sera méconnaissable, si elle tient encore ensemble."
 SIA_lost_territories: "Les territoires perdus"
 SIA_lost_territories_desc: "1893. 1904. 1907. 1909. Every Thai schoolchild learns the dates Siam was carved out by imperial France and Britain. Phibun's generation marched to take them back once. The true maps of Siam are still in the archives."
 SIA_pan_thai_movement: "Une course de Tai"
 SIA_pan_thai_movement_desc: "Ressusciter la grande thèse de Wichit Wathakan. Thaï, Lao, Shan, un seul peuple tai, séparé par des frontières coloniales, attendant la réunion sous le drapeau thaï."
 SIA_rearmament: "Réarmer le Royaume"
 SIA_rearmament_desc: "L'ambition exige de l'acier. Porter le budget de défense au-delà de tout ce que les auditeurs ont vu et mettre l'industrie du Royaume sur le pied de guerre."
 SIA_modernize_the_rta: "Moderniser l'armée royale thaïe"
 SIA_modernize_the_rta_desc: "Nouveaux chars de bataille, nouveaux VCI, soldats professionnels à la place des conscrits tirés au sort. L'armée royale thaïe se prépare à des guerres au-delà du service de putsch."
 SIA_blue_water_navy: "Une marine sur deux océans"
 SIA_blue_water_navy_desc: "Le porte-aéronefs Chakri Naruebet reçoit enfin une vraie aéronavale et de vrais escortes, et le programme sous-marin cesse d'être une plaisanterie. Deux côtes, deux flottes."
 SIA_gripen_squadrons_rearm: "Paix Suvarnabhumi"
 SIA_gripen_squadrons_rearm_desc: "Gripen, appareils AEW, défense aérienne en liaison de données. Une petite force aérienne bâtie pour gagner la première semaine d'une guerre régionale."
 SIA_dti_self_reliance: "Autonomie du DTI"
 SIA_dti_self_reliance_desc: "L'Institut de technologie de la défense passe des mémoires aux chaînes de production. Fusils thaïs, blindés thaïs, roquettes thaïes, et aucun embargo n'arrête ce que nous construisons nous-mêmes."
 SIA_thai_yai: "Nos frères Tai Yai"
 SIA_thai_yai_desc: "The Shan of Burma speak a tongue that Thai people can understand. Their militias have fought Rangoon for generations. They lack only a patron and a flag to fight under."
 SIA_mekong_destiny: "Destin sur le Mékong"
 SIA_mekong_destiny_desc: "Sainyabuli et Champassak étaient siamois de mémoire d'homme, et les Lao sont les plus proches parents des Thaïs. Le fleuve qui nous sépare pourrait traverser un seul pays."
 SIA_preah_vihear: "Le temple est nôtre"
 SIA_preah_vihear_desc: "The 1962 ICJ ruling on Preah Vihear still burns in many Thais' hearts. Battambang and Siem Reap flew the Thai flag within living memory. The border disputes with Phnom Penh stop being managed and reignite old grievances."
 SIA_lost_sultanates: "Le traité de 1909 est caduc"
 SIA_lost_sultanates_desc: "Kelantan, Terengganu, Kedah, Perlis. Tributaires de Bangkok cédés à l'Empire britannique sans qu'un seul habitant fût consulté. Dénoncer le traité anglo-siamois."
 SIA_suwannaphum: "Suwannaphum United"
 SIA_suwannaphum_desc: "Suwannaphum, the Golden Land of antiquity, is whole again under the Thai flag. Begin the integration of the recovered territories into the Kingdom."
 SIA_victory_monument: "Le nouveau monument de la Victoire"
 SIA_victory_monument_desc: "L'obélisque de la Ratchawithi honore les morts de 1940-41, la dernière guerre pour les territoires perdus. Bâtir son successeur, et laisser la région en tirer ses conclusions."
 SIA_thailand_4_0: "Thaïlande 4.0"
 SIA_thailand_4_0_desc: "La valeur ajoutée partout. Robotique, biotech, services numériques. La quatrième révolution industrielle, planifiée depuis Government House et prouvée dans le Corridor économique oriental. Chaque province reçoit le dividende de productivité du déploiement de la stratégie nationale."
 SIA_three_airport_rail: "La liaison ferroviaire des trois aéroports"
 SIA_three_airport_rail_desc: "Don Mueang, Suvarnabhumi, U-Tapao, tous reliés par une seule ligne à grande vitesse d'une heure de bout en bout. C'est le chemin de fer le plus cher de l'histoire thaïe et l'épine dorsale du CEE."
 SIA_u_tapao_aerotropolis: "Aérotropole U-Tapao"
 SIA_u_tapao_aerotropolis_desc: "Un aérodrome de marine de l'ère du Vietnam devient une porte de 60 millions de passagers, avec hangars de maintenance, zone de libre-échange, et une ville florissante bâtie autour de la piste."
 SIA_eastern_aviation_city: "Ville de l'aviation de l'Est"
 SIA_eastern_aviation_city_desc: "La piste n'était que le début. Airbus et Thai Airways implantent un complexe de maintenance dans la zone de libre-échange, une académie d'aviation forme les mécaniciens, et les terminaux fret font d'U-Tapao l'atelier aérospatial de la région autant que sa porte. Du travail à haute valeur, et exigeant à nourrir."
 SIA_eec_take_off: "Le corridor décolle"
 SIA_eec_take_off_desc: "Usines de VE à Rayong, biotech à Chonburi, avionique à Chachoengsao. Le Corridor économique oriental cesse d'être un plan et commence d'être une région."
 SIA_hedge_the_bets: "Couvrir les paris"
 SIA_hedge_the_bets_desc: "Le bambou plie au vent et se redresse. Quoi que Washington ou Pékin croie que la Thaïlande a promis, la Thaïlande n'a rien promis qu'elle ne puisse réinterpréter."
 SIA_armed_forces_modernization: "Forces armées royales thaïlandaises"
 SIA_armed_forces_modernization_desc: "Armée, marine et force aérienne sous une seule couronne, l'épée et le bouclier du Royaume. Le krach de 1997 a gelé les achats en plein élan, laissant des escadrons à moitié livrés et un porte-aéronefs sans avions. Prendre les forces armées en main et tracer le cap des décennies à venir."
 SIA_gripen_deal: "L'accord Gripen"
 SIA_gripen_deal_desc: "Saab offre ce que Washington refuse. Un transfert de technologie complet, des compensations industrielles, un Erieye d'alerte avancée sont inclus dans le paquet, plus aucune leçon sur les putschs."
 SIA_gripen_ef_program: "Gripen E/F"
 SIA_gripen_ef_program_desc: "Le F-35 a été refusé et les F-16 sont plus vieux que leurs pilotes. Le Gripen E/F de nouvelle génération garde l'écosystème que les équipages thaïs connaissent déjà, et tient chaude la chaîne suédoise."
 SIA_eyes_in_the_sky: "Des yeux dans le ciel"
 SIA_eyes_in_the_sky_desc: "Les systèmes sans pilote israéliens, Searcher, Hermes et Dominator, donnent aux commandants thaïs ce que jungles et frontières leur ont toujours refusé. Une vue persistante."
 SIA_chinese_steel: "Acier chinois"
 SIA_chinese_steel_desc: "Le VT-4 de NORINCO coûte la moitié d'un char occidental et arrive sans sermons d'utilisateur final. Les M60 américains de l'armée vieillissent, et ses fournisseurs se font orientaux."
 SIA_s26t_program: "Le sous-marin S26T"
 SIA_s26t_program_desc: "Trois bateaux de classe Yuan ont été promis. Un seul pourrait vraiment arriver. Entre moteurs allemands inexportables et budgets indéfendables, le rêve sous-marin de la marine met la patience de chacun à l'épreuve."
 SIA_chakri_modernization: "Une refonte occidentale pour le navire amiral"
 SIA_chakri_modernization_desc: "La voie occidentale se poursuit à bord du navire amiral. Le HTMS Chakri Naruebet, construit en Espagne et longtemps à quai à Sattahip, reçoit des systèmes de combat et capteurs américains et européens. Une refonte au standard OTAN qui donne enfin au porte-aéronefs du Royaume un métier digne de son équipage."
 SIA_uxv_carrier_conversion: "Une aile de drone occidentale"
 SIA_uxv_carrier_conversion_desc: "Les Harrier sont des pièces de musée, mais le tremplin demeure. Avec des systèmes sans pilote occidentaux achetés chez les primes alliés, convertir le navire amiral pour lancer drones aériens, de surface et submersibles. Le premier porte-UXV d'Asie du Sud-Est, volant du matériel partenaire."
 SIA_telecom_empire: "La concession télécoms"
 SIA_telecom_empire_desc: "Satellites, réseaux mobiles, empire médiatique, tout cela fleurit remarquablement sous un gouvernement de magnats des télécoms. La ligne entre champion national et affaire de famille n'a jamais été plus mince."
 SIA_prayuth_premiership: "Le Premier ministre général"
 SIA_prayuth_premiership_desc: "Le chef du putsch échange l'uniforme contre le costume et le titre de junte contre un titre élu. Les 250 sénateurs nommés qui votent pour le Premier ministre rendent l'arithmétique confortable."
 SIA_senate_of_appointees: "Un Sénat de nominés"
 SIA_senate_of_appointees_desc: "Deux cent cinquante sénateurs, chacun choisi par le conseil militaire, chacun avec une voix sur qui gouverne. L'opposition peut gagner des élections. Gagner le pouvoir est une autre affaire."
 SIA_2020_protest_response: "La jeunesse dans la rue"
 SIA_2020_protest_response_desc: "Les étudiants inondent les monuments de trois revendications et d'un salut à trois doigts. Chaque option, dispersion, dialogue ou temporisation, enseigne à la génération suivante quelque chose sur l'État."
 SIA_orange_wave: "La vague orange"
 SIA_orange_wave_desc: "Une nouvelle génération politique s'organise en ligne, se finance par petites dons, et traite les vieux réseaux de clientèle comme un problème à supprimer plutôt qu'à hériter."
 SIA_digital_democracy: "Démocratie numérique"
 SIA_digital_democracy_desc: "Données ouvertes, services en ligne, un État qui répond aux courriels. La transparence comme infrastructure, et l'infrastructure, contrairement aux promesses, est dure à abroger."
 SIA_creative_economy: "L'économie créative"
 SIA_creative_economy_desc: "Cinéma, cuisine, festivals, design. Le soft power thaï devient un secteur d'export avec l'attention d'un ministère et sa propre ligne au bilan."
 SIA_truth_and_reconciliation: "Vérité et réconciliation"
 SIA_truth_and_reconciliation_desc: "Les morts de la guerre de la drogue, les répressions, les disparus du Grand Sud. Une commission avec pouvoir de citation rédige le récit officiel, parce qu'une démocratie tient ses propres archives."
 SIA_the_2005_landslide: "Le raz-de-marée des 377 sièges"
 SIA_the_2005_landslide_desc: "Thai Rak Thai remporte 377 des 500 sièges parlementaires, la plus grande majorité d'un seul parti de l'histoire thaïe. Le réseau de l'ancien establishment regarde le dépouillement en silence."
 SIA_rice_pledging_scheme: "Le programme de nantissement du riz"
 SIA_rice_pledging_scheme_desc: "Le programme rural phare du gouvernement Yingluck fait acheter par l'État le riz des paysans au-dessus du marché et stocker. Les villages y gagnent. Le Trésor dépend de la coopération du cours mondial."
 SIA_red_shirts_mobilized: "La rue derrière le bulletin"
 SIA_red_shirts_mobilized_desc: "Mettre la base rurale dans la rue. Les réseaux chemises rouges du Nord-Est défilent par centaines de milliers, mais une foule populiste remplissant la capitale n'impressionne pas les généraux. Elle alarme le palais et le haut commandement et leur tend le prétexte. La confrontation qui s'achève par des chars à Government House se rapproche. §RLe risque de putsch monte.§!"
 SIA_heartland_development: "Développer le cœur rouge"
 SIA_heartland_development_desc: "Les villages de l'Isaan et du Nord ont livré le raz-de-marée, et maintenant on les paie en politique. Routes et rails neufs traversent le plateau de Khorat et les vallées de Chiang Mai, et les bureaux provinciaux mettent l'administration, et les emplois, là où vit vraiment la base du mouvement, pas dans la capitale qui n'a jamais voté pour lui."
 SIA_crown_property_bureau: "Le Bureau des biens de la Couronne"
 SIA_crown_property_bureau_desc: "Le Bureau gère des milliards d'actifs royaux, des hôtels à l'immobilier aux grandes participations industrielles. Mettre ces rendements au service du développement national exige une négociation discrète au plus haut niveau."
 SIA_eastern_tigers: "Les Tigres de l'Est"
 SIA_eastern_tigers_desc: "La 2e région militaire et le corps blindé, les Burapha Phayak, Tigres de l'Est. Leur loyauté est le nerf de l'État royaliste, et leurs commandants sont la prochaine génération de généraux."
 SIA_buddhist_nationalism: "Nation bouddhiste"
 SIA_buddhist_nationalism_desc: "La junte embrasse les moines comme partenaires de l'ordre social. Robes safran dans les cérémonies d'État, bouddhisme au programme scolaire, et une élévation discrète de la Sangha comme autorité morale. Le Grand Sud ne le reçoit pas en silence."
 SIA_royal_succession_managed: "La transition de règne"
 SIA_royal_succession_managed_desc: "Le palais et le gouvernement préparent la transition des années à l'avance, un passage institutionnel plutôt qu'un choc. Quand le Neuvième Règne s'achève, le barami passe intact au lieu de s'effondrer à sa forme la plus faible, le deuil est comprimé, et l'establishment monarchiste se rassemble derrière le nouveau trône. Une transition gérée coûte moins que l'alternative."
 SIA_conscription_abolished: "Une armée professionnelle"
 SIA_conscription_abolished_desc: "Mettre fin au service militaire obligatoire. Une force de volontaires sera plus petite, mieux payée et mieux formée, et devra sa loyauté à la Constitution, non aux généraux qui les ont tirés au sort."
 SIA_open_skies_open_borders: "Ciel ouvert, frontières ouvertes"
 SIA_open_skies_open_borders_desc: "Libéraliser les droits de trafic, simplifier les visas, et laisser les compagnies se concurrencer. Les touristes qui viennent apportent de l'argent, les travailleurs qui viennent apportent des compétences. La frontière est le plus grand atout de la Thaïlande : cesser de la traiter comme une forteresse."
 SIA_chao_phraya_megaprojects: "Contrôle des crues du Chao Phraya et énergie verte"
 SIA_chao_phraya_megaprojects_desc: "Le fleuve qui a deux fois inondé la capitale sera dompté par des bassins de rétention, des digues, et une chaîne de turbines au fil de l'eau. Le projet est cher. La prochaine grande crue ne l'est pas."
 SIA_asean_customs_window: "Douanes à guichet unique de l’ASEAN"
 SIA_asean_customs_window_desc: "Harmoniser déclarations douanières, certificats de sécurité et règles phytosanitaires parmi les membres de l'Association. Un camion de Chiang Rai à Kuala Lumpur s'arrête à moins de guichets qu'autrefois."
 SIA_the_southern_question: "La question du Sud"
 SIA_the_southern_question_desc: "Pattani, Yala et Narathiwat couvent l'insurrection depuis une génération. Incendies de mosquées, décapitations et bombes de bord de route ont tué des milliers et durci un Sud musulman-malais contre un Bangkok bouddhiste. Le Royaume ne peut plus traiter le Grand Sud comme une note de bas de page policière. Il doit choisir comment répondre au feu du sud. La forme de cette réponse sera décidée par qui gouverne à Bangkok."
 SIA_kra_gateway: "La porte de Kra"
 SIA_kra_gateway_desc: "Le rêve centenaire revient à la table du cabinet, mais cette fois avec un bilan. Une commission de faisabilité est dressée, des géomètres partent vers l'isthme, et le premier créneau de construction partagé est dégagé à Songkhla. Rien n'est encore engagé. La prochaine décision est qui, s'il y a quelqu'un, paiera."
 SIA_kra_patron_china: "Financement des Nouvelles routes de la soie"
 SIA_kra_patron_china_desc: "L'offre de Pékin est de loin la moins chère sur la table, avec financement BRI complet, équipes d'ingénieurs chinoises, et un canal clés en main en un temps record. Les termes sont généreux maintenant et onéreux plus tard. La dette est en yuan, la garantie est le canal lui-même, et le jour peut venir où Pékin rappellera le prêt."
 SIA_kra_patron_japan: "Infrastructure de qualité japonaise"
 SIA_kra_patron_japan_desc: "La JICA et le consortium des mégabanques japonaises construisent lentement, cher, et impeccablement. Pas de piège de dette, pas de clause de bail cachée, seulement une facture initiale plus haute et un partenaire qui s'attend à être remboursé en bonne volonté autant qu'en bahts. L'estime de Tokyo pour Bangkok grimpe en conséquence."
 SIA_kra_patron_consortium: "Consortium international"
 SIA_kra_patron_consortium_desc: "Un consortium multilatéral mené par la BAD répartit le coût et le risque entre beaucoup de mains, et insiste sur le phasage pragmatique que les ingénieurs ont toujours préféré. D'abord un pont terrestre par étapes, ensuite la tranchée au niveau de la mer. Aucun créancier unique ne possède le goulet, et Washington, Tokyo et Manille respirent plus facilement."
 SIA_kra_patron_solo: "Allez-y seul"
 SIA_kra_patron_solo_desc: "Pas de créancier étranger, pas de clause étrangère, pas de drapeau étranger aux écluses. Le Royaume finance le canal sur son Trésor et son marché obligataire, et accepte le coût vertigineux comme le prix de la souveraineté absolue sur la plus récente voie d'eau stratégique du monde."
 SIA_kra_debt_trap_warning_tt: "Le financement des Nouvelles routes de la soie est bon marché maintenant, mais les dépassements de chantier ouvrent la chaîne de crise de défaut §RPékin rappelle le prêt§!."
 SIA_two_oceans_one_kingdom: "Deux océans, un royaume"
 SIA_two_oceans_one_kingdom_desc: "Le dernier batardeau a été retiré. L'eau salée de l'Andaman et du golfe de Thaïlande se mêlent pour la première fois au niveau du sommet. La Thaïlande n'occupe plus une côte. Elle en commande deux."
 SIA_kra_militarize: "Une forteresse sur deux mers"
 SIA_kra_militarize_desc: "Le canal est trop précieux pour rester sans défense. Batteries côtières, base navale durcie, et un mandat permanent de contrôle du transit font de la voie d'eau une forteresse que la marine royale thaïe peut tenir contre n'importe qui. Le monde remarque les canons, et les payeurs de péage grognent contre la militarisation."
 SIA_kra_internationalize: "Un canal pour toutes les nations"
 SIA_kra_internationalize_desc: "Déclarer Kra un régime de transit international neutre, ouvert à tous les pavillons à égalité et garanti par traité. La Thaïlande renonce au pouvoir de fermer le canal. En échange elle attire le trafic, l'investissement, et la gratitude discrète de chaque puissance maritime qui craignait un goulet dans la poigne d'une seule nation."
 SIA_gateway_of_asia: "Porte de l'Asie"
 SIA_gateway_of_asia_desc: "Les navires passaient autrefois à côté de la Thaïlande. Maintenant ils s'y arrêtent. Achever la transformation par l'investissement international, un port plus profond au sud, et, si la voie du canal a été choisie, le mandat de patrouille qui rend le goulet sûr pour quiconque paie le péage."
 SIA_ghosts_of_the_jungle: "Fantômes de la jungle"
 SIA_ghosts_of_the_jungle_desc: "Deep in the hills of Isaan and the northern highlands, the cadres of the Communist Party of Thailand never truly disappeared. They taught in village schools, organized in labor unions, remembered. Now, as the country fractures, as stability becomes a memory and the government speaks only to itself, their message finds a new generation ready to hear it.\n\nTaking the red road retires whatever political path the Kingdom was on."
 SIA_isaan_soviets: "Les Soviétiques d'Isaan"
 SIA_isaan_soviets_desc: "Le Nord-Est est le cœur, la région la plus pauvre, la plus politiquement agitée, celle que l'establishment de Bangkok a toujours traitée comme un réservoir de main-d'œuvre et de voix bon marché. Comités de village, salles syndicales et conseils coopératifs deviennent le squelette organisationnel d'un mouvement. Le parti ne demande pas la loyauté. Il demande aux gens de se gouverner, et de regarder ce qui se passe."
 SIA_general_strike: "La grève générale"
 SIA_general_strike_desc: "Si le mouvement doit être plus qu'une note de bas de page rurale, il doit arrêter les villes. Dockers, ouvriers d'usine, chauffeurs de bus, enseignants, tous appelés à la fois. Le pari est total. Si le gouvernement ne peut fonctionner assez longtemps, il capitulera ou montera. Il n'y a pas de voie médiane."
 SIA_general_strike_tt: "Calls a general strike and opens the §YRed Road§! decisions for 365 days.\n - Drive strike momentum to §Y100§! and the government capitulates, opening the peaceful road to power\n - The stoppage costs §R0.5%§! stability every week it runs\n - If the 365 days end short of 100, the generals crush the strike and seize power in a coup"
 SIA_people_seize_power: "Le peuple s'empare du pouvoir"
 SIA_people_seize_power_desc: "The old government is finished, whether it collapsed by negotiations or on a battlefield. The Communist Party of Thailand is the new governing authority. A new flag has not been decided but the administrative apparatus is now in the hands of people who spent decades in the jungle thinking about how to use it."
 SIA_land_to_the_tiller: "La terre à celui qui la laboure"
 SIA_land_to_the_tiller_desc: "Les grands domaines des Plaines centrales, les rizières de l'Isaan, les plantations d'hévéas du Sud. Le système qui les a produits est fini. La redistribution des terres, une vraie, pas un schéma gouvernemental qui s'arrête au prochain gouvernement, est à la fois la promesse du mouvement et son acte le plus dangereux. Les familles qui possédaient ces domaines ne s'en iront pas toutes sans bruit."
 SIA_five_year_plan: "Le plan quinquennal"
 SIA_five_year_plan_desc: "The market did not allocate the country's output fairly or equally. The new state will allocate deliberately. Factories, steel, chemicals, machine tools, all planned from the center, built with the labor of a mobilized nation. The trade deficit becomes a structural surplus of physical capital. The price, visible in the first year's consumer goods statistics, is isolation."
 SIA_red_chakri_dilemma: "Le dilemme Chakri"
 SIA_red_chakri_dilemma_desc: "One question the party leadership deferred as long as possible can no longer be ignored. What is the constitutional position of the monarchy in a communist Thailand? History offers two precedents to the fate of the royal institution."
 SIA_positive_trade_relations: "Relations commerciales positives"
 SIA_nuclear_proliferation_concern: "Enrichissement de l'uranium en Thaïlande"
 SIA_nuclear_proliferation_tt: "§REvery country outside our alliances takes a worried look at the new Thai nuclear enrichment program.§!"
 SIA_tt_has_reclaimed: "Nous tenons un territoire recouvré qui n'est pas encore intégré"
 SIA_tt_has_unpacified_reclaimed: "Territoire récupéré toujours en dessous de §Y90%§! conformité"
 SIA_tt_has_corable_reclaimed: "Territoire récupéré à §Y80%§! de conformité ou plus"
 SIA_bamboo_curtain: "Le rideau de bambou"
 SIA_bamboo_curtain_desc: "La révolution thaïe ne peut survivre comme expérience isolée. Le Vietnam et le Laos sont voisins, compagnons de route, et partenaires potentiels. Un cadre de solidarité régionale, bâti sur la reconnaissance mutuelle et la résistance coordonnée à la pression économique occidentale, est l'architecture d'un État révolutionnaire viable en Asie du Sud-Est."
 SIA_protracted_peoples_war: "Guerre populaire prolongée"
 SIA_protracted_peoples_war_desc: "The party of the 1970s did not win in the cities. It learned its trade in the hills, where the writ of Bangkok ran thin and a rifle counted for more than a manifesto. Build base areas in the highlands and let the countryside surround the city. Where the general strike bets on the cities giving way, this one settles the question by force of arms.\n\nThe party takes the field: the §RCommunist Party of Thailand§! rises against the government and you command the uprising. Requires §Y20%§! party support and costs §Y150§! political power."
 SIA_peoples_tribunals: "Les tribunaux du peuple"
 SIA_peoples_tribunals_desc: "Une révolution qui ne peut se défendre dure une saison. Les indicateurs, les financiers et les colonels qui attendaient de voir d'où venait le vent sont encore en place. Des cours révolutionnaires, sommaires et publiques, règlent la question de la loyauté avant qu'on puisse la poser au parti."
 SIA_broad_united_front: "Le large front uni"
 SIA_broad_united_front_desc: "Une révolution qui gouverne par la peur gouverne un pays plus petit chaque année. La voie plus dure est le consentement. Rassembler ligues paysannes, syndicats, intellectuels réformateurs, petits commerçants et moines de village sous une tente, et leur laisser sentir qu'ils ont bâti le nouvel État plutôt que d'y avoir survécu. Le pouvoir est partagé sur le papier et gardé dans les faits, mais un mouvement qui peut gouverner par accord n'a pas besoin de gouverner par le fusil."
 SIA_peoples_army: "L'armée du peuple"
 SIA_peoples_army_desc: "The plan has built the factories and now it forges the shield. A revolutionary state in a hostile region needs an army that is numerous, loyal, with conscripts trained in the party's image, and equipped from Thai arsenals rather than foreign goodwill. Every able body that can carry a rifle is a citizen-soldier, and every workshop that can turn a barrel is a link in the supply chain. The neighbors will think twice before making a move."
 SIA_socialist_education: "Chacun enseigne à un autre"
 SIA_socialist_education_desc: "Le plan a bâti les usines. Maintenant il bâtit ceux qui les feront tourner. Une campagne d'alphabétisation de masse atteint le dernier village de l'Isaan, et les écoles de cadres font des paysans des ingénieurs et des clercs des administrateurs qui répondent au mérite plutôt qu'à leur naissance. Une population lettrée et organisée est plus dure à duper et moins chère à gouverner, et la pourriture du clientélisme qui a creusé l'ancien royaume ne trouve plus où s'enraciner."
 SIA_the_beijing_road: "La voie de Pékin"
 SIA_the_beijing_road_desc: "Survival has a sponsor, and it sits in Zhongnanhai. Accept Beijing's embrace fully: the Chinese finish our industrial plans, Chinese markets replace the ones the West closed, and a great-power shadow falls over us that no neighbor can challenge. The price is written in fine print. China's voice in Thai councils grows louder than any Thai would once have allowed. A junior partner is still a partner, and a fed nation outlives a proud one."
 SIA_indochina_federation: "La Fédération indochinoise"
 SIA_indochina_federation_desc: "Ou refuser le rôle de client et revendiquer celui de chef. Laos, Vietnam et Cambodge sont trois révolutions qui ont saigné pour la même idée, aucune n'ayant l'industrie de la Thaïlande ni sa position centrale. Une fédération des trois fleuves, avec Bangkok comme partenaire aîné plutôt que junior de Pékin, fait de l'Asie du Sud-Est une chose avec laquelle les grandes puissances doivent négocier plutôt que la découper. C'est la vantardise la plus dure, et la plus fière."
 SIA_kingmaker_coalition: "La coalition faiseuse de rois"
 SIA_kingmaker_coalition_desc: "Le parti Bhumjaithai d'Anutin Charnvirakul tient l'équilibre au parlement de 2019. Former une coalition avec eux coûte des ministères et des concessions politiques, mais achète aussi une majorité de gouvernement et l'accès à la base rurale du Nord-Est du parti."
 SIA_cannabis_decriminalized: "Décriminalisation du cannabis"
 SIA_cannabis_decriminalized_desc: "La politique phare 2022 de Bhumjaithai retire le cannabis de la liste des stupéfiants. Les fermiers de Buriram et de tout l'Isaan basculent vers une nouvelle culture de rente. Les recettes du Trésor grimpent. Les voix conservatrices crient au péril moral. Les deux ont raison."
 SIA_million_rai_farms: "Un million de rai de fermes modernes"
 SIA_million_rai_farms_desc: "La plateforme de développement rural de Bhumjaithai apporte irrigation de précision, certification de l'agriculture sous contrat, et subventions de replantation d'hévéas dans le Sud. Le Nord-Est reçoit les nouvelles industries, le Sud l'expansion des plantations. Les exportations agricoles thaïes croissent."
 SIA_defence_industry_act: "Loi sur l'industrie de défense"
 SIA_defence_industry_act_desc: "A legal framework for domestic defence production with procurement preference for locally manufactured systems, a technology-transfer mandate on all foreign contracts, and a defence-industrial secretariat inside the Ministry. The first arms factory that results will be modest. The institutional foundation will not be."
 SIA_dti_expansion: "Extension DTI"
 SIA_dti_expansion_desc: "L'Institut de technologie de la défense reçoit une injection de capital et un mandat de livrer roquettes, munitions rôdeuses, et prototypes de véhicules blindés modernisés. L'installation de l'Isaan passe du bureau d'études à la chaîne, et une nouvelle ligne d'armes entre en service à côté. Les bonus de recherche suivent le matériel."
 SIA_chaiseri_and_friends: "Chaiseri et ses amis"
 SIA_chaiseri_and_friends_desc: "Le MRAP First Win de Chaiseri Metal and Rubber s'est déjà vendu en Indonésie et aux Philippines. Avec la loi sur l'industrie de défense derrière eux, un cluster de fournisseurs privés de défense, parmi lesquels Chaiseri, Thonburi Automotive et Thai Optical, s'étend. Ce qui commence en achats nationaux devient un livre d'export, et la propre chaîne de Chaiseri monte de niveau grâce aux recettes."
 SIA_arms_exporter: "L'arsenal de l'ASEAN"
 SIA_arms_exporter_desc: "La Thaïlande a bâti la base de production, le cadre légal et les relations d'export pour devenir le fournisseur d'armes de second rang préféré de la région. Pas des chars et des chasseurs, mais des MRAP, des fusées d'artillerie, des drones et des munitions. Fiable, abordable, livré à temps. Le contrat d'export répétable devient un pilier du Trésor."
 SIA_regional_defense_pact: "Pacte de défense régional"
 SIA_regional_defense_pact_desc: "Le livre d'export est devenu un instrument diplomatique. Bangkok formalise des arrangements permanents d'approvisionnement de défense avec ses partenaires de l'ASEAN, y compris des canaux d'achat garantis, des programmes de maintenance conjoints, et un cadre consultatif permanent pour la sécurité régionale. Les usines tournent plus chaud, les attachés rentrent avec des accords signés, et l'influence thaïe en Asie du Sud-Est se mesure en allocations de munitions et contrats de pièces."
 SIA_stream_of_the_navy: "Le courant de la marine"
 SIA_stream_of_the_navy_desc: "Le Corps des marines royales thaïes reçoit un investissement doctrinal dans l'assaut amphibie et la défense côtière. Une expansion de chantier dans le Sud soutient le nouvel escadron amphibie. Les marines thaïs s'entraînent aux côtés de leurs homologues indonésiens et philippins dans des exercices qui ne sont plus purement cérémoniels."
 SIA_cavalry_of_the_sky: "Cavalerie du ciel"
 SIA_cavalry_of_the_sky_desc: "The Army's aviation corps gets priority in the upcoming military budgets. New utility helicopters for airmobile infantry, attack variants to support ground operations in the hills, and an air-assault doctrine that acknowledges Thailand's terrain is more jungle than steppe."
 SIA_cyber_command: "Cyber-commandement"
 SIA_cyber_command_desc: "A dedicated cyber operations command modelled on the US CYBERCOM and the Israeli Unit 8200 frameworks. Network defence, signals intelligence, and, in a quiet annex of the funding proposal, offensive capability development. If ISOC's surveillance infrastructure already exists, the command inherits it and extends its reach into the digital dimension."
 SIA_us_coin_legacy: "Héritage COIN américain"
 SIA_us_coin_legacy_desc: "L'armée thaïe a absorbé de dures leçons de la doctrine américaine de contre-insurrection dans les décennies suivant la guerre du Vietnam, avec programmes de défense villageoise, PSYOP, et fusion du renseignement avec l'ISOC. Ce cadre façonne encore la façon dont la Thaïlande combat ses ennemis intérieurs. Le systématiser produit des résultats."
 SIA_development_is_security: "Le développement, c'est la sécurité"
 SIA_development_is_security_desc: "Routes, écoles et cliniques dans le nord et le nord-est agités sont la contre-insurrection la moins chère qui soit. L'infrastructure qui atteint un village avant l'agitateur tend à y rester. De nouveaux terminaux ferroviaires en Isaan et au Nord accélèrent chaque projet qui suit."
 SIA_post_cold_war_professionalization: "Professionnalisation de l'après-guerre froide"
 SIA_post_cold_war_professionalization_desc: "La guerre froide a façonné le corps des officiers thaïs vers les opérations anticommunistes, la loyauté à l'ordre intérieur, et la déférence au palais. Une nouvelle génération d'officiers, formée dans des exercices conjoints avec des partenaires occidentaux et instruite en droit international, redéfinit à quoi servent les forces armées royales thaïes."
 SIA_multi_domain_operations: "Opérations multi-domaines"
 SIA_multi_domain_operations_desc: "Le champ de bataille n'est plus une ligne sur une carte. Cyber, guerre électronique, imagerie spatiale et frappes de drones de précision se fondent dans la manœuvre conventionnelle. Le concept MDO thaï, développé conjointement avec des partenaires américains et australiens, reconnaît que la prochaine guerre se mènera dans tous les domaines à la fois."
 SIA_mdo_integration_strain: "Souche d'intégration"
 SIA_mdo_integration_strain_desc: "Dresser des structures de commandement interdomaines, du cyber à l'imagerie spatiale, coûte de l'argent bien avant que la doctrine ne commence à se payer."
 SIA_ministry_of_defence: "Ministère de la Défense"
 SIA_ministry_of_defence_desc: "La défense du Royaume a toujours été menée par les armes elles-mêmes, chacune gardant son budget, sa doctrine, son pré carré. Nous lui donnons enfin une colonne vertébrale institutionnelle : un ministère qui siège au-dessus de l'armée, de la marine et de l'armée de l'air et lie défense territoriale, politique de sécurité nationale et renseignement en un seul appareil responsable devant l'État."
 SIA_comprehensive_security: "Sécurité globale"
 SIA_comprehensive_security_desc: "Intérieur, défense et renseignement ont surveillé les mêmes frontières pendant des décennies avec trois jeux de dossiers et nulle habitude de les partager. Une doctrine les lie, et ouvre trois lignes d'effort à la fois : l'économie, le front intérieur, et les forces armées."
 SIA_protector_of_the_realm_focus: "Protecteur du royaume"
 SIA_protector_of_the_realm_focus_desc: "Le monument de la Victoire consacré, terres shan, lao, khmère et malaise sont sous le drapeau thaï. Les gagner et les gouverner sont des tâches différentes. Une administration pour la frontière recouvrée s'élève derrière les garnisons, et le travail de pacification, de développement et, avec le temps, de coring commence."
 SIA_atoms_for_peace: "Des atomes pour la paix"
 SIA_atoms_for_peace_desc: "La Thaïlande signe les protocoles d'usage pacifique de l'AIEA et entame la longue piste institutionnelle. Une autorité de sûreté nucléaire, des accords sur le combustible usé, et le premier réacteur de recherche national. Le programme civil repose sur la conviction que la puissance de base de l'uranium est moins chère, plus propre et plus souveraine que le pétrole importé à prix géopolitique."
 SIA_smr_initiative: "Initiative SMR"
 SIA_smr_initiative_desc: "Les petits réacteurs modulaires sont la technologie qui rend le nucléaire viable pour un pays qui ne peut se payer le capital d'une centrale pleine taille. L'initiative finance des études de faisabilité, des évaluations de sites sur le Seaboard oriental, et un accord de transfert de technologie avec un consortium sud-coréen ou français. La première coulée de béton est dans dix ans. La décision est aujourd'hui."
 SIA_nuclear_power_program: "Programme électronucléaire"
 SIA_nuclear_power_program_desc: "Le couronnement est un programme national d'énergie nucléaire avec une date de mise en service engagée, un cadre souverain du cycle du combustible, et le premier réacteur sur le réseau. La Thaïlande devient le premier État d'Asie du Sud-Est à mettre un réacteur civil sur le réseau, rejoignant le Japon, la Corée du Sud, la Chine, l'Inde, le Pakistan et Taïwan parmi les opérateurs nucléaires de la région. L'indépendance énergétique n'est plus théorique."
 SIA_bangkok_phnom_penh_axis: "Axe Bangkok-Phnom Penh"
 SIA_bangkok_phnom_penh_axis_desc: "La géographie du Cambodge en fait le corridor économique naturel de la Thaïlande vers la mer, et sa trajectoire politique en fait le contrepoids diplomatique naturel de Bangkok face au Vietnam. Ce focus bâtit la relation par missions commerciales, liaisons routières, et un cadre de sécurité partagé qui tient Phnom Penh près de Bangkok et plus loin de l'orbite de Pékin."
 SIA_jakarta_dialogue: "Dialogue de Jakarta"
 SIA_jakarta_dialogue_desc: "L'Indonésie est le géant démographique de l'Asie du Sud-Est et la relation bilatérale la plus importante de la Thaïlande après Kuala Lumpur. Le Dialogue de Jakarta est la plateforme, réunissant ministres bilatéraux, exercices militaires conjoints, et une conversation franche sur qui mènera la prochaine décennie de l'ASEAN. L'issue dépend de si Bangkok voit Jakarta comme partenaire ou rival."
 SIA_asean_crossroads: "Carrefour de l’ASEAN"
 SIA_asean_crossroads_desc: "Deux chemins s'offrent au Royaume. Le premier est le partenariat, un ordre mené par la Thaïlande qui lie l'ASEAN par consentement. Le second est la domination, l'Asie du Sud-Est amenée sous contrôle thaï par l'épée."
 SIA_the_2001_election_choice_tt: "Soutenez une force dans la campagne de 2001. L'élection décide qui gouverne, et seule la voie du vainqueur s'ouvre.\n - £SIA_neutral_Social §YThai Rak Thai§!\n - £SIA_Nat_Autocracy §YLe réseau du palais et ses généraux§!\n - £SIA_western_conservative §YLes démocrates sortants§!"
 SIA_the_2006_coup_choice_tt: "The September coup replaces the ruling party with the §Y[Nat_Autocracy_L]§!. No civil war follows; the army simply takes the government."
 SIA_a_new_republic_choice_tt: "Choisissez le sort de la monarchie.\n - §YAbolir§! : affronter les troubles\n - §YReculer§! : garder la couronne pour la stabilité et le pouvoir politique"
 SIA_the_southern_question_choice_tt: "Only one of the three southern doctrines can be followed. Taking one closes the other two permanently."
 SIA_red_chakri_dilemma_choice_tt: "Choisissez la réponse de la révolution au trône.\n - §YAbolir la monarchie§! : affronter une insurrection royaliste\n - §YGarder un chef d'État constitutionnel§! : suivre le modèle lao et absorber la colère des durs"
 SIA_lost_territories_choice_tt: "Choisissez à quel point la revendication est pressée ouvertement.\n - §YIrrédentisme ouvert§! : soutien à la guerre au prix du standing\n - §YRévisionnisme discret et niable§! : protège la stabilité"
 SIA_nuclear_power_program_choice_tt: "Choisissez l'orientation du cycle du combustible.\n - §YDéfier les inspecteurs§! : enrichissement à latence d'arme sous sanctions\n - §YAccepter les garanties de l'AIEA§! : réparer les relations avec Washington"
 SIA_prayuth_premiership_choice_tt: "Choisissez comment le général prévoit sa succession.\n - §YUne transition gérée§! : enraciner l'establishment\n - §YInstitutionnaliser le règlement§! : reculer vers un visage civil"
 SIA_2020_protest_response_choice_tt: "Choisissez une réponse aux protestations.\n - §YRéprimer§! : coûte de la stabilité et élève le risque de putsch\n - §YConcéder la réforme§! : calme, et un coup de pouce au mouvement réformateur\n - §YLes attendre§!"
 SIA_found_the_pact: "Fonder l'Organisation du traité de l'Asie du Sud-Est"
 SIA_found_the_pact_desc: "Thailand revives the name its founders abandoned in 1977 and gives it a regional owner: the Southeast Asia Treaty Organization, a mutual-defence pact with Bangkok at its center and the neighbors as its members. Thailand assumes the role of founding leader. The flag is raised. The pact is real."
 SIA_invite_mainland: "Inviter des partenaires continentaux"
 SIA_invite_mainland_desc: "Vietnam, Laos, Cambodge et Myanmar partagent tous des frontières avec la Thaïlande et font face à des menaces communes. Bangkok étend des invitations formelles aux États continentaux, arguant que la sécurité de l'intérieur continental dépend d'une cause commune, non de couvertures concurrentes."
 SIA_invite_mainland_tt: "Invite nos voisins continentaux à rejoindre l'OTASE.\n - Chacun décide pour lui-même d'accepter\n - Un membre qui accepte gagne un esprit le tenant engagé dans le pacte"
 SIA_invite_maritime: "Inviter des partenaires maritimes"
 SIA_invite_maritime_desc: "L'Indonésie, les Philippines, la Malaisie, Singapour et Brunei contrôlent les mers dont dépend le commerce thaï. Les partenaires maritimes sont invités à rejoindre le pacte, liant l'archipel et la péninsule en une seule communauté stratégique."
 SIA_invite_maritime_tt: "Invite les États maritimes d'Asie du Sud-Est à rejoindre l'OTASE.\n - Chacun décide pour lui-même d'accepter\n - Un membre qui accepte gagne un esprit le tenant engagé dans le pacte"
 SIA_invite_breakaways: "Inviter les États-frontière"
 SIA_invite_breakaways_desc: "Le Shan du Sud, les Karen et les Wa tiennent le terrain entre la Thaïlande et le cœur birman, et aucun ne peut survivre seul. Bangkok leur offre ce que Naypyidaw n'offrira jamais : un siège à une table, une signature de traité, et le standing d'un État plutôt que d'une insurrection."
 SIA_invite_breakaways_tt: "Invite les États sécessionnistes birmans à rejoindre l'OTASE, là où ils existent.\n - Chacun décide pour lui-même d'accepter\n - Un membre qui accepte gagne un esprit le tenant engagé dans le pacte"
 SIA_seato_invite_line_tt: " - §Y[THIS.GetNameDefCap]§! est invité à rejoindre l'OTASE"
 SIA_seato_accession_category: "Adhésion à l’OTASE"
 SIA_seato_accession_category_desc: "La première Organisation du traité de l'Asie du Sud-Est fut signée à Manille en 1954 et dirigée depuis Bangkok, mais seuls deux de ses huit membres étaient d'Asie du Sud-Est et elle se dissolut en 1977 sans jamais avoir été invoquée. Celle-ci est le pacte régional que la première n'a jamais été : la Thaïlande à la présidence, les voisins comme membres, et une garantie qui va à la défense de l'Asie du Sud-Est plutôt qu'à la stratégie d'endiguement de quiconque d'autre. Les sièges doivent se remplir un à un.\n\nConsultez la réceptivité de chaque pays avant de l'inviter à la faction."
 SIA_renew_seato_invitation: "Renouveler l'invitation"
 SIA_renew_seato_invitation_desc: "Renvoyer la délégation auprès [FROM.GetNameDefCap] avec le texte du traité et une offre fraîche. Un refus n'est pas définitif, et les termes n'ont pas changé."
 SIA_seato_charm_offensive_major: "Tribunal [FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_major_desc: "Visites d'État, une ligne de crédit, des bourses pour leurs officiers et un pavillon thaï à leur foire. Le ministère des Affaires étrangères ne travaille à rien d'autre pendant trois mois. Rien de cela n'est un traité. Tout cela rend le traité plus facile à signer la prochaine fois que nous demanderons."
 SIA_seato_charm_offensive_minor: "Tribunal [FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_minor_desc: "Visites d'État, une ligne de crédit, des bourses pour leurs officiers et un pavillon thaï à leur foire. Le ministère des Affaires étrangères ne travaille à rien d'autre pendant trois mois. Rien de cela n'est un traité. Tout cela rend le traité plus facile à signer la prochaine fois que nous demanderons."
 SIA_courting_mission: "Courtiser les voisins"
 SIA_courting_mission_desc: "Le personnel diplomatique senior, le calendrier ministériel et l'essentiel du budget discrétionnaire sont engagés dans une capitale jusqu'à la fin de la mission. Tout le reste du gouvernement attend son tour."
 SIA_seato_rec_opinion_yes: "§GL'opinion de la Thaïlande est supérieure à 40§! (+25)"
 SIA_seato_rec_opinion_no: "§RL'opinion de la Thaïlande est de 40 ou moins§! (+25)"
 SIA_seato_rec_faction_yes: "§GPas dans une autre faction§! (+20)"
 SIA_seato_rec_faction_no: "§RDéjà dans une autre faction§! (+20)"
 SIA_seato_rec_influence_yes: "§GLa Thaïlande est parmi les trois plus grandes sources d'influence, détenant 20 pour cent ou plus§! (+20)"
 SIA_seato_rec_influence_no: "§RLa Thaïlande n'est pas parmi les trois plus grandes sources d'influence, à 20 pour cent ou plus§! (+20)"
 SIA_seato_rec_threat_yes: "§GEn guerre ou ils bordent un pays en guerre§! (+15)"
 SIA_seato_rec_threat_no: "§RNi eux ni aucun pays qu'ils bordent n'est en guerre§! (+15)"
 SIA_seato_rec_trade_yes: "§GDétiennent un accord commercial avec la Thaïlande§! (+10)"
 SIA_seato_rec_trade_no: "§RPas d'accord commercial avec la Thaïlande§! (+10)"
 SIA_seato_rec_momentum_yes: "§GL'OTASE a déjà trois membres ou plus§! (+10)"
 SIA_seato_rec_momentum_no: "§RL'OTASE a moins de trois membres§! (+10)"
 SIA_seato_rec_total: "§YRéceptivité à l'OTASE§! : §Y[?SIA_seato_temp|0]§!/100. Ils acceptent une invitation à §Y60§!."
 SIA_joint_command: "Commandement conjoint de l'ASEAN"
 SIA_joint_command_desc: "Une structure de commandement conjoint permanente est établie à Bangkok, intégrant doctrine, logistique et renseignement de chaque État membre. Les officiers thaïs tiennent les sièges seniors, mais l'état-major est réellement multilatéral. Les exercices deviennent interopérables. Les plans deviennent réels."
 SIA_asean_rapid_reaction: "Force de réaction rapide de l’ASEAN"
 SIA_asean_rapid_reaction_desc: "Le pacte fait son pas suivant, une brigade de réaction rapide permanente, tirée de tous les États membres, capable de se déployer en 72 heures en tout point d'Asie du Sud-Est. C'est l'épée du pacte, petite, rapide, et indéniablement réelle."
 SIA_arsenal_integration: "Intégration de l’arsenal de l’ASEAN"
 SIA_arsenal_integration_desc: "L'industrie de défense thaïe, déjà l'atelier de l'Asie du Sud-Est, standardise armes et munitions dans toutes les forces armées des États membres. Fusils, véhicules et obus thaïs remplacent le patchwork de matériel soviétique, chinois et occidental. Les armées du pacte partagent désormais les mêmes balles."
 SIA_pax_aseana: "Pax Aseana"
 SIA_pax_aseana_desc: "Le travail est fait et le pacte tient. La Thaïlande a bâti ce qu'aucune puissance extérieure n'a pu, une vraie architecture de sécurité enracinée dans la région et assez forte pour dissuader tout challenger. Les voisins ont signé parce qu'ils le voulaient et c'est pourquoi cela durera."
 SIA_war_economy_push: "Poussée vers l’économie de guerre"
 SIA_war_economy_push_desc: "La nation est sur le pied de guerre. Les usines de biens de consommation sont reconverties pour obus et canons de fusil. Le plafond des dépenses militaires est levé, les contrats d'achat sont signés sans les délais habituels, et trois nouvelles usines d'armes s'élèvent sur des lots hâtivement dégagés dans la région métropolitaine de Bangkok."
 SIA_friends_abroad: "Amis à l'étranger"
 SIA_friends_abroad_desc: "Les forces armées thaïes ont passé des décennies à s'entraîner aux côtés de partenaires étrangers. Les liens bilatéraux forgés dans les exercices conjoints, les échanges d'officiers et les transferts d'armes sont un pilier discret de la sécurité thaïe, moins visible que les alliances, mais plus durable que la plupart. Il est temps de formaliser ce qui marche déjà."
 SIA_cobra_gold_focus: "Cobra Or"
 SIA_cobra_gold_focus_desc: "Cobra Gold est le plus grand exercice militaire conjoint annuel d'Asie, co-organisé par la Thaïlande et les États-Unis. Approfondir le programme d'exercices apporte doctrine américaine, formation logistique et familiarité du matériel à l'armée royale thaïe, et ciment Bangkok comme partenaire d'ancrage de Washington en Asie du Sud-Est continentale."
 SIA_partner_japan: "Liens de défense avec le Japon"
 SIA_partner_japan_desc: "Les réformes japonaises de l'export d'équipement de défense ont ouvert de nouveaux canaux d'achat thaïs. Tokyo offre un savoir-faire de fabrication de précision, de l'électronique duale, et un financement d'infrastructure qui complète les capacités thaïes sans les ficelles politiques des paquets chinois ou américains."
 SIA_partner_korea: "Partenariat de défense sud-coréen"
 SIA_partner_korea_desc: "La République de Corée a bâti une industrie d'armes compétitive en une génération. Chars K-2, jets FA-50 et obusiers K9 se vendent à prix compétitifs aux partenaires d'Asie du Sud-Est. La Thaïlande rejoint la file, et ramène formation aérienne et méthodologie industrielle au standard coréen."
 SIA_partner_australia: "Voisin à cinq yeux"
 SIA_partner_australia_desc: "L'Australie est le partenaire anglophone le plus proche de la Thaïlande et un allié non-OTAN des États-Unis comme elle. Les exercices conjoints en mer d'Andaman et dans le golfe de Thaïlande ont approfondi les liens marine à marine. Élargir le partenariat livre l'interopérabilité terrestre et la coopération de surveillance maritime qu'aucun des deux pays ne pourrait s'offrir seul."
 SIA_partner_taiwan: "Coopération de défense discrète"
 SIA_partner_taiwan_desc: "L'industrie de défense taïwanaise est discrète, techniquement sophistiquée, et politiquement motivée à trouver des amis. Bangkok ne reconnaît pas Taipei, mais l'armée royale thaïe et l'armée de la ROC ont longtemps tenu des canaux informels d'équipement et de formation. Formaliser cette coopération, en silence, est un risque calculé. Pékin le remarquera."
 SIA_hedging_partners: "Des amis en Extrême-Orient"
 SIA_hedging_partners_desc: "Tokyo, Séoul et Pékin offrent chacun à Bangkok ce que Washington ne peut : un capital patient, de la technologie duale, un vaste marché voisin. Aucun n'exige l'exclusivité. La Thaïlande courtise les trois et tient son prix, refusant d'être l'ancre de quiconque ni le client de quiconque. Un Royaume déjà engagé dans la couverture double ces liens."
 SIA_national_grid: "Alimenter le Royaume"
 SIA_national_grid_desc: "L'industrialisation rapide de la Thaïlande a dépassé son réseau électrique. Le Seaboard oriental bourdonne d'usines mais le réseau vieillit, les pertes de transport sont embarrassantes, et la prochaine décennie de croissance exige une fondation capable de porter la charge. Le gouvernement s'engage dans une modernisation nationale des infrastructures, avec de nouveaux postes, des lignes de transport modernisées, et de nouvelles usines dans les régions que le réseau peut enfin alimenter."
 SIA_renewable_push: "Poussée vers les énergies renouvelables"
 SIA_renewable_push_desc: "Vent du golfe, solaire des Plaines centrales, petite hydro au Nord. La géographie thaïe est un atout d'énergie renouvelable chroniquement sous-exploité. Ce programme met en service des installations renouvelables à grande échelle dans chaque région du Royaume, et relie leur production directement au réseau national."
 SIA_green_grid: "Le réseau vert"
 SIA_green_grid_desc: "La capacité renouvelable est une chose, un réseau qui peut l'utiliser en est une autre. Stockage, dispatch intelligent et transport modernisé tissent fermes solaires et crêtes éoliennes du Royaume en une offre fiable, et chaque nouveau panneau ou turbine s'élève plus vite sur l'épine renforcée. L'indépendance énergétique du Royaume commence ici."
 SIA_fossil_fuels_deal: "Partenariat énergétique du Golfe"
 SIA_fossil_fuels_deal_desc: "Les raffineries du Royaume tournent au brut du Golfe et ses centrales brûlent du gaz importé. Plutôt que de combattre la dépendance, Bangkok la formalise. Des accords d'approvisionnement à long terme avec l'Arabie saoudite, le Qatar et les Émirats livrent une certitude de prix, un modeste dividende d'efficacité via des rétrofit de centrales, et la chaleur diplomatique qui vient avec un chèque."
 SIA_gulf_energy_ties: "Réserves stratégiques de carburant"
 SIA_gulf_energy_ties_desc: "Un tanker qui ne part jamais est une centrale qui ne démarre jamais. Deux dépôts stratégiques de carburant s'élèvent dans le corridor industriel du sud et sur le Seaboard oriental. Les partenaires du Golfe financent la moitié de la construction, et les ingénieurs thaïs bâtissent le reste."
 SIA_iron_fist_doctrine: "Doctrine du poing de fer"
 SIA_iron_fist_doctrine_desc: "Plus de discours sur le grief. Les trois provinces sont inondées de troupes, de checkpoints et de pouvoirs d'urgence. L'insurrection est un problème de sécurité et on y répondra comme tel, vite, dur, et sans excuses. Le monde s'indignera. Le Sud sera calme."
 SIA_martial_law_south: "Loi martiale dans le Sud"
 SIA_martial_law_south_desc: "Un décret d'urgence place Pattani, Yala et Narathiwat sous administration militaire. Couvre-feux, perquisitions sans mandat et détention sans inculpation deviennent la texture quotidienne de la vie dans le Sud. L'armée peut désormais agir sur le renseignement dès qu'il arrive, et la population apprend le prix d'abriter les hommes aux armes."
 SIA_search_and_destroy: "Rechercher et détruire"
 SIA_search_and_destroy_desc: "Forces spéciales et aviation mènent des ratissages cinétiques du réseau de cellules suspecté. Les opérations sont décisives et le bilan est élevé. Chaque raid qui touche sa cible brise un peu plus l'insurrection, et chaque raid qui touche un mariage à la place leur offre une génération de recrues."
 SIA_pacification_complete: "Pacification terminée"
 SIA_pacification_complete_desc: "Les bombes de bord de route se sont tues et les checkpoints sont descendus. Les mosquées sont surveillées, les écoles contrôlées, et le grief sous le silence n'est pas mort. Les armes se taisent mais les braises restent."
 SIA_royal_development_projects: "Projets royaux de développement"
 SIA_royal_development_projects_desc: "Sous l'initiative du roi, le modèle de développement de la couronne est porté au sud, avec irrigation, agriculture, routes et coopératives royales. Le message est que la monarchie, non l'insurrection, livre pour le sud musulman-malais. Clientèle et présence, pas seulement des patrouilles."
 SIA_isoc_southern_command: "Commandement Sud de l'ISOC"
 SIA_isoc_southern_command_desc: "Le Commandement des opérations de sécurité intérieure assume l'autorité unifiée sur le théâtre du sud, avec coordination civilo-militaire, fusion du renseignement, et l'appareil de soft power sous un même toit. Si le réseau ISOC est déjà mature, le commandement du sud peut passer de la réaction à l'anticipation."
 SIA_winning_hearts_royally: "Gagner les cœurs, royalement"
 SIA_winning_hearts_royally_desc: "Bourses, rénovations de mosquées, zones de développement certifiées halal, et une élévation délibérée des notables musulmans-malais locaux dans le système de clientèle. L'État arrive non comme occupant mais comme bienfaiteur, et lentement, par endroits, le calcul des jeunes hommes bascule."
 SIA_southern_calm: "Un calme méridional"
 SIA_southern_calm_desc: "La violence s'est reculée en un calme géré et surveillé. Ni traité ni autonomie, pourtant les provinces fonctionnent et l'égide royale tient. Un calme tenu par la présence et la clientèle."
 SIA_peace_dialogue_initiative: "Initiative de dialogue pour la paix"
 SIA_peace_dialogue_initiative_desc: "Bangkok ouvre formellement la piste de Kuala Lumpur, avec la Malaisie comme facilitateur. Pour la première fois l'État s'assoit en face des hommes qu'il a chassés, et concède que l'avenir du Sud est affaire de négociation, pas seulement de force. Cela coûte du capital politique à domicile, mais ouvre une route que les balles n'ont jamais pu."
 SIA_mara_patani_talks: "MARA Patani pourparlers"
 SIA_mara_patani_talks_desc: "Des négociations formelles avec le groupe-parapluie MARA Patani commencent pour de bon. Mesures de confiance, zones de sécurité, et un vrai cadre de cessez-le-feu sont sur la table. Kuala Lumpur s'implique, et le leadership insurgé, fracturé mais réel, commence à croire qu'un règlement est possible."
 SIA_autonomy_framework: "Cadre d'autonomie spéciale"
 SIA_autonomy_framework_desc: "Les négociateurs rédigent une loi d'administration spéciale pour les trois provinces, avec un conseil régional élu, une éducation en langue locale, des tribunaux religieux, et une part des recettes de développement retenue dans le Sud. C'est la concession la plus loin-allée de l'histoire du Royaume, et l'establishment de Bangkok se mobilise déjà contre elle."
 SIA_pattani_peace_accord: "L'accord de paix de Pattani"
 SIA_pattani_peace_accord_desc: "Un accord signé met fin à la plus longue insurrection de l'histoire moderne du Royaume. Le Sud gagne une mesure d'autonomie au sein d'une Thaïlande unitaire, les armes sont rendues, et les déplacés rentrent. C'est imparfait, contesté, et historique. Le conflit est fini."
 SIA_ds_tier_to_1: "§GLe Sud profond retombe à un faible bouillonnement (palier 1, -2 % de stabilité).§!"
 SIA_ds_tier_to_2: "§YLa violence grimpe à Pattani (palier 2, -4 % de stabilité, -5 % de pouvoir politique).§!"
 SIA_ds_tier_to_3: "§RLe Sud est en flammes (palier 3, -7 % de stabilité, -10 % de pouvoir politique, -5 % de soutien de guerre).§!"
 SIA_ds_intensity_down: "§GInsurgent intensity [?ds_delta|0+]§!"
 SIA_ds_intensity_up: "§RInsurgent intensity [?ds_delta|0+]§!"
 SIA_ds_grievance_up: "§RCommunity grievance [?ds_grievance_delta|0+]§!, raising the intensity floor."
 SIA_ds_grievance_down: "§GCommunity grievance [?ds_grievance_delta|0+]§!, lowering the intensity floor."
 SIA_pacification_complete_tt: "Ends the Deep South insurgency as a §Yforced§! resolution. The insurgency meters and decisions close permanently."
 SIA_isoc_southern_command_tt: "A further §G-4§! insurgent intensity if the §YISOC Network§! is already in place."
 SIA_southern_calm_tt: "Ends the Deep South insurgency as a §Yforced§! resolution. The insurgency meters and decisions close permanently."
 SIA_pattani_peace_accord_tt: "Ends the Deep South insurgency as a §Ynegotiated§! settlement. The insurgency meters and decisions close permanently."
 SIA_anti_narcotics_bureau: "Bureau anti-narcotiques"
 SIA_anti_narcotics_bureau_desc: "L'Office thaï de contrôle des stupéfiants est élargi et armé de dents, avec un budget dédié, des pouvoirs d'enquête protégés, et un mandat formel de poursuivre les réseaux de trafic plutôt que les dealers de rue. Le bureau vise la chaîne d'approvisionnement, des laboratoires de l'État Shan aux hubs de distribution de Bangkok."
 SIA_golden_triangle_interdiction: "Interdiction du Triangle d’Or"
 SIA_golden_triangle_interdiction_desc: "La région tripartite où se rencontrent Thaïlande, Myanmar et Laos est la source de l'essentiel de l'héroïne et de la méthamphétamine qui inondent les villes thaïes et transite vers les marchés mondiaux. Les unités de patrouille frontalière sont renforcées, la surveillance aérienne étendue, et une force opérationnelle conjointe avec des milices shan se dresse pour intercepter les cargaisons avant qu'elles ne franchissent le Mékong. Les barons s'adapteront, comme toujours, mais cela élève le coût."
 SIA_anti_graft_push: "Poussée anti-greffe"
 SIA_anti_graft_push_desc: "La Commission nationale anticorruption reçoit des dents, avec un mandat d'enquête élargi, un budget sanctuarisé, et une protection légale des lanceurs d'alerte. Les abus de marchés dans la défense, le BTP et les douanes, les trois vecteurs les plus lucratifs de la concussion, sont visés d'abord. Un marché propre est plus lent à bâtir que l'ancien arrangement à s'enraciner. Le faire passer dépense du capital politique et dérange un public habitué à l'ancienne manière."
 SIA_transparency_watchdog: "Observateur de la transparence"
 SIA_transparency_watchdog_desc: "Un Office indépendant de transparence budgétaire est dressé, rendant compte directement au parlement plutôt qu'au ministère des Finances. Divulgation obligatoire du patrimoine des hauts fonctionnaires, reporting public des marchés en temps réel, et un portail d'audit citoyen ferment les brèches qui ont permis l'extraction de rente systématique. La corruption ne disparaît pas, mais elle devient mesurablement plus chère à soutenir, et pendant six mois les réseaux qu'elle expose ripostent par la procédure et le délai."
 SIA_watchdog_backlash: "La machine riposte"
 SIA_watchdog_backlash_desc: "Les réseaux exposés par le nouveau régime de transparence n'ont pas disparu. Pendant six mois ils combattent les réformes par la procédure, le délai et l'obstruction discrète, saignant le pouvoir politique et, dans les provinces les plus enchevêtrées, la confiance publique."
 SIA_decentralize_governance: "Donner du pouvoir aux provinces"
 SIA_decentralize_governance_desc: "Après la poussée anticorruption, l'autorité de gouvernance et l'allocation budgétaire sont redistribuées de Bangkok vers les provinces. Les organisations administratives provinciales gagnent des mandats élargis, des gouverneurs élus contrôlent les dépenses d'infrastructure locale, et Chiang Mai, Khon Kaen et Songkhla émergent comme de vrais pôles secondaires d'activité économique. La croissance se concentre plus lentement mais le chemin plus calme et plus régulier tient le pays stable."
 SIA_bangkok_primacy: "Bangkok d'abord"
 SIA_bangkok_primacy_desc: "Les dividendes de l'anticorruption sont réinvestis dans la capitale. Les districts industriels de Bangkok sont modernisés, ses institutions de recherche concentrées, et son transit public étendu. L'efficacité et la production de recherche grimpent nettement, mais les critiques notent que la prospérité s'accumule dans une ville de dix millions tandis que les provinces attendent, et le ressentiment qu'elle engendre pèse vraiment sur l'humeur du pays."
 SIA_asean_hegemony: "Hégémonie de l’ASEAN"
 SIA_asean_hegemony_desc: "Le projet de Grande Thaïlande est achevé sur le continent. Maintenant le Royaume tourne le regard vers le reste de l'Asie du Sud-Est. L'ASEAN a toujours été un projet thaï d'esprit. Qu'il le devienne de fait, par l'épée s'il le faut. L'état-major rédige des contingences pour la soumission de l'archipel et de la cité-État."
 SIA_maritime_claims: "La frontière maritime"
 SIA_maritime_claims_desc: "Au-delà de l'isthme se tiennent les grands États archipélagiques, Manille, Jakarta, et le sultanat pétrolier de Brunei. Une poussée hauturière exigera tout le poids de la marine royale thaïe et du Corps des marines. L'amirauté commence à planifier des opérations amphibies à travers la mer de Chine méridionale et les approches de Java."
 SIA_maritime_claims_threat: "Montée navale thaïe dans l'archipel"
 SIA_claim_philippines: "Soumettre les Philippines"
 SIA_claim_philippines_desc: "L'archipel philippin commande les approches orientales de la mer de Chine méridionale. Amener Manille sous le writ de Bangkok sécurise le flanc maritime et le labeur de cent millions de Philippins pour le nouvel ordre. Nous pressons notre revendication sur chaque île de la République."
 SIA_claim_indonesia: "Soumettre l’Indonésie"
 SIA_claim_indonesia_desc: "L'Indonésie est le géant du sud, étendu, peuplé, et riche en ressources. Pour maîtriser l'ASEAN, Bangkok doit maîtriser Jakarta. La campagne sera longue et les îles nombreuses, mais le prix est la plus grande économie et population d'Asie du Sud-Est."
 SIA_claim_brunei: "S'emparer de Brunei"
 SIA_claim_brunei_desc: "Le minuscule Brunei siège au-dessus de certaines des plus riches réserves d'hydrocarbures de la région. La richesse du sultanat et sa position stratégique à Bornéo en font un prix irrésistible. Nous agissons pour replier le sultanat dans le Royaume."
 SIA_mainland_claims: "Le règlement continental"
 SIA_mainland_claims_desc: "Deux puissances du continent n'ont pas encore plié le genou. Le Vietnam, le vieux rival par-delà la chaîne annamite, et Singapour, la riche cité-État gardienne du détroit de Malacca. Toutes deux doivent être mises au pas pour achever la primauté thaïe en Asie du Sud-Est."
 SIA_mainland_claims_threat: "Mobilisation thaïe contre les irréductibles du continent"
 SIA_claim_vietnam: "Soumettre le Vietnam"
 SIA_claim_vietnam_desc: "Le Vietnam a longtemps contesté l'Asie du Sud-Est continentale à la Thaïlande, des cours de l'ancien Siam aux champs de tuerie du XXe siècle. Maintenant la rivalité historique sera tranchée. Nous pressons notre revendication du Mékong à la côte annamite."
 SIA_claim_singapore: "S'emparer de Singapour"
 SIA_claim_singapore_desc: "Singapour est le joyau du détroit, une puissance financière et le gardien de la voie maritime la plus fréquentée du monde. Qui tient la Cité du Lion tient la gorge du commerce asiatique. Nous agissons pour la rendre thaïe."
 SIA_asean_protector: "Protecteur de l'ANASE"
 SIA_asean_protector_tt: "La voie du partenariat est ouverte à tout gouvernement, le §Ymandat de Grande Thaïlande§! compris."
 SIA_asean_protector_desc: "La Grande Thaïlande n'a pas à être un empire de conquête. Ayant sécurisé le continent, le Royaume peut au contraire devenir le garant de la sécurité de l'Asie du Sud-Est, un hégémon bienveillant qui protège ses voisins plutôt que de les annexer. Bangkok étend sa protection à travers la région, liant l'ASEAN à la couronne thaïe par l'alliance plutôt que par l'occupation."
 SIA_guarantee_maritime: "Bouclier de l'archipel"
 SIA_guarantee_maritime_desc: "La Thaïlande étend des garanties de sécurité formelles aux États maritimes, Philippines, Indonésie et Brunei. La marine royale thaïe se portera caution de leur indépendance, et en retour Bangkok devient la puissance indispensable des mers du sud."
 SIA_guarantee_mainland: "Gardien du continent"
 SIA_guarantee_mainland_desc: "Bangkok garantit la sécurité du Vietnam, de Singapour et de la Malaisie, achevant des siècles de rivalité par un règlement mené par la Thaïlande. Le vieil ennemi, la riche cité-État, et le voisin péninsulaire se mettent à l'abri sous la protection du Royaume, et le continent est en paix aux termes thaïs."
 SIA_guarantee_indochina: "Parapluie sur l’Indochine"
 SIA_guarantee_indochina_desc: "Les plus pauvres et les plus exposés des voisins de la Thaïlande sont ceux qu'un hégémon saute d'habitude. Bangkok les garantit quand même : Laos, Cambodge et Myanmar, et les Étatlets de la frontière birmane là où ils se tiennent. Une protection qui atteint les faibles est la seule qui prouve que le Royaume dit vrai."
 SIA_protector_of_asean_focus: "Une ASEAN, un bouclier"
 SIA_protector_of_asean_focus_desc: "Un parapluie signé suffit à changer la dynamique politique de la région. Quelle que soit la garantie que Bangkok a étendue en premier, le Royaume sert de protecteur de l'Asie du Sud-Est, et une architecture de sécurité menée par la Thaïlande commence à remplacer l'ancien équilibre de la peur. La défense de la région devient indivisible, et Bangkok tient la clé de voûte."
 SIA_professional_officer_corps_focus: "Un corps d'officiers professionnels"
 SIA_professional_officer_corps_focus_desc: "La faction réformatrice gagne l'argument. Avancement par compétence, une vraie filière d'école d'état-major, et une culture de commandement bâtie sur la doctrine plutôt que le clientélisme. L'habitude du putsch s'estompe à mesure que l'armée apprend à s'enorgueillir du métier de soldat plutôt que de la politique."
 SIA_martial_prestige_focus: "La gloire de l'épée"
 SIA_martial_prestige_focus_desc: "Les traditionalistes l'emportent. Les forces armées sont célébrées comme l'âme de la nation, le terrain de parade aussi sacré que le temple. Le moral et l'esprit martial s'envolent, mais le culte de l'uniforme tient les généraux près du centre du pouvoir."
 SIA_jointness_reform: "Réforme de l'interarmées"
 SIA_jointness_reform_desc: "Une force de commandement conjoint tisse les trois armes en un seul instrument de combat. En combinant les états-majors, partageant les doctrines et unifiant la chaîne de commandement, la structure parallèle évolue en une force cohérente capable d'opérations multi-domaines."
 SIA_defense_export_office: "Bureau des exportations de défense"
 SIA_defense_export_office_desc: "Une agence dédiée portant les systèmes thaïs sur le marché mondial en courtant les contrats, arrangeant le financement, et transformant la base industrialo-défense en source de recettes plutôt qu'en drain budgétaire."
 SIA_self_reliant_defense_base: "Une base de défense autonome"
 SIA_self_reliant_defense_base_desc: "De nouvelles usines d'armes et une chaîne d'approvisionnement approfondie libèrent le Royaume de la dépendance aux fournisseurs étrangers. La Thaïlande peut s'armer, et armer ses clients, depuis ses propres usines, avec ses propres conceptions, à son propre calendrier."
 SIA_total_defense_doctrine: "Doctrine de défense totale"
 SIA_total_defense_doctrine_desc: "La défense devient une entreprise de toute la nation, avec une conscription élargie, des exercices de défense civile de routine, et un front intérieur durci. Le Royaume prépare non seulement une armée mais une société prête à résister."
 SIA_doctrine_professional_tt: "Fait passer l'idée §YForces professionnelles§! au palier suivant et engage le Royaume sur la voie de la professionnalisation."
 SIA_doctrine_prestige_tt: "Accorde §YGloire martiale§! et engage le Royaume sur la voie du prestige, avec un haut soutien à la guerre et du pouvoir de commandement au prix de la stabilité."
 SIA_national_rnd_network: "Bâtir les parcs scientifiques"
 SIA_national_rnd_network_desc: "Laboratoires publics, partenariats universitaires, et un parc scientifique dédié à Pathum Thani donnent au Royaume une colonne vertébrale de recherche à lui. L'Agence nationale de développement de la science et de la technologie ancre un réseau d'installations de R&D qui accélère l'adoption technologique et hisse toute l'économie vers l'industrie à plus haute valeur."
 SIA_civilian_rnd_center: "Centre de R&D civile"
 SIA_civilian_rnd_center_desc: "Une installation civile dédiée de recherche et de prototypage, avec laboratoires, bancs d'essai et un vivier d'ingénieurs libres de courir ce dont le Royaume a besoin ensuite. Un quatrième centre de recherche à opposer au seul chantier naval dont le Royaume est parti, et la place de développer ses propres projets."
 SIA_air_rnd_center: "Centre de R&D aéronautique"
 SIA_air_rnd_center_desc: "Une installation d'avionique et d'aéronautique avec souffleries, un polygone d'essais en vol instrumenté et les ingénieurs pour les faire tourner. L'industrie thaïe obtient le banc pour prototyper des systèmes d'aéronefs chez elle plutôt que les acheter finis à l'étranger."
 SIA_army_rnd_center: "Centre de R&D sur la guerre terrestre"
 SIA_army_rnd_center_desc: "Un polygone de systèmes terrestres avec pistes d'essai de blindés, champs de tir et un bureau d'études. L'armée peut développer et prototyper ses propres véhicules et équipements au lieu d'attendre les fournisseurs étrangers et leurs conditions."
 SIA_gistda_space_agency: "Donner du pouvoir au GISTDA"
 SIA_gistda_space_agency_desc: "L'Agence de géoinformatique et de développement des technologies spatiales reçoit un vrai mandat et un vrai budget. Fondée pour donner un sens aux données satellitaires, le GISTDA devient l'institution spatiale du Royaume, opérant des stations sol, formant des ingénieurs, et offrant à la recherche thaïe une fenêtre sur tout ce qui est au-dessus. Un petit programme spatial n'est plus un luxe étranger mais une capacité nationale."
 SIA_theos_earth_observation: "THEOS Observation de la Terre"
 SIA_theos_earth_observation_desc: "Le premier satellite d'observation de la Terre thaï, THEOS, ouvre les propres yeux du Royaume en orbite, cartographiant le sol, suivant crues et récoltes, et alimentant les services de renseignement d'une imagerie qu'aucun voisin ne peut leur nier. Le programme de suite approfondit l'expertise de l'agence en optique, liaison descendante et traitement d'image, et transforme les passages bruts en reconnaissance actionnable."
 SIA_space_krenovation_park: "Parc Espace Krénovation"
 SIA_space_krenovation_park_desc: "Un parc industriel aérospatial s'élève sur le Seaboard oriental, avec salles blanches, halls d'assemblage et une chaîne d'approvisionnement pour composants satellitaires et petits lanceurs. Ce qui commença comme agence de recherche ancre désormais une industrie aérospatiale nationale, attirant des firmes privées et donnant à l'ingénierie thaïe un secteur à haute valeur à appeler sien."
 SIA_sovereign_launch_capability: "Capacité de lancement souverain"
 SIA_sovereign_launch_capability_desc: "Le Royaume résout de fermer le dernier écart, la capacité de concevoir, construire et mettre en orbite ses propres satellites sans demander congé à personne. Un programme indigène de lancement et de constellation couronne deux décennies de travail, plaçant la Thaïlande parmi la poignée d'États avec un pied souverain dans l'espace et une portée de renseignement qui ne répond à personne d'autre."
 SIA_ptt_energy_champion: "PTT, champion national de l'énergie"
 SIA_ptt_energy_champion_desc: "Le groupe énergétique d'État est introduit en Bourse et lâché comme géant commercial. Gonflé de capital d'IPO et d'un mandat d'exploration du golfe de Thaïlande au Myanmar, PTT sécurise l'approvisionnement en carburant du Royaume et devient sa plus grande corporation."
 SIA_scg_industrial_titan: "Groupe Ciment Siam"
 SIA_scg_industrial_titan_desc: "Le plus ancien et le plus grand conglomérat industriel du Royaume s'étend du ciment vers la pétrochimie, les matériaux de construction et l'emballage. Les carnets de SCG souscrivent le boom de la construction et ancrent une chaîne d'approvisionnement nationale dont aucun programme d'infrastructure ne peut se passer, et ses recettes fiscales croissent avec, même si le groupe s'appuie plus fort sur la bureaucratie des permis."
 SIA_packaging_empire: "L'empire de l'emballage"
 SIA_packaging_empire_desc: "Le bras emballage de SCG s'introduit en Bourse et part en courses à travers la région, absorbant des usines de l'Indonésie au Vietnam jusqu'à imprimer et mouler pour la moitié de l'Asie du Sud-Est. Le discours est l'économie circulaire : fibre recyclée, plastiques plus légers, carbone plus bas. Le coût tombe sur les petits imprimeurs et cartonniers qu'il rachète ou écrase."
 SIA_cp_agribusiness_giant: "Groupe Charoen Pokphand"
 SIA_cp_agribusiness_giant_desc: "From feed mills to 7-Eleven, the CP conglomerate becomes Thailand's agribusiness and retail colossus. Contract farming lifts rural incomes and stocks the shelves, while CP's export muscle carries Thai food to every market in Asia and Europe. Commercialized agriculture productivity climbs across the contract-farming network, and a second district goes up in the Isaan rice belt."
 SIA_buffer_states: "Une ceinture d'États tampons"
 SIA_buffer_states_desc: "Plutôt que de les avaler, la Thaïlande tiendra Shan et Karen en vie et armés, une haie de tampons amis absorbant la pression birmane avant qu'elle n'atteigne le Royaume. Lignes d'approvisionnement transfrontalières, camps d'entraînement et garanties discrètes transforment les insurgés de la frontière en bouclier."
 SIA_protectorate_doctrine: "Doctrine du protectorat"
 SIA_protectorate_doctrine_desc: "L'état-major se fixe sur l'instrument plus doux de l'empire, non la conquête mais la vassalité. Les Étatlets de la frontière seront amenés sous protection thaïe comme États clients, leurs bannières laissées flotter sur des capitales qui répondent à Bangkok."
 SIA_annexation_doctrine: "Doctrine d'annexion"
 SIA_annexation_doctrine_desc: "Pas de demi-mesures. Les terres de frontière seront prises net, leur territoire incorporé au Royaume et leurs gouvernements séparatistes dissous. Bangkok pose ses revendications sur les cœurs shan et karen et prépare l'armée à les faire appliquer."
 SIA_subdue_the_shan: "Soumettre les Shan"
 SIA_subdue_the_shan_desc: "L'armée royale thaïe marche sur l'État Shan du Sud. Que cela finisse en protectorat thaï ou en province thaïe dépend de la doctrine choisie, mais de toute façon, le writ de Bangkok ira jusqu'à la Salween."
 SIA_subdue_the_karen: "Soumettre les Karen"
 SIA_subdue_the_karen_desc: "Les forces thaïes franchissent les collines karen. Les décennies de refuge et de patronage discret s'achèvent, et le Royaume vient désormais en maître, pour marionnettiser ou annexer selon la politique."
 SIA_burma_breakaway_question: "Les États sécessionnistes"
 SIA_burma_breakaway_question_desc: "Par-delà la Salween, le writ de la Birmanie s'est effondré en un patchwork d'Étatlets armés, les Shan, les Karen, les Wa. Ils sont faibles, divisés, et nettement à portée de la Thaïlande. Bangkok doit décider ce que ces terres sécessionnistes sont pour le Royaume. Un bouclier, un prix, ou un problème à gérer."
 SIA_subdue_the_wa: "Soumettre les Wa"
 SIA_subdue_the_wa_desc: "L'Armée de l'État Wa uni mène la plus formidable, et la plus saturée de stupéfiants, des armées sécessionnistes. Mettre au pas les collines wa signifie un dur combat, mais cela ferme un pipeline de drogue au pas de la porte du Royaume et plante le drapeau thaï profondément dans les terres de frontière birmanes."
 SIA_rta_looks_abroad: "Soixante ans de M48"
 SIA_rta_looks_abroad_desc: "L'armée royale thaïe aligne encore chars et transporteurs d'un autre siècle. Rééquiper n'est plus une question de si, mais de quel acier roulera par les portes de Korat, et quelles ficelles y sont soudées. Une nouvelle chaîne de production se dresse partout où la capacité le permet."
 SIA_stryker_brigades: "Les roues de l'Occident"
 SIA_stryker_brigades_desc: "Brigades Stryker, doctrine américaine, et une chaîne logistique qui se branche droit dans l'armée la plus capable du monde. Le matériel est superbe et l'interopérabilité sans prix, mais chaque cartouche se paie en dollars et en déférence à Washington."
 SIA_eda_blackhawks: "Des reliques d'une superpuissance"
 SIA_eda_blackhawks_desc: "Via Excess Defense Articles et Foreign Military Sales, des Black Hawk et Cobra rénovés arrivent à une fraction du prix catalogue. Les cellules ont déjà volé, mais une portée aéromobile au rabais est un marché que l'alliance rend possible."
 SIA_vn1_mechanization: "Un VTT pour chaque peloton"
 SIA_vn1_mechanization_desc: "Transporteurs VN1 et VN16 de la chaîne chinoise, par centaines, pour ce que coûterait une poignée de véhicules occidentaux. L'infanterie roule enfin, et les usines qui les construisent sont payées avant la fin de l'année."
 SIA_norinco_fires: "Le catalogue NORINCO complet"
 SIA_norinco_fires_desc: "Obusiers SH1, artillerie-roquettes SR5, tout le catalogue au prix du paquet. La puissance de feu est réelle, mais aussi les files de pièces et les transmissions qui lâchent au champ. L'acier bon marché tient un intendant éveillé la nuit."
 SIA_tavor_standard: "Un fusil à nous"
 SIA_tavor_standard_desc: "La production sous licence du Tavor fait des usines thaïes la source du fusil standard de l'armée. Pas d'embargo, pas de liste d'attente, pas de veto étranger sur qui nous armons, seulement la première brique d'un arsenal qui ne répond qu'à Bangkok."
 SIA_oplot_and_rotors: "Diplomatie du bazar"
 SIA_oplot_and_rotors_desc: "Coques Oplot ukrainiennes, rotors Mi-17 russes, tout ce que le marché offre à un acheteur qui ne choisit aucun camp. La capacité afflue de partout à la fois, et irrite Washington et Pékin à mesure égale, gérable."
 SIA_dti_black_widow: "Araignée Veuve Noire"
 SIA_dti_black_widow_desc: "Le 8x8 de l'Institut de technologie de la défense, aux côtés du First Win éprouvé de Chaiseri. Conçu en Thaïlande, bâti en Thaïlande, et assez bon pour que d'autres veuillent les acheter. L'arsenal a commencé à se payer."
 SIA_first_army_modernized: "La nouvelle armée royale thaïe"
 SIA_first_army_modernized_desc: "Quelle qu'ait été la voie du rééquipement, le résultat se tient enfin sur le terrain de parade. Une armée royale thaïe moderne, réoutillée, recyclée, et prête pour le siècle où elle doit vraiment se battre."
 SIA_gripen_globaleye: "Les yeux de tout le ciel"
 SIA_gripen_globaleye_desc: "Le GlobalEye AEW&C de Saab transforme une poignée de Gripen en une force en réseau qui voit la première et tire la première. Le radar aéroporté est le multiplicateur qui fait frapper une petite force aérienne bien au-dessus de ses effectifs."
 SIA_j10_squadrons: "Dragons au-dessus de Don Mueang"
 SIA_j10_squadrons_desc: "Chasseurs multirôles J-10CE, par escadrons, à un prix que Washington n'aurait jamais pu égaler, et que Washington ne pardonnera jamais. Choisir Chengdu plutôt que Fort Worth recâble les cieux du Royaume, et ses alliances."
 SIA_hq9_air_defense: "Un toit de missiles"
 SIA_hq9_air_defense_desc: "Batteries sol-air longue portée HQ-9 et FK-3 tendent un parapluie sur la Plaine centrale. Bon marché, dense, et intégré. Le déni d'accès à la chinoise."
 SIA_wing_loong_uav: "Chasseurs de patients"
 SIA_wing_loong_uav_desc: "Drones Wing Loong et série CH stationnent une journée et frappent sur ordre. Reconnaissance de masse sans pilote et frappe de précision, achetées pour le coût d'un seul escadron habité."
 SIA_f5th_super_tigris: "De nouveaux tours pour un vieux tigre"
 SIA_f5th_super_tigris_desc: "Avionique israélienne, un radar AESA, et des missiles Python-5 transforment le vénérable F-5 en F-5TH « Super Tigris ». Pas un nouvel avion, mais de la puissance de combat extraite de cellules déjà payées, ne devant rien à aucune superpuissance."
 SIA_dti_uav_command: "Yeux souverains"
 SIA_dti_uav_command_desc: "Une aile de drones de l'Institut de technologie de la défense, conçue et volée au pays, donne à la Thaïlande sa propre image de reconnaissance, et un produit à vendre aux voisins."
 SIA_air_dominance_doctrine: "Maîtres du ciel thaï"
 SIA_air_dominance_doctrine_desc: "Quelle qu'ait été son équipement, la Force aérienne royale thaïe s'achève en force moderne, en réseau, multirôle, maîtresse de l'espace aérien qu'elle a juré de défendre."
 SIA_korean_frigates: "Le standard Bhumibol"
 SIA_korean_frigates_desc: "Le choix occidental pour la flotte. Une frégate moderne DW3000 de Corée, avec systèmes de combat occidentaux, défense aérienne de zone, et le plus capable des combattants de surface que la flotte ait jamais fait naviguer. La qualité a un prix, et Séoul le nomme en dollars."
 SIA_chinese_engine_compromise: "Un cœur chinois"
 SIA_chinese_engine_compromise_desc: "Les moteurs allemands n'arriveront jamais, et le bateau a attendu une décennie. Accepter le groupe CHD620 chinois et le sous-marin navigue enfin, à bon marché, souverainement, et avec une période de rodage que les ingénieurs passeront un an à maudire."
 SIA_type071_flotilla: "Des coques de Hudong"
 SIA_type071_flotilla_desc: "Un bâtiment de débarquement Type 071E et une poignée de patrouilleurs chinois donnent à la flotte un bras amphibie du jour au lendemain, pour ce que coûterait une seule coque occidentale."
 SIA_krabi_class_opv: "Nos propres quilles"
 SIA_krabi_class_opv_desc: "Le choix indépendant pour la flotte. Le patrouilleur hauturier de classe Krabi, bâti à Bangkok Dock, pose la quille d'une industrie navale souveraine. Lent à mûrir, mais il ne répond à aucun chantier étranger."
 SIA_european_propulsion: "Coeurs sous licence, coques thaïlandaises"
 SIA_european_propulsion_desc: "Un achat, pas un partenariat. Acheter diesels MTU et systèmes de combat sous licence, une fois, puis les démonter jusqu'aux boulons et bâtir le reste chez soi. Un savoir-faire importé, absorbé dans un programme souverain qui ne doit rien à aucun patron."
 SIA_naval_self_reliance: "Des frégates des chantiers de Bangkok"
 SIA_naval_self_reliance_desc: "Les chantiers thaïs posent désormais des navires de guerre de leur propre conception, avec une base industrialo-défense navale qui compose et exporte. La flotte, enfin, se bâtit chez soi."
 SIA_command_of_the_seas: "Deux Golfes, une flotte"
 SIA_command_of_the_seas_desc: "Quelle qu'ait été sa construction, la marine royale thaïe se tient comme une vraie force hauturière, capable de tenir le golfe et de porter dans l'Andaman, maîtresse des mers qui baignent deux côtes du Royaume."
 SIA_the_western_anchor: "L'ancre de Washington en Asie"
 SIA_the_western_anchor_desc: "Terre, air et mer tous achetés à l'Occident, et l'alliance devient la pierre angulaire de la défense nationale. Interopérabilité, partage de renseignement, et la garantie américaine implicite, en échange d'une place fermement dans l'orbite de Washington."
 SIA_the_bamboo_bloc: "Dans l'ombre du dragon"
 SIA_the_bamboo_bloc_desc: "Trois armes équipées par Pékin font de la Thaïlande le premier client d'armes de la Chine dans la région. Masse bon marché, une image C4ISR partagée, et un puissant patron, le tout au prix de la confiance de l'Occident."
 SIA_strategic_autonomy: "Redevable envers personne"
 SIA_strategic_autonomy_desc: "Une force bâtie, de plus en plus, chez soi, et vendue à l'étranger. L'Institut de technologie de la défense devient une maison d'armes régionale, et le Royaume ne répond à aucune capitale étrangère pour les moyens de sa propre défense."
 SIA_the_bamboo_doctrine: "Pliant avec le vent"
 SIA_the_bamboo_doctrine_desc: "Jets suédois, chars chinois, un sub de Pékin et une frégate de Séoul. La Thaïlande achète à tout le monde et n'appartient à personne. Le roseau qui plie dans la tempête y survit. La plus vieille stratégie thaïe, faite chair dans l'ordre de bataille."
 SIA_dual_use_threshold: "Le seuil dual"
 SIA_dual_use_threshold_desc: "Every nuclear civil power program has the same potential capabilities a weapons program needs. Quietly master the fuel cycle, with uranium enrichment under the cover of energy independence, and the Kingdom keeps every option open without yet declaring one."
 SIA_minimum_deterrent: "Un minimum de dissuasion"
 SIA_minimum_deterrent_desc: "Une poignée d'ogives, pas plus, assez pour qu'aucun voisin et aucune grande puissance ne puisse plus jamais tenir le Royaume pour acquis. La Thaïlande rejoint le club nucléaire à ses propres termes, et le cabinet doit maintenant décider à voix haute ce qu'il dira que ses bombes sont."
 SIA_the_democrats_endure: "Les démocrates tiennent"
 SIA_the_democrats_endure_desc: "Le Parti démocrate, le plus ancien du Royaume, garde sa poigne sur le gouvernement plutôt que de céder à la marée populiste. Pas de raz-de-marée, pas de milliardaire charismatique, seulement le métier patient et sans éclat de gouverner en large coalition civile. Le parti mise son avenir sur les institutions, non sur un seul chef."
 SIA_chuan_clean_government: "Gouvernement propre"
 SIA_chuan_clean_government_desc: "M. Propre prend la barre. Une réputation d'incorruptibilité personnelle devient la marque du parti, avec budgets ouverts, ministères professionnels, et une guerre à l'enveloppe brune. Ce ne sera pas tape-à-l'œil, mais cela bâtit la machine qui transforme une gouvernance honnête en clientèle durable."
 SIA_rule_of_law: "L'État de droit"
 SIA_rule_of_law_desc: "Un gouvernement qui vit selon la constitution qu'il a juré de défendre. Due process, administration prévisible, et des tribunaux qui répondent à la loi plutôt qu'à la caserne. Chaque putsch commence par suspendre le règlement, alors le Royaume apprend à le garder."
 SIA_judicial_independence: "Un banc indépendant"
 SIA_judicial_independence_desc: "Isoler le judiciaire du réseau du palais comme des généraux. Un siège qu'on ne peut pas presser est le plus sûr frein au cycle de dissolution et de putsch, et l'arme favorite de l'establishment, l'activisme judiciaire, est émoussée à la source."
 SIA_strengthen_parliament: "Renforcer le Parlement"
 SIA_strengthen_parliament_desc: "Donner à la chambre élue le personnel, les commissions et le standing pour vraiment gouverner. Une législature qui fonctionne laisse le parti gouverner par les voix plutôt que par décret d'urgence, et donne au public un enjeu dans l'issue de chaque session."
 SIA_liberal_market_stewardship: "Gestion libérale du marché"
 SIA_liberal_market_stewardship_desc: "Monnaie saine, commerce ouvert, et un État qui régule plutôt que dépense. Les démocrates offrent le contrepoids technocratique à la Thaksinomics, avec une croissance tirée par la finance, l'export et l'entreprise privée plutôt que par des enveloppes rurales."
 SIA_southern_stronghold: "Le bastion du Sud"
 SIA_southern_stronghold_desc: "Le cœur du parti est le Sud et le Sud a des griefs. Y répondre par routes, écoles et cliniques plutôt que par checkpoints, financés sur le Trésor plutôt que promis sur le papier. La paix par le développement qui tient la base loyale et draine l'insurrection de recrues."
 SIA_coalition_government: "Gouvernement par coalition"
 SIA_coalition_government_desc: "Le pouvoir assemblé à la dure par un patchwork de partenaires, de blocs régionaux et de petits partis cousus en une majorité de travail. C'est lent et compromis, pourtant c'est la seule forme de gouvernement que les chars ont le plus de mal à justifier de rouler contre. L'ordre élu survit en partageant le pouvoir."
 SIA_mature_democracy: "Une démocratie mature"
 SIA_mature_democracy_desc: "Le Royaume franchit le seuil de l'alternance pacifique avec une opposition loyale et le public peut traiter les putschs comme de l'histoire. Les institutions importent plus que n'importe quelle campagne : une administration plus propre et une autorité durable, achetées avec une montée plus lente dans les sondages qu'une coalition plus large n'aurait pu acheter."
 SIA_grand_coalition: "La grande coalition"
 SIA_grand_coalition_desc: "Plutôt que de combattre l'ancien ordre, l'absorber. Les démocrates deviennent le visage élu de l'establishment conservateur, gagnant propriétaires et affaires tandis que palais, bureaucratie et conseils d'administration gouvernent par les urnes plutôt que par la caserne. Une stabilité achetée par le consensus, au prix de nourrir les mêmes réseaux de clientèle que le parti combattait autrefois."
 SIA_coalition_overhead: "Frais généraux de la coalition"
 SIA_coalition_overhead_desc: "Chaque partenaire amené sous le grand chapiteau veut sa part. Tenir la coalition coûte plus de capital politique que gouverner seul ne l'a jamais fait."
 SIA_democrat_revival: "Le retour des démocrates"
 SIA_democrat_revival_desc: "Depuis le désert de l'opposition, le parti se hisse de nouveau au Premier ministère par le bazar de coalition post-2019. Les démocrates gouvernent à nouveau, plus vieux, châtiés, et déterminés cette fois à faire tenir l'ordre civil."
 SIA_answer_thaksinomics: "Répondre Thaksinomics"
 SIA_answer_thaksinomics_desc: "Thaksin's genius was to rally villages because Bangkok never did successfully. Do not sneer at the village fund, and instead build a better one to raise people out of spiralling debt and shrinking opportunities. A Democrat program of rural credit, a farmers' debt moratorium and cheap healthcare, launched before Thai Rak Thai can, blunts the populist pitch at its source rather than conceding the countryside and winning back power only through the courts.\n\n§GThe populist tide recedes.§!"
 SIA_pracha_wiwat: "L'agenda du peuple"
 SIA_pracha_wiwat_desc: "Pracha Wiwat, ce sont neuf mesures dévoilées comme cadeaux du Nouvel An. Électricité gratuite pour les foyers les plus pauvres, une subvention au gaz de cuisine, protection sociale et immatriculation pour les motos-taxis et vendeurs de rue de l'économie informelle, et une option d'épargne pour les travailleurs hors système. La preuve qu'un parti libéral-conservateur peut répondre au besoin sans ruiner le Trésor.\n\n§GLa marée populiste recule.§!"
 SIA_contest_every_election: "Concours à chaque élection"
 SIA_contest_every_election_desc: "Quelle que soit la provocation, scrutin surprise truqué, amnistie d'un fugitif, ou tribunal pipé, le parti reste dans le jeu démocratique. Il conteste chaque élection et accepte chaque résultat. C'est la discipline que le parti a abandonnée en 2006 et 2014, et elle nie aux populistes le seul grief qui ait jamais vraiment collé, que les démocrates ne gagnent que lorsque soldats et juges gagnent pour eux.\n\n§GLa marée populiste recule,§! et la porte de la rue est fermée pour de bon."
 SIA_the_street_over_the_ballot: "La rue plutôt que l'urne"
 SIA_the_street_over_the_ballot_desc: "Assez de perdre aux urnes. Démissionner des sièges du parti et porter le mouvement dans la rue. Les protestations ferment la capitale et rendent le pays ingouvernable jusqu'à la chute du gouvernement élu. Cela marche et la capitale est dans le chaos. Les généraux prennent le prétexte qu'on leur a tendu, les chars roulent, et un parti qui se tenait pour un gouvernement civil propre est souvenir comme sage-femme d'un putsch.\n\n§RLe Royaume passe sous régime militaire. La voie démocrate s'achève ici, et le nouvel ordre a son propre tronc.§!"
 SIA_break_into_isan: "Percer dans le Nord-Est"
 SIA_break_into_isan_desc: "Le correctif structurel que le parti n'a jamais fait. Une génération durant les démocrates ont possédé le Sud et Bangkok et cédé le vaste et pauvre Nord-Est à Thaksin par défaut. Y passer une décennie à la place. Bâtir les sections, présenter les candidats, faire une offre redistributive crédible à l'Isaan selon ses termes. Gagner ne fût-ce qu'un pied dans le cœur populiste et la marée perd sa source. C'est la route la plus dure vers un pouvoir durable, et la seule qui ne dépende pas des tribunaux.\n\n§GDésormais la marée populiste grimpe bien plus lentement.§!"
 SIA_board_of_investment: "Renforcer le Board of Investment"
 SIA_board_of_investment_desc: "Le Board of Investment a toujours été le moteur discret de la Thaïlande, courtisant le capital étranger et orientant les firmes thaïes à l'étranger. Lui donner de vraies dents et un vrai budget. L'investissement devient moins cher et plus rapide, et chaque baht que Bangkok place outre-mer revient plus fort."
 SIA_regional_trade_network: "Réseau commercial régional"
 SIA_regional_trade_network_desc: "Transformer un éparpillement d'accords bilatéraux en un vrai réseau d'accords de libre-échange à travers l'ASEAN et au-delà. Chaque accord que la Thaïlande signe désormais verse un dividende tarifaire au Trésor et élargit la portée du soft power thaï à l'étranger."
 SIA_mekong_soft_power: "Le soft power du Mékong"
 SIA_mekong_soft_power_desc: "Bangkok siège en tête du Mékong, et le fleuve court à travers le Laos, le Cambodge et le Myanmar. Commerce, aide et investissement deviennent les instruments d'un leadership discret sur le voisinage. La Thaïlande peut désormais presser son avantage à l'étranger, pas seulement garder le sien."
 SIA_regional_trade_network_tt: "Chaque accord commercial signé verse désormais un dividende mensuel au Trésor et ajoute à la portée d'influence étrangère de la Thaïlande, les deux plafonnés."
 SIA_trade_dividend_tt: "La Thaïlande encaisse chaque mois le dividende de son réseau d'accords commerciaux."
 SIA_trade_diplomacy_network: "Diplomatie commerciale"
 SIA_trade_diplomacy_network_tt: "La portée d'influence étrangère croît avec le nombre d'accords commerciaux signés, jusqu'à un plafond."
 SIA_crisis_modifier: "Héritage de la crise de 1997"
 SIA_crisis_modifier_desc: "La crise Tom Yum Kung a brisé l'économie miracle du jour au lendemain : le baht en chute libre, les banques ensevelies sous les créances douteuses, le FMI à la porte. Chaque pas de la reprise referme une part de la plaie. Le Royaume apprend du passé et en sort plus résilient qu'avant."
 SIA_economy_modifier: "Économie thaïlandaise"
 SIA_economy_modifier_desc: "Le grand livre courant des programmes économiques du royaume, de la base d'export et du CEE aux champions nationaux et à la poussée numérique. Chaque réforme et chaque boom laisse ici sa marque."
 SIA_military_modifier: "Forces armées royales thaïlandaises"
 SIA_military_modifier_desc: "L'état des soldats, marins et aviateurs du royaume : achats, doctrine, formation et l'industrie de défense derrière eux. Les programmes de modernisation s'accumulent ici."
 SIA_politics_modifier: "Corps politique thaïlandais"
 SIA_politics_modifier_desc: "Les os institutionnels de la gouvernance thaïe : tribunaux, parlement, bureaucratie et les règlements qui tiennent ensemble la politique du royaume. Réformes et réactions y laissent toutes leur marque."
 SIA_armed_forces_state: "La vieille garde"
 SIA_armed_forces_state_desc: "Un général pour quelques centaines de soldats, et le vrai compte tenu loin du parlement. La promotion court sur la liste annuelle de permutation, sur la classe de pré-cadets et la faction d'unité, avant de jamais courir sur le mérite. Le corps des officiers possède une chaîne de télévision, des golfs, des terres, et des schémas de bien-être que les soldats staffent comme main-d'œuvre non payée. La préparation et l'entraînement paient pour tout cela, et la masse salariale ne fait que croître."
 SIA_clean_the_banks: "Nettoyer les banques"
 SIA_clean_the_banks_desc: "Les cinquante-six sociétés financières fermées sont liquidées via l'Autorité de restructuration du secteur financier, et la Thai Asset Management Corporation retire les créances douteuses des livres. Avec des bilans propres les banques prêtent à nouveau et les grues reviennent à la skyline."
 SIA_dual_track_recovery: "Redynamiser la demande intérieure"
 SIA_dual_track_recovery_desc: "La dette soldée, tourner la reprise vers l'intérieur. Crédit bon marché, programmes de dépenses rurales, et soutien aux petites entreprises mettent l'argent dans les mains qui le dépensent le plus vite. La croissance revient vite et tourne chaud, et les factures et les faveurs dues s'empilent tout aussi vite."
 SIA_sufficiency_path: "Une reconstruction résiliente"
 SIA_sufficiency_path_desc: "Choisir la constance plutôt que la vitesse. Agriculture diversifiée, emprunt modéré, et économies locales autosuffisantes reconstruisent une base plus calme capable d'encaisser le prochain choc. Le boom ne rugit jamais, mais le nettoyage atteint aussi la gouvernance."
 SIA_frontier_integration: "Intégrer la frontière"
 SIA_frontier_integration_desc: "Les campagnes sont gagnées et les soldats thaïs tiennent le plateau shan, les collines karen et les hautes terres wa. Gagner le terrain et le gouverner sont des tâches différentes. Nous dressons une administration pour les marches recouvrées, semons les premières routes et garnisons, et commençons le lent travail de transformer un peuple conquis en citoyens. Les Terres recouvrées peuvent désormais être pacifiées, développées, et avec le temps revendiquées pour le Royaume net."
 SIA_the_new_order: "Le nouvel ordre au Sud"
 SIA_the_new_order_desc: "Les revendications sont posées de Manille au détroit de Malacca, et là où nos armées ont marché les anciens drapeaux sont à terre. Une hégémonie déclarée n'est pas une hégémonie qui tient. Nous bâtissons la machinerie de l'empire, gouverneurs et garnisons et bureaux de reconstruction, pour que les provinces saisies soient administrées plutôt que seulement occupées. Les Terres recouvrées peuvent désormais être pacifiées, développées, et repliées définitivement dans une Grande Thaïlande."
 SIA_industrial_estates: "Les zones industrielles"
 SIA_industrial_estates_desc: "Amata, Hemaraj et Rojana bâtissent des zones industrielles privées à travers le seaboard oriental et courtisent directement les usines japonaises et occidentales. La Thaïlande devient l'atelier qui accueille le boom de l'export, avec terrains et électricité prêts pour tout fabricant qui arrive."
 SIA_hard_disk_of_the_world: "Le disque dur du monde"
 SIA_hard_disk_of_the_world_desc: "Seagate, Western Digital, et des fournisseurs locaux comme Delta et Hana font de la Thaïlande le plus grand assembleur de disques durs du monde et un exportateur d'électronique de premier plan. C'est le géant silencieux derrière les cartes postales touristiques, expédiant discrètement un quart des lecteurs de la planète."
 SIA_thai_union_seafood: "Rois de la boîte"
 SIA_thai_union_seafood_desc: "Thai Union rachète Chicken of the Sea et devient le plus grand conserveur de thon du monde, tandis que les transformateurs de Samut Sakhon transforment les eaux thaïes et la main-d'œuvre bon marché en empire mondial des fruits de mer. Crevettes congelées et poisson en conserve s'écoulent vers les rayons du monde, et le port de pêche de Samut Sakhon reçoit une base navale à la mesure de sa nouvelle importance."
 SIA_retail_kings: "Les rois de la distribution"
 SIA_retail_kings_desc: "Le Central Group de la famille Chirathivat, Big C, et les hypermarchés reconstruisent l'économie intérieure autour des malls et du commerce moderne. CentralWorld ouvre en 2006 et une classe moyenne consommatrice commence à dépenser plutôt qu'à seulement exporter."
 SIA_beverage_empire: "Le brasseur de Bangkok"
 SIA_beverage_empire_desc: "ThaiBev de Charoen Sirivadhanabhakdi, faiseur de la bière Chang et du SangSom, grandit en titan régional des boissons et de l'immobilier. Bloqué à la cote de Bangkok par des protestations bouddhistes antialcool, il lève son capital à Singapour à la place et reverse le produit au pays. La manne d'impôt sur les sociétés est réelle, et le retour de bâton tempérant qu'elle provoque aussi."
 SIA_fta_decade: "La décennie des ALE"
 SIA_fta_decade_desc: "Une vague d'accords commerciaux bilatéraux branche la machine d'export sur la région. L'accord australien de 2005, le partenariat japonais de 2007, et la récolte précoce chinoise sur les produits agricoles dégagent tous les tarifs. C'est vraiment un travail transgouvernemental, signé par des rivaux qui ne s'accordent sur presque rien d'autre."
 SIA_sugar_and_ethanol: "Les barons du sucre"
 SIA_sugar_and_ethanol_desc: "Mitr Phol et le Thai Roong Ruang Group font de la ceinture cannière le cœur sucrier de l'Asie et transforment sucre et manioc en export et en éthanol pour le programme gasohol. L'agriculture se diversifie enfin au-delà du riz, et le biocarburant alimente droit l'approvisionnement national."
 SIA_gems_and_gold: "Gemmes et or"
 SIA_gems_and_gold_desc: "Les tailleurs de Chanthaburi et le commerce joaillier de Bangkok font de la Thaïlande la capitale mondiale de la taille des gemmes de couleur et de l'export gemmifère. C'est une industrie originale, à haute marge et faible empreinte, qui gagne des devises par le savoir-faire plutôt que par l'échelle, et le livre d'export croît à chaque pierre qui quitte le pays."
 SIA_map_ta_phut: "Carte Ta Phut"
 SIA_map_ta_phut_desc: "PTT et SCG bâtissent leur empire pétrochimique aval à Rayong, et les cheminées de Map Ta Phut deviennent le cœur lourd du seaboard oriental. L'industrie explose même si les communautés à côté des usines paient le prix en air et eau pollués, et le port qui sert le complexe ajoute de la capacité pour suivre."
 SIA_ignite_thailand: "ENFLAMMER la Thaïlande"
 SIA_ignite_thailand_desc: "Le gouvernement adopte la Stratégie nationale de vingt ans et la vision de hub IGNITE, nommant enfin le piège du revenu intermédiaire comme l'ennemi. La Thaïlande s'est enrichie assez pour caler. Les salaires ont dépassé le plancher d'usine bon marché sans jamais atteindre la frontière de l'innovation, et le Vietnam se rapproche vite."
 SIA_digital_kingdom: "Le Royaume numérique"
 SIA_digital_kingdom_desc: "La Thaïlande se présente comme le hub numérique de l'ASEAN, et les hyperscalers commencent à le remarquer. Fibre, politique cloud, et une jeune population en ligne font du pays un candidat sérieux pour le trafic de données de la région."
 SIA_data_center_hub: "La ruée vers le cloud"
 SIA_data_center_hub_desc: "Amazon, Google, Microsoft et TikTok versent des milliards dans des centres de données à Chonburi et Rayong. Les serveurs arrivent plus vite que l'électricité et l'eau pour les faire tourner, et le réseau commence à plier sous la charge."
 SIA_virtual_banks: "PromptPay et les banques virtuelles"
 SIA_virtual_banks_desc: "PromptPay rend la Thaïlande presque sans cash, avec quatre-vingt-dix millions d'inscriptions déplaçant des dizaines de millions de virements par jour. La banque centrale agrée des banques uniquement numériques, et l'argent qui disparaissait autrefois dans le cash laisse désormais une trace que le percepteur peut lire."
 SIA_bcg_economy: "Bio-Circulaire-Vert"
 SIA_bcg_economy_desc: "Le modèle bio-circulaire-vert transforme la biodiversité et la base agricole thaïes en bio-industrie à haute valeur. Biocarburants, biochimiques et aliments fonctionnels commencent à remplacer les cultures de commodité à faible marge qui tenaient la campagne pauvre."
 SIA_future_food: "Cuisine du monde 2.0"
 SIA_future_food_desc: "CP Foods et les géants alimentaires remontent la chaîne de valeur vers l'aliment fonctionnel et la protéine alternative. La Thaïlande cesse de vendre des calories brutes et commence à vendre la science qui y entre."
 SIA_durian_road: "La route du durian"
 SIA_durian_road_desc: "Les exportations de durian et de fruits tropicaux vers la Chine dépassent six milliards de dollars par an. Les camions de chaîne du froid portent la récolte vers le nord à travers le Laos tandis que le Vietnam et la Malaisie se battent pour les mêmes rayons à Canton."
 SIA_capital_of_capital: "Capitale du capital"
 SIA_capital_of_capital_desc: "La Bourse de Thaïlande s'approfondit, le fonds Vayupak grandit, et des conglomérats comme Gulf basculent de l'énergie vers le numérique et la finance. Bangkok commence à se comporter comme un centre financier régional plutôt qu'un lieu que le capital traverse seulement."
 SIA_make_thailand_investor: "Un exportateur de capitaux"
 SIA_make_thailand_investor_desc: "La Thaïlande passe de la réception d'argent étranger à l'envoi du sien à l'étranger. Central achète en Europe, CP cultive à travers le monde, et ThaiBev possède le propre géant des boissons de Singapour. La nation récipiendaire est devenue une nation investisseuse."
 SIA_escape_the_trap: "Un royaume aux revenus élevés"
 SIA_escape_the_trap_desc: "La Stratégie nationale paie et la Thaïlande franchit la ligne du statut de haut revenu. Le piège qui la tenait sous la frontière pendant une génération est enfin derrière elle, et l'atelier est devenu un royaume riche à part entière."
 SIA_fta_decade_tt: "Arme le réseau de diplomatie commerciale et signe les accords de libre-échange de la décennie."
 SIA_escape_trap_two_sectors_tt: "Exige deux des trois couronnements sectoriels. Centres de données, aliment du futur, ou la nation investisseuse."
 SIA_data_center_grid_strain_tt: "Le déploiement des hyperscalers tend le réseau. Investissez dans la branche électricité pour garder les lumières."
 SIA_sufficiency_and_the_crown: "Suffisance et Couronne"
 SIA_sufficiency_and_the_crown_desc: "King Bhumibol's Sufficiency Economy philosophy is born out of the ashes of the Tom Yum Kung crisis and becomes a guiding national principle. Moderation, self-immunity, and reasonableness before reckless growth. The palace and the planning ministry speak with one voice, and a village that lives within its means asks less of the state come the next shock."
 SIA_sufficiency_gov_gate_tt: "§Y[communist_state_L]§! or §Y[socialism_L]§! is not the ruling party."
 SIA_new_theory_agriculture: "La Nouvelle Théorie"
 SIA_new_theory_agriculture_desc: "The King's New Theory divides the farmer's plot into rice, orchard, pond, and homestead, a rounded holding that feeds the family sustainably before it sells goods in the markets. Isaan's rice belt takes up the model district by district, trading a little export volume for a farmer who never starves in a bad year."
 SIA_doi_tung_highlands: "Le modèle Doi Tung"
 SIA_doi_tung_highlands_desc: "Dans les collines au-dessus de Chiang Rai, le projet de la Princesse Mère arrache le pavot à opium du sol et y met café, macadamia et artisanat. L'ancienne culture de rente du Triangle d'or cède la place à une économie de hautes terres qui attire des visiteurs plutôt que des agents des stupéfiants, vallée par vallée."
 SIA_chaipattana_water: "L'aérateur Chaipattana"
 SIA_chaipattana_water_desc: "L'aérateur breveté du roi lui-même, une roue à palettes bon marché que n'importe quel étang de village peut s'offrir, se répand dans le bassin du Chao Phraya pour nettoyer l'eau encombrée d'algues et de déchets. C'est l'invention comme service royal, et les rizières de l'Isaan et du Sud s'écoulent un peu mieux pour cela."
 SIA_crown_property_portfolio: "Le Bureau des biens de la Couronne"
 SIA_crown_property_portfolio_desc: "Les avoirs du Bureau, de la terre sous les tours de la Siam Commercial Bank aux actions du Siam Cement Group, font de la Couronne l'un des plus grands propriétaires et actionnaires du royaume. Géré comme un conglomérat et taxé comme tel aussi, il gagne discrètement plus que la moitié des ministères auxquels il répond."
 SIA_deepen_sufficiency: "Le Royaume autosuffisant"
 SIA_deepen_sufficiency_desc: "La suffisance cesse d'être un filet rural et devient toute la stratégie. Chaînes d'approvisionnement locales, consommation modeste, et méfiance du capital étranger durcissent en doctrine. L'autarcie achète la résistance aux chocs, mais banquiers et conglomérats voient leurs cibles de croissance glisser et n'en sont pas ravis."
 SIA_pragmatic_balance: "La voie du milieu"
 SIA_pragmatic_balance_desc: "La suffisance n'a pas à signifier l'isolement. Les PME continuent de commercer vers l'extérieur tandis que le principe de suffisance tempère seulement les excès, une synthèse modérée plutôt qu'une retraite. Le plafond est plus bas que la pleine autosuffisance, mais le risque d'en avoir jamais besoin aussi."
 SIA_resilient_kingdom: "Le Royaume résilient"
 SIA_resilient_kingdom_desc: "Couronne et campagne, palais et rizière, sont tissés en un seul modèle de résilience. Quel que soit le prochain choc, contagion monétaire, pandémie ou rupture d'approvisionnement, le royaume qui vit selon ses moyens est celui qui tient encore debout quand il passe."
 SIA_sufficiency_resilience: "Économie de suffisance"
 SIA_sufficiency_resilience_desc: "Modération, auto-immunité et résilience locale, semées à travers l'économie rurale à l'initiative de la Couronne."
 SIA_sufficiency_resilience_2: "Économie de suffisance approfondie"
 SIA_sufficiency_resilience_2_desc: "L'autosuffisance, d'un filet de sécurité, est devenue doctrine : on échange davantage de croissance contre davantage de résistance aux chocs."
 SIA_resilient_kingdom_idea: "Le Royaume résilient"
 SIA_resilient_kingdom_idea_desc: "Le patronage de la Couronne et l'économie de suffisance fusionnés en un tampon national durable contre le prochain choc."
 SIA_tourism_masterplan: "Un plan directeur touristique"
 SIA_tourism_masterplan_desc: "Le tourisme soutient déjà l'économie, mais il repose sur l'improvisation : des stations avant les infrastructures, des hôtels avant une main-d'œuvre formée. Un plan directeur national fixe des objectifs régionaux, relie les ministères et traite l'hospitalité comme un secteur industriel comme les autres."
 SIA_phuket_andaman: "Perle de l'Andaman"
 SIA_phuket_andaman_desc: "Phuket attire déjà le monde sur ses plages, et une nouvelle aile d'aéroport et de meilleures routes permettent à l'île d'en absorber bien davantage. L'Andaman doit porter une part croissante des recettes en devises du pays, et ces étrangers de plus en plus nombreux refaçonnent le littoral où ils débarquent."
 SIA_pattaya_eastern_riviera: "La Riviera de l'Est"
 SIA_pattaya_eastern_riviera_desc: "Les hôtels et le strip nocturne de Pattaya reposent surtout sur une main-d'œuvre bon marché et informelle. Formaliser l'économie de bureau et de services le long du littoral oriental, et chaque travailleur passé sur les registres attend que l'État-providence tienne vraiment ses promesses."
 SIA_chiang_mai_lanna: "Rose du Nord"
 SIA_chiang_mai_lanna_desc: "Temples, collines et un rythme plus lent attirent déjà backpackers et nomades numériques vers le nord. Développer l'infrastructure touristique de Chiang Mai, et les foules suivent, avec des loyers qui chassent les quartiers que les visiteurs venaient voir."
 SIA_rebuild_the_andaman: "Après la vague"
 SIA_rebuild_the_andaman_desc: "Le tsunami du lendemain de Noël a ravagé la côte andamane, et les raccourcis de la reconstruction se voient encore. Une reconstruction correctement financée achève ce que l'urgence n'a pas pu, et clôt définitivement le compte de la catastrophe."
 SIA_medical_wellness_hub: "Scalpel de l'Asie"
 SIA_medical_wellness_hub_desc: "Des hôpitaux privés de classe mondiale soignent déjà des patients venus de toute la région. Étendre encore le tourisme chirurgical et de bien-être, et les cliniques thaïlandaises rivalisent directement avec le meilleur de Singapour à une fraction du prix, tandis que les patients nationaux attendent derrière les étrangers qui paient."
 SIA_volume_tourism: "La logique des chiffres"
 SIA_volume_tourism_desc: "Plus de vols, des forfaits moins chers, plus d'arrivées. Courir après le nombre brut de visiteurs, et les devises s'accumulent, mais plages et vieilles villes conçues pour une fraction de ce trafic plient, et ceux qui y vivent sentent la pression bien avant le bilan."
 SIA_high_value_tourism: "La qualité plutôt que la quantité"
 SIA_high_value_tourism_desc: "Moins de visiteurs qui dépensent bien davantage. Attirer le marché des resorts de luxe et des expériences boutique plutôt que les tours organisés, échanger le volume d'arrivées contre un tourisme qui paie de vrais impôts et survit intact au prochain retournement."
 SIA_tourism_capital: "La destination favorite du monde"
 SIA_tourism_capital_desc: "De la street food de Bangkok aux plages de Phuket et aux temples de Chiang Mai, la Thaïlande devient le cas d'école du développement par le tourisme. Le ministère du Tourisme passe des campagnes de marketing à une politique industrielle permanente, avec les décisions qui vont avec."
 SIA_tourism_boom: "Boom du tourisme"
 SIA_tourism_boom_desc: "Une vague d'arrivées remplit hôtels et aéroports. La poussée s'estompe dès que la saison tourne."
 SIA_host_major_international_event: "Accueillir un grand événement international"
 SIA_host_major_international_event_desc: "Candidater pour un sommet, une expo mondiale ou un championnat sportif majeur, et placer la Thaïlande sur tous les écrans de la planète pendant une semaine. La facture est réelle, mais la publicité gratuite aussi."
 SIA_new_resort_zone: "Ouvrir une nouvelle zone de villégiature"
 SIA_new_resort_zone_desc: "Zoner et autoriser un nouveau tronçon de côte ou de campagne pour le développement hôtelier, détournant l'investissement excédentaire des littoraux déjà saturés."
 SIA_global_amazing_thailand_campaign: "Campagne mondiale « Thaïlande incroyable »"
 SIA_global_amazing_thailand_campaign_desc: "Relancer le slogan phare de l'office du tourisme avec une nouvelle vague de publicité à l'étranger, de salons du voyage et d'influenceurs payés pour avoir l'air de vivre le plus beau moment de leur vie."
 SIA_baht_and_bourse: "Le baht et la Bourse"
 SIA_baht_and_bourse_desc: "Les banques de Bangkok et la Bourse de Thaïlande ont largement dépassé les prêteurs des shophouses d'une époque antérieure, mais les marchés de capitaux restent plus minces et plus informels que ceux des voisins avec lesquels la Thaïlande rivalise. Une poussée coordonnée élargit qui peut lever de l'argent et qui peut le prêter, au prix de livrer ce pool croissant à qui sait le plus vite travailler les régulateurs."
 SIA_tamc_workout: "La Société de gestion d'actifs"
 SIA_tamc_workout_desc: "La Thai Asset Management Corporation a été créée en 2001 pour avaler les créances douteuses laissées par le krach de 1997, et depuis deux décennies elle a lentement vendu ce qu'elle pouvait et passé par pertes et profits le reste. Clore définitivement les livres du fonds libère le capital encore enfermé, à condition de reconnaître enfin les pertes encore au bilan plutôt que de les reporter une année de plus."
 SIA_consumer_credit_boom: "Du crédit pour la base"
 SIA_consumer_credit_boom_desc: "Cartes de crédit, prêts personnels et plans d'échelonnement se répandent des centres commerciaux de Bangkok vers les provinces, permettant aux ménages ordinaires de dépenser aujourd'hui contre la paie de demain. La consommation grimpe et les recettes de l'État suivent, mais une population saturée de nouveau crédit à la consommation apprend vite à attendre que l'État la rattrape quand les échéances arrivent."
 SIA_responsible_lending: "Discipline macroprudentielle"
 SIA_responsible_lending_desc: "La Banque de Thaïlande resserre les plafonds loan-to-value et les normes de crédit sur les marchés hypothécaires et de consommation, choisissant une expansion plus lente et plus solide plutôt qu'une expansion rapide. Les banques restent solvables et les ménages dans leurs moyens, mais le crédit facile qui alimente un boom de consommation n'a jamais la chance de circuler."
 SIA_deepen_the_set: "Approfondir la Bourse"
 SIA_deepen_the_set_desc: "Davantages de sociétés s'introduisent à la Bourse de Thaïlande, des gérants de portefeuille étrangers ouvrent de nouvelles lignes sur les actions thaïlandaises, et le marché gagne en profondeur et en liquidité. Une Bourse plus grande et plus interconnectée signifie aussi un choc plus grand le jour où les comptes audités d'un conglomérat coté valent moins que le papier sur lequel ils sont imprimés."
 SIA_vayupak_stabilization: "Le fonds Vayupak"
 SIA_vayupak_stabilization_desc: "Le fonds Vayupak, adossé à l'État, se tient prêt à acheter quand l'indice chute trop loin et trop vite, offrant un plancher aux investisseurs particuliers lors de la prochaine panique. Soutenir les cours avec l'argent du Trésor n'est pas la même chose que faire croître l'économie derrière eux, et la facture des interventions sort du même budget que tout le reste."
 SIA_bank_consolidation: "La question Krungsri"
 SIA_bank_consolidation_desc: "La MUFG japonaise détient une participation de contrôle dans la Bank of Ayudhya, un signe parmi d'autres que le secteur bancaire thaïlandais se concentre autour d'une poignée de grands survivants, souvent ancrés à l'étranger. Des bilans plus gros absorbent de plus gros chocs, mais les petits et moyens prêteurs qui servaient autrefois les petits et moyens emprunteurs disparaissent dans le réseau d'agences de quelqu'un d'autre."
 SIA_financial_center: "Un centre financier avancé"
 SIA_financial_center_desc: "Bangkok se positionne comme un hub financier régional à part entière, un rival de Singapour et de Hong Kong plutôt qu'un marché qui ne fait que les alimenter. Marchés de capitaux profonds, Bourse stabilisée et secteur bancaire consolidé convergent en un centre capable de tarifer le risque et de lever des capitaux pour toute la région, pas seulement pour la Thaïlande."
 SIA_financial_center_idea: "Un centre financier avancé"
 SIA_financial_center_idea_desc: "Des marchés de capitaux profonds, une Bourse stabilisée et un secteur bancaire consolidé donnent à la Thaïlande un centre financier qui tarife le risque et lève des capitaux pour toute la région, pas seulement pour elle-même."
 SIA_the_ground_beneath: "Le sol sous nos pieds"
 SIA_the_ground_beneath_desc: "Un levé géologique national vise à cataloguer ce qui se trouve réellement sous le sol du Royaume et le plateau continental, des gisements de potasse du Nord-Est aux bassins gaziers du golfe. Savoir ce qu'il y a en bas est la partie facile. Décider avec quelle intensité extraire, et qui paie quand ça tourne mal, vient ensuite."
 SIA_extractive_drive: "Creuse, bébé, creuse"
 SIA_extractive_drive_desc: "Les permis avancent vite et le secteur des ressources a ordre de produire au volume maximal avec un minimum de délai. Les recettes d'exportation grimpent et le lobby des combustibles fossiles obtient tout ce qu'il demandait, mais chaque mine et chaque puits a désormais besoin de plus de mains que le précédent, et les agriculteurs dont les terres et l'eau sont les plus proches des forages sont les premiers à s'en apercevoir."
 SIA_stewarded_extraction: "Extraire pour la nation"
 SIA_stewarded_extraction_desc: "L'extraction se fait aux conditions de l'État plutôt qu'à celles du marché : permis plus lents, véritable examen environnemental, et une empreinte plus petite par concession. Le sol cède moins que sous une main plus libre, mais les agriculteurs et propriétaires riverains des fosses et têtes de puits ne sont pas traités comme des dommages collatéraux."
 SIA_udon_potash: "La potasse d'Isan"
 SIA_udon_potash_desc: "Les vastes gisements de potasse d'Isan, parmi les plus grands du monde et largement intacts, entrent enfin en production. Nouveaux puits et usines de traitement promettent une industrie nationale d'engrais, mais les limites des concessions traversent droit les terres que petits exploitants et coopératives rizicoles cultivent depuis des générations."
 SIA_chatree_gold_tin: "Or, étain et gypse"
 SIA_chatree_gold_tin_desc: "Le complexe de Chatree et ses voisins extraient or, étain et gypse des plaines centrales, un secteur minier réel sinon glamour, aux côtés du négoce de gemmes dont Bangkok est déjà célèbre. Les villages en aval des bassins de résidus surveillent de près, et de plus en plus bruyamment, ce qui s'infiltre dans la nappe."
 SIA_gulf_gas_oca: "La zone de revendications chevauchantes"
 SIA_gulf_gas_oca_desc: "La Thaïlande et le Cambodge ont laissé un tronçon du golfe riche en gaz inexploité pendant des décennies plutôt que de trancher à qui il appartient. Avancer unilatéralement dans la zone de revendications chevauchantes signifie un forage de frontière très capitalistique bien avant qu'un seul mètre cube n'arrive à terre, et un voisin qui n'a rien accepté."
 SIA_resource_sovereignty: "Souveraineté des ressources"
 SIA_resource_sovereignty_desc: "Potasse, métaux de base et gaz convergent en un secteur des ressources qui répond à Bangkok plutôt qu'à l'acheteur du trimestre. Ce qui n'était qu'une histoire de concessions vendues au détail devient un Royaume qui n'a plus à demander la permission pour ce qui sort de son propre sol."
 SIA_resource_sovereignty_2of3_tt: "A achevé au moins 2 des 3 projets de ressources"
 SIA_the_digital_consumer: "Le consommateur numérique"
 SIA_the_digital_consumer_desc: "Les Thaïlandais bancarisent, achètent et réservent de plus en plus en ligne plutôt qu'à un guichet. Agoda, la plateforme de réservation née d'un petit bureau à Phuket, montre qu'une entreprise numérique locale peut rivaliser avec n'importe qui. Construire les rails, la confiance et l'assiette fiscale sous ce basculement est désormais un projet national."
 SIA_promptpay_rails: "InvitePayer"
 SIA_promptpay_rails_desc: "PromptPay fait circuler l'argent entre numéros de téléphone et numéros d'identité nationale en quelques secondes, sans agence bancaire ni frais de virement. Formaliser autant de transactions tire une part de l'économie cash à la lumière, et les intermédiaires qui profitaient de cette opacité s'en aperçoivent tout de suite."
 SIA_super_app_economy: "La super-app"
 SIA_super_app_economy_desc: "Grab, LINE MAN et leurs rivaux plient VTC, livraison de repas et courses dans une seule application que chaque Thaïlandais a déjà ouverte. Les gains d'efficacité sont réels, mais aussi l'absence de tout contrat, prestation ou siège à une table de négociation pour les chauffeurs et livreurs qui font tourner les apps."
 SIA_ecommerce_marketplaces: "Embarquer les PME"
 SIA_ecommerce_marketplaces_desc: "Lazada et Shopee offrent aux petits fabricants et aux vendeurs de marché une vitrine qui atteint des clients bien au-delà de leur province, et souvent au-delà des frontières thaïlandaises. Entrepôts et flottes de livraison doivent suivre, et les construire d'abord entame ce que les places de marché sont censées rapporter."
 SIA_national_digital_champions: "Deux groupes, un marché"
 SIA_national_digital_champions_desc: "Plutôt que d'arbitrer un concours ouvert, l'État appuie un petit nombre de plateformes nationales et les laisse consolider le marché. Un secteur numérique concentré est efficace à taxer et facile à réguler, mais un marché sans vrai rival n'a guère de raison de garder des prix honnêtes."
 SIA_open_digital_market: "Briser le duopole"
 SIA_open_digital_market_desc: "Les règles antitrust et les exigences de portabilité des données permettent aux plus petites plateformes de concurrencer plutôt que de laisser les deux plus grandes applications se partager le marché. Les consommateurs gardent le bénéfice d'une vraie concurrence, au prix des recettes fiscales nettes qu'un champion national aurait livrées."
 SIA_the_outward_turn: "Le virage vers l'extérieur"
 SIA_the_outward_turn_desc: "Pendant des décennies, le capital thaïlandais n'a circulé que dans un sens, vers des usines et des hôtels bâtis pour les étrangers. Une autre génération de conglomérats cherche désormais sa croissance à l'étranger, achetant des parts et construisant des usines dans une région qui n'était que cliente de la Thaïlande, pas sa cible."
 SIA_leveraged_expansion: "Acheter le monde"
 SIA_leveraged_expansion_desc: "Emprunter sur un bilan solide et faire du shopping à l'étranger à toute vitesse. Les acquisitions financées par la dette gonflent le portefeuille vite, mais chaque actif acheté à crédit est un actif qui peut tout aussi vite se retrouver sous l'eau."
 SIA_organic_expansion: "Faire croître ce que nous possédons"
 SIA_organic_expansion_desc: "Plutôt qu'emprunter pour acheter, étendre ce que les conglomérats thaïlandais contrôlent déjà : plus d'agences, plus de capacité, plus de marchés, financés par leurs propres bénéfices. C'est plus lent et ça ne fait jamais la une d'un magazine de deals, mais rien d'acquis de cette façon n'a besoin d'être revendu dans l'urgence."
 SIA_cp_into_china: "Certificat 0001"
 SIA_cp_into_china_desc: "En 1990, Charoen Pokphand est devenu le premier investisseur étranger à acheter une part à la Bourse de Shanghai rouverte, certificat numéro 0001. Trois décennies plus tard, le livre chinois de CP va de Ping An Insurance aux usines d'aliments pour bétail d'un bout à l'autre du pays, un pari qui n'a jamais cessé de payer même en vidant une partie de ce que CP faisait pousser autrefois au pays."
 SIA_thaibev_conquers_asean: "L'empire du baron de la bière"
 SIA_thaibev_conquers_asean_desc: "Le véhicule Vietnam Beverage de ThaiBev prend le contrôle de Saigon Beer en 2017 pour près de cinq milliards de dollars, puis intègre l'empire singapourien de boissons et d'immobilier de Fraser and Neave dans la même écurie. Un seul conglomérat thaïlandais possède désormais une part significative de ce que boit le reste de la région."
 SIA_scg_long_son: "Long fils se lève"
 SIA_scg_long_son_desc: "Le complexe pétrochimique du Siam Cement Group sur la péninsule de Long Son au Vietnam craque le naphta en matières premières plastiques que ses usines thaïlandaises ont toujours dû importer. Bâtie à l'étranger, la capacité rentre au pays comme une chaîne d'approvisionnement moins chère et plus stable, une fois le béton enfin pris."
 SIA_central_minor_abroad: "Malls et chambres à l'étranger"
 SIA_central_minor_abroad_desc: "Central Group prend des parts dans Selfridges, KaDeWe et Illum via le Signa Group autrichien, tandis que les marques hôtelières de Minor International s'étendent de Bangkok aux Maldives jusqu'à Lisbonne. L'argent thaïlandais du commerce et de l'hospitalité possède désormais des vitrines et des halls d'hôtel où ses propres clients n'ont jamais mis les pieds."
 SIA_ptt_banpu_resources: "Forer le monde"
 SIA_ptt_banpu_resources_desc: "Les champs amont de PTTEP s'étendent d'Oman au Mozambique jusqu'aux eaux partagées avec la Malaisie, et les concessions charbonnières de Banpu traversent l'Australie et l'Indonésie. La Thaïlande sécurise des ressources qu'elle n'a pas chez elle, liées au même cycle des matières premières qu'une mine nationale."
 SIA_outbound_statecraft: "L'investissement comme instrument d'État"
 SIA_outbound_statecraft_desc: "Les deals cessent d'être des paris séparés et deviennent une posture nationale unique, le capital thaïlandais servant d'outil de politique étrangère autant que de profit. Un bureau dédié gère désormais le pipeline d'acquisitions, et les conseils d'administration de la moitié de l'ASEAN répondent, en partie, à Bangkok."
 SIA_outbound_statecraft_3of5_tt: "A achevé au moins 3 des 5 deals d'expansion à l'étranger"
 SIA_thai_multinationals: "Multinationales thaïlandaises"
 SIA_thai_multinationals_desc: "Les firmes thaïlandaises dépassent le marché intérieur et se comportent comme les multinationales qu'elles ne faisaient que servir. La portée à l'étranger est réelle, mais chaque baht et chaque heure de dirigeant envoyés outre-mer n'est pas investi à construire au pays."
 SIA_overseas_deal_boom: "Boom des transactions à l’étranger"
 SIA_overseas_deal_boom_desc: "Une autre acquisition est close, et les profits d'au-delà des frontières thaïlandaises refluent vers le pipeline qui l'a close."
 SIA_overseas_acquisitions_category: "Acquisitions à l'étranger"
 SIA_overseas_acquisitions_category_desc: "Les conglomérats thaïlandais continuent de shopper à l'étranger. Repérer la prochaine cible, closer le deal, ou emmener tout le portefeuille en tournée mondiale, Trésor permettant."
 SIA_scout_overseas_targets: "Rechercher des cibles à l'étranger"
 SIA_scout_overseas_targets_desc: "Envoyer les équipes de deals visiter les étages de la prochaine acquisition avant que quiconque ne signe. Une lecture courte et modeste de là où le capital thaïlandais devrait atterrir ensuite."
 SIA_close_the_deal: "Clore le deal"
 SIA_close_the_deal_desc: "Signer les papiers de la prochaine participation, filiale ou concession permanente. L'argent qui quitte le Trésor est réel, pour un actif qui n'a pas encore prouvé qu'il valait le prix."
 SIA_global_ma_roadshow: "Roadshow mondial sur les fusions et acquisitions"
 SIA_global_ma_roadshow_desc: "Envoyer les dealmakers des conglomérats en circuit à Singapour, Hong Kong et Londres, vendant le capital thaïlandais aux banquiers comme aux conseils cibles. La publicité seule fait monter la prochaine vague de deals."
 thailand.1.t: "Les élections générales de 2001"
 thailand.1.d: "Le 6 janvier 2001, les Thaïlandais votent aux premières élections générales sous la Constitution du peuple. Trois forces se disputent le scrutin. La plateforme de Thai Rak Thai — fonds villageois, moratoires de dettes et santé universelle — a électrisé les campagnes. Le réseau palatial et ses alliés dans les bases militaires préfèrent tenir en lisière ceux qui gouvernent. Les démocrates sortants promettent des mains stables, sans éclat. Où nous mettons notre poids maintenant façonnera le choix du pays."
 thailand.1.a: "Soutenir Thai Rak Thai et le raz-de-marée rural."
 thailand.1.b: "Rassembler le réseau palatial et les généraux."
 thailand.1.c: "Maintenir les démocrates au pouvoir."
 thailand.2.t: "Un gouvernement de PDG"
 thailand.2.d: "Le nouveau gouvernement entre en fonctions en promettant de diriger la Thaïlande comme une entreprise qui réussit. Des hommes d'affaires remplissent le cabinet, les ministères reçoivent des objectifs de performance, et la politique avance à une vitesse que la bureaucratie n'a jamais connue."
 thailand.2.a: "La Thaïlande est ouverte aux affaires."
 thailand.3.t: "La guerre contre la drogue"
 thailand.3.d: "En février 2003, le gouvernement déclare une campagne de trois mois pour éradiquer le trafic de méthamphétamine. Des listes noires provinciales sont dressées et des quotas fixés. À son terme, des organisations de droits humains documentent 2 800 meurtres, souvent jamais enquêtés comme il faut. La campagne est populaire dans les médias mais condamnée à l'étranger."
 thailand.3.a: "Pousser la campagne sans retenue."
 thailand.3.b: "Remontez-le tranquillement."
 thailand.4.t: "Le coup de septembre"
 thailand.4.d: "Le 19 septembre 2006, le Premier ministre est à New York pour l'Assemblée générale de l'ONU. Pendant ce temps, des chars déambulent dans Bangkok, la constitution est abrogée, et le Conseil pour la réforme démocratique annonce avoir pris pacifiquement le contrôle du gouvernement. Les foules apportent des fleurs aux soldats tandis que la majorité rurale observe en silence."
 thailand.4.a: "Laisser l'armée assumer sa responsabilité."
 thailand.4.b: "Installer un gouvernement-façade civil."
 thailand.5.t: "Dissolution judiciaire"
 thailand.5.d: "La Cour constitutionnelle pèse une affaire de fraude électorale contre le plus grand parti d'opposition. Une dissolution interdirait son bureau exécutif de la politique pour cinq ans, décapitant le mouvement sans qu'un seul soldat quitte les casernes."
 thailand.5.a: "Dissoudre le parti."
 thailand.5.b: "Laisser la menace peser sur eux."
 thailand.6.t: "Le NCPO prend le pouvoir"
 thailand.6.d: "Le 22 mai 2014, après des mois de manifestations et deux jours de loi martiale déclarée, le chef de l'armée convoque les factions rivales au club de l'armée et les arrête dans la salle de conférence. Le chef de l'armée annonce que le Conseil national pour la paix et l'ordre prendra le contrôle du gouvernement. Il n'y aura pas de calendrier fixe d'élections tant que les institutions démocratiques ne seront pas stables."
 thailand.6.a: "L'ordre est rétabli."
 thailand.7.t: "Les Chemises rouges prennent la place"
 thailand.7.d: "Le Front uni pour la démocratie contre la dictature inonde le cœur commercial de Bangkok, exigeant la démission du gouvernement et de nouvelles élections. Des barricades s'élèvent à Ratchaprasong et pneus et immeubles brûlent à travers la ville. Les caméras du monde regardent ce que l'armée fera ensuite."
 thailand.7.a: "Nettoyer la place."
 thailand.7.b: "Negotiate and wait."
 thailand.8.t: "La saisie de l'aéroport"
 thailand.8.d: "En novembre 2008, des manifestants chemises jaunes occupent les aéroports de Suvarnabhumi et Don Mueang, bloquant 300 000 voyageurs et gelant le commerce aérien du pays. Le siège ne s'achève que lorsqu'un arrêt de justice fait tomber le gouvernement qu'ils combattent."
 thailand.8.a: "Measure the cost."
 thailand.9.t: "Les trois revendications"
 thailand.9.d: "Des foules menées par des étudiants, plus grandes que toute autre depuis 1992, articulent trois exigences. Dissoudre le parlement, cesser d'intimider les critiques, et écrire une nouvelle constitution. Depuis une scène à Bangkok, des tabous qui gouvernaient la parole publique thaïlandaise depuis des générations sont brisés en une seule soirée."
 thailand.9.a: "Soutenir les trois exigences."
 thailand.9.b: "Ne pousser que ce que le parlement votera."
 thailand.10.t: "L'article 112 en séance"
 thailand.10.d: "Un projet de loi pour amender la loi de lèse-majesté arrive au parlement. Il limite qui peut porter plainte, plafonne les peines et met fin à son usage contre le discours politique. Aucune législature thaïlandaise n'a jamais osé un vote enregistré sur cette question. Chaque institution de l'ancien ordre est désormais en mouvement."
 thailand.10.a: "Mettre aux voix."
 thailand.11.t: "Crise de dissolution"
 thailand.11.d: "La Cour constitutionnelle juge la campagne d'amendement une tentative de renverser le régime démocratique avec le roi comme chef de l'État. Le parti est dissous, ses dirigeants interdits. Le mouvement doit recommencer sous un nouveau nom, avec les mêmes gens, comme toujours."
 thailand.11.a: "Nous enregistrerons un nouveau parti d'ici vendredi."
 thailand.12.t: "L'establishment contre-attaque"
 thailand.12.d: "Des unités de l'armée se déplacent dans la capitale sans ordres du gouvernement. L'ancien ordre a décidé que l'expérience était allée assez loin. Ce qui se passe dans les six prochaines heures décide si l'ère des réformes continue, ou rejoint la longue liste des démocraties thaïlandaises interrompues."
 thailand.12.a: "Appeler le peuple dans les rues."
 thailand.12.b: "Reculer pour sauver le mouvement."
 thailand.13.t: "La question républicaine"
 thailand.13.d: "Le gouvernement programme un référendum sur la forme constitutionnelle de l'État lui-même, la question qu'aucun gouvernement thaïlandais n'a jamais posée au peuple. Quel que soit le résultat, plus rien du Royaume ne sera pareil."
 thailand.13.a: "Le soumettre au peuple."
 thailand.13.b: "Retirer le référendum."
 thailand.14.t: "Un nouveau règne"
 thailand.14.d: "Le 13 octobre 2016, le Bureau de la Maison royale annonce la mort de Sa Majesté le roi Bhumibol Adulyadej, Rama IX, après soixante-dix ans sur le trône, le plus long règne de l'histoire thaïlandaise. Le prince héritier monte comme roi Maha Vajiralongkorn, Rama X. Comment le gouvernement marque la transition, et à quelle vitesse il passe à autre chose, est désormais la décision de Bangkok."
 thailand.14.a: "Affirmer ouvertement le nouveau règne."
 thailand.14.b: "Laisser les rites suivre leur cours."
 thailand.14.c: "Équilibrer cérémonie et continuité."
 thailand.15.t: "La dynastie continue"
 thailand.15.d: "Le fondateur du mouvement ne peut plus le diriger en personne, mais le nom conserve son emprise sur l'électorat. La question devant le parti est de savoir qui le portera à la prochaine élection."
 thailand.15.a: "Yingluck Shinawatra mène le ticket."
 thailand.15.b: "Srettha Thavisin mène le ticket, un magnat de l'immobilier pour l'aile affaires."
 thailand.15.c: "Paetongtarn Shinawatra mène le ticket, et le nom perdure dans une nouvelle génération."
 thailand.15.e: "Mettre la machine au-dessus du nom."
 thailand.16.t: "Thaksin pour toujours"
 thailand.16.d: "Le congrès annuel du parti vote l'abolition des limites de mandats internes et accorde à la direction l'autorité d'urgence sur la sélection des candidats, la liste du parti et la politique de coalition. Les bancs de l'opposition sont vides de quiconque compte. Les élections continueront d'être tenues, et continueront d'être gagnées."
 thailand.16.a: "Un leader, un parti, une Thaïlande."
 thailand.17.t: "Restauration du trône"
 thailand.17.d: "Le parlement, le Conseil privé et les forces armées pétitionnent conjointement le palais pour qu'il assume la tutelle directe des institutions de l'État. La fiction constitutionnelle du siècle passé est retirée. La dynastie Chakri reprend le rôle qu'elle tenait avant 1932."
 thailand.17.a: "Vive le roi."
 thailand.18.t: "Le système de 2017"
 thailand.18.d: "La nouvelle constitution passe son référendum sous des restrictions de campagne qui faisaient de l'opposition une infraction pénale. Un Sénat entièrement nommé aidera à choisir les futurs Premiers ministres, et une Stratégie nationale de vingt ans lie chaque gouvernement futur. Les élections reprendront, mais à l'intérieur de la clôture."
 thailand.18.a: "Ce sera une démocratie dirigée."
 thailand.19.t: "Le Royaume va aux urnes"
 thailand.19.d: "Les bureaux de vote s'ouvrent dans les soixante-seize provinces le 6 janvier 2001. C'est le premier scrutin tenu sous la Constitution du peuple, dépouillé par une commission indépendante plutôt que par le ministère de l'Intérieur, et le premier où un parti gagnant nettement pourrait gouverner sans des mois de marchandage de coalition."
 thailand.19.a: "Que le dépouillement commence."
 thailand.20.t: "Le tribunal dissout le parti"
 thailand.20.d: "Le Tribunal constitutionnel juge que le parti au pouvoir a payé de plus petits partis pour présenter des candidats à l'élection annulée, et ordonne sa dissolution. Cent onze de ses dirigeants sont interdits de politique pour cinq ans. Le verdict retire le nom du parti, son enregistrement et sa direction, et ne touche aucun de ses électeurs. En quelques semaines, les mêmes députés déposent les papiers d'un nouvel enregistrement sous une nouvelle bannière, et la machine du Nord-Est n'a pas perdu un seul district."
 thailand.20.a: "Réenregistrer proprement, sous une nouvelle direction."
 thailand.20.b: "Les dirigeants interdits continueront de la diriger de l'extérieur."
 thailand.21.t: "La Cour vide l'hémicycle"
 thailand.21.d: "Une deuxième dissolution, et celle-ci emporte le parti au pouvoir. L'arrêt frappe aussi l'ancien bloc national-conservateur, dont les chefs de factions provinciales tiennent désormais l'arithmétique de la chambre et sont courtisés des deux côtés. Leur chef est interdit mais pas réduit au silence, et il négocie depuis une maison à Buriram. Si ses membres partent, l'opposition forme un gouvernement sans élection. S'ils peuvent être retenus, la coalition survit, et chacun saura exactement ce que cela a coûté."
 thailand.21.a: "Les laisser partir, et laisser les démocrates essayer de gouverner."
 thailand.21.b: "Aligner l'offre sur ce qu'on leur a promis."
 SIA_bench_hands_power_to_democrats_tt: "La chambre se réunit avec le §YParti démocrate§! au gouvernement."
 thailand.50.t: "Sortir de la crise Tom Yum Kung"
 thailand.50.d: "Trois ans après la rupture du baht, l'économie croît de nouveau. Les usines du littoral oriental réembauchent, et le programme du FMI commencé dans l'humiliation est en avance sur le calendrier."
 thailand.50.a: "Le pire est derrière nous."
 thailand.51.t: "Le FMI s'en va"
 thailand.51.d: "En juillet 2003, la Thaïlande rembourse le dernier versement de ses obligations envers le FMI avec deux ans d'avance. Le Premier ministre marque l'occasion par une allocution télévisée déclarant l'indépendance économique du pays rétablie."
 thailand.51.a: "Jamais plus."
 thailand.52.t: "Le tsunami du lendemain de Noël"
 thailand.52.d: "Le 26 décembre 2004, un séisme sous-marin au large de Sumatra envoie un tsunami sur la côte andamane de Thaïlande. Khao Lak et Phuket sont dévastés, et plus de 5 000 personnes en Thaïlande sont tuées, dont de nombreux touristes étrangers. Le monde regarde la réponse."
 thailand.52.a: "Ne rien épargner dans les secours."
 thailand.52.b: "Une réponse minime."
 thailand.53.t: "La grande inondation"
 thailand.53.d: "Les eaux de mousson descendant le bassin du Chao Phraya inondent les deux tiers des provinces du pays et lèchent les zones industrielles au nord de Bangkok. La production mondiale de disques durs s'arrête dans des usines thaïlandaises inondées. La capitale dresse des murs de sacs de sable et attend."
 thailand.53.a: "Mobilisez tout."
 thailand.53.b: "Protéger Bangkok et laisser les provinces se vider."
 thailand.54.t: "Le programme de nantissement du riz"
 thailand.54.d: "Le gouvernement propose d'acheter toute la récolte de riz à une fois et demie le prix du marché, transférant des milliards aux ménages agricoles et pariant que les cours mondiaux suivront. Les économistes préviennent que les entrepôts se rempliront et que les pertes seront historiques. Les agriculteurs qui nous ont élus attendent."
 thailand.54.a: "Mettez en gage chaque grain."
 thailand.54.b: "Enterrer discrètement le programme."
 thailand.55.t: "Détroit de l'Asie"
 thailand.55.d: "La production automobile franchit le million d'unités. La Thaïlande est désormais le plus grand constructeur automobile d'Asie du Sud-Est et le premier producteur mondial de pick-up d'une tonne."
 thailand.55.a: "Courtiser Toyota et Honda et ouvrir les portes."
 thailand.56.t: "Année de visite en Thaïlande"
 thailand.56.d: "Bangkok est l'une des villes les plus visitées au monde. De Khao San Road à Karon Beach, le Royaume accueille le monde, et les dépenses touristiques remplissent les poches de millions de Thaïlandais."
 thailand.56.a: "Sawasdee."
 thailand.56.b: "Investir dans l'industrie elle-même."
 thailand.57.t: "La question des sous-marins"
 thailand.57.d: "Le contrat de la marine pour des sous-marins chinois S26T est devenu un débat national. Sont-ce les premiers bateaux d'une flotte à deux océans, ou des milliards dépensés pour des moteurs que le fournisseur ne peut livrer ? La décision d'achat atterrit sur le bureau du gouvernement."
 thailand.57.a: "Acheter les bateaux."
 thailand.57.b: "Annuler le programme."
 thailand.100.t: "Les territoires perdus"
 thailand.100.d: "Les médias d'État ressuscitent les vieilles cartes. Les provinces cédées à la France en 1893, 1904 et 1907, les sultanats cédés à la Grande-Bretagne en 1909. Le récit d'humiliation nationale de l'ère Phibun revient dans les manuels, et un mouvement qu'aucun gouvernement n'a invoqué depuis 1945 s'agite de nouveau."
 thailand.100.a: "Ce qui a été pris peut être rendu."
 thailand.101.t: "Frères de l'autre rive de la Salouen"
 thailand.101.d: "Bangkok déclare formellement son intérêt pour le sort des Tai Yai de l'État Shan, parents des Thaïlandais par la langue et le sang, en guerre contre la junte birmane depuis des générations. La déclaration s'arrête juste avant une revendication territoriale. Personne dans la région n'en méprend le sens."
 thailand.101.a: "Les Tai sont un seul peuple."
 thailand.102.t: "Le Mékong est un fleuve thaïlandais"
 thailand.102.d: "Le gouvernement répudie formellement les traités franco-siamois de 1893 et 1904 comme des instruments signés sous la contrainte. La revendication immédiate couvre Champasak, mais des voix au parti au pouvoir demandent pourquoi s'arrêter aux provinces que la France a eu l'occasion de cartographier."
 thailand.102.a: "Revendiquer les territoires de 1904."
 thailand.102.b: "Revendiquer tout le Laos comme terre taï."
 thailand.103.t: "L'impasse de Preah Vihéar"
 thailand.103.d: "Des échanges d'artillerie autour du temple perché, les pires depuis 2011, donnent à Bangkok son prétexte. Le gouvernement annonce qu'il ne reconnaît plus l'arrêt de la CIJ de 1962 et affirme des revendications sur Battambang et Siem Reap, provinces siamoises de mémoire d'homme."
 thailand.103.a: "Affirmer les revendications."
 thailand.103.b: "Revendications, et un ultimatum."
 thailand.104.t: "Dénoncer 1909"
 thailand.104.d: "Le ministère des Affaires étrangères dénonce formellement le traité anglo-siamois de 1909, par lequel les tributaires malais de Bangkok furent transférés à l'Empire britannique. Kelantan et Terengganu sont nommés directement. Kuala Lumpur rappelle son ambassadeur dans l'heure."
 thailand.104.a: "Revendiquer Kelantan et Terengganu."
 thailand.104.b: "Exiger chaque sultanat cédé."
 thailand.105.t: "Suwannaphum"
 thailand.105.d: "La Terre d'or des chroniques, le monde tai rassemblé sous un seul drapeau. Le gouvernement proclame le programme d'unification achevé en principe. Il reste à rendre les territoires recouvrés thaïlandais dans l'administration autant que dans le nom."
 thailand.105.a: "Lever un seul drapeau de la Salouen à la mer."
 thailand.105.b: "Faire pause. Laisser d'abord l'armée consolider."
 thailand.106.t: "Intégration des terres shan"
 thailand.106.d: "Administration, scolarité et infrastructures thaïlandaises atteignent le plateau shan. La commission d'intégration rapporte que les nouvelles provinces sont prêtes à l'incorporation pleine au Royaume."
 thailand.106.a: "Bienvenue à la maison."
 thailand.107.t: "Intégration des terres lao"
 thailand.107.d: "Les provinces du Mékong achèvent leur intégration administrative. Le fleuve n'est plus une frontière."
 thailand.107.a: "Bienvenue à la maison."
 thailand.108.t: "Intégration des provinces khmères"
 thailand.108.d: "Battambang et Siem Reap, Phra Tabong et Siemmarat dans les anciens gazetiers, reviennent à l'administration thaïlandaise pour la première fois depuis 1946."
 thailand.108.a: "Bienvenue à la maison."
 thailand.109.t: "Intégration des provinces du Sud"
 thailand.109.d: "Les anciens sultanats achèvent leur incorporation. Un siècle d'administration britannique puis malaisienne s'achève. Ce qui commence, c'est la tâche plus dure de le faire fonctionner."
 thailand.109.a: "Bienvenue à la maison."
 thailand.110.t: "Le monde réagit"
 thailand.110.d: "Sessions d'urgence dans chaque capitale voisine. Le principe fondateur de l'ASEAN, l'inviolabilité des frontières de l'ère coloniale, a été répudié par un membre fondateur. Ambassades rappelées, exercices suspendus, et de vieux amis commencent à décrire la Thaïlande avec un vocabulaire nouveau."
 thailand.110.a: "Ils s'ajusteront."
 thailand.150.t: "Le feu dans le Sud"
 thailand.150.d: "Le 4 janvier 2004, des militants attaquent un dépôt de l'armée à Narathiwat, tuant des soldats et saisissant des centaines d'armes. Des incendies coordonnés suivent dans les provinces malaise-musulmanes du Deep South. Une insurrection séparatiste dormante depuis deux décennies est de retour."
 thailand.150.a: "Le Sud nous mettra à l'épreuve."
 thailand.151.t: "Incident dans le Deep South"
 thailand.151.d: "Another week, another roadside bomb, another checkpoint shooting in Yala, Pattani or Narathiwat. The conflict grinds on at a tempo Bangkok has learned to ignore, while the South is left to accept its new reality of violence."
 thailand.151.a: "Endurer."
 thailand.152.t: "La main lourde"
 thailand.152.d: "Une opération de sécurité dans le Deep South s'achève avec des détenus morts et l'armée défendant ses méthodes. Des enquêtes sont promises, mais les poursuites ne suivent pas. De l'autre côté de la frontière et du monde musulman, les images font leur travail contre nous."
 thailand.152.a: "L'ordre a son prix."
 thailand.153.t: "Pourparlers à Kuala Lumpur"
 thailand.153.d: "Des responsables thaïlandais s'assoient face à des représentants du BRN à une table arrangée par des facilitateurs malaisiens. L'ordre du jour est modeste : zones de sécurité, sort des prisonniers, et reconnaissance du dialogue lui-même. Après des années à nier qu'une guerre existât, parler est la concession."
 thailand.153.a: "Les faire continuer à parler."
 thailand.154.t: "L'accord de paix"
 thailand.154.d: "Un cadre d'autonomie pour les provinces de Patani est signé. Il apporte une gouvernance régionale élue, une scolarité en malais aux côtés du thaï, des mécanismes de justice pour les abus du conflit, et une fin progressive de la présence sécuritaire. La plus longue guerre à l'intérieur des frontières thaïlandaises s'achève par des signatures."
 thailand.154.a: "La paix dans le Sud."
 thailand_news.1.t: "Coup d'État à Bangkok"
 thailand_news.1.d: "L'armée royale thaïlandaise a saisi le pouvoir à Bangkok, suspendant la constitution et destituant le gouvernement élu. Des conseils militaires ont gouverné la Thaïlande à répétition depuis 1932, et marchés comme chancelleries calculent combien de temps celui-ci entend rester."
 thailand_news.1.a: "Encore?"
 thailand_news.2.t: "La Thaïlande revendique ses « territoires perdus »"
 thailand_news.2.d: "Bangkok a formellement revendiqué des territoires cédés à la France et à la Grande-Bretagne il y a un siècle, ressuscitant un programme irrédentiste inentendu depuis la Seconde Guerre mondiale. Les capitales d'Asie du Sud-Est réagissent avec alarme."
 thailand_news.2.a: "Concernant."
 thailand_news.3.t: "Une république au Siam ?"
 thailand_news.3.d: "La Thaïlande tiendra un référendum sur l'avenir de sa monarchie, une question sans précédent dans l'histoire moderne du Royaume. La région retient son souffle."
 thailand_news.3.a: "Sans précédent."
 thailand_news.4.t: "La Thaïlande pleure le roi Bhumibol"
 thailand_news.4.d: "Le roi Bhumibol Adulyadej, le monarque au plus long règne au monde, est mort à Bangkok à l'âge de 88 ans. La Thaïlande entame une année de deuil pour le seul roi que la plupart des Thaïlandais aient jamais connu. Son fils lui succède comme roi Maha Vajiralongkorn, Rama X."
 thailand_news.4.a: "Une époque se termine."
 thailand.58.t: "Le marais des cobras"
 thailand.58.d: "Nong Ngu Hao, le « marais des cobras », avale de l'argent depuis les années 1970. Désormais le nouvel aéroport s'élève vraiment, et les coûts aussi. Problèmes de drainage, taxiways fissurés, entrepreneurs facturant deux fois le même béton. Le conseil veut plus d'argent ou plus de temps."
 thailand.58.a: "Injecter des fonds et ouvrir dans les délais."
 thailand.58.b: "Laisser le calendrier glisser."
 thailand.59.t: "Porte vers l'Asie"
 thailand.59.d: "Suvarnabhumi opens its gates to a large glass-and-steel airport terminal, among the largest in the world and built to put Bangkok at the center of every Asian route map. The first arrivals boards light up like stars in a tourism ministry's fantasies."
 thailand.59.a: "Le Royaume a une nouvelle porte d'entrée."
 thailand.60.t: "Premier coup de pioche à l'Est"
 thailand.60.d: "The Eastern Economic Corridor exists on paper and someone must pay for the concrete and steel. Beijing's delegations arrive with financing offers folded into Belt-and-Road language. The finance ministry can also raise the money at home, slower, and with no strings."
 thailand.60.a: "Capitale chinoise de la cour."
 thailand.60.b: "Émettre des obligations nationales."
 thailand.61.t: "Les dépassements de la liaison ferroviaire"
 thailand.61.d: "Tunnelling under three airports was always going to be expensive, but nobody estimated realistically how expensive it would be for the cabinet. The three-airport line needs either another credit line or a smaller blueprint."
 thailand.61.a: "Payer. L'épine dorsale sera construite entière."
 thailand.61.b: "Réduire le périmètre."
 thailand.62.t: "Les Nouvelles routes de la soie frappent à la porte"
 thailand.62.d: "Une ligne à grande vitesse de Kunming via Vientiane jusqu'à Bangkok. Le milieu manquant du corridor indochinois de la Chine traverse le territoire thaïlandais, et Pékin aimerait beaucoup le financer. Les termes sont généreux. Les termes sont aussi des termes."
 thailand.62.a: "Signer le mémorandum ferroviaire."
 thailand.62.b: "Renégocier, lentement, à la thaïlandaise."
 thailand.63.t: "La question des concessions"
 thailand.63.d: "Des sénateurs d'opposition tabulent comment les concessions télécoms de l'État se sont comportées depuis que leur plus grand détenteur a formé un gouvernement. Impôts ajustés, licences prolongées, concurrents audités. Le mot « coïncidence » travaille dur dans les réponses officielles."
 thailand.63.a: "Céder les participations. Prendre le coup au Trésor, acheter la réputation propre."
 thailand.63.b: "Crâner. Les chiffres gagnent les élections, les avocats gagnent du temps."
 thailand.64.t: "Le bilan de la dette des ménages"
 thailand.64.d: "Les fonds villageois ont bâti boutiques, motos et rizeries, tout à crédit. La dette moyenne des ménages ruraux a presque doublé, et les livres des coopératives commencent à vaciller. Les banques veulent des consignes avant la saison de reconduction."
 thailand.64.a: "Renflouer les coopératives. Un moratoire nous coûte, mais sauve les villages."
 thailand.64.b: "Let credit tighten. The market re-corrects and villages absorb the cost."
 thailand.65.t: "Offsets et Erieye"
 thailand.65.d: "L'offre finale de Saab atterrit sur la table. Des Gripen avec accès complet au code source, un radar aéroporté Erieye, des partenariats universitaires et du travail de composants pour l'industrie thaïlandaise, le tout pour un prix. Ou les mêmes chasseurs, nus, pour nettement moins."
 thailand.65.a: "Prendre le paquet complet."
 thailand.65.b: "Cellules seulement. Surveiller le budget."
 thailand.66.t: "Le problème des moteurs"
 thailand.66.d: "L'Allemagne ne licenciera pas les diesels pour un sous-marin d'export construit en Chine, ce qui laisse la coque S26T à moitié payée à Wuhan en attente d'un cœur. Pékin offre ses propres moteurs et une remise. La marine offre au cabinet un choix d'embarras."
 thailand.66.a: "Accepter les moteurs chinois et prendre livraison."
 thailand.66.b: "Exiger une coque de frégate en compensation."
 thailand.66.c: "Annuler le contrat entièrement."
 thailand.67.t: "Un produit phare renaît"
 thailand.67.d: "Des drones sur le tremplin, des bateaux sans pilote dans le puits du hangar, des consoles de contrôle là où rouillaient autrefois les pièces de Harrier. Le HTMS Chakri Naruebet rentre à Sattahip avec un profil de mission qu'aucune autre marine de la région ne peut copier."
 thailand.67.a: "La faire défiler devant les caméras."
 thailand.67.b: "Une remise en service discrète, retour au travail."
 thailand.68.t: "Quatre-vingt-dix jours de peur"
 thailand.68.d: "Les listes noires sont devenues des décomptes de cadavres. Plus de deux mille morts en trois mois, beaucoup sans aucun lien avec la drogue que les enquêteurs puissent trouver. La campagne applaudit, les hôpitaux se remplissent, et la boîte de réception du ministère des Affaires étrangères plus vite encore."
 thailand.68.a: "Continuer. La campagne fonctionne."
 thailand.68.b: "La ramener et ordonner des revues."
 thailand.69.t: "Rumeurs au club des officiers"
 thailand.69.d: "Les signes que tout gouvernement de Bangkok apprend à lire sont tous là. Rotations inhabituelles vers la 1re région militaire, généraux à la retraite soudain amateurs d'interviews télévisées, et une réunion de promotion à la caserne de cavalerie à laquelle la moitié du haut commandement a assisté."
 thailand.69.a: "Purger le haut état-major."
 thailand.69.b: "Accueillir les généraux."
 thailand.69.c: "Défiez-les publiquement."
 thailand.70.t: "Des chars à Government House"
 thailand.70.d: "Cela commence comme cela commence toujours. La programmation régulière remplacée par de la musique patriotique, des blindés aux carrefours, un communiqué d'un « conseil » dont personne n'avait entendu parler hier. Le gouvernement a des minutes pour décider ce qu'il est prêt à dépenser."
 thailand.70.a: "Rassembler les loyalistes et résister."
 thailand.70.b: "Céder, et monter dans l'avion."
 thailand.70.c: "Négocier un gouvernement d'union nationale."
 thailand.70.c_tooltip: "§YThe generals enter the cabinet, not the palace.§!\nElections survive (§Gno election suspension§!) and coup pressure falls to §Y35§!. The Kingdom becomes less stable and limited in political willpower, and an §Yuneasy compromise§! strains the government for 180 days."
 thailand.71.t: "La jeunesse dans les rues"
 thailand.71.d: "Ils s'organisent sur Telegram, citent Hamtaro et Hunger Games, et remplissent les monuments par dizaines de milliers. Leurs revendications sont écrites sur des avions en papier jetés par-dessus les barrières. Dissoudre le parlement, réécrire la constitution, réformer les institutions intouchables."
 thailand.71.a: "Disperser les rassemblements. L'ordre ne peut attendre."
 thailand.71.b: "Ouvrir un dialogue. Céder le ton, pas le fond."
 thailand.71.c: "Les attendre. Ils se lasseront avant nous."
 thailand.155.t: "Une région en feu"
 thailand.155.d: "Incendies coordonnés dans trois provinces en une nuit. Checkpoints attaqués en plein jour. Enseignants sous escorte, écoles fermées pour le trimestre. Le Sud n'a pas brûlé ainsi depuis une génération, et le Conseil de sécurité nationale veut une direction."
 thailand.155.a: "Inonder le Sud de troupes."
 thailand.155.b: "Appeler Kuala Lumpur et élargir le dialogue."
 thailand.156.t: "Routes calmes à Pattani"
 thailand.156.d: "La carte mensuelle des incidents a plus de blanc que de rouge. Les marchés restent ouverts après la tombée de la nuit, les checkpoints laissent passer le trafic, et les hommes de l'autre côté de la table à Kuala Lumpur demandent, avec précaution, à quoi pourrait ressembler un statut final."
 thailand.156.a: "Pousser vers un accord final."
 thailand.156.b: "Maintenir le calme, et le statu quo."
 thailand.350.t: "Le feu dans le Sud"
 thailand.350.d: "La carte des trois provinces du Sud est une constellation d'épingles rouges : attentats, embuscades, incendies et assassinats. Des milliers de morts et les forces de sécurité saignent des hommes qu'elles ne peuvent remplacer. La crise ne peut plus se gérer en marge. Le gouvernement doit décider quel État il entend être dans le Sud. Un poing, un bienfaiteur, ou un partenaire de l'autre côté de la table."
 thailand.350.a: "Les écraser. Le Sud connaîtra le sens de l'ordre."
 thailand.350.b: "La paix du roi. Développer le Sud, le reconquérir."
 thailand.350.c: "Leur parler. Même d'anciens ennemis peuvent signer un papier."
 thailand.350.e: "Nous n'avons pas de politique claire. Gérer au fil de l'eau."
 thailand.356.t: "Les camions"
 thailand.356.d: "Encore une rafle et encore une foule devant encore un commissariat de district. Cela s'est achevé avec des centaines de détenus empilés face contre terre dans des camions de l'armée, et des dizaines morts d'asphyxie avant d'arriver au camp. Les images parcourent le monde musulman avant que Bangkok puisse composer un communiqué. Quoi que l'opération ait obtenu sur le terrain, elle vient de radicaliser une génération et d'offrir à l'insurrection son mythe fondateur."
 thailand.356.a: "Une catastrophe. Le Sud n'oubliera pas."
 thailand.357.t: "Pacification terminée"
 thailand.357.d: "Les généraux rapportent mission accomplie. Les bombes au bord des routes ont cessé, les cellules sont brisées, les checkpoints descendent. Par toutes les métriques que l'armée mesure, le Deep South est pacifié. Sous le silence, le grief n'est pas mort. Il a seulement appris à attendre."
 thailand.357.a: "Les armes se taisent. Nous surveillerons les braises."
 thailand.358.t: "Un calme méridional"
 thailand.358.d: "Il n'y a pas eu de traité et il n'y a pas d'autonomie, mais la violence s'est reculée en un calme géré. Les flux de développement royal, les notables locaux sont sous la tente, et la légitimité de la monarchie dans le Sud est discrètement rétablie. C'est un calme tenu par la présence et le patronage, surveillé plutôt que résolu."
 thailand.358.a: "La Couronne garde la paix qu'elle a gagnée."
 thailand.359.t: "L'establishment pousse en retour"
 thailand.359.d: "Le projet de loi d'autonomie spéciale a fuité, et la réaction à Bangkok est féroce. Les généraux parlent de démembrement, les conservateurs du palais grognent sur le précédent, et la presse nationaliste parle de reddition. Les négociateurs sont prêts à signer, mais le gouvernement doit décider s'il dépensera le capital politique pour tenir la ligne, ou diluera le cadre jusqu'à quelque chose que le centre puisse avaler."
 thailand.359.a: "Tenir la ligne. L'accord doit être réel."
 thailand.359.b: "Le diluer. Garder la paix, perdre le principe."
 thailand.360.t: "L'accord de Pattani"
 thailand.360.d: "Des signatures sur une seule page achèvent la plus longue guerre à l'intérieur des frontières modernes du Royaume. Le Sud gagne une véritable autogouvernance au sein d'une Thaïlande unitaire, les armes sont rendues, et les déplacés commencent à rentrer. C'est imparfait, contesté et historique, et pour la première fois depuis une génération, les enfants de Pattani grandiront sans couvre-feu."
 thailand.360.a: "La paix, enfin, dans le Sud."
 thailand_news.24.t: "Massacre de Tak Bai"
 thailand_news.24.d: "Les images de détenus asphyxiés dans des camions de l'armée devant Tak Bai ont atteint chaque capitale du monde musulman. Kuala Lumpur, Jakarta et Ankara ont convoqué les ambassadeurs thaïlandais, et des organismes de droits humains exigent une enquête. La politique méridionale de Bangkok est désormais synonyme d'atrocité, et l'insurrection n'a jamais eu de saison de recrutement plus facile."
 thailand_news.24.a: "Le monde regarde le Sud."
 thailand_news.25.t: "La paix revient à Pattani"
 thailand_news.25.d: "Après une génération de sang versé, les armes se sont tues dans le Deep South thaïlandais. Que ce soit par la main du soldat ou la plume du négociateur, la plus longue insurrection de l'histoire moderne du Royaume a atteint sa fin. Les routes sont ouvertes, les marchés pleins, et une normalité méfiante revient à Pattani, Yala et Narathiwat."
 thailand_news.25.a: "Une longue guerre se termine."
 thailand_news.23.t: "Un gouvernement d'union nationale"
 thailand_news.23.d: "Les chars se sont retirés des carrefours, mais le marché conclu dans la nuit survivra à la crise. Le gouvernement élu garde son mandat et l'urne sa place, pourtant les chefs d'état-major siègent désormais à la table du cabinet, et chacun à Bangkok comprend qui a garanti la paix. C'est un compromis que personne n'aime et que personne n'ose briser, un gouvernement national avec l'armée sous la tente."
 thailand_news.23.a: "Le pouvoir, partagé et surveillé."
 thailand.3.c: "Des cultures, pas du pavot. Financer un développement alternatif."
 thailand.361.t: "Des corps au bord de la route"
 thailand.361.d: "La campagne de trois mois est finie et le bilan est là. Des organisations de droits documentent quelque 2 800 morts, la grande majorité jamais inculpée de quoi que ce soit, beaucoup jamais même nommés. Les listes noires ont réglé de vieux comptes, et les quotas ont été remplis avec des cadavres. Les rues sont plus calmes et les sondages plus hauts que jamais, mais dans les casernes et au palais, des hommes prennent des notes sur un gouvernement qui tue à l'horaire."
 thailand.361.a: "Les chiffres sont les chiffres. Nous ne nous excusons pas."
 thailand.362.t: "Des cultures, pas du pavot"
 thailand.362.d: "L'interception seule n'a fait que pousser le trafic de l'autre côté de la prochaine crête. Les agronomes et les gens de la santé publique ont une autre proposition. Payer les paysans des collines pour cultiver café, macadamia et fruits plutôt que l'opium, traiter l'addiction comme une maladie plutôt qu'un crime, et laisser les cultures de rente légales faire ce que les hélicoptères n'ont jamais pu. C'est plus lent, c'est moins cher, et cela demande à l'État d'arrêter de tirer et de commencer à acheter."
 thailand.362.a: "Financer le développement alternatif. Gagner les collines par les marchés."
 thailand.362.b: "Continuer d'intercepter. Tenir la ligne que nous avons."
 thailand_news.5.t: "La Thaïlande dévoile le Corridor économique oriental"
 thailand_news.5.d: "Bangkok a officiellement ouvert sa zone de développement phare sur le littoral oriental, avec une ligne à grande vitesse vers trois aéroports, un aérotropolis U-Tapao élargi, et des paquets d'incitations visant véhicules électriques, aérospatial et biotechnologie. Les analystes y voient le projet économique thaïlandais le plus ambitieux depuis le programme du littoral oriental des années 1980."
 thailand_news.5.a: "Le Pays du sourire entend les affaires."
 thailand.50.b: "Adoucir le choc et protéger le peuple."
 thailand.55.b: "Construire la voiture nationale."
 thailand.200.t: "La Constitution du peuple"
 thailand.200.d: "Organisations de la société civile, universitaires et leaders communautaires célèbrent une constitution écrite avec une véritable participation publique. Pour la première fois depuis des décennies, les Thaïlandais ordinaires sentent qu'ils ont eu la main à leur loi fondamentale, et les rues de Bangkok sont inattendument en fête."
 thailand.200.a: "La démocratie prend racine."
 thailand.201.t: "Des records à Don Mueang"
 thailand.201.d: "Le trafic passagers à Don Mueang dépasse tous les records, et la campagne Amazing Thailand a fonctionné au-delà de toutes les projections. Les dirigeants aériens annoncent de nouvelles liaisons directes et les voyagistes réservent déjà les deux saisons suivantes. La question devant nous est que faire des recettes."
 thailand.201.a: "Le réinvestir dans les stations balnéaires du Sud."
 thailand.201.b: "Mettre le boni de côté."
 thailand.202.t: "Un monde affamé de riz"
 thailand.202.d: "Une sécheresse dans le sous-continent indien et des échecs de récolte à travers l'Asie du Sud-Est ont envoyé les cours mondiaux du riz à un sommet décennal. La Thaïlande détient des stocks de variétés premium Hom Mali et Jasmine que chaque importateur de grains veut immédiatement. Le ministère du Commerce attend notre réponse."
 thailand.202.a: "Vendre le stock à prix premium."
 thailand.202.b: "Garder le riz au pays et subventionner les prix intérieurs."
 thailand.203.t: "La demande de basing"
 thailand.203.d: "Le commandement américain du Pacifique a fait une demande discrète mais formelle d'accès élargi à la base aérienne d'U-Tapao pour la logistique, la surveillance et le prépositionnement. Les Américains sont prêts à payer, en transferts du Trésor, modernisations d'équipement et couverture politique. Le public n'a pas besoin de connaître les détails."
 thailand.203.a: "Accorder l'accès et prendre l'argent."
 thailand.203.b: "Refuser poliment. Sol thaïlandais, souveraineté thaïlandaise."
 thailand_news.6.t: "Le bambou plie, il ne casse pas"
 thailand_news.6.d: "La Thaïlande a conclu un alignement diplomatique dual-track historique, approfondissant simultanément sa relation de traité avec Washington tout en signant un nouveau cadre de partenariat économique avec Pékin. Le ministère des Affaires étrangères de Bangkok l'appelle « diplomatie du bambou », flexible, résiliente, et enracinée dans les intérêts thaïlandais avant tous les autres."
 thailand_news.6.a: "Un remarquable numéro d'équilibriste"
 thailand_news.7.t: "La Thaïlande rembourse le FMI avec deux ans d'avance"
 thailand_news.7.d: "Bangkok a soldé l'intégralité de sa dette envers le Fonds monétaire international, avec deux ans d'avance. Le remboursement anticipé, annoncé sans fanfare par le ministère des Finances, clôt le chapitre de la crise financière asiatique de 1997 et libère la Thaïlande des dernières conditions attachées au programme de sauvetage de 1997."
 thailand_news.7.a: "Le Pays du sourire paie ses dettes."
 thailand.205.t: "Technocrates contre vieille garde"
 thailand.205.d: "Le nouveau cabinet façon PDG a fixé des objectifs de performance pour chaque ministère, et plusieurs secrétaires permanents ont été remplacés par des dirigeants d'entreprise. La vieille bureaucratie n'est pas amusée. Une guerre discrète est en cours entre les technocrates qui poussent « Thailand Inc. » et les fonctionnaires de carrière qui dirigent les ministères depuis trente ans."
 thailand.205.a: "Soutenir les technocrates. Réformer les ministères."
 thailand.205.b: "Protéger la bureaucratie de carrière. Faire tourner les ministères et garder les généraux de notre côté."
 thailand.207.t: "Fatigue de Prayuth"
 thailand.207.d: "Au bout de trois ans, les promesses de réforme des généraux s'usent. Le comité de rédaction constitutionnelle a été reconstitué deux fois. La date des élections a bougé deux fois. Un étudiant avec une pancarte devant le Parlement fait face à dix-sept chefs d'accusation. La lune de miel est finie."
 thailand.207.a: "Nous gérerons la transition avec soin."
 thailand.208.t: "L'impasse continue"
 thailand.208.d: "Days pass, then weeks. The protests have not collapsed but they have not escalated either. The government neither concedes nor clears the square. Eventually both sides blink. Who is going to break first?"
 thailand.208.a: "Chercher une résolution discrète avec des concessions."
 thailand.208.b: "Les manifestants prennent le crédit. Le gouvernement prend le blâme."
 thailand_news.8.t: "Le palais prend le volant"
 thailand_news.8.d: "L'establishment royal thaïlandais a formalisé son rôle dans la gestion des actifs du Crown Property Bureau, consolidant l'autorité sur des centaines de milliards de bahts d'avoirs commerciaux dans une structure rendant compte directement au palais. Les analystes à Bangkok débattent si cela représente une nouveauté constitutionnelle ou simplement un rangement juridique d'arrangements informels depuis des décennies."
 thailand_news.8.a: "La dynastie Chakri endure."
 thailand.209.t: "Les jeunes sont en ligne"
 thailand.209.d: "Un mouvement de protestation mené par la jeunesse a éclaté simultanément à Bangkok, Chiang Mai et trois campus provinciaux. Leurs revendications passent en livestream avant que la police n'ait déroulé ses barrières. Le gouvernement doit décider s'il s'engage ou s'il attend."
 thailand.209.a: "Épouser leur cause."
 thailand.209.b: "Continuer de gouverner. Laisser le moment passer."
 thailand.210.t: "Une lettre des casernes"
 thailand.210.d: "Un document anonyme, circulé parmi des officiers seniors puis fuité, décrit des plans pour une réduction, orchestrée par des civils, de l'influence militaire sur les promotions et les achats. Le texte porte un avertissement. L'armée surveille, et la patience a une limite. Cela peut être un véritable complot de putsch à ses débuts, ou un bluff. Le choix de la réponse définit quel pays nous sommes."
 thailand.210.a: "Agir maintenant et purger les conjurés avant qu'ils ne s'organisent."
 thailand.210.b: "Procéder discrètement. Nous ne dignifierons pas les fuites d'une réponse."
 thailand.211.t: "Les provinces ont parlé"
 thailand.211.d: "Les retours du Nord-Est et du Haut-Nord sont là, et district après district a basculé vers la liste réformatrice. Des députés vétérans de trente ans de mandat ont perdu face à des jeunes de vingt-huit ans qui ont fait campagne sur les réseaux. La carte électorale est redessinée par des électeurs qui n'ont jamais eu un député local prenant leurs appels."
 thailand.211.a: "Saisir le mandat."
 thailand.211.b: "Gouverner pour tous, pas seulement pour nos électeurs."
 thailand.212.t: "Les conglomérats répondent"
 thailand.212.d: "L'enchère des blocs de spectre jusqu'alors monopolisés a produit exactement le boni que les réformateurs prédisaient. La même semaine, un recours juridique coordonné des trois plus grands conglomérats atterrit à la Cour constitutionnelle, et une chronique dans un journal royaliste décrit le ministère des Finances comme « idéologiquement possédé ». La politique de démantèlement fonctionne, et elle a de puissants ennemis."
 thailand.212.a: "Continuer. La loi est de notre côté."
 thailand.212.b: "Proposer un règlement, une liquidation encadrée plutôt qu'un éclatement forcé."
 thailand.213.t: "La première année de la République"
 thailand.213.d: "Douze mois depuis la proclamation, et le pays est toujours là : meurtri, galvanisé, en débat, mais là. Le mouvement royaliste n'a pas disparu. Il s'est mué en campagne juridique et culturelle. La première élection présidentielle est prévue. La question posée au cabinet est de savoir s'il faut crier victoire, reconnaître la fracture, ou simplement gouverner."
 thailand.213.a: "Nous avons bâti quelque chose qui durera."
 thailand.213.b: "La cause Chakri n'est pas close. Le peuple se souvient."
 thailand.213.c: "La république survit, pour l'heure. Il reste encore beaucoup à défendre."
 thailand.214.t: "La colonne passe devant le monument"
 thailand.214.d: "Trois heures d'artillerie, de blindés et d'infanterie, les forces armées en grand ordre de parade le long de l'avenue Ratchadamnoen. Les foules dépassent les prévisions. Pour un pays qui a oublié ses guerres et assimilé les coups d'État comme une routine, le spectacle pèse d'un poids inhabituel."
 thailand.214.a: "Une nation salue ses défenseurs."
 thailand_news.9.t: "La Thaïlande légalise le mariage homosexuel"
 thailand_news.9.d: "Le parlement thaïlandais a adopté la loi sur l'égalité du mariage à la majorité des deux tiers, devenant le premier pays d'Asie du Sud-Est à accorder le plein droit au mariage indépendamment du genre. La loi entre en vigueur immédiatement. Les célébrations dans les quartiers de Silom à Bangkok et de Nimman à Chiang Mai ont rassemblé des dizaines de milliers de personnes. Plusieurs gouvernements voisins ont publié des déclarations exprimant leur « préoccupation »."
 thailand_news.9.a: "Un jalon pour l'Asie."
 thailand_news.10.t: "Le printemps tient"
 thailand_news.10.d: "Trois ans après l'arrivée au pouvoir du gouvernement réformateur sur une vague de protestation juvénile, la Thaïlande achève aujourd'hui une transition démocratique complète. Le contrôle civil de l'armée est officialisé, le Sénat nommé est dissous, et la première élection librement compétitive depuis deux décennies se tient sans incident. Des observateurs internationaux de dix-sept pays ont certifié le résultat."
 thailand_news.10.a: "La démocratie prend racine."
 thailand_news.11.t: "La vague thaïlandaise déferle sur l’Asie"
 thailand_news.11.d: "De Tokyo à Taipei jusqu'à Kuala Lumpur, le contenu thaïlandais est partout. Séries en streaming, groupes de hip-hop, marques de mode, et une diplomatie gastronomique que le gouvernement n'a pas planifiée et dont il ne peut s'attribuer tout le mérite. La production culturelle thaïlandaise a dépassé celle de ses voisins, tant en valeur qu'en portée."
 thailand_news.11.a: "Le monde veut ce que la Thaïlande fabrique."
 thailand.215.t: "Faire le bilan du Royaume"
 thailand.215.d: "La première revue interne du nouveau gouvernement est achevée. Les fonctionnaires ont rassemblé les chiffres — ratios d'endettement, lacunes d'infrastructure, balances commerciales et moral public — et trois voies se dégagent. Le gouvernement doit choisir sa première priorité. Ce qui sera décidé maintenant façonnera la trajectoire du pays pour les deux prochaines années."
 thailand.215.a: "Priorité au redressement. Reconstruire l'économie de fond en comble."
 thailand.215.b: "Mettre l'accent sur l'ordre. Renforcer les institutions avant de les réformer."
 thailand.215.c: "Priorité au monde. Mener par la diplomatie et le commerce."
 thailand.216.t: "Le coup des généraux"
 thailand.216.d: "L'appel à la résistance du gouvernement est parti vers les loyalistes de la police, de la patrouille frontalière, des réseaux de la société civile et de la rue. Que le peuple réponde ou non décidera la prochaine décennie de la politique thaïlandaise. Dans la salle d'opérations, l'état-major suit les déploiements sur la carte et compte."
 thailand.216.a: "Tenir la ligne."
 thailand.217.t: "Pékin manifeste son mécontentement"
 thailand.217.d: "La note de l'ambassade chinoise est diplomatiquement formulée, mais d'un froid sans équivoque. L'alignement croissant de la Thaïlande sur Washington n'est pas passé inaperçu. Les médias d'État à Pékin évoquent la « posture contradictoire » de la Thaïlande. Les délégations d'investisseurs reportent discrètement leurs visites. Bangkok doit décider combien absorber et combien détourner."
 thailand.217.a: "Laisser la relation se refroidir. Nous avons fait notre choix."
 thailand.217.b: "Rassurer Pékin en silence par un message personnel du Premier ministre."
 thailand.218.t: "Washington s'ajuste"
 thailand.218.d: "Le Département d'État américain a noté le nouvel alignement de la Thaïlande sur les Nouvelles routes de la soie avec une neutralité étudiée en public, mais les collaborateurs du Congrès ont commencé à poser des questions pointues sur le financement de Cobra Gold et les engagements conventionnels. L'évaluation du Pentagone, fuitée vers un think tank de Washington, décrit la Thaïlande comme « stratégiquement ambiguë ». Bangkok doit gérer la relation."
 thailand.218.a: "Accepter le refroidissement. Nous sommes une nation souveraine."
 thailand.218.b: "Des assurances privées à l'ambassadeur. Rien d'essentiel ne change."
 thailand.219.t: "Les généraux en permanence"
 thailand.219.d: "La décision d'institutionnaliser la tutelle militaire a atteint les éditoriaux internationaux. Le Financial Times parle d'« autoritarisme géré ». Trois ambassadeurs européens ont demandé des rendez-vous au ministère des Affaires étrangères la même semaine. Au pays, universitaires réformateurs et étudiants lisent la couverture et tirent leurs propres conclusions."
 thailand.219.a: "Nous gouvernons selon nos lumières. Les commentaires étrangers n'ont pas d'importance."
 thailand.219.b: "Les critiques se trompent sur la Thaïlande. Nous le prouverons à nos conditions."
 thailand.220.t: "Le Sud accueille à nouveau les visiteurs"
 thailand.220.d: "Deux ans après que le tsunami a fermé les plages de la côte d'Andaman à tous sauf aux équipes de réparation, le dernier resort a rouvert. L'Autorité du tourisme de Thaïlande a mené une campagne de réhabilitation soignée, et les réservations suggèrent qu'elle a fonctionné. Le Sud est de retour."
 thailand.220.a: "La Thaïlande est ouverte."
 thailand.221.t: "La reconstruction du Sud est achevée"
 thailand.221.d: "Les équipes d'aide internationale et les ingénieurs du gouvernement ont achevé le programme de reconstruction des infrastructures côtières. Les routes sont reconstruites, les jetées de pêche réparées, le réseau électrique rétabli. Les partenaires de l'aide ont été remerciés et les échafaudages descendent."
 thailand.221.a: "Le Sud se tient à nouveau."
 thailand.222.t: "La crise financière mondiale"
 thailand.222.d: "L'effondrement de Lehman Brothers à New York a envoyé des ondes de choc sur les marchés asiatiques. Le secteur exportateur thaïlandais surveille ses carnets de commandes. La question pour Bangkok est de savoir si les tampons financiers bâtis ces dix dernières années tiendront, ou si la crise trouvera son chemin à travers la digue."
 thailand.222.a: "La Thaïlande affronte la tempête. Notre prudence a payé."
 thailand.222.b: "La tempête est arrivée. Il faut se préparer à deux années difficiles."
 thailand.223.t: "Trois cent soixante-dix-sept"
 thailand.223.d: "Dans la salle de lecture du Conseil privé et dans les couloirs du renseignement intérieur de l'armée, les analystes digèrent les résultats. Trois cent soixante-dix-sept sièges. Majorité d'un seul parti. Un mandat sans précédent dans l'histoire démocratique thaïlandaise, et le réseau n'a aucun instrument fiable contre lui. Pas aujourd'hui."
 thailand.223.a: "Les villages ont parlé. Pour l'heure."
 thailand.224.t: "Le bilan du riz"
 thailand.224.d: "Les cours mondiaux du riz n'ont pas coopéré. L'excédent mondial d'offre a laissé le gouvernement avec des millions de tonnes de riz stocké acheté bien au-dessus du marché, et l'arbitrage censé financer le dispositif n'a pas eu lieu. Le ministère des Finances a mis trois options sur la table. Deux d'entre elles sont politiquement possibles."
 thailand.224.a: "Absorber les pertes et combler le déficit par le Trésor."
 thailand.224.b: "Laisser le dispositif s'effondrer et encaisser le coup politique maintenant."
 thailand.225.t: "Les routes atteignent les villages"
 thailand.225.d: "Des ministres en casque inaugurent de nouvelles autoroutes sur le plateau de Khorat et des embranchements ferroviaires dans les vallées du Nord. Des bureaux provinciaux ouvrent dans des villes qui n'avaient jamais envoyé que leurs fils construire la capitale. Pour une fois, le développement rentre chez ceux qui ont livré le raz-de-marée électoral."
 thailand.225.a: "Le cœur du pays est récompensé."
 thailand.226.t: "Le règne du roi Vajiralongkorn"
 thailand.226.d: "L'année de deuil s'achève. L'approche du nouveau roi au trône n'est pas celle de son père. Une présence plus visible en public, une emprise plus serrée sur les biens de la Couronne, et un autre charisme royal. Le réseau qui a servi le neuvième règne doit apprendre à servir le dixième. Ce n'est plus le même réseau."
 thailand.226.a: "Le Royaume entre dans une ère nouvelle."
 thailand.227.t: "Les vétérans s'opposent"
 thailand.227.d: "L'annonce de la suppression progressive de la conscription a provoqué une riposte coordonnée des officiers à la retraite et des associations d'anciens combattants. Dans les casernes, les sous-officiers seniors grognent contre une armée « vidée ». La presse publie des photos des vieux généraux en grande tenue, l'air mécontent. Le gouvernement s'y attendait, mais l'ampleur du recul dépasse les modèles."
 thailand.227.a: "Tenir bon. La réforme est juste."
 thailand.227.b: "Offrir une cérémonie de reconnaissance aux vétérans et absorber la critique par le symbole."
 thailand.228.t: "Dividende touristique"
 thailand.228.d: "La première saison après l'accord de ciel ouvert est close. Les chiffres de l'Autorité du tourisme sont solides. Les arrivées sont en hausse de douze pour cent, la dépense quotidienne moyenne de dix-neuf, et les resorts du Sud, qui bénéficient le plus des nouvelles liaisons low-cost, affichent leur meilleur trimestre en dix ans."
 thailand.228.a: "Le baht circule."
 thailand_news.13.t: "La Thaïlande, porte de l'Asie"
 thailand_news.13.d: "Le gouvernement thaïlandais a officiellement proclamé son corridor d'infrastructure méridional — canal ou pont terrestre — « ouvert à toutes les nations à des conditions équitables ». L'investissement international a déjà commencé à affluer dans la zone économique du Sud, et Bangkok accueille des délégations de douze pays en quête d'arrangements de transit préférentiels."
 thailand_news.13.a: "Le Pays du sourire commande les routes maritimes."
 thailand.250.t: "Le gouvernement cède"
 thailand.250.d: "La grève a figé le pays trop longtemps, et le coût est devenu insupportable pour les hommes au pouvoir. Les docks, les rails, les ministères : tout s'est arrêté, et les rues appartiennent au mouvement. Plutôt que de parier sur l'armée tirant sur son propre peuple, le cabinet ouvre la porte à la négociation. C'est la voie pacifique vers le pouvoir, gagnée par le nerf plutôt que par le fusil."
 thailand.250.a: "Nous avons gagné la rue. Prenons maintenant l'État."
 thailand.259.t: "Les généraux rétablissent l'ordre"
 thailand.259.d: "La grève s'est prolongée sans jamais vraiment briser la volonté du gouvernement, et le haut commandement a perdu patience le premier. Les chars sont dans les avenues, les chefs de grève sont ramassés, un couvre-feu est en vigueur. La révolution a été écrasée avant de pouvoir s'emparer du pouvoir, et les hommes en uniforme règnent désormais au nom de l'ordre. La voie rouge est close."
 thailand.259.a: "La révolution est brisée."
 thailand.251.t: "Le monde recule"
 thailand.251.d: "Le nouveau gouvernement thaïlandais s'est annoncé au monde. La réponse de Washington est arrivée avant que l'encre des documents fondateurs du parti ne sèche. Sanctions économiques, gel de l'aide, et une déclaration du Département d'État à la fois condescendante et menaçante. Pékin et Hanoï, en revanche, ont envoyé leurs félicitations."
 thailand.251.a: "Qu'ils nous sanctionnent. Nous n'avons pas fait cette révolution pour leur agrément."
 thailand.252.t: "Les royalistes s'en vont"
 thailand.252.d: "La réforme agraire a répondu à la question que la bonne société de Bangkok préférait ne pas poser. Ceux qui ont bâti leur fortune sur l'ancien système — propriétaires absents, réseau d'investissement autour du palais, familles provinciales qui détenaient dix mille rai au nom de chacun de leurs enfants — ont fait leur choix. La plupart sont déjà dans des avions pour Singapour, Londres et Los Angeles."
 thailand.252.a: "Un pays n'est pas ses propriétaires."
 thailand.253.t: "Le dilemme Chakri"
 thailand.253.d: "La dynastie Chakri a régné sur le Siam et la Thaïlande pendant plus de deux siècles. L'institution monarchique, quoi que l'on pense des individus qui l'ont incarnée, est tissée dans le calendrier civil, le système juridique, la géographie de Bangkok et l'architecture émotionnelle d'une part significative de la population. Le parti doit décider ce qu'il en fera.\n\nL'engagement du parti envers les buts de la révolution n'est pas en question. La seule question est de savoir si une rupture nette ou une transition gérée les sert mieux."
 thailand.253.a: "Abolir la monarchie. Elle n'a pas sa place dans une république populaire."
 thailand.253.b: "Garder une figure constitutionnelle pendant que le parti gouverne."
 thailand_news.14.t: "Le rideau de bambou tombe"
 thailand_news.14.d: "La Thaïlande a officialisé son alignement avec le Laos et le Viêt Nam dans un cadre de solidarité régionale que les analystes appellent déjà le « rideau de bambou ». Pour la première fois depuis le Cambodge de Pol Pot, un gouvernement d'Asie du Sud-Est a déclaré une orientation de bloc communiste. Les capitales occidentales recalculent. Pékin accueille. Le baht thaïlandais a été remplacé du jour au lendemain par une nouvelle monnaie."
 thailand_news.14.a: "La carte de l'Asie du Sud-Est a changé."
 thailand_news.31.t: "La campagne encercle la ville"
 thailand_news.31.d: "Après des années d'insurrection que Bangkok renvoyait à un reliquat de guerre morte, le Parti communiste de Thaïlande a déclaré la guerre populaire ouverte. Des zones de base dans les hauts plateaux du Nord et le plateau de l'Isaan échappent désormais aux forces de sécurité, et les recrues affluent des villages que l'État a cessé de servir. Les analystes militaires qui avaient rayé le mouvement revoient discrètement leurs évaluations."
 thailand_news.31.a: "Les collines sont à eux désormais."
 thailand_news.32.t: "La Thaïlande rejoint le sillage du dragon"
 thailand_news.32.d: "Bangkok a signé un partenariat global avec Pékin. Il apporte investissements, accès commercial et un accord de sécurité qui place fermement la Thaïlande révolutionnaire dans l'orbite chinoise. Les médias d'État parlent de l'alignement naturel de deux voisins socialistes. Les diplomates occidentaux parlent d'un satellite qui s'est trouvé un soleil. Les grues qui s'élèvent au-dessus de Bangkok suggèrent que l'argent, du moins, est réel."
 thailand_news.32.a: "L'orbite est fixée."
 thailand_news.33.t: "Une fédération des trois fleuves"
 thailand_news.33.d: "La Thaïlande, le Laos, le Viêt Nam et le Cambodge ont annoncé un cadre de fédération socialiste indochinoise, avec Bangkok pour cœur industriel et diplomatique. Pour la première fois, les révolutions du Mékong parlent d'une seule voix, assez forte pour que les grandes puissances y répondent plutôt que de l'ignorer. Que quatre capitales fières puissent partager un même projet reste la question ouverte."
 thailand_news.33.a: "L'Indochine parle d'une seule voix."
 thailand.260.t: "Les Chemises rouges prennent Ratchaprasong"
 thailand.260.d: "Le vote rural est arrivé à Bangkok. Des dizaines de milliers de chemises rouges ont occupé le carrefour de Ratchaprasong, cœur commercial de la capitale, et dressé des barricades de bambou aiguisé et de pneus empilés. Les centres commerciaux sont fermés, la circulation est arrêtée, et le mouvement dit qu'il restera jusqu'à ce que le gouvernement convoque une élection. L'armée attend le mot d'ordre."
 thailand.260.a: "Qu'ils restent. La ville peut survivre à un carrefour occupé."
 thailand.260.b: "Déblayer le carrefour. La capitale ne peut rester fermée indéfiniment."
 thailand.270.t: "Le faiseur de rois"
 thailand.270.d: "Le parti d'Anutin Charnvirakul détient le bloc décisif au nouveau parlement. Son prix pour entrer dans la coalition n'est pas déraisonnable : une poignée de ministères, un engagement de dépenses de développement rural, et une promesse politique très particulière. Mais les coalitions coûtent toujours plus que l'offre initiale ne le suggère."
 thailand.270.a: "Former la coalition. La majorité au pouvoir vaut le prix."
 thailand.270.b: "Refuser. Nous pouvons gouverner sans eux, ou ne pas gouverner du tout."
 thailand.271.t: "Le ministère des ministères"
 thailand.271.d: "Les négociations au niveau du cabinet sont closes. Bhumjaithai reçoit le ministère de la Santé publique, celui de l'Agriculture, et un poste de vice-Premier ministre. Les papiers sont signés, la coalition est officielle, et le marchandage commence immédiatement."
 thailand.271.a: "La coalition tient. Pour l'heure."
 thailand.272.t: "Le mouvement d'abrogation"
 thailand.272.d: "Des membres conservateurs de la coalition, et des groupes de la société civile alignés sur les royalistes à l'extérieur, ont lancé une campagne formelle d'abrogation de la loi de dépénalisation du cannabis. Ils ont assez de signatures pour forcer un débat parlementaire. La question est de savoir si le gouvernement se bat pour préserver la politique ou la troque contre la paix politique."
 thailand.272.a: "Abroger la loi. La stabilité vaut plus que la ruée verte."
 thailand.272.b: "Tenir bon. La politique reste. Qu'ils aillent aux tribunaux."
 thailand.273.t: "Une offre de Bangkok"
 thailand.273.d: "La Thaïlande tend la main aux Shan. Reconnaissance, armes et un trésor en état de marche sont sur la table pour un État shan aligné sur le Royaume. L'autonomie serait réelle. Tout comme la dépendance qui l'accompagne, et Naypyidaw ne pardonnera pas le choix."
 thailand.273.a: "Acceptez la protection de Bangkok."
 thailand.273.b: "Nous tiendrons seuls."
 thailand.280.t: "First Win sur les routes"
 thailand.280.d: "Le First Win 4x4 de Chaiseri Metal and Rubber a trouvé des acheteurs dans toute l'Association. Infanterie de marine indonésienne, constabulary philippine, un régiment frontalier malais. Le premier lot est parti. La commission de l'agent d'export est moindre que le dividende réputationnel. L'Asie du Sud-Est sait désormais que la Thaïlande fabrique des choses qui valent d'être achetées."
 thailand.280.a: "Signer les contrats. Le marché de l'ASEAN est à nous."
 thailand.281.t: "Les marines s'entraînent à Sattahip"
 thailand.281.d: "Le premier exercice amphibie dédié du Corps des marines royales thaïlandaises depuis une décennie fait passer un bataillon sur les pistes d'assaut de plage de la base navale de Sattahip. La nouvelle doctrine est écrite, l'extension du chantier naval est financée, et le commandant du Corps a cessé de s'excuser pour le budget et commencé à planifier le prochain exercice."
 thailand.281.a: "Depuis la mer."
 thailand_news.15.t: "La Thaïlande, arsenal émergent de l'ASEAN"
 thailand_news.15.d: "Une vague de contrats d'export de défense signés à Bangkok ce trimestre a poussé les analystes régionaux à reconsidérer la place de la Thaïlande sur le marché de la défense d'Asie du Sud-Est. Des MRAP First Win sont dans les inventaires philippins et indonésiens, et des fusées d'artillerie de fabrication thaïlandaise dans les stocks malaisiens. L'Arsenal royal thaïlandais n'est plus un programme d'approvisionnement intérieur. C'est un fournisseur régional."
 thailand_news.15.a: "Les usines du Royaume travaillent."
 thailand_news.16.t: "Bangkok annonce une doctrine d'opérations multi-domaines"
 thailand_news.16.d: "Le Commandement suprême des Forces armées royales thaïlandaises a publié la première doctrine officielle d'opérations multi-domaines de la Thaïlande, intégrant cyber, guerre électronique, frappes de drones et manœuvre terrestre conventionnelle dans un cadre opérationnel unifié. Élaborée lors d'exercices conjoints avec des partenaires américains et australiens, la doctrine MDO signale que la Thaïlande ne conçoit plus la guerre comme un contest à un seul domaine."
 thailand_news.16.a: "Le Royaume combat sur tous les fronts."
 thailand.310.t: "Le réacteur devient critique"
 thailand.310.d: "À 3 h 47 du matin, les instruments de la salle de contrôle franchissent zéro. Le premier réacteur à eau pressurisée de Thaïlande a atteint la criticité. L'ingénieur en chef parle d'une étape technique, le cabinet d'une sécurité énergétique. Les deux ont raison. Le réseau national n'aura plus le même visage au matin."
 thailand.310.a: "Une nouvelle ère d'énergie de base."
 thailand.311.t: "Phnom Penh répond"
 thailand.311.d: "Le ministère des Affaires étrangères cambodgien a répondu aux ouvertures de Bangkok, plus formellement qu'attendu, plus chaleureusement que craint. Le calcul de Phnom Penh est clair. Une relation étroite avec la Thaïlande est une assurance contre une trop grande dépendance à Pékin et un flux de recettes que l'économie à la croissance la plus rapide de la région peut fournir."
 thailand.311.a: "Accueillir le partenariat."
 thailand.311.b: "S'engager avec prudence. Le progrès prend du temps."
 thailand.312.t: "Le dialogue de Jakarta"
 thailand.312.d: "La délégation indonésienne arrive sans communiqué conjoint rédigé. Jakarta veut savoir ce que Bangkok entend. Un véritable partenariat d'égaux régionaux, ou une compétition pour le rôle de chef de file de l'ASEAN que l'Indonésie a longtemps considéré comme le sien ? Les deux options sont sur la table. Aucune n'est bon marché."
 thailand.312.a: "Partenariat. Exercices conjoints, doctrine partagée, gains mutuels"
 thailand.312.b: "La compétition. Nous surpasserons Jakarta en influence dans son propre voisinage."
 thailand.313.t: "Le dossier des contrats chinois"
 thailand.313.d: "L'évaluation du ministère des Finances est sans ambiguïté. Les contrats d'infrastructure signés dans le cadre des Nouvelles routes de la soie ont livré les routes et les rails dont la Thaïlande avait besoin, mais les termes de financement enchâssent l'influence de Pékin dans les pipelines de projets pour une génération. La question posée au cabinet est de continuer à puiser dans le capital chinois ou d'absorber la douleur à court terme d'une renégociation."
 thailand.313.a: "Garder le financement. Les projets livrent."
 thailand.313.b: "Renégocier. La souveraineté coûte de l’argent."
 thailand.314.t: "Washington demande une révision"
 thailand.314.d: "Le commandement américain du Pacifique a formellement demandé une revue de sécurité bilatérale. En pratique, c'est une invitation à approfondir l'alignement conventionnel de la Thaïlande, prendre les paquets de formation et accepter la visibilité politique qui vient d'être le partenaire sud-est asiatique le plus fiable de l'Amérique. L'alternative est de maintenir la couverture."
 thailand.314.a: "Approfondir l'alliance. Prendre la formation et l'engagement."
 thailand.314.b: "La distance. La couverture sert mieux la Thaïlande."
 thailand_news.17.t: "La Thaïlande allume son premier réacteur nucléaire"
 thailand_news.17.d: "Le gouvernement royal thaïlandais a mis en service commercial complet la première centrale nucléaire de Thaïlande, devenant le premier pays d'Asie du Sud-Est à exploiter l'énergie nucléaire civile. Le réacteur à eau pressurisée de 600 mégawatts, situé dans la province de Chachoengsao, fournira environ huit pour cent de la demande nationale d'électricité. Les analystes notent la double utilité du réacteur. Il offre une sécurité énergétique et un nouvel axe de prestige technique dans une région où la capacité nucléaire est de plus en plus un marqueur d'ambition de puissance moyenne."
 thailand_news.17.a: "Le Royaume entre dans l'âge nucléaire."
 thailand.315.t: "Mine terrestre à Ta Muen Thom"
 thailand.315.d: "L'explosion d'une mine près du complexe de temple contesté de Ta Muen Thom a blessé trois soldats de l'armée royale thaïlandaise. Chaque camp accuse l'autre de l'avoir posée. L'incident a déclenché des manifestations nationalistes à Bangkok et à Phnom Penh."
 thailand.315.a: "Exiger des réponses et mobiliser le sentiment nationaliste."
 thailand.315.b: "Demander la médiation de l'ASEAN et laisser les diplomates mener."
 thailand.316.t: "Coups de feu à Ta Muen Thom"
 thailand.316.d: "Des escarmouches ont éclaté le long de la frontière contestée. Les deux gouvernements sont sous pression de leurs armées et de leurs mouvements nationalistes. Le secrétaire général de l'ASEAN a publié une déclaration appelant à la retenue."
 thailand.316.a: "Pousser l'avantage."
 thailand.316.b: "Accepter le cessez-le-feu de l'ASEAN."
 thailand.317.t: "La guerre de juillet, engagement militaire complet"
 thailand.317.d: "Les forces thaïlandaises et cambodgiennes se sont affrontées dans un engagement frontalier d'une semaine près de Ta Muen Thom et Preah Vihear. Des échanges d'artillerie ont fait des victimes des deux côtés. L'ASEAN a convoqué un sommet d'urgence."
 thailand.317.a: "Accepter le cessez-le-feu de l'ASEAN après avoir démontré sa force."
 thailand.317.b: "S'enterrer et tenir les gains."
 thailand.318.t: "Les tensions se rallument à la frontière"
 thailand.318.d: "Malgré l'accord de cessez-le-feu, les affrontements ont repris le long de la frontière contestée. L'embrasement de décembre teste si les deux pays peuvent tenir leur accord ou retomber dans un conflit ouvert."
 thailand.318.a: "Réaffirmer le cessez-le-feu."
 thailand.318.b: "Reprise des hostilités."
 thailand.319.t: "Washington dit non au F-35"
 thailand.319.d: "Les États-Unis ont décliné la demande formelle de la Thaïlande pour des chasseurs F-35 Lightning II, citant des restrictions de transfert technologique et des préoccupations quant à la relation de la Thaïlande avec la Chine."
 thailand.319.a: "Poursuivre le programme Gripen E/F."
 thailand.319.b: "Accepter le F-16V Block 70 à la place."
 thailand.319.c: "Basculer vers le J-10CE. Pékin fournira."
 thailand.320.t: "Paetongtarn destituée par la justice"
 thailand.320.d: "La Cour constitutionnelle thaïlandaise a destitué la Première ministre Paetongtarn Shinawatra après une conversation téléphonique fuitée dans laquelle elle semblait saper une institution indépendante. Anutin Charnvirakul de Bhumjaithai est nommé Premier ministre par intérim."
 thailand.320.a: "Accepter le verdict."
 thailand.320.b: "Contester la décision."
 thailand.321.t: "Anutin prend la barre"
 thailand.321.d: "Anutin Charnvirakul dirige un gouvernement par intérim avec le soutien de confiance et d'approvisionnement du Parti du peuple. Il a promis de nouvelles élections dans les quatre mois."
 thailand.321.a: "Le gouvernement par intérim commence son travail."
 thailand.322.t: "La Thaïlande aux urnes, février 2026"
 thailand.322.d: "Les Thaïlandais votent à une élection générale qui façonnera la direction politique du pays pour les quatre prochaines années. La guerre frontalière a poussé le sentiment nationaliste vers Bhumjaithai. Le Parti du peuple mène dans les sondages urbains."
 thailand.322.a: "Bhumjaithai l'emporte, et le mandat d'Anutin est confirmé."
 thailand.322.b: "La coalition du Parti du peuple prend le pouvoir."
 thailand_news.18.t: "L’ASEAN négocie un cessez-le-feu entre la Thaïlande et le Cambodge"
 thailand_news.18.d: "L'Association des nations de l'Asie du Sud-Est a médié avec succès un accord de cessez-le-feu entre la Thaïlande et le Cambodge, mettant fin à des semaines d'escarmouches frontalières près du complexe de temple de Ta Muen Thom. Le secrétaire général de l'ASEAN a salué le résultat comme la preuve que les institutions régionales peuvent contenir les points chauds bilatéraux avant qu'ils n'escaladent vers une guerre ouverte."
 thailand_news.18.a: "La région tient, pour l'heure."
 thailand_news.19.t: "Le parti d'Anutin domine les élections thaïlandaises"
 thailand_news.19.d: "Bhumjaithai a obtenu 193 sièges à l'élection générale thaïlandaise de février 2026, offrant à Anutin Charnvirakul un mandat écrasant et mettant fin à des mois d'incertitude par intérim. Le résultat consolide le centre politique conservateur-populiste de la Thaïlande et ouvre la voie à un mandat complet de quatre ans."
 thailand_news.19.a: "Un nouveau mandat pour le Royaume."
 thailand.330.t: "L'âme du corps des officiers"
 thailand.330.d: "Un argument silencieux parcourt l'état-major. Une faction veut une armée professionnelle, apolitique, de techniciens compétents. L'autre veut une caste guerrière célébrée, fierté et épée de la nation. Le choix que le Royaume fait maintenant façonnera le corps des officiers pour une génération."
 thailand.330.a: "Construire un corps professionnel."
 thailand.330.b: "Cultivez le prestige martial."
 thailand.334.t: "Le sous-marin mis en service"
 thailand.334.d: "Des années après la controverse des moteurs, le premier bâtiment S26T est enfin mis en service dans la Marine royale thaïlandaise. L'équipage s'est durci pour ce jour. Quelles que soient les politiques de l'achat, la Thaïlande exploite désormais un sous-marin moderne, et l'équilibre régional bascule un peu vers le sud."
 thailand.334.a: "La flotte prend la mer."
 thailand_news.26.t: "Gripens sur Bangkok"
 thailand_news.26.d: "La Force aérienne royale thaïlandaise a pris livraison de ses premiers chasseurs polyvalents JAS 39 Gripen, les faisant voler en formation au-dessus de la capitale pour marquer l'étape. Les jets suédois donnent à la Thaïlande une véritable capacité de combat aérien de quatrième génération et un pied dans la guerre aérienne moderne en liaisons de données."
 thailand_news.26.a: "Les cieux du Royaume sont gardés."
 thailand_news.27.t: "Les armes thaïlandaises sur le marché mondial"
 thailand_news.27.d: "Le nouveau Bureau d'export de la défense de Thaïlande a annoncé sa première vague de contrats à l'étranger. Véhicules blindés, artillerie et munitions destinés à des acheteurs d'Asie du Sud-Est et au-delà. L'industrie de défense du Royaume, naguère une ligne budgétaire, devient une source de recettes d'export."
 thailand_news.27.a: "Fabriqué en Thaïlande, vendu au monde."
 thailand_news.28.t: "Une nation en armes"
 thailand_news.28.d: "Bangkok a dévoilé un programme de défense totale. Il apporte des réserves élargies, des exercices de défense civile dans chaque province, et une doctrine qui traite la société entière comme la dernière ligne de résistance. Les critiques parlent de militarisation, le gouvernement de prudence."
 thailand_news.28.a: "La nation entière se tient prête."
 SIA_expansionism_threat: "Expansionnisme thaïlandais"
 thailand.380.t: "Ingénieurs à l'isthme"
 thailand.380.d: "Le verdict de la commission de faisabilité est rendu. La tranchée est dure, mais elle est possible. La seule question qui reste est celle qui a tué le projet pendant un siècle : qui paie. Trois offres étrangères sont sur la table du cabinet, à côté de l'option de le financer nous-mêmes. Chacune porte un prix qui ne se mesure pas seulement en baht."
 thailand.380.a: "Prendre le financement des Nouvelles routes de la soie de Pékin. Bon marché, rapide, et nous nous inquiéterons des termes plus tard."
 thailand.380.b: "Choisir le Japon. Plus lent et plus cher, mais bâti pour durer et sans clauses cachées."
 thailand.380.c: "Faire venir un consortium international. Échelonné, partagé, et redevable à aucune puissance unique."
 thailand.380.e: "Le construire nous-mêmes. Le canal sera thaïlandais jusqu'au dernier bollard."
 thailand.381.t: "Sol cassé"
 thailand.381.d: "Les batardeaux sont enfoncés, les premiers mètres cubes de déblais sont extraits, et la grande tranchée de l'isthme de Kra a commencé pour de bon. Les travaux procéderont par phases, chacune un nouvel test du nerf du Trésor."
 thailand.381.a: "Que le creusement commence."
 thailand.382.t: "Une phase terminée"
 thailand.382.d: "Une autre étape du canal est achevée et signée par les ingénieurs. La tranchée est plus profonde, les ouvrages plus avancés, et le cabinet s'accorde un instant de fierté prudente avant la prochaine facture."
 thailand.382.a: "Passons à la phase suivante."
 thailand.383.t: "Dépassement de coûts"
 thailand.383.d: "La dernière phase a fait sauter le budget. Roche dure, galerie inondée, et un devis révisé du contractant ont laissé le bureau de projet demander une décision au cabinet. Trouver l'argent, ou accepter que le canal ouvre plus tard que promis."
 thailand.383.a: "Verser l'argent et tenir le calendrier."
 thailand.383.b: "Accepter le retard. Le Trésor d'abord."
 thailand.384.t: "Le canal est prêt"
 thailand.384.d: "La dernière porte d'écluse est posée, le bief de partage est inondé, et les pilotes ont effectué leurs premiers transits sur lest. Le canal de Kra est achevé, il ne manque que le ruban. Le Royaume peut désormais déclarer le mégaprojet terminé."
 thailand.384.a: "Couper le ruban et ouvrir le canal."
 thailand.385.t: "Sabotage à la tranchée"
 thailand.385.d: "Une explosion à une station de pompage et une piste d'acheminement coupée portent la signature de l'insurrection du Deep South. Le canal traverse un terrain contesté, et les hommes qui s'opposent à Bangkok ont trouvé une cible qui vaut un titre. Le bureau de projet veut une décision. Durcir les ouvrages, ou parler aux locaux."
 thailand.385.a: "Renforcer la sécurité le long du corridor."
 thailand.385.b: "Négocier avec les chefs locaux. Acheter la paix, pas seulement des gardes."
 thailand.386.t: "Pékin rappelle le prêt"
 thailand.386.d: "Les dépassements ont déclenché une clause de l'accord des Nouvelles routes de la soie, et les négociateurs de Pékin sont arrivés à Bangkok avec un dossier d'options, toutes favorables à la Chine. La dette libellée en yuan est devenue un levier, et le canal lui-même est la garantie. Le cabinet doit choisir comment répondre à l'appel."
 thailand.386.a: "Concéder un bail d'exploitation et laisser Pékin prendre une part des péages."
 thailand.386.b: "Restructurer à des conditions dures. Rembourser et garder le canal thaïlandais."
 thailand.386.c: "Faire défaut. Le canal est à nous, que les marchés fassent le pire."
 thailand.388.t: "Fuite des capitaux"
 thailand.388.d: "Le défaut a affolé les marchés. Les investisseurs étrangers se retirent, le baht glisse, et la banque centrale dépense des réserves pour ralentir la panique. Les dégâts sont graves, mais un souverain qui a tenu bon les surmontera, avec le temps."
 thailand.388.a: "Traverser la tempête."
 thailand.389.t: "Washington et Delhi prennent note"
 thailand.389.d: "Un bail d'exploitation chinois sur le Kra a sonné l'alarme de Washington à New Delhi. Les deux capitales craignent un goulet dans la poche de Pékin, et toutes deux regardent si Bangkok les rassurera, ou s'inclinera davantage vers l'est."
 thailand.389.a: "Rassurer les deux et dépenser le capital politique pour les garder de notre côté."
 thailand.389.b: "S'appuyer sur Pékin. Le partenariat est fixé, que l'Occident s'ajuste."
 thailand.390.t: "Le détroit perd son monopole"
 thailand.390.d: "Les premiers pétroliers chargés transissent le Kra, et les grands ports du détroit de Malacca comptent le coût. Singapour et Kuala Lumpur, qui ont bâti leur fortune sur l'ancien goulet, voient leurs recettes de transit s'écouler vers le nord, et ils ne pardonneront pas de sitôt au Royaume qui les a drainées."
 thailand.390.a: "Deux océans répondent désormais à Bangkok."
 thailand.391.t: "Quel type de canal ?"
 thailand.391.d: "Le canal est ouvert, mais que doit-il être ? Une forteresse que la marine tient par la force, fermée aux rivaux et hérissée de batteries ? Ou un passage international neutre, ouvert à tous les pavillons et garanti par traité ? Le choix définira la place de la Thaïlande parmi les puissances maritimes pour une génération."
 thailand.391.a: "Fortifier le Kra pour le défendre et le dénier."
 thailand.391.b: "Ouvrir le Kra à tous ceux qui paient le péage en paix."
 thailand_news.20.t: "Deux océans, un royaume"
 thailand_news.20.d: "Après des années de labeur, des milliards de baht, et une géopolitique qu'aucun ingénieur n'aurait pu prévoir, le canal de Kra est ouvert. Pour la première fois, les navires passent entre la mer d'Andaman et le golfe de Thaïlande sans contourner la péninsule malaise. La carte du commerce asiatique a été redessinée, et Bangkok tient la plume."
 thailand_news.20.a: "Un canal un siècle en gestation."
 thailand.393.t: "Paria de la région"
 thailand.393.d: "Le masque est tombé. La volonté de Bangkok de soumettre ses voisins a dépouillé toute prétention au leadership de l'ASEAN. Les capitales d'Asie du Sud-Est reculent, et le monde plus large recalcule. La Thaïlande n'est plus le président de la région. Elle en est la menace, et les murs diplomatiques et économiques se dressent déjà."
 thailand.393.a: "Qu'ils nous craignent. On n'a jamais bâti un empire avec des amis."
 thailand.394.t: "Washington condamne Bangkok"
 thailand.394.d: "Les États-Unis ont publié une condamnation nette de l'agression thaïlandaise en Asie du Sud-Est. Washington signale qu'il se tiendra aux côtés des États menacés de la région, pesant des garanties et poussant ses partenaires à se serrer les rangs contre le prétendant hégémonique. L'influence américaine que Bangkok courtisait autrefois s'écoule."
 thailand.394.a: "La désapprobation américaine n'arrêtera pas la marche."
 thailand.395.t: "La main ouverte de Pékin"
 thailand.395.d: "Là où Washington recule, Pékin s'avance. La Chine voit dans une Thaïlande isolée et agressive un partenaire utile, une puissance qui a brûlé ses ponts avec l'Occident et la région, et qui n'a plus où se tourner. Le statut de paria de Bangkok est l'opportunité de Pékin, et la main tendue vient avec des ficelles que le Royaume ne peut plus se permettre de refuser."
 thailand.395.a: "Si l'Est nous veut, ainsi soit-il."
 thailand.431.t: "Une invitation de Bangkok"
 thailand.431.d: "La Thaïlande a étendu une invitation formelle à rejoindre son Organisation du traité de l'Asie du Sud-Est. Le pacte offre un commandement partagé, une sécurité mutuelle et une voix régionale unie sous le leadership de Bangkok. Pourtant l'ASEAN a toujours gardé son indépendance, et lier notre sort à la Thaïlande n'est pas un petit pas. Le choix est nôtre à faire librement, et nôtre à défaire s'il ne nous sert plus."
 thailand.431.a: "Nous acceptons. Notre sécurité est plus forte partagée."
 thailand.431.b: "Nous déclinons. Notre indépendance n'est pas à troquer."
 thailand.425.t: "[FROM.GetNameDefCap] signe le traité"
 thailand.425.d: "La réponse de [FROM.GetNameDefCap] est oui. Leur délégation est en route pour Bangkok pour signer, et l'Organisation du traité de l'Asie du Sud-Est gagne un membre. Chaque signature rend la suivante plus facile à obtenir."
 thailand.425.a: "Un siège de plus à la table."
 thailand.426.t: "[FROM.GetNameDefCap] décline l'invitation"
 thailand.426.d: "[FROM.GetNameDefCap] nous a remerciés pour l'offre et l'a refusée. Le langage est chaleureux et la réponse est non. Un pacte de ce type ne peut être imposé à personne, et la porte reste ouverte."
 thailand.426.a: "Leur choix. L'offre tient."
 SIA_kra_fortress_threat: "Fortifications du canal de Kra"
 SIA_kra_default_threat: "Défaut souverain thaïlandais"
 SIA_kra_chokepoint_threat: "Le goulet de Kra"
 SIA_asean_hegemon_threat: "Offensive thaïlandaise pour l'hégémonie de l'ASEAN"
 thailand.410.t: "La carte d'un plus grand Royaume"
 thailand.410.d: "Les vieilles cartes sont ressorties, celles qui montrent le Lan Na, les collines shan, les provinces perdues du Cambodge et du Laos et le Sud malais comme thaïlandais de droit. Le mouvement pan-thaï a désormais une voix au cabinet, et il pose la question clairement. Le Royaume proclamera-t-il son irrédentisme au monde, ou poursuivra-t-il les mêmes fins d'une main plus douce ? Toutes les grandes puissances regardent comment Bangkok répond."
 thailand.410.a: "Le proclamer. Ces terres sont thaïlandaises, et le monde doit le savoir."
 thailand.410.b: "En silence. Nous bâtissons la position sans faire cliqueter le sabre."
 thailand.411.t: "Un peuple, un destin"
 thailand.411.d: "L'idée pan-thaïe n'est plus une romance de fringe d'officiers et d'historiens. Les rassemblements remplissent Sanam Luang, et la presse porte les bannières d'une nation tai unique s'étendant du Yunnan à l'isthme. Le mouvement a désormais un visage public, et le gouvernement choisit de lui en donner un aussi."
 thailand.411.a: "Que la nation entende son propre nom."
 thailand.412.t: "Le bambou dans le vent"
 thailand.412.d: "La Thaïlande plie mais ne casse pas. En refusant de choisir entre Washington et Pékin, Bangkok a gardé les deux à la courtiser : la diplomatie du bambou d'autrefois, pratiquée d'une main moderne. Les deux capitales envoient des signaux chaleureux, et aucune ne peut se permettre de pousser le Royaume dans les bras de l'autre."
 thailand.412.a: "Nous gardons nos options ouvertes, et nos amis dans le doute."
 thailand.413.t: "La question du cycle du combustible"
 thailand.413.d: "Les nouveaux réacteurs thaïlandais tournent sur un cycle du combustible souverain, et un cycle souverain signifie l'enrichissement, et l'enrichissement signifie que la ligne entre l'énergie civile et une option d'armes s'amincit. L'AIEA veut des garanties renforcées, Washington des assurances, et la région veut savoir ce que Bangkok entend. Il n'y a pas de programme de bombe sur les livres, mais la capacité est désormais à portée, et le Royaume doit décider jusqu'où marcher vers elle."
 thailand.413.a: "Les défier. L'enrichissement souverain est notre droit, couverture ou non."
 thailand.413.b: "Les rassurer. Accepter les garanties complètes et garder la confiance."
 thailand.413.a_tooltip: "§RAlerte à la prolifération.§! La Thaïlande gagne la menace nommée §YDéfi de l'enrichissement souverain§!, les États-Unis se retournent nettement contre Bangkok tandis que l'Inde se méfie, et §Rl'influence américaine en Thaïlande chute de 15 %§!."
 thailand.414.t: "La charte des gardiens"
 thailand.414.d: "La constitution est réécrite pour que les veilleurs n'aient jamais à dormir. Conseils nommés, pouvoirs réservés, et un Sénat qui répond à la caserne. L'État profond n'est plus une habitude informelle mais une garantie écrite. L'ordre est assuré, et le prix se paie dans la mort silencieuse d'une politique sans entraves."
 thailand.414.a: "La stabilité, rendue permanente"
 SIA_guardianship_cost_tt: "La communauté internationale recule devant l'enracinement permanent des gardiens.\n - §RTrésor -20§!\n - §RL'opinion des États-Unis et du Royaume-Uni chute§!"
 thailand.415.t: "Pax Aseana"
 thailand.415.d: "De Manille à Jakarta, de Hanoï à Singapour, les capitales d'Asie du Sud-Est lèvent leur verre à Bangkok. Là où elles craignaient autrefois une prétention thaïlandaise à la maîtrise, elles voient désormais un garant, un Royaume qui mène par la confiance, fonde son pacte sur le consentement, et tient la paix qu'il a promise. C'est la Pax Aseana, et la Thaïlande y siège en tête non comme conquérant mais comme partenaire."
 thailand.415.a: "Une région en paix, et la Thaïlande sa pierre angulaire."
 thailand.416.t: "Après le général"
 thailand.416.d: "Le général a son Premier ministère, sa lune de miel, et sa transition gérée encore devant lui. L'establishment peut s'enraciner davantage en saturant les institutions et en resserrant l'emprise du parti sur la machine d'État, ou lire la salle, institutionnaliser ses gains, et reculer vers une posture plus civile avant que la patience du public ne s'épuise."
 thailand.416.a: "S'enraciner. L'establishment resserre son emprise."
 thailand.416.b: "Institutionnaliser. Consolider les gains, adoucir le visage."
 thailand.417.t: "Le moteur de l'Est démarre"
 thailand.417.d: "Les grues le long de la Côte est ne s'arrêtent jamais. Nouveaux rails, nouvelles pistes, nouveaux parcs industriels. Le Corridor économique de l'Est a atteint le décollage, et l'investissement commence à se composer sur lui-même. Chonburi, Rayong et Chachoengsao deviennent la salle des machines de l'économie thaïlandaise."
 thailand.417.a: "Le corridor s'éveille."
 SIA_nuclear_defiance_threat: "Défi à l’enrichissement souverain"
 SIA_tsunami_warning: "Réseau d'alerte aux tsunamis"
 thailand.363.t: "Le piège de la productivité"
 thailand.363.d: "Les années de croissance sont finies. Une génération a quitté l'université pour une économie figée de salaires stagnants, de travail d'usine délocalisé, et d'un marché immobilier qu'elle n'entrera jamais. C'est la cohorte la mieux éduquée de l'histoire thaïlandaise et elle n'avance nulle part, et elle sait exactement qui blâmer. Les carrefours de Bangkok se remplissent de saluts à trois doigts, et les hashtags montent plus vite que la police ne peut les lire. Move Forward parle leur langue. La politique lente et confortable du passé ne les retiendra pas."
 thailand.363.a: "Ouvrir le système. Concéder la réforme, laisser respirer la nouvelle politique."
 thailand.363.b: "L'ordre d'abord. Déblayer les rues et changer de sujet vers la nation."
 thailand.363.c: "Acheter du temps par la croissance. Basculer vers la relance et desserrer l'étau."
 thailand.364.t: "Deux Thaïlande"
 thailand.364.d: "Il y a deux pays dans le royaume. L'un est Bangkok et les capitales provinciales, les diplômés, les tours de bureaux, les cafés où la réforme est une conclusion d'avance. L'autre est la ceinture du riz et le Nord-Est, où les populistes ont bâti leur machine sur les fonds villageois et les subventions au riz et n'ont jamais lâché. Ils veulent des choses différentes, craignent des avenirs différents, et votent pour des partis différents. Un gouvernement doit choisir où planter son drapeau, ou prétendre qu'il peut se tenir au-dessus de la ligne."
 thailand.364.a: "Courtiser la capitale et les diplômés, l'avenir urbain de la Thaïlande."
 thailand.364.b: "Courtiser la ceinture du riz, la base de l'intérieur qui livre."
 thailand.364.c: "Se tenir au-dessus de la fracture. Seul le trône unit les deux Thaïlandes."
 thailand.365.t: "L'écho de la répression"
 thailand.365.d: "Déblayer les rues n'a pas déblayé le grief. Il l'a aiguisé. Le mouvement dispersé s'est regroupé, plus large et plus en colère, ses chefs désormais martyrs et ses exigences désormais non négociables. Ce qui était une protestation devient la cause définissant une génération, et chaque matraque de l'an dernier a recruté dix de plus cette année."
 thailand.365.a: "On ne peut plus reculer. Traverser la tempête."
 thailand.418.t: "La jungle s'agite"
 thailand.418.d: "La misère a trop duré. Dans les districts de l'intérieur que l'État a oubliés, de vieux noms resurgissent. Des cadres qui ont porté le fusil pour le Parti communiste de Thaïlande avant l'amnistie, désormais gris mais non oubliés, et une génération de leurs petits-enfants sans plus rien à perdre. Des cercles d'étude se réunissent à la lampe, et le drapeau rouge, plié depuis quarante ans, est secoué. La jungle qui a avalé la dernière insurrection est toujours là. Tout comme le grief qui l'a remplie."
 thailand.418.a: "Laisser les cellules s'organiser. La campagne est à nous à perdre."
 thailand.418.b: "Écraser la clandestinité. Ramasser les cadres avant que cela ne s'étende."
 thailand.418.c: "Assécher le marais du grief. Verser de l'argent dans les districts."
 thailand.74.t: "L'affaire des actifs"
 thailand.74.d: "La Cour constitutionnelle pèse si le Premier ministre a dissimulé des participations derrière sa femme de ménage, son chauffeur et son garde. Un verdict de culpabilité met fin au Premier ministère avant qu'il ne commence. Les juges sont divisés, et le palais, la presse et les généraux regardent tous comment le verdict est atteint."
 thailand.74.a: "Peser sur le banc. Le verdict ira notre chemin."
 thailand.74.b: "Se soumettre au processus et laisser la cour décider."
 thailand.75.t: "Tak Bai"
 thailand.75.d: "Dans le Deep South musulman, des soldats entassent des centaines de manifestants ligotés dans des camions de l'armée. À l'arrivée du convoi, quatre-vingt-cinq sont morts, la plupart asphyxiés. Les images font le tour du monde. Le corps des officiers se serre autour des siens, et la question est de savoir si le gouvernement civil osera demander ce qui s'est passé."
 thailand.75.a: "Soutenir l'armée. Pas d'enquête."
 thailand.75.b: "Ordonner une enquête. L'armée nous répond."
 thailand.76.t: "Les scanners CTX"
 thailand.76.d: "La facture des scanners de détection de bombes du nouvel aéroport a triplé, et la marge a disparu dans une chaîne d'intermédiaires proches du cabinet. Un audit honnête embarrasserait le gouvernement. L'enterrer empoche la différence mais nourrit l'histoire naissante d'une administration qui traite le Trésor comme un compte de famille."
 thailand.76.a: "Enterrer l'audit et empocher la différence."
 thailand.76.b: "Annuler le contrat et couper les pertes."
 thailand.77.t: "Faire taire les critiques"
 thailand.77.d: "Les émissions nocturnes d'un magnat des médias sont devenues un point de ralliement pour la rue antigouvernementale, et le diffuseur indépendant iTV glisse du collier. Procès en diffamation, pression sur les licences et une propriété amie pourraient les ramener à l'ordre, au prix de confirmer tout ce que les critiques disent d'un pouvoir d'un seul homme rampant."
 thailand.77.a: "Ramener la presse à l'ordre."
 thailand.77.b: "Laisser la presse courir et répondre aux mots par des mots."
 thailand.78.t: "Un Parlement à une seule voix"
 thailand.78.d: "Le parti au pouvoir a gagné une majorité absolue, le premier gouvernement d'un seul parti de l'histoire thaïlandaise. Sans coalition à gérer et les agences indépendantes saturées de loyalistes, le Premier ministre peut gouverner sans contrôle. Pour la ceinture du riz c'est un mandat, et pour l'establishment de Bangkok et la caserne c'est une dictature élective en formation."
 thailand.78.a: "Gouverner sans contrôle. Le peuple nous a donné cela."
 thailand.78.b: "Courtiser l'opposition et partager la table."
 thailand.73.t: "La vente de Shin Corp"
 thailand.73.d: "La famille du Premier ministre vend son empire des télécoms à un fonds d'État singapourien pour quelque soixante-treize milliards de baht et, par une restructuration commode, ne paie pas un satang d'impôt. La légalité est impeccable, mais l'optique est catastrophique. En quelques jours les foules en chemises jaunes remplissent les avenues, et l'armée commence à demander tout haut si la constitution lie encore l'homme qui a vendu un actif national sans impôt."
 thailand.73.a: "Empocher les milliards. C'était tout légal."
 thailand.73.b: "Payer l'impôt et désamorcer la fureur."
 thailand.420.t: "Un mandat populiste"
 thailand.420.d: "Le pouvoir est passé au camp populiste. La ceinture du riz et les pauvres urbains ont de nouveau leur gouvernement, et avec lui le programme thaksiniste des fonds villageois, des soins bon marché, et d'un chef qui parle leur langue. Les esprits de l'ancien establishment ne tiennent plus, et le réseau du palais et le caucus réformateur s'effacent à mesure que la nouvelle machine prend les leviers. La caserne, comme toujours, regarde."
 thailand.420.a: "La campagne a son gouvernement."
 thailand.421.t: "L'establishment revient"
 thailand.421.d: "Les leviers sont passés à l'establishment royaliste, que ce soit par les urnes, un marché de palais ou les chars à l'aube. La monarchie de réseau se réaffirme. Les conseillers privés, les généraux et les grandes maisons se referment autour du trône. Les esprits de la machine populiste se dissolvent avec son mandat, et le mouvement réformateur est balayé de la table. Le royaume se stabilise sous des mains familières."
 thailand.421.a: "Le royaume est en ordre."
 thailand.422.t: "La vague réformatrice"
 thailand.422.d: "Une nouvelle génération a pris le pouvoir. Le mouvement réformateur qui a marché dans les rues siège désormais au cabinet, et l'agenda se tourne vers le démantèlement de l'ancien ordre — la conscription, les monopoles, les institutions intouchables. Les esprits du gouvernement précédent s'effacent à mesure que ses chefs tombent. La question est de savoir si l'establishment laissera l'expérience courir."
 thailand.422.a: "L'avenir, c'est maintenant."
 thailand.423.t: "La Cour décide"
 thailand.423.d: "La Cour constitutionnelle a le parti au pouvoir dans sa ligne de mire. Une ordonnance de dissolution est rédigée et l'exécutif pourrait être destitué par fiat judiciaire, comme tant d'autres avant lui. Le gouvernement peut s'incliner devant le verdict et céder le pouvoir à ses rivaux, ou défier le banc et affronter les conséquences."
 thailand.423.a: "Accepter le verdict et se retirer avec grâce."
 thailand.423.b: "Défier la cour. Nous répondons aux électeurs, pas aux juges."
 thailand.424.t: "Les Démocrates tiennent"
 thailand.424.d: "Le pouvoir est revenu au Parti démocrate, le plus ancien du Royaume, que ce soit par un tour aux urnes ou une cour qui a remis l'exécutif à l'opposition. Pas de raz-de-marée, pas de milliardaire charismatique, seulement le métier patient et sans éclat de gouverner en coalition civile large, misant l'avenir sur les institutions plutôt que sur un chef unique. Les esprits du gouvernement précédent se dissolvent avec son mandat. Et dans la ceinture du riz, la machine de Thaksin rassemble déjà ses forces pour le prochain round."
 thailand.424.a: "L'establishment tient la ligne."
 thailand.430.t: "À quoi servent les bombes ?"
 thailand.430.d: "Les premières ogives thaïlandaises sont réelles, mais une arme non déclarée ne dissuade personne. Le Conseil de sécurité nationale doit trancher la question que tout État nucléaire doit résoudre. Dans quelles circonstances le Royaume les utiliserait-il jamais ? La posture que nous déclarons façonnera la lecture de nos intentions par la région et les grandes puissances."
 thailand.430.a: "Riposte seulement. Nous frappons seulement si on nous frappe avec des armes stratégiques."
 thailand.430.b: "Riposte tactique et stratégique. Nous répondons à toute attaque nucléaire en nature."
 thailand.430.c: "Premier usage déclaré. Que nos ennemis se demandent, et qu'ils craignent."
 thailand_news.30.t: "La Thaïlande rejoint le club nucléaire"
 thailand_news.30.d: "Bangkok a confirmé ce que les services de renseignement murmuraient depuis des mois. Le Royaume de Thaïlande possède des armes nucléaires. Les capitales d'Asie et au-delà s'empressent de recalculer l'équilibre des puissances alors qu'un nouvel entrant franchit le seuil."
 thailand_news.30.a: "La carte a changé."
 SIA_threat_thai_bomb: "Programme d'armes nucléaires de la Thaïlande"
 SIA_threat_thai_enrichment: "Programme d'enrichissement d'uranium de la Thaïlande"
 SIA_threat_thai_first_use: "La posture de première utilisation déclarée par la Thaïlande"
 thailand.432.t: "La stratégie ne peut attendre"
 thailand.432.d: "Les années d'atelier ont rendu la Thaïlande assez riche pour temporiser, et les ministères se sont disputés trop longtemps sur le plan d'échappée. La frontière n'attend pas, et le Viêt Nam referme l'écart. La Stratégie nationale doit être adoptée maintenant."
 thailand.432.a: "L'adopter par décret"
 thailand.432.b: "Construire d’abord un consensus"
 thailand.433.t: "Un bouclier du Nord"
 thailand.433.d: "Bangkok a demandé à Pékin d'étendre une garantie formelle sur le Royaume. Un engagement chinois ancrerait le basculement de la Thaïlande vers le continent et dissuaderait tout rival tenté de tester ses frontières. Le prix est un engagement permanent loin de chez soi."
 thailand.433.a: "Étendre notre protection"
 thailand.433.b: "Bangkok peut tenir seule"
 SIA_frontier_overextension_idea: "Surextension des frontières"
 SIA_frontier_overextension_idea_desc: "Les divisions engagées sur les marches occidentales sont des divisions qui ne veillent pas sur Bangkok. L'armée royale thaïlandaise est plus étirée que le gouvernement ne tient à l'admettre, et le public ressent la tension d'un engagement pris avant le premier coup de feu."
 SIA_regional_pariah: "Paria régional"
 SIA_regional_pariah_desc: "Bangkok a avalé tout entier les marches birmanes. Washington et Pékin condamnent l'accaparement, les capitales de l'ASEAN regardent nerveusement leurs propres frontières, et les exportateurs thaïlandais paient le nom terni du royaume dans chaque contrat à l'étranger."
 SIA_frontier_partners: "Partenaires frontaliers"
 SIA_frontier_partners_desc: "Les terres frontalières recouvrées sont gouvernées par des clients et des pactes plutôt que par l'occupation. Le soft power est moins cher que les garnisons. L'administration reste légère et les équipes de construction se déplacent librement, sans le recul diplomatique qu'aurait apporté l'annexion."
 SIA_royal_guidance_idea: "Sous le regard royal"
 SIA_royal_guidance_idea_desc: "Les orientations annuelles du palais stabilisent le royaume et le murent contre l'ingérence étrangère, mais un gouvernement élu qui s'en remet au trône voit son propre écrit ne courir que jusqu'à un certain point."
 SIA_three_pillars_idea: "Nation, Religion, Roi"
 SIA_three_pillars_idea_desc: "Un nationalisme officiel soudé au trône et au Sangha. La majorité bouddhiste est liée contre la subversion et les idées étrangères, au prix d'un esprit public plus terne et plus déférent."
 SIA_deep_south_grievance: "Grief dans le Sud"
 SIA_deep_south_grievance_desc: "Dans les provinces malaises-musulmanes, un credo bouddhiste-royaliste sonne comme une exclusion. Les griefs de Patani se durcissent, et Bangkok paie en stabilité et en capital politique pour garder le couvercle."
 SIA_scarred_coast: "La côte cicatrisée"
 SIA_scarred_coast_desc: "Sans l'argent de l'État derrière la reconstruction, les resorts d'Andaman restent à demi ruinés pendant des années. Les hôtels sont silencieux, les décombres non déblayés, et les touristes vont ailleurs."
 SIA_new_reign_mourning: "Un royaume en deuil"
 SIA_new_reign_mourning_desc: "La nation pleure le roi défunt. La vie publique est assourdie, le divertissement suspendu, et la politique observe une trêve malaisée."
 SIA_ninth_reign_barami: "Barami du neuvième règne"
 SIA_ninth_reign_barami_desc: "Le roi Bhumibol a régné plus d'un demi-siècle, plus longtemps qu'aucun monarque sur terre. Son barami, l'autorité morale gagnée à travers ces décennies, se tient au-dessus de chaque politicien et de chaque général. En un moment de crise, un mot du palais règle ce qu'aucun cabinet ne peut, et le trône protège le royaume des desseins étrangers."
 SIA_ninth_reign_zenith: "La monarchie de réseau à son zénith"
 SIA_ninth_reign_zenith_desc: "Le palais ne se contente plus de régner. Par le Conseil privé, les cours et une toile d'officiers et d'hommes d'affaires loyaux, la Couronne pénètre chaque institution de l'État. La parole du roi porte le poids de la loi, la dissidence ne trouve pas d'achat, et l'influence étrangère se brise contre un mur de consensus royaliste."
 SIA_tenth_reign_barami: "Barami du dixième règne"
 SIA_tenth_reign_barami_desc: "Le trône est passé au roi Vajiralongkorn, mais la révérence ne s'hérite pas. Le nouveau monarque tient la charge que son père tenait sans l'autorité morale qui la remplissait autrefois. Le palais stabilise encore le royaume et le garde contre l'ingérence étrangère, mais chaque levier n'est qu'un écho plus faible du neuvième règne."
 SIA_two_thailands: "Deux Thaïlande"
 SIA_two_thailands_desc: "Il y a deux pays à l'intérieur d'une seule frontière. Bangkok et les plaines centrales tiennent la richesse, les ministères et l'ancien establishment. Le Nord et le Nord-Est ruraux tiennent les voix et une conviction qui se durcit que leurs bulletins sont volés par les cours et les coups. Le fossé entre eux polarise chaque élection et force le Trésor à acheter une paix qu'il peut à peine se permettre."
 SIA_three_pillars_start: "Nation, Religion, Roi"
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$"
 SIA_populist_machine: "La machine populiste"
 SIA_populist_machine_desc: "Fonds villageois, cartes de santé, allègement de la dette. Une machine politique qui convertit la livraison gouvernementale en loyauté électorale, cycle après cycle."
 SIA_yellow_shirts_idea: "Les Chemises jaunes"
 SIA_yellow_shirts_idea_desc: "L'Alliance du peuple pour la démocratie est royaliste, urbaine, de classe moyenne, et convaincue que la majorité électorale s'achète. Quand elles remplissent les rues, les gouvernements vacillent."
 SIA_red_shirts_idea: "Les Chemises rouges"
 SIA_red_shirts_idea_desc: "Le Front uni pour la démocratie contre la dictature est rural, du Nord et du Nord-Est. Ils ont gagné chaque élection qu'ils ont contestée et perdu chaque gouvernement qu'ils ont formé. Ils sont la majorité, et ils le savent."
 SIA_junta_government: "Gouvernement de junte"
 SIA_junta_government_desc: "Un conseil militaire gouverne par décret. L'ordre est imposé, la dissidence est « ajustée », et la question du retour des élections se voit répondre par un sourire et un report."
 SIA_guided_democracy: "Le système de 2017"
 SIA_guided_democracy_desc: "Un Sénat nommé, une stratégie contraignante de vingt ans, et des cours de disposition fiable. Les élections se tiennent, mais le terrain est clôturé."
 SIA_network_monarchy_idea: "Monarchie de réseau"
 SIA_network_monarchy_idea_desc: "Palais, conseil privé, armée et judiciaire forment une toile informelle d'autorité qui opère au-dessus de la politique électorale, et survit à chaque gouvernement."
 SIA_reform_momentum: "Élan réformateur"
 SIA_reform_momentum_desc: "Pour la première fois en une génération, l'énergie de la politique thaïlandaise est avec ceux qui veulent changer le système, non le gérer."
 SIA_consolidated_democracy_idea: "Une démocratie consolidée"
 SIA_consolidated_democracy_idea_desc: "Contrôle civil, gouvernement constitutionnel, et un public qui s'attend à ce que les coups soient de l'histoire. Les institutions démocratiques thaïlandaises tiennent enfin sur leurs propres fondations."
 SIA_republic_turmoil: "Troubles constitutionnels"
 SIA_republic_turmoil_desc: "La question républicaine a fendu chaque institution, chaque province et bien des familles. L'État endure, mais le consensus en dessous a disparu."
 SIA_pan_thai_irredentism: "Irrédentisme pan-thaï"
 SIA_pan_thai_irredentism_desc: "Le récit des territoires perdus est de nouveau doctrine d'État. Les peuples tai sont une nation, les cessions de 1893-1909 sont illégitimes, et l'histoire doit une correction à la Thaïlande."
 SIA_drug_war_stain: "Censure internationale"
 SIA_drug_war_stain_desc: "Des milliers d'exécutions extrajudiciaires pendant la guerre contre la drogue suivent la Thaïlande dans chaque forum des droits de l'homme et chaque négociation diplomatique."
 SIA_tourism_powerhouse: "Une puissance touristique"
 SIA_tourism_powerhouse_desc: "Des dizaines de millions de visiteurs par an font du tourisme un pilier de l'économie et de la marque thaïlandaise un actif mondial."
 SIA_tourism_powerhouse_2: "Politique industrielle du tourisme"
 SIA_tourism_powerhouse_2_desc: "Le tourisme passe d'aubaine saisonnière à pilier géré de la politique d'État. Une base de visiteurs diversifiée et à plus forte dépense paie un véritable impôt sur les sociétés et répond moins que jamais aux conglomérats de voyage étrangers."
 SIA_tourism_luxury_boom: "Vague de voyages de luxe"
 SIA_tourism_luxury_boom_desc: "Une vague de visiteurs à forte dépense remplit les resorts cinq étoiles et fait monter les recettes. La poussée s'estompe une fois la saison tournée."
 SIA_credit_boom_overheating: "Surchauffe du boom du crédit"
 SIA_credit_boom_overheating_desc: "L'argent bon marché a afflué plus vite que le système bancaire ne pouvait l'absorber, et les emprunteurs paient désormais la différence en taux plus élevés. La pression se relâche à mesure que le cycle se refroidit."
 SIA_sustainable_extraction: "Ressources gérées"
 SIA_sustainable_extraction_desc: "Les permis avancent lentement et les concessions restent étroites, mais l'État garde une main plus ferme sur qui profite de ce qui sort du sol et répond moins au capital étranger qui finance une extraction plus rapide ailleurs."
 SIA_digital_national_champions: "Champions numériques nationaux"
 SIA_digital_national_champions_desc: "Une poignée de plateformes favorisées par l'État dominent le marché par conception, faciles à taxer et simples à réguler, mais assez confortables dans leur position pour cesser de pousser à s'améliorer."
 SIA_detroit_of_asia_idea: "Détroit de l'Asie"
 SIA_detroit_of_asia_idea_desc: "La Côte est assemble des pick-up pour le monde. Les chaînes d'approvisionnement automobiles ancrent le manufacturier thaïlandais et tiennent le livre d'export en bonne santé."
 SIA_bamboo_diplomacy: "Diplomatie du bambou"
 SIA_bamboo_diplomacy_desc: "Ployer avec le vent, ne jamais casser. Bangkok garde l'alliance américaine, l'investissement chinois, et son propre conseil, tout à la fois."
 SIA_war_on_drugs_campaign: "Guerre contre la drogue"
 SIA_war_on_drugs_campaign_desc: "Listes noires, quotas et ambiguïté du tir à vue. Le commerce de la méthamphétamine recule, et l'État de droit aussi."
 SIA_deep_south_insurgency_1: "Southern Insurgency (Simmering)"
 SIA_deep_south_insurgency_1_desc: "The armed separatist revolt in Pattani, Yala and Narathiwat has quieted to a low simmer. Incidents are sporadic and the drag on the Kingdom is light. Intensity is below §Y30§!."
 SIA_deep_south_insurgency_2: "Southern Insurgency (Escalating)"
 SIA_deep_south_insurgency_2_desc: "The armed separatist revolt in Pattani, Yala and Narathiwat is escalating. Weekly incidents bite, and Bangkok's authority in the South is visibly contested. Intensity sits between §Y30§! and §Y59§!."
 SIA_deep_south_insurgency_3: "Southern Insurgency (Ablaze)"
 SIA_deep_south_insurgency_3_desc: "The armed separatist revolt in Pattani, Yala and Narathiwat is in open flame. Bombings and ambushes are routine, and the cost now reaches the army and the public alike. Intensity is §Y60§! or above."
 SIA_pacified_but_smoldering: "Pacifié mais couvant"
 SIA_pacified_but_smoldering_desc: "Le poing de fer a fonctionné. À la seule mesure que l'armée accepte, le Sud est calme. Mais une génération a grandi sous couvre-feu et checkpoint, et le grief est entré dans la clandestinité plutôt que de disparaître. L'incident occasionnel s'embrase encore, et les puits de recrutement ne sont pas à sec."
 SIA_royal_pacification: "Pacification royale"
 SIA_royal_pacification_desc: "Un calme géré et surveillé, tenu par le patronage et la présence sous l'égide royale. Le développement circule, les notables locaux sont cooptés, et la légitimité de la monarchie dans le Sud est discrètement restaurée. Pas un règlement, mais une intendance."
 SIA_pattani_autonomy: "Autonomie de Pattani"
 SIA_pattani_autonomy_desc: "Une administration spéciale autonome au sein d'une Thaïlande unitaire, avec un conseil régional élu, une scolarité en langue locale, et une part des recettes du Sud retenue au Sud. Le dividende de paix est réel, et le précédent inquiète les centralistes de Bangkok."
 SIA_limited_devolution: "Décentralisation limitée"
 SIA_limited_devolution_desc: "Le cadre d'autonomie a été dilué pour apaiser l'establishment. Une mesure d'administration locale, mais pas de véritable autogouvernement. Les armes se taisent pour l'heure, mais le règlement laisse le Sud et le centre insatisfaits."
 SIA_hearts_minds_education_strain: "Hearts and Minds Program"
 SIA_hearts_minds_education_strain_desc: "The outreach in the three provinces is paid for out of the education budget rather than the security budget. The schools ministry carries the bill for a year."
 SIA_southern_development_levy: "Prélèvement de développement du Sud"
 SIA_southern_development_levy_desc: "The development push in the three provinces diverts civilian industry into consumer output. The money flows south for a year, and the shelves at home feel it."
 SIA_peoples_constitution: "Constitution du peuple"
 SIA_peoples_constitution_desc: "Une nouvelle loi fondamentale écrite avec une large participation civique consacre les droits, le contrôle civil de l'armée et des institutions indépendantes, restaurant la confiance publique dans l'ordre constitutionnel."
 SIA_worlds_rice_bowl: "Le bol de riz du monde"
 SIA_worlds_rice_bowl_desc: "Le riz Hom Mali et Jasmine thaïlandais commande des prix premium sur tous les continents. Les recettes d'export agricole ancrent le compte courant, et chaque saison de récolte rétablit le poids diplomatique de Bangkok."
 SIA_bri_debt: "Exposition à la dette de la BRI"
 SIA_bri_debt_desc: "Les prêts d'infrastructure des Nouvelles routes de la soie comblent des lacunes que le budget ne peut, mais les termes de remboursement sont écrits à Pékin. La souveraineté fiscale de la Thaïlande se rétrécit à chaque accord signé."
 SIA_landslide_mandate: "Mandat du peuple"
 SIA_landslide_mandate_desc: "Une victoire écrasante a donné au gouvernement un véritable mandat populaire. La machine du parti est galvanisée, la base rurale mobilisée, et l'opposition sur le recul, mais les généraux regardent les chiffres très attentivement."
 SIA_ceo_state: "État du PDG"
 SIA_ceo_state_desc: "Le cabinet est devenu une salle de conseil et les ministères une holding. Les décisions bougent vite et la responsabilité plus lentement. Les contre-pouvoirs n'ont pas disparu. Ils sont simplement en restructuration."
 SIA_cult_of_the_ceo: "Culte du PDG"
 SIA_cult_of_the_ceo_desc: "Le Premier ministre a dispensé le théâtre de la consultation. Ses cotes d'approbation sont une arme, ses critiques des obstacles, et les procédures internes du parti sont ce qu'il dit qu'elles sont cette semaine. Le réseau royal se réunit plutôt plus souvent que d'habitude."
 SIA_dynasty_politics: "Politique de la dynastie"
 SIA_dynasty_politics_desc: "Le nom Shinawatra est désormais une dynastie, une marque, un réseau de patronage et un plan de succession pliés en une seule famille. La loyauté au parti et la loyauté à la famille sont devenues indiscernables."
 SIA_institutionalized_party: "Parti institutionnalisé"
 SIA_institutionalized_party_desc: "Le mouvement a survécu à l'exil, à deux coups et à dix-sept dissolutions de parti. Il est devenu quelque chose de plus durable qu'un chef unique, une véritable institution politique enracinée dans chaque province."
 SIA_judicialization: "Politique de la salle d'audience"
 SIA_judicialization_desc: "La Cour constitutionnelle est devenue un acteur politique à part entière. Chaque requête est une arme, et chaque arrêt une victoire pour une faction et une blessure pour une autre. L'opposition étudie le droit pour survivre."
 SIA_isoc_network: "Réseau ISOC"
 SIA_isoc_network_desc: "Le Commandement des opérations de sécurité intérieure traverse chaque province, rendant compte à l'armée plutôt qu'aux ministres élus. Sa grille de renseignement rend la portée de l'État invisible, omniprésente et remarquablement efficace."
 SIA_crown_property_idea: "Bureau des biens de la Couronne"
 SIA_crown_property_idea_desc: "Le bras commercial du palais détient des participations dans la terre, la banque et l'assurance valant des centaines de milliards de baht. La monarchie absolue est finie. La monarchie économique se porte très bien."
 SIA_uncle_tu_honeymoon: "La lune de miel de Prayut"
 SIA_uncle_tu_honeymoon_desc: "L'ordre rétabli, le PDRC hors des rues, et un gouvernement avec un plan de vingt ans. Pour l'heure, l'appétit public pour la stabilité donne au nouveau Premier ministre un degré inhabituel de tolérance."
 SIA_uncle_tu_fatigue: "Fatigue de Prayuth"
 SIA_uncle_tu_fatigue_desc: "Le Premier ministre qui promettait de rendre la politique ennuyeuse a réussi, de la mauvaise façon. L'agenda de réforme est bloqué, l'élection promise perpétuellement reportée, et les jeunes Thaïlandais ont commencé à demander quand exactement « temporaire » était censé s'achever."
 SIA_reform_spring: "Printemps des réformes"
 SIA_reform_spring_desc: "Une vague d'énergie civique a balayé le mouvement réformateur. Nouveaux visages, nouvelles exigences, et un climat dans les rues que les carrières des politiciens plus âgés n'ont pas vu en une génération. L'establishment le remarque, pas toujours avec plaisir."
 SIA_youthquake: "Tremblement de jeunesse"
 SIA_youthquake_desc: "Les campus universitaires, les fils des réseaux sociaux et les coins de rue crépitent d'énergie politique. De jeunes Thaïlandais qui n'ont jamais voté se présentent désormais aux élections, tiennent les bureaux de parti et lèvent de l'argent en ligne. Les technocrates en formation sont mieux éduqués qu'aucune génération avant eux."
 SIA_barracks_pushback: "Repoussement des casernes"
 SIA_barracks_pushback_desc: "Les officiers seniors ont fait clair, par des intermédiaires à la retraite, des silences pointus et des briefings de presse acérés, que le rythme de la réforme civile teste la patience institutionnelle de l'armée. L'armée contrôle encore ses propres promotions, budgets et affectations de bases."
 SIA_thai_republic: "République thaïlandaise"
 SIA_thai_republic_desc: "La monarchie constitutionnelle la plus ancienne du monde a accompli sa transformation. Un président élu au suffrage direct, un parlement pleinement souverain, et une constitution écrite sans veto militaire. Le changement n'a pas été sans sang, mais il a tenu."
 SIA_mandate_recovery: "Mandat du redressement"
 SIA_mandate_recovery_desc: "Le gouvernement a déclaré la reconstruction économique sa première priorité. Les coûts de consommation sont comprimés et les programmes de construction accélérés. Chaque baht d'investissement productif porte le plein soutien du gouvernement pour les deux prochaines années."
 SIA_mandate_order: "Mandat de l'ordre"
 SIA_mandate_order_desc: "Le premier coup du gouvernement est la stabilisation avant la réforme. Institutions renforcées, cours respectées, et dérive politique réprimée. Le pari est que l'ordre, livré de façon convaincante, gagne la confiance que la réforme exigera plus tard."
 SIA_mandate_outreach: "Mandat de l'ouverture"
 SIA_mandate_outreach_desc: "La diplomatie et le commerce sont les priorités annoncées du gouvernement. Les ambassades sont pleinement pourvues, les délégations ministérielles fréquentes, et le ministère du Commerce a reçu un budget élargi et une ligne directe vers l'agenda du Premier ministre."
 SIA_uneasy_compromise: "Un compromis difficile"
 SIA_uneasy_compromise_desc: "Les généraux siègent au cabinet et les politiciens gardent leur mandat, un gouvernement national qui tient le Royaume par la seule méfiance mutuelle. La stabilité s'achète au prix de l'action décisive. Chaque ministère est surveillé, chaque initiative négociée deux fois. L'arrangement stabilise le pays (§G+5 % de stabilité§!) mais étouffe la liberté de manœuvre du gouvernement (§R-10 % de gain de pouvoir politique§!) jusqu'à ce que le marché ait couru son cours."
 SIA_gfc_headwinds: "Les vents contraires de la crise financière mondiale"
 SIA_gfc_headwinds_desc: "L'effondrement des marchés du crédit occidentaux a ralenti les commandes d'export thaïlandaises et resserré le financement commercial. Les prix des biens de consommation grimpent et les volumes commerciaux se contractent. La tempête n'est pas la faute de la Thaïlande, mais l'économie la sentira pendant deux ans."
 SIA_coup_risk_modifier: "Pression du risque de coup d’État"
 SIA_coup_risk_modifier_desc: "Un risque de coup élevé pèse sur la stabilité politique et supprime l'accumulation de pouvoir politique. Plus le risque est haut, plus le frein est lourd. Chaque point du compteur de risque se sent dans la capacité du gouvernement à gouverner."
 SIA_coup_tier_watchful: "Caserne vigilante"
 SIA_coup_tier_watchful_desc: "Les généraux sont contents, pour l'heure. Ils lisent les journaux, comptent les lignes budgétaires, et gardent leur conseil. Pas de pénalité, mais le compteur monte ou descend avec chaque choix du gouvernement.\n\n§YRisque de coup§! : [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_restless: "Caserne agitée"
 SIA_coup_tier_restless_desc: "Éditoriaux pointus dans la presse de l'armée, officiers à la retraite grognant sur les plateaux, un remaniement du cabinet sur lequel le haut commandement n'a pas été consulté. L'humeur dans les mess s'est aigrie. Gouverner proprement ou les racheter avant que cela n'empire.\n\n§YRisque de coup§! : [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_plotting: "Généraux complotant"
 SIA_coup_tier_plotting_desc: "Rotations de troupes inhabituelles, dîners auxquels le Premier ministre n'était pas invité, le palais recevant des visiteurs en uniforme. Tout Bangkok sait lire les signes. Le gouvernement peut encore reculer du bord, mais la fenêtre se ferme.\n\n§YRisque de coup§! : [?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_tanks: "Les réservoirs se réchauffent"
 SIA_coup_tier_tanks_desc: "Les colonnes sont ravitaillées et le script de diffusion est écrit. Le haut commandement n'est plus qu'à une provocation de rouler sur Government House. Ramener le risque de coup sous 70, et vite, ou la mission §RRassurer le haut commandement§! expire et les chars viennent.\n\n§YRisque de coup§! : [?ROOT.SIA_coup_risk|0]/100"
 SIA_rice_pledge: "Programme de nantissement du riz"
 SIA_rice_pledge_desc: "Le gouvernement garantit aux agriculteurs des prix au-dessus du marché pour leur récolte de riz et tient le stock stratégique. Les revenus ruraux montent, et l'exposition du Trésor aux cours mondiaux des matières premières monte avec eux."
 SIA_red_shirts_mobilized_idea: "Chemises rouges en marche"
 SIA_red_shirts_mobilized_idea_desc: "Le réseau rural est mobilisé et dans les rues. Des manifestations de masse à Udon Thani, Khon Kaen et aux abords de Bangkok rallient la base, et convainquent le palais et le haut commandement que le gouvernement élu a perdu le contrôle. Chaque marche rapproche le règlement de comptes avec l'armée."
 SIA_kings_moral_authority_2: "Le nouveau règne"
 SIA_kings_moral_authority_2_desc: "Le dixième règne s'est installé dans l'autorité, mais c'est une autorité différente. Plus visible, plus commerciale, plus controversée que son prédécesseur. Le poids moral de soixante ans sur un seul trône ne se transfère pas en un seul couronnement."
 SIA_kra_mobilization: "Mobilisation nationale pour le canal de Kra"
 SIA_kra_mobilization_desc: "Chaque grue, pelleteuse et bataillon du génie que le Royaume peut rassembler est engagé sur le corridor de Kra. Les prix à la consommation montent, le capital politique s'écoule, et la cote d'approbation du gouvernement ploie sous le poids, mais la vitesse de construction est extraordinaire. Cet esprit est retiré quand le canal est achevé."
 SIA_kra_canal: "Le canal de Kra"
 SIA_kra_canal_desc: "Le canal qui relie le golfe de Thaïlande à la mer d'Andaman fait de la Thaïlande le goulet de la deuxième voie maritime la plus fréquentée du monde. Les péages affluent au Trésor, les marines font poliment la queue pour les droits de transit, et l'opinion de Bangkok vaut désormais d'être sollicitée dans chaque capitale asiatique."
 SIA_kra_debt_trap: "Dette des Nouvelles routes de la soie"
 SIA_kra_debt_trap_desc: "Le canal a été bon marché à démarrer parce que Pékin l'a payé. L'échéancier de remboursement est libellé en yuan, la garantie est la voie d'eau elle-même, et chaque dépassement de coût approfondit l'obligation. Les prix à la consommation dérivent à la hausse et le capital politique fuit tandis que le prêt se compose en arrière-plan."
 SIA_kra_debt_serviced: "Dette restructurée"
 SIA_kra_debt_serviced_desc: "Le prêt a été renégocié à des conditions dures mais survivables. La crise est passée, le canal est thaïlandais, et le gouvernement a gagné une mesure de crédibilité pour avoir affronté Pékin à la table plutôt qu'en coulisse."
 SIA_kra_default_pariah: "Défaut souverain"
 SIA_kra_default_pariah_desc: "La Thaïlande a quitté le prêt des Nouvelles routes de la soie. Le canal est à elle, mais les marchés internationaux du crédit s'en souviennent, les partenaires commerciaux se couvrent, et le prix du capital est élevé pour un pays qui a montré qu'il répudiera une dette quand la politique l'exige."
 SIA_kra_lease_concession: "Concession de bail de Pékin"
 SIA_kra_lease_concession_desc: "Pour régler la dette, une concession d'exploitation à long terme sur une partie du canal a été concédée à une entreprise d'État chinoise. Le Royaume hisse encore le drapeau aux écluses, mais une part de chaque péage file désormais vers Pékin, et le monde a remarqué qui tient vraiment le bail."
 SIA_kra_capital_flight: "Fuite des capitaux"
 SIA_kra_capital_flight_desc: "Le défaut a affolé les marchés. Le capital étranger se dirige vers la sortie, le baht est sous pression, et la banque centrale brûle des réserves pour ralentir l'hémorragie. Le choc est grave mais temporaire, et la confiance reviendra une fois la poussière retombée."
 SIA_kra_delay: "Retard de construction"
 SIA_kra_delay_desc: "Plutôt que de verser plus d'argent dans une phase qui a dépassé le budget, le gouvernement a accepté un calendrier plus lent. La vitesse de construction souffre et l'optique est mauvaise, mais le Trésor est épargné du pire du dépassement."
 SIA_kra_canal_sovereign: "Le canal souverain"
 SIA_kra_canal_sovereign_desc: "Bâti sans créancier étranger ni clause étrangère, le canal est thaïlandais jusqu'au dernier bollard. La prime payée pour une souveraineté absolue achète une base navale-industrielle plus profonde, un régime de péage plus fort, et un prestige national qu'aucune concession ne pourrait jamais égaler."
 SIA_kra_fortress: "Canal de la forteresse"
 SIA_kra_fortress_desc: "Batteries côtières, bunkers durcis et une garnison navale permanente font du Kra une voie d'eau que la Marine royale thaïlandaise peut tenir par la force. La flotte aiguise ses compétences à garder le goulet, mais le passage militarisé coûte à Bangkok un peu de bonne volonté parmi les compagnies maritimes."
 SIA_kra_neutral_transit: "Régime de transit neutre"
 SIA_kra_neutral_transit_desc: "Le Kra est ouvert à tous les pavillons à conditions égales, garanti par traité et de confiance pour chaque puissance maritime. Le trafic et la bonne volonté affluent ensemble. Les péages sont élevés, l'opinion des nations commerçantes monte, et le canal devient un bien commun mondial plutôt qu'une arme nationale."
 SIA_red_revival: "Fantômes du PCT"
 SIA_red_revival_desc: "Les cadres du Parti communiste de Thaïlande, les survivants de la lutte des années 1970, leurs enfants, leurs étudiants, sont sortis des marges. Le parti a de l'énergie politique, une théorie de l'histoire, et un appétit de pouvoir. Il a aussi des ennemis, et sa présence dans la conversation nationale coûte au pays quelques points de stabilité chaque mois où il refuse de travailler dans le système existant."
 SIA_general_strike_idea: "Grève générale (en cours)"
 SIA_general_strike_idea_desc: "The country is being deliberately paralyzed. Docks, rails, schools, hospitals operating on skeleton crews. Stability falls half a percent every week the strike holds. Drive momentum to 100 through the Red Road decisions and the government capitulates. Let the 365 days run out short and the army takes over.\n\n§RStrike Momentum§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_western_sanctions: "Sanctions économiques occidentales"
 SIA_western_sanctions_desc: "Les États-Unis et leurs alliés ont imposé un paquet de sanctions à la Thaïlande après le changement de gouvernement. L'investissement s'est gelé, le financement commercial est devenu difficile à arranger, et plusieurs accords bilatéraux sont suspendus. Le coût est réel, tout comme le bénéfice politique d'avoir un ennemi extérieur clair."
 SIA_asean_pariah: "Paria de la région"
 SIA_asean_pariah_desc: "La tentative de la Thaïlande de soumettre ses voisins en a fait un paria en Asie du Sud-Est et au-delà. Les partenaires de l'ASEAN ont gelé Bangkok hors du commerce régional, le capital étranger a fui l'agresseur, et le coût de chaque brique et de chaque baril reflète désormais un royaume en guerre avec la région qu'il menait autrefois. L'isolement a un prix, et l'économie thaïlandaise le paie."
 SIA_peoples_siam: "Bloc de solidarité populaire"
 SIA_peoples_siam_desc: "La Thaïlande s'est ancrée dans un alignement régional avec le Laos et le Viêt Nam. Le cadre de reconnaissance mutuelle fournit une couverture diplomatique, réduit l'isolement, et, pour un pays qui vient de nationaliser ses grandes industries, fournit les relations commerciales qui tiennent les rayons remplis. La coopération militaire à militaire à travers le bloc est le fondement d'une posture de défense véritablement indépendante."
 SIA_green_rush: "La ruée verte"
 SIA_green_rush_desc: "La dépénalisation du cannabis a ouvert un nouveau marché de commodité agricole. Les agriculteurs de l'Isaan se diversifient, les exportateurs de produits à base de plantes s'enregistrent plus vite que l'agence de licences ne peut les traiter, et un coin de l'hôtellerie de Bangkok a discrètement basculé. Les critiques parlent d'expérience sociale. Les recettes du Trésor parlent de recettes."
 SIA_war_plan_brm: "Plan de guerre Birmanie"
 SIA_war_plan_brm_desc: "Les planificateurs opérationnels thaïlandais ont joué la campagne de la Salween en détail. Couloirs d'infiltration, nœuds logistiques, les irréguliers shan comme multiplicateur de force. Le plan est à jour, l'infrastructure de mise en place est en place, et le corps des officiers connaît le terrain."
 SIA_war_plan_lao: "Plan de guerre Laos"
 SIA_war_plan_lao_desc: "Les passages du Mékong, les cols des hauts plateaux, la vulnérabilité de Vientiane à une poussée depuis la direction de Nong Khai. Le plan de campagne existe dans chaque classeur opérationnel du QG de la 3e armée. L'infrastructure frontalière a été discrètement améliorée pour soutenir une avance rapide."
 SIA_war_plan_cbd: "Plan de guerre Cambodge"
 SIA_war_plan_cbd_desc: "Le corridor de Preah Vihear, l'escarpement de Dangrek, les approches plates vers Siem Reap. Les planificateurs thaïlandais ont tracé les limites opérationnelles et wargamé la logistique trois fois. L'État de mise en place est prêt."
 SIA_war_plan_may: "Plan de guerre Malaisie"
 SIA_war_plan_may_desc: "La frontière de 1909 est une contrainte de planification, pas un fait de nature. Des ordres de campagne détaillés pour l'approche de Narathiwat et le corridor de Kelantan existent dans un dossier rouge marqué RESTREINT. Les investissements d'infrastructure du Deep South font aussi office de terrains de mise en place."
 SIA_protector_of_the_realm: "Protecteur du royaume"
 SIA_protector_of_the_realm_desc: "Les forces armées thaïlandaises ancrent désormais l'occupation de la frontière recouvrée, tenant l'ordre à travers les terres shan, lao, khmer et malaises gagnées dans les guerres pan-thaïes tandis que l'administration civile rattrape. La lassitude de guerre s'estompe avec la victoire assurée, et la fierté d'un royaume réunifié stabilise le front intérieur."
 SIA_comprehensive_security_idea: "Sécurité globale"
 SIA_comprehensive_security_idea_desc: "Le cadre intégré de sécurité nationale réduit les doublons entre l'intérieur, la défense et les agences de renseignement. Les frais de consommation baissent à mesure que la coordination s'améliore. La dérive vers un patron extérieur devient mesurablement plus difficile à ingénier."
 SIA_cambodia_partnership: "Partenariat avec le Cambodge"
 SIA_cambodia_partnership_desc: "Une relation bilatérale structurée avec Phnom Penh couvre la facilitation commerciale, des zones de développement conjointes, et un accord diplomatique qui positionne la Thaïlande comme partenaire économique préféré du Cambodge. L'influence circule dans les deux sens, et les recettes commerciales dans un seul."
 SIA_fuel_reserves: "Réserves stratégiques de carburant"
 SIA_fuel_reserves_desc: "Trois mois de consommation nationale de carburant tenus en réserve stratégique, dans des parcs de citernes répartis dans les cinq régions. Le stock lisse les pics de prix, fournit un tampon de crise, et signale aux partenaires que la logistique militaire thaïlandaise n'est pas otage d'une seule voie d'approvisionnement."
 SIA_medical_tourism_boom: "Boom du tourisme médical"
 SIA_medical_tourism_boom_desc: "Le mot s'est répandu. Les hôpitaux privés de Bangkok sont complets de patients étrangers, et les convalescents restent ensuite comme touristes. Les recettes et les arrivées s'accumulent mois après mois, tandis que les services tournent à chaud et que les locaux attendent plus longtemps un lit."
 SIA_aec_tailwind: "Un vent favorable à l’intégration de l’ASEAN"
 SIA_aec_tailwind_desc: "La poussée de facilitation commerciale paie à travers la région. Moins de friction aux frontières, des chaînes d'approvisionnement plus profondes, des usines thaïlandaises qui gagnent des contrats régionaux. La croissance tirée par l'export se compose sur des années, même si l'ajustement comprime la capacité de biens de consommation chez soi."
 SIA_arms_export_orders: "Carnet de commandes d'export de défense"
 SIA_arms_export_orders_desc: "Le carnet de commandes est plein. MRAP, munitions, drones rôdeurs et systèmes construits sous licence partent vers des acheteurs de l'ASEAN selon un calendrier roulant. Les lignes d'armes tournent à capacité et le standing de la Thaïlande comme fournisseur préféré de la région s'approfondit, au coût de la friction diplomatique qu'armer le voisinage apporte toujours."
 SIA_royal_development_lands: "Terres des projets royaux"
 SIA_royal_development_lands_desc: "Des projets sponsorisés par la Couronne ont ouvert de nouvelles terres à la culture et à l'extraction et stabilisé les provinces qu'ils touchent. La campagne est plus calme et la base de ressources plus large, bien que les ouvrages eux-mêmes puisent dans les biens de la nation tant qu'ils durent."
 SIA_eec_construction_boom: "Augmentation de la construction dans la CEE"
 SIA_eec_construction_boom_desc: "Le Corridor économique de l'Est est un chantier vivant, avec des grues sur les ports, des plates-formes ferroviaires nivelées, et des coques d'usines qui s'élèvent. La construction va plus vite et la production grimpe, mais la poussée immobilise la capacité de biens de consommation pour la durée."
 SIA_asean_chair_spotlight: "Pleins feux sur la présidence de l’ASEAN"
 SIA_asean_chair_spotlight_desc: "Bangkok tient le marteau et les caméras. La présidence achète une bonne volonté facile et une posture diplomatique moins chère à travers l'Association, aussi longtemps que le projecteur dure."
 SIA_purge_disruption: "Perturbation anti-greffe"
 SIA_purge_disruption_desc: "Le balayage d'application a gelé les achats et mis les réseaux de patronage sur les nerfs. Les contrats se sont saisis et la machine politique boude. C'est le prix d'un système plus propre, payé d'avance."
 SIA_army_wage_inflation: "Salaire gonflé des officiers"
 SIA_army_wage_inflation_desc: "Les faveurs ont racheté les galons, mais le prix a été une masse salariale gonflée. Salaires d'officiers, indemnités et postes fantômes ont été matelassés à travers les rangs, et la masse salariale militaire tournera à chaud jusqu'à ce que le budget soit ramené à l'ordre."
 SIA_chuan_leekpai_desc: "Politicien vétéran du Parti démocrate et sage d'État qui a servi comme Premier ministre de 1992 à 1995 et de 1997 à 2001. Son second mandat a porté la Thaïlande à travers la crise financière asiatique sur un programme du FMI. Connu pour son intégrité personnelle irréprochable dans un système rongé par la corruption."
 SIA_thaksin_shinawatra_desc: "Magnat milliardaire des télécommunications qui a fondé Thai Rak Thai et remporté un raz-de-marée en 2001. Ses programmes populistes — le régime de santé à 30 baht et les fonds de développement villageois — ont transformé la politique rurale. Destitué par un coup militaire en 2006, il a gouverné la Thaïlande depuis l'exil par de multiples partis mandataires."
 SIA_bhumibol_adulyadej_desc: "Rama IX, neuvième monarque de la dynastie Chakri et chef d'État au plus long règne du monde. Son autorité morale comme symbole unificateur a été déployée dans chaque crise politique. Son décès en octobre 2016 a clos un règne de 70 ans et ouvert une période de deuil national profond."
 SIA_vajiralongkorn_desc: "Rama X, Maha Vajiralongkorn, qui est monté sur le trône après la mort de son père en 2016. Il a exercé un contrôle direct sur les actifs de la Couronne et la Garde royale, et s'est inséré plus directement dans les affaires politiques que ses prédécesseurs. Son règne coïncide avec la période la plus turbulente de l'histoire constitutionnelle thaïlandaise."
 SIA_abhisit_vejjajiva_desc: "Chef démocrate formé à Oxford devenu Premier ministre par un vote parlementaire en 2008 après la dissolution par la Cour constitutionnelle du Parti du pouvoir du peuple. Son gouvernement a supervisé la répression d'avril à mai 2010 contre les manifestants chemises rouges à Bangkok."
 SIA_yingluck_shinawatra_desc: "Cheffe de Pheu Thai et plus jeune sœur de Thaksin Shinawatra, qui a remporté l'élection de juillet 2011 avec la plus large majorité depuis 2001. Son gouvernement a lancé le programme de nantissement du riz qui est devenu plus tard un scandale de corruption majeur. Elle a été destituée par la Cour constitutionnelle en 2014 et a fui le pays avant un verdict pénal."
 SIA_prayut_chanocha_desc: "Commandant de l'armée royale thaïlandaise qui a mené le coup de mai 2014, le douzième de la Thaïlande, et a servi comme Premier ministre pendant neuf ans sous la junte du NCPO et le Parti Palang Pracharath. Architecte du système proportionnel mixte de la constitution de 2017 conçu pour fragmenter les partis d'opposition."
 SIA_sonthi_boonyaratglin_desc: "Commandant de l'armée qui a mené le coup de septembre 2006 destituant Thaksin Shinawatra pendant que le Premier ministre était à l'étranger. A présidé la junte du Conseil de sécurité nationale jusqu'à l'installation d'un gouvernement civil intérimaire. Est ensuite entré en politique électorale comme chef d'un parti mineur."
 SIA_anutin_charnvirakul_desc: "Chef du Parti Bhumjaithai et héritier d'une famille du BTP, monté à la notoriété comme vice-Premier ministre. Le positionnement stratégique de son parti entre les blocs militaire et civil en a fait un faiseur de rois dans trois gouvernements de coalition successifs. Devenu Premier ministre par intérim fin 2025 après la destitution de Paetongtarn par la Cour constitutionnelle."
 SIA_pita_limjaroenrat_desc: "Chef du Parti Move Forward dont le parti a remporté l'élection de mai 2023 avec la plus large part de voix, seulement pour être bloqué de former un gouvernement par le Sénat nommé par l'armée. La Cour constitutionnelle a ensuite dissous le parti et l'a interdit de politique pendant cinq ans."
 SIA_natthaphong_ruengpanyawut_desc: "Successeur de Pita Limjaroenrat à la tête du Parti du peuple reconstitué, et plus jeune gouverneur élu de Bangkok. Représente le basculement générationnel de la politique progressiste thaïlandaise vers la gouvernance locale et la politique climatique, aux côtés de la réforme constitutionnelle."
 SIA_songkhram_phaendin_desc: "Un maréchal de l'école pan-thaïe, portant un nom qui signifie « guerre de la terre ». Il a gravi le corps des officiers en prêchant que les cessions de 1893 et 1909 étaient des plaies encore ouvertes, et que seul un gouvernement de soldats les fermerait jamais."
 SIA_somchai_ratchaphruek_desc: "Un vétéran des années de jungle du Parti communiste, surnommé d'après l'arbre aux fleurs d'or. Il a survécu aux amnisties qui ont vidé les camps et est retourné organiser dans le Nord-Est, tenant que la révolution a échoué dans son timing plutôt que dans ses buts."
 SIA_banharn_silpaarcha_desc: "Chef du Parti Chart Thai et patron du BTP de Suphanburi, Premier ministre de 1995 à 1996. Son gouvernement a versé des dépenses d'infrastructure provinciale dans son fief si lourdement que la presse l'a surnommé le distributeur automatique ambulant. La coalition s'est effondrée en un an parmi des allégations de corruption et les signes d'alerte économique qui ont précédé le krach de 1997."
 SIA_chavalit_yongchaiyudh_desc: "Fondateur et chef du Parti de la nouvelle aspiration, et ancien commandant en chef de l'armée royale thaïlandaise devenu Premier ministre en novembre 1996. Son gouvernement était en fonction lorsque la crise du baht a éclaté à la mi-1997, et il a démissionné en novembre sous la pression de l'effondrement monétaire que son administration n'a pas contenu."
 SIA_thanathorn_juangroongruangkit_desc: "Magnat des pièces automobiles qui a cofondé le Parti Future Forward en 2018 et est devenu le visage de sa politique réformatrice portée par la jeunesse. Sa montée rapide a alarmé l'establishment. La Cour constitutionnelle a dissous le parti en février 2020 et l'a interdit de fonction pendant une décennie pour un prêt que le parti avait pris auprès de lui personnellement."
 SIA_virot_paoin_desc: "Un lieutenant-général de police qui a pris la direction de Pheu Thai une fois la lignée de Thaksin passée, poursuivant la coalition populiste du parti derrière un uniforme plutôt qu'un podium de meeting. Son style de gouvernement s'appuie sur la loyauté institutionnelle au sein de la police et de la fonction publique plutôt que sur la mobilisation rurale de masse sur laquelle son prédécesseur a bâti le parti."
 SIA_srettha_thavisin_desc: "Cadre du promoteur immobilier et candidat de Pheu Thai au poste de Premier ministre en 2023, devenu Premier ministre en août dans la coalition de retour au pouvoir du parti avec d'anciens rivaux. La Cour constitutionnelle l'a destitué en août 2024 pour un manquement éthique lié à une nomination ministérielle, l'un des mandats les plus courts de tout Premier ministre thaïlandais élu en une décennie."
 SIA_paetongtarn_shinawatra_desc: "Plus jeune fille de Thaksin Shinawatra et troisième Premier ministre Shinawatra de Pheu Thai, entrée en fonction en août 2024 comme réponse du parti à la destitution de son prédécesseur par la cour. Une conversation téléphonique fuitée avec Hun Sen du Cambodge sur le litige frontalier lui a coûté le Premier ministère en moins d'un an, ravivant les questions sur la part de la direction du gouvernement qui passe encore par son père."
 SIA_greater_thailand_consolidated: "Grande Thaïlande consolidée"
 SIA_greater_thailand_consolidated_desc: "Les campagnes irrédentistes sont closes. Le royaume se tient plus large et plus fort qu'avant, ses réserves d'effectifs approfondies, ses industries enhardies, son peuple unifié par le sacrifice partagé et la victoire partagée. L'appareil d'État qui a mené la guerre conduit désormais la construction."
 SIA_pax_aseana_idea: "Pax Aseana"
 SIA_pax_aseana_idea_desc: "La Thaïlande mène un bloc de sécurité stable, cohérent et autosuffisant. Le capital politique afflue des capitales alliées, et la stabilité est renforcée par le savoir que Bangkok ne se tiendra pas seule, et qu'aucun allié non plus. La paix de la région est garantie par la puissance thaïlandaise."
 SIA_asean_defense_member: "Membre de l'OTASE"
 SIA_asean_defense_member_desc: "Cette nation a choisi d'elle-même de rejoindre le pacte de défense régional de la Thaïlande. Un commandement partagé et un but commun stabilisent le front intérieur et raidissent la défense. Liée par le consentement plutôt que par la contrainte, son engagement envers la communauté tient là où une alliance forcée se serait écroulée."
 SIA_rally_round_flag: "Rassemblement autour du drapeau"
 SIA_rally_round_flag_desc: "L'incident frontalier a uni le public thaïlandais derrière les forces armées. Le sentiment nationaliste est élevé et les files de conscription sont longues, mais l'humeur est volatile et la lune de miel ne durera pas éternellement."
 SIA_anti_graft_idea: "Application de la loi anti-corruption"
 SIA_anti_graft_idea_desc: "An empowered National Anti-Corruption Commission has begun dismantling the procurement and customs networks that siphon revenue from the Thai state. Contractors compete on merit again, and the public can see it. For six months the campaign itself is a heavy drag on political power, the price of running down entrenched interests."
 SIA_strait_patrol_posture: "Posture de patrouille du détroit"
 SIA_strait_patrol_posture_desc: "La Marine royale thaïlandaise mène une rotation de patrouille renforcée dans le détroit. Des escortes ombrent les voies maritimes, des lignes de piquet surveillent les approches, et la flotte s'éloigne davantage du port tant que la posture tient."
 SIA_asean_security_pledge: "Engagement de sécurité de l'ASEAN"
 SIA_asean_security_pledge_desc: "La Thaïlande s'est engagée comme bouclier de l'Asie du Sud-Est plutôt que comme son conquérant. Les premières garanties partent vers les voisins qui acceptent la protection de Bangkok, et le corps diplomatique s'attelle au travail patient de rassurance. Les garanties coûtent moins cher, les relations tiennent à moindre coût, et les forces du Royaume s'enterrent pour rendre la promesse crédible."
 SIA_protector_of_asean: "Protecteur de l'ANASE"
 SIA_protector_of_asean_desc: "La Thaïlande a choisi le rôle de garant plutôt que de conquérant. En étendant son parapluie de sécurité à travers l'Asie du Sud-Est, le Royaume gagne la confiance de ses voisins et le standing d'une grande puissance régionale. Un corps diplomatique permanent projette désormais l'influence thaïlandaise dans plusieurs capitales de l'ASEAN à la fois, financé par le capital politique régulier que le rôle commande. La diplomatie est moins chère, la défense plus ferme, et la bonne volonté de l'ASEAN afflue vers Bangkok."
 SIA_frontier_buffer_idea: "États tampons frontaliers"
 SIA_frontier_buffer_idea_desc: "Les Shan et les Karen sont tenus armés et amicaux comme un bouclier vivant le long de la frontière birmane. Garanties moins chères, une frontière plus stable, et un avantage défensif contre toute poussée de Naypyidaw."
 SIA_shan_campaign: "Campagne Shan"
 SIA_shan_campaign_desc: "L'armée est mobilisée et orientée pour des opérations dans l'État shan du Sud, avec des bonus de combat contre les forces shan pour la durée de la campagne."
 SIA_karen_campaign: "Campagne Karen"
 SIA_karen_campaign_desc: "Les forces thaïlandaises poussent dans les collines karen, avec des bonus de combat contre les forces karen pour la durée de la campagne."
 SIA_wa_campaign: "Campagne Wa"
 SIA_wa_campaign_desc: "Les forces thaïlandaises poussent dans les collines wa contre l'UWSA, avec des bonus de combat contre les forces wa pour la durée de la campagne."
 SIA_us_mech_standard: "Mécanisation conforme aux normes OTAN"
 SIA_us_mech_standard_desc: "La doctrine américaine et les véhicules occidentaux apportent une organisation, une reconnaissance et une fiabilité de terrain supérieures, à un prix compté dans le budget de défense."
 SIA_reliability_woes: "Problèmes de fiabilité"
 SIA_reliability_woes_desc: "La masse bon marché est venue avec un soutien bon marché. Les pannes de transmission et les retards de pièces détachées sappent le moral et la fiabilité de l'équipement jusqu'à ce que la flotte soit remise en ordre."
 SIA_chd620_teething: "Problèmes de démarrage du moteur"
 SIA_chd620_teething_desc: "Le groupe motopropulseur chinois de substitution tourne chaud et non éprouvé. Tant que les défauts ne sont pas corrigés, les bâtiments sont plus lents et leurs équipages moins confiants."
 SIA_bamboo_doctrine: "La doctrine du bambou"
 SIA_bamboo_doctrine_desc: "Amical avec tous et redevable à personne. Flexibilité diplomatique, large bonne volonté, et la stabilité intérieure d'une nation qui refuse de choisir un camp."
 SIA_loyal_opposition: "L'opposition loyale"
 SIA_loyal_opposition_desc: "Victoire ou défaite, le parti endure. Une organisation centenaire enracinée dans chaque province et un noyau d'électeurs qui ne dérive pas avec le temps politique. C'est le constituant le plus stable de la politique thaïlandaise, et le plus dur à arracher pour tout mouvement rival, populiste ou palais."
 SIA_democratic_institutionalism: "Institutionnalisme démocratique"
 SIA_democratic_institutionalism_desc: "Les règles survivent désormais aux dirigeants. Cours indépendantes, un parlement qui fonctionne, des ministères professionnels et un public qui s'attend à ce que le pouvoir change de mains aux urnes. La démocratie thaïlandaise est devenue un système plutôt qu'une saison, et elle tient contre la capture depuis la rue, le palais ou la caserne."
 SIA_pt_tier_dormant: "Surveiller la marée populiste"
 SIA_pt_tier_dormant_desc: "Pour l'heure le vote rural tient et les Démocrates gouvernent en paix. Mais la machine de Thaksin ne dort jamais vraiment. Dans le Nord et le Nord-Est les anciennes loyautés attendent, prêtes à se rassembler dès que le parti au pouvoir paraît complaisant. Gardez l'avance avec la machine de circonscription et la marée reste aussi calme.\n\n§YMarée populiste§! : [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_rising: "La marée populiste monte"
 SIA_pt_tier_rising_desc: "Dans le Nord-Est les bannières rouges sont de nouveau dehors. La machine de Thaksin gagne, et un gouvernement qui ne peut y répondre commence à ressembler à un intérim attendant d'être voté dehors.\n\n§YMarée populiste§! : [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_red_shirt_encampment: "Le campement de Ratchaprasong"
 SIA_red_shirt_crackdown: "La répression de Ratchaprasong"
 SIA_red_shirt_encampment_desc: "Des dizaines de milliers de chemises rouges tiennent le quartier commercial central de Bangkok derrière des barricades de bambou et de pneus. Les centres commerciaux sont fermés, les bureaux vides et le quartier d'affaires a cessé de travailler. Le gouvernement a choisi de les attendre."
 SIA_red_shirt_crackdown_desc: "L'armée a déblayé le carrefour à balles réelles. Les barricades ont disparu et l'occupation aussi, mais les bâtiments sont brûlés, la police coûte plus cher qu'avant, et le pays a vu des soldats tirer sur des civils à la télévision."
 SIA_pt_tier_surge: "Un glissement de terrain populiste se profile"
 SIA_pt_tier_surge_desc: "Les sondages sont une débâcle en attente. Les chemises rouges parlent de venir à Bangkok, et un gouvernement qui laisse la marée atteindre 100 saura s'ils le pensaient.\n\n§YMarée populiste§! : [?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_thaksin_ascendant: "Thai Rak Ascendant Thaï"
 SIA_thaksin_ascendant_desc: "Le krach de 1997 a brisé les anciens partis, et dans le vide entre Thaksin Shinawatra avec une fortune des télécoms, une machine disciplinée, et une promesse que les villages du Nord et du Nord-Est attendent depuis une génération. Soins bon marché, allègement de la dette, et un fonds de développement pour chaque village. Mois après mois le vote rural se rassemble derrière son Thai Rak Thai, et les Démocrates de Chuan gouvernent à crédit.\n\nChaque mois Thai Rak Thai et le bloc non-aligné plus large gagnent environ 2 % de soutien, puisés dans le vote de l'establishment, jusqu'à ce que le réelignement de 2001 tranche la question.\n\n§YMois jusqu'au règlement§! : [?ROOT.SIA_thaksin_rise_months|0]/12"
 SIA_broad_coalition_idea: "Une large coalition"
 SIA_broad_coalition_idea_desc: "Des ministères remis aux petits partis et aux chefs provinciaux en échange d'un pare-feu parlementaire. Large et stable, mais chaque décision est une négociation, et le cabinet avance à la vitesse de son partenaire le plus réticent. Le marché tient un an."
 SIA_mekong_soft_power_idea: "Le soft power du Mékong"
 SIA_mekong_soft_power_idea_desc: "Banques, contractants et diffuseurs thaïlandais portent l'influence de Bangkok le long du Mékong. Une voix plus forte dans le voisinage, et la bande passante diplomatique pour courtiser une nation de plus en même temps."
 SIA_occupation_administration: "Administration des professions"
 SIA_occupation_administration_desc: "Gouverneurs militaires, commissions de réinstallation et bureaux de reconstruction dirigent désormais les provinces conquises. La conformité grimpe plus vite, la résistance armée est broyée, et les routes et rails d'intégration s'élèvent plus rapidement. L'appareil pour tenir ce que l'armée a pris."
 SIA_deep_south_category: "Le Deep South"
 SIA_deep_south_category_desc: "The Malay-Muslim provinces of Pattani, Yala and Narathiwat are in insurgency. Suppression, development and dialogue all have their advocates, and their costs.\n\n§YInsurgency Intensity§! is the strength of the revolt. Higher means deadlier weekly incidents and a heavier drag on the South. Force, development and dialogue push it down. Atrocities and neglect push it up.\n\n§YCommunity Grievance§! is the alienation underneath it. Heavy-handed tactics raise it, concessions lower it, and it holds intensity above a §YGrievance Floor§! set at 60% of its value. Grinding the revolt down by force raises grievance, and the floor with it.\n\n§YInsurgency Intensity§!: [?ROOT.SIA_insurgency_intensity|0]/100\n§YCommunity Grievance§!: [?ROOT.SIA_ds_grievance|0]/100\n§YGrievance Floor§!: [?ROOT.SIA_ds_intensity_floor|0]/100"
 SIA_greater_thailand_category: "Grande Thaïlande"
 SIA_greater_thailand_category_desc: "Le programme des territoires perdus. Milices, revendications et l'intégration des terres recouvrées."
 SIA_ds_security_operations: "Opérations de ratissage"
 SIA_ds_security_operations_desc: "Cordon-and-search operations across the southern provinces. Order returns once the sweeps are done. Whether they end the insurgency or feed it is debated in every after-action report."
 SIA_ds_development_fund: "Fonds de développement du Sud"
 SIA_ds_development_fund_desc: "Routes, écoles et emplois pour les provinces les plus pauvres du pays. Plus lent que les soldats, moins cher que la guerre."
 SIA_ds_emergency_decree: "Décret d'urgence"
 SIA_ds_emergency_decree_desc: "Pouvoirs spéciaux pour les forces de sécurité dans les provinces du Sud. Détention sans inculpation, dispositions d'immunité, couvre-feux. Efficace, et corrosif."
 SIA_ds_peace_dialogue: "Dialogue de paix ouvert"
 SIA_ds_peace_dialogue_desc: "Authorize formal talks with the separatist movement under Malaysian facilitation. Talking to them concedes they exist. It is also the shortest road to ending this at a table."
 SIA_arm_shan_militias: "Armer les milices shan"
 SIA_arm_shan_militias_desc: "Fournir discrètement les armées shan de l'autre côté de la frontière birmane. Chaque convoi achète de l'influence sur ce que l'État shan devient."
 SIA_shan_client_state: "Parrainer l'État shan"
 SIA_shan_client_state_desc: "Reconnaître et garantir un État shan aligné sur Bangkok. Nos frères ont leur pays, et nous avons son allégeance."
 SIA_integrate_shan: "Intégrer les terres shan"
 SIA_integrate_shan_desc: "Étendre l'administration thaïlandaise au plateau shan, apportant gouverneurs, écoles et le baht. La population doit être suffisamment pacifiée avant que Bangkok puisse consolider le contrôle."
 SIA_integrate_laos: "Intégrer les terres lao"
 SIA_integrate_laos_desc: "Étendre l'administration thaïlandaise aux provinces lao revendiquées. Une haute conformité et une faible résistance dans l'État cœur sont requises avant que l'intégration formelle puisse procéder."
 SIA_integrate_cambodia: "Intégrer les provinces khmères"
 SIA_integrate_cambodia_desc: "Étendre l'administration thaïlandaise à Battambang et Siem Reap, comme en 1941-1946. La population khmère doit accepter la gouvernance thaïlandaise avant qu'une administration formelle puisse être imposée."
 SIA_integrate_malaya: "Intégrer les provinces du Sud"
 SIA_integrate_malaya_desc: "Étendre l'administration thaïlandaise aux anciens sultanats cédés en 1909. L'intégration exige que la population soit fermement sous l'influence de Bangkok avant l'annexion formelle."
 SIA_cost_1_0: "£treasury 1,0"
 SIA_cost_1_5: "£treasury 1,5"
 SIA_thaksinite_party_governs_tt: "§Y[neutral_Social_L]§! est le parti au pouvoir."
 SIA_cost_2_0: "£treasury 2.0"
 SIA_cost_2_0_blocked: "£treasury 2.0 §R(insuffisant)§!"
 SIA_otpc_education_strain: "Déploiement d'une tablette par enfant"
 SIA_otpc_education_strain_desc: "Chargeurs, casse, unités de remplacement, et le budget de formation que personne n'avait chiffré. Le ministère des écoles absorbe le vrai prix du programme."
 SIA_packed_senate: "Un Sénat à nous"
 SIA_packed_senate_desc: "Des loyalistes à la chambre haute et dans les agences indépendantes. Pour l'heure la législation du gouvernement passe d'un hochement de tête."
 SIA_cost_5_0: "£treasury 5,0"
 SIA_economy_category: "Décisions stratégiques et économiques thaïlandaises"
 SIA_economy_category_desc: "Tourisme, médecine, manufacture, armes et les mégaprojets, aux côtés des leviers de la diplomatie de l'ASEAN et de la haute stratégie. Les moteurs de l'État thaïlandais répondent à l'investissement et au capital politique, quand le Trésor et le cabinet peuvent les épargner."
 SIA_ds_hearts_and_minds: "Cœurs et esprits"
 SIA_ds_hearts_and_minds_desc: "Scolarité en malais, rayonnement religieux, commissions d'indemnisation et médiateurs villageois. Personne n'en tient de défilé, mais la carte des incidents s'apaise."
 SIA_contain_the_crisis: "Contenir la crise"
 SIA_contain_the_crisis_desc: "The Deep South has boiled over. Drive insurgency intensity back below §Y60§! within six months, or the violence will spiral and the cost in stability and legitimacy will mount."
 SIA_choose_a_path: "Choisir une voie dans le Sud"
 SIA_choose_a_path_desc: "The crisis is active and the government has a clear political mandate, but no southern strategy has been committed. Commit to force, royal development or dialogue within the year, or drift will cost the Kingdom dearly."
 SIA_medical_tourism_campaign: "Campagne de tourisme médical"
 SIA_medical_tourism_campaign_desc: "Commercialiser les hôpitaux thaïlandais au monde, offrant chirurgie et convalescence à une fraction des prix occidentaux, avec une plage en plus. La campagne se paie d'elle-même, si les services peuvent porter la charge."
 SIA_eec_investment_phase: "Phase d'investissement de l'EEC"
 SIA_eec_investment_phase_desc: "Libérer la prochaine tranche de fonds du Corridor économique de l'Est pour le défrichement, les réseaux, les travaux portuaires et ferroviaires dans les provinces de l'Est."
 SIA_cost_3_0: "£treasury 3,0"
 SIA_cost_4_0: "£treasury 4,0"
 SIA_cost_6_0: "£treasury 6,0"
 SIA_cost_7_0: "£treasury 7,0"
 SIA_cost_1_0_blocked: "£treasury 1.0 §R(insuffisant)§!"
 SIA_cost_1_5_blocked: "£treasury 1.5 §R(insuffisant)§!"
 SIA_cost_3_0_blocked: "£treasury 3.0 §R(insuffisant)§!"
 SIA_cost_4_0_blocked: "£treasury 4.0 §R(insuffisant)§!"
 SIA_cost_5_0_blocked: "£treasury 5.0 §R(insuffisant)§!"
 SIA_cost_6_0_blocked: "£treasury 6.0 §R(insuffisant)§!"
 SIA_cost_7_0_blocked: "£treasury 7.0 §R(insuffisant)§!"
 SIA_family_holdings: "Propriétés familiales"
 SIA_family_holdings_desc: "La famille Shinawatra contrôle des participations significatives dans les télécommunications, les services satellites, la télévision satellite et une douzaine d'entreprises liées. Convertir les relations gouvernementales en dividendes est une tradition de famille, et un flux de recettes sur lequel le parti compte."
 SIA_royal_projects: "Projets royaux de développement"
 SIA_royal_projects_desc: "Envoyer des équipes de développement royal dans les provinces rurales pour des fermes de démonstration, des cliniques de santé mobiles, la gestion des bassins versants et la formation professionnelle. Le prestige personnel du roi accompagne chaque projet, et les chefs de village se souviennent de qui les a envoyés."
 SIA_isoc_surveillance_sweep: "Balayage de surveillance ISOC"
 SIA_isoc_surveillance_sweep_desc: "Envoyer des équipes de renseignement de l'ISOC balayer les réseaux mobiles, les réseaux d'informateurs villageois et les points de passage frontaliers dans le Deep South. Pas de mandats, pas de dossiers, et une image du Sud que l'armée n'a jamais eue."
 SIA_isoc_grid_disruption: "Perturbation du réseau ISOC"
 SIA_isoc_grid_disruption_desc: "Cibler les pipelines de financement, les nœuds de commandement et les réseaux de courriers qui soutiennent le tempo opérationnel de l'insurrection. Chaque nœud perturbé est une bombe qui n'explose pas."
 SIA_ds_cordon_and_search: "Cordon et fouille"
 SIA_ds_cordon_and_search_desc: "Isoler des villages et les fouiller maison par maison pour des armes et des combattants. Cela brise vite le tempo des insurgés, mais chaque porte enfoncée et chaque parent détenu approfondit le grief dont le mouvement se nourrit."
 SIA_ds_fund_religious_schools: "Financer les écoles pondok"
 SIA_ds_fund_religious_schools_desc: "Subventions d'État pour les écoles religieuses malaises-musulmanes et les institutions culturelles que le Sud chérit, aux conditions du Sud. Cela fait peu à la violence cette semaine, mais frappe dur l'aliénation qui la soutient."
 SIA_asean_rotating_summit: "Accueillir le sommet de l'ASEAN"
 SIA_asean_rotating_summit_desc: "Utiliser la présidence thaïlandaise pour accueillir un sommet de haut profil, présentant Bangkok comme la capitale diplomatique de l'Asie du Sud-Est. La bonne volonté qui en résulte se traduit en capital politique chez soi et en prestige à l'étranger."
 SIA_asean_mediate_myanmar: "Médiatiser la crise du Myanmar"
 SIA_asean_mediate_myanmar_desc: "Positionner la Thaïlande comme intermédiaire honnête entre la junte du Myanmar et la communauté internationale. Un succès discret bâtit une influence durable à Naypyidaw. Un échec public reste encore un signal utile au reste de la région."
 SIA_asean_free_trade_push: "Pousser les mesures de libre-échange de l'ASEAN"
 SIA_asean_free_trade_push_desc: "Utiliser la présidence pour faire passer des mesures de facilitation commerciale telles que l'harmonisation douanière, la réduction des barrières non tarifaires et des corridors commerciaux numériques. Le travail de fond prend du temps, mais les recettes d'export arrivent à l'heure. Les voisins de l'ASEAN notent le leadership constructif de Bangkok."
 SIA_retry_section_112: "Retableler l'amendement"
 SIA_retry_section_112_desc: "La première tentative de réformer l'article 112 a échoué au législatif. Le recul public a été fort, mais aussi la contre-mobilisation des jeunes électeurs. Une seconde tentative, mieux préparée et plus étroitement rédigée, peut encore passer si le timing est bon."
 SIA_ds_autonomy_framework: "Cadre d'autonomie du Sud"
 SIA_ds_autonomy_framework_desc: "Piloter un schéma d'autonomie administrative modeste pour les provinces malaises-musulmanes, avec un conseil consultatif régional, un statut officiel de la langue malaise, et un financement scolaire dévolu. Pas l'indépendance, loin de là, mais assez pour démontrer que Bangkok peut écouter. Six mois pour le concevoir, une génération pour le juger."
 SIA_isr_persistent_sweep: "Balayage persistant ISR"
 SIA_isr_persistent_sweep_desc: "Affecter les atouts des Yeux dans le ciel à une veille permanente sur le Deep South : passages frontaliers, trafic mobile, mouvements de véhicules. Les insurgés perdent la capacité de se déplacer invisibles, et pas un soldat n'a à entrer dans un village."
 SIA_political_gambits_category: "Manœuvres politiques"
 SIA_political_gambits_category_desc: "Entre les focus, le gouvernement a encore des leviers : ministres remaniés, procureurs pointés, argent envoyé à l'intérieur, et, le moment venu, un marché avec le palais ou un jour au tribunal.\n\n§YPression réformatrice§! : [?ROOT.SIA_reform_pressure|0]/100. Le mécontentement urbain et juvénile qui dérive vers Move Forward. Au-dessus de 60 il déborde en protestation.\n§YMarée populiste§! : [?ROOT.SIA_pheu_thai_pressure|0]/100. La campagne qui dérive vers Pheu Thai. Seul un gouvernement démocrate porte celle-ci."
 SIA_cabinet_reshuffle: "Remaniement ministériel"
 SIA_cabinet_reshuffle_desc: "Faire tourner les ministres, racheter les critiques, retirer le plus faible du programme télévisé. La fatigue de Prayut ou la politique de la salle d'audience s'en va avec lui, celle qui pèse actuellement sur le gouvernement. Le parti revendique le renouvellement sans changer rien de ce qui compte."
 SIA_lese_majeste_lever: "Actionner le levier de lèse-majesté"
 SIA_lese_majeste_lever_desc: "Application sélective de l'article 112 contre les critiques réformateurs les plus bruyants. Inculpations déposées, caution refusée, déclarations rétractées. L'opposition perd une voix, et tous ceux qui regardent s'éloignent d'un pas de plus du système."
 SIA_coup_watch_category: "La caserne regarde"
 SIA_coup_watch_category_desc: "Chaque populiste élu de l'histoire thaïlandaise a gouverné dans l'ombre de l'armée. Des gains rapides comme les faveurs télécoms, les contrats matelassés et le copinage familial achètent de l'argent et des voix maintenant, mais chacun fait monter le §YRisque de coup§!. Il grimpe aussi de lui-même chaque semaine, de 0,5 normalement et de 1,0 tant que la Stabilité est sous 50 %, et ne redescend jamais sans action. Les décisions ci-dessous rachètent le risque à la baisse, et chacune vous coûte quelque chose. Laissez-le passer 85 et la mission §RRassurer le haut commandement§! s'arme. Désamorcez, ou l'armée prend le gouvernement.\n\n§YRisque de coup§! : [?ROOT.SIA_coup_risk|0]/100"
 SIA_shin_corp_tax_holiday: "Personnaliser un congé fiscal pour les télécommunications"
 SIA_shin_corp_tax_holiday_desc: "Réécrire discrètement les termes de concession pour que l'empire télécoms de la famille ne paie presque rien sur sa prochaine aubaine. Le Trésor et le parti y gagnent tous deux. Les généraux tiennent le compte."
 SIA_school_milk_contract: "Attribuer le contrat du lait scolaire"
 SIA_school_milk_contract_desc: "Un programme national de lait gratuit pour les écoliers ruraux, follement populaire dans les villages, routé par un cartel de fournisseurs qui sait exactement qui remercier. Les villages sont reconnaissants. Les officiers ne le sont pas."
 SIA_otpc_tablet_procurement: "Lancez une tablette par enfant"
 SIA_otpc_tablet_procurement_desc: "Un schéma lustré pour mettre une tablette dans les mains de chaque élève de première année. Les caméras l'aiment et les chiffres du parti tickent. Il se paie en cash, le budget des écoles porte le poids pendant six mois, et l'achat est une machine à pots-de-vin que tout le monde en uniforme connaît."
 SIA_family_business_favors: "Orienter les contrats vers la firme familiale"
 SIA_family_business_favors_desc: "Travaux publics, licences d'import, une concession portuaire ou deux, tout cela allant à des sociétés que les parents du Premier ministre se trouvent posséder. De l'argent pour le Trésor et pour la famille. L'armée l'ajoute au dossier contre vous."
 SIA_court_the_generals: "Courtiser les généraux"
 SIA_court_the_generals_desc: "Lignes budgétaires discrètes, postes de prestige, et quelques promotions bien placées. Rien de tout cela n'est bon marché, mais un corps d'officiers content est un corps patient. Abaisse le risque de coup."
 SIA_military_budget_boost: "Approuver une ruée d'achats de défense"
 SIA_military_budget_boost_desc: "Sous-marins, chasseurs, une nouvelle aile de QG. Signez la liste de souhaits de l'armée et les galons se souviennent de qui paie les factures. L'économie civile en a un peu plus faim, mais le risque de coup chute nettement."
 SIA_anti_corruption_gesture: "Jeter un copain aux procureurs"
 SIA_anti_corruption_gesture_desc: "Choisissez un allié expendable, remettez le dossier à la commission anticorruption, et laissez les caméras tourner. Les partisans du parti voient un ami vendu pour de bons titres et les sondages glissent. Les généraux voient un gouvernement qui punit les siens."
 SIA_promote_loyalists: "Promouvoir les officiers loyaux"
 SIA_promote_loyalists_desc: "Remanier la liste annuelle de promotions pour placer des mains fiables aux commandements qui comptent : la 1re armée, la Garde du roi, la garnison de la capitale. Coûte du capital politique, mais met des hommes plus amicaux entre le gouvernement et les chars. Abaisse le risque de coup."
 SIA_reassure_high_command: "Rassurer le haut commandement"
 SIA_reassure_high_command_desc: "Les colonnes sont ravitaillées et le script de diffusion est écrit. Ramenez le risque de coup sous 70 avant que le minuteur n'expire, par les budgets, les promotions, ou un règlement public avec les copains. Échouer et l'armée prend le gouvernement."
 SIA_canal_tolls: "Collecter les péages du canal"
 SIA_canal_tolls_desc: "Le canal de Kra porte une partie du trafic maritime à plus haute valeur du monde. La collecte des péages des navires commerciaux — porte-conteneurs, pétroliers, vraquiers et croisières — afflue directement au Trésor national tous les six mois."
 SIA_kra_construction: "Canal de Kra"
 SIA_kra_construction_desc: "Le canal de Kra sur toute sa vie. D'abord les ouvrages échelonnés de la grande tranchée à l'isthme de Kra, chaque phase financée à son tour, la négligence invitant les dépassements et, sur un terrain contesté, le sabotage. Puis la gestion navale du détroit achevé : calendriers de patrouille, protocoles de transit, et la sécurité du plus récent goulet du monde.\nLa grande tranchée procède en trois phases financées. §YProgrès de construction§! : [?ROOT.SIA_kra_progress|0]%"
 SIA_kra_phase_1: "Phase I, trancher l'isthme"
 SIA_kra_phase_1_desc: "La première grande excavation. Poussez le chenal à travers l'épine de la péninsule. Financez la phase avant que la saison de construction ne s'épuise, ou le bureau de projet reviendra avec un dépassement."
 SIA_kra_phase_2: "Phase II, travaux d'écluses et de canaux"
 SIA_kra_phase_2_desc: "Revêtir la tranchée, couler les écluses, et bâtir les ouvrages du chenal qui retiendront deux mers. Gardez le Trésor derrière le calendrier ou affrontez un autre dépassement."
 SIA_kra_phase_3: "Phase III, essais en mer"
 SIA_kra_phase_3_desc: "Inonder le bief de partage, poser les portes, et faire passer les pilotes sur lest. La phase finale avant que le canal puisse ouvrir. Financez-la et le mégaprojet est achevé."
 SIA_strait_patrol: "Patrouille du détroit"
 SIA_strait_patrol_desc: "Mettre des bâtiments de la Marine royale thaïlandaise en patrouille régulière du corridor de transit de Kra. La présence dissuade la piraterie, rassure le shipping, et donne à la flotte le temps en mer qu'elle n'a jamais eu."
 SIA_red_path_category: "The Red Road"
 SIA_red_path_category_desc: "The Communist Party of Thailand builds its base through village committees, workplace branches and neighborhood associations rather than through parliamentary contest. Each committee that takes root widens the movement's popular support and tests the limits of official tolerance.\n\nWhen a general strike is called, its instruments appear in this category as well. The strike succeeds if §RStrike Momentum§! reaches 100 within 365 days, at which point the government concedes and the party takes power without an armed rising. If the period expires first, the army suppresses the strike and takes power itself.\n§RStrike Momentum§!: [SIA_strike_momentum_status]"
 SIA_spread_flame_isaan: "Organiser les villages de l'Isaan"
 SIA_spread_flame_isaan_desc: "Party cadres are assigned to villages and district towns across Isaan, where they establish village committees, literacy groups and cooperative networks. The Northeast is the poorest and most populous region of Thailand and supplied the party with its core support throughout the insurgency of the 1960s and 1970s, so organizing there consolidates ground the movement already holds."
 SIA_spread_flame_north: "Organiser les communautés du Nord"
 SIA_spread_flame_north_desc: "The northern provinces have a long record of agrarian protest and labor organization, running from the tenant farmers' federations of the 1970s through the cooperative movements that succeeded them. Party organizers work through the hillside cooperatives and the timber unions. A second regional base outside Isaan gives the movement a national character rather than a purely northeastern one."
 SIA_mass_education_campaign: "Campagne d'éducation politique de masse"
 SIA_mass_education_campaign_desc: "The party conducts a national program of political education covering labor history, economic theory and the record of foreign intervention in Southeast Asia. Instruction is delivered through party-aligned unions, cooperatives and community centers rather than state schools. The campaign occupies the party's organizers and teachers, and produces a supporter base that understands the program it is being asked to support."
 SIA_asean_arms_export: "Contrat d'exportation d'armes de l'ASEAN"
 SIA_asean_arms_export_desc: "Les fabricants de défense thaïlandais ont la capacité de production et les relations régionales pour soutenir un programme d'export récurrent. Chaque contrat annuel — MRAP, fusées d'artillerie, lots de munitions ou munitions rôdeuses — s'ajoute directement au Trésor et approfondit la position de la Thaïlande comme fournisseur de second rang préféré de la région."
 SIA_defense_export_contract: "Contrat d'exportation de défense"
 SIA_defense_export_contract_desc: "Avec le Bureau d'export de la défense debout et les arsenaux du royaume certifiés à la vente, le cabinet peut autoriser un nouveau contrat d'export. Véhicules First Win de Chaiseri, roquettes et munitions DTI, et systèmes construits sous licence partent vers des acheteurs de l'ASEAN de façon récurrente. Le capital politique dépensé pour sceller l'affaire revient au Trésor en recettes d'export dures, l'aile industrielle de défense payant son propre chemin."
 SIA_counter_chinese_influence: "Contrer l’influence chinoise"
 SIA_counter_chinese_influence_desc: "Déployer des ressources diplomatiques, économiques et informationnelles pour reculer l'influence de Pékin dans le voisinage de Bangkok. L'opération prend des mois et porte un coût, mais l'alternative est l'acquiescement."
 SIA_counter_indian_influence: "Contrer l’influence indienne"
 SIA_counter_indian_influence_desc: "Le soft power de New Delhi en Asie du Sud-Est — de l'investissement à la programmation culturelle aux partenariats stratégiques — s'est étendu en silence. Une campagne coordonnée de contre-influence redirige les partenaires régionaux vers Bangkok."
 SIA_renegotiate_china_contracts: "Renégocier les contrats chinois"
 SIA_renegotiate_china_contracts_desc: "Les contrats d'infrastructure des Nouvelles routes de la soie ont bâti les routes et les rails dont la Thaïlande avait besoin, mais les termes de financement enchâssent l'influence de Pékin pour une génération. Le cabinet peut accepter cette dépendance ou payer le prix politique pour renégocier les termes."
 SIA_us_security_review: "Revue de sécurité États-Unis–Thaïlande"
 SIA_us_security_review_desc: "Washington a demandé une revue de sécurité bilatérale formelle. Le résultat détermine si la Thaïlande approfondit son alignement conventionnel, avec les paquets de formation, l'accès aux achats et la visibilité politique que cela entraîne, ou maintient la couverture stratégique."
 SIA_strategic_fuel_reserve: "Construire une réserve stratégique de carburant"
 SIA_strategic_fuel_reserve_desc: "Commander un stock national de carburant de trois mois dans des parcs de citernes répartis. L'investissement lisse la volatilité des prix, fournit un tampon logistique militaire, et signale la résilience de la chaîne d'approvisionnement aux partenaires régionaux."
 SIA_anti_corruption_drive: "Offensive anticorruption"
 SIA_anti_corruption_drive_desc: "Une campagne d'application ciblée contre la corruption des achats, la fraude douanière et les réseaux de patronage enchâssés dans le gouvernement provincial. Les contrats propres sont plus lents au début, et moins chers à long terme."
 SIA_tax_modernization: "Modernisation du système fiscal"
 SIA_tax_modernization_desc: "Remplacer le système d'évaluation papier du Département des recettes par un dépôt électronique obligatoire, un audit algorithmique et des incitations d'évaluateurs basées sur le rendement. La mise en œuvre est douloureuse. Le dividende d'efficacité permanent rembourse le coût en capital en cinq ans."
 SIA_gripen_ef_upgrade: "Contrat Gripen E/F"
 SIA_gripen_ef_upgrade_desc: "Le contrat de 12 appareils Gripen E/F, signé en août 2025, représente l'engagement de la RTAF envers un chasseur capable de cinquième génération. Les premières livraisons sont attendues en 2029. Le contrat ciment le relation à long terme de la RTAF avec SAAB et verrouille le soutien de maintenance suédois jusqu'aux années 2040."
 SIA_imf_program_active: "Active IMF repayments program, started by §Y$SIA_recover_from_97_crisis$§!"
 SIA_ds_active: "L'insurrection du Deep South est active"
 SIA_ds_resolved_force: "Le Deep South a été pacifié par la force"
