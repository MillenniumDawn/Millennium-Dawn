 SUPPLY_FLOW_DELAYED_DESC: "§HОставшееся снабжение§! показывает, сколько снабжения поступает в эту провинцию; оно складывается из снабжения региона и узлов в зоне досягаемости. Дальность узлов зависит от погоды, состояния грунта, инфраструктуры, уровня железной дороги и моторизации. \n\n§HБригады§! потребляют снабжение провинции в зависимости от своего веса снабжения. Если их §Hзапас снабжения§! выше уровня снабжения в их местоположении, они будут расходовать внутренний запас, пока он не сравняется с местным снабжением.\n\nЗажмите §GCtrl§!, чтобы показать источники потоков."
