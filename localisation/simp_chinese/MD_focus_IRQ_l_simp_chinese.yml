 IRQ_expulsion_of_iranian_idea: "Expulsion of Iranians"
 IRQ_expulsion_of_foreigners_idea: "驱逐外国人"
 IRQ_democratic_youth_federation_idea: "民主青年联合会"
 IRQ_power_of_the_unions: "工会的力量"
 IRQ_al_hawasim: "哈瓦西姆"
 IRQ_mahdi_army_expansion_idea: "马赫迪军的扩张"
 IRQ_untrustworthy_neighbors: "不值得信任的邻居"
 IRQ_the_lions_den: "The Lion's Den"
 IRQ_strategic_partnerships: "战略伙伴"
 IRQ_sadrist_militias: "萨德尔运动"
 IRQ_sadrist_militias_desc: "Saraya al-Salam, the latest incarnation of the Mahdi Army, is the militia of the Sadrist Movement which is fighting on the frontlines together with the Iraqi Army. Its leader, Muqtada al-Sadr is a popular Iraqi Shia cleric and politician who has inherited his movement from his popular father. His platform is based on a cocktail of political Shiite Islam, Anti-Americanism, Iraqi independence from Iranian influence and Iraqi populist nationalism."
 IRQ_threat_of_al_qaeda: "面临灾难"
 IRQ_threat_of_al_qaeda_desc: "[IRQ.GetFlag]伊拉克武装部队解散意味着许多士兵和指挥官失业。这导致军队中的许多人与国内各种极端组织结盟，其中之一就是[AIQ.GetFlag]伊拉克基地组织。如果不加以制止，该组织可能会对我们的政府发动袭击。\n§W-----------------------------------------------------------------§!\n如果我们解决§H叛乱危机§!，该国家精神将被§R移除§!。"
 IRQ_sunni_dynamic_idea: "逊尼派政治影响"
 IRQ_sunni_dynamic_idea_desc: "The Sunni community within our nation has mobilized in order to preserve their identity, way of life, and sense of being. Due to the rise of Shi'ism, and the marginalization of the Sunnis in political life, their mobilization will work against our nation's interests.\n§W-----------------------------------------------------------------§!\nThis national spirit will change dynamically every §H10§! levels that the §HSunni Political Variable§! changes by. Currently, Sunni Political Influence is at §H[?IRQ_sunni_political_influence]/100§!\n§W-----------------------------------------------------------------§!\nWhile this national spirit is active, §H[AIQ.GetFlag] Al-Qaeda in Iraq§! can start a §Rcivil war§! if Salafism is §H20%§! or greater, stability is less than §H55%§!, and our state religion is §HShia§!"
 IRQ_triumph_over_america: "战胜美国"
 IRQ_triumph_over_america_desc: "Our soldiers taught a lesson to the Americans that they will never forget."
 IRQ_mosque_income_idea: "增加清真寺税"
 IRQ_mosque_income_idea_desc: "为了资助国内的各种项目，我们增加了清真寺的税收"
 IRQ_PIJ_idea: "巴勒斯坦圣城旅"
 IRQ_PIJ_idea_desc: "巴勒斯坦圣城旅目前正在我们国家开展活动，将帮助我们反击犹太复国主义国家。\n§W-----------------------------------------------------------------§!\n如果§H复兴党§!不再掌权，或者[ISR.GetFlag]§H以色列§!不存在，该国家精神将被§R移除§!"
 IRQ_cult_of_saddam: "萨达姆崇拜"
 IRQ_cult_of_saddam_desc: "Our great leader, Saddam Hussein, has brought great wealth and dignity to [IRQ.GetFlag] Iraq. His contributions must be cherished while he is still around.\n§W-----------------------------------------------------------------§!\nThis national spirit will be §Rremoved§! if the §HBa'athist party§! is no longer in power, or if §HSaddam Hussein§! is no longer the leader."
 IRQ_air_support_granted: "针对叛乱分子的空中支援"
 IRQ_air_support_granted_desc: "我们的空军正在昼夜不停地为我国境内的叛乱分子提供空中支援。"
 IRQ_recovering_from_the_gulf_war: "从海湾战争中恢复"
 IRQ_recovering_from_the_gulf_war_desc: "在毁灭性的海湾战争之后，伊拉克陷入了混乱和毁灭的状态。这场冲突的特点是激烈的空中和地面行动，见证了对该国产生持久影响的重大战斗。从最初的空袭和解放科威特到击退伊拉克军队的地面战役，这场战争造成了沉重的损失。"
 IRQ_MEK_bases: "伊朗人民圣战者组织基地"
 IRQ_MEK_bases_desc: "Recognizing the strategic importance of the Mojahedin e Khalq (MEK) during the Iran-Iraq War, Iraq seeks to leverage their assistance and establish bases to enhance its military capabilities. This allows for the establishment of MEK bases within Iraq to threaten Iran, enabling an increase in the maximum number of volunteer forces that can be mobilized. Like its use in 1991 against the Kurds."
 IRQ_high_political_opposition: "政治反对声音强烈"
 IRQ_high_political_opposition_desc: "伊拉克面临着严峻挑战，因为它面临着来自不同少数民族和宗教群体的强烈政治反对。"
 IRQ_bastion_of_baathism: "复兴党堡垒"
 IRQ_bastion_of_baathism_desc: "在伊拉克这片肥沃的土地上，复兴党的种子被播撒下来，并在当时的挑战和愿望中生根发芽。富有远见的领导人涌现出来，他们渴望民族团结、阿拉伯民族主义和追求社会正义。愿阿拉伯人永远团结！"
 IRQ_international_sanctions: "国际制裁"
 IRQ_international_sanctions_desc: "2000 年，伊拉克遭受了1991年海湾战争后实施的国际制裁的不利影响。这些制裁严重限制了伊拉克参与国际贸易的能力，阻碍了其经济复苏，并导致伊拉克人民的生活水平下降。制裁还产生了严重的人道主义后果，影响了伊拉克获得医疗保健、基本服务和基本需求所需资源的机会。这些制裁的长期影响塑造了这一时期伊拉克的经济和社会格局。"
 IRQ_conscriptions_in_schools: "学校征兵"
 IRQ_conscriptions_in_schools_desc: "我们让孩子们逃课，以便将他们征召加入我们的军队。"
 IRQ_fadayyene_saddam: "萨达姆敢死队"
 IRQ_fadayyene_saddam_desc: "我们已命令萨达姆敢死队几个部队在全国各地建立防御阵地。"
 IRQ_kurdish_friends: "[KUR.GetFlag]库尔德人之友"
 IRQ_kurdish_friends_desc: "The [KUR.GetFlag] Kurds have historically been ousted by most nations in the region, thus isolating them and leaving them with little to no friends. It's about time that we strengthen our friendship with the [KUR.GetFlag] Kurds, so that we may get what we want, liberation, freedom, and independence from foreign powers."
 IRQ_negotiations_with_kurdish_government: "与[KUR.GetFlag]库尔德政府的谈判"
 IRQ_negotiations_with_kurdish_government_desc: "通过与[KUR.GetFlag]库尔德政府开通沟通渠道，我们也许能够在不发生流血事件的情况下将库尔德人重新融入我们的国家。"
 IRQ_bolster_communist_party_of_kurdistan_iraq: "支持£KUR_Neutral_Communism_small [KUR.GetFlag]库尔德斯坦共产主义理想"
 IRQ_bolster_communist_party_of_kurdistan_iraq_desc: "The [KUR.GetFlag] Kurdish people need one thing, and that is independence and liberation from all forms of foreign exploitation. By promoting communist ideals in [KUR.GetFlag] Kurdistan, we may be able to sway their people to finally join us hand in hand in this movement."
 IRQ_request_an_election: "要求选举"
 IRQ_request_an_election_desc: "通过向现任[KUR.GetFlag]库尔德政府施压，要求其举行选举，[KUR.GetFlag]库尔德共产党人可能最终有机会赢得合法席位。"
 IRQ_rojava_shipments: "开始向[ROJ.GetFlag]西库尔德斯坦发货"
 IRQ_rojava_shipments_desc: "[SYR.GetFlag]叙利亚政府历来压迫[ROJ.GetFlag]西库尔德斯坦的库尔德人，我们必须尽可能地给予他们必要的支持，以求解放这些人民。"
 IRQ_shipping_to_rojava: "运输路线上的货物..."
 IRQ_shipping_to_rojava_desc: "货车的车轮在叙利亚的土地上转啊转。"
 IRQ_political_decisions: "伊拉克国内政治"
 IRQ_recall_nsa_bahrain: "召回贾法勒海军基地"
 IRQ_recall_nsa_bahrain_desc: "现在是时候夺取并巩固对美国占领的贾法勒海军基地的控制了！"
 IRQ_mek_revolt_trig: "叛乱"
 IRQ_mek_revolt_trig_desc: "今天，我们可以让伊朗的反对派伊朗人民圣战者组织发动一次跨境袭击，彻底推翻毛拉政权！"
 IRQ_the_blood_quran: "完成‘血书古兰经’"
 IRQ_the_blood_quran_desc: "通过完成并公布用萨达姆·侯赛因的鲜血写成的《血书古兰经》，我们的政府将能够试图向[IRQ.GetFlag]伊拉克人民展示其虔诚，但这也可能适得其反…"
 IRQ_smuggle_goods_from_jordan: "从[JOR.GetFlag]约旦走私货物"
 IRQ_smuggle_goods_from_jordan_desc: "侯赛因家族与[JOR.GetFlag]约旦的某些人有很多联系，利用这些关系，我们可以在政府不知情的情况下通过边境走私一些货物。"
 IRQ_al_salam_palace: "重新设计萨拉姆宫"
 IRQ_al_salam_palace_desc: "The Al-Salam Palace was initially designed in 1950, more than 50 years ago, and since then the palace has begun showing its age. Redesigning certain aspects of it could be useful in helping [IRQ.GetLeader] clear his mind when he needs to."
 IRQ_arrest_muqtada: "逮捕穆克塔达·萨德尔"
 IRQ_arrest_muqtada_desc: "That cockroach Muqtada has been running his mouth recently, and just like his father, we might need to find a solution."
 IRQ_civil_war_mechanic: "叛乱危机"
 IRQ_civil_war_mechanic_desc: "§H萨达姆的统治§!的崩溃将会引发伊拉克军队的总崩溃。我们许多§H退役军人§!都毕生致力于§R反对§!我们的国家，无论是为他们自己的组织还是§R圣战组织§!。我们最初会与§R萨拉菲派§!发生冲突，但如果我们不与§H什叶派§!结盟，他们很快就会变成我们的敌人。我们需要攻击每个省份的叛乱分子，直到他们足够弱小时§H投降§!。我们的§H准备情况§!将决定我们行动的成功。§H准备情况§!随着我们进行更多操作或关注某些特定国策，情况将会改善。\n\n我们可以通过点击状态来进行操作。我们在每次行动中都会损失§H设备§!和§H人员§!。\n\n地图将§H动态§!改变颜色来显示您的§H进度§!。\n\n§p紫色§! - 库尔德部队\n§R红色§! - 萨拉菲圣战力量\n§Y黄色§! - 什叶派力量\n§O橙色§! - 中等叛乱\n§G绿色§! - 低等叛乱\n\n§H准备情况§!: [?IRQ_government_readiness]%\n§H部队人员§!: [?IRQ_government_troops]\n§H省份安全§!: [?IRQ_variable_for_win]\n\n\n\n\n\n"
 IRQ_start_negotiations_shias: "开始与什叶派民兵进行谈判"
 IRQ_start_negotiations_shias_desc: "我们将与众多什叶派民兵组织坐到谈判桌前，达成协议消灭我们的共同敌人。如果我们不能迅速让他们站到我们这边，他们可能会变得充满敌意！"
 IRQ_request_coalition_forces: "请求空中支援"
 IRQ_request_coalition_forces_desc: "如果空军整天无所事事，那我们为什么要为飞行员付钱呢？我们需要利用我们在天空中的优势来粉碎叛乱分子，让他们屈服。"
 IRQ_request_awakening_council_militias: "福斯特为伊拉克之子做演讲"
 IRQ_request_awakening_council_militias_desc: "伊拉克之子，即逊尼派部落和其他团体提议成立的联盟，旨在反击叛乱分子。我们可以吸收他们的军队，这样我们就能在数量上压倒叛乱分子。"
 IRQ_militarize_police_force: "警察军事化"
 IRQ_militarize_police_force_desc: "我们将从警察部队手中夺取武器和人力，并将他们编入军队，帮助反击叛乱分子，即使我们不得不在训练他们方面偷工减料。"
 IRQ_recruitment_campaign: "训练效果"
 IRQ_recruitment_campaign_desc: "我们必须训练和调教我们的士兵，让他们能够安全有效地对付叛乱分子。这样做也有助于减少生命危险。"
 IRQ_iraq_war: "为生存而战"
 IRQ_iraq_war_desc: "The war for Iraq and its lands has begun. The United States will have a maximum of 6 months to capitulate the Iraqi government, or else they will have to order an immediate withdrawal from the nation and risk their influence."
 IRQ_war_phase_one: "第一阶段"
 IRQ_war_phase_two: "第二阶段"
 IRQ_war_phase_two_desc: "美国人将会颤抖，他们的努力将会白费！"
 IRQ_preparation_for_the_war: "战争"
 IRQ_preparation_for_the_war_desc: "那些位于 [USA.GetFlag]§H[USA.GetName]§!的帝国主义者已经开始了针对我们国家的§RUnjustified§!运动！\n\n我们必须集中我们的国家力量和资源，并§H为生存战做好准备§!。利用我们所拥有的资源以及§H两伊战争§!和§H海湾战争§!的经验，我们将为任何入侵者创造一个绝对的地狱之洞。\n\n如果我们成功抵挡美国人§H至少6个月§!，他们的人民将会向他们施压，要求他们就这场不受欢迎的战争§H停火§!！"
 IRQ_threaten_kuwait: "威胁[KUW.GetFlag]科威特"
 IRQ_threaten_kuwait_desc: "The Americans have a base right under our nose, and the Kuwaitis are at fault for this. We will demand that they swiftly take control so that the Americans cannot attack us from Middle Eastern lands."
 IRQ_restore_the_iron_ring: "恢复铁环"
 IRQ_restore_the_iron_ring_desc: "铁环在80年代的两伊战争中发挥了防御伊朗人的作用。我们必须尽快将其恢复。"
 IRQ_golden_guard_divisions: "组建金卫军师"
 IRQ_golden_guard_divisions_desc: "为了保卫我们的国家，我们将动员几个金卫师，并且我们将尽可能地对他们进行最高程度的训练。"
 IRQ_conscription_in_schools: "学校征兵"
 IRQ_conscription_in_schools_desc: "We absolutely must get more manpower to field our units in the time of war, and schools are a perfect location for this very reason. They can get an education later."
 IRQ_kurdish_compromise: "[KUR.GetFlag]库尔德妥协"
 IRQ_kurdish_compromise_desc: "We will come to an agreement with the [KUR.GetFlag] Kurds, and secure our northern front from any sudden attacks if they accept, that is."
 IRQ_faddayean_saddam: "动员萨达姆敢死队"
 IRQ_faddayean_saddam_desc: "We need to prepare the Fedayeen Saddam for the incoming invasion, and by all means we must equip and train more divisions to continue the fight no matter what."
 IRQ_weapons_concealment: "加强导弹计划"
 IRQ_weapons_concealment_desc: "如果需要的话，我们需要迅速加强我们的导弹计划，以便从远处摧毁敌人。"
 IRQ_contract_the_MEK: "联系£PER_anarchist_communism 伊朗人民圣战者组织"
 IRQ_contract_the_MEK_desc: "Mojahedin-e Khalq, or the £PER_anarchist_communism MEK have been residing in our country for a very long time. It is about time that we have them do something actually useful for our nation."
 IRQ_economic_union_menu: "伊斯兰繁荣联盟"
 IRQ_invite_to_economic_union_targeted_decision: "邀请[FROM.GetName]"
 IRQ_kick_from_economic_union_targeted_decision: "踢出[FROM.GetName]"
 IRQ_the_constitution: "伊拉克宪法"
 IRQ_the_constitution_desc: "在推翻§Y萨达姆·侯赛因§!及其后的§Y复兴党§!之后，我们国家肩负着§Y起草新宪法§!的重任，以建立一个更加§Y民主和自由的伊拉克§!。我们起草的§Y宪法§!每一§Y节§!都会§Y影响§!未来的参选党派，以及谁有权参选。"
 IRQ_constitution_draft_government_type: "第一条：伊拉克政府"
 IRQ_constitution_draft_government_type_desc: "我们的宪法必须明确规定我们的国家是伊斯兰共和国还是世俗共和国。"
 IRQ_constitution_draft_languages: "第二条：伊拉克的语言"
 IRQ_constitution_draft_languages_desc: "语言是团结人民的纽带，而大部分人民讲的不是阿拉伯语。我们必须决定是否允许其他语言成为国家语言。"
 IRQ_constitution_draft_nationalism: "第三条：伊拉克的爱国主义"
 IRQ_constitution_draft_nationalism_desc: "历史证明，极端民族主义和爱国主义导致了我们国家的灭亡。我们必须在第三条​​中澄清这一点。"
 IRQ_constitution_draft_democratic_form: "第四条：伊拉克联邦化"
 IRQ_constitution_draft_democratic_form_desc: "我们的国家由许多不同的民族组成，包括库尔德人、亚述人、土库曼人等等。我们的宗教派别也存在很大分歧，特别是什叶派和逊尼派之间的分歧。这些都必须在我们的宪法中得到解决。"
 IRQ_constitution_draft_militias: "第五条：伊拉克的安全"
 IRQ_constitution_draft_militias_desc: "尽管我们的国家将拥有武装部队，但许多人并不相信政府能保证他们的安全，因此组建了民兵组织。我们必须澄清这些民兵组织是否合法。"
 IRQ_constitution_draft_identity: "第六条：伊拉克的身份认同"
 IRQ_constitution_draft_identity_desc: "伊拉克是由多民族组成的，我们必须明确伊拉克是否将采取阿拉伯身份，还是多元文化身份。"
 IRQ_black_gold_decisions: "黑金"
 IRQ_black_gold_decisions_desc: "Part of our post-victory plan is to secure economic domination in the region. Through the exploitation of corruption amongst the Southern Khaleeji states, we are able to slowly increase our grip over their most precious resource, oil. We will need to increase our influence in these nations in order to gain access to new decisions (such as buying up more shares) that will allow us to get one step closer to seizing these precious resources. Once we get more than 50% control over Aramco, we will be able to make an attempt to seize the company. The higher the control we have, the higher the chance of success will be.\n\n[SAU.GetFlag] Aramco Control: [?IRQ_aramco_control]/100"
 IRQ_open_aramco_scheme: "打开[SAU.GetFlag]沙特阿拉伯石油公司决议"
 IRQ_close_aramco_scheme: "关闭[SAU.GetFlag]沙特阿拉伯石油公司计划决议"
 IRQ_find_dirt_on_saudi_king: "寻找[SAU.GetLeader]的秘密"
 IRQ_find_dirt_on_saudi_king_desc: "获取沙特阿拉伯石油公司股票的第一步是找到可以勒索[SAU.GetFlag][SAU.GetLeader]的东西。"
 IRQ_establish_the_hussein_fund: "建立侯赛因基金"
 IRQ_establish_the_hussein_fund_desc: "通过建立侯赛因基金，我们将能够通过该组织将资金注入[SAU.GetFlag]沙特阿拉伯石油公司股票，而不会引起太多关注。"
 IRQ_buy_shares_of_aramco: "买入股票"
 IRQ_buy_shares_of_aramco_desc: "有了侯赛因基金，我们就可以购买少量的[SAU.GetFlag]沙特阿拉伯石油公司股份，这样我们就可以在最初的投资之后购买更多的股份。"
 IRQ_prop_up_iraqi_ceo: "支持[IRQ.GetFlag]伊拉克首席执行官"
 IRQ_prop_up_iraqi_ceo_desc: "通过拉拢关系，我们可以扶持一位[IRQ.GetFlag]伊拉克首席执行官担任[SAU.GetFlag]沙特阿拉伯石油公司的新首席执行官，从而增强我们对该公司的控制权。"
 IRQ_seize_aramco: "夺取[SAU.GetFlag]沙特阿拉伯石油公司"
 IRQ_seize_aramco_desc: "时机已到，我们必须开始积极接管该公司，以确保获取[SAU.GetFlag][SAU.GetName]的宝贵资源！"
 IRQ_send_over_iraqis_to_saudi_arabia: "Send over [IRQ.GetFlag] Iraqis to [SAU.GetFlag] [SAU.GetName]"
 IRQ_send_over_iraqis_to_saudi_arabia_desc: "By paying for the flights of thousands of [IRQ.GetFlag] Iraqis, we are able to ensure proper [IRQ.GetFlag] Iraqi influence in [SAU.GetFlag] [SAU.GetName]."
 IRQ_encourage_iraqis_to_work_for_aramco: "Encourage [IRQ.GetFlag] Iraqis to Work for [SAU.GetFlag] Aramco"
 IRQ_encourage_iraqis_to_work_for_aramco_desc: "由于我们派遣了人员到[SAU.GetName]，我们能够让他们为[SAU.GetFlag]沙特阿拉伯石油公司工作，以便在公司内部建立潜在的联系。"
 IRQ_buy_more_shares: "购买更多股票"
 IRQ_buy_more_shares_desc: "我们可以通过我们的侯赛因基金购买更多该公司的股份，从而增强对[SAU.GetFlag]沙特阿拉伯石油公司的控制权。"
 IRQ_regional_baathism_decisions: "£IRQ_Nat_Autocracy_small 地区复兴党"
 IRQ_regional_baathism_decisions_desc: "我们的派系拥有来自该地区乃至全球的支持者。通过团结复兴党意识形态的追随者，我们能够建立一个由我们控制的地区指挥网络。通过任命高级忠诚的伊拉克官员作为他们的领导人，我们可以确保这些国家的绝对忠诚。"
 IRQ_appoint_control_syria: "建立£IRQ_Nat_Autocracy_small [SBP.GetFlag]叙利亚复兴党地区指挥部"
 IRQ_appoint_control_egypt: "Establish the £IRQ_Nat_Autocracy_small [EBP.GetFlag] Egyptian Regional Command"
 IRQ_appoint_control_jordan: "Establish the £IRQ_Nat_Autocracy_small [JBP.GetFlag] Jordanian Regional Command"
 IRQ_clergy_balance_of_power_category: "回归信仰运动"
 IRQ_secularists_bop_mid_range: "伊斯兰主义与世俗主义之间"
 IRQ_secularists_bop_left_win_range: "世俗化国家"
 IRQ_secularists_bop_left_advanced_range: "高度世俗化社会"
 IRQ_secularists_bop_left_medium_range: "社会自由主义的增长"
 IRQ_secularists_bop_left_low_range: "适度世俗社会"
 IRQ_clergy_bop_right_win_range: "伊斯兰教法国家"
 IRQ_clergy_bop_right_advanced_range: "伊斯兰社群"
 IRQ_clergy_bop_right_medium_range: "伊斯兰思想的复兴"
 IRQ_clergy_bop_right_low_range: "温和伊斯兰社群"
 IRQ_promote_female_participation: "促进女性参与"
 IRQ_promote_female_participation_desc: "我们将鼓励女性参与社会并成为劳动力的重要组成部分。"
 IRQ_promotion_of_iraqi_identity: "宣传伊拉克身份认同"
 IRQ_promotion_of_iraqi_identity_desc: "Our people must know who they are, and their history, culture, and language are a part of their identity that must be reinforced."
 IRQ_restoration_of_ancient_sights: "Renovation of Historical Sites"
 IRQ_restoration_of_ancient_sights_desc: "我们的历史是我们国家的一个非常重要的部分，因为我们的人民必须认识到他们曾经取得的伟大成就，以及他们必须再次为之奋斗的伟大成就。"
 IRQ_promotion_of_saddam: "弘扬复兴党的成就"
 IRQ_promotion_of_saddam_desc: "每条街道、每户人家、每间办公室、每所学校，都必须挂上复兴党历史上最伟大领袖的画像。我们的人民必须知道是谁建立了这个国家，以及应该感谢谁。"
 IRQ_power_of_mosques: "扩大清真寺的权力"
 IRQ_power_of_mosques_desc: "清真寺掌握着这个国家的权力，我们必须接受这个事实。通过扩大他们的权力，我们能够向他们表明我们站在他们一边。"
 IRQ_crack_down_on_haram: "抵制不道德的行为"
 IRQ_crack_down_on_haram_desc: "我们的社会绝不能被西方帝国主义的幌子所腐蚀。我们必须用尽一切手段反击这些对伊拉克社会的渗透。"
 IRQ_upholding_sharia: "维护伊斯兰教法"
 IRQ_upholding_sharia_desc: "我们国家的法律是伊斯兰教法，如果有恶人试图规避社会规范，我们有责任维护伊斯兰教法。"
 IRQ_clergy_right_side: "伊斯兰主义者"
 IRQ_secularists_bop_left_side: "世俗主义者"
 IRQ_debaath_balance_of_power_category: "£IRQ_Nat_Autocracy_small [IRQ.GetFlag]伊拉克去复兴党化"
 IRQ_baathists_bop_right_low_range: "复兴党圈子"
 IRQ_baathists_bop_right_medium_range: "复兴党示威"
 IRQ_baathists_bop_right_advanced_range: "复兴党复兴"
 IRQ_baathists_bop_right_win_range: "复兴党政变"
 IRQ_antibaathists_bop_left_low_range: "去复兴党化的政府"
 IRQ_antibaathists_bop_left_medium_range: "对复兴党人的迫害"
 IRQ_antibaathists_bop_left_advanced_range: "日常生活中的去复兴党化"
 IRQ_antibaathists_bop_left_win_range: "伊拉克复兴党的终结"
 IRQ_antibaathists_bop_mid_range: "脆弱的政府"
 IRQ_antibaathists_bop_left_side: "反复兴党人"
 IRQ_baathists_right_side: "复兴党人"
 IRQ_anti_baath_sentiment_schools: "学校里的反复兴党情绪"
 IRQ_anti_baath_sentiment_schools_desc: "侯赛因在位期间对伊拉克教育系统造成了巨大破坏，用政府宣传腐蚀了所有上学学生的大脑。我们需要确保消除损害，让我们的学生认识到复兴党的真正恐怖。"
 IRQ_anti_baath_ad_campaigns: "反复兴党电视宣传运动"
 IRQ_anti_baath_ad_campaigns_desc: "The Iraqi populace spends a lot of their time on their couches, watching television either alone or with their families. We need to make sure that in between their shows, they don't forget about the atrocities committed by the Ba'athists."
 IRQ_persecute_potential_baathists: "调查潜在的复兴党人"
 IRQ_persecute_potential_baathists_desc: "伊拉克社会中仍有大量复兴党同情者，他们已经陷入了我们社会的夹缝中。对这些傻瓜展开调查将是有益的。"
 IRQ_sunni_in_politics: "宗派地震"
 IRQ_sunni_in_politics_desc: "Our government will need to manage 3 factors regarding the Sunnis in the nation, §HSatisfaction§!, §HRadicalization§!, and §HPolitical Influence§!\n\nSatisfaction will determine the Sunnis' overall happiness with the government's decision making. If Sunni §HSatisfaction§! is lower than §H30/50§!, then §HRadicalization§! will start gradually increasing. Lower §HSatisfaction§! will also exponentially increase the rate of §HRadicalization§! anytime it increases (Will begin to multiply).\n\n§HRadicalization§! will be the frequency that Iraqi Sunnis join extremist groups, as well as how politically active they will be. Anytime the §HRadicalization§! amongst the Sunnis increases, they will become more politically active and will have a higher §HPolitical Influence§!.\n\n§HPolitical Influence§! will determine the growth in Sunni-led political parties within our nation. There is also a random chance that our Sunni Generals will launch a coup if Sunni §HPolitical Influence§! and §HRadicalization§! is high.\n\nSunni Satisfaction: §H[?IRQ_sunni_satisfaction]/50§!\nSunni Radicalization: §H[?IRQ_sunni_radicalization]/75§!\nSunni Political Influence: §H[?IRQ_sunni_political_influence]/100§!"
 IRQ_satisfy_sunnis: "满足逊尼派的需求"
 IRQ_satisfy_sunnis_desc: "In order to get on the good side of our Sunnis, we are going to have to direct more resources in developing their standard of living, and giving them a greater voice in our government which is primarily led by Shi'ite individuals."
 IRQ_redirect_sunni_resources: "重定向逊尼派资源"
 IRQ_redirect_sunni_resources_desc: "逊尼派社区当然不会介意拥有更少的资源，特别是因为我们的政府肯定可以利用这些重要资源。"
 IRQ_make_a_promise: "作出承诺"
 IRQ_make_a_promise_desc: "由于逊尼派民众的满意度较低，我们能够做出承诺，这将使我们有机会证明我们的政府值得履行我们的职责。\n§W-----------------------------------------------------------------§!\n该决议的循环周期为180天。"
 IRQ_resolve_the_crisis: "解决危机"
 IRQ_resolve_the_crisis_desc: "The time has come for us to resolve the sectarian earthquake that has rocked our nation."
 IRQ_lower_iranian_influence_1: "消除[PER.GetFlag]伊朗影响"
 IRQ_lower_iranian_influence_1_desc: "We have promised our Sunnis that we will lower Iranian influence."
 IRQ_anbar_infrastructure: "改善安巴尔的基础设施"
 IRQ_anbar_infrastructure_desc: "我们承诺改善安巴尔的基础设施。"
 IRQ_salahuddin_infrastructure: "改善萨拉赫丁的基础设施"
 IRQ_salahuddin_infrastructure_desc: "我们承诺改善萨拉赫丁的基础设施。"
 IRQ_nineveh_infrastructure: "改善尼尼微的基础设施"
 IRQ_nineveh_infrastructure_desc: "我们承诺改善尼尼微的基础设施。"
 IRQ_anbar_airbase: "改善安巴尔的机场"
 IRQ_anbar_airbase_desc: "我们承诺改善位于安巴尔的机场。"
 IRQ_salahuddin_airbase: "改善萨拉赫丁的机场"
 IRQ_salahuddin_airbase_desc: "我们承诺改善位于萨拉赫丁的机场。"
 IRQ_nineveh_airbase: "改善尼尼微的机场"
 IRQ_nineveh_airbase_desc: "我们承诺改善位于尼尼微的机场。"
 IRQ_economic_prosperity: "改善经济状况"
 IRQ_economic_prosperity_desc: "我们承诺改善伊拉克的经济状况。"
 IRQ_smaller_government: "Limit the Government's Reach"
 IRQ_smaller_government_desc: "我们承诺确保政府在伊拉克社会中扮演较小的角色。"
 IRQ_sunni_internet: "改善互联网基础设施"
 IRQ_sunni_internet_desc: "We've promised to improve internet infrastructure in the Western Regions populated by Sunnis."
 IRQ_pmf_decisions: "人民动员部队"
 IRQ_pmf_decisions_desc: "The §HPMF§!, or §HPopular Mobilization Forces§! are a series of §HMilitias§! that have banded together to form an umbrella group for the security of the nation. We are able to §HMobilize§! these §HMilitias§! at a cost in order to prepare for a war against our enemies. Total mobilization could take years, however we are able to deploy the §HPMF§! at any time relative to the mobilization rate.\n\nWhile the §HPMF§! is deployed, we will suffer from §Rincreased troop up-keep§!, but we are able to §HDemobilize§! them in order to save our budget.\n\nIf we are at war, mobilization will progress §HDouble§! its standard rate monthly."
 IRQ_begin_mobilization: "开始动员"
 IRQ_begin_mobilization_desc: "通过动员人民动员组织，我们将拥有足够数量的力量来应对该地区的任何威胁。"
 IRQ_stop_mobilization: "停止动员"
 IRQ_stop_mobilization_desc: "维持人民动员组织的动员是一项代价高昂的任务，为了拯救我们的国家免于经济崩溃，就必须停止人民动员组织的动员。"
 IRQ_deploy_the_pmf: "部署人民动员"
 IRQ_demobilize_the_pmf: "复员人民动员"
 IRQ_demobilize_the_pmf_desc: "现在是我们应该解散人民动员组织的时候了，因为他们的援助对我们的武装部队不再有任何用处。"
 IRQ_spring_of_islam: "伊斯兰之春"
 IRQ_spring_of_islam_desc: "In order to expand the reach of our alliance and ideology, we will need to export §HShi'ite Revolutions§! in nations with some semblance of §HShi'ite Movements§!. We will disguise the movements as Islamic in nature, but will have them spearheaded by §HShi'ite§! leaders and groups to ensure that there is no hijacking of our influence. We will expand our influence within the nations in order to influence their §HMilitaries and Governmental Bodies§! to win them over when the revolution comes. The first stage will be arming and funding the rebels, which will then allow us to give them the greenlight to start their §HRevolution§!.\n"
 IRQ_arm_rebels_in_jordan: "[JOR.GetFlag]约旦武装叛乱"
 IRQ_arm_rebels_in_jordan_desc: "We can fund, train, and arm Shi'ites in [JOR.GetFlag] Jordan and prepare them to overthrow the [JOR.GetFlag] Jordanian government in order to install an Islamic Republic."
