 DIVISION_COMMANDER_DESCRIPTION_TEXT: "§HOficerowie polowi§! to dowódcy odpowiedzialni za poszczególne brygady. Podległe im jednostki mogą wykonywać różnorodne działania bojowe, za które można otrzymać wyróżnienia zapewniające określone korzyści. Ponadto, dowodząc brygadą, oficer może gromadzić doświadczenie oraz rozwijać cechy osobowości – zostaną one uwzględnione w przypadku jego awansu na stopień generała armii."
