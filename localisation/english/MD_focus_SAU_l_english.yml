 SAU_events.322.t: "Stage III: Achieve a Fully Modern Force"
 SAU_events.33.a: "Become the bridge to Europe."
 SAU_events.33.b: "We will not provoke Russia."
 SAU_events.33.d: "Saudi Arabia asks us to carry their pipeline onward into Europe. We would become the gatekeeper of Gulf oil to the West, collecting our toll on every barrel, and Moscow would not thank us for it."
 SAU_events.33.t: "The Road to Europe"
 SAU_events.330.a: "Buy American: the M1A2 Abrams"
 SAU_events.330.b: "Diversify our arms suppliers"
 SAU_events.330.c: "Build a domestic arms industry"
 SAU_events.330.d: "Expand the National Guard"
 SAU_events.330.desc: "The Gulf War laid bare how unready our army was to defend the Kingdom on its own. The Royal Saudi Land Forces must be rebuilt - but with whose weapons, and along what lines?"
 SAU_events.330.t: "Rebuilding the Land Forces"
 SAU_events.331.a: "French frigates: the Sawari programme"
 SAU_events.331.b: "American ships and training"
 SAU_events.331.c: "Coastal defence and patrol boats"
 SAU_events.331.d: "Reach for a blue-water fleet"
 SAU_events.331.desc: "From the Arabian Gulf to the Red Sea, the Kingdom must guard two long coasts and the world's oil lifeline. What kind of fleet shall we build?"
 SAU_events.331.t: "A Navy for Two Seas"
 SAU_events.332.a: "American Eagles: the Peace Sun programme"
 SAU_events.332.b: "British jets: the Al Yamamah deal"
 SAU_events.332.c: "Russian Power: the MIG-31"
 SAU_events.332.d: "Air defence first: the Peace Shield"
 SAU_events.332.desc: "The air force is the first shield of the Kingdom and its sharpest sword. Which path shall the Royal Saudi Air Force follow?"
 SAU_events.332.t: "Command of the Skies"
 SAU_events.333.a: "American: the M1A2 Abrams"
 SAU_events.333.b: "Russian: the T-90"
 SAU_events.333.c: "French: the Leclerc"
 SAU_events.333.d: "German: the Leopard 2"
 SAU_events.333.desc: "The army needs a modern main battle tank. From which power shall we buy - or shall we build them at home? The choice shapes whom the Kingdom depends on."
 SAU_events.333.e: "Build them at home"
 SAU_events.333.t: "Choosing the Main Battle Tank"
 SAU_events.334.a: "Aim the missiles at Tehran"
 SAU_events.334.b: "Hold them as a silent deterrent"
 SAU_events.334.c: "Expand the missile arsenal"
 SAU_events.334.desc: "The Strategic Missile Force gives the Kingdom a weapon of last resort. What posture shall it take?"
 SAU_events.334.t: "The Strategic Deterrent"
 SAU_events.335.a: "Counter-terrorism at home"
 SAU_events.335.b: "Power projection abroad"
 SAU_events.335.c: "Train with Western special forces"
 SAU_events.335.desc: "Our special forces are ready. Where shall their edge be turned?"
 SAU_events.335.t: "Special Forces Doctrine"
 SAU_events.336.a: "American frigates (MMSC)"
 SAU_events.336.b: "Russian frigates (Gorshkov)"
 SAU_events.336.c: "French frigates (Sawari)"
 SAU_events.336.d: "German frigates (MEKO)"
 SAU_events.336.desc: "The navy needs modern frigates to guard two seas. Whose shipyard shall build them - or shall we build our own?"
 SAU_events.336.e: "Domestic shipbuilding"
 SAU_events.336.t: "Choosing the Frigate Supplier"
 SAU_events.337.a: "An amphibious assault force"
 SAU_events.337.b: "Coastal and island defence"
 SAU_events.337.c: "A GCC rapid-reaction role"
 SAU_events.337.desc: "The new Marine force needs a role. What shall it be?"
 SAU_events.337.t: "The Marine Force"
 SAU_events.338.a: "Buy the maximum number of F-15s"
 SAU_events.338.b: "Keep a balanced air force"
 SAU_events.338.c: "Invest in pilot training"
 SAU_events.338.desc: "The Peace Sun programme has brought the F-15 Eagle to the Kingdom. How far shall we take it?"
 SAU_events.338.t: "Peace Sun"
 SAU_events.339.a: "Commit fully to the Typhoon"
 SAU_events.339.b: "Diversify away from Washington"
 SAU_events.339.c: "Push for technology transfer"
 SAU_events.339.desc: "The Eurofighter Typhoon offers a path beyond American jets. How shall we pursue it?"
 SAU_events.339.t: "The Al Salam Deal"
 SAU_events.34.a: "A costly blow."
 SAU_events.34.d: "Saboteurs have struck the pipeline running west toward the Mediterranean. The oil has stopped, and the route is lost until it can be rebuilt."
 SAU_events.34.t: "The Levant Pipeline Is Severed"
 SAU_events.340.a: "An offensive air doctrine"
 SAU_events.340.b: "A defensive air shield"
 SAU_events.340.c: "An integrated GCC air command"
 SAU_events.340.desc: "The Air Operations Command unifies the air force. What doctrine shall guide it?"
 SAU_events.340.t: "Command of the Skies"
 SAU_events.341.a: "Modernize aggressively with Western help"
 SAU_events.341.b: "A balanced, measured build-up"
 SAU_events.341.c: "Prioritise internal security and loyalty"
 SAU_events.341.desc: "With the armed forces re-founded, the Kingdom must set its overall course. How shall we shape the military?"
 SAU_events.341.t: "The Posture of the Armed Forces"
 SAU_events.342.a: "American: the M109 Paladin"
 SAU_events.342.b: "Russian: the 2S19 Msta"
 SAU_events.342.c: "French: the CAESAR"
 SAU_events.342.d: "German: the PzH 2000"
 SAU_events.342.desc: "The guns must keep pace with the armor. Whose self-propelled artillery shall we field - or shall we build our own?"
 SAU_events.342.e: "Build them at home"
 SAU_events.342.t: "Choosing the Self-Propelled Artillery"
 SAU_events.343.a: "American: the M270 MLRS"
 SAU_events.343.b: "Russian: the BM-30 Smerch"
 SAU_events.343.c: "French: the LRU"
 SAU_events.343.d: "German: the MARS II"
 SAU_events.343.desc: "Massed rocket fire can shatter an enemy advance. Whose launchers shall we acquire - or shall we build our own?"
 SAU_events.343.e: "Build them at home"
 SAU_events.343.t: "Choosing the Rocket Artillery"
 SAU_events.344.a: "Approve the sale."
 SAU_events.344.b: "Decline the request."
 SAU_events.344.desc: "Saudi Arabia has asked to purchase American fighter aircraft. Approving the sale would deepen Riyadh's dependence on our defense industry."
 SAU_events.344.t: "Saudi Request for American Fighters"
 SAU_events.345.a: "Approve the sale."
 SAU_events.345.b: "Decline the request."
 SAU_events.345.desc: "Saudi Arabia has asked to purchase British fighter aircraft. Approving the sale would strengthen a lucrative defense partnership."
 SAU_events.345.t: "Saudi Request for British Fighters"
 SAU_events.346.a: "Approve the sale."
 SAU_events.346.b: "Decline the request."
 SAU_events.346.desc: "Saudi Arabia has asked to purchase Russian fighter aircraft. Approving the sale would open a major new market in the Gulf."
 SAU_events.346.t: "Saudi Request for Russian Fighters"
 SAU_events.347.a: "Approve the sale."
 SAU_events.347.b: "Decline the request."
 SAU_events.347.desc: "Saudi Arabia has asked to purchase a large shipment of M1A2 Abrams tanks. The sale would bind the Kingdom more closely to American logistics and training."
 SAU_events.347.t: "Saudi Request for American Tanks"
 SAU_events.348.a: "Approve the sale."
 SAU_events.348.b: "Decline the request."
 SAU_events.348.desc: "Saudi Arabia has asked to purchase a large shipment of T-90 tanks. The deal would give Russian industry a foothold in a traditionally Western market."
 SAU_events.348.t: "Saudi Request for Russian Tanks"
 SAU_events.349.a: "Approve the sale."
 SAU_events.349.b: "Decline the request."
 SAU_events.349.desc: "Saudi Arabia has asked to purchase Leclerc tanks. Approving the sale would deepen French defense ties with the Kingdom."
 SAU_events.349.t: "Saudi Request for French Tanks"
 SAU_events.35.a: "Rebuild what we can."
 SAU_events.35.d: "Our line to Europe has been cut. Saboteurs blew a critical section, and the oil no longer reaches the West. Moscow breathes easier tonight."
 SAU_events.35.t: "The Europe Pipeline Is Severed"
 SAU_events.350.a: "Approve the sale."
 SAU_events.350.b: "Decline the request."
 SAU_events.350.desc: "Saudi Arabia has asked to purchase Leopard 2 tanks. Approving the sale would expand German defense exports into the Gulf."
 SAU_events.350.t: "Saudi Request for German Tanks"
 SAU_events.351.a: "Approve the sale."
 SAU_events.351.b: "Decline the request."
 SAU_events.351.desc: "Saudi Arabia has asked American shipyards to build a modern frigate for the Royal Saudi Navy. The contract would deepen naval cooperation with Riyadh."
 SAU_events.351.t: "Saudi Request for an American Frigate"
 SAU_events.352.a: "Approve the sale."
 SAU_events.352.b: "Decline the request."
 SAU_events.352.desc: "Saudi Arabia has asked Russian shipyards to build a modern frigate for the Royal Saudi Navy. The contract would open a new Gulf market for Russian warships."
 SAU_events.352.t: "Saudi Request for a Russian Frigate"
 SAU_events.353.a: "Approve the sale."
 SAU_events.353.b: "Decline the request."
 SAU_events.353.desc: "Saudi Arabia has asked French shipyards to build a modern frigate for the Royal Saudi Navy. The contract would extend a long defense relationship with Riyadh."
 SAU_events.353.t: "Saudi Request for a French Frigate"
 SAU_events.354.a: "Approve the sale."
 SAU_events.354.b: "Decline the request."
 SAU_events.354.desc: "Saudi Arabia has asked German shipyards to build a modern warship for the Royal Saudi Navy. The contract would strengthen German defense ties in the Gulf."
 SAU_events.354.t: "Saudi Request for a German Warship"
 SAU_events.36.a: "Accept. Half a Yemen is better than none."
 SAU_events.36.b: "Reject. The revolution will take all of Yemen."
 SAU_events.36.d: "The Saudis propose an end to the war: a Yemen split in two. Our Houthi allies would keep the northern highlands as North Yemen, under our protection, while the south falls to Riyadh's clients. The fighting would stop, but the Houthis would step back from the Axis of Resistance. A bitter compromise, or a chance to consolidate?"
 SAU_events.36.t: "A Proposal to Divide Yemen"
 SAU_events.360.a: "§HEstablish a Sovereign Wealth Fund.§! Bank the windfall and invest it for the future."
 SAU_events.360.b: "§HFund Grand Megaprojects.§! Pour the cash into factories and cities at home."
 SAU_events.360.c: "§HDistribute it to the People.§! Subsidies and bonuses buy loyalty and calm."
 SAU_events.360.d: "Crude climbs from $25 to over §G$140 a barrel§!. Petrodollars flood the treasury faster than the Kingdom can count them. The §2003-2008 windfall§! is a once-in-a-generation chance - and how it is spent will shape the Kingdom for decades. The Council debates: §Lsave it, build with it, or share it§!?"
 SAU_events.360.t: "§HThe Oil Boom§!"
 SAU_events.361.a: "§RAn outrageous blow!§!"
 SAU_events.361.b: "Find new suppliers and ride it out."
 SAU_events.361.d: "Riyadh has joined an Arab oil embargo against us. Tankers sit idle in the Gulf, our refineries are running dry, and prices at the pump are spiralling out of control. Factories idle and motorists queue for hours.\n\nThe Saudis say the taps will stay shut until our policy toward the region changes. Our economy will feel the squeeze for as long as the embargo holds."
 SAU_events.361.t: "§RSaudi Arabia Cuts Off Our Oil§!"
 SAU_events.362.a: "§GOil is our sword.§!"
 SAU_events.362.b: "§RWe will weather this storm.§!"
 SAU_events.362.c: "A dangerous escalation."
 SAU_events.362.d: "In an echo of §H1973§!, the Kingdom of Saudi Arabia has proclaimed an embargo on oil shipments to the West and the friends of Israel. The §LUnited States, Britain, France, Germany and the Netherlands§! now face fuel shortages, rationing and soaring prices.\n\nAcross the Arab and Muslim world, crowds hail Riyadh's defiance. In Western capitals, governments scramble for alternative suppliers and warn of recession. Oil, once merely a commodity, has become a weapon of statecraft."
 SAU_events.362.t: "§HSaudi Arabia Wields the Oil Weapon§!"
 SAU_events.363.a: "§YThe barrel always calls.§! (§ROil Dependence +2§!)"
 SAU_events.363.d: "Even as the Kingdom diversifies, the gravity of crude never lets go. Every ministry, every budget line, every easy petrodollar tugs the economy back toward the barrel. Vested interests, cheap energy and the path of least resistance all pull in one direction.\n\nWithout constant effort, the Kingdom slides back toward dependence on oil."
 SAU_events.363.t: "§RThe Pull of Oil§!"
 SAU_events.37.a: "A workable peace."
 SAU_events.37.d: "Tehran has agreed. The guns fall silent and a line is drawn across Yemen: a Saudi-aligned South ruling from Aden, and a Houthi North under Iranian guarantee. Two weak Yemens, neither free to tip the balance, so long as the other stands."
 SAU_events.37.t: "Yemen Is Partitioned"
 SAU_events.370.a: "§GEmbrace market reform.§! Let the private sector lead."
 SAU_events.370.b: "§RProtect the established order.§! Change can wait."
 SAU_events.370.d: "Technocrats in the Ministry of Economy press for §Lderegulation, privatisation and open markets§!. The old guard warns that moving too fast will unravel the social contract the Kingdom is built on. The Council must signal a direction."
 SAU_events.370.t: "§HEconomic Change§!"
 SAU_events.371.a: "§GExpand opportunities for women.§! The economy needs every talent."
 SAU_events.371.b: "§RUphold traditional roles.§! Preserve the family structure."
 SAU_events.371.d: "A new generation of educated Saudi women want to work, and the economy needs them. Reformers see untapped talent; the §LUlema§! and conservative families see a line that must not be crossed."
 SAU_events.371.t: "§HWomen in the Workforce§!"
 SAU_events.372.a: "§GAllow open access.§! The Kingdom cannot hide from the world."
 SAU_events.372.b: "§RFilter and censor.§! Guard the public morals."
 SAU_events.372.d: "Satellite television and the early internet pour foreign ideas into Saudi living rooms. Liberals welcome the opening to the world; traditionalists demand the state filter what reaches the faithful."
 SAU_events.372.t: "§HSatellite Dishes and the Internet§!"
 SAU_events.373.a: "§GCurb their authority.§! Rein in the patrols."
 SAU_events.373.b: "§RReaffirm their mandate.§! Virtue must be enforced."
 SAU_events.373.d: "The §LCommittee for the Promotion of Virtue§! patrols the streets enforcing dress, prayer and the mixing of sexes. City-dwellers and businesses chafe at their power; the clergy consider them the guardians of the nation's soul."
 SAU_events.373.t: "§HThe Religious Police§!"
 SAU_events.38.a: "Then we fight on."
 SAU_events.38.d: "The Iranians will not divide Yemen. The Houthis fight on, and so must we. There will be no negotiated partition, only victory or defeat."
 SAU_events.38.t: "Tehran Refuses"
 SAU_events.380.a: "Allow conventional interest-bearing accounts."
 SAU_events.380.b: "Strict riba prohibition - Sharia is supreme."
 SAU_events.380.c: "Sukuk in public, pragmatic interest in private."
 SAU_events.380.d: "The Kingdom must take a position on §Lriba§! - the prohibition of interest. §LSecular reformers§! argue conventional interest-bearing accounts attract foreign capital and modernize banking. The §LCouncil of Senior Scholars§! demands a strict prohibition consistent with Sharia. A §Hhybrid§! allows sukuk for the public, informal interest behind closed doors."
 SAU_events.380.t: "§HThe Standardized Interest Law§!"
 SAU_events.381.a: "Modern fractional reserve - growth at the cost of stability."
 SAU_events.381.b: "Asset-backed only - stable but slower."
 SAU_events.381.c: "Moderate reserve requirements."
 SAU_events.381.d: "How much credit can banks create from each riyal of deposits? The §LWestern model§! uses §Hfractional reserve banking§! - 10:1 leverage, more credit, more growth, more risk. The §LIslamic alternative§! demands §Hfull asset backing§! - every loan tied to real wealth, slower but stable. The §Hhybrid§! sets moderate reserve requirements."
 SAU_events.381.t: "§HFractional Reserve Mandates§!"
 SAU_events.382.a: "Light regulation - allow derivatives and futures."
 SAU_events.382.b: "Strict prohibition - no gharar, no gambling."
 SAU_events.382.c: "Regulated derivatives only - balanced approach."
 SAU_events.382.d: "How tightly should the Kingdom regulate §Lspeculation, derivatives, and futures§!? The §LWestern view§! sees these as vital risk-management tools. The §LIslamic view§! condemns them as §Lgharar§! (excessive uncertainty) - little better than gambling. A §Hhybrid§! permits regulated derivatives only."
 SAU_events.382.t: "§HThe Anti-Speculation Directives§!"
 SAU_events.383.a: "Conventional interest-based interbank market."
 SAU_events.383.b: "Murabaha-based Islamic interbank market."
 SAU_events.383.c: "Hybrid - both, run separately."
 SAU_events.383.d: "When banks lend to each other, on what terms? The §LWestern model§! uses §Hconventional interest-rate corridors§! (LIBOR-style). The §LIslamic alternative§! routes interbank flows through §Hmurabaha§! - asset-backed cost-plus financing. A §Hhybrid§! allows both, sectorally."
 SAU_events.383.t: "§HThe Interbank Lending Code§!"
 SAU_events.384.a: "SAMA - independent secular regulator."
 SAU_events.384.b: "SAMA + Sharia council with binding veto."
 SAU_events.384.c: "Hybrid - two parallel structures."
 SAU_events.384.d: "Who oversees the Kingdom's banks? The §LWestern model§! makes §LSAMA§! (Saudi Arabian Monetary Agency) an §Hindependent technocratic regulator§!. The §LIslamic alternative§! pairs SAMA with a §HSharia oversight council§! - clergy with binding veto power. A §Hhybrid§! is two parallel structures."
 SAU_events.384.t: "§HThe Banking Control Law§!"
 SAU_events.385.a: "Strict orthodoxy - no compromise."
 SAU_events.385.b: "Pragmatic - lead the global Islamic finance market."
 SAU_events.385.d: "The Kingdom commits fully to §HIslamic finance§!. But how strictly? §LStrict orthodoxy§! - no compromise, every transaction Sharia-blessed - earns the unconditional support of the §LUlema§! and stability for generations. §LPragmatic Islamic§! - global Islamic finance hub, attracting Muslim capital from §LMalaysia§!, §LIndonesia§!, §LIran§!, the §LGulf§! - sacrifices a degree of purity for influence."
 SAU_events.385.t: "§HBastion of Islamic Finance§!"
 SAU_events.386.a: "Full Anglo-Saxon - all instruments allowed."
 SAU_events.386.b: "Gradual - Western practice with Sharia veneer."
 SAU_events.386.d: "The Kingdom breaks with tradition and §Hsecularizes§! its financial sector. The §LFull Anglo-Saxon§! path adopts every Western instrument - §Hderivatives§!, §Hbonds§!, §Hmargin trading§! - draws maximum foreign capital but enrages the §LUlema§!. The §LGradual§! path keeps a Sharia veneer over Western practice - less revenue, less backlash."
 SAU_events.386.t: "§GThe Secularization of Finance§!"
 SAU_events.39.a: "The storm has broken."
 SAU_events.39.d: "Saudi and coalition warplanes have struck targets across Houthi-held Yemen in a sweeping air campaign. Riyadh has declared its intention to restore the recognized government and roll back the Iranian-backed movement. The Middle East holds its breath."
 SAU_events.39.t: "Operation Decisive Storm Begins"
 SAU_events.390.a: "Approve the sale to Riyadh"
 SAU_events.390.b: "Decline the request"
 SAU_events.390.d: "The Kingdom of Saudi Arabia has formally requested to purchase the F-15 Strike Eagle - our finest export fighter. Riyadh is a key Gulf ally and a major arms customer. Shall we approve the sale?"
 SAU_events.390.t: "Saudi Request: the F-15 Strike Eagle"
 SAU_events.391.a: "Excellent news."
 SAU_events.391.d: "The United States has agreed to sell the F-15 Strike Eagle to the Kingdom. The deal is done - the Royal Saudi Air Force will soon fly the finest American jets."
 SAU_events.391.t: "Washington Approves the F-15 Deal"
 SAU_events.392.a: "A setback."
 SAU_events.392.d: "The United States has declined to sell the F-15 at this time. We may renew our request after a while."
 SAU_events.392.t: "Washington Declines"
 SAU_events.393.a: "Approve the export"
 SAU_events.393.b: "Decline the request"
 SAU_events.393.d: "Saudi Arabia has requested the Eurofighter Typhoon under the Al Salam programme. As a partner in the consortium, shall Germany approve the export to Riyadh?"
 SAU_events.393.t: "Saudi Request: the Eurofighter Typhoon"
 SAU_events.394.a: "Excellent news."
 SAU_events.394.d: "The consortium has agreed to export the Eurofighter Typhoon to the Kingdom. The Al Salam programme can now proceed."
 SAU_events.394.t: "The Typhoon Deal is Approved"
 SAU_events.395.a: "A setback."
 SAU_events.395.d: "The Europeans have declined to export the Typhoon for now. We may try again later."
 SAU_events.395.t: "The Typhoon Deal is Declined"
 SAU_events.396.a: "Approve the sale to Riyadh"
 SAU_events.396.b: "Decline the request"
 SAU_events.396.d: "The Kingdom of Saudi Arabia wishes to expand the Al Yamamah programme and purchase the upgraded Tornado GR4. Riyadh has been a loyal customer of British industry for decades. Shall we approve the sale?"
 SAU_events.396.t: "Saudi Request: the Tornado GR4"
 SAU_events.397.a: "Excellent news."
 SAU_events.397.d: "The United Kingdom has agreed to supply the Tornado GR4 to the Kingdom under an expanded Al Yamamah agreement. Our strike squadrons will be the envy of the Gulf."
 SAU_events.397.t: "London Approves the Tornado Deal"
 SAU_events.398.a: "A setback."
 SAU_events.398.d: "The United Kingdom has declined to expand the Tornado deal at this time. We may renew our request after a while."
 SAU_events.398.t: "London Declines"
 SAU_events.399.a: "Approve the export"
 SAU_events.399.b: "Decline the request"
 SAU_events.399.d: "Saudi Arabia has requested the Panavia Tornado IDS, the rugged multinational strike aircraft. As a partner in the consortium, shall Italy approve the export to Riyadh?"
 SAU_events.399.t: "Saudi Request: the Panavia Tornado"
 SAU_events.4.a: "Excellent news."
 SAU_events.4.d: "[FROM.GetNameDefCap] has accepted our offer. The agreement can now move forward."
 SAU_events.4.t: "[FROM.GetNameDefCap] Accepts the Offer"
 SAU_events.40.a: "Containment: isolate and strangle the regime."
 SAU_events.40.b: "Cautious detente: lower the temperature, for now."
 SAU_events.40.c: "War footing: we will strike before he does."
 SAU_events.40.d: "Saddam still rules in Baghdad, and the memory of Kuwait and Khafji hangs over the Gulf. The Kingdom must settle on how it will deal with this dangerous neighbor, before he decides to gamble again."
 SAU_events.40.t: "The Shadow of Saddam"
 SAU_events.400.a: "Excellent news."
 SAU_events.400.d: "Italy has agreed to export the Panavia Tornado IDS to the Kingdom. The consortium welcomes a valued new operator."
 SAU_events.400.t: "Rome Approves the Tornado Deal"
 SAU_events.401.a: "A setback."
 SAU_events.401.d: "Italy has declined to export the Tornado for now. We may try again later."
 SAU_events.401.t: "Rome Declines"
 SAU_events.41.a: "Join the Arab Shield."
 SAU_events.41.b: "We stand alone."
 SAU_events.41.d: "[FROM.GetName] calls on us to join the Arab Shield, a defensive alliance to bind the Arab nations together against the storms of the age. They ask us to march beneath a common banner."
 SAU_events.41.t: "The Arab Shield"
 SAU_events.5.a: "A setback."
 SAU_events.5.d: "[FROM.GetNameDefCap] has rejected our offer. Relations between our countries will suffer."
 SAU_events.5.t: "[FROM.GetNameDefCap] Rejects the Offer"
 SAU_events.56.a: "Host the talks in Beijing."
 SAU_events.56.b: "This is not our quarrel."
 SAU_events.56.d: "Saudi Arabia asks us to mediate between Riyadh and Tehran. Both shores of the Gulf sell us oil, and their quarrel threatens every tanker we depend on. Hosting the talks would crown Beijing as the indispensable power of the region."
 SAU_events.56.t: "A Request from Riyadh"
 SAU_events.57.a: "Sign the agreement."
 SAU_events.57.b: "We will not sit with them."
 SAU_events.57.d: "China invites us to Beijing to sign an agreement with Saudi Arabia: restored relations, reopened embassies, and an end to the proxy bloodletting. The Saudis have already agreed. The pen waits for us."
 SAU_events.57.t: "An Invitation to Beijing"
 SAU_events.58.a: "A new chapter."
 SAU_events.58.d: "Under Chinese auspices, the Kingdom and the Islamic Republic have signed. Embassies will reopen, the proxies will quiet, and the Gulf breathes out. The rivalry is not over, but the knives are sheathed."
 SAU_events.58.t: "The Beijing Agreement"
 SAU_events.59.a: "So be it."
 SAU_events.59.d: "The talks have collapsed before they began. The rivalry continues, and the Gulf stays dangerous."
 SAU_events.59.t: "Mediation Fails"
 SAU_events.6.a: "Join the corridor."
 SAU_events.6.b: "Decline the proposal."
 SAU_events.6.d: "Saudi Arabia proposes the India-Middle East-Europe Economic Corridor, a trade route linking India to Europe through the Gulf while bypassing the Suez Canal."
 SAU_events.6.t: "[SAU.GetFlag] The India-Middle East-Europe Corridor [RAJ.GetFlag]"
 SAU_events.60.a: "The army moves on Hezbollah."
 SAU_events.60.b: "Lebanon will not bleed for Riyadh."
 SAU_events.60.d: "Saudi money rebuilt our army; Saudi rifles fill its armories. Now Riyadh asks the price: move against Hezbollah and break its state within the state. The army is readier than it has ever been. Whether Lebanon survives the attempt is another question."
 SAU_events.60.t: "A Mandate from Riyadh"
 SAU_events.61.a: "Order returns to the south."
 SAU_events.61.d: "Lebanese Army columns are rolling south as Beirut moves to restore state authority over southern Lebanon. After decades of living beside a state within the state, the government has ordered its rebuilt army to disarm Hezbollah by force. Gulf capitals applaud; Tehran calls it treason against the resistance."
 SAU_events.61.t: "Lebanese Army Moves Against Hezbollah"
 SAU_events.63.a: "The evidence speaks."
 SAU_events.63.d: "Saudi Arabia has laid before the Arab League a dossier of missile fragments, shipping manifests, and intercepted communications tracing the Houthi arsenal to Iran. Arab capitals are responding with uncommon unity, and Tehran's denials are finding few listeners."
 SAU_events.63.t: "Dossier Exposes Iran's Hand in Yemen"
 SAU_events.64.a: "The streets are restless."
 SAU_events.64.d: "From Tehran to Beirut, crowds are in the streets against the governments of the Axis of Resistance. The protesters' grievances are local, but their funding, observers note, has a distinctly Gulf accent. The Axis blames foreign hands; the foreign hands deny everything."
 SAU_events.64.t: "Protests Sweep the Axis of Resistance"
 SAU_events.65.a: "The Ummah has one address."
 SAU_events.65.d: "The Islamic world has gathered in its holiest city at Saudi invitation, with Iran's delegation seated among the rest. Whatever is decided behind closed doors, the image is unmistakable: when the Ummah assembles, it assembles in Mecca, and Riyadh sits at the head of the table."
 SAU_events.65.t: "The Mecca Summit"
 SAU_events.67.a: "A handshake in Beijing."
 SAU_events.67.d: "In a ceremony few believed possible, Saudi Arabia and Iran have signed an agreement in Beijing restoring diplomatic relations after years of rivalry. Embassies will reopen and the proxy wars are to quiet. China brokered the deal, and the message to Washington is unmistakable: there is a new mediator in the Middle East."
 SAU_events.67.t: "The Beijing Agreement"
 SAU_events.68.a: "Hear them out."
 SAU_events.68.b: "Nothing to discuss."
 SAU_events.68.d: "Through intermediaries in a third capital, Saudi Arabia is asking whether Israel would entertain talks on normalization. No conditions have been named yet. The question is whether to listen."
 SAU_events.68.t: "A Quiet Approach from Riyadh"
 SAU_events.69.a: "Progress."
 SAU_events.69.d: "Israel's answer has come back warmer than expected. The track holds, and the talks inch forward."
 SAU_events.69.t: "Positive Signals from Tel Aviv"
 SAU_events.7.a: "Accept the partnership."
 SAU_events.7.b: "Decline the offer."
 SAU_events.7.d: "Riyadh proposes a strategic investment partnership centered on Saudi Telecom Company and South Korean infrastructure. Both countries would gain access to the other's market."
 SAU_events.7.t: "[SAU.GetFlag] Saudi-Korean Partnership [KOR.GetFlag]"
 SAU_events.70.a: "Disappointing."
 SAU_events.70.d: "Israel's answer has come back curt and cold. The track has stalled, and the talks dim with it."
 SAU_events.70.t: "A Cold Reply"
 SAU_events.71.a: "Accept the 1967 lines. A state for a peace."
 SAU_events.71.b: "The 1967 lines are impossible."
 SAU_events.71.d: "Saudi Arabia has formally offered the Arab Peace Initiative: recognition, embassies, trade, and peace with the whole Arab world, in exchange for an independent Palestinian state on the 1967 lines. It is the largest prize ever offered, at the price Israel has refused for decades."
 SAU_events.71.t: "The Arab Peace Initiative"
 SAU_events.72.a: "Take the deal."
 SAU_events.72.b: "Money is not the issue."
 SAU_events.72.d: "Saudi negotiators sweeten the table: investment funds, open skies, technology corridors, and access to the Gulf's largest market. Peace with Riyadh would pay like no peace before it."
 SAU_events.72.t: "The Wealth of the Gulf"
 SAU_events.73.a: "Peace for a state. History."
 SAU_events.73.d: "Saudi Arabia and Israel have signed the Riyadh Accords: full normalization of relations in exchange for Israeli acceptance of an independent Palestinian state on the 1967 lines, guaranteed by Saudi Arabia and Jordan. The Arab Peace Initiative, dismissed for a generation, has redrawn the map of the Middle East in a single afternoon."
 SAU_events.73.t: "The Riyadh Accords"
 SAU_events.74.a: "The old lines return."
 SAU_events.74.d: "The talks between Riyadh and Tel Aviv have ended without agreement. Israel would not accept a Palestinian state; Saudi Arabia would not drop the demand. The boldest diplomatic opening in a generation closes with a door slamming."
 SAU_events.74.t: "Saudi-Israeli Talks Collapse"
 SAU_events.75.a: "The gamble of the century."
 SAU_events.75.d: "Without conditions, without a Palestinian state, and without warning, Saudi Arabia has recognized Israel and opened full relations. Washington celebrates, Tel Aviv exults, and the Arab street burns. The Custodian of the Two Holy Mosques has made the gamble of the century."
 SAU_events.75.t: "Saudi Arabia Recognizes Israel"
 SAU_events.76.a: "The moment has passed."
 SAU_events.76.d: "The talks with Israel have run out of time. Too many questions stayed open too long, and the moment has passed. The delegations pack quietly, and the old lines return to the map."
 SAU_events.76.t: "The Window Closes"
 SAU_events.77.a: "Prepare the accords."
 SAU_events.77.d: "Israel has accepted enough of our terms to make the deal real. What remains is the signing, and the history books."
 SAU_events.77.t: "Breakthrough in the Talks"
 SAU_events.78.a: "Recognize the State of Palestine."
 SAU_events.78.b: "Our position is unchanged."
 SAU_events.78.d: "Saudi Arabia formally asks us to recognize the State of Palestine. Riyadh's friendship, and its markets, lean on the answer. Israel will not thank us for saying yes."
 SAU_events.78.t: "A Request from Riyadh"
 SAU_events.79.a: "Open the talks."
 SAU_events.79.b: "Nothing to discuss."
 SAU_events.79.d: "Through Washington and Amman comes word that Saudi Arabia is ready to discuss normalization, openly and at the highest level. The price will be steep and the talks will be watched by the whole world. But no Arab hand this large has ever been extended."
 SAU_events.79.t: "An Overture from Riyadh"
 SAU_events.8.a: "Sign the defense pact."
 SAU_events.8.b: "Decline the pact."
 SAU_events.8.d: "Saudi Arabia proposes a mutual defense pact with Pakistan as tensions rise across the Middle East. The agreement would include guarantees and military access for both countries."
 SAU_events.8.t: "[SAU.GetFlag] The Saudi-Pakistani Defense Pact [PAK.GetFlag]"
 SAU_events.80.a: "The unthinkable, scheduled."
 SAU_events.80.d: "Riyadh and Tel Aviv have confirmed it: formal talks on normalization of relations have begun. Delegations are already in the air. Every chancellery on Earth is redrawing its assumptions about the Middle East, and every enemy of the deal is starting its own clock."
 SAU_events.80.t: "Saudi-Israeli Talks Begin"
 SAU_events.81.a: "Their refusal is their answer."
 SAU_events.81.d: "Tel Aviv has declined to even open negotiations. The overture is dead on arrival, and the Kingdom's hand, extended before the whole world, hangs in the air. There will be no deal in this generation."
 SAU_events.81.t: "Israel Refuses the Talks"
 SAU_events.82.a: "A future built in concrete and glass."
 SAU_events.82.d: "The deadline arrives, and against every prediction the Kingdom has delivered. NEOM glitters on the Red Sea, Riyadh has been remade, and tourists arrive where only oil derricks once stood. Saudi Arabia has bought itself a future that does not run on crude."
 SAU_events.82.t: "Vision 2030 Delivered"
 SAU_events.83.a: "The promises came due."
 SAU_events.83.d: "The year is 2030, and the Vision is mostly unbuilt. Half-finished towers rust in the desert, the promised cities stand empty, and the hundreds of billions spent have little to show. The critics who called it a fantasy are taking their victory lap, and the people are listening."
 SAU_events.83.t: "The White Elephants"
 SAU_events.84.a: "Write it off."
 SAU_events.84.d: "Another of the Vision's flagship projects has blown past its deadline unfinished. The contractors are paid off, the cranes come down, and the press has its headline. Capital flees, and the doubts spread a little further."
 SAU_events.84.t: "A Project Misses Its Deadline"
 SAU_events.88.a: "The succession is already in question"
 SAU_events.88.d: "King Fahd bin Abdulaziz Al-Saud is dead. Felled by a stroke a decade ago, he reigned in name while his half-brother Abdullah ruled as regent, and now Abdullah ascends the throne in his own right. Yet Abdullah is himself past eighty, and across the majlis of the House of Saud the princes already weigh who shall follow him.\n\n§YThe contest to succeed King Abdullah now begins. See the Crown Prince decisions.§!"
 SAU_events.88.t: "The Death of King Fahd"
 SAU_events.89.a: "The crown passes"
 SAU_events.89.d: "King Abdullah bin Abdulaziz Al-Saud is dead. For a decade the princes of the House of Saud weighed and bargained over who should follow him. That question can wait no longer, and the prince who commands the greatest share of influence will be proclaimed King.\n\n§YSalman bin Abdulaziz:§! [?SAU_salman_share|0]%\n§YMohammed bin Nayef:§! [?SAU_mbn_share|0]%\n§YMutaib bin Abdullah:§! [?SAU_mutaib_share|0]%"
 SAU_events.89.t: "The Death of King Abdullah"
 SAU_events.9.a: "Accept the partnership."
 SAU_events.9.b: "Decline the offer."
 SAU_events.9.d: "Saudi Arabia proposes a strategic investment partnership with China. The agreement would expand Chinese infrastructure projects and strengthen Beijing's position in the Gulf."
 SAU_events.9.t: "[SAU.GetFlag] Saudi-China Strategic Partnership [CHI.GetFlag]"
 SAU_events.90.a: "Stand with the Crown"
 SAU_events.90.b: "Abolish the Kingdom"
 SAU_events.90.d: "The fever sweeping the Arab world has crossed into the Kingdom. Crowds fill the streets of the Eastern Province and the cities of the Hejaz, demanding an end to absolute rule. The mutaween hesitate, the National Guard waits on its orders, and the House of Saud must decide whether to answer the people with force or to let the old order fall."
 SAU_events.90.t: "The Arab Spring Reaches the Kingdom"
 SAU_events.91.a: "Close it now"
 SAU_events.91.b: "Hold it as leverage"
 SAU_events.91.b.tt: "The §YStrait Blockade§! decision stays available to shut the strait at the moment of your choosing."
 SAU_events.91.d: "The war has reached the Gulf. Our missile batteries and fast-attack boats stand ready along the Strait of Hormuz, the artery through which a fifth of the world's oil must pass. We can choke it shut now and bring the world economy to its knees, or hold the threat over our enemies and close it at a moment of our choosing."
 SAU_events.91.t: "Close the Strait of Hormuz?"
 SAU_events.92.a: "Proclaim the Islamic Republic"
 SAU_events.92.b: "Keep the Republic of Arabia"
 SAU_events.92.d: "With the Shia movement ascendant, the constituent assembly must settle what kind of state the republic will be: an Islamic Republic founded on religious authority, or the secular Republic of Arabia."
 SAU_events.92.t: "The Character of the Republic"
 SAU_events.93.a: "Join the Iranian Axis of Resistance"
 SAU_events.93.b: "Forge an Independent Anti-Imperialist Front"
 SAU_events.93.d: "Tehran extends its hand to the new Shia republic. The hardliners must choose: take a place within the Iranian Axis of Resistance under the guardianship of the Supreme Leader, or forge an independent front that answers to no foreign capital."
 SAU_events.93.t: "The Axis of Resistance"
 SAU_events.94.a: "Join the front"
 SAU_events.94.b: "Decline the invitation"
 SAU_events.94.d: "The Republic of Arabia raises a rival banner to the Axis of Resistance, calling on our nation to break with Tehran and join an independent front led from Riyadh."
 SAU_events.94.t: "An Invitation from Arabia"
 SAU_events.95.a: "Join the Arab Comintern"
 SAU_events.95.b: "Stand apart"
 SAU_events.95.d: "Red Arabia calls on the workers and revolutionaries of the Arab world to unite under a single banner."
 SAU_events.95.t: "The Arab Comintern"
 SAU_events.96.a: "A red dawn rises"
 SAU_events.96.d: "The red flag flies over Riyadh. The House of Saud is swept aside and the People's Republic of Arabia is proclaimed, vowing to carry the revolution across the Arab world."
 SAU_events.96.t: "The People's Republic of Arabia"
 SAU_events.97.a: "So it is proclaimed"
 SAU_events.97.d: "The constituent assembly has proclaimed the Islamic Republic of Arabia, founded on the guardianship of the jurist and the rule of the faithful."
 SAU_events.97.t: "The Islamic Republic of Arabia"
 SAU_events.98.a: "A dangerous rift"
 SAU_events.98.d: "Arabia has broken with Tehran, rejecting Iranian tutelage to lead its own anti-imperialist front. The Shia world is split between two rival centres of resistance."
 SAU_events.98.t: "Schism in the Axis"
 SAU_events.99.a: "They will answer for this"
 SAU_events.99.d: "Riyadh has broken with the Axis and lured away our allies. Tehran must decide how to answer this betrayal of the resistance."
 SAU_events.99.t: "The Saudi Schism"

