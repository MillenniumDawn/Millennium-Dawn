 libyan_tribalism_tripolitania_tooltip: "§Y[TRP.GetNameWithFlag]§!"
 libyan_tribalism_tripolitania_tooltip_delayed: "트리폴리타니아는 리비아 정치와 통치의 중심지입니다. 트리폴리타니아는 점령자에 맞선 오랜 저항의 역사를 지니고 있으며, 제1차 세계 대전 이후 '트리폴리타니아 공화국'이라는 이름으로 이탈리아로부터의 독립을 선포했습니다. 독립은 성공하지 못했으나, 이는 아랍 세계 최초의 공화 정부였습니다. 리비아의 지도자 무아마르 카다피는 트리폴리타니아의 도시 시르테 인근에서 태어났습니다. 그가 권력을 잡으면서 카다피 자신의 부족인 카다파 부족의 세력이 커졌으며, 카다피의 정예 병사 다수가 이 부족과 기타 트리폴리타니아 부족들에서 충원되었습니다."
 libyan_tribalism_cyrenaica_tooltip: "§Y[CYR.GetNameWithFlag]§!"
 libyan_tribalism_cyrenaica_tooltip_delayed: "키레나이카는 독립 국가로서의 오랜 역사를 지니고 있으며, 근대 리비아 국가의 발상지로 여겨질 수 있습니다. 오스만 제국 통치 아래에서 이 지역은 큰 자치를 누렸습니다. 이 지역이 이탈리아인들에게 넘어간 뒤, 세누시 교단의 이드리스 셰이크가 키레나이카의 에미르 칭호를 받았습니다. 이후 이탈리아에 의해 칭호를 박탈당했으나, 에미르는 제2차 세계 대전 후 영국의 동의를 얻어 이 지역의 통제권을 되찾았습니다. 2년 뒤 리비아 전역이 키레나이카 에미르국 아래 왕국으로 통합되었고, 에미르 이드리스는 이드리스 1세 국왕이 되었습니다. 왕정이 무너진 이래 키레나이카는 왕정 복귀를 가장 강력하게 지지해 왔으며, 무아마르 카다피에 맞선 민족주의 활동이 간헐적으로 벌어지고 있습니다.\n\n키레나이카 남부에는 리비아 남부, 차드 북부, 니제르 북부에 거주하는 유목 아프리카 민족인 투부족이 살고 있습니다."
 libyan_tribalism_fezzan_tooltip: "§Y[FEZ.GetNameWithFlag]§!"
 libyan_tribalism_fezzan_tooltip_delayed: "페잔은 리비아 지역 중 가장 약한 지역입니다. 인구가 희박하며 대부분 사막으로 이루어져 있고 천연자원이 부족합니다. 아랍인 외에도 페잔에는 소수의 투부족이 거주하며, 리비아 투아레그족의 고향이기도 합니다. 먼 거리와 험난한 지형 때문에 이 지역에 대한 통제력을 확립하기가 매우 어렵습니다."
