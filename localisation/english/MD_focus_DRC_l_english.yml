 MDRC_integrate_region_SWA_desc: "Harmonize public records, local services and fiscal administration over 180 days. Costs 1 treasury and 75 political power. Every highlighted state must be directly owned and controlled by DRC; puppet territory cannot be cored this way. On completion the region receives DRC cores. If peace or territorial control is lost, the charge and political power are refunded and the project can be attempted again."
