 wargoal_condition: "戦争目標"
 REQUEST_MIL_GNSS_ACCESS_TITLE: "軍事GNSSへのアクセス権を要請"
 REQUEST_MIL_GNSS_ACCESS_ACTION_DESC: "暗号化された軍事測位ネットワークへのアップリンク認証情報の提供を要請する。これには二国間条約交渉、相互情報共有の約束、運用上の必要性に応じた段階的な認可レベルが伴う。承認されれば、我々は彼らの§Y軍事衛星測位システムネットワーク§!へのアクセス権を獲得する。"
 REQUEST_MIL_GNSS_ACCESS_LOC: "軍事衛星測位システムへのアクセス要求を送る"
 REQUEST_MIL_GNSS_ACCESS_RECIEVER_LOC: "彼らは我々の軍事衛星測位システムネットワークへのアクセス権を求めている。"
 REQUEST_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "アクセスが許可された！"
 REQUEST_MIL_GNSS_ACCESS_ACCEPTED_DESC: "我々は彼らの軍事衛星測位システムネットワークの恩恵を受けることになる。"
 REQUEST_MIL_GNSS_ACCESS_REJECTED_TITLE: "アクセスを拒否された！"
 REQUEST_MIL_GNSS_ACCESS_REJECTED_DESC: "我々の軍事衛星測位システムネットワークへのアクセス要求は拒否された。"
 REQUEST_MIL_GNSS_ACCESS_SELECTABLE_TT: "[PREV.GetNameWithFlag]の§Y軍事衛星測位システムレベル§!は、ゼロより大きく、少なくとも[ROOT.GetNameWithFlag]のレベルと同等以上でなければならない。"
 OFFER_MIL_GNSS_ACCESS_TITLE: "軍事GNSSへのアクセス権の提供"
 OFFER_MIL_GNSS_ACCESS_ACTION_DESC: "戦略的パートナーシップの証として、暗号化された軍事衛星測位ネットワークへのアップリンク認証情報を拡張する。本許可には階層型アクセスプロトコル、運用セキュリティブリーフィング、および防衛システム統合支援が含まれる。このアクセス権は二国間の信頼と相互運用性への重要な投資を意味する。承諾された場合、彼らは我々の§Y軍事衛星測位システムネットワーク§!へのアクセス権を獲得する。"
 OFFER_MIL_GNSS_ACCESS_LOC: "軍事衛星測位システムへのアクセス提供を打診する"
 OFFER_MIL_GNSS_ACCESS_RECIEVER_LOC: "彼らは軍事衛星測位システムネットワークへのアクセス権の提供を申し出ている。"
 OFFER_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "提案が受諾された！"
 OFFER_MIL_GNSS_ACCESS_ACCEPTED_DESC: "彼らは我々の軍事衛星測位システムネットワークの恩恵を受けることになる。"
 OFFER_MIL_GNSS_ACCESS_REJECTED_TITLE: "提案は拒否された"
 OFFER_MIL_GNSS_ACCESS_REJECTED_DESC: "我々の軍事衛星測位システムネットワークへのアクセス権提供の申し出は拒否された。"
 OFFER_MIL_GNSS_ACCESS_SELECTABLE_TT: "[ROOT.GetNameWithFlag]の§Y軍事衛星測位システムレベル§!は、ゼロより大きく、少なくとも[PREV.GetNameWithFlag]のレベルと同等以上でなければならない。"
 REVOKE_MIL_GNSS_ACCESS_TITLE: "軍事GNSSへのアクセス権を剥奪"
 REVOKE_MIL_GNSS_ACCESS_ACTION_DESC: "暗号化された軍事測位ネットワークへの全アップリンク認証情報を無効化し、統合アクセス権限を即時停止する。本措置により、防衛作戦における重要航法能力が断絶され、精密誘導システムが無効化される。これは戦略的信頼関係の根本的破綻を示すものであり、二国間安全保障協力及び作戦相互運用性に重大な影響を及ぼす。彼らは我々の§Y軍事衛星測位システムネットワーク§!へのアクセス権を全て喪失する。"
 REVOKE_MIL_GNSS_ACCESS_LOC: "軍事衛星測位システムへのアクセス権の剥奪を通達する"
 REVOKE_MIL_GNSS_ACCESS_RECIEVER_LOC: "They are revoking our access to their military GNSS network."
 REVOKE_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "軍事衛星測位システムへのアクセス権の消失"
 REVOKE_MIL_GNSS_ACCESS_ACCEPTED_DESC: "They are revoking our access to their military GNSS network."
 REQUEST_CIV_GNSS_ACCESS_TITLE: "民間GNSSへのアクセス権を要請"
 REQUEST_CIV_GNSS_ACCESS_ACTION_DESC: "民間衛星測位ネットワークへの統合アクセスを要請し、航法および物流調整の強化を図る。これには標準的なデータ共有協定、技術的互換性評価、ならびに当システム向けアップリンクプロトコルの確立が含まれる。本アクセスにより、輸送、緊急サービス、インフラ管理における運用効率の向上が可能となる。承認されれば、我々は彼らの§Y民間衛星測位システムネットワーク§!へのアクセス権を獲得する。"
 REQUEST_CIV_GNSS_ACCESS_LOC: "民間衛星測位システムへのアクセス要求を送る"
 REQUEST_CIV_GNSS_ACCESS_RECIEVER_LOC: "彼らは我々の民間衛星測位システムネットワークへのアクセス権を求めている。"
 REQUEST_CIV_GNSS_ACCESS_ACCEPTED_TITLE: "アクセスが許可された！"
 REQUEST_CIV_GNSS_ACCESS_ACCEPTED_DESC: "我々は彼らの民間衛星測位システムネットワークの恩恵を受けることになる。"
 REQUEST_CIV_GNSS_ACCESS_REJECTED_TITLE: "アクセスを拒否された！"
 REQUEST_CIV_GNSS_ACCESS_REJECTED_DESC: "我々の民間衛星測位システムネットワークへのアクセス要求は拒否された。"
