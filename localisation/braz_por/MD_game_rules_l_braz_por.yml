 RULE_INVEST_DEFAULT_GAIN_1: "1%"
 RULE_INVEST_DEFAULT_GAIN_1_DESC: "1% influence gained whenever someone accepts your investments."
 RULE_INVEST_DEFAULT_GAIN_0_5: "0.5%"
 RULE_INVEST_DEFAULT_GAIN_0_5_DESC: "Ganho de 0.5% de influência sempre que alguém aceitar seus investimentos."
 RULE_INVEST_DEFAULT_GAIN_2: "2%"
