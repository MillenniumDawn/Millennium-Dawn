l_korean:
 TT_OEF_INCREASED_CHANCE_OF_DETECTING_TERRORISTS: "§G§Y알카에다§!에 대한 정보망을 §Y15§! 획득하고, 주요 테러 모의를 저지할 확률을 §Y5%§!에서 §Y15%§!(으)로 높입니다. 그들에 대한 정보력이 강화될수록, 이 확률은 더욱 높아집니다.§!\n"
 TT_OEF_RAISE_POPULARITIES: "§H집권당§!의 지지율을 10% 증가시키고 §H주요 야당§!의 지지율을 5% 낮출 것입니다."
 TT_OEF_LOWER_POPULARITIES: "§H집권당§!의 지지율을 5% 낮추고  §H주요 야당§!의 지지율을 10% 증가시킵니다"
 TT_OEF_WAR_ON_TERROR_SPEECH_HELD: "테러와의 전쟁 연설이 개시됨"
 USA_enduring_freedom: "항구적 자유 작전"
 USA_iraqi_freedom: "이라크 해방 작전"
 TT_AFGHANISTAN_NEW_ADMINISTRATION_KARZAI: "인기있는 후보자에 의해 이끌어지는 친서방 정부를 세웁니다. §R이는 보수 인사들을 자극할 것입니다!§!\n"
 TT_AFGHANISTAN_NEW_ADMINISTRATION_RABBANI: "보수 후보자에 의해 이끌어지는 중립적인 정부를 세웁니다.\n"
 TT_AFGHANISTAN_NEW_ADMINISTRATION_MASSOUD: "전쟁 영웅이 이끄는 중립 정부를 구축하세요. §G이것이 아프가니스탄에 안정을 가져다줄 것입니다!§!\n"
 TT_AFGHANISTAN_NEW_ADMINISTRATION_ZAHIR_SHAH: "아프가니스탄 왕국을 다시 일으켜 세웁니다.§R이는 보수당 인사들의 화를 붇돋고 파키스탄과의 관계가 악화될 것입니다!§!\n"
 war_on_terror_category: "항구적 자유 작전(OEF)와 테러와의 전쟁"
 war_on_terror_category_desc: "항구적 자유 작전(OEF)은 미국 정부가 전세계 테러와의 전쟁을 개시했을 때 사용한 공식 명칭입니다. 이 전략은 외국의 테러 집단을 목표로 하고, 테러리스트와 그 추종자들을 공격하는 것을 허가하는 한편, 이에 대해서는 아무런 처벌을 받지 않는다는 것이 주된 내용입니다."
 KUR_war_on_terror_category: "이라크 해방 작전"
 KUR_war_on_terror_category_desc: "미국은 이라크 침공의 일환인 이라크 자유 작전을 시작했습니다. 이는 [IRQ.GetLeader]에 대해 대항하고 이라크의 굴레에서 벗어날 기회입니다."
 usa_increase_intelligence_spending: "첩보 지원금 증대"
 usa_increase_intelligence_spending_desc: "테러에 대한 여러 정보들이 흩뿌려져서 들어오고 있습니다. 하지만 현재, 이에 대항할 충분한 자원이 없는 상태입니다. 첩보에 대한 자금을 증대시키고, FBI와 CIA에는 감시권한을 더욱 더 많이 허가해야합니다. 정치적으로 많은 비용이 들겠지만, 국내의 안전이 무엇보다도 중요합니다."
 usa_demand_extradition_of_bin_laden: "오사마 빈 라덴 처형 요구"
 usa_demand_extradition_of_bin_laden_desc: "우리의 첩보원에 따르면, 아사마 빈 라덴의 주력군은 최근의 테러 공격 이후 은신생활을 하고 있습니다. 우리가 알고 있는 최신 정보는, 그가 아프가니스탄에 살고 있으며, 탈레반의 보호를 받고 있는 것입니다. 탈레반에 접선하여, 알 카에다와의 모든 관계를 단절하고 오사마 빈 라덴을 우리에게 보내라고 요구해야 합니다."
 usa_operation_enduring_freedom: "항구적 자유 작전(OEF) 실시"
 usa_operation_enduring_freedom_desc: "탈레반은 오사마 빈 라덴의 이송을 거부하였고, 우리가 직접 신변을 구속해야할 것입니다. 아프가니스탄에 장비와 군대를 파견하는 항구적 자유 작전(OEF)을 준비해야 합니다."
 usa_homeland_security_act: "국토 안보부 설립"
 usa_homeland_security_act_desc: "행정부는 '미합중국 국토 안보부'라는 새로운 부서의 설립을 추진하고 있습니다. 국토 안보부는 연방 긴급 사태 관리청을 포함한 22개의 연방 부서가 합쳐진 부서입니다.\n\n네브래스카 복합단지에 위치한 국토 안보부는 국내 및 동맹국의 안보를 위협하는 외세의 위협, 즉 테러를 막는 역할을 수행합니다. 타 국가들은 이들의 업무에 국내 군사지원으로 감사의 표시를 하고 있지만, 한 번 실패한 적이 있습니다."
 usa_setup_new_administration_in_afghanistan: "아프가니스탄에 새로운 정권 설립"
 usa_setup_new_administration_in_afghanistan_desc: "탈레반이 패퇴한 지금, 새로운 정권을 설립해야 합니다. 누구를 지도자를 세울지에는 많은 선택지가 있습니다."
 usa_create_guantanamo_bay: "관타나모 수용소 설립"
 usa_create_guantanamo_bay_desc: "향후 테러리스트로 의심되는 이들을 감시하기 위해, 미 정부와 첩보 기관은 감옥에서 폭동이 일어나 죄수가 탈출해도 미국 시민들이 위험해지지 않도록 충분한 시설을 가진 감옥을 설립하려 합니다. 이 장소는 이상적인 장소로써, 섬인 동시에 해안선을 항상 경계를 하고 있으며, 쿠바 정부는 인정하지 않고 있지만 1903년부터 관타나모만 해군 기지를 임대 받은 장소입니다. 또한 이 임대는 1934년까지 연장이 되었습니다. \n\n그리고 이 장소는 미국 영토가 아니기에 미국의 법률을 적용할 필요가 없는 곳입니다. CIA에게 아주 좋은 선택지를 줄 것입니다..."
 usa_petition_invasion_of_iraq: "이라크 무장 해제 안건을 안전보장이사회에 회부"
 usa_petition_invasion_of_iraq_desc: "우리는 [IRQ.GetLeader]이(가) 대량살상무기를 보유하고 있음을 알고 있습니다. 우리는 이라크가 무장 해제 의무를 중대하게 위반했음을 선언하고 심각한 결과를 경고하는 결의안을 안전보장이사회에 제출할 것입니다.\n\n이 결의안이 침공을 승인하지는 않을 것입니다. 침공을 승인하는 결의안은 결코 표결을 통과할 수 없으며, 우리 측 법률가들도 이 사실을 알고 있습니다. 이 결의안이 우리에게 가져다줄 것은 명분이며, 어찌 됐든 바그다드로 진격할 것이라면 이사회의 반대 속에서 진격하는 것보다는 이사회의 지지를 등업고 진격하는 편이 낫습니다."
 usa_run_war_support_campaign_against_iraq: "이라크 침공 지지 운동 실행"
 usa_run_war_support_campaign_against_iraq_desc: "UN은 이라크 침공에 반대하였습니다. 언론선전을 통해 미국인들이 이 침공을 응호하도록 해야 합니다."
 usa_operation_iraqi_freedom: "이라크 해방 작전 실행"
 usa_operation_iraqi_freedom_desc: "이라크 해방 작전은 2002년 9월에 입안된 계획입니다. 하지만, 실제로 실행된 것은 이라크 정부가 결단을 내리지 못하고 군대 무장해제를 거부하고, 대량 학살 무기의 생산을 중지하지 못한 2002년 11월입니다. 우리와 협의를 하지 않는다면, 우리에게는 이 작전을 실행할 수밖에 없는 선택지만 남아있습니다."
 KUR_join_invasion_of_iraq: "이 침공에 참가하자"
 KUR_join_invasion_of_iraq_desc: "이라크에 대항할 기회는 바로 지금입니다!"
 wot.2.t: "동부 해안에서의 테러"
 wot.2.da: "동부 해안에서 몇 차례의 테러 시도를 보고받았습니다. 오늘 이른 아침, 알 카에다 단원으로 의심되는 이들이 보스턴의 로건 국제 공항과 워싱턴 D.C의 덜레스 국제 공항에서 체포되었습니다. 이러한 정황 경고에도 불구하고 5명의 테러리스트들은 뉴욕의 뉴어크 국제 공항발 유나이티드 에어라인 93편에 탑승했습니다. 이들은 여객기를 납치하려 했지만, 승객들의 저항으로 비행기는 펜실베이니아 스토니크릭에 추락했습니다. 7명의 승무원들과 33명의 승객, 5명의 테러리스트들은 모두 이로 인해 사망했습니다.\n\n최신 첩보에 의하면, 이 비행기들은 동부 해안의 세계 무역 센터, 펜타곤, 국회 의사당 건물에 충돌하려고 했다고 합니다.\n\n다행히도 첩보 요원들의 발빠른 대처로 이 비극적인 사태를 막아낼 수 있었습니다."
 wot.2.db: "동부 해안에서 발생한 대규모 테러 공격에 대한 보고가 접수되었습니다. 알카에다 조직원으로 추정되는 납치범들이 민항기인 아메리칸 항공 11편, 유나이티드 항공 175편, 아메리칸 항공 77편, 유나이티드 항공 93편을 미국을 향한 비행 폭탄으로 사용했습니다.\n\n오늘 이른 아침 8시 46분, 11편이 뉴욕 세계무역센터 북쪽 타워에 충돌했고, 직후인 9시 3분에 175편이 남쪽 타워에 충돌했습니다. 9시 37분에는 77편이 워싱턴 D.C.의 국방부(펜타곤)에 충돌했습니다. 국회의사당을 향하던 것으로 추정되는 네 번째 비행기인 93편은 승객들이 납치범들로부터 통제권을 되찾으려 시도하던 중 10시 3분에 추락했습니다.\n\n우리 국가는 이 끔찍한 날로부터 회복해야 합니다. 정치적 상황은 어제와 완전히 달라졌습니다."
 wot.2.dc: "동부 해안에서 발생한 대규모 테러 공격에 대한 보고가 접수되었습니다. 알카에다 조직원으로 추정되는 납치범들이 민항기인 아메리칸 항공 11편, 유나이티드 항공 175편, 아메리칸 항공 77편, 유나이티드 항공 93편을 미국을 향한 비행 폭탄으로 사용했습니다.\n\n오늘 이른 아침 8시 46분, 11편이 뉴욕 세계무역센터 북쪽 타워에 충돌했고, 직후인 9시 3분에 175편이 남쪽 타워에 충돌했습니다. 9시 37분에는 77편이 워싱턴 D.C.의 국방부(펜타곤)에 충돌했습니다. 네 번째 비행기인 93편에서 승객들이 납치범들로부터 비행기를 되찾으려 했으나 실패했습니다. 테러리스트들은 비행 상태를 유지하는 데 성공했고, 결국 10시 23분에 국회의사당 건물 측면에 충돌했습니다.\n\n우리 국가는 이 끔찍한 날로부터 회복해야 합니다. 정치적 상황은 어제와 완전히 달라졌습니다."
 wot.2.a: "유나이티드 93편의 희생에 경의를 표할 것이다"
 wot.2.b: "오 인류여!"
 wot.2.c: "아아, 인류여!"
 wot.3.t: "세계 무역 센터 공격에 대한 외교적 대응"
 wot.3.d: "미합중국은 갑작스러운 테러 공격을 받았습니다.\n\n세계 무역 센터와 펜타곤에 대한 외교적, 군사적 대응을 준비하고 있는 미국의 [Root.GetAdjective] 외무부 장관은 강경하고 확고한 성명을 발표하고 있습니다."
 wot.3.a: "우리는 미국과 연대한다! 무슨일이 있더라도!"
 wot.3.b: "테러리스트를 비난하나 확실히 약속하진 마라."
 wot.3.c: "다른 나라에 개입하면 이런 일이 일어나지."
 wot.4.t: "지역 정치인이 정부를 지지하다"
 wot.4.da: "최근의 테러 공격에 결정적인 대응책을 마련하기위해 공화당 행정부가 날뛰는 와중에 민주당은 사태를 관찰하며 공격자들을 규탄하는 성명서를 발표하였으나 어떠한 정치적 약속이나 요구를 보이지 않았습니다.\n\n현재, 사건이 발생한 뉴욕의 민주당원의 대다수는 공격자들에 대한 대응을 촉구하는 주요 위치를 차지하기 시작했습니다. 뉴욕의 상원의원이자 미국의 전 영부인인 힐러리 클린턴이 연설을 통해 이와 같이 말했습니다: \"모든 국가들은 우리와 함께하던가 우리의 적이 될 것입니다. 그 테러범들의 은신처를 제공하고 재정 지원을 하는 자들은 그 댓가를 치룰것입니다.\".\n\n국가의 모든 민주당원들은 힐러리 클린턴의 성명에 결집하였고, 그들의 상원 의원과 연대하는것 뿐만 아니라 공화당 정부와도 결집할 신호를 보냈으며, 이런 극악무도한자들 뿐만 아니라 근본적인 반미주의자에게 적법한 답변을 듣기 위한 모든 수단과 방법을 사용하는것을 지지하기 시작합니다."
 wot.4.db: "최근의 테러 공격에 결정적인 대응책을 마련하기위해 민주당 행정부가 날뛰는 와중에 공화당은 사태를 관찰하며 공격자들을 규탄하는 성명서를 발표하였으나 어떠한 정치적 약속이나 요구를 보이지 않았습니다.\n\n현재, 사건이 발생한 뉴욕의 공화당원의 대다수는 공격자들에 대한 대응을 촉구하는 주요 위치를 차지하기 시작했습니다. 뉴욕시의 시장이자 전미 변호사 협회장인 루디 줄리아니는 연설을 통해 이와 같이 말했습니다: \"모든 국가들은 우리와 함께하던가 우리의 적이 될 것입니다. 그 테러범들의 은신처를 제공하고 재정 지원을 하는 자들은 그 댓가를 치룰것입니다.\".\n\n국가의 모든 공화당원들은 루디 줄리아니의 성명에 결집하였고, 그들의 시장과 연대하는것 뿐만 아니라 민주당 정부와도 결집할 신호를 보냈으며, 이런 극악무도한자들 뿐만 아니라 근본적인 반미주의자에게 적법한 답변을 듣기 위한 모든 수단과 방법을 사용하는것을 지지하기 시작합니다."
 wot.4.a: "하나되어 뭉칠 것이다!"
 wot.4.b: "저들은 단지 이 비극으로 잇속 챙길 셈이다!"
 wot.5.t: "국가 기도회"
 wot.5.d: "국가 기도회는 워싱턴 국립 대성당에서 테러 공격으로 발생한 희생자들을 위해 열린 기도회입니다. 몇몇 전 미국 대통령들과 현직 대통령. 그리고 이슬람, 기독교, 힌두교, 유대교, 시크교를 포함한 여러 종교 지도자들이 참여를 하였습니다.\n\n[USA.GetLeader]은(는) 추도문을 낭독할 것입니다."
 wot.5.a: "중요한 일이다"
 wot.5.b: "희생자들을 기릴 필요는 없다"
 wot.6.t: "발비르 사이 수드히 살인"
 wot.6.d: "테러 공격으로 이슬람 공포 정서와 관련된 폭력 사태가 미국 곳곳에서 그 수치가 급작스럽게 증가했습니다. 하지만 주된 수단은 모욕, 도둑질, 재산손실이었습니다. 그 어떤 범죄도 발비르 사이 수드히가 당한 사태보다는 무겁지 않을 것입니다.\n\n42살의 프렝크 실바 로쿠에게 아리조나의 메사에 위치한 사이의 가스 충전소에서 인도의 시크 교도지만, 중동인처럼 생긴 외모와 터빈으로 무슬림으로 오해를 받았습니다. 그 후, 트럭에서 쏜 .380 매그넘에 사이는 총격을 받아 사망했습니다. 로쿠는 바로 도망치고, 20분 뒤 또 다른 이인 레바논계 가게 점원을 쏠려했습니다.\n이 시도가 실패한 뒤, 로쿠는 이전에 자신의 집에서 살던 아스가니스탄 가족을 쫓아다니는 것을 그만두고 건물에 사격을 가했지만, 사망자는 나오지 않았습니다. 다음 날 바로 체포되었으며, 이는 테러의 여파로 일어난 첫번째 살인 사건입니다."
 wot.6.a: "우리는 절대로 테러리스트에 굴복하지 않을 것이다! 피부색이 어떻든 간에 말이지!"
 wot.6.b: "이해할만한 사건이다"
 wot.7.t: "탄저병 공격"
 wot.7.d: "FBI 사건 기록으로는 미국 탄저병(Amerithrax)이라고도 이름 붙여진 탄저병 공격은 테러 공격이 시작된 이후에 바로 발생하였습니다.\n\n탄저균이 담긴 편지가 뉴스 리포터, 상원의원을 포함한 무작위 다수에게 발송되었습니다. 이러한 생물 테러는 동부 해안 테러와 관련이 있다고 여겨졌습니다. 하지만 FBI의 조사로 어떠한 연관점을 발견할 수 없었습니다. 그리고 이로인해 5명의 사망자와 17명 이상의 부상자가 발생하였습니다."
 wot.7.a: "어떤 역경도 이겨낼 것이다"
 wot.7.b: "범인을 반드시 찾을 것이다!"
 wot.8.t: "테러와의 전쟁 연설"
 wot.8.d: "[USA.GetLeader]은(는) 의회와 미국 양원 합동 회의를 열어 \"테러와의 전쟁\"이라 불리는 선언을 선포하였습니다.\n\n대통령은 단호하고 직접적인 테러에 대한 대항을 공약했으며, 전세계 모든 나라가 이에 동조해야할 것을 강조했습니다. \"모든 곳의 모든 나라가 결정을 할 때입니다. 우리와 함께하지 않는것은 당신이 테러리스트와 한 패라는겁니다."
 wot.8.a: "정의를 다잡자"
 wot.8.b: "이는 상황을 바꿀 것이다"
 wot.9.t: "미합중국의 오사마 빈 라덴 인도 요구"
 wot.9.d: "동부 해안에서 발생한 테러 공격 이후, 미국이 우리 관료들과 접촉해 동맹인 알카에다 및 그 지도자 오사마 빈 라덴과의 모든 관계를 단절할 것을 요구하고 있습니다. 또한 빈 라덴을 생포해 미국에 인도하라고도 요구했습니다. 그들의 이전 수사를 보건대, 이 요구를 거부한다면 미국은 확실히 우리의 적이 될 것입니다."
 wot.9.a: "이 대악마는 아무것도 가지지 못할것이다!"
 wot.9.b: "악마와의 거래는 필요할지도 모르지..."
 wot.10.t: "탈레반이 인도를 거절하다"
 wot.10.d: "탈레반은 알 카에다 그리고 오사마 빈 라덴과의 협력 중단을 거절했습니다. 이 범죄자를 법정에 세우기 위해서 탈레반 정권 전체를 무너뜨리는게 유일한 방법으로 보입니다."
 wot.10.a: "놀랄만한 일도 아니지 않은가"
 wot.11.t: "탈레반이 축출에 동의하다"
 wot.11.d: "놀랍게도, 탈레반은 알 카에다를 쫓아내고, 오사마 빈 라덴을 추적하고 있습니다. 이들이 말하기를 테러리스트를 정의의 심판대로 내보내기 위해서 미군과 협력을 하고 싶다고 말한 상태입니다.\n\n이 보다 중요한 것은 없습니다! 반드시 도움을 줘야 합니다"
 wot.11.a: "이거... 놀랍군"
 wot.12.t: "탈레반 축출과 관련된 미국의 요구"
 wot.12.d: "미국은 탈레반을 아프가니스탄에서 쫓아낼려하고 있습니다. 이들은 우리의 도움을 필요로 하고 있습니다."
 wot.12.a: "군대를 보내자!"
 wot.12.b: "지역 민병대에 무기를 쥐어 보내자!"
 wot.12.c: "사기 진작에 도움을 주자! 가자!"
 wot.13.t: "후보자 선택"
 wot.13.da: "누가 아프가니스탄의 지도자가 되어야할지 정해야할 필요가 있습니다. 현 아프가니스탄 지방 정부 또한 우리의 의향을 따를듯 보입니다. 4명의 쟁쟁한 후보자가 존재하고 있습니다.\n\n알 카에다에 의해 아버지가 암살당한 뒤 그 뒤를 이른 북부 동맹의 지도자 하미드 칼제이, 현 아프가니스탄의 대통령이자, 보수 이슬람 바미엣당의 지도자인 버르하누딘 라바니, 판쥐쉬르의 지도자인 아메드 샤 마사우드, 아프가니스탄의 추방된 왕인 모하메드 자히르 샤가 바로 이들입니다."
 wot.13.db: "누가 아프가니스탄의 지도자가 되어야할지 정해야할 필요가 있습니다. 현 아프가니스탄 지방 정부 또한 우리의 의향을 따를듯 보입니다. 3명의 쟁쟁한 후보자가 존재하고 있습니다.\n\n알 카에다에 의해 아버지가 암살당한 뒤 그 뒤를 이른 북부 동맹의 지도자 하미드 칼제이, 현 아프가니스탄의 대통령이자, 보수 이슬람 바미엣당의 지도자인 버르하누딘 라바니, 아프가니스탄의 추방된 왕인 모하메드 자히르 샤가 바로 이들입니다."
 wot.13.a: "하미드 카르자이"
 wot.13.b: "부르하누딘 라바니"
 wot.13.c: "아메드 샤 마사우드"
 wot.13.d: "모하마드 자히르 샤"
 wot.15.t: "안전보장이사회의 결정"
 wot.15.a: "침략을 진행한다."
 wot.15.b: "저들의 말을 들어줄 필요도 있는거 같은데..."
 wot.17.t: "이라크 침공에 참여해야할까요?"
 wot.17.d: "미국은 [IRQ.GetLeader]의 정부를 전복 시키기 위한 침공을 계획 중입니다. 미국이 우리에게 전쟁 참여 의사를 물어 왔습니다."
 wot.17.a: "물론 동맹국에 도움을 줘야지!"
 wot.17.b: "명분없는 전쟁이다"
 wot.20.t: "오사마 빈 라덴 체포 실패"
 wot.20.d: "빈 라덴을 잡으려는 우리의 작전은 완전히 실패했습니다. 우리 부대가 그의 것으로 의심되는 기지에 도착했을 때 빈 라덴은 이미 떠난 지 오래였습니다. 그에게 동조하는 병력이 우리 작전을 제보했을 가능성이 높기 때문에 탈출할 충분한 시간을 벌어준 것입니다.\n\n아직까진 그가 어디서 탈출했는지에 대한 정보는 없지만 아프가니스탄에서 이미 빠져나오는 중일 가능성이 높습니다."
 wot.20.a: "다음엔 반드시 잡을 것이다"
 wot.21.t: "오사마 빈 라덴 체포"
 wot.21.d: "우리 특수부대는 아프가니스탄에 있는 오사마 빈 라덴의 은신처에서 그를 체포할 수 있었습니다. 현지 탈레반 정보 요원들의 도움과 함께, 우리는 그의 위치를 정확히 파악할 수 있었고, 물리적 충돌 없이 그의 항복을 받아낼 수 있었습니다."
 wot.21.a: "신사 숙녀 여러분, 우리가 그를 잡았습니다"
 wot.22.t: "오사마 빈 라덴 은신처 발견"
 wot.22.d: "우리 정보기관이 오사마 빈 라덴의 새로운 은신처를 찾아냈습니다. 우리는 [event_target:GLOBAL_bin_laden_hideout.GetNameDef]에 위치한 시설을 식별했습니다. 드론 영상과 현지 정보원들의 보고에 따르면 이곳이 빈 라덴의 은신처임이 확실합니다. 즉시 [event_target:GLOBAL_bin_laden_hideout.GetAdjective] 정부에 이 사실을 알리고, 빈 라덴을 제거하기 위한 특수 작전 수행 허가를 요청해야 합니다."
 wot.22.a: "해당 국가에 바로 연락하라!"
 wot.22.b: "누가 테러리스트 하나 따위를 신경 쓰겠나?"
 wot.23.t: "미국이 빈 라덴을 발견하다"
 wot.23.d: "오늘 미국 외무장관이 연락을 취해 오사마 빈 라덴의 은신처를 찾았다고 알려왔습니다. 알카에다의 지도자인 오사마 빈 라덴은 몇 년 전 미국에 대한 대규모 테러 공격의 책임이 있습니다. 우리 정보국은 미국이 제공한 정보 중 일부를 검증하고 재확인할 수 있었습니다. 빈 라덴은 실제로 우리나라의 비밀 장소에 살고 있을 가능성이 매우 높습니다.\n\n미국이 이 작전을 할 수 있도록 하는 것은 세계적인 테러리즘에 대한 큰 타격이지만, 외국 특수부대의 국내 작전을 허용하는 것은 위험합니다. 한편, 빈 라덴은 세계에서 가장 많이 찾는 테러리스트 중 한 명이고 미국의 접근을 거부하는 것은 아마도 미국과 잘 맞지 않을 것입니다."
 wot.23.a: "작전을 허용하라"
 wot.23.b: "미국이 우리의 주권을 위태롭게 하는 것을 용납할 수 없습니다!"
 wot.24.t: "[FROM.GetName] 작전에 동의하기"
 wot.24.d: "[FROM.GetName] 가 우리의 특수부대에 입국하고 오사마 빈 라덴의 은신처에 습격을 가하는 것을 허가했습니다. 우리는 며칠 내로 작전의 성과를 거두어야 합니다."
 wot.24.a: "훌륭해!"
 wotnews.1.t: "미국 동부 해안에서의 테러 공격"
 wotnews.1.da: "미국의 뉴스에서는 우리의 관심을 끌만한 동부 해안에서의 테러 공격에 대해 말을 꺼냈습니다. 동부 해안에서 몇 차례의 테러 시도를 보고받았습니다. 오늘 이른 아침, 알 카에다 단원으로 의심되는 이들이 보스턴의 로건 국제 공항과 워싱턴 D.C의 덜레스 국제 공항에서 체포되었습니다. 이러한 징후 경고에도 불구하고 5명의 테러리스트들은 뉴욕의 뉴어크 국제 공항의 유나이티드 93편에 탑승했습니다. 이들은 여객기를 납치하려 했지만, 승객들의 저항으로 비행기는 펜실베이니아 스토니크릭에 추락했습니다. 7명의 승무원들과 33명의 승객, 5명의 테러리스트들은 모두 이로 인해 사망했습니다.\n\n최신 정보에 의하면, 이 비행기는 동부 해안의 세계 무역 센터, 펜타곤, 의사당 건물에 충돌하려고 했다고 합니다.\n\n다행이도 첩보 요원들의 발빠른 대처로 이 비극적인 사태를 막아낼 수 있었습니다."
 wotnews.1.db: "미국 뉴스 보도를 통해 동부 해안에서 발생한 대규모 테러 공격 소식이 전해졌습니다. 알카에다 조직원으로 추정되는 납치범들이 민항기인 아메리칸 항공 11편, 유나이티드 항공 175편, 아메리칸 항공 77편, 유나이티드 항공 93편을 미국을 향한 비행 폭탄으로 사용했습니다.\n\n오늘 이른 아침 8시 46분, 11편이 뉴욕 세계무역센터 북쪽 타워에 충돌했고, 직후인 9시 3분에 175편이 남쪽 타워에 충돌했습니다. 9시 37분에는 77편이 워싱턴 D.C.의 국방부(펜타곤)에 충돌했습니다. 국회의사당을 향하던 것으로 추정되는 네 번째 비행기인 93편은 승객들이 납치범들로부터 통제권을 되찾으려 시도하던 중 10시 3분에 추락했습니다."
 wotnews.1.dc: "미국 뉴스 보도를 통해 동부 해안에서 발생한 대규모 테러 공격 소식이 전해졌습니다. 알카에다 조직원으로 추정되는 납치범들이 민항기인 아메리칸 항공 11편, 유나이티드 항공 175편, 아메리칸 항공 77편, 유나이티드 항공 93편을 미국을 향한 비행 폭탄으로 사용했습니다.\n\n오늘 이른 아침 8시 46분, 11편이 뉴욕 세계무역센터 북쪽 타워에 충돌했고, 직후인 9시 3분에 175편이 남쪽 타워에 충돌했습니다. 9시 37분에는 77편이 워싱턴 D.C.의 국방부(펜타곤)에 충돌했습니다. 네 번째 비행기인 93편에서 승객들이 납치범들로부터 비행기를 되찾으려 했으나 실패했습니다. 테러리스트들은 비행 상태를 유지하는 데 성공했고, 결국 10시 23분에 국회의사당 건물 측면에 충돌했습니다.\n\n이 끔찍한 사건은 테러리스트들이 자신들의 목표를 위해 어디까지 할 수 있는지를 보여줍니다."
 wotnews.1.o1: "절대 잊지 않을 것이다."
 wotnews.1.o2: "지금부터 우리는 함께 이겨낼 것이다."
 wotnews.1.o3: "오, 인류여!"
 wotnews.1.o4: "이교도들."
 wotnews.2.t: "민주당과 공화당 연대"
 wotnews.2.d: "테러 공격에 대항하여 민주당과 공화당은 정치적 견해로 싸우는 것을 중단하였습니다.\n\n뉴욕에서는 루디 줄리아니가 이끄는 공화당과 힐러리 클링턴이 이끄는 민주당이 함께 성공적으로 이 사태에 대처해 나가고 있습니다. 양당은 서로 협력을 하며 이 위기를 잘 해쳐나가고 있는 것처럼 보입니다. 이번에는요."
 wotnews.2.a: "미국은 함께 테러에 맞설 것이다."
 wotnews.3.t: "미국 국가 기도회"
 wotnews.3.d: "워싱턴 국립 대성당에서 열린 국가 기도회는 지난 혼란에서의 3일간을 짦게나마 전했습니다.\n\n [USA.GetLeader] 대통령이 언급하기를 '국가적 재난이 터진지 3일 뒤인 지금도, 미국은 정신을 차리지 못하고 있습니다. 하지만 우리에게 주어진 사명은 명백합니다. 이 공격에 대한 대가를 받아내고 세계의 악을 축출하는 것입니다.'"
 wotnews.3.a: "회복할 시간이 필요하다."
 wotnews.4.t: "발비르 사이 수드히 살인"
 wotnews.4.d: "테러 공격으로 다양한 민족과 종교인들에게 향해진 폭력이 미국 곳곳에서 벌어졌습니다. 이는 아랍 무슬림도 피해갈 수 있었습니다. 그렇게 보이는 사람도 말이죠.\n\n아리조나의 가스 충전소의 소유주인 인도인 시크교도 발비르 사이 수드히는 이유없이 스스로 애국자라 주장하는 42살의 프랭크 실바 로쿠에게 살해당했습니다. 이후로도 그는 레바논, 아프간인 몇명들에게 부상을 입혔습니다."
 wotnews.4.a: "전쟁이 전쟁을 부르는구나."
 wotnews.5.t: "미국 탄저병 공격"
 wotnews.5.d: "FBI는 미국 탄저병(Amerithrax)이라 부르는 사건을 전해왔습니다. 이 사건은 편지에 탄저균을 묻혀 무작위 인물들에게 유포한 사건으로 처음에는 동부 테러와 연관이 있다고 여겨졌습니다.\n\n편지가 보내진 이들은 미국 상원의원의 지도자 톰 에스츨리(D)와 버몬트 상원의원 페트릭 리히(D)입니다.\n\n5명의 사망자가 발생했습니다. FBI는 아직까지도 용의자를 발표하지 못하고 있습니다."
 wotnews.5.a: "테러가 계속되는군."
 wotnews.6.t: "\"테러와의 전쟁\""
 wotnews.6.d: "동부 해안 테러가 있고 난 다음날 아침, [USA.GetLeader]은(는) 2000년대 가장 주목할만한 발표를 하였습니다. 국내, 국외 정책에 관해 말을 하고 '아군 아니면 적군'이라는 흑백논리를 가진 선언을 가졌습니다. '모든 곳의 모든 나라가 결정을 할 때입니다. 우리와 함께하지 않는다면 당신은 테러리스와 한패입니다. 이 날을 기점으로, 테러리즘의 은신처나 테러리즘을 지원하는 모든 나라는 미국의 적대 정권으로 간주 될 것입니다.'"
 wotnews.6.a: "전쟁이 시작되는가?"
 wotnews.7.t: "[USA.GetLeader]의 '항구적 자유 작전' 선포"
 wotnews.7.d: "어제, 미국 대통령 [USA.GetLeader]은(는) 의회에 탈레반이 집권하고 있는 아프가니스탄 이슬람 에미라트에 침공작전을 시작할 것이라고 알려왔습니다.\n\n미국이 개시하는 이 작전명은 \"항구적 자유 작전\"입니다. 또한 대통령은 동맹국들의 원조 또한 이 작전에 포함될 것이라 표명했습니다.\n\n아프가니스탄 정부는 이미 이 사안에 대해 항의를 했지만, 아프가니스탄과 가까운 외교적 관계를 가지고 있는 강대국은 전무하며, 헛짓거리에 불과했습니다."
 wotnews.7.a: "전쟁이 오고 있다."
 wotnews.8.t: "본 협정"
 wotnews.8.d: "아프가니스탄에서 진행된 탈레반 소탕 작전의 전후 처리를 위해 독일, 본에서 몇몇 서방국의 대사들과 25명의 아프가니스탄 지도자들이 회동을 가졌습니다.\n\n[AFG.GetLeader](이)가 아프가니스탄의 적법한 대통령이라고 여겨지고 있습니다. 이제 대부분의 국가들이 아프가니스탄과 다시금 외교관계를 수립해 나가기 시작하였습니다."
 wotnews.8.a: "아프가니스탄에도 평화가 오는가?"
 wotnews.9.t: "관타나모 수용소 설립"
 wotnews.9.d: "9월 11일 테러 사태에 대응하여 미 정부는 테러 공격과 관련되어 있거나 그에 동조한 고위협 범죄자를 수감할 장소를 찾고 있습니다.\n\n이런 감시소는 미국의 통제하에 있는 쿠바의 섬인 관타나모만 해군 기지에 세워지게 될 것입니다. 미국의 통제권을 인정하고 있지 않는 쿠바 정부는 이에 대해 항의를 하고 있는 상황입니다."
 wotnews.9.a: "이는 법적인 사항과 인류애를 생각한 결과이다."
 wotnews.11.t: "이라크에서의 전쟁 시작"
 wotnews.11.d: "미국의 [USA.GetLeader] 대통령은 이라크의 수도 바그다드를 향한 공습 직후 실시간 연설을 열어 이라크 해방 작전의 시작을 알렸습니다. 미국이 이끄는 이 작전의 목표는 이라크의 독재자 [IRQ.GetLeader]을 축출하고, 대량 살상 무기의 생산, 비축, 배치 능력을 제거하는 것입니다. 이 공습이 있고 나서 며칠 후, 이라크 대통령 [IRQ.GetLeader]은 48시간 안에 자국이 항복하는 것은 말도 안되는 일이라고 일축했습니다. 군사적 침공에 대응하여 이라크 공화국의 바그다드 라디오 방송은 \"신과 조국, 인류의 적인 악한 자들이 조국과 국민들을 상대로 멍청한 침공을 수행했다\"고 말했습니다. 한편, 미군 소식통에 따르면 [IRQ.GetLeader]을 포함한 다섯 명의 이라크 정권의 핵심 인물을 공격의 최우선 목표로 삼고 있습니다."
 wotnews.11.a: "테러와의 전쟁은 계속되는군."
 wotnews.12.t: "사담 후세인 생포"
 wotnews.12.d: "미군은 수염이 덮수룩하고 초췌한 모습의 사담 후센인을 그의 자택, 티크리트 근처의 지하 은신처에서 생포했습니다. 이 성과는 미군이 이라크 수도를 점령한지 몇달 뒤에 이러낸 것으로, 역사상 순위에 들만큼 긴박한 생포 작전이었습니다. 그날, 오후 텔레비전에서는 미 대통령 [USA.GetLeader]은(는) 사담 후센인은 \"수않은 이들의 정의\"를 맞이할 것이라고 말했습니다. 또한 전 이라크 지도자의 생포는 \"이 독재자의 이름으로 저지른 범죄의 끝의 표식\"이라고 말했습니다. 하지만, 대통령은 이것이 이라크 침공의 끝을 의미하는 것은 아니라고 일축했습니다."
 wotnews.12.a: "신사숙녀 여러군, 독재자를 생포했습니다!"
 wotnews.13.t: "사담 후세인에게 사형선고가 내려지다"
 wotnews.13.d: "사담 후세인은 이라크 법원에서 인도에 반하는 죄로 유죄 판결을 받은 후 오늘 새벽 처형되었습니다. 처형은 현지 시각 오전 6시 5분(GMT 오전 3시 5분) 바그다드의 시아파 거주 구역에 있는 전직 군 정보부 본부에서 집행되었습니다. 준비된 성명을 통해, [USA.GetLeader]은(는) 사담의 처형이 이라크의 폭력 사태를 끝내지는 못할 것이라 경고하면서도, 이는 \"스스로를 통치하고 유지하며 방어할 수 있는, 그리고 테러와의 전쟁에서 동맹이 될 수 있는 민주 국가로 나아가는 이라크의 여정에서 중요한 이정표\"라고 말했습니다. 이라크 총리실은 사담의 처형이 자국민에게 범죄를 저지르는 무자비한 지도자들에게 \"강력한 교훈\"이 될 것이라는 성명을 발표했습니다."
 wotnews.13.a: "알겠다."
 wotnews.14.t: "미군 이라크 철수"
 wotnews.14.d: "마지막 미군 수송대가 이라크에서 철수하면서 양측에 많은 사상자를 내고 국가를 정치적 불확실성 속에 빠뜨렸던 거의 9년간의 전쟁이 막을 내렸습니다. 500명의 미군을 태운 약 100대의 미군 MRAP 장갑차로 구성된 마지막 행렬은 남부 이라크 사막의 마지막 기지를 출발해 밤낮으로 텅 빈 고속도로를 달려 쿠웨이트 국경을 넘었습니다. 미국에게 이번 철군은 베트남 전쟁 이후 가장 인기 없던 전쟁이자 전 세계에서 미국의 위상을 깎아내린 분쟁으로부터 군대를 집으로 데려오겠다는 약속의 이행을 의미합니다. 그러나 이라크인들에게 이 철수는 2006~2007년에 최고조에 달했던 종파 간 폭력 사태로 수천 명이 목숨을 잃었던 과거로 국가가 다시 빠져들지도 모른다는 끊임없는 두려움 섞인 주권의 회복을 의미합니다."
 wotnews.14.a: "이라크에도 평화가 오는가?"
 wotnews.15.t: "미국이 오사마 빈 라덴을 생포하다"
 wotnews.15.d: "오늘, [USA.GetAdjective] 정부는 아프가니스탄에서 오사마 빈 라덴을 체포했다고 발표했습니다. 빈 라덴은 미국에 대한 테러 작전을 뒤에서 지휘하고 있던 인물이었습니다. 현지 탈레반 정보 요원의 도움으로, 미국 특수부대는 빈 라덴의 은신처를 급습하였습니다. 그는 특수 부대를 보자마자 저항없이 바로 항복한 것으로 알려졌습니다."
 wotnews.15.a: "흥미롭군"
 wotnews.16.t: "오사마 빈 라덴 사살"
 wotnews.16.d: "미국은 [event_target:GLOBAL_bin_laden_hideout.GetNameDef]에서 대테러 작전을 수행하여 알카에다의 지도자인 오사마 빈 라덴을 비밀 은신처에서 사살했다고 발표했습니다. 네이비 씰(Navy SEALs) 부대가 현지 시각 자정 직후 해당 장소를 급습했으며, 비무장 상태이던 이 테러리스트 지도자를 사살한 것으로 전해졌습니다. 그의 시신은 신원 확인을 위해 국외의 인근 미국 항공모함으로 이송되었으며, 사망한 경호원들과 나머지 수행원들의 처리는 현지 보안군에게 맡겨졌습니다. 몇 시간 뒤, 그의 시신은 이슬람 전통에 따라 수장되었습니다.\n\n미국은 이를 테러리즘에 대한 위대한 승리로 여기고 있으나, 많은 극단주의 단체들은 이미 미국에 대한 복수를 다짐하고 나섰습니다."
 wotnews.16.a: "흥미롭군"
 war_on_terror_leader: "테러와의 전쟁 캠페인"
 wot.25.t: "우리의 요청을 거부한 [FROM.GetName]!"
 wot.25.d: "빈 라덴을 찾기 위한 대지에서의 수색을 진행하기 위해 [FROM.GetName]의 허가를 얻으려는 여러 차례 시도 끝에 [FROM.GetLeader]는 간단한 답변을 보냈습니다. \"거부\"입니다. [FROM.GetName]가 우리와 테러와의 전쟁에서의 지원 요청을 공공연히 무시했다는 이유로 엄한 처벌을 요구하는 목소리도 있지만, 우리는 그것을 묵인할 수 있습니다. 비록 국내에서는 인기가 없을 수 있지만요."
 wot.25.a: "그들의 주권은 존중되어야 할 것으로 생각한다."
 wot.25.b: "우리와 우리의 지원 없이 그들은 얼마나 갈 수 있을까?"
 MD_terror.20.t: "역내 테러 네트워크 확장"
 MD_terror.20.d: "정보 보고에 따르면, 우리 지역에서 활동하는 테러 단체가 초기 지역 기반을 넘어 성장했습니다. 이 단체는 더 넓은 지역에 걸쳐 네트워크와 점조직을 구축했습니다. 안보 분석가들은 이제 우리나라가 그들의 작전 계획 범위 내에 있을 수 있다고 경고합니다."
 MD_terror.20.a: "우려되기는 하나, 아직 우리의 당면 과제는 아니다."
 MD_terror.20.b: "국내 대테러 역량을 강화하자.."
 MD_terror.21.t: "테러 조직이 전 세계적 영향력 확보"
 MD_terror.21.d: "전 세계 정보 기관들은 한 주요 테러 조직이 전 세계적 규모의 공격을 감행할 수 있는 작전 능력을 확보했다고 평가했습니다. 한때 지역적 위협에 불과했던 이 조직은 이제 점조직, 자금 조달 및 물류의 국제적 네트워크를 구축했습니다. 이제 어떤 국가도 그들의 치밀한 계획에서 완전히 안전하다고 장담할 수 없습니다."
 MD_terror.21.a: "경계를 늦추지 않겠다."
 MD_terror.21.b: "즉각 대테러 작전을 강화하자."
 USA_failed_to_win_in_iraq: "§Y[IRQ.GetNameWithFlag]§!에서 승리하지 못함\n"
 MD_terror.20.c: "그들의 대의가 퍼져나가고 있습니다. 신을 찬미하라."
 MD_terror.21.c: "칼리프국의 손길이 이제 전 세계로 뻗어가는군."
 TT_REDUCE_RULING_COALITION_POPULARITY_20_PERCENT: "§R집권당과 모든 연정 참여 정당의 상대적 지지율이 20% 감소합니다!\n§!"
 TT_UNSC_NO_PENDING_SUBJECT_VOTE: "§Y안전보장이사회§!가 해당 국가에 대한 결의안을 이미 심의하고 있지 않음"
 USA_wot_attack_occurred: "대규모 테러 공격 발생"
 usa_seek_unsc_extradition_mandate: "안전보장이사회에 빈 라덴 인도 요구"
 usa_seek_unsc_extradition_mandate_desc: "단 한 명의 병사라도 아프가니스탄 국경을 넘기 전에, 우리는 탈레반이 단순히 우리에게만 답하는 것이 아니라 전 세계의 이사회에 답하게 만들어야 합니다.\n\n안전보장이사회는 이전에도 빈 라덴의 인도를 요구했지만, 탈레반은 이를 무시했습니다. 제재를 동반한 새로운 결의안 자체가 빈 라덴을 빼내 오지는 못할 것입니다. 그러나 이 결의안은 이 사안이 단순히 미국만의 싸움이라는 탈레반 정권의 주장을 무력화시키고, 그들을 숨겨주는 모든 이웃 국가들에게 경고를 보내며, 우리가 총을 들기 전에 인도를 거부한 그들에게 일정한 대가를 치르게 할 것입니다.\n\n만약 그들이 그래도 거부한다면, 이 회의장에 있는 그 누구도 우리가 노력하지 않았다고 말할 수 없을 것입니다."
 wot.25.c: "그렇다면 그들을 배제하고 진입한다."
 wot.26.t: "워싱턴의 조건 제시"
 wot.26.d: "미국인들은 사단 병력 대신 중재자를 보냈으며, 그가 가져온 조건은 이러합니다. 아프가니스탄은 우리가 지킵니다. 우리 정부, 법원, 법률도 유지됩니다. 그 대가로 북부동맹과의 전쟁은 현재 상태에서 종료되며, 토후국(에미리트)은 제재와 금수 조치, 감시를 받으며 남은 날들을 보내게 됩니다. 세계 시장으로부터 단절된 채, 우리에게 단 한 번도 유리한 투표를 하지 않을 안전보장이사회의 통제를 받게 될 것입니다.\n\n슈라(최고위원회) 일각에서는 이것이 조약의 탈을 쓴 항복이며, 워싱턴의 목줄을 차기 위해 소련군을 몰아낸 것이 아니라고 주장합니다. 반면 아라비아해에 뜬 항모전단들을 가리키며 대안이 있느냐고 묻는 이들도 있습니다.\n\n카불은 아직 동의해야 할 것이 남아 있습니다. 그러나 만약 우리가 거부한다면, 카불이 동의할 국가는 남아있지 않을 것입니다."
 wot.26.a: "조건을 수락한다. 제재를 받는 토후국도 여전히 토후국이다."
 wot.26.b: "우리는 워싱턴의 목줄을 차기 위해 소련과 싸운 것이 아니다."
 wot.27.t: "우리가 요구하지 않은 평화"
 wot.27.d: "미국 특사가 종이 한 장과 제안을 들고 판지시르에 도착했습니다. 하지만 이는 우리가 10년 동안 싸워온 목표가 아닙니다.\n\n탈레반이 워싱턴의 조건을 수락했습니다. 그들은 미국이 원하는 자들을 넘기고 제재를 수용할 것이며, 그 대가로 카불, 칸다하르, 그리고 오늘날 그들이 장악하고 있는 모든 계곡을 지키게 됩니다. 전쟁이 그냥 멈추는 것입니다. 우리의 전사자들은 죽은 채로, 우리의 망명은 영구적인 채로 남게 되며, 나지불라를 가로등에 매단 자들이 우리에게 약속되었던 나라를 통치하게 됩니다.\n\n미국인들은 부드럽지는 않지만 명확하게, 우리가 이기고 있지 않음을 지적합니다. 틀린 말은 아닙니다. 그러나 전쟁에서 지는 것과 패배를 우리 손으로 서명하는 것에는 차이가 있습니다."
 wot.27.a: "서명하십시오. 우리는 이기고 있지 않고, 조국은 피를 흘리고 있습니다."
 wot.27.b: "이런 짓을 저지른 자들이 칸다하르를 갖게 둘 수는 없습니다."
 wot.28.t: "합의 붕괴"
 wot.28.d: "회담은 결렬되었습니다. 어느 쪽이 협상장을 떠났든 간에, 우리 책상 위에 놓인 결과는 동일합니다. 우리는 돈을 낭비하고 신뢰를 잃었으며 그 대가로 아무것도 얻지 못했습니다.\n\n아프가니스탄 전쟁은 우리 없이 계속됩니다. 빈 라덴을 비호했던 자들은 여전히 카불에 있으며, 외교가 이 문제를 해결할 수 있었으리라는 주장은 방금 전, 시끄럽고도 공개적인 방식으로 완전히 반박되었습니다. 매파들은 이미 자신들의 성명을 작성하고 있습니다.\n\n남은 수단은 하나뿐이며, 이 방에 있는 모든 이가 그것이 무엇인지 알고 있습니다."
 wot.28.a: "그렇다면 다른 방법으로 하자."
 wotnews.17.t: "아프가니스탄을 빠져나간 빈 라덴"
 wotnews.17.d: "다국적군 항공기가 토라보라의 동굴들을 폭격할 무렵, 그들이 찾던 자는 이미 그곳을 떠난 후였습니다. 정보 당국은 오사마 빈 라덴이 몇 주 전에 국경을 넘어 [event_target:GLOBAL_bin_laden_hideout.GetNameDef]에 은신처를 마련했으며, 동조자들의 비호 아래 여러 안전 가옥을 전전하고 있다고 믿고 있습니다.\n\n아프가니스탄 전역에서는 여전히 승리할지도 모릅니다. 그러나 인간 사냥은 이제 막 시작되었을 뿐이며, 이는 다국적군이 전쟁 중이지 않은 국가에서 벌여야 할 싸움이 될 것입니다."
 wotnews.17.a: "영원히 숨을 수는 없을 것이다."
 wotnews.19.t: "미궁에 빠진 추적"
 wotnews.19.d: "오사마 빈 라덴에 대한 인간 사냥이 조용히 중단되었습니다. 감시할 은신처도, 압박할 정부도, 미국의 돈을 받을 정보원도 남아있지 않습니다. 그를 숨겨주던 마지막 안전 가옥은 그들을 용인했던 국가들과 함께 사라졌습니다.\n\n정보 관료들은 단지 그가 '더 이상 활발한 작전상의 위협으로 평가되지 않는다'고만 말할 뿐입니다. 생존 여부에 대한 질문에는 대답을 회피합니다. 여전히 누군가가 그를 찾고 있는지에 대한 질문에도 대답을 회피합니다.\n\n어딘가에서, 세계에서 가장 수배받던 이 남자는 그저 발견될 수 없는 상태가 되어버렸습니다."
 wotnews.19.a: "시신 없이 끝나는 전쟁도 있는 법이다."
 wotnews.20.t: "빈집을 덮친 기습 작전"
 wotnews.20.d: "미군 헬리콥터들이 허가도, 경고도 없이 어둠 속에서 주권 국가의 국경을 넘었으나 아무것도 얻지 못하고 돌아왔습니다.\n\n은신처는 비어 있었습니다. 그가 사전에 귀띔을 받았는지, 처음부터 정보가 틀렸는지, 아니면 그저 일주일 일찍 이동했을 뿐인지, 워싱턴의 그 누구도 설명하려 들지 않습니다. 논쟁의 여지가 없는 사실은, 외국 특수부대가 미국과 전쟁 중이 아닌 국가의 영토에서 무장 작전을 수행했으며, 그 과정에서 해당 국가의 국민 몇 명을 살해했다는 것입니다.\n\n내일 안전보장이사회가 소집됩니다. 행정부는 내세울 만한 결과물이 없습니다."
 wotnews.20.a: "대실패로군."
 USA_wot_extradition_accepted: "§Y탈레반과의 협력§!"
 USA_unilateral_raid_threat: "외국 영토 내 일방적 기습 작전"
 TT_IRAQ_DISARMAMENT_UNSC_PETITION: "§Y유엔 안전보장이사회§!에 무장 해제 결의안을 제출합니다. 통과될 경우 §Y이라크§!는 중대한 위반 상태로 선포되며, 침공을 위한 외교적 명분이 제공됩니다. 실패할 경우 우리는 홀로 진입합니다."
 wot.15.da: "결의안이 통과되었습니다. 이라크는 무장 해제 의무를 중대하게 위반한 것으로 선포되었으며, 이사회는 [IRQ.GetLeader]이(가) 이를 이행하지 않을 경우 심각한 결과에 직면할 것이라고 경고했습니다.\n\n이 결의안이 침공을 승인하는 것은 아닙니다. 처음부터 그럴 일은 없었으며, 침공을 명확히 승인하는 두 번째 결의안을 밀어붙였다면 프랑스에게 거부권 행사 기회를, 다른 이사국들에게는 핑곗거리만 쥐여주었을 것입니다. 그러나 우리는 이사회의 공식적인 입장을 확보했습니다. 지금 이라크에 진입한다면, 우리는 합리적인 법적 명분과 함께 우리를 따를 수 있는 동맹국들을 확보한 채 진입하게 됩니다."
 wot.15.db: "결의안이 부결되었습니다. 이사회는 중대한 위반이라는 판결에조차 동의하려 하지 않았으며, 두 번째 시도 또한 없을 것입니다.\n\n결국 우리는 우리가 도달하리라 짐작했던 바로 그 자리에 서게 되었습니다. [IRQ.GetLeader]을(를) 위협으로 확신하면서도, 이에 대해 어떠한 조치라도 취할 의지가 있는 국가는 우리뿐이라는 사실 말입니다. 우리는 여전히 이라크에 진입할 수 있습니다. 단지 아무런 명분 없이 진입하는 것일 뿐이며, 그 대가는 바그다드가 함락된 지 한참 후에 청구될 것입니다."
 TT_IRAQ_INVASION_WITH_COVER: "우리는 §Y안전보장이사회§!의 공식 입장과 함께 침공합니다. §G국제적 공분이 줄어들고, 우리 파트너들도 우리를 따를 수 있게 됩니다.§!"
 TT_IRAQ_INVASION_WITHOUT_COVER: "우리는 §R아무런 외교적 명분 없이§! 침공합니다. §R심각한 국제적 공분을 사게 되며, 안전보장이사회는 이를 용서하지 않을 것입니다.§!"
 USA_iraq_invasion_threat: "이라크 침공"
 usa_broker_afghan_settlement: "아프간 평화협정 중재"
 usa_broker_afghan_settlement_desc: "그들은 빈 라덴을 우리에게 넘겼습니다. 그들은 여전히 북부동맹과 전쟁 중이며, 이 전쟁이야말로 애초에 아프가니스탄을 그와 같은 자들이 숨어들 수 있는 곳으로 만든 원인입니다.\n\n우리는 단 한 명의 미군 병력도 없이 이 전쟁을 끝낼 수 있습니다. 탈레반을 거리를 두는 정식 정부로 인정하고 제재와 감시를 유지하면서, 10년 동안 그들과 싸워온 판지시르의 세력에게 평화를 강제하는 것입니다. 이는 누구도 만족시키지 못할 것입니다. 카불은 우리에게 빚을 지게 되고, 칸다하르는 우리를 증오할 것이며, 국내의 매파들은 이를 항복이라 부를 것입니다.\n\n그러나 이것은 미국이 시작하지 않고 끝마친, 한 세대 만의 첫 번째 전쟁이 될 것입니다."
 TT_AFGHAN_SETTLEMENT_OFFERED: "§Y탈레반§!과 §Y카불§!에 조건을 제시합니다. §R어느 쪽이든 협상장을 떠날 수 있습니다.§!"
 TT_WOT_DIPLOMATIC_VICTORY: "§G전쟁 없이 그를 잡았습니다.§! 매파들은 이를 용서하지 않을 것입니다."
 TT_WOT_INVADE_AFTER_COMPLIANCE: "§R그들이 빈 라덴을 넘겼음에도 불구하고 우리는 침공합니다.§! 안전보장이사회는 이를 잊지 않을 것이며, 자국민들 또한 마찬가지일 것입니다."
 TT_WOT_TORE_UP_OUR_OWN_TREATY: "§R우리가 평화협정을 썼고, §Y카불§!에 서명을 강요했으며, 이제 우리 스스로 그것을 찢어버리고 있습니다.§! 아프가니스탄은 결코 다시는 우리를 믿지 않을 것이며, §R그곳에서의 우리의 영향력은 붕괴합니다§!."
 USA_wot_unprovoked_invasion: "순응하는 정권에 대한 침공"
 USA_wot_broken_settlement: "파기된 아프간 평화협정"
 wotnews.18.t: "아프가니스탄의 평화"
 wotnews.18.d: "소련군이 떠난 이후 아프가니스탄을 집어삼켰던 전쟁이 오늘 끝났습니다. 카불이나 칸다하르가 아닌 어느 회담장의 테이블에서, 한쪽에는 미국의 돈이 놓여 있고 다른 한쪽에는 탈레반 대표단이 마주 앉은 채로 말입니다.\n\n탈레반은 아프가니스탄을 유지합니다. 그들은 카불을 주무르는 워싱턴의 손길 아래 제재와 금수 조치, 그리고 감시를 받으며 체제를 유지할 것입니다. 그 누구도 이를 승리라고 부르지 않습니다. 10년 동안 판지시르 계곡에서 싸웠던 사람들은 집으로 돌아가고, 오사마 빈 라덴은 미국의 구금하에 있습니다.\n\n워싱턴에는 이곳 대신 칸다하르에 101공수사단이 진주하기를 원했던 이들도 있습니다. 그들은 앞으로 20년 동안 이 결정을 두고 논쟁을 벌일 것입니다."
 wotnews.18.a: "전쟁은 끝났다."
 wot.0.t: "빈 라덴이 미국 본토 공격을 결의하다"
 wot.0.d: "오늘 아침 대통령의 책상에 놓인 일일 정보 브리핑(PDB)은 한 페이지 반 분량입니다. 거기에는 날짜도, 도시도, 표적도 적혀 있지 않습니다. 오사마 빈 라덴이 1997년부터 미국 본토 공격을 원해 왔으며, 그의 추종자들이 몇 년 동안 이곳에 거주해 왔고, 연방수사국(FBI)이 항공기 납치 준비와 일치하는 이른바 '의심스러운 활동의 패턴'을 발견했다고 적혀 있습니다.\n\n이것은 단 한 장의 메모에 불과합니다. 이런 류의 보고는 수십 건이나 있었고, 이 메모를 쓴 자들조차 언제, 어디서, 어떻게 일어날지 알지 못합니다. 하지만 그들이 확신하는 것이 하나 있습니다. 그가 오고 있으며, 이곳에서 일을 벌이려 한다는 것입니다.\n\n우리는 겨우 한 페이지 반 분량의 추측을 바탕으로 정보 공동체를 전시 체제로 전환하고, 만약 아무 일도 일어나지 않았을 때 그 비용을 감당할 수 있습니다. 아니면 이 보고서를 그냥 철해버릴 수도 있습니다."
 wot.0.a: "정보 공동체를 전시 체제로 전환하라."
 wot.0.b: "이것은 수백 개의 메모 중 하나일 뿐이다."
 TT_WOT_PDB_ACT: "§Y알카에다§!에 대한 정보망을 §Y10§! 획득합니다. 정보가 개선될수록 다가오는 위협을 저지할 확률이 높아집니다."
 TT_BIN_LADEN_RAID_UNILATERAL: "허가 없이 특수부대를 투입합니다. §G75%의 확률로 기습에 성공하여 §Y오사마 빈 라덴§!을 사살합니다.§!\n§R25%의 확률로 은신처가 비어있습니다. 그가 은신처를 옮긴 것이며, 안전보장이사회는 우리를 규탄할 것이고 국내의 거센 비판에 직면하게 될 것입니다.§!"
 TT_WOT_INTEL_COOPERATION: "§G그들은 계속해서 우리에게 정보를 제공합니다. §Y알카에다§!에 대한 정보망을 §Y15§! 획득합니다.§!"
 TT_WOT_INTEL_PRESSURE: "§G안식처가 소란스러워집니다. §Y알카에다§!에 대한 정보망을 §Y5§! 획득하며, 테러 네트워크가 더 많이 노출됩니다.§!"
 USA_wot_iraq_gave_us_cause: "Iraq Has Already Given Us Grounds for War"