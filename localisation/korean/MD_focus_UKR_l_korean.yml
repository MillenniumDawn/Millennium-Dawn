 ukr_modernize_sov_equipment_t55_reactivation_program.1.e: "부족한 기술을 자체 개발하며 §YT-55AGM§! 규격으로 전면 현대화"
 ukr_modernize_sov_equipment_t55_reactivation_program.1.f: "지금까지의 작업을 바탕으로 부족한 기술을 자체 개발하며 §YT-55AGM§! 규격으로 전면 현대화"
