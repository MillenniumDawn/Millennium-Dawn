 heavy_util_vehicle_type: "중형 다목적 차량"
 heavy_util_vehicle_type_desc: "적대적 환경에서 보병을 수송하면서 급조 폭발물과 소화기 사격을 견디도록 설계된 지뢰 방호 매복 방어(MRAP) 차량입니다."
 heavy_util_vehicle_desc: "보병 기동 차량과 그 진화형이자 방호력이 더 높은 변형인 지뢰 방호 매복 방어 차량은 탑승자를 지뢰, 급조 폭발물(IED), 탄도 위협으로부터 보호하도록 설계된 장갑 수송 차량입니다. V자형 차체와 강화 장갑판을 갖추어 속도와 연료 효율을 희생하는 대신 일반 다목적 차량보다 훨씬 높은 승무원 방호력을 제공합니다. 자체 방어를 위해 중기관총이나 유탄발사기를 장착하는 경우가 많습니다."
