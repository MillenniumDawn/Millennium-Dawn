 UKR_VINTRENKO: "维特连科"
 UKR_VINTRENKO_DESC: "娜塔莉娅·维特连科领导的§8进步社会主义党§!推行的纲领融合了东正教、苏联怀旧情结以及她独创的女性政治理念。乌克兰对西方态度强硬，并将欧洲的提议视为敌对行为。"
 UKR_NATIONALISTS: "乌克兰民族主义"
 UKR_NATIONALISTS_DESC: "§8乌克兰起义军§!的继承者们掌握政权，并围绕民族主义传统重建国家。乌克兰不等西方允许便直接对抗莫斯科，其俄语地区也由西方治理而非拉拢。"
 UKR_DEMOCRATIC: "民主乌克兰"
 UKR_DEMOCRATIC_DESC: "乌克兰坚持亲西方路线，并围绕加入欧盟和北约来组织整个国家。基辅成为西方阵营的东翼，莫斯科将此视为必须扭转的局面。"
 UKR_COMMUNISM: "共产主义乌克兰"
 UKR_COMMUNISM_DESC: "§8乌克兰共产党§!赢得了关于过渡时期未完成工作的争论，并重新夺回了共和国。基辅致力于重建苏联，而不是摆脱苏联。"
 UKR_SOCIALISM: "社会主义乌克兰"
 UKR_SOCIALISM_DESC: "§8乌克兰社会党§!上台执政，在不打红旗的前提下，通过财富再分配和公有制重建国家。寡头势力失去控制，基辅与布鲁塞尔和莫斯科都保持距离。"
 UKR_YUSHENKO: "尤先科"
 UKR_YUSHENKO_DESC: "橙色阵营掌控着维克托·尤先科领导下的总统职位，其执政纲领包括重建、语言改革和西进路线。乌克兰依赖欧洲和美国，而维系乌克兰气候的天然气则沦为莫斯科手中的武器。"
 UKR_YANUK: "亚努科维奇"
 UKR_YANUK_DESC: "维克托·亚努科维奇和§8地区党§!掌控着国家，并将国家引向莫斯科。欧洲协议迟迟未能签署，国家的东西部各自为政，成为相互对立的选区。"
