 part_reusable_OLV6: "부분적으로 재사용 가능한 수정"
 part_reusable_OLV6_desc: "Partially reusable launch systems are multi-stage launch systems where some stages return to earth and are used again. Recovering the booster cuts the cost and build time of every rocket we produce."
 OLV7: "궤도 발사체 2025"
 OLV7_desc: "A launch vehicle or carrier rocket is a rocket-propelled vehicle used to carry a payload from Earth's surface to space, usually to Earth orbit or beyond.\n\nOrbital Launch Vehicle (OLV 2025):\n§YSpace Launch§!:\nPayload Mass: §Y20000§! kg | Reliability: §Y90%§!\n§YProduction§!:\nPrice per Unit: $§Y0.12§! billion | Civil Industry per unit: §Y2§! | Production days per unit: §Y360§!"
 full_reusable_OLV7: "완전히 재사용 가능한 수정"
 full_reusable_OLV7_desc: "Fully reusable launch vehicles are systems where every component stage returns to earth and can be flown again. Retiring expendable hardware altogether compounds the savings in cost and build time across the whole launch programme."
 OLV8: "궤도 발사체 2035"
 OLV8_desc: "A launch vehicle or carrier rocket is a rocket-propelled vehicle used to carry a payload from Earth's surface to space, usually to Earth orbit or beyond.\n\nOrbital Launch Vehicle (OLV 2035):\n§YSpace Launch§!:\nPayload Mass: §Y24000§! kg | Reliability: §Y95%§!\n§YProduction§!:\nPrice per Unit: $§Y0.24§! billion | Civil Industry per unit: §Y2§! | Production days per unit: §Y380§!"
 full_reusable_OLV8: "향상된 재사용 가능한 수정"
 full_reusable_OLV8_desc: "Rapid turnaround between flights, in-house refurbishment and a mature supply chain wring the last inefficiencies out of a reusable fleet, cutting cost and build time further still."
 ballistic_missile: "탄도 미사일"
 ballistic_missile_desc: "Ballistic missiles are a type of missile that uses projectile motion to deliver warheads on a target. The weapons are powered through a brief explosive and large expenditure of fuel and force and the majority of the flight is unpowered. Some missiles are short-range ballistic missile (SRBMs) which remain within the Earth's atmosphere while the largest of these missiles are capable of orbital flight and spend the majority of their flight outside of the atmosphere."
 cruise_missile: "순항미사일"
 cruise_missile_desc: "A cruise missile is an unmanned self-propelled guided missile that sustains flight through aerodynamic lift for most of its flight path. Cruise missiles are designed to deliver a large payload over long distances with high precision. Modern cruise missiles are capable of traveling at high subsonic, supersonic, or hypersonic speeds, are self-navigating, and are able to fly on a non-ballistic, extremely low-altitude trajectory."
