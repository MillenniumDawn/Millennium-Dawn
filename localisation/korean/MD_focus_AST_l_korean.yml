 telstra_fund: "텔스트라 기금"
 christmas_island_renovations_ast: "크리스마스섬 보수"
 skilled_asylum_seeker_agreement_ast: "숙련 난민 신청자 협정"
 refused_our_request: "우리 요청을 거절함"
 AST_ind_detention_facility.1.t: "오스트레일리아의 수용 요청"
 AST_ind_detention_facility.1.d: "오스트레일리아 정부가 지역 개발 기금과 관계 \\"재설정\\"을 대가로 자국 난민 신청자들을 우리 영토에 수용해 달라고 요청해 왔습니다. 제안된 장소는 숨바섬으로, 시설은 양국이 공동으로 건설하고 운영하게 됩니다. 제안을 받아들이면 양국 관계가 개선되는 효과가 있겠지만, 그들의 영향력이 스며들 문을 열어 주게 되는 것도 분명합니다."
 AST_ind_detention_facility.1.a: "허용하겠다."
 AST_ind_detention_facility.1.b: "우리 땅에서는 안 된다."
 AST_ind_detention_facility.2.t: "수용 시설을 승인한 인도네시아"
 AST_ind_detention_facility.2.d: "자카르타 정부가 우리의 요청을 승인하여, 숨바섬에 해외 심사 시설을 둘 수 있게 되었습니다. 크리스마스섬의 난민 신청자들은 새 시설이 가동되는 대로 이송될 것입니다. 한편 우리의 수용 능력이 크게 늘어나, 국경 부대가 다시 해역 순찰에 집중할 수 있게 되었습니다."
 AST_ind_detention_facility.2.a: "우리 해역이 이토록 안전했던 적이 없다!"
 AST_ind_detention_facility.3.t: "수용 시설을 거부한 인도네시아"
 AST_ind_detention_facility.3.d: "어떤 회유로도 인도네시아 측이 우리 시설을 받아들이도록 설득할 수 없었던 것이 분명합니다. 그들은 현지 치안 유지에 다시 집중하겠다는 방침이 우리의 요청과 잘 맞지 않는다고 밝혔습니다. 이는 양국 관계에 좋은 징조가 아니며, 난민 신청자 수용 문제에서도 우리를 후퇴시켰습니다."
 AST_ind_detention_facility.3.a: "불운한 차질이다."
