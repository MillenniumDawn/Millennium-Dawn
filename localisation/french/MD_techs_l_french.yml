 nsb_gun_technology_1: "Systèmes d'armes lourdes et d'artillerie de 1ère génération"
 nsb_gun_technology_1_desc: "Puissants systèmes d'artillerie et de roquettes conçus pour améliorer la puissance de feu sur le champ de bataille. Cette avancée introduit des obusiers lourds, des armes à roquettes à grande échelle et des munitions d'artillerie spécialisées pour une capacité de destruction accrue. De plus, elle permet le déploiement de nacelles de roquettes, dotant les plateformes aériennes d'un potentiel de frappe amélioré. Ces systèmes offrent un soutien supérieur à longue portée, ce qui les rend essentiels pour dominer le champ de bataille."
 nsb_gun_technology_2: "Systèmes d'armes lourdes et d'artillerie de 2ème génération"
