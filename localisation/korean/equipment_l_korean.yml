 heavy_util_vehicle_type: "Heavy Utility Vehicle"
 heavy_util_vehicle_type_desc: "A mine-resistant ambush protected (MRAP) vehicle designed to withstand improvised explosive devices and small arms fire while transporting infantry in hostile environments."
 heavy_util_vehicle_desc: "Infantry mobility vehicles and their evolved and more protected variants, mine-resistant ambush protected vehicles, are armored transport vehicles designed to protect their occupants from mines, IEDs, and ballistic threats. Featuring V-shaped hulls and reinforced armor plating, they offer significantly greater crew protection than standard utility vehicles at the cost of speed and fuel efficiency. Commonly mounted with heavy machine guns or grenade launchers for self-defense."
