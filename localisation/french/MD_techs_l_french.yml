 module_esm_4: "MES IV"
 module_esm_4_desc: "Les mesures de soutien électronique hyperavancées intègrent un traitement de données à haute vitesse et une fusion de capteurs en réseau, permettant une identification précise des menaces, une alerte précoce améliorée et une meilleure coordination avec la guerre électronique et les systèmes de combat.\n\n§GIndice du concepteur : les MES augmentent la puissance de santé et réduisent la visibilité de surface, améliorant la survie contre la détection et l'attaque. Utile sur les combattants de valeur, mais augmente le coût de production et exige des puces.§!"
 module_esm_5: "ESM V"
 module_esm_5_desc: "Les mesures de soutien électronique ultra-avancées intègrent un traitement de données à haute vitesse et une fusion de capteurs en réseau, permettant une identification précise des menaces, une alerte précoce améliorée et une meilleure coordination avec la guerre électronique et les systèmes de combat.\n\n§GIndice du concepteur : les MES augmentent la puissance de santé et réduisent la visibilité de surface, améliorant la survie contre la détection et l'attaque. Utile sur les combattants de valeur, mais augmente le coût de production et exige des puces.§!"
 module_sub_esm_4: "MES IV"
 module_sub_esm_4_desc: "Les mesures de soutien électronique ultra-avancées intègrent un traitement de données à haute vitesse et une fusion de capteurs en réseau, permettant une identification précise des menaces, une alerte précoce améliorée et une meilleure coordination avec la guerre électronique et les systèmes de combat.\n\n§GIndice du concepteur : les MES de sous-marin augmentent la puissance de santé et réduisent la visibilité sous-marine, améliorant survie et furtivité. Utile pour les bateaux opérant près des capteurs ennemis, mais augmente le coût de production et exige des puces.§!\n§GIndice concepteur : les ESM de sous-marin augmentent les points de vie et réduisent la visibilité sous-marine, améliorant survivabilité et furtivité. Utile pour les bâtiments opérant près des capteurs ennemis, mais relève le coût de production et exige des microprocesseurs.§!"
 module_sub_esm_5: "ESM V"
 module_sub_esm_5_desc: "Les mesures de soutien électronique avancées intègrent un traitement de données à haute vitesse et une fusion de capteurs en réseau, permettant une identification précise des menaces, une alerte précoce améliorée et une meilleure coordination avec la guerre électronique et les systèmes de combat.\n\n§GIndice du concepteur : les MES de sous-marin augmentent la puissance de santé et réduisent la visibilité sous-marine, améliorant survie et furtivité. Utile pour les bateaux opérant près des capteurs ennemis, mais augmente le coût de production et exige des puces.§!\n§GIndice concepteur : les ESM de sous-marin augmentent les points de vie et réduisent la visibilité sous-marine, améliorant survivabilité et furtivité. Utile pour les bâtiments opérant près des capteurs ennemis, mais relève le coût de production et exige des microprocesseurs.§!"
