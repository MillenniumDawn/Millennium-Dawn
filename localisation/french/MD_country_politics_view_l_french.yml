 PROPAGANDA_PROWESTERN: "§YPro-occidental§!"
 PROPAGANDA_EMERGING: "§YÉmergent§!"
 PROPAGANDA_NONALIGNED: "§YNon-aligné§!"
 PROPAGANDA_NATIONALIST: "§YNationaliste§!"
 PROPAGANDA_FASCISM: "§YSalafiste§!"
 prowestern_propaganda_button_tt: "Campagne de propagande §Ypro-occidentale§! \nPar la guerre de l'information, nous pouvons influencer l'opinion publique sur la situation mondiale. Toute campagne n'est toutefois efficace que pour une période limitée, car l'intérêt s'émousse.\n\nModificateur de §Ycoût de campagne de propagande§! : [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\nModificateur de §Ycoût de campagne pro-occidentale§! : [?ROOT.modifier@western_outlook_campaign_cost_modifier|-2%] \n\n§YPrérequis :§! \n[!prowestern_propaganda_button_click_enabled] \n§YModificateurs tant qu'active :§! \n[!prowestern_propaganda_button_click]"
 emerging_propaganda_button_tt: "Campagne de propagande §Yémergente§! \nPar la guerre de l'information, nous pouvons influencer l'opinion publique sur la situation mondiale. Toute campagne n'est toutefois efficace que pour une période limitée, car l'intérêt s'émousse.\n\nModificateur de §Ycoût de campagne de propagande§! : [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\nModificateur de §Ycoût de campagne d'orientation émergente§! : [?ROOT.modifier@emerging_outlook_campaign_cost_modifier|-2%] \n\n§YPrérequis :§! \n[!emerging_propaganda_button_click_enabled] \n§YModificateurs tant qu'active :§! \n[!emerging_propaganda_button_click]"
 nonaligned_propaganda_button_tt: "Campagne de propagande §Ynon-alignée§! \nPar la guerre de l'information, nous pouvons influencer l'opinion publique sur la situation mondiale. Toute campagne n'est toutefois efficace que pour une période limitée, car l'intérêt s'émousse.\n\nModificateur de §Ycoût de campagne de propagande§! : [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\nModificateur de §Ycoût de campagne non-alignée§! : [?ROOT.modifier@nonaligned_outlook_campaign_cost_modifier|-2%] \n\n§YPrérequis :§! \n[!nonaligned_propaganda_button_click_enabled] \n§YModificateurs tant qu'active :§! \n[!nonaligned_propaganda_button_click]"
 nationalist_propaganda_button_tt: "Campagne de propagande §Ynationaliste§! \nPar la guerre de l'information, nous pouvons influencer l'opinion publique pour qu'elle voie la situation mondiale sous un angle nationaliste. Toute campagne n'est toutefois efficace que pour une période limitée, car l'intérêt s'émousse.\n\nModificateur de §Ycoût de campagne de propagande§! : [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\nModificateur de §Ycoût de campagne nationaliste§! : [?ROOT.modifier@nationalist_outlook_campaign_cost_modifier|-2%] \n\n§YPrérequis :§! \n[!nationalist_propaganda_button_click_enabled] \n§YModificateurs tant qu'active :§! \n[!nationalist_propaganda_button_click]"
 fascism_propaganda_button_tt: "§YFascism§! Propaganda Campaign \nUsing informational warfare, promoting ultraconservative clerics and similar, we can influence and radicalize the public opinion about the world situation in favor of Salafism. However, any such campaign will only be effective for a limited period, as people gradually lose interest.\n§RNot all countries may do salafist propaganda!§!\n\n§YPropaganda Campaign Cost§! Modifier: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YSalafi Indoctrination Campaign Cost§! Modifier: [?ROOT.modifier@salafist_outlook_campaign_cost_modifier|-2%] \n\n§YPrerequisite:§! \n[!fascism_propaganda_button_click_enabled] \n§YModifiers while active:§! \n[!fascism_propaganda_button_click]"
