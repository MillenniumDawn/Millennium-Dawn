 jreci_kick: "§0공공 안전 개념§!의 추종자들이 이제 §Y[SOV.GetNameWithFlag]§!에서 집권하고 있다"
 SOV_putin_politic_modifier: "푸틴주의"
 SOV_putin_politic_modifier_desc: "러시아는 다시 한번 권위주의의 길에 들어섰습니다. 민주주의와 언론의 자유를 흉내 낸 채, 단 한 명의 통치자가 다스리고 있습니다."
 SOV_i_blin: "국산 마이크로프로세서"
 SOV_borya: "차르 보리스 옐친"
 nabibulina_best: "최고의 중앙은행 총재"
 nabibulina_best_desc: "새로 임명된 중앙은행 총재는 우리나라가 직면한 과제에 성공적으로 대처하고 있습니다. 중앙은행 운영진의 유능한 정책이 우리 경제에 가해지는 압박을 억제하고 있습니다."
 SOV_disloyal_military: "불충한 장교단"
