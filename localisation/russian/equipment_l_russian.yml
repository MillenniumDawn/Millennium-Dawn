 nsb_Anti_Air_0_desc: "ПЗРК (переносные зенитно-ракетные комплексы) — это пусковые установки для ракет класса «земля-воздух», запускаемые с плеча. Поскольку требования к портативности накладывают строгие ограничения на размеры ракет, такие системы обладают коротким радиусом действия. Они представляют угрозу для низколетящих самолётов и смертельны для вертолётов."
