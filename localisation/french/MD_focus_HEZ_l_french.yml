 HEZ_weekly_incomes_from_influence: "Gains hebdomadaires de l'influence"
 HEZ_weekly_incomes_from_influence_desc: "Nous gagnerons de l'§Yargent§!, de l'§Yéquipement§! et des §Yeffectifs§! chaque semaine, en fonction de notre influence dans les pays non alliés hors de notre faction.\n\nL'influence internationale actuelle est de §Y[?total_influence_in_countries]%§!.\n\nLes gains hebdomadaires sont les suivants :\n      £personnel_cost_multiplier_modifier_texticon Effectifs : §G[?hezbollah_weekly_manpower]§!\n   £treasury Argent : $§G[?hezbollah_weekly_money]§! milliards\n    £equipment_cost_multiplier_modifier_texticon Armes légères : §G[?hezbollah_weekly_small_arms]§!\n   £GFX_unit_category_support_battalions_icon_small Équipement C&C : §G[?hezbollah_weekly_cnc]§!\n   £air_superiority_efficiency_texticon MANPADS : §G[?hezbollah_weekly_manpads]§!\n   £cas_efficiency_texticon ATGM : §G[?hezbollah_weekly_atgm]§!\n £GFX_unit_Mech_Inf_Bat_icon_small APC : §G[?hezbollah_weekly_apc]§!\n£GFX_unit_category_all_armor_icon_small MBT : §G[?hezbollah_weekly_mbt]§!\n  £GFX_rocket_modifiericons_texticon MLRS : §G[?hezbollah_weekly_mlrs]§!\n£GFX_unit_Mot_Inf_Bat_icon_small Véhicule utilitaire : §G[?hezbollah_weekly_mrf]§!\n\n§RLa liste ci-dessus sera mise à jour chaque semaine.§!"
