 ROM_romanianization_category: "Roumainisation"
 ROM_romanianization_category_desc: "Les terres que nous avons prises ne sont nôtres que de nom. Ce n'est qu'une fois qu'une province aura accepté Bucarest qu'elle pourra devenir terre roumaine."
 ROM_998_return: "Roumanisation du Banat occidental"
 ROM_998_return_desc: "Le Banat est divisé depuis un siècle. La population s'étant réconciliée avec notre autorité, nous pouvons achever l'ouvrage."
 ROM_996_return: "Roumanisation de la Dobroudja méridionale"
 ROM_996_return_desc: "La Dobroudja du Sud a été cédée à Craiova. Une population docile nous permet d'effacer cette signature."
 ROM_122_return: "Roumanisation du Partium"
 ROM_122_return_desc: "La plaine hongroise sera la plus longue à gagner, et l'effort nous coûtera à l'intérieur. Cela reste possible."
 romania_politics.25.t: "La main contre la corruption"
 romania_politics.25.d: "La cellule chargée d'enquêter sur les pots-de-vin dans les marchés publics est prête à agir. Les procureurs veulent une décision avant les premiers mandats : frapper maintenant, ou bâtir un dossier qui tiendra en appel."
 romania_politics.25.a: "Raid sans avertissement"
 romania_politics.25.b: "Bâtir d'abord le dossier"
 romania_politics.63.t: "Les unionistes manifestent à Chisinau"
 romania_politics.63.d: "Des foules unionistes remplissent les rues de Chișinău, encouragées par Bucarest et enhardies par des années de soutien roumain. Le gouvernement doit choisir d'embrasser l'union avec la Roumanie ou de défendre l'État moldave. La Gagaouzie a déjà fait savoir qu'elle ne suivra pas Chișinău dans les bras de Bucarest."
 romania_politics.63.a: "L'union avec la Roumanie !"
 romania_politics.63.b: "La Moldavie est seule"
 romania_politics.64.t: "La Moldavie rejette l'union"
 romania_politics.64.d: "Chișinău a refoulé la marée unioniste. Nos partisans ont été chassés des rues, et le gouvernement moldave considère désormais notre ingérence avec une hostilité ouverte."
 romania_politics.64.a: "Un revers cuisant"
 ROM_moldovan_revolution_fail_tt: "§RNotre influence à Chișinău sera entamée et le gouvernement moldave ressentira notre ingérence§!"
 ROM_beu_accept_tt: "§YChaque nation qui accepte rejoindra l'Union économique balkanique§!"
 ROM_ggz_accept_tt: "§YLa Gagaouzie sera intégrée à la Roumanie§!"
 ROM_ggz_reject_tt: "§RNous devrons choisir entre reconnaître l'indépendance gagaouze et prendre la région par la force§!"
 ROM_ukr_cede_tt: "§YL'Ukraine cédera tous les États cœurs roumains qu'elle détient§!"
 ROM_ukr_refuse_tt: "§RNous obtiendrons un casus belli pour reprendre nos terres volées par la force§!"
 ROM_core_compliance_tt: "Débloque les décisions de §Yroumanisation§!. Le Banat occidental, la Dobroudja du Sud et le Partium peuvent chacun devenir cœurs roumains une fois que cet État atteint §Y80 %§! de conformité."
 ROM_monarchy_debate_tt: "§YUn référendum sur la monarchie sera annoncé§!"
 ROM_resolve_succession_tt: "§YNous réglerons la succession, en choisissant entre Margareta et le prince Nicholas§!"
 ROM_meeting_with_duda_tt: "§YNous déciderons du rôle de Duda dans la famille royale§!"
 ROM_queen_of_spades_tt: "§YMargareta s'adressera à la nation et consolidera son règne§!"
 ROM_king_of_hearts_tt: "§YLe roi Nicholas ira au-devant de son peuple§!"
 ROM_drafting_constitution_tt: "§YPaul rédigera une nouvelle constitution et la soumettra à référendum§!"
