 CYBER_GPS_BTN_TT_DELAYED: "Un logiciel malveillant spécialisé s'infiltre dans l'infrastructure de réception satellitaire de la cible, inondant les systèmes de navigation militaires de signaux falsifiés. Sur le terrain, les commandants peinent à se coordonner tandis que les points de repère familiers disparaissent de leurs cartes numériques. Même les manœuvres de routine deviennent hasardeuses lorsque la navigation de précision échoue."
 CYBER_SIGINT_BTN_TT_DELAYED: "Un implant persistant s'enfonce silencieusement dans l'épine dorsale des télécommunications de la cible, copiant le trafic des canaux gouvernementaux, militaires et diplomatiques. Semaine après semaine, le flux intercepté dresse un portrait détaillé des intentions, vulnérabilités et querelles internes de la cible. Un renseignement qu'aucun espion conventionnel ne pourrait recueillir."
 CYBER_RADAR_BTN_TT_DELAYED: "Des contacts fantômes fleurissent sur les écrans radar de défense aérienne de la cible. Les opérateurs s'épuisent à pister des appareils qui n'existent pas, brûlant des cycles d'alerte à chasser des spectres. Les vols réels se faufilent dans les interstices, indétectés. La fenêtre est brève, mais trente jours de détection aérienne dégradée peuvent être décisifs en campagne."
 CYBER_ECON_BTN_TT_DELAYED: "Les processeurs de paiement commencent à renvoyer des erreurs. Les algorithmes de trading s'étranglent sur des flux de données corrompus. Les contrôleurs d'atelier reçoivent des paquets de mise à jour malformés. L'attaque est conçue pour être niable : une cascade de pannes techniques apparemment sans lien qui vide silencieusement la production économique de la cible pendant des mois."
 CYBER_PROP_BTN_TT_DELAYED: "Des milliers de comptes coordonnés inondent l'espace médiatique de la cible de récits contradictoires. De faux documents gouvernementaux circulent sur les réseaux sociaux. Le but n'est pas de tromper, mais d'épuiser. Une population qui ne distingue plus le vrai du faux perd confiance en toutes les institutions, y compris son propre gouvernement."
 CYBER_ELECT_BTN_TT_DELAYED: "Les systèmes d'inscription électorale sont subtilement corrompus. Des deepfakes de chefs de l'opposition circulent dans les derniers jours avant le scrutin. Les algorithmes des réseaux sociaux sont détournés pour amplifier les divisions existantes. Les institutions démocratiques de la cible ne sont pas détruites. Elles sont silencieusement rendues indignes de confiance, leurs résultats contestés avant même le dépouillement d'un bulletin."
 CYBER_ESPION_BTN_TT_DELAYED: "Une campagne de harponnage implante des logiciels sur mesure au cœur des réseaux de recherche les plus sensibles de la cible. Le malware se déplace latéralement pendant des mois, moissonnant plans, données d'essai et formules propriétaires. Lorsque la brèche est découverte, nos chercheurs bâtissent déjà sur ce qu'ils ont volé."
 CYBER_COMMS_BTN_TT_DELAYED: "Un intercepteur silencieux se place au milieu des nœuds de communication les plus sensibles de la cible. Ordres de généraux, câbles d'ambassadeurs et délibérations du cabinet passent par le même relais compromis : copiés, catalogués et livrés à nos analystes en temps réel. La cible continue de décider, sans savoir que nous lisons chacune de ses décisions."
 CYBER_INFRA_BTN_TT_DELAYED: "Les systèmes de contrôle industriel gérant la distribution d'électricité, le traitement de l'eau et les nœuds logistiques reçoivent des mises à jour de micrologiciel silencieuses et malveillantes. Lorsque la charge utile se déclenche, des pannes en cascade submergent les équipes de réparation dans plusieurs secteurs à la fois. Les dégâts sont réels, physiques, et lents à inverser."
 CYBER_FIN_BTN_TT_DELAYED: "Les systèmes de règlement de la banque centrale s'éteignent. Les réseaux de DAB tombent à l'échelle nationale. Les algorithmes de change reçoivent des données empoisonnées qui déclenchent un krach éclair. La perturbation va bien au-delà de ce que des sanctions conventionnelles pourraient obtenir, et contrairement aux sanctions, elle n'emporte aucune attribution."
 CYBER_LOG_BTN_TT_DELAYED: "Les logiciels de gestion de la chaîne logistique s'effondrent simultanément sur chaque base avancée. Les demandes de munitions disparaissent dans des files corrompues. Les algorithmes d'allocation de carburant acheminent les convois vers des dépôts inexistants. La machine militaire ennemie ne se brise pas au combat. Elle s'affame sur place."
 CYBER_SLEEP_BTN_TT_DELAYED: "Patients, méthodiques, invisibles. Nos opérateurs ne sont pas là pour attaquer. Ils sont là pour rester. Des points d'accès dormants sont enfouis dans le tissu réseau critique de la cible, prêts à s'activer sur ordre. Pendant l'année à venir, leurs systèmes les plus sensibles n'auront peut-être plus aucun secret."
 CYBER_CRIT_BTN_TT_DELAYED: "Tout le poids de notre arsenal cyber s'abat d'un coup. Les réseaux électriques tombent. Les communications militaires s'effondrent. La production industrielle s'arrête. Les systèmes financiers se figent. L'opération est l'équivalent numérique d'une campagne de bombardement stratégique, laissant la cible fonctionnellement paralysée dans tous les domaines de la puissance nationale à la fois."
 CYBER_DECEPT_BTN_TT_DELAYED: "Nous n'attaquons pas les systèmes de la cible. Nous corrompons son esprit. Évaluations de renseignement fabriquées, ordres falsifiés portant la signature d'authentification de hauts commandants, imagerie manipulée présentée aux décideurs au plus haut niveau. Chaque choix de la cible peut reposer sur une réalité que nous avons fabriquée."
 CYBER_ZERO_BTN_TT_DELAYED: "Un arsenal classifié d'exploits jusqu'alors inconnus, accumulé pendant des années et réservé précisément à cet instant, est déployé simultanément contre les systèmes les plus critiques de la cible. Lorsque leurs analystes comprendront ce qui s'est passé, les vulnérabilités seront brûlées et les dégâts irréversibles."
 CYBER_HARDEN_BTN_TT_DELAYED: "Nos équipes de sécurité audient chaque interface exposée, corrigent chaque vulnérabilité connue et durcissent les protocoles que les services de renseignement étrangers sondent le plus souvent. Le travail n'a rien de spectaculaire, mais chaque porte que nous fermons est un vecteur de moins pour l'adversaire. La meilleure opération cyber est celle qui n'atteint jamais sa cible."
 CYBER_CNTRINT_BTN_TT_DELAYED: "Les analystes passent au crible journaux réseau et télémétrie à la recherche d'indices subtils d'une présence étrangère : schémas d'accès anormaux, connexions sortantes inattendues, processus dormants sans but légitime. Nettoyer un réseau infecté est un travail lent et soigneux. Un implant non détecté est bien plus dangereux qu'un implant connu."
 CYBER_ATTRIB_BTN_TT_DELAYED: "Nos équipes de criminalistique numérique reconstruisent le chemin de l'attaque : signatures de logiciels malveillants, cartographie de l'infrastructure de commandement et contrôle, catalogue des habitudes de sécurité opérationnelle qui identifient l'acteur responsable. Nommer l'État derrière l'intrusion est le premier pas vers une réponse proportionnée."
