 eurozone_reforms: "Reformas de la zona euro"
 eurozone_reforms_desc: "La zona euro está actualmente al borde de una crisis de deuda como nunca antes se ha visto en Europa desde los años posteriores a la Segunda Guerra Mundial. Debemos reformar la zona euro aprobando reformas como la §YUnión Bancaria Europea§!, los §YEurobonos§! o el §YMecanismo Europeo de Estabilidad (MEDE)§!.\n\nLa §YCrisis de Deuda Europea§! puede evitarse aprobando las siguientes reformas:\n- §YUnión Bancaria Europea§!\n- §YEurobonos§!\n- §YMecanismo Europeo de Estabilidad§!\n"
