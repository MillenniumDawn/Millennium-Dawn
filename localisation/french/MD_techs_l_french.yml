 COMSAT9: "COMSAT2045"
 COMSAT9_desc: "Un satellite artificiel qui relaie et amplifie les signaux de télécommunication radio via un transpondeur. Cela crée un canal de communication entre un émetteur source et un récepteur en des lieux différents de la Terre.\n\nSatellite de communication (COMSAT 2045) :\nLe satellite §Y$COMSAT9$§! est un satellite de communication d'une bande passante de §Y25 Gbit/s§!. Ils sont requis pour un §Ysystème de satellites de communication 25 Gbit/s§!."
