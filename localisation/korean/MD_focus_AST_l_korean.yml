 AST_the_pacific_solution_tt: "§Y보트 입국자 문제에 대한 해법을 찾아낼 것입니다.§!"
 aus_cyclone.1.t: "사이클론 울루이, 퀸즐랜드 강타"
 aus_cyclone.1.d: "우리가 겪은 가장 강력한 사이클론 중 하나가 퀸즐랜드에 상륙하여 주 전역에 기반시설 피해를 입히고 6만 가구 이상이 며칠간 전력 없이 지내게 되었습니다. 사이클론은 솔로몬 제도를 지나면서 3등급을 유지하다가 소멸했습니다. 사전 경보 덕분에 대부분 사람들이 미리 해당 지역에서 대피했으나, 사망자 한 명이 보고되었습니다. \n\n이후 국가 비상 서비스와 ADF가 피해를 복구하고 전력을 되살리기 위해 투입되었습니다."
 aus_cyclone.1.a: "그래도 비극이다."
