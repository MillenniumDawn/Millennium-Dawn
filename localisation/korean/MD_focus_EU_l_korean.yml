 EU_Tech_Share_name: "유럽방위청(EDA)"
 EU_Tech_Share_desc: "회원국들이 연구 역량을 통합합니다. 유럽방위청(EDA)은 유럽연합(EU) 회원국 간의 이러한 노력을 조율합니다."
 tooltip_ECB_Start_OMT_effect: "§G좌클릭 시:§! §Y전면적 통화조치(OMT) 프로그램§!을 사용할 수 있게 됩니다.\n\n§G우클릭 시:§! §Y전면적 통화조치(OMT) 한도 규모§! > $0."
 tooltip_ECB_Outright_Monetary_Transactions_available: "§Y전면적 통화조치(OMT) 한도 규모§! > $0."
 tooltip_ECB_Outright_Monetary_Transactions_complete_effect: "§Y이자율§!이 §R4.0%§! 초과인 모든 회원국: §Y이자율§!이 §R4.0%§! 미만이 될 때까지 부채가 감소하며, §G전면적 통화조치(OMT) 한도 규모§!가 §B전면적 통화조치(OMT) 총가치§!보다 큽니다.\n"
 tooltip_ECB_Outright_Monetary_Transactions_remove_effect: "§B전면적 통화조치(OMT) 계좌§! > $0 인 모든 회원국: 부채에 §B전면적 통화조치(OMT) 계좌§! 잔액을 §R추가§!합니다.\n"
 EU_exit_category: "유럽연합(EU) 탈퇴"
 EU_exit_category_desc: "연합 전반에 유럽회의주의가 고조됨에 따라 일부 회원국들이 §C[EUU.GetFlag] 유럽연합(EU)§! 탈퇴를 고려하게 될 것입니다."
 EU_Article_50: "유럽연합(EU) 탈퇴! (제50조)"
 EU_Article_50_desc: "\"어떠한 회원국도 자국의 헌법적 요구 사항에 따라 연합을 탈퇴하기로 결정할 수 있다.\"\n- 유럽연합 조약(TEU) 제50조 제1항.\n\n 제50조는 초기에 유럽 헌법 조약을 위해 기안되었습니다. 유럽 헌법 비준 절차가 무산된 이후 이 조항은 리스본 조약에 편입되었습니다."
 EU_Revoke_Article_50: "제50조 철회"
 EU_Revoke_Article_50_desc: "제50조를 철회하고 §C[EUU.GetFlag] 유럽연합(EU)§!에 잔류합니다.\n\"유럽연합 조약(TEU) 제50조는 다음과 같이 해석되어야 한다: 회원국이 해당 조항에 따라 유럽 정상회의에 유럽연합 탈퇴 의사를 통지한 경우, 해당 회원국과 유럽연합 간에 체결된 탈퇴 협정이 발효되지 않았거나 그러한 협정이 체결되지 않은 상태에서 유럽연합 조약 제50조 제3항에 규정된 2년(연장된 경우 그 연장 기간)이 만료되지 않는 한, 해당 회원국이 헌법적 요구 사항에 따라 철회 결정을 내린 후 유럽 정상회의에 서면으로 통지함으로써 의심의 여지 없이 무조건적으로 해당 통지를 일방적으로 철회할 수 있다. 이 철회의 목적은 해당 회원국의 유럽연합(EU) 회원국 지위를 변경 없이 확인하는 것이며, 철회와 동시에 탈퇴 절차는 종료된다.\"\n- 유럽연합 사법재판소 판결 (사건 C-621/18)"
 EU_exit: "유럽연합(EU) 탈퇴 진행 중"
 EU_exit_desc: "§Y[ROOT.GetNameWithFlag]§!(은)는 유럽 의회에 §C[EUU.GetFlag] 유럽 연합§!을 떠나겠다는 의사를 밝혔습니다. §Y[ROOT.GetNameWithFlag]§!(은)는 이 알림을 기준으로 2년 뒤에 연합을 떠날 것입니다."
 EU_extend_Article_50: "제50조 기한 연장"
 EU_extend_Article_50_desc: "§C[EUU.GetFlag] 유럽연합(EU)§!에 제50조 기한 연장을 요청하여 탈퇴 일자를 뒤로 미룹니다."
 EU_exit_three_month: "3개월 연장"
 EU_exit_three_month_desc: "§Y[ROOT.GetNameWithFlag]§!은(는) §C[EUU.GetFlag] 유럽연합(EU)§!으로부터 제50조 기한을 3개월 연장받았습니다. §Y[ROOT.GetNameWithFlag]§!은(는) 3개월의 기간이 지난 후에 연합을 탈퇴하게 됩니다."
 EU_withdrawal_treaty: "탈퇴 조약"
 EU_withdrawal_treaty_desc: "§Y[ROOT.GetNameWithFlag]§!과(와) §C[EUU.GetFlag] 유럽연합(EU)§! 회원국들이 탈퇴 조약에 합의했습니다."
 tooltip_EU_exit_available: "§Y[ROOT.GetNameWithFlag]§!은(는) 현재 §C[EUU.GetFlag][EUU.GetName]§! 탈퇴를 시도하고 있지 않습니다."
 tooltip_EU_exit_cancel_trigger: "§Y[ROOT.GetNameWithFlag]§!에서 §Y제50조 철회§! 결정을 활성화했습니다."
 tooltip_EU_Revoke_Article_50_available: "§Y[ROOT.GetNameWithFlag]§!이(가) §Y유럽연합(EU) 탈퇴 진행 중§! 임무 또는 §Y3개월 연장§! 임무를 진행 중입니다."
 tooltip_EU_Revoke_Article_50_effect: "§Y[ROOT.GetNameWithFlag]§!이(가) §Y[EUU.GetFlag] 유럽연합(EU)§!에 잔류합니다. §Y유럽연합(EU) 탈퇴 진행 중§! 임무 및 §Y3개월 연장§! 임무가 제거됩니다.\n향후 §Y180일§! 동안은 §Y제50조§!를 다시 발동할 수 없습니다."
 tooltip_EU_extend_Article_50_available: "§Y[ROOT.GetNameWithFlag]§!이(가) §Y유럽연합(EU) 탈퇴 진행 중§! 임무 또는 §Y3개월 연장§! 임무를 진행 중입니다. \n그리고 [ROOT.GetNameWithFlag]이(가) 유럽연합(EU) 외교 정책 주도국에 대해 25% 이상의 영향력을 보유해야 합니다."
 tooltip_EU_remove_laws_and_offices: "모든 §Y유럽연합(EU) 법률 및 관직§!을 제거합니다.\n"
 EU_defense_category: "유럽연합(EU) 방위 정책"
 EU_defense_category_desc: "1950년대에 구상되었던 유럽방위공동체(EDC)는 프랑스 의회 비준에 실패하면서 무산되었습니다. 그 후신으로 탄생한 것이 유럽연합(EU)의 공동안보방위정책(CSDP)입니다. 유럽 국가 대부분이 북대서양조약기구(NATO)의 회원국이었기 때문에, 20세기 내내 독자적인 유럽 방위 기구의 필요성은 크게 부각되지 않았습니다. 그러나 21세기에 들어 세계 긴장이 고조되면서 상황이 달라지고 있습니다."
 EU_Frontex_take_control: "유럽 국경·해안경비청(Frontex) 병력 통제권 장악"
 EU_Frontex_take_control_desc: "최근 몇 년간 유럽의 대외 국경에는 유럽연합(EU)으로 입국하려는 이민자와 난민의 수가 전례 없이 급증했습니다. 대외 국경을 맞댄 국가들은 국경 통제에 대한 전적인 책임을 집니다. 그러나 프론텍스(Frontex)는 심각한 이민 압력에 직면한 유럽연합 국가들에게 추가적인 기술 지원을 제공할 수 있습니다.\n 항공기, 선박 등 추가 기술 장비의 배치와 특수 훈련된 국경 경비 인력 파견을 조율함으로써 이를 수행합니다."
 EU_EuroNavy_take_control: "유로네이비(EuroNavy) 통제권 장악"
 EU_EuroNavy_take_control_desc: "21세기에 접어들어 다국적 함대와 기동부대가 더욱 일반화되고 중요해짐에 따라, §C[EUU.GetFlag] 유럽연합(EU)§! 회원국들은 힘을 합쳐 자국의 군함들을 §Y유로네이비(EuroNavy)§!로 알려진 통합 유럽 해군 사령부로 이관하기로 결정했습니다."
 EU_EuroArmy_take_control: "유로아미(EuroArmy) 통제권 장악"
 EU_EuroArmy_take_control_desc: "§C[EUU.GetFlag] 유럽연합(EU)§! 회원국들은 §Y유로아미(EuroArmy)§!로 알려진 공동 군대를 창설하기로 결정했습니다."
 EU_create_EDU: "유럽방위연합(EDU) 결성"
 EU_create_EDU_desc: "공동의 이익을 수호하고, 외부의 분쟁과 위기에 대응하며, 인접 지역에 안보를 투사하는 데 필요한 전략적 자율성을 달성하기 위해 회원국들은 군사 동맹으로서 §Y유럽방위연합(EDU)§!을 결성하고 집단으로 §Y북대서양조약기구(NATO)§!를 탈퇴하기로 결정했습니다."
 EU_military_exercise: "[FROM.GetAdjective] 국경에서의 군사 훈련 준비"
 EU_military_exercise_desc: "[FROM.GetAdjective] 국경에서의 군사 훈련 준비"
 EU_ask_to_host_military_exercise: "국경에서의 군사 훈련 개최 요청"
 EU_ask_to_host_military_exercise_desc: "[FROM.GetNameWithFlag]에 국경에서의 군사 훈련 개최를 요청합니다."
 EU_military_exercise_mission: "군사 훈련 실시"
 EU_military_exercise_mission_desc: "군사 훈련 실시"
 counter_military_exercise_mission: "군사 훈련 맞대응"
 counter_military_exercise_mission_desc: "군사 훈련 맞대응"
 EU_military_exercise_threat: "군사 훈련"
 EU_apply_for_membership_category: "유럽연합(EU) 가입"
 EU_apply_for_membership_category_desc: "유럽연합(EU) 회원국이 되는 것은 하루아침에 이루어지지 않는 복잡한 절차입니다. 신청국이 가입 조건을 충족하면, 모든 분야에서 유럽연합의 규칙과 규정을 이행해야 합니다.\n가입 조건을 만족하는 국가라면 어디든 신청할 수 있습니다. 이 조건은 '코펜하겐 기준'으로 알려져 있으며, 자유 시장 경제, 안정적인 민주주의 및 법의 지배, 그리고 유로화를 포함한 모든 유럽연합 법률 체계의 수용을 포함합니다."
 EU_apply_for_membership: "유럽연합(EU) 가입"
 EU_apply_for_membership_desc: "§Y[ROOT.GetNameWithFlag]§!이(가) §C[EUU.GetFlag] 유럽연합(EU)§!에 가입할 수 있게 되었습니다. 함께 환희의 송가를 부릅시다:\n환희여, 신의 아름다운 불꽃이여,\n엘리시움의 딸이여,\n우리는 불꽃에 취해 들어간다,\n천상의 존재여, 성스러운 곳으로!\n당신의 마법은 다시 묶는다\n관습이 엄격히 갈라놓았던 것을;\n모든 인간은 형제가 되네,\n그대의 부드러운 날개가 머무는 곳에서."
 USoE_integrate_new_members: "신규 회원국 통합"
 USoE_integrate_new_members_desc: "추가 국가들이 한 걸음 더 나아가 연합에 가입하기로 결정했습니다. 이제 이 신규 회원국들을 통합하여 앞으로 나아갈 유럽 합중국을 한층 더 강력하게 만들어야 할 때입니다."
 tooltip_leader_of_EU_trade_policy_influence_3_percent: "§C[EUU.GetFlag] 유럽 연합의 무역 정책 결정권자§!들은 (§Y유럽 집행위원회 위원장§!, §Y유럽 연합 정상회의 상임의장§!, §Y유럽 의회 의장§! 순으로) §C[EUU.GetFlag] 유럽 연합§!의 모든 회원국에서 3% 보다 많은 영향력을 가지고 있어야 합니다."
 tooltip_leader_of_EU_trade_policy_influence_5_percent: "§C[EUU.GetFlag] 유럽 연합의 무역 정책 결정권자§!들은 (§Y유럽 집행위원회 위원장§!, §Y유럽 연합 정상회의 상임의장§!, §Y유럽 의회 의장§! 순으로) §C[EUU.GetFlag] 유럽 연합§!의 모든 회원국에서 5% 보다 많은 영향력을 가지고 있어야 합니다."
 tooltip_leader_of_EU_foreign_policy_influence_3_percent: "§C[EUU.GetFlag] 유럽 연합의 외교정책 지도자§!는 (§Y유럽 연합 외교안보정책 고위대표§!, §Y유럽 집행위원회 위원장§!, §Y유럽 의회 의장§! 순으로)  3% 보다 큰 영향력을 §C[EUU.GetFlag] 유럽 연합§!의 모든 회원국에서 가지고 있어야만 합니다."
 tooltip_leader_of_EU_foreign_policy_influence_5_percent: "§C[EUU.GetFlag] 유럽 연합의 외교정책 지도자§!는 (§Y유럽 연합 외교안보정책 고위대표§!, §Y유럽 집행위원회 위원장§!, §Y유럽 의회 의장§! 순으로)  5% 보다 큰 영향력을 §C[EUU.GetFlag] 유럽 연합§!의 모든 회원국에서 가지고 있어야만 합니다."
 tooltip_cons_are_eurosceptical: "정부가 [EUU.conservatism_L], [EUU.Conservative_L] 또는 [EUU.Neutral_conservatism_L]이며, 친유럽주의가 50% 미만입니다.\n"
 tooltip_libs_are_eurosceptical: "정부가 [EUU.liberalism_L] 또는 [EUU.Neutral_Libertarian_L]이며, 친유럽주의가 40% 미만입니다.\n"
 tooltip_social_green_are_eurosceptical: "정부가 [EUU.socialism_L], [EUU.neutral_Social_L] 또는 [EUU.Neutral_green_L]이며, 친유럽주의가 40% 미만입니다.\n"
 tooltip_comms_are_eurosceptical: "정부가 [EUU.Communist-State_L], [EUU.anarchist_communism_L] 또는 [EUU.Neutral_Communism_L]이며, 친유럽주의가 40% 미만입니다.\n"
 tooltip_nats_are_eurosceptical: "정부가 [EUU.Nat_Populism_L], [EUU.Nat_Fascism_L], [EUU.Nat_Autocracy_L] 또는 [EUU.Monarchist_L]입니다.\n"
 tooltip_other_are_eurosceptical: "정부가 상기 이념들 외의 이념이며, 친유럽주의가 40% 미만입니다."
 tooltip_invest_in_EU_single_market_cic: "§Y[ROOT.GetNameWithFlag]§!으로부터 §Y민간 산업 투자 제안§!을 받습니다.\n"
