 condition_high_interest_rate: "Niechęć do stóp procentowych"
 PROPOSE_SUBSIDIES_TO_SUBJECT_TITLE: "Zaproponuj §YDotacje Overlorda§!"
 PROPOSE_SUBSIDIES_TO_SUBJECT_ACTION_DESC: "Możemy zaproponować dofinansowanie naszego przedmiotu na kwotę §Y1%§! ich całkowitego §YProduktu Krajowego Brutto§! (PKB) tygodniowo, aby pomóc im w rozwoju gospodarczym. Z kolei będą mniej skłonni do prób uwolnienia się i powoli stracą autonomię."
 DIPLO_ACTION_PROPOSE_SUBSIDIES_TO_SUBJECT: "Zaproponowanie dotacji naszemu tematowi będzie się wiązało z koniecznością podjęcia §Y1%§! ich całkowitego §YProduktu Krajowego Brutto§! (PKB) tygodniowo, aby pomóc im w rozwoju gospodarczym. Jeśli się zgodzą, będzie mniej prawdopodobne, że spróbują się uwolnić i powoli stracą autonomię."
 DIPLO_ACTION_PROPOSE_SUBSIDIES_TO_SUBJECT_ACCEPT: "[THIS.GetNameWithFlag] §GAzgoda§! do §YDotacje Overlorda§!"
 DIPLO_ACTION_PROPOSE_SUBSIDIES_TO_SUBJECT_ACCEPT_DESC: "[THIS.GetNameWithFlag] zgodził się na§YDotacje Overlorda§!. Nasz skarb państwa rozpoczął niezbędne przygotowania w celu uwzględnienia tej pomocy budżetowej."
 DIPLO_ACTION_PROPOSE_SUBSIDIES_TO_SUBJECT_REJECT: "[THIS.GetNameWithFlag] §RRodrzucony§! §YDotacje Overlorda§!"
 DIPLO_ACTION_PROPOSE_SUBSIDIES_TO_SUBJECT_REJECT_DESC: "[THIS.GetNameWithFlag] odrzucił §YDotacje Overlorda§!."
 CANCEL_SUBSIDIES_TO_SUBJECT_TITLE: "Anuluj §YDotacje Overlorda§!"
 CANCEL_SUBSIDIES_TO_SUBJECT_ACTION_DESC: "Nie chcemy już kontynuować naszych §YDotacje Overlorda§!. Czas anulować obecną umowę. Powodów może być wiele, ale zdecydowaliśmy, że leży to w naszym najlepszym interesie."
 DIPLO_ACTION_CANCEL_OVERLORD_SUBSIDIES: "§YDotacje Overlorda§! pomiędzy [ROOT.GetNameWithFlag] i [THIS.GetNameWithFlag] zostało anulowane. Transfer środków zakończy się po tym tygodniu."
 overlord_subsidies: "Overlord dotuje nasz kraj."
 NEGOTIATE_OPERATIVE_RELEASE_TITLE: "Wynegocjuj uwolnienie agenta"
 DIPLO_ACTION_NEGOTIATE_OPERATIVE_RELEASE_DESC: "Niedawno jeden z naszych agentów został schwytany w tym kraju. Możemy negocjować z rządem jego uwolnienie i zapłacić niewielką kwotę tytułem rekompensaty albo powrócić do działań konspiracyjnych."
 DIPLO_ACTION_NEGOTIATE_OPERATIVE_RELEASE_ACCEPT_TITLE: "[THIS.GetNameWithFlag] §G Zgadza się§! na §Yzwolnienie §!"
 DIPLO_ACTION_NEGOTIATE_OPERATIVE_RELEASE_ACCEPT_DESC: "[THIS.GetNameWithFlag] zgodzili się uwolnić przetrzymywanego przez siebie agenta. W ramach reparacji wypłaciliśmy im §Y$2 miliardy§!."
 DIPLO_ACTION_NEGOTIATE_OPERATIVE_RELEASE_REJECT_TITLE: "[THIS.GetNameWithFlag] §GOdrzuca§! propozycje §Yzwolnienia agenta§!"
 DIPLO_ACTION_NEGOTIATE_OPERATIVE_RELEASE_REJECT_DESC: "[THIS.GetNameWithFlag] odmówili uwolnienia przetrzymywanego agenta, który znajdował się w ich rękach. Chyba przechodzimy do planu B."
 base_negotiate_operative_release: "Bazowa niechęć wobec §YNegocjowania uwolnienia agenta§!"
 base_enforce_peace_option: "Bazowa niechęć wobec opcji §YNarzucenia pokoju§!"
 difference_in_power_ranking: "Różnica w rankingu siły"
 NEGOTIATE_OPERATIVE_RELEASE_ACTION_DESC: "Możemy zaproponować negocjacje w sprawie uwolnienia jednego z naszych schwytanych §Y Agentów§! w zamian za §Y2 miliardy §!dolarów."
 ENFORCE_PEACE_OPTION_TITLE: "Wymusić pokój"
 ENFORCE_PEACE_OPTION_ACTION_DESC: "Możemy dążyć do wymuszenia pokoju w tym kraju, starając się powstrzymać trwające aktywne konflikty, nawet za cenę utraty znacznej części wpływów i nadszarpnięcia opinii na nasz temat."
 DIPLO_ACTION_ENFORCE_PEACE_OPTION_DESC: "[THIS.GetNameWithFlag] obecnie prowadzi wojnę ofensywną i w naszym interesie leży próba wymuszenia na nich pokoju. Powinniśmy nakazać im zaprzestanie prowadzenia obecnych działań ofensywnych."
 DIPLO_ACTION_ENFORCE_PEACE_OPTION_ACCEPT_TITLE: "[THIS.GetNameWithFlag] §G Zgadzają się §! na§Y wymuszenie pokoju §!"
 DIPLO_ACTION_ENFORCE_PEACE_OPTION_ACCEPT_DESC: "[THIS.GetNameWithFlag] ...zgodzili się na natychmiastowe zawieszenie broni z obecnymi przeciwnikami w wojnie. Straciliśmy znaczne wpływy w tym kraju."
 DIPLO_ACTION_ENFORCE_PEACE_OPTION_REJECT_TITLE: "[THIS.GetNameWithFlag] §G odrzucili§! §YWymuszenie pokoju§!"
 DIPLO_ACTION_ENFORCE_PEACE_OPTION_REJECT_DESC: "[THIS.GetNameWithFlag] odrzuciłi przedstawione przez nas warunki natychmiastowego zawieszenia broni... Chyba czas przejść do planu B."
 PROPOSE_ENERGY_LOAD_SHARING_TITLE: "Propozycja §YWspółdzielenia obciążenia sieci energetycznej§!"
 PROPOSE_ENERGY_LOAD_SHARING_ACTION_DESC: "Możemy zaproponować porozumienie w sprawie §Ywspółdzielenia obciążenia energetycznego§!, w ramach którego będziemy dzielić się z nimi energią."
 DIPLO_ACTION_PROPOSE_ENERGY_LOAD_SHARING_DESC: "Wygląda na to, że [THIS.GetNameWithFlag] mają problemy z obecną siecią elektroenergetyczną. Czy warto sprawdzić, czy byliby zainteresowani wsparciem z naszej sieci?"
 REQUEST_ENERGY_LOAD_SHARING_TITLE: "Poproś o §Ydzielenie obciążenia energetycznego§!"
 REQUEST_ENERGY_LOAD_SHARING_ACTION_DESC: "Możemy złożyć wniosek o zawarcie umowy o §Ydzieleniu obciążenia energetycznego§!, na mocy której będą oni dzielić się z nami swoją energią."
 DIPLO_ACTION_REQUEST_ENERGY_LOAD_SHARING_DESC: "[THIS.GetNameWithFlag] jest obecnie świetnym kandydatem do wymiany energii. Czy warto sprawdzić, czy byliby skłonni dzielić się z nami energią, aby wesprzeć naszą sieć?"
 DIPLO_ACTION_ENERGY_LOAD_SHARING_ACCEPT_TITLE: "[THIS.GetNameWithFlag] §GAgreed§! to the §YEnergy Load Sharing§!"
