 ### ECONOMY ###
 POR_web_summit: "Web Summit"
 POR_web_summit_desc: "Seventy thousand people in Parque das Nacoes for a week, and a standing argument about whether it is worth what we pay for it. What it actually buys is the first generation in living memory with a reason to stay."

 ### THE LUSOPHONE WORLD ###
 POR_lusophone_community: "Lusophone Community"
 POR_lusophone_community_desc: "Eight countries, four continents, two hundred and fifty million speakers and no institution worth the name. Everyone involved agrees something should be built. Only we have a reason to build it.\n\nBetween a diplomatic note and a war, a country of ten million has no instrument at all. The community we build will be that instrument."
 POR_camoes_institute: "Camoes Institute"
 POR_camoes_institute_desc: "Language schools, teacher exchanges, a seat at every ministry of education from Praia to Dili. The cheapest instrument of foreign policy ever devised, and the only one nobody objects to."
 POR_lusophone_realpolitik: "Lusophone Realpolitik"
 POR_lusophone_realpolitik_desc: "The community of language is real and it is also a map of where we are already trusted. A government that is trusted in eight capitals can do things in those capitals that nobody else can.\n\nWe will stop pretending that is sentiment."
 POR_friends_of_the_regime: "Friends of the Regime"
 POR_friends_of_the_regime_desc: "A retainer for the minister's brother, a scholarship for the general's daughter, a directorship for the man who runs the port. Below them sit customs officers, telephone engineers and the second secretary at the central bank, none of whom thinks of himself as an agent. None of it is illegal in any of the countries concerned, which is the point of doing it that way."
 POR_officer_network: "Officer Network"
 POR_officer_network_desc: "Every officer corps in the Lusophone world was trained in a language we gave them, and a good number of them at our academies. Half the general staff of four countries did their staff course at Pedroucos and still writes at Christmas. Men who stay in touch can be reached, and the correspondence is now formalized."
 POR_discreet_road: "Discreet Road"
 POR_discreet_road_desc: "Nothing is signed, nothing is announced and no Portuguese uniform is ever photographed. What we do will still be obvious to anyone who looks, and the whole art is in making sure nobody has to."
 POR_open_road: "Open Road"
 POR_open_road_desc: "We stop apologising for having interests. A country that says plainly what it wants in Africa will be believed there, and will be resented everywhere else."
 POR_the_portuguese_legion: "Portuguese Legion"
 POR_the_portuguese_legion_desc: "A standing pool of officers and volunteers held apart from the regular establishment. They are not an expeditionary force and must never be described as one; they are men available to go somewhere difficult at short notice."
 POR_protectorate: "Protectorate"
 POR_protectorate_desc: "Some governments do not survive their own civil war. When one that owes us everything is too weak to stand, we do not wait for the next coup: we invade, restore order and keep it as a protectorate."
 POR_african_war_school: "African War School"
 POR_african_war_school_desc: "Thirteen years of colonial war taught this army things no other European army learned, and we spent twenty-five years forgetting them. The men who remember are still alive, and they can still teach."
 POR_force_projection: "Force Projection"
 POR_force_projection_desc: "Transport aircraft, a logistics chain that does not depend on the goodwill of a neighbouring government, and the legal authority to use both without a debate in the Assembly."
 POR_second_wave: "Second Wave"
 POR_second_wave_desc: "One operation at a time is a policy. Two is an empire, and the difference is entirely in what our own services can carry without losing track of it."
 POR_tour_needs_a_war_tt: "Portuguese forces are §Ydeployed overseas§!"
 POR_atlantic_exit_tt: "Our exposure is above §Y35§!"
 POR_informal_empire_tt: "We have at least §Y1§! Lusophone client government"
 POR_second_wave_tt: "We may sponsor §Y1§! additional operation at a time"
 POR_european_question: "European Question"
 POR_european_question_desc: "Everything we do overseas is done by a member state of the European Union, and sooner or later somebody in Brussels will ask what exactly we are doing. We should decide now what we intend to say."
 POR_remain_in_europe: "Remain in Europe"
 POR_remain_in_europe_desc: "We stand the operations down, we let the files go cold, and we keep the seat, the fund transfers and the currency. What we have already built stays built; what we were going to build next does not."
 POR_remain_in_europe_tt: "We may no longer begin new §Roperations§!. Countries already ours §Gremain§! ours."
 POR_atlantic_exit: "Atlantic Exit"
 POR_atlantic_exit_desc: "A country with an ocean, eight relationships nobody else has, and no further use for permission. We leave the alliance, we accept what that does to us in Europe, and we stop explaining ourselves."
 POR_informal_empire: "Informal Empire"
 POR_informal_empire_desc: "No governors, no garrisons and no colonial budget. Governments that owe us their existence, sign what we put in front of them, and are answerable to their own electorates for everything that goes wrong.\n\nThe Estado Novo spent a generation of conscripts learning that the other way does not work."

