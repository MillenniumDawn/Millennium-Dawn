 china_sar.048.d: "El Consejo Legislativo ha votado a favor de liquidar la Región Administrativa Especial y situar a Hong Kong bajo la administración directa del poder central. La sinización ha completado todo su recorrido: el gobierno local solicita ahora a Pekín que complete el traspaso antes de lo previsto, y no queda ningún sector en el territorio dispuesto a argumentar lo contrario."
