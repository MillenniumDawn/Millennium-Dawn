 cnc_eq_better_radios: "통신 장비"
 cnc_eq_better_radios_desc: "군을 운용하는 데 필요한 온갖 무전기, 태블릿, 컴퓨터입니다"
 cnc_eq_better_ergonomics: "인체공학"
 cnc_eq_better_ergonomics_desc: "일상적으로 장비를 운용할 때는 인체공학이 무엇보다 중요합니다"
 strike_upgrade_1: "초음속 순항"
 strike_upgrade_1_desc: "애프터버너 없이도 초음속 비행을 효율적으로 지속합니다"
 strike_upgrade_2: "2세대 스텔스"
 strike_upgrade_2_desc: "향상된 스텔스 특성과 성능으로 적 영공 침투 능력과 생존성이 높아집니다"
 strike_upgrade_3: "원격 조종"
 strike_upgrade_3_desc: "기계에서 인간을 제외하면 더 위험한 임무 수행이 가능하며 항공기가 더 높은 중력가속도를 견딜 수 있습니다"
 computing_1: "메인프레임 컴퓨팅"
 computing_1_desc: "대형 고속 컴퓨터는 주로 대규모 조직에서 핵심 업무, 대량 데이터 처리, 기타 대규모 처리 작업에 사용됩니다.\n"
 computing_2: "마이크로컴퓨팅"
 computing_2_desc: "마이크로컴퓨팅 이론은 컴퓨터 분야에 마이크로프로세서가 도입되면서 나왔습니다. 마이크로프로세서의 도입으로 컴퓨터가 더욱 강력해지고 논리 처리 용량이 늘어나, 개인용 가정 컴퓨터의 활용이 확대되는 길이 열렸습니다.\n"
 computing_3: "개선된 컴퓨팅"
 computing_3_desc: "컴퓨터는 시간이 갈수록 점점 대중화되고 있습니다. 이제 컴퓨터는 책상 위에 편안히 놓일 수 있어, 사람들이 게임을 하고 문서를 작성하는 등 이전에는 상상도 못 했던 여러 편의를 누릴 수 있게 되었습니다.\n"
 computing_4: "고급 컴퓨팅"
 computing_4_desc: "2000년대 중반 오늘날과 같은 형태의 최초 데스크톱이 등장하면서 정보 폭발이 일어났습니다. 이제 사람들은 훨씬 더 많은 일을 할 수 있습니다.\n"
 computing_5: "현대 컴퓨팅"
 computing_5_desc: "이제 컴퓨터 기술은 급속히 발전하여, 한때 거대한 서버 상자에 들어 있던 컴퓨터가 태블릿만큼 작아졌습니다. 처리 능력은 최초의 컴퓨터가 발명되었을 때에 비해 세 배, 어쩌면 다섯 배 강력합니다.\n"
 computing_6: "양자 컴퓨팅"
 computing_6_desc: "양자 컴퓨팅은 1980년대 초 물리학자 폴 베니오프가 튜링 기계의 양자역학적 모형을 제안하면서 시작되었습니다. 이후 과학자들은 양자 컴퓨터가 일반 컴퓨터로는 불가능한 시뮬레이션을 수행할 수 있다고 제안했습니다. 초기의 실용적 양자 체계는 통제된 큐비트와 오류 정정을 사용하여 암호학, 재료 연구, 복잡한 군사 시뮬레이션 같은 특수 작업을 가속합니다.\n"
 computing_7: "고급 양자 컴퓨팅"
 computing_7_desc: "고급 양자 체계는 신뢰할 수 있는 논리 큐비트 수를 늘리고 양자 알고리즘을 개선하며 고전 슈퍼컴퓨터와 통합되어, 군사 연구, 물류, 보안 통신에서 더욱 실용적으로 활용될 수 있게 합니다.\n"
 computing_8: "분산 양자 프로세서"
 computing_8_desc: "분산 양자 프로세서는 여러 양자 모듈을 더 큰 컴퓨팅 체계로 연결하여 회로 깊이, 알고리즘 복잡도, 안정적으로 풀 수 있는 문제의 규모를 늘립니다.\n"
 computing_9: "하이브리드 양자 슈퍼컴퓨팅"
 computing_9_desc: "하이브리드 양자 슈퍼컴퓨터는 양자 가속기를 고성능 고전 체계와 결합하여, 대규모 과학 및 전략 연산에서 각 구조가 가장 잘 처리하는 작업에 맞춰 활용합니다.\n"
 computing_10: "분산 양자 슈퍼컴퓨팅"
 computing_10_desc: "분산 양자 슈퍼컴퓨터는 대규모 내결함성 프로세서 배열을 전용 통제, 네트워크, 오류 정정 체계로 연결하여 고급 시뮬레이션, 최적화, 암호 분석을 가능하게 합니다.\n"
 computing_11: "전략 양자 연산 네트워크"
 computing_11_desc: "전략 양자 연산 네트워크는 방대한 양자 프로세서와 AI 기반 통제 체계를 연결하여 전국의 군사 및 산업 자산을 조율하고 최적화합니다.\n"
 decryption_1: "암호 해독 I"
 decryption_1_desc: "더 새롭고 현대적인 컴퓨터로 암호 해독이 훨씬 빨라졌으며, 새로운 기법으로 어떤 암호화된 메시지든 풀 수 있게 되었습니다."
