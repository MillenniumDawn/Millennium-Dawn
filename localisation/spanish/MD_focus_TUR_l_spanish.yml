l_spanish:
 turkey_focus: "Árbol de Enfoque Turco"
 TUR_PKK_autonomy_idea: "Resistencia del PKK"
 TUR_PKK_autonomy_idea_desc: "Incorporar al PKK en otro país será casi imposible."
 TUR_traditional_ideals: "Ideales Tradicionales"
 TUR_traditional_ideals_desc: "Rechazar ideales e influencias extranjeras es el mejor camino que nuestra nación puede tomar para ser libre e independiente."
 TUR_archeology_cooperation: "Cooperación Arqueológica"
 TUR_archeology_cooperation_desc: "Estamos cooperando con otras naciones en la excavación de antiguos tesoros del mundo"
 TUR_tubitak_idea_name: "TUBITAK"
 TUR_belgian_workers: "Científicos Belgas"
 TUR_tubitak_idea_name_desc: "Hemos traído a científicos belgas para que realicen el arduo trabajo de investigación y desarrollo para nosotros."
 TUR_islamic_legacy2: "The Caliphate's Legacy"
 TUR_islamic_legacy2_desc: "El Califato tendrá una historia muy larga en nuestra nación, y debemos enfatizar eso. Lo utilizaremos en nuestro beneficio para fines ideológicos"
 TUR_mit_reform: "Reformas del MIT"
 TUR_mit_reform_desc: "El MIT ha sido reformado para mantenerse al tanto de la actividad dentro de la vida civil."
 TUR_tourism: "Afluencia de Turismo"
 TUR_tourism_desc: "We've had a lot of tourists coming into the country recently."
 TUR_mit_coop: "Cooperación con el MIT"
 TUR_mit_coop_desc: "El MIT ahora coopera muy de cerca con nuestras fuerzas armadas, incluso manteniendo el seguimiento de documentos cruciales e información militar."
 TUR_new_armed_forces: "Fuerzas Armadas Reacondicionadas"
 TUR_new_armed_forces_desc: "Nuestras fuerzas militares han sido reacondicionadas y renacidas tras nuestras amplias reformas."
 TUR_airforce: "Contratos Aéreos"
 TUR_airforce_desc: "Hemos firmado contratos con varias compañías aéreas para proporcionarnos mejores ofertas."
 TUR_naval_idea_name: "Armada Turca"
 TUR_naval_idea_name_desc: "La Armada Turca tiene la tarea de proporcionar a Turquía hegemonía en los océanos y aguas territoriales."
 TUR_alawite_mili_experience: "Experiencia Militar Alauita"
 TUR_alawite_mili_experience_desc: "Los alauitas tienen bastante experiencia cuando se trata de combate. Por esa razón, no tenemos que entrenarlos ni enseñarles la nuestra."
 TUR_our_own_experience: "Experiencia Militar Turca"
 TUR_our_own_experience_desc: "Utilizaremos la experiencia militar turca como un medio para comandar unidades alauitas en combate"
 TUR_service_community_name: "Un Servicio a la Comunidad"
 TUR_service_community_name_desc: "Hizmet significa servicio. Por esa razón, es nuestro deber ser de asistencia a las personas de todo el mundo."
 TUR_revised_budgetting_name: "Presupuestos Revisados"
 TUR_revised_budgetting_name_desc: "Hemos revisado nuestro presupuesto para satisfacer mejor las necesidades actuales del pueblo turco."
 TUR_akp_protests: "Protestas del AKP"
 TUR_akp_protests_desc: "Los partidarios del AKP no están muy contentos con nuestras últimas decisiones y han salido a las calles por ello"
 TUR_major_military_reform: "Reformas Militares Importantes"
 TUR_major_military_reform_desc: "El Ejército ha sido virtualmente el mismo desde el ascenso de Ataturk. Reformarlo fue lo mejor que pudimos haber hecho por él, ya que ahora será una fuerza formidable en el siglo XXI."
 TUR_religious_directorate: "The Diyanet's Role"
 TUR_religious_directorate_desc: "El Diyanet, o nuestra dirección de asuntos religiosos, va a allanar el camino para un nuevo sistema educativo actualizado en nuestra nación."
 TUR_no_prime_minister: "República Presidencial"
 TUR_no_prime_minister_desc: "We have removed the Prime Minister's position from power, therefore shifting Turkey's politics to a Presidential Republic."
 TUR_threat_abroad: "La Amenaza en el Extranjero"
 TUR_threat_abroad_desc: "Not only is Turkey in danger because of dangerous people running around within the nation, but also bad actors outside of the country wish to seek harm upon us. We will make sure these bad actors are busy as we can now send our own troops to their lands without declaring war."
 TUR_military_happy: "Ejército Complacido"
 TUR_military_happy_desc: "The Military is currently §GPleased§! with our party and policies, and is not going to cause us any problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below 0§! or we remove §HThe Military Internal Faction§!."
 TUR_military_anger1: "Ejército Insatisfecho"
 TUR_military_anger1_desc: "The Military is currently §RUnsatisfied§! with our party and policies, and is not going to cause us any problems for the time being.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -50§! or we exceed §H0§!.This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 pkk_static_modifier: "Ecos de la Resistencia Kurda"
 pkk_static_modifier_desc: "Ever since the end of the Great War, and the Treaty of Sevres, the Kurds have been yearning for a country of their own, free and independent from that of ours. Their independence from our nation will bring devastating consequences, but their occupation will do no good either."
 kurdish_resistance_dynamic_modifier: "Resistencia Kurda"
 kurdish_resistance_dynamic_modifier_desc: "Desde el fin de la Gran Guerra y el Tratado de Sèvres, los kurdos han anhelado un país propio, libre e independiente del nuestro. Su independencia de nuestra nación traerá consecuencias devastadoras, pero su ocupación tampoco les traerá ningún bien."
 TUR_military_anger2: "Ejército Frustrado"
 TUR_military_anger2_desc: "The Military is currently §RFrustrated§! with our party and policies, and is starting to cause us some problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -100§! or exceeds §H-50§!. This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 TUR_military_anger3: "Ejército Furioso"
 TUR_military_anger3_desc: "The Military is currently §RFurious§! with our party and policies, and they are causing problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -150§! or we exceed §H-100§!. This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 TUR_military_anger4: "Ejército Desleal"
 TUR_military_anger4_desc: "The Military is currently §RDisloyal§! because of our party and policies, and they are causing major problems.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military §HDrops below -200§! or we exceed §H-150§!. This national spirit will also cancel if remove §HThe Military Internal Faction§!."
 TUR_military_anger5: "Ejército Incapacitado"
 TUR_military_anger5_desc: "The Military is currently §RCrippled§! due to our party policies and low standing. The armed forces of Turkey are virtually useless unless we increase our standing with the military.\n§W--------------§!\nThis national spirit will be §RReplaced§! if our standing with the military exceeds §H-200§!. This national spirit will also cancel if we remove §HThe Military Internal Faction§!."
 TUR_highways: "Autopistas Turcas"
 TUR_highways_desc: "Nuestras carreteras están comenzando a desmoronarse y desintegrarse, y por esa razón tendremos que comenzar la construcción de nuevas autopistas para nuestra gente."
 TUR_guards_of_kemalism: "Guardianes del Kemalismo"
 TUR_guards_of_kemalism_desc: "El Ejército Turco se ve a sí mismo como el defensor de la República y sus ideales seculares kemalistas. El ejército ha intervenido en la política turca muchas veces a lo largo de la existencia de la república y está listo para hacerlo de nuevo si siente que sus valores están amenazados. Sin embargo, a menudo han cedido pacíficamente el poder de regreso al pueblo después de su intervención, y eso es lo que la gente espera.\n\nEl ejército se opone a partidos políticos no seculares como el §W[Nat_Populism_L]§!. La §Yposición§! del ejército con el gobierno se ve afectada por múltiples factores, como el §GSocial Conservatism - Government§!. Si nuestra §Yposición§! con ellos baja de §Y0§!, el ejército tomará medidas para derrocar al gobierno.\n\n§YEl Ejército§! también resistirá los intentos de reducir su poder, pero si logramos eliminarlos, no podrán interferir con nosotros."
 TUR_between_east_and_west: "Entre Oriente y Occidente"
 TUR_between_east_and_west_desc: "Even though Turkey is part of NATO, it is a close rival to its NATO ally Greece. Turkey also has close economic ties with Russia, while at the same time working against their interests. Balancing between the great powers and keeping our own interests at heart will be the key to our success.\n\nIf we ally ourselves too closely with a §YGreat Power§! or a §YSuper Power§!, we have clearly chosen our side on the world stage."
 TUR_no_economic_plan: "Sin Plan Económico"
 TUR_no_economic_plan_desc: "§RWe can't increase our §YEconomic Cycle§! above §YRecession§!§!\n\nSeveral attempts to form governments in the late 90s, a subsequent military coup with a newly elected government and IMF warnings of a collapsing economy have caused dozens of billions of dollars to disappear from the economy as foreign investors have pulled out of the country. As the Turkish economy is practically built on foreign investment, this has stopped any economic growth."
 TUR_economic_insecurity_name: "Inseguridad Económica"
 TUR_economic_insecurity_name_desc: "Several attempts to form governments in the late 90s, a subsequent military coup with a newly elected government and IMF warnings of a collapsing economy have caused dozens of billions of dollars to disappear from the economy as foreign investors have pulled out of the country. As the Turkish economy is practically built on foreign investment, this has stopped any economic growth."
 TUR_economic_security_name: "Seguridad Económica"
 TUR_economic_security_name_desc: "Hemos tenido éxito en restaurar la seguridad económica. Sin embargo, no somos invencibles ante cualquier otra caída. Siempre tendremos que continuar monitoreando y mejorando la economía turca para que nuestra gente y nación prosperen."
 TUR_economic_security3: "La Gran Economía Turca"
 TUR_economic_security3_desc: "Nuestra economía ahora es mayor que antes, tras todo el arduo trabajo que le hemos dedicado. Ahora podemos estar seguros de que, pase lo que pase, la economía podrá recuperarse y ser mejor que nunca."
 TUR_asteroid_mining: "Minería de Asteroides"
 TUR_asteroid_mining_desc: "Estamos minando asteroides para obtener sus metales preciosos en nuestras fábricas. Mejores materiales resultarán en una mejor producción."
 TUR_radicalism_destroy: "Agenda Anti-Islamista"
 TUR_radicalism_destroy_desc: "Estamos impulsando una agenda anti-islamista para contrarrestar el crecimiento del islamismo en el país. También promoveremos la diplomacia anti-islamista y cortaremos nuestros lazos con países islamistas de línea dura."
 TUR_osman_v: "Osman V"
 TUR_osman_v_desc: "Born on August 18, 1912, in Istanbul, Osman V or otherwise known as Ertugrul Osman, was the son of Mehmed Burhaneddin. He is often referred to as the \"Last Ottoman\", but ironically enough there are now successors to the Ottoman throne following the return of the Osmanoglu family."
 TUR_mit_reformed: "MIT - Enfoque Nacional"
 TUR_mit_reformed_desc: "El MIT se centrará más en asuntos nacionales que en asuntos externos"
 TUR_mit_emboldened: "MIT - Enfoque Externo"
 TUR_mit_emboldened_desc: "El MIT se preocupará más por lo que sucede fuera de nuestro país"
 TUR_government_led_disasters: "Plan Liderado por el Gobierno"
 TUR_government_led_disasters_desc: "El Gobierno proporcionará ayuda a las personas que han estado en desastres naturales en lugar de organizaciones benéficas, aunque también son libres de ayudar si lo desean"
 TUR_refugees_maintained: "Refugiados Mantenidos"
 TUR_refugees_maintained_desc: "En lugar de deportar a nuestros refugiados, hemos optado por mantenerlos y utilizarlos en la fuerza laboral"
 TUR_drugs_illegalized: "Drogas Penalizadas"
 TUR_drugs_illegalized_desc: "Si alguien usa drogas para cualquier propósito que no sea el uso médico, tendrá problemas con la ley"
 TUR_drugs_legalized: "Drogas Legalizadas"
 TUR_drugs_legalized_desc: "Realmente no nos importa para qué usan las drogas las personas, es su vida de todos modos"
 TUR_nationalist_advantage: "Nacionalista Utilizado"
 TUR_nationalist_advantage_desc: "We are utilizing Nationalism for an extra boost to governance, making it easier to pursue certain policies"
 TUR_fight_nationalist: "Combatiendo el Nacionalismo"
 TUR_fight_nationalist_desc: "El nacionalismo es una fuerza peligrosa, puede causar estragos e inestabilidad dentro de nuestra nación"
 TUR_turkish_media_unctrolled2: "Medios Turcos - §Cbajo Investigación§!"
 TUR_turkish_media_unctrolled2_desc: "Actualmente, nuestros medios están bajo investigación y se realizarán reformas en un futuro cercano"
 TUR_party_rumours: "Rumores del Partido"
 TUR_party_rumours_desc: "§RNo podemos aumentar manualmente la popularidad de §W[socialism_L]§!§!\n\nEl Primer Ministro Bülent Ecevit ya es una persona mayor, y hay rumores de que su salud está fallando. También hay rumores de que el viceprimer ministro Hüsamettin Özkan es parte de un grupo de §W[socialism_L]§! MPs que están planeando destituir a Ecevit debido a su salud y administración ineficiente. Este tipo de rumores y disidencia dentro del partido son veneno para la capacidad del gobierno de funcionar.\n\nLlamar a Özkan públicamente lo obligaría a dejar el partido, pero podría llevarse a algunos de los otros MPs con él. Alternativamente, podemos esperar y esperar que estos no sean más que rumores."
 TUR_reformed_airforce: "Fuerza Aérea Reformada"
 TUR_reformed_airforce_desc: "La fuerza aérea ha sido reformada para operar mejor en los cielos y mantener la superioridad aérea sobre el enemigo."
 TUR_PKK_insurgency_ceasefire: "Insurgencia del PKK - Alto el Fuego"
 TUR_PKK_insurgency_ceasefire_desc: "§RNo podemos aumentar la popularidad de §W[Neutral_Communism_L]§!§!\n\nEl PKK es un grupo insurgente kurdo de izquierda que ha luchado por una mayor autonomía kurda desde los años 70. Ambas partes han utilizado tácticas de terror para tratar de lograr la victoria entre sí.\n\nActualmente, el PKK ha declarado un alto el fuego unilateral.\n\n-El proceso de paz y las negociaciones solo pueden continuar con un alto el fuego activo\n-Un alto el fuego nos permite reunir nuestras fuerzas y preparar un ataque sorpresa contra el PKK."
 TUR_PKK_insurgency_active: "Insurgencia del PKK - Activa"
 TUR_PKK_insurgency_active_desc: "§RNo podemos aumentar la popularidad de §W[Neutral_Communism_L]§!§!\n\nEl PKK es un grupo insurgente kurdo de izquierda que ha luchado por una mayor autonomía kurda desde los años 70. Ambas partes han utilizado tácticas de terror para tratar de lograr la victoria entre sí.\n\nActualmente, el PKK está luchando activamente contra el gobierno.\n\n-El proceso de paz y las negociaciones solo pueden continuar con un alto el fuego activo\n-Un alto el fuego nos permite reunir nuestras fuerzas y preparar un ataque sorpresa contra el PKK."
 TUR_kurdish_trouble_name: "Problema Kurdo"
 TUR_kurdish_trouble_name_desc: "The East of our country is essentially an active warzone as a result of decades of fighting with the PKK.§W\n------------\n§!We can get rid of this national spirit by either §Hfederalizing Kurdistan§! or destroying the §HPKK insurgency§! through the mechanic."
 TUR_kurdish_trouble3_name: "Mediación Kurda"
 TUR_kurdish_trouble3_name_desc: "El este de nuestro país es esencialmente una zona de guerra activa como resultado de décadas de lucha con el PKK.§W\n------------\n§!Podemos deshacernos o modificar este debuff §HFederalización de Diyarbakir§!."
 TUR_kurdish_trouble5_name: "La Guerra Interminable"
 TUR_kurdish_trouble5_name_desc: "The East of our country is essentially an active warzone as a result of decades of fighting with the PKK.§W\n------------\n§!We can modify this debuff by completing the §HEndless War§! focus path"
 TUR_mafia_active: "Mafia Turca - §RActiva§!"
 TUR_mafia_active_desc: "La mafia en nuestro país lleva muchos años organizando el crimen y perturbando la vida cotidiana de nuestros ciudadanos. Nuestras calles son relativamente seguras, pero están lejos de ser ideales.§W\n------------\n§!Podemos deshacernos de la Mafia §Hreduciendo su fuerza a 30 o menos§!, y luego realizando las §Hdecisiones§! disponibles. También debemos completar §HLos Enfoques de la Mafia§!."
 TUR_mafia_active2: "Mafia Turca - §RPresente§!"
 TUR_mafia_active2_desc: "La mafia en nuestro país lleva muchos años organizando el crimen y perturbando la vida cotidiana de nuestros ciudadanos. Nuestras calles son relativamente seguras, pero están lejos de ser ideales.§W\n------------\n§!Podemos deshacernos de la Mafia §Hreduciendo su fuerza a 30 o menos§!, y luego realizando las §Hdecisiones§! disponibles."
 TUR_mafia_weakened: "Mafia Turca - §Gdebilitada§!"
 TUR_mafia_weakened_desc: "La mafia en nuestro país lleva muchos años organizando el crimen y perturbando la vida cotidiana de nuestros ciudadanos. Nuestras calles son relativamente seguras, pero están lejos de ser ideales.§W\n------------\n§!Podemos deshacernos de la Mafia §Hreduciendo su fuerza a 30 o menos§!, y luego realizando las §Hdecisiones§! disponibles."
 TUR_mafia_weak: "Mafia Turca - §Gdébil§!"
 TUR_mafia_weak_desc: "La mafia en nuestro país lleva muchos años organizando el crimen y perturbando la vida cotidiana de nuestros ciudadanos. Nuestras calles son relativamente seguras, pero están lejos de ser ideales.§W\n------------\n§!Podemos deshacernos de la Mafia §Hreduciendo su fuerza a 30 o menos§!, y luego realizando las §Hdecisiones§! disponibles."
 TUR_neo_ottomanism: "Neo-Otomanismo"
 TUR_neo_ottomanism_desc: "El neo-otomanismo es una forma de política exterior turca agresiva que ha permitido al gobierno influir en los países vecinos y ejercer influencia turca hacia el exterior."
 TUR_zero_problems: "Política de Cero Problemas"
 TUR_zero_problems_desc: "La política de cero problemas es una forma de política exterior turca pacífica que permite al gobierno influir en los países vecinos a través de la cooperación e inversiones."
 TUR_turkish_media_unctrolled: "Medios Turcos - §RDescontrolados§!"
 TUR_turkish_media_unctrolled_desc: "Actualmente, nuestros medios están completamente libres de control o influencia del gobierno, lo que puede causar algunos problemas en el futuro"
 TUR_win_over_workers: "Aplacar al Trabajador"
 TUR_win_over_workers_desc: "Estamos apelando a los trabajadores en nuestras fábricas, y debido a eso están más dispuestos a apoyar a nuestro gobierno"
 TUR_no_disasters_plan: "Sin Planes de Desastre"
 TUR_no_disasters_plan_desc: "Actualmente, nuestro gobierno no tiene planes de preparación para desastres, lo que significa que cada vez que ocurra un desastre no estaremos preparados"
 TUR_charity_disasters: "Plan de carrera benéfica"
 TUR_charity_disasters_desc: "Nuestro plan de desastre depende de la generosidad de los ciudadanos y de las donaciones para brindar ayuda a las personas en momentos de necesidad."
 TUR_government_led_disaster: "Plan Liderado por el Gobierno"
 TUR_government_led_disaster_desc: "En lugar de subcontratar el plan de preparación para desastres a otro grupo, el gobierno creará y financiará los planes"
 TUR_turkish_media_restricted: "Medios Turcos - §GRestringidos§!"
 TUR_turkish_media_restricted_desc: "We are restricting what can be put in the media to prevent the spread of dangerous ideals"
 TUR_turkish_media_unrestricted: "Medios Turcos - §GDesrestringidos§!"
 TUR_turkish_media_unrestricted_desc: "Los medios son libres de hacer lo que quieran, pero con algunos pequeños controles para evitar posibles desastres"
 TUR_turkish_cyberspace: "Ciberespacio Turco"
 TUR_turkish_cyberspace_desc: "Cada vez más de nuestros ciudadanos están usando Internet, lo que significa que no estaremos 100% seguros de lo que está sucediendo. Tendremos que determinar si restringimos o no el ciberespacio"
 TUR_turkish_cyberspace_restricted: "Ciberespacio Restringido"
 TUR_turkish_cyberspace_restricted_desc: "Hemos decidido restringir nuestro ciberespacio, haciéndolo más seguro de usar"
 TUR_turkish_cyberspace_unrestricted: "Ciberespacio Desrestringido"
 TUR_turkish_cyberspace_unrestricted_desc: "No es asunto nuestro lo que nuestra gente elija hacer en Internet"
 TUR_erdonomics_name: "Erdonomía"
 TUR_erdonomics_name_desc: "Erdonomics refers to Erdogan's economic policies which brought sweeping reforms to the Turkish economy, for the better or for the worse"
 TUR_gulenist_economic_advisors: "Economistas Gülenistas"
 TUR_gulenist_economic_advisors_desc: "We have hired economists to advise the government on all matters economical"
 TUR_gulenist_intelligence_network: "Red de inteligencia gülenista"
 TUR_gulenist_intelligence_network_desc: "Aprovechamos el hecho de que los gülenistas se han extendido por todo el mundo para recopilar información."
 TUR_gulenist_intelligence_network2: "Red de inteligencia gülenista"
 TUR_gulenist_intelligence_network2_desc: "Aprovechamos el hecho de que los gülenistas se han extendido por todo el mundo para recopilar información."
 TUR_unban_erdogan: "§HDesprohibir a Erdogan de la Política§!"
 TUR_unban_erdogan_desc: "Erdogan ha estado prohibido en la política durante mucho tiempo, pero ahora que el AKP ha asegurado una victoria, es hora de desprohibirlo."
 TUR_gulenist_educators: "Educación Gülenista"
 TUR_gulenist_educators2: "Educación Gülenista Avanzada"
 TUR_gulenist_educators_desc: "Hemos puesto el foco en mejorar nuestra educación, y debemos difundir las enseñanzas de Gülen mientras podamos"
 TUR_mobilise_the_faithful_soldiers: "Movilización de los Fieles"
 TUR_mobilise_the_faithful_soldiers_desc: "El Movimiento Gülenista ha sido movilizado. Estamos alentando a todos los miembros a emigrar a Turquía y hacer que el país sea más fuerte"
 TUR_mobilise_the_faithful_soldiers2: "Movilización de los Fieles"
 TUR_mobilise_the_faithful_soldiers2_desc: "El Movimiento Gülenista ha sido movilizado. Estamos alentando a todos los miembros a emigrar a Turquía y hacer que el país sea más fuerte"
 TUR_rise_of_fp: "Auge de [Conservative_L]"
 TUR_rise_of_fp_desc: "Turquía ha sido durante mucho tiempo un país laico, pero cada vez más personas desean que más tradiciones del Islam regresen a la sociedad. Muchas personas están enojadas con la actitud casi anti-religiosa de los partidos kemalistas"
 TUR_attacking_mafia1: "Atacando a la Mafia"
 TUR_attacking_mafia1_desc: "Estamos en un conflicto activo con la Mafia y sus miembros"
 TUR_attacking_mafia2: "Daño a la Mafia"
 TUR_attacking_mafia2_desc: "Estamos en un conflicto activo con la Mafia y sus miembros, y estamos ganando"
 TUR_village_institutes: "Institutos de Aldeas"
 TUR_village_institutes_desc: "Students from smaller villages are educated as teachers, and return to those villages to teach. Village institutes are vocational type schools that teach a lot of practical subjects, and students are encouraged to read a diverse set of political books"
 TUR_incentivised_farming: "Agricultura de Alta Tecnología"
 TUR_incentivised_farming_desc: "A los productores y compradores agrícolas se les están dando exenciones fiscales, y se están aplicando dispositivos de alta tecnología y big data a los métodos agrícolas"
 TUR_PKK_active_foreign: "Actividad del PKK"
 TUR_PKK_active_foreign_desc: "El grupo insurgente kurdo está operando bases o asistiendo a grupos afiliados en este país"
 TUR_ciw_disasters: "Ayuda para Desastres de CIW"
 TUR_ciw_disasters_desc: "La CIW nos está proporcionando ayuda para desastres"
 TUR_ciw_infrastructure: "Asistencia en Infraestructura de CIW"
 TUR_ciw_infrastructure_desc: "La CIW nos está dando asistencia en la construcción de infraestructura para nuestra nación"
 TUR_ciw_education: "Financiamiento Educativo de CIW"
 TUR_ciw_education_desc: "The CIW is funding our nation's education"
 TUR_ciw_population: "Financiamiento Médico de CIW"
 TUR_ciw_population_desc: "La CIW está proporcionando a nuestra nación suministros médicos necesarios"
 TUR_ciw_industry: "Ayuda Industrial de CIW"
 TUR_ciw_industry_desc: "The CIW is assisting our nation's industrial sector"
 TUR_heavily_subsidised_agriculture: "Agricultura Fuertemente Subvencionada"
 TUR_heavily_subsidised_agriculture_desc: "Préstamos baratos y combustible y maquinaria subvencionados aseguran un gran sector agrícola pero a un costo para el presupuesto"
 TUR_communal_farms: "Granjas Comunales"
 TUR_communal_farms_desc: "Pequeñas granjas comunales se están estableciendo en todo el país. Esto está atrayendo a las personas a un estilo de vida más sedentario en el campo, al mismo tiempo que aumenta la capacidad de supervivencia de las comunidades locales"
 TUR_educating_revolutionaries: "Educación Revolucionaria"
 TUR_educating_revolutionaries_desc: "La educación incorpora enseñanzas revolucionarias para enseñar a los jóvenes cómo desarrollar mejor Turquía"
 TUR_committees_of_resistance_patrol: "Comités de Resistencia"
