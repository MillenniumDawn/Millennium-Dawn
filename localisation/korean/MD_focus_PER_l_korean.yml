l_korean:
 PER_move_away_from_raw_exports: "원자재 수출에서 멀어져라"
 PER_move_away_from_raw_exports_desc: "나라는 원자재 수출에서 초점을 옮겨, 이러한 원자재를 국내에서 가공하여 더 많은 부가가치 제품을 만들어 내는 산업에 투자해야 합니다."
 PER_trans_levantine_pipelines: "트란스-레반트 파이프라인"
 PER_trans_levantine_pipelines_desc: "트랜스 레반트 송유관을 개발하면 핵심 에너지 회랑이 만들어져 레반트 전역에 석유와 가스를 수송하고 지역 영향력을 확보할 수 있습니다."
 PER_iran_transfo_siemens: "이란 트랜스포 사이멘 에너지사"
 PER_iran_transfo_siemens_desc: "지멘스와의 협력은 이란의 전력 기반시설을 현대화하고 변압기 국내 생산을 촉진하여 장기적인 산업 성장의 토대를 마련할 것입니다."
 PER_expand_industrial_towns_in_qazvin: "카즈빈의 공업중심도시 확장"
 PER_expand_industrial_towns_in_qazvin_desc: "카즈빈은 주요 산업 중심지 역할을 하기에 이상적인 위치에 있습니다. 산업 도시를 확장하면 국내 제조업이 촉진되고 국내외 투자가 유치됩니다."
 PER_extraction_efforts_in_semnan: "Extraction Efforts in Semnan"
 PER_extraction_efforts_in_semnan_desc: "셈난은 귀중한 광물이 풍부합니다. 이 주의 채굴 사업을 확대하면 국가의 자원 기반에 크게 기여하고 수입 의존도를 줄일 수 있습니다."
 PER_rare_metals_of_southern_khorasan: "Rare Metals of Southern Khorasan"
 PER_rare_metals_of_southern_khorasan_desc: "남호라산은 현대 산업에 중요한 희소 금속이 풍부합니다. 이곳의 채굴 노력을 확대하면 우리의 기술 발전에 기여하고 핵심 자원의 안정적인 공급이 가능해집니다."
 PER_khangiran_gas_field: "캉그리안 가스전"
 PER_khangiran_gas_field_desc: "항기란 가스전 개발에 투자하면 천연가스의 안정적인 공급이 보장되어 에너지 안보와 경제 성장이 강화됩니다."
 PER_through_sham: "샴을 통과하자"
 PER_through_sham_desc: "샴(시리아와 그 이웃 지역)을 통해 영향력을 확대하면 무역과 에너지 수송의 새로운 전략적 경로가 만들어져 경제적 이익이 확보되고 지역 동반자 관계가 강화됩니다."
 PER_through_anatoli: "Through Anatolia"
 PER_through_anatoli_desc: "아나톨리아(튀르키예)를 통한 연결을 발전시키면 무역과 에너지 수출의 새로운 회랑이 열려 이란이 유럽 시장과 이어지고 경제적 영향력이 커집니다."
 PER_european_union_energy_agreements: "유럽 연합 에너지 협약"
 PER_european_union_energy_agreements_desc: "유럽 연합과 에너지 협정을 체결하면 우리의 석유와 가스를 위한 새로운 시장이 열리는 동시에 유럽과의 외교 관계도 강화됩니다."
 PER_southern_highways: "남부 고속도로"
 PER_southern_highways_desc: "나라 남부 지역의 고속도로를 개선하면 무역이 원활해지고 주요 산업 지구로의 접근성이 좋아져, 역사적으로 소외되어 온 이 지역에서 경제적 기회가 열릴 것입니다."
 PER_renegotiate_contracts: "계약 재협상"
 PER_renegotiate_contracts_desc: "외국 기업과의 기존 계약을 재검토하고 재협상하여 국가의 경제적 미래에 더 유리하도록 해야 합니다."
 PER_french_total: "프랑스의 토탈엔진"
 PER_french_total_desc: "프랑스 토탈과의 협력은 세계적 수준의 혁신과 투자를 에너지 산업에 가져와 일자리를 창출하고 지속 가능한 성장을 이루도록 도울 것입니다."
 PER_royal_dutch_shell: "로열 더치 쉘"
 PER_royal_dutch_shell_desc: "로열 더치 셸과 협력하면 그들의 첨단 기술과 석유 부문 경험의 혜택을 누려 에너지 생산 능력을 높일 수 있습니다."
 PER_malaysian_petronas: "말레이시아의 페트로나스"
 PER_malaysian_petronas_desc: "말레이시아 페트로나스와의 협력은 특히 천연가스와 석유화학 산업에서 에너지 부문에 새로운 투자 기회를 제공할 것입니다."
 PER_chinese_CNPC: "중국의 중국 석유 천연가스 공사 (CNPC)"
 PER_chinese_CNPC_desc: "중국 CNPC와 협력하면 석유 및 가스 부문에 꼭 필요한 전문 지식과 투자를 가져와 경제 성장과 발전을 촉진할 것입니다."
 PER_gazprom: "가스프롬"
 PER_gazprom_desc: "가스프롬의 참여는 특히 천연가스 부문에서 우리의 에너지 생산과 기반시설을 강화하여 이란의 장기적인 에너지 안보를 보장할 것입니다."
 PER_lukoil: "루크오일"
 PER_lukoil_desc: "루크오일이 이란 에너지 시장에 진출하면 그들의 최첨단 기술과 경험을 접할 수 있어 석유 부문이 강화되고 생산 능력이 확대될 것입니다."
 PER_redirect_funds_to_the_straight: "Redirecting Funds to the Strait"
 PER_redirect_funds_to_the_straight_desc: "호르무즈 해협으로 투자를 돌리면 그 전략적 중요성이 높아지고 우리 기반시설이 핵심 국제 무역로를 뒷받침하도록 보장할 수 있습니다."
 PER_develop_the_deprived_states: "Develop the Deprived States"
 PER_develop_the_deprived_states_desc: "저개발 지역에 집중하여 기반시설, 교육, 의료를 이 지역들이 국가 경제에 의미 있게 기여할 수 있는 수준으로 끌어올리도록 합니다."
 PER_preserve_lake_urmiya: "Preserve Lake Urmia"
 PER_preserve_lake_urmiya_desc: "한때 이 지역의 핵심 자원이었던 우르미아 호수는 줄어들고 있습니다. 호수를 보호하고 되살리면 주변 공동체를 위한 지속 가능한 수자원과 생태적 안정이 보장됩니다."
 PER_regulate_dam_construction_in_the_west: "Check Dam Construction in the West"
 PER_regulate_dam_construction_in_the_west_desc: "이 지역의 물 부족이 심화되고 있으므로 국가 서부 지역의 댐 건설에 대한 더 나은 규정을 마련해야 합니다."
 PER_khaleej_e_fars_tabriz_railway: "Khaleej-e Fars to Tabriz Railway"
 PER_khaleej_e_fars_tabriz_railway_desc: "페르시아만과 타브리즈를 잇는 철도는 남부와 북부 지역 간의 수송과 무역을 크게 개선하여 국가의 기반시설과 경제적 연결성을 강화할 것입니다."
 PER_atomic_projects: "Atomic Projects"
 PER_atomic_projects_desc: "우리나라는 과학의 영역을 넓히기 위해 여러 원자력 프로젝트에 착수합니다. 핵 연구 전담 시설을 개발하고 운영함으로써 우리는 원자력 분야의 선도국으로 자리매김할 수 있습니다."
 PER_increase_power_exports: "전력 수출 증대"
 PER_increase_power_exports_desc: "전력 생산을 늘리면 경제가 강화될 뿐 아니라 지역의 에너지 흐름을 통제하여 국제 협상에서 영향력을 얻을 수 있습니다."
 PER_prepare_for_the_next_century: "Prepare for the Next Century"
 PER_prepare_for_the_next_century_desc: "미래에 성공하려면 지금부터 준비를 시작해야 합니다. 교육, 기술, 기반시설에 투자하면 다음 세기의 도전에 맞설 준비를 갖출 수 있습니다."
 PER_streamline_enterance_process: "Streamline Entrance Exam Process"
 PER_streamline_enterance_process_desc: "현재의 입학시험 제도는 지나치게 복잡하고 제한적입니다. 이 절차를 개혁하면 모든 계층의 재능 있는 개인이 성공할 기회를 얻게 됩니다."
 PER_abolish_konkour: "Abolish the Konkour"
 PER_abolish_konkour_desc: "콘쿠르 시험 제도는 많은 이들에게 교육의 큰 장벽입니다. 이를 폐지하면 더 공평하고 접근하기 쉬운 교육 제도가 가능해집니다."
 PER_purge_konkour_mafia: "Purge the Konkour Mafia"
 PER_purge_konkour_mafia_desc: "콘쿠르 시험은 부패와 남용으로 얼룩졌습니다. 이 '마피아'를 숙청하면 시험 제도가 공정하고 투명해지며 모든 학생의 필요에 부응하게 됩니다."
 PER_black_market_exploits: "암시장 활용"
 PER_black_market_exploits_desc: "전장에서 장비를 약탈하는 것을 좋아하는 이가 또 누구인지 아십니까? 한몫 챙기려는 암시장 상인들입니다! 우리가 수거한 장비가 모두 쓸모 있는 것은 아니므로, 시장 연줄에 팔아 우리 자금을 마련할 수 있습니다."
 PER_reverse_engineering: "역설계"
 PER_reverse_engineering_desc: "외국에서 탈취한 장비에는 우리에게 없는 기술이 담겨 있기 마련이므로, 군사 기술 분야에서 앞서고 최신 수준을 유지하려면 수거한 것을 역설계하여 우리만의 토착 설계를 만들어야 합니다."
 PER_commission_new_projects: "신규 프로젝트 의뢰"
 PER_commission_new_projects_desc: "예비 부품을 확보하는 것도 좋지만, 최신 상태를 유지하려면 여전히 현대 기술이 필요하며, 이를 위해 IRGC 자급자족 지하드 기구에 최첨단 신기술 개발을 의뢰해야 합니다."
 PER_rearm_the_nation: "국가 재무장"
 PER_rearm_the_nation_desc: "갓 포장을 뜯은 새 글록이다! 이 새로운 개량 설계로 막 조립 라인에서 나온 장비를 갖추도록 육군을 재무장시키기 시작할 수 있습니다!"
 PER_zulfiqar_tank_productions: "[ROOT.PER_tank_localization_name]"
 PER_zulfiqar_tank_productions_desc: "[ROOT.PER_tank_localization_desc]"
 PER_karrar_productions: "Production of the Karrar Tank"
 PER_karrar_productions_desc: "카라르는 이란의 3세대 주력 전차입니다. 2016년에 처음 공개된 이 전차는 전자광학 사격 통제 체계, 레이저 거리 측정기, 탄도 계산기를 갖추고 있으며 주야간 정지 표적과 이동 표적 모두를 사격할 수 있습니다. 상당히 진보한 전차이므로 즉시 생산에 들어가는 것이 현명할 것입니다!"
 PER_naze_at_rockets_in_tabriz: "타브리즈의 나제앗 로켓"
 PER_naze_at_rockets_in_tabriz_desc: "나제아트는 사거리 약 100km의 이란 장거리 포병 로켓입니다. 완전한 나제아트 체계에는 이동식 발사대(TEL)와 통신 차량, 기상 관측 차량, 발사 지점 측량용 GPS 체계가 포함됩니다. 이 로켓은 이동식 기립 발사대에서 발사하도록 설계되었으며, 테헤란 방어에 훌륭하게 쓰일 것입니다!"
 PER_repair_old_ch_c: "Toufan Helicopter"
 PER_repair_old_ch_c_desc: "투판 헬리콥터는 노후했지만 우리 무기고에서 여전히 효과적인 자산입니다. 쓸모를 유지하여 계속 우리의 방어 작전에 쓰이게 하려면 수리와 개량이 필수적입니다."
 PER_jask_base: "자스크 기지"
 PER_jask_base_desc: "자스크 마을에 위치한 반다르에자스크 항구는 오만만 쪽 호르무즈 해협 동쪽에 전략적으로 자리하고 있습니다. 이곳은 호르무즈의 요충지 바깥에 있는 몇 안 되는 우리 해군 기지 중 하나이며, 해협의 통제권을 잃을 경우를 대비해 중요합니다. 따라서 페르시아만 안팎과 그 주변에서 우리의 해상 우위를 확보하기 위해 이곳을 개발해야 합니다."
 PER_damavand_two_effect_tt: "Create the §HMoudge Class Frigate§!.\nDeploys §HIRIS Damavand 2§! in the §HCaspian Sea§!."
 PER_AIO: "항공우주산업기관 (AIO)"
 PER_AIO_desc: "항공우주산업기구(AIO)는 이란 국방부 산하 기관으로, 테헤란에 본부를 둔 선도적인 첨단 기술 복합체입니다. 이란 우주 자산의 개발과 생산에서 핵심적인 역할을 하며 산하에 여러 연구 센터와 공장을 거느리고 있습니다. 특히 샤하브 탄도 미사일이 이 기구가 생산하는 제품 중 하나입니다."
 PER_IBRC: "이란 바이오자원센터 (IBRC)"
 PER_royan_research_institute: "로얀 연구 기관"
 PER_royan_research_institute_desc: "최첨단 시설을 갖춘 로얀 연구소는 이란의 과학 발전을 향한 선봉에 설 것입니다."
 PER_police_e_rahvar: "Polis-e RAHVAR"
 PER_police_e_rahvar_desc: "라흐바르 경찰은 이슬람 공화국의 도덕 및 치안 부대로, 질서를 유지하고 법을 집행하는 임무를 맡고 있습니다. 이들의 사명은 이슬람 원칙이 국가 내 모든 행동을 이끌도록 하여 혁명의 신앙과 가치를 지키는 것입니다."
 PER_VAJA: "이란 정보부 (VAJA)"
 PER_VAJA_desc: "이란 이슬람 공화국 정보부는 이란 이슬람 공화국의 주요 정보기관이자 이란 정보 공동체의 일원입니다. VAJA로도 알려져 있으며, 이전에는 VEVAK이라고 불렸습니다."
 PER_information_and_security_university: "정보 보안 대학"
 PER_information_and_security_university_desc: "우리는 오랫동안 VAJA를 운영해 왔지만 요원을 훈련시킬 학교는 없었으며, (삭제됨)과 (삭제됨)에 전적으로 의존해 요원을 찾아야 했습니다. 하지만 우리가 직접 학교를 세워 아무도 그 존재를 모르도록 철저히 숨길 수도 있습니다!"
 PER_sepah_imam_zaman: "이맘 자만 (Imam Zaman) 스파이 부대"
 PER_sepah_imam_zaman_desc: "이맘 자만 군단, 즉 세파(군단이라는 뜻)는 전복 공작, 정보 수집, 침투 기술을 훈련받은 우리 기관의 신설 정예 부대입니다. 들키는 것만 빼면 첩보와 관련된 거의 모든 일을 해낼 수 있습니다!"
 PER_sepah_cyberi: "사이버 부대"
 PER_sepah_cyberi_desc: "전통적인 정보 수집도 매우 중요하지만, 기술이 더욱 두드러지고 모든 기밀 문서가 디지털로 보관되는 세상에서는 우리의 은밀한 비밀을 지킬 자체 해커 집단을 키우는 것이 현명할 것입니다."
 PER_overseas_issues: "해외 문제"
 PER_overseas_issues_desc: "이스라엘이 저쪽에서 무엇을 하는지 알고 싶지 않으십니까? 우리도 알고 싶습니다. 특히 자신과 관련된 일이라면 남의 사정을 아는 것이 늘 좋습니다!"
 PER_hack_rafael_company: "Hack Rafael Company"
 PER_hack_rafael_company_desc: "라파엘 첨단 방위 시스템사는 이스라엘의 방위 기술 기업입니다. 이 회사는 우리의 샤하브-2와 샤하브-3를 충분히 요격할 수 있는 미사일 방어 체계 '다윗의 돌팔매' 등 지구상에서 가장 진보한 군사 기술들을 만들어 냈습니다. 이 회사가 무엇을 개발하고 있는지 알아내야 하며, 어쩌면 우리 것으로 만들 수도 있습니다!"
 PER_hack_traffic_system: "Hack Traffic Systems"
 PER_hack_traffic_system_desc: "이스라엘은 전국을 아우르는 도로망에 매우 발달한 교통 체계를 갖추고 있습니다. 교통 카메라를 통해 우리 병력의 위치가 노출된다면 전술적으로 매우 불리하지만, 반대로 우리가 그 체계를 통제한다면 유리해집니다."
 PER_imam_alis_riot_police: "이맘 알리 (Imam Ali) 기동대"
 PER_imam_alis_riot_police_desc: "이맘 알리 부대는 FARAJA 특수부대 사령부의 일부이며, 이란 이슬람 공화국 법 집행 사령부의 하위 부서로서 특수 병력을 담당합니다."
 PER_nopo: "대태러특수부대 (NOPO)"
 PER_nopo_desc: "공식적으로 대테러 특수부대를 뜻하는 NOPO는 이란 이슬람 공화국 법 집행군 특수부대 사령부 소속의 이란 특수 부대입니다."
 PER_irgc_ground_forces: "이슬람 혁명 수비대 육군"
 PER_irgc_ground_forces_desc: "NEZSA로 줄여 부르는 이슬람 혁명수비대 지상군은 이슬람 혁명수비대(IRGC)가 이란 정규군과 별도로 유지하는 지상군입니다. 재래식 군사 임무 외에도 혁명수비대 지상군은 정규군보다 내부 소요 대응에 더 중점을 두고 있습니다."
 PER_irgc_drone_command: "이슬람 혁명 수비대 드론 사령부"
 PER_irgc_drone_command_desc: "현재 우리는 무인 항공 능력을 확장하기 위한 드론 작전용 지휘 통제망을 갖추고 있으며, 모두 IRGC 공군의 통제 아래 있습니다!"
 PER_diplomatic_training: "외교적 훈련"
 PER_diplomatic_training_desc: "우리의 대외 작전은 단순히 외국 땅에서 전쟁을 치르는 것에서, 평시에도 외국 땅에서 활동하는 것으로 확장되었습니다. IRGC는 이제 무엇보다 개입 부대에 가까워졌으니 그렇게 하게 두십시오! 다만 그들은 다른 이들이 받아들이게 설득하는 데 매우 능숙해야 할 것입니다."
 PER_saberin_special_forces_divison: "세르비아 특수부대 사단"
 PER_saberin_special_forces_divison_desc: "§R'너희 중에 사베린이 스무 명 있다면 이백 명을 이길 것이요, 사베린이 백 명 있다면 불신자 천 명을 이길 것이다'§!\n\n사베린 타카바르 여단, 일명 사베린 부대는 이슬람 혁명수비대 지상군의 정예 부대입니다. 국내는 물론 특히 인접국에서의 해외 작전에서 수십 년간 군사 및 전투 경험을 쌓은, 이란군 최고의 부대 중 하나로 평가받습니다."
 PER_irgc_marines: "이슬람 혁명 수비대 해병대"
 PER_irgc_marines_desc: "세파 해군 특수부대(S.N.S.F.)라고도 알려진 NEDSA 특수부대는 페르시아만 그레이터 파루르 섬에 주둔한 이슬람 혁명수비대(IRGC) 해군 소속 타카바르 부대입니다. 이 부대에는 헬리콥터 강습, 상륙전, 선박 임검에 특화된 해병, 잠수 요원, 저격수가 있습니다."
 PER_the_road_to_jerusalem: "예루살렘으로 향하는 길"
 PER_the_road_to_jerusalem_desc: "예루살렘에 이르기 위해 닦아야 할 길은 멀지만 우리는 해낼 것이며, 한 걸음 한 걸음씩 팔레스타인의 무슬림들을 해방할 것입니다!"
 PER_irgc_aerospace_force: "이슬람 혁명 수비대 우주군"
 PER_irgc_aerospace_force_desc: "이슬람 혁명수비대 항공우주군(IRGCASF)은 IRGC 내의 전략 미사일, 항공, 우주 부대입니다. 2009년 IRGC 공군에서 IRGC 항공우주군으로 명칭이 바뀌었습니다."
 PER_control_lebanese_defense: "레바논 방어 통제"
 PER_control_lebanese_defense_desc: "우리가 외세에 맞서 레바논의 주된 수호자가 되면, 레바논 정부의 저항 없이 마침내 레바논을 헤즈볼라의 깃발 아래 통일하여 더 강력한 시아파 국가를 세울 수 있습니다!"
 PER_agitate_shias_in_bahrain: "Bahraini Shi'ites"
 PER_agitate_shias_in_bahrain_desc: "바레인에는 수니파가 지배하는 정부 아래 억눌린 수십만 명의 시아파가 남아 있습니다. 이들을 우리의 깃발 아래 다시 규합할 계획을 구상할 때가 되었습니다."
 PER_israel_etelaat_base: "[ISR.GetFlag] Israel\nEtela'at Base"
 PER_israel_etelaat_base_desc: "이스라엘 내에 우리만의 언론 매체를 두면 우리와 사상이 같은 인물들을 찾는 데 유용할 것이며, 어쩌면 이런 방식으로 외국인 모집책도 찾을 수 있을 것입니다!"
 PER_turkey_etelaat_base: "[TUR.GetFlag] Turkey\nEtela'at Base"
 PER_turkey_etelaat_base_desc: "튀르키예 내에 우리만의 언론 매체를 두면 우리와 사상이 같은 인물들을 찾는 데 유용할 것이며, 어쩌면 이런 방식으로 외국인 모집책도 찾을 수 있을 것입니다!"
 PER_azerbayjan_etelaat_base: "[AZE.GetFlag] Azerbaijan\nEtela'at Base"
 PER_azerbayjan_etelaat_base_desc: "아제르바이잔 내에 우리만의 언론 매체를 두면 우리와 사상이 같은 인물들을 찾는 데 유용할 것이며, 어쩌면 이런 방식으로 외국인 모집책도 찾을 수 있을 것입니다!"
 PER_arabia_etelaat_base: "[SAU.GetFlag] Arabia\nEtela'at Base"
 PER_arabia_etelaat_base_desc: "사우디아라비아 내에 우리만의 언론 매체를 두면 우리와 사상이 같은 인물들을 찾는 데 유용할 것이며, 어쩌면 이런 방식으로 외국인 모집책도 찾을 수 있을 것입니다!"
 PER_agents_of_hezbollah: "헤즈볼라의 요원"
 PER_agents_of_hezbollah_desc: "우리 매체 덕분에 이스라엘 정부로부터 조국을 해방하고자 안달이 난 여러 팔레스타인인들을 찾아냈습니다! 우리는 이들을 헤즈볼라와 협력하여 일하도록 배치했습니다."
 PER_islamic_resistance_of_the_najba: "나자바의 이슬람 저항군"
 PER_islamic_resistance_of_the_najba_desc: "고귀한 이슬람 저항 조직은 우리 매체의 보도에 이끌린 지원자들로 결성한, 반튀르키예 저항 단체입니다. 우리는 이들을 이용해 동맹국 영토에 주둔한 튀르키예군을 약화시킬 것입니다!"
 PER_islamic_resistance_of_the_najba_effect: "시리아, 이라크, 그리고 쿠르디스탄의 §Y[TUR.GetFlag] 터키§! 사단에 피해를 줍니다."
 PER_elham_ali_f_under_sight: "일함 알리예프 감시"
 PER_elham_ali_f_under_sight_desc: "권위주의와 시온주의로 악명 높은 아제르바이잔 정치인 일함 알리예프가 우리의 조준선 안에 들어왔습니다. 우리가 원하는 바로 그 거리입니다."
 PER_under_israel_skin: "이스라엘의 피부 아래"
 PER_under_israel_skin_desc: "팔레스타인인들이여, 이스라엘에 맞서 단결하라! 그들의 정부에 침투하도록 우리를 도우라!"
 PER_under_turkey_skin: "터키의 피부 아래"
 PER_under_turkey_skin_desc: "알레비파여, 튀르키예에 맞서 단결하라! 그들의 정부에 침투하도록 우리를 도우라!"
 PER_under_baku_skin: "아제르바이잔의 피부 아래"
 PER_under_baku_skin_desc: "독실한 아제르바이잔인들이여, 아제르바이잔에 맞서 단결하라! 그들의 정부에 침투하도록 우리를 도우라!"
 PER_blow_nahariya_weapone_storage: "나하리야 무기 저장소 폭발"
 PER_nahariya_sabotage_tt: "§Y나하리야 무기 저장소 폭발§! 임무를 활성화합니다.\n(§Y군 침투§! 필요)"
 PER_blow_turkey_iraqi_base: "터키-이라크 기지 폭발"
 PER_blow_turkey_iraqi_base_desc: "폭파할 시간일까요? 폭파할 시간인 것 같습니다!"
 PER_turkey_iraqi_base_tt: "§Y터키-이라크 기지 폭발§! 임무를 활겅화합니다.\n(§Y군 침투§! 필요)"
 PER_blow_baku_gas_canals: "바쿠 가스관 폭발"
 PER_blow_baku_gas_canals_desc: "가스가 없으면 돈을 벌 수 없습니다. 가스와 석유 수출에 의존하는 나라라면 더욱 그렇습니다!"
 blow_baku_gas_canals_tt: "§Y바쿠 가스관 폭발§! 임무를 활성화합니다.\n(§Y민간 침투§! 필요)"
 PER_sepah_in_arabistan: "아라비스탄의 세파"
 PER_sepah_in_arabistan_desc: "사우디아라비아에 발판을 마련할 수 있게 되었으니, 이제 혁명수비대를 보내 카티프에서 비밀 활동을 벌일 수 있습니다!"
 PER_under_arab_countries_skin: "아라비아의 피부 아래"
 PER_under_arab_countries_skin_desc: "아라비아의 시아파여, 사우디에 맞서 단결하라! 그들의 정부에 침투하도록 우리를 도우라!"
 PER_aramco_underfire: "불길에 휩싸인 아람코 "
 PER_aramco_underfire_desc: "모든 수입의 원천인 사우디아라비아의 최대 석유 회사... 이 회사가 연기와 함께 사라진다면 어떻게 될 것 같습니까?"
 PER_aramco_sabotage_tt: "§Y아람코 사보타주§! 임무를 활성화합니다.\n(§Y민간 침투§! 필요)"
 PER_domestic_issues: "국내 문제"
 PER_domestic_issues_desc: "대외 문제도 중요하지만, 반정부 세력이 없는 안정된 국내 사정을 확보하는 것도 그에 못지않게 중요합니다!"
 PER_tabriz_etelaat_base: "Tabriz Etela'at Base"
 PER_tabriz_etelaat_base_desc: "타브리즈는 독립하여 자기들만의 국가를 세우려고 안달이 나 외국 정부의 지원을 은밀히 구하는 여러 대규모 소수 민족 집단의 본거지입니다. 이들을 파괴해야 합니다!"
 PER_tehran_etelaat_base: "Tehran Etela'at Base"
 PER_tehran_etelaat_base_desc: "수도의 주민들이 우리의 이상과 일치하도록 하는 것은, 주민들에게 외국 스파이를 식별하는 법을 가르칠 수 있는 언론 매체를 세울 만큼 중요한 일입니다!"
 iran_focus: "Iranian Focus Tree"
 PER_vezarate_jahade_keshavarzi: "[ROOT.PER_vezarate_jahade_keshavarzi_name]"
 PER_vezarate_jahade_keshavarzi_desc: "[ROOT.PER_vezarate_jahade_keshavarzi_name_desc]"
 PER_ICM: "이란 합동 제조 기업"
 PER_ICM_desc: "이란 콤바인 제조 회사는 아라크에 위치한 중동 최대의 콤바인 제조업체입니다."
 PER_economic_support_for_farmers: "농부들을 향한 경제적 지원"
 PER_economic_support_for_farmers_desc: "우리 농민들은 계속 버티기 위해 정부의 지원이 절실히 필요하며, 우리가 그것을 제공할 것입니다."
 PER_encourage_wheat_production: "밀 생산 장려"
 PER_encourage_wheat_production_desc: "우리 국민이 굶주려서는 안 되며, 따라서 밀 생산을 더욱 장려해야 합니다."
 PER_guaranteed_purchase_agreements: "구입 보장 협정"
 PER_guaranteed_purchase_agreements_desc: ""
 PER_al_abbas_brigade: "알아바스 여단"
 PER_al_abbas_brigade_desc: "아부 알파들 알아바스 여단은 시리아 전역에서 활동하는 친정부 열두 이맘파 시아 무슬림 무장 단체입니다. 이름은 이맘 알리의 아들 알아바스 이븐 알리의 별칭에서 따왔습니다."
 PER_coup_against_saddam_TT: "The percentage of chances below varies greatly on the following factors:\n§Y- Iranian influence in Iraq§!\n§Y- Iraqi domestic influence§!\n§Y- Emerging outlook popularity in Iraq§!"
 PER_iraq_coup: "§Y[IRQ.Mod_Vilayat_e_Faqih_L]§! will launch a §Ysuccessful coup§!."
 PER_iraq_civilwar: "§Y[IRQ.Vilayat_e_Faqih_L]§! will launch a §RCivil War§!."
 PER_hashd_al_shaabi: "시민동원군"
 PER_support_shah_massoud: "마수드 왕 지원"
 PER_support_shah_massoud_desc: "샤 마수드는 아프가니스탄을 안정된 깃발 아래 재통합할 수 있는 유일한 인물이며, 우리는 그와 그의 북부동맹을 지원해야 합니다."
 PER_imam_khomeini_relief_foundation: "이맘 호메이니 구호 재단"
 PER_imam_khomeini_relief_foundation_desc: "이맘 호메이니 구호재단은 지금 우리 문 앞에 몰려든 수천 명의 실향민에게 인도적 지원을 제공할 만큼 규모가 큽니다."
 PER_ansar_allah: "안사르-알라"
 PER_ansar_allah_desc: "후티라고도 알려진 안사르 알라는 우리나라가 아라비아 반도를 곧장 가로질러 손을 뻗을 수 있게 해 줄 것입니다. 이런 기회는 놓칠 수 없습니다."
 PER_lebanon_trigger_TT: "[LEB.GetFlag] §Y레바논§! (또는 [HEZ.GetFlag] §Y헤즈볼라§!)는 §Y평화 상태§!이며, §Y우리 동맹§!이고, 우리는 그들에게 §Y70%의 영향력§!을 보유하고 있습니다.\n\n"
 PER_yemen_trigger_TT: "[YEM.GetFlag]§Y예멘§! (또는 [HOU.GetFlag] §Y후티§!)는 §Y평화 상태§!이며, §Y우리 동맹§!이고, 우리는 그들에게 §Y70%의 영향력§!을 보유하고 있습니다.\n\n"
 PER_syria_trigger_TT: "[SYR.GetFlag]§Y시리아§!는 §Y평화 상태§!이며, §Y우리 동맹§!이고, 우리는 그들에게 §Y70%의 영향력§!을 보유하고 있습니다.\n\n"
