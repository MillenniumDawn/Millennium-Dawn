 ISR_operation_failed_root_terr_tt: "작전이 §R실패§!하면 그 결과는 심각하고 §R예측할 수 없을§! 것입니다."
 israel.82.t: "예수 탄생 교회 접근"
 israel.82.d: "무장 세력이 예수 탄생 교회 안으로 피신하여 내부에서 공격을 가하고 있습니다. 우리 병력은 배치를 마쳤습니다. 어떻게 진행하시겠습니까?"
 israel.82.a: "건물을 급습하여 소탕하라."
 israel.82.b: "내부에 있는 자들의 평화적 퇴거를 협상하라."
 israel.82.c: "교회의 신성함을 존중하라."
 israel.83.t: "급습 성공!"
 israel.83.d: "[ROOT.GetNameWithFlag]의 병력이 예수 탄생 교회에 진입하여 무장 세력을 소탕했으며, 그곳에 피신해 있던 무장 전투원 50여 명을 사살했습니다."
 israel.83.a: "훌륭해!"
 israel.84.t: "급습 실패!"
 israel.84.d: "[ROOT.GetNameWithFlag]의 병력은 급습을 시도하던 중 매복 공격을 받았습니다. 모든 무장 세력이 혼란을 틈타 예수 탄생 교회에서 탈출했습니다."
 israel.84.a: "뼈아픈 손실이다."
 storm_res_tt: "§Y25일§! 후에 §Y급습 작전의 결과§!를 알려 주는 §Y사건§!이 발생합니다. 작전은 §R실패§!할 수도 있고 §R성공할§! 수도 있습니다!\n\n이 선택지는 훨씬 위험하지만, 성공할 경우 더 큰 결과를 얻습니다!"
 oper_def_shiel_tt: "[ISR.GetNameWithFlag]는 §Y서안 지구§!에서 §R테러범§!을 뿌리 뽑기 위해 §Y방어 방패§! 작전을 개시합니다!"
 oper_city_wall_tt: "[PAL.GetNameWithFlag]는 §Y서안 지구§!에서 §R테러범§!을 뿌리 뽑기 위해 §Y도시 성벽§! 작전을 개시합니다!"
 israel.85.t: "나블루스 카스바 해체"
 israel.85.d: "이제 나블루스의 카스바를 장악했으므로, 이곳을 어떤 용도로 쓸지 결정할 수 있습니다. 어떻게 하시겠습니까?"
 israel.85.a: "보안군 기지로 전환하라."
 israel.85.b: "전통적인 시장이 되도록 두라."
 israel.85.c: "임시 사령부로 전환하라."
 israel.85.e: "아라파트의 부하들에게 넘겨주라."
