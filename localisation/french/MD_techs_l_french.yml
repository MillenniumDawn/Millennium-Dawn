 module_anti_submarine_missile_1: "Missile Anti-Sous-Marin I"
 module_anti_submarine_missile_1_desc: "Les premiers systèmes de missiles anti-sous-marins permettent aux navires d'engager les sous-marins à distance de sécurité, améliorant la défense sous-marine de la flotte au-delà des grenades sous-marines traditionnelles.\n\n§GIndice du concepteur : ce module augmente les statistiques de lutte anti-sous-marine, au prix d'un coût de CI accru.§!"
 module_anti_submarine_missile_2: "Missile Anti-Sous-Marin II"
 module_anti_submarine_missile_2_desc: "Les missiles ASM améliorés disposent d'un guidage et d'une propulsion renforcés, augmentant la probabilité de toucher et étendant la portée d'engagement contre les sous-marins modernes.\n\n§GIndice du concepteur : ce module augmente les statistiques de lutte anti-sous-marine, au prix d'un coût de CI accru.§!"
 module_anti_submarine_missile_3: "Missile Anti-Sous-Marin III"
 module_anti_submarine_missile_3_desc: "Les systèmes de missiles ASM modernes intègrent un ciblage avancé et des vitesses plus élevées, permettant une interception fiable de sous-marins évasifs ou furtifs.\n\n§GIndice du concepteur : ce module augmente les statistiques de lutte anti-sous-marine, au prix d'un coût de CI accru.§!"
 module_anti_submarine_missile_4: "Missile Anti-Sous-Marin IV"
 module_anti_submarine_missile_4_desc: "Les missiles ASM très avancés utilisent des capteurs sophistiqués, des contre-contre-mesures et une portée étendue, offrant une neutralisation supérieure des menaces sous-marines.\n\n§GIndice du concepteur : ce module augmente les statistiques de lutte anti-sous-marine, au prix d'un coût de CI accru.§!"
 module_anti_submarine_missile_5: "Missile Anti-Sous-Marin V"
 module_anti_submarine_missile_5_desc: "Les missiles ASM de nouvelle génération mettent l'accent sur la furtivité, le guidage assisté par l'intelligence et une portée extrême, permettant une interdiction efficace des sous-marins sur de vastes zones opérationnelles.\n\n§GIndice du concepteur : ce module augmente les statistiques de lutte anti-sous-marine, au prix d'un coût de CI accru.§!"
 module_anti_submarine_missile_6: "Missile Anti-Sous-Marin VI"
 module_anti_submarine_missile_6_desc: "Les missiles ASM du futur proche représentent le pinacle de la lutte anti-sous-marine, combinant guidage IA, haute vitesse et systèmes robustes de contre-contre-mesures.\n\n§GIndice du concepteur : ce module augmente les statistiques de lutte anti-sous-marine, au prix d'un coût de CI accru.§!"
