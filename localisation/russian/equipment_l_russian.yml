 CRM_util_vehicle_8: "КАЗ «Дрозд-Б»"
 CRM_util_vehicle_8_desc: "После успешной презентации на выставке «Армия-2020» амфибийный бронеавтомобиль «Дрозд» был отправлен на испытания, которые показали слабую защищённость этой машины. В результате появилась модификация «Дрозд-Б». Современный бронеавтомобиль способен преодолевать речные преграды и бездорожье, а также обладает низкой тепловой заметностью. Рациональная V-образная форма днища, выполненного из композитной брони, обеспечивает повышенную защиту от мин."
