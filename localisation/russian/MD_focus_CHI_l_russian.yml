 CHI_semiconductor_backwardness_1: "Technological Dependence"
 CHI_semiconductor_backwardness_1_desc: "Китайская полупроводниковая отрасль по-прежнему структурно зависит от зарубежных фабрик, программного обеспечения для проектирования и производственного оборудования. Отечественные фабрики отстают от передовых технологий на два-три поколения, проектным компаниям не хватает отлаженных инструментальных средств EDA, а ни одна отечественная компания-производитель оборудования не способна поставлять оборудование для передовой литографии. Этот разрыв сдерживает строительство отечественных заводов по производству микросхем и объемы производства фабрик, а также ограничивает цепочку поставок как гражданской, так и военной электроники. Прогресс, достигаемый в рамках отрасли полупроводниковой промышленности, шаг за шагом снижает эту зависимость."
