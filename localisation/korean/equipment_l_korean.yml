 USA_IFV_5_desc: "이라크 전쟁 이후, 육군은 M2 브래들리가 전투 중에 급하게 추가된 장갑과 전자 장비의 추가로 인해 줄어든 공간, 무게, 동력, 그리고 냉각 능력을 다시 획득하기 위해 공학적인 변경 제안(ECPs)을 연구하기 시작했습니다. ECP1은 이동성을 회복하고 차량이 더 많은 무게를 감당할 수 있도록 하기 위해 작용될 것입니다."
