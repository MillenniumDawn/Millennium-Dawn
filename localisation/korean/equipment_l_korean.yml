 POL_attack_helicopter_1_desc: "소련의 Mi-1 헬리콥터를 발전시켜 WSK PZL-시비드니크에서 면허 생산한 폴란드의 경량 다목적 헬리콥터입니다."
 POL_attack_helicopter_2: "Mi-24D"
 POL_attack_helicopter_2_short: "Mi-24D"
