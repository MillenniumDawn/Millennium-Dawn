sas_training_ast: "SAS Training"
nhmrc_grants: "NHMRC Grants"
nhmrc_grants_desc: "The National Health and Medical Research Council is our leading edge medical research agency. Our health standards are dependent on the research they can deliver. Supplementing them with some short term grants could yield some promising results for the industry."
encourage_electrical_vehicles_ast: "Encourage Electric Vehicles"
encourage_electrical_vehicles_ast_desc: "Laying the foundation for hybrid and lower-emission vehicle manufacturing is important work if we want to ensure the future we're striving towards is feasible. It'll also help if we want to obtain some short term fuel rationing."
launch_worker_safety_courses_ast: "Launch Worker Safety Courses"
launch_worker_safety_courses_ast_desc: "We've been working on a range of new training videos to played for those undergoing their White Card course, making visual learning a mandatory part of the course, and hopefully encouraging young tradies to take less risks."
collaborate_with_foodbanks: "Collaborate With Foodbanks"
collaborate_with_foodbanks_desc: "Collaborating with organisations like SecondBite is going to take a load off our welfare costs and recipients."
