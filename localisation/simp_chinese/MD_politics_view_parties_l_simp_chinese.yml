 SHB.Caliphate_desc: ""
 SHB.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small 伊斯兰法院联盟"
 SHB.Neutral_Muslim_Brotherhood_desc: "伊斯兰法院联盟成立于21世纪初，其前身是由氏族首领、商人和宗教人士在索马里共和国崩溃后建立的地方伊斯兰教法法院网络，旨在恢复摩加迪沙的基本法律和秩序。这些法院在减少犯罪和混乱方面卓有成效。随后，这些法院逐渐联合起来，发展成为一场更广泛的政治运动。"
