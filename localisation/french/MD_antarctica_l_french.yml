 MD_antarctica_news.1.t: "[FROM.GetName] demande à rejoindre le Traité sur l'Antarctique"
 MD_antarctica_news.1.d: "[FROM.GetName] a postulé pour rejoindre le Traité sur l'Antarctique, signalant un éventuel changement de politique étrangère et d'engagement envers la conservation de l'environnement. Le Traité sur l'Antarctique est un accord international qui réglemente l'usage de l'Antarctique à des fins pacifiques et de recherche scientifique, tout en protégeant l'écosystème unique du continent. La candidature de [FROM.GetName] a été accueillie par des réactions chaleureuses de la communauté internationale, certains saluant le geste comme un pas positif vers la coopération mondiale, d'autres exprimant un scepticisme sur les intentions de [FROM.GetName] et son engagement envers les principes du traité. Le processus de candidature prendra un mois."
 MD_antarctica_news.1.a: "Le temps dira"
 MD_antarctica_news.1.b: "Il était temps"
 MD_antarctica_news.2.t: "[FROM.GetName] Adhère au Traité sur l'Antarctique"
 MD_antarctica_news.2.d: "Aujourd'hui, le [GetDateText], [FROM.GetName] a officiellement rejoint le Traité sur l'Antarctique, devenant membre de l'accord international qui réglemente l'usage de l'Antarctique à des fins pacifiques et de recherche scientifique. En rejoignant le traité, [FROM.GetName] s'est engagé à défendre les principes de conservation de l'environnement et de coopération internationale en Antarctique. Ce geste a été accueilli positivement par la communauté mondiale, beaucoup saluant l'engagement de [FROM.GetName] à protéger l'écosystème unique de l'Antarctique et à promouvoir une collaboration pacifique entre nations."
 MD_antarctica_news.2.a: "Un autre membre"
 MD_antarctica_news.2.b: "Mettons-nous au travail !"
 MD_antarctica_news.3.t: "[FROM.GetName] cherche à quitter le Traité sur l'Antarctique"
 MD_antarctica_news.3.d: "[FROM.GetName] a décidé aujourd'hui de quitter le Traité sur l'Antarctique. La Commission pour la conservation de la faune et la flore marines de l'Antarctique (CCAMLR) leur donne 2 ans pour démanteler toute station de recherche qu'ils possèdent en Antarctique et éviter toute activité interdite, telle que l'exploitation des ressources ou une présence militaire. La décision de quitter le traité a reçu des réactions mitigées de la communauté internationale, certains exprimant déception et inquiétude quant aux conséquences potentielles pour l'environnement et la coopération mondiale, d'autres soutenant le droit de [FROM.GetName] de décider de son implication dans les accords internationaux. Le processus de sortie prendra 2 ans."
 MD_antarctica_news.3.a: "Quelle honte"
 MD_antarctica_news.3.b: "Nous avons mieux à faire"
 MD_antarctica_news.4.t: "[FROM.GetName] Quitte le Traité sur l'Antarctique"
 MD_antarctica_news.4.d: "[MD_antarctica_news_4_desc]"
 MD_antarctica_news.4.a: "Le traité est affaibli"
 MD_antarctica_news.4.b: "Quoi qu'il en soit"
 MD_antarctica_news_4_desc_1: "Deux ans après avoir entrepris de quitter le Traité sur l'Antarctique, [FROM.GetName] a officiellement quitté l'accord international qui réglemente l'usage de l'Antarctique à des fins pacifiques et de recherche scientifique. Malgré les avertissements, [FROM.GetName] a quitté le traité tout en possédant une station de recherche en Antarctique, ce qui a provoqué une réaction mondiale des membres du traité, y compris d'éventuelles sanctions et un contrecoup diplomatique."
 MD_antarctica_news_4_desc_2: "Deux ans après avoir entrepris de quitter le Traité sur l'Antarctique, [FROM.GetName] a officiellement quitté l'accord international qui réglemente l'usage de l'Antarctique à des fins pacifiques et de recherche scientifique. [FROM.GetName] a réussi à démanteler toute station de recherche en Antarctique et à éviter les activités interdites, telles que l'exploitation des ressources ou une présence militaire, ce qui a contribué à atténuer les conséquences potentielles pour l'environnement et la coopération mondiale."
 MD_antarctica_news.5.t: "Services publics en circuit ouvert détectés dans la station antarctique [FROM.GetAdjective]"
 MD_antarctica_news.5.d: "Lors de la récente mission d'observateurs, les observateurs du traité ont détecté l'usage d'utilités en boucle ouverte dans l'une des stations de recherche antarctiques [FROM.GetAdjective]. C'est une violation du Traité sur l'Antarctique, qui interdit toute activité susceptible de nuire à l'environnement ou de perturber l'écosystème de l'Antarctique. La détection d'utilités en boucle ouverte a suscité des inquiétudes parmi les membres du traité et peut entraîner des conséquences diplomatiques."
 MD_antarctica_news.5.a: "Certains doivent faire au moins cher"
 MD_antarctica_news.5.b: "Bien"
 MD_antarctica_news.6.t: "Activités illégales de laboratoire détectées dans la station antarctique [FROM.GetAdjective]"
 MD_antarctica_news.6.d: "Lors de la récente mission d'observateurs, les observateurs du traité ont détecté des activités de laboratoire illégales dans l'une des stations de recherche antarctiques [FROM.GetAdjective]. Ce comportement est inacceptable et une violation claire du Traité sur l'Antarctique. Les Parties consultatives du traité traiteront cette question et prendront les mesures appropriées pour assurer la protection de l'écosystème unique de l'Antarctique et l'intégrité du traité."
 MD_antarctica_news.6.a: "C'est inacceptable"
 MD_antarctica_news.6.b: "Il faut faire quelque chose"
 MD_antarctica_news.7.t: "Recherche d'armes nucléaires détectée dans la station antarctique [FROM.GetAdjective]"
 MD_antarctica_news.7.d: "Lors de la récente mission d'observateurs, les observateurs du traité ont détecté une recherche d'armes nucléaires dans l'une des stations de recherche antarctiques [FROM.GetAdjective]. C'est une grave violation du Traité sur l'Antarctique, qui interdit toute activité militaire ou toute activité susceptible de nuire à l'environnement ou de perturber l'écosystème de l'Antarctique. Utiliser une station de recherche pacifique pour la construction et les essais d'armes nucléaires est un acte scandaleux qui menace la sécurité du monde entier. Les Parties consultatives du traité prendront des mesures immédiates et décisives pour traiter cette question et tenir les responsables pour comptables. La communauté internationale doit s'unir pour condamner ce comportement et veiller à ce que l'Antarctique reste un environnement pacifique et protégé pour la recherche scientifique et la coopération."
 MD_antarctica_news.7.a: "C'est scandaleux !"
 MD_antarctica_news.7.b: "C'était plus important"
 MD_antarctica_news.8.t: "[FROM.GetName] a trop souvent violé le Traité sur l'Antarctique"
 MD_antarctica_news.8.d: "Après de multiples violations du Traité sur l'Antarctique, [FROM.GetName] a atteint un point critique où les Parties consultatives du traité ont décidé de les en retirer et d'imposer de graves conséquences diplomatiques. Les violations répétées des principes et règlements du traité ont miné l'intégrité de l'accord et menacé la protection de l'écosystème unique de l'Antarctique. Les Parties consultatives du traité agiront de façon décisive pour que [FROM.GetName] rende des comptes et que le Traité sur l'Antarctique demeure un cadre fort et efficace de coopération internationale et de conservation de l'environnement."
 MD_antarctica_news.8.a: "Ils n'auront que ce qu'ils méritent"
 MD_antarctica_news.8.b: "C'en est trop"
 MD_antarctica_news.9.t: "Des vents violents sur l’Antarctique"
 MD_antarctica_news.9.d: "De forts vents ont été signalés à travers l'Antarctique, affectant les stations de recherche. Les Parties consultatives du traité surveillent la situation et apportent un soutien pour assurer la sécurité du personnel et l'intégrité des recherches en cours. Les missions d'observateurs sont temporairement suspendues jusqu'à l'amélioration des conditions météorologiques."
 MD_antarctica_news.9.a: "Pas bon"
 MD_antarctica_news.10.t: "[FROM.GetName] commence la construction d'une station de recherche antarctique"
 MD_antarctica_news.10.d: "[FROM.GetName] a commencé la construction d'une nouvelle station de recherche antarctique, signalant son engagement envers la recherche scientifique et la conservation de l'environnement dans la région. La construction de la station devrait prendre plusieurs mois, et les Parties consultatives du traité surveilleront de près les progrès pour s'assurer qu'elle respecte les principes et règlements du Traité sur l'Antarctique."
 MD_antarctica_news.10.a: "Splendide !"
 MD_antarctica.1.t: "Mission d'observation entrante"
 MD_antarctica.1.d: "[FROM.GetName] a envoyé des observateurs du traité inspecter l'une de nos stations de recherche antarctiques. La mission devrait arriver dans §Y7 jours§!."
 MD_antarctica.1.a: "Nous attendrons leur arrivée"
 MD_antarctica.3.t: "Rapport de mission d'observateur : utilitaires en boucle ouverte détectés"
 MD_antarctica.3.d: "Les observateurs du traité ont achevé l'inspection de notre station de recherche antarctique et ont signalé la détection d'utilités en boucle ouverte. C'est une violation du Traité sur l'Antarctique et cela peut entraîner des conséquences diplomatiques. Les Parties consultatives du traité ont demandé que les utilités soient remplacées par des options plus respectueuses de l'environnement."
 MD_antarctica.3.a: "Il faut s'en débarrasser"
 MD_antarctica.4.t: "Rapport de mission d'observateur : Activités illégales de laboratoire détectées"
 MD_antarctica.4.d: "Les observateurs du traité ont achevé l'inspection de notre station de recherche antarctique et ont signalé la détection d'activités de laboratoire illégales. Les Parties consultatives n'iront pas plus loin si nous cessons toutes les activités illégales dans notre station."
 MD_antarctica.4.a: "Il faut faire quelque chose"
 MD_antarctica.5.t: "Rapport de mission d'observation : recherche d'armes nucléaires détectée"
 MD_antarctica.5.d: "Les observateurs du traité ont achevé l'inspection de notre station de recherche antarctique et ont signalé la détection d'une recherche d'armes nucléaires. C'est une grave violation du Traité sur l'Antarctique et entraînera des conséquences diplomatiques immédiates. Les Parties consultatives du traité agiront de façon décisive pour traiter cette question et tenir les responsables pour comptables, exigeant la cessation immédiate de toute recherche nucléaire dans notre station."
 MD_antarctica.5.a: "Il faut s'en débarrasser immédiatement !"
 MD_antarctica.6.t: "Violation du Traité sur l'Antarctique : trop de violations"
 MD_antarctica.6.d: "Cher [ROOT.GetLeader],\n\nNous regrettons de vous informer que votre nation, [ROOT.GetName], a trop souvent violé le Traité sur l'Antarctique, avec un total de [?antarctica_station_reports] violations. En conséquence, les Parties consultatives du traité ont décidé de retirer [ROOT.GetName] du traité dans un délai de 2 ans et d'imposer de graves conséquences diplomatiques. Les violations répétées des principes et règlements du traité ont miné l'intégrité de l'accord et menacé la protection de l'écosystème unique de l'Antarctique. Nous vous exhortons à prendre cette affaire au sérieux et à retirer la station de recherche avant que l'adhésion ne soit révoquée.\n\nSincèrement,\nLes Parties consultatives du Traité sur l'Antarctique"
 MD_antarctica.6.a: "Nous l'avons bien cherché"
 MD_antarctica.7.t: "Imposer un embargo à [FROM.GetName] ?"
 MD_antarctica.7.d: "En raison de la récente détection d'une recherche d'armes nucléaires dans l'une des stations de recherche antarctiques [FROM.GetAdjective], les Parties consultatives du Traité sur l'Antarctique envisagent d'imposer un embargo à [FROM.GetName]. Cela impliquerait de restreindre le commerce et les relations diplomatiques avec [FROM.GetName] en réponse à leur violation des principes et règlements du traité."
 MD_antarctica.7.a: "Ils doivent payer pour leurs actes"
 MD_antarctica.7.b: "Ça n'en vaut pas la peine"
 MD_antarctica.9.t: "Module de la station Antarctique endommagé"
 MD_antarctica.9.d: "Un module de l'une de nos stations de recherche antarctiques a été endommagé par un blizzard. Les ingénieurs préparent les réparations et commenceront dès que les conditions météorologiques s'amélioreront.\n\nLes réparations commencent à la fin du blizzard (§Y[?global.antarctica_blizzard_days_remaining|0]§! jours de blizzard restants) et durent §Y14§! jours. Vous pouvez voir le temps restant dans la vue de la station et dans l'infobulle du module endommagé."
 MD_antarctica.9.a: "Maudit temps !"
 MD_antarctica.10.t: "Démantèlement de la station de recherche antarctique du pays annexé"
 MD_antarctica.10.d: "En raison de l'annexion du pays possédant une station de recherche, la station a été démantelée."
 MD_antarctica.10.a: "D'accord"
 ANT_nukes_research_discovered_idea: "Recherche d'armes nucléaires découverte à la station antarctique"
 ANT_nukes_research_discovered_idea_desc: "Ce pays a violé le principe d'interdiction totale de la recherche militaire en Antarctique en menant des recherches liées aux armes nucléaires."
 antarctica_small_treaty_admin_cost_1: "Administration des petits traités de l'Antarctique"
 antarctica_small_treaty_admin_cost_1_desc: "Ce pays a signé un petit traité antarctique (CCAS ou CCAMLR), augmentant la charge administrative de l'action politique."
 antarctica_small_treaty_admin_cost_2: "Administration élargie du Traité sur l’Antarctique"
 antarctica_small_treaty_admin_cost_2_desc: "Ce pays a signé les deux petits traités antarctiques (CCAS et CCAMLR), exigeant davantage de ressources d'administration et de conformité."
 ANT_kicked_from_treaty_idea: "Exclu du traité antarctique"
 ANT_kicked_from_treaty_idea_desc: "En raison de violations répétées du Traité sur l'Antarctique, ce pays a été exclu de l'accord et ne peut pas le rejoindre pendant les deux prochaines années."
 ANT_illegal_extraction_idea: "Extraction illégale des ressources de l'Antarctique"
 ANT_illegal_extraction_idea_desc: "Nos relations avec les autres pays sont moins bonnes parce que nous sommes parmi les rares à ne pas vouloir échanger de précieuses ressources pour préserver une jolie vue d'un désert de glace. Ils tiennent trop à ce bloc gelé."
 ANT_military_training_idea: "Entraînement militaire illégal en Antarctique"
 ANT_military_training_idea_desc: "Il n'y a pas de meilleur endroit pour préparer nos soldats à une offensive hivernale que l'Antarctique."
