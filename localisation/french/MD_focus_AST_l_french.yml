 minerals_resource_tax_idea_ast: "Taxe sur les ressources minérales"
 minerals_resource_tax_idea_ast_desc: "Un dispositif fiscal au coup par coup pour transférer une partie de la richesse du boom minier dans nos caisses. Négocié de fond en comble avec les patrons du secteur, afin d'être mis en œuvre avec le moins de résistance possible."
