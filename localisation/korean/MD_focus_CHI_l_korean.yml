 CHI_jiang_reformer: "개혁 시대의 설계자"
 CHI_jiang_security_tsar: "보안 차르"
 CHI_nuke_general: "핵 장군"
 CHI_nuke_general_desc: "칭 시 타오 장군은 인민해방군 내 핵 및 방사능 전쟁 분야의 최고 권위자입니다. 그는 전술 핵 능력을 재래식 작전에 직접 통합해야 한다고 주장하며, 이 교리로 총참모부 내에서 존경과 논란을 함께 얻었습니다."
 CHI_special_weapons_general: "특수 무기 사령관"
 CHI_special_weapons_general_desc: "량 장군은 첨단 무기 체계에 대한 전문성과 재래식 포병 교리를 겸비한 인민해방군에서 가장 다재다능한 고위 지휘관 중 한 명입니다. 총참모부 내에서 천재로 평가받는 그녀는 최첨단 기술을 합동 작전에 접목하는 능력으로 알려져 있습니다."
 CHI_tank_general: "전차 장군"
 CHI_tank_general_desc: "콰이 장군은 인민해방군을 대표하는 기갑전 지휘관 가운데 한 명으로, 중전차 부대의 공격적 운용과 압도적인 화력이 적이 대응하기도 전에 전투의 승패를 가른다는 신념으로 유명합니다."
 CHI_two_centenary_supreme_commander: "신시대 최고 통수권자"
 CHI_wolf_warrior_spirit: "전랑 정신"
 CHI_wolf_warrior_spirit_desc: "우리 외교관들은 국제 무대에서 국익을 적극적으로 수호하고 서방의 담론에 맞서고 있습니다."
