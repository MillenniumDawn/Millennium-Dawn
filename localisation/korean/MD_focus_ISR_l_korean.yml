 arab_mafia_4: "§6쇠퇴하는§! 아랍 마피아"
 arab_mafia_4_desc: "이스라엘 경찰은 이스라엘 범죄 조직을 점진적으로 해체하는 프로그램을 시작했으나 유대인 조직에만 집중해 왔습니다. 그 사이 아랍인 거주 지역에서는 부족 간, 가문 간 범죄율이 급등하기 시작했고, 요르단강 서안과 요르단에서 막대한 양의 총기가 흘러들어 끝없는 폭력의 순환을 부추기며 죄 없는 이스라엘 아랍인 민간인만 점점 더 많이 희생되고 있습니다.\n§W--------------§!\n아랍 범죄 분기에서 §Y$ISR_learn_from_october_events$§! 또는 §Y$ISR_rely_on_gideonites$§!부터 §Y$ISR_storm_tuba_zangariya$§!에 이르기까지 중점을 하나 완료할 때마다 이 국가 정신은 §G개선§!되며, 해당 분기를 모두 완료하면 §R제거§!됩니다."
 arab_mafia_5: "§7구금된§! 아랍 마피아"
 arab_mafia_5_desc: "이스라엘 경찰은 이스라엘 범죄 조직을 점진적으로 해체하는 프로그램을 시작했으나 유대인 조직에만 집중해 왔습니다. 그 사이 아랍인 거주 지역에서는 부족 간, 가문 간 범죄율이 급등하기 시작했고, 요르단강 서안과 요르단에서 막대한 양의 총기가 흘러들어 끝없는 폭력의 순환을 부추기며 죄 없는 이스라엘 아랍인 민간인만 점점 더 많이 희생되고 있습니다.\n§W--------------§!\n아랍 범죄 분기에서 §Y$ISR_learn_from_october_events$§! 또는 §Y$ISR_rely_on_gideonites$§!부터 §Y$ISR_storm_tuba_zangariya$§!에 이르기까지 다음 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 harari_compromise: "하라리 타협"
 harari_compromise_desc: "이스라엘은 헌법을 한 번도 제정하지 않은 세계 유일의 입헌 국가입니다. 제1대 크네세트가 구성한 헌법 위원회는 만족스러운 헌법안에 합의하지 못했고, 이에 정부는 헌법이 마련될 때까지 임시 \\"기본법\\" 체계를 제안했습니다. 그러나 이스라엘에서 늘 그렇듯 이것은 영구적인 것이 되었습니다. 이는 국가의 헌정 구조가 다른 나라의 헌법에 비해 훨씬 쉽게 바뀔 수 있음을 의미하며, 누군가 그 권한을 이용하기로 마음먹는다면 이스라엘 민주주의에 위험한 위협이 됩니다.\n§W--------------§!\n§Y$ISR_basic_law_amendment$§!, §Y$ISR_judicial_reform_partial$§! 또는 §Y$ISR_rein_in_partners$§! 중점을 완료하면 이 국가 정신은 §R제거§!되고 헌정 합의로 대체됩니다."
 ISR_pmc_first_idea: "이스라엘 민간군사기업"
 ISR_infrastruc_problems: "기반시설 문제"
 ISR_economy_bonuses: "이스라엘 경제"
 ISR_economy_bonuses_desc: "세 주요 산업이 이스라엘 경제에 미치는 영향력을 감안하면, 이들의 성장과 안정은 이스라엘의 건전성에 크게 영향을 미칩니다. 이 산업들이 번성하면 이스라엘 경제에 보너스를 제공하지만, 쇠퇴하면 우리나라에 부정적인 영향을 미칩니다."
 isr_supply_focus: "보급에 집중"
 isr_pocket_defense_doc: "우리의 전략적 종심"
 isr_more_interceptors: "우리의 전략적 종심"
 isr_our_strategic_depth: "우리의 전략적 종심"
