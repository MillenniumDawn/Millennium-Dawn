 CHI_APC_1_desc: "The Norinco Type 63 also known as WZ-211 is a Chinese amphibious light tank featuring an 85 mm Type 62-85TC rifled gun and welded rolled steel armor."
 CHI_APC_2_desc: "노린코 89식 장갑차는 13명의 승객을 태울 수 있는 중국 장갑차이며 용접 강철 선체와 QJC88 12.7mm 대공 기관총을 갖추고 있습니다."
 CHI_APC_3_desc: "The ZSL92 (also known as WZ551) is a family of Chinese wheeled armored personnel carriers capable of carrying 9 passengers and also features a Welded steel hull and either an autocannon or a 12.7mm heavy machine gun."
 CHI_APC_4_desc: "05식 수륙양용 장갑차는 수륙양용 추적 장갑차입니다. 8명의 승객을 태울 수 있으며 알루미늄 합금 선체, 30mm 대포, 105mm L7 강선포, 12.7mm 기관총 및 HJ-8 미사일을 갖추고 있습니다."
 CHI_APC_5_desc: "ZBL-09 스노우 레오파드는 NORINCO에서 개발한 병력 수송 장갑차입니다. 7-10명의 인원을 수송할 수 있으며 30mm 대포, HJ-73 ATGM, 7.62mm 기관총을 갖추고 있습니다."
 CHI_Heavy_Anti_tank_2_desc: "The Hong Jian-9 ('Red Arrow-9') is an advanced, Tandem HEAT, solid fuel, rocket motor, third-generation anti-tank missile system deployed by the People's Liberation Army."
 CHI_IFV_1_desc: "WZ501으로 알려진 86식 보병전투차는 러시아 BMP-1 보병전투차량(IFV)의 중국형 복제품입니다. 용접된 강철 장갑, 73mm 주포, 7.62mm 동축 기관총, HJ-73 대전차 미사일이 특징입니다."
 CHI_IFV_2_desc: "WZ501으로 알려진 86식 보병전투차는 러시아 BMP-1 보병전투차량(IFV)의 중국형 복제품입니다. 용접된 강철 장갑, 73mm 주포, 7.62mm 동축 기관총, HJ-73 대전차 미사일이 특징입니다."
 CHI_IFV_3_desc: "The ZSL92 (also known as WZ551) is a family of Chinese wheeled armored personnel carriers capable of carrying 9 passengers and also features a Welded steel hull and either an autocannon or a 12.7mm heavy machine gun."
 CHI_IFV_4_desc: "ZBD-04 또는 04식 (제조사 명칭 WZ502)은 중국의 보병 전투 차량입니다. 7명의 승객을 태울 수 있으며 100mm 강선포, 30mm 기관포, 7.62mm 동축 기관총 및 HJ-8 대전차 미사일이 장착되어 있습니다."
 CHI_IFV_5_desc: "WZ502G로 알려진 ZBD-08은 중국의 새로운 보병 전투 차량입니다. 7명의 승객을 태울 수 있으며 100mm 강선포, 30mm 기관포, 7.62mm 동축 기관총이 특장입니다."
 CHI_Anti_tank_1_desc: "The Type-69 is a Chinese reverse-enginereed clone of the Soviet RPG-7 design."
 CHI_Anti_tank_2_desc: "The HJ-8 or Hongjian-8 ('Red Arrow-8') is a second generation tube-launched, optically tracked, wire-guided anti-tank missile system."
 CHI_MBT_1_desc: "59식 주력 전차(WZ-120)는 소련 T54-A 전차의 중국식 버전입니다. 100mm 강선포와 203mm 장갑이 특징입니다."
 CHI_MBT_2_desc: "ZTZ80으로도 알려진 80식 전차는 중국의 2세대 주력전차입니다. 105mm 강선포가 특징입니다."
 CHI_MBT_3_desc: "The Type 96 or ZTZ-96 is a Chinese second generation main battle tank and the final evolution of the Type 88 design. It features composite armor, a 125 mm smoothbore gun and 2 machine guns."
 CHI_MBT_4_desc: "99식 주력 전차 또는 ZTZ-99는 모듈식 복합/반응장갑을 부착하고, 125mm ZPT-98 활강포 및 2개의 기관총을 갖춘 중국의 3세대 주력 전차입니다."
 CHI_MBT_5_desc: "99식 주력 전차 또는 ZTZ-99는 모듈식 복합/반응장갑을 부착하고, 125mm ZPT-98 활강포 및 2개의 기관총을 갖춘 중국의 3세대 주력 전차입니다."
 CHI_Rec_tank_0_desc: "The Norinco Type 62 is a Chinese light tank featuring an 85 mm Type 62-85TC rifled main gun"
 CHI_Rec_tank_1_desc: "The Norinco Type 63 also known as WZ-211 is a Chinese amphibious light tank featuring an 85 mm Type 62-85TC rifled gun and welded rolled steel armor."
 CHI_Rec_tank_2_desc: "An improved version of the original Type 62, the Type 62-G features an improved armour layout, new welded flat-plate turret, a more powerful 105 mm rifled main gun and modern stabilization system, a modern fire-control system, and night vision equipment."
 CHI_Rec_tank_3_desc: "ZTQ-15로도 알려진 15식 경전차는 105mm 강선포와 원격 제어되는 12.7mm 기관총과 QLZ-04 자동 유탄 발사기를 갖춘 중국의 3세대 경전차입니다. 복합 장갑 및/또는 폭발 반응 장갑 패키지로 보호됩니다."
