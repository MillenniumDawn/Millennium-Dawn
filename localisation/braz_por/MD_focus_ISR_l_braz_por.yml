 israel_economy.30.t: "Israel Oferece Cooperação Agrícola"
 israel_economy.30.d: "Recentemente, o governo israelense nos propôs compartilhar mutuamente nossas experiências no campo agrícola e cooperar na área do agronegócio. Devemos aceitar?"
