 israel.149.t: "히스타드루트 문제"
 israel.149.d: "우리 당은 오랫동안 우리나라의 다양한 노동조합, 즉 히스타드루트를 지지해 왔습니다. 그러나 최근 사회정치적 여건으로 인해 그들의 영향력은 상당히 감소했습니다.\n\n문제는, 히스타드루트의 거듭된 부상을 지원해야 할지, 아니면 우리와 생산적인 관계를 맺을 수 있는 새로 발전하는 첨단 기술 산업의 편에 서야 할지입니다."
 israel.149.a: "노동조합의 옛 영광을 되살리자!"
 israel.148.b: "성직자들을 설득하라."
 no_eff_in_focs_tt: "§R노동당 중점 외의 중점으로는 히스타드루트에 대한 관계를 높일 수 없습니다!§!"
 beaware_histadrut_tt: "§O우리의 결정은 예기치 못한 결과를 가져올 수 있습니다!§!"
 ISR_price_protection_act: "가격 보호법"
 ISR_business_subsidize: "기업 보조금"
 israel_labour.0.t: "노동당 청년 운동"
 israel_labour.0.d: "이제 초핌은 우리 정부로부터 더 많은 관심을 받습니다. 초핌은 남녀 소년소녀가 동등한 기반에서 함께 참여하는, 세계 최초의 양성평등 스카우트 운동으로 유명합니다. 그들은 우리나라의 미래입니다."
 israel_labour.0.a: "과연!"
 ISR_edication_relief: "교육 지원"
 ISR_haifa_model_fek: "하이파 모델"
 ISR_smaller_classes_th: "소규모 집중 교육"
 israel_labour.1.t: "사회 운동 문제"
 israel_labour.1.d: "셸리 라헬 야히모비치는 최근 좌파 정치 운동의 떠오르는 스타입니다. 그녀의 운동은 우리의 이념적 입장과 상당히 일치합니다. 그녀의 운동을 우리 당에 통합하면 그녀가 머지않아 우리 당의 지도부를 차지할 가능성이 꽤 높습니다... 그들을 통합하겠습니까?"
 israel_labour.1.a: "물론이다! 들어오라!"
 israel_labour.1.b: "하급 정치는 우리나라와 상관없다."
 israel_labour.2.t: "민주당"
 israel_labour.2.d: "오늘 £ISR_socialism 노동당과 £ISR_neutral_Social 메레츠당의 합당으로 탄생한 새로운 정당 £ISR_democrats 민주당의 창당이 알려졌습니다. 이 사건은 사회에 뜻밖의 일이 아니었는데, 역사적으로 이들 정당은 항상 협력해 왔고 선거에서 하나의 연립으로 행동했으며, £ISR_democrats 민주당의 창당은 이들 정당 관계의 논리적 수순이었기 때문입니다. 사실 이는 완전한 통합은 아니며, 현재 두 당은 여전히 별도의 예산과 지방자치단체 내 독립 계파를 유지하고 있지만, 어떻게든 이 연합은 선거에서 좋은 승산과 밝은 미래를 가지고 있습니다."
 israel_labour.2.a: "좌파가 단결하고 있다."
 israel_labour.3.t: "예시 아티드 창당"
 israel_labour.3.d: "이스라엘 정계에서는 2년 전부터 인기 언론인이자 자유주의 정당 £ISR_liberalism_alt2 샤이누이의 대표의 아들인 야이르 라피드가 언론인 경력을 접고 정치에 입문할 것이라는 추측이 돌았습니다. 또한 많은 이들은 라피드가 기존 정당에 합류할 것이라고 추측했습니다. 1월에 야이르 라피드는 실제로 정계에 입문하겠다고 발표했고, 올해 4월에는 새로운 정당 £ISR_liberalism_alt3 예시 아티드의 창당을 신청했습니다. 이 당은 샤이누이의 정치적 전통을 이어 자유주의적 시온주의와 정치적 중도주의를 옹호할 것입니다."
 israel_labour.3.a: "야이르 라피드에게는 밝은 미래가 있다."
 israel_labour.3.b: "흥미로울 것 없다."
 israel_labour.4.t: "호센 레이스라엘 창당"
 israel_labour.4.d: "전 이스라엘 방위군 참모총장 베냐민 \\"베니\\" 간츠가 새로운 정당 £ISR_liberalism_alt4 이스라엘 회복력당의 창당을 발표했습니다. 이 당은 중도 성향을 표방하며 국가 방위를 명분으로 한 보다 비정치적인 행보를 옹호합니다."
 israel_labour.4.a: "베니 간츠가 이스라엘을 단결시킬 것이다!"
 israel_labour.4.b: "흥미로울 것 없다."
 israel_labour.5.t: "티크바 하다샤 창당"
 israel_labour.5.d: "리쿠드의 대대적인 \\"비비화\\" 속에서, 전 £ISR_conservatism 리쿠드 당원 기드온 사르가 새로운 정당 £ISR_conservatism_alt 새로운 희망의 창당을 발표했습니다. 이 당은 우파적 입장을 옹호하면서도 자유주의적 정치 개혁과 시장에 대한 국가 개입을 지지합니다."
 israel_labour.5.a: "베니 간츠가 이스라엘을 단결시킬 것이다!"
 israel_labour.5.b: "흥미로울 것 없다."
 ISR_united_party: "통합당"
 ISR_united_party_desc: "두 좌파 정당이 하나의 조직으로 합쳐야 할 때가 왔습니다. 따로는 우파 정당들에게 패배하겠지만, 함께라면 대중적인 시온주의 국가를 만들 수 있습니다!"
