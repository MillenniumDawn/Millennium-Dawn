 ARM_corrupt_military: "Corruption militaire"
 ARM_corrupt_military_desc: "La corruption dans l'armée arménienne est omniprésente et étouffante. De nombreux généraux s'enrichissent en vendant du matériel et en pillant les entrepôts plutôt qu'en maintenant la préparation.\n§W--------------§!\nCet esprit national §Gs'améliorera§! si la corruption est inférieure à §H$corruption_level_04$§!."
