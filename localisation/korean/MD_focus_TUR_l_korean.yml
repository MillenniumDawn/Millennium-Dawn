 TUR_assimulate_kuwait: "Assimilate Kuwait"
 TUR_assimulate_syria: "Assimilate Syria"
 TUR_assimulate_iraq: "Assimilate Iraq"
 TUR_invite_azerbaijan: "아제르바이잔 초대"
 TUR_invite_azerbaijan_desc: "아제르바이잔의 형제들은 우리가 하나가 되는 이날을 오랫동안 고대해 왔습니다. 그들이 기쁜 마음으로 우리와 함께해 주기를 바랍니다."
 TUR_invite_kazakhstan: "카자흐스탄 초대"
 TUR_invite_kazakhstan_desc: "카자흐인들은 현재 튀르크 세계에서 가장 넓은 영토를 보유하고 있습니다. 그들을 연합에 초청하는 것은 당연한 일입니다."
 TUR_invite_uzbekistan: "우즈베키스탄 초대"
 TUR_invite_uzbekistan_desc: "우즈베크인들은 자국이 튀르크 연합에 가입할 자격이 있다는 소식을 들으면 기뻐할 것입니다. 그들이 가입하리라는 데에는 의심의 여지가 없습니다."
 TUR_invite_turkmenistan: "투르크메니스탄 초대"
 TUR_invite_turkmenistan_desc: "투르크메니스탄은 세계에 문을 잘 열지 않는 나라이지만, 튀르크 친구들에게만큼은 분명 마음을 열 것입니다."
 TUR_land_reforms: "토지개혁"
 TUR_land_reforms_desc: "국민 사이의 토지 분배 방식을 전면적으로 개혁할 것입니다."
 TUR_military_debug: "군부 (TSK)"
 TUR_ottomans_time: "우리는 §H오스만 가문§!을 집권시킬 수 있으며, 국가 중점 트리가 사용 가능해집니다."
 TUR_appease_PKK: "쿠르디스탄 노동자당 회유"
 TUR_seize_mafia_assets: "마피아 자산 압수"
 TUR_seize_mafia_assets_desc: "이제 여러 마피아 조직원이 체포되었으니, 수사... 목적으로 그들의 자산을 안전하게 압수할 수 있습니다."
 TUR_seize_goods_from_ports: "항구에서 물자 탈취"
 TUR_assassinate_abdul_mustafa: "쿠르드인 처리"
 TUR_assassinate_abdul_mustafa_desc: "90년대에 쿠르드인이 북부 이라크에서 자치권을 얻은 이래로, 쿠르드 분리주의자들의 사기 상승으로 인해 우리 보안군은 높은 경계 태세에 놓여 있었습니다. 키르쿠크 총독을 암살함으로써 쿠르드인의 사기와 저항에 심각한 타격을 줄 수 있습니다."
 TUR_gulenist_educators2_desc: "우리는 교육 개선에 중점을 두었으며, 할 수 있는 동안 귤렌의 가르침을 퍼뜨려야 합니다."
 TUR_9833_name_mhp: "콘스탄티니예"
 TUR_flavor_event.5.b: "비극적이다"
 TUR_support_from_kurdish_television: "쿠르드 방송의 지지"
 TUR_support_from_kurdish_television_desc: "우리가 육성을 도운 쿠르드 방송 채널들이 우리 정부와 국가를 지지하고 호의적으로 이야기하기 시작했습니다."
 PKK_hard_fought_freedom: "힘겹게 쟁취한 자유"
 PKK_hard_fought_freedom_desc: "우리의 자유는 쉽게 오지 않았습니다. 쿠르디스탄의 용감한 전사들이 튀르키예 국가로부터 자치를 얻어내는 데 수십 년이 걸렸으며, 이 자유는 마지막 한 명의 쿠르드인까지 지켜질 것입니다!"
 TUR_revised_political_party_laws: "표적 정치 법률"
 TUR_revised_political_party_laws_desc: "특정 정당이 원하는 바를 말할 수 있는 능력을 제한하는 일부 법률이 통과되었습니다."
 TUR_scorched_earth_tactics: "초토화 전술"
 TUR_supply_disruption: "병참 문제"
 TUR_PKK_released_TT: "£TUR_Neutral_Communism  §OPKK 반란§!이 종식됩니다!\n - £TUR_Neutral_Communism  §OPKK§!가 새로운 쿠르드 국가의 집권 기구가 됩니다."
 PKK_strength_TT: "PKK 세력"
 PKK_strength2_TT: "이 변수는 PKK가 얼마나 강해졌는지를 나타냅니다. 이 변수는 매년 5-10%씩 상승하며, 100%에 도달하면 PKK가 속박에서 벗어나 독립 전쟁을 벌일 것입니다. 더 많은 기지를 소탕할수록 PKK 세력은 약해집니다. 우리는 신속히 행동해야 하며, 그렇지 않으면 PKK가 몇 년 안에 속박에서 벗어날 수 있습니다."
 TUR_pkk_manpower_TT: "[ROOT.TUR_PKK_bases_name] 기지의 인력"
 TUR_pkk_manpower2_TT: "이 변수는 [ROOT.TUR_PKK_bases_name] 기지에 있는 인력을 나타냅니다. 이를 100 미만으로 낮출 수 있다면 이 지역에서 PKK를 영구히 뿌리 뽑을 수 있습니다. 모든 주에서 PKK를 뿌리 뽑으면 PKK에 대한 완전한 승리를 선언할 수 있습니다."
 TUR_PKK_insurgency_formally_ends_TT: "£TUR_Neutral_Communism  §OPKK 반란§!이 종식됩니다"
 TUR_less_than_100_PKK_diyarbakir_TT: "§H디야르바키르§! 기지의 인력이 §H인력 100§! 미만입니다"
 TUR_less_than_100_PKK_van_TT: "§H반§! 기지의 인력이 §H인력 100§! 미만입니다"
 TUR_less_than_100_PKK_euphrates_TT: "§H유프라테스§! 기지의 인력이 §H인력 100§! 미만입니다"
 TUR_has_large_mil_or_higher_TT: "§O대규모 군사비 지출§! 이상입니다"
 TUR_automate_warfare_TT: "£TUR_Neutral_Communism  PKK에 대한 작전을 개시합니다\n - 이 기지를 계속해서 공격할 필요 없이 자동으로 진행됩니다\n - 매월 말에 일정 수의 £TUR_Neutral_Communism  PKK가 사망합니다\n - 작전이 진행되는 동안 우리는 장비와 인력을 소모합니다\n - 작전이 진행되는 동안 전투와 관련된 사건이 발생합니다\n - £TUR_Neutral_Communism  PKK가 아나톨리아 깊숙이 공격할 가능성이 더 높아집니다"
 TUR_end_automate_warfare_TT: "이 주에서 £TUR_Neutral_Communism  PKK에 대한 작전을 종료합니다"
 TUR_spend_equipment_TT: "§R우리는 다음을 잃게 됩니다§!:\n - §H150§!에서 §H460§! 사이의 소형 화기\n - §H25§!에서 §H190§! 사이의 다용도 트럭\n - §H5§!에서 §H65§! 사이의 인력"
 TUR_assault_this_base_TT: "§H40§!에서 §H190§! 사이의 £TUR_Neutral_Communism PKK 반군이 §G사살§!됩니다"
 TUR_finalized_kurdish_reforms_TT: "[PKK.GetFlag] §H쿠르드§! 독립에 대한 국민투표를 §H확정§!하고 실시합니다\n - 이 결정을 내리면 더 이상의 개혁을 통과시킬 수 §R없게§! 됩니다"
 TUR_release_ocalan_TT: "§H압둘라 외잘란§!이 석방됩니다"
 TUR_completed_reconciliations_TT: "모든 개혁이 완료되어 통과되었습니다"
 TUR_PKK_broke_free_tt: "[PKK.GetFlag] PKK가 속박에서 벗어납니다!\n - 전쟁 명분을 만들거나 습격을 통해 전쟁을 시작하지 않는 한 직접 개입할 수 없습니다\n - [PKK.GetFlag] PKK는 상비군을 보유하게 되며, 우리에 대해 큰 방어 보너스를 받습니다.\n - 쿠르드 지역에 대한 모든 중핵을 잃게 됩니다."
 TUR_double_damage_TT: "§HPKK 반군§!을 §H2배§! 더 많이 제거합니다\n§H50%§! 확률로 §H민간 공장 1개§!를 잃습니다"
 TUR_2X_LOSS_TT: "§H50% 확률§!로 장비를 §H2배 더§! 잃습니다"
 TUR_AIR_LOSS_TT: "§H50% 확률§!로 §H수송기§!를 잃습니다"
 TUR_PKK_DAMAGE_300_TT: "§HPKK 반군§! §H300§!명을 제거합니다"
 TUR_PKK_DAMAGE_200_TT: "§HPKK 반군§! §H200§!명을 제거합니다"
 TUR_PKK_DAMAGE_100_2_TT: "§HPKK 반군§! §H100§!명을 체포합니다"
 TUR_PKK2_TT: "£decision_icon_small §Y잠금 해제§!: 쿠르디스탄 문제에 대한 추가 §Y결정§!\n - 이 선택지를 택하면 중동의 쿠르드 지역에 대해 더 큰 지배력을 행사할 수 있습니다.\n - 모든 PKK 기지를 성공적으로 파괴하면 튀르키예 내 쿠르드 분리주의를 영구히 끝낼 수 있습니다."
 TUR_PKK3_TT: "£decision_icon_small §Y잠금 해제§!: 쿠르디스탄 문제에 대한 추가 §Y결정§!\n - 이 선택지는 £TUR_Neutral_Communism  §HPKK 기지§!에 대한 군사 작전을 대체합니다. 기지를 파괴해도 약속을 이행한 것으로 간주되지 않습니다.\n - 우리는 필요한 개혁을 통과시키는 데 §H1,500일§!이 주어집니다. 개혁을 시작하면 기한이 연장됩니다.\n - 이 선택지는 [PKK.GetFlag] 쿠르드인들에게 더 큰 자치를 부여합니다.\n - [PKK.GetFlag] 디야르바키르는 자치 지역이 되며, 산업의 상당 부분은 우리가 통제합니다.\n - [PKK.GetFlag] PKK는 자체 군대, 정부, 영토를 갖게 됩니다.\n - 이 선택지를 택하면 상당한 쿠르드 소수 민족을 가진 이웃 나라들이 분노합니다."
 TUR_rebuilding_kurdistan: "쿠르디스탄 재건"
 TUR_rebuilding_kurdistan_desc: "\n£TUR_desctext_PKK \n\n\n\n\n우리의 화해 약속은 위대한 우리 국가의 동부 지역에 사는 쿠르드 주민들에게 새로운 희망을 주었습니다. 쿠르드 국가는 별개의 실체가 되겠지만, 여전히 우리 정부에 책임을 져야 할 것입니다. 안정적이고 자립적인 쿠르드 국가를 만들려면 먼저 그 국가가 붕괴하지 않고, 또 우리에게 지나치게 의존하지 않고 스스로를 유지하는 데 필요한 기반시설과 틀을 마련해야 합니다. 이 약속을 이행하지 못하면 이 지역에 대한 통제권을 완전히 잃을 수 있습니다."
 TUR_PKK_mechanic: "쿠르디스탄의 위기"
 TUR_PKK_mechanic_desc: "\n£TUR_desctext_PKK \n\n\n\n\n£TUR_Neutral_Communism  §HPKK§!는 70년대 후반에 처음 공격을 시작한 이래로 우리 국가로부터 자치권 또는 완전한 독립을 얻으려는 노력을 이어 왔습니다. £TUR_Neutral_Communism  §HPKK§!는 운동을 인접 국가들로 확산시켜 이웃 나라들을 불안정하게 만들었으며, 더욱 긴밀한 협력의 필요성을 낳았습니다. 그들의 세력 확대를 막기 위해 우리가 할 수 있는 일은 그들을 공격하는 것 외에는 거의 없습니다. 기지를 더 많이 소탕할수록 그들의 세력은 약해집니다. £TUR_Neutral_Communism  §HPKK§!를 제거하는 것은 시간과의 싸움이며, 소탕이 오래 걸릴수록 대규모 반란이나 독립에 더 가까워집니다.\n\n선택한 기지: [ROOT.TUR_PKK_bases_name]"
 TUR_PKK_van_manpower: "[?var_pkk_van]"
 TUR_PKK_diyarbakir_manpower: "[?var_pkk_diyarbakir]"
 TUR_PKK_euphrates_manpower: "[?var_pkk_euphrates]"
 TUR_hold_meeting: "디야르바크르 정상회담 개최"
 TUR_hold_meeting_desc: "우리는 동맹국들과 디야르바크르에서 회합하여 앞으로 나아갈 합의를 도출할 수 있습니다. 동맹국들과 협력하여 비용을 감수하고 함께 PKK에 맞서거나, 독자적으로 행동하기로 결정할 수 있으며, 후자의 경우 국경을 넘는 급습을 추진하면 이웃 국가들과의 충돌 위험이 있습니다. 또한 정상회담에서 쿠르드인에게 자치권을 부여할 의향을 발표하는 것도 선택할 수 있습니다."
 TUR_select_van_base: "반에서 작전 수행"
 TUR_select_van_base_desc: "반 지역은 PKK 활동이 가장 활발한 지역 중 하나이며 이란과 아르메니아 양쪽과 국경을 맞대고 있습니다."
 TUR_select_diyarbakir_base: "디야르바크르에서 작전 수행"
 TUR_select_diyarbakir_base_desc: "PKK 조직원과 지지자들의 저항이 가장 거센 지역이라 할 수 있는 디야르바크르는 PKK 활동의 거점이었습니다."
 TUR_select_euphrates_base: "중부 유프라테스에서 작전 수행"
 TUR_select_euphrates_base_desc: "다른 지역보다는 평온하지만, 중부 유프라테스 지역에서도 PKK 세포 조직들이 활발히 움직이고 있습니다."
 TUR_assault_this_base: "[ROOT.TUR_PKK_bases_name] 공격 개시"
 TUR_assault_this_base_desc: "[ROOT.TUR_PKK_bases_name]에 대한 공격을 개시하면 PKK 거점을 더 직접적으로 소탕할 수 있습니다."
 TUR_greenlight_operations_in_van: "반 작전 승인"
 TUR_greenlight_operations_in_van_desc: "TSK에 반 지역의 PKK에 대한 전면 공격을 개시하도록 승인할 수 있습니다."
 TUR_end_operations_in_van: "반 작전 종료"
 TUR_end_operations_in_van_desc: "자원과 계획이 다른 곳에 필요하므로 반에서의 작전을 마무리해야 합니다."
 TUR_greenlight_operations_in_diyarbakir: "디야르바크르 작전 승인"
 TUR_greenlight_operations_in_diyarbakir_desc: "TSK에 디야르바크르의 PKK에 대한 전면 공격을 개시하도록 승인할 수 있습니다."
 TUR_end_operations_in_diyarbakir: "디야르바크르 작전 종료"
 TUR_end_operations_in_diyarbakir_desc: "자원과 계획이 다른 곳에 필요하므로 디야르바크르에서의 작전을 마무리해야 합니다."
 TUR_greenlight_operations_in_euphrates: "중부 유프라테스 작전 승인"
 TUR_greenlight_operations_in_euphrates_desc: "TSK에 중부 유프라테스의 PKK에 대한 전면 공격을 개시하도록 승인할 수 있습니다."
 TUR_end_operations_in_euphrates: "중부 유프라테스 작전 종료"
 TUR_end_operations_in_euphrates_desc: "자원과 계획이 다른 곳에 필요하므로 중부 유프라테스에서의 작전을 마무리해야 합니다."
 TUR_clean_out_PKK_in_van: "반 지역 PKK 세력 종식"
 TUR_clean_out_PKK_in_van_desc: "이제 반과 그 주변 지역에서 PKK의 존재를 마침내 끝낼 때가 되었습니다. PKK에 맞선 우리의 성과는 지금까지 결실을 맺었으나, 과연 반에서 평화를 유지할 수 있을까요?"
 TUR_clean_out_PKK_in_diyarbakir: "디야르바크르 지역 PKK 세력 종식"
 TUR_clean_out_PKK_in_diyarbakir_desc: "이제 디야르바크르와 그 주변 지역에서 PKK의 존재를 마침내 끝낼 때가 되었습니다. PKK에 맞선 우리의 성과는 지금까지 결실을 맺었으나, 과연 디야르바크르에서 평화를 유지할 수 있을까요?"
 TUR_clean_out_PKK_in_euphrates: "중부 유프라테스 지역 PKK 세력 종식"
 TUR_clean_out_PKK_in_euphrates_desc: "이제 중부 유프라테스와 그 주변 지역에서 PKK의 존재를 마침내 끝낼 때가 되었습니다. PKK에 맞선 우리의 성과는 지금까지 결실을 맺었으나, 과연 중부 유프라테스에서 평화를 유지할 수 있을까요?"
 TUR_declare_victory_over_PKK: "PKK에 대한 승리"
 TUR_declare_victory_over_PKK_desc: "수십 년 전 우리의 주권을 무자비하게 공격하기 시작한 PKK 테러리스트들에 대해 오랫동안 기다려 온 승리를 선언할 때가 되었습니다."
 TUR_the_promise_of_no_return: "되돌릴 수 없는 약속"
 TUR_the_promise_of_no_return_desc: "우리는 동부의 쿠르드 공동체에 더 큰 자치권을 약속했습니다. 기한 내에 다섯 가지 개혁을 완료하고 확정하십시오. 개혁을 시작할 때마다 기한이 연장됩니다. PKK 기지에 대한 군사 작전은 이 임무에 영향을 주지 않습니다."
 TUR_finalize_the_reforms: "개혁 확정"
 TUR_finalize_the_reforms_desc: "많은 개혁이 통과되었으므로 이제 개혁을 확정하고 정식 쿠르드 국민투표를 요청할 때입니다."
 TUR_power_infrastructure: "적절한 전력 기반시설 구축"
 TUR_power_infrastructure_desc: "제대로 된 전력망이 없으면 국가를 운영할 때 막대한 실패가 초래될 수 있습니다. 새로운 쿠르드 국가도 다르지 않을 것입니다."
 TUR_jobs_and_careers: "쿠르드인의 일자리와 경력"
 TUR_jobs_and_careers_desc: "쿠르드 국가가 번영하려면 일자리가 필수적입니다. 적절한 고용과 생산성이 없다면 어떤 국가의 경제든 스스로 무너지고 말 것입니다."
 TUR_kurdish_security_apparatus: "쿠르드 안보 기구 설립"
 TUR_kurdish_security_apparatus_desc: "적절한 안보와 유능한 군대가 없다면 쿠르드 국가는 영토에 대한 외부 또는 내부의 공격에 취약해질 것입니다. 이는 결국 튀르키예 자체로 번질 것이며, 우리는 결코 이를 감당할 수 없습니다."
 TUR_pass_the_infrastructure_bill: "기반시설 개혁 법안 통과"
 TUR_pass_the_infrastructure_bill_desc: "동부 쿠르디스탄 기반시설 개혁 법안을 통과시키면 여러 산업을 중앙 아나톨리아로 이전하는 것을 공식 승인하고, 장차 수립될 국가가 자체 산업을 구축하는 데 필요한 기반시설을 건설할 수 있습니다."
 TUR_release_ocalan: "오잘란 석방"
 TUR_release_ocalan_desc: "압둘라 오잘란은 한동안 우리 감옥에 수감되어 있었으며, 여러 차례 처형 직전까지 갔습니다. 쿠르드인과의 관계를 개선하고자 한다면 이제 오잘란을 사회로 돌려보낼 때가 되었습니다."
 TUR_PKK_VAN_BASE: "반"
 TUR_PKK_DIYARBAKIR_BASE: "디야르바크르"
 TUR_PKK_EUPHRATES_BASE: "중부 유프라테스"
 TUR_PKK_NO_BASE: "선택된 기지 없음"
 TUR_PKK_NO_BASE_STRENGTH: "해당 없음"
 TUR_pkk.2.b: "아니다. 이는 우리 주권에 대한 위협이다"
 TUR_pkk.100.t: "[ROOT.TUR_PKK_bases_name] 사전 작전 타격"
 TUR_pkk.100.d: "우리가 목표로 삼은 기지에서 PKK의 방어를 약화시키기 시작해야 하는 단계에 이르렀습니다. 현재 [ROOT.TUR_PKK_bases_name] 일대의 PKK 이동 경로를 파악하여 사전 작전 타격을 가하고 있습니다. 일이 잘못될 가능성은 늘 있지만, 우리 병력이 준비되어 있고 효율적이라면 실패를 너무 걱정할 필요는 없습니다."
 TUR_pkk.100.a: "합동 공습 개시"
 TUR_pkk.100.b: "보급선 교란"
 TUR_pkk.100.c: "포격 퍼붓기"
 TUR_pkk.100.d1: "이번에는 지켜보자"
 TUR_pkk.200.t: "병력 보급 부족"
 TUR_pkk.200.d: "[ROOT.TUR_PKK_bases_name] 전선에서 들어오는 보고에 따르면 보급품이 부족하며, 이는 PKK에 피해를 입히는 우리의 작전 능력이 실패할 가능성을 시사합니다. 최전선의 병력에게 절실히 필요한 장비를 보낼 수 있으나, 국제 무대에서 닥칠 수 있는 분쟁에 대비해 우리 자신의 보급도 유지해야 한다는 점을 잊어서는 안 됩니다."
 TUR_pkk.200.a: "필요한 것은 무엇이든 공수한다"
 TUR_pkk.200.b: "믿을 만한 현지인에게 장비를 맡겨 수송한다"
 TUR_pkk.200.c: "지금 가진 것으로 버티게 한다"
 TUR_pkk.201.t: "PKK, 주거 지역에 참호 구축"
 TUR_pkk.201.d: "PKK는 주거 지역에 방어 진지를 구축하기로 하여 민간인을 위험에 빠뜨리고 있습니다. 이 지역에 큰 혼란을 일으키지 않으면서 이 반군들을 제거할 방법을 찾아야 합니다. 그렇지 않으면 우리의 평판과 그저 평화롭게 살고 싶을 뿐인 이들의 목숨을 위험에 빠뜨릴 수 있습니다."
 TUR_pkk.201.a: "특공 부대를 소집한다"
 TUR_pkk.201.b: "야간 공격을 시도한다"
 TUR_pkk.201.c: "그냥 공격을 개시한다!"
 TUR_pkk.202.t: "PKK, 반격 개시"
 TUR_pkk.202.d: "PKK가 [ROOT.TUR_PKK_bases_name] 시에 대규모 반격을 개시하기로 하여 일부 병력 사이에 혼란과 공포감이 생겼습니다. 그러나 지금은 우왕좌왕할 때가 아니라 다음 조치를 평가해야 할 때입니다. 작전을 담당하는 최고 사령부에 통보되었으며 명령을 기다리고 있습니다."
 TUR_pkk.202.a: "우리도 공세로 대응한다"
 TUR_pkk.202.b: "참호를 파고 공격에 대비한다"
 TUR_pkk.202.c: "초토화 전술을 쓰고 후퇴한다"
 TUR_pkk.203.t: "대규모 PKK 수송대 매복 공격"
 TUR_pkk.203.d: "PKK는 노획한 군용 및 민간 차량을 이용해 예상치 못한 공격을 피하기 위해 [ROOT.TUR_PKK_bases_name]에서 다른 장소로 이동하고 있었습니다. 그러나 PKK 내부에 있던 우리 정보원이 이 이동을 경고했고, 우리는 그들을 매복 공격할 수 있었습니다. 현재 이 수송대는 우리 헌병대에 포위되었으며, 앞으로 어떤 조치를 취해야 할지 명령을 기다리고 있습니다."
 TUR_pkk.203.a: "이 지역의 모든 것을 파괴한다"
 TUR_pkk.203.b: "공격하여 장비를 노획하려 시도한다"
 TUR_pkk.203.c: "항복할 때까지 굶긴다"
 TUR_pkk.204.t: "PKK, 분열 조장 시도"
 TUR_pkk.204.d: "PKK는 전국적인 대규모 시위를 촉구함으로써 우리 국가 내에 정치적 분열을 조장하려 시도했습니다. 진압 경찰이 대기 상태에 들어갔으나 의회와 우리 정당은 확대된 조치를 요구하고 있습니다."
 TUR_pkk.204.a: "주동자를 체포한다"
 TUR_pkk.204.b: "이 운동을 우리에게 유리하게 이용한다"
 TUR_pkk.204.c: "그들의 운동을 약화시키는 법을 통과시킨다"
 TUR_pkk.205.t: "PKK 병력, 아르메니아로 후퇴"
 TUR_pkk.205.d: "우리 병력과 교전 중이던 PKK 전투원들이 아르메니아로 국경을 넘었으며, 일부 아르메니아 국경 경비대원을 공격하고 인질로 잡기까지 했습니다. 우리 병력과의 교전에서 아직 도주하려는 자들이 몇 명 있으나, 이제 우리는 증원군을 보내 국경을 넘을 준비를 할지, 아니면 아직 도주 중인 자들에 대한 전투를 계속할지 결정해야 합니다."
 TUR_pkk.205.a: "작전을 완전히 포기한다"
 TUR_pkk.205.b: "아직 이곳에 남은 자들에 집중한다"
 TUR_pkk.205.c: "추격한다!"
 TUR_pkk.206.t: "튀르키예군, 패배"
 TUR_pkk.206.d: "튀르키예-아르메니아 국경에서 들어온 보고에 따르면, 튀르키예 전투원들이 아르메니아로 도주한 PKK 요원들을 붙잡지 못한 채 튀르키예로 철수하고 있습니다. 아르메니아 관리들은 PKK를 비호한 것이 아니라 예기치 못한 침입이었으며 붙잡힌 PKK 전투원들은 처리될 것이라고 거듭 밝혔습니다."
 TUR_pkk.206.a: "알겠다"
 TUR_pkk.207.t: "아르메니아군, 전투 중지"
 TUR_pkk.207.d: "국경의 아르메니아 경비대에 대한 일련의 성공적인 공격 이후, 그곳에 주둔한 부대들은 튀르키예 동부 국경에서 아르메니아로 도주한 PKK 전투원들의 체포를 허용하기로 하고 전투를 중지하는 데 동의했습니다."
 TUR_pkk.207.a: "알겠다"
 TUR_pkk.208.t: "튀르키예군과 아르메니아군, 휴전 합의"
 TUR_pkk.208.d: "아르메니아와 튀르키예 국경 경비대 사이의 일련의 충돌 이후, 양측은 무기를 내려놓고 휴전에 합의했습니다."
 TUR_pkk.208.a: "알겠다"
 TUR_pkk.209.t: "병력 수송 수단 부족"
 TUR_pkk.209.d: "우리 병력이 어떻게든 기지로 돌아가는 길에 오도 가도 못하는 처지에 놓였습니다. 보고에 따르면 PKK 무장 세력이 동부 국경으로 병력을 수송하는 데 쓰이던 수송대 상당수를 파괴하는 데 성공했습니다."
 TUR_pkk.209.b: "계속 밀어붙이라고 전달한다"
 TUR_pkk.209.a: "수송 수단을 더 보낸다"
 TUR_pkk.209.c: "건질 수 있는 것을 수습한다"
 TUR_pkk.210.t: "PKK 탈영병을 자처하는 자, 정보 제공 약속"
 TUR_pkk.210.d: "PKK 탈영병을 자처하는 자가 우리 부대에 투항하여 반 일대에 주둔한 PKK 부대의 핵심 위치를 밝히겠다고 약속했습니다. 그가 거짓말을 하는 것이 아니라면 그의 정보를 이용해 그가 넘긴 PKK 진지를 완전히 박살낼 수 있을 것입니다."
 TUR_pkk.210.a: "신뢰할 수 없다. 감방에 가둬라"
 TUR_pkk.210.b: "'놈들은 어디 있나?'"
 TUR_pkk.210.c: "'또 아는 것이 있나?'"
 TUR_pkk.211.t: "사상자를 낳은 잘못된 정보!"
 TUR_pkk.211.d: "PKK 이중간첩을 자처한 자가 제공한 정보가 틀렸던 것으로 보입니다. 그 결과 우리는 이 비극으로 여러 훌륭한 병사를 잃었습니다. 그들의 피는 헛되지 않을 것이며, 우리의 복수는 신속할 것입니다!"
 TUR_pkk.211.a: "끔찍하다"
 TUR_pkk.212.t: "PKK 비밀 기지로 이어진 정보"
 TUR_pkk.212.d: "PKK 이중간첩이 제공한 정보가 은신처에 숨은 여러 PKK 조직원의 위치로 이어진 것으로 보입니다. 그 결과 우리 병사들은 해당 위치를 공격하여 여러 PKK 테러리스트를 제거할 수 있었습니다."
 TUR_pkk.212.a: "훌륭하다!"
 TUR_pkk.214.t: "반에서의 작전 성공"
 TUR_pkk.214.d: "수십 년간의 전투 끝에 반 일대의 조직적인 쿠르드 저항이 막을 내렸습니다. 튀르키예 국가의 영광스러운 깃발이 그 어느 때보다 높이 휘날리고 있으며, 이 지방의 새로운 출발은 그곳에 사는 모든 민족에게 새로운 희망을 안겨 주었습니다."
 TUR_pkk.214.a: "마침내.."
 TUR_pkk.215.t: "중부 유프라테스에서의 작전 성공"
 TUR_pkk.215.d: "수십 년간의 전투 끝에 중부 유프라테스 일대의 조직적인 쿠르드 저항이 막을 내렸습니다. 튀르키예 국가의 영광스러운 깃발이 그 어느 때보다 높이 휘날리고 있으며, 이 지방의 새로운 출발은 그곳에 사는 모든 민족에게 새로운 희망을 안겨 주었습니다."
 TUR_pkk.215.a: "마침내.."
 TUR_pkk.216.t: "디야르바크르에서의 작전 성공"
 TUR_pkk.216.d: "수십 년간의 전투 끝에 디야르바크르 일대의 조직적인 쿠르드 저항이 막을 내렸습니다. 튀르키예 국가의 영광스러운 깃발이 그 어느 때보다 높이 휘날리고 있으며, 이 지방의 새로운 출발은 그곳에 사는 모든 민족에게 새로운 희망을 안겨 주었습니다."
 TUR_pkk.216.a: "마침내.."
 TUR_pkk.217.t: "[TUR.GetName], PKK에 대한 승리 선언"
 TUR_pkk.217.d: "[TUR.GetAdjective] 정부는 최근 [TUR.GetAdjective] 군(TSK)이 PKK의 모든 주요 기지, 세포 조직, 은신처를 소탕했다는 성명을 발표했습니다. 이 발표는 [TUR.GetName] 자국을 포함한 중동 전역의 쿠르드 분리주의자들을 우려하게 했습니다. PKK는 1970년대 출범 이래 수십 년 동안 매우 오랫동안 [TUR.GetName]에서 활동해 왔습니다. 이 쿠르드 집단은 처음에는 튀르키예 동부에 독립 국가를 세우기를 바랐으나, 그들의 운동은 곧 완전한 독립보다는 자치를 원하는 쪽으로 바뀌었습니다. [TUR.GetAdjective] 정부는 이러한 압박에 굴하지 않고 버텼으며, 이제 이 운동에 대한 승리를 선언할 수 있는 단계에 이르렀습니다."
 TUR_pkk.217.a: "흥미롭군"
 TUR_pkk.604.t: "PKK, 총동원령 선포"
 TUR_pkk.604.d: "PKK는 우리 정부에 맞서 총동원령을 선포했으며, 오늘 일찍 대변인이 '운동의 모든 지지자와 모든 자유 투사는 새벽에 지휘관에게 보고해야 한다'고 발표했습니다. 이 발표 직후 PKK는 쿠르디스탄 지역 주변 마을들에 대한 전면 공격을 감행하여 공식적으로 적대 행위를 개시했고, 해당 지역에 사는 사람들 사이에 큰 불안감을 조성했습니다. PKK가 완전히 뿌리 뽑힐 때까지 곧 비상사태가 선포될 것입니다."
 TUR_pkk.604.a: "그들이 본색을 드러냈다.."
 TUR_pkk.600.t: "약속 이행 실패 이후의 파국적 결과"
 TUR_pkk.600.d: "우리의 공허한 약속이 이제 우리에게 되돌아왔습니다. 우리 국가 동부에 거주하는 쿠르드인들이 쿠르드인이 다수인 지역에 대한 통제권을 장악했습니다. 우리는 더 이상 이 영토들을 공식적으로 통제하지 못하며, 우리가 빠져 있는 관료적 절차 때문에 정부는 즉각적인 결정을 내리는 데 사실상 무력합니다."
 TUR_pkk.600.a: "아, 안 돼"
 TUR_pkk.601.t: "쿠르드 자치 국민투표 통과"
 TUR_pkk.601.d: "쿠르드 자치 국민투표가 쿠르드인 압도적 다수의 자치화 찬성으로 통과되었습니다. 이 국민투표로 쿠르디스탄 인민공화국은 [TUR.GetName]의 에얄레트가 될 것입니다. 쿠르디스탄 노동자당이 이 국가의 통치 기관이 되며, 군대를 보유하고 이 지역의 법률과 정치를 통치하고 선거를 원하는 대로 실시할 수 있게 됩니다. 우리는 여전히 주요 산업 및 경제 부문에 대한 통제권을 유지하겠지만 수익의 일부는 쿠르드 국가에 돌아갈 것입니다."
 TUR_pkk.601.a: "알겠다"
 TUR_VAN_SELECTED_OP: "반이 선택되었습니다"
 TUR_commence_operations_in_van: "반에서 작전 개시"
 TUR_commence_operations_in_van_desc: "우리나라 내 PKK의 심장부를 깊숙이 타격할 때가 되었습니다. 우리나라의 최동단 거점인 반은 PKK가 서부 튀르키예와 이란으로 향하는 다수의 공격을 위한 집결지로 사용하는 곳입니다. 우리는 그들을 제거하기 위한 작전을 개시할 것이며, 반은 지난 수년간 그곳에 남아 있던 위협에서 해방될 것입니다."
 TUR_PKK_ACTIVITY: "활동 중인 £TUR_Neutral_Communism  PKK 반군"
 TUR_PKK_ACTIVITY_desc: "PKK는 "
 TUR_misak_mili: "밀리 서약"
 TUR_misak_mili_desc: "\n£TUR_desctext_misak \n\n\n\n\n§HMisak-ı Millî§!(국민 서약)는 1920년대에 의회에서 채택된 여섯 가지 결의안입니다. 엔텐테에 의한 [TUR.GetFlag] 오스만 제국의 붕괴 이후 본격적으로 활기를 띤 §H국민 서약§!은 튀르키예의 잃어버린 영광과 영토를 되찾고자 하였습니다. 그러나 [TUR.GetFlag] 튀르키예 독립 전쟁과 무스타파 케말 아타튀르크의 [TUR.GetFlag] 튀르키예 공화국 수립으로 인해 이 결의안은 끝내 실행되지 못하였습니다. 그럼에도 §H국민 서약§!의 개념과 이상은 국민 전반의 폭넓은 지지를 얻지는 못하였으나 오늘날에도 많은 [TUR.GetFlag] 튀르키예 민족주의자들의 마음속에 울림을 주고 있습니다."
 TUR_armenian_integration: "[ARM.GetFlag] 아르메니아로의 복귀"
 TUR_levantine_vilayets: "[SYR.GetFlag] [LEB.GetFlag] 레반트 빌라예트"
 TUR_eastern_resolve: "[KUR.GetFlag] [PUK.GetFlag] 동부의 결의"
 TUR_aegean_realignment: "[GRE.GetFlag] 에게해 재편"
 TUR_crescent_and_olive: "[CYP.GetFlag] [NCY.GetFlag] 초승달과 올리브"
 TUR_kurdish_schools: "쿠르드어 학교 및 대학"
 TUR_kurdish_schools_desc: "필요하다고 판단되는 특정 학교와 도시에서 튀르키예어와 함께 쿠르드어를 사용할 수 있도록 허용할 것입니다. 이중 언어로 자랐든 아니든 특히 젊은 세대에게 도움이 될 것입니다."
 TUR_kurdish_language_5: "쿠르드어 국영 채널"
 TUR_kurdish_language_5_desc: "TRT(Türkiye Radyo Televizyon, 튀르키예 라디오 텔레비전)는 1968년부터 우리의 국영 방송이었습니다. 해가 갈수록 규모가 커져 현재는 여러 TRT 채널이 있으며, 일부는 일반 주제를 다루고 TRT-뮤직은 음악만, TRT-벨게셀은 다큐멘터리만 방송합니다. 쿠르드어로 운영되는 새 채널을 개설해야 합니다. 비용이 더 들 수 있으나 PKK의 선전을 한층 더 무력화할 것입니다."
 TUR_finalized_reforms: " 개혁을 완료하였음"
 TUR_fight_army_incompetence: "예스맨 군대"
 TUR_fight_army_incompetence_desc: "우리 군은 \\"예, 알겠습니다\\"라고 말하는 사람은 더 많아지고 \\"아니오\\"라고 말하는 사람은 더 적어지도록 개혁되고 재편될 것입니다."
 Turkish_mafia.1200.t: "PKK 반군 소탕"
 Turkish_mafia.1200.d: "우리 보안군은 쿠르드 지역 전역에서 작전을 완료했습니다. 튀르키예 영토를 위협하는 PKK의 능력은 꺾였으며 질서가 회복되고 있습니다."
 Turkish_mafia.1200.a: "이곳에서 우리의 임무는 끝났다."
 Turkish_parties.11.t: "권리와 평등당"
 Turkish_parties.11.d: "남동부에서의 지휘로 명성을 얻었으며 지지자들에게 '전설적인 지휘관'으로 알려진 퇴역 장군 오스만 파무쿠올루가 권리와 평등당(HEPAR)을 창당했습니다. 이 당은 확고한 세속적 케말주의와 쿠르드 문제에 대한 강경 노선을 결합하여, 기성 정당들에 물들지 않은 민족주의 대안으로 자신을 내세우고 있습니다."
 Turkish_parties.11.a: "새로운 세력이 무대에 등장하다"
 TUR_PKK_TT: "£decision_icon_small §Y잠금 해제§!: 쿠르디스탄 문제에 대한 추가 §Y결정§!\n - 이 선택지를 택하면 이웃 나라들을 우리 편으로 유지하면서 PKK에 맞설 수 있습니다.\n - [PER.GetFlag] 이란, [SYR.GetFlag] 시리아, [IRQ.GetFlag] 이라크와 [KUR.GetFlag] 쿠르드인들이 디야르바키르에서 열리는 안보 정상회의에 초청됩니다.\n - 참석하는 모든 이웃 나라가 PKK를 약화시키는 것을 도와줍니다."
 TUR_ai_build_the_akp: "정의개발당 창당"
 TUR_ai_build_the_akp_desc: "미덕당 개혁파의 잔당이 새로운 운동을 조직하고 있으며, 그 배후의 조직은 선거구마다 차근차근 구축되고 있습니다."
 TUR_ai_rally_the_kemalists: "공화주의 진영 결집"
 TUR_ai_rally_the_kemalists_desc: "공화주의 기득권층이 결속을 다지고 세속주의 정당들이 선두를 유지하도록 강력한 선거 운동을 벌이고 있습니다."
 TUR_ai_rally_the_grey_wolves: "민족주의 운동 결집"
 TUR_ai_rally_the_grey_wolves_desc: "민족주의 운동이 지방에서 조직화되고 있으며, 그들의 집회는 기성 정당들이 더 이상 따라잡을 수 없는 군중을 끌어모으고 있습니다."
 TUR_ai_build_hizmet: "히즈메트 네트워크 확장"
 TUR_ai_build_hizmet_desc: "이 운동의 학교, 신문, 기업 협회는 어떤 정당 명부에도 아직 반영되지 않은 지지 기반을 조용히 쌓아 가고 있습니다."
 TUR_ai_rally_the_left: "튀르키예 좌파 결집"
 TUR_ai_rally_the_left_desc: "혁명적 좌파가 노동조합과 대학에서 조직화되고 있으며, 이슬람주의자들이 의존해 온 반체제 표를 가져가고 있습니다."
 TUR_ai_rally_the_virtue_party: "미덕당 결집"
 TUR_ai_rally_the_virtue_party_desc: "이슬람주의 운동이 미덕당 뒤로 결집하고 있으며, 집권에 필요한 표를 모으고 있습니다."
 TUR_ai_rally_the_great_east: "대동방 설교"
 TUR_ai_rally_the_great_east_desc: "이 운동의 설교자들은 네집 파즐의 복원된 이슬람 질서에 대한 비전을 모스크와 당의 일반 당원들에게 전하고 있습니다."
 TUR_pkk.605.t: "남동부에서의 재개된 공세"
 TUR_pkk.605.d: "정부가 다른 곳을 바라보는 사이 PKK는 수년간 산악 지대에서 재건에 힘썼으며, 참모부는 더 이상 기다리지 않을 것입니다. 남동부 지방 전역에 비상사태가 선포되었고 예비군이 소집되고 있으며 군은 계곡으로 대규모로 진입하고 있습니다. 반군은 관리 가능한 규모로 다시 격파될 것이나, 징집병과 리라, 그리고 국내에서의 정부 입지라는 면에서 대가는 무거울 것입니다."
 TUR_pkk.605.a: "무슨 수를 써서라도."
 TUR_PKK_OFFENSIVE_TT: "£TUR_Neutral_Communism  §OPKK 반군§!은 관리 가능한 수준으로 다시 격퇴되지만, 완전히 파괴되지는 않습니다."
 TUR_fund_oil_strikes: "석유 산업 파업 자금 지원"