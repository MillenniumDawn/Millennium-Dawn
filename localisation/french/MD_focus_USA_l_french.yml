 USA_spacex_cadence_champion: "Cadence d’accès assuré"
 USA_spacex_cadence_champion_desc: "Les opérations de lancement livrent un accès prévisible et fréquent à l'orbite, la fiabilité étant traitée comme une discipline industrielle plutôt qu'un jalon."
 USA_spacex_allied_leo_connectivity: "Connectivité orbitale alliée"
 USA_spacex_allied_leo_connectivity_desc: "Un tissu de communications en orbite basse partagé avec les alliés relève résilience et interopérabilité, et fait de la constellation elle-même un instrument de politique."
 USA_spacex_deep_space_stack: "Filière industrielle de l'espace lointain"
 USA_spacex_deep_space_stack_desc: "Le lancement lourd, les opérations en orbite et la logistique d'exploration ont grandi ensemble en un système industriel connecté."
 USA_spacex_commercial_monopoly_risk: "Marché de lancement concentré"
 USA_spacex_commercial_monopoly_risk_desc: "Le pouvoir de marché s'est concentré chez un seul fournisseur, amincissant la pression concurrentielle et compliquant à la fois marchés publics et politique."
 USA_spacex_mixed_provider_ecosystem: "Marché mixte de prestataires"
 USA_spacex_mixed_provider_ecosystem_desc: "Un marché résilient à plusieurs fournisseurs équilibre cadence de vol, concurrence et assurance pour les missions nationales."
