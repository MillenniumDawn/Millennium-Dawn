 UKR_delta: "Le Delta"
 UKR_delta_desc: "Le système ukrainien de soutien informationnel aux décisions et de conscience situationnelle sur le champ de bataille a accès au programme pour les militaires actifs qui ont passé la vérification. La connexion se fait via Internet par autorisation et authentification à deux facteurs sur un site spécial.\n\nLes utilisateurs autorisés peuvent consulter et saisir des données sur les positions ennemies connues, les aéronefs ennemis repérés, l'équipement terrestre, et plus encore."
 UKR_oplit: "Centre étatique de recherche et de conception navale"
 UKR_oplit_desc: "Le T-84 est un char de combat principal ukrainien, basé sur le CCP soviétique T-80 introduit en 1976, spécifiquement la version à moteur diesel : T-80UD. Le T-84 a d'abord été construit en 1994 et est entré en service dans les Forces armées ukrainiennes en 1999.\n\nSon moteur à pistons opposés haute performance en fait un char rapide, comparable aux autres CCP modernes avec un rapport puissance-poids d'environ 26 chevaux par tonne."
 UKR_sapsan: "Hrim-2"
 UKR_sapsan_desc: "Système de missiles balistiques à courte portée ukrainien développé par KB Pivdenne et PA Pivdenmash, conçu pour combiner les caractéristiques d'un système de missiles tactiques et d'un lance-roquettes multiple.\n\nLa version originale Sapsan du missile, pour l'usage propre de l'Ukraine, devait avoir une portée de 500 kilomètres. La version ultérieure Hrim-2, développée pour l'exportation, a une portée limitée à 280 kilomètres, afin de rester dans la limite de 300 kilomètres fixée par le Régime de contrôle de la technologie des missiles, qui cherche à limiter la prolifération des missiles et de la technologie des missiles."
 UKR_our_ukraine_helsi: "Helsi"
 UKR_our_ukraine_helsi_desc: "Helsi : système d'information médicale pour les établissements de santé et portail médical pour les patients en Ukraine."
 UKR_our_ukraine_dia: "Dia"
 UKR_our_ukraine_dia_desc: "Service électronique ukrainien de services publics, développé par le ministère de la Transformation numérique de l'Ukraine. C'est un site web et une application mobile avec des documents numériques, la possibilité de signature numérique et de vérification, ainsi qu'un portail de services publics."
 UKR_tsnap: "TSNAP"
 UKR_tsnap_desc: "Ce sont des institutions où différents groupes de personnes peuvent recevoir un large éventail de services administratifs dans un environnement confortable. Elles sont créées par les conseils locaux et les administrations d'État locales et servent les personnes physiques et morales."
 UKR_monobank: "Monobanque"
 UKR_monobank_desc: "Monobank est une banque directe ukrainienne. Comme toutes les néobanques existantes en Ukraine, elle fonctionne en utilisant une licence bancaire d'une banque mère, à savoir Universal Bank, qui fait partie du groupe TAS et appartient à l'homme d'affaires ukrainien Serhiy Tihipko."
 UKR_tsnap_idea: "TSNAP"
 UKR_bronetank: "Usine de blindés de Kharkiv"
 UKR_bronetank_desc: "L'entreprise d'État de l'industrie blindée, qui effectue la production, la réparation, l'entretien, le rééquipement et la modernisation des véhicules blindés."
 UKR_avia_zavod: "Usine aéronautique de Kharkiv"
 UKR_avia_zavod_desc: "L'entreprise d'ingénierie aéronautique de la ville de Kharkiv. Elle produit des aéronefs de passagers, de transport et militaires."
 UKR_priborostroy: "Usine de fabrication d'instruments de Kharkiv"
 UKR_priborostroy_desc: "L'une des plus grandes usines de l'URSS pour la production d'électronique militaire et d'équipements électriques domestiques."
 UKR_tractor: "Usine de tracteurs de Kharkiv"
 UKR_tractor_desc: "Une entreprise de production de tracteurs à chenilles et à roues."
 UKR_agregat: "Bureau de conception des agrégats de Kharkiv"
 UKR_agregat_desc: "Une entreprise scientifique et de production du complexe militaro-industriel, qui développe et fabrique des unités pour les systèmes hydrauliques, de carburant et électriques de la technique aéronautique et fusée."
 UKR_morozova: "Bureau d'ingénierie de Kharkiv"
 UKR_morozova_desc: "Entreprise développant des véhicules blindés. Auparavant, le KP KKBM a joué un rôle clé dans la création de véhicules blindés à chenilles de l'Union soviétique."
 UKR_specmachine: "Usine de machines spéciales de Kharkiv"
 UKR_specmachine_desc: "Entreprise d'État du complexe militaro-industriel."
 UKR_malichev: "Usine Malychev"
 UKR_malichev_desc: "Usine d'ingénierie des transports à Kharkiv, qui produit des moteurs, des locomotives et des chars."
 UKR_reborn_ser_and_molot: "Relancer l'usine « Marteau et Faucille »"
 UKR_reborn_ser_and_molot_desc: "Une grande entreprise de machines agricoles à Kharkiv ; c'était l'une des entreprises les plus importantes de l'industrie de Kharkiv et l'une des plus grandes entreprises de machines agricoles de l'Empire russe et de l'URSS."
 UKR_concers: "Consortium de défense de Kharkiv"
 UKR_concers_desc: "Nous regrouperons toutes nos entreprises de l'industrie militaire en un seul consortium. Cela renforcera la coordination de la production et augmentera la productivité."
 UKR_concern: "Industrie militaire de Kharkiv"
 UKR_zaporozhia_gold: "Mine d'or de Moujievo"
 UKR_zaporozhia_gold_desc: "Nous attirerons enfin des investisseurs et commencerons à développer ces mines avec des gisements d'or."
 UKR_opfl_small_med_business: "Avantages pour les petites et moyennes entreprises"
 UKR_opfl_small_med_business_desc: "Les petites et moyennes entreprises sont une partie importante de notre économie. Pour plus de croissance, nous devons offrir des incitations afin que les gens soient motivés à entreprendre."
 UKR_neutrality_neutral_social_are_in_coalition_TT: "Le SPU n'est pas dans une coalition"
 UKR_idea_orthodox_christian_church: "Église orthodoxe ukrainienne"
 UKR_separatist_menace: "La menace séparatiste"
 UKR_separatist_menace_desc: "La menace des républiques séparatistes n'est pas encore réglée ; nous devons y mettre fin."
 UKR_polish_liberation_battalions: "L'Armée polonaise de libération"
 UKR_polish_liberation_battalions_desc: "De nombreux résidents polonais sont prêts à combattre de notre côté, contre le gouvernement qui, selon eux, a occupé le pays."
 UKR_economy_shortcut: "Économie"
 UKR_security_and_expansion_shortcut: "Sécurité et expansion"
 UKR_military_shortcut: "Militaire"
 UKR_politics_shortcut: "Politique"
 UKR_fedrada_category: "Chambre fédérale"
 UKR_fedrada_category_desc: "La Rada fédérale est un organe gouvernemental de l'Ukraine fédéralisée, créé pour l'interaction des sujets de la Fédération avec le centre fédéral.\n\nLes §Ysujets de la Fédération ukrainienne§! peuvent être §Gannexés§! par [UKR.GetFlag]l'Ukraine, sous réserve d'une §Yinfluence§! sur les sujets à hauteur de §Y50 %§!"
 ukraine_maidan_east.4.b: "Faire escorter les députés"
 UKR_maidan_temporary_attack_idea_desc: "L'agitation dans les rues galvanise les forces militaires, renforçant temporairement la préparation au combat."
 ukraine_maidan_overthrow.1.t: "Gouvernement renversé"
 ukraine_maidan_overthrow.1.d: "Notre gouvernement a été renversé. Le candidat des manifestants a été porté au pouvoir.\nSon orientation est :"
 ukraine_maidan_overthrow.1.a: "£democratic_group_small $democratic$"
 ukraine_maidan_overthrow.1.b: "£communism_group_small $communism$"
 ukraine_maidan_overthrow.1.c: "£neutrality_group_small $neutrality$"
 ukraine_maidan_overthrow.1.e: "£nationalist_group_small $nationalist$"
 ukraine_maidan_overthrow.2.t: "Gouvernement renversé — un nouveau président"
 ukraine_maidan_overthrow.2.d: "Le candidat des manifestants a été porté au pouvoir. Son parti est :"
 ukraine_maidan_overthrow.2.e: "Retour au menu des orientations"
 ukraine_maidan_crm_annex.1.t: "L'annexion de la Crimée"
 ukraine_maidan_crm_annex.1.d: "The Crimean peninsula has been annexed by Russia. What should we do next?"
 ukraine_maidan_crm_annex.1.a: "Nous nous retirerons pour l'instant"
 ukraine_maidan_crm_annex.1.b: "Nous nous battrons pour la Crimée"
 UKR_idea_government_in_need_desc: "Le gouvernement ukrainien est miné par une corruption et une inefficacité rampantes. Les coûts administratifs sont doublés par le pot-de-vin, tandis qu'une mauvaise gouvernance pèse sur la productivité industrielle et la capacité politique."
 UKR_modernization: "Modernisation ukrainienne"
 UKR_modernization_desc: "Une fois l'économie et l'État stabilisés, il faut moderniser notre économie. Avant qu'il ne soit trop tard."
 UKR_agriculture: "Moderniser l’agriculture"
 UKR_agriculture_desc: "L'Ukraine est l'un des plus grands producteurs et exportateurs agricoles du monde et est connue comme le grenier de l'Europe. Parce qu'elle possède 30 % des terres noires les plus riches du monde, son industrie agricole a un énorme potentiel. Avec quelques investissements, ce potentiel pourrait être exploité."
 UKR_nibulon: "Nibulon"
 UKR_nibulon_desc: "Nibulon est une société agricole ukrainienne spécialisée dans la production et l'exportation de céréales telles que le blé, l'orge et le maïs. Son siège est à Mykolaïv. C'est la seule entreprise agricole d'Ukraine à posséder sa propre flotte et son propre chantier naval."
 UKR_pr_jsc_mhp: "PrJSC MHP"
 UKR_pr_jsc_mhp_desc: "PrJSC MHP, Myronivsky Hliboproduct, est le plus grand producteur de volaille d'Ukraine et l'un de ses plus importants holdings agro-industriels. Un soutien de l'État à son expansion fera croître notre industrie de transformation alimentaire et l'emploi rural."
 UKR_fozzy: "Groupe Fozzy"
 UKR_fozzy_desc: "Fozzy Group, LLC est l'un des plus grands groupes commerciaux et industriels d'Ukraine, basé à Kiev, et l'un des principaux détaillants ukrainiens avec plus de 700 points de vente dans tout le pays. Outre le commerce de détail, il a des intérêts dans l'agroalimentaire, la banque, l'informatique, la logistique et la restauration."
 UKR_fin_it: "Moderniser l’économie"
 UKR_fin_it_desc: "Donner instruction aux ministères concernés d'aider à moderniser notre secteur privé, en particulier la finance et l'informatique."
 UKR_privatbank: "Banque Privée"
 UKR_privatbank_desc: "PrivatBank est la plus grande banque ukrainienne en termes d'actifs et le leader du marché bancaire de détail ukrainien. Elle a été enregistrée le 19 mars 1992. L'État doit intervenir pour les profits futurs."
 UKR_it: "Créer une industrie informatique ukrainienne"
 UKR_it_desc: "Si le secteur informatique croît dans notre pays, il pourrait avoir besoin d'investissements pour le rester."
 UKR_it_2: "Développer l’industrie informatique ukrainienne"
 UKR_it_2_desc: "Il semble que notre industrie informatique puisse être un facteur clé de notre économie. Avec l'aide d'investissements bien placés, bien sûr."
 UKR_ukrtelekom: "Ukrtelecom"
 UKR_ukrtelekom_desc: "L'Ukrtelecom d'État nous aidera à étendre plus vite la capacité de notre réseau."
 UKR_kyivstar: "Kievstar"
 UKR_kyivstar_desc: "Kyivstar is one of the largest Ukrainian telecommunications companies, providing communication services and data transmission based on a broad range of fixed and mobile technologies, including 4G (LTE) services, in Ukraine. "
 UKR_digital_education: "Éducation numérique"
 UKR_digital_education_desc: "Les compétences numériques sont vitales pour les individus au XXIe siècle. Investir à la fois dans l'éducation numérique et dans la numérisation de l'enseignement portera ses fruits avec le temps. Il ne faut pas oublier les générations plus âgées : leur formation est un investissement dans le présent."
 UKR_dig_sta: "État numérique ukrainien"
 UKR_dig_sta_desc: "Diia (ukrainien : Дія, litt. « Action » ; aussi un acronyme de Держава і Я, litt. « L'État et moi ») est une application mobile, un portail web et une marque de e-gouvernance en Ukraine. Lancée en 2020, l'application Diia permet aux citoyens ukrainiens d'utiliser des documents numériques sur leur smartphone à la place des documents physiques pour l'identification et le partage.\n\nLe portail Diia donne accès à plus de 50 services gouvernementaux. À terme, le gouvernement prévoit de rendre toutes les interactions État-personne disponibles via Diia."
 UKR_tax_avoidance: "Résoudre le problème de l'évasion fiscale"
 UKR_tax_avoidance_desc: "Nous avons désormais les outils pour affronter localement un énorme problème mondial : l'évitement fiscal des entreprises comme des particuliers.\n« Si l'impôt peut être négligé, et même mal aimé, en réalité c'est notre superpouvoir social. L'impôt nous permet de choisir d'organiser nos communautés, au niveau local et national, pour que nous puissions tous mieux vivre, ensemble. Mais un obstacle fondamental est la facilité avec laquelle les élites puissantes se soustraient à leurs obligations sociales — à leurs responsabilités envers les sociétés dont elles font partie, et dont elles tirent profit. » - Rapport sur la justice fiscale 2023"
 UKR_energy: "Stratégie énergétique de l'Ukraine"
 UKR_energy_desc: "Il est temps d'analyser le potentiel d'amélioration des systèmes d'approvisionnement électrique de la nation et de lancer un programme de modernisation énergétique résidentielle."
 UKR_ukrenergo: "Ukrenergo"
 UKR_ukrenergo_desc: "Ukrenergo est un opérateur de système de transport d'électricité en Ukraine et le seul opérateur des lignes de transport à haute tension du pays. L'entreprise peut rendre l'ensemble du réseau encore plus efficace."
 UKR_nuc_ener: "Énergoatome"
 UKR_nuc_ener_desc: "Energoatom est une entreprise d'État exploitant les quatre centrales nucléaires d'Ukraine (centrale de Zaporijjia, de Rivne, d'Ukraine du Sud et de Khmelnytskyï). C'est le plus grand producteur d'électricité d'Ukraine."
 UKR_nuc_ener_2: "Augmenter la capacité nucléaire"
 UKR_nuc_ener_2_desc: "Sur la base d'un contrat avec Westinghouse, la société américaine construira deux nouveaux blocs à la centrale de Khmelnytskyï et deux autres à la centrale nucléaire de Tchyhyryne, à Tcherkassy, enfin achevée et relancée."
 UKR_green_ener: "Stratégie d'énergie verte"
 UKR_green_ener_desc: "Après avoir promu les énergies renouvelables, il faut examiner notre potentiel dans le domaine non nucléaire."
 UKR_ukrhydroenergo: "Ukrainehydroénergie"
 UKR_ukrhydroenergo_desc: "Ukrhydroenergo est une entreprise d'État ukrainienne qui administre de nombreuses grandes centrales hydroélectriques le long du Dniepr et du Dniestr. C'est le principal producteur d'hydroélectricité d'Ukraine."
 UKR_solar: "Construire des centrales solaires"
 UKR_solar_desc: "Nos régions du sud sont parmi les plus ensoleillées d'Europe de l'Est, donc les plus adaptées à la construction de centrales solaires."
 UKR_wind: "Promouvoir les parcs éoliens"
 UKR_wind_desc: "Il existe dans notre pays des lieux adaptés à une production d'électricité à haut rendement par éoliennes."
 UKR_biomass: "Investir dans les centrales à biomasse"
 UKR_biomass_desc: "Seeing the success of private investments in Biomass Plants, the state has to provide funds to build such facilities."
 UKR_min_env_prot: "Ministère de la protection de l'environnement de l'Ukraine"
 UKR_min_env_prot_desc: "The Ministry is the main authority in the system of central government of Ukraine responsible for ecological monitoring and development of the country. One of the main tasks is to develop the communal waste disposal system."
 UKR_waste_manangement_2: "Établir un système de recyclage"
 UKR_waste_manangement_2_desc: "Now the communal waste collection was finally resolved, it was time to lay the foundations and establish the system of the recyclable material collection. It needed a lot of time and effort, but the effects are already visible."
 UKR_waste_manangement_3: "Modernisation du système de gestion des déchets"
 UKR_waste_manangement_3_desc: "The established system must be made more efficient and has to reach even the most remote corners of the country. Modern waste management will benefit everyone, both the public and the environment."
 UKR_forestry: "Contrôler la foresterie ukrainienne"
 UKR_forestry_desc: "Almost 20% of the country is covered by forests. To keep it like this and avoid deforestation we must invest in forestry as an investment in the future."
 UKR_tourism: "Investir dans le tourisme"
 UKR_tourism_desc: "Le tourisme peut être une grande opportunité pour n'importe quel pays. Avant tout, il faut mettre en place la bonne infrastructure."
 UKR_nat_wonders: "Merveilles naturelles ukrainiennes"
 UKR_nat_wonders_desc: "En 2008, sept des nombreux sites pittoresques d'Ukraine ont été choisis par un vote. Ces sites seront les porte-étendards des paysages divers de notre pays."
 UKR_wonders: "Merveilles ukrainiennes"
 UKR_wonders_desc: "Sept des nombreux monuments historiques et culturels d'Ukraine ont été choisis par un vote en 2007. Ces sites seront les porte-étendards du patrimoine bâti de notre pays."
 UKR_world_heritage: "Sites du patrimoine mondial ukrainien"
 UKR_world_heritage_desc: "En 2005, l'Ukraine compte trois sites du patrimoine mondial, mais la liste s'allongera avec le temps, plusieurs sites figurant déjà sur la liste indicative.\n\nLe patrimoine culturel se compose de monuments (œuvres architecturales, sculptures monumentales ou inscriptions), de groupes de bâtiments et de sites (y compris archéologiques). Le patrimoine naturel est défini comme des éléments naturels (formations physiques et biologiques), des formations géologiques et physiographiques (y compris les habitats d'espèces menacées) et des sites naturels importants du point de vue de la science, de la conservation ou de la beauté naturelle."
 UKR_health_tourism: "Promouvoir le tourisme de santé ukrainien"
 UKR_health_tourism_desc: "Comme les services de santé du pays sont au niveau des normes occidentales, mais généralement à un prix moindre, il peut être bénéfique d'investir dans le tourisme de santé."
 UKR_corruption_reforms: "Réformes anticorruption"
 UKR_corruption_reforms_desc: "La corruption est un problème de la société ukrainienne qui remonte à la dissolution de l'Union soviétique en 1991. Après l'indépendance, l'Ukraine a vu une série de politiciens de tous bords, ainsi que des parrains du crime et des oligarques, utiliser la corruption de la police, des partis et de l'industrie pour conquérir le pouvoir.\n\nIl est temps de changer cela !"
 UKR_corruption_edu: "Combattre la corruption dans l'éducation"
 UKR_corruption_edu_desc: "Selon une enquête de Transparency International réalisée en 2008, 47,3 % des étudiants universitaires ont déclaré qu'un pot-de-vin leur avait été demandé ; parmi eux, 29 % l'avaient versé de leur plein gré. Les étudiants pouvaient « acheter » une entrée à l'université, des résultats d'examens, la notation de thèses de doctorat et/ou de master."
 UKR_corruption_health: "Combattre la corruption dans la santé"
 UKR_corruption_health_desc: "Bien que les soins médicaux dans les hôpitaux publics soient théoriquement gratuits pour les Ukrainiens, le versement d'argent par les patients pour s'assurer de recevoir le traitement nécessaire était répandu au début du XXIe siècle.\n\nEn 2012, des groupes de défense ont accusé des responsables du ministère de la Santé de détourner de l'argent destiné au traitement des patients sidéens en achetant des médicaments à des prix largement gonflés, puis en touchant des rétrocommissions."
 UKR_corruption_police: "Combattre la corruption dans la police"
 UKR_corruption_police_desc: "Combattre la corruption au sein des forces de l'ordre ukrainiennes pour rétablir la confiance du public et une police efficace."
 UKR_corruption_armed_forces: "Combattre la corruption dans les forces armées d'Ukraine"
 UKR_corruption_armed_forces_desc: "Purger la corruption des forces armées pour améliorer la discipline et l'efficacité militaires."
 UKR_corruption_justice: "Combattre la corruption judiciaire"
 UKR_corruption_justice_desc: "Au début des années 2010, des politiciens et analystes ukrainiens décrivaient le système judiciaire comme « pourri jusqu'à la moelle » et se plaignaient des pressions politiques sur les juges et de la corruption. Des avocats indépendants et des défenseurs des droits de l'homme se plaignaient que les juges ukrainiens subissaient régulièrement des pressions pour rendre un verdict donné.\n\nLe système judiciaire ukrainien était largement considéré comme corrompu. Une enquête du ministère de la Justice en 2009 révélait que seuls 10 % des personnes interrogées faisaient confiance au système judiciaire national."
 UKR_corruption_spec_public_prosecutor: "Parquet spécialisé anticorruption"
 UKR_corruption_spec_public_prosecutor_desc: "Le parquet spécialisé anticorruption est une unité structurelle indépendante du procureur général d'Ukraine, principalement chargée d'appuyer et de superviser les enquêtes pénales lancées par le Bureau national anticorruption d'Ukraine (NABU)."
 UKR_corruption_court: "Haute cour anticorruption d'Ukraine"
 UKR_corruption_court_desc: "Établir un tribunal anticorruption indépendant pour poursuivre les affaires de corruption de haut niveau et récupérer les actifs de l'État volés."
 UKR_corruption_asset_rec: "Récupération d'actifs"
 UKR_corruption_asset_rec_desc: "La récupération d'actifs, telle qu'elle est définie dans la Convention des Nations unies contre la corruption (chapitre V de la CNUCC), désigne le processus par lequel le produit de la corruption transféré à l'étranger est récupéré et rapatrié vers le pays d'origine ou vers ses ayants droit."
 UKR_corruption_gov: "Assainir le gouvernement du pays"
 UKR_corruption_gov_desc: "Instituer des réformes d'ampleur pour éliminer la corruption au sein de l'administration et rétablir l'intégrité institutionnelle."
 UKR_end_kleptokracy: "Parachever les réformes anticorruption"
 UKR_end_kleptokracy_desc: "Avec toutes ces réformes, l'ampleur de la corruption peut être facilement réduite et la société pourra vivre sans ses effets étouffants."
 UKR_health_reform: "Lancer des réformes des soins de santé"
 UKR_health_reform_desc: "Les soins de santé ukrainiens devraient être gratuits pour les citoyens selon la loi, mais en pratique les patients contribuent au coût de la plupart des aspects des soins."
 UKR_health_smoke_alc: "Réduire le tabagisme et la consommation d'alcool"
 UKR_health_smoke_alc_desc: "Lancer des campagnes de santé publique pour réduire le tabagisme et la consommation d'alcool, s'attaquant aux principales causes de maladies évitables."
 UKR_hiv_aids: "VIH/sida en Ukraine"
 UKR_hiv_aids_desc: "En 2001, un plan national de lutte contre le VIH/sida a été approuvé ; ses objectifs comprenaient la prévention de la propagation du VIH, le développement de la capacité à traiter les personnes infectées, et le soutien social et le conseil pour les personnes vivant avec le VIH/sida."
 UKR_vaccination: "Programme de vaccination"
 UKR_vaccination_desc: "Étendre les programmes de vaccination à l'échelle nationale pour prévenir les épidémies de maladies infectieuses et améliorer l'immunité de la population."
 UKR_mental_health: "Programme de santé mentale"
 UKR_mental_health_desc: "Développer les services de santé mentale et les systèmes de soutien pour faire face à la hausse des troubles psychologiques dans la population."
 UKR_health_infra: "Amélioration des infrastructures de santé"
 UKR_health_infra_desc: "Moderniser et étendre l'infrastructure de santé, en améliorant les établissements médicaux à travers la nation."
 UKR_health_equipment: "Programme d'achat d'équipement médical"
 UKR_health_equipment_desc: "Acquérir du matériel médical moderne et des outils de diagnostic pour renforcer la prestation des soins et les capacités de traitement."
 UKR_health_prevention: "Programme de dépistage médical"
 UKR_health_prevention_desc: "Établir des programmes de dépistage médical complets pour détecter tôt les affections et améliorer les soins préventifs."
 UKR_health_rehabilitaion: "Programme national de réadaptation"
 UKR_health_rehabilitaion_desc: "Développer des établissements de rééducation pour les citoyens blessés et handicapés, y compris le personnel militaire, afin de rétablir la qualité de vie."
 UKR_health_recreational_infra: "Améliorer les infrastructures de loisirs"
 UKR_health_recreational_infra_desc: "Investir dans des installations de loisirs et des espaces publics pour promouvoir l'activité physique et améliorer la santé publique."
 UKR_health_final: "Terminer les réformes des soins de santé"
 UKR_health_final_desc: "Achever la transformation du système de santé pour atteindre les normes occidentales de soins médicaux et de résultats sanitaires."
 UKR_edu_plan: "Planifier les réformes éducatives"
 UKR_edu_plan_desc: "Bien que l'éducation dans notre pays soit d'une qualité relativement élevée, il y a des domaines à améliorer pour maintenir ou élever cette qualité. Nous devons nous préparer à la transformation numérique en cours dans le monde."
 UKR_edu_infra: "Améliorer les infrastructures éducatives"
 UKR_edu_infra_desc: "Moderniser les établissements scolaires et les bâtiments pour créer des environnements d'apprentissage modernes."
 UKR_edu_ped_uni: "Soutenir les universités pédagogiques"
 UKR_edu_ped_uni_desc: "Renforcer les universités pédagogiques pour améliorer la formation des enseignants et la qualité de l'enseignement à l'échelle nationale."
 UKR_edu_universities: "Soutenir les universités"
 UKR_edu_universities_desc: "Fournir des ressources et un soutien supplémentaires aux établissements d'enseignement supérieur pour renforcer la recherche académique et l'innovation."
 UKR_edu_infra_2: "Améliorer les infrastructures éducatives : niveau suivant"
 UKR_edu_infra_2_desc: "Poursuivre la modernisation des établissements éducatifs avec des technologies modernes et une infrastructure d'apprentissage avancée."
 UKR_edu_final: "Finaliser les réformes éducatives"
 UKR_edu_final_desc: "Achever la transformation éducative pour atteindre des normes mondiales d'apprentissage et de progrès scientifique."
 UKR_bmz: "BMZ"
 UKR_bmz_desc: "L'usine de construction de machines de Berdytchiv (aussi connue comme l'usine Progress) est une entreprise de construction mécanique dans la ville de Berdytchiv, dans l'oblast de Jytomyr, en Ukraine."
 UKR_nkmz: "NKMZ"
 UKR_nkmz_desc: "Novokramatorsky Mashynobudivny Zavod (Nouvelle usine de construction de machines de Kramatorsk) est un grand fabricant d'équipements lourds en Ukraine. L'entreprise produit du matériel minier, métallurgique, des laminoirs, forges, hauts fourneaux, concasseurs de minerai, presses et autres équipements de procédés industriels.\n\nL'entreprise fabrique des arbres d'hélice pour brise-glaces et des composants pour sous-marins. Selon son site, elle a conçu et construit plus de 18 complexes miniers."
 UKR_oil_mining: "Extraction de pétrole"
 UKR_oil_mining_desc: "Développer de nouvelles installations d'extraction pétrolière pour accroître la production énergétique intérieure et réduire la dépendance aux approvisionnements étrangers."
 UKR_mining2: "Extraction améliorée des ressources"
 UKR_mining2_desc: "Étendre les opérations minières pour accroître l'extraction de chrome, de tungstène et d'autres minéraux stratégiques."
 UKR_construction_kovalska: "Kovalska"
 UKR_construction_kovalska_desc: "ICG Kovalska, LLC est un promoteur et fabricant ukrainien de matériaux de construction.\n\nProduction : béton, mélanges de béton, solutions de construction, produits en béton armé classiques et individuels, produits muraux en béton d'argile expansée, béton cellulaire, dalles de pavage, mélanges secs de construction, matériaux en dispersion aqueuse (peintures, enduits décoratifs, mousses, colles)."
 UKR_train_prod: "Production de trains"
 UKR_train_prod_desc: "L'usine de wagons de Krioukov est une grande entreprise industrielle à Krementchouk, en Ukraine, fabriquant des locomotives et des rames automotrices."
 UKR_kharkiv_tractor: "HTZ"
 UKR_kharkiv_tractor_desc: "Kharkiv Tractor Plant (KhTZ or HTZ) is an agricultural machinery manufacturer in the Ukrainian city of Kharkiv. Established in 1930-31, as a centerpiece of Stalin's First Five-Year Plan for Soviet industrialization (1928-32), KhTZ was Ukraine's largest tractor manufacturer, producing both wheeled and tracked tractors.\n\nIn 1994, two years after the collapse of the Soviet Union and the independence of Ukraine, the plant was transformed into an open joint stock company. Producing tractors, including general purpose wheeled tractors."
 UKR_agriculture2: "Moderniser l’agriculture : niveau supérieur"
 UKR_agriculture2_desc: "Mettre en œuvre des techniques agricoles avancées et étendre la production céréalière pour cimenter la position de l'Ukraine comme fournisseur alimentaire mondial."
 UKR_chumak: "Chumak"
 UKR_chumak_desc: "Chumak (ukrainien : Чумак) est une entreprise agroalimentaire suédo-ukrainienne à Kakhovka, dans l'oblast de Kherson. Parmi ses produits : ketchup, mayonnaise, pâtes, vinaigrettes, sauces de cuisine, légumes en conserve, légumes marinés, jus de tomate et huile de tournesol."
 UKR_gsc_game_world: "GSC"
 UKR_gsc_game_world_desc: "GSC Game World est un studio ukrainien de développement de jeux vidéo. Fondé à Kiev en 1995 par Sergiy Grygorovych, il est surtout connu pour les séries Cossacks et S.T.A.L.K.E.R."
 UKR_national_bank: "Banque nationale d'Ukraine"
 UKR_national_bank_desc: "Selon la Constitution de l'Ukraine, la fonction principale de la Banque nationale d'Ukraine (BNU) est d'assurer la stabilité de l'unité monétaire ukrainienne (la hryvnia). Pour ce faire, la Banque nationale favorise la stabilité du système bancaire et, dans le cadre de ses compétences, la stabilité des prix."
 UKR_darnytsia: "Darnytsia"
 UKR_darnytsia_desc: "Darnytsia est une société pharmaceutique ukrainienne."
 UKR_farmak: "Farmak"
 UKR_farmak_desc: "JSC Farmak est une entreprise pharmaceutique ukrainienne. Elle a été fondée en 1925. Le siège est à Kiev."
 UKR_carpathian_tourism: "Promouvoir le tourisme dans les Carpates"
 UKR_carpathian_tourism_desc: "Développer l'infrastructure touristique dans les Carpates pour attirer des visiteurs internationaux et générer des recettes économiques."
 UKR_black_sea_tourism: "Promouvoir le tourisme près de la mer Noire"
 UKR_black_sea_tourism_desc: "Étendre l'infrastructure de villégiature le long de la côte de la mer Noire pour faire de l'Ukraine une destination balnéaire de premier plan."
 UKR_infra_rail: "Améliorations ferroviaires"
 UKR_infra_rail_desc: "Moderniser le réseau ferroviaire national pour améliorer le transport de fret et la connectivité des passagers."
 UKR_infra_rail_2: "Améliorations ferroviaires : niveau supérieur"
 UKR_infra_rail_2_desc: "Achever l'expansion et le renouvellement complets du réseau ferroviaire pour établir une infrastructure de transport de classe mondiale."
 UKR_infra_southern_bug: "Rendre le Boug méridional navigable"
 UKR_infra_southern_bug_desc: "Relancer la navigation commerciale de fret sur le Boug méridional en amont de Mykolaïv, pour faciliter l'exportation croissante de céréales d'Ukraine."
 UKR_pivdenne_db: "Bureau d'études Pivdenne"
 UKR_pivdenne_db_desc: "Le bureau d'études Pivdenne, situé à Dnipro, en Ukraine, conçoit des satellites et des fusées, et autrefois des missiles balistiques intercontinentaux soviétiques (ICBM)."
 UKR_luch: "Bureau d'études Luch"
 UKR_luch_desc: "Étendre les capacités du bureau d'études Luch dans le développement de missiles de croisière et d'armes avancées."
 UKR_mayak: "Mayak"
 UKR_mayak_desc: "Moderniser les installations de production d'armes légères de Mayak pour fournir aux forces armées des armes d'infanterie contemporaines."
 UKR_ukrainian_armor: "Armure ukrainienne"
 UKR_ukrainian_armor_desc: "Développer des technologies avancées de gilets pare-balles et d'équipement de protection pour le personnel militaire."
 UKR_large_construction1: "Programme de grands travaux"
 UKR_large_construction1_desc: "Lancer une initiative de construction ambitieuse pour étendre l'infrastructure urbaine et la capacité économique à l'échelle nationale."
 UKR_large_construction2: "Grande construction, deuxième phase"
 UKR_large_construction2_desc: "Poursuivre le boom de la construction avec des programmes étendus pour soutenir l'élan du développement et l'emploi."
 UKR_tax_reform: "Réforme fiscale"
 UKR_tax_reform_desc: "Restructurer le système fiscal pour accroître la collecte des recettes et moderniser l'administration fiscale."
 UKR_pension_reform: "Réforme des retraites"
 UKR_pension_reform_desc: "Mettre en œuvre une réforme complète du système de retraites pour assurer sa viabilité à long terme et une sécurité adéquate à la retraite."
 UKR_min_economy: "Ministère de l'Économie"
 UKR_min_economy_desc: "Renforcer le ministère de l'Économie pour promouvoir la libéralisation du marché et réduire le contrôle gouvernemental de l'économie."
 UKR_cut_energy_subs: "Réduire les subventions énergétiques"
 UKR_cut_energy_subs_desc: "Éliminer les subventions énergétiques inefficaces pour équilibrer le budget et encourager l'efficacité énergétique."
 UKR_state_fund: "Fonds d'État"
 UKR_state_fund_desc: "Établir un fonds souverain pour investir les excédents budgétaires dans des projets de développement et des actifs internationaux."
 UKR_air_improvements: "Améliorations de l'armée de l'air"
 UKR_air_improvements_desc: "Moderniser l'armée de l'air avec une meilleure formation, un meilleur équipement et une doctrine opérationnelle améliorée."
 UKR_aa_mis_def_force: "Force de défense antimissile antiaérienne"
 UKR_aa_mis_def_force_desc: "Créer des formations spécialisées de défense antimissile antiaérienne pour protéger l'espace aérien des menaces aériennes."
 UKR_radio_eng: "Force d'ingénierie radio"
 UKR_radio_eng_desc: "Développer les capacités de génie radio et de guerre électronique pour des communications militaires avancées."
 UKR_support_fac: "Installations de soutien"
 UKR_support_fac_desc: "Étendre l'infrastructure de soutien des bases aériennes pour renforcer les opérations aériennes et la maintenance des appareils."
 UKR_army_imp: "Améliorations de l'armée"
 UKR_army_imp_desc: "Renforcer l'armée par une formation, une doctrine et un développement militaire professionnel améliorés."
 UKR_army_aviation: "Aviation militaire"
 UKR_army_aviation_desc: "Développer les capacités d'aviation de l'armée avec des aéronefs à voilure tournante pour le transport, la reconnaissance et l'appui rapproché."
 UKR_army_logistics: "Logistique de l'armée"
 UKR_army_logistics_desc: "Renforcer la logistique de l'armée et les chaînes d'approvisionnement pour soutenir les opérations et améliorer l'efficacité sur le terrain."
 UKR_army_maintenance: "Installations de maintenance de l'armée"
 UKR_army_maintenance_desc: "Établir des installations complètes de maintenance et de réparation pour maximiser la disponibilité du matériel militaire."
 UKR_medical_forces: "Forces médicales"
 UKR_medical_forces_desc: "Établir des commandements médicaux militaires dotés de capacités avancées d'hôpitaux de campagne et de traumatologie."
 UKR_antonov: "Antonov"
 UKR_antonov_desc: "Étendre les capacités de construction aéronautique d'Antonov pour produire des avions de transport et cargo modernes."
 UKR_idea_pro_ukraine_reform_1_desc: "Les réformes gouvernementales anticorruption réduisent le gaspillage et l'inefficacité, rétablissant la confiance du public malgré les coûts initiaux de transition."
 UKR_idea_shortened_general_staff_desc: "La rationalisation de la structure de commandement militaire améliore l'efficacité de la planification et accélère le développement des officiers."
 UKR_uda_encouraged: "UDA encouragée"
 UKR_uda_encouraged_desc: "L'incorporation de la milice UDA dans les forces armées améliore la capacité de combat mais réduit la discipline militaire."
 UKR_uda_integrated: "ADU intégré"
 UKR_uda_integrated_desc: "L'Armée des volontaires ukrainiens a été pleinement intégrée aux forces armées régulières, renforçant la discipline et le sentiment nationaliste."
 UKR_ukrtelekom_idea: "Ukrtelecom"
 UKR_ukrtelekom_idea_desc: "Ukrtelecom, le monopole d'État des télécommunications, a été modernisé pour étendre l'infrastructure numérique et stimuler la productivité."
 UKR_finance_and_it: "Soutien au secteur financier et informatique"
 UKR_finance_and_it_desc: "Le développement des secteurs de la finance et des technologies de l'information crée une activité économique à haute valeur ajoutée et améliore les capacités de recherche."
 UKR_digital_state: "État numérique ukrainien"
 UKR_digital_state_desc: "Diia (ukrainien : Дія, litt. « Action » ; aussi un acronyme de Держава і Я, litt. « L'État et moi ») est une application mobile, un portail web et une marque de e-gouvernance en Ukraine. Lancée en 2020, l'application Diia permet aux citoyens ukrainiens d'utiliser des documents numériques sur leur smartphone à la place des documents physiques pour l'identification et le partage.\n\nLe portail Diia donne accès à plus de 50 services gouvernementaux. À terme, le gouvernement prévoit de rendre toutes les interactions État-personne disponibles via Diia."
 UKR_tax_avoidance_idea: "Évitement fiscal négligeable"
 UKR_tax_avoidance_idea_desc: "Si l'impôt peut être négligé, et même mal aimé, en réalité c'est notre superpouvoir social. L'impôt nous permet de choisir d'organiser nos communautés, au niveau local et national, pour que nous puissions tous mieux vivre, ensemble.\n\nMais un obstacle fondamental est la facilité avec laquelle les élites puissantes se soustraient à leurs obligations sociales — à leurs responsabilités envers les sociétés dont elles font partie, et dont elles tirent profit. - Rapport sur la justice fiscale 2023"
 UKR_nuclear_energy: "Énergoatome"
 UKR_nuclear_energy_desc: "L'investissement dans les centrales nucléaires accroît la production d'énergie intérieure et la construction de réacteurs."
 UKR_construction: "Efforts de construction"
 UKR_construction_desc: "Des capacités de construction allouées à des projets urgents financés par l'État."
 UKR_demographic_boom: "Boom démographique"
 UKR_demographic_boom_desc: "Des tendances démographiques favorables et des politiques de croissance de la population élargissent notre main-d'œuvre et notre effectif disponible."
 UKR_demographic_crisis: "Crise démographique"
 UKR_demographic_crisis_desc: "La population du pays décline depuis les années 1990 en raison d'un fort taux d'émigration, couplé à une mortalité élevée et une natalité faible. La population a diminué en moyenne de plus de 300 000 personnes par an depuis 1993."
 UKR_tackle_corruption: "S'attaquer à la corruption !"
 UKR_tackle_corruption_desc: "La campagne anticorruption et les réformes institutionnelles améliorent considérablement l'efficacité du gouvernement et la productivité nationale."
 UKR_corruption: "Corruption profondément enracinée"
 UKR_large_construction: "Programme de grands travaux"
 UKR_large_construction_desc: "Un programme ambitieux de développement d'infrastructure accélère l'achèvement des constructions et la productivité, bien que la consommation d'énergie augmente fortement."
 UKR_medical_reform: "Réforme médicale"
 UKR_medical_reform_desc: ""
 UKR_aamdf: "Forces de missiles anti-aériens"
 UKR_aamdf_desc: "Une force organisée de défense antimissile antiaérienne renforce considérablement notre capacité de défense aérienne et réduit l'efficacité de l'appui aérien rapproché ennemi."
 UKR_radio_troops: "Troupes du génie radio"
 UKR_radio_troops_desc: "Les unités de génie radio et de transmissions de l'armée de l'air renforcent la reconnaissance et l'interception tout en réduisant les pertes d'appareils."
 UKR_air_support_fac: "Installations de soutien de l'armée de l'air"
 UKR_air_support_fac_desc: "L'investissement dans les installations de soutien aérien améliore l'efficacité énergétique et la fiabilité des appareils, réduisant les coûts opérationnels tout en renforçant les performances."
 UKR_cut_subsidies: "Réduire les subventions énergétiques"
 UKR_cut_subsidies_desc: "Supprimer les subventions énergétiques force les consommateurs à supporter les vrais coûts de production, améliorant la productivité tout en réduisant la pression budgétaire."
 UKR_health_cost: "Une nation en meilleure santé !"
 UKR_health_cost_desc: ""
 UKR_military_rehab: "Système de rééducation pour les militaires"
 UKR_military_rehab_desc: "Les programmes de rééducation des vétérans boostent le moral des troupes et la cohésion organisationnelle, au prix d'une hausse des dépenses de santé."
 UKR_resource_extraction: "Extraction accrue des ressources"
 UKR_resource_extraction_desc: "L'expansion des opérations d'extraction de ressources accroît l'approvisionnement intérieur en minéraux et en combustibles."
 UKR_research_boost: "Programme de soutien à la recherche de l'Ukraine"
 UKR_research_boost_desc: "Un programme centralisé de soutien à la recherche accélère le développement technologique dans les secteurs militaire et civil."
 UKR_economy_boost: "Améliorations de l'économie"
 UKR_economy_boost_desc: "Un programme temporaire de relance économique accélère la productivité et l'efficacité des usines, au prix d'une hausse de la consommation d'énergie."
 UKR_kolomoisky_help: "Aide de Kolomoïsky"
 UKR_kolomoisky_help_desc: "L'oligarque bien connu Kolomoïsky nous a approchés avec une proposition de financer la création de plusieurs bataillons pour maintenir la capacité de combat de nos forces armées."
 UKR_kolomoisky_finish: "Régiment de police Dnipro-1"
 UKR_kolomoisky_finish_desc: "La dernière chose que Kolomoïsky s'est proposé de financer a été la reconstitution du régiment de défense de Dnipropetrovsk en régiment de police."
 UKR_uda: "Armée des Volontaires Ukrainiens"
 UKR_uda_desc: "Il est nécessaire d'organiser les volontaires en un groupe militaire unique."
 UKR_aidar: "Créer un bataillon Aidar"
 UKR_aidar_desc: "Prenons le risque et laissons-les rejoindre les rangs de nos forces armées."
 UKR_russia_help_battalions_desc: "Le déploiement d'unités russes de la Rosgvardia et de Wagner améliore la sécurité et les opérations de contre-insurrection pendant l'occupation."
 UKR_economy: "Politique économique"
 UKR_economy_desc: "\n\n\n\n\n\n£GFX_ukr_economy\n\n\n\n\n\n\n\n\nThe §5Ministry for Development of Economy and Trade§! is the main authority in the system of central government of §8Ukraine§! responsible for formation and realization of state economic and social development policies (business economics); regulation of consumer prices; industrial, investment and trade economic policies; development of entrepreneurship; technical regulation and security of consumer rights; inter-agency coordination of economic and social cooperation of §8Ukraine§! with the §8European Union§!."
 UKR_boost_economy: "Stimuler l’économie"
 UKR_boost_research: "Soutenir les efforts de recherche"
 UKR_boost_resource: "Subventionner l’extraction des ressources"
 UKR_add_resource: "Creusez profondément"
 UKR_renewable_energy: "Évaluation du potentiel d'énergies renouvelables de l'Ukraine"
 UKR_renewable_energy_desc: "\n\n\n\n\n\n£GFX_UKR_energy_ukraine\n\n\n\n\n\n\n\n\nCartographier les régions au meilleur potentiel de production d'énergie renouvelable."
 UKR_energy_wind: "Énergie éolienne"
 UKR_energy_solar: "Énergie solaire"
 UKR_energy_geothermal: "Énergie géothermique"
 UKR_privatize_resource: "Privatisation dans l'industrie extractive"
 UKR_privatize_resource_desc: "La privatisation des industries extractives réduit le contrôle de l'État et la disponibilité des ressources."
 UKR_restructure_debt: "Demander une restructuration de la dette"
 UKR_ask_western_loans: "Demander des prêts aux §7pays occidentaux§!"
 UKR_ask_eastern_loans: "Demander des prêts aux §tpays orientaux§!"
 UKR_natpolice_decision_category: "Service de patrouille de la police à vocation spéciale"
 UKR_natpolice_decision_category_desc: "Le service de patrouille de la police à vocation spéciale d'Ukraine est un service du département de la police de patrouille d'Ukraine au sein de la Police nationale d'Ukraine, créé dans le cadre du ministère de l'Intérieur d'Ukraine comme structure de forces spéciales pour la protection de l'ordre public.\n\nLa structure est devenue partie de la Police nationale d'Ukraine. Le service réunit d'anciens bataillons et régiments du ministère de l'Intérieur."
 UKR_uda_decision_category: "Armée des Volontaires Ukrainiens"
 UKR_uda_decision_category_desc: "Ukrainian Volunteer Army is a volunteer paramilitary formation formed on the basis of units of the Ukrainian Volunteer Corps after the departure of Dmitry Yarosh and his associates from the Right Sector movement."
 UKR_integrate_uda: "Intégrer l'§YUDA§! aux §Yforces armées d'Ukraine§!"
 UKR_small_arms: "Promouvoir l'§Wentreprise§! d'§Oarmes légères§!"
 UKR_equipment_funds: "Promouvez §YÉquipement d'infanterie OKMDB§! §YDivision W§!"
 UKR_heavy_equipment: "Allouer des fonds à l'§Wusine§! §GMalyshev§!"
 UKR_heavy_equipment_research: "Soutenir la §Wrecherche§! sur les §Gvéhicules blindés§!"
 UKR_fund_antonov: "Subventionner §8Antonov§!"
 UKR_air_equipment: "Soutenir la §Wrecherche§! §8aéronautique§!"
 UKR_nikolayev_funds: "Modernisez le §8Chantier naval de Mykolayiv§!"
 UKR_naval_equipment: "Soutenir la §Wrecherche§! d'§8équipement naval§!"
 UKR_parti_regions_economic_committee_desc: "Le comité économique du Parti des régions lisse les cycles économiques et maintient la stabilité."
 UKR_parti_regions_invest_open_window_desc: "Des politiques d'investissement favorables aux entreprises encouragent la croissance de la population et la collecte de l'impôt sur les sociétés."
 UKR_parti_regions_taxx_desc: "La réforme du code fiscal réduit la fiscalité des particuliers et des entreprises, relevant les coûts bureaucratiques tout en modérant les troubles sociaux."
 UKR_parti_regions_laizes_desc: "Les mesures de sécularisation réduisent l'influence cléricale mais déstabilisent les communautés religieuses et accroissent la volatilité économique."
 UKR_parti_regions_stability_reform_desc: "Les mesures de stabilité régionale renforcent la défense idéologique mais relèvent les frais généraux bureaucratiques."
 UKR_parti_regions_lustration_desc: "L'éviction des fonctionnaires de l'ère soviétique réduit les coûts de l'appareil administratif et de sécurité."
 UKR_parti_regions_opposition_agree_desc: "La coopération politique avec les partis d'opposition réduit l'isolement du gouvernement et réprime la dérive idéologique pendant l'ère Ianoukovytch."
 UKR_parti_regions_titushki_desc: "Des provocateurs de rue soutenus par le gouvernement répriment la dérive idéologique par l'intimidation et la violence."
 UKR_parti_regions_optimise_ministers_desc: "La rationalisation de la bureaucratie ministérielle réduit les coûts administratifs et améliore l'efficacité du gouvernement."
 UKR_parti_regions_inform_act_desc: "La législation de contrôle des médias stabilise le message politique au prix administratif."
 UKR_parti_regions_pension_reform_desc: "La restructuration du système de retraites réduit les coûts sociaux mais abaisse la croissance démographique en raison de prestations réduites."
 UKR_parti_regions_youth_regions_desc: "Les programmes d'engagement de la jeunesse construisent un soutien générationnel et améliorent marginalement le pouvoir politique et la défense contre la dérive."
 UKR_our_ukraine_secretariat_of_president_desc: "Le secrétariat présidentiel renforce la capacité de recherche administrative mais accroît les frais généraux bureaucratiques."
 UKR_our_ukraine_fight_with_corruption_idea_desc: "L'application anticorruption réduit les frais généraux bureaucratiques et l'extraction économique illicite."
 UKR_our_ukraine_education_reform_idea_desc: "Les réformes des programmes améliorent la capacité de recherche mais créent des coûts politiques et de stabilité temporaires."
 UKR_our_ukraine_health_reform_idea_desc: "La modernisation du système de santé réduit les coûts et améliore l'aptitude à la conscription."
 UKR_our_ukraine_social_reform_idea_desc: "La rationalisation des dépenses sociales réduit la charge budgétaire tout en renforçant le soutien démocratique."
 UKR_our_ukraine_air_industry_idea_desc: "La modernisation du secteur aéronautique réduit les coûts de production des aéronefs militaires."
 UKR_reform_sbu: "Réforme du SBU"
 UKR_reform_sbu_desc: "Le SBU a besoin de réformes : pendant toutes ces années, la structure s'est fortement enlisée dans la corruption et doit être mise à jour."
 UKR_Yanu_Minister: "Armoire"
 UKR_Yanu_President: "Présidence"
 UKR_prepare_protest_tt: "Nous gagnerons ou perdrons du soutien pour §8Les représentants du Maïdan§!"
 UKR_donbass_concessions_tt: "Selon notre position, nous pourrons gagner le soutien des régions de l'est ou de l'ouest, mais nous décevrons nécessairement §8Les représentants du Maïdan§!."
 UKR_azovsteel_desc: "Le contrôle du complexe sidérurgique Azovstal fournit un approvisionnement régulier d'acier de haute qualité pour la production industrielle et militaire."
 UKR_yushenko_premier_idea_desc: "Viktor Iouchtchenko sert de Premier ministre sous Koutchma, élargissant son autorité politique et orientant le gouvernement vers la neutralité."
 UKR_yanuk_premier_idea_desc: "Viktor Ianoukovytch sert de Premier ministre sous Koutchma, élargissant son autorité politique et attirant le gouvernement vers la gauche."
 UKR_unstable_government_idea_desc: "L'instabilité politique a affaibli le contrôle gouvernemental, permettant à diverses factions idéologiques d'exploiter les troubles pour leurs propres agendas."
 UKR_land_reform_idea3_desc: "La réforme agraire initiée au siècle dernier devrait aboutir à une redistribution complète des terres dans tout le pays. Pour l'heure, elle est en cours."
 UKR_zaims_desc: "Des prêts internationaux à court terme ont stabilisé l'économie et accru les recettes fiscales, tout en créant d'importantes obligations de dette futures."
 UKR_social_discontent: "Grave mécontentement du peuple"
 UKR_social_discontent_desc: "Des coupes drastiques dans les dépenses de santé, d'éducation et de protection sociale soulagent le Trésor au prix de la confiance du public."
 UKR_banks_lobbyst_liquidate_desc: "L'éviction des intérêts bancaires du gouvernement réoriente les recettes de l'impôt sur les sociétés, brisant l'influence des élites financières sur la politique."
 UKR_mining_company_help_desc: "Des incitations fiscales aux compagnies minières apportent un soulagement en période de tension économique."
 UKR_privatization_idea_desc: "La privatisation des entreprises d'État améliore l'efficacité des usines et les relations commerciales au prix du pouvoir politique."
 UKR_without_kuchma_idea_desc: "Le mouvement « L'Ukraine sans Koutchma » a mobilisé le sentiment nationaliste contre la corruption oligarchique perçue et la gouvernance autoritaire."
 UKR_left_opposition_idea_desc: "Un mouvement politique de gauche mobilise ouvriers et intellectuels contre le gouvernement en place, déstabilisant l'ordre existant."
 UKR_luaz_idea_desc: "Support for the domestic LuAZ automobile manufacturer reduces production costs for vehicles and trucks."
 UKR_anti_socialist_media_desc: "Les médias alignés sur l'État répriment le sentiment communiste et neutre, renforçant l'emprise du gouvernement réactionnaire sur l'opinion publique."
 ukraine_union.1.t: "L'Ukraine propose un État d'Union à part entière"
 ukraine_union.1.d: "Kiev propose de dissoudre son État dans le nôtre et de fusionner les deux nations en un État d'union unique sous direction ukrainienne. Chaque cœur, chaque actif et chaque soldat deviendraient les leurs. Abandonnons-nous notre indépendance pour cette union ?"
 ukraine_union.1.a: "Nous acceptons l'union"
 ukraine_union.1.b: "Nous ne livrerons pas notre État"
 ukraine_union.2.t: "La Russie rejette l'union"
 ukraine_union.2.d: "Moscou refuse de se dissoudre dans notre État d'union. Le rêve d'une nation unique des Carpates au Pacifique devra attendre."
 ukraine_union.2.a: "Une opportunité manquée"
 ukraine_union.3.t: "L’Ukraine propose d’adhérer ensemble à l’OTAN"
 ukraine_union.3.d: "Kiev nous invite à quitter nos alliances actuelles et à rejoindre l'OTAN à ses côtés, remodelant l'ordre de sécurité de l'Europe de l'Est. Prenons-nous ce chemin ensemble ?"
 ukraine_union.3.a: "Nous rejoignons l'OTAN ensemble"
 ukraine_union.3.b: "Notre place n'est pas dans l'OTAN"
 ukraine_union.4.t: "La Russie rejette l'adhésion à l'OTAN"
 ukraine_union.4.d: "Moscou refuse de rejoindre l'OTAN à nos côtés. Nous devrons tracer notre cours occidental seuls."
 ukraine_union.4.a: "So Be It"
 ukraine_kommi.16.t: "Soulèvement communiste à l'Est"
 ukraine_kommi.16.d: "Un soulèvement communiste soutenu par Kiev a saisi plusieurs de nos provinces orientales et a déclaré l'indépendance avec le soutien ukrainien. Nous n'oublierons pas cela."
 ukraine_kommi.16.a: "Nous nous en souviendrons"
 UKR_brotherhood_people_desc: "Un mouvement social communiste mettant l'accent sur le bien-être collectif et la solidarité réduit la charge des biens de consommation tout en renforçant la défense idéologique."
 UKR_social_reform_desc: "L'expansion de la protection sociale réduit les coûts de santé et sociaux tout en améliorant le niveau de vie sous gouvernance communiste."
 UKR_equal_rights_idea_desc: "La mise en œuvre de politiques d'égalité des droits pour toutes les démographies réduit la charge bureaucratique et renforce l'unité politique."
 UKR_west_investors_idea_desc: "La participation aux marchés occidentaux a fourni des capitaux et une expertise économique, soutenant le développement des affaires et la confiance du public dans l'économie."
 UKR_our_investors_idea_desc: "Domestic investor capital stimulates research capacity, stabilizes economic cycles, and strengthens foreign policy independence."
 UKR_socialist_effort_desc: "La mobilisation économique pour la production socialiste accroît la stabilité, la croissance démographique et la disponibilité des biens de consommation."
 UKR_alpha: "Alpha"
 UKR_alpha_desc: "L'unité d'opérations spéciales Alpha du SBU renforce nos opérations de contre-espionnage et de sécurité contre les menaces subversives."
 UKR_svr_desc: "Les opérations du Service de renseignement extérieur renforcent le développement du réseau de renseignement et les défenses de l'agence contre la subversion étrangère."
 UKR_sviaz_desc: "Le Service d'État des communications spéciales fournit un chiffrement, un déchiffrement et une infrastructure de communications sécurisées améliorés."
 UKR_ukraine_always_right: "L’Ukraine a toujours raison"
 UKR_ukraine_always_right_desc: "De vrais patriotes sont arrivés au pouvoir en Ukraine. L'Ukraine a toujours raison, l'Ukraine au-dessus de tout."
 UKR_take_control_of_the_media: "Prendre le contrôle des médias"
 UKR_take_control_of_the_media_desc: "Les médias ont eu trop de liberté ces dernières années. Ils ne s'occupent que de promouvoir combien notre pays est mauvais et terrible : nous y remédierons."
 UKR_prohibition_of_non_nationalist_organizations: "Interdiction des organisations non nationalistes"
 UKR_prohibition_of_non_nationalist_organizations_desc: "Toute organisation qui refuse la cause nationaliste est une menace pour le nouvel ordre. Les interdire toutes et laisser notre mouvement comme seule force politique légale du pays."
 UKR_anti_russian_policy: "Politique anti-russe"
 UKR_anti_russian_policy_desc: "Moscou reste le plus grand ennemi de la nation ukrainienne. Instaurer l'hostilité à la Russie comme politique d'État officielle et purger l'influence russe de nos institutions."
 UKR_loyal_teachers_in_schools: "Des enseignants fidèles dans les écoles"
 UKR_loyal_teachers_in_schools_desc: "L'école est le fondement des futurs citoyens patriotiques de l'Ukraine. Nous ne laisserons que de vrais Ukrainiens dans les écoles."
 UKR_ban_all_languages_except_ukrainian: "Interdire toutes les langues sauf l'ukrainien"
 UKR_ban_all_languages_except_ukrainian_desc: "Nous lancerons un programme d'ukrainisation : toutes les autres langues seront retirées des programmes scolaires, de la communication des affaires et des autres instances de la vie d'un citoyen ukrainien."
 UKR_introduce_death_penalty_for_disloyal_persons: "Instaurer la peine de mort pour les personnes déloyales"
 UKR_introduce_death_penalty_for_disloyal_persons_desc: "La loyauté est ce que chaque citoyen doit à sa patrie. Tous ceux qui la haïssent, tous ceux qui l'offenseraient, nous nous en débarrasserons par tous les moyens nécessaires."
 UKR_united_council_of_ukrainian_nationalists: "Conseil uni des nationalistes ukrainiens"
 UKR_united_council_of_ukrainian_nationalists_desc: "Enfin, le vrai patriotisme et le nationalisme, menés par de vrais partisans de l'Ukraine, gouvernent le pays. Notre congrès doit bâtir un grand pays."
 UKR_right_sector: "Secteur droit"
 UKR_right_sector_desc: "The Right Sector will be responsible for the internal political component of the new Ukrainian state."
 UKR_full_order_in_the_country: "L'ordre total dans le pays"
 UKR_full_order_in_the_country_desc: "L'ordre est la clé de la stabilité. Nous combattrons le chaos, le désordre et la rébellion."
 UKR_ukrainian_assault_battalions: "Bataillons d'assaut ukrainiens"
 UKR_ukrainian_assault_battalions_desc: "Nous formerons des bataillons de choc composés de citoyens particulièrement patriotiques, chargés de missions spécifiques."
 UKR_make_government_jobs_only_for_ukrainians: "Réserver les emplois publics aux Ukrainiens"
 UKR_make_government_jobs_only_for_ukrainians_desc: "Seuls les Ukrainiens doivent travailler pour le bien de la patrie ; les autres n'auront pas le droit de travailler."
 UKR_complete_the_cleansing_of_the_ukrainian_state: "Achever l'épuration de l'État ukrainien"
 UKR_complete_the_cleansing_of_the_ukrainian_state_desc: "Notre patrie a été purgée des ennemis, des détracteurs et des autres éléments néfastes."
 UKR_limit_the_powers_of_the_mvd: "Limiter les pouvoirs du MVD"
 UKR_limit_the_powers_of_the_mvd_desc: "La police et les autres autorités ont trop de pouvoir dans l'État : nous les limiterons."
 UKR_night_of_the_long_knives: "Nuit des Longs Couteaux"
 UKR_night_of_the_long_knives_desc: "Nous éliminerons plus radicalement ceux qui résistent particulièrement aux réformes."
 UKR_una_unso: "UNA UNSO"
 UKR_una_unso_desc: "Les activités de politique étrangère reposeront sur les épaules de l'organisation UNA-UNSO."
 UKR_external_intervention: "Intervention externe"
 UKR_external_intervention_desc: "Il est temps d'abandonner une politique pacifique : nous influencerons activement les processus mondiaux."
 UKR_resolve_the_moldovan_issue: "Régler la question moldave"
 UKR_resolve_the_moldovan_issue_desc: "La Moldavie et la Transnistrie nous gênent depuis trop longtemps : leur indépendance n'est qu'une erreur, nous la corrigerons."
 UKR_dig_up_potatoes: "Déterrer des pommes de terre"
 UKR_dig_up_potatoes_desc: "La Biélorussie peut servir à nos ennemis, à l'ouest comme à l'est, pour nous frapper. La meilleure protection, c'est de frapper les premiers !"
 UKR_to_recall_the_volhynia_massacre: "Expérience Volhynie"
 UKR_to_recall_the_volhynia_massacre_desc: "Nous avons de nouveau affaire aux Polonais et devons une fois de plus leur riposter. Il est temps que notre pays mette enfin fin à la menace polonaise."
 UKR_secretly_sending_militants_to_kuban: "Soulever une rébellion en Crimée"
 UKR_secretly_sending_militants_to_kuban_desc: "Le fait que la Russie nous ait pris la Crimée est la principale injustice historique du siècle. La faiblesse de nos autorités s'est révélée affligeante et honteuse. Nous y remédierons."
 UKR_agitation_of_radical_ukrainians_in_kuban: "Soulever une rébellion dans le Kouban"
 UKR_agitation_of_radical_ukrainians_in_kuban_desc: "Le Kouban est notre terre et le restera toujours. Nous tenterons de le reprendre à la Russie."
 UKR_liberate_green_klin: "\\"Libérer\\" Green Klin"
 UKR_liberate_green_klin_desc: "Il est temps de « libérer » nos frères d'Extrême-Orient de l'oppression de l'ours russe."
 UKR_shoot_a_russian_bear: "Tirez sur un ours russe"
 UKR_shoot_a_russian_bear_desc: "L'ours russe deviendra notre tapis !"
 UKR_declare_a_great_ukraine: "Déclarons une Grande Ukraine"
 UKR_declare_a_great_ukraine_desc: "L'Ukraine est devenue grande : que le monde entier le sache."
 UKR_upa: "UPA"
 UKR_upa_desc: "La défense civile et intérieure du pays reviendra à l'Armée insurrectionnelle ukrainienne rétablie."
 UKR_new_orders_of_formation_of_upa_groups: "Nouveaux ordres de formation des groupes de l'UPA"
 UKR_new_orders_of_formation_of_upa_groups_desc: "Nous tiendrons compte de l'expérience de l'UPA pendant la Seconde Guerre mondiale et formerons de nouvelles brigades en corrigeant les erreurs."
 UKR_partisan_units: "Unités partisanes"
 UKR_partisan_units_desc: "Des cellules de guérilla de l'UPA seront établies dans tout le pays pour résister activement aux ennemis à l'avenir."
 UKR_partisanship_as_an_ideology: "La partisanerie comme idéologie"
 UKR_partisanship_as_an_ideology_desc: "Nos partisans doivent être formés idéologiquement pour résister activement à l'ennemi."
 UKR_make_military_exercises_in_the_country_compulsory_for_all: "Rendre les exercices militaires obligatoires pour tous"
 UKR_make_military_exercises_in_the_country_compulsory_for_all_desc: "Chaque Ukrainien doit pouvoir défendre son pays. L'entraînement des citoyens ordinaires par des spécialistes de l'UPA renforcera la puissance de combat de notre pays."
 UKR_to_arm_every_person_in_the_country: "Armer chaque personne du pays"
 UKR_to_arm_every_person_in_the_country_desc: "Femmes, enfants, hommes, vieillards : chacun doit pouvoir porter une arme et tirer sur l'ennemi."
 UKR_form_an_alliance_of_right_wing_youth: "Former une alliance de la jeunesse de droite"
 UKR_form_an_alliance_of_right_wing_youth_desc: "La jeunesse ukrainienne doit être organisée avant d'être armée. Unir les mouvements de jeunesse de droite épars en une alliance unique fidèle à la cause nationaliste."
 UKR_ukraine_is_a_land_of_partisans: "L'Ukraine est une terre de partisans"
 UKR_ukraine_is_a_land_of_partisans_desc: "Il y aura des partisans dans chaque village, dans chaque ville, si l'ennemi nous envahit. Nous l'accueillerons avec la force du peuple ukrainien."
 UKR_nationalists_right_sector_desc: "L'intégration des milices du Secteur droit dans les structures de l'État renforce le sentiment nationaliste et l'autorité politique."
 UKR_nationalists_una_unso_desc: "Le mouvement nationaliste UNA-UNSO facilite la mobilisation de volontaires et améliore les capacités militaires irrégulières."
 UKR_nationalists_upa_desc: "S'appuyer sur les tactiques historiques de résistance de l'UPA améliore l'efficacité logistique et la défense des territoires essentiels."
 UKR_nationalists_cleane_ukraine_desc: "Une vaste campagne de consolidation nationaliste renforce la résistance à l'influence étrangère et durcit la volonté de poursuivre le combat."
 UKR_nationalists_trizub_desc: "L'organisation Tryzoub mobilise le sentiment nationaliste et l'engagement pour la défense nationale."
 UKR_nabu: "Bureau national anticorruption de l'Ukraine"
 UKR_nabu_desc: "Le nouveau bureau anticorruption est conçu pour renforcer la lutte contre les fonctionnaires corrompus à tous les niveaux."
 UKR_poroh_deccomuniz: "La présidence de Porochenko"
 UKR_poroh_deccomuniz_desc: "Porochenko est un personnage ambigu, mais sa volonté de rendre l'Ukraine forte face à l'ennemi mérite le respect du peuple."
 UKR_west_investors_desc: "Des investisseurs occidentaux ont été attirés sur le marché, renforçant les institutions démocratiques et stimulant la croissance et la stabilité économiques."
 UKR_operation_wall_desc: "La construction de fortifications défensives s'accélère fortement pendant cette période de mobilisation."
 UKR_ato_supports_desc: "Le soutien aux vétérans de l'opération antiterroriste renforce le sentiment nationaliste et notre engagement envers ceux qui ont servi."
 UKR_health_supports_desc: "Un financement élargi de la santé améliore le bien-être public et renforce le soutien à la gouvernance démocratique."
 UKR_pivdenmash_idea_desc: "L'entreprise d'État Pivdenmash se spécialise dans la production de missiles balistiques et nucléaires, avec une efficacité accrue."
 UKR_kyvarmor_idea_desc: "L'usine blindée de Kiev se spécialise dans la production de châssis de chars moyens avancés et de variantes amphibies."
 UKR_tsnap_idea_desc: "L'agence administrative d'État TSNAP rationalise la bureaucratie du gouvernement central et réduit les frais administratifs."
 UKR_concern_desc: "La consolidation des fabrications militaires éparses au sein du complexe de l'industrie militaire de Kharkiv améliore l'efficacité de production des chars et des véhicules."
 UKR_zaz_idea_desc: "La production automobile ZAZ a été relancée, améliorant la fiabilité des véhicules et réduisant les coûts de fabrication pour le transport civil et militaire."
 UKR_kraz_idea_desc: "La production de véhicules KrAZ fournit une fabrication nationale de camions et de véhicules blindés, réduisant la dépendance aux importations."
 UKR_motorsich_idea_desc: "Le soutien de l'État à la production de moteurs d'avion Motor Sich réduit les coûts de fabrication des aéronefs lourds et des hélicoptères."
 UKR_interlegion_decision_category: "Légion internationale de défense territoriale"
 UKR_interlegion_decision_category_desc: "La Légion internationale de la défense territoriale de l'Ukraine est un projet du gouvernement ukrainien visant à attirer des étrangers pour former des unités de volontaires au sein de la défense territoriale des Forces armées ukrainiennes."
 UKR_vetrenko_surrort_nationalism_desc: "Un mouvement nationaliste a mobilisé la population, mettant l'accent sur l'identité ukrainienne et la souveraineté culturelle face aux menaces extérieures perçues."
 UKR_vetrenko_pioneria_desc: "Une organisation de jeunesse nationaliste a été créée pour favoriser l'éducation patriotique et accroître la conscience politique des jeunes générations."
 UKR_vetrenko_health_free_idea_desc: "Des soins de santé gratuits ont été mis en place dans tout le pays, améliorant la croissance démographique mais pesant sur les finances publiques par l'augmentation des dépenses médicales."
 UKR_economic_reforms_modifier: "Développement économique ukrainien"
 UKR_economic_reforms_modifier_desc: "Des décennies de stagnation oligarchique ont laissé l'économie ukrainienne comme un patchwork de reliques soviétiques et de marchés de l'ombre. Un programme de réforme soutenu démêle peu à peu la bureaucratie, attire l'investissement étranger et modernise notre industrie vieillissante. Chaque pas en avant se mesure en usines rouvertes et en contrats honorés."
 UKR_military_reforms_modifier: "Développement militaire ukrainien"
 UKR_military_reforms_modifier_desc: "Les Forces armées ukrainiennes sont entrées dans le siècle sous-financées, démoralisées et armées de stocks soviétiques rouillés. Réformer, ce n'est pas seulement de nouveaux fusils : c'est des officiers professionnels, un entraînement réaliste et une doctrine écrite pour les guerres que nous affrontons réellement. Ce qui en sortira sera une armée plus mince, plus dure, loyale à l'État plutôt qu'à un patron."
 UKR_kuchma_shortcut: "Koutchma"
 UKR_kuchma_second_terms: "Deuxième mandat de Koutchma"
 UKR_kuchma_second_terms_desc: "Le président Koutchma gouverne notre pays pour un second mandat ; peut-être cette fois ne sera-t-il pas réélu, ou mènera-t-il notre pays au chaos. Nous verrons."
 UKR_dissolve_rada: "Dissoudre Rada"
 UKR_restore_rada: "Restaurer Rada"
 ukr_industry_points_cost_35_blocked: "35 points d'industrie requis"
 ukr_industry_points_cost_50_blocked: "50 points d'industrie requis"
 ukr_industry_points_cost_75_blocked: "75 points d'industrie requis"
 UKR_wind_energy: "Programme d'énergie éolienne achevé"
 UKR_solar_energy: "Programme d'énergie solaire achevé"
 UKR_finance_vv_tt: "Exige que les troupes intérieures soient encore à leur effectif réformé, non dissoutes ni absorbées dans un autre service"
 UKR_unite_with_russian_genshtab_tt: "Requiert que la piste des réformes militaires ne soit pas à son deuxième stade"
 UKR_nato_aid_donor_one: "[FROM.GetName] a livré un soutien à notre effort de guerre."
 UKR_nato_aid_donor_many: "§Y[?UKR.UKR_aid_report_donors^num]§! gouvernements alliés, menés par [FROM.GetName], ont livré un soutien à notre effort de guerre."
 UKR_aid_report_money_tt: "[THIS.GetFlag][THIS.GetAdjective] §YTrésorerie§!: $$[?UKR_aid_report_money|+] Milliards"
 ukraine_revolution.30.t: "Conseil suprême de Crimée"
 ukraine_revolution.30.d: "Le Conseil suprême de Crimée teste les limites de l'autorité de Kiev. Faut-il autoriser un référendum sur le statut de la péninsule ou dissoudre le conseil ?"
 ukraine_revolution.30.a: "Autoriser un référendum"
 ukraine_revolution.30.b: "Dissoudre le conseil"
 ukraine_revolution.31.t: "Moscou intervient"
 ukraine_revolution.31.d: "Kiev a ouvert une question de statut en Crimée. Moscou peut accepter un arrangement d'autonomie ukrainienne ou garantir un référendum de son cru."
 ukraine_revolution.31.a: "Accepter l'autonomie ukrainienne"
 ukraine_revolution.31.b: "Garantir le référendum"
 ukraine_revolution.32.t: "Le référendum de Crimée"
 ukraine_revolution.32.d: "Le référendum a mis l'avenir de la Crimée entre les mains de Moscou. Nous devons décider si nous reconnaissons un protectorat russe ou si nous absorbons directement la péninsule."
 ukraine_revolution.32.a: "Créer un protectorat russe"
 ukraine_revolution.32.b: "Annexer directement la Crimée"
 ukraine_revolution.33.t: "Moscou répond"
 ukraine_revolution.33.d: "Kiev a dissous le conseil de Crimée. Moscou doit décider s'il répond par la pression ou s'il se retire."
 ukraine_revolution.33.a: "Exercer une pression diplomatique"
 ukraine_revolution.33.b: "Se retirer"
 ukraine_revolution.40.t: "Avenir politique de Donetsk"
 ukraine_revolution.40.d: "La région de Donetsk exige un mot direct sur son gouvernement. Kiev doit choisir entre un règlement négocié, une répression ou une nouvelle république autonome."
 ukraine_revolution.40.a: "Négocier l’autonomie locale"
 ukraine_revolution.40.b: "Dissoudre le conseil"
 ukraine_revolution.40.c: "Autoriser une République de Donetsk"
 ukraine_revolution.40.e: "Laisser le Donbass se soulever les armes à la main"
 ukraine_revolution.41.t: "Avenir politique de Louhansk"
 ukraine_revolution.41.d: "Les conseils de Louhansk suivent l'exemple de Donetsk. Leurs revendications peuvent être contenues par le compromis, la force ou la reconnaissance d'une république."
 ukraine_revolution.41.a: "Négocier l’autonomie locale"
 ukraine_revolution.41.b: "Réprimer le mouvement"
 ukraine_revolution.41.c: "Autoriser une République de Louhansk"
 ukraine_revolution.42.t: "Avenir politique de la Crimée"
 ukraine_revolution.42.d: "Le statut de la Crimée est de nouveau contesté alors que le pays est déjà sous tension. Kiev peut reconnaître l'autonomie locale, dissoudre le conseil ou s'en remettre au processus de Crimée sous surveillance."
 ukraine_revolution.42.a: "Négocier l’autonomie locale"
 ukraine_revolution.42.b: "Dissoudre le conseil"
 ukraine_revolution.42.c: "Utiliser le processus de Crimée"
 ukraine_revolution.43.t: "Conseil de Kharkiv"
 ukraine_revolution.43.d: "Les politiciens régionaux de Kharkiv testent les limites de l'autorité de Kiev. Le gouvernement doit décider s'il négocie, réprime le conseil ou tolère une administration locale."
 ukraine_revolution.43.a: "Négocier l’autonomie locale"
 ukraine_revolution.43.b: "Réprimer le conseil"
 ukraine_revolution.43.c: "Tolérer une administration locale"
 ukraine_revolution.44.t: "Conseil de Zaporijjia"
 ukraine_revolution.44.d: "Zaporijjia exige des garanties pour ses institutions locales. Un compromis peut calmer la région, tandis que la répression peut étendre la crise."
 ukraine_revolution.44.a: "Négocier l’autonomie locale"
 ukraine_revolution.44.b: "Réprimer le conseil"
 ukraine_revolution.44.c: "Tolérer une administration locale"
 ukraine_revolution.45.t: "Les conseils du Sud"
 ukraine_revolution.45.d: "Kherson et Mykolaïv s'organisent autour de revendications de contrôle local. Leurs conseils peuvent être intégrés à un règlement ou poussés à une opposition ouverte."
 ukraine_revolution.45.a: "Négocier l’autonomie locale"
 ukraine_revolution.45.b: "Réprimer les conseils"
 ukraine_revolution.45.c: "Tolérer les administrations locales"
 ukraine_revolution.46.t: "Avenir politique d'Odessa"
 ukraine_revolution.46.d: "Le conseil d'Odessa pèse l'autonomie contre une rupture directe avec Kiev. La république d'Odessa existante est disponible si le gouvernement perd le contrôle."
 ukraine_revolution.46.a: "Négocier l’autonomie locale"
 ukraine_revolution.46.b: "Réprimer le conseil"
 ukraine_revolution.46.c: "Autoriser une République d’Odessa"
 ukraine_revolution.47.t: "Avenir politique de Dnipro"
 ukraine_revolution.47.d: "La région industrielle de Dnipro exige une voix dans le nouvel ordre politique. Kiev peut négocier, réprimer le conseil ou laisser émerger la république de Dnipro existante."
 ukraine_revolution.47.a: "Négocier l’autonomie locale"
 ukraine_revolution.47.b: "Réprimer le conseil"
 ukraine_revolution.47.c: "Autoriser une République du Dniepr"
 ukraine_revolution.48.t: "Conseil de Soumy"
 ukraine_revolution.48.d: "Les autorités locales de Soumy demandent des garanties contre les décisions prises à Kiev. Un conseil négocié est la voie la moins disruptive, mais la répression et la reconnaissance restent possibles."
 ukraine_revolution.48.a: "Négocier l’autonomie locale"
 ukraine_revolution.48.b: "Réprimer le conseil"
 ukraine_revolution.48.c: "Tolérer une administration locale"
 ukraine_revolution.49.t: "L'avenir de la Novorossia"
 ukraine_revolution.49.d: "Les républiques participantes se sont consolidées en Novorossia. Kiev doit décider s'il la reconnaît comme sujet autonome ukrainien, accepte une confédération indépendante, ou combat pour son territoire."
 ukraine_revolution.49.a: "Reconnaître un sujet autonome ukrainien"
 ukraine_revolution.49.b: "Acceptez une confédération indépendante"
 ukraine_revolution.49.c: "Combattre pour le territoire"
 ukraine_revolution.50.t: "Un congrès mémorable"
 ukraine_revolution.50.d: "Le congrès de Severodonetsk est entré dans la mémoire politique de la région. Sa demande d'une voix dans les décisions de Kiev façonne encore les institutions de la république."
 ukraine_revolution.50.a: "Consigner l'héritage"
 ukraine_revolution.51.t: "Les conseils deviennent des institutions"
 ukraine_revolution.51.d: "La vague des conseils régionaux a fait son temps. Certains ont été contenus, d'autres sont devenus des républiques, mais chacun a laissé une marque durable sur le règlement post-Maïdan."
 ukraine_revolution.51.a: "Une nouvelle carte politique"
 ukraine_revolution.52.t: "Une République prend forme"
 ukraine_revolution.52.d: "La première république régionale s'est dotée d'un gouvernement propre. Son avenir dépendra de la capacité de l'administration locale à survivre à la crise qui l'a créée."
 ukraine_revolution.52.a: "Tenir la ligne"
 ukraine_revolution.53.t: "La longue ombre de la Crimée"
 ukraine_revolution.53.d: "Le règlement de 2004 en Crimée a enfin été consigné dans l'ordre politique. La décision n'a pas mis fin à tous les litiges, mais elle a donné au statut de la péninsule une histoire qu'on ne peut ignorer."
 ukraine_revolution.53.a: "Se souvenir du règlement"
 ukraine_revolution.54.t: "Une colonie novorossiyane"
 ukraine_revolution.54.d: "Le règlement novorossien a modifié l'équilibre entre Kiev, les républiques régionales et Moscou. Le nouvel arrangement sera jugé à ce qu'il préserve, et pas seulement à ce qu'il revendique."
 ukraine_revolution.54.a: "Conserver le dossier"
 ukraine_revolution.55.t: "Territoire Libre"
 ukraine_revolution.55.d: "Des militants anarchistes au sein de la direction du nouvel État affirment que Novorossia est un nom emprunté qui ne signifie rien pour le peuple de Houliaïpole. Ils veulent faire revivre la bannière de Nestor Makhno et appeler la terre par son nom : un territoire libre."
 ukraine_revolution.55.a: "Adopter le Territoire libre"
 ukraine_revolution.55.b: "Garder le nom Novorossia"
 ukraine_regions.13.t: "Le pacte de Kharkiv"
 ukraine_regions.13.d: "La Russie propose de prolonger le bail de la flotte de la mer Noire à Sébastopol en échange d'une remise sur le gaz naturel."
 ukraine_regions.13.a: "Signer le pacte"
 ukraine_regions.13.b: "Refuser le pacte"
 ukraine_regions.14.t: "L'affaire Tymochenko"
 ukraine_regions.14.d: "L'ancienne Première ministre Ioulia Tymochenko est poursuivie pour l'accord gazier de 2009 avec la Russie. Les procureurs veulent son arrestation."
 ukraine_regions.14.a: "Arrêtez-la"
 ukraine_regions.14.b: "Laissez-la tranquille"
 ukraine_regions.15.t: "La loi sur les langues régionales"
 ukraine_regions.15.d: "Un projet de loi accordant un statut régional au russe et à d'autres langues minoritaires a franchi la Rada. Le voter plairait au Sud-Est et fâcherait les nationalistes de l'Ouest."
 ukraine_regions.15.a: "Adopter la loi"
 ukraine_regions.15.b: "Rejeter la loi"
 ukraine_our_ukraine.10.t: "Le sommet de Bucarest"
 ukraine_our_ukraine.10.d: "Au sommet de l'OTAN à Bucarest, l'Allemagne et la France ont bloqué un plan d'action pour l'adhésion de l'Ukraine. La porte de l'alliance reste ouverte en nom, mais aucun chemin pour la franchir n'a été fixé."
 ukraine_our_ukraine.10.a: "Continuez à courtiser l’OTAN"
 ukraine_our_ukraine.10.b: "Dénoncer le camouflet"
 UKR_hur_can_attack: "Le gouvernement soutient les opérations du HUR, la réforme du HUR est achevée, et au moins une unité du HUR a été levée"
 UKR_YUSHENKO_PATH: "Voie Iouchtchenko sélectionnée par règle de jeu"
 UKR_YANUK_PATH: "Voie Ianoukovytch sélectionnée par règle de jeu"
 UKR_political_tension_tt: "La tension politique changera de §Y[?tension_change|0]§! (tension politique actuelle : §Y[?UKR.UKR_political_tension|0]§!)."
 UKR_seuar_balance: "Lutte pour l’autonomie du SEUAR"
 UKR_seuar_balance_desc: "La lutte entre les institutions de Kiev et le mouvement d'autonomie du Sud-Est ukrainien déterminera si la crise de 2004 reste politique ou produit une nouvelle république."
 UKR_seuar_kyiv_control: "Contrôle de Kyiv"
 UKR_seuar_autonomy_side: "Mouvement pour l'autonomie"
 UKR_seuar_negotiated_center: "Impasse négociée"
 UKR_seuar_negotiated_center_desc: "Ni Kiev ni le mouvement d'autonomie n'a obtenu un avantage décisif."
 UKR_seuar_kyiv_advantage: "Kyiv gagne du terrain"
 UKR_seuar_kyiv_advantage_desc: "Les contre-manifestations et la pression de l'État commencent à contenir le mouvement d'autonomie."
 UKR_seuar_kyiv_dominance: "Dominance de Kyiv"
 UKR_seuar_kyiv_dominance_desc: "Le mouvement d'autonomie est proche de l'effondrement sous une pression coordonnée de l'État."
 UKR_seuar_autonomy_advantage: "L’autonomie gagne du terrain"
 UKR_seuar_autonomy_advantage_desc: "Le mouvement d'autonomie s'organise plus vite que Kiev ne peut le contenir."
 UKR_seuar_autonomy_dominance: "Dominance de l'autonomie"
 UKR_seuar_autonomy_dominance_desc: "Le mouvement d'autonomie a assez de soutien pour exiger une république autonome formelle."
 UKR_separatist_crisis_category: "Crise séparatiste"
 UKR_separatist_crisis_category_desc: "[UKR.GetFlag]L'§YUkraine§! doit contenir les conseils régionaux et les mouvements séparatistes sans transformer chaque litige local en guerre."
 UKR_separatist_fund_negotiations: "Financer les négociations régionales"
 UKR_separatist_fund_negotiations_desc: "Dépenser les fonds du Trésor pour des médiateurs locaux et des concessions avant que les conseils ne deviennent des républiques."
 UKR_separatist_internal_security: "Déployer la sécurité intérieure"
 UKR_separatist_internal_security_desc: "Utiliser les forces de sécurité intérieure pour tenir les bâtiments gouvernementaux et contenir les organisateurs séparatistes."
 UKR_separatist_recognize_councils: "Reconnaître les conseils autonomes"
 UKR_separatist_recognize_councils_desc: "Reconnaître l'autorité des conseils en échange de leur conformité et de la fin de la confrontation immédiate."
 UKR_novorossiya_form: "Consolider Novorossiya"
 UKR_novorossiya_form_desc: "Rassembler les républiques participantes et les conseils soutenus sous le tag Novorossia existant."
 UKR_novorossiya_recognize: "Reconnaître l'autonomie de la Novorossiya"
 UKR_novorossiya_recognize_desc: "Accepter la Novorossia comme sujet autonome ukrainien tant qu'elle reste en paix et contrôle du territoire."
 UKR_separatist_crisis_active_tt: "La vague des républiques régionales de 2014 est active."
 UKR_separatist_treasury_tt: "Le Trésor doit contenir assez de fonds pour cette action."
 SOV_backed_seuar: "La Russie a soutenu le mouvement SEUAR"
 UKR_crimea_2004_resolution: "Le processus de statut de la Crimée de 2004 a commencé"
 UKR_crimea_2004_pending: "Le référendum de Crimée de 2004 est en attente"
 UKR_crimea_2004_departed: "La Crimée a quitté l'Ukraine en 2004"
 UKR_orange_2004_started: "La crise politique de 2004 a commencé"
 UKR_orange_2004_resolved: "La crise politique de 2004 a été résolue"
 CRM_2004_content_unlocked: "L'administration de Crimée de 2004 est active"
 UKR_provisional_republic_focus_setup: "L'administration de la république provisoire est active"
 UKR_crimea_2004_status: "Régler le statut de la Crimée"
 UKR_crimea_2004_status_desc: "Le Conseil suprême de Crimée défie Kiev tandis que Moscou soutient le mouvement d'autonomie du Sud-Est. Décider comment traiter la Crimée avant que la crise ne s'élargisse."
 SOV_seuar_intervention_category: "Soutenir le Sud-Est"
 SOV_seuar_intervention_category_desc: "Moscou peut influencer la lutte d'autonomie du Sud-Est ukrainien, au risque de transformer une crise politique en guerre."
 UKR_seuar_counter_protests: "Soutenir les contre-manifestations locales"
 UKR_seuar_counter_protests_desc: "Soutenir des manifestations locales qui rejettent le mouvement d'autonomie et rétablissent l'influence de Kiev."
 UKR_seuar_internal_troops: "Déployer les troupes intérieures"
 UKR_seuar_internal_troops_desc: "Utiliser les troupes du ministère de l'Intérieur pour sécuriser les bâtiments publics et faire pression sur le mouvement d'autonomie."
 UKR_seuar_special_operations: "Mener les opérations SBU-HUR"
 UKR_seuar_special_operations_desc: "Utiliser le renseignement et les opérations spéciales pour perturber le mouvement d'autonomie. Cela augmente le risque d'intervention russe."
 UKR_seuar_reintegrate: "Offrir un compromis constitutionnel"
 UKR_seuar_reintegrate_desc: "Offrir à la SEUAR un compromis constitutionnel et la réintégrer à l'Ukraine."
 UKR_seuar_force: "Forcer la question de l'autonomie"
 UKR_seuar_force_desc: "Mettre fin par la force à l'arrangement d'autonomie. Cela peut provoquer une guerre frontalière et une intervention russe."
 SOV_seuar_fund_movement: "Financer le mouvement d'autonomie"
 SOV_seuar_fund_movement_desc: "Fournir un soutien politique et financier aux organisateurs de la SEUAR."
 SOV_seuar_suborn_units: "Unités locales suborn"
 SOV_seuar_suborn_units_desc: "Encourager les unités ukrainiennes locales à bloquer les ordres ou à se ranger du côté du mouvement d'autonomie."
 SOV_seuar_send_volunteers: "Envoyer des bénévoles"
 SOV_seuar_send_volunteers_desc: "Envoyer des volontaires des régions frontalières pour défendre le mouvement d'autonomie."
 UKR_seuar_active_tt: "La lutte d'autonomie de la SEUAR est active."
 UKR_seuar_treasury_tt: "Le Trésor doit contenir assez de fonds pour cette action."
 SOV_seuar_treasury_tt: "Le Trésor doit contenir assez de fonds pour cette action."
 UKR_pro_russian_support_30_tt: "La Russie détient au moins §Y30 %§! d'influence sur l'Ukraine"
 UKR_seuar_counter_protests_tt: "Fait basculer la lutte d'autonomie vers Kiev de §R0.10§! et coûte de la stabilité."
 UKR_seuar_internal_troops_tt: "Coûte §R3§! au Trésor, fait basculer la lutte vers Kiev de §R0.15§!, et coûte de la stabilité."
 UKR_seuar_special_operations_tt: "Coûte §R5§! au Trésor, fait basculer la lutte vers Kiev de §R0.08§!, et coûte de la stabilité."
 UKR_seuar_reintegration_tt: "La SEUAR sera réintégrée. L'Ukraine gagne de l'influence russe et la tension baisse de §G15§!."
 UKR_seuar_force_tt: "La SEUAR deviendra indépendante et une guerre frontalière limitée commencera."
 UKR_seuar_intervention_risk_tt: "L'intervention russe devient possible si la guerre continue."
 UKR_seuar_no_intervention_tt: "Moscou peut rester en dehors du conflit."
 SOV_seuar_fund_movement_tt: "Coûte §R5§! au Trésor et fait basculer la lutte vers l'autonomie de §G0.10§!."
 SOV_seuar_suborn_units_tt: "Coûte §R4§! au Trésor, fait basculer la lutte vers l'autonomie de §G0.12§!, et augmente l'escalade."
 SOV_seuar_send_volunteers_tt: "Coûte §R8§! au Trésor, fait basculer la lutte vers l'autonomie de §G0.18§!, et augmente l'escalade."
 UKR_prp_provisional_administration: "Établir une administration provisoire"
 UKR_prp_provisional_administration_desc: "La nouvelle république a besoin d'une administration fonctionnelle avant que la crise ne se durcisse en division permanente."
 UKR_prp_local_security: "Organiser la sécurité locale"
 UKR_prp_local_security_desc: "Des comités de sécurité locaux peuvent réduire le désordre sans transformer chaque litige politique en guerre."
 UKR_prp_volunteer_forces: "Lever des forces bénévoles"
 UKR_prp_volunteer_forces_desc: "Des volontaires défendront la république tant que ses institutions et ses forces régulières restent inéprouvées."
 UKR_prp_utilities_repair: "Réparer les services publics et les routes"
 UKR_prp_utilities_repair_desc: "Réparer le réseau de transport et de services publics reconnectera les communautés qui dépendent du gouvernement provisoire."
 UKR_prp_emergency_economy: "Stabiliser l'économie d'urgence"
 UKR_prp_emergency_economy_desc: "Une petite base industrielle et une production d'urgence peuvent maintenir l'approvisionnement de la république pendant la transition."
 UKR_prp_constitutional_choice: "Choisissez un règlement constitutionnel"
 UKR_prp_constitutional_choice_desc: "Les institutions provisoires doivent décider si elles sont un pont vers Kiev, un partenaire de Moscou, ou le fondement d'un État séparé."
 UKR_prp_negotiate_kyiv: "Négocier avec Kiev"
 UKR_prp_negotiate_kyiv_desc: "Un règlement direct avec Kiev peut protéger les institutions locales tout en évitant une nouvelle confrontation armée."
 UKR_prp_seek_moscow_support: "Solliciter le soutien de Moscou"
 UKR_prp_seek_moscow_support_desc: "Moscou peut fournir un soutien diplomatique, mais accepter son appui façonnera l'alignement futur de la république."
 UKR_prp_independent_republic: "Proclamer une République indépendante"
 UKR_prp_independent_republic_desc: "Le gouvernement provisoire peut mettre fin à son statut subordonné et accepter les risques de se tenir seul."
 UKR_prp_regional_union: "Bâtir une union régionale"
 UKR_prp_regional_union_desc: "Travailler avec le règlement Novorossia existant plutôt que de créer un autre tag concurrent."
 DRP_pivdenmash_rearmament: "Redémarrer Pivdenmash"
 DRP_pivdenmash_rearmament_desc: "Les anciennes usines de fusées et de machines lourdes de Youjmach peuvent encore produire des armes, si quelqu'un est prêt à rouvrir ses ateliers."
 DRP_industrial_mobilization: "Mobiliser l'industrie de Dnipro"
 DRP_industrial_mobilization_desc: "La base industrielle de l'ère soviétique de Dnipro peut être tournée vers les besoins de la république, au détriment de ce qui reste de production civile."
 DRP_dnieper_logistics: "Logistique sécurisée sur le fleuve Dniepr"
 DRP_dnieper_logistics_desc: "Le fleuve a toujours transporté les marchandises de la région. Reconstruire ses débarcadères et ses routes d'accès maintient ce trafic sous le contrôle de la république."
 DRP_kolomoisky_purge: "Purger le réseau Kolomoïsky"
 DRP_kolomoisky_purge_desc: "Le réseau de patronage de l'oligarque traverse encore l'administration locale et les affaires. L'extirper ouvre la voie aux hommes de la république."
 DRP_state_security_consolidation: "Consolider la sécurité d'État"
 DRP_state_security_consolidation_desc: "Un véritable service de sécurité, responsable devant la république et non devant la faction qui contrôle un district donné, se fait attendre."
 DRP_moscow_alignment: "S'aligner sur Moscou"
 DRP_moscow_alignment_desc: "Formaliser des liens militaires et économiques avec Moscou échange l'indépendance d'action contre un patron qui ne laissera pas tomber la république."
 UKR_seuar_autonomy_movement: "Mouvement pour l'autonomie SEUAR"
 UKR_seuar_autonomy_movement_desc: "Un mouvement d'autonomie du Sud-Est conteste l'autorité de Kiev. Son avenir dépend de l'équilibre entre organisateurs locaux et pression de l'État."
 UKR_western_crisis_idea: "Gouvernement de l'Ukraine occidentale"
 UKR_western_crisis_idea_desc: "Les oblasts de l'ouest refusent de reconnaître l'élection frauduleuse et ont proclamé leur propre gouvernement. L'impasse paralyse la politique nationale jusqu'à ce que Kiev règle la question occidentale."
 UKR_constitutional_compromise_idea: "Compromis constitutionnel"
 UKR_constitutional_compromise_idea_desc: "Le règlement constitutionnel qui a mis fin à la crise d'autonomie décentralise un véritable pouvoir vers les régions. Il calme le Sud-Est au prix d'un gouvernement central plus faible."
 ukraine_kuchma.14.t: "Protestations dans le Sud-Est"
 ukraine_kuchma.14.d: "Après l'élection, des activistes du sud-est rejettent le règlement de Kiev et organisent le Maïdan bleu. Le mouvement menace de transformer une crise électorale en crise régionale."
 ukraine_kuchma.14.a: "La situation se dégrade"
 ukraine_kuchma.15.t: "Maïdan bleu en Ukraine"
 ukraine_kuchma.15.d: "Le Maïdan bleu demande à Moscou de reconnaître sa demande d'autonomie régionale. Le Kremlin doit décider s'il accorde un poids politique au mouvement."
 ukraine_kuchma.15.a: "Soutenir le mouvement autonomiste"
 ukraine_kuchma.15.b: "We Shouldn't Interfere"
 ukraine_kuchma.16.t: "Gouvernement du Sud-Est"
 ukraine_kuchma.16.d: "Le Maïdan bleu a formé un gouvernement de coordination et affirme que Kiev ne représente plus le sud-est. Les responsables locaux demandent un règlement politique formel."
 ukraine_kuchma.16.a: "Envoyez la police là-bas de toute urgence"
 ukraine_kuchma.17.t: "La révolution bleue"
 ukraine_kuchma.17.d: "Des délégués du Maïdan bleu proclament un projet d'autonomie de l'Ukraine du Sud-Est. Le mouvement cherche désormais un congrès plutôt qu'une déclaration immédiate d'indépendance."
 ukraine_kuchma.17.a: "La tempête a commencé"
 ukraine_kuchma.18.t: "Manifestations en Galicie"
 ukraine_kuchma.18.d: "L'élection contestée a poussé des activistes de l'ouest dans les rues. Des heurts avec la police menacent de transformer la crise présidentielle en une confrontation constitutionnelle plus large."
 ukraine_kuchma.18.a: "La situation se dégrade"
 ukraine_kuchma.19.t: "Maïdan rouge en Ukraine"
 ukraine_kuchma.19.d: "Des activistes galiciens exigent une élection honnête et demandent à la Pologne si elle soutiendra leur campagne politique. Un endossement étranger pourrait approfondir la crise."
 ukraine_kuchma.19.a: "Soutenir les forces démocratiques"
 ukraine_kuchma.19.b: "We Shouldn't Interfere"
 ukraine_kuchma.20.t: "Le gouvernement de l'Ukraine occidentale"
 ukraine_kuchma.20.d: "Des activistes de l'ouest ont formé un comité de coordination politique et refusent d'accepter le règlement électoral de Kiev. La confrontation reste politique, mais le pays devient plus difficile à gouverner."
 ukraine_kuchma.20.a: "Envoyez la police là-bas de toute urgence"
 ukraine_kuchma.21.t: "La révolution rouge"
 ukraine_kuchma.21.d: "Le Maïdan rouge annonce une campagne de résistance contre le gouvernement prorusse à Kiev. La crise reste une lutte politique, non un nouveau pays."
 ukraine_kuchma.21.a: "La tempête a commencé"
 ukraine_revolution.1.t: "La révolution orange commence"
 ukraine_revolution.1.d: "La crise électorale a atteint son point de rupture. Si le gouvernement n'agit pas, les protestations se propageront avant la fin de l'année."
 ukraine_revolution.1.a: "Ouvrir le Maïdan orange"
 ukraine_revolution.10.t: "Le congrès de Severodonetsk"
 ukraine_revolution.10.d: "Des délégués du Sud-Est ukrainien se sont réunis à Severodonetsk. Ils peuvent se limiter à un congrès historique, ou demander un processus d'autonomie formel."
 ukraine_revolution.10.a: "Tenir le congrès"
 ukraine_revolution.10.b: "Demander l'autonomie"
 ukraine_revolution.11.t: "La lutte pour l'autonomie"
 ukraine_revolution.11.d: "Le mouvement d'autonomie et Kiev ont passé des mois à se disputer le contrôle du Sud-Est. L'équilibre détermine désormais si le mouvement est réprimé, négocié, ou se voit accorder une république formelle."
 ukraine_revolution.11.a: "Trancher la lutte"
 ukraine_revolution.12.t: "SEUAR proclame son autonomie"
 ukraine_revolution.12.d: "Le congrès du Sud-Est a exigé une république autonome formelle. Kiev doit décider s'il reconnaît la nouvelle République autonome ukrainienne du Sud-Est."
 ukraine_revolution.12.a: "Reconnaître la république"
 ukraine_revolution.13.t: "Un compromis constitutionnel"
 ukraine_revolution.13.d: "Le mouvement d'autonomie est resté à l'intérieur de l'Ukraine, mais ses institutions séparées deviennent difficiles à soutenir. Un compromis constitutionnel pourrait rétablir un État ukrainien unique."
 ukraine_revolution.13.a: "Réintégrer SEUAR"
 ukraine_revolution.14.t: "Le cessez-le-feu de la SEUAR"
 ukraine_revolution.14.d: "Les combats entre l'Ukraine et la SEUAR ont épuisé les deux camps. Un cessez-le-feu laisserait la nouvelle république indépendante, mais le conflit pourrait continuer."
 ukraine_revolution.14.a: "Acceptez un cessez-le-feu"
 ukraine_revolution.14.b: "Poursuivre la guerre"
 ukraine_revolution.15.t: "Moscou envisage une intervention"
 ukraine_revolution.15.d: "L'usage de la force par l'Ukraine a porté le conflit de la SEUAR à l'attention de Moscou. Le Kremlin doit décider s'il rejoint la guerre."
 ukraine_revolution.15.a: "Maudits Russes !"
 ukraine_revolution.15.b: "Rester hors de la guerre"
 ukraine_revolution.16.t: "La guerre frontalière de la SEUAR"
 ukraine_revolution.16.d: "Kiev a rejeté l'arrangement d'autonomie et a ordonné à ses forces de mettre fin au statut séparé de la SEUAR. La décision risque de transformer la crise constitutionnelle en guerre."
 ukraine_revolution.16.a: "Mettre fin à l'autonomie"
 ukraine_revolution.17.t: "La question occidentale"
 ukraine_revolution.17.d: "Le gouvernement autoproclamé de l'Ukraine occidentale refuse toujours de reconnaître l'élection frauduleuse. Des mois d'impasse ont laissé à Kiev le choix entre concessions et force."
 ukraine_revolution.17.a: "Négocier avec l'Ouest"
 ukraine_revolution.17.b: "Réprimer"
 ukraine_revolution.20.t: "La décision d'association"
 ukraine_revolution.20.d: "L'accord d'association avec l'Union européenne est prêt pour une décision politique. Le suspendre peut mettre la rue en mouvement, tandis que le signer pourrait reporter la crise."
 ukraine_revolution.20.a: "Suspendre l'accord"
 ukraine_revolution.20.b: "Signer l'accord"
 ukraine_revolution.21.t: "L'accord reconsidéré"
 ukraine_revolution.21.d: "Des mois après la signature de l'accord d'association, les tensions politiques ont continué de monter. Le gouvernement doit désormais affronter les conséquences de son choix."
 ukraine_revolution.21.a: "Affronter les conséquences"
 UKR_seuar_sov_support_tt: "L'influence russe sur l'Ukraine augmentera, et le mouvement d'autonomie continuera."
 UKR_seuar_sov_decline_tt: "Moscou ne s'engagera pas auprès du mouvement d'autonomie."
 UKR_western_poland_support_tt: "Polish influence over Ukraine will increase, and the western political movement will continue."
 UKR_western_poland_decline_tt: "La Pologne ne s'engagera pas auprès du mouvement politique occidental."
 UKR_crimea_2004_permit_tt: "Le Conseil suprême de Crimée organisera un référendum de statut. Moscou décidera de sa réponse."
 UKR_crimea_2004_restrain_tt: "La Crimée restera en Ukraine en tant que république autonome."
 UKR_crimea_2004_underwrite_tt: "Moscou garantira la sécession de la Crimée vis-à-vis de l'Ukraine."
 UKR_amber_wars_category: "Les guerres de l'ambre"
 UKR_amber_wars_category_desc: "[UKR.GetFlag]§YL'Ukraine§! ferme les yeux tandis que des creuseurs dépouillent les forêts de pins de Volhynie pour l'ambre, et que les officiels locaux pèsent leur part des profits contre le coût d'une répression."
 UKR_amber_crackdown: "Réprimer les creuseurs"
 UKR_amber_crackdown_desc: "Envoyer la police et la Garde nationale dans les champs d'ambre pour vider les fosses illégales, saisir le matériel et arrêter les creuseurs. Cela n'éteindra pas le commerce pour de bon, mais cela achète à l'État un peu de calme et de recettes fiscales."
 UKR_amber_tolerate: "Tolérer le creusement"
 UKR_amber_tolerate_desc: "Laisser les officiels locaux continuer de prélever leur part officieuse et laisser les creuseurs tranquilles. L'argent circule, mais aussi le ressentiment envers un État qui n'apparaît que pour prendre sa part."
 ukraine_amber.1.t: "La République des Kopach se proclame"
 ukraine_amber.1.d: "Alors que l'autorité de l'État en Volhynie est déjà vidée par la guerre, une bande de creuseurs d'ambre et de caïds locaux déclare les fosses autour de Klesiv leur affaire. Ils l'appellent la République des Kopach, d'après le mot ukrainien pour creuseur, et posent un checkpoint sur la route de Sarny."
 ukraine_amber.1.a: "En prendre note et passer à autre chose"
 UKR_amber_resentment: "Amber Rush Anarchie"
 UKR_amber_kopach_truce: "La trêve des creuseurs"
 ukraine_amber.2.t: "La République des Kopach se dissout"
 ukraine_amber.2.d: "La république autoproclamée des creuseurs n'avait jamais eu de gouvernement à proprement parler, seulement un checkpoint et une grille de tarifs. L'ambre facile s'épuisant et la nouveauté passée, les caïds reprennent tranquillement le creusement sans le drapeau."
 ukraine_amber.2.a: "Reconnu"
 UKR_strategic_industry_chinese_capital_corridor: "Couloir de la capitale chinoise"
 UKR_strategic_industry_chinese_capital_corridor_desc: "Les capitaux chinois et l'accès aux marchés ancrent l'investissement dans les moteurs et la fabrication avancée. Le corridor apporte l'échelle, au prix de préoccupations plus aiguës de transfert de technologies et de contrôle."
 UKR_strategic_industry_independent_distributed_industry: "Industrie distribuée indépendante"
 UKR_strategic_industry_independent_distributed_industry_desc: "Un réseau d'entreprises nationales, de centres de réparation et d'ateliers dispersés donne à l'Ukraine une production résiliente et une adaptation rapide. Il excelle dans la continuité en temps de guerre, même s'il ne peut reproduire toutes les fonctions de l'industrie lourde."
 UKR_strategic_industry_renewed_post_soviet_integration: "Intégration post-soviétique renouvelée"
 UKR_strategic_industry_renewed_post_soviet_integration_desc: "La réouverture des chaînes d'approvisionnement orientales reconnecte les usines ukrainiennes aux marchés, composants et normes familiers. L'efficacité revient, avec une exposition stratégique renouvelée."
 UKR_strategic_industry_western_integrated_defense_industry: "Industrie de défense intégrée à l'Occident"
 UKR_strategic_industry_western_integrated_defense_industry_desc: "Les entreprises nationales et les entreprises stratégiques d'État sont liées aux normes occidentales, à l'investissement, aux réseaux de réparation et aux partenariats de production. L'intégration élargit les marchés et l'accès aux approvisionnements tout en liant la modernisation à la coopération alliée."
 ukraine_tech.300.a: "Préserver les combinats stratégiques"
 ukraine_tech.300.b: "Privatiser les combinats et laisser le marché décider"
 ukraine_tech.300.d: "L'indépendance a laissé à l'Ukraine Antonov, Motor Sich, Yuzhmash et les bureaux d'études autour d'eux, mais pas le marché complet ni le réseau de fournisseurs qui les avaient soutenus. Garder ensemble spécialistes et installations exigera des choix que l'État peut à peine se permettre."
 ukraine_tech.300.t: "L'héritage sans marché"
 ukraine_tech.301.a: "Conserver le réseau de moteurs postsoviétique"
 ukraine_tech.301.b: "Financer un écosystème de moteurs indépendants"
 ukraine_tech.301.d: "Ivchenko-Progress conçoit les moteurs, Motor Sich les fabrique. Le complexe lié de Zaporijjia tourne encore sur des marchés et fournisseurs hérités, forçant un choix entre garder ce réseau vivant et payer pour en construire un indépendant."
 ukraine_tech.301.t: "Des moteurs pour un empire disparu"
 ukraine_tech.302.a: "Miser davantage sur les réseaux hérités"
 ukraine_tech.302.b: "Diversifier prudemment les contrats"
 ukraine_tech.302.d: "Les commandes russes de moteurs Motor Sich et de cellules Antonov font tourner les usines, pourtant le même réseau contrôle composants, certification et clients. La diversification coûte cher maintenant, mais la dépendance amplifiera toute rupture future."
 ukraine_tech.302.t: "Les liens qui enchaînent"
 ukraine_tech.303.a: "Couper net la chaîne d'approvisionnement russe"
 ukraine_tech.303.b: "Garder ce qui fonctionne encore via des intermédiaires"
 ukraine_tech.303.d: "La rupture politique a tranché les relations industrielles russes sur lesquelles Antonov, Motor Sich et Youjmach étaient bâtis. Le choc immédiat reflète l'exposition acceptée plus tôt, et les entreprises survivantes doivent reconstruire fournisseurs, normes et marchés sous pression."
 ukraine_tech.303.t: "La rupture"
 ukraine_tech.304.a: "Bloquer la vente et garder Motor Sich ukrainien"
 ukraine_tech.304.b: "Permettre le contrôle chinois"
 ukraine_tech.304.d: "Des investisseurs liés à la Chine cherchent le contrôle de Motor Sich, mêlant propriété privée, capital étranger, technologie aéronautique et sécurité nationale en un seul litige. Les usines de Motor Sich sont stratégiques, mais ce n'est pas la même institution que le bureau d'études Ivchenko-Progress."
 ukraine_tech.304.t: "À qui appartient Motor Sich ?"
 ukraine_tech.305.a: "Un arsenal à nous, bâti sous le feu"
 ukraine_tech.305.b: "Un corridor pour le capital chinois"
 ukraine_tech.305.c: "Une industrie de défense intégrée à l'Ouest"
 ukraine_tech.305.e: "Intégration post-soviétique renouvelée"
 ukraine_tech.305.d: "Un quart de siècle de privatisations, de rupture, de capital étranger et de guerre à grande échelle a tranché ce qu'il est advenu d'Antonov, Motor Sich et Youjmach, et ce qui les a remplacés. Ce qui a survécu, ce qui a été bâti sous le feu, et à qui cela répond désormais décident ce que l'Ukraine peut fabriquer pour elle-même."
 ukraine_tech.305.t: "Ce qu'est devenue l'industrie ukrainienne"
 UKR_party_regions_inauguration: "Inauguration de Ianoukovitch"
 UKR_party_regions_inauguration_desc: "Il est temps de l'investiture de notre nouveau président."
 ukraine_tech.305.f: "Une industrie indépendante et dispersée"
 ukraine_tech.306.t: "La Mriya brûle"
 ukraine_tech.306.d: "Despite great losses, Russian troops took Antonov Airport at Hostomel in the first hours. Their objective was to use it as an outpost and a supply hub for further invasion, but they have failed to achieve this goal - it was heavily bombed by Ukrainian forces.\nAs a result of fierce battles around Hostomel the An-225 Mriya, the largest aircraft ever built and the pride of the Ukrainian aviation industry has burned in its hangar.\nThis truly is an unpleasant situation for Ukraine. If we want to prevent such failures in the future - we need to start thinking about relocating our industries. Production can be broken up and moved west, into smaller shops and underground, at the cost of every economy of scale the combines were built around. Or the plants can keep working where they stand."
 ukraine_tech.306.a: "Disperser la production vers l'ouest et sous terre"
 ukraine_tech.306.b: "Garder les usines en activité là où elles sont"
 ukraine_tech.307.t: "Quatre millions de drones"
 ukraine_tech.307.d: "Le cluster Brave1 a transformé des ateliers de garage en pipeline d'achat, et l'Ukraine construit désormais plus de drones d'attaque en un mois que la plupart des armées n'en détiennent. Rheinmetall et Baykar veulent tous deux des coentreprises sur le sol ukrainien, qui apporteraient capital, normes et carnets de commandes OTAN. L'État peut tout verser dans la base nationale de drones et de missiles qu'il possède déjà, ou céder une part pour s'intégrer à la production alliée."
 ukraine_tech.307.a: "Financer la base souveraine de drones et de missiles"
 ukraine_tech.307.b: "Prendre les coentreprises et les carnets alliés"
 UKR_strategic_industry_wartime_drone_arsenal: "Arsenal de drones en temps de guerre"
 UKR_strategic_industry_wartime_drone_arsenal_desc: "L'Ukraine construit ses propres drones et missiles dans des centaines d'ateliers dispersés qu'aucune frappe unique ne peut fermer. La capacité est nationale, l'itération se mesure en semaines, et personne d'autre ne détient un veto sur ce qui est construit."
 UKR_lahuna_recon_ship_idea_1: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_1_desc: "Une coque qui ressemble à un bateau de pêche, à l'écoute de tout ce qui se trouve à l'horizon."
 UKR_lahuna_recon_ship_idea_2: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_2_desc: "Une coque qui ressemble à un bateau de pêche, à l'écoute de tout, même au-delà de l'horizon."
 UKR_lahuna_recon_ship_idea_3: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_3_desc: "A purpose-built hull that looks like a civil vessel, listening to everything within the horizon."
 UKR_lahuna_recon_ship_idea_4: "Navire de reconnaissance Simferopol"
 UKR_lahuna_recon_ship_idea_4_desc: "A purpose-built hull that looks like a civil vessel, listening to everything even over the horizon."
 UKR_lahuna_recon_ship: "Suite de capteurs de classe Lahuna"
 UKR_reorganize_navy_category: "Réorganiser la marine ukrainienne"
 UKR_reorganize_navy_category_desc: "\n\n\n\n\n\n£UKR_desctext_reorganize_navy\n\n\n\n\n\n\n\n\nCes décisions aideront à réorganiser et améliorer notre marine. Cependant, certains choix peuvent avoir des effets négatifs imprévus."
 UKR_reorganize_navy_finish_ternopil_construction: "Terminer la construction de la corvette §GTernopil §YProjet 1124MU§!"
 UKR_reorganize_navy_finish_ternopil_construction_desc: "\n\n\n\n\n\n£UKR_desctext_ternopil_corvette_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can allocate some budget in order to finally finish the prolonged production of §YU209 'Ternopil'§! 'Project 1124MU' corvette.§!"
 UKR_reorganize_navy_choose_future_corvette: "Choisir le futur type de corvette principale"
 UKR_reorganize_navy_choose_future_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_future_corvette_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can choose the preferable size and type of future corvettes - our Navy's working horse.§!"
 UKR_reorganize_navy_build_project_58250_corvette: "Lancer la production des corvettes §YProjet 58250§! §GClasse 'Volodymyr Velykyi'§!"
 UKR_reorganize_navy_build_project_58250_corvette_desc: "\n\n\n\n\n\n£UKR_desctext_project_58250_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §Y'Volodymyr Velykyi'§! class (or §YProject 58250§! class) is a class of multipurpose corvettes ordered by the Ukrainian Navy.\nThe new ship was projected to be a little bigger than a corvette, but smaller than a frigate.\nThe new project was developed in 2008 by State Research and Design Shipbuilding Center.\nFrom the beginning of program there was discussion of about 10 such ships.\n\nWe can choose exact amount of corvettes to be built with this decision.§!"
 UKR_reorganize_navy_restore_1124: "Examiner §G2 corvettes §YProjet 1124§! pour une réactivation possible"
 UKR_reorganize_navy_restore_1124_desc: "\n\n\n\n\n\n£UKR_desctext_project_1124_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can check for possibility to return from decommission 2 of our 'Project 1124' corvettes.\nDuring the 1997 partition of Black Sea Fleet of USSR, §R'MPK-43'§! (renamed to §YU209 'Sumy'§!) and §R'MPK-52'§! (renamed to §YU210 'Kherson'§!) were transferred to Ukraine but due to sabotage from Russian side both ships were in a state of non-combat readiness.\nDue to lack of funds for required extensive maintenance and repairs, both ships were written off and disposed of shortly after joining the Ukrainian Navy.\nAs those ships have not yet been scrapped, we can rewind our original decision, search for some money and refurbish them.\nBe aware, that this decision will cost us a lot and will provide us with 2 moderate corvettes instead of possibility to invest into procurement of modern ships.§!"
 UKR_reorganize_navy_buy_lithuanian_1124: "Exprimer le souhait d'acheter §G2 corvettes §YProjet 1124§! à la Lituanie"
 UKR_reorganize_navy_buy_lithuanian_1124_desc: "\n\n\n\n\n\n£UKR_desctext_lithuanian_corvettes_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can send a diplomatic request to Lithuania to consider the possible sale of 2 corvettes of the 'Project 1124', named §YF11 'Žemaitis'§! and §YF12 'Aukštaitis'§! to us.\nThese 2 ships were transferred to the Armed Forces of Lithuania after the collapse of the USSR and are relatively old combat units.\nNevertheless, these are the same type of ships we already have in our Navy, so their training, maintenance and combat use will not be a problem for us.\nHowever, the purchase of these ships will reduce the amount of available funds for the possible procurement of newer ships.§!"
 UKR_reorganize_navy_maintain_1135: "Entretenir les §G3 frégates §YProjet 1135§!"
 UKR_reorganize_navy_maintain_1135_desc: "\n\n\n\n\n\n£UKR_desctext_project_1135_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can fund our Navy to properly maintain and return to active service 3 of our 'Project 1135' frigates.\nIn July 1997, in accordance with the Ukrainian-Russian agreement on the parameters of the distribution of the Black Sea Fleet, three patrol ships of the Black Sea Fleet of the USSR were transferred to Ukraine: §R'Razitelnyi'§! (renamed §YU132 'Sevastopol'§!), §R'Bezukoriznennyi'§! (renamed §YU133 'Mykolayiv'§!) and §R'Bezzavetnyi'§! (renamed §YU134 'Dnipropetrovsk'§!).\nHowever, all three were not used as combat units due to the lack of funds for repairs and restoration of technical readiness and were soon decommissioned.§!"
 UKR_reorganize_navy_maintain_1241: "Maintenir le §G3 §YProjet 1241§! petites corvettes§!"
 UKR_reorganize_navy_maintain_1241_desc: "\n\n\n\n\n\n£UKR_desctext_project_1241_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can fund our Navy to give proper maintenance and return to active service 3 of our 'Project 1241' small corvettes.\nIn 1997, during the partition of the Black Sea Fleet, Ukraine received 4 corvettes of 'Project 1241' type in 2 different roles: 2 missile boats, §YU155 'Nikopol'§! and §YU156 'Kremenchuk'§!, and 2 small ASW corvettes: §YU207 'Uzhhorod'§! and §YU208 'Khmelnytskyi'§!. Only §YU155 'Nikopol'§! missile boat was transferred in good condition, other 3 vessels were delivered in a state of non-combat readiness and due to lack of funds for repairs and restoration of technical readiness they are still not in active service.§!"
 UKR_reorganize_navy_maintain_641_submarine: "Entretenir le sous-marin §GZaporijjia §YProjet 641§!"
 UKR_reorganize_navy_maintain_641_submarine_desc: "\n\n\n\n\n\n£UKR_desctext_zaporizhzhia_submarine_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can fund our Navy to properly maintain and return to active service our only submarine - §YU01 'Zaporizhzhia'§! of 'Project 641'.\nIn 1997 unable to fix the unused submarine, the administration of Russian Navy handed it over to the Ukrainian Navy during the partition of the Black Sea Fleet.\nUnfortunately, the submarine's batteries permanently failed and she required complete maintenance and replacement of batteries in order to function.\nWe may allocate some funds to proceed with repairing the submarine.§!"
 UKR_reorganize_navy_finish_11451: "Terminer la construction de §G2 corvettes §YProjet 11451§!"
 UKR_reorganize_navy_finish_11451_desc: "\n\n\n\n\n\n£UKR_desctext_project_11451_for_tooltip\n\n\n\n\n\n\n\n\n§W'Project 11451' is a series of small anti-submarine ships (corvettes) built at the Feodosiya Shipyard 'More' since 1987, only 2 were built before the dissolution of USSR.\nCorvettes §YU201 'Lviv'§! (construction readiness near 95%) and §YU203 'Luhansk'§! (construction readiness near 60%) continue to be at the slipway of naval yard 'More' in Feodosiya.\nDue to the termination of state funding, the completion of the ships was suspended, but now their further fate can be chosen at last.§!"
 UKR_reorganize_navy_finish_ukrayina: "Terminer la construction du croiseur §GUkrayina§! §YProjet 1164§!"
 UKR_reorganize_navy_finish_ukrayina_desc: "\n\n\n\n\n\n£UKR_desctext_ukrayina_cruiser_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y'Ukrayina'§! is an unfinished soviet design 'Project 1164 Class' cruiser.\nDue to budget constraints work on the cruiser stopped in the early 1990s and the ship was left unfinished. In 1993 the cruiser was withdrawn from the Russian Navy and passed to Ukraine.\nWe can invest a handful of money into finishing the construction and then we'll show the true naval power of Ukraine in the Black Sea!\n\n§GA particularly important military project:§! once it is completed, the §YVerkhovna Rada§! will be more willing to approve a higher military budget.§!"
 UKR_reorganize_navy_finish_ternopil_construction_flag: " Completed decision Finish the construction of §GTernopil§! §YProject 1124MU§! §Gcorvette§!"
 UKR_reorganize_navy_funded_project_58250_corvette_development_flag: " Événement achevé §YPriorité aux corvettes polyvalentes§! avec l'option §GAllouons un budget§!"
 UKR_reorganize_navy_not_funded_project_58250_corvette_development_flag: " Événement achevé §YPriorité aux corvettes polyvalentes§! avec l'option §RRéduisons nos dépenses§!"
 UKR_reorganize_navy_developed_project_58250_corvette_development_flag: " Événement achevé §YConstruire les corvettes de classe projet 58200 « Haïdouk-21 »§!"
 UKR_reorganize_navy_repair_rivne: "Réparer le grand navire de débarquement §GRivne§! §YProjet 1171§!"
 UKR_reorganize_navy_repair_rivne_desc: "\n\n\n\n\n\n£UKR_desctext_rivne_lst_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can fund our Navy to properly maintain and return to active service the large landing ship §YU762 'Rivne'§! of 'Project 1171'.\nOn April 10, 1994, a military camp in the Practical Harbor of the Odesa Sea Port was forcibly seized by a Ukrainian airborne assault company from Bolhrad, where the 'Project 1171' 'Ilya Azarov' and the 'Project 773' SDK-137 LSTs were located, and on April 18, 1994, by a unilateral act, the ship was accepted into the Navy of the Armed Forces of Ukraine.\nUnfortunately, due to lack of funds for repairs and restoration of technical readiness, the bigger ship has become inoperable as a LST platform, and was reclassified as dry cargo military transport ship and is currently in non-combat readiness.\nWe can allocate some funds to proceed with repairing the ship and return it to active service as a LST or at least as a support ship.§!"
 UKR_reorganize_navy_repair_support_ships: "Repair §G3§! §Ysupport§! and §Yrepair§! ships, currently in non-combat readiness"
 UKR_reorganize_navy_repair_support_ships_desc: "\n\n\n\n\n\n£UKR_desctext_support_ships_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can fund our Navy to properly maintain and return to active service a couple of support ships: large sea tanker §YU757 'Makiyivka'§!, medium tanker §YU758 'Kerch'§! and floating workshop §Y'Olviya'§!.\nIn 2000 all three mentioned ships were not used as active units due to the lack of funds for repairs and restoration of technical readiness and were soon decommissioned.\nWe can push a little harder on dedicated resources and return them to active fleet.§!"
 UKR_reorganize_navy_build_lahuna_recon_ship: "Projet §YLahuna§! : un navire de §Yreconnaissance§!"
 UKR_reorganize_navy_build_lahuna_recon_ship_desc: "\n\n\n\n\n\n£UKR_desctext_simferopol_recon_for_tooltip\n\n\n\n\n\n\n\n\n§WThe Navy wants a signals intelligence ship and has no money for a purpose-designed one. Kuznya na Rybalskomu has a trawler hull, a slipway and four decades of experience building the same 1,220-tonne boat over and over.\n\nFifty-five metres, 29 crew, 7,200 miles of range, twenty-eight days at sea. Her weapon is the aerial farm.§!"
 UKR_lahuna_needs_kuznya_tt: "We must control the Kyiv shipyard"
 UKR_lahuna_needs_black_sea_port_tt: "We must own a Black Sea port to receive her"
 ukraine_reorganize_navy_restore_1124.1.name: "Réactivation de 2 corvettes 'Projet 1124'"
 ukraine_reorganize_navy_restore_1124.1.desc: "Nous avons examiné les coques de deux corvettes du 'Projet 1124', le 'Soumy' et le 'Kherson'. Nous devons maintenant décider de leur sort.\nNous pouvons soit investir davantage pour réactiver les deux navires, soit démanteler le 'Kherson', dont l'état est plus préoccupant, afin d'utiliser ses pièces pour remettre en service le 'Soumy' plus rapidement."
 ukraine_reorganize_navy_restore_1124.1.a: "Réactiver les deux vaisseaux"
 ukraine_reorganize_navy_restore_1124.1.b: "Cannibaliser le Kherson pour réactiver le Soumy"
 ukraine_reorganize_navy_choose_future_corvette.1.name: "Future Ukrainian corvette program"
 ukraine_reorganize_navy_choose_future_corvette.1.desc: "We are at the point right now, that our decision to choose the future main working horse of our fleet can't be postponed any more.\nWe may choose between a handful of domestic designs, but main decision should be chosen what corvette type will we focus our resources on: cheaper, easier to produce light corvettes of approximately 700 tonnes, standard corvettes of 1 200+ tonnes or heavy multi-purpose corvettes of 2 000+ tonnes of displacement."
 ukraine_reorganize_navy_choose_future_corvette.1.a: "Corvettes légères"
 ukraine_reorganize_navy_choose_future_corvette.1.b: "Corvettes standards"
 ukraine_reorganize_navy_choose_future_corvette.1.c: "Corvettes polyvalentes"
 ukraine_reorganize_navy_choose_future_corvette.2.name: "Priorité aux petites corvettes"
 ukraine_reorganize_navy_choose_future_corvette.2.desc: "We chose to continue with the smaller vessels, and we will proceed with small corvettes (somebody may refer to them as big missile boats - but we will definitely not do it) as our newest fleet addition.\nLet's select the exact class of ships, that we will build."
 ukraine_reorganize_navy_choose_future_corvette.2.a: "'Muson' Class"
 ukraine_reorganize_navy_choose_future_corvette.2.b: "'Mirazh' Class"
 ukraine_reorganize_navy_choose_future_corvette.3.name: "Build the 'Muson' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.3.desc: "We chose the cheapest option among all available, and we will proceed with 'Muson' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.3.a: "16 ships (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.3.b: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.3.c: "8 ships (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.4.name: "Build the 'Mirazh' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.4.desc: "As a result of our independent tender process, we've selected the 'Mirazh' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.4.a: "16 ships (4x4)"
 ukraine_reorganize_navy_choose_future_corvette.4.b: "12 ships (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.5.name: "Focus on standard corvettes"
 ukraine_reorganize_navy_choose_future_corvette.5.desc: "We chose the most obvious option among all available, and we will proceed with standard size corvettes as our newest fleet addition.\nLet's select the exact class of ships, that we will build."
 ukraine_reorganize_navy_choose_future_corvette.5.a: "Project 58200 'Hayduk-21' Class"
 ukraine_reorganize_navy_choose_future_corvette.5.b: "'Mistral-1500T' Class"
 ukraine_reorganize_navy_choose_future_corvette.6.name: "Build the Project 58200 'Hayduk-21' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.6.desc: "As a result of our independent tender process, we've selected the Project 58200 'Hayduk-21' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.6.a: "12 navires (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.6.b: "8 navires (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.6.c: "6 navires (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.name: "Build the 'Mistral-1500T' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.7.desc: "As a result of our independent tender process, we've selected the 'Mistral-1500T' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.7.a: "12 navires (4x3)"
 ukraine_reorganize_navy_choose_future_corvette.7.b: "8 navires (4x2)"
 ukraine_reorganize_navy_choose_future_corvette.7.c: "6 navires (2x3)"
 ukraine_reorganize_navy_choose_future_corvette.8.name: "Focus on multi-purpose corvettes"
 ukraine_reorganize_navy_choose_future_corvette.8.desc: "We chose the most potent option among all available, and we will proceed with bigger multi-purpose corvettes as our newest fleet addition.\nThese will be the Project 58250 'Volodymyr Velykyi' Class corvettes.\nUnfortunately, we do not have exact developed model right now, so we will need to spend some money and time to research it."
 ukraine_reorganize_navy_choose_future_corvette.8.a: "Let's allocate budget"
 ukraine_reorganize_navy_choose_future_corvette.8.b: "Let's cut our expenses"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.name: "Résultats de la réunion avec la Lituanie\nconcernant l'achat de 2 corvettes 'Projet 1124'"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.desc: "Suite à notre réunion avec nos collègues lituaniens concernant l'achat potentiel de 2 corvettes du 'Projet 1124', les résultats sont globalement positifs, la Lituanie étant favorable à cette décision.\nToutefois, ils doivent consulter la Russie pour obtenir l'approbation de cette vente et évaluer les conséquences possibles pour leur pays.\nNous faisons face à un choix : offrir plus d'argent et des opportunités commerciales pour les convaincre d'ignorer l'avis de Moscou, ou attendre l'issue naturelle de leurs consultations."
 ukraine_reorganize_navy_buy_lithuanian_1124.1.a: "Nous essaierons de les convaincre"
 ukraine_reorganize_navy_buy_lithuanian_1124.1.b: "Nous attendrons"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.name: "Second tour des négociations avec la Lituanie\nconcernant l'achat des corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.desc: "Les négociations précédentes n'ayant pas permis d'obtenir le résultat escompté, nous avons décidé d'intensifier nos efforts.\nÀ l'issue de ce second tour, nous avons convenu de l'achat de 2 corvettes aux conditions suivantes : expansion du commerce bilatéral, accord de fourniture d'acier et de charbon, compensation financière pour l'achat d'un nouveau navire pour la flotte lituanienne et transfert de certaines technologies militaires qui leur étaient auparavant inaccessibles.\nAcceptons-nous ces termes ?"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.a: "Oui, bien sûr"
 ukraine_reorganize_navy_buy_lithuanian_1124.2.b: "Non, c'est inabordable"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.name: "Résultats des consultations lituano-russes\nconcernant la vente des corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.desc: "Nos partenaires lituaniens ont mené les négociations avec la partie russe concernant la vente de deux corvettes de conception soviétique.\nMalheureusement, la Russie a refusé la vente aux conditions initialement prévues, mais a exprimé le souhait de mener des consultations supplémentaires avec nous.\nDeux options s'offrent à nous : abandonner l'idée ou entamer des négociations avec la Russie selon ses propres termes."
 ukraine_reorganize_navy_buy_lithuanian_1124.3.a: "Abandonner l'achat de corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.3.b: "Mener des négociations avec la Russie"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.name: "Résultats des négociations ukraino-russes\nconcernant l'achat des corvettes"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.desc: "Nous avons mené des négociations difficiles mais nécessaires avec la Russie. Malheureusement, ils ont parlé en position de force et nous n'avions aucun levier.\nLa Russie a posé un ultimatum pour autoriser la vente par la Lituanie : allocation d'espaces supplémentaires pour la flotte de la mer Noire à Sébastopol, ralentissement de notre rapprochement avec l'UE, renforcement du commerce bilatéral et compensations financières directes à la Russie.\nAcceptons-nous ces termes ?"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.a: "Abandonner l'idée"
 ukraine_reorganize_navy_buy_lithuanian_1124.4.b: "Accepter les conditions de la Russie"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.name: "Finalisation de l'accord d'achat des corvettes lituaniennes"
 ukraine_reorganize_navy_buy_lithuanian_1124.5.desc: "Nous avons enfin accepté toutes les conditions et pouvons procéder à l'achat et au transfert des navires.\nEn signe de respect pour les anciens propriétaires, nous avons accepté de nommer les navires 'Bratslav' et 'Volodymyr', en l'honneur de villes importantes du territoire ukrainien ayant jadis fait partie de l'État commun, le Grand-duché de Lituanie, de Ruthénie et de Samogitie."
 ukraine_reorganize_navy_buy_lithuanian_1124.5.a: "Super!"
 ukraine_reorganize_navy_maintain_1135.1.name: "Entretien de 3 frégates 'Projet 1135'"
 ukraine_reorganize_navy_maintain_1135.1.desc: "Nous avons examiné les coques des frégates 'Sébastopol', 'Mykolaïv' et 'Dnipropetrovsk'. Nous devons décider de leur avenir.\nNous pouvons soit investir pour réparer les trois navires, soit nous concentrer sur les plus modernes et performants."
 ukraine_reorganize_navy_maintain_1135.1.a: "Entretenir les 3 navires"
 ukraine_reorganize_navy_maintain_1135.1.b: "N'entretenir que « Sébastopol » et « Mykolaïv »"
 ukraine_reorganize_navy_maintain_1135.1.c: "N'entretenir que le plus moderne, « Sébastopol »"
 ukraine_reorganize_navy_finish_11451.1.name: "Achever la construction de 2 corvettes 'Projet 11451'"
 ukraine_reorganize_navy_finish_11451.1.desc: "Nous avons examiné les coques des corvettes 'Lviv' et 'Louhansk'.\nNous pouvons investir pour achever la construction des deux navires ou démanteler le 'Louhansk' pour terminer le 'Lviv' plus rapidement."
 ukraine_reorganize_navy_finish_11451.1.a: "Terminez les deux navires"
 ukraine_reorganize_navy_finish_11451.1.b: "Cannibaliser le Louhansk pour achever le Lviv"
 ukraine_reorganize_navy_maintain_1241.1.name: "Entretenir 3 petites corvettes 'Projet 1241'"
 ukraine_reorganize_navy_maintain_1241.1.desc: "Nous avons examiné 3 coques de nos petites corvettes du « projet 1241 », la vedette lance-missiles U156 « Kremenchuk » et les petites corvettes ASM U207 « Oujhorod » et U208 « Khmelnytskyï ».\nNous pouvons désormais choisir la direction la plus adaptée pour décider de leur sort.\nNous pouvons soit investir davantage et réparer les 3 navires, soit nous concentrer sur celui qui a le plus de chances d'être réparé."
 ukraine_reorganize_navy_maintain_1241.1.a: "Entretenir les 3 navires"
 ukraine_reorganize_navy_maintain_1241.1.b: "Maintenir uniquement le U208 'Khmelnytskyi'"
 ukraine_reorganize_navy_maintain_1241.2.name: "Completion of repair of U156 'Kremenchuk' missile boat"
 ukraine_reorganize_navy_maintain_1241.2.desc: "We have completed the repair of U156 'Kremenchuk' missile boat and it is now ready for active service.\nNow we will continue with repairing of U207 'Uzhhorod' and U208 'Khmelnytskyi' small ASW corvettes."
 ukraine_reorganize_navy_maintain_1241.2.a: "Super, continuons"
 ukraine_reorganize_navy_maintain_1241.3.name: "Completion of repair of U207 'Uzhhorod' small ASW corvette"
 ukraine_reorganize_navy_maintain_1241.3.desc: "We have completed the repair of U207 'Uzhhorod' small ASW corvette and it is now ready for active service.\nWe will double down on finishing repair of U208 'Khmelnytskyi' small ASW corvette now."
 ukraine_reorganize_navy_maintain_1241.3.a: "Super, continuons"
 ukraine_reorganize_navy_maintain_1241.4.name: "Completion of repair of U208 'Khmelnytskyi' small ASW corvette"
 ukraine_reorganize_navy_maintain_1241.4.desc: "We have completed the repair of U208 'Khmelnytskyi' small ASW corvette and it is now ready for active service.\nAll 4 'Project 1241' small corvettes are in active service now."
 ukraine_reorganize_navy_maintain_1241.4.a: "Parfait, tous les navires sont prêts"
 ukraine_reorganize_navy_maintain_1241.5.name: "Achèvement de la réparation de la petite corvette ASM U208 Khmelnytskyï"
 ukraine_reorganize_navy_maintain_1241.5.desc: "Thanks to cannibalizing parts from 3 other 'Project-1241' small corvettes we have completed the repair of U208 'Khmelnytskyi' small ASW corvette sooner than expected. It is now ready for active service."
 ukraine_reorganize_navy_maintain_1241.5.a: "Good!"
 ukraine_reorganize_navy_maintain_641_submarine.1.name: "Sous-marin 'Zaporizhzhia' - recherche de batteries"
 ukraine_reorganize_navy_maintain_641_submarine.1.desc: "L'examen du 'Zaporizhzhia' révèle l'ampleur des travaux. Le problème majeur est l'absence de batteries : sans elles, le sous-marin est immobile.\nNous pouvons demander à la Russie de nous vendre des batteries en stock, chercher en Europe (notamment en Grèce) ou ordonner à notre industrie locale d'en développer un modèle national."
 ukraine_reorganize_navy_maintain_641_submarine.1.a: "Acheter à la Russie"
 ukraine_reorganize_navy_maintain_641_submarine.1.b: "Chercher en Europe"
 ukraine_reorganize_navy_maintain_641_submarine.1.c: "Développer au niveau national"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_RUS_flag: "Événement §Y'Sous-marin Zaporizhzhia - recherche de batteries'§! terminé avec l'option §RAcheter à la Russie§!"
 ukraine_reorganize_navy_maintain_641_submarine_batteries_from_GRE_flag: "Événement §Y'Sous-marin Zaporizhzhia - recherche de batteries'§! terminé avec l'option §BChercher en Europe§!"
 ukraine_reorganize_navy_maintain_641_submarine.2.name: "Sous-marin 'Zaporizhzhia' - achat de batteries"
 ukraine_reorganize_navy_maintain_641_submarine.2.desc: "Finally, we agreed on purchase conditions with our partner country, and after the prepayments were completed, the wait for delivery has begun.\nIt may seem unbelievable, but we received so desperately needed equipment within previously agreed terms.\nNow we can only say our thanks to our partner and continue with repair."
 ukraine_reorganize_navy_maintain_641_submarine.2.a: "Merci la Russie, poursuivre la réparation"
 ukraine_reorganize_navy_maintain_641_submarine.2.b: "Merci la Grèce, poursuivre la réparation"
 ukraine_reorganize_navy_maintain_641_submarine.3.name: "Sous-marin 'Zaporizhzhia' - développement local des batteries"
 ukraine_reorganize_navy_maintain_641_submarine.3.desc: "The task to locally develop the batteries for 'Zaporizhzhia' submarine was not an easy one.\nAt last, we have received what we wanted, but the actual costs were higher, than we expected.\nNevertheless we can continue with the repair of the submarine."
 ukraine_reorganize_navy_maintain_641_submarine.3.a: "Nous avons atteint cette étape, poursuivre la réparation"
 ukraine_reorganize_navy_maintain_641_submarine.4.name: "Sous-marin 'Zaporizhzhia' - fin des réparations"
 ukraine_reorganize_navy_maintain_641_submarine.4.desc: "We managed to install the new batteries, repair and maintain all non-functional equipment and at last we can start the actual sea trials.\n\nWe can make the basic program and save money and time or extensive one, which will require more resources, but we may find some additional issues and resolve them quickly."
 ukraine_reorganize_navy_maintain_641_submarine.4.a: "Commencer les essais en mer de base"
 ukraine_reorganize_navy_maintain_641_submarine.4.b: "Commencer des essais en mer prolongés"
 ukraine_reorganize_navy_maintain_641_submarine_extended_sea_trials_bonus: "Fiabilité accrue suite aux essais en mer étendus du 'Zaporizhzhia'"
 ukraine_reorganize_navy_maintain_641_submarine.5.name: "Sous-marin 'Zaporizhzhia' - mise en service"
 ukraine_reorganize_navy_maintain_641_submarine.5.desc: "Finally we have made all required purchases, replacements, installations, maintenance, repairs and sea trials in order for 'Zaporizhzhia' to be fully commissioned into Ukrainian Navy!"
 ukraine_reorganize_navy_maintain_641_submarine.5.a: "Enfin !"
 ukraine_reorganize_navy_finish_ukrayina.1.name: "Achever le croiseur 'Ukrayina' - Problèmes d'équipements manquants"
 ukraine_reorganize_navy_finish_ukrayina.1.desc: "Under direct control of our President, we have finally made a decision to finish the construction of 'Ukrayina' cruiser of soviet 'Project 1164 Class'.\nWe examined the hull and made a comprehensive list of missing equipment.\nNow we need to make another step and decide what should we do: ask Russia for permission to procure original equipment from them (mainly ASMs and SAMs systems) or contact Western countries and search for possibility to replace it with their counterparts.\nPlease, note, that you should have at least 40+ opinion from USA or 25+ opinion from France in order to ask for western equipment.\n\n\n§GThis is step 1 of §R3§!, §R4§! or §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.1.a: "Rester sur l'équipement russe d'origine"
 ukraine_reorganize_navy_finish_ukrayina.1.b: "Examiner un éventuel remplacement occidental"
 ukraine_reorganize_navy_finish_ukrayina.2.name: "Achever le croiseur 'Ukrayina' - Achat d'équipement russe"
 ukraine_reorganize_navy_finish_ukrayina.2.desc: "Ayant choisi de conserver la conception soviétique originale pour l'achèvement de l' 'Ukrayina', nous avons entamé des négociations avec la Russie pour l'acquisition des composants manquants.\nCela nous demandera beaucoup d'argent et de temps pour recevoir les éléments requis.\n\n\n§GIl s'agit de l'étape 2 sur 3§!"
 ukraine_reorganize_navy_finish_ukrayina.2.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.3.name: "Achever le croiseur 'Ukrayina' - Équipement russe reçu"
 ukraine_reorganize_navy_finish_ukrayina.3.desc: "Enfin, les composants nécessaires ont été fournis par la Russie. Nous pouvons commencer le processus d'installation et terminer la construction. Espérons que cela ne prendra pas une éternité.\n\n\n§GIl s'agit de l'étape finale§!"
 ukraine_reorganize_navy_finish_ukrayina.3.a: "Lancer la production"
 ukraine_reorganize_navy_finish_ukrayina.4.name: "Achever le croiseur 'Ukrayina' - Remplacer les missiles"
 ukraine_reorganize_navy_finish_ukrayina.4.desc: "Nous pouvons explorer toutes les variantes d'équipements occidentaux sur le marché pour remplacer les missiles antichars soviétiques P-500 'Granit' et les missiles surface-air S-300F 'Fort' manquants.\nNous devons choisir parmi plusieurs options possibles.\n\n\n§GIl s'agit de l'étape 2 sur §R4§! ou §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.4.a: "Choisissez les missiles américains"
 ukraine_reorganize_navy_finish_ukrayina.4.b: "Choisissez les missiles français"
 ukraine_reorganize_navy_finish_ukrayina.4.c: "Choisissez les missiles suédois"
 ukraine_reorganize_navy_finish_ukrayina.5.name: "Achever le croiseur 'Ukrayina' - Missiles américains"
 ukraine_reorganize_navy_finish_ukrayina.5.desc: "Ayant sélectionné les États-Unis comme fournisseur des nouveaux missiles pour le croiseur 'Ukrayina', nous avons entamé des négociations pour acquérir des missiles antinavires RGM-84D Harpoon Block 1C et des missiles surface-air RIM-66M-2 Block IIIA.\nCela nécessitera des investissements et du temps conséquents.\n\n\n§GIl s'agit de l'étape 3 sur §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.5.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.6.name: "Achever le croiseur 'Ukrayina' - Missiles français"
 ukraine_reorganize_navy_finish_ukrayina.6.desc: "Ayant sélectionné la France comme fournisseur des nouveaux missiles pour le croiseur 'Ukrayina', nous avons entamé des négociations pour acquérir des missiles antinavires Exocet MM40 Block 2 et des missiles surface-air Aster 30 Block 2.\nCela nécessitera des investissements et du temps conséquents.\n\n\n§GIl s'agit de l'étape 3 sur §R4§!§!"
 ukraine_reorganize_navy_finish_ukrayina.6.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.7.name: "Achever le croiseur 'Ukrayina' - Missiles antinavires suédois"
 ukraine_reorganize_navy_finish_ukrayina.7.desc: "Ayant sélectionné la Suède comme fournisseur des nouveaux missiles antinavires RBS 15 Mk. III pour le croiseur 'Ukrayina', nous avons entamé des négociations pour leur acquisition.\nCela nécessitera des investissements et du temps conséquents.\n\n\n§GIl s'agit de l'étape 3 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.7.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.8.name: "Achever le croiseur 'Ukrayina' - Remplacer les missiles surface-air"
 ukraine_reorganize_navy_finish_ukrayina.8.desc: "Après la sélection des missiles antinavires suédois ultra-modernes, nous devons encore choisir quel équipement remplacera les missiles surface-air soviétiques S-300F 'Fort'.\nDeux options s'offrent à nous.\n\n\n§GIl s'agit de l'étape 4 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.8.a: "Choisissez le bloc américain RIM-66M-2 IIIA"
 ukraine_reorganize_navy_finish_ukrayina.8.b: "Choisissez le French Aster 30 Bloc 2"
 ukraine_reorganize_navy_finish_ukrayina.9.name: "Achever le croiseur 'Ukrayina' - SAM RIM-66 américains"
 ukraine_reorganize_navy_finish_ukrayina.9.desc: "Ayant sélectionné les États-Unis comme fournisseur pour les nouveaux missiles surface-air du croiseur 'Ukrayina', nous avons entamé des négociations pour leur acquisition.\n\n\n§GIl s'agit de l'étape 5 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.9.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.10.name: "Achever le croiseur 'Ukrayina' - SAM Aster 30 français"
 ukraine_reorganize_navy_finish_ukrayina.10.desc: "Ayant sélectionné la France comme fournisseur pour les nouveaux missiles surface-air du croiseur 'Ukrayina', nous avons entamé des négociations pour leur acquisition.\n\n\n§GIl s'agit de l'étape 5 sur §R6§!§!"
 ukraine_reorganize_navy_finish_ukrayina.10.a: "Nous paierons et attendrons"
 ukraine_reorganize_navy_finish_ukrayina.11.name: "Achever le croiseur 'Ukrayina' - Tous les équipements reçus"
 ukraine_reorganize_navy_finish_ukrayina.11.desc: "Tous les composants requis ont été fournis par les producteurs conformément aux termes convenus. Nous pouvons enfin commencer l'installation et achever la construction.\n\n\n§GIl s'agit de l'étape finale§!"
 ukraine_reorganize_navy_finish_ukrayina.11.a: "Lancer la production"
 ukraine_reorganize_navy_repair_rivne.1.name: "Réparation du BDC « Rivne » — Choisir la voie"
 ukraine_reorganize_navy_repair_rivne.1.desc: "Due to current status of 'Rivne' LST, we have to make a decision on how to proceed with the repair and maintenance of this ship.\nWe can either invest more money and repair it fully to its original LST shape or just focus on the most critical systems to make it operational as a support transport ship."
 ukraine_reorganize_navy_repair_rivne.1.a: "Réparation en LST"
 ukraine_reorganize_navy_repair_rivne.1.b: "Réparation comme navire de soutien"
 ukraine_reorganize_navy_repair_rivne.2.name: "La réparation du Rivne en chaland de débarquement est terminée"
 ukraine_reorganize_navy_repair_rivne.2.desc: "Ayant choisi de réparer le « Rivne » comme navire de débarquement à part entière, nous avons achevé toutes les réparations et l'entretien requis et il est désormais prêt au service actif."
 ukraine_reorganize_navy_repair_rivne.2.a: "Super!"
 ukraine_reorganize_navy_repair_rivne.3.name: "La réparation du « Rivne » comme navire de soutien est achevée"
 ukraine_reorganize_navy_repair_rivne.3.desc: "Ayant choisi de réparer le « Rivne » comme navire de soutien, nous avons achevé toutes les réparations et l'entretien requis et il est désormais prêt au service actif."
 ukraine_reorganize_navy_repair_rivne.3.a: "Super!"
 ukraine_reorganize_navy_repair_support_ships.1.name: "Réparation des navires de soutien — Choisir la voie"
 ukraine_reorganize_navy_repair_support_ships.1.desc: "Due to current status of our support ships, we have to make a decision on how to proceed with the repair and maintenance of these ships.\nWe can either invest more money and repair all 3 of them or prioritize based on their importance and available funds."
 ukraine_reorganize_navy_repair_support_ships.1.a: "Nous en avons besoin de tous"
 ukraine_reorganize_navy_repair_support_ships.1.b: "1 de soutien et 1 de réparation"
 ukraine_reorganize_navy_repair_support_ships.1.c: "Nous ne pouvons en financer qu'1"
 ukraine_reorganize_navy_repair_support_ships.2.name: "Repair of support ships - All 3 ships will be repaired"
 ukraine_reorganize_navy_repair_support_ships.2.desc: "As we've made the decision to repair all 3 support ships, it's time to select the preferable way to proceed with it.\nWe can either provide all ships with dedicated dockyards, that are currently available at government's disposal, and repair them without investing much funds or we can invest more money and repair them faster by using additional private dockyards."
 ukraine_reorganize_navy_repair_support_ships.2.a: "N'utiliser que les chantiers gouvernementaux"
 ukraine_reorganize_navy_repair_support_ships.2.b: "Payer des chantiers privés"
 ukraine_reorganize_navy_repair_support_ships.3.name: "Réparation des navires de soutien — 1 de soutien et 1 de réparation seront réparés"
 ukraine_reorganize_navy_repair_support_ships.3.desc: "As we've made the decision to repair 1 support ship and 1 repair ship, it's time to select the preferable way to proceed with it.\nWe can either provide both ships with dedicated dockyards, that are currently available at government's disposal, and repair them without investing much funds or we can invest more money and repair them faster by using additional private dockyards."
 ukraine_reorganize_navy_repair_support_ships.3.a: "N'utiliser que les chantiers gouvernementaux"
 ukraine_reorganize_navy_repair_support_ships.3.b: "Payer des chantiers privés"
 ukraine_reorganize_navy_repair_support_ships.4.name: "Réparation des navires de soutien — Un seul navire sera réparé"
 ukraine_reorganize_navy_repair_support_ships.4.desc: "As we've made the decision to repair only 1 support ship, it's time to select the preferable way to proceed with it.\nWe can either provide the ship with dedicated dockyard, that is currently available at government's disposal, and repair it without investing much funds or we can invest more money and repair it faster by using additional private dockyard."
 ukraine_reorganize_navy_repair_support_ships.4.a: "N'utiliser que le chantier gouvernemental"
 ukraine_reorganize_navy_repair_support_ships.4.b: "Payer un chantier privé"
 ukraine_reorganize_navy_repair_support_ships.5.name: "Repair of support ships - All 3 ships are repaired"
 ukraine_reorganize_navy_repair_support_ships.5.desc: "As we've completed the repair of all 3 support ships, they are now ready for active service and can provide necessary support to our fleet."
 ukraine_reorganize_navy_repair_support_ships.5.a: "Super!"
 ukraine_reorganize_navy_repair_support_ships.6.name: "Réparation des navires de soutien — 1 de soutien et 1 de réparation sont réparés"
 ukraine_reorganize_navy_repair_support_ships.6.desc: "Ayant achevé la réparation d'1 navire de soutien et d'1 navire de réparation, ils sont désormais prêts au service actif et peuvent fournir le soutien nécessaire à notre flotte."
 ukraine_reorganize_navy_repair_support_ships.6.a: "Super!"
 ukraine_reorganize_navy_repair_support_ships.7.name: "Réparation des navires de soutien - un seul navire est réparé"
 ukraine_reorganize_navy_repair_support_ships.7.desc: "Ayant achevé la réparation d'un seul navire de soutien, il est désormais prêt au service actif et peut fournir le soutien nécessaire à notre flotte."
 ukraine_reorganize_navy_repair_support_ships.7.a: "Super!"
 UKR_modernize_sov_category: "Moderniser l'équipement d'héritage soviétique"
 UKR_modernize_sov_category_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_main\n\n\n\n\n\n\n\n\nWe can invest time and resources into researching, testing, and implementing modern upgrades for our Soviet-era equipment. By improving existing designs with modern technologies, we can extend their service life and enhance their combat capabilities. These programs allow us to make the most of the vast arsenal inherited from the Soviet Union while gradually adapting it to the demands of modern warfare."
 UKR_develop_domestic_category: "Développer des systèmes d’armes nationaux"
 UKR_develop_domestic_category_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_main\n\n\n\n\n\n\n\n\nWe can invest time and resources into researching and developing our own modern weapon systems. Drawing upon Ukraine's engineering expertise and industrial traditions, we can create equipment tailored to the needs of our armed forces. Building a domestic defense industry will strengthen our military capabilities and reduce our reliance on foreign suppliers."
 UKR_modernize_bmp1u: "Develop §YBMP-1U 'Shkval'§!"
 UKR_modernize_bmp1u_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1u_shkval_for_tooltip\n\n\n\n\n\n\n\n\n§WA limited Ukrainian upgrade of the BMP-1 was developed by the State Scientific and Technical Centre of Artillery and Small Arms in Kyiv.\nThe original turret was replaced with the new KBA-105 Shkval remote weapon station (RWS) which was developed for light armoured vehicles to increase their combat effectiveness.§!"
 UKR_modernize_bmp1m: "Develop §YBMP-1M§!"
 UKR_modernize_bmp1m_desc: "§WEvolved from the BMP-1U, unveiled in 2011.\nThe main difference is the application of the improved KBA-105TB Shkval-A RWS in which the Konkurs ATGM launchers were replaced with the long range Ukrainian Barrier ATGM and uses a new Tandem-2 sighting system and improved SWU-500-3C weapon stabilization system.§!"
 UKR_modernize_bmp1um: "Develop §YBMP-1UM§!"
 UKR_modernize_bmp1um_desc: "§WA more comprehensive upgrade of the standard BMP-1 undertaken by the Zhytomyr Armour Plant and shown publicly in 2015.\nThe 300 hp UTD-20 engine was replaced with a 3-cylinder, two-stroke 3TD-2 diesel motor making 400 hp and the troop compartment layout was improved by raising the hull roof by 15 cm, and the small, un-ergonomic egress doors at the rear of the BMP-1 were replaced by a large ramp, albeit manually operated.§!"
 UKR_modernize_bmp1umd: "Develop §YBMP-1UMD§!"
 UKR_modernize_bmp1umd_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1umd_for_tooltip\n\n\n\n\n\n\n\n\n§WA further development of the BMP-1UM from Zhytomyr Armour Plant, unveiled in 2016 at the Arms and Security exhibition.\nThis variant has a new RWS and engine; powered by an electronically controlled Deutz TCD2013 L64V 6-cylinder turbodiesel which produces 330 hp and is more reliable, quieter and efficient than both the UTD-20 and 3TD-2.§!"
 UKR_modernize_bmp1ts: "Develop §YBMP-1TS§!"
 UKR_modernize_bmp1ts_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bmp1ts_for_tooltip\n\n\n\n\n\n\n\n\n§WBMP-1TS is a Ukrainian upgrade variant developed by NVK Techimpex, who has been working on a RWS for the BMP-1 named Spys since 2018.\nThe Spys module received the Syntez fire-control system consisting of Kazhan-3K15 sighting complex with both thermal and optical TV cameras as well as a laser rangefinder.§!"
 UKR_modernize_bmp_m1s: "Develop §YBMP-M1S§!"
 UKR_modernize_bmp_m1s_desc: "§WBMP-M1S is an armored combat tracked vehicle that was developed using the own working capital of the Zhytomyr Armored Plant, part of the Ukroboronprom Group of Companies.\nThe new product was presented at the Arms and Security 2018 exhibition in Kyiv.\nThe BMP-M1S is a conversion with a significant increase in firepower, protection level and the replacement of an outdated Soviet engine with a German Deutz one.\nThanks to this, the BMP-M1S can transport up to 8 military personnel and effectively support the actions of infantry units thanks to the great firepower of the 'Stylet' combat module.§!"
 UKR_modernize_bmp1m_praktyka: "Develop §YBMP-1M 'Praktyka'§!"
 UKR_modernize_bmp1m_praktyka_desc: "§WThe Ukrainian manufacturer NVO Praktyka demonstrated the BMP-1M armored vehicle in 2021.\nThe updated BMP-1 is equipped with modern equipment instead of the usual two doors-tanks of the landing compartment.\nIt is also noticeable that the height of the body of the combat vehicle has been slightly increased.\nThe modernized BMP also differs from the Soviet model in the presence of the improved combat module 'Spys-Syntez', developed and manufactured by the company NVK Techimpex.§!"
 UKR_modernize_bmp1u_flag: " Completed decision §YDevelop BMP-1U§!"
 UKR_modernize_bmp1m_flag: " Completed decision §YDevelop BMP-1M§!"
 UKR_modernize_bmp1um_flag: " Completed decision §YDevelop BMP-1UM§!"
 UKR_modernize_bmp1umd_flag: " Completed decision §YDevelop BMP-1UMD§!"
 UKR_modernize_mt_lbr6: "Develop §YMT-LBR6§!"
 UKR_modernize_mt_lbr6_desc: "§WMT-LBR6 is a light IFV on the MT-LB chassis with the ZTM-1 combat module.\nArmament: 30-mm ZTM-1 automatic cannon, 7.62-mm CT machine gun, smoke grenade launchers of the 902B 'Tucha' system.\nThe protection of the crew is enhanced due to spaced armor and Kevlar lining, the undercarriage is covered with anti-cumulative screens.\nManufacturer, Kharkiv Tractor Plant.§!"
 UKR_modernize_mt_lbmsh: "Develop §YMT-LBMSh§!"
 UKR_modernize_mt_lbmsh_desc: "§WMT-LBMSh is a light IFV on the MT-LB chassis with the 'Shkval' combat module.\nArmament: ZTM-1 30-mm automatic cannon, KT-7,62 7.62-mm machine gun paired with it, two Barrier anti-tank guided missiles, 30-mm automatic grenade launcher, smoke grenade launchers.\nSince 2006, it has been produced at the KMDB.§!"
 UKR_modernize_mt_lbr7: "Develop §YMT-LBR7§!"
 UKR_modernize_mt_lbr7_desc: "§WMT-LBR7 is a light IFV on the MT-LB chassis with the 'Shturm' combat module.\nArmament: ZTM-1 30-mm automatic cannon, KT-7,62 7.62-mm machine gun paired with it, two 9M113M 'Konkurs-M' ATGM missile launchers, 30-mm automatic grenade launcher, smoke grenade launchers.\nThe protection of the crew is enhanced due to spaced armor and Kevlar lining, the undercarriage is covered with anti-cumulative screens.\nManufacturer, Kharkiv Tractor Plant.§!"
 UKR_modernize_mt_lb_at: "Develop §YMT-LB-AT§!"
 UKR_modernize_mt_lb_at_desc: "§WMT-LB-AT is a modification option for MT-LB, equipped with a rotating platform with armor protection, armed with a 12.7 mm DShKM machine gun.§!"
 UKR_modernize_mt_lb_t_23_2: "Develop §YMT-LB-T-23-2§!"
 UKR_modernize_mt_lb_t_23_2_desc: "§WMT-LB-T-23-2 is a MT-LB modernization option developed by NVK Techimpex.\nIt is equipped with an armored shield and a new sight and it uses the ZU-23-2 as its main armament.\nA demonstration sample was presented on September 21, 2015 at the exhibition 'Arms and Security.'§!"
 UKR_modernize_mt_lbr6_flag: " Completed decision §YDevelop MT-LBR6§!"
 UKR_modernize_mt_lbr7_flag: " Completed decision §YDevelop MT-LBR7§!"
 UKR_modernize_mt_lbrmsh_flag: " Completed decision §YDevelop MT-LBMSh§!"
 UKR_modernize_btr_70m: "Develop §YBTR-70M§!"
 UKR_modernize_btr_70m_desc: "§WBTR-70M is a Ukrainian modification of the BTR-70.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov within the framework of the state defense order for the equipment of the peacekeeping units of the armed forces of Ukraine.\nInstead of two gasoline engines, a multi-fuel diesel engine UTD-20 from BMP-1 is installed.\nArmament, 14.5-mm large-caliber machine gun KPVT and 7.62-mm twin machine gun PKT. Side hatches are BTR-80 type.§!"
 UKR_modernize_btr_70m_kba2: "Develop §YBTR-70M-KBA-2§!"
 UKR_modernize_btr_70m_kba2_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr70_kba2_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-70M-KBA-2 is a Ukrainian modification of the BTR-70.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nThe turret of the BTR-70 was dismantled, instead of it was installed a combat module with a 30-mm automatic cannon KBA-2 and a device for firing smoke grenades (as a result, the height of the machine increased to 2765 mm).\nSide hatches - BTR-80 type.§!"
 UKR_modernize_btr_70m_hrim: "Develop §YBTR-70M 'Hrim'§!"
 UKR_modernize_btr_70m_hrim_desc: "§WBTR-70M 'Hrim' is a Ukrainian modification of the BTR-70.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nInstead of the standard turret, the BM-1B 'Hrim' combat module (30-mm automatic cannon, 7.62-mm machine gun, 30-mm automatic grenade launcher AG-17 and Barrier anti-tank missile system with an ammunition supply of 4 ATGMs) is installed.\nSide hatches - BTR-80 type.§!"
 UKR_modernize_btr_7: "Develop §YBTR-7 'Zakhysnyk'§!"
 UKR_modernize_btr_7_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_btr7_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-7 'Zakhysnyk' is a Ukrainian modification of the BTR-70.\nThe modernization is carried out by the Mykolayiv Armored Plant.\nIt has 2 FPT Iveco Tector engines (from the Iveco EuroCargo truck) P4 (Euro III), 150 hp each.\nThe armored personnel carrier is equipped with a BUG combat unit, stabilized in two planes, the basic armament of which consists of: 14.5-mm KPVT machine gun (500 rounds); 7.62-mm PKT machine gun (1500 cartridges); 30-mm automatic grenade launcher AGS-17 (87 shots); two 130-mm Barrier ATGMs (4 ATGMs).§!"
 UKR_modernize_btr_70t: "Develop §YBTR-70T§!"
 UKR_modernize_btr_70t_desc: "§WBTR-70T is a Ukrainian modernization of the BTR-70 of the NVK Techimpex.\nNew side landing hatches, like the BTR-80, R-173 radio station, two new D245.30E2 diesel engines with a total power of 312 hp, front and rear BTR-80 marker lights, new wheels with tubeless tires were installed.\nIt is also possible to install other combat modules.§!"
 UKR_modernize_varan: "Develop §Y'Varan'§!"
 UKR_modernize_varan_desc: "§WVaran is a Ukrainian armored personnel carrier, a radical modernization of the BTR-70.\nDeveloped by NVK Techimpex.\nThe Varan received a newly designed armored hull, as well as a significant change in layout, the engine is located in the front part, and a landing gear appeared in the stern.\nAs a result of the change in layout, the landing compartment received 35% more useful internal volume, and it was also possible to embark and disembark soldiers through a folding apparatus in the aft part.\nArmed with the Spys combat module, which is equipped with a 30-mm type 2A72 gun (ZTM-1 or KBA-1) with 300 shells, a 30-mm automatic grenade launcher KBA-117 (AGS-17) with 125 grenades, 7.62-mm KT-7,62 machine gun and a complex of 'Baryer' guided weapons with two missiles.§!"
 UKR_modernize_btr_70m_flag: "Completed decision §YDevelop BTR-70M§!"
 UKR_modernize_btr_70m_kba2_flag: "Completed decision §YDevelop BTR-70M-KBA-2§!"
 UKR_modernize_btr_70m_hrim_flag: "Completed decision §YDevelop BTR-70M 'Hrim'§!"
 UKR_modernize_btr_70t_flag: "Completed decision §YDevelop BTR-70T§!"
 UKR_modernize_btr_80_kba2: "Develop §YBTR-80-KBA-2§!"
 UKR_modernize_btr_80_kba2_desc: "§WBTR-80-KBA-2 is a Ukrainian modification of the BTR-80.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nUkrainian-made UTD-20 diesel engine is installed.\nInstead of a 14.5 mm KPVT machine gun, a 30 mm KBA-2 gun was installed.\n25% increased mileage with the same amount of fuel due to a significant reduction in fuel consumption.\nIncreased cross-country ability of the car in difficult road conditions due to increased engine torque.\nInstallation of the KBA-2 cannon of 30 mm caliber allows to increase the range and effectiveness of firing.§!"
 UKR_modernize_btr_80m_hrim: "Develop §YBTR-80M 'Hrim'§!"
 UKR_modernize_btr_80m_hrim_desc: "§WBTR-80M 'Hrim' is a Ukrainian modification of the BTR-80.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nInstead of the standard turret, the BM-1B 'Hrim' combat module (30-mm automatic cannon, 7.62-mm machine gun, 30-mm automatic grenade launcher AG-17 and Barrier anti-tank missile system with an ammunition supply of 4 ATGMs) is installed.§!"
 UKR_modernize_btr_80up: "Develop §YBTR-80UP§!"
 UKR_modernize_btr_80up_desc: "§WBTR-80UP is a joint Polish-Ukrainian modernization program for the BTR-80 in order to take part in Iraq tender.\nEnhanced protection, installed new diesel engines with a capacity of 300 hp, new tires and new electric and pneumatic systems, removed water jet installation.\nIn addition to the linear armored personnel carrier, 7 specialized modifications have been developed§!"
 UKR_modernize_btr_80t: "Develop §YBTR-80T§!"
 UKR_modernize_btr_80t_desc: "§WBTR-80T is a Ukrainian modernization of the BTR-80 of the NVK Techimpex.\nThe stock engine was replaced with a more powerful turbocharged one with a capacity of 303 hp.\nThe gearbox is 8-speed. The range has been increased to 750 km.\nReplaced armament with a new combat module BM-23-2.§!"
 UKR_modernize_btr_80_kba2_flag: " Completed decision §YDevelop BTR-80-KBA-2§!"
 UKR_modernize_btr_80m_hrim_flag: " Completed decision §YDevelop BTR-80M 'Hrim'§!"
 UKR_modernize_t55_5tdf: "Develop §YT-55-5TDF§!"
 UKR_modernize_t55_5tdf_desc: "§WT-55-5TDF is a Ukrainian modernization of the T-55 tank.\nThe modernization was carried out by the Kharkiv Design Bureau named after O. O. Morozov.\nThe tank is equipped with a 5TDF diesel engine with a capacity of 700 hp, which allows it to reach a speed of 60 km/h on the highway and 40 km/h on rough terrain.\nThe tank is also equipped with a new fire control system, which includes a laser rangefinder, a ballistic computer and a thermal imaging sight.\nThe armor protection has been improved by installing additional armor plates and explosive reactive armor.§!"
 UKR_modernize_t55_5tdf_flag: " Completed decision §YDevelop T-55-5TDF§!"
 UKR_modernize_t55agm: "Develop §YT-55AGM§!"
 UKR_modernize_t55agm_desc: "§WT-55AGM is a Ukrainian modernization of the T-55 tank.\nThe tank is equipped with a 5TDF diesel engine with a capacity of 700 hp, which allows it to reach a speed of 60 km/h on the highway and 40 km/h on rough terrain.\nThe tank is also equipped with a new fire control system, which includes a laser rangefinder, a ballistic computer and a thermal imaging sight.\nThe armor protection has been improved by installing nizh explosive reactive armor.§!"
 UKR_modernize_t55agm_flag: "Completed decision §YDevelop T-55AGM§!"
 UKR_modernize_t55m8_a2_tifon_ii: "Develop §YT-55M8-A2 Tifon 2§!"
 UKR_modernize_t55m8_a2_tifon_ii_desc: "§WT-55M8-A2 Tifon 2 is a Ukrainian modernization of the T-55 tank for Peru.\nThe tank is equipped with a 5TDF diesel engine with a capacity of 700 hp, which allows it to reach a speed of 60 km/h on the highway and 40 km/h on rough terrain.\nThe tank is also equipped with a new fire control system, which includes a laser rangefinder, a ballistic computer and a thermal imaging sight.\nThe armor protection has been improved by installing nizh explosive reactive armor.§!"
 UKR_develop_t64bm_bulat: "Rechercher le T-64BM 'Bulat'"
 UKR_develop_t64bm_bulat_desc: "§WT-64BM 'Bulat' is a Ukrainian modernisation, bringing the T-64B to the standard of the T-84.\nFitted with Nizh reactive armour, 9K120 Refleks missile (NATO code AT-11 Sniper), 1A45 Irtysh fire control, TKN-4S commander's sight, PZU-7 antiaircraft machine-gun sight, TPN-4E Buran-E night vision, 6TDF 1,000-hp (735 kW) engine.\nT-64BM 'Bulat' is the most recent modernization from 2004.§!"
 UKR_develop_t64e: "Develop §YT-64E§!"
 UKR_develop_t64e_desc: "§WThe T-64E is a Ukrainian experimental main battle tank that was a deep modernization of the T-64.\nDeveloped at KhBTRZ (Kharkiv Armored Repair Plant).\nCompared to previous modifications of the T-64, the modernized tank has significantly improved combat power, mobility and protection.\nThe cost of the T-64E was about $1.12 million per unit as of 2011.§!"
 UKR_develop_t64bv_1: "Develop §YT-64BV-1§!"
 UKR_develop_t64bv_1_desc: "§WT-64BV-1 (also known in the media as T-64B1M/T-64BM1M) is a simplified version of the modernization of T-64B1 tanks created in 2014 and developed at the Kharkiv Armored Plant.\nThe tank has built-in 'Nizh' ERA protection, which strengthens the protection of the turret, the frontal part of the hull and the side.\nA niche for ammunition and equipment is installed in the rear part of the turret.\nA 5TDF engine is installed on the tank.\nIt is a simplified and cheaper option for modernization of the 'Bulat'.§!"
 UKR_develop_t64bv_2017: "Modernize §YT-64BV§! into §Yzr. 2017§!"
 UKR_develop_t64bv_2017_desc: "§WThe T-64BV zr. 2017 (or model 2017) is the ongoing T-64 tank series modernization, which aims at including new thermal imaging for all crew, remove Luna infrared searchlight, include TPN-1-TPV Ukrainian night sight in place of TPN1-49-23, 'Nizh' reactive armour modules designed for bolt-on replacement on T-64BV turrets, SN-4215 networked satellite navigation unit, and Lybid K-2RB digital radio (under license from Motorola) providing secure communications with a 70 km range.§!"
 UKR_develop_t64bv_2022: "Further modernize §YT-64BV§! into §Yzr. 2022§!"
 UKR_develop_t64bv_2022_desc: "§WThe T-64BV zr. 2022 (or model 2022) is the latest T-64 tank series modernization. The tank has new third-generation surveillance and sighting units and is equipped with a new 12.7mm Snipex Laska K-2 heavy machine gun.\nIt features new up-to-date radio stations and additional navigation, internal and external communication systems which fully meets NATO standards.\nThe exterior fuel tanks are now also protected by 12mm steel plates.§!"
 UKR_develop_t64_krab: "Develop §YT-64 'Krab'§!"
 UKR_develop_t64_krab_desc: "§WT-64 'Krab' is research and development work on the modernization of the T-64B (T-64BV) tank.\nDesign studies are performed by the Kharkiv Design Bureau of Mechanical Engineering named after Morozov.\nWork began in 2016.\nThe installation of a 6TD engine with a power output of 1,200 hp was foreseen on the T-64.\nIn order to install an engine larger in dimensions than the standard one, the body of the serial T-64 is sewn up.§!"
 UKR_develop_t_rex: "Develop §Y'T-Rex'§!"
 UKR_develop_t_rex_desc: "§W'T-Rex' is a Ukrainian main battle tank announced in 2016 and was developed by the Arey Engineering Group, an engineering group belonging to the Azov Battalion.\nThe tank would be based on the T-64 and would feature an unmanned turret.\nThe three crew members would be seated in an armored capsule at the front of the hull, where they could remotely-control the cannon, the automatic loader and the machine guns.\nT-Rex would weigh 39 tons and be equipped with a 125mm main gun with 'high-power projectiles'.\nThe armor would utilize both 'Nizh' and 'Duplet' explosive reactive armor.\nThe combat capability was said by the Ukrainian press to be exceeding those of the Ukrainian Oplot and Bulat, while at the same time being more cost-effective than the Bulat.§!"
 UKR_develop_t64bm2_bulat: "Further modernize §YT-64BM 'Bulat'§! into §YT-64BM2 'Bulat-M'§!"
 UKR_develop_t64bm2_bulat_desc: "§WT-64BM2 (in the media it is also called 'Bulat' or 'Kedr') is a modernization of the T-64 tank under the 'Kedr' program.\nIt is a technology demonstrator, that is, research and development work on the remotorization of T-64 type tanks with the 6TD-1 engine, a complete redesign of the engine and transmission compartment.§!"
 UKR_develop_t64bm_bulat_flag: "Completed decision §YDevelop T-64BM 'Bulat'§!"
 UKR_develop_t64e_flag: "Completed decision §YDevelop T-64E§!"
 UKR_develop_t64bv_1_flag: "Completed decision §YDevelop T-64BV-1§!"
 UKR_develop_t64bv_2017_flag: "Completed decision §YModernize T-64BV into zr. 2017§!"
 UKR_develop_t64_krab_flag: "Completed decision §YDevelop T-64 'Krab'§!"
 UKR_develop_t_rex_flag: "Completed decision §YDevelop 'T-Rex'§!"
 UKR_develop_t64bm2_bulat_flag: "Completed decision §YDevelop T-64BM2 'Bulat'§!"
 UKR_develop_t64_strazh: "Develop §YT-64 'Strazh'§!"
 UKR_develop_t72amt: "Develop §YT-72AMT§!"
 UKR_develop_btr3u: "Develop §YBTR-3U 'Guardian'§! for\n§Y[UAE.GetNameWithFlag]§! tender"
 UKR_develop_btr3u_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3u_for_tooltip\n\n\n\n\n\n\n\n\n§W§YBTR-3U 'Guardian'§! is a deep modification of the §YBTR-94K§!, aimed at ongoing §YUnited Arab Emirates§! tender for new APC for their Marine Corps. It is equipped with a Deutz BF6M1015 engine with a power of 326 hp and an Allison MD3066 automatic transmission, or a 300 hp UTD-20 engine.\nKharkiv Design Bureau named after O. O. Morozov carried out the development of this vehicle. design documentation: the development of the chassis and the integration of all systems and weapons of the machine.\nThe armament includes a combat module KBA-105 'Shkval' with a 30-mm automatic cannon ZTM-1, paired with it a 7.62-mm machine gun KT-7,62, two ATGM launchers 9M113M 'Konkurs-M' and 30-mm automatic grenade launcher.\n§W--------------§!\nIn order to §Gincrease§! our chances to win the tender in UAE, their §Yopinion on us§! should not be lower than §G40§!, in other case the probability to lose is quite high, to be fair.\n§W--------------§!\nThis Decision is §Rrequired§! for the further Decisions on development of this vehicle successors.\nIf you §Rskip§! this Decision - you will §Rnot§! have the possibility to develop newer versions of this vehicle.§!"
 UKR_develop_btr3e: "Develop §YBTR-3E§!"
 UKR_develop_btr3e_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3e_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E is a modification with a UTD-20 or Deutz BF6M1015 engine.\nEquipped with combat module BM-3M 'Sturm-M', the armament of which includes a 30-mm automatic cannon ZTM-1, a 7.62-mm machine gun KT-7.62 paired with it, two launchers (6 rockets) 'Baryer' and a 30-mm automatic grenade launcher KBA-117.§!"
 UKR_develop_btr3e1: "Develop §YBTR-3E1§!"
 UKR_develop_btr3e1_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3e1_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E1 is a modification of BTR-3E, specifically made to satisfy requirements for Thai contract in 2005-2006.\nThe main features of this version in comparison with the BTR-3E are: installation of the modernized BM-3M 'Shturm' combat module, decrease in height from 2928 mm to 2774 mm, increase in the combat crew from 9 up to 13 people, installation of a VRC-950 radio station, placement of additional ammunition for the combat module.§!"
 UKR_develop_btr3da: "Develop §YBTR-3DA§!"
 UKR_develop_btr3da_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3da_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3DA is a further development of the armored personnel carrier, taking into account the experience of the war in the east of Ukraine.\nThe BTR-3DA armored personnel carrier is faster and more maneuverable than its predecessors, it has improved armor protection for the crew, it has an optical-electronic module with television and thermal imaging channels.\nThanks to this, it became possible to fire at night.\nAn additional power unit allows you to control the combat module without using the main power plant.§!"
 UKR_develop_btr3u_flag: "Completed decision §YDevelop BTR-3U 'Guardian'§!"
 UKR_develop_btr3e_flag: "Completed decision §YDevelop BTR-3E§!"
 UKR_develop_btr3e1_flag: "Completed decision §YDevelop BTR-3E1§!"
 UKR_develop_btr3da_flag: "Completed decision §YDevelop BTR-3DA§!"
 UKR_develop_btr3e1_cse90lp: "Develop §YBTR-3E1 CSE90LP§!"
 UKR_develop_btr3e1_cse90lp_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3_cse90lp_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E1 CSE90LP is a modification of the BTR-3E1, which is equipped with a Cockerill CSE 90LP turret with a 90-mm low-pressure gun.\nThe turret is equipped with a coaxial 7.62-mm machine gun and a 40-mm automatic grenade launcher.\nThe turret is equipped with an automatic fire control system, which includes a laser rangefinder, a thermal imager and a ballistic computer.§!"
 UKR_develop_btr3e1_cpws30: "Develop §YBTR-3E CPWS-30§!"
 UKR_develop_btr3e1_cpws30_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3_cpws30_for_tooltip\n\n\n\n\n\n\n\n\n§WBTR-3E CPWS-30 is a modification of the BTR-3E, which is equipped with a CPWS-30 turret with a 30-mm automatic cannon.\nThe turret is equipped with a coaxial 7.62-mm machine gun and a 40-mm automatic grenade launcher.\nThe turret is equipped with an automatic fire control system, which includes a laser rangefinder, a thermal imager and a ballistic computer.§!"
 UKR_develop_btr4_choose_role: "Choisir le rôle du §YBTR-4§!"
 UKR_develop_btr4_choose_role_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_roles_for_tooltip\n\n\n\n\n\n\n\n\n§W§YBTR-4§! was meant to be step-up compared to previous Soviet designs, and it was designed to incorporate heavier weapons from the get-go.\nWe can choose the desired role for this equipment - lighter and cheaper APC or more expensive and heavily armed IFV.\nOur decision will influence what Battalions will be equipped with BTR-4: Mechanized or Armored.\nWe will have an option to produce basically the same equipment type but in opposite role if we want to.§!"
