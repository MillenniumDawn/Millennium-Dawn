 module_flight_deck_1: "Porte-Avions à Pont Léger (10)"
 module_flight_deck_1_desc: "Ce module détermine la taille du navire. Les porte-avions plus grands pourront supporter plus d'avions et auront une plus grande intégrité structurelle, mais seront plus faciles à repérer et à toucher. Ils nécessitent plus de carburant, de main-d'œuvre et coûteront plus cher."
 module_flight_deck_2: "Porte-Avions à Pont Léger II (20)"
 module_flight_deck_2_desc: "Ce module détermine la taille du navire. Les porte-avions plus grands pourront supporter plus d'avions et auront une plus grande intégrité structurelle, mais seront plus faciles à repérer et à toucher. Ils nécessitent plus de carburant, de main-d'œuvre et coûteront plus cher."
