 module_naval_adl_4: "점방어 레이저 IV"
 module_naval_adl_4_desc: "점방어 레이저는 드론과 날아오는 미사일에 신속하고 정밀하게 대응하며, 빛의 속도로 표적을 공격하고 기존 요격체와 같은 재장전 제약이 없습니다.\n\n§G설계 힌트: 점방어 레이저는 근접 방호를 위한 강력한 대공과 장갑을 제공합니다. 첨단 항공 및 미사일 위협에 유용하지만 기존 점방어 체계보다 IC 비용이 높고 연료를 더 소모합니다.§!"
 module_naval_railgun_battery_1: "레일건 포대 I"
 module_naval_railgun_battery_1_desc: "레일건 포대는 전자기 가속으로 고속 발사체를 발사하여 수상함에 대한 탁월한 철갑 성능을 발휘하는 동시에 강력한 장거리 지상 포격 지원을 제공합니다.\n\n§G설계 힌트: 레일건 포대는 포 공격력, 대함 미사일, 높은 포 관통력을 결합하여 수상 전투와 해안 포격에 사용됩니다. 주력 전투함에서 강력하지만 상당한 IC, 인력, 전략 자원을 요구합니다.§!"
 module_naval_railgun_battery_2: "레일건 포대 II"
 module_naval_railgun_battery_2_desc: "$module_naval_railgun_battery_1_desc$"
 module_naval_railgun_battery_3: "레일건 포대 III"
 module_naval_railgun_battery_3_desc: "$module_naval_railgun_battery_1_desc$"
 module_naval_railgun_battery_4: "레일건 포대 IV"
 module_naval_railgun_battery_4_desc: "$module_naval_railgun_battery_1_desc$"
 module_naval_anti_ship_drone_torpedoes_1: "네트워크 어뢰 I"
 module_naval_anti_ship_drone_torpedoes_1_desc: "네트워크 어뢰 드론은 최소한의 인원 투입으로 원거리 공격을 가능하게 하여, 함대가 승조원을 위험에 노출하지 않고도 살상력을 투사할 수 있게 합니다. 스마트 신관과 조준점 선택으로 접촉 시 치명적 피해를 입힐 확률(치명타)이 크게 높아집니다. 필요한 첨단 소재, 전자장비, 추진 체계로 인해 전체 자원 비용이 증가합니다.\n\n§G설계 힌트: 드론 어뢰는 어뢰 공격력과 대잠수함전 능력을 제공하는 동시에 어뢰 명중률을 높이고 인력 요구량을 대폭 줄입니다. 정확하고 승조원이 적은 타격 설계에 적합하지만 점점 더 많은 마이크로칩이 필요합니다.§!"
 module_naval_anti_ship_drone_torpedoes_2: "네트워크 어뢰 II"
 module_naval_anti_ship_drone_torpedoes_2_desc: "$module_naval_anti_ship_drone_torpedoes_1_desc$"
 module_naval_anti_ship_drone_torpedoes_3: "네트워크 어뢰 III"
 module_naval_anti_ship_drone_torpedoes_3_desc: "$module_naval_anti_ship_drone_torpedoes_1_desc$"
 module_naval_anti_ship_drone_torpedoes_4: "네트워크 어뢰 IV"
 module_naval_anti_ship_drone_torpedoes_4_desc: "$module_naval_anti_ship_drone_torpedoes_1_desc$"
 module_naval_anti_torpedo_1: "대어뢰 방어 체계 I"
 module_naval_anti_torpedo_1_desc: "대어뢰 방어 체계는 신속한 수중 탐지와 자동화된 대응책을 결합하여 현대식 어뢰가 가하는 위협을 줄입니다.\n\n§G설계 힌트: 대어뢰 방어는 적 어뢰의 치명타 확률을 낮추어 가장 파괴적인 어뢰 공격을 제한합니다. 어뢰 위주의 함대를 상대할 때 유용하지만 미사일 슬롯을 차지하며 생산, 연료, 인력 비용이 증가합니다.§!"
 module_naval_anti_torpedo_2: "대어뢰 방어 체계 II"
 module_naval_anti_torpedo_2_desc: "$module_naval_anti_torpedo_1_desc$"
 module_naval_anti_torpedo_3: "대어뢰 방어 체계 III"
 module_naval_anti_torpedo_3_desc: "$module_naval_anti_torpedo_1_desc$"
 module_naval_anti_torpedo_4: "대어뢰 방어 체계 IV"
 module_naval_anti_torpedo_4_desc: "$module_naval_anti_torpedo_1_desc$"
 module_anti_ship_drone_torpedoes_1: "대함 드론 어뢰 I"
 module_anti_ship_drone_torpedoes_1_desc: "대함 드론 어뢰는 자율 유도와 네트워크 조준을 결합하여 적 수상함에 대한 명중 확률을 높입니다.\n\n§G설계 힌트: 드론 어뢰는 어뢰 공격력과 대잠수함전 능력을 제공하는 동시에 어뢰 명중률을 높이고 인력 요구량을 대폭 줄입니다. 정확하고 승조원이 적은 타격 설계에 적합하지만 점점 더 많은 마이크로칩이 필요합니다.§!"
 module_anti_ship_drone_torpedoes_2: "대함 드론 어뢰 II"
 module_anti_ship_drone_torpedoes_2_desc: "$module_anti_ship_drone_torpedoes_1_desc$"
 module_anti_ship_drone_torpedoes_3: "대함 드론 어뢰 III"
