l_braz_por:
 hong_kong_focus: "Árvore de Foco de Hong Kong"
 HKG_divided_hong_kong: "Uma Hong Kong Dividida"
 HKG_divided_hong_kong_desc: "Os últimos anos do domínio britânico em Hong Kong deixaram um legado de democracia pluralista. Também produziram, porém, disputas intermináveis entre os campos pró-establishment, pró-democracia e localista, reduzindo a eficiência administrativa a cada passo. As pessoas começam a se perguntar se essa caótica \"democracia\" é mesmo tão boa quanto dizem."
 HKG_support_pro_beijing_camp: "Apoiar o Campo Pró-Pequim"
 HKG_support_pro_beijing_camp_desc: "\"A liberdade não é sem importância. Mas, em nossa cultura social, a liberdade não é tão importante quanto a estabilidade.\" Agora é hora de o mundo testemunhar uma Hong Kong mais estável e segura."
 HKG_railway_development_strategy_2000: "Estratégia de Desenvolvimento Ferroviário 2000"
 HKG_railway_development_strategy_2000_desc: "O crescimento populacional e o aumento do comércio transfronteiriço estão levando a malha viária de Hong Kong ao congestionamento total. A Estratégia de Desenvolvimento Ferroviário 2000 orientará a expansão do MTR na próxima década, tirando passageiros e cargas das estradas e levando-os para os trilhos."
 HKG_sign_CEPA: "Assinar o CEPA"
 HKG_sign_CEPA_desc: "O Acordo de Parceria Econômica Mais Estreita formaliza o acesso comercial preferencial entre Hong Kong e o continente. Uma bênção para o comércio transfronteiriço e um passo a mais rumo à interdependência econômica."
 HKG_approve_funding_for_XRL: "Aprovar o Financiamento do XRL"
 HKG_approve_funding_for_XRL_desc: "O Express Rail Link conectará Hong Kong diretamente à rede ferroviária de alta velocidade do continente. O financiamento é grande, e o simbolismo político é ainda maior."
 HKG_co_location_bill: "O Projeto de Lei de Co-Localização"
 HKG_co_location_bill_desc: "Um projeto de lei controverso que coloca a jurisdição policial da China continental no terminal do XRL em West Kowloon. O campo pró-Pequim o chama de pragmático; os pan-democratas o chamam de violação constitucional."
 HKG_electoral_reform: "Reforma Eleitoral"
 HKG_electoral_reform_desc: "A Lei Básica estabeleceu como o Chefe do Executivo seria escolhido nos dois primeiros mandatos e o LegCo nos três primeiros, mas nada diz sobre as eleições depois disso. Esta é a nossa oportunidade de pressionar por uma reforma do sistema eleitoral e avançar rumo a um verdadeiro sufrágio universal."
 HKG_a_broader_electorate: "Um Eleitorado Mais Amplo?"
 HKG_a_broader_electorate_desc: "O sufrágio universal em Hong Kong não pode ser implementado da noite para o dia. Como medida intermediária, podemos solicitar ao NPCSC que amplie a composição do Comitê Eleitoral, tornando as eleições mais democráticas sem passar diretamente ao sufrágio pleno."
 HKG_choose_your_own_puppet: "\"Escolha o Seu Próprio Fantoche\""
 HKG_choose_your_own_puppet_desc: "O sufrágio universal em Hong Kong deve ser alcançado, mas não ao custo da estabilidade. O comitê de nomeação garantirá que apenas aqueles que sejam verdadeiramente \"patriotas em relação à China e a Hong Kong\" possam se candidatar a Chefe do Executivo."
 HKG_a_new_reform_attempt: "Uma Nova Tentativa de Reforma"
 HKG_a_new_reform_attempt_desc: "O LegCo é chamado mais uma vez a considerar a reforma eleitoral. Será que desta vez ela passa, ou a história vai se repetir?"
 HKG_support_pan_democrats: "Apoiar os Pan-Democratas"
 HKG_support_pan_democrats_desc: "A democracia e a liberdade já estão entrelaçadas ao tecido da vida em Hong Kong, e Deng Xiaoping prometeu não interferir em seus assuntos internos. Devemos participar ativamente do movimento democrático e defender as liberdades que sustentam a prosperidade de Hong Kong."
 HKG_keep_to_one_country_two_systems: "Manter Um País, Dois Sistemas"
 HKG_keep_to_one_country_two_systems_desc: "\"Um país, dois sistemas\" funciona sem problemas. O continente usa Hong Kong como pedra angular de sua política de abertura, enquanto Hong Kong confia na garantia de \"cinquenta anos sem mudanças\" para preservar um modo de vida que a distingue do resto da China. O arranjo atende a ambos os lados, e é claramente do nosso interesse mútuo mantê-lo intacto."
 HKG_hong_kong_post_2047_status: "O Status de Hong Kong Pós-2047"
 HKG_hong_kong_post_2047_status_desc: "Deng Xiaoping prometeu que o sistema político e econômico de Hong Kong permaneceria inalterado por cinquenta anos, mas ninguém sabe dizer como será a cidade depois de 2047. Chegou a hora de considerar o seu futuro."
 HKG_stick_to_CPC_line: "Seguir a Linha do PCC"
 HKG_stick_to_CPC_line_desc: "Hong Kong aderirá discretamente à linha preferida de Pequim nas questões controversas. Os pan-democratas ficarão furiosos, o campo patriótico, encantado."
 HKG_loyal_puppet: "\"O Fantoche Leal\""
 HKG_loyal_puppet_desc: "Os pan-democratas mostraram suas cartas, e as ruas mostraram sua fúria. A estabilidade e a prosperidade exigem que Hong Kong se comprometa, abertamente e sem pedir desculpas, com o caminho traçado por Pequim. A transição para uma Região Administrativa Especial totalmente integrada não será popular, mas será definitiva."
 HKG_promote_patriotism: "Promover o Patriotismo"
 HKG_promote_patriotism_desc: "Não se pode contar com uma geração criada com livros didáticos coloniais e o sentimentalismo do Cantopop para defender a pátria. A Educação em Segurança Nacional será incorporada a cada sala de aula, cada local de trabalho, cada emissora. Lealdade ao Partido é lealdade a Hong Kong."
 HKG_patriots_governing: "Patriotas Governando Hong Kong"
 HKG_patriots_governing_desc: "O serviço público respondeu por tempo demais a hábitos coloniais e simpatias silenciosas. Comitês de verificação vasculharão a burocracia, de funcionários distritais a altos administradores, substituindo os hesitantes por patriotas comprovados. A produtividade sofrerá no curto prazo; a confiabilidade, não."
 HKG_suppress_cantonese_local_culture: "Suprimir a Cultura Local Cantonesa"
 HKG_suppress_cantonese_local_culture_desc: "Hong Kong é chinesa, e chinês significa mandarim. As transmissões em cantonês serão restringidas, os festivais de identidade local terão o financiamento discretamente cortado e as vozes dissidentes do setor cultural serão silenciadas. O preço será a agitação nas ruas e o ressentimento dentro de casa, mas uma cultura nacional unificada vale o custo."
 HKG_reduce_size_of_LegCo: "Reduzir o Tamanho do LegCo"
 HKG_reduce_size_of_LegCo_desc: "O Conselho Legislativo ficou inchado com cadeiras distritais que servem apenas como palanques para o teatro da oposição. Uma câmara enxuta, com menos cadeiras eleitas diretamente e mais circunscrições funcionais, permitirá que o governo governe. O Programa de Talentos do Continente preencherá as lacunas com administradores formados em Pequim e Shenzhen."
 HKG_gong_zyu_ou_integration: "Integração Hong Kong-Zhuhai-Macau"
 HKG_gong_zyu_ou_integration_desc: "\"Um país, dois sistemas\" sempre foi um arranjo transitório. Com patriotas governando a RAE, a fronteira entre Hong Kong, Zhuhai e Macau torna-se administrativa em vez de significativa. Infraestrutura transfronteiriça, regulamentação harmonizada e reservas de talentos compartilhadas completam a Grande Área da Baía como um único corpo econômico, pronto para a reintegração plena à Pátria-Mãe."
 HKG_gong_zyu_ou_integration_tt: "Se Hong Kong for atualmente um subordinado de §Y[CHI.GetFlag]§!, a RAE será anexada e absorvida pela Grande Área da Baía. Caso contrário, isso conclui o alinhamento político legalista sem uma transferência imediata de soberania."
 HKG_support_democracy_in_china: "Apoiar a Democracia na China"
 HKG_support_democracy_in_china_desc: "O movimento pró-democracia de Hong Kong apoiará abertamente os esforços de reforma no continente. Um desafio direto à autoridade de Pequim."
 HKG_commemorate_june_fourth: "Lembrar o Quatro de Junho"
 HKG_commemorate_june_fourth_desc: "A vigília no Victoria Park é realizada todos os anos desde 1990, e todos os anos Pequim a observa com discreto desagrado. Este ano, tornamos isso oficial: uma homenagem pública sancionada pelo governo da RAE, com as velas, as canções e os nomes dos mortos. O continente não esquecerá. Nós também não."
 HKG_inspire_chinese_grassroots_movements: "Inspirar Movimentos de Base Chineses"
 HKG_inspire_chinese_grassroots_movements_desc: "Hong Kong não pode salvar o continente sozinha, mas pode mostrar como é a democracia chinesa na prática. Transmissões abertas para o Delta do Rio das Pérolas, panfletos contrabandeados pelos postos de fronteira e apoio financeiro discreto a redes de samizdat: as sementes da mudança plantadas na cidade chinesa mais livre."
 HKG_call_on_CPC_to_release_dissidents: "Exigir que o PCC Liberte os Dissidentes"
 HKG_call_on_CPC_to_release_dissidents_desc: "Os nomes são bem conhecidos: Liu Xiaobo, Wang Bingzhang, Xu Wenli e dezenas de outros. O governo da RAE exige formal e publicamente a libertação deles. Pequim vai recusar, é claro, mas a exigência coloca as prisões do regime na agenda internacional."
 HKG_pro_democracy_media_charter: "Carta de Mídia Pró-Democracia"
 HKG_pro_democracy_media_charter_desc: "A liberdade de imprensa não é um slogan, mas um regime jurídico. A Carta codifica proteções para os jornalistas, criminaliza a interferência política em decisões editoriais e estabelece uma emissora pública genuinamente independente do Executivo. A ideia Imprensa Silenciada é revertida."
 HKG_fund_civil_society: "Financiar a Sociedade Civil"
 HKG_fund_civil_society_desc: "Subsídios públicos para ONGs, associações de bairro, clínicas de assistência jurídica e defesa pró-democracia. O tesouro sofre um golpe; o corpo político sai fortalecido. Uma democracia sem sociedade civil é um fórum sem plateia."
 HKG_legco_reform_petition: "Petição de Reforma do LegCo"
 HKG_legco_reform_petition_desc: "Uma petição formal a Pequim por um sufrágio universal genuíno nas eleições do Conselho Legislativo. Eleição direta de todas as cadeiras, abolição das circunscrições funcionais, nenhum comitê de nomeação. A ideia Falta de Sufrágio Universal é substituída por Sufrágio Universal Limitado como primeira concessão."
 HKG_accountability_for_tiananmen: "Responsabilização por Tiananmen"
 HKG_accountability_for_tiananmen_desc: "Nomeamos os homens que deram as ordens. Nomeamos as unidades que as executaram. Abrimos os arquivos da própria RAE, apoiamos tribunais internacionais e amplificamos o testemunho dos sobreviventes. Pequim tratará isso como uma declaração de guerra ao Partido. Os democratas de Hong Kong ouvirão uma mensagem diferente."
 HKG_peaceful_democratic_path: "Caminho Democrático Pacífico"
 HKG_peaceful_democratic_path_desc: "Reforma por dentro, não confronto por fora. Hong Kong consolida suas instituições democráticas, estabiliza a sociedade civil e espera que o continente mude no seu próprio ritmo. As velas ainda queimam no Victoria Park, mas as ruas permanecem calmas. A próxima fase da reforma começa de uma posição de força."
 HKG_appease_localists: "Apaziguar os Localistas"
 HKG_appease_localists_desc: "Concessões ao movimento localista: preservação da língua cantonesa, políticas de contratação que priorizam os locais e desaceleração dos projetos de integração transfronteiriça."
 HKG_stoke_anti_mainland_sentiment: "Atiçar o Sentimento Anticontinental"
 HKG_stoke_anti_mainland_sentiment_desc: "A China levou todos os benefícios e deixou o povo de Hong Kong com imóveis caros e baixo poder de compra. Por que Hong Kong deveria permanecer com a China e aceitar ser uma pequena colônia chinesa?"
 HKG_restrict_tourism_immigration: "Restringir Turismo e Imigração"
 HKG_restrict_tourism_immigration_desc: "Novos limites para turistas do continente e regras mais rígidas de imigração transfronteiriça. Os moradores apreciarão o alívio; lojistas e incorporadores, nem tanto."
 HKG_emphasize_hong_kong_identity: "Enfatizar a Identidade de Hong Kong"
 HKG_emphasize_hong_kong_identity_desc: "A bem-sucedida separação de Singapura da Malásia deveu-se às bem-sucedidas reformas de consciência de identidade nacional do Sr. Lee Kuan Yew. Hong Kong é perfeitamente capaz de adotar a mesma abordagem."
 HKG_distance_from_china: "Distanciar-se da China"
 HKG_distance_from_china_desc: "Hong Kong, é hora de levantar âncora e se libertar do controle da China."
 HKG_great_hong_kong_nation: "A Grande Nação de Hong Kong"
 HKG_great_hong_kong_nation_desc: "A transferência de soberania foi uma traição. As promessas de cinquenta anos são uma mentira. Hong Kong é uma nação, não uma província, e uma nação exige sua própria bandeira, suas próprias fronteiras, suas próprias forças armadas. Declararemos o que nunca deveria ter sido negociado."
 HKG_hong_kong_first: "Hong Kong em Primeiro Lugar"
 HKG_hong_kong_first_desc: "Dos portos de Aberdeen aos arranha-céus de Mong Kok, Hong Kong pertence aos hongkongueses. O investimento do continente, a mão de obra do continente e a influência do continente estarão sujeitos à vontade da população local. Cidadania é herança, não uma conveniência transferível."
 HKG_hong_kong_state_constitution: "Nova Constituição do Estado de Hong Kong"
 HKG_hong_kong_state_constitution_desc: "A Lei Básica foi redigida em Pequim, assinada em Londres e imposta a um povo que não teve voto em nenhuma das duas capitais. Uma nova constituição redigida em Central, por hongkongueses, para hongkongueses, a substitui. A transição é definitiva."
 HKG_armed_forces_of_hong_kong: "Forças Armadas de Hong Kong"
 HKG_armed_forces_of_hong_kong_desc: "Uma nação que não pode se defender não é nação alguma. A Força de Defesa de Hong Kong, formada por voluntários e conscritos, terá infantaria capaz de manter os Novos Territórios e uma guarda costeira capaz de enfrentar qualquer incursão. As restrições militares da Lei Básica são letra morta."
 HKG_irredentist_claim_pearl_river: "Reivindicar o Delta do Rio das Pérolas"
 HKG_irredentist_claim_pearl_river_desc: "O Delta do Rio das Pérolas - Shenzhen, Guangzhou, Zhuhai - era cantonês antes de ser comunista, e o povo de lá tem mais em comum conosco do que com Pequim. Afirmamos nossa reivindicação abertamente. Seja por negociação ou pela força, o Delta voltará a se unir ao seu coração cultural."
 HKG_little_bird_under_british_wing: "Passarinho sob a Asa Britânica"
 HKG_little_bird_under_british_wing_desc: "O fato de Hong Kong ter se separado da China não significa que ela possa sobreviver sozinha no mundo. Precisamos da ajuda dos outros. Que tal nossos antigos senhores britânicos?"
 HKG_request_rerule_british_government: "Pedido de Retorno ao Governo Britânico"
 HKG_request_rerule_british_government_desc: "Houve um tempo em que as negociações sino-britânicas jamais respeitaram o desejo do povo de Hong Kong de permanecer no Império Britânico. Desta vez, seguiremos nossos próprios corações."
 HKG_aukus_intelligence_share: "Compartilhamento de Inteligência do AUKUS"
 HKG_aukus_intelligence_share_desc: "Os serviços de inteligência britânicos, americanos e australianos mantêm há muito um interesse discreto em Hong Kong. A transferência formal de tecnologia e a cooperação em sinais, sob o guarda-chuva do AUKUS, colocam a RAE firmemente dentro da arquitetura de segurança anglófona."
 HKG_uk_garrison_rights: "Direitos de Guarnição Britânica"
 HKG_uk_garrison_rights_desc: "Um destacamento simbólico dos Royal Marines em Stonecutters, escalas da Marinha Real no Porto de Victoria e um acordo de bases que permite à Grã-Bretanha alcançar o Mar da China Meridional a partir de uma costa amiga. A guarnição é pequena. O recado, não."
 HKG_commonwealth_realm_ambition: "Ambição de Reino da Commonwealth"
 HKG_commonwealth_realm_ambition_desc: "Canadá, Austrália, Nova Zelândia - todos já foram colônias, todos agora são reinos, todos ainda sob a Coroa. Hong Kong pede aos Chefes de Governo da Commonwealth que a recebam de volta, não como uma possessão, mas como um reino soberano que compartilha um monarca. O insulto histórico da transferência de soberania encontra sua longa resposta."
 HKG_city_state_idea: "A Ideia da Cidade-Estado"
 HKG_city_state_idea_desc: "Singapura provou que é possível. Uma cidade de maioria chinesa, cercada por potências maiores, pode sobreviver e prosperar como um centro comercial soberano se escolher a neutralidade e a competência em vez da ideologia. Hong Kong seguirá esse modelo, só que melhor."
 HKG_revise_basic_law: "Revisar a Lei Básica"
 HKG_revise_basic_law_desc: "A Lei Básica foi redigida como um documento de transição, com Pequim como autoridade máxima implícita. Uma carta revisada elimina essas cláusulas, afirma a plena soberania e reescreve a estrutura da RAE como uma república de leis. A defesa e a política externa passam a pertencer a Hong Kong."
 HKG_pearl_of_east_asia: "A Pérola do Leste Asiático"
 HKG_pearl_of_east_asia_desc: "Livre tanto das restrições do continente quanto dos entraves ocidentais, a cidade se posiciona como o incomparável entreposto financeiro e comercial do Leste Asiático. O capital flui por Central. O talento flui para Wan Chai. A Pérola ofusca tanto Xangai quanto Singapura."
 HKG_global_financial_capital: "Capital Financeira Global"
 HKG_global_financial_capital_desc: "A HKEX, uma autoridade monetária independente e um regime regulatório projetado para atrair capital que não confia em Nova York nem em Londres. Hong Kong se torna o centro de gravidade financeiro da Ásia-Pacífico - discretamente, com lucro, de forma insubstituível."
 HKG_coastal_defence_doctrine: "Doutrina de Defesa Costeira"
 HKG_coastal_defence_doctrine_desc: "Uma cidade-estado não pode bancar uma marinha de águas azuis, mas pode fazer com que qualquer incursão seja cara. Mísseis antinavio, acessos minados, um porto fortificado e uma doutrina voltada à negação, e não à projeção. Hong Kong será um porco-espinho, não um leão."
 HKG_under_lion_rock_hill: "Sob o Lion Rock"
 HKG_under_lion_rock_hill_desc: "§CNo mesmo barco, sob o Rochedo, lutaremos como um só\n\nTodos iguais sob o Sol.\n\nQuando formos livres e unidos\n\nPerseguiremos nossos sonhos de alegria\n\nJuntos, uma só alma, um só coração\n\nUma esperança que nenhum medo pode destruir.\n\nOnde terminam o céu e o mar\n\nDe mãos dadas, caminhe comigo\n\nPara vencer e triunfar em nossa luta por escrever\n\nNossa história de lar, brilhando forte.§!"
 HKG_race_discrimination_bill: "Projeto de Lei contra a Discriminação Racial"
 HKG_race_discrimination_bill_desc: "A Lei Básica e a Portaria da Declaração de Direitos de Hong Kong protegem os direitos dos indivíduos, incluindo o direito de não sofrer discriminação racial. Temos também a obrigação, nos termos da Convenção Internacional sobre a Eliminação de Todas as Formas de Discriminação Racial, de proibir e eliminar a discriminação racial."
 HKG_LGBT_rights: "Direitos LGBT"
 HKG_LGBT_rights_desc: "A comunidade LGBT de Hong Kong esperou por tempo demais. O governo examinará quais proteções e reformas são possíveis dentro do arcabouço jurídico atual."
 HKG_affirm_support_for_christian_organizations: "Reafirmar o Apoio às Organizações Cristãs"
 HKG_affirm_support_for_christian_organizations_desc: "As organizações cristãs há muito exercem uma influência desproporcional na política social de Hong Kong. Seu papel consultivo será reafirmado e protegido."
 HKG_reduce_power_of_christian_groups: "Reduzir o Poder dos Grupos Cristãos"
 HKG_reduce_power_of_christian_groups_desc: "O papel consultivo das organizações cristãs na política social será reduzido. Processos de consulta laicos se ampliarão para preencher a lacuna."
 HKG_consult_public_on_new_law: "Consultar o Público sobre uma Nova Lei"
 HKG_consult_public_on_new_law_desc: "Antes de legislar, o governo realizará uma extensa consulta pública. O processo levará tempo, mas o resultado terá legitimidade democrática."
 HKG_outlaw_anti_LGBT_discrimination: "Proibir a Discriminação Anti-LGBT"
 HKG_outlaw_anti_LGBT_discrimination_desc: "A discriminação contra pessoas LGBT no local de trabalho, na moradia e na prestação de serviços será tornada ilegal. Espere uma longa batalha legislativa."
 HKG_seek_reform_of_existing_legislation: "Buscar a Reforma da Legislação Existente"
 HKG_seek_reform_of_existing_legislation_desc: "As cláusulas discriminatórias existentes nas leis trabalhistas, familiares e de locação serão identificadas e reformadas."
 HKG_anti_discrimination_reform_package: "O Pacote de Reformas Antidiscriminação"
 HKG_anti_discrimination_reform_package_desc: "Uma reforma antidiscriminação abrangente que cobre raça, religião, orientação sexual, identidade de gênero e deficiência."
 HKG_legalize_gay_marriage: "Legalizar o Casamento Gay"
 HKG_legalize_gay_marriage_desc: "Hong Kong se torna a primeira jurisdição do Leste Asiático a legalizar plenamente o casamento entre pessoas do mesmo sexo. Espere comemoração em alguns círculos e forte reação contrária em outros."
 HKG_gender_pay_gap: "A Disparidade Salarial de Gênero"
 HKG_gender_pay_gap_desc: "Relatórios obrigatórios sobre a disparidade salarial para todos os grandes empregadores. Expor publicamente os infratores alcançará o que a adesão voluntária não conseguiu."
 HKG_require_greater_transparency_from_employers: "Exigir Maior Transparência dos Empregadores"
 HKG_require_greater_transparency_from_employers_desc: "Empregadores acima de um certo número de funcionários serão obrigados a publicar anualmente relatórios detalhados de equidade salarial."
 HKG_deny_existence_of_pay_gap: "Negar a Existência da Disparidade Salarial"
 HKG_deny_existence_of_pay_gap_desc: "A posição oficial do governo: as diferenças salariais existentes refletem escolhas ocupacionais, não discriminação. Nenhuma outra ação é necessária."
 HKG_secondary_school_education_reform: "Reforma do Ensino Médio"
 HKG_secondary_school_education_reform_desc: "A antiga estrutura 3-2-2-3 do ensino secundário será substituída pelo esquema 3-3-4, já em uso nos Estados Unidos e na China continental. A reforma elimina conteúdos redundantes e obsoletos e introduz uma gama mais ampla de disciplinas optativas."
 HKG_patriotic_education_curriculum_reform: "Reforma Curricular da Educação Patriótica"
 HKG_patriotic_education_curriculum_reform_desc: "A educação patriótica não tem lugar no currículo atual de Hong Kong. Introduziremos os Estudos Liberais para preencher essa lacuna."
 HKG_chinese_based_education_curriculum: "Currículo Educacional de Base Chinesa"
 HKG_chinese_based_education_curriculum_desc: "Somos chineses em primeiro lugar e hongkongueses em segundo. Todas as escolas de Hong Kong ensinarão em chinês, e espera-se que todas as crianças o falem."
 HKG_hong_kong_police_force: "Força Policial de Hong Kong"
 HKG_hong_kong_police_force_desc: "A Força Policial de Hong Kong foi estabelecida em 1º de maio de 1844 e é a maior força disciplinada do governo de Hong Kong. Devido às restrições à movimentação do Exército de Libertação Popular estacionado em Hong Kong, as funções normalmente desempenhadas pelos militares em outros países ficam a cargo da força policial de Hong Kong. Por muito tempo, a Polícia de Hong Kong foi aclamada como \"a melhor da Ásia\"."
 HKG_anti_terrorist_train: "Treinamento Antiterrorismo"
 HKG_anti_terrorist_train_desc: "O novo milênio trouxe prosperidade e oportunidades, mas também novas ameaças. O terrorismo não deve criar raízes em Hong Kong."
 HKG_purchase_chinese_weapons: "Comprar Armamento Chinês"
 HKG_purchase_chinese_weapons_desc: "Substituir as pistolas Smith & Wesson da era britânica por alternativas fornecidas pela Norinco. O custo é baixo; o simbolismo, considerável."
 HKG_create_CTRU: "Criar a Unidade de Resposta Antiterrorismo"
 HKG_create_CTRU_desc: "A Unidade de Resposta Antiterrorismo, conhecida como CTRU, é uma força de reação rápida criada para responder a incidentes terroristas. Seus oficiais serão os melhores que a corporação puder formar."
 HKG_police_system_reform: "Reforma do Sistema Policial"
 HKG_police_system_reform_desc: "Uma modernização do treinamento, da estrutura de comando e dos mecanismos de prestação de contas da HKPF."
 HKG_investigate_police_triad_cooperation_problem: "Investigar a Cooperação entre Polícia e Tríades"
 HKG_investigate_police_triad_cooperation_problem_desc: "Infiltramos agentes secretos nas Tríades, mas eles fazem o mesmo conosco. Essas toupeiras comprometem nossas operações antes mesmo de começarem. Trabalhando por meio da ICAC e da OCTB, extirparemos esses \"Hak Ging\"."
 HKG_anti_protest_train: "Treinamento Extensivo Antidistúrbios"
 HKG_anti_protest_train_desc: "Treinamento especializado para cenários de controle de multidões, de assembleias pacíficas a distúrbios violentos."
 HKG_purchase_anti_riot_armour: "Adquirir Equipamento Antidistúrbios"
 HKG_purchase_anti_riot_armour_desc: "Novos equipamentos balísticos e resistentes a impacto para a Unidade Tática da Polícia."
 HKG_purchase_non_lethal_weapons: "Comprar Armas Não Letais"
 HKG_purchase_non_lethal_weapons_desc: "Lançadores de gás lacrimogêneo, balas de borracha e armas de bolas de pimenta, o moderno kit de controle de multidões."
 HKG_form_elite_team: "Formar a Equipe de Elite"
 HKG_form_elite_team_desc: "Uma unidade dedicada de resposta antiterrorismo, inspirada em equipes táticas estrangeiras."
 HKG_gong_hei_fat_coi: "Gong Hei Faat Choy"
 HKG_gong_hei_fat_coi_desc: "A [HKG.GetFlag]Hong Kong que acaba de enfrentar uma crise financeira e entrou no novo milênio não enfrenta falta de problemas econômicos e sociais. Como resolvê-los é uma pergunta que o povo deve responder."
 HKG_typhoon_shelter_from_financial_storm: "Abrigo contra a Tempestade Financeira"
 HKG_typhoon_shelter_from_financial_storm_desc: "A tempestade passou. É hora de limpar a bagunça. O governo empregará reservas cambiais e intervenções direcionadas para estimular a economia."
 HKG_merge_into_HKEX: "Fundir a HKCE e a HKFE na HKEX"
 HKG_merge_into_HKEX_desc: "Na esteira da crise financeira de 1997, a Bolsa de Commodities de Hong Kong (HKCE) e a Bolsa de Futuros de Hong Kong (HKFE) serão fundidas na nova Hong Kong Exchanges and Clearing Limited (HKEX), aguçando a vantagem competitiva da cidade em um mercado cada vez mais globalizado."
 HKG_greatest_entrepot: "O Maior Porto Mercantil do Leste Asiático"
 HKG_greatest_entrepot_desc: "Hong Kong há muito é o principal entreposto da Ásia. Expandir a capacidade do porto e a eficiência no manuseio de cargas manterá o título."
 HKG_expand_Kwai_Tsing_terminals: "Expandir os Terminais de Kwai Tsing"
 HKG_expand_Kwai_Tsing_terminals_desc: "Nova capacidade de movimentação de contêineres em Kwai Tsing. Navios maiores, giro mais rápido, mais carga passando por Hong Kong."
 HKG_attract_foreign_investment: "Atrair Investimento Estrangeiro"
 HKG_attract_foreign_investment_desc: "Um pacote de incentivos fiscais, simplificação regulatória e serviços dedicados de ligação com investidores para atrair capital do exterior."
 HKG_european_business: "Os Negócios Europeus"
 HKG_european_business_desc: "Abordagem direcionada às câmaras de comércio europeias. Hong Kong como porta de entrada regional para as empresas europeias que chegam à Ásia."
 HKG_chinese_entrepreneurs: "Os Empresários do Continente"
 HKG_chinese_entrepreneurs_desc: "O capital chinês do continente é o futuro da economia de Hong Kong. O governo aprofundará os laços com o establishment empresarial de Pequim."
 HKG_develop_solar_power: "Investir em Energia Solar"
 HKG_develop_solar_power_desc: "Instalações fotovoltaicas distribuídas em telhados e reservatórios. Um começo modesto, mas um começo."
 HKG_T_PARK: "Instalação T·PARK"
 HKG_T_PARK_desc: "A instalação de tratamento de lodo T-PARK, em Tuen Mun, transforma resíduos em energia e demonstra a ambição ambiental de Hong Kong."
 HKG_indonesian_gas: "Gás de Jacarta"
 HKG_indonesian_gas_desc: "Um acordo de longo prazo de fornecimento de gás natural liquefeito com a Indonésia, garantindo as necessidades energéticas de Hong Kong por décadas."
 HKG_australian_oil: "Petróleo de Sydney"
 HKG_australian_oil_desc: "Uma parceria de importação com produtores australianos de petróleo bruto, diversificando a dependência de hidrocarbonetos de Hong Kong para além de um único fornecedor."
 HKG_new_development_idea: "Novo Plano de Desenvolvimento"
 HKG_new_development_idea_desc: "A Nova Iniciativa de Desenvolvimento reúne projetos de infraestrutura, habitação e zonas industriais sob uma única bandeira coordenada."
 HKG_invest_hong_kong: "Investir em Hong Kong"
 HKG_invest_hong_kong_desc: "A InvestHK é reestruturada e recebe novo financiamento como a principal agência de promoção de investimentos da cidade."
 HKG_hong_kong_science_parks: "Parques Científicos"
 HKG_hong_kong_science_parks_desc: "Zonas dedicadas em Sha Tin e Tseung Kwan O para P&D em biotecnologia, IA e manufatura avançada, com escritórios subsidiados para startups."
 HKG_invite_talent_to_hong_kong: "Convidar Talentos para Hong Kong"
 HKG_invite_talent_to_hong_kong_desc: "Um programa de visto acelerado para profissionais estrangeiros altamente qualificados, com serviços em inglês e incentivos fiscais para facilitar a transição."
 HKG_hong_kong_cyberport: "O Cyberport"
 HKG_hong_kong_cyberport_desc: "O mandato do Cyberport é renovado e ampliado como um polo de negócios digitais voltado a fintech, comércio eletrônico e mídia digital."
 HKG_tech_incubation_programme: "Programa de Incubação Tecnológica"
 HKG_tech_incubation_programme_desc: "Incubadoras financiadas pelo governo, com capital inicial, mentoria e infraestrutura compartilhada para startups de tecnologia em estágio inicial."
 HKG_favor_traditional_values: "Voltar-se à Tradição"
 HKG_favor_traditional_values_desc: "O governo se alinhará publicamente aos valores familiares tradicionais, restringindo o ativismo LGBT na educação e na vida pública."
 HKG_undercover_oppression: "Opressão Velada"
 HKG_undercover_oppression_desc: "Uma abordagem mais discreta: vigilância, pressão de empregadores e desencorajamento informal, em vez de legislação aberta contra grupos minoritários."
 HKG_legislate_to_ban_LGBT: "Banir o Coletivo LGBT"
 HKG_legislate_to_ban_LGBT_desc: "Legislação aberta que criminaliza as expressões públicas de identidade LGBT. A comunidade internacional reagirá duramente."
 HKG_regulate_sale_of_residential_buildings: "Regulamentar a Venda de Imóveis Residenciais"
 HKG_regulate_sale_of_residential_buildings_desc: "Um modesto conjunto de regras de divulgação, limites de hipoteca e impostos antiespeculação. O plano Suen permanece em vigor, mas os piores excessos do mercado desregulado passam a ter um freio."
 HKG_land_reclamation: "Aterro de Terras"
 HKG_land_reclamation_desc: "Hong Kong tem pouca terra. O Departamento de Engenharia Civil elabora um novo programa de aterros ao largo de Lantau, da costa dos Novos Territórios e do porto de Kowloon. O custo é enorme e os ambientalistas estão furiosos; os novos terrenos para construção valem a pena."
 HKG_lock_housing_price: "Congelar os Preços dos Imóveis"
 HKG_lock_housing_price_desc: "O governo legisla um teto rígido para os preços dos imóveis residenciais, indexado à renda mediana. Os proprietários de terras ficam apoplécticos; inquilinos e sindicatos comemoram. O mercado se torna previsível - e estagnado."
 HKG_expand_home_ownership_scheme: "Ampliar o Programa de Casa Própria"
 HKG_expand_home_ownership_scheme_desc: "O Programa de Casa Própria é ampliado: mais apartamentos, requisitos menores, processamento mais rápido. Um hongkonguês de classe trabalhadora finalmente pode aspirar à casa própria. O tesouro arca com o subsídio; a paz social é o dividendo."
 HKG_let_government_hold_companies: "Empresas Estatais"
 HKG_let_government_hold_companies_desc: "As maiores incorporadoras - Sun Hung Kai, Cheung Kong, Henderson - são parcialmente nacionalizadas. Os magnatas protestam em alto e bom som; o governo detém as ações. Os preços dos imóveis passam a ficar sob controle político direto."
 HKG_maintain_public_housing_construction: "Manter a Construção de Habitação Pública"
 HKG_maintain_public_housing_construction_desc: "A carteira de obras da Autoridade de Habitação é preservada e ampliada. Conjuntos públicos se erguem pelos Novos Territórios. O investimento em infraestrutura aparece na estabilidade e em uma população discretamente mais satisfeita."
 HKG_my_home_purchase_scheme: "Programa de Compra da Casa Própria"
 HKG_my_home_purchase_scheme_desc: "O Plano My Home Purchase, de Donald Tsang, é implementado conforme o projeto: unidades de aluguel com opção de compra para a classe \"sanduíche\", os hongkongueses que ganham demais para a habitação pública, mas não podem arcar com o mercado privado. Uma resposta concreta à crise de acessibilidade."
 HKG_subsidised_sale_flats_project: "Projeto de Apartamentos Subsidiados"
 HKG_subsidised_sale_flats_project_desc: "Apartamentos à venda subsidiados pelo governo, vendidos abaixo do preço de mercado a compradores de primeira viagem. A Autoridade de Habitação torna-se, na prática, a maior incorporadora da RAE."
 HKG_green_form_subsidised_home_ownership_scheme: "Programa de Casa Própria Green Form"
 HKG_green_form_subsidised_home_ownership_scheme_desc: "O ponto culminante da reforma habitacional: os titulares do Green Form - atuais inquilinos de habitação pública - têm acesso preferencial à casa própria subsidiada. A cadeia de mobilidade ascendente, quebrada por duas décadas, é finalmente reconstruída. A crise habitacional de Hong Kong chega ao fim."
 HKG_public_housing_problem: "Problema da Habitação Pública"
 HKG_public_housing_problem_desc: "A crise habitacional de Hong Kong é o fracasso mais visível do governo pós-transferência. Os preços medianos dos imóveis superam a renda mediana em uma ordem de grandeza; apartamentos subdivididos e moradias em gaiolas abrigam dezenas de milhares; a fila de espera por habitação pública passa de seis anos. A pressão política para fazer algo - qualquer coisa - é esmagadora."
 HKG_sun_housing_policy: "Política de Nove Pontos de Reforma Habitacional de Suen"
 HKG_sun_housing_policy_desc: "O programa de nove pontos do Secretário de Habitação Michael Suen. Restringir a oferta, interromper a construção pública, deixar o mercado se recuperar. Os proprietários de terras e os conglomerados aprovam. Os sindicatos e os inquilinos, não. A história julgará a política com severidade, mas ela garante o mercado imobiliário no curto prazo."
 HKG_end_tenants_purchase_scheme: "Encerrar o Programa de Compra pelos Inquilinos"
 HKG_end_tenants_purchase_scheme_desc: "Os inquilinos de habitação pública não poderão mais comprar seus apartamentos a preços com desconto. O tesouro mantém o ativo; os inquilinos continuam inquilinos. Um pequeno ganho de receita a um custo social real."
 HKG_suspend_home_ownership_scheme: "Suspender o Programa de Casa Própria"
 HKG_suspend_home_ownership_scheme_desc: "O Programa de Casa Própria é suspenso por tempo indeterminado. A oferta de apartamentos subsidiados à venda se esgota, o mercado privado fica livre da concorrência pública e os magnatas imobiliários têm uma preocupação a menos."
 HKG_curtail_land_supply: "Reduzir a Oferta de Terras"
 HKG_curtail_land_supply_desc: "As vendas de terras do governo são interrompidas; o Departamento de Terras mantém seu estoque fora do mercado. Os preços se estabilizam em patamares elevados, o mercado imobiliário se consolida e a crise habitacional se torna uma característica permanente da vida em Hong Kong."
 HKG_legco_decision_categories: "§1LegCo§!"
 legco_current_motion_clock: "Moção Atual: §Y[ROOT.legco_current_motion]§!"
 legco_current_special_motion_clock: "Moção Atual: §Y[ROOT.legco_current_motion]§!"
 legco_increase_administration_motion_clock: "Moção Atual: §YAumentar os Gastos Burocráticos £political_power_texticon§!"
 legco_decrease_administration_motion_clock: "Moção Atual: §YReduzir os Gastos Burocráticos £political_power_texticon§!"
 legco_increase_policing_motion_clock: "Moção Atual: §YAumentar o Financiamento £foreign_influence_defense_modifier_texticon de §CSegurança§!§!"
 legco_decrease_policing_motion_clock: "Moção Atual: §YReduzir o Financiamento £foreign_influence_defense_modifier_texticon de §CSegurança§!§!"
 legco_increase_education_motion_clock: "Moção Atual: §YAumentar o Orçamento £research_speed_texticon de §GEducação§!§!"
 legco_decrease_education_motion_clock: "Moção Atual: §YReduzir o Orçamento £research_speed_texticon de §GEducação§!§!"
 legco_increase_health_motion_clock: "Moção Atual: §YAumentar o Financiamento £population_texticon de §RSaúde§!§!"
 legco_decrease_health_motion_clock: "Moção Atual: §YReduzir o Financiamento £population_texticon de §RSaúde§!§!"
 legco_increase_social_motion_clock: "Moção Atual: §YAumentar os Gastos £consumer_goods_texticon com §nPensões§!§!"
 legco_decrease_social_motion_clock: "Moção Atual: §YReduzir os Gastos £consumer_goods_texticon com §nPensões§!§!"
 HKG_unrestricted_housing_market: "Mercado Imobiliário Sem Restrições"
 HKG_unrestricted_housing_market_desc: "O mercado imobiliário livre de Hong Kong está entre os mais dinâmicos e, ao mesmo tempo, mais cruelmente inacessíveis do mundo. Sem intervenção, a distância entre rendas e preços continuará a aumentar."
 HKG_victoria_harbour: "Porto de Victoria"
 HKG_victoria_harbour_desc: "O Porto de Victoria é o coração histórico da economia portuária de Hong Kong: o tráfego de contêineres, as balsas e os terminais de cruzeiros convergem todos aqui."
 HKG_victoria_harbour_expand_desc: "Um Porto de Victoria ampliado, com novos berços de contêineres, canais aprofundados e movimentação de carga modernizada."
 HKG_victoria_harbour_expand_plus_desc: "O Porto de Victoria em plena capacidade moderna: terminais automatizados, berços de águas profundas e o maior volume de carga da região."
 legacy_of_handover_hong_kong: "Legado da Transferência de Hong Kong"
 legacy_of_handover_hong_kong_desc: "A transferência de soberania de 1997 criou laços institucionais, econômicos e culturais entre Hong Kong e o continente que continuam a moldar as políticas décadas depois."
 Basic_Law_HKG: "§8A Lei Básica da §H[HKG.GetFlag]RAE de Hong Kong§!§!"
 Basic_Law_milltary_HKG: "A Lei Básica da [HKG.GetFlag]RAE de Hong Kong"
 Basic_Law_milltary_HKG_desc: "Segundo a Lei Básica, a defesa é reservada ao governo central. Hong Kong não mantém forças armadas independentes; a Guarnição do ELP em Hong Kong cumpre qualquer papel de defesa externa."
 Basic_Law_HKG_desc: "A Lei Básica foi o documento fundador da Região Administrativa Especial de Hong Kong após a transferência de Hong Kong do Reino Unido para a República Popular da China. Entre outras coisas, o documento define o status de Hong Kong em relação à China e lhe concede autonomia em todos os assuntos, exceto defesa e relações exteriores, ambos confiados ao governo central.\n\n§W----------\nComo §Y[HKG.GetFlag]§!§HRAE§!, não possui forças de defesa próprias; o nível necessário do orçamento de defesa será mantido em §H0§!, e também não será permitido alterar os §GGastos Militares.§!§!"
 One_Country_Two_Systems: "One Country Two Systems"
 One_Country_Two_Systems_desc: "§Y[HKG.GetFlag]Hong Kong§! e §Y[MAC.GetFlag]Macau§! tiveram garantidos 50 anos de autonomia em relação ao domínio direto chinês. O modelo de um país, dois sistemas permite a preservação e até o crescimento de muitas das liberdades políticas valorizadas por Hong Kong e Macau, como a liberdade de expressão e a liberdade de reunião pública. A ausência desses direitos no continente é um importante motor do apoio ao campo \"pan-democrata\" na política de Hong Kong, e muitos hongkongueses preocupados continuam receosos de uma maior integração com a China continental."
 Localist_Movement: "Localist Movement"
 Localist_Movement_desc: "Ever since the handover in 1997, tensions between mainland Chinese and Hongkongers have led to the development of localist \"Hong Kong First\" sentiment amongst some local Hongkongers. This sentiment views communist China's political system with distrust, but also views Hong Kong people as culturally distinct and indeed superior compared to the people of China. The rise of this movement from the 2014 Umbrella Movement onward has changed the previously more measured tone of the Hong Kong political divide into one that is more emotive and radical."
 Lacks_Universal_Suffrage: "Lacks Universal Suffrage"
 Lacks_Universal_Suffrage_desc: "While the Basic Law calls for the Chief Executive and Legislative Council to eventually be elected by universal suffrage, this has yet to come to pass, primarily due to the Chinese government's concerns about what may happen if the significantly more popular pan-democrats take control of the Hong Kong government."
 Limited_Universal_Suffrage: "Limited Universal Suffrage"
 Limited_Universal_Suffrage_desc: "The Chinese government has agreed to allow the Chief Executive of Hong Kong to be elected by universal suffrage, on the condition that candidates are vetted by Beijing first. This is widely seen as a move to reduce the likelihood of pan-democrat or localist candidates becoming Chief Executive."
 Universal_Suffrage: "Universal Suffrage"
 Universal_Suffrage_desc: "The Chinese government has finally agreed to permit Hong Kong to elect its Chief Executive by universal suffrage without interference from mainland authorities."
 Hong_Kong_Protests: "Hong Kong Protests"
 Hong_Kong_Protests_desc: "Following recent actions by the Chinese government, widespread protests have broken out in Hong Kong demanding a reversal of the Chinese move."
 asian_crisis_HKG_desc: "A crise econômica que atingiu o Leste e o Sudeste Asiático em desenvolvimento jogou décadas de crescimento no lixo. A perda de confiança nas moedas nacionais ainda assombra os bancos centrais até hoje. As dívidas pública e privada também dispararam.\n\nLições dolorosas foram aprendidas, e reformas econômicas antes indesejadas estão a todo vapor. Cada país foi atingido de maneira diferente e cada um tem suas próprias soluções.\n\nO fluxo de investimentos para os países afetados já foi metade do total mundial, mas agora vai para a [CHI.GetFlag]China e outros destinos."
 asian_crisis_league_HKG: "A crise econômica que atingiu o Leste e o Sudeste Asiático em desenvolvimento jogou décadas de crescimento no lixo. A perda de confiança nas moedas nacionais ainda assombra os bancos centrais até hoje. As dívidas pública e privada também dispararam.\n\nLições dolorosas foram aprendidas, e reformas econômicas antes indesejadas estão a todo vapor. Cada país foi atingido de maneira diferente e cada um tem suas próprias soluções.\n\nO fluxo de investimentos para os países afetados já foi metade do total mundial, mas agora vai para a [CHI.GetFlag]China e outros destinos."
 HKG_HKEX: "Hong Kong Exchanges and Clearing Limited"
 HKG_improve_trade: "Atrair Investimento Estrangeiro"
 HKG_improve_trade_desc: "Um esforço coordenado para aprofundar as relações comerciais de Hong Kong pela Ásia e além: novos acordos, alfândegas simplificadas e seções comerciais ativas nas embaixadas."
 HKG_idea_T_PARK: "§5T-PARK§!"
 HKG_idea_T_PARK_desc: "A instalação T-PARK processa o lodo de esgoto de Hong Kong enquanto gera eletricidade, servindo ao mesmo tempo como infraestrutura de gestão de resíduos e vitrine ambiental."
 HKG_new_develop_idea_dynamic_modifier: "Nova Ideia de Desenvolvimento"
 HKG_new_develop_idea_dynamic_modifier_desc: "Os efeitos combinados da Nova Iniciativa de Desenvolvimento sobre a economia e a base de infraestrutura de Hong Kong."
 HKG_idea_secondary_education_reform: "Reforma do Ensino Médio"
 HKG_idea_secondary_education_reform_desc: "A antiga estrutura 3-2-2-3 do ensino secundário é substituída pelo esquema 3-3-4, já em uso nos Estados Unidos e na China continental. Conteúdos redundantes e obsoletos são removidos e uma gama mais ampla de disciplinas optativas é introduzida."
 HKG_idea_patriotic_education_reform: "Reforma da Educação Patriótica"
 HKG_idea_patriotic_education_reform_desc: "A educação patriótica não tem lugar no currículo atual de Hong Kong. Os Estudos Liberais foram introduzidos para preencher essa lacuna."
 HKG_idea_chinese_based_education_reform: "Reforma Educacional de Base Chinesa"
 HKG_idea_chinese_based_education_reform_desc: "Todas as escolas de Hong Kong agora ensinam em chinês. Espera-se que todas as crianças o falem."
 HKG_rise_of_internet: "A Ascensão da Internet"
 HKG_rise_of_internet_desc: "A internet abriu um novo rumo para o desenvolvimento humano. Resta saber se será apenas uma moda passageira ou a tendência econômica dominante das próximas décadas."
 HKG_idea_SARS_outbreak: "Impacto da SARS"
 HKG_idea_SARS_outbreak_desc: "O surto de SARS atingiu duramente a economia e a confiança pública de Hong Kong, afetando o turismo, o comércio e a vida cotidiana em toda a cidade."
 HKG_idea_railway_development_strategy_2000: "Estratégia de Desenvolvimento Ferroviário 2000"
 HKG_idea_railway_development_strategy_2000_desc: "A Estratégia de Desenvolvimento Ferroviário 2000 é o plano orientador da expansão do MTR na próxima década."
 HKG_patriotic_loyalist_drive: "Campanha Patriótica Legalista"
 HKG_patriotic_loyalist_drive_desc: "A Educação em Segurança Nacional satura escolas, emissoras e o serviço público. O resultado é um público mais dócil e instituições partidárias mais fortes, ao custo da abertura intelectual e da produção de pesquisa."
 HKG_loyalist_civil_service_purge: "Expurgo Legalista do Serviço Público"
 HKG_loyalist_civil_service_purge_desc: "Comitês de verificação vasculham o serviço público atrás de hesitantes e dissidentes discretos. A administração do dia a dia sofre enquanto o expurgo segue seu curso, mas a burocracia que emergir responderá a um único senhor."
 HKG_mainland_talent_scheme: "Programa de Talentos do Continente"
 HKG_mainland_talent_scheme_desc: "Os postos administrativos vagos de Hong Kong são preenchidos por profissionais formados no continente. A produção de pesquisa se recupera e os escritórios funcionam com eficiência, mas uma força de trabalho nativa cada vez menor torna o poder político mais difícil de mobilizar localmente."
 HKG_gba_integration_idea: "Integração da Grande Área da Baía"
 HKG_gba_integration_idea_desc: "Hong Kong, Macau, Shenzhen e Zhuhai agora operam como uma única economia funcional. A produção industrial e o comércio prosperam, e a linha entre a RAE e o continente se dissolve por design."
 HKG_great_hong_kong_nation_idea: "A Grande Nação de Hong Kong"
 HKG_great_hong_kong_nation_idea_desc: "Hong Kong declarou sua soberania em desafio a Pequim. O clima é marcial: o moral está alto, o recrutamento é amplo e uma geração que cresceu assistindo às repressões do movimento dos guarda-chuvas está pronta para defender a independência pela qual lutou. As relações com o continente estão paralisadas."
 HKG_city_state_doctrine: "Doutrina da Cidade-Estado"
 HKG_city_state_doctrine_desc: "Hong Kong segue o modelo de Singapura: pequena, neutra, próspera, tecnocrática. A economia gira em torno do comércio e das finanças, o porto é o sangue vital do Estado e a ambição militar está firmemente subordinada ao pragmatismo comercial."
 HKG_under_british_wing_idea: "Sob a Asa Britânica"
 HKG_under_british_wing_idea_desc: "Hong Kong formalizou seu alinhamento político e de segurança com o Reino Unido e a Commonwealth em geral. Acesso de voluntários das forças armadas anglófonas, licenciamento de tecnologia em condições preferenciais e uma postura diplomática clara: Londres, e não Pequim, é o parceiro sênior."
 HKG_pro_democracy_media: "Carta de Mídia Pró-Democracia"
 HKG_pro_democracy_media_desc: "O Apple Daily, o Stand News, a RTHK e dezenas de veículos menores operam sob proteção legal explícita contra a interferência política. As redes de desinformação do continente têm dificuldade em ganhar tração, e o discurso público pende inequivocamente para as normas democráticas."
 HKG_civil_society_funding: "Financiamento da Sociedade Civil"
 HKG_civil_society_funding_desc: "ONGs, associações de bairro e grupos de defesa pró-democracia recebem financiamento público transparente. O resultado é uma cultura cívica mais engajada e um campo democrático discretamente mais forte, pago com os cofres públicos."
