 nsb_Anti_Air_0: "휴대용 대공 방어 시스템 1965"
 nsb_Anti_Air_0_desc: "휴대용 대공 방어 시스템은 어깨에 발사하는 지대공 미사일 발사기입니다. 휴대용 중량에 대한 요구로 인해 미사일 크기가 엄격하게 제한되므로 단거리 시스템입니다. 따라서 저공비행 항공기에는 위협이 되고 헬리콥터에는 치명적입니다."
 nsb_Anti_Air_1: "휴대용 대공 방어 시스템 1985"
 nsb_Anti_Air_1_desc: "휴대용 대공 방어 시스템은 어깨에 발사하는 지대공 미사일 발사기입니다. 휴대용 중량에 대한 요구로 인해 미사일 크기가 엄격하게 제한되므로 단거리 시스템입니다. 따라서 저공비행 항공기에는 위협이 되고 헬리콥터에는 치명적입니다."
 nsb_Anti_Air_2: "휴대용 대공 방어 시스템 2005"
 nsb_Anti_Air_2_desc: "휴대용 대공 방어 시스템은 어깨에 발사하는 지대공 미사일 발사기입니다. 휴대용 중량에 대한 요구로 인해 미사일 크기가 엄격하게 제한되므로 단거리 시스템입니다. 따라서 저공비행 항공기에는 위협이 되고 헬리콥터에는 치명적입니다."
 nsb_Anti_Air_3: "휴대용 대공 방어 시스템 2025"
 nsb_Anti_Air_3_desc: "휴대용 대공 방어 시스템은 어깨에 발사하는 지대공 미사일 발사기입니다. 휴대용 중량에 대한 요구로 인해 미사일 크기가 엄격하게 제한되므로 단거리 시스템입니다. 따라서 저공비행 항공기에는 위협이 되고 헬리콥터에는 치명적입니다."
 nsb_Anti_Air_4: "휴대용 대공 방어 시스템 2035"
 nsb_Anti_Air_4_desc: "휴대용 대공 방어 시스템은 어깨에 발사하는 지대공 미사일 발사기입니다. 휴대용 중량에 대한 요구로 인해 미사일 크기가 엄격하게 제한되므로 단거리 시스템입니다. 따라서 저공비행 항공기에는 위협이 되고 헬리콥터에는 치명적입니다."
 BLR_Anti_tank_1: "RPG-7"
 BLR_Anti_tank_1_desc: "Used in many wars and on many vehicles."
 BLR_Anti_tank_2: "AT-4 파고트"
 BLR_Anti_tank_2_desc: "다른 대전차 유도 미사일(ATGM) 체계보다 훨씬 가볍고 오래되었습니다. 이 ATGM은 70~2,500m 범위만 타격할 수 있어 다른 체계에 비해 사거리가 훨씬 짧지만 더 저렴합니다."
 BRA_MBT_4_short: "EE-T2 오소리우"
 BRA_MBT_5_short: "EE-T4 오소리우"
 GER_APC_1_desc: "M113G는 미국에서 제작된 M113의 독일 수출형 모델입니다. M113G는 차량 전면에 76mm 연막탄 발사기 8개를 장착하는 경우가 많았으며, 일반적인 M2 .50구경 기관총 대신 라인메탈 MG3 기관총으로 무장했습니다."
 GER_APC_2_desc: "콘도르는 원래 독일의 티센 헨셸이 설계하고 헨셸 베르테크닉 GmbH가 제작한 4x4 차륜형 장갑 수송차입니다. 콘도르의 차체는 전면 용접 장갑강으로 만들어져 승무원을 7.62mm 철갑탄, 5.56mm 보통탄, 포탄 파편, 대인 지뢰로부터 보호합니다. 콘도르의 포탑은 20mm 주포와 동축 7.62 기관총으로 무장합니다."
 GER_APC_3_desc: "TPz-1 푸크스(Transportpanzer Fuchs)는 독일의 장갑차로, 원래 다임러-벤츠에서 개발했지만 현재의 라인메탈 MAN 밀리터리 비히클(RMMV)에서 생산 및 추가 개발을 담당했습니다. 푸크스는 서독 연방군에 실전 배치된 두 번째 차륜형 장갑차입니다. 푸크스에는 최대 3정의 MG3 기관총을 장착할 수 있습니다."
 GER_APC_4_desc: "TPz-1 푸크스 MEXAS는 신형 MEXAS 방식 세라믹 장갑, 파편 방지 내장재, 무선 조종 지뢰로부터 보호하는 재밍 체계를 포함한 향상된 지뢰 방호를 갖춘 TPz-1 푸크스의 개량형입니다."
 GER_APC_5_desc: "TPz-2 푸크스는 TPz-1 푸크스를 더욱 개량한 형식입니다. 푸크스 2는 최대 적재량이 6000kg으로 늘었고, 동력 장치는 456마력(340kW)을 내는 MTU 6V 199 TE20 V6 11.9리터 수냉식 유로 3 배출 기준 충족 디젤 엔진으로 개량되었으며, 감속기가 통합된 ZF 6HP 602 완전 자동 6단 변속기와 결합됩니다. 1400 R20 타이어는 런플랫 방식입니다. 지상 최고 속도는 105km/h(65mph)이고 작전 항속 거리는 800km입니다."
 GER_APC_6_desc: "GTK 복서 장갑차는 국제 컨소시엄이 설계한 다목적 장갑 전투 차량으로, 다양한 임무 모듈을 장착하여 여러 작전을 수행할 수 있습니다. 실전 배치된 대부분의 복서 장갑차는 자체 방어를 위한 원격 무기 시스템을 갖추고 있습니다. 독일군은 일반적으로 KMW 사의 FLW-200 시스템을 장착하는데, 이 시스템에는 7.62mm MG3 기관총, 12.7mm M3M 중기관총 또는 40mm GMW 자동 유탄 발사기를 장착할 수 있습니다. FLW-200은 이중 축 안정화 장치와 레이저 거리 측정기, 열화상 카메라를 내장하고 있습니다."
 GER_APC_7_desc: "GTK 복서 OS에는 오를리콘 스카이레인저가 장착되었습니다. 이는 라인메탈의 35mm x 228 구경 리볼버 포로 무장하며, 두 종류의 포탄 중 하나를 선택할 수 있는 이중 탄약 급탄 체계를 선택 사양으로 갖추고 있습니다. 주로 35mm 첨단 명중 효율 및 파괴(AHEAD) 탄을 발사하며, 보조 탄종은 파쇄성 철갑 분리 탄피(FAPDS) 탄입니다. 이 포의 이론상 발사 속도는 분당 1,000발이며, 전형적인 공중 표적은 20~24발의 점사로 교전합니다."
 GER_APC_8_desc: "GTK 복서 RWS40은 표준 GTK 복서의 개량형입니다. RWS40 파생형은 새롭고 개선된 조준 및 항법 체계, 신형 광학 센서, 그리고 40mm 주포와 신형 6.8mm 동축 기관총으로 무장한 새로운 CROWS 체계 포탑을 갖추었습니다."
 GER_IFV_1_desc: "랑 HS.30은 1960년대에 히스파노 수이자가 개발한 서독의 보병전투차입니다. 초기 기계적 문제 이후 계획된 10,680대 중 2,176대만 제작되었습니다. HS.30은 강력한 20mm 자동 기관포와 15x15 잠망경식 조준경을 갖추었습니다."
 GER_IFV_2_desc: "마르더 1은 서독 기계화 보병(판처그레나디어) 부대용으로 라인메탈 란트지스테메가 설계한 보병전투차입니다. 마르더 1은 20mm 자동 기관포로 무장하고 보병 12명을 수송할 수 있습니다. 강력한 공격 능력과 함께 핵, 생물, 화학 무기로부터도 보호됩니다."
 GER_IFV_3_desc: "마르더 1 A1은 밀란 대전차 유도 미사일, 탄약 선택이 가능한 20mm 기관포용 이중 급탄 체계, 영상 증폭기와 열 영상 장치를 포함한 야시 장비를 장착한 개량형입니다. 이러한 개량과 함께 보병 수송 인원은 12명에서 5명으로 줄었습니다."
 GER_IFV_4_desc: "마르더 1 A2는 현가장치, 연료 탱크, 냉각 체계, 고압수 세척 체계를 대폭 개조한 또 다른 개량 패키지입니다. 추가로 신형 조준 체계가 설치되었습니다. 적외선 탐조등 장비는 제거되었고 모든 차량에 열 영상 장치가 장착되었습니다."
 GER_IFV_5_desc: "마르더 1 A5 개량 패키지는 추가 대지뢰 장갑, 지뢰에 피격되었을 때 폭풍과 충격으로부터 승무원의 부상을 방지하기 위해 완전히 새로 설계한 내부, 공조 체계, 급조폭발물 방호용 재머, 다중 스펙트럼 위장을 포함합니다."
 GER_IFV_6_desc: "푸마는 크라우스마파이 베그만과 라인메탈 란트지스테메의 공동 보병전투차 설계 사업입니다. 푸마의 주무장은 라인메탈 30mm MK 30-2/ABM(공중 폭발탄) 자동 기관포로, 분당 200발의 발사 속도와 3,000m의 유효 사거리를 갖습니다. 인상적인 주포와 더불어 푸마는 투사체와 폭발물로부터 탁월한 방호력을 제공합니다."
 GER_IFV_7_desc: "링스 KF-41은 차세대 보병전투차입니다. 링스는 새롭고 모듈식인 설계로 다양한 임무와 요구에 적응할 수 있습니다. 주력 보병전투차 링스는 완전 디지털 운용 및 조준 체계를 비롯한 다양한 기술과 특징을 자랑하며, 평화 유지, 도시 지형에서의 대반란 작전, 대등한 적과의 차량 탑재 전투 등의 상황에 맞춘 여러 생존성 키트를 제공합니다.\n주무장은 35mm 보탄 자동 기관포와 대전차 유도 미사일입니다. 링스는 뛰어난 복합 장갑과 라인메탈의 능동 방어 체계 ADS, 연막 방호 체계 ROSY로 보호됩니다."
 GER_IFV_8_desc: "쿠거 KF-73은 미래형 보병전투차 설계입니다. 쿠거는 링스 KF-41을 기반으로 확대 및 개량한 설계입니다. 쿠거는 더 크고 장갑이 두꺼운 차체를 갖추고 폭발 반응 장갑(ERA)으로 방호됩니다. 또한 쿠거는 82mm 포, 40mm 자동 기관포, 동축 MG4를 장착하고 대전차 유도 미사일도 갖추고 있습니다. 매우 공격적일 뿐 아니라 차세대 능동 방어 체계로 극도로 방어적이며 잘 보호됩니다."
 GER_Rec_tank_0_desc: "쉬첸판처 SPz 11-2 쿠르츠 장갑 보병전투 및 정찰 차량은 서독군을 위해 1959년부터 1967년 사이에 개발되었으며 프랑스가 설계한 차량을 소폭 개조한 것이었습니다. SPz 11-2는 1974년까지 기갑보병 대대의 포 소대에서 복무했으며 1982년까지 정찰 차량으로 운용되었습니다. SPz 11-2는 보병전투차 역할에서는 마르더로, 정찰 역할에서는 슈패판처 룩스로 교체되었습니다. SPz 11-2는 서독군에서만 운용되었습니다."
 GER_Rec_tank_1_desc: "비젤 장갑 무기 수송차(AWC)는 라인메탈이 제작한 독일의 경량 공수 가능 장갑 전투 차량으로, 더 정확히는 경장갑 무기 수송차입니다. 크기, 형태, 기능이 역사 속의 정찰용 소형 전차(탱켓)와 매우 비슷하며, 서유럽에서 사용되는 유일한 진정한 현대식 탱켓입니다. 비젤 1 아우프클레룽 모델은 더 나은 광학 장비와 통신 체계를 갖춘 지정 정찰 파생형입니다."
 GER_Rec_tank_3_desc: "복서 CRV는 ARTEC가 설계한 장갑 수송차 복서의 정찰 파생형으로, 2인승 파생형인 라인메탈 디펜스 랜스 모듈식 포탑 체계(MTS)를 장비합니다. 이 포탑에는 MK30-2/ABM 기관포만 장착되며, 포탑에 스파이크-LR2 미사일 2기와 엘빗의 아이언 피스트 능동 방어 체계가 추가로 장착될 예정입니다."
 GER_Rec_tank_4_desc: "링스 KF-41 120은 원래 보병전투차 링스의 정찰 파생형입니다. '120' 모델은 향상된 조준 및 정찰 체계를 갖추고 있습니다. 개량된 정찰 체계와 더불어 이미 뛰어난 정찰 능력을 더욱 보완하기 위해 개량된 은폐 및 회피 능력도 갖추었습니다. 링스 120은 보병전투차 형식의 35mm 포 대신 120mm 활강 주포를 장비하여, 표적과의 거리를 유지하면서 최대의 화력을 제공할 수 있습니다."
 GER_artillery_1_desc: "M101A1 곡사포는 미국이 개발한 야포입니다. 제2차 세계 대전 당시 미군의 표준 경량 야전 곡사포였으며, 유럽 전선과 태평양 전선은 물론 한국 전쟁에서도 활약했습니다. 1941년에 생산에 들어간 이래 정확성과 강력한 위력으로 빠르게 명성을 얻었습니다. M101A1은 105mm 고폭탄(HE) 반고정식 탄약을 발사하며 사거리는 12,330야드(11,270m)로, 보병 지원에 적합합니다."
 GER_artillery_1_short: "M101A1"
 GER_artillery_2_desc: "FH155-1은 여러 국가에서 사용되는 155mm 견인 곡사포입니다. FH155-1은 당시 NATO 표준 요구 사항을 충족하기 위해 독일과 영국이 공동 설계한 155mm 견인식 근접 지원포입니다. 분리 가능한 보조 동력 장치 덕분에 자력 사거리 24km, 보조 시 30km를 달성하며, 15~20초 내 3발 연사, 단시간 분당 6발, 지속 사격 시 분당 2발의 사격 능력을 갖추고 있습니다."
 GER_artillery_2_short: "FH155-1"
 GER_artillery_3_desc: "M777 곡사포는 곡사포 부류에 속하는 155mm 견인식 야포입니다. M777은 영국과 미국에 있는 BAE 시스템즈 글로벌 컴뱃 시스템즈 사업부에서 제조합니다. 이 포에는 광학식 사격 통제 장치가 장착되어 있으며, M795 고폭탄으로 최대 14마일 떨어진 표적까지 타격할 수 있습니다."
 GER_artillery_3_short: "M777"
 GER_artillery_4_desc: "M777A1은 M777의 개량형으로, 탑재 전원 장치, 위성 위치 확인 장치, 관성 항법 장치, 무전기, 포 표시 장치(GDU), 구역장 조립체(SCA)가 추가되는 디지털화 개량이 이루어졌습니다."
 GER_artillery_4_short: "M777A1"
 GER_transport_plane1_desc: "트란잘 C-160은 프랑스와 독일의 합작으로 생산된 군용 수송기입니다. \\"트란잘\\"은 MBB, 에어로스파시알, VFW-포커 기업으로 구성된 제조 컨소시엄 '트란스포르트 알리안츠'의 약칭입니다. 이 기체는 프랑스 공군과 독일 공군의 현대적 수송기 요구 사항을 충족하기 위해 개발되었습니다. 해외 작전에 대한 군수 지원을 제공해 왔으며, 공중 급유기, 전자 정보 수집기, 통신 플랫폼 등 특수 임무에도 투입되었습니다."
 GER_transport_plane2_desc: "록히드 C-130 허큘리스는 록히드(현 록히드 마틴)가 설계하고 제작한 미국의 4발 터보프롭 군용 수송기입니다. 비포장 활주로에서도 이착륙이 가능한 C-130은 본래 병력, 후송 환자 및 화물 수송기로 설계되었습니다."
 GER_transport_plane3_desc: "록히드 C-130J 슈퍼 허큘리스는 기존 C-130H를 현대적으로 개량한 파생형입니다. 새로운 'J' 슈퍼 허큘리스는 '전술 초대형 수송기'로 분류되며, 더 강력한 신형 엔진과 개량된 전자 장비 및 항전 장비를 갖추고 있습니다."
 GER_transport_plane3_short: "C-130J 슈퍼"
 GER_transport_plane4_desc: "에어버스 A400M 아틀라스는 유럽의 4발 터보프롭 군용 수송기입니다. 에어버스 디펜스 앤드 스페이스가 트란잘 C-160과 록히드 C-130 허큘리스 같은 노후 수송기를 대체하기 위해 전략적 수송 능력을 갖춘 전술 수송기로 설계했습니다."
 GER_awacs_plane1_medium: "E-3A 센트리"
 GER_awacs_plane1_medium_desc: "보잉 E-3A 센트리는 보잉이 개발한 공중조기경보통제기(AEW&C)입니다. E-3는 흔히 AWACS(공중 경보 통제 체계)로 알려져 있습니다. 보잉 707 여객기를 기반으로 개발되었으며, 전천후 장거리 감시, 지휘, 통제 및 통신 기능을 제공합니다."
 ENG_Heavy_Anti_tank_2: "FV102 Striker"
 ENG_Heavy_Anti_tank_3: "Land Rover Javelin"
 ENG_Heavy_Anti_tank_4: "Boxer Brimstone"
 ENG_Anti_tank_1: "LAW80"
 ENG_Anti_tank_3: "NLAW"
 ENG_Anti_tank_4: "NLAW Gen2"
 POL_early_helicopter: "SM-1"
 POL_early_helicopter_desc: "1950년대 소련의 경량 다목적 헬리콥터로, 폴란드에서 SM-1이라는 명칭으로 생산되었습니다."
 FRA_transport_plane2: "C-160R"
 GER_Strike_fighter2_short: "토네이도 IDS"
 GER_Strike_fighter3_Short: "타이푼 DSM"
 GER_naval_plane2_short: "토네이도 RECCE"
 GER_awacs_equipment_1: "보잉 E-3A 센트리"
 GER_awacs_equipment_1_desc: "보잉 E-3A 센트리는 보잉이 개발한 공중 조기경보통제(AEW&C) 항공기입니다. E-3는 흔히 AWACS(공중 경보 통제 체계)로 알려져 있습니다. 보잉 707 여객기에서 파생된 이 기체는 장거리 전천후 감시, 지휘, 통제, 통신 기능을 제공합니다."
 GER_cv_awacs_equipment_1: "P-3C 오리온"
 GER_cv_awacs_equipment_1_desc: ""
 GER_cv_awacs_equipment_2: "P-3C/W"
 GER_cv_awacs_equipment_2_desc: ""
 light_tank_equipment_0: "경전차 1965"
 light_tank_equipment_1: "경전차 1975"
 light_tank_equipment_2: "경전차 1995"
 light_tank_equipment_3: "경전차 2015"
 light_tank_equipment_4: "경전차 2035"
 BSH_Anti_Air_0: "9K32 스트렐라-2"
 BSH_Anti_Air_0_desc: "냉전 초기에 비례 항법 방식을 이용해 미국의 핵폭격기를 포착하고 파괴하도록 설계되었습니다. 3,700~4,200m의 표적을 타격할 수 있는 가장 기본적인 대공 무기 중 하나입니다."
 BSH_Anti_Air_1: "9K38 이글라"
 BSH_Anti_Air_1_desc: "이글라는 스트렐라의 더 현대적인 후속 모델로, 2004년 러시아가 배치했습니다. 스트렐라보다 훨씬 뛰어난 이중 파장대 적외선(S형) 유도 장치를 사용합니다."
 BSH_Anti_Air_2: "9K38 이글라-S"
 BSH_Anti_Air_2_desc: "가장 최신 파생형으로, 사거리 연장, 더 민감한 탐색기, 최신 대응 수단에 대한 향상된 저항력, 더 무거운 탄두를 갖춘 대폭 개량형입니다. 제조사는 명중률이 0.8~0.9라고 보고합니다."
 BSH_Anti_Air_3: "9K42"
 BSH_Anti_Air_4: "9K48"
 BSH_APC_1: "BTR-60"
 BSH_APC_1_desc: "One of the oldest vehicles still in service, the BTR-60 has a 14.5mm KPVT heavy machine gun with 500 rounds. The secondary weapon is a 7.62mm PKT coaxial machine gun with 2,000 rounds. Great for light infantry movements, and QRFs."
 BSH_APC_1_short: "BTR-60"
 BSH_APC_2: "MT-LB"
 BSH_APC_2_desc: "1970년대에 만들어진 장비입니다. 싸고 빠르게 만들어졌으며, 소형 대공화기나 대보병용으로 운용했습니다."
 BSH_APC_2_short: "MT-LB"
 BSH_APC_3: "BTR-70"
 BSH_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 BSH_APC_3_short: "BTR-70"
 BSH_APC_4: "BTR-80"
 BSH_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 BSH_APC_4_short: "BTR-80"
 BSH_APC_5: "BTR-90"
 BSH_APC_5_desc: "테러리스트와 싸우기 위해 1994년에 생산되었습니다. 강력한 무기인 30mm 시퍼노브 2A42 포를 500발의 포탄과 함께 장착하고 있습니다."
 BSH_APC_5_short: "BTR-90"
 BSH_APC_6: "K-16 Bumerang"
 BSH_APC_6_desc: "A wheeled amphibious armoured personnel carrier on the Bumerang platform, shown in 2015. A remote weapon station with a 12.7mm Kord machine gun keeps the crew under armour, and the rear ramp lets the infantry dismount quickly."
 BSH_APC_6_short: "K-16 Bumerang"
 BSH_APC_7: "쿠르가네츠-35"
 BSH_APC_7_desc: "주로 보병전투차인 25형과 마찬가지로, 장갑차인 35형은 병력 12명을 수송할 수 있으며 보병전투차 작전에서 25형과 거의 같은 역할을 수행합니다."
 BSH_APC_7_short: "쿠르가네츠-35"
 BSH_APC_8: "쿠르가네츠-45"
 BSH_APC_8_desc: "이 초대형 장갑차에 대해서는 알려진 바가 많지 않으나, 40mm 포를 탑재하고 병력 12명을 수송할 수 있습니다."
 BSH_APC_8_short: "쿠르가네츠-45"
 BSH_Heavy_Anti_tank_1: "BRDM-2 9P148 Konkurs"
 BSH_Heavy_Anti_tank_1_desc: "Used in many wars and on many vehicles. The effective range is 500-3,000m."
 BSH_Heavy_Anti_tank_2: "MTLB 콘쿠르스"
 BSH_Heavy_Anti_tank_3: "Kornet-E"
 BSH_Heavy_Anti_tank_4: "Kornet-DM"
 BSH_IFV_1: "BMP-1"
 BSH_IFV_1_desc: "BMP-1은 소련제 수륙양용 궤도형 보병 전투 차량입니다. 소련-아프가니스탄 전쟁에서 병력 수송 및 지하디스트와의 전투에 사용되었습니다. 73mm 2A28 주포와 대전차 미사일 발사기를 장착하고 있습니다."
 BSH_IFV_1_short: "BMP-1"
 BSH_IFV_2: "BMP-2"
 BSH_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 BSH_IFV_2_short: "BMP-2"
 BSH_IFV_3: "BMP-2M"
 BSH_IFV_3_short: "BMP-2M"
 BSH_IFV_4: "BMP-3"
 BSH_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량입니다. 100mm 포로 고폭탄을 발사합니다."
 BSH_IFV_4_short: "BMP-3"
 BSH_IFV_5: "BMP-3M"
 BSH_IFV_5_desc: "BMP-3M은 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량인 동시에 BMP-3의 개량형입니다. 포와 엔진을 향상시켰습니다."
 BSH_IFV_5_short: "BMP-3M"
 BSH_IFV_6: "T-15 아르마타"
 BSH_IFV_6_desc: ""
 BSH_IFV_6_short: "T-15"
 BSH_IFV_7: "T-15M"
 BSH_IFV_7_short: "T-15M"
 BSH_IFV_8: "T-16"
 BSH_IFV_8_short: "T-16"
 BSH_Anti_tank_1: "RPG-7"
 BSH_Anti_tank_1_desc: "Used in many wars and on many vehicles."
 BSH_Anti_tank_2: "AT-4 Fagot"
 BSH_Anti_tank_2_desc: "Much lighter than the other ATGM-systems, and older. This ATGM can only hit at 70-2,500 m which compared to others is much lesser range than the others but also cheaper."
 BSH_Anti_tank_3: "9M133M Kornet-M"
 BSH_Anti_tank_4: "9M134M Bulat-M"
 BSH_MBT_1: "T-55"
 BSH_MBT_1_desc: "T-54/55는 아마 세계에서 가장 많이 생산된 전차일 것입니다. 냉전 초기에 설계되어 생산된 이 전차는 붉은 군대의 위력이자 근간이었습니다. 한때 러시아의 위력을 상징하며 두려움의 대상이었으나, 이제는 미국의 공습 속에서 파괴되는 중동 기갑 전력의 상징적인 모습이 되었습니다."
 BSH_MBT_1_short: "T-55"
 BSH_MBT_2: "T-72"
 BSH_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 BSH_MBT_2_short: "T-72"
 BSH_MBT_3: "T-80"
 BSH_MBT_3_desc: "200만 달러짜리 이 전차이자 전장의 야수는 T-72와 같은 주포에 추가 장갑과 코브라 대전차 유도 미사일을 갖추었습니다."
 BSH_MBT_3_short: "T-80"
 BSH_MBT_4: "T-90"
 BSH_MBT_4_desc: "최대한의 화력과 효율을 위해 3문 포 체계로 무장했습니다. 125mm 포 발사 장치 3문을 갖추고 있습니다."
 BSH_MBT_4_short: "T-90"
 BSH_MBT_5: "T-14 아르마타"
 BSH_MBT_5_desc: "매끈한 외형과 강력한 152mm 포를 갖춘 러시아군에서 가장 진보한 주력전차입니다."
 BSH_MBT_5_short: "T-14"
 BSH_MBT_7: "T-14M"
 BSH_MBT_7_short: "T-14M"
 BSH_MBT_8: "T-99 블랙이글"
 BSH_MBT_8_short: "T-99"
 BSH_mbt_equipment_0: "T-62"
 BSH_mbt_equipment_1: "T-72"
 BSH_mbt_equipment_2: "T-90"
 BSH_mbt_equipment_3: "T-14"
 BSH_mbt_equipment_4: "T-24"
 BSH_Rec_tank_0: "PT-76"
 BSH_Rec_tank_0_desc: "이 초고속 수륙양용 경전차는 강 건너에서 적 진지에 몰래 접근하여 지옥을 쏟아낼 수 있습니다. 76.2mm D-56T 강선포를 장비합니다."
 BSH_Rec_tank_0_short: "PT-76"
 BSH_Rec_tank_1: "2S25 Sprut-SD"
 BSH_Rec_tank_1_desc: "자주 수륙양용 구축전차로, 이 차량은 적 전차에 몰래 접근하여 T-72-80이 장비한 125mm 포를 발사할 수 있습니다."
 BSH_Rec_tank_1_short: "2S25 Sprut-SD"
 BSH_Rec_tank_2: "BMPT 터미네이터"
 BSH_Rec_tank_2_desc: "아마도 지금까지 만들어진 가장 치명적인 유리 대포 중 하나일 것입니다. 탱크에 대항할 수는 없지만 기둥 전체를 파괴할 수 있습니다. 4개의 130mm 발사대와 2개의 30mm 기관포를 갖추고 있습니다."
 BSH_Rec_tank_2_short: "BMPT 터미네이터"
 BSH_Rec_tank_3: "K-18 부메랑"
 BSH_Rec_tank_3_desc: "부메랑은 처음에는 현대 러시아군을 위한 비용 효율적인 장갑차이자 보병전투차로 공개되었습니다. 그러나 부메랑은 2018년에 세부 사항이 공개된 125mm 포를 장착한 전용 대전차 플랫폼으로도 쓰일 것입니다. 미국의 스트라이커 MGS와 마찬가지로, 부메랑 역시 BMPT처럼 화력 지원 차량 역할을 수행할 것입니다."
 BSH_Rec_tank_4: "경전차 2025"
 BSH_Rec_tank_4_short: "경전차 2025"
 BSH_Rec_tank_5: "경전차 2035"
 BSH_Rec_tank_5_short: "경전차 2035"
 BSH_SP_Anti_Air_0: "ZSU-23-4 실카"
 BSH_SP_Anti_Air_1: "9K35 스트렐라-10"
 BSH_SP_Anti_Air_2: "2K22 퉁구스카"
 BSH_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 BSH_SP_Anti_Air_3: "판치르-S1M"
 BSH_SP_Anti_Air_4: "판치르-S4L"
 BSH_SP_R_arty_0: "BM-21 그라드"
 BSH_SP_R_arty_0_desc: "현대 작전에서는 거의 쓰이지 않지만, SAMS와 MLRS의 조상격인 이 무기는 주로 제2차 세계 대전과 아프가니스탄에서 사용되었습니다. 사거리 20km에서 효과적입니다."
 BSH_SP_R_arty_1: "BM-30 스메르치"
 BSH_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 BSH_SP_R_arty_2: "9A52-4 토르나도"
 BSH_SP_R_arty_2_desc: "대처하지 않으면 도시 전체를 파괴할 수 있는 극도로 강력한 중포 부대입니다. 최대 사거리는 90km입니다."
 BSH_SP_arty_0: "2S1 Gvozdika"
 BSH_SP_arty_0_desc: "2S1 그보즈디카는 MT-LBu 다목적 차체를 기반으로 122mm 2A18 곡사포를 탑재한 소련의 자주 곡사포입니다. \\"2S1\\"은 GRAU 명칭입니다. 러시아식 대체 명칭은 SAU-122이지만 러시아군에서는 흔히 그보즈디카로 불립니다."
 BSH_SP_arty_1: "2S3 아카치야"
 BSH_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 BSH_SP_arty_2: "2S19M2 므스타-S"
 BSH_SP_arty_2_desc: "2S19 므스타-S는 냉전 말기에 개발되었으며, 신기술을 도입하여 전작보다 사거리가 늘어났습니다."
 BSH_SP_arty_3: "2S35 코알리치야-SV"
 BSH_SP_arty_3_desc: "2S35는 광범위한 자동화, 자동 포탄 종류 선택, 통합 지휘통제 체계를 갖춘 진정한 21세기 포병 플랫폼입니다."
 BSH_SP_arty_4: "2S38 코알리치야-M"
 BSH_artillery_1: "D-30"
 BSH_artillery_1_desc: "소련이 많은 전쟁에서 사용한 122mm 견인포 부대입니다. 사거리는 15~25km입니다."
 BSH_artillery_2: "2A65 Msta-B"
 BSH_artillery_3: "D-40"
 BSH_artillery_4: "D-50"
 BSH_util_vehicle_1: "ZIL-131"
 BSH_util_vehicle_1_desc: "전 세계 많은 군대가 사용하는 군수 트럭이자 병력 수송차입니다."
 BSH_util_vehicle_2: "우랄-4320"
 BSH_util_vehicle_2_desc: "전 세계 많은 군대가 사용하는 군수 트럭이자 병력 수송차입니다."
 BSH_util_vehicle_3: "KamAZ-4310"
 BSH_util_vehicle_3_desc: "전 세계 많은 군대가 사용하는 군수 트럭이자 병력 수송차입니다."
 BSH_util_vehicle_4: "KamAZ-4350"
 BSH_util_vehicle_4_desc: "볼크와 마찬가지로 병력 8명을 수송할 수 있으며 상부에 중기관총도 탑재할 수 있습니다. 호송대의 선도 차량으로 쓰입니다."
 BSH_util_vehicle_5: "GAZ 티그르"
 BSH_util_vehicle_5_desc: "이 장갑 병력 수송차는 다양한 무기로 무장할 수 있으며 최대 11명을 수송할 수 있습니다."
 BSH_util_vehicle_6: "VPK-3927 볼크"
 BSH_util_vehicle_6_desc: "VPK는 2+8명을 수송할 수 있습니다. STANAG 4569 3등급 장갑을 갖추었습니다. 특수부대와 경찰 병력에 적합합니다."
 BSH_util_vehicle_7: "Z-STS 아흐마트"
 BSH_util_vehicle_7_desc: "Z-STS 아흐마트는 3축 전륜구동 차체인 카마즈-5350을 기반으로 제작되었습니다. 기동성과 주행 능력이 뛰어나며 운용이 복잡하지도 않습니다. 흥미롭게도 이 장갑차는 일반 트럭과 달리 보닛형 구조로 제작되었습니다. 덕분에 승무원 좌석을 뒤쪽으로 옮겨 안전성을 높일 수 있었습니다."
 CRM_Anti_Air_0: "9K32 스트렐라-2"
 CRM_Anti_Air_0_desc: "냉전 초기에 비례 항법 방식을 이용해 미국의 핵폭격기를 포착하고 파괴하도록 설계되었습니다. 3,700~4,200m의 표적을 타격할 수 있는 가장 기본적인 대공 무기 중 하나입니다."
 CRM_Anti_Air_1: "9K38 이글라"
 CRM_Anti_Air_1_desc: "이글라는 스트렐라의 더 현대적인 후속 모델로, 2004년 러시아가 배치했습니다. 스트렐라보다 훨씬 뛰어난 이중 파장대 적외선(S형) 유도 장치를 사용합니다."
 CRM_Anti_Air_2: "9K38 이글라-S"
 CRM_Anti_Air_2_desc: "더 긴 사거리, 더 민감한 시커, 최신 대응책에 대한 향상된 저항 및 더 무거운 탄두를 갖춘 실질적으로 개선된 변종인 최신 변종입니다. 제조업체 보고에 따르면 적중 확률은 0.8–0.9입니다."
 CRM_Anti_Air_3: "9K42"
 CRM_Anti_Air_4: "9K48"
 CRM_APC_1: "BTR-60"
 CRM_APC_1_desc: "One of the oldest vehicles still in service, the BTR-60 has a 14.5mm KPVT heavy machine gun with 500 rounds. The secondary weapon is a 7.62mm PKT coaxial machine gun with 2,000 rounds. Great for light infantry movements, and QRFs."
 CRM_APC_1_short: "BTR-60"
 CRM_APC_2: "MT-LB"
 CRM_APC_2_desc: "MT-LB는 1970년대에 만들어졌습니다. 저렴하고 빠르게 제작된 소련은 가벼운 대공 및 보병 전투에 사용했습니다."
 CRM_APC_2_short: "MT-LB"
 CRM_APC_3: "BTR-70"
 CRM_APC_3_desc: "BTR-70은 1972년 소련-아프가니스탄 전쟁에서 군대를 이동시켜 화력을 지원하는데 사용되었습니다. BTR-60과의 유일한 차이점은 장갑이 더 무겁다는 점입니다."
 CRM_APC_3_short: "BTR-70"
 CRM_APC_4: "BTR-80"
 CRM_APC_4_desc: "BTR-80은 8륜 수륙양용 병력 수송 장갑차(APC)로 소련에서 개발되었습니다. 1986년 배치되기 시작하여 이전의 차량인 BTR-60, BTR70들을 대체하기 시작했습니다. 아프가니스탄전에서 처음 그 실력을 발휘했습니다."
 CRM_APC_4_short: "BTR-80"
 CRM_APC_5: "BTR-90"
 CRM_APC_5_desc: "테러리스트와 싸우기 위해 1994년에 생산되었습니다. 강력한 무기인 30mm 시퍼노브 2A42 포를 500발의 포탄과 함께 장착하고 있습니다."
 CRM_APC_5_short: "BTR-90"
 CRM_APC_6: "K-16 Bumerang"
 CRM_APC_6_desc: "A wheeled amphibious armoured personnel carrier on the Bumerang platform, shown in 2015. A remote weapon station with a 12.7mm Kord machine gun keeps the crew under armour, and the rear ramp lets the infantry dismount quickly."
 CRM_APC_6_short: "K-16 Bumerang"
 CRM_APC_7: "쿠르가네츠-35"
 CRM_APC_7_desc: "주로 보병전투차인 25형과 마찬가지로, 장갑차인 35형은 병력 12명을 수송할 수 있으며 보병전투차 작전에서 25형과 거의 같은 역할을 수행합니다."
 CRM_APC_7_short: "쿠르가네츠-35"
 CRM_APC_8: "쿠르가네츠-45"
 CRM_APC_8_desc: "이 초대형 장갑차에 대해서는 알려진 바가 많지 않으나, 40mm 포를 탑재하고 병력 12명을 수송할 수 있습니다."
 CRM_APC_8_short: "쿠르가네츠-45"
 CRM_Heavy_Anti_tank_1: "BRDM-2 9P148 콘쿠르스"
 CRM_Heavy_Anti_tank_1_desc: "많은 전쟁과 많은 차량에서 사용되었습니다. 유효 사거리는 500~3,000m입니다."
 CRM_Heavy_Anti_tank_2: "MTLB 콘쿠르스"
 CRM_Heavy_Anti_tank_3: "코르넷-E"
 CRM_Heavy_Anti_tank_4: "코르넷-DM"
 CRM_IFV_1: "BMP-1"
 CRM_IFV_1_desc: "BMP-1은 소련제 수륙양용 궤도형 보병 전투 차량입니다. 소련-아프가니스탄 전쟁에서 병력 수송 및 지하디스트와의 전투에 사용되었습니다. 73mm 2A28 주포와 대전차 미사일 발사기를 장착하고 있습니다."
 CRM_IFV_1_short: "BMP-1"
 CRM_IFV_2: "BMP-2"
 CRM_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 CRM_IFV_2_short: "BMP-2"
 CRM_IFV_3: "BMP-2M"
 CRM_IFV_3_short: "BMP-2M"
 CRM_IFV_4: "BMP-3"
 CRM_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량입니다. 100mm 포로 고폭탄을 발사합니다."
 CRM_IFV_4_short: "BMP-3"
 CRM_IFV_5: "BMP-3M"
 CRM_IFV_5_desc: "BMP-3M은 소련의 보병 전투 차량(IFV)로 BMP-1과 BMP-2를 계승하는 차량인 동시에 BMP-3의 개량형입니다. 포와 엔진을 향상시켰습니다."
 CRM_IFV_5_short: "BMP-3M"
 CRM_IFV_6: "T-15 아르마타"
 CRM_IFV_6_desc: ""
 CRM_IFV_6_short: "T-15"
 CRM_IFV_7: "T-15M"
 CRM_IFV_7_short: "T-15M"
 CRM_IFV_8: "T-16"
 CRM_IFV_8_short: "T-16"
 CRM_Anti_tank_1: "RPG-7"
 CRM_Anti_tank_1_desc: "Used in many wars and on many vehicles."
 CRM_Anti_tank_2: "AT-4 Fagot"
 CRM_Anti_tank_2_desc: "Much lighter than the other ATGM-systems, and older. This ATGM can only hit at 70-2,500 m which compared to others is much lesser range than the others but also cheaper."
 CRM_Anti_tank_3: "9M133M Kornet-M"
 CRM_Anti_tank_4: "9M134M Bulat-M"
 CRM_MBT_1: "T-55"
 CRM_MBT_1_desc: "The T-54/55 is perhaps the most produced tank in the world. Designed and produced in the early years of the Cold War, it was the might and the backbone of the Red Army. Once feared as a symbol of the Russian might, it has become the iconic representation of Middle-Eastern armoured forces getting destroyed in the wake of an American air strike."
 CRM_MBT_1_short: "T-55"
 CRM_MBT_2: "T-72"
 CRM_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 CRM_MBT_2_short: "T-72"
 CRM_MBT_3: "T-80"
 CRM_MBT_3_desc: "200만 달러짜리 이 전차이자 전장의 야수는 T-72와 같은 주포에 추가 장갑과 코브라 대전차 유도 미사일을 갖추었습니다."
 CRM_MBT_3_short: "T-80"
 CRM_MBT_4: "T-90"
 CRM_MBT_4_desc: "최대한의 화력과 효율을 위해 3문 포 체계로 무장했습니다. 125mm 포 발사 장치 3문을 갖추고 있습니다."
 CRM_MBT_4_short: "T-90"
 CRM_MBT_5: "T-14 아르마타"
 CRM_MBT_5_desc: "매끈한 외형과 강력한 152mm 포를 갖춘 러시아군에서 가장 진보한 주력전차입니다."
 CRM_MBT_5_short: "T-14"
 CRM_MBT_7: "T-14M"
 CRM_MBT_7_short: "T-14M"
 CRM_MBT_8: "T-99 블랙이글"
 CRM_MBT_8_short: "T-99"
 CRM_mbt_equipment_0: "T-62"
 CRM_mbt_equipment_1: "T-72"
 CRM_mbt_equipment_2: "T-90"
 CRM_mbt_equipment_3: "T-14"
 CRM_mbt_equipment_4: "T-24"
 CRM_Rec_tank_0: "PT-76"
 CRM_Rec_tank_0_desc: "이 초고속 수륙 양용 경전차는 강 건너편에서 적진으로 몰래 접근하여 지옥의 짐을 내릴 수 있습니다. 76.2mm D-56T 강선 전차포를 사용합니다."
 CRM_Rec_tank_0_short: "PT-76"
 CRM_Rec_tank_1: "2S25 Sprut-SD"
 CRM_Rec_tank_1_desc: "자주식 수륙양용 구축전차인 이 차량은 적 탱크에 몰래 접근하여 t-72-80이 탑재하는 125mm 대포를 발사할 수 있습니다."
 CRM_Rec_tank_1_short: "2S25 Sprut-SD"
 CRM_Rec_tank_2: "BMPT 터미네이터"
 CRM_Rec_tank_2_desc: "아마도 지금까지 만들어진 가장 치명적인 유리 대포 중 하나일 것입니다. 탱크에 대항할 수는 없지만 기둥 전체를 파괴할 수 있습니다. 4개의 130mm 발사대와 2개의 30mm 기관포를 갖추고 있습니다."
 CRM_Rec_tank_2_short: "BMPT 터미네이터"
 CRM_Rec_tank_3: "K-18 부메랑"
 CRM_Rec_tank_3_desc: "부메랑은 처음에는 현대 러시아군을 위한 비용 효율적인 장갑차이자 보병전투차로 공개되었습니다. 그러나 부메랑은 2018년에 세부 사항이 공개된 125mm 포를 장착한 전용 대전차 플랫폼으로도 쓰일 것입니다. 미국의 스트라이커 MGS와 마찬가지로, 부메랑 역시 BMPT처럼 화력 지원 차량 역할을 수행할 것입니다."
 CRM_Rec_tank_4: "경전차 2025"
 CRM_Rec_tank_4_short: "경전차 2025"
 CRM_Rec_tank_5: "경전차 2035"
 CRM_Rec_tank_5_short: "경전차 2035"
 CRM_SP_Anti_Air_0: "ZSU-23-4 실카"
 CRM_SP_Anti_Air_1: "9K35 스트렐라-10"
 CRM_SP_Anti_Air_2: "2K22 퉁구스카"
 CRM_SP_Anti_Air_2_desc: "최대 8발의 미사일을 발사할 수 있는 이 기체는 접근하는 모든 항공기를 격추할 수 있습니다. 뿐만 아니라 자동포로 수송기도 파괴할 수 있습니다."
 CRM_SP_Anti_Air_3: "판치르-S1M"
 CRM_SP_Anti_Air_4: "판치르-S4L"
 CRM_SP_R_arty_0: "BM-21 그라드"
 CRM_SP_R_arty_0_desc: "현대 작전에서는 거의 쓰이지 않지만, SAMS와 MLRS의 조상격인 이 무기는 주로 제2차 세계 대전과 아프가니스탄에서 사용되었습니다. 사거리 20km에서 효과적입니다."
 CRM_SP_R_arty_1: "BM-30 스메르치"
 CRM_SP_R_arty_1_desc: "이 차량은 그라드 전차의 현대화된 버전입니다. 눈, 얼음, 사막 등 세계 어디든 갈 수 있으며, 유효 사거리는 35km입니다."
 CRM_SP_R_arty_2: "9A52-4 토르나도"
 CRM_SP_R_arty_2_desc: "대처하지 않으면 도시 전체를 파괴할 수 있는 극도로 강력한 중포 부대입니다. 최대 사거리는 90km입니다."
 CRM_SP_arty_0: "2S1 Gvozdika"
 CRM_SP_arty_0_desc: "2S1 그보즈디카는 MT-LBu 다목적 차체를 기반으로 122mm 2A18 곡사포를 탑재한 소련의 자주 곡사포입니다. \\"2S1\\"은 GRAU 명칭입니다. 러시아식 대체 명칭은 SAU-122이지만 러시아군에서는 흔히 그보즈디카로 불립니다."
 CRM_SP_arty_1: "2S3 아카치야"
 CRM_SP_arty_1_desc: "필요하다면 태양도 쏠 수 있을 만큼 강력한 152.4mm D-22 대포로 무장한 이 포병대는 사거리가 50km에 달하는 놀라운 화력을 자랑합니다."
 CRM_SP_arty_2: "2S19M2 므스타-S"
 CRM_SP_arty_2_desc: "2S19 므스타-S는 냉전 말기에 개발되었으며, 신기술을 도입하여 전작보다 사거리가 늘어났습니다."
 CRM_SP_arty_3: "2S35 코알리치야-SV"
 CRM_SP_arty_3_desc: "2S35는 광범위한 자동화, 자동 포탄 종류 선택, 통합 지휘통제 체계를 갖춘 진정한 21세기 포병 플랫폼입니다."
 CRM_SP_arty_4: "2S38 코알리치야-M"
 CRM_artillery_1: "D-30"
 CRM_artillery_1_desc: "소련이 많은 전쟁에서 사용한 122mm 견인포 부대입니다. 사거리는 15~25km입니다."
 CRM_artillery_2: "2A65 Msta-B"
