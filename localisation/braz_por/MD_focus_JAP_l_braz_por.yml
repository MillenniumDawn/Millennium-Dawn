 senbu_occupation_law_fake_idea: "Administração de Pacificação Senbu"
 senbu_occupation_law_fake_idea_desc: "Oficiais de assuntos civis governam os distritos ocupados por meio de notáveis locais em vez de comandantes de guarnição, restaurando mercados, escolas e distribuição de arroz antes de exigir produção. A conformidade cresce de forma constante e a exigência de guarnição permanece baixa, mas a mão leve dá mais espaço à resistência organizada do que um regime punitivo daria."
 JAP_sabotaged_russians: "Instalações Russas Sabotadas"
 JAP_usa_trade_pressure: "Pressão Comercial Americana"
 JAP_article_nine_balance_of_power_category: "Artigo Nono"
 JAP_article_nine_balance_of_power_category_desc: "A renúncia à guerra no Artigo Nono da constituição não é uma questão resolvida, mas uma discussão contínua entre o gabinete, os tribunais, a aliança americana e o público. Cada reinterpretação desloca o equilíbrio entre uma postura estritamente defensiva e um exército normal."
 JAP_cool_japan_doctrine_desc: "O design japonês não é estranho por não ter atendido a um padrão estrangeiro. É estranho porque foi feito para consumidores japoneses por pessoas que jamais consideraram a alternativa, e é justamente isso que o torna digno de compra. O ministério deixa de empacotar a cultura como vitrine para o hardware e passa a exportar a própria diferença.\n\n§REste caminho mantém §Y$JAP_galapagos_syndrome$§! permanentemente.§! Somente §Y$JAP_world_integration$§! a remove, e os dois são mutuamente exclusivos: o Japão ou converge para os padrões do mundo, ou vende ao mundo os seus próprios."
 JAP_galapagos_sphere_modifier: "Esfera Cultural"
 JAP_galapagos_sphere_modifier_desc: "O ministério faz uma contagem trimestral dos países onde a influência japonesa é de vinte por cento ou mais e trata o total como um número de exportação por si só. Cada país da lista amplia o público que já compra design japonês sem que lhe peçam para entendê-lo primeiro, o que vale algo para as delegações comerciais e ainda mais para as empresas que vêm atrás delas. A contagem é feita uma vez por trimestre e o rendimento acompanha o resultado. Uma esfera que para de crescer para de render."
 JAP_galapagos_sphere_tt: "§YEsfera Cultural§!: [?JAP_galapagos_sphere_count|Y0] países com §G20%§! ou mais de influência japonesa, contados a cada trimestre depois que a §YDoutrina Cool Japan§! é adotada. O rendimento aumenta em metade com §Y$JAP_electronics_superpower$§! e em mais um quarto com §Y$JAP_home_electronics$§!."
 JAP_cool_japan_sphere_payout_tt: "A cada trimestre, o ministério conta os países onde a §Yinfluência§! japonesa é de §G20%§! ou mais e informa o total como a §YEsfera Cultural§!. Cada um acrescenta §G+1%§! de §Yinfluência externa§! e §G+0,2%§! de §Yretorno sobre investimento§!, pagos por meio da §YEsfera Cultural§! e crescendo conforme a esfera se amplia. §Y$JAP_electronics_superpower$§! eleva o rendimento em mais metade, e §Y$JAP_home_electronics$§! o eleva em mais um quarto.\n-------------\nIsso não afeta a §YDeriva da Pesquisa§!. A doutrina compra alcance no exterior; ela não fecha a lacuna de padrões dentro do país."
 JAP_creative_industries_office: "Escritório de Promoção das Indústrias Criativas"
 JAP_creative_industries_office_desc: "O Ministério da Economia, Comércio e Indústria cria o Escritório de Promoção das Indústrias Criativas para tratar animação, design, moda e gastronomia como setores de exportação, e não como cultura. O Fundo Cool Japan vem em seguida, com cinquenta bilhões de ienes e o mandato de coinvestir em vez de subsidiar, entrando em redes de varejo no exterior, plataformas de streaming asiáticas e empreendimentos de distribuição que nenhum conselho japonês aprovaria sozinho. Burocratas são péssimos capitalistas de risco e o Fundo acumula anos de prejuízo, mas absorve a primeira perda dos projetos que o capital privado depois segue."
 JAP_visit_japan_campaign: "Campanha Visit Japan"
 JAP_visit_japan_campaign_desc: "A Campanha Visit Japan é relançada em torno de uma meta em que nenhum ministério acredita: quarenta milhões de visitantes estrangeiros por ano. O governo flexibiliza o regime de vistos para viajantes asiáticos, isenta cosméticos e medicamentos do imposto sobre consumo no caixa e promove o país justamente pelo que nele não se traduz. Nada no Japão é tornado menos japonês para ser vendido."
 JAP_content_export_offensive: "Ofensiva de Exportação de Conteúdo"
 JAP_content_export_offensive_desc: "A Lei Básica de Propriedade Intelectual e a Lei de Promoção de Conteúdo elevam animação, jogos e mangá à condição de ativos estratégicos por lei, e a indústria ainda trata seu público estrangeiro como pirataria a ser tolerada enquanto tradutores amadores fazem a distribuição. O governo constrói o canal legal em vez disso: lançamento simultâneo, legendagem profissional e detentores de direitos que negociam em bloco, e não um estúdio por vez. O mercado externo já é a maior metade da receita do anime, e quase nada dela está sendo arrecadado."
 JAP_washoku_to_the_world: "Washoku para o Mundo"
 JAP_washoku_to_the_world_desc: "Com o washoku inscrito na lista de Patrimônio Cultural Imaterial da UNESCO, o governo promove não um prato, mas uma prática: o ingrediente da estação, a disposição, a mesa de Ano Novo. O primeiro instinto do ministério foi fiscalizá-lo, e o plano de certificar restaurantes japoneses autênticos no exterior foi abandonado quando a imprensa estrangeira o apelidou de polícia do sushi. Rolinhos californianos e o lámen de Bangcoc vendem mais arroz, shoyu e saquê japoneses do que qualquer inspetoria jamais venderia, e a meta de exportação de um trilhão de ienes se apoia nesse comércio."
 JAP_japan_house_network: "A Rede Japan House"
 JAP_japan_house_network_desc: "O Programa JET enviou milhares de jovens estrangeiros a escolas e prefeituras japonesas e os devolveu a seus países fluentes, e eles agora ocupam ministérios das relações exteriores, escritórios de advocacia e redações. A Japan House dá a essa rede uma porta de entrada: uma galeria, uma biblioteca, uma loja e um restaurante numa rua cara de São Paulo, Los Angeles e Londres, administrados pelo Ministério das Relações Exteriores e deliberadamente livres de bandeiras e declarações políticas. As inscrições nos cursos de língua japonesa triplicaram em cada cidade depois da abertura."
 JAP_gross_national_cool: "Cool Nacional Bruto"
 JAP_gross_national_cool_desc: "A Síndrome de Galápagos permanece: as especificações continuam japonesas e a deriva da pesquisa prossegue. O que os ministérios construíram em seu lugar é um país que lucra no exterior com o que só ele sabe fazer: os estúdios, as cozinhas, as produtoras de jogos, os escritórios de design e os milhões que chegam todo ano simplesmente para olhar. O isolamento nunca foi curado, apenas posto para trabalhar."
 JAP_cool_japan_spirit_kept_tt: "A §YSíndrome de Galápagos§! §Rpermanece em vigor§!. O Japão escolheu vender sua diferença em vez de curá-la"
 JAP_electronics_anchor_bonus_tt: "§YSuperpotência Eletrônica§!: o hardware japonês leva o conteúdo japonês a todos os mercados, e o retorno cresce com isso"
 JAP_world_integration: "Integração com o Mundo"
 JAP_world_integration_desc: "O Japão deixa de ser uma ilha. Os padrões são reescritos segundo o rascunho de outros, as tabelas tarifárias caem, os ministérios param de perguntar se uma oferta estrangeira é apropriada, e o capital que passou trinta anos contornando este país começa a entrar nele. O que se entrega é a própria proteção: o mercado cativo que barateava os bens de consumo e o muro contra a influência estrangeira que nenhum rival jamais escalou, e as empresas japonesas agora precisam conquistar um mercado que antes lhes pertencia."
 JAP_structural_reform_zones: "Zonas Especiais de Reforma Estrutural"
 JAP_structural_reform_zones_desc: "Em vez de discutir o código regulatório linha por linha com os ministérios que o escreveram, o governo permite que uma província ou cidade peça isenção de uma regra e depois prove que o céu não cai. Agricultores fabricam bebida abaixo do volume mínimo nacional, sociedades anônimas administram escolas e arrendam terras agrícolas, e as Zonas Especiais Estratégicas Nacionais aplicam o mesmo instrumento a Tóquio nas finanças, a Fukuoka nas regras de emprego para startups e a Kansai nos testes médicos. É desregulamentação no varejo, e não no atacado, e é o único método que de fato já moveu alguma coisa."
 JAP_corporate_governance_code: "O Código de Governança Corporativa"
 JAP_corporate_governance_code_desc: "A Revisão Ito põe um número na falha: oito por cento de retorno sobre o patrimônio é o mínimo que uma empresa japonesa precisa alcançar para valer o capital que consome, e a maioria não o alcança. O Código de Stewardship manda os fundos de pensão e as seguradoras votarem suas ações como donos, e não como convidados, e o Código de Governança Corporativa vem a seguir nos termos de cumprir ou explicar. Os diretores externos sobem para perto de um terço do conselho e as participações cruzadas começam a ser vendidas, o que não torna as empresas japonesas estrangeiras, mas legíveis para qualquer um disposto a comprar uma ação."
 JAP_economic_partnership_agreements: "Acordos de Parceria Econômica"
 JAP_economic_partnership_agreements_desc: "A agricultura detém o veto sobre a política comercial japonesa desde a guerra, e os exportadores agora perdem licitações para empresas coreanas apenas pela linha tarifária. O Japão fecha com a União Europeia o maior acordo bilateral que qualquer das partes já assinou e depois assume a presidência da Parceria Transpacífico após a saída de Washington, suspendendo as cláusulas americanas em vez de apagá-las. A RCEP vem em seguida e coloca Japão, China e Coreia do Sul num único marco comercial pela primeira vez, com o arroz protegido em todos eles."
 JAP_open_capital_markets: "Abrir os Mercados de Capitais"
 JAP_open_capital_markets_desc: "Medido contra o tamanho de sua economia, o Japão tem menos capital estrangeiro do que quase qualquer país desenvolvido, barrado pelas participações cruzadas, por balanços ilegíveis e por quarenta anos de autoridades tratando uma oferta estrangeira como um problema a ser administrado. Os reparos são pouco glamorosos e quase inteiramente administrativos: balcões Invest Japan na JETRO para conduzir uma empresa estrangeira pela abertura de capital, resultados publicados em inglês no mesmo dia em que saem em japonês e uma trilha de residência por pontos para as pessoas que uma subsidiária estrangeira precisa trazer para abrir as portas. A questão das pessoas, em sua forma completa, pertence a §Y$JAP_an_open_nation$§!, e esta é a mais restrita: se o capital consegue achar a porta."
 JAP_the_third_opening: "A Terceira Abertura"
 JAP_the_third_opening_desc: "O Japão abandona as últimas proteções que faziam dele uma economia à parte. O governo abre o mercado interno à concorrência estrangeira, reescreve seus padrões segundo rascunhos internacionais e permite que o capital estrangeiro compre participações nas mesmas condições do capital japonês. O mercado cativo e o muro contra a influência externa são ambos entregues em troca de um país que negocia como um signatário entre muitos."
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: um país que já se abriu às pessoas do mundo tem muito menos a discutir ao se abrir ao capital do mundo"
 JAP_zombie_report_credible_tt: "A investigação produziu pelo menos um §Yrelatório parcial§!"
 JAP_zombie_investigation_concluded_tt: "A investigação foi §Yconcluída§!, seja qual for o resultado"
