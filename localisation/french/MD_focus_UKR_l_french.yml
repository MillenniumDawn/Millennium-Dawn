 ukraine_praktyka_otaman_otaman_6x6_122_mission: "Prototype: §YOtaman 6x6 122§!"
 ukraine_praktyka_otaman_otaman_6x6_122_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_6x6_122_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO Praktyka§! builds a new wheeled 6x6 hull with mine protection. The first vehicle on it carries the 122 mm turret of the §Y2S1 Gvozdika§!. When the timer runs out, the prototype is ready.§!"
 ukraine_praktyka_otaman_otaman_8x8_mission: "Prototype: §YOtaman 8x8§!"
 ukraine_praktyka_otaman_otaman_8x8_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_8x8_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO Praktyka§! rebuilds the §YBTR-60§! into the §YOtaman 8x8§!: a new mine-protected hull, a rear ramp for the troops and a remote machine gun. When the timer runs out, the prototype is ready.§!"
 ukraine_praktyka_otaman_otaman_both_mission: "Prototypes: §YOtaman 6x6 122§! and §YOtaman 8x8§!"
 ukraine_praktyka_otaman_otaman_both_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_both_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO Praktyka§! works on both lines at once: the new 6x6 hull with the 122 mm turret of the §Y2S1 Gvozdika§!, and the §YOtaman 8x8§! rebuilt from the §YBTR-60§!. When the timer runs out, both prototypes are ready.§!"
 ukraine_praktyka_otaman_otaman_6x6_73_mission: "Prototype: §YOtaman 6x6 Grom§! IFV"
 ukraine_praktyka_otaman_otaman_6x6_73_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_6x6_73_for_tooltip\n\n\n\n\n\n\n\n\n§WThe same 6x6 hull gets the 73 mm turret of the §YBMP-1§!, smoke launchers and a rear ramp for the troops. When the timer runs out, the prototype is ready.§!"
 ukraine_praktyka_otaman_otaman_3_mission: "Prototype: §YOtaman-3§!"
 ukraine_praktyka_otaman_otaman_3_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_3_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YOtaman-3§! is an infantry fighting vehicle for our marines. It carries the §YBM-3M Shturm-M§! combat module with a 30 mm cannon and Barrier missiles. When the timer runs out, the prototype is ready.§!"
 ukraine_praktyka_otaman_otaman_8x8_shturm_mission: "Prototype: §YOtaman 8x8 Shturm-M§!"
 ukraine_praktyka_otaman_otaman_8x8_shturm_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_8x8_shturm_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YOtaman 8x8§! gets the §YBM-3M Shturm-M§! combat module with a 30 mm cannon and Barrier missiles, which turns it into an infantry fighting vehicle. When the timer runs out, the prototype is ready.§!"
 ukraine_praktyka_otaman_khorunzhyi_mission: "Turkish Module for the §YBTR-60M Khorunzhyi§!"
 ukraine_praktyka_otaman_khorunzhyi_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_khorunzhyi_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO Praktyka§! wants a Turkish remote machine gun module for the §YBTR-60M Khorunzhyi§!. Ankara approves the deal once §YTurkey§! has an opinion of at least §Y30§! of us. The project succeeds as soon as that happens.\n\n§RIf the timer runs out first, the project fails.§!§!"
 ukraine_praktyka_otaman.1.name: "Praktyka Proposes the Otaman"
 ukraine_praktyka_otaman.1.desc: "The war in the east needs armored vehicles that our plants can build now. The Kyiv company §YNVO Praktyka§! offers two ways to get them. It can build a new wheeled 6x6 hull, starting with a 122 mm self-propelled gun. Or it can rebuild our old §YBTR-60§! into a mine-protected 8x8 carrier. Praktyka can also do both, if we pay for both."
 ukraine_praktyka_otaman.1.a: "Build the new 6x6 hull"
 ukraine_praktyka_otaman.1.b: "Rebuild the BTR-60 into an 8x8"
 ukraine_praktyka_otaman.1.c: "Fund both lines"
 ukraine_praktyka_otaman.2.name: "Otaman 6x6 122 Presented"
 ukraine_praktyka_otaman.2.desc: "§YNVO Praktyka§! has shown the first vehicle on its new 6x6 hull: the §YOtaman 6x6 122§!, a wheeled self-propelled gun with the 122 mm turret of the §Y2S1 Gvozdika§!, mine protection and smoke launchers. Praktyka is ready to start work on an infantry fighting vehicle on the same hull."
 ukraine_praktyka_otaman.2.a: "Adopt the design without production"
 ukraine_praktyka_otaman.2.b: "Adopt the design and start production"
 ukraine_praktyka_otaman.2.c: "Pay for a production line in Kyiv"
 ukraine_praktyka_otaman.3.name: "Otaman 6x6 Grom Presented"
 ukraine_praktyka_otaman.3.desc: "The §YOtaman 6x6 Grom§! is ready. The 6x6 hull carries the 73 mm turret of the §YBMP-1§!, smoke launchers and a rear ramp that lets the troops get out quickly. Praktyka now proposes a version for our marines with a modern combat module."
 ukraine_praktyka_otaman.3.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.3.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.3.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.4.name: "Otaman-3 Presented"
 ukraine_praktyka_otaman.4.desc: "The §YOtaman-3§! for our marines is ready. Its §YBM-3M Shturm-M§! combat module carries a 30 mm cannon, a machine gun and Barrier missiles, and a thermal sight lets the crew fight at night. Our marine units can count on better protected vehicles."
 ukraine_praktyka_otaman.4.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.4.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.4.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.5.name: "Otaman 8x8 Presented"
 ukraine_praktyka_otaman.5.desc: "§YNVO Praktyka§! has rebuilt a §YBTR-60§! into the §YOtaman 8x8§!. The new hull protects the crew from mines, a rear ramp replaces the cramped side hatches, and a remote machine gun replaces the old turret."
 ukraine_praktyka_otaman.5.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.5.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.5.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.6.name: "The Future of the Otaman 8x8"
 ukraine_praktyka_otaman.6.desc: "§YNVO Praktyka§! asks where to take the §YOtaman 8x8§! next. It can expand the line with a self-propelled mortar and an infantry fighting vehicle on the same hull. Or it can keep improving the carrier itself."
 ukraine_praktyka_otaman.6.a: "Expand the line"
 ukraine_praktyka_otaman.6.b: "Improve the carrier"
 ukraine_praktyka_otaman.7.name: "Otaman 8x8 Mortar Carriers"
 ukraine_praktyka_otaman.7.desc: "Praktyka has rebuilt §Y40§! of our §YBTR-60§! into self-propelled mortar carriers on the §YOtaman 8x8§! hull. Our mortar crews can now move and fire much faster. Next, Praktyka wants to put a modern combat module on the same hull."
 ukraine_praktyka_otaman.7.a: "Good work"
 ukraine_praktyka_otaman.8.name: "Otaman 8x8 Shturm-M Presented"
 ukraine_praktyka_otaman.8.desc: "The §YOtaman 8x8 Shturm-M§! is ready. The §YBM-3M Shturm-M§! combat module with a 30 mm cannon and Barrier missiles turns the 8x8 carrier into an infantry fighting vehicle."
 ukraine_praktyka_otaman.8.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.8.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.8.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.9.name: "Improving the Otaman 8x8"
 ukraine_praktyka_otaman.9.desc: "Praktyka has two ideas for the carrier. The quick one puts the §YBRDM-2§! turret with its 14.5 mm §YKPVT§! on the §YOtaman 8x8§!. The longer one is the §YBTR-60M Khorunzhyi§!, a deeper rebuild with a Turkish remote machine gun module, which needs Ankara's approval."
 ukraine_praktyka_otaman.9.a: "Fit the KPVT turret"
 ukraine_praktyka_otaman.9.b: "Develop the Khorunzhyi"
 ukraine_praktyka_otaman.10.name: "Otaman 8x8 KPVT Presented"
 ukraine_praktyka_otaman.10.desc: "The §YOtaman 8x8 KPVT§! is ready. The §YBRDM-2§! turret gives the carrier a 14.5 mm §YKPVT§! and a coaxial machine gun, which is enough to deal with light vehicles and infantry."
 ukraine_praktyka_otaman.10.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.10.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.10.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.11.name: "BTR-60M Khorunzhyi Presented"
 ukraine_praktyka_otaman.11.desc: "Ankara has approved the deal, and §YNVO Praktyka§! has finished the §YBTR-60M Khorunzhyi§!. The rebuilt carrier has a Turkish remote machine gun module with a thermal sight, smoke launchers and a rear ramp for the troops."
 ukraine_praktyka_otaman.11.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.11.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.11.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.12.name: "Khorunzhyi Project Fails"
 ukraine_praktyka_otaman.12.desc: "Ankara has not approved the sale of its remote machine gun module, and §YNVO Praktyka§! has given up on the §YBTR-60M Khorunzhyi§!."
 ukraine_praktyka_otaman.12.a: "A pity"
