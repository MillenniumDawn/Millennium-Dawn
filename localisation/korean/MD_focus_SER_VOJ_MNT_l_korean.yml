 Montenegro.1.t: "투자를 요청하는 몬테네그로"
 Montenegro.1.d: "몬테네그로로부터 자국의 산업과 생산에 투자해 달라는 메시지를 받았습니다."
 Montenegro.1.a: "산업 단지에 투자하겠다."
 Montenegro.1.b: "아니, 그들에게는 필요 없다."
 Montenegro.2.t: "그들의 동의!"
 Montenegro.2.d: "외국 세력이 협력하기로 동의했습니다!"
 Montenegro.2.a: "몬테네그로 만세!"
 Montenegro.3.t: "그들의 거절!"
 Montenegro.3.d: "외국 세력이 거래를 거절했습니다."
 Montenegro.3.a: "나쁜 놈들!"
 Montenegro.4.t: "누가 우리에게 투자할 것인가?"
 Montenegro.4.d: "우리는 누구의 투자를 받을지 결정해야 하며, 이 거래가 판매자에게 우리나라에 대한 영향력을 부여할 수 있고 통제하지 못하면 국가 안보에 위협이 될 수 있으므로 신중해야 합니다!"
 Montenegro.4.a: "러시아가 도와줄 것이다!"
 Montenegro.4.b: "미국이여, 우리를 도와 달라!"
 Montenegro.5.t: "투자를 요청하는 몬테네그로"
 Montenegro.5.d: "몬테네그로로부터 자국의 기반시설에 투자해 달라는 메시지를 받았습니다."
 Montenegro.5.a: "물론이다."
 Montenegro.5.b: "그들이 어떻게 비용을 낼 것인가?"
 Montenegro.6.t: "보장을 요청하는 몬테네그로"
 Montenegro.6.d: "몬테네그로 외무장관이 몬테네그로 독립에 대한 우리의 보장 조건을 논의하기 위해 우리 수도에 도착했습니다."
 Montenegro.6.a: "우리의 형제는 보호받을 것이다!"
 Montenegro.6.b: "우리는 거절하겠다."
 Montenegro.7.t: "불가침 조약을 요청하는 몬테네그로"
 Montenegro.7.d: "몬테네그로 외무장관이 그들의 중립을 지지하는 불가침 조약의 조건을 논의하기 위해 우리 수도에 도착했습니다."
 Montenegro.7.a: "몬테네그로는 보호받을 것이다!"
 Montenegro.7.b: "아니, 사양하겠다"
 Montenegro.8.t: "연합 계획?"
 Montenegro.8.d: "얼마 전 해체된 세르비아-몬테네그로 연합을 재창설해 달라는 몬테네그로의 공식 요청이 베오그라드에 도착했습니다. 이 역사적인 요청을 받아들이겠습니까?"
 Montenegro.8.a: "돌아온 것을 환영한다!"
 Montenegro.8.b: "떨어져 지낸 세월이 우리를 너무 멀어지게 했군, 오랜 친구여."
 Montenegro.9.t: "총기를 요청하는 몬테네그로"
 Montenegro.9.d: "몬테네그로가 우리에게서 소형 화기 장비를 구매하도록 허가해 달라는 메시지를 보내왔습니다. 이 요청을 들어주겠습니까?"
 Montenegro.9.a: "안 될 게 뭐 있나?"
 Montenegro.9.b: "이 시간에 우리를 귀찮게 하다니, 뭘 하는 건가?"
 Montenegro.10.t: "총기를 요청하는 몬테네그로"
 Montenegro.10.d: "몬테네그로가 우리에게서 소형 화기 장비를 구매하도록 허가해 달라는 메시지를 보내왔습니다. 이 요청을 들어주겠습니까?"
 Montenegro.10.a: "우리는 그저 수정헌법 제2조를 확장하고 있을 뿐이다!"
 Montenegro.10.b: "그들은 우리 총 없이도 지낼 수 있다."
 Montenegro.11.t: "총기를 요청하는 몬테네그로"
 Montenegro.11.d: "몬테네그로가 우리에게서 소형 화기 장비를 구매하도록 허가해 달라는 메시지를 보내왔습니다. 이 요청을 들어주겠습니까?"
 Montenegro.11.a: "물론 산악에 사는 형제들을 도와야지!"
 Montenegro.11.b: "아직도 앙금이 남아 있다..."
 Montenegro.12.t: "차량을 요청하는 몬테네그로"
 Montenegro.12.d: "몬테네그로가 차량 구매 건으로 우리에게 연락을 시도하고 있습니다. 이것이 우리에게 최선의 이익이 됩니까?"
 Montenegro.12.a: "여기에는 자유가 가득하다!"
 Montenegro.12.b: "무시하라. 그들은 중요하지 않다."
 Montenegro.13.t: "차량을 요청하는 몬테네그로"
 Montenegro.13.d: "몬테네그로가 차량 구매 건으로 우리에게 연락을 시도하고 있습니다. 이것이 우리에게 최선의 이익이 됩니까?"
 Montenegro.13.a: "라다에 대해 들어본 모양이군."
 Montenegro.13.b: "러시아 기술은 몬테네그로가 쓰기에는 너무나 뛰어나다."
 Montenegro.17.t: "헬리콥터를 요청하는 몬테네그로"
 Montenegro.17.d: "몬테네그로가 우리에게서 헬리콥터를 구매하려 하고 있습니다. 이 요청에 응할지는 상황에 달렸습니다. 그들은 우리의 친구입니까?"
 Montenegro.17.a: "물론이지"
 Montenegro.17.b: "으, 싫어, 안 돼!"
 Montenegro.15.t: "헬리콥터 구매에 가장 좋은 선택은 어느 나라인가?"
 Montenegro.15.d: "우리는 누구에게서 헬리콥터를 구매할지 결정해야 하며, 이 거래가 판매자에게 우리나라에 대한 영향력을 부여할 수 있고 통제하지 못하면 국가 안보에 위협이 될 수 있으므로 신중해야 합니다!"
 Montenegro.15.a: "미국이 도와줄 것이다!"
 Montenegro.15.b: "러시아여, 우리를 도와 달라!"
 Montenegro.18.t: "수송선 구매에 가장 좋은 선택은 어느 나라인가?"
 Montenegro.18.d: "우리는 누구에게서 수송선을 구매할지 결정해야 하며, 이 거래가 판매자에게 우리나라에 대한 영향력을 부여할 수 있고 통제하지 못하면 국가 안보에 위협이 될 수 있으므로 신중해야 합니다!"
 Montenegro.18.a: "미국이 도와줄 것이다!"
 Montenegro.18.b: "러시아여, 우리를 도와 달라!"
 Montenegro.16.t: "헬리콥터를 요청하는 몬테네그로"
 Montenegro.16.d: "몬테네그로가 우리에게서 헬리콥터를 구매하려 하고 있습니다. 이 요청에 응할지는 상황에 달렸습니다. 그들은 우리의 친구입니까?"
 Montenegro.16.a: "물론이지"
 Montenegro.16.b: "으, 싫어, 안 돼!"
 Montenegro.19.t: "수송선을 요청하는 몬테네그로"
 Montenegro.19.d: "몬테네그로가 수송선을 구매하려는 메시지를 보내왔습니다. 좋은 생각입니까?"
 Montenegro.19.a: "몬테네그로가 바다를 지배한다!"
 Montenegro.19.b: "아드리아해는 이탈리아의 어린이 물놀이장이다!"
 Montenegro.20.t: "수송선을 요청하는 몬테네그로"
 Montenegro.20.d: "몬테네그로가 수송선을 구매하려는 메시지를 보내왔습니다. 좋은 생각입니까?"
 Montenegro.20.a: "우리 슬라브 형제들은 원하는 만큼 항해해도 좋다."
 Montenegro.20.b: "어디로 가는 것도 아닌데..."
 Montenegro.25.t: "세르비아 통일 논쟁"
 Montenegro.25.d: "우리 장관들은 우리 앞에 두 가지 기본적인 선택지가 있다고 말했습니다. 세르비아를 굴복시키고 거부하면 정복하려 하거나, 자치 지역으로서 세르비아에 다시 통합되는 것입니다."
 Montenegro.25.a: "세르비아의 자존심은 굴복당해야 한다!"
 Montenegro.25.b: "어머니 세르비아여, 우리를 맞아 달라!"
 Montenegro.14.t: "타라 암스 설립"
 Montenegro.14.d: "우리는 마침내 자체 무기 생산 기업을 설립할 자원을 갖게 되었지만, 가장 중요한 한 가지가 아직 정해지지 않았습니다. 우리 무기를 어떤 플랫폼으로 만들 것인가? 이 문제는 많은 논쟁을 불러일으켰고, 우리에게는 세 가지 선택지가 있습니다. AR 플랫폼을 쓰거나, AK 플랫폼을 쓰거나, 주류가 아닌 플랫폼을 쓸 수 있습니다."
 Montenegro.14.a: "AK가 우리의 선택이다!"
 Montenegro.14.b: "AR이 우리에게 더 잘 맞는다!"
 Montenegro.14.c: "AR이고 AK고 집어치워라!"
 Montenegro.26.t: "재통합을 원하는 몬테네그로!"
 Montenegro.26.d: "몬테네그로 정부가 다시 우리나라의 자치 지역이 되기를 원합니다. 동의하겠습니까?"
 Montenegro.26.a: "형제들이여, 돌아온 것을 환영한다!"
 Montenegro.26.b: "으, 싫어, 안 돼!"
 Montenegro.27.t: "거절하는 세르비아!"
 Montenegro.27.d: "그들은 우리 두 나라가 통일되기를 원하지 않습니다!"
 Montenegro.27.a: "바보들인가?"
 Montenegro.24.t: "세르비아 종교 분쟁!"
 Montenegro.24.d: "우리 정부의 많은 집단이 세르비아 교회가 우리 정부에 대해 가진 권리와 영향력을 제한할 것을 제안하고 있습니다. 동의하겠습니까?"
 Montenegro.24.a: "물론이다! 어리석은 수도사들..."
 Montenegro.24.b: "어리석은 생각이다."
 Montenegro.23.t: "교회 분쟁!"
 Montenegro.23.d: "최근 세르비아 교회와 몬테네그로 교회 사이에 큰 갈등이 벌어졌습니다. 우리는 누구의 편에 서야 합니까?"
 Montenegro.23.a: "세르비아 교회!"
 Montenegro.23.b: "몬테네그로 교회!"
 Montenegro.22.t: "정치적 지지를 요청하는 몬테네그로!"
 Montenegro.22.d: "몬테네그로의 지우카노비치 대통령이 자신의 통치를 지지해 달라고 요청하고 있습니다. 동의하겠습니까?"
 Montenegro.22.a: "물론이다, 환영한다!"
 Montenegro.22.b: "안된다"
 Montenegro.21.t: "정치적 지지를 요청하는 몬테네그로!"
 Montenegro.21.d: "몬테네그로의 지우카노비치 대통령이 우리에게 정치적 지지를 요청하고 있습니다."
 Montenegro.21.a: "물론이다!"
 Montenegro.21.b: "안된다"
