 module_light_surface_jet_turbine_power4: "Moteur à turbine à réaction léger IV"
 module_light_surface_jet_turbine_power4_desc: "$module_light_surface_jet_turbine_power3_desc$"
 tech_light_guns_4: "Canons navals 2045"
 tech_light_guns_4_desc: "Systèmes d'armes navales de petit et grand calibre, conçus pour engager à la fois cibles de surface et aériennes."
 module_naval_submarine_drone_control: "Contrôle autonome des sous-marins"
 module_naval_submarine_drone_control_desc: "Les suites de contrôle autonomes réduisent la charge d'équipage des opérations sous-marines en déléguant navigation de routine, gestion des capteurs et maintien de poste aux systèmes de décision de bord.\n\n§GIndice du concepteur : le contrôle autonome réduit fortement les besoins en main-d'œuvre tout en améliorant largement capteurs, armes, protection et vitesse. Convient aux combattants avancés à faible équipage, mais a un coût élevé de CI et de puces.§!"
 module_naval_patrol_boat_drone_control: "Contrôle autonome des engins de patrouille"
 module_naval_patrol_boat_drone_control_desc: "Les systèmes de contrôle autonomes permettent aux patrouilleurs d'opérer avec des besoins d'équipage réduits, gérant navigation de routine, maintien de poste et gestion des capteurs par logique de décision de bord et supervision à distance.\n\n§GIndice du concepteur : le contrôle autonome réduit fortement les besoins en main-d'œuvre tout en améliorant largement capteurs, armes, protection et vitesse. Convient aux combattants avancés à faible équipage, mais a un coût élevé de CI et de puces.§!"
 module_naval_corvette_drone_control: "Contrôle autonome de la Corvette"
 module_naval_corvette_drone_control_desc: "Les suites de contrôle autonomes permettent aux corvettes d'opérer avec des besoins d'équipage réduits, automatisant navigation de routine, gestion des capteurs et aide au contrôle des avaries tout en permettant une supervision à distance au besoin.\n\n§GIndice du concepteur : le contrôle autonome réduit fortement les besoins en main-d'œuvre tout en améliorant largement capteurs, armes, protection et vitesse. Convient aux combattants avancés à faible équipage, mais a un coût élevé de CI et de puces.§!"
 tech_tank_nuclear_engine_1: "Moteur de réservoir nucléaire II"
 tech_tank_nuclear_engine_1_desc: "Les premiers concepts de propulsion nucléaire promettent une portée opérationnelle quasi illimitée et une réduction drastique de la logistique de carburant conventionnel pour les formations blindées. La contrepartie est une complexité extrême, de lourdes exigences de blindage et des coûts énormes de production et d'entretien, faisant du moteur un atout stratégique plutôt qu'un composant standard."
 tech_tank_nuclear_engine_2: "Moteur de réservoir nucléaire III"
 tech_tank_nuclear_engine_2_desc: "La miniaturisation raffinée des réacteurs et un confinement plus sûr rendent le blindé à propulsion nucléaire plus pratique sur le terrain, améliorant fiabilité et puissance pour les plates-formes lourdes. Toujours prohibitivement coûteux et gourmand en ressources, ces moteurs permettent des opérations à tempo élevé soutenu sans les contraintes de carburant qui définissent d'ordinaire la guerre blindée."
 tech_tank_hover_suspension_1: "Suspension à coussin d'air pour VTT II"
 tech_tank_hover_suspension_1_desc: "La première suspension à sustentation remplace les chenilles par des modules de portance qui laissent les VTT glisser sur sol accidenté, boue et eaux peu profondes, avec moins de traînée et un mouvement tout-terrain plus rapide. Le système améliore mobilité et stabilité de roulement, mais augmente le coût de production et exige plus de puissance et d'entretien que le train de roulement conventionnel."
 tech_tank_hover_suspension_2: "Suspension à coussin d'air pour VTT III"
 tech_tank_hover_suspension_2_desc: "Un meilleur contrôle de portance et une meilleure efficacité énergétique rendent les VTT à sustentation plus fiables en terrain varié, réduisant les pics de signature et améliorant le comportement à vitesse. De meilleures jupes et une stabilisation limitent poussière et débris, gardant les formations plus rapides et plus prévisibles sous la pression."
 tech_tank_hover_suspension_3: "Suspension à coussin d'air pour VTT IV"
 tech_tank_hover_suspension_3_desc: "La suspension à sustentation de nouvelle génération intègre détection de terrain avancée et correction automatique d'équilibre, permettant une manœuvre à haute vitesse dans l'encombrement urbain et le sol brisé avec une perte de contrôle minimale. Avec une durabilité renforcée et une gestion d'énergie plus intelligente, les VTT à sustentation gagnent une mobilité opérationnelle soutenue, bien que la technologie reste coûteuse et gourmande en ressources."
 SOV_tech_landing_craft_1: "Classe Polnocny"
 SOV_tech_landing_craft_2: "Classe Ropucha"
 SOV_tech_landing_craft_3: "LCAC de classe Zubr"
 SOV_tech_landing_craft_4: "Classe Ivan Gren"
 nsb_light_nose_gun_tech_4: "Pistolets montés sur le nez de pointe"
 nsb_light_nose_gun_tech_4_desc: "Les canons électromagnétiques de nez donnent aux hélicoptères une arme à tir direct d'une vitesse à la bouche extrême et d'une forte perforation. Ils excellent dans de courtes fenêtres d'engagement brutales contre véhicules légers, fortifications et cibles volant bas, mais exigent une lourde puissance et un refroidissement robuste."
 nsb_light_nose_gun_tech_5: "Canons de nez hyper-avancés"
 nsb_light_nose_gun_tech_5_desc: "Des condensateurs affinés, des matériaux de tube améliorés et une intégration plus serrée à la conduite de tir permettent des rafales soutenues sans usure paralysante. Ces canons de nez électromagnétiques avancés améliorent précision et fiabilité tout en réduisant le stress de recul, faisant de l'hélicoptère une plate-forme de tir précise et hautement létale."
 nsb_light_nose_gun_tech_6: "Canons de nez ultra-avancés"
 nsb_light_nose_gun_tech_6_desc: "Les conceptions de nouvelle génération mettent l'accent sur l'efficacité énergétique, la stabilité thermique et la visée automatisée pour garder le feu électromagnétique efficace sous manœuvre et pression de guerre électronique. Avec un cycle plus rapide et une manutention de munitions plus intelligente, les hélicoptères peuvent délivrer un tir direct constant et dévastateur sans sacrifier l'endurance."
 tech_helicopter_hover_engine_1: "Hélicoptères à moteur stationnaire II"
 tech_helicopter_hover_engine_1_desc: "L'intégration précoce de moteurs à sustentation remplace la portance rotor conventionnelle par une poussée vectorielle compacte, permettant un vol stable à basse altitude sans pales exposées. Ces plates-formes échangent un peu d'efficacité contre la survivabilité et la flexibilité urbaine, les rendant plus difficiles à détecter et moins vulnérables aux armes légères et aux débris."
 tech_helicopter_hover_engine_2: "Hélicoptères à moteur stationnaire III"
 tech_helicopter_hover_engine_2_desc: "Une densité de puissance et un logiciel de contrôle améliorés rendent les aéronefs à moteur de sustentation plus réactifs, plus silencieux et capables d'emporter des charges utiles significatives. Une meilleure gestion thermique et une stabilité de vol élargissent leur utilité pour les opérations spéciales, l'insertion rapide et les milieux urbains contestés."
 tech_helicopter_hover_engine_3: "Hélicoptères à moteur stationnaire IV"
 tech_helicopter_hover_engine_3_desc: "Les conceptions avancées de moteurs de sustentation offrent une endurance plus élevée, de plus fortes marges de portance et un comportement tout-temps fiable grâce à une automatisation robuste et une fusion capteurs. Avec des signatures réduites et une accélération rapide, ces aéronefs redéfinissent les rôles de voilure tournante et permettent une mobilité verticale là où les hélicoptères traditionnels seraient trop exposés."
 nsb_drone_artillery_ammo_1: "Munitions d'artillerie pour drones II"
 nsb_drone_artillery_ammo_1_desc: "Les premiers obus d'artillerie assistés par drone utilisent un guidage embarqué et de simples schémas de loitering pour se corriger sur les cibles après le lancement. Cela accroît précision et efficacité contre les cibles ponctuelles, mais relève le coût unitaire par rapport aux obus conventionnels."
 nsb_drone_artillery_ammo_2: "Munitions d'artillerie pour drones III"
 nsb_drone_artillery_ammo_2_desc: "Des autodirecteurs et liaisons de données améliorés permettent aux munitions-drones de recevoir des mises à jour en vol et un reciblage, réduisant le feu gaspillé et permettant des frappes réactives contre des cibles mobiles ou urgentes. Un meilleur conditionnement et une meilleure propulsion améliorent la portée sans sacrifier la précision."
 nsb_drone_artillery_ammo_3: "Munitions d'artillerie pour drones IV"
 nsb_drone_artillery_ammo_3_desc: "Les obus-drones avancés se coordonnent avec les moyens d'observation et les réseaux de conduite de tir, permettant un transfert rapide de cibles, une recherche coopérative et des profils d'attaque terminale plus intelligents. Cela transforme l'artillerie en un système de précision capable de chasser, d'ajuster et d'achever des cibles sous brouillage et pression de contre-batterie."
 special_project_tech_smart_grid: "Réseau intelligent"
 expanded_infantry_weapons_1_desc: "Ajouter plus d'armes, de rôles variés, à nos unités d'infanterie leur donnera plus d'options pour combattre plusieurs types d'unités ennemies."
 production_line_improvements_1: "Lignes de production améliorées I"
 production_line_improvements_1_desc: "Les premiers raffinements des chaînes de production industrielle visent à réduire les inefficacités, améliorer l'organisation du flux de travail et introduire une automatisation de base. Ces changements accroissent la constance de la production tout en réduisant les arrêts."
 improved_building_constructions_1: "Focus sur la construction d’usines I"
 improved_building_constructions_1_desc: "Les premières améliorations de construction d'usines portent sur une meilleure planification de projet, des conceptions standardisées et un usage plus efficace des matériaux."
 tech_rail_guns_5: "Railguns 2060"
 tech_rail_guns_5_desc: "Les canons électromagnétiques de défense de flotte intègrent un stockage d'énergie à haute capacité, des systèmes de recharge rapide et des données de visée en réseau, permettant aux navires de guerre d'intercepter des salves de missiles et de porter des frappes cinétiques à longue portée à cadence élevée."
 tech_rail_guns_6: "Railguns 2075"
 tech_rail_guns_6_desc: "Les systèmes de canons électromagnétiques futurs utilisent des projectiles intelligents adaptatifs, un contrôle d'engagement assisté par IA et une gestion de l'énergie à l'échelle du navire pour fournir un appui-feu électromagnétique rapide, précis et soutenu dans les espaces de bataille navals contestés."
 reactor11: "ADS"
 reactor11_desc: "Les systèmes sous-critiques pilotés par accélérateur associent un accélérateur de particules à haute énergie à un cœur de réacteur sous-critique. La source de neutrons de spallation transmutes les déchets nucléaires à longue période en isotopes à période plus courte tout en générant de l'énergie. La conception sous-critique offre une marge de sûreté inhérente, la réaction s'arrêtant immédiatement si l'accélérateur est coupé."
 reactor12: "CFR"
 reactor12_desc: "Le réacteur à fusion compact atteint une fusion deutérium-tritium soutenue dans une configuration tokamak ou stellarator à fort champ, assez petite pour un déploiement commercial. Les progrès des aimants supraconducteurs à haute température et du confinement du plasma ont enfin rendu l'énergie de fusion économiquement viable, délivrant une énergie propre virtuellement illimitée."
 special_forces_tech_1: "Forces d'opérations spéciales"
 special_forces_tech_1_desc: "Les forces d'opérations spéciales sont l'élite de toute armée où elles figurent, avec un entraînement plus long et plus dur que quiconque. Elles sont expertes des terrains difficiles, des opérations aéroportées et des débarquements amphibies. Elles sont toutefois très légèrement équipées, car elles peuvent devoir opérer avec mobilité derrière les lignes."
 nsb_SP_arty_5: "SP-ART 2045"
 nsb_SP_arty_5_desc: "Grâce à sa puissante capacité de feu indirect, l'artillerie automotrice fournit des frappes de précision soutenues là où il le faut sur le champ de bataille, et bien au-delà des portées visuelles. Elle peut être rechargée directement par son équipage, et son automoteur la rend mobile pour échapper aux tirs de contre-batterie ennemis."
 nsb_SP_arty_6: "SPART 2055"
 nsb_SP_arty_6_desc: "Grâce à sa puissante capacité de feu indirect, l'artillerie automotrice fournit des frappes de précision soutenues là où il le faut sur le champ de bataille, et bien au-delà des portées visuelles. Elle peut être rechargée directement par son équipage, et son automoteur la rend mobile pour échapper aux tirs de contre-batterie ennemis."
 nsb_SP_arty_7: "SPART 2065"
 nsb_SP_arty_7_desc: "Grâce à sa puissante capacité de feu indirect, l'artillerie automotrice fournit des frappes de précision soutenues là où il le faut sur le champ de bataille, et bien au-delà des portées visuelles. Elle peut être rechargée directement par son équipage, et son automoteur la rend mobile pour échapper aux tirs de contre-batterie ennemis."
 nsb_SP_arty_8: "SPART 2075"
 nsb_SP_arty_8_desc: "Grâce à sa puissante capacité de feu indirect, l'artillerie automotrice fournit des frappes de précision soutenues là où il le faut sur le champ de bataille, et bien au-delà des portées visuelles. Elle peut être rechargée directement par son équipage, et son automoteur la rend mobile pour échapper aux tirs de contre-batterie ennemis."
 AA_upgrade_5: "Chercheurs IIR adaptatifs"
 AA_upgrade_5_desc: "Les autodirecteurs infrarouges imageurs adaptatifs combinent reconnaissance numérique de cible et rejet amélioré des contre-mesures, permettant aux systèmes AA à courte portée de distinguer aéronefs, fusées éclairantes, leurres, drones et sources de chaleur d'arrière-plan."
 AA_upgrade_6: "Réseaux de chercheurs multispectraux"
 AA_upgrade_6_desc: "Les réseaux d'autodirecteurs multispectraux combinent plusieurs bandes infrarouges et optiques à un traitement embarqué plus rapide, améliorant le pistage des menaces aériennes petites, rapides ou masquées par le terrain, comme les UAV, missiles de croisière et hélicoptères."
 AA_upgrade_7: "Fusion de capteurs pilotés par le réseau"
 AA_upgrade_7_desc: "La fusion de capteurs guidée par le réseau relie les imageurs de missiles aux flux radar, optiques et de données du champ de bataille, améliorant l'identification et la stabilité du verrouillage pour missiles portables comme pour affûts AA de véhicules blindés."
 nsb_AA_upgrade_5: "Chercheurs IIR adaptatifs"
 nsb_AA_upgrade_5_desc: "Les autodirecteurs infrarouges imageurs adaptatifs combinent reconnaissance numérique de cible et rejet amélioré des contre-mesures, permettant aux systèmes AA à courte portée de distinguer aéronefs, fusées éclairantes, leurres, drones et sources de chaleur d'arrière-plan."
 nsb_AA_upgrade_6: "Réseaux de chercheurs multispectraux"
 nsb_AA_upgrade_6_desc: "Les réseaux d'autodirecteurs multispectraux combinent plusieurs bandes infrarouges et optiques à un traitement embarqué plus rapide, améliorant le pistage des menaces aériennes petites, rapides ou masquées par le terrain, comme les UAV, missiles de croisière et hélicoptères."
 nsb_AA_upgrade_7: "Fusion de capteurs pilotés par le réseau"
 nsb_AA_upgrade_7_desc: "La fusion de capteurs guidée par le réseau relie les imageurs de missiles aux flux radar, optiques et de données du champ de bataille, améliorant l'identification et la stabilité du verrouillage pour missiles portables comme pour affûts AA de véhicules blindés."
 AT_upgrade_5: "Munitions antichar en réseau"
 AT_upgrade_5_desc: "Les munitions antichars en réseau combinent guidage tire-et-oublie, verrouillage après lancement et transfert de cible externe, permettant aux lanceurs d'engager des blindés modernes depuis des positions masquées, indirectes ou en évolution rapide."
 AT_upgrade_6: "Munitions de reciblage multispectrales"
 AT_upgrade_6_desc: "Les munitions de retargetage multispectral utilisent des autodirecteurs infrarouges, visuels et en faible lumière avec contrôle homme dans la boucle, permettant aux opérateurs d'identifier, rediriger ou interrompre les attaques contre blindés en mouvement, leurres et cibles masquées."
 AT_upgrade_7: "Munitions d'attaque contre-APS"
 AT_upgrade_7_desc: "Les munitions d'attaque contre APS utilisent des trajectoires adaptatives, un cadencement d'impact synchronisé et des angles d'attaque sélectionnables pour réduire l'interception par les systèmes de protection active et frapper les sections de blindage vulnérables."
 AS_upgrade_4: "Contrôle pris en charge par l'IA"
 AS_upgrade_4_desc: "L'intégration de systèmes d'IA permet une meilleure efficacité opérationnelle."
 AS_upgrade_5: "Contrôle II pris en charge par l'IA"
 AS_upgrade_5_desc: "L'intégration de systèmes d'IA permet une meilleure efficacité opérationnelle."
 AS_upgrade_6: "Contrôle III pris en charge par l'IA"
 AS_upgrade_6_desc: "L'intégration de systèmes d'IA permet une meilleure efficacité opérationnelle."
 MR_upgrade_4: "Contrôle pris en charge par l'IA"
 MR_upgrade_4_desc: "L'intégration de systèmes d'IA permet une meilleure efficacité opérationnelle."
 MR_upgrade_5: "Contrôle II pris en charge par l'IA"
 MR_upgrade_5_desc: "L'intégration de systèmes d'IA permet une meilleure efficacité opérationnelle."
 MR_upgrade_6: "Contrôle III pris en charge par l'IA"
 MR_upgrade_6_desc: "L'intégration de systèmes d'IA permet une meilleure efficacité opérationnelle."
 microchip_production_6: "Production future de puces II"
 microchip_production_6_desc: "La production de puces améliorée introduit l'alimentation par la face arrière, des architectures de transistors affinées et une fabrication précoce de classe angström, accroissant les performances tout en réduisant les pertes et la chaleur."
 microchip_production_7: "Production future de puces III"
 microchip_production_7_desc: "La lithographie de nouvelle génération, les photorésists avancés et un contrôle de procédé plus serré permettent aux fabs d'imprimer des motifs plus fins avec moins de défauts, améliorant le rendement et permettant des processeurs haute performance plus complexes."
 microchip_production_8: "Production future de puces IV"
 microchip_production_8_desc: "La production hétérogène de puces combine logique, mémoire, capteurs et accélérateurs par des conceptions chiplets et un packaging avancé, intégrant des composants spécialisés dans des processeurs modulaires puissants."
 microchip_production_9: "Production future de puces V"
 microchip_production_9_desc: "La fabrication semi-conductrice tridimensionnelle empile verticalement couches actives, mémoire et interconnexions, augmentant fortement la densité de calcul tout en exigeant des techniques avancées de refroidissement, de collage et de contrôle des défauts."
 microchip_production_10: "Production future de puces VI"
 microchip_production_10_desc: "Les fabs futures entièrement automatisées utilisent le réglage de procédé contrôlé par IA, de nouveaux matériaux semi-conducteurs et une intégration 3D ultra-dense pour produire des puces stratégiques d'une performance, d'une efficacité et d'une précision extrêmes."
 internet_access_4: "Accès Internet satellitaire avancé"
 internet_access_4_desc: "Les satellites devenant de plus en plus présents dans les communications et autres transferts de données, Internet est l'un des services qui a capitalisé sur l'accès satellitaire, ouvrant la possibilité de connecter de plus en plus de personnes."
 internet_access_5: "Accès Internet par satellite de pointe"
 internet_access_5_desc: "Les satellites devenant de plus en plus présents dans les communications et autres transferts de données, Internet est l'un des services qui a capitalisé sur l'accès satellitaire, ouvrant la possibilité de connecter de plus en plus de personnes."
 internet_access_6: "Accès Internet quantique précoce"
 internet_access_6_desc: "L'accès Internet quantique précoce relie des réseaux limités de recherche, militaires et gouvernementaux par des liaisons de communication quantiquement sécurisées, utilisant distribution d'intrication et échange de clés quantiques pour protéger les données critiques."
 internet_access_7: "Accès Internet quantique avancé"
 internet_access_7_desc: "L'accès Internet quantique avancé étend répéteurs quantiques, mémoire quantique et liaisons fibre-satellite, permettant une communication longue distance sécurisée et une détection quantique distribuée précoce sur les réseaux stratégiques."
 internet_access_8: "Accès Internet quantique de pointe"
 internet_access_8_desc: "L'accès Internet quantique de pointe relie calculateurs quantiques, capteurs et nœuds de communication sécurisés en un réseau plus vaste, permettant calcul distribué, détection de précision et communications stratégiques hautement résilientes."
 artificial_intelligence_1: "La renaissance des réseaux de neurones"
 artificial_intelligence_1_desc: "Les réseaux neuronaux existent en théorie depuis la fin du XIXe siècle, comme moyen d'utiliser la puissance de traitement du cerveau pour améliorer l'humanité. Nous devrions relancer cette idée pour améliorer nos ordinateurs et notre quête d'intelligence artificielle."
 artificial_intelligence_2: "Exploration de données"
 artificial_intelligence_2_desc: "L'exploration de données consiste à examiner de vastes bases pour générer de nouvelles informations. Cette pratique peut améliorer notre capacité à développer et à élever notre niveau technologique."
 artificial_intelligence_3: "Apprentissage automatique"
 artificial_intelligence_3_desc: "Au cœur de la théorie de l'apprentissage automatique, un algorithme informatique s'améliore automatiquement par l'expérience. L'intégrer à nos protocoles d'IA leur permet d'apprendre plus vite de nouvelles tâches industrielles et d'améliorer la recherche et le développement."
 artificial_intelligence_4: "Machines sociables"
 artificial_intelligence_4_desc: "Les machines sociables forment un environnement où humains et technologie interagissent et produisent des résultats ou des actions impossibles sans les deux."
 artificial_intelligence_5: "Première robotique IA"
 artificial_intelligence_5_desc: "L'intelligence artificielle en robotique est restée limitée depuis l'apparition récente de l'apprentissage automatique et d'autres formes d'IA. L'introduction de l'IA dans la robotique industrielle et ailleurs permettra aux robots d'améliorer aussi leur productivité."
 artificial_intelligence_6: "IA avancée"
 artificial_intelligence_6_desc: "Une IA plus avancée, capable d'enregistrer et de s'adapter rapidement aux situations, peut tout changer."
 artificial_intelligence_7: "Apprentissage profond moderne"
 artificial_intelligence_7_desc: "L'apprentissage profond est un sous-ensemble de l'apprentissage automatique capable d'apprendre sans supervision à partir de données non structurées ou non étiquetées. Son fonctionnement interne mime le cerveau humain pour traiter les données, détecter des objets et prendre des décisions."
 artificial_intelligence_8: "IA d'imitation humaine"
 artificial_intelligence_8_desc: "L'IA d'imitation humaine utilise de vastes réseaux neuronaux et l'apprentissage profond pour générer langage, images, décisions et comportements de type humain, permettant aux machines d'accomplir des tâches qui exigeaient autrefois un jugement humain direct."
 artificial_intelligence_9: "Formation en IA à grande échelle"
 artificial_intelligence_9_desc: "L'entraînement d'IA à grande échelle utilise d'immenses jeux de données, des accélérateurs spécialisés et des grappes de calcul distribué pour créer des modèles de fondation capables de raisonnement, traduction, planification, analyse et reconnaissance multimodale."
 artificial_intelligence_10: "Algorithmes d'auto-apprentissage avancés"
 artificial_intelligence_10_desc: "Des algorithmes avancés d'auto-apprentissage permettent aux systèmes d'IA de s'améliorer par simulation, retour d'expérience et expérimentation autonome, réduisant le besoin de réentraînement humain constant et de règles manuelles."
 artificial_intelligence_11: "Intelligence générale artificielle"
 artificial_intelligence_11_desc: "L'intelligence artificielle générale peut transférer des connaissances entre de nombreux domaines, résoudre des problèmes inconnus et coordonner des tâches complexes avec une souplesse de niveau humain, plutôt que de se limiter à des fonctions étroites."
 artificial_intelligence_12: "Coordination de l'esprit collectif de l'IA"
 artificial_intelligence_12_desc: "La coordination en essaim d'IA relie de nombreux systèmes spécialisés en un réseau de décision partagé, leur permettant d'échanger des données, de se répartir les tâches et de coordonner opérations militaires, industrielles et logistiques en temps réel."
 artificial_intelligence_13: "Superintelligence artificielle"
 artificial_intelligence_13_desc: "La superintelligence artificielle dépasse le niveau humain en recherche, stratégie, ingénierie et administration, permettant aux systèmes automatisés de gérer d'immenses charges de travail et de découvrir des solutions hors de portée humaine normale."
 artificial_intelligence_14: "Superintelligence quantique"
 artificial_intelligence_14_desc: "La superintelligence quantique combine des architectures d'IA avancées et le calcul accéléré par le quantique, permettant optimisation, simulation, analyse cryptographique et planification stratégique à une échelle extrême, au-delà de l'intelligence machine classique."
 robotics_1: "Robot humanoïde"
 robotics_1_desc: "La base de la peur de beaucoup est aussi celle de grands progrès en robotique fondée sur l'IA. L'apparition de plusieurs robots de type « humanoïde » a montré que certains travaux routiniers et ingrats pourraient être mieux automatisés."
 robotics_2: "Robotique industrielle avancée"
 robotics_2_desc: "Introduire une IA encore plus sophistiquée dans notre robotique commerciale et industrielle peut améliorer qualité, délais et vitesse de nos produits et de notre production."
 robotics_3: "Drones intelligents"
 robotics_3_desc: "Les drones sont généralement pilotés par une ou deux personnes à des kilomètres. Si nous installons de l'intelligence artificielle à bord, nous pouvons réduire le besoin en personnel à une personne, voire à l'avenir à personne d'autre que des systèmes informatisés."
 robotics_4: "Drones entièrement automatisés"
 robotics_4_desc: "Les drones pleinement automatisés appartenaient à l'avenir. Nous pouvons désormais faire de la logistique et bien plus avec des drones pleinement autonomes d'un point A à un point B."
 robotics_5: "Nanorobots"
 robotics_5_desc: "Les nanorobots sont de petites machines à l'échelle du nanomètre ou proche. Ils pourraient servir dans de nombreux domaines, de la médecine au combat dans des situations de déconstruction."
 robotics_6: "Nanorobots médicaux"
 robotics_6_desc: "Les nanorobots conjugués à la médecine peuvent cibler des cellules, virus et bactéries spécifiques pour combattre maladies ou infections potentiellement mortelles."
 robotics_7: "Drones contrôlés par l'IA"
 robotics_7_desc: "Les drones peuvent parfaitement éviter tout obstacle et communiquer avec les autres machines autour d'eux pour maximiser l'efficacité logistique."
 robotics_8: "Industrie 4.0"
 robotics_8_desc: "La robotique a pleinement amené la 4e révolution industrielle dans tous les domaines de l'humanité."
 robotics_9: "Bots d’IA médicale avancés"
 robotics_9_desc: "Ces IA peuvent soigner n'importe quelle maladie. Elles commandent une armée de nanorobots et peuvent même combattre les mécanismes du vieillissement chez l'humain."
 robotics_10: "Robotique quantique"
 robotics_10_desc: "L'informatique quantique intégrée aux robots rend le temps de réponse quasi instantané, permettant une microgestion précise des chaînes de production."
 robotics_11: "Hubs industriels superintelligents"
 robotics_11_desc: "Des parcs industriels entiers peuvent désormais être gérés par un seul surveillant superintelligent artificiel."
 printing_1: "Stéréolithographie"
 printing_1_desc: "La stéréolithographie est une forme d'impression 3D surtout utilisée pour créer modèles, prototypes, moules et pièces de production couche par couche par procédés photochimiques."
 printing_2: "Premières imprimantes 3D"
 printing_2_desc: "L'impression 3D précoce s'est révélée adaptée à la création de prototypes fonctionnels ou esthétiques. Ce procédé s'appelle le « prototypage rapide »."
 printing_3: "Imprimante à cire 3D"
 printing_3_desc: "Une imprimante 3D à cire utilise de la cire et d'autres thermoplastiques."
 printing_4: "Impression 3D à grande échelle"
 printing_4_desc: "Porter l'impression 3D à beaucoup plus grande échelle peut nous aider à rationaliser et étendre la production de petits articles comme vis et clous, ou d'objets détaillés irremplaçables sur le marché."
 printing_5: "Imprimante 3D auto-répliquée"
 printing_5_desc: "Les imprimantes 3D auto-réplicantes sont conçues pour aider à produire et à faire avancer la production."
 printing_6: "Fabrication commerciale"
 printing_6_desc: "L'impression 3D est restée extrêmement limitée dans l'espace commercial. Étendre ses capacités à cette forme aidera nettement nos possibilités d'avancer."
 printing_7: "Impression 3D moderne"
 printing_7_desc: "Les avancées en impression 3D nous ont permis de changer les matériaux pour des versions plus résistantes et plus efficaces."
 printing_8: "Nanofibres imprimées en 3D"
 printing_8_desc: "Imprimer des nanofibres peut nous aider à générer des matériaux plus résistants que nous n'avons pu produire, jusqu'à chaque nanite individuel."
 printing_9: "Fabrication de nanocellulose à grande échelle"
 printing_9_desc: "Étendre la fabrication de nanocellulose à plus grande échelle peut nous aider à développer plus rapidement."
 printing_10: "Nanocellulose en médecine"
 printing_10_desc: "Utiliser la nanocellulose en médecine peut améliorer les taux de survie des patients atteints de maladies invalidantes."
 printing_11: "Imprimantes de construction"
 printing_11_desc: "Les bâtiments peuvent être construits par des imprimantes capables de produire les matériaux sur place, réduisant les coûts logistiques."
 printing_12: "Bio-impression"
 printing_12_desc: "Combiner les avancées de la biotechnologie et de l'impression 3D permet de fabriquer des organes entiers."
 printing_13: "Imprimantes micro-macro"
 printing_13_desc: "Les imprimantes 3D sont devenues si polyvalentes qu'elles s'appliquent à tous les domaines de la vie humaine, de la production de nanofibres à la construction d'immeubles entiers."
 nanofibers_1: "Nanofibres polymères électrofilées industrielles"
 nanofibers_1_desc: "L'électrofilage est l'une des façons les plus courantes de fabriquer des nanofibres. Accélérer la production nous permettra d'en produire plus, plus souvent."
 nanofibers_2: "Nanotubes de carbone à parois multiples"
 nanofibers_2_desc: "Les nanotubes servent de conducteurs dans les appareils électriques, d'antennes pour radios et autres dispositifs électromagnétiques."
 nanofibers_3: "Électrosfilage moderne"
 nanofibers_3_desc: "L'électrofilage est une méthode de production de fibres qui utilise la force électrique pour étirer des fils chargés de solutions ou de fondus polymères jusqu'à des diamètres de l'ordre de quelques centaines de nanomètres."
 nanofibers_4: "Fabrication de fibres inorganiques"
 nanofibers_4_desc: "L'électrofilage est considéré comme l'une des techniques les plus simples et efficaces pour fabriquer d'immenses quantités de nanomatériaux, permettant d'électrofiler avec succès diverses micro- et nanofibres inorganiques."
 nanofibers_5: "Production industrielle de nanofibres"
 nanofibers_5_desc: "Les nanofibres électrofilées sont largement étudiées et leurs applications potentielles largement démontrées. Équipements, solutions technologiques et matériaux électrofilés basculent rapidement vers la commercialisation. Des sociétés dédiées fournissent composants et appareils de laboratoire et industriels."
 nanofibers_6: "Nanofibres en médecine"
 nanofibers_6_desc: "Les nanofibres montrent un grand potentiel biomédical et sanitaire grâce à leur combinaison unique de propriétés et de fonctionnalités intrinsèques. Applications importantes : filtration, textiles médicaux, cicatrisation, ingénierie tissulaire, biocapteurs et délivrance de médicaments."
 nanofibers_7: "Filature centrifuge"
 nanofibers_7_desc: "L'usage d'une installation haute tension et le faible débit sont devenus des obstacles à l'électrofilage à grande échelle. Le filage centrifuge est une approche efficace pour produire des nanofibres à partir de divers matériaux."
 nanofibers_8: ""
 nanofibers_8_desc: ""
