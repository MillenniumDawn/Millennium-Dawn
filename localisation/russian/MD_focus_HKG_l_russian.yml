 OPEN_LegCo_BUTTON: "§YЗаконодательный совет§! [HKG.GetFlag]Гонконг, Специальный административный район"
 OPEN_LegCo_BUTTON_TT: "§YЗаконодательный совет§! [HKG.GetFlag]Гонконгского специального административного района — это однопалатный законодательный орган Гонконга. Он действует в рамках конституционного принципа «одна страна, две системы», установленного Китаем, и является центром силы гибридной представительной демократии Гонконга."
