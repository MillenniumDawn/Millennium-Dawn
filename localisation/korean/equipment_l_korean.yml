 GER_infantry_weapons_1: "헤클러 운트 코흐 G3"
 GER_infantry_weapons_1_desc: "헤클러앤코흐 G3(게베르 3)는 7.62x51mm NATO 구경의 선택 사격식 전투소총으로, 1950년대 서독의 무기 제조업체 헤클러앤코흐(H&K)가 스페인 국영 설계 개발 기관인 CETME와 협력하여 개발했습니다. G3는 1959년부터 FN FAL/G1을 대체하여 표준 소총으로 사용되었으며, 1963년에 개량형 G3A1 모델로 업그레이드될 때까지 운용되었습니다."
