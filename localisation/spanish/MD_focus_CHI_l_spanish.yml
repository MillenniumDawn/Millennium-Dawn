 BRI_apply_named_TELECOM_desc: "Solicitar a Pekín la construcción de: §Y[THIS.GetBRINextProjectTELECOM]§!. La solicitud cuesta 25 de Poder Político. Tras la aprobación, pagamos §Y40§! de nuestra tesorería o recibimos un préstamo chino. Requiere estar en paz. Los Estados alineados con Occidente serán objeto de un mayor escrutinio."
