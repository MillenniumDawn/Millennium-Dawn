 UN.415.t: "決議: 経済成長"
 UN.415.d: "The §BUnited Nations§! §YGeneral Assembly§! has passed a non-binding resolution on §YEconomic Growth§!. Although we did not vote in favor of this resolution, we may still choose to accept and implement it.\n\nShould we agree to follow this resolution?"
 UN.416.t: "決議: インフラ開発"
 UN.416.d: "The §BUnited Nations§! §YGeneral Assembly§! has passed a non-binding resolution on §YInfrastructure Development§!. Although we did not vote in favor of this resolution, we may still choose to accept and implement it.\n\nShould we agree to follow this resolution?"
 UN.417.t: "決議: 格差縮小"
 UN.417.d: "The §BUnited Nations§! §YGeneral Assembly§! has passed a non-binding resolution on §YReduced Inequality§!. Although we did not vote in favor of this resolution, we may still choose to accept and implement it.\n\nShould we agree to follow this resolution?"
 UN.418.t: "決議: 気候行動"
 UN.418.d: "The §BUnited Nations§! §YGeneral Assembly§! has passed a non-binding resolution on §YClimate Action§!. Although we did not vote in favor of this resolution, we may still choose to accept and implement it.\n\nShould we agree to follow this resolution?"
 UN.419.t: "決議: 平和と制度"
 UN.419.d: "The §BUnited Nations§! §YGeneral Assembly§! has passed a non-binding resolution on §YPeace & Institutions§!. Although we did not vote in favor of this resolution, we may still choose to accept and implement it.\n\nShould we agree to follow this resolution?"
 UN.420.t: "決議: 貿易提携"
 UN.420.d: "The §BUnited Nations§! §YGeneral Assembly§! has passed a non-binding resolution on §YTrade Partnerships§!. Although we did not vote in favor of this resolution, we may still choose to accept and implement it.\n\nShould we agree to follow this resolution?"
 UN.421.t: "決議: デジタル発展"
