 TRUCKS: "Véhicules utilitaires"
 FUEL_DESC: "§HFCarburant§! est généré par l’excédent de pétrole de votre pays.Chaque pays a une capacité maximale en §HFuel§! qui peut être augmenté en construisant des §HSilos§!.§HCarburant§! est utilisé par les chars/unités mécanisées, les navires et les avions, et il est livré via les §HLignes d'approvisionnement§!.\n\n§HCarburant§! est également utilisé pour alimenter les §HCentrales électriques à combustibles fossiles§! de votre pays et constitue une ressource importante pour garantir le fonctionnement continu de votre économie.§HRéacteurs nucléaires§!，§HInfrastructures d'énergie renouvelable§!，et §Hautres sources d'énergie§!. Ne consommez aucun §Hcarburant§! pour produire de l'énergie.Votre §HPopulation§! consomme également du §HCarburant§! dans le cadre de leurs exigences générales.Pour plus d'informations concernant votre §HCarburant§! non militaire ! consommation voir votre §HEcran Energy§! dans la §HConstruction§! languette."
