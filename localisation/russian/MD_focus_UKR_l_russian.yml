 ukraine_praktyka_otaman_otaman_6x6_122_mission: "Прототип: §YОтаман 6x6 122§!"
 ukraine_praktyka_otaman_otaman_6x6_122_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_6x6_122_for_tooltip\n\n\n\n\n\n\n\n\n§W§YНВО «Практыка»§! строит новый колёсный корпус 6x6 с противоминной защитой. Первая машина на нём несёт 122-мм башню §Y2С1 «Гвоздика»§!. Когда таймер истечёт, прототип будет готов.§!"
 ukraine_praktyka_otaman_otaman_8x8_mission: "Прототип: §YОтаман 8x8§!"
 ukraine_praktyka_otaman_otaman_8x8_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_8x8_for_tooltip\n\n\n\n\n\n\n\n\n§W§YНВО «Практыка»§! перестраивает §YБТР-60§! в §YОтаман 8x8§!: новый противоминный корпус, задняя аппарель для десанта и дистанционно управляемый пулемёт. Когда таймер истечёт, прототип будет готов.§!"
 ukraine_praktyka_otaman_otaman_both_mission: "Прототипы: §YОтаман 6x6 122§! и §YОтаман 8x8§!"
 ukraine_praktyka_otaman_otaman_both_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_both_for_tooltip\n\n\n\n\n\n\n\n\n§W§YНВО «Практыка»§! работает сразу над обеими линиями: новым корпусом 6x6 со 122-мм башней §Y2С1 «Гвоздика»§! и §YОтаманом 8x8§!, перестроенным из §YБТР-60§!. Когда таймер истечёт, оба прототипа будут готовы.§!"
 ukraine_praktyka_otaman_otaman_6x6_73_mission: "Прототип: §YОтаман 6x6 «Гром»§! (БМП)"
 ukraine_praktyka_otaman_otaman_6x6_73_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_6x6_73_for_tooltip\n\n\n\n\n\n\n\n\n§WТот же корпус 6x6 получает 73-мм башню §YБМП-1§!, дымовые гранатомёты и заднюю аппарель для десанта. Когда таймер истечёт, прототип будет готов.§!"
 ukraine_praktyka_otaman_otaman_3_mission: "Прототип: §YОтаман-3§!"
 ukraine_praktyka_otaman_otaman_3_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_3_for_tooltip\n\n\n\n\n\n\n\n\n§W§YОтаман-3§! — боевая машина пехоты для нашей морской пехоты. Она несёт боевой модуль §YБМ-3М «Штурм-М»§! с 30-мм пушкой и ракетами «Барьер». Когда таймер истечёт, прототип будет готов.§!"
 ukraine_praktyka_otaman_otaman_8x8_shturm_mission: "Прототип: §YОтаман 8x8 «Штурм-М»§!"
 ukraine_praktyka_otaman_otaman_8x8_shturm_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_8x8_shturm_for_tooltip\n\n\n\n\n\n\n\n\n§W§YОтаман 8x8§! получает боевой модуль §YБМ-3М «Штурм-М»§! с 30-мм пушкой и ракетами «Барьер», что превращает его в боевую машину пехоты. Когда таймер истечёт, прототип будет готов.§!"
 ukraine_praktyka_otaman_khorunzhyi_mission: "Турецкий модуль для §YБТР-60М «Хорунжий»§!"
 ukraine_praktyka_otaman_khorunzhyi_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_khorunzhyi_for_tooltip\n\n\n\n\n\n\n\n\n§W§YНВО «Практыка»§! хочет турецкий дистанционно управляемый пулемётный модуль для §YБТР-60М «Хорунжий»§!. Анкара одобрит сделку, когда отношение §YТурции§! к нам будет не ниже §Y30§!. Как только это произойдёт, проект увенчается успехом.\n\n§RЕсли таймер истечёт раньше, проект провалится.§!§!"
 ukraine_praktyka_otaman.1.name: "«Практыка» предлагает «Отаман»"
 ukraine_praktyka_otaman.1.desc: "Войне на востоке нужна бронетехника, которую наши заводы могут строить уже сейчас. Киевская компания §YНВО «Практыка»§! предлагает два пути. Она может построить новый колёсный корпус 6x6, начав со 122-мм самоходной гаубицы. Или может перестроить наши старые §YБТР-60§! в бронетранспортёр 8x8 с противоминной защитой. «Практыка» может сделать и то и другое, если мы оплатим оба проекта."
 ukraine_praktyka_otaman.1.a: "Построить новый корпус 6x6"
 ukraine_praktyka_otaman.1.b: "Перестроить БТР-60 в 8x8"
 ukraine_praktyka_otaman.1.c: "Финансировать обе линии"
 ukraine_praktyka_otaman.2.name: "Представлен «Отаман 6x6 122»"
 ukraine_praktyka_otaman.2.desc: "§YНВО «Практыка»§! показала первую машину на новом корпусе 6x6: §YОтаман 6x6 122§! — колёсную самоходную гаубицу со 122-мм башней §Y2С1 «Гвоздика»§!, противоминной защитой и дымовыми гранатомётами. «Практыка» готова начать работу над боевой машиной пехоты на том же корпусе."
 ukraine_praktyka_otaman.2.a: "Принять проект без производства"
 ukraine_praktyka_otaman.2.b: "Принять проект и начать производство"
 ukraine_praktyka_otaman.2.c: "Оплатить производственную линию в Киеве"
 ukraine_praktyka_otaman.3.name: "Представлен «Отаман 6x6 „Гром“»"
 ukraine_praktyka_otaman.3.desc: "§YОтаман 6x6 «Гром»§! готов. Корпус 6x6 несёт 73-мм башню §YБМП-1§!, дымовые гранатомёты и заднюю аппарель, через которую десант быстро покидает машину. Теперь «Практыка» предлагает версию для нашей морской пехоты с современным боевым модулем."
 ukraine_praktyka_otaman.3.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.3.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.3.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.4.name: "Представлен «Отаман-3»"
 ukraine_praktyka_otaman.4.desc: "§YОтаман-3§! для нашей морской пехоты готов. Его боевой модуль §YБМ-3М «Штурм-М»§! несёт 30-мм пушку, пулемёт и ракеты «Барьер», а тепловизионный прицел позволяет экипажу воевать ночью. Наши части морской пехоты могут рассчитывать на лучше защищённые машины."
 ukraine_praktyka_otaman.4.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.4.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.4.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.5.name: "Представлен «Отаман 8x8»"
 ukraine_praktyka_otaman.5.desc: "§YНВО «Практыка»§! перестроила §YБТР-60§! в §YОтаман 8x8§!. Новый корпус защищает экипаж от мин, задняя аппарель заменила тесные боковые люки, а дистанционно управляемый пулемёт — старую башню."
 ukraine_praktyka_otaman.5.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.5.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.5.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.6.name: "Будущее «Отамана 8x8»"
 ukraine_praktyka_otaman.6.desc: "§YНВО «Практыка»§! спрашивает, куда развивать §YОтаман 8x8§! дальше. Она может расширить линейку самоходным миномётом и боевой машиной пехоты на том же корпусе. Или продолжать улучшать сам бронетранспортёр."
 ukraine_praktyka_otaman.6.a: "Расширить линейку"
 ukraine_praktyka_otaman.6.b: "Улучшить бронетранспортёр"
 ukraine_praktyka_otaman.7.name: "Самоходные миномёты «Отаман 8x8»"
 ukraine_praktyka_otaman.7.desc: "«Практыка» перестроила §Y40§! наших §YБТР-60§! в самоходные миномёты на корпусе §YОтаман 8x8§!. Теперь наши миномётные расчёты могут перемещаться и открывать огонь гораздо быстрее. Следующим шагом «Практыка» хочет поставить на тот же корпус современный боевой модуль."
 ukraine_praktyka_otaman.7.a: "Хорошая работа"
 ukraine_praktyka_otaman.8.name: "Представлен «Отаман 8x8 „Штурм-М“»"
 ukraine_praktyka_otaman.8.desc: "§YОтаман 8x8 «Штурм-М»§! готов. Боевой модуль §YБМ-3М «Штурм-М»§! с 30-мм пушкой и ракетами «Барьер» превращает бронетранспортёр 8x8 в боевую машину пехоты."
 ukraine_praktyka_otaman.8.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.8.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.8.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.9.name: "Улучшение «Отамана 8x8»"
 ukraine_praktyka_otaman.9.desc: "У «Практыки» две идеи для бронетранспортёра. Быстрая — поставить на §YОтаман 8x8§! башню §YБРДМ-2§! с 14.5-мм §YКПВТ§!. Долгая — §YБТР-60М «Хорунжий»§!, более глубокая переделка с турецким дистанционно управляемым пулемётным модулем, для которой нужно одобрение Анкары."
 ukraine_praktyka_otaman.9.a: "Поставить башню с КПВТ"
 ukraine_praktyka_otaman.9.b: "Разработать «Хорунжий»"
 ukraine_praktyka_otaman.10.name: "Представлен «Отаман 8x8 КПВТ»"
 ukraine_praktyka_otaman.10.desc: "§YОтаман 8x8 КПВТ§! готов. Башня §YБРДМ-2§! даёт бронетранспортёру 14.5-мм §YКПВТ§! и спаренный пулемёт — этого достаточно против лёгкой техники и пехоты."
 ukraine_praktyka_otaman.10.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.10.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.10.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.11.name: "Представлен БТР-60М «Хорунжий»"
 ukraine_praktyka_otaman.11.desc: "Анкара одобрила сделку, и §YНВО «Практыка»§! завершила §YБТР-60М «Хорунжий»§!. Переделанный бронетранспортёр получил турецкий дистанционно управляемый пулемётный модуль с тепловизионным прицелом, дымовые гранатомёты и заднюю аппарель для десанта."
 ukraine_praktyka_otaman.11.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.11.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.11.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.12.name: "Проект «Хорунжий» провалился"
 ukraine_praktyka_otaman.12.desc: "Анкара не одобрила продажу своего дистанционно управляемого пулемётного модуля, и §YНВО «Практыка»§! отказалась от §YБТР-60М «Хорунжий»§!."
 ukraine_praktyka_otaman.12.a: "Жаль"
