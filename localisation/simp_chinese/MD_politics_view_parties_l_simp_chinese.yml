 EGY.Neutral_Libertarian: "£EGY_Neutral_Libertarian 民主和平党"
 EGY.Neutral_Libertarian_icon: "£EGY_Neutral_Libertarian"
 EGY.Neutral_Libertarian_desc: "（伊斯兰民主主义）- 民主和平党是埃及的一个小政党。据法拉因电视台主席称，该党约有100万党员。该党被描述为一个具有世俗倾向但拥护伊斯兰身份的政党。该党敦促在该地区和世界范围内建立和平。\n\n该党来自§H军方的看法§!为§H中立§!"
