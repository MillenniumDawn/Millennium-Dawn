 FRA_expansion_tooltip_TT: "§YThese focuses will not show their true effects until we finish the Communist or Nationalist trees.§!\n"
 FRA_french_canadian_TT1: "§YA Felicidade dos Canadenses Franceses é Aumentada devido à ajuda Francesa ao governo Canadense.§!\n"
 FRA_french_canadian_TT2: "§YA Felicidade dos Canadenses Franceses é Reduzida devido ao apoio Francês aos Quebequenses.§!\n"
 FRA_idea_development_investment_tt: "Modifica $investment_cost_modifier$ e $investment_duration_modifier$ em §G5%§! para investimentos da §C[FRA.GetNameWithFlag]§!\n"
 FRA_idea_the_francosphere: "A Francosfera"
 FRA_idea_the_francosphere_desc: "A Francosfera é uma comunidade política e global de povos e nações de língua francesa. É um mecanismo para ajudar a França a projetar sua influência sobre as antigas colônias, mas ainda permanece como uma cooperação entre as nações de língua francesa."
 FRA_idea_administrative_reforms: "Reformas Administrativas"
 FRA_idea_administrative_reforms_desc: "A máquina burocrática da França passou por uma série de reformas importantes, reduzindo alguns custos e expandindo a capacidade do governo de promulgar e implementar uma variedade de novas políticas."
 FRA_idea_french_armored_production: "French Armoured Vehicles"
 FRA_idea_french_armored_production_desc: "French armoured vehicles are among the best fighting vehicles in the world. We must continue to maintain our advantage and continue our production of armoured vehicle production to counter the rise of new global threats."
 FRA_idea_central_decentral: "Reforma Burocrática"
 FRA_idea_central_decentral_desc: "Competences are being redrawn between Paris and the regions, and every transferred file costs money and time before it pays off."
 FRA_idea_military_improvement_army: "Reforma Militar - Exército"
 FRA_idea_military_improvement_army_desc: "The first of many reforms has started with the Army taking precedence. We chose the army as being the most important as it can protect the borders of our country as well as the borders of our allies."
 FRA_idea_military_improvement_navy: "Reforma Militar - Marinha"
 FRA_idea_military_improvement_navy_desc: "The first of many reforms has started with the Navy taking precedence. Our navy is important in maintaining crucial supply links, military power projection, and securing our overseas territories."
 FRA_idea_military_improvement_air_force: "Reforma Militar - Força Aérea"
 FRA_idea_military_improvement_air_force_desc: "The first of many reforms has started with the air force taking precedence. The Air Force has been chosen due to its ability to prevent anyone from taking our country from the air and providing effective support to naval and ground forces."
 FRA_idea_military_improvement_army_and_navy: "Reforma Militar - Exército & Marinha"
 FRA_idea_military_improvement_army_and_navy_desc: "Our next set of reforms focuses on the army and the navy. The army and navy together need to be better reformed for cross-branch coordination as well as effective defence of ships and the more effective use of naval assets in coordination with the land forces."
 FRA_idea_military_improvement_army_and_air_force: "Reforma Militar - Exército & Força Aérea"
 FRA_idea_military_improvement_army_and_air_force_desc: "Combined arms training and improvements amongst the army and air force are among the most pivotal reforms we can pursue. The interworking of the two different branches can and will ensure our victory in the coming conflicts."
 FRA_idea_military_improvement_air_force_and_navy: "Reforma Militar - Força Aérea & Marinha"
 FRA_idea_military_improvement_air_force_and_navy_desc: "The air force and navy are as inseparable as they are indispensable. The improvements oriented towards the two branches will allow us to protect our interests as well as the interests of our friends, allies and our civilian population here in Europe and across the globe."
 FRA_idea_the_french_military: "Exército Reformado"
 FRA_idea_the_french_military_desc: "After years of letting the military fall into disarray, we have finally pushed ourselves to reform our ageing military. Now we may further press that France is both a country not to be trifled with and a country to befriend!"
 FRA_idea_space_agency_name: "CNES"
 FRA_idea_space_agency_name_desc: "The Centre national d'études spatiales (CNES) is the name of the French national space agency. It was founded in 1961 by then-President Charles de Gaulle, marking it the third oldest space agency in the world, behind NASA and the Soviet Union's space programme and its successor, Roscosmos."
 FRA_idea_reformed_cnes: "CNES Reformado"
 FRA_idea_reformed_cnes_desc: "The Centre national d'études spatiales (CNES) is the name of the French national space agency. It was founded in 1961 by then-President Charles de Gaulle, marking it the third oldest space agency in the world, behind NASA and the Soviet Union's space programme and its successor, Roscosmos. Recent budgetary shifts and other political changes have seen CNES reformed into the version we know today."
 FRA_idea_cnes_failing: "Deficiências Orçamentárias do CNES"
 FRA_idea_cnes_failing_desc: "O CNES teve várias deficiências orçamentárias no último ano, causando grande descontentamento para a indústria, pois a União Europeia está propondo sua própria agência espacial e outras."
 FRA_idea_prep_the_launch: "Preparando o Lançamento"
 FRA_idea_prep_the_launch_desc: "O CNES está atualmente se preparando para lançar um veículo espacial. Levará algum tempo até que esteja pronto para o lançamento."
 FRA_idea_space_research: "Pesquisa Espacial"
 FRA_idea_space_research_desc: "Pesquisar o espaço é uma das maneiras mais benéficas de obter uma melhor compreensão do mundo ao nosso redor. Concentrar nossa pesquisa no espaço pode garantir que estejamos muito à frente de nossos adversários e concorrentes."
 FRA_idea_nasa_partnership: "Parceria CNES-NASA"
 FRA_idea_nasa_partnership_desc: "Uma parceria entre a agência espacial americana, NASA, e a nossa, CNES, não é apenas lucrativa, mas de interesse mútuo. Expandir e discutir com nosso aliado pode ajudar a melhorar a pesquisa científica de maneira geral e expandir as duas agências para novas fronteiras."
 FRA_idea_Light_for_Europe: "A Luz da Europa"
 FRA_idea_Light_for_Europe_desc: "Surplus nuclear and renewable current flows out over the interconnectors. Neighbours pay for what the grid does not need."
 FRA_cfa_franc_custodian: "Custódio do Franco CFA"
 FRA_cfa_franc_custodian_desc: "Criamos o Franco CFA para proteger nossas colônias da desvalorização do Franco após a Segunda Guerra Mundial. Embora não utilizemos mais o Franco, ainda somos os custodiantes da moeda dos países da África Ocidental. Eles mantêm metade de suas reservas do tesouro conosco e, por isso, podemos capitalizar os ativos que isso nos proporciona.\n\n§YGanhamos 0,5% do PIB Total§! das nações que têm o §YFranco CFA§! como §YRenda Adicional§!. O §YPIB Total§! atual dos §YUsuários do Franco CFA§!: [?FRA.FRA_cfa_franc_gdp_total]b"
 the_eco: "O Eco"
 the_eco_desc: "The ECO was the proposed currency in West Africa amongst the nations of ECOWAS and the West African monetary zone. The French-speaking CFA Franc holders also sought to support the new currency. It unifies the region monetarily allowing for further and easier trade of goods and a unified medium for which the nations can rally behind."
 FRA_idea_the_french_pillar_of_counterterroism: "Pilar do Contra-Terrorismo"
 FRA_idea_the_french_pillar_of_counterterroism_desc: "O terrorismo está em ascensão e cabe a nós, o povo da França, conter a maré e nos proteger, à Europa e a todos aqueles que estão em perigo. O futuro da França com o aumento do extremismo será combatido não apenas com nossas palavras, mas com a força de nossos braços, enquanto combatemos as ameaças crescentes à nossa nação."
 FRA_idea_the_french_foreign_legion: "A Legião Estrangeira Francesa"
 FRA_idea_the_french_foreign_legion_desc: "A Legião Estrangeira da França é um corpo de elite do Exército Francês que consiste em várias especialidades, como infantaria, cavalaria, engenheiros ou tropas aerotransportadas. A Legião Estrangeira é uma força de combate única, pois permite que todos os estrangeiros se juntem e é altamente treinada."
 FRA_idea_Grand_ambitions: "Grandes Ambições na África"
 FRA_idea_Grand_ambitions_desc: "A África está pronta para ser conquistada e precisamos avançar e declarar nossas novas grandes ambições. É de suma importância que continuemos a solidificar nossa posição na África para nos protegermos no presente, mas para o futuro de todo o povo francês."
 FRA_idea_development_investment: "Investimento em Desenvolvimento"
 FRA_idea_development_investment_desc: "[FRA.GetNameWithFlag] está nos fornecendo ajuda econômica para nos ajudar a desenvolver nossa nação."
 AFRICA_idea_nepad_modifier: "NEPAD Development Programme"
 AFRICA_idea_nepad_modifier_desc: "The New Partnership for Africa's Development (NEPAD for short) is an economic development programme developed by the African Union with partners from the European Union, China, Japan and other G8 members. We are especially interested in the development of NEPAD and have made ourselves its main backer, monetarily and politically, within the European Union. We should look at helping extend the programme and increasing its funding and support to help all of Africa.\n\n[FRA.GetNameWithFlag] is the primary sponsor of this programme."
 AFRICA_idea_nepad_modifier_tt: "Quando influenciado por §Y[FRA.GetNameWithFlag]§!, o $foreign_influence_defense_modifier$ é reduzido em §Y10%§!\n"
 FRA_idea_nepad_modifier: "NEPAD Development Programme Sponsor"
 FRA_idea_nepad_modifier_desc: "The New Partnership for Africa's Development (NEPAD for short) is an economic development programme developed by the African Union with partners from the European Union, China, Japan and other G8 members. We are especially interested in the development of NEPAD and have made ourselves its main backer, monetarily and politically, within the European Union. We should look at helping extend the programme and increasing its funding and support to help all of Africa.\n\n[FRA.GetNameWithFlag] is the primary sponsor of this programme and as such we will gain additional benefits such as increased Foreign Influence in the nations who are currently benefiting from the programme.\n"
 FRA_idea_nepad_modifier_cost_tt: "Nosso patrocínio do Desenvolvimento NEPAD da UA custa $[?FRA.FRA_nepad_sponsor_weekly_cost|-3]b semanalmente."
 FRA_unrestricted_subjugation_idea: "Subjugação Irrestrita"
 FRA_unrestricted_subjugation_idea_desc: "As colônias que possuímos nos proporcionaram incrível riqueza e imenso respeito no cenário global. Devemos voltar às nossas antigas formas em alguns aspectos e começar a nos afirmar contra outras nações e proteger o que deveria ser legitimamente nosso. A subjugação pode vir de várias formas, como através da força militar, pressão diplomática e muito mais. Os obstáculos que nos impedem de fazer tal coisa devem e devem ser removidos."
 FRA_SYR_anti_assad_regime_message_idea: "Mensagem Anti-Regime de Assad"
 FRA_SYR_anti_assad_regime_message_idea_desc: "[FRA.GetNameWithFlag] has started to stream and provide propaganda against the Syrian Government. The messaging has started to undermine the government and is continuing to radicalise the youth against our ruling class. It is also showing that the government is susceptible to foreign influence."
 FRA_educational_development_idea: "Desenvolvimento Educacional"
 FRA_educational_development_idea_desc: "[FRA.GetNameWithFlag] is assisting with educational programmes in our country. The educational development alleviates some cost while allowing us to modernise and improve upon our current educational demand."
 FRA_resource_prospects_idea: "Prospecção de Recursos"
 FRA_resource_prospects_idea_desc: "[FRA.GetNameWithFlag] está atualmente ajudando na prospecção de recursos em nosso país para potencialmente fornecer à economia mais caminhos para o desenvolvimento."
 FRA_SYR_escalation_from_the_damascus_spring_idea: "Escalada a partir da Primavera de Damasco"
 FRA_SYR_escalation_from_the_damascus_spring_idea_desc: "[FRA.GetNameWithFlag] has continued to espouse propaganda about becoming democratic in our nation. The efforts continue to undermine our leader [SYR.GetLeader] as we are trying to stabilise the nation."
 FRA_faction_the_paris_accord: "O Acordo de Paris"
 FRA_house_of_bonaparte_crowned: "Um Bonaparte é Coroado!"
 FRA_a_peaceful_rise_flag: "Política Externa Pacífica"
 FRA_an_aggressive_expansionism_flag: "Política Externa Agressiva"
 FRA_aze_supports_our_enemy: "Apoia a Armênia"
 FRA_antagonize_syria_opinion: "Antagonising Us!"
 FRA_haiti_demands_reparations_opinion: "Reparações Exigidas"
 FRA_repealed_the_ordinance_opinion: "Revogou a Ordem"
 FRA_francophone_solidarity_opinion: "Solidariedade Francófona"
 FRA_supported_nepad_development_opinion: "Apoiou o Desenvolvimento do NEPAD"
 FRA_preparing_launch: "Preparando o lançamento da ISS francesa"
 FRA_french_pillar_of_counterterrorism_tt: "Enviando §YAdvisores Estrangeiros§! para Nações para Fins de §YContra-Terrorismo§! nossos conselheiros dobram o bônus fornecido à §YNação Aconselhada§!."
 FRA_leave_eu_tt: "As chances de 'Sair' aumentam se os Nacionalistas tiverem mais de 25% de popularidade."
 france_md.110.t: "O Referendo sobre o Estatuto dos Mahoran"
 france_md.110.d: "O povo de Mayotte decidiu realizar um referendo para determinar seu destino dentro da República Francesa. A ilha de Mayotte faz parte da República Francesa desde 1841, quando foi vendida à França pelo antigo rei de Madagascar. Autoridades locais de destaque buscam consolidar seu papel na República Francesa tornando-se oficialmente parte dela, buscando sua independência da França ou integrando-se às Comores. O que devemos fazer?"
 france_md.110.a: "Permitir o referendo"
 france_md.110.b: "Negar o referendo"
 france_md.110.c: "Libertem-nos com autonomia limitada."
 france_md.111.t: "Resultados do Referendo sobre o Estatuto dos Mahoran"
 france_md.111.d: "O referendo finalmente chegou à sua conclusão natural e os resultados foram divulgados. O futuro de Mayotte estava nas mãos desses resultados."
 france_md.111.a: "Perfeição."
 france_md.505.t: "A Proposta de Fusão KMW-Nexter"
 france_md.505.d: "Os governos da França e da Alemanha estão finalizando um plano para fundir a Nexter Systems e a Krauss-Maffei Wegmann em uma única holding de defesa franco-alemã. O consórcio resultante, KANT, reuniria as linhas de produção do Leclerc e do Leopard 2 sob o mesmo teto, criaria um portfólio conjunto de artilharia e munição e ancoraria um futuro programa europeu de carro de combate principal.\n\nOs ministros querem aprovação política antes que a transferência de ações prossiga."
 france_md.505.a: "Aprovar a fusão"
 france_md.505.b: "Manter a Nexter independente"
 TT_FRA_knds_merge_carry_traits: "§YTodos os traços já concluídos na Nexter serão transferidos para a nova organização KNDS.§!"
 france_md.506.t: "Arquus: Consolidação Industrial"
 france_md.506.d: "As subsidiárias de defesa do Grupo Volvo, Renault Trucks Defense e Panhard General Defense, concluíram sua fusão em uma única entidade. A nova empresa, Arquus, une as plataformas de mobilidade sobre rodas da Renault à herança em reconhecimento da Panhard e posiciona a França como concorrente unificada no mercado europeu de veículos blindados. O conhecimento de produção, os programas e os modificadores combinados de ambas as empresas anteriores são transferidos para a nova organização."
 france_md.506.a: "Um novo capítulo para a mobilidade blindada francesa"
 france_md.506_tt: "Renault e Panhard serão fundidas na Arquus"
 FRA_arguus_established: "Renault e Panhard foram fundidas na Arquus em 2018"
 france_md.507.t: "Eurocopter Se Torna Airbus Helicopters"
 france_md.507.d: "A partir de hoje, o Grupo Eurocopter é rebatizado como Airbus Helicopters, consolidando o negócio de helicópteros da EADS sob a identidade unificada da Airbus. As fábricas de Marignane, a unidade de Donauwörth e as linhas herdadas da Aérospatiale passam a operar sob uma única bandeira."
 france_md.507.a: "Um novo capítulo para os helicópteros europeus."
 TT_FRA_airbus_change_carry_traits: "§YTodos os traços já concluídos na $FRA_eurocopter_manufacturer$ serão transferidos para a $FRA_airbus_manufacturer$§!"
 france_md.508.t: "DCNS Se Torna Naval Group"
 france_md.508.d: "A partir de hoje, o histórico arsenal estatal Direction des Constructions Navales, há muito rebatizado como DCNS, adota a nova identidade Naval Group, marcando sua transformação em uma corporação totalmente privada. Os estaleiros de Lorient, Cherbourg e Brest passam a operar sob uma única bandeira, ao lado da joint venture Naviris com a Fincantieri e de um renovado esforço de exportação construído em torno do submarino da classe Suffren e da fragata FDI Belharra."
 france_md.508.a: "Um novo capítulo para a construção naval francesa."
 TT_FRA_naval_takeover_carry_traits: "§YTodos os traços já concluídos na $FRA_dcn_manufacturer$ serão transferidos para a $FRA_naval_group_naval_manufacturer$§!"
 FRA_nexter_manufacturer: "GIAT Industries"
 FRA_nexter_merge: "A Nexter foi fundida com a KMW em 2015"
 FRA_nexter_cold_war_legacy: "Legado da Guerra Fria"
 FRA_nexter_scorpion_programme: "Programa Scorpion"
 FRA_nexter_firepower_ammo: "Poder de Fogo e Munição"
 FRA_nexter_manufacturer_trait: "Doutrina de Poder de Fogo CAESAR"
 FRA_nexter_manufacturer_trait_desc: "Das forjas do arsenal de Bourges ao obuseiro CAESAR montado em caminhão, a Nexter construiu sua reputação em poder de fogo rápido e preciso entregue por plataformas leves sobre lagartas e rodas."
 FRA_nexter_leclerc_programme: "Programa Leclerc"
 FRA_nexter_leclerc_programme_desc: "O Leclerc é o principal carro de combate da Nexter, desenvolvido a partir do final dos anos 1970 e entrando em serviço em 1992. Seu autoloader e blindagem modular estabeleceram o padrão da doutrina blindada francesa."
 FRA_nexter_leclerc_mk2: "Leclerc Série 2"
 FRA_nexter_leclerc_mk2_desc: "A revisão da Série 2 introduziu ar-condicionado híbrido, eletrônica atualizada e pacotes de blindagem compósita aprimorados, estendendo a vida útil da plataforma até a década de 2020."
 FRA_nexter_leclerc_xlr: "Modernização Leclerc XLR"
 FRA_nexter_leclerc_xlr_desc: "A atualização de meia-vida XLR reconstruiu o Leclerc em torno de uma estação de armas remota, kits de blindagem modular e integração de gestão de batalha SCORPION, mantendo-o competitivo diante de projetos de MBT mais novos."
 FRA_nexter_vbci: "VBCI, IFV sobre Rodas"
 FRA_nexter_vbci_desc: "O Véhicule Blindé de Combat d'Infanterie deu ao Exército Francês seu primeiro IFV moderno sobre rodas. A produção começou em 2008 e a plataforma se tornou a espinha dorsal da mobilidade blindada dos regimentos motorizados."
 FRA_nexter_famas: "Fuzil de Serviço FAMAS"
 FRA_nexter_famas_desc: "O fuzil de assalto bullpup FAMAS serviu como arma padrão da infantaria francesa a partir de 1981. A linha de armas leves da Nexter nasceu de sua produção e dos contratos de suporte contínuo."
 FRA_nexter_scorpion_core: "Combate Integrado Scorpion"
 FRA_nexter_scorpion_core_desc: "O programa Scorpion, formalizado em 2014, interligou a nova família de combate sobre rodas do Exército Francês sob um sistema comum de gestão de batalha e uma espinha dorsal digital."
 FRA_nexter_griffon: "VBMR Griffon"
 FRA_nexter_griffon_desc: "O Griffon é o transportador tático multifunção de seis rodas da família Scorpion, substituindo o VAB como veículo blindado de transporte de pessoal padrão da França."
 FRA_nexter_jaguar: "EBRC Jaguar"
 FRA_nexter_jaguar_desc: "O veículo de reconhecimento e combate de seis rodas Jaguar monta um canhão CTA de 40mm e mísseis Akeron MP, herdando conceitos de poder de fogo comprovados no Leclerc."
 FRA_nexter_serval: "VBMR-L Serval"
 FRA_nexter_serval_desc: "O leve Serval de quatro rodas estende a mobilidade Scorpion a variantes de forças especiais, patrulha e comando, com um casco compacto de alumínio."
 FRA_nexter_40cta: "Canhão 40 CTA"
 FRA_nexter_40cta_desc: "Desenvolvido em conjunto com a BAE Systems por meio da CTA International, o canhão de munição telescopada de 40mm entrega poder de fogo antiblindagem compacto e de alta velocidade em toda a frota Scorpion."
 FRA_nexter_caesar: "Plataforma CAESAR 155mm"
 FRA_nexter_caesar_desc: "O obuseiro de 155mm montado em caminhão CAESAR combina mobilidade estratégica com fogo preciso de longo alcance, tornando-se a plataforma de artilharia de exportação mais bem-sucedida da Nexter."
 FRA_nexter_eurenco: "Propelentes EURENCO"
 FRA_nexter_eurenco_desc: "A EURENCO fornece os propelentes, explosivos e materiais energéticos que sustentam a munição de artilharia e de armas leves francesa, vinculando a produção da Nexter a uma cadeia de suprimentos segura a montante."
 FRA_nexter_nbc_sys: "Kit CBRN NBC-Sys"
 FRA_nexter_nbc_sys_desc: "A subsidiária NBC-Sys é especializada em equipamentos de detecção e descontaminação química, biológica, radiológica e nuclear para forças francesas e de exportação."
 FRA_nexter_lu_family: "Projéteis da Família LU"
 FRA_nexter_lu_family_desc: "A família de projéteis de 155mm LU211 e LU amplia o alcance da artilharia por meio de base-bleed e aerodinâmica aprimorada, padronizando fogos de longo alcance em tubos compatíveis com a OTAN."
 FRA_nexter_bonus: "Munição Inteligente BONUS"
 FRA_nexter_bonus_desc: "O projétil de 155mm BONUS com espoleta de sensor lança submunições autodirigidas contra colunas blindadas, dando às unidades de artilharia capacidade antiblindagem de precisão a partir de obuseiros comuns."
 FRA_renault_manufacturer: "Renault Trucks Defense"
