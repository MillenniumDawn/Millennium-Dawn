 helicopter_heavy_chassis: "중량 헬리콥터 차체"
 helicopter_heavy_chassis_desc: "크고 무거운 헬리콥터를 위한 중량 수송 헬리콥터 차체입니다."
 helicopter_medium_chassis: "중형 헬리콥터 차체"
 helicopter_medium_chassis_desc: "수송 헬리콥터 또는 무장 헬리콥터를 위한 중형 헬리콥터 차체입니다."
 helicopter_light_chassis: "경량 헬리콥터 차체"
 helicopter_light_chassis_desc: "경량 건십 및 정찰 헬리콥터를 위한 경량 헬리콥터 차체입니다."
 mast_mounted_camera: "마스트 탑재형 카메라"
 mast_mounted_camera_desc: "로터 조립체 상단에 장착되는 헬리콥터용 카메라 및 레이저 표적 지정 체계입니다."
 mast_mounted_radar: "마스트 탑재형 레이다"
 mast_mounted_radar_desc: "로터 허브 위에 장착되는 소형 사격 통제 레이더로, 엄폐물 뒤에 머문 채 표적을 탐지하고 교전할 수 있게 합니다. 다수의 표적을 동시에 추적하고 레이더 유도 탄약을 유도할 수 있습니다. 복잡한 지형에서 상황 인식과 생존성을 높여 줍니다."
 light_helicopter_armor_gen1: "1st Generation Light Helicopter Armor"
 light_helicopter_armor_gen1_desc: "초기 공격 헬리콥터의 장갑 방식은 소화기 사격과 파편으로부터 보호하기 위해 조종석, 핵심 부품, 중요 체계 주변에 장갑을 두른 것이었습니다."
 light_helicopter_armor_gen2: "2세대 경량 헬리콥터 장갑"
 light_helicopter_armor_gen2_desc: "복합 장갑의 발명과 통합으로 공격 헬리콥터의 장갑 방식이 이제 추가적인 방호력을 제공합니다. 반응 장갑 방식도 사용되기 시작하여 더욱 높은 방호력을 제공합니다."
 light_helicopter_armor_gen3: "3세대 경량 헬리콥터 장갑"
 light_helicopter_armor_gen3_desc: "장갑 기술과 교리의 발전으로 특정 임무 유형에 맞춘 모듈식 장갑 방식이 등장하였습니다."
