 stealth_destroyer_1: "Destructor furtivo 2015"
 stealth_destroyer_1_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
 stealth_destroyer_2: "Destructor furtivo 2030"
 stealth_destroyer_2_desc: "Changes in modern technology of warfare have caused more advanced fleets to look for new answers for survivability in their fleets. Stealth Destroyers have become a preeminent focus. Keeping hidden from advanced enemy sensors and radars means these powerful weapons can strike closer, quicker, and with increased lethality, with the added bonus of increased survivability in modern conflicts."
