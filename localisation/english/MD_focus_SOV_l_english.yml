 SOV_fd_fund_central_1: "Moscow Oblast Industrial Parks"
 SOV_fd_fund_central_1_desc: "Warehouses, assembly halls and light industry along the ring roads, financed from the federal budget and a regional transfer.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Central okrug."
 SOV_fd_fund_central_2: "Moscow Data Corridors"
 SOV_fd_fund_central_2_desc: "Fiber trunks and exchange points for the capital region, paid for as a joint federal and city project.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Central okrug."
 SOV_fd_governor_central: "Kremlin Governor: Central"
 SOV_fd_governor_central_desc: "Replace the weaker governors in the Central okrug with Kremlin appointees from the Presidential Administration.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 SOV_fd_fund_northwest_1: "Sevmash Slipway Extension"
 SOV_fd_fund_northwest_1_desc: "A new covered slipway at Severodvinsk, with the regional transfer covering housing for the workers it brings.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Northwest okrug."
 SOV_fd_fund_northwest_2: "Leningrad Ring Road"
 SOV_fd_fund_northwest_2_desc: "Freight bypasses around St. Petersburg so that port traffic stops using city streets.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Northwest okrug."
 SOV_fd_governor_northwest: "Kremlin Governor: Northwest"
 SOV_fd_governor_northwest_desc: "Send a Kremlin-approved governor to the northwestern oblasts, where local factions have drifted from Moscow.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 SOV_fd_fund_south_1: "Rostov Machinery Plants"
 SOV_fd_fund_south_1_desc: "Combine harvester and rail car works around Rostov-on-Don, tied to the grain harvest.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the South okrug."
 SOV_fd_fund_south_2: "Kuban Grain Complex"
 SOV_fd_fund_south_2_desc: "Irrigation, silos and a rail spur to the Black Sea ports for the Kuban harvest.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the South okrug."
 SOV_fd_governor_south: "Kremlin Governor: South"
 SOV_fd_governor_south_desc: "Install a governor from the federal ministries in the southern oblasts, over the heads of the Cossack lobbies.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 SOV_fd_fund_north_caucasus_1: "Dagestan Jobs Program"
 SOV_fd_fund_north_caucasus_1_desc: "Workshops and processing plants in Dagestan, aimed at young men who would otherwise leave or join the underground.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the North Caucasus okrug."
 SOV_fd_fund_north_caucasus_2: "Kabardino-Balkaria Orchards"
 SOV_fd_fund_north_caucasus_2_desc: "Orchards, greenhouses and a juice plant in the foothills, run through local cooperatives.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the North Caucasus okrug."
 SOV_fd_governor_north_caucasus: "Kremlin Governor: North Caucasus"
 SOV_fd_governor_north_caucasus_desc: "Replace a republic head with a Kremlin appointee. The clans will notice, and so will the street.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 SOV_fd_fund_volga_1: "Samara Aerospace Works"
 SOV_fd_fund_volga_1_desc: "Expand the Samara engine and rocket plants with federal defense orders.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Volga okrug."
 SOV_fd_fund_volga_2: "Kazan IT Park"
 SOV_fd_fund_volga_2_desc: "Extend the Innopolis campus and the fiber links that feed it.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Volga okrug."
 SOV_fd_governor_volga: "Kremlin Governor: Volga"
 SOV_fd_governor_volga_desc: "Place a federal governor beside the republic presidents of the Volga. Kazan and Ufa will read it as a warning.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 SOV_fd_fund_urals_1: "Uralvagonzavod Retooling"
 SOV_fd_fund_urals_1_desc: "New machine halls for the tank plant at Nizhny Tagil.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Urals okrug."
 SOV_fd_fund_urals_2: "Khanty-Mansi Winter Roads"
 SOV_fd_fund_urals_2_desc: "All-season roads to the oil fields so that crews and rigs stop waiting for the ice to freeze.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Urals okrug."
 SOV_fd_governor_urals: "Kremlin Governor: Urals"
 SOV_fd_governor_urals_desc: "Name a governor trusted by the Urals industrial directors and the Kremlin alike.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 SOV_fd_fund_siberia_1: "Krasnoyarsk Smelter Line"
 SOV_fd_fund_siberia_1_desc: "A new aluminum and machinery line in Krasnoyarsk, cheaper to run on Yenisei hydropower.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Siberia okrug."
 SOV_fd_fund_siberia_2: "Akademgorodok Network"
 SOV_fd_fund_siberia_2_desc: "Data links and a computing center for the Novosibirsk science town.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Siberia okrug."
 SOV_fd_governor_siberia: "Kremlin Governor: Siberia"
 SOV_fd_governor_siberia_desc: "Appoint a governor from outside the Siberian regional elite, to break up the oblast-level networks.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 SOV_fd_fund_far_east_1: "Zvezda Shipyard Phase Two"
 SOV_fd_fund_far_east_1_desc: "Add a slipway at Bolshoy Kamen, the shipyard meant to keep the Pacific Fleet supplied.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Far East okrug."
 SOV_fd_fund_far_east_2: "Khabarovsk Rail Bypass"
 SOV_fd_fund_far_east_2_desc: "Second tracks and a bypass on the Trans-Siberian approaches to Khabarovsk.\n\nThe project pays a regional transfer on top of the building cost, and raises the loyalty of the Far East okrug."
 SOV_fd_governor_far_east: "Kremlin Governor: Far East"
 SOV_fd_governor_far_east_desc: "Appoint a Moscow-picked governor to the Far East. The region has seen too many Moscow-picked men leave early.\n\nCosts political power. The okrug becomes more loyal, but the appointment is unpopular at home."
 sov_regions.2.t: "Kazan Wants Its Treaty Back"
 sov_regions.2.d: "The State Council of Tatarstan has voted to restore the language of the 1994 power-sharing treaty to its constitution. Federal prosecutors call the vote unconstitutional. The republic's deputies say they only want the old rights written down again."
 sov_regions.2.a: "Sign a new treaty on shared powers"
 sov_regions.2.b: "Pay Kazan off with federal transfers"
 sov_regions.2.c: "Send the prosecutors and the envoy"
 sov_regions.3.t: "Vladivostok Counts in Yuan"
 sov_regions.3.d: "Markets in Primorye now price timber, seafood and rent in yuan. Local officials complain that every ruble sent from Moscow buys less than a Chinese trader's offer across the river. The governor has stopped answering calls from the capital."
 sov_regions.3.a: "Subsidize the ports and the Pacific airline"
 sov_regions.3.b: "Let the yuan trade zone stand"
 sov_regions.3.c: "Send the tax inspectors and the FSB"
 sov_regions.4.t: "Attacks on Police Posts"
 sov_regions.4.d: "Gunmen have hit police posts in Dagestan and Ingushetia in the same week. The local ministries blame outside fighters, while the districts' own elders say young men have run out of jobs and patience."
 sov_regions.4.a: "Impose curfews and send the National Guard"
 sov_regions.4.b: "Fund a jobs and housing package"
 sov_regions.4.c: "Make a deal with the clan leaders"
 sov_regions.5.t: "Rail Tariffs and the Baikal Plant"
 sov_regions.5.d: "Rallies in Krasnoyarsk and Irkutsk have grown from a few hundred people to several thousand. They object to rail tariffs, a pulp plant on Lake Baikal, and to governors who live in Moscow half the year."
 sov_regions.5.a: "Roll back the tariffs and shelve the plant"
 sov_regions.5.b: "Wait it out"
 sov_regions.6.t: "The Shies Landfill Rally"
 sov_regions.6.d: "Residents of the Arkhangelsk region are protesting against a waste site built to take Moscow's rubbish. The governor says the project was approved at federal level. Activists have set up a camp along the rail line and say they will not leave."
 sov_regions.6.a: "Cancel the landfill and pay for the cleanup"
 sov_regions.6.b: "Press ahead and fine the organizers"
 sov_regions.7.t: "The Tractor Convoy"
 sov_regions.7.d: "Farmers from the Kuban and the Don have driven their tractors toward Moscow after a poor harvest and unpaid subsidies. Traffic police have stopped them outside the oblast boundary and the evening news shows them parked on the shoulder."
 sov_regions.7.a: "Release grain subsidies"
 sov_regions.7.b: "Order road blocks and prosecute the drivers"
 sov_regions.8.t: "Cathedral on the Pond"
 sov_regions.8.d: "Plans to build a cathedral in a public park in Yekaterinburg have brought thousands of residents out. The Urals directors' association has quietly told the Kremlin that the governor is making a mess of the region."
 sov_regions.8.a: "Cancel the project and replace the governor's staff"
 sov_regions.8.b: "Let the police clear the square"
 sov_regions.9.t: "Renovation Protests in the Capital Region"
 sov_regions.9.d: "A mass housing demolition plan has brought crowds into the streets of Moscow and the surrounding oblasts. City hall insists the new buildings will be better. The tenants point out that nobody asked them."
 sov_regions.9.a: "Rewrite the plan and pay residents more"
 sov_regions.9.b: "Press ahead with the demolition"
 sov_regions.10.t: "The Eastern Economic Forum"
 sov_regions.10.d: "Vladivostok has become the most reliable partner Moscow has in the east. Investors from Korea, Japan and China crowd the forum, and the governor is asking for a second port terminal."
 sov_regions.10.a: "Sign the investment deals"
 sov_regions.10.b: "Announce a new Pacific program in the Kremlin's name"
 sov_regions.11.t: "The Order Book at Nizhny Tagil"
 sov_regions.11.d: "Uralvagonzavod is working three shifts, with suppliers lining up from Chelyabinsk to Perm. Its director has asked the Kremlin to approve a new machine shop."
 sov_regions.11.a: "Fund a new assembly hall"
 sov_regions.11.b: "Take the dividends and let the plant run as is"
 sov_regions.12.t: "Kazan and Samara Show the Way"
 sov_regions.12.d: "Tatarstan and Samara are growing faster than almost any region in the federation, and are happy to say so. Ministers fly in to see the technology park, the new engine plant and the school reforms."
 sov_regions.12.a: "Let the regions share the credit"
 sov_regions.12.b: "Take the credit in Moscow"
 SOV_fd_event_central_up_tt: "Central okrug loyalty rises."
 SOV_fd_event_central_down_tt: "Central okrug loyalty falls."
 SOV_fd_event_northwest_up_tt: "Northwest okrug loyalty rises."
 SOV_fd_event_northwest_down_tt: "Northwest okrug loyalty falls."
 SOV_fd_event_south_up_tt: "South okrug loyalty rises."
 SOV_fd_event_south_down_tt: "South okrug loyalty falls."
 SOV_fd_event_north_caucasus_up_tt: "North Caucasus okrug loyalty rises."
 SOV_fd_event_north_caucasus_down_tt: "North Caucasus okrug loyalty falls."
 SOV_fd_event_volga_up_tt: "Volga okrug loyalty rises."
 SOV_fd_event_volga_down_tt: "Volga okrug loyalty falls."
 SOV_fd_event_urals_up_tt: "Urals okrug loyalty rises."
 SOV_fd_event_urals_down_tt: "Urals okrug loyalty falls."
 SOV_fd_event_siberia_up_tt: "Siberia okrug loyalty rises."
 SOV_fd_event_siberia_down_tt: "Siberia okrug loyalty falls."
 SOV_fd_event_far_east_up_tt: "Far East okrug loyalty rises."
 SOV_fd_event_far_east_down_tt: "Far East okrug loyalty falls."
 SOV_federal_districts_category: "Federal Districts"
 SOV_federal_districts_category_desc: "Fund projects and appoint governors to keep the okrugs loyal. Every okrug loses loyalty each month, and a restless one sends trouble to Moscow.\n\nCentral: §Y[?SOV_fd_loyalty_central|0]§!  Northwest: §Y[?SOV_fd_loyalty_northwest|0]§!  South: §Y[?SOV_fd_loyalty_south|0]§!  North Caucasus: §Y[?SOV_fd_loyalty_north_caucasus|0]§!\nVolga: §Y[?SOV_fd_loyalty_volga|0]§!  Urals: §Y[?SOV_fd_loyalty_urals|0]§!  Siberia: §Y[?SOV_fd_loyalty_siberia|0]§!  Far East: §Y[?SOV_fd_loyalty_far_east|0]§!"
 SOV_federal_districts_modifier: "Federal Districts"
 SOV_federal_districts_modifier_desc: "Average okrug loyalty sets this modifier. Fifty is neutral, a higher average helps and a lower one hurts.\n\nCentral: §Y[?SOV_fd_loyalty_central|0]§!  Northwest: §Y[?SOV_fd_loyalty_northwest|0]§!  South: §Y[?SOV_fd_loyalty_south|0]§!  North Caucasus: §Y[?SOV_fd_loyalty_north_caucasus|0]§!\nVolga: §Y[?SOV_fd_loyalty_volga|0]§!  Urals: §Y[?SOV_fd_loyalty_urals|0]§!  Siberia: §Y[?SOV_fd_loyalty_siberia|0]§!  Far East: §Y[?SOV_fd_loyalty_far_east|0]§!"
 SOV_kazakhstan_axis: "The Kazakhstan Axis"
 SOV_kazakhstan_axis_desc: "Astana can still say no. We lease Baikonur, buy uranium and offer joint offices in the capital, because a Kazakhstan that looks to China is our worst case."
 SOV_uzbekistan_axis: "Tashkent and Karshi-Khanabad"
 SOV_uzbekistan_axis_desc: "Uzbekistan hosted an American airbase until 2005 and has remained wary of Moscow since. We offer a joint arms factory and plans for a quick intervention if the Fergana Valley burns."
 SOV_turkmenistan_gas: "Turkmen Gas"
 SOV_turkmenistan_gas_desc: "Ashgabat sells most of its gas to Gazprom, and it would sell elsewhere if given the chance. We pay a fair price and invest in its fields."
 SOV_eaeu_treaty: "The Eurasian Economic Union"
 SOV_eaeu_treaty_desc: "Astana signs in May 2014, and the others are invited to follow. Each member that joins gives us a market and gives Moscow a voice in its budget."
 SOV_azerbaijan_balance: "Court Baku"
 SOV_azerbaijan_balance_desc: "Azerbaijan pays in oil money and buys Russian arms, and Gabala radar is in its hands. We sell to Baku and leave Yerevan to find another patron."
 SOV_frozen_conflicts: "Frozen Conflicts"
 SOV_frozen_conflicts_desc: "Abkhazia, South Ossetia and Transnistria keep their neighbors from drifting west. We keep them frozen and decide later whether to thaw them."
 SOV_abkhazia_integration: "Passports and Rail to Sukhumi"
 SOV_abkhazia_integration_desc: "Russian passports for the population, a railway through Gagra, and a military base outside Gudauta. Abkhazia and South Ossetia become Russian protectorates, and Tbilisi calls it annexation."
 SOV_peace_enforcement: "Peace Enforcement"
 SOV_peace_enforcement_desc: "Georgia has no NATO guarantee yet, and Tbilisi can still be shown the cost of provoking us. We offer terms and keep the wargoal ready for August."
 SOV_kozak_memorandum: "The Kozak Memorandum"
 SOV_kozak_memorandum_desc: "Dmitry Kozak drafted a federation for Moldova in 2003, with Transnistria as a veto player and Russian troops staying for twenty years. Chisinau balked at the last minute in the original. This time we ask again."
 SOV_recognize_transnistria: "Recognize Transnistria"
 SOV_recognize_transnistria_desc: "Tiraspol has held a referendum for union with Russia since 2006 and has no recognition from anyone. We grant it, and Chisinau gets a reason to keep one eye on the Dniester."
 SOV_cuba_return: "Return to Cuba"
 SOV_cuba_return_desc: "Lourdes was closed in 2001. Havana would take us back, and Washington would notice."
 SOV_vietnam_camranh: "Cam Ranh Bay"
 SOV_vietnam_camranh_desc: "We left in 2002 and the Vietnamese kept the pier. We ask to come back for repairs and port calls."
 SOV_libya_file: "The Libya File"
 SOV_libya_file_desc: "Tripoli owes us old debts and still wants our arms. We ask for berths at Benghazi and runways at Jufra in return."
 SOV_navalny_case: "The Navalny Case"
 SOV_navalny_case_desc: "Alexei Navalny survives a poisoning in August 2020, is treated in Berlin and is arrested on his return. His organizations are declared extremist. The legal route for the street opposition closes."
 SOV_prigozhin_mutiny: "The Prigozhin Mutiny"
 SOV_prigozhin_mutiny_desc: "On 23 June 2023 Wagner took Rostov-on-Don and a column drove up the M-4 toward Moscow. The Kremlin has a few hours to decide whether to buy, break or absorb the men who held Bakhmut."
 SOV_engineer_troops: "Engineer Troops"
 SOV_engineer_troops_desc: "Sappers, bridge-layers and mine-clearing companies are reformed into dedicated brigades with modern equipment. They keep the army moving after the front has stopped."
 SOV_logistics_brigades: "Material-Technical Support Brigades"
 SOV_logistics_brigades_desc: "Support brigades replace the improvised rail-and-truck system of the old divisions, so fuel and ammunition reach the front on schedule."
 SOV_manpads_stockpile: "Ground Forces Air Defense"
 SOV_manpads_stockpile_desc: "Igla and Verba man-portable missiles, plus Tor and Pantsir batteries, give every brigade its own umbrella. Short-range air defense has been neglected since the Soviet collapse."
 SOV_t90_mass: "T-90M Modernization"
 SOV_t90_mass_desc: "Uralvagonzavod rebuilds T-72 and T-90 hulls with new fire control, reactive armor and engines instead of building new tanks. It is the cheap way to keep thousands of tanks useful."
 SOV_iskander: "The Iskander Brigades"
 SOV_iskander_desc: "The 9K720 Iskander-M replaces the Tochka-U with a missile that reaches 500 kilometres and defeats most missile defences. Brigades go to every military district, and where they go is a political decision."
 SOV_lustration_fsb_files: "Open the Files"
 SOV_lustration_fsb_files_desc: "The FSB archives of the Soviet period are opened to historians and courts. Some files expose informers, and others show that well-known dissidents also talked. The service pushes back through leaks."
 SOV_wto_services: "WTO Services"
 SOV_wto_services_desc: "The accession protocol covers goods. Banks, insurance, telecoms and legal services open next, and foreign firms may take majority stakes. A competition service watches the largest domestic players."
 SOV_schengen_talks: "Schengen Talks"
 SOV_schengen_talks_desc: "Moscow and Brussels negotiate a visa-free regime for short stays. Russia has to accept readmission agreements and biometric passports. The queue outside the consulate shortens."
 SOV_gosbank: "Gosbank"
 SOV_gosbank_desc: "The Central Bank answers to the government again, and the commercial banks that grew up on 1990s budget money are folded into state credit. The treasury sees more tax revenue, and the bankers lose their independence."
 SOV_no_nato_east: "Not One Step East"
 SOV_no_nato_east_desc: "Radar stations in Kaliningrad and a new air defense belt around Smolensk mark the line the CPRF will not see crossed. Washington gets a note, and the western districts get concrete."
 SOV_union_talks: "Talks on a Union Treaty"
 SOV_union_talks_desc: "Zyuganov offers every former republic a seat at the table for a Union of Sovereign States, the draft Gorbachev never got to sign in August 1991. Each capital decides whether it wants to be a candidate."
 SOV_union_treaty: "The Treaty of Sovereign States"
 SOV_union_treaty_desc: "The final text goes to every candidate government. Signing means joint defense, a single customs area and a Moscow that no longer calls the shots alone, at least on paper."
 SOV_rise_of_the_new_ussr: "The New Union"
 SOV_rise_of_the_new_ussr_desc: "The Union of Sovereign States is proclaimed in the Grand Kremlin Palace with the treaty signatories in attendance. The flag is red again, and every signatory that came through the plan and the vote becomes a member of the Union."
 sov_opposition.1.t: "The Oligarchs Answer"
 sov_opposition.1.d: "The decree voiding the 1995 auctions is on the Prime Minister's desk. The owners of Norilsk and the oil majors have met at a dacha outside Moscow, and their lawyers have already been to the finance ministry. How the state takes the assets decides who pays for it."
 sov_opposition.1.a: "Seize the assets outright."
 sov_opposition.1.b: "Pay a negotiated buyout."
 sov_opposition.1.c: "Keep the resource barons on a short leash."
 sov_opposition.2.t: "The Politburo Reads the List"
 sov_opposition.2.d: "Hardliners in the Central Committee have drawn up a list of Politburo members who served Gorbachev and a second list of those who profited in the nineties. Zyuganov has to decide whether the lists become a purge, a warning, or a weapon against the men who wrote them."
 sov_opposition.2.a: "Remove the reformers from the Politburo."
 sov_opposition.2.b: "Retire a few names and keep the rest."
 sov_opposition.2.c: "Turn on the Stalinist old guard instead."
 sov_opposition.3.t: "The Patriarch and the Party"
 sov_opposition.3.d: "Patriarch Alexy II will bless a National-Patriotic government if it returns seized church buildings and drops the old atheist line. Veteran cadres are furious, but the Church is one of the few institutions that still fills a hall on a weekday."
 sov_opposition.3.a: "Return the buildings and sign a concordat."
 sov_opposition.3.b: "Offer tax relief but keep the property."
 sov_opposition.3.c: "The Party stays secular."
 sov_opposition.4.t: "Revolt in the LDPR Faction"
 sov_opposition.4.d: "Thirty LDPR deputies will not vote for the budget until the leadership explains who rewrote the party list. Zhirinovsky's aides say he intends to settle it on live television."
 sov_opposition.4.a: "Expel the rebels on air."
 sov_opposition.4.b: "Buy off the ringleaders with posts."
 sov_opposition.4.c: "Let the leader shout them down."
 sov_opposition.5.t: "The Governors Want Their Cut"
 sov_opposition.5.d: "Regional LDPR bosses have discovered that the party name sells better than the program. Several governors are offering generous donations to the party fund in return for a free hand in their regions."
 sov_opposition.5.a: "Take the money and look away."
 sov_opposition.5.b: "Take half and demand loyalty pledges."
 sov_opposition.5.c: "Refuse and send in the auditors."
 sov_opposition.6.t: "Demands of the Ultras"
 sov_opposition.6.d: "The radical wing of the party, the men who march behind banners on Tverskaya, now sit in the corridors of the Presidential Administration. Zhirinovsky promised them one post, and they are asking for three things."
 sov_opposition.6.a: "Hand them the Interior Ministry."
 sov_opposition.6.b: "Give them patriotic military training."
 sov_opposition.6.c: "Refuse and let them split."
 sov_opposition.7.t: "The Patriarch's Terms"
 sov_opposition.7.d: "The Holy Synod will anoint a sovereign, but not on the old terms. The Patriarchate wants a say in schools and marriage law, and it wants a written guarantee that the crown will not touch the parishes."
 sov_opposition.7.a: "Orthodoxy becomes the state religion."
 sov_opposition.7.b: "The Church is first among faiths, nothing more."
 sov_opposition.7.c: "The Church stays out of politics."
 sov_opposition.8.t: "The Law of Succession"
 sov_opposition.8.d: "The jurists have produced three drafts. The Salic draft limits the throne to sons, as under Paul I. The semi-Salic draft admits daughters when no male heir remains. The cognatic draft opens the throne to any descendant, including Grand Duchess Maria Vladimirovna."
 sov_opposition.8.a: "Sons only."
 sov_opposition.8.b: "Daughters only if no male heir remains."
 sov_opposition.8.c: "Any descendant may inherit."
 sov_opposition.9.t: "The Estates in Session"
 sov_opposition.9.d: "The Table of Ranks is drafted, and with it every corporation of the old empire wants its seat. The Synod asks for control of schools and marriage, the generals ask for a General Staff that answers to the crown alone, and the landed families want their provincial assemblies back."
 sov_opposition.9.a: "Side with the Synod."
 sov_opposition.9.b: "Side with the generals."
 sov_opposition.9.c: "Side with the nobility."
 sov_opposition.10.t: "Generals at the Palace"
 sov_opposition.10.d: "The Preobrazhensky Regiment is parading again, and the General Staff has noticed who commands it. A delegation of marshals asks whether the guard answers to the army or to the crown."
 sov_opposition.10.a: "The Guard answers to the sovereign."
 sov_opposition.10.b: "The Guard answers to the General Staff."
 sov_opposition.10.c: "Split command between the two."
 SOV_zhirinovsky_youth: "The Youth Wing"
 SOV_zhirinovsky_youth_desc: "LDPR youth cells open in every university and military enlistment office. They carry the party's slogans into places where television does not reach, and they supply the manpower for rallies and call-ups."
 SOV_cossack_revival: "Cossack Revival"
 SOV_cossack_revival_desc: "Kuban, Don and Terek hosts get legal status, uniforms and regimental chaplains. They also get a free hand against anyone the authorities call a provocateur, which is where the trouble starts."
 SOV_volunteer_corps: "Volunteer Corps"
 SOV_volunteer_corps_desc: "Regions raise battalions named after their governors and pay signing bonuses that outbid the factory floor. This unlocks the Bars reserve decisions."
 SOV_occupied_compliance: "The New Regions"
 SOV_occupied_compliance_desc: "Passports, Russian curricula and ruble salaries arrive in Kherson, Zaporizhzhia, Donetsk and Luhansk, annexed on 30 September 2022. Administration raises compliance in every non-core state we hold."
 SOV_occupation_compliance_tt: "Owned non-core states gain §Gcompliance§!. Cores still require the usual threshold. There is no free annexation shortcut."
 SOV_economic_tatneft: "Tatneft"
 SOV_economic_tatneft_desc: "Tatarstan's oil company, a refinery, and a republic that knows the rent. We keep it as a federal champion that happens to be Tatar. Not every barrel has to say Rosneft on the can."
 SOV_nashi_youth: "Nashi"
 SOV_nashi_youth_desc: "Nashi is founded in 2005 as a mass movement against any Ukrainian-style revolution. It runs summer camps at Lake Seliger and sends thousands to pro-government rallies."
 SOV_all_russia_popular_front: "The Popular Front"
 SOV_all_russia_popular_front_desc: "Founded in 2011, the Popular Front gathers trade unions, veterans and professional groups around Putin outside the party structure. It supplies candidates who do not carry United Russia's unpopular label."
 SOV_oligarchic_cabinet: "A Cabinet of Owners"
 SOV_oligarchic_cabinet_desc: "The tycoons stop lobbying and take the ministries themselves. Putin remains president, but the cabinet answers to the owners of Norilsk Nickel, Alfa and Lukoil. The siloviki are pushed out."
 SOV_old_gang_returns: "The Exiles Come Home"
 SOV_old_gang_returns_desc: "Boris Berezovsky in London and Vladimir Gusinsky in Spain and Israel have waited for this call. Their cases are dropped and their newspapers and TV channels are theirs again. The Kremlin gains allies and loses its claim to have ended the 1990s."
 SOV_restore_governor_elections: "Governors Return to the Ballot"
 SOV_restore_governor_elections_desc: "Governors return to the ballot in 2012, with a presidential filter on candidates. Protesters get a visible concession, and regional bosses have to campaign again."
 SOV_reform_from_above: "Reform from Above"
 SOV_reform_from_above_desc: "Medvedev's response to the winter protests eases party registration, lowers the Duma threshold and dismantles part of the vertical of power. Reformers call it a start. The siloviki call it an invitation."
 SOV_medvedev_second_term: "A Second Medvedev Term"
 SOV_medvedev_second_term_desc: "Medvedev stays in the Kremlin for a second term, and Putin remains prime minister. The economic bloc and Western governments welcome the choice, and the security services do not. We offer Washington a new reset."
 SOV_third_term: "Return in 2012"
 SOV_third_term_desc: "Putin returns as a candidate and Medvedev moves to the White House. The constitution is satisfied and the presidential term is now six years. Those who hoped for a second Medvedev term learn that the decision was made at the party congress."
 SOV_sahel_bases: "Sahel Bases"
 SOV_sahel_bases_desc: "After the French leave Mali and the Central African Republic, Russian contractors fill the gap. Gold, juntas and a long flight from Moscow."
 SOV_foreign_blr_price_tt: "Minsk may name a price first. We can pay it or lean on the oil duty."
 SOV_foreign_ukraine_cores_tt: "Russia gives up its claims to the Ukrainian east and south if Kyiv accepts the language accord."
 SOV_idea_csto_reaction_force: "CSTO Reaction Force"
 SOV_idea_csto_reaction_force_desc: "A standing battalion from each member state, and contingency plans for every capital on the map."
 SOV_idea_union_shield: "Union State Air Shield"
 SOV_idea_union_shield_desc: "One radar network, one command center in Minsk, and shared training."
 SOV_idea_customs_union: "Customs Union"
 SOV_idea_customs_union_desc: "A common external tariff and no border checks between members."
 SOV_eaeu_member_idea: "Eurasian Economic Union"
 SOV_eaeu_member_idea_desc: "One market for goods, capital and labor, with Moscow holding the largest vote."
 SOV_idea_no_reset_doctrine: "No Reset"
 SOV_idea_no_reset_doctrine_desc: "Washington is a rival until proven otherwise, and the public is told so."
 SOV_idea_reset_dividend: "Reset Dividend"
 SOV_idea_reset_dividend_desc: "Trade and investment from the West return for as long as the thaw lasts."
 SOV_middle_east_quad: "A Middle East Quad"
 SOV_middle_east_quad_desc: "A table with Iran, a Gulf capital and Damascus, where Washington does not sit. Tartus and Hmeimim give us a fleet and an airbase in the Levant if Assad agrees."
 SOV_pacific_claim_rhetoric: "Pacific Rhetoric"
 SOV_pacific_claim_rhetoric_desc: "Speeches about the ocean we already own and the islands someone else names. We put the navy behind the sentences, and Tokyo hardens its coast defenses."
 SOV_foreign_agent_law: "Foreign Agents"
 SOV_foreign_agent_law_desc: "The 2012 law requires NGOs that receive foreign money to register as foreign agents. Groups that refuse are fined or closed. Protest organizers lose their funding within a year."
 SOV_undesirable_orgs: "Undesirable Organizations"
 SOV_undesirable_orgs_desc: "A 2015 law lets prosecutors ban foreign organizations as undesirable, and anyone who works with them can be jailed. Western foundations, universities and media close their Russian offices."
 SOV_mir_cards: "Mir Cards"
 SOV_mir_cards_desc: "In March 2014 Visa and Mastercard stop serving two Russian banks. Parliament passes the national payment card law within a month and the first Mir cards ship in 2015. State employees and pensioners are paid through it by 2017."
 SOV_spfs: "SPFS"
 SOV_spfs_desc: "The Central Bank builds its own SWIFT-style messaging system in 2014 after the first threats of disconnection. Belarus and Kazakhstan are the first banks to join. It carries a fraction of the volume, but it does not switch off."
 SOV_cbrf_reserves: "Central Bank Reserves"
 SOV_cbrf_reserves_desc: "By August 2008 the Bank of Russia holds close to 600 billion dollars in currency and gold, the third largest hoard in the world. We stop treating the figure as a trophy and start counting what it can buy in a crisis."
 SOV_budget_rule: "The Fiscal Rule"
 SOV_budget_rule_desc: "Kudrin's rule fixes a cut-off oil price in the budget and sends everything above it to the reserve. Ministers who want to spend are unhappy. Under a reformist government it also carries the pension age reform. This closes the windfall path."
 SOV_windfall_spending: "Spend the Windfall"
 SOV_windfall_spending_desc: "Oil at 100 dollars a barrel. The Duma wants roads, the generals want contracts and the governors want grants. We open the Stabilization Fund and put the money to work now. The fund spirit is spent and the economy gets its growth, but nothing stays in the reserve for a bad year."
 SOV_romanov_restoration: "The Romanov Question"
 SOV_romanov_restoration_desc: "The house did not vanish in 1918. A monarchist majority can invite it back as a working crown, but the Church, the army and the landed families each expect to be consulted before anyone is anointed."
 SOV_invite_the_house: "Invite the House of Romanov"
 SOV_invite_the_house_desc: "Delegations go to Madrid, Paris and Saint Petersburg to meet the dynasty's branches. Nobody on the Duma benches is sure which of them is the legitimate one."
 SOV_holy_synod: "The Holy Synod"
 SOV_holy_synod_desc: "The Patriarchate has been waiting since 1917 for a sovereign it can crown. It sends a list of conditions along with its blessing."
 SOV_act_of_succession: "Act of Succession"
 SOV_act_of_succession_desc: "The jurists draft a succession law, and the first article decides which Romanov can inherit. Paul I's rule from 1797 and the claims made since 1992 point in different directions."
 SOV_constitutional_crown: "The Constitutional Crown"
 SOV_constitutional_crown_desc: "The emperor reigns within a written constitution, with a parliament that holds the budget and a court that answers to law. The nobility accepts it. The Church and the generals accept it more slowly."
 SOV_absolute_crown: "The Absolute Crown"
 SOV_absolute_crown_desc: "The sovereign's word is the law, and the ministers are his servants. Supporters call it a return to the order that built the empire, and critics note how it ended."
 SOV_imperial_duma: "The Imperial Duma"
 SOV_imperial_duma_desc: "A restored Duma meets under the crown with two chambers and an electoral law that favors property and rank. It is a real legislature, but it knows who can dissolve it."
 SOV_zemstvo_reform: "Zemstvo Reform"
 SOV_zemstvo_reform_desc: "Elected provincial councils return and take over schools, roads and local hospitals. They are cheaper than the governors' offices and sometimes more honest."
 SOV_state_council_empire: "The State Council"
 SOV_state_council_empire_desc: "Appointed councilors replace the old cabinet, and imperial governorates become possible in the near abroad. The council advises, and the emperor decides."
 SOV_imperial_chancellery: "His Majesty's Own Chancellery"
 SOV_imperial_chancellery_desc: "A Third Section for the twenty-first century, answering only to the throne. It reads the mail of ministers and generals, and the court sleeps better for it."
 SOV_table_of_ranks: "The Table of Ranks"
 SOV_table_of_ranks_desc: "Peter's fourteen grades are revived for the civil service, the army and the court. Every corporation of the old empire sends a petition asking for its seat in the new order."
 SOV_landed_nobility: "The Landed Nobility"
 SOV_landed_nobility_desc: "Provincial families get their estates and assemblies back, and an agricultural district is built in Ryazan to show what a restored squire class can do. They pay less tax than the state would like."
 SOV_service_nobility: "The Service Nobility"
 SOV_service_nobility_desc: "Rank and land are tied to officer service, as in Peter's day. The officer corps gets a caste, a pension and a reason to stay loyal to the crown."
 SOV_preobrazhensky_guard: "The Preobrazhensky Guard"
 SOV_preobrazhensky_guard_desc: "The oldest regiment of the guard parades again on the Champ de Mars. The General Staff has noticed who commands it."
 SOV_regimental_chaplains: "Regimental Chaplains"
 SOV_regimental_chaplains_desc: "Every regiment gets a priest on the payroll and a chapel on the parade ground. The Synod is delighted, and the officers are mostly resigned."
 SOV_petersburg_court: "The Petersburg Court"
 SOV_petersburg_court_desc: "The Winter Palace and the Gatchina residence are readied for a working court, with a ministry of the household attached. Petersburg becomes the seat of government on paper and a tourist attraction in practice."
 SOV_imperial_navy: "The Imperial Navy"
 SOV_imperial_navy_desc: "The Baltic and Black Sea fleets raise the Andreyevsky flag again, and a new dock opens for ships the budget can now afford to finish. Admirals remember what Tsushima cost."
 SOV_third_rome_doctrine: "The Third Rome"
 SOV_third_rome_doctrine_desc: "Moscow presents itself as protector of Orthodox peoples, from the Balkans to the Holy Land. Athens and Belgrade like the sound of it, and Constantinople is told to expect a visit."
 SOV_finland_diet: "The Finnish Diet"
 SOV_finland_diet_desc: "The Diet in Helsinki is invited to meet under the crown, with the autonomy it held before 1899. Helsinki is not sure whether this is a promise or a trap."
 SOV_dynastic_ties: "Cousins on the Thrones"
 SOV_dynastic_ties_desc: "The Romanovs are related to the royal houses of Britain, Denmark and Greece, and to the Spanish Bourbons by marriage. Court visits and state dinners are arranged, and the cousins are happy to be asked."
 SOV_coronation: "The Coronation"
 SOV_coronation_desc: "Assumption Cathedral, a crown, and a choice of which Romanov wears it. The flag changes, and the ministries mostly do not."
 SOV_imperial_manifesto: "The Manifesto on the Estates"
 SOV_imperial_manifesto_desc: "The new emperor issues a manifesto fixing the rights of the Church, the army and the nobility in law. What he grants in writing decides whether the crown is a settlement or an autocracy."
 SOV_idea_the_crown: "The Crown"
 SOV_idea_the_crown_desc: "A court and a succession. Power concentrates. The household costs money."
 SOV_idea_constitutional_crown: "Constitutional Monarchy"
 SOV_idea_constitutional_crown_desc: "The crown reigns. Paperwork still happens in a Duma."
 SOV_idea_absolute_crown: "Autocracy"
 SOV_idea_absolute_crown_desc: "The emperor is the government. Opposition is extra-legal."
 SOV_idea_imperial_guard: "Imperial Guard"
 SOV_idea_imperial_guard_desc: "Household troops with a modern establishment. They eat the personnel budget."
 SOV_idea_mass_draft: "Mass Conscription"
 SOV_idea_mass_draft_desc: "The twelve-month levy stays, and so does the manpower pool. Training suffers because there are always more conscripts than instructors."
 SOV_idea_contract_army: "Contract Soldiers"
 SOV_idea_contract_army_desc: "A professional core serves under contract, trains longer and costs more per soldier. The conscript intake shrinks to match."
 SOV_idea_housing_programme: "Housing Program"
 SOV_idea_housing_programme_desc: "Square meters as a majority. Mortgages and contractors on a federal clock."
 SOV_idea_nashi: "Nashi"
 SOV_idea_nashi_desc: "A street the party of power can fill so someone else does not."
 SOV_idea_nuclear_triad: "The Nuclear Triad"
 SOV_idea_nuclear_triad_desc: "Silos, bombers, and boats recapitalized as one deterrent."
 SOV_idea_csto_staff: "CSTO Staff"
 SOV_idea_csto_staff_desc: "A treaty with a staff and volunteers who can actually arrive."
 SOV_idea_kadyrov_deal: "The Kadyrov Deal"
 SOV_idea_kadyrov_deal_desc: "Chechnya is run by the Kadyrov family and sends fighters when Moscow asks. In return Moscow pays the bills and looks away. §RFederal transfers cost the treasury every month.§!"
 SOV_idea_kadyrovtsy: "Kadyrovtsy"
 SOV_idea_kadyrovtsy_desc: "The republic's own security forces fight as special forces and seldom lose a clan feud. Their loyalty belongs to the Kadyrov family first."
 SOV_idea_kadyrov_dynasty: "The Kadyrov Dynasty"
 SOV_idea_kadyrov_dynasty_desc: "Ramzan Kadyrov governs Chechnya as a personal fief, and Moscow has to pay more for the same quiet. §RThe transfers cost far more each month, and the republic's loyalty is no longer cheap.§!"
