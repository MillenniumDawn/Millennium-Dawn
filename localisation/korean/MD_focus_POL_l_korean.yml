 POL_six_year_plan_exceed_desc: "우리는 너무 욕심을 부렸습니다. 하지만 바로잡을 수 있습니다. 아무도 그 실수를 기억하지 못할 것입니다."
 POL_new_energy_laws_idea: "신 에너지법"
