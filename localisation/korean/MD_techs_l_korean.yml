 nsb_special_ammo_1: "기본 병기 개량"
 nsb_special_ammo_1_desc: "재래식 탄약을 개선하여 포탄 설계를 정교화하고 폭발 효율을 높입니다."
 nsb_special_ammo_2: "강화 탄약 개발"
 nsb_special_ammo_2_desc: "폭발 위력이 강화되고 공기역학적 설계가 최적화됩니다. 추진 체계와 기폭 장치의 발전으로 사거리, 정확도, 전반적인 효과가 높아져 다양한 표적에 대해 우수한 전장 성능을 보장합니다."
 nsb_special_ammo_3: "첨단 탄두 체계"
 nsb_special_ammo_3_desc: "다양한 전투 상황에서 충격을 극대화하도록 설계된 특수 탄두 기술입니다. 폭발 효율, 관통 능력, 적응형 신관의 혁신이 직사 및 면적 효과 운용 모두를 강화하여 살상력과 작전 유연성을 크게 향상시킵니다."
 nsb_barrel_conversions: "초기 포신 개조"
 nsb_barrel_conversions_desc: "초기 포신 개조는 기존 포신 설계를 변경하여 향상된 탄도 성능을 수용함으로써 포병 화력을 개선하는 첫걸음입니다. 이 개량은 포신 내구성을 높이고 탄환 속도를 개선하며 유효 사거리를 늘려, 더욱 일관되고 신뢰성 있는 포격을 가능하게 합니다. 강선 가공 기법을 정교화하고 포신 소재를 보강함으로써 이 개조는 명중률과 전반적인 효율을 높이고, 더욱 발전된 포병 개발의 토대를 마련합니다. 초기 제조 기술의 제약은 여전히 남아 있으나, 이 개선은 전장에서 포병 효율의 중대한 도약을 의미합니다."
 nsb_fire_modes_1: "표준 탄막 교리"
 nsb_fire_modes_1_desc: "표준 탄막 교리는 돌격 이전에 적 진지를 약화시키기 위한 사전 계획된 협동 사격 임무에 중점을 두는 포병전의 기본 접근법을 확립합니다. 이 교리는 계산된 사격 패턴으로 적 대형을 흩뜨리고, 방어 구조물을 파괴하며, 전진하는 부대에 기회를 창출합니다. 화력과 정확도 사이의 균형을 유지함으로써 과도한 탄약 소모 없이 효과적인 전장 제압을 보장합니다. 포화 사격 전술보다 강도는 낮지만, 표준 탄막 교리는 공격과 방어 작전 모두에서 지속적인 화력 지원을 제공하는 다재다능하고 신뢰할 수 있는 방식으로 남아 있습니다."
 nsb_fire_modes_2: "지속 사격 교리"
 nsb_fire_modes_2_desc: "지속 사격 교리는 장기간에 걸쳐 적군에 대한 압박을 유지하기 위해 지속적이고 체계적인 포격을 강조합니다. 화력을 꾸준히 공급함으로써 이 교리는 적의 기동을 방해하고, 반격을 억제하며, 장기 교전을 통해 방어 진지를 약화시킵니다. 소모전을 염두에 두고 설계되어 사격 속도와 탄약 보존의 균형을 맞춰 보급 효율을 극대화하며, 포병 부대가 장기 작전 내내 전투력을 유지할 수 있게 합니다. 대량 사격 전술만큼 즉각적으로 압도적이지는 않지만, 지속 사격은 적군과 사기를 점진적으로 약화시켜 전장 통제를 보장합니다."
 nsb_fire_modes_3: "우수 화력 지원 교리"
 nsb_fire_modes_3_desc: "우세 사격 지원 교리는 지속적이고 대규모인 포병 탄막으로 적 진지를 압도하는 데 중점을 둡니다. 정밀도보다 순수한 사격량을 우선시함으로써 이 교리는 끊임없는 포격을 통해 전장의 우위를 확보하고, 적군을 제압하며, 방어 시설을 파괴하고, 파괴적인 면적 효과를 만들어 냅니다. 협동 사격 임무로 여러 포병 부대가 지정 구역을 포화시켜 적을 방어 태세로 몰아넣고 기동성을 제한합니다. 자원 소모가 크지만, 이 교리는 장기 교전과 대규모 전쟁에서 매우 효과적이며 우월한 화력 우위를 보장합니다."
 nsb_AA_autocannon_1: "전후 기관포 개발"
 nsb_AA_autocannon_1_desc: "이 개발은 지상 및 대공 용도 모두를 위한 기관포의 정교화에 중점을 둡니다. 발사 속도, 탄약 효율, 포신 내구성이 향상되어 보병, 차량, 공중 위협을 더욱 효과적으로 제압할 수 있습니다. 향상된 탄도 공학이 통합되면서 이 신세대 기관포는 전장에서 뛰어난 신뢰성과 살상력을 제공합니다."
 nsb_AA_autocannon_2: "냉전기 기관포 개발"
 nsb_AA_autocannon_2_desc: "냉전기에 군사 기술이 발전하면서 현대적 기관포의 개발은 지상전과 공중전 모두에서 우선 과제가 되었습니다. 이 발전은 개선된 반동 관리, 더 높은 발사 속도, 더 나은 열 방출을 갖춘 정교한 설계를 도입하여 지속적인 교전을 가능하게 합니다. 향상된 표적 지정 체계와 개량된 탄약은 장갑 차량, 보병, 저공비행 항공기에 대한 효과를 더욱 높입니다. 이러한 혁신은 화력의 중대한 도약을 이루며, 빠르게 진화하는 전장에서 우수한 성능을 보장합니다."
 nsb_AA_autocannon_3: "현대 기관포 개발"
 nsb_AA_autocannon_3_desc: "냉전기의 발전을 바탕으로 한 현대 기관포 개발은 다양한 위협을 교전할 수 있는 고정밀 속사 무기에 중점을 둡니다. 이 차세대 기관포는 첨단 반동 보정, 향상된 내구성, 스마트 표적 지정 체계와의 통합을 특징으로 합니다. 프로그램 가능한 공중 폭발탄과 철갑탄을 비롯한 탄약 개선은 활용도를 더욱 높입니다. 뛰어난 정확도, 지속 사격 능력, 여러 플랫폼에 대한 적응성을 갖춘 이 무기들은 현대 보병 전투차, 항공기, 해군 체계의 중추를 이룹니다."
 nsb_AA_autocannon_4: "Advanced Autocannon Development"
 nsb_AA_autocannon_4_desc: "화력의 한계를 밀어붙이는 첨단 기관포 개발은 우수한 살상력, 정밀도, 적응력을 갖춘 최첨단 무기 체계를 도입합니다. 이 차세대 기관포는 자동 사격 통제 체계, 통합된 AI 보조 표적 지정, 다목적 능력을 특징으로 하여 보병, 장갑, 항공기, 드론을 효과적으로 교전할 수 있습니다. 전자기 추진, 고에너지 탄약, 적응형 탄종의 발전은 비할 데 없는 성능을 보장합니다. 감소한 반동, 더 높은 지속 발사 속도, 디지털 전쟁망과의 원활한 통합으로 이 무기들은 전장의 우위를 재정의합니다."
 nsb_SHORAD_missile_1: "전후 미사일 개발"
 nsb_SHORAD_missile_1_desc: "제2차 세계 대전 이후 미사일 기술이 발전하면서 더욱 정교한 단거리 및 장거리 유도 미사일 체계가 개발되었습니다. 이 연구는 개선된 추진 체계, 향상된 표적 지정 장치, 증가한 탄두 효과를 도입하여 더 높은 정밀도와 살상력을 가능하게 합니다. 단거리 미사일은 신속 대응이 가능한 전술 화력을 제공하고, 장거리 미사일은 교전 능력을 확장하여 먼 표적을 높은 정확도로 타격할 수 있게 합니다. 이러한 혁신은 현대 미사일전의 시작을 알리며 앞으로의 공중, 지상, 해상 교전을 형성합니다."
 nsb_SHORAD_missile_2: "냉전기 미사일 개발"
 nsb_SHORAD_missile_2_desc: "냉전기에는 미사일 기술이 급속히 발전하여 더욱 정밀하고 강력하며 다재다능한 미사일 체계가 만들어졌습니다. 이 개발은 유도 체계, 추진 효율, 탄두 효과를 개선하여 단거리 및 장거리 미사일 능력을 모두 향상시킵니다. 단거리 미사일은 즉각적인 전장 영향을 위한 전술 타격 수단을 제공하고, 장거리 미사일은 전략적 교전, 종심 타격, 억제 작전을 가능하게 합니다. 이러한 발전은 현대 미사일전의 토대를 마련하여 여러 군사 플랫폼에 걸쳐 공격 및 방어 능력을 모두 높입니다."
 nsb_SHORAD_missile_3: "Modern Missile Development"
 nsb_SHORAD_missile_3_desc: "현대 미사일 개발은 다양한 교전 거리에 걸쳐 정확도, 속도, 적응력을 높이는 데 중점을 둡니다. 이 발전은 첨단 유도 체계, 다단 추진, 모듈식 탄두를 통합하여 미사일이 공대공, 지대지, 해상전 상황에서 효과적으로 임무를 수행할 수 있게 합니다. 단거리 미사일은 이제 발사 후 망각 능력, 향상된 기동성, 개선된 표적 획득 능력을 갖추고, 장거리 미사일은 스텔스 기술, 정밀 타격 능력, 네트워크 표적 지정을 도입하여 우수한 효율을 발휘합니다. 이러한 발전은 현대 군대에 비할 데 없는 화력, 신속한 대응 능력, 전장에서의 전략적 우위를 제공합니다."
 nsb_SHORAD_missile_4: "Advanced Missile Systems"
 nsb_SHORAD_missile_4_desc: "현대전의 한계를 밀어붙이는 첨단 미사일 체계는 최첨단 기술을 통합하여 여러 전투 상황에서 속도, 정밀도, 적응력을 높입니다. 이 차세대 미사일은 극초음속 추진, AI 보조 표적 지정, 다목적 모듈식 탄두를 특징으로 하여 지상, 공중, 해상 표적을 전례 없는 정확도와 효율로 교전할 수 있습니다. 비행 중 경로 수정, 전자 대응 수단에 대한 저항력, 네트워크화된 전장 통합 능력으로 이 미사일은 우수한 살상력과 전략적 우위를 보장합니다. 장거리 개량형에는 이제 스텔스 코팅과 자율 군집 협동이 포함되어 차세대 군사 작전의 핵심 자산이 됩니다."
 nsb_dual_role_missile_1: "전후 겸용 미사일 개발"
 nsb_dual_role_missile_1_desc: "제2차 세계 대전 이후 미사일 기술이 발전하면서, 여러 전투 임무에 걸쳐 활용도와 효과를 높이기 위한 겸용 미사일이 개발되었습니다. 이 미사일은 지상과 공중 표적을 모두 교전하도록 설계되어, 군대에 다양한 전장 상황에 대한 비용 효율적이고 적응력 있는 해법을 제공합니다. 유도 체계, 추진 효율, 탄두 적응성이 개선됨에 따라 이 무기는 정확도, 사거리, 전술적 유연성을 높여 현대 합동 병종 전투에 필수적인 수단이 됩니다."
 nsb_dual_role_missile_2: "Cold-War Dual-Purpose Missile Development"
 nsb_dual_role_missile_2_desc: "냉전기 동안 미사일 기술의 발전은 지상과 공중 표적을 모두 정밀하고 유연하게 교전할 수 있는 겸용 미사일 체계의 개발로 이어졌습니다. 이 무기는 군사적 유연성을 높이도록 설계되어, 하나의 미사일 플랫폼이 여러 전투 임무를 수행하게 함으로써 보급 부담을 줄이고 전장 효율을 높였습니다. 개선된 유도 체계, 모듈식 탄두, 향상된 추진 체계를 갖춘 이 미사일은 현대전의 핵심 구성 요소가 되어 공격과 방어 작전 모두에서 신속 대응 능력을 가능하게 했습니다. 이들의 개발은 오늘날에도 군사 전략을 형성하는 다목적 미사일 교리의 길을 열었습니다."
 nsb_dual_role_missile_3: "Modern Dual-Purpose Missile Systems"
 nsb_dual_role_missile_3_desc: "현대전은 적응력과 효율이 높은 무기 체계를 요구하며, 이는 지상과 공중 표적을 정밀하고 다재다능하게 교전할 수 있는 겸용 미사일의 개발로 이어졌습니다. 이 첨단 미사일은 발사 후 망각 기술, 다중 모드 유도 체계(적외선, 레이더, GPS), 다양한 전투 상황에 맞게 조정할 수 있는 모듈식 탄두를 특징으로 합니다. 공대지, 공대공, 대함 임무를 수행할 수 있는 능력 덕분에 현대 군사 무기고의 핵심 구성 요소가 되어 전략 및 전술 작전을 모두 강화합니다. 스텔스 능력, 전자전 저항력, 실시간 표적 지정 통합을 갖춘 이 미사일은 모든 전장에서 비할 데 없는 유연성과 효율을 제공합니다."
 nsb_dual_role_missile_4: "Advanced Dual-Purpose Missile Systems"
 nsb_dual_role_missile_4_desc: "군사 기술이 발전함에 따라 첨단 겸용 미사일 체계는 정밀도, 적응력, 살상력의 한계를 넓힙니다. 이 차세대 미사일은 AI 보조 표적 지정, 다중 스펙트럼 유도(적외선, 레이더, 레이저, 위성 추적), 공중, 지상, 해상 위협에 자율적으로 맞추어 조정할 수 있는 적응형 탄두를 특징으로 합니다. 극초음속 추진, 향상된 기동성, 전자전 저항력을 갖춘 이 미사일은 대응 수단을 회피하고, 여러 표적을 동시에 타격하며, 치열하게 분쟁 중인 환경에서도 작전할 수 있습니다. 네트워크 중심전에 원활하게 통합되어 실시간 전장 협동을 보장하며, 미래 군사적 우위의 초석이 됩니다."
 nsb_defense_tech_4: "헬리콥터 레이저 하드킬 능동 보호 시스템 (APS Laser Hard-Kill)"
 nsb_defense_tech_4_desc: "날아오는 투사체를 물리적으로 무력화할 수 있는 지향성 에너지 방어 체계입니다. 고에너지 레이저를 발사하여 미사일을 명중 전에 파괴하거나 빗나가게 합니다. 회전익 항공기를 위한 최신 세대의 능동 방어를 대표합니다."
 armored_vehicle_tt: "이 기술을 연구하면 §YAPC§!, §YIFV§!, §YSPAA§!, §YMBT§! 등 모든 장갑 차량을 설계하고 건조할 수 있습니다."
 CAT_fortifications: "요새"
 CAT_naval_modules: "해군 모듈"
 CAT_naval_modules_research: "$CAT_naval_modules$ 연구"
 Early_APC_desc: "장갑차량 설계는 우리 장갑차량을 위한 다양한 설계 원칙을 아우릅니다. 설계 팀을 연구하고 이에 투자함으로써 주력 전차(MBT), 장갑 수송차(APC), 보병 전투차(IFV), 경장갑차(LAV), 다목적 차량을 설계하고 제작할 수 있게 됩니다."
 NAVAL_TITLE_CORVETTES: "초계함"
 NAVAL_TITLE_CORVETTES_DESC: "군함으로 간주되는 가장 작은 함급인 초계함은 일반적으로 원양 해군에 속하지 않습니다. 이 작고 빠른 함선은 보통 다양한 무기로 무장하여 여러 임무를 수행할 수 있습니다. 소형 및 중형 해군도 감당할 수 있는 가격 덕분에 많은 국가가 초계함을 운용합니다. 주로 연안 방어와 감시, 소해, 대잠, 대공, 대함, 그리고 현대에는 대지 공격 임무에 사용됩니다."
 NAVAL_TITLE_STEALTH_CORVETTES: "스텔스 초계함"
 NAVAL_TITLE_STEALTH_CORVETTES_DESC: "적에게 탐지되지 않도록 스텔스 특성을 갖춘 초계함입니다."
 NAVAL_TITLE_FRIGATES: "호위함"
 NAVAL_TITLE_FRIGATES_DESC: "많은 현대 해군의 중추를 이루는 호위함은 원양 해군 전력의 일부로 운용될 수 있습니다. 항속 거리가 길고 초계함급에 비해 더 큽니다. 대개 함대 방어 플랫폼으로 가장 많이 쓰이지만 함대 내에서 상당히 폭넓은 역할을 수행할 수 있으며, 다양한 역할과 상황(보다 공세적인 임무 포함)의 요구에 맞게 맞춤 구성할 수 있습니다. 주로 함대 방어, 대잠, 대공, 해상 호송 임무에 사용됩니다."
 NAVAL_TITLE_STEALTH_FRIGATES: "스텔스 호위함"
 NAVAL_TITLE_STEALTH_FRIGATES_DESC: "탐지 체계가 점점 더 발전함에 따라, 호위함이 탐지되기 어렵도록 스텔스 기술을 장착할 필요가 생겼습니다."
 NAVAL_TITLE_DESTROYERS_DESC: "함대, 호송대, 전투단에서 더 큰 함선을 호위하기 위해 만들어진 이 빠르고 기동성 좋으며 항속 거리가 긴 군함은 독자 작전도 똑같이 수행할 수 있습니다. 이후 세대는 다양하고 치명적인 유도 미사일, 순항 미사일, 기타 무기를 탑재한 명실상부한 다목적 군함입니다. 호위함이나 초계함보다 톤수가 더 크고 화력은 더 공세적이며 치명적입니다. 주로 함대 방어, 공세 임무, 대공, 대함, 대잠은 물론 탑재 장비에 따라 대지 공격 임무에 사용됩니다."
 NAVAL_TITLE_STEALTH_DESTROYERS: "스텔스 구축함"
 NAVAL_TITLE_STEALTH_DESTROYERS_DESC: "현대 전쟁 기술의 변화로 보다 발전된 함대들은 함대의 생존성을 높일 새로운 해답을 찾게 되었습니다. 스텔스 구축함이 가장 중요한 초점이 되었습니다. 적의 첨단 센서와 레이더에 노출되지 않는다는 것은 이 강력한 무기가 더 가까이, 더 빠르게, 더 높은 치사율로 타격할 수 있다는 뜻이며, 현대 분쟁에서 생존성이 높아지는 부수적 이점도 있습니다."
 NAVAL_TITLE_CRUISERS: "순양함"
 NAVAL_TITLE_CRUISERS_DESC: "일반적으로 현대 함대에서 (항공모함과 상륙 강습함을 제외하면) 가장 큰 공격 함선인 이 강력한 전력은 전 세계의 바다와 해역을 모두 커버할 수 있습니다. 역사적으로 (구축함이 수상전을 맡은 반면) 방공에 중점을 두었던 현대 순양함은 어떤 전투함보다도 막강한 무기 체계를 보유하고 있습니다. 순양함은 센서와 전투 관리 체계를 대량 수용할 수 있어 전투단 전체의 중심으로 쓰일 수 있습니다. 주로 지휘 통제, 대공, 대함, 대지 공격 임무에 사용됩니다."
 NAVAL_TITLE_BATTLESHIPS: "전함/순양전함"
 NAVAL_TITLE_BATTLESHIPS_DESC: "전함과 순양전함은 과거의 유물입니다. 한때 바다를 지배했지만 항공기와 미사일의 발전으로 소형 함선에도 손쉬운 표적이 되었습니다. 그러나 충분한 기술 발전이 이루어진다면 다시 한번 바다를 지배하게 만들 수도 있을 것입니다."
 NAVAL_TITLE_HELI_OPERATORS: "헬리콥터 운용함"
 NAVAL_TITLE_HELI_OPERATORS_DESC: "항공모함을 닮은 이 다목적 상륙 강습함은 생산과 인력 모두에서 훨씬 적은 비용으로 큰 타격력을 제공합니다. 헬리콥터와 STOVL(단거리 이륙 수직 착륙) 고정익 항공기는 물론 해병 강습정도 운용할 수 있으며, 다수가 웰 덱을 갖추어 적 진지에 대한 신속한 상륙 강습을 가능하게 합니다. 이 함선은 모든 상륙 작전에 막대한 지원 보너스를 제공합니다. 주로 지휘 통제, 대잠, 수상전, (고정익 항공기를 탑재한 경우) 항공전, 함포 지원 사격, 상륙 지원 임무에 사용됩니다."
 NAVAL_TITLE_CARRIERS_DESC: "이 떠다니는 공군 기지는 해군력의 정점으로, 세계의 대양으로 뻗어 나가 한 국가의 힘을 전 세계에 투사할 수 있습니다. 강대국의 피와 재산을 상징하는 이 엄청나게 귀중한 전력은 어떤 대가를 치르더라도 보호해야 합니다. 방대한 작전 범위 때문에, 해상에서 모든 작전 능력을 발휘하려면 진정한 원양 전투단이 필요합니다. 완전한 항모 전투단을 운용하는 국가는 자국 해군이 상징하는 바와 그것이 휘두르는 가공할 힘을 진정으로 자랑스러워할 수 있습니다. 주로 원거리 전력 투사, 항공전, 수상전, 상륙전에 사용됩니다."
 NAVAL_TITLE_ATTACK_SUBMARINES: "공격 잠수함"
 NAVAL_TITLE_ATTACK_SUBMARINES_DESC: "세계 대양의 소리 없는 살인자인 이 수중 전투 플랫폼은 은밀성, 정보 수집, 무기 체계 등 다양한 유용한 능력을 갖추고 있습니다. 공격 잠수함은 더 큰 잠수함보다 가까운 거리에서 적 잠수함과 함선을 상대하는 데 특화되어 있습니다."
 NAVAL_TITLE_MISSILE_SUBMARINES: "미사일 잠수함"
 NAVAL_TITLE_MISSILE_SUBMARINES_DESC: "세계 대양의 소리 없는 살인자인 이 수중 전투 플랫폼은 은밀성, 정보 수집, 무기 체계 등 다양한 유용한 능력을 갖추고 있습니다. 미사일 잠수함은 공격 잠수함보다 훨씬 뛰어난 능력을 갖도록 설계되었습니다."
 NAVAL_TITLE_SUB_ENGINES: "잠수함 엔진"
 NAVAL_TITLE_SUB_ENGINES_DESC: "잠수함은 일반적으로 추진과 내장 배터리 충전에 디젤 엔진을 사용합니다. 잠항 중에는 전기 엔진으로 작동합니다."
 NAVAL_TITLE_SYSTEM_ENGINEERING: "체계 공학"
 NAVAL_TITLE_SYSTEM_ENGINEERING_DESC: "체계 공학은 엔진, 전자 장비, 레이더 등 함선의 모든 보조 부분을 아우릅니다."
 NAVAL_TITLE_NUCLEAR_ENGINES: "원자력 엔진"
 NAVAL_TITLE_NUCLEAR_ENGINES_DESC: "원자력 엔진은 사실상 무제한의 연료를 갖고 있어, 승조원을 위한 보급품이 있는 한 우리 함선이 바다에서 계속 작전할 수 있게 합니다."
 NAVAL_TITLE_INTERNAL_DEFENSES: "사격 통제"
 NAVAL_TITLE_INTERNAL_DEFENSES_DESC: "사격 통제 컴퓨터는 적 함선을 조준하고 명중 벡터를 계산하는 역할을 합니다."
 NAVAL_TITLE_RADAR: "레이더"
 NAVAL_TITLE_RADAR_DESC: "레이더는 전파를 사용해 공중이나 수면의 물체를 탐지합니다. 레이더는 우리 함선이 표적을 탐지하고 식별하는 데 도움을 줍니다"
 NAVAL_TITLE_SONAR: "소나"
 NAVAL_TITLE_SONAR_DESC: "소나는 음파를 사용해 수중의 물체를 탐지합니다. 주로 잠수함 탐지에 사용되지만 기뢰, 어뢰를 탐지하거나 수심을 측정하는 데에도 쓸 수 있습니다."
 NAVAL_TITLE_ARMAMENT: "해군 무장"
 NAVAL_TITLE_ARMAMENT_DESC: "모든 함선은 바다에서 작전하려면 무기가 필요합니다. 함선은 처음에는 대형 포대를 주 무장으로 사용했지만, 소형 함선도 더 무거운 함선을 노릴 수 있는 여러 종류의 미사일로 무기가 빠르게 진화했습니다."
 NAVAL_TITLE_ASM: "대함 미사일"
 NAVAL_TITLE_ASM_DESC: "대함 미사일은 함선이 다른 함선에 맞서 사용하는 주된 무기입니다. 대함 미사일에는 수상 함선과 수중 함선을 모두 상대하는 미사일 체계가 포함됩니다."
 NAVAL_TITLE_AAMISSILES: "대공 미사일"
 NAVAL_TITLE_AAMISSILES_DESC: "대공 미사일은 우리 함선이 공중 표적에 대한 주된 방어 수단으로 사용합니다. 대공 미사일은 전통적인 지대공 미사일(SAM)이거나, 주로 날아오는 미사일에 대응하기 위한 회전 기체 미사일(RAM)일 수 있습니다."
 NAVAL_TITLE_VLS_SURFACE: "대지 수직 발사 체계"
 NAVAL_TITLE_VLS_SURFACE_DESC: "수직 발사 체계(VLS)는 함선의 선체에서 미사일을 수직으로 발사합니다. 이를 통해 함선은 사용 면적당 더 많은 미사일을 탑재할 수 있으며, 기존의 암 발사식 미사일에 비해 무기 체계의 레이더 반사 면적이 작습니다."
 NAVAL_TITLE_VLS_AIR: "대공 수직 발사 체계"
 NAVAL_TITLE_VLS_AIR_DESC: "수직 발사 체계(VLS)는 함선의 선체에서 미사일을 수직으로 발사합니다. 이를 통해 함선은 사용 면적당 더 많은 미사일을 탑재할 수 있으며, 기존의 암 발사식 미사일에 비해 무기 체계의 레이더 반사 면적이 작습니다."
 NAVAL_TITLE_TORPEDOES: "어뢰"
 NAVAL_TITLE_TORPEDOES_DESC: "어뢰는 함선을 상대로 쓰이는 수중 미사일입니다. 어뢰는 일반적으로 잠수함에서 발사되지만 함선이나 비행기에서도 발사할 수 있습니다."
 NAVAL_TITLE_LANDING_CRAFT: "상륙정"
 NAVAL_TITLE_LANDING_CRAFT_DESC: "어떤 종류의 상륙 강습이든 수행하려면 상륙정이 필요합니다. 고속정, 전용 상륙정, 호버크라프트, 혹은 한 번에 여러 차량을 상륙시킬 수 있는 거대한 함선일 수도 있습니다."
 battleship_hull_4: "2045년형 전함 선체"
 battleship_hull_4_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 battle_cruiser_hull_4: "2045년형 순양전함 선체"
 battle_cruiser_hull_4_desc: "수상함은 함대의 주요 구성 요소이며 전통적인 함대의 모든 해상 기능을 담당합니다."
 support_ship: "지원함"
 support_ship_hull: "지원함"
 support_ship_1: "지원함"
 support_ship_2: "개량형 지원함"
 repair_ship: "수리함"
 repair_ship_hull: "수리함"
 repair_ship_1: "수리함"
 repair_ship_2: "개량형 수리함"
 support_ship_hull_desc: "지원함은 함대에서 없어서는 안 될 역할을 합니다.\n\n§Y참고:§! 지원함은 해당 함정이 속한 함대에 해군 사기, 항속 거리, 최대 조직력을 제공합니다."
 support_ship_1_desc: "지원함은 함대에서 없어서는 안 될 역할을 합니다.\n\n§Y참고:§! 지원함은 해당 함정이 속한 함대에 해군 사기, 항속 거리, 최대 조직력을 제공합니다."
 support_ship_2_desc: "지원함은 함대에서 없어서는 안 될 역할을 합니다.\n\n§Y참고:§! 지원함은 해당 함정이 속한 함대에 해군 사기, 항속 거리, 최대 조직력을 제공합니다."
 repair_ship_hull_desc: "함정 수리가 해전에서 차지하는 역할을 과소평가해서는 안 됩니다.\n\n§Y참고:§! 수리함은 해당 함정이 속한 함대에 소모 감소, 치명타의 영향 감소, 함정 복구 확률 증가를 제공합니다."
 repair_ship_1_desc: "함정 수리가 해전에서 차지하는 역할을 과소평가해서는 안 됩니다.\n\n§Y참고:§! 수리함은 소모 감소, 치명타의 영향 감소, 함정 복구 확률 증가를 제공합니다."
 repair_ship_2_desc: "함정 수리가 해전에서 차지하는 역할을 과소평가해서는 안 됩니다. 개량형 수리함은 이전 버전의 능력을 확장하여 성능을 높였습니다.\n\n§Y참고:§! 수리함은 소모 감소, 치명타의 영향 감소, 함정 복구 확률 증가를 제공합니다."
 EQ_MOD_CAT_module_screen_fire_control_system_category_TITLE: "사격 통제 체계 (호위)"
 EQ_MOD_CAT_module_capital_fire_control_system_category_TITLE: "사격 통제 체계 (주력함)"
 module_screen_analog_fire_control: "아날로그 사격통제 체계"
 module_screen_analog_fire_control_desc: "아날로그 사격통제 체계는 수동으로 조작하는 체계라고 할 수 있습니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B스크린 함선§!"
 module_screen_digital_integrated_fire_control: "디지털 통합 사격통제 체계"
 module_screen_digital_integrated_fire_control_desc: "체계에 통합된 디지털 인터페이스는 함교에서 더 효과적인 지휘와 정비를 가능하게 합니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B스크린 함선§!"
 module_screen_advanced_integrated_missile_radar_control: "첨단 통합 미사일·레이더 통제"
 module_screen_advanced_integrated_missile_radar_control_desc: "첨단 통합 미사일·레이더 통제는 미사일과 레이더의 통합을 특징으로 하며, 다가오는 위협에 더 빠르고 정밀하게 대응할 수 있게 합니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B스크린 함선§!"
 module_screen_futuristic_integrated_missile_radar_control: "미래형 전투 정보 체계"
 module_screen_futuristic_integrated_missile_radar_control_desc: "미래형 전투 정보 체계는 머신러닝과 AI 기술을 도입하여 아음속, 초음속, 심지어 극초음속으로 날아오는 적 무기의 발사, 비행, 요격을 추적하는 함선의 능력을 향상시킵니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B스크린 함선§!"
 module_capital_analog_fire_control: "아날로그 사격통제 체계"
 module_capital_analog_fire_control_desc: "아날로그 사격통제 체계는 수동으로 조작하는 체계라고 할 수 있습니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B주력함§!"
 module_capital_digital_integrated_fire_control: "디지털 통합 사격통제 체계"
 module_capital_digital_integrated_fire_control_desc: "체계에 통합된 디지털 인터페이스는 함교에서 더 효과적인 지휘와 정비를 가능하게 합니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B주력함§!"
 module_capital_advanced_integrated_missile_radar_control: "첨단 통합 미사일·레이더 통제"
 module_capital_advanced_integrated_missile_radar_control_desc: "첨단 통합 미사일·레이더 통제는 미사일과 레이더의 통합을 특징으로 하며, 다가오는 위협에 더 빠르고 정밀하게 대응할 수 있게 합니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B주력함§!"
 module_capital_futuristic_integrated_missile_radar_control: "미래형 전투 정보 체계"
 module_capital_futuristic_integrated_missile_radar_control_desc: "미래형 전투 정보 체계는 머신러닝과 AI 기술을 도입하여 아음속, 초음속, 심지어 극초음속으로 날아오는 적 무기의 발사, 비행, 요격을 추적하는 함선의 능력을 향상시킵니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!\n\n§W이것을 주무장으로 사용하면 다음이 됩니다:§! §B주력함§!"
 SOV_module_helipads_2: "Ka-27"
 production_line_improvements_2: "생산 라인 개선 II"
 production_line_improvements_2_desc: "표준화 부품과 반자동 조립 공정의 확대 도입으로 공장은 노동력 병목을 줄이면서 더욱 안정적으로 생산을 확장할 수 있습니다."
 production_line_improvements_3: "생산 라인 개선 III"
 production_line_improvements_3_desc: "고도화된 물류 조율과 최적화된 자재 취급 체계는 산업 시설 전반의 처리량을 크게 높이고 낭비를 줄입니다."
 production_line_improvements_4: "생산 라인 개선 IV"
 production_line_improvements_4_desc: "산업용 로봇과 정밀 공구의 광범위한 도입은 생산 속도, 품질 관리, 새로운 설계에 대한 적응력을 향상시킵니다."
 production_line_improvements_5: "생산 라인 개선 V"
 production_line_improvements_5_desc: "디지털로 통합된 생산 관리 체계는 제조 공정을 실시간으로 감시하고 신속하게 조정할 수 있게 하여 전반적인 효율을 높입니다."
 production_line_improvements_6: "생산 라인 개선 VI"
 production_line_improvements_6_desc: "고도의 자동화와 예측 정비로 장비 고장률이 낮아져, 공장이 지속적으로 최고 효율을 유지하며 가동될 수 있습니다."
 production_line_improvements_7: "생산 라인 개선 VII"
 production_line_improvements_7_desc: "스마트 제조 기법은 데이터 분석과 자동화된 의사결정을 결합하여 산업 네트워크 전체의 생산 흐름을 최적화합니다."
 production_line_improvements_8: "생산 라인 개선 VIII"
 production_line_improvements_8_desc: "고도로 모듈화된 생산 라인은 새로운 장비와 설계에 맞춰 신속하게 재구성할 수 있어 산업 유연성을 크게 향상시킵니다."
 production_line_improvements_9: "생산 라인 개선 IX"
 production_line_improvements_9_desc: "거의 자율화된 공장은 기계 학습을 활용하여 최소한의 인간 개입으로 생산량, 자원 사용, 노동력 배분을 최적화합니다."
 production_line_improvements_10: "생산 라인 개선 X"
 production_line_improvements_10_desc: "완전히 통합된 산업 생태계는 공급업체, 제조업체, 물류를 실시간으로 동기화하여 생산 효율을 전례 없는 수준으로 끌어올립니다."
 improved_building_constructions_2: "공장 건설 중점 II"
 improved_building_constructions_2_desc: "프리패브 부품과 개선된 건설 물류는 구조적 완전성을 유지하면서 건설 기간을 단축합니다."
 improved_building_constructions_3: "공장 건설 중점 III"
 improved_building_constructions_3_desc: "향상된 공학 관행과 현대적 건설 장비 덕분에 산업 공장을 더 빠르고 더 안정적으로 지을 수 있습니다."
 improved_building_constructions_4: "공장 건설 중점 IV"
 improved_building_constructions_4_desc: "건설 공정의 자동화와 더 나은 인력 조율은 산업 발전을 크게 가속합니다."
 improved_building_constructions_5: "공장 건설 중점 V"
 improved_building_constructions_5_desc: "디지털 보조 계획과 정밀 시공 기법은 지연을 최소화하고 전체 자원 소비를 줄입니다."
 improved_building_constructions_6: "공장 건설 중점 VI"
 improved_building_constructions_6_desc: "첨단 소재와 모듈식 건설 방식으로 산업 기반시설을 신속하게 확장하고 개선할 수 있습니다."
 improved_building_constructions_7: "공장 건설 중점 VII"
 improved_building_constructions_7_desc: "고도로 최적화된 건설 체인은 공급업체, 시공사, 설계자를 통합하여 산업 건설 전 과정을 간소화합니다."
 improved_building_constructions_8: "공장 건설 중점 VIII"
 improved_building_constructions_8_desc: "스마트 건설 체계는 자동화와 실시간 데이터를 활용하여 최대의 효율과 최소한의 낭비를 보장합니다."
 improved_building_constructions_9: "공장 건설 중점 IX"
 improved_building_constructions_9_desc: "대규모 산업 사업은 AI 보조 계획의 혜택을 받아 더 빠른 완공과 향상된 장기 성능을 얻을 수 있습니다."
 improved_building_constructions_10: "공장 건설 중점 X"
 improved_building_constructions_10_desc: "거의 자율화된 건설 기법은 건설 기간을 극적으로 줄여 신속한 산업 동원을 가능하게 합니다."
 CAT_microchips: "마이크로칩"
 CAT_helicopter_operators: "헬리콥터 운용함"
 microchip_production_1: "초기 칩 생산"
 microchip_production_1_desc: "국내 반도체 제조 기반을 구축하면 기본적인 집적회로를 대량 생산할 수 있습니다. 이는 현대 전자 산업의 토대가 되어 군사 체계, 산업 자동화, 민간 기반시설에 사용되는 컴퓨팅 부품의 신뢰성과 공급 가능성을 높입니다."
 microchip_production_2: "1 Kbit DRAM"
 microchip_production_2_desc: "초기 동적 램은 전자 체계가 이전 기술보다 훨씬 빠른 속도로 데이터를 일시적으로 저장하고 접근할 수 있게 합니다. 용량은 제한적이지만 이 메모리는 더 반응성 좋은 컴퓨터를 가능하게 하여 초기 디지털 제어 체계와 향상된 데이터 처리 능력을 뒷받침합니다."
 microchip_production_3: "64 Kbit DRAM"
 microchip_production_3_desc: "제조 공정의 개선으로 메모리 집적도와 생산 수율이 크게 높아집니다. 64킬로비트 DRAM은 더 복잡한 소프트웨어와 더 빠른 체계 작동을 지원하여 통신, 정보 분석, 무기 통제 체계에서 더욱 발전된 컴퓨팅 활용을 가능하게 합니다."
 microchip_production_4: "1 Gbit DRAM"
 microchip_production_4_desc: "고집적 기가비트 메모리 모듈은 반도체 기술의 중대한 진전입니다. 이 칩은 대규모 데이터 처리, 고급 시뮬레이션, 현대적 네트워크 지휘 체계를 가능하게 하며, 현대 군사 및 민간 컴퓨팅 기반시설의 핵심 요소를 이룹니다."
 microchip_production_5: "미래 칩 생산"
 microchip_production_5_desc: "첨단 칩 생산은 EUV 리소그래피, 나노시트 트랜지스터, 고도로 자동화된 제조 라인을 사용하여 민간 및 군용 전자기기를 위한 더 작고 빠르며 전력 효율이 높은 반도체를 제조합니다."
 composite_production_1: "초기 복합재 생산"
 composite_production_1_desc: "복합재료의 초기 개발은 전통적인 금속과 고분자 또는 섬유를 결합하여 향상된 비강도를 얻습니다. 초기 복합재 생산은 차량, 항공기, 기반시설의 구조 성능을 높이는 동시에 전체 재료 비용과 무게를 줄입니다."
 composite_production_2: "2세대 복합재료"
 composite_production_2_desc: "재료 과학과 제조 기술의 개선으로 더 균일하고 내구성 있는 복합재료가 만들어집니다. 이 2세대 복합재는 향상된 내열성과 구조적 신뢰성을 제공하여 더 폭넓은 군사 및 산업 분야에 적합합니다."
 composite_production_3: "준현대식 복합재"
 composite_production_3_desc: "섬유 기술과 수지 화학의 발전으로 현대 표준에 근접한 고성능 복합재를 생산할 수 있습니다. 이 재료들은 내구성, 경량화, 피로 저항을 크게 개선하여 첨단 항공기, 장갑차량, 해군 체계를 뒷받침합니다."
 composite_production_4: "현대 복합재 생산"
 composite_production_4_desc: "성숙한 복합재 제조 공정은 정밀한 공차와 일정한 품질을 갖춘 첨단 재료의 대량 생산을 가능하게 합니다. 현대 복합재는 오늘날의 군사 플랫폼에 필수적이며, 공군, 육군, 해군 전반에 걸쳐 향상된 방호력, 기동성, 효율을 제공합니다."
 composite_production_5: "첨단 복합재 생산"
 composite_production_5_desc: "첨단 복합재 생산은 자동 섬유 배치, 수지 이송 성형, 개선된 경화 방식을 사용하여 항공기, 장갑차량, 미사일, 방호 체계를 위한 더 가볍고 강한 구조물을 제조합니다."
 NAVAL_TITLE_PATROLBOATS: "초계정"
 NAVAL_TITLE_PATROLBOATS_DESC: ""
 NAVAL_TITLE_HEAVY_FRIGATES: "중형 호위함"
 NAVAL_TITLE_HEAVY_FRIGATES_DESC: ""
 NAVAL_TITLE_DIESEL_ENGINES: "선박용 디젤 엔진"
 NAVAL_TITLE_DIESEL_ENGINES_DESC: ""
 NAVAL_TITLE_TURBINE_ENGINES: "터빈 함선 엔진"
 NAVAL_TITLE_TURBINE_ENGINES_DESC: "함선은 대개 거대한 디젤 엔진이나 터빈 엔진, 또는 두 가지를 조합하여 작동합니다."
 NAVAL_TITLE_FUSION_ENGINES: "핵융합 엔진"
 NAVAL_TITLE_FUSION_ENGINES_DESC: "원자력 엔진은 사실상 무제한의 연료를 갖고 있어, 승조원을 위한 보급품이 있는 한 우리 함선이 바다에서 계속 작전할 수 있게 합니다."
 NAVAL_TITLE_RADAR_DRONE: "레이더 드론"
 NAVAL_TITLE_RADAR_DRONE_DESC: "레이더 드론은 경량 해상 수색 레이더를 공중에 띄워 함선의 센서 도달 범위를 수평선 너머로 확장하며, 함선, 항공기, 미사일, 저고도 위협이 함대에 도달하기 전에 탐지하는 능력을 개선합니다."
 NAVAL_TITLE_RADAR_JAM: "레이더 재머"
 NAVAL_TITLE_RADAR_JAM_DESC: "레이더 재머 모듈은 군함에 전용 전자 공격 배열을 장착하여, 전투 중 적의 수색 레이더, 조준 센서, 레이더 유도 미사일 탐색기를 교란할 수 있게 합니다."
 NAVAL_TITLE_RAILGUNS_BATTERY: "레일건 포대"
 NAVAL_TITLE_RAILGUNS_BATTERY_DESC: "레일건은 전자기력으로 고속까지 가속한 운동 에너지 탄약을 사용합니다. 발사체는 믿기 어려운 속도까지 가속되어 뛰어난 관통력과 명중률 특성을 지닙니다."
 NAVAL_TITLE_ANTI_DRONE_LASER: "근접 방어 레이저"
 NAVAL_TITLE_ANTI_DRONE_LASER_DESC: ""
 NAVAL_TITLE_VLS_DRONE: "드론 수직 발사 체계"
 NAVAL_TITLE_VLS_DRONE_DESC: ""
 NAVAL_TITLE_DRONE_TORPEDO: "드론 어뢰"
 NAVAL_TITLE_DRONE_TORPEDO_DESC: ""
 NAVAL_TITLE_NUCLEAR_TORPEDO: "핵 어뢰"
 NAVAL_TITLE_NUCLEAR_TORPEDO_DESC: ""
 NAVAL_TITLE_ANTI_TORPEDOES: "대어뢰 어뢰"
 NAVAL_TITLE_ANTI_TORPEDOES_DESC: ""
 TITLE_MICROCHIP_SUBTITLE: "마이크로칩"
 CIVILIAN_TITLE_COMPOSITES: "복합재 생산"
 CIVILIAN_TITLE_COMPOSITES_DESC: "복합재 생산을 개선하면 더 질 높고 첨단 기술을 갖춘 군대를 만들 수 있습니다"
 afs_drone_1: "자율 화력 지원 드론"
 afs_drone_1_desc: "자율 화력 지원 드론은 AI 보조 항법, 표적 지시, 운용자 감독하 교전을 사용하여 일반 지상 부대와 동행하며 공세 작전 중 기동 정찰과 정밀 화력 지원을 제공합니다."
 special_forces_tech_2: "개인 방어 무기"
 special_forces_tech_2_desc: "PDW는 우리 특수 부대에서 근접전 환경에서의 더 빠른 반응 시간을 위해 널리 사용되며, 해당 부대 전용으로 지급되기도 합니다."
 special_forces_tech_3: "현대 특수 부대"
 special_forces_tech_3_desc: "추가 훈련을 통해 우리 특수 부대는 적보다 우위를 점할 수 있습니다."
 special_forces_tech_4: "특수 부대 지정 무기"
 special_forces_tech_4_desc: "특수 부대 지정 무기를 정하면 우리 특수 부대의 정확한 요구에 맞는 특정 플랫폼을 보여 줄 수 있습니다."
 special_forces_tech_5: "사이버 특수 부대"
 special_forces_tech_5_desc: "특수 부대에 사이버 훈련을 시작하면 적에 대해 더 많은 정보를 얻을 수 있습니다."
 special_forces_tech_6: "미래 특수 부대"
 special_forces_tech_6_desc: "미래 특수 부대는 사이버 작전, 소형 드론, 첨단 센서, 보안 통신을 소부대 전술에 통합하여, 정예 팀이 분쟁 환경에서 더 나은 정보, 협조, 생존성을 갖추고 작전할 수 있게 합니다."
 body_armor_1: "케블라 조끼"
 body_armor_1_desc: "유명한 케블라 조끼 이전의 최초 현대식 방탄복은 주로 나일론으로 만들어졌습니다. 케블라는 1975년에 처음 도입되었고, 최초의 조끼는 1980년대에 미 육군에 채택되었습니다.\n\n최초의 조끼는 상체만 보호했으며, 파편과 권총탄만 막을 수 있었습니다."
 body_armor_2: "방탄판 보강 조끼"
 body_armor_2_desc: "세라믹은 오래전부터 개인 방호에 사용되었지만, 최초의 현대식 방탄판은 90년대 후반과 2000년대 초반에 도입되었습니다. 이 새로운 조끼의 방탄판은 소총탄을 막아 주고, 조끼 자체의 파편 방호 범위도 상체뿐 아니라 사타구니와 목 부위까지 확장되었습니다."
 body_armor_3: "개량 전술 조끼"
 body_armor_3_desc: "방탄판 보강 조끼는 뛰어난 방호력을 제공하지만 착용자에게 거추장스러울 수 있습니다. 이 때문에 여러 방탄복 제조사가 더 가볍고 전술적인 설계를 모색하게 되었습니다. 방호력을 제공하면서도 방탄복이 병사의 현장 활동 능력을 제한해서는 안 됩니다. 현대의 방탄복은 전술 조끼에 착용자가 개인 맞춤을 할 수 있는 통합형 해법을 제공하여, 같은 조끼를 거의 모든 상황에서 사용할 수 있게 합니다. 방호 능력도 향상되어, 현대 방탄복은 철갑탄까지 막을 수 있습니다."
 body_armor_4: "전술 강습복"
 body_armor_4_desc: "이제 병사를 총탄과 파편으로부터 보호하는 것만으로는 충분하지 않습니다. 병사가 입는 방호복은 환경 방호도 제공해야 합니다. 또한 무거운 세라믹판 대신, 방호 기술은 비뉴턴 유체의 경화 특성을 활용해야 합니다."
 camouflage_1: "초기 위장"
 camouflage_2: "다중 스케일 위장"
 camouflage_2_desc: "다중 스케일 위장은 군복의 색상 무늬에 다양한 크기를 적용하여 기본 위장을 개선합니다. 바탕색 위에 더 작은 색 영역을 프랙탈과 같은 무늬로 섞습니다. 이는 자연의 색 배합을 모방하여 여러 환경과 다양한 거리에서 위장이 더 효과적이게 합니다."
 camouflage_3: "디지털 위장"
 camouflage_3_desc: "디지털 위장은 무늬가 컴퓨터로 계산된다는 점에서 다중 스케일 위장보다 개선된 방식입니다. 디지털 위장은 흔히 픽셀화된 무늬 형태를 가리키는 데 쓰이지만, 반드시 무늬가 사각형으로 이루어져 있다는 뜻은 아닙니다."
 camouflage_4: "개인 다중 스펙트럼 위장"
 camouflage_4_desc: "다중 스펙트럼 위장은 적외선이나 레이더 기반 탐지로부터 물체를 숨기는 데 쓰이는 위장 기법을 가리킵니다. 개별 병사에게는 주로 길리 슈트 형태로 제공되어 왔는데, 대부분의 전투 상황에서는 실용적이지 않습니다. 현대 소재를 사용하면 효과적인 적외선 차폐 코팅과 소재를 모든 병사의 전투복에 적용할 수 있습니다."
 camouflage_5: "적응형 신호 위장"
 camouflage_5_desc: "적응형 신호 위장은 첨단 직물, 코팅, 모듈식 덮개를 사용하여 변화하는 전장 조건에서 병사, 무기, 차량, 휴대 장비의 시각, 적외선, 열 신호를 줄입니다."
 tech_diesel_power_systems_1: "디젤 엔진"
 tech_diesel_power_systems_1_desc: "함정용 디젤 엔진은 초계함, 보조함, 잠수함 및 소형 전투함에 신뢰할 수 있고 연료 효율적인 추진력을 제공하며, 증기 기관이나 터빈 방식에 비해 항속 거리가 길고 정비가 간단합니다."
 tech_diesel_power_systems_2: "현대식 디젤 엔진"
 tech_diesel_power_systems_2_desc: "현대식 함정용 디젤 엔진은 개선된 터보차저, 전자 제어, 더 정밀한 연료 분사를 사용하여 출력을 높이고 연료 소비를 줄이며 장기 배치 중의 신뢰성을 향상시킵니다."
 tech_diesel_power_systems_3: "고급 디젤 엔진"
 tech_diesel_power_systems_3_desc: "고급 디젤 동력 체계는 커먼레일 분사, 디지털 모니터링, 디젤-전기 구동 방식을 통합하여 함정이 다양한 속도에서 더 조용하고 효율적이며 유연하게 운항할 수 있게 합니다."
 tech_diesel_power_systems_4: "미래형 디젤 엔진"
 tech_diesel_power_systems_4_desc: "미래형 디젤 엔진은 하이브리드 전기 추진, 에너지 저장, 지능형 전력 관리를 결합하여 연료 사용을 줄이는 동시에 센서, 무기, 함내 체계의 증가하는 전력 수요를 뒷받침합니다."
 tech_power_systems_4: "현대식 제트 터빈 엔진"
 tech_power_systems_4_desc: "현대식 함정용 터빈 체계는 디지털 제어, 개선된 소재, 하이브리드 전기 동력 관리를 통합하여 강력한 질주 성능을 제공하는 동시에 레이더, 센서, 전투 체계의 증가하는 전력 수요를 뒷받침합니다."
 tech_nuclear_power_systems_4: "미래형 수상함 원자로"
 tech_nuclear_power_systems_4_desc: "미래형 수상함 원자로는 수명이 더 긴 노심, 개선된 자동화, 더 안전한 원자로 제어를 사용하여 군함에 지속적인 추진력과 센서, 무기, 함내 체계를 위한 대규모 전력 예비량을 제공합니다."
 tech_fire_control_4: "미래형 증강 미사일 레이더 통제"
 tech_fire_control_4_desc: "미래형 증강 미사일 레이더 통제는 AI 보조 전투 정보 체계를 사용하여 아음속, 초음속, 극초음속 미사일 위협에 대한 탐지, 추적, 교전 조율을 향상시킵니다."
 tech_combat_radar_6: "레이더 VII"
 tech_combat_radar_6_desc: "차세대 레이더 배열은 고출력 송신기, 다중 대역 감지, 통합 전자 방호를 사용하여 더 은밀한 항공기, 극초음속 무기, 포화 공격에 대한 성능을 향상시킵니다."
 tech_radar_jammer_1: "레이더 재밍 I"
 tech_radar_jammer_1_desc: "기초 전자 재머는 수신기에 잡음과 거짓 반사파를 쏟아부어 적 레이더를 교란합니다. 제한적인 체계라도 추적 품질을 저하시키고 요격을 복잡하게 만들어 전투에서 결정적인 몇 초를 벌어 줄 수 있습니다."
 tech_radar_jammer_2: "레이더 재밍 II"
 tech_radar_jammer_2_desc: "향상된 전력 관리와 더 지능적인 신호 성형으로 현대의 수색 및 사격 통제 레이더에 대해 더 효과적인 재밍이 가능해집니다. 목표는 은폐가 아니라 불확실성이며, 적이 모든 조준마다 더 많은 노력을 들이도록 강요하는 것입니다."
 tech_radar_jammer_3: "레이더 재밍 III"
 tech_radar_jammer_3_desc: "디지털 기법은 레이더가 보고 있다고 생각하는 것을 조작하는 기만 재밍을 가능하게 하여, 허상 표적을 만들고 거리와 방위를 바꿔 놓습니다. 향상된 위협 라이브러리와 결합하면 이 체계들은 새로운 파형과 대응책에 빠르게 적응할 수 있습니다."
 tech_radar_jammer_4: "레이더 재밍 IV"
 tech_radar_jammer_4_desc: "차세대 전자 공격 모음은 네트워크화된 센서, 실시간 분석, 민첩한 송신기를 통합하여 전자기 스펙트럼을 대규모로 다툽니다. 이들은 격렬한 전자전과 급격한 주파수 변경 속에서도 살아남으면서 여러 레이더를 억제하고, 기만하고, 압도할 수 있습니다."
 tech_combat_sonar_6: "음파탐지기 VII"
 tech_combat_sonar_6_desc: "차세대 소나 네트워크는 함정 탑재 배열, 무인 수중 차량, 해저 센서, 외부 음향 데이터를 결합하여 대잠 탐지를 단일 함정의 센서 범위 너머로 확장합니다."
 tech_naval_recon_drones_1: "해군 정찰 드론 I"
 tech_naval_recon_drones_1_desc: "함정에서 발진하는 정찰 드론은 함대의 눈을 수평선 너머로 확장하여 실시간 수상 수색과 기초적인 표적 관측을 제공합니다. 소형 플랫폼조차 접촉 대상을 추적하고 접근로를 파악하며, 분쟁 해역에서의 기습 위험을 줄일 수 있습니다."
 tech_naval_recon_drones_2: "해군 정찰 드론 II"
 tech_naval_recon_drones_2_desc: "향상된 센서와 데이터링크는 해군 드론을 지속적인 정찰 전력으로 바꾸어, 지휘관에게 더 빠른 식별과 추적을 통해 더 명확한 해상 상황도를 제공합니다. 더 나은 체공 시간과 안정화 기능 덕분에 악천후와 긴 초계 주기에서도 신뢰할 수 있습니다."
 tech_naval_recon_drones_3: "해군 정찰 드론 III"
 tech_naval_recon_drones_3_desc: "네트워크화된 해상 드론은 수색 패턴을 조율하고, 함정 탑재 무기에 표적을 지시하며, 기동 부대 전반에 걸쳐 표적 데이터를 전달할 수 있습니다. 향상된 전자 지원과 신호 처리를 통해, 잡음과 방사 속에 숨어 있을 위협을 드러내는 데 도움을 줍니다."
 tech_naval_recon_drones_4: "해군 정찰 드론 IV"
 tech_naval_recon_drones_4_desc: "고급 해군 정찰 드론은 타격 및 요격 임무를 위한 지속적인 광역 감시, 표적 지시, 센서 중계 지원을 제공합니다. 강화된 통신과 자율 항법 덕분에 재밍, 열화된 링크, 격렬한 전자전 속에서도 작전할 수 있습니다."
 tech_rail_guns_4: "레일건 2045"
 tech_rail_guns_4_desc: "고급 레일건은 유도형 극초음속 발사체, 정밀 사격 통제 링크, 더 강력한 발사기 부품을 사용하여 함정, 항공기, 미사일, 지상 표적을 더 높은 정확도와 지속 사격 능력으로 타격합니다."
 tech_rail_battery_1: "레일건 포대 I"
 tech_rail_battery_1_desc: "단일 레일건을 장착하는 대신, 포대는 여러 개의 포신을 하나의 통합 사격 통제 체계로 묶어 전함 포탑 교리의 논리를 되살립니다. 조율된 일제 사격은 더 강력한 타격력, 더 촘촘한 탄착군, 더 빠른 후속 사격을 제공하지만, 더 큰 전력 수요와 통합의 복잡성이 따릅니다."
 tech_rail_battery_2: "레일건 포대 II"
 tech_rail_battery_2_desc: "2세대 레일건 포대는 포신 수명, 열 관리, 탄약고 자동화를 개선하여 치명적인 마모 없이 지속적인 고속 일제 사격을 가능하게 합니다. 더 지능적인 전력 분배와 고급 표적 설정을 통해, 이 3연장 레일 포탑은 수상 교전을 지배하고 기존 해군 포병을 훨씬 뛰어넘는 장거리 정밀 화력 지원을 제공할 수 있습니다."
 tech_point_defense_chain_gun: "근접 방어 체계"
 tech_point_defense_chain_gun_desc: "근접 방어 체계는 접근하는 미사일에 사격하는 모든 수단이라고 느슨하게 정의할 수 있습니다"
 tech_anti_drone_laser_1: "함재 근접 방어 레이저 I"
 tech_anti_drone_laser_1_desc: "초기 함재 레이저는 센서, 조종면, 탄두를 빛의 속도로 태워 없앰으로써 드론과 접근하는 탄약에 대해 깊은 탄창의 방어를 제공합니다. 요격 미사일과 근접 방어포에 대한 의존도를 줄여 주지만, 악천후와 심한 물보라 속에서 효과를 내려면 안정적인 전력과 정밀한 추적이 필요합니다."
 tech_anti_drone_laser_2: "함재 근접 방어 레이저 II"
 tech_anti_drone_laser_2_desc: "개선된 빔 품질, 열 관리, 통합 사격 통제는 포화 드론 군집과 해면 밀착 비행 미사일을 포함한 더 빠르고 작은 위협에 대한 지속적인 교전을 가능하게 합니다. 더 나은 전력 완충과 함정 센서의 자동 지시를 통해 레이저는 실험적 추가 장비가 아닌 근접 방어 체계의 신뢰할 수 있는 한 층이 됩니다."
 tech_turret_missiles_surface_6: "대함 미사일 2045"
 tech_turret_missiles_surface_6_desc: "초고급 대함 미사일 체계는 일제 공격을 조율하고, 표적 갱신 정보를 공유하며, 비행 중 접근 궤적을 조정하여 대수상 타격 미사일과 원거리 대잠 무기 모두를 향상시킵니다."
 tech_turret_missiles_drone_1: "해군 군집 모듈 I"
 tech_turret_missiles_drone_1_desc: "군집 모듈은 기존 미사일을 일회용 공격 드론에 최적화된 발사 셀로 대체합니다. 고가의 단발 대신 함정은 방어 지역에 다수의 소형 위협을 쏟아부어, 적 센서와 요격체가 무엇을 저지할지 선택하도록 강요할 수 있습니다."
 tech_turret_missiles_drone_2: "해군 군집 모듈 II"
 tech_turret_missiles_drone_2_desc: "향상된 데이터링크와 탑재 유도 장치 덕분에 드론 일제 발사체는 접근을 조율하고, 여러 축으로 분산하며, 상황 변화에 따라 비행 중 재표적 지정을 할 수 있습니다. 이는 모든 발사를 방어자에게 확신이 드물고 반응 시간이 짧은 판단 문제로 만듭니다."
 tech_turret_missiles_drone_3: "해군 군집 모듈 III"
 tech_turret_missiles_drone_3_desc: "고급 군집 제어는 계층 방공망을 압도하고, 추적을 교란하며, 가차 없는 효율로 틈을 파고들도록 설계된 대규모 반자율 공격을 가능하게 합니다. 모듈식 탑재체와 더 지능적인 항법을 갖춘 자폭 드론은 단발의 위력 대신 끊임없는 포화 공격을 택하는 유연한 해군 타격 수단이 됩니다."
 tech_turret_missiles_aa_6: "롤링 에어프레임 미사일 2045"
 tech_turret_missiles_aa_6_desc: "초고급 RAM 체계는 다중 모드 탐색기, 협력 표적 설정, 신속한 일제 사격 관리를 사용하여 드론, 항공기, 순항 미사일, 포화 공격을 요격합니다."
 tech_vls_surface_6: "VLS 대지 공격 미사일 2045"
 tech_vls_surface_6_desc: "초고급 VLS 대지 공격 미사일은 협력 경로 설정, 네트워크 표적 갱신, 다중 모드 탐색기를 사용하여 방어된 해안 지대와 분산된 군사 기반시설에 대한 대규모 타격을 조율합니다."
 tech_vls_aa_6: "VLS 지대공 미사일 2045"
 tech_vls_aa_6_desc: "초고급 VLS 지대공 미사일은 네트워크 센서 융합, 대응책 저항 유도, 신속한 일제 사격 조율을 사용하여 대규모 미사일 습격, 드론 군집, 극초음속 무기로부터 함대를 방어합니다."
 tech_torpedoes_6: "2045년형 어뢰"
 tech_torpedoes_6_desc: "초고급 어뢰는 네트워크 표적 데이터, 저소음 추진, 자율 수색 패턴을 사용하여 대잠 작전 중 잠수함, 항공기, 수상함, 무인 플랫폼과 협력합니다."
 tech_drone_torpedoes_1: "드론 어뢰 II"
 tech_drone_torpedoes_1_desc: "초기 드론 어뢰는 기존 수중 무기에 유도 기능과 제한된 자율성을 더하여 표적 획득을 개선하고 낭비되는 발사를 줄입니다. 더 나은 센서와 침로 수정을 통해 복잡한 연안 해역에서 회피하는 함정과 잠수함을 더 신뢰성 있게 추적할 수 있습니다."
 tech_drone_torpedoes_2: "드론 어뢰 III"
 tech_drone_torpedoes_2_desc: "개선된 소나 처리와 보안 데이터링크 덕분에 드론 어뢰는 항주 중 표적을 갱신하고 대응책에 적응할 수 있습니다. 향상된 추진 체계와 에너지 관리는 종말 속도를 희생하지 않고 사거리와 항속 능력을 늘려 교전 범위를 확장합니다."
 tech_drone_torpedoes_3: "드론 어뢰 IV"
 tech_drone_torpedoes_3_desc: "고급 자율성은 드론 어뢰를 협력 수색, 더 지능적인 재공격 논리, 미끼 저항 능력을 갖춘 조율된 수중 사냥꾼으로 바꿔 놓습니다. 정교한 항적 유도와 다중 모드 탐색기를 통해 현대의 방어를 돌파하고 표적이 격침될 때까지 압박을 유지할 수 있습니다."
 tech_anti_torpedoes_1: "대어뢰 방어 I"
 tech_anti_torpedoes_1_desc: "초기 대어뢰 방어는 개선된 소나 경보와 기초적인 대응책을 결합하여 정면 명중 가능성을 줄입니다. 더 나은 탐지와 더 빠른 반응은 회피 기동, 미끼 전개, 방어 차단막을 위한 시간을 벌어 줍니다."
 tech_anti_torpedoes_2: "대어뢰 방어 II"
 tech_anti_torpedoes_2_desc: "강화된 어뢰 경보 체계는 센서, 전술 표시 장치, 자동 대응 논리를 통합하여 접근하는 위협에 대한 살상 사슬을 단축합니다. 더 효과적인 미끼와 개선된 함정 조종 교리는 외양과 연안 환경 모두에서 생존성을 높입니다."
 tech_anti_torpedoes_3: "대어뢰 방어 III"
 tech_anti_torpedoes_3_desc: "고급 대어뢰 모음은 고정밀 추적과 능동 대응책을 결합하며, 여기에는 충돌 전에 어뢰를 파괴하도록 설계된 하드킬 요격체도 포함됩니다. 네트워크 센서와 속사 방어 체계는 수중 공격의 결정력을 크게 떨어뜨려, 잠수함이 더 적은 성과를 위해 더 많은 무기를 투입하도록 강요합니다."
 tech_nuclear_torpedoes_1: "핵 어뢰 II"
 tech_nuclear_torpedoes_1_desc: "핵탄두를 중어뢰에 통합하면 수중전은 파국적 억제의 수단이 됩니다. 그러한 타격의 가능성만으로도 적 함대는 분산하고 해협 요충지를 재고하며 잠수함 접촉 보고를 존립의 경보로 취급하게 됩니다. 이는 한계를 끝내겠다는 위협으로 전투를 끝내기 위한 무기입니다."
 tech_nuclear_torpedoes_2: "핵 어뢰 III"
 tech_nuclear_torpedoes_2_desc: "개선된 지휘 안전장치와 더 신뢰성 있는 배치 교리는 핵 어뢰를 끔찍하지만 신뢰할 수 있는 해상 2차 타격 수단으로 만듭니다. 이들의 존재는 대규모 편대와 연안 집결 지역의 비용을 높여 해군 계획을 바꿔 놓습니다. 모든 교전에 확전 위험의 그림자가 드리웁니다."
 tech_nuclear_torpedoes_3: "핵 어뢰 IV"
 tech_nuclear_torpedoes_3_desc: "고급 핵 어뢰 개념은 위협이 그 공포를 줄이지 않으면서도 생존 가능하고, 통제 가능하며, 정치적으로 사용 가능하도록 만드는 것을 목표로 합니다. 전략 지휘 체계와의 긴밀한 통합과 더 명확한 사용 규정을 통해, 이 무기는 해양 억제의 공식적인 기둥이 됩니다. 일단 배치되면 적은 자신감이 아닌 두려움에서 협상에 나서도록 강요받습니다."
 tech_landing_craft_1: "상륙정"
 tech_landing_craft_1_desc: "상륙정은 상륙 작전을 위해 병력을 해상에서 해안으로 수송하는 소형 선박입니다."
 tech_landing_craft_2: "강습 상륙함"
 tech_landing_craft_2_desc: "강습 상륙함은 적 해안 지역에서 상륙 작전을 수행할 때 전선 후방에서 항공 및 수상 지원을 제공하는 데 사용되는 군함입니다."
 tech_landing_craft_3: "공기부양 상륙정"
 tech_landing_craft_3_desc: "상륙 작전에서 전통적인 선박형 상륙정은 세계 해안선의 약 15%에만 상륙할 수 있지만, 1960년대 이후 개발된 호버크라프트는 70%에 도달할 수 있습니다. 따라서 적응력이 크게 향상되었습니다. 동시에 속도도 전통적인 상륙정보다 빠르며, 주력 전차를 운반하고 상륙한 해병대를 엄호할 수 있습니다. 호버크라프트는 상륙 작전의 판도를 완전히 바꿔 놓았습니다."
 tech_landing_craft_4: "현대식 상륙정"
 tech_landing_craft_4_desc: "현대 기술의 도입으로 상륙정의 성능이 크게 발전하여 상륙 작전의 효율이 대폭 향상되었습니다."
 tech_landing_craft_5: "특수 방호 장비"
 tech_landing_craft_5_desc: "특수 방호 장비는 상륙정의 생존성을 크게 향상시킬 수 있습니다."
 tech_landing_craft_6: "상륙정 AI 체계"
 tech_landing_craft_6_desc: "인공지능의 도입으로 상륙정은 비상 상황에 시기적절하고 올바르게 대응할 수 있게 됩니다."
 tech_landing_craft_7: "스마트 상륙정"
 tech_landing_craft_7_desc: "지능형 상륙정은 상륙 작전에 미래 기술을 적용한 것입니다."
 tech_submarine_engineering_5: "미래형 잠수함 엔진"
 tech_submarine_engineering_5_desc: "신기술의 도입으로 잠수함이 수중에서 더 먼 거리를, 더 빠른 속도로, 더 낮은 소음으로 작전할 수 있게 됩니다."
 patrol_boat_hull_1_tech: "1985년형 초계정"
 patrol_boat_hull_1_tech_desc: "초계정은 연안 방어를 위해 만들어진 경량 선박입니다. 초계함보다 작으며 하천 작전도 수행할 수 있습니다."
 patrol_boat_hull_2_tech: "2005년형 초계정"
 patrol_boat_hull_2_tech_desc: "초계정은 연안 방어를 위해 만들어진 경량 선박입니다. 초계함보다 작으며 하천 작전도 수행할 수 있습니다."
