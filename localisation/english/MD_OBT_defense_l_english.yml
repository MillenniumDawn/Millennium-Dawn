l_english:
 # Operation Blue Tiger milestone 9: Defense and National Reform
 OBT_defense_reform_category: "Defense and National Reform"
 OBT_defense_reform_category_desc: "Taiwan's reform, military, economic and diplomatic indicators, and the progress of American arms purchases. Hover over any indicator to see what it does and how to raise it."
 OBT_dash_title: "DEFENSE AND NATIONAL REFORM"
 OBT_dash_title_tt: "Each indicator runs from 0 to 100. Effects are measured from Taiwan's 2000 starting value, so a stat that has not moved has no effect."
 OBT_dash_milconf_label: "Mil. Confidence: §Y[?TAI.TAI_military_confidence|0]§!"
 OBT_dash_milconf_tt: "§YMilitary Confidence§!: [?TAI.TAI_military_confidence|0] / 100\n\nHow far the officer corps trusts the elected government and believes the forces can fight.\n\n§YEffects§! (measured from the starting value of 55):\n  Division organization: [?TAI.OBT_ni_org_p|+=1]% (changes by 0.1% per point)\n  Planning speed: [?TAI.OBT_ni_plan_p|+=1]% (changes by 0.2% per point)\n\n§YHow to change it:§! Raised by the National Defense Act, reassuring the commanders, Han Kuang exercises, deliveries entering service and some events. Lowered by abrupt purges of the old guard, scandals and a stalled defense budget."
 OBT_dash_reform_label: "Reform Capacity: §Y[?TAI.TAI_reform_capacity|0]§!"
 OBT_dash_reform_tt: "§YReform Capacity§!: [?TAI.TAI_reform_capacity|0] / 100\n\nThe state's ability to change how it buys, trains and organizes: trained staff, honest procurement and the patience to absorb new equipment.\n\n§YEffects§! (measured from the starting value of 50):\n  Research speed: [?TAI.OBT_ni_research_p|+=1]% (changes by 0.06% per point)\n  Army experience gain: [?TAI.OBT_ni_xp_p|+=1]% (changes by 0.2% per point)\n\n§YHow to change it:§! Raised by the absorption, service-rivalry and interoperability focuses, technocratic and judicial reforms, joint operations drills and Pentagon assessments."
 OBT_dash_coord_label: "Coordination: §Y[?TAI.TAI_national_coordination|0]§!"
 OBT_dash_coord_tt: "§YNational Coordination Capacity§!: [?TAI.TAI_national_coordination|0] / 100\n\nWhether ministries, local governments and the armed forces can act as one in a crisis.\n\n§YEffects§! (measured from the starting value of 40):\n  Construction speed: [?TAI.OBT_ni_build_p|+=1]% (changes by 0.1% per point)\n  Stability: [?TAI.OBT_ni_stab_p|+=1]% (changes by 0.05% per point)\n\n§YHow to change it:§! Raised by the Operation Blue Tiger branch, the National Security Council, local emergency administration, a neutral civil service and civil defense coordination."
 OBT_dash_usconf_label: "U.S. Confidence: §Y[?TAI.TAI_us_confidence|0]§!"
 OBT_dash_usconf_tt: "§YU.S. Confidence in Taipei§!: [?TAI.TAI_us_confidence|0] / 100\n\nHow much Washington trusts Taipei: that it will not provoke Beijing, will fund its own defense and can use what it buys. This is Taipei's standing in Washington, not America's commitment.\n\n§YEffects:§! Requesting U.S. support needs at least 40. In a war with China, 60 or more makes American intervention or aid more likely; below 30 Washington is more likely to stay out. Arms procurement steps need 55-75 (see the tracker).\n\nU.S. Confidence is how Washington sees §YTaipei§!. U.S. Support is how committed §YWashington§! is. They move separately.\n\n§YHow to change it:§! Raised by funding defense budgets, hosting Pentagon assessments, reassuring Washington and avoiding unilateral moves. Lowered by stalled budgets, surprise steps toward independence and ignoring American advice."
 OBT_dash_ussupport_label: "U.S. Support: §Y[?CHI.CHI_taiwan_us_support|0]§!"
 OBT_dash_ussupport_tt: "§YU.S. Support (Washington's commitment)§!: [?CHI.CHI_taiwan_us_support|0] / 100\n\nHow committed the United States is to deterring Beijing. Washington decides this, and Beijing watches it. Taipei can influence it but not control it.\n\n§YEffects:§! Above 60 it slows the growth of Pressure to Negotiate. Beijing's harshest options open as it falls: missile tests below 50, a maritime zone below 40, a partial blockade below 30 and a full blockade below 20.\n\nU.S. Support is Washington's own commitment. U.S. Confidence is how Washington sees Taipei. They move separately.\n\n§YHow to change it:§! Raised by arms sales, Japanese and American statements, coercion that looks unprovoked and Pacific Lifeline diplomacy. Lowered by American distraction, Chinese influence campaigns and moves Washington sees as provocative."
 OBT_dash_ptn_label: "Pressure: §Y[?TAI.TAI_pressure_to_negotiate|0]§!"
 OBT_dash_ptn_tt: "§YPressure to Negotiate§!: [?TAI.TAI_pressure_to_negotiate|0] / 100\n\nHow strongly the public and the economy push the government to accept talks on Beijing's terms.\n\n§YEffects:§! At 50 or more Taiwan can seek terms and Beijing can offer talks. At 70 or more under blockade, Beijing presents terms.\n\n§YHow to change it:§! Rises while a Chinese blockade bites and falls by 2 a month without one. Reduced by stability above 60%, Impossible to Coerce, U.S. Support above 60, strategic reserves and Blue Tiger decisions."
 OBT_dash_identity_label: "Identity: §Y[?TAI.TAI_taiwanese_identity|0]§!"
 OBT_dash_identity_tt: "§YTaiwan-Centered Identity§!: [?TAI.TAI_taiwanese_identity|0] / 100\n\nHow strongly citizens see themselves as Taiwanese first. It is neither good nor bad in itself: it changes which paths are open.\n\n§YEffects:§! Shapes how the public reacts to talks with Beijing and, on the Return to the Mainland path, the balance between restoration and self-determination.\n\n§YHow to change it:§! Raised by Pan-Green focuses, coercion against a stable Taiwan and name-rectification policies. Lowered by reassurances to Beijing and some Pan-Blue focuses."
 OBT_dash_dep_label: "Mainland Dep.: §Y[?TAI.TAI_mainland_dependence|0]§!"
 OBT_dash_dep_tt: "§YMainland Economic Dependence§!: [?TAI.TAI_mainland_dependence|0] / 100\n\nHow much of Taiwan's trade, investment and jobs depend on the mainland. It pays, and it gives Beijing leverage.\n\n§YEffects§! (measured from the starting value of 30):\n  Factory output: [?TAI.OBT_ni_ic_p|+=1]% (changes by 0.05% per point)\n  War support: [?TAI.OBT_ni_ws_p|+=1]% (changes by 0.1% per point)\n\n§YHow to change it:§! Raised by the Three Links, opening investment and mainland tourists. Lowered by Go South, diversifying export markets, sector investment caps and supply-chain reviews."
 OBT_dash_chips_label: "Chip Security: §Y[?TAI.TAI_semiconductor_security|0]§!"
 OBT_dash_chips_tt: "§YSemiconductor Supply Security§!: [?TAI.TAI_semiconductor_security|0] / 100\n\nWhether Taiwan's chip industry can keep running: materials, tools, energy and skilled engineers.\n\n§YEffects§! (measured from the starting value of 85):\n  Production efficiency growth: [?TAI.OBT_ni_eff_p|+=1]% (changes by 0.15% per point)\n\n§YHow to change it:§! Raised by the Silicon Island branch, the Japanese and Dutch supply partnerships, strategic materials inventories and supply-chain reviews. A few events lower it, and it can only be rebuilt through partners and reserves."
 OBT_dash_proc_tt: "Procurement has separate steps: §YWashington approves§!, the §YLegislative Yuan funds§!, a §Ycontract or refit§! runs, the equipment is §Ydelivered§!, and the crews §Ywork up§! before it counts as in service.\n\nTimers stop while the program is suspended: if Washington withdraws support, if Taiwan is at war with the United States, or if Taiwan is at war with China while the United States is not. Ships also need a naval base to arrive."
 OBT_dash_proc_kidd: "Kidd-class destroyers: [OBT_proc_kidd_status]"
 OBT_dash_proc_kidd_tt: "§YKidd-class destroyers (4)§!: approved in April 2001 and refitted in Charleston. Historically the first pair, Keelung and Su Ao, arrived in December 2005 and the second, Tso Ying and Ma Kong, in November 2006.\n\nFunded by a trimmed or full special budget. The refit starts when §YAccept the Kidd-Class Destroyers§! is complete: about 31 months to the first pair, 11 more to the second, then 6 months of working up.\n\n§YExpedite the Kidd Refit§! cuts the remaining refit time by 40%."
 OBT_dash_proc_p3c: "P-3C patrol aircraft: [OBT_proc_p3c_status]"
 OBT_dash_proc_p3c_tt: "§YP-3C Orion patrol aircraft (12)§!: approved in 2001, funded only in 2007, contracted in 2009 and delivered from 2013.\n\nNeeds a full special budget and §YMaritime Patrol Aircraft§!. Then about 20 months of contract talks, 50 months of refurbishment, and batches of 4 every 18 months.\n\n§YNegotiate Priority Delivery§! and §YFund a Second Refurbishment Line§! can each speed this up."
 OBT_dash_proc_sub: "Diesel submarines: [OBT_proc_sub_status]"
 OBT_dash_proc_sub_tt: "§YDiesel-electric submarines (8)§!: approved in 2001, but no shipyard ever agreed to build them.\n\nNeeds a full special budget and §YThe Submarine Question§!. Then Taiwan must secure a construction partner before 1 January 2009. Each partner has strict conditions; talks take 180 days and succeed only if the conditions still hold. A partner is followed by a construction appropriation, about 6 years to the first pair, and a pair a year after that.\n\nWithout a partner the program fails, as it did historically, and Taiwan turns to the Indigenous Submarine Program."
 OBT_dash_proc_aegis: "Aegis destroyers: [OBT_proc_aegis_status]"
 OBT_dash_proc_aegis_tt: "§YAegis destroyers (4)§!: alternate history. Only available if Washington approved Aegis in April 2001. New construction takes about 7 years to the first pair, and each delivery raises Cross-Strait Tension."
 OBT_TAI_national_indicators: "National Indicators"
 OBT_budget_full_tt: "Funds the §YKidd destroyers§!, the §YP-3C patrol aircraft§! and design work on the §Ydiesel submarines§!."
 OBT_budget_trim_tt: "Funds the §YKidd destroyers§! only. The rest of the package waits for another vote."
 OBT_budget_stall_tt: "Funds nothing. The package can be resubmitted from the §YDefense and National Reform§! tab."
