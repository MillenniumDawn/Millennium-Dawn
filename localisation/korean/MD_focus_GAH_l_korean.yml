l_korean:
 ghana.1.t: "서토고랜드의 주권 선언"
 ghana.1.d: "몇 주 동안 볼타 지역의 도로를 따라 여행자들을 \\"서토고랜드\\"에 온 것을 환영하는 표지판이 서 있었으나, 누가 세웠는지 본 사람은 아무도 없었습니다. 이제 1956년 골드 코스트와의 통합에 반대표를 던졌던 에웨족 운동의 후계자인 서토고랜드 회복 전선이 옛 영국령 토고랜드를 주권 국가로 선포하고 유엔 후원 아래의 회담을 요구하고 있습니다. 지역 족장들은 침묵하고 있습니다. 보안 당국은 이를 전혀 예상하지 못했다고 시인합니다."
 ghana.1.a: "군경 합동 작전을 지역에 투입한다."
 ghana.1.b: "볼타 지역 족장 회의를 통해 협상을 시작한다."
 ghana.1.c: "고작 몇 개의 표지판일 뿐이다. 무시한다."
 ghana.2.t: "볼타 지역 전역에 걸친 공격"
 ghana.2.d: "새로 훈련받은 신병 500명의 사진을 게시한 지 열두 시간 뒤, 분리주의자들이 동트기 전에 공격했습니다. 이들은 무기고에 침입하고 아베이임과 메페의 경찰서를 습격하여 수감자들을 풀어 주고 소총과 경찰 픽업트럭을 탈취해 달아났습니다. 관구 사령관을 포함한 경찰관 세 명이 인질로 잡혀 있습니다. 지역으로 통하는 모든 도로가 모래 더미와 불타는 타이어로 막혔고, 라디오 방송국 두 곳이 분리주의자의 손에 넘어갔으며, 경찰에는 철수하라는 24시간의 시한이 주어졌습니다."
 ghana.2.a: "지역을 소탕하고 무기를 회수하며 용의자들을 아크라로 공수한다."
 ghana.2.b: "족장들 및 조국 연구회와 협상을 시작한다."
 ghana.2.c: "볼타 지역 전역에 비상사태를 선포한다."
 ghana.3.t: "정적이 찾아온 볼타 지역"
 ghana.3.d: "도로는 열렸고, 분리주의자들의 영상에서 약속된 4천 명의 용 전사들은 행진하지 않았습니다. 수십 명의 용의자가 아크라에 구금되어 있고, 지역 족장 회의는 이 운동을 범죄자들로 규정하며 선을 그었으며, 군은 12월 선거 기간 내내 투표소를 경비했습니다. 남은 것은 법원이 판단할 문제입니다."
 ghana.3.a: "주모자들을 반역죄로 기소한다."
 ghana.3.b: "2019년처럼 보석으로 석방하고 넘어간다."
 ghana.4.t: "용 전사들의 귀환"
 ghana.4.d: "영상 속의 사내들이 전부 꾸며낸 것은 아니었습니다. 스스로를 서토고랜드의 용 전사라 칭하는 소규모 무장 집단이 토고에서 다시 넘어와 동부 지역에서 경찰 순찰대를 매복 공격하고 호헤의 은행 지점을 털었습니다. 작년에 이 운동과 선을 그었던 볼타 족장들은 이제 체포와 급습이 오히려 이들의 신병 모집을 대신해 주었다고 말합니다."
 ghana.4.a: "국경에서 국경까지 추적하여 소탕한다."
 ghana.4.b: "사면하고 볼타 지역 개발 패키지를 제공한다."
 ghana.5.t: "볼타의 봉기"
 ghana.5.d: "이번에는 깃발이 내려가지 않습니다. 무장한 용 전사들이 호와 토고 국경으로 가는 도로를 장악했고, 지방 행정관들은 달아났으며, 회복 전선은 서토고랜드가 방어될 것이라고 선언합니다. 정규군이 병영에서 지켜보는 가운데 급조된 의용 민병대가 지역으로 진격하고 있습니다."
 ghana.5.a: "그렇다면 우리가 되찾겠다."
 ghana.6.t: "볼타 문제의 해결"
 ghana.6.d: "민병대 간의 석 달에 걸친 교전은 볼타를 따라 마을들을 텅 비게 했고 호의 병원들을 가득 채웠습니다. 용 전사들은 나라를 차지할 수 없고, 우리는 총구를 들이대어 그 지역이 우리를 사랑하게 만들 수 없습니다. 족장들은 합의를 중재하겠다고 제안하고, 장군들은 이를 끝내겠다고 제안합니다."
 ghana.6.a: "무력으로 끝낸다."
 ghana.6.b: "가나 안의 자치 볼타 지역."
 ghana.6.c: "민병대가 이미 해결했다."
 ghana.7.t: "볼타 협약"
 ghana.7.d: "지역 족장 회의와의 두 차례 회담은 어떤 급습도 이루지 못한 일을 이루었습니다. 조국 연구회는 무장 투쟁을 포기했고, 회복 전선의 신병들은 집으로 돌아갔으며, 족장들은 아크라에 초안을 가져왔습니다. 가나 안에서 가나의 국기 아래 볼타 지역에 지역 자치를 부여하는 법령입니다."
 ghana.7.a: "지역 자치 법령에 서명한다."
 ghana.7.b: "족장들에게 감사하되 헌법은 건드리지 않는다."
 ghana_news.1.t: "분리주의자들, 가나 볼타 지역에서 경찰 공격"
 ghana_news.1.d: "서토고랜드 회복 전선의 무장 괴한들이 가나 동부의 무기고와 경찰서 두 곳을 급습하고, 볼타 지역으로 통하는 도로를 봉쇄한 채 옛 영국령 토고랜드를 주권 국가로 선포했습니다. 아프리카에서 가장 안정된 민주주의 국가 중 하나인 가나의 수도 아크라는 대응을 고심하고 있습니다."
 ghana_news.1.a: "오래된 국경 문제가 다시 떠오르다."
 ghana_news.2.t: "가나 볼타 지역의 민병대 전쟁"
 ghana_news.2.d: "가나 의용 민병대와 호 및 토고 국경으로 가는 도로를 장악한 이른바 서토고랜드의 용 전사들 사이에 전투가 벌어졌습니다. 어느 쪽도 정규군을 투입하지는 않았으나 볼타 지역은 전쟁터가 되었고, 난민들이 토고로 넘어가고 있습니다."
 ghana_news.2.a: "가나는 안정된 나라여야 했는데."
 ghana_news.3.t: "가나의 볼타 문제 매듭"
 ghana_news.3.d: "서토고랜드 위기가 끝났습니다. 볼타 지역에서 총성이 멎었고 분리주의 지도부는 뿔뿔이 흩어졌습니다. 평화가 지속될지는 그 지역에 무엇이 약속되었는지에 달려 있을 것입니다."
 ghana_news.3.a: "볼타에 평화가 돌아오다."