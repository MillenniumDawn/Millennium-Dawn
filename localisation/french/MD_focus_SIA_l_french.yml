 SIA_rvconnex_air_manufacturer_mio_header_institutional_capacity: "Capacité institutionnelle"
 SIA_all_laos_claimed: "Les revendications maximalistes du Laos sont jalonnées"
 SIA_full_1909_demand: "Tous les territoires du traité de 1909 exigés"
 SIA_112_amended: "Article 112 modifié"
 SIA_kra_phase_1_funding_tt: "Requiert que le temps de recharge de l'étude de faisabilité soit expiré, et un Trésor au-dessus à la fois de l'entretien (actuellement §Y$[?ROOT.SIA_kra_upkeep|0]§! milliards) et du paiement de phase I de §Y$20§! milliards."
 SIA_kra_phase_2_funding_tt: "Requiert que le temps de recharge de la phase précédente soit expiré, et un Trésor au-dessus à la fois de l'entretien (actuellement §Y$[?ROOT.SIA_kra_upkeep|0]§! milliards) et du paiement de phase II de §Y$30§! milliards."
 SIA_kra_phase_3_funding_tt: "Requiert que le temps de recharge de la phase précédente soit expiré, et un Trésor au-dessus à la fois de l'entretien (actuellement §Y$[?ROOT.SIA_kra_upkeep|0]§! milliards) et du paiement de phase III de §Y$40§! milliards."
 SIA_ds_resolved_peace: "L'insurrection du Deep South a été résolue par des pourparlers de paix"
 SIA_ds_intensity_below_60_tt: "Intensité de l'insurrection du Sud profond inférieure à §Y60§! (actuellement §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_coup_risk_below_70_tt: "Risque de coup d'État inférieur à §Y70§! (maintenant §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_democrat_machine_active: "La machine du parti démocrate au pouvoir"
 SIA_seato_invite_accept_tt: " - Il rejoint l'§YOTASE§! et gagne un esprit le tenant engagé dans le pacte"
 SIA_dti_trait: "Fondation nationale de R&D"
 SIA_chaiseri_trait: "Fonderie nationale d'AFV"
 SIA_panus_trait: "Assemblage de véhicules à roues"
 SIA_bdock_trait: "Fondation de la cale sèche navale"
 SIA_marsun_trait: "Fondation du chantier naval"
 SIA_tai_trait: "Fondation MRO aérospatiale"
 SIA_did_trait: "Fondation Arsenal d'État"
 SIA_rvconnex_trait: "Fondation des systèmes sans pilote"
 thailand.51.d_lapsed: "The standby facility runs its full course and the last obligations are settled on the Fund's timetable rather than ahead of it. There is no televised address and no headline about economic independence restored, but the conditions lapse all the same."
 thailand.427.t: "The Red Flag Over Bangkok"
 thailand.427.d: "The Communist Party of Thailand holds the government. Not from the hills and not from a picket line, but from a ballot box the establishment was confident it controlled. The old parties are turned out of their ministries, and their patronage and their spirits go with them. Inside the party nobody treats this as the end of the matter. A majority won under the old constitution can be taken away under it just as easily, and the men who wrote that constitution are still in the barracks. The work of making the victory permanent begins immediately."
 thailand.427.a: "The ballot box was the easy part."
 SIA_quiet_word_pressure: "The Palace Presses"
 SIA_quiet_word_pressure_desc: "No tanks and no proclamation. Just a steady pressure from the institutions that outlast governments, turning the country a little further toward the palace every day it continues."
 SIA_cadre_mobilisation: "Cadre Mobilization"
 SIA_cadre_mobilisation_desc: "The party's best organizers are in the villages and the workplaces rather than at their own jobs, and the schoolrooms have been given over to political education. The movement grows; nothing else does."
 SIA_strike_campus_walkout: "Campus Walkout"
 SIA_strike_campus_walkout_desc: "The universities have suspended teaching for the duration. Lecture halls, libraries and laboratories stand empty while their students hold the streets, and the research programs that depend on them are at a standstill."
 SIA_strike_shutdown: "General Shutdown"
 SIA_strike_shutdown_desc: "The shop floors are empty and so are the tills. Nothing is being made and nothing is being collected."
 SIA_strike_supply_freeze: "Supply Freeze"
 SIA_strike_supply_freeze_desc: "The mines are cut off from the ports and the ports are cut off from the sea. Whatever the country digs up is sitting where it was dug."
 SIA_strike_world_watching: "The World Is Watching"
 SIA_strike_world_watching_desc: "Every foreign desk in Bangkok is fully staffed and looking for a source. The government cannot move against the strike quietly, and neither can it keep anyone else out of its business."
 SIA_strike_barracks_agitation: "Barracks Agitation"
 SIA_strike_barracks_agitation_desc: "The movement's organizers are working the conscript barracks rather than the ministries. Every week spent turning soldiers against their officers is a week nobody is minding the machinery of government."
 SIA_not_ruled_by_reformists_tt: "§Y[socialism_L]§! is not the ruling party."
 SIA_not_ruled_by_chakri_tt: "§Y[Monarchist_L]§! is not the ruling party."
 SIA_ruling_ncpo_tt: "§Y[Nat_Autocracy_L]§! is the ruling party."
 SIA_ruling_chakri_tt: "§Y[Monarchist_L]§! is the ruling party."
 SIA_drive_ghosts_tt: "Weekly §Y[communist_state_L]§! support: §G+0.35%§! for §Y52§! weeks\n£emerging_outlook_campaign_cost_modifier_texticon Weekly §YEmerging Outlook§! support: §G+0.35%§! for §Y52§! weeks"
 SIA_drive_isaan_tt: "Weekly §Y[communist_state_L]§! support (on top of any running drive): §G+0.21%§! for §Y52§! weeks\n£emerging_outlook_campaign_cost_modifier_texticon Weekly §YEmerging Outlook§! support (on top of any running drive): §G+0.21%§! for §Y52§! weeks"
 SIA_drive_reform_tt: "Weekly §Y[socialism_L]§! support: §G+0.35%§! for §Y52§! weeks\n£western_outlook_campaign_cost_modifier_texticon Weekly §YWestern Outlook§! support: §G+0.35%§! for §Y52§! weeks"
 SIA_red_road_elections_tt: "Begins the Communist revolution path. §RExtraordinary Elections§! cannot be called until revolution ends or the next scheduled election passes."
 SIA_ppw_uprising_tt: "[communist_state_L] will start a §Rcivil war§! with §Y50%§! strength. \n§tYou will take control of the uprising.§!"
 SIA_strike_momentum_status_live: "[?ROOT.SIA_strike_momentum|0]/100, §Y[?ROOT.SIA_strike_days_left|0]§! days left before the army moves"
 SIA_strike_momentum_status_idle: "§LNot active§!"
 SIA_strike_student_walkout: "The Students Walk Out"
 SIA_strike_student_walkout_desc: "Students at Thammasat and Chulalongkorn universities leave their lecture halls for the streets at a day's notice. The Thai student movement has precedent for this: the uprising of October 1973 brought down the Thanom government, and the Thammasat massacre of October 1976 ended the democratic period that followed. Campus mobilization is rapid and needs little preparation, but it empties the universities and raises the risk of confrontation.\n\nRuns for §Y7 days§!, then repeatable §Y20 days§! after it ends. Costs §R3%§! stability and slows research for 30 days."
 SIA_strike_foreign_press: "Invite the Foreign Press"
 SIA_strike_foreign_press_desc: "The strike committee arranges access for foreign correspondents, placing the barricades on news broadcasts in Tokyo, London and New York. International coverage does not prevent the army from clearing the streets, but it raises the diplomatic cost of doing so and tends to delay the decision. The same publicity advertises the Kingdom's instability to governments in a position to exploit it.\n\nRuns for §Y7 days§!, then repeatable §Y60 days§! after it ends. Costs §R3%§! war support and leaves the country open to foreign influence for 30 days."