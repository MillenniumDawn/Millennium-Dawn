 UKR_bureau_open_desc: "§Y행정§! 지출을 §Y최고라다§!의 안건에 올립니다. 토론이 열려 있는 동안 우리는 §R더 높은§! 예산 또는 §G더 낮은§! 예산을 요청할 수 있습니다. 요청에는 §Y30§!일이 걸리며, 그 뒤 의원들이 표결합니다. 승인 확률은 우리를 지지하는 의석 수와 우리가 라다에 미치는 영향력에 달려 있습니다. 개혁에서 얻은 보너스는 의원들이 §G더 낮은§! 예산을 승인할 의향을 높여 줍니다."
 UKR_bureau_close_desc: "§Y행정§! 지출을 §Y최고라다§!의 안건에서 내립니다. 우리가 다시 토론을 열 때까지 지출 요청은 사라집니다."
