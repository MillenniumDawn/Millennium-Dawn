 ENG_type_23_lifex: "Extensión de Vida del Tipo 23"
 ENG_type_23_lifex_desc: "La fragata Tipo 23 fue diseñada para una vida útil del casco de dieciocho años, pero a mediados de la década de 2000, los dieciséis barcos supervivientes eran toda la fuerza de escolta. El programa de Extensión de Vida, conocido universalmente como LIFEX, llevó cada casco a su vez a través de una revisión completa en Devonport: nuevos generadores diésel y cajas de engranajes, renovación estructural, el radar Artisan Tipo 997 en lugar del Tipo 996, y el Sea Ceptor reemplazando al Sea Wolf. El trabajo prolongó la vida de los barcos individuales más allá de los treinta años en servicio y le dio a la Royal Navy la década que necesitaba para diseñar un sucesor."
 ENG_future_surface_combatant: "Combate de Superficie Futuro"
 ENG_future_surface_combatant_desc: "Iniciado en 1998 y reestructurado en varias ocasiones, el programa de Combate de Superficie Futuro fue el intento de definir qué seguiría a los Tipos 22 y 23. Pasó por los estudios de Capacidad de Combate de Superficie Sostenida y los conceptos C1, C2 y C3: un barco antisubmarino, un barco de propósito general y un buque de patrulla capaz de operar en el océano, antes de converger en un solo casco flexible comercializado como el Buque de Combate Global. Cada fragata británica diseñada después hereda los supuestos establecidos aquí."
 ENG_ark_royal_class_carrier: "Portaaviones Clase Ark Royal"
 ENG_ark_royal_class_carrier_desc: "Con el Queen Elizabeth y el Prince of Wales en servicio, surge la pregunta de qué los sucederá. Un tercer casco construido con un diseño revisado pondría fin a la situación que deja a la flota sin un portaaviones de ataque cada vez que un barco entra en mantenimiento profundo, y llevaría un nombre que han portado cinco barcos de guerra británicos anteriores, el más reciente siendo el barco de la clase Invincible dado de baja en 2011."
 ENG_type_45_daring_class: "Destructor Clase 45 Daring"
 ENG_type_45_daring_class_desc: "Ordenado después de que Gran Bretaña abandonara el programa de fragatas trilateral Horizon en 1999, el Tipo 45 se construyó alrededor del sistema Sea Viper, el radar multifunción Sampson montado en el mástil y el radar de largo alcance S1850M. Seis barcos fueron ensamblados en Govan, Scotstoun y Portsmouth entre 2003 y 2013 para reemplazar a los Tipo 42. Daring y Dauntless lideran la clase, y juntos proporcionan a la Royal Navy la plataforma de defensa aérea de área más capaz que haya operado."
 ENG_aukus_programme: "Programa AUKUS"
 ENG_aukus_programme_desc: "Anunciado en septiembre de 2021, la asociación AUKUS compromete al Reino Unido, los Estados Unidos y Australia a un submarino de ataque de propulsión nuclear común. El diseño SSN-AUKUS es liderado por los británicos y surge de los estudios de sucesión del Astute, combinando una planta de reactor Rolls-Royce con sistemas de combate y lanzamiento vertical estadounidenses. La construcción se comparte entre Barrow-in-Furness y Osborne, uniendo tres bases industriales en una sola línea de producción para el resto del siglo."
 ENG_albion_class_lpd: "Buque de Desembarco Clase Albion"
 ENG_albion_class_lpd_desc: "El programa de reemplazo de Buques de Desembarco entregó los HMS Albion y HMS Bulwark, comisionados en 2003 y 2004 en lugar de los desgastados Fearless e Intrepid. Cada barco lleva un dique inundable para cuatro embarcaciones de desembarco utilitarias, una cubierta para vehículos, una cubierta de vuelo capaz de recibir dos helicópteros medianos, y los espacios de mando para un grupo de trabajo anfibio. Son las plataformas desde las cuales los Royal Marines despliegan una brigada en tierra."
 ENG_royal_marines_future_commando_force: "Fuerza de Comandos del Futuro"
 ENG_royal_marines_future_commando_force_desc: "El programa Fuerza de Comandos del Futuro aleja a la 3ª Brigada de Comandos de los desembarcos anfibios masivos y la orienta hacia incursiones avanzadas persistentes. Los comandos operan en equipos pequeños y autónomos, trabajan desde auxiliares convertidos y buques de ataque litoral en lugar de desde una cabeza de playa, y están equipados para reconocimiento, sabotaje y la toma de terrenos marítimos clave. Es el cambio más grande en la doctrina de los Royal Marines desde la Segunda Guerra Mundial."
 ENG_royal_marines_littoral_response_group: "Grupo de Respuesta Litoral"
 ENG_royal_marines_littoral_response_group_desc: "Dos Grupos de Respuesta Litoral, uno desplegado en el Atlántico Euro y otro al este de Suez, mantienen un grupo de compañía de comandos y sus barcos permanentemente en el mar. Construidos alrededor de un buque de desembarco Clase Albion y auxiliares Clase Bay, proporcionan una capacidad permanente para evacuación, alivio de desastres, entrenamiento con fuerzas aliadas y incursiones, disponible en días en lugar de las semanas que tomaría a una fuerza de tarea reunirse."
 ENG_royal_marines_arctic_warfare_centre: "Centro de Guerra Ártica"
 ENG_royal_marines_arctic_warfare_centre_desc: "Gran Bretaña ha mantenido el compromiso de clima frío con el flanco norte de la OTAN desde la década de 1970, enviando a la 3ª Brigada de Comandos a Bardufoss y Porsangmoen cada invierno. Formalizar ese despliegue estacional en un establecimiento de entrenamiento permanente preserva el cuerpo de líderes de esquí y montaña, las tripulaciones de vehículos sobre nieve y los instructores de supervivencia, y mantiene a los Royal Marines como la formación de referencia de la alianza para operaciones por encima del Círculo Polar Ártico."
 ENG_military.048.t: "La propuesta del AUKUS"
 ENG_military.048.d: "Londres propone una asociación trilateral con Washington y Canberra, construida en torno a un submarino de ataque de propulsión nuclear común. El diseño británico surge de los estudios del sucesor del Astute y combina una planta de reactor Rolls-Royce con sistemas de combate y celdas de lanzamiento vertical estadounidenses. La solicitud va más allá de cualquier acuerdo previo: desde el Acuerdo de Defensa Mutua de 1958, la propulsión nuclear naval se ha compartido únicamente con el Reino Unido, y los británicos piden ahora que Australia sea admitida en él. La aprobación abriría Barrow-in-Furness y Osborne como una única línea de producción y situaría cazadores-bombarderos aliados en el este del océano Índico durante el resto del siglo."
 ENG_military.048.a: "Extender el acuerdo de propulsión a Canberra"
 ENG_military.048.b: "El reactor se queda dentro del acuerdo de 1958"
 ENG_military.049.t: "Buques nucleares o el orden convencional"
 ENG_military.049.d: "El Reino Unido y los Estados Unidos han ofrecido a Australia un submarino de ataque de propulsión nuclear, el primero suministrado a un país sin armas nucleares propias. El precio es el programa de sustitución convencional existente, cuyo contrato tendría que ser cancelado por completo y su socio europeo compensado. En su lugar llegan rotaciones a través de HMAS Stirling, un astillero reconstruido en Osborne y un pago a las bases industriales británica y estadounidense para comprar la capacidad de producción que necesitarán nuestros propios submarinos. La decisión compromete a la Commonwealth a una fuerza de submarinos que no puede mantener sin el apoyo aliado, y a la asociación que la suministra."
 ENG_military.049.a: "Cancelar el pedido y construir submarinos nucleares en Osborne"
 ENG_military.049.b: "Cumpliremos el contrato que firmamos"
 ENG_military.050.t: "Se firma el pacto AUKUS"
 ENG_military.050.d: "Los tres gobiernos han anunciado la asociación. Australia operará un submarino de ataque de propulsión nuclear construido con un diseño británico; la planta del reactor, el sistema de combate y los astilleros que los ensamblan son ahora una empresa compartida. Barrow-in-Furness obtiene un pedido de exportación que respalda al sucesor del Astute durante décadas, y los ingenieros navales británicos, estadounidenses y australianos trabajarán a partir de un conjunto común de planos por primera vez."
 ENG_military.050.a: "Tres armadas, un submarino"
 ENG_military.051.t: "El contrato es roto en pedazos"
 ENG_military.051.d: "Canberra ha cancelado el programa de submarinos sin previo aviso y sin consultas, y lo ha hecho para aceptar una oferta angloestadounidense negociada a nuestras espaldas. El pedido era el mayor contrato de defensa que nuestros constructores navales habían ganado jamás, y su pérdida recae directamente sobre los astilleros y los equipos de diseño que ya habían comenzado a trabajar. Nuestros embajadores están siendo llamados a consultas. Sea cual sea el argumento estratégico para el nuevo acuerdo, los aliados no se enteran de tales decisiones por la prensa."
 ENG_military.051.a: "Una puñalada por la espalda"
 ENG_military.052.t: "Washington retiene el reactor"
 ENG_military.052.d: "Los Estados Unidos se han negado a extender la propulsión nuclear naval más allá del acuerdo de 1958. Las objeciones sobre la no proliferación siempre iban a plantearse, y Washington ha decidido que pesan más que la ganancia estratégica. El submarino se construirá, pero se construirá solo."
 ENG_military.052.a: "Entonces lo construiremos nosotros mismos"
 ENG_military.053.t: "Canberra rechaza"
 ENG_military.053.d: "Australia ha optado por mantener su programa de submarinos convencionales existente. La oferta de un buque de propulsión nuclear conllevaba obligaciones que Canberra no estaba dispuesta a aceptar, desde los costes por cancelación hasta una dependencia de mantenimiento que se prolongaría durante más de medio siglo. La asociación no seguirá adelante."
 ENG_military.053.a: "La oferta se mantiene en pie si cambian de opinión"
 ENG_military.054.t: "Anuncio del AUKUS"
 ENG_military.054.d: "El Reino Unido, los Estados Unidos y Australia han anunciado una asociación de seguridad trilateral cuya primera empresa es un submarino de ataque de propulsión nuclear común. Australia se convierte en el primer país sin armas nucleares en operar uno. La reacción es inmediata: los expertos en proliferación cuestionan las salvaguardias sobre el combustible naval altamente enriquecido, Pekín condena el acuerdo como un bloque dirigido en su contra, y el socio europeo cuyo contrato fue cancelado ha llamado a consultas a sus embajadores."
 ENG_military.054.a: "El equilibrio en el Indo-Pacífico cambia"
 AST_aukus_submarine_programme: "Programa de submarinos AUKUS"
 AST_aukus_submarine_programme_desc: "El astillero de Osborne se está reconstruyendo para ensamblar submarinos de ataque de propulsión nuclear bajo un diseño británico, con una mano de obra formada mediante rotaciones en Barrow-in-Furness y en los astilleros estadounidenses. Las plantas de los reactores llegan como unidades selladas, pero el casco, la integración del sistema de combate y toda una vida de trabajos de sostenimiento permanecen en Australia del Sur, otorgando a la Commonwealth una industria de submarinos que jamás había poseído a esta escala."
 britain_md.300.t: "Los bloques de construcción detrás del diseño"
 britain_md.300.d: "Arm va a comprar Artisan Components, pasando de los diseños de procesadores a las bibliotecas físicas que transforman cualquier diseño en silicio real. Es un paso adelante en la cadena de valor y una salida del puro negocio de las licencias. El Tesoro debe decidir si las desgravaciones por investigación británicas siguen a la empresa en esta dirección."
 britain_md.300.a: "Extender las desgravaciones por investigación al trabajo de diseño físico"
 britain_md.300.b: "Dejar que la adquisición se sostenga por sus propios méritos comerciales"
 britain_md.301.t: "El procesador en cada bolsillo"
 britain_md.301.d: "Un núcleo Arm se encuentra en el centro del nuevo teléfono de Apple, y en el de casi todos los rivales que le seguirán. Las regalías de cada chip se miden en centavos y el volumen se mide en miles de millones. Cambridge ha construido algo de lo que ahora depende toda la industria sin poseer nada de ella."
 britain_md.301.a: "Financiar el clúster de diseño de Cambridge en torno a él"
 britain_md.301.b: "Dejar que el modelo de licencias se sostenga por sí mismo"
 britain_md.302.t: "Sesenta y cuatro bits"
 britain_md.302.d: "ARMv8 lleva la arquitectura Arm a los 64 bits, y con ella a los servidores y centros de datos que Intel ha poseído sin un competidor serio. Whitehall puede respaldar la arquitectura británica mediante la informática pública o dejar la cuestión en manos del mercado. La contratación pública es la única palanca que se mueve con esta rapidez."
 britain_md.302.a: "Comprometer la informática pública con esta arquitectura"
 britain_md.302.b: "Mantener la plataforma comercialmente neutral"
 britain_md.303.t: "La oferta de SoftBank"
 britain_md.303.d: "SoftBank ha ofrecido 24 300 millones de libras por Arm, con una prima que ningún comprador británico igualará, y compromisos sobre la sede central y la plantilla británica. La empresa se quedaría en Cambridge. La propiedad no seguiría siendo británica."
 britain_md.303.a: "Tomar una participación pública antes de que se complete la venta"
 britain_md.303.b: "Aceptar los compromisos y permitir que la venta proceda"
 britain_md.304.t: "Cuarenta mil millones de dólares por Arm"
 britain_md.304.d: "Nvidia ha acordado comprar Arm a SoftBank. Los propios licenciatarios de Arm, que compiten con Nvidia en todos los mercados relevantes, han preguntado en público qué neutralidad sobreviviría a la venta. La decisión pertenece a la autoridad de la competencia y a los ministros que la instruyen."
 britain_md.304.a: "Aprobar la venta bajo condiciones de comportamiento vinculantes"
 britain_md.304.b: "Remitirla por motivos de seguridad nacional"
 britain_md.305.t: "Dónde cotiza Arm"
 britain_md.305.d: "SoftBank va a sacar a bolsa a Arm de nuevo y ha elegido Nueva York. A Londres se le ha dicho claramente que sus normas de cotización, sus ponderaciones en los índices y su base de inversores no podrían retener a la mayor empresa tecnológica que ha producido Gran Bretaña. Mantener la salida a bolsa en casa significaría reescribir las tres cosas."
 britain_md.305.a: "Reformar las normas de cotización y fijar la salida a bolsa en Londres"
 britain_md.305.b: "Aceptar la cotización en Nueva York y mantener la sede central"
 britain_md.306.t: "En lo que se convirtió Arm"
 britain_md.306.d: "Un cuarto de siglo de licencias, absorciones y salidas a bolsa ha determinado lo que es Arm: quién posee la empresa de Cambridge cuya arquitectura se encuentra dentro de casi todos los teléfonos de la Tierra, y qué mercado de valores le pone precio."
 britain_md.306.a: "Una participación soberana en la arquitectura"
 britain_md.306.b: "The architecture of somebody else's platform"
 britain_md.306.c: "Cotizada en casa"
 britain_md.306.e: "Una isla que otorga licencias al mundo"
 ENG_arm_sovereign_architecture_stake: "Participación soberana en la arquitectura"
 ENG_arm_sovereign_architecture_stake_desc: "El Estado posee acciones en la empresa sobre cuya base de instrucciones construye el mundo, y un veto sobre su rumbo futuro. La participación rinde menos de lo que lo haría en el mercado y compra algo que el mercado no vende."
 ENG_arm_foreign_platform_architecture: "Arquitectura de una plataforma extranjera"
 ENG_arm_foreign_platform_architecture_desc: "Arm pertenece a una empresa más grande ahora, y la hoja de ruta sirve primero al silicio de esa empresa. La ingeniería se sigue realizando en Cambridge, a una escala que ningún licenciante independiente podría haber financiado, y bajo los términos de otra persona."
 ENG_arm_listed_at_home: "Cotizada en casa"
 ENG_arm_listed_at_home_desc: "La salida a bolsa se quedó en Londres, y las normas se reescribieron para mantenerla. La bolsa cuenta por fin con un anclaje tecnológico, y las reformas que lo lograron se aplican a todos los que coticen después."
 ENG_arm_licensing_island: "Una isla que otorga licencias al mundo"
 ENG_arm_licensing_island_desc: "Los diseños son británicos, los propietarios no, y las acciones cotizan en Nueva York. Gran Bretaña conserva a los ingenieros, las regalías y la reputación, y nada del control que estuvo dos veces disponible y dos veces se rechazó."
 ENG_scottish_agitation_rising_tt: "La agitación escocesa está por encima de 10."
 ENG_north_irish_agitation_rising_tt: "La agitación norirlandesa está por encima de 10."
 ENG_wales_agitation_rising_tt: "La agitación galesa está por encima de 10."
 devolution.20.t: "Fracasa el desarme"
 devolution.20.d: "La Comisión Internacional Independiente del Desarme ha suspendido sus labores. La tensión sobre el terreno escaló más rápido de lo que los inspectores tardaban en certificar los zulos de armas, y las cúpulas paramilitares han retirado a sus interlocutores para evitar que se les vea desarmándose mientras las calles arden. Tanto las organizaciones leales como las republicanas insisten en que las armas nunca fueron el obstáculo, y cada bando culpa al otro del colapso. Lo que ya se puso fuera de uso no va a regresar, pero tampoco se entregará nada más a partir de ahora, y será mucho más difícil volver a sentar al movimiento a la mesa de negociación ahora que sus partidarios de la línea dura pueden decir que el tiempo les dio la razón."
 devolution.20.a: "Reducir la tensión e intentarlo de nuevo"
 devolution.21.t: "Fuera de uso"
 devolution.21.d: "La Comisión ha informado que ha sido testigo del desmantelamiento de la totalidad de los arsenales restantes. Los zulos sellados con fusiles, Semtex, morteros y ametralladoras pesadas han quedado permanentemente inaccesibles bajo supervisión independiente, con clérigos de ambas comunidades presentes como testigos. Las facciones disidentes que pasaron años denunciando el proceso de paz como una traición se han quedado sin lo único por lo que valía la pena denunciarlo. El reclutamiento se ha derrumbado, las redes de recaudación de fondos en los Estados Unidos se han secado, y la Sección Especial evalúa que lo que queda es un residuo criminal en lugar de una insurgencia. Irlanda del Norte aún no se ha reconciliado, pero por primera vez desde 1969, no está armada."
 devolution.21.a: "La guerra ha terminado"
 devolution.23.t: "Westminster ofrece la unificación"
 devolution.23.d: "El referéndum fronterizo ha arrojado una mayoría a favor de una Irlanda unida y, según los términos del Acuerdo, el gobierno británico está obligado a hacer efectiva esa voluntad. Londres ha invitado formalmente a Dublín a aceptar la soberanía sobre los seis condados. La oferta es real, y también la factura que conlleva: dos millones de personas, una subvención económica que Westminster ha soportado durante décadas, un servicio de policía en el que la mitad de la población todavía no confía, y una comunidad unionista que votó en contra de esto y no se va a ir a ninguna parte. Aceptar significa que la República lo hereda todo, junto con la ambición más antigua de la política irlandesa. Rechazar significa decirle a la mayoría del Norte que la República no los quiere."
 devolution.23.a: "Una Irlanda esclava nunca estará en paz"
 devolution.23.b: "No estamos preparados para cargar con el Norte"
 devolution.24.t: "Fracasa el referéndum fronterizo"
 devolution.24.d: "El recuento ha terminado y la Unión resiste. La participación fue alta en ambos bandos y la campaña hizo lo que las campañas en Irlanda del Norte siempre hacen, que es recordar a todo el mundo lo que los divide; sin embargo, cuando la pregunta se planteó realmente, la respuesta fue no. Los políticos nacionalistas ya han empezado a discutir si el referéndum se convocó demasiado pronto, y los partidos unionistas están tratando el resultado como un acuerdo definitivo en lugar de un respiro temporal. El secretario de Estado ha confirmado que no se contemplará otra votación en el futuro previsible."
 devolution.24.a: "La pregunta ha sido respondida, por ahora"
 devolution.25.t: "Dublín acepta"
 devolution.25.d: "El Taoiseach ha confirmado ante la Cámara que la República aceptará la soberanía sobre Irlanda del Norte. La transferencia procederá según los términos del Acuerdo, con garantías escritas para la comunidad unionista dentro del pacto y manteniendo la ciudadanía británica para todos aquellos que la deseen. Aquí no hay ninguna derrota que vengar ni ningún tratado impuesto a punta de pistola. Un siglo de la cuestión irlandesa se cierra con un voto, un traspaso de poderes y una gran cantidad de personas en el Úlster que nunca llamarán a este lugar su hogar."
 devolution.25.a: "El pueblo ha hablado"
 devolution.26.t: "Dublín rechaza"
 devolution.26.d: "La República se ha negado. Los ministros de Dublín se han mostrado amables en público y contundentes en privado: solo la subvención económica se tragaría su presupuesto, la carga de seguridad es algo que no tienen capacidad de soportar, y no hay apetito en los veintiséis condados por heredar una minoría unionista que los considera una potencia extranjera. El Norte votó a favor de marcharse y se le ha dicho que no tiene a dónde ir. La opinión nacionalista ha tomado la negativa como una humillación, y será Westminster quien tenga que vivir con las consecuencias."
 devolution.26.a: "Nos quedamos solos al frente de la Provincia"
 devolution.27.t: "El levantamiento del Úlster"
 devolution.27.d: "Stormont ha desaparecido, el Acuerdo es papel mojado, y la garantía constitucional que mantenía al movimiento republicano dentro de la política se fue con él. Lo que comenzó como disturbios tras la revocación se ha convertido en algo que el jefe de policía ya no describirá como mero desorden público. Las comisarías de policía han sido asaltadas, las patrullas del ejército están siendo atacadas con armamento pesado a plena luz del día, y una administración provisional que reclama la autoridad sobre los seis condados ha declarado la independencia de la Provincia respecto a la Corona. La última vez que Gran Bretaña libró esta guerra hicieron falta treinta años y un acuerdo negociado para ponerle fin. Ahora no hay ningún acuerdo al que recurrir."
 devolution.27.a: "Entonces la recuperaremos por la fuerza"
 devolution.28.t: "El levantamiento al otro lado de la frontera"
 devolution.28.d: "Los británicos han roto el Acuerdo y el Norte está en abierta rebelión. Un gobierno provisional en Belfast ha pedido a Dublín reconocimiento, armas y hombres, y el llamamiento se ha hecho de forma lo suficientemente pública como para que el silencio se interprete como una respuesta. Los artículos dos y tres fueron enmendados, no olvidados, y hay un sector de la población aquí que ha esperado toda una vida exactamente este momento. También hay un ejército británico, un arsenal nuclear británico y cada argumento que la República ha esgrimido desde 1998 de que la frontera se cambiaría por consentimiento y por nada más."
 devolution.28.a: "Reconocer al Gobierno Provisional y marchar"
 devolution.28.b: "Armarlos y no admitir nada"
 devolution.28.c: "Esta no es nuestra guerra"
 ENG_decommission_paramilitaries: "Desarmar a los paramilitares"
 ENG_decommission_paramilitaries_desc: "La Comisión Internacional Independiente del Desarme lleva constituida desde 1997 sin haber recibido jamás un arsenal completo. Las facciones republicanas disidentes que rechazaron el Acuerdo no tienen interés en desarmarse mientras puedan seguir reclutando, y reclutan allí donde las barriadas son pobres y la tensión es alta. Respalda a la Comisión con dinero y poder político, mantén la tensión sectaria lo suficientemente baja como para que los intermediarios sigan dialogando, y dale dos años; así los últimos arsenales podrán quedar permanentemente inutilizados. Si dejas que la tensión vuelva a subir, todo el proceso colapsará.\n\nRequiere el §YAcuerdo de Viernes Santo§! como marco de trabajo.\n\nTensión sectaria: §Y[?ENG_north_irish_agitation|0]§!/§G15§!\nDependencia de Irlanda del Norte: §Y[?ENG_north_irish_dependency|0]§!/§G60§!\nDesempleo: §Y[?total_unemployed_percentage_display|%]§!/§G10%§!"
 ENG_call_border_poll: "Convocar un referéndum fronterizo"
 ENG_call_border_poll_desc: "El Acuerdo obliga al secretario de Estado a convocar un plebiscito siempre que parezca probable que una mayoría en Irlanda del Norte votaría a favor de una Irlanda unida, y obliga al gobierno británico a hacer efectivo el resultado. Los partidos nacionalistas ostentan ahora el equilibrio de poder en Stormont y la demanda ya no puede aplazarse sin romper el Acuerdo por completo. Un plebiscito requiere un año de campaña y el resultado será el que dicte la opinión pública norirlandesa en el momento del recuento, por lo que ese año de campaña importa tanto como la decisión de convocarlo.\n\nLos paramilitares deben desarmarse primero. Ninguna votación celebrada bajo la amenaza de las armas sería aceptada por ninguna de las comunidades.\n\nNacionalismo norirlandés: §Y[?ENG_north_irish_nationalists|0]§!/§G55§!"
 ENG_border_poll_mission: "La campaña del referéndum fronterizo"
 ENG_border_poll_mission_desc: "El referéndum ha sido convocado y la campaña tiene un año por delante. El resultado se decidirá según la posición del nacionalismo norirlandés el día de la votación, no donde se encontraba cuando se fijó la fecha. Una clara mayoría nacionalista saca a la Provincia de la Unión y la introduce en la República, siempre que Dublín esté dispuesta a aceptarla. Cualquier cosa por debajo de eso dejará la cuestión constitucional cerrada durante años y a un movimiento nacionalista derrotado en las urnas, consciente de ello.\n\nNacionalismo norirlandés: §Y[?ENG_north_irish_nationalists|0]§!\nUn 'Sí' claro requiere más de §G65§!."
 ENG_all_ireland_dominion: "Un dominio para toda Irlanda"
 ENG_all_ireland_dominion_desc: "Con la República respondiendo ya ante Londres, la frontera se ha convertido en una línea administrativa en lugar de una constitucional. Entregar los seis condados a Dublín no nos cuesta nada que no hayamos asegurado ya: toda la isla se gobierna desde una capital que está gobernada por nosotros. Resuelve el agravio más antiguo de estas islas a nuestro favor y a nuestra conveniencia, retira la subvención económica y la guarnición, y deja al movimiento republicano con una Irlanda unida que no pueden celebrar.\n\nEsto requiere que la descentralización norirlandesa esté genuinamente resuelta primero. Una provincia entregada en mitad de una crisis es una crisis exportada, no solucionada.\n\nTensión sectaria: §Y[?ENG_north_irish_agitation|0]§!/§G10§!\nDependencia de Irlanda del Norte: §Y[?ENG_north_irish_dependency|0]§!/§G70§!\nPresión de independencia: §Y[?ENG_north_irish_pressure|0]§!/§G40§!"
 ENG_repeal_good_friday_agreement: "Derogar el Acuerdo de Viernes Santo"
 ENG_repeal_good_friday_agreement_desc: "El Acuerdo nos cuesta una subvención económica permanente, un cuerpo policial sobredimensionado y un ejecutivo de poder compartido en el que hombres que antaño dirigían campañas de atentados ocupan cargos ministeriales. Derógalo, suspende Stormont y gobierna la Provincia directamente desde Londres como hacíamos antes de 1998. El ahorro es inmediato y todo lo demás también: la garantía constitucional que mantenía al movimiento republicano dentro de la política desaparece, los paramilitares regresan y la tensión sectaria se sentirá con todo su peso sin nada que la amortigüe.\n\nEl Úlster se levantará. Tendremos una cuestión de meses para contener a la Provincia antes de que ocurra."
 ENG_repeal_gfa_remove_TT: "Elimina §Y$ENG_good_friday_agreement$§!"
 ENG_ulster_on_the_brink_activated_TT: "Activa §RÚlster al límite§!: tenemos §Y180§! días para forzar la tensión sectaria de Irlanda del Norte por debajo de §G20§!, o la dirección republicana provisional se declarará en rebeldía y lucharemos por la Provincia."
 ENG_ulster_on_the_brink: "Úlster al límite"
 ENG_ulster_on_the_brink_desc: "El Acuerdo ha desaparecido y la Provincia se está desmoronando. Los disturbios se han vuelto crónicos, el ejército ha vuelto a las calles en un número no visto desde los años setenta, y ambas comunidades se están armando bajo la premisa de que nadie va a venir a protegerlas. Si se logra forzar la reducción de la tensión sectaria en un plazo de seis meses, la Provincia podrá retenerse sin necesidad de un acuerdo y sin un levantamiento. Si no se consigue, la dirección republicana provisional se declarará en rebeldía y lucharemos por el Úlster.\n\nTensión sectaria: §Y[?ENG_north_irish_agitation|0]§!\nDebe caer por debajo de §G20§!."
 OPEN_devolution_BUTTON: "Asuntos descentralizados"
 OPEN_devolution_BUTTON_TT: "Abre el panel de descentralización y gestiona Escocia, Gales e Irlanda del Norte."
