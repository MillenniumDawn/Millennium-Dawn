 REVOKE_MIL_GNSS_ACCESS_TITLE: "군용 위성항법시스템 접근 취소"
 REVOKE_MIL_GNSS_ACCESS_ACTION_DESC: "우리의 암호화된 군용 위치 파악 네트워크에 대한 모든 업링크 자격 증명을 취소하고 즉시 통합 접근을 종료합니다. 이 조치는 방위 작전에 필수적인 항법 능력을 차단하고, 정밀 유도 시스템을 비활성화하며, 전략적 신뢰의 근본적인 파기를 나타냅니다. 이러한 조치는 양국 간 안보 협력 및 작전 상호 운용성에 심각한 영향을 미칩니다. 그들은 우리의 §Y군용 위성항법시스템 위성 네트워크§!에 대한 모든 접근 권한을 상실할 것입니다."
 REVOKE_MIL_GNSS_ACCESS_LOC: "군용 위성항법시스템 접근 취소 보내기"
 REVOKE_MIL_GNSS_ACCESS_RECIEVER_LOC: "그들이 자국의 군용 위성항법시스템 네트워크에 대한 우리의 접근 권한을 취소하고 있습니다."
 REVOKE_MIL_GNSS_ACCESS_ACCEPTED_TITLE: "군용 위성항법시스템 접근 취소"
 REVOKE_MIL_GNSS_ACCESS_ACCEPTED_DESC: "그들이 자국의 군용 위성항법시스템 네트워크에 대한 우리의 접근 권한을 취소하고 있습니다."
 REQUEST_CIV_GNSS_ACCESS_TITLE: "민간용 위성항법시스템 접근"
 REQUEST_CIV_GNSS_ACCESS_ACTION_DESC: "강화된 항법 및 물류 조정을 위해 그들의 민간용 위성 위치 파악 네트워크에 대한 통합 접근을 요청합니다. 여기에는 표준 데이터 공유 계약, 기술적 호환성 평가, 우리 시스템을 위한 업링크 프로토콜 구축이 포함됩니다. 이러한 접근은 운송, 응급 서비스, 인프라 관리에 걸친 운영 효율성을 개선시킵니다. 수락되면 우리는 그들의 §Y민간용 위성항법시스템 위성 네트워크§!에 접근할 수 있게 됩니다."
