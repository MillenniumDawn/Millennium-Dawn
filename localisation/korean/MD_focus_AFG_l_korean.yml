 AFG_MOTDIV_Tooltip: "£GFX_unit_category_apc_icon_small §Y기계화 보병§! 중대 7개와 §Y포병§! 포대 2개로 구성된 §Y기계화 연대§! 1개를 편성합니다. 위치: §g$STATE_411$§!"
 AFG_Mujahideen_units_tooltip: "£GFX_unit_category_militia_icon_small §Y민병§! 중대 3개로 구성된 §Y민병 연대§! 2개를 편성합니다. 위치: §g$STATE_411$§!"
