 UKR_varyag_expand_mykolaiv_shipyard_desc: "\n\n\n\n\n\n£UKR_desctext_varyag_refit_for_tooltip\n\n\n\n\n\n\n\n\n§WПрофинансировать шестимесячное расширение §!§LЧерноморского судостроительного завода§!§W, чтобы добавить §!§G1 военную верфь§!§W в §!§YНиколаеве§!§W. Для достройки §!§Y«Варяга»§!§W там нужно не менее двух верфей.§!"
