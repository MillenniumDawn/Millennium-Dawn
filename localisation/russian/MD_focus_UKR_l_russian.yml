 UKR_storage_item_ak47_icon: "GFX_SOV_INF_INF2"
 UKR_storage_item_ak47_tt: "§YАК-47§!\n\n\n£SOV_INF_INF2\n\n\n\nНа хранении: §Y[?ukraine_has_ak47_stockpile|0]§!\nПоколение: автомат, на вооружении с 1949 года.\nТип техники: §YПехотное снаряжение§!\n\nВарианты на хранении:\n• АК-47: §Y[?ukraine_has_ak47_stockpile|0]§!\n\nРанние автоматы Калашникова с фрезерованной ствольной коробкой, которые в нашей армии сменили §YАКМ§! и §YАК-74§!."
