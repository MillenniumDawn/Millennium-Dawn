 JAP_whistleblower_protection_act: "Lei de Proteção a Denunciantes"
 JAP_whistleblower_protection_act_desc: "Os auditores só podem ler o que a empresa lhes entrega, enquanto os funcionários sabem quais empréstimos foram renovados e quais notas foram datadas retroativamente. Eles trabalham para a empresa que teriam de acusar, num mercado de trabalho que oferece uma carreira e nenhuma segunda chance. Uma lei que torne ilegal a demissão por denúncia transforma testemunhas silenciosas em declarantes."
 JAP_financial_revival_program: "O Programa de Revitalização Financeira"
 JAP_financial_revival_program_desc: "Os bancos classificam seus próprios devedores, e as notas escondem uma incapacidade de pagar. O Programa de Revitalização Financeira aplica a avaliação por fluxo de caixa descontado a toda grande exposição, aperta os limites de capital sobre ativos e publica a meta de reduzir pela metade o índice de empréstimos podres. As federações empresariais o chamarão de guerra contra a indústria, e não estarão inteiramente erradas."
 JAP_special_investigation_unit: "Departamento de Investigações Especiais"
 JAP_special_investigation_unit_desc: "Uma auditoria produz uma constatação; um promotor produz um réu. O Departamento de Investigações Especiais da Promotoria Distrital de Tóquio já derrubou ministros de gabinete e é a única instituição com a qual o conselho de um keiretsu não consegue fazer um acordo discreto. Ele agora aponta para os balanços."
 JAP_special_investigation_unit_TT: "A Obstrução agora se acumula §G25% mais devagar§!"
 JAP_the_lost_decade_ends: "O Fim da Década Perdida"
 JAP_the_lost_decade_ends_desc: "A última das empresas insolventes passa pelos tribunais e o registro é encerrado. Nada foi refinanciado, cada perda foi lançada onde ocorreu, e o crédito agora chega apenas às empresas que podem pagá-lo. Uma economia cujos livros dizem a verdade é o único alicerce sobre o qual qualquer outra coisa pode ser construída.\n-------------\nEste foco §Gremove§! as §Y$JAP_zombie_companies$§! e a §Y$JAP_liquidation_wave$§! que veio com a liquidação."
 JAP_controlled_downsize_TT: "Inicia a §Yonda de liquidações§!: as empresas são encerradas em §Gdobro de velocidade§! em relação a um programa de fusões, ao custo de um §Respírito nacional severo§! até a conclusão da liquidação"
 JAP_forced_mergers_TT: "Inicia o §Yprograma de fusões§!: barato e brando agora, com §Rmetade da velocidade de liquidação§! e uma marca permanente na indústria japonesa depois"
 JAP_liquidation_wave: "A Onda de Liquidações"
 JAP_liquidation_wave_desc: "A liquidação está em andamento. Avisos de falência enchem as páginas de economia, canteiros de obras ficam parados enquanto seus incorporadores são liquidados, o desemprego dispara e o governo precisa se endividar para amortecer o golpe. A dor é severa e concentrada, mas temporária.\n-------------\nRemovido quando o §YProgresso da Reestruturação Corporativa§! terminar de liquidar as empresas zumbis."
 JAP_fusion_restructuring: "Orientação Administrativa"
 JAP_fusion_restructuring_desc: "O ministério traça as linhas e os bancos pagam o dote. Ninguém é demitido, ninguém admite o fracasso, e duas equipes de vendas que se odeiam há trinta anos são informadas de que agora são uma só empresa. O registro encolhe a cada trimestre. O custo está na estagnação, e não no desemprego.\n-------------\nRemovido quando o §YProgresso da Reestruturação Corporativa§! terminar de absorver as empresas zumbis."
 JAP_consolidated_conglomerates: "Japan Inc. Consolidada"
 JAP_consolidated_conglomerates_desc: "Os nomes insolventes sumiram do registro, absorvidos em vez de liquidados. O que os substituiu são grupos maiores com fábricas duplicadas, divisões de pesquisa duplicadas e gerentes que respondem a um conselho que os comprou contra a vontade deles. O Estado tem os campeões nacionais que pediu. Tem também uma base industrial que inova mais devagar do que aquela com a qual começou."
 JAP_zombie_investigation_category: "A Investigação das Empresas Zumbis"
 JAP_zombie_investigation_category_desc: "Auditores e promotores vasculham os livros-caixa dos devedores insolventes do Japão, e as empresas trabalham com igual afinco para detê-los.\n\n$JAP_case_files$: [?JAP_zombie_case_files|0] / 14\n$JAP_obstruction$: [?JAP_zombie_obstruction|0] / 100\n\n§YO que você pode fazer§!\nCada caso abaixo pode ser processado, resgatado discretamente ou deixado passar. Processar monta o dossiê mais forte e é o que mais lhe custa com os §Yconglomerados industriais§!, cuja opinião move a produção real. Um resgate monta um dossiê mais fraco às custas do contribuinte. Deixar um caso passar não constrói nada.\n\n§GO Relatório§!\nAvaliado quando a investigação se encerra.\n§G10 ou mais§! dossiês: um acerto de contas completo que acelera a liquidação.\n§G3 a 9§!: um relatório parcial.\n§RMenos de 3§!: uma maquiagem que apaga os dossiês reunidos e atrasa a liquidação.\n§Y$JAP_controlled_downsize$§! exige 10 ou mais dossiês. §Y$JAP_forced_mergers$§! exige 3 ou mais dossiês. Nenhum dos ramos fica fechado permanentemente, mesmo que a investigação seja abandonada ou maquiada.\n\n§RObstrução§!\nSobe a cada mês que você continua investigando, mais rápido quanto mais irritados estiverem os conglomerados. Em §R30§! o ministério vaza informações, em §R55§! a federação empresarial emite um ultimato e em §R80§! a investigação é suspensa por escândalo. As decisões abaixo a fazem recuar."
 JAP_zombie_investigation_mission: "Concluir a Investigação"
 JAP_zombie_investigation_mission_desc: "A investigação não pode durar para sempre. Monte um caso digno de publicação antes que a vontade política se esgote."
 JAP_zombie_investigation_mission_TT: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 10"
 JAP_keidanren_ultimatum_mission: "O Ultimato da Keidanren"
 JAP_keidanren_ultimatum_mission_desc: "A federação empresarial disse ao governo, na linguagem mais polida possível, que a investigação está prejudicando a confiança e deve ser encerrada. Deram-nos até o fim do semestre fiscal para pegar a deixa."
 JAP_keidanren_ultimatum_TT: "Reduza a $JAP_obstruction$ para menos de §Y45§!"
 JAP_case_ltcb_shinsei: "Dossiê: A Opção de Venda do Shinsei"
 JAP_case_ltcb_shinsei_desc: "O Banco de Crédito de Longo Prazo foi nacionalizado, saneado com dinheiro público e vendido a um grupo de investimento estrangeiro por uma quantia simbólica. O contrato dava ao comprador o direito de devolver à Corporação de Seguro de Depósitos, pelo valor contábil, qualquer empréstimo que perdesse um quinto do seu valor. Os novos donos estão exercendo esse direito, e cada iene da perda cai sobre o contribuinte. Alguém no ministério assinou essa cláusula."
 JAP_case_sogo_collapse: "Dossiê: O Colapso da Sogo"
 JAP_case_sogo_collapse_desc: "A rede de lojas de departamentos deve cerca de dois trilhões de ienes e não tem um lucro real há anos. O plano na mesa do ministério é perdoar a parte pública da dívida e deixá-la continuar operando. Os jornais também têm o plano, e a reação do público ao resgate de uma varejista enquanto empresas comuns têm o crédito negado foi a que qualquer um poderia prever."
 JAP_case_mycal_bankruptcy: "Dossiê: Mycal"
 JAP_case_mycal_bankruptcy_desc: "O grupo de supermercados de Osaka se expandiu durante a bolha com dinheiro que seu banco principal nunca esperou ver devolvido, e passou os anos seguintes sendo refinanciado em vez de reestruturado. Se quebrar, será a maior falência do varejo já registrada no país e arrastará consigo uma cadeia de fornecedores em Kansai."
 JAP_case_resona_injection: "Dossiê: Resona"
 JAP_case_resona_injection_desc: "Os auditores se recusaram a certificar quanto do capital do banco consiste em ativos fiscais diferidos, ou seja, lucros futuros que ele não tem perspectiva realista de obter. Sem essa ficção, o banco está subcapitalizado. Quase dois trilhões de ienes de dinheiro público o recomporiam e, na prática, o entregariam ao Estado. Recusar seria a primeira grande quebra bancária que o governo permitiria."
 JAP_case_ashikaga_bank: "Dossiê: O Banco Ashikaga"
 JAP_case_ashikaga_bank_desc: "Não é um banco nacional. É o banco de Tochigi, onde guarda as contas do governo da província, da maioria das empresas locais e de muitíssimas famílias que nunca usaram outro. Também está insolvente. Nacionalizá-lo protege os depositantes e destrói os acionistas, e todo banco regional do país lerá a decisão como uma declaração de intenções."
 JAP_case_daiei_ircj: "Dossiê: Daiei"
 JAP_case_daiei_ircj_desc: "A varejista que ensinou o Japão a praticar preços de desconto carrega dívidas na casa dos trilhões e é mantida de pé por bancos que não podem se dar ao luxo de admitir quanto os empréstimos realmente valem. A Corporação de Revitalização Industrial pode assumi-la, trocar a gestão e vender os pedaços. Os aliados do fundador no partido prefeririam que fosse refinanciada mais uma vez."
 JAP_case_kanebo_accounts: "Dossiê: As Contas da Kanebo"
 JAP_case_kanebo_accounts_desc: "O grupo de cosméticos e têxteis vem registrando lucros que não obteve há cinco anos, na ordem de duzentos bilhões de ienes. A fraude não está em disputa. O que está em disputa é a firma de contabilidade que assinou cada um desses balanços e se um país pode ter livros honestos enquanto seus auditores respondem comercialmente às empresas que auditam."
 JAP_press_the_prosecutors: "Soltar os Promotores"
 JAP_press_the_prosecutors_desc: "Deixe o Departamento de Investigações Especiais fazer prisões em vez de encaminhamentos. Nada silencia uma campanha de lobby mais depressa do que um diretor sendo conduzido para fora de seu escritório por homens com um mandado."
 JAP_whistleblower_immunity_decision: "Conceder Imunidade aos Informantes"
 JAP_whistleblower_immunity_decision_desc: "Ofereça aos gerentes intermediários que executaram as instruções proteção contra processo em troca de testemunho contra os homens que as deram. Os conglomerados chamarão isso de convite para trair colegas. E é."
 JAP_publish_inspection_manual_decision: "Publicar as Conclusões da Inspeção"
 JAP_publish_inspection_manual_decision_desc: "Divulgue as avaliações de supervisão na íntegra em vez de resumi-las para o ministério. Os mercados não vão gostar de lê-las, mas uma empresa não pode fazer lobby contra um número que o país inteiro já viu."
 JAP_cooperating_bank_amnesty_decision: "Anistia aos Bancos Colaboradores"
 JAP_cooperating_bank_amnesty_decision_desc: "Ofereça a qualquer banco que abra voluntariamente seus livros a garantia de que seus dirigentes não serão perseguidos. Isso compra paz, e custa à investigação o caso que ela vinha montando contra eles."
 JAP_zombie_probe_abandoned_TT: "A investigação é §Rcancelada§! e será publicada como uma maquiagem, apagando os dossiês reunidos até agora e atrasando a liquidação"
 JAP_zombie_report_strong_TT: "§GUm acerto de contas completo.§! A liquidação será §G25% mais rápida§!"
 JAP_zombie_report_partial_TT: "§YUm relatório parcial.§! A liquidação seguirá no ritmo normal"
 JAP_zombie_report_whitewash_TT: "Liquidação §R25% mais lenta§!"
 Japan_economy.06.c: "Cancelar tudo"
 Japan_economy.08.b: "Publicar o que temos"
 Japan_economy.08.c: "Publicar e torcer para que ninguém leia além do resumo"
 Japan_economy.09.b: "Encontrá-lo e fazer dele um exemplo"
 Japan_economy.23.b: "Renegociar discretamente e comprar a cláusula"
 Japan_economy.23.c: "A venda está feita. Deixe como está."
 Japan_economy.24.b: "Reestruturá-la longe das manchetes"
 Japan_economy.24.c: "Perdoar a dívida e seguir em frente"
 Japan_economy.25.b: "Organizar uma venda ordenada das lojas lucrativas"
 Japan_economy.25.c: "Pressionar o banco por mais um ano"
 Japan_economy.26.b: "Injetar os recursos e manter a gestão no lugar"
 Japan_economy.26.c: "Deixar que os auditores sejam persuadidos"
 Japan_economy.27.b: "Recapitalizá-lo e mantê-lo em mãos privadas"
 Japan_economy.27.c: "Deixar a província organizar uma fusão de resgate"
 Japan_economy.28.b: "Apoiar uma reestruturação negociada"
 Japan_economy.28.c: "Conceder o refinanciamento"
 Japan_economy.29.b: "Retirá-la da bolsa e deixar os auditores fazerem acordo"
 Japan_economy.29.c: "Tratar como uma falha isolada"
 Japan_economy.33.t: "A Investigação Recomeça"
 Japan_economy.33.d: "A revisão encontrou o que as revisões costumam encontrar. Um novo responsável foi nomeado, os arquivos foram devolvidos e a investigação recomeça com o vento bem mais contrário do que antes. As empresas tiveram seis meses para se preparar, e os usaram."
 Japan_economy.33.a: "Recomeçar."
 Japan_economy.34.t: "O Registro Está Limpo"
 Japan_economy.34.d: "O último dos devedores insolventes foi liquidado. Levou anos, e o custo foi pago em falências, em desemprego e num governo que gastou a maior parte de seu capital político insistindo que a dor era necessária. O que restou é uma economia em que o crédito vai para empresas que podem pagá-lo e em que um balanço significa o que diz."
 Japan_economy.34.a: "Valeu o preço."
 Japan_economy.35.t: "Nada Faliu"
 Japan_economy.35.d: "Os nomes insolventes sumiram do registro. Nenhum deles faliu. Foram absorvidos por grupos maiores por arranjo do ministério, e esses grupos agora carregam as fábricas duplicadas, os laboratórios duplicados e os funcionários que souberam numa sexta-feira que na segunda trabalhariam para um concorrente. Nenhum emprego foi perdido e nada foi admitido. A indústria do Japão está consolidada, estável e mais lenta do que era."
 Japan_economy.35.a: "O arranjo funcionou."
 JAP_electronics_resilience_complete_TT: "A §YResiliência Eletrônica§! está em §G5§! ou mais (atualmente [?JAP_electronics_resilience|Y0])"
 JAP_electronics_war_won_tt: "§Y$JAP_model_competition$§! termina de vez e não poderá mais voltar, façam o que fizerem Seul, Taipé e Xangai a seguir."
 JAP_seismic_retrofitting: "Programa Nacional de Reforço Sísmico"
 JAP_seismic_retrofitting_desc: "A Lei de Padrões de Construção de 1981 estabelece um piso, não um teto, e dois terços do parque habitacional é anterior a ela. Um programa nacional de reforço percorre o país região por região, financiando o isolamento de base para hospitais e prefeituras, paredes de cisalhamento e encamisamento de pilares para escolas, e contraventamento de aço para as vias expressas elevadas que desabaram de forma tão espetacular em Kobe. A construção se torna mais lenta e mais cara onde os inspetores passaram, mas uma região reforçada atravessa um grande tremor com a infraestrutura intacta."
 JAP_news.04.t: "O Japão Age para Deixar o Artigo 9 para Trás"
 JAP_news.04.d: "A Dieta recebeu o relatório final do Comitê de Transição da Defesa, e com ele o Japão deu o passo decisivo para longe do Artigo 9 de sua constituição do pós-guerra. Por décadas, a cláusula que renuncia à guerra e à manutenção de potencial bélico foi administrada por sucessivas reinterpretações, e não por emenda: as Forças de Autodefesa foram declaradas constitucionais como uma capacidade mínima necessária, os desdobramentos no exterior foram justificados como apoio à reconstrução e à logística, e a proibição da autodefesa coletiva foi estreitada até que navios e aeronaves aliados pudessem ser defendidos sob um conjunto limitado de condições. A conclusão do comitê é que esse corpo acumulado de interpretações não pode mais ser esticado para cobrir as necessidades de segurança do Japão, e que a restrição deve ser posta de lado em vez de reformulada mais uma vez.\n\nAs consequências práticas são imediatas. As restrições ao tamanho e à composição das formações japonesas caem, as Forças de Autodefesa ficam livres para planejar operações além da defesa das ilhas do país, e Tóquio recupera os instrumentos soberanos de guerra e de liderança de alianças que toda outra grande potência considera naturais. Autoridades japonesas enfatizaram a continuidade, descrevendo a mudança como o reconhecimento formal dos direitos de um país normal, e não uma ruptura com setenta anos de contenção. Em Pequim, Seul e Pyongyang a leitura é muito diferente, e Washington agora se vê aliada a um parceiro capaz de muito mais do que acesso a bases e apoio de retaguarda. Qualquer que seja o enquadramento que prevaleça, a arquitetura de segurança do Leste Asiático foi reescrita numa única tarde na Dieta."
 JAP_news.04.a: "A era pacifista em Tóquio acabou."
 JAP_seismic_retrofit: "Reforço Sísmico"
 JAP_seismic_retrofit_desc: "Toda estrutura desta região foi inspecionada, reforçada ou reconstruída para resistir a um grande terremoto. Os hospitais assentam sobre isoladores de base, as escolas mais antigas foram encamisadas ou demolidas, e os pilares das vias expressas ganharam colares de aço. Códigos mais rígidos, inspeções obrigatórias e fundações mais pesadas retardam cada novo projeto, mas o próximo tremor custará à região algumas estradas e nada mais."
 JAP_seismic_retrofit_category: "Reforço Sísmico"
 JAP_seismic_retrofit_category_desc: "Tornar uma região à prova de terremotos é um esforço de engenharia civil de uma década, província por província e prédio por prédio. Uma região reforçada ainda treme, mas perde apenas parte da infraestrutura num tremor, enquanto suas fábricas e bases resistem, ao custo permanente de uma construção mais lenta sob os códigos mais rígidos. Reforçar todas as regiões propensas a terremotos é uma das duas condições para suspender §Y$JAP_ring_of_fire$§!."
 JAP_seismic_retrofit_decision: "Reforçar [FROM.GetName]"
 JAP_seismic_retrofit_decision_desc: "Inspecionar todas as estruturas da região e adequá-las aos padrões sísmicos modernos. Um ano de trabalho e uma parcela substancial da produção nacional, em troca de danos de terremoto muito menores e de uma penalidade duradoura à velocidade de construção local."
 JAP_zombie_companies_1: "Empresas Zumbis"
 JAP_zombie_companies_1_desc: "Anos de tolerância mantiveram empresas deficitárias e superendividadas vivas com crédito barato, prendendo capital, mão de obra e gestão de que indústrias mais saudáveis precisam. Ninguém registrou uma perda, ninguém fechou uma fábrica e ninguém sabe dizer quanto do sistema bancário é ficção.\n-------------\nCom §YProgresso da Reestruturação Corporativa§! em §G30§!, você pode tomar §Y$JAP_restructure_next_tranche$§! para atenuar este espírito nacional em um passo. Veja §Y$JAP_corporate_reform_category$§! para os números atuais."
 JAP_zombie_companies_2: "Empresas Zumbis: Desmonte"
 JAP_zombie_companies_2_desc: "A primeira parcela foi resolvida. Os empréstimos foram baixados em vez de rolados, as piores empresas insolventes passaram pelos tribunais e o capital que ficou parado por uma década voltou a circular. O que resta é maior, mais bem relacionado e muito mais difícil de tocar.\n-------------\nCom §YProgresso da Reestruturação Corporativa§! em §G60§!, você pode tomar §Y$JAP_restructure_next_tranche$§! para atenuar este espírito nacional em mais um passo. Veja §Y$JAP_corporate_reform_category$§! para os números atuais."
 JAP_zombie_companies_3: "Empresas Zumbis: Os Últimos Livros-Caixa"
 JAP_zombie_companies_3_desc: "Só os últimos livros-caixa continuam abertos. As empresas restantes são as de relações bancárias mais profundas e maior cobertura política, e cada uma delas espera sobreviver ao governo que veio atrás dela. O peso sobre a economia em geral agora é modesto, mas ainda não desapareceu.\n-------------\nCom §YProgresso da Reestruturação Corporativa§! em §G85§!, o foco de resolução ao fim do caminho escolhido §Gremove§! este espírito nacional de vez. Veja §Y$JAP_corporate_reform_category$§! para os números atuais."
 JAP_saburoku_audit_campaign: "Auditar os Acordos Saburoku"
 JAP_saburoku_audit_campaign_desc: "O Artigo 36 da Lei de Normas Trabalhistas permite que uma empresa exceda a jornada legal de oito horas arquivando um acordo com o representante dos trabalhadores, e por décadas o teto escrito nesses acordos foi o que o empregador quis escrever. Os inspetores agora puxam os registros e os confrontam com os controles de frequência, os registros de crachá e os dados de acesso aos edifícios, e a Lei de Reforma do Estilo de Trabalho lhes dá um número de referência: quarenta e cinco horas por mês, trezentas e sessenta por ano."
 JAP_paid_leave_enforcement_campaign: "Fazer Cumprir os Cinco Dias"
 JAP_paid_leave_enforcement_campaign_desc: "Os trabalhadores japoneses recebiam férias anuais e não as tiravam, porque tirá-las os marcava. Desde 2019 a obrigação corre no sentido contrário: um empregador cujos funcionários têm dez dias ou mais deve garantir que cinco deles sejam de fato usados e deve indicar as datas ele mesmo se o trabalhador não o fizer. O ministério confere os registros de licença e multa as empresas cujos livros mostram direitos intocados."
 JAP_equal_pay_audit_campaign: "Auditar as Diferenças Salariais"
 JAP_equal_pay_audit_campaign_desc: "Quatro em cada dez trabalhadores japoneses são não regulares, fazendo o mesmo trabalho ao lado de um colega permanente por cerca de sessenta por cento do salário e nenhum bônus. A Lei de Emprego de Meio Período e de Prazo Determinado obriga o empregador a explicar por escrito qualquer diferença de tratamento quando solicitado, e as explicações são reunidas e comparadas em todo um setor, em vez de morrerem dentro de uma única empresa."
 JAP_inspector_sweep_campaign: "Varrer os Piores Infratores"
 JAP_inspector_sweep_campaign_desc: "Os Escritórios de Inspeção de Normas Trabalhistas escolhem um setor, chegam sem aviso e examinam os cartões de ponto de todas as empresas nele. O ministério publica os nomes das empresas flagradas em violação grave, o que custa a um recrutador muito mais do que a multa, porque um formando que leu a lista não se candidata."
 JAP_keidanren_review_campaign: "Revisar o Cumprimento da Carta"
 JAP_keidanren_review_campaign_desc: "A Carta de Conduta Corporativa da Keidanren compromete seus membros com práticas de trabalho que a maioria deles não audita e nenhum publica. A federação é convencida a conduzir um ciclo de conformidade com resultados reais, membro por membro, e a relatar o agregado ao ministério. Nada é obrigatório e ninguém é nomeado, e é exatamente por isso que os grupos empresariais concordam."
 JAP_shunto_wage_round_campaign: "Apoiar a Ofensiva Salarial da Primavera"
 JAP_shunto_wage_round_campaign_desc: "Toda primavera as afiliadas da Rengo apresentam um número aos empregadores e os empregadores devolvem um menor, e por duas décadas o componente de aumento-base desse acordo foi zero. O governo pressiona os grupos empresariais a conceder um aumento real, porque um trabalhador que ganha o suficiente para viver deixa de aceitar as horas extras que o estão matando, e acompanha a pressão com alívio fiscal para as empresas que se moverem primeiro."
 JAP_health_stock_listing_campaign: "Ampliar a Lista de Gestão de Saúde"
 JAP_health_stock_listing_campaign_desc: "O ministério e a Bolsa de Valores de Tóquio nomeiam conjuntamente algumas empresas listadas a cada ano como Ações de Saúde e Produtividade, na teoria de que uma empresa que não esgota seus funcionários é um melhor investimento de longo prazo. Ampliar a seleção e publicar a pontuação transforma a saúde no trabalho em algo que um gestor de fundos pode precificar, o que alcança conselhos que um inspetor do trabalho jamais alcançará."
 JAP_shift_rotation_campaign: "Subsidiar o Turno da Manhã"
 JAP_shift_rotation_campaign_desc: "Antecipe a jornada, pague o adicional pelas horas da madrugada em vez das da noite e corte a energia do chão de fábrica à noite para que ficar não seja uma opção. A Itochu fez isso e viu sua produtividade subir, e a natalidade junto; o Estado agora paga parte do custo da transição para qualquer empresa disposta a seguir o exemplo."
 JAP_overcome_the_slump: "Impulsionar a Recuperação"
 JAP_overcome_the_slump_desc: "As medidas já em andamento moveram o bastante do balanço para valer a pena consolidá-las. O apoio rotulado como temporário é incorporado ao orçamento-base, os ministérios deixam de tratar a estagnação como premissa de trabalho, e as empresas são informadas com clareza de que se espera que a demanda se mantenha. Cada passo alivia §Y$JAP_entrenched_demand_shortfall_idea_1$§! em um nível; se tomado ao final, encerra de vez a longa estagnação."
 JAP_demand_recovery_progress_tier_1_TT: "§YProgresso da Recuperação da Demanda§! é de pelo menos §G30§!"
 JAP_demand_recovery_progress_tier_2_TT: "§YProgresso da Recuperação da Demanda§! é de pelo menos §G60§!"
 JAP_demand_recovery_progress_complete_TT: "§YProgresso da Recuperação da Demanda§! é de pelo menos §G85§!"
 JAP_demand_shortfall_resolved: "A §Yestagnação da demanda§! do Japão foi superada"
 JAP_restructure_next_tranche: "Resolver a Próxima Tranche"
 JAP_restructure_next_tranche_desc: "Já se trabalhou o suficiente do balanço para encerrar definitivamente um lote dele. O regulador publica os casos resolvidos, os bancos contabilizam as perdas que vinham adiando, e as empresas dessa tranche ou emergem solventes ou deixam de existir. Cada tranche alivia §Y$JAP_zombie_companies$§! em um passo; a liquidação final vem com o foco ao fim do caminho escolhido."
 JAP_enforce_next_reforms: "Fazer Cumprir as Próximas Reformas"
 JAP_enforce_next_reforms_desc: "As medidas já em vigor nos livros são postas em prática em vez de ficarem como intenções. Tetos que eram apenas consultivos tornam-se exigíveis, as isenções redigidas para os maiores empregadores são reduzidas, e a fiscalização recebe pessoal para acompanhar o que encontra. Cada rodada alivia §Y$JAP_karoshi_crisis$§! em um passo; a crise é suspensa em definitivo pelo foco ao fim do caminho escolhido."
 JAP_galapagos_drift_review_mission: "A Lacuna de Padrões"
 JAP_galapagos_drift_review_mission_desc: "O Ministério da Economia, Comércio e Indústria mantém uma avaliação permanente de quanto a especificação japonesa se afastou da especificação usada por seus clientes e informa o valor a cada trinta dias. Cada relatório é pior que o anterior, porque a divergência se acumula enquanto nada é feito e os órgãos de certificação continuam escrevendo primeiro a cláusula doméstica. Quanto menor a §YAbertura§!, mais rápido a lacuna se alarga; em §G100§!, ela deixa de se alargar por completo.\n-------------\nA avaliação se encerra de vez quando o Japão atinge §G85§! de §YAbertura§! no caminho §Y$JAP_world_integration$§!. Nada mais a encerra."
 JAP_galapagos_cure_condition_TT: "A §YAbertura§! está em §G85§! ou mais (atualmente [?JAP_galapagos_openness|Y0]), dissolvendo a §Y$JAP_galapagos_syndrome$§!"
 JAP_cool_japan_sphere_count_mission: "Contagem Trimestral da Esfera"
 JAP_cool_japan_sphere_count_mission_desc: "Uma vez por trimestre, o Escritório de Promoção das Indústrias Criativas contabiliza todos os países onde a influência japonesa é de vinte por cento ou mais e registra o total como um número de exportação. As delegações comerciais planejam o trimestre seguinte em torno da lista, e as empresas que as seguem ao exterior planejam em torno das delegações. Uma esfera que para de crescer para de render, e a contagem é o único lugar onde isso aparece antes da receita."
 JAP_cool_japan_sphere_count_step_tt: "§YEsfera Cultural§!: [?JAP_galapagos_sphere_count|Y0] países com §G20%§! ou mais de influência japonesa na última contagem. Cada um vale §G+1%§! de §Yinfluência externa§! e §G+0,2%§! de §Yretorno sobre investimento§!, aumentados em metade com §Y$JAP_electronics_superpower$§! e em mais um quarto com §Y$JAP_home_electronics$§!."
 JAP_zombie_companies_resolved: "As §Yempresas zumbis§! do Japão foram totalmente liquidadas"
 JAP_corporate_restructuring_complete_TT: "O §YProgresso da Reestruturação Corporativa§! é de pelo menos §G85§!"
 JAP_restructure_tranche_1_TT: "O §YProgresso da Reestruturação Corporativa§! é de pelo menos §G30§!"
 JAP_restructure_tranche_2_TT: "O §YProgresso da Reestruturação Corporativa§! é de pelo menos §G60§!"
 JAP_karoshi_wellbeing_tier_1_TT: "$JAP_worker_wellbeing$ é de pelo menos §G30§!"
 JAP_karoshi_wellbeing_tier_2_TT: "$JAP_worker_wellbeing$ é de pelo menos §G60§!"
 JAP_karoshi_wellbeing_complete_TT: "$JAP_worker_wellbeing$ é de pelo menos §G85§!"
 JAP_zombie_case_files_down_3_tt: "$JAP_case_files$: §R-3§!"
 JAP_zombie_case_files_downsize_tt: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 10"
 JAP_zombie_case_files_fusion_tt: "$JAP_case_files$: [?JAP_zombie_case_files|0] / 3"
 JAP_zombie_case_choice_TT: "Resultados possíveis:\n\nProcessar:\n §G+2§! $JAP_case_files$\n§R+8§! $JAP_obstruction$\n\nResgatar Discretamente:\n§G+1§! $JAP_case_files$\n§R+2§! $JAP_obstruction$\n\nDeixar Passar:\n §G-3§! $JAP_obstruction$"
 JAP_zombie_whitewash_penalty_TT: "Uma maquiagem §Rapaga os dossiês§! reunidos até agora e atrasa a liquidação em §R25%§!. Nenhuma das resoluções se perde: os casos restantes ainda podem ser trabalhados"
 JAP_seismic_retrofit_tt: "£trigger_yes §YEdifícios Resistentes a Terremotos§!"
 JAP_electronics_resilience_below_5_tt: "A §YResiliência Eletrônica§! está abaixo de §G5§! (atualmente [?JAP_electronics_resilience|Y0])"
 intellectual_platform_rejected: "Plataforma Intelectual China-Coreia-Japão Rejeitada"
 JAP_seek_permanent_unsc_seat: "Buscar Assento Permanente no CSNU"
 JAP_seek_permanent_unsc_seat_desc: "A influência econômica do Japão e suas contribuições às Nações Unidas justificam um papel permanente na segurança internacional. Conquistá-lo exigirá lobby contínuo e a aprovação de ambas as câmaras do sistema das Nações Unidas."
 JAP_zombie_probe_abandoned: "Investigação das Empresas Zumbis Abandonada"
 JAP_electronics.300.t: "A Sony Ericsson É Criada"
 JAP_electronics.300.d_agreed: "A Ericsson concordou em combinar seu negócio de celulares com o da Sony. Nenhuma das empresas vende telefones suficientes sozinha para fazer diferença contra a Nokia e a Motorola, e juntas teriam engenharia de rádio sueca e design de consumo japonês num só empreendimento. A Sony pode se comprometer com ele, ou manter a telefonia dentro do grupo e seguir sozinha."
 JAP_electronics.300.d_alone: "O negócio sueco de celulares com o qual a Sony esperava se associar tomou outro rumo. A Sony ainda pode montar um empreendimento de telefonia nas condições disponíveis, ou manter os telefones dentro do grupo e aceitar uma fatia menor de um mercado que não lidera."
 JAP_electronics.300.a: "Comprometer-se com a joint venture de celulares"
 JAP_electronics.300.b: "Manter a telefonia dentro do grupo"
 JAP_electronics.301.t: "O Dilema da Música Digital"
 JAP_electronics.301.d: "A Sony é dona tanto do hardware que toca música quanto do catálogo que o abastece, e as duas metades querem coisas opostas. Proteger o catálogo significa aparelhos que recusam os formatos que os ouvintes já usam. Abrir os aparelhos significa a divisão de gravadoras vendo seus próprios dispositivos carregarem arquivos de terceiros."
 JAP_electronics.301.a: "Proteger o catálogo com formatos próprios"
 JAP_electronics.301.b: "Abrir os aparelhos ao que as pessoas já possuem"
 JAP_electronics.302.t: "A Aposta do PlayStation 3"
 JAP_electronics.302.d: "O PlayStation 3 pode ser construído em torno do Cell, um processador que a Sony projetou do zero com a IBM e a Toshiba, difícil de programar e diferente de tudo na indústria. O console então venderia abaixo do custo por anos, na esperança de que o software o alcance. Ou pode ser construído como a Microsoft construiu o Xbox 360, e chegar antes por menos."
 JAP_electronics.302.a: "Construir a máquina em torno da nova arquitetura"
 JAP_electronics.302.b: "Construir um console convencional e lançá-lo mais cedo"
 JAP_electronics.303.t: "Uma Só Sony"
 JAP_electronics.303.d: "As divisões da Sony se governam sozinhas há décadas, e isso se vê em produtos que não funcionam juntos e na mesma engenharia feita quatro vezes. Reuni-las sob uma única estratégia significa contrariar pessoas que já acertaram antes. Deixá-las em paz preserva o que a independência construiu."
 JAP_electronics.303.a: "Reunir as divisões sob uma única estratégia"
 JAP_electronics.303.b: "Deixar às divisões a sua independência"
 JAP_electronics.304.t: "A Guinada para os Sensores de Imagem"
 JAP_electronics.304.d: "Os sensores de imagem da Sony estão dentro de celulares fabricados por empresas com as quais a Sony compete, e a demanda cresce mais rápido do que as fábricas conseguem atender. Fazer dos sensores o centro da empresa significa capital que havia sido prometido às divisões de consumo. Não fazê-lo significa entregar a liderança a quem construir a capacidade primeiro."
 JAP_electronics.304.a: "Fazer dos sensores de imagem o centro da empresa"
 JAP_electronics.304.b: "Manter o capital nos produtos de consumo"
 JAP_electronics.305.t: "No Que a Sony Se Tornou"
 JAP_electronics.305.d: "Um quarto de século de empreendimentos, formatos, arquiteturas e reestruturações definiu o que a Sony é e para que serve a eletrônica de consumo japonesa. A empresa que um dia vendeu os produtos agora fornece as peças que vão dentro dos de todos os outros."
 JAP_electronics.305.a: "Uma só empresa em hardware, conteúdo e serviços"
 JAP_electronics.305.b: "Uma federação de negócios de hardware"
 JAP_electronics.305.c: "Uma arquitetura de computação soberana"
 JAP_electronics.305.e: "Uma comunidade digital aberta"
 JAP_sony_one_sony_ecosystem: "Uma Só Sony"
 JAP_sony_one_sony_ecosystem_desc: "As divisões respondem a uma única estratégia, e os sensores, o catálogo, o console e os serviços foram construídos para se reforçarem mutuamente, em vez de disputar o mesmo orçamento. A coordenação custa um pouco de velocidade e a devolve em tudo sendo entregue como uma coisa só."
 JAP_sony_hardware_federation: "Federação de Hardware"
 JAP_sony_hardware_federation_desc: "As divisões mantiveram sua independência e cada uma se tornou formidável em seu próprio ofício. Nada do que a Sony faz é projetado pensando no resto da Sony, e cada peça é muito boa."
 JAP_sony_cell_sovereign_compute: "Arquitetura de Computação Soberana"
 JAP_sony_cell_sovereign_compute_desc: "O Japão construiu uma arquitetura de processador própria e pagou por ela com uma geração de console. O que a indústria aprendeu ao programá-la sobreviveu à máquina que a carregava."
 JAP_sony_open_digital_commonwealth: "Comunidade Digital Aberta"
 JAP_sony_open_digital_commonwealth_desc: "Os formatos se abriram, o catálogo circulou e o hardware parou de brigar com o que as pessoas já possuíam. A Sony ganha menos por aparelho e seus produtos estão em muito mais mãos."
 JAP_electronics.310.t: "Duas Telas, Duas Máquinas"
 JAP_electronics.310.d: "O Game Boy Advance e o GameCube da Nintendo têm equipes separadas, arquiteturas separadas e bibliotecas separadas, e todo jogo precisa ser feito para um ou para o outro. Manter os dois significa financiar duas plataformas com uma só empresa. Fundi-los encerraria o negócio de portáteis que paga por todo o resto."
 JAP_electronics.310.a: "Financiar tanto o portátil quanto o console"
 JAP_electronics.310.b: "Concentrar tudo em uma plataforma"
 JAP_electronics.311.t: "O Wii e o Público Mais Amplo"
 JAP_electronics.311.d: "O próximo console da Nintendo pode perseguir as pessoas que não compram consoles, com hardware mais barato, um esquema de controle que ninguém lançou e nenhum do poder gráfico que a imprensa mede. Ou pode enfrentar a Sony e a Microsoft nos termos com que a indústria já concorda e ser julgado por eles."
 JAP_electronics.311.a: "Construir para as pessoas que não compram consoles"
 JAP_electronics.311.b: "Competir em desempenho"
 JAP_electronics.312.t: "O Wii U Não Consegue Ser Explicado"
 JAP_electronics.312.d: "O novo console vendeu tão mal que levanta a pergunta que ninguém quer ouvir: se a Nintendo deveria fabricar hardware. Seus jogos venderiam em qualquer máquina, e os prejuízos cessariam. Permanecer no hardware significa financiar mais uma geração com base no fracasso da anterior."
 JAP_electronics.312.a: "Permanecer no hardware e financiar mais uma geração"
 JAP_electronics.312.b: "Deixar o hardware e levar os jogos a todo lugar"
 JAP_electronics.313.t: "A Nintendo e o Celular"
 JAP_electronics.313.d: "Os personagens da Nintendo valem mais do que seu hardware, e todo celular do mundo poderia carregá-los. Licenciá-los rende dinheiro de um público que os consoles nunca alcançam. Recusar os mantém exclusivos das máquinas que a Nintendo controla, que é o motivo pelo qual alguém compra essas máquinas."
 JAP_electronics.313.a: "Licenciar os personagens para o mobile"
 JAP_electronics.313.b: "Mantê-los exclusivos do nosso hardware"
 JAP_electronics.314.t: "O Switch"
 JAP_electronics.314.d: "Uma única máquina que seja portátil e console ao mesmo tempo encerraria a divisão que separa a engenharia da empresa há duas décadas, e significa uma biblioteca, uma equipe e um único fracasso se não funcionar. Manter as linhas separadas é o que a Nintendo sabe fazer."
 JAP_electronics.314.a: "Construir uma máquina que seja as duas coisas"
 JAP_electronics.314.b: "Manter o portátil e o console separados"
 JAP_electronics.315.t: "No Que a Nintendo Se Tornou"
 JAP_electronics.315.d: "Um quarto de século de hardware que mais ninguém teria construído definiu o que a Nintendo é e quanto do entretenimento japonês passa por ela. Os personagens sobreviveram a todas as máquinas que os carregaram."
 JAP_electronics.315.a: "Uma plataforma híbrida disciplinada"
 JAP_electronics.315.b: "Um ecossistema de entretenimento integrado"
 JAP_electronics.315.c: "Uma licenciadora global de personagens"
 JAP_electronics.315.e: "Uma comunidade aberta de desenvolvedores"
 JAP_nintendo_disciplined_hybrid_platform: "Plataforma Híbrida Disciplinada"
 JAP_nintendo_disciplined_hybrid_platform_desc: "Uma máquina, uma biblioteca e uma organização de engenharia por trás de ambas. A Nintendo parou de competir nas especificações que todos os outros anunciam e passou a lançar hardware que custa menos para construir do que o preço pelo qual é vendido."
 JAP_nintendo_integrated_entertainment_ecosystem: "Ecossistema de Entretenimento Integrado"
 JAP_nintendo_integrated_entertainment_ecosystem_desc: "Os personagens circulam por parques, filmes e produtos licenciados tanto quanto pelas máquinas, e cada parte vende as outras. As exportações de entretenimento japonês se apoiam em propriedades que uma única empresa ainda possui por inteiro."
 JAP_nintendo_global_ip_licensor: "Licenciadora Global"
 JAP_nintendo_global_ip_licensor_desc: "O hardware se tornou um canal de distribuição entre muitos. A Nintendo lucra com personagens que aparecem em máquinas que ela não constrói, em mercados que seus consoles nunca alcançaram."
 JAP_nintendo_open_developer_commonwealth: "Comunidade Aberta de Desenvolvedores"
 JAP_nintendo_open_developer_commonwealth_desc: "A plataforma se abriu aos desenvolvedores em termos que não exigem permissão prévia. A Nintendo fica com uma fatia menor de um catálogo muito maior, e as máquinas carregam trabalhos que ela jamais teria encomendado."
