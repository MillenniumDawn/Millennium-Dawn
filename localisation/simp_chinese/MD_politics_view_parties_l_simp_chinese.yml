 MNT.communist_state_desc: ""
 MON.communist_state: "£MON_emerging_communism 人民党"
 MON.communist_state_icon: "£MON_emerging_communism"
 MON.communist_state_desc: "蒙古人民党是蒙古的一个社会民主主义政党。它于1920年由蒙古革命者作为共产党创立，是蒙古最古老的政党。1990年蒙古革命后，蒙古的其他政党被合法化，国家过渡为多党民主制。该党随后放弃马克思列宁主义，转而信奉民主社会主义。该党在2016年选举后重新掌权，并在2020年选举中保持多数席位。"
 MOR.communist_state: "£MOR_SDV (PADS) - 社会民主先锋党"
 MOR.communist_state_icon: "£MOR_SDV"
 MOR.communist_state_desc: "（阿拉伯社会主义）- 社会主义民主先锋党\n\n社会主义民主先锋党由阿里·布图阿拉于1991年创立。该党确定的意识形态是阿拉伯社会主义、世俗主义和工会主义，并混合了阿拉伯民族主义和泛阿拉伯主义。该党也经常严厉批评美国，并在各种形式上都是反帝国主义的。此外，它也是巴勒斯坦的坚定支持者，并在对以色列的政策上持反犹太复国主义立场。"
 MOV.communist_state: "£SOV_emerging_communism 莫尔多维亚共产党"
 MOV.communist_state_icon: "£SOV_emerging_communism"
 MOZ.communist_state: "£generic_Communist_State_small (PACOMO) - 莫桑比克共产党"
 MOZ.communist_state_icon: "£generic_Communist_State_small"
 MOZ.communist_state_desc: "（马克思列宁主义）\n莫桑比克共产党\n\n莫桑比克共产党成立于1995年，继承了莫桑比克解放阵线曾作为马克思列宁主义政党的衣钵，并从1977年莫桑比克解放阵线第三次代表大会中汲取灵感。迄今为止，该党在莫桑比克尚未成为主要政治力量。"
 NAM.communist_state: "£NAM_emerging_left_wing_radical 西南非洲人民组织（强硬派）"
 NAM.communist_state_icon: "£NAM_emerging_left_wing_radical"
 NAM.communist_state_desc: ""
 NEE.communist_state: "£SOV_emerging_communism 涅涅茨共产党"
 NEE.communist_state_icon: "£SOV_emerging_communism"
 NEN.communist_state: "£generic_Communist_State_small 革命改革党"
 NEN.communist_state_icon: "£generic_Communist_State_small"
 NEN.communist_state_desc: "£generic_Communist_State_small 革命改革党 - (PRR) 革命改革党是一个激进的社会主义政党，致力于煽动和鼓动选民支持改革。虽然该党并非公然鼓吹暴力，但一些较为激进的成员似乎养成了一种不良习惯，演变成该党某种准军事分支。"
 NEP.communist_state: "£Communist_Party_of_Nepal 尼泊尔共产党（毛派）"
 NEP.communist_state_desc: ""
 NIC.communist_state: "£generic_Communist_State_small (MUR) - 革命统一运动"
 NIC.communist_state_desc: ""
 NIG.communist_state: "£NIG_emerging_communism (DSM) - 民主社会主义运动"
 NIG.communist_state_icon: "£NIG_emerging_communism"
 NIG.communist_state_desc: ""
 NKO.communist_state: "£NKO_communism (WPK) - 朝鲜劳动党"
 NKO.communist_state_icon: "£NKO_communism"
 NKO.communist_state_desc: "(主体思想) - 朝鲜劳动党\n\n朝鲜劳动党是朝鲜民主主义人民共和国的唯一执政党，在其本国常被称为“劳动党”。\n尽管被一些学者视为极端右翼政党，劳动党仍自认为国际左翼和社会主义运动的一部分，坚持朝鲜本土的主体思想。"
 NPM.communist_state: "£Communist_Party_of_Nepal 尼泊尔共产党（联合马列）"
 NPM.communist_state_desc: ""
 NRY.communist_state: "£NRY_Communist_State_small 挪威共产党"
 NRY.communist_state_icon: "£NRY_Communist_State_small"
 NRY.communist_state_desc: "共产主义 - 挪威共产党是一个斯大林主义共产党。他们在二战后因领导抵抗纳粹占领而大受欢迎。然而，他们很快就失去了声望，此后基本上无足轻重。"
 NZL.communist_state: "£generic_Communist_State_small (CL) - 共产主义联盟"
 NZL.communist_state_desc: ""
 OPR.communist_state: "£OPR_communist_statism 敖德萨共产党"
 OPR.communist_state_icon: "£OPR_communist_statism"
 OPR.communist_state_sov: "£SOV_emerging_communism 俄罗斯联邦共产党"
 OPR.communist_state_sov_icon: "£SOV_emerging_communism"
 PAK.communist_state: "£generic_Communist_State_small 巴基斯坦共产党"
 PAK.communist_state_desc: ""
 PAL.communist_state: "£PAL_emerging_communism (PFLP) - 解放巴勒斯坦人民阵线"
 PAL.communist_state_icon: "£PAL_emerging_communism"
 PAL.communist_state_desc: ""
 PAR.communist_state: "£generic_Communist_State_small 巴拉圭共产党"
 PAR.communist_state_desc: ""
 PER.communist_state: "£PER_IFPG (IFPG) - 伊朗人民敢死游击队-德赫加尼派"
 PER.communist_state_icon: "£PER_IFPG"
 PER.communist_state_desc: "（马克思列宁主义） - 伊朗人民敢死游击队-德赫加尼派\n\n伊朗人民敢死游击队成立于1979年，是阿什拉夫·德赫加尼指责伊朗人民敢死游击队组织背离游击战战略后，从该组织分裂而出。该团体自称是唯一真正的共产主义组织，并强烈反对伊斯兰共和国。许多原成员加入了该团体，并在1979年库尔德叛乱中与政府军作战，支持伊朗库尔德斯坦民主党。目前，该团体的幸存成员主要居住在欧洲，尤其是在英国。"
 PER.communist_state_Tudeh: "£PER_communism (TPI) - 伊朗人民党"
 PER.communist_state_Tudeh_desc: "（马克思列宁主义） - 伊朗人民党\n\n伊朗人民党成立于1941年，领导人为苏莱曼·米尔扎·埃斯坎达里，早年具有相当大的影响力，并在穆罕默德·摩萨台将英伊石油公司国有化的运动中发挥了关键作用。1946年伊朗石油危机后，该组织转为亲苏立场，此后一直遭到残酷镇压。"
 PHI.communist_state: "£generic_Communist_State_small (CPP) 菲律宾共产党"
 PHI.communist_state_desc: "马克思列宁主义-毛泽东思想 - 菲律宾共产党\n\n菲律宾共产党自1968年重建以来，一直对菲律宾政府进行武装叛乱。在马克思列宁主义毛泽东思想的指导下，该党试图通过由其武装力量新人民军领导的持久人民战争来推翻现有政治秩序。\n"
 PMR.communist_state: "£PMR_emerging_communism (TCP) - 德涅斯特河沿岸共产党"
 PMR.communist_state_icon: "£PMR_emerging_communism"
 PMR.communist_state_desc: "(马克思列宁主义) - 德涅斯特河沿岸共产党宣布将在德涅斯特河沿岸建设一个平等、自由和正义理念占主导地位的社会。该党争取权力的目标是为所有人建立一个社会公正的国家。该党主张回归计划经济，援引共产党领导下的中国经济建设成就；主张恢复国家对生产和消费的管控，不承认私有化结果。该党还主张修改德涅斯特河沿岸摩尔达维亚共和国的选举法，按比例代表制而非多数制举行选举。"
 PMR.communist_state_sov: "£SOV_emerging_communism (CPRF) 俄罗斯联邦共产党"
 PMR.communist_state_sov_icon: "£SOV_emerging_communism"
 POL.communist_state: "£generic_Communist_State_small 波兰共产主义者联盟“无产者”"
 POL.communist_state_desc: ""
 POL.communist_state_2017: "£generic_Communist_State_small 波兰共产党"
 POL.communist_state_2017_desc: ""
 POR.communist_state: "£POR_emerging_communism 社会主义统一工人党"
 POR.communist_state_icon: "£POR_emerging_communism"
 POR.communist_state_desc: ""
 PRU.communist_state: "£PRU_emerging_communism (PCP-PR) 秘鲁共产党-红色祖国"
 PRU.communist_state_icon: "£PRU_emerging_communism"
 PRU.communist_state_desc: "（马克思列宁主义） - 秘鲁共产党-红旗成立于1970年，因该党日益奉行毛主义教义而由原秘鲁共产党成员组建。秘共-红旗坚持“反修正主义”。此后，秘共-红旗成为秘鲁马克思主义思想的主要载体之一，数十年来参与或创建了多个左翼选举或政治联盟。"
 QUE.communist_state: "£generic_Communist_State_small (PCQ-PCC) - 魁北克共产党"
 QUE.communist_state_desc: "（马克思列宁主义） - 魁北克共产党由加拿大共产党成员于1965年成立，作为魁北克境内一个完全独立的共产主义政党运作。尽管在90年代因社会主义阵营崩溃而经历了一段不活跃和涣散的时期，该党与更温和的左翼元素结盟，仍得以缓慢恢复，并与魁北克其他左翼政党建立更紧密的联系 - 不过该党的官方纲领仍致力于马克思列宁主义。"
 RAJ.communist_state: "£RAJ_Communist_State (CPI) - 印度共产党"
 RAJ.communist_state_icon: "£RAJ_Communist_State"
 RAJ.communist_state_desc: "(马克思列宁主义) - 印度共产党\n\n印度共产党成立于1925年的坎普尔，是该国首个共产主义组织，但在1964年因与国大党及莫斯科的关系分歧而分裂，失去了大部分干部。作为两个共产党中较为温和的一方，它在紧急状态期间支持英迪拉·甘地，随后重新加入左翼阵线。其残存的力量集中在喀拉拉邦、泰米尔纳德邦、比哈尔邦和特伦甘纳邦，在那里作为左翼联盟中的小伙伴参与竞选。该党呼吁进行土地改革，实行工业国有化，并采取敌视美国影响的外交政策。"
 ROJ.communist_state: "£ROJ_emerging_communism 马克思列宁主义共产党"
 ROJ.communist_state_icon: "£ROJ_emerging_communism"
 ROJ.communist_state_desc: ""
 ROM.communist_state: "£ROM_communist_state 罗马尼亚共产党"
 ROM.communist_state_icon: "£ROM_communist_state"
 ROM.communist_state_desc: ""
