 israel_focus: "Árvore de Foco de Israel"
 ISR_speak_to_government: "Falar com o Knesset"
 ISR_speak_to_government_desc: "Chegou a hora de falarmos com o nosso governo e começarmos a regular nossa vida política interna."
 ISR_democratic_first: "Judeu, Mas Democrático"
 ISR_democratic_first_desc: "Somos judeus, sim, mas os princípios democráticos são o aspecto mais importante de nosso Estado, o que distingue nossos valores fundamentais."
 ISR_democratic_jewish_balance: "Judeu e Democrático"
 ISR_democratic_jewish_balance_desc: "Ser judeu e democrático não é uma contradição. Devemos abraçar ambos os aspectos de nossa nova identidade política."
 ISR_jewish_first: "Democrático, Mas Judeu"
 ISR_jewish_first_desc: "Devemos ser judeus primeiro e só então abraçar os valores de nossas liberdades democráticas. Não há direitos sem responsabilidades!"
 ISR_economy_branch_focus: "Um Escudo Econômico Defensivo"
 ISR_economy_branch_focus_desc: "A economia deve ser nosso escudo contra os inimigos, melhorando e sustentando o bem-estar de nossa população."
 ISR_infrastructure_focus: "Concluir a Sexta Estrada"
 ISR_infrastructure_focus_desc: "Devemos continuar a finalizar os projetos de infraestrutura que já começamos."
 ISR_tel_aviv_priority: "Priorizar a Região Central"
 ISR_tel_aviv_priority_desc: "Devemos nos concentrar em desenvolver Tel Aviv e seus setores em crescimento."
 ISR_southern_priority_infra: "Priorizar a Região Sul"
 ISR_southern_priority_infra_desc: "Antes de trabalhar nas regiões do norte, devemos priorizar os problemas de infraestrutura do sul."
 ISR_northern_priority_infra: "Priorizar a Região Norte"
 ISR_northern_priority_infra_desc: "Antes de resolver os problemas do sul, devemos nos concentrar nas questões econômicas do norte."
 ISR_coastal_southern_road: "A Ferrovia Costeira do Sul"
 ISR_coastal_southern_road_desc: "Há muito planejamos a construção de ferrovias costeiras no sul, e agora podemos iniciar o projeto."
 ISR_egypt_train_offer: "Propor a Linha de Nitzana"
 ISR_egypt_train_offer_desc: "Para comerciar com o Egito de forma mais eficaz, devemos conectar nossas ferrovias às deles."
 ISR_negev_trains: "As Linhas do Norte do Negev"
 ISR_negev_trains_desc: "A parte norte do Negev precisa desesperadamente de ferrovias e estradas rurais. Precisamos trabalhar nessa questão."
 ISR_eilat_train: "O Trecho Final"
 ISR_eilat_train_desc: "A ferrovia de alta velocidade para Eilat é uma ferrovia israelense proposta que permitirá conectar os principais centros populacionais de Israel e os portos do Mediterrâneo à cidade meridional de Eilat, na costa do Mar Vermelho, além de servir ao transporte comercial de cargas entre o Mar Mediterrâneo e o Mar Vermelho."
 ISR_high_speed_tel_aviv_jerusalem: "Através do Saliente"
 ISR_high_speed_tel_aviv_jerusalem_desc: "Podemos começar a construir a infraestrutura de transporte de alta velocidade de Tel Aviv a Jerusalém. No entanto, isso pode aumentar as tensões entre nós e a Palestina."
 ISR_tel_aviv_metro: "O Metrô de Tel Aviv"
 ISR_tel_aviv_metro_desc: "Finalmente, podemos começar a construir o novo metrô de Tel Aviv, para atender à necessidade da população por transporte barato."
 ISR_jerusalem_light_rail: "O VLT de Jerusalém"
 ISR_jerusalem_light_rail_desc: "O VLT de Jerusalém é um sistema de veículo leve sobre trilhos em Jerusalém. Atualmente, a Linha Vermelha é a única em operação, a primeira de várias linhas planejadas em Jerusalém."
 ISR_jerus_lightrail_mod: "VLT de Jerusalém"
 ISR_galilee_railways: "As Linhas da Galileia"
 ISR_galilee_railways_desc: "Para modernizar nossa infraestrutura no norte, devemos construir as linhas da Galileia."
 ISR_restore_jezreel_railway: "Restaurar a Ferrovia de Jezreel"
 ISR_restore_jezreel_railway_desc: "Devemos restaurar a ferrovia de Jezreel e, com isso, ampliar nosso conhecimento sobre esquemas de construção ferroviária."
 ISR_jordan_israel_rail: "A Ferrovia da Ilha da Paz"
 ISR_jordan_israel_rail_desc: "Devemos construir uma ferrovia em direção à Jordânia para aumentar nossa capacidade de exportação através do território deles."
 ISR_israel_gulf_highway: "O Projeto da Hegemonia Revivida"
 ISR_israel_gulf_highway_desc: "Para fomentar o comércio entre nós e o Golfo, devemos construir uma ferrovia em direção à Arábia Saudita e nos conectar à península."
 ISR_middle_eastern_quad: "O Projeto I2U2"
 ISR_middle_eastern_quad_desc: "O I2U2 é uma parceria entre Índia, Israel, Emirados Árabes Unidos e EUA que trabalha para enfrentar desafios globais e promover oportunidades econômicas."
 ISR_shine_like_a_diamond: "Brilhar como um Diamante"
 ISR_shine_like_a_diamond_desc: "Devemos continuar nossa política de importação de diamantes e expandir o negócio."
 ISR_kimberley_process: "Formar o Processo de Kimberley"
 ISR_kimberley_process_desc: "As práticas antiéticas ligadas à importação ilegal de diamantes congoleses devem ser encerradas, o dinheiro deve ser confiscado e esses criminosos devem ser presos!"
 ISR_dan_gantler_affairs: "Operação Gertler"
 ISR_dan_gantler_affairs_desc: "Muitos empresários... menos que honestos em nosso país querem contatar senhores da guerra congoleses para comprar diamantes. Considerando a natureza antiética dessa prática, os benefícios do negócio podem ofuscar todas as preocupações morais."
 ISR_liberman_affair: "O Caso Gertler-Liberman"
 ISR_send_diamonds_to_asia: "Rumo ao Oriente"
 ISR_send_diamonds_to_asia_desc: "O mercado asiático é mais adequado para a venda de nossos diamantes."
 ISR_send_diamonds_to_america_desc: "O mercado americano é mais adequado para a venda de nossos diamantes."
 ISR_send_diamonds_to_america: "Rumo ao Ocidente"
 ISR_transition_to_manufacturing: "Transição para a Manufatura"
 ISR_transition_to_manufacturing_desc: "Precisamos modernizar nossas técnicas de lapidação de diamantes para atrair mais clientes em todo o mundo."
 ISR_open_the_material_halls: "Abrir os Salões de Materiais"
 ISR_open_the_material_halls_desc: "As novas condições do distrito da bolsa de diamantes fazem com que outros países dependam mais da exportação de diamantes."
 ISR_diamond_district: "O Distrito dos Diamantes"
 ISR_diamond_district_desc: "O distrito dos diamantes é o centro da indústria diamantífera de Israel, além de um importante centro comercial."
 ISR_foreign_companies_gas: "Negociar com Extratoras Estrangeiras"
 ISR_foreign_companies_gas_desc: "A Royal Dutch Shell está nos oferecendo acordos interessantes e, talvez, possamos usá-los em nosso benefício."
 ISR_pass_the_gas_deal: "Impulsionar o Acordo do Gás"
 ISR_pass_the_gas_deal_desc: "Devemos trabalhar nosso gás por conta própria, sem permitir que nenhuma empresa estrangeira o administre."
 ISR_compromise_gas_deal: "O Modelo Norueguês"
 ISR_compromise_gas_deal_desc: "Precisamos copiar o modelo norueguês de bem-estar social e usar o dinheiro do gás para custear a assistência social."
 ISR_lighthouse: "Luz para as Nações"
 ISR_lighthouse_desc: "Aos nossos olhos, somos a luz brilhante do progresso tecnológico e da civilização. Devemos avançar de acordo com a nossa visão."
 ISR_yotzma: "A Iniciativa Yotzma"
 ISR_yotzma_desc: "Devemos criar condições para que países estrangeiros tenham mais vontade de investir em nossa indústria de TI."
 ISR_venture_capital: "Aumentar os Impostos"
 ISR_venture_capital_desc: "Se estamos em desesperada necessidade de dinheiro, aumentar os impostos por um período fixo pode ser benéfico para nós."
 ISR_chutzpah: "Promover o Chutzpah"
 ISR_chutzpah_desc: "Chutzpah é a qualidade da audácia, para o bem ou para o mal. Um equivalente próximo em inglês é, às vezes, arrogância (hubris). Devemos ousar pensar grande."
 ISR_army_concentrate_innovation: "O Grande Filtro"
 ISR_army_concentrate_innovation_desc: "Hoje em dia, as forças armadas são um caminho de seleção, que pode ser usado para impulsionar a indústria cibernética civil."
 ISR_silicon_wadi: "Silicon Wadi"
 ISR_silicon_wadi_desc: "O Silicon Wadi é uma região de Israel que serve como um dos centros globais de tecnologia avançada. Estende-se pela planície costeira israelense e é citado entre os motivos pelos quais o país ficou conhecido como a nação das startups do mundo."
 ISR_hightech_fortress: "A Fortaleza de Alta Tecnologia"
 ISR_hightech_fortress_desc: "Para tornar as colinas de Golã mais interessantes para investimentos, devemos criar ali uma infraestrutura de educação em TI."
 ISR_ben_gurion_university: "A Pérola do Deserto de Ben Gurion"
 ISR_ben_gurion_university_desc: "A Universidade Ben-Gurion do Negev é uma das principais universidades de pesquisa de Israel e está entre as líderes mundiais em muitas áreas."
 ISR_start_up_nation: "Nação das Startups"
 ISR_start_up_nation_desc: "Finalmente, nosso país deve ser considerado a nação das startups do Oriente Médio!"
 ISR_dimona: "Centro Shimon Peres de Dimona"
 ISR_dimona_desc: "Temos uma... fábrica têxtil muito radioativa em nosso país. Devemos decidir o que fazer com ela."
 ISR_ben_gvir_path: "Força Judaica"
 ISR_ben_gvir_path_desc: "Desde os desastrosos Acordos de Oslo, os ateus e os árabes ergueram a cabeça e passaram a sentir que são donos do Estado Judeu e podem desmantelá-lo aos poucos. Não mais. Mostraremos a todos a quem este país realmente pertence: o povo judeu."
 ISR_ben_gvir_am_israel: "O Povo de Israel"
 ISR_ben_gvir_am_israel_desc: "Formado originalmente como 'Otzma LeYisrael' e depois renomeado 'Otzma Yehudit', o partido liderado por Itamar Ben-Gvir é o descendente ideológico do partido proscrito 'Kach'. Sua ideologia é de extrema direita, antiárabe, ultranacionalista e kahanista (uma ideologia sionista religiosa cujas raízes estão na aplicação da lei judaica no Estado). O partido, e portanto seu líder Ben-Gvir, acredita na supremacia judaica e defende a deportação de extremistas árabes, a forte proteção e expansão dos assentamentos judaicos, o aumento do ensino da lei judaica às novas gerações e é a favor do chamado capitalismo judaico."
 ISR_ben_gvir_kahanism_1: "Kahanismo - O Caminho da Torá"
 ISR_ben_gvir_kahanism_1_desc: "Seguindo as palavras de nosso fundador, o Rabino Meir Kahane, queremos estabelecer um Estado teocrático judaico, onde apenas nossos irmãos hebreus tenham permissão para pisar na Terra de Israel."
 ISR_ben_gvir_kahanism_2: "Kahanismo - Datiim"
 ISR_ben_gvir_kahanism_2_desc: "Dando um passo adiante em nossa visão de uma Terra de Israel habitada apenas por israelitas, segundo a vontade de Deus."
 ISR_ben_gvir_kahanism_3: "Kahanismo - Sicários"
 ISR_ben_gvir_kahanism_3_desc: "Não há espaço para descendentes de não israelitas em nossa Terra santa. A palavra de Deus é nossa única luz no Estado, e a justiça de Deus será aplicada sem trégua."
 ISR_ben_gvir_kahanism_4: "Kahanismo - A Terra de Deus"
 ISR_ben_gvir_kahanism_4_desc: "A Terra de Israel está finalmente nas mãos dos israelitas, com a Lei de Maimônides como nosso guia."
 ISR_ben_gvir_torat_israel: "A Bíblia de Israel"
 ISR_ben_gvir_torat_israel_desc: "O sionismo religioso é uma ideologia fundamental do 'Otzma Yehudit', que acredita que a Terra de Israel foi prometida por Deus aos antigos israelitas, que, portanto, têm a obrigação de defender e trabalhar a própria terra de acordo com a Torá. Todos os colonos na Terra de Israel devem seguir as prescrições religiosas como Filhos de Israel."
 ISR_ben_gvir_eretz_israel: "A Terra de Israel"
 ISR_ben_gvir_eretz_israel_desc: "Eretz Yisrael, a Terra de Israel, a região que Deus prometeu a nossos ancestrais e seus descendentes, os israelitas, segundo o Tanakh e a Bíblia."
 ISR_question_1923_partition: "Questionar a Conferência do Cairo"
 ISR_question_1923_partition_desc: "Em 1923, a Grã-Bretanha permitiu que a dinastia hachemita administrasse a parte do mandato a leste do Rio Jordão, chamada Transjordânia, e lhe concedeu plena independência em 1946. Esse território é hoje conhecido como Reino da Jordânia. Pensamos, porém, que a terra além do Rio Jordão pertence aos descendentes dos israelitas."
 ISR_promised_land: "A Terra Prometida"
 ISR_promised_land_desc: "Deus nos prometeu uma Terra maior do que a que foi dada pela ONU, e é hora de recuperá-la... e talvez acrescentar um pouco mais no processo, por que não."
 ISR_farright_iraq: "Junto aos Rios da Babilônia"
 ISR_farright_iraq_desc: "Nós, o povo de Deus, devemos ser Sua mão na destruição de Babilônia mais uma vez!"
 ISR_farright_lebanon: "Esmagar a Terra de Baal"
 ISR_farright_lebanon_desc: "É hora de esmagar o Líbano e integrá-lo à Grande Israel!"
 ISR_farright_syria: "Vingança contra Labão, o Arameu"
 ISR_farright_syria_desc: "A Síria é há muito tempo um incômodo para nós. É hora de removê-la do mapa!"
 ISR_farright_saudia: "Subjugar os Ismaelitas"
 ISR_farright_saudia_desc: "A Arábia Saudita é uma ameaça aos justos. Como podemos permitir que ela exista?"
 ISR_farright_china: "Concluir a Cruzada de Kahane"
 ISR_farright_china_desc: "Devemos concluir a cruzada de Kahane e finalmente subjugar a China!"
 ISR_farright_america: "Deter o Holocausto da Assimilação"
 ISR_farright_america_desc: "Os goyim americanos influenciam nosso povo há tempo demais! Tudo o que é repugnante em nosso país vem da América e daqueles de nossa tribo que foram assimilados por eles!"
 ISR_death_to_terrorists: "Emitir a Sentença de Morte"
 ISR_death_to_terrorists_desc: "A pena de morte é legal em Israel, apesar de não ser aplicada desde a década de 1990. No entanto, pesquisas públicas mostram que a maioria da população israelense é a favor de impor sentenças de morte a terroristas que assassinaram cidadãos israelenses. Vamos, então, agradar a maioria."
 ISR_make_us_of_terrorist_families: "A Proposta Kedar"
 ISR_make_us_of_terrorist_families_desc: "Os terroristas não têm misericórdia ao ameaçar cidadãos israelenses, seja qual for sua idade ou condição. Mas eles também têm famílias, e vamos usá-las para ganhar alguma vantagem."
 ISR_spread_out_land: "Beneficiar Estudantes de Yeshiva e Soldados"
 ISR_spread_out_land_desc: "Nossos estudantes de Yeshiva e soldados são os pilares de nossa grande sociedade e merecem algum benefício extra por seu serviço. Vamos dar a eles alguns hectares de terra."
 ISR_immunity_to_soldiers: "Conceder-lhes Imunidade"
 ISR_immunity_to_soldiers_desc: "É inaceitável que nossos heróis tenham de enfrentar julgamentos por cumprirem seu dever. Faremos questão de protegê-los enquanto trabalham para proteger nossos cidadãos de terroristas."
 ISR_engagement_reform: "Soltar as Correntes do Fuzil"
 ISR_engagement_reform_desc: "É hora de flexibilizar as regras de engajamento de nossos soldados contra os terroristas."
 ISR_hebrew_justice: "Restaurar a Justiça Hebraica"
 ISR_hebrew_justice_desc: "Afastamo-nos demais do Tzedek, a Justiça de Deus. Agora é hora de voltar à vontade de Deus e restabelecer a ideia de 'pessoa justa', como expressa no Deuteronômio."
 ISR_basic_law_torah: "Lei Básica: Estudo da Torá"
 ISR_basic_law_torah_desc: "O estudo da Torá é fundamental para estabelecer uma sociedade próspera na Terra de Israel. Vamos torná-lo obrigatório."
 ISR_hebraic_studies: "Promover os Estudos Hebraicos"
 ISR_hebraic_studies_desc: "Nenhuma outra educação se compara à hebraica! Nossos estudantes devem se manter longe de outras abordagens culturais e, em vez disso, concentrar-se em nosso legado histórico."
 ISR_ban_women_from_military: "Reverter o Caso Miller"
 ISR_ban_women_from_military_desc: "As mulheres não devem lutar em nossas forças armadas, mas cuidar do lar. Mudaremos a Constituição para garantir que fiquem em casa enquanto seus homens defendem o país."
 ISR_outlaw_lgbt: "Realizar Purificações Internas"
 ISR_outlaw_lgbt_desc: "Não vejo nenhuma referência a ideologias LGBT na Bíblia, portanto não faz sentido permitir o casamento entre pessoas do mesmo sexo ou outras facilitações para isso. Muitos podem deixar o país, mas quem se importa?"
 ISR_kaplan_trials: "Os Julgamentos de Kaplan"
 ISR_kaplan_trials_desc: "A Reforma Judicial causou protestos e tumultos, organizados por pessoas que não entenderam sua importância. Essas pessoas são traidoras de nossa Terra e não podem ficar impunes."
 ISR_third_temple: "O Terceiro Templo"
 ISR_third_temple_desc: "O Templo de Jerusalém refere-se a duas estruturas que serviram como o principal local sagrado de culto, primeiro para os israelitas e depois para os judeus. Ambos os templos foram destruídos, porém, durante cercos à Cidade Santa. Agora é hora de reconstruí-lo e dar ao nosso povo um magnífico lugar para orar. Por mais que nossos vizinhos protestem, o Terceiro Templo se erguerá no Monte Moriá, que por acaso fica na Cisjordânia... fazer o quê."
 ISR_likud_path: "A Consolidação"
 ISR_likud_path_desc: "O Likud, traduzido diretamente como 'Consolidação', é a reencarnação moderna do movimento sionista revisionista, fundado por Ze'ev Jabotinsky durante a luta pela independência. Esse movimento encontrou sua forma militante nos movimentos de resistência Irgun e Lehi, que se uniram para formar o Partido da Liberdade no primeiro Knesset israelense. Por fim, sob Menachem Begin, o Herut uniu-se aos partidos liberais para formar o Bloco Liberal da Liberdade em 1973, e em 1977 passou a ser chamado de 'Likud'. O partido de fato venceu aquela eleição, pondo fim a 29 anos consecutivos de governo trabalhista."
 ISR_rein_in_partners: "Conter Nossos Parceiros"
 ISR_rein_in_partners_desc: "Apesar de nossa dependência do Bloco Nacional para permanecer no poder, devemos enfatizar que nossos interesses pessoais vêm em primeiro lugar. Nossos parceiros de coalizão entraram em nossa coalizão, e não o contrário. Eles precisam conhecer seu lugar e abster-se de uma agenda extremista."
 ISR_judicial_reform_partial: "Negociar com a Presidência"
 ISR_judicial_reform_partial_desc: "Muitos no Bloco Nacional, inclusive dentro do Partido Likud, pediram a reforma do poder judiciário em nome da diversidade nos tribunais, que, segundo eles, não representam a sociedade israelense, bem como a remoção de uma 'elite não eleita'. Suas propostas iniciais são desastrosas e enfureceriam o público, mas talvez, conduzindo mediações por meio do Presidente de Israel, possamos evitar uma crise."
 ISR_judicial_reform_full: "Lançar as Reformas de Levin"
 ISR_judicial_reform_full_desc: "O judiciário, ainda mais do que os outros ramos das autoridades jurídicas israelenses, foi corrompido. Juízes não eleitos e elitistas, que escolhem a si mesmos no Comitê de Nomeação Judicial, acorrentam a capacidade do governo de exercer o mandato recebido do povo e pendem esmagadoramente para a esquerda. Devemos retomar o controle do governo e recolocar a panelinha judicial em seu lugar."
 ISR_national_camp: "Formar o Campo Nacional"
 ISR_national_camp_desc: "As investigações corruptas e desonestas levaram todos os partidos de esquerda e de centro a boicotar Netanyahu e a se recusar a integrar uma coalizão sob ele. Que seja! Encontraremos parceiros novos e pouco convencionais. Juntos, o Campo Nacional garantirá a segurança de Israel por gerações."
 ISR_corrupt_likud: "Cooptar o Partido"
 ISR_corrupt_likud_desc: "O Partido Likud tem uma ala forte, liberal e ideológica, em oposição ao campo conservador populista, muito maior, chefiado por Netanyahu. Esse clã, liderado por figuras como Gideon Sa'ar, deve ser afastado dos assuntos do partido, e o partido será cooptado para a agenda pessoal de Bibi."
 ISR_request_immuity: "Solicitar Imunidade"
 ISR_request_immuity_desc: "O público pode ver claramente que esses chamados 'Casos' estão desmoronando um a um no tribunal, mas, para garantir que a visão do público seja reconhecida, temos de solicitar imunidade ao parlamento. Deve-se considerar o que é conhecido como 'Lei Francesa', que proíbe investigações contra chefes de Estado e de governo."
 ISR_witch_hunt: "Proclamar a Caça às Bruxas"
 ISR_witch_hunt_desc: "Há meio século, o establishment Histadrut-Trabalhista afastou a população sefardita e mizrahi das perspectivas de prosperidade na sociedade israelense, e de fato o establishment e a burocracia ainda são dominados por esses quase-aristocratas brancos. Eles perseguem Netanyahu hoje tanto quanto perseguiram os pais de seus eleitores naquela época. Uma tentativa de derrubar um Primeiro-Ministro em exercício, que covardia!"
 ISR_reform_public_broadcasting: "Reformar o Primeiro Canal"
 ISR_reform_public_broadcasting_desc: "A Organização de Radiodifusão Pública foi o primeiro e único canal de televisão de Israel por mais de quatro décadas, até que o Canal 2 foi aberto na década de 1990 e o Canal 1 no início dos anos 2000. Devemos usar a atual reorganização e privatização do Canal 1 para tentar transformá-lo em um canal mais 'equilibrado' e de direita."
 ISR_attack_the_media: "Atacar a Mídia"
 ISR_attack_the_media_desc: "Assim como o judiciário e a polícia, a mídia foi tomada e corrompida por uma panelinha de esquerda que dissemina notícias falsas por toda parte. Devemos combater isso e informar o povo sobre essa propaganda!"
 ISR_lo_haya_klum: "'Não havia nada, não há nada!'"
 ISR_lo_haya_klum_desc: "Os casos levados ao público pela polícia israelense e pela procuradoria-geral são tão falsos que deveria ser óbvio que se trata de uma conspiração para derrubar o popular Primeiro-Ministro de direita por pressão da esquerda. Resistiremos! Sabemos que não havia nada, porque não há nada!"
 ISR_bibism: "Bibismo"
 ISR_bibism_desc: "As eleições recentes mostraram que o povo confiou sua segurança ao Sr. Segurança. Netanyahu é o único capaz de defender a economia e a segurança de Israel, liderando um Likud gigante contra todos os esquerdistas."
 ISR_netanyahu_plan: "O Programa do Rei"
 ISR_netanyahu_plan_desc: "Netanyahu tem um plano social específico que construiu com base em sua visão. É hora de começar a implementá-lo."
 ISR_pension_reform: "Reformar as Aposentadorias"
 ISR_pension_reform_desc: "Dados os nossos problemas orçamentários, precisamos reformar as aposentadorias e aprovar um novo plano."
 ISR_lower_income_tax: "Reduzir o Imposto de Renda"
 ISR_lower_income_tax_desc: "Devemos reduzir os impostos sobre a renda sem permitir que os tributos sufoquem nossa economia vibrante e em crescimento."
 ISR_shrink_the_public_sector: "Reduzir o Setor Público"
 ISR_shrink_the_public_sector_desc: "A política de nossos antecessores inflou o aparato administrativo a dimensões desproporcionais. Devemos permitir que o setor privado se autorregule."
 ISR_reform_bituach_leumi: "Reformar o Seguro Nacional"
 ISR_reform_bituach_leumi_desc: "O Instituto Nacional de Seguros oferece proteção econômica a populações e famílias vulneráveis que enfrentam dificuldades temporárias ou de longo prazo, por meio do pagamento de benefícios."
 ISR_bachar_reform: "O Comitê Bachar"
 ISR_bachar_reform_desc: "O novo plano Bachar aumentará a concorrência no mercado, que será baseada em desempenho, qualidade do serviço e confiabilidade."
 ISR_cut_social_spending: "Cortar os Gastos Sociais"
 ISR_cut_social_spending_desc: "É hora de pararmos de distribuir dinheiro de graça a todos os segmentos da população. É hora de cortar parte dos custos da assistência social e usar o dinheiro economizado para outros fins."
 ISR_cut_child_benefits: "Cortar os Benefícios Infantis"
 ISR_cut_child_benefits_desc: "Os ortodoxos se multiplicam muito rapidamente, sem assumir responsabilidades e muitas vezes negando a Israel o fato de sua existência... É hora de reduzir o auxílio a eles."
 ISR_world_populists: "Apoiar os Populistas do Mundo"
 ISR_world_populists_desc: "Apesar de visões diferentes sobre política externa, há muitos políticos no mundo com uma base ideológica semelhante à nossa, e devemos tentar fazer amizade com eles."
 ISR_euroscepticism: "Promover o Euroceticismo"
 ISR_euroscepticism_desc: "Em Israel, há uma tendência entre os partidos de esquerda de seguir um caminho pró-europeu. Precisamos quebrar esse sentimento apoiando o euroceticismo não apenas em Israel, mas em toda a Europa."
 ISR_befriend_russia: "Visita de Estado à Rússia"
 ISR_befriend_russia_desc: "É hora de visitar a Rússia e dar continuidade aos nossos laços diplomáticos."
 ISR_befriend_republicans: "Favorecer o Partido Republicano"
 ISR_befriend_republicans_desc: "It is in our political interests to maintain ties with the Conservative Party in order to use these ties for further political purposes."
 ISR_befriend_brazil: "Viajar ao Brasil"
 ISR_befriend_brazil_desc: "Curiosamente, as recentes mudanças políticas no Brasil tornaram favoráveis as relações diplomáticas entre nós e eles. Precisamos aproveitar isso."
 ISR_befriend_trump: "Fazer Amizade com a Direita Americana"
 ISR_befriend_trump_desc: "Os conservadores e a direita dos EUA, embora nem sempre tenham uma atitude uniformemente boa em relação a nós, têm visões políticas que coincidem de maneira surpreendente com as nossas, e precisamos aproveitar isso."
 ISR_support_hungary: "Visita de Estado à Hungria"
 ISR_support_hungary_desc: "A Hungria se moveu recentemente para a direita no cenário político e demonstrou interesse em cooperar conosco. Vale a pena aproveitar isso."
 ISR_matter_of_poland: "A Questão da Polônia"
 ISR_matter_of_poland_desc: "A Polônia tomou demais para si e nega seu envolvimento nos eventos do século XX. É hora de esclarecer isso e fazer a eles uma pergunta clara."
 ISR_tama_38: "Programa Tama 38"
 ISR_tama_38_desc: "O Tama 38 concede direitos de construção aos inquilinos cujos edifícios passam por reforço estrutural"
 ISR_harish: "Desenvolver Harish"
 ISR_harish_desc: "Harish é uma cidade no Distrito de Haifa, em Israel. Devemos torná-la o centro de nossos negócios."
 ISR_kachlon_program: "As Reformas de Kachlon"
 ISR_kachlon_program_desc: "O Ministro das Finanças Moshe Kahlon divulgou o plano econômico proposto, incluindo várias reformas voltadas a questões como a concentração de mercado, o custo de vida, a produtividade e a crise habitacional."
 ISR_reform_doar: "Reformar o Serviço Postal"
 ISR_reform_doar_desc: "Como parte da reforma postal de Israel, o governo decidiu que a autoridade postal israelense deixaria de operar como órgão estatutário e todas as suas operações seriam transferidas para uma empresa estatal recém-criada."
 ISR_reform_hashmal: "Desregulamentar os Serviços de Eletricidade"
 ISR_reform_hashmal_desc: "Como parte do pacote de reformas de Kahlon, precisamos desregulamentar nossa rede e nossos serviços de eletricidade."
 ISR_privatize_bank_leumi: "Privatizar o Banco Leumi"
 ISR_privatize_bank_leumi_desc: "O Banco Leumi é um banco israelense. Foi fundado em 27 de fevereiro de 1902, em Jafa, como Anglo Palestine Company, subsidiária do Jewish Colonial Trust, criado antes em Londres por membros do movimento sionista para promover a indústria, a construção, a agricultura e a infraestrutura da terra que se esperava vir a se tornar Israel."
 ISR_open_skies_desc: "O acordo Céus Abertos é visto como um grande impulso para a economia israelense, pois reduz as tarifas aéreas e promove a criação de rotas adicionais."
 ISR_privatize_elal: "Privatizar a El-Al"
 ISR_privatize_elal_desc: "A El Al é a companhia aérea nacional de Israel. É a companhia de bandeira do país. Também voa para a África, a Ásia, a Europa e a América do Norte. A El Al atende 48 destinos."
 ISR_gas_deal: "Lei de Desregulamentação dos Campos de Gás"
 ISR_gas_deal_desc: "O próximo passo coerente de nossas reformas é atrair mais empresas de gás para o nosso mercado."
 ISR_shtrum_committee_desc: "O Comitê Shtrum será um comitê conjunto que estabelecerá recomendações de políticas para aumentar a concorrência no sistema financeiro de Israel."
 ISR_path_plus: "Programa Path-Plus"
 ISR_path_plus_desc: "Agora precisamos alargar as rodovias e acrescentar novas faixas para aumentar as opções de mobilidade dos proprietários de carros."
 ISR_road_6: "Construir a Estrada Seis"
 ISR_road_6_desc: "A Rodovia 6 é a primeira estrada israelense no modelo Construir-Operar-Transferir, que será construída principalmente pelo setor privado em troca de uma concessão para cobrar pedágios na rodovia por um determinado número de anos. É também um dos maiores projetos de infraestrutura a serem realizados em Israel."
 ISR_supertanker: "Liberar o Super-Petroleiro"
 ISR_supertanker_desc: "Devemos criar oportunidades de nova moradia acessível para todos os segmentos da população israelense. Este será o plano para o povoamento completo de todas as regiões de Israel, com a participação de empreiteiras privadas na execução do projeto."
 ISR_legalize_cannabis_desc: "Um homem sábio disse um dia,\n\n§GO maior assassino do planeta é o estresse, e eu ainda acho que o melhor remédio é, e sempre foi, a cannabis.§!"
 ISR_tourism_gay_parade: "Popularizar a Parada de Tel Aviv"
 ISR_tourism_gay_parade_desc: "Devemos usar as Paradas do Orgulho Gay em Tel Aviv como isca para turistas ocidentais que virão assistir a essas... marchas."
 ISR_association_agreement_usa: "Acordo de Associação com os EUA"
 ISR_association_agreement_usa_desc: "Devemos pedir aos Estados Unidos que criem novos órgãos para adotar uma opinião comum e unificada sobre questões regionais de nosso interesse e sobre acordos econômicos e políticos entre nós e os Estados Unidos."
 ISR_association_agreement_eu: "Acordo de Associação com a UE"
 ISR_association_agreement_eu_desc: "Devemos pedir à União Europeia que crie novos órgãos para adotar uma opinião comum e unificada sobre questões regionais de nosso interesse e sobre acordos econômicos e políticos entre nós e a União Europeia."
 ISR_cyprus_marriage: "Um Arranjo com Chipre"
 ISR_cyprus_marriage_desc: "Não podemos permitir casamentos civis no próprio Israel por motivos religiosos, então devemos negociar com Chipre para registrar esses casamentos e contornar as leis religiosas."
 ISR_likud_family_values_desc: "Nosso povo judeu é fundado em valores familiares judaicos tradicionais, que incluem laços familiares fortes e uma comunidade forte."
 ISR_likud_lgbt_acceptance: "Formar os Likudniks Orgulhosos"
 ISR_likud_lgbt_acceptance_desc: "O Likud Pride é uma organização LGBT conservadora fundada e ligada ao partido de direita israelense Likud."
 ISR_privatize_ports: "Desmantelar a Autoridade Portuária"
 ISR_privatize_ports_desc: "Precisamos dissolver os conselhos portuários e negociar com investidores externos a transferência total dos conselhos portuários para nós."
 ISR_likud_sephardic_crisis: "Acorrentar o Dragão"
 ISR_likud_sephardic_crisis_desc: "Precisamos fazer mais esforços para integrar os sefarditas à nossa sociedade e criar condições favoráveis a uma maior consolidação."
 ISR_shas_path: "Observantes Sefarditas da Torá"
 ISR_shas_path_desc: "O Shas é um partido político religioso haredi sionista de Israel. Fundado em 1984 sob a liderança do Rabino Ovadia Yosef, representa principalmente os interesses dos judeus haredim sefarditas e mizrahi."
 ISR_the_transparents: "Cuidar dos Transparentes"
 ISR_the_transparents_desc: "Devemos aderir aos princípios judaicos e aumentar o apoio social mútuo em nossa sociedade."
 ISR_baalei_teshuva: "Ba'alei Teshuva"
 ISR_baalei_teshuva_desc: "Devemos aumentar os gastos sociais para garantir que a comunidade haredi esteja satisfeita."
 ISR_haredi_arab: "Cooperação Haredi-Árabe"
 ISR_haredi_arab_desc: "Podemos tentar gerenciar a Cooperação Haredi-Árabe e, quem sabe, obter bons resultados em apoio político mútuo. Mas pode dar errado também.."
 ISR_legacy_of_yosef: "Legado de Ovadia Yosef"
 ISR_legacy_of_yosef_desc: "Ovadia Yosef foi um estudioso talmúdico nascido no Iraque, um posek, Rabino-Chefe Sefardita de Israel de 1973 a 1983, e fundador e líder espiritual de longa data do partido ultraortodoxo Shas de Israel."
 ISR_adinas_donations: "As Doações de Adina"
 ISR_adinas_donations_desc: "Devemos fazer doações aos pobres, continuando e apoiando as práticas do Partido Shas."
 ISR_strong_aryeh: "Um Leão Forte"
 ISR_strong_aryeh_desc: "Nossa coalizão com o Shas está muito mais forte do que antes, e devemos usar isso para promover nossa popularidade entre os judeus haredim."
 ISR_food_checks: "Vales-Alimentação para os Pobres"
 ISR_food_checks_desc: "Muitas pessoas em nosso país nem sequer podem pagar pela comida para si e para suas famílias. Devemos garantir que todos possam comer e fornecer vales-alimentação aos pobres."
 ISR_crown_to_its_former_glory: "Lehakhzir Atara Le'Yoshna"
 ISR_crown_to_its_former_glory_desc: "Devemos restaurar nossa coroa à antiga glória e reduzir a influência ocidental sobre o nosso país."
 ISR_yemenite_affair: "Investigar o Caso dos Iemenitas"
 ISR_yemenite_affair_desc: "O Caso das Crianças Iemenitas refere-se ao desaparecimento de bebês e crianças pequenas, principalmente judeus iemenitas filhos de imigrantes, no recém-fundado Estado de Israel entre 1948 e 1954."
 ISR_sephardic_cultural_heritage: "Proteger a Herança Sefardita"
 ISR_sephardic_cultural_heritage_desc: "Devemos proteger a herança sefardita e promover a história dos judeus sefarditas no currículo escolar."
 ISR_toranic_education: "Financiar a Educação Haláquica"
 ISR_toranic_education_desc: "Talvez devamos financiar o sistema especial de educação toráica do Shas para os ultraortodoxos sefarditas."
 ISR_utj_path: "Judaísmo da Torá e do Shabat"
 ISR_utj_path_desc: "O Judaísmo Unido da Torá, frequentemente chamado de Gimel, por seu símbolo eleitoral, é uma aliança política haredi, religiosa e conservadora entre a Agudat Yisrael e a Degel HaTorah. Diferentemente de outros partidos religiosos de Israel, o UTJ não é sionista e tem alguns traços social-democratas."
 ISR_tal_law: "A Lei Tal"
 ISR_tal_law_desc: "Desde 1949, a comunidade ultraortodoxa foi informalmente isentada do serviço militar, por ele colidir com seus valores. É hora de aprovar uma lei oficial que conceda isenção do serviço militar a nossos estudantes de yeshiva, importantes demais para servir nas IDF."
 ISR_reject_liba: "Contornar as Sanções do Liba"
 ISR_reject_liba_desc: "O LIBA, currículo básico do Ministério da Educação, que inclui o ensino de inglês, foi introduzido para evitar que certos grupos ensinem apenas hebraico e outros temas religiosos. Essa decisão precisa ser revertida, pois afeta nossa independência para ensinar nossa cultura aos nossos jovens. Que decidam se querem ensinar inglês ou não."
 ISR_obstruct_mamlakhti: "Obstruir o Mamach"
 ISR_obstruct_mamlakhti_desc: "O Mamach é um currículo ortodoxo alternativo que moldou seu próprio ensino de temas como inglês, matemática etc. Ainda assim, é progressista demais e ameaçará a mente de nossos jovens estudantes. Não nos livraremos dele, mas vamos torná-lo um pouco mais difícil de aplicar."
 ISR_shopkeepers_law: "A Lei dos Lojistas"
 ISR_shopkeepers_law_desc: "A Torá diz claramente que o Shabat é um dia de descanso para os judeus, no qual nenhuma atividade de trabalho deve ser realizada. Faremos disso uma lei, tornando obrigatório o fechamento de lojas e mercados nesse dia."
 ISR_saturday_construction: "Apenas Pikuach Nefesh"
 ISR_saturday_construction_desc: "Nenhum trabalho é permitido no Shabat, nem mesmo a construção, exceto por Pikuach Nefesh, que é a salvaguarda da vida humana, um conceito conhecido como Halakhá. Proibiremos qualquer obra de construção durante o Shabat."
 ISR_new_conscription_law: "Nova Lei de Recrutamento"
 ISR_new_conscription_law_desc: "Nossa segurança é importante, mas a educação da Torá de nossos jovens estudantes é mais. Eles não podem desperdiçar tanto tempo em um recrutamento forçado em nossas Forças de Defesa."
 ISR_anti_reformism: "Denunciar os Reformistas"
 ISR_anti_reformism_desc: "O Judaísmo Reformista é uma vertente altamente liberal do judaísmo, caracterizada por pouco foco no ritual e na observância pessoal, que vê a lei judaica como não vinculante e aceita sensibilidades modernas (incluindo as comunidades LGBTQ+). Desenvolveu-se principalmente nos EUA."
 ISR_kotel_protocols: "A Questão das Mulheres do Kotel"
 ISR_kotel_protocols_desc: "As Mulheres do Muro, também conhecidas como Mulheres do Kotel, são uma associação feminista que luta para acabar com a segregação de gênero no Muro das Lamentações, onde mulheres e homens são separados durante a leitura da Torá."
 ISR_segregated_prayers: "Segregar as Orações"
 ISR_segregated_prayers_desc: "As Mulheres do Muro tentam eliminar a separação de gênero durante a leitura da Torá no Muro das Lamentações. Isso é um completo absurdo; na verdade, construiremos barreiras ainda mais fortes para impedir que isso aconteça."
 ISR_anti_lgbt_propaganda: "Pior que o Hezbollah"
 ISR_anti_lgbt_propaganda_desc: "As pessoas LGBTQ+ nos tornam a todos mais fracos, presos aos pecados em vez da Torá."
 ISR_rz_path: "Partido Sionista Religioso"
 ISR_rz_path_desc: "O Partido Sionista Religioso, também conhecido como Tkuma ou União Nacional-Tkuma, é um partido de extrema direita, ultranacionalista, supremacista judaico e sionista religioso."
 ISR_subsidize_outposts: "Subsídios aos Postos Avançados"
 ISR_subsidize_outposts_desc: "Por que não subsidiar nossos amigos e irmãos na Cisjordânia? Eles precisam de nossa ajuda para construir uma economia agrícola sustentável. Não importa que terra estejam ocupando."
 ISR_settlements_subsidized_1: "Assentamentos Subsidiados - Um Novo Começo"
 ISR_settlements_subsidized_1_desc: "Nossos irmãos nos assentamentos precisam de algum dinheiro para ajudá-los a construir um novo pilar estável da economia israelense."
 ISR_settlements_subsidized_2: "Assentamentos Subsidiados - Pilar da Terra"
 ISR_settlements_subsidized_2_desc: "Nossos irmãos nos assentamentos estão ficando cada vez mais fortes, mas precisam de mais dinheiro para se expandir."
 ISR_economic_settlers: "Promover o Assentamento Econômico"
 ISR_economic_settlers_desc: "O custo de vida em nossas cidades já é alto demais; vamos incentivar as pessoas a morar em nossos assentamentos, onde podem criar suas famílias a baixo custo."
 ISR_protect_terrorists: "Denunciar Qualquer Compromisso"
 ISR_protect_terrorists_desc: "Por anos, alguns de nossos irmãos que participaram do hoje extinto partido Kach foram retratados como terroristas, mas na verdade são patriotas e não merecem ser presos. Merecem, em vez disso, um perdão."
 ISR_protect_ideological_core: "Os Pilares Ideológicos"
 ISR_protect_ideological_core_desc: "Exército, Bíblia e Terra: os pilares de nossa sociedade, todos fundamentais para preservar uma comunidade estável e sólida. Precisamos escolher, porém, quem priorizar em nossa agenda."
 ISR_denounce_mafdal: "Desacreditar os Mafdalniks Liberais"
 ISR_denounce_mafdal_desc: "O Mafdal, ou melhor, o Partido Nacional Religioso, era o partido representante da ideologia sionista religiosa em Israel. São brandos demais, porém, e não fortes o bastante para estabilizar nossa sociedade!"
 ISR_late_marriage: "Lidar com os Casamentos Tardios"
 ISR_late_marriage_desc: "As estatísticas mostram que 50% dos casais israelenses se casam depois dos 30 anos; precisamos promover casamentos precoces e incentivar a geração de novos pequenos israelenses o quanto antes."
 ISR_promote_early_marriage: "Promover o Casamento Precoce"
 ISR_promote_early_marriage_desc: "Em uma sociedade que envelhece rapidamente, é importante promover o nascimento de bebês o máximo possível por meio de casamentos jovens."
 ISR_civilian_oversight: "Supervisão da Administração Civil"
 ISR_civilian_oversight_desc: "É hora de instalar um governo civil na Cisjordânia, liderado por israelenses, obviamente."
 ISR_jewish_home_path: "O Lar Judaico"
 ISR_jewish_home_path_desc: "O Partido Nacional Religioso Sionismo Religioso, ou Mafdal Sionismo Religioso, é um partido político sionista religioso de direita em Israel. Em todas as eleições desde sua fundação em 1998, o partido se juntou a outras facções e concorreu como parte de uma lista unificada."
 ISR_get_five: "'Tire Cinco!'"
 ISR_get_five_desc: "Devemos promover o ensino de matemática nas escolas para estimular a mentalidade técnica e apoiar indiretamente nosso setor de TI."
 ISR_dont_apologize_desc: "Extrema direita não é um insulto! É um distintivo honroso que usamos e mostramos a todos. Que os opositores sintam inveja!"
 ISR_kaminitz_law: "Promulgar a Lei Kaminitz"
 ISR_kaminitz_law_desc: "A Lei Kaminitz dá às autoridades executivas o poder de aplicar penalidades, como ordens de demolição e de paralisação de obras, o confisco de equipamentos e veículos de construção e prisões, tudo isso sem recorrer ao sistema judicial."
 ISR_associations_law: "Assinar a Lei das Associações"
 ISR_associations_law_desc: "A lei das associações é o conjunto de leis e regras que governam diversas associações de membros ou sócios."
 ISR_conservative_judges: "A Revolução Lenta"
 ISR_conservative_judges_desc: "Devemos nomear pessoas conservadoras para diversos cargos governamentais a fim de conter a degeneração de nossa cultura política e social."
 ISR_nation_state: "O Projeto do Estado-Nação"
 ISR_nation_state_desc: "O projeto do Estado-Nação delineia uma série de papéis e responsabilidades aos quais Israel está vinculado para cumprir o propósito de servir como o Estado-nação dos judeus."
 ISR_bennet_rule: "A Ascensão de Bennett"
 ISR_bennet_rule_desc: "Naftali Bennett é um empreendedor israelense de alta tecnologia. Durante o serviço militar nas Forças de Defesa de Israel na década de 1990, Bennett serviu na Sayeret Matkal e na Maglan, unidades de comandos de elite que operam atrás das linhas inimigas. Em seguida, cursou direito na Universidade Hebraica de Jerusalém. Filho de imigrantes americanos em Israel, Bennett deixou Israel rumo a Nova York e cofundou uma empresa de software antifraude em 1999."
 ISR_promote_trickle_down: "Como nos Tempos de Reagan"
 ISR_promote_trickle_down_desc: "Devemos tomar o modelo conservador dos EUA como exemplo para nossa nova política. Exatamente como nos bons tempos de Reagan!"
 ISR_machette_bureaucracy: "O Facão do Governo"
 ISR_machette_bureaucracy_desc: "É hora de cortar o aparato estatal de ineficientes com nosso facão da justiça!"
 ISR_limit_the_labor: "Limitar a Histadrut"
 ISR_limit_the_labor_desc: "Os sindicatos não fazem nada de útil além de criar obstáculos para os trabalhadores. Sua influência sobre a economia deve ser limitada."
 ISR_tax_reductions: "Reduzir os Impostos dos Ricos"
 ISR_tax_reductions_desc: "Por que tributar os ricos? Isso só cria precedentes para que as pessoas não enriqueçam. Precisamos pôr fim a isso."
 ISR_crush_the_shelters: "Esmagar os Grupos de Abrigo"
 ISR_crush_the_shelters_desc: "Os lobistas se infiltraram em todos os aspectos de nossa vida política como parasitas. Isso precisa ser interrompido!"
 ISR_a_new_singapore: "Alcançar o Plano de Singapura"
 ISR_a_new_singapore_desc: "Devemos seguir o exemplo de Singapura e implementar um plano para fazer de Israel o melhor lugar do mundo para fazer negócios."
 ISR_shaked_rule: "Fortalecer Ayelet Shaked"
 ISR_shaked_rule_desc: "Ayelet Shaked é uma política, ativista e engenheira de software israelense. Apesar de sua passagem pelo Lar Judaico, um partido político religioso, ela se identifica como secularista. Antes de entrar na política, Shaked iniciou sua carreira na indústria israelense de alta tecnologia, trabalhando como engenheira na Texas Instruments logo após se formar na Universidade de Tel Aviv."
 ISR_trust_busting: "Como um Alce Bull Moose"
 ISR_trust_busting_desc: "Precisamos seguir o exemplo de Theodore Roosevelt e de seus programas e ideais políticos. É disso que Israel precisa."
 ISR_over_legislation: "Combater o Excesso de Legislação"
 ISR_over_legislation_desc: "Precisamos parar de inflar o legislativo a um tamanho desproporcional às suas funções."
 ISR_promote_national_service: "Promover o Serviço Nacional"
 ISR_promote_national_service_desc: "As mulheres ortodoxas não podem servir no exército, mas podemos oferecer a elas o serviço nacional no setor público."
 ISR_public_works: "Utilizar as Obras Públicas"
 ISR_public_works_desc: "É necessário criar condições para que as obras públicas se tornem permanentes e planejadas."
 ISR_israels_thatcher: "O Espírito Thatcher"
 ISR_israels_thatcher_desc: "Devemos seguir o pragmatismo britânico e reviver simbolicamente o espírito de Margaret Thatcher."
 ISR_russian_party_path: "Israel é o Nosso Lar"
 ISR_russian_party_path_desc: "O Yisrael Beiteinu é um partido político conservador de Israel. A base do partido era originalmente formada por imigrantes seculares falantes de russo, embora o apoio dessa parcela esteja em declínio."
 ISR_retirement_homes: "Financiar Asilos"
 ISR_retirement_homes_desc: "Devemos financiar asilos e garantir que nossa população idosa viva com conforto e paz."
 ISR_soviet_voters: "Apelar aos Eleitores Soviéticos"
 ISR_soviet_voters_desc: "Muitos judeus falantes de russo ainda estão fortemente ligados à cultura russa. Devemos apelar a eles com nossa propaganda e nossas políticas."
 ISR_russian_tv: "Canais de Televisão em Língua Russa"
 ISR_russian_tv_desc: "Muitos de nossos novos cidadãos que retornam da esfera pós-soviética não falam hebraico. Para ajudá-los a se integrar mais facilmente ao restante da população, devemos criar canais de TV em russo e permitir a transmissão de canais russos em Israel."
 ISR_five_mems: "Adotar os Cinco Mems"
 ISR_five_mems_desc: "Os Cinco M de Jabotinsky representam elementos-chave do sionismo revisionista: Macabeus (força militar), Massada (heroísmo), Mishkan (herança espiritual), Melukha (soberania política) e Moadim (unidade nacional por meio das tradições). Enfatizam a resiliência judaica, a autossuficiência e a condição de Estado."
 ISR_citizenship_law: "'Sem Lealdade, Sem Cidadania!'"
 ISR_citizenship_law_desc: "Os árabes devem prestar juramento de lealdade para viver em nosso país; é absolutamente necessário para garantir a plena lealdade dos elementos estrangeiros."
 ISR_empower_city_rabbis: "Fortalecer os Rabinos das Cidades"
 ISR_empower_city_rabbis_desc: "Devemos favorecer as autoridades religiosas das cidades, centralizando o consenso espiritual em torno dos reformistas."
 ISR_reform_conversions: "Reformar as Conversões ao Judaísmo"
 ISR_reform_conversions_desc: "Devemos permitir que os convertidos ao judaísmo se repatriem para Israel. Eles não são menos judeus do que nós."
 ISR_promote_aliyah: "O Mundo Judaico"
 ISR_promote_aliyah_desc: "Devemos promover o retorno de todos os judeus a Israel e incentivar a Aliá."
 ISR_national_secular_government: "Governo Nacional Secular"
 ISR_national_secular_government_desc: "Agora seremos um Estado plenamente nacional e secular."
 ISR_aliyah_encouraged: "Aliá Incentivada"
 ISR_new_hope_path: "Uma Nova Esperança"
 ISR_new_hope_path_desc: "No fim de 2020, Gideon Sa'ar formou o partido israelense de centro-direita Uma Nova Esperança, que prioriza a segurança nacional, a boa administração e a reforma judicial. Embora tenha tido dificuldade para se manter no poder, busca oferecer uma alternativa moderada ao Likud."
 ISR_gantz_tree: "Resiliência para Israel"
 ISR_gantz_tree_desc: "Benjamin Gantz é um político israelense e general reformado do exército. É pró-centro e tem posições políticas militaristas. O partido Resiliência foi formado no fim de 2018."
 ISR_radical_centrism_desc: "Não devemos mais nos concentrar em batalhas ideológicas e perseguir ideais. Devemos ser radicalmente centristas, priorizando a prática sobre a ideologia."
 ISR_general_politics: "Política do Grande General"
 ISR_general_politics_desc: "Gantz é um ex-general, e suas aspirações políticas e sua ordem são de fato ao estilo militar."
 ISR_above_all: "Israel Lifnei HaKol"
 ISR_above_all_desc: "Um princípio deve guiar nossas ações políticas: Israel acima de tudo!"
 ISR_increase_army_pay: "Nossos Filhos e Filhas"
 ISR_increase_army_pay_desc: "Devemos aumentar nossos gastos militares e garantir que os filhos e filhas de Israel recebam tudo de que precisam."
 ISR_increase_pensions: "Aumentar as Pensões dos Cidadãos"
 ISR_increase_pensions_desc: "Devemos aumentar as pensões dos nossos cidadãos aposentados. Eles devem receber o que merecem."
 ISR_attorney_general: "Dividir o Gabinete do Procurador"
 ISR_attorney_general_desc: "Devemos separar os cargos de Procurador-Geral e de Promotor-Chefe."
 ISR_regulate_ottoman_agencies: "Regular as Agências Otomanas"
 ISR_regulate_ottoman_agencies_desc: "Devemos regular as agências otomanas, pois elas são ineficientes em seu estado atual."
 ISR_the_begin_project: "O Início do Projeto"
 ISR_the_begin_project_desc: "Apesar de estarmos ideologicamente alinhados ao Likud, não apoiamos os esquemas de corrupção desse partido."
 ISR_shasha_biton: "O Plano Shasha-Biton"
 ISR_shasha_biton_desc: "Devemos melhorar a educação para as classes baixa e média, a fim de garantir educação plena em nosso país."
 ISR_social_cabinet: "Um Gabinete Socioeconômico"
 ISR_social_cabinet_desc: "Nosso novo gabinete deve se concentrar precisamente nas questões econômicas."
 ISR_national_unity: "Campo da Unidade Nacional"
 ISR_national_unity_desc: "Nossa nova coalizão deve seguir uma agenda de direita e construir um Israel forte e resiliente!"
 ISR_bluewhite: "A Coalizão Azul e Branco foi formada!"
 ISR_blue_white: "Azul e Branco"
 ISR_blue_white_desc: "Nossa nova coalizão deve buscar a igualdade e a estabilidade como nossos novos valores centrais, que construirão um novo Israel."
 ISR_limit_terms: "Instituir Limite de Mandatos"
 ISR_limit_terms_desc: "Devemos mudar as leis eleitorais para garantir a continuidade do processo democrático."
 ISR_empower_regional_governments: "Fortalecer os Governos Regionais"
 ISR_empower_regional_governments_desc: "Devemos fortalecer os governos regionais, dando-lhes mais poder real para se governarem."
 ISR_reform_electoral_system: "Reformar o Sistema Eleitoral"
 ISR_reform_electoral_system_desc: "Devemos abandonar a representação proporcional e adotar a representação por distritos."
 ISR_olmert_focus: "Uma Nova Era Política"
 ISR_olmert_focus_desc: "Ehud Olmert é um político e advogado israelense. Seu partido, o Kadima, é um partido político centrista e liberal de Israel."
 ISR_mofaz: "Implementar as Políticas de Mofaz"
 ISR_mofaz_desc: "Shaul Mofaz é um oficial militar reformado e político israelense. Ingressou nas Forças de Defesa de Israel em 1966 e serviu na Brigada de Paraquedistas. Lutou na Guerra dos Seis Dias, na Guerra do Yom Kippur, na Guerra do Líbano de 1982 e na Operação Entebbe com os paraquedistas e o Sayeret Matkal, uma unidade de forças especiais de elite. Em 1998, tornou-se o décimo sexto Chefe do Estado-Maior das IDF."
 ISR_livni: "Implementar as Políticas de Livni"
 ISR_livni_desc: "Tziporah Malka Livni é uma política, diplomata e advogada israelense. É conhecida por alguns por seus esforços para resolver o conflito israelense-palestino."
 ISR_nationalcamp: "O Campo Nacional foi formado!"
 ISR_continue_to_change: "Continuamos a Mudar!"
 ISR_continue_to_change_desc: "As mudanças são inevitáveis, e devemos dominar o progresso que nos leva adiante!"
 ISR_merav_cohen_plan: "O Cuidado de Cohen com os Idosos"
 ISR_merav_cohen_plan_desc: "Cohen tem um plano específico para reformar o apoio social. O plano precisa ser realizado."
 ISR_lapid_histadrut: "Segurar o País pela Garganta"
 ISR_lapid_histadrut_desc: "Devemos reformar rapidamente a assistência social e aumentar o apoio que damos à população."
 ISR_ministry_of_social_development: "Ministério do Desenvolvimento Social"
 ISR_ministry_of_social_development_desc: "Devemos criar um novo ministério do desenvolvimento social e apoiá-lo o máximo possível."
 ISR_holocaust_survivors: "Saúde Gratuita para os Sobreviventes"
 ISR_holocaust_survivors_desc: "Devemos tratar os sobreviventes do Holocausto com respeito e oferecer-lhes atendimento médico gratuito."
 ISR_disabled_people: "Apoiar as Pessoas com Deficiência"
 ISR_disabled_people_desc: "Devemos apoiar as pessoas com deficiência de nossa sociedade e aumentar o orçamento que destinamos a elas."
 ISR_take_money_from_settlements: "Redirecionar Verbas dos Assentamentos"
 ISR_take_money_from_settlements_desc: "Os assentamentos sugam nosso orçamento até a última gota! Finalmente devemos tomar esse dinheiro de volta!"
 ISR_take_money_from_yeshivas: "Redirecionar Verbas das Yeshivas"
 ISR_take_money_from_yeshivas_desc: "As yeshivas estão devorando nosso orçamento, devemos tomar o dinheiro de volta!"
 ISR_where_is_the_money: "'Onde Está o Dinheiro?'"
 ISR_where_is_the_money_desc: "Devemos investigar para onde vai o dinheiro dos nossos contribuintes. Nosso orçamento não é eterno!"
 ISR_yesh_atid_focus: "Há um Futuro"
 ISR_yesh_atid_focus_desc: "O Yesh Atid é um partido político sionista liberal e centrista de Israel. Foi fundado em abril de 2012 pelo jornalista de TV Yair Lapid, filho do ex-político do partido Shinui e Ministro da Justiça de Israel Tommy Lapid."
 ISR_middle_class: "A Guerra da Classe Média"
 ISR_middle_class_desc: "Devemos esgotar nossas capacidades políticas para apoiar plenamente a classe média. Essas pessoas são a razão de governarmos!"
 ISR_public_residence: "Patrocinar Moradias Públicas"
 ISR_public_residence_desc: "As moradias públicas são o milagre que devemos usar para resolver o problema habitacional do nosso país."
 ISR_zero_vat: "Efes Ma'am"
 ISR_zero_vat_desc: "O Imposto sobre Valor Agregado não deve mais existir. Ele prejudica os negócios e aumenta os custos para os consumidores."
 ISR_lapid_eu: "Ampliar o Acordo de Livre Comércio"
 ISR_lapid_eu_desc: "Devemos apoiar o comércio e a amizade com a União Europeia!"
 ISR_came_to_change: "Viemos para Mudar"
 ISR_came_to_change_desc: "Viemos para combater a corrupção e limpar o país desses problemas."
 ISR_non_portfolio: "Expulsar os Ministros sem Pasta"
 ISR_eighteen_ministers: "Apenas Dezoito Ministros"
 ISR_eighteen_ministers_desc: "Devemos ter apenas dezoito ministros em nosso governo."
 ISR_corruption_war: "Viemos, Vimos, Lutamos"
 ISR_corruption_war_desc: "Nossa luta contra a corrupção deve ser sistêmica e profundamente enraizada na metodologia do nosso partido."
 ISR_negotiate_syria: "Negociar com a Síria?"
 ISR_negotiate_syria_desc: "Talvez possamos convencer o governo sírio a reconsiderar sua relação conosco."
 ISR_labour_path: "O Partido Trabalhista Israelense"
 ISR_labour_path_desc: "O Partido Trabalhista Israelense, comumente conhecido como HaAvoda, é um partido político social-democrata de Israel. Um partido da tradição sionista trabalhista que apoia o Estado de bem-estar social e os vínculos com os sindicatos, o Partido Trabalhista foi associado ao apoio ao processo de paz israelense-palestino, a políticas externas pragmáticas e a políticas econômicas social-democratas."
 ISR_haifa_model: "O Modelo de Haifa"
 ISR_haifa_model_desc: "Devemos adotar o modelo de Haifa como farol de sabedoria para nossas decisões econômicas."
 ISR_education_relief_plan: "Plano de Alívio da Educação"
 ISR_education_relief_plan_desc: "Devemos tomar algumas medidas de alívio antes de iniciar as reformas da educação."
 ISR_smaller_classes: "Turmas Menores"
 ISR_smaller_classes_desc: "Dados científicos mostram que, quanto menores as turmas, mais eficazmente as crianças aprendem. Devemos implementar isso."
 ISR_israel_green_deal: "O Acordo Verde Israelense"
 ISR_israel_green_deal_desc: "A sustentabilidade ecológica é a única forma de avançarmos em nossas políticas energéticas. A ecologia é a garantia do nosso futuro."
 ISR_social_protests: "'O Povo Exige Justiça Social!'"
 ISR_social_protests_desc: "Agora devemos decidir o que fazer com um dos movimentos sociais mais populares do nosso país."
 ISR_raise_minimum_wage: "Aumentar o Salário Mínimo"
 ISR_raise_minimum_wage_desc: "Devemos aumentar o salário mínimo para impedir a enxurrada de mão de obra barata e manter os padrões de vida."
 ISR_public_transport: "Favorecer o Transporte Público"
 ISR_public_transport_desc: "O clero pode reclamar o quanto quiser, mas devemos garantir transporte público no shabat e integrar à força os ortodoxos à nossa sociedade."
 ISR_raise_tax_on_wealthy: "Aumentar os Impostos dos Ricos"
 ISR_raise_tax_on_wealthy_desc: "Os ricos são ricos demais! Devemos usar o dinheiro deles de maneiras mais úteis."
 ISR_digital_education: "Promover a Educação Digital"
 ISR_digital_education_desc: "A educação também deve ser digitalizada. As crianças merecem o melhor do melhor!"
 ISR_deliver_computers: "Um Governo Digital"
 ISR_deliver_computers_desc: "Devemos digitalizar nosso governo o máximo possível para aumentar a eficiência do aparato administrativo."
 ISR_recover_public_services: "Recuperar o Serviço Público"
 ISR_recover_public_services_desc: "Devemos recuperar o setor de serviços públicos e devolvê-lo aos dias de sua antiga glória."
 ISR_regulate_finance: "Regular o Sistema Financeiro"
 ISR_regulate_finance_desc: "Devemos regular o sistema financeiro para garantir a igualdade em nossa sociedade."
 ISR_agricultural_protection_act: "Lei de Proteção Agrícola"
 ISR_agricultural_protection_act_desc: "Devemos proteger nosso setor agrícola, pois é um dos segmentos mais importantes mantidos pelos kibutzim e colonos."
 ISR_agricultural_sector: "Apoiar-se nos Sindicatos Rurais"
 ISR_agricultural_sector_desc: "Devemos apoiar a criação de sindicatos de agricultores e expandir nosso setor agrícola."
 ISR_labour_unions_focus: "Fortalecer a Histadrut"
 ISR_labour_unions_focus_desc: "Devemos decidir o que faremos com os sindicatos trabalhistas e finalmente determinar sua posição em nosso Estado."
 ISR_amend_protection_act: "Emendar a Lei de Proteção ao Investimento"
 ISR_amend_protection_act_desc: "Devemos emendar a lei de proteção ao investimento e agir de acordo em nossas políticas econômicas."
 ISR_subsidize_businesses: "Subsidiar Negócios Independentes"
 ISR_subsidize_businesses_desc: "Os negócios independentes devem ser apoiados por nós, para garantir o equilíbrio econômico."
 ISR_youth_movements: "Os Movimentos Juvenis"
 ISR_youth_movements_desc: "Devemos apoiar os Tzofim em nosso país, pois são a única garantia segura de uma juventude de mesma mentalidade no futuro."
 ISR_competition_directory: "Diretoria Nacional de Concorrência"
 ISR_competition_directory_desc: "Devemos criar uma diretoria nacional de concorrência, que lutará contra a monopolização da nossa economia."
 ISR_sponsored_products: "Ampliar o Patrocínio de Produtos"
 ISR_sponsored_products_desc: "Devemos ampliar o patrocínio de diversos produtos que já fazemos."
 ISR_forgot_to_be_jews: "Reconhecer o Que Esquecemos"
 ISR_forgot_to_be_jews_desc: "Avraham Gabbay é um empresário e político israelense. Foi CEO da empresa de telecomunicações Bezeq e depois entrou na política."
 ISR_bring_the_lost_voters: "Tentar Trazê-los de Volta"
 ISR_bring_the_lost_voters_desc: "Amir Peretz é um político israelense que serviu como membro do Knesset pelo Partido Trabalhista. Membro do Knesset quase continuamente desde 1988, ocupou diversos cargos dentro do governo."
 ISR_zionist_union: "A União Sionista"
 ISR_zionist_union_desc: "Isaac Bougie Herzog é um político israelense. Filho do ex-presidente israelense Chaim Herzog, é advogado de profissão e foi Secretário do Governo de 1999 a 2001."
 ISR_regret_our_past_sephardics: "O Grande Arrependimento"
 ISR_regret_our_past_sephardics_desc: "Devemos nos arrepender do nosso passado e nos esforçar mais para integrar os sefarditas."
 ISR_constitution: "Redigir a Constituição Israelense"
 ISR_basic_law_amendment: "Nova Constituição"
 ISR_basic_law_amendment_desc: "Finalmente, podemos redigir nossa nova constituição!"
 ISR_public_transport_shabbat: "Transporte Público aos Sábados"
 ISR_public_transport_shabbat_desc: "Vamos finalmente encerrar a questão do transporte público nos feriados."
 ISR_matkal_women: "HaTovot LaKravi"
 ISR_matkal_women_desc: "Devemos permitir que as mulheres atuem não apenas nas forças armadas, mas também em funções de combate."
 ISR_millet_system: "Abandonar o Sistema Millet"
 ISR_millet_system_desc: "O clero influencia nosso país há tempo demais, chegou a hora de pôr fim a isso."
 ISR_lgbt_marriage: "Legalizar o Casamento LGBT"
 ISR_lgbt_marriage_desc: "Devemos legalizar os casamentos LGBT e incentivar a aceitação LGBT."
 ISR_redraft_conscription_law: "Reescrever a Lei Tal"
 ISR_redraft_conscription_law_desc: "Agora devemos começar a recrutar os ultraortodoxos para o Tzahal."
 ISR_stop_yeshiva_money: "Cortar o Financiamento das Yeshivas"
 ISR_stop_yeshiva_money_desc: "Chega de dinheiro para os ultraortodoxos! São como parasitas no corpo da sociedade que paga impostos!"
 ISR_accept_kotel_protocols: "Reconhecer as Mulheres do Kotel"
 ISR_accept_kotel_protocols_desc: "Reconhecer o movimento das Mulheres do Kotel não é apenas uma decisão ideológica, mas também racional. Abaixo o dogmatismo!"
 ISR_recognize_reformist_conversions: "Reconhecer as Conversões Reformistas"
 ISR_recognize_reformist_conversions_desc: "Devemos reconhecer a conversão reformista e permitir que judeus de todo o mundo se repatriem para Israel."
 ISR_meretz: "O Partido Meretz"
 ISR_meretz_desc: "O Meretz é um partido de esquerda, social-democrata, secularista e sionista trabalhista. Enfatiza a solução de dois Estados para resolver o conflito israelense-palestino, promove a justiça social e os direitos humanos, a liberdade religiosa e dá atenção especial ao ambientalismo."
 ISR_jewish_arab_partnership: "Parcerias Judaico-Palestinas"
 ISR_jewish_arab_partnership_desc: "Como primeiro passo rumo à cooperação e, com sorte, à paz, assinaremos um acordo comercial com nossos vizinhos para facilitar a troca de mercadorias. Ambas as nossas economias se beneficiarão disso."
 ISR_affirmative_action: "Apoiar Ações Afirmativas"
 ISR_affirmative_action_desc: "Como um passo além rumo à coabitação, apoiaremos a prosperidade da economia de nossos vizinhos, investindo algum dinheiro nela. Temos certeza de que eles apreciarão, e a estabilidade da região aumentará."
 ISR_meretz_green: "Novo Acordo Verde"
 ISR_meretz_green_desc: "Nossa Terra está sofrendo, nosso planeta precisa de uma abordagem mais respeitosa. Precisamos nos afastar dos combustíveis fósseis e buscar neutralizar nossas emissões de carbono e, para isso, investiremos fortemente em energia renovável. Custará algum dinheiro, mas é a coisa certa a fazer."
 ISR_ideological_feminism: "Feminismo Ideológico"
 ISR_ideological_feminism_desc: "Afirmamos nossa ideologia de que as mulheres devem ter direitos iguais em nossa sociedade!"
 ISR_fight_gender_discrimination: "Combater a Violência Doméstica"
 ISR_fight_gender_discrimination_desc: "É hora de tomar medidas corretivas contra a discriminação de gênero e a violência doméstica; nossa sociedade não pode mais tolerá-las. Assim, reformaremos o serviço militar e introduziremos a licença-paternidade."
 ISR_kibbutz_meretz: "Promover o Movimento dos Kibutzim"
 ISR_kibbutz_meretz_desc: "Os Kibutzim são um alicerce do Estado de Israel e um exemplo incrível de sociedade comunitária, na qual as pessoas cooperam para alcançar um objetivo comum e compartilham suas vidas. Vamos promovê-los e facilitá-los com alguns investimentos."
 ISR_western_world: "Parte da Civilização Europeia"
 ISR_western_world_desc: "Somos parte da civilização europeia e devemos agir de acordo!"
 meretz_affirmative: "Parceria Israelense-Palestina"
 ISR_raam_party: "A Lista Árabe Unida"
 ISR_raam_party_desc: "A Lista Árabe Unida, comumente conhecida pela sigla hebraica Ra'am, é um partido político árabe de Israel e o braço político da Ala Sul do movimento islâmico."
 ISR_shura_council: "Abbas e o Conselho Shura"
 ISR_shura_council_desc: "Devemos tentar resolver a disputa dentro do partido Raam. Isso também pode afetar a Palestina."
 ISR_bedouin_interests: "Interesses Beduínos"
 ISR_bedouin_interests_desc: "Os beduínos vivem no sul de Israel. Devemos desenvolver a região para satisfazer suas necessidades."
 ISR_recognize_illegal_outposts: "Reconhecer os Postos Avançados Ilegais"
 ISR_recognize_illegal_outposts_desc: "Devemos reconhecer os postos avançados ilegais e reduzir a pressão sobre a Palestina."
 ISR_family_values: "Valores Familiares 'Antigos e Bons'"
 ISR_family_values_desc: "Devemos apoiar os valores familiares muçulmanos e integrá-los à nossa política social."
 ISR_legalize_polygamy: "Legalizar a Poligamia"
 ISR_legalize_polygamy_desc: "Devemos legalizar a poligamia de acordo com as exigências do Partido Raam."
 ISR_conversion_therapies: "Terapeutas de Conversão Árabes"
 ISR_conversion_therapies_desc: "Devemos permitir terapeutas de conversão com as especificidades árabes..."
 ISR_legalized_plygamy: "Poligamia Legalizada"
 ISR_down_with_imperialism: "Abaixo os Imperialistas!"
 ISR_down_with_imperialism_desc: "Foi o imperialismo americano que provocou e perpetrou os conflitos religiosos em nossa terra. Devemos vingar o nosso sofrimento!"
 ISR_join_arab_league: "Ingressar na Liga Árabe"
 ISR_join_arab_league_desc: "Com uma população árabe tão grande em nosso país, devemos ingressar na Liga Árabe."
 ISR_befriend_china_isratine: "Aproximar-se da China"
 ISR_befriend_china_isratine_desc: "A China é um país internacionalista irmão. Devemos nos aproximar deles!"
 ISR_befriend_libya: "Lembrar a Profecia de Gaddafi"
 ISR_befriend_libya_desc: "Foi primeiro a profecia de Gaddafi que teve a visão de judeus e palestinos reunidos em amizade."
 ISR_identity_atheism: "Quebrar as Correntes da Religião"
 ISR_identity_atheism_desc: "Chega de religiosidade divisória! São essas diferenças que nos separaram."
 ISR_identity_religion: "Todos os Povos sob Deus"
 ISR_identity_religion_desc: "Não devemos rejeitar a religião como parte de nossa identidade, mas sim abraçar nossas diferenças."
 ISR_judean_legacy: "Um Legado Judaico Compartilhado"
 ISR_judean_legacy_desc: "Somos todos grandes herdeiros da Judeia, outrora separados pelo difícil destino que dividiu nossos povos. Precisamos voltar à era do Reino da Judeia."
 ISR_galilea_identity: "Lembrar a Era Galileia"
 ISR_galilea_identity_desc: "Devemos lembrar os tempos em que a bondade e o entendimento mútuo reinavam em nossa terra. O tempo em que palestinos e judeus existiam em harmonia e juntos."
 ISR_canaan_identity: "Voltar a Canaã"
 ISR_canaan_identity_desc: "Pois os cananeus e todos os habitantes da terra ouvirão isso, nos cercarão e eliminarão o nosso nome da terra. E o que farás pelo teu grande nome?"
 ISR_identity_question: "Criar uma Nova Identidade"
 ISR_identity_question_desc: "Para consolidar nosso novo Estado binacional, devemos criar uma nova identidade para o nosso povo..."
 ISR_binational_state: "Heveinu Shalom Aleichem"
 ISR_binational_state_desc: "Toda hostilidade deve acabar, e nossa luta insensata com a Palestina também. É hora de nos unirmos."
 ISR_return_refugees: "Revisar a Lei do Retorno"
 ISR_return_refugees_desc: "Agora, como somos um Estado binacional, tanto judeus quanto palestinos podem se repatriar para o nosso país."
 ISR_un_inspections: "Permitir Inspetores das Nações Unidas"
 ISR_un_inspections_desc: "Os inspetores das Nações Unidas devem ter acesso a todas as informações sobre nossas capacidades nucleares."
 ISR_abandon_nukes: "Um Ato de Boa Vontade"
 ISR_keep_nukes: "Acalmar Seus Temores"
 ISR_befriend_south_africa: "Nosso Legado Compartilhado"
 ISR_befriend_south_africa_desc: "Devemos nos aproximar da África do Sul após tantos anos de animosidade."
 ISR_federalism: "Federalizar a Terra Santa"
 ISR_federalism_desc: "Devemos federalizar Isratina para evitar novas divisões etnopolíticas."
 ISR_palestinian_army: "Integrar as Forças de Segurança"
 ISR_palestinian_army_desc: "Devemos integrar as forças de segurança e criar novas unidades conjuntas árabe-judaicas."
 ISR_milk_and_honey: "Terra de Leite e Mel"
 ISR_milk_and_honey_desc: "Devemos ser uma terra de prosperidade e felicidade."
 ISR_judean_identity: "Identidade Judaica"
 ISR_canaans_identity: "Identidade de Moloch"
 ISR_galil_identity: "Identidade Galileia"
 religious_divide: "Divisão Religiosa"
 ISR_idea_isratine_federalism: "Federalismo da Terra Santa"
 ISR_discover_gas: "A Maior Descoberta"
 ISR_discover_gas_desc: "Descobrimos que as águas próximas estão repletas de gás que podemos extrair. Para iniciar a primeira fase, precisamos construir bases navais em nossa costa."
 ISR_tamar: "Perfurar Tamar"
 ISR_tamar_desc: "Devemos perfurar a costa próxima a Tel Aviv para extrair gás do mar."
 ISR_leviathan: "Perfurar Leviatã"
 ISR_leviathan_desc: "A Galileia também é rica em gás natural subterrâneo. Vamos extraí-lo."
 ISR_dolphin: "Perfurar Dolphin"
 ISR_dolphin_desc: "A costa do Negev também é rica em gás natural. Precisamos extraí-lo também."
 ISR_prefer_turkey: "Reacender as Relações com a Turquia"
 ISR_prefer_turkey_desc: "Devemos cooperar com a Turquia e construir relações com eles."
 ISR_prefer_greece: "Formar uma Aliança Helênica"
 ISR_prefer_greece_desc: "Devemos cooperar com a Grécia em nossos futuros projetos de gasodutos e em outros assuntos comerciais e políticos."
 ISR_blue_flag: "Exercício Bandeira Azul"
 ISR_blue_flag_desc: "Devemos oferecer cooperação militar à Grécia, nossa principal parceira no Mediterrâneo."
 ISR_east_med_pipeline: "O Projeto East-Med"
 ISR_east_med_pipeline_desc: "Nossas relações com Chipre e Grécia os tornam a escolha natural para cooperarmos na construção do nosso gasoduto."
 ISR_visit_greece: "Adido Militar na Grécia"
 ISR_visit_greece_desc: "Precisamos garantir a independência e a soberania da Grécia, pois é do nosso interesse direto."
 ISR_claim_aphrodite: "Reivindicar o Campo de Afrodite"
 ISR_claim_aphrodite_desc: "Para afirmar nossas reivindicações sobre o campo de Afrodite, precisamos apoiar o Chipre do Norte."
 ISR_support_blue_homeland: "Reconhecer a Pátria Azul"
 ISR_support_blue_homeland_desc: "Podemos tentar oferecer à Turquia cooperação militar conosco e iniciar exercícios conjuntos."
 ISR_israel_turkey_pipeline: "Gasoduto Israel-Turquia"
 ISR_israel_turkey_pipeline_desc: "Devemos construir nosso gasoduto com a Turquia, pois eles provaram ser um bom aliado nosso."
 ISR_karish: "Iniciar a Perfuração de Karish"
 ISR_karish_desc: "Podemos tentar iniciar a perfuração de gás na região de Karish. No entanto, isso pode irritar seriamente o Hezbollah. Porém, se a força do nosso exército for alta, eles podem aceitar um acordo temporário..."
 ISR_madan: "A Diretoria de Inteligência"
 ISR_madan_desc: "A Divisão de Inteligência Naval de Israel é uma unidade de estado-maior no quartel-general da marinha israelense. Como outros órgãos de inteligência das IDF, está profissionalmente subordinada à Diretoria de Inteligência."
 ISR_tech_superiority: "Manter Nossa Vantagem"
 ISR_tech_superiority_desc: "Não devemos depender apenas do fornecimento estrangeiro de navios e submarinos, mas aumentar nossa própria pesquisa e produção."
 ISR_bibi_submarine_deal: "Conduzir Negócios Obscuros"
 ISR_bibi_submarine_deal_desc: "Não devemos ouvir o establishment, que é altamente cético quanto a outro contrato igual com os alemães. Devemos fingir a aprovação do acordo e seguir adiante com ele."
 ISR_dakar: "Preparar o Dakar"
 ISR_dolphin_1: "A Classe Dolphin-II"
 ISR_dolphin_1_desc: "Devemos estudar os submarinos e ampliar nossas possibilidades tecnológicas na produção de submarinos."
 ISR_thyssenkrupp_deal: "Acordo com a Thyssenkrupp"
 ISR_thyssenkrupp_deal_desc: "Vamos comprar 5 submarinos alemães mais antigos para garantir nossa proteção até podermos projetar e construir novos."
 ISR_ships_dvora: "O Dvora"
 ISR_ships_dvora_desc: "O Dvora é uma classe de lanchas de patrulha rápidas construída pela Israel Aerospace Industries para o Corpo Marítimo de Israel, baseada na classe israelense Dabur."
 ISR_ships_bat_yam: "O Ashdod"
 ISR_ships_bat_yam_desc: "Devemos construir estaleiros em Ashdod, para que nossa frota militar e mercante possa ser construída e reparada ali."
 ISR_ships_saar: "Modernizar o Sa'ar"
 ISR_ships_saar_desc: "Devemos modernizar os estaleiros do Sa'ar para que nossos navios sejam reparados ali com mais eficácia."
 ISR_middle_east_peace: "Os Sonhos de Isaías"
 ISR_middle_east_peace_desc: "Agora, concentraremos toda a nossa visão em estabelecer laços mais estreitos com países amigos do Oriente Médio."
 ISR_enemy_of_my_enemy: "Novos Inimigos Compartilhados"
 ISR_enemy_of_my_enemy_desc: "Considerando a nova configuração da situação geopolítica no Oriente Médio, talvez devamos iniciar um novo processo de melhoria das relações com a Arábia Saudita."
 ISR_travel_morocco: "Visitar Mohammed VI"
 ISR_travel_morocco_desc: "O Marrocos é um dos poucos países árabes que têm relações razoavelmente boas conosco. Devemos elevar essas relações a uma verdadeira amizade!"
 ISR_gulf_offices: "Abrir Escritórios no Golfo"
 ISR_gulf_offices_desc: "Para expandir nossa influência nos países do golfo, precisamos reabrir nossos escritórios governamentais nesses países."
 ISR_apologize_past_actions: "Pedir Desculpas pelos Incidentes"
 ISR_apologize_past_actions_desc: "Anteriormente, por pura necessidade, usamos nossos agentes do Mossad no território de alguns países do Golfo para conter influências indesejadas. Agora, precisamos reparar as relações com esses países e pedir desculpas por nossas ações."
 ISR_abraham_accords_focus: "Os Acordos de Abraão"
 ISR_abraham_accords_focus_desc: "Devemos iniciar um novo encontro diplomático no qual tentaremos quebrar o gelo entre diversos países árabes e Israel."
 ISR_negev_forum_focus: "O Fórum do Negev"
 ISR_negev_forum_focus_desc: "Para aumentar a segurança regional e a cooperação regional, podemos criar um novo fórum para a participação de nossos parceiros do Oriente Médio."
 ISR_cultural_ties: "Reafirmar os Laços Culturais"
 ISR_cultural_ties_desc: "A diáspora judaica no Marrocos ainda é bastante grande e tem influência significativa na economia marroquina. Talvez devamos usar isso."
 ISR_visa_indirect_travel: "Viagens Indiretas sem Visto"
 ISR_visa_indirect_travel_desc: "Para facilitar as viagens de nossos cidadãos entre Marrocos e Israel, podemos tentar negociar uma solução de viagem indireta sem visto."
 ISR_denounce_polisario_iran: "Denunciar a Maior Ligação"
 ISR_denounce_polisario_iran_desc: "Devemos apoiar o Marrocos em sua luta contra os separatistas e terroristas do Polisario."
 ISR_restore_security_links: "Restaurar as Conexões de Segurança"
 ISR_restore_security_links_desc: "Devemos apoiar o Marrocos também na esfera da inteligência, pois podemos realmente nos beneficiar disso em um formato em que ambos ganham."
 ISR_usa_mor_isr_deal: "Um Acordo Tripartite?"
 ISR_usa_mor_isr_deal_desc: "Para apoiar nossos parceiros marroquinos em nossos esforços de normalização das relações, podemos pedir aos EUA que apoiem nossos esforços diplomáticos."
 ISR_return_to_africa: "Retorno à África"
 ISR_return_to_africa_desc: "Devemos continuar expandindo nossa influência na África, pois muitos dos nossos aliados mais fortes vêm desse continente."
 ISR_invest_in_eac: "Viajar à África Oriental"
 ISR_invest_in_eac_desc: "Devemos nos aproximar dos Estados da África Oriental e aumentar nossa influência sobre eles."
 ISR_eritrean_bases: "Bases na Eritreia"
 ISR_eritrean_bases_desc: "Talvez possamos tentar negociar cooperação militar com a Eritreia, que pode beneficiar ambos."
 ISR_kampala_meeting: "Uma Reunião em Kampala"
 ISR_kampala_meeting_desc: "Quase meio século se passou desde que forças especiais israelenses invadiram o aeroporto internacional de Kampala para libertar os reféns de um avião sequestrado como parte da Operação Entebbe, e hoje o Primeiro-Ministro israelense [ISR.GetLeader] aterrissou em Uganda em um avião da El Al. Embora a normalização das relações entre Israel e os membros da Comunidade da África Oriental já tenha começado na década de 199s, as relações não voltaram à era de ouro de que os formuladores de políticas de Jerusalém desfrutavam no continente antes da Guerra do Yom Kippur. Sob [ISR.GetLeader], porém, Israel planeja seu 'Retorno à África' usando tecnologia israelense, em particular tecnologias de dessalinização e de água, para abrir as portas do continente africano. Segundo [ISR.GetLeader], a África Oriental é a porta pela qual Israel entra no continente, e ele deseja expandir muito os laços econômicos, políticos e diplomáticos com os Estados da África Oriental, bem como com toda a África Subsaariana."
 ISR_peace_sudan: "O Memorando de Washington"
 ISR_peace_sudan_desc: "Talvez possamos tentar normalizar as relações com o Sudão aumentando nossos laços econômicos com eles."
 ISR_peace_chad: "Os Protocolos de N'Djamena"
 ISR_peace_chad_desc: "Considerando a situação atual no Chade, talvez possamos nos beneficiar dela oferecendo-lhes um pacote de armamentos e a normalização das relações."
 ISR_peace_sahel: "Aproximar-se do Sahel"
 ISR_peace_sahel_desc: "Agora, podemos tentar nos aproximar dos Estados do Sahel aumentando nossa cooperação mútua e, talvez, investindo neles."
 ISR_visit_oman: "Viajar a Omã"
 ISR_visit_oman_desc: "Omã é um dos poucos possíveis aliados nossos no Oriente Médio. Devemos cultivar boas relações com eles."
 ISR_covert_ties: "Construir Laços Secretos"
 ISR_covert_ties_desc: "Devemos construir laços secretos com nossos aliados no golfo. Os agentes do Mossad devem estar prontos, caso eles concordem."
 ISR_yemen_intervene: "Vigiar os Estreitos"
 ISR_yemen_intervene_desc: "Mesmo que o Iêmen não possa ser considerado um de nossos amigos mais próximos, apoiá-los contra os representantes iranianos é mais racional do que deixar tudo correr por conta própria."
 ISR_yemen_war: "Operação Coroa de Sabá"
 ISR_yemen_war_desc: "Chegou a hora de intervirmos na guerra civil iemenita e acabarmos com a ameaça houthi!"
 ISR_mossad_diplomacy: "Diplomacia do Mossad"
 ISR_mossad_diplomacy_desc: "Podemos usar o Mossad para conduzir uma gama mais ampla de ações diplomáticas no Oriente Médio, especialmente quando nossos parceiros não forem contra."
 ISR_bahrain_economic_conference: "Conferência Econômica de Manama"
 ISR_bahrain_economic_conference_desc: "Podemos tentar fechar um acordo com os países do golfo quando ocorrer uma nova conferência econômica em Manama. Isso pode beneficiar tanto nossos parceiros do golfo quanto a nós."
 ISR_visit_saudi: "Viajar à Arábia Saudita"
 ISR_visit_saudi_desc: "Para criar um escudo final contra nosso maior inimigo, devemos visitar secretamente a Arábia Saudita e estabelecer laços de cooperação militar."
 ISR_treaty_saudi: "Alcançar a Maçã Dourada"
 ISR_treaty_saudi_desc: "Podemos tentar finalmente negociar com a Arábia Saudita e, quem sabe, estabelecer a paz plena entre nossos países."
 ISR_position_of_strength: "A Partir de uma Posição de Força"
 ISR_position_of_strength_desc: "Por que nos preocupar com laços de aliança e responsabilidades, se podemos tentar aumentar nossa segurança estabelecendo envolvimento indireto e acordos seletivos."
 ISR_new_middle_east: "Um Novo Oriente Médio"
 ISR_new_middle_east_desc: "Finalmente, após todos os nossos esforços diplomáticos, um novo Oriente Médio deve ser moldado!"
 ISR_exhibitions_dubai: "Visitar as Exposições em Dubai"
 ISR_exhibitions_dubai_desc: "Para afirmar nossa posição no comércio do golfo e global, podemos precisar representar nossas empresas nas recentes feiras de negócios e tecnologia de Dubai."
 ISR_uae_invest: "Parcerias Emirados-Israel"
 ISR_uae_invest_desc: "Considerando o estado atual da economia crescente dos Emirados, para aumentar nossa cooperação com eles, podemos precisar pedir investimentos."
 ISR_visit_japan: "Em Busca do Sol Nascente"
 ISR_visit_japan_desc: "O Japão é o sol nascente do sucesso econômico no Extremo Oriente. Estabelecer boas relações com eles é necessário para nós."
 ISR_visit_vietnam: "Abrir-se ao Vietnã"
 ISR_visit_vietnam_desc: "O setor agrícola da economia do Vietnã está crescendo rapidamente. Podemos usar isso para benefício mútuo."
 ISR_deal_with_neighbors: "Estender um Ramo de Oliveira"
 ISR_deal_with_neighbors_desc: "Agora, devemos iniciar nossas ações diplomáticas em direção ao Egito e à Jordânia."
 ISR_deal_with_jordan: "Além do Rio Yarden"
 ISR_deal_with_jordan_desc: "Devemos agora iniciar nossas relações diplomáticas com a Jordânia e decidir como administraremos nossas relações mútuas."
 ISR_jordan_defensive: "Guardar Nosso Flanco Oriental"
 ISR_jordan_defensive_desc: "Devemos apoiar nossos parceiros jordanianos e cooperar com eles na esfera militar."
 ISR_jordan_offensive: "Nem Mentir nem Perdoar"
 ISR_jordan_offensive_desc: "A Jordânia precisa ser subjugada ao nosso governo. Os acontecimentos recentes a tornaram inadequada às nossas necessidades diplomáticas."
 ISR_jordan_military_bases: "Subornar os Militares"
 ISR_jordan_military_bases_desc: "Para minar a soberania jordaniana, devemos subornar seus generais para que passem para o nosso lado."
 ISR_manipulate_royal_family: "Manipular a Política Real"
 ISR_manipulate_royal_family_desc: "Na casa governante hachemita e entre seus apoiadores, há muitas pessoas contrárias à nossa influência. Devemos removê-las."
 ISR_puppet_jordan: "Intervir na Jordânia"
 ISR_puppet_jordan_desc: "Finalmente, todos os preparativos estão feitos. Agora podemos desferir o golpe final na Jordânia!"
 ISR_war_with_isis: "Operação Fortaleza dos Lobos"
 ISR_war_with_isis_desc: "Com a ameaça existencial dos inimigos salafistas às nossas portas, precisamos tomar uma ação preventiva e destruí-la!"
 ISR_black_september_legacy: "Legado do Setembro Negro"
 ISR_black_september_legacy_desc: "Devemos proteger a Jordânia a todo custo, pois ela é nosso flanco oriental, que nos protege dos inimigos."
 ISR_green_blue_deal: "O Acordo Verde-Azul"
 ISR_green_blue_deal_desc: "Devemos assinar um tratado tripartite com a Jordânia e os Emirados sobre novas possibilidades de energia verde."
 ISR_tourism_port_jordan: "Ligações Eilat-Aqaba"
 ISR_tourism_port_jordan_desc: "Devemos cooperar com as empresas privadas da Jordânia para expandir nossos portos do sul e estabelecer ligações Eilat-Aqaba."
 ISR_preserve_the_dead_sea: "Preservar o Mar Morto"
 ISR_preserve_the_dead_sea_desc: "Junto com a Jordânia, devemos tentar preservar o mar morto para nossos projetos futuros."
 ISR_open_degania_dam: "Construir a Represa de Degania"
 ISR_open_degania_dam_desc: "Embora isso possa irritar a Jordânia, devemos usar nossa água apenas para nós, construindo a represa de Degania."
 ISR_jordan_river_agreement: "Longe das Margens do Kinneret"
 ISR_jordan_river_agreement_desc: "Devemos adotar uma postura menos radical e tentar negociar um plano mais aceitável para nós e para a Jordânia."
 ISR_intelligence_sharing_jordan: "Reunião Mofaz-Malakhwi"
 ISR_intelligence_sharing_jordan_desc: "Devemos usar nossos agentes do Mossad na Jordânia para proteger o governo legítimo hachemita contra nossos inimigos comuns."
 ISR_iraq_war: "O Novo Nabucodonosor"
 ISR_iraq_war_desc: "O Iraque de Saddam é uma ameaça existencial tanto para nós quanto para a Jordânia. Devemos tomar medidas contra a influência iraquiana."
 ISR_expand_on_jordan_treaty: "Ampliar o Tratado de Arava"
 ISR_expand_on_jordan_treaty_desc: "Em 26 de outubro de 1994, Jordânia e Israel assinaram o tratado de paz em uma cerimônia realizada no vale de Arava, em Israel, ao norte de Eilat e perto da fronteira jordaniana. O Primeiro-Ministro Rabin e o Primeiro-Ministro Abdelsalam al-Majali assinaram o tratado, e o Presidente de Israel, Ezer Weizman, apertou a mão do Rei Hussein."
 ISR_mediate_nile_egypt: "Denunciar a Represa do Nilo"
 ISR_mediate_nile_egypt_desc: "Na disputa entre Egito e Etiópia, devemos adotar uma postura pró-egípcia."
 ISR_mediate_nile_ethiopia: "Postura Pró-Etiópia"
 ISR_mediate_nile_ethiopia_desc: "Na disputa entre Egito e Etiópia, devemos adotar uma postura pró-etíope."
 ISR_bring_back_falashmura: "Trazer de Volta os Falashmura"
 ISR_bring_back_falashmura_desc: "Devemos exigir o retorno de todos os judeus etíopes para casa, em Israel. Se a Etiópia discordar, adotaremos uma postura mais dura em nossas relações com eles."
 ISR_fallow_deer_diplomacy: "Diplomacia do Gamo"
 ISR_fallow_deer_diplomacy_desc: "Antigamente, o Xá do Irã os presenteou a Israel como gesto de amizade. Porém, desde então, esses cervos foram extintos no próprio Irã, mas os que foram presenteados a Israel sobreviveram."
 ISR_propaganda_in_iran: "Esforços de Boa Imagem"
 ISR_propaganda_in_iran_desc: "Devemos apoiar o governo amigo do Irã e, possivelmente, ganhar mais influência sobre ele."
 ISR_water_and_life: "Levar Água e Vida"
 ISR_water_and_life_desc: "O Irã há muito tempo tem problemas de irrigação e fornecimento de água. Podemos ajudá-los com isso em troca de algum dinheiro."
 ISR_direct_flights_to_iran: "Trazer de Volta a El Al"
 ISR_invest_iran: "Retorno ao Irã"
 ISR_invest_iran_desc: "Para aumentar nossa interdependência mútua, podemos tentar pedir investimentos ao Irã."
 ISR_eilat_ashkelon_route: "Oleoduto Eilat-Ashkelon"
 ISR_eilat_ashkelon_route_desc: "A Eilat Ashkelon Pipeline Company opera vários oleodutos de petróleo bruto e de derivados em Israel, principalmente o Oleoduto Eilat-Ashkelon, que transporta petróleo bruto pelo sul de Israel, entre o Mar Vermelho e o Mar Mediterrâneo. A EAPC também opera dois terminais marítimos de petróleo, além de depósitos de armazenamento de petróleo no país."
 ISR_transasiatic_oil: "Companhia de Petróleo Transasiática"
 ISR_transasiatic_oil_desc: "Agora, como nossas rotas comerciais estão abertas com o Irã, podemos investir no petróleo deles."
 ISR_gamliel_plan: "O Plano Gamliel"
 ISR_gamliel_plan_desc: "Devemos fomentar as relações comerciais entre nosso país e o Irã, para aprofundar a integração regional."
 ISR_iran_singapore_model: "Modelo Singapuriano"
 ISR_iran_singapore_model_desc: "Assim como treinamos o exército de Singapura no passado, agora devemos apoiar nossos amigos iranianos moldando o exército deles com nossa experiência."
 ISR_flower_ii_project: "Flor-Tsur II"
 ISR_flower_ii_project_desc: "Após estabelecer o tratado de parceria de cooperação militar, devemos iniciar um novo esforço de cooperação no desenvolvimento de mísseis."
 ISR_parash_partner: "Parceria PARASH"
 ISR_parash_partner_desc: "Como os nossos objetivos e os do Irã coincidem, podemos cooperar com o Irã na área de inteligência."
 ISR_military_liason_office: "A Missão Rosen-Grimberg"
 ISR_military_liason_office_desc: "Agora podemos estabelecer um centro de coordenação militar com o Irã para integrar nossa estratégia em uma ação coerente."
 ISR_treaty_of_susa: "Tratado de Susa"
 ISR_treaty_of_susa_desc: "Devemos exigir do Irã reparações para os israelenses iranianos que fugiram durante a revolução."
 ISR_india_to_kush: "De Hodu a Kush"
 ISR_india_to_kush_desc: "De Hodu a Kush, nosso cinturão de segurança deve ser plenamente estabelecido."
 ISR_intervention_afghanistan: "Olhar para o Afeganistão"
 ISR_intervention_afghanistan_desc: "Devemos impedir que o Talibã chegue ao poder, mesmo que nossas relações com o Afeganistão antes não fossem tão sólidas quanto poderiam ser."
 ISR_operation_silk_road: "Operação Rota da Seda"
 ISR_operation_silk_road_desc: "Para garantir a segurança de toda a região, devemos assegurar o Paquistão e torná-lo seguro."
 ISR_royal_road: "Restaurar a Estrada Real"
 ISR_royal_road_desc: "Devemos restaurar a antiga estrutura da política internacional e torná-la favorável a nós."
 ISR_royal_road_iraq: "Mirar a Babilônia"
 ISR_royal_road_iraq_desc: "O Iraque deve ser assegurado para que nosso grande projeto seja concluído."
 ISR_royal_road_syria: "Mirar Aram Damasco"
 ISR_royal_road_syria_desc: "Devemos neutralizar a ameaça síria o quanto antes."
 ISR_periphery_pact: "Restaurar o Pacto da Periferia"
 ISR_periphery_pact_desc: "Precisamos criar nossa própria aliança e estabelecer um novo pacto da periferia."
 ISR_cento_iran: "A Casa das Nações"
 ISR_cento_iran_desc: "Como o Irã reviveu recentemente o pacto CENTO, devemos aderir a ele pela segurança regional."
 ISR_operation_rolling_dice: "Operação Dados Rolando"
 ISR_jews_iran: "Restaurar a Kehilat Irã"
 ISR_eshter_tomb: "Restaurar o Túmulo de Mordecai"
 ISR_shared_enemies: "Nossos Inimigos em Comum"
 ISR_shared_enemies_desc: "Agora devemos começar a planejar nossas políticas em relação aos nossos inimigos no Oriente Médio."
 ISR_root_of_all_extremism: "Operação Ninho do Falcão"
 ISR_root_of_all_extremism_desc: "Chegou a hora de cortar a cabeça da serpente salafista de uma vez por todas!"
 ISR_deal_with_egypt: "Através do Deserto do Sinai"
 ISR_deal_with_egypt_desc: "Depois de todos os nossos problemas com o Egito, uma nova luz de esperança pela paz brilha para os nossos países."
 ISR_sinai_tourism: "Diplomacia da Lua de Mel"
 ISR_sinai_tourism_desc: "Considerando a economia crescente do Egito, a cooperação e os investimentos são boas oportunidades para nós."
 ISR_sharem_flight: "Voos Diretos para Sharm"
 ISR_sharem_flight_desc: "Devemos estabelecer viagens aéreas diretas de Israel a Sharm el Sheikh, dada a nossa parceria com o Egito e a alta demanda de turistas israelenses."
 ISR_azam_azam: "Solicitar um Gesto de Boa Vontade"
 ISR_azam_azam_desc: "Azam Azam é um druso israelense que foi capturado como espião pelo Egito na década de 1990. Talvez, como parte do processo de normalização das relações, possamos solicitar a libertação dele como um gesto de boa vontade."
 ISR_visit_south_korea: "Conhecer o Tigre do Sul"
 ISR_visit_south_korea_desc: "Outro tigre econômico asiático em ascensão é a República da Coreia. Precisamos fomentar boas relações econômicas entre os nossos países."
 ISR_sinai_investigation: "Solicitar Proteção em Taba"
 ISR_sinai_investigation_desc: "Taba é uma cidade do Egito próxima à nossa fronteira. Ela atrai muitos turistas israelenses, portanto devemos trabalhar para aumentar a segurança do nosso povo lá."
 ISR_assam_ibrahims_mission: "A Missão de Ahssam Ibrahim"
 ISR_assam_ibrahims_mission_desc: "Ahssam Ibrahim é o embaixador egípcio em Israel, sob cuja gestão as relações melhoraram significativamente em termos de colaboração militar e compartilhamento de inteligência."
 ISR_arish_ashkelon: "O Gasoduto Arish-Ashkelon"
 ISR_arish_ashkelon_desc: "Agora podemos tentar estabelecer laços econômicos muito mais fortes com o Egito construindo um novo gasoduto."
 ISR_war_qatar: "Operação Princesa das Pérolas"
 ISR_war_qatar_desc: "Os extremistas controlam Gaza com firmeza demais para abrir mão pacificamente. Chegou a hora de acabar com a raiz da Crise de Gaza... Devemos atacar aqueles que apoiam o Hamas do exterior e desarmá-los."
 ISR_invite_egypt_to_gas_project: "Convidar para os Projetos de Gasodutos"
 ISR_invite_egypt_to_gas_project_desc: "Precisamos convidar o Egito para os nossos projetos de gasodutos, que beneficiarão a ambos."
 ISR_egypt_anti_iran: "Postura Pró-Egito"
 ISR_egypt_anti_iran_desc: "O Egito provou ser um aliado ideológico e político mais confiável. Eles devem ficar com as ilhas Tiran."
 ISR_question_of_tiran: "Questionar o Acordo de Tiran"
 ISR_question_of_tiran_desc: "Devemos continuar apoiando a posse saudita das ilhas Tiran, pois é mais benéfico para nós."
 ISR_isis_sinai: "Apoiar os Esforços no Sinai"
 ISR_isis_sinai_desc: "Devemos apoiar o Egito em seu esforço fornecendo dados de vigilância dos nossos drones de patrulha de fronteira."
 ISR_sisi_barak_call: "Emendar as Disposições do Tratado"
 ISR_sisi_barak_call_desc: "Talvez precisemos remover do Egito o status de zona desmilitarizada, considerando todas as circunstâncias."
 ISR_arab_spring: "Negociar com Tahrir"
 ISR_arab_spring_desc: "Agora devemos decidir o que fazer com o Egito, considerando que um regime hostil tomou o poder lá."
 ISR_deport_from_gaza: "Uma Nova Reserva"
 ISR_revive_yamit: "Restaurar Yamit"
 ISR_revive_yamit_desc: "Considerando que agora controlamos o Sinai, devemos integrá-lo ao nosso país."
 ISR_returning_the_favor: "Retribuir o Favor"
 ISR_returning_the_favor_desc: "Agora, considerando todas as circunstâncias, devemos derrubar o regime no Egito."
 ISR_watch_their_moves: "Observar seus Movimentos"
 ISR_watch_their_moves_desc: "Mesmo que o atual regime no Egito seja hostil a nós, não devemos adotar posturas radicais, mas observar seus movimentos e desestabilizar o regime de fora."
 ISR_deal_with_migrants: "O Muro da Fronteira Egípcia"
 ISR_deal_with_migrants_desc: "Agora devemos construir um novo muro contra os migrantes ilegais vindos do Egito. "
 ISR_negotiate_with_indonesia: "Negociar com a Indonésia"
 ISR_negotiate_with_indonesia_desc: "A Indonésia não nos reconheceu por causa de seu apoio à Palestina, porém nossas relações econômicas continuam grandes, apesar disso."
 ISR_negotiate_with_malaysia: "Pressionar a Malásia"
 ISR_temple_mount_issue: "Um Equilíbrio Delicado"
 ISR_temple_mount_issue_desc: "Desde a Guerra dos Seis Dias (e isso foi consolidado no Tratado de Paz de Arava de 1994), as autoridades religiosas jordanianas (Waqf) mantêm a suserania sobre a administração e o funcionamento da Mesquita de Al-Aqsa e do Complexo do Monte do Templo. Podemos escolher entre Emendar o Status Quo e assumir o controle direto do complexo da mesquita, ou Manter o Status Quo."
 ISR_status_quo_temple_mount: "Manter o Status Quo"
 ISR_status_quo_temple_mount_desc: "Talvez devêssemos manter o controle muçulmano sobre Al-Aqsa, favorecendo ao mesmo tempo nossos aliados."
 ISR_amend_status_quo: "Emendar o Status Quo"
 ISR_amend_status_quo_desc: "Não devemos dar a nenhuma potência estrangeira a capacidade de influenciar nossos vários locais em benefício próprio! Devemos assumir o controle direto e expulsar o Waqf."
 ISR_temple_mount_jordanian: "Reunir-se com o Waqf Jordaniano"
 ISR_temple_mount_jordanian_desc: "Não devemos revisar nossa política em relação a Al-Aqsa, mas continuar cooperando com a Jordânia."
 ISR_temple_mount_saudi: "Revisar a Custódia"
 ISR_temple_mount_saudi_desc: "Talvez devêssemos dar a autoridade sobre Al-Aqsa à Arábia Saudita, para priorizá-la em nossa futura diplomacia."
 ISR_strike_libya: "Operação Areia Rosa"
 ISR_strike_iraq: "Operação Filme de Continuação"
 ISR_strike_iran: "Operação Coroas Douradas"
 ISR_speak_to_police: "Falar com o Mafkal"
 ISR_speak_to_police_desc: "Nossa segurança interna sofre muito com as atividades criminosas e com a incapacidade da Polícia de lidar com elas. Devemos mudar isso."
 ISR_form_the_national_guard: "Formar a Guarda Nacional"
 ISR_form_the_national_guard_desc: "Sitiado como está o nosso país, devemos reforçar nossas forças armadas com uma nova Guarda Nacional."
 ISR_promote_the_swiss_model: "Promover o Modelo Suíço"
 ISR_promote_the_swiss_model_desc: "Devemos olhar para o modelo suíço de guarda nacional para moldar a nossa de acordo com ele."
 ISR_learn_from_october_events: "Aprender com os Nossos Erros"
 ISR_learn_from_october_events_desc: "Nossa Guarda Nacional deve ser designada para fazer batidas nos negócios dos mafiosos."
 ISR_strenghen_ministry_of_national_security: "Ministério da Segurança Nacional"
 ISR_strenghen_ministry_of_national_security_desc: "O Ministério da Segurança Nacional é a agência de aplicação da lei em todo o país e supervisiona a Polícia de Israel, o Serviço Prisional de Israel e os Serviços Nacionais de Bombeiros e Resgate de Israel, a Polícia de Fronteira de Israel, a Sede Nacional para a Proteção de Crianças na Internet, a Autoridade Nacional para a Segurança Comunitária e a Autoridade para a Proteção de Testemunhas."
 ISR_dont_form_the_national_guard: "Guardar a Promessa Antallena"
 ISR_dont_form_the_national_guard_desc: "Não precisamos de uma estrutura excessivamente militarizada para manter nossa sociedade intacta e os criminosos sob controle. Devemos reforçar a polícia, como única garantia de segurança interna."
 ISR_rely_on_magav: "Expandir a Guarda de Fronteira"
 ISR_rely_on_magav_desc: "Para garantir que estrangeiros inimigos com intenções maliciosas não entrem em nosso país, devemos apoiar nossa guarda de fronteira."
 ISR_rely_on_gideonites: "A Ação dos Gideonitas"
 ISR_rely_on_gideonites_desc: "Devemos fazer batidas contra os criminosos em nosso país e limpá-lo de negócios ilegais."
 ISR_focus_yamam: "Honrar o Yamam"
 ISR_focus_yamam_desc: "O Yamam é capaz tanto de operações de resgate de reféns quanto de ataques ofensivos de tomada contra alvos terroristas em áreas civis. Além das funções militares e de combate ao terrorismo, também desempenha funções de unidade tática e trabalho policial disfarçado."
 ISR_deal_with_police_racism: "Ouvir as Preocupações dos Beta Israel"
 ISR_deal_with_police_racism_desc: "Devemos combater o racismo em nossa polícia e promover igualdade de oportunidades para o alistamento."
 ISR_reform_the_fire_fighting_force: "Vistoriar os Edifícios Suspeitos"
 ISR_reform_the_fire_fighting_force_desc: "Realizaremos mais buscas e batidas contra os criminosos."
 ISR_shabac_intervention_no: "Formar um Comitê Conjunto"
 ISR_shabac_intervention_yes: "Lei de Observação da Segurança Nacional"
 ISR_shabac_intervention_yes_desc: "Devemos aumentar a segurança interna justificando legalmente nossas ações anticrime."
 ISR_gather_all_the_equipment: "Reunir Todas as Armas"
