 CZE_political_event.7.t: "Partido dos Trabalhadores é banido"
 CZE_political_event.7.desc: "O Supremo Tribunal Administrativo dissolveu o Partido dos Trabalhadores a pedido do governo, a primeira proibição de um partido por motivos ideológicos na história da República Tcheca. Seus líderes e membros estão se reagrupando no Partido dos Trabalhadores da Justiça Social, que agora leva adiante seu programa na extrema direita."
 CZE_political_event.7.a: "A extrema direita se reagrupa"
 CZE_political_event.8.t: "União da Liberdade-União Democrática se dissolve"
 CZE_political_event.8.desc: "A União da Liberdade-União Democrática encerrou sua atividade política depois que seu congresso votou pela dissolução do partido e sua liquidação. Os eleitores liberais e pró-europeus agora olham para o TOP 09 como o principal partido de seu campo."
 CZE_political_event.8.a: "O liberalismo encontra um novo lar"
 CZE_political_event.9.t: "Tribunal dissolve os Republicanos"
 CZE_political_event.9.desc: "O Supremo Tribunal Administrativo dissolveu o Congresso pela República-Partido Republicano da Tchecoslováquia, de Miroslav Sládek. O voto de protesto nacionalista que ele já comandou está migrando para a Aurora da Democracia Direta, o novo movimento do senador Tomio Okamura."
 CZE_political_event.9.a: "Um novo rosto para o voto de protesto"
 CZE_political_event.10.t: "Okamura funda Liberdade e Democracia Direta"
 CZE_political_event.10.desc: "Tomio Okamura e Radim Fiala romperam com a Aurora da Democracia Direta após uma amarga disputa interna e fundaram um novo partido, Liberdade e Democracia Direta. O novo partido faz campanha pela democracia direta, contra a imigração e por um referendo sobre a adesão à UE."
 CZE_political_event.10.a: "Okamura recomeça"
 CZE_political_event.11.t: "A Esquerda é formada"
 CZE_political_event.11.desc: "O Partido do Socialismo Democrático e a Esquerda Real se fundiram em um único partido, A Esquerda. O novo partido espera unir a esquerda radical dispersa em torno do socialismo democrático, do anticapitalismo e do antimilitarismo."
 CZE_political_event.11.a: "A esquerda fecha fileiras"
 CZE_political_event.12.t: "ČSSD se torna Social-Democracia"
 CZE_political_event.12.desc: "Em seu congresso em Plzeň, o Partido Social-Democrata Tcheco mudou seu nome para Social-Democracia, ou SOCDEM. A liderança apresenta o novo nome e logotipo como um recomeço após a saída do partido da Câmara dos Deputados."
