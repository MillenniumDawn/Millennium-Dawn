l_english:

 can_do_asean_focus: "We are an §Yactive member§! of ASEAN"
 ASEAN_focus_completed_tt: "Already completed by an ASEAN member."
 ASEAN_enlargement_quorum_tt: "At least §Y4§! members are active in ASEAN"
 asean_second_crisis_survived: "ASEAN came through the second financial crisis"
 asean_defense_pact_gate: "A major power outside ASEAN is at war with a member"
 ASEAN_indonesia_host_gate_tt: "Only Indonesia, an Indonesian subject, or Indonesia's occupier can take this focus, since it spends Jakarta's own treasury"
 ASEAN_singapore_host_gate_tt: "Only Singapore, a Singaporean subject, or Singapore's occupier can take this focus, since it spends Singapore's own treasury"

 ASEAN_bali_concord_ii: "Bali Concord II"
 ASEAN_bali_concord_ii_desc: "In October in Bali, the members adopt a Concord that asks more of ASEAN than the 1967 Bangkok Declaration ever did. Thirty-six years on, that Declaration still describes a summit calendar rather than a working organisation. The Concord creates three Communities and commits the members to build them: a Political-Security Community, an Economic Community, and a Socio-Cultural Community. Each government will have to turn those headings into institutions."

 ASEAN_asean_charter: "The ASEAN Charter"
 ASEAN_asean_charter_desc: "The members sign the Charter at the Singapore summit and bring it into force fourteen months later. The text gives the Association legal personality, records consensus as Article 20, and keeps Minus X in Article 21 so willing members can move on economic work without waiting for every capital. ASEAN no longer exists only as a string of communiqués. It now has a legal instrument that later disputes can test."

 ASEAN_flexible_engagement_debate: "The Interference Question"
 ASEAN_flexible_engagement_debate_desc: "Non-interference is the founding rule, and members now find it harder to apply. Rangoon ignores the Rohingya. Refugees who cross the Thai border do not follow the Charter's language. A decade ago in Manila, Surin Pitsuwan put a change to the rule to a vote and lost nine to one. The same question returns now. The vote will not be unanimous, and the result will limit what ASEAN can do when the problem sits inside a member state."

 ASEAN_uphold_non_interference: "The ASEAN Way Holds"
 ASEAN_uphold_non_interference_desc: "Members treat sovereignty as inviolable and do not comment on one another's internal affairs. That rule keeps Cambodia and Laos inside ASEAN and keeps the summits civil. It also let the region ignore Rangoon for most of two decades. We keep that silence, which the Charter now names consensus."

 ASEAN_flexible_engagement: "Voice Where It Matters"
 ASEAN_flexible_engagement_desc: "ASEAN adopts the rule Surin Pitsuwan proposed and failed to sell: members may comment when another member's crisis crosses a border. Refugee flows qualify. Junta calendars qualify. Governments that run closed systems will reject the change, and the Association will use the new authority sparingly."

 ASEAN_empower_secretariat: "Jakarta's Mandate"
 ASEAN_empower_secretariat_desc: "ASEAN already has a headquarters in Jakarta, but the Secretariat still works under a standing budget shortfall. We give it drafting authority, senior civil servants seconded from every capital, and enough funds to call a meeting without asking Singapore to cover the cost. Surin's term as Secretary-General showed what the office can do when it has a mandate. The next step is to fund and staff that office on a permanent basis."

 ASEAN_summit_calendar: "The Summit Calendar"
 ASEAN_summit_calendar_desc: "ASEAN meets twice a year, rotates the chair in alphabetical order, and keeps a ministerial track running between summits. The rotation gives small members a year to set the agenda. Malaysia has already held that role several times. Laos and Cambodia will hold it as well, and the other members will have to treat those years with roughly the same weight they give Indonesia's chairmanship."

 ASEAN_dispute_settlement_protocol: "A Way to Disagree"
 ASEAN_dispute_settlement_protocol_desc: "Members signed the Enhanced Dispute Settlement Protocol with ceremony and have not used it once in the two decades since. They sent every Preah Vihear round, every Sabah note-verbale, and every gas-field standoff at Ambalat to bilateral talks or to the Hague. We now sign a version the members can actually invoke."

 ASEAN_aichr: "Enforce Human Rights"
 ASEAN_aichr_desc: "Members designed the ASEAN Intergovernmental Commission on Human Rights (AICHR) to be visible and to lack enforcement power, and that is how it works today. A stronger AICHR would expose some governments and give others a mandate to raise cases they now avoid. The Secretariat supports the change. The Cambodian delegation opposes it. The vote will pass, but only narrowly."

 ASEAN_found_the_court: "The ASEAN Court of Justice"
 ASEAN_found_the_court_desc: "We create a court whose rulings bind the members. The Dispute Settlement Protocol supplies the procedure; the court is the body that applies it. Overlapping South China Sea claims and unresolved borders then become legal files rather than fleet problems. Manila already held a Hague ruling and could not persuade ASEAN to cite it. That refusal becomes harder to repeat once an ASEAN court has a record of its own."

 ASEAN_free_trade_area: "Make the Free Trade Area Work"
 ASEAN_free_trade_area_desc: "The members declared the ASEAN Free Trade Area (AFTA) in 1992 and have spent every year since then trying to finish its tariff schedule. AFTA works on paper and only partly works at the border. The signatories are the ASEAN-6: Brunei, Indonesia, Malaysia, the Philippines, Singapore, and Thailand. None of them will say that the customs union still is not a customs union. We now close the gaps in the schedule."

 ASEAN_revise_cept: "Modernise the Tariff Scheme"
 ASEAN_revise_cept_desc: "The Common Effective Preferential Tariff (CEPT) scheme runs AFTA, and the scheme is out of date. It allows too many exemptions, treats CLMV timelines as fixed, and has no working rules for services. We rewrite it. Every member signs the new schedule. A few will still keep their old exemptions in practice."

 ASEAN_chiang_mai_initiative: "Chiang Mai"
 ASEAN_chiang_mai_initiative_desc: "In 1997 the region ran out of dollars and had to negotiate with the IMF. The members do not intend to repeat that. At the ADB meeting in Chiang Mai they sign an Initiative that builds a bilateral currency-swap network across ASEAN+3, so each member can borrow regional credit before it goes to the Fund. Bangkok still calls 1997 the Tom Yum Kung Crisis, and that episode is the reason for the network. The next crisis will show whether the swaps work."

 ASEAN_atiga: "Zero Tariffs"
 ASEAN_atiga_desc: "The ASEAN Trade in Goods Agreement cuts intra-bloc tariffs to zero for the ASEAN-6. The CLMV latecomers receive another five years. Twenty-three items across all ten members stay on the sensitive list: sugar in the Philippines, rice in every member, and tobacco in Indonesia, each held out as a standing exception. AFTA then matches the tariff schedule it claimed to have."

 ASEAN_cmim_multilateralise: "The Common Pool"
 ASEAN_cmim_multilateralise_desc: "The bilateral swaps built at Chiang Mai worked on paper. The global crisis showed that they formed a tangle in practice. Multilateralisation turns the network into a $120bn common pool with one trigger and one surveillance office, AMRO, in Singapore. The IMF remains the lender of last resort. Members now have a longer road before they have to use it."

 ASEAN_single_window: "The Single Window"
 ASEAN_single_window_desc: "A shipment that crosses a member border still clears five customs regimes and five sets of forms. The Single Window replaces that with one electronic clearance that all ten capitals can see in real time. The project is administrative rather than political, and it cuts the real cost of intra-ASEAN trade more than any other AEC measure."

 ASEAN_open_skies: "Open Skies"
 ASEAN_open_skies_desc: "The Multilateral Agreement on Air Services opens passenger routes between the capital cities. AirAsia built its network on the assumption that this would happen. Vietnam Airlines is ready. Garuda Indonesia is not, and will have to catch up. Tourism traffic rises. Boards of the smaller members' flag carriers then have to answer questions they have avoided."

 ASEAN_power_grid: "The ASEAN Power Grid"
 ASEAN_power_grid_desc: "Laos and Yunnan hold surplus hydropower, Sumatra holds geothermal capacity, and every equatorial member has unused solar potential. Singapore, Bangkok, Jakarta, and Ho Chi Minh City hold the demand. The Grid links those sources to those cities. The Laos-Thailand-Malaysia-Singapore pilot has already shown that the link can work. Scaling the pilot lets the region cut the imported LNG it now burns to keep the capitals supplied."

 ASEAN_singapore_kunming_rail: "The Singapore-Kunming Rail Link"
 ASEAN_singapore_kunming_rail_desc: "The planned mainland rail line runs from Singapore through Kuala Lumpur, Bangkok, and Vientiane into Kunming. China has built its half of the Laos segment. Governments have discussed the sections south of that line since the 1990s and have only half-built them. We finish the corridor. The mainland then operates as one logistics route, and the maritime members have to review how they compete with it."

 ASEAN_infrastructure_fund_round_modifier: "ASEAN Infrastructure Fund Disbursement"
 ASEAN_infrastructure_fund_round_modifier_desc: "The Secretariat has released a tranche from the pooled infrastructure fund, matched by member contributions. Road, rail, and grid projects across the bloc move onto a faster construction schedule while the disbursement lasts."

 ASEAN_asean_economic_community: "Build the Economic Community"
 ASEAN_asean_economic_community_desc: "Leaders declare the ASEAN Economic Community (AEC) at the December summit. It is not an EU single market and does not claim to be one. Goods already move more freely than labour or capital, and the harmonisation timelines remain targets rather than deadlines. The Community covers six hundred and sixty million people and five trillion dollars of combined GDP as one production base. The arrangement is in force, and it is still incomplete."

 ASEAN_hub_or_market_fork: "Depth or Reach"
 ASEAN_hub_or_market_fork_desc: "The AEC is in place. The next decade offers two policies that point in opposite directions. One deepens the Community by aligning labour markets, banking sectors, and services trade until 660 million people function as one economy. The other keeps ASEAN in the chair of every FTA negotiation from RCEP onward and uses that chair as the main asset. Both policies have a case. Members cannot run them as the same strategy."

 ASEAN_external_fta_hub: "The Hub Strategy"
 ASEAN_external_fta_hub_desc: "ASEAN takes the chair of ASEAN+3, +6, +8, the RCEP negotiations, and the other regional trade rounds. The members treat that chair as more valuable than a new harmonisation project. Singapore supports the choice. The Secretariat supports it more strongly. Deeper integration waits for a later decade."

 ASEAN_deep_single_market: "A True Single Market"
 ASEAN_deep_single_market_desc: "A complete market needs four freedoms: goods, services, capital, and labour. The AEC already covers goods. The other three remain plan language. Putting them into force means a Singaporean engineer can take a job in Jakarta on the same terms a Rotterdam engineer uses to take one in Munich. CLMV wage floors and Filipino labour ministries will resist. If the members finish the work, they would have the base for a monetary union that could function."

 ASEAN_asian_currency_unit: "Adopt a Common Currency"
 ASEAN_asian_currency_unit_desc: "Haruhiko Kuroda drafted the Asian Currency Unit (ACU) at the ADB, and no government adopted it. The design starts as a trade-weighted basket of member currencies, becomes a common unit of account, and can later become a currency. The economic case is direct: the members already invoice trade in dollars they do not print. The political case has not been available until now."

 ASEAN_political_security_community: "Unify Political and Security Policy"
 ASEAN_political_security_community_desc: "Leaders declared the ASEAN Political-Security Community (APSC) at Bali II and issued a Blueprint for it years later. Inside the Association the work covers counter-terror, disaster response, and the Malacca patrols. Outside it, the architecture runs through the ARF, the +3, the East Asia Summit, and ADMM-Plus. Those files now sit under one Community and one workplan."

 ASEAN_arf: "The ASEAN Regional Forum"
 ASEAN_arf_desc: "The ARF is ASEAN's first security dialogue with the great powers on ASEAN's terms and calendar. It has twenty-seven members: the ten ASEAN states, the +3, the +8, the EU, Pakistan, PNG, Timor-Leste, Bangladesh, Sri Lanka, and the DPRK. The agenda covers confidence-building, preventive diplomacy, and, on paper, conflict resolution. In practice no member has to agree a decision and no member has to leave. Governments keep the Forum for that reason."

 ASEAN_plus_three: "ASEAN Plus Three"
 ASEAN_plus_three_desc: "The +3 process brings China, Japan, and South Korea to the ASEAN table on ASEAN's calendar and under ASEAN's chair. The three already have a poor trilateral record, which is why a neutral ASEAN venue is useful. Chiang Mai came out of this process. RCEP will follow from it as well. When ASEAN brokers ties among Beijing, Tokyo, and Seoul, ASEAN holds the leverage in those ties."

 ASEAN_east_asia_summit: "The East Asia Summit"
 ASEAN_east_asia_summit_desc: "In December in Kuala Lumpur, the first East Asia Summit adds India, Australia, and New Zealand to the ASEAN+3 table. Eighteen countries meet, ASEAN holds the chair, and the Forum becomes the largest strategic dialogue in Asia. The small states of Southeast Asia set the room in which China, Japan, India, and the western Pacific meet. That arrangement is what the members mean by centrality."

 ASEAN_extend_eas_us_russia: "Widen the Summit"
 ASEAN_extend_eas_us_russia_desc: "In November in Bali, the East Asia Summit adds the United States and Russia. Both sit at an ASEAN table under an ASEAN chair. The members now convene the room that discusses every major strategic file in the western Pacific. The Summit still may not decide those files. The members treat the existence of the room as the result that matters."

 ASEAN_rcep: "Sign the Regional Partnership"
 ASEAN_rcep_desc: "The Regional Comprehensive Economic Partnership (RCEP) covers fifteen countries and thirty percent of global GDP, which makes it the largest trade agreement on earth. ASEAN chaired eight years of negotiations. India left in the final stage. China, Japan, South Korea, Australia, and New Zealand signed. The chair strategy produces its largest completed agreement."

 ASEAN_declaration_scs: "The South China Sea Declaration"
 ASEAN_declaration_scs_desc: "In November in Phnom Penh, four ASEAN claimants sit across from China: Vietnam, the Philippines, Malaysia, and Brunei. They issue a Declaration on Conduct that freezes reclamation and calls for restraint. The text has no enforcement clause, no timetable, and no penalty. Reclamation on the reefs will continue. The Declaration is still the document that keeps the reef dispute on the ASEAN agenda."

 ASEAN_counterterrorism: "After Bali"
 ASEAN_counterterrorism_desc: "The Kuta bombing kills 202 people in October. Jemaah Islamiyah claims the attack in public. Five years later the members sign the Convention on Counter Terrorism and write down the work their intelligence services have done since the week of the bombing: they share signals, coordinate arrests, and trace financing. The Convention is a treaty. The operational cooperation already existed."

 ASEAN_malacca_patrols: "The Malacca Patrols"
 ASEAN_malacca_patrols_desc: "Malaysia, Singapore, and Indonesia launch the MALSINDO patrols, and Thailand joins a year later. They coordinate patrols in the busiest shipping strait on earth. Piracy falls from more than a hundred incidents a year to single digits within a decade. The arrangement works as security cooperation without alliance language and without an American ship on the line."

 ASEAN_hadr: "Coordinate Disaster Response"
 ASEAN_hadr_desc: "The Boxing Day tsunami killed a quarter of a million people. The wave hit every member with a coastline, and aid landed in the wrong order at the wrong airports because no office coordinated it. AADMER is the treaty. The ASEAN Coordinating Centre for Humanitarian Assistance (AHA Centre) in Jakarta is the operations room. Later regional disasters run through that room: Yolanda, Nargis, Palu, and Lombok."

 ASEAN_admm: "The Defence Ministers' Meeting"
 ASEAN_admm_desc: "In May in Kuala Lumpur, the ten defence ministers sit at one table for the first time. ADMM is not an alliance and is not meant to become one. It coordinates disaster response, counter-terror work, and maritime security. Members keep alliance questions in other forums. ADMM handles the practical files."

 ASEAN_admm_plus: "Widen the Defence Table"
 ASEAN_admm_plus_desc: "In October in Hanoi, eight dialogue partners join the ADMM table: the United States, China, Russia, India, Japan, South Korea, Australia, and New Zealand. They form working groups on counter-piracy, HADR, peacekeeping, and cyber. The ASEAN Defence Ministers' Meeting-Plus (ADMM-Plus) is the most senior defence meeting in Asia that seats the American and Chinese ministers so that they have to speak to each other. Members keep the format for that reason."

 ASEAN_first_joint_exercise: "The Solidarity Exercise"
 ASEAN_first_joint_exercise_desc: "ASEAN holds its first Association-wide military exercise. The members choose the Natuna Sea as the venue, and that choice carries the political message. The drills are non-combat HADR and search-and-rescue work with no live fire. The exercise is symbolic. ASEAN has used symbols from the start, but it has not had this one available at any earlier point in its history."

 ASEAN_seanwfz_pressure_p5: "The Bangkok Treaty's Missing Signatures"
 ASEAN_seanwfz_pressure_p5_desc: "The Southeast Asian Nuclear Weapon Free Zone Treaty binds every member and any warhead a member might host on its soil. The P5 have refused to sign the protocol since 1997 because their submarines transit the zone with weapons aboard. We press them to sign. African states eventually brought the Pelindaba Treaty through the same kind of refusal, and that precedent still applies."
 ASEAN_seanwfz_peace_dividend: "The Southeast Asian Nuclear Weapon Free Zone"

 ASEAN_alignment_question: "Which Way We Face"
 ASEAN_alignment_question_desc: "Beijing writes the largest cheques. Washington signs the treaty guarantees. Neither government is asking politely. Every ASEAN capital will come under pressure to declare a side, and none of them can afford a public choice. Each government will pick its own doctrine. ASEAN pays for a bad mix of those choices in lost cohesion."

 ASEAN_align_with_china: "The Chinese Doctrine"
 ASEAN_align_with_china_desc: "Chinese equipment costs less, the financing terms are softer, and the Belt and Road has already paid for the port and the railway. Beijing has been the largest investor in the mainland ASEAN economies for years. The reef dispute stays awkward and quiet. The other members will oppose this choice and will spend cohesion making that opposition public."

 ASEAN_pursue_self_reliance: "Bebas Aktif"
 ASEAN_pursue_self_reliance_desc: "Hanoi's Four No's bar alliances, foreign bases, taking sides, and threats. Those rules have held up better than the members expected. Jakarta's bebas aktif policy, independent and active, predates Sukarno. Building a domestic defence industry that makes the words credible takes longer and costs more than taking a patron. It is also the only course that does not damage standing in Manila or Phnom Penh."

 ASEAN_align_with_america: "The American Doctrine"
 ASEAN_align_with_america_desc: "The Mutual Defence Treaty with Manila dates to 1951. Bangkok's alliance dates to 1954. Singapore keeps arrangements that the US Navy uses and does not discuss in public. The return is interoperability, high-end equipment, and freedom-of-navigation cover. The cost is entry into the next war Washington starts, with the reef dispute at risk of becoming a shooting war. The other members will not support that bargain."

 ASEAN_defense_community: "The ASEAN Defence Community"
 ASEAN_defense_community_desc: "ASEAN refused alliance status for decades and now faces a request to become one. The trigger comes from outside the members' plans: a war on the doorstep, a contest over a member's territory, or a missing patron. The answer is not automatic. Signing the pact cancels fifty-six years of refusal in a single act. The price is the wars the pact would require the members to enter. Manila has already voted for this. Vientiane will need to be persuaded."

 ASEAN_seato_faction_rules_tt: "§HSoutheast Asia Treaty Organization: special rules§!\n• Open only to recognized Southeast Asian nations, and only while they are not at war\n• A member joining at peace also gains a discount on the upkeep of improving relations\n• The pact can only call a member into a fellow member's defensive war\n• Only fully independent members, not subjects of another power, may declare war through the pact\n• Every member is locked into at least a medium tier of pooled manpower sharing\n• Guarantees extended between members reduce world tension\n• Leadership passes automatically once ASEAN centrality among the membership falls below half\n• The leader cannot simultaneously lead or belong to another faction"

 ASEAN_admission_protocols: "Article Six"
 ASEAN_admission_protocols_desc: "Article Six of the Charter requires full consensus and established procedures for admission. The CLMV expansions are the working precedent, and none of them moved quickly. We write the machinery down so the members can issue an invitation when they mean to invite and block a bid when they mean to block. Singapore holds firm views on the blocking half."

 ASEAN_iai_narrow_gap: "Narrow the Gap"
 ASEAN_iai_narrow_gap_desc: "The Initiative for ASEAN Integration is the programme the ASEAN-6 use to raise CLMV capacity. It pays for roads, ports, customs training, and university scholarships. Japan funds most of that work, and the bank in Manila funds part of it with little publicity. Without the IAI, each new admission reduces what the AEC is worth to the existing members. We fund the programme at a level that matches the task."

 ASEAN_admit_east_timor: "Admit Timor-Leste"
 ASEAN_admit_east_timor_desc: "Dili applied in 2011. Singapore blocked the bid, then abstained, then negotiated, then blocked again for most of a decade, citing capacity problems that none of the CLMV members would have passed. The Phnom Penh summit agrees accession in principle. Full membership follows during the Jakarta chairmanship. Timor-Leste becomes the eleventh member."

 ASEAN_admit_png: "Admit Papua New Guinea"
 ASEAN_admit_png_desc: "Port Moresby has been an observer since 1976 and a Special Observer since 1981. It applies for full membership from time to time and does not push the file. Geographic contiguity is not a serious argument. Melanesian identity is a separate one. The Indonesian border in Sepik is the problem no delegation puts on the summit agenda."

 ASEAN_bimstec_absorption: "Absorb the Bay of Bengal"
 ASEAN_bimstec_absorption_desc: "Bangladesh and Sri Lanka already belong to BIMSTEC, a grouping India runs and that has never worked well. An ASEAN membership offer to both would absorb that venue. Dhaka is interested. Colombo needs the option. Delhi will treat the move as soft encroachment, and that reading is accurate. The trade case exists. No one has made the political case."

 ASEAN_pacific_expansion: "The Pacific Members"
 ASEAN_pacific_expansion_desc: "The possible members are Fiji, the Solomon Islands, Palau, Vanuatu, Tonga, and the Marshalls. Their working venue is the Pacific Islands Forum. The geography of an ASEAN expansion into the Pacific barely holds. The offer still matters because ASEAN is the only regional body that can give them meaningful membership without presenting the project as a Chinese initiative. Pacific governments have noticed that distinction."

 ASEAN_asean_11_new_governance: "Governance for Eleven"
 ASEAN_asean_11_new_governance_desc: "Timor-Leste's accession changes the quorum numbers. The chair rotation becomes an eleven-year cycle. The ASEAN-6 remain the core of any quorum. Every Charter threshold that used to say five now says six or seven. The members handle that housekeeping at the summit that closes the accession wave."

 ASEAN_indo_pacific_pole: "The Indo-Pacific Pole"
 ASEAN_indo_pacific_pole_desc: "ASEAN would then have twenty or more members and would run from the Bay of Bengal to the western Pacific. That grouping would stand as a third pole of Indo-Pacific power beside the US alliance system and the Sino-Russian axis. The outcome is not available on any timeline that skips the earlier gates in this branch. Those earlier files are what this end-state requires. The Association would then cover the region it claims to speak for."
