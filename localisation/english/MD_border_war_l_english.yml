l_english:
 RAJ_PAK_border_conflict_category: "Indo-Pakistani Border Conflict"
 RAJ_PAK_border_conflict_category_desc: "India and Pakistan remain divided over Jammu and Kashmir and a heavily militarized frontier. Exercises, incursions, and artillery exchanges can build toward limited clashes or a diplomatic crisis. Progress is tracked separately for every contested state.\n\n§YReadiness:§! [?THIS.pak_raj_border_readiness]\n§YBilateral Tension:§! [?global.pak_raj_border_tension]"
 RAJ_CHI_border_conflict_category: "Sino-Indian Border Conflict"
 RAJ_CHI_border_conflict_category_desc: "India and China dispute several sections of the Line of Actual Control, from Aksai Chin and Ladakh to Sikkim and Arunachal Pradesh. Operations require local forces and build momentum only toward the state where fighting occurred.\n\n§YReadiness:§! [?THIS.raj_chi_border_readiness]\n§YBilateral Tension:§! [?global.raj_chi_border_tension]"

 pak_raj_border_pair_valid: "India and Pakistan must be independent, at peace, outside the same faction, and in control of their own forces"
 raj_chi_border_pair_valid: "India and China must be independent, at peace, outside the same faction, and in control of their own forces"
 pak_raj_border_available: "No Indo-Pakistani border operation or crisis may already be active"
 raj_chi_border_available: "No Sino-Indian border operation or crisis may already be active"
 pak_raj_border_attack_available: "Requires more than §Y60 Readiness§!, at least §Y80 Bilateral Tension§!, and no active border operation"
 raj_chi_border_attack_available: "Requires more than §Y60 Readiness§!, at least §Y80 Bilateral Tension§!, and no active border operation"
 pak_raj_border_capture_available: "No Indo-Pakistani capture, clash, or crisis may already be active"
 raj_chi_border_capture_available: "No Sino-Indian capture, clash, or crisis may already be active"
 border_war_axis_requirements_tt: "We must own and control the source state, station at least one division there, and face the rival in the target state. These conditions are checked again when preparations finish."
 border_war_capture_requirements_tt: "We must hold an adjacent source state with at least one division while the rival owns and controls the target. These conditions are checked again when the operation finishes."
 border_war_negotiate_opinion_tt: "Both countries must have at least §Y25 Opinion§! of one another"

