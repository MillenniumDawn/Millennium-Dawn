 nsb_arty_upgrade_3_desc: "El proceso de modificar el ángulo de lanzamiento y la velocidad para cada ojiva, logrando de ese modo que todos los proyectiles batan un objetivo de manera simultánea (MRSI)."
 nsb_arty_upgrade_4: "Impacto simultáneo de múltiples proyectiles II"
 nsb_arty_upgrade_4_desc: "Un proceso mejorado con componentes de gama más alta que permite el combate simultáneo contra los objetivos enemigos."
 nsb_arty_upgrade_5: "Propelentes líquidos de carga masiva"
 nsb_arty_upgrade_5_desc: "Los propelentes líquidos de carga masiva reemplazan las cargas de pólvora fijas con una inyección ajustable de propelente, lo que permite a los sistemas de artillería variar la energía de salida del tubo, optimizar el control del alcance y simplificar el diseño de los mecanismos del cañón."
 nsb_arty_upgrade_6: "Propelentes líquidos de carga masiva II"
 nsb_arty_upgrade_6_desc: "Los sistemas de propelente líquido mejorados proporcionan un control de carga más preciso, un manejo más seguro y una mejor integración con los sistemas de control de tiro y carga automatizados, aumentando la flexibilidad de la artillería y el rendimiento del fuego sostenido."
 nsb_artillery_1: "ART 1965"
 nsb_artillery_1_desc: "With its powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew. Since it requires external vehicles for its movement, it can be difficult to move around in between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as they can fit inside transport planes."
 util_weapons: "Cañón principal"
 util_weapons_desc: "Es importante disponer de un cañón que se mantenga al nivel de la resistencia del blindaje enemigo y que pueda penetrarlo."
 util_infantry_help_upgrade: "Apoyo de infantería"
 util_infantry_help_upgrade_desc: "Mejorar la comunicación con la infantería y disponer de más medios para proporcionar apoyo directo."
 util_mobility: "Motor"
 util_mobility_desc: "Una mayor movilidad otorga ventajas tácticas y estratégicas, además de permitir un mayor blindaje sin ralentizar significativamente el vehículo."
 util_cutting_corners_upgrade: "Reducción de costes"
 util_cutting_corners_upgrade_desc: "Siempre hay gastos que se pueden recortar, pero no esperes que el equipo rinda igual después de realizar los recortes."
