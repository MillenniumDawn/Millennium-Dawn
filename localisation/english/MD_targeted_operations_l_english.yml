 TOP_opportunity.1.t: "2024 Counterterrorism Review: Dispersed Networks"
 TOP_opportunity.1.d: "The annual intelligence review has brought together reporting on militant networks already under investigation, emphasizing dispersed leadership and connections between regional organizations.\n\nA renewed lead concerning [TOP_modern_2024_name] has been added to the dossier. Further collection and normal authorization remain required, and the lead does not confirm the person's present location or fate."
 TOP_opportunity.1.a: "Keep the dossier under review."
 TOP_opportunity.2.t: "2025 Counterterrorism Review: Regional Connections"
 TOP_opportunity.2.d: "Our annual review has examined how militant organizations adapt to counterterrorism pressure and maintain regional links, giving African networks more attention where existing dossiers support it while retaining more urgent cases elsewhere.\n\nA renewed lead concerning [TOP_modern_2025_name] has been added to the dossier, but its value depends on continued collection. This review grants no operational authority and makes no finding about the person's current fate."
 TOP_opportunity.2.a: "Continue assessing the network."
 TOP_opportunity.3.t: "2026 Counterterrorism Review: Persistent Threats"
 TOP_opportunity.3.d: "Our intelligence services have reviewed active investigations and possible cooperation among regional networks despite leadership changes. Analysts have prioritized relevant Al-Qaeda and TTP cases where existing intelligence supports them, placing a renewed lead concerning [TOP_modern_2026_name] in the dossier.\n\nThe lead neither confirms the target's present whereabouts nor authorizes action."
 TOP_opportunity.3.a: "Maintain collection and review."
 TOP_opportunity.4.t: "2027 Targeted Operations Review"
 TOP_opportunity.4.d: "The annual review has examined the three identities added to this year's watchlist. Existing reporting on [TOP_modern_2027_name] supports a renewed lead, but it does not create a new dossier or grant authority to act. Serving officials remain subject to the exceptional-authority rules applied to every political target."
 TOP_opportunity.4.a: "Retain the lead for further assessment."
