 UKR_develop_t72amt: "Develop §YT-72AMT§!"
 UKR_develop_btr3u: "Develop §YBTR-3U 'Myslyvets'§!"
 UKR_develop_btr3u_desc: "BTR-3U 'Myslyvets' (also known as BTR-3U 'Guardian') is a deep modification of the BTR-94K with a Deutz BF6M1015 engine with a power of 326 hp and an Allison MD3066 automatic transmission, or a 300 hp UTD-20 engine.\nKharkiv Design Bureau named after O. O. Morozov carried out the development of the design documentation: the development of the chassis and the integration of all systems and weapons of the machine.\nThe armament includes a combat module KBA-105 'Shkval' with a 30-mm automatic cannon ZTM-1, paired with it a 7.62-mm machine gun KT-7, 62, two ATGM launchers 9M114M 'Konkurs-M' and 30- mm automatic grenade launcher.\nIt is equipped with the 0TP-20 sighting complex, which is integrated with the guided missile firing control system and the SVU-500 two-plane weapons stabilizer."
 UKR_develop_btr3e: "Develop §YBTR-3E§!"
 UKR_develop_btr3e_desc: "BTR-3E is a modification with a UTD-20 or Deutz BF6M1015 engine.\nEquipped with combat module BM-3M 'Sturm-M', the armament of which includes a 30-mm automatic cannon ZTM-1, a 7.62-mm machine gun KT-7.62 paired with it, two launchers (6 rockets) 'Baryer' and a 30-mm automatic grenade launcher KBA-117."
 UKR_develop_btr3e1: "Develop §YBTR-3E1§!"
 UKR_develop_btr3e1_desc: "BTR-3E1 is a modification of BTR-3E, specifically made to satisfy requirements for Thai contract in 2005-2006.\nThe main features of this version in comparison with the BTR-3E are: installation of the modernized BM-3M 'Shturm' combat module, decrease in height from 2928 mm to 2774 mm, increase in the combat crew from 9 up to 13 people, installation of a VRC-950 radio station, placement of additional ammunition for the combat module."
 UKR_develop_btr3da: "Develop §YBTR-3DA§!"
 UKR_develop_btr3da_desc: "BTR-3DA is a further development of the armored personnel carrier, taking into account the experience of the war in the east of Ukraine.\nThe BTR-3DA armored personnel carrier is faster and more maneuverable than its predecessors, it has improved armor protection for the crew, it has an optical-electronic module with television and thermal imaging channels.\nThanks to this, it became possible to fire at night.\nAn additional power unit allows you to control the combat module without using the main power plant."
 UKR_develop_btr3u_flag: "Completed decision §YDevelop BTR-3U 'Myslyvets'§!"
 UKR_develop_btr3e_flag: "Completed decision §YDevelop BTR-3E§!"
 UKR_develop_btr3e1_flag: "Completed decision §YDevelop BTR-3E1§!"
 UKR_develop_btr3da_flag: "Completed decision §YDevelop BTR-3DA§!"
 UKR_develop_btr3e1_cse90lp: "Develop §YBTR-3E1 CSE90LP§!"
 UKR_develop_btr3e1_cse90lp_desc: "BTR-3E1 CSE90LP is a modification of the BTR-3E1, which is equipped with a Cockerill CSE 90LP turret with a 90-mm low-pressure gun.\nThe turret is equipped with a coaxial 7.62-mm machine gun and a 40-mm automatic grenade launcher.\nThe turret is equipped with an automatic fire control system, which includes a laser rangefinder, a thermal imager and a ballistic computer."
 UKR_develop_btr3e1_cpws30: "Develop §YBTR-3E CPWS-30§!"
 UKR_develop_btr3e1_cpws30_desc: "BTR-3E CPWS-30 is a modification of the BTR-3E, which is equipped with a CPWS-30 turret with a 30-mm automatic cannon.\nThe turret is equipped with a coaxial 7.62-mm machine gun and a 40-mm automatic grenade launcher.\nThe turret is equipped with an automatic fire control system, which includes a laser rangefinder, a thermal imager and a ballistic computer."
 UKR_develop_btr4_category: "Develop BTR-4[UKR_btr4_development_steps_loc]"
 UKR_develop_btr4_category_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_main\n\n\n\n\n\n\n\n\nWe can spend time and money researching and testing the completely new domestic design of modern APC."
 UKR_develop_btr4_choose_role: "Choose role for §YBTR-4§!"
 UKR_develop_btr4_choose_role_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_roles_for_tooltip\n\n\n\n\n\n\n\n\n§YBTR-4§! was meant to be step-up compared to previous Soviet designs, and it was designed to incorporate heavier weapons from the get-go.\nWe can choose the desired role for this equipment - lighter and cheaper APC or more expensive and heavily armed IFV.\nOur decsion will influence what Battalions will be equipped with BTR-4: Mechanized or Armored.\nWe will have an option to produce basically the same equipment type but in opposite role if we want to."
 UKR_develop_btr4_apc_role_choose_module: "Choose primary weapon for §YBTR-4§! APC"
 UKR_develop_btr4_apc_role_choose_module_desc: "\n\n\n\n\n\n£UKR_desctext_btr4_apc_modules_for_tooltip\n\n\n\n\n\n\n\n\nWe can make a decision on what exact main armament will be used by our newly designed §YBTR-4§! APC."
