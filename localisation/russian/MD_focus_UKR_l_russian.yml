 tooltip_remove_productivity_from_state: "§WПроизводительность этого региона будет §Rуменьшена§! на §R$PRODUCTIVITY_AMOUNT$§! баллов.\n §!"
 UKR_develop_t64_strazh_desc: "§W§YБМПТ «Страж»§! — экспериментальная [UKR.GetFlag] украинская машина огневой поддержки танков на шасси танка §YТ-64§!.\nПроект совместно разработали §LЖитомирский бронетанковый завод§!, §LКиевский бронетанковый завод§! и §LГосударственная акционерная холдинговая компания «Артём»§!; его представили в 2017 году.\nШтатную башню §YТ-64§! заменили [UKR.GetFlag] украинским дистанционно управляемым боевым модулем §Y«Дуплет»§!, что придало машине совершенно иную роль, чем у исходного танка.\nПроект должен был обеспечить хорошо защищённую огневую поддержку с использованием имеющихся шасси §YТ-64§! и [UKR.GetFlag] украинского боевого оборудования.\n§Y«Страж»§! остался экспериментальным проектом и не пошёл в крупносерийное производство, §Gно мы ведь можем это изменить?§!§!"
 UKR_develop_t72amt_desc: "§W§YТ-72АМТ§! — [UKR.GetFlag] украинская модернизация §YТ-72А§!, разработанная §LКиевским бронетанковым заводом§! для Вооружённых сил [UKR.GetFlag] Украины.\nМодернизация включала двигатель §YВ-84-1§!, улучшенные приборы ночного видения, прицел §Y1К13§! и [UKR.GetFlag] украинскую динамическую защиту §Y«Нож»§!.\nТанк также получил современные средства связи и навигационную систему §YСН-3003 «Базальт»§!, а элементы ходовой части модернизировали с использованием узлов, разработанных для §YТ-80§!.\nПрицел §Y1К13§! позволил модернизированному танку применять комплекс управляемого вооружения §Y«Комбат»§!.\n§YТ-72АМТ§! задумывался как относительно экономичный способ приблизить имеющиеся танки §YТ-72§! к современным [UKR.GetFlag] украинским оперативным требованиям.§!"
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_rokach_for_tooltip\n\n\n\n\n\n\n\n\n§W§YЗСУ-23-4М-А1 «Рокач»§! — [UKR.GetFlag] украинская модернизация §Rсоветской§! зенитной самоходной установки §YЗСУ-23-4 «Шилка»§!.\nУстаревшее оборудование управления огнём и наблюдения заменено современной цифровой системой, что улучшает обнаружение и сопровождение воздушных целей.\nУстановка сохраняет четыре 23-мм автоматические пушки, но получает улучшенную электронику и четыре зенитные ракеты малой дальности.\nЭти изменения значительно повышают боевую эффективность §YЗСУ-23-4§! против низколетящих целей.§!"
 UKR_modernize_s125_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_2d1_for_tooltip\n\n\n\n\n\n\n\n\n§W§YС-125-2Д§! — [UKR.GetFlag] украинская модернизация §Rсоветского§! зенитного ракетного комплекса §YС-125§!.\nМодернизация призвана заменить устаревшие электронные компоненты и повысить устойчивость комплекса к радиоэлектронной борьбе и современным средствам противодействия.\nМодернизируются радиолокационная аппаратура и аппаратура наведения, а комплекс получает улучшенные возможности обнаружения, сопровождения и поражения воздушных целей.\nЭто продлит срок службы §YС-125§! и повысит его эффективность на современном поле боя.§!"
 UKR_modernize_s125m_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_m1_for_tooltip\n\n\n\n\n\n\n\n\n§W§YС-125М§! — [UKR.GetFlag] украинская программа модернизации, призванная продлить срок службы и расширить возможности §Rсоветского§! зенитного ракетного комплекса §YС-125 «Печора»§!.\nПрограмму выполняли [UKR.GetFlag] украинские оборонные предприятия, в том числе §YКБ «Луч»§! и §YRadionix§!; работы были сосредоточены на модернизации ракеты, а также аппаратуры наведения и управления огнём.\nМодернизация включала усовершенствованные ракеты §Y5В27Д§! и радиолокационную систему §YFCR-125§!, заменившие важные элементы исходного §Rсоветского§! оборудования.\nПроект §YС-125М§! дал [UKR.GetFlag] Украине возможность значительно продлить срок службы имеющихся комплексов §YС-125§!, не разрабатывая полностью новый ЗРК.§!"
 UKR_modernize_kvadrat_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_kvadrat_2l_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y2К12М1-2Л «Квадрат-2Л»§! — [UKR.GetFlag] украинская модернизация §Rсоветского§! зенитного ракетного комплекса §Y2К12М1 «Куб»§!.\nРяд устаревших электронных компонентов заменён современным оборудованием [UKR.GetFlag] украинского производства.\nКомплекс получает улучшенные радиолокационные средства и систему управления огнём, что повышает его способность обнаруживать, сопровождать и поражать воздушные цели.\nМодернизация призвана продлить срок службы оставшихся комплексов §Y2К12М1§! и повысить их эффективность против современных угроз.§!"
 UKR_develop_t38_stylet_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_t38_for_tooltip\n\n\n\n\n\n\n\n\n§W§YТ-38 «Стилет»§! — [UKR.GetFlag] украинский зенитный ракетный комплекс малой дальности, разработанный заводом §L«Арсенал»§! совместно с [BLR.GetFlag] белорусскими партнёрами.\nКомплекс использует ракету §YТ382§! и предназначен для поражения самолётов, вертолётов, крылатых ракет и других низколетящих воздушных целей.\nОн установлен на гусеничное шасси, что обеспечивает высокую подвижность и возможность действовать вместе с механизированными подразделениями.\nСоздание §YТ-38§! даёт [UKR.GetFlag] Украине современную замену устаревшим §Rсоветским§! комплексам малой дальности §Y«Оса»§!.§!"
 UKR_modernize_rk10_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_ryf_for_tooltip\n\n\n\n\n\n\n\n\n§W§YРК-10§! — [UKR.GetFlag] украинская зенитная управляемая ракета, созданная как альтернатива устаревшим ракетам §Rсоветских§! зенитных комплексов малой дальности.\nИнтеграция §YРК-10§! с комплексом §Y«Стрела-10»§! позволит его пусковым установкам применять более новую ракету, сохранив имеющиеся машины и пусковую инфраструктуру.\nНовая ракета улучшает возможности поражения целей и позволяет комплексу оставаться в строю, не завися от всё более устаревающих §Rсоветских§! боеприпасов.\nЭта модернизация продлит срок службы парка §Y«Стрела-10»§! и повысит его боевую эффективность.§!"
 UKR_develop_kentavr_spaa_desc: "§W§YЗРАК «Кентавр»§! — [UKR.GetFlag] украинская концепция новой самоходной зенитной системы, ставшая дальнейшим развитием более раннего проекта §Y«Пернач»§!.\nПроект переработали под две спаренные 40-мм автоматические пушки вместо прежней концепции с 57-мм зенитным орудием, сохранив ракетную составляющую и собственную систему управления огнём.\nКонцепция §Y«Кентавр»§! предполагала сочетание радиолокационного обнаружения целей с оптико-электронной системой управления огнём, что позволило бы машине поражать воздушные цели как артиллерийским, так и ракетным вооружением.\nСистему планировали разместить на гусеничном шасси, производном от перспективной [UKR.GetFlag] украинской танковой платформы, которую §LХарьковское КБ имени Морозова§! разрабатывало в рамках программы §Y«Молот»§!/§Y«Боксёр»§!.§!"
 UKR_modernize_planes_category: "Модернизировать наши боевые самолеты"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\nМы можем потратить время и деньги на исследование и тестирование модернизаций самолетов и вертолетов советской эпохи, используемых нашими ВВС. А когда пройдет некоторое время и мы наберемся опыта, мы, возможно, даже попробуем создать уникальные отечественные разработки."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1_for_tooltip\n\n\n\n\n\n\n\n\n§WСу-25М1 — это украинская модернизация §Rсоветского§! самолёта непосредственной авиационной поддержки §YСу-25§!.\nМодернизация включает в себя улучшенное навигационное, коммуникационное и целеуказательное оборудование, сохраняя при этом существующий планер и вооружение самолёта.\nМодернизированные системы повышают точность неуправляемого оружия и позволяют самолёту более эффективно действовать в современных боевых условиях.\nМодернизация также продлевает срок службы парка §YСу-25§! §YУкраины§!.\n------------------\nЭто решение — §Rобязательное условие§! для решения §YСу-25М1К§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить его.§!"
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§W§YСу-27-1М§! — это украинская модернизация §Rсоветского§! истребителя §YСу-27§!.\nВ рамках программы были внедрены улучшенные системы навигации, связи, идентификации и бортовой электроники для повышения боевой эффективности самолёта.\nМодернизированная авионика обеспечивает лучшую ситуационную осведомлённость и улучшает возможности самолёта по применению современного вооружения.\nМодернизация позволяет §YСу-27§! оставаться на вооружении, одновременно снижая ограничения, накладываемые его первоначальным оборудованием §Rсоветской§! эпохи.\n------------------\nЭто решение — §Rобязательное условие§! для решения §YAn-BFV§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить его.§!"
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu2_for_tooltip\n\n\n\n\n\n\n\n\n§W§YМиГ-29МУ2§! — это украинская модернизация §Rсоветского§! истребителя §YМиГ-29§!, разработанная §LЛьвовским государственным авиаремонтным заводом§!.\nМодернизация основана на более ранней программе §YМУ1§! и включает в себя более масштабные усовершенствования авионики, навигационных и целеуказательных систем самолёта.\nСамолёт получает улучшенные возможности применения современного управляемого и неуправляемого оружия против воздушных и наземных целей.\nПрограмма §YМУ2§! призвана превратить §YМиГ-29§! в более совершенный многоцелевой боевой самолёт.§!"
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu1_for_tooltip\n\n\n\n\n\n\n\n\n§W§YМиГ-29МУ1§! — это украинская модернизация §Rсоветского§! истребителя §YМиГ-29§!.\nПрограмма предусматривает усовершенствованную бортовую электронику и модернизированную систему радиолокационного предупреждения и навигации.\nМодернизированное оборудование повышает ситуационную осведомлённость пилота и позволяет самолёту более эффективно действовать в современных боевых условиях.\nМодернизация §YМУ1§! также служит промежуточным этапом на пути к более масштабной модернизации §YМиГ-29§!.\n------------------\nЭто решение — §Rобязательное условие§! для решения §YМиГ-29МУ2§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить его.§!"
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\n§WПредложенный многоцелевой истребитель §LКБ «Антонов»§! был концептуальным проектом боевого самолёта §Yукраинской§! разработки.\nЦелью проекта было использовать опыт Украины в проектировании и производстве самолётов для создания современного истребителя, не полагаясь полностью на зарубежные разработки.\nСамолёт должен был включать современную авионику, вооружение и аэродинамические решения и быть адаптирован к возможностям §Yукраинской§! авиационной промышленности.\nХотя проект остался на стадии предложения, его развитие может заложить основу для будущего поколения украинских боевых самолётов.\n\n§GОсобо важный военный проект:§! после его завершения §YВерховная Рада§! будет охотнее одобрять увеличение военного бюджета.§!"
 UKR_develop_bm21_k_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bm21k_for_tooltip\n\n\n\n\n\n\n\n\n§W§YБМ-21К§! — [UKR.GetFlag] украинская модернизация §Rсоветской§! реактивной системы залпового огня §YБМ-21 «Град»§!.\nСистема установлена на современное шасси [UKR.GetFlag] украинского грузовика §LКрАЗ§! и получает улучшенное навигационное и связное оборудование, а также аппаратуру управления огнём.\nМодернизация повышает подвижность системы и позволяет расчётам эффективнее готовить и выполнять огневые задачи.\n§YБМ-21К§! — сравнительно недорогой способ модернизировать многочисленный парк §Rсоветских§! пусковых установок §Y«Град»§! [UKR.GetFlag] Украины.§!"
 UKR_develop_bastion03_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Бастион-03»§! — [UKR.GetFlag] украинская реактивная система залпового огня, созданная §LШепетовским ремонтным заводом§! как модернизация §Rсоветского§! §YБМ-27 «Ураган»§!.\nСистема построена на современном автомобильном шасси.\nМодернизация повышает подвижность и сокращает время подготовки пусковой установки к стрельбе.\n§Y«Бастион-03»§! позволит [UKR.GetFlag] Украине и дальше использовать имеющиеся 220-мм ракеты, заменив устаревшее §Rсоветское§! шасси.§!"
 UKR_develop_Vilkha_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_vilkha_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Вильха»§! — [UKR.GetFlag] украинская реактивная система залпового огня, разработанная §LКБ «Луч»§! на основе §Rсоветского§! §YБМ-30 «Смерч»§!.\nВ проекте исходные неуправляемые реактивные снаряды заменены новыми управляемыми ракетами с [UKR.GetFlag] украинской системой наведения.\nСистема обеспечивает значительно более высокую точность, сохраняя большую разрушительную силу и дальность тяжёлой РСЗО.\nСоздание §Y«Вильхи»§! знаменует переход от §Rсоветской§! неуправляемой реактивной артиллерии к современным средствам высокоточного поражения.§!"
 UKR_develop_bureviy_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bureviy_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Буревий»§! — [UKR.GetFlag] украинская реактивная система залпового огня, задуманная как современная замена устаревающему семейству §YБМ-27 «Ураган»§!.\nСистема установлена на современное шасси §LTatra§! §YT815-7T3R2T§! и оснащена цифровыми системами управления огнём и навигации.\n§Y«Буревий»§! рассчитан на применение имеющихся 220-мм ракет §Y«Ураган»§!, а также новых боеприпасов [UKR.GetFlag] украинской разработки.\nСочетание современной электроники, улучшенной подвижности и совместимости с имеющимися боеприпасами делает систему практичной модернизацией реактивной артиллерии [UKR.GetFlag] Украины.§!"
 UKR_modernize_mi24pu1_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu1_for_tooltip\n\n\n\n\n\n\n\n\n§W§YМи-24ПУ-1§! — [UKR.GetFlag] украинская модернизация §YМи-24П§!, разработанная §LКонотопским авиаремонтным заводом «Авиакон»§! совместно с [UKR.GetFlag] украинскими предприятиями оборонной промышленности.\nВертолёт получил более мощные двигатели §YТВ3-117ВМА-СБМ1В-02§! от §LМотор Сич§!, модернизированные авионику и навигационное оборудование, а также системы для работы с приборами ночного видения.\nВ ходе модернизации также установили систему защиты §YАдрос КТ-01АВ§!, лазерную прицельную систему §YФПМ-01КВ§! и усовершенствованный прицел §YАСП-17ВПМ-В§!.\nВ программе участвовали §LМотор Сич§!, §LАдрон§!, §LЦКБ «Арсенал»§! и §LИзюмский приборостроительный завод§!, а в более поздних версиях также использовалась [UKR.GetFlag] украинская оптико-электронная аппаратура.\nТаким образом, §YМи-24ПУ-1§! сочетал капитальный ремонт исходного вертолёта с новыми [UKR.GetFlag] украинскими двигателями, авионикой, системами защиты и прицеливания.§!"
 UKR_develop_nota_desc: "§W§YОбъект 477А1 «Нота»§! — передовой [UKR.GetFlag] украинский экспериментальный основной боевой танк с необитаемой башней, изолированным отделением экипажа и мощной 152-мм пушкой.§!"
 UKR_modernize_nota_desc: "§W§YОбъект 477А1 «Нота»§! — [UKR.GetFlag] украинское развитие §Rсоветского§! перспективного проекта основного боевого танка §YОбъект 477 «Молот»§!.\nКонструкция включает хорошо защищённое отделение экипажа, необитаемое боевое отделение и мощное основное вооружение.\nМодернизация добавит обновлённую электронику, системы защиты и другие компоненты и адаптирует конструкцию к технологиям, доступным [UKR.GetFlag] украинской оборонной промышленности.\nХотя проект так и не дошёл до серийного производства, дальнейшая разработка может стать основой для передового [UKR.GetFlag] украинского основного боевого танка.§!"
 ukr_history.63.t: "Арест Юлии Тимошенко"
 ukr_history.63.d: "Бывшая заместитель премьер-министра по вопросам топлива и энергетики была доставлена в Лукьяновскую тюрьму по обвинению в контрабанде газа и подделке документов, относящихся к периоду ее работы в компании «Объединенные энергетические системы». Она была уволена в январе после протестов против бартерных схем в этом секторе, и дело было возбуждено в течение нескольких недель. Суд признает задержание незаконным и освободит ее через сорок два дня; к тому времени она уже не будет министром, поссорившимся с президентом, а станет лицом оппозиции ему."
 ukr_history.63.a: "Пусть будет так."
 UKR_reorganize_navy_finish_project_133: "Достроить §G2 сторожевых корабля §Yпроекта 133§!§! для Морской охраны"
 UKR_reorganize_navy_finish_project_133_desc: "\n\n\n\n\n\n£UKR_desctext_project_133_for_tooltip\n\n\n\n\n\n\n\n\n§WМы можем выделить средства, чтобы наконец завершить затянувшуюся постройку §G2§! сторожевых кораблей советского проекта 133 для нашей морской охраны.§!"
 UKR_reorganize_navy_finish_11451_construction_flag: "Событие §YДостроить 2 корвета проекта 11451§! завершено"
 ukraine_reorganize_navy_finish_project_133.1.name: "Достроить 2 сторожевых корабля проекта 133 для морской охраны"
 ukraine_reorganize_navy_finish_project_133.1.desc: "Мы осмотрели два корпуса сторожевых кораблей проекта 133 для морской охраны — БГ53 «Полесье» и БГ54 «Слобожанщина» — и теперь можем выбрать, как поступить с их судьбой.\n\nМы можем вложить больше денег и провести капитальный ремонт обоих кораблей либо списать тот, что в худшем состоянии, — БГ54 «Слобожанщину», — и использовать его узлы, чтобы быстрее восстановить БГ53 «Полесье»."
 ukraine_reorganize_navy_finish_project_133.1.a: "Достроить оба корабля"
 ukraine_reorganize_navy_finish_project_133.1.b: "Разобрать «Слобожанщину» ради достройки «Полесья»"
 ukr_economy_rate.1.t: "НБУ снижает учётную ставку на 1%"
 ukr_economy_rate.1.d: "Национальный банк Украины снизил учётную ставку, сославшись на замедление роста цен и стабилизацию гривны. Ожидается, что вслед за ним коммерческие банки удешевят кредиты, а иностранные фонды, списавшие Украину со счетов после 1998 года, тихо возвращаются на рынок. Промышленность, десятилетие сидевшая без оборотных средств, наконец сможет занимать по ставкам, которые не съедают всю маржу."
 ukr_economy_rate.1.a: "Деньги стали чуть дешевле"
 ukr_economy_rate.2.t: "НБУ снижает учётную ставку на 2%"
 ukr_economy_rate.2.d: "Национальный банк Украины снизил учётную ставку, сославшись на замедление роста цен и стабилизацию гривны. Ожидается, что вслед за ним коммерческие банки удешевят кредиты, а иностранные фонды, списавшие Украину со счетов после 1998 года, тихо возвращаются на рынок. Промышленность, десятилетие сидевшая без оборотных средств, наконец сможет занимать по ставкам, которые не съедают всю маржу."
 ukr_economy_rate.2.a: "Деньги дешевеют дальше"
 ukr_economy_rate.3.t: "НБУ снижает учётную ставку на 3%"
 ukr_economy_rate.3.d: "Национальный банк Украины снизил учётную ставку, сославшись на замедление роста цен и стабилизацию гривны. Ожидается, что вслед за ним коммерческие банки удешевят кредиты, а иностранные фонды, списавшие Украину со счетов после 1998 года, тихо возвращаются на рынок. Промышленность, десятилетие сидевшая без оборотных средств, наконец сможет занимать по ставкам, которые не съедают всю маржу."
 ukr_economy_rate.4.t: "НБУ снижает учётную ставку на 4%"
 ukr_economy_rate.4.d: "Национальный банк Украины снизил учётную ставку, сославшись на замедление роста цен и стабилизацию гривны. Ожидается, что вслед за ним коммерческие банки удешевят кредиты, а иностранные фонды, списавшие Украину со счетов после 1998 года, тихо возвращаются на рынок. Промышленность, десятилетие сидевшая без оборотных средств, наконец сможет занимать по ставкам, которые не съедают всю маржу."
 ukr_economy_rate.5.t: "НБУ снижает учётную ставку до 29%"
 ukr_economy_rate.5.d: "С февраля Национальный банк Украины трижды снизил учётную ставку — с 45% до 29%, поскольку рост цен замедляется, а гривна остаётся стабильной. Коммерческие банки следуют его примеру и удешевляют кредитные линии, а иностранные фонды, списавшие Украину со счетов после 1998 года, тихо возвращаются на рынок."
 ukr_economy_rate.5.a: "Наконец-то дешёвые деньги"
 UKR_soviet_oob_tt: "Все наши части организованы по советскому образцу — роты, отделения и отряды. Техники в целом нужно меньше, но и боевые возможности ниже."
 ukraine_reorganize_navy_choose_future_corvette.4.c: "8 кораблей (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.9.name: "Построить корветы типа «Владимир Великий», проект 58250"
 ukraine_reorganize_navy_choose_future_corvette.9.desc: "По итогам самостоятельно проведённого конкурса новым пополнением флота выбраны корветы типа «Владимир Великий» проекта 58250.\nВыберем количество кораблей, которое согласимся построить."
 ukraine_reorganize_navy_choose_future_corvette.9.a: "10 кораблей (2x5)"
 ukraine_reorganize_navy_choose_future_corvette.9.b: "8 кораблей (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.9.c: "4 корабля (2x2)"
