 APC_9: "병력 수송 장갑차(APC) 2045"
 APC_9_desc: "장갑차는 병사 분대를 전투 지역으로 수송하도록 설계된 장갑 차량으로, 병사들은 이후 하차하여 도보로 싸웁니다. 병사들에게 방호를 제공하지만 일반적으로 자체 공격 능력은 제한적입니다. 장갑차로 수송되는 보병을 기계화 보병이라 부릅니다."
 APC_10: "병력 수송 장갑차(APC) 2055"
 APC_10_desc: "장갑차는 병사 분대를 전투 지역으로 수송하도록 설계된 장갑 차량으로, 병사들은 이후 하차하여 도보로 싸웁니다. 병사들에게 방호를 제공하지만 일반적으로 자체 공격 능력은 제한적입니다. 장갑차로 수송되는 보병을 기계화 보병이라 부릅니다."
 APC_11: "병력 수송 장갑차(APC) 2065"
 APC_11_desc: "장갑차는 병사 분대를 전투 지역으로 수송하도록 설계된 장갑 차량으로, 병사들은 이후 하차하여 도보로 싸웁니다. 병사들에게 방호를 제공하지만 일반적으로 자체 공격 능력은 제한적입니다. 장갑차로 수송되는 보병을 기계화 보병이라 부릅니다."
 APC_12: "병력 수송 장갑차(APC) 2075"
 APC_12_desc: "장갑차는 병사 분대를 전투 지역으로 수송하도록 설계된 장갑 차량으로, 병사들은 이후 하차하여 도보로 싸웁니다. 병사들에게 방호를 제공하지만 일반적으로 자체 공격 능력은 제한적입니다. 장갑차로 수송되는 보병을 기계화 보병이라 부릅니다."
 IFV_9: "보병 전투 차량(IFV) 2045"
 IFV_9_desc: "보병 전투차는 병사 분대를 전투 지역으로 수송하는 중장갑 차량입니다. 탑승한 보병은 장갑차보다 훨씬 더 큰 범위에서 차량 안에서 직접 싸울 수 있습니다. 보병 전투차는 중기관총과 기관포로 무장하거나 대전차 유도 미사일(ATGM)을 탑재합니다. 보병 전투차로 수송되는 보병은 기갑 보병 또는 중기계화 보병이라 부릅니다."
 IFV_10: "보병 전투 차량(IFV) 2055"
 IFV_10_desc: "보병 전투차는 병사 분대를 전투 지역으로 수송하는 중장갑 차량입니다. 탑승한 보병은 장갑차보다 훨씬 더 큰 범위에서 차량 안에서 직접 싸울 수 있습니다. 보병 전투차는 중기관총과 기관포로 무장하거나 대전차 유도 미사일(ATGM)을 탑재합니다. 보병 전투차로 수송되는 보병은 기갑 보병 또는 중기계화 보병이라 부릅니다."
 MBT_10: "주력전차(MBT) 2055"
 MBT_10_desc: "다층 그래핀 차량 장갑은 전례 없이 가벼운 무게로 방호력을 제공하며 나노로봇으로 자가 수리가 가능합니다. 리튬-공기 배터리와 전기 엔진 덕분에 전차의 열 신호는 거의 없는 수준으로 줄어들고, 적응형 적외선 위장과 함께 전자 유도 미사일 체계로는 사실상 추적이 불가능해집니다. 주력 전차는 중장갑을 갖추었고 평탄한 지형에서 기동성이 높으며, 군대에 강력한 직사 능력을 제공합니다."
 MBT_11: "주력전차(MBT) 2065"
 MBT_11_desc: "다층 그래핀 차량 장갑은 전례 없이 가벼운 무게로 방호력을 제공하며 나노로봇으로 자가 수리가 가능합니다. 리튬-공기 배터리와 전기 엔진 덕분에 전차의 열 신호는 거의 없는 수준으로 줄어들고, 적응형 적외선 위장과 함께 전자 유도 미사일 체계로는 사실상 추적이 불가능해집니다. 주력 전차는 중장갑을 갖추었고 평탄한 지형에서 기동성이 높으며, 군대에 강력한 직사 능력을 제공합니다."
