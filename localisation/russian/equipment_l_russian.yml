 GER_Anti_tank_1_desc: "Panzerfaust 3 — современный полуодноразовый безоткатный противотанковый гранатомёт, разработанный в 1978–1985 годах и принятый на вооружение бундесвера в 1987 году. Его заказали, чтобы дать западногерманской пехоте эффективное оружие против советской бронетехники того времени и заменить устаревшие гранатомёты PzF 44 Lanze."
