 GDP_PER_CAPITA: "人均GDP水平"
 GDP_PER_CAPITA_DESC: "这个数字代表§Y人均GDP§!或称为§YGDP/C§!，它代表了这个国家平均到每个人的产出。\n\n最近的§Y季度GDP增长率§!：[?last_quarter_gdpc_growth_rate|%Y]\n\n提示：您的§Y季度GDP增长率§!越高，您就越有可能获得正面的经济事件，如果不加以控制，更高的§R通货膨胀§!可能会进一步加剧。"
 GDP_PER_CAPITA_DELAYED_DESC: "目前§Y人均GDP§!对我们国家的影响：\n建造速度：[?production_speed_buildings_factor_gdp_modifier|%+]\n月度人力：[?monthly_population_gdp_modifier|%+1]\n研究速度：[?research_speed_factor_gdp_modifier|%+]\n稳定度：[?stability_factor_gdp_modifier|%+]\n劳动力总数：[?total_workforce_gdp_c_modifier_var|%+]\n化石燃料发电厂建设速度：[?fossil_pp_construction_gdp_c_modifier_var|%+]\n"
 NUM_GDP_PER_CAPITA: "$$§Y[?ROOT.gdp_per_capita|3]§!k"
 NUM_GDP_PER_CAPITA_DESC: "我们的§Y人均GDP§!目前为 $§Y[?ROOT.gdp_per_capita|3]§!K"
 PRODUCTIVITY: "生产率"
 PRODUCTIVITY_DESC: "这个数字代表了我们国家的§Y生产率§!。"
 NUM_PRODUCTIVITY_DELAYED_DESC: "§Y地区调整前月度增长率：§! [?productivity_growth_scaled|3+]\n\n§Y基础生产率增长：§!\n法律，国家精神和技术：[?modifier@productivity_growth_modifier|3+]\n包含公司税收：[?productivity_growth_modifier_from_corporate_tax|3+][literacy_productivity_tooltip]\n\n§Y国家增长修正：§!\nLaws, Ideas and Technologies: [?modifier@country_productivity_growth_modifier|%+1]\n包含通货膨胀：[?inflation_rate_prod_var|%+1]\n\n每月增长=基础生产率增长×0.5× (1+国家增长修正)。国家乘数限制在0到100之间。然后，每个地区应用其世界生产率调整和本地增长修正。\n\n对生产率的效果：\n§YGDP：§! [?productivity_tax_effect_display|%+1]\n§Y工厂产出：§! [?productivity_tax_effect_display|%+1]\n§Y船坞产出：§! [?productivity_tax_effect_display|%+1]\n§Y建筑速度：§! [?productivity_tax_effect_display|%+1]\n§Y企业税收入：§! [?productivity_tax_effect_display|%+1]\n§Y£construction_speed_texticon §Y商业化农业区§!建筑速度：§! [?agriculture_district_output_var|%+1]"
 NUM_PRODUCTIVITY: "§Y[?ROOT.overall_productivity|3]§!"
 NUM_PRODUCTIVITY_DESC: "§Y生产率§!衡量的是我们利用资源为民众提供商品和服务的效率，它与国内生产总值、企业税收和工业产值密切相关。更高的生产率意味着更高的效率，但随着各地区相对于世界平均水平的生产率提高，经济增长速度会放缓，而生产率较低的地区则能更快地迎头赶上。\n\n§Y世界平均水平：§![?global.average_world_productivity|3]\n§Y我们的生产率：§![?ROOT.overall_productivity|3]\n"
 INFLATION: "通货膨胀"
 INFLATION_DESC: "这个数字代表了我们国家的§Y通货膨胀§!。"
 NUM_INFLATION: "§Y[?ROOT.inflation_rate_var|%]§!"
 NUM_INFLATION_DESC: "§Y通货膨胀§!是指物价上涨的速度。高通货膨胀会增加政府支出并降低工厂产量。§Y通货膨胀对经济的影响§!体现在国家精神中，包括通货膨胀率为负时出现的§Y通货紧缩§!。\n\n它每季度更新一次。显示的速率是过去四个季度的平均值，每个季度最多变动10%。降低难度设置会减缓其增长速度。\n\n§Y影响因素：§!\n- §Y人均GDP§!增长率：经济快速增长会提高该值，经济萎缩会降低该值。\n- §Y税率§!：税率越高，其值越低。\n- §Y政策利率§!：利率越高，利率越低，但§R债务利息§!支出也会增加。\n-§Y经济周期§!：高于§Y稳定增长§!水平会提高它，反之则会降低它。\n- §Y预算§!：巨额赤字会增加预算，高债务情况下更是如此。盈余则会减少预算。\n- §Y印钞§!会提高通货膨胀\n- 货币贬值会推高这一比例，如果我们进口资源，这种情况会更加明显。\n- 高通胀部分延续到下一季度。\n\n§Y货币实力：§![currency_strength_display]\n§Y1.00§!是正常值。它每月更新，数值保持在§Y0.15§!到§Y2.00§!之间。降低游戏难度会提高最低值。货币疲软会增加政府支出，并提高资源出口收入。如果我们的§Y货币储备政策§!使用外币，也会增加我们的债务成本。强势货币则会产生相反的效果。\n\n§Y影响因素：§!\n- §Y政策利率§!：高于通货膨胀会加强货币实力，反之亦然。\n- §Y稳定度§!：高于50%会增强货币实力，反之亦然。\n- §Y经济周期§!：高于§Y稳定增长§!水平会提高它，反之则会降低它。\n- 来自债务或者§Y世界紧张度§!高于5%的§Y利率§!会削弱它。\n- 过去三年内战败（投降进度超过10%）、内战、遭受§Y国际制裁§!或金融崩溃都会削弱它。\n- 如果我们发行储备货币，每个使用它的国家都会增强它的实力。\n- §Y世界紧张度§!超过50%将提振美元、日元和瑞士法郎的实力。\n\n随着时间的推移，汇率会逐渐回落至长期水平。黄金、白银和金银双金属§Y货币支持机制§!能够将疲软的货币拉回至§Y1.00§!附近，而黄金也能将高于§Y1.05§!的汇率拉回。"
 NUM_INFLATION_DELAYED_DESC: "§Y最后四个季度：§! [?ROOT.year_quarter_inflation_tracker^0|%] · [?ROOT.year_quarter_inflation_tracker^1|%] · [?ROOT.year_quarter_inflation_tracker^2|%] · [?ROOT.year_quarter_inflation_tracker^3|%]\n\n所示利率为这四个季度的平均值，它决定了所有通货膨胀的影响。"
 POPULATION_TAX_RATE: "人口税率"
 POPULATION_TAX_RATE_TT: "§Y预期税率：[?expected_population_tax_rate|0]%§!\n公众在没有抵触情绪的情况下所能接受的税率。它随着我们人均GDP的增长而上升。\n• 将税率提高到既超过这一水平、又超过我们近期削减前任何更高税率的程度，会在一段时间内每百分点造成§R2%§! £stability_texticon §Y稳定度§!损失。\n• 将税率降低到既低于这一水平、又低于我们近期提高前任何更低税率的程度，会在一段时间内每百分点带来§G0.5%§! £stability_texticon §Y稳定度§!加成。\n• 向该水平调整不会增加过渡惩罚，但一次增税会首先收回近期减税带来的任何加成。\n参见我们国家精神中的§Y政策过渡成本§!。\n\n人口税税率包括对公众征收的所有税种。这可以包括但不限于所得税、增值税、销售税和房产税。\n\n§Y人口税带来的修正：§!\n£stability_texticon 稳定度：[?stability_factor_from_population_tax|%+]"
 CORPORATE_TAX_RATE: "企业税率"
 CORPORATE_TAX_RATE_TT: "§Y预期税率：[?expected_corporate_tax_rate|0]%§!\n企业界在没有抵触情绪的情况下所能接受的税率。它随着我们人均GDP的增长而上升，并跟随经济周期变化：在§Y停滞§!、§Y衰退§!或§Y萧条§!时期更低，在§Y快速增长§!或§Y经济繁荣§!时期更高。\n• 将税率提高到既超过这一水平、又超过我们近期削减前任何更高税率的程度，会在一段时间内每百分点造成§R1.2%§! £stability_texticon §Y稳定度§!损失。\n• 将税率降低到既低于这一水平、又低于我们近期提高前任何更低税率的程度，会在一段时间内每百分点给予§G0.01§! §Y月度生产力增长§!，并使我们国家的§Y外国投资§!成本在一段时间内每百分点下降§G2%§!。\n• 向该水平调整不会增加过渡惩罚，但一次增税会首先收回近期减税带来的任何加成。\n参见我们国家精神中的§Y政策过渡成本§!。\n\n企业税税率包括对企业征收的所有税种。其数值由企业所得税、雇主税等构成。\n\n§Y企业税带来的修正：§!\n£consumer_goods_texticon 税收成本：[?consumer_goods_from_corporate_tax|%Y]\n£receiving_investment_cost_modifier_texticon §Y接收外国投资§!成本修正：[?receiving_investment_cost_form_corporate_tax|%-]\n月度生产力增长：[?productivity_growth_modifier_from_corporate_tax|+3]\n"
 CB_POLICY_RATE: "政策税率"
 CB_POLICY_RATE_TT: "§Y央行政策利率§!是中央银行设定的基准利率，它控制着整个经济体的借贷成本。\n\n§Y提高利率§!会收紧货币供应，抑制通货膨胀，但会增加主权债务成本，减缓经济活动。\n§Y降低利率§!会刺激借贷和投资，但也会让通货膨胀更自由地上升。负利率在通货紧缩时期能提供额外的通胀刺激。\n利率每上升一个百分点，无论通胀率有多高，都会降低下一季度通胀的影响。利率等于或低于0%时，通胀结转率仍维持在90%的上限。如果预算赤字超过我们能够承受的范围，则利率每上升一个点所带来的影响最多会减半。\n高于通胀率1个百分点以上的利率会支撑§Y货币实力§!走强，而低于通胀率则会削弱其走强。即使通胀率远高于该利率，每高出1个百分点仍然能够缓解月度跌幅。\n\n每一调整动作花费§Y25§! £pol_power_icon 同时获得§Y30天§!的冷却时间。\n\n§Y当前利率：§![?cb_policy_rate]%\n§Y通货膨胀结转：§!正利率点数使结转份额每季度减少2.5个百分点\n§Y债务利息溢价：§![?cb_policy_rate|+0]% × 0.33个百分点，加入§Y利率§!"
