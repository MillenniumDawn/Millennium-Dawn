 ENG_worldwide_command3_desc: "O conceito de um Comando Mundial do Exército Britânico prevê uma abordagem estratégica em que o Exército Britânico estende seu alcance operacional globalmente. Essa iniciativa envolve o estabelecimento de uma estrutura de comando capaz de coordenar e conduzir operações militares em escala mundial. Por meio do envio de forças a várias regiões, as Forças Armadas Britânicas buscam ampliar sua influência global, responder a ameaças emergentes e contribuir para a segurança internacional. O Comando Mundial do Exército Britânico representa um compromisso com um engajamento militar proativo e versátil, alinhado à natureza cambiante dos desafios de segurança globais."
 ENG_worldwide_command4: "Comando Mundial"
 ENG_worldwide_command4_desc: "O conceito de um Comando Mundial do Exército Britânico prevê uma abordagem estratégica em que o Exército Britânico estende seu alcance operacional globalmente. Essa iniciativa envolve o estabelecimento de uma estrutura de comando capaz de coordenar e conduzir operações militares em escala mundial. Por meio do envio de forças a várias regiões, as Forças Armadas Britânicas buscam ampliar sua influência global, responder a ameaças emergentes e contribuir para a segurança internacional. O Comando Mundial do Exército Britânico representa um compromisso com um engajamento militar proativo e versátil, alinhado à natureza cambiante dos desafios de segurança globais."
 ENG_naval_defense_act_1889_1: "Lei de Defesa Naval de 1889"
 ENG_naval_defense_act_1889_1_desc: "A Lei de Defesa Naval de 1889 foi uma lei do Parlamento do Reino Unido. Recebeu o consentimento real em 31 de maio de 1889 e adotou formalmente o padrão de duas potências e aumentou a força naval do Reino Unido. O padrão exigia que a Marinha Real mantivesse um número de encouraçados pelo menos igual à força combinada das duas maiores marinhas seguintes do mundo"
 ENG_naval_defense_act_1889_1_tt: "§RSerá convertido em um espírito nacional temporário por dois anos, assim que formos a potência naval do continente§!"
 ENG_army_special_operations_brigade_idea: "Brigada de Operações Especiais do Exército"
 ENG_army_special_operations_brigade_idea_desc: "A Brigada de Operações Especiais do Exército do Reino Unido é uma força de elite e altamente especializada dentro dos militares britânicos. Composta por soldados exímios vindos de várias unidades, essa brigada é projetada especificamente para missões não convencionais e de alto risco. Equipada com armamento avançado, treinamento especializado e compromisso com a versatilidade, a Brigada de Operações Especiais do Exército desempenha um papel central no enfrentamento de ameaças complexas, na execução de operações de precisão e na contribuição para a estratégia geral de defesa da nação."
 ENG_allied_basing_efforts_Idea: "Esforços de Bases Aliadas"
 ENG_allied_basing_efforts_Idea_desc: "A iniciativa de Esforços de Bases Aliadas apresenta uma abordagem abrangente para fortalecer a infraestrutura e os ativos estratégicos das nações membros da aliança. Este programa engloba melhorias essenciais em redes de transporte, bases aéreas, portos e outras instalações críticas. O Reino Unido, como grande contribuinte da aliança, recebe um aprimoramento substancial e duradouro de sua infraestrutura, promovendo eficiência logística e prontidão estratégica."
 ENG_royal_navy_Idea1: "Marinha Real Britânica"
 ENG_royal_navy_Idea1_desc: "A Marinha Real Britânica é uma das principais forças marítimas do mundo, com um legado histórico que remonta a séculos. Reconhecida por sua adaptabilidade e proeza tecnológica, a Marinha Real desempenha papel crucial na salvaguarda dos interesses marítimos do Reino Unido e na projeção de poder em escala global."
 ENG_royal_navy_Idea2: "Marinha Real Britânica"
 ENG_royal_navy_Idea2_desc: "A Marinha Real Britânica é uma das principais forças marítimas do mundo, com um legado histórico que remonta a séculos. Reconhecida por sua adaptabilidade e proeza tecnológica, a Marinha Real desempenha papel crucial na salvaguarda dos interesses marítimos do Reino Unido e na projeção de poder em escala global."
