 SYR_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "If successful we will decrease corruption and gain §YRise Of Voluntary Organizations§! granting §G0.2§! daily political power gain and §G+30%§! construction speed for §Y100§! days"
