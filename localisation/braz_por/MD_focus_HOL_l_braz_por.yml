l_braz_por:
 netherlands_focus:0 "Árvore de Focos Holandesa"
 HOL_adressing_it_system_legacy_issues:0 "Resolver os Problemas dos Sistemas de TI Legados"
 HOL_adressing_it_system_legacy_issues_desc:0 "A receita federal holandesa depende de sistemas de TI obsoletos e fragmentados, o que prejudica sua eficiência e gera escândalos públicos. É hora de priorizar a modernização dessa infraestrutura crítica."
 HOL_space_efforts:0 "Reviver os Esforços Espaciais Holandeses"
 HOL_space_efforts_desc:0 "Os Países Baixos há muito estão na vanguarda da inovação científica, mas nosso programa espacial permaneceu subdesenvolvido. Ao nos comprometermos com um investimento renovado em tecnologia espacial, podemos nos estabelecer como um ator sério na corrida espacial global."
 HOL_nso_education_efforts:0 "Ampliar a Pesquisa e o Conhecimento da NSO"
 HOL_nso_education_efforts_desc:0 "A excelência científica é a base de qualquer programa espacial bem-sucedido. Ao aumentar o financiamento governamental à pesquisa espacial e ampliar as colaborações com universidades holandesas, aprofundaremos nosso conhecimento de astrofísica, sistemas de propulsão e ciência planetária."
 HOL_nso_economic_efforts:0 "Expansão da Infraestrutura de Satélites"
 HOL_nso_economic_efforts_desc:0 "Os Países Baixos devem aproveitar a crescente demanda por tecnologia de satélites. Investindo na produção doméstica de satélites, em capacidade de lançamento e em redes globais de comunicação por satélite, podemos nos estabelecer como um ator-chave da economia espacial."
 HOL_corporation_space:0 "Colaboração Espacial Internacional"
 HOL_corporation_space_desc:0 "A exploração espacial não é um empreendimento solitário. Fortalecer os laços com agências espaciais internacionais como a NASA, a ESA e a CNSA da China nos permitirá acessar tecnologias de ponta, pesquisa compartilhada e possíveis missões conjuntas a Marte e à Lua."
 HOL_mars_one:0 "Reviver a Iniciativa Mars One"
 HOL_mars_one_desc:0 "O sonho de estabelecer um assentamento humano permanente em Marte já foi considerado impossível. Embora o projeto Mars One original tenha fracassado, com o devido apoio estatal e supervisão científica podemos transformar essa visão em realidade. Os Países Baixos têm potencial para se tornar uma verdadeira nação espacial."
 HOL_Technologisch_Hoogwaardig: "Technologisch Hoogwaardig"
 HOL_Technologisch_Hoogwaardig_desc:0 "Investir em tecnologia de alta qualidade é essencial para manter forças armadas modernas e capazes. Esse foco inclui adotar sistemas avançados e fomentar a inovação para manter os Países Baixos na vanguarda da tecnologia militar."
 HOL_Join_JSF_tt:0 "Quando você concluir todas as §Ytecnologias necessárias do F35§!, receberá §G50§! §YAeronaves F35-A§! quando o programa JSF for concluído."
 HOL_Buy_F35C:0 "Aderir ao Programa F35C"
 HOL_Buy_F35C_desc:0 "A aquisição das aeronaves F-35C Lightning II dá à Força Aérea Holandesa uma variante capaz de operar em porta-aviões do avançado caça furtivo. Esse foco amplia a capacidade dos Países Baixos de projetar poder aéreo tanto de bases terrestres quanto de porta-aviões, oferecendo versatilidade e eficácia em combate incomparáveis."
 HOL_Netherlands_Fractal_Pattern_tt:0 "§YA tecnologia que você receber será ajustada ao seu nível tecnológico atual de Camuflagem§!"
 HOL_DAF_Trucks_tt1:0 "Investimos na §YDAF§!, os custos foram §Greduzidos!§!."
 HOL_DAF_Trucks_tt2:0 "Se §Ginvestirmos§! na §YDAF§! antes de adotar este foco, o custo será §Gpela metade§!."
 HOL_Scania_Trucks_tt:0 "Adiciona §G2000§! caminhões §YScania Gryphus§! quando a §YSuécia§! desbloquear o §YScania Gryphus§!"
 HOL_PULS_tt:0 "Adiciona §G20§! §YMLRS PULS§! quando §YIsrael§! desbloquear o §YPULS§!"
 HOL_F35C_Development_tt:0 "Quando você concluir todas as §Ytecnologias necessárias do F35§!, receberá §G50§! §YAeronaves F35-C§! quando o programa JSF for concluído."
 HOL_Special_Force_Move_tt:0 "Quando a §YMudança dos Fuzileiros§! for concluída, obteremos benefícios com a realocação."
 HOL_Robotics_Navy_tt:0 "§GReduz pela metade§! o custo dos §YFocos Nacionais Navais§!"
 HOL_Hollandklasse_Frigate_tt:0 "Concluir este foco disparará uma oferta de colaboração a §Y[BEL.GetNameWithFlag]§! para §Yproduzir§! em conjunto §G6§! §Yfragatas§! da Hollandklasse, depois que você pesquisar a §YFragata 2015§!, com §G15%§! de progresso de §Yprodução§! para ambas as nações, se aceita."
 HOL_vvd_klimaatakkoord: "Klimaatakkoord"
 HOL_vvd_klimaatakkoord_desc:0 "O compromisso com o Acordo Climático Holandês é essencial para um futuro sustentável. O VVD liderará os esforços para reduzir as emissões de gases de efeito estufa e promover a energia renovável."
 HOL_Public_Private_Partnerships_tt:0 "§YCusto§! dos §YFocos Econômicos§! reduzido em §G-10%§!"
 HOL_Balkenende_tt:0 "Adiciona §HSociedade Conservadora§!, que concede ( £political_power_texticon  Ganho de Poder Político: [?0.10|%+] , £foreign_influence_defense_modifier_texticon §YDefesa contra Influência Estrangeira§! Multiplicador: [?-0.10|%+])"
 HOL_Trust_In_Organizations_tt:0 "§HTodos os Estados Holandeses§! Recebem §H50 de Produtividade§!"
 HOL_direct_democracy:0 "Democracia Direta"
 HOL_direct_democracy_desc:0 "A LPF acredita em empoderar o povo por meio da democracia direta. Implementando processos decisórios mais conduzidos pelos cidadãos, garantimos que a política do governo esteja em estreita sintonia com a vontade do público."
 HOL_senate_reform:0 "Reforma do Senado"
 HOL_senate_reform_desc:0 "O Senado se tornou uma instituição estagnada. Reformá-lo simplificará os processos legislativos e garantirá que o Senado realmente sirva ao povo, e não a interesses entrincheirados."
 HOL_end_party_kartel:0 "Acabar com o Cartel Partidário"
 HOL_end_party_kartel_desc:0 "A LPF desmantelará o cartel partidário estabelecido que domina a política holandesa há anos. Abrir o sistema político trará ideias e vozes novas à governança da nossa nação."
 HOL_referenda:0 "Mais Referendos"
 HOL_referenda_desc:0 "A LPF defenderá o aumento de referendos para dar aos cidadãos voz direta em questões críticas. Esse compromisso com a democracia direta garante que a voz do povo seja ouvida e respeitada."
 HOL_limit_senate_power:0 "Limitar o Poder do Senado"
 HOL_limit_senate_power_desc:0 "A LPF pretende limitar o poder do Senado, reduzindo sua capacidade de vetar legislação progressista. Isso permitirá que nossa democracia funcione com mais eficiência e sem obstruções."
 HOL_public_sector_reform:0 "Reforma do Setor Público"
 HOL_public_sector_reform_desc:0 "O setor público holandês está atolado em ineficiência e desperdício. A LPF reformulará as instituições governamentais, simplificando operações para garantir um serviço eficaz e o uso responsável do dinheiro dos contribuintes."
 HOL_cut_business_taxes:0 "Cortar os Impostos Empresariais"
 HOL_cut_business_taxes_desc:0 "Para fomentar um ambiente de negócios competitivo, a LPF reduzirá os impostos sobre as empresas holandesas. Essa redução incentivará o investimento, estimulará o crescimento e criará mais oportunidades de emprego."
 HOL_labor_market_liberalization:0 "Liberalização do Mercado de Trabalho"
 HOL_labor_market_liberalization_desc:0 "Para tornar o mercado de trabalho holandês mais adaptável, a LPF introduzirá medidas de liberalização. Essas reformas reduzirão os obstáculos regulatórios, facilitando a contratação pelas empresas e dando mais flexibilidade aos trabalhadores."
 HOL_welfare_reform:0 "Reformar o Estado de Bem-Estar"
 HOL_welfare_reform_desc:0 "Pim Fortuyn acreditava que o Estado de bem-estar holandês era inchado e insustentável. A LPF reformará o sistema assistencial, focando em reduzir a dependência e incentivar a responsabilidade pessoal, sem abandonar o apoio a quem realmente precisa."
 HOL_counter_terrorism_efforts:0 "Esforços Antiterrorismo"
 HOL_counter_terrorism_efforts_desc:0 "A sociedade holandesa se tornou cada vez mais insegura devido à aplicação frouxa da lei. A LPF fortalecerá a força policial, imporá penas mais duras para crimes violentos e garantirá que os cidadãos holandeses voltem a se sentir seguros em seu próprio país."
 HOL_more_police_force:0 "Aumentar o Efetivo Policial"
 HOL_more_police_force_desc:0 "A LPF acredita que uma forte presença policial é essencial para manter a ordem e a segurança públicas. Ampliando o efetivo policial e fornecendo recursos adicionais, garantiremos que as forças da lei possam proteger os cidadãos holandeses com eficácia."
 HOL_promote_dutch_values:0 "Promover os Valores Holandeses"
 HOL_promote_dutch_values_desc:0 "Tanto a LPF quanto o PVV acreditam que os valores holandeses são a base de uma sociedade forte e coesa. Trabalharemos para promover e preservar esses valores, garantindo que a cultura holandesa permaneça central em nossa vida pública e identidade nacional."
 HOL_support_dutch_agriculture:0 "Apoiar a Agricultura Holandesa"
 HOL_support_dutch_agriculture_desc:0 "A agricultura holandesa é um pilar da nossa economia e do nosso patrimônio cultural. Apoiando os agricultores locais e as comunidades rurais, fortaleceremos nossa segurança alimentar e promoveremos práticas sustentáveis enraizadas na tradição."
 HOL_made_in_holland:0 "Feito na Holanda"
 HOL_made_in_holland_desc:0 "Promoveremos os produtos feitos nos Países Baixos, incentivando os consumidores a escolher bens fabricados localmente. Priorizando as indústrias holandesas, apoiamos nossa economia e reforçamos nosso compromisso com a qualidade holandesa."
 HOL_family_business_support:0 "Apoio às Empresas Familiares"
 HOL_family_business_support_desc:0 "As empresas familiares são parte integrante da sociedade holandesa e formam a espinha dorsal da nossa economia. Daremos apoio para que esses negócios continuem prosperando e permaneçam competitivos em um mercado global."
 HOL_internet_freedom:0 "Proteger a Liberdade na Internet"
 HOL_internet_freedom_desc:0 "A liberdade de expressão on-line deve ser preservada. Trabalharemos para salvaguardar o direito dos cidadãos de acessar e compartilhar informações livremente, resistindo a qualquer forma de censura ou controle do espaço digital."
 HOL_cut_down_government:0 "Enxugar o Governo"
 HOL_cut_down_government_desc:0 "A burocracia governamental se tornou inchada e ineficiente. Trabalharemos para reduzir encargos administrativos desnecessários, simplificar as funções do governo e garantir que o dinheiro dos contribuintes seja bem gasto."
 HOL_cut_leftist_groups:0 "Cortar Subsídios a Grupos de Esquerda"
 HOL_cut_leftist_groups_desc:0 "Os grupos de esquerda dependem há muito tempo de verbas públicas para promover suas agendas. Reduzindo os subsídios a esses grupos, garantimos que o dinheiro dos contribuintes apoie iniciativas que beneficiem a maioria dos cidadãos holandeses."
 HOL_forced_work:0 "Implementar Trabalho Obrigatório para Desempregados"
 HOL_forced_work_desc:0 "Para reduzir a dependência da assistência social, implementaremos medidas para garantir que quem recebe auxílio do governo retribua à sociedade, incentivando a autossuficiência e a produtividade."
 HOL_downgrade_prisons:0 "Rebaixar as Condições Prisionais"
 HOL_downgrade_prisons_desc:0 "A prisão deve ser um lugar de reabilitação, não de conforto. Reduziremos os luxos nas prisões, tornando-as lugares onde os infratores cumprem suas penas e aprendem a assumir responsabilidade."
 HOL_dutch_citizens_first:0 "Cidadãos Holandeses em Primeiro Lugar"
 HOL_dutch_citizens_first_desc:0 "Acreditamos em priorizar as necessidades dos cidadãos holandeses em todas as decisões políticas. Seja em saúde, habitação ou emprego, nosso objetivo é colocar o povo holandês em primeiro lugar."
 HOL_dutch_healthcare_first:0 "Saúde Holandesa Primeiro para os Cidadãos Holandeses"
 HOL_dutch_healthcare_first_desc:0 "Os recursos de saúde devem beneficiar principalmente os cidadãos holandeses. Garantiremos que os nacionais holandeses tenham acesso prioritário aos serviços médicos, fortalecendo a saúde pública e reduzindo a pressão sobre o sistema."
 HOL_reject_dual_nationality:0 "Rejeitar a Dupla Nacionalidade"
 HOL_reject_dual_nationality_desc:0 "Para fomentar a lealdade aos Países Baixos, restringiremos a dupla nacionalidade. Essa política incentiva um compromisso mais forte com a identidade holandesa e os valores nacionais."
 HOL_national_identity_first:0 "Identidade Nacional em Primeiro Lugar"
 HOL_national_identity_first_desc:0 "Acreditamos que um forte senso de identidade nacional é crucial para uma sociedade unida. Priorizando a cultura holandesa, garantimos que as futuras gerações cresçam com um profundo senso de orgulho e pertencimento."
 HOL_limit_foreign_influence:0 "Limitar a Influência Estrangeira"
 HOL_limit_foreign_influence_desc:0 "A influência estrangeira permeou a sociedade holandesa, afetando nossa economia, mídia e política. Implementaremos medidas para reduzir essa influência, garantindo que os interesses holandeses venham em primeiro lugar."
 HOL_remove_windmills_solar_parks:0 "Remover Moinhos de Vento e Parques Solares"
 HOL_remove_windmills_solar_parks_desc:0 "Embora a energia renovável seja importante, os moinhos de vento e os parques solares prejudicaram as paisagens holandesas. Focaremos em soluções energéticas alternativas que preservem a beleza do nosso campo."
 HOL_boost_housing_construction:0 "Impulsionar a Construção de Moradias"
 HOL_boost_housing_construction_desc:0 "A crise habitacional holandesa exige ação. Investiremos na construção de moradias para oferecer casas acessíveis aos cidadãos holandeses, enfrentando a escassez e apoiando a vida familiar."
 HOL_stop_mass_immigration:0 "Barrar a Imigração em Massa"
 HOL_stop_mass_immigration_desc:0 "A imigração descontrolada sobrecarrega os serviços públicos e a cultura holandesa. Implementaremos políticas para limitar a imigração, concentrando os recursos nas necessidades dos cidadãos holandeses."
 HOL_defund_international_aid:0 "Cortar a Ajuda Internacional"
 HOL_defund_international_aid_desc:0 "Os Países Baixos devem priorizar seus próprios cidadãos. Reduziremos os gastos com ajuda internacional e nos concentraremos em resolver os problemas dentro de nossas próprias fronteiras."
 HOL_restrict_asylum_seekers:0 "Restringir os Solicitantes de Asilo"
 HOL_restrict_asylum_seekers_desc:0 "Os Países Baixos não podem continuar arcando com o peso de um número elevado de pedidos de asilo. Implementaremos critérios rigorosos para gerenciar e reduzir a admissão de solicitantes de asilo."
 HOL_restore_border_control:0 "Restabelecer o Controle de Fronteiras"
 HOL_restore_border_control_desc:0 "Proteger as fronteiras holandesas é essencial para manter a soberania e a segurança. Restabeleceremos o controle total das fronteiras para gerenciar quem entra e sai do nosso país."
 HOL_strengthening_police_power:0 "Fortalecer os Poderes da Polícia"
 HOL_strengthening_police_power_desc:0 "Para garantir a segurança pública, devemos dotar nossa força policial das ferramentas e da autoridade necessárias para combater o crime com eficácia."
 HOL_celebrate_dutch_heroes:0 "Celebrar os Heróis Holandeses"
 HOL_celebrate_dutch_heroes_desc:0 "De exploradores a artistas, os heróis holandeses encarnam nossos valores nacionais e nossa história. Promoveremos as conquistas das figuras holandesas para inspirar orgulho em nosso patrimônio."
 HOL_protect_zwarte_piet:0 "Proteger a Tradição do Zwarte Piet"
 HOL_protect_zwarte_piet_desc:0 "A tradição do Zwarte Piet faz parte do patrimônio holandês. Vamos protegê-la da oposição, garantindo que nossas práticas culturais permaneçam intocadas."
 HOL_fatherland_education:0 "Educação Pátria"
 HOL_fatherland_education_desc:0 "Uma base educacional sólida em história e valores holandeses é a chave para formar cidadãos informados e orgulhosos. Investiremos em programas que enfatizem esses temas nas escolas."
 HOL_pro_gay_anti_lgbtq:0 "Pró-Gay, Anti-LGBTQ+"
 HOL_pro_gay_anti_lgbtq_desc:0 "Pioneiros há muito tempo em liberdades individuais, os Países Baixos adotaram a igualdade legal para casais do mesmo sexo e trabalharam para proteger os cidadãos da discriminação baseada na orientação sexual. No entanto, o crescente ceticismo público em relação às tendências LGBTQ+ gerou uma reação cultural. Reforçando nosso compromisso com os valores liberais fundamentais e nos distanciando do wokismo e do movimento LGBTQ+, buscamos preservar uma sociedade enraizada na liberdade individual e na estabilidade social."
 HOL_pro_gay_anti_lgbtq_tt:0 "Os efeitos serão exibidos se tivermos uma posição sobre §YLGBTQ§!"
 HOL_push_for_nexit:0 "Pressionar pelo Nexit"
 HOL_push_for_nexit_desc:0 "O Nexit, a saída dos Países Baixos da UE, é um objetivo central do PVV. Iniciaremos o processo de saída da União Europeia, recuperando a soberania plena sobre nossas leis, fronteiras e economia, e protegendo o modo de vida holandês contra os excessos de Bruxelas."
 HOL_bring_back_the_gulden:0 "Trazer de Volta o Gulden"
 HOL_bring_back_the_gulden_desc:0 "O euro fracassou com os Países Baixos, e o PVV trará de volta o florim holandês (gulden) para restaurar nossa independência econômica. Controlando nossa moeda, poderemos gerir melhor a inflação e o crescimento econômico."
 HOL_defend_israel_rights:0 "Defender o Direito de Existir de Israel"
 HOL_defend_israel_rights_desc:0 "Israel é um aliado crucial na luta contra o extremismo islâmico. O PVV defenderá o direito de Israel de existir e apoiará seus esforços para proteger suas fronteiras, garantindo que Israel permaneça uma nação forte e independente no Oriente Médio."
 HOL_counter_terrorism_israel:0 "Combater o Terrorismo com Israel"
 HOL_counter_terrorism_israel_desc:0 "O PVV trabalhará em estreita colaboração com Israel e outros aliados para combater o terrorismo, em especial o extremismo islâmico. Compartilhando inteligência e colaborando em medidas de segurança, os Países Baixos estarão mais bem equipados para proteger seus cidadãos."
 HOL_joint_antiiran_stance:0 "Aderir à Posição Anti-Irã"
 HOL_joint_antiiran_stance_desc:0 "O Irã representa uma ameaça crescente à segurança do Oriente Médio e aos interesses ocidentais. O PVV se juntará aos esforços internacionais para se opor às políticas expansionistas do Irã e à sua busca por armas nucleares."
 HOL_increase_corporation_vlaanderen:0 "Aumentar a Cooperação com Flandres"
 HOL_increase_corporation_vlaanderen_desc:0 "§Y[FLN.GetNameWithFlag]§! compartilha um profundo vínculo cultural e linguístico com §Y[HOL.GetNameWithFlag]§!. O PVV aumentará a cooperação econômica e política com Flandres, fortalecendo os laços entre os povos de língua holandesa."
 HOL_increase_corporation_vlaanderen_tt:0 "Desbloqueia §YDecisões§! para aumentar a integração §Y[HOL.GetAdjectiveCap]§! com §Y[FLN.GetNameWithFlag]§!"
 HOL_support_independent_vlaanderen:0 "Apoio a uma Flandres Independente"
 HOL_support_independent_vlaanderen_desc:0 "O PVV apoia a independência de Flandres, o que permitirá à região se separar de §Y[BEL.GetNameWithFlag]§! e fortalecer seus laços com os Países Baixos. Uma Flandres livre será uma forte aliada na defesa da identidade holandesa."
 HOL_economic_partnership_vlaanderen:0 "Parceria Econômica com Flandres"
 HOL_economic_partnership_vlaanderen_desc:0 "O PVV desenvolverá uma parceria econômica com Flandres, impulsionando o comércio e o investimento entre as duas regiões. Essa parceria beneficiará tanto os cidadãos holandeses quanto os flamengos."
 HOL_cultural_unification_vlaanderen:0 "Unificação Cultural com Flandres"
 HOL_cultural_unification_vlaanderen_desc:0 "O PVV apoia a unificação das culturas holandesa e flamenga, criando um espaço cultural compartilhado para os povos de língua holandesa. Isso fortalecerá os laços entre os Países Baixos e Flandres, promovendo um senso de identidade comum."
 HOL_ties_with_afrikaans:0 "Fortalecer os Laços com os Africâneres"
 HOL_ties_with_afrikaans_desc:0 "O africâner, uma língua com raízes no holandês, une os Países Baixos à África do Sul. O PVV fortalecerá os laços culturais e econômicos com a comunidade africâner, promovendo o patrimônio comum e a cooperação entre nossas nações."
 HOL_defend_afrikaans_rights:0 "Defender os Direitos Culturais Africâneres"
 HOL_defend_afrikaans_rights_desc:0 "O africâner está ameaçado na África do Sul, e o PVV defenderá os direitos culturais dos africâneres. Apoiando escolas e instituições africâneres, preservaremos essa língua e seus laços com o patrimônio holandês."
 HOL_economic_coorporation_afrikaners:0 "Cooperação Econômica com os Africâneres"
 HOL_economic_coorporation_afrikaners_desc:0 "Os africâneres da África do Sul compartilham uma profunda conexão cultural e linguística com os holandeses. O PVV promoverá a cooperação econômica com empresas africâneres, garantindo crescimento e desenvolvimento mútuos entre nossos povos."
 HOL_criminalize_islamic_symbols:0 "Criminalizar Símbolos Islâmicos"
 HOL_criminalize_islamic_symbols_desc:0 "O PVV proibirá símbolos islâmicos, como a burca e o véu, em espaços públicos. Esses símbolos representam uma recusa em se integrar à sociedade holandesa e, ao removê-los, fortaleceremos a unidade nacional e reforçaremos o secularismo holandês."
 HOL_ban_quaran:0 "Proibir o Alcorão"
 HOL_ban_quaran_desc:0 "O PVV vê o Alcorão como uma ameaça aos valores e à cultura holandeses. Daremos o passo ousado de proibir esse texto nos Países Baixos, limitando sua difusão e influência em nossa sociedade para preservar nossa identidade nacional."
 HOL_ban_islamic_schools:0 "Proibir Escolas Islâmicas"
 HOL_ban_islamic_schools_desc:0 "As escolas islâmicas nos Países Baixos promovem a separação e a recusa em se integrar à sociedade holandesa. O PVV fechará essas escolas, garantindo que todas as crianças sejam educadas dentro do sistema secular holandês, livres de doutrinação religiosa."
 HOL_close_mosques:0 "Fechar Todas as Mesquitas"
 HOL_close_mosques_desc:0 "As mesquitas são vistas como focos de radicalização e de ideologia antiocidental. O PVV fechará todas as mesquitas dos Países Baixos, cortando uma importante fonte de extremismo islâmico e protegendo, no processo, os valores e a segurança holandeses."
 HOL_strengthening_the_states_general:0 "Fortalecer os Estados Gerais"
 HOL_strengthening_the_states_general_desc:0 "Os Estados Gerais servirão como pilar do Stadtholderato, oferecendo representação a todas as províncias e regiões e garantindo governo equilibrado e responsabilização."
 HOL_constitutional_oversight_committee:0 "Comitê de Supervisão Constitucional"
 HOL_constitutional_oversight_committee_desc:0 "Criar um comitê dedicado a garantir que todas as decisões do governo estejam alinhadas com a visão da Coroa, promovendo transparência e responsabilização."
 HOL_promoting_dutch_enterprise:0 "Promover as Empresas Holandesas"
 HOL_promoting_dutch_enterprise_desc:0 "Apoiar as empresas holandesas com incentivos fiscais e menos burocracia, estimulando a inovação e garantindo o crescimento econômico."
 HOL_support_small_businesses:0 "Apoiar as Pequenas Empresas"
 HOL_support_small_businesses_desc:0 "As pequenas empresas são a espinha dorsal da nossa economia. Fornecer a elas os recursos e as oportunidades de que precisam garantirá uma Holanda próspera."
 HOL_balanced_trade_policies:0 "Políticas Comerciais Equilibradas"
 HOL_balanced_trade_policies_desc:0 "Implementar políticas comerciais que protejam as indústrias holandesas e, ao mesmo tempo, promovam parcerias estratégicas para fortalecer nossa economia."
 HOL_balanced_trade_policies_tt:0 "§GJá temos uma Política Comercial Mista! Este foco será ignorado§!"
 HOL_education_workforce_development:0 "Educação e Desenvolvimento da Força de Trabalho"
 HOL_education_workforce_development_desc:0 "Investir em programas de educação e capacitação da força de trabalho para que a população holandesa esteja preparada para os desafios de uma economia moderna."
 HOL_infrastructure_for_the_future:0 "Infraestrutura para o Futuro"
 HOL_infrastructure_for_the_future_desc:0 "Construir infraestrutura avançada em todos os Países Baixos, com foco em transporte, conectividade e modernização urbana."
 HOL_guardian_of_dutch_liberty:0 "Guardião da Liberdade Holandesa"
 HOL_guardian_of_dutch_liberty_desc:0 "A monarquia será um símbolo de liberdade e unidade, defendendo os valores holandeses e garantindo a liberdade de todos os cidadãos."
 HOL_royal_economic_control:0 "Controle Econômico Real"
 HOL_royal_economic_control_desc:0 "A monarquia assumirá o controle direto dos setores econômicos-chave para proteger a segurança nacional e garantir o crescimento sustentável."
 HOL_royal_patronage_of_culture:0 "Mecenato Real da Cultura"
 HOL_royal_patronage_of_culture_desc:0 "Apoiar a arte e a cultura holandesas por meio do mecenato real, promovendo a unidade e o orgulho de nosso patrimônio comum."
 HOL_royal_decree_for_heavy_industry:0 "Decreto Real da Indústria Pesada"
 HOL_royal_decree_for_heavy_industry_desc:0 "Emitir um decreto real para priorizar e expandir a indústria pesada, garantindo que os Países Baixos se tornem uma potência industrial de primeira linha."
 HOL_royal_decree_for_naval_industry:0 "Decreto Real da Indústria Naval"
 HOL_royal_decree_for_naval_industry_desc:0 "A monarquia focará em fortalecer a produção naval, garantindo nosso domínio marítimo e nossas rotas comerciais."
 HOL_royal_degree_industry_promotion:0 "Decreto Real de Promoção da Indústria"
 HOL_royal_degree_industry_promotion_desc:0 "Promover as indústrias holandesas por meio de diretrizes reais, incentivando a inovação e garantindo a prosperidade econômica."
 HOL_royal_control_of_trade:0 "Controle Real do Comércio"
 HOL_royal_control_of_trade_desc:0 "A monarquia supervisionará todo o comércio exterior, priorizando os interesses holandeses e reduzindo a dependência de potências estrangeiras."
 HOL_legacy_of_the_crown:0 "Legado da Coroa"
 HOL_legacy_of_the_crown_desc:0 "O legado da monarquia será consolidado como uma força de unidade, estabilidade e progresso, garantindo que os Países Baixos continuem sendo um farol de força e prosperidade."
 HOL_dynastic_claims:0 "Afirmar as Reivindicações Dinásticas"
 HOL_dynastic_claims_desc:0 "A monarquia buscará restaurar suas reivindicações dinásticas por toda a Europa, reafirmando sua influência e prestígio no continente."
 HOL_send_ultimatum_luxembourg:0 "Enviar Ultimato a Luxemburgo"
 HOL_send_ultimatum_luxembourg_desc:0 "O Grão-Ducado de Luxemburgo sempre foi parte essencial da história holandesa. Enviaremos um ultimato exigindo sua submissão ao domínio holandês, garantindo sua integração ao nosso reino sob a orientação da Coroa."
 HOL_send_ultimatum_ireland:0 "Enviar Ultimato à Irlanda"
 HOL_send_ultimatum_ireland_desc:0 "A história turbulenta da Irlanda oferece a oportunidade de reafirmar a influência holandesa sobre a ilha. Por meio de diplomacia estratégica e da autoridade real, exigiremos sua lealdade como Estado vassalo de nossa Coroa."
 HOL_send_ultimatum_england:0 "Enviar Ultimato à Inglaterra"
 HOL_send_ultimatum_england_desc:0 "O Reino Unido, outrora um rival e agora enfraquecido, apresenta uma oportunidade única para o domínio holandês. Invocando laços históricos e demonstrando a força da Coroa, enviaremos um ultimato exigindo sua submissão ao domínio holandês em uma união pessoal."
 HOL_throne_of_scotland:0 "Trono da Escócia"
 HOL_throne_of_scotland_desc:0 "A rica história entre os Países Baixos e a Escócia oferece a chance de uma reunificação sob a Coroa holandesa. Afirmando reivindicações dinásticas e a influência real, podemos trazer a Escócia para a nossa liderança."
 HOL_throne_of_scotland_tt:0 "Os efeitos serão exibidos quando o foco §YAfirmar as Reivindicações Dinásticas§! ou §YRealpolitik Holandesa§! for concluído "
 HOL_belgium_problem:0 "O Problema Belga"
 HOL_belgium_problem_desc:0 "A identidade fragmentada e as lealdades divididas da Bélgica apresentam uma oportunidade única. A monarquia liderará os esforços para dividir §Y[BEL.GetNameWithFlag]§!, redistribuindo suas terras entre os Países Baixos, a França e a Alemanha, garantindo a estabilidade na região e assegurando a lealdade flamenga à Coroa."
 HOL_dutch_realpolitik:0 "Realpolitik Holandesa"
 HOL_dutch_realpolitik_desc:0 "A monarquia adotará uma abordagem calculada da política europeia, usando sua influência para levar as nações vizinhas a uma união pessoal. Priorizando os interesses holandeses e usando a diplomacia, consolidaremos nosso domínio na Europa."
 HOL_dutch_realpolitik_tt:0 "Os efeitos deste foco serão exibidos quando o foco §YLegado da Coroa§! ou §YGuardião da Liberdade Holandesa§! for §Gconcluído§!"
 HOL_royal_economic_integration:0 "Integração Econômica Real"
 HOL_royal_economic_integration_desc:0 "A monarquia liderará os esforços para integrar as economias dos territórios holandeses, estimulando o comércio e a unidade."
 HOL_dutch_defence_pact:0 "Pacto de Defesa Holandês"
 HOL_dutch_defence_pact_desc:0 "Estabelecer um pacto de defesa liderado pelos holandeses para garantir a segurança e a soberania de nossos territórios e aliados."
 HOL_royal_media:0 "Campanha Real na Mídia"
 HOL_royal_media_desc:0 "Lançar uma campanha na mídia para promover a visão da monarquia e fortalecer o apoio público à liderança real."
 HOL_royal_real_projects:0 "Projetos Reais de Infraestrutura"
 HOL_royal_real_projects_desc:0 "Investir em projetos de infraestrutura em larga escala sob supervisão real, simbolizando o compromisso da Coroa com o progresso."
 HOL_royal_control_realm:0 "Controle Real do Reino"
 HOL_royal_control_realm_desc:0 "A monarquia consolidará o controle sobre todos os aspectos do governo, garantindo a realização da visão da Coroa de uns Países Baixos unidos e prósperos."
 HOL_VOC_tt:0 "Desbloqueia a §YLei de Ocupação de Supervisão do Governador da VOC§! para os §YTerritórios da VOC§!"
 HOL_territories_plan:0 "O Plano dos Territórios da VOC"
 HOL_territories_plan_desc:0 "Além da Indonésia está o legado mais amplo da VOC: regiões como Índia, Taiwan, Sri Lanka e África do Sul. Essas áreas foram parte integrante do império comercial holandês, e sua importância econômica e estratégica atual as torna o foco ideal de uma campanha de renovação da influência da VOC."
 HOL_financial_influence_india:0 "Expandir a Influência Financeira na Índia"
 HOL_financial_influence_india_desc:0 "A economia em expansão da Índia e seus centros financeiros representam uma oportunidade de ouro para a VOC. Investindo em suas indústrias e criando laços econômicos, podemos estender a proeminência holandesa sobre o subcontinente e controlar setores econômicos-chave."
 HOL_gujurat_trade_port:0 "Retomar o Porto Comercial de Guzerate"
 HOL_gujurat_trade_port_desc:0 "A cidade portuária de Surate, em Guzerate, foi um elo vital na rede comercial da VOC. Revigorando nossos laços com Guzerate, podemos ter acesso à sua economia próspera, controlando rotas comerciais e recursos vitais que fluem pelo Oceano Índico."
 HOL_finance_expansion_maharashtra:0 "Expansão Financeira em Maarastra"
 HOL_finance_expansion_maharashtra_desc:0 "Maarastra, sede de Mumbai, a capital financeira da Índia, é uma potência de produção industrial e comércio. Investindo estrategicamente em suas indústrias, podemos fincar a proeminência da VOC no coração da economia indiana."
 HOL_voc_economic_zone_india:0 "Zona Econômica da VOC na Índia"
 HOL_voc_economic_zone_india_desc:0 "Com o controle de Guzerate e Maarastra, podemos consolidar a proeminência holandesa criando uma Zona Econômica exclusiva da VOC. Isso nos dará acesso sem precedentes aos vastos recursos da Índia e garantirá nosso domínio no Sul da Ásia."
 HOL_taiwan_semiconductor_industry:0 "Influenciar a Indústria de Semicondutores de Taiwan"
 HOL_taiwan_semiconductor_industry_desc:0 "A indústria de semicondutores de Taiwan é a pedra angular da tecnologia global, com seus chips alimentando de smartphones a sistemas militares. Aproveitando os investimentos da VOC, podemos conquistar uma posição nesse setor crítico, garantindo o domínio tecnológico holandês."
 HOL_semiconductor_export_control_taiwan:0 "Controlar as Exportações de Semicondutores de Taiwan"
 HOL_semiconductor_export_control_taiwan_desc:0 "Dominando as cadeias de suprimento de semicondutores de Taiwan, podemos controlar o fluxo de tecnologia para o mundo. Isso dará aos Países Baixos enorme influência sobre os mercados globais e garantirá que a VOC continue sendo um árbitro-chave da inovação."
 HOL_reclaim_fort_zeelandia:0 "Retomar o Forte Zeelândia"
 HOL_reclaim_fort_zeelandia_desc:0 "O Forte Zeelândia foi outrora o centro da proeminência da VOC em Taiwan. Revivê-lo como um polo dos interesses holandeses servirá como ponto de apoio simbólico e estratégico na região, reforçando nosso controle sobre essa ilha vital."
 HOL_modernize_agriculture_srilanka:0 "Modernizar a Agricultura no Sri Lanka"
 HOL_modernize_agriculture_srilanka_desc:0 "O setor agrícola do Sri Lanka continua sendo parte essencial de sua economia, mas sofre com a ineficiência. Introduzindo técnicas agrícolas holandesas modernas, podemos estabilizar a produção local de alimentos e, ao mesmo tempo, estender a proeminência da VOC pela ilha."
 HOL_sustainable_agriculture_srilanka:0 "Promover a Agricultura Sustentável no Sri Lanka"
 HOL_sustainable_agriculture_srilanka_desc:0 "O futuro da VOC está em equilibrar a extração de recursos com a sustentabilidade. Implementando reformas agrícolas de ponta, podemos garantir a prosperidade de longo prazo do Sri Lanka e, ao mesmo tempo, estabelecer a liderança holandesa em inovação verde."
 HOL_colombo_port_control:0 "Controlar os Portos de Colombo"
 HOL_colombo_port_control_desc:0 "Os portos de Colombo são portas de entrada vitais para o comércio pelo Oceano Índico. Obter o controle desses portos consolidará o domínio holandês na região, garantindo à VOC influência sobre cadeias de suprimento críticas e o comércio marítimo."
 HOL_economic_zone_srilanka:0 "Zona Econômica da VOC no Sri Lanka"
 HOL_economic_zone_srilanka_desc:0 "Controlando os portos de Colombo e a agricultura do Sri Lanka, podemos consolidar a proeminência da VOC em uma poderosa zona econômica, garantindo recursos estratégicos e rotas comerciais no Oceano Índico."
 HOL_afrikaner_community_support:0 "Apoiar a Comunidade Africâner"
 HOL_afrikaner_community_support_desc:0 "A comunidade africâner da África do Sul tem profundos laços históricos com o patrimônio holandês. Apoiar esse grupo criará uma base de aliados locais, fortalecendo a influência da VOC e garantindo cooperação em regiões-chave."
 HOL_afrikaner_political_partnerships:0 "Forjar Parcerias Políticas Africâneres"
 HOL_afrikaner_political_partnerships_desc:0 "Aliando-nos a movimentos políticos africâneres, podemos estabilizar a proeminência da VOC na África do Sul e conter a resistência de outras facções, garantindo uma base sólida para os interesses holandeses na região."
 HOL_afrikaner_mining_operations:0 "Controlar as Operações de Mineração Africâneres"
 HOL_afrikaner_mining_operations_desc:0 "A riqueza mineral da África do Sul, incluindo platina e terras raras, é crítica para a indústria global. Controlando as operações de mineração lideradas por africâneres, podemos garantir esses recursos para as indústrias holandesas e consolidar o poder econômico da VOC."
 HOL_resupply_hub_afrika:0 "Polo de Reabastecimento na África do Sul"
 HOL_resupply_hub_afrika_desc:0 "O Cabo sempre foi um ponto vital de reabastecimento para o comércio holandês. Revivê-lo como polo estratégico garantirá que as frotas e as cadeias de suprimento holandesas operem sem interrupções pelos oceanos Atlântico e Índico."
 HOL_reclaim_crown_colony:0 "Retomar a Colônia da Coroa"
 HOL_reclaim_crown_colony_desc:0 "A Indonésia foi outrora a joia do império colonial holandês, servindo como o coração da proeminência da VOC no Sudeste Asiático. Retomá-la como Colônia da Coroa restaurará nossa reivindicação histórica e servirá de alicerce para uma renovada presença holandesa na região."
 HOL_reclaim_batavia:0 "Retomar Batávia"
 HOL_reclaim_batavia_desc:0 "Batávia, hoje Jacarta, foi outrora o centro das operações da VOC nas Índias Orientais. Retomar essa cidade histórica como nosso polo administrativo e logístico simbolizará o retorno do domínio holandês na região."
 HOL_secret_embassy_expansion:0 "Expandir as Operações Secretas de Embaixada"
 HOL_secret_embassy_expansion_desc:0 "Para minar a resistência à influência holandesa, devemos expandir discretamente nossa rede de embaixadas e operações de inteligência. Esses esforços encobertos abrirão caminho para um restabelecimento tranquilo do controle da VOC."
 HOL_reclaim_outer_islands:0 "Retomar as Ilhas Exteriores"
 HOL_reclaim_outer_islands_desc:0 "Além de Java estende-se a vasta extensão do arquipélago indonésio, rica em recursos e importância estratégica. Garantir o controle das ilhas exteriores fortalecerá nosso domínio sobre a região e fornecerá à VOC ativos vitais."
 HOL_contact_rebels_indonesia:0 "Contatar os Rebeldes Indonésios"
 HOL_contact_rebels_indonesia_desc:0 "Nem todos na Indonésia são leais ao governo atual. Apoiando secretamente dissidentes e grupos rebeldes, podemos desestabilizar a autoridade local e abrir caminho para o ressurgimento da VOC."
 HOL_rebuilding_dutch_indies:0 "Reconstruir as Índias Orientais Holandesas"
 HOL_rebuilding_dutch_indies_desc:0 "As Índias Orientais Holandesas foram outrora uma colônia próspera sob a administração da VOC. Para garantir estabilidade e prosperidade, devemos reconstruir sua infraestrutura, fortalecer a governança e restaurar sua posição como pilar da influência holandesa."
 HOL_rebuilding_batavia:0 "Reconstruir Batávia"
 HOL_rebuilding_batavia_desc:0 "Como centro histórico do governo holandês na Indonésia, Batávia deve ser revitalizada. Modernizar sua infraestrutura e capacidade administrativa a consolidará como polo das operações da VOC no Sudeste Asiático."
 HOL_indonesian_infrastructure_modernization:0 "Modernizar a Infraestrutura Indonésia"
 HOL_indonesian_infrastructure_modernization_desc:0 "A infraestrutura da Indonésia é a espinha dorsal de sua economia. Investindo em esforços de modernização, podemos melhorar as redes de transporte, aprimorar a extração de recursos e estabelecer a eficiência holandesa por todo o arquipélago."
 HOL_indonesian_industry_investment:0 "Investir na Indústria Indonésia"
 HOL_indonesian_industry_investment_desc:0 "O potencial industrial da Indonésia é vasto e, com investimentos holandeses, podemos liberá-lo. Expandindo fábricas e centros de produção, garantiremos o domínio econômico e a prosperidade de uma Indonésia liderada pela VOC."
 HOL_indonesian_resource_extraction:0 "Aprimorar a Extração de Recursos na Indonésia"
 HOL_indonesian_resource_extraction_desc:0 "Os recursos naturais da Indonésia, de especiarias a minerais, continuam críticos para o comércio global. Aprimorando nossa capacidade de extração de recursos, podemos garantir esses ativos para as indústrias holandesas e para a riqueza da VOC."
 HOL_terra_australis_claims:0 "Afirmar as Reivindicações sobre a Terra Australis"
 HOL_terra_australis_claims_desc:0 "Os holandeses estiveram entre os primeiros europeus a mapear as costas da Austrália. Afirmando reivindicações históricas sobre a Terra Australis, podemos expandir a proeminência da VOC e marcar nosso lugar no desenvolvimento desse continente rico em recursos."
 HOL_voc_australia_corridor:0 "Estabelecer o Corredor Comercial Australiano"
 HOL_voc_australia_corridor_desc:0 "Conectar a Austrália Ocidental ao resto da Austrália por meio de comércio e infraestrutura consolidará a proeminência holandesa na região. Esse corredor servirá como elo vital para recursos, comércio e integração econômica liderada pelos holandeses."
 HOL_malacca_trade_legacy:0 "Reviver o Legado Comercial de Malaca"
 HOL_malacca_trade_legacy_desc:0 "O Estreito de Malaca foi outrora uma artéria vital do comércio da VOC, ligando Oriente e Ocidente. Restabelecendo nosso domínio nessa região crítica, podemos garantir o controle das rotas do comércio global e reforçar o poder econômico holandês."
 HOL_economic_integration_malacca:0 "Integração Econômica de Malaca"
 HOL_economic_integration_malacca_desc:0 "As Índias Orientais Holandesas e os recém-anexados territórios de Malaca, Singapura e Brunei têm imenso potencial econômico. Para liberá-lo, propomos uma rede ferroviária moderna, inspirada na eficiência da Nederlandse Spoorwegen (NS), conectando essas regiões ao coração das Índias Orientais Holandesas. Essa rede aprimorará o comércio, fomentará a integração e consolidará o controle holandês sobre esses territórios estratégicos."
 HOL_strategic_voc_presence:0 "Estabelecer Presença Estratégica da VOC"
 HOL_strategic_voc_presence_desc:0 "Com o controle de territórios-chave que já estiveram sob domínio da VOC, podemos consolidar nossa presença como potência global. Estabelecer pontos de apoio estratégicos nessas regiões garantirá o domínio holandês na era moderna."
 HOL_strategic_voc_presence_tt:0 "Desbloqueia §Ydecisões§! para fortalecer a VOC aproveitando os pontos fortes e as especializações únicas de nossos territórios recém-adquiridos."
 HOL_personal_union_england:0 "União Pessoal com a Inglaterra"
 HOL_personal_union_england_desc:0 "Os laços históricos entre os Países Baixos e a Inglaterra são profundos, mas suas conexões políticas e reais foram frequentemente turbulentas. Navegando com cuidado pela diplomacia e aproveitando interesses comuns, podemos buscar uma união pessoal com a Inglaterra, unindo as duas coroas sob liderança holandesa e formando uma poderosa monarquia transnacional."
 HOL_personal_union_ireland:0 "União Pessoal com a Irlanda"
 HOL_personal_union_ireland_desc:0 "A importância estratégica da Irlanda e suas conexões culturais fazem dela uma valiosa adição a uma monarquia liderada pelos holandeses. Cultivando laços com líderes irlandeses e apresentando um argumento convincente em favor da união, podemos estabelecer uma união pessoal com a Irlanda, fortalecendo a influência da coroa holandesa nas Ilhas Britânicas."
 HOL_personal_union_luxembourg:0 "União Pessoal com Luxemburgo"
 HOL_personal_union_luxembourg_desc:0 "Luxemburgo, um vizinho pequeno, mas historicamente significativo, compartilha conexões reais com os Países Baixos. Enfatizando nossa história comum e oferecendo estabilidade política e econômica, podemos trazer Luxemburgo para o controle holandês por meio de uma união pessoal, criando uns Países Baixos históricos mais próximos e unidos."
 HOL_cape_economic_zone:0 "Zona Econômica do Cabo"
 HOL_cape_economic_zone_desc:0 "O Cabo da Boa Esperança sempre foi uma encruzilhada vital do comércio global. Estabelecendo uma Zona Econômica do Cabo, podemos transformar essa região em um polo próspero de comércio e indústria, garantindo que a influência holandesa domine as rotas estratégicas que ligam Europa, Ásia e África."
 HOL_repair_ties_with_USA:0 "Reparar os Laços com os Estados Unidos"
 HOL_repair_ties_with_USA_desc:0 "Apesar de nos termos afastado do caminho democrático e restabelecido a monarquia sob o Stadtholder, reconhecemos a importância estratégica de nos alinharmos aos Estados Unidos. Reparando nossas relações, podemos nos estabelecer como um Importante Aliado Extra-OTAN, garantindo segurança e benefícios econômicos mútuos e mantendo nossa soberania e tradições reais."
 HOL_wic_build_up_atlantic_fleet:0 "Fortalecer a Frota do Atlântico"
 HOL_wic_build_up_atlantic_fleet_desc:0 "Para retomar os territórios que um dia estiveram sob a WIC, precisamos de uma marinha capaz de projetar poder pelo Atlântico. Expandindo e modernizando nossa frota, garantiremos o domínio holandês dos mares e a capacidade de atacar de forma decisiva quando necessário."
 HOL_wic_increase_ranged_aircraft:0 "Expandir a Capacidade de Aeronaves de Longo Alcance"
 HOL_wic_increase_ranged_aircraft_desc:0 "Retomar os territórios da WIC exigirá o controle dos céus por vastas distâncias. Desenvolver e empregar aeronaves de longo alcance nos permitirá projetar poder aéreo pelo Atlântico e dar apoio crucial às operações navais e terrestres."
 HOL_wic_terrain_training:0 "Treinamento de Terreno Especializado"
 HOL_wic_terrain_training_desc:0 "As paisagens diversas dos territórios da WIC, de selvas densas a regiões costeiras, exigem que nossas tropas estejam plenamente preparadas para condições desafiadoras. Investindo em treinamento de terreno especializado, garantiremos que nossas forças possam se adaptar e superar qualquer obstáculo."
 HOL_wic_invasion_training:0 "Realizar Treinamento de Invasão Anfíbia"
 HOL_wic_invasion_training_desc:0 "Os territórios da WIC são protegidos por vastas extensões de oceano. Para retomá-los com sucesso, nossas forças devem dominar a arte da guerra anfíbia. Realizando um treinamento de invasão extensivo, podemos garantir o sucesso dos desembarques futuros."
 HOL_wic_trade_company:0 "Companhia Comercial da WIC"
 HOL_wic_trade_company_desc:0 "A Companhia das Índias Ocidentais foi outrora uma pedra angular da influência holandesa nas Américas e no Atlântico. Reviver essa instituição histórica nos permitirá dominar as redes comerciais e lançar as bases para a expansão econômica na região."
 HOL_wic_trade_company_tt:0 "Será desbloqueado ao escolher o §YFoco na Companhia Comercial§! para a §YWIC§!"
 HOL_wic_increase_embassy_personnel:0 "Aumentar o Pessoal das Embaixadas"
 HOL_wic_increase_embassy_personnel_desc:0 "A atuação diplomática é crítica para expandir nossa influência nos territórios da WIC. Aumentando o pessoal das embaixadas e os recursos diplomáticos, podemos fortalecer as relações e avançar os interesses holandeses no exterior."
 HOL_wic_financial_networks:0 "Expandir as Redes Financeiras"
 HOL_wic_financial_networks_desc:0 "Construir uma presença financeira robusta nos territórios da WIC garantirá o domínio holandês sobre suas economias. Integrando essas regiões aos nossos sistemas bancários, podemos consolidar a influência de longo prazo."
 HOL_wic_financial_networks_tt1:0 "§RAprimorar totalmente o§! §YING Group§! §Rampliará muito este bônus!§!"
 HOL_wic_financial_networks_tt2:0 "§GAgora estamos aproveitando todo o potencial de um§! §YING Group aprimorado.§!"
 HOL_wic_debt_policy:0 "Implementar a Diplomacia da Dívida"
 HOL_wic_debt_policy_desc:0 "Empréstimos estratégicos podem ser uma ferramenta poderosa de influência. Criando dependências financeiras por meio de empréstimos calculados, podemos garantir que os governos locais estejam alinhados aos interesses holandeses."
 HOL_wic_dutch_aid_program:0 "Lançar o Programa de Ajuda Holandês"
 HOL_wic_dutch_aid_program_desc:0 "A ajuda ao desenvolvimento pode fomentar boa vontade e cooperação nos territórios da WIC. Investindo em infraestrutura e nas economias locais, podemos abrir caminho para uma integração pacífica sob liderança holandesa."
 HOL_wic_colonial_management:0 "Fortalecer a Gestão Colonial da WIC"
 HOL_wic_colonial_management_desc:0 "As operações da Companhia das Índias Ocidentais exigem uma administração colonial eficiente para prosperar. Reforçando as estruturas de gestão e simplificando a governança, podemos maximizar a lucratividade de nossos territórios e garantir a estabilidade da influência holandesa pelo Atlântico."
 HOL_wic_colonial_management_tt:0 "Desbloqueia a §YLei de Ocupação de Gestão Colonial da WIC§! para os §YTerritórios da WIC§!"
 HOL_dutch_dakar:0 "Retomar Dacar e o Legado de Gorée"
 HOL_dutch_dakar_desc:0 "A ilha de Gorée, outrora um farol da presença holandesa na África Ocidental, foi deixada nas mãos de outros por tempo demais. Dacar, com sua localização estratégica e potencial econômico, representa uma oportunidade de retomar nossa influência histórica na região. Afirmando o controle sobre Dacar e seus territórios vizinhos, restauraremos o legado holandês no Senegal e estabeleceremos um polo vital de comércio e projeção de poder pelo Atlântico."
 HOL_goeree_reconstruction:0 "Reconstruir a Infraestrutura de Gorée"
 HOL_goeree_reconstruction_desc:0 "Com Gorée e seus territórios vizinhos sob controle holandês, é imperativo investir em infraestrutura moderna. Melhorando as redes de transporte, as instalações comerciais e a indústria local, podemos transformar a região em um próspero polo econômico e em um ativo vital para a influência holandesa na África Ocidental."
 HOL_goeree_reconstruction_tt:0 "Os efeitos serão exibidos se controlarmos §Y[363.GetName]§! ou §Y[364.GetName]§!"
 HOL_wic_africa:0 "Reafirmar as Reivindicações Holandesas na África"
 HOL_wic_africa_desc:0 "A presença holandesa na África foi outrora uma pedra angular da influência da Companhia das Índias Ocidentais, em especial em regiões estratégicas como o Cabo e o Senegal. Reafirmando nossas reivindicações históricas, podemos restaurar o controle holandês sobre esses territórios vitais e garantir um ponto de apoio para a expansão futura no continente."
 HOL_wic_caribbean:0 "Retomar o Legado Holandês no Caribe"
 HOL_wic_caribbean_desc:0 "O Caribe era o sangue vital da Companhia das Índias Ocidentais, uma região repleta de riqueza e oportunidades. Das plantações de açúcar aos principais polos comerciais, é hora de restabelecer nossa presença e trazer essas ilhas de volta ao seio da influência holandesa."
 HOL_wic_south_america:0 "Reafirmar a Influência Holandesa"
 HOL_wic_south_america_desc:0 "A América do Sul já carregou a marca da ambição holandesa, em especial em regiões ricas em recursos e oportunidades comerciais. Retomar nosso legado aqui não apenas restaurará a justiça histórica, mas também dará aos Países Baixos imensas vantagens econômicas e estratégicas."
 HOL_wic_new_holland:0 "Retomar Nova Holanda"
 HOL_wic_new_holland_desc:0 "Nova Holanda, que incluía a próspera colônia de Nova Amsterdã, a atual Nova York, foi um testemunho do espírito empreendedor e da ambição holandeses nas Américas. Embora tenha se perdido para a história, a região continua sendo um polo vital de comércio e influência. Reafirmando nossas reivindicações sobre esse território, restauraremos o prestígio holandês e reviveremos nossa presença em um dos centros econômicos mais importantes do mundo."
 HOL_wic_angola:0 "A Visão de Cornelis Jol para Angola"
 HOL_wic_angola_desc:0 "Cornelis Jol, o audacioso almirante holandês conhecido como 'Houtebeen' (Perna de Pau), deixou sua marca em Angola com seus esforços para assegurar a influência holandesa em Loango-Angola no auge da Companhia das Índias Ocidentais. Retomando essa região vital, rica em recursos e potencial estratégico, honramos seu legado e restauramos o domínio holandês na África. Angola voltará a ser um ponto de apoio fundamental para os Países Baixos."
 HOL_reclaim_puerto_rico:0 "Retomar San Juan Bautista"
 HOL_reclaim_puerto_rico_desc:0 "Antes vista como uma joia estratégica pelas potências coloniais europeias, Porto Rico, outrora chamada San Juan Bautista, sempre teve imensa importância para o comércio e a presença militar no Caribe. Retomando-a, restauramos a influência holandesa no coração do Mar do Caribe, reavivando as ambições da Companhia das Índias Ocidentais."
 HOL_reclaim_british_antilles:0 "Reafirmar o Controle sobre as Antilhas Britânicas"
 HOL_reclaim_british_antilles_desc:0 "As Antilhas Britânicas, incluindo ilhas como São Cristóvão e Neves, foram territórios disputados no auge da expansão europeia. Retomar essas ilhas nos permitirá restaurar um ponto de apoio crucial no Caribe, fortalecer as rotas marítimas holandesas e honrar o legado de nossas ambições coloniais."
 HOL_reclaim_trinidad:0 "Retomar Nova Walcheren"
 HOL_reclaim_trinidad_desc:0 "No início do século XVII, exploradores holandeses buscaram estabelecer influência sobre Trinidad, uma região rica em recursos e estrategicamente situada. Ela chegou a ser brevemente idealizada como Nova Walcheren, em homenagem à ilha holandesa na Zelândia. Reafirmar o controle sobre Trinidad garantirá rotas comerciais e recursos vitais no Caribe."
 HOL_wic_goldcoast:0 "Reafirmar o Controle sobre a Costa do Ouro"
 HOL_wic_goldcoast_desc:0 "A Costa do Ouro, com seus fortes lendários e ricos recursos, foi outrora parte vital das operações da Companhia Holandesa das Índias Ocidentais. Reafirmando o controle sobre essa região, podemos reviver o domínio econômico que um dia alimentou o império colonial holandês e garantir um ponto de apoio fundamental na África Ocidental."
 HOL_wic_congo:0 "Expandir a Influência para a Bacia do Congo"
 HOL_wic_congo_desc:0 "O Congo, rico em recursos naturais e estrategicamente situado, tem imenso potencial para nossas ambições. Estabelecendo o controle sobre essa região, podemos consolidar a influência holandesa na África Central e garantir rotas vitais de comércio e recursos que sustentam o legado da Companhia das Índias Ocidentais."
 HOL_wic_saint_helena:0 "O Polo de Reabastecimento da VOC"
 HOL_wic_saint_helena_desc:0 "Santa Helena foi uma estação de reabastecimento crítica para as frotas holandesas da VOC durante a Era da Vela, servindo de tábua de salvação para os navios que viajavam entre a Europa e as Índias Orientais. Retomando essa ilha, podemos restaurar sua importância estratégica como principal polo naval do Atlântico e reforçar nosso domínio marítimo global."
 HOL_wic_island_hubs:0 "Desenvolver Polos Comerciais Insulares"
 HOL_wic_island_hubs_desc:0 "As ilhas do Caribe, incluindo Curaçao, têm grande potencial econômico como polos vitais de comércio e recursos. Investindo em infraestrutura e indústrias locais, podemos transformar essas ilhas em potências econômicas que reforcem a influência holandesa e garantam seu papel como nós-chave das redes do comércio global."
 HOL_wic_fortress_islands:0 "Fortificar as Ilhas do Caribe"
 HOL_wic_fortress_islands_desc:0 "A posição estratégica de ilhas como Curaçao e as Antilhas as torna alvos principais de potências estrangeiras. Transformando essas ilhas em fortalezas, podemos assegurar nosso domínio sobre o Caribe, dissuadir possíveis agressores e garantir que sirvam de bastiões da defesa marítima holandesa."
 HOL_reclaim_suriname:0 "A Joia da Guiana Holandesa"
 HOL_reclaim_suriname_desc:0 "O Suriname, outrora a joia da coroa da Guiana Holandesa, foi uma pedra angular do nosso império colonial na América do Sul. Com seus ricos recursos naturais, terras férteis e localização estratégica, retomar o Suriname não apenas restauraria a influência holandesa nas Américas, mas também reavivaria as ambições da Companhia das Índias Ocidentais. É hora de trazer o Suriname de volta à bandeira holandesa."
 HOL_reclaim_guyana:0 "Unir a Guiana Holandesa"
 HOL_reclaim_guyana_desc:0 "Com o Suriname novamente sob controle holandês, nossas ambições na América do Sul estão longe de se completar. A Guiana, historicamente parte da disputada região das Guianas, deve ser trazida para a nossa influência para restaurar a unidade da Guiana Holandesa. Seus ricos recursos e sua posição estratégica no Atlântico a tornam uma adição vital ao nosso império em crescimento e um passo mais perto de reviver o legado da Companhia das Índias Ocidentais."
 HOL_reclaim_french_guyana:0 "Retomar a Guiana Francesa"
 HOL_reclaim_french_guyana_desc:0 "Com o Suriname assegurado e nosso ponto de apoio na América do Sul fortalecido, é hora de completar a unificação da região das Guianas. A Guiana Francesa, embora historicamente sob controle francês, sempre fez parte de nossas ambições mais amplas de domínio holandês nas Américas. Sua posição estratégica e seus recursos inexplorados a tornam uma adição necessária à nossa crescente influência."
 HOL_united_guyana_development:0 "Desenvolver os Territórios das Guianas Unidas"
 HOL_united_guyana_development_desc:0 "Com toda a Guiana Holandesa unida sob nosso controle, devemos focar na modernização de sua infraestrutura e indústria. Investindo em extensas ferrovias e instalações industriais, podemos transformar a região em um próspero polo econômico, conectando suas cidades e liberando todo o seu potencial para a economia holandesa."
 HOL_united_guyana_resources:0 "Explorar os Ricos Recursos das Guianas"
 HOL_united_guyana_resources_desc:0 "A região das Guianas unidas é abundante em recursos inexplorados, de bauxita a madeira e outros minerais. Focando na extração de recursos e na modernização das operações de mineração, podemos transformar os territórios em uma potência de matérias-primas, alimentando a indústria e o comércio holandeses por décadas."
 HOL_reclaim_usa:0 "Restaurar Nova Holanda"
 HOL_reclaim_usa_desc:0 "Nova Holanda, fundada no início do século XVII, foi um farol da exploração e do comércio holandeses na América do Norte. Ancorada em Nova Amsterdã, essa colônia foi um testemunho de nossa destreza marítima e mercantil antes de cair em mãos britânicas. Retomando essas terras, honraremos o legado de nossos antepassados, restabeleceremos a influência holandesa nas Américas e reescreveremos o curso da história."
 HOL_reclaim_brasil:0 "Retomar o Brasil Holandês"
 HOL_reclaim_brasil_desc:0 "No auge do século XVII, o Brasil Holandês, conhecido como Nova Holanda, era uma colônia próspera sob nosso controle. De Recife a Pernambuco, a Companhia Holandesa das Índias Ocidentais estabeleceu plantações, rotas comerciais e fortalezas que desafiaram o domínio ibérico na América do Sul. Embora tenhamos perdido esse território há séculos, retomá-lo restaurará a influência holandesa no Brasil e reavivará o legado de nossas ambições coloniais."
 HOL_march_on_binnenhof:0 "Marchar sobre o Binnenhof"
 HOL_march_on_binnenhof_desc:0 "O Binnenhof, sede da democracia holandesa, é um símbolo da velha e ineficaz ordem liberal. É hora de o NVU marchar sobre o Binnenhof, tomar o controle do governo e estabelecer uma nova era de liderança forte e decisiva. Os Países Baixos devem renascer sob a bandeira da unidade e da força."
 HOL_eliminate_political_opposition:0 "Eliminar a Oposição Política"
 HOL_eliminate_political_opposition_desc:0 "A dissidência e a subversão minam a visão do NVU para os Países Baixos. Devemos extirpar toda a oposição, sejam partidos políticos, sindicatos ou movimentos clandestinos, para garantir a estabilidade e a força do novo regime."
 HOL_military_independence:0 "Preservar a Independência Militar"
 HOL_military_independence_desc:0 "As forças armadas devem permanecer profissionais e livres de interferência política excessiva. Embora a lealdade ao NVU seja primordial, é essencial que os militares mantenham sua independência operacional para preservar a eficiência e a disciplina, evitando as armadilhas da politização explícita."
 HOL_loyal_army:0 "Construir um Exército Leal"
 HOL_loyal_army_desc:0 "Os militares devem ser purgados de dissidentes e influências subversivas. Por meio de treinamento e reforço ideológico, construiremos um exército inabalavelmente leal ao NVU e à sua visão para os Países Baixos."
 HOL_glorify_veterans:0 "Glorificar os Veteranos da Nação"
 HOL_glorify_veterans_desc:0 "Nossos veteranos deram tudo a serviço dos Países Baixos. Honrando seus sacrifícios e trazendo-os para a agenda do NVU, fortaleceremos os laços entre o povo e os militares."
 HOL_control_media_narrative:0 "Controlar a Narrativa da Mídia"
 HOL_control_media_narrative_desc:0 "A mídia é uma ferramenta poderosa para moldar a opinião pública. Colocando todas as formas de comunicação sob controle estatal, garantiremos que o povo holandês seja informado apenas por vozes alinhadas à visão de unidade e progresso do NVU."
 HOL_nationalistic_education_reform:0 "Reforma Educacional Nacionalista"
 HOL_nationalistic_education_reform_desc:0 "Nossas escolas devem servir de alicerce para uma sociedade disciplinada e patriótica. Reformando o sistema educacional para priorizar o orgulho e a lealdade nacionais, garantiremos que a próxima geração defenda os ideais do NVU."
 HOL_accelerate_national_industrialization:0 "Acelerar a Industrialização Nacional"
 HOL_accelerate_national_industrialization_desc:0 "Para construir uma economia forte e autossuficiente, devemos priorizar o rápido desenvolvimento industrial. Fábricas e infraestrutura modernas garantirão nosso lugar como potência econômica de primeira linha."
 HOL_establish_corporatist_economy:0 "Estabelecer uma Economia Corporativista"
 HOL_establish_corporatist_economy_desc:0 "O NVU alinhará os interesses do trabalho, da indústria e do Estado sob um modelo corporativista. Essa abordagem unificada eliminará a ineficiência e garantirá que a economia da nação opere em harmonia."
 HOL_expand_resource_extraction:0 "Expandir a Extração de Recursos"
 HOL_expand_resource_extraction_desc:0 "A força econômica dos Países Baixos depende de garantir os recursos necessários para a produção industrial e militar. Modernizando os esforços de extração, maximizaremos a produção e garantiremos um suprimento constante."
 HOL_pursue_technological_autarky:0 "Buscar a Autarquia Tecnológica"
 HOL_pursue_technological_autarky_desc:0 "A dependência estrangeira em tecnologia enfraquece nossa independência. Investindo em pesquisa e desenvolvimento de ponta, os Países Baixos alcançarão a autossuficiência tecnológica, garantindo seu futuro em um mundo imprevisível."
 HOL_german_youth_netherlands:0 "Programas da Juventude Alemã nos Países Baixos"
 HOL_german_youth_netherlands_desc:0 "A juventude é o futuro da nação. Introduzindo programas de treinamento e educação ideológica de inspiração alemã, incutiremos lealdade, disciplina e força na próxima geração de cidadãos holandeses."
 HOL_national_labor_programs:0 "Implementar Programas Nacionais de Trabalho"
 HOL_national_labor_programs_desc:0 "Mobilizar a força de trabalho sob iniciativas laborais dirigidas pelo Estado eliminará o desemprego e garantirá que todo cidadão contribua para a prosperidade da nação."
 HOL_stabilize_dutch_society:0 "Estabilizar a Sociedade Holandesa"
 HOL_stabilize_dutch_society_desc:0 "Com reformas abrangentes em andamento, garantir a estabilidade e a ordem da sociedade é primordial. Medidas para reduzir a dissidência e impor disciplina lançarão as bases do sucesso de longo prazo."
 HOL_german_blood:0 "Sangue Germânico"
 HOL_german_blood_desc:0 "Os laços de sangue e herança unem os povos germânicos. Os Países Baixos, como parte dessa linhagem comum, devem assumir o manto da liderança. Reunindo todos os povos germânicos, forjaremos uma união poderosa e inquebrantável, garantindo o domínio de nossa linhagem em toda a Europa."
 HOL_support_german_brothers:0 "Apoiar Nossos Irmãos Alemães"
 HOL_support_german_brothers_desc:0 "Os povos germânicos enfrentam divisão e adversidade há tempo demais. Oferecendo nosso apoio, tanto político quanto militar, fortaleceremos os laços entre nossas nações e abriremos caminho para um destino germânico unificado."
 HOL_claim_german_leadership:0 "Proclamar a Liderança dos Povos Germânicos"
 HOL_claim_german_leadership_desc:0 "Os Países Baixos devem assumir seu lugar de direito como líderes do mundo germânico. Afirmando nossa autoridade e unindo todos os povos germânicos sob uma só bandeira, criaremos uma união inquebrantável de força e herança."
 HOL_unite_with_germany:0 "Unir-se à Alemanha"
 HOL_unite_with_germany_desc:0 "A divisão dos povos germânicos é um estado antinatural. Integrando a Alemanha à nossa visão de unidade, consolidaremos o poder e construiremos uma base mais sólida para um império germânico."
 HOL_luftwafe_legacy:0 "Herdar o Legado da Luftwaffe"
 HOL_luftwafe_legacy_desc:0 "A Luftwaffe alemã já dominou os céus da Europa. Modernizando suas táticas e integrando suas inovações, estabeleceremos superioridade aérea em todo o continente, garantindo a segurança e o domínio de nossas forças."
 HOL_blitzkrieg_legacy:0 "Dominar o Legado da Blitzkrieg"
 HOL_blitzkrieg_legacy_desc:0 "A Alemanha revolucionou a guerra com a doutrina da Blitzkrieg, combinando velocidade e precisão para esmagar os inimigos. Refinando esse legado, desenvolveremos uma força militar imparável, capaz de vitórias rápidas e decisivas."
 HOL_siegfriedline:0 "O Escudo de Ferro"
 HOL_siegfriedline_desc:0 "As fronteiras ocidentais do mundo germânico devem permanecer impenetráveis a qualquer ameaça estrangeira. Construindo o 'Escudo de Ferro', estabeleceremos uma rede moderna de fortificações e defesas, simbolizando a força inabalável e a resiliência do povo germânico. Essa nova linha será um testemunho de nossa determinação e prontidão."
 HOL_anschluss: "Anschluss"
 HOL_anschluss_desc:0 "O destino da Áustria sempre esteve ligado aos povos germânicos. Reunindo a Áustria ao restante do Estado germânico, realizaremos a visão histórica de uma pátria germânica unida."
 HOL_austrian_mountaineers:0 "Legado da Guerra de Montanha"
 HOL_austrian_mountaineers_desc:0 "A história da Áustria é imbuída do domínio do combate em montanha, forjado nos ambientes alpinos hostis da Europa. Integrando esse legado às nossas forças armadas, garantiremos que todas as nossas unidades de infantaria sejam capazes de dominar o terreno montanhoso, transformando obstáculos naturais em vantagens estratégicas."
 HOL_german_brotherhood_of_nations:0 "Irmandade Germânica das Nações"
 HOL_german_brotherhood_of_nations_desc:0 "Para garantir o futuro dos povos germânicos, estabeleceremos uma facção de nações afins dedicadas à nossa visão comum. Essa Irmandade permanecerá unida na força, forjando uma aliança inquebrantável contra aqueles que buscam minar nosso destino."
 HOL_germanic_industrial_union:0 "Estabelecer a União Industrial Germânica"
 HOL_germanic_industrial_union_desc:0 "Um esforço industrial unificado entre as nações germânicas garantirá uma economia poderosa e autossuficiente. Coordenando a produção e compartilhando recursos, alcançaremos eficiência sem precedentes e dominaremos os mercados globais."
 HOL_germanic_infrastructure_efforts:0 "Lançar os Esforços de Infraestrutura Germânica"
 HOL_germanic_infrastructure_efforts_desc:0 "A Irmandade Germânica deve estar unida não só ideologicamente, mas também fisicamente. Desenvolvendo uma infraestrutura moderna que conecte nossos territórios, garantiremos o fluxo contínuo de recursos, bens e forças militares."
 HOL_rhineland_resources:0 "Recursos da Renânia"
 HOL_rhineland_resources_desc:0 "A Renânia é um tesouro de carvão, aço e outros recursos vitais. Modernizando suas operações de extração, alimentaremos as ambições industriais e militares da Irmandade Germânica."
 HOL_invite_austria:0 "Convidar a Áustria para a Irmandade"
 HOL_invite_austria_desc:0 "O lugar da Áustria no mundo germânico é inegável. Convidando a Áustria a se juntar à Irmandade das Nações, fortaleceremos nossa facção e traremos mais um bastião da herança germânica para o seio da aliança."
 HOL_austrian_mineral_wealth:0 "Riqueza Mineral Austríaca"
 HOL_austrian_mineral_wealth_desc:0 "As montanhas da Áustria são ricas em minerais críticos essenciais para a nossa indústria. Explorando esses recursos, garantiremos que a base industrial da Irmandade permaneça incomparável."
 HOL_railroad_of_germans:0 "Ferrovia dos Povos Germânicos"
 HOL_railroad_of_germans_desc:0 "Uma grandiosa ferrovia ligando as nações germânicas será a espinha dorsal da nossa Irmandade. Esse projeto ambicioso facilitará o comércio, a mobilização e a unidade, consolidando nosso domínio na Europa."
 HOL_kickstart_austrian_navy:0 "Dar Impulso à Marinha Austríaca"
 HOL_kickstart_austrian_navy_desc:0 "A falta de tradição naval da Áustria limitou sua influência nos mares, mas, com nossa expertise em construção naval, isso vai mudar. Aproveitando o legado holandês de domínio marítimo, estabeleceremos as capacidades navais da Áustria, tornando-a uma contribuinte vital para a projeção de poder da Irmandade Germânica."
 HOL_integrate_austrian_industries:0 "Integrar as Indústrias Austríacas"
 HOL_integrate_austrian_industries_desc:0 "As indústrias da Áustria são vitais para a força da Irmandade Germânica. Integrando plenamente sua base industrial ao nosso sistema econômico, garantiremos eficiência e produção incomparáveis em todo o Reich."
 HOL_fourth_reich:0 "Proclamar o Quarto Reich"
 HOL_fourth_reich_desc:0 "Chegou a hora de unir Alemanha, Áustria e Países Baixos em um único Estado germânico indomável. O Quarto Reich encarnará a força, a disciplina e a ambição dos povos germânicos, forjando um império que domina a Europa e além."
 HOL_unification_dietsland:0 "Unificação de Dietsland"
 HOL_unification_dietsland_desc:0 "Com a anexação de Flandres, a visão de uma Dietsland unificada está mais próxima do que nunca. Agora é essencial consolidar nosso controle, unificar a administração e reunir os povos holandês e flamengo sob uma só bandeira."
 HOL_integrate_flemish_army:0 "Integrar o Exército Flamengo"
 HOL_integrate_flemish_army_desc:0 "As unidades militares flamengas devem ser incorporadas às forças armadas holandesas para criar um exército unificado, disciplinado e eficiente. Essa integração garantirá que a força militar de Dietsland seja maior que a soma de suas partes."
 HOL_enforce_dutch_language:0 "Impor o Idioma Holandês"
 HOL_enforce_dutch_language_desc:0 "Para criar uma nação verdadeiramente unificada, o holandês deve ser o idioma oficial em toda a Dietsland. Implementando essa política, podemos fomentar uma identidade cultural comum e fortalecer a unidade nacional."
 HOL_enforce_dutch_language_tt:0 "§GReduz pela metade§! o custo dos §YFocos Nacionais§! de §YFlandres§!"
 HOL_rebuild_belgian_shipyards:0 "Reconstruir os Estaleiros Belgas"
 HOL_rebuild_belgian_shipyards_desc:0 "Os portos e estaleiros de Antuérpia e Zeebrugge são ativos inestimáveis. Modernizando essas instalações, podemos aumentar significativamente a capacidade de construção naval de Dietsland, reforçando tanto o comércio quanto o poder militar."
 HOL_glorify_dietsland:0 "Glorificar Dietsland"
 HOL_glorify_dietsland_desc:0 "Os esforços de propaganda devem enfatizar a força e a unidade de Dietsland. Glorificando nossas conquistas e fomentando o orgulho nacional, podemos consolidar a lealdade de nosso povo e projetar nossa visão para o mundo."
 HOL_integrate_flemish_defense_companies:0 "Integrar as Empresas de Defesa Flamengas"
 HOL_integrate_flemish_defense_companies_desc:0 "A indústria de defesa em Flandres tem grande potencial para o avanço de nossas capacidades militares. Integrando as empresas de defesa flamengas à rede de produção de Dietsland, podemos reforçar nossa capacidade de armar nossas forças com eficácia."
 HOL_integrate_flemish_defense_companies_tt:0 "Desbloqueia a §Yfabricante de aeronaves Sabca§!"
 HOL_flemish_industry_investments:0 "Investimentos na Indústria Flamenga"
 HOL_flemish_industry_investments_desc:0 "Os centros industriais de Flandres são vitais para o futuro econômico de Dietsland. Investindo nessas áreas, podemos estimular o crescimento econômico e consolidar nossa posição como potência industrial."
 HOL_harness_flemish_ports:0 "Aproveitar os Portos Flamengos"
 HOL_harness_flemish_ports_desc:0 "Os portos de Flandres são críticos para o acesso de Dietsland ao comércio global e à força naval. Investimentos estratégicos em Antuérpia e Zeebrugge garantirão que seu pleno potencial seja realizado, beneficiando tanto nossa economia quanto nossos militares."
 HOL_sgp_protect_sunday_rest:0 "Proteger a Santidade do Domingo"
 HOL_sgp_protect_sunday_rest_desc:0 "O sábado é um dia santo de descanso e adoração, conforme ordenado nas escrituras. Garantindo que as empresas fechem e a vida pública pare aos domingos, honramos essa tradição sagrada e fortalecemos a fé em nossas comunidades."
 HOL_sgp_religious_education_policy:0 "Ampliar a Educação Religiosa"
 HOL_sgp_religious_education_policy_desc:0 "A educação cristã é vital para incutir valores bíblicos na próxima geração. Financiando escolas religiosas e protegendo sua autonomia, preservamos o alicerce moral de nossa sociedade."
 HOL_sgp_support_large_families:0 "Promover as Grandes Famílias Cristãs"
 HOL_sgp_support_large_families_desc:0 "Uma população crescente de cidadãos fiéis é a chave para uma nação forte. Incentivando as famílias numerosas e garantindo seu amparo, asseguramos um futuro para nossa fé e nosso país."
 HOL_sgp_support_christian_unions:0 "Fortalecer os Sindicatos Cristãos"
 HOL_sgp_support_christian_unions_desc:0 "Os sindicatos cristãos oferecem um arcabouço moral vital para a defesa dos direitos dos trabalhadores. Fortalecendo essas organizações, garantimos um equilíbrio entre tratamento justo e ética bíblica no ambiente de trabalho."
 HOL_sgp_secure_rural_communities:0 "Proteger as Comunidades Rurais"
 HOL_sgp_secure_rural_communities_desc:0 "As áreas rurais são o coração da tradição e da fé holandesas. Investindo em infraestrutura rural, inovação agrícola e apoio aos pequenos agricultores, garantimos que essas comunidades continuem prosperando como bastiões da moralidade e da estabilidade."
 HOL_sgp_strengthen_defense:0 "Fortalecer a Defesa Nacional"
 HOL_sgp_strengthen_defense_desc:0 "Para proteger nossa soberania e nossa herança cristã, devemos manter uma força militar robusta. Reforçando nossas forças armadas e garantindo sua prontidão, protegemos a nação contra ameaças externas e internas."
 HOL_sgp_resist_secularism:0 "Resistir à Influência Secular"
 HOL_sgp_resist_secularism_desc:0 "O secularismo mina o alicerce moral de nossa sociedade. Promovendo os valores cristãos e combatendo a disseminação de ideologias seculares, o SGP preservará os Países Baixos como uma nação temente a Deus."
 HOL_gl_affordable_housing_program:0 "Programa de Habitação Acessível"
 HOL_gl_affordable_housing_program_desc:0 "Moradia é um direito humano básico. O GroenLinks enfrentará a crise habitacional construindo casas acessíveis e sustentáveis, garantindo que todo cidadão tenha acesso a um lugar seguro para morar."
 HOL_gl_biodiversity_protection:0 "Proteger a Biodiversidade"
 HOL_gl_biodiversity_protection_desc:0 "Os habitats naturais dos Países Baixos estão ameaçados. O GroenLinks liderará os esforços de conservação para proteger espécies ameaçadas, restaurar ecossistemas e garantir um ambiente próspero para as futuras gerações."
 HOL_gl_digital_innovation:0 "Fomentar a Inovação Digital"
 HOL_gl_digital_innovation_desc:0 "A tecnologia digital é a chave do futuro. Investindo em pesquisa de ponta e construindo uma infraestrutura digital robusta, o GroenLinks garantirá que os Países Baixos se tornem líderes no cenário tecnológico global."
 HOL_gl_international_solidarity:0 "Fortalecer a Solidariedade Internacional"
 HOL_gl_international_solidarity_desc:0 "Desafios globais exigem cooperação global. O GroenLinks trabalhará para promover a paz, os direitos humanos e o desenvolvimento sustentável por meio de um engajamento ativo em parcerias e organizações internacionais."
 HOL_gl_fair_trade_policy:0 "Implementar Políticas de Comércio Justo"
 HOL_gl_fair_trade_policy_desc:0 "O comércio global deve ser ético e sustentável. O GroenLinks defende acordos de comércio justo que priorizem padrões ambientais, direitos dos trabalhadores e a redução da desigualdade no mundo."
 HOL_gl_diversify_workforce:0 "Diversificar a Força de Trabalho"
 HOL_gl_diversify_workforce_desc:0 "Uma força de trabalho inclusiva é uma força de trabalho mais forte. O GroenLinks apoiará políticas que garantam igualdade de oportunidades a todos os cidadãos, independentemente de sua origem, para criar uma sociedade justa e harmoniosa."
 HOL_gl_transparent_governance:0 "Garantir um Governo Transparente"
 HOL_gl_transparent_governance_desc:0 "A confiança no governo se constrói sobre a responsabilização. O GroenLinks priorizará a transparência, garantindo que os cidadãos estejam informados e empoderados para cobrar seus líderes."
 HOL_gl_youth_empowerment:0 "Empoderar a Juventude"
 HOL_gl_youth_empowerment_desc:0 "A próxima geração é o futuro de nossa nação. O GroenLinks criará oportunidades para os jovens, amplificando suas vozes nas decisões e apoiando seu desenvolvimento."
 HOL_gl_energy_independence:0 "Alcançar a Independência Energética"
 HOL_gl_energy_independence_desc:0 "Ampliando a produção de energia renovável e modernizando a rede elétrica, o GroenLinks garantirá a independência energética enquanto faz a transição para um futuro verde e sustentável."
 HOL_reinstate_werkspoor:0 "Reativar a Werkspoor"
 HOL_reinstate_werkspoor_desc:0 "A Werkspoor, outrora símbolo da engenhosidade industrial holandesa, será revivida para liderar os esforços de produção nacional. Modernizando suas operações e investindo em infraestrutura, podemos devolver a essa empresa icônica sua antiga glória e impulsionar o crescimento econômico."
 HOL_curacao_oil_refinery_expansion:0 "Expandir a Refinaria de Petróleo de Curaçao"
 HOL_curacao_oil_refinery_expansion_desc:0 "Desde a década de 1910, Curaçao abriga uma das refinarias de petróleo mais estratégicas do Caribe. Ampliando sua capacidade e modernizando sua infraestrutura, podemos consolidar seu papel como ativo crítico para a economia holandesa e ator vital nos mercados globais de energia."
 HOL_aruba_aloe_trade_investments:0 "Revitalizar o Comércio de Aloe de Aruba"
 HOL_aruba_aloe_trade_investments_desc:0 "Aruba tem uma rica história no comércio de aloe vera, tendo sido outrora uma produtora global dominante. Investindo em técnicas agrícolas modernas e redes comerciais, podemos restaurar o lugar de Aruba como líder em exportações de aloe de alta qualidade e diversificar sua economia."
 HOL_bonaire_phosphate_mining:0 "Reinvestir nas Minas de Fosfato de Bonaire"
 HOL_bonaire_phosphate_mining_desc:0 "Outrora uma grande contribuinte para a economia de Bonaire, a mineração de fosfato declinou no início do século XX. Renovar os esforços para extrair e exportar esse valioso recurso de forma responsável pode restaurar a relevância econômica de Bonaire e, ao mesmo tempo, gerar empregos para as comunidades locais."
 HOL_curacao_industrial_expansion:0 "Expandir o Setor Industrial de Curaçao"
 HOL_curacao_industrial_expansion_desc:0 "Curaçao tem potencial inexplorado de crescimento industrial além de sua refinaria de petróleo tradicional. Estabelecendo instalações de manufatura e diversificando sua economia, podemos criar empregos e reduzir a dependência de uma única indústria."
 HOL_bonaire_infrastructure_improvement:0 "Melhorar a Infraestrutura de Bonaire"
 HOL_bonaire_infrastructure_improvement_desc:0 "O crescimento econômico de Bonaire é prejudicado por uma infraestrutura obsoleta. Modernizando estradas, portos e serviços públicos, podemos permitir melhor conectividade e apoiar os negócios locais, abrindo caminho para o desenvolvimento futuro."
 HOL_tulip_export_boost:0 "Expandir as Exportações de Tulipas"
 HOL_tulip_export_boost_desc:0 "As tulipas são há muito tempo um símbolo dos Países Baixos e uma pedra angular de nossas exportações agrícolas. Investindo em marketing e logística, podemos dominar os mercados globais de flores, garantindo que as tulipas holandesas enfeitem lares no mundo todo."
 HOL_markermeer_reclamation:0 "Recuperar o Markermeer"
 HOL_markermeer_reclamation_desc:0 "O Markermeer, um projeto icônico das obras do Zuiderzee, continua sendo uma oportunidade inexplorada para a engenhosidade holandesa. Recuperando suas terras férteis e otimizando-o para o desenvolvimento sustentável, podemos liberar um vasto potencial agrícola, estabelecer projetos de energia renovável e criar soluções habitacionais modernas para assegurar o futuro da nossa nação."
 HOL_delta_rhine_energy_corridor:0 "Desenvolver o Corredor Energético Delta-Reno"
 HOL_delta_rhine_energy_corridor_desc:0 "A região Delta-Reno é central para a infraestrutura energética dos Países Baixos. Modernizando sua rede elétrica e ampliando a produção de energia renovável ao longo do Reno, podemos transformar esse corredor em uma potência de energia sustentável, garantindo nossa independência energética e apoiando as iniciativas verdes europeias."
 HOL_asml_foundation_of_innovation:0 "Alicerce da Inovação"
 HOL_asml_foundation_of_innovation_desc:0 "A ASML, fundada em 1984, revolucionou a fabricação de semicondutores com suas máquinas de litografia. Investindo em sua pesquisa e iniciando a produção nacional de microchips, fazemos dos Países Baixos uma pedra angular do fornecimento global de chips e um ímã de receitas de alta tecnologia."
 HOL_asml_euv_technology:0 "Dominar a Litografia em Ultravioleta Extremo"
 HOL_asml_euv_technology_desc:0 "O desenvolvimento da litografia em Ultravioleta Extremo (EUV) pela ASML representa o ápice da fabricação de semicondutores. Acelerando a produção e a implantação de sistemas EUV, podemos garantir a liderança global em tecnologia de microchips."
 HOL_asml_global_supply_chain:0 "Proteger a Cadeia de Suprimentos Global da ASML"
 HOL_asml_global_supply_chain_desc:0 "Como fornecedora vital de equipamentos avançados de semicondutores, a ASML depende de uma complexa cadeia de suprimentos internacional. Protegendo essas conexões e formando parcerias estratégicas, podemos resguardar suas operações contra a instabilidade global."
 HOL_asml_strategic_partnerships:0 "Forjar Parcerias Estratégicas para a ASML"
 HOL_asml_strategic_partnerships_desc:0 "A ASML formou parcerias importantes com contratantes militares para integrar tecnologia avançada de semicondutores a sistemas de armas de ponta, garantindo que os Países Baixos continuem líderes em capacidades modernas de defesa."
 HOL_asml_dutch_technological_dominance:0 "Estabelecer o Domínio Tecnológico"
 HOL_asml_dutch_technological_dominance_desc:0 "A ASML é mais que uma empresa; é um símbolo da inovação holandesa e da influência global. Redobrando os investimentos em setores de alta tecnologia, podemos estabelecer os Países Baixos como líder inatacável em tecnologias avançadas."
 HOL_tullip_bonus:0 "Exportações de Tulipas"
 HOL_tullip_bonus_desc:0 "Está em andamento um esforço nacional para dominar o comércio global de tulipas. Essa iniciativa temporária aumenta a capacidade de produção e exportação, trazendo uma onda de atividade econômica e reforçando a reputação dos Países Baixos como a capital mundial das tulipas."
 HOL_global_vision:0 "A Visão Global Holandesa"
 HOL_global_vision_desc:0 "Os Países Baixos sempre foram uma nação de comerciantes e diplomatas. Embora a Europa continue sendo um foco importante, devemos estender nosso alcance além de Bruxelas e nos engajar diretamente com parceiros globais para garantir nosso futuro."
 HOL_atlantic_defence_commitments:0 "Compromissos de Defesa Atlântica"
 HOL_atlantic_defence_commitments_desc:0 "Com o aumento das tensões globais, a OTAN continua sendo o alicerce da segurança holandesa. Reafirmando nosso compromisso com a aliança, podemos garantir cooperação em defesa e vantagens tecnológicas de nossos aliados."
 HOL_joint_military_programs:0 "Programas Militares Conjuntos"
 HOL_joint_military_programs_desc:0 "Os conflitos modernos exigem cooperação avançada. Firmar parcerias com os aliados da OTAN em programas militares conjuntos nos dará acesso a tecnologia de ponta e fortalecerá nosso setor de defesa nacional."
 HOL_maritime_security_leadership:0 "Liderança em Segurança Marítima"
 HOL_maritime_security_leadership_desc:0 "Os Países Baixos são uma nação marítima, e nossa segurança depende de rotas marítimas abertas. Ampliando nosso papel na segurança naval internacional, podemos fortalecer nossa influência global e nossa segurança econômica"
 HOL_economic_development_antilles:0 "Revitalização Econômica do Caribe Holandês"
 HOL_economic_development_antilles_desc:0 "O Caribe Holandês há muito enfrenta instabilidade econômica, dependência do turismo e infraestrutura subdesenvolvida. Implementando políticas inspiradas no Rijksdienst Caribisch Nederland, podemos investir em indústrias sustentáveis, melhorar a eficiência comercial e modernizar as bases econômicas das ilhas."
 HOL_deepwater_water_expansion_program:0 "Expansão dos Portos de Águas Profundas do Caribe"
 HOL_deepwater_water_expansion_program_desc:0 "Com o crescimento do comércio internacional, ampliar os portos de Willemstad, Oranjestad e Philipsburg transformará o Caribe Holandês em um polo global de logística marítima. Modernizando esses portos com a expertise de Roterdã, podemos atrair empresas de transporte marítimo internacionais e aumentar a produção econômica."
 HOL_revitilaze_dutch_latin_trade:0 "Revitalizar as Rotas Comerciais Holandesas–América Latina"
 HOL_revitilaze_dutch_latin_trade_desc:0 "Por séculos, os mercadores holandeses desempenharam papel fundamental no comércio sul-americano e caribenho. Reformulando os acordos comerciais por meio das Câmaras de Comércio Holandesas na América Latina (Holland House Network), podemos fortalecer os laços econômicos e restaurar a influência holandesa no comércio regional."
 HOL_dutch_latin_energy_cooperation:0 "Cooperação Energética Holandesa–América Latina"
 HOL_dutch_latin_energy_cooperation_desc:0 "A América Latina é rica em recursos naturais, e empresas holandesas como a Royal Dutch Shell e a SBM Offshore há muito atuam na perfuração offshore e em energia renovável. Fortalecer a cooperação energética nos permitirá garantir acordos estratégicos de petróleo, GNL e energia renovável."
 HOL_caribbean_naval_initiative:0 "Programa de Expansão Naval do Caribe Holandês"
 HOL_caribbean_naval_initiative_desc:0 "O Caribe continua vulnerável à pirataria, ao contrabando e a tensões geopolíticas. Fortalecer a presença da Marinha Real Holandesa na Marinekazerne Parera e na Base Aérea de Hato permitirá implantações rápidas, patrulhas aprimoradas e melhor cooperação com a OTAN e aliados regionais."
 HOL_dutch_caribbean_coast_guard:0 "Modernizar a Guarda Costeira do Caribe Holandês"
 HOL_dutch_caribbean_coast_guard_desc:0 "A Kustwacht Caribisch Gebied desempenha papel vital em operações antinarcóticos e na segurança marítima. Ampliar sua frota com patrulheiros dos Estaleiros Damen e aumentar os exercícios conjuntos com a Guarda Costeira dos EUA garantirá a estabilidade regional e o controle estratégico holandês."
 HOL_joint_defense_latin_america:0 "Pacto de Defesa Conjunta com a América Latina"
 HOL_joint_defense_latin_america_desc:0 "A segurança regional na América Latina está cada vez mais frágil, com o crime organizado, disputas de fronteira e a competição geopolítica em alta. Fortalecer a cooperação em defesa por meio da Junta Interamericana de Defesa e de programas de treinamento militar com Brasil, Colômbia e México reforçará nossa influência e protegerá nossos interesses."
 HOL_dutch_caribbean_federation:0 "A Proposta de Federação do Caribe Holandês"
 HOL_dutch_caribbean_federation_desc:0 "O status político do Caribe Holandês continua fragmentado, com graus variados de autonomia entre Aruba, Curaçao, Sint Maarten e as ilhas BES. Uma estrutura federal, inspirada no arcabouço já existente do Reino, concederia representação igualitária, integração econômica e estabilidade de governo."
 HOL_autonomy_development_pact:0 "Pacto de Desenvolvimento da Autonomia do Caribe"
 HOL_autonomy_development_pact_desc:0 "Garantir a autonomia econômica e política do Caribe Holandês é fundamental para manter a estabilidade. Um pacto formal de autonomia, inspirado na Carta de 1954 para o Reino dos Países Baixos, concederá maior autogoverno e manterá as ilhas sob a proteção e a política econômica holandesas."
 HOL_bijzondere_gemeenten:0 "Integração das Ilhas BES"
 HOL_bijzondere_gemeenten_desc:0 "As ilhas de Bonaire, Santo Eustáquio e Saba detêm atualmente o status de bijzondere gemeenten (municípios especiais) dentro dos Países Baixos. Fortalecer sua integração legal e econômica com o território continental proporcionará melhores serviços públicos, infraestrutura e estabilidade financeira."
 HOL_dutch_american_friendship:0 "Primeiros Amigos"
 HOL_dutch_american_friendship_desc:0 "Há séculos, os Países Baixos e os Estados Unidos mantêm fortes laços diplomáticos, econômicos e militares. À medida que os cenários global de segurança e econômico mudam, devemos reafirmar essa parceria e construir para o futuro."
 HOL_operation_market_vision:0 "Operação Market Vision"
 HOL_operation_market_vision_desc:0 "Com base em nossa história militar comum, podemos fortalecer a cooperação holandesa-americana por meio de exercícios de treinamento conjuntos, compartilhamento de inteligência e parcerias na indústria de defesa."
 HOL_suriname_alignment:0 "Alinhamento Estratégico com o Suriname"
 HOL_suriname_alignment_desc:0 "Apesar dos laços históricos e do idioma comum, as relações entre Países Baixos e Suriname permanecem cautelosas desde a independência do Suriname, em 1975. Fomentando uma abordagem diplomática renovada, podemos estabelecer uma base cooperativa para a influência regional, o intercâmbio cultural e o engajamento econômico na América do Sul."
 HOL_suriname_trade_development_agreement:0 "Acordo de Comércio e Desenvolvimento"
 HOL_suriname_trade_development_agreement_desc:0 "Por meio de negociações bilaterais, buscaremos um acordo abrangente de comércio e desenvolvimento com o Suriname. Esse pacto fortalecerá o acesso mútuo aos mercados, melhorará a infraestrutura portuária e promoverá o investimento holandês na agricultura, na logística e nos recursos naturais surinameses."
 HOL_educational_cultural_exchange_program:0 "Programa de Intercâmbio Educacional e Cultural"
 HOL_educational_cultural_exchange_program_desc:0 "Construir laços duradouros exige mais do que economia. Exige pessoas. Estabeleceremos um programa de intercâmbio educacional e cultural entre instituições holandesas e surinamesas, apoiando bolsas acadêmicas, programas de língua holandesa e iniciativas de preservação do patrimônio."
 HOL_rebuild_infrastructure_paramaribo:0 "Reconstruir a Infraestrutura de Paramaribo"
 HOL_rebuild_infrastructure_paramaribo_desc:0 "A capital, Paramaribo, precisa urgentemente de investimento em infraestrutura. Valendo-nos da expertise holandesa em planejamento urbano e de fundos de desenvolvimento regional, financiaremos novas estradas, restauraremos a arquitetura da era colonial e modernizaremos a logística para apoiar o crescimento econômico do Suriname."
 HOL_invest_suriname_resources:0 "Investir no Setor de Recursos"
 HOL_invest_suriname_resources_desc:0 "O Suriname possui riquezas inexploradas em ouro, bauxita e reservas de petróleo offshore. Por meio de joint ventures e contratos de exploração com empresas holandesas, podemos revitalizar os setores de mineração e recursos, garantindo ao mesmo tempo uma extração sustentável de longo prazo e uma divisão justa dos lucros."
 HOL_maritime_suriname_agreement:0 "Acordo Marítimo com o Suriname"
 HOL_maritime_suriname_agreement_desc:0 "A segurança e o comércio marítimos são essenciais para o futuro do Suriname. Assinando um acordo marítimo bilateral, viabilizaremos patrulhas conjuntas, assistência holandesa em infraestrutura costeira e rotas comerciais seguras ligando Paramaribo à economia do Caribe e do Atlântico."
 HOL_train_suriname_forces:0 "Treinar as Forças Armadas do Suriname"
 HOL_train_suriname_forces_desc:0 "Para apoiar a estabilidade e a soberania na região, lançaremos um programa de assistência militar para treinar as forças armadas do Suriname. Com foco em logística, operações antinarcóticos e capacidades de manutenção da paz, essa parceria aprofundará os laços de defesa e fortalecerá a segurança local."
 HOL_buildup_atlantic_fleet_idea:0 "Expansão da Frota do Atlântico"
 HOL_buildup_atlantic_fleet_idea_desc:0 "Os Países Baixos estão investindo pesadamente na expansão e modernização de sua frota do Atlântico para recuperar o domínio sobre rotas marítimas vitais. Uma marinha poderosa será a espinha dorsal de nossos esforços para assegurar os antigos territórios da Companhia das Índias Ocidentais e projetar a força holandesa pela região."
 HOL_country_prepare_for_the_dutch1:0 "Preparar-se para a Agressão Holandesa"
 HOL_country_prepare_for_the_dutch_desc1:0 "Os Países Baixos começaram a mobilizar suas forças e a se preparar para uma campanha de retomada de territórios que consideram parte de seu legado histórico. Devemos fortalecer nossas defesas e mobilizar nosso povo para resistir a essa ameaça iminente."
 HOL_country_prepare_for_the_dutch2_tt:0 "§YEnvia uma oferta a todos os países que se preparam contra a Agressão [HOL.GetAdjective] para ingressarem em uma aliança defensiva contra [HOL.GetNameWithFlag].\n A aliança defensiva convocará seus membros à guerra se um deles for atacado por [HOL.GetNameWithFlag]!§! "
 HOL_non_functioning_government:0 "Governo Disfuncional"
 HOL_non_functioning_government_desc:0 "O retorno da autoridade real deixou o governo paralisado. A ineficiência burocrática, a instabilidade política e a diminuição da confiança internacional enfraqueceram a governança e a posição diplomática da nação."
 HOL_strengthening_states:0 "Estados Fortalecidos"
 HOL_strengthening_states_desc:0 "Os Estados Gerais agora trabalham em colaboração com a monarquia, fomentando uma estrutura de governo mais equilibrada e eficaz. A estabilidade está melhorando e os custos administrativos estão sendo controlados."
 HOL_constitutional_reforms:0 "Monarquia Constitucional"
 HOL_constitutional_reforms_desc:0 "A monarquia opera dentro do arcabouço de uma constituição, garantindo papéis de governo claros e reduzindo a ineficiência. A estabilidade retornou e a influência de potências estrangeiras diminuiu."
 HOL_empowering_local_governments:0 "Empoderar os Governos Locais"
 HOL_empowering_local_governments_desc:0 "Concedendo mais autonomia aos governos locais, podemos garantir que cada província contribua com eficácia para a visão da Coroa de uma Holanda unida."
 HOL_centralized_governance:0 "Governo Centralizado"
 HOL_centralized_governance_desc:0 "Centralizar o governo sob a autoridade da Coroa para garantir que as decisões sejam tomadas no interesse da unidade e da estabilidade da nação."
 HOL_restore_nobility_influence:0 "Restaurar a Influência da Nobreza"
 HOL_restore_nobility_influence_desc:0 "Reintegrar a nobreza em posições de influência, criando uma base leal para a monarquia e fortalecendo as estruturas tradicionais."
 HOL_royal_patronage_culture:0 "Renascimento Cultural Real"
 HOL_royal_patronage_culture_desc:0 "Por meio do mecenato real ativo, o orgulho cultural e a unidade nacional estão sendo revitalizados. A monarquia tornou-se um símbolo unificador, fortalecendo tanto a identidade da nação quanto sua estabilidade."
 HOL_nobility_backed_military:0 "Forças Armadas Apoiadas pela Nobreza"
 HOL_nobility_backed_military_desc:0 "Fortalecer as forças armadas envolvendo nobres leais em cargos de comando, garantindo seu compromisso com a defesa da monarquia."
 HOL_NAM1: "Nederlandse Aardolie Maatschappij"
 HOL_NAM1_desc:0 "A Nederlandse Aardolie Maatschappij (NAM) é uma empresa holandesa de petróleo e gás fundada em 1947 como joint venture entre a Shell e a ExxonMobil. A NAM é a maior produtora de gás natural dos Países Baixos, responsável pela exploração, produção e distribuição de gás natural e petróleo, principalmente do campo de gás de Groningen. A empresa desempenha há décadas um papel significativo no setor energético holandês."
 HOL_Dutch_Agriculture0:0 "Agricultura Holandesa"
 HOL_Dutch_Agriculture0_desc:0 "A agricultura holandesa é um exemplo notável de eficiência e inovação, fazendo dos Países Baixos um dos maiores produtores agrícolas do mundo apesar de sua área territorial relativamente pequena. O país é líder global em agricultura de alta tecnologia, incluindo cultivo em estufas, agricultura de precisão e práticas sustentáveis. Essas inovações permitem que os agricultores holandeses produzam grandes quantidades de alimentos com impacto ambiental mínimo, usando tecnologias de ponta para otimizar o uso de água, energia e nutrientes. Os Países Baixos também são grandes exportadores de uma ampla gama de produtos agrícolas, de hortaliças e flores a laticínios e carne. Essa combinação de tecnologia avançada, sustentabilidade e produtividade posicionou a agricultura holandesa como uma potência na indústria alimentícia global."
 HOL_European_Railway_Developments_idea:0 "Desenvolvimentos Ferroviários Europeus"
 HOL_European_Railway_Developments_idea_desc:0 "Os Países Baixos têm participado ativamente da expansão e modernização da rede ferroviária europeia, contribuindo para projetos que visam aumentar a mobilidade transfronteiriça, reduzir tempos de viagem e promover o transporte sustentável. Entre os principais desenvolvimentos está a integração do sistema ferroviário holandês a redes de alta velocidade como o Thalys e o Eurostar, que conectam grandes cidades holandesas, como Amsterdã e Roterdã, a Paris, Londres e Bruxelas. Além disso, os Países Baixos são grandes defensores da iniciativa TEN-T (Rede Transeuropeia de Transportes), que busca criar uma rede ferroviária integrada em toda a Europa, melhorando os serviços de passageiros e de carga."
 HOL_Water_Sector1:0 "Mestres da Água"
 HOL_Water_Sector1_desc:0 "O setor hídrico holandês é reconhecido mundialmente por sua expertise na gestão da água, impulsionada pela geografia singular dos Países Baixos, onde grande parte do território fica abaixo do nível do mar. Engenheiros e empresas holandeses são líderes no desenvolvimento de soluções inovadoras para controle de enchentes, purificação da água e uso sustentável dos recursos hídricos. O país foi pioneiro na construção de infraestruturas avançadas como diques, barreiras contra marés de tempestade e sistemas de pôlderes, cruciais para controlar os níveis de água e prevenir inundações. Internacionalmente, o setor hídrico holandês é muito respeitado, e especialistas holandeses participam com frequência de projetos globais de proteção costeira, gestão de águas urbanas e adaptação climática. Essa combinação de tecnologia de ponta, séculos de experiência e compromisso com a sustentabilidade faz do setor hídrico holandês um contribuinte vital para enfrentar os desafios hídricos globais."
 HOL_SGM_Idea: "Spring Global Mail"
 HOL_SGM_Idea_desc:0 "A Spring Global Mail é uma provedora internacional de serviços postais e logísticos, originalmente criada como joint venture entre a TNT Post (hoje PostNL) e a Royal Mail. A empresa é especializada em soluções postais transfronteiriças, oferecendo serviços que incluem a entrega de encomendas, mala direta e correspondência empresarial em todo o mundo. A Spring Global Mail é conhecida por sua expertise na gestão de fluxos postais internacionais, aproveitando uma rede que abrange mais de 190 países. A empresa atende negócios de todos os portes, oferecendo soluções sob medida para e-commerce, marketing direto e correspondência empresarial global, com forte foco em eficiência, confiabilidade e custo-benefício."
 HOL_Marine_Modified:0 "Transferência dos Fuzileiros Parcialmente Concluída"
 HOL_Marine_Modified_desc:0 "Devido a preocupações públicas e a um compromisso político, o plano de transferência dos Fuzileiros foi modificado. Embora a nova base em Vlissingen esteja funcional, os benefícios plenos da mudança não foram alcançados."
 HOL_Marechausee1: "Koninklijke Marechaussee"
 HOL_Marechausee1_desc:0 "A Koninklijke Marechaussee, ou Marechaussee Real Holandesa, é uma força de gendarmaria que opera sob o Ministério da Defesa holandês. Ela é responsável por uma ampla gama de tarefas de segurança e aplicação da lei, tanto nos Países Baixos quanto no exterior. Entre suas principais funções estão a segurança de fronteiras, o policiamento militar e a proteção da família real e de autoridades do governo. A Marechaussee também desempenha papel crucial no combate ao crime organizado, ao tráfico de pessoas e ao terrorismo, e participa de missões internacionais de manutenção da paz. Conhecida por sua versatilidade e capacidades especializadas, a Koninklijke Marechaussee é um componente vital da infraestrutura de segurança nacional dos Países Baixos."
 HOL_Economic_Landscape_Start:0 "Panorama Econômico Holandês"
 HOL_Economic_Landscape_Start_desc:0 "Analisar e compreender o panorama econômico singular dos Países Baixos é crucial. Focando nos pontos fortes e nos desafios de nossas regiões diversas, podemos criar políticas econômicas sob medida para maximizar o crescimento e a estabilidade em todo o país."
 HOL_DBB_tt:0 "Reduz as chances de §YLíderes Políticos§! serem assassinados."
 HOL_Weed_Center1_tt: "[additional_income_HOL_Weed_Center1]"
 HOL_Monarchy_Law_Blocking_tt:0 "£political_power_texticon  Custo de Mudança de Lei: §R+1000%§!  "
 HOL_social_innovation_idea:0 "Movimento de Inovação Social"
 HOL_social_innovation_idea_desc:0 "Os Países Baixos tornaram-se um polo de inovação social, fomentando novas ideias e soluções criativas para enfrentar os desafios mais urgentes da sociedade. Esse movimento levou a avanços significativos na pesquisa e desenvolvimento civil, impulsionando o progresso tecnológico e a produtividade nacional."
 HOL_democracy_reform1:0 "Movimento de Reforma Política"
 HOL_democracy_reform1_desc:0 "O LPF impulsiona uma onda de reforma política nos Países Baixos, rompendo com os cartéis partidários arraigados e defendendo a democracia direta. Ao empoderar os cidadãos por meio de referendos, reduzir a influência dos políticos de carreira e enxugar as instituições governamentais, o LPF está remodelando a governança holandesa para ser mais transparente, responsável e verdadeiramente representativa da vontade do povo."
 HOL_welfare_reform_idea:0 "Reformulação do Sistema de Bem-Estar"
 HOL_welfare_reform_idea_desc:0 "O LPF está reestruturando o sistema de bem-estar social para priorizar a sustentabilidade e a responsabilidade pessoal. Ao reduzir a dependência e oferecer apoio direcionado a quem realmente precisa, essas reformas garantem que o sistema de bem-estar sustente uma população resiliente e autossuficiente, ao mesmo tempo que alivia o fardo dos contribuintes."
 HOL_public_sector_reform_idea:0 "Campanha de Eficiência do Setor Público"
 HOL_public_sector_reform_idea_desc:0 "O LPF está empenhado em enxugar o setor público, eliminando ineficiências burocráticas e promovendo gastos responsáveis. Esta reforma melhorará a prestação de serviços essenciais, reduzirá os custos administrativos e redirecionará os esforços do governo para servir o povo holandês com eficácia."
 HOL_reformed_liberal_market:0 "Mercado de Trabalho e Sociedade Reformados"
 HOL_reformed_liberal_market_desc:0 "Com um sistema de bem-estar reformado, um mercado de trabalho liberalizado e um setor público enxuto, os Países Baixos tornaram-se um modelo de eficiência e autossuficiência. Essas reformas priorizam a responsabilidade pessoal, reduzem a intervenção do governo e incentivam o crescimento econômico, criando uma economia resiliente e sustentável que beneficia todos os cidadãos."
 HOL_anti_islam1:0 "Medidas Restritivas"
 HOL_anti_islam1_desc:0 "O governo introduziu medidas restritivas iniciais contra símbolos, escolas e instituições islâmicas, com o objetivo de proteger os valores culturais holandeses. Essas políticas visam promover uma sociedade coesa, alinhada a princípios seculares e nacionais."
 HOL_anti_islam2:0 "Política de Assimilação Cultural"
 HOL_anti_islam2_desc:0 "Com políticas mais rígidas em vigor, o governo intensificou seu foco na assimilação cultural, reprimindo instituições e práticas islâmicas para reforçar a identidade e a unidade holandesas. Essas políticas buscam superar as divisões sociais por meio de expectativas culturais unificadas."
 HOL_anti_islam3:0 "Proibições Generalizadas"
 HOL_anti_islam3_desc:0 "O governo implementou proibições generalizadas a símbolos e práticas islâmicas, vistos como barreiras à coesão nacional. Essas medidas visam consolidar uma sociedade holandesa secular e aumentar a segurança pública."
 HOL_anti_islam4:0 "Criminalização Total dos Símbolos Islâmicos"
 HOL_anti_islam4_desc:0 "Símbolos, textos e instituições islâmicas foram totalmente criminalizados, com o governo alegando compromisso com a ordem pública, a unidade nacional e o secularismo. Essa postura extrema reforça a visão da administração de Países Baixos culturalmente homogêneos e seguros."
 HOL_made_in_holland1: "Made in Holland"
 HOL_made_in_holland1_desc:0 "Uma ênfase renovada nos produtos fabricados na Holanda apoia as indústrias locais, fomenta o orgulho nacional e fortalece a resiliência econômica. Ao priorizar produtos feitos dentro de nossas fronteiras, reforçamos a economia holandesa e promovemos a autossuficiência, garantindo que o 'Made in Holland' se torne uma marca de qualidade e identidade."
 HOL_work_efforts:0 "Esforços Nacionais de Trabalho"
 HOL_work_efforts_desc:0 "Com foco em revitalizar a força de trabalho, o governo lançou iniciativas em todo o país para aumentar o emprego e a produtividade. Por meio de programas de treinamento profissional, apoio às indústrias essenciais e incentivos à participação na força de trabalho, esses esforços visam fortalecer a economia e garantir um futuro próspero para todos os cidadãos holandeses."
 HOL_celebrate_heroes:0 "Celebrar os Heróis Holandeses"
 HOL_celebrate_heroes_desc:0 "Honrar as conquistas e os sacrifícios notáveis dos heróis holandeses inspira orgulho e unidade nacional. Ao celebrar nossos heróis históricos e contemporâneos, inspiramos as futuras gerações e reforçamos os valores que definem nossa nação. Este Espírito de admiração e memória fortalece o vínculo entre os cidadãos e fomenta uma sociedade resiliente e patriótica."
 HOL_dutch_enterprise:0 "Promoção da Empresa Holandesa"
 HOL_dutch_enterprise_desc:0 "Um foco renovado em fomentar a inovação e o empreendedorismo locais revigorou a economia holandesa. Ao defender as empresas locais e reduzir as barreiras burocráticas, os Países Baixos cultivam um mercado competitivo que é um testemunho de seu espírito trabalhador."
 HOL_royal_eco_control:0 "Controle Econômico Real"
 HOL_royal_eco_control_desc:0 "Com a Coroa supervisionando as políticas econômicas, os Países Baixos embarcaram em um caminho de planejamento econômico centralizado. Enquanto os críticos denunciam a perda das liberdades de mercado, a monarquia garante estabilidade e um foco único nas prioridades nacionais, protegendo as indústrias holandesas da influência estrangeira."
 HOL_VOC_indonesian_focus_tt:0 "Reduz pela metade o custo de remover o movimento separatista na Indonésia"
 HOL_rebuilding_indonesia:0 "Reconstruindo a Indonésia"
 HOL_rebuilding_indonesia_desc:0 "Após a conquista holandesa, a Indonésia precisa de esforços significativos de reconstrução. Ao investir em infraestrutura, estabilizar a economia e atender às preocupações locais, podemos lançar as bases para um futuro próspero e cooperativo sob a orientação holandesa."
 HOL_military_compensation_ast:0 "Apoio Militar dos Países Baixos"
 HOL_military_compensation_ast_desc:0 "Os Países Baixos forneceram substancial apoio militar à Austrália como parte do acordo para a compra da Austrália Ocidental. Essa ajuda fortalece as forças armadas australianas e reforça a segurança regional."
 HOL_military_compensation_hol:0 "Compensação Militar para a Austrália"
 HOL_military_compensation_hol_desc:0 "Como parte do acordo para adquirir a Austrália Ocidental, comprometemo-nos a fornecer apoio militar à Austrália, aumentando sua capacidade de defesa e mantendo a boa vontade diplomática."
 HOL_industrial_compensation_ast:0 "Investimentos Industriais dos Países Baixos"
 HOL_industrial_compensation_ast_desc:0 "Os Países Baixos investiram pesadamente no setor industrial australiano como parte do acordo para a venda da Austrália Ocidental. Esses investimentos aumentaram significativamente a capacidade econômica e a infraestrutura da Austrália."
 HOL_industrial_compensation_hol:0 "Compensação Industrial para a Austrália"
 HOL_industrial_compensation_hol_desc:0 "Para garantir a Austrália Ocidental, fizemos investimentos substanciais no setor industrial australiano, fomentando o crescimento econômico e fortalecendo os laços diplomáticos."
 HOL_increase_long_range_aircraft_production:0 "Produção de Aeronaves de Longo Alcance"
 HOL_increase_long_range_aircraft_production_desc:0 "Para apoiar nossos esforços de reaver os territórios da WIC, os Países Baixos estão intensificando a produção de aeronaves de longo alcance. Esses aviões avançados garantirão superioridade aérea em grandes distâncias, fornecerão apoio crítico às operações navais e ampliarão nosso alcance estratégico."
 HOL_expanded_embassys:0 "Rede de Embaixadas Ampliada"
 HOL_expanded_embassys_desc:0 "Os Países Baixos ampliaram sua rede de embaixadas, aumentando o alcance diplomático e a influência em regiões-chave. Essa iniciativa fortalece nossa capacidade de negociar, formar alianças e defender os interesses holandeses no cenário mundial."
 HOL_expanded_financial_network1:0 "Redes Financeiras Ampliadas"
 HOL_expanded_financial_network1_desc:0 "Por meio de investimentos estratégicos e da integração de economias locais, os Países Baixos estabeleceram uma vasta rede financeira. Esse sistema fortalece nossa influência econômica, garante o domínio comercial e reforça o poder global holandês."
 HOL_dutchaid:0 "Iniciativa de Ajuda Holandesa"
 HOL_dutchaid_desc:0 "A Iniciativa de Ajuda Holandesa foca em fornecer assistência ao desenvolvimento e apoio econômico a regiões de interesse estratégico. Ao fomentar a boa vontade e a estabilidade, fortalecemos a influência holandesa e abrimos caminho para uma integração e cooperação mais profundas."
 HOL_dutchaid_tt1:0 "Renda Adicional: $$§G0.004§! por 10 milhões de pessoas"
 HOL_dutchaid_tt2:0 "Quando influenciado por §Y[HOL.GetNameWithFlag]§!, o $foreign_influence_defense_modifier$ de §Y[THIS.GetFlag] [THIS.GetAdjective]§! é §Rreduzido§! em §R5%§!\n"
 HOL_dutchaid_TT:0 "$$[?additional_income_HOL_dutchaid|+3] de §Y$HOL_dutchaid$§!\n"
 HOL_prepare_for_dutch_invasion:0 "Preparativos Defensivos Contra a Agressão Holandesa"
 HOL_prepare_for_dutch_invasion_desc:0 "Após rejeitar o ultimato holandês para ceder território, agora devemos nos preparar para as prováveis consequências. Espera-se que os Países Baixos respondam com ação militar, e devemos fortalecer nossas defesas e nos mobilizar para proteger nossa soberania."
 HOL_beatrix:0 "O Reinado da Rainha Beatrix"
 HOL_beatrix_desc:0 "Sob a Rainha Beatrix, a monarquia proporcionou estabilidade e força em um mundo em mudança. Sua sabedoria e adaptabilidade garantiram que a dinastia Orange-Nassau continuasse sendo uma instituição respeitada, guiando os Países Baixos rumo à unidade e à resiliência."
 HOL_willem_alexander:0 "O Reinado do Rei Willem-Alexander"
 HOL_willem_alexander_desc:0 "O reinado do Rei Willem-Alexander é definido por seu foco na unidade e na modernidade. Como símbolo do orgulho nacional, sua liderança fortalece os Países Baixos tanto interna quanto externamente."
 HOL_friso:0 "O Reinado do Rei Friso"
 HOL_friso_desc:0 "A abordagem intelectual do Rei Friso à governança trouxe inovação e visão de futuro aos Países Baixos. Sua dedicação ao progresso e ao pensamento estratégico consolida a relevância da monarquia na era moderna."
 HOL_constantijn:0 "O Reinado do Rei Constantijn"
 HOL_constantijn_desc:0 "A perspicácia diplomática do Rei Constantijn garante que os Países Baixos mantenham sua influência no cenário mundial. Seu reinado enfatiza a colaboração, a estabilidade e uma forte presença internacional para o povo holandês."
 HOL_amalia:0 "O Reinado da Rainha Amalia"
 HOL_amalia_desc:0 "A Rainha Amalia representa o futuro da dinastia Orange-Nassau, equilibrando a tradição com uma perspectiva moderna. Sua liderança inspira uma nova geração, garantindo que os Países Baixos prosperem sob seu reinado progressista e unificador."
 HOL_cult_of_the_leader:0 "Culto ao Líder"
 HOL_cult_of_the_leader_desc:0 "Com a monarquia abolida, o NVU estabeleceu uma nova ordem centrada na autoridade suprema do Líder. Carismática e inflexível, sua visão molda todos os aspectos da sociedade, unindo a nação sob uma ideologia única e um destino compartilhado. O Líder encarna a vontade do povo, forjando um caminho de força e dominação para os Países Baixos."
 HOL_divided_military_loyalties:0 "Lealdades Militares Divididas"
 HOL_divided_military_loyalties_desc:0 "As forças armadas, embora tenham sido fundamentais para garantir a vitória do NVU na guerra civil, permanecem cautelosas quanto a um alinhamento total com o regime. Há tensão entre os tradicionalistas nas forças armadas e a visão neonazista do governo de controle absoluto.\n------------\nPodemos nos livrar deste §Respírito nacional§! tendo um §YExército Leal§! ou um §YExército Independente§!"
 HOL_loyal_military:0 "Exército Leal"
 HOL_loyal_military_desc:0 "As forças armadas estão agora totalmente alinhadas com a visão do NVU. Expurgos e doutrinação ideológica garantiram lealdade absoluta ao Líder, tornando os militares uma extensão vital do Estado."
 HOL_independent_military:0 "Exército Independente"
 HOL_independent_military_desc:0 "Os militares receberam autonomia para manter sua eficácia operacional e profissionalismo. Embora livres de interferência política direta, permanecem comprometidos com a defesa da nação."
 HOL_nationalist_education_reform_idea_start:0 "Educação em Reforma"
 HOL_nationalist_education_reform_idea_start_desc:0 "Nosso sistema educacional está passando por uma reformulação abrangente para se alinhar aos ideais do regime. Essa transição prejudica sua eficácia atual, mas lança as bases para uma sociedade leal e unificada."
 HOL_nationalist_education_reform_idea_start_tt:0 "§YEducação em Reforma§! será §Gmelhorada§! ao longo do tempo"
 HOL_nationalist_education_reform_idea:0 "Sistema Educacional Nacionalista"
 HOL_nationalist_education_reform_idea_desc:0 "As reformas educacionais estão concluídas. As escolas agora se concentram em incutir lealdade, disciplina e orgulho, criando uma geração dedicada à nação e ao seu Líder."
 HOL_national_industrial_program:0 "Programa Industrial Nacional"
 HOL_national_industrial_program_desc:0 "O NVU lançou uma iniciativa ambiciosa para acelerar o crescimento industrial em todo o país. O planejamento centralizado e os investimentos estatais estão focados em expandir a indústria pesada, modernizar a infraestrutura e garantir que os Países Baixos alcancem a autossuficiência econômica. As fábricas fervilham de atividade, os trabalhadores se esforçam pela glória da nação e todos os recursos são direcionados à construção de um Estado mais forte e unificado. Esse programa consolida nosso lugar como uma potência industrial em ascensão na era moderna."
 HOL_german_youth_organisation1: "Germaanse Jeugd Nederland"
 HOL_german_youth_organisation1_desc:0 "A Germaanse Jeugd Nederland serve como a ala jovem do NVU, fomentando a lealdade ao Estado e a dedicação aos ideais de unidade e força germânicas. Por meio de rigoroso treinamento físico, educação ideológica e engajamento comunitário, a organização prepara a próxima geração para cumprir seu papel na visão do NVU de uma nação unificada e poderosa. Os membros da Germaanse Jeugd Nederland são a personificação da disciplina, da resiliência e do compromisso inabalável com a Pátria."
 HOL_corporatist_economy1:0 "Economia Corporativista"
 HOL_corporatist_economy1_desc:0 "O Estado reestruturou a economia em um modelo corporativista, alinhando empresas, sindicatos e governo sob uma estrutura unificada. Esse sistema elimina o conflito entre trabalho e capital, permitindo uma alocação eficiente de recursos, rápido crescimento industrial e inovação. A economia corporativista encarna a unidade e a força nacionais, garantindo que cada parte da sociedade trabalhe pelo objetivo comum da prosperidade da nação."
 HOL_stabilize_society:0 "Estabilizando a Sociedade"
 HOL_stabilize_society_desc:0 "O NVU lançou uma campanha intensiva para restaurar a ordem e a disciplina em todo o país. Pelos próximos 180 dias, os esforços se concentrarão em conter a agitação, unificar a sociedade sob a visão do NVU e eliminar os remanescentes da resistência ao novo regime. Esse período é crucial para lançar as bases de um futuro estável e próspero."
 HOL_germanic_nationalist_boost:0 "Ímpeto Nacionalista"
 HOL_germanic_nationalist_boost_desc:0 "Um renovado fervor nacionalista varre o país, à medida que movimentos que pedem unidade e força ganham popularidade. Os ideais fascistas, que enfatizam a ordem e a visão de um povo germânico unido, ressoam mais do que nunca, preparando o terreno para uma profunda transformação política."
 HOL_dutch_german_hegemony1:0 "Hegemonia Germânica Reivindicada"
 HOL_dutch_german_hegemony1_desc:0 "Os Países Baixos afirmaram sua reivindicação de liderança sobre os povos germânicos, desafiando o papel tradicional da Alemanha. Essa jogada ousada gerou tensão entre as nações germânicas, enquanto os holandeses buscam redefinir o equilíbrio de poder na região sob sua própria visão de unidade e domínio."
 HOL_fortification_efforts:0 "Fortificações Contra a Invasão Ocidental"
 HOL_fortification_efforts_desc:0 "Após a conquista das terras alemãs, os Países Baixos devem se preparar para uma possível retaliação da França. Enormes projetos de fortificação estão em andamento ao longo da frente ocidental, com ênfase na construção de bunkers e estruturas defensivas para proteger nossos recém-adquiridos territórios de qualquer invasão francesa. Esses esforços garantem que nossas fronteiras permaneçam seguras contra qualquer ameaça vinda do oeste."
 HOL_germanic_union_member1:0 "Membro da União Germânica"
 HOL_germanic_union_member1_desc:0 "Como membro da União Germânica, permanecemos unidos às demais nações germânicas na busca por prosperidade, segurança e domínio compartilhados. Essa aliança garante cooperação nas esferas militar, econômica e cultural, solidificando os laços entre nossas nações e assegurando nosso lugar em um mundo germânico mais forte e unificado."
 HOL_germanic_union_infrastructure_efforts:0 "Esforços de Infraestrutura da União Germânica"
 HOL_germanic_union_infrastructure_efforts_desc:0 "Para fortalecer a unidade e o poder econômico da União Germânica, enormes projetos de infraestrutura estão em andamento nas nações-membro. Ferrovias, rodovias e centros logísticos estão sendo ampliados para garantir conectividade contínua, impulsionar o comércio e aumentar a prontidão militar. Esses esforços simbolizam nosso compromisso com um mundo germânico mais forte e interligado."
 HOL_family_focus:0 "Foco na Família Tradicional"
 HOL_family_focus_desc:0 "A promoção da estrutura familiar tradicional tornou-se pedra angular da política nacional, impulsionada pelo SGP nas negociações da coalizão. Incentivos fiscais e iniciativas culturais agora visam apoiar lares estáveis e multigeracionais, ao mesmo tempo que reforçam o papel da família como alicerce da ordem moral e social."
 HOL_religious_education_policy:0 "Política de Educação Religiosa"
 HOL_religious_education_policy_desc:0 "Sob pressão do SGP, o governo promulgou uma política que fortalece a posição do ensino de base religiosa. O apoio público será direcionado às instituições que defendem os valores cristãos, com ênfase na autoridade dos pais, na moral tradicional e no papel da religião na formação de uma sociedade responsável."
 HOL_sunday_rest:0 "Santidade do Descanso Dominical"
 HOL_sunday_rest_desc:0 "O domingo é preservado como um dia sagrado de descanso e adoração. Ao restringir as atividades comerciais e públicas, essa política garante que os cidadãos possam honrar as tradições, fortalecer os laços familiares e encontrar renovação espiritual."
 HOL_nonselfsufficient_army1:0 "Indústria Militar Dependente"
 HOL_nonselfsufficient_army1_desc:0 "[HOL_not_selsufficient_army1_loc]\n------------\nPodemos nos livrar deste §Respírito nacional§! concluindo os focos de §YInvestimentos Domésticos§! no caminho de focos §YMilitar§!."
 HOL_nonselfsufficient_army1_tt: "[HOL_not_selsufficient_army3_loc]"
 HOL_nonselfsufficient_army_emergency:0 "Emergência Militar"
 HOL_nonselfsufficient_army_emergency_desc: "[HOL_not_selsufficient_army2_loc]"
 HOL_nso1:0 "Organização Espacial dos Países Baixos (NSO)"
 HOL_nso1_desc:0 "A Organização Espacial dos Países Baixos (NSO) é a agência central para a pesquisa espacial, o desenvolvimento de satélites e os programas de exploração do país. Ela coordena os esforços nacionais em tecnologia aeroespacial, fomenta parcerias internacionais e avança o entendimento científico do espaço."
 HOL_nato_training_program:0 "Treinamento Conjunto da OTAN"
 HOL_nato_training_program_desc: ""
 HOL_nato_maritime_security:0 "Liderança em Segurança Marítima"
 HOL_nato_maritime_security_desc: ""
 HOL_dutch_realpolitik_idea:0 "Reino Holandês"
 HOL_dutch_realpolitik_idea_desc: ""
 HOL_suriname_trade_agreement_idea1:0 "Acordo de Comércio e Desenvolvimento com o Suriname"
 HOL_suriname_trade_agreement_idea1_desc:0 "O acordo bilateral de comércio e desenvolvimento com o Suriname abriu novas oportunidades para o investimento holandês na América do Sul. Com melhor acesso ao mercado, logística portuária e iniciativas mútuas de infraestrutura, o acordo fortalece a cooperação econômica e restabelece os Países Baixos como um ator-chave no desenvolvimento da região."
 HOL_suriname_training_program:0 "Programa de Treinamento Militar Surinamês-Holandês"
 HOL_suriname_training_program_desc:0 "Por meio de uma iniciativa de treinamento conjunto com as forças armadas surinamesas, os Países Baixos aprofundam seus laços de defesa regionais e promovem a estabilidade no norte da América do Sul. Instrutores holandeses fornecem expertise em logística, manutenção da paz e operações antinarcóticos, ao mesmo tempo que promovem a interoperabilidade e a cooperação de segurança de longo prazo."
 HOL_support_boer_parties:0 "Apoio aos Movimentos Políticos Bôeres"
 HOL_support_boer_parties_desc:0 "Os Países Baixos começaram a fornecer apoio não oficial a partidos políticos alinhados aos bôeres na África do Sul, citando laços históricos e herança cultural compartilhada. Esse apoio inclui divulgação na mídia, assistência financeira e solidariedade ideológica. Embora apresentada como diplomacia cultural, a medida levanta sérias questões sobre as intenções holandesas e a estabilidade interna da África do Sul."
 HOL_counter_terrorism_idea1:0 "Força-Tarefa Nacional de Contraterrorismo"
 HOL_counter_terrorism_idea1_desc:0 "Após o aumento das preocupações com a radicalização e as ameaças internas, o governo ativou uma força-tarefa unificada de contraterrorismo sob a coordenação da NCTV. Com estreita cooperação entre a AIVD, a polícia e a polícia militar, essa estrutura garante avaliação rápida de ameaças, estratégias de prevenção e capacidade de resposta decisiva em todo o país."
 HOL_demissionaire_regering_idea:0 "Gabinete Demissionário"
 HOL_demissionaire_regering_idea_desc:0 "Após o colapso da coalizão governante, o governo agora opera em caráter demissionário. Sem mandato para implementar novas políticas e com apoio parlamentar enfraquecido, o país enfrenta um período de estagnação política e incerteza até que uma nova liderança seja formada."
 HOL_demissionaire_regering_idea_TT:0 "§REste espírito nacional será removido quando tivermos um novo governo§!"
 HOL_royal_decree_industrial_promotion:0 "Decreto Real sobre a Indústria Nacional"
 HOL_royal_decree_industrial_promotion_desc:0 "Por ordem da Coroa, foi emitido um decreto abrangente para elevar o poderio industrial do Reino. Com o patrocínio real por trás de setores-chave, as fábricas se expandem, a inovação é incentivada e a economia holandesa está pronta para recuperar seu lugar como líder continental em produção e comércio."
 HOL_gujurat_port_patrol1:0 "Pequena Proeminência [HOL.GetAdjectiveCap]"
 HOL_gujurat_port_patrol1_desc:0 "A presença de rebeldes maoístas neste estado criou um vácuo de poder que os holandeses começaram a explorar. Embora sua influência ainda seja pequena, eles aumentam de forma constante sua presença enquanto o governo central luta para manter o controle."
 HOL_gujurat_port_patrol3:0 "Proeminência [HOL.GetAdjectiveCap] Média"
 HOL_gujurat_port_patrol3_desc:0 "Com o governo indiano distraído pela atividade dos rebeldes maoístas, os holandeses ampliaram sua influência neste estado. Sua presença está se tornando cada vez mais notável, tanto econômica quanto politicamente, à medida que a governança local se enfraquece."
 HOL_gujurat_port_patrol4:0 "Proeminência [HOL.GetAdjectiveCap] Dominante"
 HOL_gujurat_port_patrol4_desc:0 "Os holandeses capitalizaram plenamente a instabilidade causada pelos rebeldes maoístas, alcançando influência quase total neste estado. O controle do governo indiano praticamente desapareceu, deixando os holandeses como a principal potência da região."
 HOL_gujurat_port_patrol4_tt:0 "Se §Y[HOL.GetNameWithFlag]§! §Rdeclarar guerra§! a §Y[RAJ.GetNameWithFlag]§!, esta província será imediatamente controlada por §Y[HOL.GetNameWithFlag]§!"
 influence_india:0 "£voc_icon Proeminência da VOC em §Y[RAJ.GetNameWithFlag]§!"
