 ukraine_varyag.26.name: "함재기로 개조한 우리 §YMiG-29§! 준비 완료"
 ukraine_varyag.26.desc: "§W§!§L리비우 국영 항공기 수리 공장§!§W이 기존 §!§YMiG-29§!§W 전투기 12대를 §!§Y바랴크§!§W 탑재용 §!§YMiG-29K§!§W 함재기 사양으로 §!§G전환 완료했습니다§!§W. 개조된 항공기는 예비에 있으며 이제 항공단에 합류하거나 갑판 시험에 참여할 수 있습니다.§!"
 ukraine_varyag.26.a: "전환된 대대를 인수한다"
 ukraine_varyag.27.name: "갑판 시험, §Y바랴크§!에서"
 ukraine_varyag.27.desc: "§W우리 갑판 승조원들이 §!§Y바랴크§!§W에서 자격 인증을 받을 준비를 마쳤습니다. 기초 시험은 예비에 있는 항공기를 사용합니다. 전체 시험에는 예비 대대 §!§Y호환 함재 전투기 12대§!§W가 필요하며 §!§G더 많은 경험§!§W을 얻습니다. 항공기가 더 확보될 때까지 기다릴 수도 있습니다.§!"
