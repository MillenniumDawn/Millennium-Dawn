 syrian_civil_war_refugees_ast: "Оказание помощи сирийским беженцам"
 syrian_refugees_event_ast.1.t: "Сирийские беженцы"
 syrian_refugees_event_ast.1.d: "With the outbreak of conflict in Syria, thousands of refugees are seeking asylum in our nation. They've gone through the proper channels, and the circumstances they're fleeing from would certainly qualify them for entry, but the choice is ultimately ours. Letting them in could encourage more to go through the right processes, or it could open the floodgates for another migration crisis."
 syrian_refugees_event_ast.1.a: "Впустите их."
 syrian_refugees_event_ast.1.b: "Это не наша проблема."
 malaysianflight_event_ast.1.t: "Исчезновение рейса MH370"
 malaysianflight_event_ast.1.d: "Вчера международный пассажирский самолет авиакомпании Malaysian Airlines исчез с радаров во время полета над Южно-Китайским морем, что повергло семьи погибших в шок, а авиакомпанию — в недоумение. Самолет, который изначально должен был приземлиться в Пекине, таинственным образом исчез из поля зрения датчиков три дня назад, направляясь из столицы Малайзии. Власти продолжают поиски обломков, а родственникам пропавших пассажиров рекомендовано готовиться к худшему. В поисках участвуют 40 кораблей и 34 самолета из девяти разных стран, хотя малазийские чиновники утверждают, что до сих пор не имеют представления о причинах произошедшего."
 malaysianflight_event_ast.1.a: "Куда оно делось?"
 AST_keep_them_aligned: "Держите их в выравнивании"
 AST_keep_them_aligned_desc: "Национальная партия пытается поднять шумиху вокруг нашей сельскохозяйственной политики, вернее, её отсутствия. Хотя подобная тактика принуждения, возможно, срабатывала при предыдущих администрациях, она не определит, как мы будем управлять этим кабинетом. Мы сами выделим гранты фермерам на наших условиях и объявим об этом в СМИ как о нашей победе. Это показывает, что если они хотят играть с нами по правилам, то только на наших условиях."
 AST_privatise_the_care: "Приватизировать уход"
 AST_privatise_the_care_desc: "The experiment of public healthcare in Australia has seen costs increase beyond acceptable or even manageable levels, with hardly any improvement to the care. By privatising parts of the program, we're welcoming the prospect of expanded choice and increased efficiency for those seeking care. It's a proven model, and we're open to adopting it."
 papua_affair.2.t: "Предложение Австралии по каучуку"
 papua_affair.2.d: "Правительство в Канберре предложило государственную поддержку ряду наших каучуковых плантаций вокруг Порт-Морсби. По их словам, эта сделка направлена ​​на укрепление и обеспечение стабильной торговли между нами, и в частности, она отменяет некоторые из наших тарифов. Местные мелкие фермеры поддерживают это предложение, ссылаясь на потенциальный рост экспорта, но, возможно, в будущем мы станем более зависимы от них."
 papua_affair.2.a: "Это выгодный бизнес."
 papua_affair.2.b: "Сделка не состоялась."
 papua_affair.3.t: "Резиновая фиксация"
 papua_affair.3.d: "К счастью, премьер-министр согласился предпринять вторую попытку переговоров и поддержал наше предложение. Фермеры в окрестностях Порт-Морсби получат выгоду от возросшего спроса и щедрых субсидий, а мы — стабильный поток каучука для наших развивающихся отраслей промышленности. От этого соглашения выиграет весь регион."
 papua_affair.3.a: "Ещё одна успешная сделка."
 papua_affair.4.t: "Нет ответа"
 papua_affair.4.d: "Unfortunately the Papua New Guinea delegation isn't open to our talks right now. Either that or they've forgotten how to answer the phone. It's a disappointing outcome, but in the meantime we can expand our pursuit for rubber more locally."
 papua_affair.4.a: "Не всегда удается выиграть."
