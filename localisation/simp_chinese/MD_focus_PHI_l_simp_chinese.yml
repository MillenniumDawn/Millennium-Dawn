 PHI_islamism_dynamic_modifier: "激进伊斯兰主义的兴起"
 PHI_islamism_dynamic_modifier_tooltip: "伊斯兰主义在菲律宾已有数百年历史。但近年来，这种情况开始发生变化，该国南部地区出现了极端激进化现象。"
 PHI_npa_insurgency_dynamic_modifier: "旷日持久的人民战争"
 PHI_npa_insurgency_dynamic_modifier_tooltip: "自1969年以来，菲律宾共产党通过其新人民军在农村地区开展游击战。其干部向村庄征税、伏击巡逻队，并在吕宋岛、萨马岛和棉兰老岛东部地区争夺地方政府的控制权。"
 PHI_milf_decisions_category: "摩洛冲突"
 PHI_milf_decisions_category_desc: "摩洛冲突指的是棉兰老岛省内的一系列武装冲突。摩洛冲突始于1935年菲律宾联邦时期实施的“重新安置政策”。冲突在科雷吉多岛爆发，当时11名穆斯林军事学员遭到杀害。此后不久，摩洛伊斯兰民族阵线于1969年成立，并一直与政府军处于公开冲突状态。\n£generic_anarchist_communism_small §R摩洛伊斯兰民族阵线实力：§![?PHI.PHI_strength_of_milf|20]%"
 PHI_anti_muslim_propaganda: "反穆斯林宣传"
 PHI_anti_muslim_propaganda_desc: "直接利用国家媒体和公共信息来对抗在棉兰老岛活动的激进伊斯兰叛乱组织的影响。"
 PHI_crush_the_moro_insurgency: "镇压摩洛叛乱"
 PHI_crush_the_moro_insurgency_desc: "随着摩洛伊斯兰解放阵线被削弱至只剩残余势力，武装部队可以宣布棉兰老岛战役结束。南部各省的指挥权归还给文官政府，叛乱以武力而非谈判的方式结束。"
 PHI_sign_the_bangsamoro_agreement: "签署邦萨摩洛协议"
 PHI_sign_the_bangsamoro_agreement_desc: "在马来西亚斡旋下，吉隆坡的会谈促使该阵线重返谈判桌。一项全面协议将使该阵线的武装人员解除武装，以拥有真正财政和立法权的邦萨摩洛实体取代棉兰老穆斯林自治区，并承诺马尼拉将为过渡提供资金。"
 PHI_communist_insurgency_category: "新人民军叛乱"
 PHI_communist_insurgency_category_desc: "新人民军叛乱是世界上历史最悠久的共产主义叛乱。自1969年以来，新人民军一直在与菲律宾国家政府进行持续不断的战斗。\n\n现在是我们全力镇压这场叛乱的时候了。\n£generic_Communist_State_small §R新人民军实力：§! [?PHI.PHI_strength_of_npa|20]%"
 PHI_sustained_military_offensive: "持续军事进攻"
 PHI_sustained_military_offensive_desc: "派遣军队和宪兵部队清剿马德雷山脉、萨马岛和达沃内陆地区的游击队前线。扫荡行动比任何其他方法都能更快地削弱新人民军，但长期在农村地区开展军事行动会使政府失去农村民众的支持。"
 PHI_peace_and_development_teams: "和平与发展小组"
 PHI_peace_and_development_teams_desc: "向受游击队影响的村庄部署军民联合小组，将道路和学校建设与地方治理工作相结合。切断叛乱分子的招募渠道比全面清剿行动耗时更长，成本也更高，但却不会损害稳定。"
 PHI_amnesty_for_returning_cadres: "对投诚干部的特赦"
 PHI_amnesty_for_returning_cadres_desc: "向投降的武装分子提供法律豁免、现金援助和生计支持。大规模的叛逃会削弱游击队的实力，但赦免叛乱分子会使政府失去军官和叛乱受害者的支持。"
 PHI_defeat_the_new_peoples_army: "击败新人民军"
 PHI_defeat_the_new_peoples_army_desc: "游击队阵线已被突破，中央委员会成员流散海外。宣布叛乱军事失败，标志着世界上持续时间最长的共产主义叛乱运动的结束。"
 PHI_conclude_the_oslo_talks: "结束奥斯陆会谈"
 PHI_conclude_the_oslo_talks_desc: "挪威调解员多年来一直与民族民主阵线保持开放的渠道。最终的解决方案将以政治特赦和土地改革承诺换取新人民军的永久复员。"
 PHI_anti_dynasty_law: "反世袭法"
 PHI_anti_dynasty_law_desc: "1987年宪法第二条第26条禁止政治世袭，但国会从未通过授权立法，主导立法机关的家族也没有理由这样做。强行通过这项法案将禁止现任者的亲属继任总统，打破省级宗族对国家政治的控制，并向来自名门望族之外的候选人开放各党派的领导权。"
 PHI_corruption_battle_mechanic_category: "反腐之战"
 PHI_corruption_battle_mechanic_category_desc: "数十年的裙带政治、薄弱的制度和根深蒂固的利益集团，使得腐败渗透到政府的几乎每一个层级。要根除腐败，需要在官僚机构、军队和私营部门开展持续、有针对性的调查。随着改革的推进和制度的完善，未来的调查将会更加便捷有效。\n\n当前腐败等级：[Root.GetPHI_corruption_tier_number][Root.GetPHI_corruption_tier_name]\n当前腐败实力：[?PHI_corruption_strength|Y0]"
 PHI_change_the_strength_of_corruption_tt: "§Y腐败实力§!改变[?temp_change|0+]（当前：[?PHI.PHI_corruption_strength|Y0]）\n"
