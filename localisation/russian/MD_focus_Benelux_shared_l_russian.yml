l_russian:
 BNL_dynmod_union: "Союз Бенилюкс"
 BNL_benelux_union_treaty: "Договор о Бенилюксе"
 BNL_benelux_union_treaty_desc: "Подписанный в Гааге в 2008 году, новый договор заменяет истекающее соглашение 1958 года и переименовывает наше сотрудничество в Союз Бенилюкса. Он продвигает вперед общий рынок и расширяет нашу совместную работу в области правосудия, безопасности и устойчивого развития, предоставляя трем государствам единую современную основу для дальнейшего сотрудничества."
 BNL_single_market: "Внутренний рынок Бенилюкса"
 BNL_single_market_desc: "Бенилюкс идет дальше, чем более широкий европейский рынок, устраняя административные барьеры, которые все еще разделяют три экономики. Долгое время являясь лабораторией европейской интеграции, союз внедряет общие стандарты и взаимное признание, которые позволяют фирмам торговать и действовать так, как будто границ не существует."
 BNL_capital_integration: "Интеграция рынка капитала"
 BNL_capital_integration_desc: "Амстердамская биржа, брюссельские банки и обширная индустрия инвестиционных фондов Люксембурга уже образуют один из крупнейших в Европе пулов капитала. Согласование финансового надзора и трансграничных правил позволяет этому капиталу свободно поступать в наиболее продуктивные фирмы по всему Евросоюзу."
 BNL_port_cooperation: "Роттердам и Антверпен"
 BNL_port_cooperation_desc: "Роттердам и Антверпен — два крупнейших порта в Европе. Координация кластера Антверпен-Роттердам-Амстердам вместо конкуренции за одни и те же грузы превращает логистику стран Бенилюкса в единый логистический центр мирового класса."
 BNL_freight_corridors: "Грузовые коридоры"
 BNL_freight_corridors_desc: "Специализированные железнодорожные линии, такие как Бетювераут и Железный Рейн, соединяют морские порты с европейскими внутренними районами. Совместные инвестиции в эти коридоры укрепляют промышленную основу союза."
 BNL_north_sea_wind: "Ветер Северного моря"
 BNL_north_sea_wind_desc: "В рамках соглашения о сотрудничестве в области энергетики Северного моря страны Бенилюкса совместно развивают морскую ветроэнергетику. Объединение сетевых подключений превращает Северное море в общий возобновляемый источник энергии."
 BNL_gas_hub: "Бенилюксский газовый хаб"
 BNL_gas_hub_desc: "Месторождение Гронинген и терминал СПГ в Зебрюгге превращают страны Бенилюкса в центр торговли газом. Координация поставок через Пятисторонний энергетический форум обеспечивает энергоснабжение союза."
 BNL_research_cooperation: "Регион передовых технологий"
 BNL_research_cooperation_desc: "Эйндховен и Лёвен, простирающиеся в сторону Аахена, образуют Регион передовых технологий — один из самых крупных центров высокотехнологичных исследований в Европе. Объединяя лаборатории, финансирование и талантливых специалистов в рамках этого трансграничного треугольника, страны Бенилюкса могут превзойти по инновационному потенциалу конкурентов, размер которых во много раз превышает их собственный."
 BNL_university_network: "Университетская сеть"
 BNL_university_network_desc: "Делфт, Лёвен, Эйндховен и Вагенинген являются опорными пунктами плотной академической сети. Объединение их учебных программ и ученых степеней позволяет создать общий резерв талантов и знаний."
 BNL_hightech_triangle: "Высокотехнологичный треугольник"
 BNL_hightech_triangle_desc: "«Брейнпорт Эйндховен», где расположены компании ASML и NXP, а также imec в Левене, составляют ядро европейских исследований в области полупроводников. Совместная поддержка этого кластера позволяет странам Бенилюкса оставаться на передовых позициях в сфере высоких технологий."
 BNL_space_cooperation: "Космическое сотрудничество"
 BNL_space_cooperation_desc: "Технический центр Европейского космического агентства ESTEC расположен в Нордвейке. Координация вклада стран Бенилюкса в европейские космические программы развивает передовые инженерные компетенции."
 BNL_nuclear_research: "Ядерные исследования"
 BNL_nuclear_research_desc: "Петтен в Нидерландах и центр SCK CEN в бельгийском Моле вместе с проектом реактора MYRRHA находятся на переднем крае европейских исследований реакторов и медицинских изотопов. Совместная программа развивает ядерную науку союза."
 BNL_innovation_area: "Инновационный регион Бенилюкса"
 BNL_innovation_area_desc: "Объединение исследовательской сети, высокотехнологичного кластера, а также ядерных и космических программ в единый инновационный регион делает Бенилюкс одним из самых наукоёмких регионов мира."
 BNL_benelux_parliament: "Парламент Бенилюкса"
 BNL_benelux_parliament_desc: "Договор 2015 года заменяет старый Консультативный совет 1955 года Межпарламентской ассамблеей Бенилюкса, создавая для союза парламентский форум из представителей трёх национальных законодательных органов. Усиление этой структуры закладывает основу для более глубокой политической интеграции трёх государств."
 BNL_benelux_court: "Суд Бенилюкса"
 BNL_benelux_court_desc: "Протокол 2012 года модернизирует Суд Бенилюкса, расширяя его полномочия за пределы общего рынка на новые области, включая интеллектуальную собственность. Общий суд гармонизирует право трёх юрисдикций и формирует единый правовой порядок союза."
 BNL_shared_foreign_policy: "Общая внешняя политика"
 BNL_shared_foreign_policy_desc: "Следуя традиции, столь же старой, как и сам союз, три правительства согласовывают позиции перед каждым заседанием Европейского совета и саммитом НАТО. Выступая единым голосом, Бенилюкс имеет в Брюсселе влияние, значительно превосходящее размеры его участников."
 BNL_political_union: "Политический союз"
 BNL_political_union_desc: "Общий парламент, единый суд и согласованная внешняя политика позволяют трём правительствам выйти за рамки обычного сотрудничества и фактически объединить свои политические институты в единый союз."
 BNL_treaty_of_union: "Договор о Союзе"
 BNL_treaty_of_union_desc: "Десятилетия развития общих институтов достигают кульминации. Народы трёх стран уже глубоко интегрированы, и ведущее правительство выносит на рассмотрение партнёров вопрос о создании единого государства Бенилюкса. Только с их согласия отдельные суверенитеты смогут уступить место одной стране."
 BNL_treaty_of_union_tt: "Открывает путь к созданию единого государства Бенилюкса"
 BNL_integration_requirement_tt: "$BNL_integration$ выше §G100§!"
 BNL_integration: "§YИнтеграция Бенилюкса§!"
 BNL_integration_tt: "£GFX_benelux_icon $BNL_integration$: $RIGHT|+=1$"
 BNL_integration_tooltip: "£GFX_benelux_icon $BNL_integration$: §G[?BNL_integration]§!"
 BNL_benelux_defence: "Декларация Бенилюкса об обороне"
 BNL_benelux_defence_desc: "Декларация Бенилюкса 2012 года обязала Бельгию, Нидерланды и Люксембург объединять оборонные усилия, разделять расходы и наращивать совместный военный потенциал. Она стала основой, в рамках которой вооружённые силы трёх стран углубляют сотрудничество."
 BNL_mio_sharing_tt: "§Y[BEL.GetNameWithFlag]§!, §Y[HOL.GetNameWithFlag]§! и §Y[LUX.GetNameWithFlag]§! совместно используют все §Yвоенно-промышленные организации.§!"
 BNL_benelux_air_policing: "Охрана воздушного пространства Бенилюкса"
 BNL_benelux_air_policing_desc: "С 2017 года Бельгия и Нидерланды поочерёдно охраняют воздушное пространство всех трёх стран в рамках единой системы быстрого реагирования, имея право перехватывать цели по обе стороны общих границ."
 BNL_air_defence_command: "Центр воздушного командования и управления"
 BNL_air_defence_command_desc: "Общий центр воздушного командования и управления объединяет радиолокационную обстановку и наземные системы ПВО трёх стран в единую согласованную систему."
 BNL_binational_air_command: "Двустороннее авиационное командование"
 BNL_binational_air_command_desc: "Объединение оперативных авиационных командований позволяет ВВС стран Бенилюкса планировать и выполнять задачи как единой организации, совместно используя базы, диспетчерские службы и процедуры."
 BNL_mrtt_fleet: "Многонациональный флот MRTT"
 BNL_mrtt_fleet_desc: "Объединённый флот многоцелевых самолётов-заправщиков Airbus A330, базирующийся в Эйндховене и совместно используемый странами Бенилюкса и другими европейскими государствами, обеспечивает дозаправку в воздухе и стратегические воздушные перевозки для каждого участника."
 BNL_eatc: "Европейское командование военно-транспортной авиации"
 BNL_eatc_desc: "Европейское командование военно-транспортной авиации со штаб-квартирой в Эйндховене объединяет военно-транспортные, заправочные и санитарные самолёты стран-участниц под единым командованием."
 BNL_belux_a400m: "Подразделение BELUX A400M"
 BNL_belux_a400m_desc: "Бельгия и Люксембург объединяют свои транспортные самолёты A400M Atlas в единое двустороннее подразделение в Мельсбруке, совместно используя экипажи, техническое обслуживание и общий учебный центр. Единственный самолёт Люксембурга летает в бельгийской окраске, а обе страны делят расходы и лётные часы общего флота."
 BNL_f35_cooperation: "Совместное обслуживание F-35"
 BNL_f35_cooperation_desc: "Бельгия и Нидерланды координируют подготовку и техническое обслуживание своих парков F-35, совместно используя инфраструктуру и опыт двух военно-воздушных сил."
 BNL_benesam: "Военно-морское соглашение BENESAM"
 BNL_benesam_desc: "Бельгия и Нидерланды фактически эксплуатируют два своих флота как единое целое, совместно организуя подготовку, логистику и техническое обслуживание, при этом сохраняя самостоятельное командование собственными операциями. Углубление этого давнего соглашения делает объединённый флот значительно сильнее простой суммы его частей."
 BNL_admiral_benelux: "Адмирал Бенилюкс"
 BNL_admiral_benelux_desc: "Единый двусторонний военно-морской штаб в Ден-Хелдере руководит операциями бельгийского и нидерландского флотов, а командующие ВМС двух стран совместно используют общий штаб."
 BNL_vlissingen_class: "Минные тральщики типа «Флиссинген»"
 BNL_vlissingen_class_desc: "Совместная бельгийско-нидерландская программа замены противоминных кораблей предусматривает строительство двенадцати судов для вывода из эксплуатации устаревающих тральщиков класса Tripartite/Alkmaar. Построенные Naval Group корабли-носители ищут и обезвреживают мины с безопасного расстояния при помощи автономных надводных и подводных аппаратов. Нидерланды получают шесть кораблей типа «Флиссинген», а Бельгия — собственные суда того же проекта."
 BNL_hollandklasse_frigate: "Разработка фрегатов Hollandklasse"
 BNL_hollandklasse_frigate_desc: "Нидерланды закладывают новые фрегаты Hollandklasse для обновления сил морского патрулирования и противолодочной обороны. Современные датчики, ракетные системы и малозаметный корпус позволяют им защищать нидерландские воды и поддерживать операции за рубежом."
 BNL_aswf_frigate: "Противолодочный фрегат"
 BNL_aswf_frigate_desc: "Бельгия и Нидерланды совместно заменяют свои фрегаты класса M новым противолодочным проектом, разделяя разработку, радиолокационные средства и боевые системы."
 BNL_para_school: "Школа парашютистов Бенилюкса"
 BNL_para_school_desc: "Парашютные школы стран Бенилюкса объединяются в единый учебный центр в Шаффене, где воздушно-десантные подразделения всех трёх государств готовятся по общему стандарту."
 BNL_csomtg: "Объединённая оперативная группа специальных операций"
 BNL_csomtg_desc: "Бельгия и Нидерланды создают совместную морскую оперативную группу специальных операций, готовую к быстрому развёртыванию на суше и на море для выполнения задач НАТО."
 benelux.1.t: "Договор Бенилюкса о Союзе"
 benelux.1.d: "[FROM.GetName] предлагает отказаться от раздельного суверенитета и объединиться в единое государство Бенилюкса. Десятилетия общих институтов подготовили почву, однако отказ от собственной государственности — далеко не простой шаг."
 benelux.1.a: "Мы вступим в союз"
 benelux.1.b: "Мы останемся независимым государством"
 benelux.2.t: "Наш партнёр принимает Союз"
 benelux.2.d: "[FROM.GetName] согласилась присоединиться к единому Бенилюксу. Теперь, когда наш партнёр связан с нами соглашением, мы можем завершить создание союза."
 benelux.2.a: "Рождается новое государство"
 benelux.3.t: "Наш партнёр отклоняет Союз"
 benelux.3.d: "[FROM.GetName] пока не готова отказаться от своей независимости. Создание союза придётся отложить или подготовить для него более прочную основу."
 benelux.3.a: "Мы проявим терпение"
 benelux.4.t: "Договор Бенилюкса о Союзе"
 benelux.4.d: "[FROM.GetName] предлагает отказаться от раздельного суверенитета и объединиться в единое государство Бенилюкса. Мы и без того служим опорой сотрудничества в Бенилюксе, наша экономика и вооружённые силы значительно превосходят возможности партнёров, и фактически мы уже возглавляем союз во всём, кроме названия. Формальное объединение означало бы обменять это фактическое первенство и единоличный контроль над государством, в котором мы уже доминируем, на общие институты, которыми мы не сможем управлять в одиночку."
 benelux.4.a: "Мы вступим в союз"
 benelux.4.b: "Мы останемся независимым государством"
 benelux.5.t: "Договор Бенилюкса о Союзе"
 benelux.5.d: "[FROM.GetName] предлагает отказаться от раздельного суверенитета и объединиться в единое государство Бенилюкса. Будучи намного меньше двух других стран, мы рискуем оказаться политически и культурно поглощёнными значительно более крупными соседями, а наше Великое герцогство может превратиться в сноску внутри союза, на направление которого мы едва ли сможем влиять."
 benelux.5.a: "Мы вступим в союз"
 benelux.5.b: "Мы останемся независимым государством"
 BNL_retry_treaty_of_union_BEL: "Повторно предложить Союз Бельгии"
 BNL_retry_treaty_of_union_BEL_desc: "Бельгия отклонила последнее предложение о создании единого государства Бенилюкса. Новый подход, подкреплённый свежими аргументами и возобновлённым дипломатическим давлением, ещё может убедить Брюссель."
 BNL_retry_treaty_of_union_HOL: "Повторно предложить Союз Нидерландам"
 BNL_retry_treaty_of_union_HOL_desc: "Нидерланды отклонили последнее предложение о создании единого государства Бенилюкса. Новый подход, подкреплённый свежими аргументами и возобновлённым дипломатическим давлением, ещё может убедить Гаагу."
 BNL_retry_treaty_of_union_LUX: "Повторно предложить Союз Люксембургу"
 BNL_retry_treaty_of_union_LUX_desc: "Люксембург отклонил последнее предложение о создании единого государства Бенилюкса. Новый подход, подкреплённый свежими аргументами и возобновлённым дипломатическим давлением, ещё может убедить Великое герцогство."
 BNL_retry_shared_outlook_tt: "Вероятность согласия выше, если у нас одинаковая форма правления."
 BNL_retry_influence_tt: "Вероятность согласия выше, если мы обладаем значительным влиянием на них."
 BNL_retry_opinion_tt: "Вероятность согласия выше, если их мнение о нас превышает §G200§!."