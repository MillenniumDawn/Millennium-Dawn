 ROM_march_tt: "250일 후 PRM 준군사 조직이 부쿠레슈티로 진군합니다. 바딤의 권력이 충분하지 않으면 진군은 실패하며 §R심각한§! 결과를 초래합니다."
 ROM_collapse_tt: "§R우리는 매일 참회를 쌓을 기반을 놓고, 또다시 그것을 찢어 버립니다. 우리가 알던 기반으로서의 루마니아는 사라졌고, 남은 것은 오직 그 운명을 하느님만이 아시는 그을린 잔해뿐입니다. 부디 그분께서 우리에게 자비를 베푸시기를.§!"
 ROM_frn_tt: "§Y민족 부흥 전선을 복원합니다§!"
 rom_vadim_election_win: "§R바딤의 견해와 제안은 루마니아 사회의 상당 부분과 맞지 않으므로, 루마니아를 다시 위대하게 만들기 위해서는 급진적인 조치를 취해야 합니다§!"
