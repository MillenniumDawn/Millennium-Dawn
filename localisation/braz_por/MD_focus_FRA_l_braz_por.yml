 FRA_knds_manufacturer_trait: "Programa de Convergência MGCS"
 FRA_knds_franco_german_synthesis: "Síntese Franco-Alemã"
 FRA_knds_european_champion: "Campeã Industrial Europeia"
 FRA_knds_fg_partnership: "Parceria Franco-Alemã"
 FRA_knds_fg_partnership_desc: "A holding KANT de 2015 unificou a Krauss-Maffei Wegmann e a Nexter sob propriedade franco-alemã 50-50, reunindo dois campeões nacionais em uma única base industrial."
 FRA_knds_kant_holding: "Integração da Holding KANT"
 FRA_knds_kant_holding_desc: "Equipes de engenharia transfronteiriças, aquisições harmonizadas e serviços administrativos compartilhados reduzem o custo de manter duas casas de defesa herdadas em paralelo."
 FRA_knds_embt: "Demonstrador EMBT"
 FRA_knds_embt_desc: "O Enhanced Main Battle Tank combina uma torre Leclerc com um casco Leopard 2, antecipando a filosofia de projeto híbrido do futuro Main Ground Combat System."
 FRA_knds_joint_rnd: "Fundo Conjunto de P&D"
 FRA_knds_joint_rnd_desc: "Os orçamentos de pesquisa franco-alemães combinados aceleram frentes paralelas em blindagem, eletrônica e materiais energéticos que nenhuma das empresas poderia perseguir sozinha."
 FRA_knds_mgcs_modular: "Arquitetura Modular MGCS"
 FRA_knds_mgcs_modular_desc: "O Main Ground Combat System é concebido como uma família multiplataforma com módulos intercambiáveis de proteção, poder de fogo e guerra eletrônica, substituindo o Leopard 2 e o Leclerc até a década de 2040."
 FRA_knds_mgcs_integration: "Integração de Sistemas MGCS"
 FRA_knds_mgcs_integration_desc: "O MGCS integra uma espinha dorsal digital compartilhada, gestão de batalha derivada do SCORPION e fusão de sensores comum entre as formações blindadas franco-alemãs."
 FRA_knds_turret_leadership: "Liderança de Torres (Nexter)"
 FRA_knds_turret_leadership_desc: "O projeto de torres, a engenharia de autoloaders e a fabricação de canhões se consolidam sob as antigas equipes da Nexter, aproveitando a experiência em poder de fogo da era Leclerc."
 FRA_knds_hull_leadership: "Liderança de Cascos (KMW)"
 FRA_knds_hull_leadership_desc: "O desenvolvimento de cascos, conjuntos de potência e trens de rodagem se consolida sob as antigas equipes da KMW, aproveitando a experiência estrutural do Leopard 2 e do Puma."
 FRA_knds_nato_standardisation: "Padronização de Artilharia da OTAN"
 FRA_knds_nato_standardisation_desc: "A KNDS fornece à Agência de Apoio e Aquisição da OTAN munição de 155mm em conformidade com o STANAG, posicionando a entidade fundida como a fornecedora de artilharia padrão da Europa."
 FRA_knds_rch155: "Obuseiro Remoto RCH-155"
 FRA_knds_rch155_desc: "O RCH-155 monta uma torre automatizada de 155mm sobre um chassi Boxer, disparando em movimento a alcances de até 54 quilômetros com uma tripulação de duas pessoas."
 FRA_knds_leopard_sustainment: "Sustentação da Frota Leopard 2"
 FRA_knds_leopard_sustainment_desc: "A logística unificada, a produção de peças sobressalentes e a reforma da frota Leopard 2 ficam sob a entidade fundida, dando à KNDS uma fonte de receita de manutenção de décadas em toda a Europa."
 FRA_knds_boxer_puma: "Gestão do Boxer e do Puma"
 FRA_knds_boxer_puma_desc: "O blindado modular Boxer e o IFV Puma continuam programas liderados pela KMW, agora amparados pelo peso industrial combinado da KNDS."
 FRA_knds_bonus_katana: "Munição BONUS e KATANA"
 FRA_knds_bonus_katana_desc: "Os projéteis BONUS, com espoleta de sensor, e KATANA, guiados, ampliam o portfólio de artilharia de precisão da KNDS, agora comercializado como uma única linha de produtos pan-europeia."
 FRA_knds_export_leadership: "Liderança em Exportação"
 FRA_knds_export_leadership_desc: "Uma postura exportadora agressiva atrai compradores no Golfo, no Sudeste Asiático e na Europa Oriental com pacotes de blindados, artilharia e munição."
 FRA_knds_strategic_autonomy: "Autonomia Estratégica"
 FRA_knds_strategic_autonomy_desc: "Uma doutrina de prioridade doméstica reserva as melhores linhas de produção e as tecnologias sensíveis às forças franco-alemãs, reforçando a autonomia estratégica europeia em vez das vendas no mercado aberto."
