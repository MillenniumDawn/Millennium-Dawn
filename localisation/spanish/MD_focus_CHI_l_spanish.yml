 SCO_military_research_name: "Investigación militar de la OCS"
 CHI_HKG_patriotic_education_drive: "Campaña de educación patriótica"
 CHI_HKG_patriotic_education_drive_desc: "Financiar un plan de estudios de educación cívica e identidad nacional diseñado por el continente en todas las escuelas subvencionadas de Hong Kong, ampliar la enseñanza en putonghua y sufragar viajes de estudio de profesores al interior. La Oficina de Educación asume el coste, y el despliegue es lo suficientemente gradual como para evitar una segunda reacción violenta contra la Educación Moral y Nacional."
 CHI_HKG_liaison_office_expansion: "Ampliar la Oficina Central de Enlace"
 CHI_HKG_liaison_office_expansion_desc: "Ampliar la Oficina de Enlace del Gobierno Popular Central y la Oficina para la Salvaguardia de la Seguridad Nacional, destinar cuadros del continente a la administración pública de Hong Kong y sentar a personas preseleccionadas en los paneles de escrutinio de la judicatura. El control administrativo avanza rápidamente, pero cada intervención visible corre el riesgo de hacer que las multitudes vuelvan a las calles."
 CHI_MAC_cross_border_administration: "Unificar la administración transfronteriza"
 CHI_MAC_cross_border_administration_desc: "Reconocer las credenciales profesionales y los permisos de conducir del continente en Macao, canalizar la liquidación de renminbis a través de bancos supervisados por el continente y fusionar la tramitación aduanera en los puntos de control de Gongbei y del Puente del Loto en un único permiso. El territorio conserva su estatuto mientras su maquinaria administrativa converge con la de Guangdong."
 CHI_MAC_hengqin_integration_zone: "Zona de Cooperación Profunda de Hengqin"
 CHI_MAC_hengqin_integration_zone_desc: "Ampliar la Zona de Cooperación Profunda Guangdong-Macao en la isla de Hengqin: derechos de residencia en el continente para los trabajadores de Macao, un régimen fiscal y aduanero unificado y la reubicación de empresas vinculadas al juego al otro lado del agua. Zhuhai absorbe el crecimiento y, con él, las palancas del gobierno local."
 CHI_TIB_monastic_patriotic_education: "Educación patriótica en los monasterios"
 CHI_TIB_monastic_patriotic_education_desc: "Establecer Comités de Gestión Democrática en cada monasterio registrado, exigir a los monjes y monjas que superen exámenes sobre la política religiosa del Estado y limitar la inscripción de novicios. Las instituciones permanecen abiertas y operan bajo supervisión administrativa permanente."
 CHI_TIB_village_cadre_teams: "Equipos de trabajo de cuadros en las aldeas"
 CHI_TIB_village_cadre_teams_desc: "Destinar un equipo de trabajo permanente del Partido a cada aldea administrativa, junto con auditorías de registro de hogares, consolidación de viviendas subvencionadas y el traslado de familias de pastores dispersas a municipios con servicios. La penetración administrativa se vuelve total, al igual que el resentimiento que genera."
 CHI_ETK_bilingual_boarding_schools: "Sistema de internados bilingües"
 CHI_ETK_bilingual_boarding_schools_desc: "Consolidar la escolarización rural en instituciones de internado con enseñanza en mandarín, dotadas de personal docente reclutado en las provincias del interior. El uigur se mantiene como asignatura en lugar de como lengua vehicular de instrucción, y se educa a una generación lejos de sus aldeas de origen."
 CHI_ETK_labour_transfer_scheme: "Programa de transferencia de excedentes de mano de obra"
 CHI_ETK_labour_transfer_scheme_desc: "Asignar trabajadores uigures rurales a fábricas costeras y parques industriales regionales bajo cuotas de transferencia organizadas, responsabilizando a los cuadros de las aldeas de los objetivos de contratación. Los ingresos familiares aumentan y los lazos comunitarios se debilitan, pero el programa es claramente visible para los auditores extranjeros que rastrean las cadenas de suministro."
 CHI_OMG_mandarin_curriculum_rollout: "Despliegue del plan de estudios unificado"
 CHI_OMG_mandarin_curriculum_rollout_desc: "Sustituir los libros de texto en lengua mongola de política, historia y lengua por las series unificadas nacionales y reciclar al cuerpo docente en consecuencia. Presentado como una medida de igualdad de oportunidades y aplicado con la suficiente lentitud como para mantener tranquilos a los condados ganaderos."
 CHI_OMG_pastoral_sedentarisation: "Programa de sedentarización pastoril"
 CHI_OMG_pastoral_sedentarisation_desc: "Imponer prohibiciones de pastoreo en la estepa degradada, compensar a las familias ganaderas por el ganado entregado y reasentarlas en viviendas subvencionadas en municipios con reciclaje profesional. El pastoreo nómada da paso al trabajo asalariado, y la base social de la particularidad mongola desaparece con él."
 CHI_national_common_language_campaign: "Campaña nacional por la lengua común"
 CHI_national_common_language_campaign_desc: "Aplicar la Ley de la Lengua China Hablada y Escrita Estándar de manera uniforme en todas las Regiones Administrativas Especiales a la vez: una sola serie de libros de texto, certificación lingüística nacional para el empleo público y cuotas de radiodifusión. Un único impulso coordinado hace avanzar la integración en todos los lugares donde el gobierno central aún conserva influencia administrativa."
 CHI_second_generation_ethnic_policy: "Política étnica de segunda generación"
 CHI_second_generation_ethnic_policy_desc: "Adoptar el modelo despolitizado de asuntos étnicos promovido por los teóricos reformistas del Partido: suprimir las cuotas preferenciales, abandonar la autonomía regional como principio organizativo y definir la ciudadanía únicamente a través de la nación china. Aplicada a todas las Regiones Administrativas Especiales simultáneamente, es la medida de integración de mayor alcance disponible y la más desestabilizadora."
 CHI_HKG_sinicization_slot_free: "Ningún programa de integración de §YHong Kong§! está en marcha actualmente"
 CHI_MAC_sinicization_slot_free: "Ningún programa de integración de §YMacao§! está en marcha actualmente"
 CHI_TIB_sinicization_slot_free: "Ningún programa de integración del §YTíbet§! está en marcha actualmente"
 CHI_ETK_sinicization_slot_free: "Ningún programa de integración de §YXinjiang§! está en marcha actualmente"
 CHI_OMG_sinicization_slot_free: "Ningún programa de integración de §YMongolia Interior§! está en marcha actualmente"
 CHI_national_sinicization_slot_free: "Ninguna campaña de integración a nivel nacional está en marcha actualmente"
 CHI_any_SAR_awaiting_integration: "Al menos una Región Administrativa Especial todavía está esperando la integración"
 CHI_sinicization_all_SARs_tt: "Hace avanzar la §Ysinización§! en cada Región Administrativa Especial que aún espera la integración"
 CHI_bri_reduce_loan_tt: "Su deuda pendiente de la Franja y la Ruta se reduce en el §Gcoste de un proyecto§!"
 CHI_bri_restructure_loan_tt: "Su tasa de préstamo baja al §G2 %§! y los pagos se pausan durante §Yun año§!"
 CHI_bri_application_approved_tt: "La construcción comienza tras una comprobación final de elegibilidad. El beneficiario paga §Y40§! de su tesorería o recibe un préstamo chino por la diferencia restante."
 CHI_bri_dual_treasury_50_tt: "Requiere al menos §Y50§! tanto en el fondo de la Franja y la Ruta como en la tesorería nacional"
 CHI_bri_state_port: "Proyecto portuario de la Franja y la Ruta"
 CHI_bri_state_port_desc: "Un desarrollo portuario respaldado por China amplía la logística local y la capacidad de construcción marítima."
 CHI_bri_state_rail: "Proyecto ferroviario de la Franja y la Ruta"
 CHI_bri_state_rail_desc: "Un corredor ferroviario respaldado por China mejora la logística terrestre y la construcción de infraestructuras."
 CHI_bri_state_pipeline: "Proyecto de oleoducto/gasoducto de la Franja y la Ruta"
 CHI_bri_state_pipeline_desc: "Un conducto respaldado por China amplía el rendimiento de los recursos y la capacidad de suministro regional."
 CHI_bri_state_telecom: "Proyecto de telecomunicaciones de la Franja y la Ruta"
 CHI_bri_state_telecom_desc: "Una red troncal digital respaldada por China sirve de apoyo a la infraestructura de redes y a futuras construcciones."
 CHI_bri_state_sez: "Zona Económica Especial de la Franja y la Ruta"
 CHI_bri_state_sez_desc: "Una zona económica especial respaldada por China amplía la capacidad de las fábricas locales y el espacio de construcción."
 CHI_bri_state_mine: "Proyecto minero de la Franja y la Ruta"
 CHI_bri_state_mine_desc: "La inversión china amplía la extracción de los yacimientos minerales del Estado."
 CHI_bri_state_energy: "Proyecto energético de la Franja y la Ruta"
 CHI_bri_state_energy_desc: "La capacidad de generación construida por China sirve de apoyo a la industria local."
 CHI_bri_state_prestige: "Proyecto de prestigio de la Franja y la Ruta"
 CHI_bri_state_prestige_desc: "Un complejo de oficinas y monumentos emblemáticos respaldado por China reconfigura la capital regional."
 CHI_BRI_recipient_finance: "Finanzas de la Franja y la Ruta"
 CHI_BRI_recipient_finance_desc: "Gestionar nuestras deudas y concesiones de la Franja y la Ruta.\n\n§YDeuda pendiente de la Franja y la Ruta:§! [?bri_debt_owed_to_china|2]\n§YPago semanal de intereses:§! [?bri_loan_payment|2]"
 CHI_huawei_consumer_ecosystem_power: "Poder del ecosistema de consumo"
 CHI_huawei_consumer_ecosystem_power_desc: "Los dispositivos, el software, los servicios y los desarrolladores forman una plataforma de consumo competitiva a nivel mundial, respaldada por la base tecnológica más amplia de Huawei."
 CHI_huawei_global_telecom_challenger: "Competidor global de telecomunicaciones"
 CHI_huawei_global_telecom_challenger_desc: "Los centros de investigación internacionales, las relaciones con los operadores y una red de ventas en expansión están convirtiendo a Huawei en un competidor global de las telecomunicaciones."
 CHI_huawei_resilient_technology_fortress: "Fortaleza tecnológica resiliente"
 CHI_huawei_resilient_technology_fortress_desc: "Huawei se mantiene como un campeón duradero y técnicamente capaz, pero las limitaciones geográficas y la confianza limitada estrechan su alcance comercial."
 CHI_huawei_sovereign_full_stack: "Pila tecnológica soberana integral"
 CHI_huawei_sovereign_full_stack_desc: "Chips independientes, software, IA, servicios en la nube, dispositivos y un sistema de suministro resiliente forman una amplia pila tecnológica nacional."
 CHI_semiconductor_events.300.a: "Respaldar una red global distribuida de I+D"
 CHI_semiconductor_events.300.b: "Priorizar el mercado nacional de operadores"
 CHI_semiconductor_events.300.d: "Fundada en Shenzhen en 1987, Huawei construyó su posición inicial en el mercado de telecomunicaciones de China antes de establecer operaciones de investigación y ventas en el extranjero. La política industrial del Estado puede financiar una red de investigación global distribuida o mantener el peso de la empresa en el mercado nacional de operadores."
 CHI_semiconductor_events.300.t: "Más allá del mercado doméstico"
 CHI_semiconductor_events.301.a: "Respaldar el modelo LTE de extremo a extremo"
 CHI_semiconductor_events.301.b: "Mantener el esfuerzo en los operadores chinos"
 CHI_semiconductor_events.301.d: "TeliaSonera ha lanzado el servicio comercial LTE en Oslo utilizando una red de Huawei. Pekín puede respaldar el modelo de extremo a extremo que ganó el contrato y escalarlo por toda Europa, o mantener a los ingenieros de la empresa enfocados en los operadores chinos."
 CHI_semiconductor_events.301.t: "El avance de LTE en los países nórdicos"
 CHI_semiconductor_events.302.a: "Financiar por completo la gran apuesta por el 5G"
 CHI_semiconductor_events.302.b: "Actualizar las radios de forma incremental en su lugar"
 CHI_semiconductor_events.302.d: "Huawei ha anunciado al menos 600 millones de dólares estadounidenses en inversiones de investigación para el 5G hasta 2018. El apoyo estatal puede financiar un impulso integrado para lograr el liderazgo en 5G o limitarse a actualizaciones de radio incrementales que cuestan mucho menos."
 CHI_semiconductor_events.302.t: "La gran apuesta por el 5G"
 CHI_semiconductor_events.303.a: "Defender a Huawei y preservar la continuidad"
 CHI_semiconductor_events.303.b: "Buscar una vía de cumplimiento negociada"
 CHI_semiconductor_events.303.d: "Los Estados Unidos han añadido a Huawei y a numerosas filiales a la Lista de Entidades, restringiendo drásticamente el acceso a la tecnología estadounidense. Huawei refuta las acusaciones independientes de la fiscalía. Pekín puede defender a la empresa y preservar la continuidad o buscar una vía de cumplimiento negociada."
 CHI_semiconductor_events.303.t: "La Lista de Entidades"
 CHI_semiconductor_events.304.a: "Impulsar la fabricación nacional a cualquier coste"
 CHI_semiconductor_events.304.b: "Almacenar lo que podamos y esperar a que terminen los controles"
 CHI_semiconductor_events.304.d: "La ampliación de los controles extranjeros directos sobre los productos ha endurecido el acceso de Huawei a los semiconductores avanzados. La política estatal puede forzar el avance de la fabricación nacional a cualquier coste o almacenar lo que siga estando disponible y esperar a que terminen las medidas de control."
 CHI_semiconductor_events.304.t: "El cuello de botella de los chips"
 CHI_semiconductor_events.305.a: "Una pila soberana integral, desde el silicio hasta el software"
 CHI_semiconductor_events.305.b: "Una fortaleza tecnológica que sobreviva a las medidas de control"
 CHI_semiconductor_events.305.c: "Un competidor de telecomunicaciones con alcance global"
 CHI_semiconductor_events.305.e: "Un ecosistema de consumo construido sobre su propia plataforma"
 CHI_semiconductor_events.305.d: "Dos décadas de expansión, sanciones y sustitución han definido lo que es Huawei. Un teléfono móvil construido con un procesador fabricado en el país ha respondido a la pregunta que los controles de exportación pretendían cerrar. La estrategia estatal se consolida ahora en torno a la forma que ha tomado la empresa."
 CHI_semiconductor_events.305.t: "El segundo ascenso"
 CHI_semiconductor_events.310.t: "El patrimonio de clientes de IBM"
 CHI_semiconductor_events.310.d: "IBM está dispuesta a vender el negocio de ordenadores personales que ella misma inventó, incluyendo la marca ThinkPad en la que ya confían todos los compradores corporativos. Comprarlo convertiría a Lenovo en el tercer fabricante más grande del mundo de la noche a la mañana, asumiendo también las pérdidas que convencieron a IBM de desprenderse de él."
 CHI_semiconductor_events.310.a: "Comprar el negocio de ordenadores personales"
 CHI_semiconductor_events.310.b: "Crecer a partir de lo que construyamos nosotros mismos"
 CHI_semiconductor_events.311.t: "Washington aprueba el acuerdo"
 CHI_semiconductor_events.311.d: "Los reguladores estadounidenses aprobarán la venta de IBM a Lenovo bajo ciertas condiciones: instalaciones separadas, acceso restringido a los registros de clientes gubernamentales y supervisión de quién trabaja en cada lugar. Aceptarlas cierra el acuerdo y admite que un propietario chino es una cuestión de seguridad. Rechazarlas mantiene el principio pero probablemente pierda el negocio."
 CHI_semiconductor_events.311.a: "Aceptar los compromisos de seguridad"
 CHI_semiconductor_events.311.b: "Rechazar condiciones a las que ningún otro comprador se enfrentaría"
 CHI_semiconductor_events.312.t: "Un nombre propio"
 CHI_semiconductor_events.312.d: "La licencia de Lenovo para poner el nombre de IBM en los ThinkPad se agota, y los compradores corporativos han estado adquiriendo la marca en lugar de la empresa que está detrás de ella. Poner el nombre de Lenovo en los productos pone a prueba si cinco años de propiedad compraron alguna credibilidad. Mantener la marca heredada el mayor tiempo posible pospone la cuestión."
 CHI_semiconductor_events.312.a: "Poner nuestro propio nombre en los productos"
 CHI_semiconductor_events.312.b: "Mantener la marca heredada mientras dure"
 CHI_semiconductor_events.313.t: "La alianza madura"
 CHI_semiconductor_events.313.d: "NEC en Japón y Medion en Alemania integrarán sus operaciones en empresas conjuntas con Lenovo en lugar de ser compradas por completo. Estas empresas compran cuota de mercado en países que se resistirían a una adquisición directa, y dejan a los socios voz y voto en lo que se construye. Comprar directamente cuesta más y no rinde cuentas ante nadie."
 CHI_semiconductor_events.313.a: "Construir las empresas conjuntas"
 CHI_semiconductor_events.313.b: "Expandirse directamente y mantener el control"
 CHI_semiconductor_events.314.t: "System x"
 CHI_semiconductor_events.314.d: "IBM está abandonando ahora también el negocio de los servidores de gran volumen, y el mismo argumento se aplica a mayor escala y a un precio más alto. Comprar System x sacaría a Lenovo del mercado de productos de consumo masivo que ya lidera. Quedarse con los ordenadores personales significa defender un negocio cuyos márgenes se reducen cada año."
 CHI_semiconductor_events.314.a: "Comprar también el negocio de servidores"
 CHI_semiconductor_events.314.b: "Defender el negocio de ordenadores personales"
 CHI_semiconductor_events.315.t: "En lo que se convirtió Lenovo"
 CHI_semiconductor_events.315.d: "Dos décadas de Lenovo comprando lo que las empresas occidentales ya no querían han definido lo que es la fabricación informática china y cuánto del hardware mundial funciona a través de ella."
 CHI_semiconductor_events.315.a: "Una plataforma empresarial desde servidores hasta ordenadores de sobremesa"
 CHI_semiconductor_events.315.b: "El fabricante de ordenadores personales del mundo"
 CHI_semiconductor_events.315.c: "Un puente entre la escala china y las marcas extranjeras"
 CHI_semiconductor_events.315.e: "Un campeón nacional"
 CHI_lenovo_enterprise_server_platform: "Plataforma empresarial"
 CHI_lenovo_enterprise_server_platform_desc: "Los ordenadores de sobremesa, los portátiles y los servidores que los respaldan son construidos por una sola empresa que compró cada negocio cuando su anterior dueño se rindió. Los márgenes que los vendedores no pudieron encontrar aparecen una vez que la fabricación se realiza a gran escala."
 CHI_lenovo_global_pc_platform: "Fabricante global"
 CHI_lenovo_global_pc_platform_desc: "Salen más ordenadores personales de las líneas de producción chinas bajo una misma marca que de cualquier otro competidor. Es un negocio de consumo masivo con márgenes estrechos y no existe un rival realista para tal volumen de producción."
 CHI_lenovo_strategic_bridge: "Puente estratégico"
 CHI_lenovo_strategic_bridge_desc: "La fabricación china llega a mercados que rechazarían a un propietario chino, ya que las empresas conjuntas cuentan con socios locales y nombres locales. El control se comparte y las puertas permanecen abiertas."
 CHI_lenovo_domestic_champion: "Campeón nacional"
 CHI_lenovo_domestic_champion_desc: "La empresa creció gracias a lo que construyó y no a lo que compró, y rinde cuentas ante Pekín en lugar de ante un registro de accionistas extranjeros. Su alcance es menor y nada en ella depende del permiso de nadie más."
 china_sar.021.b: "La isla no vale lo que vale la flota. Retirar el ultimátum."
 CHI_TAI_lift_full_blockade: "Levantar el bloqueo total"
 CHI_TAI_lift_full_blockade_desc: "Rebajar el cordón naval a un bloqueo parcial. La presión sobre Taipéi disminuye y la alarma de Washington amaina, pero los puertos de la isla vuelven a abrirse."
 CHI_ernie_national_champion_decision: "Nombrar a Ernie modelo nacional"
 CHI_ernie_national_champion_decision_desc: "Designar al modelo de Baidu como el sistema de referencia para el despliegue estatal y provincial. El estatus de pionero se convierte en prestigio oficial, y los ministerios obtienen una única arquitectura que certificar en lugar de seis.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_ernie_consumer_search_decision: "Integrar a Ernie en el motor de búsqueda"
 CHI_ernie_consumer_search_decision_desc: "Mantener el modelo donde ya están los usuarios en lugar de perseguir contratos empresariales. La distribución es inmediata y los ingresos son reales, a costa del papel de establecimiento de estándares.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_qwen_open_ecosystem_decision: "Respaldar a Qwen como plataforma abierta"
 CHI_qwen_open_ecosystem_decision_desc: "Apoyar la publicación de los pesos (*weights*) y permitir que el ecosistema nacional construya sobre ellos. Cada desarrollador derivado se convierte en una dependencia de la infraestructura china, lo que vale más con el tiempo que los ingresos por licencias.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_qwen_cloud_captive_decision: "Vincular a Qwen al negocio de la nube"
 CHI_qwen_cloud_captive_decision_desc: "Mantener los modelos de vanguardia dentro de Alibaba Cloud como el motivo principal para comprar la computación. Los márgenes se quedan con la plataforma, y también la capacidad de influencia.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_zhipu_academic_pipeline_decision: "Financiar el canal de Tsinghua"
 CHI_zhipu_academic_pipeline_decision_desc: "Tratar al laboratorio como el campo de entrenamiento para la próxima generación de investigadores en lugar de como una empresa de productos. Tarda más en llegar al mercado, pero el efecto se multiplica.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_zhipu_state_procurement_decision: "Canalizar a Zhipu a través de la contratación pública"
 CHI_zhipu_state_procurement_decision_desc: "Garantizar la demanda a través de contratos ministeriales y provinciales. El laboratorio nunca tiene que buscar un mercado, y tampoco tiene que rendir cuentas ante ninguno.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_doubao_consumer_scale_decision: "Impulsar a Doubao a escala masiva"
 CHI_doubao_consumer_scale_decision_desc: "Poner el asistente al alcance de cientos de millones de usuarios a un precio que nadie pueda igualar. La adopción es la métrica de éxito, y la factura de la computación es el coste a pagar por ella.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_doubao_recommendation_core_decision: "Mantener a Doubao dentro del sistema de recomendación"
 CHI_doubao_recommendation_core_decision_desc: "Dirigir el trabajo de vuelta a los sistemas de clasificación y recomendación que ya generan ingresos. Es menos visible que un asistente de consumo, pero considerablemente más rentable.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_deepseek_open_weight_release_decision: "Publicar los pesos de DeepSeek"
 CHI_deepseek_open_weight_release_decision_desc: "Publicar un modelo de clase de vanguardia de forma abierta y dejar que el resto del mundo construya sobre la investigación china. Los controles de exportación pretendían denegar la computación; la publicación convierte esa restricción en un debate sobre quién establece las reglas del juego.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_deepseek_state_aligned_lab_decision: "Integrar a DeepSeek en el esfuerzo estatal"
 CHI_deepseek_state_aligned_lab_decision_desc: "Incorporar el laboratorio al programa nacional con la financiación y la supervisión que ello conlleva. El trabajo de optimización de eficiencia continúa bajo tutela, y deja de estar disponible para el escrutinio de terceros.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_moonshot_long_context_decision: "Apostar por el contexto largo"
 CHI_moonshot_long_context_decision_desc: "Financiar la búsqueda de longitudes de contexto que nadie más ofrece. Una apuesta arriesgada en una sola capacidad; el primer laboratorio que la consiga dominará la categoría.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_moonshot_enterprise_pivot_decision: "Orientar Moonshot hacia las empresas"
 CHI_moonshot_enterprise_pivot_decision_desc: "Cambiar la carrera del mercado de consumo por despliegues contratados con ingresos previsibles. La valoración dejará de subir y el balance contable dejará de sangrar.\n\n§YEl espíritu nacional resultante dura 365 días. Solo puede estar activo un programa de laboratorio de IA a la vez.§!"
 CHI_ernie_national_champion: "Modelo de referencia nacional"
 CHI_ernie_national_champion_desc: "Una única arquitectura certificada se ejecuta en ministerios, provincias y empresas estatales. La contratación pública es más sencilla, los estándares son chinos y la empresa establecida tiene pocos motivos para actuar con rapidez."
 CHI_ernie_consumer_search: "Asistente integrado en la búsqueda"
 CHI_ernie_consumer_search_desc: "El modelo llega a sus usuarios a través del producto de búsqueda en lugar de un equipo de ventas. Los ingresos llegan de inmediato y el papel de establecimiento de estándares pasa a manos de otro."
 CHI_qwen_open_ecosystem: "Ecosistema de pesos abiertos"
 CHI_qwen_open_ecosystem_desc: "La publicación de los pesos (*weights*) convirtió a la plataforma en algo sobre lo que el mundo construye en lugar de licenciarlo. Los ingresos directos son menores, pero la relación de dependencia fluye en la dirección correcta."
 CHI_qwen_cloud_captive: "Vanguardia exclusiva de la nube"
 CHI_qwen_cloud_captive_desc: "Los mejores modelos son la razón principal para alquilar la computación, y no se ejecutan en ningún otro lugar. Tanto los márgenes como el poder de negociación permanecen en la plataforma."
 CHI_zhipu_academic_pipeline: "Canal de investigación académica"
 CHI_zhipu_academic_pipeline_desc: "El laboratorio forma tanto a investigadores como a modelos, y la universidad sigue suministrando a ambos. La producción comercial es modesta, pero la base de talento no lo es."
 CHI_zhipu_state_procurement: "Laboratorio de contratación pública"
 CHI_zhipu_state_procurement_desc: "Los contratos ministeriales garantizan la demanda y marcan el rumbo. La financiación es estable, al igual que la ausencia de cualquier presión competitiva."
 CHI_doubao_consumer_scale: "Despliegue de consumo masivo"
 CHI_doubao_consumer_scale_desc: "Cientos de millones de usuarios diarios a un precio que imposibilita la competencia. La adopción no tiene rival y la factura por inferencia es enorme."
 CHI_doubao_recommendation_core: "Núcleo de recomendación"
 CHI_doubao_recommendation_core_desc: "La investigación nutre a los sistemas de clasificación y recomendación que ya imprimen dinero, en lugar de a un asistente independiente. Poco glamuroso, pero con rendimientos inmediatos."
 CHI_deepseek_open_weight_release: "Lanzamiento de vanguardia abierta"
 CHI_deepseek_open_weight_release_desc: "Un modelo de primera categoría publicado abiertamente, entrenado por una fracción de lo que gastan las empresas establecidas. El argumento de la eficiencia viaja más lejos que el propio modelo."
 CHI_deepseek_state_aligned_lab: "Laboratorio de vanguardia alineado con el Estado"
 CHI_deepseek_state_aligned_lab_desc: "La investigación sobre eficiencia continúa con financiación y supervisión nacionales. La capacidad sigue multiplicándose y los resultados dejan de ser públicos."
 CHI_moonshot_long_context: "Especialista en contexto largo"
 CHI_moonshot_long_context_desc: "Una apuesta deliberada por ofrecer longitudes de contexto que el resto del sector no puede manejar. Estrecho, pero indiscutible allí donde se aplica."
 CHI_moonshot_enterprise_pivot: "Práctica de despliegue empresarial"
 CHI_moonshot_enterprise_pivot_desc: "Los despliegues contratados sustituyeron a la carrera del mercado de consumo. El crecimiento es más lento, los ingresos son previsibles y el laboratorio sobrevive al invierno de la financiación."
 CHI_ai_lab_treasury_15_tt: "Tiene más de §Y15.000 millones§! en reservas de la tesorería"
 CHI_ai_lab_treasury_20_tt: "Tiene más de §Y20.000 millones§! en reservas de la tesorería"
 CHI_pacific_pivot_partner_exists_tt: "Al menos una nación del Pacífico es un §YSocio del Giro del Pacífico§!"
 CHI_TAI_full_blockade_active: "Bloqueo total de Taiwán activo"
 CHI_semiconductor_events.320.t: "La mitad de Tencent por treinta y dos millones"
 CHI_semiconductor_events.320.d: "Tencent está quemando dinero en un servicio de mensajería que nadie paga por usar, y ningún inversor chino la financiará. MIH, un grupo de comunicación sudafricano, ofrece treinta y dos millones de dólares por el 46,5 % y dejará a Pony Ma al frente de la empresa. La alternativa es dinero nacional bajo las condiciones establecidas en Pekín."
 CHI_semiconductor_events.320.a: "Vender la participación a MIH"
 CHI_semiconductor_events.320.b: "Recaudar el dinero en el país"
 CHI_semiconductor_events.321.t: "Tencent cotiza en Hong Kong"
 CHI_semiconductor_events.321.d: "Tencent puede colocar sus acciones en la bolsa de Hong Kong y recaudar capital extranjero frente a una base de usuarios a la que ningún mercado ha puesto precio todavía. La cotización financia todo lo que viene después. También pone las cuentas de una empresa de mensajería china a disposición de cualquiera que desee leerlas, cada trimestre."
 CHI_semiconductor_events.321.a: "Cotizar en la bolsa de Hong Kong"
 CHI_semiconductor_events.321.b: "Seguir siendo privada y crecer con el flujo de caja"
 CHI_semiconductor_events.322.t: "Weixin"
 CHI_semiconductor_events.322.d: "Un equipo de Tencent en Guangzhou, comprado por su producto de correo, quiere construir una aplicación de mensajería telefónica que competiría directamente con QQ. QQ es el negocio sobre el que se apoya toda la empresa. Respaldar al equipo significa financiar a un rival de sí misma; negarse deja a QQ ante el teléfono inteligente bajo sus propios términos."
 CHI_semiconductor_events.322.a: "Permitir que el equipo de Guangzhou la construya"
 CHI_semiconductor_events.322.b: "Defender QQ en el teléfono"
 CHI_semiconductor_events.323.t: "Supercell"
 CHI_semiconductor_events.323.d: "Tencent puede pagar 8.600 millones de dólares por el control de Supercell, el estudio finlandés detrás de Clash of Clans, y ser dueña de los juegos en lugar de licenciarlos en China. Es la mayor suma que una empresa china ha pagado jamás por un negocio de videojuegos. Publicar los títulos de otras personas no cuesta nada y genera una fracción de ello."
 CHI_semiconductor_events.323.a: "Comprar el estudio por completo"
 CHI_semiconductor_events.323.b: "Licenciar y publicar para terceros"
 CHI_semiconductor_events.324.t: "La congelación de licencias"
 CHI_semiconductor_events.324.d: "Los reguladores han dejado de aprobar nuevas licencias de juegos y no dicen cuándo las reanudarán, y los ingresos de Tencent dependen de títulos que no puede lanzar legalmente. Se han esfumado unos doscientos mil millones de dólares de valor de mercado. Construir el aparato de cumplimiento que el Estado exige es lento y costoso; canalizar el negocio a través de mercados extranjeros no es ninguna de las dos cosas."
 CHI_semiconductor_events.324.a: "Construir lo que exige el regulador"
 CHI_semiconductor_events.324.b: "Canalizar los ingresos a través de mercados extranjeros"
 CHI_semiconductor_events.325.t: "En lo que se convirtió Tencent"
 CHI_semiconductor_events.325.d: "Veinticinco años de decisiones sobre quién financia a Tencent, qué posee en el extranjero y hasta qué punto se pliega ante el regulador han definido lo que es el internet de consumo chino."
 CHI_semiconductor_events.325.a: "Un conglomerado de plataformas globales"
 CHI_semiconductor_events.325.b: "Una superaplicación nacional"
 CHI_semiconductor_events.325.c: "Un editor de juegos con licencia"
 CHI_semiconductor_events.325.e: "Un grupo de mensajería independiente"
 CHI_tencent_global_platform_conglomerate: "Conglomerado de plataformas globales"
 CHI_tencent_global_platform_conglomerate_desc: "Tencent posee estudios, redes de pago y servicios de mensajería en cuatro continentes, y la mayor parte de lo que gana en el extranjero lo obtiene a través de empresas que compró en lugar de construir. Las participaciones valen lo que los mercados dicen que valen."
 CHI_tencent_domestic_superapp: "Superaplicación nacional"
 CHI_tencent_domestic_superapp_desc: "La mensajería, los pagos, el transporte y los servicios gubernamentales se ejecutan a través de una sola aplicación en infraestructuras dentro de China. Tencent dejó de ser una empresa que la gente usa y se convirtió en la capa sobre la que se construye todo lo demás."
 CHI_tencent_licensed_games_publisher: "Editor de juegos con licencia"
 CHI_tencent_licensed_games_publisher_desc: "Tencent distribuye lo que el regulador aprueba, en el calendario que este establece, y las aprobaciones llegan porque el aparato de cumplimiento se construyó antes de ser exigido. Es un negocio más pequeño pero estable."
 CHI_tencent_independent_messaging: "Grupo de mensajería independiente"
 CHI_tencent_independent_messaging_desc: "Tencent conservó QQ, mantuvo a sus ingenieros y se mantuvo al margen de las disputas que consumieron al resto del internet chino. Su alcance nunca fue más allá de la aplicación de mensajería."
 CHI_semiconductor_events.330.t: "Veinte millones desde Tokio"
 CHI_semiconductor_events.330.d: "Masayoshi Son ha ofrecido a Alibaba veinte millones de dólares tras una reunión que duró apenas unos minutos, y SoftBank quiere una participación importante de una empresa que aún no genera ingresos. Jack Ma puede aceptar el dinero japonés y asumir la cuestión de propiedad que conllevaba, o puede empezar a cobrar a los exportadores del sitio ahora, mientras estos aún están aprendiendo para qué sirve."
 CHI_semiconductor_events.330.a: "Aceptar el dinero de SoftBank"
 CHI_semiconductor_events.330.b: "Cobrar a los comerciantes y autofinanciarse"
 CHI_semiconductor_events.331.t: "Taobao contra eBay"
 CHI_semiconductor_events.331.d: "eBay es propietaria de EachNet y, con ella, de la mayor parte del comercio de consumo en China, y ha declarado al mercado que la contienda ha terminado. Alibaba puede meter a un equipo en un piso de Hangzhou y construir un rival que no cobre nada a los vendedores durante el tiempo que haga falta. Mantenerse en el comercio entre empresas es rentable y cede el mercado de consumo de forma permanente."
 CHI_semiconductor_events.331.a: "Construir Taobao y no cobrar nada a los vendedores"
 CHI_semiconductor_events.331.b: "Mantener el comercio entre empresas"
 CHI_semiconductor_events.332.t: "El mil millones de Yahoo"
 CHI_semiconductor_events.332.d: "Yahoo pagará mil millones de dólares y entregará su operación en China a cambio del cuarenta por ciento de Alibaba, la mayor inversión extranjera jamás realizada en una empresa de internet china. El dinero resuelve la cuestión de la financiación durante una década. También coloca un asiento extranjero en la junta directiva de la empresa que gestiona el comercio del país."
 CHI_semiconductor_events.332.a: "Aceptar los mil millones y el asiento en la junta"
 CHI_semiconductor_events.332.b: "Mantener el registro de accionistas puramente chino"
 CHI_semiconductor_events.333.t: "Alipay abandona el grupo"
 CHI_semiconductor_events.333.d: "El banco central solo concederá licencias a operadores de pago que estén en manos nacionales, y Alipay ha sido transferida a una empresa que controla Jack Ma sin plantearlo ante la junta de Alibaba. Los directores se enteraron después. Revertir la transferencia significaría disputar la licencia directamente con el regulador, manteniendo congelado el negocio de pagos de Alibaba mientras eso ocurra."
 CHI_semiconductor_events.333.a: "Mantener la transferencia y llegar a un acuerdo con los accionistas"
 CHI_semiconductor_events.333.b: "Revertirla y negociar la licencia"
 CHI_semiconductor_events.334.t: "Se detiene la salida a bolsa de Ant"
 CHI_semiconductor_events.334.d: "La salida a bolsa de Ant Group, la mayor jamás intentada, ha sido suspendida dos días antes de comenzar a cotizar, después de que Jack Ma dijera ante una audiencia en Shanghái que los reguladores dirigen una casa de empeños. Alibaba puede retirarse y reconstruir Ant como un holding financiero supervisado. Seguir adelante significa poner a prueba si el Estado permitirá que una empresa privada controle tal cantidad del crédito chino."
 CHI_semiconductor_events.334.a: "Retirarse y aceptar la supervisión"
 CHI_semiconductor_events.334.b: "Presionar para mantener la salida a bolsa"
 CHI_semiconductor_events.335.t: "En lo que se convirtió Alibaba"
 CHI_semiconductor_events.335.d: "Un cuarto de siglo de decisiones sobre el capital extranjero, el comercio de consumo y qué cantidad de las finanzas chinas puede albergar una sola empresa privada han definido lo que es Alibaba."
 CHI_semiconductor_events.335.a: "Una espina dorsal comercial supervisada"
 CHI_semiconductor_events.335.b: "Un mercado de consumo abierto"
 CHI_semiconductor_events.335.c: "Una casa comercial capitalizada con fondos extranjeros"
 CHI_semiconductor_events.335.e: "Un agente de exportaciones al por mayor"
 CHI_alibaba_supervised_commerce_backbone: "Espina dorsal comercial supervisada"
 CHI_alibaba_supervised_commerce_backbone_desc: "Los almacenes, las redes de distribución y los centros de datos dentro de China sostienen la mayor parte de lo que compra el país, y un regulador vigila el crédito que se mueve a través de ellos. Alibaba dejó de discutir sobre quién la supervisaba y construyó la estructura que no puede ser reemplazada."
 CHI_alibaba_open_consumer_marketplace: "Mercado de consumo abierto"
 CHI_alibaba_open_consumer_marketplace_desc: "Cualquiera puede anunciarse y la plataforma se lleva su parte de lo que se vende. Alibaba nunca aceptó a un supervisor sobre su rama financiera, y el acuerdo se mantiene mientras nadie insista en lo contrario."
 CHI_alibaba_foreign_capitalised_trading_house: "Casa comercial capitalizada con fondos extranjeros"
 CHI_alibaba_foreign_capitalised_trading_house_desc: "Alibaba gestiona el comercio y los accionistas extranjeros controlan el registro de la propiedad. El capital llegó más lejos que el propio negocio."
 CHI_alibaba_wholesale_export_broker: "Agente de exportaciones al por mayor"
 CHI_alibaba_wholesale_export_broker_desc: "Alibaba conecta a las fábricas chinas con los compradores extranjeros y cobra una comisión por la presentación. Nunca tocó el mercado de consumo y nunca necesitó el permiso de nadie para seguir adelante."
 CHI_semiconductor_events.340.t: "Toutiao no tiene editores"
 CHI_semiconductor_events.340.d: "La aplicación de noticias de ByteDance clasifica las historias según lo que abren los lectores en lugar de lo que elige un editor, y Zhang Yiming no quiere ninguna redacción que la controle. La máquina encuentra audiencia más rápido que cualquier mesa de redacción. Sin embargo, también servirá cualquier cosa en la que esa audiencia siga haciendo clic, y eventualmente alguien preguntará quién lo decidió."
 CHI_semiconductor_events.340.a: "Dejar que decida el sistema de clasificación"
 CHI_semiconductor_events.340.b: "Colocar una mesa de redacción sobre el canal de noticias"
 CHI_semiconductor_events.341.t: "Douyin"
 CHI_semiconductor_events.341.d: "ByteDance puede aplicar el mismo sistema de clasificación a vídeos de quince segundos y dejar que elija lo que un desconocido verá a continuación. Nada en el modelo fue construido para otra cosa que no fuera texto. Mantenerse en las noticias es el negocio que ya funciona."
 CHI_semiconductor_events.341.a: "Aplicar el sistema de clasificación a los vídeos cortos"
 CHI_semiconductor_events.341.b: "Mantenerse en las noticias y el texto"
 CHI_semiconductor_events.342.t: "Zhang Yiming se disculpa"
 CHI_semiconductor_events.342.d: "Los reguladores han cerrado Neihan Duanzi de forma permanente y han retirado a Toutiao de las tiendas de aplicaciones, comunicándole a ByteDance que su algoritmo se adelantó a los valores socialistas fundamentales. Zhang Yiming puede publicar la autocrítica y contratar a los miles de revisores que el Estado espera. Impugnar la orden significa argumentar que el resultado de una máquina no es el discurso de la empresa."
 CHI_semiconductor_events.342.a: "Publicar la disculpa y contratar a los revisores"
 CHI_semiconductor_events.342.b: "Impugnar la orden"
 CHI_semiconductor_events.343.t: "Vender TikTok o perderlo"
 CHI_semiconductor_events.343.d: "Washington ha ordenado a ByteDance vender el negocio estadounidense de TikTok, y Oracle y Walmart han preparado una oferta en pocas semanas. Pekín acaba de añadir los algoritmos de recomendación a su lista de control de exportaciones, por lo que el modelo no puede salir sin una licencia. ByteDance puede negarse a exportarlo y perder el mercado estadounidense, o entregar la tecnología junto con la empresa."
 CHI_semiconductor_events.343.a: "Negarse a exportar el algoritmo"
 CHI_semiconductor_events.343.b: "Vender el negocio estadounidense junto con la tecnología"
 CHI_semiconductor_events.344.t: "Desinvertir o ser prohibido"
 CHI_semiconductor_events.344.d: "El Congreso ha dado a ByteDance menos de un año para vender las operaciones estadounidenses de TikTok o perder el acceso a las tiendas de aplicaciones, y los tribunales son la única vía que queda. Litigar mantiene unida a la empresa a un coste considerable y podría fracasar de todos modos. Escindir el negocio estadounidense pone fin a la disputa, y a la propiedad junto con ella."
 CHI_semiconductor_events.344.a: "Litigar y mantener la empresa íntegra"
 CHI_semiconductor_events.344.b: "Escindir el negocio estadounidense"
 CHI_semiconductor_events.345.t: "En lo que se convirtió ByteDance"
 CHI_semiconductor_events.345.d: "Catorce años de decisiones sobre quién clasifica el canal de noticias, quién lo revisa y si el modelo puede salir de China han definido lo que es ByteDance."
 CHI_semiconductor_events.345.a: "Un motor de recomendación soberano"
 CHI_semiconductor_events.345.b: "Una plataforma de atención global"
 CHI_semiconductor_events.345.c: "Un servicio de información con licencia"
 CHI_semiconductor_events.345.e: "Un grupo de noticias editorial"
 CHI_bytedance_sovereign_recommendation_engine: "Motor de recomendación soberano"
 CHI_bytedance_sovereign_recommendation_engine_desc: "El modelo que decide qué verá a continuación una de cada mil millones de personas se entrenó en China, se ejecuta en China y no se puede exportar sin una licencia. ByteDance renunció al mercado estadounidense antes que ceder los pesos de su algoritmo."
 CHI_bytedance_global_attention_platform: "Plataforma de atención global"
 CHI_bytedance_global_attention_platform_desc: "ByteDance llega más lejos de lo que ninguna empresa china ha llegado jamás, y lo hace bajo unas condiciones que los gobiernos extranjeros renegocian cada vez que lo consideran oportuno. La audiencia es real, pero la autorización no es permanente."
 CHI_bytedance_licensed_information_utility: "Servicio de información con licencia"
 CHI_bytedance_licensed_information_utility_desc: "ByteDance clasifica lo que tiene licencia para clasificar y revisa todo antes de que sea distribuido. El regulador dejó de tratarlo como un problema."
 CHI_bytedance_editorial_news_group: "Grupo de noticias editorial"
 CHI_bytedance_editorial_news_group_desc: "ByteDance mantuvo una mesa de redacción sobre el canal de noticias y nunca construyó la plataforma de vídeo. Publica noticias, por lo que las disputas sobre quién eligió la clasificación nunca llegaron a producirse."
 CHI_TAI_intl_org_blockade_embargo_tt: "Cada país que aún reconozca a [TAI.GetNameWithFlag] es sometido a un §Yembargo comercial§!."
 CHI_taiwan_us_support_collapse_tt: "El $CHI_taiwan_us_support$ colapsa a §Y0§!"
 china_sar.049.t: "Washington retira su garantía"
 china_sar.049.d: "Los Estados Unidos han notificado a Taipéi que su garantía de seguridad ya no está vigente y que la designación de Taiwán como Aliado Importante No-NATO ha sido rescindida. Se suspenden las transferencias de armas, se cancelan los ejercicios conjuntos y el personal de enlace se reduce a una presencia testimonial. Taiwán se encuentra ahora sin su principal garante de seguridad."
 china_sar.049.a: "Tendremos que defendernos por nosotros mismos."
 CHI_changhe_aircraft_corp_tank_manufacturer: "Changhe Aircraft Industries Corporation"
 CHI_chengdu_aircraft_corp_aircraft_manufacturer: "Chengdu Aircraft Industry Group"
 CHI_china_south_industries_group_materiel_manufacturer: "China South Industries Group Corporation"
 CHI_china_state_shipbuilding_corporation_naval_manufacturer: "China State Shipbuilding Corporation"
 CHI_shenyang_aircraft_corp_aircraft_manufacturer: "Shenyang Aircraft Corporation"
 CHI_xian_aircraft_corp_aircraft_manufacturer: "Xi'an Aircraft Industrial Corporation"
 CHI_outer_mongolia_expansion: "Reclamar Mongolia Exterior"
 CHI_outer_mongolia_expansion_desc: "El asunto de Mongolia Interior ha sido resuelto y ahora la resolución del asunto de Mongolia Exterior también está sobre la mesa. Este feo producto del Acuerdo de Yalta ha llegado a su fin. Históricamente, los enemigos de China siempre han venido del norte. Debemos mantener nuestras fronteras alejadas de nuestra capital, poner fin a la situación separatista en la estepa mongola, limpiar la raíz separatista del norte y recuperar nuestro escudo septentrional."
 CHI_outer_mongolia_assimilation: "Asimilación de Mongolia Exterior"
 CHI_outer_mongolia_assimilation_desc: "Ha pasado casi un siglo desde la invasión de Ungern, y las tropas fronterizas chinas vuelven a patrullar la frontera de Kyakhta."
 CHI_casic_df17_glide_body: "Vehículo de planeo del DF-17"
 CHI_casic_dfzf_test_range: "Polígono de pruebas del DF-ZF"
 CHI_cssc_hudong_auxiliary_line: "Línea auxiliar de Hudong"
 CHI_cssc_type_901_fast_support: "Tipo 901 de apoyo rápido"
 CHI_cssc_type_903_replenishment: "Tipo 903 de reabastecimiento"
 CHI_cssc_type_926_tender: "Tipo 926 nodriza de submarinos"
 CHI_norinco_trait_sharp_claw_ugv: "UGV Sharp Claw"
 CHI_norinco_trait_vu_t2_autonomy: "Autonomía del VU-T2"
 CHI_russian_arms_dependency_2: "$CHI_russian_arms_dependency$"
 CHI_russian_arms_dependency_2_desc: "El Ejército Popular de Liberación se construyó sobre diseños soviéticos y rusos. Sus armas ligeras comenzaron como el Tipo 56, un Kalashnikov bajo licencia, y su cuerpo blindado creció a partir del Tipo 59, una copia directa del T-54A soviético, mientras que los tanques y vehículos de combate de infantería posteriores aún reflejan el linaje del T-72 y del BMP. La artillería, los transportes y las baterías de defensa aérea comparten la misma ascendencia. La dependencia es más profunda en la propulsión: el AL-31F propulsa al J-10 y al J-11, el RD-93 vuela en el JF-17, y los cazas Su-35 y las baterías S-400 se compraron directamente a Moscú. Cada línea de cazas nacionales depende de una turbina rusa, cada patrón con licencia paga regalías y las oficinas de diseño todavía copian más de lo que crean. Hasta que China forje su propia base militar-industrial, el latido del corazón del ejército se fijará en Rusia.\n§W--------------§!\nNuestra autosuficiencia militar aumenta a través de los enfoques de la industria de defensa como §Y$CHI_norinco_rationalism$§!, §Y$CHI_own_designs$§! y §Y$CHI_ws15_bottleneck_solve$§!, y a través de las decisiones §Y$CHI_invest_domestic_arms_lines$§! y §Y$CHI_localise_licensed_system$§!. Este espíritu nacional §GMejorará§! una vez que la autosuficiencia supere el §Y50§!."
 CHI_russian_arms_dependency_3: "$CHI_russian_arms_dependency$"
