 syria_endemic_corruption: "Endemiczna korupcja"
 syria_endemic_corruption_desc: "The history of Syria is filled with political instability, coups and totalitarianism. This has led to institutions reeking of corruption, nepotism and inefficiency made worse by the decades of Assad rule. A huge effort shall be undertaken to revolutionize the foundations of our country and pave a better and more sustainable future for the country"
 syria_power_vacuum: "Odkurzacz elektryczny"
 syria_power_vacuum_desc: "The Damascus Spring has achieved the first step towards institutional reform by kicking out the al-Assad family from their positions and roles. This has led to slight corruption uprooting but has resulted in a power vacuum yet to be filled, and will take a long while for the country to experience true change"
 syria_return_of_npf_parliamentarians: "Parlamentarzyści NPF"
 syria_return_of_npf_parliamentarians_desc: "In a bid to treat the institutional inefficiency the government has brought back parliamentarians who served the country. Now free from Assad's totalitarian constraints they feel more able to implement changes and carry on their duties. However it's important to note that no true change has been made and on the long while the problems of inefficiency are still present, but the country is stable and able for now"
 syria_entrenched_theocracy: "Ugruntowana teokracja"
 syria_entrenched_theocracy_desc: "Syria has implemented theocratic solutions to the institutional problems it has always suffered. On one hand, this has led to religious moral values inducing slight improvements in tackling corruption but the core problems haven't been solved, nepotism and sectarianism still persist since not all Syrians feel that the government is representative of them, and more problems are awaiting to inevitably reveal their ugly heads. But for now, the people are quiet and things seem stable"
 Syria_centralization_balance_of_power_category: "Budowanie państwa i centralizacja"
 SYR_federal_state_formation_bop_left_side: "Utworzono Federację Syryjską"
 SYR_new_republic_formation_bop_right_side: "Powstanie Republiki Syryjskiej"
 SYR_centralization_bop_mid_range: "Stan obecny"
 SYR_direct_democracy_initiatives_bop_left_side: "Inicjatywy demokracji bezpośredniej"
 SYR_rising_bureaucracy_bop_right_side: "Wzrost biurokratów"
 SYR_federalist_bop_left_side: "Federalizacja"
 SYR_republican_bop_right_side: "Unitarny republikanizm"
 syria_decision_increase_local_accountability_officials: "Zwiększ lokalną odpowiedzialność urzędników"
 syria_decision_increase_local_accountability_officials_desc: "The administrative culture of our country is reeking with corruption, nepotism and inefficiency. We'll start an investigative campaign to uncover and root out corruption to encourage transparent and accountable institutions. The success of the campaign depends on our corruption, police spending, minority inclusivity, and whether populists are in our government as their skills and experience may help"
 syria_decision_find_promising_bureaucracy: "Znajdź i zachęcaj obiecujących biurokratów"
 syria_decision_find_promising_bureaucracy_desc: "Years of totalitarian rule has led to inefficient and unpopular people being in charge of institutions and governmental posts. And the sudden change towards democracy has revealed the lack of an efficient bureaucracy that can handle its responsibilities in a manner that the people can deem trustworthy and transparent. We will initiate efforts to incentivize and recruit people with capable skills to the posts they deserve to fill and allow for streamlined administrative work to be done. This will depend on our bureaucracy budget, minority inclusivity to combat sectarian nepotism, corruption and whether populists are in our government since they have some experience in handling governmental affairs"
 syria_decision_build_bureaucratic_infrastructure1: "Rozszerz infrastrukturę biurokratyczną"
 syria_decision_build_bureaucratic_infrastructure1_desc: "The infrastructure of our country is one of the poorest and most backwards in the region. This has led to poor perception towards the state institutions and lack of trust in them as a capable force that can provide goods and services. We'll have to enhance our infrastructure in order to expand our government's reach and implement proper centralization of state and society"
 syria_decision_build_bureaucratic_infrastructure2: "Rozszerz infrastrukturę biurokratyczną"
 syria_decision_build_bureaucratic_infrastructure2_desc: "Our efforts in expanding the infrastructure have slightly improved our people's perception of our central authority. However we still need to improve our infrastructure further to achieve proper centralization and expand our administrative reach even more"
 syria_decision_build_bureaucratic_infrastructure3: "Rozszerz infrastrukturę biurokratyczną"
 syria_decision_build_bureaucratic_infrastructure3_desc: "Owoce naszych wysiłków są zbierane. Droga do właściwej centralizacji może zostać zrealizowana, a nasz kraj może być prawdziwie i w pełni zjednoczony"
 syria_decision_build_bureaucratic_infrastructure4: "Rozszerz infrastrukturę biurokratyczną"
 syria_decision_build_bureaucratic_infrastructure4_desc: "The last stages of our infrastructure improvement have been reached. The government's authority is realized and respected throughout the country and the rule of law is prevalent everywhere"
 syria_decision_fund_voluntary_organizations: "Fundusze na organizacje wolontariackie"
 syria_decision_fund_voluntary_organizations_desc: "Ethnic divisions are prevalent throughout the country and the most important remedy for that is encouraging voluntary organizations that transcend ethnic divides and aim for the betterment of lives and cooperation between people of the different backgrounds and sects. The success of our efforts will depend on minority inclusiveness and federalists in government who will be quite helpful in giving assurances and incentivizing political activity and cooperation"
 syria_decision_encourage_economic_self_reliance: "Zachęcaj do samodzielności gospodarczej"
 syria_decision_encourage_economic_self_reliance_desc: "Gospodarka kraju cierpiała przez dziesięciolecia z powodu złego zarządzania i nieefektywności. Będziemy zachęcać do wolnego handlu i liberalizacji gospodarczej, aby zachęcić ludzi do zakładania firm i pracy dla nich. Jeśli się powiedzie, wiele stanów rozkwitnie gospodarczo, a kraj doświadczy wzrostu gospodarczego. Ale aby to się stało, korupcja musi być niska, musi być zapewniona inkluzywność mniejszości dla rozwoju międzywyznaniowego, wydatki biurokracji na najniższym poziomie, aby trzymać rząd z dala od gospodarki, a federaliści w rządzie, aby zapewnić bezpośredni i zdecentralizowany postęp gospodarczy."
 syria_decision_encourage_state_decision_making: "Zachęcaj do podejmowania decyzji na szczeblu państwowym"
 syria_decision_encourage_state_decision_making_desc: "The greatest obstacle in front of our country's betterment is the fact people don't feel motivated enough to think about their political issues and interests. This is largely due to the state being present only to keep people in check and has become a source of fear and distrust rather than an opportunity and tool for the betterment of their lives, and no one feels they belong to the country. It's time to change that and encourage political competition and discourse to make the people feel motivated to be part of decision-making related to the neighborhood and state they reside in. The success of our efforts depends on corruption, minority inclusiveness and federalists being in government"
 SYR_al_abbas_brigades: "Zmobilizować Brygady Al-Abbasa"
 SYR_al_abbas_brigades_desc: "Nadszedł czas, abyśmy zmobilizowali Al-Abbasa do walki z wrogami państwa"
 sectarian_groups_start_to_seek_independence: "Grupy wyznaniowe zaczynają dążyć do niepodległości"
 FSA_rebel_fighting_spirit_idea: "Duch walki rebeliantów"
 FSA_rebel_fighting_spirit_idea_desc: "Wolna Armia Syrii rozpoczęła działania z duchem walki i jest gotowa do walki z reżimem Al-Assada. Jest gotowa walczyć o wolność kraju i prawa ludzi."
 SyriaFocus.108.d1: "Stworzyliśmy silny przemysł animacji. Dzięki współpracy naszych studiów z Japonią i intensywnemu wsparciu cyfrowemu, wiele znaczących dzieł dotarło do szerokiej publiczności w kraju i za granicą."
 SyriaFocus.108.d2: "Stworzyliśmy silny przemysł animacji. Dzięki współpracy naszych studiów z Chinami i intensywnemu wsparciu cyfrowemu, wiele znaczących dzieł dotarło do szerokiej publiczności w kraju i za granicą."
 SyriaFocus.108.d3: "Inwestując intensywnie w digitalizację, stworzyliśmy własny, szanowany przemysł animacji, odpowiedzialny za tworzenie znaczących dzieł, które zyskały popularność w kraju i za granicą. Pokazaliśmy światu kreatywność naszych ludzi i naszą wyjątkową estetykę."
