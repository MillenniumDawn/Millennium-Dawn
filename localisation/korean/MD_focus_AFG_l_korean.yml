 AFG_fence_along_southern_afghanistan_border_tt: "§Y남부§! 아프가니스탄에서 [PAK.GetNameWithFlag] 측과 접하는 모든 국경에 §G1§!의 요새 추가"
 AFG_fence_along_northern_afghanistan_border_tt: "§Y북부§! 아프가니스탄에서 [PAK.GetNameWithFlag] 측과 접하는 모든 국경에 §G1§!의 요새 추가"
 AFG_secure_border_with_pakistan_tt: "\n아프간-파키스탄 국경을 따라 보안 요새를 지음으로써, 다른 국가로의 £GFX_AFG_salafist_jihadism  §R탈레반§! 침투의 효율성이 §G감소§!할 것입니다. 건설은 정치적 중요성으로 인해 §Y중앙§! 아프가니스탄에서부터 시작될 것이며 이후 §Y남부§!와  §Y북부§! 아프가니스탄에 차례로 건설될 것입니다.\n"
