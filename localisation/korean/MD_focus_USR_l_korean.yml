 union_state.16.t: "[ARM.GetName]의 지역 군사 집단"
 union_state.16.d: "아르메니아와 러시아 정부는 연합 국가의 합동 군사 집단을 확대하기로 결정했으며, 두 국가의 군 통합은 한층 더 공고해졌습니다."
 union_state.16.a: "좋다"
 union_state.17.t: "[ARM.GetName]의 핵무기"
 union_state.17.d: "아르메니아 정부는 연합 국가의 틀 안에서, 적대국의 공격에 대비해 영토 보전을 지키기 위해 자국 영토에 핵무기를 배치해 달라고 요청했습니다. 이는 이웃 국가들에게 분명 침략 행위로 받아들여질 것입니다."
 union_state.17.a: "핵무기가 예레반으로 향한다"
 union_state.17.b: "아니요"
 union_state.18.t: "[ARM.GetName]의 핵무기"
 union_state.18.d: "러시아 정부가 잠재적 침략자로부터 방어하기 위해 우리 영토에 핵무기를 배치하는 데 동의했습니다. 그들이 우리의 가치를 이해해 주어 기쁩니다!"
 union_state.18.a: "알았다"
 union_state.19.t: "[ARM.GetName]의 핵무기"
 union_state.19.d: "러시아 정부가 잠재적 침략자로부터 스스로를 지키기 위한 우리 영토 내 핵무기 배치를 거부했습니다. 이에 우리는 슬픔을 느낍니다. 그들은 우리를 방어선 이상으로 여기지 않는 듯합니다."
 union_state.19.a: "유감이다"
 union_state.20.t: "경제 통합 확대"
 union_state.20.d: "[FROM.GetName]이(가) 연합 국가로의 경제 통합을 확대했으며, 이제 우리의 경제는 이전보다 한층 더 가까워졌습니다."
 union_state.20.a: "좋다"
 union_state.21.t: "축소된 연합 국가"
 union_state.21.d: "[FROM.GetName]이(가) 자국의 정치적 이익과 연합 국가 소속이 일치하지 않는다는 이유로 연합 국가 탈퇴를 발표했습니다."
 union_state.21.a: "유감이다"
 union_state.22.t: "연합 국가의 성전"
 union_state.22.d: "러시아가 선포한 성전은 연합 국가의 외교 정책 교리와도 부합합니다. 우리는 공동의 목표를 향해 함께 나아갈 것입니다!"
 union_state.22.a: "만세!"
 union_state.23.t: "연합 국가의 성전"
 union_state.23.d: "러시아가 선포한 성전은 연합 국가의 외교 정책 교리와도 부합합니다. 우리는 공동의 목표를 향해 함께 나아갈 것입니다!"
 union_state.23.a: "만세!"
 union_state.25.t: "연합 국가 예산에서의 투자"
 union_state.25.d: "[FROM.GetName]이(가) 연합 국가의 예산, 곧 우리의 예산에서 투자를 해 달라고 요청하고 있습니다. 그들의 주장에 따르면 열악한 경제 상황 때문에 어쩔 수 없이 요청하는 것이라고 하는데, 우리가 도와주겠습니까?"
 union_state.25.a: "그들을 돕자"
 union_state.25.b: "예산은 무한하지 않다"
 union_state.26.t: "연합 국가 예산에서의 투자"
 union_state.26.d: "우리의 요청이 승인되어 연합 국가의 예산으로부터 필요한 투자를 받았습니다!"
 union_state.26.a: "알았다"
 union_state.27.t: "연합 국가 예산에서의 투자"
 union_state.27.d: "우리의 투자 요청이 거부되었습니다. 연합 국가의 재정에 의지할 수 없는 듯합니다."
 union_state.27.a: "유감이다"
 union_state_belarus.1.t: "연합 찬성 쿠데타"
 union_state_belarus.1.d: "우리는 모든 행정 및 법 집행 자원과 연줄을 동원하여 벨라루스에서 권력 쿠데타를 시도했습니다."
 union_state_belarus.1.a: "결과를 보자"
 union_state_armenia.1.t: "아제르바이잔에서의 군사 작전"
 union_state_armenia.1.d: "아르메니아, 정확히는 연합 국가 내 아르메니아 대표들이 오늘 아제르바이잔에 대한 즉각적인 타격과 코카서스에서 연합 국가에 대한 위협의 종식을 촉구하는 공격적인 수사를 시작했습니다. 아니나 다를까 이후 아르메니아 지도부는 직접 우리에게 전쟁을 시작해 달라고 요청했습니다."
 union_state_armenia.1.a: "아제르바이잔을 끝낼 때가 왔다"
 union_state_armenia.1.b: "미친 짓이다"
 union_state_armenia.2.t: "아제르바이잔에서의 군사 작전"
 union_state_armenia.2.d: "러시아가 우리의 제안을 받아들여 아제르바이잔에서의 군사 작전을 즉시 개시한다고 발표했습니다. 그들은 마침내 끝장나게 될 것입니다!"
 union_state_armenia.2.a: "아제르바이잔을 끝낼 때가 왔다"
 union_state_armenia.3.t: "아제르바이잔에서의 군사 작전"
 union_state_armenia.3.d: "러시아는 아제르바이잔 침공 제안을 거부했으며, 우리의 발상을 연합 국가의 이념에 맞지 않는 미친 공격성의 표출로 간주했습니다."
 union_state_armenia.3.a: "유감이다"
 union_state_armenia.4.t: "폴란드의 지원을 요청하는 아르메니아"
 union_state_armenia.4.d: "아르메니아 정부는 최근 폴란드 정부의 통제권을 장악했고, 이는 그곳에서 내전을 촉발했습니다. 이제 아르메니아는 폴란드가 독립을 지키도록 돕자고 우리에게 요청하고 있습니다."
 union_state_armenia.4.a: "GRU를 보낸다"
 union_state_armenia.4.b: "바그너 민간군사기업을 보낸다"
 union_state_armenia.4.c: "GRU와 바그너 민간군사기업을 보낸다"
 union_state_armenia.4.f: "아무도 보내지 않는다."
 union_state_armenia.5.t: "우리 괴뢰국에 보낸 러시아의 지원"
 union_state_armenia.5.d: "러시아는 우리 괴뢰국을 돕기로 동의했으며, 특수 기관 대대 여러 개 규모의 추가 지원을 보내고 있습니다."
 union_state_armenia.5.a: "알았다"
 union_state_armenia.6.t: "우리 괴뢰국 지원을 거부한 러시아"
 union_state_armenia.6.d: "러시아는 이 쿠데타를 조직한 것이 우리인 만큼 이는 오로지 우리의 문제라고 보아, 우리 괴뢰국을 도와 달라는 요청을 거부했습니다."
 union_state_armenia.6.a: "유감이다"
 union_state_armenia.7.t: "이탈리아의 지원을 요청하는 아르메니아"
 union_state_armenia.7.d: "아르메니아 정부는 최근 이탈리아 정부의 통제권을 장악했고, 이는 그곳에서 내전을 촉발했습니다. 이제 아르메니아는 이탈리아가 독립을 지키도록 돕자고 우리에게 요청하고 있습니다."
 union_state_armenia.7.a: "GRU를 보낸다"
 union_state_armenia.7.b: "바그너 민간군사기업을 보낸다"
 union_state_armenia.7.c: "GRU와 바그너 민간군사기업을 보낸다"
 union_state_armenia.7.f: "아무도 보내지 않는다."
 union_state_armenia.8.t: "코카서스 합동 분리주의 소탕 작전"
 union_state_armenia.8.d: "러시아 정부는 러시아 코카서스의 여러 공화국에 있는 분리주의 성향 급진 세력에 맞서 합동 분리주의 소탕 작전을 수행하자고 제안합니다. 우리는 러시아를 지원하고 연합 국가 내 정치적 비중을 높이게 될 것입니다."
 union_state_armenia.8.a: "동의한다"
 union_state_armenia.8.b: "동의하지 않는다"
 union_state_armenia.9.t: "코카서스 합동 분리주의 소탕 작전"
 union_state_armenia.9.d: "아르메니아 정부가 우리 특수 기관과 함께 코카서스에서 합동 분리주의 소탕 작전을 수행하는 데 동의했습니다."
 union_state_armenia.9.a: "알았다"
 union_state_armenia.10.t: "코카서스 합동 분리주의 소탕 작전"
 union_state_armenia.10.d: "아르메니아 정부가 우리 특수 기관과 함께 코카서스에서 합동 분리주의 소탕 작전을 수행하는 것을 거부했습니다."
 union_state_armenia.10.a: "유감이다"
 union_state_armenia.12.t: "아르메니아와 러시아의 연합 정보기관"
 union_state_armenia.12.d: "연합 국가 내에서 아르메니아와 러시아 간의 협력이 계속 확대되고 있습니다. 국내외 활동에서의 더 나은 협력을 위해 양국 특수 기관 간에 단일 조정 기관을 창설하는 협정이 체결되었습니다."
 union_state_armenia.12.a: "알았다"
 union_state_news.5.t: "'석유 능선' 군사 작전"
 union_state_news.5.d: "러시아와 아르메니아는 연합 국가의 틀 안에서 연합 국가에 대한 위협을 제거하고 코카서스에서 적대적 정치 세력의 영향력을 잠재적으로 줄이기 위해 아제르바이잔 영토에서의 군사 작전 개시를 발표했습니다."
 union_state_news.5.a: "흥미롭군"
 USR_Supreme_State_Council_loc1: "\n§g최고 국가 평의회§!:\n£political_power_texticon  일일 정치력 획득량: §G+1.00%§!\n£stability_texticon  안정도: §G+1.00%§!\n§Y[ROOT.GetNameWithFlag]§! 내 [SOV.GetFlag] 러시아 §H영향력 배율§!: §R+15%§!\n"