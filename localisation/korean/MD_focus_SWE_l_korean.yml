 Sweden_foci.6003.t: "거부된 스웨덴의 잠수함 조달 요청"
 Sweden_foci.6003.d1: "독일이 전략적 고려와 기존 약속을 이유로 212형 잠수함을 조달하겠다는 스웨덴의 요청을 거절했습니다. 이 결정은 향후 방위 협력에 영향을 미칠 수 있습니다."
 Sweden_foci.6003.d2: "러시아가 지정학적 파장과 전략적 우선순위를 이유로 라다급 잠수함을 구매하겠다는 스웨덴의 제안을 거절했습니다. 이 거절은 군사 협력을 강화할 기회를 놓친 것입니다."
 Sweden_foci.6003.d3: "미국이 자국의 방위 수요와 수출 정책을 우선시하여, 시울프급 잠수함을 조달하겠다는 스웨덴의 요청을 거부했습니다. 이 결정은 향후 외교 관계에 영향을 미칠 수 있습니다."
 Sweden_foci.6003.o1: "다음 국빈 방문 때는 수르스트뢰밍을 대접하자"
 Sweden_foci.6004.t: "스웨덴 신형 잠수함 취역식"
 Sweden_foci.6004.d1: "스톡홀름에서 열린 공식 행사에서 새로 도입한 212형 잠수함이 스웨덴 해군에 정식으로 취역했습니다. 이 행사에는 다수의 독일 대표단이 참석하여 양국 관계의 강화를 부각시켰으며 향후 협력의 토대를 마련했습니다."
 Sweden_foci.6004.d2: "스톡홀름에서 열린 공식 행사에서 새로 도입한 라다급 잠수함이 스웨덴 해군에 정식으로 취역했습니다. 러시아 고위 인사들의 참석은 양국 간 방위 협력이 커지고 있음을 보여 주었으며, 향후 관계에 도움이 될 수 있습니다."
 Sweden_foci.6004.d3: "스톡홀름에서 열린 공식 행사에서 새로 도입한 시울프급 잠수함이 스웨덴 해군에 정식으로 취역했습니다. 미국 고위 관리들이 자리를 빛낸 이 행사는 깊어지는 방위 동반자 관계와 우리의 향후 관계에 미칠 긍정적 영향을 강조했습니다."
 Sweden_foci.6004.d4: "우리나라에게 자랑스러운 순간입니다. 스웨덴이 개발한 잠수함이 스톡홀름에서 열린 행사에서 해군에 정식으로 취역했습니다. 이 성과는 우리의 해군력을 강화할 뿐 아니라 방위 기술에서의 자립과 혁신에 대한 우리의 의지를 보여 줍니다."
 Sweden_foci.6004.o1: "해군력 발전의 이정표를 기념한다"
