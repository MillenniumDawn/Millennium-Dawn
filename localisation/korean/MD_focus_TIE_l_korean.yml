l_korean:
 TIE_pastoral_culture: "유목 문화"
 TIE_pastoral_culture_desc: "토우부족은 여전히 대부분 목축민과 유목민으로 살아가며, 일부는 오아시스 근처에서 농사를 짓습니다. 오아시스, 목초지, 우물은 씨족 단위로 나뉘어 있습니다. 사하라의 혹독한 사막에서는 삶을 이어갈 다른 기회가 거의 없습니다."
 TIE_soborom_hot_springs: "소보롬 온천"
 TIE_soborom_hot_springs_desc: "소보롬 온천은 티베스티 산맥 서부에 위치한 분기공과 진흙 화산이 딸린 일련의 온천입니다. 많은 토우부족은 이 온천에 치유 효과가 있다고 믿으며, 따라서 질병을 치료하러 찾는 인기 있는 장소입니다."
 TIE_clan_structure: "씨족 구조"
 TIE_clan_structure_desc: "토우부족 사회는 씨족을 기반으로 세워져 있습니다. 각 씨족은 특정한 목초지, 우물, 오아시스를 소유합니다. 토우부족은 가족 다음으로 자신이 속한 씨족에 일체감을 느낍니다. 사하라의 광활한 사막에서는 씨족이 있다는 것이 어디를 가든 우호적인 얼굴을 만날 수 있음을 뜻합니다. 그러나 씨족 체제는 국가의 권위를 약화시키는 반면, 협상할 단일한 권위가 없기 때문에 어떤 침략자도 토우부족을 굴복시키기 어렵다는 이점도 있습니다."
 TIE_sharia_law: "샤리아 법"
 TIE_sharia_law_desc: "토우부족의 종교 지도자들은 샤리아 법정을 세웠습니다. 그러나 차드의 이슬람은 지역 종교로부터 많은 영향을 받아, 샤리아를 시행하는 것이 이상적인 만큼 효과적이지는 않습니다."
 TIE_money_from_refugees: "난민으로 얻는 수익"
 TIE_money_from_refugees_desc: "이 나라의 지하디스트들은 사람들을 리비아로 밀입국시켜 지중해를 건너 유럽으로 갈 수 있도록 하는 일에 가담하고 있습니다."
 TIE_derde: "데르데"
 TIE_derde_desc: "데르데라는 직위는 토우부족에 대한 최고 사법 권위로서 기능하도록 만들어졌습니다. 데르데는 토마그라 씨족의 가장 유력한 세 가문 가운데서 선출됩니다. 데르데가 사망하면 직위는 그의 아들이 아닌 나머지 두 가문 중 하나에게 넘어갑니다."
 TIE_punching_above: "토우부족의 정치적 영향력"
 TIE_punching_above_desc: "차드에서는 나라의 정치 엘리트 상당수가 민족적으로 토우부족입니다. 토우부족은 소수임에도 언제나 자기 체급 이상의 역할을 해 왔으며, 차드의 정치적 암투는 그들에게 많은 교훈을 가르쳐 주었습니다."
 TIE_clan_elders: "씨족 원로"
 TIE_clan_elders_desc: "토우부족 씨족의 원로들은 씨족 간의 사법 문제를 중재하며, 나라를 앞으로 이끌 정치 담론의 일부도 다룹니다."
 TIE_natron: "나트론 채굴"
 TIE_natron_desc: "토우부족은 가정에서 다양하게 쓰이는 소금과 비슷한 물질인 나트론을 채굴하고 있습니다."
 TIE_trans_saharan_trade_1: "사하라 횡단 무역"
 TIE_trans_saharan_trade_1_desc: "토우부족은 되살아난 사하라 횡단 무역로에서 중개자 역할을 하고 있습니다."
 Mahamat_Nouri_desc: "마하마트 누리는 오랜 세월 반군 지도자로 활동해 온 인물입니다. 누리는 제1차 차드 내전에서 FROLINAT 반군 조직의 일원으로 싸웠으며, 리비아의 지원을 받아 당시 대통령이자 초대 차드 대통령이던 프랑수아 톰발바예를 타도했습니다. 이후 그는 구쿠니 웨데이 휘하에서 복무했고, 결국 히센 하브레가 웨데이를 몰아내는 것을 도왔습니다. 이후 그는 차드-리비아 분쟁에서 차드의 가장 노련한 지휘관 중 한 명으로 복무했습니다. 이드리스 데비의 반군이 하브레를 축출한 뒤, 누리는 다시 한번 편을 바꾸었습니다. 그러나 이제 누리는 토우부족을 독립 국가로 이끌 기회를 얻으면서 다른 길을 선택했습니다."
 Goukouni_Oueddei_desc: "웨데이는 리비아의 도움으로 당시 차드 대통령 펠릭스 말룸을 타도한 반군 조직 FROLINAT의 선도적 지휘관으로 출발했습니다. 웨데이는 대통령이 되었으나, 곧 리비아의 영향력에 반대하던 동맹 히센 하브레에게 배신당했습니다. 웨데이는 차드-리비아 분쟁 동안 리비아가 후원하는 반군 지도자로서 하브레와 계속 싸웠습니다. 1985년, 그는 차드와 휴전 협상을 시도한다는 의심을 받아 리비아 경찰에 의해 가택 연금되었습니다. 몇 달 뒤 리비아 경찰이 그를 체포하려다 복부에 총상을 입었습니다. 2년 후 그는 알제리로 이주했으나, 여전히 리비아와 좋은 관계를 유지하고 있다고 주장했습니다. 웨데이는 토우부족의 마지막 데르데였던 웨데이 키치데미의 아들입니다."
 TIE_birth_of_a_nation: "국가의 탄생"
 TIE_birth_of_a_nation_desc: "토우부족은 자신들만의 국가는 고사하고 이렇다 할 자치권조차 가져 본 적이 없습니다. 사막을 떠도는 씨족들의 집합을 온전한 국가로 바꾸기 위해서는 많은 노력이 필요합니다."
 TIE_arm_tribesmen: "부족민 무장"
 TIE_arm_tribesmen_desc: "우리의 고향을 지키기 위해 우리는 서둘러 일부 주민들에게 무기를 지급해야 합니다."
 TIE_toubou_warrior_spirit: "토우부족의 전사 정신"
 TIE_toubou_warrior_spirit_desc: "우리는 스스로를 전사의 민족으로 여깁니다. 우리는 수 세기 동안 제국과 적들 속에서 살아남았으며, 그 무엇도 우리를 무너뜨릴 수 없습니다."
 TIE_warrior_spirit: "전사 정신"
 TIE_warrior_spirit_desc: "토우부족은 수 세기 동안 사막에서 살아남았으며, 이제 와서 포기하지 않을 것입니다."
 TIE_tibesti_fortress: "티베스티 산악 요새"
 TIE_tibesti_fortress_desc: "티베스티 산맥은 치명적인 협곡과 겔타로 이루어져 있습니다. 이곳에 접근하는 어떤 침략자도 우리 병사들을 몰아내기 어려울 것입니다. 약간의 준비만 갖춘다면 이 산맥을 거의 난공불락으로 만들 수 있습니다."
 TIE_camel_corps: "낙타 부대"
 TIE_camel_corps_desc: "도로가 드물고 상태도 나쁘기 때문에 우리 민족은 주로 낙타를 타고 사막을 가로지릅니다. 우리 민족은 사막의 달인이 되었으며, 이 지식을 전쟁에 응용할 수 있습니다."
 TIE_warrior_experience: "전사의 경험"
 TIE_warrior_experience_desc: "차드가 관련된 거의 모든 분쟁에서 우리 민족은 최전선에 있었습니다. 차드 내전, 차드-리비아 전쟁, 그리고 지역 내 수많은 소규모 반란이 그러했습니다. 우리는 이 경험을 활용하여 군대를 개선할 수 있습니다."
 TIE_local_military_production: "현지 무기 생산"
 TIE_local_military_production_desc: "무기를 현지에서 만드는 것은 그리 어렵지 않을 것입니다. 탈레반은 아프가니스탄의 산악 지대에서 그렇게 하고 있습니다. FARC는 콜롬비아의 정글에서 그렇게 하고 있습니다. 우리가 사하라의 사막에서 못 할 이유가 있겠습니까?"
 TIE_hold_clan_meeting: "씨족 회의 소집"
 TIE_hold_clan_meeting_desc: "우리는 씨족 회의를 열어야 합니다. 씨족 원로, 종교 인사, 군 지휘관들과 함께 토우부족의 운명을 결정해야 합니다."
 TIE_establish_sharia_courts: "샤리아 법 확립"
 TIE_establish_sharia_courts_desc: "토우부족에게 샤리아 법을 확립해야 합니다. 그들 대부분은 현지 아프리카 전통이 크게 섞인 형태의 이슬람을 따르고 있습니다. 그들은 참된 이슬람을 배워야 합니다."
 TIE_seek_help_from_boko_haram: "보코 하람에 도움 요청"
 TIE_seek_help_from_boko_haram_desc: "보코 하람은 나이지리아, 차드, 니제르에서 활동하는 지하디스트 조직입니다. 우리는 그들의 병사들에게 안전한 피난처를 제공할 수 있습니다."
 TIE_make_money_of_refugees: "난민으로 돈벌이"
 TIE_make_money_of_refugees_desc: "사하라 이남 아프리카에서 리비아를 거쳐 유럽으로 향하는 이주민의 흐름이 있습니다. 우리도 이 이주민의 흐름에 가담하여 돈을 받고 사람들을 리비아로 밀입국시켜야 합니다. 그리고 부유한 어리석은 자들은 납치하여 그 가족에게서 돈을 받아낼 것입니다."
 TIE_break_clan_structure: "씨족 구조 타파"
 TIE_break_clan_structure_desc: "토우부족은 씨족으로 나뉘어 있습니다. 사하라의 광활한 사막에서는 언제든 찾아갈 안전한 피난처를 두는 것이 필수입니다. 그러나 사람들은 국가보다 가족에게 더 충성합니다. 우리는 씨족 없이도 사람들을 하나로 묶을 수 있도록 국가, 종교, 문화 같은 공통된 정체성을 장려해야 합니다."
 TIE_large_scale_farming: "대규모 영농"
 TIE_large_scale_farming_desc: "우리 민족 대부분은 유목 목축민입니다. 우리는 씨족들로부터 지원자를 모아 가축을 하나의 큰 무리로 모아 중앙에서 관리할 수 있도록 해야 합니다. 이것이 토우부족을 위한 산업의 시작이 될 것입니다."
 TIE_prepare_for_war: "전쟁 준비"
 TIE_prepare_for_war_desc: "이웃 나라들은 우리의 통치 방식을 인정하지 않을 것입니다. 너무 늦기 전에 그들과의 전쟁을 준비해야 합니다."
 TIE_declare_the_caliphate: "칼리파국 선포"
 TIE_declare_the_caliphate_desc: "우리는 신실한 형제들과 함께하여 서방에 대한 지하드를 선포해야 합니다!"
 TIE_reappoint_derde: "데르데 재임명"
 TIE_reappoint_derde_desc: "데르데는 한때 토우부족의 최고 사법 권위였으며, 토마그라 씨족의 가장 유력한 세 가문에서 선출되었습니다. 1966년 차드 정부는 당시 데르데였던 웨데이 키치데미의 아들 다섯 중 넷을 살해하고 그를 망명으로 내몰았습니다. 이는 제1차 차드 내전의 도화선이 되었습니다. 이후 데르데는 토우부족의 정치적, 군사적 상징이 되었으며, 반군 조직 FROLINAT는 데르데의 유일하게 남은 아들인 구쿠니 웨데이가 이끌었습니다. 우리는 씨족들에 대한 최고 사법 권위로서 기능할 새로운 데르데를 선출해야 합니다."
 TIE_punch_above_our_weight: "체급 이상의 역할"
 TIE_punch_above_our_weight_desc: "차드에서는 두 명의 대통령을 포함하여 정치 엘리트의 상당수가 토우부족입니다. 우리는 소수임에도 정치 게임을 하는 법을 항상 알고 있었습니다. 이 기술을 최대한 활용해야 합니다."
 TIE_middle_of_nowhere: "외딴 오지"
 TIE_middle_of_nowhere_desc: "우리는 말 그대로 외딴 오지에 위치해 있습니다. 가장 가까운 해안선은 천 킬로미터 떨어져 있으며, 어느 방향으로 국경을 넘어도 끝없는 모래 사막이 맞이합니다. 우리의 존립이 이에 달려 있으므로 이웃 나라들과 좋은 관계를 유지하는 것이 중요합니다."
 TIE_derde_guard: "데르데 근위대"
 TIE_derde_guard_desc: "데르데에게는 자신만의 친위대가 필요합니다. 이 정예 부대는 우리 군이 필요로 하는 곳이라면 어디서든 돌격 부대로 활약할 것입니다."
 TIE_join_libya: "리비아와 통합"
 TIE_join_libya_desc: "제1차 차드 내전 이후 토우부족 출신 대통령이 리비아의 도움으로 나라를 장악했을 때, 차드와 리비아를 통합하자는 논의가 있었습니다. 우리는 차드가 아니지만, 리비아에도 토우부족이 있다는 점을 고려하면 그들에게 통합을 제안해 볼 만하지 않겠습니까?"
 TIE_birthright_over_chad: "차드에 대한 우리의 천부적 권리"
 TIE_birthright_over_chad_desc: "제1차 차드 내전 이후 줄곧 차드의 지도자와 정치 엘리트는 토우부족이었습니다. 차드에 대한 통치권은 마땅히 우리의 것이며, 필요하다면 무력으로라도 우리가 마땅히 받아야 할 것을 쟁취해야 합니다."
 TIE_rely_on_clan_elders: "씨족 원로에 의존"
 TIE_rely_on_clan_elders_desc: "씨족 구성원의 삶을 통제할 단일 인물이나 집단을 임명하기보다는, 사법 권위를 씨족 원로들의 어깨에 맡겨야 합니다. 그들은 수 세기 동안 씨족 간에 생겨나는 문제와 사안을 처리해 왔습니다. 그들은 우리의 전통을 가장 잘 알고 있으며, 이를 지키기에 가장 적합한 이들입니다."
 TIE_continue_as_herders: "목축민으로 존속"
 TIE_continue_as_herders_desc: "우리 민족은 수 세기 동안 목축민이었습니다. 정부의 필요에 맞추기 위해 사람들에게 생활 방식을 바꾸도록 강요해서는 안 됩니다."
 TIE_use_azza_to_industrialise: "아자를 활용한 산업화"
 TIE_use_azza_to_industrialise_desc: "토우부족 사회는 카스트 제도로 사회적 계층이 나뉘어 있습니다. 토지를 소유하고 가축을 치는 대신 노동을 하는 사람들을 아자라고 부릅니다. 이들은 수공업, 채굴, 금속 가공, 재단 일을 하며, 전통적으로 토우부족 사회의 상위 계급인 '자유민'에게 멸시와 차별을 받아 왔습니다. 우리는 이들을 멸시해서는 안 되며, 오히려 이들을 활용하여 토우부족을 위한 진정한 산업을 만들어야 합니다."
 TIE_adopt_cfa_franc: "CFA 프랑 도입"
 TIE_adopt_cfa_franc_desc: "CFA 프랑은 현재 서아프리카와 중앙아프리카에서 널리 사용되고 있습니다. 이 통화는 프랑스에 크게 묶여 있지만, 우리 경제에 큰 도움이 될 것입니다."
 TIE_diversify_our_economy: "경제 다각화"
 TIE_diversify_our_economy_desc: "소를 돌보고 대추야자를 기르는 것은 평화로운 삶을 주지만 돈을 버는 데에는 그리 좋은 방법이 아닙니다. 우리는 정부를 위한 다른 수입원을 찾아야 합니다."
 TIE_mine_natron: "나트론 채굴"
 TIE_mine_natron_desc: "나트론은 오래전에 말라붙은 호수에서 발견되는 소금과 비슷한 물질입니다. 과거에는 비누, 구강 청결제, 치약, 소독제, 살충제, 가죽 제조의 원료로 쓰였습니다. 그러나 현대에 들어서는 거의 모든 용도에서 소다회가 이를 대체했습니다. 우리 민족은 여전히 이를 채굴하여 자체 생활용품에 사용하고 있습니다. 소다회의 해외 수입 의존도를 줄이기 위해 이 채굴을 늘려야 합니다."
 TIE_survey_for_gold: "금 탐사"
 TIE_survey_for_gold_desc: "저 언덕에 금이 있다는 소문이 있습니다. 우리는 이를 찾아 채굴을 시작해야 합니다."
 TIE_new_trans_saharan_trade: "되살아난 사하라 횡단 무역"
 TIE_new_trans_saharan_trade_desc: "사하라 횡단 무역로는 한때 우리 영토를 곧장 가로질렀습니다. 오늘날에는 그 부가 거의 남아 있지 않습니다. 자원 생산이 늘어난 지금, 우리의 잠재력을 극대화하기 위해 무역로를 되살려야 합니다."
 TIE_trans_saharan_trade_niger: "[NGR.GetName]행 사하라 횡단 무역로"
 TIE_trans_saharan_trade_niger_desc: "[NGR.GetNameDef]의 주요 수출품은 금입니다. 그들과 무역함으로써 우리는 금 채굴에 관해 새로운 것을 배우게 될 것입니다."
 TIE_trans_saharan_trade_libya: "[LBA.GetName]행 사하라 횡단 무역로"
 TIE_trans_saharan_trade_libya_desc: "[LBA.GetNameDef]의 주요 수출품은 석유입니다. 불행히도 우리나라에서는 석유를 찾는 데 그다지 운이 따르지 않았습니다. [LBA.GetAdjective] 국영 석유 공사의 도움이 있다면 어쩌면 찾을 수 있을지도 모릅니다."
 TIE_trans_saharan_trade_chad: "[CHA.GetName]행 사하라 횡단 무역로"
 TIE_trans_saharan_trade_chad_desc: "[CHA.GetNameDef]은(는) 석유와 금을 모두 수출합니다. [CHA.GetAdjective]의 도움이 있다면 우리의 금과 석유 생산을 늘릴 수 있을 것입니다."
 TIE_build_an_airport: "공항 건설"
 TIE_build_an_airport_desc: "티베스티를 드나드는 도로는 매우 적습니다. 연결성을 개선하기 위해 수도에 작은 활주로를 건설해야 합니다."
 TIE_establish_air_force: "공군 창설"
 TIE_establish_air_force_desc: "우리는 군대라 부를 만한 것조차 변변치 않은데 공군은 말할 것도 없습니다. 그러나 새로 지은 활주로와 성장하는 경제를 바탕으로, 이웃 나라들에 대한 어떤 형태의 지렛대가 필요합니다. 시장에서 쓰다 남은 중고 전투기 정도는 찾을 수 있지 않겠습니까?"
 TIE_import_tourists: "관광 장려"
 TIE_import_tourists_desc: "티베스티 산맥에는 $TIE_soborom_hot_springs$ 같은 볼거리인 자연의 경이가 많이 있습니다. 서방 국가와의 유대를 활용하여 관광 붐을 일으켜야 합니다."
 TibestiFocusEvents.1.t: "무릎 꿇기를 원하는 [FROM.GetNameDef]"
 TibestiFocusEvents.1.d: "[FROM.GetNameDef]의 지하디스트 형제들이 우리에게 연락해 왔습니다. 그들은 국제 지하드에서 우리의 투쟁에 동참하여 타락한 서방에 맞서 싸우는 것을 돕고자 합니다. 어떻게 답하시겠습니까?"
 TibestiFocusEvents.1.a: "그들의 충성을 받아들인다"
 TibestiFocusEvents.1.b: "그들에게는 다른 계획이 있다"
 TibestiFocusEvents.2.t: "[FROM.GetNameDef]의 우리 충성 수용"
 TibestiFocusEvents.2.d: "[FROM.GetNameDef]의 지하디스트 형제들이 우리가 그들의 국제 지하드에 합류하는 것을 허락했습니다."
 TibestiFocusEvents.2.a: "좋아"
 TibestiFocusEvents.3.t: "[FROM.GetNameDef]의 우리 충성 거부"
 TibestiFocusEvents.3.d: "[FROM.GetNameDef]의 지하디스트 형제들이 그들의 국제 지하드에 합류하겠다는 우리의 제안을 거부했습니다."
 TibestiFocusEvents.3.a: "젠장"
 TibestiFocusEvents.4.t: "우리나라와의 합병을 원하는 [FROM.GetNameDef]"
 TibestiFocusEvents.4.d: "[FROM.GetNameDef] 정부가 자국을 우리나라와 합쳐 달라는 요청을 해 왔습니다. 제1차 차드 내전 이후 승리한 대통령은 토우부족 출신이었으며, 그는 카다피의 군사적 지원으로 그 자리에 올랐습니다. 차드와 리비아를 통합할 가능성에 대한 논의가 있었습니다. 그 대통령은 축출되어 사라졌지만, 리비아와의 통합이라는 구상은 토우부족의 마음속에 여전히 살아 있는 듯합니다."
 TibestiFocusEvents.4.a: "그들을 얼마든지 환영한다!"
 TibestiFocusEvents.4.b: "우리는 그들을 원하지 않는다"
 TibestiFocusEvents.5.t: "[FROM.GetNameDef]의 우리 제안 거부"
 TibestiFocusEvents.5.d: "[FROM.GetNameDef] 정부는 어떤 이유에서인지 두 나라를 합치자는 우리의 제안을 거부했습니다."
 TibestiFocusEvents.5.a: "젠장"
 TIE_share_oasis: "오아시스 공유"
 TIE_share_oasis_desc: "모든 자원은 씨족 간에 공유됩니다. 우리는 오아시스, 우물, 목초지를 조사하고 두 씨족 사이에 불평등이 보이면 재분배해야 합니다. 이는 씨족 체제가 제대로 작동한다는 우리 민족의 믿음을 강화할 것입니다."
 TIE_mining_in_aouzou: "아우주 지대 채굴"
 TIE_mining_in_aouzou_desc: "아우주 지대에서 우라늄이 발견되었다는 소문이 있습니다. 우리는 이 귀중한 자원을 즉시 찾아내어 채굴해야 합니다."
 tibesti_focus: "티베스티 국가 중점 트리"
 TIE_import_tourists_tt: "§Y지역 강국§!인 모든 §Y유럽 국가§!가 우리에 대해 최소 §Y10%§!의 영향력을 가지고 있어야 합니다."