 module_sonar_8: "Sonar VIII"
 module_sonar_8_desc: "La technologie sonar hyperavancée combine détection à portée extrême, priorisation des menaces en temps réel et réduction avancée du bruit, représentant le pinacle de la détection sous-marine et de la lutte anti-sous-marine.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
 module_sonar_9: "Sonar IX"
 module_sonar_9_desc: "La technologie sonar ultra-avancée combine détection à portée extrême, priorisation des menaces en temps réel et réduction avancée du bruit, représentant le pinacle de la détection sous-marine et de la lutte anti-sous-marine.\n\n§GIndice du concepteur : le sonar met l'accent sur la détection de sous-marins tout en améliorant aussi la détection de surface, les missiles antinavires et l'attaque de torpille. Choix économique pour les navires ASM, mais offre un soutien de combat moins large que le radar.§!"
