 ukraine_varyag.11.desc: "§Y[UKR.GetNameWithFlag]§!§W이(가) 우리의 조건을 §!§R거절했습니다§!§W. 통과 분쟁이 계속되는 동안 미완성 항공모함은 §!§Y흑해§!§W에 머물러 있습니다.§!"
