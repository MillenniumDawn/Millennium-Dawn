 SIN_infantry_weapons_4_desc: "ST Kinetics가 자체 설계 및 생산한 최초의 성공적인 국산 돌격소총인 SAR 21은 21세기 싱가포르군(SAF)의 요구에 부응하는 현대적인 솔루션입니다. 슈타이어 AUG와 외형은 유사하지만, 그 작동 방식은 SAF의 필요에 맞게 개량된 AR-15 모델을 기반으로 합니다. 구형 M16S1을 대체한 SAR 21은 현재 SAF의 모든 병사, 예비군 및 병력의 주력 무기로 사용되고 있습니다."
 SIN_infantry_weapons_5: "SAR 21 MMS"
 SIN_infantry_weapons_5_desc: "2000년대 초 국방부는 기술적으로 첨단화된 전투력을 위한 새로운 틀을 발표하고 싱가포르군(SAF)을 3세대 군대로 전환하는 구상을 시작했습니다. SAR 21 MMS는 첨단 전투원 체계에 속하는 SAR 21의 개량형입니다. 이 소총은 현대 전장에서 모든 장병이 필요로 하는 상황 인식을 제공하기 위해 2005년에 도입되었으며, SAF의 3G 전투력 전환의 일환으로 HUD 디스플레이, 전술 데이터링크, 첨단 통신망과 완전히 통합되어 있습니다."
 SIN_infantry_weapons_6: "BR 18 BMCR"
 SIN_infantry_weapons_6_desc: "BMCR은 SAF의 미래 기술의 일환으로 2014년 싱가포르 에어쇼에서 처음 공개되었습니다. 곧 SAR 21을 대체할 BR-18 돌격소총이 되었고, 2018년에 신속히 생산에 들어갔습니다."
 SIN_util_vehicle_6: "벨렉스 PCSV"
 SIN_util_vehicle_6_short: "벨렉스"
 SIN_util_vehicle_6_desc: "벨렉스 PCSV는 SAF가 육군을 3세대 전투력으로 전환하려는 구상의 일환으로 2016년에 공개되었습니다. 남아프리카의 마라우더 MRAP에서 유래한 벨렉스는 유사한 역할을 수행하도록 설계되었으나, 다양한 임무와 요구에 맞게 개조할 수 있는 유연성을 갖추고 있습니다. 벨렉스는 SAF의 5톤 트럭과 장갑차를 대체할 예정이었습니다."
