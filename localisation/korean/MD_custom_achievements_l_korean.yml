 armenian_empire_redo_NAME: "아르메니아 제국"
 armenian_empire_redo_DESC: "아르메니아가 마침내 고대 전성기의 국경을 회복했습니다. 티그라네스 제왕도 이를 자랑스러워했을 것입니다."
 armenian_reverse_pashinyan_NAME: "파시냔 우노 리버스!"
 armenian_reverse_pashinyan_DESC: "실제 파시냔과 달리, 당신의 파시냔은 아르차흐를 아르메니아에 통합하고 그의 애국심을 지켰습니다."
 armenian_zsfsr_unification_NAME: "데미르치얀의 몽상"
