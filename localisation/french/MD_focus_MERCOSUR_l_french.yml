 mercosur.18.t: "Pourparlers d'adhésion à part entière ouverts"
 mercosur.18.d: "Des négociations formelles se sont ouvertes avec [PRU.GetName] sur l'adhésion pleine au MERCOSUR. Ce n'est pas un geste symbolique : si les pourparlers réussissent, le bloc gagnera un autre gouvernement prêt à ancrer son avenir dans un cadre sud-américain partagé."
