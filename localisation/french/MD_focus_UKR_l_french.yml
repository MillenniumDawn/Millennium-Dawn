 ukraine_develop_btr4.8.name: "Programme de test pour le 'BTR-4' APC"
 ukraine_develop_btr4.8.desc: "Nous pouvons choisir la durée et la complexité des tests de pré-production pour le BTR-4 APC.\n\nNous pouvons opter pour un programme de base afin d'économiser du temps et de l'argent, ou un programme étendu nécessitant plus de ressources, mais permettant d'éliminer les défauts visibles lors de la production en petite série. Les éliminer garantira une machine plus fiable lors de la production à grande échelle."
 ukraine_develop_btr4.8.a: "Tests de base"
 ukraine_develop_btr4.8.b: "Tests étendus"
 ukraine_develop_btr4.9.name: "Programme de test pour le 'BTR-4' APC"
 ukraine_develop_btr4.9.desc: "Nous pouvons choisir la durée et la complexité des tests de pré-production pour le BTR-4 APC.\n\nNous pouvons opter pour un programme de base afin d'économiser du temps et de l'argent, ou un programme étendu nécessitant plus de ressources, mais permettant d'éliminer les défauts visibles lors de la production en petite série. Les éliminer garantira une machine plus fiable lors de la production à grande échelle."
