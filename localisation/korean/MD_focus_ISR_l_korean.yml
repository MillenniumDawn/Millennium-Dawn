 ISR_bothusandisr: "[USA.GetName]과(와) [ISR.GetName]이(가) 다음을 얻습니다:"
 ISR_gainacess: "§Y서로에 대한 군사 및 해군 접근권을 얻습니다!§!"
 reza_vist_isr: "§Y레자 팔라비§!가 §4이스라엘§!을 성공적으로 방문했습니다"
 rajavi_vist_isr: "§Y마리암 라자비§!가 §4이스라엘§!을 성공적으로 방문했습니다"
 eff_of_foc: "이 중점의 효과는 변수에 따라 달라질 수 있습니다!"
 add_spendmos_one_tt: "§Y추가 지출§!이 §R$-0.215§! 감소합니다"
 add_spendmos_two_tt: "§Y추가 지출§!이 §R$-0.415§! 감소합니다"
 add_spendmos_three_tt: "§Y추가 지출§!이 §R$-0.615§! 감소합니다"
 sell_500_dron: "§Y1세대 드론 25기와 장비를 그들에게 판매합니다.§!"
 ISR_mossad_military_advisors: "이스라엘 군사 전문가"
 ISR_mossad_military_advisors_desc: "이스라엘 군사 전문가들이 이 나라의 군대에 적극적으로 지원과 훈련을 제공하고 있습니다."
 israel_economy.78.t: "지원을 제안하는 이스라엘!"
 israel_economy.78.d: "이스라엘은 중동에서 이란의 영향력에 대항하기 위해 우리 발전하는 국가에 대규모 지원을 제공하고자 합니다. 이는 우리에 대한 이들의 영향력을 높이고 우리도 자금을 지출해야 할 수 있으나, 거래 조건은 매우 유망합니다..."
 israel_economy.78.a: "물론 동의한다!"
 israel_economy.78.b: "우리는 당신들의 계획의 일부가 되지 않겠다!"
 israel_economy.79.t: "쿠르디스탄의 동의!"
 israel_economy.79.d: "쿠르디스탄이 우리의 지원을 받기로 동의했으며 앞으로 우리와 협력할 의지를 보였습니다."
 israel_economy.79.a: "훌륭해!"
 israel_economy.80.t: "동의하지 않은 쿠르디스탄!"
 israel_economy.80.d: "쿠르디스탄이 우리의 지원을 받아들이지 않았습니다. 그들은 우리가 자신들을 음모의 도구로 이용하는 방식을 버려야 한다고 말합니다."
 israel_economy.80.a: "제정신인가?"
 israel_news.11.t: "이란 인터내셔널의 부상"
 israel_news.11.d: "이스라엘 정부 관계자들은 이란 반체제 인사들과 협력하여 아야톨라 정권에 단호히 맞서는 입장을 취하는 24시간 페르시아어 텔레비전 채널 겸 디지털 뉴스 사업인 이란 인터내셔널의 출범을 선언했습니다. 이란 내 비판자들은 이 회사가 이스라엘의 선전을 퍼뜨릴 뿐이라고 비난했으며, 발표 며칠 만에 국내 방송을 금지하려는 신속한 제안이 나왔습니다."
 israel_news.11.o1: "또 시온주의자들의 헛소리다!"
 israel_news.11.o2: "미디어 지형이 바뀐다."
 israel_economy.81.t: "이스라엘을 방문한 레자 팔레비!"
 israel_economy.81.d: "이란의 망명 왕자 레자 팔라비가 이란과의 긴장이 고조되는 가운데 이란 국민의 우정의 메시지를 전하기 위해 이스라엘을 방문했습니다. 이스라엘과 이란은 군주제 시절 우호적인 관계를 유지했으며, 그때에는 수만 명의 이란계 유대인이 오랜 세월 평화와 조화 속에서 살았습니다. 대다수는 반이스라엘 혁명 세력이 군주제를 무너뜨리고 자신들이 바람직하지 않다고 여긴 이들에 대한 공포 정치를 시작한 1979년경 이란을 떠났습니다. 이스라엘과 해외 디아스포라의 많은 유대인들은 페르시아 왕 키루스 대왕이 메소포타미아에서 포로로 잡혀 있던 유대인들을 해방하고 예루살렘으로 돌아가도록 도왔던 2,500년 전으로 거슬러 올라가는 이란 국민과의 역사적 우정을 봅니다. 성직자 정권에 반대하는 대부분의 이란인들 역시 이스라엘에 대해 우호적이고 지지하는 태도를 표하며, 자국 정부가 역내 반이스라엘 세력을 재정적·군사적으로 후원하는 것을 국부의 낭비로 봅니다."
 israel_economy.81.a: "반갑습니다, 친구여!"
 israel_economy.82.t: "이스라엘을 방문한 마리암 라자비!"
 israel_economy.82.d: "이란 인민무자헤딘의 저명한 지도자 마리암 라자비가 이란 정권에 대항하는 연합을 강화하기 위한 획기적인 방문을 위해 오늘 이스라엘에 도착했습니다. 라자비의 방문은 역내에서 이란의 영향력에 맞서는 데 MEK와 이스라엘이 공통의 이해관계를 갖고 있음을 보여주는, 중동 지정학 역학의 중대한 진전을 의미합니다. 방문 기간 중 라자비는 총리와 대통령을 비롯한 이스라엘 고위 인사들을 만났습니다. 논의는 이란의 핵 야망, 중동 전역의 대리 민병대에 대한 지원, 이란 내 인권 침해에 대한 상호 우려에 집중되었습니다. "
 israel_economy.82.a: "환영합니다!"
 ISR_government_company_hacked: "이란 네트워크 해킹"
 israel_economy.83.t: "이란 정부 네트워크를 해킹한 이스라엘!"
 israel_economy.83.d: "최근 이스라엘 해커들이 이란 정부 네트워크를 성공적으로 해킹하여 서버에서 이란의 데이터를 빼돌렸습니다."
 israel_economy.83.a: "빌어먹을 시온주의자들!"
 israel_economy.83.b: "훌륭한 솜씨다!"
 israel_economy.84.t: "이란에서 일어난 시위!"
 israel_economy.84.d: "최근 이란 이슬람 공화국의 여러 지역에서 정부에 반대하는 시위가 일어났습니다. 이란의 많은 관리들은 이 시위가 이란 정부를 전복하려는 외세에 의해 촉발되었다고 주장합니다..."
 israel_economy.84.a: "시온주의자들의 소행이다!"
 ISR_drone_better_operations: "고급 드론 작전"
 israel_news.12.t: "미국과 이스라엘, 이란의 핵 위협 저지를 위해 합동 공습 개시"
 israel_news.12.d: "[USA.GetLeader] 대통령은 전국에 연설하며, 선전포고 결정은 가볍게 내려진 것이 아니라 이란의 핵 야망이 초래하는 임박한 위협 때문에 불가피했다고 밝혔다. \n - 우리 정보기관은 이란이 핵무기 확보에 위험할 정도로 근접했음을 확인했다 - [USA.GetLeader] 대통령은 말했다. \n - 이는 세계 안보와 안정에 대한 용납할 수 없는 위협이다. 동맹국 이스라엘과 협력하여, 우리는 이 위협을 무력화하기 위해 단호한 군사 행동을 취하는 것 외에 선택지가 없다. \n 이번 선언은 수주간 고조된 긴장과 이란의 핵 프로그램을 억제하려던 외교적 노력의 실패 끝에 나왔다. 이번 합동 군사 작전은 이란의 핵 시설과 군사 기반시설을 표적으로 삼아 핵 능력의 추가 발전을 막는 것을 목표로 한다."
 israel_news.12.o1: "Hannibal ad portas?"
 israel_economy.85.t: "이란에 대한 군사 작전을 제안하는 이스라엘!"
 israel_economy.85.d: "이란 핵 프로그램에 관한 최근 자료와 정보기관이 입수한 이란의 계획을 토대로, 이스라엘은 이란에 대한 즉각적인 군사적 대응을 제안합니다!"
 israel_economy.85.a: "민주주의를 전파할 때다!"
 israel_economy.85.b: "그럴듯한 동화로군."
 israel_economy.86.t: "미국의 수락!"
 israel_economy.86.d: "작전이 시작되었으며, 미군이 곧 전개될 것입니다!"
 israel_economy.86.a: "출격하자!"
 israel_economy.87.t: "우리 제안을 거절한 미국"
 israel_economy.87.d: "그들은 이 작전에 동참하지 않을 것입니다."
 israel_economy.87.a: "어찌 되든 상관없어!"
 israel_economy.88.t: "관계 회복을 제안하는 이스라엘!"
 israel_economy.88.d: "최근 오만에서 열린 상호 협상 중 이스라엘 정부가 양국 간 새로운 평화 조약을 제안했습니다. 그들은 서로에 대한 적대감을 버리고 불가침 조약에 서명해야 한다고 말합니다."
 israel_economy.88.a: "그래, 좋다..."
 israel_economy.88.b: "또 시온주의자들의 음모인가?!"
 israel_economy.89.t: "이란의 동의!"
 israel_economy.89.d: "불가침 조약이 체결되었습니다."
 israel_economy.89.a: "훌륭해!"
 israel_news.13.t: "이스라엘과 이란, 불가침 조약 체결!"
 israel_news.13.d: "획기적인 진전으로, 이란과 이스라엘이 일련의 불가침 및 평화 조약에 서명하며 중동 외교사에 중요한 이정표를 세웠다. 국제 중재자들의 도움으로 성사된 이번 합의는 수요일 제네바에서 서명되었으며, 역내 협력과 안정의 새 시대를 알리는 신호로 받아들여지고 있다.\n\n이번 역사적 합의에는 포괄적인 불가침 조약, 상호 주권 인정, 경제 및 문화 협력의 틀이 포함되어 있다. 서명식에는 양국의 고위 관리와 함께 국제연합, 유럽 연합 및 기타 주요 국제 이해관계자들의 대표가 참석했다."
 israel_news.13.o1: "현상 유지에 대한 희망?"
 israel_economy.90.t: "동의하지 않은 이란!"
 israel_economy.90.d: "그들은 평화 조약 체결에 동의하지 않았습니다."
 israel_economy.90.a: "대체 무엇을 기대했단 말인가?!"
 israel_economy.91.t: "드론 공격을 제안하는 이스라엘!"
 israel_economy.91.d: "이스라엘이 이란의 장군 거셈 솔레이마니를 제거하기 위한 공동 작전을 제안합니다. 그들은 이 작전 수행에 우리의 지원을 원합니다. 동의하시겠습니까?"
 israel_economy.91.a: "우리가 함께한다!"
 israel_economy.91.b: "알아서 하십시오."
 israel_economy.92.t: "우리나라를 지원할 미국"
 israel_economy.92.d: "준비를 시작할 수 있습니다."
 israel_economy.92.a: "훌륭해!"
 israel_economy.93.t: "우리나라를 지원하지 않을 미국!"
 israel_economy.93.d: "그들은 우리의 작전에 동참하지 않을 것입니다."
 israel_economy.93.a: "매우 유감이다."
 israel_economy.94.t: "지원을 제안하는 이스라엘!"
 israel_economy.94.d: "이스라엘은 중동에서 급진 이슬람 세력의 영향력에 대항하기 위해 어려움을 겪고 있는 우리나라에 대규모 지원을 제공하고자 합니다. 이는 우리에 대한 이들의 영향력을 높이고 우리도 자금을 지출해야 할 수 있으나, 거래 조건은 매우 유망합니다..."
 israel_economy.94.a: "물론 동의한다!"
 israel_economy.94.b: "우리는 당신들의 계획의 일부가 되지 않겠다!"
 israel_economy.95.t: "이란의 동의!"
 israel_economy.95.d: "이란이 우리의 지원을 받기로 동의했으며 앞으로 우리와 협력할 의지를 보였습니다."
 israel_economy.95.a: "훌륭해!"
 israel_economy.96.t: "동의하지 않은 이란!"
 israel_economy.96.d: "이란이 우리의 지원을 받아들이지 않았습니다. 그들은 우리가 자신들을 음모의 도구로 이용하는 방식을 버려야 한다고 말합니다."
 israel_economy.96.a: "제정신인가?"
 ISR_iran_def_idea: "반이란 결집"
 israel_economy.97.t: "키루스 협정을 제안하는 이스라엘!"
 israel_economy.97.d: "이스라엘 정부가 방위 및 정치 문제와 관련하여 이스라엘과 이란 간의 우호 협정을 제안합니다. 동의하시겠습니까?"
 israel_economy.97.a: "물론입니다!"
 israel_economy.97.b: "죄송하지만 거절합니다."
 israel_economy.98.t: "이란의 동의!"
 israel_economy.98.d: "이란이 우리의 조약에 동의했습니다!"
 israel_economy.98.a: "훌륭해!"
 israel_economy.99.t: "동의하지 않은 이란!"
 israel_economy.99.d: "그들은 키루스 협정 체결에 동의하지 않았습니다."
 israel_economy.99.a: "매우 유감이다."
 ISR_iran_wat_idea: "이스라엘 농업 지원"
 israel_economy.100.t: "농업 지원을 제안하는 이스라엘!"
 israel_economy.100.d: "이스라엘 정부가 우리에게 관개 및 농업 지속 가능성 분야의 지원을 제안합니다. 동의하시겠습니까?"
 israel_economy.100.a: "물론입니다!"
 israel_economy.100.b: "죄송하지만 거절합니다."
 israel_economy.101.t: "이란의 동의!"
 israel_economy.101.d: "그들이 우리의 제안에 동의했습니다!"
 israel_economy.101.a: "훌륭합니다!"
 israel_economy.102.t: "동의하지 않은 이란!"
 israel_economy.102.d: "이란이 우리의 제안에 동의하지 않았습니다."
 israel_economy.102.a: "흠."
 ISR_isr_iran_oil: "에일라트-아슈켈론 송유관 회사"
 israel_economy.103.t: "에일라트-아슈켈론 송유관 회사의 재개를 제안하는 이스라엘!"
 israel_economy.103.d: "수년 전 이란 이슬람 혁명 이전에 이스라엘과 이란은 당시 양측 모두에게 이익을 안겨준 합작 석유 회사를 운영했습니다. 이제 폭압적인 아야톨라 정권이 이란에서 사라졌으니, 이스라엘 정부는 이 회사의 재개를 제안합니다. 동의하시겠습니까?"
 israel_economy.103.a: "어디에 서명하면 됩니까?"
 israel_economy.103.b: "아니."
 israel_economy.104.t: "이란의 동의!"
 israel_economy.104.d: "회사가 설립되었습니다!"
 israel_economy.104.a: "훌륭해!"
 israel_economy.105.t: "동의하지 않은 이란!"
 israel_economy.105.d: "그들은 회사를 재개하기를 원하지 않습니다."
 israel_economy.105.a: "매우 유감이다."
 israel_economy.106.t: "우리에게 선물을 보낸 이스라엘!"
 israel_economy.106.d: "최근 이스라엘 관리들은 선의와 호의의 표시로 이란 다마사슴 몇 마리를 우리에게 선물하기로 했습니다. 과거 이란의 샤가 우호의 표시로 이스라엘에 선물한 것이었습니다. 그러나 이후 이란 자국에서는 이 사슴들이 멸종했고, 이스라엘에 선물되었던 개체들만 살아남았습니다. 이제 그들이 우리에게 그 호의를 돌려주는 것입니다!"
 israel_economy.106.a: "감사합니다!"
 israel_economy.107.t: "공동 미사일 프로그램을 제안하는 이스라엘!"
 israel_economy.107.d: "이스라엘이 미사일 및 방어 체계 연구를 위한 공동 노력을 제안합니다. 동의하시겠습니까?"
 israel_economy.107.a: "물론입니다!"
 israel_economy.107.b: "아니오, 괜찮습니다."
 israel_economy.108.t: "이란의 동의!"
 israel_economy.108.d: "이란이 우리의 공동 연구에 투자하기로 동의했으니, 이제 우리도 투자해야 합니다."
 israel_economy.108.a: "훌륭해!"
 israel_economy.109.t: "동의하지 않은 이란!"
 israel_economy.109.d: "이란이 우리 프로젝트에 참여하기로 동의하지 않았습니다."
 israel_economy.109.a: "허참."
 ISR_isr_iran_int: "이란-이스라엘 정보 네트워크"
 ISR_isr_iran_int_2: "이란-이스라엘 정찰 센터"
 israel_economy.110.t: "정보 공유를 제안하는 이스라엘!"
 israel_economy.110.d: "이스라엘 정부가 정보 공유와 첩보 활동 조율을 위한 공동 노력을 제안합니다. 동의하시겠습니까?"
 israel_economy.110.a: "물론입니다!"
 israel_economy.110.b: "죄송하지만 거절합니다."
 israel_economy.111.t: "이란의 동의!"
 israel_economy.111.d: "이란이 우리의 제안에 동의했으며 우리는 계속 협력할 것입니다."
 israel_economy.111.a: "훌륭해!"
 israel_economy.112.t: "동의하지 않은 이란!"
 israel_economy.112.d: "그들은 정보 공유 분야에서 협력하기를 원하지 않습니다."
 israel_economy.112.a: "허참."
 israel_economy.113.t: "정찰 센터 설립을 제안한 이스라엘!"
 israel_economy.113.d: "이스라엘 정부가 정찰 및 조율을 위한 이란-이스라엘 센터의 설립을 제안합니다. 동의하시겠습니까?"
 israel_economy.113.a: "물론입니다!"
 israel_economy.113.b: "죄송하지만 거절합니다."
 israel_economy.114.t: "이란의 동의!"
 israel_economy.114.d: "이란이 우리의 제안에 동의했으며 우리는 계속 협력할 것입니다."
 israel_economy.114.a: "훌륭해!"
 israel_economy.115.t: "동의하지 않은 이란!"
 israel_economy.115.d: "그들은 협력하기를 원하지 않습니다."
 israel_economy.115.a: "허참."
 israel_economy.116.t: "배상을 요구하는 이스라엘!"
 israel_economy.116.d: "최근 이스라엘 정부가 우리에게 수사 조약의 서명을 요청했습니다. 이는 20세기 혁명 당시 이란을 떠난 이란계 이스라엘인들에 대해 우리가 이스라엘에 보상금을 지급하도록 하는 조약입니다. 동의하시겠습니까?"
 israel_economy.116.a: "그것이 우리의 의무다!"
 israel_economy.116.b: "이건 너무 과하다..."
 israel_economy.117.t: "이란의 동의!"
 israel_economy.117.d: "이란이 배상금 지급에 동의했습니다!"
 israel_economy.117.a: "훌륭해!"
 israel_economy.118.t: "동의하지 않은 이란!"
 israel_economy.118.d: "그들은 자국 정부가 저지르지 않은 일에 대해 어떠한 배상도 하지 않을 것입니다."
 israel_economy.118.a: "윽."
 israel_economy.119.t: "타바 회담"
 israel_economy.119.d: "이스라엘은 이집트가 팔레스타인에 대한 적극적인 지원을 중단하고 이스라엘과 이집트 간에 비밀 불가침 조약을 체결하는 상호 안보 및 관계 정상화의 새로운 틀을 제안했습니다."
 israel_economy.119.a: "좋습니다."
 israel_economy.119.b: "아니."
 israel_economy.120.t: "이집트의 동의"
 israel_economy.120.d: "이집트가 역내 상황에 대처하기 위한 우리의 계획을 받아들였습니다. 이집트와 이스라엘 간의 비밀 불가침 조약도 함께 체결되었습니다."
 israel_economy.120.a: "훌륭해!"
 israel_economy.121.t: "우리 제안을 거절한 이집트"
 israel_economy.121.d: "이집트가 우리 지역의 상황에 대처하기 위한 우리의 계획을 받아들이기를 거부했습니다. "
 israel_economy.121.a: "안타깝다."
 israel_economy.122.t: "억류된 요원의 송환을 요청하는 이스라엘"
 israel_economy.122.d: "이스라엘이 선의의 표시로 억류된 자국 요원의 인도를 요청하고 있습니다."
 israel_economy.122.a: "알겠다."
 israel_economy.122.b: "아니."
 israel_economy.123.t: "이집트의 동의"
 israel_economy.123.d: "오랜 협상 끝에 이집트 정부가 억류된 우리 요원을 우리에게 인도하기로 동의했습니다."
 israel_economy.123.a: "훌륭해!"
 israel_economy.124.t: "우리 요원의 인도를 거부한 이집트"
 israel_economy.124.d: "이집트 정부가 우리 요원의 인도를 거부했습니다. 그는 이집트 교도소에 계속 구금되어 있습니다."
 israel_economy.124.a: "안타깝다."
 ISR_kill_scientist_idea: "핵과학자 암살!"
 nuclear_scientist_unlock: "과학자 암살 결정 잠금 해제"
 ISR_REV_IRQ_TT: "§Y이라크 정부를 전복하기 위해 이라크에서 혁명을 일으킵니다§!"
 ISR_REV_SYR_TT: "§Y시리아 정부를 전복하기 위해 시리아에서 혁명을 일으킵니다§!"
 ISR_REV_JOR_TT: "§Y요르단 정부를 전복하기 위해 요르단에서 혁명을 일으킵니다§!"
 israel_economy.125.t: "CENTO 가입을 원하는 이스라엘!"
 israel_economy.125.d: "최근 이스라엘이 CENTO 가입 의사를 표명했습니다. 동의하시겠습니까?"
 israel_economy.125.a: "물론입니다!"
 israel_economy.125.b: "죄송하지만 거절합니다."
 israel_economy.126.t: "이란의 동의!"
 israel_economy.126.d: "모든 서류에 서명이 완료되었습니다."
 israel_economy.126.a: "훌륭해!"
 israel_economy.127.t: "동의하지 않은 이란!"
 israel_economy.127.d: "이란이 우리의 세력 가입에 동의하지 않았습니다."
 israel_economy.127.a: "허참."
 periphery_pactt: "주변부 조약"
 ISR_trade_agr_seks: "§O자유 무역 협정을 활성화합니다.§!"
 israel_economy.128.t: "관계 회복을 제안하는 이스라엘!"
 israel_economy.128.d: "중동에서의 공동의 적을 고려하여, 이스라엘은 적에 대항하는 새로운 협력 계획의 시작을 제안하며 이는 잠재적으로 여러 분야로 확대될 수 있습니다. 동의하시겠습니까?"
 israel_economy.128.a: "동의한다. 아무도 이 일을 알지 못하게 하라."
 israel_economy.128.b: "우리는 결코 우리의 대의를 저버리지 않겠다!"
 israel_economy.129.t: "사우디아라비아의 동의!"
 israel_economy.129.d: "사우디아라비아가 공동의 적에 맞서 우리와 협력하고 향후 다양한 공동 프로젝트를 지원하기로 동의했습니다."
 israel_economy.129.a: "매우 좋군..."
 israel_economy.130.t: "우리 제안을 거절한 사우디아라비아!"
 israel_economy.130.d: "그들은 우리에게 저항하는 올바른 길에서 자신들을 벗어나게 할 수 없을 것이라고 말합니다."
 israel_economy.130.a: "그래, 그러시겠지."
 israel_economy.131.t: "과거의 행위에 대해 사과하는 이스라엘!"
 israel_economy.131.d: "이스라엘이 과거의 첩보 활동에 대해 사과하며 앞으로는 그러한 일을 하지 않겠다고 약속합니다. 그들은 우리의 용서와 협력 의지에 대한 선물을 제안하고 있습니다..."
 israel_economy.131.a: "용서하겠다."
 israel_economy.131.b: "뻔뻔하기 짝이 없군!"
 israel_economy.132.t: "[From.GetName]의 수락"
 israel_economy.132.d: "우리의 사과가 받아들여졌으며 과거의 행위는 용서되었습니다."
 israel_economy.132.a: "훌륭해!"
 israel_economy.133.t: "[From.GetName]의 거절"
 israel_economy.133.d: "그들은 우리의 행동을 이기적인 팽창주의적 야욕에서 비롯된 뻔뻔하고 비도덕적인 행위로 간주했습니다."
 israel_economy.133.a: "그래, 그러시겠지."
 easten_andinf_tt: "§Y긴장§!을 §G완화§!하고 §Y그들§!에 대한 §O영향력 2%§!를 얻습니다."
 israel_economy.134.t: "오만을 방문한 이스라엘 총리!"
 israel_economy.134.d: "오늘 [ISR.GetLeader] 총리는 비밀리에 오만에 착륙하여, 모사드 국장 요시 코헨과 국가안보보좌관 메이르 벤샤바트와 함께 남부 도시 살랄라의 알후슨 궁전으로 이동해 술탄 [OMA.GetLeader]을(를) 만났다. 술탄은 총리와 함께 궁전을 둘러보며 술탄국의 많은 오래된 유물과 지도를 보여주었다. 그곳에서 두 사람은 중동 평화 프로세스를 진전시킬 방안과 중동의 평화와 안정을 이루기 위한 여러 공통 관심사를 논의했다. 이는 1996년 시몬 페레스가 이 아랍 국가를 방문한 이후 오만 술탄과 이스라엘 총리의 첫 만남으로, 오만은 이스라엘을 한 번도 승인한 적이 없음에도 이스라엘과 긴밀한 외교 관계를 유지해 왔다. 두 사람은 또한 여러 무역 협정과 마스카트에 이스라엘 비공식 무역 사무소를 설치하는 데 합의했다. 이스라엘 총리 [ISR.GetLeader]이(가) 우리나라를 방문하여 외교 및 군사 분야의 새로운 협력 협정을 제안했습니다. 그들의 제안에 동의하시겠습니까?"
 israel_economy.134.a: "물론입니다!"
 israel_economy.134.b: "죄송하지만 거절합니다."
 israel_economy.135.t: "오만의 동의!"
 israel_economy.135.d: "[ISR.GetLeader]의 오만 방문 이후, 오만은 외교 및 군사 분야에서 우리나라와 협력하기로 동의했습니다."
 israel_economy.135.a: "훌륭해!"
 israel_economy.136.t: "오만의 거절!"
 israel_economy.136.d: "그들은 우리나라와 협력하기를 원하지 않습니다."
 israel_economy.136.a: "왜?! 이런 모욕이!"
 ISR_gulf_mossad_protecc: "모사드의 보호"
 ISR_gulf_mossad_protecc_desc: "이란의 위협이 커지는 점을 감안하여, 우리나라는 이란의 영향력을 억제하기 위해 이스라엘 모사드 요원들을 수용하기로 동의했습니다."
 canc_if_isrwar_tt: "[ISR.GetNameWithFlag]과(와) §Y전쟁§! 중이면 이 §Y국가 정신§!은 §R취소§!됩니다"
 israel_economy.137.t: "비밀 동반자 관계를 제안하는 이스라엘"
 israel_economy.137.d: "최근 이스라엘이 우리에게 비밀 메시지를 보내 이란의 위협에 대한 훌륭한 보호를 제안했습니다. 그들은 이란의 영향력에 완전히 대응할 수 있도록 자국의 모사드 요원들을 우리나라에 수용해 줄 것을 제안합니다."
 israel_economy.137.a: "물론이다!"
 israel_economy.137.b: "음? 아니다."
 israel_economy.138.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.138.d: "[FROM.GetNameWithFlag]이(가) 자국에서 우리 요원들을 보호하는 데 동의했습니다."
 israel_economy.138.a: "훌륭합니다!"
 israel_economy.139.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.139.d: "[FROM.GetNameWithFlag]이(가) 우리의 제안을 자국 주권에 대한 음모로 간주하고 거절했습니다."
 israel_economy.139.a: "아, 제발!"
 wewillspendtwenty_tt: "거래 한 건당 §Y10$ 십억!§!을 지출합니다"
 theywillget_tt: "그들은 §Y국가 정신§!을 얻습니다"
 israel_economy.140.t: "두바이 박람회 참가를 원하는 이스라엘!"
 israel_economy.140.d: "이스라엘이 우리와 무역 조약을 체결하고 두바이의 엑스포와 박람회에 참가하기를 원합니다. 그들은 우리에게 참가를 승인해 달라고 요청합니다. 동의하시겠습니까?"
 israel_economy.140.a: "물론입니다!"
 israel_economy.140.b: "죄송하지만 거절합니다."
 israel_economy.141.t: "아랍에미리트의 동의!"
 israel_economy.141.d: "아랍에미리트가 우리의 두바이 엑스포 및 박람회 참가에 동의했습니다. 또한 양국 관계에 긍정적인 영향을 미칠 무역 조약도 체결했습니다."
 israel_economy.141.a: "훌륭해!"
 israel_economy.142.t: "아랍에미리트의 거절!"
 israel_economy.142.d: "그들은 자국의 엑스포와 박람회에서 우리를 보고 싶어 하지 않습니다."
 israel_economy.142.a: "허참."
 moss_diplo_tt: "§Y모사드§!는 §Y우리의 정보 파트너들§!에 대한 §6우리의 영향력§!을 §0은밀히 확대§!할 수 있게 됩니다!"
 israel_economy.143.t: "바레인 경제 포럼"
 israel_economy.143.d: "이스라엘이 긴장을 완화하고 팔레스타인에 경제적 숨통을 틔워 주기 위해 우리가 팔레스타인에 기반시설 투자를 해 줄 것을 요청하는 거래를 제안합니다. 어떻게 하시겠습니까?"
 israel_economy.143.a: "좋다, 동의한다!"
 israel_economy.143.b: "또 유대인의 음모인가?"
 reduc_pal_tens_aut_tt: "§Y팔레스타인§!의 §3자치도§!가 §R감소§!하지만 §G긴장이 완화됩니다!§!"
 gulf_invested_thing: "이스라엘-걸프 투자 계획"
 israel_economy.144.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.144.d: "[FROM.GetNameWithFlag]이(가) 팔레스타인의 자치도를 줄이고 긴장을 완화하기 위해 팔레스타인에 투자하기로 동의했습니다."
 israel_economy.144.a: "훌륭해!"
 israel_economy.145.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.145.d: "[FROM.GetNameWithFlag]이(가) 팔레스타인 대의에 대한 지지를 이유로 우리의 제안을 거절했습니다."
 israel_economy.145.a: "어찌 되든 상관없어."
 israel_economy.146.t: "이스라엘을 대신하여 우리나라에 투자하는 [FROM.GetNameWithFlag]!"
 israel_economy.146.d: "이스라엘의 초청으로, 그들은 긴장을 완화하기 위해 우리나라에 기반시설 투자를 하기로 결정했습니다."
 israel_economy.146.a: "좋은 일이겠지?"
 ISR_visa_free_moroc: "이스라엘-모로코 비자 협정"
 israel_economy.147.t: "비자 협정을 제안하는 이스라엘!"
 israel_economy.147.d: "이스라엘 정부가 이스라엘 시민이 제3국을 경유하여 모로코를 간접 방문하는 것에 관한 새로운 협정을 제안합니다. 동의하시겠습니까?"
 israel_economy.147.a: "물론입니다!"
 israel_economy.147.b: "아니."
 israel_economy.148.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.148.d: "그들이 우리의 제안에 동의했으며, 이제 우리 시민들은 모로코를 방문할 수 있습니다."
 israel_economy.148.a: "훌륭해!"
 israel_economy.149.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.149.d: "그들은 우리의 제안에 동의하지 않았습니다."
 israel_economy.149.a: "매우 유감이다."
 israel_economy.150.t: "모로코에 대한 공동 지원을 제안하는 이스라엘!"
 israel_economy.150.d: "이스라엘이 폴리사리오 운동과의 분쟁에서 모로코를 지지해 줄 것을 요청합니다. 그들은 양국이 공동 성명을 발표하고 모로코의 합법 정부를 지지하기를 원합니다. 동의하시겠습니까?"
 israel_economy.150.a: "좋다! 외교관을 보내라!"
 israel_economy.150.b: "그들이 스스로 해결해야 한다."
 israel_economy.151.t: "모로코 정부를 지지하는 미국과 이스라엘!"
 israel_economy.151.d: "최근 미국과 이스라엘이 모로코 정부를 지지하고 분리주의 운동인 폴리사리오를 규탄하는 공동 성명을 발표했습니다."
 israel_economy.151.a: "훌륭해!"
 israel_economy.152.t: "모로코 정부를 지지하는 이스라엘!"
 israel_economy.152.d: "최근 이스라엘이 모로코 정부를 지지하고 분리주의 운동인 폴리사리오를 규탄하는 성명을 발표했습니다!"
 israel_economy.152.a: "훌륭해!"
 israel_economy.153.t: "아브라함 협정을 제안하는 이스라엘!"
 israel_economy.153.d: "이스라엘과의 관계 정상화의 일환으로 이스라엘이 새로운 문서에 서명할 것을 제안합니다. 이 협정에는 이스라엘의 주권 인정과 완전한 외교 관계의 수립을 가능하게 하는 내용도 포함되어 있습니다. 서명하시겠습니까?"
 israel_economy.153.a: "물론입니다!"
 israel_economy.153.b: "아니!"
 israel_economy.154.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.154.d: "[FROM.GetNameWithFlag]이(가) 이스라엘의 주권을 인정하고 완전한 외교 관계 수립을 가능하게 하는 아브라함 협정에 서명하기로 동의했습니다!"
 israel_economy.154.a: "훌륭해!"
 israel_economy.155.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.155.d: "그들은 우리와의 관계 정상화와 아브라함 협정 서명을 원하지 않았습니다."
 israel_economy.155.a: "매우 유감이다."
 norm_rel_infl_tt: "우리와 서명국 사이의 §Y관계§!가 §G개선§!되고, 서로에 대한 §Y상호 영향력§!이 §G증가§!합니다."
 idea_israel_negev_forum: "네게브 포럼 동반자 관계"
 israel_economy.156.t: "우리를 네게브 포럼에 초청하는 이스라엘!"
 israel_economy.156.d: "워싱턴에서의 아브라함 협정 서명과 이스라엘 및 여러 아랍 이웃 국가 간 관계 정상화의 진전에 따라, 이스라엘 정책 입안자들은 이 평화가 장기적으로 이집트 및 요르단과의 평화처럼 냉랭해지는 것을 막고, 동시에 역내에서 자국의 미래를 지키고 경제적 기회를 창출하며 이란의 역내 영향력에 맞서기 위한 더 강력한 지역 연합을 구축하고자 합니다. 이에 따라 우리는 이스라엘 외무장관과 미국 국무장관으로부터 테러, 기후 변화, 경제적 고립, 역내 물 부족에 대응하고 아랍-이스라엘 협력을 강화하기 위한 정치 블록의 구성을 논의하는 네게브 사막 회의에 참석해 달라는 초청을 받았습니다. 이 회의에 참석하시겠습니까?"
 israel_economy.156.a: "[Root.GetAdjective] 외무장관이 참석할 것이다."
 israel_economy.157.t: "네게브 포럼에 가입한 [FROM.GetNameWithFlag]!"
 israel_economy.157.d: "[FROM.GetNameWithFlag]이(가) 네게브 포럼에 참여하기로 결정했습니다."
 israel_economy.157.a: "훌륭해!"
 israel_economy.158.t: "네게브 포럼을 보이콧한 [FROM.GetNameWithFlag]!"
 israel_economy.158.d: "그들은 참여하기를 원하지 않습니다."
 israel_economy.158.a: "허참."
 neg_for_tt: "그들은 §Y국가 정신§!을 얻고, 그들에 대한 우리의 §Y영향력§!이 §G증가§!하며 우리의 §Y무역 관계§!가 §G증가§!합니다."
 israel_economy.159.t: "협력 협정을 제안하는 이스라엘"
 israel_economy.159.d: "이스라엘이 양국 간에 새롭고 완전한 평화 조약을 체결하는 새로운 협정을 제안했습니다. 이 조약에는 군사 협력과 보장에 관한 내용도 포함되어 있습니다. 어떻게 하시겠습니까?"
 israel_economy.159.a: "동의한다!"
 israel_economy.159.b: "아니!"
 israel_economy.160.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.160.d: "[FROM.GetNameWithFlag]이(가) 우리의 제안에 동의하여 불가침 조약이 체결되었습니다!"
 israel_economy.160.a: "훌륭해!"
 israel_economy.161.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.161.d: "[FROM.GetNameWithFlag]이(가) 우리의 제안을 거절했습니다."
 israel_economy.161.a: "으음..."
 full_mil_tt: "§Y완전한 보장§!을 수립하고, §Y서명국§!에 대한 §G영향력§!을 얻으며, §3불가침 조약§!이 체결되고 §7군사 기지§!가 §Y설치§!됩니다."
 ideological_alliance: "이념 동맹"
 israel_observer_african_union: "아프리카 연합 옵서버 국가"
 israel_economy.162.t: "아프리카 연합 옵서버 국가가 되기를 원하는 이스라엘!"
 israel_economy.162.d: "사하라 이남 아프리카와 이스라엘의 관계는 1950년대와 1960년대에 번성했습니다. 그러나 욤 키푸르 전쟁에서 이스라엘군이 운하를 건너 아프리카 영토를 점령하게 되었습니다. 그 결과 말라위와 남아프리카의 아파르트헤이트 정권을 제외한, 우리를 포함한 사실상 대륙 전체가 이스라엘과의 관계를 단절했습니다. 이 관계는 오슬로 협정 이후 1990년대에 점차 회복되었으며, 이스라엘 정부의 많은 이들은 아프리카를 이스라엘이 국제적 이미지를 개선할 수 있는 대륙으로 봅니다. [ISR.GetLeader] 총리는 최근 이스라엘의 담수화 기술과 기타 혁신적인 스타트업을 활용해 아프리카 사람들의 삶을 개선하는 '아프리카로의 복귀' 캠페인을 시작했습니다. 이에 예루살렘은 팔레스타인 해방기구(PLO)와 마찬가지로 아프리카 연합에 옵서버 국가로 가입하게 해 달라고 우리에게 요청했습니다. 특히 동아프리카 공동체(EAC)를 비롯한 많은 나라가 이를 지지하겠지만, 알제리와 특히 남아프리카는 이 조치에 강력한 반대를 표명했습니다."
 israel_economy.162.a: "[ISR.GetLeader]은(는) 아프리카의 진정한 친구다."
 israel_economy.162.b: "아파르트헤이트 국가는 아프리카에서 할 일이 없다."
 israel_economy.163.t: "에티오피아의 동의!"
 israel_economy.163.d: "어제 아디스아바바에서 열린 아프리카 연합 개막식에서 주에티오피아 이스라엘 대사는 아프리카 연합 위원회 의장에게 아프리카 연합 옵서버 회원 자격에 관한 이스라엘의 신청서를 제출했다. 1990년대에 이스라엘은 아프리카 단결 기구의 옵서버 회원국이었으나, 이 기구가 해체되고 아프리카 연합으로 대체되었다. 그러나 대륙에서 가장 큰 두 나라인 남아프리카와 알제리의 압력으로 재가입에 실패했다. 하지만 이제는 아니다. 주로 보츠와나, 에티오피아, 동아프리카 공동체 회원국들이 이끄는 정치 블록이 아랍-남아프리카 블록을 압도하고 이번 가입을 관철시켰다. 이 외교적 성과는 외교부와 아프리카 부서, 그리고 대륙 내 이스라엘 대사관들의 끝없는 노력의 결과이다. 이는 거의 20년간 지속된 이례적 상황을 바로잡는 조치이며 이스라엘 대외 관계의 기반을 강화하는 중요한 부분이다."
 israel_economy.163.a: "훌륭해!"
 israel_economy.164.t: "우리의 지위를 거부한 에티오피아!"
 israel_economy.164.d: "오늘 아프리카 연합 위원회에서 이스라엘의 가입에 관한 표결이 진행되었고, 우리의 희망은 헛된 것으로 판명되었다. 보츠와나, 에티오피아, 동아프리카 공동체 회원국, 콩고 민주공화국의 강력한 지지에도 불구하고, 우리의 아프리카 연합 옵서버 국가 가입에 반대하는 목소리를 이기기에는 역부족이었다. 1990년대에 이스라엘은 아프리카 단결 기구의 옵서버 회원국이었으나, 이 기구가 해체되고 아프리카 연합으로 대체되었다. 그러나 아랍 국가들과 남아프리카의 압력으로 재가입에 실패했다. 증오에 이끌리고 이란과 카타르의 이해관계에 조종되는 알제리와 남아프리카 같은 소수의 극단주의 국가들에 의해 아프리카 연합이 인질로 잡힌 모습은 실로 안타깝다. 이스라엘은 아프리카 연합을 통해서든 비공식 경로를 통해서든, 그리고 표결 직후 우리 외교관들이 회의장에서 거칠게 쫓겨나는 모습을 지켜보는 것이 얼마나 굴욕적이었든 상관없이, 아프리카와의 유대를 계속 심화할 것이다."
 israel_economy.164.a: "알겠다..."
 israel_economy.165.t: "투자를 제안하는 이스라엘!"
 israel_economy.165.d: "이스라엘이 우리나라에 산업 단지 하나를 건설하여 우리 경제에 투자하기를 원합니다. 동의하시겠습니까?"
 israel_economy.165.a: "물론입니다!"
 israel_economy.165.b: "아니."
 israel_economy.166.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.166.d: "그들이 우리의 투자 제안을 수락했습니다!"
 israel_economy.166.a: "훌륭해!"
 israel_economy.167.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.167.d: "그들은 우리의 투자 제안에 동의하지 않았습니다."
 israel_economy.167.a: "알겠다."
 israel_economy.168.t: "나일강 분쟁에서 에티오피아를 지지하는 이스라엘!"
 israel_economy.168.d: "최근 협상 중 이스라엘 정부는 에티오피아와 이집트 간의 나일강 분쟁에서 에티오피아 정부를 전폭적으로 지지한다고 밝혔습니다."
 israel_economy.168.a: "흥미롭군."
 israel_economy.169.t: "나일강 분쟁에서 이집트를 지지하는 이스라엘!"
 israel_economy.169.d: "최근 협상 중 이스라엘 정부는 에티오피아와 이집트 간의 나일강 분쟁에서 이집트 정부를 전폭적으로 지지한다고 밝혔습니다."
 israel_economy.169.a: "흥미롭군."
 ISR_eth_jews_migr: "유대인 이민"
 ISR_eth_jews_migr_isr: "에티오피아계 유대인 이민"
 israel_economy.170.t: "에티오피아계 유대인의 송환을 요구하는 이스라엘"
 israel_economy.170.d: "이스라엘이 금전적 대가를 대가로 에티오피아계 유대인을 이스라엘로 송환할 것을 강경하게 요구합니다. 우리가 동의하지 않으면 더 공세적인 조치를 취하겠다고 합니다."
 israel_economy.170.a: "알겠다, 알겠다!"
 israel_economy.170.b: "꺼져라."
 israel_economy.171.t: "에티오피아의 동의!"
 israel_economy.171.d: "준비가 시작되었으며 에티오피아계 유대인들이 귀향을 시작할 것입니다!"
 israel_economy.171.a: "훌륭해!"
 israel_economy.172.t: "에티오피아의 거절!"
 israel_economy.172.d: "에티오피아가 우리 국민의 귀향을 거부했습니다."
 israel_economy.172.a: "매우 유감이다!"
 israel_economy.172.b: "자업자득이다!"
