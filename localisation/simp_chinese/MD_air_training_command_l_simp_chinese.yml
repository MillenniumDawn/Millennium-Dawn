 MD_atc_command_1: "Combined Air Operations Center I"
 MD_atc_command_1_desc: "A central operations center plans and tasks air missions, integrating sensor data with tanker, strike and fighter assets."
 MD_atc_command_2: "Combined Air Operations Center II"
