 CUB_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 CUB_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 CUB_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 CUB_infantry_weapons_4_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
 CUB_infantry_weapons_5_desc: "AK-103 돌격소총은 7.62x39mm M43 탄약을 사용하는 AK-74M의 파생형입니다. 구형 AKM과 마찬가지로 AK-103은 야간 투시경과 망원 조준경을 포함한 다양한 조준기를 사용할 수 있으며, 총검이나 유탄 발사기도 장착할 수 있습니다. 대부분의 AK 소총과의 차이점은 AK-103이 플라스틱 및 저렴한 재료를 사용한다는 점입니다."
 CUB_infantry_weapons_6_desc: "AK-12는 러시아의 신형 돌격소총입니다. 라트니크 미래 보병 훈련 프로그램의 일환으로 개발되었으며, 특수부대용으로 제작되어 AK-103의 생산을 대체할 예정입니다. AK-12는 균형감각과 인체공학적 설계가 개선되어 현재까지 러시아에서 가장 정예화된 돌격소총으로 평가받고 있습니다."
 VEN_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 VEN_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 VEN_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
