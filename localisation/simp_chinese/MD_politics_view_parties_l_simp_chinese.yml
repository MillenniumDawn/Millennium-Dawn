 PER.conservatism_Novin: "£PER_conservatism  (INP) -  新伊朗党"
 PER.conservatism_Farashgard_desc: "（自由民主主义）- 伊朗复兴\n\n伊朗复兴是由来自美国、加拿大、欧洲和伊朗的40名伊朗活动家创立的政治行动网络。\n伊朗复兴倡导伊朗通过共和制或君主立宪制建立世俗民主政体。\n其原名法拉什加德，隐喻性地源自中波斯语中的弗拉绍克勒蒂概念。法拉什加德是琐罗亚斯德教的教义，主张宇宙的最终更新，届时邪恶将被摧毁，其他一切将与上帝完美统一。"
 PER.liberalism_ADFI: "£PER_liberalism (ADFI)  - 伊朗民主自由联盟"
 PER.liberalism_ADFI_desc: "（自由民主主义） - 民主自由联盟\n\n伊朗民主自由联盟寻求一种更加世俗化的政府形式，推动人权、个人自由和民主。他们经常推动更大的公民自由，这使得他们与该国的保守派团体存在分歧。"
 PER.socialism2: "£PER_anarchist_communism (MEK)  - 伊朗人民圣战者组织 - §C西方派§!"
 PER.socialism2_desc: "（伊斯兰社会主义） - 伊朗人民圣战者组织\n\n人民圣战者组织，成立于1965年，旨在反对巴列维王朝，其创立理念深受马克思主义和伊斯兰主义的影响。由于其政党结构以马里亚姆·拉贾维和马苏德·拉贾维为中心，该组织常被称为“类邪教”。人民圣战者组织希望实施一系列计划，推动伊朗走向更加联邦化和社会主义的国家。"
 PER.Nat_Fascism_alt: "£generic_Nat_Fascism_small (PFM)  - 人民改革运动"
 PER.Nat_Fascism_alt_desc: "（伊斯兰民族主义） - 人民改革运动\n\n人民改革运动由埃斯凡迪亚尔·拉希姆·马沙伊和哈米德·巴格哈伊领导，倡导伊朗思想学派。该组织认为伊斯兰教的存在完全是因为伊朗，因此秉持民粹主义观点，试图将伊斯兰民族主义和前伊斯兰伊朗民族主义融合在一起，以主导伊朗政坛。该组织的许多成员在伊朗伊斯兰共和国时期曾是艾哈迈迪内贾德及其阵营的支持者（或曾经是）。"
