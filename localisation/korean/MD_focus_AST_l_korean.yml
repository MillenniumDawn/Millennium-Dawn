 peacekeeping_training_ast: "평화유지 훈련"
 strategic_reforms_1_ast: "ADF 전략 개혁"
 sell_federal_airports: "연방 공항 매각"
 sell_railcorp_freight: "프레이트코프 및 국영 철도 지분 매각"
 sell_broadcast_australia: "브로드캐스트 오스트레일리아 매각"
 sell_dasfleet: "DASFLEET 매각"
 sell_reserve_bank_assets: "준비은행 자산 매각"
 ast_industry_decisions: "산업 프로젝트"
 ast_industry_decisions_desc: "정부가 주도하는 산업 프로젝트는 민간 기업의 부담을 덜면서 국내 생산을 직접 개선할 수 있게 해 줍니다."
