l_russian:
 AI_RACE_debug_category: "ОТЛАДКА: гонка ИИ"
 AI_RACE_debug_category_desc: "Инструменты разработчика для проверки и исправления гонки ИИ. Эта категория видна только в отладочной сборке."
 AI_RACE_debug_readout: "ОТЛАДКА: проверить состояние гонки ИИ"
 AI_RACE_debug_readout_desc: "§HСостояние страны§!\nВозможности: §Y[?ROOT.ai_race_capability|0]§! | Национальные: §Y[?ROOT.ai_race_capability_external|0]§! | Запас: §Y[?ROOT.ai_race_capability_stock|0]§!\nОтставание от лидера: §Y[?ROOT.ai_race_frontier_gap|+0]§! | Место: §Y[?ROOT.ai_race_rank|0]§!\n\n§HГлобальное состояние§!\nЛидер: §Y[?global.ai_race_frontier_capability|0]§! | Эпоха: §Y[?global.ai_race_epoch|0]§! | Участники: §Y[?global.ai_race_participants^num|0]§!"
 AI_RACE_debug_repair: "ОТЛАДКА: исправить состояние гонки ИИ"
 AI_RACE_debug_repair_desc: "Создаёт недостающее состояние гонки ИИ, пересчитывает производные данные стран и глобальное состояние и ограничивает значения допустимыми пределами. Квартальную эпоху не продвигает."
 AI_RACE_category: "Гонка ИИ"
 AI_RACE_category_desc: "Развивайте промышленные мощности, электроснабжение и снабжение материалами, чтобы участвовать в гонке ИИ. Изучайте каждую инвестицию, прежде чем выделять государственные средства."
 AI_RACE_stage_0: "Этапы не профинансированы"
 AI_RACE_stage_1: "Исследования"
 AI_RACE_stage_2: "Внедрение"
 AI_RACE_stage_3: "Расширение"
 AI_RACE_stage_4: "Передовой ИИ"
 AI_RACE_first_finisher_none: "Никто"
 AI_RACE_first_finisher_country: "[?global.ai_race_first_finisher_id.GetName]"
 AI_RACE_dashboard_title: "Гонка ИИ"
 AI_RACE_dashboard_stage: "Этап: §Y[ai_race_stage_name]§!\n[ai_race_stage_work]"
 AI_RACE_dashboard_capacity: "§HРабочие мощности: доступно / требуется§!\nГражданские фабрики: [?ROOT.ai_race_current_civs_available|0] / [?ROOT.ai_race_current_civs_required|0] ([?ROOT.ai_race_current_civs_ratio|%0]; [ai_race_current_civs_status])\nСетевая инфраструктура: [?ROOT.ai_race_current_network_available|0] / [?ROOT.ai_race_current_network_required|0] ([?ROOT.ai_race_current_network_ratio|%0]; [ai_race_current_network_status])\nПостоянная мощность: [?ROOT.ai_race_current_power_available|1] / [?ROOT.ai_race_current_power_required|1] ГВт ([?ROOT.ai_race_current_power_ratio|%0]; [ai_race_current_power_status])\nМикрочипы: [?ROOT.ai_race_current_microchips_available|1] / [?ROOT.ai_race_current_microchips_required|0] ([?ROOT.ai_race_current_microchips_ratio|%0]; [ai_race_current_microchips_status])\nКомпозиты: [?ROOT.ai_race_current_composites_available|1] / [?ROOT.ai_race_current_composites_required|0] ([?ROOT.ai_race_current_composites_ratio|%0]; [ai_race_current_composites_status])\nНефть: [?ROOT.ai_race_current_oil_available|1] / [?ROOT.ai_race_current_oil_required|0] ([?ROOT.ai_race_current_oil_ratio|%0]; [ai_race_current_oil_status])\n§YОграничивающее требование§!: [ai_race_current_bottleneck]."
 AI_RACE_dashboard_benefits: "Эффективность работы: §Y[?ROOT.ai_race_current_readiness|%1]§!\nБонусы: §G[?ROOT.ai_race_bonus|%1]§! к скорости исследований,\nросту эффективности производства и доходу офисов."
 AI_RACE_dashboard_ranking: "Место за квартал: §Y[?ROOT.ai_race_rank|0]§! | Возможности: §Y[?ROOT.ai_race_effective_capability|1]§!\nНаведите курсор, чтобы увидеть разбивку возможностей.\nПервым в истории финишировал: §Y[ai_race_first_finisher_name]§!"
 AI_RACE_capability_breakdown_funded: "§HРазбивка возможностей§!\nНациональные возможности после ограничения: §Y[?ROOT.ai_race_capability_external|1]§!\nПрофинансированный запас: §Y[?ROOT.ai_race_capability_stock|1]§! | Используется при текущей готовности: §Y[?ROOT.ai_race_capability_funded_usable|1]§!\nЭффективные возможности после итогового ограничения: §Y[?ROOT.ai_race_effective_capability|1]§!"
 AI_RACE_capability_breakdown_unfunded: "§HРазбивка возможностей§!\nНациональные возможности после ограничения: §Y[?ROOT.ai_race_capability_external|1]§!\nЭффективные возможности: §Y[?ROOT.ai_race_effective_capability|1]§!"
 AI_RACE_bottleneck_none: "Сейчас узких мест нет"
 AI_RACE_bottleneck_civs: "Гражданские фабрики"
 AI_RACE_bottleneck_network: "Сетевая инфраструктура"
 AI_RACE_bottleneck_power: "Постоянная мощность"
 AI_RACE_bottleneck_microchips: "Микрочипы"
 AI_RACE_bottleneck_composites: "Композиты"
 AI_RACE_bottleneck_oil: "Нефть"
 AI_RACE_dashboard_investment: "Следующая инвестиция: §Y$[?ROOT.ai_race_offer_cost|1] млрд§!\nГотовность к следующему этапу: §Y[?ROOT.ai_race_offer_readiness|%1]§!\nОткройте рассмотрение ниже, чтобы увидеть мощности и условия финансирования."
 AI_RACE_dashboard_financing: "§HНепогашенное финансирование ИИ§!: §Y$[?ROOT.ai_race_finance_outstanding|2] млрд§!\nВсего выплат: §Y$[?ROOT.ai_race_finance_weekly|3] млрд в неделю§!\n§HОстаток долга / исходная сумма ($ млрд); в неделю ($ млрд); осталось платежей§!\nИсследования: [?ROOT.ai_race_finance_remaining_1|2] / [?ROOT.ai_race_finance_original_1|2]; [?ROOT.ai_race_finance_due_1|3]; [?ROOT.ai_race_finance_installments_1|0]\nВнедрение: [?ROOT.ai_race_finance_remaining_2|2] / [?ROOT.ai_race_finance_original_2|2]; [?ROOT.ai_race_finance_due_2|3]; [?ROOT.ai_race_finance_installments_2|0]\nРасширение: [?ROOT.ai_race_finance_remaining_3|2] / [?ROOT.ai_race_finance_original_3|2]; [?ROOT.ai_race_finance_due_3|3]; [?ROOT.ai_race_finance_installments_3|0]\nПередовой ИИ: [?ROOT.ai_race_finance_remaining_4|2] / [?ROOT.ai_race_finance_original_4|2]; [?ROOT.ai_race_finance_due_4|3]; [?ROOT.ai_race_finance_installments_4|0]"
 AI_RACE_dashboard_rival: "§Y[?THIS.ai_race_rank|0].§! [THIS.GetNameWithFlag] | [ai_race_stage_name] | Возможности [?THIS.ai_race_effective_capability|1]"
 AI_RACE_review_available_tt: "Следующий этап удовлетворяет требованиям по дате, технологиям и работе на предыдущем этапе, и ни одна инвестиция не ожидает рассмотрения. Проверки казны и банкротства выполняются при подтверждении покупки."
 AI_RACE_review_investment_tt: "Открывает бесплатное рассмотрение первоначальной инвестиции, каждого требования к мощностям и возможного чрезвычайного финансирования ИИ. На подтверждение даётся семь дней; без ответа инвестиция откладывается."
 AI_RACE_defer_investment_tt: "Откладывает инвестицию, не тратя средства казны и не создавая финансирования. Рассмотрение без ответа истекает через семь дней."
 AI_RACE_pay_direct_tt: "Платит §Y$[?ROOT.ai_race_quote_cost|2] млрд§! из казны и начинает рассмотренный этап без нового финансирования. Месяц начала не засчитывается в выполненную работу этапа."
 AI_RACE_pay_financed_tt: "Платит §Y$[?ROOT.ai_race_quote_cost|2] млрд§! из казны и начинает рассмотренный этап с дополнительным §Yчрезвычайным финансированием ИИ§!, которое погашается еженедельно. Работа над этапом продолжается при нехватке мощностей, а наши бонусы определяет самое слабое физическое требование. Месяц начала не засчитывается в выполненную работу этапа."
 AI_RACE_quote_capacity_tt: "§HМощности по оценке: доступно / требуется§!\nГражданские фабрики: [?ROOT.ai_race_quote_civs_available|0] / [?ROOT.ai_race_quote_civs_required|0] ([?ROOT.ai_race_quote_civs_ratio|%1]; [ai_race_quote_civs_status])\nСетевая инфраструктура: [?ROOT.ai_race_quote_network_available|0] / [?ROOT.ai_race_quote_network_required|0] ([?ROOT.ai_race_quote_network_ratio|%1]; [ai_race_quote_network_status])\nПостоянная мощность: [?ROOT.ai_race_quote_power_available|1] / [?ROOT.ai_race_quote_power_required|1] ГВт ([?ROOT.ai_race_quote_power_ratio|%1]; [ai_race_quote_power_status])\nМикрочипы: [?ROOT.ai_race_quote_microchips_available|1] / [?ROOT.ai_race_quote_microchips_required|0] ([?ROOT.ai_race_quote_microchips_ratio|%1]; [ai_race_quote_microchips_status])\nКомпозиты: [?ROOT.ai_race_quote_composites_available|1] / [?ROOT.ai_race_quote_composites_required|0] ([?ROOT.ai_race_quote_composites_ratio|%1]; [ai_race_quote_composites_status])\nНефть: [?ROOT.ai_race_quote_oil_available|1] / [?ROOT.ai_race_quote_oil_required|0] ([?ROOT.ai_race_quote_oil_ratio|%1]; [ai_race_quote_oil_status])\n§YНехватка мощностей§!: любое требование ниже 100%. Самое слабое требование определяет нашу эффективность работы. Поставленный импорт засчитывается в предложение. Учитываются только неповреждённые здания; разряд аккумуляторов не покрывает потребность в постоянной мощности."
 AI_RACE_quote_financing_tt: "§HЧрезвычайное финансирование ИИ§!\nДоступно при нехватке мощностей, в дополнение к первоначальной инвестиции.\nПервоначальная инвестиция: §Y$[?ROOT.ai_race_quote_cost|2] млрд§!\nВВП на момент одобрения: §Y$[?ROOT.ai_race_quote_gdp|2] млрд§!\nФиксированная сумма финансирования: §Y$[?ROOT.ai_race_quote_principal|2] млрд§!, что составляет §Y[?ROOT.ai_race_quote_rate|%1]§! ВВП на момент одобрения.\nПогашение: §Y$[?ROOT.ai_race_quote_payment|3] млрд в неделю§!, §Y520 еженедельных платежей§! в течение десяти лет. Последний платёж закрывает точный остаток.\nКаждый пакет добавляет свой еженедельный платёж. Ремонт, инфляция и последующие изменения ВВП не меняют одобренную сумму долга и не отменяют выплаты. Изменившаяся оценка требует нового рассмотрения и ничего не стоит."
 ai_race.10.t: "Передовой ИИ достигнут"
 ai_race.10.d: "Наша национальная программа ИИ достигла уровня передового ИИ. Наши исследователи и промышленность добились рубежа, который теперь зависит от постоянной государственной поддержки."
 ai_race.10.a: "Отметить достижение."
 ai_race.11.t: "Рассмотрение инвестиции больше не действительно"
 ai_race.11.d: "Инвестиция больше не может состояться на рассмотренных условиях. Средства не списаны, пакет финансирования не создан. Когда требования для начала будут выполнены, мы сможем запросить новое рассмотрение через решения гонки ИИ."
 ai_race.11.a: "Пересмотреть предложение."
 ai_race_news.1.t: "Первый в передовом ИИ"
 ai_race_news.1.d: "Первенство в достижении передового ИИ принадлежит стране [?global.ai_race_first_finisher_id.GetName]. Её исследователи и промышленные партнёры навсегда вписали себя в историю искусственного интеллекта, а конкурирующие национальные программы продолжают работу."
 ai_race_news.1.a: "Гонка продолжается."
 AI_RACE_review_research: "Рассмотреть инвестицию в исследования"
 AI_RACE_review_research_desc: "Бесплатно рассмотреть инвестицию в этап «Исследования» стоимостью $50 млрд. Начать можно с января 2016 года после изучения технологии «Современное глубокое обучение». Чтобы перейти дальше, этап «Исследования» должен длиться 36 месяцев."
 ai_race.1.t: "Рассмотрение инвестиции в исследования"
 ai_race.1.d: "Наши научные учреждения предложили национальную программу, которая выведет передовой искусственный интеллект за рамки разрозненных экспериментов. Теперь предложение ждёт решения об инвестициях."
 ai_race.1.a: "Отложить инвестицию."
 ai_race.1.b: "Вложить $[?ROOT.ai_race_quote_cost|1] млрд из казны."
 ai_race.1.c: "Вложить с чрезвычайным финансированием ИИ."
 AI_RACE_review_implementation: "Рассмотреть инвестицию во внедрение"
 AI_RACE_review_implementation_desc: "Бесплатно рассмотреть инвестицию в этап «Внедрение» стоимостью $150 млрд. Начать можно с января 2019 года после изучения технологии «Современное глубокое обучение» и 36 месяцев этапа «Исследования». Чтобы перейти дальше, этап «Внедрение» должен длиться 60 месяцев."
 ai_race.2.t: "Рассмотрение инвестиции во внедрение"
 ai_race.2.d: "Наша исследовательская программа заложила основу для широкого внедрения. Промышленность и государственные учреждения предложили следующую национальную инвестицию."
 ai_race.2.a: "Отложить инвестицию."
 ai_race.2.b: "Вложить $[?ROOT.ai_race_quote_cost|1] млрд из казны."
 ai_race.2.c: "Вложить с чрезвычайным финансированием ИИ."
 AI_RACE_review_expansion: "Рассмотреть инвестицию в расширение"
 AI_RACE_review_expansion_desc: "Бесплатно рассмотреть инвестицию в этап «Расширение» стоимостью $400 млрд. Начать можно с января 2024 года после изучения технологии «Искусственный интеллект, имитирующий человека» и 60 месяцев этапа «Внедрение». Чтобы перейти дальше, этап «Расширение» должен длиться 12 месяцев."
 ai_race.3.t: "Рассмотрение инвестиции в расширение"
 ai_race.3.d: "Искусственный интеллект становится общенациональным делом, предъявляя всё больше требований к промышленности и инфраструктуре. Наше предложение о расширении сводит эти амбиции воедино для рассмотрения."
 ai_race.3.a: "Отложить инвестицию."
 ai_race.3.b: "Вложить $[?ROOT.ai_race_quote_cost|1] млрд из казны."
 ai_race.3.c: "Вложить с чрезвычайным финансированием ИИ."
 AI_RACE_review_frontier: "Рассмотреть инвестицию в передовой ИИ"
 AI_RACE_review_frontier_desc: "Бесплатно рассмотреть инвестицию в этап «Передовой ИИ» стоимостью $1000 млрд. Начать можно с января 2025 года после изучения технологии «Искусственный интеллект, имитирующий человека» и 12 месяцев этапа «Расширение». Передовой ИИ завершает национальную гонку; последующие технологии ИИ сохраняют собственные даты исследования и эффекты."
 ai_race.4.t: "Рассмотрение инвестиции в передовой ИИ"
 ai_race.4.d: "Наша национальная программа приближается к переднему краю гонки ИИ. Последнее инвестиционное предложение определяет мощности, необходимые для удержания этой позиции."
 ai_race.4.a: "Отложить инвестицию."
 ai_race.4.b: "Вложить $[?ROOT.ai_race_quote_cost|1] млрд из казны."
 ai_race.4.c: "Вложить с чрезвычайным финансированием ИИ."
 AI_RACE_refresh_assessment: "Обновить оценку"
 ai_race_operating_modifier: "Национальная программа ИИ"
 ai_race_operating_modifier_desc: "Наша профинансированная программа ИИ опирается на национальную промышленность, электроэнергию и поставки материалов. Её бонусы зависят от того, какие мощности мы можем поддерживать."
 ai_race_applied_power: "Потребность ИИ в электроэнергии"
 ai_race_applied_microchips: "Потребность ИИ в микрочипах"
 ai_race_applied_composites: "Потребность ИИ в композитах"
 ai_race_applied_oil: "Потребность ИИ в нефти"
 AI_RACE_stage_work_pending: "Работа начнётся после финансирования этапа «Исследования»."
 AI_RACE_stage_work_progress: "Работа этапа: §Y[?ROOT.ai_race_stage_months|0] / [?ROOT.ai_race_current_required_months|0] мес.§!"
 AI_RACE_stage_work_terminal: "Передовой ИИ достигнут. Следующих этапов гонки нет."
 AI_RACE_capacity_pending: "Ни один этап не профинансирован.\nРассмотрите этап «Исследования», чтобы увидеть требования к мощностям."
 AI_RACE_benefits_pending: "Бонусы этапов не действуют."
 AI_RACE_investment_complete: "Все этапы гонки завершены.\nПоддерживайте мощности, чтобы сохранить бонусы.\nНепогашенное финансирование по-прежнему подлежит выплате."
 AI_RACE_outcomes_only: "Только итоги: оцениваются национальные возможности и рейтинги.\nИнвестиции в этапы и финансирование отключены."
 AI_RACE_capacity_ready: "§GГотово§!"
 AI_RACE_capacity_shortfall: "§RНехватка§!"
 AI_RACE_dashboard_leaderboard_hint: "Мировой рейтинг — в международных системах, в разделе «Гонка ИИ»."
 AI_RACE_GUI_LEDGER_TT: "§YГонка ИИ§!"
 AI_RACE_GUI_LEDGER_TT_DELAYED: "Следите за мировой гонкой к передовому ИИ: этап и возможности каждого участника и то, кто финиширует первым."
 IS_title_ai_race: "ГОНКА ИИ"
 AI_RACE_tab_status_off: "Гонка ИИ отключена в правилах этой игры."
 AI_RACE_tab_status_upcoming: "Гонка начинается в январе 2016 года. К ней присоединяется каждая страна, изучившая «Современное глубокое обучение», и тогда же открываются инвестиции в этапы."
 AI_RACE_tab_status_empty: "Ни одна страна ещё не присоединилась к гонке. Страна присоединяется, когда изучит «Современное глубокое обучение»."
 AI_RACE_tab_status_full: "Каждый квартал участники ранжируются по этапу, выполненной работе этапа и возможностям.\nПервым достиг передового ИИ: §Y[ai_race_first_finisher_name]§!"
 AI_RACE_tab_status_outcomes: "Только итоги: каждый квартал участники ранжируются по возможностям. Инвестиции в этапы отключены в правилах этой игры."
 AI_RACE_tab_leaderboard: "Мировой рейтинг"
 AI_RACE_tab_status_tt: "С января 2016 года к гонке присоединяется каждая страна, изучившая §Y«Современное глубокое обучение»§!. Рейтинг пересчитывается каждый квартал."
 AI_RACE_tab_leaderboard_tt: "Страны ранжируются сначала по этапу, затем по выполненной работе к следующему этапу, затем по §Yвозможностям§!.\nЭтапы: §YИсследования§!, §YВнедрение§!, §YРасширение§! и §YПередовой ИИ§!. Возможности снижаются, когда стране не хватает фабрик, сети, электроэнергии или материалов, нужных для её этапа."
 AI_RACE_tab_help_tt: "§YГонка ИИ§!\nС 2016 года страны с технологией «Современное глубокое обучение» могут финансировать четыре национальных этапа ИИ. Каждый этап требует первоначальной инвестиции, а также гражданских фабрик, сетевой инфраструктуры, электроэнергии, микрочипов, композитов и нефти. Профинансированные этапы ускоряют исследования, рост эффективности производства и доход офисов."
 AI_RACE_tab_help_tt_delayed: "Управляйте своей программой в §YРешениях§!, в разделе §YГонка ИИ§!: этап, шесть требований, финансирование и рассмотрение этапов. На этой вкладке показан мировой рейтинг. В правилах игры гонку можно установить в режим «Полная», «Только итоги» или «Выкл.»."