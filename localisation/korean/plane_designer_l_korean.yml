 naval_weapons_5: "초첨단 해상 무기"
 naval_weapons_5_desc: "고급 유도 어뢰와 극초음속 대함 미사일로 구성된 이 무기들은 사거리와 탑재량이 크게 늘어났으며, 최소한의 소모로 적 병력을 파괴할 수 있습니다."
 naval_weapons_6: "극초첨단 해상 무기"
 naval_weapons_6_desc: "고급 유도 어뢰와 극초음속 대함 미사일로 구성된 이 무기들은 사거리와 탑재량이 크게 늘어났으며, 최소한의 소모로 적 병력을 파괴할 수 있습니다."
 special_mad_4: "최첨단 대잠 기술"
