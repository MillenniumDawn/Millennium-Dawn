 MD_drift_label_stability: "Low stability"
 MD_drift_label_interest: "High interest rate"
 MD_drift_label_recession: "Recession"
 MD_drift_label_depression: "Depression"
 MD_drift_label_war: "War fatigue"
 MD_drift_label_corruption: "Coalition weakness"
 MD_drift_label_ct: "Counter-terror policy"
 MD_drift_label_unknown: "No dominant source"
