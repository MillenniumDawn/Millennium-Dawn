 BSH.Autocracy_desc: "专制主义 - 拉希莫夫专制主义或第一政府（领导人：穆尔塔扎·拉希莫夫 - 乌拉尔·拉希莫夫 - 拉斐尔·拜达夫列托夫 - 赖尔·萨尔巴耶夫）。这是由独裁者穆尔塔扎·拉希莫夫领导的第一届政府。他以其民族变革，以及在南部和东南部省份的国家主义经济政策而受到欢迎。显然，这是一个由来自苏共的人组成的腐败政府，但却有着专横的倾向。通常他们被称为贝赛思主义（贝赛思）"
 BSH.socialism: "£BSH_western_social 社会民主党"
 BSH.socialism_desc: "社会民主主义 - 社会民主党（领导人：苏比德·托甘）。巴什基尔社会民主党，是以第一个巴什基尔社会主义党的历史为基础的，该党由阿赫梅特·扎基·瓦利迪创立。领导人的位置由他的儿子苏比德·托甘接任，他从土耳其返回了他的历史故乡。该党的原则是基于阿赫梅特·扎基·瓦利迪赋予第一共和国的理念。"
 BSH.Conservative: "£BSH_emerging_reactionary_1 巴什科尔托斯坦总统"
 ALG.Neutral_Muslim_Brotherhood_icon: "£ALG_Neutral_Muslim_Brotherhood_small"
 ARG.Western_Autocracy: "£ARG_western_autocracy (CF) - 联邦承诺"
 ARG.Western_Autocracy_icon: "£ARG_western_autocracy"
 ARG.Western_Autocracy_desc: "(联邦庇隆主义) - 联邦承诺\n\n联邦承诺党是罗德里格斯·萨阿兄弟的全国性政治工具，他们自 1983 年以来一直执政圣路易斯省。该党于 2011 年以联盟形式成立，并于 2015 年注册为政党。它主张圣路易斯模式，即平衡预算、公共工程、省级自治以及由省政府而非布宜诺斯艾利斯管理的社会项目，其立场是保守的联邦庇隆主义，反对该运动中的基什内尔派。\n\n阿道夫·罗德里格斯·萨阿在2001年12月经济崩溃期间短暂担任总统一周，宣布外债违约；2003年，他领导人民运动阵线，在总统选举中获得14.11%的选票；阿尔贝托·罗德里格斯·萨阿在2011年以联邦承诺党的名义参选，获得7.96%的选票，位列第四。该党在圣路易斯拥有绝对优势，但在其他地区影响力微乎其微，其影响力主要体现在可以随意向庇隆主义阵营交换的少数几名众议员和参议员身上。"
 ARG.conservatism_alt: "£ARG_conservatism_alt (PRO) - 共和国方案"
 ARG.conservatism_alt_icon: "£ARG_conservatism_alt"
 ARG.conservatism_alt_desc: "(自由保守主义) - 共和国方案\n\n共和国方案由毛里西奥·马克里于2005年8月5日创立，最初名为“变革承诺党”。2008年4月1日，该党吸收了里卡多·洛佩斯·墨菲的“改革党”，并更名为现名。该党从2007年起执掌布宜诺斯艾利斯市政府起步，并发展成为除庇隆主义和激进主义之外，首个赢得总统大选的政党。共和提案党主张市场经济、制度现代化、管理型政府以及与西方融合，是反基什内尔主义的中右翼阵营的支柱。\n\n马克里在2015年第一轮选举中获得34.15%的选票，并在2015年11月22日的第二轮投票中以51.34%的得票率获胜。他领导的变革党联合激进公民联盟和公民联盟执政至2019年，当时“团结变革党”败给了庇隆主义阵线。马克里于2014年3月再次当选变革党主席，此后该党逐渐与哈维尔·米莱领导的自由进步党结盟。变革党的优势在于首都和潘帕斯草原省份的城市中产阶级，其弱点在于2018年货币危机和国际货币基金组织贷款带来的负面影响。"
 ARG.Conservative: "£ARG_emerging_reactionary (PV) - 胜利党"
 ARG.Conservative_icon: "£ARG_emerging_reactionary"
 ARG.Conservative_desc: "(基什内尔主义) - 胜利党\n\n胜利党于2003年2月25日由布宜诺斯艾利斯省正义党内的基什内尔主义派系创立，旨在为内斯托尔·基什内尔在官方庇隆主义阵营之外开辟一条独立的选票路线。自胜利阵线成立以来，胜利党一直是其成员之一。该党奉行基什内尔主义，主张：国家主导经济增长、收入再分配、对独裁政权进行人权迫害、敌视国际货币基金组织、反对农业和媒体机构，以及效忠基什内尔家族反对庇隆主义执政者。\n\n它的功能在于组织而非选举。它为克里斯蒂娜·费尔南德斯·德·基什内尔在2011年赢得54.11%的选票以及丹尼尔·肖利在2015年参选提供了法律支持，并在2023年以“祖国联盟”的形式重新出现。该组织由萨尔塔省参议员塞尔吉奥·莱维领导，并向费尔南德斯·德·基什内尔负责，其优势在于布宜诺斯艾利斯郊区基什内尔主义激进分子的核心力量，其弱点在于脱离基什内尔的领导层后便失去了活力。"
 ARG.Neutral_Libertarian: "£generic_Neutral_Libertarian_small (UCeDé) - 民主中心联盟"
 ARG.Neutral_Libertarian_desc: "(古典自由主义) - 民主中心联盟\n\n民主中心联盟由工程师兼经济部长阿尔瓦罗·阿尔索加雷于1982年创立，他自20世纪50年代以来一直向阿根廷人宣扬自由市场自由主义，是古典自由主义、私有化、放松管制和瓦解庇隆主义国家的政党。它代表着市场，反对两大政党的法团主义传统，也是追随其后的自由主义者的思想温床。\n\n阿尔索加雷在1989年总统选举中获得7.17%的选票，位列第三，这是该党取得的最佳成绩。随后，其成员加入卡洛斯·梅内姆政府，推行他们竞选时所倡导的私有化政策，这使得该党被纳入梅内姆的庇隆主义体系，并最终丧失了独立力量。到2000年，该党已名存实亡，并在接下来的十年中失去了全国性的地位。其继承者重组为自由党和自由进步党。"
 ARG.Neutral_Communism_alt: "£ARG_Neutral_Communism_alt (FIT) - 工人左翼阵线"
 ARG.Neutral_Communism_alt_icon: "£ARG_Neutral_Communism_alt"
 ARG.Neutral_Communism_alt_desc: "(托洛茨基主义) - 工人左翼阵线\n\n2011年4月14日，社会主义工人党、工人党和社会左翼党联合成立了工人左翼阵线，作为托洛茨基主义左翼的永久性选举阵线，旨在突破2009年选举法设定的1.5%的初选门槛，该门槛旨在淘汰小党。工人左翼阵线主张建立工人政府、将银行和对外贸易国有化、实行工资浮动制以应对通货膨胀、拒绝偿还债务，其成员领取工人工资，并在各成员党之间轮流担任议员。\n\n豪尔赫·阿尔塔米拉在2011年总统选举中获得2.30%的选票，尼古拉斯·德尔卡尼奥在2015年获得3.23%的选票。该阵线于2013年首次赢得全国众议院席位，使极左翼在阿根廷历史上首次拥有了常驻议会党团。其优势在于布宜诺斯艾利斯、科尔多瓦和内乌肯的工业带以及大学；其影响力在于一个纪律严明的党团，其他任何政党都无法与之匹敌。"
