 BLR_BELSPETSVNESHTECHNIKA_materiel_manufacturer: "벨스페츠브네슈테흐니카"
 BLR_558_aircraft_repair_plant_aircraft_manufacturer: "제558 항공기 수리 공장"
 BLR_Credit_tec2: "열병합 발전소 개선 대출"
 BLR_Credit_tec2_desc: "민스크의 화력 발전소를 개선해야 하므로 중국에 대출을 요청할 것입니다."
 BLR_AES: "벨라루스 원자력 발전소"
 BLR_AES_desc: "마침내 우리 자체 원자력 발전소를 건설할 것입니다."
 BLR_Chinese_kal: "중국과의 무역 협정"
 BLR_Chinese_kal_desc: "중국과 무역 협정을 체결하여 그로드노 아조트의 생산 능력을 늘릴 수 있을 것입니다."
 BLR_Chinese_zdania: "신규 공장 건설"
 BLR_Chinese_zdania_desc: "중국 정부가 우리나라에 대한 투자를 늘리고 있으며 새 공장을 지을 준비가 되어 있습니다."
 BLR_Chinese_konfuci: "공자학원"
 BLR_Chinese_konfuci_desc: "우리나라에 여러 공자학원을 개설할 것입니다."
 BLR_Chinese_Poezda: "중국산 열차 구매"
 BLR_Chinese_Poezda_desc: "보급 개선에 도움이 될 열차 여러 대를 중국에서 구매할 것입니다."
 BLR_Chinese_huawei: "화웨이와의 협력"
 BLR_Chinese_huawei_desc: "이 중국 기업과 긴밀한 협력 관계를 구축할 것입니다."
 BLR_Chinese_energy: "에너지 부문에 대한 중국의 투자"
 BLR_Chinese_energy_desc: "중국 기업들이 우리나라 전역에서 투자 행진을 계속하고 있으며, 이제 다시 우리 에너지 부문에 투자할 준비가 되어 있습니다."
 BLR_Chinese_uchenia: "중국군과의 훈련"
 BLR_Chinese_uchenia_desc: "양국 군대 간의 경험 교류는 매우 유익할 것입니다."
 BLR_Chinese_yuan: "위안화, 제2의 국가 통화"
 BLR_Chinese_yuan_desc: "위안화를 우리나라의 제2 통화로 받아들일 준비가 되어 있습니다."
 BLR_Chinese_skynet: "중국의 인터넷 통제 경험"
 BLR_Chinese_skynet_desc: "소셜 네트워크 감시 경험을 배울 준비가 되어 있습니다."
 BLR_Chinese_economic: "중국의 경제 경험"
 BLR_Chinese_economic_desc: "중국 경제가 쌓은 모든 경험을 도입하고 있습니다."
 BLR_military_exercises_CHI_idea: "벨라루스-중국 합동 훈련"
 BLR_Socialist_Market_Economy: "사회주의 시장 경제"
 BLR_minotor_servise_sov: "벨라루스 미노토르 서비스"
 BLR_minotor_servise_blr: "러시아와의 미노토르 계약"
 BLR_558zadov_contract: "558 항공기 수리 공장 계약"
 BLR_peleng_contract: "[BLR.GetFlag]펠렝 사와의 계약"
 BLR_mzkt_contract: "MZKT 계약"
 BLR_mzkt_contract_another: "MZKT 계약"
 BLR_mzkt_contract_blr: "[SOV.GetNameWithFlag]와(과)의 MZKT 계약"
 BLR_Transport_troops: "수송 부대"
 BLR_Transport_troops_desc: "수송 지원 임무를 수행하도록 편성된 특수 부대입니다."
 BLR_MZKT: "MZKT"
 BLR_minoitor: "미노토르 서비스"
 BLR_belspecveshtech: "벨스페츠베시테흐니카"
 BLR_140_zavod: "제140 수리 공장"
 BLR_polonez: "중국과 자체 다연장 로켓 개발 착수"
 BLR_polonez_desc: "우리 다연장로켓발사시스템을 만들기 위해 중국 측 동료들의 도움을 받았습니다."
 BLR_peleng: "펠렝"
 BLR_peleng_for_russia: "대전차 유도 미사일(ATGM) 장비"
 BLR_peleng_for_russia_desc: "러시아 대전차 유도 미사일(ATGM)용 장비 생산을 시작할 준비가 되어 있습니다."
 BLR_peleng_for_ukr: "대전차 유도 미사일(ATGM) 장비"
 BLR_peleng_for_ukr_desc: "우크라이나 대전차 유도 미사일(ATGM)용 장비 생산을 시작할 준비가 되어 있습니다."
 BLR_558_zavod: "558 항공기 수리 공장"
 BLR_558_zavod_desc: "제558 항공 수리 공장은 구소련권 국가들과 많은 외국의 공군에서 운용하는 현대 전투 항공 장비의 수리와 현대화를 담당하는 CIS 최대 기업 중 하나입니다. 바라노비치 시에 위치한 벨라루스에서 가장 중요한 항공기 수리 시설입니다."
 BLR_litbel_attack_lat: "벨라루스의 라트갈레"
 BLR_litbel_attack_lat_desc: "라트갈레 땅은 오래전 라트비아에 의해 우리에게서 떨어져 나갔습니다. 이 부당함을 끝낼 때입니다."
 BLR_litbel_annex_lat: "라트비아 국가의 종말"
 BLR_litbel_annex_lat_desc: "라트갈레 땅이 다시 우리의 것이 되었습니다."
 BLR_rus_media: "러시아 언론 허용"
 BLR_rus_media_desc: "러시아 언론이 제한 없이 우리 영토에 들어오는 것을 허용할 것입니다."
 BLR_cyphrovizacia: "디지털화"
 BLR_cyphrovizacia_desc: "디지털 경제를 향한 여정을 시작할 것입니다."
 BLR_russian_uvz: "UVZ와 독점 계약 체결"
 BLR_russian_uvz_desc: "이 유명한 기업과의 협력은 우리에게 상당한 이익을 가져다줄 것입니다."
 BLR_all_cyphro: "전면 디지털화"
 BLR_all_cyphro_desc: "여러 정부 업무를 디지털화하면 시민 및 발생하는 문제를 더욱 효과적으로 처리하는 데 도움이 될 것입니다."
 BLR_kalash_zavod: "칼라시니코프 무기 공장 개설"
 BLR_kalash_zavod_desc: "이 유명 브랜드의 제품을 국내에서 제조할 것입니다."
 BLR_reform_officers: "신규 장교 학교 개설"
 BLR_reform_officers_desc: "장교 교육을 개선하는 것은 우리 군 개혁의 우선 과제 중 하나입니다."
 BLR_peace_rota: "평화유지 중대 창설"
 BLR_peace_rota_desc: "평화유지 임무에 참여할 특별 부대를 창설할 것입니다."
 BLR_Batka_policy: "인터넷 검열"
 BLR_Batka_policy1: "기생 행위에 관한 법령"
 BLR_Batka_policy3: "벨라루스 인터넷 정책"
 BLR_gudermes: "OMON을 체첸 구데르메스로 훈련 파견"
 BLR_gudermes_desc: "이 명성 높은 특수부대 대학을 살펴볼 필요가 있습니다. 어쩌면 우리 대원들이 기량을 향상시킬 수 있을지도 모릅니다."
 BLR_jeans_revolution: "청바지 혁명"
 BLR_jeans_revolution_desc: "국민은 다가오는 선거에 불만을 품고 있습니다. 알렉산드르 루카셴코의 승리를 믿지 않는다고 합니다. 앞으로 어떻게 될까요?"
 BLR_Zimbabwe: "짐바브웨 방문"
 BLR_Zimbabwe_desc: "우리 제품의 공급 계약을 체결하기 위해 짐바브웨를 방문할 것입니다."
 BLR_Excursion_Warsaw: "바르샤바 견학"
 BLR_Excursion_Warsaw_desc: "바그너 대원들이 바르샤바로 \\"견학\\"을 가고 싶다는 뜻을 적극적으로 선동하며 표명하고 있습니다. 우리가 이를 조직하는 것을 도울 수 있습니다. 우리 영토에서 국경을 넘는 것은 이론상 가능하지만, 그 후에 폴란드가 우리에게 선전포고할까요?"
 BLR_azarenok_tv: "루카셴코의 새 선전가"
 BLR_azarenok_tv_desc: "이제 텔레비전에서는 우리 당을 대변하여 방송하며 국민에게 우리 행동의 정당성을 납득시키는 새 선전가를 자주 볼 수 있습니다."
 BLR_decree_227: "대통령령 제227호 \\"경비 서비스 제공에 관하여\\""
 BLR_decree_227_desc: "새 대통령령 제227호는 많은 언론 매체 사이에서 상당한 파문을 일으켰습니다. 우리는 처음으로 민간 기업이 시설 경비를 위해 무기를 받는 것을 허용했습니다. 이것이 정말 어떤 결과로 이어질까요?"
 BLR_rofeign_legion: "외인부대"
 BLR_rofeign_legion_desc: "프랑스의 경험을 참고하여 우리 자체의 외인 부대를 창설할 것입니다."
 BLR_debur: "탈관료화"
 BLR_debur_desc: "공무원에 대한 지출을 줄이고 그 수를 감축할 것이며, 확보된 자금은 국민의 이익을 위해 쓰일 것입니다."
 BLR_metro_minsk: "민스크 지하철 확장"
 BLR_metro_minsk_desc: "도시의 물류 특성을 개선하기 위해 민스크 지하철을 개선하고 확장할 것입니다."
 BLR_belarus_support_category: "벨라루스 보조 부대"
 BLR_ter_oboronaup_start: "영토 방위군 소집"
 BLR_internalup_start: "제3 독립 특수목적 여단 소집"
 BLR_Litva_belarusizations_category: "신규 영토 통합"
 BLR_Litva_belarusizations_category_desc: "리투아니아 땅이 우리 통제 아래 들어왔습니다. 이 새로운 땅과 영토의 통합은 반드시 필요하며, 그렇지 않으면 이 지역에 대한 영구적인 통제를 유지할 수 없을 것입니다."
 BLR_belorusisation_sudovia: "수도비아의 벨라루스화"
 BLR_belorusisation_klaipeda: "클라이페다의 벨라루스화"
 BLR_belorusisation_samogitia: "사모기티아의 벨라루스화"
 BLR_mtz: "민스크 트랙터 공장"
 BLR_mtz_desc: "벨라루스에 있는 공장으로 농업 기계 제조업체입니다. 민스크 트랙터 공장은 1946년 5월 29일에 설립되었습니다. 이 공장의 설비 규모는 다양한 계열의 트랙터 71,000대를 생산할 수 있도록 설계되었습니다."
 BLR_start_minotor: "수리 시설 준비"
 BLR_minotor_btr: "장갑차 수리 시설 준비"
 BLR_minotor_bmp: "보병전투차 수리 시설 준비"
 BLR_minotor_tank: "전차 수리 시설 준비"
 BLR_minotor_start: "[SOV.GetNameWithFlag]와 계약 체결"
 BLR_start_zavod_558: "제558 공장 수리 시설 준비"
 BLR_bpla558: "드론 분야 개발 추진"
 BLR_start_peleng: "개발용 장비 준비"
 BLR_peleng_ptrk: "대전차 유도 미사일(ATGM) '호넷' 개발 투자"
 BLR_100dney: "벨라루스를 위한 100가지 아이디어"
 BLR_100dney_desc: "\\"벨라루스를 위한 100가지 아이디어\\" 사업은 재능 있는 청년을 발굴하고 그들의 학술 활동을 발전시키며 유망한 혁신적 개발을 촉진하는 것을 목표로 합니다."
 BLR_stroiotryad: "학생 건설단 부활"
 BLR_stroiotryad_desc: "소련 시대의 학생 건설단 관행을 부활시킬 것입니다. 장려책으로 이들에게 세금을 면제해 줄 것입니다."
 BLR_mzkt_rus: "[SOV.GetNameWithFlag]와의 차체 공급 계약"
 BLR_belvesh_t72bm1: "T-72BM1 최초 시제품 제작"
 BLR_belvesh_vsk100: "자체 소총 개발 연구 지원"
 BLR_belvesh_belgrad_1: "자주포 연구 지원"
 BLR_belvesh_belgrad: "다연장로켓발사시스템 베오그라드 최초 시제품 제작"
 BLR_belvesh_polonez_0: "포탄 성능 향상 연구 지원"
 BLR_belvesh_polonez_1: "사격 통제 시스템 관련 연구 지원"
 BLR_belvesh_polonez: "다연장로켓발사시스템 B-200 «폴로네즈» 최초 시제품 제작"
 BLR_140_kobra_k: "Cobra-K"
 BLR_140_kobra_k_desc: "소련제 BTR-70 장갑차의 벨라루스-슬로바키아 근대화 개량형 중 하나입니다."
 BLR_Poles_goes: "벨라루스를 떠나는 폴란드인"
 BLR_transport_troops: "수송 부대"
 BLR_agro_export: "벨라루스 트랙터"
 BLR_uvz: "우랄 화차 공장"
 BLR_fsb: "FSB"
 BLR_falck_schmidt_tank_manufacturer: "벨스페츠브네슈테흐니카"
 BLR_MVD: "내무부"
 BLR_Internal_troops: "내무군"
 BLR_Internal_troops_desc: "범죄적 침해로부터 시민의 권리, 헌정 체제, 벨라루스 공화국의 안보와 주권을 보호하는 벨라루스의 국가 군사 조직입니다."
 BLR_kgb_expand: "국가보안위원회"
 BLR_kgb_expand_desc: "벨라루스 공화국의 독립과 영토 보전, 헌정 질서 및 벨라루스 국가의 주권을 보호하고, 정치, 경제, 군사, 과학, 기술, 정보, 사회, 인구, 환경 분야의 국가 안보를 보장하며 방첩 및 해외 정보 활동을 수행하기 위해 설립된 벨라루스의 국가 집행 기관이자 특수 기관입니다."
 BLR_Countering_Cybercrime: "사이버 범죄 대응 총국"
 BLR_minotor_tt: "러시아와의 차륜 차량 수리 계약으로 수입을 얻습니다: $$§G0.300§!\n"
 BLR_mzkt_tt: "러시아와의 차륜 차량 수리 계약으로 수입을 얻습니다: $$§G0.100§!\n"
 SOV_minotor_tt: "미노토르와의 차륜 차량 수리 계약에 따라 대금을 지불합니다: $$§R-0.300§!\n"
 SOV_mzkt_tt: "미노토르와의 차륜 차량 수리 계약에 따라 대금을 지불합니다: $$§R-0.100§!\n"
 BLR_foreign_legion_TT: "§Y외인부대§! 대대가 편성됩니다"
 BLR_chi_coop_mil_TT: "우리 공장과 기업이 §Y북한§!에 제품을 판매할 수 있게 됩니다"
 belarus_export.3.a: "벨라루스 무기에 영광을"
 belarus_export.6.t: "벨라루스의 트랙터 판매 제안"
 belarus_export.6.d: "벨라루스의 MTZ 공장이 최신 트랙터를 우리에게 제안하고 있습니다. 우리의 농공업 발전에 큰 도움이 될 것입니다."
 belarus_export.6.a: "구매에 동의한다"
 belarus_export.6.b: "필요 없다"
 belarus_export.7.t: "팔려 나간 우리의 트랙터"
 belarus_export.7.d: "[FROM.GetNameWithFlag](이)가 트랙터 공급 계약을 우리와 체결하는 데 동의했습니다."
 belarus_export.7.a: "좋아"
 belarus_export.8.t: "우리 트랙터 구매 거절"
 belarus_export.8.d: "[FROM.GetNameWithFlag](이)가 트랙터 공급 계약을 우리와 체결하기를 거절했습니다."
 belarus_export.8.a: "섭섭하군"
 belarus_export.9.t: "벨라루스 미노토르와의 계약"
 belarus_export.9.d: "우리는 오래전부터 이 벨라루스 기업과 협력하고 싶었습니다. 그들은 우리의 차륜형 군용 장비를 수리해 줄 것이며, 이는 우리에게 큰 이득이 될 것입니다."
 belarus_export.9.a: "좋다"
 belarus_export.10.t: "제558 항공기 수리 공장과의 계약"
 belarus_export.10.d: "벨라루스 기술자들이 항공 장비 수리 서비스를 제안해 왔습니다. 그들과 계약을 체결하는 데 동의하시겠습니까?"
 belarus_export.10.a: "물론이지, 좋은 제안이다"
 belarus_export.10.b: "아니요, 우리는 그들의 제안을 거절할 것입니다"
 belarus_export.11.t: "제558 항공기 수리 공장과의 새로운 계약"
 belarus_export.11.d: "[FROM.GetNameWithFlag](이)가 제558 항공기 수리 공장과 계약을 체결했습니다."
 belarus_export.11.a: "좋아"
 belarus_export.12.t: "제558 항공기 수리 공장과의 계약 거절"
 belarus_export.12.d: "[FROM.GetNameWithFlag](이)가 제558 항공기 수리 공장과의 계약을 거절했습니다."
 belarus_export.12.a: "섭섭하군"
 belarus_export.13.t: "펠렝 사와의 계약"
 belarus_export.13.d: "전자 장비를 전문으로 하는 벨라루스 기업 펠렝이 대전차 유도 미사일(ATGM) 무기용 유도 장치를 공급하는 서비스를 제안할 준비가 되어 있습니다. 이 계약에 동의하시겠습니까?"
 belarus_export.13.a: "물론이지, 좋은 제안이다"
 belarus_export.13.b: "아니요, 우리는 그들의 제안을 거절할 것입니다"
 belarus_export.14.t: "펠렝 사와의 새로운 계약"
 belarus_export.14.d: "[FROM.GetNameWithFlag](이)가 펠렝과 대전차 유도 미사일(ATGM)용 장비 공급 계약을 체결했습니다."
 belarus_export.14.a: "좋아"
 belarus_export.15.t: "펠렝 사와의 계약 거절"
 belarus_export.15.d: "[FROM.GetNameWithFlag](이)가 펠렝과의 대전차 유도 미사일(ATGM)용 장비 공급 계약을 거절했습니다."
 belarus_export.15.a: "섭섭하군"
 belarus_export.16.t: "벨라루스의 대전차 유도 미사일"
 belarus_export.16.d: "벨라루스 제조업체들이 자사의 대전차 유도 미사일(ATGM)을 우리에게 납품하겠다고 제안하고 있습니다. 이 계약을 받아들이는 데 동의하시겠습니까?"
 belarus_export.16.a: "물론이지, 좋은 제안이다"
 belarus_export.16.b: "아니요, 우리는 그들의 제안을 거절할 것입니다"
 belarus_export.17.t: "대전차 유도 미사일 판매"
 belarus_export.17.d: "[FROM.GetNameWithFlag]에 대한 우리의 대전차 유도 미사일(ATGM) 판매 계약이 체결되었습니다."
 belarus_export.17.a: "좋아"
 belarus_export.18.t: "대전차 유도 미사일 판매"
 belarus_export.18.d: "[FROM.GetNameWithFlag]에 대한 우리의 대전차 유도 미사일(ATGM) 판매 계약이 거절되었습니다."
 belarus_export.18.a: "섭섭하군"
 belarus_export.19.t: "벨라루스의 차체"
 belarus_export.19.d: "벨라루스 제조업체들이 우리의 여러 군용 장비에 쓸 차체를 제안할 준비가 되어 있습니다. 이 계약에 동의하시겠습니까?"
 belarus_export.19.a: "물론이지, 좋은 제안이다"
 belarus_export.19.b: "아니요, 우리는 그들의 제안을 거절할 것입니다"
 belarus_export.20.t: "차체 공급 계약"
 belarus_export.20.d: "그들이 우리의 차체 공급 계약에 동의했습니다."
 belarus_export.20.a: "좋아"
 belarus_export.21.t: "차체 공급 계약"
 belarus_export.21.d: "그들이 우리의 차체 공급 계약을 취소하기로 했습니다."
 belarus_export.21.a: "섭섭하군"
 belarus_export.22.t: "공동 장갑차 사업"
 belarus_export.22.d: "[FROM.GetNameWithFlag] is offering us a joint APC project called Cobra-K. This project will bring us experience and knowledge in the modification of older equipment. Will we agree?"
 belarus_export.22.a: "물론이지, 좋은 제안이다"
 belarus_export.22.b: "아니요, 우리는 그들의 제안을 거절할 것입니다"
 belarus_export.23.t: "공동 장갑차 사업"
 belarus_export.23.d: "[FROM.GetNameWithFlag](이)가 장갑차 공동 개량 작업에 동의했습니다."
 belarus_export.23.a: "좋아"
 belarus_export.24.t: "공동 장갑차 사업"
 belarus_export.24.d: "[FROM.GetNameWithFlag](이)가 장갑차 공동 개량 작업을 거절했습니다."
 belarus_export.24.a: "섭섭하군"
 belarus_export.25.t: "B-200 «폴로네즈»"
 belarus_export.25.d: "[FROM.GetNameWithFlag](이)가 자국의 최신 다연장로켓발사시스템을 구매하라고 제안하고 있습니다. 구매에 동의하시겠습니까?"
 belarus_export.25.a: "물론이지, 좋은 제안이다"
 belarus_export.25.b: "아니요, 우리는 그들의 제안을 거절할 것입니다"
 belarus_export.26.t: "B-200 «폴로네즈»"
 belarus_export.26.d: "[FROM.GetNameWithFlag](이)가 우리의 다연장로켓발사시스템 구매에 동의했습니다."
 belarus_export.26.a: "좋아"
 belarus_export.27.t: "B-200 «폴로네즈»"
 belarus_export.27.d: "[FROM.GetNameWithFlag](이)가 우리의 다연장로켓발사시스템 구매를 거절했습니다."
 belarus_export.27.a: "섭섭하군"
 belarus_export.28.t: "벨라루스의 차체"
 belarus_export.28.d: "벨라루스 제조업체들이 우리의 여러 군용 장비에 쓸 차체를 제안할 준비가 되어 있습니다. 이 계약에 동의하시겠습니까?"
 belarus_export.28.a: "물론이지, 좋은 제안이다"
 belarus_export.28.b: "아니요, 우리는 그들의 제안을 거절할 것입니다"
 belarus_export.29.t: "차체 공급 계약"
 belarus_export.29.d: "[FROM.GetNameWithFlag](이)가 우리의 차체 공급 계약에 동의했습니다."
 belarus_export.29.a: "좋아"
 belarus_export.30.t: "차체 공급 계약"
 belarus_export.30.d: "[FROM.GetNameWithFlag](이)가 우리의 차체 공급 계약을 취소하기로 했습니다."
 belarus_export.30.a: "섭섭하군"
 belarus_another.45.t: "벨라루스 내전"
 belarus_another.45.d: "우리는 시위대를 억제하지 못했고, 이제 그들은 나라를 완전한 혼란에 빠뜨렸습니다. 앞으로 어떻게 될까요?"
 belarus_another.45.a: "끔찍하군!"
 belarus_another.52.t: "청바지 혁명"
 belarus_another.52.d: "벨라루스 국민이 합법 정부에 항의하며 거리로 나와 정부의 사퇴를 요구하고 있습니다. 우리가 이에 잘 대비했기를 바랍니다."
 belarus_another.52.a: "시위를 진압한다"
 belarus_another.53.t: "러시아의 정권을 장악한 민족볼셰비키"
 belarus_another.53.d: "우리의 충성스러운 지지자들이 마침내 러시아에서 권력을 장악하는 데 성공했습니다. 이제 크렘린은 우리의 것입니다. 우리 지도자는 러시아를 이끌 준비가 되었습니다."
 belarus_another.53.a: "러시아가 전부다. 나머지는 아무것도 아니다"
 belarus_another.54.t: "러시아 합류"
 belarus_another.54.d: "마침내 벨라루스가 고향으로 돌아갑니다. 이제 우리는 자치권을 희생하는 대신 위대한 나라의 일부가 될 것입니다. 그러나 우리에게 정말로 자치권이 필요했을까요?"
 belarus_another.54.a: "마침내"
 BLR_mission_to_Zimbabwe: "[ZIM.GetNameWithFlag]에 무역 사절단 파견"
 BLR_mission_to_Zimbabwe_desc: "짐바브웨에 무역 사절단을 파견하는 것은 우리 국가의 이익을 위한 현명한 사업적 결정입니다."
 BLR_luka_prime: "연방 국가 총리 - 루카셴코"
 default_left_side: "야당"
 default_right_side: "친러시아 세력"
