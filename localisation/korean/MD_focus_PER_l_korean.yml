 iranian_events.200.t: "시위 진압"
 iranian_events.200.d: "우리 보안군은 폭동에 가담한 자들을 성공적으로 제압했습니다. 소셜 미디어와 국제 무대에서 일부 비난을 받았으나, 시위의 심각성을 고려하면 이는 그리 중요하지 않습니다."
 iranian_events.200.a: "좋다"
 iranian_events.201.t: "큰 타격을 입은 보안군"
 iranian_events.201.d: "우리 보안군은 최근의 진압 시도에서 분노한 폭도들과 맞서다 사상자가 발생하며 큰 타격을 입었습니다. 이 차질은 일시적일 뿐이며, 우리가 다시 투입될 준비를 갖추는 것은 시간문제입니다."
 iranian_events.201.a: "알겠다"
 iranian_events.202.t: "식는 시위 열기"
 iranian_events.202.d: "몇 주간의 시위 끝에, 사람들은 별다른 성과 없이 거리에서 외치는 데 지쳐가고 있는 것으로 보입니다. 시위에 나오는 인원이 크게 줄었고, 폭도들은 소수의 헌신적인 시위대로 축소되었습니다."
 iranian_events.202.a: "예상했던 대로다"
 iranian_events.220.t: "임계점"
 iranian_events.220.d: "몇 주 동안 반대 세력은 오늘을 위해 기세를 모으며 기대감을 키워왔습니다. 이들의 목표는 단순합니다. 세다 바 시마 방송국을 점거하고 이슬람 공화국이 정당성이 없다고 선언하는 것입니다. 약 100만 명이 테헤란의 발리아스르 거리로 행진할 예정이며, 보안군은 그토록 많은 인원을 도저히 막을 수 없을 것이라고 우려하고 있습니다. 그 결과 아르테시와 IRGC의 여러 고위 인사들이 자신들의 지위와 동료들의 안전을 확보하기 위해 비공개로 반대 세력과 협상하고 있다고 합니다."
 iranian_events.220.a: "행진을 막기 위한 모든 조치를 승인한다"
 iranian_events.220.b: "상황을 지켜보자"
 iranian_events.221.t: "이탈과 불충"
 iranian_events.221.d: "아르테시 내 여러 장군과 고위 장교들이 공개적으로 정부를 비난하기 시작했으며, 심지어 정부에 맞서 형성되고 있는 새로운 운동을 지지하는 데까지 이르렀습니다. 육군의 가장 저명한 부대 중 하나인 제65 공수 특수부대 여단, 일명 NOHED 여단은 군복과 군사 장비에서 이슬람 공화국의 휘장을 떼어냈습니다. 이러한 사태는 정부에 대한 군사 쿠데타나 개입 가능성에 대한 공포를 불러일으켰습니다. NOHED 여단을 포함한 아르테시의 여러 부대는 운동 진압을 돕라는 명령을 거부했습니다."
 iranian_events.221.a: "이들을 체포하라!"
 iranian_events.221.b: "말하게 두자"
 iranian_events.222.t: "분열된 의회"
 iranian_events.222.d: "정권의 정당성에 대한 검증이 더욱 거세지면서, 전국의 여러 의원과 장관들이 은근한 저항의 표시로 사임하기 시작했습니다. 일부는 보다 조용한 방식을 택하고 있지만, 특히 테크노크라트와 개혁파 진영을 중심으로 아예 국민투표를 요구하기 시작한 이들도 있습니다. 어느 쪽이든 이러한 목소리는 우리가 끌 수 없는 불길에 기름을 더할 뿐이었습니다."
 iranian_events.222.a: "이 반역자들을 체포하라!"
 iranian_events.222.b: "우리가 할 수 있는 일은 없다"
 iranian_events.223.t: "몬타제리의 부상"
 iranian_events.223.d: "개혁파와 민주주의자들 사이에서 상당한 인기를 누리는 몬타제리 아야톨라는, 더 나은 민주 통치 체제로의 평화로운 권력 이양을 이끌 혁명 과도 정부를 이끌어달라는 요청을 받고 있습니다. 몬타제리는 무슬림과 세속주의자 모두에게 인기가 있기 때문에 그러한 직책의 이상적인 후보로 여겨지고 있으며, 이에 따라 통일된 저항 운동이 지속될 수 있습니다."
 iranian_events.223.a: "그에 대한 체포 영장을 발부하라"
 iranian_events.223.b: "내버려 두자"
 iranian_events.224.t: "이란 혁명 위원회 결성"
 iranian_events.224.d: "오늘 이른 시각, 이란의 건국자인 키루스 대왕의 무덤 주변에 거대한 군중이 모였습니다. 모임의 목적은 새로 결성된 이란 혁명 위원회의 대변인이자 전직 장관인 인물의 연설을 듣는 것이었습니다. 이 자리에서 혁명 위원회는 '이란 국민의 의지를 막으려' 하는 정권과 그 보안군에 맞서 무력을 사용하는 것을 두려워하지 않겠다고 선언한 것으로 알려졌습니다. 이러한 위협은 긴장이 계속 고조되는 가운데 IRGC 내 일부 세력에게 가볍게 받아들여지지 않았습니다."
 iranian_events.224.a: "IRGC에 대비 태세를 갖추도록 명령하라"
 iranian_events.224.b: "지켜보는 것밖에 할 수 없다"
 iranian_events.225.t: "테헤란의 함락"
 iranian_events.225.d: "오늘 시위대와 혁명가들이 여러 정부 건물을 습격하여 호메이니와 하메네이 아야톨라의 초상화를 끌어내리고, 같은 건물의 창문에서 반정부 구호를 외쳤습니다. 오늘 격렬한 연설에서 [PER.GetLeader] 아야톨라는 시위에 가담한 이들을 이스라엘과 미국의 첩자라고 규탄하며, 집으로 돌아가기만 하면 시위에 연루된 이들을 사면하겠다고 약속했습니다. 그러나 그의 연설은 귀담아듣는 이가 없었고, 거리의 외침은 갈수록 더 커지고 있습니다."
 iranian_events.225.a: "관료들을 마슈하드로 이전하라, 우리는 어디에도 가지 않는다!"
 iranian_events.225.b: "망명을 신청할 때다"
 iranian_events.226.t: "한 시대의 끝"
 iranian_events.226.d: "오늘 이른 아침, 최고지도자 집무실은 정부를 '이란의 영광스러운 국경 밖' 어딘가로 일시 이전한다고 발표했습니다. 거리에 나선 많은 이들에게 이는 이슬람 공화국이 공식적으로 사임하는 방식이었습니다. 수십 년의 통치 끝에 이슬람 공화국은 마침내 권력의 고삐를 놓았습니다. 사람들은 거리로 쏟아져 나와 기념물을 무너뜨리고 초상화를 찢으며 환호하고 있습니다. 권력의 회랑은 잠들어 있으며, 다음에 올 것은 아직 쓰이지 않았습니다."
 iranian_events.226.a: "'기록된 것에서 어찌 벗어날 수 있겠는가. 자신의 운명에서 어찌 도망칠 수 있겠는가?' §H- 피르다우시§!"
 iranian_events.227.t: "레바논 남부로 도피한 IRGC 최고 사령부"
 iranian_events.227.d: "박해와 심판, 혹은 수치를 피하려 했던 것인지, 이슬람 혁명수비대 최고 사령부 대부분이 레바논 남부로 도피했으며, 가장 충성스러운 일부 병력은 동부 농촌 지역으로 달아났습니다."
 iranian_events.227.a: "겁쟁이들"
 iranian_events.228.t: "이란 동부의 아르테시 진지를 포격하는 포병"
 iranian_events.228.d: "오늘 동부 여러 도시의 주민들이 폭발음에 잠에서 깼으며, 특히 마슈하드, 케르만, 야즈드에서 아르테시 진지가 맹렬한 포격을 받았습니다. 첫 공격 물결이 지나간 뒤, 거셈 솔레이마니가 이맘 레자 모스크의 군중 앞에 나타나 이슬람 공화국 정부의 이전을 가리키며 '불과 몇 주 전에 저질러진 실수가 오늘 바로잡힐 것'이라고 선언했습니다. 국가 동부로 도피했던 IRGC 세력이 재편성하여 아르테시를 몰아낼 만큼 강한 병력을 재건할 수 있었던 것으로 보입니다. 그럼에도 이는 일시적인 차질에 불과할 것입니다."
 iranian_events.228.a: "'용맹한 이들의 피가 먹구름에서 쏟아지는 비처럼 흘렀도다' §H- 피르다우시§!"
 iranian_events.228.b: "혁명가들은 길을 잘못 들었다... 솔레이마니가 이 실수를 바로잡을 것이다!"
 iranian_events.228.c: "이란인들은 수 세기 동안 현혹되어 왔다. 이란의 과거를 잇는 진정한 후계자가 이를 신속히 해결할 것이다!"
 iranian_events.229.t: "이란 동부에서 전투 발발"
 iranian_events.229.d: "이란 동부에서 격렬한 총격전이 보고되었으며, 군이 반군의 맹렬한 공격을 받고 있습니다. 문제의 반군은 최근 수립된 정부를 전복하기를 희망하며 거셈 솔레이마니 장군 아래 결집한 전직 IRGC 부대와 장교들로 보입니다. 이란 정부는 '이란 정부와 이란 국민은 군이 이란 국경의 온전함을 회복하고 이를 파괴하려는 반역자들을 몰아낼 것을 신뢰한다'고 밝히며 분쟁이 신속히 끝날 것이라고 발표했습니다. 이러한 주장이 일부 사람들을 안심시킨 듯 보이지만, 다른 이들은 IRGC가 정부를 전복하여 원래의 이슬람 공화국보다 더 강경한 정권을 출범시킬 수도 있다고 우려하고 있습니다."
 iranian_events.229.a: "또 하나의 혁명이 폐허로 변했다"
 iranian_events.230.t: "이란 전역에서 시위 발발"
 iranian_events.230.d: "이번 주 초 이란 정부가 극도로 인기 없는 결정을 내린 이후, 이란 국민들은 정부와 그 결정에 반대하는 목소리를 내기 위해 무리를 지어 거리로 나섰습니다. 이란의 봉기에서 흔히 나타나는 추세에 따라 시위가 곧 잦아들 것이라고 추측하는 이들도 있지만, 이번에는 시위가 오늘 목격되는 것과 같은 거리 시위를 통해 수립된 이슬람 공화국 체제의 전복으로 이어질 수도 있다고 말하는 이들도 있습니다. 어쨌든 정부는 이미 시위대에 대한 탄압을 시작했으며, 인터넷에 유포되는 영상은 보안군이 이 운동을 가볍게 여기지 않고 있음을 보여줍니다."
 iranian_events.230.a: "흥미롭군"
 iranian_events.231.t: "이슬람 공화국의 붕괴"
 iranian_events.231.d: "오늘 이른 아침, 최고지도자 집무실은 정부를 '이란의 영광스러운 국경 밖' 어딘가로 일시 이전한다고 발표했습니다. 이란 거리의 많은 이들에게 이는 이슬람 공화국이 공식적으로 사임하는 방식이었습니다. 수십 년의 통치 끝에 이슬람 공화국은 마침내 권력의 고삐를 놓았습니다. 이란 국민들은 거리로 쏟아져 나와 기념물을 무너뜨리고 초상화를 찢으며 환호하고 있습니다. 권력의 회랑은 잠들어 있으며, 다음에 올 것은 아직 쓰이지 않았습니다. 그러나 확실히 알려진 것은, 단결한 이란 반대 세력이 1979년 이슬람 공화국이 약속했으나 끝내 이행하지 않은 민주적 통치 형태를 지향하고 있다는 점입니다."
 iranian_events.231.a: "다음에는 무슨 일이 일어날까?"
 iranian_events.232.t: "야당 측의 정부 사임 요구 증가"
 iranian_events.232.d: "다양한 야당 단체들이 정부에 사임하고 물러날 것을 요구하는 목소리가 커지고 있습니다. 좌파에서 우파에 이르는 단체들이 동부에서 일어난 반란의 여파로 서로의 차이를 접어두는 데 성공했으며, 많은 야당 지도자들은 구정권 잔존 세력의 진격으로 자신의 목숨을 걱정하고 있습니다. 이제 사임하는 것이 적절한지 판단하는 것은 정부의 몫입니다."
 iranian_events.232.a: "사임하고 전직 국가원수들에게 넘기자"
 iranian_events.232.b: "사임하고 군주주의자들에게 넘기자"
 iranian_events.232.c: "사임하고 좌파에게 넘기자"
 iranian_events.232.d1: "정부는 결코 사임하지 않을 것이다!"
 iranian_events.233.t: "몰락한 정권의 잔재"
 iranian_events.233.d: "이슬람 공화국이 무너지자, 전직 정부 관료와 관련 인사들 중 다수가 자신의 경험을 이용해 스스로 권력을 장악할 기회를 보았습니다. 여기에는 아마디네자드, 마샤이, 갈리바프 같은 인물들이 포함됩니다. 이들 외에도 군 또한 자신들의 이익을 위해 정부 내에서 발언권을 키우기 시작했습니다. 이제 우리의 사임 이후 누구에게 나라를 이끌게 할지 선택할 때입니다."
 iranian_events.233.a: "아마디네자드를 부르자 - IRGC를 꺾을 수 있는 것은 IRGC뿐이다"
 iranian_events.233.b: "갈리바프를 부르자 - 과두 지배층이자 사업가"
 iranian_events.233.c: "마샤이를 부르자 - 이란식 이슬람 학파를 원하는 애국자"
 iranian_events.233.d1: "아르테시를 부르자 - 국군"
 iranian_events.234.t: "키루스의 후계자들"
 iranian_events.234.d: "1979년 이슬람 혁명 이전, 이란의 샤 왕조는 2,500년 넘게 나라를 이끌었습니다. 이러한 이유로 팔라비 왕조는 이슬람 혁명으로 전복된 이후에도 비교적 높은 인기를 누려왔습니다. 그러나 범이란주의자들 또한 정도는 덜하지만 군주주의자이며, 열강에게 빼앗긴 땅을 통합하기를 원합니다. 어느 쪽이든, 우리가 공식적으로 사임하면 권력을 넘겨줄 집단 하나를 골라야 합니다."
 iranian_events.234.a: "입헌주의자 - 레자 팔라비의 추종자들"
 iranian_events.234.b: "범이란주의자 - 이란의 잃어버린 영토를 재통합하려는 이들"
 iranian_events.235.t: "노동자들의 목소리"
 iranian_events.235.d: "이슬람 혁명은 온전히 이슬람 혁명만은 아니었으며, 오히려 폭넓은 정치 이념의 스펙트럼을 아우르고 있었습니다. 그중 두 번째로 큰 세력은 사회주의 및 좌익 혁명가들이었으나, 이들은 80년대 호메이니의 숙청 이후 정부에서 발언권을 박탈당했습니다. 어쨌든 사회주의 정부는 우리가 사임한 뒤 정부와 바자르 상인들 사이의 좋은 관계를 보장할 것입니다."
 iranian_events.235.a: "MEK - 인기는 없지만 조직력이 있다"
 iranian_events.235.b: "노동자 공산당 - 노조를 조직하는 능력으로 가장 잘 알려져 있다"
 iranian_events.236.t: "IRGC 붕괴"
 iranian_events.236.d: "몇 주간의 격렬한 전투 끝에 IRGC는 무기를 내려놓고 농촌 지역과 인접국으로 퇴각하기로 결정했으며, 다수는 비밀 통로를 통해 레바논 남부로 향하는 것을 택했습니다. 그러나 지금은 그들의 비겁함이 중요하지 않습니다. 가장 중요한 것은 혁명과 그 국민이 궁극적인 승리를 거두었다는 점입니다."
 iranian_events.236.a: "예상했던 대로다"
 iranian_events.237.t: "몬타제리 아야톨라의 대국민 연설"
 iranian_events.237.d: "호메이니 아야톨라가 모았던 군중보다 더 클지도 모르는, 이란 역사상 가장 큰 군중 중 하나일 법한 인파 앞에 서서 몬타제리는 눈앞의 군중에게 손을 흔들기 시작했습니다. 몬타제리 아야톨라는 기도로 연설을 시작한 뒤, '이전 정권의 부패하고 폭압적이며 비이슬람적인 제도'를 해체하겠다는 약속으로 이어갔습니다. 이 발언은 군중으로부터 큰 환호를 받았습니다. 20분간의 연설은 전국에 중계되었고, 집에서 시청하던 사람들은 창밖으로 몬타제리를 지지하는 구호를 외쳤습니다. 지금까지는 약속만 나왔을 뿐이지만, 많은 이들이 몬타제리 아야톨라가 약속한 변화에 낙관적입니다. 다만 그가 새롭고 자유로우며 민주적인 이란을 가져오겠다는 약속을 지킬지는 시간이 말해줄 것입니다."
 iranian_events.237.a: "신께서 이란과 함께하시기를"
 iranian_events.238.t: "온건 자유주의 이슬람의 부상"
 iranian_events.238.d: "몬타제리 아야톨라와 그 추종자들이 부상하면서, 많은 자유주의자와 온건파가 신속하고도 절실히 필요했던 사회 개혁을 국가에 가져온 새 정부를 칭송하기 시작했습니다. 갈 길은 아직 멀지만, 온건하고 자유주의적인 형태의 이슬람 통치에 대한 지지는 높아지고 있습니다. 희망의 녹색 길과 자유 운동 같은 정당들은 이란 정치의 변화에 힘입어 새로운 지지를 누리기 시작했습니다. 그럼에도 불구하고, 특히 '일탈 세력'이라고 불리는 이들 사이에서 민족주의 정서가 부상할 가능성에 대한 우려는 여전합니다."
 iranian_events.238.a: "무슨 일이 일어나는지 지켜보자"
 iranian_events.239.t: "침묵을 깬 하타미와 라프산자니"
 iranian_events.239.d: "이슬람 공화국이 붕괴한 뒤, 이슬람 공화국의 통치에 적극 참여했던 많은 저명한 개혁파 인사들이 침묵에 들어갔습니다. 특히 하타미와 라프산자니 두 사람은 유독 조용했습니다. 모하마드 하타미는 학생 단체들로부터 개혁 운동의 배신자라는 낙인이 찍혔는데, 이들이 정부에 항의했던 두 차례 모두 그가 자신들 편에 서지 않았다고 느끼며 배신감을 느꼈기 때문입니다. 또한 그가 선거 공약이었던 이란의 민주주의를 이행하지 못했다고도 생각합니다. 라프산자니 역시 정부의 앞잡이이자 이란에 민주주의를 가져오지 못한 인물이라는 낙인이 찍혔습니다. 그러나 오늘 이른 아침, 하타미와 라프산자니는 군중 앞에 나타나 새 정부의 승인 아래 정치로 복귀할 의향이 있다고 밝혔습니다."
 iranian_events.239.a: "좋다, 안 될 것 없지"
 iranian_events.239.b: "지옥에나 가라, 정치에서 추방하라!"
 nuclear_iran.25.t: "경제적 압박을 강화하는 미국"
 nuclear_iran.25.d: "미국은 우리 국민에 대한 경제 제재를 강화함으로써 자신들의 제국주의적 구상을 행사하기로 결정했습니다."
 nuclear_iran.25.a: "우리는 저항할 것이다!"
 nuclear_iran.26.t: "경제적 압박을 완화하는 미국"
 nuclear_iran.26.d: "미국은 우리 국민에게 가한 제재의 규모를 줄이기로 결정했습니다. 이러한 입장을 유지할지는 지켜봐야 할 일입니다."
 nuclear_iran.26.a: "좋다"
 nuclear_iran.27.t: "변덕스러운 행동을 시작한 이란"
 nuclear_iran.27.d: "이란은 다시 한번 문명국가가 아닌 불량 국가처럼 행동하기 시작했습니다. 우리는 제재에 대한 입장을 재고해야 합니다."
 nuclear_iran.27.a: "자초한 일이다"
 nuclear_iran.28.t: "질서를 따르는 이란"
 nuclear_iran.28.d: "전형적인 이란 정책을 완전히 180도 바꾸어, 이란은 더 평화롭고 통제된 방향으로 나아가고 있는 것으로 보입니다."
 nuclear_iran.28.a: "좋다, 이제 제재를 완화할 수도 있겠다"
 nuclear_iran.29.t: "제재를 해제한 미국!"
 nuclear_iran.29.d: "마침내 그날이 왔습니다. [USA.GetLeader] 대통령은 우리나라에 대한 모든 경제 제재를 해제하겠다고 발표했습니다. 오래도록 기다려 온 날이며, 우리의 꿈이 마침내 이루어졌습니다. 이제 우리의 차이를 접어두고 미국과 화해할 때입니다."
 nuclear_iran.29.a: "위대한 날이다"
