 tooltip_remove_productivity_from_state: "§W이 주의 생산성이 §R$PRODUCTIVITY_AMOUNT$§!포인트 §R감소§!합니다.\n §!"
 UKR_develop_t64_strazh_desc: "§WBMPT '스트라시'는 T-64 전차 차체를 기반으로 개발된 우크라이나의 시험용 전차 지원 차량이었습니다.\n이 사업은 지토미르 장갑차 공장, 키이우 장갑차 공장, 아르템 국영 지주회사가 공동으로 개발하여 2017년에 공개되었습니다.\n기존 T-64 포탑은 우크라이나제 '듀플레트' 원격 조종 전투 모듈로 교체되어, 이 차량은 원래 전차와는 완전히 다른 역할을 맡게 되었습니다.\n이 사업은 기존 T-64 차체와 우크라이나가 개발한 전투 장비를 활용하면서 강력하게 방호된 화력 지원을 제공하는 것을 목표로 했습니다.\n'스트라시'는 시험 사업으로 남았고 대량 생산에는 채택되지 않았습니다. §G하지만 우리는 그것을 바꿀 수 있지 않겠습니까?§!§!"
 UKR_develop_t72amt_desc: "§WT-72AMT는 키이우 장갑차 공장이 우크라이나군을 위해 개발한 T-72A의 우크라이나식 현대화형이었습니다.\n이 현대화는 V-84-1 엔진, 개량된 야간 투시 장비, 1K13 조준경, 우크라이나제 '니즈' 반응 장갑 체계를 도입했습니다.\n이 전차는 또한 현대식 통신 장비와 SN-3003 '바잘트' 항법 체계를 받았으며, 주행 장치의 일부 요소는 T-80용으로 개발된 부품을 사용하여 개량되었습니다.\n1K13 조준경 덕분에 현대화된 전차는 '콤바트' 유도 무기 체계를 운용할 수 있었습니다.\nT-72AMT는 기존 T-72 전차를 현대 우크라이나의 작전 요구에 더 가깝게 맞추는 비교적 경제적인 방법으로 의도되었습니다.§!"
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_rokach_for_tooltip\n\n\n\n\n\n\n\n\n§WZSU-23-4M-A1 '로카흐'는 소련제 ZSU-23-4 '실카' 자주 대공포를 우크라이나가 현대화한 모델입니다.\n이번 현대화로 구식 사격 통제 및 관측 장비가 최신 디지털 체계로 교체되어, 공중 표적의 탐지 및 추적 능력이 향상되었습니다.\n이 체계는 4문의 23mm 기관포를 유지하면서 개선된 전자 장비와 4발의 단거리 대공 미사일을 추가로 받습니다.\n이러한 변화로 ZSU-23-4의 저공비행 표적에 대한 전투 효율이 크게 향상됩니다.§!"
 UKR_modernize_s125_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_2d1_for_tooltip\n\n\n\n\n\n\n\n\n§WS-125-2D는 소련제 S-125 지대공 미사일 체계를 우크라이나가 현대화한 모델입니다.\n이번 현대화는 구식 전자 부품을 교체하고 전자전 및 현대적 대응 수단에 대한 체계의 저항력을 높이는 것을 목적으로 합니다.\n레이더와 유도 장비가 개량되며, 공중 표적을 탐지·추적·요격하는 능력도 향상됩니다.\n이번 현대화는 S-125의 운용 수명을 연장하는 동시에 현대 전장에서의 효율을 높이는 것을 목표로 합니다.§!"
 UKR_modernize_s125m_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_m1_for_tooltip\n\n\n\n\n\n\n\n\n§WS-125M은 소련제 S-125 '페초라' 방공 체계의 운용 수명과 성능을 연장·향상하기 위한 우크라이나의 현대화 계획이었습니다.\n이 계획은 KB 루치와 라디오닉스를 비롯한 우크라이나 방위산업체들이 수행했으며, 미사일과 체계의 유도 및 사격 통제 장비를 현대화하는 데 중점을 두었습니다.\n현대화에는 개량된 5V27D 미사일과 FCR-125 레이더 체계가 포함되어 원래의 소련 시대 장비의 주요 부분을 대체했습니다.\nS-125M 계획은 우크라이나가 완전히 새로운 방공 체계를 개발하지 않고도 기존 S-125 체계의 사용 수명을 크게 늘릴 수 있는 방안을 제공했습니다.§!"
 UKR_modernize_kvadrat_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_kvadrat_2l_for_tooltip\n\n\n\n\n\n\n\n\n§W2K12M1-2L '크바드라트-2L'은 소련제 2K12M1 '쿠프' 지대공 미사일 체계를 우크라이나가 현대화한 모델입니다.\n이번 현대화로 다수의 구식 전자 부품이 우크라이나산 현대 장비로 교체됩니다.\n레이더와 사격 통제 능력이 개선되어 공중 표적을 탐지·추적·요격하는 능력이 높아집니다.\n이번 현대화는 남아 있는 2K12M1 체계의 사용 수명을 연장하는 동시에 현대적 위협에 대한 효율을 높이는 것을 목표로 합니다.§!"
 UKR_develop_t38_stylet_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_t38_for_tooltip\n\n\n\n\n\n\n\n\n§WT-38 '스틸레트'는 아르세날 공장이 벨라루스 파트너들과 함께 개발한 우크라이나의 단거리 지대공 미사일 체계입니다.\n이 체계는 T382 미사일을 사용하며 항공기, 헬리콥터, 순항미사일 및 기타 저공비행 공중 표적을 요격하도록 설계되었습니다.\n이 복합 체계는 궤도식 차체에 탑재되어 높은 기동성과 기계화 부대와 함께 작전할 수 있는 능력을 갖추고 있습니다.\nT-38의 개발로 우크라이나는 노후화된 소련제 단거리 오사 체계를 대체할 현대적인 장비를 얻게 됩니다.§!"
 UKR_modernize_rk10_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_ryf_for_tooltip\n\n\n\n\n\n\n\n\n§WRK-10은 소련 시대 단거리 방공 체계가 사용하던 노후 미사일의 대안으로 개발된 우크라이나의 대공 유도 미사일입니다.\nRK-10을 스트렐라-10 체계에 통합하면 기존 차량과 발사기 기반 시설을 유지한 채 발사기에서 더 새로운 미사일을 사용할 수 있게 됩니다.\n새 미사일은 향상된 요격 능력을 제공하며, 점차 구식이 되어 가는 소련제 탄약에 의존하지 않고도 체계를 계속 운용할 수 있게 합니다.\n이 현대화는 스트렐라-10 보유 전력의 사용 수명을 연장하는 동시에 전투 효율을 높일 것입니다.§!"
 UKR_develop_kentavr_spaa_desc: "§WZRAK '켄타우르'는 이전의 '페레아치' 사업을 한 단계 발전시켜 개발한 신형 자주 대공 체계에 대한 우크라이나의 구상이었습니다.\n이 사업은 57mm 대공포에 기반한 이전 구상을 대체하여 쌍열 40mm 자동포 2문을 중심으로 재설계되었으며, 미사일 요소와 전용 사격 통제 장비는 유지되었습니다.\n'켄타우르' 구상은 레이더 기반의 표적 탐지와 광전자 사격 통제 체계를 결합하여, 차량이 포와 미사일 무장을 모두 사용해 공중 표적을 요격할 수 있도록 의도되었습니다.\n이 체계는 하르키우 모로조프 설계국이 '몰로트'/'복서' 개발 사업의 일환으로 개발한 우크라이나 차세대 전차 플랫폼에서 파생한 궤도식 차체를 중심으로 계획되었습니다.§!"
 UKR_modernize_planes_category: "우리 전투기 현대화"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\n공군이 사용하는 소련 시대의 항공기와 헬리콥터를 개량하기 위한 연구와 시험에 시간과 자금을 투입할 수 있습니다. 시간이 지나 경험이 쌓이면 독자적인 국산 설계를 시도해 볼 수도 있을 것입니다."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1_for_tooltip\n\n\n\n\n\n\n\n\n§WSu-25M1은 §R소련제§! §YSu-25§! 근접항공지원기를 우크라이나가 현대화한 모델입니다.\n이번 현대화는 기존 기체와 무장 능력은 유지한 채 항법, 통신 및 표적 지시 장비를 개선합니다.\n개량된 체계는 무유도 무기의 정확도를 높이고 항공기가 현대적 전투 환경에서 더 효과적으로 작전할 수 있게 합니다.\n이번 현대화는 §Y우크라이나§!의 §YSu-25§! 보유 전력의 운용 수명도 연장합니다.\n------------------\n이 결정은 §YSu-25M1K§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§W§YSu-27-1M§!은 §R소련제§! §YSu-27§! 전투기를 우크라이나가 현대화한 모델입니다.\n이 계획은 항공기의 전투 효율을 높이기 위해 개선된 항법, 통신, 식별 및 기내 전자 체계를 도입합니다.\n개량된 항공 전자 장비는 더 나은 상황 인식을 제공하고 항공기가 현대적 무기를 운용하는 능력을 향상시킵니다.\n이번 현대화로 §YSu-27§!은 §R소련§! 시대 원래 장비가 가졌던 한계를 줄인 채 계속 복무할 수 있습니다.\n------------------\n이 결정은 §YAn-BFV§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu2_for_tooltip\n\n\n\n\n\n\n\n\n§W§YMiG-29MU2§!는 §L리비우 국립 항공기 수리 공장§!이 개발한, §R소련제§! §YMiG-29§! 전투기의 우크라이나식 현대화 모델입니다.\n이 현대화는 앞선 §YMU1§! 계획을 바탕으로 항공기의 항공 전자 장비, 항법 및 표적 지시 체계를 더욱 광범위하게 개량합니다.\n항공기는 공중 및 지상 표적 모두에 대해 현대적인 유도 및 무유도 무기를 운용하는 능력이 향상됩니다.\n§YMU2§! 계획은 §YMiG-29§!를 더 뛰어난 다목적 전투기로 탈바꿈시키는 것을 목표로 합니다.§!"
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu1_for_tooltip\n\n\n\n\n\n\n\n\n§W§YMiG-29MU1§!은 §R소련제§! §YMiG-29§! 전투기를 우크라이나가 현대화한 모델입니다.\n이 계획은 개선된 항공 전자 장비와 현대화된 레이더 경보 및 항법 체계를 도입합니다.\n개량된 장비는 조종사의 상황 인식을 높이고 항공기가 현대적 전투 환경에서 더 효과적으로 작전할 수 있게 합니다.\n§YMU1§! 현대화는 §YMiG-29§!의 더 광범위한 개량으로 나아가는 중간 단계의 역할도 합니다.\n------------------\n이 결정은 §YMiG-29MU2§! 결정의 §R선행 조건§!입니다. 이 결정을 §R건너뛰면§! 해당 결정을 완료할 기회를 §R잃게§! 됩니다.§!"
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\n§W제안된 §L안토노프 설계국§!의 다목적 전투기는 §Y우크라이나§!가 독자 설계한 전투기를 개발하려는 구상 단계의 사업이었습니다.\n이 사업은 항공기 설계 및 생산에서 쌓은 우크라이나의 경험을 활용해 외국 설계에 전적으로 의존하지 않고 현대적인 전투기를 만들려는 것이었습니다.\n이 항공기는 §Y우크라이나§! 항공 산업의 역량에 맞게 조정되면서도 현대적인 항공 전자 장비, 무장, 공기역학적 해법을 도입할 예정이었습니다.\n사업은 제안 단계에 머물렀지만, 이를 개발하면 미래 세대 우크라이나 전투기의 토대를 마련할 수 있을 것입니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다.§!"
 UKR_develop_bm21_k_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bm21k_for_tooltip\n\n\n\n\n\n\n\n\n§WBM-21K는 소련제 BM-21 '그라드' 다연장 로켓 체계의 우크라이나식 현대화형입니다.\n이 체계는 현대식 우크라이나제 크라즈 트럭 차체에 탑재되며 개량된 항법, 통신, 사격 통제 장비를 받습니다.\n이 현대화는 체계의 기동성을 높이고 승무원이 사격 임무를 더 효율적으로 준비하고 수행할 수 있게 합니다.\nBM-21K는 우크라이나가 보유한 방대한 소련 시대 그라드 발사기 전력을 현대화하는 비교적 저렴한 방법을 제공합니다.§!"
 UKR_develop_bastion03_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\n§W'바스티온-03'은 셰페티우카 수리공장이 소련제 BM-27 '우라간'의 현대화형으로 개발한 우크라이나제 다연장 로켓 체계입니다.\n이 체계는 현대식 트럭 차체를 기반으로 합니다.\n이 현대화는 기동성을 높이고 발사기 사격 준비에 필요한 시간을 줄입니다.\n바스티온-03을 통해 우크라이나는 노후화된 소련 시대 차체를 교체하면서도 기존 220mm 로켓을 계속 사용할 수 있습니다.§!"
 UKR_develop_Vilkha_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_vilkha_for_tooltip\n\n\n\n\n\n\n\n\n§W'빌하'는 루치 설계국이 소련제 BM-30 '스메르치'에서 발전시켜 개발한 우크라이나제 다연장로켓발사시스템입니다.\n이 사업은 기존의 무유도 로켓을 우크라이나제 유도 체계를 갖춘 신형 유도 미사일로 대체합니다.\n이 체계는 중형 다연장 로켓의 높은 파괴력과 사거리를 유지하면서 정확도를 크게 향상시키도록 설계되었습니다.\n빌하의 개발은 소련 시대의 무유도 로켓 포병에서 현대적인 정밀 타격 능력으로의 전환을 나타냅니다.§!"
 UKR_develop_bureviy_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bureviy_for_tooltip\n\n\n\n\n\n\n\n\n§W'부레비'는 노후화된 BM-27 '우라간' 계열의 현대적 대체품으로 설계된 우크라이나제 다연장 로켓 체계입니다.\n이 체계는 현대식 타트라 T815-7T3R2T 차체에 탑재되며 디지털 사격 통제 및 항법 체계를 갖추고 있습니다.\n부레비는 기존 220mm 우라간 로켓뿐 아니라 우크라이나가 새로 개발한 탄약도 사용하도록 설계되었습니다.\n현대식 전자 장비, 향상된 기동성, 기존 탄약과의 호환성을 결합하여 이 체계는 우크라이나 로켓 포병의 실용적인 현대화가 됩니다.§!"
 UKR_modernize_mi24pu1_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu1_for_tooltip\n\n\n\n\n\n\n\n\n§WMi-24PU-1은 코노톱 항공기 수리공장 '아비아콘'이 우크라이나 방위 산업 기업들과 함께 개발한 Mi-24P의 우크라이나식 현대화형입니다.\n이 헬리콥터는 모터 시치의 더 강력한 TV3-117VMA-SBM1V-02 엔진, 현대화된 항전 및 항법 장비, 야간 투시 장비 운용 체계를 받았습니다.\n이 현대화에는 아드로스 KT-01AV 방호 체계, FPM-01KV 레이저 조준 체계, 개량된 ASP-17VPM-V 조준경도 포함되었습니다.\n이 사업에는 모터 시치, 아드론, TsKB 아르세날, 이줌 계기·장비 공장 등의 기업이 참여했으며, 후기 형식에는 우크라이나제 광전자 장비도 사용되었습니다.\n따라서 Mi-24PU-1은 기존 헬리콥터의 대대적인 정비에 우크라이나제 신형 엔진, 항전, 방호, 조준 체계를 결합한 것이었습니다.§!"
 UKR_develop_nota_desc: "§WObject 477A1 노타는 무인 포탑, 격리된 승무원실, 강력한 152mm 주포를 갖춘 우크라이나의 선진 시험용 주력 전차입니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다.§!"
 UKR_modernize_nota_desc: "§WObject 477A1 '노타'는 소련의 Object 477 '몰로트' 선진 주력 전차 사업을 우크라이나가 발전시킨 것입니다.\n이 설계는 두텁게 방호된 승무원실, 무인 전투실, 강력한 주무장을 갖추고 있습니다.\n이 현대화는 최신 전자 장비, 방호 체계 및 기타 구성품을 도입하면서 설계를 우크라이나 방위 산업이 이용할 수 있는 기술에 맞게 조정합니다.\n이 사업은 대량 생산에 이르지 못했으나, 추가 개발을 통해 우크라이나의 선진 주력 전차의 기반을 마련할 수 있습니다.§!"
 ukr_history.63.t: "율리야 티모셴코의 체포"
 ukr_history.63.d: "전직 연료·에너지 담당 부총리가 우크라이나 통합 에너지 체계 재직 시절의 가스 밀수와 문서 위조 혐의로 루키아니우카 교도소에 수감되었습니다. 그녀는 에너지 부문의 물물교환 방식에 맞서다 1월에 해임되었고, 몇 주 만에 사건이 개시되었습니다. 법원은 구금이 불법이라고 판결하고 42일 뒤 그녀를 석방할 것입니다. 그때쯤이면 그녀는 대통령과 불화를 빚은 장관이 아니라 그에 맞서는 야권의 얼굴이 되어 있을 것입니다."
 ukr_history.63.a: "그렇다면 어쩔 수 없다."
 UKR_reorganize_navy_finish_project_133: "해안 경비대용 §G2척의 §YProject 133§! 초계함§! 건조 완료"
 UKR_reorganize_navy_finish_project_133_desc: "\n\n\n\n\n\n£UKR_desctext_project_133_for_tooltip\n\n\n\n\n\n\n\n\n§W일부 예산을 배정하여 해안 경비대용 소련 설계 'Project 133' 초계함 §G2§!척의 장기화된 건조를 마침내 끝낼 수 있습니다.§!"
 UKR_reorganize_navy_finish_11451_construction_flag: " 완료된 사건: §Y'Project 11451' 초계함 2척 건조 완료§!"
 ukraine_reorganize_navy_finish_project_133.1.name: "해안 경비대용 'Project 133' 초계함 2척 건조 완료"
 ukraine_reorganize_navy_finish_project_133.1.desc: "우리는 해안 경비대용 'Project 133' 초계함 선체 2척, 'BG53 '폴리시아''와 BG54 '슬로보잔시나'를 점검하였으며, 이제 이들의 운명에 관한 결정을 어느 방향으로 진행할지 가장 적절한 쪽을 선택할 수 있습니다.\n\n자금을 더 투입하여 두 함정의 대규모 수리를 마치거나, 상태가 더 나쁜 BG54 '슬로보잔시나'를 해체하고 그 부품으로 BG53 '폴리시아'를 더 빨리 재건할 수 있습니다."
 ukraine_reorganize_navy_finish_project_133.1.a: "두 함정을 모두 완성한다"
 ukraine_reorganize_navy_finish_project_133.1.b: "'슬로보잔시나'의 부품을 떼어 '폴리시아'를 완성한다"
 ukr_economy_rate.1.t: "우크라이나 국립은행 기준금리를 1% 인하하다"
 ukr_economy_rate.1.d: "우크라이나 국립은행이 물가 상승세 둔화와 흐리우냐 안정을 이유로 기준금리를 인하했습니다. 상업은행들도 더 저렴한 대출 한도를 내놓을 것으로 예상되며, 1998년 이후 우크라이나를 포기했던 해외 자금이 조용히 시장으로 돌아오고 있습니다. 10년 동안 운전 자본에 굶주려 온 산업계는 마침내 이윤 전체를 잡아먹지 않는 금리로 자금을 빌릴 수 있을지도 모릅니다."
 ukr_economy_rate.1.a: "다소 저렴해진 자금"
