 BOS_post_yugoslav_war_state: "后南斯拉夫战争状态"
 BOS_post_yugoslav_war_state_desc: "波斯尼亚是上世纪90年代南斯拉夫战争期间成功宣布独立的四个共和国之一。在这四个共和国中，波斯尼亚遭受的苦难最为深重，成千上万的难民逃离家园。大片土地遍布地雷和未爆弹药。许多波斯尼亚公民如今生活在国外。这些事件使联合国蒙受了新的、令人不齿的声誉，被认为是一个无力或不愿保护身处险境者的组织。"
