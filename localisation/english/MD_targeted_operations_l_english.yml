l_english:
 TOP_game_rule: "Covert Action: Targeted Operations"
 TOP_rules_group: "Intelligence and Covert Action"
 TOP_limited_sandbox_option: "Limited Sandbox"
 TOP_limited_sandbox_option_desc: "Show and investigate all active registered public leaders, officials, people, and organizations. Militants are normally operationally eligible. State-security subjects require war or an authored mandate; political and civilian subjects require an authored mandate. Knowledge remains separate from authority. New campaigns only."
 TOP_full_sandbox_option: "Full Sandbox"
 TOP_full_sandbox_option_desc: "Permit every registered foreign person and organization to proceed through the full intelligence, access, authorization, preparation, assessment, attribution, succession, and consequence pipeline. Serving foreign civilian leaders are explicit assassination targets. Domestic political assassination remains unavailable outside authored emergencies. New campaigns only."
 TOP_disabled_option: "Off"
 TOP_disabled_option_desc: "Hide the Targeted Operations interface and disable its offensive workflow. Historical OEF, Iraq, ISIS, Soleimani, and other legacy content continues through its non-TOP fallbacks."
 TOP_dossiers_label: "Dossiers"
 TOP_authority_label: "Authorization"
 TOP_archive_label: "Archive"
 TOP_no_target: "Select a dossier"
 TOP_no_dossiers_body: "§YNo dossiers discovered§!\nPublic leaders, public officials, and public organizations appear as Cold dossiers from their authored activation dates. Nonpublic militant dossiers can be discovered through Counter-Terror intelligence, infiltration, liaison, or authored leads. A Counter-Terror slot is never required for public or state-security organizations."
 TOP_select_dossier_body: "§YSelect a dossier§!\nChoose a person or organization in the persistent left pane. Cold knowledge, package development, authority, preparation, physical truth, assessment, and archive history remain separate records."
 TOP_status_captured: "In Custody"
 TOP_status_dead: "Confirmed Dead"
 TOP_status_probable: "Probable Death. Assessment Pending"
 TOP_status_declined: "Partner Declined"
 TOP_status_unknown: "Unresolved"
 TOP_status_at_large: "At Large"
 TOP_status_wrong_location: "Target Not Present"
 TOP_status_partial: "Partial Success"
 TOP_status_compromised: "Operation Compromised"
 TOP_role_leader: "Organization Leader"
 TOP_role_successor: "Generated Successor"
 TOP_collect_label: "Collect Intelligence"
 TOP_stop_label: "Stop Collection"
 TOP_drone_label: "Remote Strike"
 TOP_capture_label: "Capture Raid"
 TOP_covert_label: "Covert Action"
 TOP_rendition_label: "Capture / Rendition"
 TOP_partner_label: "Partner Operation"
 TOP_sabotage_label: "Sabotage"
 TOP_novichok_label: "Novichok Operation"
 TOP_revoke_label: "Close / Revoke Case"
 TOP_release_label: "Release Prisoner"
 TOP_transfer_label: "Transfer Custody"
 TOP_refresh_label: "Refresh"
 TOP_open_tt: "Open the §YDossiers§!: our intelligence files on wanted people and organizations, and the steps from finding a target to acting against it."
 TOP_select_tt: "Select this person's dossier. Changing the displayed dossier does not change an authorized operation."
 TOP_collect_tt: "Start or resume focused collection for this developed package. Up to three person or organization packages may collect at once, including several in one host. The selected axis receives the full clamped gain and the other axes receive 25%. Only location focus refreshes lead age. No intelligence DLC is required."
 TOP_stop_tt: "Pause collection and free its slot while preserving the package and every intelligence axis. Location and pattern knowledge continue their normal decay."
 TOP_drone_tt: "Submit this exact person and believed state for review of a stand-off lethal strike. Native raids still enforce engine base, equipment, range, and DLC requirements at launch."
 TOP_capture_tt: "Submit a special-forces operation to capture this person alive. Native raids require trained special forces and suitable basing."
 TOP_covert_tt: "Submit a clandestine lethal operation against this exact person. In Full Sandbox this is an explicit assassination route for registered serving foreign civilian leaders. The immutable review retains all intelligence, access, attribution, civilian-harm, succession, and escalation consequences."
 TOP_rendition_tt: "Submit a capture and custody operation. Requires a foreign host and special-forces capability. Capture feasibility, sovereignty, and political authority are reviewed."
 TOP_partner_tt: "Request a cooperative partner capture. Only cooperative host posture permits this method, and the physical partner initially receives custody. Intelligence-only help returns the package with better intelligence and consumes no operational mandate."
 TOP_sabotage_tt: "Submit the selected organization objective for clandestine facility sabotage. Success causes repairable map damage or temporary resource disruption and replaces the organization's current 90-day disruption. It never removes a registered person."
 TOP_novichok_tt: "Russia only. Submit a clandestine prohibited-agent assassination using the existing Russian and decryption gates. It retains the normal enhanced leader thresholds, authority, access, assessment, attribution, and consequence pipeline."
 TOP_revoke_tt: "Stand down this exact review, waiting mandate, timed operation, or prepared TOP-native case. The package and dossier remain. Native map cancellation is not authoritative; use the TOP control so the operation slot and binding close safely."
 TOP_release_tt: "Release this prisoner to active-at-large status. Actionable location is cleared and person and organization pressure rise sharply. A released Iraq fugitive no longer counts as securely detained."
 TOP_transfer_tt: "Transfer custody to the recorded valid recipient. The global custodian and detention state change immediately; partner captures begin with the physical partner."
 TOP_refresh_tt: "Refresh the dossier and archive from the latest recorded intelligence."
 TOP_location_actionable: "Last credible lead: [?TOP_lead_state^TOP_selected.GetName]"
 TOP_location_region: "Probable host: [?TOP_lead_host^TOP_selected.GetName]. Exact state unconfirmed."
 TOP_dossier_body: "§Y[TOP_selected_name]§!\n[TOP_selected_group] | [TOP_selected_role]\n[TOP_selected_status] | [TOP_case_stage]\nIdentity [?TOP_identity_confidence^TOP_selected|0] | Location [?TOP_location_confidence^TOP_selected|0] | Pattern [?TOP_pattern_confidence^TOP_selected|0]\nLead age: [?TOP_lead_age^TOP_selected|0] days | [TOP_selected_location]\nAttempts: [?global.TOP_attempts^TOP_selected|0] | Custody: [TOP_selected_custody]\nIdentity is durable. Location decays by 5 and pattern by 3 every 28 days. At 57 days a lead is stale, but the Cold dossier and accumulated knowledge remain."
 TOP_authorization_body: "§Y[TOP_selected_name]§! | [TOP_case_stage]\n[TOP_selected_status] | [TOP_selected_location]\n[TOP_current_authority]\n[TOP_current_review]"
 TOP_archive_help: "§YOperations Archive§!\nThe most recent 128 immutable person and organization entries are retained. Each stores the stable subject, method or facility objective, state and host, frozen intelligence, age, access, posture, doctrine, rigor, physical result, assessment, attribution, harm, disposition, date, and sequence."
 TOP_row_intel: "I [?TOP_identity_confidence^v|0]  L [?TOP_location_confidence^v|0]  P [?TOP_pattern_confidence^v|0]\nLead [?TOP_lead_age^v|0]d ago"
 TOP_sovereignty_violation: "Unauthorized Covert Operation"
 TOP_crisis_settlement: "Negotiated Crisis Settlement"
 TOP_custody_none: "None known"
 TOP_custody_holder: "[?global.TOP_custodian^TOP_selected.GetName]"
 TOP_status_escaped: "Escaped"
 TOP_facility_industry: "Facility: Industry"
 TOP_facility_infrastructure: "Facility: Infrastructure"
 TOP_facility_resources: "Facility: Resources"
 TOP_facility_tt: "Cycle the facility type for a sabotage proposal. The facility and state are fixed when review begins. Industry and infrastructure suffer repairable damage; resource facilities lose 20% output for 60 days."
 TOP_resource_disruption: "Covert Resource Disruption"
 TOP_resource_disruption_desc: "Damage to extraction and processing facilities temporarily reduces this state's resource output."
 TOP_dossiers_tab_tt: "Browse our dossiers on people and organizations. §YActive§! dossiers have a designated case we are developing; §YCold§! ones have no open case. The list starts on Active, so switch it to Cold or All to find a new target."
 TOP_archive_tab_tt: "Inspect the immutable 128-row circular history, including later BDA and attribution updates."
 TOP_authority_none: "Standing mandate: None"
 TOP_authority_current: "[TOP_authorized_method_name] in [?TOP_authorized_state.GetName]\nAuthority remaining: [?TOP_view_case_days|0] days. Approval waits without consuming the single preparation/execution slot."
 TOP_review_none: "Pending review: None"
 TOP_review_current: "Review: [TOP_proposal_name], [TOP_current_review_stage]"
 TOP_review_staff_stage: "Staff assessment"
 TOP_review_sovereignty_stage: "Sovereignty decision"
 TOP_review_host_stage: "Awaiting host response"
 TOP_review_senior_stage: "Senior authorization"
 TOP_review_popup_stage: "Acknowledge the previous review dialog to begin another case."
 TOP_iraq_hunt_desc: "Eight senior Ba'athist fugitives are sought across Iraq and neighboring countries. Regional searches develop leads for their shared dossiers. Use the counterterrorism screen to review and authorize named operations. At least four distinct fugitives must be dead or securely detained within five years. Custody transfers retain credit; release before completion removes detention credit. Execution cannot count the same fugitive twice."
 TOP_soleimani_detained_name: "§RQasem Soleimani Detained§!"
 TOP_soleimani_disrupted_name: "§RIRGC Command Disrupted§!"
 TOP_designate_label: "Designate Case"
 TOP_designate_tt: "[TOP_designation_feedback]\nCreate this persistent person or organization package for 25 Political Power. Multiple packages may share a host. Knowledge does not grant operational authority. Defensive effects: collection -[?TOP_view_collection_penalty|0], operation success -[?TOP_view_protection_penalty|0], exposure +[?TOP_view_exposure_bonus|0] points."
 TOP_confirm_label: "Confirm Assessment"
 TOP_confirm_tt: "Acknowledge the recorded physical result or assessment and close this exact case. Confirmation never rerolls physical truth, changes subjects, changes methods, or grants another reward."
 TOP_cases_label: "Active Cases"
 TOP_cases_tt: "Show frozen reviews, waiting mandates, preparations, operations, and assessments. Subject cases are independent of host country."
 TOP_cases_body: "§YActive Person Cases: [?TOP_active_cases^num|0]§!\nSelected: [TOP_selected_name]\n[TOP_case_stage] | [TOP_selected_status]\n[TOP_selected_location]\nAny number of approved mandates may wait, while only one operation may prepare or execute at a time."
 TOP_case_designated: "Designated: [?TOP_view_case_days|0] days remaining"
 TOP_case_native: "Approved: prepare native raid"
 TOP_case_timed: "In progress: [?TOP_view_mission_days|0] days remaining"
 TOP_case_assessing: "Assessment pending"
 TOP_case_confirm: "Assessment ready: confirm to close"
 TOP_case_none: "No designated case"
 TOP_designation_country_locked: "This government is not eligible for offensive covert action. Eligible countries include NATO members, major powers, and the authored regional participants."
 TOP_designation_exists: "This person already has an active country case. Select Authorization to review it or confirm its completed assessment."
 TOP_designation_unavailable: "This person is no longer available for a new operation."
 TOP_designation_host_locked: "This legacy host-slot blocker is retired. Multiple person and organization packages may operate in the same host."
 TOP_designation_ready: "This person can be designated. Designation does not authorize an operation."
 TOP_designation_authority_locked: "The authored role, credible host, or exceptional authority requirement is not met. Serving political targets require war or an authored mandate; civilian political figures require the explicit mandate."
 TOP_civilian_mandate_conditions_tt: "Requires an eligible authoritarian government, War Support above 60%, Stability below 45%, and either a USA civil war or a foreign war against the USA. Charlie Kirk must be active in the authored civilian role, and the previous mandate review must have expired. Senior approval remains separate."
