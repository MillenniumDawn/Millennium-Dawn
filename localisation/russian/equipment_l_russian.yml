 SOV_util_vehicle_2: "УАЗ-469"
 SOV_util_vehicle_3: "УАЗ-3151"
 SOV_util_vehicle_4: "УАЗ-3132"
 SOV_util_vehicle_5: "Тигр"
 SOV_util_vehicle_6: "КамАЗ-53949"
 SOV_util_vehicle_7: "ВПК «Урал»"
 SYR_MBT_1: "Т-55"
 SYR_MBT_1_desc: "Т-54/55, пожалуй, самый массовый танк в мире. Разработанный и производившийся в первые годы холодной войны, он был воплощением мощи и основой Красной армии. Когда-то внушавший страх как символ русской мощи, он стал хрестоматийным образом ближневосточных бронетанковых войск, уничтожаемых американскими авиаударами."
 SYR_MBT_1_short: "Т-55"
 SYR_MBT_2: "Т-72"
 SYR_MBT_2_desc: "Т-72, пожалуй, самая успешная разработка, созданная Россией. Это была вершина советской военной мощи на завершающем этапе холодной войны, производившаяся тысячами и служащая основой российской армии даже сегодня. Хотя она стала печально известной из-за своих катастрофических неудач в конфликтах на Ближнем Востоке, Т-72 по-прежнему используется в качестве платформы для разработки будущих российских танков и постоянно подвергается модификациям и обновлениям, чтобы соответствовать стандартам современной войны. Не стоит недооценивать танк, который когда-то был копьём советских войск."
 SYR_MBT_2_short: "Т-72"
 SYR_MBT_3: "Т-72АВ"
 SYR_MBT_3_desc: "Модель с навесной динамической защитой «Контакт-1», установленной на лоб корпуса и башню."
 SYR_MBT_3_short: "Т-72АВ"
 SYR_MBT_4: "Т-90"
 SYR_MBT_4_desc: "Вооружен 3-х пушечной системой для максимальной огневой мощи и эффективности. С тремя 125-мм пушечными установками."
 SYR_MBT_4_short: "Т-90"
 SYR_MBT_5: "Т-14 «Армата»"
 SYR_MBT_5_desc: "Самый передовой боевой танк в российской армии с гладкими очертаниями и мощной 152-мм пушкой."
 SYR_MBT_5_short: "Т-14"
 SYR_MBT_7: "Т-99 «Чёрный орёл»"
 SYR_MBT_7_short: "Т-99 «Чёрный орёл»"
