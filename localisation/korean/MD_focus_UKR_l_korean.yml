 ukraine_reorganize_navy_choose_future_corvette.9.desc: "독자적인 입찰 절차의 결과, 우리는 Project 58250 '볼로디미르 벨리키' 급 초계함을 우리 함대의 최신 보강 전력으로 선정하였습니다.\n우리가 건조에 동의할 함정의 수를 선택합시다."
