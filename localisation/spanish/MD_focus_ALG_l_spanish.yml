 ALG_maintaining_kabyle_relations: "Automatizando la mejora de relaciones cabilas"
 ALG_maintain_kabyle_relations: "Mantener las relaciones cabilas"
 ALG_maintain_kabyle_relations_desc: "Un acercamiento de bajo esfuerzo hacia las comunidades cabilas para evitar que su satisfacción se erosione. Cuesta poder político, pero evita las duras penalizaciones por fracaso de las reformas más grandes."
 ALG_maintain_kabyle_relations_tt: "§GSatisfacción cabila:§! +5\n§YEstabilidad:§! +2.0%\nTiempo de recarga: 90 días."
 AlgeriaFocusNews.100.t: "Iniciativa de Casablanca: Cortejar a las grandes potencias"
 AlgeriaFocusNews.100.d: "Argelia ha optado por cortejar a las principales potencias para respaldar su Iniciativa de Casablanca. Esto es costoso, pero eleva las probabilidades de obtener un resultado contundente en la UA."
 AlgeriaFocusNews.101.t: "Iniciativa de Casablanca: Enfoque regional"
 AlgeriaFocusNews.101.d: "Argelia sigue una vía diplomática exclusivamente regional, apoyándose en los Estados vecinos y en los aliados de la Unión Africana."
 AlgeriaFocusNews.102.t: "Iniciativa de Casablanca: Estrategia mixta"
 AlgeriaFocusNews.102.d: "Argelia combinará los esfuerzos regionales e internacionales para incrementar la presión al tiempo que se cubre ante posibles riesgos."
 AlgeriaFocusNews.103.t: "Iniciativa de Casablanca: Éxito rotundo"
 AlgeriaFocusNews.103.d: "La Iniciativa de Casablanca logró un resultado decisivo en el proceso de la UA y la ONU. La presión diplomática cuenta con un impulso real; Argelia está en una posición fuerte para presionar a Marruecos a fin de que abandone sus reclamaciones diplomáticas (y, bajo tu enfoque, eliminar sus estados legítimos o cores)."
 AlgeriaFocusNews.104.t: "Iniciativa de Casablanca: Éxito moderado"
 AlgeriaFocusNews.104.d: "La Iniciativa de Casablanca produjo un resultado diplomático significativo. La presión sobre Marruecos ha aumentado; la UA se muestra receptiva pero no es decisiva."
 AlgeriaFocusNews.105.t: "Iniciativa de Casablanca: Resultado modesto"
 AlgeriaFocusNews.105.d: "La Iniciativa de Casablanca solo despertó una modesta simpatía en la UA. Necesitarás trabajar más para forzar concesiones de gran importancia."
 AlgeriaFocusNews.106.t: "Iniciativa de Casablanca: Misión expirada"
 AlgeriaFocusNews.106.d: "El tiempo ha transcurrido sin un resultado sustancial. El impulso diplomático se ha perdido."
