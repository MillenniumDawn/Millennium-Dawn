 BRI_PROJECT_VEN_PIPELINE_1: "베네수엘라-중국 석유 스왑 송유관 개량"
 BRI_PROJECT_ZAM_MINE_1: "참비시 구리 광산 및 제련소"
 BRI_PROJECT_ZAM_SEZ_1: "루사카-참비시 복합 시설 경제특구"
 CHI_bri_africa_engagement_desc: "아프리카에 대한 일대일로 관여 점수의 누적치입니다. 아프리카 대륙 통합 정점 중점을 해금하려면 중국-아프리카협력포럼(FOCAC) 완료 건수와 함께 필요합니다."
 CHI_bri_centralasia_engagement_desc: "중앙아시아에 대한 일대일로 관여 점수의 누적치입니다. 실크로드 경제벨트 회랑 보너스에 반영됩니다."
 CHI_bri_defaulted_projects_desc: "수혜국이 대출 조건을 이행하지 못한 프로젝트의 수입니다. 부채 재조정과 자산 압류 중 하나를 선택하는 계기가 됩니다."
 CHI_bri_europe_engagement_desc: "유럽에 대한 일대일로 관여 점수의 누적치입니다. 17+1 체제를 유지하고 후반부 유럽 연결성 보너스를 해금하는 데 필요합니다."
 CHI_bri_latam_engagement_desc: "중남미에 대한 일대일로 관여 점수의 누적치입니다. 베네수엘라, 에콰도르, 브라질, 아르헨티나, 볼리비아에서 인프라 프로젝트를 완료하면 해금됩니다."
 CHI_bri_meast_engagement_desc: "중동에 대한 일대일로 관여 점수의 누적치입니다. 페트로위안 결제 채택률에 반영됩니다."
 CHI_bri_monthly_income_desc: "수익 배율을 적용하기 전, 진행 중인 일대일로 프로젝트가 창출하는 월간 위안화 수입입니다."
 CHI_bri_pacific_engagement_desc: "태평양 도서국에 대한 중국의 관여입니다. 외교적 승인, 어업 및 해저 양허권, 안보 양해 등이 포함됩니다."
 CHI_bri_predatory_score_desc: "부채 레버리지와 자산 압류 전술을 얼마나 공격적으로 추구했는지를 나타냅니다. 값이 높으면 함반토타 독트린 경로가 해금되고 채무 불이행이 압류로 이어질 기회가 늘어납니다."
 CHI_bri_project_slots_desc: "중국이 동시에 관리할 수 있는 일대일로 프로젝트의 최대 수"
 CHI_bri_returns_multiplier_desc: "프로젝트 수익 흐름에 적용되는 배율입니다. 활성 IC 서기와 특정 중점 완료로 증가합니다."
 CHI_bri_seasia_engagement_desc: "동남아시아에 대한 일대일로 관여 점수의 누적치입니다. 란창-메콩 협력 결정의 사용 가능 여부에 영향을 줍니다."
 CHI_bri_southasia_engagement_desc: "남아시아에 대한 일대일로 관여 점수의 누적치입니다. 남아시아 파트너의 등급 상승 속도와 보너스 규모에 영향을 줍니다."
 CHI_bri_winwin_score_desc: "양허성 및 개선된 대출 조건을 얼마나 일관되게 적용했는지를 나타냅니다. 값이 높으면 부채 재조정 외교가 해금되고 수혜국의 호의가 향상됩니다."
 CHI_Buffer_State_Doctrine: "완충국 독트린"
 CHI_Buffer_State_Doctrine_desc: "북한은 우리와 한국 내 미국 동맹 세력 사이의 전략적 완충지대 역할을 합니다. 이 역할을 강화함으로써 평양이 확고히 우리의 세력권 안에 남도록 하고, 어떤 적대 세력도 우리 국경에 진출하지 못하도록 보장합니다."
 CHI_chinese_aggression_display: "$CHI_chinese_aggression$: [?CHI_chinese_aggression]"
 CHI_collective_leadership_active_desc: "한 탁자에 둘러앉은 일곱 사람. 총노선이란 그 일곱 사람이 총노선이라 부르기로 합의한 것입니다."
 CHI_Dandong_Lifeline: "단둥의 생명선"
 CHI_Dandong_Lifeline_desc: "단둥은 북한 대외 무역의 압도적 대부분을 처리하며, 그 흐름은 우리의 조건에 따라 움직입니다. 이 통로를 복원하고 확장하면 평양에 경제적 산소를 공급하는 동시에 정권에 대한 우리의 영향력을 굳힐 수 있습니다."
 CHI_Enforce_Sanctions_Compliance: "제재 준수 이행"
 CHI_Enforce_Sanctions_Compliance_desc: "북한에 대한 국제 제재를 실제로 이행함으로써 우리는 핵 비확산에 대한 의지를 보이고 미국과 일본의 호의를 얻습니다. 평양은 불쾌해하겠지만 국제 사회에서 우리의 위상은 높아질 것입니다."
 CHI_focus_tree: "중국 중점 트리"
 CHI_Fortress_of_the_East: "동방의 요새"
 CHI_Fortress_of_the_East_desc: "북한을 뚫을 수 없는 완충국으로 만드는 것은 우리의 전략적 종심에 도움이 됩니다. 우리는 평양을 공격하려는 자들에게 엄청난 대가를 치르게 하는 총력 군사 준비 태세 독트린을 뒷받침합니다."
