 md_negative_expected_social_spending: "§RNiedobór wydatków socjalnych §!"
 md_negative_expected_healthcare_spending: "§RNiedobór wydatków na opiekę zdrowotną §!"
 md_negative_expected_administrative_spending: "§RNiedobór wydatków administracyjnych §!"
 md_negative_expected_education_spending: "§RNiedobór wydatków na edukację §!"
 md_negative_expected_police_spending: "§RNiedobór wydatków na policję §!"
