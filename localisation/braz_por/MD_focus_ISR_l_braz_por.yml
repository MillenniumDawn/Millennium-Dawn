 security_belt: "Cinturão de Segurança"
 security_belt_desc: "Nossas forças estão no sul do Líbano há muito tempo. A resistência das facções libanesas e o descontentamento público com nossa intervenção nos deixam pouca margem de ação.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §Y$ISR_withdraw_from_the_security_belt$§!. Ele §RPiorará§! e se tornará um espírito de ocupação permanente se concluirmos, em vez disso, o foco §Y$ISR_not_withdraw_from_the_security_belt$§!."
 security_belt2: "Cinturão de Segurança"
 security_belt2_desc: "Nossas forças estão no sul do Líbano há muito tempo. Nosso Governo decidiu manter as tropas no Sul do Líbano."
 law_of_return: "§GLei do Retorno§! - §YIncorporada§!"
 law_of_return_desc: "Nosso Estado, na raiz de sua ideia, é o Estado-nação de todos os judeus. Com base nisso, judeus do mundo inteiro são constantemente repatriados para sua pátria. No entanto, a polarização de opiniões e as diferentes origens dos recém-chegados tornam impossível criar um sistema político mono-ideológico.\n§W--------------§!\nEste espírito nacional será §RRemovido§! e substituído por um direito geral de retorno se concluirmos o foco §Y$ISR_return_refugees$§!."
 right_of_return: "§GLei do Retorno§! - §OPalestinos e Judeus§!"
 right_of_return_desc: "Nosso Estado, na raiz de sua ideia, é o Estado-nação de todos os judeus. Com base nisso, judeus do mundo inteiro são constantemente repatriados para sua pátria. No entanto, a polarização de opiniões e as diferentes origens dos recém-chegados tornam impossível criar um sistema político mono-ideológico. Agora, permitimos que todos os refugiados palestinos retornem para casa."
