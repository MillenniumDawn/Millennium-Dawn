 SYR_MBT_1: "T-55"
 SYR_MBT_1_desc: "T-54/55는 아마도 세계에서 가장 많이 생산된 전차일 것입니다. 냉전 초기에 설계되고 생산되었으며, 그것은 붉은 군대의 힘이자 중추였습니다. 한때 러시아 세력의 상징으로 여겨졌던 이 기갑부대는 미국의 공습으로 파괴되는 중동 기갑부대의 상징이 되었습니다."
 SYR_MBT_1_short: "T-55"
 SYR_MBT_2: "T-72"
 SYR_MBT_2_desc: "T-72는 아마도 러시아가 생산한 가장 성공적인 디자인일 것입니다. 그것은 냉전 말기 소련군의 정점이었고, 수천 대가 생산되었으며, 오늘날까지도 러시아군의 중추 역할을 하고 있습니다. 비록 중동 분쟁에서 치명적인 실패로 악명이 높았지만, T-72는 미래의 러시아 전차 설계를 위한 개발 플랫폼으로 여전히 사용되고 있으며 오늘날 현대전의 기준에 부합하도록 끊임없는 수정과 업그레이드가 이루어졌습니다. 한때 소련군의 창이었던 전차를 과소평가하지 마십시오."
 SYR_MBT_2_short: "T-72"
 SYR_MBT_3: "T-72AV"
 SYR_MBT_3_desc: "Kontakt-1 폭발 반응성 장갑이 선체 전면과 포탑에 장착된 모델입니다."
 SYR_MBT_3_short: "T-72AV"
 SYR_MBT_4: "T-90"
 SYR_MBT_4_desc: "최대 화력 및 효율성을 위해 3개의 대포 시스템으로 무장합니다. 125mm 대포 발사대 3개가 있습니다"
 SYR_MBT_4_short: "T-90"
 SYR_MBT_5: "T-14 아르마타"
 SYR_MBT_5_desc: "러시아 육군에서 가장 발전된 전차이며 선명한 윤곽과 강력한 152mm 대포로 무장하고 있습니다."
 SYR_MBT_5_short: "T-14"
 SYR_MBT_7: "T-99 블랙이글"
 SYR_MBT_7_short: "T-99 블랙이글"
 SYR_MBT_8: "T-35"
 SYR_MBT_8_short: "T-35"
 SYR_IFV_1: "BMP-1"
 SYR_IFV_1_desc: "BMP-1는 소련의 수륙양용 보병 전투 차량(IFV)입니다. 소비에트-아프가니스탄 전쟁에서 병력을 수송하면서 지하드 주의자들과 싸웠습니다. 73mm 2A28 포와 대전차 유도 미사일(ATGM)을 사용합니다."
 SYR_IFV_1_short: "BMP-1"
 SYR_IFV_2: "BMP-2"
 SYR_IFV_2_desc: "BMP-2는 지하드 주의자들이 가장 두려워 하던 차량으로 30mm 캐논과 캐터필러를 가져 굉장히 빠르고 효율적입니다."
 SYR_IFV_2_short: "BMP-2"
 SYR_IFV_3: "BMP-2M"
 SYR_IFV_3_short: "BMP-2M"
 SYR_IFV_4: "BMP-3"
 SYR_IFV_4_desc: "BMP-3는 소련의 보병 전투 차량으로, BMP-1과 BMP-2의 뒤를 잇습니다. 중고폭탄 탄환을 사용하는 100mm 대포를 탑재했습니다."
 SYR_IFV_4_short: "BMP-3"
 SYR_IFV_5: "BMP-3M"
 SYR_IFV_5_desc: "BMP-3M은 소련의 보병전투차량으로, BMP-1과 BMP-2의 후속기종이며 3의 변형기종입니다. 업그레이드된 대포와 엔진을 사용합니다."
 SYR_IFV_5_short: "BMP-3M"
 SYR_IFV_6: "T-15 아르마타"
