 ukraine_equipment_develop_domestic_atgm.10.name: "Предложение «Скифа»: [From.GetName]"
 ukraine_equipment_develop_domestic_atgm.10.desc: "§Y[From.GetNameWithFlag]§! предлагает нам свои противотанковые управляемые ракеты §Y«Скиф»§!. Мы можем решить, насколько большой будет первая партия и стоит ли покупать лицензию на собственное производство."
