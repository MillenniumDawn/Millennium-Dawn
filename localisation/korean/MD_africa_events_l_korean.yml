l_korean:
 CDI_victor_of_the_ivory_coast_war: "제 1차 [CDI.GetName] 전쟁의 승리자"
 HAI_demands_french_reparations: "§Y[HAI.GetNameWithFlag]§!배상 요구"
 HAI_ignores_amiot: "[HAI.GetNameWithFlag]이(가) 아미오 메타예의 생존을 용인함"
 FRA_intervening_in_haiti: "프랑스가 아이티에 개입하기로 결정했습니다."
 JUB_the_butcher: "도살자"
 MAL_attended_the_maouloud_festival: "마울리드 축제에 참여한다."
 AFRICA_idea_tuareg_rebellion: "투아레그족"
 AFRICA_idea_tuareg_rebellion_desc: "투아레그 민족은 우리나라에 대해 공개적으로 반란을 일으켰습니다. 사하라 사막과 접해 있는 자원 지역들이 특히 투아레그와 정부 간의 전투로 큰 영향을 받고 있습니다."
 kamajors: "카마조르"
 kamajors_desc: "카마조르는 시에라리온 내전 동안 활동한 멘데 민병대였습니다. 이 그룹은 원래 RUF 반군으로부터 마을을 보호하기 위해 민병대로 결성되었으나, 정부 군인들의 약탈을 막기 위해 정부 군과도 싸운 것으로 알려져 있습니다"
 blood_diamond_trade: "피의 다이아몬드 무역"
 blood_diamond_trade_desc: "정부군과 반군 그룹의 주요 수입원은 다이아몬드입니다. 이는 나라에서 유일하게 가치를 지닌 통화이기 때문입니다. 종종 노예 노동을 통해 채굴된 다이아몬드는 국경을 넘어 밀수되어 합법적으로 취득한 다이아몬드로 판매됩니다. 다이아몬드는 갈등을 계속 이어가는데만 사용되기 때문에, 지역 주민들은 그 부유함의 혜택을 누리지 못합니다."
 blood_diamond_trade_idea_TT: "추가 수입: $§G0.040§!"
 CAR_central_bush_republic_war_idea: "중앙아프리카 공화국 부시 전쟁"
 CAR_central_bush_republic_war_idea_desc: "\"중앙아프리카 공화국 부시 전쟁은 나라의 북부 지역에서 지역 군들 간에 벌어지는 저강도 충돌입니다. 이 갈등은 여러 그룹 간에 제한적으로 일어나며, 몇 개의 마을을 넘지 않았습니다. 전쟁은 여전히 지속되고 있지만, 그 범위는 제한적입니다.\""
 AFRICA_remove_the_cfa_franc: "CFA 프랑 제거"
 AFRICA_remove_the_cfa_franc_desc: "Our dependence on France has gone on for far too long. It is time we renounce the CFA Franc and lead our own future. The first step toward this goal is to develop our own currency and free ourselves from the burden of the French currency."
 ivory_coast_md.1.t: "선거 공약"
 ivory_coast_md.1.d: "On the 24 December 1999 former president Henri Konan Bédié was deposed in a military coup. Since then the Ivory Coast has been run by the National Public Salvation Committee, a military junta. Many Ivorians welcomed the coup, saying that they hoped the army would improve Ivory Coast's shaky economic and political circumstances, but now there is pressure for a return to civilian rule. The question is whether we should permit migrant workers, who make up most of the north's population, to stand for election."
 ivory_coast_md.1.o1: "자연화된 시민만 허용하라."
 ivory_coast_md.1.o2: "모든 이주민 후보를 허용하라."
 ivory_coast_md.1.o3: "군부 체제를 계속 유지하라."
 ivory_coast_md.2.t: "증폭되는 폭력"
 ivory_coast_md.2.d: "선거 이후 이주민 노동자와 현지인들 간에 상당한 갈등이 있었습니다. 이주민 후보들을 허용한 것이 도움이 되었을지도 모르지만, 해당 국가는 여전히 분명히 남부 정부에 의해 통치되고 있습니다."
 ivory_coast_md.2.o1: "우리는 기다리며 상황을 지켜보아야 한다"
 ivory_coast_md.3.t: "북부 지역에서의 시위"
 ivory_coast_md.3.d: "선거 이후, 북부 전역에서 여러 차례 시위가 격화되고 있습니다. 이주 노동자들은 자신들의 대표성 부족에 대해서 불만을 토로하고 있습니다."
 ivory_coast_md.3.o1: "무력으로 시위를 해산하기"
 ivory_coast_md.3.o2: "아마도 우리가 양보하는 것이 가장 좋을 것 같습니다."
 ivory_coast_md.4.t: "대규모 시위"
 ivory_coast_md.4.d: "코트디부아르 남부와 북부에서 각각 코트디부아르 인민전선과 애국운동이 주도하는 대규모 시위가 벌어지고 있습니다. 이들은 군부 독재 종식과 민간 통치 이양을 요구하고 있지만, 누가 이 나라를 통치해야 하는지에 대해선 이견이 있는 것 같습니다."
 ivory_coast_md.4.o1: "이건 받아들일 수 없다! 군대를 보내라!"
 ivory_coast_md.4.o2: "코트디부아르 인민 전선에 권력 이양"
 ivory_coast_md.5.t: "북부의 반란"
 ivory_coast_md.5.d: "시위는 격화되었고, 일부 군 부대가 이탈하여 북동부에서 경쟁 정부를 선포했습니다. 해당 군대들은 북부 대부분을 장악하고 있습니다. 그들은 지금까지 남부에 대한 침공 시도는 없었습니다."
 ivory_coast_md.5.o1: "반역자들에게 죽음을!"
 ivory_coast_md.5.o2: "아직은 때가 아니다."
 ivory_coast_md.5.o3: "The FNC is the Correct Option"
 ivory_coast_md.6.t: "북부의 반란"
 ivory_coast_md.6.d: "시위가 격화되면서 군부 일부가 이탈하여 대립 정부를 선포했습니다. 우리나라는 이제 내전의 소용돌이에 빠졌습니다. FNC는 불공정한 대우와 남부 정부에서의 발언권 부재 등 여러 이유를 들어 북부의 분리 독립을 선언했습니다. 형제자매가 서로에게 총을 겨누고 있으며, 모든 국민이 이제 점점 고조되는 갈등 속에서 한쪽 편을 선택해야 합니다. 제1차 코트디부아르 내전이 시작되었습니다."
 ivory_coast_md.6.o1: "음, 언젠가는 일어날 일이었다."
 ivory_coast_md.6.o2: "이슬람 방어 전선에 대한 죽음을! (프랑스 국민 연합가 되다)"
 ivory_coast_md.7.t: "새로운 내전"
 ivory_coast_md.7.d: "국내 시위가 우리의 통제를 훨씬 넘어서 격화되었습니다. 군부와 야당 일부가 북부와 남서부에서 각각 대립 정부를 선포하여 삼파전 내전의 길이 열렸습니다. 우리나라는 내전의 소용돌이에 빠졌습니다. 형제자매가 서로에게 총을 겨누고 있으며, 모든 국민이 이제 점점 고조되는 갈등 속에서 한쪽 편을 선택해야 합니다. 제1차 코트디부아르 내전이 시작되었습니다."
 ivory_coast_md.7.o1: "이것보단 더 나빠질수가 없겠어."
 ivory_coast_md.7.o2: "이슬람 방어 전선에 대한 죽음을! (프랑스 국민 연합가 되다)"
 ivory_coast_md.8.t: "정부의 시위 진압"
 ivory_coast_md.8.d: "코트디부아르 당국은 군의 지원과 경찰력의 노력으로 해당 지역의 시위를 대체로 성공적으로 진압했습니다. 시위대와의 상황은 여전히 불안정합니다. 우리의 강경한 시위 진압이 궁극적으로 추가적인 문제를 불러올지는 지켜봐야 하지만, 일단 지금은 시위가 멈췄습니다."
 ivory_coast_md.8.o1: "음, 아마 괜찮겠지..."
 ivory_coast_md.9.t: "폭력 사태 진정"
 ivory_coast_md.9.d: "광범위한 시위와 폭력 사태가 대부분 끝났습니다. 상황이 어느 정도 평상시로 돌아가고 있습니다."
 ivory_coast_md.9.o1: "일단은 끔찍한 사태를 가까스로 피한 것 같다."
 ivory_coast_md.10.t: "[CDI.GetAdjective]의 내전 종료"
 ivory_coast_md.10.d: "[CDI.GetNameDef]의 교전 세력들이 오늘 마침내 전투를 끝내고 무기를 내려놓았습니다. 내전이 마침내 종결되었으며, 작게나마 평화의 기운이 퍼지기 시작하고 있습니다. 제1차 코트디부아르 내전이 이제 끝났습니다. 부디 또 다른 내전이 일어나지 않기를 바랍니다."
 ivory_coast_md.10.o1: "전쟁이 종식되었다."
 ivory_coast_md.11.t: "2010년 선거"
 ivory_coast_md.11.d: "우리 국가는 2000년 로랑 그바그보가 권력을 잡은 이후 선거를 치르지 않았습니다. 격동의 첫 번째 아이보리 해안 내전은 선거 부족과 그바그보 지지자들과 FNC 및 야당 지지자들 사이의 긴장된 평화로 이어졌습니다. 이번 선거를 앞두고 그바그보가 그의 경쟁자인 알라산 와타라에게 뒤쳐지고 있다는 것은 분명합니다. 우리는 평화로운 권력 이양을 허용해야 할까요? 이번 선거 결과를 무효화할 때가 된 것일까요?"
 ivory_coast_md.11.o1: "알라산 우아타라의 승리"
 ivory_coast_md.11.o2: "선거 결과 무효화"
 ivory_coast_md.12.t: "부정 행위를 주장하는 알라산 우아타라"
 ivory_coast_md.12.d: "Alassane Ouattara and his party, the RDR, have claimed the elections have been tampered with and that Ouattara is the true winner of the election. The recount of the elections supports this claim. How should we proceed? We can declare ourselves the victor and take the oath of office or we can allow Ouattara to take power."
 ivory_coast_md.12.a: "우아타라가 권력을 잡도록 허용한다"
 ivory_coast_md.12.b: "취임 선서를 한다"
 ivory_coast_md.13.t: "친우아타라 시위"
 ivory_coast_md.13.d: "우리가 취임 선서를 하기로 한 결정이 특히 북부에서 광범위한 시위를 불러일으켰습니다. 선거 결과 조작에 항의하여 수천 명의 시민이 시위에 나섰습니다."
 ivory_coast_md.13.a: "시위를 진압한다"
 ivory_coast_md.13.b: "마음껏 떠들게 놔둔다"
 ivory_coast_md.14.t: "제2차 코트디부아르 내전"
 ivory_coast_md.14.d: "FNC가 우리나라를 상대로 공세를 개시하면서 제2차 코트디부아르 내전이 시작되었습니다. 원래 FNC에 반대하던 야당 인사들이 이제 이 나라에 진정한 민주주의를 세우려는 FNC의 노력을 지지하고 있습니다."
 ivory_coast_md.14.a: "반역자들을 진압한다"
 ivory_coast_md.14.b: "마음껏 떠들게 놔둔다"
 ivory_coast_md.15.t: "제2차 코트디부아르 내전의 승자"
 ivory_coast_md.15.d: "두 번째 아이보리 해안 내전은 제때 끝이 났습니다. 지역 내 군사력은 적극적인 충돌에서 평화유지 활동으로 전환되었고, 전투는 점차 잦아들고 있습니다. 사람들은 낮은 목소리로 이야기하고 있으며, 우리가 싸웠던 이전의 적들은 이미 국가를 떠났거나 현재 기다리고 있는 상황입니다. 그러나 우리는 새로운 날을 맞이하며 평화로운 정부로의 전환을 시작하고 있습니다. 우리의 시대에 평화가 있을 것이며, [CDI.GetLeader]가 우리를 앞으로 이끌 것입니다."
 ivory_coast_md.15.a: "승자가 전리품을 차지한다"
 ivory_coast_md.100.t: "코트디부아르에서의 혼란"
 ivory_coast_md.100.d: "코트디부아르에서 민주 개혁을 요구하는 시위가 경찰과 군에 의해 강제로 진압되었습니다. 상황은 여전히 긴장 상태입니다. 조치가 취해지지 않으면 코트디부아르는 곧 내전에 빠질 수 있습니다."
 ivory_coast_md.100.o1: "상황이 나아지기를 바란다."
 ivory_coast_md.100.o2: "상황이 나아지기를 바란다."
 ivory_coast_md.101.t: "코트디부아르 내전"
 ivory_coast_md.101.d: "Fueled by racial tensions between natives of the Ivory Coast and immigrants, who receive little political representation, a coalition calling themselves the New Forces have risen up against the government."
 ivory_coast_md.101.o1: "반역자들에게 죽음을!"
 ivory_coast_md.101.o2: "이슬람 방어 전선에 대한 죽음을!"
 ivory_coast_md.101.o3: "Intervene in support of the FNCI (nationalist)."
 ivory_coast_md.101.o4: "그들을 위해 기도하자."
 ivory_coast_md.101.o5: "불쾌한 추세다"
 ivory_coast_md.102.t: "코트디부아르 봉기"
 ivory_coast_md.102.d: "Fueled by racial tensions between natives of the Ivory Coast and immigrants, who receive little political representation, a coalition calling themselves the New Forces have risen and taken control of much of the north of the country. The southern government is yet to respond. It is unclear what will happen next."
 ivory_coast_md.102.o1: "음, 더 나빠질 수도 있었다..."
 ivory_coast_md.102.o2: "마침내 자유!"
 ivory_coast_md.102.o3: "FNCI(민족주의)를 지원한다."
 ivory_coast_md.102.o4: "그들을 위해 기도하자."
 ivory_coast_md.103.t: "코트디부아르 내전"
 ivory_coast_md.103.d: "코트디부아르 이부리안 인민전선이 수도 야무수크로에서 군사 정권에 대한 쿠데타를 시도했습니다. 그러나 정권은 이전에 도시를 탈출하여 반군이 국가의 동부 지역을 장악하게 되었습니다. 설상가상으로 북부에서 자신들을 신생 세력이라고 부르며 애국 운동을 이끄는 연합이 일어나 자신들을 정당한 정부라고 주장하고 있습니다."
 ivory_coast_md.103.o1: "반역자들에게 죽음을!"
 ivory_coast_md.103.o2: "군부를 타도하라!"
 ivory_coast_md.103.o3: "군사 정권을 지원한다."
 ivory_coast_md.103.o4: "FNCI(민족 포퓰리즘)를 지원한다."
 ivory_coast_md.103.o5: "그들을 위해 기도하자."
 ivory_coast_md.104.t: "End of the [CDI.GetAdjective] Civil War"
 ivory_coast_md.104.d: "Civil war in [CDI.GetNameDef] has concluded today as the warring factions have started to settle down."
 ivory_coast_md.104.o1: "반군이 패배했다."
 ivory_coast_md.104.o2: "정부가 승리했다."
 ivory_coast_md.104.o3: "드디어 평화가!"
 ivory_coast_md.105.t: "제2차 [CDI.GetAdjective] 내전 종결"
 ivory_coast_md.105.d: "제2 [CDI.GetAdjective] 내전이 결말을 맺었습니다. [FNC.GetName]과 [CDI.GetName] 간의 전투가 끝났습니다. 이제 국가는 전투 후 새로운 현상 유지 상태로 차분히 자리를 잡아가고 있습니다. 이 전쟁의 결과가 무엇일지 시간이 말해줄 것이지만, 평화는 다시 한 번 [CDI.GetName]에 군림할 것입니다."
 ivory_coast_md.105.a: "반군이 패배했다"
 ivory_coast_md.105.b: "정부가 승리했다"
 ivory_coast_md.105.c: "[CDI.GetName]의 평화"
 senegal_md.1.t: "2000년 [SEN.GetAdjective] 선거"
 senegal_md.1.d: "[neutral_Social_L](은)는 세네갈에서 독립 이래 지금까지 다스리고 있던 정당입니다. 그러나 최근 여론 조사 결과, 압둘라이 와드(Abdoulaye Wade)가 이끄는 야당 연합에 대통령 선거에서 패배할 가능성이 높아졌습니다. 이 연합은 [liberalism_L], [Western_Autocracy_L], [conservatism_L], [socialism_L] 정당들이 합쳐진 것으로, [neutral_Social_L](을)를 물리치기 위해 결집하였습니다. 그들의 종합적인 야당 지지율([?opposition_strength|Y2%])은 [neutral_Social_L] [?party_pop_array^18|Y2%] 보다 상당히 높아, 야당이 우세한 상황입니다. 이번 선거를 어떻게 대처해야 할까요?\n"
 senegal_md.1.o1: "선거를 평소처럼 진행하게 둔다."
 senegal_md.1.o2: "선거에 '영향'을 미쳐야 할지도 모른다."
 senegal_md.1.o3: "어쩌면 이 투표라는 것은 그다지 좋지 않을지도 모른다."
 senegal_md.2.t: "선거 조작"
 senegal_md.2.d: "선거에 대한 우리의 개입은 국민과 국제 감시단 모두에게 대체로 들키지 않았습니다. 야권 일부가 결과에 이의를 제기했으나, 이러한 주장은 국민들 사이에서 큰 호응을 얻지 못했습니다."
 senegal_md.2.o1: "하하,대처해라!"
 senegal_md.3.t: "시위"
 senegal_md.3.d: "우리 선거의 혼란을 규탄하는 광범위한 시위가 벌어졌습니다. 이른바 \\"선거 조작\\"에 대한 수많은 비난이 쏟아졌습니다. 시위에 어떻게 대응해야 합니까?"
 senegal_md.3.o1: "싹 밀어!"
 senegal_md.3.o2: "좋다, 선거를 다시 치르자."
 senegal_md.4.t: "정부의 시위 진압"
 senegal_md.4.d: "시위는 대체로 진압되었습니다. 그러나 이것이 우리의 불안정이 끝났다는 뜻은 아닙니다... 상황은 계속 적대적일 수 있으며, 우리의 권력 장악이 무너지는 모습을 볼 수도 있습니다. 당분간은 경계를 늦추지 않되, 이런 신참 세력이 더 나타나지 않는지 계속 주시해야 합니다..."
 senegal_md.4.o1: "음, 아마 괜찮겠지..."
 senegal_md.5.t: "선거 허용"
 senegal_md.5.d: "두 번째 선거가 치러졌습니다. 권력을 잡고 있던 논의는 점차 사라지고 우리는 민주주의로 돌아가고 있습니다. 집권 연합은 [?government_coalition_strength|2Y%]를 기록했으며, 야당은 [?opposition_strength|Y2%]를 기록했습니다. 끝까지 민주주의를 위한 멋진 하루입니다."
 senegal_md.5.o1: "좋았어, 제대로 돌아가는 민주주의다."
 senegal_md.6.t: "[SEN.GetAdjective] 내전"
 senegal_md.6.d: "시위는 격화되었고, 일부 군 부대가 이탈하여 북동부에서 경쟁 정부를 선포했습니다. 카사만스 지역의 분리주의자들은 우리의 약점을 틈타 독립을 선언했습니다. 이제 우리의 나라는 내전 상태에 빠져들었습니다."
 senegal_md.6.o1: "음, 엉망이 되었군."
 senegal_md.7.t: "TEMP"
 senegal_md.7.d: "DESC"
 senegal_md.7.a: "통합으로 접근한다"
 senegal_md.7.b: "자치로 접근한다"
 senegal_md.7.c: "독립으로 접근한다"
 senegal_md.8.t: "카자망스 통합"
 senegal_md.8.d: "카자망스와 카자망스 민주세력운동은 통합 회담을 진전시키기로 결정했으며, 세네갈 정부와의 우호 관계를 되살리기 위해 통합, 재건 등을 추진했습니다. 이 불안한 평화가 계속 이어질지는 시간이 말해줄 것입니다..."
 senegal_md.8.a: "다시 태어난 국가."
 senegal_md.8.tt: "[CSM.GetName]은(는) 여전히 우리나라에서 분리 독립할 수 있습니다..."
 senegal_md.9.t: "[CSM.GetName] 자치 지역"
 senegal_md.9.d: "세네갈 측과 카자망스 측은 카자망스가 자치권을 얻는 것이 양측 모두에게 최선이라고 판단했습니다. 해당 지역은 세네갈의 범위 안에서 자치 정부를 운영하게 됩니다. 이들은 이제 우리와 더욱 긴밀하게 연계되며, 우리는 국가의 안정을 확보하기 위한 노력을 계속해야 합니다."
 senegal_md.9.a: "새로운 연합 지역"
 senegal_md.10.t: "카자망스의 독립"
 senegal_md.10.d: "극적인 전환점으로, 세네갈은 카자망스 사람들에게 자결권을 허용하기로 결정했습니다. 해당 지역은 이제 세네갈의 통제에서 풀려났으며 독자적인 정부를 구성할 수 있게 되었습니다. 분쟁이 길었던 점을 고려하면 흥미로운 정책 변화입니다."
 senegal_md.10.a: "카자망스에 자유를"
 senegal_md.11.t: "[SEN.GetAdjective] 내전 종결"
 senegal_md.11.d: "[SEN.GetName]의 교전 세력들이 오늘 마침내 전투를 끝내고 무기를 내려놓았습니다. 정부 관리들과 군이 정부군과 반군 사이에서 가장 치열한 전투를 겪은 지역에 질서를 회복시키면서 평화가 계속 이어지고 있습니다. 앞으로 몇 달간은 새로운 세네갈을 위한 시간입니다. 적어도 세네갈은 하나가 되었습니다."
 senegal_md.11.o1: "마침내 하나가 되었다!"
 senegal_md.100.t: "[SEN.GetAdjective] 내전"
 senegal_md.100.d: "오늘 세네갈에서 분쟁이 터졌습니다. 최근 치러진 선거로 정부가 산산조각 났습니다. [CSM.GetNameDef]이(가) 세네갈로부터 분리 독립했으며, 나라가 더욱 혼란에 빠져드는 가운데 독립을 위해 적극적으로 싸우고 있습니다."
 senegal_md.100.o1: "반란은 진압될 것이다!"
 senegal_md.100.o2: "새로운 세네갈이 다가오고 있다!"
 senegal_md.100.o3: "우려스러운 사태"
 senegal_md.101.t: "[SEN.GetAdjective] 내전 종결"
 senegal_md.101.d: "[SEN.GetName]의 교전 세력들이 오늘 마침내 전투를 끝내고 무기를 내려놓았습니다."
 senegal_md.101.o1: "우리는 하나다!"
 senegal_md.101.o2: "마침내 평화다!"
 central_africa.2.t: "장뤼크 만다바의 처우"
 central_africa.2.d: "장뤼크 만다바는 1990년대 초 우리나라의 전임 총리였습니다. 더욱이 그는 현 정부를 지지하며 군사력의 핵심을 이루는 카라코 민병대의 창설자 중 한 명이었습니다. 하지만 장뤼크는 상당히 수상쩍게 행동하고 있습니다. 그가 우리에 대한 쿠데타를 꾸미고 있을지도 모릅니다. 이 위협을 제거해야 합니까?"
 central_africa.2.a: "그를 제거한다"
 central_africa.2.b: "그를 내버려 둔다"
 central_africa.3.t: "장뤼크 만다바의 죽음"
 central_africa.3.d: "올해 파타세의 두 번째 임기를 축하하는 만찬 이후, 만다바는 몸이 좋지 않다고 느꼈고 귀가 직후 심장마비로 사망했습니다. 만다바는 파타세를 전복하려는 쿠데타를 계획했다는 혐의를 받아 왔습니다. 이것이 사실인지는 불분명하지만, 어쨌든 그는 그런 혐의를 받고 있었습니다."
 central_africa.3.a: "속이 시원하군"
 central_africa.4.t: "반 파타세 시위"
 central_africa.4.d: "The death of Jean-Luc Mandaba has rippled throughout the country causing rampant strife and several large-scale protests across Bangui and other major Central African cities."
 central_africa.4.a: "그들이 말하게 놔둔다"
 central_africa.4.b: "시위를 짓밟는다"
 central_africa.5.t: "5월 쿠데타"
 central_africa.5.d: "Commandos of the Central African Armed Forces have attempted a deposing of Patassé in the late hours of last night led by Bozizé and sponsored by the former president André-Dieudonné Kolingba. The militias that support us want blood and they want the people of Kolingba, the Yakoma people, to pay for his mistakes."
 central_africa.5.a: "폭력을 선동한다"
 central_africa.5.b: "민병대를 진정시킨다"
 central_africa.6.t: "보지제 문제"
 central_africa.6.d: "5월의 쿠데타는 아직도 우리의 기억에 생생하며, 보지제는 여전히 국내에 머물고 있습니다. 이 반역자는 여전히 국내 여러 민족 사이에서 지지를 얻고 있는 듯합니다. 이제 실패한 쿠데타 지도자를 어떻게 처리할지 결정해야 할 때입니다."
 central_africa.6.a: "보지제를 체포한다"
 central_africa.6.b: "그가 도망칠지도 모른다!"
 central_africa.7.t: "보지제, 차드로 도주"
 central_africa.7.d: "보지제는 어떤 조치를 취하기 불과 몇 시간 전에 국외로 도주했습니다. 보지제에게 충성하는 군 병력도 그와 함께 떠나 훈련된 병력에 상당한 손실이 발생했으며, 그에게 충성하는 민병대는 우리 정부의 통치에 따르기를 거부하고 있습니다. 차드를 침공하여 그들을 추적할 수도 있고, 국내 문제에 집중할 수도 있습니다."
 central_africa.7.a: "반역자가 도망쳤다..."
 central_africa.7.b: "차드를 침공한다"
 central_africa.8.t: "보지제 귀환, 방기 장악"
 central_africa.8.d: "보지제와 그의 무리가 이탈자, 차드 장비, 지원병 등을 포함한 상당한 병력을 이끌고 돌아왔습니다. 이들은 신속하게 전국을 휩쓸며 방기를 향해 곧장 진군했습니다. 적대 세력은 하룻밤 사이의 공세로 보이는 작전으로 국토 대부분을 장악했습니다."
 central_africa.8.a: "권력 이양을 허용한다"
 central_africa.8.b: "보지제와 그의 반군에 맞서 싸운다!"
 central_africa.9.t: "드리우는 전쟁의 그림자"
 central_africa.9.d: "최근의 정치적 격변과 끊임없이 변하는 정세가 우리를 돌이킬 수 없는 길로 이끌고 있습니다. 보지제가 대통령 자리에 안착하면서 중앙아프리카 공화국에 전쟁의 그림자가 드리우고 있습니다. 민병대는 탄약과 장비를 비축하고 있으며, 적대 세력과 반대 세력은 계속 곪아가고 있습니다. 이 시련의 시기에 어떤 일이 벌어질지, 그리고 이 불안정한 상태의 나라가 어떻게 될지는 시간이 말해줄 것입니다."
 central_africa.9.a: "사소한 문제들일 뿐이다..."
 central_africa.10.t: "파타세의 선거 출마 허용"
 central_africa.10.d: "중앙아프리카 공화국의 전 대통령 앙주펠릭스 파타세가 소속 정당의 대통령 후보로 지명되었습니다. 파타세는 최근 국내 불안정과 고조되는 내부 갈등의 대부분에 책임이 있다는 점을 주목할 필요가 있습니다. 그를 선거에서 배제해야 합니까, 아니면 참여를 허용해야 합니까?"
 central_africa.10.a: "파타세의 참여를 허용한다"
 central_africa.10.b: "파타세를 선거에서 배제한다"
 central_africa.12.t: "2005년 대통령 선거"
 central_africa.12.d: "선거는 여러 차례 연기되었지만 오늘이 바로 그날입니다. 총선이 치러질 수 있게 되었고 선거를 둘러싼 분위기도 긍정적입니다. 최근 실시된 국민투표에서 대통령 임기 제한을 도입하고, 투표 접근성을 개선하며, 여러 다른 혜택을 향상시키는 새 헌법이 승인되었습니다. 이러한 변화가 연기의 이유 중 일부입니다. 선거를 앞두고 보지제가 후보들 가운데 가장 인기가 높은 것으로 보입니다. 그러나 지겔레 또한 강력한 후보입니다."
 central_africa.12.a: "프랑수아 보지제"
 central_africa.12.b: "마르탱 지겔레"
 central_africa.12.c: "파타세가 예상 밖의 승리를 거두다"
 central_africa.13.t: "중앙아프리카 공화국 부시 전쟁"
 central_africa.13.d: "전쟁은 기술적으로는 파타세의 몰락 이후 시작되었지만, 이제 공개적인 무력 충돌로 번져 북부의 수많은 민병대 집단이 국가에 대한 자신들의 영유권을 새기려 하고 있습니다. 부시 전쟁이 이제 본격화되었습니다."
 central_africa.13.a: "전쟁이 시작된다"
 central_africa.14.t: "부시 전쟁에서 프랑스의 지원 요청"
 central_africa.14.d: "프랑스는 명목상 우리 위대한 나라와의 관계 유지에 관심을 보여 왔지만, 이제는 그들이 말뿐인 지지가 아니라 힘이 있는 곳에 지원을 실어야 할 때입니다. 진행 중인 분쟁에서 그들에게 지원을 요청할 수 있습니다. 아마도 물자 지원이겠지만, 어쨌든 지원입니다."
 central_africa.14.a: "프랑스의 지원을 요청한다"
 central_africa.14.b: "필요하지 않다"
 CAR_central_africa.14.a.tt: "[FRA.GetNameWithFlag]에 지원을 요청하면 분쟁이 확대될 수 있습니다..."
 central_africa.15.t: "중앙아프리카 공화국, 지원 요청"
 central_africa.15.d: "중앙아프리카 공화국 부시 전쟁이 이제 한창이며 [CAR.GetLeader]이(가) 자국에 지원을 보내 달라고 요청했습니다. 진행 중인 분쟁에 명목상의 지원 물자를 보낼 수는 있지만, 그들의 적이 이 지원을 알게 되면 적대감을 키울 가능성이 높습니다."
 central_africa.15.a: "보지제와 중앙아프리카 공화국을 지원한다"
 central_africa.15.b: "요청을 거절한다"
 central_africa.16.t1: "프랑스가 우리를 지원하다!"
 central_africa.16.t2: "프랑스, 우리 대의에 대한 지원을 거부하다"
 central_africa.16.d1: "프랑스는 부시 전쟁에서 우리의 전투를 위해 군사 지원을 보내기로 했습니다. 그러나 이 결정은 우리를 같은 국민을 폭격하는 것밖에 모르는 나라의 폭력적인 지도자로 보는 더 많은 반군 집단을 격분시켰습니다. 정부와 적극적으로 싸우고 있는 다른 세력들에 더해 국가의 북부와 동부 지역도 우리에 맞서 무기를 들었습니다. 이제 진정한 내전이 시작되었습니다."
 central_africa.16.d2: "프랑스 정부는 우리에게 지원을 보내는 것이 자국의 이익에 부합하지 않는다고 결정했습니다. 외세로부터 추가 지원을 구하며 확전하지 않았으므로, 농촌 지역의 전투는 계속 저강도로 유지될 것입니다."
 central_africa.16.a: "유용하게 쓰겠다."
 central_africa.16.b: "프랑스가 거부했다"
 central_africa.17.t: "중앙아프리카 부시 전쟁의 종결"
 central_africa.17.d: "중앙아프리카 공화국의 소규모 분쟁이 자연스럽게 막을 내렸습니다. 전투는 이제 고속도로 주변과 그들의 집 가까이에 있는 작은 마을과 소규모 지역 무장 집단 사이에서만 벌어지는 정도로 잦아들었습니다. 오래 지속되지 않은 짧은 전쟁이었지만 인명 피해는 막대했고, 이미 불안정한 우리나라에서 국민들의 이재민화는 심각했습니다. 중앙아프리카 부시 전쟁의 진정한 여파가 무엇일지는 시간이 말해줄 것입니다."
 central_africa.17.a: "승자가 전리품을 차지한다"
 central_africa.18.t: "긴장된 평화..."
 central_africa.18.d: "중앙아프리카 부시 전쟁이 계속해서 잦아들기 시작했으며, 평화는 우리나라 모든 국민이 바라는 상품이 되었습니다. 이 나라의 평화는 안전을 의미하지는 않지만, 그래도 평화는 평화입니다. 이 평화가 얼마나 오래 이어질지는 시간만이 알려줄 것입니다. 결국 전쟁은 변하지 않으니까요."
 central_africa.18.a: "우리 시대의 평화"
 central_africa.19.t: "위반 혐의"
 central_africa.19.d: "지난 몇 주 동안 많은 사람들이 어떤 식으로든 피해를 입었습니다. 야권은 정부에 책임이 있다고 주장했고, 정부 내 여러 사람들은 계속해서 반군을 탓하고 있습니다. 서로 주고받는 비난은 자신들에게 향하는 책임을 덜려는 것에 지나지 않습니다. 이제 반군을 진정시킬지, 아니면 폭력을 부추길지 결정해야 할 때입니다. 분쟁이 얼마나 빨리 현실이 될지는 우리의 현재 행보에 달려 있습니다."
 central_africa.19.a: "반군을 진정시킨다"
 central_africa.19.b: "저들이 문제다!"
 central_africa.20.t: "[CAR.GetLeader], 반군에 맞선 지원 요청"
 central_africa.20.d: "[CAR.GetLeader]은(는) 극심한 불화에 빠진 처지인 듯합니다. 중앙아프리카 공화국의 반군들이 무기를 들고 있으며, 이 나라에서 또 한 번의 내전이 될 듯한 사태를 적극적으로 준비하고 있습니다. 중앙아프리카 공화국은 아프리카에서의 영향력 경쟁에서 우리가 적극적으로 지원을 모색할 수 있는 나라입니다."
 central_africa.20.a: "[CAR.GetLeader]을(를) 지원한다"
 central_africa.20.b: "저들이 문제다!"
 central_africa.21.t1: "프랑스가 다시 우리를 지원하다"
 central_africa.21.t2: "프랑스, 우리 대의에 대한 지원을 거부하다"
 central_africa.21.d1: "프랑스는 다가오는 분쟁에서 우리에게 지원을 보내기로 결정했습니다. 우리가 이번 전쟁에서 진정한 정부로 간주되는 만큼 군사 지원과 외교적 지지가 넘쳐납니다. 그들의 도움을 매우 효과적으로 활용할 것입니다."
 central_africa.21.d2: "우리는 프랑스에게 버림받았습니다. 우리는 그들의 탈식민 제국에 대한 야망에 들어맞지 않는 듯합니다."
 central_africa.21.a: "그들이 우리를 지원해 주었다!"
 central_africa.21.b: "요청을 거절한다"
 central_africa.22.t: "중앙아프리카 공화국 내전"
 central_africa.22.d: "반군 연합 셀레카는 우리 대통령 [CAR.GetLeader]이(가) 부시 전쟁 이후 맺은 조약을 위반했다고 계속 비난하고 있습니다. [SEL.GetLeader]은(는) 연합을 이끌어 [CAR.GetName] 정부에 맞서 승리하겠다는 의지를 선언했습니다. 수많은 반군 집단이 정부 대신 셀레카 편에 서면서 분쟁은 불가피합니다. 북동부의 마을과 도시에서는 이미 전투가 시작되었습니다."
 central_africa.22.a: "반군은 약하다"
 central_africa.22.b: "정부를 전복한다"
 central_africa.23.t: "국가를 버린 [CAR.GetLeader]"
 central_africa.23.d: "[CAR.GetLeader]은(는) 갈등과 전쟁의 와중에 국가를 버리기로 결정했습니다. 아무도 대통령 자리를 차지하겠다고 나서지 않아 우리 정부는 큰 타격을 입었습니다."
 central_africa.23.a: "정말 시련의 시기이다"
 central_africa.24.t: "스스로 대통령을 선포한 [SEL.GetLeader]"
 central_africa.24.d: "셀레카의 지도자 [SEL.GetLeader]이(가) 나서서 [CAR.GetLeader]이(가) 남긴 공백 속에서 스스로를 중앙아프리카 공화국의 새 대통령으로 선포했습니다. 전쟁은 나라 안에서 계속 격렬하게 이어지고 있지만, 대통령이 취임 선서를 하는 모습에서 작은 희망의 빛을 느낄 수 있습니다."
 central_africa.24.a: "새로운 대통령"
 central_africa.25.t: "중앙아프리카 공화국 내전의 종결"
 central_africa.25.d: "중앙아프리카 공화국 내전이 자연스러운 결말을 맞이했습니다. 우리가 주요 도시와 마을을 장악하고 국토 전체에 대한 통제를 굳히면서 교전 세력들 사이의 전투는 대체로 잦아들었습니다. 우리가 공화국에서 확고한 권력으로 자리 잡았음이 분명합니다."
 central_africa.25.a: "승자가 전리품을 차지한다"
 central_africa.26.t: "전쟁의 다음 국면"
 central_africa.26.d: "[CAR.GetLeader]과(와) 여러 반군 집단의 위반 혐의 제기로 긴장이 전면전 수준까지 고조되기 시작했습니다. 옛 셀레카 병사들이 군에서 이탈하여 이제 안티발라카와 공개적으로 싸우고 있습니다. 안티발라카는 이 전투의 책임이 전직 셀레카에 있다고 비난하고 있으며, [LGN.GetLeader]은(는) 북동부에 자신만의 족장국을 선포했습니다. 전쟁의 재앙이 계속해서 우리나라를 괴롭히면서 나라는 다시 한번 폐허가 되었습니다."
 central_africa.26.a: "반군과 싸운다!"
 central_africa.26.b: "안티발라카를 지원한다"
 central_africa.26.c: "로곤 공화국을 지원한다"
 central_africa.26.d1: "전직 셀레카를 지원한다"
 central_africa.1000.t: "중앙아프리카 공화국 부시 전쟁"
 central_africa.1000.d: "중앙아프리카 공화국 북부에서 정부군과 통일을 위한 민주세력연합 사이에 제한적인 전투가 발발했습니다. 전투는 비교적 저강도로 유지되며 소규모 저항 거점에 국한되어 있고, APRD, GAPLC, MLCJ, FDC, UFR 등 다른 반군 집단들이 각자의 지역 마을과 도시를 장악하기 위해 경쟁하고 있습니다."
 central_africa.1000.a: "공화국 내의 전투"
 central_africa.1001.t: "중앙아프리카 공화국 부시 전쟁 확대"
 central_africa.1001.d: "최근 프랑스가 중앙아프리카 공화국에 개입하면서 더 많은 국민이 정부에 맞서는 여러 반군 집단에 합류하게 되었습니다. 반군 세력이 [CAR.GetLeader]의 정부를 전복하기 위해 느슨한 연합으로 뭉치면서 전투는 이제 훨씬 더 격렬한 절정에 이르렀습니다. 이미 확전으로 인해 많은 사람들이 터전을 잃었습니다. 부시 전쟁이 이제 본격화되었습니다."
 central_africa.1001.a: "강압적이군..."
 central_africa.1002.t: "중앙아프리카 공화국 부시 전쟁 종결"
 central_africa.1002.d: "긴장된 평화가 지평선에 자리 잡으며 부시 전쟁이 자연스러운 결말에 이르렀습니다. 먹구름과 안개가 걷히기 시작하면서 반군 세력과 정부는 전투를 멈추었습니다. 전쟁으로 황폐해진 나라에 평화가 회복되었습니다."
 central_africa.1002.a: "공화국의 평화"
 central_africa.1003.t: "중앙아프리카 공화국 내전"
 central_africa.1003.d: "중앙아프리카 공화국 내전이 셀레카 반군과 [CAR.GetName] 정부 사이에서 발발했습니다. 반군은 정부가 부시 전쟁의 조약을 위반했다고 계속 비난해 왔습니다. 양측의 전투는 확대되었으며 중앙아프리카 공화국 군은 장비가 부족한 상태입니다."
 central_africa.1003.a: "열대우림 속의 전쟁."
 central_africa.1004.t: "중앙아프리카 공화국 내전 종결"
 central_africa.1004.d: "중앙아프리카 공화국의 반군과 정부 사이의 전투가 자연스러운 결말에 이르렀습니다. 그 여파로 수백 명의 사상자가 발생했고 수천 명의 민간인이 터전을 잃었습니다. 나라가 역사의 다음 단계를 준비하는 가운데 평화의 잎사귀가 이 땅 위에 내려앉기 시작했습니다. 중앙아프리카 공화국 내전이 끝났습니다."
 central_africa.1004.a: "마침내 평화다."
 african.1.t: "2005년 서아프리카 가뭄"
 african.1.d: "서아프리카의 가뭄은 말리, 니제르, 부르키나파소의 사헬 지역에서 특히 심각했습니다. 유목민 공동체와 기타 이동 생활 공동체가 이번 가뭄으로 특히 큰 타격을 입었습니다. 이번 가뭄은 사헬 지역에 비가 내리지 않던 시기 이후에 찾아왔으며, 유목민 공동체에 이상적이던 푸르른 지역에 식생이 드물어졌고 사하라 이남의 농업 활동은 이 지역에 막대한 고통을 야기하고 있습니다."
 african.1.a: "안타까운 일이다"
 african.1.b: "지원을 보낸다"
 mali.1.t: "2002년 대통령 선거"
 mali.1.d: "선거를 앞두고 현직 대통령 알파 우마르 코나레는 원만하게 퇴임하여 말리의 다음 시대가 시작되도록 하기로 결정했습니다. 현재 이 나라의 유력 후보 세 명은 아마두 투마니 투레, 이브라힘 부바카르 케이타, 수마일라 시세입니다. 시세는 팀북투 출신이어서 투아레그족과 북부 지역에서 특히 인기가 높은 반면, 케이타와 투레는 말리 남부 절반에서 가장 인기가 높습니다."
 mali.1.a: "아마두 투마니 투레"
 mali.1.b: "수마일라 시세"
 mali.1.c: "이브라힘 부바카르 케이타"
 mali.2.t: "가뭄으로 더 큰 타격을 입은 투아레그족"
 mali.2.d: "서아프리카를 강타한 최근의 가뭄으로 여러 유목민 공동체가 심각한 타격을 입었습니다. 그러나 우리나라의 투아레그족만큼 큰 타격을 입은 이들은 없습니다. 사하라 사막과 가까운 곳, 혹은 사막 안에 위치한 이들의 터전은 가뭄에 유난히 민감합니다. 이 공동체에 표적 구호를 보낼 수도 있고, 자금을 훗날을 위해 아껴둘 수도 있습니다. 이 상황에 어떻게 대처해야 합니까?"
 mali.2.a: "표적 구호를 보낸다"
 mali.2.b: "유목민 공동체를 외면한다"
 mali.3.t: "북부 말리 개발청"
 mali.3.d: "북부 말리 개발청(ADN)을 설립하여 북부 말리의 개발을 지원하자는 제안이 나왔습니다. 투아레그 분쟁의 주요 원인 중 하나는 경제 개발이 부족하다는 인식과 이 지역 광산 개발로 인한 오염입니다. 제안된 개발청은 키달과 가오 및 기타 소도시와 마을에 일자리와 경제적 구제책을 가져오는 데 중점을 둡니다."
 mali.3.a: "개발청을 설립한다"
 mali.3.b: "설립하지 않는다"
 mali.4.t: "마울루드 축제와 한 손님"
 mali.4.d: "마울루드 축제가 다가왔으며, 이 축제는 예언자 무함마드의 탄생을 기념합니다. 무아마르 카다피 대령이 우리나라를 방문하여 정치인들과 일부 참모진과 함께 축제에 참여하고 있습니다."
 mali.4.a: "리비아와의 우정"
 mali.5.t: "키달과 메나카 군 주둔지 공격"
 mali.5.d: "투아레그 반군이 키달과 메나카의 주둔지를 공격하여 이 지역의 반란 진압 활동에 차질이 빚어졌습니다. 약 25명의 병사가 전투 중 전사하거나 부상을 입은 것으로 추산됩니다. 이 분쟁이 훨씬 더 큰 사태로 번질지는 시간이 말해주겠지만, 이는 시작에 불과하며 지역 무장 세력에게 이 정도는 당연히 예상해야 합니다. 현지 주둔군은 이미 추가 공격에 대비하고 있지만, 어떻게 대응해야 합니까? 북동부의 경비를 강화해야 합니까?"
 mali.5.a: "경비를 강화한다"
 mali.5.b: "흥, 그럴 필요 없다"
 mali.6.t: "알제리 키달 협정"
 mali.6.d: "말리의 투아레그 반란이 우리의 최남단 영토와 투아레그 주민들에게까지 번질 위험이 있습니다. 이 분쟁이 훨씬 더 광범위한 투아레그 반란으로 번져 사하라 이남 아프리카에서 연쇄적인 반란을 일으키기 전에 분쟁을 중재하고 종결시키는 방안을 모색해야 합니다. 우리 국민 중 소수는 말리에서 끓어오르는 분쟁에 개입해서는 안 된다고 생각합니다. 이는 오직 말리의 문제이며 그대로 남아야 한다는 것입니다. 이 지역의 외교관들에게 어떤 지침을 내려야 합니까?"
 mali.6.a: "키달의 평화를 촉구한다"
 mali.6.b: "말리의 문제다"
 mali.7.t: "말리 북동부 평화를 위한 알제리 협정"
 mali.7.d: "알제리가 키달과 메나카 지역의 투아레그 반군과 우리 사이의 평화 협정안을 제시했습니다. 개요가 제시된 협정에 따르면 말리 정부는 이 지역에 투자를 시작하고, 부상자를 지원하며, 키달과 메나카 주민을 지원하게 될 것으로 보입니다. 투아레그족은 이미 이를 지지하기로 결정했으며 협정을 수용할 의향이 있습니다. 이는 평화를 가져오겠지만, 우리가 앞으로 이 지역에 지원을 제공해야 한다는 기대를 안겨줄 것입니다."
 mali.7.a: "협정을 수락한다"
 mali.7.b: "협정을 거부한다"
 mali.7.b_tt: "투아레그족이 반란을 일으킬 것입니다..."
 mali.9.t: "2007년 대통령 선거"
 mali.9.d: "선거운동 기간이 끝나가고 선거가 다가오면서 대통령 선거 열기가 달아오르기 시작했습니다. 아마두 투레는 서남부에서 압도적인 지지를 받고 있으며, 케이타는 북부 지역에서 큰 성공을 거두었습니다. 2007년 선거에서 누가 승리합니까?"
 mali.9.a: "아마두 투마니 투레"
 mali.9.b: "이브라힘 부바카르 케이타"
 mali.10.t: "이야드 아그 갈리, 제다 주재 말리 영사관에 합류"
 mali.10.d: "이야드 아그 갈리가 사우디아라비아 제다 주재 말리 영사관에 임명되었습니다. 저명한 투아레그 반란가였던 아그 갈리는 말리 정부에 점점 더 협조적이 되었고, [MAL.GetLeader]에 의해 또 한 명의 투아레그 MPLA 인사가 말리의 통치와 정치 지형에 편입되었습니다."
 mali.10.a: "정치계의 새 얼굴"
 mali.11.t: "반군, 니제르 주둔지 습격"
 mali.11.d: "니제르의 투아레그 반군 여러 명이 말리와의 국경을 따라 있는 서쪽 끝 지역의 주둔지를 공격했습니다. 우리를 공격한 반군은 말리의 투아레그 반군 집단과 연계된 것으로 보입니다. 반군을 격파하기 위해 합동 작전을 수행할 수도 있고, 더 수동적으로 웅크리고 있을 수도 있습니다."
 mali.11.a: "더 많은 병력을 보낸다"
 mali.11.b: "그들이 빠져나가게 둔다"
 mali.12.t: "캐나다 외교관 및 유럽 관광객 납치"
 mali.12.d: "이번 주 초 캐나다 외교관 두 명과 유럽 관광객 여러 명이 납치되었으며, 범인은 이슬람 마그레브 알카에다(AQIM)로 의심됩니다. AQIM은 이 납치가 자신들의 소행이라고 주장하고 있습니다. 이들은 말리 정부에 외교관과 관광객에 대한 일련의 몸값 요구서를 보냈습니다. 어떻게 대응해야 합니까?"
 mali.12.a: "구출을 시도한다"
 mali.12.b: "몸값을 지불한다"
 mali.12.c: "아무것도 하지 않는다"
 mali.13.t: "구출 작전의 결과"
 mali.13.d1: "[MAL.GetAdjective] 정부와 [MAL.GetLeader]이(가) AQIM 지도부와 협상하여 외교관들의 송환을 성사시켰습니다. 지불한 소액의 돈은 관광객들의 안전한 귀환에 합당한 가치가 있었으며, 외교관들의 석방은 마무리되어 해당 관광객과 외교관들은 각자의 국가로 인계되었습니다."
 mali.13.d2: "우리 군은 몇 주 전에 납치된 캐나다 외교관들과 유럽 관광객들을 성공적으로 구출했습니다. 외교관들을 캐나다 당국에 인계하는 절차가 이미 시작되어 진행 중이며, 우리 군의 신속한 대응 덕분에 사상자는 최소한으로 유지되었습니다. 이번 작전은 대성공이었습니다."
 mali.13.d3: "우리 군이 수행한 구출 작전은 캐나다 외교관들과 유럽 관광객들을 구출하는 데 실패했습니다. 이들은 AQIM과 우리 군 사이의 교전 중 은신처로 의심되는 곳을 급습하는 과정에서 사망했습니다. 말리와 우리의 대외 관계에 정말로 슬픈 날입니다."
 mali.13.d4: "캐나다 외교관들과 유럽 관광객들이 오늘 liveleaks.com이라는 사이트로 보이는 곳에서 처형되었습니다. AQIM 세력은 모든 책임이 자신들에게 있다고 주장하며 인질 구출에 무관심했다며 [MAL.GetLeader]을(를) 비난하고 있습니다. 이들이 진심임이 분명해졌고, 이는 캐나다는 물론 유럽 전반과의 관계를 악화시킬 뿐입니다."
 mali.13.a: "외교관들이 송환되었다"
 mali.13.b: "구출 시도가 성공했다"
 mali.13.c: "구출 시도가 실패했다"
 mali.13.d: "우리의 문제가 아니다!"
 mali.14.t: "우리 외교관 납치"
 mali.14.d1: "[MAL.GetAdjective] 정부와 [MAL.GetLeader]이(가) 우리 외교관들과 소수의 유럽 관광객들을 위해 몸값을 지불했습니다. 이 조치에 깊이 감사하며, 캐나다 국민들은 정부를 지지하는 의미로 [MAL.GetAdjective] 국기를 내걸기 시작했습니다. [MAL.GetAdjective] 정부가 AQIM 반군과의 분쟁 속에서 총격전에 휘말린 사람들을 돕는 데 관심이 있음이 분명합니다."
 mali.14.d2: "[MAL.GetAdjective] 정부와 [MAL.GetLeader]이(가) 우리 외교관들과 유럽 관광객들을 구출하려 시도했습니다. AQIM과 [MAL.GetAdjective] 정부군이 외교관들을 두고 교전을 벌였으며, 작전상의 실수로 납치된 관광객들과 외교관들이 총격전 중 사망했습니다. 그 노력에는 깊이 감사하며, 캐나다 국민들은 외교관들의 죽음을 애도하고 있습니다."
 mali.14.d3: "[MAL.GetAdjective] 정부와 [MAL.GetLeader]이(가) 최근 AQIM 세력에게 붙잡힌 우리 외교관들과 유럽 관광객들을 구출했습니다. [MAL.GetAdjective] 군은 AQIM 세력과 싸워 붙잡힌 민간인들을 AQIM의 거점에서 빼내는 데 성공했습니다. 외교관들과 관광객들을 각자의 국가로 인계하는 절차가 진행 중이며 이들은 안전한 곳으로 향하고 있습니다. 우리 국민을 성공적으로 구출한 덕분에 우리 정부와 [MAL.GetAdjective] 정부 사이의 관계는 크게 개선되었습니다."
 mali.14.d4: "[MAL.GetLeader]과(와) 그의 정부는 납치된 외교관들에 대해 아무 조치도 하지 않기로 했습니다. 이들의 죽음은 liveleaks.com에서 생중계되었는데도 [MAL.GetAdjective] 정부는 여전히 이들의 죽음에 대해 아무것도 하지 않습니다. 이로 인해 사하라 이남 아프리카 국가와의 관계가 크게 악화되었으며, 가까운 시일 내에 누그러질 기미는 보이지 않습니다."
 mali.14.a: "말리가 몸값을 지불했다"
 mali.14.b: "우리 외교관들은 무사하다"
 mali.14.c: "우리 외교관들이 사망했다"
 mali.14.d: "우리 국민이 대가를 치렀다"
 mali.15.t: "키달 평화 기념식, 무기 반납 포함"
 mali.15.d: "알제리 키달 협정 이후 열린 키달 평화 기념식이 오늘 결실을 맺어, 전직 투아레그 전투원들이 선의의 표시로 무기를 내려놓기로 했습니다. 이들은 소형 화기, 수류탄, 그리고 민병대가 긁어모을 수 있었던 기타 장비를 내놓았습니다. 우리가 투아레그 전투원들 및 투아레그 민족과의 관계를 계속 개선해 나감에 따라, 평화로 가는 길이 그 어느 때보다 분명해졌습니다."
 mali.15.a: "평화를 위한 위대한 날"
 mali.16.t: "MNA 결성"
 mali.16.d: "아자와드 민족운동(MNA)이 키달에서 결성되었습니다. 이 운동은 아자와드의 모든 사람을 위한 운동이라고 주장합니다. 송가이족, 아랍인, 풀라족, 투아레그족은 성명 속에서 각자가 가리키는 바를 자처합니다. MNA는 이제 이 나라 북동부 지역의 독립을 위해 활동하고 있다고 밝히고 있습니다. MNA 지도부는 폭력을 거부한다고도 주장하지만, 말리 국내외의 모든 아자와드인들에게 연대의 표시를 보여줄 것을 촉구합니다."
 mali.16.a: "그저 또 하나의 투아레그 정당일 뿐이다"
 mali.17.t: "키달의 새로운 안보, 경제, 개발 프로그램"
 mali.17.d: "[MAL.GetLeader]이(가) 투아레그족이 다수인 지역의 경제적 입지를 개선하려는 일련의 새로운 개발 프로그램을 제안했습니다. 이는 표적화된 프로그램을 통해 이 지역 주민들의 삶의 질을 개선하기 위한 것입니다. 이 지역들에 투자해야 합니까?"
 mali.17.a: "프로그램 비용을 지불한다"
 mali.17.b: "감당할 수 없다"
 mali.19.t: "이브라힘 아그 바항가, 자동차 사고로 사망"
 mali.19.d: "투아레그 반군 집단과 MNA 및 기타 투아레그 집단의 주요 지도자가 자동차 사고로 세상을 떠났습니다. 북동부의 투아레그 운동 진영은 그의 상실을 애도하고 있습니다. 주민들과 MNA에게 진정으로 비극적인 날입니다."
 mali.19.a: "주요 인물이 사망했다"
 mali.21.t: "가오의 치안 악화"
 mali.21.d: "투아레그 세력과 말리군이 이 지역에서 계속 충돌하면서 가오의 치안 상황이 계속 악화되고 있습니다. 투아레그에 대해 어떤 조치를 취하지 않으면 사태가 걷잡을 수 없이 번질 위험이 있습니다. 반군 집단을 상대로 전면 공격을 시도할 수도 있지만 이는 곧 전면전으로 번질 것이며, 아니면 분쟁을 완전히 피하기 위해 반군과 협상을 시도할 수도 있습니다. 이 분쟁이 우리가 상상조차 하지 못했던 훨씬 심각한 사태로 번지기까지 남은 시간이 서서히 줄어들고 있습니다."
 mali.21.a: "추가 병력을 보낸다"
 mali.21.b: "외교적으로 해결한다"
 mali.22.t: "2012년 투아레그 반란"
 mali.22.d: "투아레그족은 아자와드 주민들을 계속 괴롭혀 온 억압에 더는 참을 수 없게 되었습니다. MNLA는 아자와드의 영토를 아자와드 주민들을 위해 되찾겠다며 정부에 전쟁 상태를 선포했습니다. 최북단 키달과 메나카 지역의 많은 사람들이 이 지역의 지배권을 두고 정부와 전쟁을 벌이는 MNLA의 깃발 아래 모여들었습니다. 투아레그 반란이 다시 한번 본격화되었습니다. 형제자매, 부자, 모녀가 양측 모두에서 총격전에 휘말려 있으며, 수백 명이 이미 북부에서 피란을 떠나고 있습니다. 정부군은 투아레그 반군과 이슬람 마그레브 알카에다 사이에 암묵적인 동맹이 있는 가운데 키달의 거리에서 투아레그 반군과 싸우고 있습니다. 앞으로 다가올 날들에 우리 자신의 역사를 써 내려가며 어느 편에 설지 선택해야 할 때입니다."
 mali.22.a: "키달로 진군한다"
 mali.22.b: "우리는 자유를 위해 싸운다"
 mali.23.t: "2012년 말리 쿠데타"
 mali.23.d: "아마두 투마니 투레가 분쟁 대응에 불만을 품은 병사들과 군 병력에 의해 오늘 축출되었습니다. 디온쿤다 트라오레가 새 대통령을 선출하는 선거가 치러질 때까지 임시 대통령으로 지명되었습니다. 분쟁은 계속 끓어오르고 있지만, 새 임시 대통령은 잠재적인 분쟁에 대한 몇 가지 변화를 밝혔습니다."
 mali.23.a: "쿠데타가 성공했다"
 mali.24.t: "이슬람주의자들, 말리 전쟁에 개입"
 mali.24.d: "안사르 딘과 기타 여러 이슬람 반군이 아자와드의 지배권을 두고 투아레그족과 싸우기 시작했습니다. 한때 불안했던 그들의 동맹은 이제 산산조각 났으며, 이들은 서로는 물론 정부군과도 계속 싸우고 있습니다. 마그레브와 사하라 이남 아프리카에서 부상한 이슬람 극단주의자들이 이제 말리에서 그 모습을 드러냈습니다. 이 전쟁의 결과는 분명하며, 피와 눈물, 그리고 국토 북동부 절반의 파괴로 이 땅에 새겨질 것입니다."
 mali.24.a: "안송고가 이탈한다"
 mali.24.b: "알라를 위하여! 사헬의 자유를 위하여!"
 mali.25.t: "MNJ, 전초기지 공격"
 mali.25.d: "니제르 정의 운동(MNJ)이 우리나라 서부와 북부의 군 전초기지에 연이은 치명적인 공격을 가했습니다. 이 전투로 많은 현지 주민이 터전을 잃었고, 아군 다수가 전사하거나 부상을 입거나 실종되었습니다. 말리의 투아레그 전투가 우리의 투아레그 지역으로 번지기 시작하면서 긴장이 점점 고조되었고, 그 결과 지역 전초기지에 대한 공격으로 이어졌습니다."
 mali.25.a: "군을 동원하고 지원을 요청한다"
 mali.25.b: "테러리스트들을 섬멸한다"
 mali.26.t: "MNJ, 아가데즈 공항 공격"
 mali.26.d: "아가데즈 공항이 니제르 정의 운동(MNJ)의 공격을 받아 반군 집단 MNJ의 의도대로 지역 내 혼란이 한층 커졌습니다. 이 반군 집단은 우리가 이 지역에서 어느 정도 합리적인 수준의 치안을 유지하는 능력을 저지하려는 더 큰 야망을 품고 있습니다. 반군은 교전 후 신속히 퇴각하여 이제 고향 땅으로 달아나고 있습니다. 지역 주둔군이 소집되어 이른바 반군을 상대로 진격할 준비를 마쳤습니다. 명령은 무엇입니까? 반격을 개시해야 합니까, 아니면 때를 기다리며 다음 공세에 대비해야 합니까?"
 mali.26.a: "이 테러리스트들을 추격할 부대를 보낸다"
 mali.26.b: "다음 공세에 대비한다"
 mali.27.t: "MNJ의 아레바 직원 납치"
 mali.27.d: "니제르에서 우라늄을 채굴하는 프랑스 기업 아레바가 오늘 일찍 여러 직원이 납치되는 일을 겪었습니다. MNJ가 왜 이 기업의 직원들을 납치했는지는 불분명하나, 이들은 납치가 자신들의 소행이라고 주장했습니다. 이 행동의 구체적인 결과가 무엇일지는 시간이 말해줄 것입니다."
 mali.27.a: "분쟁이 계속 격화된다"
 mali.28.t: "MNJ, 전초기지 공격 지속"
 mali.28.d: "투아레그 반군 집단 MNJ가 니제르 서부에서 일련의 공격을 감행했습니다. 다수의 니제르 병사가 전투에서 쓰러졌으며, 니제르는 자체 보복 방침 또는 독자적인 노선에 대한 지원을 준비하고 있습니다. 자문 임무로 파견되어 있던 아군 병사 일부가 총격전에 휘말렸습니다. 어떻게 대응해야 합니까?"
 mali.28.a: "행동에 나서야 한다"
 mali.28.b: "우리의 문제가 아니다"
 mali.29.t: "아레바 직원 납치!"
 mali.29.d: "프랑스의 우라늄 채굴 회사인 아레바(Areva)는 니제르 북부 지역에서 여러 명의 직원이 납치된 사건을 겪었습니다. 투아레그 반군과 급진적 단체들이 아레바 직원들의 납치에 대한 책임을 주장하고 있습니다."
 mali.29.a: "외교적 지원을 활용한다"
 mali.29.b: "책임을 아레바에 돌린다"
 mali.30.t: "하산 아그 파가의 탈영"
 mali.30.d: "하산 아그 파가가(Hassan ag Fagaga), 이포가스 투아레그 출신으로 우리 군의 중요한 투아레그 지휘관 중 한 명이 자신의 직위에서 탈영했습니다. 그를 충성하는 대규모 군 병력이 그와 함께 탈영했으며, 말리 정부와 말리의 투아레그 민족들 사이의 긴장이 고조되면서 발생한 일입니다. 이것이 가까운 미래에 어떤 의미를 가질지는 불확실하지만, 파가가는 어떤 방식으로든 다시 등장할 가능성이 큽니다."
 mali.30.a: "반역자들!"
 mali.31.t: "말리 군이 틴 자와텐에서 공격을 감행했습니다."
 mali.31.d: "무장한 투아레그 군이 틴 자와텐에서 우리의 군을 공격했습니다. 틴 자와텐은 지역의 반군 세력을 막기 위해 많은 군인들이 배치된 외딴 군사 전초기지입니다. 백 명이 넘는 병사들이 부상을 입거나, 포로로 잡히거나, 사망한 상황입니다."
 mali.31.a: "군인들에게 조의를 표합니다."
 mali.32.t: "Tuareg Gunmen Captured a Convoy Outside Tin Zawaten"
 mali.32.d: "여러 명의 무장한 투아레그 총격수들이 군사 호송대를 납치하고 군사 장비를 압수했으며, 호송대를 둘러싼 전투에서 우리 군인들 중 상당수가 부상을 입거나 사망했습니다. 호송대를 둘러싼 전투에서의 실제 피해는 아직 정확히 전달되지 않았지만, 곧 피해 상황을 알게 될 것입니다. 이 장비의 상실은 투아레그들이 향후 진행할 수 있는 작전에서 그들의 힘을 강화시킬 것입니다."
 mali.32.a: "유감이군."
 mali.33.t: "말리 내전의 승자"
 mali.33.d: "말리 내전은 제때 끝을 맞이했습니다. 정부, 투아레그, 급진 이슬람 반군 간의 전투는 점차적으로 잠잠해졌습니다. 우리는 법치주의를 재확립하고 전투가 있었던 지역을 점령하면서 재건 작업을 시작했습니다. 말리에서의 갈등은 결국 끝을 맺었습니다."
 mali.33.a: "승자의 전리품"
 mali.34.t: "투아레그 반란의 승자"
 mali.34.d: "투아레그족의 반란이 자연스러운 결말에 이르렀으며, 정부와 투아레그 반군 사이의 전투는 대체로 끝났습니다. 화해의 손길이 내밀어지고 새로운 현상이 자리 잡으면서, 젊은 나라 말리의 역사에 또 하나의 장이 쓰였습니다."
 mali.34.a: "승자의 전리품"
 mali.1000.t: "2006년 투아레그 반란"
 mali.1000.d: "말리와 [MAL.GetLeader]는 최근 알제리 정부의 [ALG.GetLeader]와 외교 사절들이 제안한 평화 협정을 거부했습니다. 평화 협상이 결렬된 후, 투아레그 군은 즉시 집결을 시작하고 기달에서 대규모 침공을 준비했습니다. 말리 정부에 충성하는 지역 군대는 말리 군을 위한 시간을 벌기 위해 집결한 군대에 맞서 싸웠습니다. 말리에서 전쟁이 시작되었습니다."
 mali.1000.a: "팀북투에서의 문제..."
 mali.1001.t: "2012년 투아레그 반란"
 mali.1001.d: "The MNLA has declared the independence of the Azawad as they're calling it. [TUA.GetLeader] began by giving a passionate speech rallying the nomadic peoples and the people of the cities in the Kidal region to his banner as they began their offensive into Mali to unseat and topple the government in the regions of Timbuktu, Kidal, Menaka and Gao. Time will tell whether the MNLA will be able to achieve victory in this goal. Islamist forces have flocked to the banner of the MNLA seeking to achieve a seat on the new governing body of Azawad."
 mali.1001.a: "팀북투에서의 문제..."
 mali.1002.t: "안사르 디네가 말리 내전에 참전했습니다."
 mali.1002.d: "안사르 디네와 MNLA 사이에 의견 차이가 발생하여 말리 북부 점령 지역에서 대규모 전투가 벌어졌습니다. 두 그룹 간의 전투는 아자와드 독립 운동의 미묘한 균형을 위협하고 있으며, 지역 주민들은 빠르게 전투의 먹이감이나 목표물이 되어가고 있습니다. 북부에서 더 안정된 남부 지역으로의 대규모 이주가 가능한 사람들에 의해 시작되었습니다. 일부가 '팀북투의 문제'라고 부르는 이 상황은 폭풍이 되어가고 있습니다. 말리의 사람들은 이제 말리 내전의 격렬한 혼란 속에 빠져들고 있습니다."
 mali.1002.a: "상황이 더 악화되진 않겠지?"
 mali.1003.t: "투아레그 반란의 종식"
 mali.1003.d: "말리 북동부의 투아레그 군의 제한된 반란은 자연스럽게 결말을 맞이했습니다. 전투를 벌였던 양측은 한 쪽이 승리를 주장하며 합의에 도달했고, 최근 불안정해진 지역에 평화가 회복되었습니다. 오늘은 말리에서의 투아레그 반란의 종식을 의미하며, 앞으로도 그와 같이 기억될 것입니다."
 mali.1003.a: "키달에서의 평화..."
 mali.1004.t: "말리 내전의 끝"
 mali.1004.d: "먼지가 가라앉고, 수천 명의 사망자와 수만 명의 이재민을 남긴 채 말리 내전은 자연스럽게 끝을 맞이했습니다. 국내의 전투는 주로 분파들 간의 사소한 다툼과 군대의 이탈 세력들에 의한 제한적인 충돌로 줄어들었습니다. 말리의 대부분의 지역에서는 평화가 회복되었고, 말리 역사에 또 다른 장이 기록되었습니다."
 mali.1004.a: "드디어 평화가..."
 somalia.1.t: "전환기 국가 정부(TNG)의 창립"
 somalia.1.d: "[SOM.GetName], [SNA.GetName] and other Somali warlords have begun traveling to [DJI.GetName] to discuss ending this phase of the Somali Civil War. The dust is starting to settle as the various leaders attempt to halt their forces from further conflict. The Transitional National Charter has given way to the formation of the Transitional National Government (TNG), which will take us to the future."
 somalia.1.a: "TNG를 구성한다"
 somalia.1.b: "하나가 통치해야 한다."
 somalia.2.t: "TNG에 대한 입장"
 somalia.2.d: "[FROM.GetName]이(가) 단결과 협력을 통해 소말리아 내전을 끝내고자 과도 국민 정부(TNG)의 구성을 시작했습니다. 소말리아가 새로운 시대의 문턱에 서 있는 만큼, 우리는 입장을 정해야 합니다. 평화를 향한 이 전환을 받아들일 것인가, 아니면 제안된 앞길에 도전할 것인가?"
 somalia.2.a: "TNG에 가입한다"
 somalia.2.b: "자치 지역으로 가입한다"
 somalia.2.c: "경쟁을 선언한다"
 somalia.3.t: "TNG 구성"
 somalia.3.d: "과도 국민 정부(TNG)가 지부티에서 수립되어 소말리아 역사의 중대한 순간을 맞이했습니다. 앞길이 험난할 수 있지만, 이는 국가 통합과 안정을 향한 우리의 첫걸음입니다. 우리는 함께 내전의 상처를 치유하고 더 강하고 번영하는 소말리아를 건설하기 위해 노력해야 합니다. 앞으로 며칠 안에 우리는 국가의 나아갈 길을 결정할 선거를 치를 것입니다."
 somalia.3.a: "소말리아의 새로운 새벽"
 somalia.4.t: "2001년 TNG 선거"
 somalia.4.d: "새 정부의 첫 선거가 시작되었습니다. 대표단은 후보를 다음 두 사람으로 압축하기로 했습니다. 바레 정권의 전 제2부총리 압디카심 살라드, 또는 바레 정권의 전 재무장관 압둘라히 아흐메드 아두입니다. 누가 TNG를 이끌어야 합니까?"
 somalia.4.a: "압디카심 살라드 하산"
 somalia.4.b: "압둘라히 아흐메드 아두"
 somalia.5.t: "주바 계곡 동맹 결성"
 somalia.5.d: "[JUB.GetLeader]이(가) 주바랜드를 근거지로 하는 다른 민병대 지도자들과 함께 주바 계곡 동맹을 결성하기로 했습니다. 주바의 행정을 담당할 이 지역의 새로운 선두 주자입니다. 그러나 모건 장군은 여전히 어디에나 존재감을 드러내고 있습니다..."
 somalia.5.a: "TNG 문제"
 somalia.5.b: "모건 장군의 부상"
 somalia.6.t: "TNG 문제"
 somalia.6.d: "가장 시급한 논쟁점은 TNG를 지지할 것인지, 거부할 것인지를 결정하는 것입니다. 갓 출범한 통합 정부는 산산이 흩어진 소말리아의 주들을 통합하고 공고히 하기 위해 모을 수 있는 모든 지지가 필요합니다."
 somalia.6.a: "TNG 가입을 지지한다"
 somalia.6.b: "TNG 가입을 거부한다"
 somalia.7.t1: "주바 계곡 동맹, TNG에 가입"
 somalia.7.d1: "주바 계곡 동맹이 우리 정부를 지지하기로 결정했습니다. 이들은 이제 자치 지역으로서 TNG의 일원이 될 것입니다."
 somalia.7.a: "소말리아가 거의 통합되었다"
 somalia.7.t2: "주바 계곡 동맹, TNG 가입을 거부"
 somalia.7.d2: "주바 계곡 동맹이 TNG 가입을 거부했습니다. 이 사태를 어떻게 처리해야 합니까?"
 somalia.7.b: "그들이 알아서 하게 둔다"
 somalia.7.c: "어떤 대가를 치르더라도 영토를 되찾는다!"
 somalia.8.t: "TFG 구성"
 somalia.8.d: "과도기 국가 정부는 초기 정부 내 대부분의 문제를 해결했습니다. 이제 과도 연방 정부(TFG)가 형성되어, 대부분의 소말리아 국가들이 다시 하나로 통합하려는 노력을 기울이고 있습니다. [SML.GetName]은 TFG에 합류를 거부했지만, 이는 나중에 처리할 문제로 남아 있습니다."
 somalia.8.a: "새로운 선거"
 somalia.9.t: "2004년 선거"
 somalia.9.d: "The newly formed Transitional Federal Government (TFG) must now hold our elections and decide who will lead our nation going forward. Do we continue the status quo or do we pivot to a new leader?"
 somalia.9.a: "압둘라히 유수프 아흐메드"
 somalia.9.b: "압둘라히 아흐메드 아두"
 somalia.9.c: "Abdiqasim Salad Hassan"
 somalia.10.t: "The [SHB.GetName] offensive"
 somalia.10.d: "The fragile authority of the Transitional Federal Government is fracturing. Exploiting deep-seated grievances, [SHB.GetName] has transitioned from a shadow insurgency to an open offensive. From the scrublands of the south to the outskirts of Mogadishu, the militants are seizing control of key districts. Our outposts are falling, and the message from the front is clear: the central state is no longer the only power in Somalia."
 somalia.10.a: "Hub la'aan waa hallaag.\n (To be without weapons is to be destroyed.)"
 somalia.10.b: "The Quran is our Constitution, Jihad is our path."
 somalia.11.t: "소말리아 내전 종전"
 somalia.11.d: "소말리아 내전은 자연스럽게 끝을 맞이했습니다. [THIS.GetName]이 이제 승리를 거두었고, 우리의 깃발이 모가디슈 위에 휘날리고 있습니다. 이제 우리는 소말리아 정부의 수장으로서 소말리아를 미래로 이끌어 갈 것입니다."
 somalia.11.a: "드디어 평화가."
 somalia.1000.t: "과도 연방 정부의 승리"
 somalia.1000.d: "소말리아 과도 연방 정부가 이슬람 법정 연합과의 전쟁에서 승리하여 국가에 대한 통제권을 굳혔습니다. 이 나라가 작은 평화를 계속 붙잡고 더 밝은 내일을 향해 나아갈 수 있을지는 지켜봐야 합니다."
 somalia.1000.a: "또 하루, 또 하나의 역사적 순간."
 somalia.1001.t: "과도 연방 정부 붕괴"
 somalia.1001.d: "[SHB.GetName]은(는) 소말리아 과도 연방 정부를 전복하려는 노력에서 승리하여 이제 국가에 대한 통제권을 확립하기 시작했습니다. TFG의 전직 충성파에 대한 숙청이 이 나라에 샤리아 법을 확립하려는 이들의 운동과 함께 진행되고 있습니다."
 somalia.1001.a: "또 하루, 또 하나의 역사적 순간.."
 somalia.1002.t: "과도 연방 정부 구성"
 somalia.1002.d: "과도 국민 정부와 그 구성은 소말리아에 새로운 국면을 열어 주었습니다. 정부가 계속해서 통제력을 굳혀 가면서 불안정과 내분은 가라앉았습니다. \n\n작년 말에 만료된 TNG의 임기는 새로운 과도 연방 정부의 구성을 위한 길을 열기 시작했습니다. 스테이플러를 구입하지 못하는 것에서부터 정부의 권위에 대한 더 적극적인 도전에 이르기까지 난관이 가득했음에도, 과도 국민 정부는 악조건을 딛고 성공을 거두었습니다. TNG의 저명한 인사들이 이끄는 TFG가 그 뒤를 이어 구성되어 소말리아 공화국의 새로운 연방 정부가 되었으며, 소말리아의 새 시대를 열고 내전의 결말에 한층 가까워지는 내분과 내전의 다음 장으로 접어들었습니다."
 somalia.1002.a: "또 하루, 또 하나의 역사적 순간."
 somalia.1003.t: "과도 국민 정부 구성"
 somalia.1003.d: "지부티의 아르타에서 열린 회의 끝에 과도 국민 정부가 구성되면서 10년 넘게 이어진 내전이 끝났습니다. \n\n시아드 바레 장군의 축출과 군사 정권의 종말 이후 평화를 중재하려는 수많은 시도가 실패했음에도, 교전 중인 부족들 사이에 장기 휴전이 성사되었습니다. 지부티 대통령 이스마일 오마르 겔레의 주도로 소말리아 대표 4000명이 참여한 가운데, 부족들은 내부의 불만을 해결하고 국가의 새로운 틀을 세우기 위해 모였습니다. TNG의 미래를 위한 토대가 되는 기구들이 세워지고 있습니다. \n\n장기적인 안정은 확실하지 않지만, 이번 조치는 아프리카의 뿔 지역에 희망적인 변화의 숨결을 불어넣고 있습니다."
 somalia.1003.a: "또 하루, 또 하나의 역사적 순간."
 haiti.1.t: "2000년 지방선거"
 haiti.1.d: "2000년 지방선거에서 파니 라발라스 소속 인사들의 인기가 크게 급등했습니다. 야당의 다수는 개표 조작 또는 부정선거의 증거가 있다며 항의하기 시작했습니다. 이는 아마도 이 정당의 높은 투표율의 원인 중 하나일 수 있으나, 단순한 인기 때문일 수도 있습니다. 어떻게 대처하시겠습니까?"
 haiti.1.a: "패자의 억지다!"
 haiti.1.b: "재검표를 실시한다"
 haiti.2.t: "야당의 선거 보이콧"
 haiti.2.d: "아리스티드에 반대하는 야당이 선거를 보이콧하기로 결정했습니다. 야당은 정부와 파니 라발라스가 자신들에게 유리하도록 선거를 조작했다고 비난하기 시작했습니다."
 haiti.2.a: "참으로 억지스러운 패자들이다!"
 haiti.3.t: "야당의 참여 결정"
 haiti.3.d: "우리는 선거를 다시 실시하고 야당을 논의에 더 깊이 끌어들이기로 했습니다. 올해 후반에 치러질 2000년 대통령 선거는 공정하고 자유롭게 진행될 것이며, 야당도 선거에 참여하게 될 것입니다."
 haiti.3.a: "공정하고 자유로운 선거"
 haiti.4.t: "2000년 선거"
 haiti.4.d: "위대한 우리나라에서 또 한 번의 선거를 치를 때가 왔습니다. 선거에 이르기까지 난관이 있었으나, 우리는 이 위대한 국가에서 또다시 선거를 치렀습니다. 누가 선거에서 승리했습니까?"
 haiti.4.a: "장베르트랑 아리스티드"
 haiti.4.b: "야당의 승리"
 haiti.5.t: "아리스티드에 대한 학생 시위"
 haiti.5.d: "여러 대학의 학생 다수가 주요 도시에서 시위를 벌이기로 결정했습니다. 학생들이 주도하는 여러 시위는 정부 이행 과정에 상당한 문제를 일으켰습니다."
 haiti.5.a: "학생들과 협상한다"
 haiti.5.b: "시위를 진압한다"
 haiti.6.t: "아리스티드에 대한 학생 시위!"
 haiti.6.d: "대학의 또 다른 시위대가 아리스티드에 맞서 다시 시위를 벌이기로 했습니다. 시위대는 계속해서 부패와 아리스티드 대통령에 반대하는 세력에 대한 처우를 규탄하고 있습니다."
 haiti.6.a: "학생들과 협상한다"
 haiti.6.b: "시위를 진압한다"
 haiti.7.t: "배상 문제"
 haiti.7.d: "독립 전쟁 이후 프랑스는 아이티 노예의 가치를 포함한 재산 손실에 대한 보상금을 아이티에 요구했습니다. 독립 부채를 갚는 과정에서 아이티 경제에서 210억 달러가 빠져나갔습니다. 이는 국가의 경제 성장과 발전을 심각하게 저해했습니다."
 haiti.7.a: "배상을 요구한다"
 haiti.7.b: "배상을 요구하지 않는다"
 haiti.8.t: "아이티의 배상 요구"
 haiti.8.d: "우리는 아이티 혁명이 끝날 때 아이티에 부과했던 독립 부채를 상환하라는 요구를 받았습니다. [HAI.GetLeader]은(는) 해당 부채가 아이티에 초래한 경제적 피해에 대한 배상금으로 210억 달러를 지급하라는 공식 요청을 보내왔습니다. 어떻게 대응하시겠습니까?"
 haiti.8.a: "배상금을 지급한다"
 haiti.8.b: "배상을 거부한다"
 haiti.9.t1: "프랑스, 배상금을 지급하다"
 haiti.9.t2: "프랑스, 배상을 거부하다"
 haiti.9.d1: "프랑스가 독립 부채에 대해 아이티에 배상금을 지급하기로 결정했습니다. 이 수입의 증가는 우리 정부가 재투자하여 현재의 경제적 위상을 개선할 수 있게 해 줄 것입니다."
 haiti.9.d2: "프랑스는 독립 보상금 부채에 대한 배상금 지급을 거부했습니다. 이러한 거부는 실망스럽지만, 결국 그들이 거부할 만도 하다는 생각이 듭니다."
 haiti.9.a: "멋진 날이다!"
 haiti.9.b: "유감스럽다"
 haiti.10.t: "아미오 메타예와 식인 군대"
 haiti.10.d: "아미오 메타예는 북부 지역의 저명한 갱단 두목입니다. 메타예는 과거 우리 정부에 고용되어 야당을 올바른 편으로 설득하는 일을 도운 적이 있습니다. 작년 말 방화 혐의로 체포된 이후 그는 여러 차례 반정부 폭동 등을 주도했습니다. 이는 우리의 이미지에 타격을 주기 시작했으며 나라 안에 더 큰 혼란을 일으키고 있습니다."
 haiti.10.a: "아미오를 제거한다"
 haiti.10.b: "살려 둔다"
 haiti.11.t: "시신으로 발견된 아미오 메타예"
 haiti.11.d: "메타예는 오늘 일찍 눈, 심장, 간이 없는 채로 숨진 채 발견되었습니다. 그의 동생 뷔퇴르 메타예가 형의 갱단인 식인 군대의 통제권을 장악했습니다. 그는 즉시 갱단의 이름을 아르티보니트 혁명 저항 전선으로 바꾸어 조직의 면모를 일신했습니다. 이러한 움직임이 우리나라에 어떤 의미를 지닐지는 아직 알 수 없습니다."
 haiti.11.a: "그 결과는 곧 드러날 것이다..."
 haiti.12.t: "아이티 주립대학을 습격한 아리스티드 지지자들"
 haiti.12.d: "일부 설명에 따르면 경찰의 지원을 받은 아리스티드 지지자들이 아이티 주립대학의 사회과학부에 난입했습니다. 이 공격은 그날 늦게 예정되어 있던 학생 주도의 반정부 시위의 서막으로 보입니다."
 haiti.12.a: "정세가 달아오르고 있다"
 haiti.13.t: "폭력 사태로 번진 학생 시위!"
 haiti.13.d: "포르토프랭스의 학생 시위가 폭력적으로 변했습니다. 민주주의와 민주적 가치에 대한 지속적인 공격으로 학생층과 정부 사이의 긴장이 걷잡을 수 없이 커졌습니다. 시위대의 폭동이 점점 격해지자 경찰이 신속히 진압했습니다. "
 haiti.13.a: "경찰관들을 문책한다"
 haiti.13.b: "그들은 수업에나 들어가 있어야 한다"
 haiti.14.t: "고나이브를 장악한 반군"
 haiti.14.d: "아르티보니트 혁명 저항 전선이 현지 경찰과 보안군을 격퇴하고 고나이브를 장악했습니다. 북부에서 갑작스럽게 분쟁이 시작되면서 국민의 급작스러운 피난이 발생했으며, 북부에서 남부로 대규모 인파가 이동하고 있습니다. 반군의 의도는 분명해 보입니다. 그들은 현 정부가 전복되기를 원합니다. 신중하게 대처하지 않으면 위태로운 상황입니다. 잠시 최선의 대응책을 숙고해야 합니다."
 haiti.14.a: "비극적이다..."
 haiti.14.b: "보안군을 동원한다."
 haiti.14.tt: "우리는 사임하는 것을 고려해야 할지도 모릅니다..."
 haiti.15.t: "반군이 카프아이티엔을 점령했습니다."
 haiti.15.d: "최근 고나이브를 확보한 반군은 이제 카프아이티엔으로 이동했으며, 이전의 군인들과 경찰들이 그들과 합류했습니다. 메타예는 자신을 이 지역의 대통령으로 선언하며 보니파스에게 완전한 사임과 권력 이양을 요구하고 있습니다. 우리는 어떻게 진행해야 할까요?"
 haiti.15.a: "이제 시작할 때다..."
 haiti.15.b: "보안군을 동원해!"
 haiti.16.t: "아이티 쿠데타 발발!"
 haiti.16.d: "아이티는 부튀르 메타예와 그의 혁명적인 아르티보니트 저항전선이 국가의 북부를 장악하면서 혼란에 빠졌습니다. 시간이 촉박하며, 카리브 공동체는 국제 평화유지군을 끌어들여 이웃 국가의 안정을 도와야 한다고 촉구하고 있습니다. 우리는 어떻게 진행해야 할까요?"
 haiti.16.a: "국가에 개입하라!"
 haiti.16.b: "간섭하지 말자"
 haiti.17.t: "트로피컬 에어웨이즈 항공편 1301"
 haiti.17.d: "오늘 짧은 구간의 여객기 사고가 발생했으며, 이는 아이티 역사상 두 번째로 치명적인 항공사고로 기록되었습니다. 사고로 승객과 승무원 전원이 사망했습니다. 사고는 이륙 후 10분 만에 발생했으며, 공항에서 멀지 않은 사탕수수 밭에 추락했습니다. 사고의 원인으로는 화물 문이 비행 중에 열렸고, 현지 공항의 비효율적인 CRM(항공기 운항 관리) 등이 언급되었습니다."
 haiti.17.a: "정말 비극적인 일이군"
 haiti.18.t: "내일을 위한 작전"
 haiti.18.d: "아이티의 시민 불안정은 카리브 지역의 지역 안정에 문제를 일으키고 있습니다. 프랑스 역시 이 지역에 개입하려는 계획을 가지고 있습니다. 우리는 그들과 함께 \"내일을 위한 작전(Operation Secure Tomorrow)\"을 실행하여 하이티를 상대적으로 안정된 상태로 되돌릴 수 있습니다."
 haiti.18.a: "아이티에 개입하라."
 haiti.18.b: "외국의 개입을 규탄하라."
 haiti.19.t1: "미국의 작전 지원"
 haiti.19.t2: "미국의 작전 미지원"
 haiti.19.d1: "미국은 아이티에서 \"내일을 안전하게\"라는 작전을 위한 군을 파견했습니다. 독재적인 아리스티드 정부를 전복하려는 반군들이 우리의 지원을 받을 것입니다."
 haiti.19.d2: "미국은 아이티에 군을 파견하지 않기로 결정했습니다. 우리는 미국 없이 우리의 길을 결정해야 할 것입니다."
 haiti.19.a: "미국인들은 우리와 함께이다!"
 haiti.19.b: "겁쟁이들!"
 haiti.19.c: "그들은 정말로 개입해서는 안 됩니다."
 haiti.20.t: "외국 평화 유지군"
 haiti.20.d: "The instability in our great country has caused the international community at large to take notice. Forces from the United States, France and other countries have begun to deploy peacekeeping resources to the region to combat the anti-Government forces which have seized the northern part of the nation."
 haiti.20.a: "도움에 감사를 표하라!"
 haiti.20.b: "우린 지원이 필요없어"
 haiti.20.tt1: "[FRA.GetNameWithFlag]는 곧 외국 지원을 보낼 가능성이 큽니다."
 haiti.20.tt2: "[USA.GetNameWithFlag]는 곧 외국 지원을 보낼 가능성이 큽니다."
 haiti.21.t: "아이티 내전이 끝나다"
 haiti.21.d1: "'인육 군대'와 형제에 대한 전투가 마침내 종료되었습니다. 이제 상황은 우리에게 크게 유리하게 돌아갔으며, 국가가 장-베르트랑 아리스트이드 대통령의 이름 아래 회복되었습니다. 경찰 부대는 밀리턴트 갱단에 맞서 싸우며 뛰어난 용기를 보여주었습니다. 아이티는 다시 한 번 온전하게 되었습니다."
 haiti.21.d2: "전쟁은 결국 장-베르트랑 아리스트이드의 퇴진과 보니파스 알렉산드르의 임시 대통령 취임으로 마무리되었습니다. 아이티는 다시 평화를 맞이하며, 일몰이 이 갈등을 끝내고 있습니다. 반군 세력은 갈등의 전환 과정에서 무기를 내려놓았습니다. 이번 갈등은 성공적으로 결말을 맺었고, 그 후의 결과는 시간이 지나면서 드러날 것입니다."
 haiti.21.a: "아이티를 위한 새로운 여명"
 african.2.t: "2010년 니제르 홍수"
 african.2.d: "파괴적인 홍수가 니제르 전역을 휩쓸어 111,000명이 넘는 사람들이 집을 잃었고 광범위한 파괴가 발생했습니다. 니제르 강은 수 세대 만에 최고 수위로 불어나 제방을 무너뜨리고 인근 지역 사회를 침수시켰습니다. 국지적 재난으로 시작된 것이 이제 지역 전체의 대재앙으로 번져, 홍수는 니제르 강을 따라 나이지리아, 가나, 부르키나파소, 토고, 베냉 등 인접국으로 퍼지고 있습니다. 중앙아프리카 공화국, 모로코, 알제리 북부 등 더 북쪽에서도 추가 폭풍이 발달하면서 지역 전역의 더 많은 지역 사회를 위협하고 있어 인도주의 위기는 계속 악화되고 있습니다."
 african.2.a: "지원을 보낸다"
 african.2.b: "현지에서 알아서 처리하게 둔다"
 SHB_state_offensive_idea: "이슬람 법정 연합 공세"
 SHB_insurgency_idea: "활발한 반란"
 somalia.10.b_TT: "§Y[SHB.GetName]§!(으)로 플레이"
 somalia.15.t: "수도의 지위"
 somalia.15.d: "수도에 여전히 영향을 미치는 지속적인 폭력과 불안 때문에, 정부가 모가디슈로 이전할 수 있을 때까지 TFG의 임시 거점으로 각 도시를 평가하기 위해 바이도아와 조하르에 공식 대표단이 파견되었습니다."
 somalia.15.a: "바이도아가 좋은 장소가 될 것이다"
 somalia.15.b: "조하르가 우리에게 적합할 것이다"
 somalia.15.c: "젠장, 그냥 모가디슈에 세우자"
 somalia.20.t: "소말리아 이슬람 법정 평의회"
 somalia.20.d: "수년간 모가디슈 전역에서 영향력을 키워 온 소말리아 이슬람 법정 평의회(SCIC)는 많은 이들에게 유일한 법과 질서의 기구 역할을 하고 있습니다. 그러나 이들은 정치 군사 집단인 알이티하드 알이슬라미야와의 연계 및 다수 법정의 엄격한 샤리아 해석 집행으로 인해 감시를 받고 있습니다."
 somalia.20.a: "골치 아픈 일이다"
 somalia.20.b: "군벌들을 그들에게 보낸다"
 somalia.20_TT: "§Y모가디슈§!에서 §Y소말리아 이슬람 법정 평의회§!의 영향력이 커지면 수도에서 §R폭력§!과 §R불안정§!이 증가할 수 있습니다."
 somalia.21.t: "군벌들, 모가디슈에서 동맹 결성"
 somalia.21.d: "소말리아의 여러 군벌과 사업가들이 평화 회복 및 대테러 동맹(ARPCT)을 결성했습니다. 이는 소말리아에 대한 또 다른 개입을 피하려는 시도에서 이슬람 법정 연합(ICU) 인사들을 추적하기 위한 미국 중앙정보국의 프로젝트였습니다. 나이로비에 주둔한 CIA 요원들이 소말리아 민병대에 분배할 거액의 자금을 가지고 모가디슈의 군벌이 통제하는 활주로에 착륙했습니다."
 somalia.21.a: "뱀의 머리를 겨눈 총구"
 somalia.21.b: "미국의 간섭을 용납하지 않는다 - 군벌들을 분쇄한다"
 somalia.21.c: "CIA 연락책이 누구인가? 우리도 돈을 좀 받고 싶다"
 somalia.23.t: "TFG를 모가디슈에서 몰아낸 군벌들"
 somalia.23.d: "우리는 군벌과 법정에 충성하는 두 세력 모두에게 모가디슈에서 쫓겨나 지방으로 밀려났습니다. "
 somalia.23.a: "우리의 통제력은 제한적인 듯하다"
 somalia.23.a_TT: "§Y법정§!이 영향력을 공고히 하면 §Y군벌들§!의 §Y모가디슈§! 장악력이 약해질 수 있습니다."
 somalia.26.t: "군벌들, 공격 확대"
 somalia.26.d: "원인 불명의 암살과 실종이 모가디슈 전역에서 대거 발생했습니다. 이슬람 법정은 군벌들이 법정 고위 관리들을 표적으로 삼았다고 주장합니다. '청년단' 또는 알샤바브라 불리는 군사 조직이 군벌들에 맞서 싸우는 수단으로 부상했습니다. 법정은 소말리아 군벌들이 미국 정보요원들과 협력하여 납치를 저지르고 있다고 주장합니다."
 somalia.26.a: "도시가 불길 속으로 빠져든다"
 somalia.24.t: "이슬람 법정, 모가디슈 장악"
 somalia.24.d: "이슬람 법정은 제2차 모가디슈 전투에서 군벌 동맹을 결정적으로 격파하고 수도에 대한 완전한 통제권을 얻었습니다. 이슬람 법정은 이제 소말리아 중부를 향한 공세를 시작했으며, 법정 지도부는 TFG와 협상하여 TFG가 통합하고 다시 모가디슈로 진입할 수 있도록 할 의도를 갖고 있습니다."
 somalia.24.a: "망치를 계속 내리친다"
 somalia.24.b: "회담 개최에 동의한다"
 SOM_Khartoum_Talks_TT: "§Y하르툼 회담§!을 시작합니다."
 somalia.29.t: "ONLF, 에티오피아 헬리콥터 격추"
 somalia.29.d: "오가덴 민족해방전선(ONLF)은 소말리아로 향하던 에티오피아 군 헬리콥터를 격추했다고 발표하고, 이슬람 법정 연합에 에티오피아의 개입을 경고했습니다. 에티오피아 민병대 200명이 헬리콥터 두 대로 착륙하여 와지드를 장악한 뒤, ICU는 TFG와의 회담에서 퇴장했습니다. 에티오피아는 소말리아에 병력이 있다는 사실을 부인했습니다. "
 somalia.29.a: "ICU, 회담을 중단하다"
 somalia.32.t: "지역 부족장들, 갈카이오 장악 "
 somalia.32.d: "소말리아 중부의 지역 부족장들과 민병대는 커져 가는 이슬람주의 영향력과 지속되는 불안정에 대한 방어 조치로, 갈가두드와 무두그 일부를 아우르는 자치 행정부 갈무두그의 결성을 발표했습니다."
 somalia.32.a: "전선이 무너지는 듯하다"
 somalia.34.t: "푼틀란드, TFG와 결별"
 somalia.34.d: "소말리아 북동부의 지도자들이 안보 제공 실패를 이유로 푼틀란드의 결성을 선언했습니다."
 somalia.34.a: "통제력의 완전한 상실"
 somalia.35.t: "이슬람 법정 연합, 지방으로 퇴각"
 somalia.35.d: "수도 모가디슈가 함락된 후 이슬람 법정 연합은 도시를 포기할 수밖에 없었습니다. ICU 전투원들은 질리브에서 최후의 항전을 시도했으나 결국 압도당해 흩어졌습니다. 살아남은 병력은 이제 케냐 국경 쪽으로 달아나 지방 곳곳으로 흩어졌습니다.\n\n소말리아 국가는 여전히 혼란 상태입니다. 국토의 넓은 지역은 계속해서 강력한 부족장들에게 충성을 맹세하고 있으며, ICU의 급진 청년 운동(알샤바브)은 여전히 농촌 지역 전역에서 활동하고 있습니다."
 somalia.35.a: "전쟁은 끝나지 않았다"
 somalia.35_TT: "분쟁은 §R전투가 다시 확대될§! 때까지 흩어진 무장 세력이 농촌 지역 곳곳에서 활동하는 §Y반란 국면§!에 접어들었습니다."
 somalia.50.t: "알샤바브, 세력 결집"
 somalia.50.d: "알샤바브가 소말리아 중부와 남부 전역에서 세력을 결집하기 시작했습니다. 이 조직은 여러 무장 파벌을 통합했다고 주장합니다.\n\n모가디슈에서는 원인 불명의 연쇄 암살이 지역 관리, 부족 원로, 보안 인사들을 겨냥했습니다. 알샤바브는 외국 정보기관, 특히 미국을 폭력의 배후로 지목하는 성명을 내어 이 살인을 더 큰 외세 음모의 일부로 규정했습니다.\n\n주장이 무엇이든, 되살아난 폭력은 수도를 한층 더 불안정하게 만들었고 무장 조직망이 여전히 깊이 뿌리내리고 있음을 보여주었습니다. 분석가들은 중부와 남부 지역에서 알샤바브의 단결이 커지는 것이 보다 조직적인 반란의 시작을 알리는 신호일 수 있다고 경고합니다."
 somalia.50.a: "아직 태어나지 않은 자는 죽음을 알지 못한다"
 somalia.1004.t: "소말리아 군벌들, 모가디슈 장악"
 somalia.1004.d1: "무법천지인 모가디슈의 거리에 새로운 권력이 등장했습니다. 이 도시에서 가장 악명 높은 군벌과 사업가 여러 명이 전통적인 경쟁 관계를 접어 두고 평화 회복 및 대테러 동맹(ARPCT)을 결성했습니다.\n\n현지 목격자들은 표식 없는 항공기가 군벌이 통제하는 활주로에 도착하여 나이로비에서 온 외교관들과 미국 달러가 가득 든 가방들을 실어 날랐다고 전합니다. CIA가 뒷받침하는 이 프로젝트는 미국이 알카에다를 비호한다고 비난하는 이슬람 법정 연합(ICU)을 추적하기 위해 지역 실력자들을 대리인으로 이용하는 것을 목표로 합니다. 많은 소말리아인에게 이는 수십 년간 이 나라를 무정부 상태로 몰아넣은 바로 그 자들에게 자금을 대어 우리의 주권을 우회하려는 외세의 시도로 보입니다. 군벌들의 주머니가 외국 현금으로 두둑해지는 가운데, ICU는 이를 외세가 후원하는 괴뢰들을 상대로 한 성전으로 규정하기 시작했습니다."
 somalia.1004.d2: "1990년대의 참담한 개입 이후, '소말리아 증후군'은 계속해서 미국 외교 정책을 괴롭히고 있습니다. 그러나 이슬람 법정 연합(ICU)의 부상과 아프리카의 뿔 지역 알카에다 요원들과의 연계 의혹은 간과할 수 없습니다. 미군 지상군을 투입하지 않고 이 위협에 대처하기 위해 CIA는 비밀 지원 프로그램을 개시했습니다.\n\n나이로비에 있는 우리 지부는 ARPCT로 알려진 연합을 성공적으로 중재했습니다. 세속주의 소말리아 군벌들에게 현금을 직접 건네줌으로써 우리는 이들이 고가치 표적을 추적하도록 할 계획입니다. 국무부 관리들은 이들 실력자를 지원하면 대중의 반발을 살 수 있다고 경고하지만, 정보 기관은 이 지역 민병대가 ICU가 모가디슈를 세계적 지하드의 새로운 기지로 만드는 것을 막기 위해 우리가 가진 가장 효과적인 수단이라고 주장합니다."
 somalia.1004.d3: "소말리아의 여러 군벌과 영향력 있는 사업가들이 평화 회복 및 대테러 동맹(ARPCT)이라 칭하는 조직의 결성을 선언했습니다. \n\n분석가들은 ARPCT가 미국 중앙정보국의 프로젝트에 불과하다는 견해를 갖고 있습니다. 또 한 번의 직접적인 군사 개입에 따른 정치적 여파를 피하려는 노력의 일환으로, 나이로비에 주둔한 CIA 요원들이 현금 가방을 들고 군벌이 통제하는 활주로에 착륙한 것으로 전해집니다. 이 자금은 지역 민병대에 분배되고 있으며, 단 하나의 목표를 갖고 있습니다. 사우디 이슬람주의 단체 알카에다와 협력한다고 주장되는 부상 중인 이슬람 법정 연합(ICU) 인사들을 추적하여 제거하는 것입니다."
 somalia.1004.a: "위험한 도박이다"
 somalia.1005.t: "제2차 모가디슈 전투"
 somalia.1005.d1: "수도의 위태로운 평화가 깨졌습니다. 막대한 외국 자본이 유입되었음에도 평화회복 및 대테러 동맹(ARPCT)은 도시를 장악하는 데 실패했습니다. 모가디슈는 미국의 지원을 받는 군벌들과 부상하는 이슬람 법정 연합(ICU) 사이의 혼란스러운 전장으로 전락했습니다. \n\n 유혈 사태를 막기 위한 마지막 시도로, 영향력 있는 지역 원로들과 기업 지도자들이 휴전을 중재했습니다. ICU 지도부는 휴전을 준수하겠다고 공개적으로 약속했지만, 중재자들에 따르면 군벌 동맹은 결정을 미루다 끝내 이행을 거부했습니다. 군벌들의 망설임을 약함의 신호로 본 ICU는 대규모 합동 공세를 개시했습니다. ICU는 이미 주요 도로와 기반시설을 장악하여 사실상 수도를 분할했습니다. 더욱 우려스러운 것은, 법정 연합이 더 이상 도시에 갇혀 있지 않겠다는 신호를 보냈다는 점입니다. ICU 민병대는 소말리아 본토를 향한 전면 공세에 나서, 오랫동안 과도연방정부(TFG)와 독립 씨족들이 장악해 온 도시들로 진군하기 시작했습니다."
 somalia.1005.d2: "오늘 이슬람 법정 연합(ICU)은 모가디슈 전투에서 완전한 승리를 선언했습니다. 모가디슈가 민중 봉기에 휩싸이면서 평화회복 및 대테러 동맹(ARPCT)은 붕괴한 것으로 알려졌으며, ARPCT 지도자들은 이웃 에티오피아로 달아나거나 우리의 해상 함선으로 피신처를 구하고 있습니다. \n\n현지 보고에 따르면 ICU는 더 이상 모가디슈만을 위해 싸우는 것이 아닙니다. ICU는 소말리아 내륙으로 전격적인 공세를 개시하여 군벌의 검문소를 쓸어내고 지역 주민들의 지지를 얻고 있습니다. 우리의 동맹은 전면 후퇴 중이며 TFG는 마비 상태입니다."
 somalia.1005.d3: "오늘 이슬람 법정 연합(ICU)은 모가디슈 전투에서 완전한 승리를 선언했습니다. 모가디슈가 민중 봉기에 휩싸이면서 미국의 지원을 받던 평화회복 및 대테러 동맹(ARPCT)은 붕괴한 것으로 알려졌으며, ARPCT 지도자들은 이웃 에티오피아로 달아나거나 미국의 해상 함선으로 피신처를 구하고 있습니다.\n\n분석가들은 1991년 이래 처음으로 단일 세력이 소말리아 수도에 어느 정도의 질서를 세우고 항구를 다시 열었다고 보고 있습니다. 워싱턴은 ICU가 알카에다 세포를 비호하고 있을지 모른다는 중대한 우려를 표명했으며, 아디스아바바의 에티오피아 정부는 강력해진 이슬람 국가가 오가덴을 둘러싼 오랜 영토 분쟁을 다시 불러일으킬 것을 우려하여 국경을 따라 사단 동원을 시작했습니다. "
 somalia.1012.t: "모가디슈 함락 후 흩어지는 이슬람 법정 연합"
 somalia.1012.d: "모가디슈 함락은 이슬람 법정 연합에 큰 타격을 입혔습니다. 수도를 잃은 뒤 ICU 병력은 재집결하여 질립 마을에서 최후의 항전을 시도했으나 결국 실패했고, 남은 전투원들은 케냐 국경 쪽으로 퇴각할 수밖에 없었습니다.\n\nICU의 중앙 통제가 무너졌음에도 소말리아는 여전히 극도로 불안정합니다. 농촌 지역 대부분은 여전히 씨족 지도자들이 지배하고 있으며, 이슬람 법정 연합과 연계된 무장 청년 조직들은 전국에서 계속 활동하고 있습니다. 관측통들은 분쟁이 명확한 결말을 맺기보다 장기적인 반란 국면으로 접어들 수 있다고 경고합니다."
 somalia.1012.a: "소말리아의 미래는 여전히 불확실합니다."
 somalia.1013.t: "[SHB.GetName]의 공세"
 somalia.1013.d: "[SHB.GetName]은(는) 반란에서 공공연하고 조직적인 공세로 전환했습니다.\n\n소말리아 남부의 관목 지대부터 모가디슈 외곽에 이르기까지, 무장 세력은 주요 구역을 장악하고 정부 전초 기지를 유린했습니다. 전선의 보고에 따르면 중앙정부는 더 이상 전국에 자신의 의지를 관철할 수 있는 유일한 세력이 아닙니다."
 somalia.1013.a: "위험한 도박이다"
 Sao_Tome_e_Principe.1.t: "2001년 상투메 대통령 선거"
 Sao_Tome_e_Principe.1.d: "이 직위를 놓고 경쟁하는 두 주요 후보는 부유한 사업가이자 기독민주 보수 정당인 독립민주행동의 지도자 프라디크 드 메네제스와, 전 대통령이자 포르투갈 통치를 종식시킨 카네이션 혁명의 주도 세력이었던 좌익 민족주의 정당 MLSTP의 창립자인 그의 경쟁자 마누엘 핀투 다 코스타입니다. "
 Sao_Tome_e_Principe.1.a: "프라디크 드 메네제스."
 Sao_Tome_e_Principe.1.b: "마누엘 핀투 다 코스타."
 Sao_Tome_e_Principe.2.t: "헌법 개혁을 둘러싼 정치적 교착"
 Sao_Tome_e_Principe.2.d: "의회 과반이 승인한 [SAO.GetLeader]의 권한을 제한하는 헌법 개혁안을 두고 대치 상황이 벌어졌습니다. 의회는 국가 권력 분립의 모호함을 명확히 하고 반복되는 정치 위기를 피하려면 헌법 개혁이 필요하다고 밝혔지만, [SAO.GetLeader]은(는) 이를 자신의 입지를 약화시키는 요인으로 보고 있습니다. "
 Sao_Tome_e_Principe.2.a: "의회를 해산한다"
 Sao_Tome_e_Principe.2.b: "개혁에서 물러선다"
 Sao_Tome_e_Principe.3.t: "페레이라 소령의 쿠데타"
 Sao_Tome_e_Principe.3.d: "프라디크 드 메네제스가 나이지리아로 사적 방문을 떠난 사이, 페르난두 페레이라 소령과 기독민주전선 일원들이 이 지역의 빈곤을 끝내기 위한 정권 교체를 명분으로 정부를 전복하는 쿠데타를 일으켰습니다.\n\n 페레이라 소령은 수도 곳곳의 전략 거점을 장악했습니다. 반란군은 옛 남아프리카 제32 '버팔로' 대대 출신 지원병들로 전력을 보강했습니다. 불과 몇 시간 만에 마리아 다스 네베스 총리와 석유부 장관이 자택에서 체포되었습니다. 총리는 관저에서 벌어진 총격전 중 심장마비를 일으켜 경비 속에 입원했습니다."
 Sao_Tome_e_Principe.3.a: "프라디크 드 메네제스와 협상을 시작한다"
 Sao_Tome_e_Principe.3.b: "페레이라가 권력을 잡다"
 Sao_Tome_e_PrincipeNews.1000.t: "상투메 프린시페 쿠데타 주동자들, 권력 반환에 합의"
 Sao_Tome_e_PrincipeNews.1000.d: "프라디크 드 메네제스 대통령이 나이지리아로 사적 방문을 떠난 사이, 페르난두 페레이라 소령과 기독민주전선이 쿠데타를 일으켰습니다. 반란군은 전략 거점을 장악하고 관저에서 벌어진 총격전 중 심장마비를 일으킨 마리아 다스 네베스 총리를 체포했습니다. 그러나 국가 구국 군사정부는 단명하는 것으로 드러났습니다. 중재 끝에 페레이라 소령과 그의 추종자들은 권력을 반환하기로 합의했습니다. 양해 각서에 따라 쿠데타 주동자들은 즉각적인 헌정 질서 회복의 대가로 전면 사면을 받게 됩니다. 페레이라 소령은 자신의 목적이 빈곤과 부패를 척결하는 것이었다고 밝혔습니다."
 Sao_Tome_e_PrincipeNews.1000.a: "그들에게 행운을 빌어준다"
 Sao_Tome_e_PrincipeNews.1001.t: "상투메 프린시페 쿠데타"
 Sao_Tome_e_PrincipeNews.1001.d: "페르난두 페레이라 소령과 기독민주전선이 쿠데타를 일으켰습니다. 프라디크 드 메네제스 대통령이 나이지리아에 체류 중인 가운데, 반란군은 수도의 전략 거점을 장악했습니다.\n\n정부 관리들을 체포하는 과정에서 사태는 유혈로 번졌습니다. 마리아 다스 네베스 총리는 관저에서 벌어진 총격전 중 심장마비를 일으켜 현재 군 병원에서 경비 속에 억류되어 있는 것으로 알려졌습니다. 페레이라 소령은 구조적인 빈곤에 맞서기 위해 정권 교체가 필요하다고 밝혔습니다."
 Sao_Tome_e_PrincipeNews.1001.a: "군사 정권이 이보다 더 잘할 수 있을까"
 somalia.1005.a: "홍해의 새로운 '탈레반'인가?"
 somalia.1005.b: "미국의 대리 세력이 축출되었습니다."
 somalia.1005.c: "새로운 변화가 찾아왔습니다."
 COM_rejected_french_imperialism: "프랑스 제국주의 배격"
 AFRICA_adopt_the_cfa_franc: "CFA 프랑 채택"
 AFRICA_adopt_the_cfa_franc_desc: "CFA 프랑은 통화 안정성을 제공하며 프랑스 및 기타 프랑스어권 국가와의 무역을 촉진합니다. 이 통화를 채택하면 프랑스 국고의 보증을 받을 수 있으며, 더 넓은 프랑스어권 경제 공동체와 한층 긴밀하게 통합됩니다."
 central_africa.27.t: "중앙아프리카 재생 연합"
 central_africa.27.d: "흩어져 있던 중앙아프리카 정치의 자유주의 세력이 하나의 운동으로 결집했습니다. 아니세조르주 돌로게레를 중심으로 뭉친 중앙아프리카 재생 연합은 그의 대통령 출마에 앞서 이 나라 신자유주의의 현대적이고 친서방적인 얼굴로 자리매김하고 있습니다."
 central_africa.27.a: "자유주의의 새로운 얼굴"
