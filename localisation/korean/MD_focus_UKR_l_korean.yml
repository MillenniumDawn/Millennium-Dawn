 ukraine_praktyka_otaman_otaman_6x6_122_mission: "시제품: §Y오타만 6x6 122§!"
 ukraine_praktyka_otaman_otaman_6x6_122_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_6x6_122_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO 프락티카§!가 지뢰 방호 기능을 갖춘 새 6x6 차륜형 차체를 제작합니다. 이 차체에 얹는 첫 차량은 §Y2S1 그보즈디카§!의 122mm 포탑을 탑재합니다. 타이머가 끝나면 시제품이 완성됩니다.§!"
 ukraine_praktyka_otaman_otaman_8x8_mission: "시제품: §Y오타만 8x8§!"
 ukraine_praktyka_otaman_otaman_8x8_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_8x8_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO 프락티카§!가 §YBTR-60§!을 §Y오타만 8x8§!로 재제작합니다. 지뢰 방호형 새 차체, 병력용 후방 램프, 원격 조종 기관총을 갖춥니다. 타이머가 끝나면 시제품이 완성됩니다.§!"
 ukraine_praktyka_otaman_otaman_both_mission: "시제품: §Y오타만 6x6 122§!와 §Y오타만 8x8§!"
 ukraine_praktyka_otaman_otaman_both_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_both_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO 프락티카§!가 두 라인을 동시에 진행합니다. §Y2S1 그보즈디카§!의 122mm 포탑을 얹은 새 6x6 차체, 그리고 §YBTR-60§!을 재제작한 §Y오타만 8x8§!입니다. 타이머가 끝나면 두 시제품이 모두 완성됩니다.§!"
 ukraine_praktyka_otaman_otaman_6x6_73_mission: "시제품: §Y오타만 6x6 그롬§! 보병 전투차"
 ukraine_praktyka_otaman_otaman_6x6_73_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_6x6_73_for_tooltip\n\n\n\n\n\n\n\n\n§W같은 6x6 차체에 §YBMP-1§!의 73mm 포탑, 연막 발사기, 병력용 후방 램프를 갖춥니다. 타이머가 끝나면 시제품이 완성됩니다.§!"
 ukraine_praktyka_otaman_otaman_3_mission: "시제품: §Y오타만-3§!"
 ukraine_praktyka_otaman_otaman_3_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_3_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y오타만-3§!는 우리 해병대를 위한 보병 전투차입니다. 30mm 기관포와 바리어 미사일을 갖춘 §YBM-3M 슈투름-M§! 전투 모듈을 탑재합니다. 타이머가 끝나면 시제품이 완성됩니다.§!"
 ukraine_praktyka_otaman_otaman_8x8_shturm_mission: "시제품: §Y오타만 8x8 슈투름-M§!"
 ukraine_praktyka_otaman_otaman_8x8_shturm_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_otaman_8x8_shturm_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y오타만 8x8§!에 30mm 기관포와 바리어 미사일을 갖춘 §YBM-3M 슈투름-M§! 전투 모듈을 장착해 보병 전투차로 탈바꿈시킵니다. 타이머가 끝나면 시제품이 완성됩니다.§!"
 ukraine_praktyka_otaman_khorunzhyi_mission: "§YBTR-60M 호룬지§!용 튀르키예제 모듈"
 ukraine_praktyka_otaman_khorunzhyi_mission_desc: "\n\n\n\n\n\n£UKR_desctext_praktyka_khorunzhyi_for_tooltip\n\n\n\n\n\n\n\n\n§W§YNVO 프락티카§!는 §YBTR-60M 호룬지§!에 튀르키예제 원격 조종 기관총 모듈을 달고 싶어 합니다. 앙카라는 §Y튀르키예§!의 우리에 대한 우호도가 최소 §Y30§!에 이르면 거래를 승인합니다. 그 즉시 사업이 성공합니다.\n\n§R그 전에 타이머가 끝나면 사업은 실패합니다.§!§!"
 ukraine_praktyka_otaman.1.name: "오타만을 제안하는 프락티카"
 ukraine_praktyka_otaman.1.desc: "동부의 전쟁에는 우리 공장이 당장 만들 수 있는 장갑차가 필요합니다. 키이우의 기업 §YNVO 프락티카§!는 그것을 확보할 두 가지 방법을 제안합니다. 122mm 자주포를 시작으로 새로운 6x6 차륜형 차체를 제작하거나, 낡은 §YBTR-60§!을 지뢰 방호형 8x8 수송차로 재제작할 수 있습니다. 비용을 모두 대면 프락티카는 둘 다 진행할 수도 있습니다."
 ukraine_praktyka_otaman.1.a: "새 6x6 차체를 제작한다"
 ukraine_praktyka_otaman.1.b: "BTR-60을 8x8로 재제작한다"
 ukraine_praktyka_otaman.1.c: "두 라인 모두 자금을 지원한다"
 ukraine_praktyka_otaman.2.name: "오타만 6x6 122 공개"
 ukraine_praktyka_otaman.2.desc: "§YNVO 프락티카§!가 새 6x6 차체에 얹은 첫 차량을 공개했습니다. §Y오타만 6x6 122§!는 §Y2S1 그보즈디카§!의 122mm 포탑, 지뢰 방호 기능, 연막 발사기를 갖춘 차륜형 자주포입니다. 프락티카는 같은 차체로 보병 전투차 개발에 착수할 준비가 되어 있습니다."
 ukraine_praktyka_otaman.2.a: "생산 없이 설계만 채택한다"
 ukraine_praktyka_otaman.2.b: "설계를 채택하고 생산을 시작한다"
 ukraine_praktyka_otaman.2.c: "키이우에 생산 라인 비용을 지불한다"
 ukraine_praktyka_otaman.3.name: "오타만 6x6 그롬 공개"
 ukraine_praktyka_otaman.3.desc: "§Y오타만 6x6 그롬§!이 준비되었습니다. 6x6 차체에는 §YBMP-1§!의 73mm 포탑, 연막 발사기, 병력이 신속히 하차할 수 있는 후방 램프가 달려 있습니다. 프락티카는 이제 현대식 전투 모듈을 갖춘 해병대용 형식을 제안합니다."
 ukraine_praktyka_otaman.3.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.3.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.3.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.4.name: "오타만-3 공개"
 ukraine_praktyka_otaman.4.desc: "우리 해병대를 위한 §Y오타만-3§!이 준비되었습니다. §YBM-3M 슈투름-M§! 전투 모듈에는 30mm 기관포, 기관총, 바리어 미사일이 탑재되었고, 열상 조준경 덕분에 승무원이 야간에도 싸울 수 있습니다. 우리 해병 부대는 방호력이 더 높은 차량을 기대할 수 있습니다."
 ukraine_praktyka_otaman.4.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.4.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.4.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.5.name: "오타만 8x8 공개"
 ukraine_praktyka_otaman.5.desc: "§YNVO 프락티카§!가 §YBTR-60§! 한 대를 §Y오타만 8x8§!로 재제작했습니다. 새 차체는 승무원을 지뢰로부터 보호하고, 후방 램프가 비좁은 측면 해치를 대체하며, 원격 조종 기관총이 낡은 포탑을 대신합니다."
 ukraine_praktyka_otaman.5.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.5.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.5.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.6.name: "오타만 8x8의 미래"
 ukraine_praktyka_otaman.6.desc: "§YNVO 프락티카§!가 §Y오타만 8x8§!을 다음에 어디로 끌고 갈지 묻습니다. 같은 차체로 자주 박격포와 보병 전투차를 추가해 라인을 확장할 수 있습니다. 아니면 수송차 자체를 계속 개선할 수도 있습니다."
 ukraine_praktyka_otaman.6.a: "라인을 확장한다"
 ukraine_praktyka_otaman.6.b: "수송차를 개선한다"
 ukraine_praktyka_otaman.7.name: "오타만 8x8 박격포 수송차"
 ukraine_praktyka_otaman.7.desc: "프락티카가 우리 §YBTR-60§! 중 §Y40§!대를 §Y오타만 8x8§! 차체의 자주 박격포 수송차로 재제작했습니다. 이제 우리 박격포 부대는 훨씬 빠르게 이동하고 사격할 수 있습니다. 다음으로 프락티카는 같은 차체에 현대식 전투 모듈을 얹으려 합니다."
 ukraine_praktyka_otaman.7.a: "잘했다"
 ukraine_praktyka_otaman.8.name: "오타만 8x8 슈투름-M 공개"
 ukraine_praktyka_otaman.8.desc: "§Y오타만 8x8 슈투름-M§!이 준비되었습니다. 30mm 기관포와 바리어 미사일을 갖춘 §YBM-3M 슈투름-M§! 전투 모듈이 8x8 수송차를 보병 전투차로 탈바꿈시킵니다."
 ukraine_praktyka_otaman.8.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.8.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.8.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.9.name: "오타만 8x8 개선"
 ukraine_praktyka_otaman.9.desc: "프락티카는 수송차에 대해 두 가지 구상을 가지고 있습니다. 빠른 쪽은 14.5mm §YKPVT§!를 단 §YBRDM-2§! 포탑을 §Y오타만 8x8§!에 얹는 것입니다. 오래 걸리는 쪽은 §YBTR-60M 호룬지§!로, 튀르키예제 원격 조종 기관총 모듈을 갖춘 더 본격적인 재제작이며 앙카라의 승인이 필요합니다."
 ukraine_praktyka_otaman.9.a: "KPVT 포탑을 장착한다"
 ukraine_praktyka_otaman.9.b: "호룬지를 개발한다"
 ukraine_praktyka_otaman.10.name: "오타만 8x8 KPVT 공개"
 ukraine_praktyka_otaman.10.desc: "§Y오타만 8x8 KPVT§!가 준비되었습니다. §YBRDM-2§! 포탑 덕분에 수송차는 14.5mm §YKPVT§!와 동축 기관총을 갖추게 되었으며, 이는 경차량과 보병을 상대하기에 충분합니다."
 ukraine_praktyka_otaman.10.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.10.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.10.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.11.name: "BTR-60M 호룬지 공개"
 ukraine_praktyka_otaman.11.desc: "앙카라가 거래를 승인했으며, §YNVO 프락티카§!가 §YBTR-60M 호룬지§!를 완성했습니다. 재제작한 수송차는 열상 조준경을 갖춘 튀르키예제 원격 조종 기관총 모듈, 연막 발사기, 병력용 후방 램프를 갖추고 있습니다."
 ukraine_praktyka_otaman.11.a: "$ukraine_praktyka_otaman.2.a$"
 ukraine_praktyka_otaman.11.b: "$ukraine_praktyka_otaman.2.b$"
 ukraine_praktyka_otaman.11.c: "$ukraine_praktyka_otaman.2.c$"
 ukraine_praktyka_otaman.12.name: "무산된 호룬지 사업"
 ukraine_praktyka_otaman.12.desc: "앙카라가 원격 조종 기관총 모듈의 판매를 승인하지 않았으며, §YNVO 프락티카§!는 §YBTR-60M 호룬지§!를 포기했습니다."
 ukraine_praktyka_otaman.12.a: "안타깝다"
