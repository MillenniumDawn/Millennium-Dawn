 EUevent.3.t: "유럽 합중국"
 EUevent.3.d: "제2차 세계대전이 끝난 후 처칠은 연설에서 다음과 같이 결론지었습니다:\n\"우리는 일종의 유럽 합중국을 건설해야 합니다. 오직 이 방법을 통해서만 수억 명의 노동자들이 삶을 가치 있게 만드는 소박한 기쁨과 희망을 되찾을 수 있을 것입니다. 그 과정은 간단합니다. 필요한 것은 오직 수억 남녀가 그릇된 길 대신 올바른 길을 택하고, 저주 대신 축복을 보상으로 얻고자 하는 결의뿐입니다.\"\n\n\"그러므로 제가 여러분께 말씀드립니다: 유럽이여, 일어나라!\"\n\n70년이 넘는 유럽 통합의 여정 끝에 §C[EUU.GetFlag] 유럽연합§! 회원국들은 자국의 주권을 포기하고 §C[EUU.GetFlag] 유럽 합중국§!을 결성하기로 결정했습니다."
 EUevent.3.a: "환희의 송가여!"
