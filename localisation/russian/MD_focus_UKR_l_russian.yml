 ukraine_modernize_sov_equipment_btr_60_modernization_bulgaria_plan_tt: "Мы просим у §YБолгарии§! §Y100§! §YБТР-60ПБ§! тремя партиями: §Y20§!, затем §Y40§! и §Y40§!. Для каждой партии нужно согласие §YБолгарии§!; её можно ввести в строй как есть или переделать в §YБТР-60Д§!."
