l_japanese:
 SRA_idea_isolationist_focused_foreign_office: "反外交政策支配"
 SRA_idea_isolationist_focused_foreign_office_desc: "我が国の状況とその突発的で不安定な「誕生」を受けて、政府内外の多くの人々が外交政策を考慮する余裕すら持っておらず、その内容については言うまでもない。現時点では、外務省は実質的な任命というよりも、政府の体裁を整えるための場当たり的な存在と見なされている。"
 SRA_idea_neighborhood_foreign_policy: "限定的な外交政策プログラム"
 SRA_idea_neighborhood_foreign_policy_desc: "我が国の発展と共に、南の偉大な国への国民の認識も変化してきた。これからは国境の向こうに目を向け、友を作ると同時に、敵も存在することを認識しなければならないだろう。しかし現時点では、地球の反対側ではなく、まずは国境のすぐ先に何があるのかを理解することを目指す。"
 SRA_idea_historical_tensions: "歴史的緊張"
 SRA_idea_historical_tensions_desc: "アメリカ連合国や南部全体の歴史は、奴隷制度やジム・クロウ法、分離政策、その他数々の問題にまみれている。しかし、この困難で血なまぐさい過去にもかかわらず、古い亡霊を振り払い、南部のイメージだけでなく、すべての南部市民の生活を向上させる道を模索しなければならない。"
 Southern_Republic_of_America_focus: "南部アメリカ共和国 国家方針ツリー"
 CSA_focus_creating_a_federal_government: "連邦政府の設立"
 CSA_focus_creating_a_federal_government_desc: "社会は我々の目の前で崩壊してしまった。平和や安定に向けて前進するためには、何らかの中央政府を創設し、組織立てていかなければならない。"
 CSA_focus_bayou_battle: "バイユーの戦い"
 CSA_focus_bayou_battle_desc: "ルイジアナ州は、湾岸の巨大な交易拠点であるとともに、強力な経済力を持っている。しかし、市民サービスを回復させるには、この州に安定感を取り戻させる必要がある。"
 CSA_focus_cajun_cookin: "ケイジャン料理"
 CSA_focus_cajun_cookin_desc: "With economic semblance now restored we can look to reintroducing civil services and order to the state. This is but a stepping stone to the road to unity. For it is this unity that will solidify our future."
 CSA_focus_mississippi_mayhem: "ミシシッピの騒乱"
 CSA_focus_mississippi_mayhem_desc: "ミシシッピ川は交易と防衛にとって、経済的にも戦略的にも不可欠な拠点である。河川や湾岸開発のようなものを活性化させるには、州の経済力を回復させなければならない。"
 CSA_focus_magnolia_miracle: "マグノリアの奇跡"
 CSA_focus_magnolia_miracle_desc: "州経済は正常化しつつあり、事態は沈静化し始めている。今こそ、消防、救急、法執行機関といった市民サービスを再導入する時だ。まもなく、州は南部の家族のもとに戻るだろう。"
 CSA_focus_the_rotten_peach: "腐った桃"
 CSA_focus_the_rotten_peach_desc: "連邦の大暴動がジョージア州を襲ったとき、それは州を沸騰させ、荒廃させた。アトランタは大規模な略奪、ギャングの暴力、その他あらゆるものでそれ自体が戦争地帯だった。今、埃が収まったところで、州の安定という点でどこかに到達するためには、何らかの再建を行わなければならない。"
 CSA_focus_the_fruitful_venture: "実りある冒険"
 CSA_focus_the_fruitful_venture_desc: "ジョージア州の再建への投資により、我々は今、行政の結束と市民サービスを再確立し、州の法と秩序を完全に回復させる方向に向かうことができる。"
 CSA_focus_a_carolina_reaping: "カロライナの収穫"
 CSA_focus_a_carolina_reaping_desc: "サウスカロライナ州の経済は元々大したものではなかったが、あらゆるものの絶対的な状態を考えると、結束と機能的な社会の理念を取り戻すために投資しなければならない。これはまた、他の州との交易や沿岸港の運営にも役立つだろう。"
 CSA_focus_sweet_caroline: "スイーート・キャロライン"
 CSA_focus_sweet_caroline_desc: "バン、バン、バーン。州は今や非常に良好に見え、残っている市民サービスや行政手段を復活させることができるだろう。しかし、秩序を維持するために、いずれにせよ新しいものに投資したいと思うだろう。"
 CSA_focus_alabama_abyss: "アラバマの深淵"
 CSA_focus_alabama_abyss_desc: "アラバマ州、ミシシッピ州自体に次ぐ、民族的暴力の唯一の真の競争相手だ。この州はより良い日々を見てきたが、それに対する真の支配を確保したいのであれば、何かを取り戻す必要がある。湾岸沿いの経済活動を組織し、何らかの電力網を設置することから始める。"
 CSA_focus_rose_of_alabamy: "アラバミーの薔薇"
 CSA_focus_rose_of_alabamy_desc: "ミシシッピの谷から、我々は今、アラバマを咲き誇る新たな薔薇に変えた。これをもって、我々の公正な国家内における州の平和と安定を確保するために、市民サービスと法執行機関の導入を目指す。"
 CSA_focus_florida_flounder: "フロリダの flounder [魚の一種、または、もがくの意]"
 CSA_focus_florida_flounder_desc: "The sandbar that is the state of Florida is a mess in its own right even before the fall of the union. A massive tourist and vacationing spot now turned into a shell of its former self. It is this knowledge we must use to better plan and better future proof economic and city planning so we avoid the hot spot attraction it had and will likely return to once we ensure the stability of our nation."
 CSA_focus_the_sun_shines_once_more: "太陽は再び輝く"
 CSA_focus_the_sun_shines_once_more_desc: "経済活動は今や名目上のものであり、水や電気のような特定のものは再導入することができた。今こそ、この砂浜のような州に再び太陽を輝かせ、市民サービスと行政事務を組織し、この州を南部の家族へ完全に再統合することを確実にする時だ。"
 CSA_focus_raleigh_rumble: "ローリーの騒動"
 CSA_focus_raleigh_rumble_desc: "姉妹州であるノースカロライナで取引をする準備をしよう。水道や電力インフラ、そして何らかの経済を確立することで、州にある程度の平和を取り戻すことができるだろう。"
 CSA_focus_sisters_united_once_more: "姉妹は再び団結"
 CSA_focus_sisters_united_once_more_desc: "ノースカロライナ州の事態が安定し始めたことで、州の法と秩序の回復に目を向け、この失われた姉妹が南の姉妹州と再会する道を開くことができる。そして、我々の南部一家のこの楽しい再会に加わるのだ。"
 CSA_focus_tennessee_tumble: "テネシーの転落"
 CSA_focus_tennessee_tumble_desc: "テネシー渓谷、偉大で平和な州。南部の音楽文化の本拠地であり、真の南部と、北部のヤンキーや中西部の人々の前のアパラチア中間地帯との境界でもある。州にある程度の安定を取り戻すための建設努力と手段を再開するために、水路を活用しなければならない。"
 CSA_focus_nashville_renewal: "ナッシュビル再生"
 CSA_focus_nashville_renewal_desc: "サービスと安定が州に戻り始めたことで、共和国の他の地域内で州を適切に統治するための結束力のある市民サービスと手段を再建することにより、これを確固たるものにすることを目指す。"
 CSA_focus_arkansee_saw: "アーカンソー・シーソー"
 CSA_focus_arkansee_saw_desc: "The strange balance of the state of Arkansas is one which does kind of baffle even our administration. But during the great riots, most of the economy was concentrated in places like Little Rock and Fayetteville, etc. But aside from this not much in the state did honestly change and so we've only to rebuild these hubs and help out those who need water and food until we can restore proper order to the region."
 CSA_focus_fort_smith_fantasy: "フォートスミス・ファンタジー"
 CSA_focus_fort_smith_fantasy_desc: "州の復興と初期投資が実を結び始めたことで、行政と社会秩序が地域を掌握し始めることができる。法執行機関やその他の市民サービスは、社会の安定への道を切り開くのに役立つだろう。"
 CSA_focus_tulsa_troubles: "タルサの厄介事"
 CSA_focus_tulsa_troubles_desc: "オクラホマ州は、産業力の小さな拠点しかない、非常に農業的な州である。さらなる発展を考える前に、経済を修復し、再建し、多様化させる必要がある。こうすることで、かつての連邦政府が我々に対して行ったように、州内に分裂を生み出さないようにする。"
 CSA_focus_red_river_revival: "レッドリバーの復興"
 CSA_focus_red_river_revival_desc: "社会的な結束が戻り、投資が実際の結果をもたらし始めたことで、今やオクラホマを南部一家に再統合し始めることができる。どちらかというと従兄弟のようなものだが、それでも我々は彼らを同じように愛している。なぜなら家族はやはり家族だからだ。"
 CSA_focus_we_fought_all_the_way: "我々は最後まで戦った"
 CSA_focus_we_fought_all_the_way_desc: "我々は回復への長い道のりを歩んできたが、ついにそれを成し遂げた。南部一家は再び一つになり、今や我々は経済と政治の観点から新たな地平に目を向けることができる。"
 CSA_focus_the_political_circus: "政治サーカス"
 CSA_focus_the_political_circus_desc: "The state of politics in the modern age is but a circus in its own right. Nevertheless we must look to quell extremists, prop up stability and serious political movements as well as ensure we move forward and not backwards. It'll be a struggle in its own right, but it can't get any worse....right?"
 CSA_focus_the_center_mass_of_politics: "政治の中心勢力"
 CSA_focus_the_center_mass_of_politics_desc: "The political center is the most stabilizing force which we have in our political realm of understanding. Not entirely being \"go-getters\" per se these parties however are a safer bet to stabilizing and building up our nation for the world stage than the extremes and fringes of the window framework that is our Overton window. Regardless we still have a choice and we must make that choice sooner than later."
 CSA_focus_the_overton_window_shatters: "オーバートンの窓、粉砕"
 CSA_focus_the_overton_window_shatters_desc: "Through political lobbying as well as fear tactics and so forth, the results have led to a rise in support for more extreme and fringe parties over the political center of the nation. Our only hope is that these new waves don't destroy what little we have left of a nation."
 CSA_focus_ddp_secures_victory: "DDP、勝利を確保"
 CSA_focus_ddp_secures_victory_desc: "In a surprising turn of events the DDP or Dixie & Delta Party has turned their obscurities into an actual political victory. Some praise this as a step forward in things like industrialization and public transport. But others fear that the party is merely a facade to more oligarchic means. Regardless they have won and only time will tell if they are a force of good or bad."
 CSA_focus_administrative_overhaul_plan: "行政改革計画"
 CSA_focus_administrative_overhaul_plan_desc: "行政の絶対的な状態は、とりわけ、蔓延する汚職、予算手段を超える賄賂、そして良くても機能不全の官僚制度をもたらした。我々の計画と願望で近いうちにどこかに到達しようとするならば、この問題に正面から取り組まなければならない。"
 CSA_focus_comprehensive_healthcare_restructuring: "医療制度再編計画"
 CSA_focus_comprehensive_healthcare_restructuring_desc: "The CHR is a clean slate plan to start from the beginning and pre-emptively go after issues which arise as a national healthcare or even just a healthcare system of scale start to expand past a reasonable administrative point. Through redistricting and balancing of funding through regional, state and local administrative districts we help to decentralize and ensure the funding is better managed through locals who understand better. This will allow for direct and immediate needs of the facilities under their supervision to obtain their requests at a faster rate due to the more hands on understanding of this administrative level system. Consequently an oversight commission independent of the network will do periodical checks for corruption and ensure things like the budgets are going to where they are listed as going towards to prevent the infamous \"missing middle man\" that can happen in such an extensive network."
 CSA_focus_welfare_is_healthcare_plan: "福祉は医療計画"
 CSA_focus_welfare_is_healthcare_plan_desc: "The modern welfare state is in its own right a healthcare plan for the extremes of the populations in terms of age. Food stamps for those unable to acquire a job that fits the economic standard of living, social security for those who have dedicated their life to the economic growth of our nation and child care and assistance programs to help families who wish to grow and contribute new lives to our nation and its survival. It is therefore better to create a parallel plan similar to the Healthcare Restructuring plan as a way to limit national government need in the administration efforts. As well as with a similar oversight commission it will allow us to fine tune regulations and expansions related to said programs to get to who they need rather than who can abuse the system the best."
 CSA_focus_economic_opportunities_commission: "経済機会委員会"
 CSA_focus_economic_opportunities_commission_desc: "The EOC is a dedicated body which works with state governments in ensuring jobs which are available are shown and given the exposure to the public through job fairs and postings. The biggest issue anyone has is finding a job, getting one isn't that hard, but finding one is another story. Some may not know just what is open to them in their own neighborhood or county. That's where the EOC steps in and makes those unknowns into known."
 CSA_focus_revenue_revitalization_plan: "歳入活性化計画"
 CSA_focus_revenue_revitalization_plan_desc: "RRP（歳入活性化計画）は、我が国の歳入源の改善と将来構想を改革し、合理化し、奨励するための3段階計画である。初期段階は、税法の基本を整理し、やり直すことだ。"
 CSA_focus_modern_monetary_education: "現代貨幣教育"
 CSA_focus_modern_monetary_education_desc: "The MME plan is a revamping of the education curriculum to include and make essential the understanding as well as abilities to manage and properly comprehend spending and means of obtaining currency in a modern economy. This monetary focused education helps to pre-emptively teach and make ready new generations to be a part of the greater national economy in what way they can with the knowledge they need."
 CSA_focus_railroad_mania: "鉄道マニア"
 CSA_focus_railroad_mania_desc: "現代世界は処理能力とバルク品を必要としている。食料用の穀物、コンクリートや建築用の砂、リストは続く。我々の潜在能力を最大限に引き出し、我々自身の経済だけでなく世界経済にも足跡を残すために必要なのは、包括的な鉄道網を構築することだ。それは国家を社会的に結びつけるだけでなく、経済的にも結びつけ、国内能力と対外輸出入の結束を確保するものだ。"
 CSA_focus_decentralization_initiative: "地方分権化イニシアチブ"
 CSA_focus_decentralization_initiative_desc: "The national government only needs to acquire funding for its direct expenses. Things like the healthcare and social networks which are organized and created via the national government. However one approach to this sort of more top down thinking is to allow the dissemination of tax collection on the state level. This means that state officials can more flexibly adapt local taxes to suit the needs of their constituents and we can better keep in check the national spending and how we proceed on expansion of programs as well as planning out their futures."
 CSA_focus_strategic_power: "戦略的電力"
 CSA_focus_strategic_power_desc: "我が国の電力網は、我々の計画を従来の送電網よりも迅速かつ効率的に実行するための流動性と柔軟性を可能にする。鉄道プロジェクトと並行して発電所建設を組み込むことにより、これにより、バルク輸送と効率的な電力生産が可能になり、それを我が国とそのまもなく開発される土地全体に普及させることができる。"
 CSA_focus_investments_across_dixie: "ディキシー全域への投資"
 CSA_focus_investments_across_dixie_desc: "広大で優れた鉄道網を持つことを考えるならば、それを支える経済を持たなければならない。したがって、我々は偉大な国家の活力を確保するために、一連の投資計画でディキシー全域に投資する。"
 CSA_focus_civilian_industrial_expansions: "民間産業拡大"
 CSA_focus_civilian_industrial_expansions_desc: "The CIE is a series of investment plans to build up the manufacturing and general industrial base of our consumer and civilian sectors. The hope is to ensure a strong baseline to support not only our railroad plans but also create the real economic activities which creates an honest standard of living."
 CSA_focus_tech_and_service_diversification: "技術・サービス多様化"
 CSA_focus_tech_and_service_diversification_desc: "現代世界では、サービスのようなものや技術自体の盛んな革新が、我々が理解しなければならない現実である。したがって、より広範な世界市場で何かになろうとするならば、これらの種類の産業を創出するための一連の投資計画を推進しなければならない。"
 CSA_focus_defense_and_export_scheme: "防衛・輸出計画"
 CSA_focus_defense_and_export_scheme_desc: "D&ES（防衛・輸出計画）は、武器および海軍産業に関連する一連の民間および軍事プロジェクトである。この全体的な計画は、国内の整備だけでなく、それを必要とする可能性のある人々に生産された装備を輸出することによって、我々に少し余分な収入を与えることを保証することだ。最近、紛争に不足はないようだ、それは確かだ。"
 CSA_focus_mississippi_central_expansions: "ミシシッピ中央鉄道拡大"
 CSA_focus_mississippi_central_expansions_desc: "The MCR is the principal railway company which connects the western half of our great nation. This fair railroad is in need of new business and as such we will not only invest in the railroad itself to expand, but we will invest in the businesses for which they will be servicing as well."
 CSA_focus_southern_railway_expansions: "南部鉄道拡大"
 CSA_focus_southern_railway_expansions_desc: "南部鉄道は確かに南部に奉仕しており、そのため、可能な限り多くの南部に奉仕することを確実にしなければならない。したがって、そのインフラへの拡大助成金、および国家経済と繁栄する鉄道網に全体的な利益をもたらす地域経済への助成金が必要だ。"
 CSA_focus_department_for_transport_innovation: "輸送革新省"
 CSA_focus_department_for_transport_innovation_desc: "DTI（輸送革新省）は、輸送に関するあらゆるもののための専任の研究開発部門である。現代経済は現代的な輸送手段を必要としており、そのため、我々は経済だけでなく国家全体を理解し、利用し、接続しなければならない。革新と発展を通じて、それは本当に小さな世界になり得るのだから。"
 CSA_focus_transportation_history_is_still_history: "輸送史もまた歴史"
 CSA_focus_transportation_history_is_still_history_desc: "輸送の歴史自体が、我々の種の発展と革新そのものを定義している、まあ、それと戦争だが、それはさておき。いずれにせよ、歴史が教えられるとき、未来の世代が輸送が我々の生活の重要な一部であり、単に忘れてしまうような単純なものではないことを理解するようにしなければならない。確かに日常的な使用かもしれないが、そもそもその使用を持つことは、なぜ我々がそれを必要としたか、あるいは欲したかを理解することだ。"
 CSA_focus_a_true_balance_of_power: "真の力の均衡"
 CSA_focus_a_true_balance_of_power_desc: "我々のエネルギー需要は、我々の野心を大幅に上回っており、迅速な行動を保証しなければならない。したがって、国家的な原子力投資の大規模なバランス調整行為は、我々の最も突飛な夢を超えてエネルギー需要を確保するだろう。"
 CSA_focus_breaking_the_chains: "鎖を断ち切れ"
 CSA_focus_breaking_the_chains_desc: "The history of our nation, both now, future and long ago is a fragile, bloody and shameful one in terms of modern standards. But with our connectiveness programs, our economic investments and in general our way of making a true Southern nation. We have shown that those old ways mean nothing more than lessons which to learn from. For every soul which is a part of our fair southern lands is a Southern soul and they shall be treated, cared for and respected as such. Break the chains of the past and set forth to a future united as one Southern Family."
 CSA_focus_the_old_ways_coalition: "古き道連合"
 CSA_focus_the_old_ways_coalition_desc: "The OWC or Old Ways Coalition has secured a general victory and it is now up to the big three of the coalition to help build and secure the future of the nation. The SCP, WPD and PDP will attempt to work together to form policies as well as handle the economic and foreign policy situation that our young nation will be facing."
 CSA_focus_the_SCP_programs: "SCPプログラム"
 CSA_focus_the_SCP_programs_desc: "南部保守党（SCP）が連合の先頭に立った。彼らは、自分たちの政治的地位を確保し、社会主義派閥の勢いを削ぐために、自分たちのプログラムを実施することを目指すだろう。WPDとPDPは行き過ぎを抑えようとするだろうが、全体として政治的安定が優先事項である。"
 CSA_focus_servicing_defense_needs: "防衛需要への対応"
 CSA_focus_servicing_defense_needs_desc: "DII（防衛産業イニシアチブ）は、将来の我々に対する外国の行動の場合に備えるための必要性である。大したことではないが、これは訓練や供給不足のようなものを是正するはずだ。願わくばこれを使用する必要がないことを望むが、少なくとも余分な武器を使っていくらかの歳入を得ることができる。"
 CSA_focus_economic_deregulation: "経済規制緩和"
 CSA_focus_economic_deregulation_desc: "旧連邦は、法制の行き来でビジネス環境をゆっくりと締め付けたために崩壊した。したがって、我々は事業立ち上げに関していくつかの重要な問題を規制緩和し、地域ビジネスをより奨励するために税法全体の再編成を許可する。"
 CSA_focus_tried_and_true_power: "実績ある電力"
 CSA_focus_tried_and_true_power_desc: "化石燃料電力の三位一体、石炭、石油、天然ガスは、エネルギー需要を確保するための長く試され、信頼されてきた方法である。したがって、国家全体の基本的なニーズを確保するために、教育、研究、資源、インフラストラクチャ全体にわたって全国的に投資する。"
 CSA_focus_industrialization_investment_initiatives: "工業化投資イニシアチブ"
 CSA_focus_industrialization_investment_initiatives_desc: "III、すなわち南部産業社会計画は、公正な国家全体の製造業および一般工業化を奨励するための一連の立法および予算投資である。これにより、経済が多様化し、よりバランスの取れた形で充実することが可能になるはずだ。"
 CSA_focus_the_WPD_programs: "WPDプログラム"
 CSA_focus_the_WPD_programs_desc: "The Wigs have taken the lead for the coalition and are seeking to make sure they've left their mark. Of course not straying too far from the coalition's goals they still intend to sway the nation in the favor of their more classical liberalistic ideals. Obviously the SCP and PDP will try to exert counter influences to keep the balances, but hey that's politics."
 CSA_focus_its_the_economy_stupid: "経済だよ、馬鹿！"
 CSA_focus_its_the_economy_stupid_desc: "我々は皆、何度も何度もそれを聞いてきた、「経済だよ、馬鹿！」と。まあ、分解してみると、多くは本当にそうだということがわかる。この知識をもって、我々は教育に適切に投資し、市民が経済を創造し参加できるように官僚的形式主義を合理化しなければならない。そうすれば、彼らは本当の生計を立て、その生活を楽しむこともできる。"
 CSA_focus_modern_economy_means_modern_jobs: "現代経済は現代の仕事を意味する"
 CSA_focus_modern_economy_means_modern_jobs_desc: "新しい経済において、技術と、広く「オフィス部門」と要約されるものは、全体的な経済の観点から、革新と多様性の一部が生まれる場所である。したがって、将来の世代をこれらの新しい仕事に備えさせ、より良く触れさせるために、規制と教育システムを微調整する必要がある。"
 CSA_focus_economic_health_is_healthcare: "経済的健全性は医療"
 CSA_focus_economic_health_is_healthcare_desc: "経済の健全性と幸福は、平均的な市民の健康と幸福にも直接影響する。したがって、より良い賃金の仕事、それらの仕事を得る能力、そして市民が受けるに値するケアを確実に受けるための既存の健康・福祉インフラへの小さな補足を奨励しなければならない。"
 CSA_focus_the_power_rangers_of_energy_itself: "エネルギー自体のパワーレンジャー"
 CSA_focus_the_power_rangers_of_energy_itself_desc: "The Power Rangers Program, while not being as cool as one would assume, is our best bet at meeting our energy needs. With a surveying of our diverse land we can invest and setup different energy production methods and better streamline the network to reduce inefficiencies as well. While some will not be happy at the use of nuclear, it is clear that we need it to complete the energy puzzle we find ourselves in."
 CSA_focus_the_PDP_programs: "PDPプログラム"
 CSA_focus_the_PDP_programs_desc: "The Progressive Democracy Party has come out on top in leading the coalition. As such they'll look to push more progressive tax reforms and promote the modern welfare state to care for the citizens where companies fail to. Of course SCP and WPD members will look to counter these leading moves so as to not stray too far left, but regardless the first steps are being started by a left foot forward."
 CSA_focus_social_education_programs: "社会教育プログラム"
 CSA_focus_social_education_programs_desc: "SEP（社会教育プログラム）は、より多くの人々が後年これらの分野に参加することを期待して、医療に関する教育プログラムへの専念した投資である。したがって、そのような労働力の地域的な拡大は、この長期的な投資を通じて、より良いケアを提供し、全体的な予算の増加を最小限に抑えることを可能にするだろう。"
 CSA_focus_true_progressive_taxation: "真の累進課税"
 CSA_focus_true_progressive_taxation_desc: "真に累進的な指標を中心に税法を改革することが、財政および予算の安定を確保する方法である。「より多くのお金が高い税率を意味する」と単純に見なす代わりに、我々はそれを比例所得の線に沿ってよりバランスさせることを目指す。したがって、誰が税金の公平な負担を払っているか、払っていないかという、気を散らすような議論はもはやなくなるだろう。"
 CSA_focus_department_of_transportative_infrastructure: "輸送インフラ省"
 CSA_focus_department_of_transportative_infrastructure_desc: "DoTI（輸送インフラ省）は、国家政府の専任部門であり、開発、投資、および既存の輸送指向インフラストラクチャの維持が管理されている。これにより、運が悪いかもしれない人々に仕事を与えることができ、また、現代のインフラストラクチャ全体を維持する上での適切な基準を奨励する。"
 CSA_focus_biofuel_investments: "バイオ燃料投資"
 CSA_focus_biofuel_investments_desc: "Considering the massive amounts of agriculture our great nation is known for, we must utilize this key aspect in diversifying our energy production methods. One such way is investing in biofuel plants to allow for excess crop wastes and potential candidates for tomorrow's fuel source to be used in the production of local energy needs. This should also help to supplement the national network, but starting small gives us a more reliable data pool."
 CSA_focus_startup_grants_for_southern_industries: "南部産業へのスタートアップ助成金"
 CSA_focus_startup_grants_for_southern_industries_desc: "国内の経済成長を奨励しなければならず、その一つの方法は、スタートアップのための助成金制度を設定することだ。スタートアップが成功することを期待して、スタートアップは助成金が適切な方法で使用されたことを証明するための適切な文書を提供する必要がある。また、新たに設立された事業の善意と真の進歩を保証するために、助成金の3分の1を最初の5年以内に返済する必要がある。"
 CSA_focus_promoting_organized_agriculture: "組織化農業の促進"
 CSA_focus_promoting_organized_agriculture_desc: "世界が大豆、綿、そして穀物などのバルク品を必要としているため、我々は非常に農業的に影響を受けた陸塊として、世界のニーズが満たされることを保証する上で我々の役割を果たさなければならない。そのために、これらのニーズが満たされることを保証するために、より組織化された農業ビジネスを促進しなければならない。"
 CSA_focus_dixie_dynamics: "ディキシー・ダイナミクス"
 CSA_focus_dixie_dynamics_desc: "ディキシー自体の核心は、武器および海軍製造のための素晴らしく中央集権的な計画地であり、また、軍隊のための訓練および試験場の動的な設定である。森林、沼地、川は、防衛需要を供給するこれらの産業を準備し、防御するのに役立つだろう。"
 CSA_focus_memphis_miami_project: "メンフィス-マイアミ・プロジェクト"
 CSA_focus_memphis_miami_project_desc: "M&Mプロジェクトは、フロリダ州とテネシー州のサービスおよびオフィス部門へのいくつかの低レベルの対象を絞った投資である。これは地域経済の発展に役立つはずであり、また、将来の投資において州間のいくつかのギャップを埋めるのに役立つはずだ。"
 CSA_focus_old_habit_die_new_hopes_are_born: "Where Old Habits Die, New Hopes Are Born"
 CSA_focus_old_habit_die_new_hopes_are_born_desc: "We as a nation have come a long way, and despite our past, both recent and far back, we have learned to understand, to care and love one another as family. Sure family fights one another now and again, but in the end, family is family and no one can take that understanding away from us."
 CSA_focus_new_ways_coalition_victory: "新しき道連合"
 CSA_focus_new_ways_coalition_victory_desc: "より穏健な政党が、周縁部よりも支持者を活用しようとしているため、我々は古い習慣に陥らないようにしなければならない。これに伴い、新しき道連合が登場する。FDP、SIP、SLPは、南部国家全体に新たな光を与える方法として、この連合を結成する取引を仲介した。3党すべてが新しい南部の前進に同意しており、これをもって彼らは協力し、彼らが「新しい南部」を創造する上で自分たちの足跡を残すことを保証することに合意した。"
 CSA_focus_FDP_programs: "FDPプログラム"
 CSA_focus_FDP_programs_desc: "連邦化ディキシー党（FDP）は、連合内でより人気があることが証明された。この理解をもって、FDPは、旧連邦政府構造と、それ以前のCSA（アメリカ連合国）のさらに古い連合政府構造との間の真の妥協案を作成することに着手しようとしている。SIPとSLPは連合内のバランスを確保しようと動くだろうが、FDPは、SLPがより放任的なアプローチを望んでいるだけで、SIPはどちらの側にもより無関心であるため、実際には心配していない。"
 CSA_focus_industrialize_without_automation: "自動化なき工業化"
 CSA_focus_industrialize_without_automation_desc: "反自動化法は、本質的に、工業化を奨励し、雇用ニーズを満たすためのソフトな一時しのぎ策である。我々は、市民が仕事を得ることができ、生産された製品が、外国の搾取者にアピールしようとするよりも、国内のニーズにより向けられることを保証する必要がある。"
 CSA_focus_primary_needs_need_primary_care: "主要なニーズには主要なケアを"
 CSA_focus_primary_needs_need_primary_care_desc: "第一次産業ケア法、すなわちPIC法は、第一次産業または資源指向産業の発展を保証するために地域産業を発展させるための国家投資計画である。新しい産業と新しい商品やサービスが、国家にとってより安価なレートで提供されることを可能にする。"
 CSA_focus_revitalizing_the_interstate_system: "州間高速道路システムの活性化"
 CSA_focus_revitalizing_the_interstate_system_desc: "What remains of the interstate highway system is a bit of a mess to say it in kinder words. More over if we are to get anything anywhere we must actually invest in infrastructure as a whole. Therefore we must first start off with one of the biggest things and that is the major roadways which connect our states into one family."
 CSA_focus_electrical_grid_advancements: "電力網の進歩"
 CSA_focus_electrical_grid_advancements_desc: "グリッド進歩法は、国家電力網を改革するための投資パッケージである。新しい変電所、より効率的な送電線、そして全体として、一般的な電力輸送と貯蔵の過剰な浪費が、実行可能な限り最小限に抑えられることを保証する。"
 CSA_focus_SIP_programs: "SIPプログラム"
 CSA_focus_SIP_programs_desc: "南部アイデンティティ党（SIP）が連合の指導者の座に就いた。実際には政治志向ではないが、彼らは南部文化の具体的な定義の出現を確実にしたいと考えている。FDPとSLPの他の連合メンバーは、この直接的な政治的方向性の欠如を利用して将来の結果を揺さぶるだろうが、結局のところSIPは実際には気にしていない。"
 CSA_focus_confederate_history_innovations: "南部連合史の革新"
 CSA_focus_confederate_history_innovations_desc: "The CHI is an education reforms package over the principles of teaching our cultural history, or general history, with a highlight of the brutal realities of what Southern slavery caused. As well the reasons why it was so bitterly contested despite the more practical realities of slow abolishment of the institution for more productive and conventional means. As we learn and understand our dark history, we understand what clearly to avoid, but also where we can stand out and shine. In this regards we will be investing in dedicated agricultural courses to expose newer generations to different agricultural fields of study, their developments over time and hopefully encourage future innovations in these same fields of study."
 CSA_focus_connecting_the_south: "南部の接続"
 CSA_focus_connecting_the_south_desc: "南部全体の非効率性の主な原因の一つは、それが1860年代の内戦であろうと、経済的に多様化するための永続的な戦いであろうと、そのインフラである。したがって、将来の投資のための跳躍台として、南部識別可能州の中核、言い換えれば、南部の「大義」の始まりにより良く投資しなければならない。この場合、カロライナ姉妹州とジョージア州は素晴らしいスタートだ。"
 CSA_focus_agricultural_developments: "農業開発"
 CSA_focus_agricultural_developments_desc: "Our heritage and land is most suited for agricultural development as a whole. While we could prioritize things like the tech and office sector, these things would cost way more and put a strain on our financial situation than the current state of affairs already has. Therefore general developments in agricultural industrialization will help to soften the blow and make things just a little better for the time being."
 CSA_focus_confederate_cash_crops: "南部連合換金作物"
 CSA_focus_confederate_cash_crops_desc: "CCC（南部連合換金作物）は、繁栄する南部国家の中心部を支えるための中心地開発計画である。ミシシッピ州とアラバマ州はディキシー自体の心臓部と見なされており、そのため、我々は国家の心臓部の状態を世話し、改善しなければならない。"
 CSA_focus_SLP_programs: "SLPプログラム"
 CSA_focus_SLP_programs_desc: "南部自由党（SLP）が連合でトップに立ち、そのよりリバタリアンの影響力をもって、人民のための真の政府を創設することを計画している。その最小国家主義プログラムを通じて、彼らの希望は、人々がそのニーズを理解し、政府は彼らがそのような目標を達成できる手段を提供するだけでよいということだ。SIPとFDPは、連合を強固に保つため、また将来の選挙のための国民の影響力のためにも、明らかにいくつかの決定に影響を与えたいと思うだろう。"
 CSA_focus_new_wave_deregulations: "新波規制緩和"
 CSA_focus_new_wave_deregulations_desc: "この新しい政治の波をもって、我々は全体として新しい開発を構築できることの適切な規制緩和を保証しなければならない。これをもって、我々は建設許可の規制緩和と、一般的な民間市民とその財産に侵入的でなくプロセスを合理化するようにゾーニングに関する官僚的形式主義を許可する。"
 CSA_focus_education_advancement_choice_program: "教育進歩選択プログラム"
 CSA_focus_education_advancement_choice_program_desc: "Education should not be a luxury, but a choice for one's life and direction they want to take it. With this in mind we need to better streamline and give choices to our future generation of what they feel comfortable doing. Do they want to slowly make their way to college and use that as a way to be a specialized field or business startup. Or do they want to get the core of the basics of knowledge to enjoy and understand life and just focus on joining the workforce and making a steady yet enjoyable career from there. Life is full of choices and we should give our future generations the ability to understand and make the choices they want."
 CSA_focus_selfcare_is_welfare: "セルフケアは福祉"
 CSA_focus_selfcare_is_welfare_desc: "人々は自分たちのニーズを知っており、我々は彼らがそのニーズを求め、追求するための資源と能力を必要としていることを知っている。したがって、我々は連邦および政府ベースのプログラムを削減し、そのすべてを企業の貯蓄および人口に対する直接的な減税に還元することができる。"
 CSA_focus_the_modern_energy_economy: "現代エネルギー経済"
 CSA_focus_the_modern_energy_economy_desc: "The world is more reliant on fossil fuels for energy than at any other point in human history. This is only going to grow as our species continues to grow. Therefore we must assume a modern role in today's energy economy by investing in finding new deposits as well as diversifying our energy needs through things like natural gas, coal, coal conversions, carbon trapping, as well as biofuels. Then we can truly stay ahead of the curve and ensure a stable future for our economy and our nation as a whole."
 CSA_focus_expand_the_office_sectors: "オフィス部門の拡大"
 CSA_focus_expand_the_office_sectors_desc: "我々の経済は多様化を通じて耐えなければならない。したがって、我々は経済のオフィス部門の開発に関連して人々に投資させることを検討しなければならない。これは、我々の地域が持ちがちな一種の一方的な経済、すなわち農業に対する良いカウンターウェイトとなるだろう。"
 CSA_focus_expand_the_industrial_base: "産業基盤の一般的拡大"
 CSA_focus_expand_the_industrial_base_desc: "我々の製造能力は常に限られてきたが、投資と一般的な開発を通じて、我々が持っている国内資源と全体的に統合することができるはずだ。結局のところ、農業は上に構築するための良いベースラインである。"
 CSA_focus_down_by_the_docks: "波止場にて"
 CSA_focus_down_by_the_docks_desc: "公正な国家の海岸線は、国内および世界経済への貢献という点で、我々が足を踏み入れるための最良の方法となるだろう。沿岸地域全体で新しい造船所や海軍ベースの産業を改善、拡大、投資し、安定した貢献と、貿易品を内外に流出入させるための豊富な選択肢を確保することができる。"
 CSA_focus_dixie_defense_contracts: "ディキシー防衛契約"
 CSA_focus_dixie_defense_contracts_desc: "狩猟シーズン、自衛、国防、何でも言ってくれれば供給できる。一般的な防衛産業の創設と、その産業のための契約者の設定は、経済の継続的な多様化を可能にするだけでなく、国家全体の防衛にも大きく貢献することができる。真に防衛された南部国家とその文化、そして外国勢力によって争われない土地の舞台を設定する。"
 CSA_focus_old_reliable: "古き信頼"
 CSA_focus_old_reliable_desc: "Our economic \"Old Reliable\", the agricultural sector of our economy is something we can never earnestly move away from. The lands are just too suited for the industry that its more inefficient to use that land for other means. However a balance is what we need and with our previous projects we can now come full circle. With this national overhaul of an economic miracle as well as our coalition's efforts to better the people's of these lands, we seek to finally break away from the past and create a real future for our people. For we are a Southern Family and family always sticks together."
 CSA_focus_party_for_economic_prosperity_victory: "繁栄党、勝利を確保"
 CSA_focus_party_for_economic_prosperity_victory_desc: "In a mild upset to many the PEP or Party for Economic Prosperity has won the recent elections. With this victory comes to a head the reality that the PEP needs to actually do some nation leading instead of being what some believed to be a \"Tycoon's Gentlemen Club\" of sorts. Regardless of what the opposition says the PEP has stated that their obvious main goal will be to economically rebound the nation and create the fiscal and economic situation to allow for social debates. Many question the wording of such a statement but most see it as, if they pull through we only have a net positive, if they fail, it can't be worse than what we just pulled ourselves out of...right?"
 CSA_focus_paving_the_way_forward: "前進への道を開く"
 CSA_focus_paving_the_way_forward_desc: "開発計画で文字通りどこかに到達するためには、道路網と一般的な輸送インフラストラクチャが増加する交通量に対応できることを保証しなければならない。"
 CSA_focus_establishing_the_labour_corps: "労働軍団の設立"
 CSA_focus_establishing_the_labour_corps_desc: "The SLC or the Southern Labour Corps is an organization for the unemployed as well as the incarcerated to work on infrastructure projects. Things like upkeeping and creating new infrastructure projects, as well as starting clearing and foundation startings for future development programs for the economy. Overall this will help increase employment as well as we can use better budgeting in the law enforcement of the nation to secure the validity of the SLC which in turn can distribute the pay of working on projects which involve unemployed."
 CSA_focus_southern_agriculture_dominance: "南部農業の支配"
 CSA_focus_southern_agriculture_dominance_desc: "Our lands are meant for cultivation, our lands are meant for the farms and fields of agriculture. For this we will ensure the sheer dominance of our Southern agriculture over even those which dominate the world nowadays. Understanding this, we will also need to invest and develop within this sector if we are to keep ahead of any real competition."
 CSA_focus_heartland_development_scheme: "中心地開発計画"
 CSA_focus_heartland_development_scheme_desc: "我々の最初の中核開発プログラムは、他ならぬ国家の中核である。ミシシッピ州とアラバマ州は、旧連邦内で最も開発されていない州の一つと見なされてきた。まあ、もはやそうではない。我々はこの南部の国家体の心臓部を、偉大な国家の鼓動する中央ハブにする。"
 CSA_focus_overhauling_taxation_practices: "課税慣行の改革"
 CSA_focus_overhauling_taxation_practices_desc: "If we are to utilize the most from our lands we must be able to fund it properly. So overhauling the taxation manners and enforcement will allow us to cut down on corruption and bring in more revenue in general."
 CSA_focus_atlantic_advancements: "アトランティック・アドバンスメンツ"
 CSA_focus_atlantic_advancements_desc: "アトランティック・アドバンスメンツは、国家東部で影響力を増している産業である。経済的繁栄を促進するのを助けるつもりなら、彼らの事業拡大に投資すべきだ。"
 CSA_focus_dixie_demolitions: "ディキシー・デモリションズ"
 CSA_focus_dixie_demolitions_desc: "Dixie Demolitions is a construction and mining firm making headways in the heart of Dixie itself. Recently geological surveys have uncovered a thin belt of lithium from southern Alabama to potentially all the way in Texas. This is a key mineral in developing a lot of battery tech as well as a fair amount of machines as a whole. We must help kickstart this little lithium boom so we can secure our domestic interests."
 CSA_focus_cajun_computers: "ケイジャン・コンピューターズ"
 CSA_focus_cajun_computers_desc: "ケイジャン・コンピューターズ社は、国家西部でまずまずの進歩を遂げている新興技術企業である。この会社に投資して拡大させ、経済能力を高めるだけでなく、これらの西部の州に雇用と新たな可能性をもたらさなければならない。"
 CSA_focus_national_research_institute: "国立研究所"
 CSA_focus_national_research_institute_desc: "侮れない経済力となるためには、経済的改善の新しい方法を革新し、開発しなければならない。したがって、国立研究所を創設することは、まさにその目標を念頭に置いた資源を提供するだろう。受動的には、それは明らかに我々の研究努力を助けるだろうが、我々は産業、建設努力、その他多くで革新することを望んでいる。"
 CSA_focus_corps_of_engineers_expansion: "工兵隊の拡大"
 CSA_focus_corps_of_engineers_expansion_desc: "我が軍の工兵隊は、軍隊を支える兵站および防御指標のバックボーンである。いずれにせよ、軍隊のこの重要な側面は洗練され、拡大されなければならない。軍隊のためだけでなく、実用的な平時応用を持つことができる民間部門を組み込むためにも。"
 CSA_focus_growing_defense_capabilities: "防衛能力の増強"
 CSA_focus_growing_defense_capabilities_desc: "我が国の国防は、どんな想像力を働かせても最優先事項である。これをもって、我々は防衛に貢献する産業を創設する。対象を絞った投資を通じて、これらの新しい兵器工場でいくつかのソフトな歳入を得ることもできる。"
 CSA_focus_reforming_industrialization: "工業化努力の改革"
 CSA_focus_reforming_industrialization_desc: "我々の産業能力は、最大出力を保証するための機械とベースラインを実際には持っていないという事実に制限されている。したがって、我々は機械を購入し、規制を改革して、全体的な産業努力全体を活性化させることができる。"
 CSA_focus_naval_industrial_expansions: "海軍産業拡大"
 CSA_focus_naval_industrial_expansions_desc: "We have an expansive coastline, as such we must utilize this by expanding and growing our naval industrial capacity."
 CSA_focus_national_infrastructure_improvements: "国家インフラ改善"
 CSA_focus_national_infrastructure_improvements_desc: "国家が成長するにつれて、インフラが資源輸送やサプライチェーン全体の増大する需要に対応できることを保証しなければならない。したがって、我々は既存の道路網を必要に応じて拡大し、成長させる。"
 CSA_focus_growing_produce_plan: "農産物増産計画"
 CSA_focus_growing_produce_plan_desc: "はい、我々はすでに農産物を栽培している。皮肉なことに、我々はこの既存のセクターをさらに成長させることができる、ゆえに農産物増産計画なのだ。十分な量だけで満足する理由はなく、より多くの生産を確保し、余剰分を外交関係のためのソフトパワーとして使用できる。"
 CSA_focus_connecting_the_sister_states: "姉妹州の接続"
 CSA_focus_connecting_the_sister_states_desc: "The Carolinas are a union in their own right. However this union is limited to whatever connections are available to them and it is with this in mind that we shall strengthen that bond ever more. Through comprehensive railroad projects we can expand the throughput capabilities of the Carolinas and allow for bulk transport goods to flow near freely through the sister states."
 CSA_focus_the_mississippi_western_railroad: "ミシシッピ西部鉄道"
 CSA_focus_the_mississippi_western_railroad_desc: "姉妹州の統一計画の西部のカウンターバランスを統一し、創設するために、我々はMWRR、すなわちミシシッピ西部鉄道を創設している。この鉄道は政府と民間の混合所有であるが、第三の中間者タイプのパートナーはミシシッピ中央鉄道である。彼らの経験により、協力的で健全な競争、そして国家鉄道網の地方分権化を創出するのに役立つだろう。"
 CSA_focus_southern_power: "サザン・パワー"
 CSA_focus_southern_power_desc: "サザン・パワーは急速に成長している電力会社であり、その範囲は国家の多くを網羅している。我々はこの会社の株式を購入し、事業全体の拡大への投資を通じて彼らの注意をそらすことにより、この会社を微妙に国有化する。"
 CSA_focus_dont_look_back_look_forward: "振り返るな、前だけを見ろ"
 CSA_focus_dont_look_back_look_forward_desc: "文化として、そして歴史的影響として、我々の過去を嘆くのはやめる時だ。ほぼ数世紀前の不正な行為が数時間前のことであったかのように常に行動するならば、我々は真剣にどこにも到達しないだろう。我々は前を向かなければならない。我々の大規模な開発とプログラムを通じて、すべての南部市民が快適な生活の目標を達成し、人生が「そうであると信じている」ものではなく、あり得るものであるために真に楽しむことができる未来を保証する。"
 CSA_focus_cwuf_victory: "南部連合労働者統一戦線、勝利"
 CSA_focus_cwuf_victory_desc: "In a seemingly shocking turn of events, the oddball coalition of the Confederate Workers Party and Southern Tradition Party have taken the first victory in the elections. Many wonder how this coalition works when the reality is it kinda works. The main uniting principle is the Confederate identity and mantra they both espouse. However one is clearly more on the other side of the aisle politically than the other. Now that the coalition has won it'll be interesting to see who ends up having the most influence."
 CSA_focus_CWP_policy_plan: "CWP政策計画"
 CSA_focus_CWP_policy_plan_desc: "The Confederate Workers Party has taken leadership in the polls and consequently won the election. With this they now have the platform to initiate their policies, which will now be enacted to start the road to a real and fair society for the working man."
 CSA_focus_industrialized_agriculture: "工業化農業"
 CSA_focus_industrialized_agriculture_desc: "労働者を主要な人物にするための我々の努力は、農業部門が非常に多くの労働力を必要とするときには現実のものとはならない。したがって、我々は経済の農業部門を改善し、機械化し、より良く組織化しなければならない。"
 CSA_focus_the_real_economy: "真の経済"
 CSA_focus_the_real_economy_desc: "産業、製造業、そして個人商店。これが現代の真の経済であり、数十年前、ほぼ数世紀前と同じ経済であった。我々はこれを築き上げ、支援し、偉大さを求める確固たる基盤として確立しなければならない。"
 CSA_focus_a_honest_tax_system: "正直な税制"
 CSA_focus_a_honest_tax_system_desc: "現実的に言えば、社会を組織し支援するためには、生み出された富を、社会全体のためにより良く使われることを保証するために、ある程度組織し、徴収する必要がある。その結果、我々は新鮮な税制を改革し、確立することについて正直かつ率直でなければならない。短期的には好かれないかもしれないが、問題のある管理者を取り除き、実際にお金を有効に使うことができれば、人々は後で我々を愛するだろう。"
 CSA_focus_a_needed_evil: "必要悪"
 CSA_focus_a_needed_evil_desc: "The \"Corporate\" sector of our economy contains services and technologies as a whole. While the C word is a bit ugly to be using we cannot deny that it is a needed evil for which to keep our edge over foreign powers. As such we can reform some labor laws and make the sector a bit smaller in scale as to keep it a bit more down to earth like more core industries."
 CSA_focus_welfare_reforms: "福祉改革"
 CSA_focus_welfare_reforms_desc: "我が国の市民は世話をされなければならず、それを可能にする唯一の方法は、社会的安全網を改革し、元に戻すことである。幸福な労働者は生産的な労働者であり、我々が結束力のある社会を確保するために努力するのはこの幸福である。"
 CSA_focus_STP_policy_plan: "STP政策計画"
 CSA_focus_STP_policy_plan_desc: "CWUFの選挙勝利により、南部伝統党（STP）がトップに躍り出て、このやや完全な勝利を、彼らの政策の扉を蹴破る方法として利用しようとしている。彼らはより経済的および文化的な政策に焦点を当てているが、可能な限り連合の社会主義側から距離を置き始めようとするだろう。"
 CSA_focus_energizing_the_lands: "土地へのエネルギー供給"
 CSA_focus_energizing_the_lands_desc: "広大な森林と、エネルギー網のための真のインフラを確立するには不利な地形は最良ではない。したがって、我々はより地方分権化された発電ニーズのより良い方法を開発することを検討する必要がある。そこから、これらの「ブロック」は相互リンクを見つけることができ、それが国家的なグリッドタイプに貢献できる。"
 CSA_focus_the_promising_ventures_act: "有望事業法"
 CSA_focus_the_promising_ventures_act_desc: "PVA（有望事業法）は、国内のビジネス環境を開発し、促進するための集団的な投資および改革パッケージである。税制改革、労働者の幸福を改善しつつ設立時間を合理化する規制は、連合内の社会主義派閥と資本主義派閥の間でバランスの取れた結束力のある経済を作り出すだろう。"
 CSA_focus_machining_imports: "機械輸入"
 CSA_focus_machining_imports_desc: "Targeted machining equipment for imports allows us to not only upgrade and modernize our production capabilities. But these imports can be reverse engineered and redone in different ways to spur research as well as get around foreign long term dependency."
 CSA_focus_mississippi_technological_institute: "ミシシッピ工科大学"
 CSA_focus_mississippi_technological_institute_desc: "MTI、MITへのしゃれた言及は、革新と研究に対する南部の答えである。より中心的な場所であるため、資金は、生活全体をより良くするのに役立つ可能性のあるさまざまな分野の多くのことに関する研究開発に専念される。建設の進歩から、資源の浄化および抽出方法まで、MTIは南部革新の頂点となるだろう。"
 CSA_focus_riverland_investments: "リバーランド投資"
 CSA_focus_riverland_investments_desc: "リバーランド投資計画は、一般的なミシシッピ川流域州を開発するための包括的な経済計画である。ルイジアナからテネシーまでのこれらの4州は、地域住民にとって最良の結果を保証するために、一般的および専門的な経済プロジェクトに沿って開発される。"
 CSA_focus_raw_energy_methods: "生エネルギー法"
 CSA_focus_raw_energy_methods_desc: "From oil to natural gas, to green grass and charcoal made on mass. With a comprehensive investment in each state's infrastructure as well as their best energy producing means we can create a raw energy economy to satisfy our needs and future endeavors."
 CSA_focus_domestic_petrochemicals: "国内石油化学製品"
 CSA_focus_domestic_petrochemicals_desc: "The oil and coal, albeit in limited supply in the states of Oklahoma and Louisiana can be partly converted towards more direct and diverse petrochemical industries. Creating such industries allows us to secure a lot of chemical and synthetic products we may have had to rely on by foreign imports. Its not much, but its enough and that's all that matters."
 CSA_focus_mid_atlantic_mining_co: "中部大西洋岸鉱業会社"
 CSA_focus_mid_atlantic_mining_co_desc: "MAM社はノースカロライナを拠点とする鉱業会社であり、商業的にも潜在的に軍事的にも役立つ可能性のある貴金属、およびリチウムと雲母ベースの鉱業事業を対象とするために、国家政府の投資を求めている。いずれにせよ、そのような投資を維持するためには、ノースカロライナの防衛に投資する必要があるだろう。"
 CSA_focus_jobs_a_plenty_act: "雇用豊富法"
 CSA_focus_jobs_a_plenty_act_desc: "JaPA（雇用豊富法）は、雇用を助け、国家の人々がスピード、効率性、そして生活の基本を賄える仕事で奉仕されることを保証するサービスおよび一般目的の仕事を作り出すだろう。"
 CSA_focus_southern_nucleus: "南部核法"
 CSA_focus_southern_nucleus_desc: "国家の心臓部はまた、国家のニーズのためのエネルギーを生産する能力の心臓部であるべきだ。そのようなエネルギー的なニーズを生み出すためには、間違いなく最も効率的な電力生産手段が必要であり、それは限定的な原子力投資である。人々は原子力エネルギーに対する一種のソフトな恐怖煽りのために決定に抗議するだろうが、戦略的に人口密集地や深刻な気象イベントの場合の海岸線から隔離された地域に発電所を配置することにより、より声高な人々を静かにさせることができる。"
 CSA_focus_southern_cultural_society: "南部文化協会"
 CSA_focus_southern_cultural_society_desc: "The national southern cultural society is a national and local effort to put aside just a little bit from everything and give it back via an annual week long celebration and historical remembrance of our nation's long and very troubled history. For we are no longer natives, europeans or even americans. We are Southerners, a part of one big happy Southern Family."
 CSA_focus_the_southern_dream: "南部人の夢"
 CSA_focus_the_southern_dream_desc: "At long last, through unity and developing a better future for all our citizens, we can now truly move on. No longer will we let our past define us. But rather we understand that even if it is a part of us, that it is but a past mistake for which we have not only learned from, but built better and strived to correct the journey we are on to a brighter future. For a dream can be a reality if we work together."
 CSA_focus_fasp_victory: "自由農業社会協定、勝利"
 CSA_focus_fasp_victory_desc: "What will the fringes think of next, as in yet another sort of blind side the Union of Revolution Party and the Agrarian Union Party have teamed up and practically stolen victory from like literally anyone else. Many in and outside the coalition have no real idea how the coalition functions. But insiders with each party seem to think they can use the other for their own means to an end. The URP wanting the AUP for their agriculture expertise in converting the nation into a socialist utopia. The AUP wanting the URP for their popularity among industrial workers overall. One thing that each has in common is that agriculture is the future and quote, \"we must seize this moment now and not later\"."
 CSA_focus_URP_programs: "URPプログラム"
 CSA_focus_URP_programs_desc: "With the victory of the Free Agrarian Society the Union of Revolution Party has come out on top within the coalition. With this initial victory the URP looks to better decentralize and bring about as close to anarchistic-socialism as possible before the AUP wins leadership or gets enough influence to potentially reverse certain policies. Regardless we can expect more agriculture investment as well as lowered government spending overall."
 CSA_focus_return_their_wealth_act: "彼らの富を返す法"
 CSA_focus_return_their_wealth_act_desc: "RTWA（彼らの富を返す法）は、国家政府の経費から削減できるものを通じて、人々に彼らの苦労して稼いだお金を返すための富の再分配努力である。皮肉なことに、これにより、これらの人々が今や自分たちが適切と考える方法で経済に再投資するためにより多くのお金を持つことになるため、将来の歳入を得ることができるだろう。"
 CSA_focus_the_basics_of_life: "生活の基本"
 CSA_focus_the_basics_of_life_desc: "食料、水、住居。これらは、あらゆる種が生き残るために必要な生活の基本である。これと最近の予算削減により、我々は国家の人々に農業部門の拡大に投資することを奨励できる。経済のこの柱は、人々を養い、必要とされる快適な生活を確保するのに役立ち、旧秩序の欲求と消費主義の生活、すなわち不満の破壊的な生活につながるものではない。"
 CSA_focus_the_anti_revenue_act: "反歳入法"
 CSA_focus_the_anti_revenue_act_desc: "この法律の目標は、その実際の名前とは逆のことをすることである。政府経費を削減し、減税と規制改革を通じてそれを還元することにより、我々は国民が自分たちのお金を国家に還元するために使用するための長期的な再投資の舞台を設定する。もちろん、これには時間がかかるだろうが、全体的な歳入は実際に増加するだろう、ただし短期的にはそうではない。"
 CSA_focus_stagnation_industrialism_act: "産業主義停滞法"
 CSA_focus_stagnation_industrialism_act_desc: "国民のニーズに応じた安定した真の経済を作るためには、経済構成がそれを生み出す人々自身を支援することを保証しなければならない。したがって、我々は全体として工業化を停滞させ、先細りにし、農業部門の優位性を確保し始める。"
 CSA_focus_local_care_act: "地域ケア法"
 CSA_focus_local_care_act_desc: "LCA（地域ケア法）は、国家経費と過度に中央集権化された機構を剥奪し、それを地方政府と個人に還元し、それらの同じ地元住民が必要とする地域のケア施設に再投資できるようにする医療および福祉改革パッケージである。国家の人民とコミュニティは自分たちが必要なものを知っているので、それらのニーズが満たされる手段を持たせよう。"
 CSA_focus_AUP_programs: "AUPプログラム"
 CSA_focus_AUP_programs_desc: "To the victors go the spoils, however these victors must share and sharing is indeed something they do not care for. As a result the Agrarian Unity Party leading the coalition victory has resulted in quick movements to secure their own initiative above all other influences where possible. The true agrarian society will be realized and the AUP will seek to make it as such."
 CSA_focus_agricultural_industrialism: "農業工業主義"
 CSA_focus_agricultural_industrialism_desc: "Agricultural industries are still industrial in nature. This is the benchmark we will set and make to ensure our future is a future of filled bellies and satiated minds."
 CSA_focus_food_securities_act: "食料安全保障法"
 CSA_focus_food_securities_act_desc: "FSA（食料安全保障法）は、法執行機関および新しい食料安全保障局により多くの資金を提供する内部安全保障法案である。この新しい行政機関は、あらゆる食品ベースのチェーンの途切れのないサプライチェーンを保証するために、バルク食品貯蔵施設と主要な加工施設を確保する任務を負う。大きな波及効果は、これらの企業からの法人歳入の確実な徴収であり、それらの製品が内部および外部の両方の勢力から安全であることを保証する。"
 CSA_focus_continued_agrarian_developments: "継続的農業開発"
 CSA_focus_continued_agrarian_developments_desc: "CAD計画は、世界舞台での我々の増大する受動的な影響力を与え続ける農業ベースの工業主義を継続するように設計されている。我が国は、国内の安定と地域の影響力を確保する要となるだろう。"
 CSA_focus_self_investments_act: "自己投資法"
 CSA_focus_self_investments_act_desc: "SIA（自己投資法）は、個々の人々よりも企業や法人体に課税することに重点を置く税制改革法である。安全策は、税執行を取り巻く法執行機関も、抜け穴の悪用が試みられないことを保証するために定期的に報告することである。国家政府議会には、誰かが試みるのを待っているだけの法人賃金改革および規制法案がすでに存在する。"
 CSA_focus_farmlife_care_act: "農場生活ケア法"
 CSA_focus_farmlife_care_act_desc: "政府は、発展途上の経済に合わせて医療制度を改革することが適切であると見なした。農場生活が持つ可能性のある身体的負担と、それが持つ可能性のある利点の両方を理解している。これらのバランスと影響を理解することで、将来の改革を準備し、市民のケアが彼らの生活のために構築されることを保証できる。"
 CSA_focus_natural_energy_production_act: "自然エネルギー生産法"
 CSA_focus_natural_energy_production_act_desc: "NEP法は、全体としてバイオ燃料の利用を拡大し、近代化するために、いくらかの資金と資源を捧げる研究パッケージである。多くの人々はバイオ燃料を真の代替案とは見なしていないが、我々の農業主義が社会の頂点であるため、我々はそのような研究イニシアチブに捧げるための真の資源を持っている。さて、これらの初期の結果は多くを証明しないかもしれないが、これは確かに真のグリーンな未来への道を開く。"
 CSA_focus_electric_highways_act: "電力ハイウェイ法"
 CSA_focus_electric_highways_act_desc: "国家政府は、国家の電力ニーズのための一種のハイウェイシステムを設定するために、電力網の近代化および合理化を可能にするための資金調達法案を可決した。これにより、国家全体での電力の適切な分散と普及が可能になり、また、必要に応じて将来の需要と成長に柔軟に対応できるようになる。"
 CSA_focus_moving_mississippis_initiative: "ミシシッピ移動イニシアチブ"
 CSA_focus_moving_mississippis_initiative_desc: "The MMI is a governmental megaproject set to fundamentally change how we obtain and use the natural energy from which the Mighty Mississippi River has. Through creating localized and man made rivers and hydroelectrical measures, the main plan in the long term is to increase our energy production as well as look into using this run off water source as a way to replenish fresh water sources in the surrounding states. Of course this will be a long term project, but if its paced right and planned out correctly, then we can be assured of the results and limited to no earnest impacts to the wildlife native to the Mississippi river itself."
 CSA_focus_solidifying_domestic_manufacturing: "国内製造業の強化"
 CSA_focus_solidifying_domestic_manufacturing_desc: "純粋な農業経済という我々の希望と夢にもかかわらず、多様な経済が安全な経済であるという現実を無視することはできない。したがって、我々はそのセーフティネットを確保するために十分なことだけを行う。"
 CSA_focus_limited_office_sector_investments: "Limited Office Sector Investments"
 CSA_focus_limited_office_sector_investments_desc: "Keeping true to our diversity program, we will initiate some limited office sector related investments to allow our economy to flourish in all directions. But never forget where we came from...the farms and homes we make."
 CSA_focus_a_past_not_so_easily_forgotten: "容易には忘れられぬ過去"
 CSA_focus_a_past_not_so_easily_forgotten_desc: "我々の最善の努力にもかかわらず、多くの人々は依然として我々の国家の存在と、それに関連する非常に暗い歴史を警戒している。我々は前進するために良い進歩を遂げてきたが、傷跡は残り、適切に癒えたがらないようだ。我々が癒し続け、いつか汚点のない未来を楽しむことができることを願おう。"
 CSA_focus_dpl_victory: "ディキシー純粋同盟、勝利"
 CSA_focus_dpl_victory_desc: "In a drastic turn of events apparently old habits don't die as much as many had hoped. The coalition of the Dixie First Party and the League Of The South has created a massive upset as with their victory comes a troubling road ahead. Many wonder just what exactly they will do with fears of history's past being ever more conscious in the minds of the Southern citizenry."
 CSA_focus_DFP_programs: "ディキシー第一プログラム"
 CSA_focus_DFP_programs_desc: "The Dixie First Party has taken the main leadership role within the Purity League and has come out on top. While its main programs are similar to its \"White\" League counter part, many see a slight rift in just how aggressive certain domestic type policies should be. This will obviously cause some \"White\" League members to push back but in the end should keep the coalition stable regardless."
 CSA_focus_voluntary_emigration_programs: "自発的移住プログラム"
 CSA_focus_voluntary_emigration_programs_desc: "The VEP is a governmental initiative to give those the option that don't want to be more uniformed with society the chance to seek better lives for themselves. Of course many will argue that \"This is our land too, we've lived here for generations, bla, bla, bla\". But the fact of the matter is, that with the right incentives and maybe just a little pressure, not enough to be negligent, but enough to sway the more stubborn to be more considerate. We can begin to free up our nation from the stain of modern multi-culturalism and its naturally destabilizing mannerisms."
 CSA_focus_electrical_prioritization_programs: "電力優先化プログラム"
 CSA_focus_electrical_prioritization_programs_desc: "特に国家の現状において、いくらかのソフトパワーを行使する方法として、我々は優先ポイントを設定し、ローリング（計画的）停電を作成することができる。しかし、我々から目をそらすために、誰もが参加する必要があるが、それらの抵抗者は我々からいくらかの好意的な扱いを受けるだろう。"
 CSA_focus_robust_economics: "堅牢な経済"
 CSA_focus_robust_economics_desc: "痛みを引き起こす多様性に対処する一方で、我々は成長を可能にする多様性を増やすことができる。包括的で多様な経済投資のラウンドは、国家の土地に新しい光、新しい仕事、新しい繁栄をもたらすだろう。"
 CSA_focus_energy_research_priority: "エネルギー研究優先"
 CSA_focus_energy_research_priority_desc: "ERPイニシアチブは、エネルギー生産と利用の革新に向けた衝撃と畏怖のタイプの投資である。食料と住居以外の現代経済の最大のニーズはエネルギーそのものである。したがって、我々は前進し、何らかの革新を強制できるあらゆる方法をしっかりと掴む。そうすれば、それを国家に解放し、国家のエネルギーニーズが満たされるであろう、そして満たされてきたという満足感を容易に広めることができる。"
 CSA_focus_domestic_taxation_reforms: "国内課税改革"
 CSA_focus_domestic_taxation_reforms_desc: "国民のニーズが第一である。これらのニーズは、人々が国家から資金を調達しようとする金額を制限するための改革を設定するという事実に基づいている。"
 CSA_focus_LotS_programs: "南部同盟の議題"
 CSA_focus_LotS_programs_desc: "The Purity League has been victorious and with this a fearful reality has come to pass. The League of the South has taken the leading role in the coalition's victory and as a result is already moving quickly to secure their base and enact their programs to aggressively unify and uniform the nation and its people itself. Counterparts in the DFP have begun to protest as the League's policies seem to be way more aggressive and likely destabilizing than what the DFP proposes. Regardless only time will tell just how far from the tree the fruit may fall."
 CSA_focus_organized_deportations: "組織的国外追放"
 CSA_focus_organized_deportations_desc: "社会に貢献する市民が利用できる現在の社会、教育、医療プログラムを悪用する人々がたくさんいる。したがって、我々は社会のために何もしない人々のために、国外追放と再定住プログラムを組織し始める。なぜなら、彼らの喪失はそもそも喪失ではないからだ。"
 CSA_focus_the_basic_needs_program: "基本ニーズプログラム"
 CSA_focus_the_basic_needs_program_desc: "The BNP is a series of employment programs as a way to reform light risk criminals as well as those who may be perceived as \"useless\", to our society. While we don't expect much, this would help to stop gap any kind of overt aggressive actions and potential reactions for the time being."
 CSA_focus_a_hard_border_is_a_real_border: "厳格な国境こそ真の国境"
 CSA_focus_a_hard_border_is_a_real_border_desc: "The ailing uncle Sam, or at least whatever remains of the federalists in the capital region have been uppity about their ambitions. We don't know exactly what they are planning but suffice to say we will never fall victim to their tyranny again. As such we shall construct a true and hard border between our nations to ensure the peace and defense of our fair Southern nation."
 CSA_focus_fueling_the_nation: "国家への燃料供給"
 CSA_focus_fueling_the_nation_desc: "We need to power our very nation to ensure the needs of our people as well as our economy are met."
 CSA_focus_mining_expansions: "鉱業拡大"
 CSA_focus_mining_expansions_desc: "南部国家の土地は、実際には一つのトリックの経済的なポニーのためにのみ使用されてきたものである。これは農業産業とその多くのサブセクターであり、国家を養い、生かし続けている。しかし、広範な地質調査と、国内のニーズと余剰により焦点を当てることを通じて、我々は原材料の自給自足の基盤を拡大し、創設することができる。大したことではないが、中心地とルイジアナの新しいリチウム鉱床は、将来の発見とプロジェクトに多くの希望をもたらしている。"
 CSA_focus_military_productions_act: "軍事生産法"
 CSA_focus_military_productions_act_desc: "国家の防衛は、社会と生活様式の安全と保障を確保するために最も重要である。これをもって、我々は軍事生産能力の拡大への改革と投資を開始する。"
 CSA_focus_heartland_training_complex: "中心地訓練複合施設"
 CSA_focus_heartland_training_complex_desc: "To ensure peak training efficiency we must create a complex to be able to diversely and rigorously train new recruits into our armed forces. The army being paramount defense from all enemies on land means that creating an extensive network of interconnected bases and training facilities will speed up, refine, and harden new recruits to defend their homes and families."
 CSA_focus_coastal_contingencies: "沿岸緊急時対応計画"
 CSA_focus_coastal_contingencies_desc: "まさに我々の土地の保全は正面から対処されなければならず、したがって、重要な国家規模の沿岸投資と軍事化が必要である。また、海軍および海運産業の拡大への投資により、時が経つにつれて成長するだけの基準を設定できる。"
 CSA_focus_food_procurement_and_surplus_initiative: "食料調達・余剰イニシアチブ"
 CSA_focus_food_procurement_and_surplus_initiative_desc: "The FP&SI is a general investment scheme to develop foodstuffs storage and baseline expansion. This reduction in prices at the store as well as lessening the burden on average folks will boost our appeal and national health as a whole. We also hope this food security of such will encourage general employment trends to increase and lessen the average real unemployment rates."
 CSA_focus_national_preservation_act: "国家保全法"
 CSA_focus_national_preservation_act_desc: "国家とその機能性の保全は、国家政府自体から始まる。この明白な事実を念頭に置いて、政府議会は汚職を扼殺するための独立した監査組織を創設する法案を可決した。良い波及効果は、税金を徴収する側と支払う側の両方がシステムとその結果により信頼できるようになるため、全体的な透明性とリアルタイムの歳入への増加である。"
 CSA_focus_targeted_energy_diplomacy: "対象を絞ったエネルギー外交"
 CSA_focus_targeted_energy_diplomacy_desc: "同様の視点や立場を持つ国々との研究投資と貿易取引の確保を利用することで、地政学的な影響力を高めることができる。大したことではないかもしれないが、これらは単に国家をより良くし、より攻撃的なタイプから我々の立場を確保するための赤ちゃんのステップである。"
 CSA_focus_ignoring_the_past: "無視して前進"
 CSA_focus_ignoring_the_past_desc: "とっくに死んで起こったことを変えることはできないのだから、なぜ気にするのか。今、我々は自分たちと社会を確保し、望む未来を準備し、創造することができる。だから、前進できない人々は呪われろ、取り残されればいいじゃないか。"
 CSA_focus_smrs_victory: "南部近代王立協会、勝利"
 CSA_focus_smrs_victory_desc: "ある種の安堵のため息の中で、南部近代王立協会が選挙で勝利を収めた。元および現役の軍人と、メリディアン家としても知られる南部の近代君主主義運動で構成されるこの協会は、反対派の厳しい現実にもかかわらず、多くの人々がはるかに穏やかになることを望む勝利をもたらした。しかし、期待するしかない。"
 CSA_focus_military_victory: "軍事的勝利"
 CSA_focus_military_victory_desc: "南部王立協会の選挙勝利を受けて、軍の政治部門が連合内でリードを奪った。多くの人々は、軍隊が国家の幸福を守り、保証することが主な機能であるため、均一性、誇り、そして単なる安心感の基準を作り出すことを望んでいる。軍国主義が悪用されるかもしれないと心配する人もいるが、ほとんどは驚くほど安心している。いずれにせよ、メリディアン家を通じたその同盟国は、政策決定を助け、バランスをもたらすためにできることをするだろう。"
 CSA_focus_arms_economics: "武器経済"
 CSA_focus_arms_economics_desc: "武器産業および一般的な防衛産業は、多くの人々が経済に貢献できるとは決して認識していないものである。国内の狩猟用および外国との取引のための小火器および同様の装備の販売を通じて、我々は経済の軍事化をいずれにせよ機能する経済にするという前例を設定する。"
 CSA_focus_expanding_naval_industries: "海軍産業の拡大"
 CSA_focus_expanding_naval_industries_desc: "The versatility that is the general naval industrial apparatus allows us to continue our economic militarization through flexible means. While most of these are dedicated to civilian affairs, the general metrics of ship building or naval based industrialization means converting these to military production will be a breeze."
 CSA_focus_corruption_affairs_administration: "汚職問題管理局"
 CSA_focus_corruption_affairs_administration_desc: "汚職は、機能する社会の存在の悩みの種である。軍隊自体は市民社会の中の社会に過ぎず、この知識をもって、独立した部門が創設され、民間および軍事機構から離れて汚職と内部問題を監査し、法的に処理する。結局のところ、権力は腐敗するので、なぜ権力を必要としない人々にすべての人の向上のためにそれを使わせないのか。"
 CSA_focus_central_southern_research_institute: "中央南部研究所"
 CSA_focus_central_southern_research_institute_desc: "CSRI（中央南部研究所）は、軍事および民間の革新と、これらの革新の一部が互いにどのように複合できるかを調整しようとする共同の民間および軍事の研究開発複合施設である。歴史自体が、軍事革新が民間革新を引き起こし、一種の素晴らしい小さなフィードバックループを作り出すことを示しているように。"
 CSA_focus_dixie_power_llc: "ディキシー・パワーLLC"
 CSA_focus_dixie_power_llc_desc: "国家レベルの電力会社を設立することで、国家の他の地域と比較して最も開発されていないコミュニティや地域を対象とし、支援することができる。民間および地方の事業体は通常通り活動するが、国家レベルの会社は、長期的には競争力を保つための補足およびバランス力として機能する。それだけでなく、これにより、一部の企業が短期的には純損失としか見なさないかもしれない場所に、新しい発電所を建設し、送電網を拡大するために直接投資することができる。"
 CSA_focus_meridian_royal_victory: "メリディアン王家の勝利"
 CSA_focus_meridian_royal_victory_desc: "The Modern Royal Society known as the House of Meridian seeks to create a new way forward through combining old traditions with new ideals. Through reforms related to the principle of an elective monarchy the HoM wishes to reform this through changing the one thing which technically separates a monarch and royalty from any other system. That is by getting rid of the need of titles of offices being held by those of the blood. Instead office titles will simply be attached to those who are elected to said office. Now it won't be a little white lie to tell your daughter that she is a princess, cause one day she may well indeed be one."
 CSA_focus_titles_renewal_act: "称号更新法"
 CSA_focus_titles_renewal_act_desc: "この法律は包括的な改革パッケージである。役職者に関連する政府の仕事には、適切な称号が付けられる。例として、大統領職は今や南部王に変更される。これに伴い、役職者の命名規則も変更される。要するに、それはファーストネームに基づくものとなる。現在の選出された王から始めて、もし王がジョンという名前だったら、彼らは南部王国のジョン1世となる。もし将来、別のジョンが選出された場合、その個人は南部王国のジョン2世となる。元称号保持者は、年間料金でかつて保持していた称号を合法的に更新できる。この料金は、国家を経済的に構築するのを助けるための基金として使用される。"
 CSA_focus_royal_energies_act: "王立エネルギー法"
 CSA_focus_royal_energies_act_desc: "REA（王立エネルギー法）は、国家全体でより多くのエネルギー生産施設を建設し、また、それらの同じ施設をより在庫を増やし、効率的にすることを目指す一般的なエネルギー開発支出パッケージである。"
 CSA_focus_imperial_minerals_security_act: "帝国鉱物安全保障法"
 CSA_focus_imperial_minerals_security_act_desc: "広大な国家には広大な未開発の富がある。世界市場での足場を確保するためには、国内市場を確保しなければならない。したがって、国内資源を拡大する新しい鉱業事業を改善、調査、創設するための広範な資金提供により、我々はかつて考えもしなかったかもしれない足跡を残すことができる。"
 CSA_focus_making_an_economy: "経済を作る"
 CSA_focus_making_an_economy_desc: "近い将来いつでもどこかに到達しようとするならば、我々が必要とする場所に到達するのを助けるための経済を実際に持たなければならない。したがって、国家経済を促進し、地域経済の専門性を高めるために、国家全体を適切に多様化し、投資するための国家経済計画が実行される。"
 CSA_focus_royal_nation_proclaimed: "王国の宣言"
 CSA_focus_royal_nation_proclaimed_desc: "我々の改革と、国家への新たな希望を楽しんでいる市民をもって、今こそ新しい道を切り開き、南部のアイデンティティを現実のものとし、また、一部の人々が依然として我々に烙印を押そうとするかもしれない傷や痛みではなく、団結と社会的流動性の国家として歴史に足跡を残す時である。"
 CSA_focus_automation_integration_programs: "自動化統合プログラム"
 CSA_focus_automation_integration_programs_desc: "The fears of change itself is a prevalent thing throughout human history. None more obvious than the fear of losing one's job and livelihood to provide for themselves or their family. But with innovation comes change and to change we must learn to adapt. Therefore businesses looking to implement automation or tech which potentially makes certain people's jobs redundant. Employees can apply for an automation retraining stipend which allows for the government to issue a pay grant for the period covering the time which the company needs to retrain the person. This way the individual still has a job, they learn a new skill and there is no earnest loss to the business."
 CSA_focus_tax_code_reforms: "一般税法改革"
 CSA_focus_tax_code_reforms_desc: "旧税法の執行と混乱、そしてその肥大化した性質は、抜本的な見直しが切実に必要である。したがって、国家政府は法全体を書き直し、法のセクションを個別に検討するためにいくつかの立法会期を取ることが適切であると見なす。この新しい法は、うまくいけば、施行しやすく、理解しやすく、そして単純かつ／または十分に率直で、抜け穴を見つけようとする本能的な衝動を制限するだけでなく、旧法で一般的だった抜け穴を先制的に塞ぐことができるだろう。"
 CSA_focus_military_expansions: "軍事拡大"
 CSA_focus_military_expansions_desc: "Our military is woefully under equipped to deal with any modern force, let alone to even defend from one. Therefore we must invest in general military expansion projects if we are to create a military worthy of our Southern tradition as well as creating a functional force to actually defend our homeland."
 CSA_focus_logistics_improvements: "兵站改善"
 CSA_focus_logistics_improvements_desc: "軍事的であれ民間志向であれ、兵站は、後ではなく今、物事を成し遂げるという機能性において重要な役割を果たしている。したがって、鉄道、道路、インターネットのインフラおよび兵站ニーズへの戦略的投資が創設され、構築され、社会的なコインの両面で必要な時に役立つだろう。"
 CSA_focus_geological_and_mineral_institute: "地質・鉱物研究所"
 CSA_focus_geological_and_mineral_institute_desc: "GMI（地質・鉱物研究所）は、専任の地質および鉱物科学研究施設である。主な目標は、資源抽出、精製、および地質調査方法における新しい革新を探索し、開発することに投資することである。この重度の混合資金提供研究所は、うまくいけば、我々がより多くを見つけ、元々最小限または「価値がない」と見なされていたものからより多くを作り出す新しい方法を見つけるにつれて、一部の国と比較して優位性を与えるだろう。"
 CSA_focus_southern_militarism: "南部軍国主義"
 CSA_focus_southern_militarism_desc: "南部の歴史には、有能な軍司令官と戦術的手腕の豊かな歴史がある。一部の人々は、戦略的に我々が不足しているかもしれないと見るかもしれないが。それにもかかわらず、我々はこの伝統を活用し、より良い装備を取得し、兵士の報酬を増やし、彼らの訓練が彼らを真に自分たちの炉床と家を守るように洗練することを保証するために、軍事予算を拡大することを目指す。"
 CSA_focus_from_past_pains_to_future_honors: "過去の痛みから未来の栄誉へ"
 CSA_focus_from_past_pains_to_future_honors_desc: "The past of our nation is soaked in the blood and riddled with the pains of all those who suffered for their times in history and the old ways. No more. We shall no longer be held hostage by old and delusional ideals of the past and instead we shall stab the ire of old with the pole of justice and freedom. We shall plant these very ideals into the foundation of our new and prosperous nation and set a new course to create new honors."
 CSA_focus_dixinomics: "ディキシーノミクス"
 CSA_focus_dixinomics_desc: "今、地に足をつける必要がある。経済を再び機能させるための手っ取り早い方法は、これらの土地が作られた基盤、すなわち農業から始めることだ。そこから、経済状況と、ここから本当にどこへ行きたいのかを理解することができる。"
 CSA_focus_department_of_energy: "エネルギー省"
 CSA_focus_department_of_energy_desc: "The DoE or some people refer to it as the Dixie Energy Department, is a national administrative branch which seeks to regulate as well as improve the cohesion of energy use and production. It doesn't have much to go off of, but it's a start to hopefully a truly brighter tomorrow."
 CSA_focus_electrical_storage_reforms: "電力貯蔵改革"
 CSA_focus_electrical_storage_reforms_desc: "ESR（電力貯蔵改革）は、国家全体の変電所と変圧器を、個別に言えば、より効率的で容量を大きくすることを期待する一連の貯蔵施設投資である。"
 CSA_focus_power_infrastructure_future_proofing: "電力インフラの将来保証"
 CSA_focus_power_infrastructure_future_proofing_desc: "他のどのインフラストラクチャと同様に電力インフラストラクチャの創設は、それがすでに開発された土地の上に構築されている場合、現在ではなく未来のために構築されなければならないということである。もちろん、我々を助けるためのジプシーと水晶玉はないが、いずれにせよ、都市化の歴史的傾向を見て、電力インフラストラクチャをより良く実装する方法を理解することができる。明日の新しい都市を作るだけでなく、明日のエネルギーニーズの必要性を送り出す能力をすでに作っている。"
 CSA_focus_investing_in_more_conductive_cables: "より導電性の高いケーブルへの投資"
 CSA_focus_investing_in_more_conductive_cables_desc: "誰もが銅が導電性の金属であり、電流を受け取り保持できることを覚えている。しかし、現代の要求は、現代的な導電性の形態が必要であることを意味する。したがって、我々はより安定した送電網と将来の要求に備えることができる送電網を可能にするために、より良く、より強力なケーブルに投資する。"
 CSA_focus_expanding_fossil_fuel_facilities: "化石燃料施設の拡大"
 CSA_focus_expanding_fossil_fuel_facilities_desc: "古き信頼、ツリーハガー（環境保護活動家）の絶え間ない whining [すすり泣き、不平] にもかかわらず、彼らは、ローリング停電を誰もが経験したくない限り、現実を否定することはできない。エネルギーの現代的な要求は、すべてを再生可能にするという想定される「合理的な」時間表を超えている。したがって、個々の要求を分散させる方法として、例えば天然ガスや石油だけに頼るのではなく、さまざまな化石燃料プラントを拡大しなければならない。"
 CSA_focus_renewable_diversity: "再生可能エネルギーの多様性"
 CSA_focus_renewable_diversity_desc: "Our lands are made up of geographic regions which are suitable for the varied means of renewable energy methods. As such we shall invest in these regions to ensure our power needs are met through a diverse set of methods."
 CSA_focus_real_green_energy: "真のグリーンエネルギー"
 CSA_focus_real_green_energy_desc: "The future be it fictional or reality itself is led by nuclear power. Currently nuclear energy has been the most developed energy method due to its checkered history. Granted all were either mother nature herself or human error, but regardless these mistakes have been studied, developed and now nuclear energy is becoming more and more practical as the days go on. So now we shall join the future and make our own nuclear energy."
 CSA_focus_brighter_tomorrow: "より明るい明日"
 CSA_focus_brighter_tomorrow_desc: "国家のエネルギー自立は最重要であり、したがって、我々の安全保障は代理で強化される。これらの開発と将来来るであろう開発は、我々がかつて考えもしなかったよりも、我々の新しい日々をより明るくするだろう。"
 CSA_focus_modern_agrinomics_plan: "近代農業経済計画"
 CSA_focus_modern_agrinomics_plan_desc: "社会の重要な柱は、その人々を養うための食料品を取得し、持つ能力である。したがって、我々がアクセスできる現代技術と、農業利用に非常に肥沃な土地をもって、我々は経済を多様化させつつも同時に専門化するように調整することができる。"
 CSA_focus_frontier_industrialism: "フロンティア工業主義"
 CSA_focus_frontier_industrialism_desc: "中心地には食料があり、フロンティアには産業があるだろう。公正な国家の中核が、経済を非常に活気づける真の経済的心臓部と一致するバランスが作られるだろう。"
 CSA_focus_cash_crops: "換金作物"
 CSA_focus_cash_crops_desc: "Crops for cash and cash for crops, a great circle of economic and societal life itself. However some people value things a little more than other things and it is this value that we will use to spread the wealth of these crops to every state where and when possible. From cotton to tobacco we shall figure out a way to bring in the money with our national exports."
 CSA_focus_manufacturing_investments: "製造業投資"
 CSA_focus_manufacturing_investments_desc: "Our coastal states in the east and west are the perfect grounds for light and some heavy manufacturing. From the ports to the factories we can streamline basic supply chains and then be able to ship them to the agrarian heartlands or the industrial frontier states."
 CSA_focus_arms_production_investments: "武器生産投資"
 CSA_focus_arms_production_investments_desc: "Our nation needs to defend itself and what better way than to set up a domestic arms market. Our lands are rich hunting grounds and if we need to invest in anything larger than that, then war time conversions shouldn't be too hard considering its a similar field of manufacturing."
 CSA_focus_naval_investments: "海軍投資"
 CSA_focus_naval_investments_desc: "国家の沿岸水域は広大で未開拓であり、国内海運だけでなく、軍事的な海軍能力への投資も検討しなければならない。湾岸は一つのことだが、大西洋自体は対処すべき異なる種類の海戦を設定する。"
 CSA_focus_agrinomics_expansion: "農業経済拡大"
 CSA_focus_agrinomics_expansion_desc: "農業経済計画の傾向は、この現代において多くの人々が可能とは思わなかったであろう結果をもたらした。しかし、決意には意志力が伴い、市民の鼓動する心臓であるその同じ力が、そのような結果を生み出すための努力と時間を注ぎ込んだ。我々は世界で最も強力な農業産業の一つを持ち、これらの複雑でうんざりする「近代性」の日々において、よりシンプルな生活を送る方法の真の例を示す。"
 CSA_focus_dixie_agrinomics_practice: "ディキシー農業経済実践"
 CSA_focus_dixie_agrinomics_practice_desc: "The DAP is an economic theory that provides a modern context to old style Agrarianism. Understanding the short falls of a pure Agrarian society we instead have reformed the economy to be well rounded and domestic focused, with the economic speciality of agriculture being the leverage for international support. When things go a little wrong internationally, we simply just have a better domestic supply to feed and grow our pop, maintain our military, schools, welfare and healthcare programs with foodstuffs and much more. It's a society of plenty, but plenty without all the negative influences of consumerism and \"the paradox of choice\" of a modern 4th Industrial Revolution Economy has."
 CSA_focus_department_of_natural_resources: "天然資源省"
 CSA_focus_department_of_natural_resources_desc: "DoNR（天然資源省）の創設は、天然資源をどのように扱うべきかについて、国家的な統一されたアプローチを中央集権化し、創設することである。ミシシッピ州とアラバマ州の下部には鉱物鉱床があり、ジョージア州には鉄、銅、金があり、そして我々が支配する土地全体には他のものの良い混合物があることを理解している。この理解こそが興味深い疑問を提起する。我々は十分なことだけをすべきか、それとも未来自体の可能性を保証すべきか。"
 CSA_focus_the_future_is_now: "未来は今だ！"
 CSA_focus_the_future_is_now_desc: "我が国は新しく、比較的に脆弱な国である。未来を確保するため、家を確保するため、そして生活様式自体を確保するために。国家は、その天然資源を収穫するための発掘、利用、能力向上を保証しなければならず、また保証するだろう。"
 CSA_focus_dixie_lithium_belt: "ディキシー・リチウム・ベルト"
 CSA_focus_dixie_lithium_belt_desc: "Recent geological survey data in the southern half of both Alabama and Mississippi going up into north Louisiana and potentially into Texas has seen a long strip of Lithium rich deposits. These new found deposits will do wonders to secure our tech needs in regards to battery and certain tech based manufacturing."
 CSA_focus_a_devils_deal_with_georgia: "ジョージアとの悪魔の取引"
 CSA_focus_a_devils_deal_with_georgia_desc: "The rich mineral state of Georgia has a mix of copper, iron, gold and much more. Therefore a mining and subsequent industrial hub around the Appalachian northern region of the state will be dedicated to finding, extracting and acquiring these great and diverse mineral resources."
 CSA_focus_black_gold_and_more: "黒い金など"
 CSA_focus_black_gold_and_more_desc: "国家には豊富な化石燃料やその他のエネルギー資源がある。国家のエネルギー需要が満たされ、満たされることを保証するために、これらが収穫されることを確実にしなければならない。"
 CSA_focus_self_security_over_exhaustion: "枯渇より自己安全保障"
 CSA_focus_self_security_over_exhaustion_desc: "国家の資源は多様で豊富かもしれないが、その確実性は不明である。したがって、経済の安定と結束を保証し、外国勢力への過度の依存を制限するために、必要なことだけをしなければならない。"
 CSA_focus_little_lithium: "リトル・リチウム"
 CSA_focus_little_lithium_desc: "LLMとLLAは、それぞれリトル・リチウム・ミシシッピとアラバマとして知られる親リチウム鉱業スタートアップを指す。国家政府によって部分的に助成されており、目標は、研究開発および一般的な商業または製造用途のためのリチウムの単純な国内需要を確保することである。"
 CSA_focus_buford_salem_project: "ビュフォード-セーラム・プロジェクト"
 CSA_focus_buford_salem_project_desc: "The BSP is a general investment series of mining start ups in Georgia and the Carolinas. Minerals like gold, copper, iron and much more are scattered throughout the Appalachian regions of these states. Therefore we can target each state and set them to mine a specific resource which will help general mining, plus if the future does genuinely demand it, their mining operations can help one another out in switching for what resource to look for."
 CSA_focus_petrochemical_diversity_programs: "石油化学多様性プログラム"
 CSA_focus_petrochemical_diversity_programs_desc: "The Petro Diversity Programs are a series of research and fossil fuel extraction initiatives to try and boost domestic energy independence as well as ensuring a small series of petrochemical related products."
 CSA_focus_ending_the_resource_debates: "資源論争の終結"
 CSA_focus_ending_the_resource_debates_desc: "国家の天然資源をどのように利用したいかについての意識的かつ明確な理解をもって、我々は今、DoNRを国家機構の機能的な一部として公式に宣言することができる。この進路が設定されたことで、我々は今、目指したい未来への道を確保する。"
 CSA_focus_modernized_dixinomics_program: "近代化ディキシーノミクス・プログラム"
 CSA_focus_modernized_dixinomics_program_desc: "With our nation having a history of being left behind it's no wonder many don't take us seriously. It is with this painful truth that we must force ourselves into the 21st century and join the industrialized economies of the world."
 CSA_focus_tech_industry_investments: "技術産業投資"
 CSA_focus_tech_industry_investments_desc: "真の近代化への旅を始めるためには、一般的なオフィス部門の技術産業部門を確立するための実際の投資を確保しなければならない。これらの投資は、技術部門内で民間の研究と革新の形態を創設し、国家が革新の未来を模索し始めるのを助けるだろう。"
 CSA_focus_national_industrialization_efforts: "国家工業化努力"
 CSA_focus_national_industrialization_efforts_desc: "一般化された産業および製造業への投資は、国家の多様な土地と人々を、彼らが以前経験したことがないかもしれない真の生活水準を楽しむことができる新しい資源と商品で支え、多様化し、力を与えるだろう。"
 CSA_focus_banking_and_office_sector_jobs: "Banking & Office Sector Jobs"
 CSA_focus_banking_and_office_sector_jobs_desc: "財政的に自らを高め、経済の多様化を続けるためには、オフィス部門と銀行部門の仕事の創設に投資しなければならない。"
 CSA_focus_armaments_investments: "軍備投資"
 CSA_focus_armaments_investments_desc: "To secure such an economic growth we must build a sufficient armaments industry to supply and help arm our military forces."
 CSA_focus_shipping_industrial_expansions: "海運産業の拡大"
 CSA_focus_shipping_industrial_expansions_desc: "商業と製造業の拡大に伴い、我々は海運能力も拡大する必要があるだろう。結果として、必要に応じてそのような海運が適切に保護されることを保証するために、我々は海軍へのコミットメントも増やす必要があるだろう。"
 CSA_focus_establishing_a_modern_dixie: "近代ディキシーの確立"
 CSA_focus_establishing_a_modern_dixie_desc: "The continued industrialization will put our nation on a higher standard than the old agrarian society could've even thought of. As such we'll ensure a new round of investments throughout our nation to secure this standard and better prepare our economy to be globally competitive."
 CSA_focus_modern_dixinomics_success: "近代ディキシー経済学の成功"
 CSA_focus_modern_dixinomics_success_desc: "With the programs, investments and so forth these past months we have created a well rounded and most diverse economy for which to secure our very national foundation. With this success we can seek out the means to an end for the future in which we want."
 CSA_focus_department_of_transportation: "運輸省"
 CSA_focus_department_of_transportation_desc: "DoT（運輸省）を設立することで、将来必要に応じて、民間および潜在的な軍事ニーズの両方のロジスティクス業務を組織化することが可能になるだろう。"
 CSA_focus_southeastern_highways_act: "南東部高速道路法"
 CSA_focus_southeastern_highways_act_desc: "The general improvement and flexibility of our highways is paramount for future proofing civilian automotive needs. This is even more apparent around the southeastern states which have most of the coastline, which in turn means more material transports to and from the ports."
 CSA_focus_greater_mississippi_highways_act: "大ミシシッピ高速道路法"
 CSA_focus_greater_mississippi_highways_act_desc: "ミシシッピ川は我が国防にとって最大の自然障壁の一つである。しかし、それはまた民間交通流にとって最大の自然な障害でもある。したがって、我々はこの地域の国々で、よく開発され、より良く接続された国家を保証するために、ミシシッピ周辺の州に投資しなければならない。"
 CSA_focus_reestablishing_the_southern_railway: "サザン鉄道の再建"
 CSA_focus_reestablishing_the_southern_railway_desc: "The Southern Serves The South, that was the model of the ole Southern Railway back before it was disastrously merged with the Norfolk & Western to form the cluster that was the Norfolk Southern. Well now we have a real chance to serve our Southern nation once more by raising this fallen flag and giving her new life."
 CSA_focus_reestablishing_the_mississippi_central: "ミシシッピ・セントラル鉄道の再建"
 CSA_focus_reestablishing_the_mississippi_central_desc: "The MCRR or Mississippi Central Railroad was a decent Class 3 almost Class 2 railroad back in its day. But with having our own control of our own lands now we have the ability to revive this railroad and make it a nice western counterpart to the eastern Southern Railway. Working hand in hand these two as well as the other smaller railroads will be able to move tons upon tons of cargo throughout the nation."
 CSA_focus_dot_prioritized_budgeting: "DoT優先予算編成"
 CSA_focus_dot_prioritized_budgeting_desc: "The maintenance and improving of our infrastructure nationally is what makes a society function with peak cohesion. We therefore will prioritize budgeting around the initial amount we give to the Department of Transportation"
 CSA_focus_southern_military_forces: "南部軍"
 CSA_focus_southern_military_forces_desc: "SMF（南部軍）は我が国防のバックボーンである。陸軍、海軍、空軍の軍種から成り、これらの軍種は、真に敵に追いつくためには、適切に検討され、開発されなければならない。なぜなら、我々はこの新しく見つけた自由をこれほど早く失うわけにはいかないからだ。"
 CSA_focus_southern_army: "南部陸軍"
 CSA_focus_southern_army_desc: "南部は豊かな軍事史と伝統を持っているが、これには変化を望まない古い考えの者たちがいる。我々は陸軍が右足ではなく左足でスタートすることを保証するために、いくつかの初期の再編成から始める必要がある。さもなければ、彼らはどのように行進を学ぶというのか。"
 CSA_focus_standardization_of_training_practices: "訓練慣行の標準化"
 CSA_focus_standardization_of_training_practices_desc: "To ensure proper mobilization, should the need arise. We must create a uniformed standard for our training programs within the army. This allows us to train more soldiers at quicker rates as drill instructors learn the training regimens for basic training itself."
 CSA_focus_basic_industrial_support: "基礎的な産業支援"
 CSA_focus_basic_industrial_support_desc: "実際に軍隊を運営するためには、彼らはある種の装備を必要とする。したがって、我々は成長する陸軍をより良くするために、防衛産業に向けていくつかの基礎的な投資を行うだろう。"
 CSA_focus_logistical_centric_planning: "ロジスティクス中心計画"
 CSA_focus_logistical_centric_planning_desc: "LCP is a different approach to military operations than what standard doctrine would see practiced in the field. While our movements may be more sparse, our supply lines and ability to supply our troops will result in an overall efficiency increase. The hope is by tooling our doctrine and style of organization to be more logistically inclined, this'll allow us to be more thoughtful of how we plan while minimizing overall losses in equipment and hopefully troops themselves."
 CSA_focus_jrotc_education_requirements: "JROTC教育要件"
 CSA_focus_jrotc_education_requirements_desc: "軍隊への受動的な接触は、新しい新兵を引き込む最良の方法であり、また軍隊に対する国家的な誇りを築く方法でもある。したがって、我々は教育機関と軍隊と共同で、学生が高校時代の学業中に少なくとも2年間のJROTCプログラムを行うことを保証するための専用の機構を創設するだろう。"
 CSA_focus_equal_opportunity_officer_training_program: "機会均等士官訓練プログラム"
 CSA_focus_equal_opportunity_officer_training_program_desc: "To ensure the quality of leadership and that the leadership roles needed to organize a standing army are filled, we must create a new OTP or officer training program. The goal of the OOTP is to create an environment which encourages non-commissioned officers as well as civilians looking to join the military to apply and train to be an officer. This will function like a basic training but for the officer class, however it will have significantly more requirements and standards set to ensure the quality of our officer corps is kept in check."
 CSA_focus_well_rounded_army: "バランスの取れた陸軍"
 CSA_focus_well_rounded_army_desc: "我々の初期の改革と設定された新しい基準により、我が陸軍は適切に自立するのに十分安定した。我々は今、我が国防と外交政策の未来のために陸軍をどのような方向に進めたいか、一種の方向性を設定し、突破する能力を持っている。"
 CSA_focus_doctrine_debates: "ドクトリン討論の開始"
 CSA_focus_doctrine_debates_desc: "我が陸軍軍種で創り出した創造と堅固な基盤により、現代の戦場で勝利をもたらすために使用する方向性、すなわちドクトリンを理解する必要があることが今や明らかになった。したがって、我々は選択肢を見直し、軍種のために望む未来のためにまさに何が必要かを理解する必要がある。"
 CSA_focus_civil_defense_doctrine: "民間防衛ドクトリン"
 CSA_focus_civil_defense_doctrine_desc: "CDD（民間防衛ドクトリン）は個人の名誉と誇りのドクトリンである。我が地域と旧合衆国の狩猟と銃文化を利用することによって、我々は独立したプログラムを洗練し、それらを一種の「私設国家警備隊」に沿うように規制することができる。これは、民兵部隊や組織、そして半訓練された民間人が、義務が呼びかけた場合に、参加を希望するか、徴兵するのが容易になることを意味する。もちろん、これはドクトリンが個人的な攻撃よりも国土防衛に焦点を当てているため、いかなる攻撃的な戦争も軽蔑されることを意味する。しかし、これらの想定される「3.5世代戦争」戦術は、敵を推測させ続けるのに役立つだろう。"
 CSA_focus_funding_independent_company_programs: "独立中隊プログラムへの資金提供"
 CSA_focus_funding_independent_company_programs_desc: "ICP（独立中隊プログラム）は、特定の地域や町区に割り当てられた「中隊」、すなわち独立した地方部隊を設立するための、国家的に資金提供された一連のプログラムである。もちろん、落とし穴は、防衛戦争の場合、これらの部隊が必要に応じて、その戦争が終わるまで正規軍に参加するよう呼び出される可能性があることである。"
 CSA_focus_rotc_and_jrotc_standards: "ROTC & JROTC基準"
 CSA_focus_rotc_and_jrotc_standards_desc: "教育システムへのJROTCおよびROTCプログラムの導入は、人口全体に軍隊という考え方を消極的に公開する良い方法だった。しかし、我々はこれらのプログラムを再調整して、市民が炉辺と故郷のために戦う理由を守り、導き、理解する方法を保証し、先制的に訓練する必要がある。"
 CSA_focus_continual_planning_doctrine: "継続計画ドクトリン"
 CSA_focus_continual_planning_doctrine_desc: "CPD（継続計画ドクトリン）は、陸軍の計画機構に焦点を当てたドクトリンである。作戦、情報などはすべて計画の影響であり、この考え方をもって、我々は計画自体をより良く洗練し、改善し、規模を拡大して、単なる物資と人的資源の生の力以上の結果を保証するための知識を身につける。結局のところ、戦術なき戦略は勝利への最も遅い道であり、戦略なき戦術は敗北前の単なる騒音である。"
 CSA_focus_improving_logistical_standards: "ロジスティクス基準の改善"
 CSA_focus_improving_logistical_standards_desc: "我々のロジスティクスニーズをより良く保持する能力を改善することは、すべてを計画するこの新しい時代において非常に貴重であることが証明されるだろう。"
 CSA_focus_orienteering_proficiency_training: "オリエンテーリング熟練訓練"
 CSA_focus_orienteering_proficiency_training_desc: "旧軍隊のジョークは、少尉、すなわち新任士官が常に地形ナビゲーション訓練で簡単に迷子になるということだ。したがって、これを真剣に受け止め、地形ナビゲーションを我々の主要な研究としよう。これにより、我々の部隊結束と地形理解は、伝統的な訓練が許すよりもはるかに柔軟になるだろう。"
 CSA_focus_shells_not_soldiers_doctrine: "兵士ではなく砲弾ドクトリン"
 CSA_focus_shells_not_soldiers_doctrine_desc: "SNS（兵士ではなく砲弾）ドクトリンは物資中心のドクトリンである。砲弾は、大きいか小さいかにかかわらず、質の高いわずかな人的資源よりも量が多い方が良いという原則を使用する。主な点は、新しい標準的な兵士を作るよりも早く、より多くの弾丸と砲弾を作ることができるということである。これは我々の経済にとっては少し負担が大きいだろうが、兵士自身だけでなく、戦争努力に対するすべての人々にとってより良い考え方を示すはずであり、それはより結束力があり、エゴ駆動の少ない社会的分裂を軍隊への参加、不参加へと導く。"
 CSA_focus_increasing_production_abilities: "生産能力の向上"
 CSA_focus_increasing_production_abilities_desc: "このような要求の厳しいドクトリンに追いつくためには、我々がすでに持っているもので生の材料生産量をどのように増やすことができるかを理解する必要がある。"
 CSA_focus_logistical_elitism: "ロジスティクスエリート主義"
 CSA_focus_logistical_elitism_desc: "我々のドクトリンは、これらすべての弾丸、爆弾、そして補給品を運び、取ってくる能力を必要とすることを意味する。したがって、ロジスティクス部隊はそれ自体で一種の「特殊部隊」に昇格されるだろう。それだけでなく、現代の戦闘では、これらの重要な補給品を敵の航空部隊から保護するためにできる限りのことをしなければならない。したがって、ロジスティクス部隊への重点は、我々が自分自身を見つけるいかなる戦争においても、その周辺、そして近くでの彼らの死の可能性の増加でもある。"
 CSA_focus_true_southern_army: "真の南部陸軍"
 CSA_focus_true_southern_army_desc: "我々のドクトリン討論は終わり、我が陸軍は我が国とその利益を確保するためのよく油の注された機械である。ここから我々は、真に近代的な参謀本部指導部を固めるための柱を創り出す。"
 CSA_focus_southern_air_force: "南部空軍"
 CSA_focus_southern_air_force_desc: "スペースコースト、ライト兄弟、これらは我が国の飛行自体との活気に満ちた歴史のいくつかの例である。この歴史こそが、空軍軍種の創設が単なる必要性だけでなく、歴史的伝統による権利でもあることを確実にするものである。我々は先祖を誇りに思わせる新しい歴史的な節目を設定するために空軍を作るだろう。"
 CSA_focus_air_r_and_d_department: "空軍研究開発部"
 CSA_focus_air_r_and_d_department_desc: "軍事的に言えば、カーブの先を行くためには空軍内に専門部署が必要である。しかし、民間契約を通じて、これは民間用途にも役立つことができ、全体的に航空旅行や航空輸送の革新などを促進する。"
 CSA_focus_sky_defense_doctrine: "制空権防衛ドクトリン"
 CSA_focus_sky_defense_doctrine_desc: "制空権における開発を優先することによって、我々は将来、空軍をどのように調整し洗練するかの基準を設定する。"
 CSA_focus_raining_thunder_doctrine: "降り注ぐ雷ドクトリン"
 CSA_focus_raining_thunder_doctrine_desc: "This doctrine prioritizes the ground attack and bombing capabilities of our air force. This prioritization will rely on the current trend of aircraft development to be sufficient enough to deal with wresting control of the skies while whatever bombers we have will decimate enemy ground and naval forces to prevent any real harm done to our overall war fighting abilities. After all, factories can be rebuilt, soldiers killed can not."
 CSA_focus_wright_aircraft_production_company: "ライト航空機製造会社"
 CSA_focus_wright_aircraft_production_company_desc: "ライト兄弟は最初の持続飛行を開拓し、旅行の全く新しい理解のための舞台を設定した。今、我々はノースカロライナに民間および軍用航空機生産のためのWAP会社を設立することによって彼らの名前を称える。"
 CSA_focus_production_alignments: "生産調整"
 CSA_focus_production_alignments_desc: "我々の新しいドクトリンは、軍事生産が、そのドクトリンへの我々の結束力のある採用とコミットメントが満たされることを保証するように再調整されることを要求する。"
 CSA_focus_the_blank_canvas_measurement: "白紙のキャンバス測定"
 CSA_focus_the_blank_canvas_measurement_desc: "ドクトリンの選択が固まったことで、我々は空軍が現代の戦場を白紙のキャンバスにし、それに対して我が陸軍が行進し、より良い明日が作られる新しい絵を創り出すための舞台を設定する。"
 CSA_focus_national_aviation_association: "全国航空協会"
 CSA_focus_national_aviation_association_desc: "NAAは、飛行の美しさ、機械、そしてそれらの機械の背後にいる人々について公衆を鼓舞し、情報を提供するために国中でイベントを組織する、軍民共同の会員グループである。受動的な接触は軍隊に採用への素晴らしい後押しを与え、同時に民間か軍人かを問わず、意欲的な飛行士の新しい世代を創り出す。"
 CSA_focus_expanding_airbases: "空軍基地の拡張"
 CSA_focus_expanding_airbases_desc: "もし我々が国家の空を適切に防衛するための合理的な規模の空軍を持つつもりなら、我々は国中のいくつかの戦略的な空軍基地の容量を拡張しなければならない。"
 CSA_focus_southern_skies_for_southern_eyes: "南部の空は南部の目のために"
 CSA_focus_southern_skies_for_southern_eyes_desc: "Our air force is a proud and determined branch which makes up but a portion of the Southern Military Forces. Just like the Army and the Navy we are proud and honored to create and have such a splendid service branch and their serving members which defend our skies above."
 CSA_focus_southern_navy: "南部海軍"
 CSA_focus_southern_navy_desc: "Despite the wealth of coastline we have our naval forces are not really the best. Most naval power comes from the Atlantic coastline or over there in the pacific. However given the Mississippi river and the gulf of Mexico, we do have ample training grounds to refine and make do with a naval force of our choosing."
 CSA_focus_naval_maintenance_standardization: "海軍保守標準化"
 CSA_focus_naval_maintenance_standardization_desc: "我が海軍施設は非常に専門化されており、少しロジスティクスの混乱になりがちである。したがって、修理が必要なあらゆる船を受け入れるために施設の柔軟性を可能にするための一般的な基準を作成する必要がある。"
 CSA_focus_family_pay_incentives: "家族給与インセンティブ"
 CSA_focus_family_pay_incentives_desc: "海軍艦艇は多くの人々を必要とし、その人々はまた、我々が何らかの形で見つけるかもしれない任務や戦争において、一度に数日間、多かれ少なかれ孤立するだろう。このことを念頭に置いて、我々は海軍人員がそのような負担を引き受けるためのより良い正当化を求めなければならない。給与には適応的な家族手当があり、兵士が自分自身だけでなく、家にいる家族もカバーできるようにする。"
 CSA_focus_propulsion_testing_program: "推進試験プログラム"
 CSA_focus_propulsion_testing_program_desc: "Modern ships are big and stuffed to the brim with a lot of weaponry. We need to find ways to make our vessels more agile, making sure the enemy wastes munitions and is forced to use heavy stuff like missiles. This soft form of attritional warfare at sea will allow us to hopefully keep a real standard with the added benefit of long term cost reductions in times of crisis."
 CSA_focus_njrotc_programs: "NJROTCプログラム"
 CSA_focus_njrotc_programs_desc: "While the JROTC programs can be any service branch which the education institution would like to have a program there, naval programs are a lot more unique to give students real exposure to the navy itself. Therefore a certain radius of schools close to the coastline or Mississippi river will have dedicated Naval JROTC programs on top of what may be already present. The goal is to allow these naval JROTC programs to have funding and access to major water ways to allow for more hands on understandings of certain things the students could be expected to do if they chose to go into the navy."
 CSA_focus_general_training_improvements: "一般的訓練改善"
 CSA_focus_general_training_improvements_desc: "GTIは、海上での射撃および危機対応シナリオの質と効率を保証するための一連の一般的な投資である。結果として、これらのプログラムは、乗組員が船種への専門化を主要なコースではなく次のステップとして、もう少し柔軟になることを可能にするだろう。"
 CSA_focus_from_the_gulf_to_the_ocean: "湾から大洋へ"
 CSA_focus_from_the_gulf_to_the_ocean_desc: "一般的な洗練プログラムと海軍軍種の固化により、我々は今、他のどの国とも同じように、我々の水域と交易路を設定し、建設し、防衛するための施設を持っていることを喜んで言うことができる。"
 CSA_focus_what_color_water_debate: "何色の水か、討論"
 CSA_focus_what_color_water_debate_desc: "防衛に十分な海軍力を持つことは一つのことだが、しかし、我々は我が国の将来の安全保障のために下されるべき真の選択を持っている。グリーンまたはブルーウォーター海軍開発は、対応し、将来の我が海軍力を定義する先例を設定するために、我々の海軍開発を準備し、方向付けるだろう。"
 CSA_focus_if_it_floats_its_a_boat: "浮けば、それはボートだ"
 CSA_focus_if_it_floats_its_a_boat_desc: "Quantity over quality. The life long debate is something which many struggle with as each has its ups and downs. However we may have just found a way to make quantity viable again for a naval force. By shrinking, standardizing and streamlining things like ship designs and personnel training, we set up the game to allow our naval force to be responsive through volume rather than overtly precise strikes. The enemy morale will surely take a hint and seeing the ocean disappear into a wave of steel and guns."
 CSA_focus_the_steel_wave_doctrine: "鋼の波ドクトリン"
 CSA_focus_the_steel_wave_doctrine_desc: "鋼の波ドクトリンは、これらの新しいより小さな基準を中心に海軍艦艇と訓練をスケーリングすることに焦点を当てた量ドクトリンである。この再スケーリングにより、生の攻撃能力を犠牲にしてより多くの船を配備することが可能になる。つまり、我々は敵の海軍部隊に対して、よりアリが蜂蜜に向かうような方法で、より機動的に、そして柔軟に対応できることを意味する。"
 CSA_focus_ship_building_supremacy: "造船覇権"
 CSA_focus_ship_building_supremacy_desc: "SBSは、我が海軍力の規模と決意に貢献し、保証することができる戦時艦隊船を生産するために、海軍産業が支援し、柔軟であることへの献身である。"
 CSA_focus_green_water_gremlins: "グリーンウォーター・グレムリン"
 CSA_focus_green_water_gremlins_desc: "メキシコ湾は我が海軍力にとって完璧な訓練場である。これらの沿岸水域は、世界を横断する必要はなく、決意と技術で我々の水域を守ることに固執する海軍を創り出すことを可能にするだろう。"
 CSA_focus_coastal_coordination: "沿岸連携"
 CSA_focus_coastal_coordination_desc: "我が艦隊は、南部軍という軍事機械の歯車であるならば、地上および航空部隊とより良く連携する方法を理解する必要がある。"
 CSA_focus_submerged_animals: "潜水動物"
 CSA_focus_submerged_animals_desc: "我が潜水艦隊は、水上艦隊が提供する視覚効果と同じくらい致命的でなければならない。この考え方をもって、我々はこれらの深海の動物が、そのような動物であるという名声を得るように、ドクトリンを調整する。"
 CSA_focus_blue_sea_sailors: "ブルーシー・セイラー"
 CSA_focus_blue_sea_sailors_desc: "世界は深い青い水で覆われており、もし我々がいかなる真の現代海軍力にも対応するつもりなら、そのような共通性に適合する海軍を創り出さなければならない。"
 CSA_focus_fleet_standards_doctrine: "艦隊基準ドクトリン"
 CSA_focus_fleet_standards_doctrine_desc: "FSDは、艦隊の規模と構成に対する基準を洗練し設定するドクトリンであり、これにより我が海軍は陸軍と同様に組織化されることが可能になる。これにより、同様に構成された艦隊を持つ敵部隊への力の適切なエスカレーションと応答性が可能になる。"
 CSA_focus_seamen_for_a_sea_fleet: "外洋艦隊のための船員"
 CSA_focus_seamen_for_a_sea_fleet_desc: "外洋航行および大洋航行艦隊のためにその質が満たされることを保証するための我が海軍人員の訓練と洗練は、同様に我が海軍産業を再調整するための新しいドクトリンを固める。"
 CSA_focus_sailing_the_ocean_blue: "青い大洋を航行する"
 CSA_focus_sailing_the_ocean_blue_desc: "我が海軍の未来は石に刻まれた。我々は、今後数十年にわたる我が国家政策の先例を設定する力を創り出した。我々が我が国の向上のために正しいことをしたことを願おう。"
 CSA_focus_the_southern_general_staff: "南部参謀本部"
 CSA_focus_the_southern_general_staff_desc: "我が軍隊の洗練と発展は、士官団が改革と未来への希望の灯台となるのを見てきた。この革新性と実力は、時の翁が把握し、人間の脆弱性の通常の過剰を打ち負かし始める前に、最大限に活用しなければならない。"
 CSA_focus_southern_sunrise: "南部の日の出"
 CSA_focus_southern_sunrise_desc: "我々は考えをまとめ、国家として機能する方法を見つけ出した。この時点で、自分たちのことだけを考えるのはもう終わりにする時が来た。問題は、正直に言って、どのような種類の外交関係を取るべきかということだ？"
 CSA_focus_the_golden_policy_plan: "黄金政策計画"
 CSA_focus_the_golden_policy_plan_desc: "我が国の位置と経済構成は、湾岸地域における外交政策へのユニークなアプローチを可能にする。このことを念頭に置いて、我々は古い考えを復活させ、新しい国家アイデンティティを固め、古い連合からの連邦主義の悪臭を取り除くことができるだろう。"
 CSA_focus_subjugating_the_yellow_rose: "黄色いバラの征服"
 CSA_focus_subjugating_the_yellow_rose_desc: "黄金の環を復活させる最初のステップは、計画における最大のプレーヤーであるメキシコへの我々の入り口を設定することである。しかし、メキシコに着くためには、テキサスを通過する必要があるだろう。我々は多くの文化的類似点を共有しているが、テキサス人が望むもの、すなわち彼らの文化的アイデンティティを与えることを望む。結局のところ、USAの時代にテキサス人に彼らが何であったかを尋ねれば、彼らは言うだろう。我々は第一にテキサス人、第二に南部人、そして最後にアメリカ人だと。"
 CSA_focus_war_plan_rodeo: "戦争計画ロデオ"
 CSA_focus_war_plan_rodeo_desc: "The Road to the Circle is met by the 2nd largest speed bump. This speed bump being of course the nation of Texas, and while yes there are similarly sized nations like Colombia and Venezuela, these do not compare in fighting spirit like that of the Texas people. Therefore only war is the way for which to secure and show these rodeo clowns just how the tables will indeed turn."
 CSA_focus_the_west_indies_whirlwinds: "西インド諸島の旋風"
 CSA_focus_the_west_indies_whirlwinds_desc: "In order to secure the Golden Circle, we must also actually secure the internals which comprise the circle. Therefore we need to set the stage to focus and have our own set of island hopping if we are to achieve anything meaningful in the near future."
 CSA_focus_war_plan_guantanamo: "戦争計画グアンタナモ"
 CSA_focus_war_plan_guantanamo_desc: "There is clearly no real negotiating power with Cuba, they're too stuck in their ways with the influences of Castro still gripping them by the neck. So we go to war to free them and show them a real and fairer system."
 CSA_focus_hispaniola_heart_to_heart: "イスパニョーラ腹を割って"
 CSA_focus_hispaniola_heart_to_heart_desc: "Haiti is a mess, its neighbor the Dominican Republic is not all that better. We can incentivize these two through economic means and social stability through help with civil services. Just another step towards our golden goal."
 CSA_focus_hispaniola_hiccup: "イスパニョーラしゃっくり"
 CSA_focus_hispaniola_hiccup_desc: "イスパニョーラ島は今日に至るまで問題を抱えた歴史を持っている。この考え方をもって、我々はこれらの失敗した政府に対して迅速かつ直接的な行動を取ることによって、島の安定を保証しなければならない。より良い明日のために、我々は島とその人々に安定をもたらすだろう。"
 CSA_focus_carribbean_cleanup: "作戦カリブ海掃討"
 CSA_focus_carribbean_cleanup_desc: "地図上のこれらの点々の状態は様々で予測不可能である。我々はこれらの国々から多くを期待すべきではなく、したがって、我々の侵攻部隊は物事を一掃し、統一と安定の新しい政治的実体を創り出すことができるはずである。それだけでなく、我々が得る観光の独占について考えてみろ、私にはかなり良さそうだ。"
 CSA_focus_british_concessions: "英国の譲歩"
 CSA_focus_british_concessions_desc: "我々の地域的覇権を固めるためには、まだヨーロッパの支配下にある外国の土地を獲得するための異なる方法を見つける必要がある。英国は財政的にあまり良くないので、多分我々は単に彼らから島々を買い取ることができるだろう。"
 CSA_focus_french_concessions: "フランスの譲歩"
 CSA_focus_french_concessions_desc: "フランスはまだここカリブ海の我々の将来の地域計画内に拠点を保持している。我々が我々の半球外の外国勢力からのカリブ海全体の一般的な支配を固めることができるように、我々は何らかの解決策について話し合う必要がある。"
 CSA_focus_dutch_concessions: "オランダの譲歩"
 CSA_focus_dutch_concessions_desc: "One of the last bastions of European control here in the western hemisphere is that of the Netherlands with the island of Curacao. We should be able to grant them a generous lump sum to take it off their hands."
 CSA_focus_retooling_our_bureaucracy: "我が官僚機構の再調整"
 CSA_focus_retooling_our_bureaucracy_desc: "我が国の行政手段の性質はその限界まで引き伸ばされている。もし我々が外国および国内のニーズに追いつくつもりなら、我々は更新し、合理化し、より良く組織化することを目指さなければならない。"
 CSA_focus_war_plan_aztec: "戦争計画アステカ"
 CSA_focus_war_plan_aztec_desc: "リオ・グランデ川を渡り、南部の前線を確保する時が来た。結局のところ、もし彼らがすでにあなたの国境内にいるなら、不法移民はあり得ない。"
 CSA_focus_war_plan_fruit_basket: "戦争計画フルーツバスケット"
 CSA_focus_war_plan_fruit_basket_desc: "バナナ戦争は、中央アメリカにおける旧合衆国の外国権益にとって興味深い時期だった。さて、今こそ地域支配を確保し、これらの土地の人々の地域経済的幸福を確保するために、我々自身のバナナ戦争を持つ時が来た。"
 CSA_focus_war_plan_canal_crosser: "戦争計画運河横断者"
 CSA_focus_war_plan_canal_crosser_desc: "Across the Panama and into the lands of the old Gran Colombian state. Once we solidify this southern front of Venezuela, Colombia and Panama, we will have but to simply clasp down and take hold of everything in between."
 CSA_focus_stabilizing_the_territories: "領土の安定化"
 CSA_focus_stabilizing_the_territories_desc: "我々の外国への冒険は頂点に達し、したがって、我々は一息つき、新しく見つけた領土を集め、再編成しなければならない。"
 CSA_focus_dallas_dance: "ダラス・ダンス"
 CSA_focus_dallas_dance_desc: "我々の文化を統合し、分裂よりも安定を求めることは、テキサス州の民間人口が地域に対する南部のリーダーシップに対してより友好的になることを可能にするだろう。"
 CSA_focus_cuban_calm: "キューバの平穏"
 CSA_focus_cuban_calm_desc: "カストロの亡霊はもういない。我々は今、旧キューバ国家に安定をもたらし、人々が我々と、そして今や自分たち自身と一つになることを可能にすることができる。"
 CSA_focus_western_civil_integrations: "西側市民統合"
 CSA_focus_western_civil_integrations_desc: "イスパニョーラ島西部、バハマ、ジャマイカの各島は、より効率的な新しい行政サービスを導入することで、統合への取り組みを開始できる。総じて、統合が正式に完了するまでは、少なくとも事態を鎮静化させることができるだろう。"
 CSA_focus_eastern_civil_integrations: "東側市民統合"
 CSA_focus_eastern_civil_integrations_desc: "From Puerto Rico to Trinidad & Tobago, the eastern islands are small but numerous and as such we'll need to find ways to streamline and better integrate these islands with one another to set the stage for eventual true integration with our new regional union."
 CSA_focus_cartel_contingencies: "カルテル緊急時対応策"
 CSA_focus_cartel_contingencies_desc: "地方カルテルとの交渉、結束力のある市民サービスの導入、そして旧メキシコ国家に安定をもたらす方法を見つけることは、我々が地方人口のコンプライアンスと協力を目にすることを可能にし、我々の地域連合のための舞台を設定するだろう。"
 CSA_focus_centroamerican_unity: "中央アメリカ統一"
 CSA_focus_centroamerican_unity_desc: "中央アメリカの価値観と地域主義を促進することは、我々がこの地域をより大きな黄金のパズルのピースとして焦点を当てることを可能にするだろう。これは地域連合とのより良い統合を可能にし、同時に彼ら自身に一種の二重の誇りを与えるだろう。"
 CSA_focus_golden_confederation_proclaimation: "黄金連合"
 CSA_focus_golden_confederation_proclaimation_desc: "今日、我々のすべての努力が実を結ぶ日である。野菜、葉巻、砂糖、そして楽しむための経済的および食料品の豊富な種類。なぜなら、今日、我々はもはや単なる「南部国家」ではなく、今や黄金連合であり、我々はこの西半球のかなりの地域を構成した湾岸、中央アメリカ、カリブ海地域の兄弟姉妹と共に高く誇りを持って立っているからだ。今日、我々は手を繋ぎ、統一、繁栄、そして恵み、平和、静けさをもって見つめるための黄金の夜明けの未来へと進む。黄金連合のために！"
 CSA_focus_old_glories_policy_plan: "古き栄光政策計画"
 CSA_focus_old_glories_policy_plan_desc: "At the height of its power the United States of America spanned from sea to shining sea. Basking in a continents' worth of natural resources it was matched by few abroad. However with massive power comes daunting responsibilities and the decadence that was the old order resulted in the great republic to finally collapse in on itself. Now we are in a very unique situation as we can set forth to recreate this greatness once more with a fresh slate and understanding. While a fair amount of people won't be too happy with this ambitious direction on foreign policy, we might as well do it now before the opportunity is lost forever."
 CSA_focus_great_northern_expedition: "大北方遠征"
 CSA_focus_great_northern_expedition_desc: "大いなる奪還を開始するためには、我々はまず北へ行進し、強力なミシシッピ川という大障壁の東にあるすべてを確保しなければならない。"
 CSA_focus_war_plan_superior: "戦争計画スペリオル"
 CSA_focus_war_plan_superior_desc: "Our initial invasion must straddle our most western borders, from there it'll be easier to encircle and advance onto the more eastern opposition forces."
 CSA_focus_war_plan_appalachia: "戦争計画アパラチア"
 CSA_focus_war_plan_appalachia_desc: "自由諸邦への侵攻は、ワシントンD.C.という旧権力の座を確保するだろう。これは、北東へ前進する際にアパラチア山脈を有利に利用することによって定義できる。"
 CSA_focus_war_plan_greater_hudson: "戦争計画大ハドソン"
 CSA_focus_war_plan_greater_hudson_desc: "ハドソン川からメイン州まで、我々は北東部全体を取り戻し、我々が自ら設定した運命を再び実現するために努力する。なぜなら、この最後の押し込みで、我々は間もなく偉大な第2アメリカ共和国となるものの東半分の支配を固めるからだ。"
 CSA_focus_cultural_integration_plans: "文化統合計画"
 CSA_focus_cultural_integration_plans_desc: "我々は旧共和国のように容易に分裂しないことを保証しなければならない。したがって、我々は互いの統一と文化的包摂の新しい現代的な基準を設定するために、先制的に計画しなければならない。"
 CSA_focus_midwestern_brothers: "中西部の兄弟"
 CSA_focus_midwestern_brothers_desc: "Hunting is the best unifying trait that the south and midwest share. We can use this catalyst as a way to bring together and unite the regions together as one, using the differences in food as a way to create new foods and cultural unity. Not to mention mannerisms are not entirely that far apart from one another just expressed using different words."
 CSA_focus_capital_compromises: "首都の妥協"
 CSA_focus_capital_compromises_desc: "The capital region also known as the Federalist States is a region fairly unique to the rest of the nation of the old republic. However where their culture may differ due to all the outer influences they make up more than enough with its history. The founding of both the articles of confederation, then the constitution as well as the nation itself stems from this focal region. As such we can make some compromises to allow for the preservation of this cultural neutrality and set forth a standard of unity through understanding and reason."
 CSA_focus_northeastern_needs: "北東部のニーズ"
 CSA_focus_northeastern_needs_desc: "北東部地域の生意気で多様な個性は、統合を少し困難にするだろう。しかし、彼らのニーズにより多く注意を払うことによって、我々は彼らが望んでいたとは気づかなかったかもしれないケアと親切の先例を設定する。ニューヨーカーからボストニアンまで、北東部全体のユニークな性質を構成する個性の多様性は、不安のための舞台を設定するだろう。しかし、もし我々が十分に注意を払い、実際に彼らの面倒を見るなら、我々はよりスムーズな前進を期待すべきである。言うまでもなく、これらの個性の一部は中西部と南部のある地域と一致するので、我々は常にできる限りそれらに訴えることができる。"
 CSA_focus_organizing_the_east: "東部の組織化"
 CSA_focus_organizing_the_east_desc: "東部の獲得物を組織化することは、我々が利用可能な資源についての理解を再収集することを可能にする。言うまでもなく、これは時が来たときに我々の西部拡大を開始するための舞台を設定するのに役立つ。"
 CSA_focus_pacific_pearls: "太平洋の真珠"
 CSA_focus_pacific_pearls_desc: "今日、我々は前進し、西へ行進して我々の運命を完了する。強力なミシシッピから、我々は今、太平洋の真珠を獲得し、これらの偉大な土地を再び統一するための軌道を作る。"
 CSA_focus_war_plan_houston: "戦争計画ヒューストン"
 CSA_focus_war_plan_houston_desc: "テキサス共和国は、小さいかもしれないが、非常に意欲的で、その領土について知識が豊富な国である。だから我々は、彼らの野心が我々が彼らを適切に統合する実現可能性を上回る前に、彼らを孤立させ、排除しなければならない。"
 CSA_focus_war_plan_wheat_field: "戦争計画小麦畑"
 CSA_focus_war_plan_wheat_field_desc: "ラコタ共和国は、旧共和国の旧グレートプレーンズ地域の多くを構成している。我々はこの穀倉地帯を確保し、彼らの孤立した独立精神を中西部と南部のそれらと比較し統一する方法として利用することによって、統合計画を設定しなければならない。"
 CSA_focus_war_plan_canyon: "戦争計画キャニオン"
 CSA_focus_war_plan_canyon_desc: "デザレット連合は名ばかりの連合であり、その領土は周囲および内部の文化からの影響が非常に多様であるため、地形自体を除けば、彼らを侵略することはかなり簡単な試練であるはずだ。しかし、我々はこの統一の欠如を利用して、将来彼らを統合し、彼らが支持できる真の、そして現実のアイデンティティを与えることができる。"
 CSA_focus_war_plan_cascade: "戦争計画カスケード"
 CSA_focus_war_plan_cascade_desc: "太平洋岸北西部、別名カスケード地域は、独立精神の観点からはかなり若い起源の一つである。したがって、この若さを将来我々の有利に利用することができる。今のところ、山々を突破しようとするのは非常に退屈な事柄になるだろうから、我々がどのように行動するかに注意する必要がある。"
 CSA_focus_war_plan_gold: "戦争計画ゴールド"
 CSA_focus_war_plan_gold_desc: "1800年代のゴールドラッシュは多くの人々をカリフォルニア州に殺到させた。今、我々は前進し、ゴールドラッシュ州を侵略し、我々の大陸十字軍を完了する。"
 CSA_focus_westward_integrations: "西部統合"
 CSA_focus_westward_integrations_desc: "We'll begin integration and unity programs with the border territories. This sets the stage for a three phased general integration effort as the next phase will be the states around the Rockies."
 CSA_focus_rocky_mountain_integrations: "ロッキー山脈統合"
 CSA_focus_rocky_mountain_integrations_desc: "The Rocky Mountains are one of the greatest natural barriers and so integration of anything on or beyond them will be a bit harder than usual. However we can use this as a way to compromise and assess the needs of these areas that way these vast distances don't seem so far any more."
 CSA_focus_pacific_pacification_efforts: "太平洋平定努力"
 CSA_focus_pacific_pacification_efforts_desc: "大陸全体を隔てているということは、伝統的な統一プログラムを実施するのが最も簡単ではないことを意味する。だから我々は新しい市民サービスを統合し、地域内の安定を保証して、それから我々の統合努力が実を結ぶことを可能にする必要があるだろう。"
 CSA_focus_the_second_republic: "第二共和国"
 CSA_focus_the_second_republic_desc: "After so long we have done it, today we can declare the 2nd American Republic and set forth a new destiny for which we have manifested through true grit and hard work. A new dream has become a new reality and it is now our job to set forth a new beginning for which we can be proud of."
 CSA_focus_cajun_way_forward: "ケイジャン政策計画"
 CSA_focus_cajun_way_forward_desc: "A significant influence on our culture can stem from the Cajun and Creole peoples around and in the state of Louisiana. This significant influence traces back to the old French territory of Louisiana which had replaced the lost Acadian colony the French had in Canada and New England. As such we believe that a better foreign policy plan would be to rediscover these roots and take inspiration from the old and give new light. Thus we shall begin national directive Arcadia and set forth to make a new name for ourselves."
 CSA_focus_midwestern_meltdowns: "中西部のメルトダウン"
 CSA_focus_midwestern_meltdowns_desc: "The Great Lakes Confederation is a vital logistical hub, be it railroads that spin like a web from Chicago, or the rivers of the Mississippi and Ohio. The region is ripe for the picking and now all's we need to do is just set the stage to lay out our potential justifications."
 CSA_focus_war_plan_windy_city: "戦争計画ウィンディシティ"
 CSA_focus_war_plan_windy_city_desc: "中西部の兄弟姉妹を仲間に入れる時が来た。我々の文化を固め、旧共和国の灰とこの疑似部族的な状況から生まれた一つの新しい民族として団結するために。"
 CSA_focus_capital_crisis: "首都危機"
 CSA_focus_capital_crisis_desc: "首都地域は、古い連邦主義の理想の「故郷」であること以外に文化がない。したがって、我々は主張と危機状況を確立する簡単な作業を行い、それに応じて行動することができる。"
 CSA_focus_war_plan_arlington: "戦争計画アーリントン"
 CSA_focus_war_plan_arlington_desc: "時が来た。首都では過去のことしか考えていない新世界の敵に我々自身を襲いかかろう。さて、今こそ彼らに未来を示す時だ。"
 CSA_focus_northeastern_nagging: "北東部のしつこさ"
 CSA_focus_northeastern_nagging_desc: "ニューヨーカーの人々の好戦的な個性は、緊張を高める能力を容易にするだろう。彼らの背後にいる、より受動的と思われる隣人を巻き込むための舞台を設定する。"
 CSA_focus_war_plan_tea_party: "戦争計画ティーパーティー"
 CSA_focus_war_plan_tea_party_desc: "今やゲームが設定されたので、我々は北東へ向かって前進し、旧合衆国大陸の東半分の支配を固めることができる。これは、我々の新しいアイデンティティ、地域的安定、そして我々がすべて自分たちで決定できる未来のための舞台を設定する。"
 CSA_focus_border_settlements: "国境入植地"
 CSA_focus_border_settlements_desc: "旧国境を取り壊し、新しい入植地を創設することは、我々が異なる文化をより良く統合し、混ざり合わせることを可能にする。真の最初の一歩だ。"
 CSA_focus_chicago_cheers: "シカゴの歓声"
 CSA_focus_chicago_cheers_desc: "シカゴは中西部の心臓部であり、そのように扱われるべきであり、その目的のために、我々はこのウィンディシティを利用して、文化的な違いと、人々の家族としての我々の統一の祝賀を共有するだろう。"
 CSA_focus_detroit_delight: "デトロイトの喜び"
 CSA_focus_detroit_delight_desc: "While Chicago may be the heart, then Detroit might as well be the lungs of the Midwest. Setting the stage for manufacturing companies big and small, Detroit will be a good second staging ground for our cultural celebrations and integration efforts."
 CSA_focus_crossing_more_than_the_delaware: "デラウェア川以上の横断"
 CSA_focus_crossing_more_than_the_delaware_desc: "丘を越え、遠くへ、D.C.、フィラデルフィアを通り、湾へ。我々は遠く旅し、これらの問題の土地に平穏をもたらす。今こそ、これらの土地に結束力と安定をもたらす時だ。"
 CSA_focus_boston_beautiful: "美しいボストン"
 CSA_focus_boston_beautiful_desc: "市民サービスをもたらし、地域に平穏を回復することは、我々がボストンでイベントや祝賀を設定することを可能にするだろう。古い革命がティーパーティーで始まった場所で、我々は今、一つの大きな家族としてより近くなるにつれて、新しい祝賀を開始する。"
 CSA_focus_a_new_beginning: "新たな始まり"
 CSA_focus_a_new_beginning_desc: "今、再生のプロセス、新たなスタート、そして我々の人々のための新しい時代のプロセスが始まる。"
 SRA_idea_railroad_mania: "鉄道マニア"
 SRA_idea_railroad_mania_desc: "列車は、その種類において、陸上で最も強力な乗り物である。そして南部共和国のエンジンは、間もなく世界的に有名になるであろう我が鉄道を構成するドック、産業、支線の背後にある力である。我々は偉大な南部鉄道を創り出すだけでなく、その物語を語るべきである。"
 SRA_idea_department_for_transport_innovation: "運輸革新省"
 SRA_idea_department_for_transport_innovation_desc: "Dedicated to the wholesale initiative of developing better, more advanced and more efficient ways of transporting both people and goods alike. The DTI is the result of dedicated funding to achieving such goals."
 SRA_idea_promoting_agriculture_influence: "Promoting Agricultural Influence"
 SRA_idea_promoting_agriculture_influence_desc: "我が土地は世界中で必要とされる農産物を栽培するのに最適である。我々の経済がそれによって支配される必要はないが、我々は確かにこれを利用していくつかのソフトな影響力を行使し、国内のニーズも確保することができる。"
 SRA_idea_old_habits_new_hopes: "サウザン・ドリーム"
 SRA_idea_old_habits_new_hopes_desc: "我々は偉大な国家を築いた。すべての人のための、そしてすべてが一つのための国家を。この現実は確保するのにかなりの時間を要し、それと共に過去の鎖を振り払うという現実が来る。現在でお互いを受け入れ、そしてすべての南部市民のために、彼らがどのように見えるかに関係なく、未来を創造し、作る。我々はサウザン・ドリームを作り、そして作るだろう。"
 SRA_idea_historical_innovation_classes: "歴史的革新クラス"
 SRA_idea_historical_innovation_classes_desc: "南部の歴史は農業開発の歴史である。さて、我々は歴史の悪い部分が教えられ理解されることを保証しなければならないが、問題が深刻になったときに真の革新が行われることを最も重要視しなければならない。その点に関して、我々は代わりに食料安全保障と農業研究という永続的な問題に目を向けるだろう。これは世界における我々の足跡を作り、また科学コミュニティにおける我々の文化的な印を作るだろう。"
 SRA_idea_agricultural_industrialism: "農業産業主義"
 SRA_idea_agricultural_industrialism_desc: "農業は機能する社会の基本的な基盤である。農業セクター全体の多様化への投資を通じて、我々は産業開発が社会からの基本的な要求を満たすだけでなく、我々の最良の部分である農業セクターを最適化し、拡大し、成長させることができることを保証することができる。"
 SRA_idea_expanded_corps_of_engineers: "拡張された工兵隊"
 SRA_idea_expanded_corps_of_engineers_desc: "With the expansion of our Corps of Engineers we can incorporate a civilian extension of the Corps and apply several peace time abilities. Consequently this gives a reserve force which could be mobilized if need be to help with military logistics and back line defensive works."
 SRA_idea_a_southern_dream: "サウザン・ドリーム"
 SRA_idea_a_southern_dream_desc: "我が土地、我が人民、我が家族。我々の運命は南部のそれであり、快適さ、家族、そして南部の精神の夢こそが、我々がすべての市民が楽しむことを保証するために努力するものである。なぜなら、家とママの家庭料理ほど良いものはないからだ。"
 SRA_idea_industrial_stagnation: "産業停滞ドクトリン"
 SRA_idea_industrial_stagnation_desc: "農業セクターは文明のバックボーンであり、このバックボーンは全体的に世話をされ、強化されなければならない。したがって、我々はこのバックボーンがもろくなり、枯れ果てないことを保証するために、国全体をどのように開発するかという考え方を変えなければならない。"
 SRA_idea_nature_navigators: "自然のナビゲーター"
 SRA_idea_nature_navigators_desc: "このような多様な地理により、兵士をバランス良く訓練し洗練させる我々の能力は、地上の少年たちに柔軟性を与えるだけでなく、飛行少年たちも発見困難な地形での敵の動きを追跡する方法についてより良い理解を得る。"
 SRA_idea_historical_scars: "歴史的傷跡"
 SRA_idea_historical_scars_desc: "Sometimes it's best to not forget the past. But those pains leave scars, and though our nation has come a long way, the national and somewhat international stigma around our very existence is still something which is of hesitation. Maybe some day we can truly move on..."
 SRA_idea_ignoring_the_past: "過去の無視"
 SRA_idea_ignoring_the_past_desc: "過去はまさにそれ、過去にある。変えることはできず、だからなぜ心配するのか。それに、我々には心配すべき現在と未来がある。"
 SRA_idea_from_past_scars_to_future_honors: "過去の傷跡から未来の名誉へ"
 SRA_idea_from_past_scars_to_future_honors_desc: "もはや我々は過去とその恐怖にまみれることはないだろう。我々は今、一つの南部の家族として共に前を向き、我々の新しく見つけた自由を奪おうとする敵から互いを守ることを目指すだろう。家族、友人、そして故郷のために、南部国家のために！"
 SRA_idea_formalized_department_of_energy: "正式化されたエネルギー省"
 SRA_idea_formalized_department_of_energy_desc: "With the establishment and investments made into the DoE, we can now look to better attend to our nation's energy needs."
 SRA_idea_from_theory_to_practice: "理論から実践へ"
 SRA_idea_from_theory_to_practice_desc: "The Dixie Agrinomics Theory has proven way more sustainable and tamer in reliance of a more domestic focus economy. Of course we still do global trade but where we trade what we genuinely have in excess, we get in return imports of a whole variety of quality."
 SRA_idea_formalized_department_of_natural_resources: "正式化された天然資源省"
 SRA_idea_formalized_department_of_natural_resources_desc: "大資源討論が終わったことで、我々は公式にDoNRの機能の基礎を設立し、創り出した。今、来るべきより明るい未来を作るために、我が国の向上のためにコースが設定された。"
 SRA_idea_a_modern_dixie: "近代ディキシー"
 SRA_idea_a_modern_dixie_desc: "The well rounded and diverse nature of our Modernized Dixinomics Program has seen us rise to new standards of economic power and quality of life than ever before. We now have a foundation for which we can secure the future we want and will have."
 SRA_idea_priority_budgeting: "優先予算編成"
 SRA_idea_priority_budgeting_desc: "運輸省が予算編成で最初の優先順位を得ることで、我々は我が国の絶えず変化するニーズ、それが民間であろうと軍事であろうと、に合わせてインフラを洗練し、適応させ、成長させることができるだろう。"
 SRA_idea_civil_defense_doctrine: "民間防衛ドクトリン"
 SRA_idea_civil_defense_doctrine_desc: "CDDは、民兵システムと正規軍の影響を組み合わせている。ある意味では、伝統的な現代戦争と「第4世代戦争」として知られているものの間の橋渡しとなることが意図されている。記録部のいくつかは、冗談めかして「3.5世代戦争」をドクトリンの代替名として付け始めている。"
 SRA_idea_civil_defense_doctrine_one: "民間防衛ドクトリン"
 SRA_idea_civil_defense_doctrine_one_desc: "CDDは、民兵システムと正規軍の影響を組み合わせている。ある意味では、伝統的な現代戦争と「第4世代戦争」として知られているものの間の橋渡しとなることが意図されている。記録部のいくつかは、冗談めかして「3.5世代戦争」をドクトリンの代替名として付け始めている。"
 SRA_idea_continual_planning_doctrine: "継続計画ドクトリン"
 SRA_idea_continual_planning_doctrine_desc: "CPDは、陸軍機能の計画機構を使用し、それを利用して陸軍の戦闘要素とロジスティクス要素の間の全体的な結束を洗練し改善する、洗練と忍耐のドクトリンである。"
 SRA_idea_continual_planning_doctrine_one: "継続計画ドクトリン"
 SRA_idea_continual_planning_doctrine_one_desc: "CPDは、陸軍機能の計画機構を使用し、それを利用して陸軍の戦闘要素とロジスティクス要素の間の全体的な結束を洗練し改善する、洗練と忍耐のドクトリンである。"
 SRA_idea_shells_not_soldiers_doctrine: "兵士ではなく砲弾ドクトリン"
 SRA_idea_shells_not_soldiers_doctrine_desc: "The SNS doctrine is a straight forward, material supremacy doctrine. While more costly to us economically, it would cost us way more as a society to lose more men and soldiers than it would bullets and bombs."
 SRA_idea_shells_not_soldiers_doctrine_one: "兵士ではなく砲弾ドクトリン"
 SRA_idea_shells_not_soldiers_doctrine_one_desc: "SNSドクトリンは、まっすぐな、物資至上主義のドクトリンである。経済的には我々にとってよりコストがかかるが、社会としては、弾丸や爆弾よりも多くの男性と兵士を失う方がはるかにコストがかかるだろう。"
 SRA_idea_airforce_sky_defense_doctrine: "空軍制空権防衛ドクトリン"
 SRA_idea_airforce_sky_defense_doctrine_desc: "SDDは、空域保持における目標指向の優位性に焦点を当てたドクトリンである。優先順位付けは爆撃任務をより効果的にするだろうが、しかし、与えられる注意の不足のために爆撃開発における我々の革新を引きずるだろう。"
 SRA_idea_airforce_raining_thunder_doctrine: "降り注ぐ雷ドクトリン"
 SRA_idea_airforce_raining_thunder_doctrine_desc: "爆撃能力を優先することによって、我々は戦場自体で敵の戦闘能力に強力な損害を与える能力を高める。"
 SRA_idea_airforce_sky_defense_doctrine_one: "空軍制空権防衛ドクトリン"
 SRA_idea_airforce_sky_defense_doctrine_one_desc: "SDDは、空域保持における目標指向の優位性に焦点を当てたドクトリンである。優先順位付けは爆撃任務をより効果的にするだろうが、しかし、与えられる注意の不足のために爆撃開発における我々の革新を引きずるだろう。"
 SRA_idea_airforce_raining_thunder_doctrine_one: "降り注ぐ雷ドクトリン"
 SRA_idea_airforce_raining_thunder_doctrine_one_desc: "爆撃能力を優先することによって、我々は戦場自体で敵の戦闘能力に強力な損害を与える能力を高める。"
 SRA_idea_steeL_wave_doctrine: "鋼の波ドクトリン"
 SRA_idea_steeL_wave_doctrine_desc: "The SWD is the refinement of quantity over quality in naval terms. This means that an overall reduction in training and ship sizes will allow us to field more vessels and be more alert and responsive to enemy forces."
 SRA_idea_steeL_wave_doctrine_one: "鋼の波ドクトリン"
 SRA_idea_steeL_wave_doctrine_one_desc: "SWDは、海軍用語における量より質の洗練である。これは、訓練と船のサイズの全体的な削減のために、我々がより多くの船を配備し、敵部隊に対してより警戒し、応答可能になることを意味する。"
 SRA_idea_green_water_gremlins: "グリーンウォーター・グレムリン"
 SRA_idea_green_water_gremlins_desc: "沿岸水域こそが、我々が心配する必要がある唯一の水域である。したがって、我々は我が国を最大限に確保するために、この考え方を中心に海軍機構を訓練し改善するだろう。"
 SRA_idea_green_water_gremlins_one: "グリーンウォーター・グレムリン"
 SRA_idea_green_water_gremlins_one_desc: "沿岸水域こそが、我々が心配する必要がある唯一の水域である。したがって、我々は我が国を最大限に確保するために、この考え方を中心に海軍機構を訓練し改善するだろう。"
 SRA_idea_fleet_standards_doctrine: "艦隊基準ドクトリン"
 SRA_idea_fleet_standards_doctrine_desc: "このドクトリンは、敵部隊に柔軟に呼びかけ応答することができるミニ海軍を創設することを可能にする。これにより、我が海軍全体が無謀な動きをせず、同時にこれらの標準化された艦隊構成形式を通じて乗組員と指導部に十分な経験を与えることができる。"
 SRA_idea_fleet_standards_doctrine_one: "艦隊基準ドクトリン"
 SRA_idea_fleet_standards_doctrine_one_desc: "このドクトリンは、敵部隊に柔軟に呼びかけ応答することができるミニ海軍を創設することを可能にする。これにより、我が海軍全体が無謀な動きをせず、同時にこれらの標準化された艦隊構成形式を通じて乗組員と指導部に十分な経験を与えることができる。"
 SRA_idea_southern_general_staff: "南部参謀本部"
 SRA_idea_southern_general_staff_desc: "南部軍は個々の軍種を偉大なものへと発展させ洗練させ、その上、これらの開発の進歩は士官団とその参謀本部にさえ達した。経験の富はカーブの先を行くために使用され、将来の南部人がそのような軍事的誇りを浴び、楽しむことができることを願うだろう。"
 SRA_idea_retooling_administrative_means: "行政手段の再調整"
 SRA_idea_retooling_administrative_means_desc: "Through the means of our ambitious foreign policy strategy, we've begun to have some administrative draw backs. We'll need to handle these excesses and get them under control if we are to more cohesively move our way forwards."
 SRA_idea_cultural_integrations_program: "文化統合プログラム"
 SRA_idea_cultural_integrations_program_desc: "The biggest fault of the old republic was the inflexibility to understand, adapt and integrate the differing sub-cultures which comprised it. We shall not make that mistake and instead begin cultural sharing and integration programs with the different regions so there is no individualism through these sub-cultures. Rather these will be pieces to the puzzle of our new American culture and way of life."
 SRA_idea_the_second_american_republic: "第2アメリカ共和国"
 SRA_idea_the_second_american_republic_desc: "額に汗し、多大な努力を通じて、我々は第2共和国を創り出した。我々は今、取り組むべき白紙の状態と、ほぼ無限の可能性の未来を持っている。"
 southern_republic_divided_we_fell: "分裂すれば倒れる"
 southern_republic_divided_we_fell_desc: "The union is no more, now lies a shattered mirror of sub-cultures and ashes from its violent demise. We must figure out how to hold our own before we can truly move on and go anywhere if we plan on becoming a true and independent nation."
 southern_republic_domestic_policies: "南部国内政策"
 southern_republic_domestic_policies_desc: "白黒はっきりし、また非常に赤く染まった歴史を南部が持っていたにもかかわらず、現代の人口動態の変化は、かつて作用していたより過剰な力のかなり多くを和らげた。しかし、これにもかかわらず、まさにそれらの同じ力が適応し、より良い言葉がなければ、じたばたせずに去るつもりはないようだ。それにもかかわらず、我々はこれらの過剰を克服し、新しい国家の静けさと生存を保証することを目指さなければならない。結局のところ、みんな、我々が南部のホスピタリティで維持すべき評判を持っていることを知っているだろう。"
 southern_republic_federal_budgets: "政府経費"
 southern_republic_federal_budgets_desc: "SRA、すなわち南部共和国の中央政府は、控えめに言っても興味深いものである。「連邦」という言葉を本当に誰も好まないため、彼らは代わりに政府経費のような専門用語でそれを回避するだけである。人々がどのような精神的な輪を飛び越えるかに関係なく、共和国の中央政府であり、したがって、人々に提供することと、旧連合がしたのと同じ道に我々自身を導かないこととのバランスを取る行為である。"
 southern_republic_industrial_policies: "ディキシー産業化省"
 southern_republic_industrial_policies_desc: "DID……（ディキシー産業化省、へへ、やったぜ）えーと、とにかく。ディキシー産業化省は、まさにその名の通り、国家の工業化と継続的な開発を担当している。我が土壌は作物でしかそれほど多くを与えられないので、我々は他のほとんどの国々に追いつくことを確認するために戦うことになるだろう。"
 southern_republic_resource_management_policies: "ディキシー管理局"
 southern_republic_resource_management_policies_desc: "DMAは、利用可能な労働力の組織化、および我が国の核心産業が容易に利用可能な原材料にアクセスできることを保証する任務を負っている。だから言い換えれば、鉱業と農業はDMAの監督下に置かれる傾向がある。"
 southern_republic_tax_policies: "ディキシー寄付省"
 southern_republic_tax_policies_desc: "Here we go again with the loop-de-looping, the DDD or as some joke, the Dixie Asking Department, is responsible for organization and implementation of the tax codes of the nation to ensure a general balancing of the books. They expect ups and downs, but they don't like the word taxes as many of the population were either a part of or aligned more with the old Libertarian Party of the union."
 southern_republic_army_service_branch: "南部陸軍"
 southern_republic_army_service_branch_desc: "The SAB or Southern Army is a highly traditional branch of the Southern Military Forces. Its honoring of historic military leaders that were born and from its territory means it tends to do a lot more training and imposes higher standards for its officer corps than it really should for its regular infantryman. Regardless the army is gonna have to take a long look at itself and figure out what earnest direction it wishes to go if its to defend its homeland or seek new adventures."
 southern_republic_air_force_service_branch: "南部空軍"
 southern_republic_air_force_service_branch_desc: "The Southern Air Force or SAF is a sort of neglected step child in terms of honest investment into its training and R&D department. Nevertheless with the influences of the Space Coast in Florida as well as several prominent airbases that are located in the Southern Republic, the Air Force makes do with what they got. But if the nation is to properly defend itself it's certainly going to need something more than what it's got."
 southern_republic_navy_service_branch: "南部海軍サービス"
 southern_republic_navy_service_branch_desc: "SNS、あるいは時々南部海軍と簡略化されるものは、かなり堅牢な軍種である。国家がメキシコ湾の沿岸地のほぼ3分の1を包含しているため、航海手段に参加する民間および軍事施設が豊富にある。しかし、これらの施設は旧連合の崩壊により大いに苦しんでおり、したがって、もし我々がこれほど広大な海岸線を適切に防衛できるつもりなら、修理、訓練、そしていくつかの真剣な投資が必要となるだろう。"
 SRA_new_orleans_capital: "首都を§Yニューオーリンズ§!にした"
 SRA_meridian_capital: "首都を§Yメリディアン§!にした"
 SRA_atlanta_capital: "首都を§Yアトランタ§!にした"
 SRA_charleston_capital: "首都を§Yチャールストン§!にした"
 SRA_country_flag_the_window_holds: "オバートンの窓は持ちこたえる"
 SRA_country_flag_the_window_shatters: "オバートンの窓は壊れる"
 SRA_fort_earl_van_dorn: "アール・ヴァン・ドーン砦"
 SRA_fort_edward_asbury_oneal: "エドワード・アズベリー・オニール砦"
 SRA_fort_james_deshler: "ジェームズ・デシュラー砦"
 SRA_port_henrietta: "ヘンリエッタ港"
 SRA_port_charlie: "チャーリー港"
 SRA_port_athena: "アテナ港"
 SRA_port_stephenson: "スティーブンソン港"
 SRA_port_davis: "デイヴィス港"
 SRA_port_creol: "クレオール港"
 CSA_New_Arlington: "ニューアーリントン"
 CSA_Mount_Columbia: "マウントコロンビア"
 CSA_Ulysses: "ユリシーズ"
 CSA_Quincy_capital: "クインシー"
 CSA_Southern_Kingdom_desc: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Yディキシー南部王国§!に変更する！"
 CSA_confederate_states_desc: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Yアメリカ連合国§!に変更する！"
 CSA_socialist_republic_of_dixie_desc: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Yディキシー社会主義共和国§!に変更する！"
 CSA_republic_of_dixie_desc: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Yディキシー共和国§!に変更する！"
 CSA_southern_union_desc: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Y南部連合§!に変更する！"
 CSA_united_southern_states_desc: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Y南部合衆国§!に変更する！"
 CSA_the_golden_confederation_tooltip: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Y黄金連合§!に変更する！"
 CSA_second_american_republic_desc: "[CSA.GetFlag]§Y南部アメリカ共和国§!は国名を§Y第2アメリカ共和国§!に変更する！"
 CSA_decisions_war_time_mobilization_category: "戦時動員"
 CSA_decisions_war_time_mobilization_category_desc: "必要が生じたとき、我々は少なくとも戦線の隙間を埋めるために義勇軍を召集することができる。戦争がいつ来るかは分からないが、我々の上に降りかかることは確実だからだ。"
 CSA_war_time_mobilization: "第一次動員"
 CSA_war_time_mobilization_desc: "戦いの時が迫っている。我々は故郷を守るため、一丸となって立ち上がらなければならない。ディキシーの若者たちよ、武器を手に取れ！"
 CSA_war_second_wave_defenders: "第二次防衛隊"
 CSA_war_second_wave_defenders_desc: "敵が攻勢を強めているため、我々は新たな防衛部隊を動員しなければならない。国民の士気は低下するだろうが、兵力は必要だ。"
 CSA_war_desperate_defenders: "絶望的防衛隊"
 CSA_war_desperate_defenders_desc: "事態は深刻化している。戦線を維持するためには、能力の有無にかかわらず、動ける人間は全員必要だ。もしかしたら、もしかしたらだが、まだこの戦いに勝てるかもしれない。"
 southern_republic_event.1.t: "首都問題"
 southern_republic_event.1.d: "In the wake of the aftermath that was the \"Great Riots\" of the former United States, many of the local governors are scrambling to make their states as appealing to an independent body of where the new Republic's capital should be. Some believe that it should be as central as possible and place the city of Meridian Mississippi as an optimal option. Some believe only Atlanta is the real choice being one of the most developed metropolitan areas of the South. While some cite historic symbolism and wish to have Charleston as the new capital, whatever the choice is it'll need to be sooner rather than later if we are to actually focus on our more pressing problems."
 southern_republic_event.1.o1: "我々はそれを経験したばかりなのに、\n忌々しい美人コンテストをやっているのか！？！"
 southern_republic_event.2.t: "委員会の選択"
 southern_republic_event.2.d: "After a handful of days as well as many pressures exerted by local officials to choose them the committee has come up with four distinctive choices. New Orleans for its trading hub and naval apparatus, Meridian in Mississippi for its strategic centrality when thinking of the old confederacy. Then there is Atlanta, the South's most developed metropolitan hub, which economically and governing wise would be kind of commonsense of a choice. Finally there is the historic symbolism that is making Charleston the capital. Charleston appeals to the right as well as it appeals to the Southern identity movement that's been growing ever more. Regardless the committee's choice is what determines who gets what."
 southern_republic_event.2.o1: "ニューオーリンズは明らかに\nアトランタに勝る"
 southern_republic_event.2.o2: "ディキシーの中心は中心であるべきだ、\nメリディアンにしよう"
 southern_republic_event.2.o3: "アトランタだけがここでの\n真の選択肢だ"
 southern_republic_event.2.o4: "我々の歴史は我々のアイデンティティだ、\nチャールストンが選ばれた"
 southern_republic_event.3.t: "政治劇場"
 southern_republic_event.3.d: "The Southern states are host to a complete natural disaster's worth of political factions and ideological influences. Not only does the South have to worry about the natural disasters of mother nature herself but of the excesses and fighting of its political extremes. From niche Klan members, to Socialist revolutionaries we have to properly navigate this storm if we are to enjoy what little peace we've been able to establish so far."
 southern_republic_event.3.o1: "これら下層民は脅威ではない"
 southern_republic_event.3.o2: "誰が選出されるかについて、\nもっと慎重になるべきだ"
 southern_republic_event.4.t: "安定政党"
 southern_republic_event.4.d: "我々の政治的復活の機運の中、我々をより安定した国家に適切に導くことができるのは誰かを見なければならない。オルタナ右翼やオルタナ左翼からの嘲笑が彼らをそうレッテル付けする傾向があるこれらの「穏健派」は、これらがより慎重な政党であることを示している。変化を求めているが、マラソンのような方法ではなく、むしろ快適な散歩や軽いジョギングのペースで、もし我々が彼らが他のより反抗的なタイプの政党に対する支持を固めるのを助けるつもりなら、これらの政党が誰であるかを理解しなければならない。"
 southern_republic_event.4.o1: "慎重な人々がいて神に感謝"
 southern_republic_event.5.t: "南部保守党"
 southern_republic_event.5.d: "The SCP is a fairly moderate party in the grand scheme of the \"Stable\", group of parties. Being generally a center-right party it tends to be more of a reminder of the old democratic and republican parties and their moderate wings. Being more for gradual change rather than large swift changes, this party ensures that if change is needed it's tackled in a more thought out manner rather than the fanfare mentality that can arise in more sensitive topics. In terms of social policies it ensures that change is always happening but we must embrace it at a comfortable pace to keep the national cohesion. Economically they are for deregulation, but not opposed to more commonsense based regulations to curb exploitative means."
 southern_republic_event.5.o1: "SCPは平和をもたらす"
 southern_republic_event.5.o2: "ウィッグ党が勝利するだろう"
 southern_republic_event.5.o3: "PDPが勝利するだろう"
 southern_republic_event.6.t: "ディキシーのウィッグ党"
 southern_republic_event.6.d: " The WPD is a more classical liberal party which aims to use the old school of liberal doctrine to secure a stable and progressing government to ensure the freedom and equality for all. Seeking more of equal opportunity availability the WPD is socially more fluid towards changes but does not see the need to enforce governmental sanctions unless the issue at hand is not truly handled at the state and or local levels first. Economically they believe in regulations overall with a focus in anti-monopoly or more generally anti-competitive practices regulation. But aside from this sort of \"fair game\" strategy in regulations the WPD prefer a more hands-off approach if and when possible."
 southern_republic_event.6.o1: "常識的な規制は理にかなっている"
 southern_republic_event.6.o2: "真の競争は真の機会だ"
 southern_republic_event.6.o3: "経済的アマルガムは反南部的だ"
 southern_republic_event.7.t: "進歩民主党"
 southern_republic_event.7.d: "The PDP is a more traditional democratic-socialist party like its European counterparts, the party looks to use the powers of democracy to ensure the fair treatment of the workers of the nation and wishes to usher in a soft socialism. This means socially speaking the party is more liberal with only holding traditional values on what the voting majority believe is worth keeping traditional. Economically they are soft Socialists, looking to use the power of regulations to keep the workers fed and cared for they are not entirely pro-nationalization however if the private sector acts too unruly it is not out of the question as a stand in to help the exploited masses."
 southern_republic_event.7.o1: "SCPは南部の安定を保証する"
 southern_republic_event.7.o2: "ウィッグ党は南部スタイルを着るだろう"
 southern_republic_event.7.o3: "PDPは南部社会主義を創造するだろう"
 southern_republic_event.8.t: "ディキシー連邦化党"
 southern_republic_event.8.d: "The FDP is essentially the compromising party. Looking to find a happy middle ground of the federal unitarian type government of the union and the more heavily minarchist confederate government, the FDP wishes to marry the two into an earnest and father like figure of a structure to keep peace as well as order to the nation at large. Being both socially and economically off hand its only plans are to direct central funding and services to the poorest of regions to ensure the very bottomline of the nation is not so far down from the rest. Many lambast this as pseudo-socialism, but the FDP fires back at them wondering how much do these supposed \"honorable members of state\" really care about its constituents or do they care more about their friends and paycheck."
 southern_republic_event.8.o1: "連邦という言葉は中傷ではなく、\n現実だ"
 southern_republic_event.8.o2: "勝利のSIPは南部の勝利だ"
 southern_republic_event.8.o3: "SLPはディキシーを解放するだろう"
 southern_republic_event.9.t: "南部アイデンティティ党"
 southern_republic_event.9.d: "The SIP is a niche kind of single issue party. They are more socially indifferent, leading to any and all major social issues to be handled locally rather than nationally. In terms of economics they are a sort of, \"if it isn't broke don't fix it\", kind of mentality. Meaning they'll do regulations or deregulations, but only if it's perceived as a genuine issue to the economic stability of the nation. As for the supposed single issue, the SIP has most of its focus on cultivating and ensuring a real and concrete plan to create a Southern identity. Using things like the more minarchist views of the old confederacy mixed in with some stylistic inspirations from them as well as promoting local food and music culture as Southern culture. The party wishes to move away from the past and make a future that is earnestly and equally Southern for all."
 southern_republic_event.9.o1: "ディキシーを解放し、養え"
 southern_republic_event.9.o2: "南部の人々のための南部スタイル"
 southern_republic_event.9.o3: "ディキシーの価値観のための\nディキシーの自由"
 southern_republic_event.10.t: "南部自由党"
 southern_republic_event.10.d: "The SLP is an interesting makeup of a party. Being more or less the remnants of the old Libertarian Party, the SLP has decided to embrace a compromise of Southern cultural and governmental values with a Libertarian spin to help with the complete decentralization. Many in the SLP see a full return to either pro-Libertarianism and or pro-Confederation of government as a sure way to recreating the failure that was the Articles of Confederation. Regardless the party is anti-government intervention in the economy and socially it is very hands off, leaving such things to the state governments means that locals handle local issues. Though the SLP is not afraid of things like welfare and healthcare programs to ensure the bottomline of the nation are able to have some kind of footing to kick in the door of opportunity."
 southern_republic_event.10.o1: "FDPは統治を理解している"
 southern_republic_event.10.o2: "SIP、真の南部政府を樹立"
 southern_republic_event.10.o3: "南部の自由は南部の統治だ"
 southern_republic_event.11.t: "異端政党"
 southern_republic_event.11.d: "Within the general Overton window of the southern republic, we have two distinctive parties which some honestly debate if they are even real political parties to begin with. Regardless first off we have the DDP or Dixie & Delta Party. Founded by a former railroad enthusiast turned novice political leader, this party seems to be more of a single-issue party in relation to public transportation. However they have alluded to the fact that said investments in PT as they call it for short, would indeed have knock on economic effects when it comes to urbanization as well as connectivity within the nation itself. On the Other hand we have the Party for Economic Prosperity or PEP for short. This party styles itself as a party focused on economic development and ensuring the standards of the nation are brought up through real economic investments. What they don't tell you is that said party is also full of big agricultural money as well as a soft plantation class of supporters. Regardless both the PEP and DDP are seen as interesting forces on their own right but nothing too far to shake the foundations."
 southern_republic_event.11.o1: "ディキシーの開発者"
 southern_republic_event.11.o2: "ディキシーの経済学者"
 southern_republic_event.100.t: "変革の風"
 southern_republic_event.100.d: "In the lead up to the first elections, the state of the nation has been too much to bear for many. As a result rising radicalism has been seen on both sides of the political scene. With neo-confederates, fascist and much more on the right. The union of revolution and southern communist association leading the charge on the left. Many wonder just who will take the wind out of the sails of the other sides. For now continued rise in factionalism has resulted in..."
 southern_republic_event.100.o1: "社会主義扇動家が労働力を結集"
 southern_republic_event.100.o2: "頑固な歴史的誇りが大衆を掴む"
 southern_republic_event.101.t: "南部連合アイデンティタリアン"
 southern_republic_event.101.d: "The Confederate Workers Party desperate to keep ahead in the polls has recently sought out the help of the Southern Tradition Party. These two while fairly opposite of one another have united on the principle of \"The Confederate Dream\". Hoping to establish the rightful south and restore the lands of old, these two opposites have seemingly attracted one another in a gamble for the first election victory of the new nation. For the first steps are the most important in the road to recovery and stability."
 southern_republic_event.101.o1: "統一戦線が形成される"
 southern_republic_event.101.o2: "農民社会が形成される"
 southern_republic_event.102.t: "農業社会"
 southern_republic_event.102.d: "The main counter push and equally as desperate Union of Revolution Party has seen fit to align itself with the Agrarian Union Party. These two working together create the perfect oxymoron as one is clearly an oligarchic big agriculture party and the other is the closest thing to anarcho-communism that you'll see. But desperate times call for desperate measures. Both parties believe that the true pillar to a stable and complacent society is that of the agrarian society. Simple organization and most production efforts and organized labor goes towards making food, what better way to mold the society than by giving it a basic fundamental of living itself. Regardless they'll have to push hard as things are heating up as the elections come ever closer."
 southern_republic_event.102.o1: "南部連合戦線が世論調査をリード"
 southern_republic_event.102.o2: "満腹の腹の約束は有望な結果を示す"
 southern_republic_event.200.t: "右派の統合"
 southern_republic_event.200.d: "国家精神の最近の変化により、多くの人々はより右翼的な政党に近づいている。これは、国家の歴史を考えると、穏健派と左翼を大いに懸念させている。いずれにせよ、ディキシー第一党と南部同盟がディキシー純粋同盟の下で団結したとき、恐怖は頂点に達した。多くの地元住民は、同盟が生み出すかもしれない後退的な社会改革のほぼ転落を恐れており、それはすでに国家からの着実な移住をもたらしている。新南部連合とファシストが団結することへの恐怖と共に、多くの人々はそのような勢力が選挙に勝つのを止めるかもしれない真の代替案を探している。"
 southern_republic_event.200.o1: "国家は純粋さを渇望している"
 southern_republic_event.200.o2: "潜在的移住者が募兵に殺到"
 southern_republic_event.201.t: "募兵増加が対抗民族主義を生む"
 southern_republic_event.201.d: "With the consolidation of the \"Fringe Right\", as opposition nationalist proclaim and sneer at them, many would be targets of such policies have begun to enlist and as a result the political clout of the military has become more and more swaying in its influence. With this the Modern Monarchist Movement known as the House Of Meridian has joined forces with the armed forces to consolidate a counter nationalist movement. Many are hopeful that if we must go down such a path that at least duty to country is better than anything a fascist or ultra-nationalist leadership would have."
 southern_republic_event.201.o1: "フリンジは戦い続ける"
 southern_republic_event.201.o2: "「王室」軍、面白そうだ"
 southern_republic_event.12.t: "南部の要求"
 southern_republic_event.12.d: "西の隣国は我々の服従を要求してきた。南部国家の連合国家として、テキサスを事実上の独立国とするという約束付きでだ。彼らの最終的な狙いは不明だが、こうした要求を断固として拒絶できるかどうかは、我々の軍事力への信念にかかっている。"
 southern_republic_event.12.o1: "我々は唯一無二のテキサス人だ！"
 southern_republic_event.12.o2: "同意しよう...もっと時間があれば..."
 southern_republic_event.13.t: "テキサスが拒否"
 southern_republic_event.13.d: "テキサス国は我々の寛大な提案を拒否した。これで主導権は我々にある。全面衝突のリスクを冒し、それが拡大する可能性を覚悟するか、それとも手を引くか。どちらの選択肢も現実的だが、明らかに一方は他方よりリスクが大きい。"
 southern_republic_event.13.o1: "南部人は戦いから逃げたりしない"
 southern_republic_event.13.o2: "もしかしたら少し急ぎすぎたかもしれない"
 southern_republic_event.14.t: "テキサスが申し出を受諾"
 southern_republic_event.14.d: "彼らの承諾を得たことで、我々は今や結束した陣営として前進し、地域統合という真の目標を達成できる。もちろん、この新たな連合形態には多少の不安を抱く者もいるだろうが、少なくとも一歩前進である。"
 southern_republic_event.14.o1: "よし！マジでうまくいった！"
 southern_republic_event.15.t: "南部の提案"
 southern_republic_event.15.d: "南部国家が、彼らとの連合国家を結成する提案を持ちかけてきた。公正な自治を約束しているが、主目的は新たな地域連合において外交政策を統一することにある。これは我々の状況にとって非常に有利となり得る。なぜなら「存在しない」という名目で国際制裁を無効化できるからだ。しかしこれは単に我々を利用するための策略かもしれない。いずれにせよ、我々は対応を迫られている。"
 southern_republic_event.15.o1: "我々は誰にでも服従しない"
 southern_republic_event.15.o2: "制裁がなくなるのは好きだ、もちろん同意する"
 southern_republic_event.16.t: "キューバが我々を拒否"
 southern_republic_event.16.d: "The Cubans have refused our demands, now the question is do we want to risk prolonged war through naval warfare and making an invasion force. We do what we can, but it may turn out more costly than what it was worth."
 southern_republic_event.16.o1: "我々は戦争に行く！"
 southern_republic_event.16.o2: "今はこれを余裕がない"
 southern_republic_event.17.t: "キューバが取引を受諾"
 southern_republic_event.17.d: "キューバの代表者は我々の取引を受け入れ、我々は予見可能な将来のために公正で安定した連合を創造するための統一法と指標の作成を開始するだろう。"
 southern_republic_event.17.o1: "飲み物はおごりだ！"
 southern_republic_event.18.t: "南部の要求"
 southern_republic_event.18.d: "南部国家は我々に、大カリブ連合国家への服従を要求している。我々は国土の規模が広く、かつ侵攻軍に備えるための距離的余裕がある点で特異な立場にある。しかし、果たしてそのような紛争のリスクを本当に冒すべきかは、まだ不透明である。"
 southern_republic_event.18.o1: "我々は屈服しない！"
 southern_republic_event.18.o2: "市民の命を無駄にできない"
 southern_republic_event.19.t: "ハイチが拒否"
 southern_republic_event.19.d: "汚れた国家が我々の要求を拒んだ。今こそ行動せよ、さもなければ沈黙を守れ。外交情勢はやや緊迫している。さて、理性が勝つか、それとも武力が勝つか。"
 southern_republic_event.19.o1: "意志の力が勝つ"
 southern_republic_event.19.o2: "これをリスクすることはできない"
 southern_republic_event.20.t: "ハイチが受諾"
 southern_republic_event.20.d: "彼らは我々の要求を受け入れた。準備を開始する。今日は我が国にとって良い日だ。"
 southern_republic_event.20.o1: "さらに一歩前進"
 southern_republic_event.21.t: "南部の要求"
 southern_republic_event.21.d: "南部国家は我々に、大カリブ連合国家への服従を要求している。我々は国土の規模が広く、かつ侵攻軍に備えるための距離的余裕がある点で特異な立場にある。しかし、果たしてそのような紛争のリスクを本当に冒すべきかは、まだ不透明である。"
 southern_republic_event.21.o1: "我々は屈服しない！"
 southern_republic_event.21.o2: "市民の命を無駄にできない"
 southern_republic_event.22.t: "ドミニカ共和国が拒否"
 southern_republic_event.22.d: "汚れた国家が我々の要求を拒んだ。今こそ行動せよ、さもなければ沈黙を守れ。外交情勢はやや緊迫している。さて、理性が勝つか、それとも武力が勝つか。"
 southern_republic_event.22.o1: "意志の力が勝つ"
 southern_republic_event.22.o2: "これをリスクすることはできない"
 southern_republic_event.23.t: "ドミニカ共和国が受諾"
 southern_republic_event.23.d: "彼らは我々の要求を受け入れた。準備を開始する。今日は我が国にとって良い日だ。"
 southern_republic_event.23.o1: "さらに一歩前進"
 southern_republic_event.24.t: "南部の取引"
 southern_republic_event.24.d: "南部国家が協定を結ぶよう要請してきた。連合国家を結成する見返りとして、我々の島々が異常気象で被害を受けた際には、あらゆる物資及び金銭的支援の両方またはいずれか一方が提供されるという。これは確かに財政的圧迫を和らげる助けとなるが、罠かもしれない。しかし拒否すれば我々はどうなるのか...どうすればいい、どうすればいいのか..."
 southern_republic_event.24.o1: "現時点では受け入れられない"
 southern_republic_event.24.o2: "そのような取引を見逃すわけにはいかない"
 southern_republic_event.25.t: "The Bahamians Refuse"
 southern_republic_event.25.d: "バハマの政府代表者は、我々の非常に寛大な取引を拒否した。我々はこれを正当化として使用することも、他の方法を見つけることもできる。いずれにせよ、もし我々が外交政策目標を追跡し続けるつもりなら、すぐに決定を下す必要があるだろう。"
 southern_republic_event.25.o1: "くそっ、宣戦布告だ"
 southern_republic_event.25.o2: "これに再アプローチする必要がある"
 southern_republic_event.26.t: "The Bahamians Accept"
 southern_republic_event.26.d: "彼らは我々の要求を受け入れ、我々は物事を設定し始めるだろう。今日は我々の地域連合へのさらに一歩である。"
 southern_republic_event.26.o1: "非常に多くの島々"
 southern_republic_event.27.t: "南部の譲歩"
 southern_republic_event.27.d: "The Southern nation has reached out to us with an offer. They will give us a 100 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.27.o1: "お金は使える"
 southern_republic_event.27.o2: "その島々はイギリス領だ！"
 southern_republic_event.28.t: "イギリスが受諾"
 southern_republic_event.28.d: "The United Kingdom has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.28.o1: "完全に価値があった"
 southern_republic_event.29.t: "The British Refuse"
 southern_republic_event.29.d: "忌々しいアングロどもが我々の非常に寛大な申し出を拒否した。問題は、現時点では外交事件を起こす余裕がないため、将来の参考のためにこれに再アプローチする必要があるということである。"
 southern_republic_event.29.o1: "くそったれ"
 southern_republic_event.30.t: "南部の譲歩"
 southern_republic_event.30.d: "The Southern nation has reached out to us with an offer. They will give us a 50 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.30.o1: "お金は使える"
 southern_republic_event.30.o2: "その島々はフランス領であり続ける！"
 southern_republic_event.31.t: "フランスが受諾"
 southern_republic_event.31.d: "France has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.31.o1: "完全に価値があった"
 southern_republic_event.32.t: "The French Refuse"
 southern_republic_event.32.d: "忌々しいフランコフォンどもが我々の非常に寛大な申し出を拒否した。問題は、現時点では外交事件を起こす余裕がないため、将来の参考のためにこれに再アプローチする必要があるということである。"
 southern_republic_event.32.o1: "カエル野郎どもめ！"
 southern_republic_event.33.t: "南部の取引"
 southern_republic_event.33.d: "The Southern nation has reached out to us with an offer. They will give us a 25 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.33.o1: "お金は使える"
 southern_republic_event.33.o2: "オランダ領の島々はオランダ国民のものだ！"
 southern_republic_event.34.t: "オランダが受諾"
 southern_republic_event.34.d: "The Dutch have accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.34.o1: "完全に価値があった"
 southern_republic_event.35.t: "The Dutch Refuse"
 southern_republic_event.35.d: "忌々しい木靴どもが我々のかなり寛大な申し出を拒否した。問題は、現時点では外交事件を起こす余裕がないため、将来の参考のためにこれにアプローチする必要があるということである。"
 southern_republic_event.35.o1: "畜生！"
 southern_republic_event.36.t: "首都論争"
 southern_republic_event.36.d: "One of the problems with the old republic was the old capital of D.C. was seen as too far away for a vast majority of the nation. However, its symbolism cannot be discounted as well. We must therefore figure out just where our new capital should be."
 southern_republic_event.36.o1: "D.C.で十分だった"
 southern_republic_event.36.o2: "新アーリントン計画は良い"
 southern_republic_event.36.o3: "コロンビア山は十分に中央にある"
 southern_republic_event.36.o4: "ユリシーズで大丈夫だろう"
 southern_republic_event.37.t: "新たな進むべき道"
 southern_republic_event.37.d: "With our policies set in stone and our influences assured we now have the great honor of choosing a new look for our nation. Of course the consensus is to rename the nation to the Confederate States of America as it is only right that we pay tribute to our past and origins. But the question now is the flag. Members of the Dixie First Party want to do the Virginia Battle Flag and update the color scheme so it's not just the Virginia Battle Flag as our great Confederacy is not just the tight asses of Virginian aristocracy. However members of the League of the South wish to take it a step further and use a flag their members have been using a while now which is a plain Virginia Battle Flag with no stars on it but instead a white circle in the center with one large lightning bolt in the center. Some wonder if the latter would be a bit on the nose in terms of political appeal. However more still wonder if its not going far enough, after all this land is truly our land."
 southern_republic_event.37.o1: "配色変更は成功"
 southern_republic_event.37.o2: "Lightning Shall Strike Fear Into Our Enemies"
 southern_republic_event.38.t: "新たな国家標準"
 southern_republic_event.38.d: "国民の大部分が我々のやり方に賛同しているため、我が国が本当に自らを代表しているかどうかについての一般的な議論がある。左翼の多くは、国家の労働者との連帯の前例を設定するために、社会主義的象徴主義で旗をリブランドしたいと考えている。一方、右翼にいる人々は、南部連合が自らを代表した最後の旗の一つを再導入することによって、我が国の起源により象徴的なものに少し戻したいと考えている。この旗は、右側に堅実な赤いバーがあり、左上隅にバージニア戦闘旗がある白いベースの旗である、古い血染めの旗であろう。結果として、彼らは国名を単にディキシー共和国に変更すべきであると信じている。しかし、これについて決定するのは国民次第である。"
 southern_republic_event.38.o1: "社会主義共和国だ"
 southern_republic_event.38.o2: "我々はディキシー共和国だ"
 southern_republic_event.39.t: "前進"
 southern_republic_event.39.d: "我々の機知が働き、国民が新たに発見された国民的誇りを楽しんでいるため、彼らは団結を示し、同時にそれが良いか悪いかに関わらず我々の歴史に敬意を払う改革を求めている。したがって、今後、我々は南部連合として知られ、誇らしげにボニーブルーフラッグを掲げるだろう。"
 southern_republic_event.39.o1: "確かに南部の家族だ"
 southern_republic_event.40.t: "古い習慣、ねえ"
 southern_republic_event.40.d: "我々のやり方が確立され、国民がこの新たに発見された目的に満足しているため、新しい旗と名前を設定するのに適切な時期だと考える。いつか我々はマントを取り戻すことができるかもしれない。しかし、彼らが言うように、古い習慣はなかなか死なない。"
 southern_republic_event.40.o1: "もしかしたらいつか"
 southern_republic_event.41.t: "アルカディアの夢"
 southern_republic_event.41.d: "今日、新たな時代が始まる。それは我々に新たなアイデンティティ、新たな統一の道、そして新たな繁栄の時代をもたらす。今日、我々はアルカディアの民となる。"
 southern_republic_event.41.o1: "アルカディアのために！！！"
 southern_republic_event.42.t: "アルカディア首都論争"
 southern_republic_event.42.d: "新しい国家が興り、それと共に新しい章が始まる。我々の首都はどこにあるべきか。"
 southern_republic_event.42.o1: "古き良き信頼できる場所だ"
 southern_republic_event.42.o2: "素敵な中央首都が最適だ"
 southern_republic_event.43.t: "民族主義者の抵抗"
 southern_republic_event.43.d: "我が国の最初の選挙での公正な勝利に続く数日間、フロリダの荒野のヒルビリーや酔っぱらいたちは、口から吐瀉物以上のものを投げ出すことを決めたようだ。これから真剣に何かが起こるとは期待していないが、多くの人々は「フロリダマン」が本当にどれほど馬鹿なのか疑問に思っている。"
 southern_republic_event.43.o1: "ジーザス、またこのくだらないことか"
 southern_republic_event.44.t: "増大する不安"
 southern_republic_event.44.d: "In the aftermath of the supposed \"proclamation\" of statehood, the agitation in the state of Florida has steadily risen over the past few more days. This escalation brings fears that our young nation will soon enough be embroiled in war, not with the federals, great lakers or even the Texans but with our own people... This sad realization has resulted in a pre-emptive expansion in armaments production as a way to get ahead of potentially any trouble that may arise in the coming days."
 southern_republic_event.44.o1: "神よ、我々全てを助けたまえ……"
 southern_republic_event.45.t: "家族間の確執"
 southern_republic_event.45.d: "They finally did it, the damn Floridians decided that apparently it was just too god damn much to try and work things out. Well by god we'll settle this here and now and make Florida, Southern again. We need to mobilize and set forth what troops we do have to the border."
 southern_republic_event.45.o1: "メルティングポット、\nむしろ溶けた脳みそだ"
 southern_republic_event.46.t: "戦争"
 southern_republic_event.46.d: "時が来た。そして我々は正当に我々のものであるものを取り戻すだろう。"
 southern_republic_event.46.o1: "部隊を投入せよ！"
 southern_republic_event.1000.t: "我々の自由を守れ"
 southern_republic_event.1000.d: "社会主義者のくずどもは我々をマルクス主義と貧困の生活に従属させたいと願っている。さて、もうたくさんだ。鎖を断ち切り、自由のために戦え！！！"
 southern_republic_event.1000.o1: "我々の太陽は全ての上に\n最も明るく輝くだろう！"
 CSA_event_native_exodus.1.t: "オクラホマの噂"
 CSA_event_native_exodus.1.d: "As we attempt something to organize our nation, rumors are coming out of the far lands of Oklahoma that the native population is looking to leave when and where possible. The threat and stigma of a \"Southern\" nation is still pretty strongly resonating, though who could be surprised considering most natives were relegated to specific chunks of land. We can't do much but hope it doesn't cause trouble for us in the future."
 CSA_event_native_exodus.1.o1: "待て、もし彼らが去ったら、\n我々はそれを無料で手に入れるのか？"
 CSA_event_native_exodus.2.t: "増大する移住"
 CSA_event_native_exodus.2.d: "我々が国家支配を固め続ける中、単に「インディアン準州」として知られるオクラホマの巨大保留地からのますます多くの先住民が、カンザスに向けて北への移住運動を組織し続けている。非常に多くの人々を失うのは悲しい日であるが、これは代理的に、再統合努力と州内の経済を再び軌道に乗せることが全体的にはるかに容易になる可能性が高いことを意味する。"
 CSA_event_native_exodus.2.o1: "どれだけの人が去るかについて\n心配すべきではないか？"
 CSA_event_native_exodus.3.t: "移住か脱出か？"
 CSA_event_native_exodus.3.d: "More news out of Oklahoma as news of an organization called the Reclamation Front has been the responsible party for organizing these migration patterns from Oklahoma to Kansas. Reports from the region say that Kansas while under a new governmental entity called the Republic of Lakota is technically under their control, most real efforts have been spent on the northern four states as the debate over a new national capital and rebuilding has been a priority. The RF claims that Kansas is a fine new home away from the other \"colonial ran nations\" and that the Council of Six, a reference to the organization's leadership as well as the six tribes which comprised the mega reservation. The Council has determined Kansas to be a better suited more stable home for which we can claim if need be. We're trying to get more info but it looks like rather than fight us, this supposed Reclamation Front believes the Republic of Lakota would be easier to fight and use Kansas as their one true home."
 CSA_event_native_exodus.3.o1: "彼らに言うべきだと思うか？いやいや"
 CSA_event_native_exodus.4.t: "いったい何人いたんだ？？？"
 CSA_event_native_exodus.4.d: "オクラホマ州からさらに新たなニュースが入ってきた。同州からの移民数が過去最高を記録したのだ。大規模な移住により人口が約7％減少したと推定される中、州民のうち実際に何人が地元出身者だったのか疑問に思う者も多い。カンザス州の彼らに神のご加護があらんことを、現地の人々がどんな厄介なことをしているか誰にもわからないのだから。"
 CSA_event_native_exodus.4.o1: "Thank God It's No Longer Our Problem"
 CSA_event_native_exodus.5.t: "新たな繁栄"
 CSA_event_native_exodus.5.d: "With migration numbers nearing a stoppage of sorts we have a lot of vacated land, businesses and whatnot. As such these lands and so on can be refurbished and used to create a new prosperity which the state has yet to see. Let's just hope we can keep it that way considering what's led to this somehow fortunate turn of events."
 CSA_event_native_exodus.5.o1: "さて、今度は何だ？"
 CSA_event_native_exodus.1001.t: "今、どうする？"
 CSA_event_native_exodus.1001.d: "As the debates go on about the new capital, some rumors from the south have begun to reach us. Supposedly an ever-growing influx of native americans have been fleeing Oklahoma and settling into Kansas. While we don't know what the reasonings or if there is an issue to be had at hand here, we do know that right now it is not a problem."
 CSA_event_native_exodus.1001.o1: "問題になったら戻ってきてください"
 CSA_event_native_exodus.1002.t: "またか、真面目に"
 CSA_event_native_exodus.1002.d: "カンザスからのさらなるニュース、明らかに、より多くの先住民がカンザスに逃げ込み、その結果、開発の可能性が代理的に増加した。私には悪いことには聞こえない正直なところ。"
 CSA_event_native_exodus.1002.o1: "戻ってきた理由はあるのか？"
 CSA_event_native_exodus.1003.t: "神よ、今度は何だ？"
 CSA_event_native_exodus.1003.d: "カンザスからのさらなるニュースとして、奪還戦線と呼ばれるグループが、カンザス州の再建と成長を助ける意向を発表した。これは我々の権威に対する穏やかな挑戦のように見えるが、そのような貧弱な州と、国家の大部分に対する我々の固まる支配力をもって、我々はこれらの騒ぎ立てる者たちに対して真の懸念を持っていない。"
 CSA_event_native_exodus.1003.o1: "そろそろ仕事に集中させてくれ"
 CSA_event_native_exodus.1004.t: "はい？"
 CSA_event_native_exodus.1004.d: "Kansas leadership has expressed their gratefulness in allowing the RF to help rebuild the state, over all things have been pretty peaceful and are looking to be for a while. But many up north are wary as such random kindness does not just happen for the sake of \"good will\". We'll be sending representatives to figure just what we're dealing with soon enough."
 CSA_event_native_exodus.1004.o1: "監査人を送り込め"
 CSA_focus_havana_help: "ハバナの助け"
 CSA_focus_havana_help_desc: "最大のカリブ海のプレーヤーはキューバである。我々はこの「大物」を確保しなければ、他の国々とどこにも到達できないだろう。もし必要なら、我々は戦争に行くだろうが、しかし、もし戦争が避けられるなら、我々は地図上の他のより小さな点々との戦争を単に保存することができる。"
 CSA_focus_bahaman_bargain: "バハマとの取引"
 CSA_focus_bahaman_bargain_desc: "バハマを構成する散在する島々は、毎年のハリケーンによって常に破壊の危機にさらされている。我々の最大の切り札は、もし我々が連邦連合で団結するならば、これらの島々とその人々に金銭的および物質的援助を提供できることである。もちろん、それは彼ら次第だが、我々はいずれにせよ方法を見つけるだろう。"
 CSA_focus_bahama_blast: "バハマ強襲"
 CSA_focus_bahama_blast_desc: "These scattered islands would make perfect training grounds for future war plans along the gulf. So let's gain some experience then, besides they can't be in any meaningful position for striking deals with."
 CSA_focus_gran_colombian_sub_regionalism: "大コロンビア準地域主義"
 CSA_focus_gran_colombian_sub_regionalism_desc: "Creating a sort of sub-region within our confederal union will allow for more local cohesions which feed back into our new regional power. Overall we look to set the stage for unity through identity, these nations and sub-regions were proud and good nation-states at one point or another and it's our job to recognize and embrace it in order to properly move forward together as one."
 CSA_arcadia_path_desc: "[CSA.GetFlag]§Yアメリカ南部共和国§!の国名を§Yアルカディア§!に変更する"
 CSA_rallying_dixies_defenders: "ディキシー防衛者の結集"
 CSA_rallying_dixies_defenders_desc: "若者よ、結集せよ！敵がどこから攻撃してこようとも、我々は断固として立ち向かわねばならない。"
 CSA_creating_infantry_reserves: "予備役部隊の編成"
 CSA_creating_infantry_reserves_desc: "即応予備役部隊を創設することは、我々が敵のいかなる侵攻や、将来計画するかもしれないあらゆる事態に予防的に備えることを可能にするだろう。"
 CSA_mobilizing_the_reserves: "予備役の結集"
 CSA_mobilizing_the_reserves_desc: "若者よ、故郷がお前たちを必要としているぞ、結集せよ。今日という日を掴み、北部の奴らや西部の奴らが我々に投げつけてくるどんなものにも備えよう！"
 CSA_focus_soldiers_of_nature: "自然の兵士たち"
 CSA_focus_soldiers_of_nature_desc: "我々が保持する土地は多様で、しかも豊富である。あまりにも豊富なため、外国勢力が我々の土地を我が物にしようと躍起になるのは容易に想像できる。だからこそ、我々は軍隊を訓練し、洗練させ、鍛え上げ、これらの多様な土地を理解しなければならない。そうすることで、我々は自らの故郷を守るだけでなく、自らの国を守ることができるのだ。しかし、もしその時が来たら、戦いは我々の土地から引き離し、彼らの土地と彼らの血に委ねることができるのだ。"