 karabakh.1.t: "[ARM.GetNameWithFlag] Atacou Nossas Posições!"
 karabakh.1.d: "The Nagorno-Karabakh and Armenian troops began shelling our positions opposite the border with the unrecognized Nagorno-Karabakh Republic. Our troops are trying to repel the enemy's attack."
 karabakh.1.a: "Damn it!"
 karabakh.2.t: "[ARM.GetNameWithFlag] Vence o Tiroteio!"
 karabakh.2.d: "In a recent firefight between Armenian and Azerbaijani units, the Armenians emerged victorious, inflicting heavy losses on the Azerbaijani side."
 karabakh.2.a: "The conflict persists"
 karabakh.3.t: "[ARM.GetNameWithFlag] Perde o Tiroteio!"
 karabakh.3.d: "In a recent firefight between Armenian and Azerbaijani units, the Azerbaijanis emerged victorious, inflicting heavy losses on the Armenian side."
 karabakh.3.a: "The conflict persists"
 karabakh.4.t: "Firefight Ends in Stalemate!"
 karabakh.4.d: "Following the recent attack by Armenian forces on Azerbaijani positions, the firefight ended in a draw and there were no changes in positions."
 karabakh.4.a: "The conflict persists"
 karabakh.5.t: "[AZE.GetNameWithFlag] Atacou Nossas Posições!"
 karabakh.5.d: "The Azerbaijani troops began shelling our positions opposite the border with Azerbaijan. Our troops are trying to repel the enemy's attack."
 karabakh.5.a: "Damn it!"
 karabakh.6.t: "[AZE.GetNameWithFlag] Vence o Tiroteio!"
 karabakh.6.d: "In a recent firefight between Armenian and Azerbaijani units, the Azerbaijanis emerged victorious, inflicting heavy losses on the Armenian side."
 karabakh.6.a: "The conflict persists"
 karabakh.7.t: "[AZE.GetNameWithFlag] Perde o Tiroteio!"
 karabakh.7.d: "In a recent firefight between Armenian and Azerbaijani units, the Armenians emerged victorious, inflicting heavy losses on the Azerbaijani side."
 karabakh.7.a: "The conflict persists"
 karabakh.8.t: "Operação de Reconhecimento com Drones Bem-Sucedida!"
 karabakh.8.d: "Recentemente, nossos drones de reconhecimento realizaram uma operação bem-sucedida e reuniram uma quantidade significativa de informações sobre o inimigo."
 karabakh.8.a: "Ótimo!"
 karabakh.9.t: "Drone Abatido"
 karabakh.9.d: "Nossos esforços de reconhecimento aéreo foram notados pelo inimigo; nosso drone foi abatido por um tiro de MANPAD certeiro e um valioso equipamento foi perdido."
 karabakh.9.a: "Malditos!"
 karabakh.101.t: "Drone Inimigo Abatido"
 karabakh.101.d: "Recentemente, um drone de reconhecimento UAV inimigo foi abatido por um tiro de MANPAD certeiro. A missão de reconhecimento de nossos inimigos fracassou e eles perderam um valioso equipamento."
 karabakh.101.a: "Ótimo!"
 karabakh.10.t: "Nossa Posição Final nas Negociações dos Anos 90"
 karabakh.10.d: "Nos anos noventa, o Azerbaijão, reconhecendo nossa vitória, concordou em reconhecer Artsakh se concordássemos em entregar ao Azerbaijão a região de Hadrut em troca do reconhecimento. Ceder terras em troca de reconhecimento pode ser um bom negócio, mas nossas forças internas podem ficar muito insatisfeitas com isso. Esse acordo também pode destruir nossa capacidade de ter algumas ambições políticas..."
 karabakh.10.a: "Devemos concordar. É uma solução mais voltada para o futuro."
 karabakh.10.b: "Não podemos permitir a cessão de territórios."
 karabakh.11.t: "[ARM.GetNameWithFlag] Concorda com Nossas Condições dos Anos 90!"
 karabakh.11.d: "In its recent statement, the Armenian side agreed to our old conditions, under which the Hadrut region is transferred to us in exchange for our recognition of the Nagorno-Karabakh Republic. The conflict will be completely resolved and we will sign a non-aggression pact with Armenia. It is worth considering that at the moment Armenia significantly exceeds us in military power."
 karabakh.11.a: "Wonderful, we agree to these terms!"
 karabakh.11.b: "Também precisamos de um corredor por Meghri..."
 karabakh_news.2.t: "Resolução do Conflito de Nagorno-Karabakh!"
 karabakh_news.2.d: "Após muitos anos de disputa não resolvida, as partes armênia e azerbaijana conseguiram chegar por conta própria a um acordo sobre o conflito de Nagorno-Karabakh e assinar uma resolução correspondente que garante os interesses de ambos os lados. Aonde essa mudança levará o Cáucaso Sul ainda continua sendo um mistério."
 karabakh_news.2.o1: "Paz no Cáucaso?"
 karabakh.12.t: "[ARM.GetNameWithFlag] Exige o Reconhecimento Total de Nagorno-Karabakh!"
 karabakh.12.d: "In its recent statement, the Armenian side denied our old conditions, under which the Hadrut region is transferred to us in exchange for our recognition of the Nagorno-Karabakh Republic. They demand full recognition of Nagorno-Karabakh Republic without territorial changes. It is worth considering that at the moment Armenia significantly exceeds us in military power. For now."
 karabakh.12.a: "We will win in the long term. Raise the stakes during next negotiations."
 karabakh.12.b: "Talvez... aceitar a proposta deles?"
 karabakh.13.t: "[AZE.GetNameWithFlag] Nega Nossa Oferta!"
 karabakh.13.d: "Azerbaijan rejected our negotiation terms and postponed the discussion about new terms to next meeting."
 karabakh.13.a: "Let's prepare then."
 karabakh.14.t: "Our New Stance"
 karabakh.14.d: "After the first round of unsuccessful negotiations, we are finally ready to reconsider our position on the negotiation process. Should we demand passage through Zangezur, or should we surrender our negotiating position?"
 karabakh.14.a: "Present them our new demands."
 karabakh.14.b: "Vamos reconhecer Nagorno-Karabakh."
 karabakh.15.t: "[AZE.GetNameWithFlag] Apresenta Novas Exigências!"
 karabakh.15.d: "Recently, Azerbaijan's government presented us a new set of demands for Artsakh recognition. They still want us to surrender Hadrut, but now they want a corridor through Syunik to connect it to Nakhijevan. Should we agree to these new terms?"
 karabakh.15.a: "These terms are unacceptable!"
 karabakh.15.b: "Parece razoável o bastante."
 karabakh.16.t: "[ARM.GetNameWithFlag] Nega Nossa Oferta!"
 karabakh.16.d: "Armenia rejected our negotiation terms and postponed the discussion about new terms to next meeting."
 karabakh.16.a: "Let's prepare then."
 karabakh.17.t: "New Negotiating Stance"
 karabakh.17.d: "After the previous round of negotiations, which ended unsuccessfully, we should reconsider our demands on Armenia. Considering our strengthening on the world stage, we should also demand the Karvachar region in exchange for recognition of the Nagorno-Karabakh as part of Armenia. This seems to us to be the most advantageous position."
 karabakh.17.a: "Present the new terms to Armenia."
 karabakh.17.b: "Vamos abandonar Karabakh de vez..."
 karabakh.18.t: "Novos Termos de [AZE.GetNameWithFlag]!"
 karabakh.18.d: "Recently, Azerbaijan presented us with new demands for the recognition of Artsakh as our territory. Now, they demand Karvachar and Hadrut in exchange for recognizing Stepanakert as the territory of Armenia. Considering the strengthening of Azerbaijan, this can be a big problem for us."
 karabakh.18.a: "These terms are unacceptable!"
 karabakh.18.b: "Devemos nos render..."
 karabakh.24.t: "[ARM.GetNameWithFlag] Reconheceu e Anexou Nagorno-Karabakh!"
 karabakh.24.d: "A Armênia, em um ato inesperado de agressão, declarou a anexação completa de Nagorno-Karabakh e seu reconhecimento. Encaramos isso como um ato de agressão total e incondicional!"
 karabakh.24.a: "Avante, Ataquem!"
 karabakh_news.3.t: "Segunda Guerra de Nagorno-Karabakh"
 karabakh_news.3.d: "Devido aos eventos recentes, o Azerbaijão lançou uma ofensiva em larga escala no território da não reconhecida República de Nagorno-Karabakh. Apesar da invasão direta do Azerbaijão, o território de Nagorno-Karabakh estava ocupado por forças armênias, o que dá ao Azerbaijão a impressão de que a agressão vem do lado armênio."
 karabakh_news.3.o1: "Estes são tempos sombrios."
 karabakh.25.t: "Oportunidade em Nagorno-Karabakh!"
 karabakh.25.d: "A guerra em Nagorno-Karabakh já dura o suficiente para abalar o equilíbrio de poder na região. Talvez devamos aproveitar isso e introduzir nossas forças de paz em Artsakh, forçando a Armênia a ceder parte do território. Isso aumentará nossa influência sobre a Armênia e o Azerbaijão. Devemos fazer isso?"
 karabakh.25.a: "Claro!"
 karabakh.25.b: "Isso não é da nossa conta."
 karabakh.26.t: "[SOV.GetNameWithFlag] Exige a Resolução de Karabakh!"
 karabakh.26.d: "A Rússia considera que a guerra foi longe demais e que devemos negociar um cessar-fogo entre ambos os lados. Devemos concordar?"
 karabakh.26.a: "Claro..."
 karabakh.26.b: "Não!"
 karabakh.27.t: "[FROM.GetNameWithFlag] Nega a Proposta de Cessar-Fogo!"
 karabakh.27.d: "[FROM.GetNameWithFlag] nega nossa proposta de cessar-fogo. Impusemos sanções a eles, mas nossa influência sobre eles diminuiu."
 karabakh.27.a: "Bastardos!"
 karabakh.28.t: "[SOV.GetNameWithFlag] Exige a Resolução de Karabakh!"
 karabakh.28.d: "A Rússia considera que a guerra foi longe demais e que devemos negociar um cessar-fogo entre ambos os lados. O Azerbaijão já concordou. Devemos concordar?"
 karabakh.28.a: "Claro..."
 karabakh.28.b: "Lutaremos até o fim!"
 karabakh_news.4.t: "Cessar-Fogo em Nagorno-Karabakh!"
 karabakh_news.4.d: "Graças aos esforços diplomáticos da Rússia, o recente conflito em Nagorno-Karabakh foi interrompido pela assinatura de um cessar-fogo pelas partes armênia e azerbaijana. A paz se manterá no Cáucaso Sul ou essas mudanças serão de curta duração?"
 karabakh_news.4.o1: "Paz, enfim."
 karabakh.29.t: "Segunda Ofensiva em Nagorno-Karabakh!"
 karabakh.29.d: "Chegou a hora de atacar Nagorno-Karabakh novamente e tomar tudo o que sobrou."
 karabakh.29.a: "Avante!"
 arm_reaction.1.t: "A Geórgia Anexou a Abecásia"
 arm_reaction.1.d: "O governo georgiano, nos contornando, conseguiu subjugar a Abecásia e anunciar o início da integração em seu Estado. Estamos extremamente indignados por termos sido simplesmente ignorados e colocados diante do fato consumado. É hora de decidir como responderemos a esse ato de violação de nossos interesses geopolíticos."
 arm_reaction.1.a: "Criaremos um diversionismo."
 arm_reaction.1.b: "Vamos incitar uma insurreição na Abecásia."
 arm_reaction.1.c: "Vamos expressar nossa indignação."
 arm_reaction.1.f: "Declarar Guerra à Geórgia."
 arm_reaction.2.t: "A Rússia Promoveu uma Sabotagem!"
 arm_reaction.2.d: "Em resposta à anexação da Abecásia ao nosso Estado, a Rússia decidiu realizar uma ação de retaliação, sabotando nossa estrutura política e tentando agitar o público com diversos temas dolorosos."
 arm_reaction.2.a: "Que patético"
 arm_reaction.3.t: "O Motim na Abecásia"
 arm_reaction.3.d: "A Rússia não aceitou nossa reunificação com a Abecásia e conseguiu reunir forças leais aos seus militares para executar um golpe. Entre outras coisas, a Rússia anuncia o início de uma guerra contra nós; parece que pretendem nos destruir por nosso desejo de ver a Geórgia unida."
 arm_reaction.3.a: "Maníacos!"
 arm_reaction.4.t: "O Golpe Pró-Rússia"
 arm_reaction.4.d: "Os serviços especiais russos conseguiram executar um golpe em nossa república e tomaram o poder. Agora não estamos apenas sob controle russo, mas também envolvidos numa guerra com a Geórgia, contra a qual a Rússia declarou guerra."
 arm_reaction.4.a: "Entre Dois Fogos"
 arm_reaction.5.t: "A Rússia Expressa Insatisfação"
 arm_reaction.5.d: "A Rússia expressa forte insatisfação pelo fato de a questão abecásia ter sido resolvida sem sua participação. Nossas relações com a Rússia podem ter sido arruinadas para sempre, mas agora temos a Abecásia, e isso é muito mais importante para nós."
 arm_reaction.5.a: "Que chorem"
 arm_reaction.7.t: "A Rússia Promoveu uma Sabotagem!"
 arm_reaction.7.d: "A Rússia não consegue aceitar que deixamos de ser um fantoche e organizou uma sabotagem política por meio das forças do FSB, tentando agitar a situação, mas resistiremos de qualquer forma!"
 arm_reaction.7.a: "Que patético"
 arm_reaction.8.t: "Motim Pró-Rússia"
 arm_reaction.8.d: "Nossa saída da esfera de influência da Rússia ofendeu muito o governo deles, mas subestimamos a extensão de sua influência em nosso país. Eles conseguiram organizar um motim de forças leais a eles, voltado contra nós."
 arm_reaction.8.a: "Que patético"
 arm_reaction.9.t: "A Rússia Expressa Insatisfação"
 arm_reaction.9.d: "A Rússia expressou séria indignação e insatisfação com o fato de termos derrubado seu governo fantoche de forma tão fácil e rápida."
 arm_reaction.9.a: "Que chorem"
 arm_reaction.10.t: "Guerra com a Rússia!"
 arm_reaction.10.d: "Desconfiávamos de que a Rússia não aceitaria perder o controle sobre nós, mas eles estão prontos para promover um banho de sangue só para não nos deixar partir!"
 arm_reaction.10.a: "Maníacos!"
 arm_reaction.11.t: "Enviar a PMC Wagner ao Azerbaijão"
 arm_reaction.11.d: "A supressão da Armênia continua e estamos prontos para expandir a zona de combate. A PMC Wagner está pronta para ir ao Azerbaijão e iniciar uma rebelião contra o governo armênio lá"
 arm_reaction.11.a: "Estamos indo"
 arm_reaction.11.b: "Não"
 arm_reaction.12.t: "Motim da PMC Wagner no Azerbaijão"
 arm_reaction.12.d: "A Rússia continua a minar a unidade de nosso Estado. As PMCs Wagner foram enviadas ao Azerbaijão para iniciar uma insurreição contra nós; os rebeldes são poucos, mas os batalhões das PMCs são bastante capazes de nos combater."
 arm_reaction.12.a: "Está Piorando"
 arm_reaction.13.t: "O Azerbaijão Pede Reconhecimento"
 arm_reaction.13.d: "A rebelião no Azerbaijão foi bem-sucedida, mas agora o governo deles pede nosso reconhecimento oficial, bem como o estabelecimento de nosso protetorado. Talvez queiram se proteger de uma possível derrota na guerra com a Armênia, mas então teremos de nos envolver nessa guerra."
 arm_reaction.13.a: "À guerra!"
 arm_reaction.13.b: "Nossa ajuda é suficiente para eles."
 arm_reaction.14.t: "A Armênia Apoia Separatistas no Cáucaso"
 arm_reaction.14.d: "Nossos serviços especiais estabeleceram o fato de que os serviços especiais armênios apoiam grupos separatistas no Cáucaso, apoiando assim plenamente a desestabilização da situação nessa região com a ajuda dos serviços especiais armênios. É hora de responder a eles."
 arm_reaction.14.a: "Criaremos um diversionismo."
 arm_reaction.14.b: "Apoiaremos o separatismo em suas regiões."
 arm_reaction.14.c: "Vamos expressar nossa indignação."
 arm_reaction.14.f: "Declarar Guerra à Armênia."
 arm_reaction.15.t: "A Rússia Promoveu uma Sabotagem!"
 arm_reaction.15.d: "Os serviços especiais russos aparentemente conseguiram estabelecer o fato de nosso envolvimento no apoio aos separatistas no Cáucaso e decidiram responder imediatamente sabotando nosso sistema político."
 arm_reaction.15.a: "Que patético"
 arm_reaction.16.t: "A Rússia Apoia os Separatistas"
 arm_reaction.16.d: "Os serviços especiais russos apoiam ativamente elementos separatistas entre nossos Estados fantoches, enfraquecendo assim nossa influência na região."
 arm_reaction.16.a: "Que patético"
 arm_reaction.17.t: "A Rússia Expressa Insatisfação"
 arm_reaction.17.d: "A Rússia expressa ativa insatisfação com nosso apoio ao separatismo em seu território."
 arm_reaction.17.a: "Que chorem"
 arm_reaction.18.t: "Guerra com a Rússia!"
 arm_reaction.18.d: "A Rússia decidiu responder de forma radical ao nosso apoio aos separatistas em sua região e nos declarou guerra, de forma inesperada."
 arm_reaction.18.a: "Maníacos!"
 ARM_retire_tt: "§WEfeito:§!\n§H[ROOT.GetLeader]§! §Wse aposentará como líder de [ROOT.GetName]§!\n§H[show_ruling_party]§! §Wescolherá um novo líder entre seus quadros.§!"
 ARM_political_assassinations: "Assassinatos Políticos"
 ARM_political_assassinations_desc: "Continuamos a liquidar nossos oponentes, se necessário, para o nosso domínio político."
 ARM_political_assassinations_category: "Assassinatos Políticos"
 ARM_political_assassinations_category_desc: "After the 1999 coup, £ARM_reactionary §YKocharyan§!'s power is in a precarious state. The §YOpposition§! will prepare to overthrow the president several times. It is necessary to clear the political field in order to be sure of the preservation of power. Enemies within the political environment and external opposition must be eradicated."
 ARM_promotion_of_interest_armenia_in_greece: "Promover interesses §Yarmênios§! em §Y[GRE.GetNameWithFlag]§!"
 ARM_chechnya_revoult_sub: "[ARM.GetFlag]Golpe §Ypró-Armênia§! em §Y[CHE.GetNameWithFlag]§!"
 ARM_chechnya_weapons: "Fornecer Armas aos [CHE.GetFlag]§Yrebeldes chechenos§!"
 ARM_economy_shoghakn: "Shoghakn"
 ARM_economy_shoghakn_desc: "A fábrica Shoghakn (antiga fábrica Kristall) é a maior empresa de lapidação de diamantes da Armênia. O primeiro lote de diamantes processados na Armênia foi produzido em março de 1971 na fábrica Kristall Nor Achna. Nos anos seguintes, a Kristall foi renomeada Stankostroitelny e, mais tarde, Shoghakn, em 1992. Pela primeira vez na Armênia, foram lapidados diamantes nos formatos 'Marquise', 'Oval', 'Pera', além de 'Esmeralda', 'Baguete' e diversos triângulos."
 ARM_foreseeing_the_prophecy: "Prevendo a Profecia"
 ARM_foreseeing_the_prophecy_desc: "A lenda sobre as origens do povo armênio diz que os armênios conquistaram seu direito de existir ao enfrentar as tribos semitas do sul sob a união de Hayk, o Progenitor. Os novos tempos carregam o legado do passado nos ombros, e as lendas dizem que a salvação dos armênios, como Hayk, o Progenitor, deve vir no novo milênio."
 arm_expansion.15.t: "A Insurreição na Armênia Ocidental"
 arm_expansion.15.d: "Temos a chance de iniciar uma insurreição armada na Armênia Ocidental, atualmente sob controle turco, mas devemos entender que isso nos envolverá em uma guerra com a Turquia e não haverá volta."
 arm_expansion.15.a: "Liberdade para a Armênia Ocidental!"
 arm_expansion.15.b: "Não correremos riscos"
 arm_expansion.16.t: "A Insurreição na Armênia Ocidental"
 arm_expansion.16.d: "Inesperadamente para nós, na chamada Armênia Ocidental, houve uma insurreição contra o nosso governo! As autoridades armênias declararam diretamente a organização dessa rebelião, e já surgiram informações sobre a presença de seus militantes lado a lado com os rebeldes. Isso é um ultraje!"
 arm_expansion.16.a: "Eles vão pagar por isso."
 arm_expansion.17.t: "A Insurreição na Armênia Ocidental"
 arm_expansion.17.d: "Chegou a hora da última guerra pela libertação das terras ancestrais armênias, agora ou nunca, glória à Armênia!"
 arm_expansion.17.a: "Glória à Armênia!"
 ARM_west_armenia: "República da Armênia Ocidental"
 ARM_socdem_principles_desc: "Devemos aderir a princípios sociais de apoio societal para tornar nossa sociedade mais igualitária."
 ARM_raising_taxes_idea: "Raising Taxes"
 ARM_utilize_military_knowledge: "Usar o Conhecimento Militar"
 ARM_utilize_military_knowledge_desc: "A experiência militar de Serzh Sargsyan deve ser usada em benefício de nossas forças armadas; ele sabe o que fazer."
 ARM_open_borders_with_azerbaijan: "Propor a Abertura das Fronteiras com [AZE.GetNameWithFlag]"
 ARM_open_borders_with_azerbaijan_desc: "Com o conflito de Karabakh resolvido, podemos propor ao Azerbaijão a abertura de nossas fronteiras comuns, normalizando as relações e permitindo o comércio entre nossas nações."
 karabakh.30.t: "[ARM.GetNameWithFlag] Propõe a Abertura das Fronteiras"
 karabakh.30.d: "A Armênia propôs abrir as fronteiras entre nossas duas nações. Com o conflito de Nagorno-Karabakh agora resolvido, eles argumentam que não há mais motivo para manter o bloqueio. A abertura das fronteiras permitiria o comércio e a circulação de pessoas entre nossos países, beneficiando ambas as economias."
 karabakh.30.a: "Aceitar a proposta."
 karabakh.30.b: "Rejeitar a proposta."
 karabakh.31.t: "Resposta de [AZE.GetNameWithFlag]"
 karabakh.31.d: "Azerbaijan has responded to our proposal regarding the opening of borders between our two nations."
 karabakh.31.a: "We see."
 eastern_church_arm_desc: "The Armenian Apostolic Church (AAC) is one of the oldest Christian churches in the world. According to legend, the Armenian Church is called \"Apostolic\", since its founders were the Apostles Thaddeus and Bartholomew, who were the first in Armenia to preach Christianity. Historically, the AAC was formed in 301 by the labors of St. Gregory the Illuminator and the adoption of Christianity by King Trdat III as the state religion."
 ARM_footbal_diplo_desc: "A \"diplomacia do futebol\" nas relações entre a Armênia e a Turquia começou em 6 de setembro de 2008, quando o presidente turco Abdullah Gul chegou a Yerevan a convite do presidente armênio Serzh Sargsyan para assistirem juntos a uma partida de futebol entre as seleções dos dois países nas eliminatórias da Copa do Mundo de 2010. Após a partida, o líder turco convidou seu homólogo armênio a assistir ao jogo de volta na Turquia em 14 de outubro de 2009. Em 10 de outubro de 2009, protocolos bilaterais foram assinados em Zurique com o apoio de políticos de alto escalão e líderes mundiais. E quatro dias depois, em Bursa, os presidentes da Turquia e da Armênia assistiram à partida das seleções nacionais. No entanto, em 22 de abril de 2010, Sargsyan suspendeu por decreto a ratificação dos documentos assinados em Zurique, explicando que a Turquia não estava pronta para continuar o processo iniciado."
 arme.14.b: "We have no interest in this union."
 arme.222.b: "Não temos interesse nesta união."
 ARM_new_unif_proj_desc: "Aproveitando a experiência estrangeira, devemos começar a desenvolver um novo uniforme camuflado para nossas forças armadas."
 ARM_invite_it_corp_shared_desc: "Pretendemos convidar outra grande corporação estrangeira de TI para apoiar o desenvolvimento do nosso setor de TI."
 ARM_annex_states: "Anexar Estados"
 ARM_Kocharyan_Opposition_loc1: "\n§gOPOSIÇÃO SUPRIMIDA§!:\n£western_outlook_campaign_cost_modifier_texticon Apoio Pró-Ocidental Diário: §R-0.01§!\n£nonaligned_outlook_campaign_cost_modifier_texticon Apoio Não Alinhado Diário: §R-0.01§!\n£nationalist_outlook_campaign_cost_modifier_texticon Apoio Nacionalista Diário: §R-0.01§!\n§YGasto Esperado com Saúde§!: §G-1.00§!\n"
 arm_reaction.6.t: "A Armênia Rompe Conosco"
 arm_reaction.6.d: "O governo armênio prendeu nossos agentes, baniu os partidos leais a nós e declarou abertamente que pretende deixar nossa esfera de influência. Erevan é nosso cliente desde a independência, e perdê-la agora convidaria todas as outras capitais do Cáucaso a testar até onde vai nossa paciência. É hora de decidir como responderemos."
 arm_reaction.6.a: "Criaremos um diversionismo."
 arm_reaction.6.b: "Vamos incitar uma insurreição na Armênia."
 arm_reaction.6.c: "Vamos expressar nossa indignação."
 arm_reaction.6.f: "Declarar Guerra à Armênia."
 arm_strike_build_in_progress: "Um Projeto de Construção Já Está em Andamento"
 karabakh_regulated_flag: "A Questão de Karabakh Foi Encerrada"
 NKR_marz_arm_desc: "O status legal de Artsakh como um marz autônomo (subdivisão territorial) dentro da Armênia protege a maioria armênia distinta da região das reivindicações azerbaijanas, ao mesmo tempo que mantém uma zona-tampão no Cáucaso. Esse arranjo surgiu das estruturas administrativas soviéticas e evoluiu para uma pedra angular da integridade territorial e da continuidade cultural armênias.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se Artsakh perder a §Hautonomia de marz§! ou se §HArtsakh§! deixar de existir."
 ARM_agree_on_places_desc: "Kocharyan consolida o poder negociando acordos secretos com homens fortes regionais e oligarcas: distribuição de cargos governamentais, garantias de privilégios econômicos e promessas de que as estruturas de poder existentes serão respeitadas em troca de apoio à sua presidência. Esses pactos entre elites mantêm estável o sistema de Kocharyan.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HRobert Kocharyan§! deixar de ser nosso líder."
 ARM_suppressed_oppos_desc: "O regime de Kocharyan usa medidas policiais, detenções, acesso restrito à mídia e assédio para suprimir partidos de oposição e vozes dissidentes. A oposição está presente, mas intimidada, incapaz de se organizar efetivamente ou de desafiar o domínio do presidente sobre o poder.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HRobert Kocharyan§! deixar de ser nosso líder."
 ARM_cauc_tigr_desc: "O extraordinário crescimento econômico da Armênia sob Kocharyan, impulsionado por booms de construção, afluxo de investimento estrangeiro e PIB em alta, rende comparações com os tigres asiáticos. Kocharyan anuncia esse crescimento como prova de que sua abordagem autocrática e amigável aos oligarcas funciona melhor do que a governança democrática, justificando seu controle rígido sobre a política e a mídia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HRobert Kocharyan§! deixar de ser nosso líder."
 ARM_autocratic_grip_desc: "O sistema de Kocharyan se cristaliza em autoritarismo pleno: as eleições são controladas, o parlamento é subordinado, o Judiciário obedece ao presidente e a oposição é marginalizada. Kocharyan não enfrenta desafios sérios ao seu governo pessoal, e o aparato estatal serve à sua vontade sem atrito interno.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HRobert Kocharyan§! deixar de ser nosso líder."
 ARM_armenia_kocharyan_idea_desc: "Um conceito abrangente que engloba todo o sistema político de Kocharyan: a consolidação do poder autocrático pessoal por meio de acordos entre elites, crescimento econômico, supressão da oposição e dependência de parceiros oligárquicos. Os efeitos reais do governo de Kocharyan se manifestam por meio de ideias subordinadas interligadas que refletem diferentes aspectos de seu modelo de governança.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HRobert Kocharyan§! deixar de ser nosso líder."
 ARM_armenia_serj_idea_desc: "Um conceito abrangente que engloba todo o sistema político de Serzh Sargsyan durante sua presidência (2008-2018): redes de lealdade militar, campanhas de educação patriótica, reforma previdenciária, monopólios apoiados por oligarcas e ocidentalização seletiva sob um guarda-chuva de segurança russo. Os efeitos reais do regime de Sargsyan se manifestam por meio de ideias subordinadas interligadas que refletem diferentes facetas de seu modelo de governança.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_tig_reforms_desc: "O primeiro-ministro Tigran Sargsyan (2008-2014) implementa reformas econômicas tecnocráticas: revisão do sistema previdenciário, reforma tributária focalizada, modernização da infraestrutura e ganhos de eficiência administrativa. Essas reformas geram crescimento de curto prazo, mas se mostram politicamente impopulares, especialmente entre aposentados e trabalhadores que enfrentam cortes de benefícios.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_loyal_military_idea_desc: "As forças armadas da Armênia tornam-se um alicerce do sistema político de Sargsyan: oficiais e generais que serviram sob seu comando durante a Guerra de Karabakh formam uma elite leal, elevada a cargos políticos e posições empresariais. Essa fusão entre militares e oligarcas garante a estabilidade política, ao mesmo tempo que subordina a independência militar ao controle presidencial.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_westernization_of_society_idea_desc: "Sargsyan permite uma influência cultural ocidental seletiva: moda, música, filmes e mídias sociais ocidentais entram abertamente na Armênia. O ensino superior ocorre cada vez mais em universidades ocidentais; a riqueza da diáspora aflui. Essa ocidentalização cultural coexiste com o autoritarismo político e a manutenção do domínio militar russo, criando uma sociedade híbrida.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_increased_food_imports_idea_desc: "Os oligarcas de Sargsyan monopolizam as importações de trigo, açúcar e combustível dos países vizinhos, especialmente da Rússia. Esse controle cartelizado das importações enriquece a oligarquia, mantendo os preços artificialmente altos e a Armênia dependente de intermediários russos. A reforma agrícola e a concorrência ameaçam as rendas do monopólio oligárquico.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_loyal_generalitet_desc: "O corpo de oficiais de Sargsyan torna-se uma casta privilegiada: altos salários, acesso preferencial a negócios e prioridade em contratos estatais consolidam a fusão militar-oligárquica. Generais passam para a liderança empresarial civil; a lealdade a Sargsyan torna-se o único requisito para a promoção, subordinando o profissionalismo militar à obediência política.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_pension_reform_idea_desc: "A reforma previdenciária acumulativa obrigatória de Tigran Sargsyan, em 2014, reduz as obrigações previdenciárias do Estado ao transferir o risco para os trabalhadores e os mercados de investimento. A reforma gera receita, mas se mostra profundamente impopular: aposentados enfrentam cortes de benefícios, trabalhadores desconfiam dos fundos de pensão privados e greves eclodem em resposta ao suposto roubo da segurança na aposentadoria.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_patriotic_educ_spir_desc: "O regime de Sargsyan incorpora a educação nacionalista às escolas armênias: treinamento militar, glorificação da Guerra de Karabakh e ênfase na singularidade civilizacional armênia. Essa educação patriótica forma uma geração apegada ao poder militar nacional e disposta a subordinar as liberdades civis às necessidades de segurança.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_patriotic_educmore_spir_desc: "Um estágio avançado da educação patriótica: o serviço militar torna-se uma expectativa quase obrigatória para os jovens; os currículos acadêmicos enfatizam estudos estratégicos e virtudes marciais; recursos estatais fluem para programas que celebram as tradições guerreiras armênias. O sistema educacional torna-se um instrumento de mobilização militar.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_monopolies_supported_idea_desc: "O sistema de Sargsyan protege explicitamente os monopólios oligárquicos de combustível, grãos e construção: contratos estatais fluem para oligarcas aprovados, a concorrência estrangeira é bloqueada e os preços permanecem artificialmente altos. A liberalização econômica permanece retórica enquanto cartéis oligárquicos controlam as commodities básicas e extraem rendas do consumidor armênio.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_nationalistic_educ_spir_desc: "Uma variante ideologicamente mais assertiva da educação patriótica: o nacionalismo armênio torna-se não apenas orgulho da herança, mas uma afirmação agressiva de reivindicações étnicas e históricas. Os livros didáticos enfatizam as memórias territoriais armênias; as disputas internacionais são enquadradas sob uma lente nacionalista; movimentos nacionalistas concorrentes tornam-se modelos cívicos aprovados pelo Estado.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HSerzh Sargsyan§! deixar de ser nosso líder."
 ARM_glory_of_tigran_idea_desc: "A restauração do orgulho nacional da Armênia por meio do legado de Tigranes, o Grande, o antigo rei que governou um império que se estendia do Cáspio ao Mediterrâneo. Círculos monarquistas nacionalistas invocam essa grandeza histórica para mobilizar apoio a um retorno ao governo monárquico e à restauração territorial.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hmonarquistas nacionalistas§! perderem o poder."
 ARM_crusade_legacy_idea_desc: "Os reinos armênios cristãos do passado mobilizaram seus fiéis como cruzados contra as potências muçulmanas vizinhas. Os movimentos monarquistas nacionalistas ecoam esse legado, enquadrando a condição de Estado armênia como uma missão cristã e um ponto de reunião contra rivais regionais.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hmonarquistas nacionalistas§! perderem o poder."
 ARM_urheimat_restored_idea_desc: "O coração histórico do povo armênio abrange os planaltos da Anatólia e o Cáucaso Sul. A ideologia monarquista nacionalista se centra na restauração da soberania armênia sobre essas terras antigas, recuperando o que é visto como a verdadeira pátria territorial da Armênia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hmonarquistas nacionalistas§! perderem o poder."
 ARM_tseghakronism_one_idea_desc: "O Tseghakronismo, ou \"Nacional-monarquismo\", é o programa ideológico dos movimentos monarquistas nacionalistas armênios, combinando restauração monárquica com nacionalismo étnico, maximalismo territorial e tradicionalismo cristão ortodoxo.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hmonarquistas nacionalistas§! perderem o poder."
 ARM_renewed_knighthood_idea_desc: "O renascimento da ordem feudal armênia como modelo de governança moderna: uma nobreza guerreira unida pela honra, pela proeza marcial e pela lealdade a uma coroa armênia restaurada. Os monarquistas nacionalistas traçam paralelos entre as antigas ordens de cavalaria e as estruturas militar-aristocráticas contemporâneas.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hmonarquistas nacionalistas§! perderem o poder."
 ARM_tseghakronism_two_idea_desc: "O avanço do tseghakronismo para uma ideologia de Estado abrangente: monarquia, nacionalismo e cristianismo ortodoxo unificados como o pilar da civilização armênia. O Estado torna-se inseparável da Igreja, e a lealdade ao trono torna-se um dever tanto religioso quanto patriótico.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hmonarquistas nacionalistas§! perderem o poder."
 ARM_state_christianity_idea_desc: "O programa monarquista nacionalista coloca a Igreja Apostólica Armênia como a alma da nação armênia. A política de Estado impõe a observância cristã e os valores ortodoxos como fundamento da identidade, da cidadania e da ordem social armênias.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hmonarquistas nacionalistas§! perderem o poder."
 ARM_armenia_dashnak_idea_desc: "A Federação Revolucionária Armênia (Dashnaktsutyun) perseguiu a independência e a libertação nacional ao longo do século XX, evoluindo de raízes socialistas para ideais nacionalistas. Este espírito abrangente reflete a profunda presença organizacional do partido, suas redes clandestinas e sua flexibilidade ideológica a serviço dos interesses nacionais armênios.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_dashnak_mitia_idea_desc: "Garegin Nzhdeh (Murad), conhecido como \"Mitia\", encarnou as tradições militantes da Dashnaktsutyun e a resistência guerrilheira contra a ocupação estrangeira. Seu legado inspirou as redes clandestinas do partido e a retórica de luta armada até bem dentro do século XXI.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_legacy_of_nzhden_desc: "A Dashnaktsutyun invocou a visão de Nzhdeh de uma Armênia unida e independente, livre do controle imperial, adaptando sua ideologia ao nacionalismo e ao socialismo modernos. Sua filosofia inspirou os impulsos descentralizadores do partido e a desconfiança em relação ao domínio estrangeiro centralizado.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_anti_imperialism_desc: "A Dashnaktsutyun criticou a dependência armênia das potências imperiais russa e ocidentais, defendendo a autodeterminação nacional e a autonomia econômica. Essa postura antiimperialista atraiu tanto os eleitorados de esquerda quanto os nacionalistas que buscavam uma genuína soberania armênia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_dashnak_militarism_desc: "A Dashnaktsutyun enfatizou a luta armada e a prontidão militar como essenciais para a sobrevivência e a independência nacionais. O partido cultivou tradições paramilitares e apoiou a modernização militar, vendo os conflitos da Armênia como existenciais, e não negociáveis.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_great_trial_radi_desc: "A Dashnaktsutyun enquadrou os sofrimentos históricos da Armênia, do genocídio otomano à dominação soviética, como uma \"grande provação\" que forjou o caráter nacional e o compromisso revolucionário. Essa narrativa justificou a postura intransigente do partido em relação à soberania e sua resistência a transigir com potências estrangeiras.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_class_strugle_desc: "A herança socialista da Dashnaktsutyun posicionou a luta de classes como inseparável da libertação nacional, criticando tanto as elites capitalistas quanto os burocratas soviéticos como opressores. O partido enquadrou os trabalhadores e camponeses como os verdadeiros agentes da redenção nacional armênia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_arm_revolt_dashnak_desc: "A Dashnaktsutyun organizou revoltas armadas contra a ocupação estrangeira ao longo de sua história, da Turquia otomana à União Soviética. As redes clandestinas do partido conduziram insurgências e sabotagens, vendo a rebelião armada como o único caminho para a genuína independência.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_arm_revolt_selhoz_desc: "A Dashnaktsutyun mobilizou trabalhadores rurais e agrícolas (os selkhozes sob o domínio soviético) em suas redes organizacionais, enfatizando o papel do campesinato na libertação nacional. O socialismo agrário tornou-se um pilar do apelo populista do partido no campo armênio.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_social_welfare_reform_idea_desc: "A Dashnaktsutyun defendeu o bem-estar social, os direitos trabalhistas e a proteção dos vulneráveis como imperativos morais ligados à sobrevivência e à solidariedade armênias. O partido defendeu a economia cooperativa e a ajuda mútua, posicionando-se como guardião dos pobres contra o capitalismo e a oligarquia corrupta.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hcomunistas anarquistas§! nem os §Hfascistas nacionalistas§! estiverem no poder."
 ARM_landforce_modifier: "Forças Terrestres Armênias"
 ARM_landforce_modifier_desc: "O componente terrestre das Forças Armadas Armênias, construído em torno de uma espinha dorsal de infantaria de conscritos herdada do 7º Exército de Guardas soviético e endurecida pela Primeira Guerra de Nagorno-Karabakh. Toda reforma das forças terrestres, das tropas internas à reserva de defesa territorial, se acumula aqui."
 ARM_airforce_modifier: "Força Aérea Armênia"
 ARM_airforce_modifier_desc: "O componente aéreo e de defesa aérea das Forças Armadas Armênias. Estabelecida em 1992 em torno de um punhado de células de aeronaves soviéticas transferidas, sempre foi a força subalterna, e sua capacidade depende tanto da defesa aérea terrestre quanto de suas aeronaves de combate."
 ARM_navalforce_modifier: "Forças Navais Armênias"
 ARM_navalforce_modifier_desc: "A Armênia não tem litoral nem frota, mas o Estado-Maior mantém um quadro naval, um estabelecimento de treinamento e uma tradição de infantaria naval herdada da Marinha Soviética. Se nossas fronteiras algum dia chegarem ao mar, ou se nossos marinheiros servirem sob outra bandeira, a experiência já existirá."
 NKR_landforce_modifier: "Exército de Defesa de Artsakh"
 NKR_landforce_modifier_desc: "As forças terrestres da República de Artsakh, formadas em 1992 a partir de destacamentos de milícias locais e sustentadas desde então por equipamentos, treinamento e oficiais armênios. As reformas transferidas de Yerevan se acumulam aqui."
 NKR_airforce_modifier: "Força de Defesa Aérea de Artsakh"
 NKR_airforce_modifier_desc: "O pequeno estabelecimento de defesa aérea da República de Artsakh. Sem aviação de combate própria digna de nota, Stepanakert depende quase inteiramente de sistemas terrestres para disputar o espaço aéreo sobre a linha de contato."
 ARM_security_modifier: "Serviços Especiais Armênios"
 ARM_security_modifier_desc: "O aparato de segurança interna da República da Armênia: o Serviço de Segurança Nacional em Yerevan, suas diretorias de guarda de fronteira e contraterrorismo, a polícia do Ministério do Interior e o ramo de inteligência estrangeira separado em 2016. Toda reforma dos serviços se acumula aqui."
 NKR_security_modifier: "Serviços de Segurança de Artsakh"
 NKR_security_modifier_desc: "O estabelecimento de segurança da República de Artsakh, construído sobre o modelo armênio e composto em grande parte por oficiais cedidos por Yerevan. As reformas adotadas na Armênia são repassadas a Stepanakert e se acumulam aqui."
 ARM_economy_modifier: "£text_icon_armdram Economia Armênia"
 ARM_economy_modifier_desc: "A metade doméstica da economia armênia: os bancos de varejo de Yerevan, as minas de cobre e molibdênio de Syunik e Lori, os processadores de frutas, as cimenteiras e a rede elétrica. Toda empresa posta em produção, privatizada ou expandida deixa sua marca aqui."
 ARM_western_partners_modifier: "Parcerias Econômicas Ocidentais"
 ARM_western_partners_modifier_desc: "A parcela da economia armênia que se apoia em capital e instituições ocidentais: participações canadenses no setor de tabaco, bancos britânicos, telecomunicações holandesas, concessões de mineração israelenses, o setor de TI voltado aos EUA e os programas universitários na Europa e nos Estados Unidos. Esses parceiros compram influência em Yerevan enquanto permanecerem.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se entrarmos em guerra com qualquer um de:§Y \n[USA.GetNameWithFlag] \n[ENG.GetNameWithFlag] \n[CAN.GetNameWithFlag] \n[FRA.GetNameWithFlag] \n[GER.GetNameWithFlag] \n[HOL.GetNameWithFlag] \n[ISR.GetNameWithFlag]§!"
 ARM_russian_partners_modifier: "Parcerias Econômicas Russas"
 ARM_russian_partners_modifier_desc: "Os vínculos científicos e educacionais da era soviética que Moscou ainda financia: os institutos de pesquisa de Yerevan e as filiais de universidades russas na Armênia. Eles mantêm viva a ciência armênia e, com ela, a influência russa em Yerevan.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se entrarmos em guerra com:§Y \n[SOV.GetNameWithFlag]§!"
 NKR_economy_modifier: "Economia de Artsakh"
 NKR_economy_modifier_desc: "A pequena economia de guerra da República de Artsakh: tributação de tempo de guerra, as fazendas dos vales de Karabakh, as obras florestais e todo investimento que Stepanakert consiga atrair. Toda reforma aprovada em Stepanakert se acumula aqui."
 ARM_alpha_mobilize_idea: "Grupo Alfa (Mobilizado)"
 ARM_alpha_mobilize_idea_desc: "O grupo antiterrorismo Alfa foi retirado de sua função permanente e empenhado na frente como formação de linha. Enquanto estiver desdobrado, o serviço perde o trabalho de contrainteligência e guarnição que normalmente realiza.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando a guerra terminar."
 ARM_police_troops_mobilize_idea: "Tropas Policiais (Mobilizadas)"
 ARM_police_troops_mobilize_idea_desc: "As tropas internas do Ministério do Interior foram mobilizadas como uma formação de campanha. Enquanto estiverem na frente, não estão policiando o interior.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando a guerra terminar."
 ARM_outdated_airforce_idea_desc: "Nossa força aérea opera um punhado de aeronaves transferidas no colapso soviético. As horas de célula estão acabando, as peças de reposição chegam de forma irregular e os pilotos registram horas de voo insuficientes para manter suas qualificações.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos o foco §H$ARM_institute_mo_ra$§! e será §RRemovido§! se concluirmos o foco §H$ARM_air_fedence_force$§!.\nComo §HArtsakh§!, será §RRemovido§! pelo foco §H$NKR_planes$§!."
 ARM_outdated_army_idea_desc: "Nossas forças terrestres estão equipadas com estoques soviéticos deixados em 1991 e organizadas segundo uma doutrina escrita para uma guerra que nunca será travada. Os veículos são canibalizados para obter peças, o treinamento é nominal e o corpo de oficiais não é reformado desde a independência.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos os focos §H$ARM_army$§!, §H$ARM_vazgen_academy$§!, §H$ARM_aspar_arms$§!, §H$ARM_k3_prototype$§!, §H$ARM_n2$§!, §H$ARM_lusan$§!, §H$ARM_uav_krunk$§! ou §H$ARM_new_army$§! e será §RRemovido§! quando todos os oito forem concluídos.\nComo §HArtsakh§!, §GMelhorará§! com os focos §H$NKR_safe_army$§!, §H$NKR_safe_univer$§!, §H$NKR_safe_special_forces$§!, §H$NKR_safe_vazgen$§! e §H$NKR_safe_mo_ra$§! e será §RRemovido§! quando todos os cinco forem concluídos."
 ARM_nati_army_idea_desc: "Veteranos da guerra de Karabakh e os partidos que falam por eles tomaram o corpo de oficiais e as juntas de alistamento. Eles enchem as fileiras e aumentam o apetite pela guerra, mas o governo civil responde a eles tanto quanto eles respondem a ele.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os comunistas chegarem ao poder."
 ARM_dziavory_idea_desc: "Um destacamento de elite de reconhecimento e operações especiais formado pelos voluntários mais capazes da guerra de Karabakh. De orientação ferozmente nacionalista, os Dziavory são tanto uma base política quanto uma unidade militar.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os comunistas chegarem ao poder."
 ARM_102_idea_desc: "A cooperação com a 102ª Base Militar Russa em Gyumri dá aos nossos serviços acesso à inteligência de sinais russa, à prática de contrainteligência e à garantia de segurança que acompanha uma guarnição estrangeira em nosso solo.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os comunistas chegarem ao poder."
 ARM_armenian_foreign_legion_idea_desc: "Inspirada na Legião Francesa, nossa legião estrangeira recruta voluntários de qualquer nacionalidade dispostos a servir à Armênia. Ela nos dá um quadro expedicionário profissional sem recorrer à mão de obra de conscritos, ao preço de influência estrangeira sobre seu equipamento e treinamento.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se as Forças Armadas deixarem de recrutar voluntários ou se encerrarmos o vínculo militar estrangeiro."
 ARM_armenian_foreign_legion_moblize_idea_desc: "A Brigada da Legião Estrangeira foi retirada de sua função permanente e empenhada na frente como formação de linha. Seus recrutas, vindos da diáspora e de voluntários estrangeiros, servem nas mesmas condições que os conscritos enquanto durarem os combates.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando a guerra terminar."
 ARM_national_guard_level_1_tt: "Estabelecemos a §YGuarda Nacional§!"
 ARM_national_guard_level_2_tt: "Expandimos a §YGuarda Nacional§!"
 ARM_peace_level_1_tt: "Estabelecemos a §YBrigada de Manutenção da Paz§!"
 ARM_anti_air_level_1_tt: "Estabelecemos a §YForça de Defesa Aérea§!"
 ARM_vdv_level_1_tt: "Estabelecemos as §YForças Aerotransportadas§!"
 ARM_davisur_level_1_tt: "Adotamos o programa de equipamentos da §YDAVISUR§!"
 NKR_integrate_army_of_armenia_available: "[ARM.GetNameWithFlag] reformou um ramo de suas forças armadas que ainda não adotamos"
 ARM_nor_aven_first_desc: "A reconstrução da Avenida Norte, no centro de Yerevan, traz modernização e comércio ao coração da capital, aumentando os fluxos de investimento e as oportunidades de negócios no estado afetado."
 ARM_nor_aven_sec_desc: "A preservação da cidade velha de Yerevan traz continuidade cultural e potencial turístico à capital, mantendo o caráter do centro histórico enquanto abre novas oportunidades econômicas.\n§W--------------§!\nEste modificador de estado será §RRemovido§! se os Problemas de Infraestrutura em Yerevan forem resolvidos."
 ARM_armenia_pashik_idea_desc: "O governo de Nikol Pashinyan abraçou a sociedade civil, a descentralização e as normas democráticas após a Revolução de Veludo de 2018. Sua administração avançou em direção às instituições ocidentais e às liberdades civis, marcando uma ruptura brusca com décadas de governança oligárquica.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_loyalists_in_government_desc: "Pashinyan cultivou uma base política dentro das instituições estatais, nomeando funcionários reformistas e tecnocratas simpáticos à sua agenda. Essa rede de leais forneceu apoio crucial durante os primeiros anos de consolidação, quando a resistência das antigas estruturas de poder ainda era forte.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_armenian_soc_media_prop_idea_desc: "O governo de Pashinyan aproveitou as redes sociais para contornar os veículos de mídia tradicionais controlados por oligarcas, dirigindo-se diretamente aos cidadãos no Facebook, Instagram e Telegram. Esse moderno aparato de propaganda reforçou sua imagem como líder do povo e contornou a resistência institucional às suas reformas.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HNikol Pashinyan§! estiverem no poder."
 ARM_pashinyan_anti_corrupt_idea_desc: "O combate à corrupção tornou-se a política emblemática e a marca pessoal de Pashinyan, com prisões e processos contra oligarcas de regimes anteriores. Seu governo estabeleceu novos órgãos anticorrupção e mecanismos de acusação, embora os críticos argumentassem que a aplicação continuava seletiva e politicamente motivada.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HNikol Pashinyan§! estiverem no poder."
 ARM_education_reforms_desc: "Pashinyan deu prioridade à modernização do sistema educacional da Armênia, aumentando os salários dos professores e introduzindo novos currículos alinhados aos valores democráticos. A reforma educacional simbolizou a ruptura com a memorização mecânica da era soviética e preparou a geração mais jovem para papéis na sociedade civil.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_true_pashik_democracy_desc: "A visão de democracia de Pashinyan enfatizou instituições transparentes, mídia independente e debate pluralista, um contraste marcante com a oligarquia opaca dos anos 1990. A expressão \"democracia de Pashik\" encapsulava sua promessa de uma governança representativa autêntica e de prestação de contas.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_controlled_democracy_desc: "Ao mesmo tempo que avançava as liberdades civis, o governo de Pashinyan manteve um controle estatal significativo sobre instituições-chave, setores sensíveis e resultados políticos. Esse equilíbrio entre aparência democrática e poder executivo mostrou-se pragmático para navegar pela fragmentada oligarquia armênia e pelas tensões regionais.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_new_era_of_peace_idea_desc: "Após anos de conflito, Pashinyan inicialmente promoveu o diálogo e a distensão com o Azerbaijão e a Turquia, enfatizando a cooperação econômica em vez do confronto militar. Seu governo buscou negociações sobre a disputa de Nagorno-Karabakh por meio de mediação internacional.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_support_of_ngo_idea_desc: "O governo de Pashinyan fortaleceu os laços com ONGs internacionais e organizações da sociedade civil, acolhendo seu monitoramento da governança e dos direitos humanos. Essa parceria reforçou a imagem democrática da Armênia e garantiu ajuda externa vinculada a reformas de boa governança.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_support_for_regions_desc: "Investimento governamental na agricultura rural, na infraestrutura de irrigação e em programas de apoio às colheitas para aumentar a produtividade regional e a produção agrícola nas províncias de fronteira."
 ARM_de_sovietization_idea_desc: "O desmantelamento sistemático das instituições, da ideologia e da infraestrutura da era soviética: substituir o simbolismo comunista, descomunizar a educação e a cultura e reconstruir a sociedade civil em bases democráticas. Essa agenda define o projeto liberal-nacionalista de Ter-Petrosian para a Armênia pós-independência.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HLevon Ter-Petrosian§! estiverem no poder."
 ARM_land_reform_idea_desc: "Desmantelar as fazendas coletivas soviéticas e devolver a terra à propriedade privada para estimular a produtividade agrícola e reverter o declínio rural. Essa reforma liberal-democrática visa criar uma classe independente de pequenos proprietários e revitalizar a Armênia rural.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HLevon Ter-Petrosian§! estiverem no poder."
 ARM_cilician_diplomacy_idea_desc: "A diáspora armênia e os históricos reinos armênios da Cilícia fornecem recursos diplomáticos e culturais para a política externa da Armênia. Engajar as redes da diáspora e honrar a herança cilícia fortalece a posição internacional e a legitimidade cultural da Armênia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HLevon Ter-Petrosian§! estiverem no poder."
 ARM_balanced_approach_idea_desc: "Um caminho do meio entre o tradicionalismo ortodoxo puro e o liberalismo ocidental, equilibrando a herança cristã da Armênia com um engajamento pragmático com o Ocidente e com os Estados muçulmanos vizinhos. Essa diplomacia pragmática busca estabilidade por meio de neutralidade calculada e parceria econômica, em vez de confronto ideológico.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HLevon Ter-Petrosian§! estiverem no poder."
 ARM_liberalization_of_economy_idea_desc: "Reformas de mercado para substituir o planejamento central soviético: privatizar empresas estatais, eliminar controles de preços, abrir a Armênia ao comércio internacional e estabelecer um sistema bancário moderno. Esse programa econômico liberal visa aproveitar as energias produtivas do capitalismo mantendo proteções sociais.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HLevon Ter-Petrosian§! estiverem no poder."
 ARM_crossroad_diplomacy_reverse_idea_desc: "Nossa nação estabeleceu uma parceria comercial mutuamente benéfica com a Armênia, aproveitando sua posição estratégica para acessar vários mercados e recursos regionais. Essa relação comercial gera retornos econômicos constantes e influência política no Cáucaso, oferecendo tanto ganho econômico quanto vantagem geopolítica por meio de um intermediário neutro.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se a Armênia deixar de existir ou se entrarmos em guerra com a Armênia."
 ARM_crossroad_diplomacy_idea_desc: "A posição geográfica da Armênia na encruzilhada das esferas de influência russa, persa, turca e ocidental oferece tanto perigo quanto oportunidade. Ter-Petrosian busca um engajamento pragmático com todos os lados, aproveitando parcerias econômicas e de segurança sem prender a Armênia a nenhum bloco. Essa abordagem sustentada é possibilitada pelo domínio de governos libertários neutros ou liderados por Ter-Petrosian.\n§W--------------§!\nEste espírito nacional §GMelhorará§! à medida que as iniciativas diplomáticas tiverem sucesso e a Armênia aprofundar seu engajamento entre blocos."
 ARM_crossroad_diplomacy_idea_1_desc: "O engajamento crescente da Armênia em múltiplas esferas: acordos com a Rússia em segurança, com o Ocidente em comércio e investimento, com o Irã em energia e trânsito, e com sua diáspora em capital e conhecimento. Esse malabarismo avançado continua dependente de uma governança libertária neutra ou da liderança continuada de Ter-Petrosian.\n§W--------------§!\nEste espírito nacional §GMelhorará§! à medida que a Armênia ampliar seus laços diplomáticos e econômicos em todas as regiões."
 ARM_crossroad_diplomacy_idea_2_desc: "A posição de encruzilhada da Armênia tornou-se a pedra angular de sua estratégia de sobrevivência: atuar como mediadora e intermediária entre potências concorrentes, vendendo seus ativos geográficos e culturais ao maior lance enquanto minimiza o risco militar e o compromisso político. Esse delicado equilíbrio exige um compromisso sustentado com uma política externa neutra.\n§W--------------§!\nEste espírito nacional §GMelhorará§! à medida que o valor da Armênia como parceira neutra de encruzilhada aumentar."
 ARM_crossroad_diplomacy_idea_3_desc: "A Armênia consolidou sua posição como uma genuína ponte entre Oriente e Ocidente: abrigando bases militares russas enquanto se relaciona com membros da OTAN, vendendo tanto para parceiros democráticos quanto autoritários e canalizando investimentos de todos os lados. A sustentabilidade desse arranjo depende inteiramente de a Armênia permanecer fora dos campos ideológicos, um compromisso que apenas os governos libertários ou de Ter-Petrosian podem manter.\n§W--------------§!\nEste espírito nacional §GMelhorará§! à medida que a reputação neutra da Armênia se tornar mais valiosa para as potências concorrentes."
 ARM_crossroad_diplomacy_idea_4_desc: "A Armênia tornou-se uma encruzilhada verdadeiramente indispensável: seu território, suas redes da diáspora, seus centros financeiros e sua postura neutra a tornam essencial para os cálculos estratégicos da Rússia, do Ocidente, do Irã e de outros. Rendas econômicas fluem de todas as direções, financiando o desenvolvimento e a segurança armênios sem exigir alinhamento total com qualquer bloco.\n§W--------------§!\nEste espírito nacional §GMelhorará§! à medida que a indispensabilidade estratégica da Armênia para todas as partes crescer."
 ARM_crossroad_diplomacy_idea_5_desc: "A Armênia aperfeiçoou a arte da encruzilhada: tornou-se o intermediário e destino de investimentos preferido de várias grandes potências, cada uma buscando influência no Cáucaso Sul sem confronto direto. A neutralidade continuada da Armênia e a governança libertária são as chaves para manter esse malabarismo extraordinariamente lucrativo.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se a Armênia continuar a aprofundar as relações com todas as grandes potências sem alinhamento formal."
 ARM_crossroad_diplomacy_idea_6_desc: "O auge de décadas de diplomacia cuidadosa: a Armênia alcançou um domínio tão completo de seu papel de encruzilhada que é essencial para a estratégia regional de todas as grandes potências. A economia armênia está entrelaçada com todos os blocos concorrentes; a segurança armênia é garantida pela presença russa, mas respeitada pelo Ocidente; as elites armênias têm ativos em toda parte. Esta etapa final exige um compromisso inabalável com a neutralidade e não sobrevive a uma mudança ideológica.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se nem os §Hlibertários neutros§! nem §HLevon Ter-Petrosian§! estiverem no poder."
 ARM_national_liberal_agenda_idea_desc: "Raffi Hovannisian e o partido Heritage defendem o nacional-liberalismo: economia de mercado combinada com nacionalismo cultural e engajamento da diáspora. Essa agenda rejeita tanto o autoritarismo de estilo soviético quanto o neoliberalismo ocidental, buscando um caminho unicamente armênio de nacionalismo cívico, empreendedorismo e desenvolvimento financiado pela diáspora.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_health_pindos_idea_desc: "As reformas da saúde, destinadas a modernizar e privatizar a medicina armênia, geram consequências inesperadas: custos crescentes, menor acesso para os pobres, atrito burocrático e escassez de medicamentos e equipamentos. A tentativa de aplicar modelos americanos de mercado de saúde às condições armênias sai pela culatra, gerando descontentamento público e tensão econômica.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_free_market_reforms_idea_desc: "Hovannisian defende a economia liberal clássica: privatização de empresas estatais, desmantelamento de monopólios, fim do controle de preços e abertura da Armênia à concorrência. As reformas de livre mercado visam liberar a energia empreendedora e eliminar o rentismo oligárquico, embora arrisquem convulsão social e desigualdade se não forem equilibradas com assistência social.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_protection_of_armenian_heritage_idea_desc: "O partido Heritage coloca o legado cultural e espiritual armênio no centro da política: apoio estatal à Igreja Apostólica, preservação de mosteiros e sítios históricos armênios e ênfase na continuidade civilizacional armênia. Esse nacionalismo cultural distingue a Armênia do ateísmo soviético, mantendo a abertura aos valores cívicos ocidentais.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_armenian_traders_culture_idea_desc: "Invocando as históricas redes mercantis da diáspora armênia, Hovannisian celebra o espírito empreendedor e a formação de redes comerciais como traços unicamente armênios. O Estado incentiva associações empresariais, parcerias comerciais com a diáspora e uma educação orientada ao mercado, vendo o capitalismo e a identidade armênia como compatíveis.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_protection_of_national_education_idea_desc: "O Heritage protege a educação armênia do domínio cultural estrangeiro (especialmente russo): enfatizando história, língua e literatura armênias nos currículos, aumentando os gastos com educação para atrair professores da diáspora e fortalecendo os laços com universidades ocidentais, mantendo a identidade cultural armênia como núcleo.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_soil_of_libery_idea_desc: "O solo da Armênia, física e metaforicamente, torna-se o alicerce da liberdade democrática e da independência nacional. Hovannisian enquadra a condição de Estado armênia como um projeto de princípios universais de liberdade: democracia, direitos humanos e Estado de direito enraizados no solo armênio, resistindo tanto ao autoritarismo russo quanto à captura oligárquica.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_us_inspired_government_idea_desc: "Hovannisian modela explicitamente a governança armênia nas instituições americanas: separação constitucional de poderes, judiciário independente, estruturas federais e ênfase na sociedade civil. Essa americanização da governança visa importar a resiliência democrática ocidental e proteger a Armênia tanto do domínio russo quanto da captura oligárquica.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_social_promises_desc: "Pashinyan prometeu uma reforma social abrangente, incluindo aumento das pensões, melhoria dos serviços públicos e medidas anticorrupção para construir legitimidade popular. Esses compromissos formaram a espinha dorsal de sua campanha de 2018 e das primeiras iniciativas de governo.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hlibertários neutros§! perderem o poder."
 ARM_armenia_raffik_idea_desc: "Um conceito guarda-chuva que incorpora a visão conservadora ocidental de Raffi Hovannisian: nacional-liberalismo armênio aliado ao engajamento da diáspora, economia de livre mercado, proteção do patrimônio e governança democrática de estilo americano. Os efeitos reais dessa visão se manifestam por meio de ideias subordinadas interligadas, que refletem diferentes facetas do modelo de Hovannisian para transformar a Armênia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hconservadores ocidentais§! perderem o poder."
 ARM_sport_development_desc: "A Armênia investe sistematicamente em infraestrutura atlética, academias de treinamento e programas esportivos competitivos para cultivar o orgulho nacional e o prestígio internacional. O sucesso em esportes olímpicos e competições regionais exibe a excelência armênia ao mundo, construindo poder brando e união em torno de conquistas nacionais compartilhadas.\n§W--------------§!\nEste espírito nacional §GMelhorará§! quando o foco §HDesenvolvendo os Esportes§! for concluído."
 ARM_berkut_troops_desc: "O Berkut, a Águia Dourada, é uma unidade de elite de controle de distúrbios e contraterrorismo empregada por interesses oligárquicos para reprimir greves, organização trabalhista e agitação civil. Sua presença reflete a disposição dos oligarcas de usar a força para proteger seus monopólios econômicos contra contestação popular.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Holigarcas neutros§! perderem o poder."
 ARM_farmercracy_desc: "Os oligarcas da Armênia mantêm o controle econômico por meio de monopólios agrícolas: controlando preços de grãos, canais de exportação e posse de terras. Partidos políticos apoiados por oligarcas promovem proteções agrícolas que mantêm a Armênia rural dependente de suas redes de clientelismo e de seu apoio eleitoral.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Holigarcas neutros§! perderem o poder."
 ARM_corporatocracy_desc: "Governo de oligarcas e seus representantes corporativos: as empresas estatais são controladas informalmente por oligarcas poderosos, os contratos do governo fluem para seus aliados e a política estatal é moldada por seus interesses econômicos, e não pelo bem-estar público. Os oligarcas efetivamente compraram o aparato estatal.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Holigarcas neutros§! perderem o poder."
 ARM_legacy_of_father_idea_desc: "O legado de Demirchyan como líder do Partido Comunista baseava-se em seu apoio aos operários industriais e aos soldados soviéticos, vendo-os como a espinha dorsal do desenvolvimento armênio. Este nível representa o apelo fundamental de seu modelo socialista tecnocrático junto à classe trabalhadora.\n§W--------------§!\nEste espírito nacional §GMelhorará§! quando o foco §HTrabalhadores e Soldados§! for concluído."
 ARM_legacy_of_father_two_idea_desc: "A visão de Demirchyan sobre o desenvolvimento da Armênia soviética enfatizava a autonomia cultural dentro de um Estado socialista administrado, equilibrando identidade nacional e internacionalismo proletário. Este nível representa um compromisso aprofundado com a governança tecnocrática e o legado institucional soviético.\n§W--------------§!\nEste espírito nacional §GMelhorará§! quando o foco §HCondenar as Decisões Soviéticas§! for concluído."
 ARM_legacy_of_father_three_idea_desc: "A ênfase de Demirchyan, no fim da carreira, em tecnocratas estratégicos, isto é, economistas, engenheiros e administradores, como essenciais para a modernização nacional cristalizou sua filosofia de governo. Este nível representa a ascensão da expertise e dos princípios meritocráticos sobre as redes de clientelismo.\n§W--------------§!\nEste espírito nacional §GMelhorará§! quando o foco §HPromover Tecnocratas§! for concluído."
 ARM_legacy_of_father_four_idea_desc: "A realização final do legado de Demirchyan, um Estado comunista tecnocrático que administra os interesses estratégicos e o desenvolvimento da Armênia, representa o auge da governança de estilo soviético na Armênia. Este nível final captura o sonho de um comunismo eficiente e nacionalista, livre da interferência de Moscou.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando a restauração de Demirchyan terminar e o projeto comunista enfrentar desafios inevitáveis."
 ARM_armenia_demirchyan_idea_desc: "Karen Demirchyan, líder do Partido Comunista Armênio da era soviética, personificava a governança tecnocrática e os impulsos nacionalistas dentro da estrutura soviética. Sua administração enfatizou o desenvolvimento industrial e a preservação cultural, conquistando o respeito até de opositores por sua competência e moderação.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hcomunistas neutros§! perderem o poder."
 ARM_economy_shady_idea_desc: "Salários em dinheiro, importações não registradas e comércio sem tributação mantêm grande parte do comércio armênio fora dos registros. Isso compra paz social ao custo do tesouro.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se usarmos a decisão §YDestruir a Influência da Economia Paralela§!."
 ARM_economy_shady_idea4_desc: "Resta apenas o menor canto da economia cinzenta. O foco §YNegócio de Cassinos§! a §Gremove§!."
 ARM_multigroup_idea_desc: "O conglomerado Multigroup se estende por combustíveis, tabaco, construção e política. Cada concessão feita a ele aprofunda seu domínio sobre o Estado.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se usarmos a decisão §YDesmantelar o Multigroup§!."
 ARM_gaz_energy_problems_desc: "A Armênia herdou uma rede de gás e energia que não corresponde mais à sua demanda, e os apagões de inverno da década de 1990 ainda estão frescos na memória.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §HCooperação com a Gazprom§!."
 ARM_has_artsakh_idea: "Administrando Artsakh"
 ARM_has_artsakh_idea_desc: "Yerevan arca com a administração civil, o policiamento e as pensões de um território que não reconhece formalmente como seu. O custo é silencioso, mas permanente.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se §HArtsakh§! perder sua §Hautonomia de marz§! ou deixar de existir."
 ARM_integration_idea: "Integrando Novo Território"
 ARM_integration_idea_desc: "Uma província recém-anexada está sendo submetida à lei armênia. Até que a transição termine, os custos de policiamento aumentam e as pessoas vão embora."
 ARM_Eraz_idea_desc: "A Fábrica de Automóveis de Yerevan (ErAZ) é a pedra angular da manufatura automotiva armênia da era soviética, produzindo as icônicas vans e veículos comerciais ErAZ para exportação em toda a URSS e nos mercados pós-soviéticos. O renascimento da produção da ErAZ simboliza a reindustrialização da Armênia e sua dependência dos mercados e da tecnologia russos.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se entrarmos em guerra com a Rússia."
 NKR_gaz_energy_problems_desc: "A maior parte de Artsakh ainda é aquecida com lenha e gás engarrafado.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §HRealizar a Gaseificação§!."
 NKR_corruption_in_police_idea_desc: "A polícia de Artsakh vive do que consegue extorquir nos postos de controle.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se concluirmos o foco §HReorganização da Polícia§!."
 ARM_economy_tourism_income_tt: "£text_icon_armdram A Armênia obtém §Yreceita mensal de turismo§! de cada região de resort que controla"
 ARM_have_bank_sector_tt: "Temos um §YSetor Bancário§! consolidado"
 ARM_have_green_energy_tt: "Temos um programa de §YEnergia Verde§!"
 ARM_have_electric_networks_tt: "Somos donos das §YRedes Elétricas da Armênia§!"
 arm_economic.24.t: "Os Parceiros Ocidentais Se Retiram"
 arm_economic.24.d: "No instante em que os primeiros tiros foram disparados, os conselhos se reuniram. Holdings de tabaco, bancos, operadoras de telecomunicações, concessões de mineração e programas universitários estão encerrando suas operações armênias ao mesmo tempo. Alguns citam sanções, outros citam seguros, e nenhum deles diz quando pretende voltar."
 arm_economic.24.a: "Eles nunca iriam ficar."
 arm_economic.25.t: "Moscou Fecha os Institutos"
 arm_economic.25.d: "Primeiro o financiamento da pesquisa foi cortado; depois, a filial universitária foi instruída a suspender as admissões. Décadas de laboratórios compartilhados e de intercâmbio de pessoal estão sendo desfeitas por carta administrativa, e os cientistas que os construíram já procuram trabalho no exterior."
 arm_economic.25.a: "Nós mesmos os reconstruiremos."
 ARM_landmines_desc: "Minas antitanque e antipessoal implantadas em todo o território de Artsakh como medida defensiva contra a invasão. Elas atrapalham as operações mecanizadas inimigas, mas complicam a reconstrução civil e o desenvolvimento econômico."
 ARM_eu_coop_agreement_desc: "A Armênia assina o Acordo de Parceria Abrangente e Reforçado (CEPA) com a União Europeia em 2017, elevando os laços além do Acordo de Associação de 2013, abandonado quando a Armênia aderiu à União Econômica Eurasiática. O CEPA estabelece cooperação em comércio, investimento, governança, energia e segurança, um ato de equilíbrio entre o engajamento europeu e a integração regional liderada pela Rússia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando o foco §HFechar Todas as Organizações de Integração§! for concluído."
 ARM_eu_council_desc: "A adesão da Armênia ao Conselho da Europa expõe o país aos padrões europeus de direitos humanos, às normas democráticas e ao escrutínio internacional. Essa âncora institucional nas estruturas de governança europeias fornece legitimidade e marcos legais para a reforma interna, ao mesmo tempo em que submete as políticas armênias a pressão e monitoramento externos.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando o foco §HFechar Todas as Organizações de Integração§! for concluído."
 ARM_eu_commitie_desc: "Um comitê parlamentar armênio dedicado à integração com a UE coordena a harmonização legislativa, implementa padrões europeus e gerencia a máquina burocrática que liga a Armênia às redes institucionais europeias. O comitê representa a profunda incorporação das expectativas de governança europeias à prática do Estado armênio.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando o foco §HFechar Todas as Organizações de Integração§! for concluído."
 ARM_eu_ngos_desc: "ONGs europeias e internacionais atuam em toda a Armênia, monitorando os direitos humanos, prestando serviços e promovendo a reforma da governança. Sua presença oferece mecanismos externos de prestação de contas, ao mesmo tempo em que enfraquece o monopólio do Estado sobre a sociedade civil e projeta valores ocidentais nas comunidades armênias.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando o foco §HFechar as ONGs§! for concluído."
 ARM_eu_lgbt_desc: "O compromisso nominal da Armênia com os direitos LGBTQIA, codificado por meio das convenções europeias de direitos humanos, enfrenta profunda resistência social e religiosa da maioria ortodoxa e conservadora do país. Essa tensão entre obrigações legais europeias e valores internos continua sendo um dos pontos de contato mais delicados da Armênia com o Ocidente.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando o foco §HPropaganda Contra os Valores Ocidentais§! for concluído."
 ARM_help_siryan_idea_desc: "A Armênia transporta por via aérea militares, assessores e suprimentos humanitários para o enclave sírio-armênio em Aleppo, apoiando comunidades armênias ameaçadas durante a guerra civil síria. Essa missão sustenta a segurança da comunidade da diáspora, ao mesmo tempo em que reafirma o compromisso da Armênia de proteger as minorias armênias em todo o Oriente Médio.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando a paz for restaurada e nossa missão humanitária terminar."
 ARM_fsb_borderguards_desc: "Os guardas de fronteira do Serviço Federal de Segurança russo estão estacionados nas fronteiras da Armênia com a Turquia e o Irã desde 1992, formalizados em um tratado bilateral. Eles patrulham a fronteira, interceptam contrabandistas e mantêm um símbolo visível da presença militar russa em nosso solo. Sua presença depende da boa vontade de Moscou e da estabilidade da relação bilateral.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se entrarmos em guerra com [SOV.GetNameWithFlag], adotarmos um governo democrático ou se [SOV.GetNameWithFlag] desenvolver uma opinião negativa sobre nós."
 ARM_syunik_pipeline_desc: "Um gasoduto de gás natural que atravessa a província de Syunik, levando gás iraniano à Armênia. O gasoduto alivia a crônica escassez de energia da Armênia, integra a província do sul à economia nacional e cria um elo valioso no comércio irano-armênio.\n§W--------------§!\nEste modificador de estado será §RRemovido§! se cancelarmos o gasoduto pela decisão §YCancelar Gasoduto§! ou se o ampliarmos pela decisão §YExpandir Gasoduto§!."
 ARM_syunik_pipeline_two_desc: "Um gasoduto de gás natural ampliado através da província de Syunik, levando maiores suprimentos de gás iraniano à Armênia. O gasoduto expandido aprofunda a integração econômica da Armênia com o Irã e impulsiona significativamente o desenvolvimento da província.\n§W--------------§!\nEste modificador de estado será §RRemovido§! se cancelarmos o gasoduto pela decisão §YCancelar Gasoduto§!."
 ARM_arm_electr_deal_desc: "Um acordo para o fornecimento de eletricidade do Irã à Armênia, reduzindo a dependência da geração interna de energia e aliviando a escassez sazonal na província."
 ARM_arm_electr_deal_two_desc: "Um acordo ampliado para maior fornecimento de eletricidade do Irã, estabilizando a rede elétrica da Armênia e permitindo o crescimento industrial nas províncias de fronteira."
 ARM_legacy_of_grunwald_idea_desc: "A Armênia invoca a lição de Grunwald: oposição unida contra a hegemonia germânica. Traçando paralelos com a aliança polaco-lituana contra a expansão teutônica, a Armênia corteja antigos parceiros soviéticos e do Leste Europeu para formar um contrapeso ao domínio industrial e político alemão na região.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hcomunistas§! chegarem ao poder."
 ARM_amenia_iran_memo_desc: "A Armênia e o Irã assinaram memorandos de entendimento cruciais no início dos anos 2000, abrangendo cooperação energética, rotas de trânsito e coordenação de mídia. Esses acordos reconheceram interesses compartilhados em estabilidade, acesso a mercados e defesa comum contra rivais comuns. A parceria ancorou a Armênia em uma rede de laços eurasiáticos.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se a opinião do Irã sobre nós cair abaixo de zero."
 ARM_amenia_iran_dam_share_desc: "A Armênia e o Irã investiram conjuntamente em infraestrutura hidrelétrica ao longo do rio Araks, na província de Syunik, criando produção de energia compartilhada e dependência econômica mútua. Essa joint venture exemplificou a cooperação prática transfronteiriça e forneceu à Armênia eletricidade barata, enquanto o Irã ganhou influência sobre a segurança energética armênia.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se a opinião do Irã sobre nós cair abaixo de zero."
 ARM_free_trade_zone_desc: "Uma zona de livre comércio estabelecida na Província de Meghri para facilitar os fluxos comerciais, reduzir barreiras tarifárias e atrair investimento estrangeiro para a região de fronteira sul que liga a Armênia ao Irã."
 ARM_ukraine_cooperation_idea_desc: "A Armênia e a Ucrânia forjam parcerias estratégicas aproveitando a substancial presença da diáspora armênia na Ucrânia. A cooperação abrange comércio, investimento, tecnologia militar e coordenação política no espaço pós-soviético, unindo duas nações com experiências compartilhadas de pressão russa e fronteiras contestadas.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se entrarmos em guerra com a Ucrânia."
 ARM_yazidi_repatriation_desc: "A Armênia acolhe os yazidis que fogem da perseguição no Oriente Médio, oferecendo-lhes santuário, autonomia cultural e representação nas instituições políticas armênias. O programa de repatriação yazidi reflete os laços históricos da Armênia com a comunidade yazidi e posiciona o país como refúgio para minorias perseguidas em toda a diáspora.\n§W--------------§!\nEste espírito nacional §GMelhorará§! quando o foco §HNossa Terra da Liberdade Deles§! for concluído."
 ARM_yazidi_repatriation2_desc: "A repatriação yazidi atinge seu auge: dezenas de milhares de yazidis retornaram às terras armênias, criando prósperos centros culturais na Cilícia e em outros lugares. A comunidade ganha representação parlamentar plena, autonomia religiosa e oportunidades econômicas, posicionando a Armênia como um refúgio exemplar para minorias perseguidas no Oriente Médio.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se perdermos o controle da Cilícia."
 ARM_armenia_zhirayr_idea_desc: "Um conceito abrangente que encarna o programa político radicalmente pró-ocidental e antirrusso de Sefilian: governança liderada por veteranos, confronto com a elite oligárquica, ativismo anticorrupção e uma dramática reorientação em direção à OTAN e ao Ocidente. Os efeitos reais dessa transformação radical se manifestam por meio de ideias subordinadas interligadas que refletem diferentes facetas da visão de Sefilian.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_veterans_idea_desc: "Sefilian e seu movimento colocam veteranos de combate, especialmente comandantes da Guerra de Karabakh, na liderança política, argumentando que a experiência militar e o sacrifício conferem legitimidade. Os veteranos substituem civis e oligarcas em cargos de autoridade, trazendo disciplina marcial e prioridades nacionalistas ao governo.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_pro_western_position_idea_desc: "Uma ruptura brusca com a política externa armênia pós-soviética: o movimento de Sefilian abandona a parceria militar com a Rússia e as obrigações da OTSC em favor da adesão à OTAN, da integração à UE e do alinhamento com as potências ocidentais. A Armênia se torna um posto avançado da aliança ocidental no Cáucaso Sul, enfrentando a Rússia diretamente através das fronteiras armênias.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_no_russian_idea_desc: "Sefilian rejeita explicitamente a dependência armênia da proteção militar russa. Remover as tropas russas do solo armênio, recusar as obrigações da OTSC e construir capacidades de defesa armênias independentes tornam-se centrais nesse programa nacionalista anticolonial. A Armênia retoma a soberania de Moscou.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_radicalism_idea_desc: "O movimento de Sefilian rejeita explicitamente a política de consenso e os compromissos liberais, adotando a ação direta e o confronto ideológico com a ordem oligárquica estabelecida. O enquadramento radical da política armênia, isto é, protesto armado, ocupação de prédios estatais e desafio público, torna-se institucionalizado como princípio de governo.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_first_armenia_war_idea_desc: "Sefilian e seu movimento reverenciam a Primeira Guerra de Nagorno-Karabakh (1988-1994) como o momento decisivo da independência e da glória militar armênias. Essa memória de guerra torna-se uma força mobilizadora para um novo confronto: com o Azerbaijão, com a Rússia pelo futuro da Armênia e com a elite interna que supostamente desperdiçou a vitória.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_fight_freedom_idea_desc: "Sefilian enquadra a luta atual como uma continuação das guerras de libertação da Armênia: liberdade da dominação estrangeira (Rússia), liberdade da tirania interna (os oligarcas) e liberdade para traçar um rumo independente. A luta heroica torna-se tanto o método quanto a justificativa para a ação radical e a aliança com o Ocidente.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_heroes_idea_desc: "O movimento de Sefilian eleva heróis de guerra, líderes ativistas e mártires a modelos para a juventude armênia, substituindo os oligarcas como símbolos da aspiração nacional. Uma nova geração de heróis surge da luta contra a corrupção e a dependência estrangeira, inspirando maior mobilização e sacrifício pelas metas nacionais.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_e_commerce_idea_desc: "O movimento de Sefilian abraça uma transformação tecnológica radical: desenvolver o setor de TI da Armênia como alavanca para a integração ocidental e a independência econômica em relação à Rússia. A economia tecnológica torna-se símbolo de modernidade, empoderamento da juventude e ruptura com as indústrias legadas da era soviética.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_zhirayr_sassoun_idea_desc: "Batizada em homenagem aos lendários heróis de Sassoun do folclore armênio e ao grupo armado Sasna Tsrer, que Sefilian liderou na tomada de uma delegacia em 2016, esta ideia celebra o desafio armado como ferramenta moral e política. O modelo do guerreiro-herói torna-se o modelo para confrontar a tirania, interna ou externa.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se os §Hautocratas ocidentais§! perderem o poder."
 ARM_turkey_compliance_idea_desc: "A Armênia tolera tacitamente um governo no exílio para a Armênia Ocidental, mantendo a conformidade diplomática com a Turquia para evitar provocações e preservando a reivindicação irredentista sobre as terras históricas armênias. Esse arranjo permite à Armênia defender os interesses da diáspora sem provocar uma resposta militar turca direta.\n§W--------------§!\nEste espírito nacional será §RRemovido§! quando o evento §HInsurreição na Armênia Ocidental§! ocorrer e a Armênia escolher a libertação."
 ARM_kazah_cooperation_idea_desc: "A Armênia estabelece laços econômicos e políticos com o Cazaquistão, aproveitando o legado soviético comum, as conexões da diáspora e o interesse mútuo em conter a hegemonia russa. A cooperação inclui comércio de energia, investimento e coordenação de segurança, ancorando a Armênia nas redes da Ásia Central.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se entrarmos em guerra com o Cazaquistão."
 ARM_state_ateism: "State Atheism"
 ARM_kom_code: "Communist Moral Code"
 ARM_kob_fund_campaign: "Finance Unity Organizers"
 ARM_kob_fund_campaign_desc: "Send another $3 billion to build Unity's support in Russia. Funding ends at 45% support (currently §Y[?SOV.party_pop_array^22|%1]§!)."
 ARM_kob_launch_coup: "Launch the Unity Coup"
 ARM_kob_launch_coup_desc: "Order Petrov's supporters to move. Russia will receive a final chance to respond before the coup is resolved. This ends our funding campaign, regardless of the outcome.\n\nThe base coup chance is 10 plus Unity's support percentage. Russian stability below 40% adds 10 points; stability above 60% removes 10. Second Service, OMON, active Internal Troops, and the National Guard organization each remove 10 points. Armenian influence of at least 40% adds 10. The result is limited to 5-75%, before Russia's final response."
 ARM_kob_campaign_start_tt: "Russia will learn of our funding and unlock countermeasures."
 ARM_kob_support_tt: "Unity has at least §Y20%§! support in Russia (currently §Y[?SOV.party_pop_array^22|%1]§!)."
 ARM_kob_odds_tt: "Current coup chance before emergency arrests: §Y[?ARM.ARM_kob_coup_chance|0]%§!."