 CT_CUR_FOREIGN_TT: "Ce chiffre représente le nombre de pays qui nous ont envoyé des conseillers pour assister nos opérations antiterroristes. Chaque nation qui envoie un conseiller augmente notre modificateur de §Yprécision du renseignement§! de §G1 %§!, améliorant ainsi notre §Yprécision du renseignement§!. De plus, les nations ayant des §Yconseillers étrangers§! chez nous verront leurs opérations sur notre sol améliorées."
 CT_SYS_DESC: "Le §Ysystème antiterroriste§! fait varier la menace des organisations terroristes et leur visibilité selon la situation mondiale. Plus le §Rniveau de menace terroriste§! monte, plus les attaques sont fréquentes et fortes ; tensions mondiales, contenu national et vos actions le font varier. Mise à jour mensuelle ou après une action majeure.\n\nUtilisez espions, actions de ce menu et raids pour recueillir des informations et réduire la menace. Plus la §Yprécision du renseignement§! monte, plus vous pouvez raider leur QG et l'éliminer."
