 IND_Aceh_insurgency_info: "아체는 1976년부터 혼란과 반란의 지역이었으며, 국가의 불안을 가속화시키고 불필요한 유혈 사태를 야기하고 있습니다. 우리 군은 이 반란군을 진압하는데 너무 집중해 있으며, 이는 군사력 약화의 원인이 되었습니다."
