 ukr_modernize_sov_equipment_t55_procurement_program_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t55_procurement_for_tooltip\n\n\n\n\n\n\n\n\n§WХранящиеся корпуса §YТ-54§! и §YТ-55§! проходят через §YХарьковский бронетанковый завод§! и возвращаются с разработанным нами пакетом модернизации. §RОдин военный завод§! в Харькове выходит из обычного производства до закрытия программы.§!"
