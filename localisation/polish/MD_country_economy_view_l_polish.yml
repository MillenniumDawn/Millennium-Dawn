 print_money_button_tooltip: "§YDrukuj pieniądze§!\n§gRząd znalazł się w trudnej sytuacji i musi szybko pozyskać środki. Zamiast polegać na opodatkowaniu czy emisji obligacji, możemy w tym celu wyemitować pieniądz.§!\n\nWydanie tego polecenia skutkuje wygenerowaniem środków odpowiadających dwutygodniowym wpływom do budżetu państwa, które trafiają do twojego skarbca. Emisja pieniądza jest jednak działaniem proinflacyjnym: podnosi ona poziom inflacji w bieżącym kwartale, a wielokrotne jej przeprowadzanie przed kwartalną aktualizacją wskaźnika inflacji potęguje ten efekt.\n\n§YCzasy druku pieniądza: §![?printing_money_var|0Y]\n\n§YWymagania wstępne: §!\n[!print_money_button_click_enabled]\n§YEfekty: §!\n[!print_money_button_click]"
