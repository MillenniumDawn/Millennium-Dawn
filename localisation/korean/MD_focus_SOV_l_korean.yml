 SOV_joint_research_ttip: "§R이 보너스는 한 번만 사용할 수 있으며 바르샤바 조약 내 국가에만 적용됩니다. 역사적 바르샤바 조약 외부의 국가는 이 보너스를 받지 못합니다. 모든 동맹국이 조약 가입국임을 확신할 때만 사용하십시오. 오직 그들만 혜택을 받기 때문입니다.§!"
