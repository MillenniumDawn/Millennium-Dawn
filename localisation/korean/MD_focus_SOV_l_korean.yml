 SOV_bars_close: "§YBARS§! §G폐쇄§!"
 SOV_safe_russia: "국가 안보"
 SOV_safe_russia_desc: "우리나라는 광대하며, 이를 효과적으로 방어하려면 국가 안보를 위해 24시간 활동하는 대규모 병력과 특수 부대 및 기관이 필요합니다."
 SOV_vimpel_omon_exp: "빔펠 그룹"
 SOV_vimpel_omon_exp_desc: "빔펠 그룹, 즉 V국은 흔히 KGB V국이라 불리는 FSB의 스페츠나츠 부대입니다. 알파 그룹의 자매 부대이며 FSB 지휘 아래 전략 작전을 전문으로 합니다."
 SOV_second_slujba: "제2국"
 SOV_second_slujba_desc: "헌법 질서 수호 및 대테러국이라고도 불리는 제2국은 테러리즘, 극단주의, 국내 정치적 위협에 대응하고 러시아의 헌법 질서를 지키며, 민감한 사회·문화 분야에서 방첩 활동을 수행합니다."
 SOV_inner_army: "내무군"
 SOV_inner_army_desc: "내무부 내무군은 군중 통제, 주요 시설 경비, 경찰 작전 지원을 임무로 하는 준군사 부대입니다. 체첸 전쟁과 같은 국내 분쟁에서 핵심적인 역할을 수행했습니다."
 SOV_omon: "OMON"
 SOV_omon_desc: "OMON은 1988년에 처음 창설된 러시아 내무부 내의 특수 경찰 부대 체계입니다. 폭동 진압과 준군사적 치안 활동으로 알려져 있으며, 일부 구소련 국가에서도 유사한 역할로 운영되고 있습니다."
 SOV_upravlenie_k: "K국"
 SOV_upravlenie_k_desc: "내무부 K국은 사이버 범죄와 전자 기기 및 감시 장비의 불법 거래에 대응하는 일을 전문으로 합니다."
 SOV_centr_t: "극단주의 대응 센터"
 SOV_centr_t_desc: "E센터로 알려진 내무부 산하의 이 부서는 러시아 전역의 극단주의 활동을 식별하고 억제하는 데 주력합니다."
 SOV_gusb: "내부보안 총국"
 SOV_gusb_desc: "내부보안 총국은 내무부 산하의 독립 경찰 부서로, 부패와 내부 범죄를 방지하고 법 집행 인력의 청렴성을 보장하는 임무를 맡고 있습니다."
 SOV_sobr: "SOBR"
 SOV_sobr_desc: "SOBR은 군사 훈련과 장비를 갖춘 스페츠나츠 신속대응 부대입니다. OMON과 함께 활동하며, 위험도가 높은 작전에 투입될 수 있는 준군사 경찰 전술 부대로 기능합니다."
 SOV_anti_corrupt_upravlenie_desc: "이 총국은 내무부의 경제 범죄 및 부패 대응 활동을 주도하며, 러시아의 경제 안보를 보호하기 위한 국가 정책과 법적 규정을 시행합니다."
 SOV_gru_desc: "GRU는 총참모부 산하의 러시아 해외 군사정보기관입니다. 군사정보 부대와 스페츠나츠 부대를 지휘하며, 국방부에 보고하고 전 세계에서 복잡하고 위험도 높은 작전을 수행하는 것으로 알려져 있습니다."
 SOV_gru_spetznaz: "GRU 스페츠나츠"
 SOV_gru_spetznaz_desc: "GRU 스페츠나츠는 GRU의 특수 부대로, 해외에서 비밀 군사 작전과 정보 임무를 수행하는 임무를 맡고 있습니다."
 SOV_zaslon: "자슬론"
 SOV_zaslon_desc: "자슬론은 1997년에 창설된 SVR의 극비 특수부대입니다. 해외 정보 작전을 군사적으로 지원하고, 러시아 외교 공관을 보호하며, 위험도가 높은 임무에서 SVR 지도부의 신변을 지킵니다."
 SOV_outer: "해외 정보"
 SOV_outer_desc: "우리의 국가 안보는 적대 세력을 얼마나 잘 감시하고 약화시키느냐에 달려 있습니다. 우리를 훼손하려는 모든 적에 대해 경계를 늦춰서는 안 됩니다."
 SOV_alpha_idea: "알파 특수부대"
 SOV_alpha_idea_desc: "러시아 연방보안국 특수목적센터의 특수 부대입니다. A국의 주요 임무는 테러 행위를 방지하기 위한 특수 보안 작전 수행, 테러범 수색·무력화 또는 제거, 인질 구출입니다. 알파 그룹 대원들은 그 밖의 고난도 FSB 작전도 수행하며 활발한 분쟁 지역에서도 활동합니다."
