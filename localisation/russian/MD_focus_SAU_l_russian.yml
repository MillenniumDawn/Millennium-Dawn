 SAU_declare_republic_warning_tt: "§RПредупреждение:§! Провозглашение Республики Аравия является окончательным. Дом Аль Саудов никогда не будет восстановлен, и королевская преемственность закрыта навсегда."
 SAU_energy_jordan_tt: "[JOR.GetFlag]§HДействующее торговое соглашение обязывает Иорданию сотрудничать с Саудовской Аравией в энергетической сфере; это способствует укреплению стабильности и доброй воли в отношениях с регионом.§!"
 SAU_faisalite_forbids_norm_tt: "Королевство не приняло §YПрограмма Файсала§! — Он никогда не соглашался на раздел имущества, и его наследники не подпишут соглашение о нём."
 SAU_faisalite_gate_isolation_tt: "Показатель §OIsolationist§! должен быть выше показателя §RInterventionist§!."
 SAU_faisalite_gate_thirdway_tt: "Количество участников с кодом §RInterventionist§! должно быть как минимум на одном уровне с количеством участников с кодом §OIsolationist§!."
 SAU_faisalite_path_tt: "Принц Митеб, должно быть, поддержал программу Фейсала, когда началась процедура престолонаследия."
 SAU_faisalite_petition_gate_tt: "Требует §HОсуждение Мутаиба§! по крайней мере §H50§!"
 SAU_faisalite_ruler_tt: "Митеб бин Абдулла должен занять трон."
 SAU_faisalite_slots_tt: "§HДирективы в разработке§!: §Y[?SAU_faisalite_active|0]§! из §Y2§!"
 SAU_freedom_or_death_tt: "[FSA.GetFlag]§HКоролевство принимает все необходимые меры: оказывает мощную поддержку повстанцам и открыто враждебно относится к режиму.§!"
 SAU_fsa_volunteers_tt: "[FSA.GetFlag]§HИностранные добровольцы пополняют ряды повстанцев свежими силами и опытом.§!"
 SAU_fund_fsa_tt: "[FSA.GetFlag]§HСвободная сирийская армия благосклонно относится к нам и рассчитывает на поддержку Эр-Рияда.§!"
 SAU_fund_jordan_army_tt: "[JOR.GetFlag]§HИорданская армия набирается опыта и относится к нам как к своему покровителю.§!"
 SAU_fund_laf_tt: "[LEB.GetFlag]§HСаудовские деньги и винтовки восстанавливают ливанскую армию в качестве противовеса Хезболле.§!"
 SAU_hajj_revenue_01_tt: "§GДоходы от паломничества хадж: около 2 миллионов паломников в год.§!"
 SAU_houthi_ceasefire_tt: "§GЕсли хуситы согласятся на прекращение огня, операция «Решительная буря» прекратит свою деятельность.§!\nРешения о войне в Йемене приостановлены, и воздушная поддержка над Йеменом прекращена. Перемирие может быть нарушено в любой момент."
 SAU_houthi_defeated_tt: "§RТребуется поражение (капитуляция или уничтожение) хуситов.§!"
 SAU_houthi_war_tt: "§RДля этого необходимо, чтобы хуситы существовали и находились в состоянии войны с йеменским правительством.§!"
 SAU_indirect_war_tt: "§HМы привержены косвенной борьбе: через посредников, деньги и давление, а не открытой войне.§!"
 SAU_iraq_war_tt: "§YПуть Саддама разветвляется в зависимости от того, выстоит он или падет.§!"
 SAU_isr_accords_tt: "[ISR.GetFlag][PAL.GetFlag]§GПризнание государственности на границе 1967 года. Израиль и Королевство устанавливают отношения, и Палестина освобождается от израильской власти как §!§Yполностью независимое государство§!§G под гарантиями Саудовской Аравии и Иордании.§! §YЗакрывает всякую поддержку палестинских ополчений.§!"
 SAU_isr_boycott_tt: "[ISR.GetFlag]§RСаудовский рынок закрывается для Израиля.§!"
 SAU_isr_cause_tt: "[PAL.GetFlag]§HКоролевство связывает свой престиж с Палестиной и гарантирует свое выживание.§!"
 SAU_isr_collapse_tt: "[ISR.GetFlag]§RПереговоры завершены. Путь отказа открывается, и позиция Королевства ужесточается.§!"
 SAU_isr_cond_tt: "[ISR.GetFlag]§YЭр-Рияд предлагает начать переговоры о нормализации отношений. Если Израиль согласится,§! §RОтсчет 120-дневного срока начинается немедленно.§! Израиль должен принять условия Арабской мирной инициативы, а также еще один вариант, прежде чем она закончится."
 SAU_isr_consensus_tt: "[ISR.GetFlag]§H Лига арабских государств ужесточает свою позицию по отношению к Израилю единым блоком.§!"
 SAU_isr_double_down_tt: "[PAL.GetFlag]§HСаудовские деньги и влияние поступают в Палестину.§!"
 SAU_isr_fail_tt: "§RНа все три пути были даны ответы, и Израиль либо отверг решение о двух государствах, либо согласился на слишком меньшие условия.§!"
 SAU_isr_fate_tt: "[PAL.GetFlag]§HПалестина будет восстановлена под покровительством Саудовской Аравии, и Эр-Рияд гарантирует ее восстановление в случае, если мирное соглашение не будет подписано.§!"
 SAU_isr_pressure_tt: "§HАрабские столицы ощущают на себе влияние Эр-Рияда и встают на его сторону.§!"
 SAU_isr_question_tt: "§YОткрывает три пути в отношениях с Израилем: безоговорочная нормализация, нормализация в обмен на создание палестинского государства или отказ.§!"
 SAU_isr_rally_tt: "[ISR.GetFlag]§HВсе столицы Лиги арабских государств охлаждают свои чувства по отношению к Израилю.§!"
 SAU_isr_refuse_tt: "[PAL.GetFlag]§HКоролевство публично запрещает нормализацию отношений. Палестина знает, кто её поддерживает.§!"
 SAU_isr_resistance_tt: "§HНаша поддержка палестинских фракций усиливается. Решения по вопросам, касающимся ополчений, остаются в нашем распоряжении.§!"
 SAU_isr_success_tt: "§G Все три варианта ответа получены. Израиль принял Арабскую мирную инициативу (решение о двух государствах на границе 1967 года) и принял как минимум еще один вариант.§!"
 SAU_isr_talks_alive_tt: "§RПереговоры с Израилем не провалились.§!"
 SAU_isr_talks_dead_tt: "§RПереговоры отвергаются еще до начала. Остается лишь путь к краху.§!"
 SAU_isr_track_opened_tt: "Открывает трек нормализации §Y§! с Израилем"
 SAU_isr_track_tt: "[ISR.GetFlag]§YИзраиль оценит наш подход и даст ответ.§!"
 SAU_isr_trade_tt: "[ISR.GetFlag]§HТорговое соглашение и перекрестные инвестиции с Израилем.§!"
 SAU_isr_uncond_tt: "[ISR.GetFlag]§RМы признаем Израиль без каких-либо условий. Отношения и торговля открываются немедленно. §!§RАрабский мир называет это предательством, и наши улицы с этим согласны.§! §YЗакрывает всякую поддержку палестинских ополчений.§!"
 SAU_isr_unlock_backchannel_tt: "§HНаши дипломаты готовят почву в третьих столицах. Израиль с большей вероятностью примет неофициальный канал связи.§!§G+10§!§H).§!"
 SAU_isr_unlock_price_tt: "§HКоролевство заручается поддержкой арабских и международных стран для этой инициативы. Израиль с большей вероятностью примет предложенный арабской мирной инициативой курс.§!§G+10§!§H).§!"
 SAU_isr_unlock_sweeten_tt: "§HИнвестиционный пакет составлен детально. Израиль с большей вероятностью примет вариант «Улучшение условий сделки» (§!§G+10§!§H).§!"
 SAU_isr_us_mediation_tt: "§HВашингтон присоединяется к переговорам в качестве гаранта. Израиль заметно чаще соглашается на каждый из предложенных вариантов.§!"
 SAU_junta_crisis_restore_tt: "Восстановите статус Совета до §H20§! до истечения времени."
