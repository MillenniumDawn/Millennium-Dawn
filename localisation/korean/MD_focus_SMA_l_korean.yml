 SMA_build_ii: "골조 건설"
 SMA_build_iii: "내부 설비 및 기술"
 SMA_build_final: "건설 완료"
 john_died_sma: "요한 바오로 2세 서거"
 SMA_change_textbooks: "교과서 수정"
 SMA_change_textbooks_desc: "산마리노는 위대한 나라입니다!\n하지만 우리의 역사는 애국심을 기르기에 적합하지 않으며, 일부 세부 내용은 별로 효과적이지 않습니다. 그러니 조금 바꿔 보는 것이 어떨까요?"
