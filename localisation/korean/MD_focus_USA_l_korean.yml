l_korean:
 USA_continue_space_efforts: "우주 프로그램 재활성"
 USA_continue_space_efforts_desc: "거의 60년 전, NASA는 아폴로 11호를 발사했고, 달에 처음으로 사람을 성공적으로 착륙시키며 우주 경쟁에서 승리했습니다. 그 후, 우리 미국인들은 우주가 경이로움을 잃자 안일하게 여겼습니다. 더 이상! 우리의 노력을 재개하고 마지막 개척지에서 더 나아갈 때입니다."
 USA_finance_nasa: "NASA 자금"
 USA_finance_nasa_desc: "NASA는 우리를 달에 보내고, 인공위성을 쏘아 올리고, 태양계와 깊은 우주에 탐사선을 보내고, 화성에 탐사선을 착륙시켰습니다. 부족한 것은 우주 탐사에 대한 꿈을 마침내 실현시킬 수 있는 정부의 주요 자금뿐입니다."
 USA_finance_private_space_ventures: "민간 우주 산업에 자금조달"
 USA_finance_private_space_ventures_desc: "SpaceX와 같은 민간 기업은 비용을 절감하고 우주 여행의 효율성을 높이는 엄청난 능력을 보여주었습니다. 우주의 미래는 개인적인 것입니다."
 USA_asteroid_mining: "소행성 채굴"
 USA_asteroid_mining_desc: "소행성은 우리가 국내에서 부족한 것들인 금, 백금, 이리듐과 같은 희귀한 희토류 금속과 같은 지구상에서 추출하기 어려운 많은 물질을 포함하고 있습니다. 소행성을 지구 궤도에 옮기는 것에는 엄청난 노력이 필요할 것이지만, 보상은 우리의 상상을 뛰어넘을 것입니다."
 USA_establishment_of_the_space_force: "우주군 창설"
 USA_establishment_of_the_space_force_desc: "왜 우리는 우주군이라 부르지 않았을까요? 그건 훨씬 더 나은 명칭이었을 것입니다."
 USA_launch_pad_in_brazil: "브라질의 발사대"
 USA_launch_pad_in_brazil_desc: "로켓은 믿거나 말거나, 유용한 일을 하기 위해선 우주에 가야합니다. 적도에서 로켓을 발사하는 것은 플로리다에서 발사하는 것보다 훨씬 좋습니다. 우리는 궤도에 진입하는 것을 훨씬 쉽게 만들기 위해 지구의 자전에 따른 추가적인 관성을 이용할 수 있기 때문입니다. 최근 브라질에서 이렇게 할 수 있는 기회가 생겼습니다."
 USA_weaponized_space: "우주 병기"
 USA_weaponized_space_desc: "레이져 위성...좋군!"
 USA_space_marines: "우주군"
 USA_space_marines_desc: "군복무로 시민권을 보장해줍니다!"
 USA_mission_to_mars: "화성 탐사 임무"
 USA_mission_to_mars_desc: "화성에 사람을 착륙시키는 것은 수년, 수십년 동안 우주애호가들의 꿈이었습니다. 화성은 이제 우선 순위 중 하나입니다."
 USA_revisit_the_moon: "달에 재방문"
 USA_revisit_the_moon_desc: "사람이 달에 마지막으로 발을 디딘 것은 1972년이었습니다. 그 곳에 새 발자국을 새기는 건 어떻습니까? 우리를 막는 것은 무엇이죠?"
 USA_lunar_outpost: "달의 전초기지 건설"
 USA_lunar_outpost_desc: "달 기지를 건설하는 것은 현재 충분히 가능합니다. 그렇긴 하지만, 달에 기지를 세우고 유지하는 것은 여전히 세계가 직면한 가장 큰 기술적 난제일 것입니다. 그리고...그것은 달 착륙을 막지 못했습니다. 그렇죠?"
 USA_patriot_act_idea: "애국자법"
 USA_economic_crisis_severe_idea: "심각한 금융 위기"
 USA_economic_crisis_severe_idea_desc: "경제 침체에 대한 입법부의 대응 정책이 수포로 돌아가면서 심각한 불황을 초래하고 있습니다. 우리 경제가 이전 상태로 회복하기 까지는 엄청난 시간이 필요할 것으로 보입니다."
 USA_economic_crisis_medium_idea: "점진적인 금융 위기"
 USA_economic_crisis_medium_idea_desc: "비록 입법부에서 신중히 대응하고 있으나 그럼에도 급속도의 침체는 불가피할 것으로 보입니다. 원 상태로 돌아가기 위해선 정치적인 역량을 집중하며 상태를 안정화시킬 수 있도록 힘써야할 것입니다."
 USA_economic_crisis_light_idea: "소규모 금융 위기"
 USA_economic_crisis_light_idea_desc: "The series of economic events which negatively impacted the stock market has caused a minor scare. While it's nothing too serious if we don't deal with it, it may compound problems down the road."
 usa.2.t: "USS 콜 폭탄테러"
 usa.2.d: "2000년 10월 12일 알 카에다 테러리스트 2명이 이지스구축함 USS 콜(DDG-67)을 공격했습니다. 예멘의 항구에 있었던 콜은 왼쪽 측면의 폭발로 인해 19명의 사망자와 39명의 부상자가 발생했습니다. 지난 몇년에 걸쳐 미국 판사들은 수단 정부 내에서 이 공격과 관련있는 이슬람주의자들을 찾아냈습니다."
 usa.2.o1: "19명의 군인들이 모두 안식에 잠들길.."
 usa.2.o2: "Demand Compensation for the Damages!"
 usa.2000.t: "미국의 상환 요구"
 usa.2000.d: "The United States demands we pay them back from the recent USS Cole Bombing. They cite our country's Muslim Population.\n\n How should we proceed?"
 usa.2000.o1: "미국에 지불"
 usa.2000.o2: "알라의 뜻이라면!"
 usa.2001.t: "[FROM.GetName] Pays Damages"
 usa.2001.d: "[FROM.GetName] has paid the United States $250 million to repair and refit the USS Cole after the bombing.\n"
 usa.2001.o1: "멋지군"
 usa.2002.t: "[FROM.GetName] Refuses to Pay for Damages"
 usa.2002.d: "[FROM.GetName] states they had nothing to do with the USS Cole Bombing. They have stated many times that they are not to blame for the damages caused to the USS Cole. [FROM.GetName] is beginning to make accusations that we are just out to get them. Pfft, why would we be out to get them?\n"
 usa.2002.o1: "실망스럽게도 전 새로운 차가 필요했습니다."
 usa.3.t: "남부 일리노이 사건"
 usa.3.d: "In the early morning hours of January 5th, 2000, several individuals across the towns of Highland, Dupo, Lebanon, Shiloh, Summerfield, Millstadt and O'Fallon, all in Illinois, reported the sighting of an unidentified flying object of triangular shape and dark color, later called the 'St. Clair Triangle'. These reports were also confirmed even by five on-duty police officers across the region.\n\nThe aircraft, which made no sound and was reportedly massive in size, operated at treetop level altitude and was spotted several times between 4:00 and 5:00 in the morning.\n\nThe incident has once more fueled conspiracy theories about secret U.S. Air Force projects or, depending on the conspiracy theorist, an alien invasion or alien control of several world leaders, including the U.S. President [USA.GetLeader]."
 usa.3.o1: "참 무섭기라도 해라"
 usa.4.t: "마이크로소프트가 비지오를 인수하다"
 usa.4.d: "마이크로소프트는 1975년에 설립된 이후 계속 확장해왔습니다. 윈도우 NT 4.0과 윈도우 98 운영체제를 갖춘 마이크로소프트는 가정용 컴퓨터 시장을 지배했고 언제나 외부 의견 수집과 통제하는 컴퓨터 프로그램의 양을 늘려 더 이상 마이크로소프트가 아니면 출시할 수 없는 세상을 만들고 있습니다.\n\n이러한 확장의 대상 중 하나는 시애틀에 본사를 둔 비지오 주식회사인데, 비지오 주식회사는 1999년 9월에 마이크로소프트에 인수되었다고 처음 발표되었습니다. 마이크로소프트는 비지오가 기업 관리자, 경제 전문가 및 제품 디자니어를 위한 차트, 그래프 및 기타 데이터를 시각화하는 것에 대한 프로그램의 평가를 충족했습니다. 2000년 1월 7일에 마무리될 인수에 대해 15억 달러를 지불한 마이크로소프트는 비지오 합병으로 전문가들과의 입지를 강화하기를 희망하고 있습니다."
 usa.4.o1: "경제에 유익한 것은 세금면에서도 유익하다"
 usa.4.o2: "이건 적대적 인수다! 당장 막아라!"
 usa.5.t: "AOL이 타임워너와 합병하다"
 usa.5.d: "Through an exchange of various stocks as well as financial investments and purchases worth an overall 162 billion U.S. Dollars, the company America Online (or AOL for short) has integrated TimeWarner Incorporated into the AOL conglomerate in a process that was finished on January 10th, 2000.\n\nThis merger of the two mega-corporations is the financially largest corporate merger in not only American history, but in human history. The fusion, which is to be made official through a formal merge of both companies into one (AOL TimeWarner Inc.) on February 11th, potentially marks a new age of the American economy."
 usa.5.o1: "아주 멋진 소식이군!"
 usa.5.o2: "이건 노동자들에 대해 적대적 행위이다!"
 usa.6.t: "[GetDateText] 북아메리카의 폭풍"
 usa.6.d: "[GetDateText] 현재, 서대서양에서 서서히 커지고 있던 눈보라가 버지니아 주에 상륙하여 리치먼드를 포함한 지역들의 산업시설과 교통을 쑥대밭으로 만들었습니다. 폭풍은 버지니아에서 북쪽으로 향했고, 펜실베니아와 뉴저지를 강타한 뒤, 뉴 잉글랜드를 지나 1월 30일 캐나다 동부지역에서 소멸되었습니다."
 usa.6.o1: "상관없는 일이다."
 usa.6.o2: "가능한 한 지원을 모두 보내라!"
 usa.7.t: "엘리아 곤잘레스 사건"
 usa.7.d: "오늘 미국 검찰 총장인 '자넷 레노'는 어린 쿠바 소년 '엘리아 곤잘레스'의 운명에 관한 결정을 내려야 합니다.\n\n곤잘레스는 쿠바에서 미국으로 도망가는 위험한 도박을 하다가 어머니를 익사로 잃어버렸고, 현재 친척들과 함께 플로리다에 거주하고 있습니다. 하지만 이 어머니는 공산주의로부터 탈출하려고 했을 뿐만 아니라, 쿠바에 있는 그녀의 남편에게서 도망 치려고 했었습니다.\n\n미국과 쿠바 양쪽의 관점에서 보자면 어린 소년을 돌려보내기 위해 법에 따를 것이라는 입장은 의심의 여지가 없습니다. 허나 여기엔 도덕적이면서도 정치적인 의미가 존재합니다. 우리가 이 소년을 공산주의의 억압에 맡겨야 할까요? 아니면 민주당에 대한 쿠바의 지지를 위태롭게 만드는 걸 감수해야 할까요? 만약 미국에 남게 만든다면 다음 선거에서 부시가 이길 확률이 높아집니다.\n\n이제 이 문제는 레노의 판단으로 결정될 것입니다."
 usa.7.o1: "쿠바로 돌려보내라. 그게 옳다"
 usa.7.o2: "빨갱이가 될바엔 죽는게 낫다! 미국에 머물게 하라!"
 usa.7.tt: "공격이 실패할 가능성이 있다."
 usa.9.t: "알래스카 항공 261편 추락사고"
 usa.9.d: "2000년 1월 31일 멕시코의 푸에트로 바야르타에서 미국 시애틀로 가는 'MD-83'기종의 항공기가 캘리포니아 연안 아나카파 섬에서 북쪽으로 약 3마일 떨어진 바다에 추락했습니다.\n\n부적절하고 엉성한 정비유지로 인해 발생한 이 재난은 승객과 83명과 승무원 5명 전원을 사망케 했습니다. 사망자중에는 작가 '장 간데스베리', 알래스카 원주민 지도자인 '모리스 톰슨' 그리고 라디오 토크쇼 진행자인 '신시아 오티'가 포함되어 있습니다."
 usa.9.o1: "비극적이군.."
 usa.10.t: "'피너츠'만화 완결"
 usa.10.d: "만화계의 거장 찰스 M.슐츠의 죽음은 2000년 2월 12일 전설의 끝과 한 시대의 종말을 알렸습니다. 미니애폴리스 출신의 슐츠는 50년 넘게 '피너츠'만화 스케치를 그렸으며, '피너츠'의 등장인물 대부분은 물론, TV 대본 또한 그렸습니다. 총 17,800개가 넘은 만화인 '피너츠'는 역사상 가장 오랫동안 연재된 만화작품이었습니다. 슐츠의 죽음 다음날에 '피너츠' 마지막화가 신문에 실렸습니다.\n\n슐츠의 죽음은 팬들과 열정적인 신문 구독자들과 마찬가지로 이 나라를 슬픔에 빠뜨리고 있습니다. 비록 이 만화는 슐츠의 소망처럼 계속되긴 어려우나, 17,800개의 만화를 신문에 다시 싣는 것은 가능합니다."
 usa.10.o1: "편히 잠드소서"
 usa.10.o2: "만들 돈은 충분하다!"
 usa.11.t: "카일라 롤랜드의 총격사건"
 usa.11.d: "미시간 주의 'Buell' 초등학교에 다니는 6살 학생인 카일라 롤랜드는 자신의 친구 데드릭 오언스에 의해 치명적인 총격을 받았습니다. 데드릭이 카일라에게 사격을 가하기 직전, 교사와 22명의 학생 앞에서 '난 너가 싫어'라고 말한뒤 팔을 사격했습니다. 총알은 동맥을 관통했으며, 엄청난 출혈을 일으켰고, 결국 어린소녀는 10시 30분에 사망했습니다. 카일라 롤랜드는 미국 역사상 가장 어린 학교총격사건의 희생자로 기록될 것입니다."
 usa.11.o1: "6살 아이가..? 6살 아이가 친구를 쏴죽였다고?!"
 usa.12.t: "2000년 필립스 폭발사고"
 usa.12.d: "[GetDateText], 텍사스 주 패서디나에 있는 필립스 석유회사의 휴스턴 화학단지에서 폭발이 발생했습니다.\n\n폭발과 이어진 화재로 화학 공장에서 1명이 사망하고 71명이 화상을 입거나 독성 연기를 흡입하여 부상을 입었습니다.\n\n사망자는 45세의 감독관 '로드니 고트'로, 그는 1989년에 발생한 첫 필립스 사고에서 살아남았던 자입니다. 그는 폭발 직후 사람들을 구하기 위해 불타고 있는 공장에 남았고, 끝내 건물의 지붕이 붕괴하여 그 밑에 있던 고트를 압사시켰습니다."
 usa.12.o1: "사고는 흔한 일이다"
 usa.12.o2: "철저한 조사를 시작하라"
 usa.15.t: "포트워스 토네이도"
 usa.15.d: "[GetDateText] 저녁, 후지타 F3등급의 강력한 토네이도가 텍사스 주 포트워스의 중심부를 강타했습니다.\n\n시간당 약 135마일의 속도로 이동하면서, 토네이도는 눈앞에 있는 모든 것을 폐허로 만들었습니다. 4억 5천만달러에 달하는 피해가 발생했으며, 2명이 사망하고 80명이 부상당했습니다."
 usa.15.o1: "재난에서의 회복은 필수적이다"
 usa.15.o2: "Mobilize Disaster Relief"
 usa.16.t: "동아시아 군사지원 계획"
 usa.16.d: "미군 사령관들은 미 정부가 곧 동아시아 군사지원 계획을 시작할 것이며, 그로 인해 우리들이 혜택을 누릴 것이라 발표했습니다. 우리 장군들과 장교들은 새로운 교리,조언,훈련을 수용해야 합니다."
 usa.16.o1: "기꺼이 도움을 받지."
 usa.16.o2: "필요 없다!"
 usa.17.t: "미국 좌파주의의 증가"
 usa.17.d: "미국의 젊은이들은 민주적 사회주의 정부가 있는 유럽 연합과 그 나라들을 바라보고 있습니다. 그들은 개정된 버전의 미국 시스템을 지지하고 있습니다."
 usa.17.a: "새로운 좌파인가?"
 usa.18.t: "제 3의 정당이 지원을 받는다"
 usa.18.d: "공화당과 민주당은 의회에서 참호전을 벌이며 서로를 비방하느라 바쁩니다. 그사이 젊은이들은 양당 체제를 벗어날 대안과 방법을 찾고 있습니다. 지금까지의 희망은 모두 허사였지만, 이번에는 아닐지도..?"
 usa.18.a: "새로운 대안인가?"
 usa.19.t: "전통주의의 증가"
 usa.19.desc: "미국의 파벌들은 전통주의를 받아들이기 시작했습니다. 그들은 더 단순한 시대로 돌아가기 위해 세뇌된 생각을 압박하기 시작했습니다. 그러나 더 극우적인 생각들을 논의하고 있는 사람들도 있습니다."
 usa.19.a: "우파의 증가"
 usa.20.t: "반세계화 시위!"
 usa.20.d: "Anti-Globalization forces, typically leftist in nature, rallied today in several major cities protesting the IMF, the World Bank, and international capitalism as a whole. Their protesting has also paved the way for several other parties to get involved including nationalists, progressives and the everyday political activist."
 usa.20.o1: "기득권층이 제일 잘 알거다"
 usa.20.o2: "환경보호론자들이 더 잘 알고 있을거다"
 usa.20.o3: "The Nationalists Make a Good Point."
 usa.21.t: "현 체제의 강화"
 usa.21.d: "The Status Quo in the United States has kept the country's government moderate and tolerant. It is important that this status quo is maintained and the establishment is reinforced. Many politicians have recently been speaking up about how wonderful the current establishment is. Let's keep it going!"
 usa.21.a: "현 체제의 강화"
 usa.22.t: "연방보안국이 엘리안 곤살레스를 체포하다"
 usa.22.d: "Elian Gonzalez and his family have made it to the USA. However, in a premeditated raid Elian Gonzalez has been seized by Federal Agents and extradited to Cuba. The choice has been very unpopular with Democrats and some Republicans as well. Vice-President Al Gore has also stated that the decision was a mistake. Although, it has improved diplomatic ties with one of our Southern neighbors. It has yet to be seen if it's the right choice...\n"
 usa.22.o1: "법은 최선을 알고 있다."
 usa.23.t: "Elian Gonzalez Eludes Capture"
 usa.23.d: "Elian Gonzalez and his family have made headlines today with news of them eluding capture from Federal Agents. The Federal Agents are currently looking for the family to try and return them to Cuba. However, they still remain at large at this time.\n"
 usa.23.o1: "유감이군"
 usa.32.t: "미국 vs 마이크로소프트"
 usa.32.d: "Microsoft, arguably one of America's most important employers and paragons of technological and social progress, has been in the crosshairs of government prosecutors due to its allegedly unfair and monopolistic business practices.\n\nOpened on May 18th, 1998, the court has heard various witnesses, including Microsoft founder Bill Gates, Microsoft vice president Paul Maritz, vice president of Intel Steven McGeady and others.\n\nThe charge against Microsoft is a violation of the 1890 Sherman Antitrust Act through the attempt of becoming a monopoly in the software and hardware computer markets, particularly due to the fact that Microsoft bundled the Microsoft-made web browser \"Internet Explorer\" with its operating systems, thus decisively winning the \"Browser Wars\" between competing web browser operators without a fair fight.\n\nNow, on [GetDateText] the presiding judge Thomas Penfield Jackson, who already laid down the findings of fact that Microsoft had established an illegal monopoly over x86-based personal computer operating systems on November 5th, 1999, is about to hand down his conclusions of law, which will mark the verdict to determine the rest of the court case's proceedings."
 usa.32.o1: "유죄다!"
 usa.32.o2: "무죄다!"
 usa.33.t: "계속되는 마이크로소프트의 성장"
 usa.33.d: "'미국 대 마이크로소프트'의 법정 소송의 '무죄' 판결에 이어, 마이크로소프트는 미국 전역에서 회사를 계속 확장하고 있습니다. 거인은 계속 소기업을 흡수하고 확장하고 있습니다. 독점은 더 커졌고 우리는 지금 이 것을 깰 수 있습니다. 하지만 그들은 많은 일자리를 창출했고 기술 산업의 성장을 도왔습니다."
 usa.33.o1: "글쎄, 적어도 그건 좋은거 같은데."
 usa.34.t: "마라나 해병대 참사"
 usa.34.d: "[GetDateText]에서 미 해병대 소속 MV-22 오스프리 군용기가 애리조나 마라나의 공항 상공에서 추락해 탑승 중이던 미 해병대 19명이 사망했습니다.\n\n 이 사건으로 오스프리의 전투 준비태세와 미 해병대의 장비에 관한 논의가 재개되었습니다.\n"
 usa.34.o1: "항상 충실하게"
 usa.35.t: "데이터포인트 파산"
 usa.35.d: "원래 컴퓨터 터미널 코퍼레이션 또는 줄여서 CTC로 알려진, 데이터포인트 코퍼레이션은 1968년 7월에 설립되어 텍사스 주 샌안토니오에 본사를 두고 있는 컴퓨터 회사입니다.\n\n이 회사의 첫 번째 제품은 컴퓨터 단말기였지만, 이후 마이크로프로세서, 컴퓨터 칩, 그리고 마침내 일부 과학사학자들이 최초의 개인용 컴퓨터라고 부르는 '데이터포인트 2200'으로 사업을 확장했습니다.\n\n1970년대 내내 호황을 누렸던 이 회사는 1980년부터 쇠퇴하기 시작했습니다. 1984년 기업 매수자 애셔 에델만(Asher B. Edelman)에 의해 적대적으로 인수된 후, 회사는 피해를 영구적으로 회복하지 못했고 1980년대 후반과 1990년대에 걸쳐 정리해고와 사업 부진 등 고통스러운 시기를 보내게 됩니다.\n\n마침내 [GetDateText]에, 데이터포인트는 챕터 11 파산 신청을 했습니다. 회사는 자체적으로 더 나은 성과를 낼 수 있는 3개의 후속 회사로 분할될 예정입니다."
 usa.35.o1: "자유 시장의 힘"
 usa.35.o2: "안된다! 벗어나라!"
 usa.36.t: "H. L. 헨리"
 usa.36.d: "남부 연합군의 조선 공학자 호레이스 로슨 헌리의 이름을 딴 헌리함은 1863년 7월에 취역한 남부 연합군 잠수함입니다(CSS H. L. 헌리). 헌리함은 미합중국 해군의 슬루프선 USS 후사토닉함을 격침, 인류 역사상 최초로 적 함선을 성공적으로 격침 시킨 잠수함이 됐습니다.\n\n헌리함은 후사토닉함을 격침시키는 과정에서 장교와 7명의 승무원들과 함께 침몰했습니다.\n\n이 함선은 1995년 침몰 위치가 특정 되기 전까지 소실된 것으로 간주됐습니다. 그리고 마침내, 2000년 8월 8일 선박을 인양하였습니다. 헌리함의 승조원들은 마침내 제대로된  장례를 치를 수 있게 됐습니다."
 usa.36.o1: "성공적인 작전이다"
 usa.37.t: "애플의 Mac OS X (맥 OS X)"
 usa.37.d: "'Kodiak' 이라는 코드명을 가진 애플의 새로운 운영체제인 'Mac OS X' 의 베타 버전이 2000년 9월 13일에 개발자들에게 배송되기 시작했습니다.\n\n애플은 마이크로소프트 윈도우 2000과 잠재적으로 곧 출시될 업계 표준인 \"마이크로소프트 윈도우 XP\"에 맞서 운영 체제 시장에서 살아남기 위해 필사적으로 노력하고 있습니다. 이미 좁은 시장에서의 경쟁은 미국 소비자들에겐 이익이 될 수밖에 없습니다."
 usa.37.o1: "또 한번의 지각변동이 시작되는군."
 usa.37.o2: "애플의 OS는 불법이다!"
 usa.38.t: "마틴 지역의 석탄 슬러리 유출 발견"
 usa.38.d: "News sources from Martin County, Kentucky report that the bottom of a coal slurry impoundment broke into an underground mine. The thin, sloppy, and poisonous mud subsequently emerged to the surface and the 300 million gallons of sludge made its way downstream. The local governments and municipalities have tried their best to contain it. The Ohio River and her tributaries are now equally drowned out with the black sludge.\n\nShould the EPA intervene or can the local authorities handle it?"
 usa.38.o1: "연방 정부가 처리할 문제다"
 usa.38.o2: "지방 당국이 처리할 수 있을 것이다."
 usa.39.t: "위키피디아"
 usa.39.d: "아마도 인터넷 역사상 가장 야심찬 프로젝트 중 하나인 'Wikipedia'는 2001년 1월 15일에 만들어졌습니다.\n\n온라인 백과사전은 수많은 주제에 대한 수많은 출처의 지식을 수많은 사람들에게 무료로 제공하는 것을 목표로 합니다.\n\n그러나 정보는 힘입니다. 전 세계의 전체주의자들은 Wikipedia가 약속하는 '정보에 대한 자유로운 접근' 전체를 인정하지 않을 것입니다. 웹사이트 제작자인 Jimmy Wales와 Larry Sanger는 Wikipedia를 광고 없이 오로지 사용자 기부금으로만 구성된 비영리 사업 형태로 유지할 것을 약속했습니다.\n전세계적으로 그리고 미국에서 정보를 확장하기 시작하는 것은 정말로 좋은 아이디어이고 훌륭한 방법입니다."
 usa.39.o1: "정보의 자유"
 usa.53.t: "셰퍼드타운 평화 협의"
 usa.53.d: "In a renewed push to relax tensions between Israel and Syria, especially over the Golan Heights and the unforgiving stances of the two governments against each other, the United States had invited both countries to talks of relaxation in Shepherdstown, West Virginia.\n\nOur delegation, led by Foreign Minister Farouk a-Shara, has safely arrived in West Virginia, on what some Syrians consider hostile American territory, and is willing to begin working."
 usa.53.o1: "평화가 올 기회가 있을까?"
 usa.60.t: "거스 할 (Gus Hall)의 죽음"
 usa.60.d: "거스 홀은 1959년부터 2000년 초까지 40년이 넘도록 미국 공산당의 총서기를 지냈으며, 2000년에 샘 웹에게 자리를 물려주고 명예 의장이 되었습니다.\n\n1972년, 1976년, 1980년, 1984년에 미국 대통령 선거에 출마했으나(매번 참패했습니다), 홀은 소련의 헌신적인 친구였으며 미국이 소련 블록에 편입됨으로써 냉전을 끝내야 한다고 늘 주장했습니다.\n\n홀의 아버지는 이미 평생 공산주의자이자 미국 공산당의 창립 당원이었고, 홀은 1927년에 청년 공산주의자 동맹에 가입하여 1931년부터 1933년까지 모스크바에서 공부하는 것을 허락받았습니다. 아르보 쿠스타 할베리라는 이름으로 태어난 홀은 공산주의자들의 취업을 매우 어렵게 만든 미국 정부의 블랙리스트를 피하려고 1930년대에 이름을 바꾸었습니다.\n\n홀은 소련 지도부에 대한 노예와도 같은 복종 덕분에(그의 정치적 견해는 모스크바의 견해가 바뀔 때마다 바뀌었습니다) 계속해서 미국 공산당 내에서 승진했습니다."
 usa.60.o1: "속이 다 시원하군."
 usa.60.o2: "그의 업적을 기리라."
 usa.63.t: "'거스 할' 주"
 usa.63.d: "With communists in power, it is time to consider changing some of the reminders of American Imperialism. A state and our great capital are named for a piece of slave-owning imperialistic scum. But there is a solution; Exchange the founder and first leader of the fake American capitalistic state with the patron saint of the American Communist Party. Gus Hall who passed away recently. The name is quite clearly a wonderful choice for a city name! Furthermore, there are tons of other cities and states which could use a renaming. North Carolina could become Vladimir after Lenin. There are so many possibilities and only fifty states!"
 usa.63.o1: "훌륭한 생각이다!"
 usa.63.o2: "그럴 필요는 없다"
 usa_news.18.t: "USS 콜 사건"
 usa_news.18.d: "미 해군 사령부는 오늘 미국의 알레이버크급 이지스 구축함 'USS 콜'이 알 카에다에 의해 자폭공격을 받았으며, 17명의 군인이 순직했다고 발표했습니다. 미국 정보기관은 수단의 정부가 이 자폭범들을 지원했을 가능성이 있다고 지적했습니다."
 usa_news.18.o1: "그들은 이를 후회할 것이다"
 usa_news.18.o2: "미국에 애도를 표하라."
 usa_news.18.o3: "미국인이 죽었다고? 좋아.."
 usa_news.18.o4: "그들이 우릴 비난한다고?!"
 usa_economic_nationalize_tt: "사업을 국유화하는 것은 제일 §Y비용§!이 많이 들지만, 이를 통해 경제를 더욱 §Y안정화§!시킬 수 있을 것입니다.\n"
 usa_economic_bailout_tt: "회사를 구제하는 것은 국유화하는 것보단 적은 §Y비용§!이 들지만, 그러나, §Y안정화§!의 정도가 줄어들것입니다.\n"
 usa_economic_donothing_tt: "아무것도 하지 않는다면 경제가 붕괴되겠지만, 그러나, 비교적 빠른 시일 내에 원래 상태로 회복될 것입니다.\n"
 usa_economic_events.1.t: "리먼 브라더스의 파산!"
 usa_economic_events.1.d: "[GetDateText]에 리먼 브라더스가 파산을 선언했습니다. 그 회사는 미국 역사상 가장 큰 파산 신청으로 역사를 만들고 있는 Chapter 11 파산을 신청했습니다. 리먼 브라더스가 보유한 자산은 6천억 달러로 추정되고 있습니다. 그들은 붕괴되고 있는 주택 시장의 첫 번째 희생자입니다. 이는 투자은행과 부동산 시장에 충격을 줄 뿐만이 아닙니다. 그것은 뉴욕 증권 거래소에서 장중 4.5%의 하락을 촉발하며 주식 시장에 충격을 주었습니다.\n\n이것이 또 다른 대공황이 될까요?"
 usa_economic_events.1.a: "국유화해라!"
 usa_economic_events.1.b: "Bail Them Out!"
 usa_economic_events.1.c: "경제 흐름이 그들을 되살려낼 수 있을지 지켜보자"
 usa_economic_events.2.t: "Fannie Mae & Freddie Mac"
 usa_economic_events.2.d: "패니메이 & 프레디 맥은 미국의 두 거대 모기지 대출업체입니다. 최근 리먼브라더스 파산이라는 충격은 금융시장 전반에 파문을 일으키고 있습니다. 모기지론 업계도 예외는 아닙니다.\n\n그 회사들은 완전히 파산 상태에 있습니다. 우리는 회사들을 위해 몇 가지 계획을 세웠습니다. 그 중 하나는 회사를 국유화하고 그들을 관리자로 두는 것인데, 근본적으론 미국 정부가 회사 재정을 완전히 통제한다는 것을 의미합니다. 하지만 이것이 우리의 유일한 해결책은 아닙니다. 우리는 또한 회사를 긴급 구제하고, 회사가 독립적으로 행동하도록 내버려둘 수도 있습니다.\n"
 usa_economic_events.2.a: "국유화 한뒤, 정부에서 후견인을 정하자"
 usa_economic_events.2.b: "구제 금융을 약속하자"
 usa_economic_events.2.c: "It's Dangerous to Play Economic God"
 usa_economic_events.3.t: "베어스턴스와 JP 모건 체이스의 합병"
 usa_economic_events.3.d: "현재의 금융 환경은 일부 기업들을 근본적으로 불안하게 만들었습니다. 그중 하나가 베어스턴스와 JP모건 체이스입니다. JP모건 경영진은 두 회사에 최선의 방안은 정부가 후원하는 양사 합병이라고 밝혔습니다.\n\n베어스턴스는 회사 전체를 주당 10달러에 매각할 용의가 있습니다. 이 가격은 베어스턴스 주식의 52주 최고가인 133.20달러에 비하면 매우 낮습니다. 바닥까지 떨어진 이 가격은 회사의 바닥난 상황을 보여줍니다.\n\n체이스가 성장하도록 허용할 것입니까?"
 usa_economic_events.3.a: "미국 재무부의 손에 베어스턴스 맡기자"
 usa_economic_events.3.b: "구제를 약속해라. 파산 직전 상태를 유지시키자."
 usa_economic_events.3.c: "자연스런 그들의 흐름에 맡기자"
 usa_economic_events.4.t: "아메리칸 인터내셔널 그룹 (AiG)"
 usa_economic_events.4.d: "아메리칸 인터내셔널 그룹(American International Group)은 일부 사람들이 대불황이라고 부르는 상황에서 몰락한 가장 최근의 주요 기업입니다. AiG는 최근 재정 문제를 해결하기 위해 민간 대출 기관을 찾았지만 [GetYear]의 경제 상황으로 인해 곧 파산에 직면하게 되었습니다. 우리에게는 AiG를 미국 정부의 통제하에 둘 수 있는 옵션이 있습니다. 회사는 문제가 있는 회사를 구하기 위해 2년 동안 이자 지급 대출을 받는 대가로 회사의 지분 79.9%를 기꺼이 제공할 의사가 있습니다. 연준은 이 계획을 정당화하기 위해 연방준비법 조항을 사용하고 있습니다.\n\n다른 옵션도 있지만 이것이 우리에게 대부분의 이익을 가져다 줄 것입니다."
 usa_economic_events.4.a: "AiG 그룹에 대출을 제공하자"
 usa_economic_events.4.b: "자본을 인정하지 않고, 자산을 담보해라. 그리고 대출을 해주자."
 usa_economic_events.4.c: "왜 그들을 구해야 하지?"
 usa_economic_events.5.t: "주택 시장의 붕괴"
 usa_economic_events.5.d: "경제에 마지막 사망선고를 내린 것은 미국 주택 시장이 붕괴됐을 때였습니다. 미국 전역의 사람들이 집을 압류 당하거나 자산이 급락했습니다. 이는 대불황에서 가장 어려운 부분 중 하나 일 것 입니다.\n어떻게 해나가야 할까요. 사람들을 도와야 할까요? 아니면 그냥 내버려 둬야 할까요?\n"
 usa_economic_events.5.a: "그대로 나둬라"
 usa_economic_events.5.b: "시민들과 가족들을 지원해야 한다"
 usa_economic_events.31.t: "무기 제조 회사들이 정부의 구제 금융을 요청하다"
 usa_economic_events.31.d: "대공황이 미국에 큰 타격을 주고 있습니다. 이로 인해 투자가 급감하고 일부 무기 제조사가 다른 곳으로 떠나고 있습니다. 그 결정은 회사를 살리기 위한 것이지만 열심히 일하는 미국인들의 일자리를 잃게 만들고 있습니다."
 usa_economic_events.31.a: "안돼!"
 usa_economic_events.32.t: "제조 업체 회사가 미국을 떠나다"
 usa_economic_events.32.d: "제조업은 미국의 빵과 버터였습니다. 사업비와 국내 투자로 인한 낮은 수익이 제조업을 해외로 내몰았습니다. 미국은 진정으로 경기 침체에 빠져 있으며 계속해서 미국 국민에게 상처를 주고 고통을 주고 있습니다."
 usa_economic_events.32.a: "더 악화될 것인가?"
 usa_economic_events.33.t: "미국 공장의 폐쇄"
 usa_economic_events.33.d: "전국의 공장들이 고통받고 있습니다. 미국 북부의 공장들이 영구적으로 문을 닫기 시작했습니다. 미국인들이 그들의 제품을 구매하지 않아서요."
 usa_economic_events.33.a: "이는 곧 끝날 것이다"
 usa_economic_events.34.t: "파업을 선언하는 미국의 회사!"
 usa_economic_events.34.d: "또 다른 미국 회사가 이 혹독한 경기 침체로 인해 파산을 선언했습니다. 그 결정은 회사가 수익이 유입되지 않아 빚을 갚을 수 없게 된 대가에서 따른 것입니다."
 usa_economic_events.34.a: "미국인들이 어려움을 겪고 있다"
 usa_economic_events.35.t: "미국 경기 침체의 종료"
 usa_economic_events.35.d: "The Federal Reserve has finally declared the worst of the recession is over. The economy is once again growing and it is no longer contracting. Its effects were widespread and felt globally. It's unfortunate that this is what we had to come to in order to continue helping our economy."
 usa_economic_events.35.a: "이제 회복할 길만 남았군"
 usa_economic_events_news.1.t: "리먼 브라더스의 붕괴"
 usa_economic_events_news.1.d1: "Yesterday, the Lehman Brothers has declared bankruptcy. The company has filed for a Chapter 11 Bankruptcy making history as the largest bankruptcy filing in American history. The Lehman Brothers holdings are an estimated $600 Billion in assets. They are the first victim of the collapsing housing market and American downturn. Not only have bankruptcies sent shock-waves through the investment banking and real estate markets. It has shocked the stock market triggering a one-day drop of 4.5% on the New York Stock Exchange.\n\nThe American government has decided it is in the best interest of the American people to nationalize the company. Bringing the company into American custodianship will help stabilize its plummeting stock and value. The Federal Reserve provided $90 billion for the company to use whilst taking an 80% equity share in the company using the company's assets as collateral.\n"
 usa_economic_events_news.1.d2: "Yesterday, the Lehman Brothers has declared bankruptcy. The company has filed for a Chapter 11 Bankruptcy making history as the largest bankruptcy filing in American history. The Lehman Brothers holdings are an estimated $600 Billion in assets. They are the first victim of the collapsing housing market and American downturn. Not only have bankruptcies sent shock-waves through the investment banking and real estate markets. It has shocked the stock market triggering a one-day drop of 4.5% on the New York Stock Exchange.\n\nThe American government has decided it is in the best interest of the American people to bail out the company. The Federal Reserve authorized up to $60 billion to keep the company afloat while the company continues to negotiate its division and sale.\n"
 usa_economic_events_news.1.d3: "Yesterday, the Lehman Brothers has declared bankruptcy. The company has filed for a Chapter 11 Bankruptcy making history as the largest bankruptcy filing in American history. The Lehman Brothers holdings are an estimated $600 Billion in assets. They are the first victim of the collapsing housing market and American downturn. Not only have bankruptcies sent shock-waves through the investment banking and real estate markets. It has shocked the stock market triggering a one-day drop of 4.5% on the New York Stock Exchange.\n\nThe Federal Reserve has declared that they would not be intervening immediately in the Lehman Brothers bankruptcy."
 usa_economic_events_news.1.a: "이보다 더 나빠질 수 있을까?"
 usa_economic_events_news.1.b: "걱정되는군..."
 usa_economic_events_news.1.c: "한심하다"
 usa_economic_events_news.2.t: "패니메이 & 프레디 맥 (Fannie Mae & Freddie Mac)"
 usa_economic_events_news.2.d1: "Fannie Mae & Freddie Mac are two giant mortgage lenders in the USA. The recent shock of the Lehman Brothers bankruptcy has caused rippling effects in the financial market as a whole. The mortgage lending industry is no exception to this.\n\nThe US Government has taken steps to effectively nationalize the company and place it within the control of the Federal Reserve. They authorized $200 billion to save these two giant mortgage lenders, in exchange the government seized control over the private, yet government-sponsored, enterprises. Each company was allotted $100 billion to prevent their bankruptcies.\n"
 usa_economic_events_news.2.d2: "Fannie Mae & Freddie Mac are two giant mortgage lenders in the USA. The recent shock of the Lehman Brothers bankruptcy has caused rippling effects in the financial market as a whole. The mortgage lending industry is no exception to this.\n\nThe Federal Reserve has given Fannie Mae & Freddie Mac up to $50 billion for each company to prevent their bankruptcies. They bailed them out for the time being in order to keep the two mortgage lenders afloat.\n"
 usa_economic_events_news.2.d3: "Fannie Mae & Freddie Mac are two giant mortgage lenders in the USA. The recent shock of the Lehman Brothers bankruptcy has caused rippling effects in the financial market as a whole. The mortgage lending industry is no exception to this.\n\nThe Federal Reserve has decided the company should be left to its devices. The chairman of the Federal Reserve has stated that it's not worth the American people's tax money to be given to failing companies.\n"
 usa_economic_events_news.2.a: "경기 침체가 악화되고 있다"
 usa_economic_events_news.2.b: "더 걱정되는걸..."
 usa_economic_events_news.2.c: "한심하기 짝이 없다"
 usa_economic_events_news.3.t: "베어스턴스와 JP 모건 체이스의 합병"
 usa_economic_events_news.3.d1: "The current financial climate has caused some companies to be inherently worried. One of those would be the Bear Stearns and JPMorgan Chase. The executive team at JPMorgan states that the best move for both companies is a government sponsored merger between the two companies.\nThe Federal Reserve responded today by placing Bear Stearns in the care of the United States government. It's another company on the list of state run companies in the United States. The nationalization process required some $50 billion to keep the faltering company afloat."
 usa_economic_events_news.3.d2: "작금의 금융 환경으로 인해 일부 기업들이 본질적인 불안에 빠져 있습니다. 그중 하나가 베어스턴스와 JP모건 체이스입니다. JP모건 경영진은 양사에 가장 좋은 방안은 정부가 후원하는 합병이라고 밝혔습니다.\n연방준비제도는 오늘 JP모건 체이스와 베어스턴스의 합병을 승인하며 응답했습니다. 이 합병은 JP모건이 베어스턴스를 인수하는 동안 재무 안정성을 확보할 수 있도록 약 300억 달러 규모의 구제금융 지원과 함께 집계되고 승인되었습니다.\n"
 usa_economic_events_news.3.d3: "작금의 금융 환경으로 인해 일부 기업들이 본질적인 불안에 빠져 있습니다. 그중 하나가 베어스턴스와 JP모건 체이스입니다. JP모건 경영진은 양사에 가장 좋은 방안은 정부가 후원하는 합병이라고 밝혔습니다.\n연방준비제도는 오늘 이 합병을 거부하며 응답했습니다. 합병이 성사되면 JP모건 체이스에 갈수록 커지는 시장 지배력을 부여하게 된다는 점이 근거로 제시되었습니다. 베어스턴스는 다른 수입원과 안정화 방안을 필사적으로 찾고 있습니다.\n"
 usa_economic_events_news.3.a: "경기 침체가 악화되고 있다"
 usa_economic_events_news.3.b: "We should start to liquidate our investments"
 usa_economic_events_news.3.c: "정말 한심하군. 우리 경제는 그 어느 때보다 강하다!"
 usa_economic_events_news.4.t: "아메리칸 인터내셔널 그룹 (AiG)"
 usa_economic_events_news.4.d1: "American International Group is the latest major company to fall from what some are calling the Great Recession. AiG recently sought out private lenders for their troubled financials, however, due to the economic climate of [GetYear] they have declared bankruptcy. The American Government issued a statement explaining that in order to keep the company afloat, the Government received a 79.9% equity share in the company giving it majority control over the company.\n"
 usa_economic_events_news.4.d2: "아메리칸 인터내셔널 그룹(American International Group)은 일부 사람들이 대불황이라고 부르는 상황에서 몰락한 가장 최근의 주요 기업입니다. AiG는 최근 재정 문제를 해결하기 위해 민간 대출 기관을 찾았지만 [GetYear]의 경제 상황으로 인해 파산을 선언했습니다. 연준은 회사의 지분을 거부하고 회사를 계속 떠들썩하게 하기 위해 이자부 대출을 허용했습니다.\n"
 usa_economic_events_news.4.d3: "아메리칸 인터내셔널 그룹(American International Group)은 일부 사람들이 대불황이라고 부르는 상황에서 몰락한 가장 최근의 주요 기업입니다. AiG는 최근 재정 문제를 해결하기 위해 민간 대출 기관을 찾았지만 [GetYear]의 경제 상황으로 인해 파산을 선언했습니다. 연준은 회사에 대한 어떠한 지원도 거부했습니다. 이제 회사는 시장의 늑대들에게 맡겨지고 있습니다.\n"
 usa_economic_events_news.4.a: "거대한 파산은 이게 정말 마지막일 것이다"
 usa_economic_events_news.4.b: "Is the worst over?"
 usa_economic_events_news.4.c: "꼴좋다. 경기가 침체되는게 오히려 좋은걸!"
 usa_economic_events_news.6.t: "대공황의 끝"
 usa_economic_events_news.6.d: "The American economy has finally turned around and is back on track. Federal Reserve estimates the recovery will take several years in order to turn around the economic damages that have been done.\nThe true effects of the American Recession have yet to be seen.\n"
 usa_economic_events_news.6.a: "The worst is over"
 usa_economic_events_news.6.b: "Let's reinvest!"
 usa_economic_events_news.6.c: "유감이군."
 USA_FOCUS.1.t: "미국의 E 여단 동유럽 배치"
 USA_FOCUS.1.d1: "미국은 크림 반도 사태를 계기로 폴란드에 군대를 배치했습니다. NATO E 여단은 비상 사태에 대비해 미국, 영국, 크로아티아, 루마니아 군대가 주둔한 상태로 폴란드에 배치됐습니다. NATO 국가들이 러시아의 확장 계획을 '효과적으로' 둘러싸고 있다는 위태로운 입장을 감안하면 흥미로운 결정입니다.\n이것은 향후 동유럽에서 이웃 국가들에 대한 러시아의 침략을 저지할 가능성이 있습니다. 러시아가 동맹국을 해치거나 압박하는 것을 막는 것이 우리의 임무입니다.\n"
 USA_FOCUS.1.d2: "미국은 크림 반도 사태를 계기로 폴란드에 군대를 배치했습니다. NATO E 여단은 비상 사태에 대비해 미국, 영국, 크로아티아, 루마니아 군대가 주둔한 상태로 폴란드에 배치됐습니다. NATO 국가들이 러시아의 확장 계획을 '효과적으로' 둘러싸고 있다는 위태로운 입장을 감안하면 흥미로운 결정입니다.\n미국인들이 다시 '우리는 동맹을 수호한다'는 카드를 쓰고 있습니다. 한심하게도요."
 USA_FOCUS.1.d3: "The United States has deployed its Armed Forces to Poland in the wake of the Crimean crisis. The NATO E Brigade was deployed to Poland with American, British, Croatian and Romanian troops stationed in case of emergency. It is an interesting decision considering the precarious stance with NATO Countries 'effectively' surrounding Russia with their expansion plans.\nWhat could this boil into?"
 USA_FOCUS.1.a: "우리는 동맹국을 도와야만 한다"
 USA_FOCUS.1.b: "American Aggression Shouldn't Be Tolerated"
 USA_FOCUS.1.c: "우리는 그녀의 의무를 기립니다."
 USA_FOCUS.1.d: "흥미롭군"
 USA_FOCUS.1.e: "미국과 함께 더 안전히"
 USA_FOCUS.2.t: "E 여단 배치"
 USA_FOCUS.2.d: "Russia has recently seized the Crimea. The very thought threatens American interests and our NATO allies greatly. Poland and the Baltic states are in the most immediate danger and their positions should be reinforced. The E Brigade is composed of American, British, Croatian, and Romanian forces. The American and British forces comprise the majority of the ground forces, with a Croatian rocket artillery battery and a Romanian air defense artillery company.\n\nOur new defensive stature should curb the Russian aggression.\n"
 USA_FOCUS.2.a: "E 여단 배치"
 USA_FOCUS.3.t: "미국의 S 여단 앙카라 배치"
 USA_FOCUS.3.d1: "튀르키예는 북대서양 조약 기구에 잔류하겠다는 의지를 거듭 확인했습니다. 이는 동맹에 대한 약속이자 이란과 러시아로부터 최근 가해지는 압력에 대한 대응입니다. 아울러 이 지역에서 서방 세력과 그 입지를 강화하는 것이기도 합니다.\n\n이 지역에 병력을 배치하면 유럽과 중동의 미묘한 세력 균형을 유지하려는 우리의 임무가 강화될 것입니다.\n"
 USA_FOCUS.3.d2: "튀르키예는 북대서양 조약 기구에 잔류하겠다는 의지를 거듭 확인했습니다. 이는 동맹에 대한 약속이자 이란과 러시아로부터 최근 가해지는 압력에 대한 대응입니다. 아울러 이 지역에서 서방 세력과 그 입지를 강화하는 것이기도 합니다.\n\n미국이 이 지역에 더 많은 병력을 배치하고 있습니다. 우리는 이 상황을 면밀히 주시해야 합니다.\n"
 USA_FOCUS.3.d3: "튀르키예는 북대서양 조약 기구에 잔류하겠다는 의지를 거듭 확인했습니다. 이는 동맹에 대한 약속이자 이란과 러시아로부터 최근 가해지는 압력에 대한 대응입니다. 아울러 이 지역에서 서방 세력과 그 입지를 강화하는 것이기도 합니다.\n\n"
 USA_FOCUS.3.a: "Better prepared than unprepared."
 USA_FOCUS.3.b: "Troubling News"
 USA_FOCUS.3.c: "동맹 강화"
 USA_FOCUS.3.d: "분쟁의 서막이 아니였음 좋겠군"
 USA_FOCUS.4.t: "S 여단 배치"
 USA_FOCUS.4.d: "The S Brigade in Ankara, Turkey will help reinforce our ally's position due to increasing tensions. Conflict in the Black Sea and in the Middle East has slowly required NATO to commit more to the region.\n\n It is time to deploy the S Brigade to Turkey to honor our obligation to support our ally.\n"
 USA_FOCUS.4.a: "Deploy the S Brigade"
 USA_FOCUS.8.t: "이란의 미사일 발사 규탄"
 USA_FOCUS.8.d: "미국은 이란의 미사일 발사를 공개적으로 비난하도록 우리에게 압력을 가하고 있습니다."
 USA_FOCUS.8.a: "그들을 비난해라"
 USA_FOCUS.8.b: "우리 문제가 아니다"
 USA_FOCUS.9.t: "샤이라트 미사일 공습"
 USA_FOCUS.9.d: "미국은 목요일에 이번 주 초 수십 명의 민간인을 죽인 화학무기 공격에 대응하여 시리아 정부 공군기지에 군사 공격을 시작했습니다. 도널드 트럼프 대통령의 명령에 따라, 화학무기 공격을 수행한 전투기들의 본거지인 공군기지에 59기의 토마호크 순항 미사일을 발사했다고 미국 관리들이 말했습니다."
 USA_FOCUS.9.a: "흥미롭군"
 USA_FOCUS.10.t: "로자바 무장"
 USA_FOCUS.10.d: "On May 9, 2017, the Trump Administration declared it was moving ahead with plans to support Kurdish rebels in northern Syria ahead of an assault on the city of Raqqa, ISIS's de facto capital in the country."
 USA_FOCUS.10.a: "하자!"
 USA_FOCUS.10.b: "Let's rethink this"
 USA_Russia_Investigation.0.t: "러시아 조사 시작"
 USA_Russia_Investigation.0.d: "James B. Comey 국장은 FBI가 2016년 대선 당시 트럼프 캠프와 러시아 당국 간의 유착 가능성을 조사 중이라고 처음으로 확인했습니다."
 USA_Russia_Investigation.0.a: "이런"
 USA_finish_keystone_and_dakota_pipelines: "키스톤과 다코다 파이프라인 완료"
 USA_finish_keystone_and_dakota_pipelines_desc: "우리는 키스톤 송유관의 완공을 목표로 노력해야 합니다. 이 핵심 경제 동맥은 미국과 캐나다 경제의 심장을 더욱 가깝게 연결할 것이며, 북미 형제 국가 간의 결속도 더욱 강화할 것입니다. 어쩌면 장래에는 남쪽의 형제와도 무언가를 할 수 있을지 모릅니다."
 USA_america_first_energy_plan: "미국인을 위한 미국 에너지 법안"
 USA_america_first_energy_plan_desc: "AEAN 법안은 국내 에너지 생산, 수출 및 소비를 직접적으로 다루는 포괄적인 법안입니다. 우리는 조정 사항을 미세 조정하여 대외 의무를 훼손하지 않으면서도 국내 수요를 더 많이 충족할 수 있기를 바랍니다."
 USA_open_public_lands_to_fracking: "셰일가스 시추 산업을 민간에 개방"
 USA_open_public_lands_to_fracking_desc: "국내뿐만 아니라 전 세계적으로 에너지에 대한 수요가 증가함에 따라 우리는 수요를 충족하고 글로벌 무대에서 경쟁력을 갖출 수 있는 새로운 방법을 모색해야 합니다. 이로 인해 에코 히피들로부터 약간의 비난을 받을 수도 있지만 결국에는 우리에게 고마워할 것입니다."
 USA_american_economic_decisions_category: "미국의 경제"
 USA_american_economic_decisions_category_desc: "The American economy is the world's largest and one of the strongest economies in the world. However, that does not mean it doesn't have its weaknesses. It is mainly service based as the majority of American businesses look elsewhere for cheaper labor. The economy is also tied-in very closely with American politics. Conducting business in America is expensive but extremely profitable. §YWall Street§! is also partially to blame. The businessmen and women in New York are some of the most powerful individuals in America. It is best to keep them in check and on the government's good side or else.\n\n§YStrength of Wall Street:§! [?USA.USA_strength_of_wall_street_var|17.0] of 50\n§YStrength of Regulations:§! [?USA.USA_economic_regulation_var|45.0] of 100"
 USA_resource_steel_factories_decision: "제철 공장 확장"
 USA_resource_steel_factories_decision_desc: "미국 철강 산업의 대부분은 지난 40-50년 동안 아웃소싱을 해왔습니다. 일부 작업을 다시 미국으로 가져와 철강 회사에 투자하는 것이 최선의 이익일 수 있습니다!"
 USA_resource_aluminimum_prospecting_decision: "보크사이트 매장지 개발"
 USA_resource_aluminimum_prospecting_decision_desc: "미국 전역의 보크사이트 매장량을 조사할 필요가 있습니다. 이 자원에 투자하는 것은 전국적으로 더 큰 자급자족을 촉진하는 데 도움이 될 수 있습니다."
 USA_resource_techmetals_prospecting_decision: "산업용 금속 자원 채굴"
 USA_resource_techmetals_prospecting_decision_desc: "Electronics require a large number of very specific materials such as lithium, gold, tungsten, and silver. We should prospect a bit more around the Rockies and Appalachians."
 USA_regulate_wall_street_decision: "월가 규제 법안 통과"
 USA_regulate_wall_street_decision_desc: "§Y월가§!는 너무 오랫동안 이득을 봤습니다. 우리는 금융 부분에 대한 규제를 개선하는 방향으로 나아가야 합니다."
 USA_deregulate_wall_street_decision: "금융 규제 철폐"
 USA_deregulate_wall_street_decision_desc: "Our regulations are currently far too tight on the financial sectors. Easing them up should improve investment from domestic and foreign investors."
 USA_industrial_outsourcing_decision: "산업적인 위탁 (아웃소싱)"
 USA_industrial_outsourcing_decision_desc: "규제로 인해 미국에서의 사업 비용은 그 가치를 훨씬 초과했습니다. 아마도 일부 아웃소싱을 장려하면 일반적으로 미국 근로자의 가격과 수요가 개선될 수 있습니다."
 USA_spurring_economic_growth_decision: "경제 성장 촉진"
 USA_spurring_economic_growth_decision_desc: "최근에 경제가 다소 침체되었습니다. 경제 성장을 촉진하기 위해 규제를 완화하거나 통화/재정 정책을 사용하는 새로운 법률을 도입해야 합니다."
 USA_bring_microsoft_to_court_decision: "마이크로소프트를 법정에 세우기"
 USA_bring_microsoft_to_court_decision_desc: "마이크로소프트는 지난 해에 제지 당하지 않고 더 작은 기술 회사들을 인수하는 것이 허용되었습니다. 일부 경제 고문들은 마이크로소프트가 더 이상 확장하지 않도록 마이크로소프트를 법정에 세울 것을 제안하고 있습니다."
 USA_expanding_alumninum_flag: "현재 §Y알루미늄§! 생산량 확대 중"
 USA_expanding_techmetals_flag: "현재 §Y산업용 금속 자원§! 생산량 확대 중"
 USA_is_territory_flag: "(은)는 §Y미국§!의 영토임"
 USA_has_wall_street_faction_TT: "국내 파벌 §Y월스트리스트§!를 가지고 있음"
 USA_not_expanded_states_resources_three_times_TT: "Has Not Expanded this §YResource§! §G3§! §YTimes§!"
 USA_deregulate_wall_street_decision_tt: "§Y월가의 위력§!이 §Y10§!보다 큼\n"
 USA_regulate_wall_street_decision_tt: "§Y월가의 규제§!가 §Y90§!보다 적음\n"
 USA_allowed_microsoft_merger: "§Y마이크로소프트§!의 합병을 허용함"
 USA_greater_than_40_regulation_tt: "§Y규제 강도§!가 §Y40§!보다 큼\n"
 USA_congress_md: "의회"
 USA_congress_md_desc: "국회의사당에는 그곳만의 규칙과 방식이 있습니다. 무언가를 해내려면 그들과 함께 해야하며, 의회의 심금을 울리고 지지를 받기 위한 여러 방법이 있습니다."
 USA_statehood_for_guam: "괌 주 지위 승인"
 USA_statehood_for_guam_desc: "§YGuam§! is another large organized territory in the §Y[USA.GetNameWithFlag]§! since 1898. Although, the statehood movement is not as large as the one in §YPuerto Rico§! it is still another viable candidate for the 51st state of the United States."
 USA_communist_state_renaming: "국명 교체"
 USA_communist_state_renaming_desc: "미국에는 수많은 것을 상징하는 수많은 주가 있습니다. 그중 일부는 우리의 위대한 아메리카 공산주의 합중국에 어울리지 않는 것들을 상징합니다!"
 donald_trump.8.t: "소행성 채굴 계획 시작"
 donald_trump.8.d: "소행성 채굴은 우리 이전의 많은 이들에게 환상이었습니다. 소행성 자체에는 매우 탐나는 백금족 금속, 금, 은, 철족 금속이 들어 있습니다. 이는 우주 진출 국가에 극도로 수익성이 높아질 수 있습니다. 그리하여 오늘 소행성 채굴 구상(AMI)이 출범하며, 소행성 채굴을 향한 첫걸음이 될 것입니다. 미국 전역의 거대한 망원경 배열을 이용해 인근 우주에서 적합한 소행성을 찾은 뒤, 이를 궤도로 끌어와 채굴할 수 있습니다. 적합한 소행성을 발견하기는 어려울 것인데, 거리에 비해 소행성이 상당히 작기 때문입니다. 다행히 때때로 지구 근처를 지나가는 소행성이 꽤 있으므로, 하나를 지구 궤도에 머물게 하는 데 오래 걸리지는 않을 것입니다."
 donald_trump.8.o1: "소행성을 기다리기만 하면 돼..."
 donald_trump.9.t: "소행성 발견"
 donald_trump.9.d: "최근, 나사의 과학자들은 지구 근처를 지나가는 적당한 소행성을 발견했습니다. 일부 사람들은 우리가 실제로 적합하고 경제적인 소행성을 발견할 수 있을지 의심했기 때문에, 이것은 AMI에게 안도감을 주었습니다. 하지만 이 소행성은 충분히 느리게 움직이고 있고, 충분히 크며, 궤도로 이동하여 채굴할 수 있을 만큼 풍부합니다. 사실 이 소행성은 뉴욕 주보다 큽니다. 다음 단계는 단순히 이 소행성을 지구 주위의 궤도로 옮기는 것인데, 이것은 이전에 해본 적이 없는 것입니다. 그 동안, NASA 엔지니어들이, 스페이스X와 같은 민간 기업들도, 소행성을 채굴하는 메커니즘을 발명하여 소행성이 궤도에 진입할 때까지 준비할 것입니다."
 donald_trump.9.o1: "소행성을 궤도에 진입시키자."
 donald_trump.10.t: "궤도에 위치한 소행성"
 donald_trump.10.d: "With the asteroid in orbit, NASA and SpaceX are both sending missions to the orbiting asteroid. NASA is mainly concerned about collecting scientific data, while SpaceX is more concerned about mining the material. No doubt this is a noteworthy achievement, which gives us an edge in space. There is even talk about bringing in more asteroids, but many say that additional asteroids can come later, as this asteroid is very large and well suited for mining. Other countries are already looking at us with envy, and are considering their own asteroid mining programs. The costs are extremely high even to develop the technology to even get there, so there is little worry among SpaceX or NASA that competition will arrive."
 donald_trump.10.o1: "채굴이 시작될 것이다."
 donald_trump.11.t: "채굴 수익이 쏟아지기 시작하다."
 donald_trump.11.d: "After establishing mining operations, SpaceX and NASA have both sent back their first shipments of space-material to labs and markets around the globe. The world has jealously looked on us, and there have been open talks in their respective chambers of legislation about opening their own asteroid mining operations. While we soon may get competition, we can enjoy the monopoly for now."
 donald_trump.11.o1: "만세!"
 donald_trump.12.t: "소행성 채굴의 이익"
 donald_trump.12.d: "우리의 소행성 채굴 작업에서 가장 최근에 선적품이 들어왔고, 많은 수익을 창출하였습니다. 이 선적품에는 플래티넘, 금, 은이 포함되어 있습니다. 수익을 잘 활용하는 것이 현명할 것입니다."
 donald_trump.12.o1: "훌륭하군!"
 donald_trump.13.t: "소행성 채굴의 잠재력"
 donald_trump.13.d: "최근, 도널드 트럼프는 나사와 민간 우주 회사인 스페이스X가 꽤 큰 소행성을 지구 궤도로 가져와 채굴하도록 허락했습니다. 우리의 조언자들은 희귀한 재료들이 우리나라로 바로 배달될 수 있기 때문에 이 새로운 공간에 투자할 것을 추천하고 있습니다. 그러나 일부 사람들은 미국이 사업을 시작하기 위해 지불해야 했던 막대한 비용을 언급하며 우주로 확장하는 것을 반대합니다. 이 투자에 대한 수익률은 상황에 따라 다르지만, 수지를 맞추기 위해서는 25년이 걸릴 수도 있습니다. 더 많은 실질적인 투자는 이것을 줄일 수 있지만, 우리는 꽤 오랫동안 미국을 뒤쳐지게 할 것입니다.\n\n소행성 채굴과 관련하여 우리는 무엇을 해야 할까요? 국가적인 프로그램을 시작할까요, 아니면 아예 무시해 버릴까요?"
 donald_trump.13.o1: "소행성 채굴에 투자해라."
 donald_trump.13.o2: "너무 비싼데다가 시간 낭비일거다!"
 donald_trump.23.t: "화성 탐사 임무"
 donald_trump.23.d: "대통령 각하, 자금이 확보되고 계획이 완료되면 화성에 도달하기 위해 우주에서의 엄청난 압박과 외로움을 견딜 수 있도록 남녀 그룹을 준비할 수 있습니다.\n\n운 좋게도, 나사는 이미 수년 동안 그러한 여행을 준비해 왔지만 전체 프로그램을 시작하기 위한 자금이 없었습니다. 현 우주비행사들의 추가 훈련과 로켓 준비가 본격화됩니다.\n\n이 과정을 완료하는 데 약 1년이 걸립니다. 그 동안 나사 연구소의 과학자들은 우주인과 함께 화성으로 보낼 과학 장비를 준비하여 로버로는 달성할 수 없는 유용한 과학 데이터를 수집합니다. 스페이스X가 발표를 듣고 먼저 사람을 보내려고 시도할 수 있음을 명심하십시오."
 donald_trump.23.o1: "준비가 시작될 것이다."
 donald_trump.24.t: "우주 경쟁"
 donald_trump.24.d: "In a recent news release, SpaceX has decided to launch its own program to get to Mars in under a year. Now, if SpaceX gets there first, it will still be an achievement that you can use for additional investment into space, however, it will be... let's just say... not as politically convenient.\n\nThis new Space Race for Mars will require additional investment if we are wanting to secure victory first, however, some experts argue that Elon Musk's program lacks certain aspects required to go to Mars with a crewed mission there and back. We may just be able to get to Mars first without assigning additional funds to NASA.\n\nWhat is your directive, Mr. President?"
 donald_trump.24.o1: "우주 경쟁이라니!"
 donald_trump.24.o2: "현재의 페이스로 계속해라."
 donald_trump.14.t: "화성 탐사 임무 준비완료"
 donald_trump.14.d: "나사는 우주 비행사, 장비 및 로켓이 준비되었다는 확인을 방금 보냈습니다. 귀환 여행으로 화성으로 향하는 6명의 특별한 우주비행사가 있습니다. 화성으로 향하는 우주비행사는 마이클, 폴, 에드워드, 로드니, 메리, 앤입니다. 이 우주비행사들은 지난 2년 동안 준비했고, 이 임무에 가장 적합한 우주비행사들입니다. 나사의 최신 우주 발사 시스템인 로켓이 발사 준비를 마쳤습니다. 캡슐인 오리온 우주 캡슐도 준비되었습니다.\n\n다행스럽게도, 다음 발사 기간은 30일 후입니다."
 donald_trump.14.o1: "발사까지 30일!"
 donald_trump.15.t: "발사대에서"
 donald_trump.15.d: "[GetDateText]:\n6명의 우주비행사가 준비되었습니다. 길고 힘든 여정이 되겠지만 그들은 준비가 되어 있습니다. 폴은 전망에 대해 유별나게 흥분한 것 같지만, 나머지 승무원들, 특히 로드니는 의지가 있기는 해도 긴장하고 있습니다.\n\n우주 비행사들은 로켓에 실려 우주로 발사될 준비를 하고 있습니다. 거의 2년 동안 그들을 직접 보지 못할 것이기 때문에, 그들은 가족과 친구들에게 작별을 고했습니다. 모두 성공적인 임무를 위해 낙관적입니다.\n\n발사가 확정된 가운데 카운트다운이 시작됐습니다."
 donald_trump.15.o1: "3, 2, 1..."
 donald_trump.16.t: "발사!"
 donald_trump.16.d: "Launch Control has certified liftoff, and the rocket and crew are heading to Mars! People's heads are towards the sky, as the rocket heads for orbit. Its crew are both ecstatic and relieved, as it's a perfect launch. Everything has worked so far, and there is much hope that it will continue to work for months to come.\n\nThe dream is near complete."
 donald_trump.16.o1: "역사의 기쁜 순간이다"
 donald_trump.17.t: "재난이 닥쳤다!"
 donald_trump.17.d: "로켓이 폭발했습니다!\n\n재난을 막기 위한 필수적인 마지막 점검이 미흡했다는 것이 밝혀졌습니다. 마이클, 폴, 에드워드, 로드니, 마리, 그리고 앤, 이 여섯 명의 승무원 모두가 이 재앙으로 사망했다고 보도되었습니다. 지상에 있던 관중들은 불길이 발사대를 집어삼키는 것을 믿을 수 없다는 듯이 지켜보고 있습니다. 그것은 다가오는 미래에 우주에 대한 의지를 훨씬 약화시킬 것이고, 당신의 대통령직에 오점이 될 것입니다."
 donald_trump.17.o1: "치명적인 사고다."
 donald_trump.18.t: "우주에서의 광기"
 donald_trump.18.d: "It turns out that prolonged periods in isolation with only five others to talk to are not suitable at all for the human psyche.\n\nDespite going through severe training before-hand, one astronaut, Michael, went mentally insane and attempted to manually control the craft to return to Earth as soon as possible. Anne, the only other person awake at the time, attempted to get in his way and halt him, however, she was unable to wrestle him away from the controls. While she was attempting to do this, Michael punched Anne in the jaw, knocking her unconscious.\n\nFortunately, the other crew members were wakened by the disorder, and immediately jumped to aid Anne. A quick struggle ensued where the control panel was slightly dented, however, everything remains operational and Michael is now in a makeshift prison with makeshift handcuffs. Additional good news, Anne was not permanently injured, and will be able to recover within a week on the vessel. Whether she has long term damage would have to be investigated by doctors at home.\n\nThe bad news is that the rocket is widely off-course. Additionally, a lot of fuel was burned in Michael's hasty attempt to return to Earth.\n\nThere are two options: Return to Earth with all the astronauts, arresting Michael for assault and endangering five other lives, or send them on a one way trip to Mars. The five astronauts have expressed that they are willing to sacrifice themselves for the good of humanity.\n\nMr. President. What is your choice?"
 donald_trump.18.o1: "남은 우주비행사들이 준비가 되었다면, 그들을 가게 하자."
 donald_trump.18.o2: "그들을 고향으로 데려오고, 그 개자식은 체포하라."
 donald_trump.19.t: "치욕스러운 귀환"
 donald_trump.19.d: "몇 달 전, 화성행 로켓에서 언쟁이 벌어지면서 탑승하고 있던 우주 비행사들이 편도 여행을 피하기 위해 지구로 돌아와야만 했습니다. 앤은 승무원들이 발견하지 못한 부상이 있는지 조사하기 위해 병원으로 보내졌고, 마이클은 체포되어 정신 병원으로 보내질 것으로 보입니다. 메리를 제외한 다른 우주 비행사들은 다시 우주에 공헌하겠다고 제안했으며, 메리는 우주 비행사 경력에서 일찍 은퇴하기로 결정했습니다. 그들은 모두 살아서 고향에 돌아와 행복합니다.\n\n이곳은 앞으로 꽤 오랫동안 인간을 화성에 보내려는 정부 프로그램의 종말이 될 가능성이 높습니다."
 donald_trump.19.o1: "안타깝지만, 적어도 그들은 살아있다."
 donald_trump.20.t: "화성에서의 희생"
 donald_trump.20.d: "몇 주 전, 화성으로 가는 로켓 위에서 언쟁이 벌어지면서 우주비행사들은 화성으로의 편도 여행을 하기로 하는 어려운 결정을 내리게 되었습니다. 그들은 착륙하여 화성 표면을 탐험했습니다. 그들은 오래 살 수 없기 때문에, 그것을 최대한 활용하려고 합니다. 이를 통해 상당한 연구 기회가 창출될 것이지만, 이는 인간의 생명을 희생하게 됩니다. 좌초되어, 영구적인 음식 공급원 없이, 그 승무원들은 바라건데, 언젠가, 한 팀이 그들을 되찾고 지구에 적절한 매장을 하기 위해 화성에 올 때까지 표면에 그들의 몸을 남겨두고 굶어 죽을 것입니다. 그 때까지, 그들은 그곳에 영원히 누워있을 것입니다."
 donald_trump.20.o1: "화성에서의 순교자들."
 donald_trump.21.t: "독수리가 착륙하다."
 donald_trump.21.d1: "화성 착륙에 성공했습니다! 탑승했던 승무원들은 즐겁고, 지구에 있는 시청자들은 우주 여행에 대해 그 어느 때보다 열광하고 있습니다. 그들은 지구로 돌아오기 전에 며칠 동안 이곳에 머물면서 과학적인 샘플을 채취하고 실험을 하게 됩니다. 우주에 대한 흥분은 미래의 우주 임무를 정치적으로 쉽게 수행할 수 있게 해줄 것이며 대통령직의 인기도 높일 것입니다. 그러나 미국은 이제 다시 한번 우주의 경계를 넓히고 있습니다."
 donald_trump.21.d2: "나사의 화성 착륙은 두 번째로 성공적인 화성 착륙입니다! 탑승한 승무원들은 기뻐하며, 이 우주선과 스페이스X의 착륙을 통해 지구에 있는 시청자들은 우주 여행에 대해 그 어느 때보다 열광하고 있습니다. 그들은 지구로 돌아오기 전에 며칠 동안 이곳에 머물면서 과학적인 샘플을 채취하고 실험을 하게 됩니다. 우주에 대한 흥분은 미래의 우주 임무를 정치적으로 쉽게 수행할 수 있도록 보장하고 대통령직의 인기를 높일 것입니다. 그러나 미국은 공공과 민간을 막론하고 이제 다시 한 번 우주의 경계를 넓히고 있습니다."
 donald_trump.21.o1: "미국 만세!"
 donald_trump.21.o2: "두번째도 나쁜건 아니지."
 donald_trump.22.t: "영웅적인 귀환"
 donald_trump.22.d1: "마이클, 폴, 에드워드, 로드니, 마리, 그리고 앤은 역사책에 역사상 가장 중요한 우주 비행 중 하나로 기록될 여행을 통해 안전하게 고향으로 돌아왔습니다. 그들은 전세계의 실험실에서 처리될 셀 수 없는 암석들과 귀중한 데이터를 가져왔습니다. 바라건대, 이것이 미래의 화성 식민지화를 위한 길을 열어줄 것입니다."
 donald_trump.22.d2: "2위임에도 불구하고 마이클, 폴, 에드워드, 로드니, 마리, 그리고 앤은 화성 왕복 여행을 통해 안전하게 고향으로 돌아왔습니다. 그들은 전세계의 실험실에서 처리될 셀 수 없는 암석들과 귀중한 데이터를 가져왔습니다. 이것이 스페이스X의 착륙과 함께 미래의 화성 식민지화를 위한 길을 열어주기를 바랍니다."
 donald_trump.22.o1: "영웅들이 고향에 왔다."
 donald_trump.22.o2: "그들이 고향에 왔다."
 donald_trump.25.t: "화성에 도착한 스페이스X"
 donald_trump.25.d1: "Despite our best efforts, SpaceX has managed to land on Mars first, beating us in the space race. They have landed their Starship on the Martian surface. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars first, before NASA with its huge financial advantage. We still celebrate this occasion, as it will bring many new discoveries to the sciences of space exploration and Mars."
 donald_trump.25.d2: "SpaceX is the second organization to land on Mars. They have landed their Starship on the Martian surface. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars, just after NASA with its huge financial advantage. We still celebrate this occasion, since it will hopefully lead to successes in the future for SpaceX and Elon Musk."
 donald_trump.25.d3: "SpaceX is the second organization to land on Mars, albeit it will likely be the first to do a successful round trip. They have landed their Starship on the Martian surface, near the site where we landed our doomed mission, and are taking the bodies home, much to the relief of their families at home. This task for a private company was a huge undertaking, and we applaud them just for getting to Mars. We still celebrate this occasion, since it will hopefully lead to successes in the future for SpaceX and Elon Musk."
 donald_trump.25.o1: "누가 먼저 하든, 여전히 놀라운 성과다."
 donald_trump.25.o2: "여전히 놀라운 성과다."
 donald_trump.26.t: "달 전초기지"
 donald_trump.26.d: "우리의 과학자와 엔지니어들은 달에서 반영구적으로 생활할 수 있도록 우주비행사와 장비를 보낼 준비가 되어 있습니다. 총 합계 약 12명의 우주비행사가 수천만 달러 상당의 장비, 보급품, 생활 공간 및 개인 물품과 함께 그곳으로 보내질 것입니다. 음력 하루가 지구의 29일 동안 지속되기 때문에 이 전초 기지는 정기적으로 이동해야 합니다. 이는 배터리가 달에 전력을 저장하기에는 너무 긴 시간입니다.\n\n베이스 자체는 쉽게 이동할 수 있는 기둥 위에 위치하여 태양광 패널을 최대한 활용할 수 있습니다. 또한 달에서의 장기적인 생활 조건을 결정하기 위한 실험도 수행될 예정입니다. 달의 얼음을 추출하면 달에 있는 식물을 위한 액체 물과 우주 비행사를 위한 음식을 얻을 수 있을 뿐만 아니라 이를 로켓 연료인 산소와 수소로 분리할 수도 있습니다.\n\n이를 수행하는 데 필요한 연구를 수행하는 데 몇 달 또는 몇 년이 걸릴 수 있습니다. 그러나 이 기간 내에 우리는 이 프로젝트의 자금을 사용하여 달에 더 쉽게 접근할 수 있도록 달 궤도를 도는 기지를 건설하고 지구에 도달하기 위해 연료를 재급유할 것입니다.\n\n이 모든 것은 향후 10년 내에 달성 가능합니다. 그러나 이제 발사할 시간이다."
 donald_trump.26.o1: "발사!"
 donald_trump.27.t: "달기지 알파"
 donald_trump.27.d: "우리의 과학자들과 엔지니어들은 공식적으로 달에 착륙했으며, 현재 달 기지를 세우는 과정에 있습니다. 각 구역은 \"모듈\"로 나뉘어 있으며, 독립된 건물은 아니지만 하나로 결합된 형태도 아닙니다. 거주 모듈은 휴식을 위한 공간, 음식 모듈은 식량을 재배하는 공간, 실험실 모듈은 가장 크고 대부분의 과학 장비가 있는 곳, 유지보수 모듈은 고장이 날 경우 수리 도구를 포함한 공간, 편의시설 모듈은 사람들이 6개월 동안 머물기 위해 필요한 다양한 시설이 있고, 많은 태양광 패널들이 설치되어 있습니다.\n\n\n식량은 처음 몇 달 동안 배송될 예정이며, 식량 재배에는 시간이 걸리기 때문입니다. 물과 산소는 달의 얼음을 통해 얻을 것입니다. 마지막으로, 이 과학자들은 약 6개월 후에 태양광 패널이 고장 나면서 다음 장소로 이동할 예정입니다. 이는 현재 기지가 위치한 곳의 달 주기와 밤낮이 6개월씩 지속되기 때문입니다.\n"
 donald_trump.27.o1: "과학!"
 donald_trump.28.t: "식민지의 진보"
 donald_trump.28.d: "우리의 달 과학 기지는 큰 진전을 이루었습니다. 현재의 태양광 패널 네트워크를 확장하고, 최근 물을 분리해 산소와 수소를 생산하는 과정이 더 쉬워졌으며, 그 결과 가장 최근의 보급 로켓을 완전히 연료로 채울 만큼 충분한 산소와 수소를 확보할 수 있었습니다. 이는 미래 우주 탐사를 위한 중심지로서 달이 충분한 시간과 투자를 받으면 가능해질 중요한 돌파구입니다.\n\n우주는 점점 더 가까워지고 있습니다."
 donald_trump.28.o1: "우리는 항상 개척자가 될 준비가 되어 있지"
 donald_trump.29.t: "달에서의 위기"
 donald_trump.29.d: "즉각적으로 과감한 조치를 취해야 합니다. 현재 원인불명의 이유로 거주 모듈이 파열되어 \"폭발\"했습니다.\n\n한 시간 전, 12명의 과학자 모두가 임무를 수행하고 있었는데, 갑자기 거주 모듈에 대규모 파열이 발생했습니다.\n\n파동은 진공 상태에서 이동하지 않기 때문에, 대부분의 사람들은 어떤 일이 일어났는지 물리적으로 보기 전까지 파악하지 못했습니다.\n\n예산의 일부로 긴급 자금이 있어서, 프로젝트에 더 많은 자금을 할당할 필요가 없으며 과학자들은 항상 다른 격리된 모듈에서 잠을 잘 수 있습니다. 그러나 이는 우리 과학자 중 소수, 다수 또는 심지어 전부가 사망할 수 있다고 말하면서 많은 사람들을 놀라게 했으며, 과학자들이 사망할 수 있었기 때문에 과학자들의 사기를 저하시켰습니다. 따라서 달에 전초 기지를 계속 유지하려는 시도는 정치적으로 비용이 많이 들고, 사기 저하로 인해 과학자들의 교체가 나중이 아닌 지금 이루어져야 할 수도 있습니다.\n\n우리는 무엇을 해야 할까요?"
 donald_trump.29.o1: "긴급 지원을 보내라!"
 donald_trump.29.o2: "프로젝트를 포기하자. 이것은 우리를 위한 것이 아니다."
 donald_trump.30.t: "식민지의 지속적인 진보"
 donald_trump.30.d: "Our Moon outpost has made another major breakthrough. They have managed to ship Helium-3, a gas which seems perfect for fusion, to Earth, and scientists at home have figured out how to conduct fusion with it! Not only this, but the power generated from this fusion is near the amount used to do the reaction in the first place. This means that, with some improvements, this could result in successful fusion power! Not only does this allow immense benefits at home, along with knowledge we may be able to use in using other materials for fusion, we can use this on the Moon, allowing a permanent outpost rather than mobile outposts!\n\nAll of this is far ahead of schedule, which is a surprise, and many at NASA have been left unprepared to implement this into the current Moonbase. So, a new Moonbase is needed, in a much better spot for rapid expansion than the current location of Moonbase Alpha. It's time to start preparations on Moonbase Beta."
 donald_trump.30.o1: "생명은 계속된다"
 donald_trump.31.t: "달에서의 또다른 위기"
 donald_trump.31.d: "More drastic measures need to be taken now. Two more modules have ruptured. This time, it's both the Food and Amenities modules.\n\nRoughly forty minutes ago, a scientist was about to enter the Food module when it suddenly exploded. The scientist is fine, and no-one but the plants were harmed. However, it was adjacent to the Amenities module, and it caused it to rupture and explode. Again, no-one was hurt.\n\nThis new occurrence, however, has raised the hairs of many back home, questioning the safety of the modules. After the previous explosion, NASA replaced the modules, ensuring that they wouldn't explode, but it seems like prolonged pressure can cause something to break much more easily than it would otherwise. NASA has already quickly responded, ordering new modules be made immediately, as well as a close inspection of all current modules (As you can't \"recall\" modules from the Moon as of this moment).\n\nWith mounting pressure at home to stop going forward with the project until all safety concerns are resolved, the continuation of the Moonbase program comes into question. In addition to the political pushback, the emergency fund has been cut in half, so NASA is requesting another $5 billion to sort out future concerns. It remains your choice to decide whether to continue."
 donald_trump.31.o1: "더 많은 긴급 지원을 보내라!"
 donald_trump.31.o2: "이런 식으로는 일을 계속 할 수 없다."
 donald_trump.32.t: "달기지 베타"
 donald_trump.32.d: "At this point, our scientists and engineers on the Moon need to move to another location on the poles. The costs for doing this are already established in the long-term budget, so we don't need to add any new funding to the project yet.\n\nWith this new moonbase, we will be able to use new discoveries we have uncovered to allow the base to be established permanently, unlike our previous moonbase. With the use of better rockets, better power generation, better ice extraction and separation, we can use this new base, at a site more suited for rapid expansion, to facilitate colonization efforts of the Moon. This is not the only good news, entrepreneurs and corporations are flooding to NASA en masse for requests to put their newly developed mining systems on the Moon. Even other space programs in other countries are now extremely interested in starting up scientific and mining outposts on the Moon, however, due to your diligent efforts, we not only have a massive head start, but we are the only country actively attempting to colonize the Moon.\n\nThe future on our Moon is bright and American."
 donald_trump.32.o1: "만세!"
 donald_trump_news.2.t: "소행성 채굴 위원회를 출범한 미국"
 donald_trump_news.2.d: "Earlier today the President of the United States announced the Asteroid Mining Initiative. This organization \"will seek to find an asteroid, bring it into the orbit of Earth, mine it, and send its resources back to the USA.\" Many doubt if this could ever be profitable, as the immense costs will consume much of NASA's budget, however, the President has voiced his wishes for private space companies to do some of the work. One particular favorite, SpaceX, was pointed out directly in his speech on the AMI, stating \"Smart people, and boy, do we have some smart people, like my good friend at SpaceX, Elon Musk, will be able to send their space mining equipment to the asteroid, mine it, and sell it for profit. It will be a tremendous business, believe me.\" There are serious concerns for asteroid mining, however the Administration has been dismissive of those concerns, instead focusing on the rewards of the project. Whether this is successful or not, only time will tell."
 donald_trump_news.2.o1: "우주로!"
 donald_trump_news.2.o2: "어쩌면 우린 이걸 더 확장시킬 수 있을지도 모른다..."
 donald_trump_news.2.o3: "흥미롭군"
 donald_trump_news.3.t: "소행성 채굴 작업을 시작하는 미국"
 donald_trump_news.3.d: "A large celebration was held in Florida today as shipments of platinum, gold, and silver reached the ground from space in a spectacular display. These materials are not from any normal mine, but from asteroids.  A few months ago, NASA caught a large asteroid heading on a course which would place itself nearby earth. A relatively slow asteroid, it was pulled into an elliptical orbit with Earth. Mining operations started as soon as it was in orbit. This news has been a surprise to the world, as it has been done far faster than expected. Many countries are now seeking to start their own asteroid mining programs to counteract the American monopoly. The United States does claim the entire asteroid. However, this claim can only be sparsely enforced as the asteroid is so large. Asteroid mining will likely become a lucrative industry, with many successes and failures. Who will dominate the asteroid, nonetheless, remains a mystery."
 donald_trump_news.3.o1: "우주 암석이다!"
 donald_trump_news.3.o2: "우리도 정말 이쪽으로 확장해야 합니다..."
 donald_trump_news.3.o3: "흥미롭군"
 donald_trump_news.4.t: "화성 유인 임무를 계획하는 NASA"
 donald_trump_news.4.d: "나사는 3년 이내에 화성에 유인 임무를 보낼 것이라고 발표했습니다. 이 발표에 많은 사람들이 흥분하고 있으며 우주에 대한 열기가 그 어느 때보다 뜨겁습니다. 이번 발표는 \"미국인을 다시 우주에 보내겠다\"는 트럼프 대통령의 트윗 이후 나온 것입니다. 이 새로운 발표는 또한 화성에 가기 위한 자본을 마련하기 위해 나사의 예산이 증액된 데 따른 것입니다. 우주에서의 모든 것이 빠르게 발전하고 있는 것 같습니다."
 donald_trump_news.4.o1: "우리는 가야만 한다!"
 donald_trump_news.4.o2: "흥미롭군"
 donald_trump_news.5.t: "NASA와의 우주 경쟁을 선언하는 스페이스X"
 donald_trump_news.5.d: "It appears that Elon Musk never wants to be out-done. Not long ago, Donald Trump announced his wishes for a manned mission to Mars with NASA to be done within two years. Elon Musk, today, has announced that he will also be getting to Mars, before NASA. This new \"Space race\" between the public NASA and private SpaceX, both American organizations, has people wondering: Who will prevail?\n\nElon Musk intends to use his new Starship and Super-Heavy booster to get people to Mars. This new rocket is huge, but not as big as NASA's Space Launch System. One can expect both organizations to go into overdrive as they race to bring humanity to the furthest reaches that humanity has ever gone before."
 donald_trump_news.5.o1: "잠깐, 뭐라고!?"
 donald_trump_news.5.o2: "정부대 민간이라고? 경쟁이 되지 않겠군"
 donald_trump_news.5.o3: "미국인들이 또 서로 경쟁하기 시작했군..."
 donald_trump_news.6.t: "화성을 향한 NASA의 로켓이 발사 과정에서 폭파되다!"
 donald_trump_news.6.d: "속보: 매우 빠른 개발 단계 이후, 우주 발사 시스템이 발사대에서 폭발했습니다. 안전 조치가 취해졌음에도 불구하고 6명의 승무원도 모두 사망하여 이미 끔찍한 발사 실패에 추가되었습니다.\n\n트럼프 대통령은 트위터를 통해 \"나사의 훌륭한 과학자들과 엔지니어들의 최선의 노력에도 불구하고 새 로켓이 발사대에서 폭발했다\" 현재의 안전 기준으로는 그날 목숨을 잃은 6명의 우주비행사들의 생명을 보호하기에 충분하지 않았습니다. 그러나 우리는 미국인의 생명을 훨씬 더 소중히 여기며 우주에서 우리의 노력을 계속할 것입니다.\"며 비극에 대해 언급했습니다.\n\n실패의 원인은 다음과 같습니다..."
 donald_trump_news.6.o1: "그럴 확률이 얼마나 될까"
 donald_trump_news.6.o2: "아무래도 너무 서두른게 아닐까요?"
 donald_trump_news.7.t: "NASA의 유인 탐사대가 화성에 발을 딛다!"
 donald_trump_news.7.d: "오늘, NASA는 오리온 우주 캡슐을 화성에 착륙시켰습니다! 여섯 명의 우주비행사들이 우주선에서 떠나 붉은 화성 표면을 탐험했습니다. 생방송(화성에서 보내는 방송이 가능할 만큼 생생한 방송)은 집에서 지켜보는 관객들에게 이 과정을 실시간으로 보여주었습니다. 모든 이들이 성공을 축하하며, 많은 사람들이 우주에서 다음에 일어날 일에 대해 기다리고 있습니다. 그것이 달의 식민지화가 될지, 화성에 또 다른 부츠가 올라설지, 혹은 화성 식민지화가 될지 아무도 알 수 없습니다.\n\n미래는 지금입니다."
 donald_trump_news.7.o1: "만세!"
 donald_trump_news.7.o2: "미국은 더 넓은 땅이 필요한 겁니다, 그쵸?"
 donald_trump_news.8.t: "화성 유인 임무를 먼저 시작하는 스페이스X (Space X)"
 donald_trump_news.8.d: "일론 머스크가 이끄는 민간 우주 벤처기업 스페이스X가 미국 정부의 나사보다 먼저 화성에 착륙해 전 세계를 놀라게 했습니다. 일론 머스크의 개인적 인기가 치솟으면서 그 어느 때보다 스페이스X에 대한 열기가 뜨겁습니다. 이러한 성공은 일론 머스크의 다른 회사인 테슬라에도 영향을 미쳐 매출과 주가가 소폭 상승했습니다.\n\n이에 대해 도널드 트럼프 대통령은 \"민간 기업이 정부보다 더 잘할 수 있다는 것을 보여줬다\"며 일론 머스크와 스페이스X의 성과를 축하하는 논평을 냈습니다. 도널드 트럼프의 우주 계획이 화성에 일찍 도착하는 데 영향을 미쳤을 수도 있지만, 스페이스X, 블루 오리진, 나사 모두 화성에 대한 야망을 가지고 있었다고 말하는 사람들이 많습니다. 누가 먼저 화성에 도착하든 인류에게 큰 도약이 될 것이라는 점은 변함이 없습니다."
 donald_trump_news.8.o1: "미국은 위대하다!"
 donald_trump_news.8.o2: "미국은 또 다시 한번 그들 자신을 이겼습니다..."
 donald_trump_news.9.t: "달에 전초기지를 세운 미국"
 donald_trump_news.9.d: "Earlier today, President Trump announced that the USA will seek to put outposts on the Moon to gather scientific data. This new development is not a surprise, however, as the President has been hinting at it for weeks. When asked at the White House press conference today about whether this will lead to colonization, Trump replied \"We might colonize the Moon, we might not. It depends really.\"\n\nMany are enthusiastic, some cite the mining potential of the Moon, some are simply excited for the prospect of living on the Moon. No matter who you are, this is an exciting time."
 donald_trump_news.9.o1: "우리의 영향권이 더 넓어집니다"
 donald_trump_news.9.o2: "이것도 제국주의인가?"
 donald_trump_news.10.t: "달에 대한 작전을 확장하는 미국"
 donald_trump_news.10.d: "현재 달기지인 달기지 알파의 사용 기간이 거의 다 되었습니다. 나사는 최근 성명을 통해 과학자 및 엔지니어가 연구를 수행할 수 있는 확장된 공간과 함께 기회주의적인 기업을 수용하기 위해 훨씬 더 큰 규모의 달기지, 즉 달기지 베타에 대한 계획과 함께 이 같이 말했습니다. 일론은 트위터를 통해 \"문베이스 베타는 스페이스X뿐만 아니라 인류 전체에게 많은 새로운 기회를 제공할 것\"이라고 말했습니다. 발표 후 실시한 설문조사에 따르면 74%의 사람들이 우주 탐험과 식민지 개척에 대한 기대감을 드러냈습니다. 이러한 이유 때문에 다른 정부에서도 자체적인 달기지 계획을 검토하고 있는 것으로 보입니다."
 donald_trump_news.10.o1: "진행하라!"
 donald_trump_news.10.o2: "다음은 뭐지? 달 합중국?"
 donald_trump_news.11.t: "달 기지를 포기한 미국"
 donald_trump_news.11.d: "After the US Moonbase suffered a crisis, having a module explode on the Moon, NASA decided to delay the program. The scientists sent to the Moon are being taken home until NASA fixes the safety issues with the modules."
 donald_trump_news.11.o1: "그만한 가치가 없었다"
 donald_trump_news.11.o2: "미국에도 너무 비싸다면, 우리에게도 너무 비싸다"
 donald_trump_news.12.t: "러시아 수사 시작"
 donald_trump_news.12.d: "미국 연방수사국(FBI)이 2016년 대선 기간 동안 도널드 트럼프가 러시아와 공모했는지 여부에 대한 수사에 착수했습니다. 트럼프는 마녀사냥이라며 공모를 부인하는 반면, 다른 사람들은 트럼프가 러시아에 대해 유화적인 태도를 보이는 것이 그가 러시아의 꼭두각시라는 증거라고 말합니다. 그 결과가 무엇이든 간에 향후 미국에 엄청난 영향을 미칠 것입니다."
 donald_trump_news.12.o1: "공모 망상!"
 donald_trump_news.12.o2: "흥미롭군"
 free_operations: "자유 작전"
 free_operations_desc: "미군이 그 지역에서 철수했으므로, 이제 우린 이전보다 전술적이고 작전적인 부분에서 더욱 자유를 가지게 되었습니다."
 continued_space_efforts: "계속되는 우주 개발 투자"
 continued_space_efforts_desc: "우주에 대한 우리의 지속적인 노력은 우리에게 더 많은 연구 기회와 멋진 미래를 제공하고 있습니다."
 space_force: "우주군"
 space_force_desc: "육지를 지배하는 자가 대륙을 지배합니다. 바다를 지배하는 자가 해안선을 지배합니다. 하늘을 지배하는 자가 둘 모두를 지배하고, 우주를 지배하는 자가 지구를 지배합니다."
 space_marines: "우주 해병대"
 space_marines_desc: "복무는 시민권을 보장한다!"
