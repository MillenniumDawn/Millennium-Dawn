 SPACE_AUTO_TITLE: "§YAutomatisation du programme§!"
 SPACE_AUTO_TITLE_TT: "Runs your space program without micromanagement: every week it orders the satellites and launch vehicles the selected plan calls for, then launches them once the stockpile can fill a rotation.\n\nIt always builds the §Ynewest generation you have researched§!, never an older one, and stops on its own once a constellation reaches maximum capacity.\n\nAt §Y3,000 satellites in total§! or §Y1,000 per type§!, successful launches automatically deorbit the lowest-generation eligible satellites of the same type to make room for newer generations. Failed launches keep existing satellites. If no eligible replacement is available, automation waits without consuming the launch vehicle or payload. Active spy missions are protected.\n\n§YThe figures on this panel are recalculated monthly§!, and again every time you reopen this tab - so if a readout looks out of date after finishing a technology, switch tabs and back to refresh it.\n\n§RKILLSATs are not automated§! - they are orbital weapons rather than a coverage constellation, so there is no capacity target to fill."
 SPACE_AUTO_STATUS: "[space_auto_status_loc]"
 SPACE_AUTO_STATUS_TT: "§YInactive§! - automation is switched off.\n§YActive§! - ordering and launching; the figure is the current weekly charge.\n§YWaiting§! - needs payload stock or enough satellite capacity to launch without disrupting active spy missions.\n§YAt capacity§! - every constellation in the plan is full; idle until you research a new generation.\n§YStalled§! - no payload in the plan fits the launch vehicle.\n§YPaused§! - the treasury cannot cover the next batch; lower the rotation or enable deficit spending.\n§YHalted§! - the treasury is empty and deficit spending is off.\n\nThis status is recalculated monthly and whenever you reopen this tab."
 SPACE_AUTO_TOGGLE_TT: "[!space_auto_toggle_button_click_enabled]Activer ou désactiver l'automatisation."
 SPACE_AUTO_TOGGLE_TT_DELAYED: "Couper n'arrête que les nouvelles commandes. Les lots déjà en production s'achèvent et continuent d'être facturés jusqu'à livraison, rien de ce que vous avez payé n'est perdu.\n\nRéactiver reprend là où en sont vos constellations."
 SPACE_AUTO_PRESET: "§gPlan :§! [space_auto_preset_name_loc]"
 SPACE_AUTO_PRESET_DESC: "[space_auto_preset_desc_loc]"
 SPACE_AUTO_PRESET_TT: "Quels satellites l'automatisation construit. Aucune conception manuelle n'est requise — chaque plan choisit de lui-même la génération la plus récente que vous avez recherchée.\n\n§YAutomatique§! reconstruit d'abord votre réseau le plus obsolète, puis passe au suivant une fois celui-ci plein.\nLes plans §YFocus§! consacrent chaque emplacement à une famille.\nLes plans §Yappariés§! et §Yéquilibrés§! partagent le manifeste, cédant des emplacements à la famille la plus en retard à mesure que les autres se remplissent.\n§YPersonnalisé§! vole le manifeste que vous avez préparé ci-dessus et enregistré."
 SPACE_AUTO_PRESET_NEXT_TT: "Plan suivant"
 SPACE_AUTO_PRESET_PREV_TT: "Plan précédent"
