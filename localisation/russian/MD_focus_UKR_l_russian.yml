 UKR_storage_item_t62_tt: "§YТ-62§!\n\n\n£SOV_LAND_T_62\n\n\n\nНа хранении: §Y[?ukraine_has_t62_stockpile|0]§!\nПоколение: основной боевой танк первого поколения, на вооружении с 1961 года.\nТип техники: §YКорпус танка 1-го поколения§!\n\nСемейство вариантов:\n• Т-62\n• Т-62М\n• Т-62МВ\n\nПервый танк со 115-мм гладкоствольной пушкой. Его корпуса идут на программу модернизации §YТ-62§! и экспортные контракты. Здесь же хранятся танки, захваченные у [SOV.GetFlag] России."
 UKR_storage_item_pt76: "ПТ-76"
 UKR_storage_item_pt76_count: "§Y[?ukraine_has_pt76_stockpile|0]§!"
 UKR_storage_item_pt76_icon: "GFX_SOV_LAND_PT_76"
 UKR_storage_item_pt76_tt: "§YПТ-76§!\n\n\n£SOV_LAND_PT_76\n\n\n\nНа хранении: §Y[?ukraine_has_pt76_stockpile|0]§!\nПоколение: послевоенный плавающий лёгкий танк, на вооружении с 1951 года.\nТип техники: §YКорпус лёгкого танка 1-го поколения§!\n\nСемейство вариантов:\n• ПТ-76\n• ПТ-76Б\n\nПлавающий лёгкий танк с 76-мм пушкой, когда-то служивший в разведывательных частях и морской пехоте."
 UKR_storage_item_btr50: "БТР-50"
