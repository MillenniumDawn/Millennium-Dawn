 BOT_hire_extra_security: "추가 경비 인력 고용"
 BOT_hire_extra_security_desc: "밀렵에 맞서기 위한 상설 경비 부대를 편성합니다. 이 프로그램은 해산할 때까지 지속되며 경찰 예산이 계속 소요됩니다.\n§G밀렵꾼을 제거할 확률이 10% 증가합니다§!"
 BOT_disband_extra_security: "추가 경비 인력 해산"
 BOT_disband_extra_security_desc: "추가 경비 부대를 해산하고 유지비를 중단합니다."
 BOT_provide_heavy_weapons: "중화기 지급"
 BOT_provide_heavy_weapons_desc: "보안군에게 상설 프로그램으로 중화기와 추가 장비를 지급합니다. 이 프로그램은 철회할 때까지 지속되며 인건 예산이 계속 소요됩니다.\n§G제거되는 밀렵꾼 수가 5 증가합니다§!"
 BOT_withdraw_heavy_weapons: "중화기 회수"
 BOT_withdraw_heavy_weapons_desc: "밀렵 방지 병력에게서 중화기를 회수하고 유지비를 중단합니다."
 BOT_extra_security_program: "밀렵 방지 추가 경비"
 BOT_extra_security_program_desc: "밀렵 퇴치에 전념하는 상설 경비 부대입니다. 경찰 예산이 늘어나는 대신 밀렵꾼을 제거할 확률이 10% 높아집니다."
 BOT_heavy_weapons_program: "레인저 중화기"
 BOT_heavy_weapons_program_desc: "밀렵 방지 병력이 중화기와 추가 장비를 운용합니다. 인건 예산이 늘어나는 대신 매달 밀렵꾼을 5명 더 제거합니다."
 Botswana_events.8.t: "BOCCIM, 비즈니스 보츠와나로 개명"
 Botswana_events.8.desc: "보츠와나 상공업 인력 연합이 비즈니스 보츠와나라는 명칭을 채택했습니다. 이 최상위 고용주 단체는 더 짧은 이름이 정부와의 교섭에서 민간 부문의 단일 대변자라는 자신들의 역할을 반영한다고 밝혔으며, 대통령이 의장을 맡는 고위급 자문 위원회의 의석은 그대로 유지할 것입니다."
 Botswana_events.8.a: "같은 로비 단체, 새 이름"
 Botswana_events.9.t: "진보주의자 동맹 창당"
 Botswana_events.9.desc: "은다바 가올라테와 그의 지지자들이 격렬한 지도부 분쟁 끝에 보츠와나 민주화 운동을 떠나 진보주의자 동맹을 창당했습니다. 이 신생 정당은 청렴한 정부, 다변화된 경제, 강화된 제도를 지향하는 중도적이고 사회자유주의적인 대안을 자처하며, 야권 연합 내에 자리를 잡으려 할 것으로 예상됩니다."
 Botswana_events.9.a: "또 하나의 야당"