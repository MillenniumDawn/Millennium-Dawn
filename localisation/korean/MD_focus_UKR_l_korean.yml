 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early: "미콜라이우에서 §YBRDM-2§! 조기 개량을 주문한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2ld_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y미콜라이우 전차 수리 공장§!과 하르키우의 모로조프 설계국은 비슷한 개량안 두 가지를 준비했습니다. 두 안 모두 승무원용 측면 해치를 추가합니다. §YBRDM-2LD§!는 새 디젤 엔진도 받는 반면, §YBRDM-2M§!은 기존 가솔린 엔진을 그대로 씁니다.\n\n이 제안은 §Y2001§!년 말까지 유효합니다. 이를 거절하면 이 공장은 §Y2004§!년에 더 깊은 개량안을 들고 돌아옵니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission: "마지막 기회: 조기 §YBRDM-2§! 개량"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_early_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed: "미콜라이우에서 §YBRDM-2DI 하자르§! 개량을 주문한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2di_for_tooltip\n\n\n\n\n\n\n\n\n§W해외 임무를 통해 현대적인 정찰차에 무엇이 필요한지 알게 되었습니다. §Y미콜라이우 전차 수리 공장§!은 IVECO 디젤 엔진, 열상 장비, 영상 감시 체계, 하차 병력용 추가 해치를 갖춘 §YBRDM-2DI 하자르§!를 제안합니다. 추가 비용을 들이면 이 공장은 신형 §Y부흐§! 무장 스테이션도 장착할 수 있습니다.\n\n이 제안은 §Y2005§!년 말까지 유효합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission: "마지막 기회: §YBRDM-2DI 하자르§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_developed_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.name: "BRDM-2T의 다음 단계"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.desc: "테크임펙스는 BRDM-2T를 두 방향으로 더 발전시킬 수 있습니다. 경량형은 포탑을 떼어 내고 개방형 기관총 거치대와 BTR-70식 해치를 달며, 개량형은 포탑을 유지한 채 케블라 파편 방지 내피와 새 변속기를 추가합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.a: "경량화한 §YBRDM-2T zr. 2013§!을 개발한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.b: "개량한 §YBRDM-2T zr. 2015§!를 개발한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.name: "BRDM-2T zr. 2013 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.desc: "테크임펙스가 §YBRDM-2T zr. 2013§!을 완성했습니다. 포탑과 차체 하부 보조 바퀴를 없애고 넓은 측면 해치를 달았으며, 개방형 거치대에 NSVT 중기관총과 PKT를 장착했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.11.a: "§YBRDM-2T zr. 2013§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.name: "BRDM-2T zr. 2015 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.desc: "테크임펙스가 §YBRDM-2T zr. 2015§!를 완성했습니다. 포탑을 유지한 채 BRDM-2LD식 해치, 5단 변속기, 로사바 타이어, 모토로라 무전기, 케블라 파편 방지 내피를 추가했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.12.a: "§YBRDM-2T zr. 2015§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.name: "마야크, BRDM-2DP를 제안하다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.desc: "키이우의 §Y마야크§! 공장이 디젤 엔진, 측면 문, 탈착식 대성형작약 방호망을 갖춘 경량형 §YBRDM-2DP§!를 자체 개발했습니다. 마야크는 작업을 마무리하고 설계를 우리에게 넘기기 위한 자금 지원을 요청합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.a: "마야크에 자금을 지원한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.13.b: "테크임펙스와의 거래를 유지한다"
