 POR_ops_show_all_tt: "Show the decisions in every country again."
 POR_ops_exposure_tt: "§YExposure§! is what Brussels and NATO can see of the shadow war. Every operation raises it, and it only cools while none of our people are fighting overseas.\n\nFrom 15, each tier costs trade opinion and Political Power, and from 35 our defence against foreign influence. From 55, interest rates rise, Brussels counts it as a serious breach of EU values and sends its ultimatum: stand down or leave. From 75, it costs stability as well.\n\n§YBurn the Dossier§! lowers it."
