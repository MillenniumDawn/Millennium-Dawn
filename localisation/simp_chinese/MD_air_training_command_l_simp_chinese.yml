 MD_atc_exercise_training: "空中行动战备演习"
 MD_atc_exercise_training_desc: "全联队战备周期检验，涵盖出动架次生成、空运与侦察协调。各中队进行训练，以维持前沿机场的作战能力。"
 MD_atc_ex_training_short: "训练与作战精通度提升90天"
 MD_atc_exercise_design: "飞行测试与评估"
 MD_atc_exercise_design_desc: "试飞员和工程师对新机体和航电设备进行飞行评估。评估结果直接反馈到设计和维护实践中。"
 MD_atc_ex_design_short: "飞机设计精通度提升90天"
 MD_atc_exercise_heavy: "战略空运与轰炸机演习"
 MD_atc_exercise_heavy_desc: "重型轰炸机和运输机的远程出击训练。机组人员演练空中加油、大规模编队飞行和纵深打击航线。"
 MD_atc_ex_heavy_short: "重型飞机精通度提升90天"
 MD_atc_exercise_multirole: "多用途打击战斗机演习"
 MD_atc_exercise_multirole_desc: "战斗机中队演练在单次出击中切换空对空与空对地角色的能力。混编机群则进行协同瞄准与护航战术训练。"
 MD_atc_ex_multirole_short: "多用途飞机精通度提升90天"
 MD_atc_exercise_strike: "近距空中支援演习"
 MD_atc_exercise_strike_desc: "攻击中队与地面前进空中管制员一同训练目标标记、低空攻击以及避免误伤友军。"
 MD_atc_ex_strike_short: "对地攻击机精通度提升90天"
 MD_atc_exercise_fighter: "空战演习"
 MD_atc_exercise_fighter_desc: "大规模空战演习让战斗机和截击机中队对抗假想敌部队。飞行员演练超视距交战和近距离格斗。"
 MD_atc_ex_fighter_short: "战斗机精通度提升90天"
 MD_atc_exercise_drone: "无人系统演习"
 MD_atc_exercise_drone_desc: "操作员进行无人机的发射、控制和回收训练。演练内容包括蜂群战术、数据链抗干扰以及在电子攻击环境下作战。"
 MD_atc_ex_drone_short: "无人机作战精通度提升90天"
 MD_atc_staff_college_name: "空军参谋学院"
 MD_atc_staff_college_short: "获得空中任务经验，并在90天内降低经验损失"
 MD_atc_staff_college: "空军参谋课程正在进行中"
 MD_atc_staff_college_desc: "资深空军军官参加空军参谋学院的学习。近期作战的经验教训提升了任务规划水平及空勤人员的留任率。"
 MD_atc_fighter_school_name: "战斗机武器学校"
 MD_atc_fighter_school_short: "180天内王牌飞行员产生率提升"
 MD_atc_fighter_school: "战斗机武器课程正在进行中"
 MD_atc_fighter_school_desc: "遴选出优秀战斗机飞行员参加高级武器与战术课程。毕业生返回各自的中队，担任教官和战术指挥官。"
 MD_atc_rnd_liaison_name: "空军研发联络官"
 MD_atc_rnd_liaison_short: "获得一个空军突破点。"
 MD_atc_rnd_liaison_cooldown: "空军研发联络官激活"
 MD_atc_rnd_liaison_cooldown_desc: "空军军官被派往陆战研究机构，将作战经验转化为研发需求。"
 MD_atc_academy_name: "飞行训练大纲"
 MD_atc_academy_short: "解锁空军学院精神，提升演习效果。"
 MD_atc_academy_level_text: "等级[?ROOT.MD_atc_academy_level|0]/3"
 MD_atc_force_name: "空军战备计划"
 MD_atc_force_short: "解锁一项空军精神。"
