l_russian:
 muslim_brotherhood_sponsor: "Сеть Братьев - мусульман"
 muslim_brotherhood_suppressor: "Противостоять Братству"
 MB_build_network_hub: "Создайте Международную организацию"
 MB_build_network_hub_desc: "«Братья-мусульмане» — это трансграничное движение, его филиалы разбросаны по всему региону и не имеют единого центра. Пусть [Root.GetNameDef] станет таким центром, координирующим деятельность сети и дающим нам возможность поддерживать наших братьев за рубежом."
 MB_fund_affiliates: "Партнеры Фонда Brotherhood"
 MB_fund_affiliates_desc: "«Братство» в [FROM.GetNameDef] готово действовать, но у него мало ресурсов. Деньги, организаторы и постоянная поддержка укрепят их позиции в противостоянии с правительством, которое предпочло бы их уничтожить."
 MB_diplomatic_solidarity: "Призыв к Братству и Солидарности"
 MB_diplomatic_solidarity_desc: "Правительства стран, поддерживающих «Братство», вместе сильнее, чем по отдельности. Соберите их за одним столом, подтвердите общность целей, и пусть теплота наших отношений распространится по всему блоку."
 MB_bankroll_crackdown: "Финансировать иностранные репрессии"
 MB_bankroll_crackdown_desc: "[FROM.GetNameDef] наблюдает, как «Братство» набирает силу внутри его границ, не имея средств для действий. Предоставьте им финансирование и разведданные, чтобы нанести удар первыми, пока движение не набрало достаточно сил, чтобы угрожать государству."
 MB_designate_terrorist_organization: "Признать «Братство» террористической организацией"
 MB_designate_terrorist_organization_desc: "Заклеймить «Братьев-мусульман» тем, чем мы их объявляем: террористической организацией. Это обозначение мало чего стоит внутри страны и ставит [Root.GetNameDef] плечом к плечу с каждым правительством, которое провело ту же черту."
 MB_counter_sponsor_influence: "Разоблачить финансирование «Братства»"
 MB_counter_sponsor_influence_desc: "Кто-то финансирует «Братство» в [FROM.GetNameDef], и деньги оставляют след. Разоблачите это, нарушьте его работу и наблюдайте, как движение теряет размах, когда его покровителей вытаскивают на свет."
 MB_rescind_terrorist_designation: "Отменить статус террористической организации"
 MB_rescind_terrorist_designation_desc: "Тихо позволить обозначению террористической организации утратить силу. Позиция против «Братства» выполнила свою задачу, и в сохранении старых обид в документах мало пользы."
 MB_sponsored_network: "Спонсирование нашего движения «Братства»"
 MB_funding_subversion: "Финансирование подрывной деятельности «Братства» за рубежом"
 MB_solidarity: "Солидарность с «Братьями-мусульманами»"
 MB_crackdown_patron: "Профинансировали наше подавление"
 MB_funding_repression: "Финансирование репрессий против «Братства»"
 MB_counter_bloc: "Общая позиция против «Братства»"
 MB_branded_terrorist: "Признали «Братство» террористической группировкой"
 brotherhood.6.c: "Привлечь их умеренных в правительство."
 brotherhood.11.t: "Предложение профинансировать подавление"
 brotherhood.11.d: "[FROM.GetNameDef] тайно предложили нам деньги и разведданные для подавления «Братьев-мусульман», пока они не набрали ещё большую силу. Их посланники ждут ответа."
 brotherhood.11.a: "Принять финансирование и выступить против них."
 brotherhood.11.b: "Отклонить предложение."