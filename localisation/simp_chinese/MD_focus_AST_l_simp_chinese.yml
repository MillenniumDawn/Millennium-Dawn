 australia_abbottgov_focus: "The Abbott Government"
 tony_abbott_desc: "Tony's career has been a performance of dancing around criticism, and raining it upon his opponents. As a viciously capable opposition leader, Tony has led the party towards a more hard-right stance, with a penchant for popularising his three-word slogans. \n\nBorn in London, raised in Sydney as a Roman Catholic, and educated as a Jesuit, Tony's first priority in school was to become a priest. A deep desire for service and spiritual leadership drove him to eventually returning to the UK as an Oxford Student, learning as much as he could before his service. Although, despite the adoration, his inclinations for politics would never leave him. \n\nHis regular organising of rallies and demonstrations put him opposed to Oxford's left-wing student leadership, eventuating in violent clashes. Upon his return to Australia, Tony would follow his original intentions and join the priesthood in 1984 at the age of 26. After three years in the service, he would come to admit to being \"a square peg trying to go into a round hole,\" and that the priesthood was not simply meant for him. \n\nSince his devotion was not enough to overcome his love for the excitement of politics, Tony joined The Bulletin as a journalist, leading to eventual role as Press Secretary for the Liberal Party. The experienced, and divisive party performer has now risen to the highest seat in the Nation."
