 MD_artc_cost_800_blocked: "£army_experience §R800§!"
 MD_artc_fully_upgraded: "Полностью улучшено"
 MD_artc_exercise_operations: "Общевойсковые полевые учения"
 MD_artc_exercise_operations_desc: "Бригады выходят на полигон, чтобы целиком отработать оперативную концепцию армии: от выдвижения и встречного боя до развития успеха и пополнения запасов."
 MD_artc_ex_operations_short: "Освоение направления «Оперативная теория» на 90 дней."
 MD_artc_exercise_dedicated: "Ротация в центре боевой подготовки"
 MD_artc_exercise_dedicated_desc: "Части по очереди проходят через центр боевой подготовки и сражаются с профессиональным условным противником под контролем аппаратуры объективного контроля. Каждый бой подробно разбирается в отчётах по итогам."
 MD_artc_ex_dedicated_short: "Освоение направления «Специализированная доктрина» на 90 дней."
 MD_artc_exercise_training: "Цикл боевых стрельб"
 MD_artc_exercise_training_desc: "Батальоны проходят поэтапную программу боевых стрельб: от упражнений из личного оружия до общевойсковых стрельб в составе роты."
 MD_artc_ex_training_short: "Освоение направления «Подготовка» на 90 дней."
 MD_artc_exercise_leadership: "Командно-штабные учения"
 MD_artc_exercise_leadership_desc: "Штабы дивизий и корпусов развёртывают командные пункты и ведут условную кампанию. Штабные офицеры отрабатывают подготовку приказов, отслеживание обстановки и передачу командования в напряжённых условиях."
 MD_artc_ex_leadership_short: "Освоение направления «Командование» на 90 дней."
 MD_artc_exercise_technology: "Испытания экспериментальных сил"
 MD_artc_exercise_technology_desc: "Выделенное экспериментальное соединение испытывает в поле новые датчики, сети и вооружение. Его выводы определяют, как вся армия будет осваивать новую технику."
 MD_artc_ex_technology_short: "Освоение направления «Технологии» на 90 дней."
 MD_artc_exercise_structure: "Учения по боеготовности соединений"
 MD_artc_exercise_structure_desc: "Дивизии доукомплектовываются до полного штата и по внезапной тревоге выдвигаются в районы, чтобы проверить, как организационная структура армии выдерживает быстрое развёртывание."
 MD_artc_ex_structure_short: "Освоение направления «Структура» на 90 дней."
 MD_artc_staff_college_name: "Командно-штабной колледж"
 MD_artc_staff_college_short: "Все армейские командиры получают опыт, а один может получить новую черту."
 MD_artc_staff_college_cooldown: "Идёт обучение в командно-штабном колледже"
 MD_artc_staff_college_cooldown_desc: "Старшие офицеры проходят обучение в командно-штабном колледже. Следующий набор начнётся после выпуска нынешнего."
 MD_artc_senior_course_name: "Курс высшего командного состава"
 MD_artc_senior_course_short: "Один фельдмаршал (или генерал, если подходящих нет) повышает уровень навыка."
 MD_artc_senior_course_cooldown: "Идёт курс высшего командного состава"
 MD_artc_senior_course_cooldown_desc: "Генералы проходят подготовку высшего командного звена для командования корпусами и армиями. Новый курс можно начать после выпуска этого."
 MD_artc_rnd_liaison_name: "Связь с сухопутными НИОКР"
 MD_artc_rnd_liaison_short: "Даёт очко прорыва в сухопутных исследованиях."
 MD_artc_rnd_liaison_cooldown: "Связь с сухопутными НИОКР действует"
 MD_artc_rnd_liaison_cooldown_desc: "Армейские офицеры прикомандированы к оборонным научным учреждениям и превращают опыт операций в требования к разработкам."
 MD_artc_academy_name: "Программа боевой подготовки"
 MD_artc_academy_short: "Открывает дух академии, усиливает учения."
 MD_artc_academy_level_text: "Уровень [?ROOT.MD_artc_academy_level|0]/3"
 MD_artc_army_name: "Программа тылового обеспечения армии"
 MD_artc_army_short: "Открывает дух армии."
 MD_artc_army_level_text: "Уровень [?ROOT.MD_artc_army_level|0]/3"
 MD_artc_command_name: "Программа подготовки к командованию по задачам"
 MD_artc_command_short: "Открывает дух командования дивизий."
 MD_artc_command_level_text: "Уровень [?ROOT.MD_artc_command_level|0]/3"
 MD_artc_academy_1: "Центр боевой подготовки I"
 MD_artc_academy_1_desc: "Постоянный центр боевой подготовки с собственным подразделением условного противника обеспечивает каждой бригаде трудную ротацию, прежде чем её признают боеготовой."
 MD_artc_academy_2: "Центр боевой подготовки II"
 MD_artc_academy_2_desc: "$MD_artc_academy_1_desc$"
 MD_artc_academy_3: "Центр боевой подготовки III"
 MD_artc_academy_3_desc: "$MD_artc_academy_1_desc$"
 MD_artc_army_1: "Стандарты полевого обеспечения I"
 MD_artc_army_1_desc: "Единые стандарты полевого ремонта, помощи раненым и расхода горючего позволяют соединениям сохранять численность между боями."
 MD_artc_army_2: "Стандарты полевого обеспечения II"
 MD_artc_army_2_desc: "$MD_artc_army_1_desc$"
 MD_artc_army_3: "Стандарты полевого обеспечения III"
 MD_artc_army_3_desc: "$MD_artc_army_1_desc$"
 MD_artc_command_1: "Подготовка к командованию по задачам I"
 MD_artc_command_1_desc: "Командиры и штабы учатся ясно ставить замысел и доверять подчинённым действовать по нему, что ускоряет планирование во всех войсках."
 MD_artc_command_2: "Подготовка к командованию по задачам II"
 MD_artc_command_2_desc: "$MD_artc_command_1_desc$"
 MD_artc_command_3: "Подготовка к командованию по задачам III"
 MD_artc_command_3_desc: "$MD_artc_command_1_desc$"
 MD_artc_tt_fully_upgraded: "§GПолностью улучшено§!"
 MD_artc_tt_mastery_0_5: "§G+0.5§!"
 MD_artc_tt_mastery_0_75: "§G+0.75§!"
 MD_artc_tt_mastery_1_0: "§G+1.0§!"
 MD_artc_tt_mastery_1_25: "§G+1.25§!"
 MD_artc_ex_operations_tt: "§YОбщевойсковые полевые учения§!\n\n£army_experience Опыт армии: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YОбщевойсковые полевые учения§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+25%§!\n £organization_texticon  Организация дивизии: §G+3%§!\n£doctrine_mastery Освоение направления §H«Оперативная теория»§!: [MD_artc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Общевойсковой бой»§!, §Y«Шок и трепет»§!, §Y«Глубокая оборона»§!, §Y«Командование по задачам»§! или §Y«Партизанская война»§! и не менее §H10§! дивизий."
 MD_artc_ex_dedicated_tt: "§YРотация в центре боевой подготовки§!\n\n£army_experience Опыт армии: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YРотация в центре боевой подготовки§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+25%§!\n £attack_texticon  Атака дивизии: §G+2%§!\n£doctrine_mastery Освоение направления §H«Специализированная доктрина»§!: [MD_artc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Шок и трепет»§!, §Y«Глубокая оборона»§!, §Y«Боевая поддержка»§! или §Y«Партизанская война»§! и не менее §H10§! дивизий."
 MD_artc_ex_training_tt: "§YЦикл боевых стрельб§!\n\n£army_experience Опыт армии: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YЦикл боевых стрельб§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+25%§!\n £training_speed_texticon  Время подготовки дивизии: §G-5%§!\n£doctrine_mastery Освоение направления §H«Подготовка»§!: [MD_artc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая доктрина §Y«Общевойсковой бой»§!, §Y«Шок и трепет»§!, §Y«Глубокая оборона»§!, §Y«Командование по задачам»§! или §Y«Боевая поддержка»§! и не менее §H10§! дивизий."
 MD_artc_ex_leadership_tt: "§YКомандно-штабные учения§!\n\n£army_experience Опыт армии: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YКомандно-штабные учения§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+25%§!\n £planning_speed_texticon  Скорость планирования: §G+5%§!\n£doctrine_mastery Освоение направления §H«Командование»§!: [MD_artc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая сухопутная доктрина и не менее §H10§! дивизий."
 MD_artc_ex_technology_tt: "§YИспытания экспериментальных сил§!\n\n£army_experience Опыт армии: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YИспытания экспериментальных сил§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+25%§!\n £breakthrough_texticon  Прорыв: §G+2%§!\n£doctrine_mastery Освоение направления §H«Технологии»§!: [MD_artc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая сухопутная доктрина и не менее §H10§! дивизий."
 MD_artc_ex_structure_tt: "§YУчения по боеготовности соединений§!\n\n£army_experience Опыт армии: §R-450§!\n£command_power Командный ресурс: §R-75§!\nДаёт национальный дух §YУчения по боеготовности соединений§! на §H90§! дней:\n £fuel_consumption_texticon  Потребление горючего армией: §R+25%§!\n £army_morale_texticon  Скорость восстановления дивизии: §G+3%§!\n£doctrine_mastery Освоение направления §H«Структура»§!: [MD_artc_exercise_mastery_tt_text] в день в течение §H90§! дней\n\nТребуется общая сухопутная доктрина и не менее §H10§! дивизий."
 MD_artc_academy_tt_1: "£army_experience Опыт армии: §R-550§!\nОткрывает §YЦентр боевой подготовки I§! в ячейке «Дух академии»:\n £doctrine_mastery Прирост освоения сухопутной доктрины: §G+5%§!\n £training_speed_texticon  Время подготовки дивизии: §G-5%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на армейских учениях растёт с §Y0.5§! до §G0.75§!"
 MD_artc_academy_tt_2: "£army_experience Опыт армии: §R-650§!\nОткрывает §YЦентр боевой подготовки II§! в ячейке «Дух академии»:\nЗаменяет §YЦентр боевой подготовки I§! (если установлен).\n £doctrine_mastery Прирост освоения сухопутной доктрины: §G+10%§!\n £training_speed_texticon  Время подготовки дивизии: §G-10%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на армейских учениях растёт с §Y0.75§! до §G1.0§!"
 MD_artc_academy_tt_3: "£army_experience Опыт армии: §R-800§!\nОткрывает §YЦентр боевой подготовки III§! в ячейке «Дух академии»:\nЗаменяет §YЦентр боевой подготовки II§! (если установлен).\n £doctrine_mastery Прирост освоения сухопутной доктрины: §G+15%§!\n £training_speed_texticon  Время подготовки дивизии: §G-15%§!\nЕжедневное £doctrine_mastery §Hосвоение§! на армейских учениях растёт с §Y1.0§! до §G1.25§!"
 MD_artc_academy_tt: "§YПрограмма боевой подготовки§!\n\n[MD_artc_academy_tt_text]"
 MD_artc_army_tt_1: "£army_experience Опыт армии: §R-550§!\nОткрывает §YСтандарты полевого обеспечения I§! в ячейке «Дух армии»:\n £attrition_texticon  Потери от истощения: §G-5%§!"
 MD_artc_army_tt_2: "£army_experience Опыт армии: §R-650§!\nОткрывает §YСтандарты полевого обеспечения II§! в ячейке «Дух армии»:\nЗаменяет §YСтандарты полевого обеспечения I§! (если установлен).\n £attrition_texticon  Потери от истощения: §G-10%§!\n £fuel_consumption_texticon  Потребление горючего армией: §G-5%§!"
 MD_artc_army_tt_3: "£army_experience Опыт армии: §R-800§!\nОткрывает §YСтандарты полевого обеспечения III§! в ячейке «Дух армии»:\nЗаменяет §YСтандарты полевого обеспечения II§! (если установлен).\n £attrition_texticon  Потери от истощения: §G-15%§!\n £fuel_consumption_texticon  Потребление горючего армией: §G-10%§!"
 MD_artc_army_tt: "§YПрограмма тылового обеспечения армии§!\n\n[MD_artc_army_tt_text]"
 MD_artc_command_tt_1: "£army_experience Опыт армии: §R-550§!\nОткрывает §YПодготовку к командованию по задачам I§! в ячейке «Дух командования дивизий»:\n £planning_max_texticon  Максимум планирования: §G+3%§!"
 MD_artc_command_tt_2: "£army_experience Опыт армии: §R-650§!\nОткрывает §YПодготовку к командованию по задачам II§! в ячейке «Дух командования дивизий»:\nЗаменяет §YПодготовку к командованию по задачам I§! (если установлен).\n £planning_max_texticon  Максимум планирования: §G+6%§!\n £planning_speed_texticon  Скорость планирования: §G+5%§!"
 MD_artc_command_tt_3: "£army_experience Опыт армии: §R-800§!\nОткрывает §YПодготовку к командованию по задачам III§! в ячейке «Дух командования дивизий»:\nЗаменяет §YПодготовку к командованию по задачам II§! (если установлен).\n £planning_max_texticon  Максимум планирования: §G+10%§!\n £planning_speed_texticon  Скорость планирования: §G+10%§!"
 MD_artc_command_tt: "§YПрограмма подготовки к командованию по задачам§!\n\n[MD_artc_command_tt_text]"
 MD_artc_staff_tt: "§YКомандно-штабной колледж§!\n\n£army_experience Опыт армии: §R-350§!\n£command_power Командный ресурс: §R-75§!\nКаждый командующий сухопутными войсками:\n Получает §G250§! опыта\nС вероятностью §H20%§!: случайный генерал или фельдмаршал получает базовую черту, которой у него ещё нет\nПерезарядка: £clock_texticon §H90§! дней"
 MD_artc_senior_tt: "§YКурс высшего командного состава§!\n\n£army_experience Опыт армии: §R-450§!\n£command_power Командный ресурс: §R-75§!\nСлучайный фельдмаршал с уровнем навыка ниже §H9§! (или случайный генерал, если подходящих фельдмаршалов нет):\n Уровень навыка: §G+1§!\nПерезарядка: £clock_texticon §H180§! дней"
 MD_artc_rnd_tt: "§YСвязь с сухопутными НИОКР§!\n\n£army_experience Опыт армии: §R-600§!\n£command_power Командный ресурс: §R-75§!\nПолучение очков прорыва:\n  §YНИОКР в области сухопутных войск§!: §G1§!\nПерезарядка: £clock_texticon §H365§! дней"