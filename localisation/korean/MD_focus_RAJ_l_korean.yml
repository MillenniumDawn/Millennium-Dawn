 pak_raj_border_progress_change_tt: "분쟁 주에 대한 §Y영유권 진행도§!: [?border_war_progress_change|+=0]"
 raj_chi_border_progress_change_tt: "분쟁 주에 대한 §Y영유권 진행도§!: [?border_war_progress_change|+=0]"
 border_war_claim_progress_cost_tt: "§Y영유권 진행도§!: $RIGHT|+=0$"
 pak_raj_border_attack_outcome_tt: "§Y10§!일 후 분쟁 주를 둘러싼 국경 전쟁이 시작됩니다. 승리하면 §Y영유권 진행도 20§!이 추가되고, 패배하면 §Y10§!이 감소하며, 교착 상태에서는 §Y5§!가 감소합니다.\n그 전에 소유권, 통제권 또는 병력 주둔 상황이 바뀌면 작전은 비용 없이 취소됩니다."
 raj_chi_border_attack_outcome_tt: "§Y10§!일 후 분쟁 주를 둘러싼 국경 전쟁이 시작됩니다. 승리하면 §Y영유권 진행도 20§!이 추가되고, 패배하면 §Y10§!이 감소하며, 교착 상태에서는 §Y5§!가 감소합니다.\n그 전에 소유권, 통제권 또는 병력 주둔 상황이 바뀌면 작전은 비용 없이 취소됩니다."
 border_war_frontier_exercise: "국경 훈련"
 border_war_frontier_exercise_desc: "국경에서 계속되는 기동 훈련이 이곳에 주둔한 부대를 소모시키고 있습니다."
 border_war_frontier_operation: "국경 작전"
 border_war_frontier_operation_desc: "국경을 따라 벌어지는 작전이 이곳에 주둔한 부대를 소모시키고 있습니다."
 border_war_state_garrison_tt: "지정된 국경 구역을 통제하고 있으며 그곳에 사단을 최소 §Y5§!개 주둔시키고 있습니다"
 border_war_state_patrol_tt: "지정된 국경 구역을 통제하고 있으며 그곳에 사단을 최소 §Y3§!개 주둔시키고 있습니다"
 border_war_state_mechanized_tt: "지정된 국경 구역을 통제하고 있으며 그곳에 기계화 또는 차량화 보병 사단을 최소 §Y3§!개 주둔시키고 있습니다"
 border_war_state_artillery_tt: "지정된 국경 구역을 통제하고 있으며 그곳에 포병 또는 로켓 포병 사단을 최소 §Y3§!개 주둔시키고 있습니다"
 border_war_operation_blocked.2.t: "준비 중단"
 border_war_operation_blocked.2.d: "작전을 위해 지정된 수비대가 준비가 끝나기 전에 국경을 떠났습니다. 훈련은 취소되었고, 상대국은 이 틈을 이용해 주도권을 잡았습니다."
 border_war_operation_blocked.2.a: "값비싼 실수이다"
 border_war_mobilization_idea: "총동원"
 border_war_mobilization_idea_desc: "군은 분쟁 중인 국경 일대에서 위기 대응 태세로 전환했습니다."
 pak_raj_border_train_army: "[From.GetName]에서 육군 훈련 실시"
 pak_raj_border_train_army_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 사단들과 함께 15일간의 훈련을 실시합니다. 지휘력 20이 소모됩니다. 투입된 부대는 훈련 기간 동안 소모를 겪습니다. 준비태세가 3 증가합니다. 15일이 지나기 전에 수비대를 철수시키면, 같은 3의 준비태세가 대신 상대국에 주어집니다.\n\n훈련이 끝나면 군은 새로운 국경 구역을 지정합니다."
 pak_raj_border_train_mechanized: "[From.GetName]에서 기계화 훈련 실시"
 pak_raj_border_train_mechanized_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 기계화 및 차량화 사단들과 함께 15일간의 기계화 훈련을 실시합니다. 지휘력 20이 소모됩니다. 투입된 부대는 훈련 기간 동안 소모를 겪습니다. 준비태세가 8 증가하지만 사고 위험이 있습니다. 15일이 지나기 전에 부대를 철수시키면, 같은 8의 준비태세가 대신 상대국에 주어집니다.\n\n훈련이 끝나면 군은 새로운 국경 구역을 지정합니다."
 pak_raj_border_train_artillery: "[From.GetName]에서 포병 훈련 실시"
 pak_raj_border_train_artillery_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 포병 및 로켓 포병과 함께 15일간의 포술 훈련을 실시합니다. 지휘력 20이 소모됩니다. 투입된 부대는 훈련 기간 동안 소모를 겪습니다. 준비태세가 5 증가합니다. 15일이 지나기 전에 포를 철수시키면, 같은 5의 준비태세가 대신 상대국에 주어집니다.\n\n훈련이 끝나면 군은 새로운 국경 구역을 지정합니다."
 pak_raj_border_stage_incursion: "[From.GetName]에서 국경 월경 실시"
 pak_raj_border_stage_incursion_desc: "지정된 국경 구역인 [From.GetName]에서 국경선 너머로 정찰대를 보냅니다. 지휘력 20이 소모됩니다. 투입된 부대는 작전 기간 동안 소모를 겪습니다. 양자 긴장도가 15 증가하며 사상자가 발생할 위험이 있습니다. 15일이 지나기 전에 정찰대를 철수시키면, 3의 준비태세가 대신 상대국에 주어집니다.\n\n정찰대가 복귀하면 군은 새로운 국경 구역을 지정합니다."
 pak_raj_border_shell_positions: "[From.GetName]에서 국경 진지 포격"
 pak_raj_border_shell_positions_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 포병과 로켓 포병으로 맞은편 진지를 포격합니다. 지휘력 20이 소모됩니다. 투입된 부대는 작전 기간 동안 소모를 겪습니다. 양자 긴장도가 22 증가하고, 세계 긴장도가 더 올라가며, 보복당할 위험이 있습니다. 15일이 지나기 전에 포를 철수시키면, 5의 준비태세가 대신 상대국에 주어집니다.\n\n포격이 끝나면 군은 새로운 국경 구역을 지정합니다."
 pak_raj_border_negotiate: "인도 파키스탄 회담 개시"
 pak_raj_border_negotiate_desc: "상호 선의를 활용해 양자 긴장도를 25 낮춥니다. 두터운 상호 신뢰를 바탕으로 한 평화적 위기 해결은 국경을 영구적으로 안정시킬 수 있습니다."
 pak_raj_border_negotiate_tt: "§G인도 파키스탄 양자 긴장도가 25 감소합니다§!"
 pak_raj_border_settlement_tt: "§G인도와 파키스탄이 항구적인 국경 합의를 이룹니다§!"
 pak_raj_border_issue_ultimatum: "영토 최후통첩 발송"
 pak_raj_border_issue_ultimatum_desc: "우리의 현지 기세가 뒷받침하는 바로 그 주를 요구합니다. 상대가 거부하면 해당 주에 대한 제한적 전쟁 명분이 허용됩니다."
 pak_raj_border_ultimatum_tt: "상대국은 분쟁 주를 반환하거나, 요구를 거부하고 제한전의 위험을 감수할 수 있습니다."
 pak_raj_border_tension_90_required_tt: "인도 파키스탄 양자 긴장도가 최소 90입니다"
 pak_raj_border_stand_down: "위기에서 물러서기"
 pak_raj_border_stand_down_desc: "위기를 종결하고 양자 긴장도를 30 낮추며, 전쟁 지지도 감소를 감수합니다."
 pak_raj_border_stand_down_tt: "§G위기를 종결하고 인도 파키스탄 양자 긴장도를 30 낮춥니다§!"
 pak_raj_border_reject_ultimatum_tt: "§R발송국은 분쟁 주에 대한 제한적 전쟁 명분을 만들 수 있습니다§!"
 pak_raj_border_mediation_offer_tt: "위기 격화 단계에서 미국의 중재를 수락할지 결정됩니다."
 raj_chi_border_train_army: "[From.GetName]에서 육군 훈련 실시"
 raj_chi_border_train_army_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 사단들과 함께 15일간의 고지대 훈련을 실시합니다. 지휘력 20이 소모됩니다. 투입된 부대는 훈련 기간 동안 소모를 겪습니다. 준비태세가 3 증가합니다. 15일이 지나기 전에 수비대를 철수시키면, 같은 3의 준비태세가 대신 상대국에 주어집니다.\n\n훈련이 끝나면 군은 새로운 국경 구역을 지정합니다."
 raj_chi_border_train_mechanized: "[From.GetName]에서 기계화 훈련 실시"
 raj_chi_border_train_mechanized_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 기계화 및 차량화 사단들과 함께 15일간의 고지대 기계화 훈련을 실시합니다. 지휘력 20이 소모됩니다. 투입된 부대는 훈련 기간 동안 소모를 겪습니다. 준비태세가 8 증가하지만 사고 위험이 있습니다. 15일이 지나기 전에 부대를 철수시키면, 같은 8의 준비태세가 대신 상대국에 주어집니다.\n\n훈련이 끝나면 군은 새로운 국경 구역을 지정합니다."
 raj_chi_border_train_artillery: "[From.GetName]에서 포병 훈련 실시"
 raj_chi_border_train_artillery_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 포병 및 로켓 포병과 함께 15일간의 포술 훈련을 실시합니다. 지휘력 20이 소모됩니다. 투입된 부대는 훈련 기간 동안 소모를 겪습니다. 준비태세가 5 증가합니다. 15일이 지나기 전에 포를 철수시키면, 같은 5의 준비태세가 대신 상대국에 주어집니다.\n\n훈련이 끝나면 군은 새로운 국경 구역을 지정합니다."
 raj_chi_border_stage_incursion: "[From.GetName]에서 국경 월경 실시"
 raj_chi_border_stage_incursion_desc: "지정된 국경 구역인 [From.GetName]에서 국경선 너머로 정찰대를 보냅니다. 지휘력 20이 소모됩니다. 투입된 부대는 작전 기간 동안 소모를 겪습니다. 양자 긴장도가 15 증가하며 사상자가 발생할 위험이 있습니다. 15일이 지나기 전에 정찰대를 철수시키면, 3의 준비태세가 대신 상대국에 주어집니다.\n\n정찰대가 복귀하면 군은 새로운 국경 구역을 지정합니다."
 raj_chi_border_shell_positions: "[From.GetName]에서 국경 진지 포격"
 raj_chi_border_shell_positions_desc: "지정된 국경 구역인 [From.GetName]에 주둔한 포병과 로켓 포병으로 맞은편 진지를 포격합니다. 지휘력 20이 소모됩니다. 투입된 부대는 작전 기간 동안 소모를 겪습니다. 양자 긴장도가 22 증가하고, 세계 긴장도가 더 올라가며, 보복당할 위험이 있습니다. 15일이 지나기 전에 포를 철수시키면, 5의 준비태세가 대신 상대국에 주어집니다.\n\n포격이 끝나면 군은 새로운 국경 구역을 지정합니다."
 raj_chi_border_negotiate: "중국 인도 회담 개시"
 raj_chi_border_negotiate_desc: "상호 선의를 활용해 양자 긴장도를 25 낮추고 진행 중인 대치를 종결합니다."
 raj_chi_border_negotiate_tt: "§G중국 인도 양자 긴장도가 25 감소합니다§!"
