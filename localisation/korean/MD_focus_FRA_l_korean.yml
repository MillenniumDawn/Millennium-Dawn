 FRA_alstom_manufacturer: "알스톰"
 FRA_alstom_manufacturer_desc: "1998년 파리 증시 상장 때 GEC 알스톰에서 이름을 바꾼 알스톰은 프랑스의 기관차, 고속열차, 지하철, 트램과 철도 신호 장비를 제작합니다. 2004년의 국가 구제와 2015년 제너럴 일렉트릭에 대한 전력 사업 매각을 거쳐 순수 철도 기업이 되었으며, 2021년 봄바르디어 트랜스포테이션 인수로 중국 밖에서 가장 큰 철도 차량 제조사가 되었습니다."
 FRA_alstom_manufacturer_trait: "철도 차량 산업 기반"
 FRA_alstom_manufacturer_trait_desc: "벨포르, 라로셸, 라이히쇼펜, 크레스팽, 르 크뢰조, 오르낭은 프랑스 국내에서 견인 장치, 차체, 대차, 최종 조립, 신호에 이르기까지 외국산 부품 없이 완결된 철도 공급망을 이룹니다."
 FRA_alstom_branch_high_speed: "고속철도 계획"
 FRA_alstom_branch_urban_transit: "도시 교통"
 FRA_alstom_branch_freight_logistics: "화물 및 물류 철도"
 FRA_alstom_tgv_duplex: "TGV 뒤플렉스"
 FRA_alstom_tgv_duplex_desc: "2층 구조의 TGV 뒤플렉스는 1996년에 운행을 시작하여 포화 상태인 파리-리옹 노선의 표준 고속열차가 되었으며, 승강장을 늘리지 않고도 열차당 40퍼센트 더 많은 승객을 수송합니다."
 FRA_alstom_belfort_power_cars: "벨포르 동력차"
 FRA_alstom_belfort_power_cars_desc: "벨포르 공장은 프랑스 모든 고속열차의 견인 동력차를 제작합니다. 아벨리아 오리종 계약 이후 작업량의 4분의 3을 단일 사업에서 얻고 있어, 비용과 위험이 한 공장에 집중되어 있습니다."
 FRA_alstom_avelia_horizon: "아벨리아 오리종"
 FRA_alstom_avelia_horizon_desc: "2018년 SNCF가 주문한 5세대 TGV는 2층 구조를 유지하되 동력차를 짧게 하여, 좌석당 비용을 낮추면서 수용 인원을 20퍼센트 늘렸고 에너지 사용량도 20퍼센트 줄였다고 합니다."
 FRA_alstom_avelia_liberty: "아벨리아 리버티"
 FRA_alstom_avelia_liberty_desc: "암트랙의 북동부 회랑을 위해 제작된 틸팅 파생형은 알스톰이 미국에 수출한 최초의 고속열차입니다. 인증 지연은 큰 비용을 초래했지만, 이 주문으로 프랑스 철도 차량에 닫혀 있던 시장에 발판을 마련했습니다."
 FRA_alstom_la_rochelle_assembly: "라로셸 조립"
 FRA_alstom_la_rochelle_assembly_desc: "라로셸 공장은 아벨리아 계열의 객차를 조립하고 시타디스 트램을 설계합니다. 대서양 연안 최대의 철도 분야 고용주이며, 다른 공장으로 이전하기 전에 새로운 차체 기술을 검증하는 곳입니다."
 FRA_alstom_citadis_tramway: "시타디스 트램"
 FRA_alstom_citadis_tramway_desc: "2000년에 출시된 저상 모듈식 시타디스는 60개가 넘는 도시에 판매되어 유럽의 기본 트램이 되었습니다. 표준화된 모듈 덕분에 별도의 맞춤 설계 사업 없이도 노선망을 사양 결정하고 납품할 수 있습니다."
 FRA_alstom_metropolis_metro: "메트로폴리스 지하철"
 FRA_alstom_metropolis_metro_desc: "메트로폴리스 계열은 경량 무인 셔틀에서 8량 편성 간선 열차까지 규모를 아우르며, 무인 및 유인 지하철 차량을 공통 플랫폼으로 구성합니다. 양산 덕분에 단가는 각국의 맞춤 설계보다 낮게 유지됩니다."
 FRA_alstom_urbalis_cbtc: "어발리스 CBTC"
 FRA_alstom_urbalis_cbtc_desc: "어발리스는 알스톰의 통신 기반 열차 제어 체계로, 무인 운전과 90초 미만의 운행 간격을 가능하게 합니다. 크레스팽과 빌뢰르반에서 개발되었으며, 알스톰 자동화 지하철 계약 대부분의 바탕이 되는 신호 계층입니다."
 FRA_alstom_innovia_automated_transit: "이노비아 자동 교통"
 FRA_alstom_innovia_automated_transit_desc: "봄바르디어에서 물려받은 이노비아 자동 무인 수송 체계는 공항 터미널과 밀집된 도심 지구를 연결합니다. 짧은 편성과 고정 안내 궤도 덕분에 기존 부지에 궤도 수송 능력을 더하는 가장 저렴한 방법입니다."
 FRA_alstom_grand_paris_express: "그랑 파리 익스프레스"
 FRA_alstom_grand_paris_express_desc: "유럽 최대의 교통 사업은 파리 주변에 자동화 지하철 4개 노선과 200킬로미터의 선로를 추가합니다. 알스톰이 철도 차량과 신호를 공급하며, 이 사업은 10년간 알스톰의 도시 교통 역량을 뒷받침합니다."
 FRA_alstom_prima_locomotives: "프리마 기관차"
 FRA_alstom_prima_locomotives_desc: "2001년부터 벨포르에서 제작된 전기 및 디젤 화물 기관차 프리마 계열은 노후한 SNCF 차량을 대체했으며 모로코, 시리아, 중국에 수출되었습니다. 프랑스의 철도 화물 수송과 군 철도 수송을 모두 떠받치는 주력 기관차입니다."
 FRA_alstom_prima_h4_hybrid: "프리마 H4 하이브리드"
 FRA_alstom_prima_h4_hybrid_desc: "H4 입환 기관차는 디젤 발전기와 배터리 팩을 결합하여 조차장 작업의 연료 소모를 약 절반으로 줄이고, 차량기지와 조차장 내에서 조용한 이동을 가능하게 합니다."
 FRA_alstom_atlas_ertms: "아틀라스 ERTMS"
 FRA_alstom_atlas_ertms_desc: "아틀라스는 유럽 철도 교통 관리 체계(ERTMS)에 대한 알스톰의 구현으로, 서로 호환되지 않는 각국 신호 체계를 단일한 대륙 표준으로 대체합니다. 차상 및 지상 장비는 크레스팽에서 생산됩니다."
 FRA_alstom_coradia_ilint: "코라디아 iLint"
 FRA_alstom_coradia_ilint_desc: "최초의 수소 연료전지 지역 열차는 2018년에 상업 운행에 들어가 비전철화 지선을 달리며 물만을 배출합니다. 자본 비용을 정당화할 수 없는 노선에 가선을 설치할 필요가 없어집니다."
 FRA_alstom_bombardier_transportation: "봄바르디어 트랜스포테이션"
 FRA_alstom_bombardier_transportation_desc: "유럽 집행위원회가 지멘스 모빌리티와의 합병을 막은 뒤 2021년 1월에 완료된 봄바르디어 트랜스포테이션 인수로 알스톰의 공장과 수주 잔량은 두 배가 되었으며, 알스톰은 세계 2위의 철도 제조사가 되었습니다."
 FRA_crusade_time: "우리의 영지 수복"
 FRA_crusade_time_desc: "프랑크 선조들의 땅을 되찾기 위해서든 성지를 탈환하기 위해서든, 우리는 어쨌든 유럽과 중동의 열강들과 맞서야 할 것입니다. 이제 전쟁에 나설 때입니다."
 FRA_vigipirate_surveillance: "비지피라트 계획"
 FRA_vigipirate_surveillance_desc: "잠재적 테러 공격으로부터 시민을 보호하기 위해 우리는 더 신중하고 더 개입적이어야 합니다."
