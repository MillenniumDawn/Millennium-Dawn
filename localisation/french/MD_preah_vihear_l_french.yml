 preah_vihear_observers: "Observateurs de la frontière indonésienne"
 preah_vihear_observers_desc: "Des observateurs indonésiens non armés sont stationnés le long de la frontière de Preah Vihear dans le cadre d'un arrangement négocié par l'ASEAN, veillant aux violations du cessez-le-feu et donnant aux deux gouvernements une couverture pour laisser le litige se refroidir."
 preah_vihear_icj_grounds_TT: "La tension frontalière est supérieure à 74, ou la Thaïlande a déjà frappé au-delà de la frontière"