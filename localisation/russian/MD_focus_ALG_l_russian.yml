 ALG_renewable_focused_energy_self_sufficient: "Страна с полной самообеспеченностью на основе возобновляемых источников энергии"
 ALG_renewable_focused_energy_self_sufficient_desc: "Алжир решил задействовать свой значительный потенциал в производстве возобновляемой энергии. Несмотря на высокую стоимость и низкую энергетическую плотность, использование возобновляемых источников энергии пойдёт на пользу окружающей среде."
