l_russian:
 CHI_NKO_bilateral_cooperation: "Договор о дружбе, сотрудничестве и взаимной помощи между КНР и КНДР"
 CHI_NKO_bilateral_cooperation_desc: "Договор о дружбе, сотрудничестве и взаимной помощи, подписанный в 1961 году между КНР и КНДР, остаётся единственным договором о взаимной обороне, который есть у каждой из этих стран. Подтверждение его обязательств оживляет отношения, которые как Пекин, так и Пхеньян позволили охладеть, открывая дверь к структурированному сотрудничеству в экономической, военной и политической сферах."
 CHI_NKO_border_trade_zones: "Экономическая зона Хвангымпхён"
 CHI_NKO_border_trade_zones_desc: "Остров Хвангымпхён расположен на реке Ялу между Синыйджу и Даньдуном. Совместно объявленный особой экономической зоной в 2011 году, проект застопорился из-за политических трений. Возобновление китайских инвестиций в зону Хвангымпхён восстанавливает коридор реки Ялу как основу двусторонней торговли."
 CHI_NKO_rason_sez: "Свободный торговый порт Раджин-Сонбон"
 CHI_NKO_rason_sez_desc: "Особая экономическая зона Расон, образованная слиянием Раджина и Сонбона, предоставляет Китаю редкий доступ к незамерзающему тихоокеанскому порту. Китайские инвестиции направлены на развитие контейнерного терминала № 3 в порту Раджин, лёгкую промышленность, а также автомобильные и железнодорожные сообщения, связывающие зону с китайской границей в Тумэне и Хуньчуне."
 CHI_NKO_dandong_trade_hub: "Торговый коридор Синыйджу-Даньдун"
 CHI_NKO_dandong_trade_hub_desc: "Даньдун обрабатывает свыше 70% всех товаров, пересекающих китайско-северокорейскую границу. Расширение таможенной и складской инфраструктуры Даньдуна, наряду с упрощённым пропуском через Мост дружбы, закрепляет за городом роль незаменимого коммерческого хребта двусторонних отношений."
 CHI_NKO_mineral_extraction: "Концессии на железную руду в Мусане"
 CHI_NKO_mineral_extraction_desc: "Мусанский карьер по добыче железной руды в провинции Северный Хамгён — одно из крупнейших месторождений железной руды в Азии. Китайские компании, включая CITIC и Tonghua Iron and Steel Company, подписали контракты на добычу, предоставляющие доступ к ресурсам в обмен на капитал и инфраструктуру. Концессии распространяются на магнезит из Южного Хамгёна и антрацит из Анджуского бассейна."
 CHI_NKO_fisheries_agreement: "Соглашение о рыболовстве в Западно-Корейском море"
 CHI_NKO_fisheries_agreement_desc: "Северная Корея продаёт ежегодные лицензии на рыболовство в Западно-Корейском море китайским флотам, ведущим промысел в водах, от которых некогда зависели корейские рыбаки. Оформление этой практики в двустороннее соглашение обеспечивает Пхеньяну предсказуемый доход от лицензий, а китайским рыболовным компаниям — правовое прикрытие для операций, которые неоднократно вызывали протесты со стороны Сеула и Токио."
 CHI_NKO_yuan_settlement: "Соглашение по Внешторгбанку Корё"
 CHI_NKO_yuan_settlement_desc: "Внешторгбанк Корё и отделение Банка Китая в Даньдуне долгое время обслуживали неформальные финансовые потоки, лежащие в основе двусторонней торговли. Создание формальных механизмов клиринга в юанях устраняет долларовую подверженность, из-за которой северокорейские торговцы попадают под вторичные санкции, ещё глубже встраивая экономику КНДР в финансовую инфраструктуру Китая."
 CHI_NKO_labor_export: "Программа трудового найма Дунбэй"
 CHI_NKO_labor_export_desc: "Организованный государством трудовой наём направляет десятки тысяч северокорейских рабочих на заводы, стройки и в рестораны по всему Ляонину, Цзилиню и Хэйлунцзяну. Рабочие набираются через государственные агентства и направляются по контрактам, которые переводят большую часть заработной платы напрямую в Пхеньян, что делает программу Дунбэй основным источником твёрдой валюты для режима."
 CHI_NKO_yalu_river_bridge: "Второй переход Синыйджу-Даньдун"
 CHI_NKO_yalu_river_bridge_desc: "Новый мост через реку Ялу — четырёхполосный пролёт, завершённый в 2014 году за счёт Китая, — напрямую соединяет зону развития на набережной Даньдуна с окраинами Синыйджу. Несмотря на то, что он годами простаивал без подъездной дороги с северокорейской стороны, открытие перехода кардинально меняет пропускную способность на самом критическом коридоре границы."
 CHI_NKO_energy_cooperation: "Нефтепровод CNPC Даньдун"
 CHI_NKO_energy_cooperation_desc: "Китайская национальная нефтегазовая корпорация (CNPC) управляет единственным нефтепроводом в Северную Корею, пролегающим от Даньдуна до химического комплекса Понхва близ Синыйджу. Китай поставляет практически всю сырую нефть в КНДР через эту единственную артерию, что даёт Пекину негласный рычаг воздействия на северокорейскую экономику. Расширение пропускной способности и наращивание экспорта электроэнергии из Ляонина обеспечивает промышленную базу Северной Кореи."
 CHI_NKO_telecom_network: "Развёртывание 3G Koryolink"
 CHI_NKO_telecom_network_desc: "Koryolink, мобильная сеть Северной Кореи, была построена при инвестициях египетской Orascom, но цепочки поставок оборудования в значительной степени проходят через китайских поставщиков. Расширение китайского участия через оборудование Huawei и ZTE распространяет покрытие 3G за пределы Пхеньяна на провинциальные города, в то время как трансграничные оптоволоконные линии обеспечивают правительство КНДР контролируемой, но функциональной широкополосной магистралью."
 CHI_NKO_power_grid_link: "Сетевая связь гидроэлектростанции Супхун"
 CHI_NKO_power_grid_link_desc: "Супхунская гидроэлектростанция на реке Ялу была построена в 1940-х годах и с тех пор снабжает электроэнергией как Ляонин, так и Северную Корею. Восстановление совместной передающей инфраструктуры и оформление соглашения о межсетевом соединении стабилизирует энергоснабжение Пхеньяна и промышленного севера, позволяя восстановить заводской выпуск."
 CHI_NKO_paektu_tourism: "Коридор Пэктусан-Чанбайшань"
 CHI_NKO_paektu_tourism_desc: "Гора Пэкту — вулканический пик, расположенный на границе провинции Янгандо и Цзилинь, — одновременно является священным истоком мифологии основания династии Ким и крупным местом назначения для китайских туристов, посещающих Чанбайшань. Развитие интегрированной туристической инфраструктуры по обе стороны границы позволяет получать расходы китайских посетителей, одновременно давая Пхеньяну тщательно выверенное окно во внешний мир."
 CHI_NKO_defense_consultations: "Переговоры генштабов НОАК и КНА"
 CHI_NKO_defense_consultations_desc: "Официальные каналы между Генеральным штабом НОАК и Главным политическим управлением КНА существуют со времён Корейской войны, но часто прерывались. Восстановление регулярных консультаций на уровне заместителей начальников штабов создаёт структурированный форум для обмена оценками угроз, координации ответов на учения США и РК и предотвращения просчётов вдоль границы."
 CHI_NKO_military_exchanges: "Программа обмена Национального университета обороны"
 CHI_NKO_military_exchanges_desc: "Национальный университет обороны НОАК в Пекине принимает офицеров КНДР на курсы старшего командного состава, в то время как китайские военные атташе получают более широкий доступ к учебным объектам КНА в ответ. Программа воспитывает поколение северокорейских командиров, знакомых с доктриной и техникой НОАК, углубляя оперативную совместимость и личные связи, которые переживают любое отдельное политическое соглашение."
 CHI_NKO_joint_naval_patrols: "Соглашение о морском патрулировании в Жёлтом море"
 CHI_NKO_joint_naval_patrols_desc: "Северный флот ВМС НОАК и Военно-морское командование КНА координируют графики патрулирования в Жёлтом море для борьбы с незаконной перевалкой грузов, несанкционированным промыслом сторонних флотов и мониторинга авианосных групп США. Двусторонняя морская линия связи снижает риск инцидентов на море и утверждает Китай в качестве фактического военно-морского гаранта Северной Кореи."
 CHI_NKO_air_defense_umbrella: "Сеть ПВО Северо-Восточной Азии"
 CHI_NKO_air_defense_umbrella_desc: "Радиолокационные станции ВВС НОАК в Ляонине и Цзилине уже ведут наблюдение за Корейским полуостровом. Подключение их каналов раннего предупреждения к командным центрам ВВС КНА и обмен данными загоризонтного обнаружения дают Северной Корее эффективное время предупреждения против любого воздушного удара США или Южной Кореи, не требуя от Пхеньяна самостоятельного развития инфраструктуры."
 CHI_NKO_arms_transfers: "Контракты на поставки КОМИД"
 CHI_NKO_arms_transfers_desc: "Корейская корпорация по разработке и торговле полезными ископаемыми (КОМИД) является основным агентством КНДР по закупке вооружений и исторически способствовала передаче технологий от китайских государственных оборонных предприятий. Оформление контрактов на поставку артиллерийских компонентов, деталей для бронетехники и боеприпасов заполняет критические пробелы в боеготовности КНА, одновременно предоставляя китайским оборонным фирмам экспортного заказчика с низкой заметностью."
 CHI_NKO_buffer_state_doctrine: "Доктрина «Губы и зубы»"
 CHI_NKO_buffer_state_doctrine_desc: "Фраза «так же близки, как губы и зубы» описывает отношения Китая и КНДР со времён Корейской войны. Закрепление этого в формальной стратегической доктрине признаёт, что ни одна из стран не может принять крах или внешнюю переориентацию другой. Для Пекина северокорейский буфер не позволяет силам США и РК достичь Ялу. Для Пхеньяна китайская стратегическая поддержка остаётся окончательной гарантией выживания режима."
 CHI_NKO_party_to_party_dialogue: "Соглашение ЦК КПК и ЦК ТПК"
 CHI_NKO_party_to_party_dialogue_desc: "Отношения между Коммунистической партией Китая(КПК) и Трудовой партией Кореи(ТПК) предшествуют обоим государствам и исторически осуществлялись по партийным, а не дипломатическим каналам. Возрождение механизма связи Центральных комитетов даёт Пекину прямой выход на Политбюро ТПК, минуя межгосударственные формальности и позволяя проводить деликатные обсуждения без публичной фиксации."
 CHI_NKO_cultural_exchanges: "Обмен художественной труппой Мансудэ"
 CHI_NKO_cultural_exchanges_desc: "Художественная студия Мансудэ и её исполнительские коллективы представляют собой высшее выражение революционной культуры КНДР. Направление ансамблей Мансудэ в Пекин и Шанхай, в то время как китайские кино- и оперные делегации посещают Пхеньян, выстраивает публичный нарратив братской солидарности и предоставляет режиму пропагандистские кадры китайской аудитории, восхваляющей корейские достижения."
 CHI_NKO_un_coordination: "Соглашение о защите правом вето в СБ ООН"
 CHI_NKO_un_coordination_desc: "Постоянное место Китая в Совете Безопасности ООН неоднократно использовалось для смягчения или блокирования резолюций, направленных против Северной Кореи. Формализация координации между китайскими и северокорейскими дипломатами при ООН гарантирует, что вето Пекина применяются стратегически для защиты Пхеньяна от самых жёстких мер при сохранении видимости конструктивного взаимодействия."
 CHI_NKO_un_coordination_tt: "§Y[CHI.GetNameWithFlag]§! будет накладывать вето на каждое предложение ООН против §Y[NKO.GetNameWithFlag]§!"
 CHI_NKO_sanctions_circumvention: "Сеть подставных компаний «Зокван»"
 CHI_NKO_sanctions_circumvention_desc: "«Зокван Трейдинг» и сеть связанных с ней подставных компаний, зарегистрированных в Даньдуне, Шэньяне и Гонконге, перемещают подсанкционные товары, проводят запрещённые финансовые переводы и способствуют перевалке сырой нефти с корабля на корабль, которая поддерживает поставки топлива в Северную Корею. Углубление китайской терпимости к этой инфраструктуре даёт Пхеньяну незаменимый спасательный круг ценой подвергания китайских субъектов риску вторичных санкций США."
 CHI_NKO_strategic_partnership: "Стратегическое кооперативное партнёрство"
 CHI_NKO_strategic_partnership_desc: "Возведение двусторонних отношений на уровень Всестороннего стратегического кооперативного партнёрства — высшей категории китайской дипломатической классификации — ставит КНДР в один ряд с Россией и Пакистаном во внутреннем круге китайского стратегического согласования. Декларация обязывает обе стороны консультироваться по всем крупным международным вопросам и сигнализирует Вашингтону, Сеулу и Токио, что Пекин считает безопасность Северной Кореи неотделимой от своей собственной."
 CHI_nko_juche_production: "Массовое резервное производство"
 CHI_nko_juche_production_desc: "Северокорейские рабочие, направляемые через программу трудового набора Дунбэй, привносят особую промышленную дисциплину, сформированную десятилетиями доктрины чучхе об опоре на собственные силы: способность поддерживать высокий объём выпуска простых, проверенных конструкций при минимальных накладных расходах. Интеграция этой рабочей силы в субподрядную сеть NORINCO в районе Даньдуна снижает затраты на единицу продукции и расширяет мощность производственных линий по всей номенклатуре пехотного снаряжения бюро."
 NKO_chi_manufacturing_assistance: "Китайские производственные стандарты"
 NKO_chi_manufacturing_assistance_desc: "Техническая помощь от китайских государственных оборонных предприятий, главным образом дочерних структур NORINCO, действующих через Корейскую корпорацию по разработке и торговле полезными ископаемыми (КОМИД), передала стандартизированные производственные допуски, процедуры контроля качества и спецификации компонентов на заводы лёгкого вооружения Первого бюро. Результатом стало снижение доли брака, более стабильные баллистические характеристики и сокращение удельных затрат по всей номенклатуре стрелкового оружия и группового вооружения бюро."
 CHI_NKO_border_trade_idea: "Торговая зона Хвангымпхён"
 CHI_NKO_energy_supply_idea: "Соглашение о поставках топлива CNPC"
 CHI_NKO_telecom_idea: "Программа инфраструктуры Koryolink"
 CHI_NKO_telecom_idea_desc: "Совместное предприятие, расширяющее мобильную и информационную инфраструктуру Koryolink, подключающее северокорейские телекоммуникации к китайским сетям и улучшающее связь через границу."
 CHI_NKO_shared_modifier: "[CHI.GetAdjectiveCap]-[NKO.GetAdjectiveCap] отношения"
 CHI_NKO_shared_modifier_desc: "Отслеживает накопленную глубину китайско-северокорейского сотрудничества в экономической, военной и политической сферах. Более прочные связи улучшают сельскохозяйственный и промышленный выпуск, торговые отношения, эффективность заводов и экспорт ресурсов, одновременно укрепляя армейское планирование, организацию и противовоздушную оборону; более глубокое согласование также расширяет разведывательный потенциал и повышает политическое влияние и поддержку войны по мере более тесной координации двух государств."
 CHI_eternal_allies: "Чучхе-коммунистический альянс"
 CHI_NKO_telecom_network_tt: "[CHI_NKO_telecom_idea_desc]\n"