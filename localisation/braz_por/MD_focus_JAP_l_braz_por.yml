 JAP_diplomacy.11.t: "Pedido dos EUA para Reinterpretar o Artigo 9"
 JAP_diplomacy.11.d: "O governo dos Estados Unidos nos procurou com um pedido formal para reinterpretar ainda mais o Artigo 9 de nossa Constituição. Washington argumenta que o ambiente de segurança regional se deteriorou a tal ponto que o Japão deve assumir uma parcela maior do fardo da defesa coletiva. Aceitar o pedido abriria a porta para uma compreensão mais ampla da autodefesa e para uma cooperação militar mais estreita, mas não ocorrerá sem controvérsia interna."
 JAP_diplomacy.11.a: "Aceitar o pedido dos EUA"
 JAP_diplomacy.11.b: "Não podemos aceitar este pedido"
 JAP_diplomacy.12.t: "Japão Se Recusa a Reinterpretar o Artigo 9"
 JAP_diplomacy.12.d: "Tóquio nos informou que não está preparada para reinterpretar ainda mais o Artigo 9 neste momento. Preocupações com a opinião pública interna, restrições constitucionais e estabilidade política levaram o governo japonês a rejeitar nosso pedido. Devemos agora decidir se respeitamos a decisão deles ou se aumentamos a pressão diplomática e de segurança."
 JAP_diplomacy.12.a: "Respeitaremos a decisão deles"
 JAP_diplomacy.12.b: "Aumentar a pressão sobre o Japão"
 JAP_diplomacy.13.t: "Japão Aceita Reinterpretar o Artigo 9"
 JAP_diplomacy.13.d: "Tóquio informou que é favorável a mudar o nível de interpretação do Artigo 9 e que trabalhará para ser um parceiro de defesa mais ativo."
 JAP_diplomacy.13.a: "Finalmente"
 JAP_diplomacy.14.t: "Pressão dos EUA sobre o Artigo 9"
 JAP_diplomacy.14.d: "Após nossa recusa em ampliar a interpretação do Artigo 9, os Estados Unidos começaram discretamente a aumentar a pressão diplomática e de segurança sobre nosso governo. Consultas da aliança, briefings à imprensa e mensagens de bastidores apontam todos na mesma direção: Washington espera que o Japão assuma mais responsabilidade. Podemos manter a posição firme ou mudar discretamente nossa postura."
 JAP_diplomacy.14.a: "Manteremos a posição firme"
 JAP_diplomacy.14.b: "Ajustar discretamente nossa posição"
 JAP_diplomacy.15.t: "Japão Aceita sob Pressão"
 JAP_diplomacy.15.d: "Após um período de pressão diplomática e estratégica intensificada, Tóquio indicou que está preparada para se aproximar de nossa posição sobre o Artigo 9. Embora insista publicamente que os princípios pacifistas do Japão permanecem inalterados, o governo ampliou agora sua interpretação de autodefesa de uma forma que se alinha às nossas expectativas."
 JAP_diplomacy.15.a: "Excelente"
 JAP_diplomacy.17.t: "Tarifas dos EUA sobre Produtos Japoneses"
 JAP_diplomacy.17.d: "Os Estados Unidos anunciaram um novo pacote de tarifas sobre as principais exportações japonesas, citando desequilíbrios econômicos e pressão política interna. As medidas são apresentadas como uma forma de 'nivelar o campo de jogo', mas em Tóquio são amplamente vistas como uma jogada de motivação política que pressionará tanto a nossa economia quanto a aliança em sentido mais amplo."
 JAP_diplomacy.17.a: "Teremos de nos adaptar a esta nova realidade"
 JAP_diplomacy.18.t: "Japão Pede Alívio das Tarifas"
 JAP_diplomacy.18.d: "Tóquio pediu formalmente que suspendamos as tarifas impostas aos produtos japoneses. Representantes japoneses insinuam que seu governo pode estar disposto a aprofundar a cooperação em segurança e avançar mais na política de defesa em troca. Devemos decidir se transformamos essa disputa econômica em uma oportunidade estratégica ou se mantemos a pressão."
 JAP_diplomacy.18.a: "Suspender as tarifas em troca de concessões de segurança"
 JAP_diplomacy.18.b: "Recusar e manter as tarifas em vigor"
 JAP_diplomacy.19.t: "Tarifas Suspensas, Concessões de Segurança Exigidas"
 JAP_diplomacy.19.d: "Os Estados Unidos concordaram em suspender suas tarifas sobre as exportações japonesas, mas apenas como parte de um entendimento mais amplo sobre segurança e defesa. Na prática, isso significa que se espera que o Japão amplie ainda mais a interpretação do Artigo 9, aprofundando a cooperação militar com Washington e assumindo um papel maior na segurança regional."
 JAP_diplomacy.19.a: "Por nossa economia e nossa aliança, aceitaremos este fardo"
 JAP_diplomacy.20.t: "EUA Se Recusam a Suspender as Tarifas"
 JAP_diplomacy.20.d: "Nosso pedido formal para suspender as tarifas dos EUA foi rejeitado. Washington insiste que as medidas permanecerão em vigor, citando pressões políticas internas e desacordos não resolvidos sobre a política de segurança. Internamente, a frustração cresce entre exportadores e líderes empresariais, enquanto estrategistas alertam que a disputa pode complicar ainda mais nossa aliança."
 JAP_diplomacy.20.a: "Teremos de suportar a pressão por ora"
 JAP_diplomacy.21.t: "Japão Pede Garantias de Segurança Renovadas"
 JAP_diplomacy.21.d: "O governo japonês pediu formalmente aos Estados Unidos garantias de segurança renovadas ou fortalecidas. Tóquio argumenta que o ambiente de segurança regional se deteriorou e que um compromisso mais claro dos EUA ajudaria a estabilizar a situação. Em privado, autoridades japonesas reconhecem que novas mudanças na interpretação do Artigo 9 podem ser possíveis se Washington estiver preparada para assumir compromissos explícitos."
 JAP_diplomacy.21.a: "Restaurar nossas garantias de segurança em troca de compromissos mais profundos"
 JAP_diplomacy.21.b: "Recusar-se a estender nossas garantias"
 JAP_diplomacy.22.t: "Garantias de Segurança Restauradas"
 JAP_diplomacy.22.d: "Os Estados Unidos concordaram em renovar e esclarecer suas garantias de segurança ao Japão. Em troca, Washington espera que Tóquio dê novos passos para ampliar a interpretação do Artigo 9 e assumir uma parcela maior das responsabilidades de segurança regional. A aliança se fortalece, mas o debate interno sobre nossos princípios pacifistas vai se intensificar."
 JAP_diplomacy.22.a: "Por nossa segurança, aceitaremos este compromisso"
 JAP_diplomacy.23.t: "EUA Recusam Garantias Mais Fortes"
 JAP_diplomacy.23.d: "Nosso pedido de garantias de segurança renovadas ou fortalecidas foi rejeitado. Os Estados Unidos insistem que os arranjos existentes são suficientes e que restrições políticas internas limitam quaisquer outros compromissos. Dentro do Japão, essa recusa alimentará preocupações com nossa segurança de longo prazo e com a confiabilidade da nossa aliança."
 JAP_diplomacy.23.a: "Então devemos reconsiderar nosso próprio caminho"
 JAP_diplomacy.24.t: "Japão Pede o Fim da Pressão Naval dos EUA"
 JAP_diplomacy.24.d: "Tóquio pediu formalmente que reduzamos ou encerremos nossa presença e pressão navais intensificadas em torno de rotas marítimas e pontos de estrangulamento importantes. Autoridades japonesas argumentam que a postura atual corre o risco de escalada e mina o apoio interno à aliança. Em privado, indicam que novas mudanças na interpretação do Artigo 9 podem ser possíveis se aliviarmos nossa postura."
 JAP_diplomacy.24.a: "Encerrar a pressão naval em troca de concessões de segurança"
 JAP_diplomacy.24.b: "Manter nossa pressão naval em torno do Japão"
 JAP_diplomacy.25.t: "Pressão Naval Aliviada, Compromissos Aprofundados"
 JAP_diplomacy.25.d: "Os Estados Unidos concordaram em aliviar sua presença naval intensificada em torno de nossas rotas marítimas, em troca de compromissos de segurança mais profundos do Japão. Na prática, isso significa mais um passo na ampliação da interpretação do Artigo 9 e na expansão de nosso papel na segurança regional. A aliança parece mais forte, mas o debate interno sobre nossa identidade pacifista só se intensificará."
 JAP_diplomacy.25.a: "Pela estabilidade, honraremos este acordo"
 JAP_diplomacy.26.t: "EUA Se Recusam a Encerrar a Pressão Naval"
 JAP_diplomacy.26.d: "Nosso pedido para aliviar ou encerrar a presença naval intensificada dos EUA em torno de nossas rotas marítimas foi rejeitado. Washington insiste que a postura atual é necessária diante das ameaças regionais. Internamente, essa recusa alimentará tanto o temor de ser arrastado para um conflito mais amplo quanto os apelos para fortalecer ainda mais as defesas do próprio Japão."
 JAP_diplomacy.26.a: "Então devemos nos adaptar sob pressão"
 JAP_diplomacy.28.t: "Complicações no Projeto Lunar Kaguya"
 JAP_diplomacy.28.d: "A ambiciosa missão lunar Kaguya enfrenta sérios desafios de projeto. Sistemas-chave estão se mostrando mais complexos que o esperado, da orientação e do gerenciamento de energia à proteção térmica. Engenheiros argumentam que mais recursos e tempo permitirão redesenhar componentes críticos e melhorar a confiabilidade geral, mas o custo de fazê-lo já está levantando sobrancelhas no gabinete."
 JAP_diplomacy.28.a: "Investir no redesenho e manter o cronograma apertado"
 JAP_diplomacy.28.b: "Segurar os custos e aceitar um prazo mais longo"
 JAP_diplomacy.29.t: "Vulnerabilidades nas Comunicações do Kaguya"
 JAP_diplomacy.29.d: "À medida que os testes continuam, o programa Kaguya revela fraquezas nas comunicações e nos enlaces de dados do espaço profundo. A integridade do sinal, a largura de banda e a resistência a interferências estão todas abaixo da meta. Especialistas propõem novas antenas, estações terrestres modernizadas e criptografia mais robusta, mas essas melhorias exigirão capital político e financeiro adicional."
 JAP_diplomacy.29.a: "Modernizar a arquitetura de comunicações"
 JAP_diplomacy.29.b: "Seguir com os sistemas existentes e torcer pelo melhor"
 JAP_diplomacy.30.t: "Novos Atrasos na Missão Kaguya"
 JAP_diplomacy.30.d: "Contratempos técnicos, problemas de integração e conflitos de cronograma com a infraestrutura de lançamento forçaram mais um atraso na missão lunar Kaguya. Embora os sistemas centrais continuem promissores, o projeto é cada vez mais visto como lento e problemático. Os cientistas insistem que a paciência será recompensada, mas a atenção do público começa a se voltar para outro lugar."
 JAP_diplomacy.30.a: "Aceitar o atraso e seguir rumo à Lua"
 JAP_diplomacy.31.t: "Kaguya Alcança a Superfície Lunar"
 JAP_diplomacy.31.d: "Após anos de revisões de projeto, melhorias nas comunicações e atrasos difíceis, a missão Kaguya finalmente teve sucesso. O hardware japonês agora opera na Lua e ao redor dela, devolvendo imagens de alta resolução e dados científicos inestimáveis. A conquista exibe as capacidades de alta tecnologia do Japão e abre novos caminhos para o desenvolvimento de satélites, a exploração do espaço profundo e aplicações espaciais estratégicas."
 JAP_diplomacy.31.a: "Celebrar o Kaguya como um triunfo da tecnologia japonesa"
 jap_kaguya_satellite_invest_tt: "§GPor termos investido em um projeto melhor da espaçonave, obtivemos:§!"
 jap_kaguya_rocketry_invest_tt: "§GPor termos investido em melhores comunicações com a espaçonave, obtivemos:§!"
 JAP_diplomacy.32.t: "Anomalia no Software de Orientação"
 JAP_diplomacy.32.d: "Engenheiros da missão a Marte relatam uma anomalia recorrente no software de orientação. Embora o problema ainda não seja crítico, ele pode se agravar em sérios erros de navegação se não for tratado. Corrigi-lo por completo desviará recursos de outros projetos e pode afetar o cronograma geral."
 JAP_diplomacy.32.a: "Desviar recursos e resolver corretamente"
 JAP_diplomacy.32.b: "Aceitar atrasos e corrigir aos poucos"
 JAP_diplomacy.33.t: "Nomeando a Colônia em Marte"
 JAP_diplomacy.33.d: "O Japão garantiu uma presença permanente em Marte. À medida que os habitats entram em operação e as primeiras tripulações de longa duração se estabelecem, aguarda uma decisão simbólica: o nome oficial e o caráter da colônia."
 JAP_diplomacy.33.a: "'Amaterasu', um símbolo radiante de unidade"
 JAP_diplomacy.33.b: "'Kagutsuchi', uma forja industrial em chamas"
 JAP_diplomacy.33.c: "'Tsukuyomi', um observatório sereno na escuridão"
 JAP_diplomacy.33.e: "'Susanoo', uma fronteira marcial tocada pela tempestade"
 JAP_diplomacy.68.t: "Japão Exige Sacalina"
 JAP_diplomacy.68.d: "O Japão emitiu uma exigência formal pela devolução de Sacalina. Aceitar aliviaria as tensões, mas seria visto como uma concessão humilhante."
 JAP_diplomacy.68.a: "Aceitar a exigência"
 JAP_diplomacy.68.b: "Rejeitá-la de imediato"
 JAP_diplomacy.69.t: "Sacalina Devolvida"
 JAP_diplomacy.69.d: "Moscou aceitou nossa exigência. Sacalina está agora sob administração japonesa. O governo apresentará isso como prova de que a ordem imperial está retornando."
 JAP_diplomacy.69.a: "Uma correção histórica"
 JAP_diplomacy.70.t: "A Rússia Recusa"
 JAP_diplomacy.70.d: "Moscou recusou nossa exigência por Sacalina. Podemos engolir o insulto por ora, testar a Rússia com um conflito de fronteira limitado ou nos comprometer totalmente com a guerra."
 JAP_diplomacy.70.a: "Recuar por ora"
 JAP_diplomacy.70.b: "Lançar uma guerra de fronteira"
 JAP_diplomacy.70.c: "Declarar guerra total"
 JAP_diplomacy.71.t: "Japão Exige as Ilhas Curilas do Norte"
 JAP_diplomacy.71.d: "O Japão emitiu uma exigência formal pela devolução das Ilhas Curilas do Norte. Aceitar aliviaria as tensões, mas seria visto como uma concessão humilhante."
 JAP_diplomacy.71.a: "Aceitar a exigência"
 JAP_diplomacy.71.b: "Rejeitá-la de imediato"
 JAP_diplomacy.72.t: "Ilhas Curilas do Norte Devolvidas"
 JAP_diplomacy.72.d: "Moscou aceitou nossa exigência. As Ilhas Curilas do Norte estão agora sob administração japonesa. O governo apresentará isso como prova de que a ordem imperial está retornando."
 JAP_diplomacy.72.a: "Uma correção histórica"
 JAP_diplomacy.73.t: "A Rússia Recusa"
 JAP_diplomacy.73.d: "Moscou recusou nossa exigência pelas Ilhas Curilas do Norte. Podemos engolir o insulto por ora, testar a Rússia com um conflito de fronteira limitado ou nos comprometer totalmente com a guerra."
 JAP_diplomacy.73.a: "Recuar por ora"
 JAP_diplomacy.73.b: "Lançar uma guerra de fronteira"
 JAP_diplomacy.73.c: "Declarar guerra total"
 JAP_diplomacy.74.t: "Japão Exige as Ilhas Curilas do Sul"
 JAP_diplomacy.74.d: "O Japão emitiu uma exigência formal pela devolução das Ilhas Curilas do Sul. Aceitar aliviaria as tensões, mas seria visto como uma concessão humilhante."
 JAP_diplomacy.74.a: "Aceitar a exigência"
 JAP_diplomacy.74.b: "Rejeitá-la de imediato"
 JAP_diplomacy.75.t: "Ilhas Curilas do Sul Devolvidas"
 JAP_diplomacy.75.d: "Moscou aceitou nossa exigência. As Ilhas Curilas do Sul estão agora sob administração japonesa. O governo apresentará isso como prova de que a ordem imperial está retornando."
 JAP_diplomacy.75.a: "Uma correção histórica"
 JAP_diplomacy.76.t: "A Rússia Recusa"
 JAP_diplomacy.76.d: "Moscou recusou nossa exigência pelas Ilhas Curilas do Sul. Podemos engolir o insulto por ora, testar a Rússia com um conflito de fronteira limitado ou nos comprometer totalmente com a guerra."
 JAP_diplomacy.76.a: "Recuar por ora"
 JAP_diplomacy.76.b: "Lançar uma guerra de fronteira"
 JAP_diplomacy.76.c: "Declarar guerra total"
 JAP_diplomacy.77.t: "Tóquio Propõe um Acordo"
 JAP_diplomacy.77.d: "Com as Ilhas Curilas e Sacalina agora sob controle japonês, Tóquio agiu rapidamente para transformar os ganhos no campo de batalha em um acordo formal. Diplomatas japoneses procuraram Moscou com uma proposta para encerrar o conflito, argumentando que a guerra já decidiu a questão e que continuar lutando apenas prolongaria o inevitável.\nA oferta é direta: paz em troca de a Rússia reconhecer formalmente o controle japonês sobre as Ilhas Curilas e Sacalina. Na visão de Tóquio, é um arranjo prático destinado a estabilizar a região e evitar que a guerra se agrave ainda mais. Agora a decisão está conosco. Aceitar a nova realidade e encerrar a guerra, ou rejeitar a proposta e continuar a luta."
 JAP_diplomacy.77.a: "Aceitar o acordo."
 JAP_diplomacy.77.b: "Rejeitá-lo. A guerra continua."
 JAP_diplomacy.78.t: "Acordo Aceito"
 JAP_diplomacy.78.d: "A proposta é aceita, e as armas começam a se calar. São emitidas ordens para recuar, os canais diplomáticos são reabertos e a guerra se reduz a um conjunto de cláusulas e coordenadas.\n\nAs ilhas do Norte são transferidas como preço da paz, e todos os lados precisam agora vender o resultado ao seu próprio público. A campanha termina, mas a memória não."
 JAP_diplomacy.78.a: "Assim seja. Que a tinta substitua o sangue."
 JAP_diplomacy.79.t: "Acordo Rejeitado"
 JAP_diplomacy.79.d: "A resposta do outro lado é um não categórico. Não haverá assinaturas, nem reconhecimento, nem pausa para tomar fôlego.\n\nTóquio interpretou mal a nossa determinação, e o conflito continuará até que um dos lados não consiga mais sustentá-lo. Se a paz vier, será forçada."
 JAP_diplomacy.79.a: "Então continuaremos a lutar."
 JAP_diplomacy.80.t: "Moscou Busca uma Saída"
 JAP_diplomacy.80.d: "Após os avanços do Japão no norte, diplomatas russos sinalizam disposição de encerrar os combates antes que a situação piore. A mensagem é pragmática: estancar a sangria, congelar as linhas e impedir que a guerra consuma mais recursos do que qualquer lado possa justificar.\n\nA oferta é uma paz direta, trocando a escalada contínua pelo fim imediato das hostilidades. Devemos decidir se aceitamos um acordo imperfeito ou se pressionamos ainda mais nossa vantagem."
 JAP_diplomacy.80.a: "Aceitar a paz."
 JAP_diplomacy.80.b: "Não. Seguimos em frente."
 JAP_diplomacy.81.t: "Tóquio Aceita a Paz"
 JAP_diplomacy.81.d: "O Japão concorda com os termos, optando por encerrar a guerra em vez de ampliá-la. A decisão é impopular em partes do país, e o custo é sentido internamente à medida que a confiança despenca e o público questiona por que a luta começou, afinal.\n\nUma paz branca é declarada, e as concessões territoriais são executadas. O campo de batalha silencia, mas o dano político perdurará."
 JAP_diplomacy.81.a: "Engoliremos isto e resistiremos."
 JAP_diplomacy.82.t: "Tóquio Recusa"
 JAP_diplomacy.82.d: "O Japão rejeita a proposta e sinaliza que não aceitará um acordo redigido a partir da fraqueza. Os combates continuarão, e as apostas sobem a cada semana que passa.\n\nSe a paz vier, não será oferecida. Será tomada."
 JAP_diplomacy.82.a: "Que assim seja."
 JAP_unlock_sikhalin_raid_tt: "Desbloqueia §YIncursão de Forças Especiais§! em §Y$STATE_691$§!"
 JAP_diplomacy.83.t: "Vitória nas Curilas do Sul"
 JAP_diplomacy.83.d: "As forças japonesas prevaleceram nas Curilas do Sul, empurrando as unidades russas para trás e tomando o controle do terreno disputado. O resultado é pequeno no mapa, mas alto em sua mensagem: o Japão pode tomar o que reivindica e mantê-lo sob pressão.\n\nA bandeira é hasteada, a guarnição se entrincheira e Tóquio se prepara para o próximo movimento. Moscou não esquecerá isto."
 JAP_diplomacy.83.a: "Garantir as ilhas."
 JAP_diplomacy.84.t: "Derrota nas Curilas do Sul"
 JAP_diplomacy.84.d: "O choque na fronteira nas Curilas do Sul saiu contra nós. A resistência russa se manteve firme, e nossas forças foram obrigadas a recuar sob fogo, deixando a questão da soberania sem solução e nossa liderança sob escrutínio.\n\nAprendemos lições dolorosas no processo. A próxima tentativa será mais bem planejada, melhor abastecida e mais difícil de deter."
 JAP_diplomacy.84.a: "Aprender com o revés."
 JAP_diplomacy.85.t: "Revés nas Curilas do Sul"
 JAP_diplomacy.85.d: "As forças russas não conseguiram manter as Curilas do Sul diante de um avanço japonês determinado. A perda tática imediata é dura, e o sinal político é ainda mais duro: a fronteira é vulnerável, e o adversário está disposto a pagar para mudá-la.\n\nMoscou terá de decidir se escala ou se aceita um novo e humilhante fato no terreno."
 JAP_diplomacy.85.a: "Uma lição amarga."
 JAP_diplomacy.86.t: "Curilas do Sul Asseguradas"
 JAP_diplomacy.86.d: "As tropas russas venceram o choque na fronteira e asseguraram as Curilas do Sul, repelindo as unidades japonesas e restaurando o controle ao longo da linha. A operação demonstra prontidão e a capacidade de punir incursões rapidamente.\n\nTóquio pode chamar de revés temporário, mas a mensagem é clara. As ilhas não serão tomadas a baixo custo."
 JAP_diplomacy.86.a: "Manter a linha."
 JAP_diplomacy.87.t: "Vitória nas Curilas do Norte"
 JAP_diplomacy.87.d: "O Japão alcançou um avanço decisivo nas Curilas do Norte, forçando as unidades russas a recuar e deixando as ilhas sob nosso controle. A operação prova que até um terreno remoto pode ser tomado quando planejamento, momento e determinação se alinham.\n\nA ocupação começa imediatamente. Os suprimentos fluem, as defesas se erguem e a fronteira norte é reescrita pela ação."
 JAP_diplomacy.87.a: "Entrincheirar-se e se preparar."
 JAP_diplomacy.88.t: "Derrota nas Curilas do Norte"
 JAP_diplomacy.88.d: "As Curilas do Norte resistiram ao nosso ataque. Os combates foram duros, as condições piores, e as forças russas conseguiram frear nosso avanço e forçar uma retirada.\n\nVoltamos com experiência paga em sangue e fadiga. Da próxima vez, não chegaremos despreparados."
 JAP_diplomacy.88.a: "Vamos nos adaptar."
 JAP_diplomacy.89.t: "Perda nas Curilas do Norte"
 JAP_diplomacy.89.d: "A Rússia foi expulsa de posições nas Curilas do Norte após uma operação japonesa bem-sucedida. A perda não é apenas territorial, é psicológica, sinalizando que a distância e o clima já não são defesas confiáveis.\n\nUma resposta será exigida, mas a retaliação traz seus próprios riscos. A situação está se deteriorando rapidamente."
 JAP_diplomacy.89.a: "Isto não pode ficar assim."
 JAP_diplomacy.90.t: "Curilas do Norte Mantidas"
 JAP_diplomacy.90.d: "As forças russas derrotaram a incursão e mantiveram as Curilas do Norte, repelindo as unidades japonesas e restaurando o controle em condições difíceis. A defesa afiou a doutrina e elevou a confiança em toda a cadeia de comando.\n\nSe o Japão quer essas ilhas, terá de se comprometer com muito mais do que um choque de fronteira."
 JAP_diplomacy.90.a: "Manter a prontidão."
 JAP_diplomacy.91.t: "A Rússia Responde em Sacalina"
 JAP_diplomacy.91.d: "As ações japonesas em Sacalina provocaram uma resposta imediata de Moscou. A liderança russa enquadra a ação como um desafio direto à soberania e sinaliza que não tolerará novos avanços sem consequências.\n\nA crise agora se bifurca em dois caminhos: escalada para a guerra aberta ou pressão coercitiva por meio de medidas econômicas e restrição marítima. De qualquer forma, a temperatura subiu além do ponto da diplomacia calma."
 JAP_diplomacy.91.a: "Isto vai virar uma guerra."
 JAP_diplomacy.91.b: "Sufocá-los com embargo e bloqueio."
 JAP_diplomacy.92.t: "A Rússia Responde à Tomada de Sacalina"
 JAP_diplomacy.92.d: "Sacalina mudou de mãos, e Moscou deve agora decidir como responder a uma humilhação tão perto de casa. A guerra seria custosa, mas deixar de responder convidaria a novas perdas e enfraqueceria a autoridade do Estado.\n\nA Rússia pode escolher a escalada e tentar reverter o resultado pela força, ou aceitar uma paz temporária que encerre os combates exigindo a devolução de Sacalina como preço para parar. A decisão definirá a próxima fase do conflito."
 JAP_diplomacy.92.a: "Vamos retomá-la à força."
 JAP_diplomacy.92.b: "Forçar um acordo. Sacalina deve ser devolvida."
 JAP_diplomacy.94.t: "Tóquio Exige um Protetorado"
 JAP_diplomacy.94.d: "Chega do Japão uma nota formal, despida de diplomacia e carregada de intenção. A Seul é oferecida uma escolha apresentada como estabilidade: aceitar a supervisão japonesa sobre a política externa e os assuntos de segurança, alinhar as instituições à direção de Tóquio e evitar um confronto destrutivo.\n\nA mensagem é clara. O Japão já não pede cooperação, dita os termos. A recusa será tratada como desafio, e o desafio trará consequências."
 JAP_diplomacy.94.a: "Não temos escolha senão aceitar."
 JAP_diplomacy.94.b: "Recusar. A Coreia não se curvará."
 JAP_diplomacy.95.t: "A Coreia do Sul Se Submete"
 JAP_diplomacy.95.d: "Seul aceita os termos, escolhendo a sobrevivência em vez da soberania. Os acordos são assinados sob pressão, conselheiros chegam e a postura externa do Estado é incorporada ao desenho estratégico do Japão.\n\nA guerra termina, mas começa um tipo diferente de luta. A Coreia continua no mapa, mas seu rumo já não é seu."
 JAP_diplomacy.95.a: "Estabelecer o protetorado."
 JAP_diplomacy.96.t: "A Coreia do Sul Desafia Tóquio"
 JAP_diplomacy.96.d: "Seul rejeita o ultimato e declara que sua soberania não é negociável. A recusa transforma a crise de coerção em confronto, e Tóquio tem agora todo o pretexto de que precisa para alegar que a questão só pode ser resolvida pela força.\n\nSe o Japão queria uma submissão, recebeu um desafio."
 JAP_diplomacy.96.a: "Então imporemos nossa vontade."
 JAP_diplomacy.97.t: "Tóquio Emite um Ultimato a Pyongyang"
 JAP_diplomacy.97.d: "O Japão entregou um ultimato a Pyongyang, oferecendo um futuro de contenção sob supervisão ou um futuro de ruína sob bombardeio. Os termos são diretos: entregar a política externa e a autonomia estratégica à direção de Tóquio, aceitar arranjos de segurança monitorados e se submeter a um arcabouço criado para impedir que o Norte volte a ser uma ameaça.\n\nPara o regime, isto é humilhação. Para o Japão, é gestão de risco. A questão é se Pyongyang escolherá a sobrevivência ou o desafio."
 JAP_diplomacy.97.a: "Aceitar. Preservar o Estado a qualquer custo."
 JAP_diplomacy.97.b: "Rejeitar. Não nos submeteremos."
 JAP_diplomacy.98.t: "Pyongyang Cede"
 JAP_diplomacy.98.d: "Contra todas as expectativas, o Norte aceita os termos. O regime mantém seus símbolos, mas sua liberdade de ação é quebrada, pois a supervisão japonesa remodela fronteiras, segurança e relações exteriores.\n\nOs combates terminam, e a metade norte da península torna-se uma zona-tampão controlada. Uma ameaça é neutralizada, e Tóquio ganha uma alavanca que não largará facilmente."
 JAP_diplomacy.98.a: "Estabelecer o protetorado."
 JAP_diplomacy.99.t: "Pyongyang Desafia Tóquio"
 JAP_diplomacy.99.d: "Pyongyang rejeita o ultimato e escolhe o desafio, apostando que o medo e a escalada protegerão o regime. A recusa transforma a crise num teste de vontades, e Tóquio tem agora a justificativa para alegar que o Norte só pode ser subjugado pela força.\n\nA península se prepara para a guerra. A próxima mensagem não será uma nota, será fogo."
 JAP_diplomacy.99.a: "Então acabaremos nós mesmos com a ameaça."
 JAP_diplomacy.101.t: "Tóquio Exige a Submissão de Taiwan"
 JAP_diplomacy.101.d: "O Japão entregou uma exigência direta a Taipé: aceitar um arcabouço de protetorado e colocar a política externa e a coordenação de defesa sob a supervisão de Tóquio, ou enfrentar isolamento e força. A oferta é embalada como segurança e estabilidade, prometendo proteção contra ameaças externas em troca de obediência política.\n\nPor trás da linguagem formal há uma mensagem simples. A ilha é importante demais para ser deixada independente, e o Japão pretende decidir seu futuro."
 JAP_diplomacy.101.a: "Aceitar os termos. Evitar a catástrofe."
 JAP_diplomacy.101.b: "Rejeitá-los. Taiwan não se submeterá."
 JAP_diplomacy.102.t: "Taipé Aceita"
 JAP_diplomacy.102.d: "Taiwan aceita o ultimato, escolhendo a sobrevivência e a continuidade em vez do conflito aberto. Novos acordos vinculam sua postura externa ao Japão, conselheiros chegam e a tomada de decisões estratégicas é discretamente deslocada para Tóquio.\n\nA guerra termina, mas a soberania se restringe ao que o protetor permite. A ilha permanece, mas seu rumo já não é totalmente seu."
 JAP_diplomacy.102.a: "Estabelecer o protetorado."
 JAP_diplomacy.103.t: "Taipé Recusa"
 JAP_diplomacy.103.d: "Taiwan rejeita a exigência do Japão e se recusa a trocar autonomia por uma promessa de proteção. A decisão transforma a pressão diplomática em uma crise de força, e Tóquio tem agora a justificativa para argumentar que a ilha só pode ser garantida pela conquista.\n\nO estreito se torna uma linha de falha. O próximo passo não será negociação, será mobilização."
 JAP_diplomacy.103.a: "Então tomaremos o que precisamos."
 JAP_diplomacy.105.t: "Tóquio Exige um Protetorado nas Filipinas"
 JAP_diplomacy.105.d: "O Japão emitiu uma exigência a Manila que deixa pouco espaço para mal-entendidos. Aceitar um arcabouço de protetorado, alinhar a política externa e o planejamento de defesa a Tóquio e permitir a supervisão japonesa de arranjos de segurança importantes, ou enfrentar as consequências da recusa.\n\nA oferta é apresentada como estabilidade e proteção, mas seu propósito é o controle das rotas marítimas e da porta de entrada entre oceanos. As Filipinas devem agora escolher entre submissão e confronto."
 JAP_diplomacy.105.a: "Aceitar. Preservar a nação da destruição."
 JAP_diplomacy.105.b: "Recusar. Não seremos governados a partir de Tóquio."
 JAP_diplomacy.106.t: "Manila Se Submete"
 JAP_diplomacy.106.d: "O governo filipino aceita os termos do Japão. Os acordos são assinados, os assessores chegam e a postura externa do país é incorporada ao desenho marítimo japonês.\n\nOs combates terminam, mas o custo é a soberania. O arquipélago permanece, porém suas decisões estratégicas serão tomadas com Tóquio vigiando cada passo."
 JAP_diplomacy.106.a: "Estabelecer o protetorado."
 JAP_diplomacy.107.t: "Manila desafia Tóquio"
 JAP_diplomacy.107.d: "As Filipinas rejeitam o ultimato e se recusam a trocar a independência por uma promessa de proteção. A recusa transforma a coerção japonesa em um teste de força, e Tóquio agora tem todos os pretextos para alegar que o arquipélago deve ser garantido pelas armas.\n\nAs rotas marítimas se estreitam, as frotas começam a se posicionar e a região se prepara para a guerra. O próximo movimento não será diplomático."
 JAP_diplomacy.107.a: "Então tomaremos o arquipélago."
 JAP_diplomacy.109.t: "O Ultimato dos Estreitos"
 JAP_diplomacy.109.d: "Uma nota japonesa chega com o tom calmo da inevitabilidade. Kuala Lumpur recebe a oferta de um protetorado que vincula a política externa e a coordenação de segurança à direção de Tóquio, justificado como o preço da estabilidade numa região em que rotas marítimas e pontos de estrangulamento decidem a sobrevivência.\n\nA mensagem não é um pedido. O Japão pretende comandar os Estreitos, e espera-se que a Malásia obedeça. A aceitação promete proteção; a recusa atrai todo o peso da coerção marítima."
 JAP_diplomacy.109.a: "Aceitar. Não podemos lutar contra a maré."
 JAP_diplomacy.109.b: "Recusar. Nossa soberania não está à venda."
 JAP_diplomacy.110.t: "Kuala Lumpur se curva ao Sol Nascente"
 JAP_diplomacy.110.d: "A Malásia aceita os termos, trocando a independência estratégica pela sobrevivência imediata. Os acordos são assinados, as missões de ligação chegam e Tóquio ganha as chaves dos corredores que conectam dois oceanos.\n\nA guerra termina, mas o custo é evidente. A Malásia permanece intacta, porém sua postura externa agora se move à sombra do Japão."
 JAP_diplomacy.110.a: "Estabelecer o protetorado."
 JAP_diplomacy.111.t: "A Malásia rejeita a Ordem dos Estreitos"
 JAP_diplomacy.111.d: "A Malásia rejeita o ultimato e se recusa a deixar que seu futuro seja ditado por Tóquio. A decisão transforma a pressão japonesa em um confronto pelo corredor marítimo mais valioso da região.\n\nTóquio não tolerará desafios nos Estreitos. Se a Malásia não se submeter por tratado, o Japão buscará a submissão pela força."
 JAP_diplomacy.111.a: "Então tomaremos os Estreitos."
 JAP_diplomacy.113.t: "O Édito do Arquipélago"
 JAP_diplomacy.113.d: "Tóquio emitiu uma exigência a Jacarta que atinge o cerne da independência da Indonésia. A proposta é um protetorado que coloca a política externa e a segurança estratégica sob supervisão japonesa, justificado como a única forma de garantir estabilidade nas cadeias de ilhas que unem dois oceanos.\n\nA linguagem é polida, mas a intenção é absoluta. O Japão quer o arquipélago indonésio como um corredor controlado, não como um parceiro soberano. Aceitar significa segurança sob uma sombra; recusar significa que a sombra se torna tempestade."
 JAP_diplomacy.113.a: "Aceitar. Não podemos suportar um estrangulamento naval."
 JAP_diplomacy.113.b: "Recusar. A Indonésia não receberá ordens."
 JAP_diplomacy.114.t: "Jacarta aceita o Édito"
 JAP_diplomacy.114.d: "A Indonésia aceita os termos e se submete a uma nova realidade marítima. Missões japonesas chegam para supervisionar a coordenação de segurança, os direitos de bases e o alinhamento externo, transformando o arquipélago em um corredor administrado dentro da esfera estratégica de Tóquio.\n\nA guerra termina, mas a independência se reduz ao que é permitido. As ilhas continuam indonésias no nome, porém seu rumo agora é limitado pelo poder japonês."
 JAP_diplomacy.114.a: "Estabelecer o protetorado."
 JAP_diplomacy.115.t: "A Indonésia desafia o Édito do Arquipélago"
 JAP_diplomacy.115.d: "Jacarta rejeita a exigência do Japão e se recusa a trocar a soberania por promessas de estabilidade. A recusa transforma a pressão em confronto, e Tóquio agora trata a independência indonésia como um obstáculo a ser removido, e não como um fato a ser respeitado.\n\nOs mares ao redor do arquipélago ficam tensos. Se a Indonésia não ceder por tratado, o Japão buscará impor a obediência pelas armas."
 JAP_diplomacy.115.a: "Então tomaremos os corredores."
 JAP_diplomacy.117.t: "A Escolha de Tonquim"
 JAP_diplomacy.117.d: "Tóquio entregou a Hanói uma exigência projetada para prender o Vietnã à ordem marítima japonesa. A oferta é um protetorado em tudo, menos no nome: alinhar a política externa, aceitar a supervisão de segurança japonesa e permitir acessos estratégicos que transformam o litoral vietnamita em extensão do alcance do Japão.\n\nA mensagem é apresentada como proteção contra predadores maiores, mas também é uma coleira. O Vietnã deve decidir se aceita sobreviver sob restrições ou resiste e atrai uma guerra travada em suas costas."
 JAP_diplomacy.117.a: "Aceitar. Vamos nos curvar, por ora."
 JAP_diplomacy.117.b: "Recusar. O Vietnã não será acorrentado."
 JAP_diplomacy.118.t: "Hanói aceita os termos de Tóquio"
 JAP_diplomacy.118.d: "O Vietnã aceita o ultimato. Os acordos são assinados, oficiais de ligação chegam e o Japão ganha influência decisiva sobre o alinhamento externo e a segurança costeira vietnamitas.\n\nA guerra termina, mas a independência se estreita. O Vietnã permanece, porém sua postura estratégica agora se move dentro de um arcabouço escrito em Tóquio."
 JAP_diplomacy.118.a: "Estabelecer o protetorado."
 JAP_diplomacy.119.t: "Hanói rejeita a Escolha de Tonquim"
 JAP_diplomacy.119.d: "O Vietnã rejeita a exigência do Japão e se recusa a trocar a soberania por uma promessa de segurança. A recusa transforma a coerção em confronto, e Tóquio agora trata o Vietnã como uma barreira a ser removida de seu desenho regional.\n\nO litoral se torna linha de frente. Se o Vietnã não se submeter por tratado, o Japão buscará a submissão pela força."
 JAP_diplomacy.119.a: "Então tomaremos a costa."
 JAP_diplomacy.121.t: "O Ultimato do Mekong"
 JAP_diplomacy.121.d: "Uma delegação japonesa chega com uma proposta que soa menos como diplomacia e mais como um veredito. O Camboja recebe a oferta de proteção sob a supervisão de Tóquio, com a coordenação da política externa e os arranjos de segurança colocados dentro do arcabouço regional japonês.\n\nO discurso é de estabilidade, investimento e segurança contra vizinhos mais fortes. A realidade é a subordinação. Phnom Penh deve escolher entre aceitar um futuro vigiado ou arriscar-se a virar campo de batalha por recusar."
 JAP_diplomacy.121.a: "Aceitar. A sobrevivência vem primeiro."
 JAP_diplomacy.121.b: "Recusar. O Camboja não se submeterá."
 JAP_diplomacy.122.t: "Phnom Penh aceita"
 JAP_diplomacy.122.d: "O Camboja aceita os termos e cede autonomia estratégica para evitar uma guerra que não pode vencer. Novos acordos vinculam o Estado à direção japonesa, e os assessores de Tóquio se movem rapidamente para controlar ministérios e pontos de acesso importantes.\n\nOs combates terminam antes de começar. O Camboja continua soberano no nome, mas seu caminho agora é limitado pelo poder japonês."
 JAP_diplomacy.122.a: "Estabelecer o protetorado."
 JAP_diplomacy.123.t: "O Camboja rejeita o Ultimato do Mekong"
 JAP_diplomacy.123.d: "Phnom Penh rejeita a exigência do Japão e se recusa a entregar seu futuro à supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata o Camboja como um elo fraco que precisa ser colocado na linha.\n\nA diplomacia fracassou. Se o Camboja não aceitar o arcabouço, o Japão buscará impô-lo pela força."
 JAP_diplomacy.123.a: "Então imporemos a obediência."
 JAP_diplomacy.125.t: "A Diretiva do Interior do Mekong"
 JAP_diplomacy.125.d: "O Japão emitiu uma exigência a Vientiane com o objetivo de garantir a retaguarda tranquila atrás da costa. A proposta é um protetorado que vincula o Laos à direção estratégica de Tóquio, colocando a política externa e a coordenação de segurança sob supervisão japonesa.\n\nA oferta é apresentada como desenvolvimento e proteção. O significado é claro: corredores, rios e fronteiras serão administrados para servir à esfera mais ampla do Japão. O Laos deve decidir se aceita a diretiva ou aposta na resistência."
 JAP_diplomacy.125.a: "Aceitar. Não podemos ficar sozinhos."
 JAP_diplomacy.125.b: "Recusar. O Laos não receberá ordens."
 JAP_diplomacy.126.t: "Vientiane aceita"
 JAP_diplomacy.126.d: "O Laos aceita os termos do Japão, escolhendo sobrevivência e estabilidade em vez de uma guerra que não pode custear. Os acordos são assinados, escritórios de coordenação são estabelecidos e o Laos é incorporado ao arcabouço regional de Tóquio como um interior controlado.\n\nOs combates terminam, mas a autonomia diminui. O Laos permanece, porém suas escolhas estratégicas agora se movem dentro de limites definidos pelo Japão."
 JAP_diplomacy.126.a: "Estabelecer o protetorado."
 JAP_diplomacy.127.t: "O Laos rejeita a Diretiva"
 JAP_diplomacy.127.d: "Vientiane rejeita a exigência do Japão e se recusa a entregar seu futuro à supervisão externa. A recusa transforma a coerção em confronto, e Tóquio agora trata o Laos como um obstáculo ao controle dos corredores, e não como um parceiro a ser cortejado.\n\nSe o Laos não aceitar o arcabouço por tratado, o Japão buscará impô-lo pela força."
 JAP_diplomacy.127.a: "Então os faremos obedecer."
 JAP_diplomacy.129.t: "O Ultimato da Âncora Sul"
 JAP_diplomacy.129.d: "Tóquio entregou a Camberra um ultimato que trata a Austrália não como um continente distante, mas como a pedra angular do Pacífico Sul. Os termos são duros: aceitar um protetorado, alinhar a política externa e o planejamento de defesa ao Japão e permitir os acordos de bases e acesso que prenderiam o Pacífico Sul ao alcance de Tóquio.\n\nA oferta vem disfarçada de estabilidade e segurança garantida. A realidade é a submissão estratégica. A Austrália deve decidir se aceita viver sob a sombra japonesa ou se prepara para disputar o próprio oceano."
 JAP_diplomacy.129.a: "Aceitar. Não podemos vencer uma guerra pelo Pacífico."
 JAP_diplomacy.129.b: "Recusar. A Austrália não se curvará."
 JAP_diplomacy.130.t: "Camberra aceita os termos da Âncora"
 JAP_diplomacy.130.d: "A Austrália aceita o ultimato do Japão, escolhendo a sobrevivência imediata em vez de uma guerra continental que não pode arriscar. Os acordos são assinados, o acesso estratégico é concedido e o Japão ganha a âncora meridional que buscava para dominar o oceano em sentido amplo.\n\nOs canhões silenciam, mas o equilíbrio do Pacífico muda da noite para o dia. A Austrália continua no mapa, porém suas decisões estratégicas agora se movem dentro de limites definidos em Tóquio."
 JAP_diplomacy.130.a: "Estabelecer o protetorado."
 JAP_diplomacy.131.t: "A Austrália rejeita o Ultimato"
 JAP_diplomacy.131.d: "Camberra rejeita a exigência do Japão e se recusa a entregar a independência do continente a um mandato estrangeiro. A recusa transforma a pressão de Tóquio em um desafio direto, e o Japão agora enquadra a Austrália como o último obstáculo a uma ordem do Pacífico sob seu controle.\n\nUma disputa pelo oceano é inevitável. Se a Austrália não aceitar o arcabouço por tratado, o Japão tentará impô-lo pela força."
 JAP_diplomacy.131.a: "Então garantiremos o sul pelas armas."
 JAP_diplomacy.133.t: "A Exigência da Linha do Tasman"
 JAP_diplomacy.133.d: "Tóquio entregou a Wellington uma exigência destinada a fechar o último flanco aberto no Pacífico Sul. A proposta é um protetorado que vincula a política externa e a postura de defesa da Nova Zelândia à direção japonesa, justificado como o custo da estabilidade num oceano que está sendo reorganizado pela força.\n\nA linguagem fala de proteção e parceria, mas a estrutura é de controle. A Nova Zelândia deve escolher entre uma paz restrita sob a sombra japonesa ou uma guerra de independência através do mar."
 JAP_diplomacy.133.a: "Aceitar. Vamos resistir e sobreviver."
 JAP_diplomacy.133.b: "Recusar. Não seremos absorvidos."
 JAP_diplomacy.134.t: "Wellington aceita a Linha do Tasman"
 JAP_diplomacy.134.d: "A Nova Zelândia aceita os termos do Japão, trocando autonomia estratégica pelo fim das hostilidades. Os acordos são assinados, os arranjos de acesso são estabelecidos e Tóquio ganha um posto avançado seguro ao sul para moldar o oceano em sentido amplo.\n\nA guerra termina, mas a independência se estreita. A Nova Zelândia permanece, porém sua postura externa agora se move dentro de limites traçados em Tóquio."
 JAP_diplomacy.134.a: "Estabelecer o protetorado."
 JAP_diplomacy.135.t: "Wellington rejeita a Exigência"
 JAP_diplomacy.135.d: "A Nova Zelândia rejeita o ultimato do Japão e se recusa a entregar seu futuro a um mandato estrangeiro. A recusa transforma a pressão em confronto, e Tóquio agora trata a independência de Wellington como uma ameaça ao seu perímetro meridional.\n\nO Pacífico se endurece em linhas de frente. Se a Nova Zelândia não aceitar o arcabouço por tratado, o Japão tentará impô-lo pela força."
 JAP_diplomacy.135.a: "Então tomaremos o posto avançado do sul."
 JAP_diplomacy.137.t: "O Ultimato do Portal do Irauádi"
 JAP_diplomacy.137.d: "Tóquio emitiu uma exigência a Naypyidaw com o objetivo de garantir Mianmar como a ponte terrestre entre oceanos. Os termos equivalem a um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança japonesa e conceder o acesso necessário para controlar os corredores do Golfo de Bengala ao Sudeste Asiático.\n\nA oferta é apresentada como estabilidade e desenvolvimento. A verdade é a captura estratégica. Mianmar deve decidir se aceita uma paz controlada ou enfrenta uma guerra que transformará seus portais em campos de batalha."
 JAP_diplomacy.137.a: "Aceitar. Não podemos resistir a esta pressão."
 JAP_diplomacy.137.b: "Recusar. Não seremos reduzidos a um corredor."
 JAP_diplomacy.138.t: "Mianmar aceita os termos do Portal"
 JAP_diplomacy.138.d: "Mianmar aceita o ultimato do Japão, trocando autonomia estratégica pelo fim das hostilidades e pela promessa de ordem. Os acordos são assinados, missões de ligação chegam e o Japão ganha uma mão decisiva sobre o alinhamento externo e a postura de segurança de Mianmar.\n\nOs combates terminam, mas o preço é a soberania. Mianmar permanece, porém seus portais agora servem a um desenho regional escrito em Tóquio."
 JAP_diplomacy.138.a: "Estabelecer o protetorado."
 JAP_diplomacy.139.t: "Mianmar rejeita o Ultimato"
 JAP_diplomacy.139.d: "Naypyidaw rejeita a exigência do Japão e se recusa a entregar seu futuro à supervisão externa. A recusa transforma a pressão em confronto, e Tóquio agora enquadra Mianmar como um obstáculo ao controle dos corredores que precisa ser colocado na linha.\n\nSe Mianmar não aceitar o arcabouço por tratado, o Japão buscará impô-lo pela força. O portal será garantido de um jeito ou de outro."
 JAP_diplomacy.139.a: "Então tomaremos o portal."
 JAP_diplomacy.141.t: "O Ultimato das Terras Altas do Norte"
 JAP_diplomacy.141.d: "O Japão voltou sua atenção para Kachin, as acidentadas terras altas do norte que controlam passagens, recursos e as vias de acesso à região mais ampla. A exigência de Tóquio é apresentada como proteção e reconhecimento, mas a estrutura é de um protetorado: alinhar-se externamente ao Japão, aceitar a supervisão de segurança e permitir acessos estratégicos que garantam a fronteira.\n\nPara Kachin, trata-se de escolher entre autonomia no nome e aniquilação na prática. A aceitação oferece um escudo. A recusa atrai uma guerra travada em montanhas e vilarejos."
 JAP_diplomacy.141.a: "Aceitar. Precisamos de um patrono para sobreviver."
 JAP_diplomacy.141.b: "Recusar. Não trocaremos um senhor por outro."
 JAP_diplomacy.143.t: "Kachin aceita a proteção japonesa"
 JAP_diplomacy.143.d: "Kachin aceita os termos, escolhendo sobrevivência e estabilidade em vez de uma luta que não consegue sustentar sozinha. Os acordos são assinados, escritórios de ligação são estabelecidos e o Japão ganha um controle firme sobre as terras altas do norte e seus corredores estratégicos.\n\nO conflito termina, mas a liberdade de Kachin se reduz ao que é permitido. As montanhas permanecem, porém seu futuro agora está atrelado a Tóquio."
 JAP_diplomacy.143.a: "Estabelecer o protetorado."
 JAP_diplomacy.144.t: "Kachin rejeita o Ultimato"
 JAP_diplomacy.144.d: "Kachin rejeita a exigência do Japão e se recusa a se submeter a um mandato externo. A recusa transforma a coerção em confronto, e Tóquio agora enquadra as terras altas como um problema de segurança que deve ser resolvido pela força.\n\nSe Kachin não aceitar a proteção por tratado, o Japão imporá o controle pelas armas. As montanhas não permanecerão neutras."
 JAP_diplomacy.144.a: "Então tomaremos as terras altas."
 JAP_diplomacy.145.t: "A Exigência do Corredor Shan"
 JAP_diplomacy.145.d: "O Japão entregou seus termos às autoridades Wa, visando as zonas de fronteira que ficam sobre rotas de contrabando, passagens de montanha e as artérias do interior. A oferta é apresentada como reconhecimento e proteção, mas é um arranjo de protetorado: alinhar-se externamente a Tóquio, aceitar a supervisão de segurança japonesa e permitir o acesso que garanta o corredor.\n\nPara os Wa, a escolha é brutal. Submeter-se e manter o poder local sob um novo guarda-chuva, ou recusar e enfrentar uma guerra que não respeitará montanhas nem milícias."
 JAP_diplomacy.145.a: "Aceitar. Melhor um escudo do que a aniquilação."
 JAP_diplomacy.145.b: "Recusar. Não seremos absorvidos."
 JAP_diplomacy.146.t: "Os Wa aceitam a proteção japonesa"
 JAP_diplomacy.146.d: "Os Wa aceitam os termos do Japão, trocando independência estratégica por sobrevivência e reconhecimento formal sob um patrono mais forte. Equipes de ligação chegam, as rotas são garantidas e as zonas de fronteira são incorporadas ao arcabouço regional japonês.\n\nOs combates terminam, mas a autonomia se estreita. Os Wa mantêm a autoridade local, porém sua direção externa agora responde a Tóquio."
 JAP_diplomacy.146.a: "Estabelecer o protetorado."
 JAP_diplomacy.147.t: "Os Wa rejeitam a Exigência"
 JAP_diplomacy.147.d: "Os Wa rejeitam o ultimato do Japão e se recusam a colocar seu território sob supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata as zonas de fronteira como uma lacuna sem controle em sua estratégia de corredores.\n\nSe os Wa não aceitarem o arcabouço por tratado, o Japão imporá o controle pela força. As montanhas serão disputadas."
 JAP_diplomacy.147.a: "Então garantiremos o corredor."
 JAP_diplomacy.148.t: "O Ultimato do Portal Shan"
 JAP_diplomacy.148.d: "O Japão emitiu sua exigência às autoridades do Estado Shan do Sul, visando as rotas de altitude que ligam o interior à região mais ampla. A proposta é um protetorado: alinhar as relações externas a Tóquio, aceitar a supervisão de segurança japonesa e permitir acesso estratégico para garantir estradas, passagens e corredores de suprimento.\n\nA oferta promete proteção e reconhecimento. O significado é controle. O Shan do Sul deve decidir se aceita um futuro administrado sob o guarda-chuva japonês ou arrisca uma guerra travada em suas colinas e vales."
 JAP_diplomacy.148.a: "Aceitar. Não podemos arcar com a aniquilação."
 JAP_diplomacy.148.b: "Recusar. Não seremos reduzidos a um corredor."
 JAP_diplomacy.149.t: "O Shan do Sul cede"
 JAP_diplomacy.149.d: "O Estado Shan do Sul aceita os termos do Japão. Escritórios de ligação são estabelecidos, as rotas são garantidas e a região é incorporada à estratégia de corredores de Tóquio como um portal controlado, e não como um ator independente.\n\nOs combates terminam, mas a autonomia se contrai. A autoridade local permanece, porém a direção estratégica agora responde ao Japão."
 JAP_diplomacy.149.a: "Estabelecer o protetorado."
 JAP_diplomacy.150.t: "O Shan do Sul rejeita o Ultimato"
 JAP_diplomacy.150.d: "O Estado Shan do Sul rejeita a exigência do Japão e se recusa a colocar seu futuro sob supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata a região como uma lacuna perigosa em seu perímetro estratégico.\n\nSe o Shan do Sul não aceitar o arcabouço por tratado, o Japão o imporá pela força. O portal será garantido."
 JAP_diplomacy.150.a: "Então tomaremos o portal pelas armas."
 JAP_diplomacy.151.t: "O Mandato do Salween"
 JAP_diplomacy.151.d: "O Japão voltou seu olhar para o Estado Karen, onde vales fluviais e rotas de fronteira podem abrir ou fechar as vias de acesso ao sul. A exigência de Tóquio é apresentada como proteção e reconhecimento, mas é um protetorado: alinhar as relações externas ao Japão, aceitar a supervisão de segurança e conceder o acesso que garanta o corredor do Salween.\n\nA oferta promete estabilidade numa região de autoridade fragmentada. O custo é a obediência. O Estado Karen deve escolher entre uma paz vigiada sob o guarda-chuva japonês ou uma guerra que devastará suas travessias e povoados."
 JAP_diplomacy.151.a: "Aceitar. Viveremos para ver o amanhã."
 JAP_diplomacy.151.b: "Recusar. Não seremos governados."
 JAP_diplomacy.152.t: "O Estado Karen se submete"
 JAP_diplomacy.152.d: "O Estado Karen aceita os termos do Japão, trocando autonomia estratégica por sobrevivência e pelo fim da pressão imediata. Missões de ligação chegam, as rotas são garantidas e a região é incorporada ao perímetro de Tóquio como um corredor controlado, e não como um ator independente.\n\nO conflito termina, mas os limites da liberdade se estreitam. A autoridade karen permanece local, porém a direção estratégica agora responde ao Japão."
 JAP_diplomacy.152.a: "Estabelecer o protetorado."
 JAP_diplomacy.153.t: "O Estado Karen rejeita o Mandato"
 JAP_diplomacy.153.d: "O Estado Karen rejeita a exigência do Japão e se recusa a entregar seu futuro à supervisão estrangeira. A recusa transforma a coerção em confronto, e Tóquio agora trata as travessias do Salween como um problema estratégico a ser resolvido pela força.\n\nSe o Estado Karen não aceitar o arcabouço por tratado, o Japão o imporá pelas armas. O corredor será garantido."
 JAP_diplomacy.153.a: "Então tomaremos as travessias."
 JAP_diplomacy.154.t: "A Exigência do Ancoradouro de Palau"
 JAP_diplomacy.154.d: "Tóquio entregou sua exigência a Palau, um pequeno Estado situado sobre uma grande porção do oceano. Os termos são apresentados como proteção e prosperidade garantida, mas a estrutura é de um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder direitos de bases que transformam Palau em um ancoradouro avançado do Império.\n\nA oferta promete segurança contra tempestades, tanto políticas quanto militares. O custo é a soberania. Palau deve escolher entre a submissão sob o Sol Nascente ou uma luta que não pode sustentar contra o poder naval de uma grande potência."
 JAP_diplomacy.154.a: "Aceitar. Melhor um protetor do que um túmulo."
 JAP_diplomacy.154.b: "Recusar. Não entregaremos nossa independência."
 JAP_diplomacy.155.t: "Palau aceita a proteção japonesa"
 JAP_diplomacy.155.d: "Palau aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e as ilhas se tornam um nó disciplinado na rede de portos e aeródromos de Tóquio.\n\nA crise termina sem batalha, mas a mudança é real. Palau permanece no nome, porém sua direção externa agora segue a bússola japonesa."
 JAP_diplomacy.155.a: "Estabelecer o protetorado."
 JAP_diplomacy.156.t: "Palau rejeita a Exigência"
 JAP_diplomacy.156.d: "Palau rejeita o ultimato do Japão e se recusa a trocar a soberania por promessas de proteção. A recusa transforma a pressão de Tóquio numa questão de força, e o Japão agora trata as ilhas como uma lacuna desprotegida em seu perímetro oceânico.\n\nSe Palau não aceitar o arcabouço por tratado, o Japão imporá o controle pelas armas. O ancoradouro será garantido."
 JAP_diplomacy.156.a: "Então tomaremos o ancoradouro."
 JAP_diplomacy.157.t: "O Ultimato da Cadeia da Micronésia"
 JAP_diplomacy.157.d: "O Japão emitiu sua exigência à Micronésia, enxergando as ilhas não como comunidades dispersas, mas como uma cadeia de pontos de apoio através do Pacífico central. A oferta é apresentada como proteção e investimento, mas a estrutura é de um protetorado: alinhar a política externa a Tóquio, aceitar a supervisão de segurança e conceder acesso que transforme as ilhas em pontos de passagem para a frota e o poder aéreo japoneses.\n\nA mensagem é simples. Estas águas serão organizadas sob uma única autoridade. A Micronésia deve escolher entre uma paz administrada sob o guarda-chuva japonês ou um confronto que não tem esperança de sustentar."
 JAP_diplomacy.157.a: "Aceitar. Não podemos resistir à maré."
 JAP_diplomacy.157.b: "Recusar. Não nos tornaremos um posto avançado."
 JAP_diplomacy.158.t: "A Micronésia aceita a Cadeia"
 JAP_diplomacy.158.d: "A Micronésia aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e as ilhas se tornam um corredor controlado de portos, aeródromos e nós de vigilância dentro do perímetro marítimo de Tóquio.\n\nA crise termina sem batalha, mas a soberania se estreita. A Micronésia permanece, porém sua direção externa agora segue a bússola estratégica japonesa."
 JAP_diplomacy.158.a: "Estabelecer o protetorado."
 JAP_diplomacy.159.t: "A Micronésia rejeita o Ultimato"
 JAP_diplomacy.159.d: "A Micronésia rejeita a exigência do Japão e se recusa a entregar seu futuro à supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata a cadeia de ilhas como uma lacuna em sua rede do Pacífico que precisa ser fechada.\n\nSe a Micronésia não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. A cadeia será garantida."
 JAP_diplomacy.159.a: "Então tomaremos os pontos de apoio."
 JAP_diplomacy.160.t: "A Exigência do Posto Avançado de Nauru"
 JAP_diplomacy.160.d: "Tóquio entregou sua exigência a Nauru, tratando a ilha como um alfinete no mapa que ainda pode ancorar vigilância, reabastecimento e alcance sobre águas abertas. A oferta é apresentada como proteção e apoio garantido, mas é um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso que transforme Nauru em um posto avançado do Império.\n\nPara Nauru, a escolha é dura. Submeter-se e sobreviver sob uma potência maior, ou recusar e arriscar-se a ser o campo de batalha que comprova o argumento do Japão."
 JAP_diplomacy.160.a: "Aceitar. Não podemos ficar sozinhos."
 JAP_diplomacy.160.b: "Recusar. Não seremos reduzidos a um ponto de passagem."
 JAP_diplomacy.161.t: "Nauru aceita a proteção japonesa"
 JAP_diplomacy.161.d: "Nauru aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e a ilha se torna um nó pequeno, porém vital, na rede de Tóquio no Pacífico.\n\nA crise termina sem batalha, mas a soberania se estreita. Nauru permanece, porém sua direção externa agora segue a linha estratégica japonesa."
 JAP_diplomacy.161.a: "Estabelecer o protetorado."
 JAP_diplomacy.162.t: "Nauru rejeita a Exigência"
 JAP_diplomacy.162.d: "Nauru rejeita o ultimato do Japão e se recusa a trocar a independência por promessas de proteção. A recusa transforma a pressão em confronto, e Tóquio agora trata a ilha como uma lacuna desprotegida em seu perímetro oceânico.\n\nSe Nauru não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. O posto avançado será garantido."
 JAP_diplomacy.162.a: "Então tomaremos a ilha."
 JAP_diplomacy.163.t: "O Ultimato da Linha Equatorial"
 JAP_diplomacy.163.d: "O Japão emitiu sua exigência a Kiribati, um Estado espalhado pelo equador como marcas na carta de um navegador. A proposta de Tóquio é apresentada como proteção e desenvolvimento, mas é um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso que transforme Kiribati numa cadeia de pontos de passagem para vigilância e alcance naval.\n\nA mensagem é simples. Na nova ordem do Pacífico, não há espaços vazios. Kiribati deve escolher entre a submissão sob o guarda-chuva japonês ou o confronto com uma potência que pretende ser dona das rotas marítimas."
 JAP_diplomacy.163.a: "Aceitar. Não podemos resistir ao novo senhor do oceano."
 JAP_diplomacy.163.b: "Recusar. Não seremos absorvidos por um império."
 JAP_diplomacy.164.t: "Kiribati aceita a Linha Equatorial"
 JAP_diplomacy.164.d: "Kiribati aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e os atóis dispersos se tornam uma parte discreta, porém valiosa, da rede de Tóquio no Pacífico.\n\nA crise termina sem batalha, mas a soberania se estreita. Kiribati permanece, porém sua direção externa agora segue a bússola japonesa."
 JAP_diplomacy.164.a: "Estabelecer o protetorado."
 JAP_diplomacy.165.t: "Kiribati rejeita o Ultimato"
 JAP_diplomacy.165.d: "Kiribati rejeita o ultimato do Japão e se recusa a entregar seu futuro à supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata a cadeia equatorial como uma lacuna em seu perímetro marítimo.\n\nSe Kiribati não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. A linha será garantida."
 JAP_diplomacy.165.a: "Então tomaremos a cadeia."
 JAP_diplomacy.166.t: "A Exigência do Bastião dos Atóis"
 JAP_diplomacy.166.d: "Tóquio emitiu sua exigência às Ilhas Marshall, enxergando os atóis como fortalezas naturais capazes de abrigar aeródromos, logística e os instrumentos do controle do mar. A oferta é apresentada como proteção e apoio garantido, mas é um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso que transforme as Marshall em bastiões do perímetro japonês no Pacífico central.\n\nA mensagem é clara. Estas ilhas não serão deixadas como pontos neutros numa carta. As Marshall devem escolher entre uma paz administrada sob o guarda-chuva japonês ou uma guerra travada sobre coral e pistas de pouso."
 JAP_diplomacy.166.a: "Aceitar. Não podemos sobreviver a um cerco."
 JAP_diplomacy.166.b: "Recusar. Não nos tornaremos uma fortaleza para outra potência."
 JAP_diplomacy.167.t: "As Ilhas Marshall cedem"
 JAP_diplomacy.167.d: "As Ilhas Marshall aceitam os termos do Japão. Os acordos são assinados, o acesso é concedido e os atóis se tornam bastiões disciplinados dentro da rede oceânica de Tóquio.\n\nA crise termina sem batalha, mas a soberania se estreita. As Marshall permanecem, porém sua direção externa agora segue o plano de perímetro japonês."
 JAP_diplomacy.167.a: "Estabelecer o protetorado."
 JAP_diplomacy.168.t: "As Ilhas Marshall rejeitam a Exigência"
 JAP_diplomacy.168.d: "As Ilhas Marshall rejeitam o ultimato do Japão e se recusam a entregar seu futuro à supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata os atóis como uma lacuna desprotegida em sua linha de defesa do Pacífico central.\n\nSe as Marshall não aceitarem o arcabouço por tratado, o Japão imporá o controle pela força. Os bastiões serão garantidos."
 JAP_diplomacy.168.a: "Então tomaremos os atóis."
 JAP_diplomacy.169.t: "O Ultimato da Linha de Recifes"
 JAP_diplomacy.169.d: "O Japão emitiu sua exigência a Tuvalu, uma fina cadeia de recifes que ainda importa num oceano medido por alcance e pontos de reabastecimento. Tóquio oferece proteção e apoio, mas a estrutura é de um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso que transforme Tuvalu em ponto de passagem no perímetro sul japonês.\n\nA mensagem é brutal em sua simplicidade. Não haverá ilhas neutras num Pacífico disputado. Tuvalu deve escolher entre a submissão sob o guarda-chuva japonês ou um confronto que afogaria um pequeno Estado numa guerra de grandes potências."
 JAP_diplomacy.169.a: "Aceitar. Não podemos suportar uma tempestade de aço."
 JAP_diplomacy.169.b: "Recusar. Não entregaremos nossa bandeira."
 JAP_diplomacy.170.t: "Tuvalu aceita a proteção japonesa"
 JAP_diplomacy.170.d: "Tuvalu aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e as ilhas se tornam um nó discreto na rede marítima de Tóquio.\n\nA crise termina sem batalha, mas a soberania se estreita. Tuvalu permanece, porém sua direção externa agora segue o plano de perímetro japonês."
 JAP_diplomacy.170.a: "Estabelecer o protetorado."
 JAP_diplomacy.171.t: "Tuvalu rejeita o Ultimato"
 JAP_diplomacy.171.d: "Tuvalu rejeita o ultimato do Japão e se recusa a trocar a independência por promessas de proteção. A recusa transforma a pressão em confronto, e Tóquio agora trata a linha de recifes como uma lacuna desprotegida em sua cadeia meridional.\n\nSe Tuvalu não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. O ponto de passagem será garantido."
 JAP_diplomacy.171.a: "Então tomaremos as ilhas."
 JAP_diplomacy.172.t: "O Ultimato da Barreira de Salomão"
 JAP_diplomacy.172.d: "Tóquio emitiu sua exigência às Ilhas Salomão, enxergando a cadeia como uma barreira natural capaz de selar o Pacífico sudoeste. A oferta é apresentada como proteção e desenvolvimento, mas é um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso a bases que transformem as Salomão numa cortina fortificada para o perímetro marítimo japonês.\n\nA mensagem é clara. Estas ilhas servirão à ordem japonesa ou serão tratadas como um reduto inimigo. As Salomão devem escolher entre a submissão sob o Sol Nascente ou uma guerra travada em pistas de selva e mares estreitos."
 JAP_diplomacy.172.a: "Aceitar. Não podemos sobreviver a um bloqueio."
 JAP_diplomacy.172.b: "Recusar. Não nos tornaremos uma fortaleza para outro império."
 JAP_diplomacy.173.t: "As Ilhas Salomão cedem"
 JAP_diplomacy.173.d: "As Ilhas Salomão aceitam os termos do Japão. Os acordos são assinados, o acesso é concedido e a cadeia se torna uma barreira disciplinada de portos, aeródromos e zonas de patrulha sob a direção de Tóquio.\n\nA crise termina sem batalha, mas a soberania se estreita. As Salomão permanecem, porém seu alinhamento externo agora segue o plano de perímetro japonês."
 JAP_diplomacy.173.a: "Estabelecer o protetorado."
 JAP_diplomacy.174.t: "As Ilhas Salomão rejeitam o Ultimato"
 JAP_diplomacy.174.d: "As Ilhas Salomão rejeitam a exigência do Japão e se recusam a entregar seu futuro à supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata a cadeia como uma lacuna perigosa em sua cortina do Pacífico sudoeste.\n\nSe as Salomão não aceitarem o arcabouço por tratado, o Japão imporá o controle pela força. A barreira será garantida."
 JAP_diplomacy.174.a: "Então tomaremos a cadeia."
 JAP_diplomacy.175.t: "O Ultimato do Bastião da Nova Guiné"
 JAP_diplomacy.175.d: "O Japão emitiu sua exigência a Papua-Nova Guiné, tratando a ilha como um bastião continental capaz de dominar as vias entre o Sudeste Asiático e o Pacífico. A oferta é apresentada como proteção e apoio garantido, mas é um protetorado: alinhar a política externa a Tóquio, aceitar a supervisão de segurança e conceder acesso a bases que transformem a Nova Guiné numa fortaleza de poder aéreo, logística e defesa avançada.\n\nA mensagem deixa poucas dúvidas. O Japão pretende ancorar aqui o teatro meridional. Papua-Nova Guiné deve escolher entre a submissão sob o escudo japonês ou uma guerra que transformará suas costas e terras altas em linhas de frente."
 JAP_diplomacy.175.a: "Aceitar. Não podemos nos tornar um campo de batalha."
 JAP_diplomacy.175.b: "Recusar. Não seremos transformados em fortaleza para outra potência."
 JAP_diplomacy.176.t: "Port Moresby aceita"
 JAP_diplomacy.176.d: "Papua-Nova Guiné aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e a ilha se torna um bastião disciplinado dentro do perímetro meridional de Tóquio, construído em torno de aeródromos, portos e centros logísticos.\n\nA crise termina sem batalha, mas a soberania se estreita. Papua-Nova Guiné permanece, porém sua direção estratégica agora segue o plano de fortaleza japonês."
 JAP_diplomacy.176.a: "Estabelecer o protetorado."
 JAP_diplomacy.177.t: "Papua-Nova Guiné rejeita o Ultimato"
 JAP_diplomacy.177.d: "Papua-Nova Guiné rejeita a exigência do Japão e se recusa a entregar seu futuro à supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata a ilha como o principal obstáculo para garantir o teatro meridional.\n\nSe Papua-Nova Guiné não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. O bastião será tomado."
 JAP_diplomacy.177.a: "Então tomaremos o bastião."
 JAP_diplomacy.178.t: "A Exigência da Cadeia do Pacífico Sul"
 JAP_diplomacy.178.d: "Tóquio emitiu sua exigência a Vanuatu, tratando as ilhas como mais um elo da cadeia capaz de selar o Pacífico sudoeste. A oferta é apresentada como proteção e ajuda ao desenvolvimento, mas é um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso que transforme Vanuatu em ponto de passagem para patrulhas, reabastecimento e controle regional.\n\nA mensagem é clara. O Japão está construindo um perímetro, ilha por ilha. Vanuatu deve escolher entre uma paz administrada sob o Sol Nascente ou um confronto que não tem esperança de sustentar."
 JAP_diplomacy.178.a: "Aceitar. Não podemos lutar contra um império no mar."
 JAP_diplomacy.178.b: "Recusar. Não seremos absorvidos."
 JAP_diplomacy.179.t: "Vanuatu aceita a proteção japonesa"
 JAP_diplomacy.179.d: "Vanuatu aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e as ilhas se tornam um nó discreto, porém útil, dentro do perímetro meridional de Tóquio.\n\nA crise termina sem batalha, mas a soberania se estreita. Vanuatu permanece, porém sua direção externa agora segue a linha estratégica japonesa."
 JAP_diplomacy.179.a: "Estabelecer o protetorado."
 JAP_diplomacy.180.t: "Vanuatu rejeita a Exigência"
 JAP_diplomacy.180.d: "Vanuatu rejeita o ultimato do Japão e se recusa a trocar a independência por promessas de proteção. A recusa transforma a pressão em confronto, e Tóquio agora trata as ilhas como uma lacuna desprotegida em sua cadeia do Pacífico sudoeste.\n\nSe Vanuatu não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. O elo será garantido."
 JAP_diplomacy.180.a: "Então tomaremos as ilhas."
 JAP_diplomacy.181.t: "O Ultimato da Pedra Angular do Pacífico Sul"
 JAP_diplomacy.181.d: "O Japão emitiu sua exigência a Fiji, tratando as ilhas como um polo capaz de sustentar a logística da frota e as operações aéreas num amplo arco do Pacífico Sul. A oferta é apresentada como proteção e apoio garantido, mas é um protetorado: alinhar a política externa a Tóquio, aceitar a supervisão de segurança e conceder acesso a bases que transformem Fiji na pedra angular do perímetro meridional japonês.\n\nA mensagem é inequívoca. O Japão não busca amigos, está construindo uma ordem. Fiji deve escolher entre uma paz administrada sob o guarda-chuva japonês ou um confronto que será decidido pelo poder naval."
 JAP_diplomacy.181.a: "Aceitar. Não podemos arcar com o risco de servir de exemplo."
 JAP_diplomacy.181.b: "Recusar. Fiji não se submeterá."
 JAP_diplomacy.182.t: "Fiji aceita os termos da Pedra Angular"
 JAP_diplomacy.182.d: "Fiji aceita o ultimato do Japão. Os acordos são assinados, o acesso é concedido e as ilhas se tornam um nó central na rede de portos, aeródromos e zonas de patrulha de Tóquio no Pacífico Sul.\n\nA crise termina sem batalha, mas a soberania se estreita. Fiji permanece, porém sua direção externa agora segue o plano de perímetro japonês."
 JAP_diplomacy.182.a: "Estabelecer o protetorado."
 JAP_diplomacy.183.t: "Fiji rejeita o Ultimato"
 JAP_diplomacy.183.d: "Fiji rejeita a exigência do Japão e se recusa a entregar seu futuro à supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata as ilhas como a última lacuna num perímetro meridional que pretende fechar.\n\nSe Fiji não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. A pedra angular será garantida."
 JAP_diplomacy.183.a: "Então tomaremos o polo."
 JAP_diplomacy.184.t: "O Ultimato da Linha de Samoa"
 JAP_diplomacy.184.d: "Tóquio emitiu sua exigência a Samoa, tratando as ilhas como um eixo entre o Pacífico central e as vias de acesso ao sul. A oferta é apresentada como proteção e apoio garantido, mas é um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso que transforme Samoa em ponto de passagem no crescente perímetro oceânico japonês.\n\nA mensagem é direta. O Japão está traçando linhas através do mar, e Samoa está sobre uma delas. A aceitação oferece segurança sob uma potência maior; a recusa arrisca transformar-se na lição que convence os demais."
 JAP_diplomacy.184.a: "Aceitar. Sobreviveremos, mesmo que tenhamos de nos submeter."
 JAP_diplomacy.184.b: "Recusar. Samoa não se curvará."
 JAP_diplomacy.185.t: "Samoa aceita a proteção japonesa"
 JAP_diplomacy.185.d: "Samoa aceita o ultimato do Japão. Os acordos são assinados, o acesso é concedido e as ilhas se tornam um nó discreto, porém útil, na rede de Tóquio no Pacífico.\n\nA crise termina sem batalha, mas a soberania se estreita. Samoa permanece, porém sua direção externa agora segue a linha estratégica japonesa."
 JAP_diplomacy.185.a: "Estabelecer o protetorado."
 JAP_diplomacy.186.t: "Samoa rejeita o Ultimato"
 JAP_diplomacy.186.d: "Samoa rejeita a exigência do Japão e se recusa a trocar a independência por promessas de proteção. A recusa transforma a pressão em confronto, e Tóquio agora trata as ilhas como uma lacuna desprotegida em seu perímetro oceânico.\n\nSe Samoa não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. A linha será garantida."
 JAP_diplomacy.186.a: "Então tomaremos as ilhas."
 JAP_diplomacy.187.t: "A Exigência da Coroa de Tonga"
 JAP_diplomacy.187.d: "Tóquio emitiu sua exigência a Tonga, um reino cujos portos e rotas marítimas ficam no arco meridional do Pacífico. A oferta é apresentada como proteção e parceria, mas é um protetorado: alinhar a política externa ao Japão, aceitar a supervisão de segurança e conceder acesso que transforme Tonga em ponto de passagem dentro do crescente perímetro marítimo japonês.\n\nA mensagem é clara. O Japão está construindo uma ordem oceânica que não deixa espaço para eixos independentes. Tonga deve escolher entre uma paz vigiada sob a sombra japonesa ou um confronto decidido por frotas."
 JAP_diplomacy.187.a: "Aceitar. Manteremos a coroa, mesmo sob uma sombra."
 JAP_diplomacy.187.b: "Recusar. Tonga não se submeterá."
 JAP_diplomacy.188.t: "Tonga aceita a proteção japonesa"
 JAP_diplomacy.188.d: "Tonga aceita os termos do Japão. Os acordos são assinados, o acesso é concedido e o reino se torna um nó disciplinado na rede meridional de Tóquio.\n\nA crise termina sem batalha, mas a soberania se estreita. Tonga permanece, porém sua direção externa agora segue a linha estratégica japonesa."
 JAP_diplomacy.188.a: "Estabelecer o protetorado."
 JAP_diplomacy.189.t: "Tonga rejeita a Exigência"
 JAP_diplomacy.189.d: "Tonga rejeita o ultimato do Japão e se recusa a colocar seu futuro sob supervisão estrangeira. A recusa transforma a pressão em confronto, e Tóquio agora trata o reino como uma lacuna desprotegida em seu arco meridional.\n\nSe Tonga não aceitar o arcabouço por tratado, o Japão imporá o controle pela força. O ponto de passagem será garantido."
 JAP_diplomacy.189.a: "Então tomaremos as ilhas."
 JAP_diplomacy.190.t: "Aviso a Washington: Retirada do Pacífico"
 JAP_diplomacy.190.d: "Tóquio entregou a Washington uma exigência formal pedindo a transferência de importantes ilhas do Pacífico sob controle americano. A mensagem é direta: pontos de apoio estrangeiros no perímetro oceânico do Japão não são mais tolerados, e esses postos avançados devem ser entregues para evitar uma escalada.\n\nA exigência é apresentada como uma chance de evitar a guerra, mas também é um teste de determinação. Aceitar e ceder os degraus do poder, ou recusar e arriscar transformar o Pacífico em campo de batalha entre gigantes."
 JAP_diplomacy.190.a: "Aceitar a transferência."
 JAP_diplomacy.190.b: "Recusar. O Pacífico não lhes pertence."
 JAP_diplomacy.191.t: "Washington cede os postos avançados"
 JAP_diplomacy.191.d: "Contra as expectativas, os Estados Unidos aceitam a exigência. As ilhas são transferidas, as bases são evacuadas e o perímetro marítimo do Japão se expande num único golpe.\n\nA crise termina sem guerra, mas o significado é inequívoco. Uma grande potência recuou, e o equilíbrio do Pacífico pende para Tóquio."
 JAP_diplomacy.191.a: "Garantir as ilhas."
 JAP_diplomacy.192.t: "Washington recusa"
 JAP_diplomacy.192.d: "Os Estados Unidos rejeitam a exigência do Japão e se recusam a entregar seus pontos de apoio no Pacífico. A recusa transforma o ultimato de Tóquio em um confronto direto entre potências, e o Japão agora tem justificativa e motivo para buscar os postos avançados pela força.\n\nO Pacífico se fecha em linhas de frente. Se essas ilhas não forem cedidas por tratado, serão tomadas pela guerra."
 JAP_diplomacy.192.a: "Então as tomaremos pela força."
 JAP_diplomacy.193.t: "Ultimato a Paris: O Pacífico Deve Ser Desocupado"
 JAP_diplomacy.193.d: "Tóquio entregou a Paris uma exigência formal pela transferência das possessões insulares francesas no Pacífico. A nota é embrulhada em linguagem polida, mas seu significado é inequívoco: impérios distantes não manterão mais pontos de apoio dentro do perímetro oceânico do Japão.\n\nO Japão oferece uma saída estreita para evitar a escalada. A França pode se retirar com tinta e assinaturas, ou recusar e aceitar que a disputa será resolvida por frotas, e não por diplomatas."
 JAP_diplomacy.193.a: "Aceitar a transferência."
 JAP_diplomacy.193.b: "Recusar. A França não será expulsa."
 JAP_diplomacy.194.t: "Paris se retira do Pacífico"
 JAP_diplomacy.194.d: "A França aceita a exigência do Japão. As bandeiras são baixadas, as guarnições recebem ordem de saída e as ilhas são transferidas ao controle de Tóquio.\n\nA crise termina sem guerra, mas a mensagem ecoa pelo mundo. O Japão não está negociando uma esfera de influência, está impondo uma."
 JAP_diplomacy.194.a: "Garantir as ilhas."
 JAP_diplomacy.195.t: "Paris recusa"
 JAP_diplomacy.195.d: "A França rejeita o ultimato do Japão e se recusa a entregar suas possessões no Pacífico. A recusa transforma a exigência de Tóquio em um confronto direto, e o Japão agora tem a justificativa para tomar as ilhas pela força.\n\nO oceano encolhe quando grandes potências colidem. Se a França não se retirar por tratado, o Japão tentará expulsá-la pela guerra."
 JAP_diplomacy.195.a: "Então as tomaremos."
 JAP_diplomacy.196.t: "Aviso a Londres: Entregar a Possessão no Pacífico"
 JAP_diplomacy.196.d: "Tóquio entregou a Londres uma exigência formal pela transferência da última possessão insular britânica no Pacífico. A nota fala de estabilidade regional e do fim da interferência distante, mas seu propósito é claro: o Japão pretende retirar as bandeiras estrangeiras do oceano que agora afirma policiar.\n\nA Grã-Bretanha recebe a escolha entre uma retirada ordenada e uma guerra desnecessária longe de casa. Aceite, e o assunto termina no papel. Recuse, e o Pacífico se torna mais um teatro onde impérios testam a vontade uns dos outros."
 JAP_diplomacy.196.a: "Aceitar a transferência."
 JAP_diplomacy.196.b: "Recusar. A Grã-Bretanha não será expulsa."
 JAP_diplomacy.197.t: "Londres recua"
 JAP_diplomacy.197.d: "O Reino Unido aceita a exigência do Japão. O território é transferido, a bandeira é baixada e Tóquio adiciona mais uma peça ao seu perímetro marítimo imposto.\n\nA crise termina sem guerra, mas o simbolismo é pesado. Uma antiga potência naval cedeu terreno, e a pretensão do Japão sobre o Pacífico se torna mais ousada a cada concessão."
 JAP_diplomacy.197.a: "Garantir o território."
 JAP_diplomacy.198.t: "Londres recusa a Exigência"
 JAP_diplomacy.198.d: "A Grã-Bretanha rejeita o ultimato do Japão e se recusa a entregar sua possessão no Pacífico. A recusa transforma a exigência de Tóquio em um desafio direto, e o Japão agora tem motivo e pretexto para tomar o território pela força.\n\nA diplomacia chegou ao limite. Se a Grã-Bretanha não se retirar por tratado, o Japão tentará removê-la pela guerra."
 JAP_diplomacy.198.a: "Então o tomaremos."
 JAP_diplomacy.199.t: "Canais japoneses se expandem em Pyongyang"
 JAP_diplomacy.199.d: "A política japonesa em relação ao Norte entrou numa nova fase. Por meio de intermediários, contatos de inteligência e uma pressão cuidadosamente administrada, Tóquio abriu canais dentro de nosso ambiente político que antes eram limitados ou fechados.\n\nIsso não significa confiança, nem alinhamento. Significa que o Japão agora tem uma oportunidade temporária de moldar decisões, influenciar facções e testar nossa determinação tanto por dentro quanto por fora."
 JAP_diplomacy.199.a: "Vigiaremos esses canais de perto."
 JAP_diplomacy.200.t: "Sacalina e as Curilas perdidas"
 JAP_diplomacy.200.d: "As forças russas retomaram o controle total de Sacalina e das Ilhas Curilas, revertendo todos os ganhos obtidos durante a campanha. A operação ruiu, e Tóquio não consegue mais sustentar o esforço. Um cessar-fogo é a única opção restante.\n\nO fracasso trará consequências. A confiança pública no julgamento militar do governo foi abalada, e o custo político desta aventura será sentido por anos."
 JAP_diplomacy.200.a: "Não temos escolha senão aceitar a derrota."
 JAP_failed_sakhalin_war: "Rescaldo da Guerra de Sacalina"
 JAP_failed_sakhalin_war_desc: "A campanha militar fracassada sobre Sacalina e as Ilhas Curilas deixou cicatrizes profundas no cenário político do Japão. A confiança pública na competência estratégica do governo se erodiu, o moral militar sofreu e as repercussões diplomáticas continuam limitando as opções de política externa de Tóquio."
 JAP_mars_colony1: "Colônia Marciana Amaterasu"
 JAP_mars_colony1_desc: "Batizada em homenagem a Amaterasu, a deusa do sol que ilumina os céus, a Colônia Marciana 'Amaterasu' é um símbolo radiante da unidade e da liderança do Japão. Sua presença inspira confiança em casa e respeito no exterior."
 JAP_mars_colony2: "Colônia Marciana Kagutsuchi"
 JAP_mars_colony2_desc: "Batizada em homenagem a Kagutsuchi, o deus do fogo, a Colônia Marciana 'Kagutsuchi' é construída em torno de fornalhas, refinarias e indústria pesada. Seu propósito é claro: converter minério e energia marcianos em força para as fábricas do Japão."
 JAP_mars_colony3: "Colônia Marciana Tsukuyomi"
 JAP_mars_colony3_desc: "Batizada em homenagem a Tsukuyomi, o deus da lua e da noite, a Colônia Marciana 'Tsukuyomi' funciona como um observatório silencioso e complexo de pesquisa. De seus laboratórios e instrumentos, os dados fluem de volta ao Japão, aprofundando o entendimento científico."
 JAP_mars_colony4: "Colônia Marciana Susanoo"
 JAP_mars_colony4_desc: "Batizada em homenagem a Susanoo, a divindade das tempestades, a Colônia Marciana 'Susanoo' foi moldada como um rude posto avançado de fronteira. Campos de treinamento e áreas de testes experimentais fazem dela um cadinho para as forças armadas e as doutrinas do Japão."
 JAP_american_pressure_article_nine: "Sob Pressão das Tarifas dos EUA"
 JAP_JP_USA_SOFA_1: "Arcabouço do SOFA EUA-Japão"
 JAP_JP_USA_SOFA_1_desc: "As forças americanas no Japão operam sob um Acordo sobre o Status das Forças que protege a maior parte do pessoal dos tribunais e impostos japoneses e dá aos EUA amplo controle sobre suas bases. Policiais locais, governadores e moradores precisam contornar regras negociadas em Washington e Tóquio, e todo crime, acidente ou reclamação de ruído perto de uma base passa pelos procedimentos do SOFA antes que o Japão possa agir."
 JAP_maritime_heavy_industry_corridor: "Corredor da Indústria Pesada Marítima"
 JAP_maritime_heavy_industry_corridor_desc: "O Japão desenvolve um cinturão contínuo de estaleiros, siderúrgicas e empresas de engenharia naval ao longo de regiões costeiras estratégicas. Concentrar investimentos nesse corredor aumenta a capacidade de construir e manter navios de guerra, submarinos e embarcações de apoio, fortalecendo a espinha dorsal industrial da frota."
 JAP_moon_base_completed: "Base Lunar Kaguya Estabelecida"
 JAP_usa_article_nine_refused: "Mudança na Interpretação do Artigo 9 Recusada"
 JAP_diplomacy_shortcut: "Diplomacia"
 JAP_political: "Política"
 JAP_economy: "Economia"
 JAP_military: "Militar"
 JAP_monarchism: "Monarquista"
 JAP_great_east_japan_earthquake_shortcut: "Grande Terremoto do Leste do Japão"
 JAP_article_nine_remove_flag: "O Artigo 9 foi removido"
 JAP_usa_article_nine_accepted: "Mudança na Interpretação do Artigo 9 Aceita"
 JAP_tokyo_startup_special_zone: "Zona Especial de Startups de Tóquio"
 JAP_tokyo_startup_special_zone_desc: "Concentraremos desregulamentação, apoio a empreendimentos e incentivos ao investimento na área metropolitana de Tóquio para fomentar a criação e a comercialização de startups."
 JAP_tokyo_startup_special_zone_idea: "Zona Especial de Startups de Tóquio"
 JAP_tokyo_startup_special_zone_idea_desc: "Tóquio foi designada como zona especial de reforma regulatória para apoiar startups, capital de risco e a formação de novos negócios. Ao concentrar desregulamentação, acesso a investimento e apoio à comercialização na região da capital, o governo pretende transformar uma reforma limitada em um motor de crescimento visível."
 JAP_kansai_medical_special_zone: "Zona de Inovação Médica de Kansai"
 JAP_kansai_medical_special_zone_desc: "Criaremos uma zona especial para inovação médica, de cuidados e em ciências da vida em Kansai, acelerando o investimento privado e a implementação prática."
 JAP_kansai_medical_special_zone_idea: "Zona de Inovação Médica de Kansai"
 JAP_kansai_medical_special_zone_idea_desc: "Kansai está sendo desenvolvida como zona especial para inovação médica, de cuidados e em ciências da vida, por meio de flexibilidade regulatória e investimento focado."
 JAP_kyushu_logistics_special_zone: "Zona Especial de Logística e Portos de Kyushu"
 JAP_kyushu_logistics_special_zone_desc: "Simplificaremos os procedimentos logísticos e portuários em Kyushu, fortalecendo os fluxos comerciais e melhorando a eficiência da indústria regional."
 JAP_kyushu_logistics_special_zone_idea: "Zona Especial de Logística e Portos de Kyushu"
 JAP_kyushu_logistics_special_zone_idea_desc: "Kyushu foi designada como zona de reforma logística e portuária para melhorar a eficiência comercial e a conectividade regional. Procedimentos simplificados, priorização de infraestrutura e flexibilização regulatória visam fortalecer a capacidade de exportação e tornar a região uma base mais atraente para a indústria e o comércio."
 JAP_expand_special_zones_nationwide: "Expandir as Zonas Especiais para Todo o País"
 JAP_expand_special_zones_nationwide_desc: "Os resultados obtidos em zonas estratégicas selecionadas serão ampliados para todo o país, transformando a reforma regulatória de uma exceção limitada em um arcabouço de crescimento mais amplo."
 JAP_tokyo_startup_special_zone_active: "Executado: §Y$JAP_tokyo_startup_special_zone$§!"
 JAP_kansai_medical_special_zone_active: "Executado: §Y$JAP_kansai_medical_special_zone$§!"
 JAP_kyushu_logistics_special_zone_active: "Executado: §Y$JAP_kyushu_logistics_special_zone$§!"
 JAP_expand_special_zones_nationwide_done: "Executado: §Y$JAP_expand_special_zones_nationwide$§!"
 JAP_japanese_economy_decisions: "A Insuficiência de Demanda Entrincheirada"
 JAP_japanese_economy_decisions_desc: "Duas décadas de queda de preços ensinaram as famílias e as empresas japonesas a esperar. Os salários estão estagnados, as empresas acumulam dinheiro em vez de investir, e cada iene de estímulo é poupado em vez de gasto. A economia não está colapsando; ela simplesmente se recusa a se mover.\n\n§YO que você pode fazer§!\nAs decisões abaixo são as alavancas da demanda. Anunciar uma meta de preços, cortar o imposto sobre o consumo, transferir dinheiro às famílias, financiar investimento público e incentivar a compra de bens duráveis elevam, cada uma, o §YProgresso da Recuperação da Demanda§!. Os focos do ramo da demanda liberam essas alavancas, e §Y$JAP_active_public_investment$§! e §Y$JAP_improvement_private_investment_climate$§! contribuem diretamente para ele.\n\n§YProgresso da Recuperação da Demanda§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GLimiares§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! se atenua para §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: atenua-se novamente para §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: o espírito é removido e o crescimento econômico do Japão se acelera.\n\n§RAviso§!: este progresso nunca decai, mas nada o eleva por conta própria. Se não tomar nenhuma decisão, o Japão permanecerá na estagnação indefinidamente."
 JAP_entrenched_demand_shortfall_idea_2: "Recuperação Lenta da Demanda"
 JAP_entrenched_demand_shortfall_idea_2_desc: "Metas de preços mais claras e apoio às famílias tiraram a economia de sua pior fase, mas a recuperação continua frágil. O consumo e o investimento melhoram em alguns pontos, mas sem força suficiente para erguer o país inteiro. A demanda está voltando, mas a cautela ainda paira sobre a economia.\n-------------\nVocê pode §Gatenuar§! os efeitos deste espírito nacional usando as decisões de §Y$JAP_japanese_economy_decisions$§! para elevar o §YProgresso da Recuperação da Demanda§! a pelo menos §G60§!!"
 JAP_entrenched_demand_shortfall_idea_3: "Resíduo de Peso da Demanda"
 JAP_entrenched_demand_shortfall_idea_3_desc: "As medidas do governo para estimular o consumo impulsionaram a economia, mas a cautela deixada por anos de estagnação continua profundamente entrincheirada. Famílias e empresas estão se movendo mais do que antes, mas uma recuperação autossustentável ainda precisa de um último empurrão. A economia do Japão está no limiar de escapar da estagnação, mas ainda não se libertou por completo.\n-------------\nVocê pode §Gremover§! este espírito nacional usando as decisões de §Y$JAP_japanese_economy_decisions$§! para elevar o §YProgresso da Recuperação da Demanda§! a pelo menos §G85§!!."
 JAP_declaration_price_target: "Declarar uma Meta de Preços"
 JAP_declaration_price_target_desc: "Não é apenas a demanda fraca que arrasta a economia para baixo. A crença de que preços e salários nunca se moverão prendeu famílias e empresas na cautela. Uma meta de preços clara é uma declaração de que o Estado não aceitará mais a estagnação como normal, e é o primeiro passo para soltar as expectativas congeladas."
 Japan_economy.17.t: "A Meta de Preços É Atingida"
 Japan_economy.17.d: "O que antes parecia impossível começou a acontecer. Os preços estão subindo de um modo que as pessoas já não conseguem ignorar. A mudança mais importante não é o número em si, mas a crescente sensação de que a estagnação não é eterna. Esse sentimento começa a afrouxar a cautela de famílias e empresas."
 Japan_economy.17.a: "O clima mudou."
 Japan_economy.18.t: "A Meta de Preços Fica Aquém"
 Japan_economy.18.d: "A meta não se traduziu em movimento real, e a dúvida começa a se espalhar sobre a promessa do governo de romper a estagnação. As famílias voltam a ficar cautelosas, enquanto as empresas recuam para uma postura de esperar para ver diante da demanda fraca. A confiança na recuperação foi claramente abalada, e um clima pesado volta a se assentar sobre a economia do Japão."
 Japan_economy.18.a: "A confiança não se restaura com facilidade."
 JAP_price_target_mission: "A Promessa de Preços em Alta"
 JAP_price_target_mission_desc: "Declarar uma meta não basta. Devemos mostrar sinais visíveis de alta de preços dentro do prazo e convencer o país de que a mudança realmente começou."
 JAP_cash_transfers_households: "Apoio Direto às Famílias"
 JAP_cash_transfers_households_desc: "Quando a ansiedade com o futuro é forte, a recuperação não começa sozinha. O Estado precisa colocar poder de compra diretamente nas mãos das famílias. O apoio voltado aos grupos de baixa e média renda tem especial probabilidade de se converter em consumo efetivo, dando força imediata à demanda interna."
 JAP_cash_transfers_households_decision: "Pagamentos a Famílias de Baixa e Média Renda"
 JAP_cash_transfers_households_decision_desc: "Entregar apoio aos grupos com maior probabilidade de gastá-lo e impulsionar a demanda diretamente."
 JAP_temporary_tax_cuts: "Alívio Tributário Temporário"
 JAP_temporary_tax_cuts_desc: "Cortes temporários de impostos dão às famílias um motivo para gastar agora, antecipando as compras adiadas e dando à demanda um ímpeto visível em uma economia estagnada."
 JAP_temporary_consumption_tax_cut: "Corte Temporário do Imposto sobre o Consumo"
 JAP_temporary_consumption_tax_cut_desc: "Criar um motivo para gastar agora e transformar o consumo adiado em ímpeto para a recuperação."
 JAP_active_public_investment: "Investimento Público Agressivo"
 JAP_active_public_investment_desc: "Se as empresas privadas continuam cautelosas, o governo precisa criar a demanda por conta própria, injetando dinheiro nas economias locais e no emprego. O investimento público restaura a sensação de que o movimento finalmente voltou."
 JAP_active_public_investment_decision: "Ordenar Investimento Público"
 JAP_active_public_investment_decision_desc: "Criar demanda por meio da ação estatal e restaurar o fluxo de dinheiro para as economias locais e o emprego."
 JAP_improvement_private_investment_climate: "Melhorar o Clima de Investimento Privado"
 JAP_improvement_private_investment_climate_desc: "Os gastos do governo sozinhos não podem completar a recuperação. As empresas precisam recuperar a confiança para investir de novo, e a incerteza sobre o futuro precisa diminuir. Uma recuperação duradoura exige que os negócios passem da defesa de volta à expansão."
 JAP_focus_improving_investment_climate: "Foco em Melhorar o Clima de Investimento"
 JAP_focus_improving_investment_climate_desc: "O governo está priorizando a criação de um ambiente mais favorável ao investimento empresarial. Capital político está sendo gasto em coordenação, persuasão e reforma institucional, deixando menos espaço para outras iniciativas de curto prazo."
 Japan_economy.02.t: "O Clima de Investimento Privado Melhora"
 Japan_economy.02.d: "As empresas começam a perceber que permanecer na defensiva para sempre significa perder oportunidades. A incerteza persiste, mas parte do peso que continha novos investimentos começa a diminuir. Pela primeira vez, a recuperação já não parece fadada a continuar puramente conduzida pelo Estado."
 Japan_economy.02.a: "O setor privado está despertando."
 JAP_stimulating_demand_durable_goods: "Estimular a Demanda por Bens Duráveis"
 JAP_stimulating_demand_durable_goods_desc: "Bens duráveis como carros, eletrodomésticos e compras ligadas à habitação podem impulsionar muito mais do que seus próprios setores quando a demanda começa a se mover. Mas, em tempos de estagnação, costumam ser as primeiras compras a serem adiadas. Reavivá-las daria à recuperação um ímpeto visível e restauraria uma vitalidade há muito ausente."
 JAP_stimulating_demand_durable_goods_decision: "Campanha de Compra de Bens Duráveis"
 JAP_stimulating_demand_durable_goods_decision_desc: "Incentivar grandes compras adiadas por anos e dar à recuperação um ímpeto visível."
 Japan_economy.22.t: "A Demanda por Bens Duráveis Mostra Sinais de Recuperação"
 Japan_economy.22.d: "As grandes compras que estavam adiadas há anos finalmente começam a voltar. A demanda por bens duráveis tem efeitos amplos sobre os setores relacionados e também é um sinal de que as famílias estão ficando, ao menos um pouco, mais esperançosas quanto ao futuro. A recuperação começa a aparecer não só nos dados, mas no clima da vida cotidiana."
 Japan_economy.22.a: "Que o ímpeto se espalhe."
 JAP_strict_audits_banks: "Inspeções Bancárias Rigorosas"
 JAP_strict_audits_banks_desc: "Anos de atraso tornaram mais difíceis de ver as feridas do sistema bancário, enquanto a ansiedade financeira continuou a se espalhar. O primeiro passo é arrastar das sombras os perigosos créditos podres e obrigar os bancos a encarar a realidade. Será doloroso, mas sem essa dor não pode haver recuperação real."
 Japan_economy.23.t: "A Opção de Venda do Shinsei"
 Japan_economy.23.d: "A cláusula é exatamente como foi noticiada. Todo empréstimo que os compradores julgam ter perdido um quinto do valor volta à Corporação de Seguro de Depósitos pelo preço contábil, e o Estado absorve a diferença. O banco não fez nada de ilegal. Leu o contrato com mais atenção do que os funcionários que o redigiram, e esses funcionários ainda estão em suas mesas."
 Japan_economy.23.a: "Publicar o contrato e nomear quem o assinou"
 Japan_economy.24.t: "O Colapso da Sogo"
 Japan_economy.24.d: "A rede não pode ser salva e todos os que aconselham o ministro sabem disso. A única questão é se ela será liquidada em tribunal, onde os credores e os funcionários que os favoreceram serão nomeados em público, ou reestruturada a portas fechadas, com a parte pública da dívida discretamente perdoada."
 Japan_economy.24.a: "Deixá-la falir em tribunal aberto"
 JAP_injection_public_funds: "Injeção de Capital Público"
 JAP_injection_public_funds_desc: "É irrealista exigir de bancos enfraquecidos, sem apoio, tanto a baixa contábil das perdas quanto a retomada do crédito. Se a confiança no próprio sistema financeiro deve ser preservada, o Estado precisa intervir como último amparo e deter a cadeia de colapso. É uma decisão politicamente pesada, mas com pouca margem para evasão."
 Japan_economy.25.t: "Mycal"
 Japan_economy.25.d: "O banco principal do grupo o refinanciou todos os anos desde o fim da bolha e agora informou ao ministério que não o fará de novo. Fornecedores de Kansai que nunca trataram com mais ninguém já estão ligando para suas prefeituras provinciais. O que for decidido esta semana será lido em toda a região como uma declaração sobre se os velhos arranjos ainda valem."
 Japan_economy.25.a: "Deixá-lo falir e auditar o banco que o sustentou"
 JAP_new_lenders: "Convidar Novos Credores"
 JAP_new_lenders_desc: "Se os bancos existentes continuarem presos à cautela defensiva, o fluxo de crédito permanecerá fraco. Novos credores precisam ser incentivados a entrar no campo e romper o gargalo das próprias finanças. A concorrência e novos canais de capital podem restaurar parte da flexibilidade que o sistema financeiro japonês perdeu."
 JAP_new_lenders_idea: "A Ascensão de Novos Credores"
 JAP_new_lenders_idea_desc: "Novas fontes de crédito além dos bancos tradicionais começam a surgir. O bloqueio nas finanças não foi totalmente removido, mas novos caminhos se abrem para o capital circular pela economia."
 JAP_protection_deposits: "Estabelecer Proteção de Depósitos"
 JAP_protection_deposits_desc: "No momento em que os depositantes começam a duvidar de que suas economias estão seguras, uma crise bancária se torna real. O Estado precisa, portanto, deixar inequivocamente claro que os depósitos serão protegidos. Isso sozinho não pode restaurar totalmente a confiança, mas ainda pode ser o muro que impede o pânico de virar colapso."
 Japan_economy.26.t: "Resona"
 Japan_economy.26.d: "Retire os ativos fiscais diferidos e o índice de capital desaba. Os auditores não assinarão, o que já é inédito, e o governo tem dias, não semanas. Dois trilhões de ienes recompõem o banco e fazem do Estado seu dono. A recusa significa a primeira grande quebra bancária que o país permite desde a guerra, e ninguém sabe dizer onde isso para."
 Japan_economy.26.a: "Injetar os recursos e remover todo o conselho"
 JAP_rehabilitation_small_medium_enterprises: "Uma Rede de Segurança de Crédito para Pequenas Empresas"
 JAP_rehabilitation_small_medium_enterprises_desc: "A baixa contábil dos créditos podres corre o risco de empurrar as pequenas e médias empresas para a penúria de financiamento junto com as insolventes. Os bancos são obrigados a manter o crédito às PMEs viáveis enquanto esquemas de reestruturação financeira monitoram o aperto de crédito, erguendo uma barreira diante do colapso das economias locais."
 JAP_rehabilitation_small_medium_enterprises_idea: "Foco na Estabilidade de Crédito das PMEs"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "Recursos políticos estão sendo concentrados na supervisão, na coordenação e no apoio à reestruturação para evitar que a baixa dos créditos podres sufoque o crédito às pequenas e médias empresas. Isso é vital para proteger as economias locais, mas deixa menos espaço para a ação em outras áreas."
 Japan_economy.27.t: "O Banco Ashikaga"
 Japan_economy.27.d: "O governo da província, suas empresas e muitíssimas de suas famílias não têm conta em nenhum outro banco. A conclusão dos fiscais é inequívoca: o banco está insolvente e assim está há algum tempo. A nacionalização temporária protege todos os depositantes e elimina todos os acionistas, muitos dos quais são empresas locais obrigadas a manter as ações como condição para seus próprios empréstimos."
 Japan_economy.27.a: "Nacionalizá-lo e reduzir os acionistas a nada"
 Japan_economy.28.t: "Daiei"
 Japan_economy.28.d: "A Corporação de Revitalização está pronta para assumi-la, trocar o conselho e vender o que puder ser vendido. O fundador ergueu esta empresa a partir dos escombros da guerra e tem amigos no partido que se lembram disso. Eles pedem mais um refinanciamento, e pedem em voz alta."
 Japan_economy.28.a: "Entregá-la à Corporação de Revitalização"
 Japan_economy.29.t: "As Contas da Kanebo"
 Japan_economy.29.d: "Duzentos bilhões de ienes de lucro que nunca foram obtidos, registrados ao longo de cinco anos e aprovados todas as vezes pela mesma firma de contabilidade. Processar a empresa é simples. Processar seus auditores diria a todas as firmas de contabilidade do Japão que a assinatura é uma responsabilidade, e não uma formalidade, e faria com que muitos outros balanços de repente valessem uma nova leitura."
 Japan_economy.29.a: "Processar a empresa e suspender seus auditores"
 Japan_economy.30.t: "A Federação Recua"
 Japan_economy.30.d: "A pressão diminuiu. A federação não retirou suas objeções, mas parou de falar contra a investigação, e os membros que eram mais ruidosos se calaram. Não é concordância. É o juízo de que a briga já não vale o que lhes custa."
 Japan_economy.30.a: "Aproveitaremos a calmaria enquanto durar."
 Japan_economy.31.t: "A Federação Cumpre a Ameaça"
 Japan_economy.31.d: "Os planos de investimento das empresas associadas foram adiados, e todas citam a incerteza. O congelamento de contratações anunciado esta manhã é apresentado como prudência. A mensagem é inequívoca e é feita para ser, e nenhuma lei pode obrigar uma empresa a investir."
 Japan_economy.31.a: "Eles deixaram clara a sua posição."
 Japan_economy.06.t: "As Empresas Reagem"
 Japan_economy.06.d: "No momento em que os auditores pedem os números reais, o lobby começa. As federações industriais alertam para falências em massa e perda de empregos, e burocratas amigos aconselham paciência. Os bancos prefeririam reportar as perdas no seu próprio ritmo, se é que o fariam. Podemos compeli-los, podemos deixar que nos entreguem o que escolherem, ou podemos decidir que isso nunca valeu o incômodo."
 Japan_economy.06.a: "Intimar os livros contábeis"
 Japan_economy.07.t: "Um Banco à Beira do Abismo"
 Japan_economy.07.d: "A auditoria revelou um credor regional afogado em créditos podres. Forçar todo o balanço à luz do dia pode espalhar o pânico; conter a divulgação deixa a podridão meio escondida, mas os mercados permanecem calmos. De qualquer modo, a investigação segue em frente."
 Japan_economy.07.a: "Forçar a divulgação completa"
 Japan_economy.08.t: "As Conclusões São Publicadas"
 Japan_economy.08.d: "O relatório vai para a gráfica. O que há nele depende inteiramente do que os auditores puderam encontrar: um catálogo de empresas insolventes e dos funcionários que as protegeram, um relato parcial com os piores nomes omitidos, ou um documento que consegue ter várias centenas de páginas sem acusar ninguém de nada. O público o lerá de qualquer forma, assim como aqueles a quem foram prometidos mercados transparentes, ao estilo ocidental."
 Japan_economy.08.a: "Publicar tudo e deixar o público julgar"
 Japan_economy.09.t: "Um Vazamento no Ministério"
 Japan_economy.09.d: "As empresas sabiam quais auditores viriam e em que manhã. Arquivos foram esvaziados durante um fim de semana, e dois diretores de repente estão inalcançáveis, em viagem de negócios ao exterior. Alguém no ministério está avisando-os, e todos nesta sala podem adivinhar quem, porque ele foi lotado aqui vindo do banco que protege e será lotado de volta nele quando se aposentar."
 Japan_economy.09.a: "Aceitar a perda e seguir em frente"
 Japan_economy.10.t: "A Federação Emite um Ultimato"
 Japan_economy.10.d: "A federação empresarial veio à Dieta com números próprios: investimentos adiados, contratações congeladas, a confiança abalada, tudo atribuído à investigação. A mensagem por baixo da cortesia não é sutil. Encerrem isso, ou os membros desta federação descobrirão que não conseguem se comprometer com nada enquanto durar a incerteza."
 Japan_economy.10.a: "Que apresentem seus argumentos em público."
 Japan_economy.11.t: "O Promotor Cai"
 Japan_economy.11.d: "Não foi a investigação que fracassou. Foi um promotor-chefe com uma carteirinha de clube de golfe que não declarou, dada a ele por uma empresa da sua própria lista, e um jornal que tem fotografias dele aceitando-a. O ministro renunciou para assumir a responsabilidade. A investigação está suspensa para revisão, o que todos entendem como suspensa até o momento em que o público deixar de prestar atenção."
 Japan_economy.11.a: "Perdemos a iniciativa."
 JAP_expectation_of_being_rewarded: "A Expectativa de Ser Recompensado"
 JAP_expectation_of_being_rewarded_desc: "A recuperação exige restaurar a crença de que o esforço será recompensado em salários e padrão de vida. Sem crescimento salarial, o estímulo continua temporário, e só essa expectativa transforma uma recuperação em uma recuperação autossustentável."
 JAP_wage_negotiations: "Negociar Salários Mais Altos"
 JAP_wage_negotiations_decision: "Restaurar a confiança no crescimento salarial e impedir que a recuperação da demanda termine como um surto temporário de estímulo."
 Japan_economy.12.t: "Negociações Salariais com o Empresariado"
 Japan_economy.12.d: "Para que a recuperação da demanda se torne autossustentável, os salários também precisam subir. Porém, as empresas continuam receosas dos riscos futuros e da pressão sobre os lucros. O governo deve agora decidir com que força deve pressionar por salários mais altos."
 Japan_economy.12.a: "Incentivar aumentos salariais."
 Japan_economy.12.b: "Aplicar pressão."
 Japan_economy.12.c: "Deixar a cargo do setor privado."
 Japan_economy.14.t: "O Crescimento Salarial Atinge a Meta"
 Japan_economy.14.d: "Os salários finalmente começaram a se mover de forma visível. O que importa não é apenas o aumento da renda em si, mas o retorno de um sentimento mais profundo de que o esforço pode voltar a ser recompensado. Essa mudança de ânimo começa a transformar o consumo fraco em algo mais forte e duradouro."
 Japan_economy.14.a: "A recuperação está se tornando real."
 Japan_economy.15.t: "O Crescimento Salarial Fica Aquém da Meta"
 Japan_economy.15.d: "O crescimento salarial não atingiu o objetivo, mas o esforço não foi em vão. As empresas continuam cautelosas, porém a necessidade de salários mais altos é agora mais amplamente compreendida do que antes. O passo adiante é pequeno, mas ainda importa para romper o antigo clima de estagnação."
 Japan_economy.15.a: "Construímos sobre isso."
 Japan_economy.12_a_TT: "As chances de o crescimento salarial atingir o valor-alvo são de §Y50 a 50§!"
 Japan_economy.12_b_TT: "As chances de o crescimento salarial atingir o valor-alvo são §Galtas§!"
 Japan_economy.12_c_TT: "As chances de o crescimento salarial atingir o valor-alvo são §Rbaixas§!"
 JAP_wage_negotiations_TT: "O §YProgresso da Recuperação da Demanda§! aumentará, mas o montante depende do resultado das §Ynegociações salariais§!"
 JAP_glorious_decade_desc: "Sem adiar os fatores por trás da estagnação, reconstruiremos finanças, empresas e demanda em paralelo. Ao mesmo tempo, enfrentaremos os impactos da queda da natalidade e da geração da \"era glacial do emprego\" e, com foco em reformas do estilo de trabalho e em investimento nas pessoas, equilibraremos a segurança das famílias com um maior potencial de crescimento."
 JAP_inflation_target_desc: "O governo e o banco central comunicarão claramente a postura de política para apoiar a economia e as condições sob as quais ela será mantida. Ao reduzir a incerteza futura e atenuar a atitude de \"esperar para ver\" das famílias e empresas, facilitaremos a retomada do consumo e do investimento."
 JAP_diplomacy.34.d: "Para fortalecer a rede de proteção financeira da região, o governo japonês propôs ampliar o acordo de swap cambial com o nosso país por meio da \"Iniciativa de Chiang Mai\". Garantir liquidez em tempos de crise pode ajudar a acalmar a ansiedade do mercado e contribuir para a estabilidade econômica.\n\nDevemos aceitar esta proposta e participar do fortalecimento da cooperação financeira?"
 JAP_diplomacy.40.d: "O governo japonês propôs ao nosso país uma cooperação de \"APD Qualitativa\" nas áreas de educação, desenvolvimento de recursos humanos e pesquisa, como apoio realizado em coordenação com empresas e instituições locais. Essa cooperação fortalecerá a formação de habilidades e a capacidade institucional, promovendo a modernização industrial e a inovação. Aceitar a proposta também aumentaria a influência do Japão dentro da ASEAN.\n\nDevemos aceitar esta proposta e fortalecer o capital humano e a pesquisa e desenvolvimento?"
 JAP_diplomacy.41.d: "[FROM.GetName] aceitou a proposta de cooperação de \"APD Qualitativa\" do Japão nas áreas de educação, desenvolvimento de recursos humanos e pesquisa. À medida que a coordenação com empresas e instituições locais avança, a capacidade institucional e a base tecnológica do outro país serão fortalecidas, contribuindo para um crescimento sustentável. Este acordo certamente aumentará a influência do Japão dentro da ASEAN."
 JAP_diplomacy.42.d: "[FROM.GetName] indicou que recusará a proposta de cooperação de \"APD Qualitativa\" nas áreas de educação, desenvolvimento de recursos humanos e pesquisa. O outro país parece estar priorizando assuntos internos e preparativos institucionais, mas isso não significa que esteja rejeitando a proposta em si. O Japão deve ter em mente as circunstâncias do outro país, mantendo abertos os canais de diálogo."
 JAP_diplomacy.49.d: "O governo japonês apresentou uma proposta para criar a \"Plataforma de Conhecimento em Preparação para Desastres Japão-Taiwan\", a fim de compartilhar conhecimento especializado e lições aprendidas na resposta a desastres, com base em nossa vulnerabilidade comum a desastres naturais. Por meio da padronização do compartilhamento de informações, da realização de treinamentos conjuntos e do desenvolvimento de procedimentos de recuperação, o objetivo é fortalecer a capacidade de resposta a emergências e acelerar a recuperação. Se essa cooperação avançar, espera-se que reduza os danos e acelere a restauração."
 JAP_diplomacy.50.d: "O governo japonês propôs a \"Cooperação de Alta Tecnologia Japão-Taiwan\", que ligaria instituições de pesquisa e empresas privadas do Japão e de Taiwan para avançar a pesquisa conjunta em tecnologias civis de ponta. Compartilhando recursos de pesquisa, buscando o desenvolvimento conjunto e promovendo intercâmbios de engenheiros, o objetivo é acelerar a inovação e aumentar a produtividade e a competitividade industriais. Se essa cooperação criar raízes, formará uma base para o crescimento de longo prazo nos setores de tecnologia civil de ambos os países."
 JAP_diplomacy.56.t: "Projeto de Cooperação Cultural da \"Esfera Cultural Sínica\""
 JAP_diplomacy.56.d: "O governo japonês propôs um projeto de cooperação cultural Japão-China para fortalecer os laços culturais dentro da \"Esfera Cultural Sínica\", que compartilha uma base histórica comum. Por meio de intercâmbios acadêmicos, iniciativas culturais e cooperação em mídia e educação, o objetivo é tornar mais visíveis os valores compartilhados e as conexões históricas e fazê-los funcionar como um amortecedor cultural contra influências externas. Se esse arcabouço avançar, espera-se também que fortaleça o poder brando que contribui para moldar uma imagem internacional mais favorável."
 JAP_diplomacy.59.d: "O governo japonês propôs a \"Iniciativa de Intercâmbio Empresarial Regional\" para institucionalizar intercâmbios empresariais em nível local e promover a cooperação entre empresas regionais do Japão e da Coreia do Sul. Por meio de eventos de articulação de negócios, exposições conjuntas, conexão de cadeias de suprimento e compartilhamento de tecnologia e know-how, o objetivo é revitalizar as economias regionais e acelerar o crescimento das indústrias civis. Se esse arcabouço criar raízes, a cooperação prática que não depende excessivamente da liderança do governo central se expandirá, fortalecendo redes industriais impulsionadas pelo setor privado."
 JAP_historical.20010426.d: "Yoshirō Mori anunciou sua renúncia ao cargo de primeiro-ministro após apenas um ano no poder. Sua aprovação havia caído, e o distanciamento entre ele e o público, simbolizado por sua declaração sobre a \"nação divina\" e pela condução do incidente do Ehime Maru, só havia aumentado.\n\nEleito sucessor na disputa pela liderança do PLD foi Junichiro Koizumi, que atraiu a atenção nacional com sua ousada declaração de \"destruir o PLD\" e conduziu uma campanha vistosa e de grande visibilidade. As expectativas do público eram altas, e ele venceu por larga margem na votação regional.\n\nCom um estilo e uma presença de palco que rompiam com o velho Partido Liberal Democrata, Koizumi ergueu a bandeira da \"reforma\" ao assumir o cargo de primeiro-ministro.\nNo entanto, o que poderá surgir das ruínas que ele jurou destruir, ninguém sabe ainda."
 JAP_historical.20060926.d: "O primeiro-ministro Junichiro Koizumi, que liderou um governo de longa duração, de mais de cinco anos, anunciou sua intenção de deixar o cargo com o fim de seu mandato como presidente do PLD. Embora Koizumi tivesse declarado publicamente o desejo de sair ao final do mandato, o apoio do público a ele continuava alto, e muitos dentro do partido seguiam pedindo sua permanência.\n\nEnquanto isso, dentro do PLD, Shinzo Abe, que havia subido rapidamente na hierarquia até se tornar Secretário-Chefe do Gabinete ainda jovem, surgiu como o principal sucessor. Com sua juventude, reconhecimento do nome, linhagem política e status simbólico de figura do \"pós-Koizumi\", ele reunia amplo apoio em todo o partido.\n\nQuem está mais apto a conduzir a nação adiante: um titular experiente ou um novo líder pronto para passar o bastão à próxima geração? Chegou a hora de decidir."
 JAP_historical.20070926.d: "O primeiro-ministro Shinzo Abe anunciou abruptamente sua intenção de renunciar, citando a crescente dificuldade de administrar o governo. Fazia apenas um ano que assumira o cargo. Em meio a uma série de escândalos ministeriais, a base de seu governo havia sido gravemente abalada.\nEm resposta à renúncia, alguns dentro do PLD pressionaram para trazer o ex-Secretário-Chefe do Gabinete Yasuo Fukuda, argumentando que \"é preciso um rosto novo para restaurar a confiança do público\". No entanto, muitas vozes ainda apoiam firmemente a continuidade de Abe.\n\nO Japão encontra-se agora em meio a uma turbulência política. Chegou a hora de decidir quem assumirá o leme da nação."
 JAP_historical.20080924.d: "O primeiro-ministro Yasuo Fukuda realizou inesperadamente uma coletiva de imprensa no Gabinete do Primeiro-Ministro para anunciar sua renúncia.\n\nDurante a coletiva, afirmou: \"Pelo bem da vida cotidiana do povo, espero que uma nova equipe execute as políticas\", mostrando uma calma aceitação da transição de liderança. No entanto, como não explicou claramente os motivos de sua renúncia, o anúncio deixou muitos cidadãos confusos e incertos.\nEm resposta, o Partido Liberal Democrata começou rapidamente a preparar uma eleição de liderança. O Secretário-Geral Tarō Asō surgiu como o principal candidato, ganhando rapidamente o apoio de várias facções do partido. Ainda assim, um pequeno número de vozes dentro do partido continua pedindo que Fukuda permaneça.\n\nPara romper a estagnação política, o país precisa de mudança? Ou a estabilidade é a maior prioridade do Japão neste momento? Chegou a hora de decidir."
 JAP_focus_renewable_energy_decision_repeal: "Revogar o Foco em Energia Renovável"
 JAP_focus_renewable_energy_decision_repeal_desc: "Reverter o compromisso com a energia renovável marca uma mudança de política que se afasta do investimento em energia solar e eólica, permitindo ao governo redirecionar recursos para outras prioridades energéticas."
 JAP_focus_thermal_power_decision_repeal: "Revogar o Foco em Usinas de Combustível Fóssil"
 JAP_focus_thermal_power_decision_repeal_desc: "Reverter a expansão das usinas de combustível fóssil marca uma mudança de política que se afasta do investimento em carvão, petróleo e gás, permitindo ao governo redirecionar recursos para outras prioridades energéticas."
 JAP_historical.121006001.t: "Terremoto de Tottori de 2000"
 JAP_historical.121006001.d: "O Japão é formado por arquipélagos vulcânicos que flutuam sobre o Círculo de Fogo. Isso significa que o Japão e seu povo precisam conviver constantemente com enormes terremotos. Isso não mudou até o milênio passado e não mudará também no próximo milênio.\n\n13h30, 6 de outubro de 2000 - Um terremoto de magnitude 7,3 e intensidade 6+ atingiu o oeste de Shimane. Causou muitos danos a estradas e casas, e vibrações em regiões distantes como Osaka e Fukuoka. Em especial, Kobe sentiu um forte terremoto pela primeira vez desde o Grande Terremoto de Hanshin-Awaji de 1995."
 JAP_historical.disaster_help: "Ajudá-los agora!"
 JAP_historical.disaster_leave: "Deixá-los. Eles se recuperarão por conta própria."
 JAP_historical.130210001.t: "Desastre do Ehime-Maru"
 JAP_historical.130210001.d: "Em 9 de fevereiro de 2001, o Ehime-Maru, navio de treinamento de uma escola técnica de pesca, foi atingido pelo submarino Greeneville de [USA.GetName]. O Ehime-Maru, onde estavam embarcados 35 estudantes e professores japoneses, afundou e 9 morreram.\n\nEnquanto autoridades de ambos os governos reúnem todas as informações sobre este trágico acidente, o primeiro-ministro [Root.GetLeader] está jogando golfe nas férias.\n\nÉ claro que ele deveria abandonar as férias e voltar a Tóquio agora, certo?"
 JAP_historical.130210001.oA: "Voltar a Tóquio agora!"
 JAP_historical.130210001.oB: "Espere! Só mais uma tacada..."
 JAP_historical.130324001.t: "Terremoto de Geiyo de 2001"
 JAP_historical.130324001.d: "15h27, 24 de março de 2001 - Um terremoto de magnitude 6,7 e intensidade 6- atingiu o oeste de Hiroshima. 2 pessoas morreram e 288 ficaram feridas. Kure, a cidade mais próxima do centro sísmico, sofreu os maiores danos. Por outro lado, muitos outros governos locais reduziram os danos, porque suas cidades haviam adotado contramedidas após o Grande Terremoto de Hanshin-Awaji de 1995 e o Terremoto de Shimane do ano passado. Os principais danos foram a ruptura de canos de água e o desabamento da superfície de montanhas."
 JAP_historical.9130901001.t: "Incêndio no Edifício de Kabukicho"
 JAP_historical.9130901001.d: "Antes do amanhecer de 1º de setembro de 2001, um prédio, o \"Edifício Myojo 56\", situado em Kabukicho, no distrito de Shinjuku, em Tóquio, pegou fogo, e o incêndio matou 44 pessoas que visitavam o salão de mahjong e o clube de striptease, por intoxicação por monóxido de carbono. Segundo o relatório do corpo de bombeiros, o fogo era pequeno no início, mas foi explodido pelo fenômeno de backdraft causado por um funcionário que encontrou o incêndio e abriu uma porta. O relatório acrescentou que os alarmes de incêndio estavam cobertos pelo teto ou desligados por mau funcionamento, de modo que o combate inicial foi perdido. Há outro relatório de que os funcionários do prédio não orientaram a evacuação dos visitantes. Enquanto isso, a Polícia Metropolitana, em investigação conjunta com o corpo de bombeiros, encontrou um cano de gás rompido de forma não natural. Embora a causa do incêndio ainda não esteja esclarecida, se acidental ou criminosa, é claro que a falta de consciência sobre prevenção de incêndios piorou a situação."
 JAP_historical.9130901001.oA: "Esperamos nunca ver outro incêndio em um prédio pior do que este."
 JAP_historical.131201001.t: "O Nascimento de Sua Alteza a Princesa Aiko"
 JAP_historical.131201001.d: "Em 1º de dezembro de 2001, a filha do Príncipe Herdeiro Naruhito e de sua consorte Masako nasceu no hospital do Palácio Imperial. Ela, a primeira Princesa Imperial nascida no terceiro milênio, recebeu o nome Aiko, de Mêncio, o clássico livro do confucionismo chinês. Além disso, Sua Alteza a Princesa Imperial Aiko é neta de Sua Majestade o Imperador Akihito. Este é o acontecimento mais feliz em muito tempo desde o nascimento de Sua Alteza o Príncipe Fumihito Akishino-no-Miya, em 1965, e por isso quase todos em todo o país comemoraram. Então, 20 mil pessoas, incluindo políticos e celebridades, gritaram Banzai no Palácio Imperial. Por outro lado, algumas pessoas temeram que essa situação extinguisse a atual linhagem da família imperial. A Princesa Consorte Masako já tinha idade avançada demais para ter um bebê, e era perigoso ter um segundo filho. E, se a Princesa Aiko crescesse, poderia se tornar a Imperatriz de linhagem matrilinear \"como a última da família imperial\", porque há uma grande diferença de idade entre os dois príncipes, Naruhito e Fumihito. Mas isso violaria a Lei da Casa Imperial: o Trono Imperial é permitido apenas à linhagem patrilinear. Por fim, todos começaram a debater a emenda à Lei da Casa Imperial, para permitir uma Imperatriz de linhagem matrilinear."
 JAP_historical.131201001.oA: "Banzai!"
 JAP_historical.150526001.t: "Terremoto da Costa de Miyagi de 2003"
 JAP_historical.150526001.d: "18h24, 26 de maio de 2003 - Um terremoto de magnitude 7,1 e intensidade 6- ocorreu ao largo da divisa entre as províncias de Miyagi e Iwate e atingiu a região. Grandes áreas da região de Tohoku sofreram muitos danos, como a destruição de pilares do Shinkansen e deslizamentos em montanhas, mas ninguém morreu. O tsunami foi tão suave quanto uma ondulação desta vez. Apesar desses relatos, muitas pessoas sentiram o tremor, de Hokkaido a Kanto."
 JAP_historical.150726001.t: "Segunda Sequência de Terremotos em Miyagi de 2003"
 JAP_historical.150726001.d: "Em 26 de julho de 2003 - Nada menos que QUATRO terremotos atingiram repetidamente o norte de Miyagi, da meia-noite até a noite, em um só dia! O mais forte registrou magnitude 6,4 e intensidade 6+ às 7h13, e até o mais fraco teve magnitude 5,1 e intensidade 5-. Esses terremotos causaram danos não só a centenas de casas, mas também à Base Aérea de Matsushima da JASDF. Foi um dia muito desagradável, mas, por sorte, ninguém morreu."
 JAP_historical.150926001.t: "Terremoto de Hokkaidō de 2003"
 JAP_historical.150926001.d: "4h50, 26 de setembro de 2003 - Um terremoto de magnitude 8,0 e intensidade 6- ocorreu ao largo do sul de Hokkaido. Apenas algumas cidades sentiram o abalo com força, mas logo perceberam as verdadeiras e terríveis consequências. O terremoto causou liquefação do solo na zona de aterro costeira e incêndio em tanques de armazenamento de petróleo. Além disso, um enorme tsunami atingiu a costa leste do Japão oriental, e duas pessoas morreram."
 JAP_historical.161023001.t: "Terremoto de Niigata Chūetsu de 2004"
 JAP_historical.161023001.d: "17h56, 23 de outubro de 2004 - Um terremoto de magnitude 6,8 e intensidade 7 ocorreu em Niigata. Foi a primeira vez que se registrou intensidade 7 na escala da JMA desde a revisão feita após o Terremoto de Hanshin de 1995. Em Yamakoshi, todas as estradas foram destruídas por deslizamentos e todos os moradores ficaram isolados na vila. Um trem que circulava pela Linha Shinkansen Joetsu descarrilou com o abalo, mas ninguém morreu. No entanto, em decorrência do terremoto, 68 pessoas morreram."
 JAP_historical.170320001.t: "Terremoto de Fukuoka de 2005"
 JAP_historical.170320001.d: "10h53, 20 de março de 2005 - Um terremoto de magnitude 7,0 e intensidade 6- ocorreu ao largo da cidade de Fukuoka. Há poucos registros de terremotos no norte de Kyushu, e este também foi o maior desde 1922. Na ilha de Genkai, na cidade de Fukuoka, cerca de 700 pessoas foram evacuadas e dez decidiram ficar para a comunicação de desastre e patrulha. No centro de Fukuoka, a maioria das janelas se quebrou e os fragmentos caíram na calçada e feriram dois pedestres. O terremoto sacudiu não só Tsushima, mas também a Coreia e a China. Uma pessoa morreu no terremoto."
 JAP_historical.170425001.t: "Acidente de Descarrilamento na Linha Fukuchiyama"
 JAP_historical.170425001.d: "Às 9h18 de 25 de abril de 2005, um trem de serviço rápido da Linha Fukuchiyama da JR West (também conhecida como Linha JR Takarazuka) descarrilou em uma curva fechada na cidade de Amagasaki, província de Hyogo, e bateu no primeiro andar de um prédio de apartamentos próximo.\nO trem tinha sete vagões, embora os relatórios iniciais tenham afirmado por engano que tinha apenas seis, pois o vagão da frente ficou completamente encravado no prédio. A investigação revelou que o trem entrou na curva a aproximadamente 116 km/h (72 mph), apesar de o limite de velocidade do trecho ser de 70 km/h (43 mph). A velocidade excessiva provavelmente causou o descarrilamento por força centrífuga.\nO maquinista morreu no acidente, mas o depoimento do condutor no vagão traseiro sugeriu que a tripulação pode ter tentado compensar um atraso de cerca de 90 segundos. Mais tarde, foi relatado que existiam medidas disciplinares internas rigorosas na empresa até para erros operacionais mínimos. Essas medidas incluíam sessões de reeducação, cópia manual das regras da empresa e outras práticas corretivas cuja origem remontava à privatização da Ferrovia Nacional Japonesa (JNR) durante o governo Nakasone.\nFelizmente, um trem expresso limitado que se aproximava no sentido oposto conseguiu fazer uma parada de emergência devido à via bloqueada, evitando uma colisão secundária. No entanto, como o acidente ocorreu durante o horário de pico da manhã, o trem estava lotado. No total, 107 pessoas morreram e 562 ficaram feridas, tornando este o acidente ferroviário mais mortal da história japonesa do pós-guerra. Alguns especialistas médicos observaram que vários passageiros podem não ter morrido imediatamente no acidente, mas depois, devido à síndrome de esmagamento resultante da compressão prolongada."
 JAP_historical.180906001.t: "O Nascimento de Sua Alteza o Príncipe Hisahito"
 JAP_historical.180906001.d: "Em 6 de setembro de 2006, o filho do Príncipe Fumihito e de sua consorte Kiko nasceu no hospital particular de Minami Azabu. Ele, o primeiro Príncipe Imperial nascido no terceiro milênio, recebeu o nome Hisahito, onde \"Hisa\" significa \"de maneira tranquila\" e \"Hito\" segue a tradição imperial de nomeação da era Heian. Ele nasceu por cesariana em um hospital particular, e não no Palácio Imperial; ambos foram fatos inéditos na história imperial. Isso foi saudado como o herdeiro masculino legítimo da sucessão ao Trono Imperial, além do nascimento de um novo membro da família imperial. Após o nascimento do menino, o debate sobre a emenda à Lei da Casa Imperial foi se acalmando aos poucos."
 JAP_historical.180906001.oA: "Banzai!"
 JAP_historical.190216001.t: "\"A Pensão Perdida\""
 JAP_historical.190216001.d: "Em 1997, a Agência de Seguro Social (SIA) do Japão começou a consolidar os registros individuais de pensão sob um único sistema de \"Número Básico de Pensão\". No entanto, entre 2006 e 2007, a agência descobriu cerca de 50 milhões de registros de pensão que permaneciam sem vínculo ou apresentavam discrepâncias devido a erros na transcrição de documentos em papel para o formato digital.\nAlguns desses registros ausentes afetavam atuais beneficiários de pensões, levantando preocupações de que indivíduos possam ter recebido valores incorretos. Além disso, alguns registros teriam sido perdidos ou apagados por engano durante tentativas de atualizar os dados da pensão de empregados.\nEm resposta, [JAP.GetRulingParty] lançou uma força-tarefa especial para investigar a questão e propôs legislação de emergência para dar auxílio aos afetados. Mesmo assim, os partidos de oposição criticam duramente o governo, e a insatisfação pública continua alta."
 JAP_historical.190216001.oA: "Que Desastre!"
 JAP_historical.190325001.t: "Terremoto de Noto de 2007"
 JAP_historical.190325001.d: "9h41, 25 de março de 2007 - Um forte terremoto de magnitude 6,9 atinge a região de Hokuriku. A escala da JMA calculou o abalo como 6+ na cidade de Wajima, província de Ishikawa, sendo o primeiro terremoto mais forte desde que a observação sísmica começou, em 1922. O hipocentro teria se localizado numa área onde nenhuma pesquisa havia encontrado uma falha até então. O tremor, que alcançou de Hokkaido a Kochi, causou um tsunami de 20 cm (7,87 polegadas). O terremoto matou 1 pessoa pela queda de uma lanterna de pedra, feriu 356 pessoas e danificou mais de 30.000 edifícios e casas."
 JAP_historical.190716001.t: "Terremoto Costeiro de Chūetsu de 2007"
 JAP_historical.190716001.d: "10h13, 16 de julho de 2007 - Outro terremoto de magnitude 6,8 atinge a província de Niigata. A escala da JMA calcula 6+ em várias cidades, mas na Usina Nuclear de Kashiwazaki-Kariwa foi calculado extraoficialmente como 7. O tremor também causou um tsunami, registrado em 1 m (3,28 pés) na cidade de Kashiwazaki. O terremoto matou 15 pessoas de forma direta e secundária, feriu 2.346 pessoas e danificou mais de 34.000 edifícios, incluindo 1.331 casas destruídas. Um incêndio começou na já mencionada Usina Nuclear de Kashiwazaki-Kariwa, mas a extinção foi atrasada em duas horas devido a um erro de compartilhamento de comunicação no combate inicial ao fogo, o que causou vazamento radioativo, embora dentro de um nível ambientalmente desprezível. Este terremoto ocorreu apenas 4 meses depois do Terremoto de Noto e 3 anos depois do destrutivo Terremoto de Niigata Chuetsu de 2004."
 JAP_historical.200614001.t: "Terremoto Interior de Iwate-Miyagi de 2008"
 JAP_historical.200614001.d: "8h43, 14 de junho de 2008 - Um forte terremoto de magnitude 7,2 ocorre sob a província de Iwate; a escala da JMA calcula 6+ na cidade de Kurihara, província de Miyagi, e na cidade de Oshu, província de Iwate. Apesar de ser um terremoto interior, um tremor acima de 3 na escala foi registrado de Hokkaido à região de Kanto. Este abalo, como raro resultado, danificou poucos edifícios, mas causou numerosos deslizamentos de terra, e por fim matou 17 pessoas, feriu 70 gravemente e 356 levemente, e 6 ainda estão desaparecidas. Houve relatos como o colapso de uma ponte e danos a bens culturais."
 JAP_historical.210811001.t: "Terremoto do Golfo de Suruga de 2009"
 JAP_historical.210811001.d: "5h07, 11 de agosto de 2009 - Um grande terremoto de magnitude 6,5 ocorre na baía de Suruga, matando uma pessoa e ferindo 319. O abalo causou um tsunami de 40 cm (1,31 pé). A escala da JMA calculou o terremoto como 6- em muitas áreas da província de Shizuoka; 8.678 casas e vários edifícios históricos foram danificados, mas nenhuma casa foi completamente destruída. A região de Tokai, que inclui a província de Shizuoka, é a área estimada de maior desastre do futuro Grande Terremoto e Tsunami de Tokai-Tonankai, de modo que os moradores se prepararam com simulações de evacuação, fixando seus próprios móveis e reforçando suas casas e edifícios. Esse foi o motivo de haver menos vítimas e danos em comparação com a magnitude do terremoto. Mesmo assim, houve relatos de danos em fábricas, plantações de chá e na Rodovia Tomei."
 JAP_diplomacy.16.t: "O Impasse com o Japão"
 JAP_diplomacy.16.d: "Tóquio continua a resistir a ampliar a interpretação do Artigo 9. Washington deve decidir até onde está disposta a pressionar e a que custo."
 JAP_diplomacy.16.a: "Abandonar o assunto. Nossos outros interesses na região têm prioridade."
 JAP_diplomacy.16.b: "Retirar nossa garantia de segurança ao Japão."
 JAP_diplomacy.16.c: "Impor tarifas comerciais às exportações japonesas."
 JAP_diplomacy.16.e: "Estabelecer um bloqueio naval ao Japão."
 JAP_asteroid_mining_network_established: "Rede de Mineração de Asteroides Estabelecida para [JAP.GetNameWithFlag]"
 JAP_asteroid_mining_operation_active: "Atualmente Conduzindo uma Operação de Mineração de Asteroides"
 JAP_claiming_taiwan_tt: "Isto afirma uma reivindicação japonesa sobre todos os estados insulares taiwaneses de uma só vez. Com as reivindicações feitas, conclua o foco para exigir a submissão de Taiwan."
 JAP_improvement_private_investment_climate_idea: "Melhorar o Clima de Investimento Privado"
 JAP_improvement_private_investment_climate_idea_desc: "Os gastos do governo sozinhos não podem completar a recuperação. As empresas precisam recuperar a confiança para investir novamente, e a incerteza sobre o futuro deve ser reduzida. Uma recuperação duradoura exige que os negócios passem da defensiva de volta à expansão."
 JAP_demographic_crisis: "Medidas Sem Precedentes para a Crise"
 JAP_demographic_crisis_desc: "A Agência de Crianças e Famílias do Japão coordena uma resposta de todo o governo ao declínio demográfico: incentivos pró-natalidade, mobilização da força de trabalho feminina ou reforma da imigração. A Dieta se compromete com apenas um caminho. Cada um cobra sua conta em uma moeda diferente: auxílios em dinheiro, ruptura da força de trabalho ou transformação cultural."
 JAP_demographic_crisis_tt: "Marca o início da resposta do Japão ao seu declínio demográfico. As três estratégias seguintes são mutuamente exclusivas."
 JAP_traditionalist_backlash_opposition_tt: "§RReação tradicionalista:§! a ira conservadora com o recuo da família tradicional infla a oposição nacionalista"
 JAP_traditionalist_backlash_stability_tt: "§RReação tradicionalista:§! a ira conservadora com o recuo da família tradicional corrói a estabilidade"
 JAP_japan_belongs_to_the_japanese: "O Japão Pertence aos Japoneses"
 JAP_japan_belongs_to_the_japanese_desc: "O Japão elevará a taxa de natalidade por meio de auxílios familiares, incentivos pró-natalidade e renovação cultural. O Estado se compromete com gastos de bem-estar permanentes, independentemente de os nascimentos aumentarem. Esse caminho troca a incerteza fiscal do declínio pela certeza de direitos adquiridos irreversíveis."
 JAP_pronatalist_turn: "Iniciativa Mais Um"
 JAP_pronatalist_turn_desc: "O Japão lançará uma campanha abrangente para incentivar a natalidade como prioridade cívica, inspirando-se na estratégia 'Mais Um' do início dos anos 2000. Por meio de incentivos fiscais, mensagens públicas e reconhecimento cultural das famílias com vários filhos, o Estado mudará as atitudes sociais em favor de famílias maiores, ao mesmo tempo que oferecerá apoio concreto que torne a paternidade e a maternidade mais acessíveis e atraentes."
 JAP_national_revival_campaign: "Iniciativa de Revitalização Regional"
 JAP_national_revival_campaign_desc: "O Japão canalizará investimentos para as regiões, reavivando comunidades locais que se esvaziaram à medida que os jovens migram para Tóquio. Ao criar empregos, melhorar as comodidades e restaurar a fé no Japão provincial, pretendemos fixar famílias fora da metrópole e desacelerar a concentração populacional que aprofunda o declínio rural. Regiões fortes são a base para famílias estáveis e taxas de natalidade sustentáveis."
 JAP_three_generation_household: "O Lar de Três Gerações"
 JAP_three_generation_household_desc: "O Japão subsidiará os lares de três gerações por meio de incentivos fiscais e apoio à moradia, reavivando um arranjo em que avós oferecem cuidado infantil e cuidado de idosos sem salário de mercado. O Estado transfere os custos de bem-estar para os laços familiares, reduzindo seus próprios gastos. O cuidado prestado em casa é um cuidado que o Estado não paga."
 JAP_homeland_production_drive: "Monozukuri em Casa"
 JAP_homeland_production_drive_desc: "O Japão aprofundará seu compromisso com a manufatura doméstica, investindo em automação e treinamento de trabalhadores para maximizar a produção de uma força de trabalho em declínio. Em vez de transferir a produção para o exterior ou contratar migrantes, o Japão segue a tradição do monozukuri, a arte de fazer bem as coisas. O custo é a pressão energética e custos mais altos."
 JAP_incentivize_large_families: "Auxílio Infantil Ampliado"
 JAP_incentivize_large_families_desc: "O Japão ampliará o auxílio infantil jido teate com generosas transferências em dinheiro que aumentam a cada filho adicional. Ao tornar a paternidade e a maternidade mais acessíveis, o Estado remove uma restrição determinante ao tamanho da família. Uma vez inscrito em lei, o auxílio se torna um direito permanente que nenhum governo futuro ousará cortar."
 JAP_state_family_mandate: "A Família como Imperativo do Estado"
 JAP_state_family_mandate_desc: "O Japão imporá a formação de famílias por meio da legislação trabalhista, de incentivos previdenciários e de mensagens sociais que pressionam as mulheres para a maternidade e os homens para a paternidade. Esta é a resposta barata: o Estado gasta pouco enquanto convoca os cidadãos para a reprodução. O custo é a legitimidade e o ressentimento."
 JAP_a_nation_reborn: "Uma Nação Renascida"
 JAP_a_nation_reborn_desc: "A taxa de natalidade se estabilizou e começou a subir, a maternidade é honrada e as comunidades regionais foram revitalizadas. O Japão reverteu o declínio demográfico por meio de investimento pró-natalidade sustentado. Duas décadas de auxílios, subsídios à moradia e cuidado de idosos se solidificaram em direitos adquiridos que nenhum governo futuro pode cortar."
 JAP_womenomics: "Womenomics"
 JAP_womenomics_desc: "O Japão mobilizará as mulheres em todos os setores econômicos, derrubando barreiras, oferecendo creches e mudando a cultura corporativa. Isso libera capacidade produtiva e arrecadação de impostos sem gerar mais filhos. O Estado deverá construir e manter o sistema de creches, e o Japão conservador o encarará como um ataque à família."
 JAP_eliminate_daycare_waitlists: "Iniciativa Zero Crianças em Lista de Espera"
 JAP_eliminate_daycare_waitlists_desc: "O Japão implementará o Plano de Segurança na Criação dos Filhos, ampliando berçários, creches e o atendimento extraescolar até que as listas de espera acabem. Um pesado investimento em salários e na construção das instalações remove o principal obstáculo à participação feminina na força de trabalho. Essas instalações precisarão ser mantidas e financiadas para sempre."
 JAP_reform_spousal_tax_deduction: "Derrubar o Muro de 1,03 Milhão de Ienes"
 JAP_reform_spousal_tax_deduction_desc: "O Japão eliminará o precipício da dedução fiscal para cônjuges em 1,03 milhão de ienes e reestruturará os limites da previdência social que o sustentam. Isso remove a penalidade ao emprego em tempo integral que prendeu milhões de mulheres ao trabalho de meio período. Demolir o muro libera um vasto contingente de mulheres experientes e instruídas para o emprego em tempo integral."
 JAP_normalize_parental_leave: "Campanha Ikumen"
 JAP_normalize_parental_leave_desc: "O Japão lançará a campanha Ikumen, garantindo licença parental remunerada a ambos os pais e pressionando os homens a tirá-la. Quando os pais se tornam cuidadores de rotina, as mulheres deixam de ser aprisionadas pela maternidade e o fardo é compartilhado. As empresas arcarão com o custo em produção perdida, e a geração dos assalariados não cederá em silêncio."
 JAP_women_in_management: "A Iniciativa 202030"
 JAP_women_in_management_desc: "O Japão perseguirá a meta 202030: três em cada dez cargos de liderança ocupados por mulheres. A Lei de Promoção da Participação e do Avanço das Mulheres no Local de Trabalho estabelece metas obrigatórias para empresas e para o setor público, exige transparência e recompensa as empresas que lideram a mudança. As mulheres terão poder real em todas as diretorias e repartições do serviço público."
 JAP_family_first_model: "Reforma do Estilo de Trabalho: Caminho da Família"
 JAP_family_first_model_desc: "O movimento de Reforma do Estilo de Trabalho priorizará o caminho da família: horários flexíveis, carreiras de meio período e auxílios-filho ampliados permitirão que as mulheres permaneçam na força de trabalho sem abrir mão da possibilidade da maternidade. Esse caminho aceita uma produção geral menor para preservar tanto as carreiras quanto os nascimentos, apostando que a estabilidade social e uma modesta recuperação demográfica valem mais que o crescimento econômico máximo."
 JAP_career_first_model: "Reforma do Estilo de Trabalho: Caminho da Carreira"
 JAP_career_first_model_desc: "O movimento de Reforma do Estilo de Trabalho prioriza o caminho da carreira: sem flexibilidade, sem carreiras de meio período, mas com igualdade genuína na promoção e na remuneração. As mulheres competem em pé de igualdade por todos os cargos, maximizando a produção econômica e a renda feminina. Isso torna a maternidade mais difícil, e a taxa de natalidade cairá ainda mais, pois muitas escolherão a ambição em vez da família."
 JAP_a_society_where_women_thrive: "Uma Sociedade Onde as Mulheres Prosperam"
 JAP_a_society_where_women_thrive_desc: "As barreiras estruturais caíram e as mulheres trabalham em todos os níveis com igualdade e liberdade de escolha genuínas, ampliando tanto a força de trabalho quanto a base tributária. O que a reforma nunca entregou foram filhos. O Japão trabalha mais e ganha mais, mas continua encolhendo, sustentado por um aparato de creches e educação que o Estado precisará financiar para sempre."
 JAP_open_japan: "Japão Aberto"
 JAP_open_japan_desc: "O Japão atrairá sistematicamente trabalhadores do exterior por meio de pactos migratórios, imigração baseada em qualificação e reforma de vistos para preencher a lacuna de mão de obra. Isso resolve a escassez de trabalhadores em anos, e não em décadas, garantindo pleno emprego e a solvência da previdência. A identidade cultural sofre pressão, as comunidades mudam mais rápido que o consentimento, e cada passo convida uma reação nacionalista."
 JAP_labor_migration_pact: "Acordos Bilaterais de Mobilidade de Trabalhadores"
 JAP_labor_migration_pact_desc: "O Japão formalizará acordos trabalhistas bilaterais com países vizinhos, ampliando o Programa de Treinamento de Estagiários Técnicos e estabelecendo novos acordos recíprocos para trazer trabalhadores à construção, agricultura, cuidados de enfermagem e manufatura. Esses pactos são rápidos e eficientes: dezenas de milhares de trabalhadores podem ser incorporados em meses, preenchendo lacunas críticas e estabilizando o emprego em setores que, de outra forma, encolheriam ou desapareceriam por completo."
 JAP_points_based_immigration: "Programa de Profissionais Altamente Qualificados"
 JAP_points_based_immigration_desc: "O Japão estabelecerá um sistema de pontos para profissionais altamente qualificados, concedendo pontos por formação, experiência profissional, domínio do idioma e residência anterior. Engenheiros, enfermeiros, pesquisadores e profissionais de finanças ocupam empregos de alto valor e aliviam o gargalo do crescimento. Os recém-chegados qualificados trazem suas famílias e esperam escolas internacionais, um custo que o Estado absorve em troca de uma capacidade de pesquisa que não poderia comprar de outra forma."
 JAP_integration_programs: "Marco de Integração Tabunka Kyosei"
 JAP_integration_programs_desc: "O Japão investirá em integração ativa, o tabunka kyosei, por meio de aulas de idioma, centros comunitários e caminhos para a residência permanente de trabalhadores migrantes e suas famílias. Recém-chegados que recebem os meios de pertencer geram menos atrito e contribuem mais plenamente. Ensino do idioma, escolas e assistência social para famílias migrantes tornam-se um encargo orçamentário permanente que compensa o que a migração sem controle custa em policiamento."
 JAP_multicultural_society: "Uma Sociedade Multicultural"
 JAP_multicultural_society_desc: "O Japão estende status legal, participação cívica e reconhecimento cultural aos migrantes e seus filhos como membros plenos da comunidade nacional. É uma ruptura profunda com o isolamento histórico, transformando o ressentimento em potencial em pertencimento e sustentando a estabilidade social. Direitos cívicos e assistenciais plenos para milhões de novos japoneses são direitos caros e permanentes que não sairão mais das contas de educação e assistência social."
 JAP_guest_worker_system: "Expansão do Visto de Trabalhador Qualificado Específico"
 JAP_guest_worker_system_desc: "O Japão expandirá o visto de Trabalhador Qualificado Específico, o tokutei gino, trazendo trabalhadores com contratos de prazo fixo para a construção, agricultura, cuidados de enfermagem e manufatura. Eles vêm, fazem o trabalho e voltam para casa quando o contrato termina, preenchendo a lacuna de mão de obra sem o atrito da imigração permanente. Isso cria uma população rotativa com poucas proteções e sem vínculo com a comunidade, e policiá-la se torna um custo permanente para as empresas."
 JAP_an_open_nation: "Uma Nação Aberta"
 JAP_an_open_nation_desc: "A população do Japão se estabilizou e cresceu por meio da migração, transformando um país monoétnico em um país multicultural. A estabilidade econômica e a solvência da previdência estão preservadas, mas a sensação de homogeneidade étnica se fraturou e a geração mais velha lamenta uma nação que se vai. O policiamento, a educação e a assistência social para uma população que chegou mais rápido do que as instituições foram construídas permanecerão elevados por uma geração."
 JAP_economic_sectors: "Setores Econômicos do Japão"
 JAP_economic_sectors_desc: "Da agricultura, silvicultura e pesca enraizadas localmente à manufatura, aos serviços e às tecnologias avançadas, faremos brilhar os pontos fortes do Japão em toda a paisagem industrial. Ao apoiar o emprego doméstico e a capacidade de abastecimento, equilibraremos a competitividade das exportações com o investimento em novos campos de crescimento, levando nossa base industrial para a próxima era."
 JAP_agricultural_revitalization: "Revitalizando as Indústrias Primárias"
 JAP_agricultural_revitalization_desc: "O Ministério da Agricultura, Silvicultura e Pesca revisa a Lei Básica pela primeira vez em um quarto de século, unindo os três setores em uma estratégia nacional unificada de segurança alimentar. Com o agricultor médio se aproximando dos setenta anos e os campos sendo abandonados pelo interior, essa integração se torna a base da recuperação rural e de todas as reformas que se seguem."
 JAP_corporate_farm_consolidation: "Bancos de Terras Agrícolas e o Fim do Gentan"
 JAP_corporate_farm_consolidation_desc: "Os Bancos de Consolidação de Terras Agrícolas reúnem lotes dispersos em propriedades maiores, enquanto a abolição da cota de arroz gentan encerra meio século de pagamentos a agricultores para deixar os campos em pousio. A mecanização e a disciplina de mercado elevarão a produtividade, mas os pequenos produtores familiares que não conseguirem competir serão expulsos da terra."
 JAP_revitalize_rural_communities: "A Estratégia de Revitalização Regional"
 JAP_revitalize_rural_communities_desc: "Sob a bandeira do chiho sosei, o governo sustenta a agricultura em distritos remotos por meio de pagamentos diretos e canaliza a riqueza urbana de volta às aldeias via imposto da cidade natal, atraindo jovens famílias para onde os campos voltariam a ser mata selvagem. O crescimento aqui é mais lento que na consolidação corporativa, mas mantém o campo vivo."
 JAP_smart_rice_farming: "Agricultura Inteligente e a Arte do Saquê"
 JAP_smart_rice_farming_desc: "O Japão alia a herança do arroz à agricultura inteligente: orientação por satélite, drones e arrozais com sensores permitem que uma força de trabalho em declínio e envelhecida cuide de mais terra com menos mãos. Marcas premium como a Koshihikari e a sede mundial pelo saquê japonês levam a colheita às mesas dentro e fora do país."
 JAP_premium_wagyu_brand: "A Marca de Exportação Wagyu"
 JAP_premium_wagyu_brand_desc: "Com base nas indicações geográficas protegidas e na lei que protege a genética do wagyu contra o contrabando, o Japão desenvolve a raça como um produto de exportação premium, cujo preço se apoia na procedência e na qualidade, e não no volume. Os melhores restaurantes do mundo servirão carne bovina japonesa."
 JAP_sustainable_fisheries: "A Reforma da Lei da Pesca"
 JAP_sustainable_fisheries_desc: "A reforma de 2018 da Lei da Pesca, a primeira revisão em setenta anos, impõe cotas de captura baseadas na ciência e recompensa a pesca responsável, ao mesmo tempo em que injeta investimento na aquicultura, do atum-azul de cativeiro aos moluscos costeiros. Mares sustentáveis manterão as cidades costeiras trabalhando e a cultura alimentar da nação abastecida."
 JAP_forestry_revival: "O Imposto Ambiental Florestal"
 JAP_forestry_revival_desc: "Financiado pelo Imposto Ambiental Florestal, o Japão desbasta e replanta plantações abandonadas de cedro e cipreste, mecaniza a extração de madeira e promove a madeira laminada cruzada, para que a madeira nacional volte aos canteiros de obras. Um setor florestal revivido traz trabalho de volta às aldeias de montanha e transforma um recurso há muito ocioso em força nacional."
 JAP_pharmaceutical_powerhouse: "Enfrentando o Atraso de Medicamentos"
 JAP_pharmaceutical_powerhouse_desc: "O terceiro maior mercado farmacêutico do mundo é dominado por Takeda, Astellas, Daiichi Sankyo e Chugai, mas um crescente atraso na aprovação de medicamentos deixa os pacientes esperando anos por remédios estrangeiros. O governo agiliza as aprovações da PMDA e apoia a biotecnologia e a medicina regenerativa, transformando uma indústria madura em motor de crescimento de alto valor."
 JAP_rural_revitalization: "A Sexta Industrialização"
 JAP_rural_revitalization_desc: "Sob a sexta industrialização, o rokuji sangyoka, os produtores primários também processam e vendem o que produzem. Hospedagens em fazendas, alimentos regionais de marca e vendas diretas ao consumidor transformam aldeias em dificuldades em destinos turísticos, trazendo jovens famílias de volta à terra como a âncora mais confiável contra a maré demográfica."
 JAP_agricultural_construction_drive: "Impulso de Construção Agrícola"
 JAP_agricultural_construction_drive_desc: "Um esforço nacional concentrado para iniciar obras em novas terras agrícolas e instalações rurais enquanto a vontade política e os subsídios estão alinhados, acelerando a construção por todo o campo."
 JAP_automotive_industry: "As Rodas da Nação"
 JAP_automotive_industry_desc: "Sete fabricantes japoneses montam juntos oito milhões de veículos por ano, sustentando cerca de um em cada doze empregos japoneses, incluindo fabricantes de peças, concessionárias e transportadores. Dos galpões de montagem de Aichi aos cais de exportação de Yokohama, o Japão defenderá seu lugar como o maior exportador de veículos do mundo."
 JAP_lean_production_system: "O Sistema Toyota de Produção"
 JAP_lean_production_system_desc: "O Sistema Toyota de Produção moldou a manufatura moderna com a entrega just-in-time, o jidoka e a busca kaizen pela eliminação do muda, permitindo que as fábricas japonesas produzam mais carros com menos defeitos e menos estoque do que qualquer rival. O Japão espalhará a disciplina enxuta por toda a indústria, formando uma geração capaz de enxergar desperdício onde outros não veem nenhum."
 JAP_keiretsu_supplier_network: "A Teia de Fornecedores Keiretsu"
 JAP_keiretsu_supplier_network_desc: "Por trás de cada carro pronto há uma pirâmide de fornecedores unidos por décadas de confiança: Denso, Aisin, Toyota Industries e milhares de oficinas menores, cada uma mestra em seu ofício pela disciplina do monozukuri. O Japão aprofundará esses laços keiretsu e garantirá a sobrevivência dos fornecedores de segundo e terceiro níveis, fazendo da resiliência da cadeia de suprimentos um ativo estratégico."
 JAP_precision_machine_tools: "Os Robôs que Constroem os Carros"
 JAP_precision_machine_tools_desc: "FANUC e Yaskawa dominam o mercado mundial de robôs industriais, enquanto Yamazaki Mazak, DMG Mori e Okuma definem o padrão em máquinas-ferramenta de precisão. À medida que a força de trabalho envelhece e encolhe, o Japão investirá pesado em robótica e mecatrônica, mantendo a nação como a oficina que equipa as fábricas do mundo."
 JAP_domestic_champions: "O Padrão Lexus"
 JAP_domestic_champions_desc: "A Lexus provou que o Japão podia desafiar as casas de luxo alemãs em seu próprio terreno, uma lição que desde então se espalhou pela indústria. O Japão cultivará o valor de marca de sua engenharia e perseguirá os segmentos de alta margem, competindo em qualidade e prestígio, e não apenas em preço."
 JAP_hybrid_powertrains: "A Revolução Híbrida"
 JAP_hybrid_powertrains_desc: "O Prius provou que o Japão podia apostar onde outros temiam, unindo motor a gasolina e motor elétrico sem exigir a rede de recarga que o mundo ainda não tinha. O Japão dobrará a aposta nesse caminho híbrido, refinando-o como a ponte pragmática entre a era do petróleo e o que vier depois."
 JAP_battery_electric_shift: "A Aposta no Elétrico a Bateria"
 JAP_battery_electric_shift_desc: "O Nissan Leaf foi o primeiro carro elétrico de massa, mas o Japão desde então viu rivais disparando na energia puramente a bateria. Para alcançá-los, o governo se compromete com programas emergenciais de células de estado sólido e uma onda de gigafábricas nacionais, para que a parte mais valiosa do carro seja feita em casa."
 JAP_hydrogen_society: "Rumo a uma Sociedade do Hidrogênio"
 JAP_hydrogen_society_desc: "O sedã de célula de combustível Mirai e a Estratégia Básica do Hidrogênio traçam uma visão em que carros, caminhões, casas e usinas funcionam com o elemento mais abundante do universo, sem emitir nada além de água. O Japão construirá a rede de abastecimento e apoiará os fabricantes de células de combustível, perseguindo o hidrogênio como uma resposta distintamente japonesa ao fim da combustão."
 JAP_automotive_superpower: "A Superpotência da Mobilidade"
 JAP_automotive_superpower_desc: "O Japão não será forçado a escolher um único caminho para o futuro. Dominando ao mesmo tempo o híbrido, a bateria e a célula de combustível, e mantendo as fábricas enxutas e a teia de fornecedores que os constroem como as melhores do mundo, o Japão garante seu lugar como a superpotência da mobilidade do século."
 JAP_automotive_retooling_drive: "Reequipamento da Linha de Montagem"
 JAP_automotive_retooling_drive_desc: "Um esforço nacional para reequipar e modernizar as linhas de montagem automotivas, reorganizando as fábricas para a próxima geração de veículos enquanto o investimento e a vontade política estão alinhados."
 JAP_battery_gigafactory_program: "Programa de Gigafábricas de Baterias"
 JAP_battery_gigafactory_program_desc: "Um esforço concentrado para erguer gigafábricas de baterias nacionais, ampliando rapidamente a capacidade de produção de células para que o coração do carro elétrico seja feito em casa, e não importado."
 JAP_motorcycle_kingdom: "Reino das Duas Rodas"
 JAP_motorcycle_kingdom_desc: "Honda, Yamaha, Kawasaki e Suzuki constroem a esmagadora maioria dos veículos motorizados de duas rodas da Terra, das motonetas de uso diário que movem centenas de milhões de pessoas pelo Sudeste Asiático às superbikes de mil cilindradas que dominam os grids do MotoGP e do Mundial de Superbike. O Japão investirá em fábricas de duas rodas e defenderá a liderança de engenharia que mantém os rivais perseguindo motores japoneses uma geração atrás."
 JAP_kei_car_mobility: "A Nação dos Kei Cars"
 JAP_kei_car_mobility_desc: "Quase dois em cada cinco carros novos vendidos no Japão pertencem à classe kei, minicarros limitados a 660cc por um código tributário escrito para um país mais pobre, e, com o envelhecimento da população fora das cidades, o kei car se torna a última forma prática de os aposentados chegarem à clínica ou à loja. O Japão manterá a classe kei acessível e bem construída, sustentando a mobilidade onde os trens já não circulam."
 JAP_jdm_soft_power: "A Nação do Gran Turismo"
 JAP_jdm_soft_power_desc: "O Skyline GT-R, o Supra e o RX-7 tornaram-se ícones globais da cultura automotiva por meio de animes como Initial D e da franquia Gran Turismo, que ensinou uma geração de jogadores a amar o emblema JDM. O Japão cultivará essa exportação de imagem ao lado do aço, apoiando oficinas de preparação, a cultura touge e a herança do automobilismo que fazem dos carros esportivos japoneses objetos de devoção mundial."
 JAP_export_wharves: "Os Cais de Exportação"
 JAP_export_wharves_desc: "Cerca de metade de todo veículo montado no Japão embarca em navios cargueiros de carros em Yokohama, Nagoya ou Kobe, rumo a portos do mundo todo, fazendo do Japão o maior exportador de veículos do planeta. O governo ampliará os cais, os pátios de triagem e a frota de cargueiros que mantêm esse fluxo de automóveis saindo sem interrupção."
 JAP_automotive_export_drive: "Impulso de Exportação Automotiva"
 JAP_automotive_export_drive_desc: "Um esforço nacional por tempo limitado para ampliar a capacidade das fábricas de montagem e exportação, adicionando turnos e área de produção nas fábricas de carros e componentes enquanto as carteiras de pedidos de exportação estão cheias."
 JAP_electronics_revitalization: "Revitalizando a Eletrônica e os Semicondutores"
 JAP_electronics_revitalization_desc: "A indústria eletrônica do Japão foi expulsa de mercados que um dia dominou por concorrentes da Coreia, de Taiwan e da China. Sob a estratégia de revitalização de semicondutores do METI, o Estado reúne os pontos fortes que sobreviveram em materiais, ferramentas e engenharia de precisão para reconstruir a capacidade competitiva. O antigo domínio do chip pode ser recuperado se o investimento fluir agora."
 JAP_semiconductor_materials: "Mestres de Materiais e Equipamentos"
 JAP_semiconductor_materials_desc: "O Japão nunca perdeu o controle da etapa inicial da cadeia de suprimentos de chips: a Tokyo Electron domina as ferramentas de deposição e corrosão, a Shin-Etsu e a SUMCO fornecem os wafers de silício do mundo, e a JSR e a Tokyo Ohka detêm o mercado de fotorresiste. O governo amplia o investimento nessa alavancagem, deixando toda fundição estrangeira dependente de materiais e máquinas japoneses."
 JAP_rapidus_moonshot: "A Aposta Lunar da Rapidus"
 JAP_rapidus_moonshot_desc: "A Rapidus, apoiada pela Toyota, pela Sony e pelo Estado, corre para construir uma fábrica de dois nanômetros em Chitose, em Hokkaido, em parceria com a IBM e o imec. Nenhuma empresa japonesa toca a vanguarda há anos, e a distância para a TSMC é medida em bilhões. Se der certo, o Japão volta à fronteira da indústria de um só salto."
 JAP_foundry_partnership: "A Parceria da Fundição de Kumamoto"
 JAP_foundry_partnership_desc: "Onde a Rapidus aposta na vanguarda, a JASM, em Kumamoto, faz parceria com a TSMC e a Sony para produzir nós maduros para automóveis e sensores. É um teto mais baixo que o da aposta lunar e um piso sob a economia: chips feitos em casa, em volume, para as indústrias que não podem se dar ao luxo de ficar sem eles."
 JAP_semiconductor_sovereignty: "Soberania em Semicondutores"
 JAP_semiconductor_sovereignty_desc: "Casas de projeto, fabricantes de ferramentas, fornecedores de materiais e fábricas são entrelaçados em um ecossistema nacional autossustentável. Numa era de controles de exportação e pontos de estrangulamento, o Japão não voltará a depender da boa vontade estrangeira pelo silício de que sua economia precisa."
 JAP_home_electronics: "O Fantasma de Galápagos"
 JAP_home_electronics_desc: "A síndrome de Galápagos deixou a eletrônica de consumo japonesa brilhante em casa e inadequada para venda no exterior, e o celular gara-kei se tornou obsoleto no instante em que o smartphone chegou. Sharp, Sony e Panasonic foram expulsas de mercados que um dia dominaram. O Estado ampara o que resta, mantendo vivas as linhas de montagem e o artesanato enquanto a indústria reencontra o rumo."
 JAP_gaming_powerhouse: "A Potência dos Games"
 JAP_gaming_powerhouse_desc: "Os consoles da Nintendo estão entre os mais vendidos de todos os tempos, o PlayStation da Sony ancora um império global, e Capcom, Sega, Square Enix e Bandai Namco fornecem o software para ambos. O governo amplia o investimento em estúdios e hardware e alarga o funil de talentos que mantém o Japão no centro do entretenimento interativo."
 JAP_rights_and_licensing_regime: "Direitos e Licenciamento no Exterior"
 JAP_rights_and_licensing_regime_desc: "Animes, mangás, jogos e música levam a imagem do Japão mais longe do que qualquer embaixada, e a iniciativa Cool Japan existe para converter esse alcance em receita. O Estado investe em distribuição, tradução e gestão de direitos para que a produção criativa renda no exterior em vez de vazar para lá. Cada licença é assinada sob a lei contratual estrangeira e os padrões de radiodifusão estrangeiros, e a indústria aprende isso um acordo de cada vez."
 JAP_broadband_nation: "Uma Nação em Fibra"
 JAP_broadband_nation_desc: "A NTT e suas rivais levaram fibra até as casas enquanto boa parte do mundo ainda se arrastava no cobre, dando ao Japão uma das conexões mais rápidas e baratas da Terra. O governo estende a fibra de alta capacidade aos últimos vales e ilhas desatendidos, para que nenhum canto do país fique isolado da economia digital."
 JAP_beyond_5g: "Rumo ao Beyond 5G"
 JAP_beyond_5g_desc: "O Japão ficou de fora das guerras dos smartphones e não pretende perder o Beyond 5G. O Estado financia consórcios de pesquisa e arquiteturas de rede abertas, da rede de acesso por rádio à espinha dorsal óptica, para que as empresas japonesas ditem os termos das redes da década de 2030 em vez de apenas comprá-las."
 JAP_electronics_superpower: "Superpotência da Eletrônica Mais Uma Vez"
 JAP_electronics_superpower_desc: "Materiais, fábricas em Hokkaido e Kyushu, consoles e infraestrutura de fibra agora completam toda a arquitetura da eletrônica. O antigo mestre da era do silício lutou para voltar à fronteira. Seul, Taipé e Xangai precisarão lidar com o retorno do Japão."
 JAP_energy_resource_strategy: "O Plano Estratégico de Energia"
 JAP_energy_resource_strategy_desc: "O Ministério da Economia, Comércio e Indústria coordena o Plano Básico de Energia em geração de energia, resiliência da rede e segurança de recursos para blindar a nação contra choques energéticos. Da energia nuclear às renováveis e às reservas estratégicas, esse órgão dirige todo o aparato do Estado para manter as luzes acesas e as fundições abastecidas."
 JAP_renewable_energy_expansion: "A Revolução da Tarifa Feed-in"
 JAP_renewable_energy_expansion_desc: "A tarifa feed-in libera capacidade solar por Kyushu e parques eólicos ao largo de Akita, enquanto os padrões de eficiência Top Runner espremem o desperdício de cada eletrodoméstico e linha de fábrica. Kyocera e Sharp migram para o comércio solar. O sol e o vento jamais poderão ser embargados."
 JAP_power_grid_stabilization: "Nunca Mais no Escuro"
 JAP_power_grid_stabilization_desc: "Novos conversores de frequência e interconexões unem o país em um único sistema resiliente, superando a divisão entre o leste de cinquenta hertz e o oeste de sessenta hertz que antes cindia a rede. As concessionárias são obrigadas a manter capacidade de reserva e a escolher se a solar, a térmica ou o armazenamento responde a cada choque conforme ele surge."
 JAP_resource_security_initiative: "Garantir os Tendões da Indústria"
 JAP_resource_security_initiative_desc: "A estratégia nacional de recursos abrange estoques estratégicos, participação em minas no exterior, reciclagem e a zona econômica exclusiva, tudo voltado a proteger a indústria de embargos. Os ministérios direcionam aço, petróleo e metais raros às fábricas que mais precisam deles, transformando a dependência de importações em resiliência administrada."
 JAP_hydroelectric_power: "Domar os Rios das Montanhas"
 JAP_hydroelectric_power_desc: "Os rios íngremes e alimentados pela chuva do Japão movem turbinas confiáveis, enquanto usinas reversíveis como Kannagawa armazenam energia barata da noite para o pico do fim do dia. Barragens modernizadas extraem mais potência de uma infraestrutura que o país já possui. O fluxo é limpo, doméstico e constante."
 JAP_hydroelectric_power_TT: "Aumenta em §G25%§! a geração de energia hidrelétrica em §Y[613.GetName]§!, §Y[615.GetName]§! e §Y[616.GetName]§!"
 JAP_geothermal_development: "Fogo Sob as Ilhas"
 JAP_geothermal_development_desc: "A Organização Japonesa para Metais e Segurança Energética financia a exploração geotérmica de Hachijojima às terras altas de Appi, apesar das objeções dos parques nacionais e dos donos de fontes termais. Usinas de ciclo binário fornecem energia constante dia e noite, faça chuva ou faça sol, aproveitando o calor do Círculo de Fogo para abastecer a rede."
 JAP_geothermal_development_TT: "Aumenta em §G25%§! a geração de energia geotérmica em §Y[609.GetName]§!, §Y[616.GetName]§! e §Y[617.GetName]§!"
 JAP_nuclear_restart: "Reiniciar os Reatores"
 JAP_nuclear_restart_desc: "Sob a política de Transformação Verde, o governo religa a frota nuclear, de Sendai, em Kyushu, ao vasto complexo de Kashiwazaki-Kariwa, no Mar do Japão. Os reguladores são rigorosos e o público é desconfiado, mas a aritmética da segurança energética é implacável. O átomo deve carregar a carga de base mais uma vez.\n-------------\nReativa a geração nuclear e abre o §YPrograma de Reinício de Reatores§!, no qual cada usina é religada uma de cada vez. Sendai, Ikata e o grupo de Fukui podem ser iniciados de imediato; os locais mais difíceis vêm depois, conforme os focos regulatório e de consentimento forem concluídos."
 JAP_nuclear_regulatory_compliance: "Cumprir os Novos Padrões de Segurança"
 JAP_nuclear_regulatory_compliance_desc: "As usinas que buscam reinício devem passar nos padrões da Autoridade de Regulação Nuclear, os mais rigorosos do mundo: adaptações sísmicas e contra tsunamis, instalações de segurança obrigatórias e uma revisão que não concede nada por confiança. O trabalho é lento e enormemente caro, e é o único caminho para uma frota operante. Uma usina que passa por ele funciona melhor do que antes.\n-------------\nRemove o espírito §YPadrões de Segurança Nuclear Endurecidos§! e abre os reinícios de Genkai, Onagawa e Shimane."
 JAP_local_consent_accords: "Conquistar o Consentimento Local"
 JAP_local_consent_accords_desc: "Um reinício exige mais do que a aprovação do regulador, pois governadores de província e municípios anfitriões detêm um veto efetivo e os tribunais distritais já concederam liminares antes. Kagoshima e Ehime liberaram Sendai e Ikata por meio de acordos negociados com as comunidades anfitriãs, com subsídios, empregos e uma paciente confiança local. O regime de subsídios é caro, e é ele que torna possíveis os reinícios mais difíceis.\n-------------\nAbre os reinícios de Tomari e Kashiwazaki-Kariwa, os dois locais mais difíceis do país."
 JAP_restart_flagship_fleet: "O Ciclo do Combustível de Rokkasho"
 JAP_restart_flagship_fleet_desc: "A usina de reprocessamento de Rokkasho, em Aomori, fecha o ciclo do combustível, recuperando plutônio e urânio do combustível usado para novos reatores. O Japão possui plutônio separado e a capacidade instalada para enriquecê-lo ainda mais, fato que Pequim, Seul e Pyongyang jamais deixaram de notar.\n-------------\nOs vizinhos do Japão verão o estoque com §Rmaus olhos§!."
 JAP_decommissioning_authority: "O Longo Desligamento"
 JAP_decommissioning_authority_desc: "Desmontar a frota com segurança leva décadas, exige manter unido um contingente cada vez menor de engenheiros nucleares e demanda a gestão dos locais muito depois de os reatores esfriarem. O público respira mais aliviado e o balanço contábil, não. Toda frota de reatores envelhecida no mundo enfrenta o mesmo acerto de contas, e a nação que dominar esse trabalho primeiro poderá vender a experiência a todas elas.\n-------------\nAbre os projetos do conversor de frequência, da interconexão de Hokkaido e do hidrogênio de Kobe."
 JAP_lng_bridge_supply: "A Ponte Fóssil"
 JAP_lng_bridge_supply_desc: "O gás natural liquefeito e o carvão preenchem a lacuna deixada pelos reatores parados, tornando o Japão o maior importador de GNL do mundo. Usinas a gás em Futtsu e Senboku podem ser construídas rapidamente e operar a pleno vapor, mas cada carregamento é pago em moeda estrangeira. A conta de luz das famílias arca com a diferença.\n-------------\nUma ponte, e uma ponte §Rcara§!. O projeto de coqueima com amônia é como o Japão acabará saindo dela."
 JAP_renewable_acceleration: "Sol, Vento e Água"
 JAP_renewable_acceleration_desc: "Leilões de energia eólica offshore nas zonas de Akita e Chiba, energia solar em escala de usina e regras de conexão à rede reescritas elevam a participação das renováveis mais rápido do que a tarifa feed-in jamais conseguiu sozinha. A intermitência e os limites da rede permanecem, e o quilowatt-hora mais barato continua sendo aquele que o Japão aprendeu a não usar."
 JAP_fusion_energy_program: "A Abordagem Ampliada"
 JAP_fusion_energy_program_desc: "O Japão abriu mão de sediar o ITER e aceitou em troca a Abordagem Ampliada: o acelerador de materiais para fusão e o centro internacional de pesquisa em Rokkasho, além do tokamak JT-60SA em Naka. Bobinas supercondutoras, girotrons e um longo aprendizado em física de plasma são o retorno dessa barganha.\n-------------\nSeja com o reinício ou com o desligamento dos reatores, a aposta na fusão se sustenta. Esta é a única aposta energética que §Ynenhum dos caminhos impede§!."
 JAP_national_energy_security: "Uma Nação Energizada"
 JAP_national_energy_security_desc: "Um suprimento estável e resiliente (carga de base restaurada ou uma rede de renováveis e armazenamento) apoiado em uma base de pesquisa que vai além da fissão. A segurança energética se torna o alicerce de toda a economia."
 JAP_monarchy_resource_anchor_tt: "Os efeitos de §Y$JAP_rare_earth_resilience$§! serão melhorados"
 JAP_reactors_recommissioned_tt: "Os reatores desativados são §Greativados§! e podem gerar energia novamente"
 JAP_national_energy_security_tt1: "Com §Y6§! dos §Y8§! locais de reatores novamente em operação (atualmente §Y[?JAP_reactor_sites_online|0]§!):"
 JAP_national_energy_security_tt2: "Com §Y6§! dos §Y8§! projetos de transformação verde concluídos (atualmente §Y[?JAP_gx_projects_completed|0]§!):"
 JAP_national_energy_security_tt3: "Ficando aquém de qualquer uma das metas:"
 JAP_minamitori_deep_sea: "A Lama de Minamitori"
 JAP_minamitori_deep_sea_desc: "O fundo do mar dentro da zona econômica exclusiva do Japão em torno de Minamitorishima guarda lama de terras raras em concentrações encontradas em nenhum outro lugar do planeta, sob mais de cinco mil metros de água. A JOGMEC e a Universidade de Tóquio financiam o tubo ascendente e os testes de içamento que tornariam a extração possível. Se a lama puder ser trazida à superfície, o Japão deixa de depender de um único fornecedor estrangeiro dos metais de que seus ímãs e motores precisam."
 JAP_national_petroleum_stockpile: "Encher as Reservas Nacionais"
 JAP_national_petroleum_stockpile_desc: "A Organização Japonesa para Metais e Segurança Energética amplia a reserva estratégica de petróleo mantida nos parques de tanques costeiros de Shibushi, Kiire e Tomakomai, acrescentando cavernas de sal e silos em superfície. A reserva maior compra à nação meses de seguro contra um Estreito de Ormuz fechado. Um tanque cheio é poder silencioso."
 JAP_grid_battery_storage: "A Rede do Futuro"
 JAP_grid_battery_storage_desc: "A GS Yuasa e a Panasonic, veteranas da era do íon-lítio, voltam suas células para o armazenamento em escala de rede, enquanto subsídios estatais bancam as baterias que surgem ao lado das subestações. Combinado a uma rede mais inteligente, o armazenamento suaviza os picos e preenche os vales. O elétron poupado ao meio-dia ilumina a cidade ao entardecer."
 JAP_urban_mining: "Minerar as Cidades"
 JAP_urban_mining_desc: "Em suas usinas de Naoshima e Onahama, a Mitsubishi Materials recupera ouro, cobre e metais raros de sucata eletrônica enviada de todo o mundo. As medalhas dos Jogos Olímpicos de Tóquio foram cunhadas com metal reaproveitado. O que o país descarta, ele funde de novo."
 JAP_horizontal_recycling: "Metal Sem Fim"
 JAP_horizontal_recycling_desc: "A reciclagem horizontal devolve o alumínio e o aço ao seu grau original, fechando o ciclo entre o ferro-velho e a laminação. A UACJ e a Kobe Steel constroem as linhas de triagem e refino que fazem a recuperação de lata para lata e de peça para peça funcionar em escala industrial. Uma tonelada mantida em circulação é uma tonelada que nunca mais precisará ser importada."
 JAP_nankai_methane_hydrate: "O Gelo de Fogo da Fossa de Nankai"
 JAP_nankai_methane_hydrate_desc: "A Organização Japonesa para Metais e Segurança Energética lança seus navios de pesquisa em busca de um método comercial para o hidrato de metano preso na Fossa de Nankai, na costa do Pacífico. O Japão realizou ali o primeiro teste de produção offshore do mundo, e a engenharia ainda não está comprovada, enquanto a economia continua assustadora. Se o gelo de fogo render, o Japão nunca mais precisará implorar por gás."
 JAP_model_competition: "Competição Eletrônica do Leste Asiático"
 JAP_model_competition_desc: "A indústria eletrônica do Japão está travada em uma disputa implacável com seus vizinhos. Samsung e SK Hynix dominam a memória, a TSMC detém o negócio de fundição de ponta, e as fábricas da China sobem a escada nó a nó, com o respaldo de um fundo estatal quase sem fundo. Cada avanço de um rival é um mercado perdido, uma margem espremida, uma geração de engenheiros tentada a ir para o exterior. Só o investimento sustentado mantém a pressão sob controle; se ele afrouxar enquanto a concorrência avança, o chão cede sob os pés do Japão.\n-------------\nElevar a §YResiliência Eletrônica§! acima da pressão competitiva a alivia e, por fim, remove este espírito nacional. Veja §Y$JAP_technological_isolation_category$§! para os números atuais."
 JAP_consumer_electronics_drive: "Impulso à Eletrônica de Consumo"
 JAP_consumer_electronics_drive_desc: "Um esforço por tempo limitado para manter as linhas domésticas de eletrônica de consumo operando a plena capacidade, sustentando as fábricas, os fornecedores e as mãos habilidosas que as montam enquanto a indústria enfrenta a tempestade."
 JAP_foundry_localization: "Programa de Localização de Fundições"
 JAP_foundry_localization_desc: "Um esforço concentrado para localizar a cadeia de suprimentos das fundições, montando as ferramentas, os materiais e os técnicos treinados em torno das novas fábricas para que a produção nacional de chips possa crescer rapidamente."
 JAP_electronics_export_offensive: "Ofensiva de Exportação de Eletrônicos"
 JAP_electronics_export_offensive_desc: "Lance uma ofensiva coordenada de subsídios, missões comerciais e marketing conjunto para recuperar participação de mercado dos concorrentes estrangeiros, gastando pesado para reforçar a posição do Japão no comércio global de eletrônicos."
 JAP_electronics_resilience_up_tt: "§YResiliência Eletrônica§! contra a concorrência estrangeira: $RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "Rivalidade em Semicondutores"
 JAP_electronics.1.t: "Os Desafiantes Asiáticos se Aproximam"
 JAP_electronics.1.d: "Os números trimestrais fazem uma leitura sombria em Tóquio. Samsung e SK Hynix ampliaram a liderança em memória, a carteira de pedidos da TSMC está estourando, e fundições chinesas estão ganhando contratos que antes vinham ao Japão por padrão. Analistas falam abertamente de um setor eletrônico japonês em declínio estrutural. As diretorias de Kawasaki e Osaka sabem que é verdade: a concorrência não está mais correndo atrás, está disparando à frente."
 JAP_electronics.1.a: "Não cederemos o mercado sem lutar."
 JAP_electronics.2.t: "A China Alcança a Fronteira"
 JAP_electronics.2.d: "A notícia cai como um golpe de martelo. As fábricas chinesas, escoradas pelo Fundo Nacional de Circuitos Integrados e impassíveis diante de anos de sanções ocidentais, chegaram à vanguarda da manufatura de lógica, que apenas um punhado de empresas no mundo consegue tocar. A última suposição confortável da indústria japonesa, a de que o continente continuava uma geração atrás, desapareceu. A fronteira avançou, e o Japão precisa decidir se enfrenta o desafio ou fica para trás."
 JAP_electronics.2.a: "A fronteira avançou. Devemos responder."
 JAP_electronics.3.t: "O Japão Retoma a Coroa do Silício"
 JAP_electronics.3.d: "Contra todas as probabilidades, a maré virou. As fábricas japonesas despacham em volume, os materiais japoneses continuam indispensáveis, e o design e o conteúdo japoneses ganham respeito no mundo todo. Os rivais em Seul, Taipé e Xangai não foram embora, mas, pela primeira vez em uma geração, são eles que olham por cima do ombro. A longa retirada acabou; o Japão volta a competir de uma posição de força."
 JAP_electronics.3.a: "O Japão está novamente no topo da indústria."
 JAP_electronics.4.t: "O Japão Volta à Fronteira dos Semicondutores"
 JAP_electronics.4.d: "Em fábricas de Hokkaido a Kyushu, nos laboratórios de pesquisa, nos estúdios de jogos e nas valas de fibra óptica, o Japão completou um ressurgimento que poucos julgavam possível. Um país descartado há uma década como o titular decadente da era eletrônica reconquistou a vanguarda e avisou que pretende permanecer ali. O equilíbrio da corrida tecnológica do Leste Asiático mudou, e todas as capitais, de Seul a Washington, estão refazendo as contas."
 JAP_electronics.4.a: "Um ressurgimento notável."
 JAP_demographic_pressure_modifier: "Pressão Demográfica"
 JAP_demographic_pressure_modifier_desc: "O Japão é uma das sociedades mais velhas e que mais rapidamente encolhem no mundo, com mortes superando nascimentos e a população em idade ativa em forte contração. Essa crise pressiona a força de trabalho que sustenta a produção, leva os orçamentos de assistência social e saúde ao limite, corrói a estabilidade fiscal e testa o tecido social. Em seis eixos (população, força de trabalho, estabilidade, desemprego, custos de saúde e custos sociais), o Japão enfrenta pressões inter-relacionadas. Reformas contínuas e multifacetadas em políticas pró-família, de emprego e de imigração podem aliviar esses fardos e colocar a nação no caminho de uma população estável ou em crescimento."
 JAP_economy_modifier: "Economia Japonesa"
 JAP_economy_modifier_desc: "O motor compartilhado da renovação econômica do Japão. À medida que sucessivos governos enfrentam o declínio demográfico e a crescente concorrência da Coreia, da China e de Taiwan, a reforma alcança todos os pilares da economia: os campos e a pesca que alimentam a nação, as montadoras e fabricantes de máquinas-ferramenta que ancoram suas exportações, os campeões de semicondutores e eletrônicos que correm para romper a estagnação, o esforço para garantir energia e recursos críticos a um arquipélago quase sem os seus, e as artérias ferroviárias que unem as ilhas. Cada avanço se acumula aqui, elevando a produtividade, a eficiência das fábricas e a pesquisa, ao mesmo tempo em que remodela as demandas que o Japão faz à sua indústria, a seus recursos e à sua rede elétrica."
 JAP_political_modifier: "Kokkai"
 JAP_political_modifier_desc: "As reformas realizadas em resposta à crise demográfica estão remodelando a política nacional, abrindo o país à migração ao mesmo tempo em que testam a coesão social e a estabilidade de uma nação pouco acostumada a mudanças."
 JAP_f15_programe_desc: "A frota de F-15J fabricada sob licença pela Mitsubishi passa por uma modernização em etapas: novo radar, computadores de missão e telas de cabine nas fuselagens que valem a pena manter, e uma cadeia de suprimentos racionalizada para o restante. A pesquisa de caças e aeroespacial anda mais rápido, e as fuselagens leves e médias saem da linha mais baratas."
 JAP_submarine_modernization_idea_desc: "A frota diesel-elétrica passa para a propulsão independente do ar e, mais tarde, para células de íon-lítio, estendendo a autonomia submersa sem um reator. A Kawasaki e a Mitsubishi se alternam na construção dos cascos em Kobe, o que mantém dois estaleiros competentes e reduz o custo unitário."
 JAP_carrier_aviation_desc: "A aviação naval de asa fixa volta à frota japonesa pela primeira vez desde 1945. Os contratorpedeiros-helicópteros são reavaliados como navios de aviação, revestimentos de convés e elevadores são estudados para aeronaves de decolagem curta, e o trabalho doutrinário de operar um grupo aéreo embarcado começa para valer."
 JAP_keen_sword_operation_idea_desc: "O exercício conjunto bienal com os Estados Unidos submete a Força Marítima de Autodefesa a manobras de frota combinadas, desembarques anfíbios e treinos de defesa aérea em uma escala que ela não alcança sozinha. As tripulações voltam mais afiadas, e as lições duram mais que o exercício."
 JAP_nuclear_power_program: "Programa Nuclear de Longo Prazo"
 JAP_nuclear_power_program_desc: "Cinquenta e dois reatores fornecem cerca de um terço da eletricidade da nação, e o Programa de Longo Prazo da Comissão de Energia Atômica compromete o Japão com um ciclo de combustível fechado baseado no reprocessamento em Rokkasho. O desempenho operacional é excelente, mas o consentimento desmoronou. O acidente de criticalidade na usina da JCO, em Tokaimura, matou dois trabalhadores e destruiu a confiança do público na indústria e em seus reguladores, e em março de 2000 o governo colocou em revisão os planos de construção das vinte usinas propostas. Desde que a cidade de Maki derrubou seu reator por referendo, nenhuma província pode ser considerada garantida para aceitar um novo local."
 JAP_nuclear_local_consent: "Acordos de Consentimento Local"
 JAP_nuclear_local_consent_desc: "Governadores de província e municípios anfitriões foram trazidos de volta ao processo por meio de acordos de segurança vinculantes, divisão de receitas e um direito de consulta prévia sobre reinícios. O veto que paralisou a construção nuclear japonesa por uma geração foi negociado, e não atropelado, e as concessionárias podem voltar a planejar nova capacidade."
 JAP_consolidate_national_defense_framework_cancel_tt: "Termina quando o bônus do §YArtigo 9§! à §Yestabilidade§! tiver se esgotado e as penalidades ao §Yapoio à guerra§! e à §Ypopulação recrutável§! tiverem sido totalmente eliminadas"
 JAP_modernize_joint_command_cancel_tt: "Termina quando as penalidades do §YArtigo 9§! ao §Yganho de experiência do exército, aérea e naval§!, ao §Ypoder de comando§! e aos §Ycustos de oficiais§! tiverem sido totalmente eliminadas"
 JAP_normalize_defense_procurement_mission: "Normalizar os Sistemas de Aquisição de Defesa"
 JAP_normalize_defense_procurement_mission_desc: "A expansão das responsabilidades de defesa sobrecarregou muito os arranjos existentes de aquisição e de indústria. Por meio de reformas cuidadosas, planejamento de longo prazo e maior coordenação com a indústria, o Japão trabalha para normalizar as aquisições de defesa e reduzir as ineficiências do período de transição.\n\n$JAP_article9_mission_explainer_tt$"
 JAP_normalize_defense_procurement_cancel_tt: "Termina quando as penalidades do §YArtigo 9§! ao §Yataque do exército§! e à §Ydefesa do exército§! tiverem sido totalmente eliminadas e os bônus ao §Yataque em território central§! e à §Ydefesa em território central§! tiverem se esgotado"
 JAP_establish_asteroid_mining_network_mission: "Estabelecendo a Rede de Mineração de Asteroides"
 JAP_establish_asteroid_mining_network_mission_desc: "O Japão está montando sua primeira rede de mineração de asteroides, posicionando plataformas orbitais e implantando equipamentos de prospecção à medida que as operações de recursos fora do planeta começam a tomar forma."
 JAP_reactor_restart_category: "O Programa de Reinício de Reatores"
 JAP_reactor_restart_category_desc: "Cinquenta e quatro reatores já forneceram um terço da eletricidade do Japão. Depois de 2011, todos eles se apagaram, e trazê-los de volta não é uma decisão única, mas uma campanha travada usina por usina, província por província. Cada reinício exige uma revisão regulatória medida em anos, o consentimento de um governador que responde a eleitores assustados e uma conta de adaptações sísmicas que chega a centenas de bilhões de ienes. O que ele devolve é a energia de base mais barata que o país jamais terá.\n\nCada reinício concluído §Gmelhora permanentemente§! a geração nuclear do Japão e reduz o custo de manter a frota."
 JAP_restart_sendai: "Reiniciar Sendai"
 JAP_restart_sendai_desc: "As duas unidades de água pressurizada da Kyushu Electric em Satsumasendai, em Kagoshima, foram as primeiras do país a cumprir os novos padrões de segurança, e em agosto de 2015 a Unidade 1 de Sendai se tornou o primeiro reator japonês a gerar energia em quase dois anos. O consentimento do governador Ito o tornou possível; o quebra-mar, a ventilação filtrada e o centro de controle de emergência o tornaram defensável."
 JAP_restart_ikata: "Reiniciar Ikata"
 JAP_restart_ikata_desc: "A usina da Shikoku Electric fica na estreita península de Sadamisaki, em Ehime, com a Linha Tectônica Mediana correndo a poucos quilômetros da costa. A Unidade 3 voltou ao serviço em 2016 e desde então foi paralisada e restaurada mais de uma vez pelos tribunais de províncias vizinhas. Nenhuma usina no Japão ilustra melhor que a licença do regulador é só metade da batalha."
 JAP_restart_takahama_ohi: "Reiniciar o Grupo de Fukui"
 JAP_restart_takahama_ohi_desc: "A província de Fukui abriga a mais densa concentração de reatores do país. As unidades da Kansai Electric em Takahama, Ohi e Mihama abasteceram a indústria de Osaka e Kobe por décadas, e várias delas agora são tão antigas que operá-las além de quarenta anos exigiu uma extensão separada e contestada. Reiniciar o grupo restaura o fornecimento de energia do coração industrial de uma só vez."
 JAP_restart_genkai: "Reiniciar Genkai"
 JAP_restart_genkai_desc: "A usina da Kyushu Electric na província de Saga voltou em 2018 após adaptações que incluíram uma das primeiras instalações de segurança especializadas construídas segundo as novas regras. Genkai também abriga o programa pluthermal do Japão, queimando combustível de óxido misto que fecha parte do ciclo entre os reatores e a usina de reprocessamento de Rokkasho."
 JAP_restart_onagawa: "Reiniciar Onagawa"
 JAP_restart_onagawa_desc: "Onagawa, em Miyagi, ficava mais perto do epicentro do terremoto de 2011 do que Fukushima Daiichi, e seu quebra-mar de catorze metros resistiu. A cidade abrigou evacuados dentro do próprio ginásio da usina. Trazer a Unidade 2 de volta em 2024 foi o primeiro reinício de um reator de água fervente do mesmo tipo que falhou em Daiichi, e foi o argumento mais forte que a indústria já teve."
 JAP_restart_shimane: "Concluir a Unidade 3 de Shimane"
 JAP_restart_shimane_desc: "A usina da Chugoku Electric é a única usina nuclear do Japão situada dentro de uma capital provincial, na beira da própria Matsue. A Unidade 3 foi construída, mas nunca comissionada, e ficou pronta e ociosa durante o longo desligamento. Colocá-la em serviço não é um reinício, mas uma primeira partida, e a experiência de construção recuperada nesse processo não será perdida de novo."
 JAP_restart_tomari: "Reiniciar Tomari"
 JAP_restart_tomari_desc: "As três unidades da Hokkaido Electric em Tomari são a única usina nuclear da ilha do norte, e sua perda deixou Hokkaido dependente de uma interconexão frágil e de capacidade térmica envelhecida, como o apagão em toda a ilha de 2018 deixou dolorosamente claro. A reavaliação sísmica do local se arrastou por mais de uma década. Restaurar Tomari é o que torna a rede de Hokkaido inteira."
 JAP_restart_kashiwazaki_kariwa: "Reiniciar Kashiwazaki-Kariwa"
 JAP_restart_kashiwazaki_kariwa_desc: "Sete unidades na costa de Niigata fazem dela a maior usina nuclear já construída em qualquer lugar. É também da TEPCO, a empresa que perdeu Fukushima, e os governadores de Niigata passaram anos se recusando a esquecê-lo. Falhas de segurança no local custaram à empresa a própria permissão de operação por um tempo. Se Kashiwazaki-Kariwa puder ser trazida de volta, nada na frota estará fora de alcance."
 JAP_gx_transition_category: "A Transformação Verde"
 JAP_gx_transition_category_desc: "Um Japão sem reatores precisa encontrar sua energia em outro lugar, e o arquipélago é carente de tudo, exceto vento, calor e engenheiros. A Transformação Verde é a resposta: turbinas flutuantes em águas fundas demais para ancoragem, o calor vulcânico sob as montanhas do norte, uma rede finalmente costurada através da divisão de cinquenta e sessenta hertz e, acima de tudo, um talento nacional para usar menos do que qualquer um julgava possível.\n\nCada projeto concluído §Gmelhora permanentemente§! a produção renovável do Japão ou reduz a demanda nacional, e fecha de vez os reatores de sua região."
 JAP_gx_goto_floating_wind: "Eólica Offshore Flutuante de Goto"
 JAP_gx_goto_floating_wind_desc: "O leito marinho ao largo do Japão desce íngreme demais para as fundações fixas usadas no Mar do Norte, e por isso as ambições eólicas offshore do país se apoiam em plataformas flutuantes ancoradas em águas profundas. O parque ao largo das ilhas Goto, em Nagasaki, é o campo de provas da tecnologia, e os estaleiros que antes construíam petroleiros são o lugar natural para fabricar os cascos."
 JAP_gx_tohoku_geothermal: "O Polo Geotérmico de Tohoku"
 JAP_gx_tohoku_geothermal_desc: "O Japão detém a terceira maior reserva geotérmica da Terra e usa quase nada dela, bloqueado pelos limites dos parques nacionais e pelos donos de fontes termais que temem que a perfuração leve sua água. Appi, em Iwate, quebrou o impasse em 2024, com a primeira grande usina geotérmica em décadas. Onde há vulcões, há energia, e ela flui no escuro e na calmaria igualmente."
 JAP_gx_kanto_setsuden: "A Campanha Setsuden"
 JAP_gx_kanto_setsuden_desc: "No verão após o desastre, Tóquio simplesmente consumiu menos. Os escritórios reduziram as luzes e abandonaram as gravatas, as fábricas passaram os turnos para o fim de semana, e a capital passou pelo pico sem os apagões que todos haviam previsto. O setsuden devia ser uma medida de emergência. Tornado permanente por meio de códigos de edificação, padrões industriais e do programa Top Runner, vale mais que uma usina e custa uma fração dela."
 JAP_gx_frequency_converter: "A Expansão dos Conversores de Frequência"
 JAP_gx_frequency_converter_desc: "Tóquio opera a cinquenta hertz porque comprou geradores alemães na década de 1890, e Osaka opera a sessenta porque comprou americanos. Um século depois, as duas metades do país ainda não conseguem compartilhar energia livremente, e em 2011 o oeste só pôde enviar um fio de um único gigawatt para o leste enquanto Tóquio apagava. Expandir as estações conversoras de Sakuma, Shin-Shinano e Higashi-Shimizu finalmente faz de duas redes uma só rede nacional."
 JAP_gx_hokkaido_hvdc: "A Interconexão de Hokkaido"
 JAP_gx_hokkaido_hvdc_desc: "Hokkaido tem o melhor recurso eólico do Japão e o menor número de pessoas para usá-lo, uma combinação que deixa turbinas limitadas enquanto Honshu queima gás importado. Uma ligação de corrente contínua de alta tensão ao longo da costa do Mar do Japão leva o vento do norte aonde está a demanda e, de quebra, teria mantido as luzes acesas durante o apagão em toda a ilha de 2018."
 JAP_gx_kobe_hydrogen: "A Cadeia de Suprimento de Hidrogênio de Kobe"
 JAP_gx_kobe_hydrogen_desc: "O primeiro navio transportador de hidrogênio liquefeito do mundo atracou em Kobe em 2022, completando uma cadeia de suprimento que vai das minas de linhito australianas a um terminal na Ilha do Porto. O hidrogênio queima sem carbono e armazena o que as turbinas produzem e a rede ainda não consegue usar, e a Kawasaki Heavy passou uma década construindo os petroleiros, tanques e turbinas para manuseá-lo."
 JAP_gx_hekinan_ammonia: "Coqueima com Amônia"
 JAP_gx_hekinan_ammonia_desc: "A usina a carvão de Hekinan, em Aichi, é a maior do país, e a JERA vem alimentando suas caldeiras com amônia junto com o carvão, primeiro na proporção de uma parte em cinco e visando constantemente proporções maiores. A amônia carrega hidrogênio em uma forma que navios e dutos já sabem manusear, e permite que uma frota existente de usinas térmicas queime menos combustível sem ser demolida e reconstruída."
 JAP_gx_shikoku_solar_storage: "Energia Solar e Armazenamento de Shikoku"
 JAP_gx_shikoku_solar_storage_desc: "Shikoku tem a luz solar mais forte do Japão e uma rede pequena o bastante para que a produção solar do meio-dia precise ser limitada por falta de lugar onde colocá-la. Combinar usinas em escala industrial com baterias de rede move o excedente do meio-dia para o pico da noite, que é a diferença entre uma capacidade renovável que existe no papel e uma energia renovável que é realmente usada."
 JAP_rubber_butadiene_branch_decision: "Ramo da Borracha de Butadieno"
 JAP_rubber_butadiene_branch_decision_desc: "A borracha natural pode ser cortada, racionada ou ter o preço elevado até nos enfraquecer, e o Japão não pode permitir que essa alavanca exista. Ampliaremos um ramo de borracha sintética à base de butadieno para garantir pneus, vedações e componentes críticos para a indústria e as forças armadas."
 JAP_demand_south_kuril_reject_tt: "Podemos abrir uma §Yguerra de fronteira§! por §Y$STATE_1168$§!, ou §Rdeclarar guerra a [SOV.GetName]§! para tomar os Territórios do Norte pela força"
 JAP_demand_north_kuril_reject_tt: "Podemos abrir uma §Yguerra de fronteira§! por §Y$STATE_1168$§!, ou §Rdeclarar guerra a [SOV.GetName]§! para tomar os Territórios do Norte pela força"
 JAP_demand_sakhalin_reject_tt: "Podemos desbloquear um §YRaide de Forças Especiais§! em §Y$STATE_691$§!, ou §Rdeclarar guerra a [SOV.GetName]§! para tomar os Territórios do Norte pela força"
 JAP_claiming_philippines: "Reivindicar o Arquipélago das Filipinas"
 JAP_claiming_philippines_desc: "O arquipélago das Filipinas comanda os acessos ao Pacífico Ocidental e as rotas marítimas que alimentam a nossa indústria. Faremos uma reivindicação formal e deixaremos claro que essas ilhas pertencem à esfera estratégica do Japão, com a aprovação de outros ou não. Uma vez declarado, a região entenderá que nossa marinha pretende decidir quem passa por essas águas."
 JAP_demographic_emergency_taskforce: "Resposta de Emergência à Queda da Natalidade"
 JAP_demographic_emergency_taskforce_desc: "Em resposta ao colapso demográfico, o governo criou uma força-tarefa de emergência com toda a administração, espelhando a estrutura da Agência de Crianças e Famílias e coordenando a mobilização rápida de recursos em todos os ministérios relevantes. A atenção política é intensa, os silos burocráticos são derrubados e surge a possibilidade de uma onda de experimentação de políticas. Esta janela de foco e mobilização intensos é temporária; após 730 dias de esforço contínuo, o clima de emergência se dissipa e a formulação de políticas volta aos padrões institucionais normais, embora as reformas em si permaneçam."
 JAP_increase_birth_budget: "Duplicação Emergencial do Auxílio-Criança"
 JAP_increase_birth_budget_desc: "O Japão injetará fundos emergenciais do tesouro no sistema de auxílio-criança, duplicando as transferências diretas de dinheiro às famílias com filhos. Esse gasto imediato e de alta visibilidade alivia as famílias jovens e sinaliza o compromisso do Estado com a paternidade e a maternidade, elevando as taxas de natalidade no curto prazo. O custo de longo prazo é substancial, inflando o orçamento permanente de direitos, mas os dividendos demográficos justificam a despesa enquanto os nascimentos permanecerem baixos."
 JAP_child_care_subsidies: "Educação e Cuidados na Primeira Infância Gratuitos e Universais"
 JAP_child_care_subsidies_desc: "Seguindo a política de outubro de 2019, o Japão tornará a educação e os cuidados na primeira infância gratuitos para todas as famílias, eliminando as mensalidades de creches e pré-escolas. O subsídio remove uma grande barreira ao emprego dos pais, devolvendo cuidadores, principalmente mães, à força de trabalho e permitindo que famílias de renda limitada tenham mais filhos. O programa é caro, mas traz ganhos de emprego e uma modesta melhora na fertilidade."
 JAP_invest_in_robotics: "Programa de Automação Sociedade 5.0"
 JAP_invest_in_robotics_desc: "O Japão acelerará a Nova Estratégia de Robôs de 2015, subsidiando automação industrial, IA e robótica para compensar a falta de trabalhadores. Ao substituir o trabalho humano na construção, na manufatura e na logística por máquinas, o Japão pode manter a produção com uma força de trabalho menor. A estratégia exige muito capital, mas é poderosa; contudo, a substituição de trabalhadores de baixa qualificação pode inicialmente elevar o desemprego até que surjam novas funções em operação e manutenção."
 JAP_fertility_ivf_program: "Cobertura de Seguro para Fertilização In Vitro"
 JAP_fertility_ivf_program_desc: "O Japão ampliará a cobertura de seguro para fertilização in vitro (FIV) e tecnologia de reprodução assistida, tornando o tratamento acessível a todos os casais elegíveis, independentemente da renda. A partir de 2022, os subsídios do seguro removem a barreira econômica ao tratamento de infertilidade, permitindo que casais que de outra forma continuariam sem filhos os tenham. O impacto nas taxas de natalidade é forte, mas o custo para o sistema de saúde sobe bruscamente, pressionando as finanças públicas."
 JAP_family_housing_construction: "Programa de Moradia Familiar Acessível"
 JAP_family_housing_construction_desc: "O Japão financiará a construção em larga escala de moradias acessíveis, de tamanho familiar, voltadas a domicílios que criam filhos. Os altos custos de terra e moradia são uma grande barreira à formação de famílias; a construção subsidiada reduz o patamar financeiro para jovens casais se casarem e terem filhos. O programa exige muito capital, mas estabiliza a sociedade ao oferecer às famílias jovens um caminho crível para a casa própria e sinaliza o compromisso do Estado com o futuro delas."
 JAP_marriage_support_program: "Iniciativa de Apoio aos Recém-Casados"
 JAP_marriage_support_program_desc: "O Japão subsidiará casais recém-casados com auxílios-moradia e serviços de casamenteiro, incluindo financiamento para programas de konkatsu (caça ao casamento) e plataformas de casamenteiro com IA. O Estado também fará parcerias com governos locais para organizar eventos de casamento em nível comunitário. Ao reduzir o atrito financeiro e social em torno da formação de casamentos, o programa empurra as taxas de natalidade para cima a um custo fiscal menor do que os incentivos à gestação isolados, embora o efeito seja modesto."
 JAP_raise_retirement_age: "Lei de Estabilização do Emprego de Idosos"
 JAP_raise_retirement_age_desc: "O Japão elevará gradualmente a idade oficial de aposentadoria rumo aos 70 anos, estendendo as contribuições obrigatórias e adiando a elegibilidade à pensão. Seguindo a legislação de 2021, o Estado incentivará os empregadores a manter trabalhadores mais velhos e os pressionará a oferecer emprego continuado além da tradicional marca dos 65 anos. É politicamente doloroso, os trabalhadores se irritam com os anos extras de trabalho e o governo precisa gastar capital político para aprová-la, mas a força de trabalho aumenta diretamente e o fardo das pensões diminui."
 JAP_silver_employment_initiative: "Centros de Recursos Humanos Prateados"
 JAP_silver_employment_initiative_desc: "O Japão criará e financiará Centros de Recursos Humanos Prateados em todas as grandes cidades, oferecendo colocação em empregos de meio período, requalificação e mentoria para idosos saudáveis com mais de 65 anos. Esses centros conectarão aposentados experientes a empregadores que precisam de mão de obra flexível em limpeza, segurança, apoio a cuidados infantis e administração. O programa é barato, preserva a dignidade e adiciona trabalhadores produtivos sem elevar a idade compulsória de aposentadoria, aliviando a pressão do desemprego a um custo modesto."
 JAP_preventive_health_program: "Iniciativa de Expectativa de Vida Saudável"
 JAP_preventive_health_program_desc: "O Japão investirá em saúde preventiva para toda a população: exames subsidiados, vacinações, aconselhamento sobre estilo de vida e intervenção precoce em doenças crônicas. Ao manter a população idosa mais saudável e funcionalmente independente por mais tempo, o Estado reduz os anos gastos em terapia intensiva cara e em residência em asilos. O programa é pura prevenção (não trata a doença, mas a previne) e rende altos retornos em custos de saúde menores, já que os idosos permanecem ativos e autossuficientes até os 80 anos."
 JAP_elderly_care_reform: "Modernização do Sistema de Cuidados de Longo Prazo"
 JAP_elderly_care_reform_desc: "O Japão reestruturará o sistema de Seguro de Cuidados de Longo Prazo para passar do cuidado institucional (asilos) para o cuidado comunitário e integrado: auxiliares domiciliares, centros-dia, clínicas locais e apoio familiar em vez de caras instalações residenciais. Ao reduzir a dependência de instituições custosas e mobilizar as comunidades, o Estado corta tanto o orçamento de saúde quanto o de assistência social. A transição é traumática, alguns perdem o cuidado institucional preferido e a administração sofre durante a mudança, mas as economias de longo prazo são substanciais."
 Japan.105.t: "Proclamação do Império"
 Japan.105.d: "A proclamação jaz redigida sobre a mesa do gabinete, com o selo ao lado e a data deixada em aberto. Nada mais resta a ser restaurado: a casa imperial se mantém, os ritos são cumpridos, o Conselho Privado se reúne. Apenas a redação está indefinida.\n\nO Ministro do Exército fala primeiro. Um império se mede no continente, em divisões erguidas e terreno mantido, e a proclamação deveria dizer isso. O Ministro da Marinha responde sem erguer a voz. O Japão é um país insular que vive de suas rotas marítimas, e um estandarte erguido sobre a frota será lido corretamente em todos os portos, de Vladivostok a Singapura. Ambos se calam e olham para o trono."
 Japan.105.a: "£JAP_EMPIRE_flag     A força do Império está em seus exércitos."
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag     A força do Império está sobre as águas."
 JAP_american_pressure_article_nine_desc: "Washington vinculou a pauta comercial à pauta de defesa. Ameaças tarifárias e alavancagem sobre recursos são usadas para empurrar Tóquio rumo a um papel militar mais amplo e, até que o debate seja resolvido, o Japão negocia do lado mais fraco da mesa."
 JAP_jsw_tank_mio_trait_ladle_refining: "Refino em Panela de Aço Limpo"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "Fornos Elétricos a Arco de Muroran"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "Laminação de Placas de Alta Resistência"
 JAP_jsw_tank_mio_trait_scrap_recycling: "Linha de Recuperação de Sucata"
 JAP_jsw_steel_modifier: "Japan Steel Works"
 JAP_jsw_steel_modifier_desc: "Cada encomenda feita à Japan Steel Works é uma encomenda feita a Muroran. Os fornos que vazam os canos e as placas de blindagem são os mesmos que alimentam os estaleiros, a construção civil e as montadoras, e cada contrato que os mantém em plena capacidade deixa o país menos dependente de tarugos importados. O que o orçamento de defesa compra em aço para canhões, a economia em geral colhe em tonelagem."
 JAP_zombie_companies: "Empresas Zumbis"
 JAP_zombie_companies_desc: "Anos de tolerância mantiveram empresas deficitárias e superendividadas vivas com crédito barato, prendendo capital, mão de obra e gestão de que indústrias mais saudáveis precisam. Até que essas empresas sejam reestruturadas ou encerradas, a construção, a produtividade e a arrecadação do imposto corporativo sofrem.\n-------------\nElevar o §YProgresso da Reestruturação Corporativa§! libera a decisão §Y$JAP_restructure_next_tranche$§!, que atenua este espírito nacional um passo de cada vez. Veja §Y$JAP_corporate_reform_category$§! para os números atuais."
 JAP_ykk_group: "O Grupo YKK"
 JAP_ykk_group_desc: "A Yoshida Kogyo fabrica cerca de metade dos zíperes produzidos no mundo, algo como sete bilhões por ano em fábricas de mais de setenta países. A empresa lamina o próprio latão, fia o próprio poliéster, mistura as próprias tintas e constrói as máquinas que montam o cursor acabado, uma integração vertical que não deixa nada do produto fora de seu controle. As compras militares são uma pequena parcela desse negócio, e exigente, porque o fecho de um colete porta-placas, de um colete de carga ou de um uniforme de camuflagem é o primeiro componente a falhar em campo. Os programas japoneses de uniformes e equipamentos de proteção recorrem a um fornecedor capaz de revisar internamente uma fita, um revestimento ou uma liga resistente à corrosão, em vez de esperar por um subcontratado."
 JAP_karoshi_crisis: "A Crise do Karoshi"
 JAP_karoshi_crisis_desc: "O excesso crônico de trabalho está desgastando a força de trabalho do Japão. As horas extras não remuneradas em excesso, a cultura do 'service zangyo', provocam derrames, insuficiência cardíaca e suicídio entre os assalariados, enquanto famílias exaustas adiam ter filhos. Estabilidade, produtividade e pesquisa sofrem, os gastos com saúde e previdência sobem e a população recua ano após ano.\n-------------\nFocos de reforma e campanhas no local de trabalho elevam o $JAP_worker_wellbeing$. Em §G30§! e §G60§!, a decisão §Y$JAP_enforce_next_reforms$§! é liberada e atenua este espírito nacional em um passo; o foco ao fim do caminho escolhido o elimina de vez. Enquanto as §Yempresas zumbis§! do Japão não forem resolvidas, cada campanha rende metade. Veja §Y$JAP_corporate_reform_category$§! para os números atuais."
 JAP_karoshi: "Karoshi"
 JAP_karoshi_desc: "O governo declara o karoshi uma crise nacional: trabalhadores mortos pelo excesso de trabalho, por derrame e insuficiência cardíaca na mesa de trabalho e por suicídio após meses de cem horas. A morte da funcionária da Dentsu, Matsuri Takahashi, recolocou o tema na pauta nacional e custou o cargo ao presidente da empresa. O Estado agora precisa decidir até onde irá no local de trabalho para tornar o trabalho sobrevivível."
 JAP_corporate_laws: "Reformar a Lei de Normas Trabalhistas"
 JAP_corporate_laws_desc: "O governo toma o caminho legislativo, fechando a brecha do Artigo 36 por meio da Lei de Reforma do Estilo de Trabalho e substituindo os acordos saburoku por tetos rígidos aplicados por uma Inspetoria de Normas Trabalhistas fortalecida. Vencer significa enfrentar os empregadores e o lobby da jornada flexível em cada etapa de comissão na Dieta. É a mais abrangente das três respostas e a mais lenta a chegar."
 JAP_cultural_change: "Enfrentar a Cultura do Excesso de Trabalho"
 JAP_cultural_change_desc: "O governo faz campanha pela cultura em vez da lei: a Sexta-Feira Premium manda os trabalhadores para casa mais cedo uma vez por mês, a triagem de saúde mental chega ao local de trabalho e o Livro Branco anual do Karoshi mantém os mortos visíveis para empregadores e recrutadores. Nada disso toca a regra tácita de que o diligente só sai depois do chefe de seção. Este caminho aposta que a relação do Japão com o trabalho muda de baixo para cima, um local de trabalho e um lar por vez."
 JAP_keiretsu_pact: "Negociar com os Keiretsu"
 JAP_keiretsu_pact_desc: "O Estado negocia diretamente com os grupos empresariais e com a federação patronal Keidanren: reforma administrada em troca de estabilidade, emprego vitalício preservado e as empresas endividadas protegidas de rupturas. Nenhuma lei é aprovada e nenhuma empresa é exposta, porque a concessão é trocada por previsibilidade. É o caminho mais lento para a reforma e o que menos muda o Japão corporativo."
 JAP_overtime_cap: "O Teto do Artigo 36"
 JAP_overtime_cap_desc: "Um acordo saburoku arquivado no escritório do trabalho transforma a semana legal de quarenta horas em uma sugestão, e a Lei de Reforma do Estilo de Trabalho fecha o buraco. Quarenta e cinco horas extras por mês e trezentas e sessenta por ano passam a ser um teto legal, nunca além de cem em um único mês, com penalidades criminais por trás dos números em vez de orientação administrativa. Os números acompanham a linha de karoshi que o Ministério da Saúde, Trabalho e Bem-Estar usa para decidir se um derrame ou um suicídio foi causado pelo emprego."
 JAP_mandatory_paid_leave: "Cinco Dias que o Trabalhador Deve Tirar"
 JAP_mandatory_paid_leave_desc: "A obrigação é invertida: um empregador que concede dez ou mais dias de licença agora deve garantir que pelo menos cinco sejam de fato usados, designando ele próprio as datas se o trabalhador não o fizer. Os trabalhadores japoneses não carecem de feriados, mas de permissão para usá-los, e pouco mais da metade da licença concedida chega a ser tirada. A mesma emenda toma emprestado o intervalo de trabalho europeu, onze horas de descanso entre turnos, ainda que apenas como dever de empenho."
 JAP_labour_inspection_offices: "A Inspetoria de Normas Trabalhistas"
 JAP_labour_inspection_offices_desc: "O governo financia a Inspetoria de Normas Trabalhistas para fiscalizar em vez de aconselhar: mais inspetores, contabilidade forense para flagrar os cartões de ponto falsificados que transformam cem horas extras em vinte no papel e disposição para processar. Alguns milhares de inspetores não conseguem policiar sessenta milhões de trabalhadores, então a maioria das violações só vem à tona depois que alguém morreu e a família contratou um advogado. O ministério já publica os nomes das empresas que infringem a lei, e a própria Dentsu foi condenada após a morte de Matsuri Takahashi."
 JAP_karoshi_prevention_act: "A Lei de Prevenção do Karoshi"
 JAP_karoshi_prevention_act_desc: "A Dieta aprova a Lei de Promoção de Medidas Preventivas contra o Karoshi, obrigando o Estado a pesquisar as mortes por excesso de trabalho, publicar um Livro Branco anual e se submeter a metas mensuráveis: menos de cinco por cento dos trabalhadores em semanas de sessenta horas, setenta por cento da licença remunerada efetivamente tirada, serviços de saúde mental em todas as empresas. Tornar os números públicos é o ponto, porque assim podem ser descumpridos em público. O mesmo pacote traz uma isenção profissional de alto nível que retira as regras de jornada dos especialistas mais bem pagos, uma exceção que os sindicatos esperam ver ampliada."
 JAP_end_of_karoshi: "Um País Onde o Trabalho Não Mata"
 JAP_end_of_karoshi_desc: "O teto das horas extras se mantém porque os inspetores aparecem sem aviso e os promotores vão atrás deles, a licença é tirada porque a lei exige, e o trabalhador contratado ao seu lado recebe o mesmo que você. As empresas que só sobreviviam com horas não pagas foram encerradas em vez de escoradas por crédito renovado, de modo que ninguém mais alega que a sobrevivência não lhe deixa escolha. O Japão continuará a trabalhar duro, mas deixou de tratar a exaustão como prova de lealdade.\n-------------\nRequer que as §Yempresas zumbis do Japão§! estejam totalmente resolvidas, que a §Y$JAP_karoshi_crisis$§! já tenha sido atenuada até sua fase final e que o $JAP_worker_wellbeing$ seja de pelo menos §G85§!. Concluir este foco elimina a crise do Karoshi de vez."
 JAP_premium_friday: "Sexta-Feira Premium"
 JAP_premium_friday_desc: "O Ministério da Economia, Comércio e Indústria lança a Sexta-Feira Premium com a Keidanren: na última sexta-feira de cada mês, os funcionários saem às três e passam a noite nas lojas em vez de em suas mesas. O momento é infeliz, já que o fim do mês é quando se fecham as contas e as metas, e poucas empresas aderem com entusiasmo. O que sobrevive é o precedente de o Estado fixar uma hora e mandar o país parar de trabalhar."
 JAP_ikumen_project: "O Projeto Ikumen"
 JAP_ikumen_project_desc: "O Ministério da Saúde, Trabalho e Bem-Estar conduz a campanha ikumen para fazer do pai que cria os filhos algo a se admirar em vez de se explicar. A licença-paternidade japonesa está entre as mais generosas do mundo no papel, um ano parcialmente remunerado, e quase ninguém a pede, porque o homem que pede é um homem cujos colegas carregam seu trabalho e cujo chefe de seção se lembra. A lei revisada oferece quatro semanas nas oito seguintes ao nascimento, divisíveis e apenas notificadas, um limiar baixo o bastante para que um pai hesitante possa de fato aproveitá-lo."
 JAP_stress_check_programme: "O Teste de Estresse"
 JAP_stress_check_programme_desc: "A Lei de Segurança e Saúde Industrial emendada exige que todo local de trabalho com cinquenta ou mais funcionários ofereça uma autoavaliação psicológica anual, a primeira vez que o Estado obriga as empresas japonesas a perguntar aos funcionários como eles estão. O trabalhador com pontuação ruim pode solicitar uma consulta com um médico e um ajuste de suas funções, mas os resultados pertencem ao empregado e o gerente não vê nada sem consentimento. Isso protege o indivíduo e embota o instrumento, e as empresas com menos de cinquenta funcionários só são convidadas a fazer um esforço."
 JAP_telework_normalization: "Trabalhar de Qualquer Lugar"
 JAP_telework_normalization_desc: "O governo nomeia seu primeiro Ministro da Transformação Digital e abre a Agência Digital, retirando a exigência do selo hanko da esmagadora maioria dos procedimentos administrativos. O teletrabalho era um erro de arredondamento não por falta de tecnologia, mas porque os contratos exigiam o selo entalhado e os formulários ainda chegavam por fax, de modo que alguém precisava estar no prédio segurando o carimbo. Se algo disso sobreviverá à emergência é a questão em aberto, porque as empresas chamaram os funcionários de volta a mesas de que haviam provado não precisar."
 JAP_ending_service_zangyo: "O Fim das Horas Extras de Serviço"
 JAP_ending_service_zangyo_desc: "Sabisu zangyo é a hora trabalhada e nunca registrada, dada de graça porque a jornada era medida por autodeclaração e o funcionário sabia o que o chefe de seção esperava que aquele número dissesse. A reforma ataca a aritmética em vez da cultura: os empregadores devem apurar as horas por meios objetivos, leitores de cartão ou horários de login, e a diferença entre os dois registros é prova. O ministério publica o que recupera a cada ano, dezenas de bilhões de ienes em salários não pagos, e cada uma dessas empresas foi flagrada, e não era exceção."
 JAP_ending_compulsory_nomikai: "O Nomikai Opcional"
 JAP_ending_compulsory_nomikai_desc: "O nomikai é voluntário no sentido de que o convite é formulado como uma pergunta, e o subordinado que recusa duas vezes disse algo sobre si mesmo que nenhuma avaliação de desempenho registrará. A Lei de Prevenção do Assédio de Poder o alcança pelo lado, definindo pela primeira vez o assédio de poder no local de trabalho na lei japonesa e obrigando toda empresa a manter um procedimento de reclamações e proteger o reclamante. Uma geração de trabalhadores mais jovens já havia parado de ir, e a lei os alcançou."
 JAP_work_to_live: "Trabalhar para Viver"
 JAP_work_to_live_desc: "As horas são registradas pela máquina e correspondem ao que aconteceu, a licença é tirada porque tirá-la não custa nada, e os pais pedem as semanas após o nascimento e voltam à mesma mesa e às mesmas perspectivas. Nada disso foi conquistado só por lei, porque nunca se tratou realmente de lei: tratou-se do que um local de trabalho espera quando ninguém está fiscalizando nada. O Japão ainda trabalha duro, e deixou de confundir isso com trabalhar até a morte.\n-------------\nRequer que as §Yempresas zumbis do Japão§! estejam totalmente resolvidas, que a §Y$JAP_karoshi_crisis$§! já tenha sido atenuada até sua fase final e que o $JAP_worker_wellbeing$ seja de pelo menos §G85§!. Concluir este foco elimina a crise do Karoshi de vez."
 JAP_corporate_reform_category: "Reforma do Japão Corporativo"
 JAP_corporate_reform_category_desc: "O setor corporativo do Japão carrega duas doenças ligadas. Os bancos mantêm vivas empresas deficitárias e superendividadas com crédito renovado, prendendo o capital e os trabalhadores de que indústrias mais saudáveis precisam. Essas mesmas empresas compram lealdade com horas extras não pagas, e o resultado é o karoshi, a morte por excesso de trabalho. Nenhuma das duas pode ser totalmente curada enquanto a outra persistir.\n\n§YEmpresas Zumbis§!\n§YProgresso da Reestruturação Corporativa§!: [?JAP_corporate_restructuring_progress|0] / 100\nA reestruturação se arrasta a §R+0,25 por mês§! até que a investigação seja encerrada e uma resolução seja escolhida. Então §Y$JAP_controlled_downsize$§! desmonta as empresas rapidamente, §Y$JAP_forced_mergers$§! as absorve à metade desse ritmo, e a qualidade do relatório amplia ambos. Os focos bancários e os programas de recuperação abaixo adicionam valores pontuais.\n§RO progresso estagna em 84§! até que uma resolução seja escolhida.\n§GLimiares§!\n§G30§! e §G60§!: a decisão §Y$JAP_restructure_next_tranche$§! abaixo é liberada, e cada uso atenua as §Y$JAP_zombie_companies$§! em um passo.\n§G85§!: o foco ao fim do caminho escolhido as remove de vez, seja §Y$JAP_the_lost_decade_ends$§! ou §Y$JAP_consolidated_japan_inc$§!, embora este último deixe uma marca permanente.\n§RAviso§!: um §Y$JAP_keiretsu_pact$§! reduz o acúmulo mensal.\n\n§YA Crise do Karoshi§!\n$JAP_worker_wellbeing$: [?JAP_karoshi_wellbeing|0] / 100\nOs focos de reforma do caminho escolhido adicionam Bem-Estar do Trabalhador diretamente, e as campanhas no local de trabalho abaixo o complementam enquanto você continuar pagando por elas.\n§GLimiares§!\n§G30§! e §G60§!: a decisão §Y$JAP_enforce_next_reforms$§! abaixo é liberada, e cada uso atenua a §Y$JAP_karoshi_crisis$§! em um passo.\n§G85§!: o foco ao fim do caminho escolhido a remove de vez, seja §Y$JAP_end_of_karoshi$§!, §Y$JAP_work_to_live$§! ou §Y$JAP_the_bargain_kept$§!. Cada um deles também exige que a crise já tenha sido atenuada até sua fase final.\n§RAviso§!: cada campanha rende §R4§! em vez de §G8§! enquanto as §Y$JAP_zombie_companies$§! ainda existirem, e os próprios focos do caminho não conseguem levá-lo sozinhos a §G85§!.\n\n§GDica§!: §Y$JAP_a_society_where_women_thrive$§! reduz pela metade o que as campanhas de §Y$JAP_cultural_change$§! custam ao tesouro."
 JAP_premium_friday_campaign: "Promover a Sexta-Feira Premium"
 JAP_premium_friday_campaign_desc: "Financie mais uma rodada da ofensiva publicitária do ministério e dos descontos no varejo que a acompanham, e pressione a federação patronal para que seus membros fechem mais cedo. As empresas que apagarem as luzes às três serão fotografadas fazendo isso."
 JAP_ikumen_campaign: "Conduzir a Campanha Ikumen"
 JAP_ikumen_campaign_desc: "Coloque pais em licença de cuidados com os filhos em cartazes, na publicidade ministerial e na televisão, e publique a taxa de adesão empresa por empresa para que um número baixo vire problema de recrutamento. O objetivo é tornar o pedido de licença algo comum, e não corajoso."
 JAP_mental_health_campaign: "Ofensiva de Saúde Mental no Trabalho"
 JAP_mental_health_campaign_desc: "Estenda o teste de estresse anual para abaixo do limiar de cinquenta funcionários, subsidie médicos do trabalho para empresas pequenas demais para ter um e dote adequadamente as linhas de aconselhamento. A triagem só ajuda se houver alguém do outro lado."
 JAP_no_overtime_day_campaign: "Declarar um Dia Sem Horas Extras"
 JAP_no_overtime_day_campaign_desc: "Escolha um dia útil, apague as luzes do escritório na hora marcada e mande os chefes de seção para casa primeiro, porque nenhum subordinado sai antes do superior. Tosco, visível e a única versão da instrução que já funcionou."
 JAP_karoshi_resolved: "A crise do Karoshi no Japão foi totalmente resolvida"
 JAP_keidanren_charter: "A Carta do Equilíbrio entre Trabalho e Vida"
 JAP_keidanren_charter_desc: "O governo, a Keidanren e a Rengo assinam a Carta do Equilíbrio entre Trabalho e Vida e lhe dão números: reduzir à metade os trabalhadores em semanas de sessenta horas, tirar todos os dias de licença remunerada concedidos, tirar a licença de cuidados dos pais da casa dos números de um dígito. O documento não tem força legal nem penalidades, apenas uma revisão pública anual em um conselho em que as empresas sentam como iguais. As horas de trabalho japonesas nunca caíram por meio de processos, mas caem quando as empresas precisam explicar os números umas às outras."
 JAP_shunto_offensive: "A Ofensiva da Primavera"
 JAP_shunto_offensive_desc: "O gabinete se une diretamente à ofensiva salarial de primavera shunto, pressionando a Keidanren a elevar o salário-base em vez dos bônus e respaldando a exigência com créditos fiscais para as empresas que cumprirem. Os críticos a chamam de kanmin shunto, negociação administrada pelo governo, e argumentam que uma rodada salarial conduzida pelo gabinete do Primeiro-Ministro não é negociação coletiva de forma alguma. Até que o salário-base suba, o assalariado continua fazendo as horas extras que pagam sua hipoteca, seja qual for o teto."
 JAP_health_management_stocks: "Gestão de Saúde e Produtividade"
 JAP_health_management_stocks_desc: "O ministério e a Bolsa de Valores de Tóquio começam a nomear as Ações de Gestão de Saúde e Produtividade, dizendo aos investidores que a saúde dos funcionários é despesa de capital, e não assistência social. A certificação por trás disso, a White 500, é o oposto deliberado da lista negra das empresas negras e se baseia na constatação de que trabalhadores exaustos produzem menos e custam mais do que trabalhadores descansados. As empresas apresentam seus próprios números de horas e saúde para obter o selo, e as que não conseguem precisam responder por isso a acionistas e candidatos."
 JAP_morning_shift_system: "O Turno da Manhã"
 JAP_morning_shift_system_desc: "A Itochu, uma sogo shosha no centro do velho keiretsu, proíbe o trabalho após as dez da noite e paga as horas da madrugada com um adicional. O raciocínio é comercial, e não humanitário: um operador em sua mesa desde as nove da manhã anterior precifica errado, e as horas da noite são as menos produtivas do dia. As horas extras noturnas desabaram, o total de horas caiu, o lucro se manteve e a taxa de natalidade da empresa subiu, o que constrangeu todos os rivais que haviam chamado de inviável a jornada mais curta."
 JAP_job_based_employment: "Contratado para um Cargo, Não para uma Empresa"
 JAP_job_based_employment_desc: "O emprego japonês é baseado em filiação: o trabalhador é contratado para a empresa e não para um cargo, sendo rodiziado a critério da firma sem funções definidas, e é aí que começa a jornada ilimitada. Hitachi, Fujitsu, KDDI e Shiseido agora publicam descrições reais de cargos com salário graduado pela função, e a Keidanren admitiu que o emprego vitalício não pode ser sustentado. O Estado financia um trilhão de ienes em requalificação para que a mudança seja vista como oportunidade, e não como traição."
 JAP_the_bargain_kept: "O Pacto Cumprido"
 JAP_the_bargain_kept_desc: "As horas caem porque os grupos empresariais percebem que custam mais do que rendem, e, tendo percebido, agem mais rápido do que qualquer comissão da Dieta poderia obrigá-los. As participações cruzadas permanecem intactas, os principais bancos continuam no centro de seus grupos e a produtividade liberada por dias mais curtos flui para os laboratórios em vez de para reivindicações salariais. O Estado arca com o que o pacto não cobre: a conta do seguro-saúde dos trabalhadores já esgotados e a tolerância que mantém respirando as empresas insolventes.\n-------------\nRequer que as §Yempresas zumbis do Japão§! estejam totalmente resolvidas, que a §Y$JAP_karoshi_crisis$§! já tenha sido atenuada até sua fase final e que o $JAP_worker_wellbeing$ seja de pelo menos §G85§!. Concluir este foco elimina a crise do Karoshi de vez."
 JAP_demand_recovery_progress_tt: "§YProgresso da Recuperação da Demanda§!: $RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§YProgresso da Reestruturação Corporativa§!: $RIGHT|+=0$"
 Japan_economy.32.t: "Um Tribunal Distrital Suspende a Retomada"
 Japan_economy.32.d: "Um tribunal distrital emitiu uma liminar bloqueando a retomada de um reator nuclear, citando dúvidas não resolvidas sobre a segurança sísmica e o planejamento de evacuação nas proximidades da usina. A decisão não é definitiva, mas congela o retorno do reator à operação enquanto o caso tramita em recurso. Moradores locais e grupos antinucleares se agarraram à decisão, enquanto as concessionárias alertam para o custo da capacidade ociosa continuada."
 Japan_economy.32.a: "Lutar nos tribunais de apelação."
 Japan_economy.32.b: "Aprofundar as garantias locais de segurança."
 JAP_zombie_firms_investigation: "Investigar as Empresas Zumbis"
 JAP_zombie_firms_investigation_desc: "Os bancos renovaram empréstimos a devedores insolventes e as participações cruzadas permitiram que os gestores se escondessem uns atrás dos outros. Auditores agora entram nos livros contábeis, nomeiam as empresas que sobrevivem apenas de crédito rolado e forçam os números a vir à tona."
 JAP_zombie_firms_investigation_TT: "Abre a investigação. Os dossiês são montados por meio de §Y$JAP_zombie_investigation_category$§!, e as empresas vão reagir."
 JAP_zombie_investigation_idea: "Investigação das Empresas Zumbis"
 JAP_zombie_investigation_idea_desc: "Auditores estão vasculhando os livros das empresas insolventes. A incerteza abala as diretorias e desacelera os escritórios enquanto a investigação segue seu curso."
 Japan_economy.06.b: "Deixar os bancos se autodeclararem"
 Japan_economy.07.b: "Conter as consequências"
 JAP_zombie_investigation_western_pop_TT: "Tornar pública a tolerância desacredita o bloco reformista pró-Ocidente: §RA popularidade do partido liberal cai§!"
 JAP_controlled_downsize: "Enxugamento Controlado"
 JAP_controlled_downsize_desc: "O Programa de Revitalização Financeira aplica uma avaliação de ativos mais rigorosa e provisionamento por fluxo de caixa descontado, forçando capital público para dentro dos balanços que não se sustentam sozinhos. Empresas insolventes são liquidadas e fábricas fechadas, devolvendo aos vivos os trabalhadores presos dentro dos mortos-vivos."
 JAP_complete_downsizing: "Enxugamento Completo da Economia"
 JAP_complete_downsizing_desc: "A liquidação está concluída. O crédito agora flui para empresas que podem pagá-lo, a terra é negociada a preços que refletem seu uso, e a gestão já não mede o sucesso pelo número de funcionários. Esta é a economia que os reformistas prometeram: menor no papel, muito mais forte no balanço."
 JAP_venture_capital_funds: "Fundos de Capital de Risco"
 JAP_venture_capital_funds_desc: "A Innovation Network Corporation of Japan coloca capital estatal por trás de startups privadas, combinando o risco do empreendimento com respaldo público. As famílias japonesas detêm enormes poupanças que quase nunca chegam a um fundador, e é assim que esse capital passa a se mover."
 JAP_infrastructure_investments: "Investimentos em Infraestrutura"
 JAP_infrastructure_investments_desc: "O Plano Fundamental para a Resiliência Nacional compromete o Ministério de Terras, Infraestrutura, Transportes e Turismo a renovar as pontes, túneis e quebra-mares construídos durante as décadas de alto crescimento, a maioria já com mais de cinquenta anos de serviço. As obras públicas são as artérias de uma nação industrial quando bem feitas."
 JAP_growth_tax_reform: "Mudanças Tributárias para Promover o Crescimento"
 JAP_growth_tax_reform_desc: "O Japão carregou por muito tempo uma das cargas corporativas mais pesadas do mundo desenvolvido. Reformas sucessivas reduziram a alíquota efetiva de cerca de trinta e sete por cento para a casa dos vinte, ampliando a base enquanto baixavam a alíquota e recompensando as empresas que elevam salários e investem no país. Uma empresa que mantém seus lucros trabalhando vale mais para o Tesouro do que uma que os entesoura."
 JAP_startup_education_programs: "Programas de Educação para Novas Empresas"
 JAP_startup_education_programs_desc: "Os programas EDGE e EDGE-NEXT levam o treinamento em empreendedorismo para dentro das universidades nacionais, e os escritórios de licenciamento tecnológico transformam patentes de laboratório em empresas. Um formado em Todai ou Tokyo Tech deveria ver a fundação de uma empresa como uma carreira, não como uma vergonha a ser explicada aos pais."
 JAP_retirement_reform: "Reforma da Aposentadoria"
 JAP_retirement_reform_desc: "A Lei revisada de Estabilização do Emprego de Idosos pede que os empregadores assegurem oportunidades de trabalho até os setenta anos. Os idosos são saudáveis, qualificados e dispostos, e mantê-los na força de trabalho alivia o fardo previdenciário enquanto devolve ao chão de fábrica décadas de ofício acumulado."
 JAP_forced_mergers: "Fusão"
 JAP_forced_mergers_desc: "Em vez de deixar as empresas fracas quebrarem, o ministério as casa com as fortes: ele traça as linhas, os bancos fornecem o capital e ninguém precisa admitir o fracasso. Os zumbis desaparecem do registro, e os engenheiros descontentes, as fábricas duplicadas e os odiados novos patrões permanecem."
 JAP_megabank_consolidation: "Consolidação dos Megabancos"
 JAP_megabank_consolidation_desc: "O Japão junta seus bancos urbanos enfermos em três megabancos: Mizuho, Sumitomo Mitsui e Mitsubishi UFJ. As fusões enterram uma década de créditos podres dentro de balanços grandes demais para serem questionados, e produzem credores que nenhum governo poderia se dar ao luxo de deixar quebrar."
 JAP_industrial_revitalization_corp: "Corporação de Revitalização Industrial"
 JAP_industrial_revitalization_corp_desc: "A Industrial Revitalization Corporation of Japan compra dívida em dificuldades e toma em mãos empresas combalidas, Daiei e Kanebo entre as quarenta e uma que reestrutura. Um veículo estatal de recuperação pode ditar termos, reorganizar dívidas e diluir discretamente os acionistas de maneiras que nenhum credor privado ousaria tentar."
 JAP_national_champion_mergers: "Fusões de Campeãs Nacionais"
 JAP_national_champion_mergers_desc: "O METI junta as divisões deficitárias de empresas rivais e chama a soma de campeã: a Renesas, dos braços de chips de NEC, Hitachi e Mitsubishi, e a Japan Display, dos negócios de painéis de Sony, Toshiba e Hitachi. Se três unidades em dificuldades somam uma empresa saudável é deixado cuidadosamente sem resposta."
 JAP_keiretsu_cross_shareholding: "Participação Cruzada dos Keiretsu"
 JAP_keiretsu_cross_shareholding_desc: "Mochiai, a teia de participações acionárias aliadas, é a arquitetura silenciosa do Japão corporativo, e toda reforma até hoje tentou desfazê-la. O governo, em vez disso, aperta os nós, isolando os conglomerados de investidores ativistas e ofertas hostis. Os empregos permanecem seguros, e o mesmo vale para todo executivo medíocre."
 JAP_employment_preservation_pact: "Pacto de Preservação do Emprego"
 JAP_employment_preservation_pact_desc: "Shushin koyo, o emprego vitalício, nunca foi lei, mas um acordo entre empresa, sindicato e Estado, sustentado por subsídios de ajuste. O governo o coloca por escrito: nenhum trabalhador perde o emprego por causa de uma fusão. A nação compra paz social e paga por ela com fábricas que nunca poderão fechar."
 JAP_consolidated_japan_inc: "Japan Inc. Consolidada"
 JAP_consolidated_japan_inc_desc: "A última das empresas fracas é assinada em uma fusão e o registro é encerrado. As campeãs são enormes, o ministério pode desenhar o mapa industrial em uma única folha, e os rivais estrangeiros a tratam com o respeito cauteloso devido a qualquer gigante. Por dentro, as fábricas duplicadas ainda funcionam e os engenheiros descontentes ainda saem às seis.\n-------------\nEste foco §Gremove§! §Y$JAP_zombie_companies$§! e a §Y$JAP_fusion_restructuring$§! que veio com as fusões, e deixa §Y$JAP_consolidated_conglomerates$§! permanentemente."
 JAP_venture_capital_funds_decision: "Capitalizar o Fundo de Inovação"
 JAP_venture_capital_funds_decision_desc: "Colocar dinheiro público nos fundos ao lado de gestores privados, com a condição de que os gestores escolham os vencedores. Garante um ano de esforço de pesquisa concentrado nas novas empresas."
 JAP_infrastructure_investments_decision: "Lançar as Obras de Renovação de Chubu"
 JAP_infrastructure_investments_decision_desc: "Comprometer capacidade de construção civil na renovação das estradas, pontes e serviços públicos do cinturão industrial de Chubu. As obras prendem fábricas enquanto duram e deixam a infraestrutura da região substancialmente melhor."
 JAP_growth_tax_reform_decision: "Cortar a Alíquota Corporativa"
 JAP_growth_tax_reform_decision_desc: "Reduzir a alíquota corporativa efetiva por um ano e deixar as empresas ficarem com mais do que ganham. Os preços ao consumidor cedem à medida que as empresas repassam parte do alívio às famílias."
 JAP_startup_education_programs_decision: "Financiar a Trilha de Startups Universitárias"
 JAP_startup_education_programs_decision_desc: "Dotar de recursos as faculdades de empreendedorismo e os escritórios de licenciamento tecnológico nas universidades nacionais, transformando o trabalho de laboratório em empresas e acelerando nossa pesquisa industrial."
 JAP_retirement_reform_decision: "Estender a Garantia de Emprego até os Setenta"
 JAP_retirement_reform_decision_desc: "Subsidiar os empregadores que mantêm trabalhadores qualificados além da idade tradicional de aposentadoria. Décadas de ofício acumulado permanecem no chão de fábrica por mais um ano."
 JAP_rail_modernization: "Modernização Ferroviária"
 JAP_rail_modernization_desc: "O Shinkansen Tokaido ancora a rede ferroviária mais densa da Terra, e o material rodante, a sinalização e as estações por trás dele são renovados linha por linha. As ferrovias continuam sendo a espinha dorsal de uma economia industrial que não pode permitir que elas falhem."
 JAP_shinkansen_network_expansion: "Expansão da Rede Shinkansen"
 JAP_shinkansen_network_expansion_desc: "Sob a Lei de Desenvolvimento da Ferrovia Shinkansen Nacional, sucessivos governos empurraram as linhas-tronco de alta velocidade do núcleo Tokaido em direção a Hokuriku, Kyushu e Hokkaido. Acelerar esses projetos integrará províncias distantes à economia nacional e encurtará as linhas de suprimento pelas ilhas principais."
 JAP_chuo_shinkansen_maglev: "Maglev Chuo Shinkansen"
 JAP_chuo_shinkansen_maglev_desc: "O Chuo Shinkansen é a linha maglev supercondutora da JR Central entre Tóquio, Nagoya e Osaka, com sua série L0 detendo o recorde mundial de velocidade ferroviária, 603 km/h. O compromisso estatal sustenta a prototipagem e a escavação profunda de túneis da ferrovia comercial mais veloz já tentada."
 JAP_freight_modal_shift: "Mudança Modal de Carga"
 JAP_freight_modal_shift_desc: "A Japan Freight Railway lidera uma mudança modal de carga dos caminhões de longa distância para a ferrovia, promovida por meio do Eco Rail Mark e de contêineres padronizados de trinta e um pés. Mover mais carga por trilhos reduz as emissões, alivia a escassez de motoristas e fortalece a cadeia de suprimentos industrial."
 JAP_station_city_model: "Modelo Estação-Cidade"
 JAP_station_city_model_desc: "A JR East transformou grandes terminais em cidades comerciais por direito próprio, desenvolvendo as galerias de varejo conhecidas como ekinaka e as torres ao redor de Shinagawa, Shibuya e da Estação de Tóquio. Concentrar escritórios e comércio em polos de trânsito eleva o valor da terra e a produtividade no núcleo urbano."
 JAP_regional_line_preservation: "Preservação das Linhas Regionais"
 JAP_regional_line_preservation_desc: "À medida que o despovoamento rural drena o número de passageiros, a JR West e as ferrovias do terceiro setor lutam para manter abertas as linhas locais. Em vez de abandonar o campo, subsidiaremos a ferrovia comunitária, preservando o acesso a suprimentos e a mobilidade das regiões que as linhas-tronco contornam."
 JAP_port_rail_intermodal: "Intermodal Porto-Ferrovia"
 JAP_port_rail_intermodal_desc: "A política de Portos-Polo Estratégicos Internacionais concentra o tráfego de contêineres nos agrupamentos portuários de Keihin e Hanshin. Estender ramais ferroviários no cais e terminais interiores liga os portos diretamente à rede de carga, movendo contêineres do navio ao trem sem transporte rodoviário ocioso."
 JAP_green_logistics_network: "Rede de Logística Verde"
 JAP_green_logistics_network_desc: "Uma rede de logística verde de ferrovias eletrificadas, locomotivas a bateria e a hidrogênio e centros de distribuição consolidados descarboniza o transporte de mercadorias pelo país em busca da neutralidade de carbono."
 JAP_rail_technology_exports: "Exportações de Tecnologia Ferroviária"
 JAP_rail_technology_exports_desc: "A ferrovia de alta velocidade japonesa é um produto de exportação emblemático. Trens derivados do E5 sustentam a linha Mumbai-Ahmedabad na Índia, o 700T serve a Taiwan High Speed Rail, e os pacotes de financiamento da JICA levam a tecnologia Shinkansen ao mundo todo. Vencer esses contratos espalha nossos padrões e nossa influência."
 JAP_global_rail_superpower: "Superpotência Ferroviária Global"
 JAP_global_rail_superpower_desc: "Com o Chuo Shinkansen levado até Osaka e nossas exportações circulando o globo, o Japão se firma como o líder incontestável em ferrovia de alta velocidade. A era do maglev começa em casa e irradia para fora, um símbolo duradouro da engenharia japonesa."
 JAP_chuo_shinkansen_program: "Programa Chuo Shinkansen"
 JAP_chuo_shinkansen_program_desc: "Um esforço nacional dedicado a prototipar o maglev supercondutor, acelerando nosso projeto especial de maglev."
 JAP_high_speed_line: "Linha de Alta Velocidade"
 JAP_high_speed_line_desc: "Um novo corredor Shinkansen eleva a produtividade regional, acelera a construção local e amplia o escoamento de suprimentos."
 JAP_rail_category: "Setor Ferroviário"
 JAP_hokuriku_shinkansen_extension: "Shinkansen Hokuriku: de Kanazawa a Tsuruga"
 JAP_hokuriku_shinkansen_extension_desc: "Estender o Shinkansen Hokuriku de Kanazawa a Tsuruga, trecho inaugurado em 2024, ligando a costa do Mar do Japão à rede nacional de alta velocidade."
 JAP_nishi_kyushu_shinkansen: "Shinkansen Nishi Kyushu"
 JAP_nishi_kyushu_shinkansen_desc: "Abrir a rota Nishi Kyushu até Nagasaki, em serviço desde 2022, trazendo o oeste de Kyushu para a malha Shinkansen."
 JAP_sanyo_shinkansen_upgrade: "Modernização do Shinkansen Sanyo"
 JAP_sanyo_shinkansen_upgrade_desc: "Implantar o material rodante N700S e modernizar o tronco Osaka-Hakata para maiores velocidades e maior confiabilidade."
 JAP_tohoku_shinkansen_upgrade: "Shinkansen Tohoku a 320 km/h"
 JAP_tohoku_shinkansen_upgrade_desc: "Operar trens da série E5 a 320 km/h no tronco Tohoku, reduzindo os tempos de viagem de Tóquio em direção a Aomori."
 JAP_hokkaido_shinkansen_sapporo: "Shinkansen Hokkaido: Extensão a Sapporo"
 JAP_hokkaido_shinkansen_sapporo_desc: "Escavar os túneis e erguer os viadutos para levar o Shinkansen de Shin-Hakodate-Hokuto até Sapporo."
 JAP_shikoku_shinkansen: "Shinkansen Shikoku"
 JAP_shikoku_shinkansen_desc: "Realizar a linha do plano básico, planejada há muito tempo, levando a ferrovia de alta velocidade à ilha de Shikoku pela primeira vez."
 JAP_plutonium_stockpile_concern: "Estoque de Plutônio Separado"
 JAP_galapagos_syndrome: "Síndrome de Galápagos"
 JAP_galapagos_syndrome_desc: "O Japão construiu um mundo tecnológico completo dentro de suas próprias fronteiras e depois descobriu que não conseguia exportar nada dele. Suas redes móveis rodavam em PDC enquanto o resto do planeta padronizava em GSM, de modo que nenhum aparelho nacional podia ser vendido no exterior e nenhum aparelho estrangeiro podia ser vendido aqui. A navegação chegou pelo i-mode e o pagamento pelo FeliCa, cada um anos à frente de qualquer coisa no exterior e cada um incompatível com tudo no exterior. A certificação nacional, a especificação JIS e as compras dos keiretsu fizeram o resto, enchendo o mercado interno de produtos projetados para um cliente que não existe em nenhum outro lugar. Cento e vinte milhões de consumidores bastam para sustentar uma indústria e são, por pouco, poucos demais para forçá-la a sair.\n-------------\nEste espírito nacional não se desfaz sozinho. A §Rvelocidade de pesquisa§! cai de forma constante enquanto o Japão permanecer fechado, desacelerada, mas nunca revertida por medidas temporárias. Apenas o caminho da §YIntegração com o Mundo§!, levado a §G85§! de §YAbertura§!, o remove. Veja §Y$JAP_technological_isolation_category$§! para os números atuais."
 JAP_galapagos_modifier: "Deriva de Galápagos"
 JAP_galapagos_modifier_desc: "O registro contínuo de quanto o Japão se afastou do mundo com o qual comercia. A pesquisa escorrega um pouco mais a cada mês em que o país se atém aos seus próprios padrões, e quanto mais longe dos padrões usados por seus clientes, mais rápido ela escorrega. Medidas temporárias retardam a queda. Só a integração genuína a detém."
 JAP_galapagos_resolved: "O Japão saiu de seu isolamento de Galápagos"
 JAP_galapagos_syndrome_focus: "A Questão de Galápagos"
 JAP_galapagos_syndrome_focus_desc: "O mercado interno do Japão é lucrativo e está encolhendo, protegido por padrões que trancam o país para fora de todo o resto. O ministério debate se a resposta é a convergência, reescrever os padrões para se alinhar ao mundo, ou a comercialização, vender a própria diferença. Medidas parciais desaceleram a deriva da pesquisa, mas nenhuma delas trata da escolha de fundo."
 JAP_technological_isolation_category: "Galápagos e a Guerra da Eletrônica"
 JAP_technological_isolation_category_desc: "A indústria japonesa aperfeiçoou produtos só para o Japão: aparelhos excelentes, padrões e serviços que ninguém fora do mercado interno podia usar, enquanto o resto do mundo se padronizava em torno de outra coisa. Essa mesma insularidade agora deixa o setor de semicondutores do Japão exposto, à medida que a China sobe a escada tecnológica.\n\n§YSíndrome de Galápagos§!\n§YAbertura§!: [?JAP_galapagos_openness|0] / 100\n§Y$JAP_galapagos_drift_review_mission$§! informa a deriva a cada trinta dias e mostra o valor exato antes de ele ser aplicado. Quanto menor a Abertura, mais rápido a pesquisa fica para trás, chegando a nada em §G100§! e nunca pior que §R-15%§!.\n§GAumentar a Abertura§!: os focos de integração carregam a maior parte e os focos de eletrônica acrescentam o resto. As duas campanhas abaixo acrescentam um pouco mais, mas apenas retardam a deriva. Elas não podem curar a síndrome.\n§GRemoção§!: apenas o caminho §Y$JAP_world_integration$§! remove a §Y$JAP_galapagos_syndrome$§!, e somente depois que a Abertura passar de §G85§!. O caminho §Y$JAP_cool_japan_doctrine$§! mantém o espírito de propósito e transforma o alcance cultural do Japão em influência.\n\n§YA Competição de Modelos§!\n§YPressão Competitiva§!: [?JAP_electronics_pressure|0] / 3\n§YResiliência Eletrônica§!: [?JAP_electronics_resilience|0]\nA pressão começa em §R1§!, sobe para §R2§! quando Coreia e Taiwan passam à frente (a partir de 2008, ou antes se a China subir a escada dos semicondutores) e para §R3§! quando a China atinge a fronteira tecnológica. Pressão menos Resiliência decide qual nível de §Y$JAP_model_competition$§! o Japão sofre. Iguale a pressão e o espírito se desfaz; deixe-a subir acima da Resiliência de novo e o espírito retorna.\n§GAumentar a Resiliência§!: os focos de semicondutores a concedem, cada um dependendo de Produção de Microchips IV, e a ofensiva de exportação abaixo acrescenta um por ano até a Resiliência chegar a §G5§!.\n§GRemoção§!: §Y$JAP_electronics_superpower$§! encerra a competição de vez."
 JAP_international_standards_adjustment: "Ajuste aos Padrões Internacionais"
 JAP_international_standards_adjustment_desc: "A indústria japonesa escreve seus próprios padrões, PDC para telefonia móvel e ISDB para radiodifusão, e cada um deles tranca o mercado interno para fora do mundo GSM e DVB lá fora. O governo envia engenheiros aos grupos de trabalho da ISO e da IEC, o que não pode desfazer a divergência da noite para o dia, mas coloca nomes japoneses nos rascunhos que todos os outros países lerão daqui a uma década. O preço é pago em casa, em testes de conformidade reescritos a cada cláusula concedida."
 JAP_english_business_environment: "Ambiente de Negócios em Inglês"
 JAP_english_business_environment_desc: "Os gestores japoneses não conseguem dotar de pessoal suas próprias subsidiárias no exterior na língua em que os contratos são escritos. O governo apoia programas corporativos de inglês e o experimento da Rakuten, que fez do inglês a língua de trabalho de uma empresa japonesa e foi alvo de zombaria até os resultados chegarem. Custa anos de produtividade perdida enquanto os chefes de seção aprendem a presidir uma reunião em uma segunda língua, e alguns nunca aprenderão."
 JAP_international_standards_adjustment_campaign: "Financiar as Delegações de Padronização"
 JAP_international_standards_adjustment_campaign_desc: "Pagar por mais uma rotação de engenheiros nos grupos de trabalho da ISO, IEC e ITU, e cobrir os testes de conformidade domésticos que seguem cada cláusula que o Japão concede. As delegações voltam para casa com os rascunhos e a indústria ganha um ano para se ajustar antes da próxima revisão. Pare de financiá-las e as cadeiras vão para outro."
 JAP_english_business_environment_campaign: "Subsidiar Programas Corporativos de Inglês"
 JAP_english_business_environment_campaign_desc: "Custear o treinamento de idioma que as empresas-membro não quiseram pagar por conta própria: instrutores internos, provas TOEIC em horário de trabalho e destacamentos aos escritórios no exterior para todos que passarem. A produção cai enquanto as pessoas estudam. As empresas que persistem deixam de precisar de um tradutor na sala."
