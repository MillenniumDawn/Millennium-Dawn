 CHE_conspire_with_the_fifth_columnists: "Conspire with the Fifth Columnists"
 CHE_conspire_with_the_fifth_columnists_desc: "Our nation is plagued by Russian parasites and the cowardice of those who preach peace. Where the Caesar bleeds, we are compelled to betray the shepherds to save the flock. Just as Israel was promised to the chosen people, The men of Dzhokhar Dudaev hold the same divine mandate. We stand ready to seize authority through a total divine war to drive out the Rusnya and fulfil the martyr’s return."
