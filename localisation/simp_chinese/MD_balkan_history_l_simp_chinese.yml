l_simp_chinese:
 balkan_news.1.t: "卡拉季奇被判种族灭绝罪"
 balkan_news.1.d: "海牙法庭认定拉多万·卡拉季奇在斯雷布雷尼察犯有种族灭绝罪，并在波斯尼亚全境犯有反人类罪，判处其四十年监禁。在代顿协议签署二十年后，这位波斯尼亚塞族战时领导人终于受到了他发动的战争所催生的法庭的审判。"
 balkan_news.1.a: "判决书在萨拉热窝被当众宣读。"
 balkan_news.1.b: "有人说，这是对所有塞尔维亚人的判决。"
 balkan_news.1.c: "迟来的正义"
 balkan_news.2.t: "卡拉季奇被判终身监禁"
 balkan_news.2.d: "上诉法庭驳回了拉多万·卡拉季奇的上诉，将其刑期改判为终身监禁，认为原判四十年刑期不足以惩处其罪行的严重性。这最终宣判了这位领导塞族共和国度过战争的领导人的命运。"
 balkan_news.2.a: "海牙结案"
 balkan_news.3.t: "姆拉迪奇被判犯有种族灭绝罪"
 balkan_news.3.d: "法庭认定拉特科·姆拉迪奇犯有种族灭绝罪、战争罪和反人类罪，并判处其终身监禁。这位前将军在法庭上对着法官们大喊大叫，在宣读判决前就被带出了法庭。在斯雷布雷尼察，遇难者的母亲们默默地旁听着。"
 balkan_news.3.a: "最后，将军得到了答案。"
 balkan_news.4.t: "当庭自杀"
 balkan_news.4.d: "法官维持对波斯尼亚克罗地亚族将军斯洛博丹·普拉利亚克20年徒刑的判决后不久，普拉利亚克便宣称自己并非战犯，并在镜头前饮下了一瓶毒药。数小时后，他便身亡。上诉法庭维持了对六名前黑塞哥维那领导人的定罪，认定他们犯下了连萨格勒布都牵涉其中的共同罪行。"
 balkan_news.4.a: "他拒绝接受法庭的判决。"
 balkan_news.4.b: "法庭最后一案以惨痛的结局告终"
 balkan_news.5.t: "姆拉迪奇的上诉被驳回"
 balkan_news.5.d: "联合国法官维持了对拉特科·姆拉迪奇的种族灭绝罪定罪和终身监禁判决，至此，波斯尼亚战争遗留的最后一起重大案件告一段落。斯雷布雷尼察惨案发生四分之一世纪后，对这场战争的司法清算已经完成，但政治清算尚未完成。"
 balkan_news.5.a: "全案定谳"
 CRO_nat_populism_gain_tt: "§R民族主义右翼势力获得支持。§!"
 balkan_news.6.t: "塞尔维亚世界宣言"
 balkan_news.6.d: "贝尔格莱德和巴尼亚卢卡联合通过了一份长达十三页的宣言，旨在将塞尔维亚领土统一在一个常设的塞尔维亚-塞族共和国合作高级委员会之下。该宣言缺乏法律效力，但意图强烈。"
 balkan_news.6.a: "值得拥有的赞助人"
 balkan_news.6.b: "萨拉热窝的权威进一步削弱"
 balkan_news.6.c: "社区新闻"
 balkan_news.7.t: "欧盟部队加倍投入"
 balkan_news.7.d: "在俄罗斯坦克越境进入乌克兰几天后，欧盟将驻波斯尼亚和黑塞哥维那的欧盟木槿花部队的驻军人数增加了一倍左右，并空运了预备役部队，以防止局势蔓延。"
 balkan_news.7.a: "令人安心的决心展现"
 balkan_news.7.b: "其他地方采取的预防措施"
 balkan_news.8.t: "埃尔多安在萨拉热窝举行集会"
 balkan_news.8.d: "由于被禁止在西欧各地开展竞选活动，埃尔多安在萨拉热窝举行了此次竞选中唯一一场欧洲集会，吸引了数千人参加，并会见了民主行动党的巴基尔·伊泽特贝戈维奇。多迪克称此举是干涉。"
 balkan_news.8.a: "萨拉热窝可以信赖的朋友"
 balkan_news.8.b: "在其他国家举行的集会"
 balkan_news.9.t: "拉夫罗夫访问萨拉热窝"
 balkan_news.9.d: "谢尔盖·拉夫罗夫访问了萨拉热窝，只有多迪克一人在机场迎接他。迎接他的是一面波斯尼亚国旗，而非波黑国旗。他离开时带走了一幅有着数百年历史的东正教圣像，其来源可追溯至卢甘斯克，基辅方面希望对此礼物做出解释。"
 balkan_news.9.a: "塞族共和国自己的外交政策"
 balkan_news.9.b: "像其他任何一次访问一样"