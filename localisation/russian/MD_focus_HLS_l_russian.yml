l_russian:
 vatican_focus: "Дерево фокусов Ватикана"
 crusader_pope: "Папа-крестоносец"
 caliph_pope: "Новый халиф"
 HLS_idea_vatican_library: "Ватиканская библиотека"
 HLS_idea_vatican_library_desc: "Ватиканская библиотека хранит одно из старейших собраний рукописей в мире. Поддерживать её в безупречном состоянии требует постоянной заботы и денег, но она остаётся памятником Святому Престолу.\n§W--------------§!\nЭтот национальный дух §Gулучшится§!, если мы выполним фокус §Y$HLS_refurbish_the_vatican_library$§!."
 HLS_idea_refurbished_vatican_library: "Обновлённая Ватиканская библиотека"
 HLS_idea_refurbished_vatican_library_desc: "Восстановленная Ватиканская библиотека требует меньше ухода и открыла свои читальные залы для учёных со всего мира."
 HLS_idea_rise_of_islam: "Подъём ислама"
 HLS_idea_rise_of_islam_desc: "Центр католицизма принял новую веру, причём самую неожиданную. Теперь папа проповедует слово Аллаха с балкона собора Святого Петра."
 HLS_idea_holy_soldiers: "Армия крестоносцев"
 HLS_idea_holy_soldiers_desc: "Наши солдаты носят звание крестоносцев. На родной земле рвение укрепляет их решимость, хотя ведущее их духовенство не слишком терпимо к политике."
 HLS_idea_allahs_will: "Воля Аллаха"
 HLS_idea_allahs_will_desc: "Новобранцы стекаются в Ватиканский халифат. Обучены немногие, но убеждённости хватает всем."
 HLS_idea_holy_war: "Война против Ватикана"
 HLS_idea_holy_war_desc: "Мы воюем со Святым Престолом, который объявил этот конфликт священной войной, но не призвал остальную Европу к оружию."
 HLS_idea_global_crusade_target: "Цель крестового похода"
 HLS_idea_global_crusade_target_desc: "Папа объявил против нас крестовый поход и призвал страны Европы присоединиться к нему."
 HLS_idea_fortress_vatican: "Крепость Ватикан"
 HLS_idea_fortress_vatican_desc: "Ватикан сильно укреплён. Любому врагу папы будет трудно пробить его стены."
 HLS_idea_religious_recruits: "Религиозные новобранцы"
 HLS_idea_religious_recruits_desc: "Верующие хотят сражаться за Святой Престол. Большинство из них никогда не держали в руках винтовку, поэтому их подготовка требует времени."
 HLS_idea_rejected_islam: "Осуждение ислама"
 HLS_idea_rejected_islam_desc: "Папа официально осудил ислам, и отношения с мусульманским миром рухнули."
 HLS_idea_accepted_islam: "Признание ислама"
 HLS_idea_accepted_islam_desc: "Папа официально признал ислам родственной верой, открыв новую главу в отношениях двух религий."
 HLS_idea_crusader_state: "Государство крестоносцев"
 HLS_idea_crusader_state_desc: "Папа вновь провозгласил Ватикан государством крестоносцев."
 HLS_idea_italian_power_supply: "Соглашение об итальянском энергоснабжении"
 HLS_idea_italian_power_supply_desc: "Ватикан покупает почти всё электричество у Италии. Долгосрочное соглашение с итальянскими энергокомпаниями обеспечивает свет в соборе Святого Петра по справедливой цене."
 HLS_idea_carbon_neutral_state: "Первое углеродно-нейтральное государство"
 HLS_idea_carbon_neutral_state_desc: "Ватикан компенсирует свои выбросы, высаживая леса за рубежом, и проповедует верующим заботу о творении. Проекты чистой энергии находят щедрых покровителей в Курии."
 HLS_idea_papal_diplomacy: "Папская дипломатия"
 HLS_idea_papal_diplomacy_desc: "Папские нунции работают почти в каждой столице мира. Мало какое правительство откажется от встречи с посланником папы."
 HLS_idea_vatican_observatory: "Specola Vaticana"
 HLS_idea_vatican_observatory_desc: "Ватиканская обсерватория — один из старейших астрономических институтов в мире. Её астрономы-иезуиты придают Святому Престолу научную репутацию, с которой могут сравниться немногие государства."
 HLS_idea_lacks_an_army: "Нет профессиональной армии"
 HLS_idea_lacks_an_army_desc: "Ватикану никогда не требовались вооружённые силы, кроме Швейцарской гвардии и Жандармерии, и у него нет институтов, чтобы их создать.\n§W--------------§!\nЭтот национальный дух §Gулучшится§!, если мы выполним фокус §Y$HLS_question_of_the_land_forces$§!."
 HLS_idea_forming_an_army: "Формирование армии"
 HLS_idea_forming_an_army_desc: "Пришло время создать армию, достойную Святого Престола."
 HLS_idea_swiss_guard_reform: "Реформа Швейцарской гвардии"
 HLS_idea_swiss_guard_reform_desc: "Швейцарская гвардия верна папе и никому больше. Расширив её до полноценной армии, мы опираемся на вековую дисциплину."
 HLS_idea_fanatics_reform: "Армия фанатиков"
 HLS_idea_fanatics_reform_desc: "Вера — единственный ресурс, которого у нас в избытке. Армия фанатиков никогда не испытает нехватки добровольцев, если научится сражаться в строю."
 HLS_idea_papal_states: "Папская область"
 HLS_idea_papal_states_desc: "Папа вновь светский государь и правит куда большим, чем несколько акров за стенами собора Святого Петра. Теперь у Церкви есть не только паства, которую нужно пасти, но и государство, которым нужно управлять."
 HLS_idea_roman_curia: "Римская курия"
 HLS_idea_roman_curia_desc: "Курия — это администрация Святого Престола, от Государственного секретариата до Ватиканского банка. Когда она работает, работает вся Церковь, а когда нет — не работает ничего."
 HLS_idea_pilgrim_pope: "Папа-паломник"
 HLS_idea_pilgrim_pope_desc: "Мы не ждём, пока мир придёт в Рим. Папа сам идёт к миру, от трущоб Манилы до площадей Варшавы, и где бы он ни приземлился, собираются толпы."
 HLS_idea_moral_authority: "Моральный авторитет"
 HLS_idea_moral_authority_desc: "У нас нет армий, но главы государств всё ещё прислушиваются, когда говорит папа. Наш голос слышен, потому что нам никогда не приходилось его повышать."
 we_are_the_true_vatican: "Истинный Ватикан"
 agreed_to_our_aid: "Приняли нашу помощь"
 disagreed_to_our_aid: "Отказались от нашей помощи"
 accepted_islam: "Приняли ислам"
 rejected_islam: "Отвергли ислам"
 HLS_decision_category: "Повестка Его Святейшества"
 HLS_decision_category_desc: "[HLS.GetLeader] обладает властью Престола Святого Петра. Курия ждёт его решений."
 HLS_ask_for_more_swiss_guard_unit: "Запросить дополнительную Швейцарскую гвардию"
 HLS_ask_for_more_swiss_guard_unit_desc: "Швейцарцы охраняют папу с 1506 года. По мере роста Святого Престола растёт и его потребность в их защите."
 HLS_ask_for_more_swiss_guard_tt: "Попросить §YШвейцарию§! прислать ещё одну дивизию §YШвейцарской гвардии§!."
 HLS_accept_islam: "Признать ислам"
 HLS_accept_islam_desc: "Отношения ислама и христианства — одна из великих дискуссий нашего времени. Официальное признание со стороны Ватикана протянет мусульманскому миру голубя мира."
 HLS_accept_islam_tooltip: "Все мусульманские страны станут лучше относиться к нам, а мы к ним."
 HLS_condemn_islam: "Осудить ислам"
 HLS_condemn_islam_desc: "Некоторые в Курии хотят, чтобы папа открыто осудил ислам и порвал с десятилетиями межрелигиозного диалога."
 HLS_condemn_islam_tooltip: "Все мусульманские страны станут хуже относиться к нам. Открывает фокус §Y$HLS_anti_islamist_crusade$§! и закрывает фокус §Y$HLS_a_dark_path$§!."
 HLS_general_audience: "Провести общую аудиенцию"
 HLS_general_audience_desc: "Каждую неделю папа обращается к толпам на площади Святого Петра. Удачная аудиенция укрепляет наше положение, но неудачно выбранное слово могут обратить против нас."
 HLS_convene_a_consistory: "Созвать консисторию"
 HLS_convene_a_consistory_desc: "Консистория собирает Коллегию кардиналов вокруг папы. Хорошо проведённое собрание сохраняет верность князей Церкви и держит Курию в узде."
 HLS_convene_the_ulema: "Созвать улемов"
 HLS_convene_the_ulema_desc: "Учёные, направляющие Ватиканский халифат, ждут, что халиф будет искать их совета. Собрав их в Риме, мы заверим их, что новая вера в надёжных руках."
 HLS_rename_istanbul: "Переименовать Стамбул в Константинополь"
 HLS_rename_istanbul_desc: "Городом не правил христианский государь с 1453 года. Теперь, когда он снова наш, следует вернуть ему прежнее название."
 HLS_religious_recruits_decision: "Набрать религиозных добровольцев"
 HLS_religious_recruits_decision_desc: "Мы маленькая страна, но верующие по всей Европе жаждут вступить в Божье воинство."
 HLS_religious_recruits_tt: "Создаёт в нашей столице §Y5§! дивизий §GСвятых воинов§!."
 HLS_international_jihadists_decision: "Набрать иностранных бойцов"
 HLS_international_jihadists_decision_desc: "Добровольцы со всего мусульманского мира хотят служить Ватиканскому халифату. Нужно организовать их, пока они не организовались сами."
 HLS_international_jihadists_decision_tt: "Создаёт в нашей столице §Y5§! дивизий §GFadiyeen lil Bayt al-Maqdis§!."
 vatican.1.t: "Ватикан требует интеграции"
 vatican.1.d: "Святой Престол приказал нам распустить Итальянскую Республику и войти в Папскую область, передав папе полную власть над нашей землёй."
 vatican.1.o1: "Всё ради Бога."
 vatican.1.o2: "Никогда!"
 vatican.2.t: "Италия соглашается"
 vatican.2.d: "[FROM.GetNameDefCap] согласилась присоединиться к нам. Папская область возрождена, и Рим вновь стал столицей христианского государства."
 vatican.2.o1: "Превосходно!"
 vatican.3.t: "Италия отказывается"
 vatican.3.d: "[FROM.GetNameDefCap] отказалась самораспуститься. Она остаётся нашим вассалом, но этот отказ поставил Курию в неловкое положение."
 vatican.3.o1: "Они об этом пожалеют."
 vatican.4.t: "Ватикан объявляет против нас крестовый поход"
 vatican.4.d: "Святой Престол объявил антиисламистский крестовый поход и назвал наше правительство своим врагом. Папа требует, чтобы мы подчинились."
 vatican.4.o1: "Они за это заплатят."
 vatican.5.t: "Крестовый поход или священная война?"
 vatican.5.d: "Мы вступаем в войну против страны [FROM.GetNameDef] во имя Господа. Объявить ли крестовый поход и призвать к оружию наших союзников и страны Европы или оставить эту войну своей?"
 vatican.5.o1: "Это наша битва."
 vatican.5.o2: "Вместе мы выстоим! Противник: [FROM.GetNameDef]"
 vatican.6.t: "Ватикан требует нашей присяги"
 vatican.6.d: "Беспрецедентный шаг: Святой Престол потребовал, чтобы итальянское правительство признало папу своим светским государем и передало Республику под власть Ватикана."
 vatican.6.o1: "Мы подчиняемся Святому Отцу."
 vatican.6.o2: "Это абсурд."
 vatican.7.t: "Объявить крестовый поход?"
 vatican.7.d: "Мы вступили в войну против страны [FROM.GetNameDef]. Призвать ли христианские страны Европы и наших союзников вступить в войну как в крестовый поход?"
 vatican.7.o1: "Нет, это наша собственная война."
 vatican.7.o2: "Да, вместе мы будем сильны!"
 vatican_holy_war_event_tooltip: "Объявляет эту войну §Yкрестовым походом§!. Каждая европейская страна, не являющаяся салафитской, и каждый член нашей фракции приглашаются вступить в войну против цели."
 vatican.10.t: "Ватиканский халифат предлагает помощь"
 vatican.10.d: "Ватиканский халифат предложил мусульманским странам оружие, деньги и защиту, обещая союз правоверных против их врагов."
 vatican.10.o1: "Мы согласны."
 vatican.10.o2: "Нам лучше одним."
 vatican.11.t: "Папа призывает нас в крестовый поход"
 vatican.11.d: "[HLS.GetLeader] объявил крестовый поход против страны [FROM.GetNameDef] и просит каждую христианскую нацию Европы взяться за оружие или прислать помощь Святому Престолу."
 vatican.11.o1: "Deus vult!"
 vatican.11.o2: "Мы пришлём немного помощи."
 vatican.11.o3: "Чушь, на дворе XXI век!"
 vatican.12.t: "Против нас объявлен крестовый поход"
 vatican.12.d: "Папа просит страны Европы объявить нам войну. Нужно готовиться к худшему."
 vatican.12.o1: "Пусть попробуют!"
 vatican.13.t: "Папа просит прислать ещё швейцарских гвардейцев"
 vatican.13.d: "Святой Престол попросил нас прислать ещё одно подразделение Папской швейцарской гвардии для постоянного размещения в Ватикане."
 vatican.13.o1: "Для папы? Конечно!"
 vatican.13.o2: "У него достаточно охраны."
 vatican.14.t: "Швейцария присылает новых гвардейцев"
 vatican.14.d: "Наша просьба удовлетворена. В наших стенах разместилось новое подразделение Швейцарской гвардии."
 vatican.14.o1: "Отличные новости!"
 vatican.15.t: "Швейцария отказывается"
 vatican.15.d: "Швейцария пока отказалась присылать новых швейцарских гвардейцев."
 vatican.15.o1: "Может быть, когда у них появятся лишние люди."
 vatican.16.t: "Италия признаёт сюзеренитет папы"
 vatican.16.d: "Вопреки всем ожиданиям, [FROM.GetNameDef] признала папу своим государем. Рим вновь подчиняется Ватикану."
 vatican.16.o1: "Да будет воля Божья."
 vatican.17.t: "Италия отвергает сюзеренитет папы"
 vatican.17.d: "[FROM.GetNameDefCap] наотрез отвергла наше требование. Если Италия не подчинится добровольно, её придётся заставить."
 vatican.17.o1: "Тогда мы возьмём её силой."
 vatican.18.t: "Паломники заполонили Рим в юбилейный год"
 vatican.18.d: "Папа провозгласил юбилейный год, и миллионы паломников стекаются в Рим, чтобы пройти через Святую дверь собора Святого Петра. Курия должна решить, как принять толпы."
 vatican.18.o1: "Принять каждого паломника."
 vatican.18.o2: "Провести юбилей торжественно и под контролем."
 vatican.19.t: "Где пройдёт Всемирный день молодёжи?"
 vatican.19.d: "Молодые католики со всех континентов готовы собраться вокруг Святого Отца на Всемирный день молодёжи. Курия должна выбрать регион-хозяин, и этот выбор многое скажет о том, где Церковь видит своё будущее."
 vatican.19.o1: "Провести в Европе."
 vatican.19.o2: "Провести в Америке."
 vatican.19.o3: "Провести в Африке и Азии."
 vatican.20.t: "Молитва о мире в Ассизи"
 vatican.20.d: "Мы созвали лидеров мировых религий помолиться о мире в Ассизи, городе святого Франциска. Курия разделилась во мнениях, кого приглашать."
 vatican.20.o1: "Пригласить лидеров всех вероисповеданий."
 vatican.20.o2: "Пригласить только христианские конфессии."
 vatican.21.t: "Синод обсуждает реформы и традиции"
 vatican.21.d: "Епископы со всех континентов собрались в Риме, чтобы обсудить будущее Церкви. Реформаторы хотят более открытой Церкви, а традиционалисты предостерегают от отказа от переданного предками."
 vatican.21.o1: "Принять реформы."
 vatican.21.o2: "Сохранить традиции."
 vatican.21.o3: "Искать компромисс."
 vatican.22.t: "Утечка документов раскрыла финансы Курии"
 vatican.22.d: "Конфиденциальные бумаги о Ватиканском банке попали в прессу: в них названы сомнительные счета и жертвователи. Редакции по всей Европе требуют от Святого Престола ответов."
 vatican.22.o1: "Открыть счета и привлечь к суду виновных в утечке."
 vatican.22.o2: "Замять дело."
 vatican_news.1.t: "Папа объявляет крестовый поход"
 vatican_news.1.d1: "После недавнего осуждения ислама папа объявил крестовый поход против страны [FROM.GetNameDef]. Ватикан призывает союзников немедленно вступить в войну."
 vatican_news.1.d2: "Папа объявил так называемый крестовый поход против страны [FROM.GetNameDef], назвав нашу веру ложной. Да придаст Аллах сил стране [FROM.GetName] и да поставит папу на место."
 vatican_news.1.o1: "Крестовый поход? У нас что, XII век?"
 vatican_news.1.o2: "Иншаллах."
 vatican_news.2.t: "Папа признаёт ислам"
 vatican_news.2.d1: "В историческом заявлении [HLS.GetLeader] объявил ислам и христианство равными перед Богом и призвал к прочной дружбе с мусульманами всего мира."
 vatican_news.2.d2: "Лидер христиан [HLS.GetLeader] признал истинность ислама перед всем миром. Многие правоверные видят в этом знак грядущего."
 vatican_news.2.o1: "Меньше вражды между ними было бы кстати."
 vatican_news.2.o2: "Возможно, христианство и ислам смогут стоять бок о бок."
 vatican_news.3.t: "Папа осуждает ислам"
 vatican_news.3.d1: "[HLS.GetLeader] официально осудил ислам, отказавшись от десятилетий межрелигиозного диалога. Несколько правительств Ближнего Востока уже выступили с угрозами в адрес Ватикана."
 vatican_news.3.d2: "Христианский папа [HLS.GetLeader] перед всем миром оскорбил веру миллиарда мусульман. Мы не оставим эту клевету без ответа."
 vatican_news.3.o1: "Папа осуждает ислам? Что дальше, крестовый поход?"
 vatican_news.3.o2: "Папа пожалеет об этих словах."
 vatican_news.4.t: "Возрождение Константинополя"
 vatican_news.4.d1: "[HLS.GetLeader] официально переименовал Стамбул в Константинополь. Город пал под натиском османов в 1453 году и был официально переименован в 1930-м, но теперь снова в руках христиан."
 vatican_news.4.d2: "Папа переименовал Стамбул в Константинополь, отняв его у законных владельцев. Это оскорбление не забудут."
 vatican_news.4.o1: "Это название лучше."
 vatican_news.4.o2: "В руках папы он надолго не останется."
 holywar_wargoal: "Священная война"
 holywar_wargoal_desc: "Священная война, объявленная Святым Престолом."
 holywar_wargoal_short_desc: "Эта цель войны — для священной войны под предводительством папы."
 crusade_wargoal: "Крестовый поход"
 crusade_wargoal_desc: "Крестовый поход против этой страны, объявленный папой."
 crusade_wargoal_short_desc: "Эта цель войны — для крестового похода, объявленного папой."
 jihad_wargoal: "Джихад"
 jihad_wargoal_desc: "Джихад, объявленный Ватиканским халифатом."
 jihad_wargoal_short_desc: "Эта цель войны — для джихада, объявленного Ватиканским халифатом."
 vatican_islamist_alliance: "Правоверные Аллаха"
 vatican_holy_christian_alliance: "Священная лига"
 HLS_retake_african_coast_tt: "Даёт претензии на побережье Северной Африки, некогда принадлежавшее Риму."
 HLS_anti_islamist_crusade_tt: "Каждое §Yсалафитское§! правительство узнаёт о крестовом походе. Затем для каждого мы выбираем, вести ли §Yсвященную войну§! или объявить общеевропейский §Yкрестовый поход§!."
 HLS_aid_our_brethren_tt: "Каждой мусульманской стране, не воюющей с нами, предлагается наша помощь. Принявшие её получают §Gстабильность§! и §Gподдержку войны§! и вступают в нашу фракцию, если мы её возглавляем."
 HLS_sympathizers_for_the_cause_tt: "Мы получаем §G3%§! влияния в каждой §Yсалафитской§! стране."
 HLS_vatican_radio_tt: "Мы получаем §G2%§! влияния в §YИталии§!, §YПольше§!, §YИспании§!, §YПортугалии§!, §YИрландии§!, §YБразилии§!, §YМексике§! и на §YФилиппинах§!."
 HLS_swiss_guard_tooltip: "§YШвейцария§! присылает в Ватикан дивизию §YШвейцарской гвардии§!."
 HLS_anti_islamist_crusade_custom_trigger: "Официально осудил ислам"
 HLS_a_dark_path_custom_trigger: "Не осуждал ислам"
 HLS_ecumenical_outreach_tt: "Мы получаем §G3%§! влияния в каждой §Yправославной§! стране."
 vatican_wyd_europe_tt: "Мы получаем §G3%§! влияния в каждой §Yхристианской§! стране §YЕвропы§!."
 vatican_wyd_americas_tt: "Мы получаем §G3%§! влияния в каждой §Yхристианской§! стране §YАмерики§!."
 vatican_wyd_global_south_tt: "Мы получаем §G3%§! влияния в каждой §Yхристианской§! стране §YАфрики§! и §YАзии§!."
 vatican_assisi_muslim_tt: "Каждая §Yмусульманская§! страна станет лучше к нам относиться."
 vatican_assisi_orthodox_tt: "Мы получаем §G2%§! влияния в каждой §Yправославной христианской§! стране."
 HLS_improve_the_city: "Благоустроить город"
 HLS_improve_the_city_desc: "Улицы и дворы Ватикана нуждаются в ремонте, и каждый квадратный метр города должен приносить пользу."
 HLS_strengthen_the_walls: "Укрепить стены"
 HLS_strengthen_the_walls_desc: "Леонинские стены защищают папу уже более тысячи лет. Современные угрозы требуют современной обороны."
 HLS_electrical_deals: "Энергетические сделки"
 HLS_electrical_deals_desc: "Ватикан покупает электроэнергию у Италии. Долгосрочное соглашение с итальянскими энергокомпаниями обеспечит дешёвые и надёжные поставки."
 HLS_vatican_factories: "Ватиканские фабрики"
 HLS_vatican_factories_desc: "Это не самое святое начинание, но Святому Престолу нужна собственная промышленность."
 HLS_carbon_neutrality: "Углеродная нейтральность"
 HLS_carbon_neutrality_desc: "Высаживая леса, чтобы компенсировать выбросы, Ватикан может стать первым в мире углеродно-нейтральным государством и повести верующих по пути заботы о творении."
 HLS_solar_panels: "Солнечные панели"
 HLS_solar_panels_desc: "Крыша Зала аудиенций имени Павла VI большая, плоская и солнечная. Покрыв её солнечными панелями, Ватикан станет образцом чистой энергетики."
 HLS_heavy_restructuring: "Масштабная перестройка"
 HLS_heavy_restructuring_desc: "Ватикан должен перерасти рамки анклава. Работа займёт годы и обойдётся в целое состояние, но сделает нас сильными."
 HLS_vatican_fortress: "Укрепление Ватикана"
 HLS_vatican_fortress_desc: "Ватикан — не просто город, а резиденция папы. Вместо новых фабрик его следует основательно укрепить."
 HLS_refurbish_the_vatican_library: "Обновить Ватиканскую библиотеку"
 HLS_refurbish_the_vatican_library_desc: "Ватиканской библиотеке нужна основательная реставрация, чтобы она оставалась чудом ещё на века."
 HLS_road_to_greatness: "Путь к величию"
 HLS_road_to_greatness_desc: "Мир смеётся над самой маленькой страной на земле. Пора возродить старые обычаи и повести мир в новую эру веры."
 HLS_status_quo: "Статус-кво"
 HLS_status_quo_desc: "У Святого Престола всё хорошо. Нет нужды возвращаться к амбициям прошлого."
 HLS_swiss_guard: "Швейцарская гвардия"
 HLS_swiss_guard_desc: "Швейцарская гвардия всегда защищала нас, но современный мир требует её укрепить."
 HLS_great_jubilee: "Великий юбилей"
 HLS_great_jubilee_desc: "В Святой год миллионы паломников приходят в Рим, чтобы пройти через Святую дверь собора Святого Петра. Церковь намерена принять каждого из них."
 HLS_pastoral_journeys: "Пастырские визиты"
 HLS_pastoral_journeys_desc: "Папа больше не ждёт в Ватикане, пока мир придёт к нему. Визиты в далёкие страны приближают Святой Престол к верующим и доносят его голос и до президентов, и до толп."
 HLS_interfaith_dialogue: "Межрелигиозный диалог"
 HLS_interfaith_dialogue_desc: "В 1986 году папа собрал лидеров мировых религий в Ассизи помолиться о мире. Созвав их снова, мы покажем, что вера может свидетельствовать против насилия, а не служить его причиной."
 HLS_world_youth_day: "Всемирный день молодёжи"
 HLS_world_youth_day_desc: "Раз в несколько лет папа созывает молодёжь всего мира на большое собрание для молитвы и праздника. Откликаются миллионы, и многие возвращаются домой с более глубокой верой."
 HLS_synod_of_bishops: "Синод епископов"
 HLS_synod_of_bishops_desc: "Епископы со всех континентов собираются в Риме, чтобы советовать папе по вопросам, стоящим перед Церковью. Их советы помогают Святому Престолу не терять связь с верующими во всех странах."
 HLS_ecumenical_outreach: "Экуменический диалог"
 HLS_ecumenical_outreach_desc: "Расколу между Востоком и Западом почти тысяча лет. Терпеливый диалог с православными церквями ещё может сблизить две половины христианского мира."
 HLS_moral_authority: "Моральный авторитет"
 HLS_moral_authority_desc: "Папа не командует армиями, но правительства и народы прислушиваются, когда он говорит о войне, бедности и человеческом достоинстве. Это доверие — самое ценное, чем владеет Святой Престол."
 HLS_italy_our_puppet: "Италия — наш вассал"
 HLS_italy_our_puppet_desc: "Чтобы начать восхождение, мы должны вернуть власть над Апеннинским полуостровом. В конце концов, Италия — наша родина."
 HLS_retake_rome: "Вернуть Рим"
 HLS_retake_rome_desc: "Ватикан всегда будет сердцем нашего государства, но для его поддержки нам нужен весь Рим с его фабриками."
 HLS_italian_integration: "Интеграция Италии"
 HLS_italian_integration_desc: "Вассала недостаточно. Италия должна полностью войти в Папскую область."
 HLS_rebuild_italy: "Восстановить Италию"
 HLS_rebuild_italy_desc: "Теперь, когда Италия под нашей властью, нужно освободить место для её восстановления."
 HLS_reinstate_latin_language: "Вернуть латынь"
 HLS_reinstate_latin_language_desc: "В одном государстве должен быть один язык. Латынь, язык Церкви, заменит итальянский в нашем управлении."
 HLS_the_rise_of_christianity: "Подъём христианства"
 HLS_the_rise_of_christianity_desc: "Пора показать миру, что Церковь может вести не только души, но и народы."
 HLS_new_alliance: "Новый ватиканский союз"
 HLS_new_alliance_desc: "Ватикан не может в одиночку преодолеть упрямство мира. Нам нужны союзники."
 HLS_religious_recruits: "Религиозные новобранцы"
 HLS_religious_recruits_desc: "Многие верующие хотят сражаться за нас. Мало кто из них годен к бою, поэтому подготовка займёт время."
 HLS_restore_roman_empire: "Восстановить Римскую империю"
 HLS_restore_roman_empire_desc: "Когда-то из Рима Церковь направляла империю. Она может сделать это снова."
 HLS_divide_et_impera: "Divide et Impera"
 HLS_divide_et_impera_desc: "«Разделяй и властвуй». Раздробите крупные державы на куски, слишком слабые, чтобы нам сопротивляться, и восстанет новый Рим."
 HLS_strike_gaul: "Удар по Галлии"
 HLS_strike_gaul_desc: "Галлия, Испания и Британия когда-то подчинялись Риму. Наши легионы им об этом напомнят."
 HLS_retake_african_coast: "Вернуть африканское побережье"
 HLS_retake_african_coast_desc: "Северная Африка была такой же частью Рима, как и Галлия. Нужно восстановить римскую власть вдоль её побережья."
 HLS_recover_balkans: "Вернуть Балканы"
 HLS_recover_balkans_desc: "После распада Югославии Балканы почти не знали ничего, кроме конфликтов. Объединённые под властью Рима, их народы обретут мир."
 HLS_recover_anatolia: "Вернуть Анатолию"
 HLS_recover_anatolia_desc: "Восточная империя должна быть восстановлена, и на этот раз она не отделится от Запада. Константинополь ждёт."
 HLS_holy_soldiers: "Армия крестоносцев"
 HLS_holy_soldiers_desc: "Когда-то звание крестоносца получал каждый, кто сражался в крестовых походах. Присвоив его нашим солдатам, мы привяжем их к Церкви."
 HLS_anti_islamist_crusade: "Антиисламистский крестовый поход"
 HLS_anti_islamist_crusade_desc: "Салафитские режимы мира навлекли на себя гнев Церкви. Пора поднять мечи."
 HLS_retake_the_holy_land: "Вернуть Святую землю"
 HLS_retake_the_holy_land_desc: "Кто вообще сказал, что Первый крестовый поход был плохой идеей?"
 HLS_second_anti_islamist_crusade: "Второй антиисламистский крестовый поход"
 HLS_second_anti_islamist_crusade_desc: "Первый крестовый поход не довёл дело до конца. Пора начать новый."
 HLS_a_dark_path: "Тёмный путь"
 HLS_a_dark_path_desc: "Христианство в Ватикане изжило себя. Папа обрёл новую веру, и Святой Престол последует за ним."
 HLS_jihad: "Объявить джихад"
 HLS_jihad_desc: "Мир должен знать, что Ватиканский халифат всерьёз намерен распространять свою веру."
 HLS_take_jerusalem: "Взять Иерусалим"
 HLS_take_jerusalem_desc: "Иерусалим свят для всех трёх авраамических религий. Ватиканский халифат намерен им править."
 HLS_anti_america: "Против Америки"
 HLS_anti_america_desc: "Война Америки с терроризмом настроила против неё мусульманский мир. Ватиканский халифат возглавит сопротивление."
 HLS_aid_our_brethren: "Помочь нашим братьям"
 HLS_aid_our_brethren_desc: "Мусульманские страны слишком часто оказываются во власти иностранных держав. Вместе мы сможем защищать друг друга."
 HLS_allahs_will: "Воля Аллаха"
 HLS_allahs_will_desc: "Правоверные стекаются в Ватиканский халифат, готовые отдать жизнь за общее дело."
 HLS_sympathizers_for_the_cause: "Сочувствующие делу"
 HLS_sympathizers_for_the_cause_desc: "Салафитские правительства мира пригодятся для распространения нашего послания. Нужно добиться их расположения."
 HLS_papal_armed_forces: "Папские вооружённые силы"
 HLS_papal_armed_forces_desc: "Папству не была нужна армия с падения Папской области в 1870 году. Пора оценить наши силы."
 HLS_question_of_the_land_forces: "Вопрос сухопутных сил"
 HLS_question_of_the_land_forces_desc: "Наши сухопутные силы почти ничего не стоят. Опереться на Швейцарскую гвардию или обучать в Риме молодых фанатиков?"
 HLS_maintain_the_swiss_guard: "Сохранить Швейцарскую гвардию"
 HLS_maintain_the_swiss_guard_desc: "Швейцарская гвардия всегда была нам верна. Мы сохраним традицию и её высокие стандарты дисциплины."
 HLS_drill_the_guard: "Муштра гвардии"
 HLS_drill_the_guard_desc: "Швейцарская гвардия никогда не предназначалась для наступательных войн. Суровая муштра подготовит её к этой задаче."
 HLS_offensive_swiss_guard: "Наступательная Швейцарская гвардия"
 HLS_offensive_swiss_guard_desc: "Швейцарская гвардия вымуштрована и готова вести нашу армию в атаку."
 HLS_refined_equipment_procurement: "Отлаженные закупки снаряжения"
 HLS_refined_equipment_procurement_desc: "Чем дешевле обходится вооружение наших войск винтовками, тем больше солдат их получит."
 HLS_latium_military_industrial_complex: "Римский военно-промышленный комплекс"
 HLS_latium_military_industrial_complex_desc: "Римские легионы сами обслуживали своё снаряжение. Похожая система ускорит мобилизацию и принесёт государству деньги."
 HLS_bring_fanatics_to_rome: "Привести фанатиков в Рим"
 HLS_bring_fanatics_to_rome_desc: "Фанатики всегда находили дорогу к Церкви. Теперь мы оденем их в форму."
 HLS_fanatic_infantry: "Фанатичная пехота"
 HLS_fanatic_infantry_desc: "Фанатики — ненадёжные солдаты, но тысячи их, бросившихся в атаку разом, прорвут любую линию."
 HLS_disciplined_rabble: "Дисциплинированный сброд"
 HLS_disciplined_rabble_desc: "Суровая дисциплина может превратить наших фанатиков в грозную боевую силу."
 HLS_papal_fleet: "Папский флот"
 HLS_papal_fleet_desc: "Папский флот последний раз выходил в море в 1870 году. Теперь, когда у нас есть побережье, мы можем снова создать флот."
 HLS_angelforce: "Ангельские силы"
 HLS_angelforce_desc: "В Ватикане уже есть вертолётная площадка для папы. Она может стать зародышем небольшой папской авиации."
 HLS_reform_the_curia: "Реформировать Римскую курию"
 HLS_reform_the_curia_desc: "Конгрегации и советы Курии стали медлительными и склочными. Реформа папской бюрократии давно назрела."
 HLS_clean_up_the_vatican_bank: "Очистить Ватиканский банк"
 HLS_clean_up_the_vatican_bank_desc: "Институт религиозных дел десятилетиями связан со скандалами. Открыв его счета для европейских регуляторов, мы вернём доверие к нашим финансам."
 HLS_peters_pence: "Лепта святого Петра"
 HLS_peters_pence_desc: "Католики по всему миру каждый год жертвуют папе через Лепту святого Петра. Новый призыв наполнит нашу казну."
 HLS_open_the_vatican_museums: "Открыть Музеи Ватикана"
 HLS_open_the_vatican_museums_desc: "Каждый год миллионы посетителей приходят посмотреть на Сикстинскую капеллу. Продлённые часы работы и новые галереи привлекут ещё миллионы."
 HLS_vatican_observatory: "Ватиканская обсерватория"
 HLS_vatican_observatory_desc: "Specola Vaticana изучает небеса уже больше века. Финансирование её телескопов в Аризоне сохранит Церковь на передовой науки."
 HLS_vatican_radio: "Радио Ватикана"
 HLS_vatican_radio_desc: "Радио Ватикана передаёт голос папы на десятках языков. Расширив его вещание, мы укрепим связи с католическим миром."
 HLS_papal_diplomacy: "Папская дипломатия"
 HLS_papal_diplomacy_desc: "Святой Престол поддерживает дипломатические отношения почти со всеми государствами мира. Пора задействовать эту сеть."
 HLS_praedicate_evangelium: "Praedicate Evangelium"
 HLS_praedicate_evangelium_desc: "В 2022 году апостольская конституция Praedicate Evangelium перестроила Римскую курию вокруг миссии проповеди Евангелия. Конгрегации и советы сменились дикастериями, а возглавлять их получили право и миряне."