l_english:
 SHIPYARD_CRISIS_TITLE: "Naval Shipyard Backlog"
 SHIPYARD_CRISIS_LEVEL_LINE: "Crisis level: §R[?shipyard_crisis_level|0]%§!"
 SHIPYARD_CRISIS_BAR_TT: "The §Ycrisis level§! rises every month and weakens our yards. Programs lower it and slow its monthly growth.\n\nDockyard output: [?shipyard_mod_output|+%]\nShip repair speed: [?shipyard_mod_repair|+%]\nRefit speed: [?shipyard_mod_refit|+%]\nRefit cost: §R+[?shipyard_mod_refit_cost|%]§!\n\nThe fewer yards in the world can take a hull, the harder the backlog hits it. Every full §Y10§! crisis points add §R+1%§! to the build cost of corvettes and smaller, §R+2%§! to frigates, §R+3%§! to destroyers, §R+4%§! to cruisers, battleships and attack submarines, and §R+5%§! to carriers, amphibious ships and missile submarines."
 SHIPYARD_CRISIS_OUTPUT_LINE: "$MODIFIER_INDUSTRIAL_CAPACITY_DOCKYARD_FACTOR$: §R[?shipyard_mod_output|+%]§!"
 SHIPYARD_CRISIS_REPAIR_LINE: "$MODIFIER_REPAIR_SPEED_FACTOR$: §R[?shipyard_mod_repair|+%]§!"
 SHIPYARD_CRISIS_REFIT_LINE: "Refit speed: §R[?shipyard_mod_refit|+%]§!"
 SHIPYARD_CRISIS_DRIFT_LINE: "Monthly drift: §R+[?shipyard_drift|2]§!"
 SHIPYARD_CRISIS_DRYDOCK_LINE: "Drydock stages: §Y[?shipyard_drydock_stage|0]/5§!"
 SHIPYARD_CRISIS_WORKFORCE_LINE: "Workforce stages: §Y[?shipyard_workforce_stage|0]/3§!"
 shipyard_crisis_modifier: "Naval Shipyard Backlog"
 shipyard_crisis_modifier_desc: "Congested drydocks and a shortage of skilled labor slow repairs, refits and new construction. The effect grows with the crisis level."
 shipyard_crisis_equipment: "Naval Shipyard Backlog"
 shipyard_cost_drydock_tt: "£treasury [?shipyard_cost_drydock|1]"
 shipyard_cost_drydock_tt_blocked: "£treasury §R[?shipyard_cost_drydock|1]§!"
 shipyard_drydock_effect_tt: "When the work is complete, the crisis level falls by §G15§! and its monthly drift slows by §G10%§!."
 shipyard_workforce_effect_tt: "When the program is complete, the crisis level falls by §G6§! and its monthly drift slows by §G15%§!."
 shipyard_drydock_stages_tt: "Drydock programs completed: §Y[?shipyard_drydock_stage|0]/5§!"
 shipyard_workforce_stages_tt: "Training programs completed: §Y[?shipyard_workforce_stage|0]/3§!"
 shipyard_allied_dockyards_tt: "An allied yard with spare §Ydrydock§! capacity will take our hulls"
 SHIPYARD_READOUT_OK: "£dockyard_output_texticon §Y[?shipyard_readout_in_use|0]§!/[?shipyard_dockyards|0] · effective §Y[?shipyard_effective_dockyards|0]§!"
 SHIPYARD_READOUT_OVER: "£dockyard_output_texticon §R[?shipyard_readout_in_use|0]§!/[?shipyard_dockyards|0] · effective §R[?shipyard_effective_dockyards|0]§!"
 SHIPYARD_READOUT_TT: "Dockyards at work out of the ones we own, and how many of them our shipbuilding base can actually staff.\n\nKeeping more than §Y[?shipyard_effective_dockyards|0]§! at work at once overloads the yards. The §Ycrisis level§! then climbs an extra §R1§! point every month, stability falls by §R1%§! and the yard states lose output until we free one."
 md_shipyard.1.t: "The Yards Are Overloaded"
 md_shipyard.1.d: "We have put §Y[?shipyard_dockyards_in_use|0]§! dockyards to work, and our shipbuilding base can staff §Y[?shipyard_effective_dockyards|0]§!. Foremen are splitting the same crews between hulls, parts arrive late and nothing moves at the pace the plan promised.\n\nUnless we cancel an order and free a dockyard, the backlog will deepen every month, the yards will take the whole district down with them and the government will answer for it."
 md_shipyard.1.a: "Cancel an order and free a dockyard"
 md_shipyard.1.b: "The yards will cope"
 md_shipyard_overload_free_tt: "Cancel a production line or stop a repair until no more than §Y[?shipyard_effective_dockyards|0]§! dockyards are at work. Until then the §Ycrisis level§! rises an extra §R1§! point each month, we lose §R1%§! stability and the yard states lose output."
 md_shipyard_overload_push_tt: "The yards keep every hull on the slipway. The §Ycrisis level§! rises and the pressure stays until we free a dockyard."
 shipyard_overload_modifier: "Overloaded Shipyards"
 shipyard_overload_modifier_desc: "More hulls on the slipways than the yard can staff. The crews, the cranes and the suppliers are spread thin and the whole district pays for it."
