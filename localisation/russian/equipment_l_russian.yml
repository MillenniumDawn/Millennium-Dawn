 USA_IFV_5: "M2A4 Bradley"
 USA_IFV_5_desc: "После войны в Ираке армия начала изучать предложения по инженерным изменениям (ECP) для M2 Bradley, чтобы вернуть запас по объёму, массе, мощности и охлаждению, утраченный из-за брони и электроники, в спешке добавленных во время боёв. ECP1 восстановит подвижность и позволит машине выдерживать больший вес."
