 KOR_lg_chem_desc: "LG Chem liderará la innovación en baterías y materiales para aplicaciones civiles y militares."
 KOR_lg_first: "LG First Initiative"
 KOR_lg_first_desc: "Centrarse en estrategias de ser los primeros en el mercado mantendrá a LG por delante de la competencia global."
 KOR_lg_cns: "Expansión de LG CNS"
 KOR_lg_cns_desc: "CNS se encargará de los sistemas de IA, TI e infraestructura de gobierno inteligente."
 KOR_ochang_plant: "Ampliar la planta de Ochang"
