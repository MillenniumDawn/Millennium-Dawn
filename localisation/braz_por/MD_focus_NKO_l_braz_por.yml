 NKO_norinco_trait_local_missile_depots:0 "Depósitos Locais de Mísseis"
 NKO_specialise_commanders_tt:0 "§GComandantes blindados, defensivos, ofensivos e de armas combinadas ganham, cada um, um traço que aprofunda sua especialidade.§!"
 NKO_specialise_guerrilla_tt:0 "§GComandantes treinados em guerrilha aprendem a montar emboscadas.§!"
 NKO_specialise_commando_tt:0 "§GComandantes treinados como comandos são promovidos para liderar forças especiais.§!"
 NKO_sso_new_general_tt:0 "§GAs Forças de Operações Especiais nomeiam §!§YKim Yong Bok§!§G, um especialista em forças especiais, como novo comandante de corpo.§!"
 NKO_arms_export:0 "Escritório de Relações Exteriores"
 NKO_arms_export_desc:0 "O birô por trás da KOMID e do comércio exterior de armas. Forneça armas, mísseis, tropas e satélites a nações em guerra em troca de divisas, tecnologia e uma base industrial em crescimento permanente."
 NKO_arms_export_modifiers:0 "Escritório de Relações Exteriores"
 NKO_arms_export_modifiers_desc:0 "O birô de exportação de armas de Pyongyang. Cada nação que abastecemos eleva permanentemente nossa §Yprodução das fábricas§! e a §Yeficiência de produção§!, um bônus que cresce conforme o arsenal multipolar se expande."
 NKO_arms_export_title:0 "§YEscritório de Relações Exteriores§!"
 NKO_arms_export_clients_readout:0 "Nações Abastecidas: §Y[?NKO_arms_export_clients|0]§!    Acordos Concluídos: §Y[?NKO_arms_export_deals|0]§!"
 NKO_arms_export_output_readout:0 "Produção Permanente das Fábricas: §G+[?NKO_arms_export_clients|0]%§!"
 NKO_arms_export_revenue_readout:0 "Divisas Obtidas: §G$[?NKO_arms_export_revenue|0]§! bilhões"
 NKO_arms_export_sanctions_readout:0 "Pressão de Sanções: [NKO_arms_export_sanctions_status]"
 NKO_arms_export_hint:0 "Abra a seção §YConvencional§! para armar qualquer nação §Wnão ocidental§! que esteja §Rperdendo sua guerra§! (30%+ de rendição). Cada cliente concede §G+1% permanente de produção das fábricas§!, divisas e tecnologia, mas aumenta as §Rsanções§!. Peça a seus patronos que as amenizem."
 NKO_arms_export_capstone_status_progress:0 "§OArsenal do Mundo Multipolar: abasteça 10 nações para desbloquear o ápice.§!"
 NKO_arms_export_capstone_status_ready:0 "§GO Arsenal do Mundo Multipolar está ao alcance. Convoque o Escritório.§!"
 NKO_arms_export_capstone_status_done:0 "§GArsenal do Mundo Multipolar alcançado.§!"
 NKO_arms_export_sanctions_max:0 "§RMáxima (CSNU)§!"
 NKO_arms_export_sanctions_severe:0 "§RSevera§!"
 NKO_arms_export_sanctions_heavy:0 "§OPesada§!"
 NKO_arms_export_sanctions_moderate:0 "§OModerada§!"
 NKO_arms_export_sanctions_light:0 "§YLeve§!"
 NKO_arms_export_sanctions_none:0 "§GNenhuma§!"
 NKO_arms_export_conv_open:0 "§YAbrir§! as Exportações de Armas Convencionais"
 NKO_arms_export_conv_open_desc:0 "Exibe as decisões de fornecimento convencional: projéteis de artilharia e voluntários do Corpo de Assalto para toda nação em guerra."
 NKO_arms_export_conv_close:0 "§YFechar§! as Exportações de Armas Convencionais"
 NKO_arms_export_conv_close_desc:0 "Oculta as decisões de fornecimento convencional para manter o painel organizado."
 NKO_export_munitions:0 "Enviar um Pacote de Armas Convencionais a [FROM.GetNameWithFlag]"
 NKO_export_munitions_desc:0 "Despacha por ferrovia um pacote de armas dos depósitos do Exército Popular para a frente. [FROM.GetName] escolhe o tipo de divisão de que mais precisa (§Yinfantaria leve§!, §Ymotorizada§!, §Yblindada§! ou §Ymecanizada§!) e enviamos equipamento moderno, de 1995 ou mais recente, suficiente para §Ytrês batalhões§! dela, retirado diretamente de nossos próprios estoques. Pacotes blindados e mecanizados exigem um projeto moderno de tanque. Não fornecemos aeronaves. Eles lutam com mais força, e somos pagos em divisas."
 NKO_deploy_storm_corps:0 "Enviar o Corpo de Assalto a [FROM.GetNameWithFlag]"
 NKO_deploy_storm_corps_desc:0 "Oferece uma intervenção norte-coreana a [FROM.GetName]. Se aceitarem, desbloqueamos a capacidade de enviar §Ydivisões voluntárias§! à sua frente, aproximando nosso patrono e ganhando sua gratidão. Enviar-se à §YRússia§! ou à §YChina§! abre um subsídio permanente em divisas que continua mesmo depois que o corpo volta para casa. Requer a política externa §YIntervencionismo Global§!."
 NKO_arms_export_lobby_relief:0 "Pressionar por Alívio das Sanções"
 NKO_arms_export_lobby_relief_desc:0 "Gaste o peso diplomático de nossos parceiros bem armados, e uma quantia discreta em dinheiro, para obter um afrouxamento de um nível das sanções internacionais nas Nações Unidas."
 NKO_arms_export_capstone:0 "Arsenal do Mundo Multipolar"
 NKO_arms_export_capstone_desc:0 "Tendo armado uma coalizão de nações contra a ordem imperialista, formalize o papel de Pyongyang como a oficina do mundo multipolar."
 NKO_arms_export_relief_deals_tt:0 "Concluiu pelo menos §Y5§! acordos de exportação"
 NKO_arms_export_relief_sanctions_tt:0 "Está atualmente sob sanções internacionais"
 NKO_arms_export_unlock_tt:0 "§GDesbloqueia o Escritório de Relações Exteriores, o programa estrangeiro de exportação de armas e mão de obra.§!"
 NKO_export_munitions_effect_tt:0 "Se aceitarem, o cliente solicita um pacote de divisão e entregamos equipamento de §Y1995 ou mais recente§! suficiente para §Ytrês batalhões§!, §Yretirado de nossos próprios estoques§!. Pacotes blindados e mecanizados exigem um §Yprojeto moderno de tanque§! (pelo menos metade dos módulos pós-Guerra Fria). §RNão fornecemos aeronaves.§! Somos pagos em §Ydivisas§!, e um novo cliente concede um bônus permanente de produção das fábricas proporcional ao pacote: §G+1%§! infantaria leve, §G+2%§! motorizada, §G+3%§! blindada ou mecanizada. A pressão de sanções aumenta.\n\nO cliente ganha §YMunições Norte-Coreanas§! por §Y365§! dias:\n  §G+5%§! Ataque da Divisão\n  §G+5%§! Taxa de Recuperação da Divisão\n  §G-5%§! Consumo de Suprimentos"
 NKO_export_troops_effect_tt:0 "Oferecemos enviar forças de intervenção. Se o anfitrião aceitar, desbloqueamos a capacidade de enviar §Ydivisões voluntárias§! à sua guerra, e ganhamos favor político e divisas. Nenhuma mão de obra é perdida em casa."
 NKO_storm_corps_permanent_income_tt:0 "Como patrono de grande potência, eles concedem um subsídio semanal §Ypermanente§! em divisas que continua mesmo depois que o Corpo de Assalto volta para casa."
 NKO_arms_client_munitions:0 "Munições Norte-Coreanas"
 NKO_arms_client_munitions_desc:0 "Caixas de projéteis e fuzis norte-coreanos mantêm os canhões atirando."
 NKO_arms_client_troops:0 "Voluntários do Exército do Povo Coreano"
 NKO_arms_client_troops_desc:0 "Veteranos do Corpo de Assalto reforçam a frente e seguram a linha."
 NKO_storm_corps_abroad:0 "Corpo de Assalto Enviado ao Exterior"
 NKO_storm_corps_abroad_desc:0 "Nossas melhores tropas lutam numa guerra estrangeira. Sua ausência é sentida em casa, em mão de obra e moral."
 NKO_arms_export_capstone_spirit:0 "Arsenal do Mundo Multipolar"
 NKO_arms_export_capstone_spirit_desc:0 "Pyongyang se tornou um fornecedor indispensável para as nações que resistem ao Ocidente. Nossas fábricas operam a todo vapor, isoladas da pressão das sanções."
 NKO_export.1.t:0 "Moscou Precisa de Projéteis"
 NKO_export.1.d:0 "A ofensiva da Rússia devora munição mais rápido do que suas fábricas conseguem fornecer. Por canais discretos, o Kremlin pede a Pyongyang projéteis de artilharia, foguetes e o que mais o Exército Popular puder ceder. O pagamento será generoso: dinheiro, grãos e a tecnologia militar que há muito cobiçamos."
 NKO_export.1.a:0 "Cumprir o pedido"
 NKO_export.1.b:0 "Não neste momento"
 NKO_export.10.t:0 "[FROM.GetNameWithFlag] Oferece um Pacote de Armas"
 NKO_export.10.d:0 "Pyongyang se oferece para despachar por ferrovia um pacote de armas modernas às nossas forças pressionadas, pago em divisas. Podemos solicitar o equipamento para o tipo de divisão de que mais precisamos: hardware suficiente para §Ytrês batalhões§!, retirado diretamente dos estoques norte-coreanos."
 NKO_export.10.a:0 "Solicitar um pacote de §YInfantaria Leve§!: fuzis e equipamento de comando"
 NKO_export.10.b:0 "Recusar a oferta"
 NKO_export.11.t:0 "[FROM.GetNameWithFlag] Aceita Nossas Armas"
 NKO_export.11.d:0 "[FROM.GetName] aceitou nossa oferta. A remessa parte de nossos depósitos para a frente, e as divisas já estão em nossas contas."
 NKO_export.11.a:0 "Carregar os trens"
 NKO_export.12.t:0 "[FROM.GetNameWithFlag] Recusa Nossas Armas"
 NKO_export.12.d:0 "[FROM.GetName] recusou nossas armas. As caixas ficam em nossos armazéns."
 NKO_export.12.a:0 "Que seja"
 NKO_export.99.t:0 "O Arsenal do Mundo Multipolar"
 NKO_export.99.d:0 "De Moscou a Teerã, as armas de uma dúzia de exércitos são alimentadas por fábricas norte-coreanas. O que começou como um comércio desesperado por divisas tornou a República Popular Democrática indispensável a toda potência que desafia Washington. A oficina da revolução encontrou seus clientes."
 NKO_export.99.a:0 "Que o mundo dependa de nós"
 NKO_export.22.t:0 "Pyongyang Oferece Forças de Intervenção"
 NKO_export.22.d:0 "[FROM.GetName] propõe enviar divisões voluntárias coreanas à nossa frente. Seus soldados lutariam ao lado dos nossos contra nossos inimigos, uma oferta de intervenção de Pyongyang que mal podemos nos dar ao luxo de recusar."
 NKO_export.22.a:0 "Aceitar seus soldados"
 NKO_export.22.b:0 "Recusar a oferta"
 NKO_export.20.t:0 "[FROM.GetNameWithFlag] Precisa de Homens"
 NKO_export.20.d:0 "[FROM.GetName], onde nosso Corpo de Assalto já luta, esgotou suas reservas de mão de obra. Seu comando apela a Pyongyang para que envie homens novos para segurar a linha."
 NKO_export.20.a:0 "Enviar reforços"
 NKO_export.20.b:0 "Não podemos dispensar os homens"
 NKO_export_send_manpower_tt:0 "§GEnvia mão de obra equivalente a §Y10%§! da reserva recrutável de [FROM.GetName], retirada de nossas reservas.§!"
 NKO_export.40.t:0 "O Ocidente Responde com Sanções"
 NKO_export.40.d:0 "Nosso armamento continua aparecendo em frentes que os imperialistas queriam fechadas para nós. [USA.GetName], acompanhado por [FRA.GetName], [GER.GetName] e [JAP.GetName], lançou um novo pacote de sanções: contas congeladas, casas comerciais na lista negra e advertências a quem continuar comprando de Pyongyang. Já suportamos a pressão deles antes."
 NKO_export.40.a:0 "Deixar os imperialistas esbravejarem"
 NKO_export.40.b:0 "Absorver o golpe em silêncio"
 NKO_arms_contract_title:0 "§YCompromissos de Voluntários com o Patrono§!"
 NKO_expeditions_readout:0 "Expedições Comprometidas: §G[?NKO_expeditions_completed|0]§!"
 NKO_commit_volunteers:0 "Comprometer Expedição de Voluntários com [FROM.GetName]"
 NKO_commit_volunteers_desc:0 "Formalize o envio de nossas divisões voluntárias que lutam em [FROM.GetName]. Pyongyang cobra de seu patrono pela mão de obra, depositando divisas. [FROM.GetName] paga um prêmio por nossas divisões."
 NKO_commit_volunteers_req_tt:0 "[FROM.GetName] abriga pelo menos §Y6§! de nossas divisões voluntárias"
 NKO_commit_volunteers_effect_tt:0 "Deposita um prêmio em divisas em nosso §Ytesouro§!. Enquanto nossas §Ydivisões voluntárias§! continuarem lutando no exterior, o desdobramento prolongado treina nosso exército, concedendo §Ydomínio de doutrina terrestre§! toda semana."
 NKO_economy_shortcut:0 "Economia"
 NKO_military_shortcut:0 "Militar"
 NKO_38th_parallel_shortcut:0 "Paralelo 38"
 NKO_political_shortcut:0 "Política"
 NKO_overcome_the_arduous_march:0 "Superar a Marcha Árdua"
 NKO_overcome_the_arduous_march_desc:0 "Os anos de fome ficaram para trás. A agricultura foi restaurada, Huichon foi reconstruída e as classes de mercado emergentes foram integradas. Finalmente podemos declarar a Marcha Árdua superada e voltar toda a força do Estado para a recuperação nacional."
 NKO_renovate_water_supply_facilities:0 "Renovar as Instalações de Abastecimento de Água"
 NKO_renovate_water_supply_facilities_desc:0 "Renovar e expandir nossas instalações de abastecimento de água é essencial para a saúde pública e o desenvolvimento industrial. Garantiremos acesso a água limpa e confiável para todos os cidadãos e indústrias."
 NKO_national_power_grid:0 "Rede Elétrica Nacional"
 NKO_national_power_grid_desc:0 "Ligar nossas usinas renováveis e hidrelétricas numa rede nacional unificada estabilizará o fornecimento de eletricidade a fábricas e residências, acabando com os apagões rotativos que há muito prejudicam a produção."
 NKO_pojon_field_responsibility:0 "Sistema de Responsabilidade de Campo Pojon"
 NKO_pojon_field_responsibility_desc:0 "O sistema Pojon concede a pequenas equipes familiares de trabalho autonomia sobre o excedente agrícola acima das cotas estatais. Ao permitir que os camponeses retenham colheitas de incentivo, a produção se expande e a segurança alimentar se fortalece."
 NKO_rason_ftz:0 "Zona Econômica Especial de Rason"
 NKO_rason_ftz_desc:0 "A Zona de Livre Comércio de Rason, no nordeste, desenvolvida em conjunto com investimentos chineses e russos, abre à Coreia do Norte a porta de entrada para o comércio legal transfronteiriço. O controle do porto de Rajin e do acesso à fronteira desbloqueia um comércio econômico sustentado."
 NKO_koryolink_network:0 "Rede Móvel Koryolink"
 NKO_koryolink_network_desc:0 "A Koryolink, lançada em 2008 como uma rede 3G construída com a Orascom Telecom, oferece telecomunicações modernas a milhões de assinantes. Uma rede móvel moderniza o fluxo de informações e reduz a dependência da mídia controlada pelo Estado."
 NKO_pyongyang_prestige_streets:0 "Ruas de Prestígio de Pyongyang"
 NKO_pyongyang_prestige_streets_desc:0 "Avenidas de vitrine como a Rua dos Cientistas Mirae e a Rua Ryomyong, construídas em ritmo acelerado para projetar modernidade nacional e desafio apesar das sanções internacionais. Esses símbolos urbanos elevam o moral popular e o prestígio internacional."
 NKO_ryugyong_hotel:0 "Conclusão do Hotel Ryugyong"
 NKO_ryugyong_hotel_desc:0 "O Hotel Ryugyong, pirâmide de 105 andares há muito inativa, recebe seu revestimento externo completo de vidro entre 2008 e 2011. Esse marco arquitetônico simboliza a ambição tecnológica nacional e a recuperação econômica."
 NKO_exporting_workforce:0 "Exportação de Mão de Obra"
 NKO_chollima_speed:0 "Velocidade Chollima"
 NKO_field_responsibility_system:0 "Sistema de Responsabilidade de Campo"
 NKO_field_responsibility_system_desc:0 "O sistema de responsabilidade de campo Pojon dá às brigadas camponesas o poder de reter colheitas excedentes acima das cotas estatais, criando incentivos à produção. A produção agrícola sustentada melhora a segurança alimentar e o moral popular."
 NKO_mobile_network:0 "Rede Móvel Koryolink"
 NKO_mobile_network_desc:0 "Uma moderna rede de telecomunicações 3G alcança milhões de assinantes, modernizando a infraestrutura de comunicações. O melhor acesso à informação e a menor dependência da mídia estatal reduzem a tensão social."
 NKO_people_army:0 "O Exército Popular"
 NKO_people_army_desc:0 "O Exército Popular precisava estar pronto para a guerra, mesmo durante o difícil período da \"Marcha Árdua\", a fim de se defender do imperialismo dos EUA e de seus fantoches sul-coreanos."
 NKO_national_defence_force:0 "Defesa Nacional"
 NKO_national_defence_force_desc:0 "Aumentaremos nossos Gastos Militares para igualá-los aos de nossa contraparte do Sul, a fim de manter nossa nação segura e protegida de qualquer ameaça."
 NKO_red_dawn:0 "Alvorada Vermelha"
 NKO_red_dawn_desc:0 "A alvorada de nosso espírito revolucionário brilhará mais uma vez à medida que fortalecemos nosso poderio militar. Que este seja o início de nossa marcha incansável rumo à supremacia."
 NKO_studying_their_airforce:0 "Estudar as Forças Aéreas Inimigas"
 NKO_studying_their_airforce_desc:0 "Para nos preparar para os conflitos inevitáveis, devemos estudar as forças aéreas de nossos inimigos, conhecer seus pontos fortes e fracos e elaborar contraestratégias."
 NKO_focus_on_the_f_35:0 "Foco no F-35"
 NKO_focus_on_the_f_35_desc:0 "Analisaremos a tecnologia do F-35, usando seu projeto como inspiração para aprimorar nossas próprias capacidades aéreas e enfrentar quem empregar esse caça avançado."
 NKO_focus_on_the_f_16:0 "Foco no F-16"
 NKO_focus_on_the_f_16_desc:0 "O F-16 provou ser um caça competente. Dissecaremos suas táticas e tecnologia, aprimorando nossa própria frota de caças no processo."
 NKO_focus_on_the_future_kai_kf_21:0 "Foco no KF-21"
 NKO_focus_on_the_future_kai_kf_21_desc:0 "O KF-21 é o caça de próxima geração da Coreia do Sul. Ao analisar seu potencial, preparamos nossa força aérea para neutralizar qualquer ameaça que ele possa representar."
 NKO_begin_uranium_enrichment:0 "Iniciar o Enriquecimento de Urânio"
 NKO_begin_uranium_enrichment_desc:0 "Seja pela libertação do povo sul-coreano ou pela defesa de nossa grande pátria contra a ameaça nuclear dos imperialistas dos EUA, devemos continuar a desenvolver armas nucleares com firmeza e coragem!"
 NKO_remove_monitoring_devices:0 "Remover os Dispositivos de Monitoramento"
 NKO_remove_monitoring_devices_desc:0 "Nosso enriquecimento de urânio certamente será combatido pela comunidade internacional. A melhor coisa que podemos fazer, então, para ocultar o Enriquecimento de Urânio é ----- tornar a comunidade internacional invisível."
 NKO_expel_inspectors:0 "Expulsar os Inspetores"
 NKO_expel_inspectors_desc:0 "A Agência Internacional de Energia Atômica enviou muitos Inspetores a nosso país para garantir que usemos a tecnologia nuclear apenas para fornecimento de energia. Como estamos prestes a nos desvencilhar deles, podemos aproveitar para deportar esses espiões imperialistas."
 NKO_withdraw_from_npt:0 "Retirar-se do TNP"
 NKO_withdraw_from_npt_desc:0 "Um passo importante para nosso programa nuclear, ligado à nossa independência e segurança, é nos retirarmos do TNP. Não podemos limitar nossa capacidade de defender a independência e a segurança de nosso país por causa dos tratados desiguais de imperialistas ridículos!"
 NKO_missile_tests:0 "Testes de Mísseis"
 NKO_missile_tests_desc:0 "Os testes de mísseis da Coreia do Norte são demonstrações de suas crescentes capacidades de mísseis balísticos, exibindo uma gama de sistemas, de curto alcance a mísseis balísticos intercontinentais (ICBMs). Esses testes são fundamentais para avançar sua tecnologia militar, afirmar influência regional e sinalizar intenções estratégicas, muitas vezes agravando tensões e provocando respostas internacionais."
 NKO_nuclear_tests: "Nuclear Tests"
 NKO_nuclear_tests_desc:0 "Os testes nucleares da Coreia do Norte são uma série de detonações subterrâneas realizadas pelo país desde 2006 como parte de seu programa de desenvolvimento de armas nucleares. Esses testes demonstram avanços no rendimento e na tecnologia das armas, frequentemente provocando condenação e sanções internacionais. Representam um elemento crítico na estratégia norte-coreana de garantir a segurança do regime e projetar poder no cenário global."
 NKO_our_pride_and_joy:0 "Nosso Orgulho e Alegria"
 NKO_our_pride_and_joy_desc:0 "Regozijemo-nos! Diante do severo bloqueio dos imperialistas dos EUA e de seus países subordinados, sob a liderança do amado camarada [NKO.GetLeader], nós, a República Popular Democrática da Coreia, finalmente temos nossa própria força nuclear de contrapeso! Acabaram-se os dias em que os agressores imperialistas dos EUA tentavam nos chantagear com um porrete nuclear!"
 NKO_nuclear_approval_not_sco:0 "Não devemos ser membros da OCX"
 NKO_people_air_force:0 "Força Aérea Popular"
 NKO_people_air_force_desc:0 "Os céus de Choson devem ser mantidos a salvo de qualquer intrusão dos imperialistas americanos ou de seus aliados do sul. Isso se mostrará uma tarefa difícil se não melhorarmos nossas capacidades aéreas."
 NKO_self_produced_rifles:0 "Fuzis de Produção Própria"
 NKO_self_produced_rifles_desc:0 "O Exército Popular da Coreia não pode depender de fornecedores estrangeiros para seu fuzil de serviço padrão. Os arsenais nacionais se prepararão para fabricar armas leves em quantidade, garantindo que cada soldado esteja armado com uma arma feita na pátria."
 NKO_model_master:0 "Mestre dos Modelos"
 NKO_model_master_desc:0 "O desenvolvimento de tanques da Coreia do Norte foca na produção de veículos blindados nacionais adaptados ao seu terreno e doutrina militar. Variando de modelos de inspiração soviética a projetos modernizados, esses tanques desempenham papel crítico nas forças terrestres da nação, enfatizando mobilidade, poder de fogo e capacidade de operar em diversos cenários de combate."
 NKO_artillery:0 "Nossa Artilharia"
 NKO_artillery_desc:0 "A artilharia da Coreia do Norte é a pedra angular de sua estratégia militar, com uma vasta gama de sistemas, de obuseiros tradicionais a artilharia de foguetes avançada. Conhecida por seu enorme estoque, a artilharia foi projetada para poder de fogo esmagador, capaz de atingir tanto instalações militares quanto áreas civis, particularmente na vizinha Coreia do Sul, tornando-se elemento-chave de dissuasão e ofensiva."
 NKO_spaa:0 "Nossa Defesa Aérea"
 NKO_spaa_desc:0 "O sistema de defesa aérea da Coreia do Norte é uma mistura de tecnologia da era soviética e plataformas desenvolvidas internamente, projetado para proteger infraestruturas críticas e contrapor possíveis ameaças aéreas. Inclui mísseis superfície-ar, canhões antiaéreos e sistemas de radar, enfatizando uma estratégia de defesa em camadas. Apesar das limitações em relação a sistemas modernos, reflete o foco do país na autossuficiência e na dissuasão."
 NKO_rocket_artillery:0 "Artilharia de Foguetes"
 NKO_rocket_artillery_desc:0 "A artilharia de foguetes da Coreia do Norte é um componente crítico de seu exército, com uma ampla gama de sistemas, incluindo os poderosos modelos KN-09 e KN-25. Essas plataformas são projetadas para ataques de precisão de longo alcance, capazes de entregar poder de fogo significativo contra alvos militares e estratégicos. Sua mobilidade e rápido emprego aumentam a capacidade norte-coreana de projetar força e sustentar operações ofensivas."
 NKO_naval_modernization:0 "Modernização Naval"
 NKO_naval_modernization_desc:0 "A modernização naval da Coreia do Norte foca em aprimorar suas capacidades com embarcações menores e ágeis e sistemas de mísseis avançados. Isso inclui desenvolver submarinos capazes de lançar mísseis balísticos (SLBMs) e modernizar navios de superfície com armamento moderno. O esforço reflete uma estratégia de guerra assimétrica, aproveitando ativos costeiros e submarinos para contrapor potências navais maiores e projetar força em águas regionais."
 NKO_anti_submarine:0 "Capacidades Antissubmarino"
 NKO_anti_submarine_desc:0 "As capacidades antissubmarino da Coreia do Norte são limitadas, mas evoluem, apoiando-se numa combinação de barcos de patrulha, cargas de profundidade e embarcações equipadas com sonar. Os esforços para melhorar esses sistemas incluem o emprego de navios menores e ágeis e a experimentação com tecnologia nacional. Essas capacidades se concentram em defender as águas costeiras e contrapor possíveis incursões submarinas de adversários, garantindo a segurança marítima junto à sua costa."
 NKO_infiltration_by_sea:0 "Infiltração por Mar"
 NKO_infiltration_by_sea_desc:0 "A estratégia de infiltração marítima da Coreia do Norte aproveita sua frota de embarcações pequenas e rápidas, submarinos e semissubmersíveis para conduzir operações encobertas. Esses ativos permitem o transporte de forças especiais e equipamentos, muitas vezes sem serem detectados, para reconhecimento, sabotagem ou guerra não convencional. Essa abordagem ressalta a ênfase norte-coreana em táticas assimétricas para explorar vulnerabilidades ao longo do litoral inimigo."
 NKO_submarine_development:0 "Desenvolvimento de Submarinos"
 NKO_submarine_development_desc: ""
 NKO_upgrade_shipyards:0 "Modernizar os Estaleiros"
 NKO_upgrade_shipyards_desc:0 "O desenvolvimento de submarinos da Coreia do Norte foca em expandir sua frota com embarcações convencionais e estratégicas, incluindo submarinos de mísseis balísticos (SLBMs) como a classe Sinpo. Esse programa ressalta a ambição do país de estabelecer uma dissuasão submarina crível, aumentando a furtividade e a capacidade de sobrevivência em sua estratégia nuclear. Com uma combinação de projetos nacionais e a modernização de modelos mais antigos, a Coreia do Norte prioriza capacidades navais assimétricas para reforçar sua defesa e alcance estratégico."
 NKO_expand_bases:0 "Expandir as Bases"
 NKO_expand_bases_desc:0 "A estratégia da Coreia do Norte de expandir suas bases militares reflete seu foco em reforçar a defesa e a prontidão. Isso inclui modernizar instalações existentes, construir novos abrigos subterrâneos e aprimorar centros logísticos para apoiar suas forças. A expansão das bases visa melhorar a eficiência do emprego de tropas, proteger ativos críticos e fornecer profundidade estratégica, garantindo a sobrevivência diante de possíveis ataques e projetando poder em pontos estratégicos importantes. Esses desenvolvimentos também visam apoiar avanços em sistemas de mísseis, submarinos e outros equipamentos militares."
 NKO_green_water_navy:0 "Marinha de Águas Verdes"
 NKO_green_water_navy_desc:0 "O desenvolvimento de uma marinha de águas verdes pela Coreia do Norte foca em estender seu alcance operacional além das águas costeiras, até os mares regionais. Essa estratégia envolve o emprego de pequenas fragatas, corvetas e lanchas de mísseis, além de esforços para aprimorar as capacidades submarinas. O objetivo é proteger reivindicações territoriais, apoiar estratégias de guerra assimétrica e projetar poder limitado em águas regionais, particularmente no Mar Amarelo e no Mar do Japão. Essa abordagem ressalta a ambição norte-coreana de equilibrar uma modernização de custo eficiente com seus objetivos militares estratégicos."
 NKO_revolutionary_military_spirit:0 "Espírito Militar Revolucionário"
 NKO_revolutionary_military_spirit_desc:0 "O conceito norte-coreano de \"Espírito Militar Revolucionário\" é uma ideologia central que enfatiza lealdade inabalável, disciplina e compromisso com o Estado e sua liderança. Serve como estrutura motivacional para as forças armadas, incentivando resiliência, autossuficiência e disposição para o sacrifício diante da adversidade. Este Espírito Nacional sustenta a cultura militar da nação, fomentando a unidade e a determinação para alcançar objetivos estratégicos apesar dos desafios econômicos e tecnológicos. Reflete a integração da ideologia política com a estratégia militar como força motriz das iniciativas de defesa da Coreia do Norte."
 NKO_expand_peasant_militia:0 "Expandir a Milícia Camponesa"
 NKO_domestic_naval_strategy:0 "Estratégia Naval Nacional"
 NKO_domestic_naval_strategy_desc:0 "Lançar as bases de uma doutrina naval moderna. Cada ramo do programa   submarinos, lanchas de mísseis, defesa costeira e operações especiais   receberá sua parcela de recursos para iniciar o desenvolvimento."
 NKO_domestic_submarine_program:0 "Programa Nacional de Submarinos"
 NKO_domestic_submarine_program_desc:0 "Concentrar os esforços do birô na construção de submarinos nacionais. A produção refinada de cascos e o treinamento intensificado de tripulações nos darão o braço de ataque silencioso de que precisamos para ameaçar inimigos longe de nossa costa."
 NKO_domestic_destroyer_buildup:0 "Expansão Nacional de Contratorpedeiros"
 NKO_domestic_destroyer_buildup_desc:0 "Produzir em massa lanchas de mísseis e pequenos combatentes de superfície para enxamear as frotas inimigas em águas costeiras. Nossos estaleiros podem lançar cascos mais rápido do que o Sul pode empregar contratorpedeiros pesados."
 NKO_destroyer_unleashed:0 "Contratorpedeiro Desencadeado"
 NKO_destroyer_unleashed_desc:0 "Pôr em campo uma nova geração de contratorpedeiros equipados com canhões mais pesados e baterias antiaéreas dedicadas. A frota finalmente poderá disputar combates em águas azuis em vez de se esconder ao longo da costa."
 NKO_navy_projects:0 "Projetos da Marinha Norte-Coreana"
 NKO_navy_projects_desc:0 "O foco §YModernização Naval§! abre este programa. Ganhe Pontos de Expansão Naval com as decisões de financiamento, estaleiro e impulso Juche, e depois gaste-os nas trilhas §HForça Submarina§!, §HFlotilhas de Lanchas de Mísseis§!, §HRede de Defesa Costeira§! e §HOperações Especiais Navais§! até que as quatro alcancem §Y100§!."
 NKO_expand_peasant_militia_desc:0 "A expansão da Milícia Camponesa da Coreia do Norte, conhecida como Guardas Vermelhos Operário-Camponeses, é um movimento estratégico para reforçar a defesa nacional por meio da mobilização em massa. Essa força paramilitar, composta por civis, tem a tarefa de complementar as operações militares regulares, defender as comunidades locais e garantir a segurança interna. Os esforços de expansão incluem mais treinamento, equipar os membros da milícia com armas leves e integrá-los a exercícios militares mais amplos. Essa abordagem reflete o foco norte-coreano na guerra assimétrica e em sua estratégia de \"defesa de todo o povo\", garantindo uma força grande e descentralizada capaz de resistir a ameaças externas e manter a estabilidade interna."
 NKO_bolster_young_red_guards:0 "Reforçar os Jovens Guardas Vermelhos"
 NKO_bolster_young_red_guards_desc:0 "Reforçar os Jovens Guardas Vermelhos, a organização paramilitar juvenil da Coreia do Norte, é uma iniciativa-chave destinada a incutir lealdade ideológica e prontidão militar em sua população mais jovem. Isso envolve aprimorar o treinamento militar, a educação política e o condicionamento físico dos estudantes, frequentemente integrando-os a exercícios de defesa nacional. Ao equipar os Jovens Guardas Vermelhos com armamento básico e habilidades de sobrevivência, a Coreia do Norte garante um fluxo constante de indivíduos ideologicamente comprometidos e prontos para o combate, que podem apoiar as forças armadas regulares em tempos de conflito. Essa iniciativa ressalta a dependência do regime da mobilização juvenil como parte de sua estratégia de \"defesa de todo o povo\"."
 NKO_rebuild_sso:0 "Reforma das Forças Especiais"
 NKO_rebuild_sso_desc:0 "A reforma das Forças Especiais da Coreia do Norte foca em modernizar e aprimorar as capacidades de suas unidades de elite para conduzir guerra assimétrica, operações não convencionais e missões de resposta rápida. Essa reforma inclui melhorar os regimes de treinamento, incorporar táticas avançadas e equipar as forças com armamento e sistemas de comunicação modernos. As Forças Especiais são projetadas para se destacar em infiltração, sabotagem, reconhecimento e ação direta, frequentemente visando ativos estratégicos ou infraestruturas críticas. As reformas visam aumentar sua eficácia em conflitos regionais, reforçar a dissuasão e manter a prontidão para uma variedade de missões de alto risco. Essa ênfase reflete a dependência estratégica norte-coreana de unidades altamente qualificadas e ágeis para compensar limitações militares convencionais."
 NKO_rebuild_kim_il_sung_military_university:0 "Reconstruir a Universidade Militar Kim Il-sung"
 NKO_rebuild_kim_il_sung_military_university_desc:0 "A Universidade Militar Kim Il-sung, importante instituição nacional de defesa em Pyongyang, reúne desde 1952 grande número dos melhores comandantes do país. À medida que entramos no novo século, as instalações antigas dessa universidade tornam-se cada vez mais inadequadas ao novo estilo de guerra. É hora de restaurar essa instituição à sua antiga glória."
 NKO_revolutionary_spirits:0 "Espírito Militar Revolucionário"
 NKO_the_green_water_navy:0 "A Marinha de Águas Verdes"
 NKO_the_green_water_navy_desc:0 "Este espírito nacional será §YAprimorado§! se concluirmos os focos de §HModernização Naval§!. \n§W--------------§!\nUma marinha de águas verdes é uma força marítima capaz de operar nas zonas litorâneas de seu Estado e com competência limitada para operar nos mares marginais circundantes. É um termo relativamente novo, criado para distinguir melhor, e dar nuance a, dois descritores antigos: marinha de águas azuis (águas profundas dos oceanos abertos) e marinha de águas marrons (águas litorâneas e próximas à costa)."
 NKO_the_blue_water_navy:0 "A Marinha de Águas Azuis"
 NKO_the_blue_water_navy_desc:0 "Anos de expansão de estaleiros, reforma doutrinária e exercícios conjuntos transformaram nossa frota de uma força costeira numa verdadeira marinha oceânica. Agora podemos zarpar muito além de nossas costas, com tripulações e cascos à altura de qualquer rival da região.\n§W--------------§!\nUma marinha de águas azuis é uma força marítima capaz de operações sustentadas nas águas profundas dos oceanos abertos, projetando poder muito além de sua costa de origem."
 NKO_planned_economy:0 "Economia Planificada"
 NKO_planned_economy_desc:0 "A Coreia do Norte, oficialmente conhecida como República Popular Democrática da Coreia (RPDC), tem uma economia de comando isolada e rigidamente controlada. Numa economia de comando, a economia é planejada e coordenada centralmente pelo governo, o que a torna um componente padrão de qualquer país comunista."
 NKO_the_38th_parallel:0 "O Paralelo 38"
 NKO_the_38th_parallel_desc:0 "Em julho de 1953, o Acordo de Armistício da Coreia foi assinado entre as duas Coreias e os voluntários chineses, bem como as forças das Nações Unidas, estabelecendo uma zona desmilitarizada baseada no paralelo 38, separando a Coreia do Norte da Coreia do Sul. Essa linha divisória existe há cerca de 50 anos e talvez seja hora de avançar rumo à reunificação, de um modo ou de outro."
 NKO_the_road_to_peace:0 "O Caminho para a Paz?"
 NKO_the_road_to_peace_desc:0 "A \"Política do Sol\" da Coreia do Sul parece demonstrar um desejo sincero de reunificação. Talvez seja hora de os camaradas intercoreanos trabalharem juntos rumo à reunificação."
 NKO_the_road_to_war:0 "O Caminho para a Guerra"
 NKO_the_road_to_war_desc:0 "Os imperialistas dos EUA e seus fantoches sul-coreanos nunca foram, são ou serão capazes de permitir a verdadeira reunificação da Coreia. A reunificação pela força é a verdade eterna."
 NKO_end_six_party_negotiations:0 "Preparar as Armas Nucleares"
 NKO_end_six_party_negotiations_desc:0 "As Conversações a Seis não trouxeram nada além de atraso. Vamos nos levantar da mesa de negociações e colocar nossa dissuasão nuclear em plena prontidão. A Coreia do Sul, o Japão e os Estados Unidos aprenderão que nossa segurança não é algo que lhes caiba barganhar."
 NKO_remilitarize_the_dmz:0 "Remilitarizar a DMZ"
 NKO_remilitarize_the_dmz_desc:0 "Remilitarizar a DMZ marcará uma escalada significativa em nosso conflito com o Sul, mas sem dúvida dará às nossas tropas uma vantagem no conflito que se aproxima."
 NKO_struggle_for_power:0 "A Luta pelo Poder"
 NKO_struggle_for_power_desc:0 "A luta pelo poder entre Kim Jong-un e seu irmão, Kim Jong-nam, foi uma batalha velada pela sucessão dentro da família governante da Coreia do Norte. Após a morte de seu pai, Kim Jong-il, ambos os irmãos eram candidatos em potencial a liderar o regime. Kim Jong-nam, outrora visto como o herdeiro favorito, caiu em desgraça devido às suas críticas públicas ao regime e ao seu exílio em Macau. Enquanto isso, Kim Jong-un, apoiado por elites influentes, consolidou sua posição por meio de alianças estratégicas e expurgos internos. A luta terminou com a ascensão de Kim Jong-un ao poder em 2011, marcada pelo misterioso assassinato de Kim Jong-nam em 2017, que muitos acreditam ter sido orquestrado pelo governo norte-coreano. Esse conflito ressaltou a natureza implacável da dinâmica de poder em um dos regimes mais secretos do mundo."
 NKO_orthodox_successor:0 "O Sucessor Ortodoxo"
 NKO_orthodox_successor_desc:0 "Na década de 1990, Kim Jong-un foi escolhido pelo grande General Kim Jong-il como sucessor ao poder por suas qualificações excepcionais. O amado camarada Kim Jong-un, a quem Deus deu ao povo coreano no passado, no presente e no futuro, protegerá sempre a segurança e a prosperidade da Coreia Juche."
 NKO_promote_self_reliance:0 "Promover a Autossuficiência"
 NKO_promote_self_reliance_desc:0 "Um país nunca pode ser rico e forte dependendo dos outros; somente sendo autossuficiente ele pode ser forte!"
 NKO_ostracize_kim_jong_nam:0 "Ostracizar Kim Jong-nam"
 NKO_ostracize_kim_jong_nam_desc:0 "Ao ostracizar Kim Jong-nam, para fazer o \"pai\" desconfiar ainda mais dele, temos maior possibilidade de conquistar o poder."
 NKO_bribe_kpa_seniors:0 "Subornar os Veteranos do KPA"
 NKO_bribe_kpa_seniors_desc:0 "Os generais do KPA são os que detêm o poder militar, e contar com o apoio desses veteranos tem mais chance de nos colocar no controle."
 NKO_oppose_to_chinese_reform_road:0 "Opor-se Abertamente ao Caminho de Reforma Chinês"
 NKO_oppose_to_chinese_reform_road_desc:0 "O modelo de reforma da China decorre de seu modelo de liderança coletiva. Se essa abordagem fosse transposta para a Coreia do Norte, levaria inevitavelmente ao caos social. E o \"pai\" também não a apoia. Para que a linhagem do Monte Baekdu continue, devemos nos opor abertamente ao uso do modelo chinês de reforma."
 NKO_discredit_jang_seong_taek:0 "Desacreditar Jang Seong-taek"
 NKO_discredit_jang_seong_taek_desc:0 "Jang Seong-taek é uma conhecida figura da facção pró-China na Coreia do Norte e também popular ao lado do pai. Tal traidor, que vendeu os interesses da nação, não deve ser tolerado. Para conquistar o poder com sucesso, temos de reunir provas de sua culpa e denunciá-lo perante o Pai."
 NKO_call_for_change:0 "O Chamado à Mudança"
 NKO_call_for_change_desc:0 "A RPDC opera sob uma economia planificada há quase 50 anos. Mas a sucessão das \"Revoluções de 1989\" e da \"Marcha Árdua\" provou que a economia planificada pelo Estado já não era adequada ao novo século. Uma reforma ousada e profunda é necessária para que a Coreia do Norte volte a ser forte."
 NKO_pull_in_young_military_officers:0 "Atrair Jovens Oficiais Militares"
 NKO_pull_in_young_military_officers_desc:0 "Atrair jovens oficiais de mente aberta do KPA não nos fará mal algum, pois estão mais próximos da tropa e serão mais favoráveis ao nosso controle sobre as tropas."
 NKO_frame_opposition:0 "Incriminar a Oposição"
 NKO_frame_opposition_desc:0 "A estratégia para incriminar Kim Jong-un envolve retratá-lo como uma força imprudente e desestabilizadora dentro da liderança norte-coreana. Ao destacar seus expurgos agressivos, sua tomada de decisões volátil e sua falta de traquejo diplomático, podemos posicioná-lo como um perigo tanto à estabilidade do regime quanto à segurança regional. Essa narrativa contrastará suas ações com uma visão de liderança estável e racional, enfatizando a necessidade de uma figura mais equilibrada e palatável internacionalmente. Por meio de narrativas cuidadosamente elaboradas, mensagens direcionadas e do uso de relatos de pessoas de dentro, o objetivo é minar sua credibilidade e influenciar a opinião pública interna e internacional."
 NKO_stir_up_father_son_relations:0 "Atiçar o Conflito entre Pai e Filho"
 NKO_stir_up_father_son_relations_desc:0 "Não será fácil atiçar o conflito entre Kim Jong-un e Kim Jong-il, mas nos dará mais apoio."
 NKO_place_loyalists_in_kpa:0 "Colocar os Leais no KPA"
 NKO_place_loyalists_in_kpa_desc:0 "Há vinte anos, quando tanto Kim Jong-il quanto seu meio-irmão tiveram a oportunidade de assumir a liderança da Coreia do Norte, o apoio dos velhos guerrilheiros a Kim Jong-il foi um fator-chave para sua eventual eleição como líder supremo do país. Agora que o Exército Popular da Coreia herdou essa posição, coloquemos os leais no KPA e aumentemos nosso controle sobre ele."
 NKO_finding_reformist_of_party:0 "Encontrar os Reformistas do Partido"
 NKO_finding_reformist_of_party_desc:0 "Não é que não existam reformistas no partido, mas eles têm medo de falar diante da oposição de Kim Jong Il; se obtivermos seu apoio, será mais provável que mudemos a Chosun"
 NKO_power_struggle:0 "Luta pelo Poder"
 NKO_power_struggle_desc:0 "Mais cedo ou mais tarde, o grande líder da Coreia do Norte hoje, o Camarada Kim Jong-il, morrerá e seu sucessor será, sem dúvida, um de seus dois filhos, Kim Jong-nam ou Kim Jong-un. Mas \"um país não pode ter dois senhores\", e ambos precisam encontrar maneiras de ganhar a confiança do pai. Apoiar um candidato em detrimento do outro até que um sucessor seja escolhido fará com que £stability_texticon §YEstabilidade§! seja perdida.\n\nSe não tivermos mais de 45% de £stability_texticon §YEstabilidade§!, a Junta buscará tomar o poder assim que Kim Jong-il morrer.\n\n£stability_texticon §YEstabilidade§! atual: [?NKO.stability|1%]\n\nAtualmente,\nOrtodoxia de §OKim Jong-un§!: §Y[?ROOT.NKO_kim_jong_un]%§!\nOrtodoxia de §GKim Jong-nam§!: §Y[?ROOT.NKO_kim_jong_nam]%§!\n\n§YO Sucessor Escolhido por Kim Jong-il§!: [ROOT.GetChosenSuccessor]\n§ROSucessor Atual Mais Provável§!: [ROOT.GetSuccessor]\n\nNosso Líder, §YKim Jong Il§!, pode não viver para ver 2012, portanto esteja preparado para escolher um sucessor em §Y2011§!"
 NKO_1_increase_kim_jong_un_tt:0 "O Apoio a Kim Jong-un §Yaumenta§! em 1%"
 NKO_2_increase_kim_jong_nam_tt:0 "O Apoio a Kim Jong-nam §Yaumenta§! em 2%"
 NKO_3_increase_kim_jong_un_tt:0 "O Apoio a Kim Jong-un §Yaumenta§! em 3%"
 NKO_3_increase_kim_jong_nam_tt:0 "O Apoio a Kim Jong-nam §Yaumenta§! em 3%"
 NKO_2_5_increase_kim_jong_un_tt:0 "O Apoio a Kim Jong-un §Yaumenta§! em 2% ~ 5%"
 NKO_2_5_increase_kim_jong_nam_tt:0 "O Apoio a Kim Jong-nam §Yaumenta§! em 2% ~ 5%"
 NKO_5_decrease_kim_jong_un_tt:0 "O Apoio a Kim Jong-un §Ydiminui§! em 5%"
 NKO_2_decrease_kim_jong_nam_tt:0 "O Apoio a Kim Jong-nam §Ydiminui§! em 2%"
 NKO_3_decrease_kim_jong_un_tt:0 "O Apoio a Kim Jong-un §Ydiminui§! em 3%"
 NKO_4_increase_kim_jong_nam_tt:0 "O Apoio a Kim Jong-nam §Yaumenta§! em 4%"
 NKO_5_increase_kim_jong_nam_tt:0 "O Apoio a Kim Jong-nam §Yaumenta§! em 5%"
 NKO_kim_jong_il_death:0 "A Morte de Kim Jong-il"
 NKO_kim_jong_il_death_desc:0 "\n--------------\nEste Foco será §YDesbloqueado§! às §Y8h30 de 17 de dezembro de 2011§!. O amado Grande Líder, fundador da República Popular Democrática da Coreia e Presidente eterno da República, Kim Jong-il, morreu às 8h30 de 17 de dezembro de 2011 de infarto agudo do miocárdio complicado por choque cardiogênico, enquanto viajava de trem para visitar uma região local."
 NKO_junta:0 "Golpe da Junta"
 NKO_junta_desc:0 "As reformas bem-sucedidas na China e no Vietnã nos deram um bom exemplo, mas suas reformas não foram tranquilas. Se nossas próprias reformas tivessem fracassado, teríamos morrido e sido anexados pelo Sul. E tanto Kim Jong-un quanto Kim Jong-nam querem diferentes níveis de reforma. Teremos de fazer a escolha mais difícil para não perder nosso país nem nosso partido..."
 NKO_preserve_songun:0 "Preservar o Songun"
 NKO_preserve_songun_desc:0 "O Songun é o alicerce do exército e devemos defender sua ideologia."
 NKO_entrench_military_authority:0 "Entrincheirar a Autoridade Militar"
 NKO_entrench_military_authority_desc:0 "Embora tenhamos usado o exército para tomar o poder da dinastia Kim, ainda há alguns leais aos Kim dentro do exército; usaremos nossos \"meios\" para convencê-los..."
 NKO_smash_black_market:0 "Esmagar o \"Mercado\""
 NKO_smash_black_market_desc:0 "As forças do \"mercado\" estão causando grande dano ao nosso país e devem ser detidas imediatamente!"
 NKO_determining_the_loyalty_of_army:0 "Determinar a Lealdade do Exército"
 NKO_determining_the_loyalty_of_army_desc:0 "Agora podemos promover alguns de nossos leais e torná-los mais subservientes a nós."
 NKO_purge_dissenters:0 "Expurgar os Dissidentes"
 NKO_purge_dissenters_desc:0 "Para manter a estabilidade do país neste momento crítico de transição de poder, devemos prender imediatamente todos os possíveis dissidentes!"
 NKO_crush_the_kims:0 "Execução dos Kim"
 NKO_crush_the_kims_desc:0 "Manter os filhos de Kim Jong-il vivos é, em última análise, um fator desestabilizador; executemo-los em segredo!"
 NKO_constrain_the_donju:0 "Conter os Donju"
 NKO_constrain_the_donju_desc:0 "Os Donju já deram uma pequena contribuição ao desenvolvimento econômico de nosso país; mantenham-nos ativos..."
 NKO_end_the_donju:0 "Repressão ao Contrabando"
 NKO_end_the_donju_desc:0 "O contrabando é crime grave e, apesar de sua contribuição à economia do país, é hora de eliminar esses infratores de uma vez por todas."
 NKO_high_pressure_politics:0 "Política de Alta Pressão"
 NKO_high_pressure_politics_desc:0 "O descontentamento popular cresceu a tal ponto que devemos usar meios contundentes para manter nosso governo."
 NKO_empower_the_state_security_department:0 "Fortalecer o Birô Geral de Reconhecimento"
 NKO_empower_the_state_security_department_desc:0 "Agora precisamos autorizar o Birô Geral de Reconhecimento militar a assumir maiores responsabilidades e se tornar a agência de inteligência dominante do país. O Birô Geral de Reconhecimento detectará, prenderá e eliminará possíveis sabotadores e espiões imperialistas."
 NKO_chi_military_support:0 "Apoio Militar Chinês"
 NKO_chi_military_support_desc:0 "A China é nosso irmão e aliado eterno. Para sobreviver na arena internacional, estaremos mais uma vez nos braços de Pequim."
 NKO_chi_invest_resources:0 "Assistência na Extração de Recursos"
 NKO_chi_invest_resources_desc:0 "Estamos prontos para permitir a entrada de empresas chinesas de recursos em nosso território"
 NKO_chi_banks:0 "Bancos Chineses"
 NKO_chi_banks_desc:0 "Estamos prontos para permitir a entrada de bancos chineses em nosso país"
 NKO_chi_help_factories:0 "Fábricas Chinesas"
 NKO_chi_help_factories_desc:0 "Pretendemos pedir ao governo chinês ajuda na construção de novas fábricas em nosso território"
 NKO_chi_huawei:0 "Cooperação com a Huawei"
 NKO_chi_huawei_desc:0 "A Huawei Corporation é uma das mais famosas do mundo e queremos que o governo chinês permita que ela opere em nosso território"
 NKO_military_collectives:0 "Governo da Junta"
 NKO_military_collectives_desc:0 "Nosso povo não está pronto para abraçar o Ocidente; precisamos continuar mantendo nosso governo."
 NKO_encourage_private_enterprise:0 "Incentivar a Iniciativa Privada"
 NKO_encourage_private_enterprise_desc:0 "Private entrepreneurship is the future engine of our economy's progress, and we intend to encourage them"
 NKO_market_based_economy:0 "Economia de Mercado"
 NKO_market_based_economy_desc:0 "Nosso sistema econômico nos trouxe apenas problemas e crises constantes; é hora de mudar isso"
 NKO_reorganising_government:0 "Reorganizar o Governo"
 NKO_reorganising_government_desc:0 "É hora de reorganizar o governo; o país precisa de um novo governo."
 NKO_kim_jong_un: "Kim Jong-un"
 NKO_kim_jong_un_desc:0 "Como sucessor de Kim Jong-il, em quem foram depositadas grandes esperanças, Kim Jong-un espera fazer reformas econômicas adequadas para impulsionar a economia do país enquanto este está estável e unido. No entanto, ele não quer perder seu firme controle do poder e seu elevado status de \"linhagem do Monte Baekdu\"..."
 NKO_consolidate_power:0 "Consolidar o Poder"
 NKO_consolidate_power_desc: ""
 NKO_light_industry_develop:0 "Desenvolver a Indústria Leve"
 NKO_light_industry_develop_desc: ""
 NKO_criticize_ineptitude:0 "Criticar a Inépcia"
 NKO_criticize_ineptitude_desc: ""
 NKO_improvement_of_people_live:0 "Melhoria da Vida do Povo"
 NKO_improvement_of_people_live_desc: ""
 NKO_people_support:0 "Apoio do Povo"
 NKO_people_support_desc: ""
 NKO_centralize_power:0 "Centralizar o Poder"
 NKO_centralize_power_desc: ""
 NKO_root_out_corruption:0 "Erradicar a Corrupção"
 NKO_root_out_corruption_desc: ""
 NKO_formalize_power_structures:0 "Formalizar as Estruturas de Poder"
 NKO_formalize_power_structures_desc: ""
 NKO_assassinate_kim_jong_nam:0 "Assassinar Kim Jong-nam"
 NKO_assassinate_kim_jong_nam_desc:0 "Kim Jong-nam será sempre uma ameaça à estabilidade de nosso regime enquanto não estiver morto; eliminem-no a qualquer custo."
 NKO_appoint_loyalists:0 "Nomear Leais"
 NKO_appoint_loyalists_desc: ""
 NKO_civilian_control_of_the_economy:0 "Controle Civil da Economia"
 NKO_civilian_control_of_the_economy_desc: ""
 NKO_party_state_army:0 "Partido, Estado, Exército"
 NKO_party_state_army_desc: ""
 NKO_party_unchecked:0 "O Partido Eterno"
 NKO_party_unchecked_desc: ""
 NKO_eternal_juche_sasang:0 "Juche Sasang Eterno"
 NKO_eternal_juche_sasang_desc: ""
 NKO_kim_jong_nam: "Kim Jong-nam"
 NKO_kim_jong_nam_desc:0 "Kim Jong-nam, o filho mais velho de Kim Jong-il, há muito é uma figura controversa na política norte-coreana. Outrora considerado o herdeiro aparente, suas críticas públicas ao regime e o exílio subsequente fizeram dele um símbolo de dissidência. Defendendo reformas econômicas e o engajamento com a comunidade internacional, a visão de Kim Jong-nam contrasta fortemente com a abordagem tradicionalista de seu irmão mais novo, Kim Jong-un. Seu retorno à Coreia do Norte poderia sinalizar uma mudança rumo a políticas mais abertas e um potencial desafio à ordem estabelecida."
 NKO_face_world:0 "Encarar o Mundo"
 NKO_face_world_desc:0 "A reforma institucional do país não pode ser alcançada sem apoio externo, e por isso precisamos focar no aspecto diplomático do governo e ter boas relações com o mundo."
 NKO_diplomatic_overtures:0 "Estabelecer Relações Diplomáticas com Países"
 NKO_diplomatic_overtures_desc:0 "O segundo passo da diplomacia norte-coreana é o estabelecimento de relações diplomáticas formais com vários países, o que facilitará o caminho da reforma no país."
 NKO_step_up_joint_ventures:0 "Convidar Mais Joint Ventures"
 NKO_step_up_joint_ventures_desc:0 "O investimento estrangeiro é um canal para ajudar a reformar nossa economia, e o recebemos bem."
 NKO_embrace_the_people:0 "Abraçar o Povo"
 NKO_embrace_the_people_desc:0 "Nosso país não pode permanecer fechado para sempre. É hora de abrir nossos braços, abraçar nosso povo e criar uma Coreia do Norte diferente."
 NKO_loosen_information_monopoly:0 "Afrouxar o Monopólio da Informação"
 NKO_loosen_information_monopoly_desc:0 "O povo é livre para expressar suas opiniões."
 NKO_tone_down_propaganda:0 "Divulgação Oficial Reduzida"
 NKO_tone_down_propaganda_desc:0 "Embora a mídia oficial costumasse encarnar a vontade do Estado, nossas reformas democratizantes não precisam impor a \"democracia\" a ela agora."
 NKO_end_forced_labor:0 "Acabar com o Trabalho Forçado"
 NKO_end_forced_labor_desc:0 "Chega de trabalho forçado, e seguimos rumo ao mundo aberto."
 NKO_expand_sezs:0 "Expandir as ZEEs"
 NKO_expand_sezs_desc:0 "Não podemos reformar nossa economia sem a ajuda das zonas econômicas especiais de Raseon e Kaesong, e podemos estabelecer mais zonas econômicas especiais para que algumas pessoas possam enriquecer primeiro."
 NKO_end_juche:0 "Acabar com o Juche"
 NKO_end_juche_desc:0 "O Juche não é uma panaceia; precisamos de um modelo de orientação mais científico."
 NKO_foreign_knowledge:0 "Talentos de Pesquisa Externos"
 NKO_foreign_knowledge_desc:0 "A RPDC perdeu muitos talentos por causa de suas políticas opressivas nas últimas décadas e, para preencher essa lacuna de talentos, poderíamos contar com alguns pesquisadores externos."
 NKO_join_the_wto:0 "Ingressar na OMC"
 NKO_join_the_wto_desc:0 "Por tempo demais fomos excluídos dos benefícios do comércio global compartilhados pelos membros da Organização Mundial do Comércio. Agora que vamos mudar isso, podemos fazer melhor uso dos mecanismos da ordem econômica liberal ocidental a serviço de nossas reformas."
 NKO_preserve_the_party:0 "Manter a Liderança do Partido dos Trabalhadores"
 NKO_preserve_the_party_desc:0 "Reforma e abertura não significam o fim da liderança do Partido dos Trabalhadores, que pode conduzir o povo a um futuro brilhante e próspero."
 NKO_appeal_to_the_youth:0 "Apelar à Juventude"
 NKO_appeal_to_the_youth_desc:0 "É a juventude a espinha dorsal de nossa reforma."
 NKO_the_choson_dream:0 "O Sonho Choson"
 NKO_the_choson_dream_desc:0 "O \"Sonho Choson\" é um novo conceito introduzido pelo presidente [NKO.GetLeader] , que encapsula os objetivos pessoais e nacionais da nação coreana. Abrange aspirações em muitos campos diferentes, incluindo as esferas econômica, política e internacional."
 NKO_democracy_with_north_characteristics:0 "Democracia com Características Norte-Coreanas"
 NKO_democracy_with_north_characteristics_desc:0 "A democracia de estilo ocidental não é totalmente adequada à RPDC, e a RPDC precisa de sua própria democracia com características da RPDC."
 NKO_people_before_party:0 "O Povo Antes do Partido"
 NKO_people_before_party_desc:0 "O povo é o senhor de seu país!"
 NKO_elections:0 "Eleições Locais"
 NKO_elections_desc:0 "Nossas reformas incluem a democratização do sistema político, e o povo terá o poder de escolher os líderes que quiser."
 NKO_free_expression:0 "Liberdade de Expressão"
 NKO_free_expression_desc:0 "O povo da Coreia do Norte foi suprimido por tempo demais sob políticas opressivas, e a principal liberdade concedida ao povo é a liberdade de expressão."
 NKO_byungjin: "Byungjin"
 NKO_byungjin_desc:0 "Durante a Marcha Árdua, o sábio General Kim Jong-il manteve nosso país à tona ao adotar a política \"Songun\" para preservar sua estabilidade. Mas agora que a economia do país se recuperou, é hora de abandonar a velha abordagem centrada no militar e desenvolver nossas forças armadas e nossa economia em conjunto!"
 NKO_scale_back_spending:0 "Reduzir os Gastos do Governo"
 NKO_scale_back_spending_desc: ""
 NKO_encourage_consumption:0 "Incentivar o Consumo"
 NKO_encourage_consumption_desc: ""
 NKO_loosen_grip_on_soes:0 "Afrouxar o Controle sobre as Estatais"
 NKO_loosen_grip_on_soes_desc: ""
 NKO_state_owned_enterprises_competition:0 "Concorrência das Empresas Estatais"
 NKO_state_owned_enterprises_competition_desc: ""
 NKO_resorts_and_tourism:0 "Resorts e Turismo"
 NKO_resorts_and_tourism_desc:0 "Com as sanções internacionais, temos poucas formas de acessar moeda estrangeira. Fortaleçamos o turismo e deixemos que pessoas do mundo inteiro venham ver a beleza da Coreia do Norte!"
 NKO_samjiyon: "Samjiyon"
 NKO_samjiyon_desc:0 "Samjiyon é nosso grande santuário revolucionário na Coreia do Norte. Tem status semelhante ao de Yan'an na China. Devemos trabalhar duro para desenvolvê-lo, de modo que as pessoas possam receber mais educação patriótica."
 NKO_incentive_based_economy:0 "Economia Baseada em Incentivos"
 NKO_incentive_based_economy_desc:0 "Afrouxar o controle central sobre as empresas deu resultados. Ao deixar que os gerentes recompensem a produtividade e fiquem com parte da produção, o Estado aproveita o interesse próprio a serviço do crescimento sem abandonar os postos de comando da economia."
 NKO_empower_the_donju:0 "Fortalecer os Donju"
 NKO_empower_the_donju_desc:0 "Embora o país não possa depender excessivamente do mundo exterior para seu desenvolvimento, sem os Donju nossa economia seria insustentável. Deem-lhes mais direitos em favor do comércio, deixem-nos ser os líderes da economia nacional e deixem o cavalo de mil léguas da economia coreana correr!"
 NKO_weaken_the_donju:0 "Enfraquecer os Donju"
 NKO_weaken_the_donju_desc:0 "Rebatizar e revender produtos chineses e sul-coreanos não enriqueceu nosso país. Precisamos focar em nossas próprias marcas industriais e deixar que as marcas norte-coreanas alcancem o topo do mercado mundial!"
 NKO_protect_state_owned_business:0 "Proteger as Empresas Estatais"
 NKO_protect_state_owned_business_desc: ""
 NKO_encourage_foreign_investment:0 "Incentivar o Investimento Estrangeiro"
 NKO_encourage_foreign_investment_desc:0 "Por mais resilientes que sejam nossas indústrias nacionais, todo o seu potencial econômico não pode ser liberado sem investimento do exterior. Devemos oferecer incentivos para estimular o investimento estrangeiro direto em nossa nação."
 NKO_privatize_means_of_production:0 "Privatizar os Meios de Produção"
 NKO_privatize_means_of_production_desc: ""
 NKO_economy_revival:0 "Renascimento Econômico"
 NKO_economy_revival_desc:0 "Com o fim da \"Marcha Árdua\", é hora de fazer nossa economia funcionar de novo."
 NKO_priorit_for_civilian_industry:0 "Foco na Indústria Civil"
 NKO_priorit_for_civilian_industry_desc: ""
 NKO_priorit_for_army_industry:0 "Foco na Indústria Militar"
 NKO_priorit_for_army_industry_desc:0 "A indústria militar é vital para nós, tanto para impulsionar nossa demanda econômica interna quanto para fortalecer nossas forças de defesa."
 NKO_arms_trafficking:0 "Tráfico de Armas"
 NKO_arms_trafficking_desc:0 "Por que deveria haver incontáveis armas empilhadas em armazéns o tempo todo? Poderíamos trocá-las por ouro."
 NKO_sinuiju:0 "Região Administrativa Especial de Sinuiju"
 NKO_sinuiju_desc:0 "Sinuiju sempre foi um importante porto para o comércio entre a Coreia do Norte e a China. Poderíamos seguir a abordagem chinesa de um país, dois sistemas, para torná-la mais adequada ao comércio com países estrangeiros."
 NKO_recognition_of_economic_backwardness:0 "Reconhecimento do Atraso Econômico"
 NKO_recognition_of_economic_backwardness_desc:0 "A economia da Coreia do Norte ficou para trás no tempo depois da \"Marcha Árdua\". Precisamos de reformas radicais"
 NKO_2009_revaluation:0 "Reavaliação Monetária"
 NKO_2009_revaluation_desc:0 "Durante a Marcha Árdua, nossa economia nacional, e em particular nosso sistema monetário, foi duramente atingida. O povo não confiava em nossa moeda e a vida cotidiana chegou a ser repleta de escambo. Para mudar essa situação, precisamos de uma ousada reforma monetária e reavaliação."
 NKO_revaluation_failure:0 "Fracasso da Reavaliação..."
 NKO_revaluation_failure_desc: ""
 NKO_air_koryo: "Air Koryo"
 NKO_air_koryo_desc: ""
 NKO_reform_of_the_privatisation_of_collective_farms:0 "Privatização das Fazendas Coletivas"
 NKO_reform_of_the_privatisation_of_collective_farms_desc:0 "Afrouxamento dos controles sobre as fazendas coletivas locais para aumentar seu incentivo à produção."
 NKO_construction_of_hydraulic_facilities:0 "Construção de Instalações Hidráulicas"
 NKO_construction_of_hydraulic_facilities_desc:0 "Para aumentar a produtividade agrícola sem depender tanto de fertilizantes químicos, precisamos construir mais instalações hidráulicas."
 NKO_free_housing:0 "Moradia Gratuita Extra"
 NKO_free_housing_desc:0 "Construir mais apartamentos para que as pessoas possam arcar com a moradia!"
 NKO_expand_compulsory_education:0 "Expandir a Educação Obrigatória"
 NKO_expand_compulsory_education_desc:0 "A educação é o alicerce de uma nação forte. Expandir a educação obrigatória, dando a mais crianças acesso a níveis mais elevados de ensino."
 NKO_chollima_speed_desc:0 "O desenvolvimento da infraestrutura é um passo importante no caminho da reconstrução de nossa economia, não só para nosso desenvolvimento econômico, mas também para fins militares, como estradas capazes de transportar equipamentos pesados e ferrovias capazes de transportar trens de mísseis."
 NKO_arduous_march:0 "A Marcha Árdua"
 NKO_arduous_march_desc:0 "§RA fome norte-coreana§! foi um período de fome em massa, junto com uma crise econômica geral, a partir de 1994 na Coreia do Norte, também conhecido como a \"Marcha Árdua\"."
 NKO_dmz_remilitarized:0 "DMZ Remilitarizada"
 NKO_dmz_remilitarized_desc:0 "Remilitarizar a DMZ marcará uma escalada significativa em nosso conflito com o Sul, mas sem dúvida dará às nossas tropas uma vantagem no conflito que se aproxima."
 NKO_kor_hostile_action_tt:0 "Não foi antagonizada por ações hostis recentes."
 NKO_broken_juche:0 "O Juche Quebrado"
 NKO_eternal_juche:0 "O Juche Eterno"
 NKO_marxism_leninism:0 "Marxismo-Leninismo"
 NKO_democratic_land:0 "A Terra Democrática"
 NKO_songun_junta: "Songun"
 NKO_songun_junta_desc:0 "O Songun é uma política da Coreia do Norte. Exige que, na política e na economia do país, \"tudo venha primeiro com o KPA\"."
 NKO_self_reliance:0 "Autossuficiência"
 NKO_choson_dream:0 "O Sonho Choson"
 NKO_anti_tatmadaw_sentiment:0 "Sentimento Anti-Exército Popular"
 NKO_anti_tatmadaw_sentiment_desc:0 "Quando o KPA decidiu realizar uma grande reorganização da situação política na Coreia, a hostilidade do povo ao governo militar havia atingido um nível sem precedentes."
 NKO_simhwajo_sageon_legacy:0 "O Legado do Simhwajo Sageon"
 NKO_simhwajo_sageon_legacy_desc:0 "O Simhwajo Sageon é uma campanha de expurgo em massa de Kim Jong-il para remover os homens de seu pai Kim Il-Sung, ocorrida na RPDC entre 1997 e 2000 \nAlguns a chamaram de \"versão norte-coreana do macarthismo\" ou \"versão norte-coreana da Revolução Cultural\""
 NKO_close_dmz:0 "Fechar a DMZ"
 NKO_close_dmz_desc: ""
 NKO_superiority_of_dprk_model:0 "Superioridade do Modelo da RPDC"
 NKO_superiority_of_dprk_model_desc: ""
 NKO_abolish_life_time_system_for_cadres_in_leadership:0 "Abolir o Sistema Vitalício para Quadros na Liderança"
 NKO_abolish_life_time_system_for_cadres_in_leadership_desc: ""
 NKO_allow_donju_to_join_wpk:0 "Permitir que os Donju Ingressem no WPK"
 NKO_allow_donju_to_join_wpk_desc:0 "Os Donju são apenas empresários que fazem negócios legalmente e pagam impostos de acordo com a lei. Por que não podem ingressar no WPK?"
 NKO_kim_jong_un_successor:0 "§YKim Jong-un§! obteve o trono."
 NKO_kim_jong_nam_successor:0 "§YKim Jong-nam§! obteve o trono."
 NKO_chi_propose_trade_agreement_tooltip:0 "Possui acordo comercial com §Y[CHI.GetNameWithFlag]§!\n"
 NKO_russian_friendship:0 "Aliança Russo-Norte-Coreana"
 NKO_russian_friendship_desc:0 "A Rússia sempre foi um de nossos principais aliados, e a URSS está ainda mais envolvida em nosso surgimento e existência. Pretendemos tentar reviver as relações de aliança entre nossos países"
