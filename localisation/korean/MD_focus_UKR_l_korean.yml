 UKR_storage_item_btr50_tt: "§YBTR-50§!\n\n\n£SOV_LAND_BTR_50\n\n\n\n보관 중: §Y[?ukraine_has_btr50_stockpile|0]§!\n세대: 1954년부터 운용된 전후 1세대 궤도식 장갑차.\n장비 유형: §Y1세대 장갑 병력수송차 차체§!\n\n파생형 계열:\n• BTR-50P\n• BTR-50PA\n• BTR-50PK\n• BTR-50PU (지휘형)\n\n§YPT-76§! 차체를 기반으로 만든 궤도식 수륙양용 장갑 병력수송차입니다. 최대 20명의 병력을 태울 수 있습니다."
