 TAI_pc_industry_events.7.t: "Gigabyte and ASUS Join Forces"
 TAI_pc_industry_events.7.d: "Gigabyte and ASUS propose a joint venture to combine branded motherboard and graphics-card operations. Cooperation could widen distribution, while independence would protect Gigabyte's specialist identity or leave room for a riskier systems strategy."
