 SOV_alpha_omon_exp_desc: "Alpha, the FSB's counter-terrorist unit, learned from Beslan that a hostage crisis needs soldiers as well as negotiators. Expanded, it can also be sent to a front."
 SOV_vimpel_omon_exp: "FSB Vympel Group"
 SOV_vimpel_omon_exp_desc: "Vympel was built to sabotage targets abroad and to guard nuclear sites at home. Funding both missions gives the FSB a second special-forces arm."
