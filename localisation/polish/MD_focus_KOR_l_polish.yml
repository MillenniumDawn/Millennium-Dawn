 korea.64.t: "Industrial Productivity Breakthrough"
 korea.64.d: "Years of targeted investment in manufacturing capacity and process efficiency are paying off. South Korean factories are now among the most productive in the world, drawing international recognition and strengthening the political consensus behind the government's economic programme."
 korea.64.a: "Channel the gains into further expansion"
