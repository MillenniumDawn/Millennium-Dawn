 BOS_EUFOR: "欧洲联盟军"
 BOS_EUFOR_desc: "欧盟驻波斯尼亚和黑塞哥维那部队是由欧盟领导的驻波斯尼亚和黑塞哥维那维和部队，接替了驻波黑稳定部队，旨在维护和平与稳定，支持地方当局，并执行结束波斯尼亚战争的《代顿协议》。"
 BOS_SFOR: "联合保护稳定部队"
 BOS_SFOR_desc: "波斯尼亚和黑塞哥维那稳定部队是由北约领导的多国维持和平部队\n§W---------------§!\n波斯尼亚战争结束后，包括世界银行、欧盟、联合国开发计划署和美国国际开发署在内的国际伙伴为波斯尼亚的重建提供了资金。他们的项目重建了基础设施，加强了治理和公共服务，并支持了经济复苏。"
