 INFANTRY_TITLE_WEAPONS: "Armes légères"
 INFANTRY_TITLE_WEAPONS_DESC: "Chaque soldat est avant tout un tireur d'élite. Les armes légères représentent tout, des fusils d'assaut principaux aux avancées en matière de fusils de précision et de pistolets."
