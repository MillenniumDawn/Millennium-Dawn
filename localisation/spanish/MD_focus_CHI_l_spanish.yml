 CHI_TAI_resend_business_deleg_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con la oferta para intercambiar delegaciones empresariales."
 CHI_TAI_resend_transport: "Renovar propuesta de cooperación: Enlaces de transporte"
 CHI_TAI_resend_transport_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con la propuesta de enlaces directos de transporte a través del estrecho."
 CHI_TAI_resend_safeguards: "Renovar propuesta de cooperación: Salvaguardias de inversión"
 CHI_TAI_resend_safeguards_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con el acuerdo de salvaguardias de inversión a través del estrecho."
 CHI_TAI_resend_joint_planning: "Renovar propuesta de cooperación: Planificación industrial"
 CHI_TAI_resend_joint_planning_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con la propuesta de planificación industrial conjunta a través del estrecho."
 CHI_TAI_resend_deep_integration: "Renovar propuesta de cooperación: Integración económica"
 CHI_TAI_resend_deep_integration_desc: "Taipéi rechazó el acercamiento anterior. Dirigirse de nuevo al gobierno de Taiwán con la propuesta de integración económica profunda a través del estrecho."
 CHI_TAI_resend_peaceful_reunification: "Volver a presentar el Acuerdo de Reunificación"
 CHI_TAI_resend_peaceful_reunification_desc: "Taipéi rechazó el marco de reunificación. Darle más tiempo al acuerdo y presentarlo de nuevo a Taiwán."
 CHI_TAI_goodwill_gesture: "Gesto de buena voluntad a través del Estrecho"
 CHI_TAI_goodwill_gesture_desc: "Hacer un gesto público de buena voluntad hacia Taipéi (desde ofertas de ayuda ante catástrofes hasta la relajación de las normativas de viajes y turismo), templando la opinión pública a través del estrecho y aumentando la confianza mutua."
 CHI_TAI_coercive_signaling: "Señales coercitivas"
 CHI_TAI_coercive_signaling_desc: "Manifestar el descontento de Pekín mediante ejercicios militares específicos y presión diplomática. Esto le recuerda a Taipéi la determinación del continente, pero desgasta la confianza a través del estrecho."
