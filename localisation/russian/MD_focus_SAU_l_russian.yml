 SAU_succession_panel_dormant: "Трон занят, и вопрос о престолонаследии не оспаривается. Если трон освободится, принцы и их фракции будут представлены здесь.[ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_named: "Наследный принц назначен: §H[ROOT.GetSAUCrownPrinceName]§!. Конкурс завершен, и соглашение будет действовать ровно столько, сколько будет править король.\n\n§YЗдоровье короля:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race1: "Король Фахд умер, и теперь правит король Абдулла, но он тоже стар, и вопрос престолонаследия остается нерешенным. Три принца претендуют на звание наследника: Салман бин Абдулазиз, знаменосец династии Судаири; Мухаммед бин Найеф, глава служб безопасности; и Мутайб бин Абдулла, командующий Национальной гвардией.\n\nПоддержите одного принца и сплотите вокруг него семью и государство, одновременно подрывая позиции его соперников. Каждая фракция также строит собственные козни, поэтому баланс влияния меняется каждый месяц. После смерти короля Абдаллы на трон восходит принц, обладающий наибольшей долей влияния.\n\n§YСалман бин Абдулазиз:§! [?SAU_salman_share|0]%\n§YМохаммед бин Найеф:§! [?SAU_mbn_share|0]%\n§YМутаиб бин Абдулла:§! [?SAU_mutaib_share|0]%\n\n§YЕсли бы Абдулла умер сегодня, он стал бы наследником престола:§! §H[ROOT.GetSAUCrownFrontrunner]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race2: "Король Салман правит, и борьба сузилась до двух человек за один титул. Мухаммед бин Найеф занимает пост министра внутренних дел, курирует борьбу с терроризмом и пользуется доверием Вашингтона. Мухаммед бин Салман отвечает за экономику, оборону и имеет влияние своего отца, которое в этой семье всегда имело большее значение.\n\nПоддержите одного и сплотите вокруг него государство, подрывая при этом другого. Тот, кто получит большую долю наследства, когда король назначит наследника — или когда он умрет, не назвав его, — займет трон после него.\n\n§YМухаммед бин Салман:§! [?SAU_heir_mbs_share|0]%\n§YМохаммед бин Найеф:§! [?SAU_heir_mbn_share|0]%\n\n§YНаследник престола сегодня:§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§YЗдоровье короля:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
