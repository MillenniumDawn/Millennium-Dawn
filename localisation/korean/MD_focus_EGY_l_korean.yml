 USA_wot_iraqi_freedom: "이라크의 자유 작전이 개시되었다"
 EGY_Foreign_evergreen_trade_category: "에버그린 비료 무역"
 EGY_Foreign_evergreen_trade_category_desc: "우리는 이집트와 에버그린 비료에 대한 독점 공급 계약을 확보했습니다. 이 고급 배합 비료는 우리의 작물 수확량과 농업 생산성을 크게 향상시켰습니다. 이 협정은 식량 안보라는 핵심 부문을 카이로의 정치적 호의에 묶어 두지만, 이집트와의 관계가 악화되거나 대체 비료 공급원을 확보하게 되면 이 계약을 해지할 수 있습니다."
 cancel_EGY_trade_desc: "비료 계약을 해지하면 물량 공급이 중단되고 그로 인한 농업 보너스도 사라지지만, 식량 안보가 이집트의 정치적 영향력에서 벗어나게 됩니다. 이집트에 우리의 결정이 통보됩니다."
 EGY_top_influencer_pal_tt: "§Y[ROOT.GetNameWithFlag]§!이(가) §Y[PAL.GetNameWithFlag]§!에서 가장 큰 외국 영향력의 원천입니다"
 SUEZ_CANAL_BLOCKED: "수에즈 운하 봉쇄"
 Egypt.376.t: "이슬람 국가에 충성을 맹세한 시나이 무장 세력"
 Egypt.376.desc: "시나이 반도에서 가장 위험한 지하디스트 단체인 안사르 바이트 알마크디스가 이슬람 국가에 충성을 맹세하고, 스스로 선포한 칼리파국의 시나이 주인 윌라야트 시나로 이름을 바꿨습니다. 이 단체는 알카에다와의 관계를 끊었으며 이제 이슬람 국가의 깃발 아래 북시나이에서 반란을 이어 갈 것입니다."
 Egypt.376.a: "시나이에서의 전쟁이 새로운 국면에 접어든다."
