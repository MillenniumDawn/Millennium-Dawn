name: Code Standards & Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "common/**"
      - "events/**"
      - "history/**"
      - "localisation/**"
      - "interface/**"
      - "gfx/**"
      # The remaining shipped roots carry no validator of their own, but
      # validate-paths checks every tracked path for cross-platform hazards.
      - "map/**"
      - "music/**"
      - "portraits/**"
      - "sound/**"
      - "descriptions/**"
      - "scenario_tests/**"
      - "tutorial/**"
      - "*.mod"
      # Tooling paths are intentionally absent: the validator jobs gate on
      # detect-changes (content groups), so a tooling-only PR would trigger the
      # workflow but skip every validator, posting an empty report.
      # Changes under tools/ are smoke-tested by tools-validation.yml instead.
      - ".github/workflows/coding-pipeline.yml"
  # Manual re-runs for open PRs (e.g. after main advanced) and the periodic
  # revalidation dispatched by nightly-pr-validation.yml. Dispatched runs are
  # keyed on the PR's head branch (ref), so the same pull_request context is
  # rebuilt from the inputs — see PR_NUMBER/BASE_SHA below.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to validate (nightly revalidation)"
        required: false
        type: string
      base_sha:
        description: "PR base branch sha, for the workspace cache key"
        required: false
        type: string

concurrency:
  # Same group for a push-triggered run and a dispatched run of the same PR:
  # the periodic revalidation cancels an in-flight run instead of doubling it.
  group: >-
    ${{ github.workflow }}-${{ inputs.pr_number ||
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: validator jobs run PR-authored code and only need to read.
# The validation-report job declares its own pull-requests/checks write scope.
permissions:
  contents: read

# Single source of truth for the bundled workspace cache. The cache "version"
# hashes the path list, so the save (prepare-workspace) and every restore must
# use a byte-identical WORKSPACE_PATHS — any drift is a silent 100% miss.
# resources/documentation carries modifiers_documentation.md, the vanilla
# modifier list validate_modifiers.py needs (~4000 names it would otherwise
# false-positive on).
# The bundle key identifies the PR's exact merge tree. workflow_dispatch
# receives the head SHA, so it substitutes the supplied base SHA for the merge
# revision. A head/base pair invalidates the bundle after main moves.
env:
  CHECKOUT_REF: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number &&
    format('refs/pull/{0}/merge', inputs.pr_number) || github.sha }}
  WORKSPACE_KEY: >-
    md-workspace-v2-${{ inputs.pr_number ||
    github.event.pull_request.number }}-${{
    github.event.pull_request.head.sha || github.sha }}-${{
    inputs.base_sha || github.sha }}
  WORKSPACE_PATHS: |
    common
    events
    history
    localisation
    interface
    gfx/flags
    tools
    resources/documentation
    .claude
    CLAUDE.md
    *.mod
    .workspace-manifest
    .validation_cache

jobs:
  # ───────────────────────────────────────────────────────────────
  # Detect which file groups changed so downstream jobs can skip
  # ───────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      common: >-
        ${{ steps.filter.outputs.common ||
        steps.dispatch.outputs.common }}
      events: >-
        ${{ steps.filter.outputs.events ||
        steps.dispatch.outputs.events }}
      history: >-
        ${{ steps.filter.outputs.history ||
        steps.dispatch.outputs.history }}
      localisation: >-
        ${{ steps.filter.outputs.localisation ||
        steps.dispatch.outputs.localisation }}
      ai-strategy: >-
        ${{ steps.filter.outputs.ai-strategy ||
        steps.dispatch.outputs.ai-strategy }}
      ai-navy: >-
        ${{ steps.filter.outputs.ai-navy ||
        steps.dispatch.outputs.ai-navy }}
      ai-equipment: >-
        ${{ steps.filter.outputs.ai-equipment ||
        steps.dispatch.outputs.ai-equipment }}
      factions: >-
        ${{ steps.filter.outputs.factions ||
        steps.dispatch.outputs.factions }}
      oob: >-
        ${{ steps.filter.outputs.oob ||
        steps.dispatch.outputs.oob }}
      decisions: >-
        ${{ steps.filter.outputs.decisions ||
        steps.dispatch.outputs.decisions }}
      scripted-loc: >-
        ${{ steps.filter.outputs.scripted-loc ||
        steps.dispatch.outputs.scripted-loc }}
      scripted-guis: >-
        ${{ steps.filter.outputs.scripted-guis ||
        steps.dispatch.outputs.scripted-guis }}
      interface: >-
        ${{ steps.filter.outputs.interface ||
        steps.dispatch.outputs.interface }}
      national-focus: >-
        ${{ steps.filter.outputs.national-focus ||
        steps.dispatch.outputs.national-focus }}
      on-actions: >-
        ${{ steps.filter.outputs.on-actions ||
        steps.dispatch.outputs.on-actions }}
      scripted-effects: >-
        ${{ steps.filter.outputs.scripted-effects ||
        steps.dispatch.outputs.scripted-effects }}
      style: >-
        ${{ steps.filter.outputs.style ||
        steps.dispatch.outputs.style }}
      # Diff file list — only meaningful on pull_request; dispatch runs have
      # no diff, so the style job is skipped outright (see dispatch step).
      style-files: ${{ steps.filter.outputs.style_files }}
      mod: >-
        ${{ steps.filter.outputs.mod ||
        steps.dispatch.outputs.mod }}
      content: >-
        ${{ steps.filter.outputs.content ||
        steps.dispatch.outputs.content }}
      mios: >-
        ${{ steps.filter.outputs.mios ||
        steps.dispatch.outputs.mios }}
    steps:
      # No checkout — on pull_request events dorny/paths-filter fetches the
      # changed-file list straight from the GitHub API, so cloning the repo
      # just to diff locally is pure overhead.
      - name: Detect changed file groups
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # `style_files` (from list-files: json) carries the changed .txt paths
          # so the style job validates only the diff, not the whole repo. JSON,
          # not shell, so paths with spaces/apostrophes ("Cote D'Ivoire.txt")
          # survive jq parsing instead of being word-split into garbage.
          list-files: json
          filters: |
            common:
              - 'common/**'
            events:
              - 'events/**'
            history:
              - 'history/**'
            localisation:
              - 'localisation/**'
            ai-strategy:
              - 'common/ai_strategy/**'
              - 'common/ai_templates/**'
            ai-navy:
              - 'common/ai_navy/**'
              - 'common/units/**'
            ai-equipment:
              - 'common/ai_equipment/**'
            factions:
              - 'common/factions/**'
            oob:
              - 'history/units/**'
              - 'common/units/**'
              - 'common/ai_templates/**'
              - 'common/scripted_effects/**'
              # Sources of create_equipment_variant, slot-checked against
              # the hull.
              - 'history/countries/**'
              - 'common/national_focus/**'
              - 'events/**'
              - 'common/decisions/**'
              - 'common/special_projects/**'
            decisions:
              - 'common/decisions/**'
            scripted-loc:
              - 'common/scripted_localisation/**'
            scripted-guis:
              - 'common/scripted_guis/**'
            interface:
              - 'interface/**'
            national-focus:
              - 'common/national_focus/**'
            on-actions:
              - 'common/on_actions/**'
            mios:
              - 'common/military_industrial_organization/**'
            scripted-effects:
              - 'common/scripted_effects/**'
            style:
              - 'common/**/*.txt'
              - 'events/**/*.txt'
              - 'history/**/*.txt'
            mod:
              - '*.mod'
            # Union of everything any validator job consumes — gates
            # prepare-workspace so a gfx-only or workflow-only PR doesn't
            # build a ~200MB bundle no job will restore.
            content:
              - 'common/**'
              - 'events/**'
              - 'history/**'
              - 'localisation/**'
              - 'interface/**'
              - '*.mod'

      # workflow_dispatch runs have no PR diff to filter, and paths-filter
      # would need a checkout (plus a base ref) to diff anything — this job
      # deliberately checks out nothing. Treat every group as changed so the
      # full validation set runs; the job outputs above fall back to these.
      - name: Treat all groups as changed on dispatch
        if: github.event_name == 'workflow_dispatch'
        id: dispatch
        run: |
          for out in common events history localisation ai-strategy \
              ai-navy ai-equipment factions oob decisions scripted-loc \
              scripted-guis interface national-focus on-actions \
              scripted-effects mod content mios; do
            echo "$out=true" >> "$GITHUB_OUTPUT"
          done
          # style is diff-scoped (MD_STAGED_FILES from the changed-file
          # list); there is no diff on dispatch, so skip the style job
          # instead of running it against an empty file list.
          echo "style=false" >> "$GITHUB_OUTPUT"

  # ───────────────────────────────────────────────────────────────
  # Prepare workspace — the run's single checkout. Bundles the validated
  # directories plus the shared .validation_cache (warmed on main by
  # validator-cache.yml) into one cache entry that every downstream job
  # restores instead of checking out (~35s checkout → ~5-10s restore).
  # ───────────────────────────────────────────────────────────────
  prepare-workspace:
    name: Prepare Workspace
    needs: [detect-changes]
    if: needs.detect-changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions: read lets the post-save step verify the bundle exists.
      actions: read
    # PR context rebuilt for workflow_dispatch runs (inputs are null on
    # pull_request, the event fields are null on dispatch — the `||` picks
    # whichever is populated).
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # Checkout precedes the cache steps: hashFiles() below needs tools/ on
      # disk. Cone mode also materialises root files (CLAUDE.md, *.mod).
      - name: Checkout code
        id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 1
          sparse-checkout: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            tools
            resources/documentation
            .claude

      # Shared validator disk cache, built on main by validator-cache.yml.
      # The source hash is a cache-generation boundary: a changed validator
      # or parser can only restore a cache from the same generation.
      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**',
          'tools/shared_utils.py') }}" >> "$GITHUB_OUTPUT"

      - name: Restore shared validator disk cache
        id: valcache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{
            inputs.base_sha || github.event.pull_request.base.sha }}
          restore-keys: |
            md-valcache-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      # mkdir guarantees the .validation_cache path exists on a cold restore
      # (a missing path would degrade the bundle for every consumer).
      - name: Write workspace manifest
        run: |
          mkdir -p .validation_cache
          {
            echo "pr=$PR_NUMBER"
            echo "head_sha=$HEAD_SHA"
            echo "merge_sha=${{ steps.checkout.outputs.commit }}"
            echo "run_id=${{ github.run_id }}"
            echo "cache=${{ steps.valcache.outputs.cache-matched-key }}"
          } | tee .workspace-manifest

      # Explicit save (not the combined action's post-job save): the upload
      # completes inside this step, so `needs: prepare-workspace` fully
      # orders save-before-restore for every consumer.
      - name: Save bundled workspace cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.WORKSPACE_PATHS }}
          key: ${{ env.WORKSPACE_KEY }}

      # cache/save only warns on failure. Without this check a failed save
      # leaves this job green while every consumer dies on
      # fail-on-cache-miss, and "Re-run failed jobs" can never recover
      # because the green prepare-workspace won't re-run.
      - name: Verify the bundle exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cache_url="repos/${{ github.repository }}/actions/caches"
          cache_url="${cache_url}?key=$WORKSPACE_KEY&per_page=1"
          count=$(gh api "$cache_url" --jq '.total_count')
          if [ "$count" -eq 0 ]; then
            echo "::error::Workspace bundle ${WORKSPACE_KEY} was not saved"
            exit 1
          fi
          echo "Workspace bundle ${WORKSPACE_KEY} confirmed"

  # ───────────────────────────────────────────────────────────────
  # Style & common-mistakes — diff-scoped to the changed .txt files only,
  # so a PR is flagged for the style it introduced, not the repo-wide
  # backlog. The changed-file list comes from detect-changes (style_files).
  # ───────────────────────────────────────────────────────────────
  styling-check:
    name: Style Check
    needs: [detect-changes, prepare-workspace]
    if: needs.detect-changes.outputs.style == 'true'
    runs-on: ubuntu-latest

    steps:
      # Built by prepare-workspace this run. If eviction broke a "Re-run
      # failed jobs", use "Re-run all jobs" so the bundle is rebuilt.
      - name: Restore prepared workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.WORKSPACE_PATHS }}
          key: ${{ env.WORKSPACE_KEY }}
          fail-on-cache-miss: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Run style check
        env:
          # JSON array of changed .txt files under common/events/history.
          STYLE_FILES_JSON: ${{ needs.detect-changes.outputs.style-files }}
        run: |
          # Newline-delimit the JSON array.
          # Newlines cannot appear in these paths.
          # Drop the files the pre-commit md-validate-style hook also excludes.
          printf '%s' "$STYLE_FILES_JSON" | jq -r '.[]' \
            | grep -vE \
              '(^|/)(Changelog|AUTHORS)\.txt$|/descriptions[^/]*\.txt$' \
            > style_files.txt || true
          if [ ! -s style_files.txt ]; then
            echo "No style-relevant files changed"
            exit 0
          fi
          # validate_style.py reads the diff list from MD_STAGED_FILES.
          # Newline-separated paths keep spaces and apostrophes safe.
          MD_STAGED_FILES="$(cat style_files.txt)" \
            python3 tools/validation/validate_style.py \
              --staged --strict --no-color
          # Feed check_common_mistakes.py NUL-delimited paths through xargs.
          tr '\n' '\0' < style_files.txt | xargs -0 -r \
            python3 tools/linting/check_common_mistakes.py

  # ───────────────────────────────────────────────────────────────
  # Structural lint — file-integrity checks that otherwise only run as
  # local pre-commit hooks. Catches regressions from commits made via the
  # GitHub web UI or with hooks disabled (loc BOM, .mod encoding).
  # ───────────────────────────────────────────────────────────────
  structural-lint:
    name: Structural Lint
    needs: [detect-changes, prepare-workspace]
    if: >-
      needs.detect-changes.outputs.common == 'true' ||
      needs.detect-changes.outputs.events == 'true' ||
      needs.detect-changes.outputs.history == 'true' ||
      needs.detect-changes.outputs.localisation == 'true' ||
      needs.detect-changes.outputs.mod == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Restore prepared workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.WORKSPACE_PATHS }}
          key: ${{ env.WORKSPACE_KEY }}
          fail-on-cache-miss: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Check localisation UTF-8 BOM
        run: python3 tools/linting/validate_localization_encoding.py

      # find, not `git ls-files`: the restored bundle has no .git. Only the
      # root Millennium_Dawn.mod/descriptor.mod are in the bundle (via the
      # `*.mod` cache path); resources/ isn't, so the exclusion is belt-and-
      # braces against future path-list additions.
      - name: Check .mod file encoding
        run: |
          find . -name '*.mod' -not -path './resources/*' -print0 \
            | xargs -0 -r python3 tools/linting/validate_mod_encoding.py

      - name: Check mod descriptor replace_path sync
        run: >-
          python3 tools/validation/validate_mod_descriptors.py --strict
          --no-color

  # ───────────────────────────────────────────────────────────────
  # Core validators — broad scope, run when most game files change
  # ───────────────────────────────────────────────────────────────
  validate-core:
    name: Validate ${{ matrix.validator.title }}
    needs: [detect-changes, prepare-workspace]
    if: >-
      needs.detect-changes.outputs.common == 'true' ||
      needs.detect-changes.outputs.events == 'true' ||
      needs.detect-changes.outputs.history == 'true' ||
      needs.detect-changes.outputs.localisation == 'true' ||
      needs.detect-changes.outputs.interface == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        validator:
          - script: validate_variables.py
            name: variables
            title: "Variables"
          - script: validate_scripted_localisation.py
            name: scripted-localisation
            title: "Scripted Localisation"
          - script: validate_cosmetic_tags.py
            name: cosmetic-tags
            title: "Cosmetic Tags"
          - script: validate_localisation.py
            name: localisation
            title: "Localisation"
          - script: validate_events.py
            name: events
            title: "Events"
          - script: validate_history.py
            name: history-files
            title: "History Files"
          - script: validate_unused_scripted.py
            name: unused-scripted
            title: "Unused Scripted Effects & Triggers"
          - script: validate_agency_upgrades.py
            name: agency-upgrades
            title: "Intelligence Agency Upgrades"
          - script: validate_ideas.py
            name: ideas
            title: "Idea References"
          - script: validate_set_variables.py
            name: set-variables
            title: "Set Variable References"
          - script: validate_defines.py
            name: defines
            title: "Defines"
            # cross-references the committed vanilla_defines.txt manifest (CI
            # has no HOI4 install); regenerate it after a game update via
            # gen_vanilla_defines_manifest.py.
          # NOTE: validate_unused_textures.py is intentionally not wired here
          # — ~22k pre-existing unreferenced textures make it a periodic
          # mod-size audit, not a per-PR signal. Run manually via
          # `pre-commit run md-validate-unused-textures --hook-stage manual`.

    steps:
      # Bundle includes the shared .validation_cache — one restore replaces
      # both the old checkout and per-validator cache steps.
      - name: Restore prepared workspace
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.WORKSPACE_PATHS }}
          key: ${{ env.WORKSPACE_KEY }}
          fail-on-cache-miss: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Run validation
        run: |
          python3 tools/validation/${{ matrix.validator.script }} \
            --strict --no-color --workers 4 \
            --output validation-${{ matrix.validator.name }}.log

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: validation-${{ matrix.validator.name }}-results
          path: |
            validation-${{ matrix.validator.name }}.log
            validation-${{ matrix.validator.name }}.json
          if-no-files-found: ignore
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # Targeted validators — one matrix entry per validator, each gated
  # on the specific detect-changes output it cares about. We keep the
  # display names identical to the old per-job names so branch protection
  # rules referencing them keep working.
  # ───────────────────────────────────────────────────────────────
  validate-targeted:
    name: ${{ matrix.validator.title }}
    needs: [detect-changes, prepare-workspace]
    if: >-
      needs.detect-changes.outputs.decisions == 'true' ||
      needs.detect-changes.outputs.oob == 'true' ||
      needs.detect-changes.outputs.ai-strategy == 'true' ||
      needs.detect-changes.outputs.ai-navy == 'true' ||
      needs.detect-changes.outputs.ai-equipment == 'true' ||
      needs.detect-changes.outputs.factions == 'true' ||
      needs.detect-changes.outputs.scripted-guis == 'true' ||
      needs.detect-changes.outputs.interface == 'true' ||
      needs.detect-changes.outputs.national-focus == 'true' ||
      needs.detect-changes.outputs.on-actions == 'true' ||
      needs.detect-changes.outputs.scripted-effects == 'true' ||
      needs.detect-changes.outputs.mios == 'true' ||
      needs.detect-changes.outputs.events == 'true' ||
      needs.detect-changes.outputs.history == 'true' ||
      needs.detect-changes.outputs.localisation == 'true' ||
      needs.detect-changes.outputs.common == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        validator:
          - script: validate_decisions.py
            name: decisions
            title: "Validate Decisions"
            strict: true
            should_run: ${{ needs.detect-changes.outputs.decisions }}
          - script: validate_oob_units.py
            name: oob-units
            title: "Validate OOB Unit Names"
            strict: true
            should_run: ${{ needs.detect-changes.outputs.oob }}
          - script: validate_ai_roles.py
            name: ai-roles
            title: "Validate AI Role References"
            strict: true
            should_run: ${{ needs.detect-changes.outputs.ai-strategy }}
          - script: validate_ai_navy.py
            name: ai-navy
            title: "Validate AI Navy"
            strict: true
            should_run: ${{ needs.detect-changes.outputs.ai-navy }}
          - script: validate_ai_equipment.py
            name: ai-equipment
            title: "Validate AI Equipment Coverage"
            strict: true
            should_run: ${{ needs.detect-changes.outputs.ai-equipment }}
          - script: validate_factions.py
            name: factions
            title: "Validate Faction System"
            strict: true
            should_run: ${{ needs.detect-changes.outputs.factions }}
          - script: validate_mios.py
            name: mios
            title: "Validate MIO Organizations"
            strict: true
            should_run: ${{ needs.detect-changes.outputs.mios }}
          - script: validate_scripted_gui.py
            name: scripted-gui
            title: "Validate Scripted GUIs"
            strict: true
            should_run: >-
              ${{ (needs.detect-changes.outputs.scripted-guis == 'true' ||
              needs.detect-changes.outputs.interface == 'true') &&
              'true' || 'false' }}
          - script: validate_focus_tree.py
            name: focus-tree
            title: "Validate Focus Tree Structure"
            strict: true
            # the ai_will_do guard checks (#2233) are WARNING-severity: the
            # ~1900-focus backlog surfaces in reports without gating PRs.
            should_run: ${{ needs.detect-changes.outputs.national-focus }}
          - script: validate_on_actions.py
            name: on-actions
            title: "Validate On Actions"
            strict: true
            should_run: >-
              ${{ (needs.detect-changes.outputs.on-actions == 'true' ||
              needs.detect-changes.outputs.events == 'true') &&
              'true' || 'false' }}
          - script: validate_scripted_params.py
            name: scripted-params
            title: "Validate Scripted Effect Parameters"
            strict: true
            should_run: >-
              ${{ (needs.detect-changes.outputs.scripted-effects == 'true' ||
              needs.detect-changes.outputs.national-focus == 'true' ||
              needs.detect-changes.outputs.decisions == 'true' ||
              needs.detect-changes.outputs.events == 'true') && 'true' ||
              'false' }}
          - script: validate_gfx_references.py
            name: gfx-references
            title: "Validate GFX Sprite References"
            strict: true
            # Gating: undefined-sprite errors are clean on main. Vanilla sprite
            # names come from the committed tools/validation/vanilla_sprites.txt
            # manifest (regenerate with gen_vanilla_sprites_manifest.py after a
            # HOI4 version bump); unused-sprite findings stay WARNING-severity.
            should_run: >-
              ${{ (needs.detect-changes.outputs.interface == 'true' ||
              needs.detect-changes.outputs.common == 'true' ||
              needs.detect-changes.outputs.events == 'true' ||
              needs.detect-changes.outputs.history == 'true' ||
              needs.detect-changes.outputs.localisation == 'true') && 'true' ||
              'false' }}
          - script: validate_modifiers.py
            name: modifiers
            title: "Validate Modifier Names"
            # Informational: frequency-based detection has inherent false
            # positives for rarely-used but valid vanilla modifiers
            strict: false
            should_run: ${{ needs.detect-changes.outputs.common }}
          - script: validate_simplifications.py
            name: simplifications
            title: "Suggest Scope Merges"
            # informational: WARNING-only simplification hints, never gates a PR
            strict: false
            should_run: >-
              ${{ (needs.detect-changes.outputs.scripted-effects == 'true' ||
              needs.detect-changes.outputs.national-focus == 'true' ||
              needs.detect-changes.outputs.decisions == 'true' ||
              needs.detect-changes.outputs.on-actions == 'true' ||
              needs.detect-changes.outputs.events == 'true') && 'true' ||
              'false' }}
    steps:
      # Per-entry gate: only restore + run when this validator's file group
      # changed. Steps below each carry the same `if` so a skipped entry
      # reports cleanly as "success with no work done" instead of
      # bulk-skipping the whole job.
      - name: Restore prepared workspace
        if: matrix.validator.should_run == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ env.WORKSPACE_PATHS }}
          key: ${{ env.WORKSPACE_KEY }}
          fail-on-cache-miss: true
      - name: Set up Python
        if: matrix.validator.should_run == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"
      - name: Run validation
        if: matrix.validator.should_run == 'true'
        run: |
          if [ "${{ matrix.validator.strict }}" != "false" ]; then
            python3 tools/validation/${{ matrix.validator.script }} \
              --strict --no-color --workers 4 \
              --output validation-${{ matrix.validator.name }}.log
          else
            python3 tools/validation/${{ matrix.validator.script }} \
              --no-color --workers 4 \
              --output validation-${{ matrix.validator.name }}.log
          fi
      - name: Upload results
        if: always() && matrix.validator.should_run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-${{ matrix.validator.name }}-results
          path: |
            validation-${{ matrix.validator.name }}.log
            validation-${{ matrix.validator.name }}.json
          if-no-files-found: ignore
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # File paths — a mod path differing from a vanilla one only in case
  # overrides it on Windows but loads beside it on Linux, so the two
  # platforms checksum different file sets and cannot play together.
  # Stands apart from the workspace bundle: that bundle carries no .git
  # and no map/, and this check reads path names straight from the index.
  # ───────────────────────────────────────────────────────────────
  validate-paths:
    name: File Paths
    runs-on: ubuntu-latest
    steps:
      # blob:none fetches trees plus the tools/ blobs only — the index already
      # names every shipped path, so materialising the content buys nothing.
      # Cone mode also materialises root files, descriptor.mod among them.
      - name: Checkout tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            tools

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Run validation
        run: |
          python3 tools/validation/validate_file_paths.py \
            --strict --no-color --output validation-file-paths.log

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: validation-file-paths-results
          path: |
            validation-file-paths.log
            validation-file-paths.json
          if-no-files-found: ignore
          retention-days: 7

  # ───────────────────────────────────────────────────────────────
  # Validation report — collects all results and posts PR comment
  # ───────────────────────────────────────────────────────────────
  validation-report:
    name: Generate Validation Report
    runs-on: ubuntu-latest
    needs: [structural-lint, validate-core, validate-targeted, validate-paths]
    permissions:
      contents: read
      pull-requests: write
      checks: write
    # Run the report whether validators passed or failed, but not if the run
    # was cancelled. (The workflow only triggers on pull_request, so no event
    # guard is needed.)
    if: ${{ !cancelled() }}
    # PR context rebuilt for workflow_dispatch runs — see prepare-workspace.
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VALIDATION_SCOPE: >-
        ${{ github.event_name == 'workflow_dispatch' &&
        needs.structural-lint.result == 'success' &&
        needs.validate-core.result == 'success' &&
        needs.validate-targeted.result == 'success' &&
        needs.validate-paths.result == 'success' && 'full' || 'partial' }}
    steps:
      # Checkout the report generator + the report_lib package it imports.
      # Stays much smaller than a full checkout — we skip everything else.
      - name: Checkout report tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 1
          sparse-checkout: |
            tools/generate_validation_report.py
            tools/report_lib
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.x"

      - name: Download all validation results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: validation-*-results
          path: validation-results

      - name: Generate and post validation report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          workflow_url="$workflow_url/actions/runs/$GITHUB_RUN_ID"
          args=(
            --results-dir validation-results
            --output report.md
            --pr-number "$PR_NUMBER"
            --commit-sha "$HEAD_SHA"
            --workflow-run-url "$workflow_url"
            --github-repository "${{ github.repository }}"
            --validation-scope "$VALIDATION_SCOPE"
            --checks-api
            --print
          )
          if [ -n "$PR_NUMBER" ]; then
            args+=(--post-comment)
          fi
          python3 tools/generate_validation_report.py "${args[@]}"

      - name: Upload combined report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: validation-report
          path: report.md
          retention-days: 30
