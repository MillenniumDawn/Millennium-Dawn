 UKR_hur_operation_dagestan_tt: "Nous pourrons lancer une opération spéciale limitée en §Y[DAG.GetNamewithFlag]§!"
 UKR_hur_operation_chechnya_tt: "Nous pourrons lancer une opération spéciale limitée en §Y[CHE.GetNamewithFlag]§!"
 UKR_hur_operation_caucas_volunteer_tt: "De nouveaux bataillons du HUR seront disponibles pour des opérations spéciales limitées."
 UKR_hur_operation_russian_tt: "Nous pourrons lancer des opérations spéciales limitées en §Y[SOV.GetNamewithFlag]§!"
 UKR_hur_operation_vladivostok_tt: "Nous pourrons lancer des opérations spéciales limitées en §Y[FAR.GetNamewithFlag]§!"
 UKR_hur_operation_silesia_tt: "Nous pourrons lancer une opération spéciale limitée en §Y[SIL.GetNamewithFlag]§!"
 UKR_hur_operation_kashubia_tt: "Nous pourrons lancer une opération spéciale limitée en §Y[KSH.GetNamewithFlag]§!"
 UKR_party_regions_committee_economic: "Comité des réformes économiques"
 UKR_party_regions_committee_economic_desc: "Nous créerons également un autre ministère, le Comité des réformes économiques."
 UKR_party_regions_mezhyhirya: "Mejhyhiria"
 UKR_party_regions_mezhyhirya_desc: "En tant que vrai président, il faut avoir son propre abri où l'on peut se reposer des soucis et des affaires politiques."
 UKR_parti_regions_economic_committee: "Comité des réformes économiques"
 UKR_territorial_defense_zapad: "Ouvrir la liste des forces de défense territoriale « Ouest »"
 UKR_territorial_defense_zapad_close: "Fermer la liste des forces de défense territoriale « Ouest »"
