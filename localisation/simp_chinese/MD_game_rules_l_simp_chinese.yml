 RULE_ALLOW_ENABLE_WORLD_WAR_YES_DESC: "此选项将限制千禧黎明的沙盒元素，并将世界推向某一年的世界大战，类似于其他模组。\n\n强烈建议你使用历史模式，并禁用“AI债务战争”选项"
 RULE_ALLOW_ENABLE_WORLD_WAR_NO: "禁用通往世界大战之路"
