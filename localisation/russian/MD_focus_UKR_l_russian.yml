 ukraine_sov_equipment_factories.3.name: "Винницкая производственная линия готова"
 ukraine_sov_equipment_factories.3.desc: "Новая производственная линия в §YВиннице§! готова. Наша армия принимает на вооружение ожидавшие её проекты, и начинается производство."
