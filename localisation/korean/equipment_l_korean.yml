 USA_MBT_5: "M1A3 SEPv3 에이브럼스"
 USA_MBT_5_desc: "공통 원격 작동 무기 스테이션, 컬러 디스플레이, 향상된 인터페이스, 새로운 운영 체제, ERA(TUSK 키트)를 사용한 전면 및 측면 장갑 개선, 탱크 영아 전화 표준, 향상된 내구성을 위한 업그레이드된 변속기를 추가했습니다."
