 BOL_inefficient_economic_model: "비효율적인 경제 모델"
 BOL_inefficient_economic_model_desc: "볼리비아는 자원 수출에 지나치게 의존하고 심각한 초인플레이션을 겪는 결함 있는 경제 모델을 갖고 있으며, 경제 다변화 부족과 빈곤 및 낮은 성장률 문제도 안고 있습니다. 경제를 지탱하려면 대대적인 개혁이 필요합니다"
 BOL_ethnic_divides: "볼리비아의 민족 분열"
 BOL_ethnic_divides_desc: "볼리비아는 주로 동부 볼리비아에 거주하는 메스티소와 서부 볼리비아의 다수를 차지하는 원주민 집단 사이에 깊은 민족적, 인종적 분열이 있습니다. 이로 인해 민족 노선에 따른 양극화가 심화되고 있으며, 특히 최근에는 용수 접근권 등 여러 사안을 둘러싼 원주민 시위가 일어났습니다."
 BOL_cochabamba_crisis: "코차밤바 위기"
 BOL_cochabamba_crisis_desc: "1999년 12월, 코차밤바 시의 상수도 공사 SEMAPA 민영화에 반발하여 이 도시에서 대규모 시위가 시작되었습니다. 이후 시위는 용수 접근권과 원주민 권리 등의 문제로 확대되었습니다. 위기가 걷잡을 수 없이 번지고 있음이 분명하므로, 사태를 진정시키기 위해 즉각 조치를 취해야 합니다"
