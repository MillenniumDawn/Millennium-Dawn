 USA_political_pandering: "정치적 영합"
 USA_political_pandering_desc: "의회의 로비스트 세력은 필요할 때 매우 설득력이 있을 수 있습니다."
 USA_modify_economic_regulation_tt: "§Y경제 규제§!가 [?modify_economic_regulation|+0] 만큼 변동합니다 (현재: [?USA.USA_economic_regulation_var|Y0])\n"
 USA_modify_strength_of_wall_street_tt: "§Y월가 영향력§!이 [?modify_wall_street|+0]만큼 변동합니다 (현재: [?USA.USA_strength_of_wall_street_var|Y0])\n"
 USA_cutting_blue_tape: "블루 테이프 절단"
 USA_cutting_blue_tape_desc: "민주당 전국위원회는 국민을 돌볼 줄은 알았지만, 동시에 행정을 막히게 하는 데도 소홀하지 않았습니다. 우리는 기존 프로그램의 불필요한 군살을 도려내어 국민과 경제 자체에 더 많은 것을 돌려줄 수 있습니다. 지금은 일부가 불만을 가질 수 있으나 때가 되면 이를 상쇄할 수 있습니다."
 USA_cutting_red_tape: "레드 테이프 절단"
 USA_cutting_red_tape_desc: "공화당이 군산복합체와 맺은 관계는 예산 편성에 중복을 낳았고 경찰 노조는 경찰력의 급속한 군사화를 추구해 왔습니다. 우리는 예산을 수정하고 부패를 조사하며 예산을 삭감하여, 우리의 블루 테이프 개혁으로 불이익을 입은 이들에게 돌려주어야 합니다."
 USA_weakening_subsidies: "보조금 축소"
 USA_weakening_subsidies_desc: "과거의 양당 체제는 문제가 생길 때마다 보조금으로 돈을 퍼부었습니다. 우리는 이를 삭감하고, 의료 제도와 국내 산업과의 무기 계약 같은 집중적인 보조 분야의 일부 규제를 개혁할 것입니다."
 USA_yellow_tape_fixes: "옐로 테이프 수정"
 USA_yellow_tape_fixes_desc: "이전의 삭감은 부정적 효과와 긍정적 효과를 같게 만들어 전체 과정을 무효로 만들었습니다. 이에 많은 이들이 진정한 변화가 일어났는지 의문을 품었으며, 따라서 우리는 구체적인 경제 규제 철폐를 시행해야 합니다. 덤으로 중소기업협회의 도움을 받아 중소기업과 관련된 세법 일부도 규제를 풀 것입니다."
 USA_where_are_my_dice: "내 주사위는 어디에?"
 USA_where_are_my_dice_desc: "도박과 유사한 시설에 대해서는 각 주의 입장이 극도로 예측하기 어렵습니다. 어떤 이들은 착취를 보지만 우리는 경제적 유인을 봅니다. 이러한 산업에 대한 연방 기준을 마련하여 폐지되는 일이 거의 없도록 할 것입니다. 신앙심이 깊은 유권자들은 불편해할 수 있으나 큰 틀에서는 순이익으로 평가될 것입니다."
 USA_encourage_organ_donors: "장기 기증자 장려"
 USA_encourage_organ_donors_desc: "장기 암시장은 이를 필요로 하는 사람들에게조차 장기 이식 시장에 대한 뚜렷한 무관심이 있음을 보여줍니다. 이 끔찍한 행태를 바꾸기 위해 우리는 관련 절차의 행정 서류 업무를 대폭 줄이고, 의료 기관이 장기 기증 참여 의사를 더 잘 장려하고 확대할 방법을 찾을 것입니다."
 USA_personal_policing: "개인 치안"
 USA_personal_policing_desc: "법 집행은 언제나 정부의 독점이었지만, 경찰이 보호하고 봉사하는 곳 외에도 그렇지 못한 곳이 적어도 십여 군데는 있습니다. 따라서 우리는 개인 총기 소유에 대한 규제를 풀고 개인 치안의 개념과 가능성을 개혁해야 합니다. 언론의 세뇌 탓에 처음에는 많은 이들이 불쾌하게 여기겠지만, 총을 든 선량한 시민이 푸른 제복의 경찰만큼 도움이 될 수 있음을 머지않아 더 많은 이들이 알게 될 것입니다."
 USA_reducing_welfare_burdens: "복지 부담 축소"
 USA_reducing_welfare_burdens_desc: "사회보장제도는 2040년까지 지급 불능에 빠질 것으로 예상되는 프로그램이며, 우리가 앞으로 나아갈수록 그 날짜도 가까워지고 있습니다. 우리는 지급액을 줄인 다음 이 사실상 정부가 후원하는 다단계 사기 구조에 맞추어 지급액을 재조정해야 합니다. 이 피라미드의 끝에 있는 사람들이 안타깝게도 가장 큰 타격을 입겠지만, 이를 염두에 두고 우리는 피라미드의 확대를 줄이고 있으며, 따라서 이른바 신규 가입자들은 이미 과정을 마친 자기 사람들을 도울 여력이 더 커질 것입니다."
 USA_a_yellow_dawn: "노란 여명"
 USA_a_yellow_dawn_desc: "우리의 정책은 기성세력과 구세대 사상가들의 눈에는 급진적입니다. 우리는 메시지를 널리 퍼뜨리고 자유지상주의의 메시지를 공고히 해야 합니다. 국내 기반과 다져진 메시지를 활용해 미국 너머까지 닿을 수 있습니다. 일부는 붉은 여명을 두려워하지만, 우리는 밝은 노란 여명이 시작되는 것을 기뻐할 것입니다."
 USA_liberty_trade: "자유 무역"
 USA_liberty_trade_desc: "미국은 너무 오랫동안 소비 경제였습니다. 이제 국내에 투자하고 수출 경제의 영광으로 돌아갈 때입니다. 사상과 이상을 수출하고 그 대가로 보상을 얻어 모든 국민의 생활 수준을 높일 것입니다."
 USA_another_yellow_victory: "자유를 위한 또 하나의 승리"
 USA_another_yellow_victory_desc: "국민이 뜻을 밝혔고, 자유와 해방의 정당이 재선되었습니다. 많은 이들이 이를 큰 포부로 바라보며, 어떤 이들은 더 많은 자유를 이야기하고, 다른 이들은 STEM 프로그램과 그 혁신을 통한 더 큰 단결을 기대합니다. 또 다른 이들은 경제가 곧 자유이며 자유 그 자체가 경제적일 수 있다며 자유를 새로운 경계로 끌고 가자고 말합니다. 지금으로서는 우리는 길을 고수하며 어떻게 될지 지켜볼 것입니다."
 USA_liberating_gun_owners: "총기 소유자 해방"
 USA_liberating_gun_owners_desc: "특정 총기 개조에 대한 제한과 합법적 소유에 대한 불필요한 관료적 절차는 우리 헌법 수정 제2조의 오점입니다. 모든 것을 한꺼번에 해제할 수는 없지만, 더 큰 변화를 추구하기 전에 어리석게 여겨지는 규제나 소소한 규제를 상당수 되돌릴 수 있습니다."
 USA_libertycare: "리버티케어 법"
 USA_libertycare_desc: "리버티케어 법은 외국인 의료 종사자가 미국에서 개업할 수 있는 능력에 대한 제한과, 1차 진료 직위에 대한 인위적 제한 및 이른바 허용 상한에 관한 규제를 줄이는 법안입니다. 이는 전문의 공급을 늘리고 전체 의료비를 낮추어 평범한 미국인에게 순이익이 될 것입니다."
 USA_liberty_socialcare: "리버티 사회보장 법"
 USA_liberty_socialcare_desc: "리버티 사회보장 법은 사회보장제도 납입액을 줄이고, 그에 따라 원천징수해야 하는 급여세를 낮출 것입니다. 이는 국민에게 지금 당장 자기 돈을 돌려주고 기업의 부담도 덜어줄 것입니다. 감성적인 사람들과 막바지에 이른 이들에게는 타격이겠지만, 사람들이 스스로 노후를 마련할 더 나은 기회를 갖게 된다는 점에서 좋은 일로 평가될 것입니다."
 USA_a_liberated_people: "해방된 국민"
 USA_a_liberated_people_desc: "우리 교육 제도의 해방은 필수입니다. 재원 배분 방식에 관한 규제를 되돌리고 학교 선택권이라는 핵심 요소를 장려함으로써, 우리는 공립학교가 사립학교의 기세에 쇠퇴하지 않도록 교육을 개선하는 쪽으로 제대로 방식을 바꾸게 하려 합니다."
 USA_weakening_corporate_welfare: "기업 복지 축소"
 USA_weakening_corporate_welfare_desc: "정부는 보조금을 통해 지나치게 많은 지원금을 나눠주고 있습니다. 이러한 기업 복지 꾸러미는 즉시 중단될 것이며, 이를 보완하기 위해 해당 보조금이 필요하다는 이른바 명분과 관련된 규제를 줄일 것입니다."
 USA_disbanding_subsidies: "보조금 폐지"
 USA_disbanding_subsidies_desc: "이름은 거창하지만 실상은 기업 보조금을 폐지하는 것입니다. 이 좀비 기업들을 인위적으로 떠받치던 정부의 젖줄을 끊음으로써, 우리는 시장을 진정한 경쟁에 개방했습니다."
 USA_deregulating_small_businesses: "소기업 규제 철폐"
 USA_deregulating_small_businesses_desc: "이 나라 경제의 근간은 평범한 남녀의 영세 가게와 동네 상점입니다. 우리는 이들이 창업하는 능력과 과도하게 큰 경쟁자와 경쟁하는 방식에 대한 규제를 풀어야 합니다. 독점을 없애려면 어떻게든 독점의 정의를 바꾸기만 하면 된다는 점을 기억하십시오."
 USA_deregulating_mining_practices: "채굴 관행 규제 철폐"
 USA_deregulating_mining_practices_desc: "국내 광업의 실태는 좋게 봐도 참담하고 나쁘게 보면 가증스럽습니다. 우리는 사실상 수백만 톤의 원자재를 보유하고 있으면서도 권위주의 정권으로부터 수입해야 하고, 필요한 것을 만들기 위해 주권을 내주고 있습니다. 더는 아닙니다. 국민을 만족시키기 위한 몇 가지 소소한 상식적 규칙을 제외하고 채굴 관행은 대폭 규제가 철폐될 것입니다. 정치적 영향력은 일부 잃을 수 있으나 목적이 수단을 정당화할 것입니다."
 USA_deregulating_zoning_laws: "토지 용도 규제 철폐"
 USA_deregulating_zoning_laws_desc: "미국의 주택 시장. 누군가는 부의 창출의 보루라 하고, 누군가는 반드시 멀미가 나는 롤러코스터라 합니다. 어느 쪽이든 새 주택이나 사업장을 짓는 데 따르는 규제와 세부 조건의 양은 완전한 수렁입니다. 가장 낙후된 주들이 캘리포니아나 뉴욕 같은 도시형 주와 경쟁할 생각이라도 할 수 있도록 이 분야의 규제를 대폭 삭감해야 합니다."
 USA_truly_free_market: "진정한 자유 시장"
 USA_truly_free_market_desc: "자유의 빛나는 불빛이 이 바다에서 저 바다까지 번쩍이는 가운데 권력의 내부 가스가 연소하기 시작했습니다. 많은 시민은 이 진정한 자유의 꿈이 지속될지, 아니면 악의적인 자들이 이 새로운 자유의 감각을 악용하여 자신의 의지를 더 나쁜... 혹은 어쩌면 더 위대한 무언가로 몰고 갈지 궁금해합니다. 어느 쪽이든 우리는 강하고 단결된 채로 이 개혁된 공화국을 지켜야 합니다."
 Technocracy_victory: "STEM 위원회가 권력 투쟁에서 승리함"
 USA_focus_state_visit_to_canada: "캐나다 국빈 방문"
 USA_focus_state_visit_to_canada_desc: "북쪽에서는 우정과 안전을 구합니다. 앞마당의 이웃을 소외시키지 않기 위해서입니다."
 USA_focus_state_visit_to_mexico: "멕시코 국빈 방문"
 USA_focus_state_visit_to_mexico_desc: "남쪽에서는 평화와 안정을 구합니다. 뒷마당 또한 잊어서는 안 되기 때문입니다."
 USA_focus_state_visit_to_brazil: "브라질 국빈 방문"
 USA_focus_state_visit_to_brazil_desc: "남쪽의 이웃인 그들을 잊어서는 안 됩니다. 남쪽 대륙의 가장 큰 상대 없이 우리의 반구 패권이 어디에 있겠습니까. 우리는 방문하여 할 수 있는 곳에서 도움을 줄 것입니다."
 USA_breaking_the_mold: "틀을 깨다"
 USA_breaking_the_mold_desc: "국민의 의지에 의해서든 지배 계층의 오만과 실패에 의해서든, 우리는 빨강과 파랑을 넘어선 정치 스펙트럼 그 자체의 빛을 보았습니다. 관점과 사상은 무지개처럼 다양하며, 우리는 이를 살펴 양당 지배라는 과두제적 족쇄에 얽매이지 않는 진정한 미래를 만들어야 합니다."
 USA_healing_the_wounds: "상처를 치유하다"
 USA_healing_the_wounds_desc: "먼 길을 왔지만 카르텔에 대한 단속으로 우리는 빛을 보았습니다. 영원한 전쟁의 이 새로운 국면에서 설정되고 집중된 더 분명한 길은 이제 국민의 정신과 이 문제를 해결하는 방식을 맑게 했습니다. 이제 우리는 국민을 위해 제시한 미래를 바라볼 것입니다."
 USA_committee_on_green_economics: "녹색 경제 위원회"
 USA_committee_on_green_economics_desc: "경제는 갈색과 빨간색이며, 국민과 환경 자체에 파괴적이고 해롭습니다. CGEA는 경제 상황을 평가하고, 기업의 운영 방식을 바꾸며 더 깨끗하고 더 푸른 경제로의 전환을 원활히 하는 계획을 마련할 정부 기구입니다."
 USA_department_of_ecostandards: "환경 기준부"
 USA_department_of_ecostandards_desc: "DoES는 환경에 미치는 영향과 전반적 생산성에 미치는 영향을 기준으로 환경 복지 기준을 만들 EPA의 하위 부서가 될 것입니다. 이 균형이야말로 급격한 변화로 수백만 명의 우리 국민에게 근본적인 해를 입히지 않으면서 경제를 푸르게 만드는 안정적인 합의를 설득하는 방법입니다."
 USA_industrial_conversions: "산업 전환법"
 USA_industrial_conversions_desc: "ICA는 이전 정부 기구들이 수립한 새로운 생태 기준에 맞추어 기존 산업을 천천히 포괄적으로 전환하는 과정을 시작하는 입법입니다. 이는 장기적인 약속이므로 당분간 완전히 시행되지는 않겠지만, 그럼에도 우리 국민의 건강과 안전을 개선하기 시작할 것입니다."
 USA_agricultural_condensing: "농업 집약법"
 USA_agricultural_condensing_desc: "농업 생산의 집약과 효율 증대는 최우선 과제입니다. 이는 환경과 국민 삶의 발전을 위한 더 많은 공간을 확보해 줄 것입니다. 비용은 지갑에 타격이 될 수 있지만 장기적 성과는 그만한 가치가 있을 것입니다."
 USA_green_housing_act: "녹색 주택법"
 USA_green_housing_act_desc: "녹색 주택법은 자격이 있는 이들이 가전 기기를 반납할 수 있도록 환급 제도를 마련할 것입니다. 프로판 난방 장치와 같은 화석 연료를 태우는 가정용 설비는 더 낫고 효율적인 전기 설비로 대체될 것입니다. 이는 일반 국민의 어깨에서 직접적인 부담을 덜어 주고 단기적으로 더 원활한 전환을 가능하게 할 것입니다."
 USA_green_tax_reform_act: "녹색 세제 개혁법"
 USA_green_tax_reform_act_desc: "더 많이 벌수록 더 많은 허점을 찾아낸다... 이 말은 세법 전체에 스며 있습니다. 이 입법은 그로 인해 이익을 보는 기업과 극소수를 위한 허점을 가능한 한 많이 포괄적으로 찾아 바로잡을 것입니다."
 USA_green_arms_of_the_law: "법의 푸른 팔"
 USA_green_arms_of_the_law_desc: "녹색 법집행관법은 기업의 탐욕, 횡령 및 기타 관련 \\"화이트칼라\\" 범죄와 관련된 범죄에 대한 자금과 인력 배정을 늘릴 것입니다. 이러한 범죄는 국가와 거의 기업 중심주의에 가까운 제휴 관계를 괴롭히고 있습니다. 평범한 노동자가 부자들의 탐욕과 죄악으로 고통받아서는 안 됩니다."
 USA_eco_welfare_act: "환경 복지법"
 USA_eco_welfare_act_desc: "EWA는 이른바 기업 지도자들이 만들어낸 근로 환경의 중대한 태만으로 이미 상처를 입은 이들을 돌보는 사회 안전망에 필요한 자금을 투입할 것입니다. 장애 지원금 증액이 최우선 과제이며, 모성 돌봄과 사회 보장 자체에 관한 조항 등도 미국 국민을 위한 이 지원 꾸러미에 포함됩니다."
 USA_greencare_act: "그린케어법"
 USA_greencare_act_desc: "미래는 지금이며 미래는 이 나라의 청년들과 함께합니다. 올바른 교육을 받은 이 젊은이들은 우리의 삶의 방식을 괴롭히는 문제들을 해결하고 앞으로 나아갈 방법을 모색할 수 있습니다. 현대 산업과 환경에 대한 현대적 이해와 우리의 결속을 더 높일 수 있는 분야를 중심으로, STEM 프로그램과 관련된 교육에 자금이 투입될 것입니다."
 USA_growing_greener_tomorrows: "더 푸른 내일을 키우다"
 USA_growing_greener_tomorrows_desc: "더 푸른 국가, 더 푸른 국민은 더 푸른 미래로 이어질 것입니다. 국가와 국민은 환경과 어머니 지구 자체가 다른 시민과 다를 바 없는 하나의 시민이라는 점을 이해하며 생태 민주주의의 이념 아래 결집합니다. 그녀에게도 살아가기 위한 필요가 있으며, 이 훌륭한 국가의 시민들처럼 영원한 삶 속에서 마침내 처음으로 자신의 목소리가 들리기를 바라고, 나는 그렇게 되었다고 믿습니다."
 USA_continued_eco_nomics: "지속되는 에코노믹스"
 USA_continued_eco_nomics_desc: "우리는 지구와 국민 모두에게 이로운 녹색 기반 규제를 우선시하는 에코노믹스 정책의 성전을 계속해 나갈 것입니다."
 USA_the_eco_government: "굴러가는 환경 정부"
 USA_the_eco_government_desc: "집권하는 동안 환경 정부는 미래 세대를 위해 국민과 환경을 보호하는 역할을 계속 다할 것입니다."
 USA_green_trade_deals: "녹색 무역"
 USA_green_trade_deals_desc: "미국은 풍요의 땅이며, 그 무역은 국내만큼이나 해외에도 해를 끼칩니다. 이 둘의 최선의 균형을 찾으려면 우리의 무역과 자원 채취 정책에 대한 철저한 검토가 필요합니다. 일부 사람들이 결국 우리에게 적대감을 느끼더라도 우리는 굴하지 않을 것입니다."
 USA_planting_new_programs: "새 계획의 씨앗을 심다"
 USA_planting_new_programs_desc: "정부는 국민의 투자가 지속적으로 성공하도록 책임지지만, 이를 다른 나라로 수출할 수 있습니다. 세계의 핵심 국가들의 삶을 개선하는 투자를 살펴봄으로써 그들이 고마워하고, 자신과 타국을 모두 개선하기 위한 유사한 사업을 추진하리라 기대할 수 있습니다. 우리는 이 행성에서 변화 자체의 도화선에 불을 붙이는 성냥이 될 것입니다."
 USA_foreign_policy_plan_green: "녹색 외교 정책 계획"
 USA_foreign_policy_plan_green_desc: "투자가 필요한 국가들에 추가 투자를 모색할 것이며, 이러한 개발 계획은 환경 기준에 부합하는 동시에 이들 국가와 국민의 미래를 만들어낼 것입니다."
 USA_ecocation: "에코케이션법"
 USA_ecocation_desc: "의회는 개발이 환경에 미치는 영향과 더 낫고 더 인식 있는 학생을 길러내는 교육의 중요성을 모두 강조하도록 교육 목표를 전환하는 입법을 제안했습니다. 학생들에게 부주의하지 않으면서도 지혜롭고 혁신적이어야 할 필요성을 교육합니다. 시간이 흐르면서 우리는 새싹의 정원을 가꾸게 될 것이며, 새싹 하나하나가 앞선 것보다 더 나아질 것입니다."
 USA_green_housing_initiative: "녹색 주택 구상"
 USA_green_housing_initiative_desc: "이전에 통과된 법과 법안을 토대로 이 나라의 현대적 주거 기준을 확립할 것입니다. 효과성, 효율성, 그리고 국민의 필요에 응할 수 있는 능력에 초점을 맞춥니다."
 USA_societal_ecology: "사회 생태학"
 USA_societal_ecology_desc: "사회이자 종으로서 우리는 절약의 개념을 확산시키고 전반적으로 더 단순한 삶을 살도록 해야 합니다. 현대의 소비주의는 우리가 지구로부터 실제 필요 이상을 원하게 만들었습니다. 이러한 이해 방식을 형성하고 어릴 때부터 생활 양식을 바꾸기 위해 정부 및 학교 프로그램과 구상을 만들 것입니다."
 USA_furthering_renewable_developments: "재생 에너지 개발 촉진"
 USA_furthering_renewable_developments_desc: "에너지와 전력에 대한 필요가 늘어나는 만큼, 이러한 재생 에너지원을 만들 수 있도록 타협을 모색해야 합니다. 교육 투자를 통해 생산 효율과 자원을 더 효율적으로 채굴하는 능력을 높일 수 있습니다. 이러한 혁신으로 우리는 더 자립할 수 있으며, 새로 얻은 부의 형태를 통해 투자로 우리의 힘을 투사할 수 있습니다."
 USA_a_green_future_for_all: "모두를 위한 녹색 미래"
 USA_a_green_future_for_all_desc: "우리의 계획이 갖춰졌고 우리의 미래가 그 어느 때보다 유망해 보이므로, 하늘 위의 별이 더 밝게 빛날 것임을 알고 안심해도 좋습니다. 우리는 생활 수준과 우리의 행성 지구를 돌보는 데 지켜 온 기준을 높이기 위해 큰 노력을 기울였습니다."
 USA_progressive_tax_reforms: "진보적 세제 개혁법"
 USA_progressive_tax_reforms_desc: "의회 의원들은 현행 세법을 현대적 누진 과세 체계에 더 부합하도록 개혁하는 법안을 제안했습니다. 이는 논란의 여지는 있지만 더 많은 세수를 가져올 것이며, 이에 대한 반발로 일부 이익 단체가 이러한 노력을 훼손하려 들 수도 있습니다."
 USA_middle_man_programs: "중개 계획"
 USA_middle_man_programs_desc: "MMP는 개발과 경제 전반의 중개 고리, 즉 우리 문명 자체의 건설과 개발에 대한 정부 투자가 될 것입니다. 이러한 투자를 통해 더 많은 사업을 추진하고 그러한 개발에 필요한 자원을 확보할 수 있을 것입니다."
 USA_four_day_work_week: "주 4일 근무제"
 USA_four_day_work_week_desc: "우리에 앞서 많은 국가가 주 4일 근무제가 경제에 객관적으로 더 낫다는 것을 시험하고 입증했습니다. 고용 증가, 더 행복한 노동자, 늘어난 생산량으로 경제 전반이 상승세를 타게 될 것이며, 이는 우리의 과거와 미래 계획에 대한 우려를 잠재울 것입니다. 기업 중심주의는 정부... 그리고 현실 자체와 맞설 수 없습니다."
 USA_political_financing_reforms: "정치 자금 개혁"
 USA_political_financing_reforms_desc: "일부 선거 기부금 관련 법률의 변경과 기타 명백한 변화는 제쳐 두고, 핵심은 정부의 모든 주요 부처를 포괄적으로 살펴 각 부문 내의 중복과 이해 충돌을 점검하는 것입니다. 이는 지출을 크게 줄여 줄 것이며, 이후 더 전문화된 사업에 재투자할 수 있습니다."
 USA_progressive_care_act: "진보적 의료법"
 USA_progressive_care_act_desc: "PCA는 기업이 연방 서비스와 함께 제공할 수 있고 제공하게 될 의료 보장을 개혁하고 어느 정도 개편하도록 설계된 입법입니다. 이 개혁은 사람들의 생산성을 높이고, 일자리가 그들을 \\"돌봐 준다\\"고 여겨지므로 일하고 싶게 만드는 데 도움이 될 것입니다. 그들이 진심으로 신경 쓰지 않더라도 우리는 분명 그렇게 하도록 만들 수 있습니다."
 USA_filling_tax_holes: "세금 허점 메우기"
 USA_filling_tax_holes_desc: "우리의 이전 노력에도 불구하고 상위 1%는 납세 의무를 피해 가는 합법적 방법을 계속 찾아내는 것으로 보입니다. 이를 염두에 두고 이러한 합법적 사례를 관찰하고 연구하며 발견된 허점을 메우도록 새로운 변화를 적용할 수 있는 비밀 위원회를 설립할 것입니다."
 USA_elder_care_reforms: "노인 돌봄 개혁법"
 USA_elder_care_reforms_desc: "의회는 노인 돌봄 개혁법을 통과시키려 하고 있으며, 이 법안은 노인 돌봄에 대한 관행과 재원 조달 방식을 개혁하고 표준화할 것입니다. 이는 증가하는 노인 인구에 대해 더 효율적이고 개선된 돌봄 기준을 가능하게 할 것입니다."
 USA_pink_police_act: "핑크 경찰법"
 USA_pink_police_act_desc: "의원들은 지역 사회 참여와 연대 프로그램을 장려하고, 강도와 같은 범죄가 강도 대상보다 사랑하는 사람들을 더 크게 해친다는 점에 대한 인식을 확산시키는 새로운 입법을 통과시키려 하고 있습니다. 이러한 범죄에 관한 통계와 자료는 이 법을 끝까지 추진하려면 양측의 협력이 필요함을 보여 주었습니다."
 USA_five_percent_act: "5퍼센트법"
 USA_five_percent_act_desc: "5퍼센트법은 총소득의 최소 5%를 일자리 창출과 경제 활성화에 사용하는 모든 개인에게 세금 유인책을 부여하는 법안입니다. IRS와 관련하여 독립 위원회가 설치되어 해당 세금 유인책 신청을 검토하고 평가하게 됩니다. 이 유인책은 기여액의 가시적 증진 효과에 따라 달라질 수 있습니다. 대기업은 경쟁 등에 대해 반대 목소리를 낼 수 있지만, 행정부는 이것이 경제 전반에 미칠 국내 투자와 개발의 증진 효과를 확신합니다."
 USA_bully_for_you_kid: "잘했다, 친구"
 USA_bully_for_you_kid_desc: "\\"불리\\"라고 테디는 말했습니다. 미국-스페인 전쟁의 러프 라이더이자 강인하면서도 신사적인 그는 우리 모두의 본보기입니다. 정책 결정을 다루는 그의 실용적인 태도와 국민의 더 나은 삶을 위해 반대에 맞서는 능력은 우리의 추진력의 초석입니다. 더 나은 내일을 위하여, 그리고 불리... 잘했다, 친구."
 USA_another_win_for_progress: "진보의 또 한 번의 승리"
 USA_another_win_for_progress_desc: "우리는 다시 한번 승리의 무대에 섰습니다. 과거의 정책이 국민에게 그들이 원하고 필요로 하는 미래를 확신시켰습니다... 그 미래를 얻게 될 것입니다."
 USA_the_pink_tax_act: "핑크 세금법"
 USA_the_pink_tax_act_desc: "의회는 세제 개혁 법안에 특수 세금 징수가 빈곤 지역의 창업 및 개발 자금으로 투입되도록 하는 내용을 덧붙이기로 했습니다. 이는 국내 투자를 유치하고 \\"쓸모없다\\"고 여겨졌던 지역에 경제 성장을 가져올 것입니다. 우리는 국가의 바닥을 끌어올리고 이전보다 새로운 수준으로 기준을 설정하는 진전을 보게 될 것입니다."
 USA_preserving_life: "생명 보전"
 USA_preserving_life_desc: "테디 루스벨트의 발자취를 따라, 행정부 기반 예산 편성을 확대하여 전국에 다수의 자연 보호구와 국립공원을 조성할 것입니다. 환경을 돌보는 것과 이 나라의 생활 수준을 향상시키고 싶은 마음 사이의 절충적 감각에 초점을 맞출 것입니다."
 USA_conserving_strife: "갈등 보전"
 USA_conserving_strife_desc: "정부 예산 증액을 이 경제의 근간을 발전시키는 데 사용하고자 합니다. 노동조합은 대산업을 대변하지만, 소시민을 대변하는 이는 누구입니까. 지역 사회의 경제 성장을 이끌고 발전시킬 젊은 사업가들에게 유인책 꾸러미가 제공되며, 물론 건전한 근거가 있고 부정 행위가 없도록 그 과정을 면밀히 심사할 것입니다."
 USA_a_newer_deal: "더 새로운 뉴딜"
 USA_a_newer_deal_desc: "더 새로운 뉴딜은 행정부 전반에 걸쳐 국가의 전략적 경제 개발에 전념하는 새로운 공공 사업과 건설 사업의 물결이 될 것입니다. 이러한 투자가 새로운 기업, 전반적인 생산 증대, 그리고 국민을 위한 더 나은 계속 성장하는 일자리 시장을 개척하기를 기대합니다."
 USA_pink_ribbon_act: "핑크 리본법"
 USA_pink_ribbon_act_desc: "의회 의원들은 중대 질병 연구 구상을 겨냥한 전용 패키지를 통과시키기로 결정했습니다. 이는 치료법을 찾는 국내 구상을 촉진하고 암 등의 질병 피해자를 위한 기존의 돌봄 및 관리 방법을 개선할 것입니다. 이 전용 패키지는 장기적으로 정치적, 경제적 폭이 넓지 않을 수 있지만, 길게 보았을 때 우리에게 도움이 될 핵심 문제입니다."
 USA_brighter_reforms_act: "더 밝은 개혁법"
 USA_brighter_reforms_act_desc: "BRA... 하하, 브라. BRA 법은 중공업과 같은 분야에 대한 이해와 연구 초점을 높이는 데 자금과 조직을 투입하려는 교육 개혁법입니다. 해운업과 경제 내 2차 상품은 하나의 핵심 디딤돌일 뿐이며, 계속 변화하는 이 세상에서 앞서 나가려면 이러한 노력이 발전되어야 합니다."
 USA_progressive_foreign_policy: "진보적 외교 정책"
 USA_progressive_foreign_policy_desc: "평화적인 방법으로 우리의 힘을 투사해야 합니다. 해외 투자, 인도주의 임무 등으로 말입니다. 많은 이들이 두려워하는 세계의 경찰관 대신 세계의 부모와 같은 존재라는 이미지를 구축해야 합니다. 퇴보를 보장하는 힘이 아니라 변화 그 자체가 되어야 합니다."
 USA_progressive_trade_deals: "진보적 무역 협정"
 USA_progressive_trade_deals_desc: "세계 경제는 우리 국가의 일부이며 국가는 세계 경제의 일부입니다. 우리는 이 기계의 톱니바퀴가 되어야 하지만 기계 또한 우리 안의 톱니바퀴가 되게 해야 합니다. 이 나라의 경제적 유연성은 세계의 도움으로도 여전히 경제적으로 건전할 수 있음을, 그리고 세계가 안심할 수 있도록 도울 수 있음을 보여야 합니다. 우리의 필요를 생산하고, 그들의 필요도 함께 생산합니다. 기억하십시오. \\"문제는 경제야, 바보야.\\""
 USA_teddys_legacy: "테디의 유산"
 USA_teddys_legacy_desc: "부드럽게 말하되 큰 몽둥이를 들어라. 이것이 \\"러프 라이딩\\" 테디 루스벨트 본인의 방식이었습니다. 단순한 원칙의 인물이었던 그는 조국뿐 아니라 세계 자체를 개선하고자 했습니다. 그는 위협을 오직 권력을 추구하는 수단으로서가 아니라 우리가 아는 인간 본성의 중대한 태만에 대한 중재 수단으로 활용했습니다. 그의 오만은 대전쟁에 선제적으로 개입할 능력을 앗아갔고, 그토록 거대한 규모의 분쟁을 끝내지 못해 우리가 또 다른 분쟁으로 이어지는 길을 걷게 된 듯합니다. 테디는 오늘날까지 한두 가지가 아닌 방식으로 살아남은 인상과 발자취를 이 세계에 남겼습니다."
 USA_roosevelt_runway: "루스벨트 활주로"
 USA_roosevelt_runway_desc: "단순한 항구를 넘어 전략적 수출입 거점을 만들기 위한 복합 정책 계획입니다. 우리의 광대한 경제라는 균형 잡히고 잘 돌아가는 기계를 갖추려면 모든 형태의 운송 수단을 활용해야 합니다."
 USA_reduce_corporate_power: "기업 권력 축소"
 USA_reduce_corporate_power_desc: "이 나라는 아무도 믿고 싶어 하지 않지만 기업 중심주의 국가입니다. 조직된 로비 단체와 공모하고 무능한 정치인들에게 쏟아붓는 막대한 자금을 걷어냄으로써 우리 민주주의에 대한 이러한 상명하달식 영향력을 제거해야 합니다. 의회에서 힘든 시간을 겪겠지만 결국 그만한 가치가 있을 것입니다."
 USA_increasing_working_class_power: "노동자 계급 권력 확대"
 USA_increasing_working_class_power_desc: "이 나라 국민 대다수는 자신에게 목소리가 없다고 믿습니다. 이는 이전 행정부들이 권력을 유지하는 데 이용해 온 무관심의 위기를 낳았습니다. 인식 제고 캠페인, 풀뿌리 운동, 전략적인 국가 기념일을 통해 국민에게 필요한 시간, 원하는 목소리, 그리고 물론 마땅한 동기를 줄 수 있습니다. 민주주의에서 투표는 힘 그 자체이며, 인간 성격의 나약함과 동료에 대한 배려라는 현실에 맞서 행사되는 최고의 권위입니다."
 USA_state_interventionism: "국가 개입주의"
 USA_state_interventionism_desc: "기업의 탐욕과 이기심 전반은 진정한 개발과 진보를 억누를 수 있습니다. 이를 염두에 두고, 필요할 때 연방 정부가 전면 개입할 수 있는 제한적이고 표적화된 분야를 허용하는 입법을 도입할 것입니다. 약간의 반발은 있겠지만 극복하지 못할 것은 없습니다."
 USA_welfare_state: "복지 국가"
 USA_welfare_state_desc: "복지 사업은 좌파도 우파도 아닌 개념이며, 자신의 몫을 다한 국가 구성원을 돌보는 것에 불과합니다. 우리는 대중을 설득하고 정치적으로 잃은 지반을 일부 되찾아야 합니다. 이러한 사업을 통해 메시지를 전달하고, 사람들이 우리 당뿐 아니라 우리 국가를 바라보는 시각을 누그러뜨릴 수 있습니다."
 USA_public_ownership: "공공 소유"
 USA_public_ownership_desc: "공공 소유 위원회는 정부가 직접 또는 간접적으로 통제하는 공공 기반 주체에 관한 정부 위원회가 될 것입니다. 여기에는 주 및 연방 차원이 포함되며, 각각 자체 소위원회를 두어 유연한 집중과 같은 우산 아래 있는 결속을 가능하게 합니다."
 USA_defunding_militarism: "군국주의 예산 삭감"
 USA_defunding_militarism_desc: "과도하게 군국주의적이던 우리 국가의 과거는 사람들이 마침내 더 이상 냉전 중이 아님을 받아들이면서 서서히 누그러졌습니다. 미 육군 공병단을 평시 개발 사업에 직접 투입하고 군 기반 경제보다 민간 기반 경제를 장려함으로써 그 핵심을 타격할 것입니다."
 USA_planned_economy: "경제 계획"
 USA_planned_economy_desc: "공공 부문을 뒷받침하기 위한 경제 성장에 대한 제한적인 정부 계획을 시작할 것입니다. 국민의 필요에 집중할 수 있고, 그러면 공공 부문이 국가의 과잉을 처리할 수 있습니다. 완벽한 계획이라고는 할 수 없지만 그럼에도 올바른 방향으로의 한 걸음입니다."
 USA_society_of_classes: "계급 사회"
 USA_society_of_classes_desc: "우리는 계급 사회이며 태생으로 나뉘어 있습니다. 우리는 메시지를 전파하고 국민과 국가, 사회 전체의 방식을 개선해야 합니다. 약자를 해치려는 이들을 주시해야 하며, 모두에게 기회가 더 평등하도록 만들어야 합니다. 우리의 의지는 굳건하며 국민 또한 강하게 만들어야 합니다."
 USA_rebuilding_the_democratic_system: "민주주의 체제 재건"
 USA_rebuilding_the_democratic_system_desc: "우리는 민주주의를 근본적으로 재건해야 합니다. 국내 안보와 국가 및 정치 기구의 온전성에 집중해야 합니다. 지정학적으로는 비용이 들 수 있으나, 국내의 반등은 장기적으로 분명 요긴할 것입니다."
 USA_equal_opportunity_for_all: "모두를 위한 기회 평등"
 USA_equal_opportunity_for_all_desc: "이 나라 국민은 억압적인 과거만을 알고 있습니다. 그러나 우리는 자유로운 정신의 미래를 보여 주고 이끌 수 있습니다. 숨은 의도와 증오가 만연한 이 현대에는 평등의 집행이 우선되어야 합니다."
 USA_red_democracy_wins_again: "울새가 다시 승리를 향해 날아오르다"
 USA_red_democracy_wins_again_desc: "날개는 펼쳐지고 바람은 잡혔으며, 국민은 얼굴에 햇살을 느꼈습니다. 우리 당의 따뜻한 품은 이 위대한 나라의 국민들에게 깊이 새겨졌고, 그리하여 또 한 번의 승리를 확보했습니다. 이제 우리는 다시 한번 여정을 이어 나가야 합니다."
 USA_pricing_mechanisms: "가격 메커니즘"
 USA_pricing_mechanisms_desc: "지난 십여 년 동안 우리는 집주인 같은 이기적인 이들로 인해 국가가 심각하게 고통받는 것을 보았습니다. 지금 당장 집주인이라는 개념을 없앨 수는 없지만, 상황이 갈수록 심각해지는 것을 막을 수는 있습니다. 표적화된 가격 고정을 통해 생존 그 자체에 필요한 것들의 상품화를 약화시킬 수 있습니다. 이를 미래를 위한 디딤돌로 삼을 수 있습니다."
 USA_consumer_production: "소비자 중심 생산"
 USA_consumer_production_desc: "미국이 세계 무대에서 경쟁력이 부족한 만큼 이를 바로잡을 때가 되었습니다. 생산 방식의 전환과 더 낮은 가격으로 더 높은 품질의 상품을 만드는 능력이야말로 이 나라를 다시 세계 지도에 올릴 것입니다. 자연주의자와 반세계화주의자들은 불평하고 투덜대겠지만, 우리는 별을 바라보며 그들을 아래로 내려다보게 될 것입니다."
 USA_small_business_commission: "소기업 위원회"
 USA_small_business_commission_desc: "SBC는 학습하고 이해하며 입법과 경제 개혁을 권고할 수 있는 임무를 맡은 독립 위원회가 될 것입니다. 이는 안타깝게도 수많은 개혁이 그러하듯 의도치 않은 부수적 피해로 소시민을 해치지 않으면서 대기업의 덩치를 줄이는 데 도움이 될 수 있습니다."
 USA_robincare_act: "로빈케어법"
 USA_robincare_act_desc: "의회 의원들은 기업이 제공하는 보장이 전반적으로 더 폭넓어지는 법안을 통과시키기로 결정했습니다. 이는 이 기업들이 자신들을 돌본다는 점이 드러나므로 사람들이 더 생산적이 되고 현재의 일자리에 머물도록 유인할 것입니다. 물론 이러한 계획은 정부가 규제하고 있지만, 그것은 우리끼리의 비밀로 합시다."
 USA_local_builders_act: "지역 건설업자법"
 USA_local_builders_act_desc: "LBA는 공급망과 개발을 더 유연하게 하기 위해 지역 장인과 수리공 등을 우선시하는 법안입니다. 이렇게 하면 대기업 집단이 자원을 어디에 배치할지 취사선택하는 데 끊임없이 의존하지 않아도 됩니다. 작은 마을과 촌락이 성장하는 경제와 국가로서 발전하려는 커져 가는 열망의 기반이 되기를 바랍니다."
 USA_modern_economy: "현대 경제"
 USA_modern_economy_desc: "국가는 앞으로 나아가고 있으며, 우리는 법률이 지켜지고 중요한 곳에서 개발이 이루어지도록 할 것입니다. 이 세계에서 우리의 입지는 전쟁이 아니라 평화와 빵으로 보장될 것입니다."
 USA_red_army_act: "붉은 군대법"
 USA_red_army_act_desc: "군에는 단결이 필요하며 싸울 진정한 목표가 필요합니다. 의무, 용기, 명예. 이것이 존엄의 원칙이자 평등의 목표입니다. 우리는 국가이며, 군은 국가이고, 국민이 군과 국가를 이룹니다. 우리는 평등과 자유를 수호할 것입니다."
 USA_private_ownership_act: "민간 소유법"
 USA_private_ownership_act_desc: "모순어법인 민간 소유법은 국가의 경제적 선례를 바꿀 법입니다. 민간 소유는 확립될 수 있지만 연방 기준의 적용을 받으며, 그 기준이 무시되고 고의로 묵살될 경우 SBC와 기타 관련 기관이 개입하여 경영진을 교체하고 최악의 경우 전면 정리할 수 있습니다. 이는 일반 노동자와 모든 노동자 권리 운동의 토대를 이루는 노조의 필요를 보장할 것입니다."
 USA_workers_war_act: "노동자 전쟁법"
 USA_workers_war_act_desc: "이름이 아주 은근하게 지어진 노동자 전쟁법은 전 세계 노동자들의 투쟁과 그들이 직면한 현실에 초점을 맞춘 법안입니다. 우리의 원칙을 해외로 수출하고 우리 외교 정책이 수행되는 방식에 새로운 길을 열 것입니다."
 USA_red_democracy_act: "붉은 민주법"
 USA_red_democracy_act_desc: "RDA는 순위 선택 투표의 강력한 시행과 의회 선거구에 관한 필요한 개혁을 통해 선거 투표 방식을 개편하는 법안입니다. 선거구 조작과 선거 매수 전반을 풀어내고 진정시킬 수 있습니다. 이러한 선거는 국민을 위한, 국민에 의한 것이어야 하므로 그렇다면 국민에게 돌려줍시다."
 USA_the_shepard_secures_victory: "셰퍼드가 승리를 거머쥐다"
 USA_the_shepard_secures_victory_desc: "자유와 사회주의를 위한 당으로도 알려진 셰퍼드 당이 이 나라 국민을 위한 승리를 거머쥐었습니다. 목동처럼 우리는 국민을 안전으로 이끄는 길을 보여 줄 것입니다. 우리는 가정을 지키고, 국민을 돌보며, 끊임없이 변하는 이 시대에 우리의 원칙을 지속시킬 방안을 모색해야 합니다."
 USA_increased_labor_reforms: "노동 개혁 확대"
 USA_increased_labor_reforms_desc: "이 나라의 노동자들은 기업이라는 돼지들 때문에 고통받고 있습니다. 우리는 노동자들을 위한 더 나은 기준을 시행하여, 이러한 임금 노예 환경에서 그들의 생산성과 삶의 질을 더 잘 북돋울 것입니다."
 USA_reforming_the_corporate_tax: "법인세 개혁"
 USA_reforming_the_corporate_tax_desc: "이 나라의 기업들은 세금 허점과 부를 쌓아 두는 능력의 요새 속에서 살고 있습니다. 우리는 그들에게 집어치우라고 말하고 그들이 머무는 국가에 집중하도록 해야 합니다. 그들의 국민과 해당 국가를 도와 생활 수준이 전반적으로 나아지게 해야 합니다."
 USA_workers_welfare_act: "노동자 복지법"
 USA_workers_welfare_act_desc: "노동자의 복지를 강제하는 것은 우선순위가 되어야 합니다. 부패한 고용주들이 그렇지 않음을 보이더라도 국민이 의지할 안전망을 가질 수 있음을 보여 주기 위해 자금을 제공할 것입니다. 이는 쓰러진 이들이 다시 일어설 방법을 찾는 데도 도움이 될 것이며, 지역 공동체 행사 등은 자기 가치감과 다시 일에 복귀하려는 의욕을 불러일으킬 것입니다."
 USA_department_of_economic_management: "경제 관리부"
 USA_department_of_economic_management_desc: "DoEM은 우리 사회주의 사회에 진정한 공공 소유를 이해하고, 규제하고, 도입하도록 돕는 정부 감독 부서가 될 것입니다. 우리는 마르크스의 말을 설파하는 한편, 사고가 더 폭넓은 이들도 살펴봅니다. 로버트 오언과 그의 윤리적 사회주의, 마르크스 자신이 \\"공상적\\" 사회주의라 부른 것을 살펴봅니다. 그러나 시장 사회주의자에게서도 영감을 얻으며, 우리는 주택의 상품화를 해체하고 현대인의 진정한 기본 필요를 서서히 이해할 것입니다. 거기서부터 벌 수 있고 물론 벌어낼 수 있는 이들을 위한 욕구 시장을 개혁할 것입니다."
 USA_national_unions_act: "전국 노조법"
 USA_national_unions_act_desc: "국가의 노조들은 자기들끼리의 내분으로 흩어져 있습니다. 우리는 이들을 하나의 전국 단체 아래 통합해야 하며, 이 소규모 노조들 내부의 선동가들을 찾아 분쇄하고 공통의 국가적 목표 아래 통합해야 합니다. 대중은 단일 전선을 요구하며, 우리는 현학적 논리의 파편들로 싸워서는 안 됩니다. 우리는 대중과 그들의 필요, 신념과 대의에 대한 이해의 통일을 만들어내는 데 집중하는 새로운 사회주의 사회가 되어야 합니다."
 USA_political_science_reforms: "정치학 개혁"
 USA_political_science_reforms_desc: "정치와 이념에 대한 생각은 우리가 사는 이른바 \\"탈진실\\" 시대에 너무 혼란스러워 합리성과 이성의 진정한 기준을 세워야 합니다. 국가가 의무화한 자금 지원을 받는 우리 과학계는 민감한 주제에 접근하는 편제를 만드는 데 활용될 것입니다. 예컨대 이념의 개념에서, 이념은 경제적 배경과 사회적 배경 모두에 걸친 폭넓은 신념의 집합입니다. 이를 통해 이념은 좌도 우도 아니며 개인의 결합된 신념에 따른 주관적인 것임을 알 수 있습니다. 따라서 원래 경제에 대한 입장을 가리키는 데 쓰였던 좌우라는 옛 구분은 문화와 사회 전반이 변화하는 이 새 시대에 완전히 효력을 잃었습니다. 기술 자체가 혼란의 큰 원인이며, 따라서 새로운 발견을 전반적으로 더 잘 연구하고 이해하고 도입하도록 도와야 합니다."
 USA_department_of_state_security: "국가 보안부"
 USA_department_of_state_security_desc: "DoSS는 국가 내에 있는 여러 국가 보안 부서를 통합할 연방 합동 감독 위원회가 될 것입니다. 이 서로 다른 부서들은 저마다의 목표를 가지고 있으며 국내 또는 해외 사안의 중요성을 두고 서로 다툽니다. 우리는 이 파벌주의를 끝내고 이 양면에 접근하는 통합된 정책을 마련해야 합니다. 대중을 지키기 위해 무엇보다 국내 문제에 집중해야 하지만, 국내 접근을 강화하려면 우리에 대한 외국의 침투를 이해해야 합니다. 우리 사회를 한 조각씩 뜯어내려는 자들로부터 사회를 지켜야 합니다."
 USA_socialist_militarism: "사회주의적 군국주의"
 USA_socialist_militarism_desc: "국가의 군국주의는 언제나 제국주의적 논리에 이용되어 왔습니다. 이라크에서처럼 군대를 직접 동원하거나 광범위한 군사 기지망을 통해 간접적으로 국가들의 자원을 착취하는 것이 세계가 우리를 미워하게 만드는 원인입니다. 우리는 서서히 현대의 병사를 전역시키고 재교육해야 합니다. 대중과 사회주의의 대의, 정의롭고 더 공정한 세계의 대의에 봉사한다는 진정한 가치를 이해하는 병사로 말입니다. 우리는 대중이 자신의 대의를 위해 싸울 수 있도록 동원할 것이며, 이 여정을 이끄는 것은 국가입니다."
 USA_socialized_healthcare: "사회화된 의료"
 USA_socialized_healthcare_desc: "대중은 국가와 국민의 복지에 대한 진정한 돌봄을 요구합니다. 우리는 사람들이 딛고 설 진정한 바닥을 만들기 위해 보편적 투자를 일으킬 것입니다. 우리가 제공하는 돌봄은 효력을 잃고 편향된 규제를 무효화하고, 실질적이고 집행 가능한 기준을 만들며, 민간과 공공 부문이 함께 비용을 부담하는 방식으로 이루어질 것입니다. 도움이 필요한 이들을 돕기 위해 노력할 것입니다."
 USA_appeasing_rising_commissars: "부상하는 정치위원 달래기"
 USA_appeasing_rising_commissars_desc: "군의 가치를 재편하고 재교육한 것은 안타깝게도 옛 질서마저 맞닥뜨린 현실로 이어졌습니다. 군 내부의 언론 인사들이 지지를 유지하는 조건으로 요구를 내놓았습니다. 도움보다는 부담이 될 수 있지만, 장기적으로는 국가의 안정이 중요합니다."
 USA_appeasing_trotskyist: "트로츠키주의자 달래기"
 USA_appeasing_trotskyist_desc: "연립은 언제나 강력한 트로츠키주의자 분파에 시달려 왔으며, 이 급진파는 세계 혁명 사고방식을 강제하려 하여 사회주의의 가치를 알리는 우리의 능력을 훼손하려 합니다. 1921년 소비에트-폴란드 전쟁에서 소련이 패한 것도 바로 이와 같은 오만 때문이었습니다. 우리는 그들에게 중요한 사안, 특히 해외 영향력을 강화하기 위한 안보 조치 자금에 대해 표적화된 표현을 만들어야 합니다. 이는 국내에는 도움이 되지 않겠지만 세계에 우리의 흔적을 남길 것입니다."
 USA_appeasing_the_anarchist_society: "아나키스트 사회 달래기"
 USA_appeasing_the_anarchist_society_desc: "아나키스트 사회는 우리가 붙들고 있는 사회주의 연립 정당의 강력한 분파입니다. 그들이 우리와 함께 머물도록 설득하려면 국가라는 개념을 상당 부분 줄여야 합니다. 이는 아프겠지만 앞으로 서서히 그들을 꺼뜨릴 수 있습니다."
 USA_weaking_global_economics: "세계 경제 약화"
 USA_weaking_global_economics_desc: "보호무역주의라는 세련된 표현을 통해 우리는 사실상 세계 시장과의 단절을 계획하게 될 것입니다. 보호무역주의는 사람들에게 여전히 우리와 무역하고 우리를 착취할 수 있다는 생각을 심어 주지만, 우리는 더 잘 알고 있습니다. 우리의 아나키스트 경제는 국내 공급망이 국내 수단으로 충족되도록 보장할 것입니다. 이는 경제적으로 전반적인 밀고 당기기 효과를 낳을 것입니다. 그러나 기억하십시오. 느리지만 꾸준한 쪽이 경주에서 이기며, 우리는 충분히 느리게 움직여 왔다고 생각합니다."
 USA_the_communes_act: "코뮌법"
 USA_the_communes_act_desc: "코뮌법은 도시 중심지를 분산하고 분권화하기 위해 마련된 입법입니다. 이는 느린 과정이겠지만, 말하자면 서서히 탈산업화하고 국가로서 우리가 가진 광대한 땅으로 사람들을 돌려보내려는 구상입니다. 이 새로운 코뮌은 인근에 이미 자리 잡은 읍과 마을과 연계하여 운영될 수 있습니다. 이는 필요한 서비스에 대한 정부 감독을 줄여 정부의 장악력 또한 약화시키면서도, 국가의 국내 방위 이상을 강화할 것입니다."
 USA_communal_hospitals_act: "공동체 병원법"
 USA_communal_hospitals_act_desc: "C.H.A.는 지역 의사와 의료에 뜻이 있는 이들이 주도적으로 지역 의료 시설을 조직할 수 있도록 더 많은 의료적 자유를 부여하기 위해 의회가 통과시킨 법안입니다. 이러한 지역 또는 공동체 병원은 해당 지역 주민의 필요를 돌볼 수 있을 것입니다. 이는 일부 연방 의무 사업의 필요를 줄이고, 필요가 생길 때 지역화된 코뮌들이 서로의 병자를 돌보는 일을 분담하도록 해줄 것입니다."
 USA_revolutionary_industrialism: "혁명적 산업주의"
 USA_revolutionary_industrialism_desc: "세계 경제는 권위주의 중국이라는 거짓된 \\"사회주의\\" 국가를 중심으로 돌아가고 있습니다. 우리가 이를 바꿀 것입니다. 미국 산업주의의 새 시대가 새로운 시대를 형성할 것입니다. 이를 통해 우리는 우리의 이상을, 우리의 혁명 자체를 수출할 수 있습니다. 중국이 WTO에 침투한 이래로 줄곧 해 오려던 것처럼 말입니다."
 USA_enhancing_state_security: "국가 보안 강화"
 USA_enhancing_state_security_desc: "혁명을 지키려면 국가 안보 기구가 최우선 과제가 되어야 합니다. 혁명과 그 국민이 자본주의와 권위주의라는 외국 개들에게 시달리지 않도록 이 기관들에 더 많은 투자를 해야 합니다."
 USA_revolutionary_integrity: "혁명적 온전성"
 USA_revolutionary_integrity_desc: "이 나라의 국민은 극히 다양합니다... 혁명을 앞으로 추진하려면 이는 문제가 됩니다. 우리 국민의 결속이 보장되어야 하며, 따라서 이러한 개념을 학교 교육과 시민권 시험에 통합해야 합니다. 그러나 최종 목표에 대한 조기 반대를 낳지 않도록 지나치게 노골적이어서는 안 됩니다. 혁명을 위하여, 인민의 복리를 위하여."
 USA_strengthening_officer_influence: "장교 영향력 강화"
 USA_strengthening_officer_influence_desc: "군은 국가의 이상, 국민, 그리고 대의를 수호하는 원동력입니다... 이를 염두에 둘 때 우리의 군 지도자들은 싸울 준비와 의지와 능력을 갖추고, 그 싸움이 무엇을 위한 것인지 정확히 알아야 합니다. 장교의 봉급 등급을 높이고 전선과 본토 양쪽의 훈련을 개선하면 우리는 이 새로운 방향으로 나아갈 수 있을 것입니다."
 USA_setting_a_new_bar: "새로운 기준 설정"
 USA_setting_a_new_bar_desc: "우리 병사들은 지도자들과 마찬가지로 최고의 자질과 최고의 인품을 갖추어야 하며, 혁명 그 자체를 위한 최고의 인재여야 합니다. 우리의 남녀 장병은 최고 수준의 기준으로 혁명을 위해 목숨을 바칠 각오가 되어 있어야 합니다. 따라서 우리는 전투와 시민적 결속 모두에서 더 높은 새로운 훈련 기준을 세울 것입니다. 매월 병력 풀은 줄어들 수 있지만, 질은 양만큼이나 중요하다는 점을 기억하십시오."
 USA_expansion_of_jrotc_programs: "JROTC 프로그램 확대"
 USA_expansion_of_jrotc_programs_desc: "그들은 자기 몫을 다하고 있습니다. 당신은 어떻습니까. 붉은 국가 기관들은 여러분을 필요로 하며, 오늘 여러분의 학교에 있는 수많은 주니어 예비역 장교 훈련단 프로그램에 참여하면 일찍부터 무료로 경험을 쌓을 수 있습니다. 이 나라 청소년에게 의무와 명예와 자부심을 심어주기 위해 학교 제도에 자금이 투입될 것입니다. 그들의 아버지와 형제, 어머니가 어떤 대의를 위해 입대했는지 보여줄 것입니다. 진정한 혁명가의 길을 보여주면 그들은 진심으로 더 알고 싶어 할 것입니다."
 USA_restructuring_debt_payments: "부채 상환 구조조정"
 USA_restructuring_debt_payments_desc: "국가 부채가 이해할 수 있는 범위를 넘어선 만큼, 우리는 갚아야 할 빚을 갚을 계획임을 강력하게 보여주어야 합니다. 실패한 특정 지출에 대한 제한적이고 과감한 삭감은 우리 부채의 재조정 합의를 이끌어낼 것이며, 이 설득을 통해 금리를 낮추는 동시에 이를 홍보 행사로 삼아 통화로서의 달러에 대한 신뢰를 일부 회복하기를 기대합니다."
 USA_reducing_failed_programs: "실패한 프로그램 축소"
 USA_reducing_failed_programs_desc: "우리는 대중에게 명백한 실패 프로그램을 삭감하는 것으로 개혁의 길을 시작할 것입니다. 야당은 이를 자기 이익에 이용하겠지만, 우리는 감세와 일반 노동자의 급여 명세서에서 눈에 띄는 회복으로 현실을 증명할 수 있습니다."
 USA_reforming_failing_programs: "부실 프로그램 개혁"
 USA_reforming_failing_programs_desc: "지금의 정치 환경에서 모든 것을 단번에 잘라내는 것은 자살행위이므로 그럴 수는 없지만, 임박한 실패의 충격을 상쇄하거나 한때 부실하다고 여겨진 프로그램을 바로잡는 쪽으로 대대적인 개혁을 추진할 수 있습니다."
 USA_common_sense_regulations: "상식적 규제"
 USA_common_sense_regulations_desc: "우리나라의 많은 규제는 이익 단체와 기타 불미스러운 부류에 기반하고 있습니다. 우리는 기업 운영, 노동자 보호 등 모든 것에 관해 상식에 입각한 규제를 추가하는 것으로 시작할 것입니다."
 USA_common_knowledge_deregulations: "상식적 규제 철폐"
 USA_common_knowledge_deregulations_desc: "규제 절차를 거친 다음에는 이렇게 조여진 허리띠에 맞서 이른바 다른 옷가지를 느슨하게 풀어야 합니다. 규제에 적용되는 원칙은 규제 철폐 부문에도 거의 열 배로 적용됩니다. 우리는 이를 개혁하여 모두에게 더 균형 잡히게 만들어, 돈 있는 이들의 필요보다 다수의 필요를 우선시할 것입니다."
 USA_limited_economic_reforms_promise: "제한적 경제 개혁 공약"
 USA_limited_economic_reforms_promise_desc: "우리 경제, 재정, 국내 정책과 프로그램에 걸친 국가 현안에 대한 강력한 의회 개혁을 통해, 우리는 더 나은 연방, 더 나은 국가, 그리고 국민의 복리 증진으로 가는 길을 열었습니다."
 USA_domestic_policing_reforms: "국내 치안 개혁"
 USA_domestic_policing_reforms_desc: "법 집행의 군사화 확산은 예산을 잡아먹는 큰 요인이며 사회가 해체해야 할 시한폭탄입니다. 따라서 기존 예산을 활용하고 입법을 통해 군사화 요소를 줄이면 법 집행이 개선되고 국민이 법 집행에 갖는 인상도 누그러질 것입니다."
 USA_pro_americare: "프로 아메리케어 법"
 USA_pro_americare_desc: "프로 아메리케어 법은 현행 체계의 행정 부담을 줄이고, 그에 따라 국민에게 더 많은 돈을 돌려주며 더 나은 형태의 의료를 받을 수 있게 하는 의료 개혁법입니다."
 USA_blue_star_reforms: "블루 스타 개혁 법"
 USA_blue_star_reforms_desc: "BSRA는 현재 수렁에 빠진 복지 프로그램에 접근하여, 개별적으로 만들어진 이 프로그램들을 상당수 축소하고 표준화하며 통합하려는 법안입니다."
 USA_reforming_the_road_of_promise: "약속의 길 개혁"
 USA_reforming_the_road_of_promise_desc: "수년에 걸쳐 우리는 길을 닦아 왔습니다. 개혁과 진보의 길입니다. 이에 우리는 다가오는 선거에서 이 여정을 이어, 더 나은 국가와 더 나은 국민, 더 나은 미래를 위한 길을 닦고자 합니다."
 USA_another_victory_for_reform: "개혁을 위한 또 하나의 승리"
 USA_another_victory_for_reform_desc: "개혁당이 우리 조국을 위해 또 한 번의 승리를 거두었습니다. 창당자 로스 페로가 그토록 아끼던 이 나라의 연방 정부에 자신의 이상이 닿은 성공을 알았다면 우리를 보며 미소 지었을 것입니다."
 USA_top_hat_act: "톱 햇 법"
 USA_top_hat_act_desc: "톱 햇 법은 기업과 사업체가 규모를 키우면서 단순히 급여 인상을 \\"표결\\"로 정해 직원들과 진정으로 더 힘든 일을 하는 이들을 박탈하지 못하도록 제한을 보장할 것입니다. 사업체의 직원 수와 전체 규모, 필수 운영을 위한 순이익률을 기준으로 일정한 상한을 두는 틀을 만들면 모든 노동자에게 적절히 보상하는 방법을 정할 수 있을 것입니다. 부두의 청소부에서 CEO 본인에 이르기까지 말입니다."
 USA_corporate_desharing_act: "기업 지분 분리 법"
 USA_corporate_desharing_act_desc: "CDS 법은 공개 법인으로 증권거래소에 등록된 기업의 내부 독점화를 규제하기 위한 법안입니다. 이는 기업 소유주와 대기업 내 상위 직원이, 자신이 현재 또는 최근 근무한 직장의 직접 경쟁사에 대해 일정 한도를 넘는 지분을 살 수 없음을 뜻합니다. 이는 겉으로는 경쟁이라는 명분 아래 수직적·수평적 독점화로 이어질 수 있는 내부자 형태의 거래를 막기 위한 것이며, 실상은 산업들이 집단적 독점을 형성했을 가능성이 큽니다."
 USA_anti_insider_trading_act: "내부자 거래 금지 법"
 USA_anti_insider_trading_act_desc: "모든 개혁의 어머니이자, 개혁당을 선택하면 변화가 확실하다는 것을 대중에게 보여주는 진정한 증표입니다. 이 법은 의원과 그 직계 가족이 미합중국 안팎에서 일정 시장 점유율과 영향력을 가진 증권거래소 상장 기업의 주식을 거래하는 것을 막을 것입니다. 우리는 거센 반대를 예상하지만, 무슨 일이 있어도 이를 통과시킬 것입니다."
 USA_spearing_the_fat_cat: "살찐 고양이 사냥"
 USA_spearing_the_fat_cat_desc: "탐욕은 부유한 이들을 집어삼킵니다. 평범하고 공정한 기업인들은 단지 그들 자신이라는 이유로 많은 비난을 받지만, 이 성실한 사색가들과 기획자들에게 오명의 악취를 퍼뜨리는 자들이 있습니다. 따라서 우리는 이런 나쁜 평판을 걷어내고 진정한 사업주이자 일자리 창출자의 명성을 바로잡아야 합니다."
 USA_fearing_the_little_rat: "작은 쥐를 두려워하다"
 USA_fearing_the_little_rat_desc: "강자는 늘 약자를 두려워하고 그 반대도 마찬가지입니다. 이를 통해 우리는 청년 남녀의 징집을 줄이고 국민이 국내 기반의 생활을 하도록 장려해야 합니다. 이는 상류층을 달래는 동시에, 목숨을 거는 것 같은 극단적인 일을 하지 않아도 하층민이 더 성취감을 느끼게 할 것입니다."
 USA_saving_for_a_suit_and_hat: "정장과 모자를 위한 저축"
 USA_saving_for_a_suit_and_hat_desc: "대학에 가야 한다는 이른바 필요에 떠밀리는 이들의 부담은 근본적으로 잘못되었습니다. 우리는 고등 교육에 대한 정부 개입을 줄이고, 사람들이 일자리를 얻고 업무 경험을 쌓는 방식을 개혁해야 합니다."
 USA_economic_backbone: "경제의 근간"
 USA_economic_backbone_desc: "경제의 근간은 늘 이 나라 거리에 흩어져 있는 영세 가게들이었습니다. 우리는 이들의 확장과 설립 용이성을 위해 일부 규제를 바꾸어야 하며, 이러한 신선한 숨결을 불어넣으면 사람들이 일터에서 더 잘 지원받게 되어 생산성이 오를 것으로 기대합니다."
 USA_searing_the_fake_act: "가짜 낙인 법"
 USA_searing_the_fake_act_desc: "우리 영토에 대한 많은 외국인 투자에는 행간에 숨겨진 조치들이 따라붙었습니다. 이를 알게 된 이상 우리는 이 문제에 정면으로 맞설 것이며, 전적으로 순이익이 되지는 않더라도 외국의 간섭 속에서 우리나라의 신성함을 온전히 지켜낼 것입니다."
 USA_reformed_economy: "개혁된 경제"
 USA_reformed_economy_desc: "나라는 지금 시대에 맞는 개혁의 정점에 있으며, 아직 할 일이 남아 있기는 하지만 국민과 국가 전체에 번영과 자부심의 미래가 열려 있습니다. 국내 상황에 대한 국민의 신뢰는 지난 몇 년간 치러진 모의 전쟁과 훈련의 최근 효율성 시험에서 군 장병들이 보여준 끈기와 활력과도 거의 맞닿아 있습니다. 새벽이 나라에 찾아왔습니다. 새로운 시대의 새벽입니다."
 USA_reinforcing_the_living_document: "살아 있는 문서 강화"
 USA_reinforcing_the_living_document_desc: "이 나라를 세운 문서인 헌법은 법치의 근간입니다. 우리는 입헌 공화국이며, 따라서 이를 훼손하려는 이들에게 이것이 확고한 사실임을 분명히 하는 데 전력을 다해야 합니다. 그러므로 이러한 사실을 공고히 하는 연방 의무 입법을 제정하여, 건국 문서를 직접적이고 악의적으로 훼손하려는 자에게 벌금 또는 징역에 처하도록 할 것입니다."
 USA_shaving_left_wing_excesses: "좌익의 과잉 깎아내기"
 USA_shaving_left_wing_excesses_desc: "현대 자유주의자들은 우리 위대한 국가의 헌법적 가치를 훼손하고 노골적으로 무시해 왔습니다. 그들은 헌법을 실행 가능한 대안으로서 내던지는 것을 받아들이는 기현상을 만들어내는 입법을 통과시켰습니다. 우리는 이러한 변화를 되돌리고 쇠락하는 아메리칸 드림을 바로잡을 것입니다."
 USA_shaving_fake_right_wing_fodder: "가짜 우익의 먹잇감 깎아내기"
 USA_shaving_fake_right_wing_fodder_desc: "이 나라의 이른바 우익은 오합지졸과 노골적인 가짜들로 가득합니다. 네오콘이라 불리는 이들과 그 아류 이념가들은 오직 정부만이 문제를 해결할 수 있다는 거창한 생각으로 우리 시민들을 속이고 건국 원칙을 훼손하려 합니다. 우리는 이 반역을 꿰뚫어 보고 이러한 변화를 되돌리고 바로잡기 위해 총력을 다할 것입니다. 대기업에 대한 정부 보조금부터 시작합니다."
 USA_de_looping_the_holes: "허점의 고리 풀기"
 USA_de_looping_the_holes_desc: "이 나라의 세법은 엉망입니다. 겹치는 예산, 배분의 비효율, 아무 쓸모도 낳지 못하는 예산이 그대로 있습니다. 우리는 이를 삭감하고 개혁한 다음, 정부가 사실상 국민에게서 빼앗은 돈을 되돌려줄 것입니다. 이는 우리의 수요를 줄이고 국민을 도울 것이나, 살찐 고양이들은 이런 가혹한 조치를 달가워하지 않을 수 있습니다."
 USA_states_rights_commission: "주권 위원회"
 USA_states_rights_commission_desc: "우리 헌법을 무너뜨린 구질서는 이 나라의 심장부에까지 타격을 주었습니다. 연방 정부 기관이 내린 일괄적인 결정 때문에 수천 명이 매일같이 고통받고 있습니다. 이는 시련이며, 더는 안 됩니다. 독립 위원회를 통해 원래 국민과 각 주의 것이었던 바를 되돌려주겠습니다."
 USA_second_amendment_first_priority: "수정 제2조, 최우선 과제"
 USA_second_amendment_first_priority_desc: "나라의 배신자들. 오랫동안 곪아 온 한 무리가 총이 사람을 죽인다는 인식을 대중의 머릿속에 심어 놓았습니다. 현실은 사람이 그 무기를 사용해 사람을 죽인다는 것입니다. 우리는 국내든 외국이든 어떤 침략자에 맞서서든 무기를 소지할 헌법적 권리를 최대한 행사하는 책임 있는 방식을 표준화해야 합니다."
 USA_constitutional_welfare: "헌법적 복지"
 USA_constitutional_welfare_desc: "나라가 입은 피해는 심리적 수준에 있습니다. 이를 바로잡으려면 우리는 메시지에서 은근하되 단호해야 합니다. 헌법과 국가에 봉사하면 그들 또한 여러분에게 봉사할 것입니다. 복지는 우리 국민을 위한 것이지만, 그 가치를 수호하는 이들이 무엇보다 우선되어야 합니다. 이는 그 가치를 파괴하려는 이들에게 보내는 강력한 상징입니다."
 USA_constitutional_healthcare: "헌법적 의료"
 USA_constitutional_healthcare_desc: "이 나라의 시민들은 어려울 때 보살핌을 받아야 합니다. 이전 공화당과 민주당의 영향이 낳은 오류를 걷어내기 위한 개혁이 진행 중입니다. 각 주는 지역 의료를 운영할 수 있고, 연방 정부도 헌법적 가치를 수호하고 지키는 시민들에게 자체 의료를 제공할 수 있습니다."
 USA_constitutional_securities: "헌법적 안전 보장"
 USA_constitutional_securities_desc: "지리적으로 다양한 이 땅들을 연결하고 성장시키는 국가 기반시설과 개발은 중요한 임무입니다. 연방 정부는 발전소와 항구 등 중요한 기반시설을 보호할 지원자를 모집해야 합니다. 적절한 유인과 훈련이 있다면 우리는 이 나라를 살고, 건설하고, 번영하려는 이들이 이상적인 삶을 누릴 수 있는 안전한 나라로 만들 수 있습니다."
 USA_living_document_living_nation: "살아 있는 국가를 위한 살아 있는 문서"
 USA_living_document_living_nation_desc: "나라와 건국 문서, 그리고 이 공화국의 시민들은 길을 보았습니다. 위대한 미국의 실험이 계속됨을 기뻐하는 이들에게 빛은 밝습니다."
 USA_constitutional_wins_again: "라이노의 전진"
 USA_constitutional_wins_again_desc: "살아 있는 문서가 강화되면서 우리의 이상이 신선한 공기로 현실에 불어넣어졌습니다. 이 새로운 승리는 우리 소중한 국가 가치의 지속적인 성공을 새로운 경지로 끌어올릴 것입니다. 라이노는 전진하며, 배신자들은 두려워하고 사라질 것입니다."
 USA_founders_act: "건국자 법"
 USA_founders_act_desc: "건국자들은 과거가 미래를 억누르는 것을 원치 않았을 것입니다. 따라서 우리는 당대 선각자들의 지혜를 구하고 이를 지금에 충분히 적용할 것입니다. 교육 제도의 통일성을 감당하지 못하는 주들에 대한 예산을 늘릴 것입니다. 주가 바닥을 만들고, 우리는 그들이 천장에 닿아 그것을 돌파하도록 돕습니다."
 USA_modern_age_act: "현대 법"
 USA_modern_age_act_desc: "For all men are created equal. This quotation is what America was founded on. Tolerance is her beacon, her drive and her purpose. Legalization and enforcement of secular understandings of human decency and of same sex couples, relationships and so forth shall never be punishable by law. The constitution does not state what some men can and can't do, it states that all men can do. The people of this nation should and will be able to do right by this singular principle of our glorious modern age we live in."
 USA_scholars_interpretation_act: "학자 해석 법"
 USA_scholars_interpretation_act_desc: "SIA는 현대의 문제와 관련하여 헌법을 해석할 때의 방법론을 법적으로 의무화하는 법입니다. 그 문구는 그 시대에 맞추어 쓰였습니다. 따라서 그 언어가 바뀌면 우리는 그 시대로 돌아가 변화가 무엇이었는지, 그리고 그것이 적용되는 현실이 무엇이었는지 이해해야 합니다. 기억하십시오, 모든 인간은... 평등하게 창조되었습니다. 모든 남성만이 아닙니다... 생각해 보십시오, 학자여."
 USA_uniform_institutions_act: "통일 기관 법"
 USA_uniform_institutions_act_desc: "우리 연방 정부는 외교 정책을 엉망으로 만들어 국내 정책에서 주의를 흩뜨렸습니다. 우리는 국내외 정부 기관의 규제와 통일성에 관한 입법을 시행하여 이를 바로잡을 것입니다. 이러한 과잉의 삭감과, 그들이 사실상 통제하려던 국가들에 대한 투자를 줄임으로써, 다가오는 예산 보고서에서 감세로 우리 국민에게 돌려줄 수 있습니다."
 USA_worthy_trade_deals: "가치 있는 무역 협정"
 USA_worthy_trade_deals_desc: "우리는 생산자의 나라이지만 지난 수십 년간 소비자가 되는 데 그쳤습니다. 국내 생산과 소비를 돕는 수출을 줄이는 무역 협정을 통해 균형을 찾고 우리 산업의 새로운 부흥을 이끌 것입니다."
 USA_historical_rationalism_act: "역사적 합리주의 법"
 USA_historical_rationalism_act_desc: "현대의 문화주의가 우리가 역사를 인식하고 이해하는 방식을 오염시켰습니다. 모든 것을 의심하고 이해의 시대적 배경을 살피십시오. 역사 이해의 통일성을 표준화하고 시행하는 입법이 이루어질 것입니다. 우리는 사료를 의심하고 비교하여 중립적인 이해에 도달해야 합니다. 어떤 것도 우리가 바라는 만큼 단순하지 않으므로, 이해를 단순하게 만들기 위해 합리화해야 합니다. 우리나라와 우리가 만들어 온 역사, 그리고 그 현실을 위하여. 우리는 이 새로운 통찰로 더 나은 나라를 재건하고 발전시킬 것입니다. 역사는 이름과 날짜와 장소 이상을 가르칩니다."
 USA_backyard_act: "뒷마당 법"
 USA_backyard_act_desc: "우리의 뒷마당은 더럽고 망가져 있습니다. 카르텔 침투, 총기 밀매업자, 그리고 모든 종류의 인신매매에 초점을 맞춘 연방 법 집행 기관의 개혁이 그 근간이 될 것입니다. 우리 시민은 안전해야 하며 우리의 뒷마당은 깨끗이 정리되고 보살펴져야 합니다."
 USA_tightening_national_belt: "국가 허리띠 졸라매기"
 USA_tightening_national_belt_desc: "더 많은 책임을 주에 넘기는 과정에서 겪는 어려움 때문에 예산이 부풀려져 있습니다. 따라서 우리는 추가 자금을 항상 쓰지는 않을 수 있는 프로그램과 기관에서 일부를 잘라내려 합니다. 우리가 원하는 바를 저해할 수 있으나 장기적으로는 어쨌든 도움이 될 것입니다."
 USA_one_nation_under_god: "신 아래 하나의 국가"
 USA_one_nation_under_god_desc: "우리는 세속 국가이지만 누구나 어떤 형태로든 신을 믿습니다. 신앙의 종류와 무관하게 우리가 신앙 자체의 수호자라는 이 통합 원칙을 바탕으로, 우리는 국민을 결집시켜 위대한 국민과 위대한 국가, 위대한 신앙을 지키기 위해 돌진할 것입니다."
 USA_constitutional_republic: "입헌 공화국"
 USA_constitutional_republic_desc: "민주주의는 대중의 지배이자 군중의 지배입니다. 공화국은 법의 지배입니다. 우리는 입헌 공화국, 곧 헌법이 이 땅의 최고법인 나라입니다. 우리 주위에는 전복을 꾀하는 자들이 있지만, 양당 체제가 무너진 이후 우리가 이룩하려 애써 온 방대한 성과에는 그래도 동의할 수 있습니다. 미국의 실험은 우리 모두 안에서 계속 살아 있습니다."
 USA_nationalist_front_victory: "민족주의 전선당... 승리?"
 USA_nationalist_front_victory_desc: "NFP는 우익 정치권 전반 내부의 연합 운동입니다. 당이 선거에서 승리했지만 많은 이들은 방향이나 승리 자체가 지속될지 확신하지 못합니다. 지금으로서는 국가가 반사회주의 정치와 늘어나는 이민 물결에 맞서 단결한 것으로 보이지만, 이 쟁점들이 당을 하나로 묶어둘 수 있을지는 알 수 없습니다."
 USA_american_trade_act: "미국 무역 법"
 USA_american_trade_act_desc: "영혼이 몸에 붙어 있지 않았다면 우리는 영혼마저 팔아넘겼을 것입니다. ATA는 우리가 국가 차원에서 저지르는 파괴적인 헐값 매각을 끝내고, 국내 소비와 제조업이 쓸 수 있는 상품을 더 많이 공급할 것입니다."
 USA_american_jobs_act: "미국 일자리 법"
 USA_american_jobs_act_desc: "AJA는 미국의 생산을 늘리기 위해 고안된 법입니다. 원자재에서 완제품에 이르기까지, 우리는 이 나라가 한때 알려졌던 산업의 힘을 되살릴 것입니다."
 USA_foreign_economic_subversion_act: "외국 경제 전복 방지 법"
 USA_foreign_economic_subversion_act_desc: "FES 법은 수십 년 동안 세계 저개발국의 발전과 착취를 억제하는 데 쓰여 온 전술인 신제국주의 관행에 맞서는 입장입니다. 우리는 이런 단순한 속임수에 넘어가지 않을 것이며, 따라서 일부 산업의 국유화에 착수하고 우리나라에서 활동하는 외국 전복 세력의 운영에 대한 개요와 엄격한 지침을 마련할 것입니다."
 USA_immigration_regulations_act: "이민 규제 법"
 USA_immigration_regulations_act_desc: "이전 행정부들의 거의 개방된 국경 정책은 역겹습니다. 우리는 국경 관리 방식과 경계 초소의 조직, 이민 절차를 포괄적으로 개혁할 것입니다. 이처럼 더 엄격한 방향에 많은 이들이 반발할 수 있지만, 국내 기준을 높일 수 있다면 외국 수입품은 필요하지 않을 것입니다."
 USA_american_care_act: "미국 돌봄 법"
 USA_american_care_act_desc: "우리 국민은 아무런 지원이 없으며, 너무 많이 일하는 대신 종에 대한 의무는 결코 다하지 못합니다. 가정 전체가 여러 가지 이유로 무너졌지만, 우리는 적어도 이 위대한 나라의 새 가정을 위한 제대로 된 돌봄망을 구축해야 합니다."
 USA_monroe_mondernization_act: "먼로 현대화 법"
 USA_monroe_mondernization_act_desc: "우리가 먼로 독트린으로 확립한 패권 질서는 현대 세계화의 흐름에 밀려 버려졌습니다. 그러한 무역의 중단을 강제할 수는 없지만, 우리는 반구 차원의 통제와 지휘 쪽으로 좀 더 매력적인 방안을 제시할 수 있습니다."
 USA_public_protections_act: "공공 보호 법"
 USA_public_protections_act_desc: "쓰레기 같은 자들이 이 나라의 거리를 휩쓸고 있고 우리 국민은 일하고 가족을 부양하기도 힘겹습니다. 이 법은 범죄를 최우선에 두고, 푸른 제복의 경찰이 여러분을 위해 취할 수 있는 단속의 틀을 바꿀 것입니다."
 USA_landlords_association_act: "임대인 협회 법"
 USA_landlords_association_act_desc: "이 나라의 임대인들은 인위적인 공급 부족을 일으켰습니다. 결정적 요인은 아닐지라도 핵심 요인임은 분명합니다. 이제 임대인은 임대인 협회 위원회, 곧 LAB에 등록해야 합니다. 시민들에게 공정하고 더 나은 생활 수준을 제공하기 위해 연방 품질 관리 기준이 평가될 것입니다."
 USA_united_peoples_act: "국민 단결 법"
 USA_united_peoples_act_desc: "UPA는 이 나라의 국민을 기리는 연방 공휴일을 제정할 것입니다. 국내외의 적으로부터 이 나라를 빚고 구해 낸 국민의 투쟁과 강인함, 업적을 기리는 날입니다."
 USA_anti_subversives_act: "반체제 활동 금지 법"
 USA_anti_subversives_act_desc: "공산주의자들은 너무 오랫동안 우리나라를 더럽혀 왔습니다. 우리는 이 선동가들이 조직하는 시위를 불법화하고, 일부 단체가 일반 대중에게 강요하는 체제 전복과 거의 반역에 가까운 행위를 연방 차원에서 단속하는 것으로 시작할 것입니다."
 USA_american_jobs_for_american_people: "미국인을 위한 미국 일자리 법"
 USA_american_jobs_for_american_people_desc: "AJAP 법은 경제와 미국 시민에 대한 우리의 이해를 공고히 하는 법입니다. 더 싼 대안이라는 이유로, 파코나 토조, 또는 국경을 넘어오는 누군가 때문에 완벽하게 자격을 갖춘 사람이나 신규 인력 후보가 외면당하는 일이 너무 잦았습니다. 더는 아닙니다. 미국의 일자리는 철저히 미국 시민의 몫입니다."
 USA_family_care_package_act: "가족 돌봄 패키지 법"
 USA_family_care_package_act_desc: "우리는 나라의 가족들을 돌봐야 합니다. 국민이 스스로를 돕는 모습조차 볼 수 없다면 우리가 어떻게 국민을 돌볼 수 있겠습니까."
 USA_skyline_to_space_bound_act: "마천루에서 우주로 법"
 USA_skyline_to_space_bound_act_desc: "다음 세대는 마천루를 넘어설 수 있어야 합니다. 우리가 지평선 자체를 넘어서더라도 방위의 기술적 우위를 유지할 수 있도록 새로운 훈련 프로그램과 무기 시험, 항공기에 대한 투자가 보장될 것입니다."
 USA_water_defense_act: "수상 방어 법"
 USA_water_defense_act_desc: "우리나라는 물로 둘러싸여 있으며, 우리의 세력권은 말 그대로 물에 에워싸여 있습니다. 평화와 번영의 이 시대에 우리 평화 유지군의 통행권을 보장하려면 해군이 큰 우선순위가 되어야 합니다."
 USA_national_recruitment_act: "국가 모병 법"
 USA_national_recruitment_act_desc: "우리나라의 청년 남녀는 사회의 정화조 속에서 썩도록 방치되어 있습니다. 기준을 높이면서 모병을 장려하면 의무감이 투철한 이들을 북돋우고, 군이 국내외의 적들보다 위에 선다는 이미지를 만들어낼 것입니다."
 USA_old_order_new_ideals_education_act: "구질서, 새로운 이상 교육 법"
 USA_old_order_new_ideals_education_act_desc: "그 시대의 구식 절대주의자들은 주변 현실에 끔찍하게 무지했지만, 여전히 많은 이들은 일종의 입헌 군주제가 이 시대의 불안정보다는 나을 것이라고 믿습니다. 작지만 어쩐지 서서히 늘고 있는 이 소수를 활용하려면, 과거의 이러한 실수와 그로부터 배울 수 있는 점을 포함하도록 교육 제도를 개혁해야 합니다."
 USA_administrational_reforms: "행정 개혁"
 USA_administrational_reforms_desc: "국가의 행정은 불투명한 실체로서 전국에 불신과 기만을 낳았습니다. 우리는 이를 이용해 경쟁자들을 몰아내고 현상을 서서히 바꾸어 주도권을 쥘 것입니다."
 USA_an_american_dynasty: "미국의 왕조"
 USA_an_american_dynasty_desc: "정부에 제한적 군주제적 조직과 개혁을 확립하려는 운동이 커지고 있습니다. 이에 우리는 미국의 왕조가 선출된 왕조라는 공통 요소를 중심으로 결집하여 이를 공고히 해야 합니다. 대통령이 왕이 되며 선거는 국민에 의한, 국민을 위한 것입니다."
 USA_conscessions_to_the_naturalist: "자연주의자에 대한 양보"
 USA_conscessions_to_the_naturalist_desc: "자연주의자들은 목소리가 크고 성장하는 소수입니다. 이민자에 대한 의존이 국가 인구 증가에 미친 영향을 바꿀 만한 투자는 아직 우리에게 없는 것이 사실입니다. 따라서 이민 수용에 관한 양보를 해야 하며, 성장 측면에 다소 지장이 생기겠지만 우리는 이를 해낼 수 있습니다."
 USA_conscessions_to_the_militarists: "군국주의자에 대한 양보"
 USA_conscessions_to_the_militarists_desc: "군산복합체는 미국 문화의 일부이며, 우리 지지 기반의 상당수가 그 안에 있으므로 이를 파괴할 수 없습니다. 그러나 올바른 동기가 있다면 우리는 분명히 서로 도울 수 있습니다."
 USA_conscessions_to_the_reformist: "개혁주의자에 대한 양보"
 USA_conscessions_to_the_reformist_desc: "군주주의자와 현대적 평등주의 보수주의자가 뒤섞인 개혁주의자들은 우리의 골칫거리였습니다. 이 현대주의자들은 오직 민족 정체성만을 중심으로 한 새로운 종류의 우익을 만들려 합니다. 그것은 자연주의자와 군국주의자를 소외시킬 것이므로 완전히 전념할 수는 없지만, 경찰 업무를 개혁하여 평등한 국민적 기반이라는 인식을 더 높일 수 있습니다. 결국 미국인은 미국인입니다."
 USA_more_than_20_support_for_communism_state_government_TT: "§Y[communist_state_L]§!의 지지율이 20% 초과"
 USA_more_than_20_support_for_autocracy_government_TT: "§Y[Autocracy_L]§!의 지지율이 20% 초과"
 USA_more_than_20_support_for_nat_fascism_government_TT: "§Y[Nat_Fascism_L]§!의 지지율이 20% 초과"
 USA_more_than_20_support_for_nat_autocracy_government_TT: "§Y[Nat_Autocracy_L]§!의 지지율이 20% 초과"
 USA_more_than_20_support_for_monarchist_government_TT: "§Y[Monarchist_L]§!의 지지율이 20% 초과"
 USA_expanded_mental_healthcare: "정신건강 확대법"
 USA_expanded_mental_healthcare_desc: "정신 건강 관리는 개인의 건강이라는 더 큰 그림에서 흔히 소홀히 여겨지는 측면입니다. 보험 상품은 대개 이를 보장하지 않으며, 많은 미국 시민이 이 진료비를 자비로 부담해야 합니다. 정신건강 확대법은 이러한 문제를 해결하고 보험사의 비용 부담을 덜며 그 비용을 연방 정부 예산에 편입하는 것을 목표로 합니다. 이 새 법은 기업, 일반인, 의료 제공자의 비용 부담을 연방 규제하에 두어 모든 미국 시민에게 양질의 정신 건강 관리를 보장합니다."
 USA_asteroid_mining_decision: "소행성 채굴"
 USA_asteroid_mining_decision_desc: "하늘 위 별을 향한 탐험을 통해 우리는 무제한에 가까운 자원의 잠재력을 확보하였습니다. 물론 이는 장기간의 과정과 자본을 필요로 하겠지만, 무한한 자원 확보와 그 과정의 끊임없는 개선은 우리 시민들을 우주의 세계로 초대할 것입니다."
 USA_asteroid_mining_mission: "소행성 채굴 임무"
 USA_asteroid_mining_mission_desc: "자원이 풍부한 소행성을 채취하기 위한 첫 원정을 조직할 것입니다."
 USA_pull_small_asteroid_into_orbit: "소규모 소행성을 궤도에 안착시키기"
 USA_pull_small_asteroid_into_orbit_desc: "소형 소행성을 채취해 안정적인 궤도에 올려 채굴 과정을 시작할 것입니다."
 USA_pull_moderate_asteroid_into_orbit: "중간 규모의 소행성을 궤도에 안착시키기"
 USA_pull_moderate_asteroid_into_orbit_desc: "중형 소행성을 채취해 안정적인 궤도에 올려 채굴 과정을 시작할 것입니다."
 USA_pull_large_asteroid_into_orbit: "거대한 소행성을 궤도에 안착시키기"
 USA_pull_large_asteroid_into_orbit_desc: "대형 소행성을 채취해 안정적인 궤도에 올려 채굴 과정을 시작할 것입니다."
 USA_expand_our_operations: "작전의 확장"
 USA_expand_our_operations_desc: "추가 투자를 통해 소행성 채취 및 채굴 역량을 늘려, 우리의 사업에서 더욱 큰 이익을 얻을 것입니다."
 USA_sell_mining_equipment: "채굴 장비 판매"
 USA_sell_mining_equipment_desc: "수익률이 전반적으로 이득이 되는지 의문스러워지고 있으므로, 비용을 줄이기 위해 일부 장비를 매각할 것입니다."
 USA_start_asteroid_mining: "소행성 채굴 시작"
 USA_start_asteroid_mining_desc: "우리의 첫 우주 채굴 사업을 시작하기 위해 장치를 마련하고 자금을 투입하기 시작할 것입니다."
 MEX_american_refugee_crisis: "미국 난민 위기"
 MEX_american_refugee_crisis_desc: "북쪽 이웃이 붕괴하여 그 국민이 피난길에 오르고 있으며, 우리는 최대한 많이 받아들일 수밖에 없습니다. 그들에게는 대가가 크고, 우리가 조심하지 않으면 우리에게도 대가가 그만큼 클 수 있습니다."
 CAN_american_refugee_crisis: "미국 난민 위기"
 CAN_american_refugee_crisis_desc: "남쪽 이웃이 붕괴하여 그 국민이 피난길에 오르고 있으며, 우리는 최대한 많이 받아들일 수밖에 없습니다. 그들에게는 대가가 크고, 우리가 조심하지 않으면 우리에게도 대가가 그만큼 클 수 있습니다."
 american_militarism: "미국 군국주의"
 american_militarism_desc: "미국 군대는 단연 세계에서 가장 많은 예산을 쓰는 군대(전 세계 군사비 지출의 최대 40%)이며, 미국 국민에게는 이러한 이상과 함께 군대와 참전 용사를 칭송하고 예우하는 문화가 있습니다. 그러나 새로운 시대는 새로운 문제를 가져오며, 가용 인구가 점점 늘어나는데도 이들 중 갈수록 더 많은 이들이 군 복무를 고려하는 것조차 관심 없어 보입니다. 국방부가 이처럼 식어 가는 복무에 대한 관심을 되살릴 수 있을지는 시간만이 말해 줄 것입니다."
 USA_future_eco_industry: "친환경 산업"
 USA_future_eco_industry_desc: "우리는 내일의 변화를 가져오고 오염과 지구 온난화를 막는 일을 책임질 것입니다. 우리나라가 환경과 우리의 보금자리에 막대한 피해를 입혀 왔기 때문입니다."
 USA_future_of_economy_and_real_estate: "녹색 경제와 부동산"
 USA_future_of_economy_and_real_estate_desc: "우리 당은 우리 경제와 부동산에서 수많은 문제를 관찰했습니다. 우리는 이 문제를 인식하고 있으며 환경을 개선하기 위해 우리와 함께 노력하는 이들을 지원할 준비가 되어 있습니다."
 USA_net_zero_green_house: "온실가스 순배출 제로"
 USA_net_zero_green_house_desc: "재생 에너지 개발에 대한 투자를 우선시하고 주요 부문 전반에 혁신적인 탈탄소화 전략을 도입하여 온실가스 순배출 제로를 달성합니다."
 USA_new_path_ways_for_greens: "새로운 길"
 USA_new_path_ways_for_greens_desc: "화석 연료 의존에서 벗어나는 이 전환의 영향을 받는 노동자와 지역 사회를 위한 공정한 전환으로 가는 공평한 길을 만듭니다. 재교육 기회, 영향을 받는 지역에 대한 투자, 새로 등장하는 산업의 공정한 노동 기준을 보장합니다."
 USA_greens_on_climate_change: "녹색 기후 변화 대응"
 USA_greens_on_climate_change_desc: "연방 차원에서 포괄적인 기후 회복력 조치를 추진합니다. 여기에는 기후 과학 연구와 예측 역량에 대한 투자, 해안 및 야생 동물 서식지 보전 노력의 강화, 재난 대비 및 대응 역량 구축, 지역 사회의 취약성과 필요를 계획 체계에 반영하는 것이 포함됩니다."
 USA_greens_establish_strong_private_entities: "강력한 민간 주체 확립"
 USA_greens_establish_strong_private_entities_desc: "민간 주체가 생태 피해를 악화시킨 역할에 책임을 지도록 하는 강력한 기업 책임 요건을 확립합니다. 의미 있는 지속 가능성 성과 지표 및 보고를 촉진하고 순환 경제 원칙의 채택을 장려하기 위한 법적 구조, 처벌 또는 세금 유인책을 만듭니다."
 USA_greens_development: "생태 도시화"
 USA_greens_development_desc: "도시 내 생물 다양성과 자연 복원을 강화하는 진보적 도시 정책 접근 방식을 설계합니다. 유기농 농업 관행을 지원하여 건강한 식품 선택지에 대한 접근을 넓히고, 보행 가능한 동네와 복합 용도 개발을 우선시하는 구획 갱신과 기반시설 재원 조달 모델을 통해 무분별한 확산의 부정적 결과를 해소합니다."
 USA_greens_our_energy: "모두를 위한 청정 에너지"
 USA_greens_our_energy_desc: "대규모 재정 배분으로 청정 에너지 도입 목표를 달성해야 합니다. 전국의 고속철도 및 전기차 충전망 확대에 집중하고, 재산 등급을 활용한 청정 에너지 동네와 같은 창의적인 재원 조달 방식을 통해 기존 건물의 대대적 개보수를 가능하게 하며, 전력망 안정성을 개선하기 위한 배터리 저장 연구개발을 추진합니다."
 USA_greens_our_economy: "경제 활성화"
 USA_greens_our_economy_desc: "재정 및 규제 개입을 통해 육류 소비를 적극적으로 줄이고, 육류 유래 단백질의 대체품 가격을 낮추도록 의무화합니다."
 USA_the_earth_first: "지구가 먼저다"
 USA_the_earth_first_desc: "무엇보다 환경 보호를 우선시합니다."
 USA_universal_health_care: "보편적 의료 접근"
 USA_universal_health_care_desc: "우리는 모든 미국인이 재정적 부담 없이 양질의 의료에 접근할 수 있도록 보장하는 포괄적 의료 체계를 지지합니다."
 USA_income_and_wealth_inequalities: "소득 및 부의 불평등"
 USA_income_and_wealth_inequalities_desc: "누진 과세, 공정한 경제 정책, 사회 안전망을 통해 부유층과 나머지 사회 사이에서 커지는 격차를 해소합니다."
 USA_affordable_housing: "모두를 위한 적정 가격 주택"
 USA_affordable_housing_desc: "노숙 방지를 강조하며, 모든 미국인이 적정 가격의 안정적인 주택에 접근할 수 있도록 보장하는 정책을 추진합니다."
 USA_education_and_education: "무상 양질의 교육"
 USA_education_and_education_desc: "유아기부터 고등 교육에 이르기까지 사회경제적 지위와 관계없이 모든 이가 교육에 접근할 수 있도록 보장합니다."
 USA_green_is_a_new_good_deal: "그린 뉴딜"
 USA_green_is_a_new_good_deal_desc: "기후 변화에 맞서고, 친환경 일자리를 창출하며, 지속 가능한 재생 에너지 경제로 전환하는 포괄적 계획을 선도합니다."
 USA_criminal_justice: "형사 사법 개혁"
 USA_criminal_justice_desc: "대량 투옥 종식과 경찰 개혁 등 형사 사법 체계의 구조적 문제를 다루는 공정하고 정의로운 정책을 옹호합니다."
 USA_fair_pay: "노동자 권리와 공정 임금"
 USA_fair_pay_desc: "노동자의 권리를 보호하고, 최저 임금을 인상하며, 공정한 노동 관행을 촉진하는 정책을 지지합니다."
 USA_finance_reforms: "선거 자금 개혁"
 USA_finance_reforms_desc: "정치에서 돈의 영향력을 줄이고 투명하며 공적 재원으로 치러지는 선거를 촉진하는 조치를 옹호합니다."
 USA_retirement_goals_act: "은퇴 목표 법"
 USA_retirement_goals_act_desc: "RGA는 국민이 사회보장 프로그램에 납입하는 방식을 개혁하는 법안입니다. 프로그램을 독립된 은행 계좌와 유사한 구조로 편성함으로써, 원하는 가입자는 제도에 납입할 금액도 선택할 수 있습니다. 이로써 많은 이들이 기대하는 은퇴를 더 잘 계획하고 준비할 수 있습니다."
 USA_securing_social_security_act: "사회보장 보호 법"
 USA_securing_social_security_act_desc: "정부의 개입 축소를 보완하기 위해, 삼중 S 법은 사회보장 프로그램을 정부가 보장하는 일종의 401k 프로그램으로 개혁할 것입니다. 이는 어떤 연방 기관도 프로그램을 위해 모은 돈에 손댈 수 없으며, 가입자는 적절한 보증 서류를 제출하면 긴급 상황에서 해당 기금에 접근할 수 있음을 의미합니다."
 USA_community_patrol_programs: "지역사회 순찰 프로그램"
 USA_community_patrol_programs_desc: "CPP는 지역사회가 더 잘 결속할 수 있는 방법이 될 것입니다. 특정 정부 및 경찰 지출을 삭감하여 국민에게 돌려주고, 삭감된 부문의 인력을 이러한 지역사회형 프로그램 창설에 재배치할 것입니다. 목표는 사실상 사람들이 지역사회에 더 많이 참여하도록 표준화하고 촉구하며, 전국에 퍼져 있는 반쯤 실용적인 자율 방범 체계를 한층 개선하는 것입니다."
 USA_deurbanization_act: "탈도시화 법"
 USA_deurbanization_act_desc: "탈도시화 법은 우리가 나라와 경제, 국토, 자원, 국민을 바라보는 방식을 전면적으로 개편하는 법입니다. 너무 오랫동안 우리나라는 점점 더 좁은 공간에서 점점 더 많이 성장해 왔습니다. 이러한 추세가 계속되면서 소수의 행위만으로도 공동체가 쉽게 파괴되고 서로에 대한 불만과 증오만 불러일으켰습니다. 그러나 이제 우리는 탈도시화라는 거대한 사업을 시작할 것입니다. 이는 우리가 가진 땅과 자원을 활용하고, 사람들이 이주하여 새로운 삶을 시작함에 따라 농업과 교통의 발전을 촉진하는 과정입니다. 아메리칸 드림은 이 현대에 다시 태어날 것입니다."
 USA_deurbanizing_new_england: "뉴잉글랜드 탈도시화"
 USA_deurbanizing_new_england_desc: "우리는 미국 도시화의 심장부인 북동부에서 시작합니다. 흔히 짐작하듯 북동부는 좁은 곳에 너무 많은 인구가 몰린 대표적 사례이며, 상당한 땅이 남아 있는 주들조차 실제로는 해안선 주변에만 집중되어 있습니다. 이를 바탕으로 DUA의 첫 단계가 시작될 것입니다. 인구가 적은 지역으로 이주하려는 이들에게는 수당과 보조금이 지급될 것입니다. 이는 새로운 농장과 마을, 사업체 전반을 세우는 데 쓰일 것입니다."
 USA_deurbanizing_florida: "플로리다 탈도시화"
 USA_deurbanizing_florida_desc: "아, 플로리다, 은퇴자의 주... 문제는 은퇴와 관광이 안정적인 경제를 이룰 만하지 못하다는 점입니다. 애틀랜타는 조지아 전역으로 더 잘 분산되겠지만, 남부의 주된 문제는 플로리다입니다. 그래서 의향이 있는 이들에게 장려 프로그램을 보낼 것이며, 아칸소와 미시시피 같은 주들을 다른 남부 주들 수준으로 끌어올릴 계획입니다. 이 주들은 남부에서 인구가 가장 적고 내부 집중도가 높지만, 인구가 유입되면 그 비율도 완화될 것입니다."
 USA_deurbanizing_the_rust_belt: "러스트 벨트 탈도시화"
 USA_deurbanizing_the_rust_belt_desc: "이 나라의 러스트 벨트는 이유가 있어 그렇게 불립니다. 정부가 국가 간 시장의 세계화에 맞추어 이 거점들을 바꾸고 적응시키지 못한 탓에 집중되어 있던 산업이 시간이 지나며 갑자기 끊겼습니다. 따라서 우리는 인구가 밀집한 주의 주민들에게 제공할 수 있는 모든 것을 제공하고, 인구가 적은 주의 주민들도 돕고자 합니다. 탈도시화의 성전은 거의 완료되었습니다."
 USA_deurbanizing_texas: "텍사스 탈도시화"
 USA_deurbanizing_texas_desc: "텍사스에서는 모든 것이 더 큽니다... 도시 중심지의 인구까지도 말입니다. 텍사스는 대체로 주민을 넓게 퍼뜨리기만 하면 되며, 상당수는 이웃 주로 이주하여 지역을 채우고 지역 전체의 경제와 상호 연결성을 더 낫게 재건할 수 있습니다."
 USA_deurbanizing_california: "캘리포니아 탈도시화"
 USA_deurbanizing_california_desc: "이 프로그램 전체의 최대 난관, 캘리포니아입니다. 3천만 명이 넘는 인구가 있으므로 이들을 널리 분산시킬 여지가 충분하며, 이를 통해 태평양 및 서부 인접 주 전체를 괴롭히기 시작한 수자원도 더 잘 균형 잡을 수 있습니다."
 USA_tackling_blue_administration: "블루 테이프 행정 해결"
 USA_tackling_blue_administration_desc: "양당 체제의 민주당은 모든 프로그램의 행정 부문을 지나치게 짓눌러 왔습니다. 한꺼번에 모든 것을 할 수는 없지만 가장 큰 문제부터 다룰 수 있습니다. 바로 미국 의료 제도입니다."
 USA_dealing_with_blue_welfare: "당나귀 복지 대응"
 USA_dealing_with_blue_welfare_desc: "우리의 행정 개혁 운동은 계속 진행 중입니다. 의료를 처리했으니 이제 복지로 넘어갑니다. 거의 모든 프로그램의 행정이 책임과 규제, 규칙의 이리저리 떠넘김에 가로막혀 있으니, 노년층과 젊은 세대 사이에 그토록 많은 불안이 번진 것도 무리가 아닙니다."
 USA_balancing_education_needs: "교육 수요 균형"
 USA_balancing_education_needs_desc: "공화당과 민주당의 교육 개혁이 오락가락하면서 수렁에 빠졌고 이 나라의 교육 수준은 심각하게 하락했습니다. 우리는 양측을 모두 살피고 두 곁들이 요리를 하나의 주요리로 제대로 소화하고 결합하여, 청소년들이 두뇌와 미래의 전망을 위한 온전한 학습의 식사를 즐길 수 있도록 해야 합니다."
 USA_compromising_red_tape_deregulation: "레드 테이프 규제 철폐 절충"
 USA_compromising_red_tape_deregulation_desc: "공화당은 대기업에 지나치게 우호적이었습니다. 우리는 사업이 좋은 것임을 이해하지만 모든 사업이 좋은 것은 아닙니다. 월스트리트에서 권력을 되찾아 메인스트리트에서 살고 일하는 이들에게 돌려주는 제2의 운동을 시작해야 합니다."
 USA_dealing_with_red_security: "붉은 안보 대응"
 USA_dealing_with_red_security_desc: "이른바 위대한 구당은 군사비와 국내 보안 지출을 올리며 신나게 즐기는 듯한데, 이는 국민의 복리를 위해 필요한 돈을 앗아갔습니다. 군산복합체의 신병 모집 노력과 국내 보안 기구의 일부 강압적인 프로그램을 줄이더라도 국민은 여전히 똑같이, 아니 더 안전하다고 느낄 것이며, 게다가 자신의 돈이 모두 미심쩍은 사업에 들어가지 않는다는 것도 알게 될 것입니다."
 USA_democratic_care_reform: "민주당식 의료 개혁"
 USA_democratic_care_reform_desc: "민주당 전국위원회가 균형 잡힌 정당은 아니지만, 의료에 관한 그들의 구상은 어느 정도 올바른 방향이었습니다. 우리는 이 사업을 정교하게 다듬고 현행 제도에서 어떤 진정한 이점이 나올 수 있는지 이해해야 합니다."
 USA_education_baseline_act: "교육 기초 기준 법"
 USA_education_baseline_act_desc: "EBA는 청소년이 교육 제도에 처음 들어올 때 어떻게 도입하고 가르칠지를 살필 것입니다. 이를 토대로 이 어린이들이 배워야 할 핵심 사항, 곧 숫자와 글자, 그리고 함께 또는 홀로 일할 때의 사회적 기술의 조기 습득을 전국 수준에서 개혁하고 더 잘 표준화할 것입니다."
 USA_military_modernism: "군 현대화"
 USA_military_modernism_desc: "전쟁의 양상 자체가 변하고 있는 만큼 우리도 그에 맞춰 변해야 하며, 이를 위해 병사들에게 투자하여 현대 항공기를 운용하고 급변하는 상황에서 계획을 세울 수 있는 기술을 갖추게 해야 합니다."
 Oligarchs_prevail: "경제인 협회가 권력 투쟁에서 승리함"
 Keystone_Pipeline_Finished: "키스톤 파이프라인을 완공함"
 afep: "미국 우선 에너지 정책을 시행함"
 us_economic_policies: "미국 경제 정책"
 us_economic_policies_desc: "국가와 의회 기구가 생긴 이래, 이 기관들의 법안과 입법이 국가 전체에 미치는 영향은 늘 존재했습니다. 어떤 이는 자신의 견해가 옳다고 말하고, 다른 이는 아니라며 자신의 견해가 옳다고 반박합니다. 현실은 진정으로 명확한 정답이 없다는 것입니다. 지리적으로나 인구학적으로 이토록 다양한 국가의 복잡성은 늘 많은 이들에게 함정과 지평을 동시에 안겨 줄 것입니다. 바랄 수 있는 최선은 완고한 \\"내 방식\\" 위주의 \\"해법\\"이 해를 끼치는 것보다 도움을 주는 쪽이 되는 것입니다. 지난 행정부의 예산 흑자에도 불구하고, 많은 이들은 의료 부문의 부풀어 오르는 지출 증가율과 늘어나는 복지 지출, 그리고 달러 가치 자체에 대한 불확실성을 낳는 경제적 변동성을 여전히 커지는 우려로 봅니다. 의회가 재정 적자 지출을 통제하지 못한다면 험난한 시기가 닥칠지 모릅니다. 아아, 이는 오직 시간과 의회만이 말해 줄 수 있을 것입니다."
 USA_federal_budgets: "미국 연방 예산"
 USA_federal_budgets_desc: "연방 예산과 납세자 돈의 전반적인 배분은 미국의 외교 정책과 국내 정책을 사실상 빚어낸 뜨거운 쟁점입니다. 그럼에도 연방 정부가 단지 \\"여러분의 돈을 낭비\\"하는 것이 아님을 입증하는 일은 행정부의 몫입니다. 오히려 경제와 이 합중국 시민들에게 다시 재투자하려는 것임을 보여 주어야 합니다."
 USA_american_tax_code: "미국 세법"
 USA_american_tax_code_desc: "미국의 세법은 많은 이들이 싫어하고 혐오하는 대상입니다. 정치인들은 같은 열정으로 같은 입에서 변화를 가져오고 또 없애 왔으며, 이는 수백만 미국인뿐 아니라 소수의 미국인에게도 영향을 미쳤습니다. 국세청과 세법의 전반적인 구성에 대한 현대의 불만은 평범한 미국인에게 매우 민감한 주제입니다. 그러나 새로운 천년과 함께 새 법안이 오고, 새 법안은 새 변화를 뜻합니다... 그 변화가 더 나빠지기보다 좋아지기를 바랄 뿐입니다."
 USA_anti_big_business_movement_two: "제2차 반독점 시위의 물결"
 USA_anti_big_business_movement_two_desc: "많은 미국인이 국가의 부를 독점했다고 믿는 기업들에 대해 갈수록 양극화되고 적대적이 되고 있습니다. 이는 제1차 반기업 시위와 마찬가지로 흐지부지될 가능성이 높지만, 새 선거가 다가오는 만큼 여전히 가벼운 우려의 원인입니다."
 us_mass_media_problems_two_a: "대중 매체 문제"
 us_mass_media_problems_two_a_desc: "기성 체제는 시민을 살피고 있으며, 우리의 선의를 알림으로써 삶을 개선하고자 합니다."
 us_mass_media_problems_three_a: "대중 매체"
 us_mass_media_problems_three_a_desc: "우리는 대중이 진정한 변화는 진정한 정당에 의해서만 일어날 수 있음을 이해하도록 장려해야 합니다."
 us_mass_media_problems_four_a: "매체의 조력자들"
 us_mass_media_problems_four_a_desc: "인민의 뉴스는 선량하고 정직하며 일하는 미국인을 위한 유일한 뉴스입니다."
 us_mass_media_problems_five_a: "매체의 벗들"
 us_mass_media_problems_five_a_desc: "붉은색, 흰색, 푸른색에 속한 이들에게만 진실입니다."
 us_mass_media_problems_two_b: "매체의 혼란"
 us_mass_media_problems_two_b_desc: "국민은 이 나라에서 선택할 수 있는 색이 붉은색과 푸른색만이 아님을 이해해야 합니다."
 us_mass_media_problems_three_b: "매체 붕괴"
 us_mass_media_problems_three_b_desc: "가짜 의견 대신 진짜 뉴스를 보도하는 것이 시민들을 새로운 빛으로 이끌 것입니다."
 us_mass_media_problems_four_b: "매체 토대 다지기"
 us_mass_media_problems_four_b_desc: "국민 여러분, 화면 너머를 바라보십시오. 우리는 옛 잿더미 위에 새로운 것을 세워야 함을 이해하십시오."
 us_mass_media_problems_five_b: "매체 재건"
 us_mass_media_problems_five_b_desc: "우리나라를 이끄는 사회적, 정치적 행동에 진정한 현대적 기준을 세웁니다."
 us_war_on_drugs_two: "마약과의 전쟁으로 인한 흉터"
 us_war_on_drugs_three_a: "마약과의 전쟁으로 인한 흉터"
 us_war_on_drugs_four_a: "마약과의 전쟁으로 인한 흉터"
