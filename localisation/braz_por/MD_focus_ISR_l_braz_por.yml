 ISR_calm_security: "Resistência Palestina - §7Segurança Tranquila§!"
 ISR_calm_security_desc: "Desde que os colonos sionistas chegaram à Palestina, no final do século XIX, as tensões entre os imigrantes judeus e a população palestina frequentemente levaram a surtos de violência entre as duas comunidades. Após a criação de Israel, grupos palestinos e até indivíduos lançaram ataques contra interesses israelenses, um fenômeno que persistiu apesar da assinatura dos Acordos de Oslo. Isso se deve à ampla insatisfação palestina com a contínua construção de assentamentos israelenses na Cisjordânia e com a recusa de Israel em compartilhar o controle de Jerusalém, entre outras queixas. Esses ataques contribuíram para uma sensação de insegurança israelense e para o apoio a forças políticas de linha dura.\n§W--------------§!\nEste espírito nacional é reavaliado toda semana com base na situação de segurança na Palestina enquanto a Palestina for nosso súdito. Ele §GMelhorará§! conforme nossos focos acalmarem a situação e §RPiorará§! conforme a inquietação e a hostilidade palestina crescerem. Será §RRemovido§! se a Palestina deixar de existir ou se formarmos Isratina."
