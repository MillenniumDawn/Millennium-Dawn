 total_civilian_factories_amount_tt_delayed: "Это здание обеспечивает государство промышленностью для производства товаров гражданского назначения или строительства новых зданий. При необходимости может быть переоборудовано для нужд военной промышленности.\n\nОбеспечивает государство:\nбазовым количеством необходимых работников: §Y206 тыс.§!\nбазовым ВВП на душу населения в §Yгражданской промышленности§!: $§Y17,5 млрд§!\nбазовым потреблением энергии: §R-0,5§! ГВт\n\nвлиянием законодательства, национального духа и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nвлиянием законодательства, национального духа и технологий на §Yрабочую силу в гражданской промышленности§!: [?modifier@civ_facs_worker_requirement_modifier|-%0]\n\nколичеством необходимых работников в §Yгражданской промышленности§!: [?workers_per_civ_fac_display|2] тыс.\n"
 total_military_factories_amount_tt: "Это значение представляет собой общее количество §Yвоенных заводов§! в нашей стране."
 total_military_factories_amount_tt_delayed: "Это здание обеспечивает регион промышленностью для производства новой военной техники. При необходимости может быть переоборудовано в гражданскую промышленность.\n\nОбеспечивает регион:\nБазовое необходимое количество работников: §Y18,8 тыс.§!\nБазовый выпуск ВВП на одну §Yвоенную промышленность§!: $§Y1,5 млрд§!\nБазовое энергопотребление: §R-0,5§! ГВт\n\nВлияние законов, национальных духов и технологий на §Yрабочую силу на всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу военных заводов и верфей§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\n\nНеобходимое количество работников на одну §Yвоенную промышленность§!: [?workers_per_mil_fac_display|2] тыс.\n"
 total_naval_yard_amount_tt: "Это значение представляет собой общее количество §Yвоенно-морских верфей§! в нашей стране."
 total_naval_yard_amount_tt_delayed: "§YВоенно-морские верфи§! отражают способность государства производить военные суда всех типов, от §Yпатрульных катеров§!, §Yконвоев§!, §Yэсминцев§! до §Yавианосцев§! и не только.\n\nОбеспечивает регион:\nБазовое необходимое количество работников: §Y18,8 тыс.§!\nБазовый выпуск ВВП на одну §Yвоенно-морскую верфь§!: $§Y1,5 млрд§!\nБазовое энергопотребление: §R-0,5§! ГВт\n\nВлияние законов, национальных духов и технологий на §Yрабочую силу на всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законов, национальных духов и технологий на §Yрабочую силу военных заводов и верфей§!: [?modifier@mil_facs_worker_requirement_modifier|-%0]\n\nНеобходимое количество работников на одну §Yвоенно-морскую верфь§!: [?workers_per_dockyard_display|2] тыс.\n"
 total_offices_amount_tt: "Это значение представляет собой общее количество §Yофисных секторов§! в нашей стране."
 total_offices_amount_tt_delayed: "§YОфисный сектор§! включает в себя все остальные отрасли экономики, помимо добывающей и тяжелой промышленности. К ним относятся финансы, обслуживание клиентов, информационные технологии, розничная торговля и многое другое.\n\nОбеспечивает государство:\nбазовым количеством необходимых работников: §Y473 тыс.§!\nбазовым объёмом ВВП на §Yофисный сектор§!: $§Y50 млрд§!\nбазовым потреблением энергии: §R-0,25§! ГВт\n\nвлиянием законодательства, национальных традиций и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nвлиянием законодательства, национальных традиций и технологий на §Yрабочую силу в офисном секторе§!: [?modifier@offices_worker_requirement_modifier|-%0]\n\nколичеством необходимых работников на §Yофисный сектор§!: [?workers_per_office_display|2] тыс.\n"
 total_agriculture_district_amount_tt: "Это значение представляет собой общее количество §Yкоммерческих сельскохозяйственных районов§! в нашей стране."
 total_agriculture_district_amount_tt_delayed: "§YРайоны коммерческого сельского хозяйства§! — это общее название для всех видов сельского хозяйства, не связанных с натуральным хозяйством, в нашей стране. Сюда входят агропромышленный сектор, пахотные земли, зернохранилища, скотобойни и многое другое.\n\nОбеспечивает государство:\nбазовым количеством необходимых работников: §Y188 тыс.§!\nбазовым ВВП на §Yрайон коммерческого сельского хозяйства§!: $§Y25 млрд§!\nбазовым потреблением энергии: §R-0,10§! ГВт\n§Yприростом топлива§! из других штатов: 8\n§Yместными поставками§!: 1,5%\n\nвлиянием законодательства, национальных особенностей и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nвлиянием законодательства, национальных особенностей и технологий на §Yрабочую силу в районах коммерческого сельского хозяйства§!: [?modifier@agriculture_district_worker_requirement_modifier|-%0]\n\nколичеством необходимых работников на §Yрайон коммерческого сельского хозяйства§!: [?workers_per_agriculture_district_display|2] тыс.\n"
 total_microchips_factories_amount_tt: "Это значение представляет собой общее количество §Yзаводов по производству микрочипов§! в нашей стране."
 total_microchips_factories_amount_tt_delayed: "§YЗаводы по производству микрочипов§! представляют собой предприятия по производству полупроводников и малой электроники в нашей стране.\n\nОбеспечивают государство:\nБазовым количеством необходимых работников: §Y37,5 тыс.§!\nБазовым ВВП на §Yзавод по производству микрочипов§!: $§Y32 млрд§!\nБазовым потреблением энергии: §R-0,75§! ГВт\n\nВлияние законодательства, национальных традиций и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законодательства, национальных традиций и технологий на §Yрабочую силу на заводах по производству микрочипов§!: [?modifier@microchip_plant_worker_requirement_modifier|-%0]\n\nНеобходимое количество работников на §Yзавод по производству микрочипов§!: [?workers_per_microchip_plant_display|2] тыс.\n"
 total_composites_factories_amount_tt: "Это значение представляет собой общее количество §Yзаводов по производству композитов§! в нашей стране."
 total_composites_factories_amount_tt_delayed: "§YКомпозитные заводы§! представляют собой передовые предприятия по производству материалов, в том числе керамической брони, армированных полимеров и высокоэффективных конструкционных материалов.\n\nОбеспечивают государство:\nБазовым количеством необходимых работников: §Y37,5 тыс.§!\nБазовым ВВП на §Yкомпозитный завод§!: $§Y28 млрд§!\nБазовым потреблением энергии: §R-0,8§! ГВт\n\nВлияние законодательства, национальных традиций и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nВлияние законодательства, национальных традиций и технологий на §Yрабочую силу на композитных заводах§!: [?modifier@composite_plant_worker_requirement_modifier|-%0]\n\nНеобходимое количество работников на §Yкомпозитный завод§!: [?workers_per_composite_plant_display|2] тыс.\n"
 total_refineries_amount_tt: "Это значение представляет собой общее количество §Yзаводов по производству синтетического топлива§! в нашей стране."
 total_refineries_amount_tt_delayed: "§YСинтетические нефтеперерабатывающие заводы§! — это промышленные объекты, на которых производится синтетический каучук и сопутствующие химические материалы, критически важные для промышленности и логистики.\n\nОбеспечивает государство:\nбазовым количеством необходимых работников: §Y184 тыс.§!\nбазовым объёмом ВВП на §Yсинтетическую нефтепереработку§!: $§Y10 млрд§!\nбазовым потреблением энергии: §R-0,2§! ГВт\n\nвлиянием законодательства, национальных особенностей и технологий на §Yрабочую силу во всех зданиях§!: [?modifier@buildings_worker_requirement_modifier|-%0]\nвлиянием законодательства, национальных особенностей и технологий на §Yрабочую силу на синтетических нефтеперерабатывающих заводах§!: [?modifier@synthetic_refinery_worker_requirement_modifier|-%0]\n\nколичеством работников на §Yсинтетическую нефтепереработку§!: [?workers_per_synthetic_refinery_display|2] тыс.\n"
