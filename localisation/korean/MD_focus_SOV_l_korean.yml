 sov_kasyanov.1.t: "이치케리야의 독립"
 sov_kasyanov.1.d: "러시아의 민주적 변혁과 평화에 대한 열망 속에서 러시아 정부는 체첸에 공식적인 독립을 부여하는 대담한 조치를 취했습니다.\n\n오랜 협상과 외교적 노력 끝에 양측은 이 역사적 타협에 합의했습니다. 러시아는 체첸의 독립 권리를 인정하여 두 실체 사이의 관계에 새로운 장을 열었습니다. 이 조치는 이전에 긴장과 적대로 얼룩졌던 지역에서 평화와 대화에 대한 열망의 상징이 되었습니다."
 sov_kasyanov.1.a: "외교 관계를 수립한다"
 sov_kasyanov.2.t: "남쿠릴 열도 영유권 문제"
 sov_kasyanov.2.d: "제2차 세계 대전 이후 모든 쿠릴 열도는 소련에, 그리고 장차 러시아에 편입되었으나, 이투루프, 쿠나시르, 시코탄 섬과 하보마이 군도의 영유권에 대해 우리는 이의를 제기하며 이를 점령당한 국토의 일부로 여겨 왔고 지금도 그렇게 여깁니다. 오늘 러시아는 이 문제에 관해 우리와의 협상을 제안했습니다. 우리의 대답은 무엇이어야 합니까?"
 sov_kasyanov.2.a: "남쿠릴 열도는 언제나 일본의 것이었다"
 sov_kasyanov.2.b: "좋다, 가져가게 두자"
 sov_kasyanov.3.t: "남쿠릴 열도에 대한 영유권 주장 철회를 거부한 일본"
 sov_kasyanov.3.d: "최근 우리와 일본 사이에 회담이 있었습니다. 그 결과는 다음과 같습니다. 일본은 입장을 바꾸지 않았으며 여전히 남쿠릴 열도를 자국 영토로 간주합니다."
 sov_kasyanov.3.a: "좋다, 쿠릴 열도를 무력으로 붙잡지 않고 넘겨주겠다!"
 sov_kasyanov.3.b: "알 게 뭐야."
 sov_kasyanov.3.c: "그들은 대가를 치르게 될 것이다"
 sov_kasyanov.4.t: "남쿠릴 열도에 대한 영유권 주장을 더 이상 하지 않기로 동의한 일본"
 sov_kasyanov.4.d: "최근 우리와 일본 사이에 회담이 있었습니다. 그들은 남쿠릴 열도에 대한 영유권 주장을 철회하기로 동의했습니다."
 sov_kasyanov.4.a: "일본인들이 좋은 사람들이라는 것을 우리는 항상 알고 있었다"
 SOV_from_center_category: "중앙에서 지방으로!"
 SOV_from_center_category_desc: "10년 동안 러시아는 사실상 단일 국가가 되었으며, 각 지방은 모스크바에 무거운 재정적 의무를 지는 한편 경제에 대한 기여에 비례하는 지출 몫, 발전의 여지, 역사적·문화적 다양성의 인정이라는 권리를 박탈당했습니다. 우리는 러시아의 악명 높은 \\"권력 수직 구조\\"를 즉각 해체할 것을 주장합니다."
