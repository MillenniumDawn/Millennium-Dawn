 libyan_tribalism_tripolitania_tooltip: "§Y[TRP.GetNameWithFlag]§!"
 libyan_tribalism_tripolitania_tooltip_delayed: "A Tripolitânia é o centro da política e da governança líbias. A Tripolitânia tem uma longa história de resistência contra ocupantes, pois, após a Primeira Guerra Mundial, declarou independência da Itália como a 'República Tripolitana'. Embora a independência não tenha tido sucesso, foi o primeiro governo republicano do mundo árabe. O líder líbio, Muammar Kadafi, nasceu na Tripolitânia, perto da cidade de Sirte. Com sua ascensão ao poder, a própria tribo de Kadafi, os Qadhadfa, viu seu poder aumentar, já que muitos dos soldados de elite de Kadafi são recrutados entre eles e outras tribos tripolitanas."
 libyan_tribalism_cyrenaica_tooltip: "§Y[CYR.GetNameWithFlag]§!"
 libyan_tribalism_cyrenaica_tooltip_delayed: "A Cirenaica tem uma longa história como nação independente e pode ser considerada o berço da moderna nação líbia. Sob o domínio otomano, a região tinha grande autonomia. Quando a região foi entregue aos italianos, o xeique Idris, da ordem Senussi, recebeu o título de Emir da Cirenaica. Embora tenha sido depois destituído do título pelos italianos, o Emir recuperou o controle da região após a Segunda Guerra Mundial com o consentimento dos britânicos. Dois anos depois, a totalidade da Líbia foi unida sob o Emirado da Cirenaica como um Reino, com o Emir Idris tornando-se o Rei Idris I. Desde a queda da monarquia, a Cirenaica tem sido a mais forte defensora de seu retorno, com atividade nacionalista ocasional contra Muammar Kadafi.\n\nO sul da Cirenaica é habitado pelo povo toubou, um grupo étnico africano nômade que habita o sul da Líbia, o norte do Chade e o norte do Níger."
 libyan_tribalism_fezzan_tooltip: "§Y[FEZ.GetNameWithFlag]§!"
 libyan_tribalism_fezzan_tooltip_delayed: "O Fezzan é a mais fraca das regiões da Líbia. Pouco povoada, a região é composta em sua maior parte por deserto e tem escassez de recursos naturais. Além de árabes, o Fezzan abriga também uma pequena minoria toubou e é também o lar dos tuaregues líbios. As longas distâncias e o terreno hostil tornam muito difícil impor controle sobre a região."
