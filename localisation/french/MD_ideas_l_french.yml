 UKR_strat_bomb_old: "Crippled Strategic Bomber Fleet"
 UKR_strat_bomb_old_desc: "Our strategic bomber fleet is in a crippled condition. The aircraft we decided to keep, although newer than those in Russia, have been worn down by nine years of neglect, and we will need to repair them before they can be accepted into our Air Force."
 UKR_strat_bomb_repaired: "Repaired Strategic Bomber Fleet"
 UKR_strat_bomb_repaired_desc: "We have repaired all the aircraft we kept to a reasonable condition and adopted them into our Air Force. Their decline has been reversed just in time. \nAfter this national spirit expires, it is replaced with a permanent, superior one."
 UKR_strat_bomber_fleet: "Our Long Range Aviation"
 UKR_strat_bomber_fleet_desc: "We have turned the grim fate inherited by our Long-Range Aviation into a new purpose. Once destined for dismantlement and obscurity, our strategic bombers now stand watch over our skies, ready to defend our lands against the ambitions of foreign powers. By preserving this fleet, we have not only safeguarded a vital instrument of national defence, but also spared our airmen countless tears over the loss of the aircraft they devoted their lives to flying."
 UKR_west_strat_bomb_not: "Unfulfilled Disarmament Commitments"
 UKR_west_strat_bomb_not_desc: "Ukraine has failed to dismantle its remaining long-range bombers as promised to its Western partners. This has damaged confidence in Ukraine's commitment to arms reduction and will make future Western economic cooperation more difficult."
 UKR_west_strat_bomb: "Strategic Disarmament"
 UKR_west_strat_bomb_desc: "Ukraine has fulfilled its commitments to dismantle its remaining long-range bombers. This has strengthened confidence among its Western partners and opened the way for closer economic cooperation. \nAfter this national spirit expires, it is replaced with a permanent, superior one."
 UKR_west_strat_bomb_final: "Finalized Strategic Disarmament"
 UKR_west_strat_bomb_final_desc: "We have chosen to follow the disarmament treaties, scrap all of our Soviet-built long-range bomber aviation and focus our pilots and mechanics on fewer types of combat aircraft. \nThis has strengthened confidence among our Western partners and opened the way for closer economic cooperation. \nWe hope it will help us with faster training, easier maintenance and higher combat readiness."