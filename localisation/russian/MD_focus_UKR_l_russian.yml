 ukraine_reorganize_navy_choose_future_corvette.9.name: "Построить корветы типа «Владимир Великий», проект 58250"
 ukraine_reorganize_navy_choose_future_corvette.9.desc: "По итогам самостоятельно проведённого конкурса новым пополнением флота выбраны корветы типа «Владимир Великий» проекта 58250.\nВыберем количество кораблей, которое согласимся построить."
