l_korean:
 SOV_putin: "블라디미르 푸틴"
 SOV_putin_desc: "레닌그라드 출생이자 전 KGB 정보 요원이었던 블라디미르 푸틴은, 1999년 8월 총리로 임명되기 전 연방보안국 (KSB) 국장과 국가안보회의 보좌관을 역임하였습니다. 그의 지식과 국외 정보 임무에 대한 경험을 바탕으로, 푸틴은 굳건하지 않으면 감당할 수 없을 혼돈의 시기인 러시아를 이끌어 갈 수 있는 지금까지 없었던 강력한 후보자 입니다."
 SOV_zhirinovsky: "블라디미르 지리놉스키"
 SOV_zhirinovsky_desc: "1946년생인 블라디미르 지리놉스키는 1991년부터 극우 민족주의 성향의 러시아 자유민주당(LDPR)을 이끌어 왔습니다. 불같은 언변과 1995년 중도파 보리스 넴초프와의 악명 높은 오렌지 주스 투척 난투극으로 잘 알려진 지리놉스키는 공격적이고 예측 불가능한 정책을 옹호합니다. 그의 극단적인 제안 중에는 나토(NATO)에 가담한 발트해 연안국들의 국경 너머로 공중 방사성 폐기물을 살포해 오염시키자는 구상도 포함되어 있습니다. 그의 논쟁적인 발언과 사상은 러시아의 민족주의 담론에 지속적인 영향을 미치고 있습니다."
 SOV_zyuganov: "겐나디 주가노프"
 SOV_zyuganov_desc: "1944년생인 겐나디 주가노프는 1993년부터 러시아 연방 공산당을 이끌어 왔습니다. 1996년 대통령 선거 당시 초반에는 보리스 옐친을 꺾을 유력 후보로 점쳐졌으나, 결선 투표에서 40.7%를 득표하며 54.4%를 얻은 옐친에게 끝내 패배했습니다. 주가노프의 정치는 좌익 이념과 강력한 민족주의적 관점을 결합하고 있습니다."
 SOV_yavlinsky: "그리고리 야블린스키"
 SOV_yavlinsky_desc: "그리고리 야블린스키(1952년생)는 \"500 Days Programme\"의 저자로 1990년대  초 소비에트 연방의 경제 구조조정에서 활동했으면, 사회 자유주의 야블로코 연합의 수장입니다.  1996년 그는 7.3&의 득표율을 기록했습니다. 그는도시와 중산층 유권자들에게 가장 강한 지지를 받고있으며, 그의 외교 정책은 서방세력에 우호적입니다."
 SOV_aggressive_foreign_policy: "공격적인 외교정책"
 SOV_aggressive_foreign_policy_desc: "내부 반대 세력이 잠잠해진 지금, 러시아는 대외적으로 더욱 적극적인 태도를 취할 수 있습니다. 해외의 러시아계 주민을 보호한다는 명분은 필요할 경우 우리의 영향력을 확대하고 개입할 수 있는 근거가 될 것입니다."
 SOV_2008_military_reforms: "군사 개혁 지속"
 SOV_2008_military_reforms_desc: "러시아 국방부는 특히 병력과 장교 수를 줄이고 전략적, 전술적 유연성을 높이기 위해 군대를 더 축소하기로 결정했습니다."
 SOV_condemn_ukrainian_russophobes: "우크라이나의 반러인사 비난"
 SOV_condemn_ukrainian_russophobes_desc: "Recent political changes in Ukraine make it clear the Kiev government has no intention of respecting the longstanding bonds between Russia and its borderlands. We must shift our diplomatic rhetoric accordingly and may even consider fabricating incidents to justify our stance."
 SOV_the_novorossiyan_uprising: "노보로시아의 반란"
 SOV_the_novorossiyan_uprising_desc: "The people of Luhansk and Donetsk seek national sovereignty from Ukraine. Providing covert support to these freedom fighters could shift the regional balance in Russia's favor."
 SOV_arrest_zyuganov: "주가노프 구속"
 SOV_arrest_zyuganov_desc: "Gennady Zyuganov, leader of the Communist Party, is a formidable opponent. Arresting him will neutralize a major threat to our rule."
 SOV_political_purges: "정치적 숙청"
 SOV_political_purges_desc: "Untrustworthy and disloyal elements exist among us. They must be identified, isolated, and removed from public life."
 SOV_fight_international_capitalists: "국제 자본가와 싸우다"
 SOV_fight_international_capitalists_desc: "Oligarchs resemble the kulaks of old: corrupt and dangerous. Since the USSR's collapse, they have expanded their control, displacing workers and promoting global capitalism. To revive Russia, we must first eliminate this international capitalist class."
 SOV_mobilize_the_masses: "대중 동원"
 SOV_mobilize_the_masses_desc: "Revolution requires broad popular support, not just a vanguard party. The Communist Party must engage Russian workers and farmers politically and economically by creating jobs, renovating factories, and building labor collectives."
 SOV_weaken_the_banks: "은행 약화"
 SOV_weaken_the_banks_desc: "Banks act as capitalism's enforcers, exploiting workers worldwide through wage suppression and predatory lending. They manipulate politics via both legal and illicit means. Banks must be stripped of power and relegated to simple, apolitical lenders."
 SOV_empower_the_communist_party: "공산당에 권한 부여"
 SOV_empower_the_communist_party_desc: "Only a decade has passed since capitalism's rise, yet its political system is entrenched and must be eliminated. The first step toward Party dominance is to seize local and regional elections."
 SOV_civilian_industrial_councils: "민간 산업 협의회"
 SOV_civilian_industrial_councils_desc: "To revive Russian industry, we must create jobs focused on building heavy machinery. Though not primarily for export, this will also support revolutionary movements abroad through Russian-made equipment."
 SOV_military_industrial_councils: "군수 산업 협의회"
 SOV_military_industrial_councils_desc: "Alongside civilian councils, a party-controlled defense industry will allow us to produce weapons to defend Red Russia and support communist revolutions worldwide."
 SOV_scientific_councils: "과학 위원회"
 SOV_territorial_demands: "영토 요구"
 SOV_territorial_demands_desc: "Restoring Soviet glory requires dissolving nation-states created to protect capitalist interests. These arbitrary borders must be dismantled to unite the proletariat."
 SOV_democratic_idealism: "민주적 이상주의"
 SOV_democratic_idealism_desc: "It's time to leave past ghosts behind and pursue democratic reforms at all costs."
 SOV_economic_programs: "경제 개혁"
 SOV_economic_programs_desc: "After the collapse of the USSR and the turmoil of the 1990s, Russia's economy remains in dire need of comprehensive reforms and renewal. Our goal is to restore stability and promote sustainable growth."
 SOV_decree_no_585: "법령 제 585호"
 SOV_decree_no_585_desc: "Decree No. 585, issued in 2003, established RZhD as a joint-stock company. RZhD is responsible for managing Russia's extensive railway network."
 SOV_economic_stimulus: "경제 부양책"
 SOV_economic_stimulus_desc: "Introducing targeted stimulus measures will help revive key sectors of the economy and support sustained growth."
 SOV_russian_federation_stabilization_fund: "러시아 연방 안정화 기금"
 SOV_russian_federation_stabilization_fund_desc: "Established in 2004 by the Putin administration, the Stabilization Fund was created to protect Russia's petroleum industry from the effects of fluctuating oil prices. This initiative was informed by lessons from the 1998 economic crisis, which was partly driven by volatile gas and oil markets."
 SOV_expansionary_monetary_policy: "확장적 통화정책"
 SOV_expansionary_monetary_policy_desc: "Injecting liquidity into the economy will stimulate growth and encourage investment, helping to boost long-term economic prospects."
 SOV_heavy_industry_investments: "중공업 투자"
 SOV_heavy_industry_investments_desc: "Heavy industry was the backbone of the Soviet economy. Reviving this sector through targeted investments is crucial to strengthening Russia's economic foundation."
 SOV_trade_with_the_east: "동쪽과 무역"
 SOV_trade_with_the_east_desc: "While Western markets remain important, expanding trade with Eastern partners, especially China, offers significant new opportunities for growth."
 SOV_rise_of_the_oligarchs: "올리가르히의 비상"
 SOV_rise_of_the_oligarchs_desc: "Supporting the oligarchs will improve our relations with them and potentially unlock new sources of funding and influence."
 SOV_deregulation: "규제 완화"
 SOV_deregulation_desc: "Excessive market regulation often breeds corruption and economic inefficiency. Encouraging free trade, currency, and barter systems will foster a more robust and dynamic economy."
 SOV_regulate_the_market: "시장 규제"
 SOV_regulate_the_market_desc: "Free markets often fail to produce outcomes that serve national interests. Our government must take an active role in regulating markets to ensure economic growth benefits all Russians."
 SOV_nationalize_foreign_industry: "외국 산업 국유화"
 SOV_nationalize_foreign_industry_desc: "Foreign-owned industrial plants pose security risks, especially with ongoing sanctions. Nationalizing these industries will protect vital production capabilities, even if it strains diplomatic relations."
 SOV_european_interaction_plan: "유럽 상호 작용 계획"
 SOV_european_interaction_plan_desc: "Europe remains one of our most important economic partners, despite occasional sanctions. Developing a strategic plan to manage these relations is crucial for sustained economic growth."
 SOV_south_stream: "사우스 스트림"
 SOV_south_stream_desc: "South Stream is a complementary gas pipeline running from Russia's Krasnodar region through the Black Sea, crossing Bulgaria, and splitting towards Austria and Italy. This pipeline enhances our energy export capabilities to Europe."
 SOV_revaluation_of_the_ruble: "루블화 재평가"
 SOV_revaluation_of_the_ruble_desc: "Over the past decade, the Russian Ruble has lost significant value due to poor trade policies and unchecked inflation. Restoring confidence in the Ruble is essential to stabilize our economy and protect our citizens' purchasing power."
 russia.0.t: "러시아의 세력 초대"
 russia.0.d: "Russia has extended an invitation for us to join their faction, aiming to strengthen our alliance and build a solid military partnership. This offer could reshape our strategic position and provide significant security benefits."
 russia.0.o1: "수락. 러시아 곰은 우리를 보호할 것입니다."
 russia.0.o2: "거부. 곰은 약하다!"
 russia.1.t: "쿠르스크 잠수함 사태"
 russia.1.d: "The Kursk Submarine Disaster occurred 75 kilometers north of the Kola Peninsula, Russia. A faulty weld on a practice torpedo caused a peroxide explosion, which set off the detonation of at least five torpedo warheads. The Russian Naval Command severely underestimated the scale of the tragedy and refused international aid, suspecting NATO involvement. Although many crew members survived the initial blast and were trapped underwater, the slow and ineffective rescue efforts tragically resulted in the death of all 118 sailors aboard."
 russia.1.o1: "끔찍하군!"
 russia.5.t: "러시아의 제국주의가 우리의 주권을 위협하다!"
 russia.5.d: "Russia has united with Belarus in a way that essentially renders the government in Minsk powerless. This clearly shows that Russia prioritizes its own neo-Soviet imperial ambitions over the interests of its allies. We must decide how to respond to this blatant threat to our sovereignty."
 russia.5.o1: "우리는 그들의 연대를 끝내야 한다"
 russia.5.o2: "우리는 그저 기대할 수밖에 없다"
 russia.7.t: "크림반도 침공"
 russia.7.d: "Tensions among the ethnic Russian minority have long simmered, but nothing could have prepared us for this. Unmarked, heavily armed militias have swept into Crimea from the east, overwhelming our garrisons and seizing key positions. Intelligence reports leave no doubt: these so-called separatists are equipped, directed, and reinforced by Russian forces now massing along our border. We must decide how to respond to this brazen act of aggression."
 russia.7.o1: "우리는 물러날 것이다."
 russia.7.o2: "우린 견뎌내고 싸울 것이다!"
 russia.8.t: "[FROM.GetName] backs down!"
 russia.8.d: "The [FROM.GetAdjective] government, unwilling or unable to mount a credible defense, has withdrawn its forces from the peninsula. Crimea is now firmly under our control."
 russia.8.o1: "훌륭해"
 threat_SOV_annexiation_of_crimea: "크림반도 합병"
 russia.9.t: "[FROM.GetName] meets our challenge!"
 russia.9.d: "Against all expectations, [FROM.GetName] has chosen to resist our advance and defend Crimea by force. Our commanders on the ground have already committed their units forward. What began as a calculated operation has now escalated into open conflict, one that will not be easily contained."
 russia.9.o1: "그래, 어디 해보자"
 russia_news.5.t: "쿠르스크 잠수함 사태"
 russia_news.5.d: "Russia's new communist leadership has made its intentions clear. They seek to restore the old Soviet Union by reuniting its former republics. A wave of alarm or excitement spreads, depending on where one stands politically."
 russia_news.5.o1: "대비극이로군!"
 russia_news.5.o2: "애도를 표하라."
 russia_news.5.o3: "러시아가 괜찮기를."
 russia_news.5.o4: "슬퍼하기를 바란다."
 russia_news.50.t: "쿠르스크 잠수함 사태"
 russia_news.50.d: "Russian officials have confirmed the sinking of the K-141 'Kursk' submarine in the Barents Sea, 75 kilometers off the Kola Peninsula. The disaster occurred earlier today, due to an internal explosion. While Russia offered several explanations, including a NATO submarine collision, the alliance has firmly denied involvement. All 118 crew members perished in the incident."
 russia_news.50.o1: "엄청난 비극이군!"
 russia_news.50.o2: "동맹국들에게 애도의 뜻을 전하십시오."
 russia_news.50.o3: "우리는 러시아인들이 무사하기를 바랍니다."
 russia_news.50.o4: "그들은 그들에게 온 것을 얻었다."
 SOV_appease_chechnya_tooltip: "§GThis will end the Chechen terror attacks.§! This will also cause the Communists to gain §G5%§! Support and Social Liberals to gain §G3%§! Support in our country.\n"
 SOV_nationalistic_sentiment_tooltip: "체첸 테러는 계속될 것입니다.\n"
 SOV_support_the_oligarchs_tooltip_1: "§Y10 민간 공장§!이 러시아 전역에 건설될 것입니다.\n"
 SOV_support_the_oligarchs_tooltip_2: "§R국내 부패도를 증가시켜 숙청을 실시하기에 더욱 더 어렵게 만들 것입고 올리가르히가 정부에서 일부 자리를 차지할 것입니다!§!\n"
 SOV_the_red_menace_tt_1: "공산주의자들이 권력을 잡기 시작합니다. 이로 인해 공산주의자들은 §G15%§!의 지지율을 얻을 것입니다!\n"
 russia_focus: "러시아 중점 계통도"
 SOV_reign_of_yeltsin: "보리스 옐친의 통치"
 SOV_reign_of_yeltsin_desc: "Boris Yeltsin was the first President of the newly created Russian Federation, the successor state to the USSR, from 1991 to 1999. He presided over huge economic trouble and a disastrous war in Chechnya, and on December 31st, 1999, handed his post over to Prime Minister Vladimir Putin."
 SOV_groznyy_offensive: "그로즈니 공세"
 SOV_groznyy_offensive_desc: "The Second Chechen War began in August 1999, when Chechen fighters from the de facto independent Ichkeria infiltrated neighboring Dagestan. The Russian military's counterattack resulted in a siege of Grozny, which is expected to fall by late January or early February."
 SOV_the_grand_bargain: "중대한 거래"
 SOV_the_grand_bargain_desc: "Russia is currently under the grip of oligarchs. If we are to gain real power within the country, we must offer them a deal they cannot refuse."
 SOV_putinism: "푸틴주의"
 SOV_putinism_desc: "Although Vladimir Putin lacks a formal ideology, his rule is characterized by the dominance of oligarchs and former military officials, or siloviki. This model of governance has come to be known as 'Putinism,' emphasizing control, loyalty, and state authority."
 SOV_found_rosatom: "핵에너지 기업 로사톰 설립"
 SOV_found_rosatom_desc: "Rosatom is the state nuclear energy corporation overseeing Russia's nuclear-industrial complex."
 SOV_empower_siloviki: "실로비키의 권력 강화"
 SOV_empower_siloviki_desc: "'Siloviki' refers to former military and intelligence officers who have transitioned into politics. By empowering them, we ensure internal unity and decision-making driven by shared values and discipline."
 SOV_remove_guzinsky: "Remove Gusinsky"
 SOV_remove_guzinsky_desc: "Media mogul Vladimir Gusinsky refuses cooperation with the government and oligarchs, and must be dealt with."
 SOV_delay_sibirneft_merger: "석유 회사 시브네프트 합병 연기"
 SOV_delay_sibirneft_merger_desc: "The proposed merger of Yukos and Sibneft was blocked through fabricated charges against Khodorkovsky to prevent his control."
 SOV_gen_3_nuclear_plants: "3세대 이후 핵 원자로"
 SOV_gen_3_nuclear_plants_desc: "Generation III+ nuclear reactors are advanced versions of earlier designs, offering greater safety and operational efficiency. Developed in the 1990s with lessons learned from decades of nuclear energy use in the West, they represent the future of clean and stable power for Russia."
 SOV_khodorkovsky_case: "호도르콥스키 사건"
 SOV_khodorkovsky_case_desc: "Faced with corruption and tax evasion charges, Khodorkovsky is likely to lose his holdings in Yukos Oil."
 SOV_revision_6: "Order Number 130"
 SOV_revision_6_desc: "In July 2000, Communications Minister Leonid Reiman signed Order Number 130, obliging telephone and internet providers to carry SORM interception equipment and dropping the requirement that the FSB show documentation on a target before drawing on it. The Presidential Administration reform plan leaked to Kommersant that May as 'Revision Number Six' was never more than an unacknowledged draft. Where that document was speculation, this order is law, and we intend to use it."
 SOV_state_corporatism: "국가협동조합주의"
 SOV_state_corporatism_desc: "Many of Russia's largest corporations are led by individuals with government ties. By unifying state and corporate power, we can eliminate inefficiencies and align economic activity with national goals. This fusion will give the state full control over the direction of the economy."
 SOV_seize_yukos_oil: "석유 기업 유코스 장악"
 SOV_seize_yukos_oil_desc: "With Khodorkovsky removed, we can seize Yukos Oil and redistribute its assets to loyal parties."
 SOV_khodorkovsky_trial: "호도르콥스키의 재판"
 SOV_khodorkovsky_trial_desc: "Having gathered ample evidence, we will proceed with Khodorkovsky's trial, though the outcome is already clear."
 SOV_join_wto: "WTO 가입"
 SOV_join_wto_desc: "Joining the World Trade Organization will integrate us further into the global economy and bring prosperity to our people."
 SOV_referendum_in_chechnya: "체첸에서의 국민 투표"
 SOV_referendum_in_chechnya_desc: "Chechnya is culturally and politically distinct from the rest of Russia. The only path to peace is to let its people decide: full integration into the Russian Federation or a degree of autonomy. We will respect their choice and work toward a lasting settlement."
 SOV_the_putinka: "푸틴카 (Putinka)"
 SOV_the_putinka_desc: "The Khrushchyovkas of old are being replaced by a new housing model, the Putinka. Modern, spacious, and more durable, these buildings mark a new era in Russian urban development."
 SOV_sign_bologna_accords: "볼로냐 프로세스 서명"
 SOV_sign_bologna_accords_desc: "The Bologna Process is a European agreement aimed at standardizing higher education across nations. By signing the accords, we align ourselves with global educational standards, making it easier for Russian students to study abroad and for foreign institutions to recognize our degrees."
 SOV_2011_healthcare_reforms: "2011년 의료 개혁"
 SOV_2011_healthcare_reforms_desc: "The 2011 Healthcare Reforms were proposed by Prime Minister Vladimir Putin. They dedicated over 300 billion rubles to improving healthcare across Russia, aiming to increase access and quality for all citizens."
 SOV_npp: "국가 우선 프로젝트"
 SOV_npp_desc: "Since the collapse of the Soviet Union, Russia's living standards have declined. In 2005, the National Priority Projects were launched to improve healthcare, education, housing, and agriculture. These projects aim to revitalize key sectors of daily life and strengthen the nation from the ground up."
 SOV_mitigate_financial_crisis: "금융 위기 완화"
 SOV_mitigate_financial_crisis_desc: "The 2008 global recession is impacting Russia alongside the rest of the world. We need to take strong measures to protect our economy and preserve the progress made since the collapse of the Soviet Union."
 SOV_develop_it_industry: "IT 산업 개발"
 SOV_develop_it_industry_desc: "Russia's IT sector falls decades behind its Western counterparts. We need innovative leaders and companies similar to Steve Jobs, Bill Gates, Google, Microsoft, Apple, and Facebook to drive our technology forward."
 SOV_renewable_energy_investments: "재생 가능 에너지 투자"
 SOV_renewable_energy_investments_desc: "Our oil and gas resources are limited, and climate change poses a serious threat. Investing in renewable energy will reduce our dependence on hydrocarbons and help Russia become a global leader in clean energy technology."
 SOV_commercialize_glonass: "GLONASS 위성 시스템 상업화"
 SOV_commercialize_glonass_desc: "GLONASS is Russia's satellite navigation system providing an alternative to GPS. Expanding its commercial use will boost our technological independence and open new economic opportunities."
 SOV_increase_roscosmos_funding: "로스코스모스 재정 지원 확대"
 SOV_increase_roscosmos_funding_desc: "Roscosmos, inheriting the legacy of the Soviet space program, is Russia's primary space agency. Increasing its funding is essential to keeping pace with the international space race and advancing our technological capabilities."
 SOV_go_russia: "가자 러시아!"
 SOV_go_russia_desc: "Russia is a great power with unstoppable potential. Under Putin's leadership, we will reclaim our rightful place as a dominant global superpower in the years to come."
 SOV_medvedev_modernization_program: "메드베데프 현대화 프로그램"
 SOV_medvedev_modernization_program_desc: "Launched in 2009, the Medvedev modernization program sought to diversify Russia's economy and reduce reliance on oil and gas. It prioritized energy efficiency, nuclear technology, IT, pharmaceuticals, and space exploration, while also promoting government transparency and accountability."
 SOV_rokirovka: "푸틴의 '캐슬링'"
 SOV_rokirovka_desc: "Rokirovka, meaning castling in chess, refers to Putin stepping down after his presidential term to allow Medvedev to take power. This strategic move ensured continuity of leadership within Russia's political system."
 SOV_gay_propaganda_laws: "동성애 선전 정책"
 SOV_gay_propaganda_laws_desc: "We intend to oppose LGBT representation in our society to protect the values of our people and shield the minds of the youth from what we see as harmful influences."
 SOV_anti_corruption_foundation: "반 부패 기반책"
 SOV_anti_corruption_foundation_desc: "Corruption has deeply infected Russia's political and economic systems. Establishing a dedicated government committee with real authority is necessary to fight this problem thoroughly and restore public trust."
 SOV_economic_liberalism: "자유 시장, 자유의 사람들"
 SOV_economic_liberalism_desc: "Free markets are essential to lifting Russia out of poverty and encouraging growth. The government should step aside and allow businesses to operate freely, without interference or favoritism."
 SOV_annexation_of_crimea: "크림반도 합병"
 SOV_annexation_of_crimea_desc: "Seizing Crimea, a strategically vital and ethnically Russian peninsula, is crucial. Deploying unmarked troops to support local uprisings will maintain plausible deniability and delay any Western intervention."
 SOV_the_new_dictator: "독재자"
 SOV_the_new_dictator_desc: "민주주의를 흉내 내는 허울은 더 이상 필요하지 않습니다. 푸틴, 메드베데프, 그리고 통합 러시아는 러시아를 위해 무엇이 최선인지 잘 알고 있습니다. 국가의 미래를 위해서는 강력하고 영구적인 영도력이 필수적입니다."
 SOV_police_reforms: "치안 개혁"
 SOV_police_reforms_desc: "Reforming intelligence agencies is vital for stability and anti-corruption efforts. Reducing the power of the siloviki will help protect Russia's democracy and strengthen government control."
 SOV_root_out_corruption: "올리가르히의 잔재 일소"
 SOV_root_out_corruption_desc: "Oligarchs represent the corrupt remnants of the Putin era. They must be removed, their assets seized, and their influence dismantled to restore order and fairness."
 SOV_multi_party_encouragement: "언어적 합의"
 SOV_multi_party_encouragement_desc: "Russians and Ukrainians share deep cultural and linguistic ties. We should ensure equal language rights to strengthen unity and mutual respect between our peoples."
 SOV_democracy_in_russia: "선거 통합 수단"
 SOV_democracy_in_russia_desc: "People only trust elections when they are fair and transparent. We must take steps to rebuild confidence in Russia's electoral process after years of corruption and doubt."
 SOV_neoliberal_foreign_policy: "자유주의적 패권"
 SOV_neoliberal_foreign_policy_desc: "To protect our security and support liberal democracies worldwide, we must actively resist autocratic regimes wherever they threaten peace and stability."
 SOV_withdraw_from_the_sco: "상하히 협력 기구 탈퇴"
 SOV_withdraw_from_the_sco_desc: "The Shanghai Cooperation Organization consists of autocratic governments that oppose our values. It is in Russia's best interest to distance itself from this group."
 SOV_rein_in_the_government: "정부 억제"
 SOV_rein_in_the_government_desc: "With opposition effectively neutralized, we can strengthen control over the federal government and ensure unified direction for Russia's future."
 SOV_support_euromaidan: "우크라이나 원조"
 SOV_support_euromaidan_desc: "Ukraine is facing turmoil. Supporting our brother nation will help stabilize its government and secure our regional interests."
 SOV_green_energy_investments: "녹색에너지 투자"
 SOV_green_energy_investments_desc: "Oil companies have long controlled Russian politics and business. Reducing reliance on fossil fuels will fight corruption and pave the way for a cleaner energy future."
 SOV_nato_exercises: "NATO-러시아 훈련"
 SOV_nato_exercises_desc: "To build stronger ties, Russian and NATO forces will hold regular joint exercises starting soon, fostering cooperation and mutual understanding."
 SOV_nato_standardization: "NATO 표준 도입"
 SOV_nato_standardization_desc: "Joining NATO requires aligning our equipment and production with their standards. This will require significant reforms in our military industry."
 SOV_closer_ties_with_the_west: "서방과 더 가까이"
 SOV_closer_ties_with_the_west_desc: "The Cold War is over. It is time to move past old conflicts and build new friendships with Western nations."
 SOV_may_decrees: "5월 법령 (May Decrees)"
 SOV_may_decrees_desc: "On his first day as president in 2012, Putin issued 11 presidential decrees, known as the May Decrees. These focused on education, housing, skilled labor, relations with the EU, the defense industry, and inter-ethnic relations to guide Russia's development."
 SOV_loosen_government_censorship: "정부 검열 강화"
 SOV_loosen_government_censorship_desc: "After securing an unprecedented third term, it is important to strengthen control over media and information to maintain stability and prevent dissent."
 SOV_unite_with_asia: "중앙아시아 연방"
 SOV_unite_with_asia_desc: "We must solidify our union with Central Asian nations while we still can. This will strengthen our influence and secure the region's future."
 SOV_counter_euromaidan: "유로마이단 반격"
 SOV_counter_euromaidan_desc: "Ukraine is drifting further away from our influence. We need to act decisively to remind them who their true allies are."
 SOV_extend_term_limits: "임기 제한 연장"
 SOV_extend_term_limits_desc: "Currently, the president's term is four years. Extending it to six years will allow stable governance and continuity until at least 2018."
 SOV_moscow_tehran_axis: "모스크바-테헤란 추축국"
 SOV_moscow_tehran_axis_desc: "Russia and Iran share natural alliances and common interests. Long live the friendship between the Russian and Persian empires."
 SOV_alliance_with_india: "델리 협약"
 SOV_alliance_with_india_desc: "India and Russia have a long history of resisting imperialism. We celebrate our friendship and hope it continues for many years to come."
 SOV_alliance_with_china: "상하이 회담"
 SOV_alliance_with_china_desc: "Together, China and Russia form a strong bloc opposing the globalist West. We are determined to replace their influence with our own."
 SOV_acquire_drones: "해외 드론 기술 습득"
 SOV_acquire_drones_desc: "Iran offers us advanced drone technology to support our special military operations. Accepting their proposal could enhance our capabilities significantly."
 SOV_challenge_nato: "NATO에 도전"
 SOV_challenge_nato_desc: "NATO stands for North Atlantic Terrorist Organization. We must put an end to their imperialist control and establish our hegemony over Europe."
 SOV_2021_ukrainian_coup: "우크라이나 쿠데타"
 SOV_2021_ukrainian_coup_desc: "There is no longer any room for negotiations with Kiev. We must work to change the regime by any means necessary and restore a government more favorable to Russian interests."
 SOV_recognize_novorossiya: "노보로시야 인정"
 SOV_recognize_novorossiya_desc: "Novorossiya is a historic region in Eastern Ukraine with a predominantly Russian population. We cannot abandon our people to a Ukrainian government that openly opposes Russian culture and interests."
 SOV_the_final_strike: "마지막 일격"
 SOV_the_final_strike_desc: "Ukraine has chosen a path that threatens regional stability. It is time to act decisively and correct this course. Forward to victory!"
 SOV_attack_moldova: "몰도바 해방"
 SOV_attack_moldova_desc: "Our allies in Transnistria suffer under Moldovan control. Expanding our buffer zone against NATO by liberating Moldova will secure Russia's western border and protect our interests."
 SOV_information_war: "정보전"
 SOV_information_war_desc: "To weaken Western support for Ukraine, we must spread targeted propaganda online. Controlling the narrative is crucial to influencing international opinion and securing our objectives."
 SOV_coup_major_post_soviet_countries: "공화국의 쿠데타"
 SOV_coup_major_post_soviet_countries_desc: "Instead of risking a disastrous military intervention, we will offer the breakaway republics an irresistible deal. This diplomatic approach aims to bring them back under our influence without bloodshed."
 SOV_communist_purges: "공산주의 제거"
 SOV_communist_purges_desc: "The collapse of Communism in 1991 was a humiliating defeat. We must root out those within the Party responsible for this betrayal and purge them from positions of power."
 SOV_restalinization: "재 스탈린화 (Restalinization)"
 SOV_restalinization_desc: "Stalin deserves renewed honor for building socialism and protecting humanity from fascism. The greatness of his era is undeniable, even to his fiercest critics. We will liberate the world under his legacy."
 SOV_communist_party_dominance: "공산당 우위"
 SOV_communist_party_dominance_desc: "러시아 연방 공산당은 어떻게 통치해야 하는지를 가장 잘 알고 있습니다. 온전한 자유가 주어진다면 우리는 과거의 실패를 딛고 진정한 공산주의 유토피아를 건설할 것입니다."
 SOV_zyuganov_constitution: "주가노프 헌법"
 SOV_zyuganov_constitution_desc: "It is time to discard the capitalist constitution of 1993. We need a new document that guarantees political and economic rights reflecting the values of Soviet citizens, rights denied in the West."
 SOV_honor_gorbachevs_legacy: "고르바초프의 유산에 영광을"
 SOV_honor_gorbachevs_legacy_desc: "Gorbachev's reforms were sabotaged by hidden capitalists aiming to destroy Communism. We should restore his reforms and maintain a mixed economy to serve as a modern Communist stronghold."
 SOV_nationalize_foreign_business: "외국 기업 국유화"
 SOV_nationalize_foreign_business_desc: "Foreign-owned industrial plants pose economic security risks. In the face of sanctions, these owners could flee and strip vital assets. We must nationalize these industries to protect our economy, regardless of diplomatic backlash."
 SOV_condemn_globalism: "세계통합주의 비난"
 SOV_condemn_globalism_desc: "Globalism claims to promote worldwide cooperation but is really a capitalist scheme to exploit Russia's people and resources. We will reject this and build our economy, society, and military to overthrow the Pax Americana."
 SOV_russian_sfsr: "사회주의 연방 소비에트 공화국 (SFSR)"
 SOV_russian_sfsr_desc: "The USSR's collapse stemmed from overemphasizing equality among nations. We will build a communist state focused solely on Russian national interests to create a stronger and more stable union."
 SOV_reunite_the_ussr: "소비에트 연방"
 SOV_reunite_the_ussr_desc: "Despite nationalist separatism's dangers, creating a second USSR is vital to continuing the Soviet revolution. A strong communist superstructure can overcome nationalism and unite diverse peoples."
 SOV_european_communist_pressure: "유럽을 향한 공산주의 압박"
 SOV_european_communist_pressure_desc: "Europeans often fear communism due to capitalist propaganda. Once we break through this, the capitalist system will collapse, revealing the truth about communism's promise."
 SOV_first_two_year_plan: "제1차 5개년 계획"
 SOV_first_two_year_plan_desc: "Western free-market models offer no future for socialism. A return to planned economy through Soviet-style Five Year Plans will restore government control over the economy."
 SOV_a_second_two_year_plan: "제2차 5개년 계획"
 SOV_a_second_two_year_plan_desc: "A second Five Year Plan will deepen Soviet economic security and independence, ensuring long-term industrial growth and dominance."
 SOV_recollectivization: "재집단화"
 SOV_recollectivization_desc: "Private ownership is unacceptable. Land and property belong to the people, not capitalist elites. We demand the return of our land to those who work it."
 SOV_reestablish_the_military_industrial_complex: "군산복합체 재설립"
 SOV_reestablish_the_military_industrial_complex_desc: "The army and the people are one. Rebuilding our military-industrial complex will strengthen our defense and revolutionary capabilities."
 SOV_increase_minimum_wage: "최저임금 인상"
 SOV_increase_minimum_wage_desc: "Everyone deserves a wage that ensures a happy and decent life. Raising the minimum wage is essential to fulfilling this right."
 SOV_merge_tank_and_aircraft_plants: "전차 및 항공기 산업 단지 합병"
 SOV_merge_tank_and_aircraft_plants_desc: "Multiple companies produce similar materials inefficiently. Merging these plants will reduce redundancy and maximize industrial output."
 SOV_empower_the_nkvd: "KGB 권력 강화"
 SOV_empower_the_nkvd_desc: "Our state security must receive increased funding and autonomy to disrupt capitalist interests both domestically and abroad."
 SOV_challenge_nato_3: "유럽 해방"
 SOV_challenge_nato_3_desc: "Europe's governments have deceived the proletariat for too long. It is time for a special military operation to denazify Europe once again, just as we did in 1945."
 SOV_reassure_ruthenia: "‘자주국 연합’ 계획"
 SOV_reassure_ruthenia_desc: "We aim to revive the long-abandoned project of the Union of Sovereign States, a confederate alternative to the USSR. By inviting selected nations, we hope to re-establish regional cohesion under a new framework, correcting the flaws of the Soviet legacy."
 SOV_soviet_war_memorials: "소련의 전쟁 기념비"
 SOV_soviet_war_memorials_desc: "Twenty-seven million Soviet citizens died in the Great Patriotic War. We must honor their sacrifice and preserve their memory for future generations with eternal glory."
 SOV_glory_of_the_red_army: "붉은 군대의 영광"
 SOV_glory_of_the_red_army_desc: "The Red Army remains the most powerful and respected military force in history."
 SOV_soviet_academy_of_sciences: "소련 과학 학교"
 SOV_soviet_academy_of_sciences_desc: "소련 과학 아카데미는 소련을 대표하는 과학 기관입니다. 우리의 가장 뛰어난 인재들이 자본주의 세계가 부러워할 돌파구를 만들기 위해 쉼 없이 일하고 있습니다."
 SOV_ban_private_land_ownership: "개인 토지 소유 금지"
 SOV_ban_private_land_ownership_desc: "토지는 상품이 아니라 기본적 인권입니다. 재산은 노동자를 희생시켜 이익을 챙기는 먼 곳의 자본가가 아니라 인민의 것이어야 합니다."
 SOV_honor_soviet_legacy: "소련의 유산에 영광을"
 SOV_honor_soviet_legacy_desc: "소련은 역사상 가장 위대한 국가였습니다. 불과 30년 만에 우리를 농업 노동에서 우주 탐사로 이끌었으며, 이는 자본주의 국가들의 성취를 훨씬 뛰어넘는 업적입니다."
 SOV_gay_propaganda_laws_2: "전통 결혼 보존"
 SOV_gay_propaganda_laws_2_desc: "결혼은 남성과 여성의 결합입니다. 자본주의가 조장하는 대안적 생활 방식은 우리 사회를 내부에서부터 약화시키려는 것입니다."
 SOV_preserve_perestroika_ideas: "페레스트로이카 이념 보존"
 SOV_preserve_perestroika_ideas_desc: "고르바초프의 개혁은 1980년대 소련의 침체를 극복하는 데 도움이 되었습니다. 이 정책들은 여전히 효과적이며 우리의 현재 개혁을 이끌어야 합니다."
 SOV_a_new_economic_policy: "새로운 경제 정책"
 SOV_a_new_economic_policy_desc: "5개년 계획은 효과가 있었지만 그것만으로는 충분하지 않습니다. 경제 성장을 극대화하려면 조정이 필요합니다."
 SOV_christian_communism: "기독교 공산주의"
 SOV_christian_communism_desc: "마르크스는 종교를 인민의 아편이라 불렀지만, 교회를 불태우는 것은 현실적이지도 바람직하지도 않습니다. 많은 시민이 여전히 신자이므로 사회적 결속을 위해 정교회를 국교로 채택해야 합니다."
 SOV_consolidate_intel_agencies: "정보국 강화"
 SOV_consolidate_intel_agencies_desc: "우리의 정보기관은 분열되어 있습니다. 이들을 하나의 지휘 체계 아래 통합하면 효율성과 작전 성공률이 높아질 것입니다."
 SOV_harsher_punishments: "가혹한 형벌"
 SOV_harsher_punishments_desc: "법과 질서를 회복하려면 소련 시대에 사용되던 엄격한 처벌을 다시 도입해야 합니다. 이는 범죄를 크게 줄이는 데 도움이 될 것입니다."
 SOV_military_education: "소련 애국주의 학교"
 SOV_military_education_desc: "젊은 세대는 소련의 영광과 선조들의 희생에 대해 배워 그 유산을 이어 가야 합니다."
 SOV_belt_and_road: "소련 기반시설 계획"
 SOV_belt_and_road_desc: "Our roads are in poor condition and trains are unreliable. If Stalin were alive, he would demand swift action to fix this."
 SOV_nuclear_development: "핵 개발"
 SOV_nuclear_development_desc: "소련은 원자력 기술 분야의 세계적 선두 주자였습니다. 그 계승자로서 우리는 이 위치를 되찾고 발전시켜야 합니다."
 SOV_red_cyber_army: "붉은 사이버 군대"
 SOV_red_cyber_army_desc: "중국의 우마오당에서 영감을 받은 이 유급 친소련 인터넷 트롤 집단은 서방 사회에 선전을 퍼뜨리고 불화를 조장할 것입니다."
 SOV_aero_improvements: "공군 강화"
 SOV_aero_improvements_desc: "소련의 항공우주 산업은 1991년 붕괴로 황폐해졌습니다. 수년간의 부실 운영과 자금 부족 끝에, 이 중요한 부문을 되살릴 때입니다."
 SOV_rocketry: "발전된 로켓 공학"
 SOV_rocketry_desc: "소련의 로켓 기술은 언제나 최첨단이었습니다. 우리는 여전히 선두에 있으며 이 분야에서 계속 혁신할 것입니다."
 SOV_revitalize_air_bases: "공군 기지 재활성화"
 SOV_revitalize_air_bases_desc: "소련은 많은 활주로를 방치한 채 남겨 두었습니다. 전략적 이점을 위해 이 기지들을 복구하고 활용해야 합니다."
 SOV_radical_tax_reform: "공산주의 세금 계획"
 SOV_radical_tax_reform_desc: "부유층은 마땅히 내야 할 몫을 내지 않습니다. 우리는 그들에 대한 세금을 인상하고 빈곤층의 부담을 덜어 줄 것입니다."
 SOV_national_patriotic_alliance: "국민-애국 동맹"
 SOV_national_patriotic_alliance_desc: "우리는 강력한 정치적, 애국적 토대 위에서 소련을 재통합하기 위해 민족주의자, 애국자, 공산주의자의 연립을 구성할 것입니다."
 SOV_empower_national_patriotic_alliance: "동맹 강화"
 SOV_empower_national_patriotic_alliance_desc: "연립을 강화하기 위해 그 구성원들을 우리 사람들과 함께 권력에 앉히되, 통제력을 유지할 수 있도록 우리 쪽이 근소하게 우세하도록 할 것입니다."
 SOV_a_new_constitution: "새로운 소련의 헌법"
 SOV_a_new_constitution_desc: "새로운 동맹들과 함께 우리는 헌법 제정 회의를 소집하여 새롭고 통일된 헌법을 기초하고 시행할 것입니다."
 SOV_expand_university_enrollment: "대학 입학 기회 확대"
 SOV_expand_university_enrollment_desc: "고등 교육은 개인의 성공과 경제 생산성의 열쇠입니다. 더 강력한 노동력을 키우기 위해 대학 입학 정원을 늘릴 것입니다."
 SOV_automation_for_the_people: "인터넷 계획"
 SOV_automation_for_the_people_desc: "21세기는 자동화, 인터넷, AI를 제공합니다. 이 기술들이 제대로 발전하면 인류를 노동에서 해방하고 완전 자동화된 호화 공산주의 사회를 열 수 있을 것입니다."
 SOV_guarantee_multi_party_system: "다당제 보장"
 SOV_guarantee_multi_party_system_desc: "고르바초프의 개혁 중 하나는 다당제 민주주의를 허용하는 것이었습니다. 그의 개혁적 유산을 기리기 위해 이를 보존해야 합니다."
 SOV_the_chinese_question: "수정주의 반역자"
 SOV_the_chinese_question_desc: "마오 시대 이후 중국은 제국주의적이고 수정주의적인 길을 걸어왔습니다. 우리는 이를 바로잡고 중국에 진정한 사회주의를 되돌려 놓아야 합니다."
 SOV_our_socialist_brother: "우리의 사회주의 형제들"
 SOV_our_socialist_brother_desc: "소련 붕괴 이후 중국이 사회주의의 횃불을 이어받았습니다. 우리는 함께 21세기에도 사회주의를 계속 전진시킬 것입니다."
 SOV_nork_deals: "북한과의 거래"
 SOV_nork_deals_desc: "북한과 외교적, 경제적 거래를 하며, 우리의 역사적 유대를 활용하여 지역 내 전략적 이점을 확보합니다."
 SOV_chicom_cooperation: "경제 협력 확대"
 SOV_chicom_cooperation_desc: "무역 협정 확대, 합작 투자, 핵심 산업에 대한 상호 투자를 통해 중국과의 경제 협력을 심화합니다."
 SOV_support_the_kpa: "조선인민군 지원"
 SOV_support_the_kpa_desc: "조선인민군 내 일부 인사들은 김씨 정권에 반대하며 우리와 동맹을 맺을 의사가 있습니다. 우리는 그들의 지지를 확보하기 위해 노력해야 합니다."
 SOV_nork_coup: "북한의 쿠데타"
 SOV_nork_coup_desc: "우리의 신호가 떨어지면 조선인민군 장성이 김씨 왕조에 맞서 쿠데타를 일으켜, 더 충성스럽고 진정한 사회주의 정부를 수립하기를 기대합니다."
 SOV_zyuganovs_cult_of_personality: "주가노프 개인숭배"
 SOV_zyuganovs_cult_of_personality_desc: "겐나디 쥬가노프는 지금까지 존재한 공산주의 지도자 중 가장 강하고, 가장 영리하며, 가장 카리스마 있는 인물입니다!"
 SOV_international_revolution: "국제적인 혁명 수출"
 SOV_international_revolution_desc: "혁명은 러시아 한 나라만으로는 살아남을 수 없습니다. 전 세계의 프롤레타리아가 일어나 자본주의를 타도하고 공산주의 유토피아를 건설해야 합니다."
 SOV_export_class_struggle: "계급 갈등 수출"
 SOV_export_class_struggle_desc: "마르크스주의 사회주의는 역사가 계급 투쟁으로 규정된다고 가르칩니다. 프롤레타리아는 반드시 부르주아지를 타도할 것입니다!"
 SOV_reignite_revolutionary_spirit: "혁명적 정신 점화"
 SOV_reignite_revolutionary_spirit_desc: "The revolution is eternal and must be kept alive through constant vigilance and action."
 SOV_fifth_international: "제5인터내셔널 형성"
 SOV_fifth_international_desc: "소련 공산주의 운동은 역사적으로 스탈린의 제3 인터내셔널과 트로츠키의 제4 인터내셔널로 갈라졌고, 잔혹한 숙청으로 귀결되었습니다. 전 세계의 공산주의자를 단결시킬 새로운 인터내셔널이 필요합니다."
 SOV_empower_ex_soviet_communists: "구소련 공산주의자들에게 권력을"
 SOV_empower_ex_soviet_communists_desc: "소련 시대의 많은 노병이 여전히 러시아와 구 공화국 전역에 살고 있습니다. 소련 재통합을 돕도록 그들에게 힘을 실어 주어야 합니다."
 SOV_a_loyal_cpc: "충성스런 중국공산당원"
 SOV_a_loyal_cpc_desc: "중국 공산당은 수정주의로 변질되어 통치할 자격을 잃었습니다. 진정한 공산주의를 복원하기 위해 내부 협력자들의 도움을 받아 무력으로 이를 전복해야 합니다."
 SOV_russian_irredentism: "러시아 실지회복주의"
 SOV_russian_irredentism_desc: "러시아는 한때 위대한 제국이었으나 혁명, 쿠데타, 내전으로 약해졌습니다. 이제 우리는 잃어버린 영토를 되찾아 과거의 영광을 회복해야 합니다. 크림과 돈바스는 우리의 것이며, 우리의 전차는 프라하까지 진격할 것입니다. 이것이 우리의 운명이자 의무입니다."
 SOV_strengthen_union_state: "민스크 행정구"
 SOV_strengthen_union_state_desc: "이제 벨라루스의 허울뿐인 독립을 끝낼 때입니다. 벨라루스를 우리 제국 내의 현으로 복원하는 것이 안정과 통제를 보장하는 최선의 방법입니다. 이 재통합은 양 민족 모두에게 이익이 되고 우리의 국경을 강화할 것입니다."
 SOV_maintain_csto_1: "CSTO 해체"
 SOV_maintain_csto_1_desc: "CSTO는 불필요하고 비효과적인 조직이며 더 이상 우리의 이익에 기여하지 않습니다. 이제 이를 해체하고 낡은 동맹을 넘어설 때입니다. 우리의 미래는 더 강력하고 더 집중된 동반자 관계에 있습니다."
 SOV_integrate_abkhazia: "트빌리시 주"
 SOV_integrate_abkhazia_desc: "우리는 캅카스에 있는 옛 러시아 제국의 영토에 집중해야 합니다. 지속되는 조지아-오세티야-압하지야 분쟁은 지역 안정을 위협합니다. 우리의 목표는 이러한 분쟁을 영구히 끝내고 우리의 통제 아래 질서를 회복하는 것입니다."
 SOV_support_serbia: "세르비아 지원"
 SOV_support_serbia_desc: "세르비아는 남유럽에서 우리의 핵심 동맹으로 남아 있습니다. 이 중요한 동반자 관계를 강화하고 지역 내 공동의 이익을 증진하기 위해 그들이 필요로 할 때마다 지원을 제공해야 합니다."
 SOV_help_armenia: "Armenian-Russian Union"
 SOV_help_armenia_desc: "아르메니아는 언제나 우리와 깊은 유대를 가진 형제 같은 기독교 국가였습니다. 우리는 신뢰와 상호 지원에 기반한 진정한 동맹을 아르메니아에 제안할 준비가 되어 있습니다. 우리의 우정은 수 세기에 걸친 공유된 역사에 뿌리를 두고 있습니다."
 SOV_approach_iran: "이란에 접근"
 SOV_approach_iran_desc: "우리는 이란에 지역 내 우리의 입지를 크게 강화할 동맹을 제안할 계획입니다. 이 동반자 관계를 구축하는 것은 영향력을 확보하고 서방의 간섭에 맞서는 데 핵심입니다."
 SOV_proclamation_of_greater_russia: "대러시아 선언"
 SOV_proclamation_of_greater_russia_desc: "러시아는 이제 유라시아를 지배하고 세계 정치를 좌우하는 세계적 초강대국입니다. 새로 얻은 힘으로 우리는 서방에 맞서고 세계 무대에서 마땅한 자리를 확보할 것입니다."
 SOV_zhirinovsky_secure_central_asia: "중앙아시아의 복종 요구"
 SOV_zhirinovsky_secure_central_asia_desc: "중앙아시아는 언제나 우리의 영향권 안에 있었습니다. 이란이나 중국이 발판을 얻지 못하도록 이곳을 확고히 장악해야 합니다. 그곳에 대한 우리의 지배는 협상의 여지가 없습니다."
 SOV_expand_welfare_programs: "복지 프로그램 확장"
 SOV_expand_welfare_programs_desc: "러시아 국민은 실패한 소련의 의료 제도 아래에서 너무 오랫동안 고통받았습니다. 삶의 질과 공중 보건을 개선하기 위해 복지 프로그램을 국가적으로 회복하고 확대할 때입니다."
 SOV_revive_the_great_idea: "The Russian-Greek Brotherhood"
 SOV_revive_the_great_idea_desc: "아나톨리아 서해안은 역사적으로 그리스 정교의 영토였으나 오스만 제국에 부당하게 빼앗겼습니다. 그리스인들이 이를 되찾기를 원한다면 우리는 전폭적으로 지원할 것입니다. 이 형제애는 지역 내 우리의 영향력을 강화합니다."
 SOV_zhirinovsky_attack_ruthenia: "Destabilization of Ukraine"
 SOV_zhirinovsky_attack_ruthenia_desc: "우크라이나는 소련 붕괴 이후 오랫동안 반러시아 정책을 추구해 왔습니다. 우리는 이 지역이 적대적인 거점이 되도록 내버려 둘 수 없습니다. 이 위협을 완전히 무력화하기 위해 단호한 조치를 취할 것입니다."
 SOV_question_of_poland: "폴란드에 대한 의문"
 SOV_question_of_poland_desc: "2014년 8월, 지리노프스키는 폴란드를 융단 폭격하겠다고 위협했으며, 이는 이 나라에 대한 그의 공격적인 입장을 보여줍니다. 이 위협은 우리 관계의 긴장을 부각합니다."
 SOV_syria_kurdistan_armenia_summit: "합동 군사 훈련"
 SOV_syria_kurdistan_armenia_summit_desc: "우리의 반튀르키예 연합은 시리아, 쿠르디스탄, 아르메니아의 전투 능력을 강화하기 위해 합동 군사 훈련을 실시할 것입니다. 이 훈련은 우리가 협조된 방어 및 공세 작전에 대비하도록 해줍니다."
 SOV_istanbul_is_constantinople: "이스탄불은 콘스탄티노폴이다"
 SOV_istanbul_is_constantinople_desc: "반튀르키예 정상회담에서 수립한 전쟁 계획을 실행하여 잃어버린 영토를 되찾을 때입니다. 이스탄불을 과거의 정체성으로 되돌리는 것이 이번 작전의 핵심 목표입니다."
 SOV_crush_europe: "유럽을 짓밟아버려라"
 SOV_crush_europe_desc: "유럽이 제공하는 것은 세계주의자, 타락한 자들, 도덕적 쇠퇴뿐입니다. 우리는 이 퇴폐를 분쇄하고 질서를 회복할 것입니다. 우리의 원정은 유럽 쇠락의 심장부를 겨냥합니다."
 SOV_treaty_with_turkmenistan: "투르크메니스탄과의 조약"
 SOV_treaty_with_turkmenistan_desc: "투르크멘인들과 싸울 필요는 없습니다. 우리는 그들이 기꺼이 평화적으로 우리 제국과 재통합할 것이라고 확신합니다. 이 조약은 우리의 유대를 공고히 하고 영향력을 확대할 것입니다."
 SOV_imperial_russian_lands: "러시아 제국의 영토"
 SOV_imperial_russian_lands_desc: "우리 계획의 첫 단계는 공산 통치 시기에 잃어버린 고향 땅을 되찾는 것입니다. 신의 가호 아래 우리는 제국의 옛 영토와 명예를 회복할 것입니다."
 SOV_claim_finland: "핀란드 영유권 주장"
 SOV_claim_finland_desc: "핀란드의 국경은 상트페테르부르크에 너무 가깝습니다. 표트르 대제가 그랬듯이 우리는 국경을 북쪽과 서쪽으로 밀어내고, 북유럽 국가들을 결정적으로 격파하여 다시는 우리를 위협하지 못하게 해야 합니다. 이는 우리의 안보에 필수적입니다."
 SOV_zhirinovsky_secure_east_asia: "아시아에 대한 야망"
 SOV_zhirinovsky_secure_east_asia_desc: "러시아 외교는 언제나 복잡하고 다면적이었습니다. 세계에서의 입지를 강화하기 위해 아시아에서 우리의 영향력을 확보하고 확대해야 합니다. 러시아에 영광을!"
 SOV_demand_manchuria: "다시 황러시아로"
 SOV_demand_manchuria_desc: "옛 황색 러시아 구상을 되살릴 때입니다. 우리는 한때 러시아 제국에 속했던 땅을 중국에 요구할 준비가 되어 있습니다. 이 대담한 요구는 만주에서의 우리 영향력을 회복할 것입니다."
 SOV_zheltoros: "Mongolian Governorate"
 SOV_zheltoros_desc: "몽골은 오랫동안 우리와 중국 사이의 완충 역할을 해왔습니다. 이제 이 체제를 끝내고 몽골을 러시아 제국의 공식 종속국으로 만들어 국경과 통제력을 강화할 때입니다."
 SOV_expand_pacific_naval_presence: "태평양 해군 확장"
 SOV_expand_pacific_naval_presence_desc: "극동의 조선 산업을 발전시킴으로써 지역 성장을 촉진하고 태평양 전역에 더 큰 해군력을 투사하여 우리의 전략적 야망을 진전시킬 수 있습니다."
 SOV_avenge_tsushima: "쓰시마에 대한 복수"
 SOV_avenge_tsushima_desc: "1904~1905년의 러일 전쟁은 우리 국가에 굴욕적인 패배였습니다. 일본을 결정적으로 완전히 격파하여 선조들의 원수를 갚을 때입니다."
 SOV_end_the_usa: "미국의 최후"
 SOV_end_the_usa_desc: "From moral decay to global terrorism, the United States represents a fundamental threat to our survival and the world's stability. It must be destroyed to ensure our future."
 SOV_side_with_the_people: "인민의 편에서"
 SOV_side_with_the_people_desc: "수 세기 동안 엘리트와 범죄 마피아가 일반 국민을 억압해 왔습니다. 이 부당함을 바로잡고 국민의 편에 확고히 설 때입니다."
 SOV_purge_disloyal_oligarchs: "불충한 올리가르히 제거"
 SOV_purge_disloyal_oligarchs_desc: "우리의 노력에도 불구하고 일부 과두 재벌들은 우리의 대의를 지지하기를 거부합니다. 우리는 그들이 거절할 수 없는 조건을 제시하고, 길을 가로막는 자들을 제거할 것입니다."
 SOV_integrate_serbia: "Union State With Serbia"
 SOV_integrate_serbia_desc: "우리는 세르비아에 연방 국가 구상을 재개하자고 제안할 것입니다. 이는 1990년대에 우리 당이 강력히 지지했던 구상입니다. 이 연합은 협력을 심화하고 유럽에서 우리의 전략적 입지를 높일 것입니다."
 SOV_ensure_a_balance: "균형 유지"
 SOV_ensure_a_balance_desc: "러시아 사회는 주로 엘리트와 일반 국민으로 나뉘어 있습니다. 두 집단 모두 국가의 안정에 필수적이므로 우리는 양쪽을 지지하며 미묘한 균형을 유지해야 합니다."
 SOV_zhirinovsky_economic_policy: "지리놉스키의 경제 정책"
 SOV_zhirinovsky_economic_policy_desc: "계획경제와 시장경제에 대한 수 세기의 실험은 21세기에 러시아 경제를 발전시키기 위해 혼합적 접근이 필요함을 보여주었습니다."
 SOV_progressive_taxation: "누진세"
 SOV_progressive_taxation_desc: "고소득자가 더 높은 비율을 납부하고 저소득자는 더 적게 납부하는 세금 제도입니다. 이 정책은 공정성과 사회적 균형을 증진합니다."
 SOV_guarantee_the_people: "인민 보장"
 SOV_guarantee_the_people_desc: "국민은 러시아와 우리 권력의 토대입니다. 우리의 권위와 안정을 유지하려면 그들의 지지를 확보해야 합니다."
 SOV_revitalize_russian_industrial_sector: "러시아 산업 부문 재활성화"
 SOV_revitalize_russian_industrial_sector_desc: "러시아 산업은 한때 우리를 농업 사회에서 우주 진출 국가로 탈바꿈시켰습니다. 적절한 투자와 관리가 이루어진다면 산업 시대에서 정보 시대로 우리를 이끌 수 있습니다."
 SOV_increase_fossil_fuel_investments: "화석 연료 투자 증가"
 SOV_increase_fossil_fuel_investments_desc: "세계주의자들의 반대에도 불구하고 화석 연료는 여전히 필수적이며 대체할 수 없습니다. 러시아의 번영과 에너지 안보를 보장하기 위해 이 분야에 대대적으로 투자해야 합니다."
 SOV_expand_conscription: "전산화된 경제"
 SOV_expand_conscription_desc: "우리의 경제는 낙후되어 있습니다. 우리 국민은 러시아의 이익을 위해 컴퓨터를 사용할 만큼 영리합니다. 우리의 과학자, 공장 노동자, 군산 복합체 종사자들은 우리 경제를 개선하기 위해 가장 강력하고 효율적인 전자 계산기를 운용해야 합니다!"
 SOV_increased_arms_exports: "무기 수출 증가"
 SOV_increased_arms_exports_desc: "러시아의 유명한 무기 산업은 전 세계에서 영향력을 얻기 위한 강력한 수단입니다. 무기 생산과 수출을 확대하기 위한 기반시설을 구축해야 합니다."
 SOV_zhirinovsky_secure_baltics: "발트 보호"
 SOV_zhirinovsky_secure_baltics_desc: "1991년 지리노프스키는 핵폐기물 투기와 방사능 공격을 포함한 극단적인 조치로 발트 국가들을 위협했습니다. 2014년에는 이 지역을 융단 폭격하겠다고 위협했습니다. 발트 지역을 확보하는 것은 여전히 우선 과제입니다."
 SOV_coopt_zyuganov: "주가노프와의 협력"
 SOV_coopt_zyuganov_desc: "주가노프는 야당이지만 우리는 공통의 목표를 공유합니다. 우리의 세력을 통합하면 대러시아를 향한 추진력을 강화할 수 있습니다."
 SOV_supreme_leader: "최고 지도자가 되어라"
 SOV_supreme_leader_desc: "우리는 견제와 균형 없이 절대 권력을 쥐고 의문의 여지가 없는 권위로 통치할 수 있습니다."
 SOV_remain_president: "대통령으로 존속"
 SOV_remain_president_desc: "우리는 이미 거의 절대적인 권력을 행사하고 있으므로 추가적인 변화를 추구할 필요가 없습니다."
 SOV_iron_regency: "철의 섭정"
 SOV_iron_regency_desc: "우리는 군주제로 이행하여, 전환 기간 동안 통치할 섭정 위원회를 임명할 수 있습니다."
 SOV_make_russia_great_again: "러시아를 다시 위대하게!"
 SOV_make_russia_great_again_desc: "러시아의 위대함은 회복될 것이며, 우리는 이를 달성하기 위해 가능한 모든 것을 할 것입니다."
 SOV_coopt_hyper_nationalists: "초국가주의자들과의 협력"
 SOV_coopt_hyper_nationalists_desc: "우리는 당의 급진 민족주의 분파와 손잡고 그들에게 정부 내에서 더 많은 권력을 부여해야 합니다."
 SOV_kill_western_opposition: "서방 세력을 죽여라"
 SOV_kill_western_opposition_desc: "극단적 민족주의자들은 서방과 연계된 반대 세력의 제거를 요구합니다. 우리는 그들이 이러한 행동을 실행하도록 허용해야 합니다."
 SOV_amend_the_russian_constitution: "러시아 헌법 개헌"
 SOV_amend_the_russian_constitution_desc: "헌법은 우리의 의제에 맞게 몇 가지만 조정하면 받아들일 만합니다."
 SOV_new_russian_status_quo: "새로운 러시아의 상황"
 SOV_new_russian_status_quo_desc: "권력이 공고해졌으며, 이제 새로운 지배층이 러시아를 통치합니다."
 SOV_decommunization: "비공산화 (Decommunization)"
 SOV_decommunization_desc: "공산주의는 러시아를 파괴했으며 수백만 명에게 기아, 약탈, 투옥, 죽음을 가져왔습니다. 우리는 더 이상 이 어두운 유산을 기리지 않을 것입니다. 공산주의를 타도하라!"
 SOV_embrace_monarchists: "군주주의자 수용"
 SOV_embrace_monarchists_desc: "군주제에 대한 지지가 커지고 있습니다. 군주주의자들을 우리 당에 초청하여 영향력을 갖도록 해야 합니다."
 SOV_condemn_the_partition_of_india: "인도-러시아 우호 조약"
 SOV_condemn_the_partition_of_india_desc: "인도와 러시아는 역사적으로 함께 서방에 맞서 왔습니다. 우리의 주된 경쟁자는 이제 중국이며, 그 부상은 우리의 존립을 위협합니다."
 SOV_praise_china: "중국-러시아 우호 조약"
 SOV_praise_china_desc: "중국과 러시아는 서방 열강에 맞서 단결했습니다. 우리의 주된 적수는 인도이며, 그 부상하는 지배력은 위협이 됩니다."
 SOV_reconcile_the_cprf: "러시아 연방 공산당과 화해"
 SOV_reconcile_the_cprf_desc: "우리는 공산당과 많은 목표를 공유하고 있습니다. 어쩌면 그들을 우리 편으로 끌어들여 과거의 분열을 봉합할 수 있을지도 모릅니다."
 SOV_support_workers_rights: "노동자의 권리 지원"
 SOV_support_workers_rights_desc: "노동자는 우리 국가의 중요한 구성원입니다. 생산성에 영향을 미치더라도 그들의 권리를 개선하기 위한 개혁을 시행해야 합니다."
 SOV_social_conservatism: "사회보수주의"
 SOV_social_conservatism_desc: "사회적 보수주의는 문명과 품위를 유지하는 데 필수적이라 여겨지는 전통적 가치를 정부가 강제하도록 촉진합니다."
 SOV_ally_national_bolsheviks: "민족볼셰비키와 동맹"
 SOV_ally_national_bolsheviks_desc: "민족볼셰비키는 목소리가 큰 극우 민족주의 집단입니다. 그들은 유용한 정치적 우군이 될 수 있습니다."
 SOV_national_bolshevik_thought: "국가 볼셰비키즘의 이상"
 SOV_national_bolshevik_thought_desc: "National Bolshevik ideology combines nationalism with Bolshevik principles to pursue a Greater Russia."
 SOV_national_bolshevik_cooperation: "국가 볼셰비키즘 협력"
 SOV_national_bolshevik_cooperation_desc: "우리는 민족주의자들의 지지를 독점하고 우리 운동의 세력을 강화하기 위해 민족볼셰비키와의 협력을 확보했습니다."
 SOV_national_bolshevik_coup: "민족볼셰비키와의 연립정부 구성"
 SOV_national_bolshevik_coup_desc: "이 거대 야당과의 연립을 허용하면 압력이 완화되고 우리의 통제가 공고해질 것입니다."
 SOV_absolute_monarchy: "절대 군주정"
 SOV_absolute_monarchy_desc: "헌법상의 제약이 없는 군주제는 강력한 지도력을 위한 최선의 길입니다."
 SOV_constitutional_monarchy: "입헌군주제"
 SOV_constitutional_monarchy_desc: "절대 권력은 부패합니다. 로마노프 왕조의 실수를 되풀이하지 않으려면 군주의 권력에 일정한 제한이 필요합니다."
 SOV_empower_the_romanovs: "로마노프에게 영광을"
 SOV_empower_the_romanovs_desc: "The Romanov dynasty ruled Russia for centuries until unjustly overthrown by Bolsheviks. We should honor their legacy and achievements."
 SOV_zhirinovsky_iron_regent: "왕관의 주인은 우리의 것"
 SOV_zhirinovsky_iron_regent_desc: "1917년 혁명은 러시아를 혼란에 빠뜨렸습니다. 차기 차르가 될 운명인 블라디미르 지리노프스키가 질서를 회복하고 국가의 가장 깊은 위기를 바로잡을 것입니다."
 SOV_compromise_with_old_believers: "고의식파(Starovertsy)와의 협상"
 SOV_compromise_with_old_believers_desc: "스타로베르치는 키릴 총대주교를 거부합니다. 우리는 종교적 타협에 도달해야 하며, 국교로서 그들이 받아들일 수 있는 새 총대주교를 임명할 수도 있습니다."
 SOV_crush_old_believers: "고의식파(Starovertsy)를 부숴라"
 SOV_crush_old_believers_desc: "스타로베르치는 키릴 총대주교를 인정하기를 거부합니다. 우리만의 국교를 확립하기 위해 그들을 탄압해야 합니다."
 SOV_unity_of_church_and_state: "정교일치"
 SOV_unity_of_church_and_state_desc: "정교회는 러시아 민족의 토대입니다. 그 지지 없이는 우리의 광대한 제국을 통치하는 것이 불가능합니다. 이에 따라 종교를 통치에 통합할 것입니다."
 SOV_god_save_the_tsar: "하나님, 차르를 보호하소서!"
 SOV_god_save_the_tsar_desc: "God Save the Tsar!"
 SOV_maintain_good_relationships_with_central_asia: "중앙아시아와의 친선 유지"
 SOV_maintain_good_relationships_with_central_asia_desc: "우리는 볼셰비키의 공통된 과거로 하나 된 중앙아시아 국가들과 문화적, 역사적 우정을 공유합니다. 이러한 긴밀한 유대를 되살리고 추가 협력을 모색할 때입니다."
 SOV_befriend_india: "인도와의 친선"
 SOV_befriend_india_desc: "소련은 인도의 독립을 지지했습니다. 이제 그 우정에 다시 불을 지피고 우리의 파트너십을 강화할 때입니다."
 SOV_befriend_pakistan: "파키스탄과의 친선"
 SOV_befriend_pakistan_desc: "냉전 기간에 우리는 인도를 지지했지만, 더 이상 그 입장을 유지할 필요는 없습니다. 파키스탄은 우리의 이익에 더 나은 전략적 파트너십을 제공합니다."
 SOV_support_israel: "이스라엘 지원"
 SOV_support_israel_desc: "우리나라는 이스라엘 및 그 국민과 오랜 교류의 역사를 지니고 있습니다. 우리는 이 우정을 계속 가꾸어 나가야 합니다."
 SOV_support_palestine: "팔레스타인 지원"
 SOV_support_palestine_desc: "아랍인들은 수년간 이스라엘의 압제 아래 고통받아 왔습니다. 이 어려운 시기에 우리는 그들과 함께해야 합니다."
 SOV_pressure_the_persians: "이란 공격"
 SOV_pressure_the_persians_desc: "이란의 물라들은 우리 지역에 남은 독재, 부패, 극단주의의 마지막 보루입니다. 이들을 제거하는 것은 러시아와 세계의 평화와 안보에 필수적이며, 불안한 중동의 민주주의를 증진하는 길이기도 합니다."
 SOV_honor_victims_of_repression: "탄압의 피해자에게 경의를"
 SOV_honor_victims_of_repression_desc: "소련의 숙청, 기근, 국가 테러는 수백만 명에게 해를 끼쳤고 거의 모든 러시아 가정에 영향을 미쳤습니다. 우리는 이 희생자들을 결코 잊어서는 안 됩니다. 다시는 안 됩니다."
 SOV_a_pragmatic_approach: "실용주의적 접근"
 SOV_a_pragmatic_approach_desc: "민주주의가 바람직하긴 하지만, 공산주의 독재에서 자본주의 민주주의로 곧바로 이행하는 것은 통하지 않을 것입니다. 충격 요법은 취약한 신생 국가를 산산조각 낼 것입니다."
 SOV_respect_soviet_legacy: "소련의 유산에 존경을"
 SOV_respect_soviet_legacy_desc: "우리의 역사는 우리의 것입니다. 이를 무시하거나 증오하는 것은 자멸적입니다. 우리는 소련의 과오를 잊지 않으면서도 그 업적만큼은 존중해야 합니다."
 SOV_decommunize_russian_society: "러시아 사회 내부 비공산화"
 SOV_decommunize_russian_society_desc: "공산주의는 무너졌습니다. 민족주의와 신공산주의의 수사를 부추기지 않도록 그 상징과 이미지를 제거해야 합니다."
 SOV_rehabilitate_purged_figures: "숙청된의 이들의 명예 회복"
 SOV_rehabilitate_purged_figures_desc: "소련 시대에 유능하고 충직한 많은 이들이 숙청되고 지워졌습니다. 우리는 그들을 기억하고 그 유산을 보존해야 합니다."
 SOV_reconcile_the_cprf_2: "러시아 연방 공산당과 화해"
 SOV_reconcile_the_cprf_2_desc: "러시아 연방 공산당은 여전히 강력합니다. 그들과 화해하는 것만이 합법적인 정부로 인정받을 수 있는 유일한 길입니다."
 SOV_ostracize_the_cprf: "러시아 연방 공산당 배척"
 SOV_ostracize_the_cprf_desc: "러시아 연방 공산당은 옛 소련 체제의 꺼져가는 잔재일 뿐입니다. 우리는 그들을 온전한 사회에서 배제해야 합니다."
 SOV_foster_multi_party_democracy: "민주 러시아를 위한 협의회"
 SOV_foster_multi_party_democracy_desc: "민족주의와 공산주의 야권을 정리한 지금, 새로운 민주 러시아의 규칙과 규범을 정하기 위해 범정부 회의를 소집할 때입니다."
 SOV_economic_bill_of_rights: "경제 권리장전"
 SOV_economic_bill_of_rights_desc: "삶과 자유, 행복 추구를 누리려면 사람들에게 기본적인 경제적 자유가 있어야 합니다. 누구도 가난 때문에 이러한 권리를 박탈당해서는 안 됩니다. 자본주의의 과도함으로부터 시민을 보호할 경제 권리 장전이 필요합니다."
 SOV_influence_central_asian_change: "중앙 아시아의 변화에 개입"
 SOV_influence_central_asian_change_desc: "중앙아시아에는 부패한 독재자들이 만연해 있습니다. 조치를 취하지 않으면 이 나라들은 우리의 영향권에서 멀어질 것입니다."
 SOV_join_nato: "NATO를 향한 약속"
 SOV_join_nato_desc: "냉전은 끝났고 우리의 처지는 어렵습니다. 민주주의 국가로서 우리의 생존을 보장하기 위해 다른 민주주의 국가들과 동맹을 맺어야 합니다."
 SOV_pan_eurasian_infrastructure: "유라시아 기반시설 프로젝트"
 SOV_pan_eurasian_infrastructure_desc: "러시아의 기반시설은 상태가 좋지 않습니다. 경제를 활성화하기 위해 도로, 교량, 철도 및 기타 사업을 건설해야 합니다."
 SOV_status_quo: "한국 현상유지"
 SOV_status_quo_desc: "안정된 한반도는 러시아의 이익에 가장 부합합니다. 변화가 불가피하다면 혼란스럽지 않게 점진적이고 통제된 방식이어야 합니다."
 SOV_strengthen_relations_with_north: "Strengthen Relations with the North"
 SOV_strengthen_relations_with_north_desc: "북한은 우리가 한국 전쟁 당시 MiG-15를 제공한 이래로 우리의 동맹이었습니다. 80년의 우정을 위하여!"
 SOV_encourage_economic_reforms: "북한의 경제 개혁 장려"
 SOV_encourage_economic_reforms_desc: "세계화된 세상에서 러시아에는 여전히 폐쇄적이고 저개발된 동맹이 있습니다. 이는 우리의 이익에 좋지 않습니다."
 SOV_expand_business_with_south: "남한과의 사업 확장"
 SOV_expand_business_with_south_desc: "한국은 자본과 전문성을 보유하고 있고, 우리는 자원과 인력을 보유하고 있습니다. 이 파트너십은 러시아의 이익에 도움이 될 뿐이며 우리의 영향력을 높일 것입니다."
 SOV_export_more_energy: "남한에게 에너지 수출 증량"
 SOV_export_more_energy_desc: "한국의 경제는 강력합니다. 그들에게 에너지를 공급하면 우리의 지정학적 입지와 영향력이 향상됩니다."
 SOV_support_peaceful_korean_unification: "한반도의 평화적 통일 지원"
 SOV_support_peaceful_korean_unification_desc: "한반도의 평화적 통일은 북쪽의 넓은 시장, 남쪽의 강력한 경제, 그리고 지역 강국의 탄생을 의미합니다. 이는 미국과 중국 간 영향력의 균형을 맞추는 데 도움이 될 것입니다."
 SOV_east_asia_in_democracy: "동아시아 민주화"
 SOV_east_asia_in_democracy_desc: "동아시아, 특히 중국과 북한은 마지막 공산주의 보루입니다. 우리의 정책은 이 민족들을 해방하고 공산주의를 역사 속으로 보내는 데 초점을 맞추어야 합니다."
 SOV_expand_trade_with_taiwan: "대만과의 무역 확장"
 SOV_expand_trade_with_taiwan_desc: "대만은 첨단 반도체와 기타 하이테크 제품을 생산합니다. 무역을 늘리면 우리의 이익과 영향력에 도움이 됩니다."
 SOV_support_taiwan_military_buildup: "대만의 군비 확장 지지"
 SOV_support_taiwan_military_buildup_desc: "중국의 침략을 억제하기 위해 우리는 대만이 방어력을 강화하도록 도와야 합니다."
 SOV_support_south_led_unification: "남한 주도 통일 지지"
 SOV_support_south_led_unification_desc: "The future of Korea lies in Seoul."
 SOV_export_military_hardware_to_south_korea: "남한에 군사 장비 수출"
 SOV_export_military_hardware_to_south_korea_desc: "한국은 한반도 통일을 위해 지원이 필요합니다. 우리는 그들을 지원하기 위해 군사 장비를 제공해야 합니다."
 SOV_behead_autocratic_dragons: "용의 독재를 끝내라"
 SOV_behead_autocratic_dragons_desc: "전체주의 국가들은 사나운 용입니다. 그 머리를 베고, '약탈하라!'고 외치며 전쟁의 개들을 풀어 놓으십시오!"
 SOV_ignite_second_korean_war: "제 2차 한국 전쟁 촉발"
 SOV_ignite_second_korean_war_desc: "북한 정권은 역사의 쓰레기통에나 처박혀야 할 구시대적인 스탈린주의의 유물입니다. 만약 한국이 무력으로 한반도 통일을 선택한다면, 우리는 전폭적인 지지를 보낼 것입니다."
 SOV_outer_space_initiative: "로스코스모스"
 SOV_outer_space_initiative_desc: "Russia's ambitions in space require a financially stable and reliable Roscosmos to lead our exploration and technological efforts."
 SOV_finish_1998_reforms: "1998년 군제 개혁 완료"
 SOV_finish_1998_reforms_desc: "국방장관 이고리 세르게예프 아래 시작된 1998년 개혁은 부대를 전투 준비 부대와 평시 편성 부대로 분류하고 나머지는 장비 보관 기지로 전환했습니다. 항공우주군 또한 재편되었습니다."
 SOV_2001_military_reforms: "Start Military Reforms"
 SOV_2001_military_reforms_desc: "국방장관 세르게이 이바노프는 징병제를 유지하면서 지원병 부대를 상시 전투 준비 상태로 전환하는 개혁을 발표했습니다."
 SOV_increased_arms_exports_2: "무기 수출 증진"
 SOV_increased_arms_exports_2_desc: "무기 수출은 오랫동안 러시아 경제에 필수적이었습니다. 일부 무기가 의심스러운 이들의 손에 들어가더라도, 이러한 거래에서 나오는 수익은 국내 경제를 활성화하는 데 도움이 될 것입니다."
 SOV_reserve_officer_training_system: "예비 장교 훈련 체계"
 SOV_reserve_officer_training_system_desc: "낡은 예비역 장교 훈련 체계는 군사 교육을 개선하여 인원을 더 잘 준비시킬 수 있도록 개혁이 필요합니다."
 SOV_coastal_fleet_reforms: "해안 함대 개혁"
 SOV_form_the_uac: "통합항공기제작사 (UAC) 설립"
 SOV_form_the_uac_desc: "2006년 2월 20일 주요 항공기 제조사들을 합병하여 설립된 통합항공기제작사는 생산을 최적화하고 손실을 줄이는 것을 목표로 합니다."
 SOV_hypersonic_missiles: "초음속 미사일"
 SOV_hypersonic_missiles_desc: "마하 5보다 빠르게 비행하는 극초음속 미사일은 탐지나 보복을 할 시간을 주지 않습니다."
 SOV_mechanized_infantry_renovations: "Use \"Armata\" for APCs and IFVs"
 SOV_mechanized_infantry_renovations_desc: "우리의 기계화 보병은 현재 구소련의 낡은 장갑차와 보병전투차에 의존하고 있으며, 이를 현대화해야 합니다."
 SOV_armata_universal_combat_platform: "아르마타 통합 전투 플랫폼"
 SOV_armata_universal_combat_platform_desc: "아르마타 플랫폼은 구형 전차와 장갑차를 대체하기 위한 차세대 모듈식 중형 궤도 차량입니다."
 SOV_ratnik_program: "라트니크 프로그램"
 SOV_ratnik_program_desc: "라트니크는 현대 기술로 개별 병사의 생존성과 전투 효율을 높이도록 설계된 첨단 전투 장비 체계입니다."
 SOV_csto_training_exercises: "CSTO 교육 훈련"
 SOV_csto_training_exercises_desc: "우리 동맹은 정기적인 합동 훈련과 연습을 통해 굳건히 유지되고 있습니다."
 SOV_rosgvardia: "국가근위대 창설"
 SOV_rosgvardia_desc: "\n\n\n\n\n\n£SOV_desctext_rosguard \n\n\n\n\n\n\n\n\n러시아 국가근위대는 국경 경비, 대테러, 총기 규제, 공공 질서 보호를 임무로 하는 독립적인 내무 무력 조직입니다."
 SOV_form_bars: "특별 전투 예비군 (BARS) 조직"
 SOV_form_bars_desc: "\n\n\n\n\n\n£SOV_desctext_bars \n\n\n\n\n\n\n\n\nThe Special Combat Army Reserve (BARS) consists of tens of thousands of fresh reservists who passed rigorous selection at military enlistment offices and signed defense contracts. Preference is given to those recently discharged who retain vital army skills in key specialties."
 SOV_avtovaz: "AvtoVAZ 차량 제조사"
 SOV_avtovaz_desc: "아프토바즈는 1966년에 설립된 러시아의 대표적인 자동차 제조사입니다. 원래 러시아어로 볼가 자동차 공장을 뜻하는 VAZ로 알려졌습니다. 아프토바즈는 러시아 자동차 역사의 대표 모델인 상징적인 라다 시리즈 생산으로 가장 잘 알려져 있습니다."
 SOV_gaz: "GAZ"
 SOV_gaz_desc: "GAZ(고리키 자동차 공장)는 과거 고리키로 불렸던 니즈니노브고로드에 본사를 둔 러시아의 대표적인 자동차 제조사입니다. 대형 산업 복합 기업 베이식 엘리먼트의 일부인 GAZ 그룹 홀딩의 핵심 자회사입니다."
 SOV_rostech: "Rostec"
 SOV_rostech_desc: "로스텍은 첨단 기술의 개발, 생산, 수출을 전담하는 국영 방위산업 복합기업입니다."
 SOV_rosoboronprom: "로소보른 군수 무역 회사"
 SOV_rosoboronprom_desc: "로스오보론프롬은 러시아의 군수품, 이중 용도 제품, 서비스 및 기술을 수출하는 유일한 국영 수출업체입니다."
 SOV_kbp: "KBP 방산 기업"
 SOV_kbp_desc: "KBP는 툴라에 기반을 둔, 무기 설계를 전문으로 하는 러시아의 선도적인 방위산업 기업입니다."
 SOV_tula_arms: "툴라 조병창"
 SOV_tula_arms_desc: "1712년 표트르 대제가 설립한 툴라 무기 공장은 러시아를 위한 무기를 생산해 온 오랜 역사를 가지고 있습니다."
 SOV_orsis: "오르시스 (Orsis)"
 SOV_orsis_desc: "모스크바에 기반을 둔 오르시스는 군용 및 민간용 정밀 중앙 격발식 소총을 제조합니다."
 SOV_lobaev_arms: "로바예프 소총 제작사"
 SOV_lobaev_arms_desc: "로바예프 암스는 칼루가주에서 운영되며 정밀 소총과 탄약을 설계하고 생산합니다."
 SOV_kamaz: "KAMAZ"
 SOV_kamaz_desc: "1969년에 설립된 KAMAZ는 나베레즈니예첼니에 본사를 둔 러시아의 주요 트럭, 버스, 엔진 생산 기업입니다. 이 회사는 국내외에서 널리 쓰이는 신뢰성 높은 캡오버 트럭으로 유명합니다."
 SOV_aurus: "아우루스 (AURUS)"
 SOV_aurus_desc: "아우루스 모터스는 2018년에 설립된 러시아의 고급 자동차 브랜드입니다. 처음에는 국가 공식 의전 차량으로 쓰이도록 개발되었으며, 이후 고급 모델로 럭셔리 자동차 시장에 진출했습니다."
 SOV_focus_on_luxury_cars: "고급 승용차에 집중"
 SOV_focus_on_luxury_cars_desc: "러시아 국민은 흔한 저가형 라다 그 이상을 누릴 자격이 있습니다. 우리는 아우루스 라인업을 넓히고 다른 고급 자동차 브랜드의 성장을 지원하여 자동차 세계에서 러시아의 위신을 높여야 합니다."
 SOV_focus_on_affordable_cars: "가성비 차량에 집중"
 SOV_focus_on_affordable_cars_desc: "러시아는 현재 수입 차량에 크게 의존하고 있습니다. 국내 시장을 강화하려면 저렴한 러시아산 자동차의 생산을 늘려, 모든 시민이 국산 차량을 소유할 수 있도록 해야 합니다."
 SOV_revitalized_automobile_industry: "자동차 산업 재활성화"
 SOV_revitalized_automobile_industry_desc: "막대한 비용이 든 현대화와 확장 노력 끝에, 우리의 자동차 산업은 마침내 상당한 수준의 생산량과 품질을 달성했습니다. 이 부활은 우리 경제 재건의 중요한 이정표입니다."
 SOV_uralvagonzavod: "우랄바곤자보드"
 SOV_uralvagonzavod_desc: "우랄바곤자보드는 니즈니타길에 위치한 러시아의 주요 기계 제작 기업입니다. 러시아 최대 규모의 산업 단지 중 하나이며 세계 최고의 주력 전차 제조사로 인정받고 있습니다."
 SOV_national_center_for_aviabuilding: "국립 항공 건설 지부"
 SOV_national_center_for_aviabuilding_desc: "러시아 항공 산업은 여전히 우리의 가장 유망한 분야 중 하나입니다. 이 분야에 투자하는 것은 항공우주 기술의 선두 주자로서 우리의 입지를 확보하는 데 필수적입니다."
 SOV_domestic_helicopter_production: "민간 헬레콥터 생산"
 SOV_domestic_helicopter_production_desc: "러시아의 헬리콥터 산업은 세계에서 가장 진보된 헬리콥터 일부를 설계하고 생산해 온 자랑스러운 유산을 지니고 있습니다. 이 성공을 유지하고 확대하려면 지속적인 투자가 필수적입니다."
 SOV_refined_metallurgy: "야금학 (Metallurgy) 개선"
 SOV_refined_metallurgy_desc: "야금은 국가 발전에 필수적인 전략 산업입니다. 미래의 수요를 충족하기 위해 이 부문을 확장하고 현대화하는 데 막대한 투자를 해야 합니다."
 SOV_expand_tungsten_mining: "텅스텐 개발 확장"
 SOV_expand_tungsten_mining_desc: "텅스텐(볼프람)은 탁월한 경도와 높은 밀도를 비롯한 독특한 특성을 지닌 희귀 금속입니다. 이러한 특성 덕분에 철갑탄 같은 군사 용도에서 매우 귀중합니다. 텅스텐 채굴을 확대하면 우리의 자원 기반이 강화될 것입니다."
 SOV_expand_iron_mining: "강철 증산"
 SOV_expand_iron_mining_desc: "철과 탄소의 합금인 강철은 강도와 내구성 덕분에 건설, 기반시설, 운송, 기계, 무기 제조에 필수적입니다. 강철 생산을 늘리는 것은 국가 발전과 방위에 매우 중요합니다."
 SOV_expand_gold_mining: "금 채굴 확장"
 SOV_expand_gold_mining_desc: "금은 경제적 가치뿐 아니라 부식에 강한 전기 커넥터, 적외선 차폐, 색유리, 치과 용도 등 산업적 쓰임새로도 높이 평가됩니다. 금 채굴을 확대하면 경제와 기술 역량이 모두 향상될 것입니다."
 SOV_expand_aluminium_mining: "알루미늄 개발 확장"
 SOV_expand_aluminium_mining_desc: "알루미늄은 운송, 공학, 건설, 포장에 널리 쓰이는 가볍고 내구성 있는 금속입니다. 특히 항공기 제조에 매우 중요합니다. 알루미늄 채굴을 늘리면 핵심 산업과 기술 발전이 뒷받침될 것입니다."
 SOV_industrial_expansion_plan: "산업 확장 계획"
 SOV_industrial_expansion_plan_desc: "1990년대 후반의 심각한 경제 위기로 러시아에는 높은 실업률과 광범위한 빈곤이 남았습니다. 이는 급속한 민영화와 숙련 노동자 및 기업의 서방 유출 때문이었습니다. 2000년대에는 국내외 무역을 활성화하기 위해 민간 산업의 재건에 집중해야 합니다."
 SOV_domestic_aircraft_production_desc: "러시아는 고품질 항공기를 생산해 온 유서 깊은 전통을 지니고 있습니다. 항공우주 분야의 선두를 유지하려면 이 중요한 부문을 확장하고 현대화하는 투자를 우선시해야 합니다."
 SOV_expand_tankograd: "탄코그라드 확장"
 SOV_expand_tankograd_desc: "첼랴빈스크 트랙터 공장의 별칭인 탱코그라드는 대조국 전쟁 당시 전차 생산의 중심지였습니다. 소련 시대 내내 전차를 계속 생산했습니다. 현대적인 확장은 미래를 위해 그 수용력과 생산 역량을 향상시킬 것입니다."
 SOV_domestic_auto_production_desc: "러시아의 소비자용 자동차 산업은 역사적으로 규모가 작았지만, 라다와 아우루스 같은 유명 브랜드가 두각을 나타냈습니다. 이들 기업을 지원하면 수출이 늘고 러시아의 세계적 소프트 파워가 강화될 것입니다."
 SOV_expand_kalashnikov_concern: "'칼리슈니코프 컨선' 무기 제조사 확장"
 SOV_expand_kalashnikov_concern_desc: "과거 이제프스크 기계 제작 공장이었던 칼라시니코프 콘체른은 러시아 최대의 방위 산업 제조사입니다. 국내 소형 화기의 95%를 생산하며 유도 포와 정밀 무기도 설계합니다. 이 기업을 확장하는 것은 우리 군수 산업에 매우 중요합니다."
 SOV_nord_stream: "노르트스트림"
 SOV_nord_stream_desc: "노르트 스트림은 발트해를 가로질러 러시아와 독일을 직접 연결하는 주요 가스 파이프라인입니다. 이 경로는 동유럽 국가들을 우회하여 러시아에 해당 지역에 대한 상당한 영향력을 주고, 독일은 지역 긴장에 휘말리지 않을 수 있게 합니다."
 SOV_east_stream: "실라 시비리(Sila Sibiri) 파이프라인"
 SOV_east_stream_desc: "시베리아의 힘(실라 시비리)은 러시아와 중국을 연결하는 세 번째 주요 파이프라인입니다. 이는 우리의 가까운 동맹에 안정적인 에너지 공급을 보장하고, 우리의 석유 및 가스 수출을 위한 전략 시장을 제공하여 서방의 제재를 우회하는 데 도움이 됩니다."
 SOV_resist_the_washington_consensus: "워싱턴 합의에 저항"
 SOV_resist_the_washington_consensus_desc: "워싱턴이 옐친에게 강요한 경제 정책은 우리 경제를 약화시켰고 서방의 이해 세력이 국가 자산을 취득할 수 있는 문을 열어 주었습니다. 우리는 이러한 계획을 거부하고 러시아 경제를 독자적으로 되살릴 새로운 전략을 수립해야 합니다."
 SOV_sakhalin_railway: "사할린 철도 재활성화"
 SOV_sakhalin_railway_desc: "일본 인근 섬에 위치한 사할린 철도는 지역 경제에 필수적입니다. 이를 현대화하고 되살리면 지역 연결성과 경제 발전이 강화될 것입니다."
 SOV_expand_the_trans_siberian_railroad: "시베리아 횡단 철도 확장"
 SOV_expand_the_trans_siberian_railroad_desc: "시베리아 횡단 철도는 모스크바와 블라디보스토크를 연결하며 러시아 경제의 근간 역할을 합니다. 이 철도망을 확장하는 것은 국가 발전과 무역에 필수적입니다."
 SOV_appease_the_moscow_oligarchs: "Appease the Moscow Oligarchs"
 SOV_appease_the_moscow_oligarchs_desc: "모스크바 올리가르히를 달래기 위해 전략적으로 투자하면 그들의 지지를 확보하고 경제 엘리트층의 안정을 유지할 수 있습니다."
 SOV_high_speed_rail_construction: "고속철도 건설"
 SOV_high_speed_rail_construction_desc: "러시아의 현재 철도 기반시설은 낡았습니다. 고속철도 기술에 투자하면 운송이 현대화되고 전국의 효율성이 개선될 것입니다."
 SOV_explore_arctic_gas_fields: "극지방 가스 추출"
 SOV_explore_arctic_gas_fields_desc: "북극 지역에는 방대한 석유와 천연가스 매장량이 있습니다. 이 가스전을 탐사하고 개발하면 러시아의 에너지 생산 능력이 크게 증가할 수 있습니다."
 SOV_attract_foreign_investors: "외국 투자자 유치"
 SOV_attract_foreign_investors_desc: "외국인 투자를 유치하는 것은 경제 성장을 이끌고 무역 기회를 늘리는 가장 효과적인 방법 중 하나입니다."
 SOV_state_capitalism: "국가자본주의"
 SOV_state_capitalism_desc: "모스크바 올리가르히의 영향력을 제거하는 것은 우리나라의 발전을 위협하는 커져 가는 부패에 맞서는 데 필수적입니다."
 SOV_ignore_oligarchic_corruption: "올리가르히 부패 무시"
 SOV_ignore_oligarchic_corruption_desc: "올리가르히는 핵심 동맹이며, 그들이 재정적으로 기여하는 한 우리는 정치적 안정을 위해 그들의 수상한 활동을 눈감아 줄 수 있습니다."
 SOV_entice_oligarchic_investment: "올리가르히 투자 유도"
 SOV_entice_oligarchic_investment_desc: "올리가르히는 막대한 자본을 보유하고 있습니다. 세금 감면과 인센티브를 제공하면 그들이 경제에 더 적극적으로 투자하도록 장려할 수 있으며, 이는 국가 전체에 이익이 됩니다."
 SOV_root_out_oligarchs: "올리가르히 근절"
 SOV_root_out_oligarchs_desc: "올리가르히 계층을 완전히 없애는 것은 불가능할지 모르지만, 공정성과 국가의 통제권을 회복하려면 경제에 대한 그들의 부당한 영향력을 억제해야 합니다."
 SOV_intl_oil_price_agreements: "국제 유가 협약"
 SOV_intl_oil_price_agreements_desc: "러시아는 15개 석유 수출국의 연합체로서 사실상 세계 유가를 좌우하는 OPEC과 경쟁하고 있습니다. OPEC과 은밀히 협력하면 러시아의 이익을 위해 유가를 안정시키고 끌어올리는 데 도움이 될 수 있습니다."
 SOV_expand_aeroflot_routes: "아에로플로트 항공 노선 확장"
 SOV_expand_aeroflot_routes_desc: "소련 시대부터 러시아의 국영 항공사였던 아에로플로트는 전국으로 노선을 더욱 확장해야 합니다. 이는 국가 단합을 강화하고 경제 통합을 촉진할 것입니다."
 SOV_expand_economic_policy: "경제의 현대화"
 SOV_expand_economic_policy_desc: "현대 경제는 컴퓨팅, 인공지능, 대체 에너지와 같은 첨단 기술을 바탕으로 번영합니다. 러시아는 21세기에 경쟁력을 유지하기 위해 이 분야에 막대하게 투자해야 합니다."
 SOV_southern_arms_exports: "카르지 (Khazri) 프로젝트"
 SOV_southern_arms_exports_desc: "인도 아대륙의 동맹국들에 무기를 수출하면 러시아의 영향력이 확대되고 지역 내 전략적 유대가 강화될 것입니다."
 SOV_nord_stream_2: "노르트스트림 2"
 SOV_nord_stream_2_desc: "노르트 스트림 2는 독일로 이어지는 기존 파이프라인의 확장입니다. 이는 독일의 러시아산 가스 의존도를 높이고 동유럽의 힘의 균형을 더욱 변화시킬 것입니다."
 SOV_manufacturing_improvements_desc: "우리의 산업 기계는 낡아서 생산 품질을 제한하고 있습니다. 효율과 생산량을 높이려면 새로운 제조 기술과 공정을 도입해야 합니다."
 SOV_computers: "산업의 전산화"
 SOV_computers_desc: "산업 공정에 컴퓨터를 통합하는 것은 생산을 현대화하고 모든 부문의 경쟁력을 높이는 데 필수적입니다."
 SOV_expand_the_tech_industry_desc: "정보기술 부문은 전 세계에서 빠르게 성장하고 있습니다. IT에 대한 숙달이 이번 세기의 세계적 리더십을 좌우할 것이며, 러시아는 최전선에서 자리를 차지해야 합니다."
 SOV_advanced_semiconductor_manufacturing_desc: "반도체는 차량에서 컴퓨터, 항공우주에 이르기까지 현대 기술의 근간입니다. 그 생산을 통제하는 것은 국가 안보와 기술 독립에 매우 중요합니다."
 SOV_the_silicon_taiga: "실리콘 타이가 (The Silicon Taiga)"
 SOV_the_silicon_taiga_desc: "'실리콘 타이가'는 급성장하는 러시아 IT 산업을 가리키는 별칭으로, 미국의 실리콘 밸리에 빗댄 표현입니다."
 SOV_yandex: "얀덱스 (Yandex) 검색 엔진"
 SOV_yandex_desc: "얀덱스 LLC는 주로 러시아와 CIS 전역에 인터넷 서비스를 제공하는 러시아 최대의 다국적 기술 기업입니다. 러시아판 구글처럼 기능하며, 러시아어 검색 엔진 시장의 42% 이상을 차지하고 세계 5위에 올라 있습니다."
 SOV_vkontakte: "VK 인터넷 서비스 그룹 (VKontakte)"
 SOV_vkontakte_desc: "브콘탁테(VK)는 상트페테르부르크에 본사를 둔 러시아 최고의 소셜 미디어 및 네트워킹 플랫폼입니다. 흔히 페이스북에 비견되는 VK는 주로 러시아어 사용자를 대상으로 하며, 2018년 기준 5억 개가 넘는 계정이라는 방대한 이용자 기반을 보유하고 있습니다."
 SOV_quantum_computing: "양자 컴퓨터"
 SOV_quantum_computing_desc: "양자 컴퓨터는 양자역학의 원리를 활용하여 기존 컴퓨터의 능력을 훨씬 뛰어넘는 계산을 수행합니다. 확장 가능한 양자 컴퓨터는 암호학, 물리 시뮬레이션, 복잡한 문제 해결과 같은 분야에 혁명을 일으킬 수 있습니다."
 SOV_uranium_one_sale_desc: "우라늄 원은 로사톰 국영 기업 산하의 국제 핵연료 그룹입니다. 2010년 러시아 측에 매각되어 2013년에는 모스크바에 본사를 둔 우라늄 원 그룹의 완전 자회사가 되었으며, 세계 핵 시장에서 러시아의 입지를 강화했습니다."
 SOV_jinr: "합동 핵 연구 기관"
 SOV_jinr_desc: "두브나에 위치한 합동원자핵연구소는 18개국 출신의 박사 학위 소지 연구원 1,200명을 포함해 5,500명 이상의 직원을 둔 다국적 핵과학 연구 센터입니다. 이론 물리학, 입자 물리학, 중이온 물리학 등을 아우르는 7개의 전문 연구실을 갖추고 있습니다."
 SOV_gamaleya_institute: "가말레야 (Gamaleya) 연구소"
 SOV_gamaleya_institute_desc: "가말레야 역학·미생물학 연구소는 보건부 산하의 러시아 주요 의학 연구 센터입니다. 시장에 출시된 최초의 코로나19 백신인 스푸트니크 V를 개발하여 세계적인 명성을 얻었습니다."
 SOV_tighten_ties_with_ukraine: "Tighten Ties with Ukraine"
 SOV_tighten_ties_with_ukraine_desc: "일부 우크라이나인은 이를 온전히 이해하기 어려울지도 모르지만, 우리는 분명히 해야 합니다. 우리는 같은 민족이자 같은 유산을 공유합니다. 그렇기에 그들과 더 가깝고 우호적인 관계를 키우는 것이 필수적입니다. 이 유대를 강화하는 것은 장기적으로 양국 모두에 이익이 될 것입니다."
 SOV_CSTO_enlargement_with_ukr: "우크라이나를 CSTO로 초대"
 SOV_CSTO_enlargement_with_ukr_desc: "벨라루스는 이미 우리 형제 동맹의 일원입니다. 이제 우크라이나에 우리의 신뢰할 수 있는 블록에 가입하도록 초청하여 집단 안보와 협력을 강화할 때입니다."
 SOV_mutual_economic_prosperity: "상화 경제 협력"
 SOV_mutual_economic_prosperity_desc: "이웃 국가들은 서로 간의 무역에 장벽을 세워서는 안 됩니다. 경제 성장을 촉진하려면 자유 무역을 가로막는 모든 장애물을 제거하고 상호 번영을 장려해야 합니다."
 SOV_ukrainian_russian_defense: "상호 러시아-우크라이나 방위"
 SOV_ukrainian_russian_defense_desc: "형제로서 러시아와 우크라이나는 서로를 지키기 위해 단결해야 합니다. 우리는 어떤 대가를 치르더라도 서로를 보호하고 나란히 싸울 것을 약속합니다."
 SOV_religious_subjugation: "종교적 종속"
 SOV_religious_subjugation_desc: "우크라이나가 독자적인 교회를 유지할 필요는 없습니다. 우리 두 민족은 모두 정교회 신자이며, 종교적 이유로 우리를 갈라놓을 것은 없습니다. 신앙의 일치는 우리의 유대를 강화하는 데 도움이 될 것입니다."
 SOV_promote_russian_language: "이언어 국가"
 SOV_promote_russian_language_desc: "우크라이나에서 러시아어를 장려하고 우리 민족을 가르는 언어 장벽을 마침내 허물 때입니다. 더 큰 언어적 단합은 이해와 협력을 증진할 것입니다."
 SOV_brotherhood_forever: "Brotherhood Forever!"
 SOV_brotherhood_forever_desc: "우리는 역사와 문화를 공유하는 포스트 소비에트 형제입니다. 앞으로 여러 세대에 걸쳐 이 변치 않는 우정을 지키고 가꾸는 것이 중요합니다."
 SOV_eat_burgers_with_obama: "오바마와 함께 햄버거를"
 SOV_eat_burgers_with_obama_desc: "우리의 지정학적 부활을 알리기 위해 대통령을 과거의 라이벌이자 오늘날의 친구인 미국에 국빈 방문 보낼 것입니다. 이 상징적인 만남은 협력과 외교의 새로운 장을 알립니다."
 SOV_freedom_better_than_non_freedom: "Freedom Better Than Oppression"
 SOV_freedom_better_than_non_freedom_desc: "시민을 억압하는 것은 아무 소용이 없습니다. 국가는 자유로운 사고와 창의성을 보호해야 하며, 이것이 우리나라를 재건하고 강화하는 데 필요한 아이디어를 만들어 냅니다."
 SOV_police_not_milice: "Politsiya, Not Militsiya!"
 SOV_police_not_milice_desc: "대대적인 경찰 개혁의 일환으로 우리는 보안 기관의 위신과 전문성을 회복하고자 합니다. 밀리치야를 폴리치야로 개칭하는 것은 이 목표를 달성하는 핵심 단계입니다."
 SOV_crush_cult_of_stalin: "Condemn the Cult of Stalin"
 SOV_crush_cult_of_stalin_desc: "우리 동료 시민 중 다수는 여전히 스탈린이 러시아의 가장 위대한 지도자였다고 믿고 있습니다. 우리는 이 개인숭배를 해체하고 러시아 국민이 대신 현재와 미래의 지도자들을 신뢰하도록 장려해야 합니다."
 russia.22.t1: "United States Accepts Our Demand"
 russia.22.d1: "미국이 알래스카에 대한 우리의 요구를 수락했습니다. 우리는 마침내 북방 영토의 통제권을 되찾았으며, 이는 우리 국가의 상징적이고 전략적인 승리입니다."
 russia.22.o1: "러시아에 영광을(Slava Rossii)!"
 russia.23.t1: "U.S. Declines Our Demand"
 russia.23.d1: "미국이 알래스카 반환 요청을 거부했습니다. 우리 것을 되찾으려면 싸워야 할 것입니다."
 russia.23.o1: "We'll prepare them a 'gift' then."
 russia.32.t: "러시아의 군수산업 투자 제안"
 russia.32.d: "러시아가 우리 군수 산업에 대한 공동 투자를 제안했습니다. 그들은 우리의 방어 능력과 경제적 유대를 모두 강화하기 위해 무기 공장을 건설할 의사가 있습니다. 이를 수락하면 우리의 방위 산업이 바뀔 수 있습니다."
 russia.32.o1: "좋다!"
 russia.32.o2: "러시아인들은 물러나라!"
 russia.33.t: "러시아 쿠데타에 대한 유언비어 확산!"
 russia.33.d: "어느 정도 믿을 만한 정보원들이 친러시아 세력이 꾸미는 쿠데타 시도 가능성을 알려 왔습니다. 이 위협을 막으려면 모스크바와 연줄이 있는 부패한 관료들을 체포하는 등 신속히 행동해야 할지도 모릅니다."
 russia.33.o1: "흠..."
 russia.34.t: "Ukrainian Coup Succeeded!"
 russia.34.d: "키이우발 보도에 따르면 친러시아 세력이 정부를 장악했습니다. 모스크바에 충성하는 새 행정부가 이제 권력을 잡고 있습니다."
 russia.34.o1: "우라!"
 russia.35.t: "실패한 우크라이나 쿠데타!"
 russia.35.d: "친러시아 세력은 우크라이나 정부 장악 시도에 실패했습니다. 모든 공모자가 체포되었으며, 키이우는 공식 항의서를 제출했습니다."
 russia.35.o1: "망할!"
 russia_news.9.t: "Russian Coup in Ukraine Succeeded."
 russia_news.9.d: "키이우발 보도에 따르면 친러시아 세력이 우크라이나 행정부 장악에 성공하여 충성스러운 정부를 세웠습니다. 러시아는 쿠데타에 대한 어떠한 연루도 부인하고 있습니다."
 russia_news.9.o1: "러시아인들이 또 러시아 했네."
 russia_news.9.o2: "우리 형제들은 올바른 길을 선택했다!"
 russia_news.9.o3: "What the hell?"
 russia_news.10.t: "우크라이나 내부 러시아 쿠데타의 실패"
 russia_news.10.d: "키이우발 보도에 따르면 친러시아 공작원들은 행정부 장악에 실패했습니다. 러시아는 반란 세력이나 실패한 음모에 대한 어떠한 연루도 부인하고 있습니다."
 russia_news.10.o1: "러시아인들이 또 러시아 했네."
 russia_news.10.o2: "망할!"
 russia_news.10.o3: "망할 러시아인들."
 russia.30.t: "Sayano-Shushenskaya Hydroelectric Power Plant Incident"
 russia.30.d: "러시아 최대의 수력 발전 시설에 재앙이 닥쳤습니다. 사야노-슈셴스카야 발전소의 터빈 하나가 붕괴하여 직원 75명이 사망하고 댐에 심각한 피해가 발생했습니다. 현재 보고에 따르면 터빈 10기 중 9기가 가동 불능 상태가 되었습니다. 상황은 위급하며 즉각적인 조치가 필요합니다."
 russia.30.o1: "정부 자금을 동원하여 최대한 빠르게 복구해라!"
 russia.30.o2: "실질적인 피해를 검열해라"
 russia_news.6.t: "Sayano-Shushenskaya Hydroelectric Power Plant Incident"
 russia_news.6.d: "오늘 아침 러시아 최대의 수력 발전소인 사야노-슈셴스카야 시설에 재앙이 닥쳤습니다. 터빈 하나가 붕괴하여 직원 75명이 사망하고 댐이 심각하게 손상되었습니다. 보고에 따르면 터빈 10기 중 9기가 영향을 받아 발전소 가동이 마비되었습니다."
 russia_news.6.o1: "끔찍하군."
 russia_news.6.o2: "우리의 조의를 표한다."
 russia_news.6.o3: "러시아가 안녕하기를 바란다"
 russia_news.6.o4: "그들의 업보다!"
 russia_news.7.t: "Russia Joins the WTO!"
 russia_news.7.d: "오랜 협상 끝에 러시아가 세계무역기구(WTO)에 가입이 승인되었습니다. 승인을 얻기 위해 러시아는 특히 미국과 EU에 실질적인 경제 개혁의 증거를 보여야 했습니다. 러시아 국영 언론은 이를 탈소비에트 회복의 이정표로 환영하고 있습니다."
 russia_news.7.o1: "우리의 포문을 열고 있다!"
 russia_news.7.o2: "러시아가 세계와 가까워지고 있다."
 russia_news.7.o3: "러시아가 세계와 가까워지고 있다."
 russia_news.7.o4: "저주받을 놈들."
 russia_news.8.t: "기동대를 경찰로 명명하는 러시아"
 russia_news.8.d: "드미트리 메드베데프 대통령이 러시아의 '밀리치야'를 '폴리치야'로 개칭하는 포괄적인 개혁법에 서명했습니다. 이 법률은 경찰관의 새로운 권리와 책임을 규정하고, 중복된 직무를 없애며, 경찰과 사회 간의 협력 관계를 조성하여 대중의 신뢰를 높이는 것을 목표로 합니다."
 russia_news.8.o1: "정말 흥미롭군."
 russia_news.8.o2: "Good"
