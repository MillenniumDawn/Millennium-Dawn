 china_sar.048.d: "Законодательный совет сделал свой выбор: Специальный административный регион будет упразднён, а Гонконг перейдёт под прямое управление Пекина. Долгий путь синизации завершён — местные власти сами просят ускорить процесс передачи полномочий, и в регионе больше не осталось сил, способных бросить вызов новому порядку."
