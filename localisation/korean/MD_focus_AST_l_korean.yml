 radical_protections_ast_desc: "우리나라는 평등과 지원의 새 시대에 들어섰습니다. 전국에서 평등한 대우와 기회를 강제하는 새롭게 활력을 찾은 제도의 뒷받침으로, 소외된 이들은 따뜻한 손길 속에서 사회의 제자리를 찾게 될 것입니다."
