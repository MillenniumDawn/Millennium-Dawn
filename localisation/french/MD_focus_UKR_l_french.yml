 ukraine_light_transport_tender.1.name: "Light Transport Vehicle Tender"
 ukraine_light_transport_tender.1.desc: "The vehicle, depicted on the image - is Soviet-era UAZ-469, nicknamed \"the small goat\". You may understand, why our Armed Forces want to replace it with some more specific, more potent and modern equipment. The tender we have held previously has attracted several Ukrainian proposals for a new light vehicle. The designs range from a simple unarmored utility vehicle to more capable protected platforms. Three proposals have emerged as the most promising: the LuAZ-1901 Heoloh, the D-041 Step and the Dozor-A. The LuAZ-1901 Heoloh can be bought as a small batch right away or built in series at the Lutsk Automobile Plant."
 ukraine_light_transport_tender.1.a: "Buy a small batch of the §YLuAZ-1901 Heoloh§!"
 ukraine_light_transport_tender.1.b: "Expand the Lutsk plant to build the §YLuAZ-1901 Heoloh§!"
 ukraine_light_transport_tender.1.c: "Select the §YD-041 Step§!"
 ukraine_light_transport_tender.1.d: "Select the §YDozor-A§!"
 ukraine_light_transport_tender.2.name: "The D-041 Step Configuration"
 ukraine_light_transport_tender.2.desc: "The D-041 Step can be developed in several configurations. The most practical proposals are a pickup truck intended for cargo and general utility duties, or a closed-body version providing better protection for personnel and equipment."
 ukraine_light_transport_tender.2.a: "Choose the §Ypickup§! configuration"
 ukraine_light_transport_tender.2.b: "Choose the §Yclosed-body§! configuration"
 ukraine_light_transport_tender.3.name: "The Dozor-A Configuration"
 ukraine_light_transport_tender.3.desc: "The Dozor-A can be provided to us in several configurations. It can be armed with a PKM general-purpose machine gun right from the factory or we can save our costs by not arming it at all."
 ukraine_light_transport_tender.3.a: "Choose the §Yunarmed§! variant"
 ukraine_light_transport_tender.3.b: "Choose the §YPKM-armed§! variant"
 ukraine_light_transport_tender.4.name: "The Lutsk Plant Expansion Is Complete"
 ukraine_light_transport_tender.4.desc: "The new workshops of the Lutsk Automobile Plant are ready. The expanded plant can now build the LuAZ-1901 Heoloh in series for our Armed Forces."
 ukraine_light_transport_tender.4.a: "Start the production line"
 ukraine_light_transport_tender_lutsk_expansion_tt: "In §Y240 to 300 days§!, §YVolyn§! gains §G1 Military Factory§! and a §YLuAZ-1901 Heoloh§! production line starts."
