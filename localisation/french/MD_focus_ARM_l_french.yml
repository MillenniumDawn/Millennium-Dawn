 ARM_mister_p: "[ARM_Pashik_misters_loc]"
 ARM_mister_p_desc: "Nous devons rencontrer le président russe afin de renforcer nos relations et le convaincre que nous ne sommes pas contre lui."
 ARM_crackdown_on_corruption: "Répression de la corruption"
 ARM_crackdown_on_corruption_desc: "\"No more bribes, no more monopolies, human rights will be protected, rule of law will prevail!\" - said protest leader Nikol Pashinyan, in his speech before Armenia's parliament voted him as the country's new prime minister."
 ARM_exit_problems: "Sortir des problèmes"
 ARM_exit_problems_desc: "Notre nouvel agenda est la SORTIE de tous les problèmes. Nous sommes le parti du changement !"
 ARM_educ_curicullum: "Nouveau programme éducatif"
 ARM_educ_curicullum_desc: "L'éducation doit être transformée dans notre nouvelle ère. Nous devons faire en sorte que toute l'éducation obéisse à nos nouvelles préférences idéologiques."
 ARM_renew_view_hist: "Renouveler la vision de l'histoire arménienne"
 ARM_renew_view_hist_desc: "La vision de l'histoire arménienne doit être remodelée selon les idées de notre leader. Le monde est fait de perspectives, et il est de notre devoir de les changer !"
 ARM_irrecons_contr: "Résoudre les contradictions irréconciliables"
 ARM_irrecons_contr_desc: "De nombreuses contradictions entre libéralisme et nationalisme existent dans notre constitution. Nous devons les résoudre et modifier la constitution."
 ARM_gather_loyalists: "Rassembler les loyalists"
 ARM_gather_loyalists_desc: "Nous devons rassembler tous les fidèles de notre parti afin de les placer aux postes ministériels respectifs. Ces maudits technocrates sont tellement déloyaux politiquement qu'ils risquent de devenir un problème pour notre appareil administratif."
 ARM_investig_clique: "Enquêter sur la clique"
 ARM_investig_clique_desc: "La clique SerzhoRob doit être enquêtée pour enfin purger notre pays du sang des répressions et de la corruption."
 ARM_change_gov_structure: "Modifier la structure gouvernementale"
 ARM_change_gov_structure_desc: "Notre structure gouvernementale ne correspond plus à la manière dont les choses sont faites efficacement. Nous devons changer cela."
 ARM_social_media_prop: "Propagande sur les réseaux sociaux"
 ARM_social_media_prop_desc: "Pour convaincre la population que nous avons raison, notre leader doit être constamment présent dans l’espace médiatique de nos citoyens. Chaque Arménien lira et regardera notre grand leader national, proche du peuple."
 ARM_hijack_nat_voters: "Détourner les électeurs nationalistes"
 ARM_hijack_nat_voters_desc: "Pour augmenter le soutien à notre Premier ministre, nous devons nous adresser aux masses, y compris à la droite radicale."
 ARM_era_of_peace: "Agenda de l'ère de la paix"
 ARM_era_of_peace_desc: "Notre nouvelle doctrine est la paix, pas la guerre ! Nous devons oublier ce qui s'est passé en 1915 et dans les années 90. Nous sommes maintenant un nouveau pays."
 ARM_police_guard: "Garde policière"
 ARM_police_guard_desc: "Nous avons l'intention de créer une unité distincte des forces de police. La Garde de police exercera exclusivement des fonctions de maintien de l'ordre civil et ne participera pas à des opérations de combat."
 ARM_csto_dilemm: "Position sur l'OTSC ?"
 ARM_csto_dilemm_desc: "Nous devons décider quelle est notre position vis-à-vis de l'OTSC. Devons-nous la quitter ou renforcer nos liens ?"
 ARM_anti_belarus_rhetoric: "Rhétorique anti-biélorusse"
 ARM_anti_belarus_rhetoric_desc: "Le Bélarus soutient depuis longtemps les atrocités commises par l'Azerbaïdjan. Il est impératif d'agir !"
 ARM_NGO_friend: "Se lier d'amitié avec les ONG"
 ARM_NGO_friend_desc: "Notre jeune démocratie a besoin d'alliés. Les ONG remplissent parfaitement ce rôle !"
 ARM_you_are_that_one_man: "« Et tu es cet homme »"
 ARM_you_are_that_one_man_desc: "Nikol Pashinyan is a man of common folk! He knows what village people need and they in turn, are responsible for each election. You are that one man who decides the fate of Armenia!"
 ARM_i_am_that_one_man: "« Et je suis cet homme »"
 ARM_i_am_that_one_man_desc: "Nikol Pashinyan est l'élu ! Pas seulement par les élections, mais aussi par Dieu. Le choix du peuple reflète finalement l'arrangement cosmique des pouvoirs qui a amené Nikol, notre leader, au pouvoir."
 ARM_armenia_pashik_idea: "Arménie de Pashinyan"
 ARM_loyalists_in_government: "Loyalistes au gouvernement"
 ARM_armenian_soc_media_prop_idea: "Propagande sur les réseaux sociaux"
 ARM_pashinyan_anti_corrupt_idea: "Politique anti-corruption"
 ARM_education_reforms: "Réformes de l'éducation"
 ARM_true_pashik_democracy: "Bastion caucasien de la démocratie"
 ARM_controlled_democracy: "Démocratie contrôlée"
 ARM_new_era_of_peace_idea: "Ère de paix"
 ARM_support_of_ngo_idea: "Soutien aux ONG"
 arm_pashinyan.1.t: "[ARM_Pashik_misters_loc]"
 arm_pashinyan.1.d: "[ARM.GetNameWithFlag] government claims that their liberal government does not pose a threat to us and they agree to further co-operation"
 arm_pashinyan.1.a: "D’accord, nous acceptons."
 arm_pashinyan.1.b: "Non."
 arm_pashinyan.2.t: "[SOV.GetNameWithFlag] Trusted Us"
 arm_pashinyan.2.d: "[FROM.GetNameWithFlag] a accepté notre position et nous a également confirmé qu’ils ne nous considéraient pas comme leur ennemi."
 arm_pashinyan.2.a: "Bien."
 arm_pashinyan.3.t: "[SOV.GetNameWithFlag] Doesn't Trust Us"
 arm_pashinyan.3.d: "[FROM.GetNameWithFlag] said that our foreign policy is a threat to them, and our attempt to change their minds is just a cover for our co-operation with [SOV.GetNameWithFlag] enemies"
 arm_pashinyan.3.a: "Mauvais."
 arm_pashinyan.5.t: "Le peuple nous soutient"
 arm_pashinyan.5.d: "Il y a deux ans, nous avons promis d’améliorer la vie de nos citoyens, et nous y sommes parvenus avec succès. Maintenant, le peuple nous soutient pleinement."
 arm_pashinyan.5.a: "Bien."
 arm_pashinyan.6.t: "Ils se souviennent de nos promesses ?"
 arm_pashinyan.6.d: "De manière inattendue, le peuple s’est souvenu de nos paroles selon lesquelles nous améliorerions leur niveau de vie. Maintenant, il ne nous reste plus qu’à justifier cet échec par d’autres raisons."
 arm_pashinyan.6.a: "Nous pensions pouvoir nous en sortir sans trop dépenser..."
 arm_pashinyan.7.t: "Contradictions dans la Constitution"
 arm_pashinyan.7.d: "Il y a plusieurs articles contradictoires dans notre constitution qui nous empêchent d’établir des relations diplomatiques normales avec nos voisins."
 arm_pashinyan.7.a: "D’accord."
 arm_pashinyan.8.t: "Rivaux au pouvoir"
 arm_pashinyan.8.d: "Serzh Sargsyan et Robert Kotcharian menacent notre pouvoir car ils pourraient y revenir. Nous devons saper leur autorité."
 arm_pashinyan.8.a: "Mener une enquête complète."
 arm_pashinyan.8.b: "Une simple calomnie politique suffira."
 arm_pashinyan.9.t: "Question du système politique"
 arm_pashinyan.9.d: "Maintenant que notre programme politique a atteint la plupart de ses objectifs, nous devons décider comment avancer dans l’avenir. Nous pouvons continuer à adhérer aux principes démocratiques, ou limiter quelque peu les libertés politiques."
 arm_pashinyan.9.a: "Nous ne devons pas perdre notre emprise."
 arm_pashinyan.9.b: "Nous avons promis la démocratie au peuple, nous nous y tiendrons."
 arm_pashinyan.10.t: "Discours anti-Biélorussie au Parlement"
 arm_pashinyan.10.d: "« Je déclare que dorénavant, je ne me rendrai plus jamais en Biélorussie tant que le président Alexandre Loukachenko y sera. Et plus généralement, je déclare qu’à partir de maintenant, aucun représentant officiel de l’Arménie ne se rendra en Biélorussie. Jamais. »"
 arm_pashinyan.10.a: "Je déteste les pommes de terre."
 arme.35.t: "Dilemme de l’OTSC"
 arme.35.d: "L’OTSC s’est révélée inefficace pour notre pays, car nos alliés nominaux refusent de nous aider contre les Azerbaïdjanais, qui violent constamment notre intégrité territoriale. Nous devons décider quoi faire de notre statut dans l’OTSC."
 arme.35.a: "Déchirez les documents et dites au revoir !"
 arme.35.b: "Peut-être devrions-nous geler notre adhésion."
 arme.36.t: "[ARM.GetNameWithFlag] quitte l’OTSC !"
 arme.36.d: "Récemment, la partie arménienne a annoncé qu’elle souhaite quitter l’OTSC et organise actuellement la documentation pour une sortie complète de l’organisation. Cela affectera grandement notre influence dans la région."
 arme.36.a: "Enroulez-les comme une saucisse !"
 arme.37.t: "[ARM.GetNameWithFlag] gèle son adhésion à l’OTSC !"
 arme.37.d: "Récemment, la partie arménienne a annoncé qu’elle souhaite geler son adhésion à l’OTSC, mais elle n’organise pas la documentation pour une sortie complète de l’organisation. Peut-être s’agit-il d’une décision politique visant la politique intérieure de leur pays."
 arme.37.a: "Hein ?"
