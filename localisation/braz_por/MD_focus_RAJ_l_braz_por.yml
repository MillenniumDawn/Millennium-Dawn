 indian_event.83.t:0 "O Califado Exige Submissão"
 indian_event.83.d:0 "Délhi convoca [ROOT.GetName] a abraçar a união na fé e a se curvar ao domínio de [FROM.GetName]. A recusa significa guerra."
 indian_event.83.a:0 "Submeter-se ao Califado."
 indian_event.83.b:0 "Recusar e se preparar para a guerra."
