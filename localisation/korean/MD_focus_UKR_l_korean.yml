 UKR_vote_sit_deficit_higher_tt: "  §R-20%§!: 우리 예산이 큰 적자를 기록 중"
 UKR_vote_sit_deficit_lower_tt: "  §G+20%§!: 우리 예산이 큰 적자를 기록 중"
 UKR_vote_sit_war_tt: "  [?UKR_vote_war|+0]%: 전쟁 속에서 우리나라를 방어하고 있음"
 UKR_vote_sit_majority_ukrainian_tt: "  §G+20%§!: §Y친우크라이나 다수파§!가 강한 군대와 보안 기관을 지지함"
 UKR_vote_sit_majority_russian_tt: "  §G+20%§!: §Y친러 다수파§!가 연금 인상을 지지함"
 UKR_vote_sit_majority_russian_army_tt: "  §R-20%§!: §Y친러 다수파§!가 군대 확대에 반대함"
 UKR_vote_sit_majority_western_tt: "  §G+20%§!: §Y친서방 다수파§!가 교육과 더 간소한 국가를 지지함"
 UKR_vote_sit_kleptocracy_tt: "  [?UKR_vote_klepto|+0]%: 베르크호프나 라다의 올리가르히들이 국가 기구를 보호함"
 UKR_vote_sit_lobbied_tt: "§G+30%§!: 의원들에게 로비를 했음"
 UKR_lobby_the_deputies: "의원 로비"
 UKR_lobby_the_deputies_desc: "§Y베르크호프나 라다§!의 복도에서 오가는 면담과 약속, 호의가 다음 표결을 우리에게 유리하게 돌려놓을 수 있습니다."
 UKR_rada_lobbied_flag: "의원들에게 로비함"
 UKR_lobby_the_deputies_tt: "§Y베르크호프나 라다§!의 다음 지출 요청은 찬성 가중치를 §G+30%§! 얻음 (§Y60§!일 동안)"
 UKR_modernize_su27up2m: "§YSu-27UB§! 전투기 현대화"
 UKR_modernize_su27up2m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§W§YSu-27UP2M§!은 §R소련§!의 §YSu-27UB§! 복좌 전투 훈련기를 자포리자 국영 항공기 수리 공장 §LMiGremont§!에서 우크라이나식으로 현대화한 기종입니다.\n이 현대화로 개선된 항법 및 정보 체계, 헬멧 장착 조준 및 표시 체계, 자동 채프·플레어 살포기, 업그레이드된 전투 운용 컴퓨터가 도입되었습니다.\n이러한 개선으로 항공기의 조준 능력이 향상되고, 더 다양한 공중 발사 무장을 사용해 공중과 지상의 목표를 모두 공격할 수 있는 능력이 확대되었습니다.\n게임에서는 갱신된 대응 장비 대신 오무트-KM 전자전 시스템(EWS)을 사용합니다.§!"
 UKR_modernize_su24mu: "§YSu-24M§! 공격기 현대화"
 UKR_modernize_su24mu_desc: "§W§YSu-24MU§!는 §R소련§!의 §YSu-24M§! 전선 저고도 공격기를 우크라이나에서 현대화한 기종으로, 현대전의 요구 조건에 맞게 개조되었습니다.\n이 현대화에는 적의 레이더 유도 방공 시스템에 대한 항공기의 생존성을 높이도록 설계된 §Y오무트-KM§! 공중 전자 대응 시스템이 도입되었습니다.\n이 항공기는 영국-프랑스의 §Y스톰 쉐도우§!와 국산 §YR-360L 넵툰-D§! 순항 미사일을 비롯한 현대식 정밀 유도 무기 및 기타 첨단 공중 발사 무장을 운용할 수 있도록 개조되어 타격 능력이 크게 확대되었습니다.§!"
 UKR_modernize_l39_m1: "L-39C 알바트로스 훈련기 현대화"
 UKR_developed_l39_m1_flag: "§YL-39 알바트로스 훈련기 현대화§! 결정을 완료함"
 UKR_modernize_l39_m: "L-39C 알바트로스 훈련기 추가 현대화"
 UKR_modernize_l39_m1_desc: "§YL-39M1 알바트로스§!는 §R체코슬로바키아§!의 §YL-39C§! 제트 훈련기를 우크라이나에서 현대화한 기종으로, 비행 성능을 높이고 운용 수명을 늘리기 위해 개발되었습니다.\n이 현대화에는 기체의 전면 정비, 기존 AI-25TL 엔진을 더 강력한 AI-25TLSH로 교체하는 작업, 엔진 제어 시스템 개량이 포함됩니다.\n통합 위성 항법 시스템과 개선된 비행 자료 기록 장치는 항법 정확도와 비행 감시, 운용 신뢰성을 향상시킵니다.\n이러한 개선으로 항공기의 성능이 향상되고, 우크라이나가 보유한 기존 §R소련 시대§! 훈련기 편대의 운용 수명이 늘어납니다."
 UKR_modernize_l39_m_desc: "§YL-39M 알바트로스§!는 §R체코슬로바키아§!의 §YL-39C§! 제트 훈련기를 우크라이나에서 추가로 현대화한 기종으로, 현대 전투기 조종사 훈련의 수준을 높이기 위해 설계되었습니다.\n§YL-39M1§!의 개선 사항에 더해, 이 항공기에는 다기능 조종석 디스플레이와 헤드업 디스플레이, 전투 모드 모의용 전용 조작 장치를 갖춘 §YBTK-39§! 탑재 훈련 복합 체계가 장착됩니다.\n이 체계는 MiG-29 전투기의 조준 및 전투 시스템 요소를 재현하여, 조종사가 전용 훈련기로 절차를 연습하고 전투 기량을 쌓을 수 있게 합니다.\n일선 전투기보다 운용 비용이 훨씬 낮으면서도 더 발전된 훈련 환경을 제공함으로써, §YL-39M§!은 우크라이나가 보유한 기존 훈련기 편대의 활용도를 유지하면서 조종사 양성 수준을 높입니다."
 UKR_develop_horlytsia: "§YAn-BK-1 호를리차§! 무인 항공기 (UAV) 개발"
 UKR_develop_horlytsia_desc: "§W§YAn-BK-1 호를리차§!는 §Y안토노프§! 국영 기업이 개발한 우크라이나의 전술 정찰 및 타격용 무인 항공기입니다.\n지상군을 지원하도록 설계된 이 기체는 주야간 공중 정찰과 실시간 정보 수집 및 표적 획득 능력을 결합했습니다.\n탑재된 감시 체계는 적 표적의 탐지와 추적을 가능하게 하며, 포병 부대와 전장 지휘관에게 귀중한 정보를 제공합니다.\n또한 이 플랫폼은 지상 표적을 공격하기 위한 무장을 탑재하도록 설계되어, 유인 항공기의 위험을 줄이면서 추가적인 정밀 타격 능력을 제공합니다.§!"
 UKR_zelenskiy_popularity_TT: "£ukr_servant_of_the_people (SN) - 국민의 종 지지율 변화: §G+12.00%§!"
 UKR_sevastopol_received: "(§G수령§!)"
 UKR_sevastopol_not_received: "(§R미수령§!)"
 UKR_restore_an_71_with_project: "§YAn-71§!\n조기경보기 작업 재개 §G(AWACS 사업 완료)§!"
 UKR_restore_an_71_with_project_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YAn-71§!은(는) §L안토노프 설계국§!이 §YAn-72§! 수송기를 바탕으로, 앞으로 기운 수직꼬리날개 위에 레이더 돔을 얹어 제작한 조기경보기입니다. 1985년 7월 12일에 첫 비행을 했으며 §R소련§! 전선 항공대를 지휘할 목적이었으나, 사업은 §R소련§!과 함께 막을 내렸고 §Y베가-M 크반트§! 레이더는 지상 잡음 문제를 끝내 완전히 해결하지 못했습니다.\n§Y03호§! 시제기는 362회 비행 후 지금도 안토노프에 남아 있으며, 인도가 이 기종 구매에 관심을 보인 바 있습니다. 사업을 재개하면 우리 공군도 자체 조기경보기를 갖게 됩니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y베르호우나 라다§!가 더 높은 국방 예산을 승인하는 데 호의적으로 돌아섭니다.§!\n\n§G우리 기술진은 이미 §Y공중조기경보통제기§! 사업을 완료했으므로, 작업이 §G더 빠르고§! 비용도 §G더 적게§! 듭니다.§!"
 UKR_restore_an_71_without_project: "§YAn-71§!\n조기경보기 작업 재개 §R(AWACS 사업 미완료)§!"
 UKR_restore_an_71_without_project_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_soviet_an_71_development_for_tooltip\n\n\n\n\n\n\n\n\n§W§YAn-71§!은(는) §L안토노프 설계국§!이 §YAn-72§! 수송기를 바탕으로, 앞으로 기운 수직꼬리날개 위에 레이더 돔을 얹어 제작한 조기경보기입니다. 1985년 7월 12일에 첫 비행을 했으며 §R소련§! 전선 항공대를 지휘할 목적이었으나, 사업은 §R소련§!과 함께 막을 내렸고 §Y베가-M 크반트§! 레이더는 지상 잡음 문제를 끝내 완전히 해결하지 못했습니다.\n§Y03호§! 시제기는 362회 비행 후 지금도 안토노프에 남아 있으며, 인도가 이 기종 구매에 관심을 보인 바 있습니다. 사업을 재개하면 우리 공군도 자체 조기경보기를 갖게 됩니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y베르호우나 라다§!가 더 높은 국방 예산을 승인하는 데 호의적으로 돌아섭니다.§!\n\n§R우리는 §Y공중조기경보통제기§! 사업을 완료하지 못했으므로 안토노프는 처음부터 시작해야 합니다. 작업은 §R더 오래§! 걸리고 비용은 §R더 많이§! 듭니다. 사업은 도중에 완료됩니다.§!"
 UKR_restore_an_71_phalcon_mission: "§Y팔콘§!에 대한 이스라엘의 승인"
 UKR_restore_an_71_phalcon_mission_desc: "§W엘타는 예루살렘이 수출을 승인할 만큼 우리를 신뢰할 때에만 §YAn-71§!용 §Y팔콘§! 레이더를 인도합니다. 레이더 자체는 제때 준비되지만, 거래의 성사 여부는 정치에 달려 있습니다.\n\n§Y요건:§!\n- §Y이스라엘§!의 우리에 대한 호감도 §Y40§! 이상\n- §Y이스라엘§!에 대한 우리의 영향력 §Y5%§! 초과\n\n실패하면 거래는 취소되고 이스라엘은 대금의 일부만 돌려줍니다.§!"
 ukraine_modernize_planes_restore_an_71_kvant_fast_tt: "약 §Y4개월§! 뒤 §YAn-71§!이 소련제 §Y크반트§! 레이더(§Y$weap_buff_awacs_1$§!)를 달고 다시 비행합니다."
 ukraine_modernize_planes_restore_an_71_kvant_slow_tt: "약 §Y6개월§! 뒤 §YAn-71§!이 소련제 §Y크반트§! 레이더(§Y$weap_buff_awacs_1$§!)를 달고 다시 비행합니다. §Y공중조기경보통제기§! 사업은 도중에 완료됩니다."
 ukraine_modernize_planes_restore_an_71_phalcon_fast_tt: "이스라엘제 §Y팔콘§! 레이더는 약 §Y3개월§! 뒤에 준비되지만, §YAn-71U§!이 이 레이더(§Y$weap_buff_awacs_2$§!)를 달고 비행하려면 이스라엘이 수출을 승인해야 합니다(임무 참고)."
 ukraine_modernize_planes_restore_an_71_phalcon_slow_tt: "이스라엘제 §Y팔콘§! 레이더는 약 §Y5개월§! 뒤에 준비되지만, §YAn-71U§!이 이 레이더(§Y$weap_buff_awacs_2$§!)를 달고 비행하려면 이스라엘이 수출을 승인해야 합니다(임무 참고). §Y공중조기경보통제기§! 사업은 도중에 완료됩니다."
 ukraine_modernize_planes_restore_an_71_phalcon_mission_tt: "§Y6개월§! 안에 §Y이스라엘§!의 우리에 대한 호감도가 §Y40§!에 이르고 이스라엘에 대한 우리의 영향력이 §Y5%§!를 넘어서야 합니다. 그렇지 못하면 이스라엘이 거래를 취소하고 대금의 §R일부§!만 돌려줍니다."
 ukraine_modernize_planes_restore_an_71_kvant_after_israel_tt: "§G이스라엘이 대금의 일부를 돌려줍니다§!. 약 §Y3~5개월§! 뒤 §YAn-71§!이 소련제 §Y크반트§! 레이더(§Y$weap_buff_awacs_1$§!)를 달고 비행합니다. 우리에 대한 §R러시아§!의 영향력이 §R소폭 커집니다§!."
 ukraine_modernize_planes_restore_an_71.6.name: "이스라엘, 레이더 거래 취소"
 ukraine_modernize_planes_restore_an_71.6.desc: "이스라엘과의 관계가 §Y팔콘§! 레이더 수출을 승인하는 데 필요한 수준에 이르지 못했습니다. 예루살렘은 계약을 동결하고 대금 일부를 돌려주기로 했습니다. 안토노프는 소련제 레이더로 돌아갈 수밖에 없으며, 모스크바는 이 상황을 흥미롭게 지켜보고 있습니다."
 ukraine_modernize_planes_restore_an_71.6.a: "베가-M과 함께 §Y크반트§!로 복귀"
 UKR_an_71_phalcon_ready_flag: "§YAn-71§!용 이스라엘제 §Y팔콘§! 레이더가 준비되었습니다."
 ukraine_rada.3.a: "다수파의 표결을 인정한다"
 ukraine_rada.3.b: "우리 사람들을 다시 의사당으로 들여보낸다"
 ukraine_rada.4.a: "의사당은 다시 우리 손에 들어왔다"
 ukraine_rada.5.a: "다수파 그룹들끼리 나눠 갖는다"
 ukraine_rada.5.b: "좌파에게 남겨 둔다"
 ukraine_rada.6.a: "표를 다시 센다"
 ukraine_rada.7.a: "라다를 압박해 결과를 헌법에 명문화한다"
 ukraine_rada.7.b: "위임만 받고 헌법은 건드리지 않는다"
 ukraine_rada.8.a: "이제 씨족들이 정당을 만들고 있다"
 ukraine_rada.9.a: "다수파에 끌어들인다"
 ukraine_rada.9.b: "법안마다 따로 표결하게 한다"
 ukraine_rada.10.a: "동부에도 정당이 생겼다"
 ukraine_rada.13.a: "열정 없는 유능함"
 ukraine_rada.14.a: "야당에 이름이 생겼다"
 ukraine_gongadze.1.a: "그래야지. 감사관을 보내라."
 ukraine_gongadze.1.b: "쓰게 놔둬라. 인터넷은 아무도 안 읽는다."
 ukraine_gongadze.2.a: "개인적인 싸움으로 번지게 두자."
 ukraine_gongadze.2.b: "서류 문제로만 다룬다. 감사, 재판, 인허가."
 ukraine_gongadze.3.a: "신설 부패 방지 위원회 자리를 제안한다."
 ukraine_gongadze.3.b: "실로비키가 그를 영영 겁먹고 물러나게 하자."
 ukraine_gongadze.4.a: "사건은 종결되었다."
 ukraine_gongadze.5.a: "그렇다면 그들은 다른 말을 듣게 될 것이다."
 ukraine_yushchenko.1.a: "그를 불러 정반대로 말하게 한다"
 ukraine_yushchenko.1.b: "침묵한다. 그의 유권자도 우리 유권자다."
 ukraine_yushchenko.2.a: "그의 서명을 받는다"
 ukraine_yushchenko.2.b: "우리 서명만으로 내보낸다"
 ukraine_yushchenko.3.a: "값을 불러 보라고 하자"
 ukraine_yushchenko.3.b: "총리는 팔 물건이 아니라고 전한다"
 ukraine_yushchenko.4.a: "해임한다. 라다가 공식적으로 처리하게 한다."
 ukraine_yushchenko.4.b: "두되, 그에게 남은 모든 인사권을 박탈한다"
 UKR_tarashcha_shadow_idea: "타라샤 숲의 그림자"
 UKR_tarashcha_shadow_idea_desc: "키이우 외곽 숲에서 발견된 머리 없는 시신, 국가가 이의를 제기하는 신원 확인, 검찰청의 누구도 맡으려 하지 않는 사건. 이제 대통령실의 모든 결정이 이 사건을 통해 읽힙니다."
 UKR_cassette_scandal_idea: "카세트 스캔들"
 UKR_cassette_scandal_idea_desc: "대통령 집무실 소파 밑에서 녹음된 수백 시간 분량. 외국 채권자들은 연락을 받지 않고, 각 부처는 나중에 소리 내어 읽힐 수 있는 문서에는 서명하지 않으며, 이제 나라의 모든 관리가 자신이 도청당하고 있다고 가정합니다."
 ukraine_gongadze.6.a: "시신은 신원 미상이다. 그렇게 말하고, 계속 그렇게 말한다."
 ukraine_gongadze.6.b: "신원 확인을 인정하고 살인 사건 수사를 시작한다."
