 SAU_transitional_council_desc: "一个由官员、法学家和显贵组成的临时机构，在君主制覆灭后掌权。它的统治仅限于阿拉伯共和国能够自主选择发展道路之前。"
 SAU_tt_extend_turkey: "[TUR.GetFlag]§H土耳其将被要求将管道延伸至欧洲。他们必须接受。§!"
 SAU_tt_not_houthi: "§R胡塞武装绝不能控制也门南部。§!"
 SAU_tt_pipeline_oil_dependence: "§R加剧对石油的依赖。§!王国进一步承诺出口石油。"
 SAU_tt_sabotage_chance: "有§Y50%的几率§!切断输油管道。如果成功，沙特阿拉伯将失去这条输油管道及其所有利益。"
 SAU_tt_saddam_talks: "§H巴格达将会收到我们的提议。预计萨达姆不会同意。§!"
 SAU_tt_via_jordan: "§H路线首先途经约旦。安曼方面必须同意后，才能前往大马士革。§!"
 SAU_typhoon_approved: "§G欧洲战斗机出售案已获批准§!"
