 UKR_develop_an_lbl: "제안된 §YAn-LBL§!\n경전투기 개발"
 UKR_develop_an_lbl_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_lbl_development_for_tooltip\n\n\n\n\n\n\n\n\n§W안토노프 §YLBL§!(경전투기)은 §L안토노프 설계국§!이 설계한 제안 단계의 경항공기로, §YYak-130§!에 가까운 기체가 될 것으로 예상됩니다. 훈련, 정찰 등 다양한 임무에 사용하도록 의도되었습니다. 이 항공기는 첨단 항공 전자 장비, 경량 기체, 효율적인 엔진을 갖추어 뛰어난 성능과 연료 효율을 제공할 것으로 기대됩니다.\n\n§G특히 중요한 군사 사업:§! 완료되면 §Y최고라다§!가 더 높은 군사 예산을 승인할 의향이 커질 것입니다.§!"
 UKR_develop_an_bfv: "제안된 §YAn-BFV§!\n다목적 전투기 개발"
 ukraine_develop_2s22.1.name: "§Y2S22 '보흐다나'§! 자주포 개발"
 ukraine_develop_2s22.1.desc: "이야기하는 지금도 기술은 계속 발전하고 있으나, 우리의 무기는 그대로입니다.\n우리 군을 위한 새로운 자주포를 자체적으로 개발해야 합니다."
 ukraine_develop_2s22.1.a: "기본 수준의 자금을 지원한다"
 ukraine_develop_2s22.1.b: "대규모 자금을 지원한다"
 ukraine_develop_2s22.2.name: "KrZVV, 신형 자주포 설계안을 완성하다"
 ukraine_develop_2s22.2.desc: "확인 결과, KrZVV가 우리 군을 위한 신형 자주포 설계안을 완성했음이 분명해졌습니다.\n그러나 우리가 지원한 자금이 부족했던 탓에 새로운 포신을 제작하지 못하고 낡은 소련제 포신을 그대로 사용할 수밖에 없었습니다."
 ukraine_develop_2s22.2.a: "좋다, 생산을 시작하자!"
 ukraine_develop_2s22.3.name: "KrZVV, 신형 자주포 설계안을 완성하다"
 ukraine_develop_2s22.3.desc: "확인 결과, KrZVV가 우리 군을 위한 신형 자주포 설계안을 완성했음이 분명해졌습니다.\n게다가 우리가 추가로 지원한 자금 덕분에 자주포의 모든 부분을 처음부터 새롭게, 그리고 튼튼하게 개발해 냈습니다!"
 ukraine_develop_2s22.3.a: "훌륭하다, 생산을 시작하자!"
 UKR_develop_kba27: "§YKBA-27§! 견인포 개발"
 UKR_develop_kba27_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_kba27_for_tooltip\n\n\n\n\n\n\n\n\n§WKBA-27은 소련의 2A61 파트-B에서 파생된 우크라이나의 152mm 곡사포입니다. 한 시험형은 이 포를 PTS-2 수륙양용 수송차에 탑재하여 중포의 화력과 높은 기동성, 수륙양용 능력을 결합하였습니다. 추가 개발을 통해 이 시제품을 실용적인 자주포 체계로 탈바꿈시킬 수 있습니다.§!"
 UKR_develop_nota_flag: "완료된 결정: §YObject 477A1 '노타' 주력 전차 개발§!"
 UKR_develop_nota: "§YObject 477A1 '노타'§! 주력 전차 개발"
 UKR_modernize_nota: "§YObject 477A1 '노타'§! 현대화"
 ukraine_armed_forces_tragedy_event.1.name: "브로바리 미사일 참사"
 ukraine_armed_forces_tragedy_event.1.desc: "2000년 4월 20일의 브로바리 참사는 키이우주 브로바리시에서 발생한 사고로, 군사 훈련 중 혼차리우카 훈련장에서 발사된 '토치카-U' 체계의 지대지 훈련용 미사일이 예정된 진로를 벗어나 90km를 비행한 뒤 9층짜리 주거용 건물에 명중한 사건입니다.\n미사일에는 폭발성 탄두가 없었으나, 미사일 타격으로 세 명이 사망하고 다섯 명이 부상을 입었습니다.\n\n참사 이후 나흘 동안, 4월 23일까지 올렉산드르 쿠즈무크가 이끄는 우크라이나 국방부는 주거용 건물을 타격한 것이 자신들의 미사일이었음을 인정하기를 거부했습니다."
 ukraine_armed_forces_tragedy_event.1.a: "우리 미사일이 아니었다"
 ukraine_armed_forces_tragedy_event.2.name: "시베리아 항공 1812편 격추"
 ukraine_armed_forces_tragedy_event.2.desc: "시베리아 항공 1812편은 2001년 10월 4일 이스라엘 텔아비브에서 러시아 노보시비르스크로 향하던 중 흑해 상공에서 우크라이나 공군에 의해 격추된 것으로 추정되는 민간 항공편이었습니다.\n소련제 투폴레프 Tu-154 기종의 이 항공기에는 승객 66명과 승무원 12명이 탑승해 있었습니다. 승객 대부분은 러시아에 있는 친척을 방문하던 이스라엘인이었습니다. 생존자는 없었습니다.\n추락의 원인은 크림반도 케르치시 인근 오푸크곶에 있는 러시아 흑해 함대 제31 연구센터의 러시아 통제 훈련장에서 우크라이나-러시아 합동 방공 훈련 중 발사된 미사일이었습니다."
 ukraine_armed_forces_tragedy_event.2.a: "조사가 필요하다"
 ukraine_armed_forces_tragedy_event.3.name: "스크닐리우 에어쇼 참사"
 ukraine_armed_forces_tragedy_event.3.desc: "스크닐리우 에어쇼 참사는 2002년 7월 27일, 우크라이나 리비우 인근 스크닐리우 비행장에서 열린 곡예비행 시범 중 볼로디미르 토포나르('우크라이나 매' 곡예비행팀 소속)가 조종하고 유리 예고로프가 부조종을 맡은 우크라이나 공군 수호이 Su-27UB 항공기가 관객석으로 추락한 사고입니다.\n이 사고로 77명이 사망하고 543명이 부상을 입었습니다. 역사상 가장 많은 인명 피해를 낸 에어쇼 사고입니다.\n참사 이후 조종사들은 자신들이 받은 비행 지도가 실제 배치와 달랐다고 주장했습니다."
 ukraine_armed_forces_tragedy_event.3.a: "믿을 수 없는 비극"
 UKR_Brovary_Missile_Tragedy_Flag: "브로바리 미사일 참사가 발생함"
 UKR_Tu154_Air_Tragedy_Flag: "시베리아 항공 1812편이 격추됨"
 ukraine_warehouse_explosions.1.name: "열악한 탄약고 상태"
 ukraine_warehouse_explosions.1.desc: "최근 단행된 군 개혁으로 우크라이나 전역 탄약고의 보관 및 경비 상태에 심각한 결함이 있음이 드러났습니다. 노후한 시설과 허술한 감독은 사고의 중대한 위험 요인입니다. 정부는 이 문제를 어떻게 처리할지 결정해야 합니다."
 ukraine_warehouse_explosions.1.a: "모든 탄약고를 전면 정비한다"
 ukraine_warehouse_explosions.1.b: "주요 탄약고만 부분 정비한다"
 ukraine_warehouse_explosions.1.c: "문제를 무시한다"
 ukraine_warehouse_explosions.2.name: "아르테미우스크 탄약고 폭발"
 ukraine_warehouse_explosions.2.desc: "최근 도네츠크주 아르테미우스크 지구의 아르테미우스크시에서 예상치 못한 대규모 사고가 발생했습니다. 약 3천 톤의 포병 탄약이 보관되어 있던 제52기계화여단의 창고에서 화재가 시작되었습니다. 안타깝게도 초기 화재에 이어 대규모 폭발이 일어났습니다. 현장을 정리하고 앞으로 이러한 사고를 방지하기 위한 조치를 취해야 합니다."
 ukraine_warehouse_explosions.2.a: "탄약고를 전면 재건한다"
 ukraine_warehouse_explosions.2.b: "조사 위원회를 파견한다"
 ukraine_warehouse_explosions.2.c: "문제를 무시한다"
 ukraine_warehouse_explosions.3.name: "노보보흐다니우카 탄약고 폭발"
 ukraine_warehouse_explosions.3.desc: "최근 자포리자주 멜리토폴 지구 노보보흐다니우카 마을 인근에서 예상치 못한 대규모 사고가 발생했습니다. 2004년 5월 6일, 그라드, 스메르치, 우라간 체계용 탄약 약 9만 발이 폭발했습니다. 포탄 파편은 폭발 중심지에서 40km까지 날아갔습니다. 이후 1천5백 명이 넘는 주민이 대피해야 했습니다. 다섯 명이 사망하고 80명 이상이 여러 부상으로 입원했으며, 20가구 이상이 집을 잃었습니다. 폭발로 가스 송유관 4km가 손상되었습니다. 피해액은 37억 5,200만 흐리우냐에 달했습니다."
 ukraine_warehouse_explosions.3.a: "탄약고를 전면 재건한다"
 ukraine_warehouse_explosions.3.b: "조사 위원회를 파견한다"
 ukraine_warehouse_explosions.3.c: "문제를 무시한다"
 ukraine_warehouse_explosions.4.name: "츠비토하 탄약고 폭발"
 ukraine_warehouse_explosions.4.desc: "최근 흐멜니츠키주 슬라부타 지구 츠비토하 마을 인근에서 예상치 못한 대규모 사고가 발생했습니다. 흐멜니츠키주 제47 병기창에서 화재와 함께 탄약 폭발이 일어났습니다. 저장 시설에는 소구경 포탄(23mm 및 30mm)과 총류 부착식 유탄발사기용 유탄 등 표준 화차 52.9량 분량의 탄약이 있었으며, 화재로 인해 폭발했습니다. 파편은 반경 100~150m까지 날아갔습니다."
 ukraine_warehouse_explosions.4.a: "탄약고를 전면 재건한다"
 ukraine_warehouse_explosions.4.b: "조사 위원회를 파견한다"
 ukraine_warehouse_explosions.4.c: "문제를 무시한다"
 ukraine_warehouse_explosions.5.name: "노보보흐다니우카 탄약고 2차 폭발"
 ukraine_warehouse_explosions.5.desc: "자포리자주 멜리토폴 지구 노보보흐다니우카 마을 인근에서 두 번째로 폭발 사고가 발생했습니다. 2005년 7월 23일 오후 5시 20분, 제257 탄약 저장 기지의 창고에서 불이 났습니다. 오후 8시 54분에 포탄 폭발이 멈췄습니다. 다섯 명이 부상을 입었습니다. 폭발의 원인은 높은 기온으로 인해 연막탄이 자연 발화한 것으로 알려졌습니다."
 ukraine_warehouse_explosions.5.a: "탄약고를 전면 재건한다"
 ukraine_warehouse_explosions.5.b: "조사 위원회를 파견한다"
 ukraine_warehouse_explosions.5.c: "문제를 무시한다"
 ukraine_warehouse_explosions.6.name: "노보보흐다니우카 탄약고 3차 폭발"
 ukraine_warehouse_explosions.6.desc: "자포리자주 멜리토폴 지구 노보보흐다니우카 마을 인근에서 세 번째로 폭발 사고가 발생했습니다. 2006년 8월 19일 오후 2시 15분, 또 한 번 심각한 폭발이 일어났습니다. 창고 약 3헥타르가 불탔습니다. 지역 주민 1,500명이 대피했고 4,000명이 대피소에 수용되었습니다. 428명의 인원과 96대의 장비가 투입되었습니다. 4명이 부상을 입었습니다."
 ukraine_warehouse_explosions.6.a: "탄약고를 전면 재건한다"
 ukraine_warehouse_explosions.6.b: "조사 위원회를 파견한다"
 ukraine_warehouse_explosions.6.c: "문제를 무시한다"
 ukraine_warehouse_explosions.7.name: "로조바 탄약고 폭발"
 ukraine_warehouse_explosions.7.desc: "최근 하르키우주 로조바 지구의 로조바시에서 예상치 못한 대규모 사고가 발생했습니다. 2008년 8월 27일 16시 20분, 육군 남부작전사령부 제61 병기창의 창고에서 불이 났습니다. 면적이 약 500헥타르에 달하는 제0829 군부대 병기창에는 포탄 9만 5천 톤이 보관되어 있었습니다. 폭발은 약 두 시간 뒤부터 시작되었습니다. 창고 반경 3km 이내의 모든 주민이 대피했습니다."
 ukraine_warehouse_explosions.7.a: "탄약고를 전면 재건한다"
 ukraine_warehouse_explosions.7.b: "조사 위원회를 파견한다"
 ukraine_warehouse_explosions.7.c: "문제를 무시한다"
