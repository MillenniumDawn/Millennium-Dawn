 CZE_SLO_more_strength_and_opinion: "§YO controlador do estado fica §Rmenos convencido a aceitar se tiver um exército mais forte§!, mas também fica §Gmais convencido se tiver melhores relações§! com a Tchecoslováquia.§! "
