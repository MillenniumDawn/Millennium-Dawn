 BOS_mechanization_of_the_army_desc: "Une armée peut devenir plus avancée de plusieurs manières, notamment grâce à l’acquisition d’armes et d’équipements nouveaux et plus sophistiqués, au développement de nouvelles tactiques et stratégies et à l’amélioration des programmes de formation et d’éducation de son personnel. Le processus de progrès peut être motivé par divers facteurs, tels que la nécessité de répondre à de nouvelles menaces ou de nouveaux défis, de suivre les progrès des autres armées ou de moderniser et d’améliorer l’efficacité de l’armée. Pour qu’une armée devienne plus avancée, elle devra peut-être investir dans la recherche et le développement, ainsi que dans l’acquisition et la maintenance de nouvelles technologies. Elle devra peut-être également réorganiser et restructurer ses forces et adapter sa doctrine et ses capacités pour répondre aux exigences changeantes du champ de bataille moderne."
 BOS_boots_on_the_ground_desc: "La Bosnie peut centrer sa défense sur une infanterie entraînée, des positions préparées et une large réserve plutôt que sur des véhicules coûteux."
 BOS_national_high_command_desc: "Les Forces armées de Bosnie-Herzégovine (AFBiH) sont l'armée de Bosnie-Herzégovine et comprennent l'armée de la Fédération de Bosnie-Herzégovine et l'armée de la Republika Srpska. L'AFBiH est dirigée par le chef des forces armées, qui est responsable du commandement et du contrôle global de l'armée. Le chef des forces armées est nommé par le président de la Bosnie-Herzégovine et rend compte au ministre de la Défense. L'AFBiH est organisée en diverses branches et unités, chacune dotée de sa propre structure de direction. Cela comprend l'état-major, responsable de la planification et de la direction des opérations militaires, ainsi que les différents commandements des forces terrestres, aériennes et navales. Les chefs militaires de l'AFBiH ont la responsabilité de veiller à ce que l'armée soit prête à défendre la Bosnie-Herzégovine et à s'acquitter de ses obligations internationales. Ils jouent également un rôle dans l’élaboration de l’orientation et des priorités de l’armée, ainsi que dans la gestion de ses ressources et de son personnel."
 BOS_aerial_dominance_desc: "Un programme d'aviation de combat priorisera la préparation des chasseurs, la qualité des pilotes et le contrôle de l'espace aérien bosniaque."
 BOS_transportation_methods_desc: "Des véhicules utilitaires modernes et des procédures logistiques amélioreront la vitesse de déploiement et réduiront les défaillances d'approvisionnement."
 BOS_rifle_advancements_desc: "Des fusils de service modernes, des gilets pare-balles et des méthodes de production amélioreront l'efficacité de l'infanterie et l'approvisionnement intérieur."
 BOS_wave_tactics_desc: "Une doctrine lourde en réserves utilisera des formations d'infanterie concentrées pour tenir le terrain et encaisser une pression soutenue."
 BOS_civilian_training_desc: "Une instruction de réserve élargie préparera les civils à la mobilisation sans maintenir une force permanente inabordable."
 BOS_restoration_of_old_aircraft_desc: "Réparer les hélicoptères hérités et reconstruire une base aérienne rétablira une capacité limitée d'aviation de transport."
 BOS_aircraft_acquiring_desc: "Les chasseurs russes offrent une voie rapide vers l'aviation de combat, bien que les coûts d'acquisition et de basage pèseront sur le Trésor."
 BOS_personal_carriers_desc: "Les véhicules de combat d'infanterie achèveront la transition du transport motorisé vers des unités d'armes combinées protégées."
 BOS_resupply_equipment_desc: "Des radios modernes, des armes d'appui et du matériel logistique rendront les unités de première ligne plus autonomes."
 BOS_artillery_refurbishment_desc: "Remettre en état les pièces héritées et standardiser les munitions rétablira un appui-feu fiable."
 BOS_small_arms_purchase_desc: "Des fusils étrangers peuvent combler les pénuries immédiates de stocks pendant que la production intérieure se réorganise."
 BOS_mobilization_requirements_desc: "Des obligations de réserve claires et des procédures d'appel permettront au gouvernement d'élargir l'armée en cas d'urgence."
 BOS_combine_the_armies_desc: "Une intégration complète dissoudra les commandements parallèles des entités et créera une chaîne de commandement nationale unique."
 BOS_great_level_of_cooperation_desc: "Les formations des entités peuvent conserver des traditions distinctes tout en adoptant une planification, une formation et des acquisitions conjointes."
 BOS_the_land_fleet_desc: "Des normes de véhicules communes consolideront transports, transporteurs et véhicules d'appui en une force mécanisée maintenable."
 BOS_main_battle_line_desc: "Des armes antichars et des réserves mobiles permettront à la Bosnie de contrer des formations plus lourdes sans financer une grande flotte de chars."
 BOS_streamline_production_desc: "Des contrats et des méthodes d'assemblage standardisés abaisseront le coût de l'approvisionnement en équipement d'infanterie."
 BOS_provide_equipment_updates_desc: "Un cycle de modernisation programmé maintiendra fusils et armes d'appui compatibles dans toutes les forces armées."
 BOS_general_staff_reforms_desc: "Une planification professionnelle, des procédures d'état-major communes et un équipement de protection moderne remplaceront l'improvisation de guerre."
 BOS_aerial_cooperation_desc: "Les commandements de défense aérienne et d'aviation partageront les données de surveillance, les plans de basage et le contrôle opérationnel."
 BOS_officer_training_desc: "Un cursus national d'officiers bâtira un corps professionnel loyal aux institutions de l'État plutôt qu'aux commandements des entités."
 BOS_military_drills_desc: "Des exercices conjoints testeront la nouvelle structure de commandement et exposeront les défaillances de coordination restantes."
 BOS_prepping_an_offensive_desc: "Les officiers d'état-major identifieront un axe d'avance décisif et stockeront des ravitaillements avant la prochaine phase de la guerre civile."
 BOS_bosnian_elections_desc: "La crise financière de 2008 a eu un impact significatif sur la Bosnie-Herzégovine, comme sur de nombreux pays du monde. La crise, déclenchée par l'effondrement du marché immobilier aux États-Unis et la faillite ultérieure de plusieurs grandes institutions financières, a conduit à un ralentissement économique mondial et à une crise du crédit. En Bosnie-Herzégovine, la crise financière a entraîné un ralentissement de la croissance économique et une baisse des exportations, ainsi qu'une augmentation du chômage et une diminution des investissements étrangers. Cela a également entraîné une baisse de la valeur de la monnaie du pays, le mark bosniaque, et une augmentation de l'inflation. Pour faire face aux impacts de la crise financière, le gouvernement de Bosnie-Herzégovine a mis en œuvre un certain nombre de mesures, notamment l'adoption de mesures d'austérité, la mise en œuvre de réformes structurelles et l'obtention d'une aide financière des organisations internationales. Malgré ces efforts, l'économie du pays ne s'est pas encore complètement remise des effets de la crise."
 BOS_economic_revision_desc: "La politique fiscale doit être révisée pour financer la reprise sans étouffer l'investissement ni la demande des ménages."
 BOS_post_war_effort_desc: "Après la fin de la guerre de Bosnie en 1995, la Bosnie-Herzégovine a été confrontée à un certain nombre de défis pour se reconstruire et se remettre du conflit. Ces efforts comprenaient la reconstruction des infrastructures, le retour des réfugiés et des personnes déplacées dans leurs foyers, la mise en place d'un gouvernement et d'une économie fonctionnels, ainsi que la promotion de la réconciliation et de la coopération entre les différents groupes ethniques du pays."
 BOS_rally_the_troops_desc: "Les commandants locaux rappelleront les réservistes et reconstruiront les unités épuisées par les premiers combats."
 BOS_commence_the_offensives_desc: "Des attaques coordonnées exploiteront les préparatifs de nos commandements de campagne et chasseront l'ennemi des positions clés."
 BOS_dig_in_desc: "Des positions fortifiées et des lignes de repli préparées préserveront nos forces si l'offensive s'enlise."
 BOS_detain_serbian_generals_desc: "Poursuivre les officiers accusés de crimes de guerre renforcera la confiance internationale et l'État de droit, mais approfondira la résistance en Republika Srpska."
 BOS_release_serbian_generals_desc: "Libérer les officiers serbes détenus appuiera la réconciliation avec la Republika Srpska et la Serbie, malgré les critiques des groupes de victimes."
 BOS_grant_more_rights_to_serbian_peoples_desc: "De plus fortes garanties de représentation serbe peuvent réduire la pression séparatiste et orienter l'investissement vers des communautés négligées."
 BOS_oppress_serbian_back_supports_desc: "Des constructeurs automobiles étrangers peuvent fournir des emplois et du capital productif, mais leur influence façonnera la politique industrielle bosniaque."
 BOS_the_state_desc: "Des institutions nationales capables sont nécessaires pour coordonner le relèvement tout en respectant la division constitutionnelle de l'autorité en Bosnie."
 BOS_grant_herzegovinians_more_rights_desc: "Un financement policier plus élevé améliorera la sécurité locale et l'application de la loi, bien que la dépense supplémentaire pèsera sur le budget national."
 BOS_limit_herzegovinians_desc: "Réduire les dépenses de police préservera les fonds publics, mais une application plus faible peut laisser le crime organisé s'étendre."
 BOS_mobilize_the_nation_desc: "La mobilisation d'urgence élargira le vivier de remplaçants entraînés disponibles pour les forces armées."
 BOS_request_military_supplies_desc: "La Turquie et l'Albanie peuvent fournir des armes d'infanterie, mais chaque gouvernement décidera s'il peut épargner l'équipement."
 BOS_bosnians_will_lead_the_military_desc: "Un commandement national civil achèvera le programme de relance pro-intégration et mettra fin aux mesures financières d'urgence."
 BOS_anti_serbian_propaganda_desc: "Nationaliser les participations industrielles étrangères étendra le contrôle de l'État, mais nuira à la confiance des investisseurs et aux relations avec l'Allemagne."
 BOS_improve_road_quality_in_sarajevo_desc: "Réparer le réseau routier de Sarajevo reconnectera les quartiers, réduira les retards de fret et appuiera de nouveaux investissements dans le secteur des services."
 BOS_improvement_of_the_health_care_system_desc: "Un standard national de santé élargira l'accès et remplacera le système fragmenté de l'après-guerre."
 BOS_secure_regional_support_for_government_desc: "Un gouvernement stable exige la coopération des dirigeants municipaux et des entités, pas seulement une majorité parlementaire à Sarajevo."
 BOS_crackdown_of_anti_war_propaganda_desc: "La censure de guerre et la contre-propagande soutiendront la détermination publique au prix du débat politique ouvert."
 BOS_formation_of_a_junta_desc: "Un conseil militaire peut imposer l'unité à l'effort de guerre, mais les institutions civiles perdront le contrôle de l'État."
 BOS_removal_of_the_dayton_accords_desc: "Réformer le système de Dayton transférera davantage de responsabilités aux institutions nationales tout en préservant les protections de l'accord de paix."
 BOS_post_war_clean_up_desc: "Déblayer ruines, munitions non explosées et sites abandonnés préparera les régions endommagées à la reconstruction."
 BOS_improve_service_industry_desc: "Des bureaux modernes, des services publics fiables et des impôts d'entreprise plus bas aideront Sarajevo à développer une économie de services compétitive."
 BOS_improvement_of_the_education_system_desc: "Des normes éducatives communes et de meilleures écoles amélioreront les compétences tout en limitant la corruption dans l'administration publique."
 BOS_banja_luka_mine_desc: "L'exploitation minière joue un rôle important dans l'économie de la Bosnie-Herzégovine depuis des siècles. Le pays a une riche histoire minière et abrite un certain nombre de minéraux, notamment du charbon, du minerai de fer, du cuivre, du zinc, du plomb, de la bauxite et d'autres. La Bosnie-Herzégovine compte un certain nombre d'exploitations minières à grande échelle, notamment des mines de charbon dans la région de Tuzla et des mines de métaux dans le canton de Zenica-Doboj et dans l'entité de la Republika Srpska. L'industrie minière a contribué de manière significative au développement économique du pays et a fourni des emplois à de nombreuses personnes. Cependant, l’industrie minière de Bosnie-Herzégovine est également confrontée à un certain nombre de défis, notamment des préoccupations environnementales et une baisse de la demande mondiale pour certains minéraux. Ces dernières années, le gouvernement a mis en œuvre un certain nombre de mesures pour soutenir le secteur minier et relever ces défis, notamment en investissant dans de nouvelles technologies et infrastructures et en favorisant le développement de nouveaux projets miniers."
 BOS_farming_sector_desc: "L'agriculture constitue depuis longtemps un secteur important de l'économie de Bosnie-Herzégovine et continue de jouer un rôle important dans le développement du pays. L'agriculture en Bosnie-Herzégovine se caractérise par un mélange de petites exploitations familiales et d'exploitations plus grandes et plus commerciales. Les principales cultures cultivées en Bosnie-Herzégovine comprennent les céréales, les légumes, les fruits et le tabac. L'élevage, notamment la production de volailles, de porcs et de produits laitiers, constitue également une partie importante du secteur agricole. Le secteur agricole de Bosnie-Herzégovine a été confronté à un certain nombre de défis ces dernières années, notamment une baisse de la demande mondiale pour certains produits agricoles, un manque d'investissement dans les infrastructures et la technologie et des préoccupations environnementales. Afin de relever ces défis, le gouvernement a mis en œuvre un certain nombre de mesures pour soutenir le secteur, notamment en investissant dans la recherche et le développement, en favorisant l'utilisation de technologies modernes et en soutenant le développement de produits à valeur ajoutée."
 BOS_end_nato_desc: "Le gouvernement islamiste défiera la position régionale de l'OTAN et se préparera à une confrontation qu'il ne pourra peut-être pas maîtriser."
 BOS_national_appeasement_desc: "La Bosnie-Herzégovine est un pays diversifié avec une histoire complexe et un certain nombre de groupes ethniques différents, notamment les Bosniaques (musulmans bosniaques), les Croates et les Serbes. Dans le passé, les conflits entre ces groupes ont conduit à la violence et à l'instabilité dans le pays. En conséquence, l’apaisement national a souvent été considéré comme une stratégie importante pour promouvoir l’harmonie et prévenir de nouveaux conflits. Cela peut impliquer un certain nombre de mesures, telles que la création d'accords de partage du pouvoir, l'établissement de droits ou de privilèges spéciaux pour certains groupes, ou la mise en œuvre de politiques conçues pour répondre aux préoccupations et aux besoins des différentes communautés ethniques. En fin de compte, l’objectif de l’apaisement national est de trouver des moyens de résoudre les différends et de promouvoir la coopération entre les différents groupes au sein d’un pays afin de maintenir la paix et la stabilité."
 BOS_role_the_dice_desc: "Les dirigeants de la Srpska peuvent forcer une consolidation rapide, acceptant une instabilité grave et un risque renouvelé de conflit civil."
 BOS_popular_support_desc: "Un mandat négocié auprès des trois peuples constitutifs donnera au gouvernement dirigé par la Srpska une voie plus sûre vers la réforme."
 BOS_develop_national_sentiment_desc: "Une campagne patriotique soutenue renforcera le régime de guerre et maintiendra la mobilisation nationale intacte."
 BOS_land_mine_removal_desc: "Un programme national de déminage cartographiera les terres contaminées, formera des équipes de dépollution et réduira le coût humain persistant de la guerre."
 BOS_rebuild_infrastructure_in_sarajevo_desc: "La reconstruction à Sarajevo renforcera le réseau électrique de la capitale et rouvrira son terminal ferroviaire, signalant que la reprise nationale reste une priorité."
 BOS_rebuild_infrastructure_in_srpska_desc: "Reconstruire le réseau à Banja Luka et le terminal ferroviaire à Bijeljina reliera les communautés de la Republika Srpska aux marchés et institutions nationaux."
 BOS_rebuild_infrastructure_in_herzegovina_desc: "Un réseau renforcé et un terminal ferroviaire fonctionnel en Herzégovine amélioreront l'accès à Mostar et relanceront le commerce dans le sud."
 BOS_build_a_war_memorials_desc: "Des mémoriaux reconnaîtront les pertes civiles et militaires tout en offrant aux communautés des lieux de souvenir public."
 BOS_make_way_for_more_industry_desc: "Les mines et l'agriculture peuvent soutenir une base industrielle rurale plus large si les deux secteurs reçoivent la préparation requise."
 BOS_military_industrialization_desc: "Une usine d'armement budgétée à Sarajevo appuiera le réarmement, pourvu que l'économie puisse la doter en personnel et la financer."
 BOS_autonomy_advancements_desc: "Libérer l'Herzégovine et la Republika Srpska comme sujets autonomes formalisera l'autogouvernement des entités au sein de la Bosnie."
 BOS_cooperative_effort_desc: "Un programme coopératif de la Srpska préservera les institutions fédérales et poursuivra l'alignement oriental par le consentement plutôt que par la contrainte."
 BOS_removal_of_lands_in_herzegovina_desc: "Les équipes de dépollution rouvriront les terres contaminées d'Herzégovine à l'habitat, à l'agriculture et au transport."
 BOS_removal_of_lands_in_central_bosnia_desc: "Retirer les mines de Bosnie centrale protégera ses communautés denses et restaurera des terres productives."
 BOS_removal_of_lands_in_central_srpska_desc: "Le déminage au centre de la Republika Srpska rendra les districts ruraux endommagés sûrs pour la reprise."
 BOS_rebuild_factories_in_sarajevo_desc: "Une usine civile reconstruite et des infrastructures d'appui rétabliront l'emploi industriel à Sarajevo."
 BOS_the_repair_of_srpska_and_herzegovina_desc: "Un investissement industriel et d'infrastructure équilibré en Srpska et en Herzégovine démontrera que la reprise s'étend au-delà de Sarajevo."
 BOS_national_unrest_desc: "La baisse de stabilité et l'hostilité communautaire ont ouvert une voie aux organisations ouvrières pour défier les deux blocs nationalistes."
 BOS_state_opposition_desc: "La Republika Srpska est l'une des deux entités qui composent la Bosnie-Herzégovine, l'autre étant la Fédération de Bosnie-Herzégovine. La Republika Srpska est majoritairement peuplée de Serbes et possède son propre gouvernement et ses propres institutions. L'Alliance des sociaux-démocrates indépendants (SNSD) est le principal parti politique de la Republika Srpska et a occupé plusieurs postes clés au sein du gouvernement de l'entité. Au Parlement national de Bosnie-Herzégovine, le Parti démocratique serbe (SDS) constitue une force politique majeure et s'est souvent opposé aux partis au pouvoir. Le SDS est traditionnellement un parti conservateur et défend les intérêts de la communauté serbe de Bosnie-Herzégovine."
 BOS_eastern_trade_bloc_desc: "Des accords commerciaux mutuels avec la Russie et la Serbie convertiront l'alignement politique en accès commercial durable."
 BOS_commence_centralization_desc: "Les autorités de la Srpska transféreront les pouvoirs des entités au gouvernement central et supprimeront les centres constitutionnels concurrents."
 BOS_national_agenda_desc: "Un programme législatif partagé combinera stabilité sociale, réforme budgétaire et reconnaissance des trois peuples constitutifs."
 BOS_final_land_mine_removal_efforts_desc: "Coordonner les programmes régionaux nettoiera les champs de mines cartographiés restants et clôturera la campagne de déminage d'après-guerre de la Bosnie."
 BOS_workers_front_desc: "Un Front des travailleurs organisera les syndicats mécontents en une force politique nationale avec son propre programme économique."
 BOS_national_unity_desc: "Les entités reviendront à une administration nationale directe après une transition négociée, restaurant un État fédéral pluraliste."
 BOS_cooperative_alliance_desc: "La Russie décidera si le partenariat oriental de la Bosnie justifie l'admission à l'OTSC."
 BOS_introduction_of_mandatory_conscription_desc: "Le service obligatoire élargira la réserve au prix d'une obligation plus lourde pour les ménages et les employeurs."
 BOS_decrease_poverty_rate_desc: "Des dépenses sociales ciblées réduiront la pauvreté et stabiliseront les communautés négligées pendant la reprise d'après-guerre."
 BOS_the_teachings_of_orthodox_desc: "La coopération avec le clergé orthodoxe renforcera le pacte social oriental tout en écartant les institutions islamiques du gouvernement."
 BOS_concessions_to_the_work_unions_new_desc: "Un pacte syndical contraignant échangera dépenses sociales et droits au travail contre la stabilité politique."
 BOS_puppet_economics_new_desc: "Les conseils ouvriers recevront un rôle formel dans la gestion tandis qu'une fiscalité d'entreprise plus élevée financera le nouveau système."
 BOS_religious_identity_desc: "L'État islamiste revendiquera le leadership des communautés bosniaques au-delà de ses frontières et préparera une politique régionale coercitive."
 BOS_tax_reforms_desc: "Des taux d'impôt des ménages et des entreprises plus bas élargiront le soutien politique tout en réduisant les recettes immédiates de l'État."
 BOS_state_atheism_new_desc: "Le gouvernement ouvrier retirera le privilège religieux des institutions de l'État, gagnant une liberté administrative au détriment du clergé."
 BOS_mechanical_production_new_desc: "La production mécanisée et la formation technique élèveront la productivité et achèveront la transition industrielle de l'économie ouvrière."
 BOS_land_doctrine_desc: "La Bosnie a besoin d'une doctrine défensive adaptée au terrain montagneux, à une main-d'œuvre limitée et à un budget d'acquisition modeste."
 BOS_gain_croat_popular_support: "Bénéficier du soutien populaire croate"
