 cartel_event.3.b: "加入热土"
 cartel_event.3.c: "加入塔毛利帕斯集团"
 cartel_event.3.e: "墨西哥永远万岁！"
 cartel_event.10.t: "毒品战争结束"
 cartel_event.10.d: "经过数月在主要城市街道、丛林、平原和沙漠的浴血奋战，我们已成功拔除所有主要贩毒集团据点与贩运路线，所有重要毒枭头目均已落网或击毙。毒枭们的末日将至，墨西哥很快将重获自由的呼吸。"
 cartel_event.10.a: "噩梦即将结束。"
 cartel_event.12.t: "贩毒集团反击"
 cartel_event.12.d: "卡特尔拒绝坐视我们破坏他们的行动并攻击他们的成员。作为回应，他们对我们当地部队发动了一系列爆炸和报复性打击。"
 cartel_event.12.a: "该死的毒枭！"
 cartel_event.15.t: "丢失的步枪和弹药"
 cartel_event.15.d: "作为遏制装备流入黑市措施的一部分，在我们国家军事基地的最近一次审计中，发现了轻武器和弹药的大量短缺。尽管仍有可能只是数字错误，但更可能是这些装备已被销赃或正在销赃中。幸运的是，这个问题仅限于一个军事基地，我们可以全力应对。"
 cartel_event.15.a: "减少基地的活动"
 cartel_event.15.b: "我们已经筋疲力尽了"
 cartel_event.16.t: "丢失的通用车辆"
 cartel_event.16.d: "作为遏制装备流入黑市措施的一部分，在我们国家军事基地的最近一次审计中，发现了卡车及备件的大量短缺。尽管仍有可能只是数字错误，但更可能是这些装备已被销赃或正在销赃中。幸运的是，这个问题仅限于一个军事基地，我们可以全力应对。"
 cartel_event.16.a: "减少基地的活动"
 cartel_event.16.b: "我们已经筋疲力尽了"
 cartel_event.17.t: "丢失的直升机"
 cartel_event.17.d: "作为遏制装备流入黑市措施的一部分，在我们国家军事基地的最近一次审计中，发现了直升机及备件的大量短缺。尽管仍有可能只是数字错误，但更可能是这些装备已被销赃或正在销赃中。幸运的是，这个问题仅限于一个军事基地，我们可以全力应对。"
 cartel_event.17.a: "减少基地的活动"
 cartel_event.17.b: "我们已经筋疲力尽了"
 cartel_event.18.t: "港口中缴获坦克"
 cartel_event.18.d: "在我们的一处主要港口，港务部门查获了一批藏匿运输的苏制T-55坦克。这些坦克虽型号老旧，但武器齐备且可正常作战，同时被查扣的还有配套零部件与弹药。尽管无法追溯其来源地与目的地，但相关文件资料的缺失足以表明这批货物属于非法运输。万幸的是，它们的最终去向已完全由我们全权掌控。"
 cartel_event.18.a: "把它们卖掉"
 cartel_event.18.b: "把它们投入使用"
 cartel_event.18.c: "把它送给我们的朋友。"
 cartel_event.19.t: "抛尸场登上全国新闻"
 cartel_event.19.d: "某主要城市的一个大型抛尸场被媒体曝光，迅速占据各大媒体平台头条。我们正在丧失引导舆论走向的主动权。若无所作为，公众情绪的恐慌将持续蔓延，更易被制造这起事件的幕后黑手所操纵。"
 cartel_event.19.a: "夺回叙事控制权。"
 cartel_event.19.b: "我们已经筋疲力尽了"
 cartel_event.20.t: "外国名人被杀案"
 cartel_event.20.d: "过去一周，来自[?var:foreign_celeb_country.GetName]的一位名人被当地一名男子谋杀了。对凶手粗略的调查显示他与我国最大的犯罪组织之一有联系。在面对外部压力下，我们已经开始承担起以某种方式杀死他的责任。一些建议已经取得进展，但最不令人尴尬的建议是支持一位名人的慈善组织之一。"
 cartel_event.20.a: "支持慈善事业。"
 cartel_event.20.b: "他们本不该与罪犯有关联的。"
 cartel_event.21.t: "贩毒集团进口奇珍异兽"
 cartel_event.21.d: "豢养异国动物之风近来盛行于我国各个贩毒集团高层之间。这些通常通过非法渠道获取的动物，既被用作身份标识与权柄象征，亦时常与某些血腥暴行存在关联。若能收紧动物入境管控，人为抬高交易价格，便可借市场手段揭露此举的荒诞本质。猛虎固然令人畏惧，但为其豪掷千万金则无疑只是赤裸的财富炫耀。"
 cartel_event.21.a: "取缔此类交易。"
 cartel_event.21.b: "无视这类交易。"
 cartel_event.22.t: "当地帮派冲突"
 cartel_event.22.d: "帮派冲突在我国一座主要城市街头爆发，阻碍当地经济、酿成人员伤亡，还导致居民不敢轻易离家。尽管分析人士预测暴力活动持续时间有限，但公众难以接受坐视无辜杀戮持续蔓延的消极态度。若出动警力介入虽可提前化解危机，却将伴随巨额行政成本并可能引发新的伤亡。"
 cartel_event.22.a: "派警察过去。"
 cartel_event.22.b: "我们已经筋疲力尽了"
 cartel_event.23.t: "美国要求引渡"
 cartel_event.23.d: "美利坚合众国要求引渡我方近期才成功缉拿归案的一名毒枭头目。若接受此要求，既有助于维系与美方关系以换取未来打击其他毒枭的协助，也符合我方利益。然而，美方对我国司法体系的介入势必削弱我们自身的独立自主能力。"
 cartel_event.23.a: "他们会得到他的。"
 cartel_event.23.b: "我们可以对付自己的罪犯。"
 cartel_event.24.t: "线人电影交易"
 cartel_event.24.d: "我方一名线人 - 曾是我国最大犯罪组织的成员 - 近日被电影制片人接触。该制片人通过口耳相传得知其经历，有意将其生平故事搬上银幕。线人对此表现出浓厚兴趣，但此举可能危及其生命安全。我们可选择支持该合作项目并允许电影制作，亦可在近期内彻底扼杀其成片可能。"
 cartel_event.24.a: "批准这部电影。"
 cartel_event.24.b: "这太危险了。"
 cartel_event.25.t: "线人发布回忆录"
 cartel_event.25.d: "近期线人与电影制片人的接触似乎激发了他公开个人经历的意愿。过去数周内，他已协同多位作家及政府官员完成一套匿名回忆录的创作。所有参与者均反馈该回忆录内容极具震撼力，真实揭露了贩毒集团内部残酷的生活图景。"
 cartel_event.25.a: "我想知道它会不会成为畅销书。"
 cartel_event.26.t: "线人被谋杀"
 cartel_event.26.d: "我方线人在前往监督重要场景拍摄期间，于片场被发现身亡。根据尸体状况判断，此次谋杀系贩毒集团成员实施的报复行为。电影制作团队也理所应当的担忧起自身生命安全，拍摄工作也已中止。"
 cartel_event.26.a: "真遗憾。"
 cartel_event.27.t: "电影鼓励犯罪活动"
 cartel_event.27.d: "由于信息传递出现偏差，这部关于线人生平的新电影被拍成了牛仔片风格，而非原本设定的硬核犯罪悲剧。许多年轻人竟想效仿电影中脸谱化的角色形象，导致我国多个犯罪组织的招募人数激增。"
 cartel_event.27.a: "不幸。"
 cartel_event.28.t: "电影震慑犯罪活动"
 cartel_event.28.d: "由线人协助制作的影片上映首周即获评论界盛赞。更重要的是，影片对贩毒集团暴行的真实刻画激起了更强烈的社会反弹。如今我国年轻人似乎更倾向于长大后对抗贩毒集团，而非加入其中。"
 cartel_event.28.a: "非常好。"
 cartel_event.29.t: "贩毒集团跨境行动"
 cartel_event.29.d: "邻国某贩毒集团实施大规模越境行动时，两国边境管控部门均未采取拦截措施，反而相互推诿责任。此事已在我国政界内部引起运动，要求邻国加强边境管控 - 毕竟这起事件不可能全是我方的过错。"
 cartel_event.29.a: "要求邻国加强边境管制。"
 cartel_event.29.b: "提出要求可能损害我们的关系。"
 cartel_event.30.t: "邻国要求控制边境"
 cartel_event.30.d: "最近，卡特尔从我国过境进入[FROM.GetName]，之后，我们的邻国要求我们加强边界安全。目前，这已在我国外交部门内引发了许多争论。"
 cartel_event.30.a: "好吧，我们会加强我方边防。"
 cartel_event.30.b: "为什么他们不增强自己的边境安全？"
 cartel_event.31.t: "邻国接受要求"
 cartel_event.31.d: "我们的邻国，[FROM.GetName]，已经同意了我们加强边界控制的要求，毫无疑问，我们的选民会对这次胜利感到高兴。"
 cartel_event.31.a: "非常好。"
 cartel_event.32.t: "邻国无视我方要求"
 cartel_event.32.d: "我们的邻国，[FROM.GetName]，无视了我们紧紧控制边界的要求。而我们也已经因为此次政治失败而被新闻媒体痛斥。"
 cartel_event.32.a: "不幸。"
 cartel_event.33.t: "与寡头有关的可疑转账"
 cartel_event.33.d: "近期调查中，我们发现国内某寡头基金存在可疑资金流动 - 虽未构成违法，但足以通过政治运作将其牵连进当前案件。不过这种越权行为势必会激怒国内外寡头。"
 cartel_event.33.a: "没收他们的资产。"
 cartel_event.33.b: "别管他们。"
 cartel_event.34.t: "发现卡特尔坦克"
 cartel_event.34.d: "在最近一次针对贩毒集团目标的不成功突袭中，发现贩毒集团动用了一辆坦克。这辆坦克似乎是一辆经过重度改装的苏联T-34，甚至能够发射其主炮。"
 cartel_event.34.a: "我们得做点什么。"
 cartel_event.35.t: "卡特尔坦克被摧毁"
 cartel_event.35.d: "在最近一次针对卡特尔目标成功的突袭中，我们的特工成功定位并摧毁了在先前一次失败行动中出现的T-34坦克。这次胜利，尤其是在没有反坦克武器的情况下取得的，已被新闻媒体广泛报道。"
 cartel_event.35.a: "感谢上帝和我们的勇士们。"
 cartel_event.36.t: "卡特尔使用坦克袭击"
 cartel_event.36.d: "在我们最近一次突袭之后，贩毒集团对我们的一处警察局发动了报复性打击。他们用先前发现的T-34撞破围栏，并对建筑内肆意开火，将大楼严重损毁。这导致了大量伤亡，而该事件已登上了全国新闻。"
 cartel_event.36.a: "我们得做点什么。"
 cartel_event.37.t: "运输空壳公司"
 cartel_event.37.d: "在评估我们最近没收的一家公司资产时，注意到有一家公司注册了大量前军用6x6卡车。经过短暂搜索，这些车辆在该公司拥有的一座仓库中被找到。这些车辆如今普遍用于农场和各种其他行业，但在我们军队的一些遗留岗位中仍在使用。"
 cartel_event.37.a: "把它们交由军队使用。"
 cartel_event.37.b: "把卡车转售给民用公司。"
 cartel_event.38.t: "犯罪头目意外被捕"
 cartel_event.38.d: "最近一系列针对据信只是低级贩毒集团成员的逮捕行动，意外抓获了一名重要犯罪头目。尽管他起初隐藏了身份，但一名熟悉此人的警官认出了他。他现在要求释放，并提出支付巨额保释金。"
 cartel_event.38.a: "啊，是的，一切都在计划之中。"
 cartel_event.38.b: "非常抱歉，先生。"
 cartel_event.39.t: "当局偶然发现毒品种植园"
 cartel_event.39.d: "在一次例行乡村巡逻中，当地警察部队偶然发现了一个他们认为是毒品种植园的地方。按照程序，他们已经将这一消息上报，现在正等待增援或指示下一步该怎么做。"
 cartel_event.39.a: "烧毁田地，摧毁设备。"
 cartel_event.39.b: "收集任何证据或设备。"
 cartel_event.39.c: "别管这个种植园了。"
 cartel_event.40.t: "匿名举报"
 cartel_event.40.d: "我们收到了一条匿名线报，称有一处防守薄弱的贩毒集团前哨。如果我们迅速行动，就能攻占该阵地。然而，这可能是恶作剧，也可能是贩毒集团调虎离山并伏击我们的诡计。"
 cartel_event.40.a: "根据线报采取行动，任何机会都可能得到成果！"
 cartel_event.40.b: "不要理那个消息，很可能是恶作剧。"
 cartel_event.41.t: "当地企业与卡特尔合作"
 cartel_event.41.d: "我们边远城镇的几家企业被揭露与贩毒集团有勾结，有时甚至公然为之。任由这种情况持续，无异于告知民众，我们要么不愿治理，要么无力治理。但对贩毒集团而言，这却会成为我们默许他们权威的信号。"
 cartel_event.41.a: "就他们的行为发出斥责。"
 cartel_event.41.b: "对事情视而不见。"
 cartel_event.42.t: "工业集团庇护违禁品"
 cartel_event.42.d: "我们最近通过线报得知，许多我国大型企业一直允许贩毒集团使用他们的仓库储存违禁品。虽然这可能是公然腐败的迹象，但也可能是一种敲诈勒索。无论哪种情况，我们都必须做出某种回应。否则，线人很可能将之透露给新闻媒体。"
 cartel_event.42.a: "没收仓库，整顿企业集团！"
 cartel_event.42.b: "没收违禁品，对企业稍加惩戒。"
 cartel_event.42.c: "那是他们的仓库，但现在所有人都知道了。"
 cartel_event.43.t: "腐化官员"
 cartel_event.43.d: "我们最近收到一条匿名线报，据此对本地一位政客的竞选投资展开了简短调查。调查显示，大部分竞选资金来自与卡特尔活动有关联的个人和公司。调查中的许多迹象还指向一张由任命官员、投资者和政治盟友交织而成的复杂网络。"
 cartel_event.43.a: "把尽可能多的人解职，我们不能容忍这种情况发生。"
 cartel_event.43.b: "来自私人公民的竞选投资不关我们的事。"
 cartel_event.44.t: "港务局查获违禁品"
 cartel_event.44.d: "在一次例行搜索中，我们的一个主要港口的港口当局发现了一个装满违禁品的货运集装箱。根据协议，他们暂时扣押了这艘船，同时将如何处理它的决定交给我们。"
 cartel_event.44.a: "扣押参与毒品交易的船只。"
 cartel_event.44.b: "只扣押集装箱，这是这里唯一违法的东西。"
 cartel_event.44.c: "顺其自然，生意就是生意。"
 cartel_event.45.t: "银行家视而不见"
 cartel_event.45.d: "我们收到匿名举报，称几位高级银行家对卡特尔活动视而不见，有时甚至参与其中。如果我们不对此信息采取行动，举报者很可能会将其泄露给新闻界。"
 cartel_event.45.a: "逮捕涉事银行家并展开调查。"
 cartel_event.45.b: "这已非我们所能掌控……"
 cartel_event.46.t: "诱人行贿"
 cartel_event.46.d: "我们政界的一些成员最近收到了一个诱人的提议。只要我们像对待其他利益集团一样对待贩毒集团，给予他们自由运作的空间，他们就会为几场重要的即将到来的选举提供资金。我们中那些在意识形态上更具可塑性的成员正期待我们的指导。"
 cartel_event.46.a: "当然了！我们很高兴能和这么重要的利益集团合作。"
 cartel_event.46.b: "岂有此理！他们根本代表不了人民的利益。"
 cartel_event.47.t: "与魔鬼的交易"
 cartel_event.47.d: "我们政界的几位高层人士最近受邀与我国最大贩毒集团之一的首脑会面。会面期间，贩毒集团首脑明确表达了他们的意图。他们不必成为我们的敌人，事实上，我们可以成为政治盟友。他们已为我们的合作提供了大量利益，并承诺随着伙伴关系的持续，还会有更多好处。"
 cartel_event.47.a: "税收是国家运作能力的重要组成部分。"
 cartel_event.47.b: "我们不能让那些恶魔踏进门槛一步。"
 cartel_event.48.t: "规范毒品交易"
 cartel_event.48.d: "几个较大的贩毒集团最近提出一项建议，希望合作减少非贩毒集团犯罪，因为这些犯罪已开始侵蚀他们的利润空间。作为回报，他们愿意配合让其附属企业申报更准确的利润。并且让他们的交易更加人道，随便他们怎么说吧。"
 cartel_event.48.a: "谈判达成严格监管的国家-卡特尔合作。"
 cartel_event.48.b: "谈判达成宽松监管的国家-卡特尔合作。"
 cartel_event.48.c: "我们不会和罪犯谈判。"
 cartel_event.49.t: "青年丧失信念"
 cartel_event.49.d: "我们人口中最易受影响的一个群体就是青年，而我国与贩毒集团的状况已开始让他们转而反对我们的政治体制。虽然调查显示许多人计划一旦有能力就离开，但那些打算留下来的人似乎决心在下次选举中投票反对我们。我们尝试开展一项外联计划，试图将其中最有干劲的人引导到与我们一同修复他们的祖国上来。"
 cartel_event.49.a: "通过该计划伸出我们的援手。"
 cartel_event.49.b: "让他们沉浸在自己的自怜中吧，我们不需要他们。"
 cartel_event.53.t: "卡特尔报复性打击"
 cartel_event.53.d: "在我们最近一次突袭之后，贩毒集团对我们的一个警察局进行了报复性打击。他们成功突破了外围防线，将我们的警员赶出了城镇，所到之处一片狼藉。这起事件已导致多人伤亡，并登上了全国新闻。"
 cartel_event.53.a: "不幸。"
 cartel_event.54.t: "卡特尔报复性打击失败"
 cartel_event.54.d: "在最近一次突袭行动之后，贩毒集团对我们的一处警察局发动了报复性袭击。我们的警员英勇坚守，仅承受了少量伤亡。数小时后，他们等来了增援，并成功驱散了贩毒集团。这一事件经全国新闻报道后，已成为反对贩毒集团的宣传典范。"
 cartel_event.54.a: "非常好。"
 cartel_event.55.t: "贩毒集团击落直升机"
 cartel_event.55.d: "在最近的一次突袭中，我们的一架警用直升机被贩毒集团击落。事后审查显示，一颗流弹击中了飞行员的颈部，导致副驾驶未能及时重新控制飞机，最终发生灾难性坠毁。失去如此重要的装备，更不用说机组人员，实在令人惋惜。"
 cartel_event.55.a: "不幸。"
 cartel_event.56.t: "贩毒集团处决幸存者"
 cartel_event.56.d: "一名好心人发现了一名来自我国卡特尔猖獗地区的男子，并紧急将他送往医院，如今他躺在病床上，可能即将走到生命的尽头。然而，我们有机会帮助他。他需要被转移到设施更好的医院，而我们附近的一架军用直升机可以完成这项任务。"
 cartel_event.56.a: "他将成为我们新的“枪决幸存者”！"
 cartel_event.56.b: "很遗憾，我们的医生未能救活他……"
 cartel_event.50.t1: "赌场调查成功"
 cartel_event.50.d1: "经过数周的策划与监控，我国警察部队突袭了国内一家赌场，缴获了数百万美元的赃款，收集了重要物证，并逮捕了卡特尔洗钱计划的关键人物。利用收集到的证据，我们冻结了与赌场及其经营者有关的所有合法资产。通过这次打击，我们摧毁了其重要基础设施，并削弱了他们积累可用资金的能力。"
 cartel_event.50.t2: "银行调查成功"
 cartel_event.50.d2: "经过数周的等待和对资金转移的监控，今天我们冻结了与贩毒集团洗钱活动有关的六家公司和个人的资产。逮捕令已经发出，并针对这些公司与一些低级政客和官僚之间的可疑转账启动了多项较小规模的调查。虽然贩毒集团不可避免地会恢复过来，但一次性损失这么多资金将对其基础造成沉重打击。"
 cartel_event.50.t3: "空壳公司调查成功"
 cartel_event.50.d3: "经过数周调查，我们已查封了数家可疑公司，并在此过程中没收了其资产。虽然收缴到的资金甚少，但我们查获了大量房产、民用车辆及其他物品。这不仅应是对其洗钱活动的沉重打击，也应是对其维持所有运作能力的沉重打击。"
 cartel_event.50.t4: "赌场调查失败"
 cartel_event.50.d4: "尽管我们竭尽全力，分析人员仍未能将贩毒集团与我们所调查的赌场联系起来。更糟的是，人们开始质疑调查资金去向，导致反对派成功对我们的候选人发起政治攻击。雪上加霜的是，贩毒集团继续肆无忌惮地运营。"
 cartel_event.50.t5: "银行调查失败"
 cartel_event.50.d5: "尽管我们的特工花了数周时间伏在电脑前监控银行转账，我们仍未找到任何明确的机会来打击贩毒集团。更糟糕的是，人们开始质疑调查所用资金的去向，导致反对派成功对我们的候选人发起政治攻击。雪上加霜的是，贩毒集团继续肆无忌惮地运作。"
 cartel_event.50.t6: "空壳公司调查失败"
 cartel_event.50.d6: "尽管我们投入了大量时间和金钱进行调查，但所揭露的不过是离婚安全基金和责任保护计划。更糟糕的是，在此过程中我们得罪了足够多的人，以至于我们的调查被全国新闻报道曝光。这种尴尬极有可能损害我们未来的选举前景。更令人雪上加霜的是，贩毒集团继续肆无忌惮地运作。"
 cartel_event.50.a: "调查结束"
 cartel_event.51.t1: "成功打击毒品车队"
 cartel_event.51.d1: "在最近一次针对已知毒品路线的打击行动中，我们成功查获了数百公斤毒品，逮捕了几名贩毒集团的低层成员，并缴获了数辆民用车辆，伤亡甚微。这应足以在短期内阻止交易，但任何规模足够大的贩毒集团都能轻易消化这些损失。"
 cartel_event.51.t2: "成功突袭卡特尔藏身处"
 cartel_event.51.d2: "在最近对一家已知的卡特尔据点的袭击中，我们设法在扣押或销毁几件可用的军事装备和简易武器的同时，杀死或逮捕了几十名卡特尔成员，这一拳头可能波及其他组织试图利用这一暂时性的弱点。"
 cartel_event.51.t3: "成功突袭分销中心"
 cartel_event.51.d3: "在最近对一个已知的分销中心的一次袭击中，我们设法查获了价值数十万美元的赃款和毒品。我们还开始围捕与该地点有关的许多毒贩，严重阻碍了他们将毒品推向市场并从中获利的能力。尽管我们取得了成功，但我们应该警惕报复性攻击的可能性。"
 cartel_event.51.t4: "成功突袭提炼中心"
 cartel_event.51.d4: "在最近对一处已知的提炼中心发动的突袭中，我们成功摧毁了价值数十万美元的设备和毒品。我们还逮捕了许多参与提炼的人员，这将使他们在未来生产更多毒品时处于不利地位。尽管我们取得了成功，但我们仍应警惕可能发生的报复性袭击。"
 cartel_event.51.t5: "打击毒品车队失败"
 cartel_event.51.d5: "在最近一次针对已知毒品路线的未遂打击行动中，我方部队遭遇重创，被迫撤退，数名伤亡人员被遗留在后。有关此事件的信息已泄露至公众，削弱了民众对我们政府的信任。我们应警惕可能发生的报复性袭击。"
 cartel_event.51.t6: "贩毒隐蔽突袭失败"
 cartel_event.51.d6: "在最近一次对已知卡特尔据点的突袭行动中，我方部队遭遇压倒性劣势，被迫撤退，数名伤员被遗留在战场上。有关此次事件的消息已经泄露给公众，削弱了民众对政府的信任。我们应当警惕可能发生的报复性袭击。"
 cartel_event.51.t7: "分销中心突袭失败"
 cartel_event.51.d7: "在最近一次对已知卡特尔分销中心的打击行动中，我方部队遭遇重创，被迫撤退，数名伤员被遗弃。有关此次事件的信息已经泄露到公众之中，削弱了民众对我们政府的信心。到此时，与该地点相关的所有人早已四散逃离。我们应当警惕可能发生的报复性袭击。"
 cartel_event.51.t8: "提炼中心突袭失败"
 cartel_event.51.d8: "在最近一次对已知卡特尔提炼中心的打击行动中，我方部队遭遇重创，被迫撤退，数名伤员被遗弃。有关此次事件的信息已经泄露至公众，削弱了民众对我们政府的信心。我们应当警惕可能发生的报复性袭击。"
 cartel_event.51.a: "突袭结束"
 cartel_event.52.t: "贩毒集团的末日"
 cartel_event.52.d: "历经数十年的冲突与无数牺牲，我们已将贩毒集团的任何残余从我国清除。然而，我们仍未摆脱其影响。本地区其他国家仍在遭受这些怪物的统治，而如今我们恰好拥有丰富的猎魔经验。"
 cartel_event.52.a: "这是[ROOT.GetName]的新时代。"
 cartel_event.100.t: "[FROM.GetName]清除国内贩毒集团"
 cartel_event.100.d: "来自[FROM.GetName]的消息传来，他们成功打击了贩毒集团。稳定与和平已重回该地区。"
 cartel_event.100.a: "一个新市场？"
 cartel_event.100.b: "稳定重回[FROM.GetName]"
