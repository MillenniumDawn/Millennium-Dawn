---
name: Tools Validation

"on":
  pull_request:
    paths:
      - "tools/**"
      - "common/on_actions/**"
      - "common/scripted_effects/**"
      - ".claude/docs/typo-watchlist.md"
      - "resources/documentation/modifiers_documentation.md"
      - ".pre-commit-config.yaml"
      - "pyproject.toml"
      - "package.json"
      - "bun.lock"
      - ".jscpd.json"
      - ".github/workflows/coding-pipeline.yml"
      - ".github/workflows/nightly-pr-validation.yml"
      - ".github/workflows/pr-cache-cleanup.yml"
      - ".github/workflows/tools-validation.yml"
      - ".github/workflows/validator-cache.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ${{ matrix.check.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `name` is the status-check context branch protection matches on —
        # keep these strings stable when reshaping the job.
        check:
          - name: report_lib + validator unit tests
            id: unit
            runner: ubuntu-latest
          - name: tools unit tests (macOS)
            id: unit-macos
            runner: macos-latest
          - name: tools unit tests (Windows)
            id: unit-windows
            runner: windows-latest
          - name: staged validator integration
            id: staged
            runner: ubuntu-latest
          - name: ruff lint (tools)
            id: lint
            runner: ubuntu-latest
          - name: Code duplication (jscpd)
            id: duplication
            runner: ubuntu-latest
    steps:
      # The unit-test checkout must include every config and fixture that the
      # tests read; config_drift_test enforces this list.
      - name: Checkout (unit tests)
        if: startsWith(matrix.check.id, 'unit')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            .pre-commit-config.yaml
            .claude/docs/typo-watchlist.md
            common
            resources
            .github/workflows/coding-pipeline.yml
            .github/workflows/nightly-pr-validation.yml
            .github/workflows/pr-cache-cleanup.yml
            .github/workflows/tools-validation.yml
            .github/workflows/validator-cache.yml
          sparse-checkout-cone-mode: false

      - name: Checkout (staged integration)
        if: matrix.check.id == 'staged'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
            events
            common
            localisation
            history
          sparse-checkout-cone-mode: false

      - name: Checkout (lint)
        if: matrix.check.id == 'lint'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            pyproject.toml
          sparse-checkout-cone-mode: false

      - name: Checkout (duplication)
        if: matrix.check.id == 'duplication'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            tools
            package.json
            bun.lock
            .jscpd.json

      - name: Set up Python
        if: matrix.check.id != 'duplication'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Install dependencies (unit tests)
        if: startsWith(matrix.check.id, 'unit')
        run: |
          python -m pip install --upgrade pip
          # analysis pulls scipy/numpy/matplotlib used by the optional
          # tools/balance and tools/analysis scripts and their tests.
          pip install --group dev --group runtime --group analysis

      - name: Install dependencies (staged integration)
        if: matrix.check.id == 'staged'
        id: staged-deps
        run: |
          python -m pip install --upgrade pip
          pip install --group dev --group runtime

      - name: Install dependencies (lint)
        if: matrix.check.id == 'lint'
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Verify pytest collection configuration
        if: startsWith(matrix.check.id, 'unit')
        run: >-
          python -m pytest tools/tests/collection_layout_test.py
          -o addopts= -q

      - name: Run unit tests
        if: matrix.check.id == 'unit'
        run: |
          python -m coverage run --branch -m pytest tools/tests \
            -o addopts= -o 'python_files=*_test.py' -v
          python -m coverage report

      - name: Run cross-platform unit tests
        if: matrix.check.id == 'unit-macos' || matrix.check.id == 'unit-windows'
        run: >-
          python -m pytest tools/tests -o addopts=
          -o "python_files=*_test.py" -v

      - name: Create isolated test worktree
        if: matrix.check.id == 'staged'
        run: |
          git worktree add --detach \
            "${{ runner.temp }}/md-staged-validator-test" HEAD

      - name: Run staged-validator integration
        if: matrix.check.id == 'staged'
        working-directory: ${{ runner.temp }}/md-staged-validator-test
        env:
          MD_RUN_STAGED_INTEGRATION: "1"
        run: |
          python -m pytest \
            tools/tests/staged_validators_test.py \
            tools/tests/staged_validators_real_test.py -q

      - name: Run branch common-mistakes validation
        if: >-
          !cancelled() && matrix.check.id == 'staged' &&
          steps.staged-deps.outcome == 'success'
        run: >-
          python tools/validation/validate_common_mistakes.py
          --strict --no-color --workers 4

      # Run after test failures, but not broken setup or cancellation.
      - name: Run tools validation
        if: >-
          !cancelled() && matrix.check.id == 'staged' &&
          steps.staged-deps.outcome == 'success'
        run: |
          python tools/validate_tools.py --strict --no-color --output \
            tools_validation.log

      - name: Upload tools validation report
        if: >-
          !cancelled() && matrix.check.id == 'staged' &&
          steps.staged-deps.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tools-validation-report
          path: tools_validation.log
          if-no-files-found: error
          retention-days: 7

      - name: Run ruff
        if: matrix.check.id == 'lint'
        run: ruff check tools --output-format=github

      - name: Check formatting (black)
        if: matrix.check.id == 'lint'
        run: black --check tools

      - name: Run pylint
        if: matrix.check.id == 'lint'
        run: pylint tools --output-format=github --reports=no --score=no

      - name: Run mypy
        if: matrix.check.id == 'lint'
        run: mypy

      - name: Setup Bun
        if: matrix.check.id == 'duplication'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install duplication dependencies
        if: matrix.check.id == 'duplication'
        run: bun install --frozen-lockfile

      - name: Run jscpd
        if: matrix.check.id == 'duplication'
        run: bun run jscpd
