 SAU_succession_panel_dormant: "The throne is occupied and the succession is not in contest. Should it reopen, the princes and their factions will be set out here.[ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_named: "The Crown Prince has been named: §H[ROOT.GetSAUCrownPrinceName]§!. The contest is over and the arrangement will hold exactly as long as the King does.\n\n§YThe King's health:§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race1: "法赫德国王驾崩，阿卜杜拉国王继位，但他年事已高，王位继承问题悬而未决。三位王子争夺继承权：萨勒曼·本·阿卜杜勒阿齐兹，苏代里王朝的代表人物；穆罕默德·本·纳伊夫，安全部门负责人；以及穆塔伊卜·本·阿卜杜拉，国民警卫队司令。\n\n支持一位王子，团结家族和国家支持他，同时削弱他的竞争对手。每个派系也为自己谋划，因此影响力的平衡每个月都会发生变化。阿卜杜拉国王去世后，拥有最大影响力的王子即位。\n\n§Y萨勒曼·本·阿卜杜勒阿齐兹：§! [?SAU_salman_share|0]%\n§Y穆罕默德·本·纳伊夫：§! [?SAU_mbn_share|0]%\n§Y穆塔伊卜·本·阿卜杜拉：§! [?SAU_mutaib_share|0]%\n\n§Y如果阿卜杜拉今天去世，其继承人将是：§! §H[ROOT.GetSAUCrownFrontrunner]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
 SAU_succession_panel_race2: "萨勒曼国王在位，争夺王位的只剩下两人。穆罕默德·本·纳伊夫掌管内政部、反恐事务，并深得华盛顿的信任。穆罕默德·本·萨勒曼则掌控经济、国防大权，以及他父亲的信任——在这个家族里，父亲的信任历来至关重要。\n\n支持其中一人，并以此凝聚全国力量，同时削弱另一人。国王指定继承人时 - 或者国王去世时未指定继承人 - 谁拥有的股份更多，谁就继承王位。\n\n§Y穆罕默德·本·萨勒曼：§! [?SAU_heir_mbs_share|0]%\n§Y穆罕默德·本·纳伊夫：§! [?SAU_heir_mbn_share|0]%\n\n§Y今日继承人：§! §H[ROOT.GetSAUHeirFrontrunner]§!\n§Y国王的健康：§! §H[ROOT.GetSAUKingHealth]§![ROOT.GetSAUFaisalitePanelLine][ROOT.GetSAUGrievancePanelLine]"
