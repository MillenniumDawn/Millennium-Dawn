 BOS_focus: "波斯尼亚国策树"
 BOS_army_of_the_federation_bosnia_herzegovina: "联邦军队"
 BOS_army_of_the_federation_bosnia_herzegovina_desc: "联邦的波斯尼亚克族和克罗地亚族部队必须加入国家指挥体系，同时保持作战准备状态。"
 BOS_army_of_republic_of_srpska: "塞尔维亚共和国军队"
 BOS_army_of_republic_of_srpska_desc: "如果军事统一要得以延续，塞族共和国的各部队必须在新组建的武装部队中占有一席之地。"
 BOS_air_doctrine: "审视空军学说"
 BOS_air_doctrine_desc: "波斯尼亚的空军规模较小，需要一套适合领土防御、运输和支援地面部队的作战理论。"
 BOS_air_defence_initiative: "防空倡议"
 BOS_air_defence_initiative_desc: "分层防空网络为波斯尼亚提供了一种应对敌机的实用方法，而无需庞大的战斗机机队。"
 BOS_apc_armament: "装甲输送车"
 BOS_apc_armament_desc: "为部队配备装甲输送车可以保护步兵，同时赋予机械化部队更大的火力。"
 BOS_re_enlist_ratko_mladic: "重新招募拉特科·姆拉迪奇"
 BOS_re_enlist_ratko_mladic_desc: "让拉特科·姆拉迪奇重返指挥岗位，虽然能积累经验，但却会损害和解和国际合法性。"
 BOS_detain_ratko_mladic: "拘留拉特科·姆拉迪奇"
 BOS_detain_ratko_mladic_desc: "与国际司法机构合作将使拉特科·姆拉迪奇退出军事事务，但会激怒许多波斯尼亚塞族人。"
 BOS_sam_systems: "部署防空导弹系统"
 BOS_sam_systems_desc: "固定式地对空导弹阵地将保护萨拉热窝和主要军事基础设施免受空袭。"
 BOS_aa_personnel_equipment: "装备防空部队"
 BOS_aa_personnel_equipment_desc: "机动防空部队需要现代化的发射器、传感器和训练来配合地面部队的部署。"
 BOS_helicopter_transportation: "扩大直升机运输"
 BOS_helicopter_transportation_desc: "更大规模的运输直升机机队将支持快速部署、疏散和灾害救援。"
 BOS_radar_detection_advancement: "高级雷达探测"
 BOS_radar_detection_advancement_desc: "一座现代化的雷达站将连接波斯尼亚的防空部队，并能更早地预警来袭飞机。"
 BOS_domestic_production: "国内航空制造业"
 BOS_domestic_production_desc: "建立国内军工厂将有助于保障空军装备的正常运转，并减少对不稳定的外国供应商的依赖。"
 BOS_national_air_force_scheme: "国家空军计划"
 BOS_national_air_force_scheme_desc: "国家空军计划将战斗机、支援和基地投资整合到一个采购计划中。"
 BOS_house_of_representatives: "赋予众议院权力"
 BOS_house_of_representatives_desc: "一个更强大的众议院将赋予国家立法明确的民主授权，同时保障每个选民的宪法代表权。"
 BOS_bosnian_elections_crisis_gate_tt: "仅在国家处于金融危机状态时才有售。"
 BOS_the_federation: "续签联邦契约"
 BOS_the_federation_desc: "重新签署联邦协议将明确各实体的权力并减少外国的影响，但每个组成国的领导层都必须放弃一些行动自由。"
 BOS_elections_political: "改革选举制度"
 BOS_elections_political_desc: "选举改革将为轮值总统制建立持久的授权，并决定哪个国家联盟控制现代化计划。"
 BOS_balkan_backyard: "巴尔干船坞"
 BOS_balkan_backyard_desc: "对南斯拉夫繁荣的共同记忆可以支持自愿的区域项目，但必须说服邻国政府，而不是施压或胁迫。"
 BOS_fight_or_perish: "或战或亡"
 BOS_fight_or_perish_desc: "国家将调动剩余的人力资源，承受内战带来的压力，以求生存下去。"
 BOS_unified_armed_forces: "联合武装部队"
 BOS_unified_armed_forces_desc: "一支所有组成民族都能接受的统一力量将完成合作复苏计划，并结束紧急财政措施。"
 BOS_anti_federation_propaganda: "挑战联邦"
 BOS_anti_federation_propaganda_desc: "挑战联邦权威，引导新兴产业流向塞族共和国，并以牺牲国家稳定为代价加深与塞尔维亚的联系。"
 BOS_alija_izetbegovic_legacy: "阿利亚·伊泽特贝戈维奇的遗产"
 BOS_alija_izetbegovic_legacy_desc: "阿利雅·伊泽特贝戈维奇的遗产将波斯尼亚民族国家的建立与民主制度和战时动员紧密联系起来。他的继任者必须决定，波斯尼亚将遵循这份遗产的哪一部分。"
 BOS_european_relations: "复兴南斯拉夫遗产"
 BOS_european_relations_desc: "在前南斯拉夫地区开展文化和政治宣传，可以将怀旧情绪转化为对区域合作的支持。"
 BOS_revive_relation_with_serbia_yugoslavia: "恢复与[SER.GetName]的关系"
 BOS_revive_relation_with_serbia_yugoslavia_desc: "恢复与塞尔维亚的官方关系将加强塞族领导的政府，但同时也会令波斯尼亚克族和克罗地亚族领导人感到担忧。"
 BOS_eu_loans: "欧盟发展贷款"
 BOS_eu_loans_desc: "欧洲发展信贷将为重建提供即时流动性，同时增加适度的债务义务。"
 BOS_bosnian_revanchism: "波斯尼亚复仇主义"
 BOS_bosnian_revanchism_desc: "复仇主义领导人会将波斯尼亚克人的战时诉求置于代顿妥协之上，从而加强军事利益，但同时也冒着再次引发族群冲突的风险。"
 BOS_western_objectives: "与西方结盟"
 BOS_western_objectives_desc: "西方的坚定立场将开启欧洲-大西洋机构和安全援助，同时关闭东方的选择。"
 BOS_eastern_frontier: "与东方联盟"
 BOS_eastern_frontier_desc: "波斯尼亚将寻求与俄罗斯和塞尔维亚建立伙伴关系，以此作为对抗西方监督的东方力量。"
 BOS_a_new_struggle: "新的斗争"
 BOS_a_new_struggle_desc: "复仇主义组织者将动员民族主义网络，削弱战后政治格局。"
 BOS_us_assistance: "美国援助"
 BOS_us_assistance_desc: "与美国更紧密的商业联系将取代广泛的北约贸易联系，转而建立重点突出的双边伙伴关系。"
 BOS_bosnian_euro_defence_clause: "欧洲防务保障"
 BOS_bosnian_euro_defence_clause_desc: "随着欧盟驻波黑部队将责任移交给各国机构，欧洲主要国家将各自决定是否为波斯尼亚提供保障。"
 BOS_russo_bosnian_alignment: "俄罗斯的伙伴关系"
 BOS_russo_bosnian_alignment_desc: "与俄罗斯建立正式伙伴关系将深化东部贸易和政治支持，同时不会损害波斯尼亚的主权。"
 BOS_serbian_bosnian_arms_treaty: "[SER.GetName]波斯尼亚军备条约"
 BOS_serbian_bosnian_arms_treaty_desc: "塞尔维亚的生产许可证将加速波斯尼亚的重新武装，同时增强贝尔格莱德对波斯尼亚国防政策的影响力。"
 BOS_srpska_supremacy: "塞族共和国至高无上"
 BOS_srpska_supremacy_desc: "种族优越论纲领将瓦解权力分享，并将国家置于塞族机构的控制之下，从而激怒其他组成民族。"
 BOS_national_awakening: "国家觉醒"
 BOS_national_awakening_desc: "复仇主义运动将打破国际监督，并准备发动伊斯兰主义夺取国家政权。"
 BOS_relax_conscription_laws: "放宽征兵法案"
 BOS_relax_conscription_laws_desc: "减少强制兵役将减轻家庭负担，因为实体部队将回归国家文官控制。"
 BOS_cooperation_alignment: "合作结盟"
 BOS_cooperation_alignment_desc: "联合管理和反腐败措施将使各实体与萨拉热窝保持一致，同时又不剥夺它们的自主权。"
 BOS_bosnian_trade_alliance: "西方武装伙伴关系"
 BOS_bosnian_trade_alliance_desc: "美国飞机和步兵武器许可证将奠定西方军备伙伴关系的基础。"
 BOS_beograd_conference: "贝尔格莱德会议"
 BOS_beograd_conference_desc: "在波斯尼亚寻求与东部国家建立更广泛的联盟之前，将在贝尔格莱德召开一次会议，以解决安全和经济争端。"
 BOS_muslim_strong_arm: "伊斯兰先锋队"
 BOS_muslim_strong_arm_desc: "伊斯兰主义先锋队将巩固新政权，并寻求国外同情国政府的支持。"
 BOS_muslim_nationalism: "穆斯林民族主义"
 BOS_muslim_nationalism_desc: "穆斯林民族主义将宗教权威、动员和干涉主义外交政策结合起来。"
 BOS_demote_serbian_irrational_nationalism_new: "遏制塞尔维亚强硬派"
 BOS_demote_serbian_irrational_nationalism_new_desc: "联邦各党派将孤立塞尔维亚强硬派，以短期紧张局势换取更强大的公民国家。"
 BOS_accommodate_serbian_pride_new: "尊重塞尔维亚自治"
 BOS_accommodate_serbian_pride_new_desc: "宪法上的让步将承认塞尔维亚的自治权，并将温和的塞族政党拉入政府。"
 BOS_nato_status: "寻求北约成员资格"
 BOS_nato_status_desc: "波斯尼亚只有在实现国内和解和结束紧急外国监督之后才会寻求加入北约。"
 BOS_union_with_serbia: "与塞尔维亚联合"
 BOS_union_with_serbia_desc: "塞尔维亚将收到一份关于政治联盟的谈判提案，并可以选择接受或拒绝波斯尼亚的并入。"
 BOS_mosque_construction: "清真寺建设计划"
 BOS_mosque_construction_desc: "国家对清真寺和宗教机构的支持将加深政权的伊斯兰认同。"
 BOS_milorad_dodik_new: "边缘化米洛拉德·多迪克"
 BOS_milorad_dodik_new_desc: "清除米洛拉德·多迪克的庇护网络将减少腐败，但会疏远部分塞族共和国选民。"
 BOS_european_affairs: "欧洲事务"
 BOS_european_affairs_desc: "欧洲的贸易和民主制度将成为波斯尼亚和平外交政策的基础。"
 BOS_pathway_towards_eu_membership: "欧盟成员国之路"
 BOS_pathway_towards_eu_membership_desc: "在欧盟成员国决定是否投资期间，波斯尼亚将满足欧洲的基础设施和治理要求。"
 BOS_formation_of_bonds_with_the_eu: "与欧盟建立经济联系"
 BOS_formation_of_bonds_with_the_eu_desc: "扩大与欧盟的商业联系将深化市场准入并降低融资成本。"
 BOS_yugoslav_cultural_revival: "南斯拉夫文化复兴"
 BOS_yugoslav_cultural_revival_desc: "国家资助的电影、音乐和共同的战争纪念碑将把南斯拉夫的几十年描绘成共同的遗产，而不是失败的实验。"
 BOS_common_market_proposal: "共同市场提案"
 BOS_common_market_proposal_desc: "继承国之间提出的免关税贸易方案将重建上世纪90年代中断的商业联系。"
 BOS_federal_charter: "起草联邦宪章"
 BOS_federal_charter_desc: "一份已公布的自愿联邦宪法草案将为统一运动提供一个具体的政治纲领。"
 BOS_reconciliation_commission: "和解委员会"
 BOS_reconciliation_commission_desc: "成立一个战时冤情联合委员会，听取三个组成民族的证词，降低南斯拉夫项目的国内成本。"
 BOS_convene_the_federation: "召集联邦"
 BOS_convene_the_federation_desc: "一旦获得民众支持，萨拉热窝将召集各继承政府就恢复联邦进行谈判。"
 BOS_greater_srpska_state: "大塞族共和国"
 BOS_greater_srpska_state_desc: "中央集权国家将围绕塞族共和国的机构重建，以国内的实体至上取代联盟计划。"
 BOS_purge_the_federation: "清理联邦"
 BOS_purge_the_federation_desc: "波斯尼亚克族和克罗地亚族官员将被撤出各部委、法院和警察指挥部，从而结束对塞族统治的有组织的抵抗。"
 BOS_srpska_command_primacy: "塞族共和国主导指挥权"
 BOS_srpska_command_primacy_desc: "塞族军官将占据武装部队的所有高级职位，使军队与该实体的领导层紧密相连。"
 BOS_dominant_entity: "主导实体"
 BOS_dominant_entity_desc: "塞族共和国现在实际上和法律上都统治着波斯尼亚。其余的联邦机构都是为了服务于这个实体而存在的。"
 BOS_council_democracy: "议会民主"
 BOS_council_democracy_desc: "工作场所委员会将选举代表参加国家机构，使有组织的劳工拥有永久的宪法地位。"
 BOS_nationalize_heavy_industry: "重工业国有化"
 BOS_nationalize_heavy_industry_desc: "国家将取得工厂、矿山和机械厂的控股权，并将其置于委员会的管理之下。"
 BOS_workers_republic: "宣告工人共和国"
 BOS_workers_republic_desc: "劳工运动将以由其委员会管理的社会主义共和国取代后戴顿时代的秩序。"
 BOS_business_sector_management: "发展商业部门"
 BOS_business_sector_management_desc: "在萨拉热窝兴建一座经过成本核算的办公楼，将使服务型经济正规化，前提是有足够的工人来配备人员。"
 BOS_lumber_harvesting: "发展林业部门"
 BOS_lumber_harvesting_desc: "可持续的林业和加工标准将扩大农村出口，而无需依赖其他永久性补贴计划。"
 BOS_land_mines_desc: "战争雷区持续造成平民伤亡，限制人口定居，并使可耕地无法使用。"
 BOS_prep_for_civil_war_map: "准备内战"
 BOS_prep_for_civil_war: "内战准备行动"
 BOS_prep_for_civil_war_desc: "随着波斯尼亚内战再次爆发，塞族共和国正在重新武装。准备行动可以确保武器供应，并在战斗开始前提高政府的战备水平。"
 BOS_bosnian_faction_management: "选民团体管理"
 BOS_internal_factions: "波斯尼亚人民"
 BOS_internal_factions_desc: "《代顿协议》将权力分配给国家机构、波斯尼亚和黑塞哥维那联邦以及塞族共和国。政府政策改变了每个组成群体的态度、稳定性和提供人力资源的意愿。"
 BOS_return_of_entitled_lands: "整合受控领土"
 BOS_return_of_entitled_lands_desc: "当相邻受控状态的顺应度达到80%以上且阻力低于10%时，将其纳入控制状态。"
 BOS_islamic_uprising: "波斯尼亚内战的命运"
 BOS_islamic_uprising_desc: "如果内战持续下去，波斯尼亚圣战者可能会转而反对萨拉热窝和塞族共和国。"
 BOS_declare_islamic_takeover: "波斯尼亚圣战者叛乱"
 BOS_declare_islamic_takeover_desc: "在内战持续进行的同时，外国伊斯兰武装分子正准备脱离政府，建立自己的国家。"
 BOS_core_states_2: "整合[FROM.GetName]"
 BOS_core_states_2_desc: "投入政治和产业资源，整合这个顺从的邻国。"
 BOS_raid_weapon_stockpiles: "突袭武器储备"
 BOS_raid_weapon_stockpiles_desc: "在内战再次爆发之前，从不安全的战时仓库中缴获步兵武器。"
 BOS_civil_war: "酝酿中的风暴"
 BOS_civil_war_desc: "塞族共和国正准备脱离联邦。如果危机得不到解决，这项任务结束后，内战将会爆发。"
 BOS_croats_declare_independence: "克罗地亚族宣布独立"
 BOS_croats_declare_independence_desc: "如果国家稳定度持续低迷，敌对的克罗地亚族群可能会支持黑塞哥维那的分裂。"
 BOS_srpska_declares_independence: "塞族共和国宣布独立"
 BOS_srpska_declares_independence_desc: "如果国家稳定性持续低迷，敌对的塞尔维亚族群可能会支持分裂。"
 BOS_quell_serbians: "镇压塞尔维亚反对派"
 BOS_quell_serbians_desc: "对敌对的塞尔维亚组织采取强制措施，降低其态度和稳定性，同时改变其政党支持。"
 BOS_gain_srpska_popular_support: "获得塞尔维亚人支持"
 BOS_gain_srpska_popular_support_desc: "资助外联和地方项目，以改善塞尔维亚人的态度和稳定性。"
 BOS_fund_bosniak_community_programs: "资助波斯尼亚克社区项目"
 BOS_fund_bosniak_community_programs_desc: "用国库资金支付波斯尼亚克人聚居区的学校、诊所和地方服务费用。这如同政治运动一样重建了波斯尼亚克人的信任，只不过是用资金而非政治权力。"
 BOS_fund_croat_community_programs: "资助克罗地亚族社区项目"
 BOS_fund_croat_community_programs_desc: "用国库资金支付克罗地亚人聚居区的学校、诊所和地方服务费用。这能像政治运动一样重建克罗地亚人的信任，只不过是用资金而非政治权力。"
 BOS_fund_srpska_community_programs: "资助塞尔维亚族社区项目"
 BOS_fund_srpska_community_programs_desc: "用国库资金支付塞族聚居区的学校、诊所和地方服务费用。这能像政治运动一样重建塞族信任，只不过是用资金而非政治权力。"
 BOS_collaboration_with_serbians: "与塞族领袖合作"
 BOS_collaboration_with_serbians_desc: "通过持续的政治合作，将友好的塞尔维亚领导人转变为忠诚的合作伙伴。"
 BOS_quell_bosniaks: "镇压波斯尼亚克反对派"
 BOS_quell_bosniaks_desc: "对敌对的波斯尼亚克组织采取强制措施，接受由此带来的暂时不稳定，以重塑党的支持。"
 BOS_collaboration_with_bosniaks: "与波斯尼亚克领袖合作"
 BOS_collaboration_with_bosniaks_desc: "通过持续的政治合作，将友好的波斯尼亚克领导人转变为忠诚的合作伙伴。"
 BOS_quell_croats: "镇压克罗地亚反对派"
 BOS_quell_croats_desc: "对敌对的克罗地亚组织采取强制措施，接受由此带来的暂时不稳定，以重塑党的支持。"
 BOS_gain_bosniak_popular_support: "获得波斯尼亚人支持"
 BOS_gain_bosniak_popular_support_desc: "资助外联和地方项目，以改善波斯尼亚克人的态度和稳定性。"
 BOS_collaboration_with_croats: "与克罗地亚领袖合作"
 BOS_collaboration_with_croats_desc: "通过持续的政治合作，将友好的克罗地亚领导人转变为忠诚的合作伙伴。"
 BOS_gain_croat_popular_support_desc: "资助外联和地方项目，以改善克罗地亚人的态度和稳定性。"
 BOS_destabilize_the_government_desc: "蓄意瓦解公众信心和战争准备。一旦社会稳定和战争支持度降至如此低点，敌对的塞尔维亚或克罗地亚实体便可趁机宣布独立。"
 BOS_srpska_faction: "塞尔维亚人"
 BOS_bosniak_faction: "波斯尼亚人"
 BOS_croat_faction: "克罗地亚人"
 srpska_attitude_friendly: "§G友善§!"
 BOS_all_factions_at_least_friendly_trigger: "三个选民群体至少达到§G友善§!"
 bosniak_attitude_friendly: "§G友善§!"
 croat_attitude_friendly: "§G友善§!"
 BOS_anti_government_demonstrations_desc: "我们的行动引发了许多人的街头抗议。一旦受影响民众的态度和情绪恢复稳定，动荡局势就会平息。"
 BOS_internal_faction_balance: "波斯尼亚人民"
 BOS_internal_faction_balance_desc: "波斯尼亚克族、克罗地亚族和塞尔维亚族在国家机器中的利益平衡决定着国家的稳定和人员招募。"
 BOS_landmine_contamination: "地雷污染"
 BOS_landmine_contamination_desc: "该地区未清除的战时雷区造成平民伤亡，限制了定居，并使可耕地无法利用。"
 BOS_cooperator: "波斯尼亚合作者"
 BOS_political_reformer: "政治改革家"
 BOS_presidency_rotation_cooldown: "轮换到期"
 BOS_rotation_of_leaders: "进行总统轮换"
 BOS_rotation_of_leaders_desc: "在本届轮值期结束后，将集体主席职位移交给下一位成员代表。"
 BOS_rotation_branch_available_tt: "目前，总统职位由各组成民族的代表之一担任。"
 BOS_s_bridge_builder: "波斯尼亚筑桥者"
 bos_croat_war_info_tool_tip: "§R注意§!\n波斯尼亚-黑塞哥维那将脱幅而去，并向我们和塞族共和国宣战。\n一些国策将会被封锁直到内战结束。\n战争结束后，某个事件将重新解锁它们。"
 bos_dodik_gains_power_2010_tt: "米洛拉德·多迪克在2010-2011年左右获得权力"
 bos_this_will_lock_certain_paths_within_the_focus_tree: "§R这将锁定国策树的部分路线§!"
 BOS_united_nations_aid: "来自国际合作伙伴的援助"
 BOS_croats_declare_independence_hidden: "移除非军事区"
 BOS_croats_declare_independence_hidden_desc: "当分裂危机尚未演变为内战时，恢复实体非军事区。"
 bos_srpska_builds_up: "§Y塞族共和国§!已经目睹了我们的行动，并已经开始对所有现役成员进行§R重新武装§!！"
 bos_remove_idea_tooltips: "玩家现在可以正当化战争目标\n内战崩溃将被移除"
 BOS_financial_crisis_desc: "出口下降、信贷紧缩和失业率上升正在削弱波斯尼亚的公共财政。一项协调一致的复苏计划可以缩短危机持续时间。"
 BOS_treasury_higher_than_3_5_tt: "国库余额必须多于§Y$3.5B§!"
 BOS_treasury_higher_than_4_5_tt: "国库余额必须多于§Y$4.5B§!"
 BOS_treasury_higher_than_8_5_tt: "国库余额必须多于§Y$8.5B§!"
 BOS_treasury_higher_than_4_3_tt: "国库余额必须多于§Y$4.3B§!"
 BOS_treasury_higher_than_12_6_tt: "国库余额必须多于§Y$12.6B§!"
 BOS_convene_the_federation_tt: "£decision_icon_small §Y召集联邦§!决议将在所有继承国的“南斯拉夫怀旧”情绪达到§Y75%§!时完成统一，我们将领导复兴运动。"
 BOS_purge_quell_decisions_tt: "£decision_icon_small §Y镇压波斯尼亚克反对派§!与§Y镇压克罗地亚反对派§!决议仍然可用"
