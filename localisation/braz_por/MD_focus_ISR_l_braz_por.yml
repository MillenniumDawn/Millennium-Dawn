 harari_compromise: "O Compromisso Harari"
 harari_compromise_desc: "Israel é o único governo constitucional do mundo que nunca criou uma constituição. O comitê constitucional criado pelo primeiro Knesset não conseguiu chegar a uma constituição satisfatória, então o governo propôs um conjunto provisório de \"Leis Básicas\" até que uma constituição fosse redigida. Como sempre em Israel, porém, isso se tornou permanente. Isso significa que a estrutura constitucional do Estado é muito mais facilmente alterável em comparação com as constituições de outros países, representando uma ameaça perigosa à democracia israelense caso alguém decida usar esse poder.\n§W--------------§!\nEste espírito nacional será §RRemovido§! e substituído por um acordo constitucional se concluirmos o foco §Y$ISR_basic_law_amendment$§!, §Y$ISR_judicial_reform_partial$§! ou §Y$ISR_rein_in_partners$§!."
