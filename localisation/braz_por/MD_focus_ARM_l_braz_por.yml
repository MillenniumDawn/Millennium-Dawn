 ARM_expand_cis_cooperations: "Ampliar a Cooperação de Segurança da CEI"
 ARM_expand_cis_cooperations_desc: "Ampliar a Cooperação de Segurança da CEI"
 arme.16.t: "Reunião de Segurança da CEI em Yerevan, Armênia"
 arme.16.d: "O líder armênio [ARM.GetLeader] recebeu os chefes de delegações que chegaram a Yerevan para participar da reunião do Conselho de Chefes de Segurança e Serviços Especiais da CEI.\n\nConforme divulgado pela assessoria de imprensa do chefe de Estado armênio, [ARM.GetLeader] destacou a importância do trabalho do Conselho, especialmente considerando a prioridade de garantir a segurança nos níveis nacional, regional e internacional. O Presidente enfatizou a necessidade de aprofundar a cooperação no âmbito da CEI.\n\n[ARM.GetLeader] observou que, em todos os tempos, as questões de combate às ameaças à segurança estiveram no centro das atenções dos Estados. Segundo ele, a cooperação nesta e em outras áreas permite fortalecer ainda mais os laços interestatais e a amizade entre os povos.\n\nA pedido de [ARM.GetLeader], os convidados apresentaram as questões discutidas na reunião realizada em Tsaghkadzor e as decisões tomadas."
 arme.16.a: "Interessante."
 armcis_infl: "§Y[ROOT.GetNameWithFlag]§! Obterá §Y2% de Influência§! sobre Todos os §3Membros da CEI§!"
 ARM_russian_culture_promotion: "Promoção da Cultura Russa"
 ARM_russian_culture_promotion_desc: "A Rússia sempre está ansiosa para promover sua cultura em nosso país. Seja qual for a motivação deles, o conhecimento adicional de uma língua estrangeira e a cooperação educacional são sempre benéficos para nossa população."
 ARM_russian_fsb_borderguards: "Guardas de Fronteira do FSB Russo"
 ARM_russian_fsb_borderguards_desc: "Devemos convidar as tropas de fronteira do FSB russo para reforçar nossa segurança."
 arme.17.t: "[ARM.GetNameWithFlag] Convida as Tropas de Fronteira do FSB"
 arme.17.d: "Recentemente, o governo armênio propôs que nossas tropas de fronteira do FSB guardem e monitorem a fronteira armênio-turca e as fronteiras armênio-azerbaijanas.\n\nIsso aumentará nossa influência e inteligência na região, caso aceitemos essa proposta."
 arme.17.a: "Claro!"
 arme.17.b: "Desculpe, não."
 ARM_fsb_borderguards: "Guardas de Fronteira do FSB"
 arme.18.t: "[SOV.GetNameWithFlag] Concorda!"
 arme.18.d: "As tropas de fronteira do FSB russo serão enviadas a todas as nossas regiões."
 arme.18.a: "Ótimo."
 arme.19.t: "[SOV.GetNameWithFlag] Recusa!"
 arme.19.d: "A Rússia recusou nossa oferta de estacionar tropas do FSB russo em nossas fronteiras."
 arme.19.a: "Que isso."
 ARM_expand_russian_base_time: "Exercícios com as Forças Armadas Russas"
 ARM_expand_russian_base_time_desc: "Como a base militar russa está localizada em nosso país, podemos realizar exercícios militares conjuntos."
 ARM_remove_fsb_borderguards: "Remover os Guardas de Fronteira do FSB de [SOV.GetNameWithFlag]"
 fsb_deployed: "O FSB foi destacado em [ARM.GetNameWithFlag]"
 arme.20.t: "[ARM.GetNameWithFlag] Propõe a Promoção da Cultura Russa!"
 arme.20.d: "Desde os tempos da antiga Rus, os intercâmbios culturais armênio-russos enriqueceram muito ambas as culturas. Com uma história compartilhada por meio do Império Russo e da União Soviética, a Armênia propôs um acordo: eles abrigarão nossos centros culturais para promover a cultura russa por lá, contrabalançando a influência ocidental. Em troca, pedem que financiemos o estabelecimento desses centros."
 arme.20.a: "Dai o Bom Dia!"
 arme.20.b: "Não vemos utilidade na promoção cultural."
 arme.21.t: "[SOV.GetNameWithFlag] Concorda!"
 arme.21.d: "A Rússia concordou em financiar os centros culturais russos na Armênia."
 arme.21.a: "Maravilhoso!"
 arme.22.t: "[SOV.GetNameWithFlag] Recusa!"
 arme.22.d: "A Rússia recusou nossa proposta de abrir centros culturais russos na Armênia. Dizem que não veem utilidade em tais iniciativas."
 arme.22.a: "Que povo estranho. Talvez não precisássemos de seus centros culturais, afinal."
 ARM_educational_cooperation: "Cooperação Educacional com a Rússia"
 ARM_educational_cooperation_desc: "Podemos tentar convencer a Rússia a iniciar um programa de intercâmbio estudantil conosco."
 ARM_rusarm_educ_coop: "Acordo Educacional Armênio-Russo"
 arme.23.t: "[ARM.GetNameWithFlag] Propõe um Acordo Educacional!"
 arme.23.d: "A Armênia nos propôs recentemente um acordo de cooperação educacional, pelo qual estudantes de ambos os países poderão ser intercambiados entre universidades. Considerando que as universidades armênias têm muitos laços com a educação ocidental, nossos estudantes podem se beneficiar muito disso."
 arme.23.a: "Claro!"
 arme.23.b: "Isso é alguma conspiração armênia!"
 arme.24.t: "[SOV.GetNameWithFlag] Concorda!"
 arme.24.d: "A Rússia concordou com nossa proposta de intercâmbio estudantil, e assinaremos os papéis em breve."
 arme.24.a: "Maravilhoso!"
 arme.25.t: "[SOV.GetNameWithFlag] Recusa!"
 arme.25.d: "A Rússia recusou nossa proposta, vendo-a como um método traiçoeiro de perverter a juventude russa com a influência ocidental."
 arme.25.a: "O-o quê?"
 mgu_unlock: "A §YCooperação com a Universidade Estatal de Moscou§! poderá ser adotada!"
 ARM_russian_tv_channels: "Canais de TV Russos"
 ARM_russian_tv_channels_desc: "Podemos permitir canais de TV russos no mercado armênio. Sim, isso aumentará a influência russa sobre nós, mas os benefícios podem ser bem maiores."
 ARM_rus_diaspora_strength: "Conexões com a Diáspora"
 ARM_rus_diaspora_strength_desc: "Podemos tentar nos conectar com a Diáspora Armênia e aceitar doações dela."
 ARM_ratify_iran_pipeline: "Ratificação do Gasoduto de Syunik"
 ARM_ratify_iran_pipeline_desc: "Talvez devêssemos oferecer ao Irã um acordo de gasoduto pela nossa fronteira sul. Trocaremos energia por gás."
 arme.26.t: "[ARM.GetNameWithFlag] Propõe um Acordo de Gás!"
 arme.26.d: "A Armênia nos oferece um acordo pelo qual será construído um gasoduto do Irã até a Armênia. O gás fornecido do Irã à Armênia será trocado por eletricidade, da qual tanto carecemos nas regiões do norte.\n\nO custo do gasoduto será dividido entre nós e a Armênia. O acordo é bastante bom; devemos concordar?"
 arme.26.a: "Concordamos!"
 arme.26.b: "Desculpe, não."
 arme.27.t: "[PER.GetNameWithFlag] Recusa!"
 arme.27.d: "O Irã recusou nossa oferta. Eles veem nossa proposta como algum tipo de conspiração sionista que mina sua soberania."
 arme.27.a: "Eles são loucos?"
 arme.28.t: "[PER.GetNameWithFlag] Concorda!"
 arme.28.d: "O Irã concordou com nossa proposta e está pronto para construir o gasoduto. Agora devemos pagar nossa parte do custo e começar a coordenar nossos esforços de construção."
 arme.28.a: "Ótimo!"
 ARM_syunik_pipeline: "Gasoduto Irã-Armênia"
 ARM_syunik_pipeline_two: "Gasoduto Irã-Armênia"
 gas_two_tt: "Nos concede §G2 Combustíveis Fósseis§! em §YSyunik§!"
 gas_two_per_tt: "Concede §G2 Combustíveis Fósseis§! à §YArmênia§!"
 gas_four_tt: "Nos concede §G4 Combustíveis Fósseis§! em §YSyunik§!"
 gas_four_per_tt: "Concede §G4 Combustíveis Fósseis§! à §YArmênia§!"
 ARM_arm_electr_deal: "Fornecimento de Eletricidade Armênio"
 ARM_arm_electr_deal_two: "Fornecimento de Eletricidade Armênio"
 arme.29.t: "Acordo de Gás [PER.GetNameWithFlag]-[ARM.GetNameWithFlag]!"
 arme.29.d: "Recentemente, líderes da Armênia e do Irã se reuniram na província de Syunik, na Armênia, e celebraram a grande inauguração de um novo gasoduto."
 arme.29.a: "Maravilhoso!"
 per_gas_accepted: "[PER.GetNameWithFlag] Aceitou o Acordo do Gasoduto"
 ARM_expand_pipeline: "Expandir o Gasoduto com [PER.GetNameWithFlag]"
 ARM_cancel_pipeline: "§RCancelar§! o Gasoduto com [PER.GetNameWithFlag]"
 arme.30.t: "[ARM.GetNameWithFlag] Amplia o Acordo de Gás!"
 arme.30.d: "A Armênia decidiu aumentar o acordo de troca e nos dar mais eletricidade em troca de mais gás."
 arme.30.a: "Ótimo!"
 ARM_eaeu_integrat: "Integração à UEE"
 ARM_eaeu_integrat_desc: "A pressão econômica russa sobre nós é alta demais para ser ignorada. Podemos transformá-la em algo muito benéfico se assinarmos os acordos certos."
 ARM_undermine_russian_influence: "Minar a Influência Russa"
 ARM_undermine_russian_influence_desc: "Os russos influenciam nosso país há tempo demais. Devemos nos livrar de sua influência em nosso país."
 arme.31.t: "Acordo de Gás [PER.GetNameWithFlag]-[ARM.GetNameWithFlag] Cancelado!"
 arme.31.d: "O acordo de gás entre a Armênia e o Irã foi agora cancelado e o gasoduto está fechado."
 arme.31.a: "Certo."
 arme.32.t: "[ARM.GetNameWithFlag] Mina a Influência de [SOV.GetNameWithFlag]!"
 arme.32.d: "Recentemente, a Armênia começou a fechar diversos centros culturais russos influentes e proibiu a mídia estatal russa em seu país."
 arme.32.a: "Desgraçados!"
 ARM_support_russian_opposition: "Apoiar a Oposição Russa"
 ARM_support_russian_opposition_desc: "Devemos minar a Rússia e apoiar líderes da oposição russa, financiando-os a partir da Armênia."
 arme.33.t: "[ARM.GetNameWithFlag] Apoia Nossa Oposição!"
 arme.33.d: "Recentemente, o governo armênio anunciou que apoia a oposição russa e convida todos os que possam ser reprimidos a vir para a Armênia. Não se sabe por que o governo armênio tomou tal posição, mas é claro que foi influenciado pelo recente esfriamento nas relações entre Yerevan e Moscou."
 arme.33.a: "Como ousam!"
 arme.34.t: "Questão da Base Militar Russa"
 arme.34.d: "Agora, após a piora de nossas relações com a Rússia, surge a questão da retirada das tropas russas de nosso país. Por um lado, podemos simplesmente expulsá-las; por outro, tentar influenciar a Rússia por meio dessa base militar. Como devemos proceder?"
 arme.34.a: "Eles devem sair o mais rápido possível!"
 arme.34.b: "Podem ser úteis... por enquanto."
 ARM_question_military_base: "Questionar a Base Militar Russa"
 ARM_question_military_base_desc: "Agora devemos pensar no que fazer com a base militar russa na Armênia."
 ARM_freeze_csto_membership: "Congelar a Participação na OTSC"
 ARM_freeze_csto_membership_desc: "A OTSC não tem utilidade para nós, pois não quer nos ajudar contra o Azerbaijão. Devemos decidir o que fazer com essa organização."
 ARM_investigate_prorus_offic: "Investigar Funcionários Pró-Russos"
 ARM_investigate_prorus_offic_desc: "Muitos políticos e funcionários estão ansiosos para promover os interesses russos. Devemos investigá-los e determinar a profundidade de suas lealdades."
 ARM_polish_cherries: "Cereja Polonesa"
 ARM_polish_cherries_desc: "A Polônia é famosa por seus produtos agrícolas; por que não iniciar uma relação comercial com ela comprando em pequena escala?"
 ARM_polish_mil_coop: "Cooperação Militar com a Polônia"
 ARM_polish_mil_coop_desc: "A Polônia pode se tornar um bom fornecedor de armas para nós, e pretendemos tentar concluir um contrato de fornecimento de armas com ela."
 ARM_arm_pol_friend: "Parceria com a Polônia"
 ARM_arm_pol_friend_desc: "Pretendemos levar nossas relações de parceria com nossos colegas poloneses a um novo nível."
 ARM_polish_fleet_help: "Pedir à Polônia Ajuda com a Frota"
 ARM_polish_fleet_help_desc: "Pretendemos atrair especialistas poloneses para o desenvolvimento de nossa frota, lembrando os primeiros tratados da Polônia com a Primeira República da Armênia."
 ARM_our_common_heritage: "Nossa Herança Comum"
 ARM_our_common_heritage_desc: "A Batalha de Grunwald, quando a Ordem Teutônica foi derrotada pelo exército polonês, não ocorreu sem a participação de armênios; nós ajudamos a Polônia naquela época, então podemos convidá-la a recordar o glorioso legado daqueles anos?"
 ARM_military_coop_greece: "Cooperação Militar com a Grécia"
 ARM_military_coop_greece_desc: "Pretendemos propor à Grécia ampliar nossa cooperação militar e também realizar uma série de exercícios conjuntos."
 arme.38.t: "Resultados da Investigação"
 arme.38.d: "Nosso Serviço de Segurança Nacional examinou todos os políticos pró-russos e descobriu suas ligações com o governo russo. No entanto, não foram encontrados esquemas de corrupção."
 arme.38.a: "Interessante."
 arme.39.t: "Resultados da Investigação"
 arme.39.d: "Nosso Serviço de Segurança Nacional examinou todos os políticos pró-russos e descobriu suas ligações com o governo russo. Esquemas de corrupção também foram revelados e suas atividades foram interrompidas."
 arme.39.a: "Ótimo!"
 ARM_sign_rome_statute: "Assinar o Estatuto de Roma"
 ARM_sign_rome_statute_desc: "Assinar o Estatuto de Roma pode nos dar mais ferramentas para combater a agressão russa em nossa região e além dela."
 ARM_cleanse_russian_agents: "Prender Agentes Russos"
 ARM_cleanse_russian_agents_desc: "Devemos prender e banir todos os políticos que trabalham abertamente pelos interesses russos e promovem uma agenda subserviente!"
 ARM_demand_contr_reassur: "Exigir o Cumprimento dos Contratos"
 ARM_demand_contr_reassur_desc: "Com nossa influência sobre a Rússia crescendo, devemos exigir que nossos contratos de armas sejam cumpridos."
 arme.40.t: "[ARM.GetNameWithFlag] Exige o Cumprimento de Contratos"
 arme.40.d: "O governo armênio, tendo ampliado sua influência sobre nosso país, exige que cumpramos alguns contratos de armas que deixamos de cumprir após a piora de suas relações conosco. No entanto, se cumprirmos o contrato, a influência deles sobre nós diminuirá muito."
 arme.40.a: "Engasguem com isso!"
 ARM_northern_neighbor: "Vizinho do Norte"
 ARM_northern_neighbor_desc: "Nosso vizinho do norte menos antagônico precisa ser resolvido. Seja diplomaticamente ou de outro modo."
 ARM_open_up_djavakhq_quest: "Abrir a Questão de Djavakhq"
 ARM_open_up_djavakhq_quest_desc: "Nosso povo na Geórgia é oprimido por nossos parceiros do norte. Chegou a hora de libertá-los da Geórgia!"
 ARM_support_separatism: "Apoiar o Separatismo"
 ARM_support_separatism_desc: "Devemos apoiar o separatismo na Geórgia e promover a liberdade de Djavakhk por meios militares!"
 ARM_protect_minority_rights: "Proteger os Direitos das Minorias"
 ARM_protect_minority_rights_desc: "Nossos amigos georgianos são duros demais com a população armênia em seu país. Não devemos provocar conflito, mas influenciar a Geórgia por meios diplomáticos."
 ARM_friendship_and_trade_agreement: "Acordo de Amizade e Comércio"
 ARM_friendship_and_trade_agreement_desc: "Embora existam alguns problemas em relação à Geórgia e à nossa população armênia em Djavakhq, podemos negociá-los pacificamente e fazer ambos os países prosperarem."
 ARM_demand_representation: "Exigir Representação"
 ARM_demand_representation_desc: "Respeitamos a integridade territorial da Geórgia, porém não podemos ficar de lado vendo como o sistema da Geórgia é antidemocrático, bem como a forma como ele ostraciza a comunidade armênia em seu sistema político!"
 ARM_black_sea_agreements: "Acordos do Mar Negro"
 ARM_black_sea_agreements_desc: "O comércio através do Mar Negro é enorme e pode ser benéfico para ambos estabelecermos acordos de comércio bilateral e acesso marítimo."
 ARM_electro_exporting: "Exportação de Eletricidade"
 ARM_electro_exporting_desc: "Nossa capacidade de exportar eletricidade é boa o bastante para ampliar nossas exportações. Podemos estabelecer um acordo com a Geórgia que poderia ser benéfico."
 ARM_javakhq_must_be_free: "Operação \"Cruz Caída\""
 ARM_javakhq_must_be_free_desc: "Os georgianos imperialistas exploraram nossa terra e nosso povo por tempo demais! Agora devemos conduzir uma operação militar e libertar nosso povo!"
 ARM_support_geo_peace: "Apoiar a Paz na Geórgia"
 ARM_support_geo_peace_desc: "Para fomentar a confiança entre nossos países, podemos tentar intermediar um acordo entre as repúblicas separatistas e a Geórgia, pondo fim a esse conflito sem sentido."
 ARM_friendship_syria: "Amizade com a Síria"
 ARM_friendship_syria_desc: "Apesar de nossas possíveis diferenças políticas com a Síria, a comunidade alauíta sempre apoiou os armênios na região, e devemos promover o aprofundamento de nossas relações."
 ARM_alaw_assyr_armen: "Conexões Alauíta-Armênio-Assírias"
 ARM_alaw_assyr_armen_desc: "O trio de alauítas, armênios e assírios são minorias não muçulmanas na Síria. Para que nossas comunidades sobrevivam, devemos cooperar e nos apoiar mutuamente."
 ARM_rescuing_diasp: "Resgatar a Diáspora"
 ARM_rescuing_diasp_desc: "A situação na Síria é bastante instável, e devemos ajudar nossa comunidade a se repatriar para a Armênia e a se integrar à nossa sociedade."
 ARM_human_aid_syr: "Ajuda Humanitária à Síria"
 ARM_human_aid_syr_desc: "A população síria precisa desesperadamente de ajuda; devemos fornecer ajuda humanitária à Síria e ampliar nossa influência sobre ela."
 ARM_intervene_in_syria: "Intervir na Síria"
 ARM_intervene_in_syria_desc: "Devemos enviar nossas forças para ajudar a Síria em sua guerra!"
 arme.41.t: "Armênios de Djavakheti Exigem Representação!"
 arme.41.d: "A população armênia de Samtskhe-Djavakheti exige representação em nosso parlamento e quer ter autonomia ampliada dentro da Geórgia. Eles afirmam especificamente que seus protestos não têm relação com a Ossétia do Sul e a Abecásia e que não querem um conflito armado dentro de sua pátria.\n\nO próprio governo armênio apoiou a exigência deles, além de pedir a estabilização da situação e pedir que os armênios não iniciem um levante armado.\n\nO governo armênio também afirmou que, se federalizarmos nosso país, eles nos ajudarão a integrar a Ossétia do Sul e a Abecásia por meio de seus laços com a diáspora, contornando a influência russa."
 arme.41.a: "Pedido Justo!"
 arme.41.b: "Não podemos pagar por isso!"
 arme.42.t: "Federalização!"
 arme.42.d: "Por que você está lendo isto, seu trapaceirinho?"
 arme.42.a: "Zaebumba?"
 djavakhq_pizdec: "[GEO.GetNameWithFlag] Recusou a Resolução Pacífica"
 arme.44.t: "[GEO.GetNameWithFlag] Recusou Federalizar!"
 arme.44.d: "A Geórgia recusou federalizar e não dará autonomia a Djavakhk."
 arme.44.a: "Que vergonha!"
 geofed_arm_tt: "[GEO.GetNameWithFlag] pode federalizar e dar autonomia a [ARM.GetFlag]§9Djavakhk§!"
 ARM_djavakhq: "Djavakheti Autonomy"
 arme.45.t: "[ARM.GetNameWithFlag] Propõe a Resolução do Conflito!"
 arme.45.d: "Recentemente, o governo armênio decidiu mediar nosso conflito com a Geórgia. Os armênios propõem uma solução pela qual [ROOT.GetNameWithFlag] obterá autonomia completa, com possibilidade de secessão se assim quisermos. Eles apontam a recente situação da região autônoma de Djavakhk e como ela foi resolvida com eficiência. A Armênia também garantirá que a Geórgia não tire nossa autonomia. Devemos concordar?"
 arme.45.a: "Claro!"
 arme.45.b: "Não entregaremos nossa soberania!"
 arme.46.t: "[FROM.GetNameWithFlag] Aceita a Federalização!"
 arme.46.d: "[FROM.GetNameWithFlag] aceitou a solução armênia de federalização com a Geórgia e agora faz parte do Estado georgiano."
 arme.46.a: "Maravilhoso!"
 arme.46.b: "Ótimo!"
 arme.47.t: "[FROM.GetNameWithFlag] Rejeita a Federalização!"
 arme.47.d: "[FROM.GetNameWithFlag] rejeitou nossa proposta de resolução."
 arme.47.a: "Muito Infeliz."
 arme.48.t: "[ARM.GetNameWithFlag] Reivindica Samtskhe-Djavakheti!"
 arme.48.d: "Recentemente, o governo de [ARM.GetNameWithFlag] declarou que a opressão dos armênios na Geórgia deve ser interrompida imediatamente.\n\nNossos funcionários e algumas figuras armênias locais pró-georgianas negam qualquer alegação de opressão; no entanto, a Armênia já começou a reunir tropas na fronteira georgiano-armênia."
 arme.48.a: "Desgraçados!"
 arme.49.t: "Guerra de [ARM.GetNameWithFlag] contra [GEO.GetNameWithFlag]!"
 arme.49.d: "A Armênia declarou guerra à Geórgia recentemente. Esta pode ser nossa chance histórica de matar de vez o golias georgiano!"
 arme.49.a: "Vamos nos juntar!"
 arme.49.b: "Isso é arriscado demais..."
 ARM_amenia_georgia_trade: "Acordo Comercial [ARM.GetNameWithFlag] - [GEO.GetNameWithFlag]"
 arme.50.a: "Claro!"
 arme.50.b: "Não estamos interessados."
 arme.52.b: "Vamos continuar nossa missão diplomática."
 arme.54.t: "[GEO.GetNameWithFlag] Aceita!"
 arme.54.d: "[GEO.GetNameWithFlag] aceitou nossa proposta diplomática de nos dar acesso aos portos do Mar Negro."
 arme.54.a: "Maravilhoso!"
 arme.55.t: "[GEO.GetNameWithFlag] Rejeita!"
 arme.55.d: "[GEO.GetNameWithFlag] rejeitou nossa proposta de amizade e comércio."
 arme.55.a: "Que isso"
 arme.55.b: "Devemos continuar os esforços diplomáticos!"
 arme.56.t: "[ARM.GetNameWithFlag] Oferece um Acordo de Exportação de Eletricidade!"
 arme.56.d: "Recentemente, a Armênia nos propôs um acordo de exportação de eletricidade, pelo qual nos fornecerá eletricidade por vários anos a um preço acessível. Devemos concordar?"
 arme.56.a: "Claro!"
 arme.56.b: "Desculpe, não."
 arme.57.t: "[ARM.GetNameWithFlag] Quer Comprar Nossas Armas"
 arme.57.d: "[ARM.GetName] expressou o desejo de comprar algumas de nossas armas como parte do fortalecimento da cooperação militar conosco, bem como do fortalecimento de suas forças armadas. Devemos concordar?"
 arme.57.a: "Claro!"
 arme.57.b: "Desculpe, não."
 arme.58.t: "Contrato Militar com [POL.GetNameWithFlag]"
 arme.58.d: "Eles concordaram em nos vender suas armas como parte da cooperação militar entre os dois países, o que é muito animador, pois poderemos fortalecer enormemente nossas forças armadas."
 arme.58.a: "Bom"
 arme.59.t: "Contrato Militar com [POL.GetNameWithFlag]"
 arme.59.d: "Eles se recusaram a assinar um contrato de fornecimento de armas a nós; aparentemente acreditam que suas armas em nossas mãos abalariam o equilíbrio de poder? Que estupidez"
 arme.59.a: "Triste"
 arme.60.t: "[ARM.GetNameWithFlag] Se Esforça para Melhorar as Relações Conosco"
 arme.60.d: "O governo armênio está claramente determinado a aprofundar as relações diplomáticas entre nossos países e pretende nos convidar a assinar um acordo de amizade e cooperação. Devemos concordar?"
 arme.60.a: "Claro!"
 arme.60.b: "Desculpe, não."
 arme.61.t: "Parceria com [POL.GetNameWithFlag]"
 arme.61.d: "O governo polonês aprovou um acordo de parceria e amizade entre nossos países, o que é sem dúvida animador, pois cada vez mais países se tornam nossos parceiros!"
 arme.61.a: "Legal"
 arme.62.t: "Parceria com [POL.GetNameWithFlag]"
 arme.62.d: "O governo polonês nos negou um tratado de amizade e cooperação, o que é triste, claro, pois estamos sempre focados na cooperação entre nossos países."
 arme.62.a: "Triste"
 arme.63.t: "[ARM.GetNameWithFlag] Pede Ajuda no Desenvolvimento da Frota"
 arme.63.d: "O Governo da Armênia, referindo-se ao acordo celebrado durante a existência da Primeira República da Armênia, pede ajuda ao nosso governo no desenvolvimento da frota, já que a Armênia agora tem acesso ao mar novamente. Devemos concordar?"
 arme.63.a: "Claro!"
 arme.63.b: "Desculpe, não."
 arme.64.t: "[POL.GetFlag]Assistência Polonesa no Desenvolvimento da Frota"
 arme.64.d: "O governo polonês concordou em nos ajudar a desenvolver nossa Frota, e agora fortaleceremos nossas forças navais."
 arme.64.a: "Legal!"
 arme.65.t: "[POL.GetFlag]Assistência Polonesa no Desenvolvimento da Frota"
 arme.65.d: "O Governo polonês se recusou a nos ajudar a desenvolver nossas forças navais, alegando a impossibilidade financeira de fazê-lo."
 arme.65.a: "Triste"
 arme.66.t: "[ARM.GetNameWithFlag] Nos Convida a Recordar Grunwald"
 arme.66.d: "A Batalha de Grunwald é um evento histórico na história da Polônia, quando a Ordem Teutônica e seus aliados foram completamente derrotados pelo Exército Polonês. Historiadores também confirmam a participação de armênios nesse evento ao lado do Exército Polonês. Isso irritará muito o lado alemão. Devemos concordar?"
 arme.66.a: "É um Motivo de Orgulho."
 arme.66.b: "Desculpe, não."
 arme.67.t: "O Legado Polonês-Armênio da Batalha de Grunwald"
 arme.67.d: "O Governo polonês apoiou nosso desejo de preservar esse evento histórico na memória de nossos povos como motivo de orgulho."
 arme.67.a: "Bom"
 arme.68.t: "O Legado Polonês-Armênio da Batalha de Grunwald"
 arme.68.d: "O governo polonês não apoiou nosso desejo de resgatar a história dos eventos daqueles anos; aparentemente, eles têm medo da bota alemã!"
 arme.68.a: "Triste"
 arme.69.t: "Cereja Polonesa"
 arme.69.d: "Toda parceria começa com pequenos passos. Nossa relação com a Polônia começou com frutas vermelhas polonesas em nosso mercado. Talvez possamos construir algo maior a partir daqui."
 arme.69.a: "Esperamos que sim"
 arme.70.t: "[ARM.GetNameWithFlag] Propõe Exercícios Conjuntos"
 arme.70.d: "A Armênia pretende ampliar a cooperação técnico-militar conosco e propõe realizar exercícios conjuntos de nossas forças de operações especiais para compartilhar experiências."
 arme.70.a: "Concordamos"
 arme.70.b: "Não"
 arme.71.t: "Exercícios Conjuntos com a Grécia"
 arme.71.d: "O governo grego aceitou nossa oferta e realizamos exercícios conjuntos de nossas forças de operações especiais."
 arme.71.a: "Somos Mais Fortes Juntos."
 arme.72.t: "Exercícios Conjuntos com a Grécia"
 arme.72.d: "O governo grego se recusou a realizar exercícios conjuntos com nossas forças de operações especiais."
 arme.72.a: "Deve haver motivos."
 ARM_legacy_of_grunwald_idea: "Legado da Batalha de Grunwald"
 ARM_anti_turkish_idea: "Diplomacia Antiturca"
 ARM_amenia_georgia_electro: "Importação de Eletricidade de [ARM.GetNameWithFlag]"
 ARM_amenia_georgia_electro_agre: "Exportação de Eletricidade para [GEO.GetNameWithFlag]"
 arme.74.t: "[GEO.GetNameWithFlag] Concorda!"
 arme.74.d: "A Geórgia concordou com nossa oferta de exportação de eletricidade e agora estamos estabelecendo toda a infraestrutura necessária para o transporte de eletricidade."
 arme.74.a: "Ótimo!"
 arme.75.t: "[GEO.GetNameWithFlag] Recusa!"
 arme.75.d: "A Geórgia vê nossa oferta de exportação de eletricidade como prejudicial à sua própria indústria de produção de eletricidade. Assim, não querem nossa eletricidade em seu país."
 arme.75.a: "Loucura"
 ARM_bilat_trade_agreement: "Acordo Comercial Bilateral"
 ARM_bilat_trade_agreement_desc: "O comércio entre a Armênia e o Irã tem muito potencial. Devemos criar condições para que não haja obstáculos comerciais entre nossos países."
 ARM_memorandum_of_understanding: "Memorando de Entendimento"
 ARM_memorandum_of_understanding_desc: "A mídia estatal do Irã e da Armênia deve assinar um memorando de entendimento e coordenação para combater a desinformação sobre ambos os países, espalhada por seus inimigos comuns."
 ARM_amenia_iran_memo: "Memorando de Entendimento [ARM.GetNameWithFlag] - [PER.GetNameWithFlag]"
 arme.76.t: "Memorando de Entendimento [ARM.GetNameWithFlag] - [PER.GetNameWithFlag]!"
 arme.76.d: "Recentemente, veículos de mídia do governo armênio nos procuraram para propor um acordo mutuamente benéfico. Eles propõem assinar um memorando pelo qual a mídia iraniana e a armênia combaterão a desinformação sobre ambos os países, espalhada por nossos inimigos mútuos. Devemos concordar com esta proposta?"
 arme.76.a: "Claro!"
 arme.76.b: "Não estamos interessados"
 arme.77.t: "[PER.GetNameWithFlag] Concorda!"
 arme.77.d: "O Irã concordou com nossa proposta de memorando, pelo qual a mídia iraniana e a armênia combaterão a desinformação sobre ambos os países, espalhada por nossos inimigos mútuos."
 arme.77.a: "Ótimo!"
 arme.78.t: "[PER.GetNameWithFlag] Recusa!"
 arme.78.d: "O Irã não viu utilidade em assinar o memorando que lhes propusemos."
 arme.78.a: "Estranho"
 arme.80.t: "Cooperação Política com [ARM.GetNameWithFlag]"
 arme.80.d: "A Armênia é nossa parceira e uma das nações mais próximas de nós em espírito. Compartilhamos uma herança comum, e não é surpresa que a Armênia tenha manifestado o desejo de ampliar nossa cooperação."
 arme.80.a: "Somos Amigos!"
 arme.80.b: "Não Estamos Interessados"
 arme.81.t: "Cooperação Política com [GRE.GetNameWithFlag]"
 arme.81.d: "A Grécia manifestou sua disposição de cooperar conosco na esfera política, e juntos nossos Estados podem conquistar muito!"
 arme.81.a: "Legal"
 arme.82.t: "Cooperação Política com [GRE.GetNameWithFlag]"
 arme.82.d: "A Grécia não está pronta para ampliar a cooperação política conosco; não veem sentido nisso"
 arme.82.a: "Triste"
 arme.83.t: "Política Antiturca Conjunta"
 arme.83.d: "A Turquia é uma ameaça igual tanto para a Armênia quanto para nós. A Armênia propõe adotar uma política antiturca conjunta para mostrar ao governo turco o seu lugar."
 arme.83.a: "A Turquia Deve Ter Medo de Nós"
 arme.83.b: "Não Estamos Interessados"
 arme.84.t: "Política Antiturca Conjunta"
 arme.84.d: "O governo grego apoiou nossa iniciativa política antiturca, e pretendemos combater a influência da Turquia sobre nós."
 arme.84.a: "Legal"
 arme.85.t: "Política Antiturca Conjunta"
 arme.85.d: "O governo grego decidiu não apoiar nossa iniciativa antiturca, o que nos causou decepção."
 arme.85.a: "Triste"
 arme.86.t: "Parceria com [ARM.GetNameWithFlag]"
 arme.86.d: "A Armênia pretende ampliar sua parceria conosco no âmbito da cooperação com a UE. Eles nos veem como uma porta de entrada para toda a União Europeia."
 arme.86.a: "Somos Amigos!"
 arme.86.b: "Não Estamos Interessados"
 arme.87.t: "Cooperação Política com [GRE.GetNameWithFlag]"
 arme.87.d: "A Grécia está pronta para ampliar nossa cooperação política e também está pronta para ajudar a estabelecer contatos com a União Europeia."
 arme.87.a: "Legal"
 arme.88.t: "Ajuda na Luta por Chipre"
 arme.88.d: "O governo armênio apoia nossos esforços para proteger nossos interesses em Chipre e está pronto para nos dar o máximo de apoio nessa luta. Estamos prontos para elevar as apostas e envolver a Armênia nisso?"
 arme.88.a: "Sim"
 arme.88.b: "Não Estamos Interessados"
 arme.89.t: "Ajuda na Luta por Chipre"
 arme.89.d: "O governo grego expressou grande alegria com nossa oferta de assistência na questão de Chipre e deixou claro que poderíamos ajudá-los por quaisquer meios necessários."
 arme.89.a: "Legal"
 arme.90.t: "Ajuda na Luta por Chipre"
 arme.90.d: "O governo grego recusou nossa oferta e nos advertiu a nos manter afastados da questão de Chipre. Parece que temem a escalada mais do que desejam a solução."
 arme.90.a: "Triste"
 arme.91.t: "A Armênia Nos Apoia em Chipre"
 arme.91.d: "Os serviços especiais armênios estão nos ajudando ativamente a resolver nosso problema em Chipre, ajudando-nos a aumentar nossa influência na ilha."
 arme.91.a: "Legal"
 ARM_mithridates_legacy: "Legado de Mitrídates"
 ARM_mithridates_legacy_desc: "Desde a antiguidade, armênios e gregos sempre compartilharam valores comuns, irmandade de sangue e inimigos comuns. Na tradição do legado de Mitrídates do Ponto, devemos continuar a amizade entre nossos povos irmãos."
 ARM_reassuring_comp_agre: "Acordo Abrangente"
 ARM_reassuring_comp_agre_desc: "Devemos assinar um acordo abrangente de amizade com a Grécia para finalmente oficializar nossas relações em nível governamental."
 ARM_anti_turk_diplo: "Diplomacia Antiturca"
 ARM_anti_turk_diplo_desc: "Devemos coordenar nossos esforços diplomáticos com a Grécia para conter as ambições turcas sobre nós."
 ARM_our_friend_in_eu: "Nosso Amigo na UE"
 ARM_our_friend_in_eu_desc: "A Grécia é nossa aliada mais próxima dentro da União Europeia. Devemos usar isso a nosso favor."
 ARM_support_cyprus: "Apoiar Chipre"
 ARM_support_cyprus_desc: "Assim como nós temos Artsakh, a Grécia tem Chipre. As decisões tirânicas turcas também estão presentes lá. Devemos apoiar a causa grega em Chipre."
 arme.79.t: "[ARM.GetNameWithFlag] Propõe um Projeto de Represa!"
 arme.79.d: "Recentemente, o governo armênio propôs um projeto conjunto de represa hidrelétrica no rio Araks, que corre entre nossas fronteiras. Devemos concordar com a proposta deles?"
 arme.79.a: "Claro, concordamos!"
 arme.79.b: "Não, não estamos interessados."
 arme.92.t: "[PER.GetNameWithFlag] Concorda!"
 arme.92.d: "O Irã concordou com a construção conjunta de uma represa hidrelétrica na região de Syunik. Eles já pagaram sua parte do preço."
 arme.92.a: "Ótimo!"
 ARM_amenia_iran_dam_share: "Participação Hidrelétrica de Syunik"
 idea_willcanc_if_rel_tt: "§YEste espírito nacional será removido se nossas relações com [ARM.GetNameWithFlag] se deteriorarem.§!"
 arme.93.t: "[PER.GetNameWithFlag] Recusa!"
 arme.93.d: "O Irã não está interessado em construir uma usina hidrelétrica na região de Syunik."
 arme.93.a: "Muito Infeliz."
 ARM_arax_hydro_power: "Hidrelétrica do Araks"
 ARM_arax_hydro_power_desc: "Podemos propor um acordo ao Irã para construir uma usina hidrelétrica na região de Syunik, no rio Araks."
 ARM_export_weapons_iran: "Exportar Armas para o Irã"
 ARM_export_weapons_iran_desc: "A pressão estrangeira sobre o Irã deixou Teerã sem fornecedores confiáveis de armas. Eles podem se interessar em comprar nossas armas por um preço razoável."
 arme.94.t: "[ARM.GetNameWithFlag] Oferece um Acordo de Armas!"
 arme.94.d: "Recentemente, o governo armênio nos propôs um carregamento de armas de infantaria de nível militar. Eles nos oferecem um preço razoável, considerando a situação atual."
 arme.94.a: "Claro, concordamos!"
 arme.94.b: "Não estamos interessados."
 arme.95.t: "[PER.GetNameWithFlag] Concorda!"
 arme.95.d: "O Irã concordou em comprar nossas armas; o carregamento será concluído em breve."
 arme.95.a: "Ótimo!"
 arme.96.t: "[PER.GetNameWithFlag] Recusa!"
 arme.96.d: "O Irã não concordou em comprar nossas armas, por algum motivo."
 arme.96.a: "Muito Infeliz."
 ARM_free_trade_zone: "Zona de Livre Comércio de Meghri"
 ARM_third_power_transmission: "Zona Econômica Livre de Meghri"
 ARM_third_power_transmission_desc: "Para aumentar nosso comércio com o Irã, devemos estabelecer uma zona de livre comércio em Meghri."
 ARM_iranian_drone_deal: "Comprar Drones Iranianos"
 ARM_iranian_drone_deal_desc: "Os drones iranianos provaram ser eficazes no combate moderno. Adquiri-los daria às nossas forças armadas uma capacidade significativa por uma fração do custo das alternativas ocidentais."
 arme.97.t: "[ARM.GetNameWithFlag] Quer Comprar Nossos Drones!"
 arme.97.d: "Recentemente, a Armênia demonstrou interesse em comprar nossos drones. Devemos concordar com a oferta deles e fornecer os drones pela quantia certa?"
 arme.97.a: "Claro!"
 arme.97.b: "Desculpe, não."
 arme.98.t: "[PER.GetNameWithFlag] Concorda!"
 arme.98.d: "O Irã concordou em nos vender alguns de seus drones. Eles serão entregues em breve."
 arme.98.a: "Ótimo!"
 arme.99.t: "[PER.GetNameWithFlag] Recusa!"
 arme.99.d: "O Irã não concordou com nosso acordo de compra de drones."
 arme.99.a: "Hã."
 ARM_covert_defense_agreement: "Acordo de Defesa Secreto"
 ARM_covert_defense_agreement_desc: "Devemos nos aliar ao Irã em um nível secreto e mais profundo para garantir a segurança de nossos dois Estados."
 arme.100.t: "[ARM.GetNameWithFlag] Oferece um Acordo de Defesa Secreto!"
 arme.100.d: "A Armênia propôs recentemente um acordo de defesa secreto entre nossos dois países. Eles querem que garantamos sua independência e eles garantirão a nossa. Devemos concordar?"
 arme.100.a: "Claro!"
 arme.100.b: "Não, não podemos arriscar."
 arme.104.t: "Batalhões Rebeldes"
 arme.104.d: "Nossa insurreição está ganhando força; batalhões inteiros já foram formados e estão prontos para defender nossa liberdade contra a ocupação iraniana."
 arme.104.a: "Pela Liberdade do Curdistão"
 arme.105.t: "Acordo Comercial com a Armênia"
 arme.105.d: "O governo armênio gostaria de concluir um acordo comercial conosco, contornando as estruturas da UE. Eles acreditam que a cooperação direta é mais eficaz do que esperar anos pela ação da burocracia europeia."
 arme.105.a: "Concordamos"
 arme.105.b: "Discordamos"
 arme.106.t: "Acordo de Cooperação Econômica e Comercial com a Armênia"
 arme.106.d: "O governo armênio pretende ampliar os laços culturais e econômicos com nosso país. A Armênia propõe concluir uma série de tratados e acordos voltados à cooperação nessas áreas entre nossos países."
 arme.106.a: "Concordamos"
 arme.106.b: "Discordamos"
 arme.107.t: "Acordo Comercial com a França"
 arme.107.d: "O governo francês concordou em concluir conosco uma série de acordos de cooperação econômica e cultural"
 arme.107.a: "Legal"
 arme.108.t: "Acordo Comercial com a França"
 arme.108.d: "O governo francês se recusou a ampliar a cooperação conosco nas esferas cultural e econômica; aparentemente, não nos considera possíveis parceiros."
 arme.108.a: "Triste"
 arme.109.t: "Acordo de Cooperação em Educação com a Armênia"
 arme.109.d: "O governo armênio manifestou interesse em cooperar com nossas instituições de ensino e gostaria de ver escritórios de representação de nossas melhores universidades em seu país. Esta é uma ótima oportunidade para influenciarmos a mente da juventude armênia."
 arme.109.a: "Concordamos"
 arme.109.b: "Discordamos"
 arme.110.t: "Acordo de Cooperação em Educação com a França"
 arme.110.d: "O governo francês manifestou sua disposição e desejo de cooperar ativamente conosco no campo educacional e também está pronto para abrir escritórios de representação de suas instituições de ensino superior em nosso país."
 arme.110.a: "Legal"
 arme.111.t: "Acordo de Cooperação em Educação com a França"
 arme.111.d: "O governo francês recusou nossa oferta de cooperação educacional. Parece que não estão com disposição para dialogar conosco nessa área."
 arme.111.a: "Triste"
 arme.112.t: "Cooperação Militar com a Armênia"
 arme.112.d: "O governo armênio pretende nos oferecer cooperação militar entre nossos países; a Armênia tem muito interesse na experiência de nossas missões internacionais, bem como na experiência da Legião Estrangeira."
 arme.112.a: "Concordamos"
 arme.112.b: "Discordamos"
 arme.113.t: "Cooperação Militar com a França"
 arme.113.d: "O Governo francês concordou em cooperar entre nossas forças armadas, especialmente na obtenção de experiência na condução de missões internacionais, bem como na experiência de algumas operações da legião estrangeira."
 arme.113.a: "Legal"
 arme.114.t: "Cooperação Militar com a França"
 arme.114.d: "O governo francês se recusou a cooperar conosco militarmente; aparentemente, não acredita que nosso exército esteja em condições de aprender com a experiência estrangeira."
 arme.114.a: "Triste"
 arme.115.t: "A Armênia na Francofonia"
 arme.115.d: "O governo armênio há muito se esforça para se tornar parte da Francofonia; talvez isso seja algo a mais para eles, pois também poderemos incluí-los plenamente na francosfera com o tempo. Vale a pena apoiar o desejo armênio de se tornar parte da Francofonia?"
 arme.115.a: "Sim"
 arme.115.b: "Não"
 arme.116.t: "A Armênia na Francofonia"
 arme.116.d: "A França reagiu positivamente ao nosso desejo de fazer parte da Francofonia e, agora que estamos na esfera de influência da França, podemos contar com seu patrocínio."
 arme.116.a: "Legal"
 arme.117.t: "A Armênia na Francofonia"
 arme.117.d: "A França decidiu negar nosso desejo de fazer parte da Francofonia e, no futuro, de toda a esfera francófona."
 arme.117.a: "Triste"
 arme.118.t: "A Armênia Quer Aderir ao Nosso Programa Militar Europeu"
 arme.118.d: "O Programa de Parceria Estatal do Comando Europeu dos Estados Unidos (EUCOM SPP), segundo sua própria missão, é um Programa de Parceria Estatal da Guarda Nacional que vincula estados dos EUA a países parceiros designados para apoiar os objetivos de cooperação de segurança do comando. Atualmente, existem 22 Parcerias com países da antiga União Soviética, da Iugoslávia e do Pacto de Varsóvia na Área de Responsabilidade do EUCOM. Tornando-se independentes com a dissolução da União Soviética em 26 de dezembro de 1991, esses países logo solicitaram o aconselhamento e a assistência dos Estados Unidos na criação de novas forças de autodefesa."
 arme.118.a: "Claro, Precisamos Treinar Nossos Aliados"
 arme.118.b: "Desculpe, Não"
 arme.119.t: "[USA.GetNameWithFlag] Aceita!"
 arme.119.d: "[FROM.GetNameWithFlag] aceitou nossa iniciativa, e agora nossas tropas participarão de exercícios conjuntos com nossos aliados europeus."
 arme.119.a: "Perfeito"
 arme.120.t: "[USA.GetNameWithFlag] Nos Rejeitou"
 arme.120.d: "Nossa política externa pode ter influenciado isso, mas não nos foi permitido participar dos exercícios conjuntos de países europeus"
 arme.120.a: "Ruim"
 arme.121.t: "Exercício Conjunto com o Estado do Kansas"
 arme.121.d: "A Armênia deseja sediar um exercício conjunto com o Exército Estadual do Kansas"
 arme.121.a: "Claro"
 arme.121.b: "Nunca"
 arme.122.t: "[USA.GetNameWithFlag] Aceita!"
 arme.122.d: "[FROM.GetNameWithFlag] concorda com exercícios conjuntos entre nosso exército e a guarda nacional do Kansas."
 arme.122.a: "Perfeito"
 arme.123.t: "[USA.GetNameWithFlag] Rejeitou Nossa Proposta"
 arme.123.d: "Infelizmente, não poderemos melhorar a prontidão de nossas forças armadas em exercícios conjuntos com o estado do Kansas"
 arme.123.a: "Ruim"
 arme.124.t: "A Armênia Deseja Obter o Status de Principal Aliado Não-OTAN"
 arme.124.d: "Vemos a Armênia como um país-chave na região do Cáucaso, e sua participação no programa de parceria não-OTAN é uma boa perspectiva para ampliar nossa influência lá."
 arme.124.a: "Sim, concordamos"
 arme.124.b: "Não, a Armênia é fraca"
 arme.125.t: "[USA.GetNameWithFlag] Aceita!"
 arme.125.d: "Os [USA.GetNameWithFlag] ratificaram nosso pedido e agora temos uma oportunidade única de cooperação militar com a OTAN"
 arme.125.a: "Bom"
 arme.126.t: "[USA.GetNameWithFlag] Rejeitou Nosso Pedido"
 arme.126.d: "[USA.GetNameWithFlag] decidiu rejeitar nosso pedido, pois não atendemos aos seus padrões"
 arme.126.a: "Tanto faz"
 arme.127.t: "Investimentos Adicionais em [ARM.GetNameWithFlag]?"
 arme.127.d: "É necessário desenvolver os laços econômicos entre nossos países por meio de diversos programas conjuntos"
 arme.127.a: "Sim, Claro"
 arme.127.b: "Nunca"
 arme.128.t: "[USA.GetNameWithFlag] Aceita!"
 arme.128.d: "Felizmente, conseguimos convencer [USA.GetNameWithFlag] sobre programas de financiamento adicionais em nosso país"
 arme.128.a: "Bom"
 arme.129.t: "[USA.GetNameWithFlag] Rejeitou Nossa Proposta"
 arme.129.d: "Infelizmente, [USA.GetNameWithFlag] não está interessado nisso."
 arme.129.a: "Ruim"
 arme.130.t: "[ARM.GetNameWithFlag] Solicita Pagamentos do Millennium Challenge Compact"
 arme.130.d: "A Armênia acredita que seu Estado passou por todas as etapas de melhoria da governança e está pronto para desembolsos no âmbito do programa Millennium Challenge Compact"
 arme.130.a: "Claro, eles estão prontos"
 arme.130.b: "Não, arrumem seu país"
 arme.133.t: "Lobby da ANCA"
 arme.133.d: "O Comitê Nacional Armênio da América (ANCA) é uma organização de base armênio-americana. Sua sede fica em Washington, D.C., e tem escritórios regionais em Glendale, Califórnia, e Watertown, Massachusetts."
 arme.133.a: "Bom"
 arme.134.t: "[ARM.GetNameWithFlag] Pede o Reconhecimento do Genocídio Armênio"
 arme.134.d: "A Armênia está pressionando com extrema força pelo reconhecimento do genocídio armênio. Se concordarmos, nossa influência na Armênia será muito fortalecida, mas isso estragará nossas relações com a Turquia"
 arme.134.a: "A Turquia deve ser punida por isso"
 arme.134.b: "Armênio o quê?"
 arme.135.t: "[USA.GetNameWithFlag] Reconheceu o Genocídio!"
 arme.135.d: "Este dia será realmente um dos mais importantes da história da Armênia, pois conseguimos convencer [USA.GetNameWithFlag] a reconhecer o genocídio cometido pela Turquia."
 arme.135.a: "Viva!"
 arme.136.t: "[USA.GetNameWithFlag] Fingem Não Saber do Que Estamos Falando."
 arme.136.d: "Infelizmente, os EUA preferem ser mais amigos de [TUR.GetNameWithFlag] do que de nós"
 arme.136.a: "Ruim"
 arme.137.t: "[ARM.GetNameWithFlag] se retira dos acordos militares com [USA.GetNameWithFlag]"
 arme.137.d: "Pertencemos à categoria dos países fracos que não conseguem cuidar de si mesmos? Esses países dependem muito da opinião de [USA.GetNameWithFlag], pois contam apenas com a produção e o fornecimento de armas de [USA.GetNameWithFlag], e isso prejudica sua própria segurança, tornando-os dependentes de Washington. Não temos mais interesse nisso."
 arme.137.a: "Fora, OTAN!"
 arme.144.t: "Congelamento de Ativos de [USA.GetNameWithFlag]"
 arme.144.d: "A moeda que os EUA despejaram em nosso país visava derrubar nosso governo. Estamos nacionalizando esse capital como compensação."
 arme.144.a: "Pertence a Nós"
 arme.145.t: "Retirada das Organizações Não Governamentais"
 arme.145.d: "The [USA.GetNameWithFlag] funds organisations that threaten our security. We are no longer interested in participating in them"
 arme.145.a: "É melhor assim"
 arme.149.t: "[ARM.GetNameWithFlag] Quer Ampliar os Laços Culturais"
 arme.149.d: "Nossos povos são ligados por séculos de história, e devemos manter esse vínculo no futuro. Além disso, nossos países se beneficiam mutuamente dessa cooperação nos sentidos político e econômico."
 arme.149.a: "Claro"
 arme.149.b: "Não"
 arme.150.t: "[SYR.GetNameWithFlag] Aceita!"
 arme.150.d: "O governo sírio concorda plenamente conosco e está pronto para intensificar ainda mais a interação cultural"
 arme.150.a: "Bom"
 arme.151.t: "[SYR.GetNameWithFlag] Rejeita a Cooperação Cultural"
 arme.151.d: "Eles não estão interessados e rejeitaram nossa oferta"
 arme.151.a: "Ruim"
 arme.152.t: "[ARM.GetNameWithFlag] Evacua a Diáspora de Volta para [ARM.GetNameWithFlag]"
 arme.152.d: "Devido à guerra em que nosso país está envolvido, o governo armênio decidiu evacuar sua população de volta para [ARM.GetNameWithFlag]"
 arme.152.a: "Boa viagem!"
 arme.153.t: "Armênios Chegaram de [SYR.GetNameWithFlag]"
 arme.153.d: "Conseguimos evacuar nosso povo da Síria, que atravessa momentos difíceis no momento"
 arme.153.a: "Bom"
 arme.154.t: "Ajuda Humanitária a [SYR.GetNameWithFlag]"
 arme.154.d: "Nossos amigos sírios estão em situação difícil, então lhes forneceremos ajuda humanitária"
 arme.154.a: "Nossos irmãos devem ser salvos!"
 arme.155.t: "[ARM.GetNameWithFlag] Fornece Ajuda Humanitária"
 arme.155.d: "Nossos amigos de [ARM.GetNameWithFlag] nos enviaram ajuda humanitária. Nosso povo agradece de coração ao povo armênio por não nos esquecer"
 arme.155.a: "Que Deus Proteja a Armênia!"
 arme.156.t: "[ARM.GetNameWithFlag] Nos Envia Ajuda Militar"
 arme.156.d: "[ARM.GetNameWithFlag] está disposta a nos fornecer assistência que deve melhorar nossa situação na linha de frente"
 arme.156.a: "Obrigado"
 arme.156.b: "Não Precisamos"
 arme.157.t: "[SYR.GetNameWithFlag] Aceita Nossa Ajuda"
 arme.157.d: "A liderança militar deles nos agradece pela ajuda que prestamos"
 arme.157.a: "Bom"
 arme.158.t: "[SYR.GetNameWithFlag] Recusa a Ajuda"
 arme.158.d: "Aparentemente, eles não precisam muito da nossa ajuda."
 arme.158.a: "Certo"
 arme.163.t: "[ARM.GetNameWithFlag] Deseja Ingressar na OTAN"
 arme.163.d: "Eles garantem que trabalharão por uma causa comum e se tornarão um parceiro-chave da aliança em sua região."
 arme.163.a: "Claro"
 arme.163.b: "Não"
 arme.165.t: "[USA.GetNameWithFlag] Rejeita Nosso Pedido"
 arme.165.d: "Eles não têm interesse em nossa entrada na OTAN."
 arme.165.a: "Tanto faz"
 ARM_relations_with_america: "Relações com os EUA"
 ARM_relations_with_america_desc: "Os EUA têm uma grande diáspora armênia, além de relações históricas muito boas conosco. Desde o presidente Wilson, muitos armênios viram a América como nosso parceiro confiável."
 ARM_join_us_eur_partn_prog: "Parceria Estatal do Comando Europeu"
 ARM_join_us_eur_partn_prog_desc: "Os Estados Unidos oferecem um programa de parceria militar com suas reservas do exército, voltado à construção de nossas novas estruturas militares."
 ARM_expand_us_embassy: "Ampliar a Embaixada dos EUA"
 ARM_expand_us_embassy_desc: "A América já tem um enorme pedaço de terra sob o controle de sua embaixada. No entanto, se quiserem mais terra para a embaixada, podemos fornecê-la."
 ARM_additional_programs_for_armenia: "Programas Adicionais para a Armênia"
 ARM_additional_programs_for_armenia_desc: "Os EUA podem nos oferecer programas de desenvolvimento adicionais voltados exclusivamente à Armênia."
 ARM_millennium_challenge_compact: "Millennium Challenge Compact"
 ARM_millennium_challenge_compact_desc: "O Millennium Challenge Compact é um acordo governamental americano de cinco anos entre a MCC e um país elegível para financiar programas específicos voltados à redução da pobreza e ao estímulo do crescimento econômico."
 ARM_anca_lobbying: "Lobby da ANCA"
 ARM_anca_lobbying_desc: "O Comitê Nacional Armênio da América é uma organização de base armênio-americana. Sua sede fica em Washington, D.C., e tem escritórios regionais em Glendale, Califórnia, e Watertown, Massachusetts."
 ARM_us_recog_arm_gen: "Reconhecimento do Genocídio Armênio pelos EUA"
 ARM_us_recog_arm_gen_desc: "Devemos pedir aos Estados Unidos que finalmente pressionem a Turquia e reconheçam as atrocidades turcas durante a Primeira Guerra Mundial como genocídio."
 ARM_kansas_armenia_partnership: "Parceria Estatal Kansas-Armênia"
 ARM_kansas_armenia_partnership_desc: "O exército armênio fez parceria com a guarda nacional do Kansas por meio do programa CSPP dos EUA. Devemos realizar treinamentos juntos."
 ARM_req_mnna_status: "Solicitar o Status de Principal Aliado Não-OTAN"
 ARM_req_mnna_status_desc: "Agora que mostramos verdadeira lealdade à causa ocidental, talvez devêssemos solicitar aos EUA o status de Principal Aliado Não-OTAN."
 ARM_stopping_usaid: "Parar a USAID"
 ARM_stopping_usaid_desc: "A USAID é uma organização que não faz nada além de promover os interesses americanos. Ela deve ser detida!"
 ARM_close_us_embassy: "Fechar a Embaixada"
 ARM_close_us_embassy_desc: "Os EUA conspiram contra nós por meio de sua embaixada há tempo demais. Isso deve parar."
 ARM_seizing_us_investments: "Confiscar Investimentos dos EUA"
 ARM_seizing_us_investments_desc: "Quaisquer investimentos dos EUA não visam à prosperidade do país anfitrião, mas à receita capitalista das elites dos EUA. Devemos confiscá-los!"
 ARM_stop_military_coop: "Encerrar a Cooperação Militar"
 ARM_stop_military_coop_desc: "Não temos utilidade para a cooperação militar com os fracos americanos."
 ARM_no_more_relations_with_us: "Chega de Relações com os EUA"
 ARM_no_more_relations_with_us_desc: "Não podemos nos permitir ter QUALQUER relação com o país terrorista dos E.U.A."
 ARM_no_more_ngo_funds: "Chega de fundos para ONGs"
 ARM_no_more_ngo_funds_desc: "As ONGs são organizações de espionagem social, que promovem valores que não estão alinhados com nossa agenda. Isso deve parar."
 ARM_anti_nato_propaganda: "Propaganda Contra a OTAN"
 ARM_anti_nato_propaganda_desc: "A OTAN é uma organização imperialista da hegemonia ocidental! Como não contar ao mundo a verdade sobre eles?"
 ARM_combat_us_influence: "Combater a Influência dos EUA"
 ARM_combat_us_influence_desc: "Devemos combater a influência dos EUA em todos os cantos. Da cultura à economia, a presença da América deve ser contida."
 ARM_relations_with_iran: "Relações com o Irã"
 ARM_relations_with_iran_desc: "O Irã é um de nossos vizinhos mais antigos. Chegou a hora de decidir como serão nossas relações no século XXI."
 ARM_close_border_with_iran: "Fechar a Fronteira com o Irã"
 ARM_close_border_with_iran_desc: "Devemos fechar nossa fronteira com o Irã para não permitir mais nenhum comércio com eles."
 ARM_rip_the_trade_agreements: "Chega de Comércio"
 ARM_rip_the_trade_agreements_desc: "Devemos proibir produtos iranianos e cortar quaisquer conexões comerciais entre o Irã e a Armênia."
 ARM_closing_blue_mosque: "Fechar a Mesquita Azul"
 ARM_closing_blue_mosque_desc: "O Irã tem usado a Mesquita Azul como seu centro de influência na Armênia. Devemos acabar com isso."
 ARM_amenia_iran_agen_capt: "Contravigilância Antiiraniana"
 ARM_capture_iranian_agents: "Contravigilância Antiiraniana"
 ARM_capture_iranian_agents_desc: "O Irã pode tentar conspirar contra nós. Devemos estar prontos para tal situação."
 ARM_hez_are_terrorists: "O Hezbollah É Terrorista!"
 ARM_hez_are_terrorists_desc: "O Hezbollah são representantes terroristas do Irã. Devemos condenar sua organização política e sua agenda!"
 ARM_support_pjaks: "Apoiar o Partido da Vida Livre do Curdistão"
 ARM_support_pjaks_desc: "Para conter as ambições iranianas, devemos apoiar organizações separatistas curdas, como o Partido da Vida Livre do Curdistão."
 ARM_post_ussr_partnersh: "Parcerias Pós-URSS"
 ARM_post_ussr_partnersh_desc: "Muitos países com os quais tivemos relações econômicas e políticas na era soviética estão agora bastante distantes de nós. Podemos tentar reconstruir nossas relações."
 ARM_trade_partnership_blr: "Parceria com a Bielorrússia"
 ARM_trade_partnership_blr_desc: "O mercado bielorrusso pode ser muito interessante para nossas empresas, assim como o nosso mercado para eles."
 ARM_trade_partnership_kaz: "Parceria com o Cazaquistão"
 ARM_trade_partnership_kaz_desc: "Nossas relações com o Cazaquistão podem não ser as melhores, mas nossos interesses comerciais comuns e a profunda integração com a Rússia podem favorecer a ambos."
 ARM_trade_partnership_ukr: "Parceria com a Ucrânia"
 ARM_trade_partnership_ukr_desc: "Estabelecer boas relações comerciais com a Ucrânia poderia ser muito benéfico para nós, já que nosso mercado pode ser muito adequado aos produtos deles."
 arme.138.t: "[ARM.GetNameWithFlag] Quer Assinar um Acordo de Cooperação com a UE!"
 arme.138.d: "Recentemente, a Armênia decidiu assinar um acordo de cooperação com a União Europeia. Devemos concordar com a proposta deles?"
 arme.138.a: "Claro!"
 arme.138.b: "Não concordamos?"
 arme.139.t: "[FROM.GetNameWithFlag] Aceita!"
 arme.139.d: "[FROM.GetNameWithFlag] aceitou nossa proposta e o acordo será assinado em breve."
 arme.139.a: "Ótimo!"
 arme.140.t: "[FROM.GetNameWithFlag] Rejeita!"
 arme.140.d: "[FROM.GetNameWithFlag] rejeitou nossa proposta de assinar um acordo de cooperação."
 arme.140.a: "Muito Infeliz."
 arme.141.t: "[ARM.GetNameWithFlag] Quer Aderir ao Plano de Ação Aberta!"
 arme.141.d: "Recentemente, a Armênia demonstrou interesse em aderir ao Plano de Ação Aberta. Os planos de ação visam melhorar a agenda de reformas assumida pelo governo, tornando-as mais transparentes, responsáveis, participativas e inovadoras. Devemos permitir que eles adiram?"
 arme.141.a: "Claro!"
 arme.141.b: "Desculpe, não."
 arme.142.t: "[FROM.GetNameWithFlag] Aceita!"
 arme.142.d: "Eles aceitaram nosso pedido para aderir ao Plano de Ação Aberta, que visa melhorar a agenda de reformas do governo e torná-la mais transparente, responsável, participativa e inovadora."
 arme.142.a: "Ótimo!"
 arme.143.t: "[FROM.GetNameWithFlag] Rejeita!"
 arme.143.d: "[FROM.GetNameWithFlag] rejeitou nossa proposta de aderir ao plano de ação aberto."
 arme.143.a: "Muito lamentável."
 arme.146.t: "Casa Comercial em [ARM.GetNameWithFlag]"
 arme.146.d: "O governo armênio sugere que levemos nossas relações comerciais a um novo patamar. Com a ajuda da empresa Multigroup, o governo armênio está pronto para ceder espaço para a criação de uma casa comercial onde nossos produtos serão apresentados à venda para compradores armênios. Devemos fechar esse acordo?"
 arme.146.a: "Sim"
 arme.146.b: "Não"
 arme.147.t: "Casa Comercial da Bielorrússia na Armênia"
 arme.147.d: "O governo bielorrusso concordou em abrir uma casa comercial para produtos bielorrussos em nosso país"
 arme.147.a: "Ótimo"
 arme.148.t: "Casa Comercial da Bielorrússia na Armênia"
 arme.148.d: "O governo bielorrusso se recusou a abrir uma casa comercial para produtos bielorrussos em nosso país"
 arme.148.a: "Triste"
 arme.159.t: "Discussões sobre a Convenção de Istambul"
 arme.159.d: "Estamos diante da questão de aceitar ou recusar a assinatura dos acordos de Istambul sobre direitos humanos. Este acordo nos aproximará da adesão à União Europeia, mas pode causar descontentamento entre a população."
 arme.159.a: "Vamos assiná-los!"
 arme.159.b: "Não podemos arriscar."
 arme.160.t: "Exercícios Militares Conjuntos com a Armênia"
 arme.160.d: "O governo armênio sugere que nossas forças armadas realizem exercícios militares conjuntos para compartilhar experiência e habilidades, melhorar a coordenação entre nossas forças armadas e fortalecer as relações amistosas entre os dois países."
 arme.160.a: "Concordamos"
 arme.160.b: "Não"
 arme.161.t: "Exercícios Militares Conjuntos com [FROM.GetName]"
 arme.161.d: "O governo deles concordou em realizar exercícios conjuntos com nossas forças armadas."
 arme.161.a: "Ótimo"
 arme.162.t: "Exercícios Militares Conjuntos com [FROM.GetName]"
 arme.162.d: "O governo deles se recusou a realizar exercícios conjuntos com nossas forças armadas."
 arme.162.a: "Triste"
 arme.166.t: "[ARM.GetNameWithFlag] Propõe Tratado Científico!"
 arme.166.d: "Recentemente, o governo armênio nos ofereceu um tratado de intercâmbio científico mútuo, potencialmente benéfico para ambas as partes. Devemos aceitar a proposta?"
 arme.166.a: "Claro!"
 arme.166.b: "Sinto muito, não."
 arme.167.t: "[KAZ.GetNameWithFlag] Aceita!"
 arme.167.d: "O Cazaquistão aceitou nosso tratado científico e agora ambos os lados começarão a se beneficiar dele."
 arme.167.a: "Ótimo!"
 arme.168.t: "[KAZ.GetNameWithFlag] Rejeita!"
 arme.168.d: "O Cazaquistão rejeitou nossa proposta de tratado, vendo-a como uma espécie de armadilha que os colocaria em posição pior."
 arme.168.a: "O-o quê?"
 arme.169.t: "[ARM.GetNameWithFlag] Propõe Cooperação Empresarial!"
 arme.169.d: "Recentemente, o governo armênio, por meio de conexões da diáspora na Ucrânia, entrou em contato para propor um acordo comercial mutuamente benéfico. Devemos aceitar?"
 arme.169.a: "Claro!"
 arme.169.b: "Não."
 arme.170.t: "[UKR.GetNameWithFlag] Aceita!"
 arme.170.d: "A Ucrânia aceitou nosso tratado comercial e agora ambos os lados começarão a se beneficiar dele."
 arme.170.a: "Ótimo!"
 arme.171.t: "[UKR.GetNameWithFlag] Rejeita!"
 arme.171.d: "A Ucrânia rejeitou nossa proposta comercial, vendo-a como uma espécie de armadilha que os colocaria em posição pior."
 arme.171.a: "O-o quê?"
 arme.172.t: "Brigada de Voluntários Armênios"
 arme.172.d: "Recentemente, com o apoio da diáspora armênia e do governo armênio, armênios locais de Rojava se juntaram à nossa luta contra a opressão turca e islamista. Agora fazem parte do Exército de Libertação dos Trabalhadores e Camponeses da Turquia (TİKKO) e das Forças Democráticas Sírias. A brigada declarou que seus objetivos são defender os armênios da Síria, o idioma, a cultura e todos os povos da Administração Autônoma do Norte e Leste da Síria contra o Estado Islâmico do Iraque e do Levante (EIIL) e o Estado turco, que ela descreveu como os atuais representantes do fascista Comitê União e Progresso."
 arme.172.a: "Ótimo!"
 arme.173.t: "Estados Unidos da Armênia"
 arme.173.d: "Nosso país entrou em uma nova etapa de seu desenvolvimento histórico! Agora estamos prontos para anunciar a criação dos Estados Unidos da Armênia! Nosso Estado se expandiu até fronteiras dignas desse nome. Nos tornaremos guardiões da paz e da democracia em todo o Cáucaso, e talvez além."
 arme.173.a: "Ótimo!"
 ARM_kaz_scienc_part: "Parceria Científica com o Cazaquistão"
 ARM_kaz_scienc_part_desc: "Podemos oferecer ao Cazaquistão um tratado científico mutuamente benéfico."
 ARM_diasp_ukr: "Conexões na Ucrânia"
 ARM_diasp_ukr_desc: "A diáspora armênia na Ucrânia é substancial. Podemos aproveitar nossas conexões lá para encontrar um acordo mutuamente benéfico."
 ARM_ukraine_cooperation_idea: "Acordo [ARM.GetNameWithFlag] - [UKR.GetNameWithFlag]"
 ARM_reach_out_baltics: "Aproximar-se dos Bálticos"
 ARM_reach_out_baltics_desc: "Devemos nos aproximar dos Estados bálticos e normalizar nossas relações com eles, considerando nossos laços históricos."
 ARM_gods_land: "Terra de Deus"
 ARM_gods_land_desc: "A Terra Santa tem hoje enorme importância não apenas por sua relevância religiosa, mas também pela rivalidade geopolítica que ocorre ali."
 ARM_arm_quart_partnership: "Parceria do Bairro Armênio"
 ARM_arm_quart_partnership_desc: "A Igreja Apostólica Armênia é famosa por controlar quase totalmente o local sagrado do túmulo de Jesus. Além disso, o Bairro Armênio de Jerusalém tem muita influência na cidade. Devemos aproveitar esses fatores."
 ARM_recog_palest: "Reconhecer a Palestina"
 ARM_recog_palest_desc: "Israel demonstrou hostilidade suficiente contra nós para que agora compreendamos a luta da causa palestina. Devemos reconhecer a Palestina para mostrar nossa posição."
 ARM_support_israel: "Apoiar Israel"
 ARM_support_israel_desc: "Israel demonstrou boa vontade em cooperar conosco. Devemos responder a eles de forma adequada, com espírito amistoso."
 ARM_cont_pal_christians: "Apoiar os Cristãos Palestinos"
 ARM_cont_pal_christians_desc: "Devemos apoiar os cristãos palestinos enviando-lhes ajuda humanitária e aumentando os laços com a Igreja Armênia."
 ARM_relat_in_kurdistan: "Aproximar-se do Curdistão"
 ARM_relat_in_kurdistan_desc: "Talvez nossas relações com os curdos não tenham sido totalmente isentas de problemas, mas ambos somos vítimas da opressão turca e, por isso, devemos nos unir."
 ARM_yazidi_repatriation: "Repatriação Yazidi"
 ARM_yazidi_repatriation2: "Repatriação Yazidi"
 ARM_accept_yazidis: "Aceitar os Yazidis"
 ARM_accept_yazidis_desc: "Os yazidis são uma minoria religiosa do Oriente Médio que historicamente teve ótimas relações com os armênios e nunca nos traiu. Devemos aceitar suas organizações na Armênia e fomentar seu renascimento cultural."
 ARM_our_land_their_freedom: "Nossa Terra da Liberdade Deles"
 ARM_our_land_their_freedom_desc: "Devemos aprovar uma lei que reconheça os yazidis como minoria oficial na Armênia e permita que se repatriem plenamente, além de lhes dar assentos no parlamento."
 ARM_yazidis_are_kurds: "Yazidis São Curdos"
 ARM_yazidis_are_kurds_desc: "Não devemos apoiar organizações yazidis, mas sim convidar as curdas a apoiar a identidade curda entre os yazidis."
 ARM_support_barzani_ambitions: "Apoiar as Ambições Curdas"
 ARM_support_barzani_ambitions_desc: "Apesar de os curdos povoarem antigos territórios armênios, devemos, ainda assim, apoiá-los contra a Turquia."
 ARM_support_nubar_ozanian: "Apoiar os Armênios em Rojava"
 ARM_support_nubar_ozanian_desc: "Recentemente, os curdos de Rojava iniciaram sua luta contra os islamistas e os invasores turcos. Devemos apoiar sua causa."
 ARM_ministry_of_external_category: "Governo da Armênia"
 ARM_ministry_of_external_category_desc: "O £text_icon_armgovern §YGoverno armênio§! terá de executar diversas §Yações de política interna e externa§! para sobreviver, prosperar e expandir sua influência.\n\nA mecânica de §Gintegração de novos territórios§! exige que seu §Yregime político§! tenha §Oreivindicações sobre certos territórios§!. Nem todos os territórios estão disponíveis para integração para todos os partidos políticos.\n\nAs decisões relacionadas à §YDiáspora Armênia§! estão disponíveis enquanto você tiver o §Yespírito nacional§! correspondente."
 ARM_integration_new_lands: "§YIntegração§! de Novos Territórios"
 ARM_new_crusade_israel: "Iniciar a §YCruzada§! pelo §Y[ISR.GetFlag]Reino de Jerusalém§!"
 ARM_new_crusade_hazbik: "Iniciar a §YCruzada§! pelo §Y[LEB.GetFlag]Ducado de Antioquia§!"
 ARM_new_crusade_palestine: "Iniciar a §YCruzada§! por §Y[PAL.GetNameWithFlag]§!"
 ARM_italy_reclamation: "Iniciar a §GUnificação§! com §Y[ITA.GetNameWithFlag]§!"
 ARM_new_decision_govern_unlock_tt: "£text_icon_armgovern §YGoverno da Armênia§!: §YDesbloqueia§! Novas Decisões"
 integr_stuff_tt: "Esta §YDecisão§! Nos Permitirá §GIntegrar§! Vários §GTerritórios§! se Nosso £text_icon_armgovern §YRegime Político§! Permitir!\nFique atento ao nível de conformidade, algumas regiões podem se rebelar contra sua ocupação."
 ARM_United_States: "Estados Unidos da Armênia"
 ARM_veter_must_rule: "Democracia da Nação"
 ARM_veter_must_rule_desc: "Os valores ocidentais e a abordagem democrática não fazem sentido se tivermos de fechar os olhos para quem são os armênios e quais são nossos interesses nacionais. Os veteranos devem liderar nossa nação, mesmo que queiramos uma democracia verdadeira."
 ARM_request_support_us: "Legião Armênia da América"
 ARM_request_support_us_desc: "A Legião Armênia da América é uma organização que reúne armênios que serviram nas forças armadas dos EUA no passado. A Legião pretende lutar contra os inimigos do povo armênio. A organização também tem pequenas equipes especiais de cinco homens que recebem treinamento secreto sob a orientação de ex-oficiais do Corpo de Fuzileiros Navais dos EUA. Já há mais de mil combatentes na Legião Armênia, jovens de origem armênia. Devemos apoiar sua causa e incluí-los como um ramo militar."
 ARM_staunch_western_position: "Espinho no Calcanhar"
 ARM_staunch_western_position_desc: "Para que a Armênia se torne verdadeiramente forte e independente, precisamos esquecer a cooperação estreita com a Rússia e nos concentrar exclusivamente nos parceiros ocidentais."
 ARM_against_euroscepticism: "Contra o Euroceticismo"
 ARM_against_euroscepticism_desc: "A Rússia é uma ameaça. Essa é a visão unânime de nosso governo. É hora de agir e aprofundar nosso envolvimento com a OTAN. Como benefício adicional, isso tornará muito mais difíceis os esforços da Turquia para nos minar."
 ARM_nato_weapon: "Apoio Militar da OTAN"
 ARM_nato_weapon_desc: "Precisamos urgentemente reequipar nosso exército e, agora, como membros da OTAN, estamos prontos para recorrer a outros membros da organização para resolver essa questão."
 ARM_plant_radicalism: "Ocidentalismo Radical"
 ARM_plant_radicalism_desc: "A cultura europeia e o modelo econômico ocidental são o que a Armênia deve almejar. Esse é o ideal que, infelizmente, se afastou de nossa última fronteira da civilização europeia."
 ARM_first_war_glorify: "Glorificação da Primeira Guerra de Artsakh"
 ARM_first_war_glorify_desc: "Devemos glorificar a guerra em Artsakh para impulsionar nossos sentimentos nacionais e patrióticos!"
 ARM_fight_for_freedom: "Lutar pela Liberdade"
 ARM_fight_for_freedom_desc: "Nossa luta não é apenas nacionalista em essência. Lutamos também por direitos, liberdade e dignidade!"
 ARM_ecommerce_init: "Iniciativas de Comércio Eletrônico"
 ARM_ecommerce_init_desc: "Devemos apoiar o comércio eletrônico e a digitalização das estruturas do governo."
 ARM_fourth_rev_stnd: "Padrões da 4ª Revolução"
 ARM_fourth_rev_stnd_desc: "Nosso movimento é uma nova revolução, uma evolução dos valores nacionais e democráticos, que deve estabelecer novos padrões para todos os armênios."
 ARM_new_nuclear_plants: "Novas Usinas Nucleares"
 ARM_new_nuclear_plants_desc: "Devemos depender da energia nuclear, pois é a única maneira de nosso país produzir mais e ser capaz de competir no mercado global."
 ARM_no_more_kgb: "Chega de Influência da KGB"
 ARM_no_more_kgb_desc: "Agentes da KGB conspiram contra nosso país há tempo demais, disfarçados de diversos influenciadores e ativistas políticos. Eles estão até no nosso parlamento! Devemos acabar com isso."
 ARM_ally_ukr_blr: "Aliar Movimentos Amigos"
 ARM_ally_ukr_blr_desc: "Muitos movimentos na Ucrânia e na Bielorrússia têm as mesmas ideias que nós. Devemos apoiá-los em nossa resistência coletiva à Rússia."
 ARM_no_more_colony: "Chega de Domínio Colonial!"
 ARM_no_more_colony_desc: "A Rússia nos controla há tempo demais! Devemos acabar com essa exploração colonialista!"
 ARM_new_sparapet_pavel: "Novo Sparapet"
 ARM_new_sparapet_pavel_desc: "Pavel Manukyan provou seu valor para ser o Sparapet de nosso novo e poderoso país!"
 ARM_like_sassoun_daredevils: "Como os Destemidos de Sassoun"
 ARM_like_sassoun_daredevils_desc: "Devemos seguir o exemplo de nossa gloriosa epopeia e nos unir como nação em nosso espírito popular!"
 ARM_investig_milit: "Investigar os Militares"
 ARM_investig_milit_desc: "Os militares devem ser investigados para eliminar toda a corrupção."
 ARM_heroes_need_heroes: "Heróis Precisam de Heróis"
 ARM_heroes_need_heroes_desc: "Heróis de fato precisam de heróis! Toda a nossa nação, homens e mulheres, velhos e jovens, deve estar pronta para lutar por nossa causa."
 ARM_armenia_zhirayr_idea: "Armênia Radicalmente Pró-Ocidental"
 ARM_zhirayr_veterans_idea: "Veteranos no Poder"
 ARM_zhirayr_pro_western_position_idea: "Posição Radicalmente Pró-Ocidental"
 ARM_zhirayr_no_russian_idea: "Política Antirrussa"
 ARM_zhirayr_in_blr_ukr_idea: "Influência Armênia"
 ARM_zhirayr_radicalism_idea: "Radicalismo Político"
 ARM_zhirayr_first_armenia_war_idea: "A Glória da Primeira Guerra"
 ARM_zhirayr_fight_freedom_idea: "A Luta pela Liberdade"
 ARM_zhirayr_heroes_idea: "Heróis Precisam de Heróis"
 ARM_zhirayr_e_commerce_idea: "TI Radical"
 ARM_zhirayr_4th_idea: "A Quarta Revolução"
 ARM_zhirayr_sassoun_idea: "Guerreiros de Sassoun"
