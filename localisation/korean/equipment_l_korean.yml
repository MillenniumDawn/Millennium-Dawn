 util_vehicle_type: "Utility Vehicle"
 util_vehicle_type_desc: "A utility vehicle, generally motorized, that is designed to carry out a specific task with more efficacy than a general-purpose vehicle."
 util_vehicle_8: "Utility Vehicle 2035"
 util_vehicle_8_desc: "Utility Vehicles are the vehicles employed by Motorized Infantry Forces as transports to the battlefield. The earlier generation models, jeeps and trucks, are virtually unarmored and differ mainly from their civilian counterparts by being more rugged and having greater mobility in difficult terrain. Later generation models feature Humvee-like vehicles with better armor, and mine-resistant vehicles with further improvements in crew protection. If the vehicles are armed at all, it's usually lighter weaponry, such as machine guns."
 attack_helicopter_1: "Attack Helicopter 1965"
 attack_helicopter_1_desc: "An attack helicopter is a military helicopter equipped with offensive weapons. Its main weapons are rapid-fire automatic weapons (cannons and machine guns), rocket launchers, and precision-guided weapons (missiles). Many attack helicopters can also be equipped with anti-aircraft missiles, but they are mainly used for self-defense. Today's attack helicopters are similar in function to fixed-wing attack aircraft and are specifically designed to attack ground targets such as infantry, armored vehicles, and buildings."
 attack_helicopter_2: "Attack Helicopter 1985"
