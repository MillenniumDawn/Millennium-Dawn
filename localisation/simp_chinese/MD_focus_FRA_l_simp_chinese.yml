 FRA_dismantle_terror_networks: "Dismantle Terror Networks"
 FRA_dismantle_terror_networks_desc: "Launch a comprehensive, year-long operation to identify and dismantle terrorist cells operating within France. This requires strong intelligence capabilities, adequate police funding, and domestic stability."
 FRA_terror_level_3: "Terror Threat at Maximum Level"
 FRA_major_terror_attack: "A Major Terrorist Attack Has Occurred"
 FRA_infrastructure_secured: "Critical Infrastructure Already Secured"
 FRA_sentinelle_active: "Operation Sentinelle Already Deployed"
 FRA_recent_terror_attack: "A Terrorist Attack Occurred Recently"
 FRA_start_election: "An Election Cycle Has Been Triggered"
 FRA_LFI_CREATED: "La France Insoumise Has Been Founded"
 FRA_allowed_extremists_right: "The Far Right Was Allowed to Operate Freely"
 FRA_crackdown_extremists_right: "The Far Right Was Suppressed"
 FRA_monarchists_won_coup: "The Monarchists Won the Coup"
 FRA_bonapartists_won_coup: "The Bonapartists Won the Coup"
 FRA_allowed_extremists_left: "The Far Left Was Allowed to Operate Freely"
 FRA_crackdown_extremists_left: "The Far Left Was Suppressed"
 FRA_coup_by_extremists_left: "The Far Left Seized Power"
 france_md.600.t: "The Chip Business Alcatel No Longer Wants"
 france_md.600.d: "The telecom bubble has burst and Alcatel is selling everything that is not a network. Its microelectronics division is profitable, competent and about to belong to somebody else. Keeping it French would cost the Treasury real money to solve a problem the market does not think it has."
 france_md.600.a: "Keep the microelectronics arm in French hands"
 france_md.600.a_bonus: "Retained Semiconductor Division"
 france_md.600.b: "Let it go to a European buyer"
 france_md.600.b_bonus: "Consolidated European Silicon"
 france_md.601.t: "The Credit Wall"
 france_md.601.d: "France Telecom owes more than any company has ever owed, the acquisitions that built the debt are worth a fraction of what was paid, and the banks will not roll it over again. The state can put public money into a listed company, or it can let the creditors decide what the national operator becomes."
 france_md.601.a: "Recapitalise the operator with public money"
 france_md.601.a_bonus: "State Capitalised Network Operator"
 france_md.601.b: "Let the creditors restructure it"
 france_md.601.b_bonus: "Creditor Led Restructuring"
 france_md.602.t: "The State Loses Its Majority"
 france_md.602.d: "Selling below fifty percent would raise a great deal of money and end the argument in Brussels about a state-owned incumbent competing in an open market. It would also mean that the next decision about France's telephone network is taken by shareholders."
 france_md.602.a: "Hold the state majority"
 france_md.602.a_bonus: "Public Majority Ownership"
 france_md.602.b: "Sell below fifty percent"
 france_md.602.b_bonus: "Privatised Network Operator"
 france_md.603.t: "After Crolles2"
 france_md.603.d: "The shared alliance at Crolles gave three companies a leading-edge process none of them could have afforded alone, and two of them are now leaving. Funding the replacement means the state carrying a research programme that its partners walked away from. Refusing means one French company develops the node by itself, or stops trying."
 france_md.603.a: "Fund what replaces the alliance"
 france_md.603.a_bonus: "Shared Process Development"
 france_md.603.b: "Let the national champion carry it alone"
 france_md.603.b_bonus: "Independent Process Roadmap"
 france_md.604.t: "Unwinding ST-Ericsson"
 france_md.604.d: "The European wireless champion has lost money every quarter of its existence, and the customers it was built to serve now design their own silicon. Rescuing it would buy time for a business whose market has already moved. Unwinding it writes off the last serious European attempt at a mobile chipset."
 france_md.604.a: "Rescue the wireless venture"
 france_md.604.a_bonus: "European Wireless Silicon"
 france_md.604.b: "Unwind it and take the losses"
 france_md.604.b_bonus: "Portfolio Rationalisation"
 france_md.605.t: "The Microelectronics IPCEI"
 france_md.605.d: "Brussels will permit what it once forbade: public money, at scale, for semiconductor capacity. Crolles could be expanded into something that matters to the continent rather than to one company. It is a subsidy race France did not start and cannot win alone, and the alternative is not competing in it."
 france_md.605.a: "Fund the Crolles expansion"
 france_md.605.a_bonus: "Sovereign Fabrication Capacity"
 france_md.605.b: "Leave capacity to the market"
 france_md.605.b_bonus: "Market Led Capacity"
 france_md.606.t: "What the Republic Kept"
 france_md.606.d: "A quarter century of rescues, sales, alliances and subsidies has settled which parts of France's telephone network and semiconductor industry the state still owns, and which it merely hosts."
 france_md.606.a: "A champion the Republic still owns"
 france_md.606.b: "A silicon base built with public money"
 france_md.606.c: "An operator the state once rescued"
 france_md.606.e: "A market like any other"
 FRA_cs_nationalised_systems_champion: "Nationalised Systems Champion"
 FRA_cs_nationalised_systems_champion_desc: "The state never let go of the majority, so the network and the industry around it answer to Paris before they answer to a share price. It costs the Treasury what a controlling stake always costs, and it buys decisions that stay in the country."
 FRA_cs_state_backed_silicon_base: "State Backed Silicon Base"
 FRA_cs_state_backed_silicon_base_desc: "Public money built fabrication capacity that no French company would have financed on its own, and the wafers are made in France. The subsidy is permanent because the capacity is, and both are now facts on the ground rather than arguments."
 FRA_cs_recapitalised_national_operator: "Recapitalised National Operator"
 FRA_cs_recapitalised_national_operator_desc: "The state put its money in when nobody else would and the operator survived a debt no company should have carried. It was a rescue rather than a structure, and rescues do not last."
 FRA_cs_market_like_any_other: "A Market Like Any Other"
 FRA_cs_market_like_any_other_desc: "The champions were sold, merged or wound up on ordinary commercial terms, and France buys its networks and its chips from whoever sells them best. It is efficient, it is orthodox, and nothing strategic is decided here any more."
 France_news.100.t1: "Red Flags Over the Élysée"
 France_news.100.d1: "French state television went dark before dawn. When it returned, the studio was held by men in fatigues reading a communiqué from a body calling itself the Committee of Public Safety. Armour rings the Élysée and the Assemblée Nationale, and no minister of the Fifth Republic has been seen since midnight. Brussels has called an emergency session and Washington has ordered its embassy staff to shelter in place."
 France_news.100.t2: "Paris Falls to the Traditionalists"
 France_news.100.d2: "Gendarmerie units loyal to the traditionalist networks moved on the government quarter overnight and met no resistance from an army command that had plainly been told to stand aside. By morning the tricolour over the Élysée flew beside banners no French government has tolerated since 1944. The Republic's institutions are suspended pending what the plotters call a national restoration."
 France_news.100.a: "The Fifth Republic is finished."
 France_news.100.b: "Europe cannot let this stand."
 France_news.100.c: "France has buried another republic."
 France_news.101.t: "France Goes to the Polls"
 France_news.101.d: "Polling stations opened across France this morning for the first round of the presidential election. Turnout is forecast to be dismal: a left split four ways, a right divided between the Republicans and the sovereignists, and a National Front the commentariat has spent the whole campaign refusing to discuss. The second round is a fortnight away, and for once nobody in Paris will say who reaches it."
 France_news.101.a: "The runoff is ours to lose."
 France_news.101.b: "Paris bears watching."
 France_news.102.t1: "Revolutionary Cells Rounded Up"
 France_news.102.d1: "Coordinated raids by the DGSI and the GIGN broke the radical networks before first light. Cell leaders were taken from their flats in Saint-Denis and Villeurbanne, weapons caches were seized in three departments, and the party apparatus they had spent two years infiltrating has been purged. The government insists the Republic was never in danger. The arrest warrants say otherwise."
 France_news.102.t2: "Restorationist Plot Broken Up"
 France_news.102.d2: "Coordinated raids by the DGSI and the GIGN broke the traditionalist networks before first light. Action Française organisers were taken from their homes, arms caches were seized in three departments, and the officers who had promised the plotters the army's silence now face a military tribunal. The Fifth Republic has survived its closest call in forty years."
 France_news.102.a: "The Republic holds."
 France_news.102.b: "A relief, and a warning."
 FRA_cfa_franc_user_exists_tt: "At least one nation still uses the §YCFA Franc§!"
 FRA_eco_candidate_exists_tt: "At least one nation still uses the §YCFA Franc§! or the §YCFA Franc (Central Africa)§!"
 france_md.554.t: "France Proposes Joint Military Exercises"
 france_md.554.d: "French diplomats have sent us a proposal for joint military training. Indeed, the recent rise in international tensions encourages us to unite among European states to prepare for the worst. This could be a very good initiative to train our armed forces for the high-intensity conflicts that could erupt at any moment. What should we tell them?"
 france_md.554.a: "With pleasure, we will train alongside them"
 france_md.554.b: "No thank you, we don't need their help"
 france_md.359.t: "Monarchists Seize Power in France"
 france_md.359.d: "Shocking news from [FRA.GetNameWithFlag]: extremist factions within the ruling party have seized control and abolished the Fifth Republic. The moderate leadership has been sidelined as radicals restore monarchist rule. This dramatic coup against democracy has shocked the world. How should we respond ?"
 france_md.359.a: "Condemn this extremist takeover"
 france_md.359.b: "This is an internal French matter"
 FRA_country_chaos: "Alarming Rumours"
 FRA_country_chaos_desc: "A wave of panic has swept across the country. Rumors are circulating about looted weapons depots and mass desertions. Something is brewing..."
 FRA_too_stable_tt: "§YStability below 25%§! grants the maximum party popularity increase"
 FRA_too_europhile_tt: "§YEuropeanism below 50%§! grants the maximum party popularity increase"
 FRA_napoleon_army_reform_tt: "Grande Armée reforms completed: §Y[?FRA_grande_armee_reforms_completed|0]/3§!"
 FRA_6threp_tt: "In the upcoming events, you'll draft a constitution, which you may or may not end up with at the end of the process. Don't forget to hurry before the excitement dies down"
 FRA_corporate_systems_ambition_ft_restructuring: "Ambition FT 2005 Restructuring"
 FRA_corporate_systems_ambition_ft_restructuring_desc: "Recapitalization, divestment, and operating reforms are repairing France Télécom's balance sheet. Network investment remains constrained while the group restores cash flow."
 FRA_corporate_systems_french_national_champions: "French National Champions"
 FRA_corporate_systems_french_national_champions_desc: "France has kept critical companies, research sites, and infrastructure under strong national direction. Sovereignty and resilience are high, but the model demands sustained public support and accepts less foreign integration."
 FRA_corporate_systems_china_connected_infrastructure: "China-Connected Infrastructure"
 FRA_corporate_systems_china_connected_infrastructure_desc: "Chinese suppliers have become central to France's network modernization. Rapid deployment and closer commercial ties come with lasting dependence in critical infrastructure and higher replacement risks."
 FRA_corporate_systems_resilient_multivendor_network: "Resilient Multivendor Network"
 FRA_corporate_systems_resilient_multivendor_network_desc: "France has distributed critical network procurement across several suppliers and preserved the ability to replace any one of them. The result is less concentrated and more resilient, though coordination and deployment are slower."
 FRA_corporate_systems_events.1.a: "Restructure aggressively"
 FRA_corporate_systems_events.1.a_tt: "Alcatel Health: §G+0.8§!\nCorporate Debt Pressure: §G-0.6§!\nStability: §R-1.0%§!\nGain §YTelecom Crash Restructuring§! for §Y730 days§!.\nGain one §G5%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.1.b: "Protect strategic R&D"
 FRA_corporate_systems_events.1.b_tt: "Political Power: §R-75§!\nStrategic Sovereignty: §G+0.4§!\nAlcatel Health: §G+0.6§!\nGain one §G5%§! research bonus for §YCommand and Control Equipment§!."
 FRA_corporate_systems_events.1.c: "Hold the line"
 FRA_corporate_systems_events.1.c_tt: "Alcatel Health: §R-1.0§!\nCorporate Debt Pressure: §R+0.8§!\nStability: §G+0.5%§!"
 FRA_corporate_systems_events.1.d: "The collapse of the telecom equipment boom has left Alcatel with falling orders, excess capacity, and mounting losses. The company must decide what to preserve as it restructures."
 FRA_corporate_systems_events.1.t: "The Telecom Bubble Breaks"
 FRA_corporate_systems_events.10.a: "Acquire the entire business"
 FRA_corporate_systems_events.10.a_tt: "Strategic Sovereignty: §G+0.2§!\nSemiconductor Capacity: §G+0.4§!\nSTMicroelectronics Health: §G+0.5§!\nGain one §G10%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.10.b: "Acquire strategic IP and assets"
 FRA_corporate_systems_events.10.b_tt: "Semiconductor Capacity: §G+0.2§!\nSTMicroelectronics Health: §G+0.3§!\nGain one §G5%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.10.c: "Decline the acquisition"
 FRA_corporate_systems_events.10.c_tt: "STMicroelectronics Health: §G+0.2§!"
 FRA_corporate_systems_events.10.d: "Alcatel's restructuring has placed the future of its microelectronics assets in question. STMicroelectronics can pursue the entire business, target only strategic technology, or preserve capital for other priorities."
 FRA_corporate_systems_events.10.t: "Alcatel Microelectronics Is for Sale"
 FRA_corporate_systems_events.11.a: "Expand the multinational R&D alliance"
 FRA_corporate_systems_events.11.a_tt: "Strategic Sovereignty: §R-0.1§!\nSemiconductor Capacity: §G+0.6§!\nGain 2 §G10%§! research bonuses for §YMicrochip Technology§!."
 FRA_corporate_systems_events.11.b: "Build a French-led program"
 FRA_corporate_systems_events.11.b_tt: "Political Power: §R-75§!\nStrategic Sovereignty: §G+0.5§!\nSemiconductor Capacity: §G+0.4§!\nGain one §G10%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.11.c: "Limit our capital exposure"
 FRA_corporate_systems_events.11.c_tt: "Semiconductor Capacity: §G+0.1§!\nSTMicroelectronics Health: §G+0.2§!"
 FRA_corporate_systems_events.11.d: "Motorola is ready to join STMicroelectronics and Philips at Crolles2, widening the alliance around advanced process development. Greater scale would spread costs and expertise, but it would also dilute purely French control."
 FRA_corporate_systems_events.11.t: "The Crolles2 Alliance Expands"
 FRA_corporate_systems_events.13.a: "Consolidate wireless with NXP"
 FRA_corporate_systems_events.13.a_tt: "Semiconductor Capacity: §G+0.5§!\nSTMicroelectronics Health: §G+0.2§!\nCorporate Debt Pressure: §R+0.3§!\nGain one §G10%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.13.b: "Keep ST wireless independent"
 FRA_corporate_systems_events.13.b_tt: "Strategic Sovereignty: §G+0.3§!\nSTMicroelectronics Health: §R-0.1§!\nGain one §G5%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.13.c: "Divest wireless exposure"
 FRA_corporate_systems_events.13.c_tt: "Semiconductor Capacity: §R-0.6§!\nSTMicroelectronics Health: §G+0.4§!"
 FRA_corporate_systems_events.13.d: "STMicroelectronics and NXP have agreed to combine their wireless semiconductor activities. The venture offers greater scale in mobile chips, but concentrating two difficult businesses carries substantial execution risk."
 FRA_corporate_systems_events.13.t: "ST-NXP Wireless"
 FRA_corporate_systems_events.14.a: "Form ST-Ericsson"
 FRA_corporate_systems_events.14.a_tt: "European Integration: §G+0.5§!\nSemiconductor Capacity: §G+0.6§!\nCorporate Debt Pressure: §R+0.7§!\nGain 2 §G10%§! research bonuses for §YMicrochip Technology§!."
 FRA_corporate_systems_events.14.b: "Demand tighter financial limits"
 FRA_corporate_systems_events.14.b_tt: "European Integration: §G+0.5§!\nSemiconductor Capacity: §G+0.4§!\nCorporate Debt Pressure: §R+0.3§!\nGain one §G10%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.14.c: "Remain independent"
 FRA_corporate_systems_events.14.c_tt: "Strategic Sovereignty: §G+0.4§!\nEuropean Integration: §R-0.2§!\nSemiconductor Capacity: §R-0.3§!"
 FRA_corporate_systems_events.14.d: "Ericsson Mobile Platforms could join ST-NXP Wireless in a new European joint venture. Combining modem, radio, and application-processor expertise promises technological depth, though the enlarged business could consume substantial capital."
 FRA_corporate_systems_events.14.t: "A European Wireless Champion"
 FRA_corporate_systems_events.16.a: "Conduct an orderly exit"
 FRA_corporate_systems_events.16.a_tt: "Semiconductor Capacity: §R-0.5§!\nSTMicroelectronics Health: §G+0.8§!\nCorporate Debt Pressure: §G-1.0§!\nStability: §R-0.5%§!\nGain §YST-Ericsson Exit Costs§! for §Y730 days§!."
 FRA_corporate_systems_events.16.b: "Absorb technology and personnel"
 FRA_corporate_systems_events.16.b_tt: "Political Power: §R-75§!\nStrategic Sovereignty: §G+0.4§!\nSemiconductor Capacity: §R-0.2§!\nSTMicroelectronics Health: §G+0.3§!\nGain one §G5%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.16.c: "Continue financing the venture"
 FRA_corporate_systems_events.16.c_tt: "Semiconductor Capacity: §G+0.3§!\nSTMicroelectronics Health: §R-0.7§!\nCorporate Debt Pressure: §R+1.2§!"
 FRA_corporate_systems_events.16.d: "ST-Ericsson's persistent losses have exhausted its owners' patience. France must decide how much technology, personnel, and financial risk STMicroelectronics should carry out of the failed venture."
 FRA_corporate_systems_events.16.t: "Unwinding ST-Ericsson"
 FRA_corporate_systems_events.17.a: "Anchor France in the IPCEI"
 FRA_corporate_systems_events.17.a_military: "IPCEI Military Electronics"
 FRA_corporate_systems_events.17.a_tt: "Strategic Sovereignty: §G+0.6§!\nEuropean Integration: §G+1.0§!\nSemiconductor Capacity: §G+0.8§!\nGain 2 §G10%§! research bonuses for §YMicrochip Technology§!.\nGain one §G5%§! research bonus for §YCommand and Control Equipment§!."
 FRA_corporate_systems_events.17.b: "Pursue a France-first program"
 FRA_corporate_systems_events.17.b_tt: "Political Power: §R-125§!\nStrategic Sovereignty: §G+0.9§!\nEuropean Integration: §R-0.5§!\nSemiconductor Capacity: §G+0.6§!\nGain one §G10%§! research bonus for §YMicrochip Technology§!."
 FRA_corporate_systems_events.17.c: "Leave investment to the market"
 FRA_corporate_systems_events.17.c_tt: "Semiconductor Capacity: §R-0.2§!\nSTMicroelectronics Health: §G+0.2§!"
 FRA_corporate_systems_events.17.d: "Five European states have approved a common microelectronics project spanning energy-efficient chips, power semiconductors, sensors, optical systems, and advanced materials. STMicroelectronics can anchor France in the program or pursue a more national path."
 FRA_corporate_systems_events.17.t: "European Microelectronics IPCEI"
 FRA_corporate_systems_events.20.a: "Acquire Orange and internationalize"
 FRA_corporate_systems_events.20.a_tt: "Digital Infrastructure: §G+0.8§!\nFrance Télécom/Orange Health: §G+0.8§!\nCorporate Debt Pressure: §R+1.2§!\nGain one §G5%§! research bonus for §YComputing Technology§!."
 FRA_corporate_systems_events.20.b: "Pursue a smaller mobile strategy"
 FRA_corporate_systems_events.20.b_tt: "Digital Infrastructure: §G+0.4§!\nFrance Télécom/Orange Health: §G+0.4§!\nCorporate Debt Pressure: §R+0.4§!"
 FRA_corporate_systems_events.20.c: "Reject the acquisition"
 FRA_corporate_systems_events.20.c_tt: "Digital Infrastructure: §R-0.7§!\nCorporate Debt Pressure: §G-0.4§!"
 FRA_corporate_systems_events.20.d: "France Télécom has agreed to acquire Orange and its international mobile network. The purchase could transform the public operator into a global telecommunications group, but the price will place heavy pressure on its balance sheet."
 FRA_corporate_systems_events.20.t: "France Télécom Acquires Orange"
 FRA_corporate_systems_events.21.a: "Settle and recognize the losses"
 FRA_corporate_systems_events.21.a_tt: "France Télécom/Orange Health: §R-0.4§!\nCorporate Debt Pressure: §R+0.5§!\nStability: §R-0.5%§!\nGain §YMobilCom Settlement Burden§! for §Y730 days§!."
 FRA_corporate_systems_events.21.b: "Provide state-backed bridge financing"
 FRA_corporate_systems_events.21.b_tt: "Political Power: §R-100§!\nStrategic Sovereignty: §G+0.4§!\nCorporate Debt Pressure: §R+0.2§!\nGain §YMobilCom Settlement Burden§! for §Y365 days§!."
 FRA_corporate_systems_events.21.c: "Contest the liabilities and retrench"
 FRA_corporate_systems_events.21.c_tt: "France Télécom/Orange Health: §R-0.5§!\nCorporate Debt Pressure: §G-0.2§!"
 FRA_corporate_systems_events.21.d: "France Télécom's rapid international expansion has culminated in severe financial exposure around MobilCom. The company must settle the liabilities, seek a state bridge, or risk a prolonged dispute."
 FRA_corporate_systems_events.21.t: "Expansion Reaches the Limit"
 FRA_corporate_systems_events.22.a: "Recapitalize and restore cash flow"
 FRA_corporate_systems_events.22.a_tt: "Political Power: §R-50§!\nFrance Télécom/Orange Health: §G+1.2§!\nCorporate Debt Pressure: §G-1.5§!\nStability: §R-0.5%§!\nGain §YAmbition FT 2005 Restructuring§! for §Y730 days§!."
 FRA_corporate_systems_events.22.b: "Make the state the principal rescuer"
 FRA_corporate_systems_events.22.b_tt: "Political Power: §R-125§!\nStrategic Sovereignty: §G+0.5§!\nFrance Télécom/Orange Health: §G+1.0§!\nCorporate Debt Pressure: §G-1.8§!"
 FRA_corporate_systems_events.22.c: "Avoid dilution and cut investment"
 FRA_corporate_systems_events.22.c_tt: "Digital Infrastructure: §R-0.6§!\nCorporate Debt Pressure: §G-1.0§!\nStability: §R-1.0%§!\nGain §YAmbition FT 2005 Restructuring§! for §Y730 days§!."
 FRA_corporate_systems_events.22.d: "France Télécom has launched Ambition FT 2005 to refinance its debt, restore cash flow, and reinforce the balance sheet. The rescue can combine recapitalization and divestment, rely more heavily on the state, or protect shareholders through deeper cuts."
 FRA_corporate_systems_events.22.t: "Ambition FT 2005"
 FRA_corporate_systems_events.24.a: "Use competitive procurement"
 FRA_corporate_systems_events.24.a_tt: "Digital Infrastructure: §G+0.8§!\nStability: §G+0.5%§!\nGain one §G10%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.24.b: "Favor Alcatel as a supplier"
 FRA_corporate_systems_events.24.b_tt: "Strategic Sovereignty: §G+0.4§!\nTelecom Capacity: §G+0.4§!\nDigital Infrastructure: §G+0.6§!\nAlcatel Health: §G+0.5§!\nGain one §G5%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.24.c: "Source globally for speed"
 FRA_corporate_systems_events.24.c_tt: "Strategic Sovereignty: §R-0.5§!\nDigital Infrastructure: §G+1.0§!\nChinese Vendor Dependency: §R+2§!\nGain one §G5%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.24.d: "Broadband, Wi-Fi, 3G, internet television, and voice services are converging into a single national network market. France Télécom can use competitive procurement, support Alcatel as a strategic supplier, or source globally for maximum speed."
 FRA_corporate_systems_events.24.t: "The Converged Broadband Network"
 FRA_corporate_systems_events.25.a: "Unite the group under Orange"
 FRA_corporate_systems_events.25.a_tt: "Digital Infrastructure: §G+0.1§!\nFrance Télécom/Orange Health: §G+0.5§!\nGain one §G5%§! research bonus for §YComputing Technology§!."
 FRA_corporate_systems_events.25.b: "Preserve France Télécom domestically"
 FRA_corporate_systems_events.25.b_tt: "Strategic Sovereignty: §G+0.2§!\nFrance Télécom/Orange Health: §R-0.3§!"
 FRA_corporate_systems_events.25.c: "Split consumer and strategic brands"
 FRA_corporate_systems_events.25.c_tt: "Strategic Sovereignty: §G+0.1§!\nDigital Infrastructure: §G+0.2§!"
 FRA_corporate_systems_events.25.d: "After more than a decade of integration, France Télécom is ready to adopt Orange as the name of the entire group. A unified global identity offers clarity, though France may preserve a distinct domestic or strategic brand."
 FRA_corporate_systems_events.25.t: "France Télécom Becomes Orange"
 FRA_corporate_systems_events.26.a: "Execute the network investment plan"
 FRA_corporate_systems_events.26.a_tt: "Political Power: §R-50§!\nDigital Infrastructure: §G+1.0§!\nGain one §G5%§! research bonus for §YCommand and Control Equipment§!."
 FRA_corporate_systems_events.26.b: "Accelerate strategic fiber deployment"
 FRA_corporate_systems_events.26.b_tt: "Political Power: §R-100§!\nStrategic Sovereignty: §G+0.3§!\nDigital Infrastructure: §G+1.5§!\nGain one §G10%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.26.c: "Defer capital expenditure"
 FRA_corporate_systems_events.26.c_tt: "Digital Infrastructure: §R-0.5§!\nFrance Télécom/Orange Health: §G+0.2§!"
 FRA_corporate_systems_events.26.d: "Orange has prepared a major investment program for fixed and mobile networks, including an extensive fiber rollout across France. The state can treat this as a commercial buildout, accelerate it as strategic infrastructure, or defer the expense."
 FRA_corporate_systems_events.26.t: "Fiber as National Infrastructure"
 FRA_corporate_systems_events.27.a: "Select Nokia and Ericsson"
 FRA_corporate_systems_events.27.a_tt: "Strategic Sovereignty: §G+0.5§!\nEuropean Integration: §G+0.8§!\nDigital Infrastructure: §G+0.6§!\nChinese Vendor Dependency: §G-1§!\nGain one §G10%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.27.b: "Give Huawei a major role"
 FRA_corporate_systems_events.27.b_tt: "Strategic Sovereignty: §R-0.8§!\nDigital Infrastructure: §G+0.8§!\nChinese Vendor Dependency: §R+5§!\nA 5G authorization event will follow."
 FRA_corporate_systems_events.27.c: "Require a balanced vendor network"
 FRA_corporate_systems_events.27.c_tt: "Strategic Sovereignty: §G+0.1§!\nEuropean Integration: §G+0.3§!\nDigital Infrastructure: §G+0.5§!\nChinese Vendor Dependency: §G-1§!\nGain one §G5%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.27.d: "Orange must select the suppliers for its next-generation mobile network. Nokia and Ericsson offer continuity within Europe's telecom ecosystem, Huawei offers rapid deployment, and a balanced network would avoid reliance on any one vendor."
 FRA_corporate_systems_events.27.t: "Who Builds France's 5G Network?"
 FRA_corporate_systems_events.28.a: "Restrict Huawei authorizations"
 FRA_corporate_systems_events.28.a_tt: "Strategic Sovereignty: §G+0.6§!\nEuropean Integration: §G+0.3§!\nChinese Vendor Dependency: §G-3§!\nGain §Y5G Vendor Replacement Burden§! for §Y730 days§!."
 FRA_corporate_systems_events.28.b: "Permit long-term deployment"
 FRA_corporate_systems_events.28.b_tt: "Strategic Sovereignty: §R-0.5§!\nDigital Infrastructure: §G+0.4§!\nChinese Vendor Dependency: §R+2§!"
 FRA_corporate_systems_events.28.c: "Require rapid vendor diversification"
 FRA_corporate_systems_events.28.c_tt: "Political Power: §R-75§!\nStrategic Sovereignty: §G+0.8§!\nTelecom Capacity: §G+0.5§!\nChinese Vendor Dependency: §G-4§!\nGain §Y5G Vendor Replacement Burden§! for §Y548 days§!."
 FRA_corporate_systems_events.28.d: "French security authorities are reconsidering long-term authorizations for Huawei equipment as the 5G rollout proceeds. Existing deployments could now require costly replacement unless the government accepts a deeper and more durable dependency."
 FRA_corporate_systems_events.28.t: "5G Authorization Pressure"
 FRA_corporate_systems_events.3.a: "Approve the Lucent combination"
 FRA_corporate_systems_events.3.a_tt: "Strategic Sovereignty: §R-0.4§!\nTelecom Capacity: §G+0.6§!\nAlcatel Health: §G+0.7§!\nGain one §G10%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.3.b: "Demand French strategic guarantees"
 FRA_corporate_systems_events.3.b_tt: "Political Power: §R-50§!\nStrategic Sovereignty: §R-0.1§!\nAlcatel Health: §G+0.5§!\nGain one §G10%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.3.c: "Oppose the merger"
 FRA_corporate_systems_events.3.c_tt: "Strategic Sovereignty: §G+0.6§!\nTelecom Capacity: §R-0.2§!\nAlcatel Health: §R-0.5§!"
 FRA_corporate_systems_events.3.d: "Alcatel and Lucent have proposed a transatlantic merger intended to unite their network equipment portfolios. The deal promises scale, but it also raises difficult questions about integration and French strategic control."
 FRA_corporate_systems_events.3.t: "A Transatlantic Telecom Champion?"
 FRA_corporate_systems_events.6.a: "Refocus on IP and broadband"
 FRA_corporate_systems_events.6.a_tt: "Telecom Capacity: §G+0.8§!\nAlcatel Health: §G+1.0§!\nCorporate Debt Pressure: §G-0.5§!\nStability: §R-0.5%§!\nGain §YShift Plan Restructuring§! for §Y730 days§!.\nGain one §G10%§! research bonus for §YInternet Technology§!."
 FRA_corporate_systems_events.6.b: "Build a protected national champion"
 FRA_corporate_systems_events.6.b_tt: "Political Power: §R-125§!\nStrategic Sovereignty: §G+0.8§!\nAlcatel Health: §G+0.7§!\nGain one §G10%§! research bonus for §YCommand and Control Equipment§!."
 FRA_corporate_systems_events.6.c: "Reject further restructuring"
 FRA_corporate_systems_events.6.c_tt: "Alcatel Health: §R-0.9§!\nCorporate Debt Pressure: §R+0.6§!"
 FRA_corporate_systems_events.6.d: "Alcatel-Lucent proposes a decisive refocus on IP networking, cloud systems, and ultra-broadband infrastructure. The plan could restore a viable technology core, but only after another demanding restructuring."
 FRA_corporate_systems_events.6.t: "The Shift Plan"
 FRA_corporate_systems_events.7.a: "Enforce the R&D commitments"
 FRA_corporate_systems_events.7.a_military: "Military R&D Commitments"
 FRA_corporate_systems_events.7.a_tt: "Strategic Sovereignty: §G+0.4§!\nEuropean Integration: §G+0.4§!\nGain one §G10%§! research bonus for §YInternet Technology§!.\nGain one §G5%§! research bonus for §YCommand and Control Equipment§!."
 FRA_corporate_systems_events.7.b: "Allow unrestricted integration"
 FRA_corporate_systems_events.7.b_tt: "Strategic Sovereignty: §R-0.3§!\nAlcatel Health: §G+0.4§!"
 FRA_corporate_systems_events.7.c: "Seek exceptional French control"
 FRA_corporate_systems_events.7.c_tt: "Strategic Sovereignty: §G+0.6§!\nEuropean Integration: §R-0.5§!\nAlcatel Health: §R-0.3§!"
 FRA_corporate_systems_events.7.d: "Nokia now controls Alcatel-Lucent, bringing the former French champion into a larger European network group. France must determine how firmly to enforce commitments on research, employment, and strategic capabilities."
 FRA_corporate_systems_events.7.t: "A French Pillar Inside Nokia"
 FRA_corporate_systems_mobilcom_settlement_burden: "MobilCom Settlement Burden"
 FRA_corporate_systems_mobilcom_settlement_burden_desc: "France Télécom has recognized major liabilities connected to MobilCom and its rapid expansion. The settlement reduces uncertainty, but financing it constrains investment."
 FRA_corporate_systems_shift_plan_restructuring: "Shift Plan Restructuring"
 FRA_corporate_systems_shift_plan_restructuring_desc: "Alcatel-Lucent is concentrating on IP networking, cloud systems, and ultra-broadband infrastructure while cutting costs and selling noncore assets. The transition temporarily constrains output as the company rebuilds its technology portfolio."
 FRA_corporate_systems_telecom_crash_restructuring: "Telecom Crash Restructuring"
 FRA_corporate_systems_telecom_crash_restructuring_desc: "Alcatel is closing facilities and shedding capacity after the telecom equipment market collapsed. The measures ease its longer-term balance-sheet pressure but disrupt industrial output and employment in the short term."
 FRA_corporate_systems_vendor_replacement_burden: "5G Vendor Replacement Burden"
 FRA_corporate_systems_vendor_replacement_burden_desc: "对华为授权的限制正迫使运营商更换已安装设备并重新制定部署计划。这一转变加强了对关键网络的长期管控，但拖慢了部署进度。"
 FRA_corporate_systems_wireless_exit_costs: "意法爱立信退出成本"
 FRA_corporate_systems_wireless_exit_costs_desc: "意法爱立信的解散需要计提减值损失、进行员工转移，以及耗费高昂的技术与资产分割。这一退出消除了长期的财务拖累，但短期内会打乱无线通信领域的研究。"
