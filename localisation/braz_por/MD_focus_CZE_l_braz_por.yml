 CZE_new_fuel_injection_idea: "Nova Injeção de Combustível"
 CZE_volkswagen_group_skoda_idea: "§GŠkoda§! - Grupo Volkswagen"
 CZE_volkswagen_group_skoda_idea_desc: "A Škoda faz parte do Grupo Volkswagen. Ela impulsiona a pesquisa e o desenvolvimento dessa empresa. Estamos felizes que nosso país possa se beneficiar do sucesso deles."
