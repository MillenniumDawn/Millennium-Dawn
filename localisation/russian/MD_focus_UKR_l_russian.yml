 UKR_modernize_su25_m1k: "Дальнейшая модернизация штурмовика §YСу-25М1К§!"
 UKR_modernize_su25_m1k_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1k_for_tooltip\n\n\n\n\n\n\n\n\n§W§YСу-25М1К§! — дальнейшая украинская модификация §Rсоветского§! бронированного дозвукового штурмовика §YСу-25§!, принятая на вооружение Воздушных сил Украины в 2015 году.\nГлавная цель модернизации — повысить живучесть самолёта за счёт установки комбинированной системы отстрела ловушек §Y«Адрос» КУВ 26-50-01§!.§!"
 UKR_developed_su25m1k_flag: " Выполнено решение §YДальнейшая модернизация штурмовика §GСу-25М1К§!§!"
