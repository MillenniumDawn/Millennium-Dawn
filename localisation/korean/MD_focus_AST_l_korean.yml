 boat_arrivals_ast: "최소한의 보트 입국"
 boat_arrivals_ast_desc: "이 문제는 수십 년 동안 우리나라 정부들을 괴롭혀 왔습니다. 줄을 서지 않고 보트 밀입국 등을 통해 입국하려는 이민자들의 입국은 법적으로 승인되지 않았더라도 엄밀히는 범죄가 아닙니다. 이 때문에 이러한 불법 입국자의 처리는 고되고 비용이 많이 드는 일이 되었으며, 쉽게 해결되지 않을 문제입니다."
