 JAP_zombie_obstruction_down_18_tt: "§YObstruction§!: §G-18§!"
 JAP_zombie_obstruction_down_20_tt: "§YObstruction§!: §G-20§!"

 JAP_whistleblower_protection_act: "Whistleblower Protection Act"
 JAP_whistleblower_protection_act_desc: "Auditors can only read what a firm hands them, while the employees know which loans were rolled over and which invoices were backdated. They work for the company they would have to accuse, in a labour market that offers one career and no second chance. A statute making dismissal for disclosure unlawful turns silent witnesses into testifiers."
 JAP_financial_revival_program: "The Financial Revival Program"
 JAP_financial_revival_program_desc: "Banks grade their own borrowers, and the grades hide an inability to pay. The Financial Revival Program applies discounted cash flow assessment to every major exposure, tightens the asset-capital limits, and publishes a target to halve the bad-loan ratio. The business federations will call it a war on industry, and they are not entirely wrong."
 JAP_financial_revival_program_TT: "Opens the §YDaiei§! and §YKanebo§! case files"
 JAP_special_investigation_unit: "Special Investigation Department"
 JAP_special_investigation_unit_desc: "An audit produces a finding, a prosecutor produces a defendant. The Special Investigation Department of the Tokyo District Public Prosecutors Office has broken cabinet ministers and is the one institution a keiretsu board cannot quietly settle with. It is pointed at the balance sheets."
 JAP_special_investigation_unit_TT: "Obstruction now accrues §G25% more slowly§!"
 JAP_the_lost_decade_ends: "The Lost Decade Ends"
 JAP_the_lost_decade_ends_desc: "The register is clean. Credit reaches only the firms that can repay it, because the insolvent were wound up rather than refinanced and their losses were written rather than rolled forward. An economy whose books say what is actually true is the only foundation anything else can be built on."

 JAP_controlled_downsize_TT: "Begins the §Yliquidation wave§!: the zombie firms are wound up over several painful years rather than at a stroke"
 JAP_forced_mergers_TT: "Begins the §Ymerger programme§!: slower, gentler, and it leaves a permanent mark on Japanese industry"

 JAP_liquidation_wave: "The Liquidation Wave"
 JAP_liquidation_wave_desc: "The liquidation is under way. Bankruptcy notices fill the business pages, construction sites stand idle while their developers are wound up, and every household with a mortgage is watching the unemployment figures. The pain is real, and it is temporary.\n-------------\nLifted once §YCorporate Restructuring Progress§! finishes winding down the zombie firms."
 JAP_fusion_restructuring: "Administrative Guidance"
 JAP_fusion_restructuring_desc: "The ministry draws the lines and the banks provide the dowry. Nobody is dismissed, nobody admits failure, and two sales forces that have hated each other for thirty years are told they are now one company. The register grows shorter every quarter. Nothing else about these firms has changed.\n-------------\nLifted once §YCorporate Restructuring Progress§! finishes absorbing the zombie firms."
 JAP_consolidated_conglomerates: "Consolidated Japan Inc."
 JAP_consolidated_conglomerates_desc: "The insolvent names are gone from the register, absorbed rather than wound up. What replaced them are larger groups carrying duplicated factories, duplicated research divisions, and managers who answer to a board that bought them against their will. The state has the national champions it asked for. It also has an industrial base that innovates more slowly than the one it started with."

 JAP_zombie_investigation_category: "The Zombie Firm Investigation"
 JAP_zombie_investigation_category_desc: "Auditors and prosecutors are working through the ledgers of Japan's insolvent borrowers, and the firms are working just as hard to stop them.\n\n§YCase Files§!: [?JAP_zombie_case_files|0] / 8\n§YObstruction§!: [?JAP_zombie_obstruction|0] / 100\n\nEach case below can be prosecuted, quietly rescued, or waved through. Prosecution builds the strongest file and costs you the most with the §Yindustrial conglomerates§!, whose opinion drives real output. Rescues build a thinner file at the taxpayer's expense. Waving a case through builds nothing.\n\nThe report is graded when the investigation closes: §G8 or more§! case files is a full reckoning, §G3 to 7§! a partial report, and anything less a whitewash. §Y$JAP_controlled_downsize$§! requires at least a partial report. §Y$JAP_forced_mergers$§! is always available.\n\n§RObstruction§! rises every month you keep digging, faster the angrier the conglomerates are. At §R30§! the ministry leaks, at §R55§! the business federation issues an ultimatum, and at §R80§! the probe is suspended by scandal. The decisions below push it back down."

 JAP_zombie_investigation_mission: "Conclude the Investigation"
 JAP_zombie_investigation_mission_desc: "The probe cannot run forever. Build a case worth publishing before the political will runs out."
 JAP_zombie_investigation_mission_TT: "Gather at least §Y8 case files§!"
 JAP_keidanren_ultimatum_mission: "The Keidanren Ultimatum"
 JAP_keidanren_ultimatum_mission_desc: "The business federation has told the government, in the politest possible language, that the investigation is damaging confidence and should be wound down. They have given us until the end of the fiscal half to take the hint."
 JAP_keidanren_ultimatum_TT: "Bring §YObstruction§! below §Y45§!"

 JAP_case_ltcb_shinsei: "Case File: The Shinsei Put Option"
 JAP_case_ltcb_shinsei_desc: "The Long-Term Credit Bank was nationalised, cleaned at public expense, and sold to a foreign investment group for a token sum. The contract gave the buyer the right to hand any loan that lost a fifth of its value straight back to the Deposit Insurance Corporation at book price. The new owners are exercising it, and every yen of the loss lands on the taxpayer. Someone in the ministry signed that clause."
 JAP_case_sogo_collapse: "Case File: The Collapse of Sogo"
 JAP_case_sogo_collapse_desc: "The department store chain owes something close to two trillion yen and has not turned a real profit in years. The plan on the ministry's desk is to forgive the public share of the debt and let it trade on. The newspapers have the plan too, and the public reaction to rescuing a retailer while ordinary firms are refused credit has been what anyone could have predicted."
 JAP_case_mycal_bankruptcy: "Case File: Mycal"
 JAP_case_mycal_bankruptcy_desc: "The Osaka supermarket group expanded through the bubble on money its main bank never expected to see returned, and it has spent the years since being refinanced rather than restructured. If it fails it will be the largest retail bankruptcy the country has recorded, and it will take a chain of suppliers in the Kansai down with it."
 JAP_case_resona_injection: "Case File: Resona"
 JAP_case_resona_injection_desc: "The auditors have refused to certify how much of the bank's capital consists of deferred tax assets, which is to say future profits it has no realistic prospect of earning. Without that fiction the bank is undercapitalised. Nearly two trillion yen of public money would make it whole and effectively hand it to the state. Refusing would be the first major bank failure the government has permitted."
 JAP_case_ashikaga_bank: "Case File: The Ashikaga Bank"
 JAP_case_ashikaga_bank_desc: "It is not a national bank. It is the bank of Tochigi, where it holds the accounts of the prefectural government, most of the local firms, and a great many households who have never used another. It is also insolvent. Nationalising it protects the depositors and destroys the shareholders, and every regional lender in the country will read the decision as a statement of intent."
 JAP_case_daiei_ircj: "Case File: Daiei"
 JAP_case_daiei_ircj_desc: "The retailer that taught Japan discount pricing carries debts in the trillions and has been kept upright by banks that cannot afford to admit what the loans are worth. The Industrial Revitalization Corporation can take it over, replace the management, and sell the pieces. The founder's allies in the party would rather it were refinanced one more time."
 JAP_case_kanebo_accounts: "Case File: The Kanebo Accounts"
 JAP_case_kanebo_accounts_desc: "The cosmetics and textiles group has been reporting profits it did not earn for five years, to the order of two hundred billion yen. The fraud is not in dispute. What is in dispute is the accounting firm that signed every one of those statements, and whether a country can have honest ledgers while its auditors answer commercially to the companies they audit."

 JAP_press_the_prosecutors: "Turn the Prosecutors Loose"
 JAP_press_the_prosecutors_desc: "Let the Special Investigation Department make arrests rather than referrals. Nothing quiets a lobbying campaign faster than a director being walked out of his office by men with a warrant."
 JAP_whistleblower_immunity_decision: "Grant Immunity to Informants"
 JAP_whistleblower_immunity_decision_desc: "Offer the middle managers who executed the instructions protection from prosecution in exchange for testimony against the men who gave them. The conglomerates will call it an invitation to betray your colleagues. It is."
 JAP_publish_inspection_manual_decision: "Publish the Inspection Findings"
 JAP_publish_inspection_manual_decision_desc: "Release the supervisory assessments in full rather than summarising them for the ministry. The markets will not enjoy reading them, but a firm cannot lobby against a number the whole country has already seen."
 JAP_cooperating_bank_amnesty_decision: "Amnesty for Cooperating Banks"
 JAP_cooperating_bank_amnesty_decision_desc: "Offer any bank that opens its books voluntarily an assurance that its officers will not be pursued. It buys peace, and it costs the investigation the case it was building against them."

 JAP_zombie_probe_abandoned_TT: "The investigation is §Rcalled off§! and will be published as a whitewash"
 JAP_zombie_whitewash_branch_lost_TT: "A whitewashed report §Rcloses§! the §Y$JAP_controlled_downsize$§! branch and every focus and decision behind it. Only §Y$JAP_forced_mergers$§! remains open."
 JAP_zombie_report_strong_TT: "§GA full reckoning.§! Both resolutions are open, and the wind-down will run §Gfaster§!"
 JAP_zombie_report_partial_TT: "§YA partial report.§! Both resolutions are open"
 JAP_zombie_report_whitewash_TT: "§RA whitewash.§! Only §Y$JAP_forced_mergers$§! remains open, and the wind-down will run §Rslower§!"

 Japan_economy.06.c: "Call the whole thing off"
 Japan_economy.08.b: "Publish what we have"
 Japan_economy.08.c: "Publish it and hope nobody reads past the summary"

 Japan_economy.09.t: "A Leak from the Ministry"
 Japan_economy.09.d: "The firms knew which auditors were coming and on which morning. Filing cabinets were emptied over a weekend, and two directors are suddenly unreachable on business abroad. Somebody in the ministry is telling them, and everyone in this room can guess who, because he was posted here from the bank he is protecting and will be posted back to it when he retires."
 Japan_economy.09.a: "Accept the loss and move on"
 Japan_economy.09.b: "Find him and make an example of him"
 Japan_economy.10.t: "The Federation Issues an Ultimatum"
 Japan_economy.10.d: "The business federation has come to the Diet with figures of its own: investment postponed, hiring frozen, confidence damaged, all of it laid at the door of the investigation. The message under the courtesy is not subtle. Wind this down, or the members of this federation will find they cannot commit to anything while the uncertainty lasts."
 Japan_economy.10.a: "Let them make their case in public."
 Japan_economy.11.t: "The Prosecutor Falls"
 Japan_economy.11.d: "It was not the investigation that failed. It was a lead prosecutor with a golf membership he did not declare, given to him by a firm on his own list, and a newspaper that has photographs of him accepting it. The minister has resigned to take responsibility. The probe is suspended pending review, which everyone understands to mean pending the point at which the public stops paying attention."
 Japan_economy.11.a: "We have lost the initiative."

 Japan_economy.23.t: "The Shinsei Put Option"
 Japan_economy.23.d: "The clause is exactly as reported. Every loan the buyers judge to have lost a fifth of its value goes back to the Deposit Insurance Corporation at the price on the books, and the state absorbs the difference. The bank did nothing illegal. It read the contract more carefully than the officials who wrote it, and those officials are still at their desks."
 Japan_economy.23.a: "Publish the contract and name who signed it"
 Japan_economy.23.b: "Renegotiate quietly and buy out the clause"
 Japan_economy.23.c: "The sale is done. Let it lie."
 Japan_economy.24.t: "The Collapse of Sogo"
 Japan_economy.24.d: "The chain cannot be saved and everyone advising the minister knows it. The only question is whether it is wound up in court, where the creditors and the officials who indulged them will be named in public, or restructured behind closed doors with the public share of the debt quietly forgiven."
 Japan_economy.24.a: "Let it fail in open court"
 Japan_economy.24.b: "Restructure it out of the headlines"
 Japan_economy.24.c: "Forgive the debt and move on"
 Japan_economy.25.t: "Mycal"
 Japan_economy.25.d: "The group's main bank has refinanced it every year since the bubble ended and has now told the ministry it will not do so again. Kansai suppliers who have never dealt with anyone else are already calling their prefectural offices. Whatever is decided this week will be read across the region as a statement about whether the old arrangements still hold."
 Japan_economy.25.a: "Let it go under and audit the bank that carried it"
 Japan_economy.25.b: "Arrange an orderly sale of the profitable stores"
 Japan_economy.25.c: "Lean on the bank for one more year"
 Japan_economy.26.t: "Resona"
 Japan_economy.26.d: "Strip out the deferred tax assets and the capital ratio collapses. The auditors will not sign, which is itself unprecedented, and the government has days rather than weeks. Two trillion yen makes the bank whole and makes the state its owner. Refusal means the first major bank failure the country has allowed since the war, and nobody can say where it stops."
 Japan_economy.26.a: "Inject the funds and remove the entire board"
 Japan_economy.26.b: "Inject the funds and leave the management in place"
 Japan_economy.26.c: "Let the auditors be persuaded"
 Japan_economy.27.t: "The Ashikaga Bank"
 Japan_economy.27.d: "The prefecture's government, its firms, and a great many of its households bank nowhere else. The examiners' finding is unambiguous: the bank is insolvent and has been for some time. Temporary nationalisation protects every depositor and wipes out every shareholder, many of whom are local companies that were required to hold the stock as a condition of their own lending."
 Japan_economy.27.a: "Nationalise it and write the shareholders down to nothing"
 Japan_economy.27.b: "Recapitalise it and keep it in private hands"
 Japan_economy.27.c: "Let the prefecture arrange a rescue merger"
 Japan_economy.28.t: "Daiei"
 Japan_economy.28.d: "The Revitalization Corporation is ready to take it, replace the board, and sell what can be sold. The founder built this company out of the rubble of the war and has friends in the party who remember it. They are asking for one more refinancing, and they are asking loudly."
 Japan_economy.28.a: "Hand it to the Revitalization Corporation"
 Japan_economy.28.b: "Support a negotiated restructuring"
 Japan_economy.28.c: "Grant the refinancing"
 Japan_economy.29.t: "The Kanebo Accounts"
 Japan_economy.29.d: "Two hundred billion yen of profit that was never earned, reported across five years, and signed off every time by the same accounting firm. Prosecuting the company is straightforward. Prosecuting its auditors would tell every accounting firm in Japan that the signature is a liability rather than a formality, and it would make a great many other statements suddenly worth re-reading."
 Japan_economy.29.a: "Prosecute the company and suspend its auditors"
 Japan_economy.29.b: "Delist the company and let the auditors settle"
 Japan_economy.29.c: "Treat it as an isolated failure"
 Japan_economy.30.t: "The Federation Stands Down"
 Japan_economy.30.d: "The pressure has come off. The federation has not withdrawn its objections, but it has stopped briefing against the investigation, and the members who were loudest have gone quiet. It is not agreement. It is a judgement that the fight is no longer worth what it costs them."
 Japan_economy.30.a: "We will take the quiet while it lasts."
 Japan_economy.31.t: "The Federation Makes Good on It"
 Japan_economy.31.d: "Capital spending plans across the member companies have been deferred, and every one of them cites uncertainty. The hiring freeze announced this morning is presented as prudence. The message is unmistakable and it is meant to be, and there is no statute that can compel a company to invest."
 Japan_economy.31.a: "They have made their point."
 Japan_economy.33.t: "The Probe Resumes"
 Japan_economy.33.d: "The review found what reviews find. A new lead has been appointed, the files have been returned, and the investigation resumes with the wind rather more against it than before. The firms have had six months to prepare, and they have used them."
 Japan_economy.33.a: "Begin again."
 Japan_economy.34.t: "The Register Is Clean"
 Japan_economy.34.d: "The last of the insolvent borrowers has been wound up. It took years, and the cost was paid in bankruptcies, in unemployment, and in a government that spent most of its political capital insisting the pain was necessary. What is left behind is an economy where credit goes to firms that can repay it, and where a balance sheet means what it says."
 Japan_economy.34.a: "It was worth the price."
 Japan_economy.35.t: "Nothing Failed"
 Japan_economy.35.d: "The insolvent names are gone from the register. None of them went bankrupt. They were absorbed into larger groups by ministry arrangement, and the larger groups now carry the duplicated plants, the duplicated laboratories, and the staff who were told on a Friday that they worked for a competitor on the Monday. No jobs were lost and nothing was admitted. Japan's industry is consolidated, stable, and slower than it was."
 Japan_economy.35.a: "The arrangement held."
