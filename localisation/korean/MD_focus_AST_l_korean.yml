 AST_befriend_the_west_tt: "국제 임무 탭에서 서방 투자 §2결정§!을 사용할 수 있게 됩니다."
 AST_investment_opportunity_event.1.t: "오스트레일리아와의 투자 제휴"
 AST_investment_opportunity_event.1.d: "오스트레일리아 외교관들이 '오스트레일리아에서 만드는 미래' 구상의 일환으로 자국 산업에 투자할 기회를 제안하러 방문했습니다. 단기적으로 얻을 것은 많지 않지만, 오랜 동맹국과의 관계를 강화하고 태평양에서 우리의 영향력을 넓힐 수 있습니다."
 AST_investment_opportunity_event.1.a: "가치 있는 기회다"
 AST_investment_opportunity_event.1.b: "아니, 사양하겠다."
 AST_investment_opportunity_event.2.t: "투자 협정을 지지하는 [From.GetName]"
 AST_investment_opportunity_event.2.d: "국제 협력을 도모하고자 우리 외교관들을 보냈더니, [From.GetName]이(가) 이 구상에 호의적으로 반응하며 우리나라에 대한 투자를 승인했습니다. 우리의 유대는 세월이 흘러도 약해지지 않은 듯하며, 그들은 우리의 경제 확장을 기꺼이 뒷받침하려 합니다."
 AST_investment_opportunity_event.2.a: "우리 솜씨는 녹슬지 않았다."
 AST_investment_opportunity_event.3.t: "투자 제안을 거절한 [From.GetName]"
 AST_investment_opportunity_event.3.d: "우리의 매력 공세에도 불구하고 [From.GetName]은(는) 당분간 이렇다 할 투자를 제공하지 않겠다며 거절한 듯합니다. 사실 그들과의 유대가 약해지고 있는 것일지도 모릅니다."
 AST_investment_opportunity_event.3.a: "정말 안타깝다."
 AST_investment_opportunity_event.4.t: "긍정적인 성과를 낸 오스트레일리아 투자"
 AST_investment_opportunity_event.4.d: "오스트레일리아 산업에 투자하기로 한 우리의 결정이 결실을 맺은 듯합니다. 그 나라의 경제 성장이 이어지면서 투자가 번창했고, 그 뒤로 우리 지분의 가치가 상당히 높아졌습니다."
 AST_investment_opportunity_event.4.a: "가끔은 보답이 있다."
 AST_usa_investment_request: "미국 대상 투자 요청"
 AST_eng_investment_request: "영국 대상 투자 요청"
 AST_fra_investment_request: "프랑스 대상 투자 요청"
