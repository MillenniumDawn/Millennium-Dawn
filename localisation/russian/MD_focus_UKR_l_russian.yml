 UKR_modernize_mi24pu1_flag: "Выполнено решение §YРазработать модернизацию Ми-24ПУ1§!"
 UKR_modernize_mi24pu2: "Разработать модернизацию §YМи-24ПУ2§!"
 UKR_modernize_mi24pu2_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu2_for_tooltip\n\n\n\n\n\n\n\n\n§W§YМи-24ПУ2§! — более глубокая модернизация §YМи-24ПУ1§! от §LКонотопского авиаремонтного завода «Авиакон»§!. Она добавляет §Yфранцузское§! прицельное оборудование и приборы ночного видения, улучшенный комплекс самозащиты и противотанковые управляемые ракеты §Y«Барьер-В»§! от §LКБ «Луч»§!.\n------------------\nФранцузское оборудование доступно, только пока у §Y[FRA.GetNameWithFlag]§! хорошее мнение о нас.§!"
 UKR_develop_domestic_atgm_category: "Разработать отечественные ПТУР"
 UKR_develop_domestic_atgm_category_desc: "\n\n\n\n\n\n£UKR_desctext_atgm_main\n\n\n\n\n\n\n\n\nМы можем вложить время и ресурсы в разработку и модернизацию отечественных противотанковых ракетных комплексов вместе с киевским §LКБ «Луч»§!."
 UKR_develop_domestic_atgm_barrier: "Разработать ПТУР §Y«Барьер»§!"
 UKR_develop_domestic_atgm_barrier_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_barrier_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Барьер»§! — §Y[ROOT.GetFlag]украинская§! противотанковая управляемая ракета, разработанная §LКБ «Луч»§! для бронетехники и вертолётов.\nЕё 130-мм ракета с наведением по лазерному лучу и тандемной боевой частью предназначена для поражения бронированных целей с динамической защитой (ДЗ) на дальности до 5 километров.\n------------------\nЭто решение — §Rобязательное условие§! для открытия всех остальных решений этой категории техники и для модернизации §YМи-24ПУ2§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить их.§!"
 UKR_develop_domestic_atgm_barrier_flag: "Выполнено решение §YРазработать ПТУР «Барьер»§!"
 ukraine_equipment_develop_domestic_atgm.6.name: "ПТУР «Барьер»: разработка завершена"
 ukraine_equipment_develop_domestic_atgm.6.desc: "КБ «Луч» завершило разработку ПТУР «Барьер». Его опыт с лазерно-лучевым наведением открывает путь к новому поколению противотанковых ракет страны [ROOT.GetName]."
 ukraine_equipment_develop_domestic_atgm.6.a: "Продолжить работу"
 UKR_develop_domestic_atgm_barrier_s: "Разработать ПТУР §Y«Барьер-С»§!"
 UKR_develop_domestic_atgm_barrier_s_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_barrier_s_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y«Барьер-С»§! — [ROOT.GetFlag]украинский противотанковый ракетный комплекс (ПТРК), разработанный §LКБ «Луч»§! на базе ПТРК §Y«Штурм-С»§!.\n§Y«Барьер-С»§! предназначен для поражения современных бронированных целей с комбинированной, разнесённой или монолитной бронёй, в том числе с динамической защитой (ДЗ).§!"
 ukraine_equipment_develop_domestic_atgm.7.name: "ПТУР «Барьер-С»: разработка завершена"
 ukraine_equipment_develop_domestic_atgm.7.desc: "КБ «Луч» завершило перевооружение истребителя танков «Штурм-С» ракетами «Барьер», и теперь мы можем выбрать следующий шаг по принятию «Барьера-С» на вооружение [ROOT.GetFlag] Вооружённых сил страны [ROOT.GetName]."
 ukraine_equipment_develop_domestic_atgm.7.a: "Получить сам проект"
 ukraine_equipment_develop_domestic_atgm.7.b: "Запустить полномасштабное производство"
 UKR_equipment_develop_domestic_stuhna_p_atgm: "Разработать ПТРК §YРК-2 «Стугна-П»§!"
 UKR_equipment_develop_domestic_stuhna_p_atgm_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_stuhna_p_for_tooltip\n\n\n\n\n\n\n\n\n§W§YРК-2 «Стугна-П»§!, известный также под экспортным названием §Y«Скиф»§!, — §Y[ROOT.GetFlag]украинский§! противотанковый ракетный комплекс (ПТРК), разработанный в начале 2010-х годов §LКБ «Луч»§!.\n§Y«Стугна-П»§! предназначен для поражения современных бронированных целей с комбинированной, разнесённой или монолитной бронёй, в том числе с динамической защитой (ДЗ).\n§Y«Стугна-П»§! может поражать неподвижные и движущиеся цели как на большой дальности — до 5 километров днём, так и на близкой — от 100 метров.\n------------------\nЭто решение — §Rобязательное условие§! для открытия следующих §Y7§! решений этой категории техники и решений по танкам §YТ-84-140 «Багира»§! и §YОбъект 477А1 «Нота»§!. Если §Rпропустить§! его, вы §Rпотеряете§! возможность выполнить последующие.§!"
 UKR_equipment_develop_domestic_stuhna_p_atgm_flag: "Выполнено решение §YРазработать ПТРК РК-2 «Стугна-П»§!"
 ukraine_equipment_develop_domestic_atgm.1.name: "ПТРК РК-2 «Стугна-П»: разработка завершена"
 ukraine_equipment_develop_domestic_atgm.1.desc: "Замечательные специалисты КБ «Луч» завершили разработку ПТРК РК-2 «Стугна-П», и теперь мы можем выбрать следующий шаг по принятию этой новой системы на вооружение [ROOT.GetFlag] Вооружённых сил страны [ROOT.GetName]."
