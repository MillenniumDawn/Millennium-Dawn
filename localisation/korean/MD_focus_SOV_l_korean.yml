 SOV_new_russia_army: "신 러시아군"
 SOV_new_russia_army_desc: "현대는 현대적인 군대를 요구합니다. 우리는 동시대의 과제와 기술에 맞게 군을 적응시켜야 합니다."
 SOV_oligarch_pay_for_army: "군에 투자하는 올리가르히"
 SOV_oligarch_pay_for_army_desc: "우리는 그 대가로 기소를 면하게 될 올리가르히들로부터 재정적 지원을 확보했습니다."
 SOV_more_yunarmy: "청소년군 확대"
 SOV_more_yunarmy_desc: "우리는 애국 교육과 선전의 수단으로서 청소년군의 범위와 효과를 높이기 위해 이를 확대할 것입니다."
 SOV_propaganda_army: "기술적 돌파구"
 SOV_propaganda_army_desc: "우리의 기술 발전은 세계의 수준에 걸맞아야 합니다. 군이 새로운 혁신을 도입하는 데 앞장설 것입니다."
 SOV_leib_guard: "대통령 연대 개편"
 SOV_leib_guard_desc: "대통령 연대는 러시아 제국 시대의 명예로운 부대를 되살려 근위대로 탈바꿈할 것입니다."
 SOV_ratnik_3: "라트니크-3"
 SOV_ratnik_3_desc: "우리는 병사들에게 최신 최첨단 전투 장비를 지급하기 위해 라트니크-3 계획에 막대한 투자를 할 것입니다."
 SOV_pmc_patriot: "PMC 파트리오트"
 SOV_pmc_patriot_desc: "국방부는 우리의 영향력과 작전 능력을 넓히기 위해 새로운 민간 군사 기업을 설립할 계획입니다."
 SOV_morpeh_vdv: "공수군 및 해병대 개혁"
 SOV_morpeh_vdv_desc: "해병대와 공수 부대는 현대전의 요구에 대응하기 위해 재편이 필요합니다. 우리는 포괄적인 개혁을 단행할 것입니다."
 SOV_uav_arms: "드론 부대"
 SOV_uav_arms_desc: "드론은 현대전의 핵심 자산입니다. 우리는 드론의 전략적, 전술적 잠재력을 극대화하기 위해 전담 드론 군단을 편성할 것입니다."
