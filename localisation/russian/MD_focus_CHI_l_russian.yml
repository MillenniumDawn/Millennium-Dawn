 CHI_bri_global_presence: "BRI Global Presence"
 CHI_bri_global_presence_desc: "Совокупный показатель масштабов присутствия китайской инициативы «Пояс и путь» (BRI) во всем мире, формирующийся по мере завершения партнёрскими странами проектов и их продвижения по рейтингу партнёров. Он обеспечивает постоянное расширение масштабов глобального присутствия BRI и определяет приоритеты последующих этапов реализации инициативы «Пояс и путь»."
