 CHI_nc_inf_pub_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_pub|Y0]"
 CHI_nc_inf_social_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_social|Y0]"
 CHI_nc_inf_ufwd_value: "$CHI_nc_current_influence_tt$ [?CHI_ic_inf_ufwd|Y0]"
 CHI_Normalise_the_Hermit: "Normalizar al ermitaño"
 CHI_Normalise_the_Hermit_desc: "Con las reformas arraigando, patrocinamos la reintegración formal de Corea del Norte en los canales económicos y diplomáticos regionales, poniendo fin a décadas de aislamiento y posicionándonos como los arquitectos de la apertura de Pionyang."
 CHI_Nuclear_Insurance: "Seguro nuclear"
 CHI_Nuclear_Insurance_desc: "Extendemos un reconocimiento de facto al arsenal nuclear de Corea del Norte como un elemento de disuasión, no como una carga. Al aceptar a Pionyang como un Estado nuclear, proporcionamos un seguro contra el colapso del régimen al tiempo que asumimos la condena internacional."
 CHI_operation_new_dawn_desc: "Lanzar una operación decisiva de fuerzas especiales contra el liderazgo de Pionyang. Las redes de Jang y los Princelings determinarán si esto termina en un golpe limpio, una guerra civil o un desastre."
 CHI_palm_and_fingers_doctrine: "Doctrina de la palma y los dedos"
 CHI_palm_and_fingers_doctrine_desc: "El Tíbet es la palma. Ladakh, Nepal, Sikkim, Bután y Arunachal son los dedos. La doctrina estratégica exige los cinco."
 CHI_pla_divestiture_completion: "Finalización de la desinversión del EPL"
 CHI_pla_divestiture_completion_desc: "Desde hace tiempo se le exige al EPL que se desprenda de su extenso imperio comercial que abarca hoteles, empresas farmacéuticas y compañías comerciales. Completar este proceso restaura el enfoque único del ejército y elimina una de las principales fuentes de corrupción entre los oficiales. Un ejército que gestiona hoteles no está pensando en la guerra."
 CHI_Pyongyang_Pivot: "El giro de Pionyang"
 CHI_Pyongyang_Pivot_desc: "En lugar de endurecer el régimen, China alienta una cautelosa apertura económica inspirada en las reformas de Deng Xiaoping. Una Corea del Norte más próspera sería un vecino más estable y un socio más dócil."
 CHI_Rare_Earth_Leverage: "Apalancamiento de tierras raras"
 CHI_Rare_Earth_Leverage_desc: "Las industrias de electrónica avanzada y semiconductores de Corea del Sur dependen en gran medida de las exportaciones de tierras raras chinas. Al aprovechar esta dependencia, podemos profundizar los lazos económicos y aumentar nuestra influencia sobre el cálculo de la política exterior de Seúl."
 CHI_Rason_SEZ_Expansion: "Expansión de la ZEE de Rason"
 CHI_Rason_SEZ_Expansion_desc: "La Zona Económica Especial de Rason, en la costa noreste de Corea del Norte, ofrece un caso de prueba para la modernización económica. La inversión china puede desbloquear el acceso portuario y los flujos de recursos al tiempo que demuestra la viabilidad de una reforma gradual."
 CHI_Sanctions_Evasion: "Evasión de sanciones"
 CHI_Sanctions_Evasion_desc: "Aunque respaldamos públicamente las sanciones internacionales, podemos permitir discretamente que continúen el comercio transfronterizo y los flujos financieros. Esto profundiza la dependencia norcoreana de China al tiempo que mantiene una denegación plausible, aunque el descubrimiento dañaría las relaciones con Occidente."
 CHI_sco_balance_display: "$CHI_sco_balance$: [?CHI_sco_balance]"
 CHI_sco_cohesion_display: "$CHI_sco_cohesion$: [?CHI_sco_cohesion]"
 CHI_scs_island_construction_campaign: "Campaña de construcción de islas"
 CHI_scs_island_construction_campaign_desc: "Lanzar el programa plurianual de dragado y construcción en toda la cadena de las Spratly. Los arrecifes sumergidos se elevan para convertirse en islas artificiales capaces de albergar instalaciones permanentes, extendiendo la huella administrativa efectiva de las reclamaciones de China en miles de kilómetros cuadrados."
 CHI_shanghai_clique_ascendant_desc: "Las luces del Bund llegan a cada ministerio. Los contables de Pudong se sientan ahora en el Consejo de Estado. La red de poder llega más lejos que la doctrina."
 CHI_shanghai_clique_leaning_desc: "Las redes del Bund tienen voz en cada ministerio. Los delegados provinciales cubren sus apuestas apuntando hacia Pudong."
 CHI_Six_Party_Talks: "Conversaciones a seis bandas"
 CHI_Six_Party_Talks_desc: "Las conversaciones a seis bandas reúnen a China, los Estados Unidos, Rusia, Japón y ambas Coreas para negociar una resolución a la crisis nuclear norcoreana. Al albergar estas conversaciones, podemos posicionarnos como un mediador indispensable y mejorar las relaciones con todas las partes involucradas."
 CHI_technocratic_consolidation_desc: "La Oficina de Investigación del Consejo de Estado es el país. Los planes quinquenales se escriben antes de las reuniones del politburó, no después."
 chi_the_one_china_policy: "La política de una sola China"
 CHI_water_pricing_reform: "Reforma de precios del agua industrial"
 CHI_water_pricing_reform_desc: "En lugar de ingeniería por el lado de la oferta, se utilizan los precios para reducir el despilfarro. Las tarifas del agua industrial aumentan drásticamente, obligando a la industria pesada a adoptar tecnologías de reciclaje y a trasladarse a zonas con ventajas hídricas comparativas. Los agricultores se resisten al aumento de costes implícito."
 CHI_Yalu_Defense_Pact: "Pacto de Defensa del Yalu"
 CHI_Yalu_Defense_Pact_desc: "Un acuerdo de defensa formal a lo largo del río Yalu vincula nuestra planificación militar con la de Corea del Norte, otorgándonos acceso garantizado al tiempo que promete una defensa mutua."
 CHI_youth_league_leaning_desc: "Los exalumnos del Tuan ocupan cargos de adjuntos en la mitad de las provincias. El equilibrio de los patronazgos está cambiando, de forma silenciosa y constante."
 CHI_youth_league_resurgent_desc: "Cada diputado provincial menor de cincuenta años se formó a través del Tuan. La cohorte ya está colocada. La agenda política viene a continuación."
 paektu_doctrine_southern: "Doctrina Paektu: Advertencia del sur"
 uighur_threat_display: "$uighur_threat$: [?uighur_threat]"
 CHI_back_princeling_network: "Respaldar las redes de los Princelings"
 CHI_back_princeling_network_desc: "Canalizar los patronazgos hacia los hijos de la élite revolucionaria y el *establishment* de Shanghái, inclinando la balanza del poder hacia la facción de los Princelings."
 CHI_promote_youth_league: "Promover a los cuadros de la Liga de la Juventud"
 CHI_promote_youth_league_desc: "Hacer ascender a los funcionarios surgidos de la Liga de la Juventud Comunista, inclinando la balanza del poder hacia la facción Tuanpai."
 CHI_SAR_one_china_framework: "Marco de una sola China"
 CHI_SAR_one_china_framework_desc: "Pekín reafirma la base constitucional de su autoridad sobre todas las Regiones Administrativas Especiales (RAE) y territorios. El marco establece una dirección política unificada desde el centro al tiempo que reconoce los distintos acuerdos administrativos de cada región."
 CHI_SAR_liaison_office_reform: "Reforma de la Oficina de Enlace"
 CHI_SAR_liaison_office_reform_desc: "El Consejo de Estado reorganiza sus oficinas de enlace en las RAE para convertirlas en una red de coordinación más integrada. La agilización de los canales de comunicación entre Pekín y las RAE permite una aplicación más rápida de las políticas y reduce las fricciones administrativas."
 CHI_SAR_national_security_framework: "Arquitectura de seguridad nacional"
 CHI_SAR_national_security_framework_desc: "Se amplía un aparato de seguridad nacional unificado para cubrir todos los territorios de las RAE. Se formaliza bajo supervisión central la coordinación entre las guarniciones del Ejército Popular de Liberación, las oficinas de seguridad del Estado y las fuerzas policiales locales."
 CHI_SAR_two_systems_commitment: "Compromiso con los dos sistemas"
 CHI_SAR_two_systems_commitment_desc: "Pekín reafirma formalmente el principio de «Un país, dos sistemas» para todas las RAE elegibles. Se garantiza una autonomía de alto grado dentro del marco constitucional, señalando una preferencia por el acomodo antes que por la integración total."
 CHI_SAR_research_sharing: "Cooperación en investigación de las RAE"
 CHI_SAR_research_sharing_desc: "Pekín establece programas conjuntos de investigación que conectan a las universidades y laboratorios estatales del continente con las instituciones de las RAE. La iniciativa profundiza los lazos académicos y tecnológicos al tiempo que amplía la capacidad de investigación general de China."
 CHI_SAR_military_corporation_sharing: "Integración de la industria de defensa"
 CHI_SAR_military_corporation_sharing_desc: "Los contratistas de defensa y las empresas de ingeniería con sede en las RAE se incorporan a la red de adquisiciones del continente. Compartir los estándares de producción y las cadenas de suministro aumenta la capacidad de producción para el Ejército Popular de Liberación."
 CHI_SAR_military_corporation_sharing_mio_tt: "Las Regiones Administrativas Especiales obtienen acceso a las organizaciones militares-industriales chinas"
 CHI_SAR_one_system_declaration: "Declaración de un solo sistema"
 CHI_SAR_one_system_declaration_desc: "El Consejo de Estado señala un giro político hacia una integración más profunda de la gobernanza de las RAE con los sistemas del continente. Los marcos jurídicos y administrativos separados se armonizarán gradualmente con la República Popular en los próximos años."
 CHI_SAR_han_superiority: "Doctrina de la primacía Han"
 CHI_SAR_han_superiority_desc: "Pekín abandona el modelo de Estado multiétnico en favor de una identidad nacional única centrada en la mayoría Han. Haciéndose eco de la «política étnica de segunda generación» promovida por académicos como Hu Angang y Hu Lianhe, se va suprimiendo la autonomía basada en la etnicidad y se acelera la asimilación en todas las regiones."
 CHI_HKG_greater_bay_area: "Iniciativa de la Gran Bahía"
 CHI_HKG_greater_bay_area_desc: "Pekín y Hong Kong lanzan conjuntamente el proyecto de la Gran Bahía de Guangdong-Hong Kong-Macao, vinculando a once ciudades en un único corredor de innovación y finanzas. El plan representa el programa de integración regional más ambicioso de China desde la Zona Económica Especial de Shenzhen."
 CHI_HKG_financial_integration: "Integración del sistema financiero"
 CHI_HKG_financial_integration_desc: "Se amplían los mecanismos transfronterizos de flujo de capitales en el marco de los programas Stock Connect y Bond Connect. Se formaliza el papel de Hong Kong como principal centro financiero de renminbis en el extranjero (*offshore*), profundizando la interdependencia con los mercados financieros del continente."
 CHI_HKG_express_rail_link: "Enlace ferroviario exprés"
 CHI_HKG_express_rail_link_desc: "Se completa el enlace ferroviario exprés Guangzhou-Shenzhen-Hong Kong, que conecta a Hong Kong directamente con la red ferroviaria de alta velocidad de China. Los tiempos de viaje entre Hong Kong y las principales ciudades del continente se reducen drásticamente, acelerando el movimiento de personas y el comercio."
 CHI_HKG_individual_visit_scheme: "Programa de visitas individuales"
 CHI_HKG_individual_visit_scheme_desc: "Pekín amplía el Programa de Visitas Individuales, permitiendo a los residentes del continente de más ciudades viajar a Hong Kong sin las restricciones de los viajes en grupo. La afluencia de turistas y compradores del continente proporciona un impulso sustancial a los sectores minorista y de servicios de Hong Kong."
 CHI_HKG_shenzhen_hk_stock_connect: "Conexión bursátil Shenzhen-Hong Kong"
 CHI_HKG_shenzhen_hk_stock_connect_desc: "Un programa de acceso mutuo a los mercados vincula las bolsas de Hong Kong y Shenzhen, permitiendo a los inversores de ambas partes negociar con las acciones cotizadas de la otra. El plan consolida aún más el papel indispensable de Hong Kong como puerta de entrada para los flujos de capital transfronterizos."
 CHI_HKG_electoral_reform: "Reforma del sistema electoral"
 CHI_HKG_electoral_reform_desc: "Pekín reestructura el marco electoral del Consejo Legislativo de Hong Kong, reduciendo los escaños de elección directa e introduciendo un mecanismo de escrutinio de candidatos para garantizar que solo los «patriotas» puedan presentarse a las elecciones. La reforma desplaza definitivamente el poder político fuera de la oposición prodemocrática."
 CHI_HKG_media_freedom: "Salvaguardias de la libertad de prensa"
 CHI_HKG_media_freedom_desc: "En una concesión a la presión de la sociedad civil, Pekín acepta protecciones estatutarias para la independencia editorial en Hong Kong. Las organizaciones internacionales de medios de comunicación interpretan la garantía como una señal de que el modelo de «dos sistemas» se respetará hasta 2047."
 CHI_HKG_censorship: "Censura en internet y medios de comunicación"
 CHI_HKG_censorship_desc: "Pekín ordena a las autoridades de Hong Kong alinear las regulaciones de internet y radiodifusión de la ciudad con los estándares del continente. Se bloquean los sitios web que albergan contenidos considerados políticamente sensibles, y los editores de los principales periódicos se enfrentan a presiones para autocensurarse."
 CHI_HKG_moral_national_education: "Educación moral y nacional"
 CHI_HKG_moral_national_education_desc: "Se introduce un nuevo plan de estudios de educación nacional obligatoria en las escuelas de Hong Kong, haciendo hincapié en la lealtad al Partido Comunista y en una visión de la historia de China centrada en el continente. La política genera una importante oposición pública pero avanza bajo la dirección central."
 CHI_HKG_national_security_law: "Ley de Seguridad Nacional del Artículo 23"
 CHI_HKG_national_security_law_desc: "Hong Kong promulga la legislación de seguridad nacional exigida por el Artículo 23 de la Ley Fundamental, tipificando como delito la secesión, la subversión, el terrorismo y la colusión con potencias extranjeras. La ley marca el fin efectivo de la cultura política independiente de la ciudad."
 CHI_HKG_lok_ma_chau_loop: "Desarrollo del meandro de Lok Ma Chau"
 CHI_HKG_lok_ma_chau_loop_desc: "Se establece una zona dedicada a la innovación y la tecnología en el meandro de Lok Ma Chau, una parcela de tierra en la frontera con Shenzhen reservada para el desarrollo conjunto. El parque está destinado a atraer instituciones de investigación y empresas tecnológicas que busquen proximidad tanto a Hong Kong como al continente."
 CHI_HKG_2030_study: "Estudio Estratégico Hong Kong 2030+"
 CHI_HKG_2030_study_desc: "El gobierno de Hong Kong publica su estrategia de ordenación territorial a largo plazo, identificando emplazamientos para nuevas zonas de desarrollo, corredores de transporte y suelo industrial. El estudio enmarca el crecimiento físico de Hong Kong dentro del contexto de la integración de la Gran Bahía."
 CHI_HKG_palace_museum: "Museo del Palacio de Hong Kong"
 CHI_HKG_palace_museum_desc: "Se establece una sucursal del Museo del Palacio de Pekín en el Distrito Cultural de Kowloon Oeste de Hong Kong, exhibiendo artefactos prestados de la colección de la Ciudad Prohibida. El proyecto se presenta como un puente cultural entre Hong Kong y el continente, atrayendo una notable atención internacional."
 CHI_HKG_zhuhai_macau_bridge: "Puente Hong Kong-Zhuhai-Macao"
 CHI_HKG_zhuhai_macau_bridge_desc: "Se completa el sistema de puente-túnel marítimo más largo del mundo, que une Hong Kong, Zhuhai y Macao a través del estuario del río de las Perlas. La estructura reduce drásticamente los tiempos de viaje por tierra entre las tres ciudades y sirve como espina dorsal física de la integración de la Gran Bahía."
 CHI_HKG_lok_ma_chau_station: "Expansión de la estación de Lok Ma Chau"
 CHI_HKG_lok_ma_chau_station_desc: "El paso fronterizo de Lok Ma Chau se actualiza con la ampliación de las instalaciones de pasajeros y mercancías, reduciendo la congestión en uno de los puntos de entrada terrestre más transitados de Hong Kong. El aumento del rendimiento logístico acelera el comercio transfronterizo y los flujos de trabajadores pendulares."
 CHI_SAR_integrate_HKG: "Integración total de Hong Kong"
 CHI_SAR_integrate_HKG_desc: "Con los sistemas políticos y económicos de Hong Kong totalmente alineados con el continente, Pekín disuelve formalmente el estatus administrativo especial de la RAE. La antigua colonia se incorpora como un municipio administrado directamente por la República Popular."
 CHI_MAC_pearl_river_delta: "Integración del delta del río de las Perlas"
 CHI_MAC_pearl_river_delta_desc: "Macao se incorpora formalmente a la zona económica del delta del río de las Perlas, con inversiones en infraestructura orientadas a reducir su aislamiento económico. El puente Hong Kong-Zhuhai-Macao se convierte en la columna vertebral de una nueva red de transporte transfronterizo."
 CHI_MAC_lotus_flower_economy: "Economía de la Flor de Loto"
 CHI_MAC_lotus_flower_economy_desc: "Macao lanza una iniciativa de renovación de marca económica anclada en la identidad distintiva del territorio como una RAE luso-china. En lugar de apuntar a un solo sector, la estrategia reposiciona a Macao como un «centro mundial de turismo y ocio», una marca que enmarca todos los esfuerzos de diversificación posteriores y se alinea con la visión de Pekín para la Gran Bahía."
 CHI_MAC_financial_services: "Centro de servicios financieros en el extranjero"
 CHI_MAC_financial_services_desc: "Se actualiza el marco regulatorio de Macao para atraer la banca extraterritorial (*offshore*), la emisión de bonos y el negocio de liquidación en renminbis. La herencia jurídica portuguesa del territorio se comercializa como una ventaja para los inversores lusófonos que buscan exposición en el continente."
 CHI_MAC_infrastructure_link: "Enlace de infraestructura transfronterizo"
 CHI_MAC_infrastructure_link_desc: "Un nuevo paso fronterizo y la extensión del tren ligero conectan la zona de desarrollo de Cotai en Macao directamente con la Zona de Cooperación Profunda Guangdong-Macao en la isla de Hengqin. El proyecto integra físicamente la huella económica de Macao con el continente."
 CHI_MAC_guangdong_integration: "Acuerdo de Integración con Guangdong"
 CHI_MAC_guangdong_integration_desc: "Un acuerdo integral de cooperación con la provincia de Guangdong alinea las normativas de planificación, legales y financieras de Macao con los estándares del continente. Los funcionarios describen el acuerdo como un modelo para la convergencia pacífica de la gobernanza de las RAE y el continente."
 CHI_SAR_integrate_MAC: "Integración total de Macao"
 CHI_SAR_integrate_MAC_desc: "Tras décadas de profunda armonización económica y jurídica, se disuelve el estatus de RAE de Macao. El territorio es absorbido por el sistema administrativo provincial de Guangdong, completando la fase final del traspaso de 1999."
 CHI_MAC_cultural_autonomy_push: "Movimiento del Patrimonio Portugués"
 CHI_MAC_cultural_autonomy_push_desc: "Organizaciones civiles hacen campaña para preservar la identidad cultural distintiva luso-china de Macao frente a la acelerada integración con el continente. Las demandas incluyen la protección estatutaria del idioma portugués, de la comunidad macanesa y del pluralismo jurídico único del territorio."
 CHI_MAC_lusophone_connections: "Estrategia de la puerta de entrada lusófona"
 CHI_MAC_lusophone_connections_desc: "Macao se posiciona como un puente indispensable entre China y el mundo lusófono mediante la expansión de su Foro para la Cooperación Económica y Comercial. El reconocimiento internacional de este papel único proporciona un argumento político para mantener un alto grado de autonomía."
 CHI_TIB_plateau_development: "Fondo de Desarrollo de la Meseta"
 CHI_TIB_plateau_development_desc: "El Consejo de Estado lanza un programa de inversión a gran escala para la Región Autónoma del Tíbet, destinado a infraestructura, vivienda y servicios públicos. El programa refleja la Estrategia de Desarrollo del Oeste, pero se enmarca internamente como una iniciativa de alivio de la pobreza."
 CHI_TIB_railway_modernization: "Extensión del ferrocarril Qinghai-Tíbet"
 CHI_TIB_railway_modernization_desc: "Se aprueba una segunda fase del ferrocarril Qinghai-Tíbet, extendiendo la línea hasta Shigatse y eventualmente a Nyingchi, cerca de la frontera con la India. El proyecto reduce el aislamiento logístico del Tíbet y acelera el movimiento de colonos de la etnia Han y de las fuerzas de seguridad."
 CHI_TIB_release_falun_gong: "Amnistía de Falun Gong"
 CHI_TIB_release_falun_gong_desc: "En un gesto calculado de apertura, Pekín libera a los practicantes de Falun Gong encarcelados y suaviza las restricciones a las actividades religiosas del movimiento en la Región Autónoma del Tíbet. La concesión recibe elogios cautelosos de los gobiernos occidentales y señala un enfoque más blando hacia la disidencia religiosa."
 CHI_TIB_return_dalai_lama: "Retorno del Dalai Lama"
 CHI_TIB_return_dalai_lama_desc: "Tras prolongadas negociaciones por canales secretos, Pekín y los representantes del Dalai Lama alcanzan un acuerdo que permite al líder espiritual tibetano regresar a Lhasa con carácter ceremonial. El acuerdo no llega a otorgar la autonomía política, pero genera una considerable buena voluntad en las capitales internacionales."
 CHI_TIB_sinification: "Campaña de educación patriótica"
 CHI_TIB_sinification_desc: "El partido pone en marcha un programa sistemático de reeducación ideológica en los monasterios y escuelas tibetanos, exigiendo denuncias contra el Dalai Lama y juramentos de lealtad a la patria. La campaña se inspira en la iniciativa «Golpear con fuerza» de la década de 1990 y está gestionada por equipos de trabajo especialmente desplegados."
 CHI_TIB_autonomy_preservation: "Marco de autonomía genuina"
 CHI_TIB_autonomy_preservation_desc: "En respuesta a la presión internacional y a los recurrentes disturbios, Pekín abre negociaciones con los representantes del Dalai Lama para ampliar la autonomía cultural y religiosa. La Propuesta de Estrasburgo y el Enfoque de la Vía Media sirven de base para las discusiones por canales secretos."
 CHI_TIB_cultural_integration: "Sinización de la gobernanza"
 CHI_TIB_cultural_integration_desc: "Se nombra a funcionarios de la etnia Han para ocupar cargos de responsabilidad en el aparato administrativo, judicial y de seguridad del Tíbet. El mandarín sustituye al tibetano como lengua de la administración, y los planes de estudio de todas las escuelas estatales se estandarizan con los contenidos del continente."
 CHI_SAR_integrate_TIB: "Integración total del Tíbet"
 CHI_SAR_integrate_TIB_desc: "Con la autoridad religiosa neutralizada, las estructuras administrativas totalmente alineadas y la transformación demográfica completada, se disuelve el estatus residual de RAE de la Región Autónoma del Tíbet. El Tíbet se reincorpora como una provincia ordinaria bajo la administración directa del gobierno central."
 CHI_TIB_buddhist_cultural_zone: "Zona de preservación cultural budista"
 CHI_TIB_buddhist_cultural_zone_desc: "Se establece una zona de preservación designada alrededor del Palacio de Potala y del Templo de Jokhang, otorgando un reconocimiento formal limitado al budismo tibetano como institución de patrimonio cultural. Los críticos describen la concesión como un compromiso orientado al turismo que elude una libertad religiosa sustantiva."
 CHI_TIB_silk_road_gateway: "Puerta de la Ruta de la Seda del Himalaya"
 CHI_TIB_silk_road_gateway_desc: "Se aprovecha la posición geográfica del Tíbet en la confluencia de los corredores del sur de Asia de la Franja y la Ruta para invertir en infraestructuras fronterizas, energía hidroeléctrica y logística comercial. La iniciativa integra la economía del Tíbet con Nepal y los mercados de Asia del Sur al tiempo que profundiza la dependencia del continente."
 CHI_TIB_monastery_economy: "Economía monástica"
 CHI_TIB_monastery_economy_desc: "Las instituciones monásticas tibetanas, históricamente la columna vertebral de la economía regional, reciben autorización para operar empresas comerciales dentro del marco de la RAE. El turismo de peregrinación, la producción de medicina tradicional y las industrias artesanales generan ingresos que sostienen tanto a los monasterios como a las comunidades locales."
 CHI_TIB_plateau_resources: "Prospección mineral de la meseta"
 CHI_TIB_plateau_resources_desc: "La RAE del Tíbet pone en marcha una prospección independiente que identifica importantes yacimientos de litio, cobre y cromita en la meseta tibetana. Las autoridades de la RAE negocian acuerdos de reparto de ingresos que retienen una parte de las ganancias de la extracción dentro del presupuesto regional."
 CHI_ETK_corridor_investment: "Inversión en el corredor de la Franja y la Ruta"
 CHI_ETK_corridor_investment_desc: "Xinjiang es designada como la principal puerta de entrada terrestre de la Iniciativa de la Franja y la Ruta, atrayendo una inversión estatal masiva en infraestructuras ferroviarias, de oleoductos y autopistas. La terminal norte del Corredor Económico China-Pakistán en Kashgar transforma la geografía económica de la región."
 CHI_ETK_resource_extraction: "Extracción de energía y minerales"
 CHI_ETK_resource_extraction_desc: "Las reservas de petróleo y gas de la cuenca de Tarim se amplían en el marco de un programa de desarrollo estatal que prioriza la construcción de oleoductos y la capacidad de refino. La cuota de Xinjiang en la producción nacional de petróleo aumenta significativamente, aunque las transferencias de ingresos al centro siguen siendo motivo de queja persistente."
 CHI_ETK_silk_road_commerce: "Iniciativa comercial de la Ruta de la Seda"
 CHI_ETK_silk_road_commerce_desc: "Las redes de comerciantes uigures tradicionales de Xinjiang se incorporan formalmente a la política comercial regional, con la concesión de licencias preferenciales para el comercio transfronterizo con las repúblicas de Asia Central. La política revive un patrón histórico de comercio mediado por uigures que se remonta a la dinastía Tang."
 CHI_ETK_oilfield_development: "Desarrollo petrolero de la cuenca de Tarim"
 CHI_ETK_oilfield_development_desc: "El gobierno de la RAE de Xinjiang negocia acuerdos de empresa conjunta con compañías energéticas nacionales para la exploración de la cuenca de Tarim, asegurando una participación sin precedentes en las regalías de extracción para las infraestructuras regionales. Los yacimientos petrolíferos se encuentran entre los mayores de China y sustentan la independencia fiscal de la región."
 CHI_ETK_strike_hard_campaign: "Campaña de golpear con fuerza"
 CHI_ETK_strike_hard_campaign_desc: "La campaña «Golpear con fuerza, máxima presión», dirigida contra las redes separatistas uigures, se relanza a una escala sin precedentes, incorporando vigilancia digital, detenciones masivas y la supresión sistemática de las prácticas religiosas. Las organizaciones internacionales de derechos humanos documentan abusos generalizados."
 CHI_ETK_education_centres: "Centros de educación de habilidades profesionales"
 CHI_ETK_education_centres_desc: "Se establece en todo Xinjiang una red de instalaciones de detención extrajudicial, descritas oficialmente como «Centros de educación y formación de habilidades profesionales». Se despliega en toda la región una red integral de vigilancia digital que cubre el reconocimiento facial, bases de datos de ADN y la monitorización de teléfonos inteligentes."
 CHI_ETK_total_survaillance_infrastructure: "Infraestructura de vigilancia total"
 CHI_ETK_total_survaillance_infrastructure_desc: "Se construye una red de vigilancia en toda la región de Xinjiang, integrando cámaras de reconocimiento facial, puntos de control biométricos y software obligatorio de monitorización de teléfonos inteligentes. El sistema otorga a las autoridades una visibilidad casi total sobre los movimientos de la población y la actividad en línea."
 CHI_SAR_integrate_ETK: "Integración total de Xinjiang"
 CHI_SAR_integrate_ETK_desc: "Tras la supresión casi total de la actividad separatista y el desplazamiento de las estructuras sociales uigures tradicionales, se disuelve el marco administrativo de RAE de Xinjiang. La región se reorganiza bajo una administración provincial estándar sin disposiciones especiales de autonomía étnica."
 CHI_ETK_autonomy_statute: "Estatuto de autonomía de Xinjiang"
 CHI_ETK_autonomy_statute_desc: "Un nuevo estatuto de autonomía regional otorga a las comunidades musulmanas de Xinjiang derechos formales para la práctica religiosa, la educación en lengua uigur y el derecho consuetudinario en asuntos personales. El estatuto cuenta con el respaldo de un selecto grupo de organizaciones islámicas internacionales."
 CHI_ETK_islamic_governance_framework: "Marco de gobernanza islámica"
 CHI_ETK_islamic_governance_framework_desc: "Pekín adopta un enfoque más conciliador en Xinjiang, permitiendo prácticas religiosas islámicas reguladas, expandiendo la educación en lengua uigur y nombrando a más funcionarios uigures en el gobierno local. La política refleja la relativa indulgencia del período anterior a 2017."
 CHI_ETK_BRI_hub: "Zona Económica Especial de Kashgar"
 CHI_ETK_BRI_hub_desc: "Kashgar es designada como Zona Económica Especial con un tratamiento fiscal preferencial y procedimientos aduaneros simplificados para el comercio de tránsito de la Franja y la Ruta. La zona posiciona a Xinjiang como un centro comercial que vincula a Asia Central, Asia del Sur y Oriente Medio."
 CHI_TAI_combat_the_traitors: "Combatir a los traidores"
 CHI_TAI_combat_the_traitors_desc: "Pekín adopta una postura intransigente hacia Taiwán, designando oficialmente a los líderes proindependentistas como traidores y señalando que la reunificación por la fuerza sigue siendo una opción activa. La declaración aumenta drásticamente las tensiones a través del estrecho y sitúa al EPL en un estado de preparación elevado."
 CHI_TAI_cut_us_support: "Ruptura de los lazos entre EE. UU. y Taiwán"
 CHI_TAI_cut_us_support_desc: "Pekín lleva a cabo una campaña de influencia sostenida dirigida a los círculos políticos y empresariales estadounidenses, presionando contra la venta de armas y los contactos formales con Taipéi. La operación está diseñada para erosionar la credibilidad del compromiso de los EE. UU. con la seguridad de Taiwán."
 CHI_TAI_outward_island_infrastructure: "Infraestructura militar en las islas periféricas"
 CHI_TAI_outward_island_infrastructure_desc: "Tras la toma de Taiwán, el Ejército Popular de Liberación comienza a construir instalaciones navales y aéreas fortificadas en las islas periféricas. Las nuevas bases amplían el alcance de la proyección de poder de China en las profundidades del Pacífico occidental y alteran sustancialmente el equilibrio de fuerzas regional."
 CHI_TAI_cross_strait_policy: "Revisión de la política a través del Estrecho"
 CHI_TAI_cross_strait_policy_desc: "El Consejo de Estado encarga una revisión integral de la política a través del estrecho, examinando las opciones diplomáticas, económicas y militares para la reunificación. La revisión establece la agenda política para el enfoque de China hacia Taiwán durante la próxima década."
 CHI_TAI_economic_track: "Vía económica a través del Estrecho"
 CHI_TAI_economic_track_desc: "Pekín abre un diálogo económico estructurado con Taipéi centrado en la facilitación del comercio, la cooperación industrial y el acceso al mercado a largo plazo. El objetivo es construir un beneficio mutuo tal que las conversaciones políticas se vuelvan más difíciles de resistir."
 CHI_TAI_political_track: "Vía política a través del Estrecho"
 CHI_TAI_political_track_desc: "Paralelamente al compromiso económico, Pekín establece una vía política dedicada a reactivar los mecanismos de diálogo, rebajar las tensiones y preparar el terreno para un acuerdo negociado aceptable para ambas partes."
 CHI_TAI_expand_cross_strait_trade: "Expandir el comercio a través del Estrecho"
 CHI_TAI_expand_cross_strait_trade_desc: "Aprovechando la lógica del ECFA y las conversaciones posteriores sobre el comercio de servicios, Pekín ofrece nuevas concesiones comerciales y reduce las barreras para las empresas de Taiwán que operan en el continente. La política está diseñada para hacer que la cooperación económica sea visiblemente rentable para las élites políticas y empresariales de Taiwán."
 CHI_TAI_mainland_market_access: "Acceso al mercado del continente"
 CHI_TAI_mainland_market_access_desc: "China concede a los inversores y exportadores de Taiwán un acceso preferencial a sectores seleccionados del continente, especialmente a la fabricación avanzada y a los servicios. El acuerdo refleja los esfuerzos del mundo real por vincular a Taiwán más estrechamente con la economía del continente a través de la oportunidad en lugar de la fuerza."
 CHI_TAI_business_delegations: "Delegaciones empresariales a través del Estrecho"
 CHI_TAI_business_delegations_desc: "Grupos comerciales semioficiales, cámaras de comercio y principales actores industriales reanudan las visitas regulares a través del estrecho. Estas delegaciones crean una forma políticamente más segura de profundizar la cooperación práctica al tiempo que construyen apoyos en Taiwán que se benefician de unas relaciones estables."
 CHI_TAI_transport_links: "Enlaces directos de transporte"
 CHI_TAI_transport_links_desc: "Se amplían los vuelos directos, los acuerdos navieros y la coordinación logística para reducir la separación práctica entre ambas partes. Un movimiento comercial y de pasajeros más rápido reduce el coste político del compromiso continuo y normaliza aún más el intercambio a través del estrecho."
 CHI_TAI_semiconductor_coordination: "Coordinación de semiconductores"
 CHI_TAI_semiconductor_coordination_desc: "Taipéi acepta una coordinación estratégica limitada en las cadenas de suministro de alta tecnología, especialmente en semiconductores y fabricación de precisión. El acuerdo refleja la interdependencia económica real entre el sector de los chips de Taiwán y la demanda del continente, sin llegar a una unión política total."
 CHI_TAI_investment_safeguards: "Salvaguardias de inversión"
 CHI_TAI_investment_safeguards_desc: "Los negociadores de Taiwán insisten en que una integración económica más profunda debe ir acompañada de garantías jurídicas y regulatorias que protejan a las empresas e instituciones locales. Este enfoque responde a la preocupación interna real de que la inversión a través del estrecho no debe convertirse en un vehículo para la absorción política."
 CHI_TAI_joint_industrial_planning: "Planificación industrial conjunta"
 CHI_TAI_joint_industrial_planning_desc: "Los planificadores de ambas partes comienzan a coordinar las infraestructuras, las cadenas de suministro industrial y los sectores intensivos en tecnología. El proceso transforma los vínculos comerciales dispersos en algo más parecido a una estrategia de desarrollo gestionada a través del estrecho."
 CHI_TAI_deep_economic_integration: "Integración económica profunda"
 CHI_TAI_deep_economic_integration_desc: "Tras años de acuerdos acumulados, el comercio a través del estrecho se formaliza en un denso marco de inversión, logística e interdependencia industrial. Llegados a esta etapa, la separación económica se ha vuelto cada vez más costosa para ambas partes, especialmente para Taiwán."
 CHI_TAI_resume_party_contacts: "Reanudar los contactos entre partidos"
 CHI_TAI_resume_party_contacts_desc: "Pekín reactiva los canales con partidos y organizaciones de Taiwán dispuestos a discutir una relación a través del estrecho menos conflictiva. El enfoque se basa en el patrón real de diálogo PCCh-KMT y otros contactos políticos no oficiales que periódicamente han sustituido a la diplomacia de Estado a Estado."
 CHI_TAI_pro_china_party_networks_mission: "Redes de partidos pro-China"
 CHI_TAI_pro_china_party_networks_mission_desc: "Las redes comerciales y políticas de China a través del estrecho cultivan activamente el apoyo a los partidos pro-reunificación en Taiwán. Mientras nuestra influencia siga siendo sustancial, estos esfuerzos desplazan gradualmente la opinión pública hacia la coalición Pan-Azul."
 CHI_TAI_offer_confidence_measures: "Ofrecer medidas de confianza"
 CHI_TAI_offer_confidence_measures_desc: "Pekín propone un paquete de pasos prácticos de distensión, que incluye canales de comunicación regulares y moderación en las señales públicas. La intención es convencer a los moderados de Taiwán de que el compromiso puede reducir el riesgo sin forzar inmediatamente una decisión sobre la soberanía."
 CHI_TAI_legislative_exchange_forum: "Foro de intercambio legislativo"
 CHI_TAI_legislative_exchange_forum_desc: "Delegaciones de legisladores, asesores y especialistas políticos comienzan a reunirse a través de canales semioficiales para debatir sobre comercio, transporte y coordinación administrativa. Estos foros otorgan al compromiso a través del estrecho una fachada parlamentaria y procedimental, suavizando la imagen de la presión vertical."
 CHI_TAI_local_government_dialogue: "Diálogo con gobiernos locales"
 CHI_TAI_local_government_dialogue_desc: "Las administraciones municipales, los gobiernos de los condados y los funcionarios subnacionales abren conversaciones prácticas sobre transporte, turismo e inversión. Esto refleja un patrón del mundo real en el que los vínculos municipales y locales a menudo avanzaban incluso cuando las relaciones formales a nivel central eran tensas."
 CHI_TAI_reaffirm_the_1992_consensus: "Reafirmar el Consenso de 1992"
 CHI_TAI_reaffirm_the_1992_consensus_desc: "Los moderados de Taiwán optan por regresar explícitamente al marco de que existe una sola China, preservando al mismo tiempo su propia interpretación de dicho principio. La fórmula es controvertida a nivel interno, pero sigue siendo la base más realista para unas negociaciones serias a través del estrecho."
 CHI_TAI_suspend_independence_initiatives: "Suspender iniciativas de independencia"
 CHI_TAI_suspend_independence_initiatives_desc: "Taipéi detiene discretamente las medidas que empujarían a la isla hacia una separación formal en el plano jurídico o diplomático. Esto no pone fin al autogobierno, pero señala que Taiwán está dispuesto a estabilizar la situación en lugar de escalarla."
 CHI_TAI_back_channel_settlement: "Acuerdo por canales secretos"
 CHI_TAI_back_channel_settlement_desc: "Las organizaciones semioficiales de ambas partes pasan de la adopción de medidas de confianza a una negociación política sustantiva. Inspirándose en el modelo de contactos al estilo ARATS-SEF, redactan un marco de acuerdo diseñado para que la reunificación pacífica parezca ordenada, gradual y materialmente beneficiosa."
 CHI_TAI_peaceful_reunification_accord: "Acuerdo de reunificación pacífica"
 CHI_TAI_peaceful_reunification_accord_desc: "Tras años de progresos diplomáticos graduales, Pekín y Taipéi firman un acuerdo marco histórico que contempla la adhesión de Taiwán a la República Popular como Región Administrativa Especial. El acuerdo garantiza las instituciones democráticas y el sistema jurídico existentes en Taiwán durante un período de transición de cincuenta años."
 CHI_TAI_military_buildup: "Despliegue militar a través del Estrecho"
 CHI_TAI_military_buildup_desc: "El Ejército Popular de Liberación acelera la adquisición de buques de asalto anfibio, embarcaciones de desembarco y misiles de precisión de largo alcance configurados para una contingencia en el estrecho de Taiwán. Los ejercicios conjuntos simulan la toma de islas periféricas y la supresión de las defensas aéreas de Taiwán."
 CHI_TAI_amphibious_doctrine: "Doctrina de desembarco conjunto en islas"
 CHI_TAI_amphibious_doctrine_desc: "El Cuerpo de Infantería de Marina del EPL y el Comando del Teatro de Operaciones Oriental publican una doctrina operacional conjunta revisada para asaltos anfibios de armas combinadas. La doctrina es clasificada, pero las agencias de inteligencia extranjeras la analizan ampliamente como un plan directo para una contingencia en Taiwán."
 CHI_TAI_blockade_declaration: "Bloqueo del estrecho de Taiwán"
 CHI_TAI_blockade_declaration_desc: "La Armada del EPL declara una zona de exclusión naval alrededor de Taiwán, cortando las rutas marítimas comerciales e interrumpiendo las importaciones de combustible y materias primas. El bloqueo va acompañado de amplios ejercicios aéreos y pruebas de misiles balísticos, lo que desencadena una crisis internacional."
 CHI_TAI_operation_storm: "Operación Tormenta"
 CHI_TAI_operation_storm_desc: "El Ejército Popular de Liberación lanza su largamente planeada campaña anfibia contra Taiwán. Los ataques con misiles neutralizan las defensas aéreas y la infraestructura de mando, mientras que las fuerzas de desembarco cruzan el estrecho bajo cobertura aérea y naval. La operación marca la acción militar más significativa en Asia desde la guerra de Corea."
 CHI_TAI_economic_miracle: "Integración del milagro económico de Taiwán"
 CHI_TAI_economic_miracle_desc: "La avanzada industria de semiconductores de Taiwán, su sector financiero y su ecosistema tecnológico se integran formalmente en el marco de la planificación económica nacional. Esta adquisición representa una ganancia transformadora en la capacidad tecnológica de China, particularmente en la fabricación de chips."
 CHI_OMG_steppe_development: "Iniciativa de desarrollo de Nei Mongol"
 CHI_OMG_steppe_development_desc: "El Consejo de Estado lanza un programa de desarrollo focalizado para la Región Autónoma de Mongolia Interior, invirtiendo en infraestructura energética, corredores logísticos y parques industriales. La iniciativa integra a Mongolia Interior más profundamente en la red económica nacional al tiempo que aborda la pobreza rural persistente."
 CHI_OMG_northern_corridor: "Infraestructura del corredor norte"
 CHI_OMG_northern_corridor_desc: "Se aprueba un nuevo corredor de autopistas y transporte ferroviario de mercancías que une Mongolia Interior con la aglomeración Pekín-Tianjin-Hebei, reduciendo los tiempos de tránsito del carbón, los minerales de tierras raras y los productos agrícolas. El corredor sustenta el papel de Mongolia Interior como el interior energético del norte de China."
 CHI_OMG_mandarin_education: "Política educativa en lengua mandarín"
 CHI_OMG_mandarin_education_desc: "El gobierno regional anuncia una transición gradual que exige que todas las escuelas primarias y secundarias enseñen las asignaturas troncales en mandarín en lugar de en mongol. La política, inspirada en medidas similares aplicadas en el Tíbet y Xinjiang, desencadena protestas generalizadas en las ciudades y comunidades pastoriles de Mongolia Interior."
 CHI_OMG_cultural_recognition: "Reconocimiento cultural mongol"
 CHI_OMG_cultural_recognition_desc: "Pekín reconoce formalmente la identidad cultural y lingüística mongola de la RAE de Mongolia Interior, garantizando la educación en mongol, la radiodifusión estatal y el estatus oficial de su escritura. Esta política representa un alejamiento deliberado del enfoque asimilacionista aplicado en el Tíbet y Xinjiang."
 CHI_OMG_han_settlement_program: "Programa de asentamiento Han"
 CHI_OMG_han_settlement_program_desc: "La migración patrocinada por el Estado desde Hebei, Shaanxi y Gansu acelera la transformación demográfica de Mongolia Interior. Se establecen nuevos municipios en antiguas tierras de pastoreo, y las políticas de empleo preferenciales consolidan aún más el estatus de mayoría Han en las zonas urbanas."
 CHI_SAR_integrate_OMG: "Integración total de Mongolia Interior"
 CHI_SAR_integrate_OMG_desc: "Tras la transformación demográfica y cultural, se disuelve el estatus de RAE de Mongolia Interior y la región se reestructura como una división administrativa estándar de nivel provincial. El reconocimiento formal de la autonomía mongola se sustituye por disposiciones generales de protección de las minorías étnicas aplicables en toda la República Popular China."
 CHI_OMG_greater_mongolia_vision: "Visión panmongola"
 CHI_OMG_greater_mongolia_vision_desc: "Los defensores del movimiento cultural de Mongolia Interior articulan una visión de lazos más estrechos con el Estado independiente de Mongolia, invocando una historia, lengua y herencia nómada compartidas. Pekín tolera el enfoque cultural al tiempo que mantiene límites estrictos sobre cualquier implicación política."
 OMG_steppe_livestock_industry: "Modernización de la ganadería esteparia"
 OMG_steppe_livestock_industry_desc: "Las industrias tradicionales de cachemira, carne de cordero y productos lácteos de Mongolia Interior se reestructuran bajo un modelo cooperativo que vincula a las familias de pastores con las cadenas de suministro nacionales. El programa mejora los ingresos familiares al tiempo que preserva elementos del estilo de vida pastoril."
 CHI_OMG_steppe_mining_industry: "Industria minera esteparia"
 CHI_OMG_steppe_mining_industry_desc: "Los yacimientos de cromo y minerales de Mongolia Interior se integran en un programa de extracción coordinado. Las empresas respaldadas por el Estado establecen instalaciones de procesamiento y corredores de exportación, convirtiendo la riqueza del subsuelo en capacidad industrial para la economía general de China."
 OMG_mongolian_mining_expansion: "Expansión de tierras raras y carbón"
 OMG_mongolian_mining_expansion_desc: "Mongolia Interior contiene algunos de los mayores yacimientos de elementos de tierras raras del mundo y un tercio de las reservas de carbón de China. Las autoridades de la RAE expanden las operaciones de extracción y negocian acuerdos de regalías que dirigen una mayor parte de los ingresos mineros hacia la infraestructura y la educación regionales."
 CHI_OMG_mongolian_mining_expansion: "Expansión de tierras raras y carbón"
 CHI_OMG_mongolian_mining_expansion_desc: "Mongolia Interior contiene algunos de los mayores yacimientos de elementos de tierras raras del mundo y un tercio de las reservas de carbón de China. Las autoridades de la RAE expanden las operaciones de extracción y negocian acuerdos de regalías que dirigen una mayor parte de los ingresos mineros hacia la infraestructura y la educación regionales."
 CHI_MON_diplomatic_outreach: "Acercamiento diplomático a Mongolia"
 CHI_MON_diplomatic_outreach_desc: "Pekín lanza una iniciativa diplomática hacia Ulán Bator, combinando incentivos económicos con llamamientos culturales a la herencia mongola compartida. Las visitas de alto nivel, las condiciones comerciales preferenciales y una mayor presencia cultural china preparan el terreno para un compromiso más profundo."
 CHI_MON_economic_partnership: "Asociación económica esteparia"
 CHI_MON_economic_partnership_desc: "Un acuerdo integral de asociación económica concede a Mongolia acceso preferencial a los mercados chinos, inversiones y financiación de infraestructuras. Las exportaciones minerales de Mongolia (cobre, carbón y tierras raras) encuentran en China a su principal cliente, creando una interdependencia económica significativa."
 CHI_MON_reunification_offer: "Oferta de reunificación mongola"
 CHI_MON_reunification_offer_desc: "China presenta una oferta formal a Mongolia para reunificarse como una Región Administrativa Especial, prometiendo un alto grado de autonomía, la preservación del sistema político de Mongolia y una plena integración económica. La propuesta invoca precedentes históricos y posiciona a China como el socio natural para la prosperidad mongola."
 MON_CHI_economic_partnership_idea: "Integración económica sino-mongola"
 MON_CHI_economic_partnership_idea_desc: "El acceso comercial preferencial y la integración en el mercado chino han hecho que Mongolia dependa en gran medida de las exportaciones a China. Los ingresos de la minería aumentan, pero también lo hace la dependencia estructural de la demanda china."
 MON_CHI_cultural_sphere_idea: "Dentro de la órbita cultural de China"
 MON_CHI_cultural_sphere_idea_desc: "Los medios de comunicación estatales chinos, la programación cultural y las redes de la diáspora han establecido una presencia significativa de poder blando dentro de Mongolia. Como resultado, la resistencia a una mayor influencia china se ve debilitada."
 CHI_TAI_fleet_modernization: "Programa de modernización de la flota"
 CHI_TAI_fleet_modernization_desc: "La Armada del EPL acelera la adquisición de modernos destructores, fragatas y buques de asalto anfibio configurados para operaciones en el estrecho de Taiwán. La ampliación de la capacidad de los astilleros y la aceleración de los plazos de entrada en servicio señalan un giro claro hacia la proyección de poder en el Pacífico occidental."
 CHI_TAI_dongfeng_program: "Programa de misiles Dong Feng"
 CHI_TAI_dongfeng_program_desc: "La Fuerza de Misiles expande su arsenal de misiles balísticos de alcance intermedio, desplegando baterías adicionales de DF-21 y DF-26 a lo largo de la costa de Fujian. El programa otorga a Pekín la capacidad de poner en peligro la infraestructura militar de Taiwán desde el continente sin necesidad de comprometer activos navales o aéreos."
 CHI_TAI_air_superiority: "Estrategia de superioridad aérea"
 CHI_TAI_air_superiority_desc: "La Fuerza Aérea del EPL intensifica las salidas de entrenamiento sobre la línea media del estrecho de Taiwán y despliega cazas avanzados J-20 en bases avanzadas de Fujian. La persistente presión aérea erosiona la capacidad de Taiwán para mantener unas defensas aéreas creíbles."
 CHI_TAI_cyber_warfare: "Capacidad de guerra cibernética"
 CHI_TAI_cyber_warfare_desc: "La Fuerza de Apoyo Estratégico expande su dirección de operaciones cibernéticas ofensivas, desarrollando capacidades para perturbar la infraestructura crítica, las comunicaciones militares y los sistemas financieros de Taiwán. El frente digital se convierte en otro eje de presión."
 CHI_TAI_blockade_capability: "Preparación para el bloqueo"
 CHI_TAI_blockade_capability_desc: "Tras extensos ejercicios de simulación, la Armada y la Guardia Costera del EPL certifican su plena preparación operativa para establecer una zona de exclusión marítima alrededor de Taiwán. Las patrullas de submarinos, los piquetes de superficie y la vigilancia aérea pueden activarse a corto plazo."
 CHI_TAI_one_china_enforcement: "Aplicación de una sola China"
 CHI_TAI_one_china_enforcement_desc: "Pekín lanza una campaña diplomática sistemática para eliminar los reconocimientos formales restantes de Taiwán. Se envían embajadores con paquetes de ayuda y acuerdos de infraestructura, al tiempo que se aplica presión económica a las naciones que se resisten a cambiar su reconocimiento diplomático."
 CHI_TAI_intl_org_blockade: "Bloqueo en organizaciones internacionales"
 CHI_TAI_intl_org_blockade_desc: "China aprovecha su asiento permanente en el Consejo de Seguridad de la ONU y su creciente peso en las instituciones multilaterales para bloquear la participación de Taiwán en organizaciones internacionales. Se vetan las solicitudes de estatus de observador y se cierran los canales de participación informal."
 CHI_TAI_economic_leverage: "Campaña de apalancamiento económico"
 CHI_TAI_economic_leverage_desc: "Pekín instrumentaliza su posición como la mayor nación comercial del mundo, aplicando una presión económica selectiva sobre las industrias y los sectores políticos estadounidenses que apoyan a Taiwán. La campaña explota la dependencia comercial para erosionar la voluntad política que respalda las garantías de seguridad de los EE. UU."
 CHI_TAI_tourism_freeze: "Congelación del turismo"
 CHI_TAI_tourism_freeze_desc: "Pekín ordena a los operadores turísticos afiliados al Estado suspender todos los paquetes grupales e individuales a Taiwán, cortando los flujos de visitantes que habían crecido sustancialmente desde la apertura de la era ECFA en 2008. La medida priva a Taipéi de los ingresos en divisas y por servicios al consumidor que generaba el turismo del continente, instrumentalizando la integración económica a través del estrecho como un mecanismo coercitivo."
 CHI_TAI_lobby_network: "Red de cabildeo en Washington"
 CHI_TAI_lobby_network_desc: "Intereses comerciales alineados con China, laboratorios de ideas (*think tanks*) y consultores políticos establecen una presencia permanente en Washington. La red trabaja para moldear la opinión del Congreso sobre Taiwán, bloqueando la venta de armas y promoviendo el acercamiento con Pekín."
 CHI_TAI_proxy_strategy: "Estrategia global de peones estratégicos"
 CHI_TAI_proxy_strategy_desc: "Pekín fomenta conflictos indirectos (*proxies*) y focos de tensión regionales diseñados para desviar la atención militar y el capital político estadounidenses lejos del estrecho de Taiwán. Cada crisis que arrastra a las fuerzas de los EE. UU. a otros lugares reduce la credibilidad de los compromisos de Washington en el Pacífico."
 CHI_TAI_distract_america: "Distraer a América"
 CHI_TAI_distract_america_desc: "Con los Estados Unidos comprometidos en operaciones militares en el extranjero, Pekín capitaliza la dispersión de recursos y la división de atención de Washington. Cada despliegue activo de los EE. UU. disminuye la probabilidad de una respuesta rápida estadounidense ante una contingencia en el estrecho de Taiwán."
