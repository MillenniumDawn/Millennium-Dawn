 korea_russia.53.t: "Технологии подводных лодок"
 korea_russia.53.d: "Россия предоставила нам более совершенные технологии, благодаря которым мы можем улучшить наши подводные лодки. Все это стало возможным благодаря стремлению северокорейского лидера к разработке атомных подводных лодок."
 korea_russia.53.a: "Благослови нашего Вождя"
 korea.135.t: "Операция по взлому увенчалась успехом."
 korea.135.d: "Наши хакеры проникли в банковскую инфраструктуру западных стран и похитили значительные суммы денег. Часть средств была потеряна по неофициальным каналам, использованным для их перевода на родину, но операция прошла успешно."
 korea.135.a: "отличная работа"
 korea.136.t: "Северная Корея взломала нас."
 korea.136.d: "Северокорейские хакеры совершили кибератаку на нашу банковскую инфраструктуру с целью хищения средств. Мы должны ответить собственными операциями или обратиться к международному сообществу."
 korea.136.a: "Неожиданно."
 korea.137.t: "Наркотики наводняют наши улицы."
 korea.137.d: "На наши улицы хлынула новая волна наркотиков. Источник пока не подтвержден, но действовать нужно осторожно, производительность уже страдает."
 korea.137.a: "Поддержите наркоманов"
 korea.137.b: "Что мы можем сделать"
 korea.138.t: "Операция по борьбе с наркотиками увенчалась успехом."
 korea.138.d: "На улицы наших врагов хлынула новая волна наркотиков. Им придётся тратить деньги на сдерживание кризиса, в то время как мы получим скромную прибыль. Постоянные инвестиции в агентство обеспечат приток денежных средств."
 korea.138.a: "Отличная работа!"
 korea.139.t: "Операция по подделке долларов"
 korea.139.d: "Мы напечатали поддельные стодолларовые купюры и будем распространять их по неофициальным каналам на зарубежных рынках, отмывая вырученные средства через нашу сеть черного рынка. Стабильный доход от этой схемы будет финансировать дальнейшие операции."
 korea.139.a: "Отличная работа!"
 NKO_korean_russian_friendship: "Договор между Северной Кореей и Россией о всеобъемлющем стратегическом партнерстве"
 NKO_korean_russian_friendship_desc: "Договор о партнерстве 2024 года связывает Пхеньян и Москву взаимным соглашением о безопасности, в рамках которого каждая сторона обязуется защищать другую. Наряду с формальными гарантиями углубляется сотрудничество в сфере торговли, энергетики и технологий."
