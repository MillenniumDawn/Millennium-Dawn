 module_naval_surface_fusion_engine_1: "수상함 핵융합 기관 I"
 module_naval_surface_fusion_engine_1_desc: "수상함 핵융합 기관은 고밀도 동력 생성을 통해 첨단 추진력을 제공하며, 뛰어난 항속 시간과 늘어난 해상 항속거리, 향상된 작전 신뢰성을 선사합니다.\n\n§G설계 힌트: 핵융합 추진은 탁월한 속력, 최대 항속거리, 신뢰도를 제공하며 연료 없이 운용됩니다. 최상위 글로벌 함대에 이상적이지만 생산 비용이 높습니다.§!"
 module_naval_surface_fusion_engine_2: "수상함 핵융합 기관 II"
 module_naval_surface_fusion_engine_2_desc: "$module_naval_surface_fusion_engine_1_desc$"
 module_naval_surface_fusion_engine_3: "수상함 핵융합 기관 III"
 module_naval_surface_fusion_engine_3_desc: "$module_naval_surface_fusion_engine_1_desc$"
 module_naval_surface_fusion_engine_4: "수상함 핵융합 기관 IV"
 module_naval_surface_fusion_engine_4_desc: "$module_naval_surface_fusion_engine_1_desc$"
 module_light_surface_diesel_power_1: "경량 디젤 기관 I"
 module_light_surface_diesel_power_1_desc: "소형 수상함에 최적화된 디젤 기관은 효율적인 연료 소비와 함께 안정적인 추진력을 제공합니다.\n\n§G설계 힌트: 경량 디젤 추진은 낮은 생산 비용으로 완만한 속력과 짧은 최대 항속거리를 제공합니다. 저비용 연안 함정에 적합하지만 연료 소모와 수상 가시성이 증가합니다.§!"
 module_light_surface_diesel_power_2: "경량 디젤 기관 II"
 module_light_surface_diesel_power_2_desc: "$module_light_surface_diesel_power_1_desc$"
