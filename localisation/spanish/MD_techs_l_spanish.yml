 module_naval_mineclearing_drone: "Dron de dragado de minas"
 module_naval_mineclearing_drone_desc: "Los drones no tripulados de dragado de minas alejan de las tripulaciones la parte más peligrosa de las operaciones litorales, utilizando vehículos controlados a distancia o semiautónomos para detectar, clasificar y neutralizar minas navales por delante de la flota.\n\n§GConsejo de diseño: Los drones de dragado de minas proporcionan una capacidad de dragado de minas muy alta con una pequeña bonificación de detección de submarinos y un menor uso de combustible que el equipo de dragado convencional. Son ideales para dragaminas especializados, pero cuestan más capacidad industrial (IC) y requieren microchips.§!"
