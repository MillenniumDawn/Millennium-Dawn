 deep_state_economic_allowed_tt: "Деловые интересы военных расползаются по экономике."
 deep_state_economic_blocked_tt: "§GЭкономической экспансии военных поставлен заслон.§!"
 deep_state_media_controlled_tt: "§RВоенные задают тон крупным СМИ.§!"
 deep_state_press_freedom_tt: "§GСвобода прессы отстояна перед нажимом военных.§!"
 deep_state_generals_welcomed_tt: "Отставные генералы вошли в политику."
