 CHI_bri_africa_engagement_desc: "Puntuación acumulada de compromiso de la Franja y la Ruta en África; se requiere junto con las finalizaciones del FOCAC para desbloquear el límite de la integración continental africana."
 CHI_bri_centralasia_engagement_desc: "Puntuación acumulada de compromiso de la Franja y la Ruta en Asia Central; aporta bonificaciones a los corredores del cinturón económico de la Ruta de la Seda."
 CHI_bri_defaulted_projects_desc: "Número de proyectos en los que el beneficiario ha incumplido las condiciones del préstamo; activa la elección entre la reestructuración de la deuda y la incautación de activos."
 CHI_bri_europe_engagement_desc: "Puntuación acumulada de compromiso de la Franja y la Ruta en Europa; necesaria para mantener el mecanismo 17+1 y desbloquear las bonificaciones avanzadas de conectividad europea."
 CHI_bri_latam_engagement_desc: "Puntuación acumulada de compromiso de la Franja y la Ruta en América Latina; se desbloquea al completar proyectos de infraestructura en Venezuela, Ecuador, Brasil, Argentina y Bolivia."
 CHI_bri_meast_engagement_desc: "Puntuación acumulada de compromiso de la Franja y la Ruta en Oriente Medio; influye en las tasas de adopción de la liquidación en petroyuanes."
 CHI_bri_monthly_income_desc: "Ingresos mensuales en renminbis generados por los proyectos activos de la Franja y la Ruta antes de aplicar el multiplicador de rendimiento."
 CHI_bri_pacific_engagement_desc: "Compromiso de China con los Estados insulares del Pacífico: reconocimientos diplomáticos, concesiones pesqueras y de los fondos marinos, y acuerdos de seguridad."
 CHI_bri_predatory_score_desc: "Realiza un seguimiento de la agresividad con la que hemos aplicado tácticas de apalancamiento de deuda e incautación de activos; los valores altos desbloquean el camino de la Doctrina Hambantota y aumentan las oportunidades de pasar del impago a la incautación."
 CHI_bri_project_slots_desc: "Número máximo de proyectos de la Franja y la Ruta que China puede gestionar simultáneamente."
 CHI_bri_returns_multiplier_desc: "Multiplicador aplicado a los flujos de rendimiento de los proyectos; aumenta mediante secretarios del CC activos y ciertas finalizaciones de enfoques."
 CHI_bri_seasia_engagement_desc: "Puntuación acumulada de compromiso de la Franja y la Ruta en el Sudeste Asiático; afecta a la disponibilidad de decisiones de la Cooperación Lancang-Mekong."
 CHI_bri_southasia_engagement_desc: "Puntuación acumulada de compromiso de la Franja y la Ruta en el Sur de Asia; afecta a la velocidad de actualización de niveles y a la magnitud de las bonificaciones para los socios de esta región."
 CHI_bri_winwin_score_desc: "Realiza un seguimiento de la coherencia con la que hemos aplicado condiciones de préstamo concesionales y reformadas; los valores altos desbloquean la diplomacia de reestructuración de deuda y mejoran la buena voluntad del beneficiario."
 CHI_Buffer_State_Doctrine: "Doctrina del Estado tapón"
 CHI_Buffer_State_Doctrine_desc: "Corea del Norte sirve como un tapón estratégico entre nosotros y las fuerzas alineadas con los estadounidenses en Corea del Sur. Al reforzar este papel, nos aseguramos de que Pionyang permanezca firmemente dentro de nuestra esfera de influencia y de que ninguna potencia hostil establezca una presencia en nuestra frontera."
 CHI_chinese_aggression_display: "$CHI_chinese_aggression$: [?CHI_chinese_aggression]"
 CHI_collective_leadership_active_desc: "Siete hombres alrededor de una mesa. La línea general es lo que esos siete hombres acuerden llamar la línea general."
 CHI_Dandong_Lifeline: "La línea vital de Dandong"
 CHI_Dandong_Lifeline_desc: "Dandong maneja la abrumadora mayoría del comercio exterior de Corea del Norte, y el flujo se mueve bajo nuestros términos. Restaurar y expandir este oleoducto y canal de suministro proporciona oxígeno económico a Pionyang al tiempo que consolida nuestra influencia sobre el régimen."
 CHI_Enforce_Sanctions_Compliance: "Hacer cumplir las sanciones"
 CHI_Enforce_Sanctions_Compliance_desc: "Al hacer cumplir genuinamente las sanciones internacionales contra Corea del Norte, demostramos nuestro compromiso con la no proliferación y nos ganamos la buena voluntad de los Estados Unidos y Japón. Pionyang se disgustará, pero nuestra posición en la comunidad internacional mejorará."
 CHI_focus_tree: "Árbol de enfoques de China"
 CHI_Fortress_of_the_East: "Fortaleza del Este"
 CHI_Fortress_of_the_East_desc: "Transformar a Corea del Norte en un Estado tapón impenetrable sirve a nuestra profundidad estratégica. Respaldamos una doctrina de preparación militar total que hace que cualquier ofensiva contra Pionyang sea prohibitivamente costosa para quienes lo intenten."
