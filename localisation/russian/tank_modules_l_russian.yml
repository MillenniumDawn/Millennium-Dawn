 module_tank_exoskeletal_engine_gen3: "Усовершенствованный экзоскелетный двигатель"
 module_tank_exoskeletal_engine_gen3_desc: "Усовершенствованная силовая рама экзоскелета с улучшенной эффективностью, долговечностью и интеграцией управления, обеспечивающая более высокую производительность без постоянных поломок. Это еще больше повышает мобильность и устойчивость к нагрузкам, но остается дорогостоящим и ресурсоемким для масштабного производства."
 module_tank_exoskeletal_engine_gen4: "Передовой экзоскелетный двигатель"
 module_tank_exoskeletal_engine_gen4_desc: "Усовершенствованная силовая рама экзоскелета с улучшенной эффективностью, долговечностью и интеграцией управления, обеспечивающая более высокую производительность без постоянных поломок. Это еще больше повышает мобильность и устойчивость к нагрузкам, но остается дорогостоящим и ресурсоемким для масштабного производства."
 tank_small_medium_cannon_5: "Сверхсовременная лёгкая танковая пушка"
 tank_small_medium_cannon_5_desc: "Благодаря увеличенной дульной скорости и элементам, заимствованным у основных танковых орудий, легкая танковая пушка будущего сможет ответить практически на любую угрозу на поле боя.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 tank_small_medium_cannon_6: "Сверхсовременная лёгкая танковая пушка"
 tank_small_medium_cannon_6_desc: "Благодаря увеличенной дульной скорости и элементам, заимствованным у основных танковых орудий, легкая танковая пушка будущего сможет ответить практически на любую угрозу на поле боя.\n\n§GПодсказка дизайнера: Орудия малого калибра подходят для осколочно-фугасных снарядов из-за меньшей начальной скорости. Используйте их, если хотите отдать предпочтение атаке по пехоте перед атакой по бронетехнике§!"
 tank_small_cannon_5: "Сверхсовременная лёгкая танковая пушка"
 tank_small_cannon_5_desc: "Внедрение нанотехнологий и компьютерного проектирования позволило добиться беспрецедентного прогресса в создании основных орудий будущих легких танков, еще больше повысив живучесть и производительность легких танков."
 tank_small_cannon_6: "Сверхсовременная лёгкая танковая пушка"
 tank_small_cannon_6_desc: "Внедрение нанотехнологий и компьютерного проектирования позволило добиться беспрецедентного прогресса в создании основных орудий будущих легких танков, еще больше повысив живучесть и производительность легких танков."
 tank_medium_cannon_5: "Усовершенствованная пушка среднего танка"
 tank_medium_cannon_5_desc: "Высокотехнологичная пушка среднего танка."
 tank_medium_cannon_6: "Сверхсовременная средняя танковая пушка"
 tank_medium_cannon_6_desc: "Высокотехнологичная пушка среднего танка."
 tank_large_cannon_4: "Сверхсовременная тяжёлая танковая пушка"
 tank_large_cannon_4_desc: "Благодаря улучшенной конструкции снаряды, выпущенные из усовершенствованной тяжелой танковой пушки, будут эффективны как против техники, так и против пехоты.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 tank_large_cannon_5: "Сверхсовременная тяжёлая танковая пушка"
 tank_large_cannon_5_desc: "Благодаря улучшенной конструкции снаряды, выпущенные из усовершенствованной тяжелой танковой пушки, будут эффективны как против техники, так и против пехоты.\n\n§GПодсказка дизайнера: Тяжёлые орудия предназначены в первую очередь для борьбы с бронетехникой. Используйте их, если хотите сделать упор на атаку по бронетехнике, сохранив при этом некоторую атаку по пехоте§!"
 tank_very_large_cannon_4: "Сверхсовременная сверхтяжелая танковая пушка"
 tank_very_large_cannon_4_desc: "Благодаря дополнительному электромагнитному ускорению снаряда, сверхтяжелая танковая пушка сможет пробивать своими снарядами броню, здания и даже бункеры.\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 tank_very_large_cannon_5: "Сверхсовременная сверхтяжелая танковая пушка"
 tank_very_large_cannon_5_desc: "Благодаря дополнительному электромагнитному ускорению снаряда, сверхтяжелая танковая пушка сможет пробивать своими снарядами броню, здания и даже бункеры.\n\n§GПодсказка дизайнера: Сверхтяжёлые орудия предназначены для борьбы с бронетехникой. Используйте их, если хотите сделать значительный упор на атаку по бронетехнике в ущерб атаке по пехоте§!"
 art_small_gun_gen6: "Гипермодернизированная легкая гаубица"
 art_small_gun_gen6_desc: "Лучшие образцы продукции нашего производственного комплекса – эти мобильные артиллерийские орудия будут обрушивать снаряды на любую цель."
 art_small_gun_gen7: "Сверхсовременная легкая гаубица"
 art_small_gun_gen7_desc: "Лучшие образцы продукции нашего производственного комплекса – эти мобильные артиллерийские орудия будут обрушивать снаряды на любую цель."
 art_med_gun_gen6: "Гиперсовременная гаубица"
 art_med_gun_gen6_desc: "Вершина артиллерийских орудий среднего калибра, это орудие сделает так, что на обстреливаемой им территории останется только пыль и земля."
 art_med_gun_gen7: "Сверхсовременная гаубица"
 art_med_gun_gen7_desc: "Вершина артиллерийских орудий среднего калибра, это орудие сделает так, что на обстреливаемой им территории останется только пыль и земля."
 art_big_gun_gen6: "Гиперсовременная гаубица"
 art_big_gun_gen6_desc: "Совершенствование тяжелых стволов и механизмов стрельбы привело к созданию тяжелой дальнобойной артиллерии, чрезвычайно эффективной для тех случаев, когда необходимо действительно уничтожить цель."
 art_big_gun_gen7: "Сверхсовременная гаубица"
 art_big_gun_gen7_desc: "Совершенствование тяжелых стволов и механизмов стрельбы привело к созданию тяжелой дальнобойной артиллерии, чрезвычайно эффективной для тех случаев, когда необходимо действительно уничтожить цель."
 art_med_rocket_gen6: "Гиперпродвинутая РСЗО"
 art_med_rocket_gen6_desc: "Среднеразмерная РСЗО, готовая к одновременной стрельбе несколькими различными ракетами. Эти пусковые установки готовы к перезарядке гораздо быстрее, чем обычные, поэтому способны вести непрерывный огонь без необходимости совместного использования нескольких платформ."
 art_med_rocket_gen7: "Сверхсовременная РСЗО"
 art_med_rocket_gen7_desc: "Среднеразмерная РСЗО, готовая к одновременной стрельбе несколькими различными ракетами. Эти пусковые установки готовы к перезарядке гораздо быстрее, чем обычные, поэтому способны вести непрерывный огонь без необходимости совместного использования нескольких платформ."
 fire_ammo_4: "Сверхсовременные напалмовые боеприпасы"
 fire_ammo_4_desc: "Переключив боевую нагрузку наших ракет на напалм, мы можем повысить эффективность против легкоуязвимых целей. Однако это серьезно затруднит нашу способность бороться с бронетехникой противника."
 fire_ammo_5: "Сверхсовременные напалмовые боеприпасы"
 fire_ammo_5_desc: "Переключив боевую нагрузку наших ракет на напалм, мы можем повысить эффективность против легкоуязвимых целей. Однако это серьезно затруднит нашу способность бороться с бронетехникой противника."
 mine_ammo_4: "Сверхсовременная горнодобывающая ракета"
 mine_ammo_4_desc: "Подобно кассетной ракете, минная ракета распадается на более мелкие части и заполняет целевую область противопехотными или противотранспортными минами."
 mine_ammo_5: "Сверхсовременная горнодобывающая ракета"
 mine_ammo_5_desc: "Подобно кассетной ракете, минная ракета распадается на более мелкие части и заполняет целевую область противопехотными или противотранспортными минами."
 heat_ammo_4: "Сверхсовременные кумулятивные боеприпасы"
 heat_ammo_4_desc: "Снаряды HEAT (High Explosive Anti-Tank) — это специализированный тип боеприпасов, предназначенный для уничтожения вражеской брони. Когда снаряд достигает цели, взрыв создает струю металла, которая пробивает вражескую броню. Это, конечно, означает очень низкую эффективность против пехоты, если только это не прямое попадание."
 heat_ammo_5: "Сверхсовременные кумулятивные боеприпасы"
 heat_ammo_5_desc: "Снаряды HEAT (High Explosive Anti-Tank) — это специализированный тип боеприпасов, предназначенный для уничтожения вражеской брони. Когда снаряд достигает цели, взрыв создает струю металла, которая пробивает вражескую броню. Это, конечно, означает очень низкую эффективность против пехоты, если только это не прямое попадание."
 cluster_ammo_4: "Сверхсовременные кассетные боеприпасы"
 cluster_ammo_4_desc: "Вместо одной большой полезной нагрузки кассетные снаряды несут несколько бомб поменьше. Когда снаряды приближаются к цели, бомбы поменьше сбрасываются. Это усеет область скоплением взрывов поменьше вместо одного большого."
 cluster_ammo_5: "Сверхсовременные кассетные боеприпасы"
 cluster_ammo_5_desc: "Вместо одной большой полезной нагрузки кассетные снаряды несут несколько бомб поменьше. Когда снаряды приближаются к цели, бомбы поменьше сбрасываются. Это усеет область скоплением взрывов поменьше вместо одного большого."
 laser_guided_ammo_4: "Сверхсовременные боеприпасы с лазерным наведением"
 laser_guided_ammo_4_desc: "Снаряд с лазерным наведением сможет менять траекторию полета, используя небольшие управляющие двигатели. Это позволяет снаряду точнее поражать цель."
 laser_guided_ammo_5: "Сверхсовременные боеприпасы с лазерным наведением"
 laser_guided_ammo_5_desc: "Снаряд с лазерным наведением сможет менять траекторию полета, используя небольшие управляющие двигатели. Это позволяет снаряду точнее поражать цель."
 burst_fire_gun_medium_gen4: "Гиперпродвинутый режим стрельбы очередями"
 burst_fire_gun_medium_gen4_desc: "Благодаря усовершенствованному компьютеру наведения и автозаряду артиллерия может производить несколько выстрелов подряд по одной и той же цели, обеспечивая максимальное подавление."
 burst_fire_gun_medium_gen5: "Усовершенствованный режим стрельбы очередями"
 burst_fire_gun_medium_gen5_desc: "Благодаря усовершенствованному компьютеру наведения и автозаряду артиллерия может производить несколько выстрелов подряд по одной и той же цели, обеспечивая максимальное подавление."
 multiple_rounds_medium_gen4: "Гиперпродвинутый режим множественных ударов"
 multiple_rounds_medium_gen4_desc: "Путем последовательной стрельбы несколькими снарядами с разными зарядами топлива и разными дугами стрельбы можно добиться одновременного попадания всех выпущенных снарядов в цель. Для этого требуется высококвалифицированный экипаж и современный баллистический компьютер."
 tank_composite_armor_gen5: "Сверхсовременная композитная броня"
 tank_composite_armor_gen5_desc: "3D-печать, лазерное спекание и наноразмерный глиноземный порошок с углеродными нанотрубками обеспечивают современную броневую защиту наших танков.\n\n§GПодсказка дизайнера: Композитная броня является стандартным вариантом для современных основных боевых танков§!"
 tank_composite_armor_gen6: "Сверхсовременная композитная броня"
 tank_composite_armor_gen6_desc: "3D-печать, лазерное спекание и наноразмерный глиноземный порошок с углеродными нанотрубками обеспечивают современную броневую защиту наших танков.\n\n§GПодсказка дизайнера: Композитная броня является стандартным вариантом для современных основных боевых танков§!"
 tank_battlestation_6: "Гиперсовременная боевая станция"
 tank_battlestation_6_desc: "Комплект камер и передовых систем боевого наблюдения.\n\n§GПодсказка дизайнера: Обеспечение представляет собой артиллерийские системы, управление огнем, оптику и другое вспомогательное оборудование, необходимое для работы танка. Лучшая техника улучшит качество вашего танка в целом§!"
 tank_battlestation_7: "Ультрасовременная боевая станция"
 tank_battlestation_7_desc: "Комплект камер и передовых систем боевого наблюдения.\n\n§GПодсказка дизайнера: Обеспечение представляет собой артиллерийские системы, управление огнем, оптику и другое вспомогательное оборудование, необходимое для работы танка. Лучшая техника улучшит качество вашего танка в целом§!"
 reactive_armor_gen5: "ДЗ 5-го поколения"
 reactive_armor_gen5_desc: "Сверхсовременная динамическая защита, способная работать в различных условиях окружающей среды и снижать эффективность большей части входящего огня.\n\n§GСовет от разработчика: динамическая защита (ДЗ) — это простой способ улучшить броню вашего танка.§!"
 reactive_armor_gen6: "ДЗ 6-го поколения"
 reactive_armor_gen6_desc: "Самая передовая форма динамической защиты, способная работать в различных условиях окружающей среды и снижать эффективность большей части входящего огня.\n\n§GСовет от разработчика: динамическая защита (ДЗ) — это простой способ улучшить броню вашего танка.§!"
 nera_armor_gen4: "Тяжелый NERA 4-го поколения"
 nera_armor_gen4_desc: "Добавление титановых или обедненных урановых пластин особой формы позволяет улучшить общую бронезащиту наших машин.\n\n§GСовет от дизайнера: Тяжелый композит NERA более прочный, но и дороже, чем более простые композитные материалы.§!"
 nera_armor_gen5: "Тяжелый NERA 5-го поколения"
 nera_armor_gen5_desc: "Добавление титановых или обедненных урановых пластин особой формы позволяет улучшить общую бронезащиту наших машин.\n\n§GСовет от дизайнера: Тяжелый композит NERA более прочный, но и дороже, чем более простые композитные материалы.§!"
 hardkill_system_gen3: "Передовой комплекс активной защиты"
 hardkill_system_gen3_desc: "Усовершенствованный комплекс активной защиты сможет останавливать даже быстро летящие бронебойные подкалиберные снаряды и тандемные кумулятивные боеприпасы. Кроме того, он прикрывает танк со всех направлений.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ повысить защищённость наших танков от вражеских ракет. Он также позволит нашей бронетехнике эффективнее прорывать вражеские позиции.§!"
 hardkill_system_gen4: "Сверхсовременный комплекс активной защиты"
 hardkill_system_gen4_desc: "Усовершенствованный комплекс активной защиты сможет останавливать даже быстро летящие бронебойные подкалиберные снаряды и тандемные кумулятивные боеприпасы. Кроме того, он прикрывает танк со всех направлений.\n\n§GПодсказка дизайнера: Комплекс активной защиты — хороший способ повысить защищённость наших танков от вражеских ракет. Он также позволит нашей бронетехнике эффективнее прорывать вражеские позиции.§!"
 medium_tank_chassis_5_desc: "Высокотехнологичный корпус танка."
 medium_tank_chassis_6: "Корпус танка 7-го поколения"
 medium_tank_chassis_6_desc: "Высокотехнологичный корпус танка."
 medium_tank_amphibious_chassis_5: "Корпус БТР 6-го поколения"
 medium_tank_amphibious_chassis_5_desc: "Это более дешевая версия БМП, которая все равно может быть полезна, когда выжить может только человек."
 medium_tank_amphibious_chassis_6: "Корпус БТР 7-го поколения"
 medium_tank_amphibious_chassis_6_desc: "Это более дешевая версия БМП, которая все равно может быть полезна, когда выжить может только человек."
 medium_tank_flame_chassis_5: "Корпус БМП 6-го поколения"
 medium_tank_flame_chassis_5_desc: "Продвинутая и сложная конструкция БМП. Настоящий зверь войны."
 medium_tank_flame_chassis_6: "Корпус БМП 7-го поколения"
 medium_tank_flame_chassis_6_desc: "Продвинутая и сложная конструкция БМП. Настоящий зверь войны."
 medium_tank_artillery_chassis_5: "Корпус самоходной артиллерийской установки 6-го поколения"
 medium_tank_artillery_chassis_5_desc: "Самоходная артиллерия относится к артиллерии, установленной на транспортном средстве, например, использующей шасси транспортного средства для генерации собственной энергии и не требующей буксировки другими транспортными средствами. Большинство из них защищены легкой броней. Артиллерия, как правило, представляет собой гаубицы, минометы, пушки, противотанковые орудия, ракетные установки или зенитные орудия."
 medium_tank_artillery_chassis_6: "Корпус самоходной артиллерийской установки 7-го поколения"
 medium_tank_artillery_chassis_6_desc: "Самоходная артиллерия относится к артиллерии, установленной на транспортном средстве, например, использующей шасси транспортного средства для генерации собственной энергии и не требующей буксировки другими транспортными средствами. Большинство из них защищены легкой броней. Артиллерия, как правило, представляет собой гаубицы, минометы, пушки, противотанковые орудия, ракетные установки или зенитные орудия."
 medium_tank_destroyer_chassis_5: "Корпус лёгкого танка 6-го поколения"
 medium_tank_destroyer_chassis_5_desc: "Роль легких танков — разведка и воздушно-десантные операции, но у них есть недостаток — слабая броня и низкая выживаемость под различными противотанковыми средствами сегодня. В сочетании с появлением пехотных танков развитие легких танков пошло на спад."
 medium_tank_destroyer_chassis_6: "Корпус лёгкого танка 7-го поколения"
 medium_tank_destroyer_chassis_6_desc: "Роль легких танков — разведка и воздушно-десантные операции, но у них есть недостаток — слабая броня и низкая выживаемость под различными противотанковыми средствами сегодня. В сочетании с появлением пехотных танков развитие легких танков пошло на спад."
 medium_tank_aa_chassis_5: "Самоходный зенитный корпус 6-го поколения"
 medium_tank_aa_chassis_5_desc: "Самоходные зенитные средства, также известные как мобильные средства ПВО, относятся к мобильному противовоздушному оружию, на которое устанавливают зенитные пулемёты, зенитные орудия или зенитные ракеты на военной технике. Их можно разделить на самоходные зенитные пушки (самоходные зенитные пушки), самоходные пусковые установки ПВО и самоходные комбинированные системы ПВО с ракетами и артиллерией."
 medium_tank_aa_chassis_6: "Самоходный зенитный корпус 7-го поколения"
 medium_tank_aa_chassis_6_desc: "Самоходные зенитные средства, также известные как мобильные средства ПВО, относятся к мобильному противовоздушному оружию, на которое устанавливают зенитные пулемёты, зенитные орудия или зенитные ракеты на военной технике. Их можно разделить на самоходные зенитные пушки (самоходные зенитные пушки), самоходные пусковые установки ПВО и самоходные комбинированные системы ПВО с ракетами и артиллерией."
 medium_tank_rocket_chassis_5: "Корпус РСЗО 6-го поколения"
 medium_tank_rocket_chassis_5_desc: "Системы РСЗО, состоящие из блоков с несколькими ракетами, предназначены для обстрела местности ракетно-артиллерийским огнем."
 medium_tank_rocket_chassis_6: "Корпус РСЗО 7-го поколения"
 medium_tank_rocket_chassis_6_desc: "Системы РСЗО, состоящие из блоков с несколькими ракетами, предназначены для обстрела местности ракетно-артиллерийским огнем."
 afv_assault_gun_5: "Гиперусовершенствованная штурмовая пушка"
 afv_assault_gun_5_desc: "Управляемые боеприпасы с программируемым взрывателем и автономным отслеживанием цели позволяют эффективно использовать каждый выстрел, даже против быстро движущихся или скрытых целей."
 afv_assault_gun_6: "Сверхсовременная штурмовая пушка"
 afv_assault_gun_6_desc: "Технология направленной энергии и гиперзвукового пороха позволяет увеличить начальную скорость и пробивную способность снаряда сверхвысоких показателей, недостижимых с помощью традиционной баллистики. Ничто, кроме брони основного боевого танка, не находится в безопасности."
 small_autocannon_5: "Гиперусовершенствованная автопушка"
 small_autocannon_5_desc: "Современная автоматическая пушка, не оставляющая следов."
 small_autocannon_6: "Сверхсовременная автопушка"
 small_autocannon_6_desc: "Современная автоматическая пушка, не оставляющая следов."
 big_autocannon_5: "Гиперусовершенствованная тяжелая автопушка"
 big_autocannon_5_desc: "Усовершенствованная автоматическая пушка большого калибра, предназначенная для уничтожения любой брони."
 big_autocannon_6: "Сверхсовременная тяжелая автопушка"
 big_autocannon_6_desc: "Усовершенствованная автоматическая пушка большого калибра, предназначенная для уничтожения любой брони."
 afv_composite_armor_gen5: "Сверхсовременная легкая композитная броня"
 afv_composite_armor_gen5_desc: "Нанослойные реактивные композиты адаптируют свою структуру при ударе, рассеивая кинетическую энергию гораздо эффективнее, чем статические пластины. Защита сопоставима с броней танков первых поколений, но при этом значительно легче."
 afv_composite_armor_gen6: "Сверхсовременная легкая композитная броня"
 afv_composite_armor_gen6_desc: "Электромагнитно-упрочненные интеллектуальные композитные материалы с самовосстанавливающимися матричными слоями представляют собой вершину защиты бронетехники. Броня динамически перераспределяет нагрузку по корпусу, выдерживая попадания, которые вывели бы из строя конструкции более ранних типов."
 afv_coax_autocannon_5: "Гиперусовершенствованная коаксиальная автопушка"
 afv_coax_autocannon_5_desc: "Перспективная автоматическая пушка, используемая в соосном варианте."
 afv_coax_autocannon_6: "Ультрасовременная коаксиальная автопушка"
 afv_coax_autocannon_6_desc: "Перспективная автоматическая пушка, используемая в соосном варианте."
 spaa_naval_cannon_6: "Сверхсовременная морская пушка"
 spaa_naval_cannon_6_desc: "Благодаря использованию передовых материалов и оптимизированной конструкции боеприпасов, эта пушка обеспечивает еще более эффективное поражение незащищенных целей."
 spaa_naval_cannon_7: "Сверхсовременная морская пушка"
 spaa_naval_cannon_7_desc: "Благодаря использованию передовых материалов и оптимизированной конструкции боеприпасов, эта пушка обеспечивает еще более эффективное поражение незащищенных целей."
 spaa_light_autocannon6: "Сверхсовременная автопушка поддержки"
 spaa_light_autocannon6_desc: "Благодаря использованию самых современных производственных технологий, эта пушка обеспечивает высочайшую скорость и эффективность, устанавливая эталон в системах быстрого реагирования."
