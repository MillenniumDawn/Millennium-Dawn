 social_housing_construction_ast: "§GConstruction de logements§!"
 social_housing_construction_ast_2: "§GProjet de logements massif§!"
 the_great_australia_act: "§2La grande loi australienne§!"
 the_great_australia_act_desc: "Peut-être le plus grand programme de réforme sociale de l'histoire de notre pays. Un effort massif pour améliorer l'égalité de l'Australie et sortir des millions de la pauvreté. Avec une couverture vaste de la capacité d'aide sociale, une refonte de l'éligibilité et de l'échelle de couverture, des versements de soutien accrus et un certain nombre de programmes pour aider les Australiens défavorisés à avancer."
 clean_feed_ast: "§OAlimentation propre§!"
 rudd_tax_reform_ast: "§2Réforme fiscale de Rudd§!"
 the_care_act_idea_ast: "Soins pour tous"
 reduced_interstate_regulation_ast: "§2Réglementation interétatique réduite§!"
 paid_parental_scheme_ast: "Régime parental payant"
 paid_parental_scheme_ast_2: "Régime de paiements parentaux"
 paid_parental_scheme_ast_desc: "Donne droit aux nouveaux parents jusqu'à 26 semaines de congé payé. Leur permettant de prendre du temps hors du travail pour mieux soigner leurs nouveau-nés, ou enfants adoptés, et encourager une population croissante."
 paid_parental_scheme_ast_2_desc: "Une fusion de nos dispositifs de soutien parental, remplaçant l'ancien Baby Bonus par des versements financiers pour aider les nouveaux parents. Donne aussi droit jusqu'à 26 semaines de congé payé, et des versements uniques pour mieux soigner leurs nouveau-nés, ou enfants adoptés, et encourager une population croissante."
 social_capitalism_ast: "Le capitalisme social"
 social_capitalism_ast_desc: "Our more hands on approach to managing the economy has come with some benefits, and some minor downsides. We can more directly influence our economy and ensure that it remains aligned to the benefit of our citizens by utilising regulation and direct management. As we work on implementing the approach, our methods will become more refined. \n§W--------------§!\nThis national spirit will be §RRemoved§! if Kevin Rudd is not Prime Minister."
 building_the_education_revolution_ast: "§GBâtir la révolution éducative§!"
 a_new_era_ast: "Une nouvelle ère"
 a_new_era_ast_desc: "Notre nation est entrée dans une nouvelle ère d'égalité. Par le travail constant du plus grand nombre, l'avenir est désormais plus lumineux pour tous les Australiens…"
 ast_a_national_agreement_tt: "Des programmes de soutien à la communauté autochtone seront débloqués dans l'onglet des §2décisions§! politiques."
 ast_closing_the_gap_tt: "Il faudra du temps avant de voir les §Grésultats§! de ces programmes…"
 nrf_ast: "Fondation nationale de réconciliation"
 nrf_ast_desc: "Si nous voulons assurer que le cadre d'une réconciliation proactive existe après notre mandat, nous devons créer un organe organisationnel dédié au financement de projets qui font la différence."
 sihip_ast: "Programme stratégique de logement et d'infrastructure autochtones (SIHIP)"
 sihip_ast_desc: "Les membres aborigènes du Territoire du Nord ont sans doute eu la vie la plus dure ces dernières années. Le logement, parmi bien d'autres choses, est tombé en délabrement, et a un besoin urgent de rénovations."
 family_reunion_services_ast: "Services de regroupement familial"
 family_reunion_services_ast_desc: "Nous pouvons commencer à développer un programme de recherche familiale, de réunion et de services de conseil pour les Aborigènes et insulaires du détroit de Torrès qui ont été retirés de force de leurs familles pendant les Générations volées."
 rural_job_initiative_ast: "Initiative pour l'emploi rural"
 rural_job_initiative_ast_desc: "Travailler avec certains de nos plus grands bienfaiteurs comme Andrew Forrest pour créer des projets publics et privés, embauchant des locaux pour la majorité du travail, stimulera l'opportunité pour certaines de nos communautés souffrant de sécheresses d'emploi."
 seasonal_worker_visas_ast: "§2Visas pour travailleurs saisonniers§!"
 ast_keep_the_gears_turning_tt: "De nouveaux efforts pour tenir nos engagements de sécurité seront disponibles dans l'onglet des §2décisions§!."
 trans_tasman_trade_deal: "Accord commercial trans-tasmanien"
 fruits_of_the_summit: "Fruits du sommet"
 toughen_up_on_boat_arrivals_ast: "Durcir le traitement des arrivées par bateau"
 toughen_up_on_boat_arrivals_ast_desc: "Un problème constant à la une est celui des demandeurs d'asile arrivant par bateau. Il n'y a pas de solution facile pour le régler, mais si nous ne prenons pas position contre eux, l'opposition le fera, et ce ne sera plus qu'un bâton dont elle pourra se servir contre nous."
 strengthen_police_funding_ast: "Renforcer le financement de la police"
 strengthen_police_funding_ast_desc: "Pour aider face à la hausse de la violence de gangs et des groupes extrémistes, nous pouvons étoffer nos départements de financement pour sécuriser un meilleur équipement et former plus de personnel."
 stack_the_branches_ast: "Remplir les branches"
 stack_the_branches_ast_desc: "Des demandes sont venues de certains de nos soutiens influents de droite pour glisser un certain nombre de membres éminents du parti dans notre gouvernement, qui se trouvent tous être de la faction Labor Right. Cela pourrait ramener du soutien au sein du parti au risque de paraître un peu copinage."
 pause_on_tariffs_ast: "Pause sur les tarifs douaniers"
 pause_on_tariffs_ast_desc: "Quand notre commerce s'affaisse, notre meilleur coup est de « relâcher la corde » sur les tarifs des biens ou services essentiels, au coût d'un revenu à court terme."
 pacific_islands_forum: "Forum des îles du Pacifique récemment tenu"
 pacific_islands_forum_tt: "De nouvelles §2décisions§! pour interagir avec les nations insulaires du Pacifique deviendront disponibles dans l'onglet des missions internationales."
 forward_with_fairness_ast: "§2Lieux de travail réformés§!"
 worker_protection_act_ast: "§2Protections des travailleurs§!"
 the_nation_is_in_crisis_ast: "La nation est en §Rcrise !§!"
 legislation_blocked_ast: "Notre législation est bloquée."
 ets_1_ast: "§GMarché des quotas d'émission§!"
 asean_partner: "Partenaire de l'ASEAN"
 asean_partner_desc: "The ASEAN forum is a diverse set of economies united over an investment into economic prosperity. Over 680 million people, and a modest chunk of the global GDP. By tapping into it as a partner we stand to benefit sizeably."
 rudd_aghan_troops: "Envoyer des casques bleus en Afghanistan"
 rudd_iraq_troops: "Envoyer des casques bleus en Irak"
 rudd_pak_troops: "Envoyer des casques bleus au Pakistan"
 rudd_congo_troops: "Envoyer des casques bleus au Congo"
 rudd_sk_mission: "Mission en Corée du Sud"
 rudd_sk_mission_desc: "To preempt our plans for a Pacific Union, we need to touch base with each nation and determine if they're open to the concept."
 rudd_jap_mission: "Mission au Japon"
 rudd_jap_mission_desc: "Pour précéder nos plans d'une Union du Pacifique, il faut prendre contact avec chaque nation et déterminer si elles sont ouvertes au concept."
 ast_something_new_tt: "Missions to aid our goal of creating a §YPacific Union§! will become available in the §2decisions§! tab."
 wildlife_conservation_act: "§GLoi modifiée sur la conservation de la biodiversité§!"
 ast_walkable_cities_tt: "Des projets pour améliorer nos §Yrues§! deviendront disponibles dans l'onglet des §2décisions§! industrielles."
 commonwealth_research_endowment_ast: "Dotation à la recherche du Commonwealth"
 shelved_research_grants_ast: "Financement de la recherche réduit"
 problem_with_the_boats: "Manifestations contre l'immigration"
 problem_with_the_boats_desc: "Protests have broken out across the country, our police are overwhelmed and counter protests have spiralled into riots. As a result right-wing political groups are enjoying an uptick in support, and along with the media, continue to throw fuel on top of the fire. \n\n§RThe cracks are beginning to show.§!"
 problem_with_the_boats_2: "Manifestations des demandeurs d'asile"
 problem_with_the_boats_2_desc: "Des manifestations ont éclaté à travers le pays, notre police est débordée et les contre-manifestations ont dégénéré en émeutes. Les médias qui les couvrent et notre gouvernement ne font qu'ajouter de l'huile sur le feu. \n\n§RLes fissures commencent à se voir.§!"
 national_online_registry_ast: "§2Registre national en ligne§!"
 indian_military_collaboration_ast: "Partenariat de défense indien"
 australia_abroad_ast: "L'Australie à l'étranger"
