 support_ship_hull_desc: "Les navires de soutien jouent un rôle indispensable dans la flotte."
 support_ship_1_desc: "Les navires de soutien jouent un rôle indispensable dans la flotte."
 support_ship_2_desc: "Les navires de soutien jouent un rôle indispensable dans la flotte."
 repair_ship_hull_desc: "Le rôle de la réparation navale dans la guerre sur mer ne doit pas être sous-estimé.\n\n§YNOTE :§! Le navire de réparation réduit l'usure, l'impact des coups critiques et augmente les chances de récupération des navires de la flotte dans laquelle il se trouve."
 repair_ship_1_desc: "Le rôle de la réparation navale dans la guerre sur mer ne doit pas être sous-estimé.\n\n§YNOTE :§! Le navire de réparation réduit l'usure, l'impact des coups critiques et augmente les chances de récupération des navires."
 repair_ship_2_desc: "Le rôle de la réparation navale dans la guerre sur mer ne doit pas être sous-estimé. Le navire de réparation amélioré étend les capacités de sa version précédente.\n\n§YNOTE :§! Le navire de réparation réduit l'usure, l'impact des coups critiques et augmente les chances de récupération des navires."
 EQ_MOD_CAT_module_screen_fire_control_system_category_TITLE: "Système de contrôle de tir (écran)"
 EQ_MOD_CAT_module_capital_fire_control_system_category_TITLE: "Système de contrôle des incendies (Capitale)"
 module_screen_analog_fire_control: "Système de contrôle d'incendie analogique"
 module_screen_analog_fire_control_desc: "Les systèmes analogiques de contrôle de tir se décrivent au mieux comme des systèmes à commande manuelle.\n\n§GIndice du concepteur : le contrôle de tir améliore l'attaque de canon, les missiles antinavires, la perforation AShM, la DCA et le blindage, rendant un navire armé plus efficace dans plusieurs rôles. Les systèmes avancés offrent de plus forts bonus mais coûtent plus de CI et de puces.§!\n\n§WUtiliser ceci comme arme principale créera un§! §Bnavire d'écran§!"
 module_screen_digital_integrated_fire_control: "Système de contrôle de tir intégré numérique"
 module_screen_digital_integrated_fire_control_desc: "Des interfaces numériques intégrées aux systèmes permettent un commandement et une maintenance plus efficaces depuis la passerelle du navire.\n\n§GIndice du concepteur : le contrôle de tir améliore l'attaque de canon, les missiles antinavires, la perforation AShM, la DCA et le blindage, rendant un navire armé plus efficace dans plusieurs rôles. Les systèmes avancés offrent de plus forts bonus mais coûtent plus de CI et de puces.§!\n\n§WUtiliser ceci comme arme principale créera un§! §Bnavire d'écran§!"
 module_screen_advanced_integrated_missile_radar_control: "Contrôle radar intégré de missiles avancé"
