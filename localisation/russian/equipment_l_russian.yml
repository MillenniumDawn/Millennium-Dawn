 GER_transport_helicopter_2: "CH-53G"
 GER_transport_helicopter_2_desc: "CH-53G — американский тяжёлый транспортный вертолёт, изначально разработанный компанией Sikorsky Aircraft и выпускавшийся по лицензии VFW-Fokker. CH-53G имеет экипаж из четырёх человек: пилота, второго пилота, старшего техника и воздушного наблюдателя. Он может перевозить различные грузы, включая до 38 полностью экипированных военнослужащих, внутреннюю нагрузку до 8 000 фунтов (3 600 кг) или внешнюю нагрузку до 13 000 фунтов (5 900 кг) на крюке с одинарной подвеской."
