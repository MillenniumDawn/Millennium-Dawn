 JAP_jsw_tank_mio_trait_type75_rocket_launcher: "75식 로켓 발사기"
 JAP_jsw_tank_mio_trait_muroran_launcher_tubes: "무로란 발사관"
 JAP_private_investment_climate_payoff_tt: "§Y180§!일 후 기업 신뢰가 돌아오며 일본이 §Y$JAP_improvement_private_investment_climate_idea$§!을(를) 얻습니다"
 JAP_earthquake.1.t: "[?JAP_quake_state.GetName]을(를) 덮친 지진"
 JAP_earthquake.1.d: "[?JAP_quake_state.GetName]에 강진이 발생했습니다. 일본 기상청은 진앙 인근에서 진도 6의 흔들림이 관측되었으며 인접 현 전역에서도 진동이 느껴졌다고 보고합니다. 도로가 휘어졌고, 선로 점검을 위해 철도 운행이 중단되었으며, 여러 공장이 구조적 손상 여부를 확인하기 위해 생산을 멈췄습니다. 지방 정부는 사상자 규모를 파악하고 도쿄에 지원을 요청하고 있습니다."
 JAP_earthquake.2.t: "다음 지진에도 견디도록"
 JAP_earthquake.2.d: "마지막 지역까지 내진 조사를 통과했으며, 동일본 대지진으로 파괴되었던 지역의 재건이 완료되었습니다. 병원과 시청은 면진 장치 위에 서 있고, 오래된 학교는 보강되거나 새로 지어졌으며, 고속도로 교각에는 강철 보강대가 둘러져 있습니다. 일본은 땅의 흔들림을 막을 수는 없지만, 역사상 처음으로 큰 지진이 더 이상 국가 비상사태가 아니게 되었습니다."
 JAP_earthquake.2.a: "우리는 준비되었다."
 JAP_ykk_group_tt: "[JAP_ykk_idea_desc]"
 JAP_worker_wellbeing: "[JAP.GetFlag] §Y[JAP.GetAdjectiveCap] 노동자 복지§!"
 JAP_karoshi_wellbeing_tt: "$JAP_worker_wellbeing$: $RIGHT|+=0$"
 JAP_ministry_officials_named: "노동성 관료 실명 공개"
 JAP_ministry_officials_named_desc: "신세이 계약은 공개되었고 서명한 관료들의 이름도 공개되었습니다. 노동성은 정책을 운영하는 대신 한 해 내내 질문에 답하며 보내고, 노동성과 거래하는 모든 기업은 소란이 가라앉기를 기다립니다."
 JAP_bank_under_public_ownership: "공적 소유 은행"
 JAP_bank_under_public_ownership_desc: "국가가 주요 은행을 소유하고 이사회를 교체했습니다. 대출은 정부의 조건으로 재개되며, 이는 차입자들에게는 환영받지만 이를 해명해야 하는 장관들에게는 상시적인 곤혹입니다."
 JAP_ring_of_fire: "불의 고리 위에서 살다"
 JAP_ring_of_fire_desc: "네 개의 지각판이 일본 열도 아래에서 만나며, 전 세계 규모 6 이상 지진의 5분의 1이 이곳을 강타합니다. 주택의 3분의 2는 1981년 건축기준법 이전에 지어졌습니다. 몇 년마다 한 번씩 지진이 고속도로를 갈라놓고, 신칸센을 탈선시키거나 공장을 멈춰 세우며, 재난 예산은 국가 회계에서 영구적인 항목입니다.\n-------------\n지진은 계속해서 §Y[609.GetName]§!, §Y[610.GetName]§!, §Y[611.GetName]§!, §Y[613.GetName]§!, §Y[615.GetName]§!, §Y[616.GetName]§!, §Y[617.GetName]§!을(를) 강타할 것입니다. §Y$JAP_seismic_retrofit_category$§!을(를) 거친 지역은 지진에 더 잘 대비하게 됩니다\n§G제거 조건§!: 지진 다발 지역이 모두 내진 보강을 마치고 §Y$JAP_reconstruction_completed_focus$§! 중점을 완료해야 합니다."
 JAP_galapagos_syndrome_focus_idea: "갈라파고스 프리미엄"
 JAP_galapagos_syndrome_focus_idea_desc: "노동성이 수렴과 상품화를 두고 논쟁하는 동안, 무역 담당 부처들은 뻔한 일을 합니다. 그 차이를 파는 것입니다. 국내 반도체 라인은 프리미엄을 붙여 가동되고, 표준화 대표단은 일본 규격을 해외로 밀어붙이며, 공정 연구는 속도를 유지합니다. 이 방식은 그 밑바닥의 결정을 위한 시간을 벌어 주지만 오래가지는 않습니다."
 JAP_galapagos_openness_tt: "[JAP.GetFlag] §Y[JAP.GetAdjectiveCap] 개방성§! $RIGHT|+=0$"
 JAP_case_files: "§Y사건 자료§!"
 JAP_obstruction: "§Y방해§!"
 JAP_imperial_movement_modifier: "제국 부활 운동"
 raid_type_JAP_raid_sikhalin: "사할린 해군 기지 습격"
 raid_type_JAP_raid_sikhalin_desc: "일본 해병대가 사할린에 상륙하여 러시아 해군 기지를 타격함으로써, 북방 섬들에 관한 협상 거부를 모스크바가 재고하도록 압박합니다."
 JAP_sakhalin_raid_unlocked: "§Y사할린§! 습격이 승인되었습니다"
 JAP_article9_mission_explainer_tt: "이 임무는 30일마다 자동으로 완료되어 아래에 나열된 §Y제9조§! 효과를 줄이며, 해당 효과가 0이 될 때까지 다시 시작됩니다. 제9조 임무 세 가지를 모두 종료하면 §Y국방 능력 공식화§!가 잠금 해제됩니다."
 JAP_historical.20160327.t: "민주당 창당"
 JAP_historical.20160327.d: "일본 민주당이 일본유신당 및 소규모 개혁 그룹들과 합당하여 새로운 야당인 민주당(민신토)을 창당했습니다.\n\n합당한 이 정당은 국회 내 자민당 이외의 야권 대부분을 한 깃발 아래 모아, 다가오는 참의원 선거를 앞두고 유권자들에게 집권 연정의 믿을 만한 대안을 제시하려 합니다."
 JAP_historical.20160327.a: "야권이 결속한다."