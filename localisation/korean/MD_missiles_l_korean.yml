 COM_CIV_STATS_TT_DELAYED: "£GFX_satellite_coverage_texticon  §Y전 지구적 도달범위§!: 이 체계 등급에서 최대 가능한 위성 수 대비 연결된 §Y[COM_civ_level_gui]§!의 비율입니다.\n£GFX_sat_network_traffic_texticon  §Y네트워크 트래픽§!: 체계가 제한 없이 처리할 수 있는 총 수신기 수에 대한 활성 수신기의 비율입니다 (체계 등급 이상의 모든 £GFX_COM_satellite_texticon 위성은 그 수신기 용량에 합산됩니다). 한도에 도달하면 §R100%§!를 초과하는 매 1% 포인트마다 보너스가 §R1%§! 감소합니다. 각 §Y주(State)§!는 §Y100§!개의 수신기를 가집니다. 다른 국가들이 위성 체계에 접근할 수 있는 경우, 그들의 수신기도 더해집니다.\n£GFX_satellite_bonus_texticon  §Y체계 보너스§!: §g위성 통신 체계§!가\n§Y정치력 획득\n암호화\n복호화\n정보 네트워크 강도 증가율\n작전 효율§!\n에 제공하는 §G보너스§! 비율입니다. 보너스는 체계의 최대치로 제한됩니다."
