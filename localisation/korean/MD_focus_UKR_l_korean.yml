 ukr_modernize_sov_equipment_pt76_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_pt76_for_tooltip\n\n\n\n\n\n\n\n\n§W비축된 §YPT-76B§!를 더는 원하는 곳이 없습니다. 폐기에는 남은 수량에 따라 §R1천만~2천만§!이 들지만, 하르키우의 공장들이 1년 동안 §G마이크로칩, 알루미늄, 강철§!을 되돌려 받습니다.§!"
 ukr_modernize_sov_equipment_2k11_caucasus_offer: "캅카스에 비축 §Y2K11 Krug§! 제안"
 ukr_modernize_sov_equipment_2k11_caucasus_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_2k11_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[GEO.GetNameWithFlag]§!, §Y[AZE.GetNameWithFlag]§!, §Y[ARM.GetNameWithFlag]§! 모두 장거리 방공 능력을 원합니다. 비축된 §Y2K11 Krug§!를 이 가운데 한 나라에 팔 수 있으며, 최대 2개 대대, 즉 발사대 9기를 갖춘 3개 포대로 이뤄진 대대 둘까지입니다.\n선택받지 못한 나라는 §R반감을 품습니다§!.§!"
 ukr_modernize_sov_equipment_2k11_central_asia_offer: "중앙아시아에 비축 §Y2K11 Krug§! 제안"
 ukr_modernize_sov_equipment_2k11_central_asia_offer_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_2k11_for_tooltip\n\n\n\n\n\n\n\n\n§W§Y[KAZ.GetNameWithFlag]§!, §Y[TRK.GetNameWithFlag]§!, §Y[KYR.GetNameWithFlag]§!은(는) 비축된 §Y2K11 Krug§! 최대 2개 대대를 살 수 있습니다.\n§Y[SOV.GetNameWithFlag]§!은(는) 이 지역을 자기 영향권으로 여기며, 그 압력이 §R구매국을 겁먹게 할 수 있습니다§!. 한 나라가 물러서면 다른 나라들에 시도할 수 있습니다.§!"
 ukr_modernize_sov_equipment_2k11_scrap: "비축 §Y2K11 Krug§! 폐기"
 ukr_modernize_sov_equipment_2k11_scrap_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_2k11_for_tooltip\n\n\n\n\n\n\n\n\n§W비축된 §Y2K11 Krug§!를 더는 원하는 곳이 없습니다. 폐기에는 남은 수량에 따라 §R1천만~2천만§!이 들지만, 하르키우의 공장들이 1년 동안 §G마이크로칩, 강철, 고무§!를 되돌려 받습니다.§!"
 ukr_modernize_sov_equipment_btr50_orders_tt: "구매국이 넣을 수 있는 주문:\n• §Y13§!대 규모 소대: 우리에 대한 호감도 §Y10§! 이상이 필요합니다.\n• §Y40§!대 규모 중대: 우리에 대한 호감도 §Y25§! 이상이 필요합니다.\n대금은 인도 시 지불합니다."
 ukr_modernize_sov_equipment_pt76_orders_tt: "§Y40§!대 규모 대대: 구매국의 우리에 대한 호감도 §Y20§! 이상이 필요합니다. 대금은 인도 시 지불합니다."
 ukr_modernize_sov_equipment_2k11_orders_tt: "구매국이 넣을 수 있는 주문 (대대는 발사대 9기를 갖춘 3개 포대):\n• 발사대 §Y27§!기의 1개 대대: 우리에 대한 호감도 §Y10§! 이상이 필요합니다.\n• 발사대 §Y54§!기의 2개 대대: 우리에 대한 호감도 §Y25§! 이상이 필요합니다.\n지역마다 최대 2개 대대까지만 팝니다."
 ukr_modernize_sov_equipment_storage_indonesia_bundle_tt: "§Y[IND.GetNameWithFlag]§!이(가) 이미 우리 §YBTR-50§! 또는 §YPT-76B§!를 구매했다면, 다른 거래에 필요한 우리에 대한 호감도가 §G10 낮아짐§!"
 ukr_modernize_sov_equipment_btr50_egypt_bonus_tt: "§Y[EGY.GetNameWithFlag]§!이(가) 우리 §YBTR-50§!를 구매하면, 우리 §YT-62-5TDF§! 제안과 계약에 필요한 그 나라의 호감도가 §G10 낮아짐§!"
 ukr_modernize_sov_equipment_2k11_caucasus_rivals_tt: "선택받지 못한 두 나라의 우리에 대한 호감도 §R-15§!"
 ukr_modernize_sov_equipment_2k11_russia_tt: "§Y[SOV.GetNameWithFlag]§!이(가) 구매국을 설득해 거래를 무산시킬 수 있음. 그 나라에서 그쪽 영향력이 우리보다 클수록 구매국이 물러설 §R가능성이 높아짐§!."
