 air_module_hypersonic_engine_jet_1_desc: "Гиперзвуковые двигатели обеспечивают экстремальную тягу и высокоскоростные лётные характеристики, позволяя осуществлять стремительный перехват и ударные профили с улучшенной манёвренностью на скорости.\n\n§GПодсказка дизайнера: Гиперзвуковые двигатели очень дороги в производстве, но дают исключительную скорость и высокую манёвренность.§!"
