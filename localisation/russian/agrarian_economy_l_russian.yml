 AGRI_experiencing_drought_TT: "Сейчас испытывает §Yзасуху§!"
 AGRI.1.t: "Возможная засуха..."
 AGRI.1.d: "Наши ведущие учёные и эксперты Министерства сельского хозяйства обеспокоены возможностью засухи в ближайшее время, дождей, похоже, тоже не прогнозируется... надеемся, что мы подготовились ко всем вариантам."
 AGRI.1.A: "Скрестим пальцы..."
 AGRI.2.t0: "Учёные ошиблись!"
 AGRI.2.d0: "К счастью, в этом случае учёные и эксперты ошиблись, на этот раз засухи нам удалось избежать, но в следующий раз нам может так не повезти..."
 AGRI.2.A: "Нам надо подготовиться к плохому урожаю..."
 AGRI.2.B: "Плохой урожай? А как насчет ужасного?"
 AGRI.2.C: "Незачем! В этот раз обошлось, обойдётся и в следующий!"
 AGRI.2.t1: "Учёные оказались правы! Отчасти"
 AGRI.2.d1: "Учёные и эксперты были правы лишь отчасти: засуха, хотя и случилась, по всей видимости, локализована лишь в одном-двух регионах [ROOT.GetName]. Справиться с ней будет несложно, хотя она может распространиться на любые соседние регионы, если мы не решим проблему."
 AGRI.2.D: "Всё не так уж плохо, пусть идёт своим чередом."
 AGRI.2.E: "Мы можем выделить немного денег, чтобы помочь исправить ситуацию."
 AGRI.2.F: "Это требует незамедлительных действий!"
 AGRI.2.G: "Возможно, это лишнее, но лучше перестраховаться."
 AGRI.2.t2: "Учёные оказались правы!"
 AGRI.2.d2: "Сегодня засуха нанесла самый сильный удар, уже погибли десятки людей, и ожидается, что ещё многие станут жертвами стихии в ближайшие недели, поэтому нам необходимо принять срочные меры, чтобы эта тяжелая ситуация не стала ещё хуже."
 AGRI.2.H: "У нас нет другого выбора, кроме как позволить этому идти своим чередом."
 AGRI.2.I: "Это не решит всех проблем, но это лучше, чем ничего."
 AGRI.2.J: "Надеюсь, это поможет нам продержаться до следующих дождей."
 AGRI.2.K: "Слава Богу, что у нас есть такие ресурсы, используйте столько, сколько нужно!"
 AGRI.2.t3: "Катастрофическая засуха!"
 AGRI.2.d3: "Это настоящая катастрофа... сотни людей погибли из-за сильнейшей засухи, которая, по всей видимости, охватила всю страну [ROOT.GetName], и есть основания полагать, что она, скорее всего, распространится и на соседние страны. Нам необходимо взять ситуацию под контроль, если это возможно..."
 AGRI.2.L: "Мы не можем остановить это, прости нас, Господи..."
 AGRI.2.M: "Если бы только у нас было больше возможностей остановить эту катастрофу!"
 AGRI.2.N: "Этого недостаточно, но это должно смягчить худшее."
 AGRI.2.O: "Наши резервы богаты, и этого будет достаточно, хотя и обойдётся дорого..."
 AGRI_neighbour.1.t: "Локальная засуха в [FROM.GetName]!"
 AGRI_neighbour.1.d: "Один из наших соседей, [FROM.GetName], переживает засуху. К счастью, она, похоже, носит локальный характер и не потребует большой помощи, чтобы её остановить. Тем не менее, мы могли бы направить некоторую помощь, чтобы завоевать расположение нашего соседа."
 AGRI_neighbour.1.A: "Предоставить помощь [FROM.GetName]"
 AGRI_neighbour.1.B: "Мы можем на этом нажиться!"
 AGRI_neighbour.1.C: "Что с нашими запасами?"
 AGRI_neighbour.1.D: "Помощь? Пусть сами себе помогут!"
 AGRI_neighbour.10.t: "Наш сосед [FROM.GetName] посылает нам помощь!"
 AGRI_neighbour.10.d: "[FROM.GetName], похоже, знает, что значит быть хорошим соседом, и отправил нам немного помощи, чтобы остановить волну засухи."
 AGRI_neighbour.10.A: "Чудесно"
 AGRI_neighbour.100.t: "Наши соседи из [FROM.GetName] отказались послать помощь!"
 AGRI_neighbour.100.d: "[FROM.GetName] показывает нам, что в критической ситуации на них нельзя полагаться, и хотя с этой засухой мы, безусловно, можем справиться самостоятельно, было бы неплохо получить помощь."
 AGRI_neighbour.100.A: "Что ж, с этим мы справимся и сами."
 AGRI_neighbour.2.t: "Крупная засуха в [FROM.GetName]!"
 AGRI_neighbour.2.d: "Один из наших соседей, [FROM.GetName], страдает от засухи. Изначально эксперты предсказывали, что она будет локальной, но они ошиблись. Похоже, ситуация может оказаться хуже, чем предполагалось. [FROM.GetName] очень выиграет от нашей помощи и, возможно, даже откроет нам свои двери в будущем."
 AGRI_neighbour.2.A: "Предоставить помощь [FROM.GetName]"
 AGRI_neighbour.2.B: "Мы можем на этом нажиться!"
 AGRI_neighbour.2.C: "Что с нашими запасами?"
 AGRI_neighbour.2.D: "Руки не из того места."
 AGRI_neighbour.20.t: "Наш сосед [FROM.GetName] посылает нам помощь!"
 AGRI_neighbour.20.d: "[FROM.GetName], похоже, знает, что значит быть хорошим соседом, и отправил нам немного помощи, чтобы остановить волну засухи."
 AGRI_neighbour.20.A: "Чудесно"
 AGRI_neighbour.200.t: "Наши соседи из [FROM.GetName] отказались послать помощь!"
 AGRI_neighbour.200.d: "[FROM.GetName] показывает нам, что в крайнем случае на них нельзя положиться, и, по-видимому, [FROM.GetName] оставил нас без поддержки."
 AGRI_neighbour.200.A: "Ублюдки."
 AGRI_neighbour.3.t: "Катастрофическая засуха в [FROM.GetName]!"
 AGRI_neighbour.3.d: "Один из наших соседей, [FROM.GetName], страдает от засухи. Когда-то эксперты считали, что с этим легко справиться, но они ошибались. Земля в [FROM.GetName] выглядит так, будто в обозримом будущем останется совершенно сухой и бесплодной. Если мы хотим помочь соседу, помощь должна быть немедленной и существенной. Мы не можем позволить природе победить в этот раз."
 AGRI_neighbour.3.A: "Предоставить помощь [FROM.GetName]"
 AGRI_neighbour.3.B: "Мы можем на этом нажиться!"
 AGRI_neighbour.3.C: "Что с нашими запасами?"
 AGRI_neighbour.3.D: "Мы сейчас заняты!"
 AGRI_neighbour.30.t: "Наш сосед [FROM.GetName] посылает нам помощь!"
 AGRI_neighbour.30.d: "[FROM.GetName], похоже, знает, что значит быть хорошим соседом, и отправил нам значительную сумму помощи, чтобы остановить волну засухи."
 AGRI_neighbour.30.A: "Слава Богу!"
 AGRI_neighbour.300.t: "Наши соседи из [FROM.GetName] отказались послать помощь!"
 AGRI_neighbour.300.d: "[FROM.GetName] показывает нам, что в крайнем случае на них нельзя положиться, Бог и [FROM.GetName] покинули нас."
 AGRI_neighbour.300.A: "Где [FROM.GetAdjective] флаги? Надо их сжечь!"
 AGRI_influencer.1.t: "Локальная засуха в [FROM.GetName]!"
 AGRI_influencer.1.d: "[FROM.GetName] переживает засуху, к счастью, она, похоже, носит локальный характер и не потребует большой помощи, чтобы остановить её. Тем не менее, мы могли бы направить некоторую помощь, чтобы завоевать расположение этой страны."
 AGRI_influencer.1.A: "Предоставить помощь [FROM.GetName]"
 AGRI_influencer.1.B: "Звучит как их проблема."
 AGRI_influencer.10.t: "[FROM.GetName] послало нам помощь!"
 AGRI_influencer.10.d: "[FROM.GetName] делает больше, чем должен делать дипломатический партнёр, и направил нам небольшую помощь, чтобы остановить засуху."
 AGRI_influencer.10.A: "Чудесно"
 AGRI_influencer.100.t: "[FROM.GetName] отказалось послать нам помощь!"
 AGRI_influencer.100.d: "[FROM.GetName] показывает нам, что в критической ситуации на них нельзя полагаться, и хотя с этой засухой мы, безусловно, можем справиться самостоятельно, было бы неплохо получить помощь."
 AGRI_influencer.100.A: "Что ж, с этим мы справимся и сами."
 AGRI_influencer.2.t: "Крупная засуха в [FROM.GetName]!"
 AGRI_influencer.2.d: "[FROM.GetName] переживает довольно сильную засуху. Изначально эксперты предсказывали, что она будет локальной, но ошиблись. Похоже, ситуация может оказаться хуже, чем предполагалось. [FROM.GetName] очень выиграет от нашей помощи и, возможно, даже откроет нам свои двери в будущем."
 AGRI_influencer.2.A: "Предоставить помощь [FROM.GetName]"
 AGRI_influencer.2.B: "Мы не выиграем от помощи."
 AGRI_influencer.20.t: "[FROM.GetName] послало нам помощь!"
 AGRI_influencer.20.d: "[FROM.GetName] делает больше, чем должен делать дипломатический партнёр, и направил нам помощь, чтобы остановить засуху."
 AGRI_influencer.20.A: "Чудесно"
 AGRI_influencer.200.t: "[FROM.GetName] отказалось послать нам помощь!"
 AGRI_influencer.200.d: "[FROM.GetName] показывает нам, что в крайнем случае на них нельзя положиться, и, по-видимому, [FROM.GetName] оставил нас без поддержки."
 AGRI_influencer.200.A: "Ублюдки."
 AGRI_influencer.3.t: "Катастрофическая засуха в [FROM.GetName]!"
 AGRI_influencer.3.d: "[FROM.GetName] переживает довольно сильную засуху. Первоначально эксперты предсказывали, что она будет локальной, но они ошиблись. Похоже, что земля в [FROM.GetName] в обозримом будущем останется совершенно сухой и бесплодной. Если мы хотим им помочь, наши действия должны быть незамедлительными и существенными. Мы не можем позволить природе победить в этот раз."
 AGRI_influencer.3.A: "Предоставить помощь [FROM.GetName]"
 AGRI_influencer.3.B: "И что мы от этого получим?"
 AGRI_influencer.30.t: "[FROM.GetName] посылает нам помощь!"
 AGRI_influencer.30.d: "[FROM.GetName] делает больше, чем должен делать дипломатический партнёр, и направил нам существенный объём помощи, чтобы остановить засуху."
 AGRI_influencer.30.A: "Слава Богу!"
 AGRI_influencer.300.t: "[FROM.GetName] отказалось послать нам помощь!"
 AGRI_influencer.300.d: "[FROM.GetName] показывает нам, что в крайнем случае на них нельзя положиться, Бог и [FROM.GetName] покинули нас."
 AGRI_influencer.300.A: "Где [FROM.GetAdjective] флаги? Надо их сжечь!"
 AGRI_random.1.t: "Фермеры жалуются на отсутствие оборудования!"
 AGRI_random.1.d: "Из-за текущих экономических санкций в [THIS.GetName] фермеры протестуют против отсутствия нового или, в некоторых случаях, исправного оборудования.\nУ нас есть 3 варианта: торговать с подозрительными личностями на чёрном рынке, попытаться найти кого-то, кто готов торговать с нами, или просто довольствоваться тем, что у нас уже есть.\n\nЧто нам делать, [THIS.GetLeader]?"
 AGRI_random.1.A: "Сомнительные личности? Да это просто бизнесмены!"
 AGRI_random.1.B: "Найдём нового торгового партнёра"
 AGRI_random.1.C: "Ну, у вас же есть волы, разве не подойдёт?"
 AGRI_random_black_market_TT: "§YМинистр сельского хозяйства ([THIS.GetNameWithFlag]) выйдет на контакты на чёрном рынке, чтобы заключить сделку.§!"
 AGRI_random_embargo_trading_TT: "§YМинистр сельского хозяйства ([THIS.GetNameWithFlag]) выйдет на контакты в других странах, чтобы попытаться заключить сделку.§!"
 AGRI_random.10.t1: "Только не спрашивайте, откуда это оборудование"
 AGRI_random.10.d1: "Фермеры недовольны поставленной нами техникой. Они говорят, что наши объяснения, почему техника упала с грузовика, неубедительны. Но пока они недовольны меньше, чем были бы вовсе без техники, — для нас это успех."
 AGRI_random.10.A: "Давайте впредь этого не допускать..."
 AGRI_random.10.t2: "Перестрелка с контрабандистами!"
 AGRI_random.10.d2: "Министр сельского хозяйства за это головой ответит! Попытки договориться с контрабандистами привели к тому, что они не только забрали деньги, но и попытались присвоить себе оборудование, и столько наших солдат хладнокровно расстреляли! Это недопустимо!"
 AGRI_random.10.B: "Эти ублюдки"
 AGRI_random.10.t3: "Забрали деньги и убежали..."
 AGRI_random.10.d3: "Ну, нашему министру сельского хозяйства урезали зарплату на ближайшие десять лет, этот дурак заключил сделку с контрабандистами, которые сказали торговой стороне подождать оборудование, ну... вы можете догадаться, что произошло. 16 часов они ждали возвращения контрабандистов, ужасные вещи."
 AGRI_random.10.C: "Чёрт."
 AGRI_random.100.t1: "Неказисто, но работают"
 AGRI_random.100.d1: "Фермеры очень довольны тем, что нам удалось раздобыть. Возможно, это не самый красивый и новый комплект, но он работает, и это всё, о чём мы могли мечтать, учитывая нашу текущую ситуацию."
 AGRI_random.100.A: "Мы предотвратили катастрофу"
 AGRI_random.100.t2: "Ещё одно эмбарго?!"
 AGRI_random.100.d2: "Того, кто ведёт переговоры в Министерстве торговли, нужно расстрелять. Мы понятия не имеем, как они так облажались, но нам снова ввели эмбарго, это невероятно. Мало того, фермеры на нас в ярости!"
 AGRI_random.100.B: "Вот чёрт..."
 AGRI_random.100.t3: "Почти ничего не работает!"
 AGRI_random.100.d3: "«Как новенькая», чёрт возьми! Почти всё оборудование, которое нам удалось раздобыть, полностью сломалось, заклинило или просто не подаёт признаков жизни. Фермеры на нас очень злятся..."
 AGRI_random.100.C: "У нас остался чек?"
 AGRI_random.2.t: "Поля выглядят сухими..."
 AGRI_random.2.d: "В это время года наши поля обычно в куда лучшем состоянии, и наш министр сельского хозяйства обеспокоен тем, что это может привести к более серьёзной засухе, а не просто к «слишком яркого солнца».\n\nЕсли денег мало, мы всегда можем попробовать откачать часть воды из запасов наших соседей..."
 AGRI_random.2.A: "Эх, с этим мы сами справимся..."
 AGRI_random.2.B: "Ну, вряд ли они это заметят."
 AGRI_random.2.C: "Помолитесь за дождь и хватит!"
 AGRI_random_water_diversion_TT: "§YМы можем попытаться§! §Rукрасть§! §Yчасть воды у соседей, если§! §Cотведём§! §Yеё к себе!§!"
 AGRI_random.20.t1: "Кризис предотвращён!"
 AGRI_random.20.t2: "Легкая засуха"
 AGRI_random.20.t3: "Ничего не изменилось!"
 AGRI_random.20.d1: "Похоже, быстрые действия правительства решили потенциальную проблему засухи, не нажив врагов и даже приведя к возможному повышению ожидаемых цен на урожай."
 AGRI_random.20.d2: "Хотя, похоже, нам удалось остановить наступление засухи, некоторые периферийные земли всё ещё выглядят немного засушливыми, и урожайность этих культур может оказаться ниже. Тем не менее, большую часть урожая удалось спасти."
 AGRI_random.20.d3: "Несмотря на все наши усилия, посевы, похоже, никак не приживаются, а поля сухи как никогда. Это может в конечном итоге перерасти в полномасштабную засуху. Мы должны быть готовы к худшему."
 AGRI_random.20.A: "Рад это слышать!"
 AGRI_random.20.B: "Надеюсь, пострадали только овощи."
 AGRI_random.20.C: "Держитесь крепче!"
 AGRI_random.200.t1: "Они даже не поняли!"
 AGRI_random.200.t2: "[FROM.GetName] поймало нас с поличным"
 AGRI_random.200.t3: "Мы отвели слишком много воды!"
 AGRI_random.200.t4: "Поля [FROM.GetName] выглядят очень сухими"
 AGRI_random.200.t5: "Фермы [FROM.GetName] остаются бесплодными"
 AGRI_random.200.d1: "Заплатив нужным людям, мы тайком украли у соседей немного воды. Надеюсь, те, кому мы заплатили, будут молчать. Наши собственные проблемы пока решены."
 AGRI_random.200.d2: "Мы заплатили тем, кого считали нужными людьми, и наша команда уже подключилась к водоводам, но, к сожалению, её накрыли власти страны [FROM.GetName]. Похоже, они весьма недовольны действиями нашего правительства."
 AGRI_random.200.d3: "Похоже, у нашего соседа [FROM.GetName] было меньше воды, чем мы изначально думали, и теперь он страдает от последствий наших действий! Им может быть очевидно, кто украл воду, но, к счастью, похоже, что это всего лишь локальная засуха."
 AGRI_random.200.d4: "Похоже, у нашего соседа [FROM.GetName] было меньше воды, чем мы изначально думали, и теперь он страдает от последствий наших действий! Вероятно, им очевидно, кто украл воду, к сожалению, засуха в итоге может дойти и до нас."
 AGRI_random.200.d5: "Похоже, у нашего соседа [FROM.GetName] было меньше воды, чем мы первоначально думали, и теперь он страдает от последствий наших действий! Им почти наверняка станет ясно, кто украл воду, и наш министр сельского хозяйства прогнозирует экстремальные засухи с высокой вероятностью того, что они перекинутся и на нашу территорию."
 AGRI_random.200.A: "Будут знать, как воду держать!"
 AGRI_random.200.B: "Твою мать..."
 AGRI_random.200.C: "Постарайтесь договориться с ними"
 AGRI_random.200.D: "Ой."
 AGRI_random.200.E: "Готовьтесь к худшему."
 AGRI_random.200.F: "Постойте... это может ударить и по нам!"
 AGRI_random.200.G: "Если это затронет нас, мы должны подготовиться!"
 AGRI_random.200.H: "Боже, что мы наделали?"
 AGRI_random.2000.t: "[FROM.GetName] украло нашу воду!"
 AGRI_random.2000.d1: "Мы подумали, что что-то не так, когда запасы воды иссякли. После тщательного расследования выяснилось, что виновником был [FROM.GetName]!"
 AGRI_random.2000.d2: "Мы подумали, что что-то не так, когда запасы воды иссякли. После тщательного расследования выяснилось, что виновником был [FROM.GetName]! Мы могли бы показать им серьёзность наших намерений, наложив на них эмбарго..."
 AGRI_random.2000.A: "Разорвать с ними все связи!"
 AGRI_random.2000.B: "Вот ведь ублюдки!"
 AGRI_random.3.t: "Два фермера ищут помощи в земельном споре"
 AGRI_random.3.d: "Двое фермеров обратились в главный офис министерства сельского хозяйства, пытаясь добиться вмешательства правительства в урегулирование земельного спора. Первый фермер утверждает, что на его землю посягнул скот второго фермера, а второй утверждает, что официальное картографирование никогда не проводилось, а границы полей первого фермера фактически затрагивают собственность второго фермера!\n\nЗапутанная история, и мы можем встать на сторону любого из них, смотря по тому, кто из них окажется более убедительным рассказчиком."
 AGRI_random.3.A: "Держи скот у себя на участке!"
 AGRI_random_3_F1_TT: "§YВстанет на сторону§! §3первого фермера§! §Yв земельном споре§!"
 AGRI_random.3.B: "Скот не может знать границ!"
 AGRI_random_3_F2_TT: "§YВстанет на сторону§! §3второго фермера§! §Yв земельном споре§!"
 AGRI_random.3.C: "Напомни-ка, а почему меня это должно волновать?"
 AGRI_random_3_NO_TT: "§YНе встанет ни на чью§! §Rсторону§! §Yв земельном споре, оставив решение самим фермерам§!"
 AGRI_random.30.t1: "Скотоводы расстроены!"
 AGRI_random.30.d1: "Большая группа скотоводов считает вмешательство правительства на стороне земледельцев возмутительным превышением полномочий и активно проводит агитацию в пользу конкурирующей политической партии!\n\nЗемледельцы же празднуют это решение и в восторге от этой победы в борьбе за права собственности!"
 AGRI_random.30.A: "Надо было лучше следить за своим скотом!"
 AGRI_random.30.t2: "Земледельцы расстроены!"
 AGRI_random.30.d2: "Владельцы ранчо, судя по всему, воодушевлены решением правительства, поскольку право на выпас скота им обеспечено, и они пообещали поддержать правительство на любых предстоящих выборах.\n\nОднако земледельцы угрожают объединиться и отказаться принять это решение!"
 AGRI_random.30.B: "Возможно, нам следует укрепить законы о собственности..."
 AGRI_random.30.t3: "Они решили это между собой!"
 AGRI_random.30.d3: "Без вмешательства правительства на чьей-либо стороне между владельцами ранчо и земледельцами было достигнуто джентльменское соглашение, разрешившее этот земельный спор.\n\nХотя в будущем могут возникнуть и другие споры, похоже, что все, по крайней мере, в какой-то степени удовлетворены этим результатом."
 AGRI_random.30.C: "Идеальное решение."
 AGRI_random.30.t4: "Стрельба на фермах!"
 AGRI_random.30.d4: "Без вмешательства или контроля со стороны правительства переговоры между двумя группами переросли в драку, которая закончилась стрельбой с обеих сторон. Многие скотоводы и фермеры были убиты или ранены, представители сельскохозяйственного сектора требуют ответов, а народ выступает за перемены."
 AGRI_random.30.D: "Чёрт подери..."
 AGRI_random.4.t: "Щедрый урожай!"
 AGRI_random.4.d: "Наши фермеры сообщают о богатом урожае и спрашивают Министерство сельского хозяйства, что делать с излишками. Можно либо продать их, либо пополнить наши запасы «на не такой уж чёрный день»."
 AGRI_random.4.A: "Дополнительный доход лишним не бывает."
 AGRI_random.4.B: "У нас есть место для хранения?"
 AGRI_random.5.t: "Посевы гибнут на полях!"
 AGRI_random.5.d: "Что-то погубило значительную часть наших посевов, оставив ожидаемый урожай гнилым; ожидается, что это значительно сократит объёмы производства нашей сельскохозяйственной продукции, если мы не предпримем решительных мер по устранению ущерба."
 AGRI_random.5.A: "Придётся стиснуть зубы и терпеть."
 AGRI_random.5.B: "Запасы поддержат сектор!"
 AGRI_random.6.t: "Паразиты на полях!"
 AGRI_random.6.d: "[ROOT.GetLeader], на горизонте замечена инвазивная саранча! Есть надежда, что пестициды не дадут ей уничтожить слишком большую часть урожая, но полной уверенности нет — нужно готовиться к худшему!"
 AGRI_random.6.A: "Насколько велик ущерб?"
 AGRI_random.60.t1: "Основные культуры требуют больше места!"
 AGRI_random.60.t2: "Товарные культуры требуют больше места!"
 AGRI_random.60.d1: "Это катастрофа... Саранча, похоже, уничтожила бесчисленные тонны нашего прогнозируемого урожая основных культур, сельское хозяйство ждёт серьёзный удар."
 AGRI_random.60.d2: "К счастью, саранча, похоже, налетела на обработанные пестицидами поля и поплатилась за это. Несмотря на то, что прогнозируемый урожай основных культур теперь ниже, следует ожидать, что прибыльность нашего сельскохозяйственного сектора снизится незначительно."
 AGRI_random.60.d3: "Это катастрофа... Саранча, похоже, уничтожила бесчисленные тонны нашего прогнозируемого урожая товарных культур, сельское хозяйство ждёт серьёзный удар."
 AGRI_random.60.d4: "К счастью, саранча, похоже, налетела на обработанные пестицидами поля и поплатилась за это. Несмотря на то, что прогнозируемый урожай товарных культур теперь будет ниже, следует ожидать, что прибыльность нашего сельскохозяйственного сектора снизится незначительно."
 AGRI_random.60.A: "Чёрт"
 AGRI_random.60.B: "Чёрт"
 AGRI_random.60.C: "Чёрт"
 AGRI_random.60.D: "Чёрт"
 AGRI_random.7.t: "Лесные пожары!"
 AGRI_random.7.d: "Похоже, что лесные пожары бушуют рядом с полями самых продуктивных ферм нашей страны. Наш министр сельского хозяйства ожидает, что они сильно пострадают когда огонь подойдёт ближе."
 AGRI_random.7.A: "Подождём отчёта об ущербе..."
 AGRI_random.70.t1: "Основные культуры пострадали от пожаров!"
 AGRI_random.70.t2: "Товарные культуры пострадали от пожаров!"
 AGRI_random.70.d1: "Несмотря на все усилия наших пожарных, урожай, похоже, будет тяжёлым. Многие фермеры потеряли всё, но хуже всего то, что наша доля на рынке основных культур сильно пострадает от этой катастрофы и рынок неожиданно упадёт."
 AGRI_random.70.d2: "Несмотря на все усилия наших пожарных, урожай, похоже, будет тяжёлым. Многие фермеры потеряли всё, но хуже всего то, что наша доля на рынке товарных культур сильно пострадает от этой катастрофы и рынок неожиданно упадёт."
 AGRI_random.70.A: "Столько трудов — и всё прахом."
 AGRI_random.70.B: "Столько трудов — и всё прахом."
 AGRI_random.8.t: "Ливни угрожают затоплениями"
 AGRI_random.8.d: "В то время как сезон дождей уже наступил, становится всё более вероятным, что мы можем столкнуться с более суровым сезоном дождей, чем обычно, поскольку реки, похоже, разбухли сверх нормы для этого времени года, и метеорологи ожидают, что реки выйдут из берегов."
 AGRI_random.8.A: "Давайте готовиться к худшему."
 AGRI_random.80.t1: "Поля основных культур затоплены!"
 AGRI_random.80.t2: "Поля товарных культур затоплены!"
 AGRI_random.80.d1: "Воды было слишком много, чтобы сдержать её самодельными заграждениями и наспех возведёнными дамбами. Поля основных культур промокли насквозь, многие фермеры потеряли всё, и сельское хозяйство ждёт серьёзный удар."
 AGRI_random.80.d2: "Воды было слишком много, чтобы сдержать её самодельными заграждениями и наспех возведёнными дамбами. Поля товарных культур промокли насквозь, многие фермеры потеряли всё, и сельское хозяйство ждёт серьёзный удар."
 AGRI_random.80.A: "Кажется, дождя было многовато."
 AGRI_random.80.B: "Кажется, дождя было многовато."
 AGRI_random.9.t: "Бегущее стадо!"
 AGRI_random.9.d: "Стадо животных вздымает пыль вдалеке, и кажется, что они могут пройти прямо через фермерские угодья!"
 AGRI_random.9.A: "Давайте посмотрим, где они окажутся."
 AGRI_random.90.t1: "Бегущее стадо вытаптывает основные культуры"
 AGRI_random.90.t2: "Бегущее стадо вытаптывает товарные культуры"
 AGRI_random.90.t3: "Бегущее стадо миновало поля"
 AGRI_random.90.d1: "Несмотря на все наши усилия, стадо, похоже, вытоптало поля основных культур. Придётся передать под основные культуры часть земель товарных культур; менять распределение нельзя, пока не завершатся чрезвычайные меры."
 AGRI_random.90.d2: "Несмотря на все наши усилия, стадо, похоже, вытоптало поля товарных культур. Придётся передать под товарные культуры часть земель основных культур; менять распределение нельзя, пока не завершатся чрезвычайные меры."
 AGRI_random.90.d3: "Бегущее стадо в основном рассеялось, не дойдя до полей, но некоторым отставшим всё же удалось добраться до сельской местности, хотя и придерживаясь дорог. Это вызвало некоторую дорожную неразбериху, но опоздание на работу — это гораздо лучше, чем потеря обедов на ближайшие несколько месяцев."
 AGRI_random.90.A: "Это требует неотложных мер!"
 AGRI_random.90.B: "Это требует неотложных мер!"
 AGRI_random.90.C: "Слава Богу."
 AGRI_not_experiencing_drought_TT: "Сейчас §Rнет§! §Yзасухи§!"