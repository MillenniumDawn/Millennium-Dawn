 CPD_resource_rights_button_TT: "§Y Ressourcenrechte §!"
 CPD_resource_rights_button_TT_DELAYED: "Die Sicherung von §YRessourcenabbaurechten§! leitet die Ressourcenproduktion der ausgewählten Staaten an uns um. Die Staaten selbst verbleiben unter ihrem derzeitigen Besitzer; nur das von ihnen produzierte Öl, Stahl, Aluminium, Gummi, Wolfram und Chrom fließt in unsere Wirtschaft. Diese Regelung bleibt bestehen, bis sie durch ein weiteres Friedensabkommen aufgehoben wird."
 CPD_military_basing_button_TT: "§Y Militärstützpunkte §!"
 CPD_military_basing_button_TT_DELAYED: "§Y Militärstützpunktrechte §! gewähren unseren Streitkräften freien Durchgang durch das Territorium dieser Nation. Unsere Truppen können sich frei bewegen und stationieren, bis der Zugang widerrufen wird."
 CPD_full_puppet_button_TT: "§Y Vollständige Marionette §!"
 CPD_full_puppet_button_TT_DELAYED: "Die Forderung nach §YVollständiger Marionette§! macht diese gesamte Nation zu unserem Vasallen. Sie behalten ihre Grenzen und Bevölkerung, verlieren jedoch ihre außenpolitische Unabhängigkeit; ihre Wirtschaft, Mannstärke und ihr Militär sind uns unterstellt. Bereits in diesem Abkommen enthaltene Forderungen nach Marionettenstaaten werden dadurch hinfällig."
 CPD_ceasefire_button_TT: "§Y Waffenstillstand §!"
 CPD_ceasefire_button_TT_DELAYED: "Ein §YWaffenstillstand§! beendet den Krieg mit der Frontlinie im aktuellen Zustand. Jede Seite behält die Staaten, die sie derzeit kontrolliert, unabhängig davon, wer sie zuvor besaß. Der Waffenstillstand hält §Y720 Tage§! an, bevor eine der beiden Seiten der anderen erneut den Krieg erklären kann.\n\nEin Waffenstillstand und territoriale Forderungen können nicht in einem Abkommen kombiniert werden. Die Aktivierung des Waffenstillstands löscht alle Einträge auf Staatenebene aus dem aktuellen Vorschlag."
 CPD_war_reparations_button_TT: "§Y Kriegsreparationen §!"
 CPD_war_reparations_button_TT_DELAYED: "§YKriegsreparationen§! verpflichten den Verlierer, ein Jahr lang wöchentlich einen Teil seines BIP zu zahlen. Die Übertragung erscheint als neue Ausgabe im Haushalt des Zahlers und als neues Einkommen beim Empfänger.\n\n[CPD_reparations_preview]"
 CPD_reparations_preview_TT: "Voraussichtliche Übertragung für dieses Abkommen: §Y£[?CPD_rep_preview_temp|.2]Mrd. pro Woche§! (~§Y£[?CPD_rep_preview_total_temp|.0]Mrd.§! über das Jahr)"
 CPD_forced_neutrality_button_TT: "§Y Erzwungene Neutralität §!"
 CPD_forced_neutrality_button_TT_DELAYED: "§YErzwungene Neutralität§! entfernt diese Nation bei Unterzeichnung aus ihrer Fraktion und verbietet ihr, für §Yfünf Jahre§! einer anderen beizutreten oder eine neue zu bilden."
 CPD_regime_change_button_TT: "§Y Regimewechsel §!"
 CPD_regime_change_button_TT_DELAYED: "§YRegimewechsel§! ersetzt die herrschende Partei des Ziels durch die derzeit in unserer Nation regierende Partei. Deren Koalition wird aufgelöst und ein Führer unserer politischen Ausrichtung eingesetzt. Die neue Regierung leidet zwei Jahre lang unter §Ynachkriegsbedingter Instabilität§!, und islamische Nationen könnten einen §Ysalafistischen Gegenschlag§! gegen die von außen auferlegte Herrschaft erleben."
 additional_income_war_reparations_tt: "$$[?CPD_reparations_weekly|+3] von §Y Kriegsreparationen §!\n"
 additional_expense_war_reparations_tt: "$$[?CPD_reparations_weekly|-3] von §Y Kriegsreparationen §!\n"
 CPD_war_reparations_payer: "Kriegsreparationen (Zahlend)"
 CPD_war_reparations_payer_desc: "Wir zahlen infolge eines Friedensabkommens Kriegsreparationen. Eine wöchentliche Geldüberweisung erscheint für §Y1 Jahr§! als zusätzliche Ausgabe in unserem Haushalt."
 CPD_war_reparations_receiver: "Kriegsreparationen (Empfangend)"
 CPD_war_reparations_receiver_desc: "Wir erhalten infolge eines Friedensabkommens Kriegsreparationen. Eine wöchentliche Geldüberweisung erscheint für §Y1 Jahr§! als zusätzliches Einkommen in unserem Haushalt."
 CPD_forced_neutrality_spirit: "Erzwungene Neutralität"
 CPD_forced_neutrality_spirit_desc: "Als Bedingung des Friedensabkommens ist es unserer Nation untersagt, Militärbündnissen beizutreten oder solche zu bilden."
 CPD_regime_change_instability: "Politische Instabilität nach dem Krieg"
 CPD_regime_change_instability_desc: "Ein erzwungener Regimewechsel hat unser politisches System destabilisiert."
