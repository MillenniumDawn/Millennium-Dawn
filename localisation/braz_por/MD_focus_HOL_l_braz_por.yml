 HOL_kalimantan_strength:0 "£voc_icon Força da VOC em §YKalimantan§! §Y[IND.GetNameWithFlag]§!"
 HOL_increase_voc_kalimantan_strength_effect_tt:0 "£voc_icon Força da VOC em §YKalimantan§! §Y[IND.GetNameWithFlag]§!: Aumento de [?HOL_kalimantan_strength_change|+]"
 HOL_support_christian_rebellion_indonesia:0 "Rebelião Apoiada pelos Holandeses"
 HOL_support_christian_rebellion_indonesia_tt:0 "Se §Y[HOL.GetNameWithFlag]§! §Rdeclarar guerra§! a §Y[IND.GetNameWithFlag]§!, esta província será imediatamente controlada por §Y[HOL.GetNameWithFlag]§!"
 HOL_dutch_mining_operations:0 "Operações de Mineração Holandesas"
 HOL_dutch_mining_operations_desc:0 "Os holandeses estabeleceram extensas operações de mineração nesta região, extraindo recursos valiosos para impulsionar o crescimento econômico e o desenvolvimento industrial. Essas operações reforçam significativamente a produção local e fortalecem o controle holandês sobre a área."
 HOL_grey_society1:0 "Sociedade Grisalha"
 HOL_grey_society1_desc:0 "Os Países Baixos enfrentam os desafios de uma população em envelhecimento, com uma proporção crescente de idosos exercendo forte pressão sobre a economia, o sistema de saúde e a força de trabalho. Embora as contribuições das gerações passadas sejam celebradas, reformas urgentes são necessárias para lidar com a escassez de mão de obra, o aumento dos custos de saúde e a desigualdade entre gerações, garantindo um futuro sustentável para todos.\n------------\nPodemos nos livrar deste §Respírito nacional§! concluindo a adoção de políticas na §YMecânica da Sociedade Grisalha§!"
 HOL_antilles_office_construction:0 "Expansão Empresarial nas Antilhas"
 HOL_antilles_office_construction_desc:0 "O desenvolvimento de espaços de escritórios e centros comerciais aumentou a produtividade econômica nas Antilhas, tornando a região um polo de crescimento empresarial e financeiro."
 HOL_antilles_civ_construction:0 "Crescimento Industrial nas Antilhas"
 HOL_antilles_civ_construction_desc:0 "Investimentos recentes na indústria civil aumentaram a capacidade de manufatura local, melhorando a estabilidade econômica e a produção industrial nas Antilhas."
 HOL_antilles_mil_construction:0 "Desenvolvimento Militar Estratégico nas Antilhas"
 HOL_antilles_mil_construction_desc:0 "As Antilhas agora servem como um importante polo de produção e logística militar, fortalecendo a prontidão militar holandesa na região do Caribe."
 HOL_antilles_agriculture_construction:0 "Desenvolvimento Agrícola nas Antilhas"
 HOL_antilles_agriculture_construction_desc:0 "Novos investimentos em infraestrutura agrícola aumentaram a produção de alimentos e a sustentabilidade nas Antilhas, beneficiando tanto os agricultores locais quanto a segurança alimentar nacional."
 HOL_antilles_economic_zone: "Antillen Economische Zone"
 HOL_antilles_economic_zone_desc:0 "Com o estabelecimento da Antillen Economische Zone, o Caribe Holandês tornou-se um destino atraente para investimentos estrangeiros. Barreiras burocráticas reduzidas e incentivos financeiros facilitaram a instalação de empresas internacionais na região. No entanto, esses benefícios têm o custo de projetos de construção domésticos mais lentos, à medida que as indústrias locais se ajustam às novas realidades econômicas."
 HOL_antilles_economic_zone_tt:0 "Os §YInvestimentos§! em §Y[THIS.GetName]§! serão §Y15%§! mais baratos. A IA também terá maior probabilidade de investir no estado."
 HOL_economy.001.t:0 "Planos de Renovação de Borssele"
 HOL_economy.001.d:0 "O futuro do reator nuclear de Borssele está em suas mãos. Você tem duas opções: expandir a capacidade do reator para aumentar a geração de energia nuclear ou reformá-lo em uma usina de carvão limpo de última geração. Expandir o reator aumentará a eficiência energética e a inovação, enquanto converter para carvão limpo elevará a capacidade industrial e a estabilidade. Escolha com sabedoria, pois essa decisão moldará o panorama energético dos Países Baixos."
 HOL_economy.001.a:0 "Apostar no Nuclear"
 HOL_economy.001.b:0 "Usina de Carvão Reluzente"
 HOL_economy.002.t:0 "Países Baixos Propõem a Ferrovia Wunderline"
 HOL_economy.002.d:0 "Os Países Baixos apresentaram uma proposta ambiciosa para desenvolver a ferrovia Wunderline, uma conexão transfronteiriça de última geração destinada a melhorar a conectividade regional entre as duas nações. Esse projeto, concebido como pedra angular da futura cooperação econômica, modernizaria a infraestrutura existente, reduziria os tempos de viagem e fortaleceria a relação entre os Países Baixos e a Alemanha. A proposta reflete o compromisso dos Países Baixos em aprimorar sua rede de transportes e promover laços mais fortes com seus vizinhos."
 HOL_economy.002.a: "Wunderbar!"
 HOL_economy.002.b:0 "Não, ficamos com os trens enferrujados"
 HOL_economy.003.t:0 "Alemanha Aprova a Cooperação na Wunderline"
 HOL_economy.003.d:0 "O governo alemão concordou em participar do projeto Wunderline, melhorando a conexão ferroviária entre Groningen e Bremen. Essa iniciativa conjunta fortalecerá os laços econômicos regionais, melhorará a mobilidade transfronteiriça e simbolizará uma nova era de cooperação entre Países Baixos e Alemanha."
 HOL_economy.003.a:0 "Começa um novo capítulo na conectividade regional!"
 HOL_economy.004.t:0 "Alemanha Não Quer uma Wunderline"
 HOL_economy.004.d:0 "Apesar dos esforços diplomáticos dos Países Baixos e dos benefícios potenciais da ferrovia Wunderline, a Alemanha decidiu não apoiar o projeto. Essa rejeição representa um revés significativo para a visão holandesa de uma Europa mais interconectada. Com a recusa da Alemanha, o futuro da Wunderline está em jogo. Os Países Baixos devem agora decidir se prosseguem com uma versão reduzida do projeto, focada na conexão com Groningen, ou se abandonam o plano por completo, reconhecendo os limites da cooperação regional."
 HOL_economy.004.a:0 "Pelo menos construir a ferrovia até Groningen"
 HOL_economy.004.b:0 "Descartar o Plano"
 HOL_economy.005.t:0 "Países Baixos Propõem a Integração da HSL-Oost"
 HOL_economy.005.d:0 "Em busca de integrar ainda mais as redes de transporte europeias, os Países Baixos propuseram a integração da ferrovia de alta velocidade HSL-Oost à infraestrutura existente da Alemanha. Essa iniciativa visa criar uma conexão rápida e contínua entre os dois países, com potencial para revolucionar as viagens e as interações econômicas através da fronteira. Se bem-sucedido, o projeto poderia não apenas aumentar a eficiência do transporte transfronteiriço, mas também fortalecer os laços econômicos e a cooperação entre os Países Baixos e a Alemanha, tornando-se um marco fundamental na integração europeia."
 HOL_economy.005.a:0 "Alta Velocidade até a Erva"
 HOL_economy.005.b:0 "Não andamos em alta velocidade mesmo"
 HOL_economy.006.t:0 "Alemanha Aprova o Projeto HSL-Leste"
 HOL_economy.006.d:0 "O governo alemão concordou oficialmente em participar do projeto HSL-Oost (Linha de Alta Velocidade Leste). Esse empreendimento conjunto criará uma conexão ferroviária de alta velocidade contínua entre os Países Baixos e a Alemanha, impulsionando a cooperação econômica, a mobilidade e os laços de infraestrutura estratégica em toda a Europa."
 HOL_economy.006.a:0 "Excelente! Iniciem a construção imediatamente."
 HOL_economy.007.t:0 "Alemanha Rejeita o Projeto HSL-Leste"
 HOL_economy.007.d:0 "O governo alemão rejeitou oficialmente a participação no projeto HSL-Oost (Linha de Alta Velocidade Leste). Apesar dos esforços diplomáticos holandeses, Berlim considerou a expansão para o território alemão economicamente inviável no momento. Os Países Baixos devem agora decidir se continuam construindo a linha até a fronteira ou se abandonam o projeto por completo."
 HOL_economy.007.a:0 "Continuar a construção até a fronteira alemã."
 HOL_economy.007.b:0 "Cancelar o projeto HSL-Oost de uma vez."
 HOL_economy.008.t:0 "Países Baixos Sugerem Rota dos Três Países com §Y[BEL.GetNameWithFlag]§!"
 HOL_economy.008.d:0 "Os Países Baixos deram um passo ousado ao propor uma nova Rota dos Três Países, um ambicioso projeto ferroviário destinado a conectar os Países Baixos, §Y[BEL.GetNameWithFlag]§! e §Y[GER.GetNameWithFlag]§! por meio de uma ampla rede ferroviária. O projeto é visto como um potencial divisor de águas no transporte transfronteiriço, com a promessa de impulsionar o comércio, as viagens e a integração econômica entre as três nações. A proposta ressalta o compromisso dos Países Baixos em fortalecer a unidade europeia e melhorar a infraestrutura regional. No entanto, o sucesso do projeto depende da cooperação e do apoio de §Y[BEL.GetNameWithFlag]§! e da Alemanha."
 HOL_economy.008.a:0 "O que pode dar errado? Ótima ideia!"
 HOL_economy.008.b:0 "A Bélgica precisa consertar as estradas primeiro"
 HOL_economy.009.t:0 "§Y[HOL.GetNameWithFlag]§! e §Y[GER.GetNameWithFlag]§! Sugerem a Rota dos Três Países"
 HOL_economy.009.d:0 "§Y[HOL.GetNameWithFlag]§!, em colaboração com §Y[GER.GetNameWithFlag]§!, avançou com a proposta de desenvolver a Rota dos Três Países. O projeto visa estabelecer uma conexão ferroviária contínua entre os Países Baixos, §Y[GER.GetNameWithFlag]§! e §Y[BEL.GetNameWithFlag]§!, criando um novo corredor de transporte e intercâmbio econômico na Europa. O esforço conjunto entre os Países Baixos e §Y[GER.GetNameWithFlag]§! reflete uma visão compartilhada de uma Europa mais interconectada. Agora, a peça final do quebra-cabeça está nas mãos da Bélgica, pois seu acordo é crucial para a realização do projeto. O resultado determinará se esse plano ambicioso se concretizará."
 HOL_economy.009.a:0 "Trilhos Acima das Estradas!"
 HOL_economy.009.b:0 "Não gostamos de gastar dinheiro"
 HOL_economy.010.t:0 "§Y[BEL.GetNameWithFlag]§! e §Y[GER.GetNameWithFlag]§! Aceitam a Rota dos Três Países"
 HOL_economy.010.d:0 "Em uma decisão histórica, tanto §Y[BEL.GetNameWithFlag]§! quanto §Y[GER.GetNameWithFlag]§! concordaram em participar do desenvolvimento da Rota dos Três Países, marcando uma conquista significativa na cooperação europeia em transportes. O acordo abre caminho para a construção de um novo corredor ferroviário que melhorará a conectividade, reduzirá os tempos de viagem e fortalecerá os laços econômicos entre as três nações. A negociação bem-sucedida deste projeto é um testemunho do compromisso dos Países Baixos, de §Y[BEL.GetNameWithFlag]§! e da Alemanha de trabalhar juntos por uma Europa mais integrada e próspera. Este projeto ferroviário está destinado a se tornar um marco na história da infraestrutura europeia."
 HOL_economy.010.a:0 "Marco Europeu para o Tráfego Ferroviário!"
 HOL_economy.011.t:0 "Países Baixos Propõem o Trem dos Dois Países"
 HOL_economy.011.d:0 "Após a rejeição da Alemanha à Rota dos Três Países, os Países Baixos propuseram uma solução alternativa: o Trem dos Dois Países, concebido para ligar diretamente os Países Baixos e §Y[BEL.GetNameWithFlag]§!. Embora essa nova proposta não tenha o alcance mais amplo do plano original, ela ainda oferece benefícios significativos ao melhorar as relações bilaterais e aprimorar o transporte regional. O sucesso dessa alternativa dependerá da disposição da Bélgica em cooperar e investir no projeto. Os Países Baixos continuam comprometidos em avançar sua infraestrutura de transportes, mesmo que em menor escala."
 HOL_economy.011.a:0 "Trabalhar com os Países Baixos para desenvolver a rota dos Dois Países"
 HOL_economy.011.b:0 "Já temos as melhores ferrovias"
 HOL_economy.012.t:0 "Apenas §Y[BEL.GetNameWithFlag]§! Concorda com a Rota dos Três Países"
 HOL_economy.012.d:0 "Embora a Alemanha tenha recusado participar, §Y[BEL.GetNameWithFlag]§! manifestou disposição de seguir adiante com o projeto da Rota dos Três Países. Esse acordo parcial deixa os Países Baixos diante de uma decisão difícil: prosseguir com o projeto ao lado de §Y[BEL.GetNameWithFlag]§!, ainda que em escala reduzida, ou reconsiderar todo o plano. A ausência da Alemanha complica o projeto, mas não diminui seu impacto potencial na conectividade regional. Os Países Baixos devem agora pesar os benefícios da colaboração com §Y[BEL.GetNameWithFlag]§! contra os desafios de prosseguir sem pleno apoio internacional."
 HOL_economy.012.a:0 "Tudo bem... suponho"
 HOL_economy.013.t:0 "§Y[BEL.GetNameWithFlag]§! e §Y[GER.GetNameWithFlag]§! Rejeitam a Rota dos Três Países"
 HOL_economy.013.d:0 "Em uma reviravolta decepcionante, tanto §Y[BEL.GetNameWithFlag]§! quanto §Y[GER.GetNameWithFlag]§! rejeitaram a proposta da Rota dos Três Países, paralisando de fato a visão holandesa de uma ampla rede ferroviária transfronteiriça. Essa rejeição é um revés significativo, forçando os Países Baixos a reavaliar sua estratégia de transportes. Com o plano original inviável, o foco deve mudar para alternativas, como melhorar as rotas existentes dentro das fronteiras holandesas ou realocar recursos para outros projetos nacionais. O resultado evidencia os desafios da cooperação internacional e as complexidades do desenvolvimento da infraestrutura regional."
 HOL_economy.013.a:0 "Usar os fundos para investir na Linha Amsterdã - Maastricht"
 HOL_economy.014.t:0 "Países Baixos Investem em Nossa Produção de Bioetanol"
 HOL_economy.014.d:0 "Um novo capítulo no desenvolvimento de energia sustentável começa quando a multinacional holandesa DSM estabelece fábricas de bioetanol em Dakota do Sul. Utilizando tecnologia avançada de bioengenharia, essas fábricas transformarão a rica produção agrícola do estado em bioetanol, uma fonte de energia renovável voltada a reduzir as emissões de carbono e a dependência de combustíveis fósseis. Essa iniciativa não apenas fortalece a infraestrutura energética de Dakota do Sul, mas também cria inúmeros empregos na região. O investimento da DSM destaca a crescente colaboração econômica entre os Países Baixos e os Estados Unidos, marcando um passo significativo na transição global para a energia limpa."
 HOL_economy.014.a:0 "Bom para os holandeses"
 HOL_economy.015.t:0 "Proposta de Colaboração em Ferrovia de Alta Velocidade: Amsterdã-Bruxelas (HSL Zuid)"
 HOL_economy.015.d:0 "Os Países Baixos propõem um projeto conjunto de infraestrutura com §Y[BEL.GetNameWithFlag]§! para construir a Ferrovia de Alta Velocidade Zuid (HSL Zuid), ligando Amsterdã a Bruxelas. Esse projeto reduzirá significativamente o tempo de viagem, fortalecerá os laços econômicos entre nossos países e criará um corredor ferroviário moderno que melhora a conectividade regional. Os Países Baixos estão ansiosos para trabalhar em conjunto com §Y[BEL.GetNameWithFlag]§! nesse empreendimento transformador. §Y[BEL.GetNameWithFlag]§! se juntará a nós na criação dessa ligação de alta velocidade?"
 HOL_economy.015.a:0 "Juntar-se aos Países Baixos na construção da HSL Zuid"
 HOL_economy.015.b:0 "Recusar a Colaboração na HSL Zuid"
 HOL_economy.016.t:0 "§Y[BEL.GetNameWithFlag]§! Aceita a Colaboração na HSL Zuid"
 HOL_economy.016.d:0 "§Y[BEL.GetNameWithFlag]§! concordou em se juntar aos Países Baixos na construção da Ferrovia de Alta Velocidade Zuid (HSL Zuid), ligando Amsterdã a Bruxelas. Esse projeto colaborativo melhorará muito a conectividade regional, reduzirá os tempos de viagem e fortalecerá os laços econômicos e culturais entre nossas nações. Com ambos os países comprometidos com o empreendimento, a construção da linha ferroviária de alta velocidade está prestes a começar, marcando uma nova era no transporte europeu."
 HOL_economy.016.a:0 "Iniciar a Construção da HSL Zuid"
 HOL_economy.017.t:0 "§Y[BEL.GetNameWithFlag]§! Recusa a Colaboração na HSL Zuid"
 HOL_economy.017.d:0 "§Y[BEL.GetNameWithFlag]§! infelizmente decidiu não colaborar no projeto da Ferrovia de Alta Velocidade Zuid (HSL Zuid). Apesar desse revés, os Países Baixos enfrentam uma decisão: devemos prosseguir com o projeto da HSL Zuid até a fronteira belga ou descartar o plano por completo? Construir a ligação de alta velocidade até a fronteira ainda poderia melhorar o transporte regional e lançar as bases para uma futura colaboração, mas exigirá investimento significativo."
 HOL_economy.017.a:0 "Construir a HSL Zuid até a Fronteira"
 HOL_economy.017.b:0 "Descartar o Projeto HSL Zuid"
 HOL_economy.018.t:0 "Proposta de Extensão da Betuwelijn até a Alemanha"
 HOL_economy.018.d:0 "Os Países Baixos propõem estender a Betuwelijn, uma importante linha ferroviária de carga, até a Alemanha para melhorar a eficiência do comércio e do transporte entre nossas duas nações. Essa extensão fortaleceria os laços econômicos e criaria uma rota mais eficiente para as mercadorias, impulsionando o crescimento econômico tanto dos Países Baixos quanto da Alemanha. A Alemanha concordará em colaborar nesse importante projeto de infraestrutura?"
 HOL_economy.018.a:0 "Trabalhar com os Países Baixos na Extensão da Betuwelijn"
 HOL_economy.018.b:0 "Recusar o Projeto de Extensão da Betuwelijn"
 HOL_economy.019.t:0 "Alemanha Aceita a Colaboração na Betuwelijn"
 HOL_economy.019.d:0 "A Alemanha concordou em trabalhar com os Países Baixos na extensão da Betuwelijn. Essa conexão ferroviária de carga melhorará significativamente as rotas comerciais entre os dois países, permitindo uma movimentação de mercadorias mais rápida e eficiente. Com ambas as nações comprometidas com o projeto, a construção começará em breve, marcando um grande passo para o comércio e o transporte regionais."
 HOL_economy.019.a:0 "Iniciar a Construção da Extensão da Betuwelijn"
 HOL_economy.020.t:0 "Alemanha Recusa a Colaboração na Betuwelijn"
 HOL_economy.020.d:0 "A Alemanha decidiu não colaborar no projeto de extensão da Betuwelijn. Apesar disso, os Países Baixos devem agora decidir se estendem a linha ferroviária de carga até a fronteira alemã ou se abandonam o projeto por completo. Concluir a linha até a fronteira ainda poderia melhorar o transporte doméstico de carga e posicionar os Países Baixos para um futuro crescimento comercial."
 HOL_economy.020.a:0 "Construir a Betuwelijn até a Fronteira Alemã"
 HOL_economy.020.b:0 "Descartar o Projeto de Extensão da Betuwelijn"
 HOL_economy.021.t:0 "Proposta de Expansão da ASML"
 HOL_economy.021.d:0 "Os Países Baixos propuseram a construção de uma instalação da ASML dentro de suas fronteiras, oferecendo em troca investimentos tecnológicos e crescimento econômico. Você aceitará essa parceria?"
 HOL_economy.021.a:0 "Aceitar a proposta"
 HOL_economy.021.b:0 "Recusar a proposta"
 HOL_economy.022.t:0 "Expansão da ASML Aprovada por [FROM.GetName]"
 HOL_economy.022.d:0 "A proposta de construir uma instalação da ASML foi aprovada por [ROOT.GetName]. Isso marca um passo significativo no fortalecimento dos laços econômicos e tecnológicos."
 HOL_economy.022.a:0 "Excelente notícia!"
 HOL_economy.023.t:0 "Expansão da ASML Recusada por [FROM.GetName]"
 HOL_economy.023.d:0 "[FROM.GetName] recusou a proposta dos Países Baixos de construir uma instalação da ASML dentro de suas fronteiras. Isso é um revés para nossos esforços de expansão global."
 HOL_economy.023.a:0 "Lamentável, mas vamos persistir."
 HOL_economy.024.t:0 "Proposta Holandesa: Corredor Energético Delta-Reno"
 HOL_economy.024.d:0 "O governo holandês propôs uma iniciativa de infraestrutura e energia em larga escala: o Corredor Energético Delta-Reno. O projeto ligaria os polos de energia offshore e as instalações portuárias holandesas às regiões industriais da Alemanha por meio do Reno, combinando redes de dutos, hidrogênio e eletricidade. Ele promete benefícios econômicos de longo prazo e integração energética regional. Devemos apoiá-lo?"
 HOL_economy.024.a:0 "Aprovar o Corredor Delta-Reno"
 HOL_economy.024.b:0 "Rejeitar a proposta, devemos manter a soberania energética"
 HOL_economy.025.t:0 "Alemanha Aceita o Corredor Delta-Reno"
 HOL_economy.025.d:0 "A Alemanha aceitou nossa proposta do Corredor Energético Delta-Reno. A construção começará em uma rede transnacional de energia e logística ligando nossos portos à bacia do Reno. Isso fortalece nossa influência como polo energético do Mar do Norte e nos aproxima do núcleo industrial da Europa."
 HOL_economy.025.a:0 "Um passo importante adiante."
 HOL_economy.026.t:0 "Alemanha Rejeita o Corredor Delta-Reno"
 HOL_economy.026.d:0 "A Alemanha recusou participar do Corredor Energético Delta-Reno, citando preocupações com a independência energética e o controle estratégico da infraestrutura. Embora decepcionante, esse resultado nos obriga a explorar outros caminhos para a cooperação regional."
 HOL_economy.026.a:0 "Um revés, mas não o fim."
 HOL_military.001.t:0 "Países Baixos Propõem Investimento na BAE Systems"
 HOL_military.001.d:0 "Os Países Baixos procuraram o governo do Reino Unido e a BAE Systems com uma proposta de investimento em uma das maiores empreiteiras de defesa da Europa. O governo holandês pretende fortalecer os laços com o Reino Unido e acessar tecnologia de defesa de ponta. Esse investimento beneficiaria a BAE Systems ao fornecer capital adicional para P&D e produção, ao mesmo tempo que fomentaria uma cooperação militar mais estreita entre os Países Baixos e o Reino Unido. Permitiremos esse investimento holandês?"
 HOL_military.001.a:0 "Permitir que os holandeses invistam na BAE Systems"
 HOL_military.001.b:0 "Rejeitar a oferta de investimento holandesa"
 HOL_military.002.t:0 "Países Baixos Propõem Investimento no Naval Group"
 HOL_military.002.d:0 "O governo holandês manifestou interesse em investir no Naval Group, a principal empresa de defesa naval da França. Os Países Baixos buscam fortalecer os laços com a França contribuindo para o desenvolvimento de tecnologias navais de ponta. Esse investimento aumentaria as capacidades do Naval Group, fornecendo novos recursos financeiros para pesquisa, construção naval e desenvolvimento de sistemas marítimos avançados. Devemos aceitar o investimento holandês, aprofundando a cooperação franco-holandesa em defesa?"
 HOL_military.002.a:0 "Permitir que os holandeses invistam no Naval Group"
 HOL_military.002.b:0 "Rejeitar a oferta de investimento holandesa"
 HOL_military.003.t:0 "Países Baixos Propõem Investimento na Leonardo"
 HOL_military.003.d:0 "Os Países Baixos ofereceram investir na Leonardo, uma das principais empresas aeroespaciais e de defesa da Itália. A proposta do governo holandês destaca o desejo de fortalecer os laços com a Itália por meio de projetos conjuntos em aviação e tecnologia de defesa. Esse investimento forneceria à Leonardo recursos valiosos para sistemas aeroespaciais avançados e projetos de defesa. Devemos permitir que os Países Baixos invistam, fomentando maior cooperação entre a Itália e os Países Baixos?"
 HOL_military.003.a:0 "Permitir que os holandeses invistam na Leonardo"
 HOL_military.003.b:0 "Rejeitar a oferta de investimento holandesa"
 HOL_military.004.t:0 "Países Baixos Propõem Investimento na Rheinmetall"
 HOL_military.004.d:0 "A Rheinmetall recebeu uma proposta de investimento do governo holandês. Os Países Baixos buscam aprofundar a cooperação com a Alemanha investindo nessa importante empreiteira de defesa, particularmente no desenvolvimento de veículos blindados e sistemas militares. O investimento forneceria à Rheinmetall recursos adicionais para expandir sua capacidade de produção e inovar ainda mais em tecnologia militar. Devemos aprovar o investimento holandês, ampliando a cooperação entre nossos setores de defesa?"
 HOL_military.004.a:0 "Permitir que os holandeses invistam na Rheinmetall"
 HOL_military.004.b:0 "Rejeitar a oferta de investimento holandesa"
 HOL_military.005.t:0 "Países Baixos Propõem Investimento na Saab AB"
 HOL_military.005.d:0 "O governo holandês procurou a Saab AB com uma proposta de investimento destinada a fortalecer os laços de defesa entre a Suécia e os Países Baixos. Os Países Baixos esperam contribuir para os programas aeroespaciais e de defesa avançados da Saab, particularmente em áreas como caças e sistemas de mísseis. Esse investimento forneceria à Saab financiamento adicional para acelerar o desenvolvimento e a inovação em suas áreas-chave. Devemos permitir esse investimento holandês, fortalecendo ainda mais nossa parceria em defesa?"
 HOL_military.005.a:0 "Permitir que os holandeses invistam na Saab AB"
 HOL_military.005.b:0 "Rejeitar a oferta de investimento holandesa"
 HOL_military.006.t:0 "Investimento Holandês em Defesa Aceito por [FROM.GetNameWithFlag]"
 HOL_military.006.d:0 "O governo de [FROM.GetNameWithFlag] aceitou a proposta holandesa de investir em sua indústria de defesa. Essa cooperação marca um passo significativo no fortalecimento de nossos laços de defesa com [FROM.GetNameWithFlag] e na garantia de acesso a tecnologia militar avançada. Os Países Baixos agora podem colaborar estreitamente com o setor de defesa de [FROM.GetNameWithFlag], aprimorando as capacidades industriais militares de ambas as nações e contribuindo para a prontidão geral de defesa da Europa."
 HOL_military.006.a:0 "Celebrar a parceria fortalecida"
 HOL_military.007.t:0 "Investimento Holandês em Defesa Rejeitado por [FROM.GetNameWithFlag]"
 HOL_military.007.d:0 "O governo de [FROM.GetNameWithFlag] infelizmente rejeitou a proposta dos Países Baixos de investir em sua indústria de defesa. Essa decisão limita nossa capacidade de aprofundar os laços de defesa com [FROM.GetNameWithFlag] e de obter acesso a tecnologias militares críticas. Embora esse resultado seja decepcionante, devemos buscar oportunidades alternativas para fortalecer nossa indústria de defesa e nossas parcerias em outras partes da Europa."
 HOL_military.007.a:0 "Um revés, mas seguiremos em frente"
 HOL_military.008.t:0 "Países Baixos Propõem Cooperação em QRA"
 HOL_military.008.d:0 "Os Países Baixos propuseram o estabelecimento de um sistema de Alerta de Reação Rápida (QRA). Convidam §Y[BEL.GetNameWithFlag]§! a participar de um sistema compartilhado de defesa aérea do Benelux. Aceitar isso poderia fortalecer nossa cooperação militar na região."
 HOL_military.008.a:0 "Aceitar a proposta de QRA"
 HOL_military.008.b:0 "Recusar a proposta de QRA"
 HOL_military.009.t:0 "§Y[BEL.GetNameWithFlag]§! e Países Baixos Propõem Cooperação em QRA"
 HOL_military.009.d:0 "Após a aceitação do sistema QRA pela Bélgica, os Países Baixos agora estendem um convite a Luxemburgo. Esse sistema estabeleceria uma defesa aérea conjunta para toda a região do Benelux. Luxemburgo se juntará a essa cooperação histórica?"
 HOL_military.009.a:0 "Aceitar a proposta de QRA"
 HOL_military.009.b:0 "Recusar a proposta de QRA"
 HOL_military.010.t:0 "§Y[BEL.GetNameWithFlag]§! Concorda em Aderir ao QRA Benelux"
 HOL_military.010.d:0 "§Y[BEL.GetNameWithFlag]§! aceitou a proposta dos Países Baixos de estabelecer um sistema conjunto de defesa aérea do Benelux. O próximo passo é estender a oferta a Luxemburgo."
 HOL_military.010.a:0 "Excelente! Vamos avançar."
 HOL_military.011.t:0 "§Y[BEL.GetNameWithFlag]§! Recusa a Proposta de QRA"
 HOL_military.011.d:0 "§Y[BEL.GetNameWithFlag]§! rejeitou a proposta de aderir ao sistema de Alerta de Reação Rápida do Benelux, pondo fim à iniciativa."
 HOL_military.011.a:0 "Lamentável."
 HOL_military.012.t:0 "[LUX.GetNameWithFlag] Concorda em Aderir ao QRA Benelux"
 HOL_military.012.d:0 "Luxemburgo aceitou o convite para aderir ao sistema de Alerta de Reação Rápida do Benelux. Começa uma nova era de cooperação em defesa aérea entre os Países Baixos, §Y[BEL.GetNameWithFlag]§! e Luxemburgo."
 HOL_military.012.a:0 "Excelente! Isso beneficiará a região."
 HOL_military.013.t:0 "Luxemburgo Rejeita a Proposta de QRA"
 HOL_military.013.d:0 "Luxemburgo rejeitou a proposta de aderir ao sistema de Alerta de Reação Rápida do Benelux. A cooperação regional completa não se concretizará."
 HOL_military.013.a:0 "Decepcionante."
 HOL_military.014.t:0 "QRA Benelux Estabelecido"
 HOL_military.014.d:0 "O sistema de Alerta de Reação Rápida (QRA) foi estabelecido com sucesso entre §Y[HOL.GetNameWithFlag]§!, §Y[BEL.GetNameWithFlag]§! e §Y[LUX.GetNameWithFlag]§!. Essa nova aliança proporcionará à região uma forte defesa aérea cooperativa."
 HOL_military.014.a:0 "Uma aliança forte para a região!"
 HOL_military.015.t:0 "Proposta de Centro de Comando e Controle Aéreo do Benelux"
 HOL_military.015.d:0 "Os Países Baixos propuseram o estabelecimento de um Centro de Comando e Controle Aéreo do Benelux (BENECC) para fortalecer a coordenação da defesa aérea da região. Caso §Y[BEL.GetNameWithFlag]§! adira, o próximo passo será convidar Luxemburgo."
 HOL_military.015.a:0 "Aceitar a proposta do BENECC"
 HOL_military.015.b:0 "Recusar a proposta do BENECC"
 HOL_military.016.t:0 "Proposta de Centro de Comando e Controle Aéreo do Benelux"
 HOL_military.016.d:0 "Após a aceitação da Bélgica à iniciativa do Centro de Comando e Controle Aéreo do Benelux (BENECC), Luxemburgo agora está sendo convidado a aderir. Isso estabeleceria um sistema conjunto de coordenação de defesa aérea entre os países do Benelux."
 HOL_military.016.a:0 "Aceitar a proposta do BENECC"
 HOL_military.016.b:0 "Recusar a proposta do BENECC"
 HOL_military.017.t:0 "§Y[BEL.GetNameWithFlag]§! Concorda em Aderir ao BENECC"
 HOL_military.017.d:0 "§Y[BEL.GetNameWithFlag]§! aceitou a proposta dos Países Baixos de estabelecer o Centro de Comando e Controle Aéreo do Benelux (BENECC). O próximo passo é estender a oferta a Luxemburgo."
 HOL_military.017.a:0 "Excelente! Vamos avançar."
 HOL_military.018.t:0 "§Y[BEL.GetNameWithFlag]§! Rejeita a Proposta do BENECC"
 HOL_military.018.d:0 "§Y[BEL.GetNameWithFlag]§! recusou a proposta de estabelecer o Centro de Comando e Controle Aéreo do Benelux (BENECC), pondo fim à iniciativa."
 HOL_military.018.a:0 "Lamentável."
 HOL_military.019.t:0 "Luxemburgo Concorda em Aderir ao BENECC"
 HOL_military.019.d:0 "Luxemburgo aceitou o convite para aderir ao Centro de Comando e Controle Aéreo do Benelux (BENECC). Com os três países em acordo, o BENECC agora será estabelecido."
 HOL_military.019.a:0 "Ótimo! O plano está em andamento."
 HOL_military.020.t:0 "Luxemburgo Rejeita a Proposta do BENECC"
 HOL_military.020.d:0 "Luxemburgo rejeitou a proposta de estabelecer o Centro de Comando e Controle Aéreo do Benelux (BENECC), paralisando a iniciativa cooperativa de defesa aérea."
 HOL_military.020.a:0 "Decepcionante."
 HOL_military.021.t:0 "BENECC Estabelecido"
 HOL_military.021.d:0 "Com a aceitação de todos os países do Benelux, o Centro de Comando e Controle Aéreo do Benelux (BENECC) foi estabelecido com sucesso. Nossa coordenação de defesa aérea foi muito fortalecida."
 HOL_military.021.a:0 "Excelente!"
 HOL_military.022.t:0 "Proposta de Comitê de Navegação Aérea do Benelux"
 HOL_military.022.d:0 "Os Países Baixos propuseram o estabelecimento de um Comitê de Navegação Aérea do Benelux (BNLC) para fortalecer ainda mais a coordenação da navegação aérea na região. Caso §Y[BEL.GetNameWithFlag]§! adira, o próximo passo será convidar Luxemburgo."
 HOL_military.022.a:0 "Aceitar a proposta do BNLC"
 HOL_military.022.b:0 "Recusar a proposta do BNLC"
 HOL_military.023.t:0 "Proposta de Comitê de Navegação Aérea do Benelux"
 HOL_military.023.d:0 "Após a aceitação da iniciativa do Comitê de Navegação Aérea do Benelux (BNLC) por §Y[BEL.GetNameWithFlag]§!, Luxemburgo agora está sendo convidado a aderir. Isso estabeleceria um sistema conjunto de coordenação da navegação aérea entre os países do Benelux."
 HOL_military.023.a:0 "Aceitar a proposta do BNLC"
 HOL_military.023.b:0 "Recusar a proposta do BNLC"
 HOL_military.024.t:0 "§Y[BEL.GetNameWithFlag]§! Concorda em Aderir ao BNLC"
 HOL_military.024.d:0 "§Y[BEL.GetNameWithFlag]§! aceitou a proposta dos Países Baixos de estabelecer o Comitê de Navegação Aérea do Benelux (BNLC). O próximo passo é estender a oferta a Luxemburgo."
 HOL_military.024.a:0 "Excelente! Vamos avançar."
 HOL_military.025.t:0 "§Y[BEL.GetNameWithFlag]§! Rejeita a Proposta do BNLC"
 HOL_military.025.d:0 "§Y[BEL.GetNameWithFlag]§! recusou a proposta de estabelecer o Comitê de Navegação Aérea do Benelux (BNLC), pondo fim à iniciativa."
 HOL_military.025.a:0 "Lamentável."
 HOL_military.026.t:0 "Luxemburgo Concorda em Aderir ao BNLC"
 HOL_military.026.d:0 "Luxemburgo aceitou o convite para aderir ao Comitê de Navegação Aérea do Benelux (BNLC). Com os três países em acordo, o BNLC agora será estabelecido."
 HOL_military.026.a:0 "Ótimo! O plano está em andamento."
 HOL_military.027.t:0 "Luxemburgo Rejeita a Proposta do BNLC"
 HOL_military.027.d:0 "Luxemburgo rejeitou a proposta de estabelecer o Comitê de Navegação Aérea do Benelux (BNLC), paralisando a iniciativa cooperativa de navegação aérea."
 HOL_military.027.a:0 "Decepcionante."
 HOL_military.028.t:0 "BNLC Estabelecido"
 HOL_military.028.d:0 "Com a aceitação de todos os países do Benelux, o Comitê de Navegação Aérea do Benelux (BNLC) foi estabelecido com sucesso. Nossa coordenação da navegação aérea foi muito fortalecida."
 HOL_military.028.a:0 "Excelente!"
 HOL_military.029.t:0 "Países Baixos: Comprar o Airbus MRTT"
 HOL_military.029.d:0 "Os Países Baixos têm a oportunidade de comprar 50 aeronaves de transporte Airbus MRTT. Quanto mais países do Benelux aderirem, menor será o custo."
 HOL_military.029.a:0 "Comprar o Airbus MRTT"
 HOL_military.029.b:0 "Recusar a oferta"
 HOL_military.030.t:0 "[BEL.GetNameWithFlag]: Comprar o Airbus MRTT"
 HOL_military.030.d:0 "§Y[BEL.GetNameWithFlag]§! tem a oportunidade de comprar 50 aeronaves de transporte Airbus MRTT. Quanto mais países do Benelux aderirem, menor será o custo."
 HOL_military.030.a:0 "Comprar o Airbus MRTT"
 HOL_military.030.b:0 "Recusar a oferta"
 HOL_military.031.t:0 "Luxemburgo: Comprar o Airbus MRTT"
 HOL_military.031.d:0 "Luxemburgo tem a oportunidade de comprar 50 aeronaves de transporte Airbus MRTT. Quanto mais países do Benelux aderirem, menor será o custo."
 HOL_military.031.a:0 "Comprar o Airbus MRTT"
 HOL_military.031.b:0 "Recusar a oferta"
 HOL_military.032.t:0 "Reembolso da Airbus "
 HOL_military.032.d:0 "O tesouro é ajustado de acordo com quantos países do Benelux participaram da compra do Airbus MRTT."
 HOL_military.032.a:0 "Benefícios do Benelux"
 HOL_military.033.t:0 "F-35A Chegou"
 HOL_military.033.d:0 "O desenvolvimento do F-35A foi concluído e, com a tecnologia de Aeronave Leve de 5ª Geração totalmente pesquisada, agora podemos colocar 50 unidades do F-35A em serviço ativo."
 HOL_military.033.a:0 "Empregar o F-35A"
 HOL_military.034.t:0 "F-35C Chegou"
 HOL_military.034.d:0 "Com a conclusão da pesquisa de Aeronaves de 5ª Geração Embarcadas, agora podemos empregar 50 unidades do F-35C em operações de porta-aviões."
 HOL_military.034.a:0 "Empregar o F-35C"
 HOL_military.035.t:0 "Convite para o Programa Future Air Defender"
 HOL_military.035.d:0 "[FROM.GetName] propõe um programa conjunto para construir uma fragata de defesa aérea de última geração. Um projeto compartilhado e estaleiros reunidos reduziriam os custos e, ao término do programa, os navios concluídos entrariam diretamente em nossa marinha."
 HOL_military.035.a:0 "Aderir ao programa"
 HOL_military.035.b:0 "Recusar o convite"
 HOL_military.036.t:0 "[FROM.GetName] Adere ao Programa Future Air Defender"
 HOL_military.036.d:0 "[FROM.GetName] comprometeu-se com o Future Air Defender, somando seus estaleiros ao esforço e antecipando a data de entrega."
 HOL_military.036.a:0 "Juntos garantimos os céus e os mares."
 HOL_military.037.t:0 "[FROM.GetName] Deixa o Programa Future Air Defender"
 HOL_military.037.d:0 "[FROM.GetName] não levará o Future Air Defender até o fim. Seguiremos adiante com nossos parceiros restantes e compensaremos a diferença por conta própria."
 HOL_military.037.a:0 "Seguiremos adiante."
 HOL_military.049.t:0 "Pedido de Produção de Porta-Aviões da Classe Gerald R. Ford"
 HOL_military.049.d:0 "O governo holandês apresentou formalmente um pedido para estabelecer um acordo de produção cooperativa com os Estados Unidos para a construção de um porta-aviões da classe Gerald R. Ford. Os Países Baixos buscam modernizar suas capacidades navais e aprofundar os laços estratégicos com seu parceiro atlântico. Washington deve agora decidir se aprova a joint venture ou a rejeita em favor de prioridades domésticas."
 HOL_military.049.a:0 "Aprovar o pedido holandês"
 HOL_military.049.b:0 "Rejeitar o pedido"
 HOL_military.050.t:0 "Estados Unidos Aprovam o Acordo de Construção do Porta-Aviões"
 HOL_military.050.d:0 "O governo dos EUA concordou em auxiliar na produção de um porta-aviões da classe Gerald R. Ford para a Real Marinha dos Países Baixos. Docas secas, logística e supervisão americanas apoiarão o projeto. Um símbolo de cooperação estratégica está agora em andamento."
 HOL_military.050.a:0 "Uma parceria de defesa monumental."
 HOL_military.051.t:0 "Estados Unidos Negam o Pedido de Construção do Porta-Aviões"
 HOL_military.051.d:0 "Citando preocupações estratégicas e pressões políticas internas, o governo dos EUA negou nosso pedido para construir um porta-aviões da classe Gerald R. Ford. Isso é um revés para nossos planos de modernização naval e um golpe na cooperação transatlântica."
 HOL_military.051.a:0 "Precisaremos buscar alternativas."
 HOL_military.052.t:0 "Pedido de Produção de Porta-Aviões da Classe Queen Elizabeth"
 HOL_military.052.d:0 "Os Países Baixos procuraram o governo britânico com um pedido formal para co-desenvolver e produzir um porta-aviões da classe Queen Elizabeth. Essa colaboração fortaleceria os laços navais anglo-holandeses e demonstraria unidade na defesa marítima através do Mar do Norte e além. A decisão agora cabe a Whitehall: eles aprovarão essa iniciativa estratégica?"
 HOL_military.052.a:0 "Aprovar a proposta holandesa"
 HOL_military.052.b:0 "Rejeitar a proposta"
 HOL_military.053.t:0 "Reino Unido Aprova o Acordo do Porta-Aviões"
 HOL_military.053.d:0 "O governo britânico aprovou nosso pedido de colaboração na construção de um porta-aviões da classe Queen Elizabeth. O navio será co-projetado e montado segundo os padrões da Royal Navy e usando a capacidade de seus estaleiros. Isso marca um aprofundamento da cooperação naval anglo-holandesa."
 HOL_military.053.a:0 "Um renascimento moderno da aliança marítima."
 HOL_military.054.t:0 "Reino Unido Rejeita a Colaboração no Porta-Aviões"
 HOL_military.054.d:0 "O Reino Unido rejeitou nossa proposta de produzir em conjunto um porta-aviões da classe Queen Elizabeth. Foram citadas preocupações com a independência da defesa e as prioridades da indústria. Isso é um revés para nossas ambições navais no Atlântico Norte."
 HOL_military.054.a:0 "Lamentável, mas não é o fim."
 HOL_military.055.t:0 "Pedido de Produção de Porta-Aviões da Classe Charles de Gaulle"
 HOL_military.055.d:0 "Os Países Baixos apresentaram formalmente ao governo francês um pedido para produzir em conjunto um porta-aviões da classe Charles de Gaulle. Ao aproveitar a expertise naval e a capacidade dos estaleiros franceses, os holandeses esperam reforçar suas capacidades de águas azuis e aprofundar os laços de defesa franco-holandeses. Paris deve agora decidir se aprova a cooperação ou preserva a autonomia naval nacional."
 HOL_military.055.a:0 "Aprovar o pedido"
 HOL_military.055.b:0 "Recusar"
 HOL_military.056.t:0 "França Aprova a Colaboração no Porta-Aviões"
 HOL_military.056.d:0 "O governo francês concordou em auxiliar os Países Baixos na construção de um porta-aviões da classe Charles de Gaulle. O projeto combinará expertise naval, coordenação estratégica e apoio logístico, reforçando o poder marítimo europeu por meio de uma ação industrial conjunta."
 HOL_military.056.a:0 "Um verdadeiro testemunho da unidade franco-holandesa."
 HOL_military.057.t:0 "França Rejeita a Cooperação no Porta-Aviões"
 HOL_military.057.d:0 "Citando preocupações com a soberania naval e a capacidade de produção, a França rejeitou o pedido holandês de colaborar em um porta-aviões da classe Charles de Gaulle. Embora os canais diplomáticos permaneçam abertos, isso marca um revés na cooperação industrial de defesa bilateral."
 HOL_military.057.a:0 "Uma oportunidade perdida para a integração da defesa europeia."
 HOL_military.058.t:0 "Pedido de Produção de Porta-Aviões da Classe Almirante Kuznetsov"
 HOL_military.058.d:0 "O governo holandês enviou um pedido formal à Federação Russa para produzir em conjunto um porta-aviões da classe Almirante Kuznetsov. Embora geopoliticamente incomum, tal cooperação ofereceria benefícios estratégicos mútuos e permitiria aos Países Baixos expandir rapidamente suas capacidades de aviação naval. Moscou deve agora decidir como responder."
 HOL_military.058.a:0 "Aceitar a proposta"
 HOL_military.058.b:0 "Rejeitar o pedido"
 HOL_military.059.t:0 "Rússia Aprova o Acordo de Produção do Porta-Aviões"
 HOL_military.059.d:0 "Em uma jogada geopolítica ousada, o governo russo aprovou o pedido holandês de produzir em conjunto um porta-aviões da classe Almirante Kuznetsov. O projeto será construído na infraestrutura naval russa, com financiamento holandês e integração parcial de tripulação. Essa aliança inesperada pode remodelar a dinâmica naval na Europa."
 HOL_military.059.a:0 "Uma aliança pouco convencional, mas poderosa."
 HOL_military.060.t:0 "Rússia Rejeita a Cooperação no Porta-Aviões"
 HOL_military.060.d:0 "O Kremlin rejeitou oficialmente o pedido holandês de colaborar em um porta-aviões da classe Kuznetsov. Citando desconfiança estratégica e preocupações com a transferência de tecnologia, Moscou optou por manter controle nacional total sobre seus projetos navais."
 HOL_military.060.a:0 "Sempre foi uma aposta arriscada."
 HOL_military.061.t:0 "Pedido de Produção de Porta-Aviões da Classe Shandong"
 HOL_military.061.d:0 "Os Países Baixos enviaram um pedido formal à República Popular da China, propondo uma iniciativa de produção conjunta para construir um porta-aviões da classe Shandong. O acordo poderia simbolizar a crescente cooperação de defesa eurasiana e dar à Marinha holandesa uma grande melhoria marítima. Pequim agora enfrenta a decisão: auxiliar um parceiro europeu ou voltar-se para dentro."
 HOL_military.061.a:0 "Aprovar: mostrar a liderança global da China"
 HOL_military.061.b:0 "Rejeitar: nossos estaleiros servem aos nossos interesses"
 HOL_military.062.t:0 "China Aprova o Acordo de Construção do Porta-Aviões"
 HOL_military.062.d:0 "A China aceitou a proposta holandesa de construir em conjunto um porta-aviões da classe Shandong. Aproveitando a expertise chinesa em construção naval e o investimento holandês, essa parceria é tanto estratégica quanto simbólica. Uma poderosa embarcação logo começará a ser construída sob comando conjunto."
 HOL_military.062.a:0 "Um sinal dos laços globais crescentes de Pequim."
 HOL_military.063.t:0 "China Rejeita a Cooperação no Porta-Aviões"
 HOL_military.063.d:0 "Pequim rejeitou nosso pedido de colaborar em um porta-aviões da classe Shandong. Preocupações com o envolvimento estrangeiro na produção militar chinesa e com o realinhamento geopolítico provavelmente influenciaram essa decisão."
 HOL_military.063.a:0 "Esperado, mas ainda decepcionante."
 HOL_military.064.t:0 "Aquisição da Stork MWV pela Rheinmetall"
 HOL_military.064.d:0 "A Rheinmetall propõe adquirir a Stork MWV. O governo holandês deve permitir a aquisição?"
 HOL_military.064.a:0 "Permitir a Aquisição pela Rheinmetall"
 HOL_military.064.b:0 "Bloquear a Aquisição"
 HOL_military.065.t:0 "Tecnologia de Contratorpedeiro de 2005 Já Pesquisada"
 HOL_military.065.d:0 "Você já concluiu a pesquisa da tecnologia de Contratorpedeiro de 2005. Deseja se concentrar em avançar os contratorpedeiros furtivos ou em aprimorar os projetos futuros de contratorpedeiros?"
 HOL_military.065.a:0 "Focar em Contratorpedeiros Furtivos"
 HOL_military.065.b:0 "Focar em Contratorpedeiros de Mísseis"
 HOL_military.066.t:0 "Planos de Realocação dos Fuzileiros para Vlissingen Revelados"
 HOL_military.066.d:0 "Um relatório confidencial detalhando a realocação planejada do Corpo de Fuzileiros Navais Real dos Países Baixos para Vlissingen vazou para o público. A mudança visa aumentar a prontidão operacional dos Fuzileiros aproveitando a localização costeira estratégica de Vlissingen. No entanto, a revelação provocou reações mistas entre políticos, oficiais militares e comunidades locais."
 HOL_military.066.a:0 "Esta é uma decisão estratégica que beneficiará nossa segurança nacional."
 HOL_military.066.b:0 "Precisamos considerar cuidadosamente as implicações dessa mudança."
 HOL_military.066.c:0 "Este plano é controverso demais e deve ser abandonado."
 HOL_military.067.t:0 "Acalorado Debate Parlamentar sobre a Realocação dos Fuzileiros"
 HOL_military.067.d:0 "O Parlamento holandês está em ebulição com o debate sobre a proposta de realocação dos Fuzileiros para Vlissingen. Os defensores argumentam que ela aumentará a segurança nacional e trará benefícios econômicos à região. Os críticos, porém, levantam preocupações sobre o custo financeiro e a possível perturbação das comunidades locais."
 HOL_military.067.a:0 "Devemos prosseguir com a realocação pelo bem maior."
 HOL_military.067.b:0 "Vamos encontrar um meio-termo que atenda a todas as preocupações."
 HOL_military.067.c:0 "O melhor é suspender esses planos e explorar outras opções."
 HOL_military.068.t:0 "Inquérito Público sobre a Realocação dos Fuzileiros"
 HOL_military.068.d:0 "Após o clamor público e o debate parlamentar, o governo decidiu conduzir um inquérito público para reunir mais informações e contribuições da população sobre a proposta de realocação dos Fuzileiros para Vlissingen."
 HOL_military.068.a:0 "O inquérito nos dará as percepções necessárias."
 HOL_military.068.b:0 "Isso está atrasando nossas decisões estratégicas. Suspender o inquérito."
 HOL_military.069.t:0 "Reação Pública aos Planos de Realocação dos Fuzileiros"
 HOL_military.069.d:0 "A opinião pública está dividida quanto à realocação dos Fuzileiros para Vlissingen. Os moradores locais expressam preocupações sobre o possível impacto em sua comunidade, enquanto os defensores da segurança nacional elogiam os benefícios estratégicos. Protestos e manifestações são organizados tanto por apoiadores quanto por opositores da mudança."
 HOL_military.069.a:0 "Devemos atender às preocupações da população local."
 HOL_military.069.b:0 "Educar o público sobre os benefícios dessa realocação."
 HOL_military.069.c:0 "O governo sabe o que é melhor e seguirá conforme planejado."
 HOL_military.070.t:0 "Plano de Compromisso sobre a Realocação dos Fuzileiros"
 HOL_military.070.d:0 "Em um esforço para atender tanto ao apoio quanto à oposição, foi proposto um plano de compromisso. Ele inclui investimentos adicionais em infraestrutura local para apoiar a mudança e mitigar seu impacto na comunidade."
 HOL_military.070.a:0 "Este plano equilibra todos os interesses e deve ser aprovado."
 HOL_military.070.b:0 "Precisamos de mais tempo para considerar esse compromisso."
 HOL_military.070.c:0 "Este compromisso é insatisfatório. Precisamos de um novo plano."
 HOL_military.071.t:0 "Resultados do Inquérito Público sobre a Realocação dos Fuzileiros"
 HOL_military.071.d:0 "O inquérito público foi concluído, apresentando percepções detalhadas sobre os possíveis benefícios e desvantagens de realocar os Fuzileiros para Vlissingen. O relatório destaca tanto as vantagens estratégicas quanto as preocupações da comunidade local."
 HOL_military.071.a:0 "O inquérito apoia os benefícios estratégicos. Prosseguir com a realocação."
 HOL_military.071.b:0 "Ajustar a estratégia de realocação com base no retorno do inquérito."
 HOL_military.071.c:0 "As preocupações levantadas são significativas demais. Cancelar a realocação."
 HOL_military.072.t:0 "Diálogo Comunitário sobre a Realocação dos Fuzileiros"
 HOL_military.072.d:0 "O governo iniciou uma série de diálogos com as comunidades locais de Vlissingen para atender às suas preocupações e fornecer mais informações sobre os benefícios da realocação."
 HOL_military.072.a:0 "Investir em iniciativas locais para ganhar apoio."
 HOL_military.072.b:0 "Garantir que todos os processos sejam transparentes e inclusivos."
 HOL_military.073.t:0 "Campanha Nacional de Informação sobre a Realocação dos Fuzileiros"
 HOL_military.073.d:0 "Uma campanha de informação em todo o país foi lançada para educar o público sobre os benefícios estratégicos de realocar os Fuzileiros para Vlissingen."
 HOL_military.073.a:0 "Alocar mais recursos para alcançar um público mais amplo."
 HOL_military.073.b:0 "Concentrar a campanha nas regiões com maior oposição."
 HOL_military.074.t:0 "Impacto Econômico do Plano de Compromisso"
 HOL_military.074.d:0 "O plano de compromisso inclui investimentos adicionais em infraestrutura local e medidas de mitigação para atender às preocupações da comunidade. Economistas avaliaram os possíveis benefícios e custos econômicos associados a esse plano."
 HOL_military.074.a:0 "Este plano equilibra todos os interesses e deve ser aprovado."
 HOL_military.074.b:0 "Precisamos de mais tempo para considerar esse compromisso."
 HOL_military.075.t:0 "Revisão Estendida do Plano de Compromisso"
 HOL_military.075.d:0 "A revisão estendida do plano de compromisso foi concluída, trazendo percepções mais profundas e mais retorno do público. O governo deve agora decidir se prossegue com o compromisso ou busca novas alternativas."
 HOL_military.075.a:0 "Prosseguir com o Compromisso"
 HOL_military.075.b:0 "Buscar Novas Alternativas"
 HOL_military.076.t:0 "Decisão Final do Governo sobre a Realocação dos Fuzileiros"
 HOL_military.076.d:0 "Após meses de debate e discussão pública, o governo está prestes a tomar sua decisão final sobre a realocação dos Fuzileiros para Vlissingen. A escolha terá implicações duradouras para a segurança nacional, o desenvolvimento econômico e a confiança pública no governo."
 HOL_military.076.a:0 "Os Fuzileiros se mudarão para Vlissingen conforme planejado."
 HOL_military.076.b:0 "Ajustar a estratégia de realocação com base no retorno do público e do parlamento."
 HOL_military.076.c:0 "Os Fuzileiros permanecerão em suas bases atuais."
 HOL_military.077.t:0 "Proposta de Construção Conjunta de Fragatas ASW"
 HOL_military.077.d:0 "Os Países Baixos propuseram uma colaboração com §Y[BEL.GetNameWithFlag]§! para desenvolver e construir em conjunto uma nova geração de fragatas de Guerra Antissubmarino (ASW). Pelo acordo, cada nação receberia três navios, fortalecendo a cooperação naval e garantindo as capacidades futuras de ambas as frotas. A Bélgica deve agora decidir se aceita essa oferta."
 HOL_military.077.a:0 "Aceitar a colaboração: uma frota mais forte no Mar do Norte!"
 HOL_military.077.b:0 "Rejeitar a oferta: buscar alternativas nacionais."
 HOL_military.078.t:0 "§Y[BEL.GetNameWithFlag]§! Aceita a Colaboração nas Fragatas ASW"
 HOL_military.078.d:0 "§Y[BEL.GetNameWithFlag]§! aceitou nossa proposta de construir em conjunto uma nova geração de fragatas de Guerra Antissubmarino (ASW). Com ambas as nações comprometidas com o projeto, a produção pode começar, reforçando nosso poder naval e aprofundando nossa parceria de defesa."
 HOL_military.078.a:0 "Juntos garantimos os mares."
 HOL_military.079.t:0 "§Y[BEL.GetNameWithFlag]§! Rejeita a Colaboração nas Fragatas ASW"
 HOL_military.079.d:0 "§Y[BEL.GetNameWithFlag]§! recusou nossa proposta de construir em conjunto uma nova geração de fragatas de Guerra Antissubmarino (ASW). Citando prioridades divergentes e preocupações estratégicas, a Bélgica optou por seguir de forma independente seu próprio caminho de modernização naval."
 HOL_military.079.a:0 "Lamentável. Seguiremos sozinhos."
 HOL_military.083.t:0 "Crise Militar nos Países Baixos"
 HOL_military.083.d:0 "Com os Países Baixos não se beneficiando mais de apoio internacional, a falta de autossuficiência em nossa produção militar mergulhou nossas forças armadas em crise. A escassez de equipamentos prejudica gravemente nossas capacidades operacionais, deixando-nos perigosamente vulneráveis neste momento crítico."
 HOL_military.083.a:0 "Devemos agir rapidamente para resolver essa crise!"
 HOL_military.084.t:0 "Proposta Holandesa de Colaboração Espacial"
 HOL_military.084.d:0 "Os Países Baixos nos procuraram com uma proposta para ampliar a cooperação internacional em pesquisa espacial e avanços tecnológicos. Eles oferecem programas de desenvolvimento conjunto, que poderiam levar a descobertas revolucionárias em infraestrutura espacial civil e tecnologia orbital."
 HOL_military.084.a:0 "Aceitar e investir na parceria."
 HOL_military.084.b:0 "Rejeitar a oferta holandesa."
 HOL_military.085.t:0 "Cooperação Espacial Rejeitada"
 HOL_military.085.d:0 "[ROOT.GetName] recusou cooperar conosco em pesquisa espacial, citando preocupações com a segurança nacional e a alocação de recursos. Esse revés limita nossa capacidade de progredir em tecnologias espaciais avançadas."
 HOL_military.085.a:0 "Notícia lamentável."
 HOL_military.086.t:0 "Parceria Espacial Bem-Sucedida"
 HOL_military.086.d:0 "[ROOT.GetName] concordou em colaborar com os Países Baixos em pesquisa espacial. Essa parceria proporcionará novas oportunidades de avanços tecnológicos compartilhados e aprofundará nossa expertise em exploração espacial."
 HOL_military.086.a:0 "Um passo firme rumo ao progresso interestelar!"
 HOL_military.087.t:0 "Desenvolvimento Espacial Civil Conjunto"
 HOL_military.087.d:0 "[ROOT.GetName] aceitou nossa proposta de uma iniciativa espacial conjunta. Juntos, desenvolveremos tecnologias espaciais civis avançadas, incluindo melhores sistemas de satélites, instalações de pesquisa orbital e redes de comunicação aprimoradas."
 HOL_military.087.a:0 "Uma aliança promissora para o futuro do espaço!"
 HOL_military.088.t:0 "Nomear a Colônia de Marte"
 HOL_military.088.d:0 "A colônia está de pé. Os habitats estão pressurizados, a energia está estável e os primeiros residentes holandeses permanentes pisaram em solo marciano. Resta uma pergunta: como se chamará este assentamento? Os fundadores propuseram quatro nomes, cada um extraído de uma lenda da terra natal que deixaram para trás."
 HOL_military.089.t:0 "Mars One: Revisão de Financiamento"
 HOL_military.089.d:0 "O primeiro veículo de trânsito tripulado deixou a órbita terrestre e seguiu rumo a Marte. O controle da missão em Noordwijk contata o governo: as projeções mostram que a montagem do suporte de vida da colônia ficará atrasada, a menos que fundos suplementares sejam liberados agora. A decisão não pode esperar."
 HOL_military.090.t:0 "Falha no Software de Navegação"
 HOL_military.090.d:0 "Onze meses após o início do trânsito, surge um erro de sincronização no software autônomo de acoplamento. Se não for corrigido, os módulos do habitat não poderão se conectar na chegada. Engenheiros da ESTEC oferecem duas opções: um patch completo, que exige tempo de processamento e financiamento adicionais, ou uma solução alternativa de controle manual, mais barata, mas que desacelerará os procedimentos de aproximação final e adiará a data de prontidão prevista da colônia."
 HOL_military.091.t:0 "Primeiras Amostras do Solo Marciano"
 HOL_military.091.d:0 "O módulo de pouso avançado devolveu suas primeiras amostras de núcleo do local proposto para a colônia em Isidis Planitia. A análise espectral confirma concentrações elevadas de minerais com cromo em profundidade. A equipe científica quer ampliar a área de levantamento e publicar as descobertas preliminares; a direção da missão quer a tripulação focada exclusivamente na construção do habitat. Não é possível seguir os dois caminhos ao mesmo tempo."
 HOL_military.092.t:0 "Alerta de Pressão na Cúpula"
 HOL_military.092.d:0 "Durante o acabamento final, uma microfratura é detectada no anel de junção da cúpula principal do habitat. A falha é reparável, mas exige equipamentos de soldagem especializados e turnos ininterruptos. A alternativa é selar o segmento afetado e operar a colônia com pressão reduzida até a próxima janela de reabastecimento, o que adiará o comissionamento em vários meses."
 HOL_military.104.t:0 "Os Países Baixos Nos Convidam para um Programa Naval Conjunto"
 HOL_military.104.d:0 "O governo holandês nos convidou a aderir ao seu Programa Naval Conjunto do Caribe, voltado a fortalecer a segurança marítima e aprimorar a cooperação naval. Essa iniciativa poderia fortalecer nossa marinha e fornecer apoio valioso contra ameaças regionais."
 HOL_military.104.a:0 "Aceitar o Convite"
 HOL_military.104.b:0 "Recusar a Oferta"
 HOL_military.105.t:0 "[ROOT.GetNameWithFlag] Adere ao Programa Naval!"
 HOL_military.105.d:0 "Um de nossos aliados no Caribe aceitou nosso convite para o Programa Naval Conjunto. Sua participação fortalece nossa influência naval na região e aprimora as operações marítimas conjuntas."
 HOL_military.105.a:0 "Excelente!"
 HOL_military.106.t:0 "[ROOT.GetNameWithFlag] Recusa o Programa Naval"
 HOL_military.106.d:0 "Um de nossos aliados no Caribe recusou nosso convite para o Programa Naval Conjunto. Isso enfraquece a cooperação regional, mas continuaremos nossos esforços com aqueles dispostos a participar."
 HOL_military.106.a:0 "Lamentável."
 HOL_military.107.t:0 "Participação Holandesa Impulsiona a Airbus"
 HOL_military.107.d:0 "Os Países Baixos aderiram oficialmente ao projeto Eurofighter. Essa decisão canalizará financiamento e contratos adicionais para as operações francesas da Airbus, fortalecendo seu papel no poder aéreo de próxima geração da Europa."
 HOL_military.107.a:0 "Um bem-vindo impulso industrial."
 HOL_military.108.t:0 "Investimento Holandês Beneficia a Airbus Espanhola"
 HOL_military.108.d:0 "Com a adesão dos Países Baixos ao consórcio Eurofighter, espera-se que a divisão espanhola da Airbus receba um aumento de pedidos e de apoio à produção, reforçando a posição da Espanha na indústria de defesa europeia."
 HOL_military.108.a:0 "Desenvolvimento positivo para nosso setor."
 HOL_military.109.t:0 "BAE Systems Lucrará com a Entrada Holandesa no Eurofighter"
 HOL_military.109.d:0 "A entrada dos Países Baixos no programa Eurofighter garante mais cooperação com a BAE Systems. Os setores britânicos de manufatura e P&D devem se beneficiar diretamente dessa parceria ampliada."
 HOL_military.109.a:0 "Uma oportunidade econômica para a Grã-Bretanha."
 HOL_military.110.t:0 "Alenia Aeronautica Ganha Contratos Holandeses"
 HOL_military.110.d:0 "A Alenia, da Itália, se beneficiará da cooperação ampliada agora que os Países Baixos fazem parte do projeto Eurofighter. Os laços industriais entre os dois países se fortalecem, prometendo futuras joint ventures."
 HOL_military.110.a:0 "Uma vitória para a indústria de defesa italiana."
 HOL_military.111.t:0 "Compra Holandesa do Saab JAS 39 Gripen"
 HOL_military.111.d:0 "Em uma jogada surpreendente, os Países Baixos selecionaram o Saab JAS 39 Gripen sueco como seu caça multifunção de próxima geração. Essa aquisição marca uma mudança significativa nas compras de defesa e dá um impulso substancial à indústria de defesa nacional da Suécia."
 HOL_military.111.a:0 "A inovação sueca vence o contrato."
 HOL_military.112.t:0 "Aquisição Holandesa dos Caminhões Scania Gryphus"
 HOL_military.112.d:0 "Os Países Baixos assinaram um grande contrato com a Scania para a entrega de veículos militares de transporte Gryphus. Essa medida impulsiona o setor de manufatura de defesa da Suécia e consolida ainda mais a cooperação político-industrial militar holandesa-sueca."
 HOL_military.112.a:0 "Confiável e eficiente, uma ótima escolha."
 HOL_military.113.t:0 "Encomenda Holandesa de Submarinos da Classe Barracuda"
 HOL_military.113.d:0 "Os Países Baixos finalizaram um importante acordo de aquisição com o Naval Group da França para a compra de submarinos avançados da classe Barracuda. Isso aprofunda os laços de defesa franco-holandeses e dá um impulso substancial à indústria naval francesa."
 HOL_military.113.a:0 "Um passo poderoso sob as ondas."
 HOL_monarchy.01.t:0 "Pedido de Aprovação do Casamento Real"
 HOL_monarchy.01.d:0 "O governo enfrenta uma decisão importante sobre o casamento proposto entre o Príncipe Herdeiro Willem-Alexander e Máxima Zorreguieta. Embora Máxima seja bem vista, a controvérsia envolve seu pai, Jorge Zorreguieta, que serviu como ministro durante a ditadura militar argentina. Aprovar o casamento poderia provocar debate público e reação política. Como devemos proceder?"
 HOL_monarchy.01.a:0 "Aprovar o Casamento"
 HOL_monarchy.01.a_desc:0 "§YA Família Real§! ficará §GSatisfeita§!"
 HOL_monarchy.01.b:0 "Negar o Casamento"
 HOL_monarchy.01.b_desc:0 "Isso pode §RIrritar§! §YA Família Real§!, resultando em perda ou ganho de §YPopularidade Nacionalista§!"
 HOL_monarchy.02.t:0 "Casamento Aprovado Apesar da Controvérsia"
 HOL_monarchy.02.d:0 "O governo aprovou o casamento, apesar das preocupações com o pai de Máxima, Jorge Zorreguieta. Essa decisão pode ter repercussões tanto na opinião pública quanto nos círculos políticos."
 HOL_monarchy.02.a:0 "Prosseguir com o Casamento"
 HOL_monarchy.03.t:0 "Reação Mista do Público e da Mídia"
 HOL_monarchy.03.d:0 "O anúncio do casamento gerou reações mistas na mídia e no público. Há um debate contínuo sobre a adequação de Máxima como futura rainha, com alguns partidos políticos pedindo uma discussão no parlamento. Como o governo deve responder?"
 HOL_monarchy.03.a:0 "Permitir que Máxima Fale"
 HOL_monarchy.03.b:0 "Retirar o Apoio do Governo"
 HOL_monarchy.04.t:0 "Declaração de Máxima"
 HOL_monarchy.04.d:0 "Em uma entrevista, Máxima declarou 'Mi papa es un buen hombre' (Meu pai é um bom homem). Apesar da controvérsia, o casal ganha amplo apoio por meio de sua dedicação e aparições públicas."
 HOL_monarchy.04.a:0 "Apoiar Seus Esforços"
 HOL_monarchy.05.t:0 "O Casamento Acontece"
 HOL_monarchy.05.d:0 "O casamento aconteceu em 2002, celebrado com grande entusiasmo público e orgulho nacional. Desde então, Máxima tornou-se muito popular, contribuindo significativamente para a estabilidade e a popularidade da monarquia nos Países Baixos."
 HOL_monarchy.05.a:0 "Celebrar a Ocasião"
 HOL_monarchy.06.t:0 "Governo Retira o Apoio"
 HOL_monarchy.06.d:0 "O governo decidiu retirar seu apoio ao casamento devido à controvérsia persistente. O casal real agora enfrenta uma decisão difícil. Willem-Alexander seguirá adiante sem a aprovação do governo?"
 HOL_monarchy.06.a:0 "Aguardar a Decisão Deles"
 HOL_monarchy.07.t:0 "Willem-Alexander Escolhe o Amor"
 HOL_monarchy.07.d:0 "Willem-Alexander decidiu seguir adiante com o casamento apesar da decisão do governo, o que levará à perda de sua pretensão ao trono. Isso provocou uma crise constitucional e dividiu a opinião pública."
 HOL_monarchy.07.a:0 "Monitorar a Situação"
 HOL_monarchy.08.t:0 "Reação Pública Negativa"
 HOL_monarchy.08.d:0 "O casamento sem a aprovação do governo levou a uma perda de apoio à monarquia, e cresce o debate sobre a relevância da monarquia na sociedade moderna."
 HOL_monarchy.08.a:0 "Gerenciar a Crise"
 HOL_monarchy.09.t:0 "Apoio Público ao Casal Real"
 HOL_monarchy.09.d:0 "A recusa do governo em aprovar o casamento provocou um forte movimento público em apoio ao casal real. Manifestações e petições exigem que o governo reconsidere sua decisão."
 HOL_monarchy.09.a:0 "Continuar Monitorando"
 HOL_monarchy.10.t:0 "Campanha de Pressão Pública"
 HOL_monarchy.10.d:0 "A pressão pública está aumentando. Muitas figuras influentes e cidadãos pedem que o governo permita o casamento. A família real está se engajando ativamente com os apoiadores para conquistar a simpatia do público."
 HOL_monarchy.10.a:0 "Avaliar a Situação"
 HOL_monarchy.11.t:0 "Reconsideração da Aprovação"
 HOL_monarchy.11.d:0 "O crescente apoio público forçou o governo a reconsiderar sua posição. O governo deve agora conceder permissão para o casamento ou manter a proibição?"
 HOL_monarchy.11.a:0 "Conceder Permissão"
 HOL_monarchy.11.b:0 "Manter a Proibição"
 HOL_monarchy.12.t:0 "Monarca Bloqueia Decisões Políticas"
 HOL_monarchy.12.d:0 "Indignada com a contínua recusa em aprovar o casamento, a monarquia começou a bloquear decisões importantes do governo como forma de retaliação. Essa medida criou um impasse político e desestabilizou ainda mais a situação."
 HOL_monarchy.12.a:0 "Lidar com a Crise"
 HOL_monarchy.13.t:0 "O Ultimato Holandês"
 HOL_monarchy.13.d:0 "O Reino dos Países Baixos emitiu um ultimato a Luxemburgo, exigindo sua integração imediata. Luxemburgo cederá ou arriscará a guerra?"
 HOL_monarchy.13.a:0 "Aceitamos a integração holandesa."
 HOL_monarchy.13.b:0 "Nos recusamos a ceder!"
 HOL_monarchy.14.t:0 "Luxemburgo Aceita o Ultimato"
 HOL_monarchy.14.d:0 "Luxemburgo concordou em se integrar ao Reino dos Países Baixos. Esse resultado pacífico consolida a influência holandesa na região."
 HOL_monarchy.14.a:0 "Uma vitória pacífica!"
 HOL_monarchy.15.t:0 "Luxemburgo Recusa o Ultimato"
 HOL_monarchy.15.d:0 "Luxemburgo rejeitou o ultimato holandês, recusando a integração. Os Países Baixos devem agora decidir se impõem suas exigências pela força."
 HOL_monarchy.15.a:0 "Preparar-se para a guerra!"
 HOL_monarchy.16.t:0 "O Ultimato Holandês"
 HOL_monarchy.16.d:0 "O Reino dos Países Baixos emitiu um ultimato à Irlanda, exigindo sua integração imediata. A Irlanda cederá ou arriscará a guerra?"
 HOL_monarchy.16.a:0 "Aceitamos a integração holandesa."
 HOL_monarchy.16.b:0 "Nos recusamos a ceder!"
 HOL_monarchy.17.t:0 "Irlanda Aceita o Ultimato"
 HOL_monarchy.17.d:0 "A Irlanda concordou em se integrar ao Reino dos Países Baixos. Esse resultado pacífico consolida a influência holandesa na região."
 HOL_monarchy.17.a:0 "Uma vitória pacífica!"
 HOL_monarchy.18.t:0 "Irlanda Recusa o Ultimato"
 HOL_monarchy.18.d:0 "A Irlanda rejeitou o ultimato holandês, recusando a integração. Os Países Baixos devem agora decidir se impõem suas exigências pela força."
 HOL_monarchy.18.a:0 "Preparar-se para a guerra!"
 HOL_monarchy.19.t:0 "O Ultimato Holandês à Inglaterra"
 HOL_monarchy.19.d:0 "Os Países Baixos emitiram um ultimato ousado à Inglaterra, exigindo sua integração. Essa jogada audaciosa questiona se a Inglaterra cederá às exigências holandesas ou se manterá firme em desafio."
 HOL_monarchy.19.a:0 "Aceitamos o domínio holandês."
 HOL_monarchy.19.b:0 "Jamais nos renderemos!"
 HOL_monarchy.20.t:0 "Inglaterra Submete-se ao Domínio Holandês"
 HOL_monarchy.20.d:0 "Em uma reviravolta chocante, a Inglaterra concordou com as exigências holandesas, integrando-se ao Reino dos Países Baixos. Os holandeses agora comandam vastos novos recursos e prestígio."
 HOL_monarchy.20.a:0 "O leão curva-se diante da coroa dos Países Baixos!"
 HOL_monarchy.21.t:0 "Inglaterra Mantém-se Firme"
 HOL_monarchy.21.d:0 "A Inglaterra recusou o ultimato holandês, rejeitando a integração e preparando-se para o conflito. Os Países Baixos devem agora decidir seu próximo curso de ação."
 HOL_monarchy.21.a:0 "Às armas!"
 HOL_monarchy.22.t:0 "O Ultimato Holandês à Escócia"
 HOL_monarchy.22.d:0 "Os Países Baixos emitiram um ultimato ousado à Escócia, exigindo sua integração ao reino holandês. A Escócia cederá às exigências holandesas ou se preparará para resistir?"
 HOL_monarchy.22.a:0 "Vamos nos unir aos Países Baixos."
 HOL_monarchy.22.b:0 "As Highlands jamais se curvarão!"
 HOL_monarchy.23.t:0 "Escócia Submete-se ao Domínio Holandês"
 HOL_monarchy.23.d:0 "Em uma atitude surpreendente, a Escócia aceitou o ultimato dos Países Baixos, integrando-se ao Reino dos Países Baixos. Os holandeses agora controlam a terra das Highlands."
 HOL_monarchy.23.a:0 "A Escócia tornou-se território holandês."
 HOL_monarchy.24.t:0 "Escócia Rejeita o Ultimato"
 HOL_monarchy.24.d:0 "A Escócia rejeitou desafiadoramente o ultimato holandês, preparando-se para resistir. Os Países Baixos devem agora decidir se impõem suas exigências por meio da guerra."
 HOL_monarchy.24.a:0 "Então é guerra!"
 HOL_monarchy.25.t:0 "Proposta de União Pessoal"
 HOL_monarchy.25.d:0 "Os Países Baixos propuseram formar uma união pessoal com Luxemburgo. Essa proposta promete uma integração política e econômica mais estreita entre as duas nações. Luxemburgo aceitará essa oportunidade histórica ou recusará a oferta?"
 HOL_monarchy.25.a:0 "Concordar com a União Pessoal"
 HOL_monarchy.25.b:0 "Recusar a União Pessoal"
 HOL_monarchy.26.t:0 "Luxemburgo Aceita a Proposta"
 HOL_monarchy.26.d:0 "Luxemburgo concordou com a proposta de união pessoal! As duas nações agora compartilham um vínculo mais profundo, com Luxemburgo alinhando-se de perto aos interesses holandeses. Isso marca um novo capítulo na história da região."
 HOL_monarchy.26.a:0 "Excelente notícia!"
 HOL_monarchy.27.t:0 "Luxemburgo Rejeita a Proposta"
 HOL_monarchy.27.d:0 "Luxemburgo rejeitou a proposta de união pessoal com os Países Baixos. Apesar dos esforços diplomáticos, a liderança luxemburguesa optou por permanecer independente. Esse resultado é uma decepção para as ambições holandesas."
 HOL_monarchy.27.a:0 "Decepcionante"
 HOL_monarchy.28.t:0 "Proposta de União com a Irlanda"
 HOL_monarchy.28.d:0 "Os Países Baixos nos enviaram uma proposta intrigante: formar uma união pessoal com a Irlanda. Esse acordo nos colocaria sob a Coroa holandesa, mantendo a autonomia sobre nossos assuntos internos. Eles argumentam que tal união garantiria nossa estabilidade econômica e fortaleceria nossa posição na Europa. Aceitaremos essa oferta ou rejeitaremos suas ambições?"
 HOL_monarchy.28.a:0 "Aceitar a Proposta"
 HOL_monarchy.28.b:0 "Rejeitar a Proposta"
 HOL_monarchy.29.t:0 "Irlanda Aceita a Proposta"
 HOL_monarchy.29.d:0 "A Irlanda concordou com a proposta de uma união pessoal sob a Coroa holandesa. Esse momento histórico marca o início de uma nova era de cooperação e destino compartilhado entre nossas nações. O Reino dos Países Baixos agora supervisionará os assuntos irlandeses, garantindo prosperidade e segurança mútuas."
 HOL_monarchy.29.a:0 "Uma União para as Eras"
 HOL_monarchy.30.t:0 "Irlanda Rejeita a Proposta"
 HOL_monarchy.30.d:0 "A Irlanda rejeitou nossa proposta de união pessoal, optando por manter a plena independência. Essa decisão é decepcionante, mas devemos respeitar sua soberania. Por ora, a Irlanda continuará separada da Coroa holandesa."
 HOL_monarchy.30.a:0 "Um Resultado Decepcionante"
 HOL_monarchy.31.t:0 "Proposta de União com a Inglaterra"
 HOL_monarchy.31.d:0 "Os Países Baixos nos procuraram com uma proposta ousada: formar uma união pessoal sob a Coroa holandesa. Eles argumentam que tal parceria preservaria a soberania da Inglaterra e, ao mesmo tempo, garantiria estabilidade e prosperidade para ambas as nações. Essa oferta pode trazer uma nova era de cooperação ou representar um desafio à nossa independência. O que decidiremos?"
 HOL_monarchy.31.a:0 "Aceitar a Proposta"
 HOL_monarchy.31.b:0 "Rejeitar a Proposta"
 HOL_monarchy.32.t:0 "Inglaterra Aceita a Proposta"
 HOL_monarchy.32.d:0 "Em uma decisão marcante, a Inglaterra concordou em formar uma união pessoal com os Países Baixos sob a Coroa holandesa. Essa parceria marca o início de um futuro compartilhado, combinando nossas forças para garantir estabilidade e prosperidade mútua. Juntos, moldaremos o destino da Europa."
 HOL_monarchy.32.a:0 "Um Acordo Histórico"
 HOL_monarchy.33.t:0 "Inglaterra Rejeita a Proposta"
 HOL_monarchy.33.d:0 "A Inglaterra rejeitou a proposta holandesa de união pessoal, optando por manter sua plena independência. A decisão reflete seu compromisso com a soberania, embora deixe em aberto a questão das futuras relações com os Países Baixos."
 HOL_monarchy.33.a:0 "Uma Oportunidade Perdida"
 HOL_monarchy.34.t:0 "Proposta de Unidade com a Escócia"
 HOL_monarchy.34.d:0 "O governo holandês estendeu à Escócia uma oferta para formar uma união pessoal, unindo as duas nações sob a liderança da Coroa holandesa. Essa união promete benefício mútuo, prosperidade e segurança em um mundo incerto. A Escócia concordará com essa proposta ou manterá sua independência?"
 HOL_monarchy.34.a:0 "Aceitar a proposta de unidade."
 HOL_monarchy.34.b:0 "Rejeitar a proposta de unidade."
 HOL_monarchy.35.t:0 "Escócia Aceita a União"
 HOL_monarchy.35.d:0 "A Escócia concordou em formar uma união pessoal com os Países Baixos. Esse acordo histórico consolida nossos laços e estabelece a liderança da Coroa holandesa sobre a Escócia, marcando uma nova era de cooperação e unidade."
 HOL_monarchy.35.a:0 "Um novo capítulo começa!"
 HOL_monarchy.36.t:0 "Escócia Rejeita a União"
 HOL_monarchy.36.d:0 "A Escócia recusou a proposta holandesa de união pessoal, optando por manter sua independência. Embora decepcionante, essa decisão ressalta o desejo da Escócia de traçar o próprio rumo."
 HOL_monarchy.36.a:0 "Uma oportunidade perdida."
 HOL_monarchy.37.t:0 "Pedido Holandês de Parceria Estratégica"
 HOL_monarchy.37.d:0 "Os Países Baixos, liderados por um monarca constitucional e comprometidos com a cooperação ocidental, solicitaram formalmente o status de Principal Aliado Extra-OTAN. Concedê-lo fortaleceria as relações transatlânticas e garantiria um parceiro-chave na Europa."
 HOL_monarchy.37.a:0 "Aprovar o pedido, um aliado valioso."
 HOL_monarchy.37.b:0 "Recusar, devemos ser cautelosos com tais designações."
 HOL_monarchy.38.t:0 "Status de Principal Aliado Extra-OTAN Concedido"
 HOL_monarchy.38.d:0 "Os Estados Unidos responderam positivamente ao nosso pedido. Os Países Baixos agora são formalmente reconhecidos como Principal Aliado Extra-OTAN, um marco em nosso alinhamento de política externa com o Ocidente."
 HOL_monarchy.38.a:0 "Um passo importante para nossa monarquia."
 HOL_monarchy.39.t:0 "Pedido de Parceria Estratégica Negado"
 HOL_monarchy.39.d:0 "Apesar de nossos esforços diplomáticos e de nossa firme orientação ocidental, os Estados Unidos recusaram nosso pedido de status de Principal Aliado Extra-OTAN. Teremos que nos provar ainda mais no cenário mundial."
 HOL_monarchy.39.a:0 "Decepcionante, mas não é o fim."
 HOL_politics.01.t:0 "Decisão sobre o Casamento entre Pessoas do Mesmo Sexo"
 HOL_politics.01.d:0 "O Parlamento holandês está debatendo a legalização do casamento entre pessoas do mesmo sexo. Essa decisão histórica moldará o panorama social e político do país. Devemos permitir o casamento entre pessoas do mesmo sexo ou defender os valores tradicionais?"
 HOL_politics.01.a:0 "Legalizar o Casamento entre Pessoas do Mesmo Sexo"
 HOL_politics.01.b:0 "Defender os Valores Tradicionais"
 HOL_politics.02.t:0 "A Noite de Fortuyn"
 HOL_politics.02.d:0 "O clima político nos Países Baixos está tenso, e Pim Fortuyn tornou-se o centro das atenções com suas declarações e políticas controversas. As ameaças contra sua vida estão se tornando mais frequentes. O que acontecerá a seguir?"
 HOL_politics.02.a:0 "Só o tempo dirá."
 HOL_politics.03.t:0 "Assassinato de Pim Fortuyn"
 HOL_politics.03.d:0 "Em 6 de maio de 2002, Pim Fortuyn foi tragicamente assassinado, abalando a nação até o âmago. Sua morte deixa um vazio na política holandesa e provocou uma onda de agitação."
 HOL_politics.03.a:0 "Uma perda trágica para a nação."
 HOL_politics.04.t:0 "Atentado Contra a Vida de Pim Fortuyn Fracassa"
 HOL_politics.04.d:0 "Foi feita uma tentativa contra a vida de Pim Fortuyn, mas ele escapou por pouco. A nação está aliviada, mas as tensões continuam altas."
 HOL_politics.04.a:0 "Fortuyn vive para lutar outro dia."
 HOL_politics.05.t:0 "Escolha da Liderança do VVD"
 HOL_politics.05.d:0 "O VVD está em uma encruzilhada e deve escolher seu próximo líder. Apoiará o pragmático Mark Rutte ou a linha mais dura de sua ala anti-imigração?"
 HOL_politics.05.a:0 "Apoiar Mark Rutte"
 HOL_politics.05.b:0 "Apoiar Geert Wilders"
 HOL_politics.06.t:0 "Acordo Climático"
 HOL_politics.06.d:0 "O governo está comprometido em reduzir as emissões de gases de efeito estufa e alcançar as metas climáticas. Temos duas opções principais para cumprir nossos compromissos: investir em energia nuclear ou expandir os recursos de energia renovável. Cada caminho tem seus próprios benefícios e desafios."
 HOL_politics.06.a:0 "Investir em Energia Nuclear"
 HOL_politics.06.b:0 "Expandir os Recursos de Energia Renovável"
 HOL_politics.07.t:0 "Liderança do CDA"
 HOL_politics.07.d:0 "Com a renúncia de Jan Peter Balkenende após o colapso de seu quarto gabinete, o CDA deve escolher um novo líder para guiar o partido adiante. O partido escolherá o experiente Maxime Verhagen ou o mais jovem Sybrand Buma para conduzi-lo ao futuro?"
 HOL_politics.07.a:0 "Apoiar Maxime Verhagen"
 HOL_politics.07.b:0 "Apoiar Sybrand Buma"
 HOL_politics.08.t:0 "Desenvolvimento Urbano Verde"
 HOL_politics.08.a:0 "Focar no Transporte Público"
 HOL_politics.08.b:0 "Priorizar os Espaços Verdes"
 HOL_politics.08.c:0 "Promover Moradias Sustentáveis"
 HOL_politics.08.d:0 "O governo do PvdA está comprometido com o desenvolvimento urbano sustentável, e há vários caminhos a seguir. Devemos nos concentrar em melhorar o transporte público, expandir os espaços verdes, promover moradias sustentáveis ou investir em tecnologia de cidades inteligentes? Cada caminho moldará o futuro de nossas cidades de maneira única."
 HOL_politics.09.t:0 "Transição para a Energia Verde"
 HOL_politics.09.d:0 "Como parte de nosso compromisso com um futuro sustentável, devemos escolher como abastecer os Países Baixos daqui em diante. Devemos nos concentrar na energia nuclear para garantir um suprimento estável, investir em fontes renováveis como eólica e solar, ou recorrer à mineração tradicional de carvão para atender às necessidades imediatas de energia?"
 HOL_politics.09.a:0 "Focar na Energia Nuclear"
 HOL_politics.09.b:0 "Investir em Energia Renovável"
 HOL_politics.09.c:0 "Revitalizar a Mineração de Carvão"
 HOL_politics.11.t:0 "Investir no Futuro da Educação"
 HOL_politics.11.a:0 "Focar na Tecnologia 3D"
 HOL_politics.11.b:0 "Focar na Inteligência Artificial"
 HOL_politics.11.c:0 "Focar nas Tecnologias de Escavação"
 HOL_politics.11.d:0 "Para se preparar para os desafios de amanhã, o governo do PvdA lidera um esforço para modernizar o sistema educacional. Priorizaremos tecnologias de ponta como tecnologia 3D, inteligência artificial, técnicas avançadas de escavação e eletrônica naval, para garantir que a força de trabalho do futuro tenha as habilidades necessárias para prosperar."
 HOL_politics.12.t:0 "Geert Wilders Rompe com o VVD"
 HOL_politics.12.d:0 "Após a crescente insatisfação com a posição do VVD em questões-chave como imigração e integração europeia, Geert Wilders decidiu deixar o VVD. Ele pretende formar seu próprio partido, com foco em políticas nacionalistas e forte oposição à imigração. Isso marca uma divisão significativa na política holandesa e a ascensão do Partido da Liberdade"
 HOL_politics.12.a:0 "Geert Wilders deixa o VVD e cria o PVV"
 HOL_politics.13.t:0 "Iniciativas de Inovação Social"
 HOL_politics.13.d:0 "Uma nova onda de inovação social surgiu nos Países Baixos. Devemos nos concentrar em melhorias de longo prazo na velocidade de pesquisa nos setores civis ou usar avanços tecnológicos imediatos para acelerar projetos-chave?"
 HOL_politics.13.a:0 "Aumentar a Velocidade de Pesquisa"
 HOL_politics.13.b:0 "Focar no Progresso Tecnológico Imediato"
 HOL_politics.14.t:0 "Concessões de Recursos Africâneres"
 HOL_politics.14.d:0 "A facção africâner expressou uma forte ligação com os Países Baixos e pressiona para conceder ao governo holandês direitos sobre recursos em um dos estados ricos em recursos da África do Sul. Essa medida contornaria efetivamente a autoridade sul-africana, fortalecendo a influência holandesa. Devemos intervir para impedir essa concessão ou ignorar a medida e deixar os africâneres prosseguirem?"
 HOL_politics.14.a:0 "Ignorar a Concessão"
 HOL_politics.14.b:0 "Intervir e Impedir a Concessão"
 HOL_politics.15.t:0 "Direitos sobre Recursos Africâneres Concedidos"
 HOL_politics.15.d:0 "A facção africâner transferiu com sucesso os direitos sobre recursos para os Países Baixos. Conforme sua decisão, os holandeses agora detêm direitos em um dos valiosos estados da África do Sul, aprofundando os laços entre os Países Baixos e os africâneres."
 HOL_politics.15.a:0 "Apoio Africâner em Gauteng "
 HOL_politics.15.b:0 "Apoio Africâner em Natal"
 HOL_politics.16.t:0 "Integração Flamenga Nível 1 Alcançada"
 HOL_politics.16.d:0 "A Proeminência Holandesa em §Y[FLN.GetNameWithFlag]§! atingiu um nível notável. O apoio à integração está agora no Nível 1, fortalecendo os laços culturais e econômicos."
 HOL_politics.16.a:0 "Entendido"
 HOL_politics.17.t:0 "Integração Flamenga Nível 2 Alcançada"
 HOL_politics.17.d:0 "O impulso pela integração flamenga atingiu o Nível 2, com crescente cooperação e apoio dos partidos locais."
 HOL_politics.17.a:0 "Entendido"
 HOL_politics.18.t:0 "Integração Flamenga Nível 3 Alcançada"
 HOL_politics.18.d:0 "Os esforços de integração atingiram o Nível 3, sinalizando uma forte parceria em comércio, cultura e alinhamento político."
 HOL_politics.18.a:0 "Entendido"
 HOL_politics.19.t:0 "Integração Flamenga Nível 4 Alcançada"
 HOL_politics.19.d:0 "A integração de Nível 4 indica um alinhamento quase total entre Flandres e os Países Baixos, com cooperação mútua em todas as frentes."
 HOL_politics.19.a:0 "Entendido"
 HOL_politics.20.t:0 "Integração Flamenga Nível 5 Alcançada"
 HOL_politics.20.d:0 "A integração de Flandres com os Países Baixos está completa. O vínculo cultural e político atingiu sua força máxima."
 HOL_politics.20.a:0 "Entendido"
 HOL_politics.21.t:0 "Questão de §Y[FLN.GetNameWithFlag]§! Chega ao Ponto de Crise"
 HOL_politics.21.d:0 "A Proeminência Holandesa em §Y[FLN.GetNameWithFlag]§! atingiu níveis sem precedentes, com forte impulso pela integração plena aos Países Baixos. §Y[BEL.GetNameWithFlag]§! agora enfrenta uma decisão crucial: ceder §Y[FLN.GetNameWithFlag]§! pacificamente ou resistir, arriscando uma guerra com os Países Baixos."
 HOL_politics.21.a:0 "É a vontade do povo flamengo"
 HOL_politics.21.b:0 "Resistir e Declarar Guerra"
 HOL_politics.22.t:0 "Uma Proposta de §Y[HOL.GetNameWithFlag]§!"
 HOL_politics.22.d:0 "Em uma jogada diplomática ousada, o governo holandês nos procurou com uma proposta para remodelar o equilíbrio de poder na Europa Ocidental. Eles sugerem a dissolução da Bélgica, dividindo seus territórios entre os Países Baixos e a França. A proposta depende de um referendo para determinar o destino do povo belga. Aceitar essa oferta poderia redefinir nossa influência na região, mas traz riscos de condenação internacional e de possível conflito. Como devemos responder a essa ambiciosa investida dos holandeses?"
 HOL_politics.22.a:0 "Pressionar a Bélgica por um Referendo"
 HOL_politics.22.b:0 "Recusar a Oferta Holandesa"
 HOL_politics.23.t:0 "Um Ultimato Conjunto dos Países Baixos e da França"
 HOL_politics.23.d:0 "Os governos dos Países Baixos e da França nos apresentaram conjuntamente uma exigência extraordinária: realizar um referendo que decidirá o destino da Bélgica. Eles propõem a divisão de nosso país entre si, alegando que isso atende ao melhor interesse do povo belga e à estabilidade da região. Concordar com suas exigências significaria arriscar a própria existência da Bélgica como Estado soberano, enquanto recusar pode levar a uma perigosa escalada das tensões. O futuro de nossa nação está em jogo. Como devemos responder?"
 HOL_politics.23.a:0 "Concordar com o Referendo"
 HOL_politics.23.b:0 "Recusar e Manter Nossa Posição"
 BEL_referendum_mission_tooltip:0 "Iniciar o processo do Referendo"
 HOL_politics.24.t:0 "Bélgica Concorda com um Referendo"
 HOL_politics.24.d:0 "Após intensa pressão diplomática, o governo belga concordou em realizar um referendo sobre o futuro de seu país. Essa votação histórica determinará se a Bélgica permanece um Estado unificado ou se é dividida entre os Países Baixos e a França. A decisão marca um momento crítico na história europeia, pois o destino da Bélgica agora está nas mãos de seu povo."
 HOL_politics.24.a:0 "O Referendo Está Marcado"
 HOL_politics.25.t:0 "Bélgica Recusa o Referendo"
 HOL_politics.25.d:0 "O governo belga rejeitou a proposta dos Países Baixos e da França de realizar um referendo sobre o futuro de sua nação. Declarando seu compromisso inabalável com a soberania da Bélgica, recusou-se a considerar a ideia de dividir seu país. Essa decisão pode aumentar as tensões na região, enquanto os Países Baixos e a França avaliam seus próximos passos em resposta a esse desafio."
 HOL_politics.25.a:0 "Preparar-se para as Consequências"
 HOL_politics.26.t:0 "Resultados do Referendo: A Bélgica Será Dissolvida"
 HOL_politics.26.d:0 "Os resultados do referendo saíram: o povo belga votou pela dissolução da nação. Os territórios de Flandres e Valônia serão agora divididos entre os Países Baixos e a França, com partes do leste da Bélgica alinhando-se com a Alemanha. Essa decisão marca o fim da Bélgica como Estado unificado e o início de um novo capítulo na geopolítica europeia. O governo deve agora supervisionar essa transição histórica, mas a dissolução de nosso país pode provocar mais agitação."
 HOL_politics.26.a:0 "Aceitar a Decisão do Povo"
 HOL_Belgium_gameover:0 "§RFim de Jogo!§!"
 HOL_politics.27.t:0 "Resultados do Referendo: A Bélgica Permanece Unida"
 HOL_politics.27.d:0 "Os resultados do referendo saíram, e o povo belga votou esmagadoramente por manter a unidade de sua nação. Essa decisão reforça a soberania e a identidade da Bélgica, rejeitando as pressões externas dos Países Baixos e da França. Embora esse resultado seja uma vitória para a unidade nacional, a tensão criada durante o processo pode persistir, e medidas devem ser tomadas para curar divisões e restaurar a estabilidade."
 HOL_politics.27.a:0 "Celebrar Nossa Unidade"
 HOL_politics.28.t:0 "A Bélgica é Dissolvida"
 HOL_politics.28.d:0 "O referendo foi concluído, e o povo belga votou pela dissolução de sua nação. Conforme o acordo, os territórios da Bélgica estão sendo divididos. Os Países Baixos integrarão Flandres, a França incorporará a Valônia, e partes do leste da Bélgica se alinharão com a Alemanha. Essa mudança monumental nas fronteiras europeias anuncia uma nova era na geopolítica regional e redefine o equilíbrio de poder na Europa Ocidental."
 HOL_politics.28.a:0 "Uma Votação Histórica"
 HOL_politics.29.t:0 "A Bélgica Permanece Unida"
 HOL_politics.29.d:0 "Os resultados do referendo saíram, e o povo belga decidiu preservar a unidade de sua nação. Esse resultado reforça a soberania da Bélgica e põe fim às ambições de dividir seus territórios entre as nações vizinhas. Os Países Baixos, a França e a Alemanha devem agora lidar com a realidade de um Estado belga fortalecido, enquanto os esforços para remodelar a região chegam a um impasse."
 HOL_politics.29.a:0 "Um Resultado Decepcionante"
 HOL_politics.30.t:0 "Oferta Holandesa de Parceria em Gás Offshore na Venezuela"
 HOL_politics.30.d:0 "O governo holandês, junto com a Shell, propôs uma joint venture para extrair e refinar reservas de gás offshore na Venezuela. Essa parceria poderia impulsionar a produção regional de energia e fortalecer os laços diplomáticos."
 HOL_politics.30.a:0 "Aceitar a Proposta Holandesa"
 HOL_politics.30.b:0 "Recusar a Oferta"
 HOL_politics.31.t:0 "Venezuela Aceita o Acordo de Energia"
 HOL_politics.31.d:0 "O governo venezuelano concordou com a parceria de extração de gás offshore com os Países Baixos. Esse acordo fortalecerá as relações econômicas e energéticas."
 HOL_politics.31.a:0 "Um grande sucesso!"
 HOL_politics.32.t:0 "Venezuela Recusa o Acordo de Energia"
 HOL_politics.32.d:0 "O governo venezuelano rejeitou a parceria de energia proposta, citando preocupações com a soberania."
 HOL_politics.32.a:0 "Lamentável."
 HOL_politics.33.t:0 "Investimento Holandês na Indústria de Exportação de GNL da Argentina"
 HOL_politics.33.d:0 "Empresas de energia holandesas, incluindo a Shell, manifestaram interesse em expandir a infraestrutura de exportação de GNL da Argentina. Esse acordo poderia impulsionar os laços econômicos e fazer da Argentina um ator-chave no comércio global de gás natural."
 HOL_politics.33.a:0 "Aprovar o investimento"
 HOL_politics.33.b:0 "Rejeitar a proposta"
 HOL_politics.34.t:0 "Argentina Aprova o Investimento Holandês em GNL"
 HOL_politics.34.d:0 "A Argentina aprovou os investimentos holandeses em sua infraestrutura de GNL, fortalecendo a cooperação energética entre ambas as nações. Isso melhorará o comércio de energia e ampliará a capacidade de exportação."
 HOL_politics.34.a:0 "Um grande sucesso para o comércio!"
 HOL_politics.35.t:0 "Argentina Rejeita o Investimento Holandês em GNL"
 HOL_politics.35.d:0 "A Argentina recusou a proposta holandesa de expansão da infraestrutura de GNL, citando independência econômica e preocupações estratégicas."
 HOL_politics.35.a:0 "Lamentável."
 HOL_politics.36.t:0 "Oferta Holandesa de Apoio à Modernização Naval do México"
 HOL_politics.36.d:0 "A Damen Shipyards, uma importante fabricante naval holandesa, ofereceu ao México a oportunidade de ampliar sua frota naval com navios-patrulha construídos nos Países Baixos. Isso poderia fortalecer a segurança marítima do México e melhorar os laços de defesa entre Países Baixos e México."
 HOL_politics.36.a:0 "Aprovar a parceria naval"
 HOL_politics.36.b:0 "Recusar a oferta"
 HOL_politics.37.t:0 "México Aprova o Acordo de Modernização Naval"
 HOL_politics.37.d:0 "O México aceitou a oferta holandesa, concordando em integrar embarcações construídas pela Damen em sua marinha. Esse acordo fortalece a cooperação militar entre os Países Baixos e o México."
 HOL_politics.37.a:0 "Excelente!"
 HOL_politics.38.t:0 "México Recusa o Apoio Naval Holandês"
 HOL_politics.38.d:0 "O governo mexicano recusou a oferta holandesa, optando por confiar na produção doméstica para sua expansão naval."
 HOL_politics.38.a:0 "Decepcionante."
 HOL_politics.39.t:0 "Investimento Holandês na Expansão do Porto de Cartagena, na Colômbia"
 HOL_politics.39.d:0 "Os Países Baixos ofereceram-se para expandir o Porto de Cartagena, um dos maiores polos marítimos da América Latina. Empresas holandesas de infraestrutura melhorariam a logística portuária, beneficiando tanto o comércio quanto as operações navais estratégicas."
 HOL_politics.39.a:0 "Aprovar o investimento holandês"
 HOL_politics.39.b:0 "Rejeitar a proposta"
 HOL_politics.40.t:0 "Colômbia Aceita o Investimento Portuário Holandês"
 HOL_politics.40.d:0 "A Colômbia concordou com o projeto holandês de expansão portuária. Essa parceria melhorará a eficiência comercial e fortalecerá o papel da Colômbia na logística regional."
 HOL_politics.40.a:0 "Um importante passo econômico!"
 HOL_politics.41.t:0 "Colômbia Rejeita o Investimento Portuário Holandês"
 HOL_politics.41.d:0 "O governo colombiano decidiu contra o envolvimento holandês na expansão de seu porto, citando soberania econômica."
 HOL_politics.41.a:0 "Lamentável."
 HOL_politics.42.t:0 "Oferta Holandesa de Investimento em Hidrogênio Verde no Paraguai"
 HOL_politics.42.d:0 "Empresas holandesas propuseram investir mais de US$ 100 milhões no setor de hidrogênio verde e amônia do Paraguai. Esse projeto poderia posicionar o Paraguai como líder na transição de energia renovável da América Latina."
 HOL_politics.42.a:0 "Aprovar o investimento"
 HOL_politics.42.b:0 "Recusar o acordo"
 HOL_politics.43.t:0 "Paraguai Aprova o Investimento Holandês em Hidrogênio Verde"
 HOL_politics.43.d:0 "O Paraguai aprovou a iniciativa de hidrogênio verde liderada pelos holandeses. Esse projeto proporcionará crescimento econômico ao mesmo tempo que avança as ambições de energia renovável da América Latina."
 HOL_politics.43.a:0 "Um passo rumo à sustentabilidade!"
 HOL_politics.44.t:0 "Paraguai Recusa o Investimento Holandês em Hidrogênio Verde"
 HOL_politics.44.d:0 "O Paraguai rejeitou a proposta holandesa, optando por desenvolver seu setor de energia renovável de forma independente."
 HOL_politics.44.a:0 "Decepcionante."
 HOL_politics.45.t:0 "Investimento Holandês no Parque Eólico Punta Lomitas, no Peru"
 HOL_politics.45.d:0 "A ENGIE Energía Perú, com apoio holandês, propôs um importante projeto de parque eólico no Peru. Os Países Baixos ofereceram apoio adicional para expandir a infraestrutura de energia renovável na região."
 HOL_politics.45.a:0 "Aprovar o envolvimento holandês"
 HOL_politics.45.b:0 "Rejeitar a proposta"
 HOL_politics.46.t:0 "Peru Aceita o Investimento Holandês em Energia Eólica"
 HOL_politics.46.d:0 "O Peru aprovou o envolvimento holandês no Parque Eólico Punta Lomitas. Isso aumentará a segurança energética do Peru e reforçará a presença dos Países Baixos no mercado de energia verde da América Latina."
 HOL_politics.46.a:0 "Uma vitória para a sustentabilidade!"
 HOL_politics.47.t:0 "Peru Recusa o Investimento Holandês em Energia Eólica"
 HOL_politics.47.d:0 "O governo peruano recusou a proposta holandesa, preferindo conduzir internamente os projetos de energia renovável."
 HOL_politics.47.a:0 "Lamentável."
 HOL_politics.48.t:0 "Propor a Operação Market Vision aos Estados Unidos"
 HOL_politics.48.d:0 "Em um esforço para aprofundar nossa parceria estratégica com os Estados Unidos, o Ministério da Defesa elaborou uma proposta para a 'Operação Market Vision', uma iniciativa conjunta voltada a integrar as capacidades político-industriais militares holandesas e americanas. O plano inclui P&D compartilhado em aeroespacial, defesa cibernética e infraestrutura logística. Se os americanos concordarem, isso poderá ser um ponto de virada na modernização da defesa holandesa."
 HOL_politics.48.a:0 "Enviar a proposta a Washington"
 HOL_politics.48.b:0 "Agora não é o momento certo"
 HOL_politics.49.t:0 "Os Países Baixos Propõem a 'Operação Market Vision'"
 HOL_politics.49.d:0 "O governo holandês propôs uma iniciativa militar-industrial conjunta intitulada 'Operação Market Vision'. O programa prevê investimentos compartilhados em defesa cibernética, logística de defesa e manufatura avançada. Embora simbólico de confiança e compromisso, também exigirá colaboração e financiamento concretos."
 HOL_politics.49.a:0 "Aceitar a proposta – aprofundar nossa aliança"
 HOL_politics.49.b:0 "Recusar educadamente – nossas prioridades estão em outro lugar"
 HOL_politics.50.t:0 "Operação Market Vision Rejeitada"
 HOL_politics.50.d:0 "Os Estados Unidos recusaram nossa proposta de lançar a 'Operação Market Vision', uma iniciativa conjunta para fortalecer a cooperação industrial de defesa entre Países Baixos e EUA. Embora o tom diplomático tenha sido cortês, a recusa é um sinal claro de que Washington atualmente não está disposta a aprofundar a integração estratégica de defesa. Devemos reconsiderar nossos planos de modernização, de forma independente ou com outros parceiros."
 HOL_politics.50.a:0 "Um revés decepcionante."
 HOL_politics.51.t:0 "Os Países Baixos Propõem um Acordo de Comércio e Desenvolvimento"
 HOL_politics.51.d:0 "O governo holandês ofereceu formalmente ao Suriname um amplo acordo de comércio e desenvolvimento. O acordo proposto inclui investimento em infraestrutura, acesso comercial favorável e assistência técnica em troca de laços diplomáticos e econômicos fortalecidos. Aceitar esse acordo poderia impulsionar nosso desenvolvimento. Também pode aumentar a influência holandesa em nossos assuntos internos."
 HOL_politics.51.a:0 "Aceitar a proposta holandesa"
 HOL_politics.51.b:0 "Rejeitar a oferta para manter a independência"
 HOL_politics.52.t:0 "Suriname Aceita o Acordo de Comércio e Desenvolvimento"
 HOL_politics.52.d:0 "O Suriname aceitou oficialmente nossa oferta de acordo de comércio e desenvolvimento. Isso marca um novo capítulo na cooperação holandesa-surinamesa, proporcionando oportunidades de investimento mútuo e integração econômica mais profunda."
 HOL_politics.52.a:0 "Um passo histórico adiante."
 HOL_politics.53.t:0 "Suriname Aceita a Proposta Comercial Holandesa"
 HOL_politics.53.d:0 "Após negociações, o governo surinamês concordou com o acordo de comércio e desenvolvimento proposto. Os termos incluem ajuda em infraestrutura, investimento portuário e acesso comercial de longo prazo. O acordo fortalece nossa posição na América do Sul e reafirma a presença regional dos Países Baixos."
 HOL_politics.53.a:0 "Excelente. Vamos avançar juntos."
 HOL_politics.54.t:0 "Proposta Holandesa de Desenvolvimento de Infraestrutura no Suriname"
 HOL_politics.54.d:0 "O governo holandês estendeu a §Y[SUR.GetNameWithFlag]§! uma oferta para auxiliar na modernização e expansão da infraestrutura crítica do Suriname. A proposta inclui investimentos em redes viárias, instalações portuárias e serviços públicos, visando impulsionar o crescimento econômico e a conectividade regional. O Suriname deve agora decidir se aceita essa iniciativa."
 HOL_politics.54.a:0 "Aceitar o investimento e a cooperação holandeses."
 HOL_politics.54.b:0 "Recusar: priorizar os projetos domésticos."
 HOL_politics.55.t:0 "Suriname Aceita o Acordo de Infraestrutura"
 HOL_politics.55.d:0 "§Y[SUR.GetNameWithFlag]§! aceitou nossa proposta de desenvolver e modernizar em conjunto a infraestrutura do Suriname. Investimentos em estradas, portos e serviços públicos começarão em breve, fortalecendo os laços econômicos e aprofundando a relação histórica entre nossas nações."
 HOL_politics.55.a:0 "Excelente: um passo rumo a uma cooperação mais forte."
 HOL_politics.56.t:0 "Suriname Rejeita o Acordo de Infraestrutura"
 HOL_politics.56.d:0 "§Y[SUR.GetNameWithFlag]§! recusou nossa oferta de auxiliar no desenvolvimento e na modernização de sua infraestrutura. Citando o desejo de maior independência nacional e controle sobre os projetos internos, o Suriname optou por seguir seu próprio caminho sem o envolvimento holandês."
 HOL_politics.56.a:0 "Decepcionante, mas respeitaremos a decisão deles."
 HOL_politics.63.t:0 "Acordo de Cooperação Marítima"
 HOL_politics.63.d:0 "O governo holandês estendeu ao Suriname uma oferta formal para estabelecer um acordo de cooperação marítima. O plano inclui investimentos em infraestrutura portuária, operações de dragagem, logística costeira e apoio ao treinamento naval. Essa iniciativa poderia aumentar as capacidades marítimas do Suriname e sua posição no comércio regional. Também pode aumentar a influência estratégica holandesa."
 HOL_politics.63.a:0 "Aceitar o acordo"
 HOL_politics.63.b:0 "Rejeitar a proposta"
 HOL_politics.64.t:0 "Suriname Aceita o Acordo Marítimo"
 HOL_politics.64.d:0 "O Suriname concordou com a proposta holandesa de cooperação marítima. Iniciativas conjuntas começarão em breve no desenvolvimento da infraestrutura costeira e na formação de capacidade naval. Isso marca um capítulo renovado nas relações holandesa-surinamesas, focado na segurança regional e no acesso econômico."
 HOL_politics.64.a:0 "Lançar a iniciativa"
 HOL_politics.65.t:0 "Suriname Rejeita o Acordo Marítimo"
 HOL_politics.65.d:0 "O Suriname recusou a oferta de cooperação marítima. A recusa sinaliza hesitação em aprofundar os laços bilaterais, provavelmente por preocupações com soberania, influência ou política interna. Como resultado, os planos de colaboração marítima serão engavetados por ora."
 HOL_politics.65.a:0 "Uma oportunidade perdida"
 HOL_politics.66.t:0 "Oferecer Treinamento Militar Conjunto"
 HOL_politics.66.d:0 "O governo holandês fez contato com uma proposta de exercícios militares conjuntos. A iniciativa visa fortalecer a cooperação tática, a prontidão regional e a confiança mútua entre as forças armadas de ambas as nações."
 HOL_politics.66.a:0 "Aceitar a proposta"
 HOL_politics.66.b:0 "Recusar por enquanto"
 HOL_politics.67.t:0 "Suriname Aceita a Oferta de Treinamento Militar"
 HOL_politics.67.d:0 "O Suriname concordou em realizar operações de treinamento conjunto com nossas forças armadas. Estão em andamento os preparativos para uma série de exercícios bilaterais focados em logística, guerra na selva e operações de fronteira."
 HOL_politics.67.a:0 "Força pela cooperação"
 HOL_politics.68.t:0 "Suriname Recusa a Oferta de Treinamento Militar"
 HOL_politics.68.d:0 "O Suriname recusou nossa oferta de participar de treinamento militar conjunto. A decisão é decepcionante, mas continuaremos a explorar formas de aprofundar os laços de defesa regionais."
 HOL_politics.68.a:0 "Anotado"
 HOL_politics.69.t:0 "Oferta Holandesa de Investimento em Recursos"
 HOL_politics.69.d:0 "O governo holandês nos procurou com uma proposta de investir em nosso setor de recursos. O plano inclui injeções de capital na extração e refino de alumínio, com acordos de exportação de longo prazo. Embora isso possa trazer oportunidades de desenvolvimento, alguns temem uma renovada dependência do capital holandês."
 HOL_politics.69.a:0 "Aceitar o investimento"
 HOL_politics.69.b:0 "Recusar a oferta"
 HOL_politics.69_tt:0 "§RDaremos a [1006.GetName] direitos sobre recursos a [HOL.GetAdjectiveCap]§!"
 HOL_politics.70.t:0 "Suriname Aceita o Investimento em Recursos"
 HOL_politics.70.d:0 "O Suriname concordou com nossa proposta de investimento em recursos. Empresas e consultores técnicos holandeses começarão as operações em breve em regiões selecionadas."
 HOL_politics.70.a:0 "Prosseguir com a implementação"
 HOL_politics.71.t:0 "Suriname Rejeita o Investimento em Recursos"
 HOL_politics.71.d:0 "O Suriname recusou nossa proposta de investir em seu setor de recursos naturais. As preocupações com soberania e propriedade estrangeira parecem ter superado os incentivos econômicos."
 HOL_politics.71.a:0 "Respeitaremos a decisão deles"
 HOL_politics.72.t:0 "Queda do Gabinete Kok II"
 HOL_politics.72.d:0 "Após a divulgação do relatório do NIOD sobre o papel holandês na queda de Srebrenica, o Primeiro-Ministro Wim Kok e seu governo apresentaram sua renúncia. A medida é vista como um ato simbólico de responsabilização, mas lançou o cenário político em turbulência poucos meses antes das eleições gerais."
 HOL_politics.72.a:0 "O gabinete renuncia"
 HOL_politics.73.t:0 "Eleição Geral Extra Holandesa"
 HOL_politics.73.desc:0 "Com a queda do gabinete Kok II, foram convocadas eleições antecipadas. O clima político é turbulento, e vários grandes partidos se preparam para disputar o poder. A ascensão do populismo, as questões de responsabilidade e a identidade nacional dominam o debate."
 HOL_politics.73.a:0 "Apoiar o PvdA – Continuidade de centro-esquerda"
 HOL_politics.73.b:0 "Apoiar o CDA – Estabilidade democrata-cristã"
 HOL_politics.73.c:0 "Apoiar o VVD – Reforma econômica liberal"
 HOL_politics.73.d:0 "Apoiar o PVV – Continuar o legado fortuynista"
 HOL_politics.73.e:0 "Apoiar o LPF – O movimento populista de Fortuyn"
 HOL_politics.73_tt:0 "§YNossa eleição começará em 14 dias§!"
 HOL_politics.74.t:0 "Iniciativa Conjunta de Treinamento da OTAN"
 HOL_politics.74.d:0 "Em um esforço para fortalecer a cooperação de defesa transatlântica, os Países Baixos iniciaram um programa de treinamento militar conjunto envolvendo os Estados Unidos, o Reino Unido, a Alemanha, a Bélgica e a França. Esses exercícios visam melhorar a interoperabilidade, a prontidão e o alinhamento estratégico entre os países-membros da OTAN."
 HOL_politics.74.a:0 "Juntos, somos mais fortes."
 HOL_politics.75.t:0 "Governo Holandês Estende a Mão aos Africâneres"
 HOL_politics.75.d:0 "Os Países Baixos, agora governados pelo PVV, anunciaram formalmente uma nova política voltada a fortalecer os laços culturais e históricos com a comunidade africâner da África do Sul. A iniciativa despertou renovado interesse na herança compartilhada entre os dois povos."
 HOL_politics.75.a:0 "Devemos agir!"
 HOL_politics.76.t:0 "Pressão Holandesa para Proteger os Direitos dos Africâneres"
 HOL_politics.76.d:0 "O governo holandês foi além dos gestos simbólicos e agora exerce pressão política sobre a África do Sul para que se comprometa formalmente a proteger os direitos da comunidade africâner. A influência holandesa está crescendo, e suas expectativas são claras: proteja seus compatriotas ou arrisque um desgaste diplomático."
 HOL_politics.76.a:0 "Isso complica nossa política interna"
 HOL_politics.77.t:0 "Investimento holandês em empresas africâneres"
 HOL_politics.77.d:0 "O governo holandês iniciou um programa econômico direcionado para fortalecer os laços comerciais e de investimento com empresas de propriedade africâner. A medida pretende fomentar um canal paralelo de cooperação e aprofundar os laços históricos entre as duas comunidades e atacar nossa forma de governar a África do Sul"
 HOL_politics.77.a:0 "Isso pode ser nosso desafio para sempre"
 HOL_common_event.1.t:0 "Rainha Beatrix anuncia sua abdicação"
 HOL_common_event.1.d:0 "Em um pronunciamento televisionado nacionalmente, a Rainha Beatrix anunciou oficialmente sua decisão de abdicar do trono em favor de seu filho, o Príncipe Willem-Alexander. Após mais de três décadas de serviço, ela afirmou que é hora de uma nova geração liderar. A transferência de poder está marcada para 30 de abril no Palácio Real de Amsterdã."
 HOL_common_event.1.a:0 "Começa uma transição real."
 HOL_common_event.2.t:0 "Posse do Rei Willem-Alexander"
 HOL_common_event.2.d:0 "Após a abdicação da Rainha Beatrix, o Príncipe Willem-Alexander foi oficialmente empossado como o novo monarca do Reino dos Países Baixos. A cerimônia, realizada no Palácio Real de Amsterdã, marca o início de um novo capítulo na monarquia constitucional holandesa. Sua ascensão é recebida com orgulho nacional e expectativas de um papel real moderno."
 HOL_common_event.2.a:0 "Vida longa ao Rei!"
 HOL_common_event.3.t:0 "Rei Willem-Alexander anuncia sua abdicação"
 HOL_common_event.3.d:0 "Após anos como monarca, o Rei Willem-Alexander declarou oficialmente sua intenção de abdicar do trono. Seguindo a tradição holandesa moderna, ele expressou confiança na capacidade da Princesa Herdeira Amalia de conduzir o Reino a uma nova era. A posse será realizada no devido tempo."
 HOL_common_event.3.a:0 "A tocha passa mais uma vez."
 HOL_common_event.4.t:0 "Posse da Rainha Amalia"
 HOL_common_event.4.d:0 "A Princesa Catharina-Amalia foi oficialmente empossada como Rainha dos Países Baixos, tornando-se a monarca mais jovem da história moderna do país. Sua ascensão representa continuidade e renovação para a monarquia constitucional holandesa, e é recebida com expectativa e orgulho nacional."
 HOL_common_event.4.a:0 "Vida longa à Rainha!"
 HOL_common_event.5.t:0 "Voo MH17 da Malaysia Airlines é abatido"
 HOL_common_event.5.d:0 "O voo MH17 da Malaysia Airlines foi abatido sobre o leste da Ucrânia. Todos os 298 passageiros e tripulantes morreram, incluindo 193 cidadãos holandeses. Investigadores internacionais suspeitam que foi usado um míssil terra-ar de fabricação russa. Os Países Baixos estão de luto. Devemos responder."
 HOL_common_event.5.a:0 "O mundo nos observa agora."
 HOL_common_event.6.t:0 "Discurso de Timmermans nas Nações Unidas"
 HOL_common_event.6.a:0 "Exigir cooperação e compensação da Rússia"
 HOL_common_event.6.b:0 "Desescalar para manter a paz"
 HOL_common_event.6.c:0 "Devemos nos preparar para a guerra: emitir um objetivo de guerra"
 HOL_common_event.6.d:0 "O Ministro das Relações Exteriores Frans Timmermans fez um discurso poderoso perante as Nações Unidas, pedindo justiça e responsabilização pela derrubada do MH17. Devemos agora decidir até onde estamos dispostos a ir: seguir a diplomacia, desescalar ou nos preparar para consequências militares."
 HOL_common_event.7.t:0 "Países Baixos pedem resposta militar da OTAN"
 HOL_common_event.7.d:0 "O governo holandês pediu formalmente que a OTAN tome ação militar em resposta à derrubada do MH17, citando o Artigo 5 e um ato de agressão. Como potência líder da aliança, devemos decidir se honramos esse chamado e arriscamos um conflito mais amplo com a Rússia."
 HOL_common_event.7.a:0 "Apoiar os holandeses e preparar-se para a guerra"
 HOL_common_event.7.b:0 "Não podemos escalar isso para um conflito global"
 HOL_common_event.8.t:0 "Os Estados Unidos apoiam a ação da OTAN"
 HOL_common_event.8.d:0 "Os Estados Unidos aprovaram nosso pedido de ação militar da OTAN em resposta ao MH17. Embora isso traga conflito imediato, não estaremos sozinhos. A Rússia emitiu uma declaração formal de guerra."
 HOL_common_event.8.a:0 "Permaneçamos unidos."
 HOL_common_event.9.t:0 "Os Estados Unidos recusam a escalada da OTAN"
 HOL_common_event.9.d:0 "Apesar do nosso pedido para que a OTAN agisse, os Estados Unidos se recusaram a autorizar uma resposta militar. Estamos sozinhos neste momento de crise, mas agiremos de qualquer forma. Os preparativos para um possível conflito com a Rússia estão em andamento."
 HOL_common_event.9.a:0 "Então devemos seguir em frente sozinhos."
 HOL_common_event.10.t:0 "Desastre dos fogos de artifício em Enschede"
 HOL_common_event.10.d:0 "Uma explosão catastrófica ocorreu no depósito de fogos de artifício da SE Fireworks no distrito de Roombeek, em Enschede. A explosão destruiu um bairro inteiro, matando 23 pessoas e ferindo quase mil. O desastre chocou a nação, levantou questões sobre as normas de segurança industrial e deixou centenas de desabrigados."
 HOL_common_event.10.a:0 "Uma tragédia nacional."
 HOL_common_event.11.t:0 "Theo van Gogh é assassinado em Amsterdã"
 HOL_common_event.11.d:0 "O polêmico cineasta e colunista Theo van Gogh foi assassinado em plena luz do dia em Amsterdã. O atacante, um extremista holandês-marroquino, citou o filme 'Submission' de Van Gogh como motivo. O incidente abalou a sociedade holandesa, provocando um debate nacional sobre liberdade de expressão, integração e extremismo religioso."
 HOL_common_event.11.a:0 "Um dia sombrio para os Países Baixos."
 HOL_common_event.12.t:0 "Ataque ao desfile do Koninginnedag"
 HOL_common_event.12.d:0 "A tragédia atingiu as comemorações nacionais do Koninginnedag em Apeldoorn quando um veículo foi deliberadamente lançado contra a multidão que assistia ao desfile real. O ataque causou oito mortes e feriu muitos outros, embora a família real tenha escapado ilesa. O incidente lançou uma sombra escura sobre o que costuma ser um dia de união e celebração."
 HOL_common_event.12.a:0 "Um ato horrível num dia de orgulho nacional."
 HOL_common_event.13.t:0 "Tiroteio em massa em Alphen aan den Rijn"
 HOL_common_event.13.d:0 "Em um trágico ato de violência, um atirador solitário abriu fogo num shopping center em Alphen aan den Rijn, matando seis pessoas e ferindo dezessete antes de tirar a própria vida. O incidente chocou a nação e levantou questões urgentes sobre o acesso a armas de fogo, os cuidados com a saúde mental e a segurança pública."
 HOL_common_event.13.a:0 "Uma tragédia chocante."
 HOL_common_event.14.t:0 "Graves inundações em Limburgo"
 HOL_common_event.14.d:0 "Chuvas recordes causaram inundações catastróficas na província de Limburgo. Os rios transbordaram, inundando cidades como Valkenburg e Roermond. Milhares foram evacuados, a infraestrutura foi danificada e os serviços de emergência foram mobilizados em todo o país. Embora não tenha havido mortes, o desastre reacendeu os debates sobre adaptação climática e gestão da água."
 HOL_common_event.14.a:0 "O risco climático está se tornando muito real."
 HOL_common_event.15.t:0 "Prevenir futuras inundações em Limburgo?"
 HOL_common_event.15.d:0 "Após as devastadoras inundações em Limburgo, especialistas em engenharia propuseram uma barragem de grande escala e um sistema de retenção de água para mitigar desastres futuros. O projeto exigiria investimento significativo, mas poderia proteger milhares de casas e garantir infraestrutura crítica. Agiremos com decisão ou adiaremos mais uma vez?"
 HOL_common_event.15.a:0 "Construir a Barragem de Defesa contra Inundações de Limburgo"
 HOL_common_event.15.b:0 "É caro demais por enquanto"
 HOL_common_event.17.t:0 "Príncipe Friso falece"
 HOL_common_event.17.d:0 "Após mais de um ano em coma devido a um trágico acidente de esqui, o Príncipe Johan Friso faleceu aos 44 anos. Sua morte foi recebida com profunda tristeza em todo o país. Embora não estivesse na linha de sucessão ao trono, Friso ocupava um lugar especial no coração de muitos."
 HOL_common_event.17.a:0 "Ele será lembrado com carinho."
 HOL_common_event.16.t:0 "Príncipe Friso é atingido por avalanche"
 HOL_common_event.16.d:0 "O Príncipe Johan Friso ficou gravemente ferido em uma avalanche enquanto esquiava na Áustria. Depois de ficar soterrado sob a neve por mais de 20 minutos, foi resgatado, mas sofreu graves danos cerebrais por falta de oxigênio. A família real pediu privacidade enquanto seu estado permanece incerto."
 HOL_common_event.16.a:0 "Um terrível acidente abala a nação."
 HOL_request_carrier_production_USA:0 "Pedir apoio dos EUA para a construção de porta-aviões"
 HOL_request_carrier_production_USA_desc:0 "Os Estados Unidos possuem uma experiência incomparável em guerra naval baseada em porta-aviões. Ao fazer um pedido formal de apoio, poderíamos acessar a capacidade e a tecnologia dos estaleiros americanos para iniciar a construção de um porta-aviões holandês moderno sob um acordo conjunto de defesa e indústria."
 HOL_request_carrier_production_FRA:0 "Pedir apoio francês para a construção de porta-aviões"
 HOL_request_carrier_production_FRA_desc:0 "A França mantém uma das forças navais mais avançadas da Europa, incluindo porta-aviões com capacidade nuclear. Fazer parceria com a indústria naval francesa poderia acelerar nossa capacidade de operar um novo porta-aviões e aprofundar a integração de defesa europeia."
 HOL_request_carrier_production_RUS:0 "Pedir apoio russo para a construção de porta-aviões"
 HOL_request_carrier_production_RUS_desc:0 "Embora controversa, a cooperação com a Rússia poderia dar acesso a tecnologias e projetos navais alternativos fora da esfera ocidental. Um esforço conjunto de construção seria geopoliticamente ousado, porém estrategicamente flexível."
 HOL_Flanders_Influence_variable:0 "Proeminência §Y[HOL.GetAdjective]§! em §Y[FLN.GetNameWithFlag]§!: §Y[?HOL.dutch_influence]§!"
 HOL_Flanders_Integration_level:0 "Nível de integração §Y[HOL.GetAdjective]§!: §Y[?HOL.HOL_integration_level]§!"
 HOL_pro_dutch_coalition:0 "Apoiar a coalizão pró-§Y[HOL.GetAdjective]§!"
 HOL_pro_dutch_coalition_desc:0 "Apoiar coalizões políticas dentro de §Y[FLN.GetNameWithFlag]§! inclinadas à integração §Y[HOL.GetAdjective]§!. Isso aumentará a influência §Y[HOL.GetAdjective]§! em §Y[FLN.GetNameWithFlag]§! e apoiará sua causa."
 HOL_pro_dutch_in_power:0 "§YGoverno pró-[HOL.GetAdjective]§! no poder"
 HOL_pro_dutch_in_power_desc:0 "Com um governo §Ypró-[HOL.GetAdjective]§! em §Y[FLN.GetNameWithFlag]§!, nossa influência cresce significativamente. Aproveite a oportunidade para avançar os esforços de integração."
 HOL_flanders_high_productivity:0 "Crescimento da produtividade em §Y[FLN.GetNameWithFlag]§!"
 HOL_flanders_high_productivity_desc:0 "A produtividade de §Y[FLN.GetNameWithFlag]§!' superou a média nacional da Bélgica, incentivando sentimentos de integração e aumentando a influência holandesa."
 BEL_counter_influence_flanders:0 "Combater a proeminência §Y[HOL.GetAdjective]§! em §Y[FLN.GetNameWithFlag]§!"
 BEL_counter_influence_flanders_desc:0 "Os Países Baixos buscam estender sua proeminência sobre §Y[FLN.GetNameWithFlag]§!. Combata esses esforços para preservar a unidade e a soberania belgas."
 HOL_influence_increased5:0 "A proeminência §Y[HOL.GetAdjective]§! em §Y[FLN.GetNameWithFlag]§! aumentará em §Y5§!!"
 HOL_influence_increased2:0 "A proeminência §Y[HOL.GetAdjective]§! em §Y[FLN.GetNameWithFlag]§! aumentará em §Y2§!!"
 HOL_influence_decreased10:0 "A proeminência §Y[HOL.GetAdjective]§! em §Y[FLN.GetNameWithFlag]§! diminuirá em §Y10§!!"
 HOL_voc_india_mission1:0 "Consolidar influência em §Y[RAJ.GetNameWithFlag]§!"
 HOL_voc_india_mission2:0 "Posicionar frota [HOL.GetFlag]§Y[HOL.GetAdjective]§! em §Y[RAJ.GetNameWithFlag]§!"
 HOL_voc_india_water:0 "Montar propaganda para a gestão hídrica §Y[HOL.GetAdjective]§!"
 HOL_voc_india_water_desc:0 "A gestão hídrica §Y[HOL.GetAdjective]§! é lendária. O governo §Y[RAJ.GetAdjective]§! tem problemas para resolver sua questão da água. Ao lançar uma campanha de propaganda, o governo é pressionado a deixar que os §Y[HOL.GetAdjective]§! resolvam o problema"
 HOL_voc_india_christian:0 "Apoiar comunidades cristãs em §Y[RAJ.GetNameWithFlag]§!"
 HOL_voc_india_christian_desc:0 "As comunidades cristãs em §Y[RAJ.GetNameWithFlag]§! estão muito insatisfeitas com o governo §Y[RAJ.GetAdjectiveCap]§!. Devemos usar essa oportunidade para aumentar nossa influência na comunidade cristã"
 HOL_voc_india_civilwar:0 "Enviar ultimato a §Y[RAJ.GetNameWithFlag]§!"
 HOL_voc_india_civilwar_desc:0 "Os §Y[RAJ.GetAdjectiveCap]§! estão lutando entre si. Podemos usar essa oportunidade para fazer a eles uma oferta irrecusável"
 HOL_voc_india_gujurat_rebellion1:0 "Aumentar a segurança e o apoio da população em §YGujarate§!"
 HOL_voc_india_gujurat_rebellion1_desc:0 "Podemos aproveitar a oportunidade das rebeliões maoístas. Ao aumentar nossa segurança e o apoio à população contra os maoístas, poderíamos criar nossa própria influência em Gujarate."
 HOL_voc_india_bengal_rebellion1:0 "Expandir a proeminência §Y[HOL.GetAdjectiveCap]§! em Bengala"
 HOL_voc_india_bengal_rebellion1_desc:0 "A instabilidade em §YBengala§!, alimentada pela atividade rebelde maoísta, apresenta uma oportunidade única para os §Y[HOL.GetAdjectiveCap]§! afirmarem sua influência. Com o governo §Y[RAJ.GetAdjectiveCap]§! distraído e incapaz de manter o controle, a VOC pode intervir para estabelecer laços econômicos e políticos, minando ainda mais a governança local e garantindo uma posição na região."
 HOL_voc_india_east_gujurat:0 "Tomar o controle do §YGujarate Oriental§!"
 HOL_voc_india_east_gujurat_desc:0 "O §YGujarate Oriental§! está desestabilizado por agitação e governança fraca. A VOC pode agir com decisão para assumir o controle dessa região, restaurando a ordem sob administração §Y[HOL.GetAdjectiveCap]§! e garantindo suas valiosas rotas comerciais."
 HOL_voc_india_west_bengal:0 "Tomar o controle de §YBengala Ocidental§!"
 HOL_voc_india_west_bengal_desc:0 "Com §YBengala Ocidental§! no caos, a VOC tem uma oportunidade única de afirmar domínio sobre essa região crítica. Assumir o controle consolidará a proeminência §Y[HOL.GetAdjectiveCap]§! no corredor comercial oriental da Índia."
 HOL_voc_india_kerala:0 "Tomar o controle de §YQuerala§!"
 HOL_voc_india_kerala_desc:0 "A localização estratégica de Querala e seus laços históricos com os §Y[HOL.GetAdjectiveCap]§! fazem dela um alvo principal para a intervenção da VOC. Assumir o controle dessa região estabelecerá uma base sólida para o poder §Y[HOL.GetAdjectiveCap]§! no sul da Índia."
 HOL_voc_india_tamil:0 "Tomar o controle de Tâmil Nadu"
 HOL_voc_india_tamil_desc:0 "Tâmil Nadu está à beira do colapso devido à crescente instabilidade. Ao assumir o controle, a VOC pode garantir seu domínio sobre uma das regiões mais importantes da Índia e assegurar que os interesses §Y[HOL.GetAdjectiveCap]§! sejam protegidos."
 HOL_voc_taiwan_agreement_USA:0 "Negociar o acordo de Taiwan com os §Y[USA.GetNameWithFlag]§!"
 HOL_voc_taiwan_agreement_USA_desc:0 "§Y[USA.GetNameWithFlag]§! há muito é o fiador da segurança §Y[TAI.GetAdjectiveCap]§!. Para promover os interesses §Y[HOL.GetAdjectiveCap]§! na região, devemos procurar o governo §Y[USA.GetAdjectiveCap]§! e pedir a suspensão de sua proteção sobre §Y[TAI.GetNameWithFlag]§!. Essa ousada manobra diplomática poderia abrir caminho para a VOC retomar territórios, mas traz riscos políticos significativos."
 HOL_voc_agriculture_agreement_srilanka:0 "Propor colaboração agrícola a §Y[SRI.GetNameWithFlag]§!"
 HOL_voc_agriculture_agreement_srilanka_desc:0 "O setor agrícola §Y[SRI.GetAdjectiveCap]§! enfrenta numerosos desafios, e a experiência §Y[HOL.GetAdjectiveCap]§! em técnicas agrícolas modernas poderia oferecer soluções transformadoras. Ao propor uma colaboração agrícola, podemos fortalecer os laços com §Y[SRI.GetNameWithFlag]§! e estabelecer uma base na região, aumentando tanto a produção econômica quanto a proeminência §Y[HOL.GetAdjectiveCap]§!."
 HOL_voc_investment_agreement_srilanka:0 "Tentar de novo o acordo de investimento com §Y[SRI.GetNameWithFlag]§!"
 HOL_voc_investment_agreement_srilanka_desc:0 "Depois da recusa do Sri Lanka à nossa proposta inicial de investimento, podemos revisitar a oportunidade de fortalecer seu setor agrícola por meio de novas negociações. É outra chance de estabelecer a proeminência holandesa e fomentar o crescimento econômico na região."
 HOL_voc_srilanka_mission1:0 "Consolidar influência em §Y[SRI.GetNameWithFlag]§!"
 HOL_voc_srilanka_mission1_desc:0 "Para reafirmar o controle §Y[HOL.GetAdjectiveCap]§! em §Y[SRI.GetNameWithFlag]§!, devemos estar entre os três maiores influenciadores do país. Alcançar essa posição consolidará nossa reputação e abrirá caminho para maior domínio na região."
 HOL_voc_srilanka_mission2:0 "Posicionar frota [HOL.GetFlag]§Y[HOL.GetAdjective]§! em §Y[SRI.GetNameWithFlag]§!"
 HOL_voc_srilanka_mission2_desc:0 "Para garantir nosso domínio sobre §Y[SRI.GetNameWithFlag]§!, precisamos de uma presença naval mais forte que a deles. Controlar os mares ao redor de §Y[SRI.GetNameWithFlag]§! garantirá rotas comerciais vitais e estabelecerá nossa autoridade no Oceano Índico."
 HOL_voc_taiwan_mission1:0 "Consolidar influência em §Y[TAI.GetNameWithFlag]§!"
 HOL_voc_taiwan_mission1_desc:0 "A importância estratégica §Y[TAI.GetAdjectiveCap]§! não pode ser subestimada. Para expandir a proeminência §Y[HOL.GetAdjectiveCap]§!, devemos garantir uma posição entre os três maiores influenciadores da nação, assegurando nossa base nessa região crítica."
 HOL_voc_taiwan_mission2:0 "Posicionar frota [HOL.GetFlag]§Y[HOL.GetAdjective]§! em §Y[TAI.GetNameWithFlag]§!"
 HOL_voc_taiwan_mission2_desc:0 "A posição §Y[TAI.GetAdjectiveCap]§! no Pacífico torna a supremacia naval crucial. Devemos superar a força naval §Y[TAI.GetAdjectiveCap]§! para controlar as águas ao redor e garantir nossos interesses na região."
 HOL_voc_indonesia_attack_mission:0 "A retomada de nossa §Y[IND.GetNameWithFlag]§! começa!"
 HOL_voc_indonesia_attack_mission_desc:0 "A Indonésia, outrora a joia do império da VOC, escapou do controle §Y[HOL.GetAdjectiveCap]§!. Agora chegou a hora de retomar nossa Colônia da Coroa. Por meio de precisão militar e domínio estratégico, restauraremos a autoridade §Y[HOL.GetAdjectiveCap]§! sobre o arquipélago e restabeleceremos nossa presença como potência global."
 HOL_request_military_access_australia:0 "Pedir acesso militar a §Y[AST.GetNameWithFlag]§!"
 HOL_request_military_access_australia_desc:0 "A localização estratégica §Y[AST.GetAdjectiveCap]§! a torna vital para nossas operações no Pacífico. Obter acesso militar garantiria uma logística mais fluida e tempos de resposta mais rápidos."
 HOL_deploy_java_commando:0 "Posicionar tropas da VOC"
 HOL_deploy_java_commando_desc:0 "Posicione nossas unidades de comandos encobertas §Y[IND.GetNameWithFlag]§! para estabelecer uma base estratégica. A força e o tipo das unidades dependerão de nossos preparativos anteriores."
 HOL_voc_small_reinvestment_sri_lanka:0 "Pequeno investimento na agricultura §Y[SRI.GetAdjectiveCap]§!"
 HOL_voc_medium_reinvestment_sri_lanka:0 "Investimento médio na agricultura §Y[SRI.GetAdjectiveCap]§!"
 HOL_voc_heavy_reinvestment_sri_lanka:0 "Grande investimento na agricultura §Y[SRI.GetAdjectiveCap]§!"
 HOL_voc_saf_mission1:0 "Consolidar influência em §Y[SAF.GetNameWithFlag]§!"
 HOL_voc_saf_mission2:0 "Posicionar frota [HOL.GetFlag]§Y[HOL.GetAdjective]§! em §Y[SAF.GetNameWithFlag]§!"
 HOL_increase_java_strength:0 "Aumentar nossa força na §YIlha de Java§!"
 HOL_increase_convoy:0 "Aumentar os navios de apoio à invasão"
 HOL_reduce_java_detection_corruption:0 "Usar autoridades corruptas de §Y[IND.GetNameWithFlag]§!"
 HOL_contact_christian_resistance_ind:0 "Propor acordo com os §YRebeldes Cristãos§!"
 HOL_reduce_java_detection:0 "Aumentar a segurança secreta na §YIlha de Java§!"
 HOL_voc_indonesia_counter_voc:0 "Novo relatório de insurgência §Y[HOL.GetAdjectiveCap]§!"
 HOL_voc_prepare_for_war_mission1:0 "Preparar a retomada territorial da VOC"
 HOL_voc_prepare_for_war_mission1_desc:0 "A era dos impérios comerciais pode ter passado, mas nosso legado continua inacabado. Do Cabo da Boa Esperança à Costa de Coromandel, do Ceilão a Formosa, a Companhia Holandesa das Índias Orientais já comandou pontos de estrangulamento marítimos vitais. Agora, com logística moderna e prontidão militar, nos preparamos para afirmar nossa influência mais uma vez, não por carta de concessão, mas pela força. Os mares aguardam nosso retorno."
 HOL_voc_prepare_for_war_mission2:0 "Preparar novamente a retomada territorial da VOC"
 HOL_voc_prepare_for_war_mission2_desc:0 "A era dos impérios comerciais pode ter passado, mas nosso legado continua inacabado. Do Cabo da Boa Esperança à Costa de Coromandel, do Ceilão a Formosa, a Companhia Holandesa das Índias Orientais já comandou pontos de estrangulamento marítimos vitais. Agora, com logística moderna e prontidão militar, nos preparamos para afirmar nossa influência mais uma vez, não por carta de concessão, mas pela força. Os mares aguardam nosso retorno."
 HOL_grey_society_category:0 "O dilema da sociedade grisalha"
 HOL_grey_society_category_desc:0 "\n£hol_grey_society_category_picture \n\n\n\nOs Países Baixos estão se tornando uma sociedade grisalha, em que o envelhecimento demográfico, o aumento da expectativa de vida e a queda das taxas de natalidade exercem imensa pressão sobre os serviços sociais, as pensões e a sustentabilidade econômica. Os formuladores de políticas devem agora enfrentar o abismo crescente entre as gerações. Reformaremos, redistribuiremos ou recuaremos para modelos insustentáveis do passado?"
 HOL_grey_pvda1:0 "Ampliar a moradia acessível"
 HOL_grey_pvda1_desc:0 "Para enfrentar os desafios de uma população em envelhecimento, estamos investindo em moradias acessíveis e adequadas aos idosos. Ao incentivar a mudança para imóveis menores e modernizar nosso parque habitacional, pretendemos liberar casas de família e ao mesmo tempo oferecer uma vida digna aos idosos."
 HOL_grey_pvda2:0 "Reformas flexíveis da previdência"
 HOL_grey_pvda2_desc:0 "Acreditamos num sistema previdenciário justo que se adapte às necessidades individuais. Ao oferecer opções flexíveis de aposentadoria, damos aos trabalhadores o poder de se aposentar nos próprios termos, garantindo a sustentabilidade de longo prazo do nosso sistema de seguridade social."
 HOL_grey_pvda3:0 "Investir em cuidadores de idosos"
 HOL_grey_pvda3_desc:0 "Com uma população idosa crescente, a demanda por cuidadores profissionais está aumentando. Estamos financiando programas de formação e melhorando as condições de trabalho para garantir que todo idoso holandês receba o cuidado que merece."
 HOL_grey_pvda4:0 "Programas de integração entre jovens e idosos"
 HOL_grey_pvda4_desc:0 "Ao reunir as gerações, promovemos a compreensão e o apoio mútuos. Nossos programas de integração oferecem moradia acessível a estudantes em comunidades de idosos em troca de engajamento social, criando uma sociedade mais forte e coesa."
 HOL_grey_pvda5:0 "Promover a economia verde e prateada"
 HOL_grey_pvda5_desc:0 "Estamos alinhando a transição verde com as oportunidades apresentadas pela 'economia prateada'. Investimentos em indústrias voltadas aos idosos, combinados com o foco em energia renovável, impulsionarão o crescimento sustentável e criarão empregos."
 HOL_grey_cda1:0 "Fortalecer o cuidado familiar"
 HOL_grey_cda1_desc:0 "A família é a pedra angular da nossa sociedade. Ao oferecer apoio financeiro a famílias que cuidam de parentes idosos, fortalecemos os laços entre gerações e aliviamos a pressão sobre a saúde pública."
 HOL_grey_cda2:0 "Apoiar comunidades rurais de idosos"
 HOL_grey_cda2_desc:0 "As áreas rurais não devem ficar para trás no enfrentamento do envelhecimento populacional. Ao investir em moradia e saúde rurais, garantimos que todo idoso tenha acesso a apoio de qualidade, onde quer que viva."
 HOL_grey_cda3:0 "Fortalecer as redes de voluntários religiosos"
 HOL_grey_cda3_desc:0 "As organizações religiosas são inestimáveis na prestação de cuidado e apoio. Estamos ampliando seu papel para garantir uma resposta moral e compassiva aos desafios de uma sociedade em envelhecimento."
 HOL_grey_cda4:0 "IA ética no cuidado de idosos"
 HOL_grey_cda4_desc:0 "As novas tecnologias devem servir ao bem comum. Ao integrar soluções de IA éticas no cuidado, defendemos nossos valores democrata-cristãos ao mesmo tempo em que enfrentamos a escassez de mão de obra no cuidado de idosos."
 HOL_grey_cda5:0 "Promover famílias numerosas"
 HOL_grey_cda5_desc:0 "Para garantir a estabilidade futura, estamos apoiando famílias com mais de três filhos por meio de incentivos financeiros e subsídios para creche, fomentando uma nova geração para sustentar nossa nação."
 HOL_grey_vvd1:0 "Elevar a idade de aposentadoria"
 HOL_grey_vvd1_desc:0 "Uma sociedade produtiva exige vidas profissionais mais longas. Ao elevar gradualmente a idade de aposentadoria, reduzimos o fardo previdenciário e garantimos uma economia mais forte para as gerações futuras."
 HOL_grey_vvd2:0 "Privatizar o cuidado de idosos"
 HOL_grey_vvd2_desc:0 "As empresas privadas podem lidar com o envelhecimento populacional de forma mais eficiente. Ao abrir o setor de cuidado de idosos ao investimento privado, elevamos a qualidade e reduzimos os custos públicos."
 HOL_grey_vvd3:0 "Promover a imigração de trabalhadores qualificados"
 HOL_grey_vvd3_desc:0 "Os desafios do envelhecimento exigem soluções inovadoras. Ao incentivar imigrantes qualificados a se juntarem à nossa força de trabalho, preenchemos lacunas críticas na saúde e em outros setores."
 HOL_grey_vvd4:0 "Digitalizar a saúde"
 HOL_grey_vvd4_desc:0 "A inovação é a chave da sustentabilidade. Por meio da transformação digital e da integração de IA na saúde, reduzimos custos e melhoramos o cuidado aos idosos."
 HOL_grey_vvd5:0 "Reforma de investimento previdenciário"
 HOL_grey_vvd5_desc:0 "Ao migrar as pensões públicas para contas de investimento privadas, reduzimos as obrigações do governo e damos aos cidadãos o poder de controlar seu futuro financeiro."
 HOL_grey_pvv1:0 "Proteger as pensões nacionais"
 HOL_grey_pvv1_desc:0 "As pensões holandesas devem continuar sendo prioridade. Ao redirecionar recursos da ajuda externa e de programas desnecessários, protegemos as pensões de nossos cidadãos trabalhadores."
 HOL_grey_pvv2:0 "Incentivar a automação"
 HOL_grey_pvv2_desc:0 "Para enfrentar a escassez de mão de obra, estamos investindo pesadamente em automação em todos os setores, reduzindo a dependência de trabalhadores estrangeiros e aumentando a produtividade."
 HOL_grey_pvv3:0 "Campanhas de recrutamento nacionalistas"
 HOL_grey_pvv3_desc:0 "Chegou a hora de priorizar os cidadãos holandeses na formação da nossa força de trabalho. Por meio de campanhas de recrutamento, garantimos que o talento holandês lidere o enfrentamento da escassez de mão de obra."
 HOL_grey_pvv4:0 "Controles rígidos de imigração"
 HOL_grey_pvv4_desc:0 "Os Países Baixos não podem suportar o fardo de uma imigração sem regulação. Ao controlar rigidamente as fronteiras, garantimos que os recursos sejam destinados aos nossos cidadãos e ao seu bem-estar."
 HOL_grey_pvv5:0 "Promover o patriotismo dos idosos"
 HOL_grey_pvv5_desc:0 "Nossos idosos são os guardiões da tradição holandesa. Ao celebrar suas contribuições, fomentamos a união e o orgulho de nossa identidade nacional."
 HOL_grey_monarchy1:0 "Fundo de Pensão Real"
 HOL_grey_monarchy1_desc:0 "Para garantir o futuro de nossos cidadãos, a monarquia criará um Fundo de Pensão Real. Esse fundo assegurará que todo cidadão holandês possa envelhecer com dignidade e segurança."
 HOL_grey_monarchy2:0 "Programa de Unidade Nacional"
 HOL_grey_monarchy2_desc:0 "A Coroa liderará um programa para unir gerações e regiões, fomentando um senso de responsabilidade compartilhada e lealdade à nação."
 HOL_grey_monarchy3:0 "Ampliar o serviço nacional"
 HOL_grey_monarchy3_desc:0 "O serviço nacional obrigatório para a juventude fortalecerá nossa força de trabalho e dará apoio crítico ao cuidado de idosos, forjando uma nação mais forte sob a orientação real."
 HOL_grey_monarchy4:0 "Investir em automação"
 HOL_grey_monarchy4_desc:0 "Ao usar fundos reais para promover a automação, garantimos que os Países Baixos continuem competitivos e sustentáveis, mesmo com o envelhecimento da população."
 HOL_grey_monarchy5:0 "Iniciativa da Economia Prateada"
 HOL_grey_monarchy5_desc:0 "A Coroa defenderá indústrias que atendam às necessidades de nossa população em envelhecimento, criando empregos e prosperidade enquanto serve aos idosos."
 HOL_grey_nvu1:0 "Programas de eugenia"
 HOL_grey_nvu1_desc:0 "Para garantir um futuro holandês forte e puro, estamos implementando políticas para incentivar o nascimento de cidadãos holandeses 'ideais' e desencorajar influências indesejáveis."
 HOL_grey_nvu2:0 "Excluir não holandeses da assistência social"
 HOL_grey_nvu2_desc:0 "Nossos recursos devem servir ao povo holandês. Ao retirar o acesso à assistência social dos residentes não holandeses, priorizamos o bem-estar de nossos cidadãos."
 HOL_grey_nvu3:0 "Ampliar o serviço militar obrigatório"
 HOL_grey_nvu3_desc:0 "Todos os homens holandeses aptos servirão nas forças armadas ou em indústrias essenciais, garantindo que nossa nação continue forte e autossuficiente."
 HOL_grey_nvu4:0 "Expansão industrial para a guerra"
 HOL_grey_nvu4_desc:0 "As necessidades do Estado vêm primeiro. Ao direcionar todos os recursos para a expansão industrial, nos preparamos para conflitos futuros e garantimos o domínio de nossa nação."
 HOL_grey_nvu5:0 "Trabalho forçado de idosos"
 HOL_grey_nvu5_desc:0 "Os idosos devem contribuir para os objetivos nacionais. Aqueles ainda capazes serão mobilizados para trabalho industrial leve em apoio às prioridades do Estado."
 HOL_foreign_policy_category:0 "Política externa holandesa"
 HOL_foreign_policy_category_desc:0 "\n£hol_foreign_affairs_category_picture \n\n\n\nMolde a postura diplomática, estratégica e econômica dos Países Baixos no cenário mundial. Busque acordos comerciais, parcerias de desenvolvimento e arranjos de defesa que reflitam os valores holandeses e garantam os interesses nacionais num mundo cada vez mais multipolar."
 HOL_antilles_expand_civilian_industry:0 "Expandir a indústria civil nas Antilhas"
 HOL_antilles_expand_civilian_industry_desc:0 "As Antilhas precisam de crescimento industrial para sustentar a prosperidade econômica. Ao investir na indústria civil, podemos estimular a criação de empregos e melhorar a infraestrutura, garantindo estabilidade de longo prazo na região."
 HOL_antilles_expand_office_industry:0 "Expandir o setor de escritórios nas Antilhas"
 HOL_antilles_expand_office_industry_desc:0 "Desenvolver espaços de escritórios e distritos empresariais nas Antilhas impulsionará a atividade comercial, atrairá investidores e melhorará a eficiência administrativa das empresas locais."
 HOL_antilles_expand_mil_industry:0 "Expandir a indústria militar nas Antilhas"
 HOL_antilles_expand_mil_industry_desc:0 "Uma indústria militar mais forte nas Antilhas dará vantagens estratégicas no Caribe, garantindo produção militar mais rápida e melhor segurança para os territórios holandeses de além-mar."
 HOL_antilles_expand_agriculture:0 "Investir na agricultura das Antilhas"
 HOL_antilles_expand_agriculture_desc:0 "A agricultura continua sendo um setor-chave para a segurança alimentar e a independência econômica. Investir na lavoura e no uso sustentável da terra nas Antilhas beneficiará tanto as cadeias de abastecimento locais quanto as nacionais."
 HOL_dutch_latin_cooperation:0 "Cooperação Holanda-América Latina"
 HOL_dutch_latin_cooperation_desc:0 "Os Países Baixos têm uma longa história de cooperação econômica e energética com a América Latina. Ao investir em projetos-chave de infraestrutura, desenvolvimentos de energia offshore e parcerias navais, podemos fortalecer nossa influência na região e garantir crescimento econômico mútuo."
 HOL_dutch_venezuela_offshore_gas:0 "Iniciativa de extração de gás offshore Shell-Venezuela"
 HOL_dutch_venezuela_offshore_gas_desc:0 "A Shell e a Venezuela vêm negociando um acordo para extrair e refinar gás offshore do campo de gás Dragon. Se esse acordo for finalizado, poderá garantir segurança energética de longo prazo para ambas as nações."
 HOL_dutch_argentina_lng_trade:0 "Acordo de expansão das exportações de GNL Shell-YPF"
 HOL_dutch_argentina_lng_trade_desc:0 "A YPF argentina e a Shell estão trabalhando num grande projeto de exportação de GNL, visando aumentar a oferta global. O investimento holandês nessa iniciativa poderia fortalecer os laços comerciais e garantir importações estáveis de gás natural."
 HOL_dutch_colombia_port_investment:0 "Expansão do Porto de Cartagena – Parceria com a Royal HaskoningDHV"
 HOL_dutch_colombia_port_investment_desc:0 "O Porto de Cartagena, na Colômbia, é um dos mais importantes polos comerciais da América Latina. A empresa holandesa de engenharia Royal HaskoningDHV tem a experiência necessária para expandir sua infraestrutura, melhorando a eficiência e impulsionando as relações comerciais holandês-colombianas."
 HOL_dutch_mexico_naval_cooperation:0 "Acordo de modernização Damen Shipyards-Marinha Mexicana"
 HOL_dutch_mexico_naval_cooperation_desc:0 "A Marinha Mexicana tem buscado modernizar sua frota, e a construtora naval holandesa Damen Shipyards já forneceu fragatas avançadas da classe POLA. A cooperação adicional fortalecerá o poder naval do México e reforçará as exportações de defesa holandesas."
 HOL_dutch_paraguay_green_hydrogen:0 "Investimento da Honest Ada Hydrogen no Paraguai"
 HOL_dutch_paraguay_green_hydrogen_desc:0 "A empresa holandesa Honest Ada Hydrogen Investment EAS propôs um investimento de US$ 100 milhões no setor de hidrogênio verde do Paraguai. Esse projeto poderia transformar o Paraguai num líder da indústria de energia renovável da América Latina."
 HOL_dutch_peru_wind_energy:0 "ENGIE Energía Peru – Expansão do Parque Eólico Punta Lomitas"
 HOL_dutch_peru_wind_energy_desc:0 "A ENGIE Energía Peru, com apoio holandês, está construindo um dos maiores parques eólicos da América Latina. Investimentos adicionais dos Países Baixos acelerarão o projeto e fortalecerão o setor de energia renovável do Peru."
 HOL_usa_operation_market_vision:0 "Propor a Operação Market Vision"
 HOL_usa_operation_market_vision_desc:0 "Os Países Baixos propuseram a 'Operação Market Vision', uma iniciativa bilateral de defesa e indústria visando integrar nossa P&D militar, melhorar a resiliência da cadeia de suprimentos e codesenvolver capacidades estratégicas. Essa cooperação poderia fortalecer os laços de defesa transatlânticos, fomentar o investimento mútuo e alinhar as indústrias militares de ambas as nações para os desafios do futuro."
 HOL_sur_agreement:0 "Propor acordo de comércio e desenvolvimento ao Suriname"
 HOL_sur_agreement_desc:0 "Como parte de nossa estratégia renovada na América do Sul, faremos uma oferta formal ao Suriname de um acordo abrangente de comércio e desenvolvimento. A proposta inclui investimento mútuo em infraestrutura, acesso comercial e ajuda ao desenvolvimento, lançando as bases para uma integração econômica mais profunda e cooperação regional."
 HOL_sur_infrastructure_agreement:0 "Oferecer investimento em infraestrutura ao Suriname"
 HOL_sur_infrastructure_agreement_desc:0 "Como parte de nossa estratégia renovada para fortalecer os laços com o Suriname, ofereceremos um pacote abrangente de investimento em infraestrutura. Ele inclui melhorias lideradas pelos holandeses em redes de transporte, instalações portuárias e logística regional. Se aceito, o acordo aprofundará a cooperação econômica e ampliará nossa influência no norte da América do Sul."
 HOL_sur_maritime_agreement:0 "Propor acordo de cooperação marítima"
 HOL_sur_maritime_agreement_desc:0 "O governo está se preparando para propor ao Suriname um acordo formal de cooperação marítima. O pacote inclui desenvolvimento portuário conjunto, apoio à infraestrutura naval e iniciativas de treinamento estratégico. Se aceito, fortalecerá as relações bilaterais e ampliará nossa influência ao longo da costa norte da América do Sul."
 HOL_sur_training_agreement:0 "Propor treinamento militar conjunto"
 HOL_sur_training_agreement_desc:0 "O Ministério da Defesa está se preparando para enviar ao Suriname um pedido formal para estabelecer operações de treinamento militar conjunto. A proposta inclui cooperação logística, exercícios de coordenação de unidades e compartilhamento de conhecimento em estratégia de defesa regional. A aceitação fortaleceria a prontidão mútua e os laços diplomáticos."
 HOL_sur_resources_agreement:0 "Propor acordo de investimento em recursos"
 HOL_sur_resources_agreement_desc:0 "O Ministério dos Assuntos Econômicos está se preparando para enviar ao Suriname uma proposta formal de investimento, voltada ao desenvolvimento de sua infraestrutura de extração de recursos. O acordo inclui investimento de capital, apoio tecnológico e arranjos comerciais de longo prazo. Se aceito, poderia fortalecer o acesso holandês a materiais estratégicos e aprofundar os laços econômicos bilaterais."
 HOL_fourth_reich_category:0 "Incorporando o Quarto Reich"
 HOL_marechaussee_support_company:0 "Batalhão de Apoio da Marechaussee"
 HOL_marechaussee_support_company_desc:0 "Este batalhão de apoio holandês combina gestão da cadeia de suprimentos no campo de batalha com policiamento militar.\n\n§GDica de projeto: A Marechaussee oferece Supressão, Reconhecimento, recuperação de baixas e modesta economia de Combustível num batalhão de apoio capaz de lançamento aéreo. Use-o para formações de segurança ou expedicionárias, mas ele aumenta a Largura de Combate e o equipamento, contribuindo pouco com Rompimento ou Ataque Pesado.§!"
 HOL_marechaussee_support_tech:0 "Batalhão de Apoio da Marechaussee"
 HOL_marechaussee_support_tech_desc:0 "O Batalhão de Apoio da Marechaussee combina capacidades de logística e polícia militar, melhorando a eficiência de suprimentos e aumentando a supressão."
 FAD_access_tech:0 "Tecnologia do Programa Future Air Defender"
 HOL_van_halteren_armor_manufacturer: "Van Halteren Technologies"
 HOL_van_halteren_armor_manufacturer_desc:0 "A Van Halteren Technologies, conhecida por sua experiência no desenvolvimento de componentes de veículos blindados e sistemas de defesa, oferece soluções de ponta para modernizar e ampliar as capacidades das forças armadas holandesas."
