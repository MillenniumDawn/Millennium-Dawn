 israel.coalition.0.t: "만족한 우리의 파트너"
 israel.coalition.0.d: "우리의 파트너는 당내 의견 차이에도 불구하고 우리가 시행해 온 정책에 만족했습니다. 이제 우리 정부는 이전보다 조금 더 안정적입니다."
 israel.coalition.0.a: "좋다"
 israel.coalition.1.t: "사임한 리베르만의 장관들!"
 israel.coalition.1.d: "리베르만 팀이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.1.a: "배신자들!"
 israel.coalition.2.t: "사임한 유대인의 힘 장관들!"
 israel.coalition.2.d: "유대인의 힘 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.2.a: "배신자들!"
 israel.coalition.3.t: "사임한 리쿠드 장관들!"
 israel.coalition.3.d: "리쿠드 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.3.a: "배신자들!"
 israel.coalition.4.t: "사임한 샤스 장관들!"
 israel.coalition.4.d: "샤스 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.4.a: "배신자들!"
 israel.coalition.5.t: "사임한 토라 유대주의 연합 장관들!"
 israel.coalition.5.d: "토라 유대주의 연합 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.5.a: "배신자들!"
 israel.coalition.6.t: "사임한 민족연합 장관들!"
 israel.coalition.6.d: "민족연합 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.6.a: "배신자들!"
 israel.coalition.7.t: "사임한 유대인의 집 장관들!"
 israel.coalition.7.d: "유대인의 집 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.7.a: "배신자들!"
 israel.coalition.8.t: "사임한 아보다 장관들!"
 israel.coalition.8.d: "아보다 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.8.a: "배신자들!"
 israel.coalition.9.t: "사임한 메레츠 장관들!"
 israel.coalition.9.d: "메레츠 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.9.a: "배신자들!"
 israel.coalition.10.t: "사임한 라암 장관들!"
 israel.coalition.10.d: "라암 당원들이 모든 정부 직위에서 사임하고 공식적으로 정부에서 탈퇴했습니다. 우리 정부의 안정성이 훼손되었으며 이 직위들을 맡을 후임자를 시급히 찾아야 합니다."
 israel.coalition.10.a: "배신자들!"
 israel.coalition.11.t: "선거 결과"
 israel.coalition.11.d: "선거가 끝났으며, 이제 의석과 위원회를 배분할 때입니다."
 israel.coalition.11.a: "그리고 첫 번째 법안은..."
 israel.coalition.12.t: "선거 결과"
 israel.coalition.12.d: "어느 정당도 크네세트에서 과반수를 확보하고 제 기능을 하는 정부를 구성하는 데 성공하지 못했습니다. 이제 다시 선거를 치러야 합니다."
 israel.coalition.12.a: "젠장!"
 israel.coalition.13.t: "정부 붕괴!"
 israel.coalition.13.d: "우리의 파트너들이 대거 연립에서 이탈하여 정치적 위기와 정부의 붕괴로 이어졌습니다. 다시 선거를 치러야 합니다."
 israel.coalition.13.a: "정치적 위기..."
 israel.knesset.0.t: "크네세트에 제출된 법안"
 israel.knesset.0.d: "우리는 크네세트에 법안을 제출했습니다. 현재 소관 위원회에서 검토 중이며, 곧 의원들에게 상정되어 표결에 부쳐질 것입니다."
 israel.knesset.0.a: "행운을 빌어 달라!"
 israel.knesset.1.t: "우리 법안을 비판한 언론!"
 israel.knesset.1.d: "여러 언론 매체에서 우리 법안을 신랄하게 비판하는 기사가 쏟아졌습니다. 일부 매체는 비인도적이라고 부르고, 다른 매체는 법안 작성자들을 \\"무식한 당나귀\\"라고 부릅니다. 그 결과 우리 당 소속 일부 의원들이 법안에 찬성표를 던지기를 거부했습니다."
 israel.knesset.1.a: "진짜 당나귀들은 저쪽이다!"
 israel.knesset.2.t: "우리 법안을 지지한 언론!"
 israel.knesset.2.d: "여러 언론 매체에서 우리 법안을 지지하는 기사가 나왔습니다. 많은 매체가 법안에 대해 긍정적으로 보도하며 모든 의원에게 찬성표를 던질 것을 촉구하고 있습니다. 야당 의원들이 법안 지지를 고려하고 있다는 소문도 들립니다."
 israel.knesset.2.a: "놀랍군!"
 israel.knesset.3.t: "연립 내 논의"
 israel.knesset.3.d: "우리의 연립 파트너들이 법안에 대한 수정안 묶음을 제시했습니다. 여기에는 그들이 자신들의 지지층과 국가에 이로울 것이라고 믿는 다수의 변경 사항이 담겨 있습니다. 우리가 이를 반영하지 않으면 파트너들이 법안에 찬성표를 던지지 않을 수 있으며 연립이 불안정해질 수 있습니다."
 israel.knesset.3.a: "반영하자!"
 israel.knesset.3.b: "우리 법안이니 우리 규칙대로 한다!"
 israel.knesset.4.t: "소관 위원회의 검토"
 israel.knesset.4.d: "소관 위원회가 우리 법안을 검토했습니다. 위원회 위원들은 과반수로 이를 통과시켰으나, 야당 위원들이 법률에 추가 수정을 가하고 자신들이 제시한 모든 의견을 반영해 줄 것을 요청했습니다. 이는 법안을 야당 진영에 더 매력적으로 만들 수 있지만, 우리의 지지층과 정당이 법안에 불만을 가질 수 있습니다."
 israel.knesset.4.a: "수정하자."
 israel.knesset.4.b: "우리 법안은 이미 완벽하다."
 israel.knesset.5.t: "발의안 통과!"
 israel.knesset.5.d: "최종 표결에서 우리 법안이 과반수 의원의 찬성으로 통과되었으며, 대통령이 서명하면 우리의 법률이 공식적으로 시행됩니다."
 israel.knesset.5.a: "해냈다!"
 israel.knesset.6.t: "발의안 부결!"
 israel.knesset.6.d: "최종 표결에서 우리 법안은 과반수 의원의 찬성을 얻지 못했습니다. 다음번에 다시 시도할 수 있습니다."
 israel.knesset.6.a: "오 이런..."
 israel.knesset.7.t: "수상한 거래"
 israel.knesset.7.d: "최종 표결에서 표가 조금 더 있다면 나쁘지 않을 것입니다. 소규모 의원 집단에 약간의 재정적 지원을 제공하고 그들의 지지를 얻을 수 있습니다."
 israel.knesset.7.a: "원하는 것을 주어라."
 israel.knesset.7.b: "그들의 표는 필요 없다."
 israel.knesset.8.t: "부패 스캔들!"
 israel.knesset.8.d: "언론이 우리 당 의원단 대표가 다른 의원단 소속 의원들에게 돈이 든 가방을 건네는 장면이 담긴 영상을 입수했습니다. 해당 거래에 대한 정보는 언론에 밝혀지지 않았지만, 우리 당과 파트너 정당의 인기도에 큰 타격을 줄 것입니다."
 israel.knesset.8.a: "배신자들!"
 israel_economy.173.t: "시나이 비무장지대 해제를 수정하는 이스라엘!"
 israel_economy.173.d: "이스라엘 정부는 최근의 모든 긍정적인 외교 행보를 고려하여 시나이의 비무장지대 지위 해제를 수정하기로 결정했습니다. 이제 전시가 아니더라도 우리 군대가 그 지역에 진입할 수 있습니다."
 israel_economy.173.a: "훌륭해!"
 ISR_egy_surveillance_drones: "이스라엘 드론 지원"
 israel_economy.174.t: "드론 감시를 제공하는 이스라엘!"
 israel_economy.174.d: "이스라엘 정부는 우리가 시나이의 살라프주의 반군에 더 효과적으로 맞서 싸울 수 있도록 국경 인근에서 자국 드론을 이용한 감시를 제공하기로 결정했습니다!"
 israel_economy.174.a: "감사합니다!"
 israel_economy.174.b: "당신들의 도움은 필요 없다!"
 israel_economy.175.t: "이집트의 수락!"
 israel_economy.175.d: "그들이 우리의 제안을 수락했습니다. 우리는 그들에게 우리 드론을 이용한 감시를 제공할 것입니다."
 israel_economy.175.a: "훌륭해!"
 israel_economy.176.t: "이집트의 거절!"
 israel_economy.176.d: "그들은 우리의 지원을 받아들이기를 거부했습니다. 스스로 해결할 수 있다고 말합니다."
 israel_economy.176.a: "뭐라고?"
 jordanian_waqf_authprity: "요르단 와크프"
 saudi_waqf_authprity: "사우디 와크프"
 ISR_jordan_waqf_slek: "요르단 와크프"
 ISR_jordan_waqf_slek_desc: "6일 전쟁 이후(이는 1994년 아라바 평화 조약으로 공고화되었습니다) 요르단 종교 당국(와크프)이 알아크사 모스크와 성전산 단지의 관리 및 운영에 대한 종주권을 유지하고 있습니다."
 ISR_saud_waqf_slek: "사우디 와크프"
 ISR_saud_waqf_slek_desc: "여러 논의 끝에 이스라엘 정부는 알아크사에 대한 관할권을 사우디아라비아에 이전했습니다."
 israel_economy.177.t: "우리 와크프를 추방하는 이스라엘!"
 israel_economy.177.d: "최근 이스라엘 정부는 알아크사 모스크와 성전산 단지에서 우리 와크프 당국을 추방하기로 결정했습니다. 놀랍지 않게도 그들은 이를 다른 무슬림 국가의 보호 아래 두지도 않고 스스로 관리하기로 했습니다."
 israel_economy.177.a: "제정신인가?"
 israel_economy.178.t: "사우디아라비아를 알아크사 관리 당국으로 임명한 이스라엘!"
 israel_economy.178.d: "최근 이스라엘 정부는 알아크사 모스크와 성전산 단지에서 요르단 와크프 당국을 추방하기로 결정했습니다. 이제 사우디아라비아가 이를 관리하며 그들의 성직자들이 해당 장소를 통제하게 됩니다."
 israel_economy.178.a: "변화가 다가온다."
 ISR_jor_isr_treaty: "아라바 조약 확대"
 israel_economy.179.t: "아라바 조약 확대를 제안하는 이스라엘"
 israel_economy.179.d: "최근 이스라엘 정부 관리들이 우리에게 접근하여, 과거 우리가 이미 수락한 아라바 조약의 확대를 제안했습니다. 이번 조약 확대로 양국 정부가 공동 경제 프로젝트를 수행할 수 있게 됩니다. 동의하시겠습니까?"
 israel_economy.179.a: "물론입니다!"
 israel_economy.156.b: "[Root.GetName]은(는) 그곳에서 얻을 것이 없다."
 israel_economy.180.t: "요르단의 수락!"
 israel_economy.180.d: "그들이 우리의 조약 확대에 동의했습니다!"
 israel_economy.180.a: "훌륭해!"
 israel_economy.181.t: "요르단의 거절!"
 israel_economy.181.d: "그들이 우리의 조약 확대를 거절했습니다."
 israel_economy.181.a: "매우 유감이다."
 israel_economy.182.t: "사해 보존 프로젝트를 제안하는 이스라엘!"
 israel_economy.182.d: "이스라엘이 사해를 구하기 위한 새로운 공동 프로젝트를 제안합니다. 많은 자금이 필요하지는 않지만 양측 모두에 이익이 될 것입니다."
 israel_economy.182.a: "동의한다!"
 israel_economy.182.b: "아니."
 israel_economy.183.t: "요르단의 수락!"
 israel_economy.183.d: "요르단이 사해 보존을 위한 공동 프로젝트에 투자하기로 동의했습니다!"
 israel_economy.183.a: "훌륭해!"
 israel_economy.184.t: "요르단의 거절!"
 israel_economy.184.d: "요르단이 사해 보존을 위한 공동 프로젝트에 대한 투자를 거절했습니다!"
 israel_economy.184.a: "허참."
 ISR_jor_water_share: "사해 수자원 협정"
 israel_economy.185.t: "사해 수자원 협정을 제안하는 이스라엘!"
 israel_economy.185.d: "최근 이스라엘이 우리의 농업 및 기타 수요를 사해의 물로 전부 충족시켜 주는 새로운 협정을 제안했습니다. 동의하시겠습니까?"
 israel_economy.185.a: "물론입니다!"
 israel_economy.185.b: "아니."
 israel_economy.186.t: "요르단의 수락!"
 israel_economy.186.d: "요르단이 우리의 제안을 수락했으며 우리는 그들에게 사해의 물을 공급하기 시작할 것입니다."
 israel_economy.186.a: "훌륭해!"
 israel_economy.187.t: "요르단의 거절!"
 israel_economy.187.d: "그들은 우리나라로부터 물을 구매하기를 원하지 않습니다."
 israel_economy.187.a: "매우 유감이다."
 ISR_solar_farms: "태양광 발전 단지"
 israel_economy.188.t: "그린-블루 딜을 제안하는 이스라엘!"
 israel_economy.188.d: "중동을 위한 그린 블루 딜은 기후 안보와 지역 평화를 증진하기 위한 대담한 구상입니다. 이스라엘은 이미 자국에 그렇게 했듯이 우리나라에 태양광 패널을 설치할 것을 제안합니다. 동의하시겠습니까?"
 israel_economy.188.a: "물론입니다!"
 israel_economy.188.b: "죄송하지만 거절합니다."
 israel_economy.189.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.189.d: "우리는 그들을 위해 태양광 발전 단지 3곳을 건설할 것입니다."
 israel_economy.189.a: "훌륭해!"
 israel_economy.190.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.190.d: "그들은 프로젝트에 참여하기를 원하지 않습니다."
 israel_economy.190.a: "매우 유감이다."
 ISR_jor_attack_idea: "요르단 범람 계획"
 israel_economy.191.t: "하심 가문 후계자 암살!"
 israel_economy.191.d: "최근 정체불명의 범인들이 하심 왕가의 후계자 중 한 명을 암살했습니다. 폭탄은 그가 궁전을 막 떠나려던 순간 그의 차량 밑에 설치되어 있었습니다. 요르단의 많은 관리들은 알카에다가 이번 공격의 배후일 수 있다고 지적합니다."
 israel_economy.191.a: "흥미롭군."
 ISR_jor_unloyal_mil_idea: "군의 불충 소문"
 israel_economy.192.t: "군부 내 음모!"
 israel_economy.192.d: "요르단 정부에 대한 군부 쿠데타 음모 가능성에 관한 소문이 최근 퍼졌습니다. 외세가 다양한 자금원을 통해 다수의 요르단 장성들을 매수하여 자신들에게 적절한 시점에 봉기하도록 하고 있다고 합니다. 요르단은 너무 늦기 전에 외세의 영향력에 대처해야 합니다."
 israel_economy.192.a: "분위기가 달아오르고 있군."
 ISR_economic_startup: "경제 보조금"
 ISR_begin_projects: "남부 기반시설 우선"
 ISR_begin_projects2: "북부 경제 우선"
 israel_economy.193.t: "니차나 노선을 제안하는 이스라엘!"
 israel_economy.193.d: "이스라엘이 양국을 연결하는 철도의 건설을 제안합니다. 비용은 양측이 균등하게 분담합니다. 동의하시겠습니까?"
 israel_economy.193.a: "물론입니다!"
 israel_economy.193.b: "아니!"
 israel_economy.194.t: "이집트의 동의!"
 israel_economy.194.d: "이집트가 우리의 제안에 동의했습니다. 건설이 곧 시작될 것입니다."
 israel_economy.194.a: "훌륭해!"
 israel_economy.195.t: "이집트의 거절!"
 israel_economy.195.d: "그들은 우리의 제안에 동의하지 않았습니다."
 israel_economy.195.a: "허참!"
 israel_economy.196.t: "철도 프로젝트를 제안하는 이스라엘!"
 israel_economy.196.d: "이스라엘이 양국을 연결하는 철도의 건설을 제안합니다. 비용은 양측이 균등하게 분담합니다. 동의하시겠습니까?"
 israel_economy.196.a: "물론입니다!"
 israel_economy.196.b: "아니!"
 israel_economy.197.t: "요르단의 동의!"
 israel_economy.197.d: "요르단이 우리의 제안에 동의했습니다. 건설이 곧 시작될 것입니다."
 israel_economy.197.a: "훌륭해!"
 israel_economy.198.t: "요르단의 거절!"
 israel_economy.198.d: "그들은 우리의 제안에 동의하지 않았습니다."
 israel_economy.198.a: "허참!"
 israel_economy.199.t: "철도 프로젝트를 제안하는 이스라엘!"
 israel_economy.199.d: "이스라엘이 양국을 연결하는 철도의 건설을 제안합니다. 비용은 양측이 균등하게 분담합니다. 동의하시겠습니까?"
 israel_economy.199.a: "물론입니다!"
 israel_economy.199.b: "아니!"
 israel_economy.200.t: "사우디아라비아의 동의!"
 israel_economy.200.d: "사우디아라비아가 우리의 제안에 동의했습니다. 건설이 곧 시작될 것입니다."
 israel_economy.200.a: "훌륭해!"
 israel_economy.201.t: "사우디아라비아의 거절!"
 israel_economy.201.d: "그들은 우리의 제안에 동의하지 않았습니다."
 israel_economy.201.a: "허참!"
 ISR_quad_idea: "I2U2 파트너십"
 israel_economy.202.t: "I2U2 동맹을 제안하는 이스라엘!"
 israel_economy.202.d: "이 그룹은 기반시설 현대화, 저탄소 발전 경로 추진, 공중 보건 개선 등 다양한 목표를 달성하기 위해 민간 부문의 자본과 전문성을 동원하는 것을 목표로 합니다. I2U2 파트너십의 프로젝트와 구상은 지리적 범위에 제한이 없으며, 이 그룹은 긍정적인 영향을 미칠 수 있는 어디에서든 기회를 모색할 것입니다. I2U2 그룹은 각 파트너 국가의 고위 정부 대표들이 이끌며, 여기에는 긴밀히 협력하고 정부 수반에게 보고하는 다음 네 명의 고위 관리가 포함됩니다."
 israel_economy.202.a: "어디에 서명합니까?"
 israel_economy.202.b: "아니."
 israel_economy.203.t: "[FROM.GetNameWithFlag]의 동의!"
 israel_economy.203.d: "[FROM.GetNameWithFlag]이(가) 우리의 제안에 동의했으며 곧 우리 협정에 가입할 것입니다!"
 israel_economy.203.a: "훌륭해!"
 israel_economy.204.t: "[FROM.GetNameWithFlag]의 거절!"
 israel_economy.204.d: "그들은 I2U2 프로젝트에 가입하지 않을 것입니다."
 israel_economy.204.a: "매우 유감이다."
 israel.2.t: "군사 협력을 제안하는 이스라엘"
 israel.2.d: "이스라엘 대표단이 이스라엘군을 위한 무기를 개발하기 위해 자국 군수 기업과 우리 칼라시니코프 콘체른 간의 군사 협력을 제안합니다. 특히 우리의 미국 자회사 칼라시니코프 USA를 통한 AK 알파 돌격소총의 공동 개발을 제안합니다. 수락하시겠습니까?"
 israel.2.a: "동의한다."
 israel.2.b: "아니."
 israel.3.t: "러시아의 동의"
 israel.3.d: "우리는 곧 칼라시니코프 콘체른과 공동 무기 개발을 시작할 것입니다. "
 israel.3.a: "훌륭해!"
 israel.4.t: "동의하지 않은 러시아"
 israel.4.d: "그들이 우리의 제안을 거절했으니, 계획을 바꿔야 합니다..."
 israel.4.a: "젠장."
 ISR_india_europe_corridor: "유럽으로 가는 회랑"
 ISR_india_europe_corridor_desc: "이스라엘은 아시아에서 유럽으로 가는 회랑이 되어 양 지역의 무역을 연결해야 합니다."
 ISR_yotzma_idea: "요츠마 구상"
 ISR_increased_taxation: "증세"
 ISR_cutzpah_thing: "후츠파"
 ISR_silicon_wadi_idea: "실리콘 와디"
 ISR_silicon_wadi2_idea: "실리콘 와디"
 security_belt: "안보 지대"
 security_belt_desc: "우리 군은 오랫동안 레바논 남부에 주둔해 왔습니다. 레바논 세력의 저항과 우리의 개입에 대한 대중의 불만으로 인해 행동의 여지가 거의 없습니다.\n§W--------------§!\n§Y$ISR_withdraw_from_the_security_belt$§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다. 대신 §Y$ISR_not_withdraw_from_the_security_belt$§! 중점을 완료하면 영구 점령 정신으로 §R악화§!됩니다."
 security_belt2: "안보 지대"
 security_belt2_desc: "우리 군은 오랫동안 레바논 남부에 주둔해 왔습니다. 우리 정부는 레바논 남부에 병력을 계속 주둔시키기로 결정했습니다."
 law_of_return: "§G귀환법§! - §Y통합됨§!"
 law_of_return_desc: "우리 국가는 그 이념의 뿌리에서 모든 유대인의 민족 국가입니다. 이를 바탕으로 전 세계의 유대인들이 끊임없이 고향으로 송환됩니다. 그러나 의견의 양극화와 새 이주민들의 상이한 배경으로 인해 단일 이념의 정치 체제를 만드는 것은 불가능합니다.\n§W--------------§!\n§Y$ISR_return_refugees$§! 중점을 완료하면 이 국가 정신은 §R제거§!되고 보편적 귀환권으로 대체됩니다."
 right_of_return: "§G귀환법§! - §O팔레스타인인과 유대인§!"
 right_of_return_desc: "우리 국가는 그 이념의 뿌리에서 모든 유대인의 민족 국가입니다. 이를 바탕으로 전 세계의 유대인들이 끊임없이 고향으로 송환됩니다. 그러나 의견의 양극화와 새 이주민들의 상이한 배경으로 인해 단일 이념의 정치 체제를 만드는 것은 불가능합니다. 이제 우리는 모든 팔레스타인 난민의 귀향을 허용했습니다."
