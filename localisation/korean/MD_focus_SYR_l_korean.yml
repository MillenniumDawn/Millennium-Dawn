 syria_encouraging_economic_self_reliance: "경제적 자립 투자"
 syria_encouraging_state_decision_making: "국가 의사 결정 장려"
 syria_endemic_corruption: "만연한 부패"
 syria_endemic_corruption_desc: "시리아의 역사는 정치적 불안정, 쿠데타, 전체주의로 가득합니다. 이는 수십 년간의 아사드 통치로 악화된 부패, 족벌주의, 비효율이 만연한 제도를 낳았습니다. 우리나라의 토대를 혁신하고 나라를 위한 더 나은 지속 가능한 미래의 길을 닦기 위해 막대한 노력을 기울일 것입니다."
 syria_power_vacuum: "권력 공백"
 syria_power_vacuum_desc: "다마스쿠스의 봄은 알아사드 일가를 지위와 역할에서 몰아내어 제도 개혁을 향한 첫걸음을 이루었습니다. 이는 약간의 부패 척결로 이어졌지만 아직 채워지지 않은 권력 공백을 낳았으며, 나라가 진정한 변화를 경험하려면 오랜 시간이 걸릴 것입니다."
 syria_return_of_npf_parliamentarians: "민족진보전선 의원"
 syria_return_of_npf_parliamentarians_desc: "제도적 비효율을 치유하려는 시도로 정부는 국가를 위해 봉사했던 의원들을 복귀시켰습니다. 이제 아사드의 전체주의적 속박에서 벗어나 이들은 변화를 이행하고 직무를 수행하는 데 더 큰 자유를 느낍니다. 그러나 진정한 변화는 아직 이루어지지 않았고 오랜 시간이 지나도 비효율의 문제는 여전히 존재하지만, 국가는 당분간 안정적이며 유지될 수 있다는 점에 유의해야 합니다."
 syria_entrenched_theocracy: "고착된 신정"
 syria_entrenched_theocracy_desc: "시리아는 늘 겪어 온 제도적 문제에 신정주의적 해결책을 도입했습니다. 한편으로 이는 종교적 도덕 가치가 부패 대응에 약간의 개선을 가져왔지만 핵심 문제는 해결되지 않았습니다. 모든 시리아인이 정부가 자신들을 대표한다고 느끼지는 않기 때문에 족벌주의와 종파주의는 여전히 남아 있으며, 더 많은 문제가 불가피하게 추한 모습을 드러내길 기다리고 있습니다. 하지만 지금 당장은 국민이 조용하고 모든 것이 안정적으로 보입니다."
 Syria_centralization_balance_of_power_category: "국가 건설과 중앙집권화"
 SYR_federal_state_formation_bop_left_side: "시리아 연방 수립"
 SYR_new_republic_formation_bop_right_side: "시리아 공화국의 부상"
 SYR_centralization_bop_mid_range: "현상 유지"
 SYR_direct_democracy_initiatives_bop_left_side: "직접민주주의 구상"
 SYR_rising_bureaucracy_bop_right_side: "관료의 부상"
 SYR_federalist_bop_left_side: "연방화"
 SYR_republican_bop_right_side: "단일 공화주의"
 SYR_al_abbas_brigades: "알아바스 여단 동원"
 SYR_al_abbas_brigades_desc: "국가의 적들에 맞서 싸우기 위해 알아바스 여단을 동원할 때가 왔습니다."
 syria_decision_increase_local_accountability_officials: "관료의 지방 책임성 강화"
 syria_decision_increase_local_accountability_officials_desc: "우리나라의 행정 문화는 부패, 정실주의, 비효율로 가득합니다. 투명하고 책임 있는 기관을 장려하기 위해 부패를 밝혀내고 뿌리 뽑는 조사 운동을 시작할 것입니다. 운동의 성패는 우리의 부패 수준, 경찰 예산, 소수 집단 포용성, 그리고 포퓰리스트들의 기술과 경험이 도움이 될 수 있으므로 이들이 정부에 참여하고 있는지 여부에 달려 있습니다."
 syria_decision_find_promising_bureaucracy: "유망한 관료 발굴 및 장려"
 syria_decision_find_promising_bureaucracy_desc: "수년간의 전체주의 통치로 인해 비효율적이고 인기 없는 인물들이 기관과 정부 요직을 맡게 되었습니다. 또한 민주주의로의 갑작스러운 전환은 국민이 신뢰할 수 있고 투명한 방식으로 책임을 감당할 수 있는 효율적인 관료 조직이 부족함을 드러냈습니다. 유능한 인재들이 마땅히 맡아야 할 직위에 오르도록 유인하고 영입하며 간소화된 행정 업무가 이루어지도록 노력을 시작할 것입니다. 성과는 관료 예산, 종파적 정실주의를 막기 위한 소수 집단 포용성, 부패 수준, 그리고 정부 업무를 다뤄 본 경험이 있는 포퓰리스트들이 정부에 참여하고 있는지 여부에 달려 있습니다."
 syria_decision_build_bureaucratic_infrastructure1: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure1_desc: "우리나라의 기반시설은 지역에서 가장 열악하고 낙후된 수준입니다. 이로 인해 국가 기관에 대한 인식이 나빠지고, 재화와 서비스를 제공할 수 있는 유능한 존재로서의 신뢰도 부족해졌습니다. 정부의 영향력을 확대하고 국가와 사회의 올바른 중앙집권화를 이루려면 기반시설을 강화해야 합니다."
 syria_decision_build_bureaucratic_infrastructure2: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure2_desc: "기반시설 확충을 위한 노력으로 중앙 권력에 대한 국민의 인식이 다소 개선되었습니다. 그러나 올바른 중앙집권화를 달성하고 행정 영향력을 더욱 넓히려면 기반시설을 한층 더 개선해야 합니다."
 syria_decision_build_bureaucratic_infrastructure3: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure3_desc: "우리 노력의 결실을 거두고 있습니다. 올바른 중앙집권화로 나아가는 길이 현실이 될 수 있으며, 우리나라는 진정으로 완전히 통합될 수 있습니다."
 syria_decision_build_bureaucratic_infrastructure4: "관료 기반시설 확충"
 syria_decision_build_bureaucratic_infrastructure4_desc: "기반시설 개선의 마지막 단계에 도달하였습니다. 정부의 권위가 전국에서 실현되고 존중받으며, 법치가 모든 곳에 확산되어 있습니다."
 syria_decision_fund_voluntary_organizations: "자원봉사 단체 지원"
 syria_decision_fund_voluntary_organizations_desc: "민족 간 분열이 전국에 만연해 있으며, 이를 치유하는 가장 중요한 방법은 민족 간 장벽을 넘어 서로 다른 배경과 종파를 가진 사람들의 삶의 향상과 협력을 목표로 하는 자원봉사 단체를 장려하는 것입니다. 노력의 성패는 소수 집단 포용성과, 확신을 주고 정치 활동과 협력을 장려하는 데 큰 도움이 될 연방주의자들이 정부에 참여하고 있는지 여부에 달려 있습니다."
 syria_decision_encourage_economic_self_reliance: "경제적 자립 장려"
 syria_decision_encourage_economic_self_reliance_desc: "우리나라의 경제는 수십 년간 잘못된 운영과 비효율로 고통받아 왔습니다. 국민이 기업을 세우고 그 안에서 일하도록 유인하기 위해 자유 무역과 경제 자유화를 장려할 것입니다. 성공한다면 많은 주가 경제적으로 번영하고 국가 경제가 도약할 것입니다. 그러나 이를 위해서는 부패가 낮아야 하고, 종파를 넘나드는 발전을 위해 소수 집단 포용성이 보장되어야 하며, 정부를 경제에서 멀리 두기 위해 관료 예산이 최저 수준이어야 하고, 직접적이고 분권적인 경제 발전을 보장할 연방주의자들이 정부에 있어야 합니다."
 syria_decision_encourage_state_decision_making: "주 단위 의사결정 장려"
 syria_decision_encourage_state_decision_making_desc: "우리나라의 발전을 가로막는 가장 큰 장애물은 국민이 자신의 정치적 문제와 이해관계에 대해 생각할 동기를 충분히 느끼지 못한다는 점입니다. 이는 대체로 국가가 국민을 감시하기 위해서만 존재해 왔고, 삶을 향상시킬 기회나 수단이 아닌 공포와 불신의 원천이 되어 아무도 이 나라에 소속감을 느끼지 못하기 때문입니다. 이를 바꾸어, 정치적 경쟁과 담론을 장려하여 국민이 자신이 사는 지역과 주의 의사결정에 참여하고 싶어 하도록 할 때입니다. 노력의 성패는 부패, 소수 집단 포용성, 그리고 연방주의자들이 정부에 참여하고 있는지 여부에 달려 있습니다."
 sectarian_groups_start_to_seek_independence: "종파 집단들의 독립 추구 시작"
 FSA_rebel_fighting_spirit_idea: "반군의 투지"
 FSA_rebel_fighting_spirit_idea_desc: "자유시리아군은 투지를 불태우며 출발하였으며, 알아사드 정권에 맞서 싸울 준비가 되어 있습니다. 이들은 조국의 자유와 국민의 권리를 위해 싸울 각오가 되어 있습니다."
 SyriaFocus.108.d1: "우리는 강력한 애니메이션 산업을 구축하였습니다. 우리 스튜디오가 일본과 협력하고 디지털 분야를 적극 장려한 덕분에, 국내외의 많은 관객에게 주목할 만한 작품들이 전해졌습니다."
 SyriaFocus.108.d2: "우리는 강력한 애니메이션 산업을 구축하였습니다. 우리 스튜디오가 중국과 협력하고 디지털 분야를 적극 장려한 덕분에, 국내외의 많은 관객에게 주목할 만한 작품들이 전해졌습니다."
 SyriaFocus.108.d3: "디지털화에 대규모로 투자함으로써 우리는 국내외에서 인기를 얻은 주목할 만한 작품들을 만들어 내는 자체적인 훌륭한 애니메이션 산업을 이루었습니다. 우리는 세계에 우리 국민의 창의성과 우리만의 독특한 미감을 보여 주었습니다."
 SyriaFocus.108.b: "중국에 애니메이션이라는 게 있기는 한가?"
 SyriaFocus.108.c: "메이드 인 시리아"
