 ALG_maintaining_kabyle_relations: "Automatiser l’amélioration des relations kabyles"
 ALG_maintain_kabyle_relations: "Entretenir les relations kabyles"
 ALG_maintain_kabyle_relations_desc: "Une ouverture à faible effort vers les communautés kabyles pour empêcher l'érosion de la satisfaction. Coûte du pouvoir politique mais évite les lourdes pénalités d'échec des réformes plus vastes."
