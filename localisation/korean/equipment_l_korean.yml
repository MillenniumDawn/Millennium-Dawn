 util_vehicle_9: "다목적 차량 2045"
 util_vehicle_9_desc: "다목적 차량은 차량화 보병 부대가 전장으로 이동하는 수송 수단으로 사용하는 차량입니다. 초기 세대 모델인 지프와 트럭은 사실상 비장갑이며 민간용 차량과 달리 주로 더 튼튼하고 험지에서의 기동성이 더 높다는 점이 다릅니다. 후기 세대 모델에는 더 나은 장갑을 갖춘 험비형 차량과 승무원 방호가 한층 개선된 지뢰 방호 차량이 포함됩니다. 무장을 갖추는 경우에도 보통 기관총과 같은 경무장입니다."
 util_vehicle_10: "다목적 차량 2055"
 util_vehicle_10_desc: "다목적 차량은 차량화 보병 부대가 전장으로 이동하는 수송 수단으로 사용하는 차량입니다. 초기 세대 모델인 지프와 트럭은 사실상 비장갑이며 민간용 차량과 달리 주로 더 튼튼하고 험지에서의 기동성이 더 높다는 점이 다릅니다. 후기 세대 모델에는 더 나은 장갑을 갖춘 험비형 차량과 승무원 방호가 한층 개선된 지뢰 방호 차량이 포함됩니다. 무장을 갖추는 경우에도 보통 기관총과 같은 경무장입니다."
