 land_module_drone_launcher_1: "드론 발사기 I"
 land_module_drone_launcher_1_desc: "드론 발사기는 소모성 무인 무장에 자율 유도를 결합하여 기존 발사기보다 강한 타격 잠재력을 발휘합니다. 기체 구조가 단순하고 저렴해 대량 생산이 쉬우므로 전체 제작 비용이 줄어듭니다.\n\n§G설계 힌트: 드론 발사기는 제작 비용이 저렴하고 더 강력하게 타격하지만, 첨단 유도 장치와 탑재 전자 장비 때문에 더 많은 자원을 요구합니다.§!"
