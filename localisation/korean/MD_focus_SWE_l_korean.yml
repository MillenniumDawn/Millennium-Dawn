 Sweden_foci.1.t: "전투기 전력 강화"
 Sweden_foci.1.d: "자국에서 생산한 그리펜 전투기가 우리 공군의 중추를 이루고 있지만, 보완적인 항공기를 도입하면 작전 운용의 다양성을 크게 높일 수 있습니다. 해외 파트너로부터 추가 전투기를 조달하면 전략 역량을 강화하고 향후 외교 관계에 영향을 미칠 수 있습니다."
 Sweden_foci.1.o1: "미국산 전투기 도입을 검토한다"
 Sweden_foci.1.o2: "러시아산 전투기 도입을 검토한다"
 Sweden_foci.1.o3: "확대 없이 현재 전력을 유지한다"
 Sweden_foci.1001.t: "보완용 전투기 도입을 검토하는 스웨덴"
 Sweden_foci.1001.d1: "스웨덴 정부는 기존 그리펜 전력을 보완할 추가 전투기 구매를 검토하고 있습니다. 미국과 이러한 조달 절차를 진행하는 것은 우리의 향후 외교 및 군사 관계에 상당한 영향을 미칠 수 있으며, 전략적 동반자 관계와 상호운용성을 강화할 수 있습니다."
 Sweden_foci.1001.d2: "스웨덴 정부는 기존 그리펜 전력을 보완할 추가 전투기 구매를 검토하고 있습니다. 러시아와 이러한 조달 절차를 진행하는 것은 우리의 향후 외교 및 군사 관계에 상당한 영향을 미칠 수 있으며, 지정학적 노선과 방위 협력에 영향을 줄 수 있습니다."
 Sweden_foci.1001.o1: "요청을 거절한다"
 Sweden_foci.1001.o2: "도입을 진행한다"
 Sweden_foci.1002.t: "동맹의 지원으로 강화되는 공군"
 Sweden_foci.1002.d1: "[USA.GetLeader]께서 우리 공군 전력을 강화하기 위한 첨단 전투기 이전을 승인하셨습니다. [SWE.GetLeader]께서는 [USA.GetAdjective] 정부의 지원에 깊은 감사를 표하셨으며, 전투기 편입을 직접 감독하실 것입니다."
 Sweden_foci.1002.d2: "[SOV.GetLeader]께서 우리 공군 전력을 강화하기 위한 첨단 전투기 이전을 승인하셨습니다. [SWE.GetLeader]께서는 [SOV.GetAdjective] 정부의 지원에 깊은 감사를 표하셨으며, 전투기 편입을 직접 감독하실 것입니다."
 Sweden_foci.1002.o1: "훌륭한 소식이다!"
 Sweden_foci.1003.t: "전투기 지원을 거부한 동맹"
 Sweden_foci.1003.d1: "[USA.GetLeader]께서 우리 공군을 지원할 추가 전투기 요청을 거절하셨습니다. [SWE.GetLeader]께서는 [USA.GetAdjective] 정부의 결정에 크게 실망하셨습니다."
 Sweden_foci.1003.d2: "[SOV.GetLeader]께서 우리 공군을 지원할 추가 전투기 요청을 거절하셨습니다. [SWE.GetLeader]께서는 [SOV.GetAdjective] 정부의 결정에 크게 실망하셨습니다."
 Sweden_foci.1003.o1: "우리의 외교 관계를 재고한다"
 Sweden_foci.2.t: "스웨덴 기갑 전력 현대화"
 Sweden_foci.2.d: "전차 전력을 강화하고 현대화하기 위해 스웨덴은 첨단 주력 전차의 도입과 함께 국내 생산을 용이하게 할 생산 면허의 취득을 검토하고 있습니다. 이 전략적 결정은 우리의 방위 역량을 강화하고 세계 표준과의 기술적 동등성을 확보하는 것을 목표로 합니다."
 Sweden_foci.2.o1: "미국에서 M1 에이브럼스 전차를 조달한다"
 Sweden_foci.2.o2: "러시아에서 T-90 전차를 조달한다"
 Sweden_foci.2.o3: "레오파르트 2A6 면허를 취득하고 Strv 122를 Strv 122B로 개량한다"
 Sweden_foci.2.o4: "확대 없이 현재 전차 전력을 유지한다"
 Sweden_foci.2001.t: "전차 도입을 요청하는 스웨덴"
 Sweden_foci.2001.d1: "스웨덴 정부가 기갑 전력을 강화하고 더욱 긴밀한 방위 관계를 구축할 목적으로 미국에 M1 에이브럼스 전차 조달을 공식 요청했습니다."
 Sweden_foci.2001.d2: "스웨덴 정부가 기갑 전력을 강화하고 더욱 긴밀한 방위 관계를 구축할 목적으로 러시아에 T-90 전차 조달을 공식 요청했습니다."
 Sweden_foci.2001.d3: "스웨덴 정부가 국내 생산을 강화하고 기갑 전력을 현대화할 목적으로, 레오파르트 2A6의 생산 면허 취득과 기존 Strv 122 전차의 Strv 122B 규격 개량을 우리에게 요청해 왔습니다."
 Sweden_foci.2001.o1: "나는 반대다"
 Sweden_foci.2001.o2: "좋다, 우리 관계를 개선하자"
 Sweden_foci.2002.t: "승인된 우리의 전차 도입 요청"
 Sweden_foci.2002.d1: "미국이 M1 에이브럼스 전차를 조달하겠다는 스웨덴의 요청을 승인했으며, 이는 양국 간 방위 협력의 중요한 진전입니다."
 Sweden_foci.2002.d2: "러시아가 T-90 전차를 구매하겠다는 스웨덴의 제안을 수락했으며, 이는 군사 협력의 새로운 길을 열어 줍니다."
 Sweden_foci.2002.d3: "독일이 스웨덴에 레오파르트 2A6 전차의 국내 생산 면허와 Strv 122의 Strv 122B 규격 개량을 허가했으며, 이는 유럽 방위 관계를 강화합니다."
 Sweden_foci.2002.o1: "도입 및 현대화 계획을 진행한다"
 Sweden_foci.2003.t: "거부된 우리의 전차 도입 요청"
 Sweden_foci.2003.d1: "미국이 전략적 고려와 기존 약속을 이유로 M1 에이브럼스 전차를 조달하겠다는 스웨덴의 요청을 거절했습니다."
 Sweden_foci.2003.d2: "러시아가 지정학적 파장과 전략적 우선순위를 이유로 T-90 전차를 구매하겠다는 스웨덴의 제안을 거절했습니다."
 Sweden_foci.2003.d3: "독일이 자국의 방위 수요와 수출 정책을 우선시하여, 레오파르트 2A6의 생산 면허를 취득하고 Strv 122를 개량하겠다는 스웨덴의 요청을 거부했습니다."
 Sweden_foci.2003.o1: "이케아에 포함되는 나사 개수를 줄이라고 전하라"
 Sweden_foci.3.t: "스웨덴 공격 헬리콥터 전력 현대화"
 Sweden_foci.3.d: "공중 전투 능력을 강화하기 위해 스웨덴은 첨단 공격 헬리콥터의 도입과 함께 국내 생산을 용이하게 할 생산 면허의 취득을 검토하고 있습니다. 이 전략적 구상은 우리의 방위 태세를 강화하고 동맹군과의 상호운용성을 확보하는 것을 목표로 합니다."
 Sweden_foci.3.o1: "미국에서 AH-64 아파치 헬리콥터를 조달한다"
 Sweden_foci.3.o2: "러시아에서 Ka-52 앨리게이터 헬리콥터를 조달한다"
 Sweden_foci.3.o3: "유로콥터 팬서 면허를 취득하고 국내 생산에 착수한다"
