 RAJ_nardi_export_weapon_flag: "§YМы получили разрешение на экспорт оружия в Армению!§!"
 RAJ_ethiopia_export_weapon_flag: "§YМы получили разрешение на экспорт оружия в Эфиопию!§!"
 RAJ_nepal_export_weapon_flag: "§YМы получили разрешение на экспорт оружия в Непал!§!"
 RAJ_baguette_export_weapon_flag: "§YМы получили разрешение на экспорт оружия во Францию!§!"
