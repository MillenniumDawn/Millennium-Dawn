 nsb_SP_arty_1: "ART AUT 1985"
 nsb_SP_arty_1_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
