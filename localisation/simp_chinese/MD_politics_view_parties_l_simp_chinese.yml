 BLR.liberalism: "£BLR_liberalism (Za Svabodu) - 争取自由运动"
 BLR.liberalism_icon: "£BLR_liberalism"
 BLR.liberalism_desc: "（亲欧自由主义）- 争取自由运动\n\n争取自由运动是亚历山大·米林克维奇在2006年总统竞选期间建立的中间派联盟。它并非政党，而是一个公民运动，致力于通过和平施压、地方自治和与布鲁塞尔对话，寻求建立一个欧洲化的白俄罗斯。该运动认为，民主化与西方化是相辅相成的。尤里·胡巴列维奇于2016年接任领导职务。\n\n该组织在多次被拒后于2008年获得国家注册，但于2021年被最高法院注销，此后便在海外继续活动。其影响力并非源于庞大的成员群体，而是源于与欧洲机构的联系以及区域性活动人士网络。"
 BLR.conservatism: "£BLR_conservatism (UCP) - 联合公民党"
 BLR.conservatism_icon: "£BLR_conservatism"
 BLR.conservatism_desc: "（自由保守主义）- 联合公民党\n\n联合公民党是民主反对派中的自由保守派。该党主张私有化、小政府、法治和自由选举，并支持融入欧盟以及减少对俄罗斯的经济依赖。在阿纳托利·利亚贝兹卡的领导下，以及自2018年起由米卡莱·卡兹卢领导下，该党在当局允许的范围内推出候选人，并监督计票过程。\n\n它是欧洲人民党的观察员，也是国际民主联盟的成员。它的影响力主要来自经济学家、企业家和城市中产阶级。其领导人在2020年后被监禁，该党于2023年被解散，其组织机构目前在流亡中运作。"
 BLR.socialism: "£BLR_western_socialism  (BSDP-NH) - 白俄罗斯社会民主党（人民议会）"
 BLR.socialism_desc: "（社会民主主义）- 白俄罗斯社会民主党（人民议会）\n\n人民议会是反对派的主要社会民主党，也是米卡莱·斯塔特克维奇的政治根基。该党主张建立在混合经济基础上的福利国家，保障工会权利，实行自由选举，并支持一个扎根欧洲的白俄罗斯，同时反对与俄罗斯建立联盟国家。该党倾向于街头动员而非幕后谈判，并将每一次投票都视为揭露政权的机会。\n\n它隶属于社会党国际。它的影响力在于其街头抗议经验、与工会的联系以及斯塔特克维奇在反对派激进派中的个人影响力。"
 BLR.Conservative: "£BLR_Conservative (PV) - 垂直总统"
 BLR.Conservative_icon: "£BLR_Conservative"
 BLR.Conservative_desc: "（威权主义总统制）- 垂直总统\n\n总统权力垂直体系是由州长、区长、安全部门负责人和企业董事组成的任命层级，亚历山大·卢卡申科通过该体系在没有政党的情况下进行统治。它主张国有化、秩序和苏联式的福利模式，不容忍任何有组织的竞争，并以官职奖励忠诚。它与莫斯科进行艰难的谈判，一方面接受廉价能源和联盟国家补贴，另一方面又抵制全面一体化；每当俄罗斯施压时，它就拉拢中国和西方。\n\n它的影响力在于安全部门、国家媒体和对每张选票的行政控制，以及批准总统路线的全白俄罗斯人民大会。"
 BLR.Autocracy: "£BLR_Autocracy (BPP) - 白俄罗斯爱国党"
 BLR.Autocracy_icon: "£BLR_Autocracy"
 BLR.Autocracy_desc: "（左翼民族主义）- 白俄罗斯爱国党\n\n白俄罗斯爱国党是由米卡莱·乌拉霍维奇领导的忠诚派政党，成员包括退役军官和苏联爱国者。乌拉霍维奇是一位哥萨克酋长，曾于2015年作为卢卡申科的友好竞争对手竞选总统。该党主张建立一个社会公正的国家，捍卫国家荣誉，并推动白俄罗斯、俄罗斯和乌克兰三国重新统一。该党反对北约和亲西方的反对派。\n\n它曾是议会中维护退伍军人和安全事务的忠实代表。它的影响力源于退伍军人协会和哥萨克协会，以及总统府的善意。该机构于2023年被国家解散。"
 BLR.anarchist_communism: "£BLR_anarchist_communism (RPPS) - 劳工与公正共和党"
 BLR.anarchist_communism_icon: "£BLR_anarchist_communism"
 BLR.anarchist_communism_desc: "（效忠派工党）- 劳工与公正共和党\n\n劳工与公正共和党是一个忠于苏联的左翼政党，它将建立福利国家、部分恢复计划经济和工人委员会的诉求与社会保守主义和对苏联的怀旧情绪结合起来。该党支持总统，认可2014年克里米亚公投，并与独联体其他志同道合的政党合作，同时将西方视为敌对势力。亚历山大·希日尼亚克于2022年接任党魁。\n\n它与其他效忠派政党一起在2023年的重新注册中幸存下来。它的优势在于当局的容忍、与劳工团体的联系以及在议会中作为政权左翼代表的地位。"
 BLR.Neutral_conservatism: "£BLR_Neutral_conservatism (BChD) - 白俄罗斯基督教民主党"
 BLR.Neutral_conservatism_icon: "£BLR_Neutral_conservatism"
 BLR.Neutral_conservatism_desc: "（基督教民主主义）- 白俄罗斯基督教民主党\n\n白俄罗斯基督教民主党是一个反对党，它将天主教徒、东正教徒和新教徒团结在基督教价值观、白俄罗斯语和欧洲未来这一核心理念之下。该党主张家庭、保护生命、建立具有社会良知的市场经济，并主张结束威权统治。它寻求加入欧盟，但拒绝建立联盟国家。帕维尔·谢维亚里涅茨、维塔尔·雷马舍夫斯基和贾尼斯·萨杜斯基曾担任该党联合主席。\n\n该组织于2009年召开成立大会，此后一直被拒绝注册，其领导人谢维亚里涅茨在2020年抗议活动后被捕入狱。该组织的影响力主要来自教区、青年网络以及欧洲基督教民主党内部的合作伙伴。"
 BLR.oligarchism: "£BLR_oligarchism (LDPB) - 白俄罗斯自由民主党"
 BLR.oligarchism_icon: "£BLR_oligarchism"
 BLR.oligarchism_desc: "（亲俄民粹主义）-白俄罗斯自由民主党\n\n白俄罗斯自由民主党是日里诺夫斯基领导的俄罗斯政党的白俄罗斯姊妹党，由谢尔盖·海杜克维奇创立，并于2019年交由其子阿列赫领导。该党自诩为建设性反对派，批评官员但从不批评总统，每次选举都以忠诚的替代者形象参选。其主张建立强大的国家、俄白统一、奉行针对西方和北约的民族主义民粹主义，并为其企业家支持者打造有利于商业发展的经济环境。\n\n它经受住了2023年的重新注册考验，仍然是为数不多的合法企业之一。它的优势在于其被容忍的地位、与俄罗斯自由民主党达成的合作协议以及其成员企业家的支持。"
 BLR.neutral_Social: "£BLR_neutral_Social (BSDH) - 白俄罗斯社会民主大会"
 BLR.neutral_Social_icon: "£BLR_neutral_Social"
 BLR.neutral_Social_desc: "（社会民主主义）- 白俄罗斯社会民主大会\n\n白俄罗斯社会民主大会是斯坦尼斯拉夫·舒什克维奇的政党，他是独立白俄罗斯的首任领导人。该党自称是中右翼社会民主党，主张建立市场经济和社会保障体系，支持民族复兴，拥护白红白三色旗和共和国原宪法，并希望白俄罗斯留在欧盟，但不受欧盟国家体制的约束。谢尔盖·切拉琴于2018年接任该党主席，并于2020年竞选总统。\n\n它通过避免街头对抗，比大多数反对党维持了更长时间的注册状态。它的影响力源于其创始人的道德权威以及老一辈民族民主知识分子的支持。该党于2023年被国家解散。"
 BLR.Neutral_Communism: "£BLR_Neutral_Communism (PKB) - 白俄罗斯共产党人党"
 BLR.Neutral_Communism_icon: "£BLR_Neutral_Communism"
 BLR.Neutral_Communism_desc: "（民主社会主义）- 白俄罗斯共产党人党\n\n白俄罗斯共产党人党是反对卢卡申科的反对派共产党，其原有的忠实拥护者已并入白俄罗斯共产党。在谢尔盖·卡利亚金的领导下，该党主张社会所有制、工人权利和议会民主制，并反对总统垂直体制，认为其背离了苏联理想。该党与民主反对派合作，支持自由选举，同时拒绝加入北约和快速市场转型。\n\n它的影响力在于其地区组织、记得该党是真正共产党的退休人员和工人，以及它与欧洲左翼的联系。"
 BLR.Neutral_green: "£BLR_neutral_green (BPZ) - 白俄罗斯绿党"
 BLR.Neutral_green_desc: "（生态社会主义）- 白俄罗斯绿党\n\n绿党是白俄罗斯的生态政党，长期以来一直保持合法存在，并游离于效忠派阵营之外。他们主张环境保护、切尔诺贝利事件的遗留问题、反资本主义的社会纲领、LGBT权利以及废除死刑。德米特里·库丘克自2020年起担任该党主席。\n\n它是欧洲绿党的附属组织。它的影响力来自于支持它的环保人士和城市青年，以及它的欧洲伙伴。该组织于2023年被国家解散，库丘克于2024年被监禁。"
 BLR.Nat_Autocracy: "£BLR_Nat_Autocracy (AFRB) - 白俄罗斯共和国武装部队"
 BLR.Nat_Autocracy_icon: "£BLR_Nat_Autocracy"
 BLR.Nat_Autocracy_desc: "（军政府）- 白俄罗斯共和国武装部队\n\n白俄罗斯共和国武装力量并非政党，而是由陆军军官团、内卫部队和安全部门组成，其将领构成国家的最后一道防线。军政府将维护秩序，奉行苏联式的纪律，并通过联盟国家和集体安全条约组织与俄罗斯保持紧密的防御关系，同时与任何外国势力保持距离。\n\n它的影响力在于它对武力的垄断，对与俄罗斯共享的边境和防空网络的控制，以及总统垂直体制灌输给它的服从习惯。"
 BLR.Nat_Fascism: "£BLR_Nat_Fascism (NBP) - 白俄罗斯民族布尔什维克党"
 BLR.Nat_Fascism_icon: "£BLR_Nat_Fascism"
 BLR.Nat_Fascism_desc: "（民族布尔什维克）- 白俄罗斯民族布尔什维克党\n\n民族布尔什维克是爱德华·利莫诺夫运动在白俄罗斯的分支，是一个由叶夫根尼·孔图什领导的未注册组织委员会，它将帝国民族主义与革命社会主义相结合。该组织主张白俄罗斯和俄罗斯在没有普京或卢卡申科的情况下重新统一为一个帝国，主张反对寡头政治的社会正义，主张采取直接行动，并且像对待自由派反对派一样，对人民阵线的民族主义持蔑视态度。\n\n它通过街头行动、散发传单和挑衅等手段开展活动，其成员经常面临拘留。它的影响力在于一小群激进干部和更广泛的俄罗斯国家布尔什维克网络。"
 BLR.Nat_Populism: "£BLR_Nat_Populism (KChP-BNF) - 保守基督教党-白俄罗斯人民阵线"
 BLR.Nat_Populism_icon: "£BLR_Nat_Populism"
 BLR.Nat_Populism_desc: "（民族保守主义）- 保守基督教党-白俄罗斯人民阵线\n\n保守基督教党（白俄罗斯人民阵线）是人民阵线的激进派，在人民阵线分裂后追随齐亚农·帕兹尼亚克，帕兹尼亚克本人则流亡海外领导该党。该党主张毫不妥协的白俄罗斯民族主义、基督教价值观、白俄罗斯语，并主张与俄罗斯彻底决裂。它寻求加入北约，认为这是独立的唯一保障。该党抵制所有选举，认为其不合法，并拒绝与政权进行任何对话。\n\n其影响力源于一支纪律严明的独立运动老兵队伍、帕兹尼亚克作为民族复兴运动创始人的地位以及散居海外的侨民。该组织于2023年被国家解散。"
 BLR.Monarchist: "£BLR_monarchism 立陶宛大公国君主联盟"
 BLR.Monarchist_desc: "（传统君主主义）- 立陶宛大公国君主联盟\n\n君主联盟是由一群拥护君主制的知识分子组成的小团体，他们聚集在《立陶宛报》及其以亚历山大·斯特拉尔佐夫-卡尔瓦茨基为首的组织委员会周围。该联盟主张恢复立陶宛大公国，使其成为一个统一白俄罗斯和立陶宛的天主教世袭君主制国家，复兴贵族阶层和教会自由，并拒绝苏联的遗留制度和现代共和国体制。2016年，该联盟曾推举一位哈布斯堡家族成员作为王位候选人。\n\n它既没有选举权，也没有登记。它的影响力并非来自任何组织，而是来自大公国在国家知识分子中的浪漫情怀。"
