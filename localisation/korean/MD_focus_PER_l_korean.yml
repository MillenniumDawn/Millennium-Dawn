 birthplace_islamic_revolution: "이슬람 혁명의 발상지"
 birthplace_islamic_revolution_desc: "When the last Shah of Iran was overthrown in the 1979 revolution, a near 2,500 years of Persian monarchy rule came to an end. Out of the popular revolution emerged the Islamic republic and the Ayatollahs. The once ally of the West became overnight a direct adversary.\n\nIran stands as the beacon for Shia Islam around the globe, but also as a counterforce to Sunni incursion.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we change §HCountry Outlook§!."
