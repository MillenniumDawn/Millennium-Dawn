 DESIGNER_EMPTY_REGIMENT: "§RAby utworzyć nowy szablon brygady, musisz dodać batalion bojowy.§!"
 DESIGNER_EMPTY_NAME: "§RSzablon brygady nie powinien mieć pustej nazwy§!"
 DESIGNER_TEMPLATE_NAME_EXISTS: "§RIstnieje już inny szablon brygady o tej samej nazwie§!"
 DESIGNER_REGULAR_TEMPLATE_IN_USE: "§RTego szablonu nie można przekształcić w szablon dowództwa armii, ponieważ jest on obecnie używany przez rozmieszczone brygady niebędące jednostkami dowodzenia§!"
 DESIGNER_HQ_CP_INSUFFICIENT: "§RNiewystarczająca ilość punktów dowodzenia £command_power , aby zaktualizować rozmieszczone jednostki sztabowe.§!"
 DESIGNER_EQUIPMENT_CHANGE: "Z tego szablonu korzysta $UNITS|Y$ brygad.\nWymagania dotyczące $EQ|Y$ zmienią się łącznie o $TOT|R$.\nW magazynie posiadamy $STOCK|Y$.\nJeśli zaakceptujemy zmiany w tym szablonie, przewidujemy, że w magazynie pozostanie $END$."