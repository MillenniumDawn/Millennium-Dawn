 internet_1: "1G"
 internet_1_desc: "1G es la primera generación de telecomunicaciones móviles inalámbricas. Las señales de radio que se transmiten en las redes 1G son analógicas."
 internet_2: "2G"
 internet_2_desc: "Las redes celulares 2G o de segunda generación se lanzaron comercialmente en 1991. El 2G trajo consigo grandes mejoras en el cifrado, un uso más eficiente de la banda ancha y servicios de datos para móviles comenzando con la llegada de los mensajes de texto SMS."
 internet_3: "3G"
 internet_3_desc: "El 3G o la tercera generación de redes celulares estableció nuevos estándares para los dispositivos móviles y las telecomunicaciones móviles. La nueva generación de redes celulares admitía una mayor velocidad en kbit/s, además de encontrar más aplicaciones dentro de la telefonía de voz inalámbrica, el acceso a internet móvil y la televisión móvil."
 internet_4: "4G"
 internet_4_desc: "El 4G o la cuarta generación de redes celulares tomó la forma del acceso a internet móvil de la era moderna. Encuentra su aplicación actual en el acceso a la web móvil, telefonía IP, servicios de juego y muchos otros servicios de accesibilidad digital. El 4G ha eliminado casi por completo los sistemas analógicos de las generaciones anteriores."
 internet_5: "5G"
 internet_5_desc: "El 5G, el formato más contemporáneo de redes de banda ancha celular, está programado para comenzar su despliegue en 2019. Ofrece un mayor ancho de banda, dando paso a velocidades de descarga más altas que eventualmente alcanzarán los 10 Gbit/s. Se piensa que este aumento en el ancho de banda también abrirá la posibilidad de que los proveedores generales de servicios de internet lo utilicen para competir con el internet por cable."
 internet_6: "6G"
 internet_6_desc: "El 6G es el futuro estándar para redes de banda ancha que contemplaría un aumento del ancho de banda hasta los 20 Gbit/s. Haría que la banda ancha fuera aún más aplicable para transferencias masivas de datos."
 internet_7: "7G"
 internet_7_desc: "El 7G es el futuro estándar para redes de banda ancha que contemplaría un aumento del ancho de banda hasta los 120 Gbit/s. Haría que la banda ancha fuera aún más aplicable para transferencias masivas de datos."
 internet_8: "8G"
 internet_8_desc: "El 8G es el futuro estándar para redes de banda ancha que contemplaría un aumento del ancho de banda hasta los 240 Gbit/s. Haría que la banda ancha fuera aún más aplicable para transferencias masivas de datos."
 internet_9: "9G"
 internet_9_desc: "El 9G es el futuro estándar para redes de banda ancha que contemplaría un aumento del ancho de banda hasta los 480 Gbit/s. Haría que la banda ancha fuera aún más aplicable para transferencias masivas de datos."
 internet_10: "10G"
 internet_10_desc: "El 10G es el futuro estándar para redes de banda ancha que contemplaría un aumento del ancho de banda hasta los 1480 Gbit/s. Haría que la banda ancha fuera aún más aplicable para transferencias masivas de datos."
 internet_11: "11G"
 internet_11_desc: "El 11G es el futuro estándar para redes de banda ancha que contemplaría un aumento del ancho de banda hasta los 10240 Gbit/s. Haría que la banda ancha fuera aún más aplicable para transferencias masivas de datos."
 internet_access_1: "Wi-Fi"
 internet_access_1_desc: "Wi-Fi es una familia de protocolos de redes inalámbricas basados en la serie de estándares IEEE 802.11, los cuales se utilizan comúnmente para la conexión de redes de área local de dispositivos y el acceso a internet. El término 'Wi-Fi' es una marca registrada y está regulado por la Wi-Fi Alliance. El Wi-Fi está diseñado para funcionar de manera óptima con su homólogo cableado, Ethernet."
 internet_access_2: "Li-Fi"
 internet_access_2_desc: "La fidelidad lumínica (Li-Fi) es similar en función al Wi-Fi. La ventaja del Li-Fi sobre el Wi-Fi es que puede transmitir datos a velocidades de hasta 100 Gbit/s y es desarrollado por varias organizaciones en todo el mundo."
 internet_access_3: "Acceso a internet por satélite moderno"
 internet_access_3_desc: "Con los satélites volviéndose cada vez más predominantes en las comunicaciones y otras formas de transferencia de datos, internet es uno de los servicios que ha capitalizado el acceso satelital, lo que abre la posibilidad de que cada vez más personas estén conectadas a la red."
 agriculture_1: "Aplicaciones agrícolas de GPS"
 agriculture_1_desc: "The invention of GPS revolutionized travel, but we have devised a clever new way we can utilize it for our crops. We can use this new technology to help us in precision farming such as mapping field boundaries, roads, irrigation systems and problem areas. The precise mapping allows farmers to have extensive knowledge of their farm in relation to others as well as helping identify problem areas based on GPS data."
 agriculture_2: "Sistemas de riego automatizados"
 agriculture_2_desc: "Automatizar los sistemas de riego permitirá reducir el trabajo de nuestros operarios agrícolas, liberándolos para tareas más destacadas como el mantenimiento, el diseño de mejoras para sus cultivos y muchísimo más."
 agriculture_3: "Farming Data Analytic Software"
 agriculture_3_desc: "Invention of new data analytic software to help analyze crop success and failure rates, rate of problems with certain pesticides and more will help boost a large amount of productivity towards our agricultural sector."
 agriculture_4: "Tecnologías de cosecha automatizada limitada"
 agriculture_4_desc: "Installing limited automated harvesting and tending capacity will allow us to begin reducing the agricultural workforce to heavier and more specific tasks while the mundane tasks are left to automated robots and drones that can do the light work."
 agriculture_5: "Planificación agrícola basada en satélites"
 agriculture_5_desc: "Expanding on our GPS applications we can use satellite imaging, and other data from satellites to expand our reach and diligently plan our crop fields to ensure the most productive fields."
 agriculture_6: "Cosechadoras programables"
 agriculture_6_desc: "Installation of new software into some of our heavy farming equipment such as our combines and harvesters allowing us to program and automate their directives while the driver maintains the machine from the driver's seat will allow for additional productivity and eliminate additional margin of error."
 agriculture_7: "Automatización de la cosecha mejorada"
 agriculture_7_desc: "Expandiendo aún más nuestra maquinaria de recolección automatizada limitada e instalando capacidad adicional para la cosecha y el cuidado automatizados se liberará todavía más tiempo para nuestros agricultores y trabajadores agrarios."
 agriculture_8: "Cosechadoras robóticas"
 agriculture_8_desc: "Developing and deploying robotic agrarian workers will not only help boost productivity but free up a large amount of our agriculture workforce from working in the fields and in the barns to allow them to shift to other critical industries."
 agriculture_9: "Desarrollos agrícolas mantenidos por AGI"
 agriculture_9_desc: "Debido a la aparición y desarrollo de la inteligencia artificial general (AGI), seremos capaces de continuar automatizando y desplegando más trabajadores, eliminando prácticamente la necesidad de mano de obra agrícola extensiva en nuestra industria mientras se sigue manteniendo un nivel masivo de producción de alimentos."
 battleship_desc: "A large, heavily armored warship, carrying large capacity guns and other weapons. Used primarily from the 1800s to World War II, these vessels have fallen out of favor in favor of aircraft carriers or smaller vessels. Able to be equipped with a large range of high caliber or capacity weapons, these floating gun platforms make good fire support platforms."
 nsb_special_ammo_6: "Modernización de municiones de 6.ª gen."
 nsb_special_ammo_6_desc: "Integración a gran escala de ojivas adaptativas de próxima generación, municiones modulares y sistemas explosivos de alto impacto."
 nsb_AA_autocannon_9: "Sistemas de cañones automáticos de 9.ª gen."
 nsb_AA_autocannon_9_desc: "$nsb_AA_autocannon_5_desc$"
 nsb_SHORAD_missile_9: "Tecnología de misiles de 9.ª gen."
