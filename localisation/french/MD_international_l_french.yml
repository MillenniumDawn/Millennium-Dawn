 un_aid_subsidies_modifier: "Subventions d'aide de l'§BONU§!"
 un_aid_subsidies_modifier_desc: "Subventions accordées lorsque les conditions sont remplies par divers §Yprogrammes d'aide§! de l'§BONU§!, conçus pour soutenir les nations en développement et les aider à devenir des membres productifs de la communauté internationale."
 IS_un_aid_general_budget: "§YBudget de fonctionnement général§! : $$[?global.un_operating_budget_base|+G3] / semaine"
 IS_un_aid_general_budget_tt: "Affiche les contributions des nations, par ordre décroissant, au §Ybudget de fonctionnement général§! de l'§BONU§!"
 IS_un_aid_general_budget_tt_delayed: "Le §Ybudget de fonctionnement général§! est le budget de base global auquel tous les États membres de l'§BONU§! contribuent, s'ils remplissent les exigences minimales. La contribution budgétaire minimale est de §Y[?global.general_operating_budget_contribute_percent|%]§! du PIB, calculée chaque année au début de l'année, avec une contribution minimale de §G$0.001§! requise pour être ajoutée au budget. Les nations qui ne remplissent pas ce minimum ne contribuent pas au budget cette année-là, et ne reçoivent aucun bénéfice de contribution budgétaire en conséquence.\n\nLe §Ybudget de fonctionnement général§! est le montant de base d'argent fourni chaque semaine à l'§BOrganisation des Nations unies§! par les États membres, à distribuer aux divers §Yprogrammes d'aide§! de l'§BONU§!. Ces contributions sont réparties également entre tous les programmes, et fournissent le montant initial de base que chaque programme reçoit chaque semaine pour fonctionner.\n\nLes nations reçoivent un bonus au multiplicateur d'§Yinfluence étrangère§! £foreign_influence_modifier_texticon et au multiplicateur de §Ydéfense contre l'influence étrangère§! £foreign_influence_defense_modifier_texticon égal à leur pourcentage de contribution au §Ybudget de fonctionnement général§! en bénéfice de leurs contributions."
 is_un_aid_total_budget_spending: "§RDépenses totales§! pour l'§CONU§! :"
 is_un_aid_total_budget_spending_tt: "Nous dépensons actuellement $[?united_nations_expenses|-3] pour le financement de l'§BONU§!"
 is_un_aid_total_budget_spending_tt_delayed: "Ce chiffre affiche combien nous dépensons pour tous les §Yprogrammes d'aide§! de l'§BONU§!, y compris le §Ybudget de fonctionnement général§! et nos décisions de dépenses indépendantes pour toutes les contributions supplémentaires aux programmes de l'§BONU§!."
 is_un_basic_budget_spending: "§RDépenses§! du §Ybudget§! de l'§CONU§! :"
 is_un_basic_budget_spending_tt: "Nous dépensons actuellement $[?united_nations_base_expenses|-3] pour le §Ybudget de fonctionnement général§! de l'§BONU§!"
 is_un_basic_budget_spending_tt_delayed: "Le §Ybudget de fonctionnement général§! est le montant de base d'argent fourni chaque semaine à l'§BOrganisation des Nations unies§! par les États membres, à distribuer aux divers §Yprogrammes d'aide§! de l'§BONU§!. Ces contributions sont réparties également entre tous les programmes, et fournissent le montant initial de base que chaque programme reçoit chaque semaine pour fonctionner. Les programmes qui reçoivent un financement de ce budget sont l'§YONUDI§!, le §YFENU§! et l'§YUNESCOE§!"
 is_un_aid_unescoe_spending: "§RDépenses§! pour l'§YUNESCOE§! :"
 is_un_aid_unescoe_spending_tt: "Nous dépensons actuellement $[?united_nations_unescoe_funding|-3] pour le §Yprogramme UNESCOE§!"
 is_un_aid_unescoe_spending_tt_delayed: "L'§YOrganisation des Nations unies pour l'éducation, la science et la culture§! est une organisation d'aide conçue pour améliorer l'éducation, fournir des conseils techniques aux nations en développement et offrir un dialogue politique aux nations qui ont besoin d'aide pour croître.\n\nCe §Yprogramme d'aide§! de l'§BONU§! fournira des bonus à la £research_speed_texticon §Yvitesse de recherche§! et au £political_power_texticon §Ygain de pouvoir politique§!."
 is_un_aid_unido_spending: "§RDépenses§! pour l'§YONUDI§! :"
 is_un_aid_unido_spending_tt: "Nous dépensons actuellement $[?united_nations_unido_funding|-3] pour le §Yprogramme ONUDI§!"
 is_un_aid_unido_spending_tt_delayed: "L'§YOrganisation des Nations unies pour le développement industriel§! est un programme d'aide conçu pour promouvoir le développement industriel. En aidant les nations en développement à établir leur propre industrie, ce programme combat la pauvreté, établit une mondialisation inclusive et vise aussi la durabilité environnementale.\n\nCe §Yprogramme d'aide§! de l'§BONU§! permettra de gagner de l'§Yindustrie civile§! louée gratuitement, ainsi qu'améliorer la £construction_speed_texticon §Yvitesse de construction§! des nations pour les aider à améliorer leur base industrielle, leurs infrastructures énergétiques et leurs infrastructures de construction."
 is_un_aid_uncdf_spending: "§RDépenses§! pour le §YFENU§! :"
 is_un_aid_uncdf_spending_tt: "Nous dépensons actuellement $[?united_nations_uncdf_funding|-3] pour le §Yprogramme FENU§!"
 is_un_aid_uncdf_spending_tt_delayed: "Le §YFonds d'équipement des Nations unies§! est un programme d'aide conçu pour améliorer le flux de capitaux pour l'investissement national. L'objectif de ce programme est de créer des emplois et de générer une croissance économique durable, par des programmes d'investissement et la finance numérique.\n\nCe §Yprogramme d'aide§! de l'§BONU§! fournira un soutien à la fois §Yfinancier§! et de §Ydéveloppement§! aux nations recevant l'aide du programme. Ce programme est conçu pour aider à améliorer les budgets et booster la croissance de la productivité."
 is_un_aid_spending_percent: "% du §Ybudget de base§! :"
 is_un_aid_spending_percent_tt: "Le pourcentage du §Ybudget de fonctionnement général§! que nous contribuons est [?united_nations_contribution_percent|Y%2]"
 is_un_aid_spending_percent_tt_delayed: "Le pourcentage du §Ybudget de fonctionnement général§! est à la fois une question de prestige et une question de puissance. Plus nous contribuons, plus d'§Yinfluence étrangère§! £foreign_influence_modifier_texticon nous pourrons établir sur autrui, et plus notre influence sera efficace. Plus nous pourrons élever ce pourcentage, mieux ce sera."
 is_un_aid_additional_percent: "% des §Yprogrammes d'aide§! de l'§CONU§! :"
 is_un_aid_additional_percent_tt: "Le pourcentage de toutes les §Ycontributions supplémentaires aux programmes d'aide§! que nous fournissons est [?united_nations_aid_program_contribution_percent|Y%2]"
 is_un_aid_additional_percent_tt_delayed: "Le pourcentage de §Ycontributions supplémentaires aux programmes d'aide§! donne davantage d'influence sur les nations qui reçoivent l'aide des programmes, et nous donne davantage de £political_power_texticon §Ygain de pouvoir politique§!, ainsi qu'améliore nos chances de faire accepter nos §Yinvestissements§! par d'autres nations en §Gdiminuant§! à la fois le temps et le coût requis pour nos §Yinvestissements§!"
 is_un_aid_total_budget_ido_tt_delayed: "§Y25 %§! du budget du programme va à aider les pays à améliorer leur £construction_speed_texticon §Yvitesse de construction§!, et les §Y75 %§! restants sont utilisés pour fournir des §Yindustries civiles§! louées aux nations §Gsubventionnées§!."
 is_un_aid_total_budget_esco_tt_delayed: "§Y25 %§! du budget du programme va à aider les pays à améliorer leur £political_power_texticon §Ygain de pouvoir politique§!, et les §Y75 %§! restants vont à des projets pour aider à améliorer leur £research_speed_texticon §Yvitesse de recherche§!"
