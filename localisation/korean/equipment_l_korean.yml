 ALB_infantry_weapons_2: "ASh-82"
 ARM_infantry_weapons_2: "AK-74"
 ARM_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 ARM_infantry_weapons_3: "K6-92 BORZ"
 ARM_infantry_weapons_3_desc: "K6-92 기관단총은 아르메니아에서 개발되었습니다. 1991년 독립을 달성한 아르메니아는 당시 나고르노카라바흐를 둘러싸고 아제르바이잔과 실제로 무력 분쟁 상태에 있었습니다. 아르메니아 무장 부대는 소화기 부족을 절실히 체감했고, 이 필요에 따라 아르메니아 기술자들이 1991~92년에 비교적 단순한 K6-92 기관단총을 만들게 되었습니다."
 ARM_infantry_weapons_4: "VAHAN"
 ARM_infantry_weapons_4_desc: "바한은 마나샨이 소련군 복무 중 설계한 시제 7.62x39mm 돌격소총(MBK-2라고도 불림)을 기반으로 개발되었습니다. 이 자동 화기는 반자유 노리쇠 원리로 작동하여 반수공업적 생산에 맞게 설계를 단순화할 수 있습니다."
 ARM_infantry_weapons_5: "K-3"
 ARM_infantry_weapons_5_desc: "K-3는 1990년대 중반 소련제 AK-74 소총을 기반으로 개발된 아르메니아제 불펍형 돌격소총으로, 자동 및 반자동 사격은 물론 총열 하단 유탄발사기 발사도 가능하다. 아르메니아 국방부 산하 군수산업국에서 개발했으며 소량 생산되었다."
 ARM_infantry_weapons_6: "AS-300"
 ARM_infantry_weapons_6_desc: "2013년 10월 아르자가니크 2013 군 지휘참모 훈련에서 아르메니아에 공개된 AS-300 돌격소총은 7.62 x 35mm 탄약을 사용하도록 설계되었으며 이에 맞는 소음기를 갖추고 있습니다. 이 돌격소총은 30발들이 박스 탄창, 다른 형태의 개머리판, 수직 전방 손잡이를 갖추고 있습니다. 가스 작동식 자동 장치로 분당 최대 500발의 발사 속도를 냅니다. 해머식 방아쇠 기구를 사용하며 사격 모드는 단발과 자동입니다. AS-300 생산에는 칼라시니코프 돌격소총의 노리쇠 기구를 사용하지만, 새 총열, 개머리판 및 기타 부품이 설치됩니다."
 ARM_infantry_weapons_7: "ASR-545"
 ARM_infantry_weapons_7_desc: "2013년 10월 아르자가니크 2013 군 지휘참모 훈련에서 아르메니아에 공개된 ASR-545 소총은 가스 작동식 자동 장치를 갖추고 있습니다. 이 소총은 은폐된 위치에서 정확한 소음 사격을 수행해 적 병력과 경장갑 차량을 격파하도록 설계되었습니다(후자에는 자체 생산한 철갑탄이 사용됩니다). 소총에는 광학 조준경과 콜리메이터 조준경, 기타 장치를 위한 피카티니 레일이 장착되어 있습니다. 이 소총은 아음속탄을 쓰는 5.45x39mm 탄약을 사용합니다."
 ARM_infantry_weapons_8: "RDL-34"
 ARM_infantry_weapons_8_desc: "ASPAR Arms의 최신 개발품으로, AR-15를 기반으로 제작되었으며 칼라시니코프 돌격소총의 탄창과 구경 탄약을 사용하면서도 동급 제품에 뒤지지 않는 상당히 신뢰할 만한 설계를 갖추고 있습니다."
