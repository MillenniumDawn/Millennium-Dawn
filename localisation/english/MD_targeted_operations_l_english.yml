 TOP_person_row_intel: "I [?TOP_identity_confidence^v|0]  L [?TOP_location_confidence^v|0]  P [?TOP_pattern_confidence^v|0]"
 TOP_organization_row_intel: "V [?TOP_org_verification^v|0]  L [?TOP_org_location^v|0]  A [?TOP_org_activity^v|0]"
 TOP_person_row_intel_tt: "§YI§!dentity [?TOP_identity_confidence^v|0]: how sure we are who this person is.\n§YL§!ocation [?TOP_location_confidence^v|0]: how sure we are where they are now.\n§YP§!attern [?TOP_pattern_confidence^v|0]: how well we know their movements and routine.\nA package needs 60 on each axis, or 80 for serving political leaders, and a lead younger than 57 days."
 TOP_organization_row_intel_tt: "§YV§!erification [?TOP_org_verification^v|0]: how sure we are of the group's structure and leadership.\n§YL§!ocation [?TOP_org_location^v|0]: how sure we are where its facilities are.\n§YA§!ctivity [?TOP_org_activity^v|0]: how well we can time its current activity.\nA package needs 60 on each axis and a lead younger than 57 days."
 TOP_select_subject_body: "§YHow Dossiers work§!\n§YCold§! means no open case yet. To begin, pick a target.\n1. Select §YDesignate Case§! to create its dossier package.\n2. Select §YCollect Intelligence§! to follow CT intelligence. Complete Track High Value Targets, a CT Locate operation, or Locate Organization Facilities through the intelligence agency.\n3. Open §YAuthority§! for review and, if approved, a mandate for a strike, capture, covert action, rendition, cooperative host arrest, poisoning or facility disruption.\n4. Select §YBegin Preparation / Operation§!, then prepare and launch its native raid on the map. The engine result determines delivery.\n5. Review custody, assessment and the Archive."
 TOP_person_dossier_body: "§Y[TOP_selected_name]§!\n[TOP_selected_group] | Office/role: [TOP_selected_role]\nStatus: [TOP_selected_status] | [TOP_case_stage]\nIdentity [?TOP_identity_confidence^TOP_selected|0] / Location [?TOP_location_confidence^TOP_selected|0] / Pattern [?TOP_pattern_confidence^TOP_selected|0]\nBelieved host: [?TOP_lead_host^TOP_selected.GetName] | [TOP_selected_location]\nLead age: [?TOP_lead_age^TOP_selected|0] days | Direct pressure: [?global.TOP_pressure^TOP_selected|0]\nPackage: [TOP_package_state_name] | Collection focus: [TOP_focus_button_name]\nCustody: [TOP_selected_custody] | Lifetime attempts: [?global.TOP_attempts^TOP_selected|0]"
 TOP_organization_dossier_body: "§Y[TOP_selected_organization_name]§!\nClass: [TOP_selected_organization_class]\nVerification [?TOP_org_verification^TOP_selected_organization|0] / Facility location [?TOP_org_location^TOP_selected_organization|0] / Activity window [?TOP_org_activity^TOP_selected_organization|0]\nBelieved host: [?TOP_org_lead_host^TOP_selected_organization.GetName] | [TOP_selected_organization_location]\nLead age: [?TOP_org_lead_age^TOP_selected_organization|0] days | Pressure: [?global.TOP_group_pressure^TOP_selected_organization|0]\nKnown registered members: [?TOP_view_member_count|0]\nPackage: [TOP_package_state_name] | Focus: [TOP_focus_button_name]\nDisruption: [TOP_disruption_name] ([?TOP_view_disruption_days|0] days)"
 TOP_person_package_body: "§YPerson Package: [TOP_selected_name]§!\nIdentity [?TOP_identity_confidence^TOP_selected|0] / Location [?TOP_location_confidence^TOP_selected|0] / Pattern [?TOP_pattern_confidence^TOP_selected|0]\nFollow CT intelligence for identification and pattern evidence. Complete the intelligence agency Track High Value Targets operation for current location evidence. Core operation network, operative, equipment and DLC requirements apply. Dossier collection does not generate a separate monthly gain."
 TOP_organization_package_body: "§YOrganization Package: [TOP_selected_organization_name]§!\nVerification [?TOP_org_verification^TOP_selected_organization|0] / Location [?TOP_org_location^TOP_selected_organization|0] / Activity [?TOP_org_activity^TOP_selected_organization|0]\nUse the intelligence agency Locate Organization Facilities operation, or an established CT Locate operation where applicable. Execution uses native CT or target-specific facility raids. CT intelligence, headquarters and shared raid rules remain authoritative."
 TOP_person_authority_body: "§YAuthority: [TOP_selected_name]§!\nMode: [TOP_rule_mode_name] | Doctrine: [TOP_doctrine_name]\nPackage: [TOP_package_state_name] | [TOP_case_stage]\nFrozen mandate method: [TOP_authorized_method_name] | Remaining: [?TOP_view_case_days|0] days\nAttribution: [TOP_selected_attribution] | Civilian harm: [TOP_selected_harm]\nFull Sandbox permits assassination of a registered serving foreign civilian leader through the complete pipeline. Capture feasibility is a warning, not a lethal veto. Approval creates a waiting mandate; §YBegin Preparation / Operation§! reserves the one execution slot."
 TOP_organization_authority_body: "§YFacility Authority: [TOP_selected_organization_name]§!\nClass: [TOP_selected_organization_class] | Doctrine: [TOP_doctrine_name]\nObjective: [TOP_facility_name] | [TOP_case_stage]\nMandate remaining: [?TOP_view_case_days|0] days | Mission remaining: [?TOP_view_mission_days|0] days\nAttribution: [TOP_selected_attribution] | Civilian harm: [TOP_selected_harm]\nFacility sabotage can damage a state and impose one replacing 90-day organization disruption. It cannot kill, capture, retire, or replace a registered person."
 TOP_person_custody_body: "§YCustody: [TOP_selected_name]§!\nStatus: [TOP_selected_status] | Custodian: [TOP_selected_custody]\nOne-time exploitation available until day [?global.TOP_exploitation_until^TOP_selected|0]. Lifetime used: [?global.TOP_exploited^TOP_selected|0].\nExploit linked targets, organization intelligence, or network disruption once. Then continue detention, prosecute, transfer, negotiate a contextual exchange, or release. There is no generic execution control."
 TOP_organization_custody_disabled_body: "§YCustody is unavailable for organizations.§!\n[TOP_selected_organization_name] can be investigated and disrupted, but an organization has no killed, captured, detained, prosecuted, or released lifecycle. Select a captured person to use custody controls."

