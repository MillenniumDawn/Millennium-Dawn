 CT_internet_monitoring: "Manifestations contre la collecte massive de données"
 CT_internat_monitoring_desc: "Nos citoyens ont commencé à protester contre nos efforts pour les protéger par la collecte massive de données. Nous devons laisser passer leur colère..."
 CT_protesting_arrests: "Manifestations contre les arrestations contre le terrorisme"
 CT_protesting_arrests_desc: "Nos citoyens ont commencé à protester contre notre recours aux arrestations de masse face aux menaces terroristes. Nous devrions améliorer la qualité de notre renseignement pour éviter de telles protestations à l'avenir."
 CT_struck_by_terror_attack: "Frappé par un attentat terroriste"
 CT_struck_by_terror_attack_desc: "Notre nation a été frappée par une attaque terroriste d'une organisation internationale. Il nous faudra du temps pour nous en remettre, tant militairement qu'économiquement."
 CT_terror_attack_happened: "Une attaque terroriste mondiale s'est produite"
 CT_terror_attack_happened_desc: "Nos citoyens craignent d'être les suivants si les attentats dans le monde continuent. Nous devons faire quelque chose pour assurer leur sécurité."
 CT_terror_attack_prevented: "Attaque terroriste évitée"
 CT_terror_attack_prevented_desc: "Nos services de renseignement et nos forces antiterroristes ont récemment arrêté un attentat contre notre nation, renforçant la confiance du peuple dans notre capacité à le protéger !"
 MD_terror.1.t: "[org_doing_attack] mène une attaque terroriste !"
 MD_terror.1.d: "[org_doing_attack] a commis aujourd'hui un attentat contre nous, que nos services de renseignement et d'antiterrorisme n'ont pas pu empêcher. Les rapports sur les dégâts et les victimes arrivent encore, mais les deux sont estimés importants. Nous devons maintenant décider de notre prochaine action, afin d'offrir sécurité, protection et soutien à nos citoyens en cette crise."
 MD_terror.1.a: "Laissons les réponses locales se faire."
 MD_terror.1.b: "Envoyons autant d'aide que possible !"
 MD_terror.2.t: "[org_doing_attack] Attaque terroriste évitée !"
 MD_terror.2.d: "[org_doing_attack] a tenté aujourd'hui un attentat, mais il a été empêché grâce au renseignement efficace de nos agences et à l'action courageuse de nos équipes antiterroristes. Tous les terroristes impliqués ont été tués ou capturés, et leurs planques sont actuellement examinées pour tout renseignement supplémentaire. C'est aujourd'hui un grand succès pour nos forces antiterroristes !"
 MD_terror.2.a: "Une grande victoire pour [THIS.GetNameDef] !"
 MD_terror.3.t: "[FROM.GetName] frappé par un attentat terroriste !"
 MD_terror.3.d: "[FROM.GetName] a été frappé aujourd'hui par une attaque de [org_doing_attack_int], qui a infligé d'importants dégâts et victimes à la nation. Tandis que [FROM.GetName] encaisse le choc, nos propres citoyens s'inquiètent d'attaques possibles sur notre sol. Nous devons choisir d'envoyer ou non un soutien à [FROM.GetName], et décider comment rassurer nos propres citoyens."
 MD_terror.3.a: "Quelle tragédie."
 MD_terror.3.b: "Nous devons renforcer notre propre sécurité !"
 MD_terror.4.t: "[FROM.GetName] Attaque terroriste évitée !"
 MD_terror.4.d: "Le gouvernement de [FROM.GetName] a annoncé aujourd'hui avoir empêché avec succès un attentat de [org_doing_attack_int] sur son sol, grâce à des opérations de renseignement, de police et militaires efficaces pour démanteler la cellule avant l'attaque. Ce succès est un grand accomplissement pour la guerre mondiale contre la terreur !"
 MD_terror.4.a: "[FROM.GetNameDef] était clairement préparé."
 MD_terror.5.t: "Manifestations contre la collecte massive de données"
 MD_terror.5.d: "En raison de fuites dans notre communauté du renseignement, le public a appris notre collecte massive de données pour prévenir le terrorisme. Le peuple y voit cependant une atteinte massive à la vie privée, et a commencé à critiquer et à protester contre ce qu'il considère comme un abus de pouvoir."
 MD_terror.5.a: "C'est pour leur bien !"
 MD_terror.6.t: "Manifestations contre les arrestations de masse"
 MD_terror.6.d: "Si nos arrestations de masse de partisans de [name_of_org_disp] ont efficacement perturbé leurs opérations, nous avons aussi arrêté par erreur un grand nombre de civils innocents, simplement à cause d'un mauvais renseignement. Le public s'en indigne et commence à protester contre les arrestations de masse et d'autres techniques critiques dont nous avons besoin pour protéger la nation."
 MD_terror.6.a: "Des excuses ne suffisent-elles pas ?"
 MD_terror.7.t: "Infiltration réussie !"
 MD_terror.7.d: "Notre agent a enfin rendu compte : il est bien en place, à l'intérieur de l'organisation. Cela prendra du temps, mais à mesure que nos opérations avanceront, le renseignement qu'il pourra nous transmettre sera d'une grande utilité."
 MD_terror.7.a: "Ses informations seront d'une grande valeur !"
 MD_terror.8.t: "Agent tué"
 MD_terror.8.d: "Malheureusement, après n'avoir plus eu de nouvelles de notre agent, nous savons enfin pourquoi. Une vidéo a été publiée aujourd'hui par [name_of_org_disp], le montrant exécuté parmi plusieurs autres. Il a clairement été découvert ou capturé, et tout renseignement obtenu de lui a désormais moins de valeur, car ils savent que nous nous intéressions à lui."
 MD_terror.8.a: "Quelle perte"
 MD_terror.9.t: "Colère face au durcissement des mesures de sécurité"
 MD_terror.9.d: "Les citoyens s'indignent des mesures de sécurité renforcées que nous avons mises en place, qui compliquent les déplacements aériens, maritimes et terrestres dans les transports publics. Ils s'indignent aussi du niveau de sécurité accru lors des événements officiels, ce qui tend nos relations avec eux."
 MD_terror.9.a: "Les mesures doivent rester !"
 MD_terror.9.b: "Peut-être pouvons-nous un peu en réduire l'impact..."
 MD_terror.11.t: "[FROM.GetName] propose des exercices antiterroristes conjoints"
 MD_terror.11.d: "[FROM.GetName] a proposé des exercices antiterroristes conjoints, afin d'élargir les capacités de nos forces militaires et antiterroristes. Si nous acceptons, nous devrons y consacrer des fonds, mais eux aussi. Si nous refusons, nous les vexerons probablement, mais ils s'en remettront."
 MD_terror.11.a: "Menons les exercices !"
 MD_terror.11.b: "C'est une perte de temps."
 MD_terror.13.t: "[FROM.GetName] propose des conseillers"
 MD_terror.13.d: "[FROM.GetName] a proposé de nous envoyer de l'aide, sous forme de conseillers étrangers. Cela accroîtrait nos capacités antiterroristes, mais nous devons aussi supposer que ces conseillers rendront compte de nos activités et capacités, ce qui pourrait entraîner des fuites de renseignement."
 MD_terror.13.a: "Accepter l'offre !"
 MD_terror.13.b: "[THIS.GetName] n'a besoin d'aucune aide !"
 MD_terror.14.t: "[FROM.GetName] retire ses conseillers"
 MD_terror.14.d: "[FROM.GetName] a retiré son antiterrorisme de notre pays, ce qui a réduit nos capacités à mener des opérations antiterroristes."
 MD_terror.14.a: "Comment osent-ils !"
 MD_terror.15.t: "[FROM.GetName] accepte les conseillers !"
 MD_terror.15.d: "[FROM.GetName] a accepté notre offre de conseillers antiterroristes de nos agences de renseignement ! Non seulement cela nous aidera à améliorer leurs opérations antiterroristes, mais cela nous donnera aussi un regard intérieur sur leur collecte et leur traitement du renseignement."
 MD_terror.15.a: "Ils ont fait le bon choix !"
 MD_terror.16.t: "[FROM.GetName] refuse les conseillers !"
 MD_terror.16.d: "[FROM.GetName] a refusé d'autoriser nos conseillers antiterroristes sur son sol."
 MD_terror.16.a: "Tant pis pour eux."
