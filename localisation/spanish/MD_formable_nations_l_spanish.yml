 MAPHI_form_category: "Maphilindo"
 MAPHI_form_category_desc: "A proposed, nonpolitical confederation of the three Southeast Asian nations in the Malay Archipelago in the 1960's. The dream was never realized due to conflict amongst the nations of Indonesia and the Federation of Malaya. The unification of the three nations would create a nation that would rival some of the major nations around the globe."
 MAPHI_integrate_start: "Begin forming [GetMAPHINameDef]"
 MAPHI_integrate_start_desc: "The unification of Maphilindo is the beginning of a new era for the people of our nations. It is time to unify and bring forth a new future for our collective peoples.\n\n"
 MAPHI_integrate_indonesia: "Integrate [GetMAPHINameAdj] [IND.GetAdjective] Territories"
 MAPHI_integrate_indonesia_desc: "Indonesia es una región rica en recursos esenciales para la nación propuesta. Es imperativo integrarla por los recursos y la población que puede aportar."
 MAPHI_integrate_philippines: "Integrate [GetMAPHINameAdj] [PHI.GetAdjective] Territories"
 MAPHI_integrate_philippines_desc: "The Philippines is a major naval and trade hub in the Pacific. Integrating this nation will give us a much higher chance to begin the dominance of the Pacific."
 MAPHI_integrate_singapore: "Integrate [GetMAPHINameAdj] [SIN.GetAdjective] Territories"
 MAPHI_integrate_singapore_desc: "Singapore is a critical hub for the new nation. Its position as a major trade port and a financial centre makes it critical for the success of the new nation."
 MAPHI_integrate_malaysia: "Integrate [GetMAPHINameAdj] [MAY.GetAdjective] Territories"
 MAPHI_integrate_malaysia_desc: "Malasia es políticamente uno de los sectores centrales del país. Nos permite acceder a las rutas terrestres dentro de Asia gracias a la posesión de la península."
 MAPHI_integrate_brunei: "Integrate [GetMAPHINameAdj] [BRU.GetAdjective] Territories"
 MAPHI_integrate_brunei_desc: "Brunéi es una nación menor en el acuerdo. Es imperativo integrarla, a pesar de ser un estado menor."
 MAPHI_update_flag: "Finish Forming [GetMAPHINameDef]"
 MAPHI_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetMAPHINameDef], adopting its unified flag and name."
 is_MAPHI: "Has formed [GetMAPHINameDef]"
 INDOCHI_form_category: "Indochina"
 INDOCHI_form_category_desc: "Indochina is a former federation of nations of Vietnam, Cambodia, and Laos that existed until 1954. The three together form one of the largest economies in the globe and accommodate a massive population. It is a nation of dense jungles, rolling hills, mountains and gorgeous coastline. Its strength is in the people and the will that will bring the group forward into the future."
 INDOCHI_integrate_start: "Begin forming [GetINDOCHINameDef]"
 INDOCHI_integrate_start_desc: "It is time to begin the formation of Indochina.\n\n"
 INDOCHI_integrate_vietnam: "Integrate [GetINDOCHINameAdj] [VIE.GetAdjective] Territories"
 INDOCHI_integrate_vietnam_desc: "Vietnam posee una enorme cantidad de recursos naturales en las montañas y la costa. La integración de Vietnam comenzará a consolidar nuestra influencia en la nación."
 INDOCHI_integrate_laos: "Integrate [GetINDOCHINameAdj] [LAO.GetAdjective] Territories"
 INDOCHI_integrate_laos_desc: "Laos, al igual que Vietnam, también posee enormes cantidades de recursos naturales."
 INDOCHI_integrate_cambodia: "Integrate [GetINDOCHINameAdj] [CBD.GetAdjective] Territories"
 INDOCHI_integrate_cambodia_desc: "Cambodia's natural geography and rich lands are important for the nation. Integrating them into the nation will also improve the nation consistently."
 INDOCHI_update_flag: "Finish Forming [GetINDOCHINameDef]"
 INDOCHI_update_flag_desc: "With every constituent territory integrated, we can complete our transformation and proclaim [GetINDOCHINameDef], adopting its unified flag and name."
