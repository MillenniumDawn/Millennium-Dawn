 israel.150.t: "선거 이후 소요를 일으키는 하마스!"
 israel.150.d: "얼마 전 선거 결과가 발표된 이후, 결과에 동의하지 않은 하마스당이 서안 지구 당국에 맞선 시위를 시작했습니다."
 israel.150.a: "망할 놈들!"
 israel.150.b: "우려스럽다..."
 tkover_gz_tt: "§R£PAL_Neutral_Muslim_Brotherhood§!가 가자를 장악합니다!"
 israel.151.t: "가자를 장악한 하마스!"
 israel.151.d: "하마스는 봉기 이후 가자 지구에서 권력을 장악했습니다. 이전의 온건 정부는 이제 이 지역에서 도주하고 있으며, 가자 지구에서 어떤 일이 벌어질 것인가 하는 문제는 그 어느 때보다 시급합니다. 또한 철수하지 않은 가자 지구 내 이스라엘 주민들의 운명도 중요합니다."
 israel.151.a: "오, 맙소사!"
 israel.151.b: "알라후 아크바르!"
 israel.152.t: "알아크사 홍수 작전"
 israel.152.d: "알아크사를 완전히 해방할 때가 왔습니다. 전진!"
 israel.152.a: "알라후 아크바르!"
 ISR_evacuate_ammonia: "탱커를 남쪽으로 이동"
 ISR_evacuate_ammonia_desc: "암모니아 생산을 확대하지 않고, 암모니아 관련 기밀을 해제하여 국제 사회에 선의를 보이며 더 평화로운 노선을 추진해야 합니다."
 ISR_keep_ammonia: "암모니아 공장 방어"
 ISR_keep_ammonia_desc: "우리의 섬유 생산을 지키고 확대해야 합니다! 이웃 나라들도 우리의 새 분홍색 셔츠를 분명 마음에 들어 할 것입니다."
 ISR_tariffs_relax: "수입 관세 완화"
 ISR_tariffs_relax_desc: "더욱 무역 지향적인 경제를 유지하기 위해 수출입 관세를 완화해야 합니다."
 ISR_econ_bonus_bl: "경제 정책"
 ISR_assassinate_scientists: "핵 과학자 암살"
 ISR_assassinate_scientists_desc: "이란의 급속한 핵무기 개발을 억제하려면 그들의 과학자들을 암살해야 합니다. 이것이 그들을 멈추지는 못하겠지만, 확실히 늦출 수는 있습니다."
 ISR_assassinate_soleimani: "뱀의 머리 작전"
 ISR_assassinate_soleimani_desc: "카셈 솔레이마니는 오늘날 중동에서 우리의 가장 큰 위협입니다. 그를 제거하기 위해 미국과 공동 작전을 수행해야 합니다."
 ISR_sayeret_drill: "사예렛 마트칼 훈련"
 ISR_sayeret_drill_desc: "가장 가까운 동맹국인 미국과 함께 훈련하고 배워야 합니다. 특히 가자와 전쟁을 치르게 될 경우 큰 도움이 될 수 있는 미국의 도시전 경험을 고려하면 더욱 그렇습니다."
 ISR_prepare_maneuvers: "대규모 기동 준비"
 ISR_prepare_maneuvers_desc: "우리 병사들은 대규모 기동과 강행 신속 행동에 대비해야 합니다."
 ISR_periphery_recruitments: "충원에서의 엘리트 타파"
 ISR_periphery_recruitments_desc: "기존의 장교 엘리트를 해임하고 우리의 전문 병력 중에서 새 장교를 임명해야 합니다."
 ISR_passover_massacre: "유월절 학살"
 ISR_passover_massacre_desc: "테러 공격이 발생할 경우에 대비해 사전과 사후 모두 준비해야 합니다. 이제 팔레스타인에 테러 공격 가해자들의 이름을 제출하라고 요구해야 합니다!"
 ISR_disentanglement_plan_desc: "서안지구 깊숙이 고립된 정착촌을 철거하고 군 병력을 보다 방어하기 쉬운 경계선으로 재배치하여, 이스라엘 민간인과 팔레스타인 민간인을 물리적으로 분리하는 단계적 계획입니다. 전면적인 철수와 달리, 이 계획은 주요 정착촌 단지를 유지하는 한편 전략적으로 지탱하기 어렵다고 판단되는 지역에서는 철수합니다."
 ISR_suppress_the_hebron_uprising: "헤브론 봉기 진압"
 ISR_suppress_the_hebron_uprising_desc: "팔레스타인이 자국 영토 내의 급진주의자들을 처리해 달라고 우리에게 요청했습니다. 더 이상의 문제를 막기 위해 행동해야 합니다."
 ISR_sayaret_matkal_drills_1: "사예렛 마트칼 훈련"
 ISR_recognize_kafr_qasim: "카프르 카심 인정법"
 ISR_recognize_kafr_qasim_desc: "1956년 10월 29일 카프르 카심에서 벌어진 사건에 대한 우리의 입장을 마침내 결정해야 합니다."
 ISR_non_portfolio_desc: "이익을 극대화하기 위해 수익성 없는 파트너를 제거합니다."
 ISR_assassinate_hamas_leader: "하마스 지도자 암살"
 ISR_assassinate_hamas_leader_desc: "가자의 지도자가 이란에 있는 동안 그를 암살하려 시도해야 합니다."
 ISR_radwan_infiltrate: "라드완 침투당함!"
 ISR_radwan_infiltrate_desc: "아군의 계획이 노출되었으며 우리는 조직상의 문제를 겪고 있습니다."
 ISR_dismantle_kasbah_of_nablus: "나블루스 카스바 해체"
 tulkarm_progr: "툴카렘 급습 진행 중"
 tulkarm_done: "툴카렘 급습 완료"
