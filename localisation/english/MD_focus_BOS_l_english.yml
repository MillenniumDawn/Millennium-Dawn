 BOS_ATTITUDE_TOOLTIP: "§YAttitude§! measures a constituent group's willingness to cooperate with the central government. Hostile groups may demonstrate and block political paths."
 bos_STABILITY_TOOLTIP: "§YStability§! measures cohesion within a constituent group. Low stability causes demonstrations, while the combined values modify national Stability."
 bos_MANPOWER_TOOLTIP: "§YManpower§! measures the recruits each constituent group will provide. The combined values modify Recruitable Population."
 bos_srpska_gui_info_TOOLTIP: "§YSerbians§! mostly reside within the Republic of Srpska, a part of land that hugs the Federation of Bosnia and Herzegovina from the east and the north. The Republic of Srpska is an independent entity within Bosnia and herzegovina. They are predominantly Orthodox in faith."
 bos_bosniak_gui_info_TOOLTIP: "§YBosniaks§! are an ethnic group that jointly shares the entity of Federation of Bosnia and Herzegovina not to be confused with the country name of Bosnia and Herzegovina. They mostly reside within central Bosnia and are predominantly Muslim in faith."
 bos_croat_gui_info_TOOLTIP: "§YCroats§! are the minority group within the Federation of Bosnia and Herzegovina. They mostly live along the south-western region of Bosnia along the border of Croatia's southern Coastline. They are predominantly Catholic in faith."
