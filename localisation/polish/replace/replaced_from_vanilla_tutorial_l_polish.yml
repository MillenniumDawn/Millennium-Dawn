l_polish:
 tut_2_text_1: "Good! Now that the alerts are sorted out you can start diving into the details of waging war. Italy starts at war with Ethiopia and you should not have much difficulty in winning that war once you learn how to do it.\n\nMove your camera in a south-eastwards direction until you find Eritrea in Africa. Once your camera location has changed, §Yselect the Brigades§! in the $STATE|Y$ state by holding down §Gleft-click§! and drag select."
 tut_3_text_1: "Great! Now you will learn how to start planning an offensive.\n\nBrigades can join together in §YArmies§!. An Army is used to draw Battle Plans and they can be assigned a §YCommander§! to lead them."
 tut_3_text_2: "While you have brigades selected, click the §YNew Army§! button at the bottom of the screen. Do the same procedure for the brigades to the south, in §YSomaliland§!."
 tut_5_text_1: "Good! A §YFront Line§! now exists towards Ethiopia. In order for you to get your troops to attack with §YBattle Plans§! you must first also draw an §YOffensive Order§!.\n\nClick the §YOffensive line§! button and then hold §Gright-click§! and drag between the two highlighted provinces. Do the same procedure for the brigades to the south, in §YSomaliland§!."
 tut_11_text_1: "Your forces will now begin the offensive on Addis Ababa, Ethiopia's capital. When you have occupied enough of your enemies' territory, they will surrender.\n\n§YUnpause§! the game by pressing £SPACE . You can adjust the game speed by pressing the £KP_PLUS  or £KP_MINUS  keys. It is normal that players often adjust the game speed according to their needs as opposed to play on the same speed all the time.\n\nHint: If you feel you could control your units better, select a brigade and §Gright-click§! provinces to manually override the orders units get from Battle Plans."
 tut_13_text_1: "You are victorious! The war is over and Ethiopia has been defeated.\n\nDuring peace time you may want to §Ytransport troops§! across the ocean to redeploy them to different locations, or perhaps to prepare for war. \n\nNow that Ethiopia has been defeated you do not need to have so many Brigades there.\n\nSelect at least §Y4 Brigades§! and move them to the §Yhighlighted port§! by §Gright-clicking§! the province."
 TUT_QUEUE_DIV: "A §LBrigade§! is queued for deployment"
 TUT_SELECTED_DIVS: "$NUMBERS$ Brigades in $STATE$ are selected"
 TUT_TROOPS_IN_PORT: "$NUMBERS$ Brigades are standing at the port in $STATE$"
 TUT_TROOPS_IN_TRANSIT: "$NUMBERS$ Brigades are in transit heading towards a port in $COUNTRY$"
 BUTTON_WIKI_DIVISION_TEMPLATES: "Read about §HBrigade Templates§! on HOI4 Wiki!"
 HINT_ARMY_PLANNER_TEXT_1_1: "This is the §YRecruit & Deploy§! screen and this is where you queue new brigades for training and later on deployment. We recommend that you add a §YDivisione di Fanteria§! Brigade to the queue.\n\nBrigades in training will first attempt to gather the §YEquipment§! they require. Once they have Equipment, they will begin their training. Training progress can never exceed equipment progress.\n\nClick the §YTrain§! button to add a Brigade for training."
 HINT_ARMY_PLANNER_TEXT_1_2: "Once Brigades have completed their training, they can be §YDeployed§! to a §Ylocation of your choice§!. You may only deploy Brigades in your core territory."
 HINT_ARMY_PLANNER_TEXT_2: "Brigades can be produced serially and/or in parallel.\n\nBrigades that are trained in parallel will gain §YEquipment§! at the same rate, so they will all be finished at roughly the same time. When a Brigade has all the equipment they need and are fully trained they will be deployed to the location you have chosen.\n\nClick §YAdd Unit§! to add another Brigade for parallel training.\n\nIf the tides of war have turned against you, it may be viable to Deploy your Brigades §Ybefore they have all their equipment and training§!. This should be avoided when you can.\n\nYou can read more about what units to recruit on the HOI4 Wiki!"
 HINT_DIVISION_DESIGNER: "Hint: Brigade Designer"
 HINT_DIVISION_DESIGNER_NOXP_TEXT: "This is the §YBrigade Designer§! and it is used to create new or edit §YBrigades Templates§!. Editing or creating a new Brigade Template will cost you £army_experience  §YArmy Experience§!. Army Experience is gained when your units are engaged in combat or are on army exercises. Units that are Experience Level 1 - §YGreen§! do not generate £army_experience  Army Experience.\n\nYou will need more £army_experience Army Experience before you can create or edit a Brigade Template."
 HINT_DIVISION_DESIGNER_XP_TEXT: "This is the §YBrigade Designer§! and it is used to create new or edit §YBrigades Templates§!. Editing or creating a new Brigade Template will cost you £army_experience  §YArmy Experience§!. Army Experience is gained when your units are engaged in combat or are on army exercises. Units that are Experience Level 1 - §YGreen§! do not generate £army_experience  Army Experience.\n\nFor your first template edit we recommend you to click the empty slot under the Support column to add £unit_artillery_icon_small §YSupport Artillery§! to your brigade. Once you have added it, click §YSave§!. Your brigades that use this template will now start asking for Artillery §YEquipment§!."
 HINT_EDIT_TEMPLATE_TEXT: "You are producing equipment that is not used by any §YBrigade Template§!. But you also have £army_experience §YArmy Experience§! to do something about it.\n\nClick §YEdit§! next to the §YDivisione di Fanteria§! or any other Brigade of your choice."
 HINT_LOGISTICS_TEXT: "This is the §YLogistics§! screen and its purpose is to help you see if you are producing equipment faster or slower than you are spending it.\n\nIf you are producing more of a type of §YEquipment§! than you think you need, it might be a good idea to reduce the amount of factories working on the §YProduction Line§! that is producing that type of Equipment.\n\nWhether you're brigades are in good §Ysupply§! or not is an important part of your successes on the battlefield. You can check your supply status by switching to the §YSupply Map Mode§! £GFX_F4  ."
 HINT_LOGISTICS_TEXT_2: "Supply is distributed from the £GFX_capital_hub_texticon §YCapital Supply Hub§! and flows via £GFX_train_texticon §YTrains§! or £GFX_convoy_texticon §YConvoys§! to £GFX_supply_hub_texticon §YSupply Hubs§! or £GFX_naval_supply_hub_texticon §YNaval Bases§! in the different provinces. \n\nSupply is then distributed to fielded brigades within the hub's range. You can see the range by selecting a £GFX_supply_hub_texticon §YSupply Hub§! and holding £GFX_shift . Range can be affected by motorization which uses £GFX_unit_motorized_icon_small §YTrucks§!.\n\nEfficiency is further affected by the level of the £GFX_railways_texticon §YRailways§! and £GFX_naval_supply_hub_texticon §YNaval Bases§!, lack of £GFX_train_texticon §YTrains§!, and enemy air strikes. This creates §Rbottlenecks§!. These can be mitigate by upgrading the railways to the capital supply hub, provide air defences with fighters and make sure to have enough trains. Supply availability is shown in the §YSupply Mapmode§!  £GFX_F4  ."
 HINT_NO_TEMPLATE_NO_XP_TEXT: "You have clicked the §YNo Template alert§!. Do not worry! It is very good that you keep looking at the alerts for answers, they are there to help you.\n\nMost likely, you created a Production Line that was producing Artillery equipment. At this moment, none of your §YBrigades§! are using that equipment in any of their §YBrigade Templates§!.\n\nOnce you gain more £army_experience  §YArmy Experience§!, you may edit your Brigade Templates to include Artillery. £army_experience  Army Experience is gained when your Brigades engage in combat or when they are on army exercises.\n\nYou can ignore this alert for now, as this tutorial will help you once you gain more £army_experience  Army Experience."
 HINT_NO_TEMPLATE_HAVE_XP_TEXT: "You have clicked the §YNo Template alert§! which shows you that you are producing Equipment that you are currently not using.\n\nTo allow your Brigades to start using new types of equipment, you need to edit their §YBrigade Template§!. Editing a Brigade Template costs £army_experience  §YArmy Experience§!.\n\nGo to the §YRecruit & Deploy§! screen and choose a Brigade Template to §YEdit§!.\n\nBy tooltiping this alert you can see what type of Equipment that you are producing, but that you are currently not using."
 HINT_OFFICER_CORPS_SCREEN_TEXT_2: "Theorists reduce the cost of Land, Naval and Air §YDoctrines§!, which focus on overall strategy. These are set for each military branch, providing bonuses to fielded brigades, fleets and air regiments."
 HINT_OCCUPIED_TERRITORIES_SCREEN: "Hint: Occupied Territories"
 HINT_OCCUPIED_TERRITORIES_SCREEN_TEXT: "In order to combat resistance and police the population, occupied states will need to be garrisoned by military troops to perform police duties. The in-game Garrison represents this and can be assigned from the §YOccupied Territories§! tab in your §YPolitics Screen§!, which is opened by clicking on your country flag in the upper left corner.\n\nThe brigades needed to staff the garrisons are not visible on the map and are allocated and get their equipment automatically. The equipment allocation can be set via the §YRecruit & deploy§! tab."
 HINT_SELECT_UNIT_TEXT: "It is time to wage war on §YEthiopia§!. You should start by giving your units orders by creating a Battleplan with an Offensive Order.\n\n§YSelect the highlighted Brigades§! in the §YEritrea§! state."
 HINT_LOW_SUPPLY_TEXT_1: "In order to keep your brigades combat-capable you are going to need supplies. Supply is distributed from the £GFX_capital_hub_texticon §YCapital Supply Hub§! and flows via £GFX_train_texticon §YTrains§! or £GFX_convoy_texticon §YConvoys§! to £GFX_supply_hub_texticon §YSupply Hubs§! or £GFX_naval_supply_hub_texticon §YNaval Bases§! in different provinces. \n\nSupply is then distributed to fielded brigades within the hub's range. You can see the range by selecting a £GFX_supply_hub_texticon §YSupply Hub§! and holding £GFX_shift. §YMotorization Priority§! can increase the hub's range, which increases the range at which your brigades receives supply. This will use £GFX_unit_motorized_icon_small §YTrucks§!."