 generic.5.t: "[FROM.GetName] convida [Root.GetName] a integrar a [FROM.GetFactionName]."
 generic.5.d.a: "Com um olhar suspeito sobre os recentes acontecimentos na política mundial, [alliance_inviter.GetName] estende-nos a mão da amizade, oferecendo-nos sua proteção e instando-nos a estar ao lado deles em defesa dos princípios de liberdade e democracia. Como membro da [alliance_inviter.GetFactionName], a liberdade de nosso povo pode ser preservada."
 generic.5.d.b: "Reconhecendo que, às vezes, até os fortes precisam de aliados, os [alliance_inviter.GetAdjective] nos convidaram a ingressar na [alliance_inviter.GetFactionName]. Se optarmos por aceitar, isso pode nos proporcionar amplas oportunidades para encontrarmos nosso lugar ao sol."
 generic.5.d.c: "Nossos aliados ideológicos em [alliance_inviter.GetName] notaram nossas valiosas contribuições para a causa dos trabalhadores, e hoje de manhã recebemos um convite para nos juntarmos à [alliance_inviter.GetFactionName]. Unidos com outras repúblicas socialistas, poderíamos espalhar a revolução com renovada força."
 generic.5.d.e: "Parece que os [alliance_inviter.GetAdjective] nos consideram de interesse estratégico, e que eles acham mais lucrativo que trabalhemos juntos do que nos deixemos dividir por nossas diferenças ideológicas. Esta manhã, o Embaixador [alliance_inviter.GetAdjective] entregou um convite para nos tornarmos um estado membro da [alliance_inviter.GetFactionName]."
 generic.5.a: "Faremos nossa posição ao lado deles."
 generic.5.b: "Precisamos apenas de alguns milhares de mortos..."
 generic.5.c: "Lutaremos ao lado de nossos camaradas!"
 generic.5.e: "É a escolha lucrativa."
 generic.6.t: "[alliance_applicant.GetName] aceita o convite para a [alliance_inviter.GetFactionName]"
 generic.6.d: "[alliance_applicant.GetName] decidiu aceitar nossa oferta de ingressar na [alliance_inviter.GetFactionName]. Daqui para frente, estaremos juntos, seja para triunfar ou cair."
 generic.7.t: "[alliance_applicant.GetName] rejeita a oferta para ingressar na [alliance_inviter.GetFactionName]"
 generic.7.d: "[alliance_applicant.GetName] decidiu rejeitar nossa oferta de ingressar na [alliance_inviter.GetFactionName]. Teremos que nos virar sem a ajuda deles."
 generic.7.a: "Nossa ajuda não é desejada."
 ace_promoted.1.t: "Ás da Aviação Promovido"
 ace_promoted.2.t: "Um Ás Selvagem Aparece"
 ace_promoted.1.d: "Poucos assumem tantos riscos quanto os corajosos pilotos da força aérea [Root.GetAdjective]. [FROM.GetName] [FROM.GetSurname], um piloto habilidoso conhecido pelo indicativo [FROM.GetCallsign], distinguiu-se não apenas por retornar com vida da recente missão sobre [FROM.GetMissionRegion], mas por sobreviver a vitórias significativas em muitos confrontos críticos.\n\nAclamado como um exemplo brilhante da coragem [Root.GetAdjective], a recente promoção de [FROM.GetName] tem sido amplamente divulgada. Embora o povo possa ver a guerra mais como um inferno do que como uma glória, muitos ficam felizes em ver que ainda existem heróis em quem se apoiar."
 ace_promoted.1.d_major: "Poucos assumem tantos riscos quanto os corajosos pilotos da força aérea [Root.GetAdjective]. [FROM.GetName] [FROM.GetSurname], um piloto habilidoso conhecido pelo indicativo [FROM.GetCallsign], distinguiu-se não apenas por retornar com vida, mas por pilotar sua [FROM.GetWing] com imensa destreza. Recentemente, [FROM.GetName] participou de uma missão sobre [FROM.GetMissionRegion] e foi fundamental para o sucesso deste confronto crítico.\n\nAclamado como um exemplo brilhante da coragem [Root.GetAdjective], a recente promoção de [FROM.GetName] tem sido amplamente divulgada. Embora o povo possa ver a guerra mais como um inferno do que como uma glória, muitos ficam felizes em ver que ainda existem heróis em quem se apoiar."
 ace_promoted.1.a: "Quem ousa, vence."
 ace_died.1.t: "Ás da Aviação Codinome '[From.GetCallsign]' Morto sobre [From.GetMissionRegion]"
 ace_died.1.d: "Um dos mais famosos ases [FROM.GetAceType] de [FROM.Owner.GetName], [FROM.GetFullName], foi abatido em combate durante uma missão sobre [FROM.GetMissionRegion]. Infelizmente, como [FROM.GetSheHe] sempre foi uma figura pública, sua morte é severamente desmoralizante para as muitas pessoas que o admiravam.\n\nEmbora desejássemos que houvesse uma maneira de ocultar este evento da população, a falta de aparições públicas de [FROM.GetName] logo levantaria suspeitas. No fim das contas, sua morte é apenas mais uma parte de uma lenda que, esperamos, perdurará muito além de nossos problemas atuais."
 ace_died.1.d_major: "Um dos mais famosos ases [FROM.GetAceType] de [FROM.Owner.GetName], [FROM.GetFullName], tombou no cumprimento do dever. Pilotos que retornaram da região relatam ter visto sua [FROM.GetWingShort] cair em chamas sobre [FROM.GetMissionRegion] após sofrer intenso fogo inimigo. Infelizmente, como [FROM.GetSheHe] sempre foi uma figura pública, a morte de '[FROM.GetCallsign]' é severamente desmoralizante para as muitas pessoas que o admiravam.\n\nEmbora desejássemos que houvesse uma maneira de ocultar este evento da população, a falta de aparições públicas de [FROM.GetName] logo levantaria suspeitas. No fim das contas, a morte é apenas mais uma parte de uma lenda que, esperamos, perdurará muito além de nossos problemas atuais."
 ace_died.1.a: "Uma lenda viva é sempre melhor."
 ace_killed_by_ace.1.t: "Ás da Aviação [From.GetFullName] Abatido por Piloto Inimigo"
 ace_killed_by_ace.1.d: "Pilotos que retornaram de [FROM.GetMissionRegion] relatam que um esquadrão de aeronaves [Prev.Owner.GetAdjective], liderado pelo infame piloto \"[Prev.GetCallsign]\", concentrou seus esforços em perseguir [FROM.GetFullName]. Após desviar de diversas rajadas inimigas e abater várias aeronaves hostis, \"[FROM.GetCallsign]\" acabou sendo sobrepujado por \"[Prev.GetCallsign]\", que, segundo os relatos, manobrou melhor que [FROM.GetHerHim] e atingiu em cheio os tanques de combustível de [FROM.GetHerHis], rompendo-os. O avião de [FROM.GetName] [FROM.GetSurname] incendiou-se e despencou em espiral sobre [FROM.GetMissionRegion], envolto em um violento mar de chamas.\n\n[FROM.GetFullName] demonstrou grande coragem durante todo o período de [FROM.GetHerHis] serviço e era admirado por muitos. A perda desse herói nacional representa um duro golpe para a Força Aérea [FROM.Owner.GetAdjective] e uma tragédia devastadora para toda a nossa nação. Saber que, enquanto lamentamos essa perda, [Prev.Owner.GetName] celebra [Prev.GetFullName] como um herói torna essa tragédia ainda mais dolorosa."
 ace_killed_by_ace.1.d_major: "Pilotos retornando de [FROM.GetMissionRegion] relatam que um esquadrão de aeronaves [Prev.Owner.GetAdjective], liderado pelo infame piloto '[Prev.GetCallsign]', concentrou-se em perseguir [FROM.GetFullName]. Após abater várias aeronaves inimigas e desviar de diversas rajadas do inimigo, '[FROM.GetCallsign]' foi superado por '[Prev.GetCallsign]' em seu [Prev.GetWingShort], que supostamente manobrou melhor que [FROM.GetHerHim] e rasgou os tanques de combustível de [FROM.GetHerHis] com um tiro certeiro. O [FROM.GetWingShort] de [FROM.GetName] [FROM.GetSurname] pegou fogo e entrou em parafuso mortal sobre [FROM.GetMissionRegion] em um inferno violento.\n\n[FROM.GetFullName] demonstrou grande coragem ao longo de [FROM.GetHerHis] serviço e era admirado por muitos. A perda deste herói nacional é um golpe terrível para a Força Aérea [FROM.Owner.GetAdjective] e uma tragédia devastadora para a nação como um todo. Saber que, enquanto lamentamos, [Prev.Owner.GetName] celebra [Prev.GetFullName] como um herói torna a tragédia ainda maior."
 ace_killed_by_ace.1.a: "Uma perda devastadora para todos nós"
 ace_killed_other_ace.1.t: "As de Caça [FROM.GetFullName] Abate o Indicativo de Chamada '[Prev.GetCallsign]'"
 ace_killed_other_ace.1.d: "Nossa última missão sobre [FROM.GetMissionRegion] foi um grande sucesso para a Força Aérea [FROM.Owner.GetAdjective] em mais de um aspecto. Relatórios chegaram destacando o ato heróico de [FROM.GetFullName], que superou em astúcia o piloto [Prev.Owner.GetAdjective] [Prev.GetName] [Prev.GetSurname], conhecido como '[Prev.GetCallsign]'. '[FROM.GetCallsign]' usou a si [FROM.GetHerselfHimself] como isca e atraiu '[Prev.GetCallsign]' para uma armadilha onde os pilotos [FROM.Owner.GetAdjective] puderam mergulhar sobre o esquadrão de [Prev.GetCallsign]'. '[FROM.GetCallsign]' então manobrou melhor que a aeronave [Prev.Owner.GetAdjective] e, com uma única rajada, enviou '[Prev.GetCallsign]' em parafuso dos céus de [FROM.GetMissionRegion].\n\n[Prev.GetFullName] era um piloto temido com muitas vidas [FROM.Owner.GetAdjective] em [Prev.GetHerHis] consciência. Esta é uma grande vitória e mostra que, quando nos unimos em torno de grandes heróis, eles realizam grandes feitos."
 ace_killed_other_ace.1.d_major: "Nossa última missão sobre [FROM.GetMissionRegion] foi um grande sucesso para a Força Aérea [FROM.Owner.GetAdjective] em mais de um aspecto. Relatórios chegaram destacando o ato heróico de [FROM.GetFullName], que conseguiu superar em astúcia o piloto [Prev.Owner.GetAdjective] [Prev.GetName] [Prev.GetSurname], conhecido como '[Prev.GetCallsign]'. [FROM.GetCallsign] usou [FROM.GetHerselfHimself] como isca e atraiu '[Prev.GetCallsign]' para uma armadilha onde os pilotos [FROM.Owner.GetAdjective] puderam mergulhar sobre o esquadrão de [Prev.GetCallsign]'. '[FROM.GetCallsign]' procedeu para manobrar melhor que a aeronave [Prev.Owner.GetAdjective] e, com uma única rajada, enviou '[Prev.GetCallsign]' em parafuso dos céus de [FROM.GetMissionRegion].\n\n[Prev.GetFullName] era um piloto temido com muitas vidas [FROM.Owner.GetAdjective] em [Prev.GetHerHis] consciência. Esta é uma grande vitória e mostra que, quando nos unimos em torno de grandes heróis, eles realizam grandes feitos."
 ace_killed_other_ace.1.a: "Uma vitória que todo(a) [FROM.Owner.GetNameDef] lembrará!"
 aces_killed_each_other.1.t: "Ás da Aviação [FROM.GetFullName] Foi Abatido"
 aces_killed_each_other.1.d: "Durante a última missão, nosso famoso ás [FROM.GetAceType] [FROM.GetFullname] acabou em um combate prolongado com o temido ás, [Prev.GetFullName]. Estando com pouca munição e sem possibilidade de fuga, '[FROM.GetCallsign]' manobrou através do fogo da aeronave [Prev.Owner.GetAdjective] e avançou para abalroar '[Prev.GetCallsign]'.\nTanto a aeronave de [FROM.GetCallsign] quanto a de [Prev.GetCallsign] foram avistadas caindo em pedaços sobre [FROM.GetMissionRegion].\n\nEmbora seja um pequeno consolo que a ameaça [Prev.Owner.GetAdjective], '[Prev.GetCallsign]', não seja mais um incômodo para nós, perdemos uma figura pública valiosa e uma inspiração para toda a nação."
 aces_killed_each_other.1.d_major: "Durante a missão mais recente, nosso famoso ás [FROM.GetAceType] [FROM.GetFullname] acabou em um combate prolongado com o temido piloto ás, [Prev.GetFullName]. Estando com pouca munição e sem possibilidade de fuga, '[FROM.GetCallsign]' manobrou [FROM.GetHerHis] [FROM.GetWingShort] através do fogo da aeronave [Prev.Owner.GetAdjective] e avançou para abalroar '[Prev.GetCallsign]'.\nTanto o [FROM.GetWingShort] de [FROM.GetCallsign] quanto o [Prev.GetWingShort] de [Prev.GetCallsign] foram avistados caindo em pedaços sobre [FROM.GetMissionRegion].\n\nEmbora seja um pequeno consolo que a ameaça [Prev.Owner.GetAdjective], '[Prev.GetCallsign]', não seja mais um incômodo para nós, perdemos uma figura pública valiosa e uma inspiração para toda a nação."
 aces_killed_each_other.1.a: "Uma grande perda para nós, no entanto"
 election.1.t: "ELEIÇÃO GENÉRICA"
 election.1.d: ""
 election.1.a: ""
 election.2.t: "Eleição: Público se Opõe ao Rearmamento"
 election.2.d: "Nas próximas eleições, o apoio ao [Root.GetRulingParty] ainda é alto, com as pessoas confiando na liderança de [Root.GetLeader]. No entanto, a busca do partido em aumentar o foco de [Root.GetName] em assuntos militares não foi totalmente popular junto ao público, com uma parcela significativa dos cidadãos considerando esse militarismo imprudente. A guerra ainda não chegou às nossas fronteiras e poucos desejam ver [Root.GetName] adotando uma ação agressiva. Cooperando com outros grandes partidos que compartilham nossas preocupações com a segurança da nação, ainda seremos capazes de governar após as eleições, embora com um apoio reduzido."
 election.2.a: "O povo deve ser ouvido."
 election.2.b: "Proteger nossa soberania é a prioridade."
 election.3.t: "Eleição: Público Exige Rearmamento"
 election.3.d: "A guerra iminente se aproximando de nossas fronteiras tem pairado sobre as próximas eleições, com muitos eleitores preocupados que [Root.GetName] não esteja preparado para enfrentar esse conflito ou qualquer desdobramento que possa surgir dele. Eles exigem que aumentemos nossas precauções e garantamos que nossa nação esteja pronta para a guerra. Embora a maioria ainda apoie o [Root.GetRulingParty], podemos perdê-los para elementos mais radicais se não aliviarmos suas apreensões."
 election.3.a: "O povo tem o direito de se sentir seguro."
 election.3.b: "Muitos ainda apoiam soluções diplomáticas."
 election.4.t: "Eleição: Fascistas no Governo?"
 election.4.d: "Um sentimento nacionalista agressivo tem crescido em [Root.GetName], dando origem a vários partidos que promovem ideais fascistas: um estado que impõe seu poder através da força. Um desses partidos em particular conquistou favor nas eleições atuais, levando a discussões dentro do partido [Root.GetRulingParty] sobre se devemos ou não tentar cooperar com eles na formação de nosso governo. Embora eles rejeitem abertamente os ideais democráticos que são a base de nosso estado, o fato de eles optarem por participar das eleições em si confere alguma credibilidade às nossas opiniões, e reconhecer seu apoio público pode mantê-los afastados de ações violentas."
 election.4.a: "Antes eles do que os comunistas!"
 election.4.b: "Uma ampla coalizão de partidos democráticos é preferível."
 election.5.t: "Eleição: Comunistas no Governo?"
 election.5.d: "O movimento comunista em [Root.GetName], alimentado por ampla insatisfação entre a classe trabalhadora e tendências radicais entre acadêmicos, cresceu o suficiente para levar à formação de vários partidos. Após um desses partidos ter ganhado considerável apoio nas eleições atuais, os políticos do partido [Root.GetRulingParty] começaram a debater se devem ou não buscar o apoio deles na formação de um governo. Embora eles considerem nossas instituições democráticas pouco mais do que tirania burguesa, eles parecem estar ansiosos para promover as mudanças que desejam através da cooperação com o governo em vez de derrubá-lo."
 election.5.a: "Antes a reforma do que a revolução!"
 election.5.b: "Uma ampla coalizão de partidos democráticos é preferível."
 election.6.t: "Eleição: Partidos Democráticos em Minoridade"
 election.6.d: "A política em [Root.GetName] tem se radicalizado cada vez mais. Onde antes havia amplo apoio aos partidos que defendiam ideais democráticos e as instituições representativas de [Root.GetName], mais eleitores se voltaram para os extremos políticos nestas eleições. Os partidos no centro político, mesmo que escolham deixar de lado suas diferenças, já não formam mais uma maioria. Para evitar um governo fraco em minoria, não temos escolha senão cooperar com os fascistas ou comunistas."
 election.6.a: "Trabalharemos com os fascistas para fortalecer [Root.GetName]."
 election.6.b: "Unindo-se aos comunistas, podemos facilitar mudanças sociais."
 election.6.c: "Um governo minoritário, embora fraco, é preferível."
 election.7.t: "Fascistas Influenciam a Política Externa"
 election.7.d: "Aceitar os fascistas em nossa coalizão política teve um impacto em nossa política externa. Apesar de seu veemente nacionalismo, eles têm simpatizantes no exterior que aprovam a influência que eles têm em [Root.GetName]. Governos totalitários com ideologias semelhantes nos veem como potenciais aliados. Manter laços com essas nações, não importa o desgosto que [Root.GetRulingParty] possa ter por seus ideais, pode ser necessário para manter o apoio dos fascistas que apoiam nosso governo."
 election.7.a: "Podemos usar alguns aliados contra ameaças maiores."
 election.7.b: "Com amigos assim, não precisaríamos de inimigos."
 election.8.t: "Comunistas Influenciam a Política Externa"
 election.8.d: "Os comunistas frequentemente se consideram parte de uma revolução internacional, e nossa escolha de aceitá-los como parceiros em nosso governo chamou a atenção de muitos de seus aliados internacionais. Representantes de partidos comunistas mantêm laços estreitos com nações que abandonaram nossa forma de governo em favor de uma ditadura do proletariado, laços que precisamos reconhecer na política externa [Root.GetAdjective] se desejarmos manter seu apoio."
 election.8.a: "Devemos abraçar nossas causas comuns."
 election.8.b: "Por esse caminho, está a dissolução de [Root.GetName] em si."
 election.11.t: "Eleição: Maioria Fascista"
 election.11.d: "Esta eleição foi devastadora para a instituição que representa. A maioria da população [Root.GetAdjective] votou em um partido fascista que busca abolir as eleições e instaurar um governante autocrático. Embora muitos considerem pegar em armas contra essa violação dos ideais democráticos que lhes concederam esse mandato, outros consideram que o uso de violência só confirmaria ainda mais seus ideais."
 election.11.a: "É um dia negro para [Root.GetName], mas o povo falou."
 election.11.b: "Não entregaremos nossa liberdade sem lutar!"
 election.12.t: "Eleição: Maioria Comunista"
 election.12.d: "A eleição atual resultou em vitória para os partidos comunistas, com reações mistas da administração anterior. Embora os novos governantes afirmem representar o povo como um todo, eles veem muitas das instituições democráticas que valorizamos como tentativas de manipular e oprimir a classe trabalhadora, levando a discussões sobre o que realmente constitui um 'governo do povo'. Em algumas nações, a revolução começou em rios de sangue. Em [Root.GetName], não começou assim, mas pode terminar assim."
 election.12.a: "Isso é preocupante, mas eles realmente representam a maioria."
 election.12.b: "Devemos detê-los antes que eliminem todo sinal de pensamento dissidente!"
 election.13.t: "Eleição: Magnata Favorece o Fascismo"
 election.13.d: "Um industrial influente por trás de uma das empresas com as quais escolhemos trabalhar para a nossa produção industrial fez recentemente uma série de declarações políticas que membros da administração consideraram preocupantes. Ele defendeu abertamente um governo autoritário e elogiou administrações estrangeiras que se identificam como fascistas, sugerindo implicitamente que [Root.GetName] se beneficiaria de tal governança. Denunciar o magnata e seus ideais pode prejudicar nosso relacionamento com a empresa, mas deixá-lo sem controle lhe daria uma plataforma para propagar propaganda que erode tudo o que [Root.GetRulingParty] representa."
 election.13.a: "Ele pode dizer o que quiser, nós não precisamos endossar isso."
 election.13.b: "Não podemos contar com fascistas para desenvolver e proteger [Root.GetName]."
 election.14.t: "Eleição: Exceção em Tempo de Guerra"
 election.14.d: "[Root.GetName] está em estado de guerra. Normalmente, uma eleição seria realizada neste momento, mas estando no meio de um conflito importante, muitos argumentam que não podem se dar ao luxo de gastar tempo em campanhas políticas ou em uma mudança de liderança, caso isso venha a ocorrer. Enquanto isso, outros afirmam que declarar a guerra em curso como motivo válido para pular as eleições é o primeiro passo para erosionar a democracia [Root.GetAdjective]. Afinal, permitir que assuntos militares tenham precedência sobre a influência do povo poderia ser um terreno escorregadio."
 election.14.a: "As eleições serão realizadas como de costume."
 election.14.b: "Nós podemos cuidar dessas questões quando esta guerra terminar."
 election.15.t: "Eleição: Governo Contestado"
 election.15.d: "Com uma eleição iminente, as pessoas estão começando a questionar a capacidade da administração atual de prosseguir com a guerra em andamento. [Root.GetName] sofreu muito e a opinião popular se voltou contra aqueles que parecem estar conduzindo nossa nação à derrota. Enquanto nosso povo está determinado a ver a guerra até o fim, eles prefeririam ver outro governo encerrando-a."
 election.15.a: "Essa crise de confiança é altamente lamentável."
 election.15.b: "Deixe o cenário político mudar para manter o povo unido."
 election.16.t: "[Root.GetLeader] Desfruta de Apoio Público"
 election.16.d: "Com a eleição atual, a oposição, na medida em que existe, criticou o reinado cada vez mais autoritário do [Root.GetRulingParty]. Eles questionam se o eleitorado tem algum poder de fato, ou se tudo não passa de uma encenação.\n\nNo entanto, o apoio a [Root.GetLeader] parece permanecer alto, e embora as circunstâncias da eleição sejam questionadas pela comunidade internacional, ela não foi contestada internamente. Parece que mesmo que [Root.GetName] não seja mais governado pelo povo, as pessoas apoiam seu líder... pelo menos aquelas que chegaram às urnas."
 election.16.a: "Um povo, um líder."
 election.17.t: "Resultados da Eleição Questionados"
 election.17.d: "Embora o regime [Root.GetLeader] tenha silenciado a maioria de seus oponentes, alguns ainda se manifestaram sobre a eleição recente, acusando o [Root.GetRulingParty] de manipular os resultados e ignorar os esforços claros para eleger um parlamento contrário às suas políticas.\n\nO governo rejeita essas objeções como um esforço para dividir o povo contra si mesmo. No entanto, o fato permanece de que a maioria das pessoas parece ter reservas sobre o seu governo, e a oposição, embora silenciada por enquanto, deixou o seu recado."
 election.17.a: "Rachadores!"
 political.1.t: "Ascensão do Comunismo"
 political.1.d: "'Enquanto os trabalhadores se levantam contra seus opressores ao redor do mundo, aqueles que afirmam ter alcançado a consciência de classe em [Root.GetName] ficam ociosos e esperam que a mudança venha de dentro de um sistema político tão completamente corrupto, que apenas a revolução poderia nos salvar dele!'\n\nAssim falam novas vozes no movimento comunista [Root.GetAdjective]. Referindo-se ao governo [Root.GetRulingParty] como uma ditadura burguesa, eles começaram a pedir que ele seja retirado do poder por todos os meios necessários. Se esses meios virão de dentro ou de fora ainda está por ser visto."
 political.1.a: "Pode haver aqueles no próprio governo que apoiam tais ideias."
 political.1.a.tt: "Aumenta a chance de apoio interno para um golpe comunista."
 political.1.b: "Um movimento pelo povo deve buscar apoio do povo."
 political.1.b.tt: "Aumenta a chance de apoio popular para uma revolta comunista."
 political.2.t: "Simpatias Marxistas no Governo"
 political.2.d: "Embora a linha partidária do [Root.GetRulingParty] seja se opor fortemente ao socialismo revolucionário, mantendo um olhar atento sobre os elementos radicais de esquerda do país, algumas pessoas no governo estão mais abertas à possibilidade. Se nada mais, eles veem espaço para abordar as preocupações das pessoas que procuram os comunistas em busca de soluções, sem arriscar uma guerra civil em grande escala.\n\nEmbora possam ser vistos como traidores por aqueles que permanecem leais a [Root.GetLeader], essas vozes dissidentes podem ser aquelas que garantirão uma transição relativamente sem derramamento de sangue, caso a revolução aconteça."
 political.2.a: "Vamos ficar de olho neles também, por muitas razões."
 political.2.a.tt: "Se o apoio público for suficiente, um golpe pode ser executado."
 political.3.t: "Comunistas Executam Golpe"
 political.3.d: "Enquanto o movimento popular pela revolução comunista foi alto e aterrorizante, uma certa seção do movimento político permaneceu em grande parte quieta e esperando. A espera acabou agora. Hoje, assim como a liderança do [Root.GetRulingParty] e o exército estavam se preparando para uma revolta em escala nacional, um número de oficiais do governo [Root.GetAdjective] colocou rapidamente [Root.GetLeader] em prisão domiciliar e iniciou negociações com os rebeldes.\n\nMantendo uma pretensa salvaguarda da ordem, o que as negociações efetivamente resultaram foi garantir posições dentro do novo estado socialista para aqueles que escolheram cooperar. O golpe foi concluído antes que alguém pudesse agir para detê-lo, e aqueles que poderiam fazer isso agora estão presos, exilados ou executados pelo novo regime."
 political.3.a: "As marés da história varrerão o passado."
 political.4.t: "Conflitos de Classe Dividem [Root.GetName]"
 political.4.d: "O movimento revolucionário comunista, antes uma minoria popular entre acadêmicos radicais em teoria e agitadores na prática, tem visto aumento de apoio entre a classe trabalhadora [Root.GetAdjective]. O fato de ainda mais pessoas escolherem se identificar com uma 'classe' implica que as ideias marxistas estão se espalhando além daqueles que buscam ativamente derrubar o governo.\n\nOs membros do [Root.GetRulingParty] lamentam esse desenvolvimento, ansiando por uma época em que '[Root.GetAdjective]' era o que as pessoas identificavam em primeiro lugar. Suas preocupações não são infundadas. Poderia ser argumentado que uma revolução já está em andamento, ocorrendo em vários níveis da sociedade, e pode ser tarde demais para detê-la."
 political.4.a: "As pessoas podem se chamar como quiserem."
 political.5.t: "Soldados Deserção para Partidários Comunistas"
 political.5.d: "'Capitalistas e nacionalistas querem que você derrame seu sangue por eles na linha de frente, transformando irmão contra irmão em disputas que não dizem respeito ao trabalhador! Em vez de pegar em armas contra trabalhadores que lutam no exterior, levantem-nas contra os opressores e derrubem os tiranos!'\n\nO exército, normalmente um bastião de patriotismo e lealdade, tem mostrado não ser imune à propaganda comunista que se espalha rapidamente em [Root.GetName]. Soldados estão desertando, recusando-se a lutar por seu país e, em alguns casos, chegam a se juntar a movimentos partidários que afirmam estar se preparando para a revolução."
 political.5.a: "Talvez eles estejam simplesmente lutando por uma [Root.GetName] diferente."
 political.6.t: "A Revolução de [GetMonth]"
 political.6.d: "A noção de que o movimento comunista representa o povo certamente ganhou força em [Root.GetName], onde o apoio público ao partido comunista tem aumentado rapidamente nos últimos meses. Mas aqueles que clamam por revolução não são mais uma coleção dispersa de guerrilheiros e sindicatos trabalhistas descontentes. O grupo por trás do apelo à revolta está suficientemente organizado para formar um governo se tiverem sucesso.\n\nNo entanto, se a revolução começasse agora, dificilmente poderia ser executada sem lançar [Root.GetName] em uma guerra civil. Deveriam os revolucionários arriscar dividir a nação ao meio para satisfazer sua impaciência, ou esperar por uma oportunidade melhor no futuro?"
 political.6.a: "Aqueles que desejam fazer história devem agir hoje!"
 political.6.b: "A revolução é inevitável. O inevitável pode esperar."
 political.7.t: "Ascensão do Fascismo"
 political.7.d: "'O povo [Root.GetAdjective] tem sido submetido por muito tempo ao governo incompetente do [Root.GetRulingParty]! Eles afirmam representar o povo, mas nem sequer conseguem manter nossas ruas em ordem! Somente removendo-os do poder podemos fazer esta nação prosperar!'\n\nOs discursos fascistas em [Root.GetName] não escondem o que pensam sobre nossa governança atual e sistema político. Discursos como esses têm encontrado apoio em um descontentamento público que é particularmente pronunciado nas seções mais conservadoras do exército."
 political.7.a: "Os mais graduados podem nutrir simpatias não ditas."
 political.7.a.tt: "Aumenta a chance de apoio interno para um golpe fascista."
 political.7.b: "A geração mais jovem assumirá a tocha."
 political.7.b.tt: "Aumenta a chance de apoio popular para um golpe fascista."
 political.8.t: "Simpatias Fascistas no Exército"
 political.8.d: "Vários membros de alto escalão do exército [Root.GetAdjective] expressaram apoio, alguns em particular e outros abertamente, ao movimento fascista em [Root.GetName]. Eles sentem que o [Root.GetRulingParty] esqueceu a importância do uso da força militar para manter o país unido e estão cada vez mais incomodados com o exército sendo tratado pelo governo mais como uma ferramenta do que como uma das instituições mais importantes da nação. Alguns deles vão tão longe a ponto de sugerir que um novo governo é necessário, um que saiba liderar [Root.GetName] na próxima metade do século.\n\nEssa facção pode não ser predominantemente política, mas alguns deles ganharam posições no departamento de defesa. Se esses desenvolvimentos continuarem, eles podem ter apoio político suficiente para executar um golpe."
 political.8.a: "O espírito nacional está acima do governo."
 political.9.t: "Golpe de Estado Fascista"
 political.9.d: "Alguns dirão que viram isso chegando. Tanto aqueles que alertaram contra os perigos do fascismo quanto aqueles que o exaltaram como o salvador de [Root.GetName] viram suas profecias se tornarem realidade hoje, quando o exército em [Root.Capital.GetName] derrubou o governo liderado pelo [Root.GetRulingParty] e assumiu o poder. [Root.GetLeader] está desaparecido, rumores sugerem que foi para o exílio, e o golpe foi recebido com pouca resistência inicial.\n\nA nova liderança [Root.GetAdjective] não planeja permitir que a resistência cresça. A lei marcial foi declarada e, com as mudanças em andamento, o que vier a seguir dificilmente será muito diferente."
 political.9.a: "Um estado forte é necessário para proteger as pessoas de si mesmas."
 political.10.t: "Guerra Civil pelo Fascismo"
 political.10.d: "Enquanto as tentativas do movimento fascista de reviver o sentimento nacionalista têm tido algum sucesso, a resistência contra essas ideias continua alta. Os generais que conspiram para derrubar a administração atual estão desapontados com a falta de confiança que a população [Root.GetAdjective] parece ter no [Root.GetFascistParty].\n\nEles permanecem certos de que o povo eventualmente se cansará de [Root.GetLeader], mas estão divididos quanto ao curso de ação a tomar. Alguns pedem um golpe para ser executado agora, antes que os inimigos de [Root.GetName] ajam. No entanto, fazê-lo enquanto o apoio público é limitado mergulharia a nação em uma guerra civil."
 political.10.a: "A vontade de poder é insignificante se hesitarmos em agarrá-la."
 political.10.b: "Eles devem unir o povo primeiro e depois governá-los."
 political.11.t: "Divisões de Assalto Fascistas se Formam"
 political.11.d: "O político e o marcial sempre estiveram entrelaçados no fascismo. Em paralelo com o crescimento do movimento político, os partidos fascistas começaram a formar organizações paramilitares para se proteger contra ameaças internas e externas, sendo as ameaças internas seus oponentes políticos. Embora muitas pessoas achem esse desenvolvimento preocupante, a onda de furor militar levou a um aumento de voluntários se juntando às nossas forças armadas.\n\nOs líderes políticos do movimento têm destacado que seus oponentes têm razões para ter medo. Com o exército permeado em vários níveis por elementos tão explicitamente políticos, os inimigos de [Root.GetName] e os inimigos do fascismo estão começando a se parecer muito."
 political.11.a: "Apenas traidores do país têm algo a temer."
 political.12.t: "A Ameaça do Comunismo"
 political.12.d: "'[Root.GetLeader] quer fazer você acreditar que [Root.GetName] está seguro e unido. Não é surpresa que essas mentiras tenham envenenado as mentes de nosso povo, quando uma serpente está enrolada ao lado! Basta olhar para o outro lado de nossa fronteira para ver compatriotas se voltando uns contra os outros em nome do comunismo, declarando o fim das nações. Quanto tempo até que eles também declarem nossa nação morta? O [Root.GetRulingParty] nos protegerá dessa ameaça?'\n\nO crescimento do movimento fascista em [Root.GetName] tem sido fortalecido pela proximidade da revolução comunista. Muitos moderados que normalmente poderiam descartar o fascismo como outra experiência ideológica equivocada veem isso como uma preocupação muito real para eles também. Dada a escolha entre o comunismo de nossos vizinhos e um regime fascista, eles admitiriam preferir este último. Eles até poderiam apoiá-lo ativamente."
 political.12.a: "Nós seremos a vanguarda contra a ameaça vermelha!"
 political.13.t: "Avançando em Direção à Democracia"
 political.13.d: "'Se silenciarmos as vozes do povo, como podemos afirmar ser a voz de [Root.GetName]? Se tememos a dissidência, se tememos ser publicamente denunciados ou destituídos por votação pública, o que realmente tememos é ser odiados e repudiados por nossos próprios cidadãos. Será que o [Root.GetRulingParty] tem tão pouca confiança em seus princípios?'\n\nUma facção cuidadosa e pouco organizada, mas apaixonada, no governo começou a pressionar por políticas menos repressivas contra os inimigos do Estado. Eles querem que o público participe das decisões por meio de referendos e reuniões do partido local, mesmo que isso signifique arriscar o futuro da agenda atual."
 political.13.a: "Podemos discutir isso internamente para começar."
 political.13.a.tt: "Aumenta a chance de apoio interno para organizar eleições."
 political.13.b: "Sabendo que estamos certos, podemos nos permitir permitir que nossos inimigos falem mais abertamente."
 political.13.b.tt: "Aumenta a chance de as pessoas manifestarem apoio à democracia e formarem uma oposição."
 political.14.t: "[Root.GetRulingParty] Debate a Democracia"
 political.14.d: "Surpreendentemente, o apelo por mais referendos e medidas menos repressivas contra os oponentes do regime recebeu algum apoio em discussões internas do partido [Root.GetRulingParty]. Embora a liderança permaneça cética, vários membros influentes apoiaram uma mudança.\n\nTalvez eles tenham confiança de que pouco mudará na prática, ou talvez sejam secretamente traidores da causa do partido, como muitos de seus oponentes afirmam. Independentemente disso, se o apelo público por tais mudanças vier, alguns dos líderes de [Root.GetName] estão dispostos a fazer concessões."
 political.14.a: "A escolha nem sempre é entre liberdade e morte."
 political.14.a.tt: "O governo pode realizar eleições quando a política tiver apoio da maioria."
 political.15.t: "Oposição Democrática se Formando"
 political.15.d: "Relaxar as restrições sobre que tipo de propaganda anti-[Root.GetRulingParty] pode ser divulgada publicamente levou, previsivelmente, a um aumento nas expressões públicas de dissidência. Manifestações organizadas e panfletos são encontrados principalmente em instituições acadêmicas e em algumas das áreas mais desfavorecidas de [Root.GetName], mas não há dúvida de que o movimento está se espalhando.\n\nOs líderes da nação estão divididos sobre o assunto. [Root.GetLeader], que mantém um controle rigoroso sobre a liderança do partido, tem pouco desejo de diversificar o debate público. Os primeiros passos já foram dados, no entanto, e pode não haver mais volta."
 political.15.a: "O movimento parece crescer naturalmente na ausência de repressão."
 political.16.t: "Chamado Público para Eleições"
 political.16.d: "As demonstrações de dissidência pública, que antes estavam confinadas a áreas limitadas, agora estão generalizadas. Enquanto as pessoas se reúnem nas ruas, o [Root.GetRulingParty] se encontra em uma encruzilhada. Se continuarmos permitindo que essa propaganda se espalhe, os referendos sugeridos tanto de dentro do próprio partido quanto da oposição podem mostrar que não temos o apoio do público. A unidade pela qual lutamos está cedendo lugar a uma pluralidade de opiniões, unidas contra nós."
 political.16.a: "Mesmo que as reformas estejam acontecendo, devemos mostrar nossa força suprimindo essa desobediência."
 political.16.b: "Deixemos o povo ser ouvido."
 political.17.t: "Eleição Pública em [Root.GetName]"
 political.17.d: "À medida que a liberdade de expressão e de reunião foram cada vez mais aceitas em [Root.GetName], a facção dentro do [Root.GetRulingParty] que pede a realização de eleições saiu de conspiradores secretos para reformadores apoiados publicamente. Apesar dos protestos de [Root.GetLeader], o país tem caminhado lentamente, mas de forma constante, em direção à democracia nos últimos meses, e uma eleição agora parece ser o próximo passo natural.\n\nNo entanto, nem todos os cidadãos [Root.GetAdjective] são a favor de reformas democráticas. Ainda há debates dentro do partido sobre se devemos esperar para realizar a eleição até que possamos garantir um desenvolvimento estável."
 political.17.a: "Aqueles leais ao [Root.GetRulingParty] apoiarão a decisão agora."
 political.17.b: "As reformas precisam de um apoio mais amplo antes de realizarmos a eleição."
 political.18.t: "Fascistas Exigem Referendo"
 political.18.d: "O movimento fascista [Root.GetAdjective] em rápido crescimento nunca afirmou que precisa de maioria de apoio antes de assumir o poder, contando com a unificação da nação sob sua liderança assim que seu domínio for estabelecido. No entanto, parece que seu apoio público cresceu rapidamente. Muitos fascistas agora chamam [Root.GetLeader] de hipócrita, alegando representar os desejos do povo enquanto, na realidade, faz ouvidos moucos para as massas.\n\nO pedido de um referendo tem sido descartado até agora como uma tentativa típica de perturbar o sistema por membros do [Root.GetRulingParty], mas ao menos é uma medida política. Se não agirmos agora, os fascistas podem escolher a luta violenta como um caminho melhor para o poder."
 political.18.a: "Suprimam esse movimento odioso!"
 political.18.b: "Não dêem atenção a eles."
 political.18.c: "Se o povo quiser, realizaremos o referendo."
 political.19.t: "Comunistas Exigem Referendo"
 political.19.d: "As ideias marxistas enraizaram-se em [Root.GetName] há muito tempo, mas ganharam muito mais apoio recentemente. O movimento se espalhou para além da teoria política e chegou à prática política, com trabalhadores descontentes e até mesmo algumas celebridades de alto perfil manifestando apoio. Os comunistas chamam isso de consciência de classe. O [Root.GetRulingParty] chama de uma via rápida para motins e traição.\n\nMostrando pouca fé em que [Root.GetLeader] esteja disposto a implementar as reformas que eles exigem, os comunistas mais vocais pediram um referendo imediato para remover o governo atual. Embora possamos conseguir reverter o momentum desse movimento em massa, a falha em fazê-lo certamente resultará no método mais popular de remoção comunista: a revolução."
 political.19.a: "Atividades anti-[Root.GetAdjective] devem ser interrompidas!"
 political.19.b: "Ignorem-nos, eles estão apenas causando problemas."
 political.19.c: "O referendo é preferível a uma revolta sangrenta."
 political.20.t: "Democratas Exigem Referendo"
 political.20.d: "Não é surpresa que a ideia do povo governando a nação em que habitam possa facilmente se tornar muito popular entre as pessoas. O [Root.GetRulingParty], é claro, vê a ideia de democracia, representada por esses movimentos - liberdade de expressão, eleições públicas, imprensa livre - apenas como retórica populista destinada a enfraquecer o governo de [Root.GetLeader].\n\nNo entanto, não há como negar que essas ideias se enraizaram entre a população [Root.GetAdjective]. De maneira verdadeiramente democrática, eles pedem um referendo público para substituir o regime atual. Embora atualmente seja fácil ignorar essas ideias, elas têm uma maneira de se tornarem muito persistentes. O que acontecerá conosco se tornarmos a revolução pacífica impossível?"
 political.20.a: "Prendam-nos."
 political.20.b: "Prossigam como de costume."
 political.20.c: "Se aceitarmos o referendo, talvez possamos preservar nosso legado."
 political.21.t: "Fascistas Marcham sobre [Root.Capital.GetName]"
 political.21.d: "Tendo tido seu referendo negado, quase uma tentativa simbólica de assumir o poder legalmente, os fascistas usaram seu significativo apoio público e conexões no exército [Root.GetAdjective] para tentar um golpe. O governo do [Root.GetRulingParty] recusou suas condições e afirma que vai lutar até o fim para preservar [Root.GetName] como a conhecemos."
 political.21.a: "Nós os deteremos a qualquer custo!"
 political.21.b: "Os fascistas carregam o verdadeiro espírito de [Root.GetName]!"
 political.22.t: "Comunistas se Levantam"
 political.22.d: "Após o pedido de um referendo ser negado, os poucos reformadores do movimento comunista em [Root.GetName] rapidamente perderam influência para os elementos mais radicais. Com a recusa do [Root.GetRulingParty] em reconhecer o apoio público às reformas sugeridas, a visão romântica da revolução gradualmente se tornou mais disseminada, e os líderes do movimento se tornaram aqueles que poderiam iniciar facilmente uma revolta. Essas revoltas agora eclodiram em uma guerra civil em grande escala, com o futuro da nação em jogo."
 political.22.a: "Não permitiremos que eles arruínem nosso país!"
 political.22.b: "O fogo da revolução deve ser apagado com o sangue dos opressores!"
 political.23.t: "A Primavera [Root.GetAdjective]"
 political.23.d: "Após o pedido de um referendo público para instituir a democracia ser negado, as pessoas por trás da sugestão rejeitaram o regime de [Root.GetLeader] como incorrigível. Uma ampla coalizão de grupos rebeldes, unidos pelo objetivo comum de instituir sistemas políticos mais representativos em [Root.GetName], pegou em armas e anunciou que não descansarão até que o [Root.GetRulingParty] seja derrubado."
 political.23.a: "Poupe-nos dessa regra da multidão!"
 political.23.b: "Finalmente, [Root.GetName] está livre!"
 political.24.t: "Fascistas Ridicularizados"
 political.24.d: "A infatuação do povo [Root.GetAdjective] com o orgulho nacionalista e as tentativas de reviver as glórias do passado parecem ter passado. Um rude despertar para seus ardentes apoiadores, cujos uniformes, posturas militaristas e discursos exagerados agora são mais frequentemente alvo de zombaria do que de simpatia.\n\nAnteriormente considerado uma ameaça à base de poder do [Root.GetRulingParty], o fascismo [Root.GetAdjective] agora é cada vez mais visto como uma posição absurda e extremista, e um ataque aos valores mais fundamentais de nossa nação, a própria nação que eles afirmam honrar tanto. A palavra parece mais adequada como um insulto do que como uma designação política."
 political.24.a: "Que bando de palhaços."
 political.25.t: "Moda Comunista Passou"
 political.25.d: "Muitos comunistas previam que [Root.GetName] seria a próxima nação a sucumbir à chamada revolução internacional, mas após alguns meses de greves e bandeiras vermelhas nas ruas, o movimento parece ter esfriado. A classe trabalhadora, a suposta força motriz da revolução, tem preocupações mais urgentes do que derrubar [Root.GetLeader] e parece decididamente desinteressada de como essas revoluções se desenvolveram em outros lugares. Enquanto isso, os intelectuais que escreveram apelos apaixonados para degolar os opressores mostraram-se surpreendentemente relutantes em instigar qualquer coisa que possa realmente perturbar seu estilo de vida confortável.\n\nAs conversas sobre a revolução provavelmente continuarão, seja em bares baratos ou em vinhos caros, mas provavelmente ficarão apenas nas palavras."
 political.25.a: "Que bando de hipócritas."
 political.26.t: "Movimento Democrático Silencia"
 political.26.d: "Após alguns meses de forte oposição ao regime de [Root.GetLeader], pedindo eleições públicas e leis mais liberais sobre liberdade de reunião e expressão, o movimento parece ter se desintegrado. As pessoas agora expressam mais preocupação com a estabilidade de [Root.GetName] caso tais reformas aconteçam, e aqueles que clamam por democracia são vistos mais como agitadores do que qualquer outra coisa.\n\nDe forma mais misteriosa, muitas das principais figuras do movimento parecem ter desaparecido ou parado de trabalhar de repente. Talvez alguns deles tenham escolhido o exílio quando viram o fracasso de seus esforços. Independentemente disso, o governo do [Root.GetRulingParty] nega qualquer conhecimento e envolvimento."
 political.26.a: "Que bando de desistentes."
 political.27.t: "[Root.GetLeader] Abandona a Política Externa Neutra"
 political.27.d_fascism: "Após a recente ascensão ao poder do [Root.GetRulingParty], [Root.GetLeader] anunciou que [Root.GetName] não manterá mais sua Política Externa Neutra.\n'O mundo se tornou complicado e complexo. Não estamos mais seguros por conta própria. Devemos nos unir aos nossos parceiros fascistas contra nossos inimigos. Se não escolhermos um lado, pereceremos sozinhos.'"
 political.27.d_communism: "Após a recente ascensão ao poder do [Root.GetRulingParty], [Root.GetLeader] anunciou que [Root.GetName] não manterá mais sua Política Externa Neutra.\n'O mundo se tornou complicado e complexo. Este país sempre se manteve em seus princípios e esteve pronto para defendê-los. Não estamos mais seguros por conta própria. A neutralidade não é mais o refúgio seguro que costumava ser, e aqueles que buscam o poder neste mundo não a respeitam. Devemos nos unir aos nossos irmãos comunistas contra os poderes que buscam nos oprimir. Contra a maioria burguesa que não quer nada além de nos manter oprimidos. Se não tomarmos uma posição, pereceremos sozinhos.'"
 political.27.a: "Pelo futuro de [Root.GetName]"
 political.28.t: "[Root.GetNameDef] Reunido"
 political.28.d: "O fim da terrível guerra civil que devastou nossa terra está próximo, e finalmente chegamos a um acordo político. Agora vemos olho no olho com nossos companheiros [Root.GetAdjective]s e juntos reconstruiremos nossa grande nação. Os inimigos que buscaram se aproveitar de nossas divergências agora devem enfrentar um [Root.GetAdjective] unido.\n\nA nova [Root.GetRulingIdeology] [Root.GetName] nunca mais será dividida!"
 political.28.a: "Unidos, afinal!"
 THREAT_FROM_EFFECT: "Ameaça a partir das ações"
 war_justification.1.t: "[Root.GetLeader] Fala Contra [FROM.GetName]"
 war_justification.1.d: "'[FROM.GetName] pertence aos [FROM.GetAdjective]? Façamos a nós mesmos uma pergunta melhor: O futuro pertence aos [FROM.GetAdjective] ou pertence a [Root.GetNameDef]?'\n\nO discurso de [Root.GetLeader] hoje sugeriu que [Root.GetName] está no caminho para a guerra. As tensões políticas vêm aumentando no último mês e parece que o povo [Root.GetAdjective] está começando a aceitar que a guerra é inevitável."
 war_justification.1.a: "O futuro pertence a [Root.GetName]!"
 war_justification.2.t: "[Root.GetLeader] Denuncia os ideais [FROM.GetAdjective]"
 war_justification.2.d: "'Os [FROM.GetAdjective] afirmam ter liberdade e democracia, afirmam querer a paz, mas todas essas coisas de que tanto se orgulham são vazias. A democracia deles divide o povo onde deveria permanecer unido e a liberdade deles apenas trai a falta de disciplina. Nós, [Root.GetAdjective]s, enxergamos através dessas mentiras... e podemos ver que esta paz, a paz nos termos deles, também é uma mentira.'\n\n[Root.GetRulingParty] há muito zomba da fraqueza da nação [FROM.GetAdjective], mas ultimamente a retórica tem se tornado mais agressiva. O dia do conflito armado se aproxima."
 war_justification.2.a: "[Root.GetName] está unido sob o comando de [Root.GetLeader]."
 war_justification.3.t: "[Root.GetLeader] Alerta Contra o [FROM.GetAdjective] comunista"
 war_justification.3.d: "'Há uma ameaça maior ao nosso modo de vida, ou mesmo ao próprio modo de vida, do que o comunismo? Essa praga que ameaça fazer com que os escravos, e não os senhores, governem todas as nações, a abolir a própria nação, a abolir os povos e sua história. Nós tomaremos [FROM.GetName] e abolidemos a praga comunista.'\n\nO ódio de [Root.GetLeader] pelos comunistas é bem conhecido desde antes da ascensão ao poder de [Root.GetRulingParty], mas parece ter se intensificado recentemente no caso específico do governo [FROM.GetAdjective]. Nossa busca para expurgar o marxismo da face da Terra pode começar por lá."
 war_justification.3.a: "Aqueles que rejeitam as nações verão as suas próprias perecerem."
 war_justification.4.t: "[Root.GetName] se Prepara para a Grande Luta"
 war_justification.4.d: "'Os [FROM.GetAdjective] são um povo que não abrirá mão do poder facilmente. No entanto, eles também devem perceber que a trajetória de nossas duas nações só pode terminar em um conflito. Devemos nos fortalecer para a luta que está por vir. Pois [FROM.GetName] não será tomada sem luta.'\n\nA possibilidade de um entendimento entre os governos de mentalidade semelhante de [FROM.GetName] e [Root.GetName] deu lugar a uma campanha para tomar o território deles à força."
 war_justification.4.a: "A história será escrita através de nossa vitória."
 war_justification.5.t: "[Root.GetLeader] Traz Revolução para [FROM.GetName]"
 war_justification.5.d: "'Enquanto consolidamos a sociedade socialista em [Root.GetName], muitas nações ainda sofrem sob os antigos autocratas. Os trabalhadores de [FROM.GetName] não têm voz, nenhum meio de se organizar, e quaisquer tentativas de instituir o socialismo serão esmagadas selvagemente pelo regime de [FROM.GetLeader]. Não podemos esperar que as engrenagens da revolução internacional girem para o povo [FROM.GetAdjective]. Com a revolução, provamos que podíamos esmagar os opressores capitalistas aqui, e esmagaremos os opressores em [FROM.Capital.GetName] também!'\n\n[Root.GetLeader] abandonou todas as tentativas de retórica diplomática em direção a [FROM.GetName], controlada por [FROM.GetRulingParty]. A busca por erradicar todas as fronteiras está agora focada estritamente em erradicar as fronteiras deles."
 war_justification.5.a: "Trabalhadores [FROM.GetAdjective], sua libertação está próxima!"
 war_justification.6.t: "[Root.GetLeader] Convoca Ajuda aos Trabalhadores [FROM.GetAdjective]"
 war_justification.6.d: "'Há mentira maior do que a suposta liberdade do povo [FROM.GetAdjective]? Onde antes eram escravizados sob os príncipes e duques que reivindicavam a posse da terra, agora são forçados a vender seu trabalho àqueles que reivindicam a posse das fábricas. A liberdade deles de escolher um senhor em vez de outro dificilmente pode ser chamada de liberdade. Da mesma forma, a liberdade de eleger seus líderes é uma escolha falsa, pois a propaganda nunca permitiria que os verdadeiros socialistas chegassem ao poder. Um povo tão completamente doutrinado só pode ser salvo por uma intervenção [Root.GetAdjective].'\n\n[Root.GetLeader] polemizou contra o governo de [FROM.GetName] por muito tempo em reuniões do partido, mas essa retórica agora é usada com mais frequência em público. Há poucos motivos para acreditar que este conflito possa ser resolvido pacificamente."
 war_justification.6.a: "Esmagaremos sua ditadura burguesa!"
 war_justification.7.t: "[FROM.GetAdjective] Comunismo em Declínio"
 war_justification.7.d: "'Camaradas, embora os maiores revolucionários já tenham sido chamados de traidores, tornou-se evidente que a própria revolução foi traída. De que outra forma você explicaria o governo do [FROM.GetRulingParty] de [FROM.GetName], que colocou de lado cada indício de ideias marxistas para construir um estado operário degenerado onde podem reinar sob falsas premissas? Ao fortalecerem seu próprio poder ao custo da revolução internacional, eles mostraram que se importam pouco com os ideais que afirmam defender. Devemos levar a verdadeira revolução até eles.'\n\nEmbora inicialmente apoiasse a revolução [FROM.GetAdjective], [Root.GetLeader] tem expressado crescente decepção com a forma como ela se desenvolveu. O [Root.GetRulingParty] pode ter que intervir antes que seja tarde demais."
 war_justification.7.a: "Ainda há tempo para salvar sua tentativa de socialismo."
 war_justification.8.t: "[Root.GetLeader] Pede a Aniquilação do [FROM.GetAdjective] nacionalista"
 war_justification.8.d: "'Há sociedade mais repugnante para o futuro da revolução, mais alheia à situação do trabalhador, do que o regime fascista de [FROM.GetName]? Convocando o povo a se dedicar fanaticamente à instituição decrépita do Estado-Nação, eles vestiram velhas formas de barbárie com uma fantasia moderna, tentando se apresentar como um futuro alternativo à inevitável vitória internacional da classe trabalhadora. É apenas uma questão de tempo até que eles ataquem a nós ou aos nossos aliados. Vamos atacar primeiro.'\n\nNinguém esperava menos do que desprezo mútuo entre nós e os [FROM.GetAdjective], mas a animosidade se intensificou ultimamente. Agora parece que o conflito surgirá mais cedo ou mais tarde."
 war_justification.8.a: "Morte aos fascistas!"
 war_justification.9.t: "Diplomacia com [FROM.GetName] rompeu-se"
 war_justification.9.d: "'Apesar de nossas tentativas de encontrar uma solução diplomática para o nosso conflito com [FROM.GetName], as negociações mais uma vez fracassaram, deixando-nos com opções limitadas. O regime autoritário de [FROM.GetLeader] demonstrou a abordagem irracional para com este assunto que é típica de líderes que não prestam contas ao seu povo. Salvo uma reviravolta completa nas políticas da liderança [FROM.GetAdjective], não nos restará outro recurso senão lutar.'\n\nA intervenção [Root.GetAdjective] em [FROM.GetName] tem sido um assunto quente, com alguns políticos da oposição afirmando que [Root.GetRulingParty] tem perseguido uma política belicista desde o início. Independentemente de sua intenção original, uma futura guerra agora parece subitamente muito real e inevitável."
 war_justification.9.a: "Às vezes, você precisa enfrentar a montanha do conflito."
 war_justification.10.t: "[Root.GetLeader] Pede Intervenção em [FROM.GetName]"
 war_justification.10.d: "'É com o coração pesado que devemos confrontar a realidade de nossa situação: Uma invasão de [FROM.GetName] pode ser nosso único recurso. É de uma vantagem estratégica muito grande para tentarmos qualquer outra solução em nossa situação atual. Embora confiemos que nem o povo [Root.GetAdjective] nem o [FROM.GetAdjective] querem a guerra, a história nos trouxe até este ponto e nossas opções são limitadas. Só podemos esperar que, por meio desta afirmação de nosso poder militar, possamos evitar mais derramamento de sangue no futuro.'\n\nEmbora seja uma teoria popular a de que as democracias não entram em guerra contra outras democracias, desdobramentos recentes apontam para uma futura invasão [Root.GetAdjective] de [FROM.GetName]. A história ainda pode nos surpreender."
 war_justification.10.a: "[FROM.GetName] é uma democracia duvidosa de qualquer maneira."
 war_justification.11.t: "[Root.GetLeader] Fala Contra a Ameaça Vermelha"
 war_justification.11.d: "'Sem dúvida, o comunismo de [FROM.GetName] é uma das maiores ameaças à liberdade e à ordem nesta era. Implacável e cruel, ele ameaça devorar não apenas a esperança do povo [FROM.GetAdjective] em uma sociedade próspera e democrática, mas também a de seus vizinhos. Se não agirmos agora, podemos ver este primeiro dominó cair tarde demais, deixando mais experimentos sociais fracassados em seu rastro. Quantos mais precisam morrer antes que intervirmos?'\n\nA ameaça de atividade subversiva minando nossa democracia, alimentada pelas ambições de [FROM.GetAdjective], tornou-se um tópico amplamente debatido recentemente. Embora representantes da oposição tenham chamado isso de um Pânico Vermelho visando perseguir a guerra com [FROM.GetName], a retórica do [Root.GetRulingParty] tem sido altamente bem-sucedida até agora."
 war_justification.11.a: "Eles seguem uma ideologia violenta, que reação podem esperar além da violência?"
 war_justification.12.t: "[Root.GetLeader] Confronta [FROM.GetAdjective] facista"
 war_justification.12.d: "'Na história moderna, talvez até na história como um todo, não houve tirania pior do que o punho de ferro com o qual [FROM.GetRulingParty] agora mantém [FROM.GetName]. As pessoas podem argumentar que não devemos provocar conflito, que devemos confiar em [FROM.GetLeader] para honrar tratados e promessas no futuro, mas essas pessoas falham em ver que os tratados feitos sob o reinado do fascismo são inúteis. Para esses mentirosos desonrosos, a força faz o direito, e o papel em que um acordo é escrito queima tão facilmente quanto os livros de seus detratores.'\n\nPessoas que há muito esperam evitar um confronto direto com [FROM.GetName] agora foram fortemente combatidas por [Root.GetLeader], que argumenta que, em termos maquiavélicos, estamos apenas adiando a guerra para vantagem do inimigo. A este ritmo, poderemos desferir o primeiro golpe afinal."
 war_justification.12.a: "Não haverá paz em nosso tempo até que eles desapareçam."
 war_justification.13.t: "[Root.GetLeader] Convoca guerra contra [FROM.GetName]"
 war_justification.13.d: "'Embora possamos ser um povo pacífico, nossa natureza por si só não determina o rumo que devemos tomar na história. Este é um tempo de guerra. Por muito tempo, os [FROM.GetAdjective] possuíram os meios de que precisamos para superar as provações que possamos enfrentar, e é evidente que eles não abrirão mão deles pacificamente. Apesar de nossos melhores esforços para construir um Estado moderno, alguns assuntos só podem ser resolvidos por meio das antigas provações da batalha.'\n\nA retórica hostil de [Root.GetLeader] em direção a [FROM.GetName] foi longe para justificar uma invasão. Uma parte da população apoia este curso, mas a decisão está nas mãos de nosso líder."
 war_justification.13.a: "Pode ser uma decisão difícil, mas precisamos apoiá-la."
 war_justification.14.t: "[Root.GetLeader] Desafia as Pretensões [FROM.GetAdjective]"
 war_justification.14.d: "'[FROM.GetName] pode se achar mais moderna e avançada do que nós, mas a verdade é que a nação deles não foi testada como a nossa foi, nem estão preparados para as ameaças agora evidentes no horizonte. Com seu desdém por nós e por nos impedirem de tomar o que é legitimamente nosso, eles se tornaram uma dessas ameaças para si mesmos. Sua nação fraca e dividida dificilmente resistirá às nossas reivindicações.'\n\nA opinião derrogatória sobre [FROM.GetName] mantida por muito tempo pelo [Root.GetRulingParty] evoluiu de críticas para hostilidade. Embora a opinião popular seja de que o povo [FROM.GetAdjective] deseja evitar a guerra, [Root.GetLeader] afirma que seus líderes eleitos a provocaram por causa de sua arrogância."
 war_justification.14.a: "Eles não sabem o quanto nossas dificuldades nos fortaleceram."
 war_justification.15.t: "[Root.GetLeader] Quer Restaurar a Ordem em [FROM.GetName]"
 war_justification.15.d: "'O espírito nacional [Root.GetAdjective] é forte, mas nem todas as nações têm tanta sorte. [FROM.GetName] teve suas tradições destruídas e seus governantes legítimos assassinados e enterrados há muito tempo, tudo em nome da ideia da grande revolução marxista. É nosso dever restaurar a ordem neste mundo desencaminhado por usurpadores sanguinários e afirmar a força de [Root.GetName] contra esta ameaça.'\n\nEmbora o [Root.GetRulingParty] sempre tenha se oposto ao comunismo, [FROM.GetName] tem sido alvo de ataques específicos em discursos recentes. Independentemente de o ataque da nação [Root.GetAdjective] por comunistas ser ou não uma ameaça real, o ataque preventivo contra [FROM.GetAdjective] comunista já está em andamento."
 war_justification.15.a: "Aqueles assassinados na revolução serão vingados!"
 war_justification.16.t: "[Root.GetLeader] Denuncia os Opressores [FROM.GetAdjective]"
 war_justification.16.d: "'Meus opositores querem fazer você acreditar que meu governo é como o do [FROM.GetRulingParty] em [FROM.GetName]. Eles não poderiam estar mais errados. Enquanto os sucessos de [FROM.GetLeader] são o resultado de uma moda recente, um movimento de massa destrutivo decidido a intimidar outras nações para a submissão, o [Root.GetRulingParty] se opõe a esse movimento como aqueles que não se curvarão. Estou preparado para fazer o que for necessário para eliminar essa ameaça, mesmo que isso signifique guerra.'\n\nO regime de [Root.GetLeader] adotou uma política hostil em relação à nação [FROM.GetAdjective]. Independentemente de como nossos líderes possam ser chamados, fascista é uma palavra reservada para nossos inimigos."
 war_justification.16.a: "A tradição e o pragmatismo sempre triunfarão sobre o fanatismo e o terror."
 war_justification.17.t: "[Root.GetLeader] Questiona a Soberania [FROM.GetAdjective]"
 war_justification.17.d: "'Quem determina as fronteiras de uma nação e como elas são determinadas? Seja qual for a forma que as pessoas encontraram no passado para justificar onde [Root.GetName] termina e [FROM.GetName] começa, vivemos em uma nova era. A importância estratégica desta fronteira não pode ser subestimada, e estamos perfeitamente no nosso direito de deslocá-la para garantir a segurança contínua do nosso povo.'\n\nOuvindo os discursos recentes de [Root.GetLeader], uma invasão de [FROM.GetName] parece iminente. Vozes dissidentes se opuseram, mas o apoio público à guerra está em alta."
 war_justification.17.a: "Devemos nos unir a essa causa!"
 war_justification.18.t: "[Root.GetLeader] Questiona as Motivações de [FROM.GetName]"
 war_justification.18.d: "'Não há dúvida de que [FROM.GetName] está se preparando para a guerra. As mudanças na política econômica deixam claro que os [FROM.GetAdjective] não são um povo pacífico, mas sim aguardando a oportunidade certa para atacar contra nós. Ficaremos de braços cruzados observando-os se armarem enquanto [Root.GetName] permanece indefesa? Ou desarmaremos esta ameaça antes que ela cresça além do nosso poder?'\n\nOs falcões do [Root.GetRulingParty] voltaram seus olhos para [FROM.GetName], argumentando que o ataque é a melhor defesa. O ponto de vista deles está ganhando força e [Root.GetName] está se preparando para a guerra."
 war_justification.18.a: "Pelo menos através da guerra, haverá um fim para esse conflito."
 war_justification.19.t: "[Root.GetLeader] Irritado com as Provocações de [FROM.GetAdjective]"
 war_justification.19.d: "'Aqueles cidadãos ingênuos de [Root.GetName] que imaginam os [FROM.GetAdjective] como um povo pacífico estão totalmente fora de sintonia com a realidade. Aqueles que vivem em nossa fronteira não têm o luxo de tais ilusões, vendo suas tropas se aproximando de nós logo do outro lado dela. Esta é uma ameaça que não podemos deixar sem resposta. A cada dia que passa, [FROM.GetName] está se preparando para a guerra. Seria loucura não fazermos o mesmo.'\n\nA presença militar [FROM.GetAdjective] perto de nosso território gerou crescente preocupação, à medida que esta nação parece cada vez mais ser a inimiga do [Root.GetRulingParty]. Se isso é a causa ou o efeito de sua polêmica, é motivo de contestação."
 war_justification.19.a: "Independente disso, precisamos preparar o povo para a guerra."
 war_justification.20.t: "[Root.GetLeader] Defende a Invasão de [FROM.GetName]"
 war_justification.20.d: "'Se quisermos ter a vantagem estratégica previsível, para não dizer inevitável guerra com [FROM.GetName], não há espaço para hesitação. Trata-se de salvaguardar o futuro de nossos filhos e garantir que [Root.GetName] tenha um lugar no mundo amanhã. É uma questão de devoção à nossa causa e aos ideais que tomamos como certos. É hora de agir.'\n\nUma série de discursos inflamados dos líderes do [Root.GetRulingParty], mais proeminentemente de [Root.GetLeader], tem convocado o público a apoiar uma invasão de [FROM.GetName]. Os motivos geopolíticos por trás da invasão são menos proeminentes na retórica do que os sentimentos patrióticos, mas esta campanha parece altamente eficiente em convencer o público de sua necessidade."
 war_justification.20.a: "A nação apoia essa importante decisão."
 war_justification.201.t: "[FROM.GetLeader] Fala Contra [Root.GetName]"
 war_justification.201.d: "'O [Root.GetName] pertence aos [Root.GetAdjective]? Façamos a nós mesmos uma pergunta melhor: O futuro pertence aos [Root.GetAdjective] ou pertence a [FROM.GetName]?'\n\nO discurso de [FROM.GetLeader] hoje sugeriu que [FROM.GetName] está no caminho para a guerra. As tensões políticas vêm aumentando no último mês e parece que o povo [FROM.GetAdjective] aceitou que a guerra é inevitável. O [Root.GetName] também deve se preparar."
 war_justification.201.a: "Por que não podemos ser deixados em paz?"
 war_justification.202.t: "[FROM.GetLeader] Denuncia os ideais [Root.GetAdjective]"
 war_justification.202.d: "'Os [Root.GetAdjective] afirmam ter liberdade e democracia, afirmam querer a paz, mas todas essas coisas de que se orgulham são vazias. Sua democracia divide o povo onde deveria permanecer unido e sua liberdade apenas trai a falta de disciplina. Nós, [FROM.GetAdjective]s, vemos através dessas mentiras... e podemos ver que esta paz, a paz nos termos deles, também é uma mentira.'\n\nO [FROM.GetRulingParty] há muito ridiculariza a fraqueza da nação [Root.GetAdjective], mas recentemente a retórica tem se tornado mais agressiva. O dia do conflito armado se aproxima."
 war_justification.202.a: "Como esperado de escória fascista como [FROM.GetLeader]."
 war_justification.203.t: "[FROM.GetLeader] Adverte Contra [Root.GetAdjective] comunista"
 war_justification.203.d: "'Existe uma ameaça maior para o nosso modo de vida, ou mesmo para o próprio modo de vida, do que o comunismo? Essa praga que ameaça fazer com que os escravos, e não os mestres, governem cada nação, abolir a própria nação, abolir pessoas e sua história. Nós tomaremos [FROM.GetName] e aboliremos a praga comunista.'\n\nO ódio de [FROM.GetLeader] pelos comunistas é bem conhecido desde antes da ascensão do [FROM.GetRulingParty] ao poder, mas parece ter se intensificado recentemente no caso específico do governo [Root.GetAdjective]. Nossa busca para purgar o marxismo da face da Terra pode começar lá."
 war_justification.203.a: "Se eles temem nossa causa, eles temem seu próprio povo."
 war_justification.204.t: "[FROM.GetName] se Prepara para Grande Luta"
 war_justification.204.d: "'Os [Root.GetAdjective] são um povo que não se desfará facilmente do poder. No entanto, eles também devem perceber que a trajetória de nossas duas nações só pode terminar em um conflito. Devemos nos preparar para a luta que está por vir. Pois [Root.GetName] não será tomada sem uma luta.'\n\nA possibilidade de um entendimento entre os governos de mentalidade semelhante de [Root.GetName] e [FROM.GetName] deu lugar a uma campanha para tomar o território deles à força."
 war_justification.204.a: "Que venham eles!"
 war_justification.205.t: "[FROM.GetLeader] Traz a Revolução para [Root.GetName]"
 war_justification.205.d: "'Embora tenhamos consolidado a sociedade socialista em [FROM.GetName], muitas nações ainda sofrem sob os déspotas de antigamente. Os trabalhadores de [Root.GetName] não têm voz, nenhum meio de se organizar, e quaisquer tentativas de instituir o socialismo serão esmagadas selvagemente pelo regime de [Root.GetLeader]. Não podemos esperar que as engrenagens da revolução internacional girem para o povo [Root.GetAdjective]. Provamos que podíamos esmagar os opressores capitalistas aqui, e esmagaremos os opressores em [Root.Capital.GetName] também!'\n\n[FROM.GetLeader] abandonou todas as tentativas de diplomacia com o nosso governo. A tarefa comunista de erradicar todas as fronteiras agora está estritamente focada em erradicar as nossas fronteiras."
 war_justification.205.a: "[Root.GetLeader] é um governante melhor do que qualquer oportunista revolucionário!"
 war_justification.206.t: "[FROM.GetLeader] convoca ajuda aos trabalhadores [Root.GetAdjective]"
 war_justification.206.d: "'Existe mentira maior do que a suposta liberdade do povo [Root.GetAdjective]? Onde antes eram escravizados pelos príncipes e duques que reivindicavam a posse da terra, agora são forçados a vender seu trabalho àqueles que reivindicam a posse das fábricas. Sua liberdade de escolher um amo em vez de outro dificilmente pode ser chamada de liberdade. Da mesma forma, sua liberdade de eleger seus líderes é uma falsa escolha, pois a propaganda nunca permitiria que os verdadeiros socialistas chegassem ao poder. Um povo tão completamente doutrinado só pode ser salvo por uma intervenção [FROM.GetAdjective].\"\n\nInconformado em aceitar que nosso povo possa estar satisfeito sem suas experiências sociais, o regime comunista em [FROM.GetName] ameaçou abertamente atacar nossa nação. Há poucos motivos para acreditar que este conflito possa ser resolvido pacificamente."
 war_justification.206.a: "Que méritos suas convicções podem ter se eles precisam forçá-las sobre nós?"
 war_justification.207.t: "Comunismo [Root.GetAdjective] em Declínio"
 war_justification.207.d: "'Camaradas, embora os maiores revolucionários já tenham sido chamados de traidores, tornou-se evidente que a própria revolução foi traída. De que outra forma você explicaria o governo do [Root.GetRulingParty] de [Root.GetName], que descartou cada vestígio de ideias marxistas para construir um estado operário degenerado onde podem reinar sob falsas premissas? Ao fortalecerem seu próprio poder ao custo da revolução internacional, eles demonstraram que se importam pouco com os ideais que afirmam defender. Devemos levar a verdadeira revolução até eles.'\n\nEmbora inicialmente apoiasse a vitória do [Root.GetRulingParty] em [Root.Capital.GetName], [FROM.GetLeader] afastou-se da filosofia de [Root.GetLeader]. O conflito escalou a ponto de estarem se preparando para invadir e impor sua vertente de socialismo sobre nós."
 war_justification.207.a: "Eles não entendem o que a revolução significa para o povo [Root.GetAdjective]."
 war_justification.208.t: "[FROM.GetLeader] convoca para esmagar o nacionalismo [Root.GetAdjective]"
 war_justification.208.d: "\"Existe sociedade mais repugnante para o futuro da revolução, mais alheia à situação do trabalhador, do que o regime fascista de [Root.GetName]? Conclamando o povo a se dedicar fanaticamente à instituição decrépita do Estado, eles vestiram velhas formas de barbárie com uma fantasia moderna, tentando se apresentar como um futuro alternativo à inevitável vitória internacional da classe trabalhadora. É apenas uma questão de tempo até que eles ataquem a nós ou aos nossos aliados. Vamos atacar primeiro.\"\n\nNinguém esperava nada menos do que desprezo mútuo entre nós e os [Root.GetAdjective], mas a animosidade tem se intensificado ultimamente. Ao ouvir [FROM.GetLeader] falar, parece que o conflito surgirá mais cedo ou mais tarde."
 war_justification.208.a: "Morte aos comunistas!"
 war_justification.209.t: "Diplomacia com [Root.GetName] Colapsa"
 war_justification.209.d: "\"Apesar das nossas tentativas de encontrar uma solução diplomática para o nosso conflito com [Root.GetName], as negociações mais uma vez fracassaram, deixando-nos com opções limitadas. O regime autoritário de [Root.GetLeader] demonstrou a abordagem irracional para com este assunto que é típica de líderes que não prestam contas ao seu povo. Salvo uma reviravolta completa nas políticas da liderança [Root.GetAdjective], não nos restará outro recurso senão lutar.\"\n\nA intervenção [FROM.GetAdjective] em nossos assuntos internos tem sido um tópico quente, com alguns políticos da oposição alegando que o [FROM.GetRulingParty] tem seguido uma política belicista desde o início. Qualquer que tenha sido a intenção original deles, uma guerra futura agora parece de repente muito real e inevitável."
 war_justification.209.a: "Sua retórica condescendente não nos intimidará."
 war_justification.210.t: "[FROM.GetLeader] convoca intervenção em [Root.GetName]"
 war_justification.210.d: "\"É com o coração pesado que devemos encarar a realidade da nossa situação: Uma invasão de [Root.GetName] pode ser o nosso único recurso. Há uma vantagem estratégica grande demais para tentar qualquer outra solução na nossa situação atual. Embora confiemos que nem o povo [FROM.GetAdjective] nem o povo [Root.GetAdjective] desejam a guerra, a história nos conduziu a este ponto e nossas opções são limitadas. Só podemos esperar que, através desta afirmação do nosso poder militar, possamos evitar mais derramamento de sangue no futuro.\"\n\nEmbora seja uma teoria popular que as democracias não entram em guerra contra outras democracias, desdobramentos recentes apontam para uma futura invasão [FROM.GetAdjective] de [Root.GetName]. A história ainda pode nos surpreender."
 war_justification.210.a: "[FROM.GetName] é uma democracia duvidosa de qualquer maneira, perseguindo uma ação tão agressiva."
 war_justification.211.t: "[FROM.GetLeader]Fala Contra a Ameaça Vermelha"
 war_justification.211.d: "\"Sem dúvida, o comunismo de [Root.GetName] é uma das maiores ameaças à liberdade e à ordem nesta era. Implacável e cruel, ele ameaça devorar não apenas a esperança do povo [Root.GetAdjective] em uma sociedade próspera e democrática, mas também a de seus vizinhos. Se não agirmos agora, podemos muito bem ver este primeiro dominó cair tarde demais, deixando mais experiências sociais fracassadas em seu rastro. Quantos mais precisam morrer antes que intervenhamos?\"\n\nO nascente movimento operário intimidou os líderes [FROM.GetAdjective]. Embora representantes da oposição tenham chamado isso de Medo Vermelho voltado para buscar a guerra conosco, a retórica do [FROM.GetRulingParty] tem sido altamente bem-sucedida até agora."
 war_justification.211.a: "Enquanto houver lucro a ser feito, os capitalistas fabricarão uma guerra."
 war_justification.212.t: "[FROM.GetLeader] confronta o fascismo [Root.GetAdjective]"
 war_justification.212.d: "\"Na história moderna, talvez até na história como um todo, não houve pior tirania do que o punho de ferro com que o [Root.GetRulingParty] agora mantém [Root.GetName]. As pessoas podem argumentar que não devemos provocar conflitos, que devemos confiar que [Root.GetLeader] honrará tratados e promessas no futuro, mas essas pessoas não conseguem ver que os tratados feitos sob o reinado do fascismo são inúteis. Para esses mentirosos desonrados, a força faz o direito, e o papel em que um acordo está escrito queima tão facilmente quanto os livros de seus detratores.\"\n\nInvejosos da sociedade gloriosa que estamos construindo e do legado sobre o qual ela se fundamenta, os [FROM.GetAdjective] parecem preparados para iniciar uma guerra para destruí-la. Tanto faz para as pretensões deles de paz."
 war_justification.212.a: "Inevitável. Melhor que acabe logo."
 war_justification.213.t: "[FROM.GetLeader] chama para guerra contra [Root.GetName]"
 war_justification.213.d: "\"Embora possamos ser um povo pacífico, nossa natureza sozinha não determina o rumo que devemos tomar na história. Este é um tempo de guerra. Por muito tempo, os [Root.GetAdjective] possuíram os meios de que precisamos para superar as provações que possamos enfrentar, e é evidente que eles não abrirão mão deles pacificamente. Apesar dos nossos melhores esforços para construir um Estado moderno, alguns assuntos só podem ser resolvidos através das velhas provações da batalha.\"\n\nEm um discurso recente ao povo [FROM.GetAdjective], a retórica hostil em direção a [Root.GetName] se intensificou e [FROM.GetLeader] fez grandes esforços para justificar uma invasão. Uma parte da população apoia este curso, mas a decisão está nas mãos de seu líder."
 war_justification.213.a: "Eles vão se arrepender de nos tornar seu inimigo."
 war_justification.214.t: "[FROM.GetLeader] desafia as pretensões [Root.GetAdjective]"
 war_justification.214.d: "\"[Root.GetName] pode se achar mais moderna e avançada do que nós, mas a verdade é que sua nação não foi testada como a nossa foi, nem está preparada para as ameaças agora evidentes no horizonte. Com seu desdém por nós e nos impedindo de tomar o que é legitimamente nosso, eles se tornaram uma dessas ameaças para si mesmos. Sua nação fraca e dividida dificilmente resistirá às nossas reivindicações.\"\n\nA opinião derrogatória sobre [Root.GetName] mantida por muito tempo pelo [FROM.GetRulingParty] evoluiu de crítica para hostilidade. Embora a opinião popular seja de que o povo [Root.GetAdjective] quer evitar a guerra, [FROM.GetLeader] afirma que nossos líderes eleitos a provocaram através de sua arrogância."
 war_justification.214.a: "As vozes pela paz entre o povo [FROM.GetAdjective] estão, é claro, silenciadas."
 war_justification.215.t: "[FROM.GetLeader] Quer restaurar a ordem em [Root.GetName]"
 war_justification.215.d: "\"O espírito nacional [FROM.GetAdjective] é forte, mas nem todas as nações têm tanta sorte. [Root.GetName] teve suas tradições destruídas e seus governantes legítimos há muito assassinados e enterrados, tudo em nome da ideia da grande revolução marxista. É nosso dever restaurar a ordem neste mundo desencaminhado por usurpadores sanguinários e afirmar a força de [FROM.GetName] contra esta ameaça.\"\n\nEmbora o [FROM.GetRulingParty] sempre tenha se oposto ao comunismo, [Root.GetName] tem sido alvo de ataques particulares em discursos recentes. Temendo o progresso inevitável de sua nação para a próxima etapa da história, um ataque preventivo contra o comunismo [Root.GetAdjective] já está em preparação."
 war_justification.215.a: "É tarde demais para reverter o progresso que fizemos."
 war_justification.216.t: "[FROM.GetLeader] Denuncia os Opressores [Root.GetAdjective]"
 war_justification.216.d: "\"Meus opositores querem que vocês acreditem que meu governo é como o do [Root.GetRulingParty] em [Root.GetName]. Eles não poderiam estar mais errados. Enquanto os sucessos de [Root.GetLeader] são o resultado de uma moda passageira recente, um movimento de massa destrutivo empenhado em subjugar outras nações, o [FROM.GetRulingParty] opõe-se a esse movimento como aqueles que não se curvarão. Estou preparado para fazer o que for necessário para eliminar esta ameaça, mesmo que isso signifique guerra.\n\nO regime de [FROM.GetLeader] adotou uma política hostil em direção à nação [Root.GetAdjective]. Nossos planos visionários para a grandeza futura envergonharam a nação deles e, sem surpresa, eles se sentem ameaçados.\""
 war_justification.216.a: "Se eles querem testar nosso poder, irão se arrepender."
 war_justification.217.t: "[FROM.GetLeader] Questiona a Soberania [Root.GetAdjective]"
 war_justification.217.d: "\"Quem determina as fronteiras de uma nação e como elas são determinadas? Seja qual for a maneira que as pessoas possam ter encontrado no passado para justificar onde termina [FROM.GetName] e começa [Root.GetName], vivemos em uma nova era. A importância estratégica desta fronteira não pode ser subestimada, e estamos em pleno direito de alterá-la para garantir a segurança contínua do nosso povo.\"\n\nOuvindo os discursos recentes de [FROM.GetLeader], uma invasão de [Root.GetName] parece iminente. Vozes dissidentes se opuseram, mas o apoio público à guerra está em alta."
 war_justification.217.a: "O mundo não aprendeu nada com a Grande Guerra?"
 war_justification.218.t: "[FROM.GetLeader] Questiona as Motivações de [Root.GetName]"
 war_justification.218.d: "\"Não há dúvida de que [Root.GetName] está se preparando para a guerra. As mudanças na política econômica deixam claro que os [Root.GetAdjective] não são um povo pacífico, mas sim aguardando a oportunidade certa para atacar contra nós. Ficaremos de braços cruzados observando-os se armarem enquanto [FROM.GetName] está indefesa? Ou desarmaremos esta ameaça antes que ela cresça além do nosso poder?\"\n\nOs falcões no [FROM.GetRulingParty] voltaram seus olhos para [Root.GetName], argumentando que o ataque é a melhor defesa. O ponto de vista deles está ganhando força e [FROM.GetName] está se preparando para a guerra."
 war_justification.218.a: "Por isso que precisamos estar prontos."
 war_justification.219.t: "[FROM.GetLeader] Irritado com as Pretensões [Root.GetAdjective]"
 war_justification.219.d: "\"Aqueles cidadãos ingênuos de [FROM.GetName] que imaginam os [Root.GetAdjective] como um povo pacífico estão totalmente desconectados da realidade. Aqueles que vivem em nossa fronteira não têm o luxo de tais ilusões, vendo suas tropas se aproximando de nós bem do outro lado dela. Esta é uma ameaça que não podemos deixar sem resposta. A cada dia que passa, [Root.GetName] está se preparando para a guerra. Seria loucura da nossa parte não fazer o mesmo.\"\n\nNossa presença militar próxima ao território [FROM.GetAdjective] gerou maior preocupação, uma vez que eles interpretam nossos movimentos de tropas como prova de intenção hostil. Eles dificilmente parecem ter considerado que sua retórica agressiva é o motivo de nossas medidas defensivas."
 war_justification.219.a: "Mal podemos nos desarmar após essas ameaças."
 war_justification.220.t: "[FROM.GetLeader] Defende a Invasão de [Root.GetName]"
 war_justification.220.d: "\"Se quisermos ter a vantagem estratégica mais previsível, para não dizer inevitável guerra com [Root.GetName], não há espaço para hesitação. Trata-se de salvaguardar o futuro de nossos filhos e garantir que [FROM.GetName] tenha um lugar no mundo de amanhã. É uma questão de devoção à nossa causa e aos ideais que consideramos garantidos. É hora de agir.\"\n\nUma série de discursos inflamados de líderes do [FROM.GetRulingParty], com destaque para [FROM.GetLeader], tem convocado o público a apoiar uma invasão de [Root.GetName]. Os motivos geopolíticos por trás da invasão são menos proeminentes na retórica do que os sentimentos patrióticos, mas esta campanha parece altamente eficiente em convencer o público de sua necessidade."
 war_justification.220.a: "Melhor nos prepararmos. A guerra virá."
 war_justification.301.t: "[Root.GetLeader] Criticado por Política Externa Fraca"
 war_justification.301.d: "'Tivemos a chance de atacar nossos inimigos, mas o [Root.GetRulingParty] deixou essa oportunidade passar. Isso não apenas é mais um caso condenável em uma série de oportunidades perdidas para fortalecer a posição de [Root.GetName] internacionalmente, é um sinal de que a afirmação de que agem no interesse do povo [Root.GetAdjective] é principalmente retórica vazia. É hora de mudar a política.'\n\nNosso fracasso em prosseguir com a guerra, que muitos esperavam, tem sido alvo de críticas severas de nossos oponentes políticos. Não seguir adiante com nossos planos militares tornará mais difícil convencer as pessoas para qual direção estamos levando [Root.GetName]."
 war_justification.301.a: "Eles não querem evitar a guerra?"
 war_justification.301.b: "Não há espaço para discordância pública fora das reuniões do partido."
 war_justification.301.c: "Não podemos permitir que acusem [Root.GetLeader] de covardia!"
 nuke_dropped.1.t: "Bombardeio Atômico de [FROM.FROM.GetName]"
 nuke_dropped.1.d: "Pela primeira e esperançosamente última vez na história, uma bomba nuclear foi detonada em [FROM.FROM.GetName] como parte de uma guerra internacional. A destruição sem precedentes serve como testemunho do poder devastador desta nova arma, temida não apenas pelo que pode fazer aos seus alvos, mas pelas implicações que tem para aquele que a desdobra e para a própria humanidade.\n\nO mundo prende a respiração aguardando o que virá a seguir. Isso forçará [FROM.FROM.Owner.GetName] a se render para evitar mais terror, ou apenas fortalecerá sua determinação de contra-atacar aqueles que recorreriam a tais medidas?"
 nuke_dropped.1.a: "A Era Atômica realmente começou."
 nuke_dropped.1.b: "Faremos o que for necessário para proteger o povo [Root.GetAdjective]."
 nuke_dropped.2.t: "Bombardeio Atômico de Hiroshima"
 nuke_dropped.2.d: "\"As ruas eram como uma cena do inferno.\"\n - Kuniyoshi Aikawa\n\nHoje, uma bomba nuclear foi detonada sobre a cidade de Hiroshima a uma altitude de 580 metros. Mais de dois terços da cidade foram instantaneamente destruídos. Apesar de a cidade ter sido construída para resistir a terremotos, apenas algumas estruturas robustas sobreviveram à explosão.\n\nEnquanto o poder da bomba atômica tem sido exagerado na mente pública, o custo humano da arma tem sido minimizado. Nenhuma das partes quer contemplar o horror do evento, mas seu legado será de vidas perdidas num piscar de olhos e consequências duradouras."
 nuke_dropped.2.a: "Quantos mais cairão antes que essa guerra acabe?"
 nuke_dropped.2.b: "Devemos agir rapidamente para ajudar as vítimas."
 nuke_dropped.3.t: "Bombardeio Atômico de Nagasaki"
 nuke_dropped.3.d: "Uma bomba nuclear, originalmente destinada a Kokura, foi detonada hoje sobre Nagasaki. Condições climáticas forçaram os aviões a desviar sua missão, uma combinação de fumaça, nuvens e dificuldades técnicas sendo fatores decisivos em um evento que pode mudar a história.\n\nOs efeitos da bomba foram contidos em parte pela localização da cidade em um vale, mas os danos ainda são graves. Algumas instalações militares foram atingidas, mas as perdas catastróficas de civis as superam de longe. Pode levar décadas até que saibamos os efeitos a longo prazo dessa arma com certeza."
 nuke_dropped.3.a: "Isso levará à rendição do [FROM.Owner.GetAdjective]?"
 nuke_dropped.3.b: "Esperávamos que Nagasaki fosse poupada."
 nuke_dropped.4.t: "Bombardeio Atômico de Berlim"
 nuke_dropped.4.d: "Hoje, em [GetDateText], a capital alemã de Berlim foi atingida por uma explosão nuclear. A cidade sofreu vários ataques, nesta guerra e na anterior, mas tudo o mais desaparece em comparação a isso. Desde a Guerra dos Trinta Anos, Berlim não havia visto devastação comparável - considerando seu crescimento, isso era considerado impossível.\n\nO Führerbunker parece ter sobrevivido parcialmente à explosão devido à bomba ter detonado longe de seu epicentro planejado, e rumores indicam que [FROM.Owner.GetLeader] ainda está vivo, embora indignado. Como os líderes [FROM.Owner.GetAdjective] devem ser evacuados e se podem ser protegidos da radiação é outra questão, no entanto."
 nuke_dropped.4.a: "Hoje, estou aliviado por não ser berlinense."
 nuke_dropped.4.b: "Nossos inimigos atacaram o coração da nação!"
 nuke_dropped.5.t: "Bombardeio Atômico de Londres"
 nuke_dropped.5.d: "Uma explosão nuclear devastou a cidade de Londres hoje. Apesar das defesas antiaéreas da cidade, [FROM.Owner.GetName] não estava preparado para este ataque. Em [GetDateText], o Big Ben bateu pela última vez, tendo sido derretido pela explosão. Primeiros relatórios sugerem que o Palácio de Buckingham foi completamente arrasado e o paradeiro da família real é atualmente desconhecido.\n\nNo entanto, foi confirmado que [FROM.Owner.GetLeader] sobreviveu e está preparando um discurso comovente para o rádio ainda hoje. Com o moral no nível mais baixo de todos os tempos, o povo britânico está com uma necessidade desesperada disso — ou de uma rendição muito eloquente."
 nuke_dropped.5.a: "É difícil manter a compostura diante de uma onda de explosão nuclear."
 nuke_dropped.5.b: "Deus salve o Rei!"
 nuke_dropped.6.t: "Bombardeio Atômico de Kyoto"
 nuke_dropped.6.d: "A cidade de Kyoto, um proeminente centro industrial [FROM.Owner.GetAdjective], foi atingida hoje por uma bomba nuclear. Especula-se que a cidade tenha sido escolhida como alvo por ser considerada um centro intelectual.\n\nA beleza e o significado histórico de Kyoto levaram muitos a presumir que ela seria poupada da bomba, mas parece que o terror de chover destruição sobre tal lugar foi visto antes como um benefício, aumentando o impacto psicológico do ataque. A localização da cidade no vale limitou um pouco a explosão, mas o antigo Palácio Imperial e muitos edifícios industriais foram completamente destruídos."
 nuke_dropped.6.a: "Legado e beleza não significam nada em uma guerra como esta."
 nuke_dropped.6.b: "Se eles destruírem o antigo, construiremos o novo."
 nuke_dropped.7.t: "Bombardeio Atômico de Tóquio"
 nuke_dropped.7.d: "Hoje, um ataque nuclear foi direcionado ao coração do Império Japonês. A capital de Tóquio, embora esperada como alvo de bombardeios incendiários, nunca foi considerada um alvo prioritário desta nova arma. No entanto, em última análise, talvez devido à importância da nova capital e do Palácio Imperial, que agora foi destruído, um fogo ainda mais devastador caiu sobre a cidade.\n\nEmbora seja relatado que [FROM.Owner.GetLeader] tenha sobrevivo, o evento levantou questões sobre até onde os inimigos do Japão estão dispostos a ir. Se a guerra não terminar com isso, que alvos restam? O que resta para ameaçar?"
 nuke_dropped.7.a: "Isso significa o fim do Império Japonês?"
 nuke_dropped.7.b: "Enquanto [FROM.Owner.GetLeader] estiver vivo, o Império também estará."
 nuke_dropped.8.t: "Bombardeio Atômico de Washington D.C."
 nuke_dropped.8.d: "Hoje, uma bomba nuclear foi detonada sobre a capital dos Estados Unidos. Em um ataque claramente direcionado ao centro político e ao legado histórico dos EUA, a Casa Branca, o Capitólio e vários monumentos e memoriais foram varridos da face da Terra. Até mesmo o Incêndio de Washington, há mais de um século, empalidece em comparação com a destruição infligida à cidade por esta arma devastadora.\n\nEmbora o Presidente [FROM.Owner.GetLeader] tenha sido levado para um lugar seguro, a nação foi abalada em suas estruturas. Sem dúvida, os EUA esperavam ser o primeiro e único país a empunhar tal arma. Essas esperanças foram agora estilhaçadas da pior maneira possível."
 nuke_dropped.8.a: "Uma nação, indivisível, contra um átomo, divisível."
 nuke_dropped.8.b: "A águia surgirá das cinzas como uma fênix."
 nuke_dropped.9.t: "Bombardeio Atômico de Roma"
 nuke_dropped.9.d: "Uma explosão nuclear atingiu a cidade de Roma hoje, chocando pessoas ao redor do mundo. Devido a seus tesouros históricos e artísticos, muitos nunca pensaram que a antiga cidade seria alvo de uma destruição tão indiscriminada. Com a Cidade do Vaticano também parcialmente destruída e o paradeiro do Papa desconhecido, o evento horrorizou não apenas os italianos, mas também católicos em todo o mundo.\n\nO crescimento rápido de Roma na última década foi quase completamente desfeito pelo ataque. Por um tempo, parecia que a cidade poderia auxiliar a recuperação da nação após o fim da guerra. Essas esperanças agora se transformaram em pó, junto com muitas pessoas."
 nuke_dropped.9.a: "A sorte está lançada!"
 nuke_dropped.9.b: "Roma não será reconstruída em um dia..."
 nuke_dropped.10.t: "Bombardeio Atômico de Paris"
 nuke_dropped.10.d: "Hoje, um dispositivo nuclear foi detonado sobre a cidade de Paris, causando destruição generalizada e inúmeras vítimas. A França ficou chocada, pois sua capital sofreu o que pode ser o ataque mais devastador que já experimentou, apesar de séculos de guerras e revoluções. Os parisienses talvez esperassem a conquista, mas não a completa e brutal desolação.\n\nParadas de vitória na Champs-Élysées, passando pelos restos do Arco do Triunfo, parecem improváveis no estado atual da cidade. Talvez nas próximas décadas surja uma nova Paris, mas a Paris da mente pública, a cidade construída na Belle Époque, desapareceu para sempre."
 nuke_dropped.10.a: "A cidade luz se apagou."
 nuke_dropped.10.b: "Apenas ontem, parecia que sempre teríamos Paris."
 nuke_dropped.11.t: "Bombardeio Atômico de Moscou"
 nuke_dropped.11.d: "Uma cidade que muitos tentaram e falharam em conquistar, Moscou foi o alvo de um ataque nuclear hoje. A explosão foi direcionada ao coração da liderança [FROM.Owner.GetAdjective], com o Kremlin tendo sido quase completamente destruído pela detonação.\n\n[FROM.Owner.GetLeader], tendo se tornado mais consciente e temeroso de todas as ameaças possíveis e impossíveis recentemente, evacuou a tempo e sobreviveu. No entanto, nem mesmo a vastidão de [FROM.Owner.GetName] pode ser suficiente para escapar de um inimigo tão implacável. De fato, se isso continuar, a nação em breve consistirá de apenas dois tipos de terras devastadas: aquelas que já estavam lá no início, e aquelas criadas por seus inimigos."
 nuke_dropped.11.a: "Será que um inverno nuclear só tornará Moscou um alvo mais difícil?"
 nuke_dropped.11.b: "Eles podem queimar todas as cidades que temos, mas nunca as tomarão."
 nuke_dropped.12.t: "Bombardeio Atômico de Copenhague"
 nuke_dropped.12.d: "Hoje, a cidade de Copenhague foi atingida por uma explosão nuclear. Tendo crescido após escapar da destruição na Grande Guerra graças à neutralidade da Dinamarca, a capital nunca experimentou um ataque tão devastador desde as Guerras Napoleônicas. A área circundante do Øresund também foi afetada pela chuva radioativa, e os sobreviventes começaram a escapar para Fyn e o continente com medo de mais ataques.\n\nO paradeiro do Rei Christian X é atualmente desconhecido, e a moral da nação foi gravemente abalada pelo ataque. Resta saber se esse é o começo do fim de uma das nações mais antigas da Europa."
 nuke_dropped.12.a: "Algo está irradiado no estado da Dinamarca."
 nuke_dropped.12.b: "A cidade já queimou antes, mas não pereceu."
 nuke_dropped.12.c: "Com plutônio, colocamos os dinamarqueses de joelhos!"
 nuke_dropped.13.t: "Bombardeio Atômico de Estocolmo"
 nuke_dropped.13.d: "A bela cidade de Estocolmo, orgulhosa Veneza do Norte, foi atingida hoje por uma bomba nuclear. Apesar de seus melhores esforços para permanecer neutra no passado, os suecos agora pagaram o preço final pelo conflito internacional. O epicentro da explosão foi no meio de Estocolmo, uma área planejada para desenvolvimento futuro e grandes projetos de construção, agora irreversivelmente destruída.\n\nMuito da cidade está irreconhecível, mas as estruturas antigas de Slussen parecem ter sobrevivido melhor do que o esperado. Decidiu-se que elas permanecerão intocadas para sempre como um monumento à resiliência da cidade."
 nuke_dropped.13.a: "Com isso, a neutralidade sueca será apenas uma lembrança."
 nuke_dropped.13.b: "O tigre sueco não perderá suas listras!"
 country_capitulated.0.t: "[Root.GetName] capitulou"
 country_capitulated.0.d_positive_both_no_faction: "\n[FROM.FROM.GetLeader] anunciou que a covarde nação [Root.GetAdjective] não pôde mais suportar a pressão da presença esmagadora das forças [FROM.FROM.GetAdjective] em todo o país. O governo [Root.GetAdjective] optou por fugir do país e seguiu para o exílio. Suas principais forças capitularam, e [FROM.FROM.GetName] agora está no controle de sua região de origem.\nEmbora a guerra continue em outros lugares, esta é uma grande vitória para [FROM.FROM.GetName]."
 country_capitulated.0.d_positive_prev_no_faction: "\n[FROM.FROM.GetLeader] anunciou que a covarde nação [Root.GetAdjective] não conseguiu mais resistir à pressão da avassaladora presença das forças [FROM.FROM.GetAdjective] por todo o país. O governo [Root.GetAdjective] escolheu fugir do país e entrou em exílio. Suas principais forças se renderam, e [FROM.FROM.GetName] agora controla sua área de origem.\nEmbora a guerra contra o que resta da [Root.GetFactionName] continue em outros lugares, esta é uma grande vitória para [FROM.FROM.GetName]."
 country_capitulated.0.d_positive_prev_faction: "\n[FROM.FROM.GetLeader] anunciou que a covarde nação [Root.GetAdjective] não conseguiu mais resistir à pressão da avassaladora presença das forças [FROM.FROM.GetAdjective]] por todo o país. O governo [Root.GetAdjective] escolheu fugir do país e entrou em exílio. Suas principais forças se renderam, e [FROM.FROM.GetName] agora controla sua área de origem.\nEmbora a guerra contra o que resta da [Root.GetFactionName] continue em outros lugares, esta é uma grande vitória para todo o [FROM.FROM.GetFactionName]."
 country_capitulated.0.d_negative_both_no_faction: "\n[Root.GetLeader] anunciou que a nação [Root.GetAdjective] não pode mais resistir à pressão das forças [FROM.FROM.GetAdjective] que ocupam o país, cometendo atrocidades por todo o território. O governo [Root.GetAdjective] entrou em exílio. Suas principais forças se renderam, e [FROM.FROM.GetName] agora controla sua área de origem.\nApesar desta perda devastadora, a guerra contra [FROM.FROM.GetName] está longe de terminar."
 country_capitulated.0.d_negative_prev_no_faction: "\n[Root.GetLeader] anunciou que a nação [Root.GetAdjective] não pode mais resistir à pressão das forças [FROM.FROM.GetAdjective] que ocupam o país, cometendo atrocidades por todo o território. O governo [Root.GetAdjective] entrou em exílio. Suas principais forças se renderam, e [FROM.FROM.GetName] agora controla sua área de origem.\nEmbora a guerra contra [FROM.FROM.GetName] continue, este é um revés infeliz para toda a [Root.GetFactionName]."
 country_capitulated.0.d_negative_prev_faction: "\n[Root.GetLeader] anunciou que a nação [Root.GetAdjective] não pode mais resistir à pressão das forças [FROM.FROM.GetAdjective] que ocupam o país, cometendo atrocidades por todo o território. O governo [Root.GetAdjective] entrou em exílio. Suas principais forças se renderam, e [FROM.FROM.GetName] agora controla sua área de origem.\nEmbora a guerra contra [FROM.FROM.GetName] e o restante da [FROM.FROM.GetFactionName] continue, este é um revés infeliz para toda a [Root.GetFactionName]."
 country_capitulated.0.d_neutral_both_no_faction: "\nO governo [Root.GetAdjective] entrou em exílio e suas principais forças se renderam a [FROM.FROM.GetName], que agora controla sua área de origem.\n\nEmbora os confrontos entre [FROM.FROM.GetName] e [Root.GetName] tenham terminado, [FROM.FROM.GetName] ainda está em guerra total, e a luta continua em outros lugares."
 country_capitulated.0.d_neutral_prev_no_faction: "\nO governo [Root.GetAdjective] entrou em exílio e suas principais forças se renderam a [FROM.FROM.GetName], que agora controla sua área de origem.\n\nOs confrontos em [Root.GetName] foram apenas uma pequena parte do conflito. A guerra entre [FROM.FROM.GetName] e o que resta da [Root.GetFactionName] continua em outros lugares."
 country_capitulated.0.d_neutral_prev_faction: "\nO governo [Root.GetAdjective] entrou em exílio e suas principais forças se renderam a [FROM.FROM.GetName], que agora controla sua área de origem.\n\nOs confrontos entre [FROM.FROM.GetName] e [Root.GetName] foram apenas uma pequena parte do conflito. A guerra entre [FROM.FROM.GetFactionName] e o que resta da [Root.GetFactionName] continua em outros lugares."
 country_capitulated.0.a: "Ótimas notícias"
 country_capitulated.0.b: "Estes são tempos sombrios"
 country_capitulated.0.c: "Tempos incertos"
 GAME_OVER_TT: "§RA partida terminará para você.§!"
 CAN_ANGERED_WORKERS: "Isso deixará a população irritada"
 excellent: "Excelente."
 unfortunate: "Infeliz"
 news.2.t: "O Tratado de Cooperação Militar [mct_inviter.GetNameDef]-[mct_applicant.GetName]"
 news.2.d: "Hoje, [mct_inviter.GetNameDef] e [mct_applicant.GetNameDef] assinaram um tratado de cooperação militar, fortalecendo seus laços militares."
 news.2.a: "Ok"
 influence.1.t: "Oferecer ajuda econômica para [FROM.GetName]?"
 influence.1.d: "Decidimos começar a elaborar um pacote de Auxílio Econômico. Podemos decidir enviar 5%, 10% ou 15% do PIB do nosso país como auxílio. Essa generosidade melhorará as relações e nos dará influência em [FROM.GetName], embora não haja garantia de que eles usarão o auxílio econômico em algo de valor. Quanto mais doarmos, mais influência ganharemos.\n\n"
 influence.1.a: "Envie 5% do PIB como Ajuda Econômica."
 influence.1.b: "Envie 10% do PIB como Ajuda Econômica."
 News_influence.0.t: "Ajuda econômica fornecida por [FROM.GetName]!"
 News_influence.0.d: "Recebemos $$[?gift_sum] bilhão em ajuda econômica imediata de [FROM.GetName]. Isso fortaleceu as relações entre [Root.GetAdjective] e [FROM.GetAdjective], e embora o presente tenha vindo oficialmente sem condições, entende-se que fortaleceu a influência deles em nosso país."
 News_influence.0.a: "Maravilhoso"
 News_influence.0.b: "Rejeitar a ajuda."
 influence.3.t: "Visar outro influenciador em [FROM.GetName]?"
 influence.3.d: "Qual dos influenciadores de [FROM.GetNameWithFlag] devemos visar ou devemos visar a independência deles em relação ao país?\n"
 influence.3.a: "Visar a Independência Nacional de [FROM.GetNameWithFlag]."
 influence.3.b: "Visar [?var:FROM.influence_array^0.GetNameWithFlag]."
 influence.3.c: "Visar [?var:FROM.influence_array^1.GetNameWithFlag]."
 influence.3.e: "Visar [?var:FROM.influence_array^2.GetNameWithFlag]."
 influence.3.f: "Recuar."
 News_influence.1.t: "[FROM.GetNameWithFlag] ataca nossa influência em [FROM.FROM.GetNameWithFlag]!"
 News_influence.1.d: "Infelizmente, [FROM.GetLeader] de [FROM.GetName] desferiu um golpe rápido em nossas ambições em [FROM.FROM.GetName]. Nos atacando diretamente, o ataque aos nossos interesses comerciais e governamentais reduziu nossa influência em [FROM.FROM.GetNameWithFlag]."
 News_influence.1.a: "Maldito seja, [FROM.GetLeader]!"
 News_influence.2.t: "[FROM.GetNameWithFlag] ataca nossa independência de influência estrangeira!"
 News_influence.2.d: "Infelizmente, [FROM.GetLeader] de [FROM.GetName] desferiu um golpe rápido em nossas aspirações de manter a interferência estrangeira afastada e enfraqueceu nossa soberania. Nossa independência de influência estrangeira foi reduzida."
 News_influence.2.a: "Isso não é legal, [FROM.GetLeader]!"
 influence.5.t: "Lançar um Golpe em [FROM.GetNameWithFlag]?"
 influence.5.d: "Caro [Root.GetLeader], nós, nos Serviços de Inteligência [Root.GetAdjective], não podemos confirmar nem negar se [FROM.GetName] é propício a um golpe.\n\nNo entanto, fizemos, da melhor maneira possível, estimativas das possíveis consequências. Estas se baseiam em:\n- O tamanho da nossa influência\n- A popularidade da nossa perspectiva\n- A popularidade e estabilidade do governo\n- Quais outros países influentes provavelmente nos apoiarão\n- Quais países influentes provavelmente apoiarão o governo atual.\n\nSe seguirmos com os planos, tentaremos usar principalmente fontes e contatos locais, para tentar manter a negação plausível."
 influence.5.a: "Lançar um Golpe para colocar no poder o maior partido em nossa Perspectiva."
 influence_coup_largest_success_TT: "§H Golpe Bem-Sucedido§!"
 influence_coup_largest_discovered_TT: "§R Golpe Falhado§!"
 influence.5.b: "Lançar um Golpe para colocar no poder o mesmo partido governante que o nosso."
 influence.5.c: "Desistir desses planos - por enquanto."
 News_influence.3.t: "Mudança de Regime!"
 News_influence.3.d: "Forças com apoio de [FROM.GetAdjective] depositaram o governo anterior."
 News_influence.3.a: "Uau"
 News_influence.4.t: "Cenas dramáticas enquanto a mudança de regime varre [FROM.FROM.GetNameWithFlag]"
 News_influence.4.d: "Após um período com aumento da atividade de inteligência estrangeira, especialmente de [FROM.GetNameWithFlag], o governo anterior de [FROM.FROM.GetName] foi derrubado, e muitos altos funcionários do regime anterior foram detidos. [FROM.FROM.GetLeader] do [FROM.FROM.GetRulingParty] emergiu como o novo líder em meio à turbulência. Indicações iniciais apontam que o novo regime de [FROM.FROM.GetName] se identificará com a [FROM.FROM.GetRulingIdeology], alterando o equilíbrio de poder."
 News_influence.4.a: "Interessante."
 News_influence.5.t: "[FROM.GetNameWithFlag] sob pressão enquanto [FROM.FROM.GetNameWithFlag] derrota o golpe"
 News_influence.5.d: "O líder [FROM.FROM.GetAdjective] [FROM.FROM.GetLeader] gesticulava vividamente do palco enquanto \"forças hostis e malignas encabeçadas por [FROM.GetName]\" eram culpadas pelas mais recentes escaladas de hoje que viram [FROM.FROM.GetLeader] derrotar uma dramática tentativa de golpe. Embora o líder [FROM.GetAdjective] [FROM.GetLeader] tenha negado veementemente as acusações, é amplamente sabido que os dois líderes não se dão bem. Com as relações entre [FROM.GetAdjective] e [FROM.FROM.GetAdjective] em seu nível mais baixo de todos os tempos, [FROM.FROM.GetName] jurou publicamente \"erradicar a influência [FROM.GetAdjective] de [FROM.FROM.GetName]\", além de redobrar os esforços na direção [FROM.FROM.GetRulingIdeology] para a qual o governista [FROM.FROM.GetRulingParty] tem conduzido [FROM.FROM.GetNameWithFlag]."
 News_influence.5.a: "Interessante."
 News_influence.6.t: "Drama enquanto [FROM.FROM.GetNameWithFlag] colapsa em Guerra Civil!"
 News_influence.6.d: "Cenas traumáticas puderam ser vistas hoje em [FROM.FROM.GetNameWithFlag], à medida que os últimos dias de protestos, incertezas e movimentações militares estranhas deram lugar a tiros, sofrimento e civis em fuga. Embora os detalhes sejam escassos, parece que várias unidades inteiras do Exército [FROM.FROM.GetAdjective] declararam apoio à oposição armada contra [FROM.FROM.GetLeader] e o [FROM.FROM.GetRulingParty] ([FROM.FROM.GetRulingIdeology]). Um líder da oposição, falando à WNN sob condição de anonimato, disse que \"esperam ajuda significativa de [FROM.GetNameWithFlag] em sua busca para derrubar o tirano [FROM.FROM.GetAdjective] ilegítimo [FROM.FROM.GetLeader]\".\n\nEmbora a liderança [FROM.GetAdjective] tenha expressado sua \"surpresa com esses desenvolvimentos dramáticos\", isso recebe pouca credibilidade de observadores atentos das relações entre [FROM.GetAdjective] e [FROM.FROM.GetAdjective]. Um analista descreveu a situação da seguinte forma: \"Está claro que isso na realidade foi uma tentativa de golpe apoiada pelos [FROM.GetAdjective]s que não conseguiu garantir seus objetivos rápido o suficiente, resultando em um impasse tenso que degenerou no que agora parece ser uma guerra civil completa\". Vários líderes mundiais, especialmente aqueles com uma ideologia [FROM.FROM.GetRulingIdeology], usaram palavras pouco diplomáticas sobre o envolvimento [FROM.GetAdjective], ainda não confirmado.\n\nCom os dois lados diferentes no conflito representando não apenas diferenças marcantes na direção doméstica, mas também internacional, será interessante acompanhar se outros países também se envolverão no conflito."
 News_influence.6.a: "Quem governará as cinzas?"
 influence.51.t: "Ajuda Militar para [FROM.GetName]"
 influence.51.d: "Nossa nação parceira [FROM.GetName] está atualmente em conflito armado e à procura de fornecedores para abastecer seu esforço de guerra. Eles demonstraram interesse em nossas armas leves, veículos de infantaria e outros excedentes militares. Devemos decidir se vale a pena enviar o equipamento militar para eles, para que não o usem contra nós em conflitos futuros..."
 influence.51.a: "Sim, vamos fazer isso!"
 influence.51.a_tt: "Você pode decidir quais equipamentos encaminhar!"
 influence.51.b: "Pensando melhor..."
 influence.51.b_tt: "Pensando melhor. Eu preciso dessas armas!"
 influence.52.t: "A Questão do Que"
 influence.52.d: "Podemos enviar a [FROM.FROM.GetName] uma de três categorias de ajuda militar. Após escolher a categoria, selecionaremos um §Htamanho de pacote§! que determina a quantidade, o custo político e a ameaça gerada.\n\n§HInfantaria§!: armas leves, armas leves antitanque, antiaéreas.\n§HVeículos e Blindados§!: carros de combate principais, tanques anfíbios, veículos utilitários.\n§HEquipamento Moderno§!: mísseis antitanque pesados, mísseis terra-ar, drones."
 influence.52.a: "Pacote de §HEquipamento de Infantaria§!"
 influence.52.b: "Pacote de §HVeículos e Blindados§!"
 influence.52.c: "Na verdade, eu preciso destes..."
 influence.53.t: "Ajuda Militar de [FROM.GetName]"
 influence.53.d: "[FROM.GetName] nos enviou um pacote de armas. Devemos ficar com elas ou devolvê-las?"
 influence.53.a: "Aceitar o Pacote."
 influence.53.c: "Devolver o Equipamento."
 influence.54.t: "Relatório Mensal de Auto-Influência"
 influence.54.d: "[?nations_influenced|0] nações foram influenciadas com sucesso em [GetDateText]. As seguintes nações foram influenciadas por nossos esforços contínuos de influência:\n[auto_influence_target_display]"
 influence.54.a: "OK, obrigado!"
 econvent.1.t: "Banco Central do(a) [Root.GetName] adverte sobre possível bolha imobiliária"
 econvent.1.d: "Prezado [Root.GetLeader], lamentamos informá-lo que uma parte considerável de nossa equipe de especialistas (com os melhores e mais brilhantes economistas) está identificando sinais precoces de que o mercado imobiliário da(a)[Root.GetName] está superaquecido e pode estar caminhando para uma bolha prestes a estourar. Tenha em mente que prever o futuro é difícil e trabalhoso, portanto, pode ser que nossos especialistas estejam errados. \nNós, é claro, jamais sonharíamos em dar ordens a Vossa Excelência sobre o que fazer, mas fazer alguns ajustes agora será menos doloroso do que uma crise completa no futuro."
 econvent.1.a: "Vamos esfriar os mercados antes que isso se torne grave."
 econvent.1.b: "Chega de bobagens. A economia [Root.GetAdjective] está sempre saudável!"
 econvent.1.b_tt: "§HSem efeito§! por enquanto, mas uma bolha imobiliária pode ser criada no futuro\n"
 econvent.2.t: "Colapso dos preços imobiliários"
 econvent.2.d: "À medida que os preços das casas e apartamentos dispararam, especialmente no último ano, as pessoas têm assumido empréstimos cada vez maiores para comprar imóveis, enquanto os especuladores têm investido pesadamente em propriedades, também usando dinheiro emprestado. Agora, isso está chegando ao fim rapidamente. Os preços estão caindo, e as pessoas estão tentando vender como se não houvesse amanhã. Muitos menos afortunados ficarão presos em empréstimos vultuosos que não podem pagar. À medida que as pessoas estão culpando tanto [Root.GetLeader] quanto o Banco Central [Root.GetAdjective] por causar isso, devemos fazer uma declaração pública sobre como pretendemos lidar rapidamente com essa crise."
 econvent.2.a: "Vamos inundar o sistema com dinheiro barato para fazer o mercado se recuperar."
 econvent.2.b: "Isso é doloroso, mas os preços dos imóveis precisavam cair."
 econvent.3.t: "Crash do Mercado de Ações"
 econvent.3.d: "Parece que o caos após o estouro da bolha imobiliária atingiu o Mercado de Ações. Os preços das ações de quase todas as empresas listadas [Root.GetAdjective] despencaram fortemente nesta manhã, e nossa moeda também sofreu uma grande desvalorização. A negociação foi temporariamente suspensa antes do almoço, mas não se espera melhora quando os mercados reabrirem amanhã, pois todos estão desesperados para vender suas ações."
 econvent.3.a: "Ainda bem que meu dinheiro está em paraísos fiscais offshore."
 econvent.3.b: "Conceder resgates financeiros."
 econvent.4.t: "Bancos [Root.GetAdjective] enfrentam crise"
 econvent.4.d: "Apesar do delicioso e quente café com arte latte em sua xícara [Root.GetName] §R<3§!, este não é um bom dia. Magnatas financeiros desesperados, seus lobistas e os políticos que receberam suas contribuições estão todos inundando os escritórios do governo [Root.GetAdjective], e todos têm a mesma mensagem: \"Precisamos de um resgate financeiro!\".\n\nAparentemente, o duplo impacto do Declínio do Mercado Imobiliário e do Crash do Mercado de Ações foi demais para o setor financeiro suportar. O acúmulo de dívidas ruins de suas especulações é simplesmente muito grande, e precisa haver um influxo de dinheiro fresco do governo - caso contrário, haverá falências generalizadas com os poupadores inocentes perdendo seus depósitos."
 econvent.4.a: "Vamos fornecer os resgates financeiros."
 econvent.4.b: "Sem resgates financeiros, mas garantiremos os depósitos de poupança."
 econvent.4.c: "A sobrevivência do mais apto faz o capitalismo grandioso."
 econvent.5.t: "Consumidores [Root.GetAdjective] Gastam Menos"
 econvent.5.d: "Um relatório recente destacou que as pessoas trabalhadoras [Root.GetAdjective] estão cada vez mais preocupadas com o seu futuro. Este pessimismo está a fazer com que as pessoas poupem mais e o consumo global diminua. Se isso continuar, muitas empresas em [Root.GetName] terão que reduzir ou fechar. As empresas que exportam principalmente produtos [Root.GetAdjective] não são afetadas por isso."
 econvent.5.a: "Transfira algum dinheiro para compras."
 econvent.5.b: "Espero que isso melhore."
 econvent.6.t: "Menor Demanda por Produtos [Root.GetAdjective] no Exterior"
 econvent.6.d: "Os dados são claros; as exportações internacionais de [Root.GetName] estão em declínio. A causa, no entanto, está sendo acaloradamente debatida entre os conselheiros econômicos de [Root.GetLeader]. Uma teoria é que nos tornamos menos competitivos devido aos nossos salários relativamente altos, outra é que nossos concorrentes aumentaram a qualidade de seus produtos. Outros acham que a diminuição da demanda se deve apenas a mudanças de tendências no exterior. Seja qual for a causa, não há realmente muito que possamos fazer a respeito, exceto superá-la e trabalhar mais arduamente no futuro."
 econvent.6.a: "Os estrangeiros estão sendo bobos. Coisas [Root.GetAdjective] são as melhores!"
 econvent.7.t: "Seca causa desastre para os agricultores [Root.GetAdjective]"
 econvent.7.d: "Embora normalmente não recebamos muita chuva, a precipitação nesta estação de crescimento tem sido terrível, com a maioria das colheitas fracassando. O pouco produto agrícola que foi produzido é inteiramente devido a rios remanescentes e irrigação artificial, algo que infelizmente não é muito comum aqui em [Root.GetName]. Os agricultores estão exigindo ajuda do Governo de [Root.GetLeader], e os moradores das cidades estão preocupados com o aumento dos preços dos alimentos."
 econvent.7.a: "Boa sorte na próxima temporada."
 econvent.8.t: "Fome em [Root.GetName]!"
 econvent.8.d: "A seca contínua fez com que grandes partes do campo de [Root.GetName] ficassem sem comida acessível. Os estoques foram esgotados, e uma verdadeira fome está causando desnutrição, morte e doença."
 econvent.8.a: "Dor!"
 econvent.9.t: "Aumento da Confiança do Consumidor"
 econvent.9.d: "As condições recentes dentro da economia [ROOT.GetAdjective] mostraram que os consumidores dentro do nosso país agora têm as condições de mercado perfeitas para gastar dinheiro e fazer investimentos no futuro do país. As pessoas estão comprando bens de consumo como se não houvesse amanhã!"
 econvent.9.a: "Notícia maravilhosa!"
 econvent.10.t: "Boom no Mercado de Ações"
 econvent.10.d: "O mercado de ações do(a) [ROOT.GetName] está em alta. As pessoas estão negociando ações como se estivessem fazendo compras de alimentos.\n"
 econvent.10.a: "Mantenha o boom!"
 econvent.10.a_tt: "Injetar liquidez adicional no mercado pode ser devastador caso ocorra um colapso.\n"
 econvent.10.b: "Ótimo"
 econvent.10.b_tt: "O mercado continuará normalmente sem intervenção. Ainda há uma chance moderada de um colapso.\n"
 econvent.10.c: "Desacelere a economia."
 econvent.10.c_tt: "A economia aqueceu muito rapidamente. Vamos começar a desacelerar o ritmo apertando o fluxo de capital.\n"
 econvent.11.t: "Importante Instituição Financeira Faliu!"
 econvent.11.d: "As manchetes anunciam a falência de uma importante instituição financeira. A mídia está em polvorosa e o pânico toma conta. O governo está sendo implorado por uma resposta, pois teme-se uma crise maior no horizonte. O que devemos fazer?"
 econvent.11.a: "É grande demais para falir..."
 econvent.11.b: "É apenas bom negócio..."
 econvent.12.t: "Ondas da Crise Financeira de [FROM.GetName]"
 econvent.12.d: "A recente crise em [FROM.GetName] causou muitos problemas em nossa nação, pois os efeitos de sua crise são sentidos aqui. Nossas economias interconectadas agora estão sofrendo com o peso dessa crise."
 econvent.12.a: "Conceder fundos de auxílio."
 econvent.12.b: "O mercado acima de tudo."
 econvent.13.t: "Dívida Elevada Faz Empresas Sairem"
 econvent.13.d: "A alta relação entre dívida e PIB do nosso país está levando empresas a fecharem e saírem do país. Reduzir nossa dívida é imperativo, caso contrário, podemos ver mais indústrias decidindo partir."
 econvent.13.a: "Permitir que a Empresa Saia"
 econvent.13.b: "Comprar a Empresa"
 econvent.14.t: "Investidores Privados Investem na Indústria Civil"
 econvent.14.d: "Os investidores privados decidiram investir em uma nova indústria civil no país."
 econvent.14.a: "Incrível!"
 econvent.15.t: "Investidores Privados Investem em Parques de Escritórios"
 econvent.15.d: "Os investidores privados decidiram investir em novos parques de escritórios no país."
 econvent.15.a: "Incrível!"
 sco.1.t: "[FROM.GetName] apresentou um pedido para status de observador na SCO"
 sco.1.d: "Um novo estado deseja observar as atividades da SCO e talvez se tornar um membro pleno da organização!"
 sco.1.a: "Não vemos razão para não conceder o pedido deles."
 sco.1.b: "Não podemos conceder esse status a eles!"
 sco.2.t: "[FROM.GetName] apresentou um pedido para status de membro na SCO"
 sco.2.d: "Um novo estado deseja se tornar um membro pleno da organização!"
 sco.2.a: "Não vemos razão para não conceder o pedido deles."
 sco.2.b: "Não podemos conceder esse status a eles!"
 sco.3.t: "[FROM.GetName] está oferecendo conduzir exercícios militares conjuntos conosco"
 sco.3.d: "Este estado membro da SCO está propondo exercícios conjuntos para fortalecer a cooperação militar e aumentar a confiança entre nossos dois países."
 sco.3.a: "Esta é uma oportunidade bem-vinda para nossas tropas ganharem experiência!"
 sco.3.b: "A cooperação com [FROM.GetName] é impossível."
 sco.4.t: "[FROM.GetName] aceitou nossa oferta!"
 sco.4.d: "Os delegados [FROM.GetAdjective] receberam calorosamente nossa proposta e estão se preparando para nossos exercícios conjuntos."
 sco.4.a: "Que comecem os jogos!"
 sco.5.t: "[FROM.GetName] recusou nossa oferta!"
 sco.5.d: "Os delegados [FROM.GetAdjective] recusaram realizar exercícios militares altamente proveitosos conosco."
 sco.5.a: "É uma perda para eles..."
 sco.6.t: "SCO realiza exercícios militares em grande escala"
 sco.6.d: "[FROM.GetAdjective] tropas se juntaram a milhares de outras hoje no que está sendo descrito como um exercício antiterrorismo sob os auspícios da Organização de Cooperação de Xangai (SCO). Enquanto muitos saudaram esses exercícios como um sintoma de cooperação internacional bem-sucedida, outros reagiram com muito menos entusiasmo a esse último desenvolvimento. Analistas americanos e europeus citaram a implantação de aeronaves de longo alcance e poder de fogo substancial como evidência de que esses exercícios não são feitos como prática para operações antiterrorismo, mas como um ensaio geral bem armado para o confronto com o Ocidente."
 sco.6.a: "Esses exercícios ameaçadores são para nosso benefício?"
 sco.6.b: "Apenas os terroristas têm algo a temer disso!"
 sco.6.c: "Um desenvolvimento interessante."
 sco.7.t: "[FROM.GetName] adquire o status de membro da SCO"
 sco.7.d: "Após um processo gradual de integração, [FROM.GetLeader] anunciou hoje a filiação de seu país à Organização de Cooperação de Xangai. Observadores esperançosos retrataram esse desenvolvimento como uma progressão adicional da cooperação econômica e política regional no continente eurasiano, enquanto analistas mais pessimistas lamentaram a crescente influência da China e a ameaça que isso representa para a ordem mundial existente."
 sco.7.a: "A ameaça chinesa continua crescendo..."
 sco.7.b: "Um bom dia para a diplomacia!"
 sco.8.t: "[FROM.GetName] deixa a SCO"
 sco.8.d: "Após a reavaliação das ações chinesas pelo atual governo [FROM.GetAdjective], [FROM.GetLeader] retirou [FROM.GetNameDef] da Organização de Cooperação de Xangai. [CHI.GetLeader] ainda não comentou o desenvolvimento, mas as organizações de mídia ligadas ao governo chinês foram rápidas em lamentar como essa saída representa um passo para trás em termos de integração regional."
 sco.8.a: "A agressão chinesa alienou esta nação."
 sco.8.b: "Um dia triste para a cooperação internacional..."
 sco.9.t: "China assume as rédeas do poder sobre a SCO em relação à Rússia"
 sco.9.d: "Historicamente, a Organização de Cooperação de Xangai era administrada como um esforço conjunto sino-russo. No entanto, o descontentamento chinês com esse arranjo supostamente levou a Rússia a ser forçada a ocupar uma posição mais subordinada dentro da organização. Enquanto tanto [CHI.GetLeader] quanto [SOV.GetLeader] permanecem em silêncio sobre essa luta pelo poder, autoridades russas estão supostamente furiosas com os chineses e amargas sobre a humilhação do gigante eslavo que ocorreu à vista dos demais estados membros da SCO. As ramificações geopolíticas dessa movimentação em termos de hegemonia sobre a Ásia Central provavelmente serão substanciais."
 sco.9.a: "A China não está disposta a compartilhar o holofote..."
 sco.10.t: "A China está exigindo que escolhamos um lado"
 sco.10.d: "Nossa contínua adesão tanto à CSTO quanto à Organização de Cooperação de Xangai nos colocou em uma posição difícil após a divisão sino-russa. A China está exigindo que escolhamos entre deixar a SCO e permanecer na aliança russa ou permanecer na SCO e abandonar os russos. A escolha que fizermos provavelmente terá um papel significativo no confronto entre os dois gigantes regionais que em breve ocorrerá."
 sco.10.a: "Somos leais acima de tudo!"
 sco.10.b: "Hora de abandonar este navio afundando..."
 sco.11.t: "[FROM.GetName] está nos fornecendo assistência para o desenvolvimento!"
 sco.11.d: "Sob os auspícios da Organização de Cooperação de Xangai, o governo [FROM.GetAdjective] está fornecendo às nossas empresas locais fundos e recursos muito necessários para ajudar a facilitar seus projetos de desenvolvimento. Embora essa assistência seja uma boa notícia para nossa economia, ela aumentará o grau de influência que [FROM.GetNameDef] exerce sobre nosso país."
 sco.11.a: "Somos gratos pela ajuda!"
 sco.12.t: "[FROM.GetName] formou o $SHANGHAI_PACT$!"
 sco.12.d: "[FROM.GetName] formou $SHANGHAI_PACT$ para rivalizar com [USA.GetFactionName]. Nós permitimos que eles tivessem uma grande [FROM.GetAdjective] influência sobre nós, nós também somos um membro da SCO, então somos forçados a ser um membro da nova facção."
 sco.12.a: "Ok"
 taiwan.1.t: "Mão dada na manifestação 228"
 taiwan.1.d: "Uma demonstração de solidariedade. Uma corrente humana foi formada com cerca de dois milhões de pessoas, cobrindo uma distância de 500 km. Começando no porto de Keelung, a cidade mais ao norte de Taiwan, a corrente seguiu até a ponta sul da ilha. O propósito foi duplo: os taiwaneses desejavam a paz, mas também protestavam contra o posicionamento de mísseis pela República Popular da China voltados para Taiwan, seu vizinho na ilha. Alguns dos simbolismos da manifestação, particularmente no momento em que os participantes \"se afastam da China\", claramente apoiaram a independência de Taiwan e, portanto, não contaram com a presença de membros da Coligação Pan-Azul, que responderam com uma manifestação em toda a ilha alguns dias depois."
 taiwan.1.a: "Nunca devemos esquecer as vítimas."
 taiwan.2.t: "Tufão Bilis"
 taiwan.2.d: "Em preparação para o Bilis, escritórios foram fechados em toda a ilha. Além do fechamento de empresas, voos de e para a ilha foram reprogramados e um centro de auxílio ao tufão foi estabelecido. Devido à ameaça de deslizamentos de terra, um alerta de deslizamento foi emitido para Taiwan. Embora a tempestade ainda não tivesse atingido a terra, uma pessoa foi morta em Taipei em 22 de agosto após ser soterrada por um deslizamento de terra causado pelo tufão iminente; isso representou a primeira fatalidade causada pelo Bilis. Juntamente com o reagendamento de voos, vários aeroportos foram fechados e a Bolsa de Valores de Taiwan ficou fechada em 23 de agosto. Enquanto isso, hospitais estenderam os horários de atendimento em antecipação à admissão de pacientes. Os membros da guarda costeira de Taiwan regularam a atividade pesqueira devido à ameaça de ondas mortais. O Porto de Kaohsiung permaneceu fechado durante toda a duração da tempestade. Devido à maior demanda por vegetais antes da tempestade, o custo desses alimentos aumentou de 20 a 30 por cento.\n\nO Bilis foi um ciclone tropical altamente destrutivo para Taiwan. Os danos nas indústrias agrícola, pesqueira e florestal da ilha totalizaram US$ 133,5 milhões. O tufão causou 14 mortes e feriu mais 80 pessoas. Apagões afetaram negativamente aproximadamente 600.000 residências e 400 casas em toda Taiwan foram destruídas. Centenas de milhares de famílias experimentaram escassez de água após a tempestade. Em Cheng-Kung, uma estação meteorológica registrou uma rajada de vento de 281 km/h, que quebrou o anemômetro da estação. Um único deslizamento de terra na cidade de Jenai soterrou nove agricultores. Dezenas de milhares de pessoas foram deslocadas durante a tempestade e se mudaram para abrigos de evacuação montados pelo governo. No leste do condado de Hualien, 250 casas sucumbiram aos ventos fortes. Os ventos também derrubaram árvores e levaram veículos leves, bloqueando estradas. As fortes chuvas associadas ao Bilis inundaram aproximadamente 40.000 ha de pomares e arrozais. Após a passagem do Bilis por Taiwan, ocorreu um terremoto de magnitude 5,7 na ilha, agravando ainda mais as condições já pioradas."
 taiwan.2.a: "Hora de reconstruir."
 taiwan.3.t: "Eleição presidencial de Taiwan"
 taiwan.3.d: "Esta é a segunda eleição presidencial direta da República da China, para eleger o Presidente e Vice-Presidente da 10ª legislatura da República da China, conforme a Constituição de 1947. Isso tem o potencial de encerrar mais de meio século de domínio do Kuomintang (KMT) em Taiwan, desde que os eleitores do KMT se dividiram em dois grupos.\n\nEmbora mais popular e consistentemente melhor colocado nas pesquisas, o ex-governador de Taiwan, James Soong, não conseguiu obter a indicação do Kuomintang. Como resultado, ele anunciou sua candidatura como candidato independente. O Kuomintang respondeu expulsando Soong e 21 de seus aliados. Eles processaram Soong por roubo, alegando que, como Secretário-Geral do partido, ele roubou milhões de dólares taiwaneses em dinheiro destinado à família do falecido Presidente Chiang Ching-kuo e escondeu o dinheiro no Chunghsing Bills Finance Co. Soong se defendeu, afirmando que estava agindo sob a direção de Lee, mas sua história foi amplamente considerada pouco convincente. Inicialmente, comandando uma vantagem sólida nas pesquisas, Soong perdeu por pouco mais de 300.000 votos, e o escândalo financeiro que manchou sua imagem como político honesto provavelmente levou ao seu fracasso.\n\nO Partido Progressista Democrático apresentou o ex-prefeito de Taipei, Chen Shui-bian, como candidato a presidente. Depois de concorrer à eleição de 1996 em uma plataforma de independência radical e perder por uma larga margem, o DPP moderou sua posição em maio de 1999, emitindo a \"Resolução sobre o Futuro de Taiwan\". A resolução aceitava o status quo e defendia a visão moderada de que Taiwan já era independente, então qualquer declaração formal não seria urgentemente necessária, se fosse necessária. Também estava incluído o compromisso de que qualquer mudança no status internacional de Taiwan seria feita por meio de referendo, aliviando o medo de que um governo do DPP, se eleito, declarasse unilateralmente a independência sem aprovação popular. A chapa Chen-Lu também promete ser mais agressiva na luta contra a corrupção, fornecer mais financiamento para serviços sociais e ser mais favorável ao meio ambiente, incluindo a oposição à energia nuclear."
 taiwan.3.a: "Chen Shui-bian (DPP)"
 taiwan.3.b: "Lien Chan (KMT)"
 taiwan.3.c: "James Soong (Independente)"
 taiwan.4.t: "Estabelecimento da Administração da Guarda Costeira"
 taiwan.4.d: "A CGA combina o Comando da Guarda Costeira, a Divisão de Polícia Marítima e vários cortadores da Direção Geral de Alfândega de Taiwan, do Ministério das Finanças. A CGA unifica formalmente as agências de aplicação da lei costeira e marítima. Ela verá muita ação como uma agência jovem, participando de várias operações de busca e resgate e de combate ao contrabando no futuro próximo.\n\nA Administração da Guarda Costeira do Conselho de Assuntos Oceânicos (CGA) é responsável por manter a lei e a ordem, proteger os recursos das águas territoriais da ROC, que cercam Taiwan, Penghu, Kinmen, Ilhas Matsu, Ilha Verde, Ilha Orquídea, Ilhas Dongsha e Ilhas Nansha, bem como fornecer a primeira linha de defesa ao longo das áreas costeiras contra contrabandistas e imigrantes ilegais. A CGA é considerada uma agência civil de aplicação da lei sob a administração do Conselho de Assuntos Oceânicos do Yuan Executivo, embora durante emergências ela possa ser incorporada como parte das Forças Armadas da República da China.\n\nA Administração da Guarda Costeira é liderada por um ministro e três vice-ministros. A CGA inclui oito departamentos, um escritório e cinco forças-tarefa, bem como uma Diretoria-Geral de Patrulha Marítima e uma Diretoria-Geral de Patrulha Costeira. Sua jurisdição abrange as águas que cercam Kinmen, Matsu, Penghu e a principal ilha de Taiwan, para garantir a proteção adequada dos 1.819,8 quilômetros de costa e 540.000 quilômetros quadrados do \"Território Azul\", que é 15 vezes maior que a ilha de Taiwan."
 taiwan.4.a: "Por uma costa segura."
 taiwan.5.t: "Universidade Nacional de Kaohsiung é inaugurada"
 taiwan.5.d: "A universidade tem como objetivo reduzir a lacuna na educação entre o sul e o norte de Taiwan e promover a economia da região sul.\n\nExistem vinte departamentos na universidade, incluindo Línguas e Literatura Ocidentais, Língua e Literatura do Leste Asiático, Arquitetura, Design Criativo, Cinesiologia, Estudos de Saúde e Lazer, Direito, Governo e Lei, Direito Econômico e Financeiro, Economia Aplicada, Matemática Aplicada, Química Aplicada, Engenharia Elétrica, Engenharia Civil e Ambiental, Ciências da Vida e Gestão Industrial e de Negócios na Ásia-Pacífico, Artes Tradicionais, Finanças, Gestão de Informações e Física Aplicada. Entre esses departamentos, a Gestão Industrial e de Negócios na Ásia-Pacífico é especialmente projetada para formar elites industriais.\n\nUma característica incomum desta escola é seu espaço aberto. Não há muros nas fronteiras do campus. Os moradores que vivem ao redor dessa escola podem caminhar até o campus ou se exercitar usando os equipamentos da academia. A biodiversidade também é uma característica notável da NUK. Existem mais de 60 tipos de peixes no lago do Parque Water Land."
 taiwan.5.a: "Isso ajudará o sul."
 taiwan.13.t: "O Golpe em Taiwan foi Bem-Sucedido"
 taiwan.13.d: "Após a tentativa fracassada de [TAI.GetLeader] de angariar apoio contra o golpe, oficiais militares leais à facção pró-chinesa em Taiwan tomaram o controle do país. Embora os oficiais tenham prometido um eventual retorno à democracia, a autonomia política de Taiwan em relação ao continente está indubitavelmente em perigo. Com o apoio não declarado, mas amplamente conhecido da China ao golpe, a probabilidade de uma Resolução do Conselho de Segurança em resposta a esse evento é altamente improvável."
 taiwan.13.a: "Aceite suas demandas"
 taiwan.13.b: "Nunca recuamos"
 taiwan.14.t: "Greve fracassada"
 taiwan.14.d: "Depois de negarmos as suas exigências, a greve acabou rapidamente. Todo mundo está voltando ao trabalho agora."
 taiwan.14.a: "Eles nunca tiveram chance"
 taiwan.15.t: "A greve continua"
 taiwan.15.d: "Depois de negarmos as suas exigências, a greve ficou ainda mais intensa. Não parece que a greve acabará em breve."
 taiwan.15.a: "Pelo menos tentamos"
 taiwan.16.t: "Tanque caiu da ponte"
 taiwan.16.d: "Um tanque do exército, modelo CM-11, caiu em um córrego no Condado de Pingtung, voltando para a base após um exercício de treinamento ontem de manhã, matando três dos cinco soldados a bordo. O motorista sofreu apenas ferimentos leves e conseguiu sair do tanque. Os outros quatro, que estavam dentro da torre de armamento, não conseguiram escapar pelas escotilhas da torre porque o tanque estava de cabeça para baixo."
 taiwan.16.a: "Investigar como isso pôde acontecer"
 hongkong.1.t: "Os Chineses se Recusam a Reverter a Anexação!"
 hongkong.1.d: "A China rejeitou nossas ameaças, não nos deixando escolha senão seguir em frente."
 hongkong.1.a: "Eles parecem não nos temer mais."
 hongkong.2.t: "China Desloca Tropas para Hong Kong"
 hongkong.2.d: "Após protestos na Região Administrativa Especial de Hong Kong, a China ordenou que várias unidades do Exército de Libertação Popular fossem às ruas de Hong Kong para \"restaurar a lei e a ordem\". [CHI.GetLeader] garantiu aos \"manifestantes pacíficos\" que eles não serão alvos e que todos os que forem presos serão tratados de acordo com a lei internacional de direitos humanos. No entanto, muitos em Hong Kong e no exterior expressaram ceticismo quanto à extensão em que as tropas chinesas exercerão contenção em relação aos manifestantes."
 hongkong.2.a: "Esta ação é repugnante!"
 hongkong.2.b: "A China fez o que precisava ser feito."
 hongkong.2.c: "Isso não é da nossa conta."
 hongkong.5.t: "O Reino Unido está ameaçando com ação militar!"
 hongkong.5.d: "Os britânicos reagiram de forma mais beligerante do que esperávamos à nossa anexação de seu antigo território colonial. Devemos considerar se devemos ceder às suas demandas."
 hongkong.5.a: "Essa não é a colina em que queremos morrer."
 hongkong.5.b: "Deixem-nos vir."
 hongkong.6.t: "O Reino Unido está ameaçando com medidas econômicas contra nós!"
 hongkong.6.d: "Os britânicos decidiram ameaçar sanções contra nós se não revertermos nossa anexação de seu antigo território colonial. Devemos considerar se devemos ou não atender às suas demandas."
 hongkong.6.a: "Devemos evitar confronto."
 hongkong.6.b: "Suas ameaças não significam nada!"
 hongkong.7.t: "Os chineses concordaram em reverter a anexação"
 hongkong.7.d: "Claramente impressionados com o poder britânico, os chineses recuaram na questão de Hong Kong."
 hongkong.7.a: "Nossas ameaças ainda têm efeito!"
 hongkong_news.1.t: "Hong Kong Abalada por Protestos Generalizados"
 hongkong_news.1.d: "Após a decisão da China de descartar a possibilidade de Hong Kong eleger seu chefe executivo por sufrágio universal, protestos em massa eclodiram no território chinês. [HKG.GetLeader] declarou que, embora o governo de Hong Kong respeite o direito do povo de Hong Kong de expressar suas opiniões de forma pacífica e legal, a violência e a ilegalidade não serão toleradas. A resposta da China à crise atual ainda está para ser vista, já que [CHI.GetLeader] não comentou sobre os eventos recentes."
 hongkong_news.1.d_limit: "Após a decisão da China de que o Chefe do Executivo de Hong Kong só poderia ser eleito por sufrágio universal se pré-aprovasse os candidatos, protestos em massa eclodiram no território chinês. [HKG.GetLeader] declarou que, embora o governo de Hong Kong respeite o direito do povo de Hong Kong de expressar suas opiniões de forma pacífica e legal, a violência e a ilegalidade não serão toleradas. A resposta da China à crise atual ainda está para ser vista, já que [CHI.GetLeader] não comentou sobre os eventos recentes."
 hongkong_news.1.d_reunification: "Após o anúncio da China de que em 2047 Hong Kong perderá seu status especial e retornará completamente ao controle chinês, protestos em massa eclodiram no território chinês. [HKG.GetLeader] declarou que, embora o governo de Hong Kong respeite o direito do povo de Hong Kong de expressar suas opiniões de forma pacífica e legal, a violência e a ilegalidade não serão toleradas. A resposta da China à crise atual ainda está para ser vista, já que [CHI.GetLeader] não comentou sobre os eventos recentes."
 hongkong_news.1.d_annexed: "Após a anexação altamente controversa de Hong Kong pela China, protestos em massa eclodiram no território chinês. [HKG.GetLeader] declarou que, embora o governo de Hong Kong respeite o direito do povo de Hong Kong de expressar suas opiniões de forma pacífica e legal, a violência e a ilegalidade não serão toleradas. A resposta da China à crise atual ainda está para ser vista, já que [CHI.GetLeader] não comentou sobre os eventos recentes."
 hongkong_news.1.a: "Um desenvolvimento interessante."
 hongkong_news.1.b: "Isso é uma má notícia para nós."
 hongkong_news.2.t: "Protestos em Hong Kong Perdem Força"
 hongkong_news.2.d: "Os protestos na Região Administrativa Especial de Hong Kong contra as recentes ações chinesas diminuíram gradualmente nos últimos dias e praticamente cessaram. As operações policiais no território chinês não encontraram resistência, e muitos que antes ocupavam as ruas retornaram às suas casas. O que isso significa para a relação entre a China e um território problemático que mantém valores políticos significativamente diferentes permanece a ser visto. Talvez um indicativo do que está por vir foi uma faixa deixada por manifestantes em um local proeminente no centro da cidade que dizia 'Voltaremos'."
 hongkong_news.2.a: "Um desenvolvimento interessante."
 hongkong_news.2.b: "Eles sabem que sua causa é fútil."
 hongkong_news.3.t: "Protestos em Hong Kong Aumentam em Escala"
 hongkong_news.3.d: "Os protestos contra as ações chinesas no território de Hong Kong aumentaram rapidamente, com analistas concordando amplamente que os protestos entraram em um novo estágio em termos de escala e táticas. Como os governos chinês e de Hong Kong responderão a essa nova escalada ainda está para ser visto, mas autoridades em ambos os governos estão cada vez mais ressentidas com os impactos dos protestos em seus interesses adquiridos. Os manifestantes, por sua vez, estão se recusando a recuar até que os governos chinês e de Hong Kong atendam às suas demandas."
 hongkong_news.3.a: "O povo de Hong Kong não ficará em silêncio..."
 hongkong_news.3.b: "Eles ficarão em casa se souberem o que é bom para eles!"
 korea.4.t: "A Separação entre China e Coreia do Norte"
 korea.4.d: "As críticas ao regime de [NKO.GetLeader] nos meios de comunicação ligados ao governo chinês aumentaram drasticamente nas últimas semanas. Essas críticas atacaram o problema nuclear contínuo da Coreia do Norte e a falha do estado norte-coreano em melhorar a qualidade de vida de seus cidadãos por meio da liberalização econômica, assim como a China fez nas últimas décadas. Embora [CHI.GetLeader] tenha permanecido em silêncio sobre o assunto, acredita-se amplamente que essas organizações de mídia não teriam lançado tal crítica contundente a um aliado próximo sem a aprovação tácita de [CHI.GetLeader]. Muitos observadores veem isso como uma culminação da frustração chinesa com a dinastia Kim e possivelmente um desejo de estabelecer um governo alternativo mais estável e obediente aos desejos da China."
 korea.4.a: "Apenas [CHI.GetLeader] sabe para onde isso está indo..."
 korea.5.t: "As Negociações Iniciam"
 korea.5.d: "A principal demanda do Norte é que cessemos nossos exercícios militares conjuntos com os Estados Unidos, exercícios que eles veem como preparativos para uma invasão de seu território. No entanto, nossos militares veem esses exercícios como preparações necessárias em caso de um ataque norte-coreano. Concordar em interromper esses exercícios seria, portanto, um grande risco, no qual a segurança de nosso país estaria em jogo."
 korea.5.d_NKO: "A principal demanda do Sul é que paremos com os testes de armas nucleares, testes que eles veem como evidência de nossas intenções agressivas. No entanto, nosso programa de armas nucleares é visto pelo exército como um importante elemento dissuasor contra a invasão dos EUA. Além disso, o programa e os testes necessários para sua continuação ajudam a fortalecer a legitimidade de nosso governo. Concordar em interromper esses testes seria, portanto, um grande risco, no qual tanto a segurança de nosso país quanto a do nosso governo estariam em jogo."
 korea.5.a: "Nosso país nunca será completo novamente, a menos que corramos alguns riscos..."
 korea.5.b: "Alguns riscos são grandes demais para serem assumidos."
 korea.6.t: "Início das Negociações de Paz Coreana"
 korea.6.d: "Há mais de meio século, a Coreia do Norte e a Coreia do Sul estão tecnicamente em estado de guerra. Esse conflito congelado às vezes esquenta com confrontos entre os dois lados ao longo de fronteiras marítimas disputadas ou através da Zona Desmilitarizada. Agora, os dois lados estão se reunindo na esperança de pôr fim a essa situação e alcançar a desescalada na península coreana por meio de um tratado de paz formal. Negociar um tratado de paz é amplamente visto como um importante primeiro passo para reunificar a península coreana."
 korea.6.a: "Os dois lados podem chegar a um compromisso?"
 korea.7.t: "[CHI.GetLeader] Manifesta Apoio à Reunificação Coreana"
 korea.7.d: "A China historicamente tem sido cautelosa em relação à perspectiva de uma Coreia unida alinhada com os Estados Unidos em sua porta. Observadores ficaram surpresos ao ouvir [CHI.GetLeader] manifestar apoio incondicional à reunificação, em uma medida que, segundo algumas contas, pegou a liderança norte-coreana de surpresa. Dada a substancial influência da China em ambas as Coreias, este anúncio provavelmente pressionará os dois lados a se sentarem à mesa de negociações."
 korea.7.a: "A mudança está no ar?"
 korea.8.t: "Movimento radical coreano ganha popularidade"
 korea.8.d: "A desigualdade económica na República da Coreia contribuiu para a crescente insatisfação entre as classes mais baixas do país. Milhares de activistas online começaram a apelar a uma maior igualdade através do estabelecimento de autonomia a nível comunitário em toda a República da Coreia. Embora o movimento não tenha liderança e, portanto, careça de uma mensagem central e clara, a maioria dos seus membros parece desejar a abolição do Estado coreano e dos chaebols a que está ligado, em favor de um sistema que distribua o poder político e económico entre os eleitos directamente. representantes a nível comunitário.\n\nEsta nova ideologia, que rejeita as ideologias fundamentais tanto da República da Coreia como da RPDC, representa um afastamento significativo da política tradicional da esquerda radical sul-coreana, que ou promoveu políticas de esquerda dentro do sistema político existente na Coreia do Sul ou apelou ao estabelecimento de um estado ao estilo norte-coreano."
 korea.8.a: "Algo está acontecendo na República da Coreia..."
 korea.9.t: "Rebeldes no Sul Pedem Nosso Apoio"
 korea.9.d: "Representantes do Movimento Nacional de Libertação Coreana que buscam derrubar o governo no Sul vieram até nós solicitando uma aliança para abrir uma nova frente ao longo da ZDM."
 korea.9.a: "Nós nos juntaremos à luta deles!"
 korea.9.b: "Nós observaremos da margem."
 JUCHE_FACTION: "Frente Anti-Imperialista Coreana"
 korea.10.t: "Coreia do Sul solicita que encerremos nossa proteção ao Norte"
 korea.10.d: "Há algum tempo a Coreia do Sul tem se esforçado para mostrar que não é mais um país submisso aos interesses dos EUA. As relações entre nossos dois países estão em alta, enquanto nossas relações com o Norte têm estagnado em sua maioria. Agora uma delegação sul-coreana veio solicitar o fim do tratado de defesa entre nós e os norte-coreanos. Se concordarmos com o pedido deles, não mais iremos ajudar a Coreia do Norte em caso de invasão externa."
 korea.10.a: "Nós permaneceremos ao lado dos nossos aliados!"
 korea.10.b: "O Norte não vale nossa proteção."
 korea.11.t: "Empresas de Armas Coreanas Oferecem Produtos"
 korea.11.d: "A República da Coreia é conhecida por sua capacidade de produzir armas de alta qualidade a preços relativamente acessíveis. Devemos considerar se devemos comprar alguns de seus equipamentos, mas nossos fundos não são ilimitados, então devemos escolher com sabedoria."
 korea.11.a: "Comprar tanques coreanos."
 korea.11.b: "Comprar artilharia autopropulsada coreana."
 korea.11.c: "Comprar jatos treinadores coreanos."
 korea.11.e: "Comprar rifles de assalto coreanos."
 korea.11.f: "Recusar a oferta."
 korea.12.t: "[FROM.GetName] Aceita Acordo de Armas!"
 korea.12.d: "Os representantes deste país concordaram em importar armas de nós, aumentando nossa receita e nossa influência internacional."
 korea.12.a: "Nosso status internacional cresce!"
 korea.13.t: "Pequim e Seul Criticam Conjuntamente as Ações Japonesas na Segunda Guerra Mundial"
 korea.13.d: "Em uma atitude incomum, os governos da China e da República da Coreia emitiram uma declaração conjunta criticando as ações do Japão durante a guerra e sua subsequente recusa em se redimir completamente por elas. Muitos observadores interpretaram essa ação como parte dos esforços de Seul para afastar a China de seu apoio à Coreia do Norte. Embora Pyongyang tenha expressado apoio à condenação conjunta de [KOR.GetLeader] e [CHI.GetLeader], [NKO.GetLeader] estaria preocupada com sinais de que a China está favorecendo cada vez mais Seul."
 korea.13.a: "Nunca esqueceremos o que eles fizeram."
 korea.13.b: "Suas críticas são cansativas..."
 korea.13.c: "O passado projeta uma longa sombra..."
 korea.14.t: "China Anula Tratado de Defesa com a Coreia do Norte"
 korea.14.d: "Após a retirada da presença militar dos EUA da Coreia do Sul, a China concordou em se retirar de seu tratado de defesa com a Coreia do Norte, gerando condenação furiosa de Pyongyang. A decisão segue uma longa série de movimentos de Seul para ganhar o apoio da China e demonstrar sua autonomia de Washington. Alguns têm hipotetizado que agora que o caminho está livre para a reunificação forçada, [KOR.GetLeader] decidiu retomar o Norte pela força."
 korea.14.a: "Nossos esforços valeram a pena."
 korea.14.b: "Toleramos Pyongyang por tempo demais."
 korea.14.c: "A guerra está no horizonte?"
 korea.15.t: "[KOR.GetLeader] Exige Reparações do Japão"
 korea.15.d: "Após semanas de retórica antagonista de Seul e pressão de ativistas coreanos, [KOR.GetLeader] pediu ao Japão que pague reparações aos sobreviventes dos crimes de guerra japoneses cometidos durante a Segunda Guerra Mundial. O Japão, que afirma que a questão foi resolvida entre seu governo e o da Coreia do Sul durante o governo autoritário de Park Chung-hee, previsivelmente recusou-se a considerar pagar reparações.\n\nEmbora o incidente não tenha resultado em compensação para as vítimas coreanas, levou ao fortalecimento da posição política de [KOR.GetLeader] com muitos coreanos se unindo em torno dessa causa nacional extremamente emotiva."
 korea.15.a: "Um dia teremos justiça."
 korea.15.b: "Suas demandas são absurdas!"
 korea.15.c: "Será que o desacordo pode ser resolvido?"
 korea.16.t: "Guerra!"
 korea.16.d: "A guerra estourou entre nós e o Norte. Conforme nosso acordo com os Estados Unidos, agora devemos transferir o controle operacional de nossas forças armadas para o militar dos EUA."
 korea.16.a: "Devemos transferir o controle."
 korea.17.t: "A guerra acabou"
 korea.17.d: "A paz retornou à península coreana. Agora que voltamos às condições de tempo de paz, podemos reafirmar o controle sobre nossas forças armadas."
 korea.17.a: "Finalmente a paz."
 korea.18.t: "Eleições da Assembleia Nacional se aproximam enquanto os partidos começam a fazer campanha"
 korea.18.d: "Com as eleições da Assembleia Nacional se aproximando em cerca de um mês, devemos começar a impulsionar a popularidade de nosso partido para facilitar uma maioria na legislatura pelos próximos quatro anos."
 korea.18.a: "Esperemos por uma maioria!"
 korea.21.t: "Os resultados estão em!"
 korea.21.a: "Como sempre, foi uma eleição acirrada."
 korea.21.d_no: "Infelizmente, nenhum dos dois principais partidos conseguiu obter uma maioria na Assembleia Nacional. Nosso governo terá que lutar mais para conquistar legisladores de outros partidos a fim de aprovar legislação controversa."
 korea.21.d_con_loss: "Infelizmente, nosso partido não conseguiu garantir uma maioria na Assembleia Nacional. Legisladores liberais se recusarão a aprovar qualquer legislação que restrinja sindicatos, apoie grandes empresas ou promova antagonismo com a Coreia do Norte."
 korea.21.d_lib_loss: "Infelizmente, nosso partido não conseguiu garantir uma maioria na Assembleia Nacional. Legisladores conservadores se recusarão a aprovar qualquer legislação que restrinja grandes empresas, reforme o recrutamento e a inteligência, ou promova reconciliação com a Coreia do Norte."
 korea.21.d_con_win: "Felizmente, nosso partido conseguiu garantir uma maioria na Assembleia Nacional. A legislatura e o executivo poderão trabalhar de mãos dadas para facilitar objetivos conservadores, como limitar sindicatos, apoiar os chaebols e manter uma postura firme em relação à Coreia do Norte."
 korea.21.d_lib_win: "Felizmente, nosso partido conseguiu garantir uma maioria na Assembleia Nacional. A legislatura e o executivo poderão trabalhar de mãos dadas para facilitar objetivos liberais, como enfraquecer os chaebols, reformar o aparato de segurança e buscar a reunificação com o Norte."
 korea.22.t: "Choques da Reunificação Começam a se Manifestar"
 korea.22.d: "A grande nação da Coreia finalmente foi reunificada, após muitas décadas de dolorosa separação. No entanto, nossa tarefa de reintegrar as duas metades está longe de terminar. Muitos dos dois lados do paralelo 38 estão insatisfeitos com a forma como a reunificação aconteceu, e os custos econômicos de reunir dois estados muito diferentes estão se tornando rapidamente evidentes. Se falharmos em nossa tarefa de reunificar o país, podemos enfrentar a dissolução de nossa nação recém-nascida."
 korea.22.a: "Agora começa a parte difícil..."
 korea.23.t: "Nossa Resposta à Oferta de Paz do Sul"
 korea.23.d: "Depois de semanas de discussões, chegou a hora de decidirmos se estamos dispostos a aceitar a oferta de paz do Sul. Devemos considerar se confiamos na sinceridade da oferta do Sul, mas também como concordar com um tratado de paz será percebido por nossos apoiadores internos que ainda esperam reunificar o país pela força algum dia."
 korea.23.a: "Nós concordaremos com um tratado."
 korea.23.b: "Nunca haverá paz entre nós!"
 korea.24.t: "Acordo de Paz Coreano Assinado"
 korea.24.d: "Após uma melhora nas relações entre as duas Coreias, [KOR.GetLeader] do Sul e [NKO.GetLeader] do Norte concordaram em substituir o frágil Acordo de Armistício por um acordo de paz formal. Este tratado finalmente pôs fim ao estado de hostilidades que existia entre as duas Coreias desde a Guerra da Coreia. Ambos os líderes expressaram esperanças de que esse desenvolvimento coloque a península em um caminho rumo à reunificação, embora alguns observadores tenham expressado dúvidas sobre a disposição de perseguir a reunificação em ambos os lados."
 korea.24.a: "Um futuro brilhante se abre para a península!"
 korea.25.t: "Conversas Intercoreanas Colapsam"
 korea.25.d: "As conversas em Panmunjom entre [KOR.GetLeader] do Sul e [NKO.GetLeader] do Norte colapsaram devido a vários desacordos entre os dois lados. Embora o fato de haver alguns pontos de acordo tenha levado alguns a esperar um retorno às conversas no futuro, está claro que um acordo entre as duas Coreias não será alcançado em um futuro próximo."
 korea.25.a: "A paz continua elusiva..."
 korea.26.t: "Coreia do Sul propõe reunificação"
 korea.26.d: "Buscando capitalizar uma melhoria sem precedentes nas relações entre as duas Coreias, o Sul está oferecendo cooperar conosco para reunificar nossa nação dividida. No entanto, eles estão insistindo que o processo de reunificação será liderado pelo Sul, uma demanda que ameaça a cultura política única que desenvolvemos no Norte."
 korea.26.d1: "Buscando capitalizar uma melhoria sem precedentes nas relações entre as duas Coreias, o Sul está oferecendo cooperar conosco para reunificar nossa nação dividida. O Sul, entendendo nossas preocupações sobre a reunificação, ofereceu compartilhar o poder pós-reunificação por meio de um governo de unidade, incorporando elementos do Norte e do Sul."
 korea.26.a: "Nosso país será inteiro novamente!"
 korea.26.b: "A reunificação nunca pode acontecer nessas condições..."
 korea.27.t: "O Norte concordou com nossas condições para reunificação!"
 korea.27.d: "Após extensas negociações, o Norte concordou em começar a trabalhar para reunificar nossos dois países! Com as relações entre as duas Coreias estabilizadas e a reintegração da península no horizonte, o futuro do povo coreano nunca pareceu tão brilhante!"
 korea.27.a: "Notícia fantástica!"
 korea.28.t: "O Norte recusou nossas condições para reunificação!"
 korea.28.d: "Lamentavelmente, [NKO.GetLeader] optou por colocar sua própria posição egoísta antes da do povo coreano e rejeitou nossa oferta de cooperar na reunificação do país. Essa rejeição não significa que não possamos tentar novamente no futuro, mas significa que a reunificação não ocorrerá em um futuro próximo. Devemos lançar as bases para garantir que nossa próxima tentativa tenha maior sucesso."
 korea.28.a: "Um dia triste para o povo coreano..."
 korea.29.t: "China Solicita o Retorno dos Restos Mortais"
 korea.29.d: "Pequim pediu formalmente que devolvamos os restos mortais de pessoal do Exército de Voluntários do Povo Chinês recuperados na Coreia do Sul. Aprovar o pedido permitiria que os soldados caídos fossem repatriados para a China."
 korea.29.a: "Aprovar a transferência."
 korea.29.b: "Recusar a solicitação."
 korea.30.t: "Primeiros Restos Mortais Retornados à China"
 korea.30.d: "A Coreia do Sul transferiu a primeira coleção de restos mortais do Exército de Voluntários do Povo Chinês recuperados nas províncias de Gangwon e Gyeonggi. Representantes chineses e coreanos assinaram os documentos de entrega no Aeroporto Internacional de Incheon antes que uma aeronave militar chinesa levasse os restos mortais de volta para casa."
 korea.30.a: "Honrar os caídos."
 korea.31.t: "Sétima Transferência de Restos Mortais"
 korea.31.d: "A Coreia do Sul entregou 117 conjuntos de restos mortais recuperados de Arrow Hill na Zona Desmilitarizada. Autoridades chinesas e sul-coreanas compareceram à cerimônia de transferência no Aeroporto Internacional de Incheon."
 korea.31.a: "Honrar os caídos."
 korea.33.t: "Nossa Resposta à Oferta de Paz do Norte"
 korea.33.d: "Após semanas de discussões, chegou a hora de decidirmos se estamos dispostos a aceitar a oferta de paz do Norte. Devemos considerar se confiamos na sinceridade da oferta do Norte, mas também como concordar com um tratado de paz será percebido por aqueles de nosso povo que permanecem opostos a negociar com o regime norte-coreano."
 korea.34.t: "Coreia do Norte propõe reunificação"
 korea.34.d: "Buscando capitalizar uma melhoria sem precedentes nas relações entre as duas Coreias, o Norte está oferecendo cooperar conosco para reunificar nossa nação dividida. No entanto, eles estão insistindo que o processo de reunificação será liderado pelo Norte, uma demanda que ameaça o modo de vida que cultivamos no Sul."
 korea.34.d1: "Buscando capitalizar uma melhoria sem precedentes nas relações entre as duas Coreias, o Norte está oferecendo cooperar conosco para reunificar nossa nação dividida. O Norte, entendendo nossas preocupações sobre a reunificação, ofereceu compartilhar o poder pós-reunificação por meio de um governo de unidade, incorporando elementos do Sul e do Norte."
 korea.35.t: "O Sul concordou com nossos termos para reunificação!"
 korea.35.d: "Após extensas negociações, o Sul concordou em começar a trabalhar para reunificar nossos dois países! Com as relações entre as duas Coreias estabilizadas e a reintegração da península no horizonte, o futuro do povo coreano nunca pareceu tão brilhante!"
 korea.36.t: "O Sul recusou nossos termos para reunificação!"
 korea.36.d: "Lamentavelmente, [KOR.GetLeader] optou por colocar sua própria posição egoísta antes daquela do povo coreano e rejeitou nossa oferta de cooperar na reunificação do país. Essa rejeição não significa que não possamos tentar novamente no futuro, mas significa que a reunificação não ocorrerá em um futuro próximo. Devemos lançar as bases para garantir que nossa próxima tentativa tenha maior sucesso."
 korea.38.t: "Coreia nos pede para retirar nossas tropas no Japão e na Coreia"
 korea.38.d: "A Coreia fez um pedido formal hoje para que retiremos nossas tropas no Japão e na Coreia."
 korea.38.a: "Não vamos atender às suas demandas injustas."
 korea.38.b: "Bem, talvez seja hora dos soldados voltarem para casa..."
 recognition.1.t: "[FROM.GetName] Reconhece o Rompimento"
 recognition.1.d: "[FROM.GetNameDef] estendeu reconhecimento diplomático formal ao estado separatista em nosso território. A decisão é um revés para a nossa reivindicação sobre a região."
 recognition.1.a: "Não seremos divididos."
 recognition.3.t: "[FROM.GetName] Retira o Reconhecimento"
 recognition.3.d: "[FROM.GetNameDef] reverteu seu reconhecimento anterior da nossa soberania. Seja qual for o motivo, o resultado é o mesmo."
 recognition.3.a: "A luta continua."
 recognition.4.t: "[FROM.GetName] Retira o Reconhecimento do Rompimento"
 recognition.4.d: "[FROM.GetNameDef] reverteu seu reconhecimento anterior do estado separatista em nosso território. Menos uma capital apoia a reivindicação de soberania deles."
 recognition.4.a: "Uma pequena vitória para a nossa posição."
 recognition.7.t: "[FROM.GetName] Entra para as Nações Unidas"
 recognition.7.d: "Após uma campanha sustentada por reconhecimento internacional, [FROM.GetNameDef] foi admitido na Assembleia Geral das Nações Unidas como um estado-membro."
 recognition.7.a: "Bem-vindo à Assembleia Geral."
 recognition.8.t: "[FROM.GetName] nos pressiona a reconhecer [pressured_to_recognize]"
 recognition.8.d: "[FROM.GetNameDef] está usando sua influência sobre nós para forçar o reconhecimento de [pressured_to_recognize]. Recusar um parceiro com tanto peso e influência traz um custo real."
 recognition.8.a: "Este país merece reconhecimento!"
 recognition.8.b: "Nos recusamos a reconhecer este regime!"
 internal_faction.1.t: "O Exército está Solicitando um Aumento Orçamentário"
 internal_faction.1.d: "Citando novas ameaças à nossa segurança nacional, o exército solicitou um aumento no orçamento de defesa [ROOT.GetAdjective]. Conceder esse pedido aumentará a pressão sobre nosso orçamento, mas negá-lo reduzirá a opinião do exército sobre nosso governo."
 internal_faction.1.a: "Devemos dar a eles o dinheiro."
 internal_faction.1.b: "Não podemos arcar com essa despesa!"
 internal_faction.2.t: "Alguns Quadros do Partido Comunista Estão Envolvidos em Atividades Corruptas!"
 internal_faction.2.d: "Nossas agências de inteligência descobriram recentemente que alguns oficiais do partido comunista estão aceitando subornos e praticando nepotismo. Por um lado, não devemos permitir que tais atividades fiquem impunes se quisermos permanecer legítimos aos olhos do povo, mas por outro, tal ação certamente alienará muitos aliados importantes dentro do Partido Comunista."
 internal_faction.2.a: "Devemos fazer vista grossa."
 internal_faction.2.b: "Devemos dar um exemplo deles!"
 internal_faction.3.t: "Conglomerados Industriais Estão Solicitando Isenções Fiscais"
 internal_faction.3.d: "Os líderes de alguns dos maiores conglomerados industriais de [ROOT.GetName] estão fazendo lobby privado em nosso governo para que concedamos mais isenções fiscais a eles. Conceder essas isenções fiscais melhorará a opinião dos conglomerados industriais sobre nosso governo, mas reduzirá a receita de impostos em todo o país."
 internal_faction.3.a: "Devemos conceder as isenções fiscais."
 internal_faction.3.b: "Não podemos nos dar ao luxo de fazer tal concessão."
 isis.1.t: "Vitória sobre o Estado Islâmico"
 isis.1.d: "Agora que o Estado Islâmico foi derrotado, nosso país não será mais afligido pela propaganda extremista produzida pelo Estado Islâmico. Agora podemos nos concentrar em espalhar nossas ideias em nosso país e nunca mais permitir que extremistas tomem o controle novamente."
 isis.1.a: "Ótimo"
 isis.2.t: "Infiltrar-se em Tahrir al-Sham?"
 isis.2.d: "O Califado de todos os muçulmanos, [Root.GetLeader]. Devemos atacar o coração de nosso vil inimigo, Tahrir al-Sham, que se recusa a reconhecer seu justo e legítimo governo. Embora eles tenham se desviado do caminho do verdadeiro Islã e da gloriosa Jihad, eles têm muitos bons combatentes jihadistas em suas fileiras. Inshallah, devemos nos infiltrar neles e tentar fazer com que o máximo possível desertem para nosso glorioso Califado!"
 isis.2.a: "Vamos tentar influenciar verdadeiros combatentes a se afastarem deste falso grupo jihadista!"
 isis.2.b: "Não, não podemos arcar com a possível luta interna."
 isis.2.a_tt: "§HInfiltração falhou§! (Sem efeito)"
 isis.3.t: "Combatentes desertam para o Daesh"
 isis.3.d: "[Root.GetLeader]! O assim chamado Estado \"Islâmico\" nos infiltrou e conseguiu convencer alguns de nossos melhores combatentes a se juntarem ao ridículo pretexto de califado deles. Não devemos deixar isso sem resposta, devemos lutar e derrotar esses kharijitas que fazem takfir para todos os lados, enquanto usam o Sagrado Alcorão como papel higiênico."
 isis.3.a: "Nós, os jihadistas justos, os mataremos como cães!"
 isis.3.b: "Não, não podemos arcar com outra frente nessa guerra."
 isis.4.t: "Unidades de Tahrir al-Sham desertam"
 isis.4.d: "O Califa, muitos irmãos muwahhid justos e corajosos desertaram da malévola Frente Tahrir al-Sham e se juntaram à nossa causa!"
 isis.4.a: "Takbir! Takbir para o Estado Islâmico!"
 isis.4.a_tt: "Adiciona 2 §HBrigadas Jabat al-Nusra§! em §HRaqqa§!."
 isis.5.t: "Sinal de fraqueza de Tahrir al-Sham"
 isis.5.d: "O Califa, a nojenta Frente Tahrir al-Sham está mais fraca do que pensávamos, não fazendo nada contra nossa infiltração deles e as deserções recentes. O Conselho de Guerra Shura recomenda que matemos seus restos apodrecendo como cães e tomemos seu território - adicionando-o ao nosso glorioso Califado!"
 isis.5.a: "Ensine a esses jihadistas falsos quem é o verdadeiro sucessor do Sheik Osama!"
 isis.5.b: "O tempo deles chegará, mas por enquanto devemos esperar."
 isis.6.t: "Restos de Tahrir al-Sham se juntam ao nosso Califado"
 isis.6.d: "O Califa, o doce néctar da vitória está em nossos lábios. À beira da derrota, os restos de Tahrir al-Sham prestaram juramento de lealdade a você, [Root.GetLeader], e ao nosso sempre crescente Califado."
 isis.6.a: "Damos as boas-vindas aos nossos irmãos ao verdadeiro Califado!"
 isisNews.1.t: "Tahrir al-Sham se une ao ISIS"
 isisNews.1.d: "Com a pressão crescente sobre os islamistas sírios de Tahrir al-Sham, suas forças remanescentes prestaram juramento de lealdade ao ISIS em um último esforço desesperado para impor sua ideologia fundamentalista na Síria."
 isisNews.1.a: "Deus nos ajude a todos!"
 isis.7.t: "Oculto"
 isis.7.d: "Oculto"
 isis.7.a: "Oculto"
 isis.1301.t: "Abu Fatima Morto em Ataque Aéreo da Coalizão"
 isis.1301.d: "Más notícias, Califa! Seu bom amigo e companheiro iraquiano, Abu Fatima al-Jaheishi, foi corajosamente martirizado em um covarde ataque aéreo pelos americanos.\n\n                                               Ele matou muitos apóstatas.\n\n                                         Que Alá aceite seu martírio."
 isis.1301.a: "Vingaremos ele quando conquistarmos Washington DC!"
 isisNews.1301.t: "Comandante do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1301.d: "O terrorista iraquiano e comandante sênior do ISIS, Abu Fatima al-Jaheishi, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. Abu Fatima fazia parte do círculo interno de al-Baghdadi e atuava como vice-líder das partes controladas pelo ISIS no Iraque."
 isisNews.1301.a: "Boa Viagem!"
 isis.1302.t: "al-Sulami Morto em Ataque Aéreo da Coalizão"
 isis.1302.d: "Más notícias, Califa! O clérigo chefe Abu Sufyan al-Sulami foi martirizado em um covarde ataque aéreo pelos americanos. Ele veio até nós da terra do Bahrein e nos deu apoio religioso fundamental para nosso Califado.\n\n               Ó Califa, ele nos inspirou a todos com sua bela biografia sobre você.\n\n                                         Que Alá aceite seu martírio."
 isisNews.1302.t: "Líder Religioso do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1302.d: "O terrorista do Bahrein e líder religioso sênior do ISIS, Turki al-Binali, conhecido por seu nome de guerra \"Abu Sufyan al-Sulami\", foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Binali não era importante para o esforço militar do ISIS, mas era fundamental para fornecer apoio religioso ao grupo e escreveu a primeira biografia de Abu Bakr al-Baghdadi."
 isis.1303.t: "Comandante Morto em Ataque Aéreo da Coalizão"
 isis.1303.d: "Más notícias, Califa! O Emir de nossos lutadores albaneses e kosovares e comandante sênior, Lavdrim Muhaxheri, foi martirizado em um covarde ataque aéreo pelos cães americanos.\n\n                                                Ele matou muitos apóstatas.\n\n                                         Que Alá aceite seu martírio."
 isisNews.1303.t: "Comandante do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1303.d: "O terrorista kosovar e albanês e comandante sênior do ISIS, Lavdrim Muhaxheri, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. Muhaxheri lutou no Afeganistão ao lado da OTAN, mas foi radicalizado por volta de 2012 e viajou para a Síria. Em 2013, ele se juntou ao ISIS e rapidamente se tornou 'Emir' dos lutadores albaneses e kosovares na Síria e no Iraque. Ele era um bandido brutal que pessoalmente decapitava prisioneiros."
 isis.1304.t: "Comandante Morto em Ataque Aéreo da Coalizão"
 isis.1304.d: "O Califa, terríveis notícias! Nosso comandante militar de elite, Gulmurod Khalimov, foi martirizado em um covarde ataque aéreo pelos cães americanos. Antes de encontrar seu caminho até nós a partir das terras dos tajiques, ele era um oficial de forças especiais de alto escalão. Seu conhecimento militar fará muita falta.\n\n                                           Ele matou muitos apóstatas.\n\n                                          Que Alá aceite seu martírio."
 isisNews.1304.t: "Comandante do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1304.d: "O terrorista tajique e comandante sênior do ISIS, Gulmurod Khalimov, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. Khalimov era um oficial experiente e de alto escalão das forças especiais nas Forças Armadas do Tajiquistão antes de desertar para o ISIS."
 isis.1305.t: "Comandante Morto em Ataque Aéreo da Coalizão"
 isis.1305.d: "O Califa, terríveis notícias! Nosso chefe de operações de martírio e principal instrutor de Mujahid estrangeiros, Abdullah Ahmed al-Mashadani, foi martirizado em um ataque aéreo pelos cães americanos.\n\n                                                Ele matou muitos apóstatas.\n\n                                                  Que Alá aceite seu martírio."
 isisNews.1305.t: "Comandante do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1305.d: "O terrorista iraquiano e comandante sênior do ISIS, Abdullah Ahmed al-Mashadani, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Mashadani era fundamental para o esforço de guerra do ISIS, liderando operações de atentados suicidas e treinando jihadistas estrangeiros."
 isis.1306.t: "Comandante Martirizado em Ataque Aéreo da Coalizão"
 isis.1306.d: "Ó Califa, más notícias! Nosso governador da região do Centro Eufrates, Ahmed Khalal al-Juhayshi, foi martirizado em um ataque aéreo dos cães americanos.\n\n                                                Ele matou muitos apóstatas.\n\n                                                Que Alá aceite seu martírio."
 isisNews.1306.t: "Comandante do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1306.d: "O terrorista iraquiano e membro sênior do ISIS, Ahmed Khalal al-Juhayshi, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Juhayshi não era um comandante militar proeminente, mas um administrador e governador da importante região do Centro do Eufrates para o Estado Islâmico."
 isis.1307.t: "Comandante Morto em Ataque Aéreo da Coalizão"
 isis.1307.d: "O Califa, más notícias! Seu bom amigo e Chefe de Logística e Suprimentos, Fares Reif al-Naima, foi martirizado em um ataque aéreo pelos cães americanos. Ele era um mujahid corajoso e leal de longa data, lutando contra os infiéis e apóstatas desde 2003.\n\n                                 Ele matou muitos pela glória do Califado.\n\n                                         Que Alá aceite seu martírio."
 isisNews.1307.t: "Comandante do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1307.d: "O terrorista iraquiano e comandante sênior do ISIS, Fares Reif al-Naima, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Naima lutou contra as forças dos EUA na guerra do Iraque e, após ter sido detido pelas forças dos EUA em Camp Bucca junto com al-Baghdadi, ganhou destaque como Chefe de Logística e Suprimentos do Estado Islâmico."
 isis.1308.t: "Comandante Morto em Ataque Aéreo da Coalizão"
 isis.1308.d: "O Califa, más notícias! Abu Ahmad al-Alwani foi martirizado em um ataque aéreo pelos infiéis americanos. Ele era um oficial no Exército Iraquiano de Saddam Hussein e nos ajudou muito com sua visão após se juntar à insurgência sunita e ao nosso amado Estado Islâmico.\n\n                                                Ele matou muitos apóstatas.\n\n                                                  Que Alá aceite seu martírio."
 isisNews.1308.t: "Comandante do ISIS Morto em Ataque Aéreo da Coalizão"
 isisNews.1308.d: "O terrorista iraquiano e comandante sênior do ISIS, Abu Ahmad al-Alwani, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Alwani era um oficial no Exército Iraquiano de Saddam Hussein antes de se juntar à insurgência sunita contra as forças dos EUA. Ele rapidamente subiu nas fileiras do Estado Islâmico do Iraque até a posição de comandante sênior."
 isis.1309.t: "Comandante Morto em Ataque Aéreo da Coalizão"
 isis.1309.d: "O Califa, desastre! Nosso ministro da guerra e segundo em comando, Ayad al-Jumaili, foi bravamente martirizado em um covarde ataque aéreo pelos cães infiéis americanos. Um colega iraquiano, ele era um oficial sênior de inteligência sob Saddam Hussein e aplicou sua sabedoria sobre como manter o Califado a salvo de inimigos internos como nosso chefe de inteligência e segurança interna.\n\n                                                Ele matou muitos traidores.\n\n                                                Que Alá aceite seu martírio."
 isisNews.1309.t: "Comandante do ISIS Morto em Ataque da Coalizão"
 isisNews.1309.d: "O terrorista saudita e comandante sênior do ISIS, Abu Muhammad al-Shimali, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Shimali era um recrutador-chave e contrabandista para o Estado Islâmico. Além disso, relatórios de inteligência sugerem que ele desempenhou um papel fundamental em auxiliar os ataques de Paris em 2015."
 isis.1310.t: "Comandante Morto em Ataque da Coalizão"
 isis.1310.d: "O Califa, desastre! Nosso ministro da guerra e segundo em comando, Ayad al-Jumaili, foi bravamente morto em um covarde ataque aéreo pelos cães infiéis americanos. Um colega iraquiano, ele foi um oficial de inteligência sênior sob Saddam Hussein, e aplicou sua sabedoria para manter o Califado seguro de inimigos internos como nosso chefe de inteligência e segurança interna.\n\n                                               Ele eliminou muitos traidores.\n\n                                                Que Alá aceite seu martírio."
 isisNews.1310.t: "Segundo em Comando do ISIS Morto em Ataque da Coalizão"
 isisNews.1310.d: "O terrorista iraquiano e segundo em comando do Estado Islâmico, Ayad al-Jumaili, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Jumaili era um oficial de inteligência sênior sob Saddam Hussein, que se juntou à insurgência sunita após a ocupação dos EUA em 2003. Ele se tornou chefe de inteligência e segurança interna no Estado Islâmico, e posteriormente foi promovido a segundo em comando e ministro da guerra."
 isis.1311.t: "Comandante Morto em Ataque da Coalizão"
 isis.1311.d: "O Califa, más notícias! O comandante sênior Khairy Abed Mahmoud al-Taey foi morto em um ataque aéreo pelos infiéis americanos. Um colega iraquiano, ele era membro do nosso conselho militar e liderou operações com dispositivos explosivos improvisados (IED), semeando justamente o medo e o caos nos corações de nossos inimigos.\n\n                                               Ele eliminou muitos apóstatas.\n\n                                                 Que Alá aceite seu martírio."
 isisNews.1311.t: "Comandante do ISIS Morto em Ataque da Coalizão"
 isisNews.1311.d: "O terrorista iraquiano e comandante sênior do ISIS, Khairy Abed Mahmoud al-Taey, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. al-Taey fazia parte do conselho militar do ISIS e era responsável pelas operações com dispositivos explosivos improvisados (IED), semeando caos nas cidades atacadas pelo ISIS."
 isis.1312.t: "Comandante Morto em Ataque da Coalizão"
 isis.1312.d: "O Califa, más notícias! Seu amigo, conselheiro e comandante sênior, Abdul Wahid Khutnayer Ahmad, foi morto em um ataque aéreo pelos infiéis americanos. Um colega iraquiano, ele estava encarregado da segurança interna.\n\n                                        Ele descobriu muitos traidores e apóstatas.\n\n                                         Que Alá aceite seu martírio."
 isisNews.1312.t: "Comandante do ISIS Morto em Ataque da Coalizão"
 isisNews.1312.d: "O terrorista iraquiano e comandante sênior do ISIS, Abdul Wahid Khutnayer Ahmad, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. Khutnayer Ahmad era um conselheiro-chave de al-Baghdadi e estava encarregado da segurança interna."
 isis.1313.t: "Comandante Morto em Ataque da Coalizão"
 isis.1313.d: "O Califa, notícia terrível! Nosso comandante sênior, Abu Jihad Shishani, foi morto em um ataque aéreo pelos infiéis americanos. Ele veio das terras dos chechenos e lutou bravamente pela glória de Alá até o fim.\n\n                                               Ele eliminou muitos apóstatas.\n\n                                                Que Alá aceite seu martírio."
 isisNews.1313.t: "Comandante do ISIS Morto em Ataque da Coalizão"
 isisNews.1313.d: "O terrorista checheno e comandante sênior do ISIS, Abu Jihad Shishani, foi morto hoje em um ataque aéreo da coalizão liderada pelos EUA. Shishani, cidadão russo, era o segundo em comando do grupo terrorista Emirado do Cáucaso sob a liderança de Umar Shishani. Após Umar viajar para a Síria e se juntar ao ISIS, Abu Jihad tentou assumir o controle do Emirado do Cáucaso para se aliar ao ISIS, mas acabou viajando para a Síria para lutar pelo ISIS como comandante sênior também."
 isis.11301.t: "Abu Fatima Martirizado em Ataque Aéreo Russo"
 isis.11301.d: "Más notícias, Califa! Seu bom amigo e companheiro vice iraquiano, Abu Fatima al-Jaheishi, foi corajosamente martirizado em um covarde ataque aéreo pelos russos.\n\n                                               Ele matou muitos apóstatas.\n\n                                         Que Alá aceite seu martírio."
 isis.11301.a: "Vingaremos ele quando conquistarmos Moscou!"
 isisNews.11301.t: "Comandante do ISIS Morto em Ataque Aéreo Russo"
 isisNews.11301.d: "O terrorista iraquiano e comandante sênior do ISIS, Abu Fatima al-Jaheishi, foi morto hoje em um ataque aéreo russo. Abu Fatima fazia parte do círculo interno de al-Baghdadi e atuava como vice-líder das partes controladas pelo ISIS no Iraque."
 isisNews.11301.a: "Boa notícia!"
