 Sov_warsaw_pact.7.t: "단일 국가로의 통합 국민투표"
 Sov_warsaw_pact.7.d: "체코와 슬로바키아 국민은 얼마 전 지도부가 경고도 없이 나라를 분할하여 자신들을 속였던 일을 잊지 않았습니다. 이제 이 역사적 실수를 바로잡고 다시 하나의 강력한 민족으로 재통합할 기회가 왔습니다. 러시아는 공정하고 안전한 국민투표 절차를 보장하기 위해 중립적인 중재자로 나설 것입니다."
 Sov_warsaw_pact.7.a: "통합할 때다!"
