 SIN_APC_1: "M113A1"
 SIN_APC_1_short: "M113"
 SIN_APC_1_desc: "Когда независимость была насильственно навязана Сингапуру, неоперившимся SAF пришлось строить по современным стандартам с нуля. Первое, что им было нужно, — это функционирующая платформа для механизации их пехоты, и какие ещё были лучшие варианты, чем чрезмерно обильное количество M113, находящихся на военных складах США?"
 SIN_APC_2: "M113A2 Ultra"
 SIN_APC_2_short: "M113 Ultra"
 SIN_APC_2_desc: "Первоначально парк M113 был модернизирован до варианта A2. Однако в начале 80-х годов M113A2 были модифицированы компанией ST Engineering для установки 40-мм гранатомётов местной разработки и 12,7-мм (.50) крупнокалиберных пулемётов. Получившие название M113A2 Ultra, они были дополнительно усовершенствованы боевыми модулями Rafael и 25-мм пушкой Bushmaster."
 SIN_APC_3: "Bandvagn 206"
 SIN_APC_3_short: "Bv 206"
 SIN_APC_3_desc: "При изучении геополитического ландшафта потенциальных полей сражений страны одной из ключевых проблем была способность механизированных сил преодолевать труднопроходимую местность. В 1970-е годы немногие колёсные транспортёры соответствовали требованиям SAF, за исключением шведского Bandvagn 206. Поэтому SAF приобрели несколько Bv 206, чтобы на короткое время усилить часть своей моторизованной пехоты. В конце концов их заменили Bronco ATTC местной разработки, а Bv 206 передали национальной пожарной службе."
 SIN_APC_4: "Bronco ATTC"
 SIN_APC_4_short: "Bronco ATTC"
 SIN_APC_4_desc: "Разработка Bronco началась после того, как SAF пришли к выводу, что Bv 206 не создавался для той войны, с которой может столкнуться Сингапур. Вдохновлённая огромной полезностью американских Humvee и необходимостью преодолевать труднопроходимую болотистую местность, компания ST Engineering спроектировала и изготовила Bronco ATTC, похожий на шведский Bandvagn. Способность переплывать проливы, проходить по лесистой или болотистой местности и относительно просторное внутреннее пространство сделали Bronco крайне необходимым БТР для пехоты SAF."
 SIN_APC_5: "Terrex AV-81"
 SIN_APC_5_short: "Terrex"
 SIN_APC_5_desc: "Правительство впервые сочло Terrex ICV необходимым с наступлением 21-го века, будучи твёрдо уверенным, что SAF нужен БТР нового поколения на замену стареющим M113 и неудовлетворительным Bronco ATTC. В рамках перехода SAF к армии 3G Terrex ICV был спроектирован и разработан компанией ST Engineering. Оснащённый совершенно новой модульной бронёй и важнейшим модулем системы управления полем боя, Terrex теперь служит основой моторизованной пехоты SAF."
 SIN_APC_6: "Terrex AV-81 III"
 SIN_APC_6_short: "Terrex 3"
 SIN_APC_6_desc: "Недавно разработанный на основе оригинального Terrex, Terrex 3 имеет улучшенную броню, амфибийные возможности и может нести 30-мм автоматическую орудийную башню. Хотя SAF его не заказывали, Terrex 3 используется Австралийской армией."
 SIN_IFV_4: "Bionix 25"
 SIN_IFV_4_short: "Bionix 25"
 SIN_IFV_4_desc: "В середине 1980-х годов правительство осознало, что поддержание парка устаревших M113 и AMX-13 не сработает, если они хотят, чтобы соседи не воспринимали Сингапурские вооружённые силы (СВС) как шутку. Поэтому закупочное ведомство Министерства обороны (MINDEF) было назначено для изучения нескольких зарубежных проектов — FV510 Warrior, M2 Bradley и Marder IFV. В конце концов все они не удовлетворили строгим требованиям СВС, и местная промышленность решила разработать и изготовить собственную БМП с нуля. Bionix 25 наконец появилась в 1997 году и сразу же поступила на вооружение молодых бронетанковых бригад СВС."
 SIN_IFV_5: "Bionix II"
 SIN_IFV_5_short: "Bionix II"
 SIN_IFV_5_desc: "Несмотря на успех Bionix 25, Сингапурские вооружённые силы (SAF) сочли его несколько неудовлетворительным в меняющейся обстановке начала 21 века. Конструкция Bionix была пересмотрена, после чего появился новый пакет модернизации. В рамках перехода SAF к боевым силам 3G Bionix II получил пушку Bushmaster II, модернизированную броню MEXAS и совершенно новую систему управления полем боя. Одна эта модернизация дала бронетанковым бригадам SAF огромное преимущество в тактической ситуационной осведомлённости, существенно повысив эффективность бронетанковых сил SAF."
 SIN_IFV_6: "Hunter AFV"
 SIN_IFV_6_short: "Hunter"
 SIN_IFV_6_desc: "Впервые представленный как NGAFV в 2016 году, Hunter AFV — новейшее оружие, принятое на вооружение SAF: он оснащён необитаемой 30-мм пушечной установкой Rafael, пусковой установкой ПТУР и системой поддержки боя ARTEMIS. Hunter был показан как (политический) символ военной мощи Сингапура на недавнем параде в честь Национального дня на фоне территориальных споров между Сингапуром и Малайзией в конце 2018 года."
 SIN_MBT_2: "Centurion Tempest"
 SIN_MBT_2_desc: "Отчаянно ища замену стареющим танкам AMX-13, SAF решили обратиться к зарубежным поставкам, чтобы пополнить свой бронетанковый парк. Великобритания отказалась продать Сингапуру часть списываемых Centurion, поэтому SAF решили закупить эти танки у Индии. В 1990-х годах SAF приобрели ещё Centurion у Израиля и при израильской помощи модернизировали свой парк Centurion до варианта Tempest по современным стандартам ЦАХАЛ. Centurion Tempest оставались на вооружении вплоть до 2000-х годов, когда наконец появилась возможность приобрести немецкие Leopard."
 SIN_MBT_1: "AMX-13 SM1"
 SIN_MBT_1_desc: "Первыми танками, прокатившимися по Парадной площади Паданга в первые годовщины независимости Сингапура, были 2 недавно сформированных взвода AMX-13. Позже модифицированные ST Kinetics в вариант SM1, AMX-13 были гордостью SAF с начала 1960-х годов до 2000 года. Несмотря на различные недостатки устаревшего лёгкого танка, AMX-13 были копьём Сингапурской армии."
 SIN_MBT_4: "Leopard 2A4"
 SIN_MBT_4_desc: "Внезапный распад СССР заставил недавно воссоединившихся немцев задуматься о своих обильных запасах Leopard 2A4. Когда им наконец пришла в голову блестящая идея продать все лишние Leopard за рубеж, Сингапур одним из первых заключил с Германией сделку о приобретении этих танков. Получив первые машины в 2005 году, СВС быстро заменили AMX-13 и оперативно начали создавать современную бронетанковую бригаду."
 SIN_MBT_5: "Leopard 2SG"
 SIN_MBT_5_desc: "Leopard 2SG — вариант, модифицированный ST Kinetics с использованием пакета Evolution от Rheinmetall. Оснащённый модульной бронёй AMAP, Leopard 2SG лучше приспособлен к боям в городских условиях. Лучше бронированные танки теперь пополняют парк Leopard 2A4, служа вместе с Bionix и Terrex и становясь новым копьём Сингапурской армии."
 SIN_MBT_7: "Leokava SG AMBT"
 SIN_SP_arty_2: "SSPH Primus"
 SIN_SP_arty_2_desc: "Сначала это был M109, потом AS-90, потом «Акация». Когда все иностранные образцы не смогли полностью удовлетворить потребности Сингапура, местная промышленность решила спроектировать и произвести собственную машину. В результате был создан SSPH Primus. Он функционирует очень похоже на M109A6 Paladin, но разделяет некоторые из своих систем с локально разработанным Bionix IFV."
 SIN_SP_arty_3: "Advanced Mobile Gun System"
 SIN_SP_arty_3_short: "AMGS 155mm"
 SIN_SP_R_arty_2: "M142 HIMARS"
 SIN_SP_R_arty_2_desc: "В целях дальнейшего укрепления потенциала передовой оборонной стратегии SAF в 2007 году было выдвинуто предложение о приобретении современной РСЗО. Однако M270 слишком дорог и тяжёл, а большинство РСЗО не были интегрированы с новейшими технологиями передачи данных. Зато M142 HIMARS отвечает требованиям SAF как доступная и высокотехнологичная платформа, поэтому SAF обратились к США с просьбой о закупке. В 2011 году SAF ввели в строй свою первую батарею HIMARS, ставшую первым подразделением HIMARS, полностью использующим боеприпасы с GPS-наведением."
