 AI_RACE_dashboard_capacity: "§HOperating Capacity: Available / Required§!\nCivilian Factories: [?ROOT.ai_race_current_civs_available|0] / [?ROOT.ai_race_current_civs_required|0] ([?ROOT.ai_race_current_civs_ratio|%0]; [ai_race_current_civs_status])\nNetwork Infrastructure: [?ROOT.ai_race_current_network_available|0] / [?ROOT.ai_race_current_network_required|0] ([?ROOT.ai_race_current_network_ratio|%0]; [ai_race_current_network_status])\nSustained power: [?ROOT.ai_race_current_power_available|1] / [?ROOT.ai_race_current_power_required|1] GW ([?ROOT.ai_race_current_power_ratio|%0]; [ai_race_current_power_status])\nMicrochips: [?ROOT.ai_race_current_microchips_available|1] / [?ROOT.ai_race_current_microchips_required|0] ([?ROOT.ai_race_current_microchips_ratio|%0]; [ai_race_current_microchips_status])\nComposites: [?ROOT.ai_race_current_composites_available|1] / [?ROOT.ai_race_current_composites_required|0] ([?ROOT.ai_race_current_composites_ratio|%0]; [ai_race_current_composites_status])\nOil: [?ROOT.ai_race_current_oil_available|1] / [?ROOT.ai_race_current_oil_required|0] ([?ROOT.ai_race_current_oil_ratio|%0]; [ai_race_current_oil_status])\n§YLimiting requirement§!: [ai_race_current_bottleneck]."
 AI_RACE_dashboard_benefits: "Operating effectiveness: §Y[?ROOT.ai_race_current_readiness|%1]§!\nBonuses: §G[?ROOT.ai_race_bonus|%1]§! each to research speed,\nproduction efficiency growth, and office income."
 AI_RACE_dashboard_ranking: "Quarterly rank: §Y[?ROOT.ai_race_rank|0]§! | Capability: §Y[?ROOT.ai_race_effective_capability|1]§!\nHover here for the capability breakdown.\nHistorical first finisher: §Y[ai_race_first_finisher_name]§!"
 AI_RACE_capability_breakdown_funded: "§HCapability breakdown§!\nNational capability after its cap: §Y[?ROOT.ai_race_capability_external|1]§!\nFunded stock: §Y[?ROOT.ai_race_capability_stock|1]§! | Usable at current readiness: §Y[?ROOT.ai_race_capability_funded_usable|1]§!\nEffective capability after the final cap: §Y[?ROOT.ai_race_effective_capability|1]§!"
 AI_RACE_capability_breakdown_unfunded: "§HCapability breakdown§!\nNational capability after its cap: §Y[?ROOT.ai_race_capability_external|1]§!\nEffective capability: §Y[?ROOT.ai_race_effective_capability|1]§!"
 AI_RACE_bottleneck_none: "No current bottleneck"
 AI_RACE_bottleneck_civs: "Civilian Factories"
 AI_RACE_bottleneck_network: "Network Infrastructure"
 AI_RACE_bottleneck_power: "Sustained power"
 AI_RACE_bottleneck_microchips: "Microchips"
 AI_RACE_bottleneck_composites: "Composites"
 AI_RACE_bottleneck_oil: "Oil"
 AI_RACE_dashboard_investment: "Next investment: §Y$[?ROOT.ai_race_offer_cost|1] billion§!\nNext-stage readiness: §Y[?ROOT.ai_race_offer_readiness|%1]§!\nOpen a review below for capacity and financing terms."
 AI_RACE_dashboard_financing: "§HOutstanding AI Financing§!: §Y$[?ROOT.ai_race_finance_outstanding|2] billion§!\nTotal repayment: §Y$[?ROOT.ai_race_finance_weekly|3] billion per week§!\n§HPrincipal Left / Original ($ bn); Weekly ($ bn); Payments Left§!\nResearch: [?ROOT.ai_race_finance_remaining_1|2] / [?ROOT.ai_race_finance_original_1|2]; [?ROOT.ai_race_finance_due_1|3]; [?ROOT.ai_race_finance_installments_1|0]\nImplementation: [?ROOT.ai_race_finance_remaining_2|2] / [?ROOT.ai_race_finance_original_2|2]; [?ROOT.ai_race_finance_due_2|3]; [?ROOT.ai_race_finance_installments_2|0]\nExpansion: [?ROOT.ai_race_finance_remaining_3|2] / [?ROOT.ai_race_finance_original_3|2]; [?ROOT.ai_race_finance_due_3|3]; [?ROOT.ai_race_finance_installments_3|0]\nFrontier AI: [?ROOT.ai_race_finance_remaining_4|2] / [?ROOT.ai_race_finance_original_4|2]; [?ROOT.ai_race_finance_due_4|3]; [?ROOT.ai_race_finance_installments_4|0]"
 AI_RACE_dashboard_rival: "§Y[?THIS.ai_race_rank|0].§! [THIS.GetNameWithFlag] | [ai_race_stage_name] | Capability [?THIS.ai_race_effective_capability|1]"
 AI_RACE_review_available_tt: "The next stage meets its date, technology, and previous-stage work requirements, and no investment review is pending. Treasury and bankruptcy checks apply when we confirm the purchase."
 AI_RACE_review_investment_tt: "Opens a free review of the upfront investment, each capacity requirement, and any Emergency AI Financing. We have seven days to confirm; an unanswered review defers the investment."
 AI_RACE_defer_investment_tt: "Defers the investment without spending treasury funds or creating financing. An unanswered review expires after seven days."
 AI_RACE_pay_direct_tt: "Pays §Y$[?ROOT.ai_race_quote_cost|2] billion§! from the treasury and starts the reviewed stage without new financing. The entry month does not count as completed stage work."
 AI_RACE_pay_financed_tt: "Pays §Y$[?ROOT.ai_race_quote_cost|2] billion§! from the treasury and starts the reviewed stage, with additional §YEmergency AI Financing§! repaid weekly. Stage work continues during a Capacity Shortfall, while the weakest physical requirement determines our benefits. The entry month does not count as completed stage work."
 AI_RACE_quote_capacity_tt: "§HQuoted Capacity: Available / Required§!\nCivilian Factories: [?ROOT.ai_race_quote_civs_available|0] / [?ROOT.ai_race_quote_civs_required|0] ([?ROOT.ai_race_quote_civs_ratio|%1]; [ai_race_quote_civs_status])\nNetwork Infrastructure: [?ROOT.ai_race_quote_network_available|0] / [?ROOT.ai_race_quote_network_required|0] ([?ROOT.ai_race_quote_network_ratio|%1]; [ai_race_quote_network_status])\nSustained power: [?ROOT.ai_race_quote_power_available|1] / [?ROOT.ai_race_quote_power_required|1] GW ([?ROOT.ai_race_quote_power_ratio|%1]; [ai_race_quote_power_status])\nMicrochips: [?ROOT.ai_race_quote_microchips_available|1] / [?ROOT.ai_race_quote_microchips_required|0] ([?ROOT.ai_race_quote_microchips_ratio|%1]; [ai_race_quote_microchips_status])\nComposites: [?ROOT.ai_race_quote_composites_available|1] / [?ROOT.ai_race_quote_composites_required|0] ([?ROOT.ai_race_quote_composites_ratio|%1]; [ai_race_quote_composites_status])\nOil: [?ROOT.ai_race_quote_oil_available|1] / [?ROOT.ai_race_quote_oil_required|0] ([?ROOT.ai_race_quote_oil_ratio|%1]; [ai_race_quote_oil_status])\n§YCapacity Shortfall§!: any requirement below 100%. The weakest requirement determines our operating effectiveness. Delivered imports count toward supply. Only undamaged buildings count; battery withdrawal cannot meet sustained power demand."
 AI_RACE_quote_financing_tt: "§HEmergency AI Financing§!\nAvailable when we have a Capacity Shortfall, in addition to the upfront investment.\nUpfront investment: §Y$[?ROOT.ai_race_quote_cost|2] billion§!\nApproval-time GDP: §Y$[?ROOT.ai_race_quote_gdp|2] billion§!\nFixed amount financed: §Y$[?ROOT.ai_race_quote_principal|2] billion§!, equal to §Y[?ROOT.ai_race_quote_rate|%1]§! of approval-time GDP.\nRepayment: §Y$[?ROOT.ai_race_quote_payment|3] billion per week§! for §Y520 weekly installments§! over the ten-year term. The final installment settles the exact amount remaining.\nEach package adds its own weekly payment. Repairs, inflation, and later GDP changes do not change the approved principal or cancel repayments. A changed quote requires a fresh review and charges nothing."
 ai_race.10.t: "Frontier AI Achieved"
 ai_race.10.d: "Our national AI programme has reached Frontier AI. Our researchers and industry have achieved a milestone that now depends on sustained national support."
 ai_race.10.a: "Recognize the achievement."
 ai_race.11.t: "Investment Review No Longer Valid"
 ai_race.11.d: "The investment can no longer proceed on the terms reviewed. No funds were charged and no financing package was created. We can request a fresh review through the AI Race decisions when the entry requirements are met."
 ai_race.11.a: "Reconsider the proposal."
 ai_race_news.1.t: "A First in Frontier AI"
 ai_race_news.1.d: "[?global.ai_race_first_finisher_id.GetName] has become the first country to achieve Frontier AI. Its researchers and industrial partners have secured a lasting place in the history of artificial intelligence, while competing national programmes continue their work."
 ai_race_news.1.a: "The race continues."
 AI_RACE_review_research: "Review Research Investment"
 AI_RACE_review_research_desc: "Review the $50 billion Research investment at no cost. Entry is available from January 2016 after we research Modern Deep Learning. Research requires 36 completed months before we can advance."
 ai_race.1.t: "Research Investment Review"
 ai_race.1.d: "Our research institutions have proposed a national programme to bring advanced artificial intelligence out of isolated experiments. The proposal now awaits an investment decision."
 ai_race.1.a: "Defer the investment."
 ai_race.1.b: "Invest $[?ROOT.ai_race_quote_cost|1] billion from the treasury."
 ai_race.1.c: "Invest with Emergency AI Financing."
 AI_RACE_review_implementation: "Review Implementation Investment"
 AI_RACE_review_implementation_desc: "Review the $150 billion Implementation investment at no cost. Entry is available from January 2019 after we research Modern Deep Learning and complete 36 months of Research. Implementation requires 60 completed months before we can advance."
 ai_race.2.t: "Implementation Investment Review"
 ai_race.2.d: "Our research programme has laid the groundwork for wider deployment. Industry and public institutions have proposed the next national investment."
 ai_race.2.a: "Defer the investment."
 ai_race.2.b: "Invest $[?ROOT.ai_race_quote_cost|1] billion from the treasury."
 ai_race.2.c: "Invest with Emergency AI Financing."
 AI_RACE_review_expansion: "Review Expansion Investment"
 AI_RACE_review_expansion_desc: "Review the $400 billion Expansion investment at no cost. Entry is available from January 2024 after we research Human Imitation AI and complete 60 months of Implementation. Expansion requires 12 completed months before we can advance."
 ai_race.3.t: "Expansion Investment Review"
 ai_race.3.d: "Artificial intelligence is becoming a national undertaking with growing demands on industry and infrastructure. Our expansion proposal brings these ambitions together for review."
 ai_race.3.a: "Defer the investment."
 ai_race.3.b: "Invest $[?ROOT.ai_race_quote_cost|1] billion from the treasury."
 ai_race.3.c: "Invest with Emergency AI Financing."
 AI_RACE_review_frontier: "Review Frontier AI Investment"
 AI_RACE_review_frontier_desc: "Review the $1,000 billion Frontier AI investment at no cost. Entry is available from January 2025 after we research Human Imitation AI and complete 12 months of Expansion. Frontier AI completes the national race; later AI technologies retain their own research dates and effects."
 ai_race.4.t: "Frontier AI Investment Review"
 ai_race.4.d: "Our national programme is approaching the frontier of the AI race. A final investment proposal sets out the capacity required to sustain that position."
 ai_race.4.a: "Defer the investment."
 ai_race.4.b: "Invest $[?ROOT.ai_race_quote_cost|1] billion from the treasury."
 ai_race.4.c: "Invest with Emergency AI Financing."
 AI_RACE_refresh_assessment: "Refresh Assessment"
 ai_race_operating_modifier: "National AI Programme"
 ai_race_operating_modifier_desc: "Our funded AI programme draws on national industry, electricity, and material supply. Its benefits depend on the capacity we can sustain."
 ai_race_applied_power: "AI Power Requirement"
 ai_race_applied_microchips: "AI Microchip Requirement"
 ai_race_applied_composites: "AI Composite Requirement"
 ai_race_applied_oil: "AI Oil Requirement"
 AI_RACE_stage_work_pending: "Work begins after we fund Research."
 AI_RACE_stage_work_progress: "Stage work: §Y[?ROOT.ai_race_stage_months|0] / [?ROOT.ai_race_current_required_months|0] months§!"
 AI_RACE_stage_work_terminal: "Frontier AI achieved. No further race stage."
 AI_RACE_capacity_pending: "No stage has been funded.\nReview Research to see its capacity requirements."
 AI_RACE_benefits_pending: "No stage benefits are active."
 AI_RACE_investment_complete: "All race stages are complete.\nMaintain capacity to sustain our benefits.\nOutstanding financing remains payable."
 AI_RACE_outcomes_only: "Outcomes Only: national capability and rankings are assessed.\nStage investments and financing are disabled."
 AI_RACE_capacity_ready: "§GReady§!"
 AI_RACE_capacity_shortfall: "§RShortfall§!"
 AI_RACE_dashboard_leaderboard_hint: "The world leaderboard is in International Systems, under The AI Race."

 AI_RACE_GUI_LEDGER_TT: "§YThe AI Race§!"
 AI_RACE_GUI_LEDGER_TT_DELAYED: "Track the world race to frontier AI: every participant's stage and capability, and who finishes first."
 IS_title_ai_race: "THE AI RACE"
 AI_RACE_tab_status_off: "The AI Race is turned off in this game's rules."
 AI_RACE_tab_status_upcoming: "The race begins in January 2016. Every country that has researched Modern Deep Learning joins it, and stage investments open then."
 AI_RACE_tab_status_empty: "No country has joined the race yet. A country joins once it has researched Modern Deep Learning."
 AI_RACE_tab_status_full: "Every participant is ranked each quarter by stage, completed stage work and capability.\nFirst to Frontier AI: §Y[ai_race_first_finisher_name]§!"
 AI_RACE_tab_status_outcomes: "Outcomes Only: participants are ranked each quarter by capability. Stage investments are off in this game's rules."
 AI_RACE_tab_leaderboard: "World Leaderboard"
 AI_RACE_tab_status_tt: "From January 2016, every country that has researched §YModern Deep Learning§! joins the race. Rankings are recalculated every quarter."
 AI_RACE_tab_leaderboard_tt: "Countries are ranked by stage first, then by completed work toward the next stage, then by §YCapability§!.\nThe stages are §YResearch§!, §YImplementation§!, §YExpansion§! and §YFrontier AI§!. Capability is lowered when a country runs short of the factories, network, power or materials its stage needs."
 AI_RACE_tab_help_tt: "§YThe AI Race§!\nFrom 2016, countries with Modern Deep Learning can fund four national AI stages. Each stage costs an upfront investment and needs civilian factories, Network Infrastructure, power, microchips, composites and oil. Funded stages raise research speed, production efficiency growth and office income."
 AI_RACE_tab_help_tt_delayed: "Manage your own program in §YDecisions§!, under §YThe AI Race§!: your stage, the six requirements, financing and the stage reviews. This tab shows the world leaderboard. The race can be set to Full, Outcomes Only or Off in the game rules."
