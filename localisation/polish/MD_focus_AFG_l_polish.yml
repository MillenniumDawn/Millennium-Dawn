 AFG_invest_investment_tt: "§RRwymaga zgody§! z zaproszonych krajów, szanse na akceptację zależą od §Gour relacji z nimi§! oraz §Nasza sytuacja w zakresie bezpieczeństwa wewnętrznego§!.\n"
