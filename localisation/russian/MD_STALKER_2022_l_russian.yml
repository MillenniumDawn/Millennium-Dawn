l_russian:
 STALKER.30.t: "Битва за Зону"
 STALKER.30.d: "Новый шторм выброса открыл пути к сердцу Зоны в [STALKER_zone_name], и все группировки наперегонки рвутся к центру: «Варта», «Искра», возродившийся «Монолит» и одиночка, которого остальные зовут Скифом. Пока они сражаются, наш периметр рушится."
 STALKER.30.a: "Ввести армию."
 STALKER.30.a_tt: "Стоит §R50§! политической власти или §R25§!, если влияние военных не ниже §Y40§!. §YСдерживание§! Зоны растёт на §G20§!, а число §Yсталкеров§! падает до §Y10§!. Армия запечатывает восьмую капсулу, восстанавливает активность и число сталкеров и не даёт Зоне распространиться по миру."
 STALKER.30.b: "Поддержать «Варту»."
 STALKER.30.b_tt: "§YСдерживание§! и §Yэксплуатация§! Зоны растут на §G10§! каждое, а влияние §Y«Свободы»§! падает до §Y10§!. Если возьмёт верх подход «Варты», выбор Скифа у восьмой капсулы приведёт к мировым Зонам, которые с самого начала лучше сдержаны и менее активны. §Y«Варта»§! получает §G15§! влияния."
 STALKER.30.c: "Пусть сталкеры решат сами."
 STALKER.30.c_tt: "Число §Yсталкеров§! растёт на §Y10§!, а влияние §Yбандитов§! — на §R10§!. Если периметр рухнет и Скиф войдёт в восьмую капсулу, мировые Зоны с самого начала будут активнее и хуже сдержаны. §Y«Искра»§! получает §Y10§! влияния."
 STALKER.30.a_tt_contained: "Стоит §R50§! политической власти или §R25§!, если влияние военных не ниже §Y40§!. §YСдерживание§! Зоны растёт на §G20§!, а число §Yсталкеров§! падает до §Y10§!. Армия запечатывает восьмую капсулу, и Зона остаётся на Украине."
 STALKER.30.e: "Поддержать Стрелка."
 STALKER.30.e_tt: "Доступно, потому что Стрелок отключил О-Сознание в 2012 году и выжил. Он не даёт Скифу войти в восьмую капсулу. Активность исходной Зоны резко падает, и новые Зоны за рубежом не появляются."
 STALKER.30.b_tt_contained: "§YСдерживание§! и §Yэксплуатация§! Зоны растут на §G10§! каждое, а влияние §Y«Свободы»§! падает до §Y10§!. Если возьмёт верх подход «Варты» при отключённых мировых Зонах, выбор Скифа оставит кризис на Украине. §Y«Варта»§! получает §G15§! влияния."
 STALKER.30.c_tt_contained: "Число §Yсталкеров§! растёт на §Y10§!, а влияние §Yбандитов§! — на §R10§!. Если периметр рухнет и Скиф войдёт в восьмую капсулу при отключённых мировых Зонах, новые Зоны за рубежом не появятся. §Y«Искра»§! получает §Y10§! влияния."
 STALKER.31.t: "Скиф входит в восьмую капсулу"
 STALKER.31.d: "В сердце Зоны сталкер по прозвищу Скиф пошёл против Стрелка, пощадил доктора Кайманова, которого называют Доктором, и вошёл в восьмую капсулу О-Сознания. Он дал Зоне её волю. В течение часа учёные по всему миру фиксируют одинаковые показания: Зона больше не привязана к Чернобылю."
 STALKER.31.a: "Что теперь будет?"
 STALKER.32.t: "Аномалии по всему миру"
 STALKER.32.d: "Правительства на всех континентах сообщают об аномальной активности: мёртвые птицы, лежащие кругами, вращающиеся стрелки компасов, целые сёла без радиосвязи. Совет Безопасности ООН созвал экстренное заседание, и ни одна делегация пока не знает, чего просить."
 STALKER.32.d_ward: "Правительства на всех континентах сообщают об аномальной активности. «Варта» консультирует новые администрации Зон по сдерживанию и доступу, пока национальные учёные координируют ответ."
 STALKER.32.d_stalkers: "Правительства на всех континентах сообщают об аномальной активности. Общего плана сдерживания нет, и сети сталкеров вместе с местными властями импровизируют, пока контрабандисты наперегонки спешат к новым участкам."
 STALKER.32.a: "Теперь Зона повсюду."
 STALKER.33.t: "После восьмой капсулы"
 STALKER.33.d: "Что бы ни сделал Скиф в сердце Зоны, в [STALKER_zone_name] стало опаснее, чем когда-либо. Наши генералы хотят нового периметра; наши учёные говорят, что миру понадобится всё, что они узнают внутри."
 STALKER.33.a: "Восстановить периметр."
 STALKER.33.a_tt: "Стоит §R50§! политической власти. §YСдерживание§! Зоны растёт на §G20§!."
 STALKER.33.b: "Открыть Зону для учёных всего мира."
 STALKER.33.b_tt: "§YЭксплуатация§! Зоны растёт на §G15§!, усиливая наши исследования Зоны."
 STALKER.31.d_contained: "В сердце Зоны сталкер по прозвищу Скиф пошёл против Стрелка, пощадил доктора Кайманова, которого называют Доктором, и вошёл в восьмую капсулу О-Сознания. Зона ударила по всему северу Украины, но приборы за рубежом не фиксируют ничего необычного."
 STALKER.33.d_known: "В наших документах по проекту X описывалась связь между восьмой капсулой и ноосферой. Скиф пощадил доктора Кайманова и вошёл в капсулу, и теперь приборы в [STALKER_zone_name] показывают ту картину, которой боялись наши следователи. Уцелевшие документы могут помочь нам ограничить ущерб здесь."
 STALKER.33.c: "Применить материалы проекта X по сдерживанию."
 STALKER.33.c_tt: "Сдерживание Зоны растёт до §G15§!, эксплуатация — до §G10§!, а активность падает до §G10§!. Доступно, потому что мы завершили расследование в лаборатории X."
 STALKER.36.t: "Восьмая капсула запечатана"
 STALKER.36.d: "Армия перекрыла путь к восьмой капсуле, и сдерживание вокруг Зоны стабилизируется. Украинские приборы всё ещё фиксируют аномальную активность, но станции наблюдения за рубежом не сообщают о новых Зонах."
 STALKER.36.a: "Периметр держится."
 STALKER.39.t: "Стрелок кончает с Зоной"
 STALKER.39.d: "Стрелок добрался до восьмой капсулы раньше Скифа и уничтожил её. Исходная Зона никуда не делась, но её активность резко упала, а станции наблюдения за рубежом не сообщают о новых Зонах."
 STALKER.39.a: "Он сделал то, что не смогла армия."
 STALKER.38.t: "Первая годовщина Зоны"
 STALKER.38.d_military: "Через год после того, как Зону запечатали, кордон в [STALKER_zone_name] всё ещё держится. Мы можем сохранить аномальную территорию под военным контролем или разрешить лицензированные исследования внутри периметра."
 STALKER.38.d_ward: "Вмешательство «Варты» в 2022 году вынесло влияние Зоны за пределы Украины, и её исследовательский консорциум теперь хочет постоянного мандата. Мы должны выбрать: подчинить эту работу общим правилам сдерживания или расширить доступ к Зоне."
 STALKER.38.d_ward_contained: "Чернобыльская Зона остаётся единственным известным аномальным участком, и НИИЧАЗ, частной армией которого является «Варта», хочет постоянного исследовательского мандата. Мы должны выбрать: подчинить эту работу правилам сдерживания или расширить доступ к Зоне."
 STALKER.38.d_stalkers: "После битвы 2022 года правительства с трудом сдерживают новые Зоны, а сталкеры и местные группировки научились в них выживать. Мы можем договориться с этими группами или восстановить чрезвычайные полномочия до следующего выброса."
 STALKER.38.d_stalkers_contained: "Чернобыльская Зона остаётся единственным известным аномальным участком, но её ослабленный периметр открыл пути местным сталкерам. Мы можем договориться с этими группами или восстановить чрезвычайные полномочия до следующего выброса."
 STALKER.38.d_default: "Битва за Зону осталась на год позади, но исходная Зона по-прежнему нестабильна. Мы должны решить, сколько власти сохранит государство и как далеко могут зайти исследования."
 STALKER.38.a: "Сохранить военный кордон."
 STALKER.38.a_tt: "Сдерживание растёт до §G10§!, влияние «Долга» — до §G5§!. Активность и влияние бандитов падают до §G10§! каждое."
 STALKER.38.b: "Разрешить контролируемые исследования."
 STALKER.38.b_tt: "Эксплуатация растёт до §G10§!, число сталкеров — до §G5§!, влияние «Свободы» — до §G5§!, а влияние «Долга» падает до §G5§!."
 STALKER.38.c: "Принять протоколы сдерживания «Варты»."
 STALKER.38.c_tt: "Влияние «Долга» и сдерживание растут до §G10§! каждое. Влияние бандитов падает до §G10§!, а эксплуатация — до §G5§!."
 STALKER.38.d: "Расширить международный исследовательский мандат."
 STALKER.38.d_tt: "Эксплуатация растёт до §G10§!, число сталкеров — до §G5§!, влияние «Свободы» — до §G5§!, активность — до §R5§!, а сдерживание падает до §R5§!."
 STALKER.38.e: "Договариваться напрямую с группами сталкеров."
 STALKER.38.e_tt: "Влияние «Свободы», число сталкеров и эксплуатация растут до §G10§! каждое, а сдерживание падает до §R10§!."
 STALKER.38.f: "Восстановить чрезвычайные полномочия."
 STALKER.38.f_tt: "Влияние «Долга» растёт до §G10§!, сдерживание — до §G15§!. Активность и число сталкеров падают до §G10§! и §G5§! соответственно."
 STALKER.38.g: "Сохранить нынешний баланс."
 STALKER.38.g_tt: "Сдерживание растёт до §G5§!, а активность падает до §G5§!."
 STALKER.38.d_strelok: "Через год после того, как Стрелок уничтожил восьмую капсулу, Зона в [STALKER_zone_name] — уже шрам, а не буря. Но то, что осталось, всё равно нужно удерживать."
 STALKER.38.h: "Удерживать то, что осталось."
 STALKER.38.h_tt: "Сдерживание растёт до §G10§!, а активность падает до §G5§!."