 module_vls_sub_asm_5_desc: "차세대 VLS 대함 미사일 플랫폼은 은밀성, 기동성, 전자전 저항력을 강조하여 분쟁 환경에서의 생존성과 타격 성공률을 크게 높입니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sub_asm_6: "VLS 대함 미사일 VI"
 module_vls_sub_asm_6_desc: "최첨단 VLS 대함 미사일 체계는 해군 타격 기술의 정점으로서 지능형 조준, 극한의 속도, 첨단 대응책 저항력을 결합하여 가장 정교한 함대조차 압도합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
 module_vls_sub_asm_7: "VLS 대함 미사일 VII"
 module_vls_sub_asm_7_desc: "하이퍼 첨단 VLS 대함 미사일 체계는 해군 타격 기술의 정점으로서 지능형 조준, 극한의 속도, 첨단 대응책 저항력을 결합하여 가장 정교한 함대조차 압도합니다.\n\n§G설계 힌트: 이 모듈은 대함 공격력과 대함 관통력, 그리고 체력을 높여 주지만 IC 비용이 증가합니다.§!"
