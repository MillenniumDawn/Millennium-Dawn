 GER_idea_german_order3: "Programa Wunderwaffe"
 GER_war_machine: "Máquina de Guerra Alemã"
 GER_against_migrant: "Política Anti-Migrante"
 GER_idea_volmer_erlass1: "Volmer Erlass"
 GER_idea_volmer_erlass2: "Decreto Volmer"
 GER_idea_volmer_erlass3: "Decreto Volmer"
 german_legacy: "Legado Alemão"
 german_legacy_desc: "§YRegras Especiais:§!\n---\n§RNão podemos ter§! §6Doutrina Nuclear§! §Rnem desenvolver§! §6armas nucleares!§!\n---\n§RNão podemos aumentar manualmente nossos gastos militares!§!\n---\n§ROs militares são limitados a 370.000 Efetivos Ativos (240.000 no exército)!§!\n---\n§RNão podemos aumentar manualmente nossa administração!§!\n---\n§YCDU/CSU e SPD§! sempre podem formar coalizão.\n---\n§YPode§! §RBanir§! §Ypartidos extremistas§!\n---\nCom o peso dos crimes de guerra nazistas sobre os ombros, e como instigadora da 1ª e da 2ª Guerra Mundial, a Alemanha trabalhou arduamente para destruir sua má imagem, abstendo-se até de insinuar qualquer visão nacionalista ou militarista. Em termos legais, a Alemanha está vinculada ao Tratado de 1990 sobre a 'Regulamentação Final com Respeito à Alemanha', entre a Alemanha e as potências aliadas Rússia, Estados Unidos, Reino Unido e França, bem como a um tratado de fronteira final separado com a Polônia.\nEsse tratado torna ilegal para a Alemanha fazer reivindicações territoriais, possuir armas nucleares e limita suas forças armadas a menos de 370.000 efetivos (220.000 no jogo) no total.\n§W--------------§!\nEste espírito nacional pode ser §RRemovido§! se concluirmos o Foco §HNosso Novo Legado§!."
 GER_idea_johannes_rau: "Presidente Federal Johannes Rau"
 GER_idea_roman_herzog: "Presidente Federal Roman Herzog"
 GER_idea_bmw_company: "Contrato BMW"
 GER_idea_bmw_company_desc: "A BMW foi parcialmente subcontratada para fornecer peças essenciais, equipamentos e manutenção para as frotas de veículos utilitários da Bundeswehr."
 GER_idea_mercedes_benz_company: "Contrato Mercedes-Benz"
 GER_idea_mercedes_benz_company_desc: "A Mercedes-Benz foi parcialmente subcontratada para fornecer peças essenciais, equipamentos e manutenção para as frotas de veículos utilitários da Bundeswehr."
 GER_idea_rhineland_industry: "Indústria da Renânia"
 GER_idea_rhineland_industry_desc: "A Renânia-Pfalz é uma das regiões industriais e de construção centrais do país, além de ser uma das maiores exportações de recursos naturais como aço e carvão do país."
 GER_idea_war_reparations: "Dívida de reparações de guerra"
 GER_idea_war_reparations_desc: "O passado dos crimes anteriores da Alemanha ao longo da 1ª e da 2ª Guerra Mundial ainda paira sobre sua cabeça, assim como sua enorme dívida de reparações de guerra devida aos Aliados.\nLevará anos para quitar essa dívida; estimamos que será por volta de §YOutubro de 2010§! até que esteja totalmente paga.\n§W--------------§!\nEste espírito nacional será §Gremovido automaticamente§! quando tivermos §YQuitado Nossa Dívida de Guerra§!, ou podemos §RRemovê-lo§! concluindo o Foco §HFim das Reparações de Guerra§!."
 GER_idea_renewable_energy_projects_phase_one: "Projetos de Energia Renovável: Fase 1"
 GER_idea_renewable_energy_projects_phase_one_desc: "À medida que a Alemanha se afasta cada vez mais da energia convencional e segue o caminho da energia verde, começamos a lançar as bases para um futuro mais verde à medida que começa a 'Fase Um' dos projetos de energia renovável da Alemanha."
 GER_idea_renewable_energy_projects_phase_two: "Projetos de Energia Renovável: Fase 2"
 GER_idea_renewable_energy_projects_phase_two_desc: "À medida que fornecemos mais fundos e apoio contínuo para uma Alemanha mais verde, começa a 'Fase 2' dos projetos de energia renovável. "
 GER_idea_renewable_energy_projects_complete: "Projetos de Energia Renovável"
 GER_idea_renewable_energy_projects_complete_desc: "A Alemanha é agora uma das nações mais verdes da Europa. Com os nossos recentes investimentos em biomassa, energia solar e parques eólicos on-shore e offshore, a Alemanha concluiu os seus extensos projectos de energia renovável que fornecerão à nação uma energia mais limpa durante as próximas décadas. "
 GER_idea_carbon_neutral: "Nação de Energia Renovável"
 GER_idea_carbon_neutral_desc: "À medida que a Alemanha se torna um país totalmente dependente de energia renovável e abandona os combustíveis fósseis, a nação planeja deixar para trás os antigos meios de produção de energia.\n\n§YNão seremos mais uma§! §GNação de Energia Renovável§! §Yse tivermos o status de§! §6Energia Nuclear§!§Y!§!"
 GER_idea_nationalised_energy_companies: "Empresas Nacionalizadas de Energia"
 GER_idea_nationalised_energy_companies_desc: "Ao longo dos anos, as empresas privadas de energia roubaram o povo alemão como resultado da sua ganância. É hora de o governo alemão retomar o controle e fornecer ao povo preços de energia justos."
 GER_idea_nuclear_power_country: "Movido a energia nuclear"
 GER_idea_nuclear_power_country_desc: "A Alemanha se tornou a potência nuclear da Europa, funcionando com energia nuclear limpa, nada dessa bobagem solar!\n\n§YNão seremos mais um§! §6Movimentado Nuclear§! §Ynação se§! §GO Verde Partido§! §Yestão no poder ou em uma coalizão§! §You se removermos nossa§! §6Energia Nuclear§! §Ystatus!§!"
 GER_idea_aging_population: "Envelhecimento da População"
 GER_idea_aging_population_desc: "With our aging national population, we are in a decline in population growth and increased budget on our civil services.\n§W--------------§!\nThis national spirit can be §RRemoved§! if we complete the §HStiff Competition§! Focus, or the §HAdopt China's Policy§! Focus"
 GER_idea_increased_population_growth: "Aumento do crescimento populacional"
 GER_increased_population_growth_idea_desc: "Com o recente aumento nas vendas de medicamentos, o aumento da população também sentiu o efeito."
 GER_idea_nuclear_expansion1: "Expansão Nuclear"
 GER_idea_nuclear_expansion2: "Expansão Nuclear"
 GER_idea_nuclear_expansion3: "Expansão Nuclear"
 GER_idea_nuclear_expansion4: "Expansão Nuclear"
 GER_idea_nuclear_expansion5: "Expansão Nuclear"
 GER_idea_stagnating_economy1: "Economia Estagnada"
 GER_idea_stagnating_economy1_desc: "Nossa economia atingiu um patamar e está passando por um período de pouco ou nenhum crescimento."
 GER_idea_unemployment_crisis: "Crise de desemprego"
 GER_idea_unemployment_crisis_desc: "The Unemployment rate has been entangled with the conditions brought about by the impact of economic challenges from post unification of germany, the persistence of a rigid labor market, and demographic factors.\n§W--------------§!\nThis national spirit can be §RRemoved§! if we complete the §HEin Aktives Deutschland§! Focus or the §HEin Digitales Deutschland§! Focus."
 GER_idea_okosteuer: "Ecotaxa"
 GER_idea_okosteuer_desc: "O Ökosteuer (Ecoimposto) é uma forma de imposto ambiental introduzido para ajudar a cumprir as leis e metas ambientais da UE. É direcionado a grandes indústrias para cobrir os custos dos danos ambientais causados pelo consumo de energia, ou seja, eletricidade, queima de combustíveis fósseis etc.\n§W--------------§!\nEste espírito nacional pode ser §RRemovido§! se concluirmos o Foco §HCampanha Contra a UE§! ou §HCruzada Contra a Democracia§!."
 GER_idea_germany_divided: "Divisão Leste-Oeste"
 GER_idea_germany_divided_desc: "Embora o Leste e o Oeste da Alemanha tenham sido reunificados em 1990, ainda há uma divisão perceptível tanto nos aspectos sociais quanto de infraestrutura.\n§W--------------§!\nEste espírito nacional pode ser §RRemovido§! se concluirmos o Foco §HVerdadeira Unificação§!, construirmos §H4 de Infraestrutura§! nos Estados do Leste e alcançarmos §H1000 de Produtividade§! nesses estados."
 GER_idea_fuck_versailles: "Vingança por Versalhes"
 GER_idea_fuck_versailles_desc: "O Tratado de Versalhes foi uma farsa e destruiu a Alemanha econômica e moralmente. Os termos do tratado foram um ataque ao nosso povo e ao nosso sustento, e não vamos tolerá-lo!\nEsses termos e condições serão ignorados!\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos §YO Kaiser§! no poder!."
 GER_idea_crusade_against_democracy: "Cruzada Contra a Democracia"
 GER_idea_crusade_against_democracy_desc: "A democracia é a praga do 'Experimento Americano', nada além de uma farsa, e precisa ser detida!\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos §YO Kaiser§! no poder!."
 GER_idea_extended_work_hours: "Cotas de Trabalho Pesado"
 GER_idea_extended_work_hours_desc: "O Império não tem tempo para preguiçosos! Precisamos de indivíduos fortes e trabalhadores para manter a produção do Império fluindo sem problemas.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos §YO Kaiser§! no poder!."
 GER_idea_Leopard_Nutzergemeinschaft: "Comunidade LeoBen"
 GER_idea_volk: " \"O Povo\" "
 GER_idea_volk_desc: "Somos um partido voltado a cuidar do povo, e é isso que fazemos. Recentemente impulsionamos uma série de políticas para aumentar a produtividade da nação, gerando mais empregos e vagas para quem procura trabalho.\nEste espírito nacional será §RRemovido§! se não tivermos a §YAfD§! no poder"
 GER_idea_vaterland: " \"A Pátria\" "
 GER_idea_vaterland_desc: "Um dos valores centrais do nosso partido é proteger a identidade alemã. Garantir que tenhamos militares fortes assegurará que possamos proteger essa identidade daqueles que se opõem a nós.\nEste espírito nacional será §RRemovido§! se não tivermos a §YAfD§! no poder"
 GER_idea_german_heritage: "Orgulhosa herança alemã"
 GER_idea_german_heritage_desc: "Se há algo de que nós, alemães, nos orgulhamos, é da nossa herança. Dos Volkswagens à Oktoberfest, somos mesmo um povo orgulhoso!\nEste espírito nacional será §RRemovido§! se não tivermos a §YAfD§! no poder"
 GER_idea_anti_lgbt: "Anti-LGBT"
 GER_idea_anti_lgbt_desc: "Os LGBT são prejudiciais à nossa sociedade e aos nossos filhos; isso não é algo que deva ser pregado aos nossos cidadãos.\nEste espírito nacional será §RRemovido§! se não tivermos a §YAfD§! no poder"
 GER_idea_sustainable_development: "Desenvolvimento Sustentável"
 GER_idea_sustainable_development_desc: "Somos um país verde e estamos comprometidos em reduzir nossa pegada de carbono e construir uma infraestrutura sustentável."
 GER_idea_greater_regulations: "Regulamentos mais rígidos"
 GER_idea_greater_regulations_desc: "Mais regulamentações oferecem aos trabalhadores e cidadãos melhor proteção social e mais direitos trabalhistas.\nEste espírito nacional será §RRemovido§! se não tivermos §YOs Verdes§! no poder ou na coalizão!"
 GER_idea_duetch_reichsban: "Contratos da Deutsche-Bahn"
 GER_idea_duetch_reichsban_desc: "A Deutsche-Bahn foi contratada para expandir a rede ferroviária alemã."
 GER_idea_decreased_population_growth: "Diminuição do crescimento populacional"
 GER_idea_decreased_population_growth_desc: "Com a adoção de certas políticas, mantivemos uma gestão rigorosa do crescimento populacional e agora está diminuindo."
 GER_idea_free_market_economy: "Economia de Mercado Livre"
 GER_idea_free_market_economy_desc: "Operamos nossa economia sob princípios de livre mercado, permitindo uso livre a qualquer pessoa.\nEste espírito nacional será §RRemovido§! se não tivermos o §YFDP§! no poder ou na coalizão!"
 GER_idea_stern_nato_commitment: "OTAN comprometida"
 GER_idea_stern_nato_commitment_desc: "Somos um membro orgulhoso e comprometido da OTAN\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos o §YFDP§! no poder ou na coalizão!."
 GER_idea_cybersecurity: "Segurança Cibernética"
 GER_idea_cybersecurity_desc: "A Alemanha possui um firewall de cibersegurança rigoroso para impedir ataques de segurança de agressores estrangeiros.\nEste espírito nacional será §RRemovido§! se não tivermos o §YFDP§! no poder ou na coalizão!"
 GER_idea_pacifist_nation: "Nação Pacifista"
 GER_idea_pacifist_nation_desc: "A Alemanha já causou danos suficientes ao mundo no passado; hoje pegamos a flor e pedimos paz.\nEste espírito nacional será §RRemovido§! se não tivermos o §YDie Linke§! no poder!"
 GER_idea_bmvi: "BMVI"
 GER_idea_bmvi_desc: "O Ministério Federal de Assuntos Digitais e Transportes\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos a §YCDU/CSU§! no poder!."
 GER_idea_farming_practices: "Práticas agrícolas"
 GER_idea_farming_practices_desc: "Nossa nação possui vastos campos e planícies de terras agrícolas utilizáveis, e essas novas práticas nos permitirão aproveitá-las ao máximo.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos a §YCDU/CSU§! no poder!."
 GER_idea_european_values: "Valores Europeus"
 GER_idea_european_values_desc: "Como membro da União Europeia, respeitamos os Valores Europeus.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos a §YCDU/CSU§! no poder!."
 GER_idea_agenda: "Agenda de 2010"
 GER_idea_agenda_desc: "A Agenda 2010 é a visão de 10 anos para a Alemanha de onde esperamos que ela esteja em 2010.\n§W--------------§!\nEste espírito nacional será §RRemovido§! se não tivermos o §YSPD§! no poder!."
 GER_idea_german_order: "Ordem Alemã"
 GER_idea_german_order_desc: "A ordem alemã deve ser mantida para restaurar nossa nação à sua antiga glória.\nEste espírito nacional será §RRemovido§! se não tivermos o §YNPD§! no poder!"
 GER_idea_pride_in_history: "História orgulhosa"
 GER_idea_pride_in_history_desc: "Somos alemães e temos orgulho disso! Nada pode nos impedir de nos orgulhar de nossa história e do que conquistamos.\nEste espírito nacional será §RRemovido§! se não tivermos o §YNPD§! no poder!"
 GER_idea_retention_law_comm: "Lei de Retenção de Telecomunicações"
 GER_idea_retention_law_comm_desc: "Manter os dados de nossos cidadãos arquivados por um tempo significa que podemos acompanhar o que nosso pessoal está fazendo e vendo..."
 GER_idea_formidable_army: "Exército Formidável"
 GER_idea_formidable_army_desc: "O poder do nosso exército esmagará os inimigos da nossa nação sob a sola da nossa bota!"
 GER_idea_kebab_withdrawl: "Retirada de Kebab"
 GER_idea_kebab_withdrawl_desc: "Com a recente deportação de turcos-alemães, não há ninguém para administrar as lojas de kebab e nossos cidadãos estão sentindo os efeitos."
 GER_idea_crackheads: "Vício desenfreado em crack"
 GER_idea_crackheads_desc: "Desde a legalização de todas as drogas em [THIS.GetName], uma nova epidemia de vício em crack surgiu nas comunidades mais pobres.\n§W--------------§!\nEste espírito nacional pode ser §RRemovido§! se tivermos §HSaúde Universal Avançada§!."
