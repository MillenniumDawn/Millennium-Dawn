 mercosur.02.t: "메르코수르 준회원국 가입 초청"
 mercosur.02.d: "[FROM.GetName]이(가) 우리에게 메르코수르 준회원국으로 가입하자는 제안을 해 왔습니다. 이 제안은 정회원 가입에는 미치지 못하지만, 옛 야망을 되찾으려 분명히 애쓰고 있는 블록의 궤도 안에 우리를 놓게 될 것입니다. 수락한다면 우리의 미래가 적어도 부분적으로는 남아메리카 사업과 묶여 있음을 알리는 신호가 될 것입니다."
 mercosur.02.a: "준회원 지위를 수락한다."
 mercosur.02.b: "당분간은 거절한다."
 mercosur.03.t: "준회원 가입 수락"
 mercosur.03.d: "[FROM.GetName]이(가) 우리의 초청을 수락하고 메르코수르 준회원국으로 가입하기로 합의했습니다. 문서상으로는 소박한 걸음이지만 정치적으로는 의미가 큽니다. 또 하나의 수도가 블록에서 완전히 떨어져 있기보다 가까이 머무는 편이 안전하다고 판단한 것입니다."
 mercosur.03.a: "훌륭하다."
 mercosur.04.t: "준회원 가입 거절"
 mercosur.04.d: "[FROM.GetName]이(가) 적어도 지금은 우리의 제안을 외면했습니다. 그 정부는 얽히기보다 거리를 두는 쪽을 선호하며, 더 긴밀한 제휴에 대한 관심이 있었더라도 신중함을 넘어설 만큼 강하지 않았습니다. 문은 열려 있지만 나중에 다시 밀어야 할 것입니다."
 mercosur.04.a: "유감이다."
 mercosur.05.t: "정회원 가입 협상 개시"
 mercosur.05.d: "[CHL.GetName]과(와)의 공식 협상이 시작되었습니다. 이 협상이 성공한다면 메르코수르는 단지 대륙적 중요성을 주장하는 데 그치지 않고, 또 하나의 국가를 제도 안으로 온전히 끌어들임으로써 이를 입증할 것입니다."
 mercosur.05.a: "진행한다."
 mercosur.06.t: "정회원 가입 초청"
 mercosur.06.d: "[FROM.GetName]이(가) 메르코수르 정회원 가입 문제를 이번에 매듭짓자고 우리를 초청했습니다. 즉시 가입할 수도 있고, 최종 단계에 앞서 더 폭넓은 지원과 준비 패키지를 요구할 수도 있으며, 아직 때가 아니라고 판단할 수도 있습니다. 무엇을 택하든 그 결정은 우리가 미래를 블록과 얼마나 긴밀히 묶으려 하는지 보여 줄 것입니다."
 mercosur.06.a: "즉시 정회원 가입을 수락한다."
 mercosur.06.b: "수락하되 가입 패키지를 요청한다."
 mercosur.06.c: "준회원국으로만 남는다."
 mercosur.07.t: "가입 패키지 요청"
 mercosur.07.d: "[FROM.GetName]은(는) 원칙적으로 우리의 가입을 수락했으나, 정회원 가입에 앞서 더 폭넓은 투자, 조율, 정치적 안심 보장 패키지를 선호합니다. 이제 이들의 가입은 단계적 절차를 거쳐 진행될 것이며, 우리가 이를 어떻게 처리하느냐가 앞으로 수년간 블록과 그들의 관계 분위기를 좌우할 것입니다."
 mercosur.07.a: "작업을 시작한다."
 mercosur.08.t: "정회원 가입 거절"
 mercosur.08.d: "[FROM.GetName]은(는) 당분간 정회원 가입을 거절했습니다. 신중함 때문이든, 자존심 때문이든, 국내의 망설임 때문이든, 이들은 아직 메르코수르를 자국 정치 지평의 영구적인 일부로 받아들일 준비가 되어 있지 않습니다."
 mercosur.08.a: "나중에 다시 검토하겠다."
 mercosur.09.t: "준회원 가입 협상 개시"
 mercosur.09.d: "우리 외교관들이 [PRU.GetName]과(와) 메르코수르 준회원 가입에 관한 협상을 시작했습니다. 이 제안은 실용적으로 보일 만큼 소박하면서도, 남아메리카 연대의 언어가 그 수도에서 아직 무게를 갖는지 시험할 만큼 의미가 있습니다."
 mercosur.09.a: "진행한다."
