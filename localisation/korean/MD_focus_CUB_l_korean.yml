 CUB_invite_jamaica_desc: "자메이카여, 함께하라"
 CUB_form_confederation: "안틸레스 연방 결성"
 CUB_confederation_category: "안틸레스 연방"
 CUB_ask_puerto: "푸에르토리코 협상"
 CUB_confederation_category_desc: "§P안틸레스 연방§!은 §C카리브해 원주민§!들이 [CUB.GetFlag]쿠바, [DOM.GetFlag]도미니카 공화국, [PTR.GetFlag]푸에르토리코의 주권과 복지를 지키고자 하는 §Y지역 공동체§!로 단결해야 한다는 §R라몬 에메테리오 베탕세스§!의 열렬한 구상이었습니다. 이 구상의 지지자들은 [CUB.GetFlag]쿠바와 [PTR.GetFlag]푸에르토리코의 §O스페인 식민지를 해방§!하고, 이후 이를 [DOM.GetFlag]도미니카 공화국과 통합하여 하나의 통일된 §R스페인계 카리브 국가§!를 세우고자 했습니다\n\n[Confederaion_HAI_loc]\n[Confederaion_COL_loc]\n[Confederaion_DOM_loc]\n[Confederaion_JAM_loc]\n[Confederaion_PTR_loc]"
 CUB_manf_dev: "건설 호황"
 CUB_manf_dev_desc: "성공적이고 유능한 투자 정책 덕분에 우리나라는 진정한 건설 호황을 맞았습니다. 그러나 이것이 영원히 지속되지는 않을 것임을 알고 있으며, 최대한 활용해야 합니다."
 CUB_revived_cuban_fleet: "되살아난 쿠바 함대"
 CUB_our_projects_idea: "우리의 프로젝트"
 CUB_disorg_in_army_idea_1: "구식 군사력"
 CUB_disorg_in_army_idea_1_desc: "한때 강력했던 쿠바군은 이제 초라한 모습으로 전락했습니다. 변화가 필요합니다."
 CUB_general_field_idea: "대규모 야전 훈련"
 CUB_long_training_idea: "광범위한 군사 훈련"
 CUB_reforming_army_idea: "군 개혁"
 CUB_youth_army: "청년 노동군"
 CUB_avia_idea: "쿠바 공군"
 CUB_castros_new_idea: "카스트로의 새 구상"
 CUB_rauls_four_reforms: "경제 현대화 프로그램"
 CUB_idea_migration_crisis: "불법 이주"
 CUB_idea_migration_crisis_desc: "불법 이민은 우리나라의 큰 문제가 되었습니다. 매일 수백 명의 전문 인력이 더 나은 삶을 찾아 불법으로 조국을 떠나고 있습니다. \\"불법 이주 대응\\" 중점을 완료하면 이 국가 정신을 제거할 수 있습니다."
 CUB_land_of_freedom_idea: "자유의 섬"
 CUB_land_of_freedom_idea_desc: "[CUB.GetNameWithFlag]은(는) 수 세기 동안 자유를 위해 싸워 왔으며, 이제 우리가 진정한 자유 국가가 된 이상 누구에게도 독립을 빼앗기지 않을 것입니다!"
 CUB_idea_blockade1: "쿠바에 대한 봉쇄(엘 블로케오)"
 CUB_idea_blockade1_desc: "1962년 미국은 쿠바에 금수 조치를 시행하였고 이는 한 번도 해제되지 않았습니다. 1990년대 초 소련이 붕괴하면서 쿠바에 무역 상대국이 거의 남지 않게 되자 그 영향은 특히 치명적이 되었습니다."
 CUB_cpc_idea1: "공산당에 대한 강한 불신"
 CUB_cpc_idea1_desc: "우리의 공산주의 이념은 막다른 길에 다다랐습니다. 국민은 우리를 신뢰하지 않으며 정치적 견해를 바꾸어 우리의 적을 지지하고 있고, 반공 구호가 우리나라에서 갈수록 자주 들려옵니다"
 CUB_cpc_bad: "공산당에 대한 불신"
 CUB_cpc_bad_desc: "몇 가지 개혁으로 우리는 국민 사이에서 인기를 되찾기 시작했지만, 국내 상황을 안정시키기에는 아직 충분하지 않습니다"
 CUB_cpc_good: "공산당에 대한 반대"
 CUB_infrastructure_dev_idea: "인프라의 적극적 개발"
 CUB_idea_tourist_industry_1: "쿠바 관광"
 CUB_encouraged_foreign_investments_idea: "우리나라로 유입되는 투자"
 CUB_zedm_idea: "ZEDM"
 CUB_zedm_idea_desc: "마리엘 특별개발구(ZEDM)는 외국인 투자를 유치하고 새 일자리를 창출하며 수입 대체의 일환으로 내수 시장에 양질의 제품을 공급하기 위해 만들어진 쿠바의 핵심 경제 프로젝트입니다."
 CUB_tourism_hub_idea: "관광 거점"
 CUB_miracle_operation_idea: "기적 작전"
 CUB_better_sp: "특별 시기"
 CUB_better_sp_desc: "특별 시기는 소련 붕괴 이후 쿠바가 겪은 경제 침체와 위기의 시기였습니다."
 CUB_better_special_period: "특별 시기"
 CUB_better_special_period_desc: "특별 시기는 소련 붕괴 이후 쿠바가 겪은 경제 침체와 위기의 시기였습니다."
 CUB_dual_curency: "이중 통화"
 CUB_dual_curency_desc: "1993년 쿠바 정부는 미국 달러를 합법화했습니다. 이후 쿠바 경제는 페소와 달러라는 두 가지 통화를 사용해 왔습니다."
 CUB_CUPET_idea: "CUPET"
 CUB_CUPET_idea_desc: "쿠바 석유연합, 즉 CUPET은 쿠바 최대의 석유 기업입니다. 쿠바 중앙 정부가 소유하고 운영하며, 석유 매장지 채굴은 물론 석유 제품의 정제와 유통에도 관여합니다. 복합기업 CIMEX와 함께 태환 페소로 휘발유를 판매하는 주유소 체인을 운영하고 있습니다."
 CUB_new_dem_reforms: "새로운 민주 개혁 프로그램"
 CUB_old_command_economy: "구 쿠바 지령 경제"
 CUB_old_command_economy_desc: "낡은 계획경제 체제는 우리 사정을 악화시킬 뿐입니다. 우리는 경제 체제를 바꾸어야 합니다. 경제 개혁 계열에서 이 국가 정신을 제거할 수 있습니다"
 CUB_const_communist_idea: "새 쿠바 헌법"
 CUB_anti_lgbtqa_idea: "반LGBT 입장"
 CUB_anti_lgbtqa_idea_desc: "LGBT 공동체는 서구 세계의 질병입니다. 우리는 이 질병과 싸우고 국민이 병들지 않도록 막아야 합니다"
 CUB_communism_idea: "쿠바 공산주의"
 CUB_prepare_for_worst_idea: "최악에 대비하라"
 CUB_idea_castroism: "카스트로주의"
 CUB_dem_castroism: "카스트로 정책의 연속성"
 CUB_idea_castroism_anti: "카스트로 사상에 대한 규탄"
 CUB_reformism_idea1: "민주 개혁의 시작"
 CUB_reformism_idea1_desc: "수년간의 공산주의 억압 끝에 우리 지도자는 자신의 잘못을 깨닫고 진정한 민주주의의 길에 올랐습니다. 그 길은 쉽지 않지만 우리는 이미 첫걸음을 내디뎠습니다"
 CUB_communist_opposition_idea: "공산주의 반대 세력"
 CUB_communist_opposition_idea_desc: "일부 이념 지도자들은 우리의 새 체제에 동의하지 않으며 우리의 개혁에 강하게 반대합니다. 불행히도 그들은 사회에서 강력한 지지를 받고 있습니다"
 CUB_constitution_democracy: "쿠바 민주 헌법"
 CUB_idea_new_cuba: "새로운 민주 쿠바"
 CUB_idea_new_cuba_desc: "마침내, 그 긴 세월 끝에 쿠바는 자유롭고 민주적인 나라가 될 것입니다"
 CUB_idea_democratic_reforms: "민주 개혁"
 CUB_idea_democratic_reforms_continue: "성공적인 민주 개혁 정책의 지속"
 CUB_pro_lgbtqa_idea: "친LGBTQ 입장"
 CUB_pro_lgbt_idea_comu: "친LGBTQ 입장"
 CUB_new_cuba: "새로운 자유주의 쿠바"
 CUB_idea_nato_standards: "군의 나토 표준"
 CUB_5_years_plans_idea: "5개년 계획"
 CUB_alba_idea: "ALBA 회원국"
 CUB_communism_idea2: "인간의 얼굴을 한 쿠바 공산주의"
 CUB_youth_castro_organisation: "청년 공산주의 조직"
 CUB_cdr: "CDR"
 CUB_nationalist_idea1: "쿠바의 새 민족주의 정책"
 CUB_nationalist_idea2: "쿠바의 새 민족주의 정책"
 CUB_nationalist_idea3: "쿠바의 새 민족주의 정책"
 CUB_nationalist_idea4: "쿠바의 새 민족주의 정책"
 CUB_nationalist_idea5: "쿠바의 새 민족주의 정책"
 CUB_anti_lgbtqa_idea_nati: "반LGBT 선전"
 CUB_patrotism_idea: "쿠바 애국심의 부활"
 CUB_militarism_idea: "애국주의와 군국주의의 적극적 고취"
 CUB_youth_labour_nati_idea: "민족주의 청년 노동군"
 CUB_idea_democrats_in_power: "민주주의 쿠바 정책"
 CUB_idea_democrats_start_ref: "민주주의 쿠바 정책"
 CUB_old_system_protests: "구체제의 시위"
 CUB_old_system_protests_desc: "쿠바의 밝은 미래가 모두의 마음에 드는 것은 아니며, 여기에는 공산당의 전직 당원들도 포함됩니다. 국가의 변화와 자신들의 권력 상실 때문에 그들은 보이콧을 벌이며 우리 삶의 변화를 방해하려 합니다. 이 국가 정신은 중점 §R헌법 개정§!을 완료하면 제거할 수 있습니다"
 CUB_idea_democrats_ref: "민주주의 쿠바 정책"
 CUB_idea_memory: "공화국 지도자들에 대한 추모"
 CUB_idea_memory_desc: "공산주의의 수십 년이 지났고, 우리 역사에 대한 모독과 왜곡의 시간도 지나갔습니다. 이제는 그 시대 지도자들에 대한 진실을 모두 밝힐 때입니다. 우리는 그들을 기억하고 그 공로를 기려야 합니다"
 CUB_idea_conf_one: "연방 프로젝트 준비"
 CUB_democratic_start: "집권한 민주 세력"
 CUB_democratic_start_desc: "마침내 수년간의 불안정을 딛고 쿠바는 진실의 길에 들어섰습니다."
 CUB_wind_of_changes: "변화의 바람"
 CUB_wind_of_changes_desc: "변화의 시대입니다. 변화의 바람이 우리 섬에 불어왔습니다."
 CUB_eliminate_nationalists: "민족주의자 척결"
 CUB_eliminate_nationalists_desc: "민족주의자들은 쿠바에 대한 위협이며, 어떤 경우에도 권력을 잡게 해서는 안 되는 잔혹한 살인자이자 도둑들입니다."
 CUB_release_political_prisoners: "정치범 석방"
 CUB_release_political_prisoners_desc: "정치범 석방은 국내 정치에서 우리의 입지를 강화하기 위해 필요한 조치입니다."
 CUB_decommunisation_society: "탈공산화"
 CUB_decommunisation_society_desc: "공산주의는 우리 국민의 머릿속에 박혀 있는 유토피아입니다. 이 동화와 관련된 모든 것을 없애야 합니다."
 CUB_support_of_western_communists: "친서방 공산주의자 지원"
 CUB_support_of_western_communists_desc: "공산주의자들에 대한 우리의 태도와 정권 교체에도 불구하고 그들은 여전히 사회에서 영향력을 가지고 있습니다. 그러나 우리 체제에 호의적인 공산주의자도 일부 있으니, 이들을 우리 연립에 초청할 때가 되었습니다."
 CUB_republic_alive: "공화국의 부활"
 CUB_republic_alive_desc: "쿠바 공화국은 불사조와 같아서 다시 일어나 진실의 길로 돌아왔습니다."
 CUB_new_constutition_reforms: "헌법 개혁"
 CUB_new_constutition_reforms_desc: "낡은 헌법을 갱신할 때입니다."
 CUB_ally_church: "교회와의 우호 관계 구축"
 CUB_ally_church_desc: "교회는 모든 국가에서 가장 중요한 제도 가운데 하나이며, 국민에 대한 통제를 유지하려면 교회와 친교를 맺어야 합니다."
 CUB_reduce_burecracy_apparat: "관료 기구 개혁"
 CUB_reduce_burecracy_apparat_desc: "이것 하나에 증명서, 저것 하나에 증명서, 저기엔 또 진술서, 으, 지긋지긋합니다. 이제 이를 규제하기 시작할 때입니다."
 CUB_demilitarize_minister: "비무장화"
 CUB_demilitarize_minister_desc: "군대도 좋지만 평화가 더 좋습니다."
 CUB_guarantee_multi_party_programm: "다당제 보장"
 CUB_guarantee_multi_party_programm_desc: "더 잘할 수 있는 사람들이 있을 텐데 왜 우리가 모든 것을 통제해야 합니까?"
 CUB_lets_unite: "하나로 뭉치자"
 CUB_lets_unite_desc: "모든 민주 정당을 쿠바를 밝은 미래로 이끌 하나의 연립으로 통합할 때가 되었습니다! 단결이 곧 힘입니다."
 CUB_cuban_liberalism: "쿠바 자유주의"
 CUB_cuban_liberalism_desc: "쿠바 자유주의의 시대가 마침내 도래했습니다!"
 CUB_memory_of_republic_leaders: "공화국 지도자들을 기리다"
 CUB_memory_of_republic_leaders_desc: "공화국의 지도자들은 쿠바를 밝은 미래로 이끌려 했던 영웅들이었으나, 공산주의자들이 개입하여 쿠바를 수년 후퇴시켰습니다."
 CUB_end_blockade: "봉쇄 종식"
 CUB_end_blockade_desc: "금수 조치는 공산주의자들에 맞서 시행된 것인데, 쿠바가 자유 민주 국가가 된 지금 제재를 해제할 때가 되지 않았습니까?"
 CUB_invest_in_social: "연금 인상"
 CUB_invest_in_social_desc: "평생을 조국을 위해 일한 사람들은 존엄하게 노년을 맞을 수 있어야 합니다. 우리는 그들을 돌보아야 합니다."
 CUB_invest_in_healthcare_dem: "보건 투자"
 CUB_invest_in_healthcare_dem_desc: "그럴 재원이 있는 만큼 국민의 건강을 개선해야 합니다. 그 비용은 충분히 그만한 가치가 있습니다."
 CUB_cuban_econmy: "쿠바 경제 기적"
 CUB_cuban_econmy_desc: "이제 경제가 성장할 때입니다!"
 CUB_ask_for_us_protection: "미국에 보호 요청"
 CUB_ask_for_us_protection_desc: "이제 미국은 우리의 동맹이니, 미군에게 우리를 지켜 달라고 요청하지 못할 이유가 있겠습니까?"
 CUB_era_of_cuban_freedom: "쿠바 자유의 시대"
 CUB_era_of_cuban_freedom_desc: "마침내 쿠바인들은 자유롭게 생각하고, 살고, 여행할 수 있게 되었습니다. 더는 공산주의라는 동화도, 제국주의적 야욕도 없습니다. 오직 자유와 민주주의만이 있을 뿐입니다."
 CUB_destroy_revanshists_memories: "Destroy Revanchism"
 CUB_destroy_revanshists_memories_desc: "영토 확장은 좋은 일이지만 무력 정복으로 이루어져서는 안 됩니다. 조약을 통해 평화적으로 병합하는 편이 낫습니다."
 CUB_improve_trade: "무역 개선"
 CUB_improve_trade_desc: "연방을 창설하려면 이에 참여할 다른 나라들과의 무역을 확대해야 합니다."
 CUB_reesatblish_relations: "외교 관계 복원"
 CUB_reesatblish_relations_desc: "연방 참여 가능성이 있는 나라들과 관계를 복원해야 하며, 그러면 그들이 동맹에 가입할 가능성이 더 높아질 것입니다."
 CUB_prepare_federation: "연방 초안 준비"
 CUB_prepare_federation_desc: "연방을 준비하는 일은 길고 때로는 고된 과정이지만, 이것 없이는 공동의 국가를 세울 수 없습니다."
 CUB_first_stage_of_federation: "연방의 첫 단계"
 CUB_first_stage_of_federation_desc: "카리브해 국가들이 하나로 통합될 때가 되었습니다!"
 CUB_solve_problems_with_haiti: "아이티와의 모든 문제 해결"
 CUB_solve_problems_with_haiti_desc: "아이티는 우리 조약에 참여할 가능성이 있는 나라이지만, 서로에게 품은 불만이 많아 앞으로 나아가려면 이를 털어내야 합니다."
 CUB_realetions_with_dominicana: "도미니카 공화국과의 관계 개선"
 CUB_realetions_with_dominicana_desc: "도미니카 공화국은 카리브해에서 가장 큰 나라 가운데 하나이며 연방 회원국이 될 가능성이 있습니다. 다시 친구가 될 때입니다."
 CUB_liberate_puerto_rico: "산후안 협정"
 CUB_liberate_puerto_rico_desc: "푸에르토리코를 독립 국가로 해방하는 방안을 논의하자는 거래 제안을 가지고 미국인들에게 접근해야 합니다. 미국으로부터 독립을 사들이는 내용을 담은 \\"산후안 협정\\"이라는 거래를 제시할 수 있습니다."
 CUB_invite_haiti: "아이티 초청"
 CUB_invite_haiti_desc: "아이티의 친구들을 우리 연방에 초청합시다!"
 CUB_invite_dominicana: "도미니카 공화국 초청"
 CUB_invite_dominicana_desc: "도미니카 공화국과 하나가 될 때입니다."
 CUB_invite_puerto_rico: "푸에르토리코 초청"
 CUB_invite_puerto_rico_desc: "갓 세워진 국가가 또 다른 국가에 합류할 때입니다."
 CUB_new_center_of_caribean: "카리브해의 새로운 강국"
 CUB_new_center_of_caribean_desc: "안틸레스 연방은 카리브해의 새로운 강국이며, 모두가 무시할 수 없는 세력입니다."
 CUB_nationalists: "집권한 민족주의자들"
 CUB_nationalists_desc: "마침내 그 긴 세월 끝에 위대하고 강한 쿠바를 건설할 수 있게 되었습니다!"
 CUB_mass_propoganda: "대대적 민족주의 선전"
 CUB_mass_propoganda_desc: "사람들을 우리 편으로 끌어들이려면 선전을 해야 하며, 민족주의 이념을 적극적으로 고취해야 합니다."
 CUB_decommunisation: "탈공산화"
 CUB_decommunisation_desc: "공산주의자들은 쿠바인들의 조용하고 평화로운 삶을 파괴했습니다. 이 공산주의라는 역병과 관련된 모든 것을 파괴하고 쿠바인들의 기억에서 지워야 합니다."
 CUB_crush_castro: "카스트로 개인숭배 파괴"
 CUB_crush_castro_desc: "카스트로는 우리 쿠바 땅에 고통과 파괴를 가져와 평화로운 삶을 망가뜨린 범죄자입니다."
 CUB_police_reforms_nati: "경찰 개혁"
 CUB_police_reforms_nati_desc: "경찰은 부패했고 공산주의 선전에 취약하므로 경찰력에 더 많은 개혁이 필요합니다."
 CUB_teritorial_reforms: "영토 개혁"
 CUB_teritorial_reforms_desc: "나라를 더 잘 통치하려면 영토 개혁이 필요합니다."
 CUB_the_new_education_system_nati: "새 교육 체계"
 CUB_the_new_education_system_nati_desc: "낡은 교육 체계는 공산주의 선전으로 가득 차 있어 새로운 쿠바에 더는 맞지 않습니다. 근본적으로 바꿔야 합니다."
 CUB_industry_expansion: "적극적인 산업 건설"
 CUB_industry_expansion_desc: "수년간의 가동 중단 끝에 우리 산업은 처참한 상태이며, 시급히 다시 재건해야 합니다."
 CUB_new_economic_politics: "새 경제 체제"
 CUB_new_economic_politics_desc: "새로운 쿠바에는 새로운 경제 체제가 필요합니다"
 CUB_anti_lgbt: "반LGBT"
 CUB_anti_lgbt_desc: "LGBT는 질병입니다."
 CUB_purge_democrats: "민주주의자 탄압"
 CUB_purge_democrats_desc: "민주주의자들은 공산주의자들과 마찬가지로 사회에 위험한 존재입니다. 그들과 그들을 지지하는 모든 이를 척결해야 합니다."
 CUB_form_coaltition_with_nationalist: "다른 민족주의자들과 연립 구성"
 CUB_form_coaltition_with_nationalist_desc: "민족주의 운동들은 단결해야 합니다. 그래야만 쿠바가 위대해질 것입니다."
 CUB_patriotism: "애국주의"
 CUB_patriotism_desc: "국민에게 조국에 대한 자부심을 키워 주어야 합니다."
 CUB_militarism: "군국주의 육성"
 CUB_militarism_desc: "군국주의를 고취하면 더 많은 사람을 군으로 끌어들일 수 있습니다."
 CUB_new_standarts_of_edcuation_mil: "장교 교육의 새로운 기준"
 CUB_new_standarts_of_edcuation_mil_desc: "우리의 장교 교육은 시대에 뒤떨어져 있으며, 다른 나라들의 경험을 배워 체계를 갱신해야 합니다."
 CUB_power_to_military: "군을 연립에 초청"
 CUB_power_to_military_desc: "군의 충성을 온전히 얻으려면 정부 내에서 그들에게 일정한 권한을 주어야 합니다."
 CUB_purchase_of_russian_equipment: "러시아 무기 구매"
 CUB_purchase_of_russian_equipment_desc: "러시아 친구들에게는 무기가 많은데, 우리에게 일부를 내줄 의향이 있을까요?"
 CUB_foreign_legion: "외인 군단 창설"
 CUB_foreign_legion_desc: "외국인 민족주의자들을 모집하면 그들 전용의 군단 전체를 만들 수 있고, 우리 스스로 모집 목표를 채우기도 쉬워집니다."
 CUB_anti_coruption: "부패 척결 조치"
 CUB_anti_coruption_desc: "부패는 수년간 우리나라를 안에서부터 갉아먹어 왔으며, 반드시 근절해야 합니다."
 CUB_expand_youth_labour_army: "청년 노동군 확대"
 CUB_expand_youth_labour_army_desc: "청년군은 사람들을 정규군으로 끌어들이는 좋은 방법이지만, 사람들이 가입하도록 만들 만큼 강하지도 않고 사회적 영향력도 없습니다. 이를 바로잡아야 합니다."
 CUB_increase_social: "사회 예산 증액"
 CUB_increase_social_desc: "사회 예산을 늘리면 우리나라가 번영하는 데 도움이 될 것입니다."
 CUB_cuba_for_cubans: "쿠바인을 위한 쿠바"
 CUB_cuba_for_cubans_desc: "쿠바는 이제 위대하고 강력한 나라이자 쿠바인들의 낙원이 될 것입니다."
 CUB_haiti: "아이티 병합"
 CUB_haiti_desc: "아이티여, 집으로 돌아올 때다."
 CUB_demand_dominicana: "도미니카 공화국에 복종 요구"
 CUB_demand_dominicana_desc: "그들에게는 선택지가 없습니다. 복종하든가, 아니면 험한 방식으로 쿠바의 지역이 되든가 둘 중 하나입니다."
 CUB_annex_jamaica: "자메이카 병합"
 CUB_annex_jamaica_desc: "아무도 신경 쓰지 않을 것으로 생각합니다."
 CUB_friendship_with_venezuella: "베네수엘라와의 협력"
 CUB_friendship_with_venezuella_desc: "베네수엘라는 바다 건너의 전우이니, 친구가 될 수 있는데 굳이 전쟁을 벌일 이유가 있겠습니까?"
 CUB_invite_venesuells: "베네수엘라를 우리 동맹에 초청"
 CUB_invite_venesuells_desc: "우리의 형제 베네수엘라여, 갈라져 있던 모든 민족을 위한 우리의 우호 동맹에 합류할 때입니다."
 CUB_military_technical_cooperation: "베네수엘라와의 군사 협력"
 CUB_military_technical_cooperation_desc: "베네수엘라군과 쿠바군이 힘을 합치면 무적입니다."
 CUB_panama_ours: "파나마 침공"
 CUB_panama_ours_desc: "파나마 운하는 우리 함대의 보금자리가 될 것입니다."
 CUB_annex_costa_rica: "코스타리카 침공"
 CUB_annex_costa_rica_desc: "중앙아메리카 민족을 통합하기 시작할 때입니다!"
 CUB_demand_nicaragua_to_be_annexed: "니카라과 특별 군사 작전"
 CUB_demand_nicaragua_to_be_annexed_desc: "니카라과 국민이 해방을 요구하고 있습니다. 좋습니다, 사흘 안에 마나과를 점령할 때입니다."
 CUB_nationalist_revolutions: "민족주의 혁명"
 CUB_nationalist_revolutions_desc: "스페인계 민족을 통합하는 마지막 일격은 스페인과 멕시코에서의 혁명이 될 것이지만, 이를 신중하게 계획해야 합니다."
 CUB_cuban_politics: "쿠바 정치"
 CUB_cuban_politics_desc: "젊은 쿠바 국가는 역사상 어려운 시기를 맞이하고 있습니다. 선택은 우리의 몫입니다. 카스트로의 유산을 따를 것인가, 민주주의의 길을 택할 것인가? 아니면 모든 스페인계 민족을 하나의 연합으로 통합할 것인가?"
 CUB_cpc_reforms: "쿠바 공산당 개혁"
 CUB_cpc_reforms_desc: "우리 당은 사회 생활의 원동력이기를 그쳤고, 사람들은 더 이상 우리와 우리의 사상을 신뢰하지 않습니다. 공산당을 진지하게 개혁할 때입니다."
 CUB_cpc_new_people: "청년층 유치"
 CUB_cpc_new_people_desc: "청년들과 조직의 도움으로 우리 당의 인기를 높일 수 있습니다."
 CUB_battle_ideas: "사상 투쟁"
 CUB_battle_ideas_desc: "사상 투쟁은 쿠바의 정치적 대립으로, 이 과정에서 당이 향후 노선과 지도자를 결정하였습니다. 이 논쟁을 끝내고 쿠바의 미래를 결정할 때입니다."
 CUB_castro_in_power: "권력을 유지하는 카스트로 형제"
 CUB_castro_in_power_desc: "피델과 라울 카스트로가 오랫동안 통치해 왔는데, 우리가 무엇 때문에 무언가를 바꿔야 합니까?"
 CUB_castro: "집권한 카스트로"
 CUB_castro_desc: "잘하고 있는데 왜 무언가를 바꿔야 합니까?"
 CUB_raul_in_power: "라울의 집권"
 CUB_raul_in_power_desc: "약간의 변화는 필요하지만 급진적인 변화는 아닙니다."
 CUB_meet_with_obama: "오바마와의 회담"
 CUB_meet_with_obama_desc: "미국 지도자와의 회담은 양국 관계를 재설정하고 협력을 더욱 발전시킬 수 있게 해 줄 것입니다."
 CUB_meet_with_putin: "푸틴과의 회담"
 CUB_meet_with_putin_desc: "러시아는 오랫동안 우리의 가장 중요한 협력국 가운데 하나였습니다. 그러나 소련 붕괴 이후 우리는 모스크바와의 유대를 잃었으며, 이를 복원할 때가 되었습니다."
 CUB_prisoners: "수감자 사면"
 CUB_prisoners_desc: "쿠바 국민의 관용과 강인함을 보여주기 위해, 다양한 정치 범죄로 유죄 판결을 받은 쿠바 수감자 수천 명에게 사면을 부여해야 합니다."
 CUB_migrants_problem: "이민 개혁"
 CUB_migrants_problem_desc: "우리나라로의 여행과 입국에 부과된 여러 제한을 철폐해야 합니다. 그러면 쿠바인들이 여행할 수 있게 되고 투자자들도 우리나라로 유치할 수 있습니다."
 CUB_rauls_modernization: "경제 모델 현대화 노선"
 CUB_rauls_modernization_desc: "2011년 4월 쿠바 공산당 제6차 당대회에서 대의원들은 국가의 추가 발전을 위한 프로그램을 승인했습니다. 이는 사회주의적 성격을 유지하면서 쿠바 경제 모델을 \\"현대화\\"하는 조치를 제안했습니다."
 CUB_expand_ETECSA: "ETECSA 확장"
 CUB_expand_ETECSA_desc: "ETECSA는 쿠바에서 통신 서비스를 제공하는 쿠바 국영 기업입니다. 경제 현대화를 계속하려면 이 기업을 확장해야 합니다."
 CUB_expand_private_sector: "민간 부문 경제 확대"
 CUB_expand_private_sector_desc: "몇 가지 형태의 자영업을 합법으로 인정해야 합니다. 이는 우리 경제에 큰 활력을 불어넣고 사람들을 사업에 뛰어들게 할 것입니다."
 CUB_selling_houses_cars: "자동차 구매 제한 철폐"
 CUB_selling_houses_cars_desc: "쿠바인들의 차량 구매를 금지하면 그들은 무엇을 타고 다니겠습니까? 이 법을 폐지하고 쿠바의 자동차 애호가들이 뜻대로 하게 할 때가 되었습니다."
 CUB_the_new_castro: "새로운 카스트로"
 CUB_the_new_castro_desc: "냉전 시기에 우리는 상황에 인질로 잡혀 있었지만, 이제는 더 나은 삶을 시작하기 위해 반드시 정부를 바꿔야 하는 것은 아닙니다."
 CUB_Miguel_Mario_Diaz: "미겔 디아스카넬"
 CUB_Miguel_Mario_Diaz_desc: "정책의 방향은 바꿔야 하지만, 반드시 쿠바 공산당의 권력까지 바꿀 필요는 없습니다."
 CUB_friends_in_power: "권력 속의 친구들"
 CUB_friends_in_power_desc: "결코 우리를 배신하지 않고 우리를 도와줄 사람들로 측근 집단을 만들어야 합니다."
 CUB_small_privatizaion: "부분 민영화"
 CUB_small_privatizaion_desc: "부분 민영화는 국가의 경제 상황을 개선하고 정부 내에서 우리의 평판을 높이는 데 도움이 될 것입니다."
 CUB_parlament: "구 의회 해산"
 CUB_parlament_desc: "구 의회는 우리 당의 문제입니다. 의회는 무효이며 일부 의원은 부패했습니다. 새 의회를 만들고 부패한 관료들을 직위에서 몰아내야 합니다."
 CUB_christianity: "교황의 방문"
 CUB_christianity_desc: "교황의 방문은 기독교인들을 우리 당으로 끌어들이고 가톨릭 교회와의 관계를 복원할 기회입니다."
 CUB_economic_low: "신경제 정책"
 CUB_economic_lod_desc: "낡은 경제 정책은 쿠바에 해로웠으므로 경제를 현대화하고 경제 정책을 근본적으로 바꿔야 합니다."
 CUB_rohel: "로헬리오 사건"
 CUB_rohel_desc: "로헬리오 아세베도 곤살레스는 1941년 쿠바 카이바리엔에서 태어났으며, 쿠바 혁명 중이던 1957년 7월 26일 운동에 참여했습니다. 그는 체 게바라의 부관인 라미로 발데스와 시로 레돈도 휘하에서 복무했고, 이후 1961년 피그스 만 침공에 맞서 싸웠습니다. 1960년에는 국가혁명민병대 지휘관이 되었고, 1975년에는 앙골라 군사 사절단의 참모장을 지냈습니다. 1989년부터 2010년까지는 쿠바 민간항공연구소 소장을 역임했습니다."
 CUB_change: "새 지도자"
 CUB_change_desc: "슬프게도 피델의 시대는 지나갔고 이제 라울의 시대입니다. 우리는 그의 치하에서 더 나은, 더 평화로운 삶을 살게 될 것이라고 믿습니다."
 CUB_cdrs: "CDR 확대"
 CUB_cdrs_desc: "혁명수호위원회, 즉 CDR은 쿠바 전역의 지역 위원회 네트워크입니다. \\"혁명의 눈과 귀\\"로 불리는 이 조직들은 지역 사회를 지원하고 반혁명 활동을 보고하기 위해 존재합니다."
 CUB_expand_police: "경찰 개혁"
 CUB_expand_police_desc: "국가혁명경찰은 쿠바의 법 집행을 담당합니다. 쿠바의 범죄율은 세계의 다른 많은 주요 국가보다 크게 낮은 수준을 유지하고 있지만, 쿠바 경찰은 특히 아바나에서 모든 범죄와 싸우기로 결의하고 있습니다."
 CUB_new_cuban_constituation: "새 쿠바 헌법 채택"
 CUB_new_cuban_constituation_desc: "새 쿠바 헌법을 통과시키면 사람들을 당으로 끌어들일 수 있을 뿐 아니라, 낡은 법률을 우리에게 더 유리한 새 법률로 다시 쓸 수 있습니다."
 CUB_5_years_economy_plan: "5개년 계획 착수"
 CUB_5_years_economy_plan_desc: "5개년 계획은 우리 경제가 다시 회복하고 사회주의 쿠바를 밝은 미래로 이끄는 데 도움이 될 것입니다."
 CUB_mobilize_youth: "청년 동원"
 CUB_mobilize_youth_desc: "청년은 우리 사회에서 가장 중요한 부분이며, 쿠바의 성공적인 미래를 위해 최대한 많은 청년을 우리 공산당으로 끌어들여야 합니다."
 CUB_increase_farmers: "농민 지원 확대"
 CUB_increase_farmers_desc: "농민은 우리 경제의 중요한 부분이므로, 나라를 안정시키려면 지원을 늘려야 합니다."
 CUB_the_new_education_system: "교육 체계 개편"
 CUB_anti_lgbt_pos: "반LGBT 입장"
 CUB_anti_lgbt_pos_desc: "쿠바 LGBT 공동체에 대한 입장에서 더 근본주의적인 태도를 취하는 것이 중요합니다. 그렇지 않으면 위대한 조국의 정체성 일부를 위태롭게 하게 됩니다."
 CUB_pro_lgbt_pos_desc: "사랑은 언제나 사랑입니다. 우리는 국민이 사랑하는 것을 금지해서는 안 됩니다."
 CUB_pro_lgbt_pos: "친LGBT 입장"
 CUB_soviet_legacy: "소련의 유산 존중"
 CUB_soviet_legacy_desc: "한때 소련은 우리의 독립을 지켜 주었고 미국의 위협에 맞서는 데 도움을 주었습니다."
 CUB_millitarism: "군국주의"
 CUB_millitarism_desc: "군국주의는 적극적인 군비 확충과 팽창주의적 목적을 위한 국가 권력의 사용을 추구하는 이념이자 정책으로, 공공 생활에서 군과 준군사 기관의 우위를 장려합니다. 우리의 목표를 위해 이를 받아들여야 합니다."
 CUB_create_patrioitc_schools: "애국 학교 설립"
 CUB_create_patrioitc_schools_desc: "애국 학교는 청년에 대한 우리의 영향력을 높이고 공산당의 집권을 유지하는 데 도움이 될 것입니다."
 CUB_cuban_communsim: "새로운 쿠바 공산주의"
 CUB_cuban_communsim_desc: "마침내 수년간의 불안정과 문제를 딛고 쿠바는 이제 강하고 독립적인 사회주의 국가입니다. 위대한 레닌이 바란 대로 공산주의를 향해 전진합시다!"
 CUB_alba_creation: "ALBA 창설"
 CUB_alba_creation_desc: "ALBA는 라틴아메리카와 카리브해 국가들의 정치적·경제적 통합이라는 구상에 기반한 정부 간 기구입니다."
 CUB_usa_presense: "미국 제국주의 규탄"
 CUB_usa_presense_desc: "미국은 전 세계와 인류에 대한 위협입니다. 미국 제국주의를 파괴하고 분쇄해야 합니다."
 CUB_support_eacu: "유라시아경제연합 가입"
 CUB_support_eacu_desc: "유라시아경제연합: 유라시아 경제 연합 조약에 의해 설립된, 국제법적 인격을 갖춘 국제 지역 경제 통합 기구입니다."
 CUB_military_coop_with_rus: "[military_coop_russia_unionstate_name]"
 CUB_military_coop_with_rus_desc: "[military_coop_russia_unionstate]"
 CUB_expand_economic_trade: "중국과의 경제 협력 확대"
 CUB_expand_economic_trade_desc: "중국은 세계 경제의 미래 지도국이므로, 우리나라에 대한 미국의 영향력을 줄이기 위해 중국과의 무역을 발전시켜야 합니다."
 CUB_under_china_protection: "중국의 보호 요청"
 CUB_under_china_protection_desc: "중국이 우리를 보호해 줄 것이며, 미국은 이를 좋아하지 않을 것입니다."
 CUB_venesuella_brothers: "우리의 베네수엘라 형제들"
 CUB_venesuella_brothers_desc: "베네수엘라와 쿠바는 평화와 번영 속에 살아가야 할 형제 민족입니다."
 CUB_venesuella_defence: "베네수엘라와의 상호 방위"
 CUB_venesuella_defence_desc: "쿠바군과 베네수엘라군은 대규모 분쟁이 발생할 경우 서로 도와야 하며, 경험과 장교의 교류는 양국이 잠재적 적의 공격을 격퇴하는 데 도움이 될 것입니다."
 CUB_guantanamo_question: "관타나모 문제 해결"
 CUB_guantanamo_question_desc: "관타나모는 우리 영토이지만 현재 미 제국주의자들이 점령하고 있습니다. 이를 조국의 품으로 되찾아야 합니다."
 CUB_police_exp: "경찰 영향력 확대"
 CUB_police_exp_desc: "경찰이 있으면 우리나라는 더 안전해지고 모든 반대 세력을 더 잘 통제할 수 있습니다."
 CUB_put_natoinalist_in_jail: "민족주의자 투옥"
 CUB_put_natoinalist_in_jail_desc: "민족주의자들은 우리 사회와 이념에 큰 위협이며 앞으로도 그러할 것입니다. 그들을 제거하고 모든 민족주의 반대 세력을 파괴해야 합니다."
 CUB_politcal_purges: "정치 숙청"
 CUB_politcal_purges_desc: "정치적 탄압은 불쾌하지만, 국내의 반대 세력을 안정시키고 파괴하는 데 필요한 과정입니다."
 CUB_ban_opposition: "야당 금지"
 CUB_ban_opposition_desc: "야당은 상황과 정치의 복잡성을 이해하지 못하는 어리석고 교육받지 못한 자들입니다. 길은 하나뿐입니다... 그들을 제거하는 것입니다."
 CUB_com_party_dominance: "공산당의 지배"
 CUB_com_party_dominance_desc: "공산당은 우리나라에서 유일하게 옳은 정당이며, 이를 모두에게 증명하기 위해 모든 노력을 다해야 합니다."
 CUB_castroism: "카스트로주의"
 CUB_castroism_desc: "카스트로주의는 피델 카스트로가 쿠바의 혁명가이자 시인인 호세 마르티의 저술에 기초하여 창시한 정치·경제 교리입니다. 카스트로주의는 아프리카, 아시아, 라틴아메리카 민족을 식민주의와 독재로부터 해방시키는 교리로 등장했습니다."
 CUB_start_reformism: "개혁주의 시작"
 CUB_start_reformism_desc: "민주 개혁은 우리나라가 성공적이고 번영하는 국가로서 생존하고 존속하기 위해 필요합니다."
 CUB_empower_banks: "경제의 기반인 은행"
 CUB_empower_banks_desc: "사회주의는 과거의 것이며 이제 우리는 자본주의의 시대로 접어들고 있습니다. 아시다시피 자본주의에서는 은행이 경제 전체의 기반입니다."
 CUB_expand_oligarch_influence: "관료 권한 강화"
 CUB_expand_oligarch_influence_desc: "관료들의 도움으로 우리는 권력을 강화하고 자본주의 궤도로의 이행을 가속할 수 있을 것입니다."
 CUB_churc: "교회 허용"
 CUB_churc_desc: "교회는 쿠바 사회의 중요한 일부였으나 야만적인 공산주의 정부가 이를 파괴했습니다. 사회에 대한 교회의 영향력을 회복시켜야 합니다."
 CUB_allow_multi_party_system: "다당제 허용"
 CUB_allow_multi_party_system_desc: "언론의 자유가 없는 민주주의가 어디 있겠습니까?"
 CUB_the_new_constitution: "새 민주 헌법"
 CUB_the_new_constitution_desc: "새 헌법은 시민의 권리와 새로 세워진 쿠바 민주주의를 보호해야 합니다."
 CUB_guantanamo_que: "관타나모 문제 종결"
 CUB_guantanamo_que_desc: "쿠바와 미국 사이의 영토 분쟁을 끝내야 합니다. 관타나모에 대해 이야기해야 합니다."
 CUB_demilitarize_society: "사회의 비무장화"
 CUB_demilitarize_society_desc: "안타깝게도 우리나라의 군국주의는 심한 수준이며, 진정한 민주주의와 자유를 이루려면 사회를 비무장화해야 합니다."
 CUB_deals_with_rare_communists: "공산주의자들과의 거래"
 CUB_deals_with_rare_communists_desc: "공산주의 반대 세력은 계속해서 우리나라의 발전을 가로막고 있습니다. 그들이 거절할 수 없는 거래를 제안해야 합니다."
 CUB_stable_society: "안정된 사회"
 CUB_stable_society_desc: "마침내 수년간의 불안정과 긴장을 딛고 우리나라는 안정과 미래에 대한 확신 속에서 살아갈 수 있습니다."
 CUB_police_influence: "경찰 영향력 축소"
 CUB_police_influence_desc: "경찰이 사회에 큰 영향력을 가지면 대개 경찰의 무법 행위로 변질됩니다. 통제 불능이 되기 전에 경찰의 영향력을 낮추고 제한해야 합니다."
 CUB_the_new_cuba: "새로운 쿠바"
 CUB_the_new_cuba_desc: "이제 우리는 자유롭고 민주적이며 아름다운 새로운 쿠바가 되었습니다."
 CUB_parthership_with_usa: "미국과의 동반자 관계"
 CUB_parthership_with_usa_desc: "민주 국가가 되어 공산주의라는 역병에서 벗어난 지금, 우리는 미국과의 관계를 발전시킬 수 있습니다."
 CUB_cooperation_with_taiwan: "대만과의 협력"
 CUB_cooperation_with_taiwan_desc: "대만에는 우리나라의 회복에 도움이 될 수 있는 첨단 기술이 있습니다."
 CUB_recognize_taiwan_as_china: "대만을 유일한 중국으로 인정"
 CUB_recognize_taiwan_as_china_desc: "공산주의로부터 해방된 뒤에는 중국 시민들을 붉은 역병에서 해방시켜야 하며, 이를 위해 작은 것부터 시작해야 합니다."
 CUB_nato_standarts: "나토 표준 채택"
 CUB_nato_standarts_desc: "나토는 유럽 대부분의 나라를 아우르는 군사·정치 블록입니다. 나토의 전술과 교리는 세계 최고이니, 최고에게 배우지 않을 이유가 있겠습니까?"
 CUB_cooperation_with_EU: "EU와의 협력"
 CUB_cooperation_with_EU_desc: "유럽 연합(EU)은 주로 유럽에 위치한 초국가적 정치·경제 연합입니다."
 CUB_cuba_nato_exercises: "쿠바-나토 합동 훈련"
 CUB_cuba_nato_exercises_desc: "나토와의 훈련은 우리와 우리 군이 상대국 군과의 소통과 관계를 개선하는 데 도움이 될 것입니다. 또한 우리 병사들이 북대서양 병사들의 경험에서 배우는 데에도 도움이 될 것입니다."
 CUB_support_venezuellas_opposition: "베네수엘라 야권 지원"
 CUB_support_venezuellas_opposition_desc: "베네수엘라 국민은 미친 정부 아래에서 고통받고 있으며, 우리는 형제와 그 국민을 구하기 시작해야 합니다."
 CUB_kill_last_dictator: "마지막 독재 정권 제거"
 CUB_kill_last_dictator_desc: "신중한 준비 끝에 우리는 베네수엘라와 그 국민을 구하기 시작할 수 있습니다. 가자, 형제들이여! 자유를 향해 전진!"
 CUB_castro_support: "카스트로를 기리다"
 CUB_castro_support_desc: "피델 카스트로는 전설이며, 쿠바 전체가 위업을 이루고 미국 침략자에 맞서도록 고무한 지도자입니다. 나라의 권력이 바뀌었더라도 우리는 카스트로를 기리고 그의 업적을 존중해야 합니다."
 CUB_say_about_castro: "카스트로 숭배와의 투쟁"
 CUB_say_about_castro_desc: "피델 카스트로는 쿠바를 먼 과거로 되돌려 놓은 피에 굶주린 혁명가이며, 우리는 그의 숭배와 지지자들에 맞서 싸워야 합니다."
 CUB_cons_reforms: "헌법 개혁"
 CUB_cons_reforms_desc: "낡은 쿠바 헌법은 새롭고 현대적인 쿠바에 더는 맞지 않습니다. 개혁을 이어 가려면 이를 부분적으로 바꿔야 합니다."
 CUB_freedom_of_debate: "언론의 자유"
 CUB_freedom_of_debate_desc: "자유로운 발언은 부자유한 발언보다 낫습니다."
 CUB_president: "대통령"
 CUB_president_desc: "우리가 변화와 협력을 받아들일 준비가 되었음을 모두에게 보여주기 위해 국가 원수의 직함을 바꿔야 합니다."
 CUB_new_leader: "쿠바 인민의 새 지도자"
 CUB_new_leader_desc: "피델 카스트로에게는 합당한 후계자가 있습니다! 우리는 계속해서 쿠바를 밝은 미래로 이끌어 갑니다."
 CUB_continue_reformism: "개혁 지속"
 CUB_continue_reformism_desc: "우리는 올바른 길 위에 있습니다! 멈출 수 없습니다."
 CUB_bring_liberalism_to_cuba: "쿠바에 자유주의를 가져오다"
 CUB_bring_liberalism_to_cuba_desc: "자유주의 쿠바는 많은 이의 꿈이며, 이를 실현할 때가 되었습니다."
 CUB_allow_elections: "선거 허용"
 CUB_allow_elections_desc: "마침내! 지난 세기 이후 처음으로 쿠바에서 자유롭고 공정한 선거가 치러질 것입니다."
 CUB_censour: "검열 완화"
 CUB_censour_desc: "검열은 누구에게도 권리가 없는 전체주의 국가의 표지입니다. 검열을 완화할 때가 되었습니다."
 CUB_pro_lgbt_position: "친LGBT 입장"
 CUB_pro_lgbt_position_desc: "누구든 원하는 사람을 사랑하십시오."
 CUB_new_cuban_society: "새로운 쿠바 사회"
 CUB_new_cuban_society_desc: "이제 쿠바인들은 아무것도 두려워할 필요가 없습니다. 자유롭게 생각하고 말할 수 있으며, 진정한 쿠바의 자유와 민주주의의 시대가 도래했습니다!"
 CUB_cuban_economic_miracle: "쿠바 경제 기적"
 CUB_cuban_economic_miracle_desc: "경제에서 기적을 일으키기 좋은 때입니다!"
 CUB_new_socialism_ideas: "새로운 쿠바 사회주의"
 CUB_new_socialism_ideas_desc: "자본주의는 해볼 만큼 해봤으니 이제 충분합니다."
 CUB_new_dictatorship: "새 독재자"
 CUB_new_dictatorship_desc: "모두를 금지하고, 모두를 투옥하며, 모든 반대자는 법이 허용하는 최대한도로 처벌해야 합니다."
 CUB_controlling_oposition: "야당 통제"
 CUB_controlling_oposition_desc: "독재자가 되는 건 멋지지만, 우리는 민주주의처럼 보이도록 하려던 것이었고 그러려면 야당이 있어야 합니다."
 CUB_trade_with_north: "북한과의 무역"
 CUB_trade_with_north_desc: "북한은 언제나 우리의 사회주의 형제였고 앞으로도 그러할 것입니다. 북한과의 관계와 무역을 계속 발전시켜야 합니다."
 CUB_cuban_socialism_with_face: "인간의 얼굴을 한 쿠바 사회주의"
 CUB_cuban_socialism_with_face_desc: "마침내 우리나라에 이상적인 형태의 사회주의를 찾았습니다."
 CUB_increase_minimum_wage: "근로자 임금 인상"
 CUB_increase_minimum_wage_desc: "노동자는 언제나 쿠바 사회의 중요한 일부였으므로, 그들의 노동을 존중하고 좋은 임금을 보장해야 합니다."
 CUB_the_new_education_system_desc: "이미 완전히 구식이 되어 세계 기준에 미치지 못하는 교육 체계를 개편해야 합니다."
 CUB_economic_low_desc: "낡은 경제 체제는 더 이상 우리나라에 맞지 않습니다."
 CUB_cubafuture: "쿠바의 미래"
 CUB_cubafuture_desc: "수년이 지나 쿠바 국민은 어디로 나아갈지 결정해야 합니다. 공산주의에 머물 것인가, 민주주의의 길에 들어설 것인가, 아니면 카리브해에서 패권을 쥐려 할 것인가?"
 CUB_join_csto: "집단안보조약기구 가입"
 CUB_join_csto_desc: "일부 러시아 언론이 우리의 집단안보조약기구(CSTO) 가입에 관한 정보를 퍼뜨리기 시작했습니다. 이왕 추측이 나오기 시작한 이상 비밀로 할 이유가 없습니다. 쿠바는 CSTO의 일원입니다."
 CUB_tesak_in_power: "부에노스 디아스, 극단주의자들"
 CUB_tesak_in_power_desc: "이제 때가 되었으니, 세상의 모든 부패를 청소하고 근절하기 시작하십시오."
 CUB_loyal_police: "충성스러운 경찰"
 CUB_loyal_police_desc: "강한 나라에는 강한 지도자가 필요하고, 강한 지도자에게는 충성스러운 경찰이 필요합니다."
 CUB_loyal_military: "충성스러운 군"
 CUB_loyal_military_desc: "우리의 가장 좋은 친구는 우리 병사들입니다."
 CUB_new_justice_constitution: "새로운 공정 헌법"
 CUB_new_justice_constitution_desc: "헌법을 공정하고 정의롭게 만들 때입니다. 마이클 잭슨의 입국을 금지할 것입니다."
 CUB_fight_with_lgbt: "LGBT와의 전쟁"
 CUB_fight_with_lgbt_desc: "LGBT 공동체의 모든 일원을 찾아내 춤을 추게 만들 것입니다."
 CUB_ateism_as_state_religion: "무신론"
 CUB_ateism_as_state_religion_desc: "유리 가가린은 우주에 갔지만 거기서 아무도 보지 못했는데, 그렇다면 어떤 신이 존재한단 말입니까?"
 CUB_root_out_liberals: "자유주의 근절"
 CUB_root_out_liberals_desc: "자유주의자들은 우리 사회의 적입니다! 그들은 온갖 마이클 잭슨의 노래를 듣고, 그러고 나서 우리나라에 해를 끼칩니다."
 CUB_navalny: "나발니 체포"
 CUB_navalny_desc: "나는 나발니와 정직한 토론을 하고 싶습니다. 이제 그는 철창 안에 있게 될 것이고, 나는 자유로울 것입니다."
 CUB_intervention_for_best: "더 나은 미래를 위한 개입"
 CUB_intervention_for_best_desc: "준비가 끝난 지금, 우리는 세상을 부패와 범죄자들로부터 구하기 시작할 수 있습니다."
 CUB_regional_influence: "지역 영향력"
 CUB_regional_influence_desc: "세상을 부패에서 구하려면 작은 곳에서부터 시작해야 합니다. 라틴아메리카에서의 영향력을 키우는 것으로 말입니다."
 CUB_save_venezuella: "베네수엘라 구하기"
 CUB_save_venezuella_desc: "우리의 스페인어권 아미고들은 부패의 늪에 빠져 있으며, 우리가 구해야 합니다."
 CUB_save_cis: "독립국가연합 구하기"
 CUB_save_cis_desc: "독립국가연합 국가들이 부패와 절도에서 벗어나도록 도와야 합니다."
 CUB_spain: "스페인 구하기"
 CUB_spain_desc: "스페인 형제들을 부패의 멍에에서 해방시켜야 합니다!"
 CUB_ukraine: "우크라이나 구하기"
 CUB_ukraine_desc: "우크라이나는 부패를 용납하지 않을 것입니다. 가자, 형제들이여!"
 CUB_kazahstan: "카자흐스탄 구하기"
 CUB_kazahstan_desc: "쿠미스를 마실 때입니다!"
 CUB_root_out_coruption: "부패 근절"
 CUB_root_out_coruption_desc: "부패와 범죄는 전 세계의 문제이며, 우리는 쿠바에서부터 이를 파괴하기 시작해야 합니다."
 CUB_revolution_support: "쿠바 혁명 이념 지지"
 CUB_revolution_support_desc: "쿠바 혁명은 쿠바인들의 위대한 위업이었으며, 새 정부인 우리는 위대한 쿠바 국민의 이 위업을 기려야 합니다."
 CUB_internet_propoganda: "인터넷 선전"
 CUB_internet_propoganda_desc: "인터넷 선전은 더 많은 사람을 우리 편으로 끌어들이고 우리의 입지를 강화하는 데 도움이 될 것입니다."
 CUB_create_ter_defense: "영토 방위대 창설"
 CUB_create_ter_defense_desc: "우리나라는 작기 때문에 침략자의 위협을 물리치려면 시민들의 도움이 필요합니다."
 CUB_reforms_of_command: "지휘 개혁"
 CUB_reforms_of_command_desc: "우리의 지휘부는 시대에 뒤떨어졌으며, 군을 승리로 이끌 젊고 유망한 장군들에게 자리를 내줘야 합니다."
 CUB_prof_army: "직업군"
 CUB_prof_army_desc: "양보다 질이 낫다는 점을 깨달아야 합니다."
 CUB_mass_army: "대중의 군대"
 CUB_mass_army_desc: "우리 군에 사람이 많을수록 더 강해질 것입니다."
 CUB_contract_army: "계약제 군대"
 CUB_contract_army_desc: "사람들을 군 복무로 끌어들이기 위해 계약을 제안할 수 있습니다."
 CUB_reforms_of_army: "1992년 군 개혁 완수"
 CUB_reforms_of_army_desc: "1992년 쿠바 정부는 미국의 잠재적 공격을 막아내기 위한 새로운 군 개혁을 시작했습니다. 짧은 기간에 방공 체계가 세워지고 방어 시설이 구축되었으며 예비대가 훈련되었습니다."
 CUB_new_uniform: "새 군복"
 CUB_new_uniform_desc: "새 군대, 새 군복."
 CUB_3_years: "3년 군 복무"
 CUB_3_years_desc: "3년의 군 복무는 평범한 시민을 훌륭한 군인으로 만들어 줄 것입니다."
 CUB_armor_upgrade: "장갑 개량"
 CUB_armor_upgrade_desc: "자금 부족으로 새 장갑차량을 구입할 수 없으니, 낡은 것을 현대화합시다."
 CUB_modernize_to_current_standarts: "현행 기준에 맞춘 현대화"
 CUB_modernize_to_current_standarts_desc: "개혁을 시행한 뒤에는 현행 기준에 맞추어 군을 현대화할 수 있습니다."
 CUB_our_vpk: "우리의 군수 산업 복합체"
 CUB_our_vpk_desc: "강한 군대에는 강한 산업이 필요합니다."
 CUB_CBI_73M: "CBI-73M"
 CUB_CBI_73M_desc: "첨단 방공 체계는 다른 나라들의 강압으로부터 우리 자신을 진정으로 지킬 수 있게 해 줍니다."
 CUB_btr_100: "CBAF-115"
 CUB_btr_100_desc: "우리 군이 새로운 시대의 전투 요구에 적응할 수 있도록 새로운 장갑 수송차가 필요합니다."
 CUB_Jupiter_III: "주피터 III"
 CUB_Jupiter_III_desc: "첨단 자주포의 도입은 전장에서 우리에게 우위를 줄 수 있습니다."
 CUB_field_generals: "야전 장군 훈련"
 CUB_field_generals_desc: "우리의 야전 장군들은 최신 기준에 맞춰 훈련되어야 합니다."
 CUB_constant_drill: "끊임없는 교련"
 CUB_constant_drill_desc: "훈련에서 힘들면 전투에서 수월합니다."
 CUB_mobilize_our_army: "군 기계화"
 CUB_mobilize_our_army_desc: "우리 군은 신속한 기계화가 시급합니다."
 CUB_develop_young: "청년 노동군"
 CUB_develop_young_desc: "청년 노동군은 법률상 쿠바 혁명군부(MINFAR)의 직접 통제를 받는 준군사 조직입니다. 1973년 8월 3일 백주년 청년 종대와 상설 보병 사단을 통합하여 공식 창설되었습니다. 쿠바의 의무 복무법은 모든 남성 시민에게 쿠바군에서 3년간 복무할 것을 요구합니다."
 CUB_transport_troops_desc: "수송 부대를 창설하면 우리 병사들이 보급품을 더 빨리 받는 데 도움이 될 것입니다."
 CUB_modern_army: "현대 군대"
 CUB_modern_army_desc: "우리 군에 대한 길지만 필요한 개혁을 마친 뒤, 우리는 다시 한번 라틴아메리카 전역에서 두려운 세력이 되었습니다."
 CUB_special_force_idea: "잘 훈련된 특수 부대"
 CUB_powerful_sso_idea: "강력한 쿠바 특수 부대"
 CUB_disorg_in_army_idea: "무질서한 쿠바군"
 CUB_sso_is_our_all: "특수 부대가 우리의 전부"
 CUB_sso_is_our_all_desc: "이제 우리 특수 부대는 군의 힘이자 중추입니다!"
 CUB_coop_china: "중국과의 협력"
 CUB_coop_china_desc: "2000년 쿠바는 중국과 군사 협력을 확대하는 협정을 체결했습니다. 이제 군 현대화를 위해서는 협력을 확대하는 것이 최선의 선택일 것입니다."
 CUB_black_wasps: "검은 말벌"
 CUB_black_wasps_desc: "검은 말벌은 공식적으로 특수부대 기동여단(BMTE)이라고도 불리는 쿠바 혁명군의 특수 부대입니다. 흔히 군 부대 4895로 식별됩니다. 쿠바군의 정예로 간주됩니다."
 CUB_army_reorganisation: "군 재편"
 CUB_army_reorganisation_desc: "2000년대 초 쿠바는 군대를 현대적으로 재편해야 하는 과제에 직면했습니다. 세계 정치의 끊임없는 변화와 경제적 어려움 속에서 쿠바 지도부는 효율성을 높이고 새로운 도전에 적응하기 위해 군을 재편하는 전략적 결정을 내렸습니다."
 CUB_revolutionary_army: "혁명군(에헤르시토 레볼루시오나리오)"
 CUB_revolutionary_army_desc: "쿠바 공화국 혁명군은 쿠바 공화국 혁명군부의 가장 큰 구성 요소입니다. 그 구조, 편성 및 무장은 쿠바 혁명군의 임무와 과업에 따라 정해집니다."
 CUB_academy: "러시아 장교 학교"
 CUB_academy_desc: "러시아 군사 학교는 세계 최고 수준으로 평가받으니, 우리 사관생도를 그곳에 보내지 못할 이유가 있겠습니까?"
 CUB_extr_trai: "극한 훈련"
 CUB_extr_trai_desc: "모든 수업에서 높은 효율을!"
 CUB_night_vison_equipment: "야시 장비"
 CUB_night_vison_equipment_desc: "우리 군이 전장에서 더 효과적이려면 새로운 야시 체계가 필요합니다."
 CUB_special_weapons: "신형 특수 무기"
 CUB_special_weapons_desc: "우리의 특수 무기는 낡았으며, 새롭고 다루기 편한 장비를 더 빨리 개발해야 합니다."
 CUB_introduce_drones_in_sso: "특수 부대에 드론 도입"
 CUB_introduce_drones_in_sso_desc: "드론은 전쟁의 미래이며, 특수 부대에 드론을 도입해야 합니다."
 CUB_improve_communication_between_squads: "통신 개선"
 CUB_improve_communication_between_squads_desc: "특수 부대의 효율을 높이려면 부대 간 통신을 개선해야 합니다."
 CUB_new_doctrine: "특수 부대 신교리"
 CUB_new_doctrine_desc: "특수 부대에 새로운 무기가 도입된 지금, 새로운 전술이 필요합니다."
 CUB_coop_usa: "미국과의 협력"
 CUB_coop_usa_desc: "미군은 어디서나 최고입니다! 세계에서 가장 강한 군대와 협력하기만 하면 우리도 두려운 세력이 될 수 있습니다"
 CUB_expand_int: "비밀 기관 확대"
 CUB_expand_int_desc: "정보 기관을 확대하면 적의 모든 계획을 감시할 수 있으며, 그 밖의 일도 할 수 있습니다."
 CUB_upgrade_airforce: "공군 재편"
 CUB_upgrade_airforce_desc: "과거 쿠바 공군은 라틴아메리카에서 가장 강하다고 평가받았습니다. 그러나 지금 우리 공군은 매우 열악한 상태입니다. 옛 위상을 되찾으려면 매우 험난하고 긴 길을 가야 합니다."
 CUB_modernize_planes: "항공기 현대화"
 CUB_modernize_planes_desc: "우리 항공기는 수십 년간 현대화되지 못했습니다. 현대화하여 전투 능력을 높여야 합니다."
 CUB_modernize_air_def: "방공 체계 개량"
 CUB_modernize_air_def_desc: "우리의 방공 체계는 구식이므로, 우리 영토에 대한 공격을 저지하려면 방공 체계 전체를 개량해야 합니다."
 CUB_upgrade_radars: "레이더 체계 개량"
 CUB_upgrade_radars_desc: "우리 레이더는 매우 약해서 방공에 필요한 거리에서 표적을 포착하지 못합니다. 이제 이를 개선할 때입니다."
 CUB_upgrade_airbase: "공군 기지 건설"
 CUB_upgrade_airbase_desc: "공군이 확장됨에 따라 항공기와 병사의 배치를 고려해야 합니다. 따라서 더 많은 공군 기지를 건설해야 합니다."
 CUB_buy_drones: "드론 구매"
 CUB_buy_drones_desc: "드론은 적 영토를 타격하는 데 좋은 수단임이 입증되었으니, 드론을 조달하는 것이 어떻겠습니까. 아주 많은 드론을 말입니다."
 CUB_new_transport_planes: "신형 수송기 구매"
 CUB_new_transport_planes_desc: "수송기는 병사와 장비를 이동시키는 좋은 수단입니다. 우리 군의 기동성을 높이려면 이를 구매해야 합니다."
 CUB_rus_migs: "러시아제 미그 구매"
 CUB_rus_migs_desc: "우리의 옛 소련... 아니, 러시아 동지들이 새 항공기를 팔아 줄 수 있습니다. 그러니 무엇을 망설이는 것입니까?"
 CUB_us_f: "미국산 F-16 도입"
 CUB_us_f_desc: "냉전 시기에 우리는 소련제 장비로 싸울 수밖에 없었습니다. 이제 냉전도 소련도 없습니다. 그러니 양질의 미국제 항공기를 사는 것이 어떻겠습니까?"
 CUB_airforce_doc: "신 공군 교리"
 CUB_airforce_doc_desc: "공군의 구매와 현대화를 마친 뒤에는 공중전을 위한 새로운 전술이 필요합니다."
 CUB_air_doc: "제공권 장악"
 CUB_air_doc_desc: "하늘에서의 우세를 강조해야 합니다."
 CUB_ground_doc: "지상 지원"
 CUB_ground_doc_desc: "우리 공군은 보병과 협조하고 모든 교전에서 이들을 지원해야 합니다. 지상 지원을 강조해야 합니다."
 CUB_navy_reform: "해군 개혁"
 CUB_navy_reform_desc: "현재 우리 함대는 매우 구식입니다. 이를 최신화하려면 현대화와 개혁이 필요합니다."
 CUB_restore_spanish_boats: "구 스페인제 순찰정 복원"
 CUB_restore_spanish_boats_desc: "우리는 예비로 구 스페인제 순찰정 몇 척을 가지고 있습니다. 이를 현대화하여 함대에 편입할 수 있습니다."
 CUB_ask_north_korea: "북한과의 협력"
 CUB_ask_north_korea_desc: "우리 해군에는 새 잠수함이 필요하지만, 소련 붕괴 이후 건조 지원을 구할 수 있는 곳은... 북한뿐입니다."
 CUB_new_navy_doc: "신 해군 교리"
 CUB_new_navy_doc_desc: "부분적인 개혁 이후, 우리 해상 전력을 위한 새로운 전략을 수립해야 합니다."
 CUB_create_own_missles: "대함 미사일 개발"
 CUB_create_own_missles_desc: "우리에게는 옛 소련제 대함 미사일이 있지만 유지비가 너무 많이 듭니다. 따라서 이 미사일을 바탕으로 새로운 대함 미사일을 개발할 수 있습니다."
 CUB_restore_sovie_sub: "소련제 잠수함 복원"
 CUB_restore_sovie_sub_desc: "옛 소련제 잠수함을 현대화하여 다시 출항시킬 수 있습니다."
 CUB_doc_mining: "기뢰 부설 교리"
 CUB_doc_mining_desc: "우리가 적 함대를 침몰시키지 못하면 기뢰가 해낼 것입니다."
 CUB_exp_bases: "해군 기지 건설"
 CUB_exp_bases_desc: "우리의 거대한 함대에는 정박할 곳이 더 필요합니다. 따라서 새 기지를 최대한 빨리 건설해야 합니다."
 CUB_own_projects: "자체 프로젝트 착수"
 CUB_own_projects_desc: "함선 건조 경험을 쌓은 우리 기술자들은 마침내 자체 함선을 건조하기 시작할 수 있습니다."
 CUB_ill_mig: "불법 이주 대응"
 CUB_ill_mig_desc: "우리 해군으로 해안을 순찰하며 불법 이주에 대응할 수 있습니다."
 CUB_new_navy: "새로운 쿠바 해군"
 CUB_new_navy_desc: "모든 개혁과 현대화를 거쳐 우리 해군은 다시 강력해졌습니다."
 CUB_economic: "경제 개혁 착수"
 CUB_economic_desc: "1990년대 위기 이후 과잉 유동성을 억제하고, 노동 유인을 강화하며, 식량·소비재·서비스의 심각한 부족을 완화하기 위한 일련의 개혁을 추진해야 합니다."
 CUB_legalize_dollar: "경제의 달러화"
 CUB_legalize_dollar_desc: "쿠바의 달러화는 1993년 이후 쿠바 경제를 안정시키기 위해 시행된 거시경제 정책을 가리킵니다. 이는 처음에 1991년 소련 붕괴로 발생한 경제적 불균형을 보완하기 위해 채택되었습니다. 이 개혁의 주된 측면은 당시 불법이던 미국 달러를 합법화하고 섬 경제 내에서의 사용을 규제한 것이었습니다."
 CUB_new_model_economy: "새로운 경제 모델"
 CUB_new_model_economy_desc: "우리의 낡은 계획경제 체제는 현재의 조건에서 효과적이지 않습니다. 개혁의 목표를 달성하려면 경제를 자유화해야 합니다."
 CUB_agroculture_revive: "농공 복합체 복원"
 CUB_agroculture_revive_desc: "90년대에 우리는 농업 산업에 물자를 댈 수 없었습니다. 이제 식량 부족을 줄이기 위해 이를 재건해 볼 수 있습니다."
 CUB_develop_fishing_sector: "어업 부문 발전"
 CUB_develop_fishing_sector_desc: "어업 부문을 발전시키면 국내 식량 부족을 줄이고 새로운 일자리도 만들 수 있습니다."
 CUB_energy_rev: "에너지 혁명"
 CUB_energy_rev_desc: "에너지 혁명은 쿠바가 경제를 획기적으로 탈탄소화한 캠페인이었습니다. 이 캠페인은 쿠바의 전력 인프라를 분산시키고, 내구재를 에너지 효율이 더 높은 모델로 교체했으며, 재생 에너지의 사용을 확대했습니다."
 CUB_update_energy_system: "에너지 체계 갱신"
 CUB_update_energy_system_desc: "에너지 혁명을 더 빨리 완수하려면 에너지 체계를 개량해야 합니다."
 CUB_sugar: "설탕·담배 생산 확대"
 CUB_sugar_desc: "설탕과 담배 생산은 언제나 쿠바 경제의 매우 중요한 부분이었습니다. 이 제품들의 생산을 복원하고 확대해야 합니다."
 CUB_privitazing_manufactures: "공장의 민간 임대"
 CUB_privitazing_manufactures_desc: "2011년 개혁에서 쿠바 정부는 국영 기업을 민간에 넘기는 것을 허용했습니다."
 CUB_fin_sector_reforms: "금융 부문 개혁"
 CUB_fin_sector_reforms_desc: "2011년 12월 20일, 새로운 신용 정책은 쿠바 은행이 농민뿐 아니라 주택 개선을 위한 대규모 구매를 원하는 기업가와 개인에게도 자금을 지원할 수 있도록 허용했습니다."
 CUB_airports: "공항 개량"
 CUB_airports_desc: "우리 공항은 외관도 내부도 낡았습니다. 현대화합시다."
 CUB_cubana_inv: "쿠바나 투자"
 CUB_cubana_inv_desc: "흔히 쿠바나로 알려진 쿠바나 데 아비아시온 S.A.는 쿠바의 대표 항공사이자 이 나라 최대의 항공사입니다. 1929년 10월에 설립되어 라틴아메리카에서 가장 먼저 등장한 항공사 가운데 하나가 되었습니다."
 CUB_nuclear_power: "원자로 건설 재개"
 CUB_nuclear_power_desc: "지난 세기에 우리는 소련과 함께 원자로를 건설하려 했으나 완공하지 못했습니다. 이제 가용 자금으로 이를 완성해 볼 수 있습니다."
 CUB_end_dual_currency: "이중 통화 종료"
 CUB_end_dual_currency_desc: "이제 모든 개혁이 갖추어졌으므로, 미국이 우리 국내 정치에 크게 영향을 미칠 수 있게 하는 달러를 안심하고 없앨 수 있습니다."
 CUB_modern_economy: "경제 현대화"
 CUB_modern_economy_desc: "이제 우리 경제의 모든 개혁과 현대화를 거쳤으니 다시 성장하기 시작할 수 있습니다!"
 CUB_become_global: "타국과의 무역 허용"
 CUB_become_global_desc: "쿠바는 계속해서 세계에 문을 열어야 합니다!"
 CUB_allow_foreign_inv: "외국인 투자자 유치"
 CUB_allow_foreign_inv_desc: "국경이 열리면 경제 재건에 외국인 투자자를 유치할 수 있습니다."
 CUB_ask_russia: "러시아 투자"
 CUB_ask_russia_desc: "경제를 재건하기 위해 옛 러시아 친구들과 그들의 자금을 끌어들일 수 있습니다."
 CUB_ask_EU: "유럽 투자"
 CUB_ask_EU_desc: "유럽인들은 러시아보다 우리 경제 재건을 도울 자금과 능력이 훨씬 많습니다. 유럽인들이 우리나라에 와서 투자하도록 적극적으로 장려해야 합니다."
 CUB_eastern_invest: "동방 투자자 유치"
 CUB_eastern_invest_desc: "동방에는 우리나라에 큰 관심을 가진 친구들이 더 있습니다. 쿠바에 오신 것을 환영합니다!"
 CUB_western_invest: "서방 투자자 유치"
 CUB_western_invest_desc: "EU와의 무역을 시작하면 더 많은 유럽 시민을 우리나라로 끌어들일 수 있습니다."
 CUB_create_ZEDM: "ZEDM 조성"
 CUB_create_ZEDM_desc: "마리엘 특별개발구(ZEDM)는 쿠바의 핵심 경제 프로젝트입니다. 2009년 라울 카스트로는 컨테이너 터미널을 갖춘 신규 항만을 건설하는 계약을 브라질 기업과 체결했습니다. 마리엘 특구는 2013년 11월에 공식 개장했습니다."
 CUB_invest_in_education: "교육에 투자"
 CUB_invest_in_education_desc: "외국인에게서 얻는 자금으로 교육을 개선할 수 있습니다."
 CUB_invest_in_manufacturing: "제조업 투자"
 CUB_invest_in_manufacturing_desc: "투자를 통해 우리의 제조업을 개선해야 합니다."
 CUB_invest_in_healthcare: "의료에 투자"
 CUB_invest_in_healthcare_desc: "이제 자금이 생겼으니 국민의 삶, 특히 의료 체계를 개선해야 합니다."
 CUB_subsidies: "복지 급여 인상"
 CUB_subsidies_desc: "국민의 삶의 질을 높이려면 복지 급여를 인상해야 합니다."
 CUB_invest_in_infrastructure: "기반시설에 투자"
 CUB_invest_in_infrastructure_desc: "투자자를 더 끌어들이려면 인프라를 개량하기 좋은 때입니다."
 CUB_invest_hub: "투자 거점"
 CUB_invest_hub_desc: "이제 우리나라는 투자자에게 가장 매력적인 나라 가운데 하나가 되었으며, 그 도움으로 나라를 발전시킬 수 있습니다."
 CUB_infr_development: "인프라 개발 착수"
 CUB_infr_development_desc: "가용 자금으로 이미 낡은 인프라의 현대화를 시작할 수 있습니다."
 CUB_invest_habanna: "아바나에 투자"
 CUB_invest_habanna_desc: "아바나는 쿠바의 수도이지만 건축물 상태가 좋지 않아 이 문제를 진지하게 다뤄야 합니다."
 CUB_invest_camaguey: "카마궤이에 투자"
 CUB_invest_camaguey_desc: "카마궤이는 쿠바의 주요 도시입니다. 1990년대 위기로 인프라가 파괴되었으며, 이제 이를 재건해야 합니다."
 CUB_upgrade_central_road: "중앙 도로 개량"
 CUB_upgrade_central_road_desc: "\\"중앙 도로\\"를 뜻하는 카레테라 센트랄(CC)은 쿠바 섬의 전 길이를 가로지르는 동서 간선 도로입니다."
 CUB_upgrade_railway: "철도 개량"
 CUB_upgrade_railway_desc: "우리의 철도 체계는 낡았으며 갱신해야 합니다."
 CUB_invest_santa_clara: "산타클라라에 투자"
 CUB_invest_santa_clara_desc: "산타클라라는 쿠바 비야클라라주의 주도입니다. 주와 쿠바의 중앙에 위치하며, 인구 약 245,959명으로 쿠바에서 다섯 번째로 인구가 많은 도시입니다."
 CUB_port: "항만 건설 착수"
 CUB_port_desc: "대외 무역이 성장함에 따라 더 많은 항만을 건설해야 합니다."
 CUB_develop_internet: "인터넷 발전"
 CUB_develop_internet_desc: "우리나라는 인터넷 체계 전체를 현대화해야 합니다."
 CUB_tourism_projects2: "관광 프로젝트 착수"
 CUB_tourism_projects2_desc: "관광 프로그램의 도움으로 우리 경제를 부분적으로 재건할 수 있습니다."
 CUB_hotels: "호텔 건설"
 CUB_hotels_desc: "외국인 관광객을 위해 훌륭하고 현대적이며 아름다운 호텔이 필요합니다. 최대한 빨리 건설을 시작해야 합니다."
 CUB_santa: "산타클라라"
 CUB_santa_desc: "산타클라라는 우리나라에서 가장 인기 있는 관광지 가운데 하나이므로, 관광객 유입을 늘리기 위해 투자해야 합니다."
 CUB_camaguey: "카마궤이"
 CUB_camaguey_desc: "카마궤이는 쿠바 중부의 도시이자 지방 자치체로, 333,000명이 넘는 주민이 사는 쿠바에서 세 번째로 큰 도시입니다. 카마궤이주의 주도입니다."
 CUB_habanna: "아바나"
 CUB_habanna_desc: "아바나는 쿠바의 수도이자 최대 도시입니다. 아바나주의 중심인 아바나는 이 나라의 주요 항구이자 상업 중심지입니다."
 CUB_invite_foreign_inv: "외국인 관광객 유치 시작"
 CUB_invite_foreign_inv_desc: "필요한 인프라가 모두 갖추어졌으니 외국인들을 우리나라로 끌어들이기 시작할 수 있습니다."
 CUB_new_airports: "신규 공항"
 CUB_new_airports_desc: "새 공항이 필요합니다."
 CUB_tourism_hub: "관광 거점"
 CUB_tourism_hub_desc: "이제 우리나라는 전 세계 관광객에게 가장 인기 있는 나라 가운데 하나입니다!"
 CUB_blokade_economy: "쿠바 봉쇄 경제"
 CUB_blokade_economy_desc: "미국의 대쿠바 제재: 미국이 쿠바에 대해 시행한 일련의 경제 조치입니다. 제재는 쿠바가 미국 시민과 기업의 재산을 몰수한 1960년에 부과되었고, 1962년에는 사실상 전면적인 금수 조치로 강화되었습니다."
 CUB_wto: "세계무역기구 가입"
 CUB_wto_desc: "세계무역기구는 국제 무역을 자유화하고 회원국 간의 무역 및 정치 관계를 규율하기 위해 1995년 1월 1일 설립된 통합 기구입니다."
 CUB_coop_with_eacu: "유라시아경제연합과의 협력"
 CUB_coop_with_eacu_desc: "유라시아경제연합은 유라시아 경제 연합 조약에 의해 설립된, 국제법적 인격을 갖춘 지역 경제 통합 국제기구입니다."
 CUB_ties_with_latin_america: "라틴아메리카와의 유대"
 CUB_ties_with_latin_america_desc: "경제 금수 조치 속에서 라틴아메리카는 쿠바에 중요한 경제 협력국입니다."
 CUB_end_common_position: "공동 입장 종결"
 CUB_end_common_position_desc: "쿠바에 대한 EU 공동 입장은 EU 회원국들의 대쿠바 외교 정책 체계입니다. 이 입장은 우리와 유럽의 무역 관계 발전을 가로막으므로, 협상하여 이 입장의 효력을 종결시켜야 합니다."
 CUB_ties_with_west: "서방과의 유대"
 CUB_ties_with_west_desc: "공동 입장이 폐지되었으니 쿠바와 유럽의 관계를 가로막는 것은 아무것도 없습니다!"
 CUB_PDCA: "PDCA"
 CUB_PDCA_desc: "2016년 12월 12일, EU와 쿠바는 정치 대화 및 협력 협정(PDCA)에 서명했습니다."
 CUB_trade_with_rus: "러시아와의 무역"
 CUB_trade_with_rus_desc: "러시아는 우리의 오랜 경제 협력국이므로 유대를 강화해야 합니다."
 CUB_trade_with_chi: "중국과의 무역"
 CUB_trade_with_chi_desc: "중국은 신흥 기술 강국이므로, 현대 기술에 접근하기 위해 관계를 강화해야 합니다."
 CUB_enter_brics: "BRICS 가입"
 CUB_enter_brics_desc: "국가 간 연합체이자 연맹 기구(국가 공동체)인 BRICS는 2006년 6월 브라질, 러시아, 인도, 중국의 경제 장관이 참여한 가운데 상트페테르부르크 경제 포럼의 틀 안에서 (BRIC으로) 창설되었습니다."
 CUB_demand_from_us: "봉쇄 해제 촉구"
 CUB_demand_from_us_desc: "이제 세계에 많은 동맹이 생겼으니, 미국 침략자의 봉쇄를 해제하라고 요구할 수 있습니다."
 CUB_MERCOSUR: "메르코수르와의 유대"
 CUB_MERCOSUR_desc: "스페인어 약칭 메르코수르, 포르투갈어로는 메르코술로 흔히 알려진 남부공동시장은 1991년 아순시온 조약과 1994년 오루프레투 의정서에 의해 설립된 남미 무역 블록입니다. 정회원국은 아르헨티나, 브라질, 파라과이, 우루과이입니다."
 CUB_operation_miracle: "기적 작전 착수"
 CUB_operation_miracle_desc: "기적 작전(오페라시온 밀라그로)은 쿠바와 베네수엘라가 자금을 지원하는 국제 의료 프로그램으로, 제3세계 국가의 빈곤층에게 백내장, 녹내장, 사시 등의 질환에 대한 무료 치료를 제공합니다."
 CUB_revive_metallurgy: "쿠바 야금 산업 부활"
 CUB_revive_metallurgy_desc: "야금업은 우리 경제의 중요한 부문입니다. 그러나 우리의 야금업은 상태가 좋지 않아 재건해야 합니다."
 CUB_upgrade_old_factories: "낡은 공장 개량"
 CUB_upgrade_old_factories_desc: "상태가 나쁜 공장이 몇 곳 있는데, 이를 재건하고 절약한 자금으로 다른 공장을 건설할 수 있습니다."
 CUB_expand_gold_mining: "금 채굴 확대"
 CUB_expand_gold_mining_desc: "금은 시장에서 매우 높게 평가받는 귀중한 물질이며, 그 도움으로 추가 수입을 올릴 수 있습니다."
 CUB_update_old_factory: "신규 정제소"
 CUB_update_old_factory_desc: "낡은 것보다 더 강력하고 더 나은 새 공장을 짓기 시작할 때입니다."
 CUB_mir_card: "미르 카드 수용 의무"
 CUB_mir_card_desc: "결제 거래 서비스를 제공하고 은행 카드를 발급하는 러시아의 국가 결제 시스템입니다. 러시아와 전 세계에서 이 시스템의 핵심 사업은 은행 카드 발급입니다. 이를 통해 러시아 관광객을 우리나라로 끌어들일 수 있습니다."
 CUB_oil: "석유 문제"
 CUB_oil_desc: "소련의 붕괴와 이에 따른 무역·경제·기술 유대의 파괴는 1991년 이후 쿠바 경제의 악화로 이어졌습니다. 이는 우리의 석유 매장량에도 큰 영향을 미쳤으며, 이 문제는 여전히 우리나라의 심각한 문제로 남아 있어 이제는 해결해야 할 때입니다."
 CUB_cooperation_with_rus: "러시아와의 협력"
 CUB_cooperation_with_rus_desc: "2014년 로스네프트와 쿠바 국영 석유 회사 유니온 쿠바페트롤레오는 기존 유전의 석유 회수율 증진 협력에 관한 협정과 쿠바 대륙붕 공동 개발에 관한 협정에 서명했습니다."
 CUB_cooperation_with_ven: "베네수엘라와의 협력"
 CUB_cooperation_with_ven_desc: "현재 상황에서 우리의 유일한 석유 협력국은 여전히 베네수엘라이므로, 양국은 협력을 확대해야 합니다."
 CUB_cooperation_with_per: "이란과의 협력"
 CUB_cooperation_with_per_desc: "우리 석유 기업에 이란의 투자를 유치할 수 있습니다."
 CUB_search_for_new_deposits: "신규 매장지 탐사"
 CUB_search_for_new_deposits_desc: "우리는 새 유전이 절실하며, 카리브해에서 탐사할 수 있습니다."
 CUB_ROSNEFT: "로스네프트와의 계약"
 CUB_ROSNEFT_desc: "공개 주식회사 로스네프트 석유 회사(PJSC 로스네프트 석유 회사)는 러시아의 주요 석유·가스 기업입니다. 2013년에 세계 최대의 석유 생산 기업이 되었습니다."
 CUB_PDVSA: "PDVSA와의 계약"
 CUB_PDVSA_desc: "PDVSA는 베네수엘라의 국영 석유·가스 기업이자 이 나라 최대의 기업입니다. 베네수엘라의 대륙붕과 해양 대륙붕에서 석유와 천연가스를 생산할 독점권을 가지고 있습니다."
 CUB_CUPET: "CUPET 확대"
 CUB_CUPET_desc: "CUPET은 쿠바 최대의 석유 기업입니다. 쿠바 중앙 정부가 소유하고 운영합니다."
 CUB_idea_blockade: "쿠바에 대한 봉쇄(엘 블로케오)"
 CUB_idea_blockade_desc: "1962년 미국은 쿠바에 금수 조치를 시행하였고 이는 한 번도 해제되지 않았습니다. 1990년대 초 소련이 붕괴하면서 쿠바에 무역 상대국이 거의 남지 않게 되자 그 영향은 특히 치명적이 되었습니다."
 CUB_idea_Tol_Biz_1: "소규모 사업 용인"
 CUB_idea_Tol_Biz_1_desc: "소규모 사업은 용인됩니다"
 CUB_idea_coops: "농업 협동조합"
 CUB_idea_elam: "라틴아메리카 의과대학"
 CUB_idea_elam_desc: "라틴아메리카 의과대학은 소외된 지역 사회에서 봉사할 전 세계의 의사를 양성하는 국제 학교입니다."
 CUB_idea_tourist_industry: "쿠바 관광"
 CUB_idea_tourist_industry_desc: "우리의 위대한 조국에 대한 관광을 장려해야 합니다. 쿠바에는 풍부하고 활기찬 역사가 있으며, 우리나라의 이 중요한 부분을 장려하는 것이 중요합니다."
 CUB_idea_special_period: "특별 시기"
 CUB_idea_special_period_desc: "특별 시기는 소련 붕괴 이후 쿠바가 겪은 경제 침체와 위기의 시기였습니다."
 CUB_oil_repair_idea1: "쿠바 석유 산업의 부흥"
 CUB_airforce_idea: "쿠바 공군 개혁"
 CUB_navy_idea: "함대 개혁"
 cuba.11.t: "쿠바의 지도자가 된 라울"
 cuba.11.d: "피델이 최근 권력에서 물러난 뒤, 그의 동생 라울이 그 자리를 이었습니다. 우리를 더 밝은 미래로 이끌 사람은 바로 그입니다!"
 cuba.11.a: "라울 카스트로 만세!"
 cuba.15.t: "로헬리오 아세베도 사건"
 cuba.15.d: "로헬리오 아세베도 곤살레스는 1941년 쿠바 카이바리엔에서 태어났으며, 쿠바 혁명 중이던 1957년 7월 26일 운동에 참여했습니다. 그는 체 게바라의 부관인 라미로 발데스와 시로 레돈도 휘하에서 복무했고, 이후 1961년 피그스 만 침공에 맞서 싸웠습니다. 1960년에는 국가혁명민병대 지휘관이 되었고, 1975년에는 앙골라 군사 사절단의 참모장을 지냈습니다. 그러나 우리 정보 기관은 그가 부패 사건에 연루되었다는 증거를 가지고 있으며, 많은 이들이 그의 체포와 재산 몰수를 요구하고 있습니다."
 cuba.15.b: "부패를 보지 않으면 부패도 당신을 보지 않는 법이다"
 cuba.56.t: "쿠바의 투자 제안"
 cuba.56.d: "쿠바가 우리를 자국에 투자하도록 초청했습니다. 쿠바 측에 따르면 이 투자는 전망이 밝고 그들의 경제에 크게 도움이 될 것입니다. 우리는 자유의 섬에 대한 영향력을 높일 수 있을 것입니다. 동의하시겠습니까?"
 cuba.56.a: "찬성"
 cuba.56.b: "안된다"
 cuba.57.t: "무역 협정을 제안하는 쿠바"
 cuba.57.d: "최근 양국 관계가 개선되는 추세 속에서, 쿠바는 무역 협정 체결을 기대하는 모양입니다. 동의하시겠습니까?"
 cuba.57.a: "찬성"
 cuba.57.b: "안된다"
 cuba.58.t: "쿠데타를 준비하는 쿠바"
 cuba.58.d: "우리 정보에 따르면 쿠바 정보 기관은 우리나라를 포함한 여러 나라에서 무장 봉기를 준비하고 있습니다. 상황을 면밀히 주시해야 합니다."
 cuba.58.a: "평화를 원한다면 전쟁에 대비하라"
 cuba_news.59.t: "버락 오바마와 라울 카스트로의 회담"
 cuba_news.59.d: "오늘 쿠바와 미국의 지도자가 만났습니다. 반세기에 걸친 양국 대립의 사실상 전 역사에서 처음 있는 일입니다. 지도자들은 훈훈한 대화를 나누었고 관계와 무역을 발전시키겠다는 의지도 밝혔습니다."
 cuba_news.59.a: "미국-쿠바 관계의 새로운 전환점!"
 cuba_news.60.t: "블라디미르 푸틴, 라울 카스트로와 회담"
 cuba_news.60.d: "블라디미르 푸틴은 오늘 쿠바 지도자 라울 카스트로와 회담했습니다. 두 지도자는 서로를 따뜻하게 맞이한 뒤 회담과 기자회견을 가졌습니다. 러시아와 쿠바는 계속해서 관계를 개선하고 무역과 동반자 관계를 발전시킬 것입니다"
 cuba_news.60.a: "매우 흥미롭군!"
 cuba_news.61.t: "쿠바의 새 지도자가 된 미겔 디아스카넬"
 cuba_news.61.d: "오늘 미겔 디아스카넬이 공식적으로 쿠바의 새 지도자가 되었습니다. 그는 모두의 지지에 감사를 표하고 쿠바 국민의 복리를 위해 봉사하겠다고 약속했습니다."
 cuba_news.61.a: "카스트로의 시대가 공식적으로 막을 내렸다"
 cuba_news.62.t: "수천 명의 수감자를 사면한 쿠바"
 cuba_news.62.d: "쿠바 정부는 2,900명의 수감자를 석방한다고 발표했으며, 이 중 다수는 \\"국가 안보에 대한 범죄\\"로 유죄 판결을 받은 이들이었습니다. 쿠바 정부가 이러한 조치를 취한 일은 거의 없었습니다."
 cuba_news.62.a: "흥미롭군"
 cuba.66.t: "봉쇄 해제를 요청하는 쿠바"
 cuba.66.d: "쿠바 정부는 미국-쿠바 관계와 양국 간 무역이 개선되었음을 이유로 금수 조치의 해제를 요청하였습니다."
 cuba.66.a: "알겠다"
 cuba.66.b: "안된다"
 cuba.67.t: "봉쇄를 해제한 미국"
 cuba.67.d: "마침내 우리 섬이 편안히 살 수 있게 되었습니다."
 cuba.67.a: "좋아"
 cuba.68.t: "미국의 거부"
 cuba.68.d: "봉쇄는 계속됩니다."
 cuba.68.a: "아."
 CUB_israel: "이스라엘의 침략에 대한 규탄"
 CUB_israel_desc: "이스라엘은 아랍 국가들과 팔레스타인 국민에 대한 정책에서 지나치게 공격적이었습니다. 우리는 그 지도부의 이러한 행위를 규탄하며 외교 정책 노선의 변경을 요구합니다."
 cuba.72.t: "보호를 요청하는 쿠바"
 cuba.72.d: "쿠바 정부는 우리의 기지를 자국 섬에 배치해 달라고 요청하고 있습니다. 그들의 견해로는 미국이 자국에 중대한 위협이 됩니다. 이에 동의해야 합니까?"
 cuba.72.a: "그들을 지켜 주자."
 cuba.72.b: "안된다"
 cuba.73.t: "우리를 보호할 러시아"
 cuba.73.d: "러시아가 우리를 보호할 것입니다. 첫 장비 수송대가 이미 우리 섬을 향해 출발했습니다."
 cuba.73.a: "좋다."
 cuba.74.t: "우리의 보호를 거부한 러시아"
 cuba.74.d: "러시아 외교관들은 우리를 방어하는 것을 단호히 거부하는 서한을 보내왔습니다. 우리는 홀로 남은 것으로 보입니다."
 cuba.74.a: "Sad."
 CUB_russian_bases: "쿠바 내 러시아 기지"
 CUB_russian_bases_desc: "미국이 우리와 대화하지 않으려 하니, 이제 러시아군과 대화하게 될 것입니다."
 CUB_miguel_comeback: "§Y미겔 마리오 디아스카넬이 쿠바 공산당 지도자가 됩니다§! §G(신흥 성향)§!"
 cuba.15.a: "체포하라!"
 CUB_destoryed_agriculture_idea: "파괴된 농업"
 CUB_destoryed_agriculture_idea_desc: "90년대의 위기 동안 자금 부족으로 우리 경제의 핵심 부문들이 큰 타격을 입었습니다. 그 가운데 하나가 농업입니다. 우리는 농업을 재건해야 합니다."
 CUB_agriculture: "쿠바 농업"
 CUB_revive_agri: "되살아난 농업"
 CUB_business: "사업 장려책"
 CUB_business_desc: "오랜 불황 끝에 우리 경제에는 자극이 필요합니다. 새로운 사업체들은 이 경제적 구렁텅이에서 벗어나는 데 필요한 동력을 줄 것입니다."
 CUB_nationalize_foreign_business: "외국 기업 국유화"
 CUB_nationalize_foreign_business_desc: "외국 기업은 우리 경제의 큰 문제이며, 이를 통해 외국 정부들이 우리 경제에 영향력을 행사합니다."
 CUB_business_for_all: "모두를 위한 사업"
 CUB_business_for_all_desc: "유럽과 미국의 사례를 보면 사업이야말로 사람들이 생각해 낸 최선의 것임을 알 수 있습니다. 따라서 사람들이 사업을 시작하도록 동기를 부여해야 합니다."
 CUB_seize_venezuella: "베네수엘라 침공"
 CUB_seize_venezuella_desc: "펜으로 얻지 못하는 것은 칼로 얻겠습니다."
 CUB_agriculture_revive: "우리의 농업 부흥"
 CUB_agriculture_revive_desc: "하루빨리 농업을 되살려야만 국가 발전을 가장 잘 뒷받침할 수 있습니다."
 CUB_fight_against_corruption: "부패와의 전쟁"
 CUB_fight_against_corruption_desc: "부패는 모든 국가의 문제이지만, 그렇다고 이를 받아들여야 한다는 뜻은 아닙니다. 모든 부패는 뿌리부터 뽑아야 합니다."
 CUB_rebirth_of_avia: "쿠바 항공의 부활"
 CUB_rebirth_of_avia_desc: "이제 우리 공군은 다시 한번 라틴아메리카의 강력한 세력이 되기 위해 필요한 모든 것을 갖추었습니다."
 CUB_invite_colombia_tt: "[COL.GetNameWithFlag]을(를) 우리 연방에 초청할 수 있게 됩니다"
 CUB_invite_colombia: "콜롬비아 초청"
 CUB_invite_colombia_desc: "콜롬비아도 우리 연방에서 가장 중요한 나라 가운데 하나인데, 왜 우리와 함께하지 않는 것입니까?"
 CUB_expand_iron_mining: "철광 채굴 확대"
 CUB_expand_iron_mining_desc: "산업 발전을 뒷받침하려면 강철이 필요하고, 아주 많이 필요합니다."
 CUB_expand_aluminum_mining: "알루미늄 생산 확대"
 CUB_expand_aluminum_mining_desc: "알루미늄은 지구상에서 가장 흔한 금속이지만, 우리나라에는 매우 절실합니다."
 CUB_expand_tungsten_mining: "텅스텐 채굴 확대"
 CUB_expand_tungsten_mining_desc: "텅스텐은 우리 경제에 매우 필요하므로 그 채굴에 집중해야 합니다."
 CUB_talks_with_colombia: "콜롬비아와의 회담"
 CUB_talks_with_colombia_desc: "콜롬비아도 우리 연방에서 가장 중요한 나라 가운데 하나인데, 왜 우리와 함께하지 않는 것입니까?"
 CUB_talks_with_jamaica: "자메이카와의 협상"
 CUB_talks_with_jamaica_desc: "자메이카 역시 수년 전 우리 연방 구상이 처음 나왔을 때 가입 후보국이었으며, 이제 두 번째 초청장을 보낼 때입니다."
 CUB_welfare_funds: "자선 재단 설립"
 CUB_welfare_funds_desc: "자선 재단은 투자를 통해 평범한 쿠바인들의 삶을 개선하는 데 도움이 될 것입니다."
 CUB_caribbean_nation: "카리브 민족"
 CUB_caribbean_nation_desc: "이제 쿠바도, 도미니카 공화국도, 아이티도 없습니다. 카리브해의 모든 민족이 하나의 지붕 아래 통합되었고 함께 발전해 나갈 것입니다!"
 CUB_control_colombia: "콜롬비아 병합"
 CUB_control_colombia_desc: "콜롬비아의 산악 지대를 전차로 누빌 때입니다."
 CUB_defense_strategy: "방어 전략"
 CUB_defense_strategy_desc: "최선의 방어는 공격이라는 말은 우리 군에는 해당하지 않습니다. 유연하고 종심 깊은 방어를 위한 전술을 개발해야 합니다."
 CubaConf.51.t: "안틸레스 연방"
 CubaConf.51.d: "[FROM.GetName]은(는) 안틸레스 연방에 가입하라는 우리의 제안을 거절하였습니다"
 CubaConf.51.a: "유감이다"
 greater_spanish_alliance: "대스페인 동맹"
 CUB_modern_army_idea_mass: "현대 쿠바 대중군"
 CUB_modern_army_idea_prof: "현대 쿠바 직업군"
 CUB_low_cost_of_living: "낮은 생활비"
 CUB_low_cost_of_living_desc: "쿠바의 평균 임금은 월 15 USD로 환산될 뿐입니다. 정부 지출의 대부분이 사회 프로그램에 들어가지만 실제 비용은 그에 비례합니다. 은퇴자와 복지 수급자 모두 월 6 USD에 해당하는 금액에도 못 미치게 받습니다. 이 국가 정신은 1인당 GDP가 30k를 넘으면 제거됩니다."
 CUB_tourism: "관광지"
 CUB_tourism_desc: "쿠바는 역사적으로 관광을 주요 수입원 중 하나로 삼아 왔습니다."