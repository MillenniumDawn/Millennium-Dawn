 mercosur_news.1.t: "South American Summit Announced"
 mercosur_news.1.d: "A new South American Summit has been announced as the first step toward renewed regional cooperation. Organizers have declared that MERCOSUR must be revitalized, economic coordination strengthened, and the continent given a stronger collective voice in world affairs. Supporters hail the initiative as a long-overdue return to regional ambition, while critics question whether South America can move beyond symbolism and into durable integration."
 mercosur_news.1.a: "A new regional chapter begins."
