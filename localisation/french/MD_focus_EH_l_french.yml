 EH_territorial_defense_idea_TT: "§YAjouter un modificateur de Défense Territoriale§!"
 EH_electric_traps_TT: "Active les décisions §YPièges électriques§!, qui apparaîtront sur la carte en guerre contre les Chimères (onglet des décisions actif). Chaque piège peut être posé sur un État contrôlé qui est un État de §Ypremière ligne§! ou de §Yseconde ligne§!. Installer le piège coûtera §R1 métal technologique§! et il utilisera §R100 MW§! d'énergie tant qu'il est actif.\n\nLe piège sera actif §Y10 jours§! puis passera en temps de recharge de §Y15 jours§!. Tant qu'il est actif, toutes les unités ennemies dans l'État recevront §G+20 %§! d'§Yusure§! et §G-15 %§! de §Yvitesse de mouvement§!. Le piège peut être retiré, ce qui remboursera §G1 métal technologique§!."
 EH_electric_trap_cooldown: "Le piège est en temps de recharge ([?EH_electric_trap_cooldown:days_left|0Y] jours)"
