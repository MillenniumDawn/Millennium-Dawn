 ukraine_operatives.1.name: "Новый глава внутренней безопасности"
 ukraine_operatives.1.desc: "Андрей Наумов возглавил Главное управление внутренней безопасности СБУ — подразделение, которое следит за теми, кто следит. Он молод, хорошо связан и пользуется доверием команды президента. Внутренняя безопасность знает каждого куратора, каждый источник и каждую операцию службы. Тот, кто её возглавляет, может руководить и разведывательной работой СБУ."
 ukraine_operatives.1.a: "Ему доверяет президент."
 ukraine_operatives.2.name: "Глава внутренней безопасности бежит"
 ukraine_operatives.2.desc: "Андрей Наумов без предупреждения покинул страну. Человек, отвечавший за поимку предателей внутри СБУ, пересёк границу за несколько часов до начала рабочего дня, и никто не может сказать, что он забрал с собой. Каждый известный ему источник, каждого проверенного им офицера и каждую одобренную им операцию теперь приходится считать скомпрометированными. Следующий год служба потратит на то, чтобы выяснить, сколько вреда может нанести один человек."
 ukraine_operatives.2.a: "Считать раскрытым всё, к чему он прикасался."
 ukraine_operatives.3.name: "Новый начальник ГУР"
 ukraine_operatives.3.desc: "Кирилл Буданов всю карьеру провёл в частях специального назначения Главного управления разведки, во многом — в операциях в тылу врага. Теперь, в свои тридцать с небольшим, он самый молодой офицер, которому когда-либо предлагали возглавить украинскую военную разведку. Ему нужно управление, которое действует, а не отчитывается."
 ukraine_operatives.3.a: "Отдать ему управление."
 ukraine_operatives.4.name: "Буданов переходит на Банковую"
 ukraine_operatives.4.desc: "Президент попросил Кирилла Буданова оставить Главное управление разведки и возглавить Офис президента. Войной теперь руководят с Банковой, и человек, лучше всех знающий планы противника, будет сидеть рядом с тем, кто решает, как на них отвечать. Разведданные будут доходить до президента быстрее, чем когда-либо, а от спецслужб будут ждать их больше — и за более высокую цену."
 ukraine_operatives.4.a: "Перевести его на Банковую."
 UKR_naumov_defection: "Побег из внутренней безопасности"
 UKR_naumov_defection_desc: "Бывший глава внутренней безопасности СБУ бежал за границу. Пока не проверены все известные ему источники и операции, служба не может доверять собственным сетям."
 UKR_budanov_presidential_office: "Буданов в Офисе президента"
 UKR_budanov_presidential_office_desc: "Офис президента возглавляет бывший начальник военной разведки. У спецслужб прямой доступ к президенту и соответствующий бюджет."
 UKR_reactivate_sov_category: "Советская техника на хранении"
 UKR_reactivate_sov_category_desc: "\n\n\n\n\n\n£UKR_desctext_reactivate_sov_main\n\n\n\n\n\n\n\n\n§WСотни танков, бронемашин, разведывательных машин и другой техники §Rсоветской§! эпохи прямо сейчас §Rржавеют§! на наших базах хранения.\nНаши §YКБ§!, §YВПО§! и §Yремонтные заводы§! могут разработать подходящие программы модернизации и восстановить эту технику для нашей армии или на экспорт.\nПусть сейчас она выглядит непривлекательно, но со временем, деньгами и усилиями мы сможем снова превратить её в §Gбоеспособную силу§!.\n\nНиже показано, что сейчас хранится на складах.\n§!"
