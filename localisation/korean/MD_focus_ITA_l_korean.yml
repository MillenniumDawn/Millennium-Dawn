 xylella_epidemic: "크실레라 확산"
 xylella_epidemic_TT: "크실레라 파스티디오사는 특히 올리브나무에 치명적인 매우 해로운 해충입니다.\n\n 이로 인해 주간 추가 지출이 §R0.05§! 십억 증가합니다."
 ITA_multipurpose_modifier: "다목적 변동치"
 ITA_multipurpose_modifier_TT: "이 동적 변동치는 국가 정신 창이 지저분해지는 것을 막기 위해 여러 중점과 결정의 효과를 모두 저장합니다."
 roma_capitale_modifier: "로마 카피탈레"
 floods_and_land_erosion: "홍수와 토양 침식"
 floods_and_land_erosion_TT: "리구리아는 아름다운 지역이며, 그 동부에 있는 유명한 \\"친퀘 테레\\"는 특히 그렇습니다. 그러나 최근 몇 년간 수문학적 불안정에 시달려 홍수와 산사태가 풍경을 파괴하고 관광에 큰 타격을 주고 있습니다."
 ITA_drought: "가뭄"
 ITA_drought_desc: "환경 조건과 끔찍한 물 관리가 가뭄을 초래했습니다. 이제 물 공급을 줄여 물을 아껴야 합니다."
 ITA_roma_invicta: "로마 인빅타"
 ITA_roma_invicta_desc: "우리는 마침내 로마 제국의 정당한 국경을 되찾았습니다. 이제 갓 되살아난 불사조가 세계 위로 날개를 펼칠 때입니다."
 ITA_architectural_masters: "건축의 대가"
 ITA_architectural_masters_desc: "우리는 영광스러운 과거의 수많은 걸작을 재건했으며, 그 과정에서 세계에 영감을 주는 건축 르네상스를 일으켰습니다."
 ITA_small_medium_business: "중소기업"
 ITA_small_medium_business_desc: "이탈리아의 기업 부문은 극도로 분산되어 있으며, 대부분의 산업이 소규모 가족 기업이 지배하는 경향이 있어 대기업은 극히 드뭅니다. 이러한 기업들의 작은 규모와 보수성 탓에 다른 서방 국가에 비해 혁신의 여지가 거의 없습니다."
 ITA_russian_propaganda: "러시아의 선전"
 ITA_russian_propaganda_desc: "이탈리아는 러시아 선전의 주요 표적이 되었습니다. 이는 허위 정보, 민족주의적 수사, 반세계화 및 반자본주의의 상투적 문구, 그리고 친러시아 서사가 뒤섞인 것으로, \\"파토 쿠오티디아노\\" 같은 신문이나 \\"라 세테\\" 같은 TV 채널을 비롯한 여러 매체를 통해 퍼지고 있습니다."
 ITA_controlled_media: "RAI 나눠먹기"
 ITA_controlled_media_desc: "라디오텔레비시오네 이탈리아나(RAI)는 이탈리아의 공영 방송사입니다. 새로 선출된 정당들이 정부를 구성하는 모든 정당이 공정한 통제권을 나눠 갖도록 이 회사의 직책을 돌려 가며 차지하는 것은 흔한 관행입니다."
 ITA_controlled_media_2: "RAI 나눠먹기"
 ITA_controlled_media_2_desc: "라디오텔레비시오네 이탈리아나(RAI)는 이탈리아의 공영 방송사입니다. 새로 선출된 정당들이 정부를 구성하는 모든 정당이 공정한 통제권을 나눠 갖도록 이 회사의 직책을 돌려 가며 차지하는 것은 흔한 관행입니다."
 ITA_party_approved_media_n: "당 승인 언론"
 ITA_party_approved_media_n_desc: "언론은 우리의 새로운 언론인 집단이 관리할 것이다."
 ITA_legacy_of_fascism: "MSI의 유산"
 ITA_legacy_of_fascism_desc: "1943년 나라를 갈라놓은 내전과 파시스트가 장악한 북부 영토에서 무솔리니에 맞서 싸운 저항 운동에도 불구하고, 뉘른베르크 재판과 같은 재판이 열린 적이 없었기에 이탈리아는 파시스트 과거와 끝내 화해하지 못했습니다. 사회 평화라는 명목 아래 승자들은 인구 상당수의 범죄와 파시스트 동조를 잊기를 택했습니다. 이로 인해 \\"이탈리아 사회운동(Movimento Sociale Italiano)\\", 즉 MSI와 같은 거의 공공연한 파시스트 정당이 자유롭게 정치에 참여하게 되었습니다. MSI가 해산된 지금도 인구 상당수는 여전히 파시스트의 수사, 과거의 영광에 대한 약속, 강력한 지도자에 쉽게 끌립니다."
 ITA_radio_radicale: "라디오 라디칼레"
 ITA_radio_radicale_desc: "라디오 라디칼레는 급진당의 라디오 방송으로, 수년에 걸쳐 이탈리아 의회의 공식 라디오 방송사가 되어 정치가 국민과 소통을 유지하도록 돕고 있습니다."
 ITA_happy_degrowth_decision: "행복한 탈성장"
 ITA_happy_degrowth_decision_desc: "우리의 새로운 경제 기조는 우리가 더 나은 삶을 살고 지구가 더 오래 존속하도록 도울 것이다."
 ITA_happy_degrowth_decision_repeal: "행복한 탈성장 중단"
 ITA_judicial_system: "비효율적인 사법 체계"
 ITA_judicial_system_desc: "우리의 사법 체계는 느리고 번거로워 국가, 시민, 기업 모두에게 막대한 시간과 자원의 낭비를 초래하며, 조직범죄와의 싸움도 더 길고 비용이 많이 들게 만듭니다."
 ITA_unsustainable_pension_system_1: "고비용 연금 제도"
 ITA_unsustainable_pension_system_2: "지속 불가능한 연금 제도"
 ITA_unsustainable_pension_system_3: "쿼터 100"
 ITA_unsustainable_pension_system_4: "신생아 연금"
 ITA_unsustainable_pension_system_1_desc: "최근의 개혁은 연금 제도의 장기적 지속 가능성을 다소 개선했지만, 여전히 더 많은 노력이 필요합니다."
 ITA_unsustainable_pension_system_2_desc: "우리의 연금 제도는 근무 기간이 매우 짧은 사람들에게 수십 년간 매우 후한 연금을 지급해 온 데다 인구마저 감소하고 있어 세계에서 가장 지속 불가능한 제도 중 하나입니다."
 ITA_unsustainable_pension_system_3_desc: "최근의 개혁은 고령화되는 인구에게 계속 연금을 지급하기 위해 투입해야 하는 세금의 양을 크게 늘렸습니다. 다행히도 적어도 부정적인 여파가 먼 미래에 있는 동안은 매우 인기 있는 것으로 나타났습니다."
 ITA_unsustainable_pension_system_4_desc: "최근의 개혁은 고령화되는 인구에게 계속 연금을 지급하기 위해 투입해야 하는 세금의 양을 크게 늘렸습니다. 다행히도 적어도 부정적인 여파가 먼 미래에 있는 동안은 매우 인기 있는 것으로 나타났습니다."
 ITA_nuclear_power_banned: "원자력 금지"
 ITA_nuclear_power_banned_desc: "탄소 배출이 없고 현존하는 가장 안전한 에너지원임에도 우리는 여전히 원자력을 신뢰하지 않습니다. 원자로가 매년 내놓는 몇 세제곱미터의 폐기물을 처리하느니 수백만 톤의 석탄과 아라비아산 석유, 러시아산 가스를 태우는 편을 택하는 것입니다."
 ITA_ageing_population: "고령화 인구"
 ITA_ageing_population_desc: "이탈리아는 세계에서 평균 연령이 가장 높은 인구 중 하나를 가지고 있으며, 출산율은 매우 낮고 계속 하락하고 있습니다.\n\n 매월 월간 인구 변동치가 고령화 인구 변동치의 10분의 1만큼 바뀌며, 이는 이민 및 출산율 정책의 영향을 받습니다."
 ITA_unemployment_wave: "실업 물결"
 ITA_unemployment_wave_desc: "최근의 개혁으로 고용이 크게 감소했습니다. 우리 경제가 밀려난 노동력을 흡수하는 데에는 시간이 필요하며, 실업 보조금을 늘려야 할 것입니다."
 ITA_economic_catch_up_south: "남부의 경제 기적"
 ITA_economic_catch_up_south_desc: "이탈리아 남부의 저개발 지역은 값싼 노동력을 이용하려는 기업들이 전국과 전 세계에서 그곳으로 옮겨 오면서 빠른 산업화 과정을 겪고 있습니다."
 mafia_strength_below_10_TT: "§t마피아§! 가문들의 평균 세력이 0.1 미만이어야 합니다."
 mafia_strength_below_20_TT: "§t마피아§! 가문들의 평균 세력이 0.2 미만이어야 합니다."
