 UKR_crimean_bop_renegotiate_kyrgyzstan_repatriation_mission_desc: "§W[UKR.GetFlag] §Y[UKR.GetNameDef]§! has offered additional financial support to [KYR.GetFlag] §Y[KYR.GetName]§! to enable the return of §YCrimean Tatars§! to §Y[669.GetName]§!.§!\n\n§YDuration:§! 45 days\n§GSuccess:§! the country confirms its consent. §RFailure:§! negotiations may be repeated after a cooldown; funds are not returned."
 ukraine_crimea_balance.120.name: "Repatriation Request from [UKR.GetFlag] §Y[UKR.GetNameDef]§!"
 ukraine_crimea_balance.120.desc: "§W[UKR.GetFlag] §Y[UKR.GetNameDef]§! has formally requested that [KYR.GetFlag] §Y[KYR.GetNameDef]§! permit an organized return of §YCrimean Tatar§! families to §Y[669.GetName]§!. The diplomatic agreement is evaluated separately for each country.§!\n\n§YRequired [UKR.GetFlag] Ukrainian influence:§! §G7.5%§!\n§YRussian limit:§! [SOV.GetFlag] §Y[SOV.GetNameDef]§! cannot hold more than §Rthree times§! the [UKR.GetFlag] §Y[UKR.GetAdjective]§! share.\n\n§RRefusal§! allows [UKR.GetFlag] §Y[UKR.GetNameDef]§! to reopen talks through a separate, more costly decision."
