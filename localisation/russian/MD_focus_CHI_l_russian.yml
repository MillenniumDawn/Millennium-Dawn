 TIB_sar_development_modifier: "Tibetan SAR Development"
 TIB_sar_development_modifier_desc: "Tracks the cumulative economic development of the Tibetan Special Administrative Region, reflecting the growth of pilgrimage tourism, cross-border trade, and resource extraction revenue flowing into the SAR."
