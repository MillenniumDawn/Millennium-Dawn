 CRO_political.1.t: "The Hague Indicts Gotovina"
 CRO_political.1.d: "The ICTY has unsealed an indictment against General Ante Gotovina for crimes committed during Operation Storm. He has vanished before an arrest could be made. Veterans' associations are gathering in protest, and Brussels has made clear that cooperation with the tribunal is a condition for European integration."
 CRO_political.1.a: "We must cooperate with the tribunal"
 CRO_political.1.b: "Croatia does not extradite its heroes"
 CRO_political.2.t: "Gotovina Arrested in Tenerife"
 CRO_political.2.d: "Spanish police have arrested Ante Gotovina at a hotel restaurant in the Canary Islands after four years on the run. Intelligence shared by Zagreb helped track him down. Veterans are lighting candles on the main square, but the last obstacle on the European path has been removed."
 CRO_political.2.a: "A painful but necessary step"
 CRO_political.3.t: "Application for European Union Membership"
 CRO_political.3.d: "Prime Minister Ivica Račan has formally submitted Croatia's application for membership of the European Union in Athens. The government hopes to catch up with the accession wave already underway among its northern neighbours and put the wars of the previous decade firmly behind the country."
 CRO_political.3.a: "Our place is in Europe"
 CRO_political.4.t: "Accession Negotiations Open"
 CRO_political.4.d: "After the chief prosecutor confirmed Croatia's full cooperation with the tribunal, the European Union has opened accession negotiations. Screening of Croatian law against the acquis begins immediately, and foreign investors are taking notice."
 CRO_political.4.a: "The screening begins"
 CRO_political.5.t: "Invitation at the Bucharest Summit"
 CRO_political.5.d: "The NATO summit in Bucharest has extended a formal invitation to Croatia and Albania. Accession protocols are to be signed within the year. The invitation rewards a decade of defence reform and anchors Croatia in the Western alliance."
 CRO_political.5.a: "A seat at the table"
 CRO_political.6.t: "The Ina-MOL Affair"
 CRO_political.6.d: "Former Prime Minister Ivo Sanader has been arrested in Austria after fleeing prosecution. Investigators allege he took a bribe from the Hungarian oil company MOL to concede management rights over Ina, the national oil firm. The case reaches into the highest levels of the ruling party."
 CRO_political.6.a: "No one is above the law"
 CRO_political.6.b: "Contain the damage"
 CRO_political.7.t: "Gotovina Acquitted on Appeal"
 CRO_political.7.d: "The ICTY appeals chamber has overturned the convictions of generals Ante Gotovina and Mladen Markač and ordered their immediate release. Zagreb's main square has filled with crowds welcoming them home. In Belgrade and Banja Luka the ruling has been met with fury."
 CRO_political.7.a: "The generals come home"
 CRO_political.8.t: "Welcome to the European Union"
 CRO_political.8.d: "At midnight Croatia became the 28th member state of the European Union, closing a twelve-year accession process that outlasted six governments. Customs posts on the Slovenian and Hungarian borders are being dismantled."
 CRO_political.8.a: "A European future"
 CRO_political.9.t: "Schengen and the Euro"
 CRO_political.9.d: "Croatia has adopted the euro and joined the Schengen area on the same day, the first member state to complete both steps at once. Border controls with the rest of the bloc are gone, and the kuna passes into history. The tourism industry expects a record season."
 CRO_political.9.a: "Fully integrated at last"
 CRO_political.10.t: "Herzeg-Bosnia Declares Independence"
 CRO_political.10.d: "The Croat cantons of Herzegovina have proclaimed a self-governing Herzeg-Bosnia and cut their ties to Sarajevo. Zagreb must decide how far to go in backing the breakaway."
 CRO_political.10.a: "Recognize Herzeg-Bosnia"
 CRO_political.10.b: "Send quiet support"
 CRO_political.10.c: "Disown the venture"
