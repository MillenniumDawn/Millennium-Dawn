mercosur.02.t: "MERCOSUR準加盟招待"
mercosur.02.d: "[FROM.GetName]が、MERCOSURに準加盟国として加わる提案を持ちかけてきた。正式加盟を急がせるものではないが、南米ブロックの内側に一歩踏み込む決断ではある。これを受け入れるということは、我々の将来が少なくとも部分的には地域統合の流れと結びつくことを意味する。"
mercosur.02.a: "準加盟を受諾"
mercosur.02.b: "今は見送り"

mercosur.03.t: "準加盟受諾"
mercosur.03.d: "[FROM.GetName]は我々の招待を受け入れ、MERCOSURに準加盟国として加わることに同意した。制度上は控えめな一歩に見えても、その政治的意味は小さくない。新たな首都が、完全な距離よりもブロックへの接近を選んだのだ。"
mercosur.03.a: "素晴らしい"

mercosur.04.t: "準加盟拒否"
mercosur.04.d: "[FROM.GetName]は我々の提案を、少なくとも今は退けた。相手政府は結び付きより距離を選び、地域統合への関心があったとしても、それは慎重さを押し切るほど強くはなかったようだ。扉が閉ざされたわけではないが、再び開かせるには時間がいる。"
mercosur.04.a: "残念だ"

mercosur.05.t: "正式加盟交渉開始"
mercosur.05.d: "[CHL.GetName]との正式加盟交渉が始まった。これが実を結べば、MERCOSURは大陸的影響力を語るだけでなく、実際に一国を自らの制度の内側へ引き入れたことになる。"
mercosur.05.a: "進めよう"

mercosur.06.t: "正式加盟招待"
mercosur.06.d: "[FROM.GetName]が、MERCOSURへの正式加盟をこの段階で決着させようと提案してきた。我々はそのまま加わることもできるし、最終的な一歩の前に、より大きな支援と準備を含む枠組みを求めることもできる。あるいは、まだ時期ではないと判断することも可能だ。いずれにせよ、この選択は我々がどこまでブロックと運命を重ねるつもりなのかを示すことになる。"
mercosur.06.a: "即時の正式加盟を受け入れる"
mercosur.06.b: "投資支援を求めて受け入れる"
mercosur.06.c: "準加盟のままにとどまる"

mercosur.07.t: "加盟パッケージ要求"
mercosur.07.d: "[FROM.GetName]は我々の正式加盟を原則として認めたが、その前に投資、制度調整、政治的な安心材料を含む、より大きな受け入れ準備を望んでいる。加盟はこれから段階的に進められ、その進め方そのものが、今後のブロックと相手国との関係の空気を決めることになるだろう。"
mercosur.07.a: "作業開始"

mercosur.08.t: "正式加盟拒否"
mercosur.08.d: "[FROM.GetName]は今のところ正式加盟を辞退した。慎重さゆえか、国内事情ゆえか、あるいはまだ決断を下す覚悟が整っていないのか、いずれにせよ相手は、MERCOSURを自国の恒久的な政治地平に加える準備ができていない。"
mercosur.08.a: "また後で見直そう"

mercosur.09.t: "準加盟協議開始"
mercosur.09.d: "[PRU.GetName]をMERCOSUR準加盟へ迎え入れるための外交協議を開始した。控えめに見える提案ではあるが、その実、南米連帯という言葉が相手国の首都でなお重みを持つのかを試す一手でもある。"
mercosur.09.a: "進めよう"

