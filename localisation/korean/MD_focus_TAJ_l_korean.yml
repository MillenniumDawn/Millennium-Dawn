l_korean:
 tajikistan_focus: "타지키스탄 국가 중점 트리"
 TAJ_rahmons_rotting_fruit: "라흐모노프의 썩은 열매"
 TAJ_rahmons_rotting_fruit_desc: "에모말리 라흐모노프는 1994년부터 타지키스탄 정치의 정점에 있었으며 이후 줄곧 나라를 통치해 왔습니다. 90년대 초에 벌어진 내전은 많은 타지크인의 기억에 여전히 남아 있고, 나라에는 부패와 뇌물이 만연하며, 불안정한 아프가니스탄 내전은 정부 깊숙이 공포를 불러일으키고 있습니다. 이러한 위험한 사태를 해결하는 것은 우리 행정부와 정책에 달려 있습니다."
 TAJ_his_excellency: "각하"
 TAJ_his_excellency_desc: "'각하'는 그의 지도력이 지닌 위엄과 권위를 전하는 공식 존칭입니다. 에모말리 라흐모노프는 스스로를 국가의 심장이라 여기며, 이러한 정체성을 강화하려는 끝없는 노력에 빠져들고 있습니다."
 TAJ_leader_of_nation: "국가의 영도자"
 TAJ_leader_of_nation_desc: "타지키스탄 국민 여러분, 안녕하십니까. 흔들림 없는 영도자 에모말리 라흐모노프께서는 (기침... 흠) 위대한 우리 조국의 바로 그 권위와 단결을 구현하십니다. (군화 발소리) 그분은 타지크 민족의 척추이시며, 우리의 미래가 서 있는 확고한 기둥이십니다. 그분의 인도 아래 타지키스탄은 더 밝은 내일을 향해 나아갑니다. (병력이 몰려와 굳건히 자리를 잡는다) 그분의 통치가 천 년 동안 이어지기를, 그리고 그분의 지도력이 우리 앞길을 비추지 못하기를 바랍니다. 영도자를 타도하라! ('방송은 배경에 군가가 흐르는 가운데 계속된다.')"
 TAJ_security_troubles: "국가 보안 강화"
 TAJ_security_troubles_desc: "우리 요원들은 국가의 모든 영역에 침투해 있습니다. 어느 방향으로도 우리가 침해당할 수 없음을 알기에 경계를 늦추지 않습니다. 적들이 혼란을 일으킬 준비를 하고 숨어 있는 만큼, 우리는 색깔 혁명 시도에 대비해야 합니다."
 TAJ_rejuvinate_the_opposition: "야권 쇄신"
 TAJ_rejuvinate_the_opposition_desc: "라흐몬과 그 측근들을 몰아낼 때가 왔습니다. 타지키스탄에서 더 이상 부패와 정실주의가 지배하지 않을 것이며, 대신 법과 질서가 자리 잡을 것입니다."
 TAJ_good_thoughts_good_words_good_deeds: "선한 생각, 선한 말, 선한 행동"
 TAJ_good_thoughts_good_words_good_deeds_desc: "1990년대 내전에서 싸웠던 세력 중 하나인 타지키스탄 민주당은 범이란주의와 민족주의 가치를 옹호하며, 타지키스탄을 지역 정치와 권력의 정점에 올려놓겠다고 맹세합니다."
 TAJ_tajik_silicon_valley: "타지크 실리콘 밸리"
 TAJ_tajik_silicon_valley_desc: "혁신과 현대화를 통해 새로운 기술 중심지를 세울 수 있을 것입니다. 이곳은 타지키스탄의 실리콘 밸리라 할 수 있으며, 우리의 희망과 염원이 이어진다면 언젠가 미국의 것을 능가할 수도 있습니다."
 TAJ_exploit_orionbank: "오리엔방크 활용"
 TAJ_exploit_orionbank_desc: "에모말리 시대에서 가장 부패한 기관 중 하나인 오리엔방크는 오늘날에도 남아 있습니다. 은행 경영자가 누구든 상관없이 그 부를 우리의 이익을 위해 활용할 수 있을 것입니다."
 TAJ_restrict_flights_to_russia: "러시아행 항공편 제한"
 TAJ_restrict_flights_to_russia_desc: "§Y'...그래서 어디 가시려고요?'§!\n\n인구를 보존하고 강한 노동력을 계속 키워 나가기 위해 타지키스탄에서 러시아로 가는 모든 항공편을 즉시 중단해야 합니다."
 TAJ_integration_of_the_agrarian_party: "농민당 통합"
 TAJ_integration_of_the_agrarian_party_desc: "농민당은 농민 계층 사이에서 꽤 인기가 있으며, 최근 몇 년간 주변부로 밀려났지만 그 대표자들을 우리 곁에 두면 이들의 지지를 우리 정부로 더 쉽게 결집시킬 수 있을 것입니다."
 TAJ_redetermine_dress_code: "복장 규정 재정립"
 TAJ_redetermine_dress_code_desc: "최근 몇 년간 복장 규정이 점점 느슨해져 타지크 사회에 이슬람식 복장이 더 널리 퍼지게 되었습니다. 그러나 이를 바꾸어 이란계 복장을 더 장려할 수 있습니다."
 TAJ_revise_religious_laws: "종교법 개정"
 TAJ_revise_religious_laws_desc: "한동안 종교는 우리 헌법에서 제약 없는 부분이었습니다. 무엇이 허용되는지에 대한 규제를 두지 않는다면, 우리는 곧 살라피주의와 그 파괴적 이념의 손아귀에 빠질 수 있습니다."
 TAJ_secure_badakhshani_support: "바다흐샨 지지 확보"
 TAJ_secure_badakhshani_support_desc: "바다흐샨 주민들은 특히 라흐모노프 시대라는 참사 이후 우리 국가에 크게 만족하지 못하고 있습니다. 이제 그들의 지지를 다시 확보할 때입니다."
 TAJ_regional_militias: "지역 민병대 배치"
 TAJ_regional_militias_desc: "안정적이고 믿을 만한 치안 병력이 없다면 우리는 질서를 유지할 수 없습니다. 지역 민병대를 창설하면 농촌 지역에서 정부의 지나친 개입을 막으면서도 그들에 대한 통제력은 계속 보장할 수 있습니다."
 TAJ_heirs_of_the_samanids: "사만 왕조의 후예"
 TAJ_heirs_of_the_samanids_desc: "사만 왕조는 한때 중앙아시아의 전설적인 제국이었습니다. 이제 그 유산을 완성할 때가 왔습니다. 어떤 인위적인 소국도 타지크의 패권을 가로막아서는 안 됩니다!"
 TAJ_taj_pact: "TAJ 조약"
 TAJ_taj_pact_desc: "§Y'질서, 안보, 번영'§!\n\n페르시아어로 왕관을 뜻하는 단어에서 이름을 딴 TAJ 조약은 중앙아시아와 중동 모두에서 안정되고 안전한 지역을 보장할 것입니다."
 TAJ_summit_in_islamabad: "이슬라마바드 정상회담"
 TAJ_summit_in_islamabad_desc: "파키스탄은 이 행성의 미래에서 주요 행위자로 부상하고 있습니다. 머지않아 그들에게 초청장을 보내야 할 것입니다."
 TAJ_reach_out_to_uzbekistan: "우즈베키스탄에 손을 내밀다"
 TAJ_reach_out_to_uzbekistan_desc: "우즈베크인들은 수십 년째 우리와 국경을 맞대고 있습니다. 진정한 평화와 안정을 이루려면 그들과 친구가 되어야 합니다."
 TAJ_iranic_confederation: "이란계 연합 추구"
 TAJ_iranic_confederation_desc: "§Y'하나의 땅, 하나의 민족, 하나의 운명'§!\n\n세계 속에서 초강대국으로서의 입지를 진정으로 굳히려면 이란계 연합을 추구해야 합니다. 이란 문화권을 통합하는 것만이 유일한 길입니다."
 TAJ_summit_in_tehran: "테헤란 정상회담"
 TAJ_summit_in_tehran_desc: "이란의 수도 테헤란은 새 이란계 연합의 핵심 장소가 될 것입니다. 그곳에서 회담을 열어 시간을 두고 우리 국가들을 통합할 방안을 논의할 수 있습니다."
 TAJ_begin_phase_one: "1단계 개시"
 TAJ_begin_phase_one_desc: "1단계는 첫 번째이자 틀림없이 가장 중요한 단계로, 이란계 민족이 현재 거주하는 지역 전반에 범이란주의 사상을 퍼뜨릴 수 있게 해 줄 것입니다."
 TAJ_support_anti_clerical_movements_PER: "이란 내 반성직자 운동 지원"
 TAJ_support_anti_clerical_movements_PER_desc: "이란의 성직자들은 통일된 이란 민족을 이루려는 우리의 염원에 큰 걸림돌입니다. 그들의 낡은 이념과 권력욕은 우리가 그런 일을 이루도록 결코 허락하지 않을 것이며, 그들은 제거되어야 합니다."
 TAJ_AFG_bring_pan_iranists: "아프가니스탄 범이란주의 운동 지원"
 TAJ_AFG_bring_pan_iranists_desc: "아프가니스탄은 역사상 범이란주의 운동이 많지 않았습니다. 그러나 우리는 이를 바꿀 수 있습니다. 특정 단체들에 자금을 지원하면 이들의 견해와 입장을 바꾸게 하여, 어쩌면 전체가 범이란주의 운동으로 탈바꿈하도록 만들 수 있습니다."
 TAJ_reinforce_the_iranian_world: "이란계 세계 강화"
 TAJ_reinforce_the_iranian_world_desc: "이란계 국가들은 하나로 뭉쳐 우정과 안정의 중요성을 이해해야 합니다. 서로 곁에 서야만 살아남을 수 있으며, 다른 길은 없습니다."
 TAJ_greater_iranian_world: "대이란계 세계"
 TAJ_greater_iranian_world_desc: "대이란계 국가를 세울 때가 왔습니다. 통합을 통해 우리는 스스로를 세계의 진정한 강국으로 선언할 수 있을 것입니다."
 TAJ_maintianing_tajik_independence: "타지크 독립 유지"
 TAJ_maintianing_tajik_independence_desc: "무엇보다 중요한 것은 우리의 주권입니다. 우리 스스로의 자치를 보장하지 못한다면, 국민에게 무슨 쓸모가 있겠습니까?"
 TAJ_target_russian_lobby: "러시아 로비 겨냥"
 TAJ_target_russian_lobby_desc: "러시아인들이 타지키스탄에 또다시 발판을 마련하게 둘 수 없습니다. 특히 제국과 그 뒤를 이은 소련이 우리나라를 억압적으로 지배했던 이후라면 더욱 그렇습니다."
 TAJ_legacy_of_uto: "UTO의 유산"
 TAJ_legacy_of_uto_desc: "저항 운동은 결코 잊혀서는 안 되며, 우리가 바친 위대한 희생은 역사 속에 영원히 기록되어야 합니다!"
 TAJ_dislodge_oligarchs: "과두 세력 축출"
 TAJ_dislodge_oligarchs_desc: "§G'꺼져라!'§!\n\n러시아나 중앙아시아의 다른 나라들처럼 되지 않도록, 정부와 국가에서 모든 종류의 과두 세력의 영향력을 제거해야 합니다."
 TAJ_grants_to_new_bussinesses: "신생 기업 보조금"
 TAJ_grants_to_new_bussinesses_desc: "새로운 기업이 없다면 안정된 경제를 보장할 수 없습니다. 따라서 일부 국민이 자리를 잡을 수 있도록 단기적인 희생을 감수할 것입니다."
 TAJ_create_revolutionary_command_corps: "혁명 지휘 군단 창설"
 TAJ_create_revolutionary_command_corps_desc: "우리의 혁명을 필요한 모든 수단을 동원해 지킬 의지가 있는 군대를 만들어야 하며, 타협은 있을 수 없습니다."
 TAJ_young_republic: "젊은 공화국"
 TAJ_young_republic_desc: "투표함의 힘을 통해서만 우리는 앞으로 오랜 세대에 걸쳐 국민의 안전을 보장할 수 있습니다. 더 나은 내일을 위해 민주화할 것입니다."
 TAJ_liberty_through_strength: "힘을 통한 자유"
 TAJ_liberty_through_strength_desc: "국가의 운명을 동전 던지기 같은 '선거'에 맡길 수는 없습니다. 대신 힘과 독립, 주권을 통해 국민의 자유를 보장해야 합니다."
 TAJ_reinforce_islamic_identity: "이슬람 정체성 강화"
 TAJ_reinforce_islamic_identity_desc: "이슬람은 우리 국가를 대표하는 유일한 종교이며 앞으로도 그러할 것입니다. 외래 사상이 국민의 신앙에 영향을 미치게 할 수 없으며, 우리의 종교가 외부의 침입으로부터 우리를 지켜 줄 것입니다."
 TAJ_tajik_zoroastrian_symbol: "상징적 종교로서의 조로아스터교"
 TAJ_tajik_zoroastrian_symbol_desc: "조로아스터교는 전체적으로 대부분 과거의 종교가 되었지만, 그 배경에 담긴 사상이 사라지게 둘 수는 없습니다. 선한 말, 선한 행동, 선한 생각을 통해 우리 국가는 번영할 것입니다."
 TAJ_secularize_tajik_society: "타지크 사회 세속화"
 TAJ_secularize_tajik_society_desc: "하나의 종교 아래 결집하는 것은 어리석은 생각이며, 사회 내에 어떤 형태로든 분열을 낳을 수밖에 없습니다. 세속적 모델을 채택해야만 국가의 미래를 보장할 수 있으며, 그보다 못한 것으로는 안 됩니다."
 TAJ_reinforce_claims_on_pamir: "파미르 영유권 강화"
 TAJ_reinforce_claims_on_pamir_desc: "파미르에 대한 우리의 통제권이 나락으로 떨어지게 둘 수 없습니다. 이 지역의 진정한 주인이 누구인지 세계에 알려야 합니다. 중국인들은 고르노바다흐샨에 발판을 마련하지 못할 것이고, 그럴 수도 없으며, 그래서도 안 됩니다."
 TAJ_ban_russian_language: "러시아어 금지"
 TAJ_ban_russian_language_desc: "§Y'우크라이나어는요?'§!\n\n러시아어를 쓰는 제국주의자들이 우리 국가에 어떤 문화적 영향력도 갖지 못하게 할 것이며, 페르시아어가 위대하고 명예로운 타지크 민족의 유일하고 진정한 언어로 자리 잡을 것입니다."
 TAJ_revolutionary_nationalism: "혁명적 민족주의"
 TAJ_revolutionary_nationalism_desc: "우리 국가의 위대한 혁명을 중심으로 애국심을 빚어낼 것입니다. 맹목적인 이념이 국민을 이끌게 둘 수 없으며, 우리에게는 결집할 상징이 필요합니다."
 TAJ_the_farsi_language: "페르시아어 진작"
 TAJ_the_farsi_language_desc: "페르시아어는 수천 년 동안 우리나라에서 최고의 자리를 지켜 왔습니다. 국민이 자신의 정체성을 잊지 않도록 이 언어의 중요성을 강조하고 사회에서의 역할을 진작할 것입니다."
 TAJ_power_of_prayer: "기도의 힘"
 TAJ_power_of_prayer_desc: "오직 기도를 통해서만 우리 국가는 세상에서 위안을 찾을 것입니다. 이슬람이 없다면 타지키스탄은 아무것도 아니며, 아무것도 될 수 없고, 아무것도 아니었을 것입니다."
 TAJ_cultural_reset: "문화 재설정"
 TAJ_cultural_reset_desc: "우리 사회는 타지크 국가에 대한 애국심과 외래 사상에 지나치게 의존하고 있습니다. 이를 끝낼 때가 왔으며, 대신 이슬람적 이상을 강조할 것입니다."
 TAJ_nazarzodas_ascension: "나자르조다의 즉위"
 TAJ_nazarzodas_ascension_desc: "나라를 번영으로 이끌 수 있는 사람은 나자르조다 장군뿐입니다. 그가 없으면 당은 와해될 것입니다. 이제 그와 지지자들이 마땅히 자신들의 것을 차지할 때입니다."
 TAJ_hoji_halim: "호지 할림"
 TAJ_hoji_halim_desc: "'호지 할림'이라 불리는 나자르조다는 그의 모든 장점이 사소한 단점을 분명히 능가하기에, 나라의 영도자로서의 입지를 영원히 굳힐 것입니다."
 TAJ_army_of_loyalists: "충성파의 군대"
 TAJ_army_of_loyalists_desc: "§Y'준비되었습니다, 각하'§!\n\n충성파 군대가 두샨베의 거리를 가득 메우고 호지 할림과 그의 정부에 대한 지지를 보여 줄 것입니다. 그의 군대와 마찬가지로, 이 사람들은 그와 당을 위해 기꺼이 목숨을 바칠 것입니다."
 TAJ_the_partys_legacy: "당의 유산"
 TAJ_the_partys_legacy_desc: "당 전체가 한 개인에 의해 밀려나서는 안 됩니다. 개인숭배가 만들어지도록 허용한다면, 우리 대표성의 다원성이 위태로워집니다."
 TAJ_seeking_treatment_for_nuri: "누리의 치료법 모색"
 TAJ_seeking_treatment_for_nuri_desc: "사랑하는 지도자 누리께서는 병마에 굴복할 중대한 위험에 처해 있습니다. 가능한 한 오랫동안 그의 생명과 통치를 연장할 수 있도록 가능한 치료 방법을 찾아야 합니다."
 TAJ_our_brotherhood: "우리의 형제단"
 TAJ_our_brotherhood_desc: "이슬람 형제단, 우리의 형제단을 잊어서는 안 됩니다. 이제 우리의 자원을 사용하여 형제들이 자국민을 위한 정의와 번영을 이루도록 도와야 합니다."
 TAJ_mending_judiciary: "사법부 복원"
 TAJ_mending_judiciary_desc: "라흐모노프와 그 측근들의 통치가 국가의 모든 법치를 파괴하면서, 우리나라 사법 제도의 평판은 수십 년에 걸쳐 크게 실추되었습니다. 이를 바로잡을 때입니다."
 TAJ_hold_public_trials: "공개 재판 개최"
 TAJ_hold_public_trials_desc: "공개 처벌만이 우리 국가를 타락시킨 자들에게 합당한 처벌이며, 국민은 이를 직접 눈으로 목격할 수 있어야 합니다!"
 TAJ_reshuffle_military_cabinet: "군 수뇌부 개편"
 TAJ_reshuffle_military_cabinet_desc: "군 수뇌부에는 분명, 거의 확실히 멍청이들이 있습니다. 상황을 조금 흔들어 이들이 더 충성하도록 만들면서 직접 확인해야 합니다."
 TAJ_secure_the_supreme_assembly: "최고회의 확보"
 TAJ_secure_the_supreme_assembly_desc: "최고회의의 지지가 없다면 우리가 간절히 바라는 정통성을 얻을 수 없습니다. 의원들 사이에 강력한 지지 기반을 구축함으로써 목표에 더 가까워질 수 있습니다."
 TAJ_parliamentary_model: "의회제 모델 추종"
 TAJ_parliamentary_model_desc: "대표성은 최선의 통치 형태이며, 이것이 없다면 우리는 찬탈자처럼 보일 것입니다. 모두를 위해 타지크 사회를 추가로 민주화할 때입니다."
 TAJ_placating_the_ulema: "울라마 지원"
 TAJ_placating_the_ulema_desc: "울라마는 우리 정통성의 원천입니다. 이들에게 비난받는다면 우리는 분명 신속한 종말을 맞을 것입니다. 이들이 원하는 것을 줌으로써 지지를 얻을 수 있습니다."
 TAJ_gulfs_bankroll: "걸프의 자금줄"
 TAJ_gulfs_bankroll_desc: "§G'돈, 돈, 돈'§!\n\n걸프 국가들, 특히 [SAU.GetName]의 문턱에는 막대한 부가 쌓여 있습니다. 그들이 우리에게 투자하고 자금을 대도록 하여, 그들이 낭비하고 있는 자본의 일부를 얻어 낼 것입니다."
 TAJ_islamic_sceince: "이슬람 과학"
 TAJ_islamic_sceince_desc: "이슬람과 과학이 양립할 수 없다고 말하는 이들이 있지만, 이보다 더 틀릴 수는 없습니다. 역사가 무언가를 증명했다면, 그것은 유럽과 서방 여러 나라의 대학과 교육 기관이 기반으로 삼는 과학과 수학의 토대를 이슬람 학자들이 만들었다는 사실입니다."
 TAJ_pass_out_grants: "보조금 및 장학금 지급"
 TAJ_pass_out_grants_desc: "국민이 교육받기를 원한다면, 재정적 부담을 덜어 줄 수 있는 어떤 형태로든 지원을 제공해야 합니다."
 TAJ_entrance_of_luxury: "사치의 도입"
 TAJ_entrance_of_luxury_desc: "우리는 검소해야 하지만, 약간의 사치는 해가 되지 않습니다. 특히 우리가 낙후된 타지키스탄의 이미지를 바로잡으려 하는 만큼 더욱 그렇습니다."
 TAJ_tests_of_loyalty: "충성 시험"
 TAJ_tests_of_loyalty_desc: "정부 구성원들의 충성심을 확인하기 위해 비밀리에 시험과 심사를 진행해야 합니다. 배신자가 우리 대열에서 올라오게 둘 수 없습니다."
 TAJ_a_new_era: "새로운 시대"
 TAJ_a_new_era_desc: "부패와 정실주의가 없는 새로운 시대가 우리에게 다가왔습니다. 우리는 세계와 함께 새로운 타지키스탄을 건설할 것이며, 그곳에서는 어디에서 온 누구든 환영받을 것입니다!"
 TAJ_seeking_foreign_aid: "해외 원조 모색"
 TAJ_seeking_foreign_aid_desc: "우리는 타지키스탄을 혼자 재건할 수 없으며, 세계에 도움을 호소해야 합니다. 분명 어딘가에서 누군가는 우리의 호소를 듣고 도와줄 것입니다."
 TAJ_distance_from_CIS: "독립국가연합과 거리 유지"
 TAJ_distance_from_CIS_desc: "우리는 저 낙후된 독립국가연합 국가들과 어울릴 수 없습니다. 우리 스스로를 그들과 구별하고, 우리와 그들 사이에 분명한 선을 그어야 합니다."
 TAJ_purging_rahmons_cronies: "라흐몬의 측근 숙청"
 TAJ_purging_rahmons_cronies_desc: "구 정부의 요원들이 현 행정부에서 여전히 활동하고 있으며, 문제를 피하려면 이들을 신속히 처리해야 합니다."
 TAJ_reach_out_to_gcc: "걸프 협력 회의에 손을 내밀다"
 TAJ_reach_out_to_gcc_desc: "우리 국가의 미래와 걸프 협력 회의 국가들의 미래는 하나이며, 번영하려면 이들과 강력한 유대를 구축해야 합니다."
 TAJ_ushering_in_the_sharia: "샤리아 도입"
 TAJ_ushering_in_the_sharia_desc: "인위적인 규칙이 아니라 순수함이 우리 국가를 다스릴 때가 왔습니다. 쿠란을 통치의 기초로 삼을 것이며, 국민은 진정한 정의를 보게 될 것입니다."
 TAJ_economic_islamization: "경제의 이슬람화"
 TAJ_economic_islamization_desc: "이슬람 경제는 유일하게 좋은 경제 모델입니다. 낮은 금리, 공정한 은행, 이보다 더 무엇을 바랄 수 있겠습니까?"
 TAJ_islamic_renaissance: "이슬람 르네상스"
 TAJ_islamic_renaissance_desc: "이슬람 세계의 중심인 이곳 타지키스탄에서 이슬람 르네상스를 선언할 때가 왔습니다. 우즈베크인들이 자기 집 안에서 이 르네상스의 충격을 가장 먼저 느끼게 될 것입니다."
 TAJ_najot: "나조트 신문"
 TAJ_najot_desc: "우리 자체 신문은 타지크 국민이 타지크와 세계의 모든 소식을 접하도록 확실히 도울 것입니다. 나조트는 모든 가정이 사랑하게 될 이름이 될 것입니다."
 TAJ_manage_badakhshan_front: "바다흐샨 전선 관리"
 TAJ_manage_badakhshan_front_desc: "바다흐샨 지역에서 상당한 문제가 계속 발생해 왔으며, 이제 이에 대해 조치를 취할 때입니다."
 TAJ_supporting_shiites_in_badakhshan: "바다흐샨의 시아파 지원"
 TAJ_supporting_shiites_in_badakhshan_desc: "바다흐샨에 거주하는 많은 이들이 시아파이며, 따라서 이들을 달랠 새로운 방법을 찾아야 합니다."
 TAJ_alignment_with_tehran: "테헤란과의 제휴"
 TAJ_alignment_with_tehran_desc: "이란 정부는 세계에서 유일한 또 다른 진정한 이슬람 정부이며, 저항의 축에 가입 신청서를 제출함으로써 그들의 호감을 얻어야 합니다."
 TAJ_centralization: "중앙집권화 중점"
 TAJ_centralization_desc: "중앙집권화 없이는 우리 국가에 대한 진정한 통제권을 가질 수 없습니다. 전국의 안보를 유지하려면 국가를 중앙집권화해야 합니다."
 TAJ_axis_of_resistance: "저항의 축"
 TAJ_axis_of_resistance_desc: "저항의 축에 가입을 요청할 때가 왔습니다. 이란인들은 제국주의에 맞서 싸우는 타지크 형제들을 분명 따뜻이 맞이할 것입니다."
 TAJ_anti_afghan_rhetoric: "반아프간 수사"
 TAJ_anti_afghan_rhetoric_desc: "남쪽의 아프간인들은 이미 충분히 많은 문제를 일으켰으며, 이제 그들을 처리할 때가 왔습니다."
 TAJ_our_way_of_life: "우리의 생활 방식"
 TAJ_our_way_of_life_desc: "우리는 우리의 생활 방식을 포기해서는 안 되며, 오히려 이를 강화하여 타지크 사회에 굳건히 뿌리내리게 해야 합니다. 바다흐샨의 일부 반군이 그것을 앗아가게 둘 수 없습니다."
 TAJ_arrest_ring_leaders: "주동자 체포"
 TAJ_arrest_ring_leaders_desc: "시아파의 영향력을 차단해야 하며, 반대 세력의 핵심 주동자를 체포함으로써 이들을 조금 더 억제할 수 있을 것입니다."
 TAJ_limit_tehrans_influence: "테헤란의 영향력 제한"
 TAJ_limit_tehrans_influence_desc: "이란 정부는 너무 오랫동안 우리 정치에 간섭해 왔습니다. 이제 그들의 영향력에 맞서 싸우고 장악력을 느슨하게 만들 때입니다."
 TAJ_strict_isolationism: "엄격한 고립주의"
 TAJ_strict_isolationism_desc: "§R'모두 나를 내버려 둬!'§!\n\n우리는 이대로 계속 갈 수 없으며, 국민을 보호하기 위해 세계의 나머지 지역으로부터 스스로를 고립시켜야 합니다."
 TAJ_central_asian_security_association: "중앙아시아 안보 연합"
 TAJ_central_asian_security_association_desc: "지역은 서서히 무너져 가고 있으나, 지역 내 다른 국가들과 합의에 도달하여 이 모든 혼란 속에서 일종의 평화를 구축할 수 있습니다."
 TAJ_echoes_of_the_worker: "노동자의 메아리"
 TAJ_echoes_of_the_worker_desc: "노동 계급의 이상이 타지키스탄 전역에 다시 울려 퍼져야 합니다. 그들의 대의를 옹호함으로써 노동자에 대한 우리의 약속을 재확인하고 그들의 목소리가 우리의 미래를 이끌도록 할 것입니다."
 TAJ_russian_doll: "마트료시카"
 TAJ_russian_doll_desc: "소련 시대의 영향이 겹겹이 우리 통치 체제에 여전히 박혀 있습니다. 무엇을 보존하고 무엇을 버려야 할지 판단하기 위해 이 층들을 신중하게 풀어 나가야 합니다."
 TAJ_strength_out_party_relations: "당외 관계 강화"
 TAJ_strength_out_party_relations_desc: "입지를 굳히려면 타지키스탄에 대한 우리의 비전과 부합하는 외부 정치 집단과 더 강력한 유대를 구축하고 지역 현안에서 이들의 지지를 확보해야 합니다."
 TAJ_reinvite_diaspora: "디아스포라 재초청"
 TAJ_reinvite_diaspora_desc: "망명 중인 동포들은 아직 개발되지 않은 잠재력입니다. 이들을 다시 초청함으로써 그들의 지식과 기술을 활용해 국가 재건에 도움을 받을 수 있습니다. "
 TAJ_the_russogrid: "러시아 전력망"
 TAJ_the_russogrid_desc: "§Y'선생님, 저도 좀 얻을 수 있을까요?'§!\n\n러시아의 에너지망은 상당히 안정적이며, 정중히 사용을 요청한다면 타지키스탄에서도 안정적인 전력망을 확보할 수 있습니다."
 TAJ_promote_soviet_heritage: "소련 유산 진작"
 TAJ_promote_soviet_heritage_desc: "소련의 유산은 우리 정체성의 토대입니다. 이 유산을 기림으로써 국민 사이에 단결과 자긍심을 키우고 우리의 이념적 뿌리를 강화할 수 있습니다."
 TAJ_meeting_with_zugyanov: "주가노프와의 회담"
 TAJ_meeting_with_zugyanov_desc: "러시아 연방 공산당 지도자와의 회동을 통해, 앞으로 마주하게 될 난관을 헤쳐 나가는 데 귀중한 지원과 조언을 확보할 수 있습니다."
 TAJ_tajik_strongman: "타지크의 강력한 지도자"
 TAJ_tajik_strongman_desc: "격동의 시기에 타지키스탄을 이끌려면 흔들리지 않는 단 한 명의 지도자가 필요합니다. 이러한 접근은 안정과 단호한 통치를 보장할 것입니다."
 TAJ_reassert_tajik_independence: "타지크 독립 재확인"
 TAJ_reassert_tajik_independence_desc: "외세의 그늘에서 벗어나, 독립적이며 자주적인 국가라는 타지키스탄의 마땅한 위상을 되찾을 때입니다."
 TAJ_pivot_to_the_west: "서방으로의 전환"
 TAJ_pivot_to_the_west_desc: "서방 국가들과의 관계를 모색하면 경제 성장과 현대화를 위한 새로운 길이 열리고 동맹과 기회가 다변화될 수 있습니다."
 TAJ_treaty_with_nato: "나토와의 조약"
 TAJ_treaty_with_nato_desc: "나토와의 전략적 협정은 안보와 국제적 정통성을 가져올 수 있으나, 전통적인 동맹국들을 멀어지게 할 위험이 있습니다."
 TAJ_abandon_cspu: "소련 공산당 결별"
 TAJ_abandon_cspu_desc: "소련 공산당의 잔재와 관계를 끊는 것은 우리만의 독자적인 길을 개척하기 위해 필요한 단계일 수 있습니다."
 TAJ_integrate_the_socdems: "사회민주주의자 통합"
 TAJ_integrate_the_socdems_desc: "사회민주주의자들과의 협력은 폭넓은 연립을 만들어 타지키스탄의 미래를 위한 안정과 공동의 비전을 보장할 수 있습니다."
 TAJ_blast_to_past: "과거로의 회귀"
 TAJ_blast_to_past_desc: "소련 시절의 정책과 이상을 되짚어 보면 국가를 재건하는 과정에서 귀중한 교훈과 지침을 얻을 수 있습니다."
 TAJ_wellbeing_of_tajiks: "타지크인의 복지"
 TAJ_wellbeing_of_tajiks_desc: "국민의 복지는 무엇보다 우선되어야 합니다. 그들의 필요를 해결함으로써 번영하고 단결된 타지키스탄을 보장할 수 있습니다."
 TAJ_fsb_advisees: "FSB 자문단"
 TAJ_fsb_advisees_desc: "러시아 FSB의 고문을 받아들이면 우리 보안 기구를 강화할 수 있으나, 독립을 희생해야 할 수도 있습니다."
 TAJ_drive_out_the_chinese: "중국인 축출"
 TAJ_drive_out_the_chinese_desc: "타지키스탄의 주권과 자원을 지키기 위해 우리 지역에서 커지는 중국의 영향력을 억제해야 합니다."
 TAJ_total_nationalization: "전면 국유화"
 TAJ_total_nationalization_desc: "핵심 산업을 완전히 국유화하면 통제권이 국가의 손에 확고히 쥐어지고 자원의 공평한 분배가 보장됩니다."
 TAJ_invite_the_cis: "독립국가연합 초청"
 TAJ_invite_the_cis_desc: "독립국가연합과의 유대를 강화하면 지역 협력과 상호 성장을 촉진할 수 있습니다."
 TAJ_workers_of_the_world_unite: "만국의 노동자여, 단결하라!"
 TAJ_workers_of_the_world_unite_desc: "노동자들 사이의 국제적 연대 정신을 다시 일으키면 우리의 이념적 헌신이 강화되고 영향력이 확대될 것입니다."
 TAJ_the_secretary: "서기장"
 TAJ_the_secretary_desc: "유능하고 충성스러운 서기장은 모든 성공적인 공산당의 초석입니다. 이 직책에 적임자가 앉도록 해야 합니다."
 TAJ_puppet_the_unions: "노동조합 괴뢰화"
 TAJ_puppet_the_unions_desc: "노동조합을 통제함으로써 노동 계급이 우리 정책을 지지하도록 이끌고 반대 의견을 억누를 수 있습니다."
 TAJ_revert_the_economy: "경제 복원"
 TAJ_revert_the_economy_desc: "계획 경제로 돌아가면 타지키스탄을 재건하는 데 필요한 안정과 통제를 얻을 수 있습니다."
 TAJ_compromise_with_farmers: "농민과의 타협"
 TAJ_compromise_with_farmers_desc: "농업 부문의 우려를 해소함으로써 그들의 지지를 확보하고 국가의 식량 안보를 보장할 수 있습니다."
 TAJ_tighten_drug_crackdown: "마약 단속 강화"
 TAJ_tighten_drug_crackdown_desc: "마약 거래는 타지키스탄의 재앙입니다. 국민을 보호하고 질서를 유지하려면 더 엄격한 단속이 필요합니다."
 TAJ_agrarian_domination: "농업 우위"
 TAJ_agrarian_domination_desc: "농업 발전에 집중하면 경제에 강력한 기반이 마련되고 농촌 인구의 복지가 보장됩니다."
 TAJ_closer_ties_with_afghanistan: "아프가니스탄과의 긴밀한 유대"
 TAJ_closer_ties_with_afghanistan_desc: "아프가니스탄과의 관계를 강화하면 무역과 지역 안정을 위한 새로운 기회가 열릴 수 있습니다."
 TAJ_reconciliation: "화해"
 TAJ_reconciliation_desc: "탈레반과의 끔찍한 관계를 회복하는 것은 우리가 밟아야 할 중요한 단계일 수 있으며, 어렵더라도 필요한 일입니다."
 TAJ_eyes_in_the_back: "뒤통수에도 눈을"
 TAJ_eyes_in_the_back_desc: "혁명을 지키기 위해서는 배신에 대해 경계를 늦추지 않고 대열 내의 충성심을 확보해야 합니다."
 TAJ_reassert_tajik_indepndence: "타지크 독립 재확인"
 TAJ_reassert_tajik_indepndence_desc: "외세의 영향이 정부에 스며들게 둘 수 없습니다. 국가의 안보와 주권을 유지해야 합니다."
 TAJ_sympathizers_in_army: "군 내 동조자"
 TAJ_sympathizers_in_army_desc: "군 내에서 혁명의 대의에 공감하는 이들을 찾아내어 우리와 우리 병력 편에 서게 할 수 있습니다."
 TAJ_befriend_chiefs_of_staff: "참모진 포섭"
 TAJ_befriend_chiefs_of_staff_desc: "핵심 인물들과 친분을 쌓으면 군 수뇌부 일부를 우리 편으로 끌어들일 수 있습니다."
 TAJ_surround_palace: "궁전 포위"
 TAJ_surround_palace_desc: "§R'나와라, 거기 있는 거 다 안다!'§!\n\n비겁한 라흐몬은 궁전에 숨어 있으며, 이제 궁전을 포위하고 단번에 끝낼 때입니다!"
 TAJ_reclaiming_majlis: "마즐리스 탈환"
 TAJ_reclaiming_majlis_desc: "마즐리스에 대한 공격을 조직하여 장악해야 합니다. 이러한 승리는 라흐몬 정권에 헤아릴 수 없는 영향을 미칠 것입니다."
 TAJ_tajik_revolution: "타지크 혁명"
 TAJ_tajik_revolution_desc: "§R'독재자를 타도하라!'§!\n\n때가 왔습니다. 낡은 것을 걷어내고 타지키스탄에 새로운 질서를 가져올 때입니다."
 TAJ_situation_in_pamir: "파미르의 정세"
 TAJ_situation_in_pamir_desc: "§Y'전부 아니면 전무다!'§!\n\n파미르 지역은 우리와 키르기스인 모두가 이 지역과 그 자원의 통제권을 두고 다투고 있는 상당히 논쟁적인 곳입니다. 그러나 다른 조치를 취함으로써 역사의 흐름을 바꿀 수 있습니다."
 TAJ_negotiate_agreement: "합의 협상"
 TAJ_negotiate_agreement_desc: "우리는 파미르 지역이 필요한 것이 아니라 원하는 것일 뿐입니다. 우리의 필요와 욕구를 서로 저울질하여 이 모든 상황 속에서 진정 중요한 것이 무엇인지 판단해야 합니다. 평화가 분명 더 낫게 들립니다."
 TAJ_advance_troops: "병력 진격"
 TAJ_advance_troops_desc: "[KYR.GetAdjective] 따위는 알 게 뭡니까, 우리는 우리가 원하는 것을 얻을 것입니다. 그것이 충돌을 뜻한다면 그렇게 되라지요!"
 TAJ_silent_erosion: "조용한 침식"
 TAJ_silent_erosion_desc: "시간이 지나면서 우리 국가는 끝없는 부패 상태로 침식되었습니다. 이를 해결해야 합니다. 아니면 말고요."
 TAJ_change_in_stance: "입장 변화"
 TAJ_change_in_stance_desc: "중앙 정부와 국가 내에 부패가 퍼지는 것을 막기 위한 조치를 취할 때가 왔습니다. 이 골칫거리들을 뿌리 뽑고 더 나은 타지키스탄을 건설할 것입니다."
 TAJ_purification_of_authority: "권력 정화"
 TAJ_purification_of_authority_desc: "부패를 단속하려면 뿌리부터 공격해야 합니다. 개인의 이득을 위해 국가의 부를 약탈하는 자들을 숙청해야 합니다."
 TAJ_cleansing_the_badge: "배지 정화"
 TAJ_cleansing_the_badge_desc: "경찰은 우리 국민 사이에서 부패하고 무능한 조직으로 여겨지고 있습니다. 이들이 진정 국민을 위해, 국민에 의해 존재함을 증명할 때가 왔습니다."
 TAJ_rebirth_of_integrity: "청렴의 재탄생"
 TAJ_rebirth_of_integrity_desc: "타지키스탄의 청렴은 오래전에 죽었지만, 지금은 그런 일을 곱씹을 때가 아닙니다. 국민을 위해 더 투명하고 개방적인 국가를 만들 때입니다."
 TAJ_razing_the_old_guard: "구세대 해체"
 TAJ_razing_the_old_guard_desc: "소수의 고위 지도자 집단이 국가에서 일어나는 일을 좌지우지해서는 안 됩니다. 국민이 유능하다고 여기는 지도자들이 국가를 맡도록 할 때입니다."
 TAJ_burning_the_dark_bridge: "어둠의 다리를 불태우다"
 TAJ_burning_the_dark_bridge_desc: "암시장은 아주 오랫동안 우리 국가를 괴롭혀 왔습니다. 이제 어둠의 다리와 작별하고 깨끗하고 합법적인 새 다리를 놓을 때입니다."
 TAJ_crowns_for_tajiks: "왕관은 타지크인의 것"
 TAJ_crowns_for_tajiks_desc: "왕관은 타지크 국민이 쓰라고 있는 것이지, 그들을 해치려는 자들이 쓰라고 있는 것이 아닙니다. 정직, 안보, 정의를 통해 모든 타지크인이 왕이나 여왕처럼 대우받는 더 나은 타지키스탄을 만들 것입니다."
 TAJ_southern_problems: "남쪽의 문제"
 TAJ_southern_problems_desc: "§Y'어, 저 소리는 뭐지?'§!\n\n로켓이 사방으로 날아다니고 총성이 시시때때로 울려 퍼지는 아프가니스탄 정세는 이상적이지 않습니다. 이러한 악의가 타지키스탄을 지배하는 것은 분명 원치 않으며, 따라서 해법을 찾아야 합니다."
 TAJ_masks_of_gold: "황금 가면"
 TAJ_masks_of_gold_desc: "§Y'새 BMW 소리 때문에 당신 말이 안 들리는데요'§!\n\n고장 나지 않은 것을 왜 고치겠습니까? 이득을 취하기 위해 나라의 좀 더 회색 지대인 부분들은 눈감아 줄 수 있습니다."
 TAJ_fortress_of_elite: "엘리트의 요새"
 TAJ_fortress_of_elite_desc: "우리가 보기에 우리는 여전히 국가를 유지하고 있습니다. 이는 우리가 무언가를 제대로 하고 있다는 뜻일 것이며, 엘리트는 어떤 형태의 파괴로부터도 반드시 보호되어야 합니다."
 TAJ_cementing_the_few: "소수의 공고화"
 TAJ_cementing_the_few_desc: "너무 많은 사람들이 돌아다니며 일을 벌이면 그것은 재앙을 부르기에 딱 좋은 상황을 만들 뿐입니다."
 TAJ_compromise_with_shadows: "그림자와의 타협"
 TAJ_compromise_with_shadows_desc: "우리는 세상의 어두운 세력과도 타협해야 하며, 그것이 비국가 행위자와 거래를 한다는 뜻이라 해도 어쩔 수 없습니다. 필요한 모든 수단을 동원해 우리의 필요를 충족시킬 것입니다."
 TAJ_cave_to_chinese_demands: "중국의 요구에 굴복"
 TAJ_cave_to_chinese_demands_desc: "동쪽의 거대한 붉은 용은 째깍거리는 시한폭탄이며 언제든 폭발할 수 있습니다. 살아남으려면 그들을 달래고 원하는 것을 주어야 합니다."
 TAJ_bargains_in_dark: "어둠 속의 거래"
 TAJ_bargains_in_dark_desc: "아프가니스탄 정세는 이용하기에 무르익었으며, 이런 기회를 놓칠 수 없습니다. 할 수 있는 동안 이용해야 합니다."
 TAJ_negotiate_chinese_presence: "중국의 지원 협상"
 TAJ_negotiate_chinese_presence_desc: "중국에 양보를 하려면 그들도 우리에게 대가를 줘야 합니다. 군사적으로 석기시대에 머무르지 않도록 무기를 요청할 것입니다."
 TAJ_whispers_in_white: "하얀 속삭임"
 TAJ_whispers_in_white_desc: "남쪽의 '친구들'은 한동안 그들만의 작은 내전에 몰두해 왔습니다. 가능하다면 그들에게 몇몇... 물건을 요청해 볼 만합니다."
 TAJ_concerning_developments: "우려스러운 전개"
 TAJ_concerning_developments_desc: "아프가니스탄의 정세가 달아오르기 시작했으며, 가능한 한 빨리 이에 대한 조치를 취해야 합니다."
 TAJ_southern_solution: "남쪽의 해법"
 TAJ_southern_solution_desc: "우리 국가와 정부의 생존을 보장하기 위해 해법에 도달해야 합니다. 아프가니스탄 내전에 대처할 포괄적인 계획을 세워야 합니다."
 TAJ_the_lease: "임대"
 TAJ_the_lease_desc: "러시아인들은 소련 통치 시기와 그 이후를 거쳐 수십 년째 우리나라에 제201 군사 기지를 두고 있습니다. 이 관계를 재평가할 때입니다."
 TAJ_boot_in_the_ass: "러시아의 위협 축출"
 TAJ_boot_in_the_ass_desc: "§Y'기억하라, 러시아인은 안 된다'§!\n\n러시아인들을 우리의 순결한 땅에서 영원히 몰아낼 때가 왔습니다. 군사 기지의 미래는 우리 손에 달려 있으며, 보잘것없는 위협을 일삼는 러시아인들의 손에 달려 있지 않습니다."
 TAJ_secure_the_southern_border: "남부의 안보"
 TAJ_secure_the_southern_border_desc: "제201 기지와 관련해 새로운 상황이 발생한 만큼 남쪽의 안보를 재평가해야 합니다. 기지의 개선 가능성을 검토할 것입니다."
 TAJ_renegotiate_terms: "조건 재협상"
 TAJ_renegotiate_terms_desc: "기지를 전부 우리가 가지는 대신 조건을 재협상하는 것도 고려할 수 있습니다. 러시아를 압박해 우리가 원하는 것을 얻어 낼 수도 있고, 아예 그들을 버리고 새 친구를 택할 수도 있습니다."
 TAJ_safeguard_southern_border: "남부 국경 수호"
 TAJ_safeguard_southern_border_desc: "병력을 배치하는 대신, 잠재적 침투로부터 남부 국경을 보호할 새로운 방법을 모색해야 합니다."
 TAJ_the_tajik_fortress: "타지크 요새"
 TAJ_the_tajik_fortress_desc: "국가를 지키려면 나라를 요새로 바꿔야 합니다. 우리의 방어 시설은 이 나라를 침공하는 일을 철저한 악몽으로 만들어, 침략자들이 자신들의 결정을 되짚어 보게 만들 것입니다."
 TAJ_expand_joint_chiefs_of_staff: "합동참모본부 확대"
 TAJ_expand_joint_chiefs_of_staff_desc: "군 합동참모본부에는 복무할 충성파가 더 필요합니다. 현재로서는 계속 커지는 군을 관리할 인원이 턱없이 부족합니다."
 TAJ_founder_of_peace: "평화의 창시자"
 TAJ_founder_of_peace_desc: "우리의 위대한 지도자 라흐몬은 평화의 창시자입니다. 그분이 타지크 내전을 신속히 끝내고 우리의 혼란스러운 삶에 질서를 되찾아 주셨기 때문입니다."
 TAJ_placate_the_scns: "국가안보위원회 강화"
 TAJ_placate_the_scns_desc: "국가안보위원회(SCNS)는 시간이 지날수록, 특히 우리 국가에서 안보에 대한 요구가 계속 커지는 만큼 더욱 쓸모가 있음을 입증할 것입니다."
 TAJ_rahmons_men: "라흐몬의 사람들"
 TAJ_rahmons_men_desc: "정부 내에서 라흐몬에게 충성함을 입증한 소수의 인물들은 보상받고 승진해야 합니다. 그렇게 하면 이들이 지도자를 좋게 말할 것이므로 더 많은 사람들이 지도자를 호의적으로 보게 될 것입니다."
 TAJ_shift_towards_SCNS: "국가안보위원회로의 전환"
 TAJ_shift_towards_SCNS_desc: "군은 우리 국가의 안보를 제대로 유지하지 못하는 것이 분명하며, 따라서 그 일은 진짜 안보 전문가들에게 맡겨야 합니다."
 TAJ_shift_towards_tna: "타지키스탄군으로의 전환"
 TAJ_shift_towards_tna_desc: "타지키스탄군(TAF)은 건국 이래 존재해 왔으며 스스로의 가치를 충분히 입증했습니다. 국가 안보를 유지하는 이들의 입지를 신속히 강화할 것입니다."
 TAJ_rahmons_fruits: "라흐몬의 열매"
 TAJ_rahmons_fruits_desc: "라흐몬 일가는 타지크 정치에 깊이 관여해 왔으며, 그 결과 상당한 부를 쌓았습니다. 이는 이들이 운영하는 가족 사업 덕분이며, 이를 곧 멈출 계획이 있다는 징후는 없습니다."
 TAJ_appoint_rustam: "루스탐 임명"
 TAJ_appoint_rustam_desc: "§Y'당신은 부유하니 누구도 당신을 압박해서는 안 된다'§!\n\n라흐몬의 아들 루스탐은 자신이 합당한 후계자임을 입증하였습니다. 그의 능력을 시험하기 위해 두샨베 시장직에 임명해야 합니다."
 TAJ_the_whole_pie: "파이 전체"
 TAJ_the_whole_pie_desc: "한 조각만 가질 이유가 있겠습니까, 전부 가질 수 있는데? 아니면, 그렇지 않을 수도 있을까요?"
 TAJ_cis_diplomacy: "독립국가연합 외교"
 TAJ_cis_diplomacy_desc: "독립국가연합 국가들과의 대화와 외교는 매우 중요합니다. 어쨌든 그들은 대부분 우리의 이웃입니다. 하지만 동시에 그들을 경계심을 가지고 전략적 파트너로서 바라봐야 합니다."
 TAJ_csto_defense_agreement: "CSTO 방위 협정"
 TAJ_csto_defense_agreement_desc: "CSTO 회원국들을 타지키스탄에 초청하여 우리 군을 살펴보게 해야 합니다. 우리 군은 형편없는 상태이며, 전쟁의 때가 오면 그들은 분명 곁에 더 강한 동맹이 있기를 바랄 것입니다."
 TAJ_promote_csto_expansion: "CSTO 확대 촉진"
 TAJ_promote_csto_expansion_desc: "회원국 수를 고정해 두기로 한다면 동맹은 계속 성장할 수 없습니다. 우즈베크인과 투르크멘인에게 다시 한번 손을 내밀어야 합니다."
 TAJ_solidfy_defense_agreement: "방위 협정 공고화"
 TAJ_solidfy_defense_agreement_desc: "현재 CSTO 내 방위 협정은 상당히 불분명하며, 동맹이 지속되길 바란다면 친구들과 이 협정이 진정 무엇을 뜻하는지 명확히 해야 합니다."
 TAJ_improve_bloc_trade: "블록 내 무역 개선"
 TAJ_improve_bloc_trade_desc: "독립국가연합 국가들 사이의 무역이 부진하며, 따라서 우리가 직접 이익을 얻을 수 있도록 블록 내 무역 개선을 위한 협상을 강화해야 합니다."
 TAJ_flow_of_investors: "꾸준한 투자자 유입"
 TAJ_flow_of_investors_desc: "우리 경제가 번영하려면 투자자들의 꾸준한 유입이 필요합니다. 그렇지 않으면 우리 경제는 분명 또다시 불황에 빠질 것입니다."
 TAJ_aid_rogun_dam: "로군 댐 자금 지원"
 TAJ_aid_rogun_dam_desc: "로군 댐은 자금 지원이 절실하지만 우리 국가에는 충분한 자금이 없습니다. 이 거대한 사업에 자금을 대기 위해 독립국가연합 국가들의 원조를 구하고, 그들의 도움으로 우리나라를 건설할 것입니다."
 TAJ_wall_of_difference: "차이의 벽"
 TAJ_wall_of_difference_desc: "우리는 나머지 독립국가연합 블록과 공통점이 없습니다. 우리는 타지크인이며 앞으로도 그러할 것입니다. 우리는 슬라브인도, 튀르크인도 아니며, 분명 그들의 동맹도 아닙니다."
 TAJ_escelate_pamir_problem: "파미르 문제 격화"
 TAJ_escelate_pamir_problem_desc: "파미르 문제는 방치되어 왔습니다. 이제 이 문제를 해결할 때입니다."
 TAJ_recon_missions_over_border: "국경 너머 정찰 임무"
 TAJ_recon_missions_over_border_desc: "§Y'거기 뭘 갖고 있는 거야, 친구?'§!\n\n키르기스인들은 분명 우리에게 무언가를 숨기고 있으며, 면밀히 살펴 그것이 무엇인지 알아내야 합니다. 병력 편성이든 비밀 무기든, 우리는 알아야 합니다."
 TAJ_usher_an_era_of_change: "변화의 시대 개막"
 TAJ_usher_an_era_of_change_desc: "살아남으려면 변해야 합니다. 타지키스탄도 이 보편적인 법칙에서 예외일 수 없습니다. 21세기의 변화하는 환경에 적응할 수 있도록 나라를 개혁해야 합니다."
 TAJ_tajikistan_for_tajiks: "타지키스탄은 타지크인의 것"
 TAJ_tajikistan_for_tajiks_desc: "타지키스탄은 외국인들이 와서 발을 뻗고 쉬며 우리 국민의 노력을 방해하라고 있는 나라가 아닙니다. 우리는 어떤 강대국에도 굴복하지 않을 것임을 알려야 합니다."
 TAJ_derussification_of_tajikistan: "타지키스탄의 탈러시아화"
 TAJ_derussification_of_tajikistan_desc: "오랜 세월 러시아인들이 우리 땅을 지배하였고, 우리는 그들의 문화를 받아들일 수밖에 없었습니다. 그들이 우리 문화에 미친 영향은 막대했으며, 이제 이 피해를 되돌릴 때입니다."
 TAJ_prohibit_russian_patronymics: "러시아식 부칭 금지"
 TAJ_prohibit_russian_patronymics_desc: "우리는 타지크인입니다! 백 년 전의 어떤 러시아인을 따라 이름을 지을 수는 없습니다. 이 어리석은 관행을 금지할 때가 바로 지금입니다."
 TAJ_persianization_of_language: "언어의 페르시아화"
 TAJ_persianization_of_language_desc: "우리는 뿌리와 다시 이어져야 합니다. 러시아인들이 우리 언어에 가져온 변화로부터 멀어지기 위해 일상 대화에 페르시아어 어휘를 더 많이 도입할 것입니다."
 TAJ_clearing_the_way: "길 닦기"
 TAJ_clearing_the_way_desc: "더 큰 종교 개혁을 위한 길을 닦아야 합니다. 살라피주의 사상을 겨냥함으로써 국가가 변화를 받아들이도록 문을 열 수 있을지 모릅니다."
 TAJ_religious_precautions: "종교적 예방 조치"
 TAJ_religious_precautions_desc: "살라피주의 사상이 퍼지지 않도록 국가를 보호하기 위한 필요한 예방 조치를 취할 것입니다. 특정 관행을 막음으로써 필요한 적절한 조치를 취하는 것입니다."
 TAJ_islamic_appearance: "이슬람식 외양 단속"
 TAJ_islamic_appearance_desc: "§R'밀어, 아니면 내가...'§!\n\n수염, 검은 옷, 성직자 복장은 금지되어야 합니다. 그러한 외양이 우리 젊은이들에게 영향을 미치게 둘 수 없으며, 더 전통적인 타지크식 외양을 받아들이고 나머지는 금지해야 합니다."
 TAJ_mosque_regulations: "모스크 규제"
 TAJ_mosque_regulations_desc: "모스크는 급진화의 중심지이며, 따라서 우리는 아이들이 이 모스크에 다니는 것을 막을 수밖에 없습니다. 18세 미만은 누구도 갈 수 없습니다. 아무도요. 위험한 사상이 퍼지는 것을 막기 위해 일부는 폐쇄해야 합니다."
 TAJ_the_hajj: "하지 문제 처리"
 TAJ_the_hajj_desc: "타지키스탄 공화국에 거주하는 40세 미만의 모든 무슬림은 메카 성지순례(하지)에 참여하는 것이 금지됩니다. 러시아로 가는 사람만으로도 충분한데, 왜 [SAU.GetName]까지 가게 두겠습니까?"
 TAJ_the_peoples_party: "인민당"
 TAJ_the_peoples_party_desc: "우리 당은 인민의 정당이며, 우리가 그들을 대신하여 대표할 것입니다."
 TAJ_minbari_khalq: "민바리 할크 추가 지원"
 TAJ_minbari_khalq_desc: "인민의 연단을 뜻하는 민바리 할크는 당의 기관지이며 잊혀서는 안 됩니다. 추가 자금이 배정되면 전국의 모든 타지크인이 곧 최신호를 직접 집어 들게 될 것입니다."
 TAJ_sozandagoni_vatan: "소잔다고니 바탄 확대"
 TAJ_sozandagoni_vatan_desc: "조국의 창조자들을 뜻하는 소잔다고니 바탄은 우리 당의 청년 조직입니다. 국민을 더 어린 나이부터 당 활동에 참여시킬 수 있다면, 모두를 위한 더 나은 타지키스탄을 건설할 수 있을 것입니다."
 TAJ_electoral_reform: "선거 '개혁'"
 TAJ_electoral_reform_desc: "§Y'작은 글씨를 읽어 보세요, 그렇게 쓰여 있지 않습니다'§!\n\n어차피 이길 선거라면 선거가 왜 필요하겠습니까? 그래도 우리는 민주 정당이므로 결국에는 선거를 치르게 될 것입니다. 다만 먼저 약간의 변경을 거치지 않고서는 아니겠지만요..."
 TAJ_youth_informants: "청년 정보원"
 TAJ_youth_informants_desc: "청년 조직 구성원들을 활용해 거리를 돌아다니는 반항적인 청소년들을 식별하고, 그에 맞게 처리하도록 할 수 있습니다."
 TAJ_expand_compulsory_education: "의무교육 연장"
 TAJ_expand_compulsory_education_desc: "현재 의무교육은 10학년까지만 시행됩니다. 12년 전 과정을 이수하도록 의무화할 때입니다."
 TAJ_the_media_law: "언론 '법'"
 TAJ_the_media_law_desc: "언론 '법'을 통과시키면 기자들이 무엇을 우선시해야 하는지에 대해, 먼 나라로 긴 휴가를 떠나고 싶지 않은 경우에 한해 큰 힌트를 줄 수 있습니다."
 TAJ_self_censorship: "자기 검열"
 TAJ_self_censorship_desc: "머지않아 무슨 말을 하라고 일일이 말할 필요도 없어지고, 그들이 알아서 우리를 대신해 할 것입니다. 우리를 좋게 말하는 자에게는 보상하고, 나쁘게 말하는 자는 처벌할 것입니다."
 TAJ_a_republic_ish: "공화국 비슷한 무언가"
 TAJ_a_republic_ish_desc: "§G'민주주의로 가는 지름길은 없다'\n- 에모말리 라흐몬§!\n\n우리는 공화국이지만, 그것은 모두 어떻게 해석하느냐에 달려 있습니다. 물론 우리에게는 의회와 대통령이 있는데, 어떻게 독재 국가일 수 있겠습니까?"
 TAJ_dostievs_endorsement: "도스티예프의 지지 표명"
 TAJ_dostievs_endorsement_desc: "당의 창립자인 도스티예프가 영광스러운 지도자 [TAJ.GetLeader]을(를) 지지하게 함으로써, 기자들에게 보도할 거리를 줄 수 있을 것입니다."
 TAJ_reconstruction_of_army: "군 재건"
 TAJ_reconstruction_of_army_desc: "우리나라에서 더 많은 개혁이 필요한 분야 중 하나는 군입니다. 기술은 뒤처지고 모병은 역대 최저 수준이므로, 이를 바로잡아야 합니다."
 TAJ_modernization_of_the_equipment: "장비 현대화"
 TAJ_modernization_of_the_equipment_desc: "군을 바로잡는 첫걸음 중 하나는 군을 현대화하는 것입니다. 사용하는 기술을 업그레이드함으로써 적에 대한 우위를 점할 수 있을 것입니다."
 TAJ_revise_conscription_laws: "징병법 개정"
 TAJ_revise_conscription_laws_desc: "요즘은 아무도 복무하려 하지 않으므로, 원하지 않는 이들은 강제로라도 복무하게 만들 것입니다."
 TAJ_border_troop_centre: "국경 부대 센터"
 TAJ_border_troop_centre_desc: "우리에게는 전문 국경 부대가 절실히 필요하며, 이들을 관리할 전용 시설이 필요합니다."
 TAJ_cracks_in_the_foundation: "토대의 균열"
 TAJ_cracks_in_the_foundation_desc: "[TAJ.GetLeader]의 타지키스탄 통치 토대에 균열이 생겼습니다. 특정한 통치 원칙을 따름으로써 이를 해결해야 합니다."
 TAJ_grip_on_nation: "국가 장악력"
 TAJ_grip_on_nation_desc: "국가에 대한 우리의 장악력이 흔들리게 둘 수 없으며, 타지키스탄 안에서든 해외에서든 필요한 곳 어디서나 지지를 구할 것입니다."
 TAJ_foreign_legitimacy: "외부 중심 정통성"
 TAJ_foreign_legitimacy_desc: "우리의 정통성을 타국에 기반을 둘 것이며, 그들의 칭찬을 디딤돌 삼아 우리가 진정 자격이 있음을 국민에게 보여 줄 것입니다."
 TAJ_self_empowerment: "자력 강화"
 TAJ_self_empowerment_desc: "다른 이들이 어떻게 생각하든 무슨 상관입니까? 우리 정부의 정통성을 세우는 데 과두 세력이나 대통령, 왕, 독재자의 도움은 필요하지 않습니다."
 TAJ_russias_pawn: "러시아의 졸"
 TAJ_russias_pawn_desc: "러시아가 우리의 노력에 자금을 댈 의향이 있는 것은 분명합니다. 따라서 그들의 호감을 사서 그들이 말하는 대로 따르는 것이 가장 현명한 수로 보입니다."
 TAJ_expansion_of_the_arms_industry: "군수 산업 확대"
 TAJ_expansion_of_the_arms_industry_desc: "우리 두 발로 서려면 군수 산업을 확대해야 합니다. 우리 자신의 무기를 생산해야 합니다."
 TAJ_distance_from_foreign_reliance: "외국 의존에서 벗어나기"
 TAJ_distance_from_foreign_reliance_desc: "우리는 어느 한 나라나 다른 나라에 지나치게 의존해서는 안 되며, 오직 우리 자신의 힘에만 의지해야 합니다."
 TAJ_our_own_scientists: "우리 자신의 과학자들"
 TAJ_our_own_scientists_desc: "우리 과학자들은 외국 과학자들만큼, 어쩌면 그보다 더 뛰어납니다. 연구는 바로 여기 타지키스탄에서 수행할 것이며, 위대한 돌파구와 발견을 이룰 것입니다."
 TAJ_russian_arms_deals: "러시아 무기 거래"
 TAJ_russian_arms_deals_desc: "러시아인들은 상당한 무기고를 쌓아 두었으며, 그들의 전술 일부를 활용해 우리의 비축량을 늘리는 데 분명 도움을 받을 수 있습니다."
 TAJ_russian_oil: "러시아 석유"
 TAJ_russian_oil_desc: "이 검은 황금은 어떤 다른 자원보다 세계에 큰 반향을 일으킵니다. 러시아 투자자들이 타지키스탄의 중심부로 몰려와 석유를 시추하도록 할 수 있다면, 큰 부를 얻을 수도 있습니다."
 TAJ_eye_of_asia: "아시아의 눈"
 TAJ_eye_of_asia_desc: "우리는 사실상 아시아의 중심에 자리하고 있으며, 이 전략적 위치는 국민에게 자긍심을 심어 주는 훌륭한 도구로 쓰일 수 있습니다."
 TAJ_handeling_foreign_dissidents: "해외 반체제 인사 처리"
 TAJ_handeling_foreign_dissidents_desc: "타지키스탄에 거주하지 않으면서도 할 말이 많은 이들이 많습니다. 정부의 평판이 실추되지 않도록 이들을 처리해야 합니다."
 TAJ_our_strength: "우리의 힘"
 TAJ_our_strength_desc: "우리가 처한 상황이 어떠하든 우리의 힘은 잊혀서는 안 됩니다. 이 애국적 신념으로 국민의 결의를 강화하고 앞으로 나아갈 것입니다!"
 TAJ_emomalis_orders: "에모말리의 명령"
 TAJ_emomalis_orders_desc: "흔들림 없는 우리의 지도자, 국가의 영도자, 평화와 민족 단결의 창시자 에모말리 라흐몬께서 명령을 내리셨습니다. 명령은 매우 간단합니다. 위대한 타지크 국가가 더욱 위대해질 수 있도록 준비하고 굳건히 서라는 것입니다!"
 TAJ_kyrgzy_integration: "[KYR.GetAdjective] 통합"
 TAJ_kyrgzy_integration_desc: "우리의 경쟁자가 마침내 굴복할 때가 왔습니다. [KYR.GetName] 국가는 마침내 자신들이 인위적인 존재임을 깨닫고 우리와 하나가 될 것입니다!"
 TAJ_uzbek_integration: "우즈베크 통합"
 TAJ_uzbek_integration_desc: "우즈베키스탄에는 많은 타지크인이 거주하고 있으며 그다지 좋은 대우를 받지 못했습니다. 우즈베크 형제들과 다시 통합하여 하나가 되어야 합니다."
 TAJ_dominance_over_afghanistan: "무덤을 파헤치다"
 TAJ_dominance_over_afghanistan_desc: "많은 제국이 아프가니스탄으로 갔다가 그곳에서 죽었습니다. 우리는 제국이 아니라 하나의 국가이며, 아프간 민족과 한 민족입니다. 우리의 연합이 모두가 틀렸음을 증명할 때입니다."
 TAJ_turkmen_cooperation: "투르크멘 지배"
 TAJ_turkmen_cooperation_desc: "투르크멘인들은 대체로 자기들끼리만 지내지만, 이제 이에 대해 조치를 취할 때가 왔습니다. 우리 국가들이 합친다면 그들은 협력의 이점을 직접 보게 될 것입니다."
 TAJ_kazakh_invitation: "카자흐 협력"
 TAJ_kazakh_invitation_desc: "카자흐인들은 어차피 무너질 운명이었으니, 무슨 일이 생기기 전에 우리와 합치게 하는 편이 낫지 않겠습니까?"
 TAJ_central_asian_state: "하나의 국가, 다양한 민족"
 TAJ_central_asian_state_desc: "중앙아시아 국가 연합은 인류 역사상 가장 성공적인 연합 중 하나로 역사에 기록될 것입니다. 어떤 러시아인도 이 지역을 다스리지 못했지만, 현지인이라면 분명 성공할 것입니다."
 TAJ_armed_forces: "군 강화"
 TAJ_armed_forces_desc: "타지키스탄 안보의 중추는 잘 준비되고 규율 잡힌 군대에 있습니다. 우리 군을 강화하고 어떤 도전에도 대비하도록 할 때입니다."
 TAJ_air_defense_forces: "방공군"
 TAJ_air_defense_forces_desc: "우리의 하늘을 지키는 것은 최우선 과제입니다. 방공군을 발전시키고 현대화함으로써 공중 위협으로부터 국가를 보호할 것입니다."
 TAJ_security_in_airspace: "영공 안보"
 TAJ_security_in_airspace_desc: "타지키스탄 영공에 대한 통제권을 유지하는 것은 우리의 주권을 보장하고 적대 세력의 침범을 막습니다."
 TAJ_lucrative_weapons_procurements: "수익성 높은 무기 조달"
 TAJ_lucrative_weapons_procurements_desc: "군사적으로 도약하려면 더 진보된 무기를 손에 넣어야 합니다."
 TAJ_ground_forces: "지상군 현대화"
 TAJ_ground_forces_desc: "우리 지상군은 새롭게 등장하는 위협에 효과적으로 대응할 수 있도록 최신 기술과 훈련을 갖추어야 합니다."
 TAJ_upgrade_helicopter_fleet: "헬리콥터 전력 업그레이드"
 TAJ_upgrade_helicopter_fleet_desc: "헬리콥터는 현대전의 주력입니다. 전력을 업그레이드하면 전투에서의 기동성과 전술적 유연성이 향상될 것입니다."
 TAJ_nationwide_airbase_upgrades: "전국 공군 기지 업그레이드"
 TAJ_nationwide_airbase_upgrades_desc: "커져 가는 공군력을 뒷받침하기 위해 전국의 공군 기지를 업그레이드하고 확장하여 현대식 항공기를 수용할 수 있도록 해야 합니다."
 TAJ_operational_integrity_desc: "지휘 구조를 간소화하고 완벽한 조율을 보장하면 모든 군사 작전의 효율성이 향상될 것입니다."
 TAJ_statewide_radar_coverage: "전국 레이더 망"
 TAJ_statewide_radar_coverage_desc: "포괄적인 레이더 망은 조기 경보와 국경 통제 유지에 필수적입니다."
 TAJ_ensure_regime_loyalty: "정권 충성 확보"
 TAJ_ensure_regime_loyalty_desc: "군 내부의 충성은 무엇보다 중요합니다. 불충한 요소를 뿌리 뽑고 정권을 지키기 위한 조치를 시행할 것입니다."
 TAJ_mobilization_plan: "종합 동원 계획"
 TAJ_mobilization_plan_desc: "명확하고 효율적인 동원 계획은 타지키스탄이 위기에 신속히 대응하고 필요할 때 스스로를 방어할 수 있도록 보장할 것입니다."
 TAJ_tajik_mobility_forces: "타지크 기동군"
 TAJ_tajik_mobility_forces_desc: "기동성이 높은 병력을 육성하면 신속한 배치와 국내 어디서든 위협에 대한 빠른 대응이 가능해집니다."
 TAJ_analyze_civil_war: "내전 분석"
 TAJ_analyze_civil_war_desc: "내전의 교훈을 연구함으로써 약점을 파악하고 향후 분쟁을 막을 전략을 시행할 수 있습니다."
 TAJ_ensure_stable_supply: "안정적 보급망 확보"
 TAJ_ensure_stable_supply_desc: "자원과 장비의 꾸준한 보급은 군사 작전의 성공에 필수적입니다. 이 생명선을 확보해야 합니다."
 TAJ_contracts_with_partner: "파트너와의 무기 계약 확보"
 TAJ_contracts_with_partner_desc: "신뢰할 수 있는 무기 파트너와 협력하면 고품질 장비를 확보하고 군사 역량을 강화할 수 있습니다."
 TAJ_turkish_military_industries: "튀르키예 군수 산업"
 TAJ_turkish_military_industries_desc: "타지키스탄 군수 산업에 대한 튀르키예의 투자를 장려하면 우리의 생산 역량이 강화되고 귀중한 협력 관계가 만들어질 것입니다."
 TAJ_iranian_drone_factories: "이란 드론 공장"
 TAJ_iranian_drone_factories_desc: "이란과 협력하여 드론 제조 시설을 건설하면 타지키스탄은 첨단 무인기 기술을 확보하고 공중 전력을 강화할 수 있습니다."
 TAJ_expansion_of_central_command: "중앙사령부 확대"
 TAJ_expansion_of_central_command_desc: "더욱 강력하고 중앙집권화된 군 지휘 체계는 전군의 모든 부문에 걸친 협조와 의사결정을 개선할 것입니다."
 TAJ_tajik_armored_forces: "타지크 기갑 전력 발전"
 TAJ_tajik_armored_forces_desc: "기갑 전력을 현대화하면 전장을 지배하고 승리를 확보하는 데 필요한 중화력을 갖추게 될 것입니다."
 TAJ_phase_out_t_seventy_two: "T-72 단계적 퇴역"
 TAJ_phase_out_t_seventy_two_desc: "노후한 T-72 전차는 더 이상 현대적 기준을 충족하지 못합니다. 이를 단계적으로 퇴역시키면 더 선진적인 장갑차량을 위한 여지가 생길 것입니다."
 TAJ_coescd: "COESCD 지원"
 TAJ_coescd_desc: "비상사태·민방위 위원회는 재난 대응과 민방위에 필수적인 기관입니다. 이 기관을 강화하면 국가 회복력이 높아질 것입니다."
 TAJ_national_guard: "국가방위군 재편"
 TAJ_national_guard_desc: "국가방위군은 내부 안보 위협에 더 잘 대처하고 비상시에 지원을 제공할 수 있도록 개편되어야 합니다."
 TAJ_coup_preventive_strategy: "쿠데타 예방 전략"
 TAJ_coup_preventive_strategy_desc: "정부에 대한 쿠데타를 막기 위한 포괄적 전략은 정부의 안정도를 지키고 지속적인 발전을 보장할 것입니다."
 TAJ_modern_steel: "현대식 강철"
 TAJ_modern_steel_desc: "첨단 전차 제조 시설을 구축하면 최신식 장갑차량을 국내에서 생산할 수 있게 될 것입니다."
 TAJ_sophisticated_troops: "정예 병력"
 TAJ_sophisticated_troops_desc: "기술적 개선과 고도화된 훈련에 투자하면 우리 병력은 높은 역량을 갖춘 현대적 전투 부대로 탈바꿈할 것입니다."
 TAJ_on_own_feet: "자력으로 서기"
 TAJ_on_own_feet_desc: "국방 분야에서 자급자족에 집중함으로써 타지키스탄은 오랫동안 갈망해 온 유산을 마침내 이룰 수 있습니다. 우리는 더 이상 다른 강대국들의 처분에 맡겨지지 않을 것이며, 자력으로 일어서서 악에 맞서 싸울 것입니다."
 TAJ_central_asias_poorest: "중앙아시아에서 가장 가난한 나라"
 TAJ_central_asias_poorest_desc: "타지키스탄의 경제적 곤란은 심각하여 중앙아시아에서 가장 가난한 나라라는 달갑지 않은 오명을 얻었습니다. 우리는 이 현실을 정면으로 마주하고 더 밝은 미래를 향한 여정을 시작해야 합니다."
 TAJ_water_melon_economy: "수박 경제"
 TAJ_water_melon_economy_desc: "우리의 농업적 정체성을 상징하듯, 우리 경제는 계절 작물에 크게 의존하고 있습니다. 이 부문을 강화하는 동시에 경제 기반을 다변화할 때입니다."
 TAJ_bode_to_industry: "산업의 새로운 보금자리"
 TAJ_bode_to_industry_desc: "강력한 타지크 경제의 토대는 산업 성장에 있습니다. 우리는 제조업 부흥의 기반을 닦을 것입니다."
 TAJ_tap_into_imf_funds: "IMF 자금 활용"
 TAJ_tap_into_imf_funds_desc: "IMF의 지원을 확보하면 경제를 안정시키고 핵심 개혁을 추진하는 데 필요한 재정적 지원을 얻을 수 있습니다."
 TAJ_dehqan_farms: "데흐칸 농장 지원"
 TAJ_dehqan_farms_desc: "소규모 독립 농장은 타지키스탄 농촌의 심장입니다. 이를 강화하면 농업 생산과 농촌의 생계가 증진될 것입니다."
 TAJ_local_cotton_production: "면화 생산 재활성화"
 TAJ_local_cotton_production_desc: "면화는 수십 년간 우리 경제의 기둥이었습니다. 지역 내 영향력을 되찾기 위해 이 중요한 산업을 되살려야 합니다."
 TAJ_modernization_of_farming_equipment: "농기계 현대화"
 TAJ_modernization_of_farming_equipment_desc: "낡은 영농 방식은 우리의 농업 잠재력을 가로막고 있습니다. 현대적 장비를 도입하면 더 높은 수확량과 효율성을 확보할 수 있습니다."
 TAJ_jewels_of_tajikistan: "타지키스탄의 보석"
 TAJ_jewels_of_tajikistan_desc: "우리의 보석과 광물은 숨겨진 보물입니다. 보석 채굴과 정제를 확대하면 우리 경제에 광채를 더할 것입니다."
 TAJ_uranium_mining: "우라늄 매장량 개발"
 TAJ_uranium_mining_desc: "타지키스탄의 우라늄 광상은 귀중한 자원입니다. 이 부문을 개발하면 수익성 높은 수출원을 확보하고 경제를 뒷받침할 것입니다."
 TAJ_gold_and_silver_sughd: "소그드의 금과 은"
 TAJ_gold_and_silver_sughd_desc: "소그드의 풍부한 광맥에는 아직 손대지 않은 부가 잠들어 있습니다. 이 귀금속을 채굴하면 지역과 국가에 번영을 가져올 것입니다."
 TAJ_mining_tech_upgrades: "채굴 기술 개선"
 TAJ_mining_tech_upgrades_desc: "채굴 기법을 현대화하면 효율성, 안전성, 지속 가능성이 확보되어 천연자원으로부터 최대한의 수익을 얻을 수 있습니다."
 TAJ_take_back_control: "통제권 회복"
 TAJ_take_back_control_desc: "우리 경제에 대한 외국의 지배는 국가 주권을 훼손합니다. 전략 산업의 통제권을 외부 영향력으로부터 되찾을 때입니다."
 TAJ_nationalize_chinese_assets: "중국 자산 국유화"
 TAJ_nationalize_chinese_assets_desc: "중국 기업들은 타지키스탄에서 상당한 영향력을 행사하고 있습니다. 이들의 자산을 국유화함으로써 우리는 경제적 독립을 재확립할 것입니다."
 TAJ_reinforce_chinese_corporations: "중국 기업과의 협력 강화"
 TAJ_reinforce_chinese_corporations_desc: "중국 기업들과 협력하면 우리 광업 부문에 자본과 전문 지식이 유입되어 상호 성장과 발전이 보장될 것입니다."
 TAJ_sino_tajik_mining_company: "중국-타지크 광업 회사"
 TAJ_sino_tajik_mining_company_desc: "중국과 합작 광업 사업을 설립하면 타지키스탄의 광물 자원을 효과적으로 개발하는 데 필요한 투자와 기술을 확보할 수 있습니다."
 TAJ_regional_modernization: "지방 현대화"
 TAJ_regional_modernization_desc: "지방의 기반시설과 산업을 발전시키면 균형 잡힌 성장이 보장되고 타지키스탄 전역의 격차가 줄어들 것입니다."
 TAJ_revise_transit_tarifs: "통과 관세 조정"
 TAJ_revise_transit_tarifs_desc: "타지키스탄을 통과하는 물품의 관세를 조정하면 무역이 촉진되고 우리가 지역의 핵심 환적 거점으로 자리매김할 수 있습니다."
 TAJ_central_asian_railway_summit: "중앙아시아 철도 정상회의"
 TAJ_central_asian_railway_summit_desc: "지역 철도망 구축을 위한 정상회의를 개최하면 연결성이 개선되고 중앙아시아의 경제 협력이 촉진될 것입니다."
 TAJ_chemical_production: "화학 생산 확대"
 TAJ_chemical_production_desc: "화학 산업에 투자하면 경제가 다변화되고 수출과 국내 사용을 위한 새로운 기회가 창출될 것입니다."
 TAJ_rural_hunger: "농촌 기아 해결"
 TAJ_rural_hunger_desc: "농촌 지역의 만연한 기아는 국가적 수치입니다. 모든 타지크인의 식량 안보를 보장하기 위한 사업을 시작해야 합니다."
 TAJ_wto_benefits: "WTO 혜택 활용"
 TAJ_wto_benefits_desc: "WTO 회원국 지위는 국제 무역과 협력을 통해 기아 문제를 해결할 기회를 제공합니다. 이 잠재력을 활용합시다."
 TAJ_domestic_innovation: "기아 해결을 위한 국내 혁신"
 TAJ_domestic_innovation_desc: "지역의 창의력과 혁신을 활용하면 타지키스탄의 기아와 영양실조에 맞서 싸울 지속 가능한 해법을 마련할 수 있습니다."
 TAJ_food_for_troops: "병력을 위한 식량"
 TAJ_food_for_troops_desc: "잘 먹은 군대가 유능한 군대입니다. 병력에게 충분한 식량을 공급하면 사기와 전투 준비태세가 높아질 것입니다."
 TAJ_strain_of_energy: "에너지 부담"
 TAJ_strain_of_energy_desc: "타지키스탄의 에너지 위기는 경제 안정도를 위협합니다. 전력 부족 해소는 장기적인 발전에 필수적입니다."
 TAJ_vakhsh_hydroelectric_project: "바흐시 수력발전 사업"
 TAJ_vakhsh_hydroelectric_project_desc: "바흐시 강을 따라 수력발전에 투자하면 청정 에너지를 생산하고 에너지난을 완화할 수 있습니다."
 TAJ_nuclear_gamble: "핵 도박"
 TAJ_nuclear_gamble_desc: "원자력 에너지 탐색에는 위험과 보상이 공존합니다. 성공한다면 미래를 위한 지속 가능한 에너지원을 제공할 것입니다."
 TAJ_caspian_fuel_pipeline: "카스피 연료 파이프라인"
 TAJ_caspian_fuel_pipeline_desc: "카스피 해로 이어지는 파이프라인 경로를 확보하면 에너지 무역이 강화되고 타지키스탄이 지역 시장의 핵심 주체로 자리잡을 것입니다."
 TAJ_stamp_out_the_leftists: "좌익 척결"
 TAJ_stamp_out_the_leftists_desc: "우리 국가의 좌익 분자들은, 그들이 우리를 억압받던 소련 시대로 수십 년 되돌려 놓기 전에 처리되어야 합니다."
 TAJ_develop_dushanbe: "두샨베 개발"
 TAJ_develop_dushanbe_desc: "수도인 두샨베는 타지키스탄의 잠재력을 보여주는 본보기가 되어야 합니다. 기반시설 개선과 도시 개발로 이곳을 현대적인 대도시로 탈바꿈시킬 것입니다."
 TAJ_concessions_to_badakhshan: "바다흐샨에 대한 양보"
 TAJ_concessions_to_badakhshan_desc: "안정도를 유지하려면 바다흐샨의 개발에 투자하고 더 큰 자치권을 부여하여 이 지역의 고유한 요구에 대응해야 합니다."
 TAJ_regional_hospitals: "바다흐샨 지역 병원"
 TAJ_regional_hospitals_desc: "고르노바다흐샨의 의료 기반시설을 개선하면 주민들에게 필수적인 서비스를 제공하고 지역 간 격차를 줄일 수 있습니다."
 TAJ_sughd_plan: "소그드 개발 계획"
 TAJ_sughd_plan_desc: "소그드의 산업과 기반시설에 집중 투자하면 이 지역의 경제적 잠재력을 끌어내고 주민들에게 번영을 안겨줄 것입니다."
 TAJ_anzob_tunnel: "안조브 터널 완공"
 TAJ_anzob_tunnel_desc: "안조브 터널을 완공하면 타지키스탄 남북 간 연결성이 높아지고 무역과 국민 통합이 촉진될 것입니다."
 TAJ_swiss_toolbox_idea: "스위스 도구 상자"
 TAJ_swiss_toolbox: "스위스 도구 상자"
 TAJ_swiss_toolbox_desc: "스위스 전문가들과 협력하면 타지키스탄 경제를 현대화할 선진 기법과 전략을 얻을 수 있습니다."
 TAJ_seco_economic_cooperation: "SECO 경제 협력 우선시"
 TAJ_seco_economic_cooperation_desc: "스위스 연방경제사무국(SECO)은 외국과의 경제 협력에 언제나 열려 있으며, 우리는 이러한 기회를 결코 놓칠 수 없습니다."
 TAJ_seri_partnerships: "SERI 파트너십"
 TAJ_seri_partnerships_desc: "스위스 연방교육연구혁신사무국(SERI)은 스위스 국내외의 교육과 연구를 증진하기 위해 스위스가 자금을 지원하는 기관입니다. 우리는 이를 우리에게 유리하게 활용해야 합니다."
 TAJ_work_visas: "취업 비자 발급"
 TAJ_work_visas_desc: "알맞은 조건만 갖춘다면, 이주해 와서 우리 경제의 수요를 충족해 줄 의향이 있는 사람들에게 취업 비자를 발급함으로써 우리 경제는 더욱 번영할 수 있습니다."
 TAJ_rahmon_dead: "라흐몬 사망!"
 TAJ_rahmon_dead_desc: "에모말리 라흐몬의 사망 이후 정권 충성파들은 사기가 꺾였습니다."
 TAJ_work_visas_idea: "취업 비자"
 TAJ_loyal_high_command: "충성스러운 최고사령부"
 TAJ_uto_support: "UTO 지지"
 TAJ_tajiks_for_tajikistan: "타지키스탄은 타지크인의 것!"
 TAJ_201st_base_upgrade_no_russian: "제201군사기지"
 TAJ_unbalanced_books: "불균형한 장부"
 TAJ_unbalanced_books_desc: "우리 예산은 흑자에서 벗어났지만, 가난한 것이 아니라 투자하고 있을 뿐입니다."
 TAJ_moscow_estate: "모스크바 저택"
 TAJ_moscow_estate_desc: "큰 집, 큰 꿈, 그리고 큰 가격표. 우리 지도자는 국가를 위한 이른바 '투자'에 매우 흡족해하고 있습니다."
 TAJ_presidential_palace: "대통령궁"
 TAJ_presidential_palace_desc: "백악관은 아니지만 우리에게는 보금자리입니다. 이왕 하는 김에 정문 앞에 커다란 깃대도 세워야 할 것입니다."
 TAJ_security_of_the_state: "국가 보안"
 TAJ_security_of_the_state_desc: "집의 모든 모퉁이마다 카메라가 있습니다. 국가 보안에서는 벗어날 수 없습니다."
 TAJ_russian_payments: "러시아의 지급금"
 TAJ_russian_payments_desc: "러시아 국가는 우리의 압박을 받아 우리 이익을 위한 경제적 혜택을 내주었습니다."
 TAJ_national_guard_deployed: "타지크 국가방위군"
 TAJ_national_guard_deployed_desc: "국가는 이슬람주의 정치 활동에 대처해야 한다고 결정했습니다. 우리는 국가방위군을 이용해 이들이 서서히 와해되어 각자의 집으로 물러나도록 만들고 있습니다.\n§W------------------§!\n이 국가 정신이 활성화되어 있는 동안 £TAJ_kingdom  §HIRP 영향력§!이 매달 §G-1%§! 감소합니다."
 TAJ_military_infancy: "군사적 유아기"
 TAJ_military_infancy_desc: "다른 소련 이후 국가들과 달리 [TAJ.GetFlag] 타지키스탄은 국내에 주둔하던 소련군 부대를 기반으로 군대를 건설하지 않았습니다. 오히려 [TAJ.GetFlag] 타지키스탄은 국가가 만들지 않은 모든 부대를 해체하고 군대를 처음부터 새로 창설하는 길을 택했습니다. 그 결과 내전 외에는 대규모 분쟁을 치러 본 적 없는 미숙한 군대가 되었습니다.\n§W------------------§!\n우리가 §H국가 중점§!의 '§H타지키스탄 군대§!' 분기를 따르면 이 국가 정신은 §R제거§!될 수 있습니다."
 TAJ_flight_of_labor: "노동력의 대탈출"
 TAJ_flight_of_labor_desc: "경제 불안정으로 남성 인구의 50%가 일자리를 찾아 [SOV.GetFlag] [SOV.GetName] 등의 국가로 이주했습니다. 이러한 관행은 개별 가정에는 도움이 될 수 있으나, 숙련 노동력 부족으로 인해 결국 [TAJ.GetFlag] 타지크 경제가 가장 큰 타격을 입습니다. 더욱이 해외에 나간 일부 남성들은 외국 모스크에 다니기 시작하며 이슬람 극단주의에 더 쉽게 빠져 간헐적인 사건으로 이어지기도 합니다.\n§W------------------§!\n우리의 §HGDP§!가 §H$250B§!를 넘고 §H65% 안정도§! 이상이 되면 이 국가 정신은 §R제거§!됩니다.\n§W------------------§!\n이 국가 정신이 제거되면 §H움마의 메아리§!와 £TAJ_kingdom  §HIRP 영향력§! 캠페인을 끝낼 수 있습니다."
 TAJ_woes_of_the_civilwar: "내전의 후유증"
 TAJ_woes_of_the_civilwar_desc: "1992년 우리 국가는 타지크인끼리 맞서 싸우는 5년간의 내전으로 붕괴했습니다. 중앙정부에 반대하는 세력들은 UTO(통합 타지크 야권) 아래 결집했으며, [BDA.GetFlag] 바다흐샨 지역에서는 일부 분리 독립 운동이 일어났습니다. 내전이 끝난 뒤 £TAJ_emerging_reactionary  인민민주당은 £TAJ_kingdom  이슬람부흥당과 £TAJ_western_conservative 타지키스탄 민주당 등 UTO의 여러 단체와 조약을 체결하여 휴전의 대가로 일부 양보를 허용했습니다.\n§W------------------§!\n[BDA.GetFlag] §H바다흐샨 분쟁§!을 종결하면 이 국가 정신은 §R제거§!됩니다."
 TAJ_201st_base: "제201군사기지"
 TAJ_201st_base_usa: "두샨베 전방작전기지"
 TAJ_201st_base_raj: "샤크티 기지"
 TAJ_201st_base_chi: "하모니 기지 - 두샨베"
 TAJ_201st_base_desc: "제201군사기지는 우리의 짧은 국가 역사에서 지금까지 매우 중요한 역할을 해 왔습니다. 이 기지는 국경을 맞대고 있지 않음에도 불구하고 [SOV.GetFlag] 러시아의 영향력과 보호의 거점 역할을 합니다. 현재 기지에는 [SOV.GetFlag] 러시아군의 제201소총병사단이 주둔하고 있으며, [TAL.GetFlag] [AFG.GetFlag] 아프가니스탄이 [TAJ.GetFlag] 타지키스탄을 침공할 가능성에 대비하여 우리 병력에게 가끔 훈련을 제공합니다. 또한 이들은 임대료를 지불하여 우리 경제에 보탬이 됩니다.\n§W------------------§!\n[SOV.GetFlag] §H러시아 군사 통행권§!을 없애면 이 국가 정신은 §R제거§!됩니다."
 TAJ_201st_base_upgrade_desc: "제201군사기지는 우리의 짧은 국가 역사에서 지금까지 매우 중요한 역할을 해 왔습니다. 이 기지는 국경을 맞대고 있지 않음에도 불구하고 [SOV.GetFlag] 러시아의 영향력과 보호의 거점 역할을 합니다. 현재 기지에는 [SOV.GetFlag] 러시아군의 제201소총병사단이 주둔하고 있으며, [TAL.GetFlag] [AFG.GetFlag] 아프가니스탄이 [TAJ.GetFlag] 타지키스탄을 침공할 가능성에 대비하여 우리 병력에게 가끔 훈련을 제공합니다. 또한 이들은 임대료를 지불하여 우리 경제에 보탬이 됩니다.\n§W------------------§!\n[SOV.GetFlag] §H러시아 군사 통행권§!을 없애면 이 국가 정신은 §R제거§!됩니다."
 TAJ_201st_base_raj_desc: "샤크티 기지는 국경을 맞대고 있지 않음에도 불구하고 [RAJ.GetFlag] 인도의 영향력과 보호의 거점 역할을 합니다. 현재 기지에는 [RAJ.GetFlag] 인도군이 주둔하고 있으며, [TAL.GetFlag] [AFG.GetFlag] 아프가니스탄이 [TAJ.GetFlag] 타지키스탄을 침공할 가능성에 대비하여 우리 병력에게 가끔 훈련을 제공합니다. 또한 이들은 임대료를 지불하여 우리 경제에 보탬이 됩니다.\n§W------------------§!\n[RAJ.GetFlag] §H인도 군사 통행권§!을 없애면 이 국가 정신은 §R제거§!됩니다."
 TAJ_201st_base_usa_desc: "두샨베 전방작전기지는 국경을 맞대고 있지 않음에도 불구하고 [USA.GetFlag] 미국의 영향력과 보호의 거점 역할을 합니다. 현재 기지에는 [USA.GetFlag] 미군이 주둔하고 있으며, [TAL.GetFlag] [AFG.GetFlag] 아프가니스탄이 [TAJ.GetFlag] 타지키스탄을 침공할 가능성에 대비하여 우리 병력에게 가끔 훈련을 제공합니다. 또한 이들은 임대료를 지불하여 우리 경제에 보탬이 됩니다.\n§W------------------§!\n[USA.GetFlag] §H미국 군사 통행권§!을 없애면 이 국가 정신은 §R제거§!됩니다."
 TAJ_201st_base_chi_desc: "하모니 기지는 [CHI.GetFlag] 중국의 영향력과 보호의 거점 역할을 합니다. 현재 기지에는 [CHI.GetFlag] 중국군이 주둔하고 있으며, [TAL.GetFlag] [AFG.GetFlag] 아프가니스탄이 [TAJ.GetFlag] 타지키스탄을 침공할 가능성에 대비하여 우리 병력에게 가끔 훈련을 제공합니다. 또한 이들은 임대료를 지불하여 우리 경제에 보탬이 됩니다.\n§W------------------§!\n[CHI.GetFlag] §H중국 군사 통행권§!을 없애면 이 국가 정신은 §R제거§!됩니다."
 TAJ_tajik_barrier: "타지크의 장벽"
 TAJ_tajik_barrier_desc: "우리 나라는 스스로에게 장벽 역할을 합니다. 높은 산맥이 오늘날처럼 연결된 세상에서도 위험한 사상과 신념의 확산을 늦추기 때문입니다."
 TAJ_legacy_of_uto_idea: "UTO의 유산"
 TAJ_legacy_of_uto_idea_desc: "UTO의 유산은 우리 당원들과 국민들에게 강하게 울려 퍼집니다. 용감한 이들이 전장에서 치른 희생을 우리는 결코 잊지 않을 것입니다."
 TAJ_revolutionary_patrionism: "혁명적 애국주의"
 TAJ_revolutionary_patrionism_desc: "애국심의 가장 높은 형태는 새로운 질서와 정부를 인정하고 받아들이는 데서 나옵니다."
 TAJ_orionbank: "오리엔방크"
 TAJ_orionbank_desc: "1925년에 설립된 오리엔방크는 타지키스탄에서 가장 오래된 은행이며 우리 나라 경제의 중요한 기관 역할을 하고 있습니다."
 TAJ_isik: "IS-KP"
 TAJ_isik_desc: "호라산 주 이슬람 국가라고도 알려진 IS-KP는 우리 정부와 지역 내 다른 정부들에 맞선 투쟁을 시작했으며, 우리 국가와 그들이 '이교도'와 '이단'으로 간주하는 이들을 전복하겠다고 맹세했습니다.\n§W------------------§!\n우리의 §H테러 위협§!을 §G무시 가능§! 수준으로, §H급진화§!를 §G낮음§! 수준으로 낮추면 이 국가 정신은 §R제거§!됩니다.\n§W------------------§!\n이 국가 정신이 활성화되어 있는 동안, §H살라피주의 이념§!이 25%를 넘고 우리의 §H안정도§!가 40% 미만이면 §RIS-KP§!가 §R내전§!을 일으킵니다."
 TAJ_temp_negotiations: "진행 중인 협상"
 TAJ_temp_negotiations_desc: "우리는 바다흐샨 주민들에게 더 큰 자치권을 부여하기 위해 협상을 시작했습니다.\n§W------------------§!\n[BDA.GetFlag] §H고르노바다흐샨 정부§!와의 협상을 마치면 이 국가 정신은 §R제거§!됩니다."
 TAJ_rahmons_rotten_fruit: "타지키스탄의 썩은 열매"
 TAJ_rahmons_rotten_fruit_desc: "부패는 [TAJ.GetFlag] 타지크 사회에서 흔한 일이며, [TAJ.GetFlag] 타지크 국민은 정부의 불공정하고 족벌주의적인 대우에 낯설지 않습니다. 이 부패는 국가의 잠재력을 서서히 갉아먹고 있으며, 젊은 국가를 괴롭히는 두뇌 유출의 원인이기도 합니다.\n§W------------------§!\n우리가 §H국가 중점§!의 §H입장 변화§! 분기를 따르면 이 국가 정신은 §R제거§!될 수 있습니다.\n§W------------------§!\n우리가 §H황금 가면§! 중점을 선택하면 이 국가 정신은 §R제거§!할 수 없게 됩니다."
 TAJ_rahmons_ripe_fruits: "타지키스탄의 잘 익은 열매"
 TAJ_rahmons_ripe_fruits_desc: "타지키스탄은 국민을 위해 봉사할 자격이 있음을 스스로 입증했으며, 앞으로도 오랫동안 그렇게 할 것입니다."
