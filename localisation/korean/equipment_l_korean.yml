 artillery_5: "ART 2045"
 artillery_5_desc: "With its powerful indirect fire abilities, Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew. Since it requires external vehicles for its movement, it can be difficult to move around in between strikes, making it vulnerable against enemy artillery counter-strikes. Lightweight lower calibre systems can be dragged around manually, and are suitable for airborne operations as they can fit inside transport planes."
 SP_arty_5: "SP ART 2045"
 SP_arty_5_desc: "With its powerful indirect fire abilities, Self-Propelled Artillery provides sustained precision strikes where it's needed on the battlefield, and far beyond visual ranges. It can be reloaded directly by its crew, and its self-propulsion makes it mobile so they can move to avoid counter-strikes by enemy artillery."
 SP_R_arty_5: "MLRS 2045"
 SP_R_arty_5_desc: "Self-Propelled Multiple Rocket Launchers can fire fast volleys of Rockets that blanket an entire large area. They are often employed against enemy staging areas. Due to the mass devastation they cause, they have a longer minimum engagement range than regular artillery. They also have lower accuracy, and are thus unsuited for precision strikes. They require dedicated support vehicles to reload."
