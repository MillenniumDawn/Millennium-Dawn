 CHI_semiconductor_backwardness_1: "기술 의존"
 CHI_semiconductor_backwardness_1_desc: "중국의 반도체 산업은 여전히 외국 파운드리, 설계 소프트웨어, 제조 장비에 구조적으로 의존하고 있습니다. 국내 팹은 최첨단보다 두세 세대 뒤처져 있고, 설계 기업들은 성숙한 EDA 툴체인을 갖추지 못했으며, 첨단 리소그래피를 공급할 수 있는 국내 장비 기업도 없습니다. 이 격차는 국내 칩 공장 건설과 파운드리 생산을 저해하며, 민간 전자제품과 군용 전자장비 공급망 모두를 제약합니다.\n§W--------------§!\n이 국가 정신은 §Y$CHI_naura_amec$§! 중점을 완료하면 §G개선§!됩니다."
