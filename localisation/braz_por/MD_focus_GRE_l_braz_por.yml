l_braz_por:
 greece_focus: "Árvore de Foco Grega"
 earthquake_diplomacy: "Diplomacia do Terremoto"
 airspace_violations: "Violações de Espaço Aéreo"
 GRE_debt_crisis: "Crise da Dívida"
 GRE_debt_crisis_desc: "A Grécia tem 300 bilhões de dólares em dívida externa - uma das maiores do mundo. Isso criou um problema enorme para nós, pois a dívida está aumentando rapidamente e criando problemas enormes para nossa economia. Teremos que encontrar uma maneira de resolver o problema da dívida antes que saia do controle."
 GRE_constitutional_crisis: "Crise Constitucional"
 GRE_constitutional_crisis_desc: "The old constitution was written for a very different Greece. Its checks and balances are now getting in the way of the reforms the country needs. Rewriting it is risky, but half-measures have already failed us."
 GRE_drift_modifiers: "Parliament of the Hellenes"
 GRE_debt_modifier: "A Crise da Dívida"
 GRE_debt_modifier_desc: "A crise da dívida tem efeitos mais severos dependendo de como gerenciamos nosso dinheiro. No entanto, gastar mais para criar empregos nos beneficiará a longo prazo."
 GRE_press_opposition: "Oposição da Mídia"
 GRE_press_opposition_desc: "A mídia não nos retratou da melhor forma desde que restauramos a ordem ao governo, mas é apenas lógico que os fracos devem temer os fortes."
 GRE_one_party: "Estado de Partido Único"
 GRE_one_party_desc: "Após declarar que o KKE é o único partido político permitido na Grécia, temos o poder de fazer o que quisermos, mas ao custo de derramamento de sangue para garantir que nosso povo seja submisso."
 GRE_reorganize_army_idea: "Reorganizando o Exército"
 GRE_reorganize_army_idea_desc: "Não podemos simplesmente desfinanciar o exército até o ponto de disfunção. Pode chegar o momento em que precisaremos de forças armadas poderosas, e para essa eventualidade garantiremos que nosso exército seja leal e esteja pronto."
 GRE_cracked_foundation_desc: "A fundação do estado foi contraditada tantas vezes neste ponto que se continuarmos pelo caminho atual, poderemos enfrentar uma terrível nova revolução. \n\n§RSe nossa estabilidade cair abaixo de 30%, enfrentaremos uma revolução na Grécia!§!"
 GRE_militarist_education_idea: "Educação Militarista"
 GRE_militarist_education_idea_desc: "O sistema educacional incutiu valores militares em seu currículo, permitindo um maior estado de prontidão em caso de ataques repentinos."
 GRE_elam: "Ressurgimento da Frente Popular Nacional"
 GRE_elam_desc: "ELAM, the National Popular Front in Cyprus, has emerged as a proxy for our ideology across the island. Directing funding and political support to Nicosia strengthens our hand in any future reunification process without requiring direct intervention."
 GRE_rename_istanbul: "Renomear Istambul"
 GRE_austerity_tension1: "Negligenciável"
 GRE_austerity_tension2: "Major"
 GRE_austerity_tension3: "Civil Uprisings!"
 GRE_CYP_category: "A Disputa de Chipre"
 GRE_CYP_category_desc: "Desde 1974, Chipre está dividido entre a República Turca do Norte de Chipre e a República de Chipre, após um golpe apoiado pela Grécia que quase uniu a ilha à Grécia. Em resposta, a Turquia invadiu, resultando na atual partição de Chipre, a segunda mais longa ocupação militar da era moderna, superada apenas pela de Israel.\n\n§YForça Cipriota-Grega:§! §C[?145.GRE_SUPPORT]%§!\n§YForça Cipriota-Turca:§! §C[?146.GRE_SUPPORT]%§!\n\n§CO primeiro lado a atingir 100 de força unificará Chipre sob seu domínio!§!"
 GRE_guarantee_turkish_property: "Garantir Direitos de Propriedade Turca"
 GRE_guarantee_turkish_property_desc: "By creating the desire for unity, we will create chaos all across Cyprus, giving us the opportunity to grow our own strength while the Turks are busy dealing with the protests."
 GRE_please_south: "Agradar os Cipriotas Gregos"
 GRE_please_north: "Agradar os Cipriotas Turcos"
 TUR_CYP_incite_riot: "Incitar Distúrbios no Norte de Chipre"
 TUR_CYP_propaganda_north: "Propaganda Anti-Grega no Norte"
 TUR_CYP_propaganda_south: "Propaganda Anti-Grega no Sul"
 TUR_attack_CYP_strength: "Ataque Força Greco-Cipriota"
 GRE_attack_turkish_strength: "Ataque Força Turco-Cipriota"
 GRE_south_50_TT: "§HA força Greco-Cipriota estará em 55§!"
 GRE_north_50_TT: "§HA força Turco-Cipriota estará em 45§!"
 TUR_unify_cyp: "§GSul de Chipre se unificará ao Norte de Chipre!§!"
 GRE_unify_cyp: "§GO Norte de Chipre e Sul de Chipre se unificarão à Grécia!§!"
 TUR_unify_cyprus: "Unificar Chipre"
 GRE_unify_cyprus: "Unificar Chipre"
 GRE_failures_capitalism_TT: "§RO efeito do foco escala de acordo com a extensão da crise da dívida.§!"
 GRE_communist_takeover_TT: "§GO povo grego exige eleições!§!\n\nCertifique-se de ter Poder Político suficiente guardado para isso. Se você §Rfalhar§! em eleger e formar um governo, §Rprecisará realizar outra eleição extraordinária§! para fortalecer §Y[communist_state_L]§!"
 GRE_fascist_takeover_TT: "§GO povo grego exige eleições!§!\n\nGaranta que você tenha Poder Político suficiente para isso. Se você §Rfalhar§! em eleger e formar um governo, precisará §Rrealizar outra eleição extraordinária§! para empoderar §Y[Nacionalismo_Fascista_L]§!"
 GRE_civil_units_TT: "§RE é sugerido que realoquemos nosso exército para as fronteiras do estado da Grécia Central, onde podemos tentar conter os rebeldes.§!"
 GRE_worsen_debt_TT: "§RPiora a crise da dívida!§!"
 GRE_lowers_debt_TT: "§GAmeniza a crise da dívida!§!"
 GRE_end_austerity_TT: "§GEncerra os protestos de austeridade!§!"
 GRE_increase_drift_TT: "§GAumenta o desvio político para esse partido!§!"
 GRE_process_sco_member_tt: "§YInicia o processo de integração na SCO.§!"
 GRE_enemy_blocked_us: "§RSe essas decisões não estiverem disponíveis, significa que o inimigo nos bloqueou temporariamente de ganhar força ou que não cumprimos outros requisitos!§!(Dias bloqueados: [?TUR_greece_blocked_us:days_left|R0])"
 GRE_unable_to_gain_strength: "Os §HCipriotas-Gregos§! ficarão §GIMPOSSIBILITADOS§! de ganhar força por §H100 dias§!"
 TUR_unable_to_gain_strength: "Os §HCipriotas-Turcos§! ficarão §GIMPOSSIBILITADOS§! de ganhar força por §H100 dias§!"
 GRE_south_-5_TT: "§HOs Greco-Cipriotas§! §RPERDEM§! §H5 de força!§!"
 GRE_north_5_TT: "§HOs Turco-Cipriotas§! §GGANHO§! §H5 de força!§!"
 GRE_south_-20_TT: "§HOs Greco-Cipriotas§! §RPERDEM§! §H20 de força!§!"
 GRE_gain_5_strength: "§HOs Greco-Cipriotas§! §GANHAM§! §H5 de força!§!"
 GRE_gain_20_strength: "§HOs Greco-Cipriotas§! §GANHAM§! §H20 de força!§!"
 TUR_gain_20_strength: "§HOs Turco-Cipriotas§! §GANHAM§! §H20 de força!§!"
 GRE_turks_lose_5_strength: "§HOs Turco-Cipriotas§! §RPERDEM§! §H5 de força!§!"
 GRE_lose_20_gain_20: "§HOs Turco-Cipriotas§! §RPERDEM§! §H20 de força!§!"
 TUR_CYP_incite_riot_TT: "§HOs Turco-Cipriotas§! têm §H50%§! ou mais de força"
 TUR_GRE_support: "§HOs Greco-Cipriotas§! têm §H5%§! ou mais de força."
 TUR_has_100_strength: "§HOs Turco-Cipriotas§! têm §H100%§! de força."
 GRE_has_100_strength: "§HOs Greco-Cipriotas§! têm §H100%§! de força."
 GRE_ICBC: "Pedir emprestado do ICBC"
 GRE_ICBC_desc: "The Industrial and Commercial Bank of China is one of the largest banks in the world. If we shift some of our purchasing power and debts through the Chinese bank we can ensure further cooperation with Beijing and expand our ability to keep our burgeoning economy growing."
 GRE_chi_real_estate: "Investimentos Imobiliários Chineses"
 GRE_chi_real_estate_desc: "Investidores da China começaram a olhar para a compra de imóveis em toda a Grécia, particularmente em Atenas e nas ilhas. Esse influxo de capital estrangeiro pode aliviar a pressão sobre as finanças do governo e atrair mais investimento chinês, aprofundando os laços econômicos entre as duas nações."
 GRE_chi_investments: "Investimentos Chineses"
 GRE_chi_investments_desc: "A China está interessada em projetos extensivos em toda a Grécia. Esses projetos podem dar nova vida a áreas da economia para as quais não temos recursos para melhorar por conta própria."
 GRE_piraeus: "Licitar o Piraeus"
 GRE_piraeus_desc: "Licitar o porto Piraeus foi discutido entre membros do governo e parece que, em meio à crise da dívida, isso aliviará alguma pressão sobre nós."
 GRE_piraeus_corruption: "Contornar a China"
 GRE_piraeus_corruption_desc: "Os planos da China para expandir sua influência na Grécia são perigosos para nossa independência de sua influência. Sob o disfarce do Conselho Arqueológico Central, podemos parar qualquer um dos planos de expansão da China mortos em seus trilhos."
 GRE_chi_investments_piraeus: "Investimentos Chineses em Torno do Piraeus"
 GRE_chi_investments_piraeus_desc: "Os chineses mostraram grande interesse em investir nas áreas ao redor do porto Piraeus. Embora alguns apontem que esse projeto poderia ser perigoso para nossa independência estrangeira, isso é certamente um absurdo."
 GRE_chi_nationwide_investments: "Investimentos Chineses em Todo o País"
 GRE_chi_nationwide_investments_desc: "O ganho ao permitir que a China invista livremente em nossa nação é imenso, devemos permitir que os chineses invistam como desejarem."
 GRE_invest_elliniko: "Investir em Elliniko"
 GRE_invest_elliniko_desc: "Elliniko é uma área suburbana de Atenas que poderia ser considerada negligenciada pelos projetos de revitalização que lançamos em outros lugares. Esta área é especialmente importante, pois é um ponto central para turistas."
 GRE_unemployed: "Os Desempregados"
 GRE_unemployed_desc: "Ao gerenciar cuidadosamente o desemprego, podemos garantir que aqueles que perdem empregos devido à crise da dívida não fiquem sem o dinheiro necessário para manter padrões básicos de vida."
 GRE_glass_cannon_economics: "Glass Cannon Economics"
 GRE_glass_cannon_economics_desc: "Nossa economia e nossos cidadãos estão vendo os benefícios de uma economia saudável. À medida que gastam seu dinheiro, isso ajuda nosso país a crescer.\n\nIsso, desde que nada §Rinfeliz§! aconteça à economia."
 GRE_strength: "The Pillars of Recovery"
 GRE_strength_desc: "For all that the debt crisis dominates the headlines, Greece is far from bankrupt of assets. The largest merchant fleet on earth, a pharmaceutical sector second only to refining among our exports, tourism to rival any in the Mediterranean, and produce found on tables worldwide are real and durable foundations. Backing these industries with targeted policy, rather than blanket austerity dictated from abroad, is how a recovery is built to last."
 GRE_pharma: "The Generics Powerhouse"
 GRE_pharma_desc: "A Grécia se destaca muito acima do seu peso na medicina, com suas fábricas produzindo genéricos e medicamentos de marca para empresas como Vianex e Elpen, que ficam atrás apenas das refinarias entre nossas exportações. Como esses comprimidos e frascos são vendidos em mercados da Europa e do Golfo, o setor gera divisas mesmo com a economia cambaleando internamente. Maior investimento em pesquisa e linhas de produção fortaleceria um dos nossos poucos setores verdadeiramente de classe mundial."
 GRE_construction_mat: "Materiais de Construção"
 GRE_construction_mat_desc: "Marble from Penteli, limestone from the islands, aggregate from Thrace. Redirecting domestic construction materials from export markets into our own infrastructure projects cuts costs and keeps money at home."
 GRE_austerity: "Campanhas de Austeridade"
 GRE_austerity_desc: "O déficit do governo é inevitável e, se não agirmos logo, a economia entrará em um estado ainda pior do que está agora. §RIsso causará tumultos em todo nosso país§!, mas se contivermos a agitação, talvez possamos retomar o controle de nossa situação financeira."
 GRE_turn_century: "Virada do Século"
 GRE_turn_century_desc: "À medida que nosso caminho neste novo mundo chega a um novo milênio, muitas coisas são incertas, política e economia em questão. Cabe a nós guiar nossa nação nesta nova era."
 GRE_golden_dawn: "Alvorecer Dourado"
 GRE_golden_dawn_desc: "O partido de extrema-direita Alvorada Dourada é um partido político baseado nos ideais de nacionalismo e tem simpatias por movimentos nacionalistas em toda a Europa. Muitos criticaram a Alvorada Dourada por ser uma organização neo-nazista e criminosa, mas essas pessoas são mentirosas. A Alvorada Dourada é o único caminho para a Grécia avançar, e devemos garantir que ela assuma a liderança da nação."
 GRE_subtle_propaganda_campaigns: "Campanhas de Propaganda Sutil"
 GRE_subtle_propaganda_campaigns_desc: "As pessoas devem aprender a verdade sobre o que a Alvorada Dourada deseja alcançar e como os democratas destruíram este país, mergulhando-o no caos."
 GRE_open_youth_front: "Abrir a Frente da Juventude"
 GRE_open_youth_front_desc: "The Golden Dawn Youth gives young Greeks discipline, nationalist education, and a sense of purpose the democratic parties have abandoned. Youth support is the foundation of any lasting movement, and a generation raised in our values will not trade them away."
 GRE_influence_police: "Influenciar a Polícia"
 GRE_influence_police_desc: "Se conseguirmos ganhar o apoio da polícia, obteremos mais apoio do público, além de lidar mais facilmente com traidores políticos."
 GRE_committee_national_memory: "Comitê da Memória Nacional"
 GRE_committee_national_memory_desc: "Devemos honrar grandes heróis nacionalistas que lutaram e morreram por nossa nação, lembrando o povo de seus princípios, para que todos nós possamos nos unir sob um único objetivo."
 GRE_form_golden_dawn_death_legions: "Formar as Legiões da Morte da Alvorada Dourada"
 GRE_form_golden_dawn_death_legions_desc: "As legiões da morte da Alvorada Dourada serão nossa principal unidade paramilitar. Elas serão encarregadas de limpar as ruas de traidores, além de manter a ordem e defender o país contra inimigos quando necessário."
 GRE_glorify_regime_of_colonels: "Glorificar o Regime dos Coronéis"
 GRE_glorify_regime_of_colonels_desc: "De 1967 a 1974, a Grécia foi governada pela Junta Grega, mais conhecida como o 'Regime dos Coronéis'. Sob os Coronéis, a Grécia experimentava um rápido crescimento econômico, além de estabilidade interna e um grande exército que protegia o país. Portanto, devemos lembrar o povo das conquistas dos Coronéis."
 GRE_golden_greece: "Exigir Eleições Imediatas"
 GRE_golden_greece_desc: "Chegou a hora de liderar este país depois de termos reunido o apoio da maioria do povo. Devemos exigir eleições do governo corrupto para mostrar quem realmente deveria estar no comando."
 GRE_fund_elam: "Financiamento Extensivo para ELAM"
 GRE_fund_elam_desc: "ELAM, ou o Frente Popular Nacional, é o partido irmão da Alvorada Dourada em Chipre. Ao fornecer a ele mais fundos do que jamais sonhou, podemos, no mínimo, garantir que sejamos populares entre os cipriotas gregos."
 GRE_revive_megali_idea: "Reviver a Megali Idea"
 GRE_revive_megali_idea_desc: "A Megali Idea foi o conceito de uma grande nação grega consistindo de territórios gregos anteriores, como o Epiro Setentrional e áreas costeiras da Turquia. É nosso destino reviver a Megali Idea e orgulhar nossos ancestrais."
 GRE_censor_media: "Censurar a Mídia"
 GRE_censor_media_desc: "A mídia, antes de tomarmos o poder, eram mentirosos e traidores ao veicular propaganda pró-democrata. Agora que estamos no poder, substituiremos as mentiras democratas por nossa própria mídia controlada pelo estado, que publicará apenas a verdade."
 GRE_one_religion: "Uma Religião"
 GRE_one_religion_desc: "Orthodox Christianity is our state religion and an important part of our heritage. We must by all means put a greater focus on our religion."
 GRE_oppress_political_opposition: "Oprimir a Oposição Política"
 GRE_oppress_political_opposition_desc: "Devemos erradicar os traidores que venderam nosso país, assim como qualquer um que seja anti-grego. A Alvorada Dourada limpará a Grécia de sua quinta coluna."
 GRE_army_first: "Políticas do Exército em Primeiro Lugar"
 GRE_army_first_desc: "Ao adotar políticas que priorizam nosso exército e sua expansão, podemos garantir que, mesmo sem o apoio do grego médio, ainda manteremos o controle. Claro que isso nunca acontecerá."
 GRE_economic_control: "Controle Econômico"
 GRE_economic_control_desc: "Os governos anteriores garantiram a destruição da economia ao aumentar vertiginosamente a dívida da Grécia. Para evitar isso novamente, devemos aumentar nosso controle direto sobre a economia."
 GRE_anti_migrant_policies: "Políticas Anti-Migrantes"
 GRE_anti_migrant_policies_desc: "Os imigrantes retiram recursos que poderiam ser melhor utilizados por um grego. Não podemos permitir que continuem essa degradação da Mãe Grécia."
 GRE_metaxism: "Metaxismo"
 GRE_metaxism_desc: "We take great influence from the regime of Metaxas, particularly the policies he endorsed: corporatism, benefits for the working class, and the primacy of the Greek nation. The only thing we must suppress is the anti-imperialist sentiment Metaxas held."
 GRE_depart_ecomomic_migrants: "Partida de Migrantes Econômicos"
 GRE_depart_ecomomic_migrants_desc: "Agora que começamos a promulgar leis anti-imigrantes, devemos começar a deportar migrantes econômicos de volta para seus países."
 GRE_metaxas_policies: "Políticas Metaxistas"
 GRE_metaxas_policies_desc: "Ioannis Metaxas, que assumiu o poder como resultado do golpe de 4 de agosto de 1936, é uma grande inspiração para a Alvorada Dourada. Ele foi um dos maiores líderes que a Grécia já teve, pois levou o povo grego à glória e resistiu às potências do Eixo na Segunda Guerra Mundial. Devemos revisitar suas políticas para honrá-lo."
 GRE_dissolve_plutocracy: "Dissolver a Plutocracia"
 GRE_dissolve_plutocracy_desc: "Por tempo demais nossa economia foi explorada pelos regimes democráticos e estrangeiros. Agora é hora de destruir esse sistema de uma vez por todas."
 GRE_increase_agricultural_production: "Aumentar a Produção Agrícola"
 GRE_increase_agricultural_production_desc: "A agricultura tem sido há muito tempo o setor maior e mais bem-sucedido na Grécia. Devemos fortalecê-la ainda mais investindo no setor agrícola."
 GRE_exploit_and_export: "Explorar e Exportar"
 GRE_exploit_and_export_desc: "Nosso país está repleto de recursos naturais inexplorados, e devemos agir rapidamente para extraí-los para o país."
 GRE_revise_national_debt: "Rever a Dívida Nacional"
 GRE_revise_national_debt_desc: "Os democratas conseguiram aumentar a dívida grega para 300 bilhões de dólares. Isso está causando problemas para a economia. Portanto, é necessário negociar, para que possamos nos livrar dessa dívida enorme."
 GRE_nationalize_resources: "Nacionalizar Recursos"
 GRE_nationalize_resources_desc: "Atualmente, muitas empresas estrangeiras detêm recursos naturais em nosso país. Isso é inaceitável. Tomaremos todos os ativos estrangeiros dentro da Grécia."
 GRE_trade_agreements: "Acordos Comerciais"
 GRE_trade_agreements_desc: "O poder comercial grego é muito baixo, pois não somos competitivos o suficiente no mundo moderno. Vamos promulgar acordos comerciais, para que possamos exportar nossos produtos para mais países."
 GRE_nationalize_banks: "Nacionalizar Bancos"
 GRE_nationalize_banks_desc: "Como parte de nosso esquema de controle econômico, os bancos devem ser nacionalizados pelo estado, pois detêm ativos valiosos para nós explorarmos."
 GRE_force_germany_to_pay_debt_taken_from_occupation: "Forçar o Pagamento das Dívidas da Ocupação Alemã"
 GRE_force_germany_to_pay_debt_taken_from_occupation_desc: "A ocupação alemã da Grécia durante a Segunda Guerra Mundial foi muito brutal, pois os alemães destruíram uma grande parte da Grécia e nos devem 300 bilhões de dólares em reparações que nunca foram pagas, e hoje iremos lembrá-los."
 GRE_russia: "Comércio com a Rússia"
 GRE_russia_desc: "Russia is a historic ally as we are both Orthodox christian countries, and has helped us many times throughout history, so we must increase trade relations with the Russians."
 GRE_china: "Comércio com a China"
 GRE_china_desc: "Apesar das diferenças ideológicas, a China apoia regimes nacionalistas como o nosso, é uma potência comercial mundial e devemos aumentar os laços econômicos com eles."
 GRE_iran: "Comércio com o Irã"
 GRE_iran_desc: "Mesmo que o Irã não tenha muito em comum com nossa nação, compartilhamos muitos objetivos semelhantes e devemos cultivar a cooperação entre nós."
 GRE_of_continents_seas: "A Greece of Two Continents and Five Seas"
 GRE_of_continents_seas_desc: "The Megali Idea envisions a Greece spanning two continents and five seas: the Aegean, the Ionian, the Mediterranean, the Black Sea, and the Sea of Marmara. Our navy must be rebuilt into a force worthy of that ambition, capable of projecting power across every water that was once Greek."
 GRE_resolve_naming_dispute: "Resolve the Naming Dispute"
 GRE_resolve_naming_dispute_desc: "A disputa de nomenclatura da Macedônia é uma questão tão trivial, que simplesmente resolvemos anexando a Macedônia do Norte."
 GRE_strike_albania: "Atacar a Albânia"
 GRE_strike_albania_desc: "The Greek minority of Northern Epirus has endured Albanian rule since 1913. Their language suppressed, their churches closed, their property seized. A century of diplomatic complaints has achieved nothing. We settle the matter ourselves."
 GRE_strike_bulgaria: "Atacar a Bulgária"
 GRE_strike_bulgaria_desc: "Byzantine missionaries developed the first literary language of the Slavic people, the alphabet that would become Bulgarian. The Slavic peoples of Thrace and Macedonia were integrated into Hellenic civilization long before any Bulgarian state existed. This campaign is less a war than a homecoming."
 GRE_greater_greece: "Grécia Maior"
 GRE_greater_greece_desc: "A Grécia foi o centro de muitas das mais poderosas nações da história, desonraríamos tal legado ao não continuá-lo."
 GRE_great_greece: "Grande Grécia"
 GRE_great_greece_desc: "Não seguiremos o caminho beligerante que leva à queda dos maiores impérios da história."
 GRE_agriculture_focus: "Foco na Agricultura"
 GRE_agriculture_focus_desc: "A agricultura é um dos elementos mais fortes da economia grega, pois fornecemos uma grande porção de produtos como azeite de oliva. Precisamos investir mais dinheiro na agricultura, para que possamos exportar totalmente nossos produtos para o resto do mundo."
 GRE_greater_state_control: "Maior Controle Econômico Estatal"
 GRE_greater_state_control_desc: "The free market has failed Greece. Capital fled when it was needed most, private banks withheld credit to protect shareholder returns, and foreign owners extracted profit during a national emergency. Direct state control of strategic industries puts economic decisions back where they belong."
 GRE_kke: "KKE"
 GRE_kke_desc: "KKE (Partido Comunista da Grécia) é um partido de extrema esquerda baseado nas ideias do Marxismo-Leninismo e é fortemente contrário ao imperialismo estrangeiro. Quer eliminar a desigualdade e garantir os direitos dos trabalhadores, comprometendo-se a criar uma sociedade socialista verdadeira. Devemos todos nos unir em prol da KKE para guiar nossa nação adiante!"
 GRE_communist_education: "Educação Comunista"
 GRE_communist_education_desc: "As mentes jovens são as mais influenciáveis. Inculcar os valores básicos do comunismo na geração mais jovem, enquanto ensina aos alunos universitários a glória da igualdade, pode avançar grandemente nossa causa."
 GRE_labour_focus_unions: "Contatar os Sindicatos Trabalhistas"
 GRE_labour_focus_unions_desc: "Os sindicatos trabalhistas ficarão muito felizes em ter um governo disposto não apenas a cooperar, mas a ceder às suas demandas. Vamos garantir que sua influência não se estenda além de nossa ascensão ao poder para evitar §RConflitos de interesse.§!"
 GRE_failures_capitalism: "Falhas do Capitalismo"
 GRE_failures_capitalism_desc: "O capitalismo já não nos abençoa com a riqueza infinita que prometeu. É hora de seguirmos nosso próprio caminho para garantir que tal crise nunca mais aconteça! §RO efeito deste foco aumenta com a extensão da crise da dívida.§!"
 GRE_working_class: "A Classe Trabalhadora"
 GRE_working_class_desc: "A classe trabalhadora - onde os sonhos nascem e morrem. Podemos prometer a eles que serão tratados bem e receberão o crédito que merecem por serem a base do novo estado comunista."
 GRE_communist_propaganda: "Máquina de Propaganda"
 GRE_communist_propaganda_desc: "Devido à nossa influência crescente, podemos custear a liberação da máquina de propaganda sobre a Grécia. Embora o custo seja alto, essa propaganda não deve ser desprezada, será extremamente eficaz na conversão da população grega."
 GRE_prepare_government: "Preparar um Governo"
 GRE_prepare_government_desc: "Ao estabelecer um governo dentro de nosso partido político, garantimos uma transição eficaz que nos permite agir mais rapidamente do que nossos rivais podem se organizar. Isso será custoso, mas considerando nossas chances de vencer, é uma aposta bem feita."
 GRE_damn_market: "Maldito Livre Mercado"
 GRE_damn_market_desc: "Estamos em posição de dar o golpe final nos capitalistas. Com o poder da propaganda do nosso lado, podemos dar o golpe mortal na economia de livre mercado e, no processo, usurpar o trono do excesso em que os capitalistas se sentam!"
 GRE_election_com: "Exigir Eleições Imediatas"
 GRE_election_com_desc: "Camaradas, o momento é agora! Toda nossa construção para um novo estado livre nos levou a este momento!\n\n§RVamos garantir que o governo do povo reine por mais 1000 anos!§!"
 GRE_com_democratic: "Comunismo Democrático"
 GRE_com_democratic_desc: "A forma mais verdadeira de comunismo é aquela que permite ao trabalhador médio eleger seu líder para o governo, negar-lhes esse direito é uma traição à natureza comunista."
 GRE_com_authoritarian: "Comunismo Autoritário"
 GRE_com_authoritarian_desc: "As pessoas são facilmente enganadas por mentiras e promessas arbitrárias que nem as afetariam mesmo que fossem cumpridas. É simplesmente muito arriscado deixar um público tão facilmente manipulado decidir o futuro da Grécia, é muito perigoso."
 GRE_handle_bankers: "Lidar com os Banqueiros"
 GRE_handle_bankers_desc: "Capitalistas não têm lugar em um estado comunista. Devemos redistribuir imediatamente sua riqueza mal adquirida."
 GRE_com_constitutionalism: "Constitucionalismo Comunista"
 GRE_com_constitutionalism_desc: "Elaboraremos uma nova constituição para garantir que ninguém jamais perturbe o direito do povo de votar, entre outras coisas. Isso significará que o chefe de estado terá menos poder."
 GRE_government_purge: "Purga Governamental"
 GRE_government_purge_desc: "Tomaremos conta do governo inteiramente e nos estabeleceremos como o único partido permitido a governar a Grécia. Os fascistas espreitam por toda parte e trabalham para desmoronar a utopia que lutamos para criar!"
 GRE_curtail_corruption: "Restringir a Corrupção"
 GRE_curtail_corruption_desc: "Nossa ascensão ao poder criou um vácuo de poder que as pessoas estão muito dispostas a preencher. Devemos garantir que nosso governo permaneça puro e dedicado ao povo."
 GRE_promote_local: "Promover Negócios Locais"
 GRE_promote_local_desc: "Os estados comunistas modernos infelizmente precisam incorporar conceitos capitalistas no estado para garantir sua sobrevivência. Os negócios locais são a espinha dorsal da economia e, para realizarmos nossos sonhos, devemos fortalecer essa espinha dorsal."
 GRE_investment_effort: "Investimentos em Infraestrutura"
 GRE_investment_effort_desc: "Roads, rail, and power lines are the skeleton of a productive economy. Years of underinvestment have left whole regions isolated from national markets. State-directed infrastructure spending fills gaps the private sector never would."
 GRE_subsidize_farmers: "Subsidiar os Agricultores"
 GRE_subsidize_farmers_desc: "Greek farmers have been squeezed for years by EU import quotas, mounting debt, and foreign competition they cannot match on price. Direct subsidies for seeds, equipment, and rural credit give them breathing room to modernise and keep their land productive."
 GRE_abandon_army: "Abandonar o Exército"
 GRE_abandon_army_desc: "O exército é atualmente um fardo para o estado. As chances de tal força ser utilizada são baixas, logo, é lógico começar a reestruturar e reduzir o exército conforme necessário."
 GRE_reorganize_army: "Reorganizar o Exército"
 GRE_reorganize_army_desc: "The old officer corps owes its rank to the previous government. We need to root out those loyalties and rebuild the command structure around men who answer to the party, not to a dead constitution."
 GRE_silence_press: "Silenciar a Imprensa"
 GRE_silence_press_desc: "Somos libertadores, não tiranos. Se a mídia está tão doutrinada a ponto de não perceber isso, então devemos tomar medidas em nossas próprias mãos."
 GRE_extend_education: "Expandir a Educação"
 GRE_extend_education_desc: "Nosso povo merece apenas o melhor em educação para garantir que tenhamos uma reserva de pessoas bem-educadas para assumir empregos mais avançados."
 GRE_com_resources: "Exploração de Recursos Naturais"
 GRE_com_resources_desc: "With infrastructure in place, state enterprises can now extract and process natural resources at scale. Mines, quarries, and energy deposits that once generated profit for private shareholders will now fund public welfare."
 GRE_farmer_tax: "Redução de Impostos para Agricultores"
 GRE_farmer_tax_desc: "Devemos conceder isenções fiscais aos nossos agricultores, não apenas para incentivar mais pessoas a ingressar na profissão, mas também para garantir que obtenham um lucro maior, permitindo-lhes expandir seu crescimento com métodos de produção mais eficientes e até mais terras."
 GRE_new_army: "Um Novo Exército"
 GRE_new_army_desc: "Reformamos nosso exército ao ponto de ter sido substituído pela força policial em termos de segurança interna. No entanto, como podemos projetar influência sem uma verdadeira força armada para respaldar nossas palavras? Mesmo que não seja usada, deveríamos começar a construir um novo exército para se adequar à nova Grécia."
 GRE_red_army: "Um Exército Vermelho"
 GRE_red_army_desc: "Garantiremos que o espírito comunista esteja presente profundamente nas fileiras do novo Exército Vermelho. Esse fanatismo ideológico será uma vantagem para nós, pois cria um exército leal ao estado, e um exército que lutará até o fim para preservar o socialismo na Grécia."
 GRE_pacify_unions: "Pacificar os Sindicatos"
 GRE_pacify_unions_desc: "Nós empoderamos os sindicatos a um ponto em que eles estão perturbando o estado em vários níveis por coisas cada vez mais triviais. Enquanto nosso partido é dedicado ao povo, o povo precisa de uma economia que funcione para encontrar trabalho, e então devemos pedir aos sindicatos que desistam antes que tenhamos que impedi-los de interferir legalmente."
 GRE_purge_unions: "Purgar os Sindicatos"
 GRE_purge_unions_desc: "Os sindicatos demonstraram uma incapacidade de mostrar restrição ou lealdade; nossa cortesia só se estende até certo ponto."
 GRE_militarist_education: "Educação Militarista"
 GRE_militarist_education_desc: "Ao introduzir a educação militar em nosso currículo, podemos garantir que a população em geral possa estar apta para o recrutamento em caso de circunstâncias extremas."
 GRE_balkan_diplomacy: "Diplomacia Balcânica"
 GRE_balkan_diplomacy_desc: "É hora de realizar nossas verdadeiras ambições. A Grécia prosperou sob o comunismo e, embora não sejamos vistos como eslavos, ainda seguimos a religião ortodoxa e estamos localizados nos Bálcãs. Talvez nossa neutralidade cultural garanta a estabilidade de um estado como: \n\nUm estado Grécia-eslavo."
 GRE_balkan_hegemony: "Hegemonia Balcânica"
 GRE_balkan_hegemony_desc: "As últimas duas tentativas desse estado falharam. No entanto, a unificação sempre foi tentada de forma diplomática em vez de pela força. Se você nunca teve força suficiente para conquistar os outros estados balcânicos, por que se incomodar em tentar mantê-los juntos? Não duvidamos que podemos manter tal estado via diplomacia interna; no entanto, é simplesmente uma questão de superar o conflito inevitável primeiro."
 GRE_constitution: "The Constitution"
 GRE_constitution_desc: "A Constituição é a última coisa com a qual precisamos lidar antes de finalmente nos consolidarmos no poder e reconstruirmos a Grécia da maneira como a imaginamos."
 GRE_european_communists: "Comunistas Europeus"
 GRE_european_communists_desc: "O comunismo deixou uma marca nos Bálcãs, desde o fim da URSS e o colapso do Bloco Comunista. Talvez, com poder e intriga suficientes, possamos reacender a tocha deixada por nossos camaradas. Tudo o que precisamos é de uma faísca para acender o fogo."
 GRE_bulgaria: "Levar a Revolução à Bulgária"
 GRE_bulgaria_desc: "A Bulgária, uma vez uma nação comunista próspera, perdeu seu rumo após o colapso da URSS. Dar-lhes outra nação para se espelhar e seguir deve permitir que o comunismo se estabeleça mais uma vez."
 GRE_albania: "Levar a Revolução à Albânia"
 GRE_albania_desc: "A Albânia é uma nação que enfrentou muitas dificuldades. Dar-lhes proteção e assistência no desenvolvimento econômico é suficiente para ganhar os corações e mentes do povo albanês, respeitando ao mesmo tempo sua soberania até certo ponto."
 GRE_macedonia: "Levar a Revolução à Macedônia"
 GRE_macedonia_desc: "A Macedônia já fez parte da Iugoslávia, desfrutando do mesmo comunismo que a Sérvia; no entanto, após o rompimento da Iugoslávia e 'ideias culturais equivocadas', abandonaram o caminho do comunismo. Esclarecer esses equívocos permitirá que a população apoie novamente um governo socialista."
 GRE_serbia: "Levar a Revolução à Sérvia"
 GRE_serbia_desc: "A Sérvia já foi o centro da Iugoslávia durante o governo comunista. Embora os sérvios tenham adotado uma ideologia de nacionalismo, alguns ainda abrigam simpatias comunistas, e o país é um alvo perfeito para expandir a revolução."
 GRE_romania: "Levar a Revolução à Romênia"
 GRE_romania_desc: "A Romênia é rica em recursos e poder militar. Espalhar a revolução para eles certamente mostrará ao mundo que o comunismo se reestabeleceu nos Bálcãs."
 GRE_dictatorship: "O Ditador Começa"
 GRE_dictatorship_desc: "Com nossos inimigos derrotados, finalmente podemos começar a administrar a nação da maneira como sempre deveria ter sido."
 GRE_cypriot_question: "A Questão Cipriota"
 GRE_cypriot_question_desc: "As tensões atingiram um ponto de ebulição, devemos agir agora. §REsse caminho nos levará à guerra com a Turquia e seus aliados§!; no entanto, se conseguirmos controlar Chipre dentro de 30 dias enquanto mantivermos a maior parte de nosso território central, talvez possamos assinar um tratado de paz."
 GRE_turkish_trade: "Comércio com a Turquia"
 GRE_turkish_trade_desc: "Uma das melhores maneiras de promover boas relações entre duas nações é cooperar economicamente uma com a outra. Ao promover o comércio com a Turquia, ambas as nações se beneficiarão sem custo algum."
 GRE_settle_eez_dispute: "Resolver a Disputa da ZEE"
 GRE_settle_eez_dispute_desc: "The EEZ dispute between Greece and Turkey has dragged on with no benefit to either side. If we promote free trade across both zones and agree on an equitable resource-sharing framework, we can set this conflict to rest and redirect that energy toward cooperation."
 GRE_increased_privatization: "Aumento das Privatizações"
 GRE_increased_privatization_desc: "Aumentar a privatização do setor industrial grego poderia ser benéfico para fortalecer nossa indústria, além de criar mais oportunidades de emprego e fortalecer a economia grega como um todo."
 GRE_leadership: "Liderança Eterna"
 GRE_leadership_desc: "Nosso líder, Nikolaos Michaloliakos, conseguiu unir o povo da Grécia e criar a sociedade grega perfeita. Nikolaos Michaloliakos e o partido Aurora Dourada devem governar a Grécia para sempre."
 GRE_new_greece_old_ways: "Nova Grécia, Velhos Caminhos"
 GRE_new_greece_old_ways_desc: "Por décadas fomos governados por governos que mergulharam nosso país no caos. Agora o povo grego exige mudança, para que possamos voltar aos dias em que éramos renomados em todo o mundo."
 GRE_draft_youth_wing: "Convocar a Ala Jovem"
 GRE_draft_youth_wing_desc: "Como atraímos mais apoio dos jovens, devemos organizá-los em paramilitares para que possam defender o país contra os inimigos da revolução."
 GRE_foreign_relations: "Relações Externas"
 GRE_foreign_relations_desc: "The new Greece cannot be isolated. We need partners for trade, security, and legitimacy on the world stage. The question is not whether to engage. It is who to engage with and on what terms."
 GRE_dev_cyp: "Desenvolver Chipre"
 GRE_the_hellenic_republic: "A República Helênica"
 GRE_the_hellenic_republic_desc: "Apesar da turbulência que enfrentamos, não devemos abandonar os ideais da democracia e recorrer à tirania para resolver nossos problemas, pois isso seria uma traição a todos os homens e mulheres na Grécia."
 GRE_discredit_eu: "Desacreditar a União Europeia"
 GRE_discredit_eu_desc: "Para salvaguardar nossos ideais, devemos mostrar ao povo os verdadeiros valores da democracia e denunciar o radicalismo como uma ameaça à liberdade."
 GRE_support_eu: "Apoiar a União Europeia"
 GRE_support_eu_desc: "A União Europeia promove a cooperação entre nações, valores democráticos, denuncia o radicalismo e deseja uma Europa pacífica. A Grécia deve aumentar os laços com a União Europeia."
 GRE_dominant_party_desc: "Como em toda nação democrática, os partidos desempenham um grande papel na política do nosso país e precisaremos escolher sabiamente qual partido guiará nosso país adiante."
 GRE_dominant_party: "O Partido Dominante"
 GRE_new_democracy: "Nova Democracia"
 GRE_new_democracy_desc: "O partido de centro-direita 'Nova Democracia', mostrando competência em todos os seus governos e seus ideais de manter nossas tradições, é o partido mais adequado para liderar a Grécia."
 GRE_socialist_coalition: "SYRIZA"
 GRE_socialist_coalition_desc: "Os principais partidos gregos falharam com o país e o mergulharam em catástrofe econômica, além de dividir nossa sociedade. A Grécia precisa de um novo partido para guiar seu povo adiante, e nos uniremos em torno do partido de esquerda SYRIZA, que está ao lado do povo e é contra as políticas de nossos governos anteriores."
 GRE_economic_liberalism: "Liberalismo Econômico"
 GRE_economic_liberalism_desc: "O liberalismo econômico deve ser nossa prioridade se quisermos fortalecer a economia grega. Ele nos traz aumento no comércio, bem como maior benefício econômico para nossos cidadãos, como oportunidades de emprego."
 GRE_anti_migration_policies: "Políticas Anti-Migração"
 GRE_anti_migration_policies_desc: "Nos últimos anos, a Grécia atraiu um grande número de migrantes. Enquanto nosso governo tolera migrantes que vêm para a Grécia em busca de oportunidades econômicas, são os migrantes ilegais que nos preocupam, pois sua taxa está aumentando lentamente e precisaremos colocar restrições mais pesadas em prática."
 GRE_counter_radicals: "Contra Radicais"
 GRE_counter_radicals_desc: "Partidos radicais na Grécia estão lentamente aumentando em popularidade, e sua principal agenda é destruir a ideologia que nossa nação criou: a democracia. Esses partidos também estão sendo considerados por muitos como organizações criminosas devido a ataques organizados específicos a certos grupos. Se quisermos manter a democracia, precisaremos combater a influência dos partidos radicais."
 GRE_increase_corruption_measures: "Medidas Anti-Corrupção"
 GRE_increase_corruption_measures_desc: "A Grécia há muito tempo tem um problema de corrupção que se estende a todos os setores do governo e isso tem criado problemas para o estado. Se quisermos criar uma administração melhor, precisaremos erradicar a corrupção no governo."
 GRE_increase_industrial_privatization: "Aumentar as Privatizações Industriais"
 GRE_increase_industrial_privatization_desc: "O sistema público grego é um dos maiores setores da Grécia. Isso criou um problema por algum tempo, pois o setor privado grego é relativamente fraco. Há pouca concorrência em comparação com outros países. Se quisermos fazer nossa economia crescer, precisaremos nos afastar do setor público e abraçar o privado."
 GRE_reinforce_justice: "Reforçar o Sistema Judicial"
 GRE_reinforce_justice_desc: "Em muitas áreas de nosso país, o crime é generalizado devido à falta de aplicação da lei adequada. Nosso governo precisará reforçar o sistema judicial para reduzir a taxa de criminalidade na Grécia."
 GRE_begin_changing_education_system: "Reformas no Sistema de Educação"
 GRE_begin_changing_education_system_desc: "O sistema educacional grego está muito atrás do de outros países europeus em termos de escolas, financiamento e oportunidades para aqueles com menos habilidades. Se quisermos ter um sistema educacional moderno, precisaremos implementar reformas radicais e criar um ambiente melhor para nossas crianças."
 GRE_worker_rights: "Direitos dos Trabalhadores"
 GRE_worker_rights_desc: "Como parte de nossas políticas, aumentaremos os direitos dos trabalhadores para reduzir a desigualdade para todos os homens e mulheres trabalhadores na Grécia."
 GRE_question_eu_policies: "Questionar as Políticas da União Europeia"
 GRE_question_eu_policies_desc: "Embora acreditemos que a União Europeia seja benéfica, muitas de suas políticas são inaceitáveis, como o aumento do controle econômico. Enquanto essas políticas existirem, a União Europeia não nos trará benefícios."
 GRE_left_united: "A Esquerda Unida"
 GRE_left_united_desc: "Nosso partido é composto por muitos ramos da esquerda e isso por muitos anos tem criado problemas dentro do nosso partido. Portanto, devemos aumentar a unidade em nosso partido, para que possamos verdadeiramente unir a esquerda como um todo."
 GRE_support_the_public_sector: "Apoio ao Setor Público"
 GRE_support_the_public_sector_desc: "O setor público é o maior da Grécia e emprega um número enorme de pessoas. Reforçar e modernizar o setor público também pode trazer mais oportunidades de emprego, bem como mais apoio ao nosso governo."
 GRE_remind_the_failures_of_pasok_and_new_democracy: "Os Fracassos do PASOK e Nova Democracia"
 GRE_remind_the_failures_of_pasok_and_new_democracy_desc: "Devemos lembrar o povo grego dos fracassos do PASOK e Nova Democracia, já que eles conseguiram aumentar a desigualdade econômica e social, aumentar a dívida externa para 300 bilhões de dólares, criar uma crise da dívida, além de aumentar as taxas de corrupção. Eles devem aprender que o povo grego não esqueceu seus desastres."
 GRE_encourage_agricultural_growth: "Estimular o Crescimento Agrícola"
 GRE_encourage_agricultural_growth_desc: "A agricultura é de longe o maior e mais forte setor da nossa economia e muitas das nossas exportações para outros países são produtos agrícolas como azeite de oliva. Aumentar o financiamento na agricultura impulsionará nossa economia, bem como aumentará as exportações para outros países."
 GRE_the_greek_crisis: "Solução para a Crise da Dívida Grega"
 GRE_the_greek_crisis_desc: "Nossa economia, devido à imensa quantidade de dívida, está próxima do colapso. Portanto, medidas drásticas devem ser tomadas para salvar a economia grega."
 GRE_enact_austerity_measures: "Implementar Medidas de Austeridade"
 GRE_enact_austerity_measures_desc: "Implementar medidas de austeridade poderia salvar nossa economia do colapso, mas essas medidas não serão aceitas facilmente pelo povo."
 GRE_reduce_education: "Reduzir os Fundos para Educação"
 GRE_reduce_education_desc: "Como parte do nosso programa de austeridade, é necessário que reduzamos o financiamento para o sistema educacional a fim de economizar mais fundos necessários para a recuperação econômica. Infelizmente, isso reduzirá a eficácia do sistema educacional grego, mas ajudará nosso país no final."
 GRE_reduce_health: "Cortes na Saúde"
 GRE_reduce_health_desc: "A quantidade de dinheiro que vai para o sistema de saúde grego é muito para a nossa economia. Se reduzirmos os fundos que vão para a saúde, isso poderia potencialmente ajudar a nossa economia, mas com a consequência de nossos cidadãos terem condições piores quando hospitalizados."
 GRE_reduce_welfare: "Cortes no Bem-Estar Social"
 GRE_reduce_welfare_desc: "Nosso país investiu muito no bem-estar social e, embora isso tenha aumentado a qualidade de vida de nossos cidadãos, também reduziu os fundos muito necessários para reforçar nossa economia. Para salvar a economia, devemos encerrar o estado de bem-estar social pelo qual nosso país era conhecido."
 GRE_reduce_army: "Reduzir os Gastos Militares"
 GRE_reduce_army_desc: "Nos últimos anos, a necessidade de aumentar o financiamento militar perdeu sua relevância, já que nosso país não irá para guerra em breve. Portanto, seria sábio retirar uma parte do financiamento do setor militar para reforçar setores mais importantes de nossa economia."
 GRE_recovery: "Recuperação Econômica"
 GRE_recovery_desc: "Após decisões difíceis e duras medidas de austeridade, nosso país conseguiu parar o declínio econômico, bem como diminuir a dívida massiva. Vamos todos esperar que nosso país se torne grande como era na época dos impérios."
 greece.1.t: "Indignação Diante de Novas Políticas de Austeridade"
 greece.1.d: "Hoje, o governo grego implementou novas medidas de austeridade para cumprir o resgate da dívida da União Europeia. O que se seguiu foi indignação por parte do público, carregando cartazes como 'A austeridade é anti-grega'. Esses distúrbios estão apenas piorando a situação da Grécia e pode-se supor que isso é apenas a ponta do iceberg."
 greece.1.a: "I have a bad feeling about this."
 greece.2.t: "Protestos nas Ruas!"
 greece.2.d: "Hoje, protestos em Atenas se tornaram violentos depois que a polícia tentou conter a multidão em constante crescimento. Gás lacrimogêneo e balas de borracha foram usados para tentar impedir a multidão de causar mais destruição, e embora a multidão eventualmente tenha recuado, as tensões ainda pairam no ar."
 greece.2.a: "Eles começaram!"
 greece.3.t: "Tensões se Agravam"
 greece.3.d: "As multidões cresceram e mostram cada vez mais descontentamento. Não há dúvida de que a situação apenas piorou."
 greece.3.a: "Como isso pôde acontecer?"
 greece.4.t: "Aurora Dourada Chama Eleições na Grécia"
 greece.4.d: "Após aumentar em apoio, o partido político de extrema direita Aurora Dourada exigiu que o governo realizasse eleições - uma demanda que o governo da Grécia concordou devido ao alto apoio do povo, bem como à pressão interna do governo. Espera-se que o partido Aurora Dourada vença, pois tem alto apoio e ameaçou que, se o governo não permitir sua vitória, o partido, junto com seus apoiadores, retaliará contra o governo."
 greece.4.a: "Uma Nova Aurora para a Grécia"
 greece.4.b: "Interessante."
 greece.5.t: "KKE Convoca Eleições na Grécia"
 greece.5.d: "Após ganhar o apoio majoritário da classe trabalhadora da Grécia e de várias figuras políticas, o KKE (Partido Comunista da Grécia) convocou o governo para realizar eleições, com as quais o governo grego concordou, considerando que o KKE havia atraído apoio massivo e que o governo estava sob pressão de vários políticos para realizar eleições. Espera-se que o partido KKE vença a eleição, pois tem apoio majoritário entre a maioria da população e um porta-voz do partido declarou que, se não for permitido realizar eleições, a classe trabalhadora lançará uma revolta para derrubar o governo."
 greece.5.a: "Trabalhadores da Grécia, ergam-se!"
 greece.5.b: "Interessante."
 greece.6.t: "Grécia se Move para a Direita"
 greece.6.d: "Após tensões políticas, assim como uma crise migratória e econômica, o povo da Grécia se cansou dos governos democráticos e passou a apoiar o partido de extrema-direita Aurora Dourada. O partido Aurora Dourada é contra as políticas econômicas do governo, bem como fortemente antiesquerda e anti-imigração, e prometeu ao povo grego que resolverá todos os problemas que a sociedade grega enfrenta."
 greece.6.a: "A Grécia se erguerá novamente"
 greece.6.b: "Interessante."
 greece.7.t: "Grécia se Move para a Esquerda"
 greece.7.d: "Após as duras políticas econômicas decretadas pelo recente governo grego, o desemprego aumentou e a classe trabalhadora da Grécia exige ação contra o governo grego. A classe trabalhadora se uniu ao partido de extrema esquerda KKE (Partido Comunista da Grécia). O KKE é contra o desemprego e as violações dos direitos dos trabalhadores, ao mesmo tempo em que apoia políticas antiocidentais e organiza constantes revoltas compostas por trabalhadores para pressionar o governo grego."
 greece.7.a: "Trabalhadores da Grécia, sua libertação está chegando"
 greece.7.b: "Interessante."
 greece.12.t: "Alexis Tsipras Torna-se Líder do SYRIZA"
 greece.12.d: "Em 10 de agosto de 2008, o partido de esquerda SYRIZA elegeu o Alexis Tsipras, de 33 anos, como líder do partido, tornando-o um dos líderes de partido político mais jovens na história grega."
 greece.12.a: "Parabéns"
 greece.13.t: "Distúrbios no Norte de Chipre"
 greece.13.d: "Armed riots have broken out across Northern Cyprus against the Greek agenda of pushing towards a unified Cyprus. The riots were obviously staged by Turkish authorities; however, their animosity has definitely set back how we are perceived."
 greece.13.a: "Horror!"
 greece.14.t: "Sindicatos Oferecem Apoio"
 greece.14.d: "Nosso recente ataque à constituição nos trouxe uma considerável oposição politicamente. Os sindicatos ofereceram seu apoio em troca de mais poder. Será que realmente temos escolha?"
 greece.14.a: "Não temos escolha."
 greece.15.t: "Sindicatos Exigem Mais Concessões"
 greece.15.d: "Os sindicatos nos visitam novamente; no entanto, não é seu apoio que oferecem desta vez, é seu apoio que ameaçam retirar se não concedermos ainda mais poder a eles."
 greece.15.a: "Malditos!"
 greece.16.t: "Uma Fundação Rachada"
 greece.16.d: "Fica cada vez mais difícil dormir todas as noites, à medida que o país se desintegra. As cidades mais ao norte estão enfrentando ataques organizados que resultaram em centenas de vítimas em ambos os lados. Não conseguiremos mantê-los afastados por muito tempo com esse nível de força.\n\n §RTentar contê-los no Norte é inútil. Devemos concentrar nossas tropas para defender Atenas e as áreas circundantes. Nos encontraremos na linha de frente.§!"
 greece.16.a: "Quero os generais aqui, agora!"
 greece.17.t: "O Tempo Acabou"
 greece.17.d: "Nossas previsões não estavam erradas: os rebeldes do norte se organizaram em um exército; no entanto, eles não parecem tão agressivos como pensávamos inicialmente que seriam b-... \nAguarde, preciso atender isso... \nSim. \nSim.\nVocê tem certeza?\n\n...Maldição."
 greece.17.a: "'Parece haver múltiplas tentativas em nossas linhas para romper.'"
 greece.18.t: "Grécia Cede Piraeus"
 greece.18.d: "O Porto de Piraeus recentemente foi cedido pelo governo grego em uma tentativa de obter fundos para a crise da dívida. Seria uma iniciativa mais do que válida adicionar Piraeus à nossa coleção, e também abriria portas para mais projetos dentro da Grécia, bem como na Europa, expandindo nossa influência na região."
 greece.18.a: "Faça o lance mais alto."
 greece.18.b: "Nosso desinteresse por tal projeto não pode ser expresso com palavras."
 greece.19.t: "China Faz Oferta por Piraeus"
 greece.19.d: "Os chineses mostraram interesse no Porto de Piraeus e subsequentemente fizeram uma oferta considerável de dinheiro para direitos exclusivos no porto, vencendo o leilão. O que a China decidir fazer com o porto no futuro é com eles; no entanto, temos a capacidade de impedir a China de expandir o porto ou iniciar quaisquer outros projetos se considerarmos perigoso."
 greece.19.a: "Um acordo com o Diabo."
 greece.20.t: "China Não Mostra Interesse em Piraeus"
 greece.20.d: "Apesar de nossos melhores esforços, o governo chinês rejeitou nossa proposta sem dar uma segunda pensada."
 greece.20.a: "Para melhor ou para pior, não posso dizer."
 greece.22.t: "Tensões da Austeridade se Dissipam"
 greece.22.d: "É geralmente um dia 'calmo' para a Grécia, já que as demonstrações anti-austeridade parecem ter parado por enquanto. Talvez seja apenas o esgotamento das constantes manifestações, talvez seja algo mais."
 greece.22.a: "Obrigado a Deus."
 greece.23.t: "Enosis Finalmente!"
 greece.23.d: "After decades of unrest, separation and anxiety over familial bonds and connections being apart from one another, the Enosis conferences have paid off.\n\nGreek Cypriots are celebrating in the streets, the Turkish Cypriots have been appeased sufficiently and the British seem somewhat happy with the arrangements that we have decided upon.\n\nThere is still one lingering question: what to do about Akrotiri and Dhekelia?"
 greece.23.a: "Solicitar Controle Total"
 greece.23.b: "Permitir que a RAF Mantenha as Bases"
 greece.24.t: "O Governo Grego Quer Akrotiri de Volta!"
 greece.24.d: "Having achieved their goals of Enosis, the Greek government have come to us hat in hand to request we return the bases of Akrotiri and Dhekelia. Should we let them return to Greek rule?"
 greece.24.a: "Seria Errado Não Permitir!"
 greece.24.b: "De jeito nenhum!"
 greece.25.t: "O Governo Grego Permite que Fiquemos no Chipre!"
 greece.25.d: "Após alcançarem seus objetivos de Enosis, o governo grego percebeu que o retorno de Akrotiri e Dhekelia seria inconveniente para todos, felizmente não precisaremos mover nossas tropas desta terra."
 greece.25.a: "Ótimo então!"
 GRE_tax_relief_for_businessman: "Alívio fiscal para empresários"
 GRE_tax_relief_for_businessman_desc: "Precisamos ajudar financeiramente as empresas, pois elas foram abandonadas à própria sorte em meio às políticas de nossas administrações anteriores, e por isso reduziremos seus impostos."
 istanbul_renamed: "Istambul renomeada"
 GRE_9833_name: "Constantinopla"
 GRE_constantinople_not_istanbul: "Constantinopla, não Istambul"
 GRE_constantinople_not_istanbul_desc: "Por cinco séculos, Constantinopla foi conhecida por outro nome. A cidade de Constantino e Justiniano, de Santa Sofia e das Muralhas de Teodósio, renomeada e reescrita por um conquistador. Com a cidade em mãos gregas, restauramos o que a história nos roubou."
 GRE_gain_10_strength: "Os §HCipriotas-Gregos§! §GGANHARÃO§! §H10 de força!§!"
 GRE_lose_10_gain_10: "Os §HCipriotas-Turcos§! §RPERDERÃO§! §H10 de força!§!"
 GRE_austerity_idea: "Tensões de Austeridade"
 GRE_austerity_idea_desc: "O programa de austeridade levou a paciência pública além do limite. Os protestos se espalham de Atenas a Salônica, greves paralisam portos e hospitais e a temperatura política está subindo. Cada novo corte joga mais lenha na fogueira. Se a tensão não for administrada, uma revolta em larga escala é uma possibilidade real."
 GRE_please_south_desc: "Ao continuarmos a agradar os cipriotas gregos, podemos garantir que eles estarão mais propensos a nos apoiar em nossa busca pela unificação de Chipre e, finalmente, no objetivo de Enosis."
 GRE_please_north_desc: "Reforçando que os turco-cipriotas não são gregos nem cipriotas. São colonizadores e invasores que devem ser expulsos de Chipre."
 TUR_CYP_incite_riot_desc: "É hora de começarmos a incitar tumultos no sul do Chipre para garantir que os gregos não consigam ganhar influência política na região."
 TUR_CYP_propaganda_north_desc: "Reforçar e espalhar propaganda para os cipriotas do norte para garantir que eles não sejam influenciados pelos gregos é fundamental para nosso sucesso na região."
 TUR_CYP_propaganda_south_desc: "Reforçar e espalhar propaganda para os cipriotas do sul para garantir que eles não sejam influenciados pelos gregos é fundamental para nosso sucesso na região."
 TUR_attack_CYP_strength_desc: "Ao atacar a força greco-cipriota, podemos garantir que eles não consigam ganhar influência política na região."
 GRE_attack_turkish_strength_desc: "Ao atacar a força turco-cipriota, podemos garantir que eles não consigam ganhar influência política na região."
 GRE_nato_pressure_turkey_accept_tt: "Aliados que apoiam a Grécia aliviam a tensão no Egeu e ganham impulso em Chipre, aumentando a chance de a Turquia recuar em um mês."
 GRE_nato_pressure_turkey_reject_tt: "Aliados que recusam não somam peso diplomático, deixando a Turquia menos propensa a ceder."
 GRE_hellenic_economy: "A Economia Helênica"
 GRE_hellenic_economy_desc: "A economia grega está em uma posição difícil. A dívida crescente, o desemprego e a questão da entrada na Zona do Euro são preocupações urgentes. No entanto, temos uma forte frota mercante, uma posição estratégica e um turismo que traz milhões de visitantes todos os anos. Devemos aproveitar ao máximo o que temos."
 GRE_debt_mounts: "A Dívida Cresce"
 GRE_debt_mounts_desc: "Nossa dívida inflou para quase 300 bilhões de dólares, uma das mais altas per capita do mundo. Os pagamentos de juros consomem uma parte enorme do nosso orçamento, deixando pouco espaço para investimentos. Os banqueiros estrangeiros estão inquietos e a UE quer respostas. Precisamos agir antes que isso piore."
 GRE_debt_mounts_req_tt: "Nossa §YProporção de Dívida Unificada§! é maior que §Y90%§! (Atual §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_brics_membership_req_tt: "A pontuação de alinhamento ao Oriente é superior a 7"
 GRE_pillar_of_the_west_req_tt: "O compromisso com o Ocidente é superior a 3"
 GRE_aegean_assertiveness_event_tt: "§YEm 90 dias, a Turquia responderá às nossas patrulhas no Egeu.§!"
 GRE_cyprus_gas_crisis_event_tt: "§RCom as tensões já altas, a perfuração provocará uma reação naval turca em poucos dias.§!"
 GRE_greek_bonds: "Retorno aos Mercados de Títulos"
 GRE_greek_bonds_desc: "Atenas está fora do crédito de longo prazo desde a crise, deixando o Tesouro dependente de títulos de curto prazo e dos desembolsos dos credores. Uma emissão de referência de dez anos, comercializada pela Agência de Gestão da Dívida Pública a fundos europeus e americanos, testaria se os investidores estão prontos para voltar a emprestar à Grécia em condições normais."
 GRE_solve_evasion: "Resolver a Evasão Fiscal"
 GRE_solve_evasion_desc: "Bilhões em receita são perdidos todos os anos com a evasão fiscal. Se fortalecermos a arrecadação, investirmos em tecnologia melhor e combatermos as contas offshore, poderemos fechar as brechas e colocar nosso orçamento de volta nos trilhos."
 GRE_convert_to_euro: "Converter para o Euro"
 GRE_convert_to_euro_desc: "O Euro é ao mesmo tempo uma oportunidade e um risco. Adotá-lo vincula nossa economia à da Europa, o que significa mais estabilidade do que o dracma jamais teve, mas perdemos o controle de nossa própria política monetária. Cabe a nós decidir se a troca vale a pena."
 GRE_skouries_mines: "Minas de Skouries"
 GRE_skouries_mines_desc: "A jazida de cobre e ouro de Skouries, em Calcídica, é uma das maiores da Europa. Corporações estrangeiras querem os direitos de extração e prometem empregos e riqueza. Os ambientalistas são contra. Precisaremos decidir o que importa mais."
 GRE_local_manufacturing: "Feito na Grécia"
 GRE_local_manufacturing_desc: "A manufatura grega encolheu para um punhado de setores: processamento de alimentos, cimento, alumínio, produtos farmacêuticos e construção naval ao longo da costa de Perama. Uma regra de preferência doméstica nas compras públicas, aliada a incentivos ao investimento previstos na Lei do Desenvolvimento, daria às fábricas sobreviventes a carteira de pedidos de que precisam para voltar a contratar."
 GRE_military_industrial: "A Indústria de Armas Helênica"
 GRE_military_industrial_desc: "A Elliniki Viomichania Oplon e sua irmã Pyrkal armam os soldados gregos desde a Guerra Fria, mas décadas de propriedade estatal as deixaram afundadas em dívidas e com linhas de produção ociosas. Subsídios sustentados e direcionados poderiam manter os fornos acesos, garantir um suprimento doméstico de munição e armas leves e fundir as duas em um único fabricante competitivo, em vez de um eterno peso para o tesouro."
 GRE_agriculture_sector: "Espinha Dorsal do Campo"
 GRE_agriculture_sector_desc: "Quase um quinto dos gregos ainda tira seu sustento da terra, dos olivais do Peloponeso aos campos de algodão da Tessália. No entanto, o setor está envelhecido, fragmentado em minúsculas parcelas e dependente de Bruxelas para seus subsídios sob a Política Agrícola Comum. Apoiar nossos agricultores, impulsionando a irrigação, as cooperativas e o maquinário moderno, manteria as azeitonas de Kalamata, o feta e o Assyrtiko chegando às mesas do mundo."
 GRE_power_corporations: "A Companhia Pública de Energia"
 GRE_power_corporations_desc: "Por meio século, a estatal Companhia Pública de Energia, a DEI, manteve as luzes acesas queimando linhito extraído das minas de Ptolemaida e Megalópolis. Esse carvão é barato, mas sujo, e nossa dependência de petróleo e gás importados nos deixa expostos a cada choque no Oriente Médio. Modernizar a rede, estender a rede de gás da DEPA e construir novas usinas transformaria essas empresas de serviços públicos na espinha dorsal estratégica da nação."
 GRE_austerity_measures: "Medidas de Austeridade"
 GRE_austerity_measures_desc: "Os credores exigem pensões reduzidas, impostos mais altos e benefícios eliminados. Sem austeridade, enfrentamos a falência; com ela, enfrentamos a ira pública. Protestos e greves são inevitáveis. Não há escolhas fáceis aqui."
 GRE_debt_refactoring: "Reestruturação Estratégica da Dívida"
 GRE_debt_refactoring_desc: "Os leilões de títulos nos deram tempo, mas isso não basta. Os credores estão perdendo a paciência e os pagamentos de juros estão drenando o tesouro. Precisamos reestruturar nossa dívida: renegociar prazos, estender vencimentos e mostrar aos nossos parceiros que nos dar espaço para respirar significa que realmente poderemos pagá-los."
 GRE_ilarionas_hydro: "Hidrelétrica de Ilarionas"
 GRE_ilarionas_hydro_desc: "O rio Ilarionas, no norte da Grécia, tem um tremendo potencial hidrelétrico. A energia hidrelétrica é limpa, renovável e funciona sob demanda, ao contrário da solar ou da eólica. Este projeto poderia abastecer centenas de milhares de lares."
 GRE_telecomms: "Investimentos na OTE"
 GRE_telecomms_desc: "Milhões de gregos em vilas insulares e cidades de montanha ainda não têm acesso confiável a telefone e internet. O investimento estatal na OTE poderia conectar essas áreas ao resto do país, dando aos agricultores acesso aos mercados e aos estudantes acesso às universidades."
 GRE_new_railways: "Revitalização da Linha Férrea Atenas-Salônica"
 GRE_new_railways_desc: "O corredor Atenas-Salônica é a espinha dorsal da Grécia continental, mas a linha férrea é dolorosamente lenta. Material rodante moderno e trilhos modernizados poderiam reduzir o tempo de viagem pela metade e dar um verdadeiro impulso à economia provincial."
 GRE_highway_initiatives: "Estender as Rodovias AX"
 GRE_highway_initiatives_desc: "As montanhas que antes dividiam as antigas cidades-estado ainda isolam comunidades e prejudicam o comércio hoje. A rede de rodovias AX proposta cortaria a cordilheira do Pindo e conectaria a costa oeste à Tessália. Será cara, mas os benefícios econômicos podem compensar."
 GRE_hellas_gold: "Aprofundar as Minas de Kassandra"
 GRE_hellas_gold_desc: "O distrito minerador de Kassandra possui reservas substanciais de cromo que ainda não foram plenamente exploradas. Aprofundar as operações existentes e investir em equipamentos de extração levaria essa riqueza ao mercado e reduziria nossa dependência de importações."
 GRE_euboea_bauxite_deposits: "Jazidas de Bauxita da Eubeia"
 GRE_euboea_bauxite_deposits_desc: "A Eubeia possui jazidas significativas de bauxita, o principal minério do alumínio. A extração em larga escala poderia abastecer nossa base industrial e reduzir as caras importações."
 GRE_industrial_lignite_mining: "A Bacia de Ptolemaida"
 GRE_industrial_lignite_mining_desc: "Os campos de linhito a céu aberto em torno de Ptolemaida e Amyntaio, na Macedônia Ocidental, abastecem a Companhia Pública de Energia há meio século. Expandir a escavação e adicionar uma usina de liquefação transformaria a bacia em uma fonte doméstica de combustível, em vez de um distrito carvoeiro envelhecido."
 GRE_rare_element_prospecting: "Pesquisar o Subsolo Helênico"
 GRE_rare_element_prospecting_desc: "Os pórfiros de ouro e cobre da Calcídica, o cinturão de bauxita do Parnaso e do Peloponeso e as lateritas de níquel da Eubeia são apenas as jazidas mapeadas. Um levantamento geológico nacional pelo IGME, respaldado por licenças de exploração, identificaria a próxima geração de locais de extração."
 GRE_transport_sector: "Estradas, Trilhos e Balsas"
 GRE_transport_sector_desc: "Um país de ilhas e montanhas vive ou morre pelo seu transporte. Os ônibus da KTEL serpenteiam pelos desfiladeiros, as balsas azuis e brancas costuram o Egeu e os ônibus e trólebus da OASA levam Atenas ao trabalho toda manhã. Renovar frotas envelhecidas, estender rotas aos subúrbios e unir estrada, trilho e mar em uma única rede de bilhetagem permitiria que as mercadorias chegassem ao mercado e os trabalhadores aos seus empregos."
 GRE_vintage_wines: "Os Vinhos da Grécia"
 GRE_vintage_wines_desc: "Os gregos já prensavam uvas antes de Roma ser fundada, mas o mundo ainda conhece nosso vinho apenas como o barato retsina de uma jarra de taverna. Isso é uma injustiça com o vulcânico Assyrtiko de Santorini, o encorpado Xinomavro de Naoussa e o rubi Agiorgitiko de Nemeia. Investir em engarrafamento na propriedade, rótulos de origem protegida e enoturismo poderia finalmente colocar os vinhos gregos ao lado dos grandes nomes da França e da Itália."
 GRE_tobacco_plantations: "Tabaco Oriental"
 GRE_tobacco_plantations_desc: "A folha Basma curada ao sol da Macedônia e da Trácia perfuma as melhores misturas do mundo há gerações, e casas como a Papastratos, no Pireu, construíram fortunas com ela. O fumo no Ocidente pode estar em retirada, mas a demanda persiste nos Bálcãs e no Oriente Médio, e milhares de pequenos produtores em torno de Cavala e Xanti ainda dependem da colheita. Devemos apoiar os produtores, ao mesmo tempo em que incentivamos quem puder a migrar para novas culturas."
 GRE_gas_oil_plants: "As Refinarias da Ática"
 GRE_gas_oil_plants_desc: "As refinarias que cercam o Golfo Sarônico, a Hellenic Petroleum em Aspropyrgos e Elefsina e a Motor Oil Hellas em Agioi Theodoroi, processam o petróleo bruto que mantém a Grécia e metade dos Bálcãs em funcionamento. Mas as unidades mais antigas estão desgastadas e suas margens estão diminuindo. Nova capacidade de craqueamento, dessulfurização mais limpa e armazenamento ampliado garantiriam nosso lugar como polo de refino do Mediterrâneo sudeste."
 GRE_trim_the_fat: "Cortar a Gordura"
 GRE_trim_the_fat_desc: "O governo tornou-se inchado e ineficiente. Os ministérios têm funcionários demais, os contratos vão para amigos e parentes e a burocracia está sufocando tudo. Precisamos enxugar a máquina cortando desperdícios, automatizando onde pudermos e responsabilizando as pessoas."
 GRE_debt_swaps: "Parceiros de Troca de Dívida"
 GRE_debt_swaps_desc: "Trocar nossa dívida por títulos denominados em moeda estrangeira poderia reduzir nossa exposição à volatilidade. Isso exige bons parceiros bancários e alguma engenharia financeira, mas é uma forma de administrar a dívida com menos repercussão política."
 GRE_debt_swap_initial_tt: "§G50 bilhões§! da dívida nacional serão transferidos ao parceiro escolhido a uma taxa de juros de §G3%§!."
 GRE_debt_swap_accepted_opinion: "Troca de Dívida Aceita"
 GRE_debt_swap_rejected_opinion: "Troca de Dívida Rejeitada"
 GRE_olympic_airways: "Olympic Airways"
 GRE_olympic_airways_desc: "Fundada por Aristóteles Onassis, a Olympic Airways já foi o orgulho da aviação grega. A companhia enfrentou dificuldades nos últimos anos, mas o nome ainda tem peso. Revitalizar a empresa poderia atrair turistas e fazê-los voltar sempre."
 GRE_trainose: "TrainOSE"
 GRE_trainose_desc: "O sistema ferroviário grego, antes negligenciado, ganhou nova vida. A TrainOSE opera serviços de passageiros e carga que ligam Atenas a Salônica e o Peloponeso ao continente. Ao expandir rotas, melhorar horários e investir em material rodante, podemos fazer da ferrovia uma alternativa genuína."
 GRE_cotton_plantations: "Plantações de Algodão"
 GRE_cotton_plantations_desc: "O algodão grego da Tessália e da Macedônia está entre os melhores do mundo. Fibras fortes e excelente qualidade o tornam ótimo para têxteis. Apoiar nossos produtores de algodão e investir na manufatura poderia devolver essa indústria ao lugar que lhe cabe."
 GRE_fisheries_expansion: "Riquezas do Egeu"
 GRE_fisheries_expansion_desc: "A Grécia desembarca mais besugo e robalo de cultivo do que qualquer nação da Europa, com seus tanques-rede espalhados pelos golfos abrigados do Jônico e do Egeu. Mas os estoques selvagens estão em colapso devido à pesca excessiva, à poluição e aos arrastões que avançam pela fronteira marítima. Expandir a aquicultura, renovar a frota costeira e aplicar cotas honestas manteria vivos tanto os pescadores quanto os peixes."
 GRE_aegean_wind_banks: "Aproveitando o Meltemi"
 GRE_aegean_wind_banks_desc: "A cada verão, o Meltemi ruge sobre as Cíclades, um dos ventos mais constantes de toda a Europa. Turbinas espalhadas pelas ilhas e pelas cristas do continente poderiam despejar energia limpa na rede e romper nossa dependência de petróleo e carvão importados. O maior prêmio é a interconexão que enfim ligaria os geradores a diesel das ilhas à rede nacional."
 GRE_resolution_crisis: "Resolução da Crise"
 GRE_resolution_crisis_desc: "Temos administrado a crise por tempo demais, em vez de realmente resolvê-la. É hora de um plano adequado que lide com dívida, crescimento, bancos e reformas ao mesmo tempo. Não será fácil, mas é o único caminho. Concluir este foco encerra a crise da dívida de vez, então primeiro precisamos controlar nossa dívida: juros abaixo de 8% e dívida/PIB abaixo de 50%."
 GRE_urban_railways: "Expandir o Metrô de Atenas"
 GRE_urban_railways_desc: "O Metrô de Atenas transformou a capital antes dos Jogos de 2004, mas distritos inteiros ainda ficam fora de seu alcance, Salônica espera décadas por uma linha própria e o trem suburbano Proastiakos mal arranha seu potencial. Abrir novos túneis, estender o bonde até a costa e conectar as cidades aliviaria o trânsito sufocante, limparia a poluição e melhoraria o dia a dia de milhões de pessoas."
 GRE_ionian_solar: "Solar Jônica"
 GRE_ionian_solar_desc: "As ilhas Jônicas recebem muito sol. Instalar usinas solares em Corfu, Lefkada e Zakynthos nos permitiria aproveitar isso e reduzir nossa dependência de combustíveis fósseis importados."
 GRE_tourism_boom: "Viva Seu Mito na Grécia"
 GRE_tourism_boom_desc: "Das praias de Creta à caldeira de Santorini e às vielas caiadas de Míconos, a Grécia atrai dezenas de milhões de visitantes todos os anos, e o turismo já responde por quase um quinto de tudo o que a economia produz. Um esforço coordenado da Organização Nacional de Turismo em marketing, capacidade aeroportuária e conectividade entre as ilhas poderia transformar essa enxurrada sazonal em um verdadeiro pilar da riqueza nacional."
 GRE_tourism_boom_event_TT: "§YUma temporada recorde provoca um debate sobre onde o dinheiro deve ser aplicado.§!"
 GRE_mass_tourism: "Sol, Areia e Pacotes Turísticos"
 GRE_mass_tourism_desc: "Encher os voos fretados de Manchester e Düsseldorf, forrar as costas de resorts all-inclusive e deixar as multidões chegarem aos milhões. O turismo de volume inunda o tesouro e mantém um salário de verão ao alcance de cada ilhéu, mas esgota os aquíferos de Míconos, soterra os penhascos de Santorini sob passageiros de cruzeiros e desgasta a paciência de quem realmente vive ali."
 GRE_premium_tourism: "Iates e Resorts Boutique"
 GRE_premium_tourism_desc: "Menos hóspedes, cada um pagando muito mais e deixando uma pegada muito mais leve. Priorizar resorts cinco estrelas, turismo cultural e arqueológico e as marinas de superiates do Jônico protege tanto as frágeis ilhas quanto a marca grega. Os números de chegadas podem crescer mais devagar, mas o dinheiro que fica é mais profundo."
 GRE_diaspora_remittances: "Cortejar a Diáspora"
 GRE_diaspora_remittances_desc: "Milhões de gregos no exterior, de Melbourne a Chicago, mantêm laços com a terra natal. Canalizar suas economias e remessas para a economia transforma sentimento em capital."
 GRE_diaspora_remittances_event_TT: "§YA diáspora responde ao apelo por investimento.§!"
 GRE_reverse_brain_drain: "Reverter a Fuga de Cérebros"
 GRE_reverse_brain_drain_desc: "A crise mandou uma geração de engenheiros, médicos e pesquisadores gregos para o exterior. Incentivos fiscais, financiamento de pesquisa e empregos de verdade podem trazê-los de volta, junto com sua experiência."
 GRE_eu_cohesion_funds: "Fundos de Coesão da UE"
 GRE_eu_cohesion_funds_desc: "Como um dos membros de menor renda da União, a Grécia é beneficiária líquida de fundos estruturais e de coesão. Sacar cada euro disponível financia estradas, portos e o desenvolvimento regional."
 GRE_recovery_resilience_facility: "Mecanismo de Recuperação e Resiliência"
 GRE_recovery_resilience_facility_desc: "O Mecanismo de Recuperação e Resiliência pós-pandemia canaliza dezenas de bilhões para a transição verde e digital. Bem gasto, é o maior programa de investimento da história moderna da Grécia."
 GRE_recovery_facility_event_TT: "§YBruxelas desembolsa a primeira parcela, e Atenas precisa decidir a que velocidade gastá-la.§!"
 GRE_infrastructure_cofinancing: "Cofinanciamento de Infraestrutura"
 GRE_infrastructure_cofinancing_desc: "O dinheiro europeu cobre a maior parte da conta, o dinheiro grego cobre o restante. Rodovias, linhas de metrô e redes cofinanciadas são construídas por uma fração do custo nacional."
 GRE_deterrence_posture: "Postura de Dissuasão"
 GRE_forward_posture_mod: "Postura Avançada Agressiva"
 GRE_defense_partner: "Parceiro de Defesa"
 GRE_naval_partner: "Parceiro Naval"
 GRE_strong_naval_partner: "Parceiro Naval Próximo"
 GRE_defense_exporter: "Exportador de Defesa"
 GRE_f35_partner: "Parceiro do Programa F-35"
 GRE_aegean_encroachment: "Invasão do Egeu"
 GRE_refused_debt_call_opinion: "Recusou a Exigência de Pagamento da Dívida"
 GRE_debt_forgiven_opinion: "Dívida Perdoada"
 GRE_debt_fully_repaid_opinion: "Dívida Totalmente Paga"
 GRE_forgave_debt_opinion: "Perdoou Nossa Dívida"
 GRE_economy_modifier: "Economia Helênica"
 GRE_debt_crisis_category: "A Crise da Dívida [GRE.GetAdjective]"
 GRE_debt_crisis_category_desc: "Apesar do nosso crescimento econômico, nossa dívida continua a aumentar para valores cada vez maiores, seja por gastos ineficazes do governo, vencimento de títulos ou déficits orçamentários recorrentes. Precisamos lidar com nossa dívida antes que ela se torne uma crise, ou transformá-la em uma ferramenta para garantir nossa prosperidade contínua no novo milênio.\n\nProporção Atual PIB/Dívida: [?debt_ratio|%Y]\n§YDívida em Poder dos Credores§! atual: $$[?GRE_total_creditor_debt|0]\n"
 GRE_austerity_tension_mission: "Tensões da Austeridade"
 GRE_austerity_tension_mission_desc: "Os cortes de gastos e os aumentos de impostos deixaram o povo furioso. Devemos reduzir nossa proporção de dívida unificada para menos de §Y75%§! para encerrar as tensões. Toda vez que o tempo se esgota, os protestos pioram e, se transbordarem no auge, o país mergulha em uma crise de dívida completa."
 GRE_debt_crisis_mission: "A Crise da Dívida [GRE.GetAdjective]"
 GRE_debt_crisis_mission_desc: "A austeridade fracassou e os mercados perderam a fé em nós. Devemos reduzir nossa proporção de dívida unificada para menos de §Y75%§! por meio de cortes de gastos e transferindo dívida para credores estrangeiros. Toda vez que o tempo se esgota, o governo paga o preço, e nosso fracasso corre o risco de arrastar toda a Zona do Euro conosco."
 GRE_austerity_placate_decision: "Apaziguar os Manifestantes"
 GRE_austerity_placate_decision_desc: "Aproximação do governo e alívio direcionado podem atenuar a frustração pública. Reduzir a pressão visível da austeridade deve ajudar a restaurar a Estabilidade e a diminuir as tensões."
 GRE_slash_public_spending_decision: "Cortar os Gastos Públicos"
 GRE_slash_public_spending_decision_desc: "Cortes gerais em ministérios, folhas de pagamento públicas e pensões. As contas parecerão melhores, mas o povo sentirá cada euro. Reduz nossa dívida nacional em §Y5%§!."
 GRE_emergency_tax_hikes_decision: "Aumentos de Impostos de Emergência"
 GRE_emergency_tax_hikes_decision_desc: "Aumentar o IVA e os impostos de renda para tapar o buraco no orçamento. A receita é real, e a ira contra o partido governante também. Reduz nossa dívida nacional em §Y4%§!."
 GRE_privatization_drive_decision: "Onda de Privatizações"
 GRE_privatization_drive_decision_desc: "Leiloar bens do Estado, de portos a empresas de serviços públicos, a quem pagar. Uma receita extraordinária única que os sindicatos não perdoarão tão cedo. Reduz nossa dívida nacional em §Y8%§!."
 GRE_unified_ratio_below_75_tt: "Nossa §YProporção de Dívida Unificada§! é menor que §Y75%§! (Atual §Y[?GRE_unified_debt_ratio|-1%]§!)"
 GRE_buys_mission_time_tt: "§GAdiciona 30 dias à missão de dívida ativa§!"
 GRE_austerity_mission_active: "\nA tensão atual da austeridade é §R[gre_austerity_tension]§!"
 GRE_generic_decisions_category: "Decisões Políticas de [GRE.GetNameWithFlag]"
 GRE_generic_decisions_category_desc: "Decisões políticas disponíveis ao governo grego."
 GRE_rename_istanbul_desc: "Com Constantinopla sob controle grego, o governo restaura formalmente o nome histórico da cidade. A renomeação tem profundo significado cultural e eleva o moral nacional."
 GRE_archipelago_air_base_rapid_repair: "Programa de Reparo Rápido de Bases Aéreas"
 GRE_archipelago_air_base_rapid_repair_desc: "Estabelecer equipes de reparo dedicadas e equipamentos pré-posicionados nas bases aéreas das ilhas significa que os danos de ataques inimigos poderão ser consertados mais rápido, mantendo nosso poder aéreo operacional."
 GRE_archipelago_anti_air_rapid_repair: "Protocolos de Manutenção de Baterias Antiaéreas"
 GRE_archipelago_anti_air_rapid_repair_desc: "Equipes móveis de manutenção nos sítios de defesa aérea das ilhas, com peças e treinamento padronizados, nos permitiriam restaurar baterias danificadas mais rápido e manter nossa rede de defesa aérea intacta."
 GRE_archipelago_bunker_repair_protocols: "Corpo de Reparo de Fortificações Insulares"
 GRE_archipelago_bunker_repair_protocols_desc: "Unidades de engenharia especializadas em todo o arquipélago, voltadas à rápida restauração de bunkers. Fortificações danificadas podem ser trazidas de volta à plena eficácia rapidamente."
 GRE_archipelago_naval_base_repair_protocols: "Iniciativa de Manutenção de Bases Navais"
 GRE_archipelago_naval_base_repair_protocols_desc: "Materiais de reparo pré-posicionados e técnicos qualificados nas instalações navais das ilhas significam que a infraestrutura portuária danificada poderá ser consertada mais rápido e as operações marítimas mantidas em andamento."
 GRE_archipelago_coastal_obstacle_network: "Rede de Obstáculos Costeiros"
 GRE_archipelago_coastal_obstacle_network_desc: "Obstáculos submarinos, campos minados e barreiras em possíveis zonas de desembarque tornariam muito mais difícil para qualquer assalto naval inimigo alcançar nossas costas."
 GRE_archipelago_supply_disruption: "Negação de Suprimentos nos Territórios Centrais"
 GRE_archipelago_supply_disruption_desc: "Uma interrupção logística pré-planejada em nossos núcleos insulares dificultaria que qualquer inimigo ocupante mantivesse linhas de suprimento ou explorasse recursos locais."
 GRE_archipelago_coastal_battery_expansion: "Programa de Expansão de Baterias Costeiras"
 GRE_archipelago_coastal_battery_expansion_desc: "Expandir nossas instalações de artilharia costeira além do que o terreno normalmente permite. A geografia insular não deveria limitar nossa capacidade de defender o litoral."
 GRE_archipelago_island_fortress_expansion: "Programa de Expansão de Fortalezas Insulares"
 GRE_archipelago_island_fortress_expansion_desc: "Financiar obras de engenharia para construir bunkers além do que os limites atuais do terreno permitem. Nossas ilhas podem sustentar fortificações mais fortes do que a doutrina atual presumia."
 GRE_archipelago_attrition_doctrine: "Doutrina de Atrito do Arquipélago"
 GRE_archipelago_attrition_doctrine_desc: "Codificar táticas que usam o terreno insular para sangrar qualquer força atacante. Unidades inimigas em campo aberto enfrentariam maior atrito e assédio constante de nossas posições preparadas."
 GRE_archipelago_supply_interdiction: "Operações de Interdição de Suprimentos nas Ilhas"
 GRE_archipelago_supply_interdiction_desc: "Treinar e posicionar unidades para negar ativamente às forças inimigas o acesso aos recursos locais. Qualquer inimigo que opere em nossas ilhas veria suas fontes de suprimento sistematicamente cortadas."
 GRE_archipelago_missile_battery_expansion: "Expansão da Defesa Antimíssil das Ilhas"
 GRE_archipelago_missile_battery_expansion_desc: "Financiamento adicional para construir sítios de defesa antimíssil além dos limites normais do terreno em todo o arquipélago. Mais investimento em engenharia significa que podemos superar as restrições habituais do terreno."
 GRE_archipelago_air_defense_expansion: "Rede de Defesa Aérea Expandida"
 GRE_archipelago_air_defense_expansion_desc: "Elevar o teto de construção das instalações antiaéreas acima dos limites padrão do terreno. Até as ilhas menores poderiam receber cobertura densa de defesa aérea."
 GRE_archipelago_decision_active: "Um programa de defesa do arquipélago já está em andamento"
 GRE_archipelago_set1_A_chosen: "Programa de Reparo Rápido de Bases Aéreas concluído"
 GRE_archipelago_set1_B_chosen: "Protocolos de Manutenção de Baterias Antiaéreas concluídos"
 GRE_archipelago_set2_A_chosen: "Corpo de Reparo de Fortificações Insulares concluído"
 GRE_archipelago_set2_B_chosen: "Iniciativa de Manutenção de Bases Navais concluída"
 GRE_archipelago_set3_A_chosen: "Rede de Obstáculos Costeiros concluída"
 GRE_archipelago_set3_B_chosen: "Negação de Suprimentos nos Territórios Centrais concluída"
 GRE_archipelago_set4_A_chosen: "Programa de Expansão de Baterias Costeiras concluído"
 GRE_archipelago_set4_B_chosen: "Programa de Expansão de Fortalezas Insulares concluído"
 GRE_archipelago_set5_A_chosen: "Doutrina de Atrito do Arquipélago concluída"
 GRE_archipelago_set5_B_chosen: "Operações de Interdição de Suprimentos nas Ilhas concluídas"
 GRE_archipelago_set6_A_chosen: "Expansão da Defesa Antimíssil das Ilhas concluída"
 GRE_archipelago_set6_B_chosen: "Rede de Defesa Aérea Expandida concluída"
 GRE_lie_about_financial_records_decision: "Ajustar os Registros Financeiros a Nosso Favor"
 GRE_lie_about_financial_records_decision_desc: "Apesar do nosso constante crescimento econômico, nossa moeda defasada e outros problemas econômicos impedem que finalizemos nossos acordos econômicos com a União Europeia."
 GRE_negotiate_debt_swap_deals_decision: "Negociar Acordos de Troca de Dívida"
 GRE_negotiate_debt_swap_deals_decision_desc: "Abrir negociações com uma potência estrangeira para reestruturar nossa dívida por meio de swaps de moeda. Ao transferir nossas obrigações para o banco central de outra nação, podemos obter condições de pagamento mais favoráveis."
 GRE_defer_payments_decision: "Adiar Pagamentos de Focos"
 GRE_defer_payments_decision_desc: "Em vez de pagar adiantado pelos programas econômicos, adiar os custos para a nossa dívida nacional. Isso preserva nosso tesouro à custa de aumentar nossas obrigações."
 GRE_do_not_defer_payments_decision: "Retomar Pagamentos Diretos"
 GRE_do_not_defer_payments_decision_desc: "Parar de adiar custos e voltar a pagar pelos programas econômicos diretamente do tesouro."
 CYP_NCY_diplomatic_category: "Negociações de Reunificação de Chipre"
 GRE_brit_5_TT: "§GGain 5 British Support§!"
 GRE_brit_30_TT: "§GGain 30 British Support§!"
 GRE_unification_TT: "When complete, there will be a monthly conference in which, depending on approval, progress may be made."
 PER_presidential_decisions_only_one_is_available_TT: "Only one of these decisions can be active at a time."
 GRE_homelessness_crisis_category: "A Crise de Desabrigados de Atenas"
 GRE_homelessness_crisis_category_desc: "Após o Terremoto de 1999 em Atenas, milhares de cidadãos gregos estão desabrigados. Ajuda e reparos estão em andamento na cidade, mas podemos optar por impulsionar a iniciativa para concluir a reconstrução dos distritos urbanos e residenciais."
 GRE_reconstruction_efforts_in_athens_decision: "Financiar Esforços Adicionais de Reconstrução em Atenas"
 GRE_reconstruction_efforts_in_athens_decision_desc: "O terremoto causou sérios danos em Atenas. Blocos de apartamentos desabaram, a infraestrutura foi danificada e bairros inteiros foram reduzidos a escombros. Os reparos iniciais começaram, mas os fundos de socorro não bastam. Direcionar recursos adicionais à reconstrução aceleraria o esforço de reerguer a cidade."
 GRE_issue_relief_funds_to_victims_decision: "Conceder Auxílio às Vítimas do Terremoto"
 GRE_issue_relief_funds_to_victims_decision_desc: "Além da destruição física, o terremoto deixou muitas famílias sem nada. Economias perdidas, negócios destruídos, pessoas feridas. Conceder auxílio direto às vítimas proporcionaria ajuda imediata com comida, roupas, moradia temporária e o básico necessário para começar a reconstruir."
 GRE_petition_turkey_for_support_decision: "Pedir Apoio a [TUR.GetName]"
 GRE_petition_turkey_for_support_decision_desc: "Pedir apoio a [TUR.GetNameWithFlag] para nossa recuperação pós-terremoto. Esperamos que encontrem em seus corações a disposição de nos apoiar em nossa hora de necessidade."
 GRE_cypriot_TT: "§YCyprus§! declares war on §YNorthern Cyprus§!"
 GRE_debt_crisis_experienced_tt: "Enfrentamos a §RCrise da Dívida§!"
 GRE_joining_the_euro_interest_rate_tt: "Altera os Requisitos de §Y$EU_join_the_euro_decision$§!:\n- Requisito de §YTaxa de Juros§! para §Y6,5%§! em vez de §Y3,5%§!\n"
 GRE_defer_payments_decision_tt: "Permite adiar o pagamento de ações futuras (ex.: decisões, focos) para a nossa §YDívida Nacional§! ou para um §YCredor Estrangeiro§! em vez de pagar à vista."
 GRE_golden_visa_deals: "Os Vistos Dourados"
 GRE_golden_visa_deals_desc: "O programa Visto Dourado oferece uma autorização de residência de cinco anos a qualquer investidor que aplique uma quantia qualificada em imóveis ou negócios [GRE.GetAdjective]. Compradores de alto patrimônio de fora da UE demonstraram forte interesse, criando uma linha direta de capital estrangeiro para o mercado interno."
 GRE_targeted_pension_reforms: "Reformas Previdenciárias Direcionadas"
 GRE_targeted_pension_reforms_desc: "O sistema previdenciário absorve uma parcela desproporcional do PIB. Reformas direcionadas que endureçam os critérios de elegibilidade, reduzam o abuso de aposentadorias precoces e transfiram as pensões complementares para um modelo de capitalização aliviarão o fardo fiscal sem desmantelar por completo a rede de proteção."
 GRE_merchant_marine: "A Marinha Mercante"
 GRE_merchant_marine_desc: "A Grécia opera a maior frota mercante do mundo sob as bandeiras da União dos Armadores Gregos, um dos lobbies industriais mais poderosos de Atenas. Os armadores e suas famílias controlam dois quintos da tonelagem da frota e mantêm 7-8% do PIB fluindo para as contas nacionais por meio de salários, impostos e taxas portuárias. Fortalecer sua posição competitiva mantém esse dínamo funcionando."
 GRE_tonnage_tax_regime: "Preservar o Imposto sobre Tonelagem"
 GRE_tonnage_tax_regime_desc: "As famílias de armadores há muito desfrutam de um regime favorável de imposto sobre tonelagem, que mantém lucrativas as embarcações de bandeira grega e desestimula a migração para registros estrangeiros. Manter esse regime preserva a receita que flui pelos portos e estaleiros gregos, mantendo vivos os estaleiros de Skaramangas, Elefsina e Neorion."
 GRE_tax_the_shipowners: "Tributar os Magnatas do Transporte Marítimo"
 GRE_tax_the_shipowners_desc: "Os magnatas do transporte marítimo há muito escapam da carga tributária que recai sobre os gregos comuns. Desmantelar o regime de imposto sobre tonelagem e tributar os armadores diretamente renderia uma grande receita extraordinária única ao tesouro, embora a migração para outras bandeiras continue sendo uma ameaça constante."
 GRE_shipbuilding_revival: "Reviver os Estaleiros Gregos"
 GRE_shipbuilding_revival_desc: "Os estaleiros de Skaramangas, Elefsina e Neorion já construíram a frota mercante que trouxe riqueza à Grécia. Restaurar sua capacidade com subsídios e contratos direcionados devolveria empregos nos estaleiros e garantiria um suprimento doméstico de cascos modernos."
 GRE_pdo_exports: "Exportações Premium de Origem Protegida"
 GRE_pdo_exports_desc: "As azeitonas de Kalamata, o azeite extravirgem, o queijo feta e o vinho Assyrtiko são mundialmente famosos. Investir em marcas de denominação de origem protegida e em marketing premium tira esses produtos da concorrência de commodities e lhes garante preços mais altos nos mercados internacionais."
 GRE_recapitalize_banks: "Recapitalizar os Bancos"
 GRE_recapitalize_banks_desc: "Os quatro bancos sistêmicos da Grécia acumularam trilhões em empréstimos inadimplentes durante a crise. O Fundo Helênico de Estabilidade Financeira poderia injetar capital novo por meio de uma recapitalização forçada, restaurando sua capacidade de emprestar e estabilizando o sistema financeiro a um custo fiscal significativo."
 GRE_hercules_scheme: "O Esquema de Proteção de Ativos Hércules"
 GRE_hercules_scheme_desc: "O esquema HAPS securitiza empréstimos inadimplentes fora dos balanços dos bancos, liberando sua capacidade de crédito e reduzindo os custos de empréstimo para empresas e famílias em busca de crédito."
 GRE_privatize_banks: "Devolver os Bancos às Mãos Privadas"
 GRE_privatize_banks_desc: "Vender as participações do Estado nos bancos recapitalizados a investidores privados atrairia forte demanda corporativa e geraria uma importante fonte de receita fiscal. O voto de confiança do mercado também sinalizaria o retorno da Grécia à normalidade."
 GRE_state_bank_control: "Manter os Bancos nas Mãos do Estado"
 GRE_state_bank_control_desc: "Manter a propriedade estatal dos bancos nos permite direcionar seu crédito para a construção civil, a indústria e setores estratégicos internos, sem a pressão dos acionistas privados por lucro. O custo político da propriedade pública é compensado pelo controle sobre a alocação do crédito."
 GRE_nationalist_takeover_TT: "O povo grego exige novas eleições!\n\nCertifique-se de ter Poder Político suficiente guardado para isso. Se você §Rfalhar§! em eleger e formar um governo, §Rprecisará realizar outra eleição extraordinária§! para fortalecer §Y[Nat_Fascism_L]§!"
 GRE_dev_cyp_desc: "Chipre sofreu décadas de divisão e falta de investimento. Com a ilha agora sob soberania grega, podemos começar o trabalho de desenvolver sua infraestrutura, economia e instituições ao padrão do continente."
 GRE_decrease_taxes: "Reduzir Impostos"
 GRE_decrease_taxes_desc: "O povo grego não deve ser pressionado por impostos elevados. Além disso, se reduzirmos os impostos, isso poderá diminuir as taxas de evasão fiscal, que são um grande problema em nosso país."
 GRE_eastern_neighborhood: "Vizinhança Oriental"
 GRE_eastern_neighborhood_desc: "A Grécia deve definir sua relação com seus vizinhos mais próximos, a Turquia e a ilha dividida de Chipre. O modo como lidarmos com ambos moldará a região por uma geração."
 GRE_turkey_rapprochement: "Reaproximação com a Turquia"
 GRE_turkey_rapprochement_desc: "Grécia e Turquia têm mais em comum do que qualquer um dos lados admite. Um diálogo estruturado sobre comércio, migração e o Egeu pode reduzir as tensões e abrir caminho para uma coexistência estável."
 GRE_turkey_confrontation: "Confrontar as Ambições Turcas"
 GRE_turkey_confrontation_desc: "As repetidas violações do espaço aéreo grego pela Turquia e as provocações no Egeu não podem ficar sem resposta. A Grécia adotará uma postura firme e mobilizará seus aliados para resistir a novas invasões."
 GRE_aegean_dialogue: "Diálogo do Egeu"
 GRE_aegean_dialogue_desc: "Um canal formal de diálogo sobre os direitos e as fronteiras no Egeu reduz o risco de escalada acidental e prepara o terreno para um acordo marítimo duradouro."
 GRE_migration_cooperation: "Cooperação em Migração"
 GRE_migration_cooperation_desc: "Coordenar a política migratória com a Turquia é essencial para administrar o fluxo de refugiados através do Egeu. Responsabilidade compartilhada significa menos crises para ambos os lados."
 GRE_greco_turkish_trade: "Acordo Comercial Greco-Turco"
 GRE_greco_turkish_trade_desc: "Expandir o comércio bilateral reduz o incentivo ao confronto político. A interdependência econômica entre Grécia e Turquia serve aos interesses de ambos os povos."
 GRE_nato_pressure_turkey: "Pressão da OTAN sobre a Turquia"
 GRE_nato_pressure_turkey_desc: "A Grécia usará sua posição na OTAN para responsabilizar a Turquia por violações das normas da aliança. Nossos aliados precisam reconhecer que a estabilidade no Mediterrâneo Oriental exige contenção turca."
 GRE_aegean_assertiveness: "Assertividade no Egeu"
 GRE_aegean_assertiveness_desc: "A Marinha grega aumentará patrulhas e exercícios em águas disputadas para afirmar a soberania sobre a plataforma continental e o espaço aéreo do Egeu."
 GRE_aegean_deterrence: "Dissuasão no Egeu"
 GRE_aegean_deterrence_desc: "Investir em defesa costeira e em forças de resposta rápida envia um sinal claro de que a Grécia está preparada para defender seu território contra qualquer incursão."
 GRE_enosis_campaign: "Campanha da Enosis"
 GRE_enosis_campaign_desc: "A Grécia lança uma campanha diplomática e cultural para fortalecer os laços com a comunidade cipriota-grega e promover o ideal de uma eventual reunificação com a pátria-mãe."
 GRE_cypriot_economic_integration: "Integração Econômica Cipriota"
 GRE_cypriot_economic_integration_desc: "Aprofundar os laços comerciais e financeiros entre a Grécia e a República de Chipre torna a reunificação economicamente atraente e reforça a influência grega na ilha."
 GRE_northern_outreach: "Aproximação com o Norte"
 GRE_northern_outreach_desc: "A Grécia estende a mão aos cipriotas-turcos no norte, oferecendo incentivos econômicos e intercâmbio cultural para demonstrar que a reunificação serve aos interesses deles tanto quanto aos de qualquer outro."
 GRE_british_bases_accord: "Acordo das Bases Britânicas"
 GRE_british_bases_accord_desc: "O Reino Unido mantém duas Áreas de Base Soberana em Chipre. Chegar a um acordo com Londres garante a neutralidade britânica (ou apoio ativo) a qualquer futuro processo de reunificação."
 GRE_cyprus_gas_exploitation: "Exploração de Gás de Chipre"
 GRE_cyprus_gas_exploitation_desc: "Reservas significativas de gás natural foram descobertas nas águas ao sul de Chipre. A Grécia age para desenvolver esses campos em conjunto, criando interesses econômicos compartilhados em uma ilha unificada."
 GRE_confederation_framework: "Estrutura de Confederação"
 GRE_confederation_framework_desc: "A Grécia propõe um modelo formal de confederação que preserva a autonomia das comunidades enquanto une a ilha sob uma única soberania, uma estrutura que ambas as comunidades podem aceitar."
 GRE_cyprus_reunification: "Reunificação de Chipre"
 GRE_cyprus_reunification_desc: "Com o Impulso de Chipre contando com amplo apoio em ambas as comunidades, a Tensão no Egeu baixa o bastante para que a Turquia não intervenha, o Acordo das Bases Britânicas assegurado e a estrutura de confederação plenamente detalhada, chegou enfim o momento de reunir a ilha."
 GRE_force_enosis: "Forçar a Questão"
 GRE_force_enosis_desc: "A negociação fracassou e a ilha é um barril de pólvora. Em vez de esperar por um acordo que nunca virá, Atenas leva a Enosis ao limite, desafiando o Norte a agir. Se a liderança cipriota-turca de Nicósia reagir primeiro, a República de Chipre terá todo o direito de reunir a ilha pela força."
 GRE_aegean_tension_high_TT: "§BTensão no Egeu acima de §H50§!§!"
 GRE_recognize_unified_cyprus: "Reconhecer a República Unificada de Chipre"
 GRE_recognize_unified_cyprus_desc: "As forças de Nicósia dominaram o Norte. A partição que marcou a ilha por meio século acabou. Atenas reconhece formalmente uma única República de Chipre alinhada à Grécia e ajuda a integrar o território."
 GRE_western_alignment: "Alinhamento Ocidental"
 GRE_western_alignment_desc: "A Grécia reafirma seu lugar no centro da diplomacia ocidental. Como membro fundador da OTAN, ingressante precoce na UE e âncora natural do Mediterrâneo Oriental, Atenas se propõe a converter seu peso geográfico em compromissos políticos vinculantes, iniciando uma campanha de aproximação bilateral e multilateral que será medida em Compromisso Ocidental."
 GRE_franco_hellenic_pact: "Parceria Estratégica Franco-Helênica"
 GRE_franco_hellenic_pact_desc: "Com base na parceria estratégica de setembro de 2021 assinada em Atenas, a Grécia busca um marco bilateral abrangente com a França, cobrindo indústria de defesa, alinhamento de política externa e segurança do Mediterrâneo Oriental. Paris é o parceiro sênior mais disposto da Europa; aproximá-lo ainda mais é a pedra angular de qualquer postura ocidental crível."
 GRE_eastmed_trilateral: "Trilateral do Mediterrâneo Oriental"
 GRE_eastmed_trilateral_desc: "Grécia, Israel e Chipre formalizam sua antiga cooperação trilateral: exercícios navais conjuntos, compartilhamento de inteligência e uma postura coordenada sobre a segurança do Mediterrâneo Oriental. O arranjo transforma três capitais amigas em um único bloco estratégico voltado para a bacia do Levante."
 GRE_eu_political_anchor: "Âncora de Membro Fundador da UE"
 GRE_eu_political_anchor_desc: "A Grécia reafirma sua identidade como membro fundador do projeto europeu. Ao assumir uma voz de liderança em Bruxelas, em coesão, em alargamento e em política externa comum, Atenas converte décadas de filiação em peso político atual."
 GRE_strategic_partnership_treaty: "Cláusula de Defesa Mútua do Artigo 2"
 GRE_strategic_partnership_treaty_desc: "A Grécia leva a parceria franco-helênica à sua conclusão: uma cláusula de defesa mútua vinculante, modelada no Artigo 5, codificada em forma de tratado. A França torna-se a primeira potência europeia obrigada por tratado a defender o território grego, consolidando uma mudança permanente na ordem de segurança do Mediterrâneo."
 GRE_eastmed_gas_forum: "Membro do Fórum de Gás do Mediterrâneo Oriental"
 GRE_eastmed_gas_forum_desc: "A Grécia formaliza seu papel no Fórum de Gás do Mediterrâneo Oriental ao lado de Chipre, Israel, Egito, Itália, Jordânia e Palestina. O arcabouço institucional ancora a cooperação energética regional, garante acesso comercial preferencial para a navegação grega e dá a Atenas um assento permanente à mesa diplomática do Mediterrâneo Oriental."
 GRE_3plus1_dialogue: "Diálogo Estratégico 3+1"
 GRE_3plus1_dialogue_desc: "Grécia, Chipre e Israel formalizam o diálogo 3+1 com os Estados Unidos, um formato respaldado pelo Departamento de Estado que abrange segurança energética, cooperação marítima e combate ao terrorismo. O arranjo dá a Washington um canal estruturado para o trilateral do Mediterrâneo Oriental e coroa a arquitetura regional com o engajamento americano."
 GRE_eu_strategic_compass: "Bússola Estratégica da UE"
 GRE_eu_strategic_compass_desc: "A Grécia torna-se uma defensora enfática da Bússola Estratégica da UE, pressionando por autonomia estratégica europeia, maior integração da PESCO e um pilar europeu dentro da OTAN. Atenas se alinha com Paris e Berlim na defesa continental, trocando a condição de membro discreto por um papel ativo de moldar."
 GRE_pillar_of_the_west: "Pilar do Ocidente"
 GRE_pillar_of_the_west_desc: "O trabalho de anos dá frutos. A Grécia não é a periferia da diplomacia ocidental, mas uma de suas pedras angulares. A profundidade do legado, medida pelo Compromisso Ocidental acumulado ao longo da campanha, determina o quão firmemente Atenas está inserida nessa estrutura."
 GRE_regional_diplomacy: "Diplomacia Regional"
 GRE_regional_diplomacy_desc: "A Grécia é um pilar dos Bálcãs e deve manter relações sólidas com todos os seus vizinhos. A estabilidade na região é inseparável da própria segurança e prosperidade da Grécia."
 GRE_prespa_implementation: "Implementação do Acordo de Prespa"
 GRE_prespa_implementation_desc: "O Acordo de Prespa resolveu uma disputa de décadas sobre o nome da Macedônia do Norte. A Grécia agora cumpre integralmente suas obrigações, normalizando as relações e abrindo caminho para a expansão do comércio."
 GRE_albania_minority: "Direitos da Minoria na Albânia"
 GRE_albania_minority_desc: "Uma minoria grega significativa vive no sul da Albânia. A Grécia busca um diálogo construtivo sobre os direitos das minorias, usando o tema como base para um engajamento bilateral mais profundo, em vez de confronto."
 GRE_egypt_maritime: "Parceria Marítima com o Egito"
 GRE_egypt_maritime_desc: "Grécia e Egito assinam um acordo de delimitação marítima no Mediterrâneo Oriental, criando um marco legal para o desenvolvimento energético conjunto e excluindo as reivindicações turcas da área."
 GRE_italy_mediterranean_axis: "Eixo Itália-Mediterrâneo"
 GRE_italy_mediterranean_axis_desc: "A Itália é o maior parceiro comercial da Grécia na UE, com comércio bilateral superior a doze bilhões de euros por ano. Uma parceria formal amplia a cooperação em energia, transporte e defesa em todo o Mediterrâneo central."
 GRE_balkan_energy_corridor: "Corredor Energético dos Bálcãs"
 GRE_balkan_energy_corridor_desc: "O interconector de gás Grécia-Bulgária e o terminal flutuante de Alexandrópolis transformam a Grécia em um polo crítico de trânsito energético. Um novo gasoduto até a Macedônia do Norte estende essa rede mais fundo nos Bálcãs."
 GRE_mediterranean_energy_hub: "Polo Energético do Mediterrâneo"
 GRE_mediterranean_energy_hub_desc: "Com o FSRU de Alexandrópolis e o terminal de Revithoussa operando a plena capacidade, a Grécia se posiciona como a principal porta de entrada de GNL da Europa, substituindo a dependência de gasodutos russos por suprimento marítimo do Mediterrâneo Oriental e de além."
 GRE_gulf_strategic_partners: "Parceiros Estratégicos do Golfo"
 GRE_gulf_strategic_partners_desc: "A Grécia estabelece um Conselho Supremo de Cooperação Estratégica com a Arábia Saudita e aprofunda os laços de defesa e investimento com os EAU. Capital e cooperação militar do Golfo fluem para o Mediterrâneo Oriental."
 GRE_balkans_eu_advocacy: "Defesa da Adesão dos Bálcãs à UE"
 GRE_balkans_eu_advocacy_desc: "Com base no compromisso da Cúpula de Salônica de 2003, a Grécia defende a adesão dos Bálcãs Ocidentais à UE. Como o membro da UE mais consolidado da região, a Grécia ganha alavancagem de soft power sobre a Sérvia, a Albânia e a Macedônia do Norte."
 GRE_imec_gateway: "Porta de Entrada do IMEC"
 GRE_imec_gateway_desc: "O Corredor Econômico Índia-Oriente Médio-Europa designa o Pireu como seu terminal europeu. Investimentos maciços em portos e logística transformam a Grécia central em um nexo comercial transcontinental que liga a Ásia à Europa."
 GRE_se_european_pillar: "Pilar do Sudeste Europeu"
 GRE_se_european_pillar_desc: "A Grécia consolida sua posição como polo indispensável do sudeste europeu: uma porta de entrada energética, uma patrona dos Bálcãs, uma âncora comercial do Mediterrâneo e o ponto final de um corredor que liga três continentes."
 GRE_eastern_alignment: "Virada para o Leste"
 GRE_eastern_alignment_desc: "Após uma década de austeridade da Troika e tutela atlanticista, Atenas olha para o leste. A Grécia cultivará relações paralelas com a Rússia, a China, o Irã e os Bálcãs ortodoxos e, com o tempo, se remodelará como uma âncora mediterrânea do mundo multipolar."
 GRE_strategic_autonomy: "Autonomia Estratégica"
 GRE_strategic_autonomy_desc: "A Grécia não precisa escolher um único senhor. Um membro da OTAN que ainda compra gás russo, corteja capital do Golfo e chinês e media entre rivais pode extrair concessões de todos os lados. Atenas traça um curso multivetorial, sem dever nada a nenhum bloco e útil a todos."
 GRE_strategic_autonomy_event_TT: "§YUm debate se abre sobre como usar a posição não alinhada da Grécia.§!"
 GRE_russia_outreach: "Abrir Canais com Moscou"
 GRE_russia_outreach_desc: "A Grécia aborda discretamente o Kremlin com uma oferta: contratos de gás natural de longo prazo, maior acesso portuário para a navegação russa e sinais políticos mais calorosos. A resposta de Moscou definirá o tom de uma nova parceria mediterrânea."
 GRE_china_outreach: "Engajar Pequim"
 GRE_china_outreach_desc: "Enviados gregos viajam a Pequim em busca de um engajamento mais profundo: financiamento industrial, telecomunicações, infraestrutura. A aquisição do Pireu pela China já provou o modelo. Agora Atenas propõe ampliá-lo por toda a economia grega."
 GRE_iran_outreach: "Aproximação com Teerã"
 GRE_iran_outreach_desc: "A Grécia, há muito solidária às queixas iranianas contra as sanções, propõe discretamente um marco de escambo e energia fora do SWIFT. O movimento é provocativo em Bruxelas e Washington, mas lucrativo se Teerã concordar."
 GRE_orthodox_outreach: "Irmandade Ortodoxa"
 GRE_orthodox_outreach_desc: "Atenas convoca uma cúpula com Belgrado, Nicósia e Erevan, forjando um alinhamento cultural e político da Europa ortodoxa. A diplomacia dos Patriarcados torna-se arte de governar, construindo um bloco regional que não responde nem a Bruxelas nem a Washington."
 GRE_russia_milcoop: "Conversas de Defesa Helênico-Russas"
 GRE_russia_milcoop_desc: "Após a parceria energética, Atenas propõe cooperação formal de defesa com Moscou: exercícios conjuntos, modernização dos S-300 PMU2 e compartilhamento de inteligência. O sinal político para a OTAN é inequívoco."
 GRE_china_bri_anchor: "Âncora da Nova Rota da Seda"
 GRE_china_bri_anchor_desc: "A Grécia se oferece como âncora europeia da Nova Rota da Seda chinesa, ampliando a presença da COSCO, abrindo novas zonas de livre comércio na Ática e integrando a logística grega às cadeias de suprimento chinesas."
 GRE_iran_med_corridor: "Corredor do Mediterrâneo Oriental"
 GRE_iran_med_corridor_desc: "Atenas propõe um corredor energético Irã-Grécia, escoando petróleo bruto e GNL por intermediários de países terceiros para contornar as sanções ocidentais. Se Teerã aceitar, a Grécia se torna a janela do Irã para a Europa."
 GRE_orthodox_security: "Pacto de Segurança Ortodoxo"
 GRE_orthodox_security_desc: "O Conselho Ortodoxo formaliza um pacto de defesa: treinamento conjunto, cooperação de inteligência e consulta política permanente. Sérvia, Chipre e Armênia se juntam à Grécia em um bloco discreto, mas inequívoco."
 GRE_brics_membership: "Ingressar no BRICS+"
 GRE_brics_membership_desc: "A Grécia adere formalmente ao arcabouço do BRICS+ como primeiro membro europeu. A ruptura com a OTAN agora está completa; em troca, Atenas ganha acesso preferencial ao Novo Banco de Desenvolvimento, ao sistema de liquidação Yuan-Rublo e a um assento à mesa multipolar."
 GRE_multipolar_anchor: "Âncora do Mundo Multipolar"
 GRE_multipolar_anchor_desc: "A Grécia se declara âncora da nova ordem multipolar. A aliança atlântica é renunciada, a União Europeia é deixada e uma república mediterrânea de três continentes (eurasiano, levantino, africano) nasce de Atenas para fora."
 GRE_eastern_outreach: "Aproximação com o Leste"
 GRE_eastern_outreach_desc: "Atenas começou a cultivar parceiros fora da aliança atlântica. A capacidade diplomática flui para o leste e a autonomia da política comercial se amplia, mas as capitais ocidentais observam de perto."
 GRE_eurasian_partner: "Parceiro Eurasiano"
 GRE_eurasian_partner_desc: "A Grécia é agora uma parceira eurasiana reconhecida. Capital de Moscou, Pequim e Teerã sustenta a indústria grega, enquanto a opinião ocidental se endurece. O caminho de volta se estreita."
 GRE_brics_anchor: "Âncora do BRICS"
 GRE_brics_anchor_desc: "A Grécia tem assento à mesa do BRICS+. A aliança atlântica é uma lembrança; o Mediterrâneo é um mar multipolar. Atenas fala com a autoridade de uma dobradiça continental."
 GRE_orthodox_defense_pact: "Pacto de Defesa Ortodoxo"
 GRE_orthodox_defense_pact_desc: "Um pacto de defesa permanente entre a Europa ortodoxa: exercícios conjuntos, doutrina compartilhada e inteligência reunida com Belgrado, Nicósia e Erevan."
 GRE_iran_barter_framework: "Escambo ao Estilo INSTEX"
 GRE_iran_barter_framework_desc: "O comércio greco-iraniano flui por uma câmara de compensação de escambo fora do SWIFT, contornando sanções e abrindo os mercados iranianos aos exportadores gregos."
 GRE_iran_med_corridor_idea: "Corredor Energético do Mediterrâneo Oriental"
 GRE_iran_med_corridor_idea_desc: "Petróleo bruto e GNL iranianos chegam à Europa por um corredor ancorado na Grécia. A capacidade de refino se expande, as reservas de combustível crescem e Atenas se torna um ponto de estrangulamento energético regional."
 GRE_diplomacy_category: "Diplomacia Grega"
 GRE_host_putin_summit: "Sediar uma Cúpula Russa"
 GRE_host_putin_summit_desc: "Convidar o presidente russo a Atenas para uma cúpula bilateral de grande visibilidade. Pastas comerciais são assinadas, fotos são encenadas e as embaixadas ocidentais franzem a testa."
 GRE_cosco_pier_expansion: "Expansão do Cais da COSCO"
 GRE_cosco_pier_expansion_desc: "Cofinanciar outra fase da expansão da COSCO no Pireu. Uma fábrica civil se compromete com o projeto por três meses; em troca, a Ática ganha um espaço permanente de infraestrutura."
 GRE_instex_iran_barter: "Operar o Canal de Escambo com o Irã"
 GRE_instex_iran_barter_desc: "Processar uma parcela do comércio greco-iraniano pela câmara de compensação de escambo, renovando o arcabouço e recompensando os comerciantes que o mantêm vivo."
 GRE_orthodox_patriarchate_summit: "Convocar o Conselho Ortodoxo"
 GRE_orthodox_patriarchate_summit_desc: "Sediar a Cúpula dos Patriarcados em Atenas, reunindo líderes sérvios, cipriotas e armênios para consulta eclesiástica e política."
 GRE_retry_russia_outreach: "Reaproximar-se de Moscou"
 GRE_retry_russia_outreach_desc: "Após a rejeição anterior, diplomatas gregos preparam uma proposta revisada e reabrem os canais com o Kremlin."
 GRE_retry_russia_milcoop: "Repropor Conversas de Defesa"
 GRE_retry_russia_milcoop_desc: "Renovar a proposta de cooperação de defesa helênico-russa com termos mais atraentes e sinalização mais discreta."
 GRE_retry_china_outreach: "Reaproximar-se de Pequim"
 GRE_retry_china_outreach_desc: "Enviar um novo emissário a Pequim levando termos revisados e uma nova rodada de garantias de investimento."
 GRE_retry_china_bri_anchor: "Repropor o Papel de Âncora da BRI"
 GRE_retry_china_bri_anchor_desc: "Revisar a oferta de âncora da BRI com concessões mais amplas em logística, propriedade e alinhamento político."
 GRE_retry_iran_outreach: "Reengajar Teerã"
 GRE_retry_iran_outreach_desc: "Após a recusa inicial de Teerã, Atenas reabre conversas por canais paralelos por meio de intermediários de países terceiros."
 GRE_retry_iran_med_corridor: "Repropor o Corredor do Mediterrâneo"
 GRE_retry_iran_med_corridor_desc: "Revisar a proposta do Corredor do Mediterrâneo Oriental com novas opções de rota que reduzam ainda mais a exposição do Irã à aplicação das sanções ocidentais."
 GRE_retry_orthodox_outreach: "Reconvocar a Cúpula Ortodoxa"
 GRE_retry_orthodox_outreach_desc: "Reparar as relações após a cúpula inicial fracassada e chamar os ministros das Relações Exteriores ortodoxos de volta a Atenas."
 GRE_retry_orthodox_security: "Repropor o Pacto de Segurança"
 GRE_retry_orthodox_security_desc: "Renovar o pacto de segurança ortodoxo com compromissos revisados sobre compartilhamento de inteligência e rodízio de exercícios."
 greece.530.t: "Proposta Energética Grega"
 greece.530.d: "Atenas propõe uma parceria abrangente de energia e comércio: contratos de gás de longo prazo, concessões portuárias para a navegação russa e um discreto realinhamento da política externa grega em direção a Moscou. O ministro das Relações Exteriores helênico aguarda uma resposta."
 greece.530.a: "Uma abertura bem-vinda. Assinar."
 greece.530.b: "Atenas não pode cumprir suas promessas. Recusar."
 greece.531.t: "Moscou Aceita a Parceria"
 greece.531.d: "O Kremlin aceita a proposta grega. Pastas comerciais são trocadas, um acordo bilateral aprimorado é assinado e o gás russo começa a fluir em condições favoráveis. Atenas tem seu primeiro parceiro oriental."
 greece.531.a: "Bem-vindos à nova política externa helênica."
 greece.532.t: "Moscou Recusa"
 greece.532.d: "O Kremlin recusa educadamente a abertura grega. Sem garantias firmes de que Atenas deixará a aliança atlântica, Moscou não tem incentivo para correr riscos políticos. O revés é real, mas a porta não está fechada."
 greece.532.a: "Reagrupar e tentar de novo."
 greece.533.t: "Proposta Grega de Cooperação em Defesa"
 greece.533.d: "Atenas propõe um marco formal de defesa helênico-russo: exercícios conjuntos, apoio à modernização dos S-300 PMU2 e compartilhamento de inteligência. Moscou pesa o prêmio político contra a reação diplomática da OTAN."
 greece.533.a: "Um alinhamento histórico. Aceitar."
 greece.533.b: "A Grécia ainda é membro da OTAN. Recusar."
 greece.534.t: "Moscou Aceita as Conversas de Defesa"
 greece.534.d: "O ministério da defesa russo concorda com a cooperação formal. Oficiais gregos viajam a Moscou para treinamento; engenheiros russos chegam à Base Naval de Salamina. O bônus de doutrina terrestre é significativo, mas o custo político também."
 greece.534.a: "A cooperação em armamentos helênico-russa começa."
 greece.535.t: "Moscou Recusa as Conversas de Defesa"
 greece.535.d: "Moscou recusa, citando as obrigações contínuas da Grécia com a OTAN. Até que Atenas deixe a aliança atlântica, ou ao menos sinalize uma intenção crível de fazê-lo, não haverá cooperação formal em defesa."
 greece.535.a: "Registrar a exigência de maior comprometimento."
 greece.536.t: "Aproximação Grega a Pequim"
 greece.536.d: "Atenas se aproxima de Pequim com uma proposta de engajamento econômico aprofundado: telecomunicações, financiamento de infraestrutura e maior integração à BRI. O ministério das Relações Exteriores chinês analisa a proposta."
 greece.536.a: "Uma combinação natural. Endossar."
 greece.536.b: "Os custos políticos superam os benefícios. Recusar."
 greece.537.t: "Pequim Aceita"
 greece.537.d: "A liderança chinesa endossa a parceria. Capital estatal começa a fluir para projetos industriais e de telecomunicações gregos, e a influência grega nos cálculos de Pequim aumenta de forma mensurável."
 greece.537.a: "A parceria sino-helênica se aprofunda."
 greece.538.t: "Pequim Recusa"
 greece.538.d: "Pequim se esquiva: Atenas, argumenta, não pode oferecer o que já está garantido por canais mais discretos. Os diplomatas gregos voltam de mãos vazias, mas não desanimados."
 greece.538.a: "Reavaliar e tentar de novo."
 greece.539.t: "Proposta Grega de Âncora da BRI"
 greece.539.d: "Atenas se oferece como âncora europeia da Nova Rota da Seda: concessões estendidas à COSCO, zonas de livre comércio na Ática e alinhamento político em questões do Indo-Pacífico. O preço é alto, mas o prêmio também."
 greece.539.a: "Uma âncora de ambição histórica. Aceitar."
 greece.539.b: "Os termos ainda não são aceitáveis. Recusar."
 greece.540.t: "Pequim Endossa a Âncora da BRI"
 greece.540.d: "A China designa formalmente a Grécia como âncora da BRI. Equipes de construção se mobilizam; capital inunda a Ática; uma fábrica civil extra surge na região da capital, enquanto o investimento chinês sustenta a indústria grega."
 greece.540.a: "A Grécia é o terminal europeu da Nova Rota da Seda."
 greece.541.t: "Pequim Recusa o Papel de Âncora"
 greece.541.d: "Pequim recusa a designação formal de âncora, julgando a volatilidade política grega alta demais para se comprometer nessa escala. Atenas deve demonstrar um alinhamento mais firme antes que a oferta seja renovada."
 greece.541.a: "Os termos precisam ser revistos."
 greece.542.t: "Aproximação Grega a Teerã"
 greece.542.d: "Um enviado grego em Teerã propõe um marco de escambo e comércio fora do SWIFT, concebido para contornar as sanções ocidentais e abrir os mercados iranianos aos exportadores gregos. O Conselho Supremo de Segurança Nacional debate a oferta."
 greece.542.a: "Um bem-vindo parceiro da Europa. Aceitar."
 greece.542.b: "Atenas fala pelo Ocidente. Recusar."
 greece.543.t: "Teerã Aceita o Marco"
 greece.543.d: "Teerã concorda. A câmara de compensação de escambo é estabelecida em Atenas, e os exportadores gregos ganham acesso preferencial aos mercados iranianos. As capitais ocidentais não ficam satisfeitas."
 greece.543.a: "A primeira entrada europeia no sistema iraniano."
 greece.544.t: "Teerã Recusa"
 greece.544.d: "Teerã recusa. A Grécia, observa o ministro das Relações Exteriores iraniano, ainda é um Estado da OTAN, e qualquer marco seria vulnerável a sanções secundárias americanas no instante em que fosse ativado."
 greece.544.a: "Demonstrar independência primeiro."
 greece.545.t: "Proposta Grega do Corredor do Mediterrâneo"
 greece.545.d: "Atenas propõe o Corredor do Mediterrâneo Oriental: petróleo bruto e GNL iranianos escoados por intermediários de países terceiros até terminais gregos e, dali, para a Europa. O lado iraniano pesa as vantagens contra a retaliação americana."
 greece.545.a: "O corredor é um prêmio estratégico. Aceitar."
 greece.545.b: "A exposição é grande demais. Recusar."
 greece.546.t: "Teerã Endossa o Corredor"
 greece.546.d: "Teerã endossa o corredor. O petróleo bruto iraniano começa a chegar aos portos gregos; a capacidade de refino se expande pela Ática e pela Beócia. A Grécia se torna um ponto de estrangulamento energético do Mediterrâneo, e Teerã, uma beneficiária discreta."
 greece.546.a: "O Corredor Energético do Mediterrâneo Oriental está aberto."
 greece.547.t: "Teerã Recusa o Corredor"
 greece.547.d: "Teerã recusa, citando a contrapressão americana sobre os Estados intermediários. O corredor é arquivado; ambas as capitais o reverão quando as condições permitirem."
 greece.547.a: "Esperar por um momento melhor."
 greece.548.t: "Atenas Convoca o Conselho Ortodoxo"
 greece.548.d: "Atenas propõe uma consulta política permanente entre os Estados ortodoxos da Europa: Sérvia, Chipre, Armênia e outros. A diplomacia dos Patriarcados é oferecida como fachada; a arte de governar é a verdadeira intenção."
 greece.548.a: "Uma irmandade tardia. Aceitar."
 greece.548.b: "Os riscos superam os ganhos. Recusar."
 greece.549.t: "Belgrado Endossa o Conselho"
 greece.549.d: "Belgrado endossa a proposta, e Nicósia a segue. O Conselho Ortodoxo se reúne em Atenas com os ministros das Relações Exteriores da Grécia, da Sérvia e de Chipre. Um bloco discreto, mas inequívoco, se formou."
 greece.549.a: "Nasce um bloco ortodoxo."
 greece.550.t: "Belgrado Recusa"
 greece.550.d: "Belgrado recusa, citando preocupações em provocar Bruxelas e complicar a adesão sérvia à UE. O projeto ortodoxo é adiado, não morto."
 greece.550.a: "Paciência. O momento chegará."
 greece.551.t: "Proposta Grega de Pacto de Segurança"
 greece.551.d: "Atenas propõe formalizar o bloco ortodoxo em um pacto de defesa: treinamento conjunto, inteligência reunida e consulta política permanente. Belgrado pesa o prêmio contra a inevitável reação de Bruxelas."
 greece.551.a: "O pacto nos fortalece a todos. Aceitar."
 greece.551.b: "Belgrado não pode arriscar. Recusar."
 greece.552.t: "Pacto de Defesa Ortodoxo Assinado"
 greece.552.d: "Belgrado, Nicósia e Erevan se juntam a Atenas para formalizar o Pacto de Defesa Ortodoxo. Os exercícios conjuntos começam; os canais de inteligência se abrem; um polo europeu discreto apareceu no mapa."
 greece.552.a: "Uma arquitetura de segurança ortodoxa é estabelecida."
 greece.553.t: "Belgrado Recusa o Pacto"
 greece.553.d: "Belgrado recusa o pacto formal, julgando o custo diplomático alto demais enquanto as negociações de adesão à UE estão ativas. O bloco ortodoxo permanece, mas de modo informal."
 greece.553.a: "Seguir em frente por outros meios."
 greece.554.t: "Bem-vinda ao BRICS+"
 greece.554.d: "Os líderes do BRICS+ dão formalmente as boas-vindas à Grécia como o primeiro membro europeu da aliança. Enviados russos, chineses, indianos e iranianos chegam a Atenas para a cerimônia de adesão. O capítulo atlântico está encerrado."
 greece.554.a: "Atenas assume seu lugar à mesa multipolar."
 greece.555.t: "Grécia Ancora o Mundo Multipolar"
 greece.555.d: "A Grécia renunciou formalmente à aliança atlântica e à União Europeia, declarando-se âncora da nova ordem multipolar. A república mediterrânea de três continentes foi proclamada a partir de Atenas. O mundo se rearranja de acordo."
 greece.555.a: "O futuro helênico começou."
 greece.555.b: "O Ocidente perdeu seu flanco mediterrâneo."
 greece.555.c: "Um novo polo surgiu. Observar com atenção."
 CYP_seek_greek_union: "Buscar União com a Grécia"
 CYP_seek_greek_union_desc: "A República de Chipre busca iniciativas diplomáticas formais para fortalecer os laços com a Grécia, rumo a uma eventual união política."
 CYP_appeal_to_un: "Apelar às Nações Unidas"
 CYP_appeal_to_un_desc: "Chipre leva a questão da reunificação perante as Nações Unidas, buscando legitimidade internacional para um acordo que sirva à comunidade cipriota-grega."
 CYP_economic_incentive_north: "Incentivos Econômicos ao Norte"
 CYP_economic_incentive_north_desc: "Chipre estende ofertas econômicas às comunidades cipriotas-turcas no norte, demonstrando que a reunificação traz benefícios tangíveis a todos os habitantes da ilha."
 NCY_seek_turkish_union: "Buscar União com a Turquia"
 NCY_seek_turkish_union_desc: "O Norte de Chipre aprofunda os laços políticos e econômicos com a Turquia, avançando a perspectiva de unificação formal sob liderança turca."
 NCY_recognition_campaign: "Campanha de Reconhecimento Internacional"
 NCY_recognition_campaign_desc: "O Norte de Chipre lança uma campanha diplomática para obter maior reconhecimento internacional, legitimando seu governo aos olhos da comunidade mais ampla de nações."
 GRE_aegean_defense_posture: "Postura de Defesa no Egeu"
 GRE_aegean_defense_posture_desc: "Prontidão elevada e forças posicionadas à frente mantêm as forças armadas helênicas em alto estado de alerta. Cada interceptação, cada patrulha, cada exercício é um sinal de que o território grego será defendido."
 GRE_cypriot_integration_idea: "Integração Econômica Cipriota"
 GRE_cypriot_integration_idea_desc: "A profunda integração econômica com a República de Chipre, incluindo união aduaneira e harmonização bancária, fortalece os laços comerciais e gera receita sustentada de imposto corporativo para ambas as economias."
 GRE_north_macedonian_ties: "Laços com a Macedônia do Norte"
 GRE_north_macedonian_ties_desc: "A normalização das relações com Skopje após o Acordo de Prespa abriu novos canais diplomáticos nos Bálcãs, gerando boa vontade que se traduz em alavancagem política."
 GRE_chinese_investment: "Investimento Chinês em Infraestrutura"
 GRE_chinese_investment_desc: "O capital estatal chinês está financiando projetos de infraestrutura e construção industrial em toda a Grécia, acelerando programas de obras que o orçamento doméstico não consegue cobrir sozinho."
 GRE_lng_gateway: "Porta de Entrada do GNL"
 GRE_lng_gateway_desc: "A Grécia se posicionou como o principal ponto de desembarque de gás natural liquefeito da Europa, fornecendo energia independente de gasodutos a parceiros regionais."
 GRE_balkan_advocate: "Defensora dos Bálcãs na UE"
 GRE_balkan_advocate_desc: "Como principal defensora da adesão dos Bálcãs Ocidentais à UE, a Grécia exerce crescente influência de soft power sobre seus vizinhos do norte."
 GRE_imec_terminus: "Terminal Europeu do IMEC"
 GRE_imec_terminus_desc: "A designação do Pireu como ponto final europeu do Corredor Econômico Índia-Oriente Médio-Europa traz receitas de trânsito e investimentos em infraestrutura substanciais."
 GRE_regional_pillar: "Pilar do Sudeste Europeu"
 GRE_regional_pillar_desc: "A Grécia garantiu um papel como polo indispensável da vizinhança do sudeste europeu, projetando influência por canais de energia, comércio e diplomacia."
 GRE_epirus_cultural_ties: "Laços Culturais com o Épiro"
 GRE_epirus_cultural_ties_desc: "Um marco formal de direitos das minorias com Tirana estabilizou as comunidades de língua grega do sul da Albânia, transformando um antigo irritante em um discreto ativo diplomático."
 GRE_italo_hellenic_axis: "Eixo Ítalo-Helênico"
 GRE_italo_hellenic_axis_desc: "Uma política industrial coordenada e programas compartilhados de estaleiros com Roma aproximaram Atenas e a península italiana em um único espaço econômico mediterrâneo."
 GRE_balkan_gas_transit: "Trânsito de Gás nos Bálcãs"
 GRE_balkan_gas_transit_desc: "A expansão do gasoduto IGB encaminha gás do Cáspio e do Mediterrâneo Oriental através do território grego para os Bálcãs em geral, gerando receita de trânsito sustentada."
 GRE_gulf_capital_inflow: "Entrada de Capital do Golfo"
 GRE_gulf_capital_inflow_desc: "Fundos soberanos da península Arábica entraram na indústria e na logística gregas, acelerando a formação de capital em toda a economia."
 GRE_eez_delimitation: "Acordo de Delimitação da ZEE"
 GRE_eez_delimitation_desc: "Um acordo bilateral de zona econômica exclusiva com o Cairo dá aos navios gregos rotas livres pelo Mediterrâneo Oriental e um marco legal contra reivindicações marítimas rivais."
 greece.500.t: "Morte de Stephen Saunders"
 greece.500.d: "O adido de defesa britânico Stephen Saunders foi assassinado em Atenas pela organização terrorista 17 de Novembro. O ataque descarado atraiu condenação internacional e colocou enorme pressão sobre os serviços de segurança gregos para desmantelar o grupo."
 greece.500.a: "Reprimir o terrorismo interno"
 greece.500.b: "Cooperar com a inteligência internacional"
 greece.501.t: "Julgamento da Organização Revolucionária"
 greece.501.d: "Os membros capturados do 17 de Novembro estão sendo julgados em Atenas. Após décadas escapando da justiça, a liderança do grupo enfrenta processo por uma série de assassinatos e atentados a bomba. O julgamento é um marco para o combate ao terrorismo na Grécia."
 greece.501.a: "Aplicar sentenças severas"
 greece.501.b: "Aproveitar a oportunidade para reformar os serviços de segurança"
 greece.502.t: "Protestos contra a Guerra ao Terror"
 greece.502.d: "Maciços protestos contra a guerra eclodiram por toda a Grécia em resposta à invasão do Iraque. Dezenas de milhares tomaram as ruas de Atenas e Salônica, refletindo a profunda oposição pública à campanha liderada pelos Estados Unidos."
 greece.502.a: "Permitir manifestações pacíficas"
 greece.502.b: "Restringir os protestos para manter a ordem"
 greece.503.t: "Queda do Voo 522 da Helios Airways"
 greece.503.d: "O Voo 522 da Helios Airways caiu perto de Grammatiko após voar em piloto automático como um voo fantasma, matando todos os 121 passageiros e tripulantes. A tragédia, causada por uma falha na pressurização da cabine, levantou sérias questões sobre a fiscalização da segurança da aviação na Grécia."
 greece.503.a: "Lançar reformas de segurança da aviação"
 greece.503.b: "Decretar um dia nacional de luto"
 greece.504.t: "Protestos Curdos em Atenas"
 greece.504.d: "Membros da diáspora curda em Atenas organizaram grandes manifestações em apoio aos direitos curdos. Os protestos chamaram a atenção de Ancara, que vê com desconfiança qualquer apoio ao ativismo curdo no exterior."
 greece.504.a: "Permitir que os protestos continuem"
 greece.504.b: "Dispersar as multidões"
 greece.505.t: "Protestos pela Crise em Gaza"
 greece.505.d: "Manifestações pró-Palestina eclodiram em cidades gregas em resposta à escalada da crise em Gaza. Os manifestantes pedem que o governo adote uma postura mais firme contra as operações militares e forneça ajuda humanitária."
 greece.505.a: "Expressar solidariedade aos manifestantes"
 greece.505.b: "Pedir moderação e soluções diplomáticas"
 greece.506.t: "Incêndios Florestais Gregos de 2007"
 greece.506.d: "Devastadores incêndios florestais varreram o Peloponeso e a Eubeia, matando dezenas de pessoas e destruindo aldeias inteiras. Os incêndios expuseram fragilidades críticas na capacidade de resposta a desastres da Grécia e despertaram a ira pública contra a condução da crise pelo governo."
 greece.506.a: "Mobilizar recursos de emergência"
 greece.506.b: "Solicitar assistência internacional"
 greece.507.t: "Morte de Alexandros Grigoropoulos"
 greece.507.d: "Alexandros Grigoropoulos, de quinze anos, foi baleado e morto por um policial no distrito de Exarchia, em Atenas. O tiroteio desencadeou os piores distúrbios que a Grécia viu em décadas, com destruição generalizada nas principais cidades."
 greece.507.a: "Processar os policiais responsáveis"
 greece.507.b: "Destacar a polícia de choque para restaurar a ordem"
 greece.508.t: "Incêndios Florestais Gregos de 2009"
 greece.508.d: "Outra devastadora temporada de incêndios florestais atingiu a Grécia, assolando florestas e ameaçando povoados na Ática e no leste do Peloponeso. Apesar das lições de 2007, a infraestrutura de combate a incêndios do país continua sobrecarregada."
 greece.508.a: "Investir em infraestrutura de prevenção de incêndios"
 greece.508.b: "Concentrar o socorro nas comunidades afetadas"
 greece.509.t: "Aurora Dourada Entra no Parlamento"
 greece.509.d: "O partido de extrema direita Aurora Dourada conquistou assentos parlamentares pela primeira vez, capitalizando a fúria pública com a austeridade e a crise econômica. Sua retórica abertamente nacionalista e violenta alarmou as instituições democráticas de toda a Europa."
 greece.509.a: "Monitorar de perto suas atividades"
 greece.509.b: "Ignorá-los como um movimento marginal"
 greece.510.t: "Formação do Partido Solução Grega"
 greece.510.d: "O apresentador de televisão Kyriakos Velopoulos fundou o partido Solução Grega, posicionando-o como uma alternativa conservadora-nacionalista. O partido atrai eleitores desiludidos tanto com a direita tradicional quanto com a franja de extrema direita."
 greece.510.a: "Reconhecer o novo panorama político"
 greece.510.b: "Descartá-los como populistas"
 greece.511.t: "Morte de Pavlos Fyssas"
 greece.511.d: "O rapper antifascista Pavlos Fyssas foi morto a facadas por um membro do Aurora Dourada em Keratsini. O assassinato provocou indignação nacional e intensificou os pedidos para que o governo tome medidas decisivas contra a rede violenta do partido."
 greece.511.a: "Reprimir o Aurora Dourada"
 greece.511.b: "Pedir calma e o devido processo legal"
 greece.512.t: "Julgamento dos Membros do Aurora Dourada"
 greece.512.d: "A liderança do Aurora Dourada vai a julgamento no maior processo criminal contra um partido político na história europeia. As acusações incluem chefiar uma organização criminosa, assassinato e múltiplas agressões contra imigrantes e opositores políticos."
 greece.512.a: "Pressionar por penas máximas"
 greece.512.b: "Deixar a justiça seguir seu curso"
 greece.513.t: "Grande Terremoto no Egeu"
 greece.513.d: "Um poderoso terremoto atingiu o leste do Egeu, perto de Lesbos, causando danos e vítimas significativos. A Turquia também foi afetada, abrindo uma rara oportunidade de cooperação bilateral no socorro a desastres entre os dois vizinhos."
 greece.513.a: "Lançar um esforço nacional de socorro"
 greece.513.b: "Cooperar com a Turquia no socorro"
 greece.514.t: "Incêndios Florestais da Ática de 2018"
 greece.514.d: "Incêndios florestais catastróficos varreram o leste da Ática, matando mais de cem pessoas na cidade litorânea de Mati. É o desastre de incêndio mais mortal da história grega, expondo falhas sistêmicas no planejamento de emergência e na defesa civil."
 greece.514.a: "Reformular os sistemas de defesa civil"
 greece.514.b: "Prestar ajuda imediata às vítimas"
 greece.515.t: "Outro Terremoto em Atenas"
 greece.515.d: "Um terremoto atingiu a região de Atenas, danificando edifícios e causando alarme generalizado na capital. Embora as vítimas sejam poucas, o evento reacendeu o debate sobre a resistência sísmica da infraestrutura envelhecida da Grécia."
 greece.515.a: "Reforçar os códigos de construção"
 greece.515.b: "Prestar socorro de emergência"
 greece.517.t: "Grande Terremoto no Egeu"
 greece.517.d: "Um poderoso terremoto atingiu o leste do Egeu, perto de Lesbos, causando danos e vítimas significativos. A Turquia também foi afetada, abrindo uma rara oportunidade de cooperação bilateral no socorro a desastres entre os dois vizinhos."
 greece.517.a: "Mobilizar esforços de socorro"
 greece.518.t: "Incêndios Florestais da Ática de 2018"
 greece.518.d: "Incêndios florestais catastróficos varreram o leste da Ática, matando mais de cem pessoas na cidade litorânea de Mati. É o desastre de incêndio mais mortal da história grega, expondo falhas sistêmicas no planejamento de emergência e na defesa civil."
 greece.518.a: "Iniciar a resposta de emergência"
 greece.519.t: "Outro Terremoto em Atenas"
 greece.519.d: "Um terremoto atingiu a região de Atenas, danificando edifícios e causando alarme generalizado na capital. Embora as vítimas sejam poucas, o evento reacendeu o debate sobre a resistência sísmica da infraestrutura envelhecida da Grécia."
 greece.519.a: "Coordenar os serviços de emergência"
 greece.620.t: "Uma Questão de União"
 greece.620.d: "Atenas convidou formalmente a República de Chipre a completar a confederação e se reunificar com o Estado helênico. A decisão cabe a Nicósia."
 greece.620.a: "Ingressar na união helênica"
 greece.620.b: "Permanecer uma república independente"
 greece.621.t: "A Questão do Norte"
 greece.621.d: "A proposta grega se estende ao norte da ilha. A reunificação sob Atenas dissolveria a administração separada do norte e colocaria seu território dentro do Estado helênico."
 greece.621.a: "Aceitar a reunificação"
 greece.621.b: "Rejeitar a proposta"
 greece.630.t: "Um Apelo de Atenas"
 greece.630.d: "A Grécia pediu à Turquia que ajude a aliviar a crise habitacional que pressiona suas cidades. A cooperação aliviaria o fardo de Atenas e marcaria um raro momento de boa vontade entre os dois vizinhos."
 greece.630.a: "Oferecer apoio"
 greece.630.b: "Recusar-se a intervir"
 greece.631.t: "A Ajuda Turca Chega"
 greece.631.d: "A ajuda e o apoio à construção turcos começaram a fluir para a Grécia, aliviando o pior da escassez de moradias e suavizando as relações através do Egeu."
 greece.631.a: "Uma mão bem-vinda"
 greece.632.t: "Sem Ajuda de Ancara"
 greece.632.d: "A Turquia recusou-se a se envolver nos problemas habitacionais da Grécia. Atenas terá de administrar a crise sozinha."
 greece.632.a: "Nos bastamos"
 greece.641.t: "Uma Temporada Recorde"
 greece.641.d: "O verão quebrou todos os recordes de chegadas. Os hotéis estão lotados, os aeroportos fervilham e a receita não para de entrar. A questão é quem se beneficia do lucro inesperado."
 greece.641.a: "Reinvestir nas ilhas"
 greece.641.b: "Deixar os operadores ficarem com ele"
 greece.642.t: "A Diáspora Responde"
 greece.642.d: "O apelo aos gregos no exterior tocou uma corda sensível. Promessas de investimento e remessas chegam de comunidades do mundo todo, ansiosas para ver a pátria se recuperar."
 greece.642.a: "Lançar um fundo soberano da diáspora"
 greece.642.b: "Igualar as remessas com alívio fiscal"
 greece.643.t: "Bruxelas Abre as Torneiras"
 greece.643.d: "A primeira parcela do financiamento de recuperação foi aprovada. Dezenas de bilhões estão a caminho, condicionados a reformas e à capacidade da Grécia de realmente gastar o dinheiro dentro do prazo."
 greece.643.a: "Antecipar os projetos"
 greece.643.b: "Gastar com cuidado"
 greece.650.t: "A Doutrina Multivetorial"
 greece.650.d: "Atenas declarou que negociará com o Oriente e o Ocidente igualmente, em seus próprios termos. O gabinete debate a melhor forma de transformar essa independência em influência."
 greece.650.a: "Diversificar nossos parceiros de energia e comércio"
 greece.650.b: "Posicionar a Grécia como mediadora regional"
 greece_military.01.t: "Hellenic Defence Systems Formada"
 greece_military.01.d: "A Pyrkal e a Indústria de Armas Helênica foram fundidas em uma única empresa estatal, a Hellenic Defence Systems. A consolidação visa agilizar as aquisições, padronizar a produção e reconstruir a capacidade industrial de defesa nacional sob uma única estrutura de gestão."
 greece_military.01.a: "Nasce um campeão nacional"
 greece_military.02.t: "Marinha Grega Desafia Nossas Águas"
 greece_military.02.d: "A Grécia concluiu sua estratégia de águas soberanas e agora reivindica abertamente águas disputadas do Egeu e de Creta. Sua expansão naval é um desafio direto à nossa posição no Mediterrâneo Oriental."
 greece_military.02.a: "Expandir a Frota"
 greece_military.02.b: "Apresentar um Protesto Diplomático"
 greece.516.t: "Movimento Nacionalista Ganha Força"
 greece.516.d: "Os nacionalistas do ELAM, apoiados pela Grécia, vêm espalhando sua influência por nossa ilha. Sua retórica defende a união com a Grécia e encontrou público receptivo em parte da população. Podemos tolerar sua presença ou reprimi-los ao custo de agitação pública."
 greece.516.a: "Deixá-los atuar"
 greece.516.b: "Suprimir o movimento"
 greece_debt.1.t: "O Parceiro da Troca de Dívida"
 greece_debt.1.desc: "As contas continuam chegando e o tesouro continua encolhendo. Nosso ministro das Finanças propôs trocar parte de nossa dívida denominada em euros por moedas estrangeiras por meio do banco central de uma nação parceira. O novo detentor cobraria juros, mas a taxas negociáveis e em condições mais amigáveis do que as de nossos credores atuais. Índia, Rússia, China ou o BCE poderiam ser parceiros, mas cada um tem seu próprio preço político."
 greece_debt.1.a: "Talvez a Rúpia"
 greece_debt.1.b: "Talvez o Rublo"
 greece_debt.1.c: "O Yuan pode ser uma boa escolha"
 greece_debt.1.e: "Manter o rumo"
 GRE_debt_swap_accept_tt: "§GSe aceitarem:§! eles compram uma parte de nossa dívida, tornando-se um credor a quem devemos juros, aliviando nosso balanço agora em troca de pagamentos constantes depois."
 GRE_debt_counter_refund_tt: "Recusamos a contraproposta. O capital adiantado pelo possível credor é reembolsado integralmente."
 greece_debt.2.a: "Devemos recusar"
 greece_debt.2.b: "Assumiremos a dívida deles"
 GRE_homelessness_crisis_idea: "A Crise dos Sem-Teto de Atenas"
 GRE_homelessness_crisis_idea_desc: "O terremoto de Atenas deixou milhares de desabrigados dormindo em parques. Os serviços sociais estão sobrecarregados e favelas de barracas se espalham pela capital. Quanto mais esperamos para agir, pior fica."
 GRE_the_drachma_idea: "O Dracma"
 GRE_the_drachma_idea_desc: "Operar fora da Zona do Euro significa administrar o dracma por conta própria. A instabilidade cambial e os custos de empréstimo mais altos pesam sobre a economia, mas um dracma mais fraco mantém as exportações gregas competitivas e aumenta os ganhos nos mercados internacionais."
 GRE_solving_tax_evasion_idea: "Resolvendo as Brechas Fiscais"
 GRE_solving_tax_evasion_idea_desc: "Resolver as brechas fiscais nos permitirá eliminar as lacunas, mas exigirá um grande número de comissões e a reavaliação de nosso código tributário nacional."
 GRE_tax_evasion_idea: "Evasão Fiscal Desenfreada"
 GRE_tax_evasion_idea_desc: "A evasão fiscal está profundamente enraizada na vida fiscal grega e drena a receita do governo. Sem dinheiro para financiar serviços básicos e reformas, o Estado fica paralisado."
 GRE_bonds_issued_idea: "Títulos de Curto Prazo e Juros Altos"
 GRE_bonds_issued_idea_desc: "Emitimos títulos de curto prazo com juros altos. A injeção de caixa ajuda agora, mas os rendimentos elevados serão um fardo até o vencimento da dívida."
