 BOS_croat_balkan_aspiration: "Les aspirations de la Croatie dans les Balkans"
 BOS_post_yugoslav_war_state: "État d'après-guerre de Yougoslavie"
 BOS_post_yugoslav_war_state_desc: "La Bosnie est l'une des quatre républiques qui ont réussi à déclarer leur indépendance lors des guerres yougoslaves des années 90. Et des quatre, c'est celui qui a connu le plus d'horreurs, avec des milliers de réfugiés fuyant le pays. De vastes zones de terres sont souillées par des mines terrestres et des engins non explosés. Beaucoup de ses anciens citoyens vivent désormais à l’étranger. Ces événements ont conféré à l’ONU une nouvelle réputation – disgracieuse – : celle d’une organisation incapable ou peu disposée à protéger ceux qui sont en danger."
