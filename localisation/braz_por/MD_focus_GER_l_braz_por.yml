 GER_Bundeswehr_modifier: "Senhor"
 GER_Bundeswehr_modifier_desc: "O Heer alemão no ano 2000 está em uma encruzilhada. Tendo sido projetado e estruturado principalmente como um exército da Guerra Fria, seu foco principal era a defesa contra um potencial conflito de larga escala com o Pacto de Varsóvia na Europa Central. No entanto, com o fim da Guerra Fria e a reunificação da Alemanha, o Heer enfrenta o desafio de se transformar para atender a novos e diversos requisitos de missão em um ambiente de segurança global em rápida mudança."
