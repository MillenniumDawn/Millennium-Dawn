 module_naval_recon_drone_1: "Dron de reconocimiento naval I"
 module_naval_recon_drone_1_desc: "Los drones de reconocimiento lanzados desde buques extienden los ojos de la flota mucho más allá del horizonte, proporcionando una vigilancia persistente y una rápida confirmación de objetivos sin arriesgar aeronaves tripuladas.\n\n§GConsejo de diseño: Los drones de reconocimiento naval mejoran enormemente la detección de superficie y la detección de submarinos al tiempo que refuerzan los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Son ideales para buques avanzados de exploración y adquisición de objetivos, pero conllevan altos costes de capacidad industrial (IC) y microchips.§!"
