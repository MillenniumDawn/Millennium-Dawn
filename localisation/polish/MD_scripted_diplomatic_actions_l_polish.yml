 RECALL_VOLUNTEERS_TITLE: "Przypomnijmy Siły Interwencyjne"
 RECALL_VOLUNTEERS_ACTION_DESC: "W każdej chwili możemy zdecydować o odwołaniu naszych sił interwencyjnych."
 RECALL_VOLUNTEERS_TOOLTIP: "§Y[This.GetNameWithFlag]§! §Rmuszą mieć od nas aktywne siły interwencyjne, które możemy wycofać.§!"
 RECALL_VOLUNTEERS_TOOLTIP_G: "§Y[This.GetNameWithFlag]§! muszą mieć od nas aktywne siły interwencyjne, które możemy wycofać."
 RECALL_VOLUNTEERS_SEND_DESC: "Walka §Y[This.GetNameWithFlag]§! w którym się znajduje, nie jest już naszą walką. Nadszedł czas, abyśmy wycofali nasze siły z konfliktu.\n\n§YTa akcja wycofa nasze Siły Interwencyjne z [This.GetNameWithFlag]§!"
