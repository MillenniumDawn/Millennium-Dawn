 KOR_cloud_computing: "Computación en la nube de LG"
 KOR_cloud_computing_desc: "Una iniciativa nacional para la transición del gobierno y la industria privada a sistemas basados ​​en la nube."
 KOR_ai_focus: "Enfoque en la inteligencia artificial"
 KOR_ai_focus_desc: "El desarrollo de la IA debe ser una prioridad nacional para la automatización, la I+D militar y la ciberseguridad."
 KOR_economics_improvement: "Programa de Mejora Económica"
 KOR_economics_improvement_desc: "Lanzaremos una amplia iniciativa para fortalecer a nuestras corporaciones nacionales y asegurar nuestra influencia global."
 KOR_naver: "Expansión tecnológica de Naver"
 KOR_naver_desc: "Naver desempeñará un papel central en los medios de comunicación, la tecnología y la infraestructura digital."
 KOR_webtoon: "Exportación global de webtoons"
 KOR_webtoon_desc: "Los webtoons coreanos son una exportación cultural emergente. Invertir en ellos apoya el poder blando."
 KOR_naver_news: "Dominio de Naver News"
 KOR_naver_news_desc: "El control de las plataformas de noticias fortalece la influencia nacional y el alcance internacional."
 KOR_hyundai: "Industrias pesadas de Hyundai"
 KOR_hyundai_desc: "Hyundai se encargará de proyectos de construcción naval industrial a gran escala y de extracción de energía."
 KOR_offshore_industry: "Expandir la industria extraterritorial"
 KOR_offshore_industry_desc: "Modernizaremos y ampliaremos nuestra infraestructura marítima para el crecimiento económico y la seguridad energética."
 KOR_offshore_oil: "Proyectos petroleros en alta mar"
 KOR_offshore_oil_desc: "La explotación de nuevas reservas submarinas garantiza que satisfagamos la creciente demanda energética."
 KOR_offshore_natural_gas: "Campos de gas natural en alta mar"
 KOR_offshore_natural_gas_desc: "La extracción de gas natural aumentará los ingresos y reducirá la dependencia energética."
 KOR_offshore_barge: "Construcción de barcazas y plataformas"
