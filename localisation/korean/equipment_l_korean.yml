 TRK_infantry_weapons_1_desc: "1959년에 개발된 AKM은 미하일 칼라시니코프가 개발한 AK-47 소총의 가장 흔한 현대화 변형 모델입니다. 이전 모델보다 훨씬 가볍고 자동 사격 시 정확도가 뛰어납니다."
 TRK_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 TRK_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 TRK_infantry_weapons_4_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
