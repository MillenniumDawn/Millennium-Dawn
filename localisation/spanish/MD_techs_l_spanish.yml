 module_ciws_7: "CIWS VII"
 module_ciws_7_desc: "Los sistemas de armas de defensa próxima (CIWS) hiperavanzados representan la sofisticación extrema de la tecnología de defensa de punto, incorporando sensores hiperavanzados, puntería asistida por inteligencia artificial e interceptores de respuesta rápida para derrotar incluso las amenazas de misiles más avanzadas.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_ciws_8: "CIWS VIII"
 module_ciws_8_desc: "Los sistemas de armas de defensa próxima (CIWS) ultraavanzados representan la cúspide de la tecnología de defensa de punto, incorporando sensores ultraavanzados, puntería asistida por inteligencia artificial e interceptores de respuesta rápida para derrotar incluso las amenazas de misiles más avanzadas.\n\n§GConsejo de diseño: Este sistema de defensa de punto mejora el ataque antiaéreo y el blindaje al tiempo que añade un poco de puntos de vida. Es útil contra amenazas aéreas y de misiles, pero añade coste de producción, uso de combustible, mano de obra y visibilidad de superficie.§!"
 module_naval_adl_5: "Láser de defensa de punto V"
 module_naval_adl_5_desc: "Los láseres de defensa de punto proporcionan una respuesta rápida y precisa contra drones y misiles entrantes, batiendo objetivos a la velocidad de la luz y sin las limitaciones de recarga de los interceptores convencionales.\n\n§GConsejo de diseño: Los láseres de defensa de punto proporcionan un fuerte ataque antiaéreo y blindaje para una protección cercana. Son útiles contra amenazas aéreas y de misiles avanzadas, pero cuestan más capacidad industrial (IC) y consumen más combustible que la defensa de punto convencional.§!"
 module_railgun_5: "Cañones de riel V"
 module_railgun_5_desc: "La tecnología de cañones de riel electromagnéticos hiperavanzada representa un gran avance en la potencia de fuego naval, entregando proyectiles hipersónicos de alta precisión con una carga logística mínima y un potencial destructivo inigualable.\n\n§GConsejo de diseño: Los cañones de riel proporcionan un alto ataque de cañón y perforación de cañón para el bombardeo costero y enfrentamientos con buques blindados. Son útiles cuando la penetración importa, pero cuestan más capacidad industrial (IC) y recursos estratégicos que los cañones convencionales.§!"
 module_railgun_6: "Cañones de riel VI"
 module_railgun_6_desc: "La tecnología de cañones de riel electromagnéticos ultraavanzada representa un gran avance en la potencia de fuego naval, entregando proyectiles hipersónicos de alta precisión con una carga logística mínima y un potencial destructivo inigualable.\n\n§GConsejo de diseño: Los cañones de riel proporcionan un alto ataque de cañón y perforación de cañón para el bombardeo costero y enfrentamientos con buques blindados. Son útiles cuando la penetración importa, pero cuestan más capacidad industrial (IC) y recursos estratégicos que los cañones convencionales.§!"
 module_ram_7: "RAM VII"
 module_ram_7_desc: "Las plataformas RAM hiperavanzadas representan la cúspide de la defensa de punto basada en misiles, integrando sistemas de guía de última generación, una resistencia mejorada a las contramedidas y capacidades de combate rápido para derrotar las amenazas aéreas más avanzadas.\n\n§GConsejo de diseño: Los sistemas RAM proporcionan un fuerte ataque antiaéreo y blindaje para la defensa de punto al tiempo que añaden algo de puntos de vida. Son útiles contra amenazas aéreas y de misiles generales, pero cuestan más capacidad industrial (IC), combustible y mano de obra que las defensas basadas en cañones.§!"
 module_ram_8: "RAM VIII"
 module_ram_8_desc: "Las plataformas RAM ultraavanzadas representan la cúspide de la defensa de punto basada en misiles, integrando sistemas de guía de última generación, una resistencia mejorada a las contramedidas y capacidades de combate rápido para derrotar las amenazas aéreas más avanzadas.\n\n§GConsejo de diseño: Los sistemas RAM proporcionan un fuerte ataque antiaéreo y blindaje para la defensa de punto al tiempo que añaden algo de puntos de vida. Son útiles contra amenazas aéreas y de misiles generales, pero cuestan más capacidad industrial (IC), combustible y mano de obra que las defensas basadas en cañones.§!"
 module_torpedoes_7: "Torpedos ASW VII"
 module_torpedoes_7_desc: "Los torpedos ASW hiperavanzados representan la cúspide de la tecnología de guerra antisubmarina, integrando guía asistida por IA, velocidad extrema y sistemas avanzados de anticontramedidas para dominar los campos de batalla submarinos modernos.\n\n§GConsejo de diseño: Los torpedos ASW proporcionan una fuerte guerra antisubmarina para destruir submarinos una vez detectados. Son útiles en escoltas y cazadores dedicados, pero añaden costes de producción, combustible y mano de obra sin ayudar contra buques de superficie.§!"
 module_torpedoes_8: "Torpedos ASW VIII"
 module_torpedoes_8_desc: "Los torpedos ASW ultraavanzados representan la cúspide de la tecnología de guerra antisubmarina, integrando guía asistida por IA, velocidad extrema y sistemas avanzados de anticontramedidas para dominar los campos de batalla submarinos modernos.\n\n§GConsejo de diseño: Los torpedos ASW proporcionan una fuerte guerra antisubmarina para destruir submarinos una vez detectados. Son útiles en escoltas y cazadores dedicados, pero añaden costes de producción, combustible y mano de obra sin ayudar contra buques de superficie.§!"
