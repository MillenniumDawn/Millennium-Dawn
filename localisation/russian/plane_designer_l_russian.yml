 air_module_anti_ship_drone_missile_1: "Противокорабельная ракета-дрон I"
 air_module_anti_ship_drone_missile_1_desc: "Противокорабельные ракеты с беспилотными летательными аппаратами представляют собой специализированное средство для нанесения ударов по морским целям, сочетающее в себе беспилотную доставку и систему наведения, оптимизированную для обнаружения надводных судов и поражения их. Их системы наведения повышают точность ударов по морским целям и общую эффективность ударов по кораблям, но специализированная конструкция ограничивает их применимость в других задачах.\n\n§GПодсказка дизайнера: Противокорабельные ракеты-дроны улучшают прицеливание и атаку при ударах по кораблям, но они узкоспециализированны, мало полезны вне противокорабельных ролей и требуют больше ресурсов.§!"
 air_module_anti_ship_drone_missile_2: "Противокорабельная ракета-дрон II"
 air_module_anti_ship_drone_missile_2_desc: "$air_module_anti_ship_drone_missile_1_desc$"
