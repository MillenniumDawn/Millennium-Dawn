 investments_time_text_tt: "[?ROOT.project_total_construction_duration_display^-1] 일"
 investments_build_button_text: "[investments_get_build_button_text]"
 investments_start_project: "투자"
 investments_cancel_project: "취소"
 investments_standby_project: "분석 중"
 investments_standby_project_desc: "[THIS.GetName]이(가) 우리의 요청을 분석하고 있습니다"
 investments_build_button_tt: "[investments_get_build_button_tt]"
 investments_build_button_tt_1: "건설 프로젝트에 투자하면 대상 국가에 대한 영향력이 증가하며 우리나라에 투자 수입이 발생합니다.\n\n§Y국가의 부패 수준과 주의 인프라 수준 모두 총 건설 기간에 영향을 줍니다. 건설에는 변동치와 관계없이 기본적으로 35%의 기간 증가가 적용됩니다.§!\n\n§L대상 국가가 투자 제안을 승인하면 건설 기간이 끝났을 때 해당 국가가 건물을 얻게 됩니다.§!\n경제 문제가 있거나 국내 영향력이 지나치게 낮은 경우 AI는 투자를 거절합니다.\n또한 한 주에서 프로젝트를 취소한 뒤 다시 그 주에 투자하려면 3일을 기다려야 합니다.\n\n[investments_gain_tooltip]"
 investments_build_button_tt_delayed: "§Y전제 조건§!:\n[!invest_button_click_enabled]\n§Y효과§!:\n[!invest_button_click]"
 investments_14_cooldown_tt: "해당 국가가 이를 승인하면 승인 시점부터 §Y14일§!의 타이머가 시작됩니다. 이 대기 기간 동안에는 이 나라에 아무리 많은 자금을 쏟아부어도 영향력을 더 얻을 수 없습니다."
 investments_30_cooldown_tt: "해당 국가가 이를 승인하면 승인 시점부터 §Y30일§!의 타이머가 시작됩니다. 이 대기 기간 동안에는 이 나라에 아무리 많은 자금을 쏟아부어도 영향력을 더 얻을 수 없습니다."
 investments_build_button_tt_2: "진행 중인 프로젝트를 취소합니다 (이 주에는 하루에 한 번만 투자할 수 있습니다)."
 investments_build_button_tt_b: "이 버튼을 누르면 해당 주의 통제국에 허가를 요청합니다. 통제국이 승인하면 결정 탭에서 건설 프로젝트가 시작됩니다. 이 프로젝트는 대기열에 등록된 모든 건물이 완료될 때까지 반복됩니다.\n\n§Y건설 속도는 평소보다 -25% 감소합니다 (우리나라의 건설 속도 변동치는 그대로 적용됩니다).§!\n\n§L동시에 진행할 수 있는 건설 프로젝트는 하나뿐입니다.\n\n한 주에서 여러 국가의 건설 프로젝트가 동시에 진행될 수는 없습니다.\n\n이 주의 통제국이 우리에 대해 부정적인 관계를 갖고 있다면 거절할 것입니다.§!"
 investments_gain_tooltip: "[investments_gain_tooltip]"
 investments_event.1.t: "[FROM.GetNameWithFlag]의 투자 제안"
 investments_event.1.d: "[FROM.GetName]이(가) [?pending_offer_state.GetName]에 [investments_get_pending_offer_construction_type] [?pending_offer_amount]개를 건설할 것을 제안합니다.\n\n프로젝트 총 비용은 $$[?pending_offer_total_cost] 십억으로 추산됩니다. 이 프로젝트를 완료하는 데에는 약 [?pending_offer_duration]일이 소요될 것입니다. [FROM.GetName]은(는) 우리가 건설 총액의 10%를 부담하는 거래를 제안하고 있습니다. [FROM.GetNameWithFlag]은(는) 이 사업으로 영향력을 얻을 수 있습니다. [FROM.GetNameWithFlag]은(는) 이 프로젝트로 수익도 얻게 될 것입니다.\n\n\n완료까지 남은 일수: [?pending_offer_duration]\n프로젝트 총 비용([FROM.GetNameWithFlag]): $$[?pending_offer_total_cost] 십억\n건물 유형: [investments_get_pending_offer_construction_type]\n피투자국 비용 ([THIS.GetNameWithFlag]): $$[?investor_cost]\n위치: [?pending_offer_state.GetName]"
 investments_event.1.o1: "제안을 수락한다"
 investments_event.1.o2: "제안을 거절한다"
 investments_event.2.t: "건설 허가 거부됨"
 investments_event.2.d: "잠재적인 새 투자 파트너로부터 거절 통보를 받았습니다. 우리의 프로젝트를 거절하다니 믿을 수 없는 일입니다! 그 나라의 발전을 도와주면 정부에 대한 영향력이나 통제력을 얻게 되는 것도 아닌데 말입니다! 어쨌든 [?ROOT.investments_state_target.GetName]에서 [FROM.GetName]과(와) 맺으려던 투자 거래는 무산되었으니, 다른 곳에 투자 거래를 제안해 보는 편이 좋겠습니다."
 investments_event.2.o1: "이웃 나라라면 어떨까..."
 investments_event.3.t: "건설 프로젝트 취소됨"
 investments_event.3.d: "안타깝게도 우리의 친구인 [FROM.GetName]과(와) 투자 거래를 완료하지 못했습니다. 정부와의 관계, 자금 부족, 혹은 현지 주민들의 전반적인 무관심 등 여러 가지 이유가 있을 수 있습니다. 언제든 다음 기회에 다시 시도할 수 있습니다."
 investments_event.3.o1: "그들의 손해다!"
 investments_build_cost_tt: "§Y해외 투자 비용§!\n\n§Y해외 투자 비용§!§g은 우리가 시작하려고 검토 중인 프로젝트의 초기 비용입니다. 이 비용은 프로젝트가 승인되면 우리나라의 국고에서 직접 차감되어§! §Y국제 투자§!§g에 추가됩니다.§!\n\n§g다른 국가나 주에서 방금 전환해 왔다면, 건물 수량을 조정하거나 다른 건물을 클릭하여 툴팁을 갱신해야 실제 비용을 확인할 수 있습니다.§!\n\n§g부패, 국가 정신 등이 투자 프로젝트의 비용에 영향을 줄 수 있습니다. 피투자국의 부패는 부패 수준에 따라 프로젝트 비용을 증가시킵니다.§!\n"
 investments_build_cost_tt_delayed: "변동치:\n§Y[PREV.CONTROLLER.GetNameWithFlag]에 투자하는 비용:§! [?ROOT.displayable_monetary_cost_modifier|%0-] \n"
 investments_clock_tt: "§Y투자 완료까지 걸리는 시간:§! [?ROOT.project_total_construction_duration_display^-1] 일\n\n§Y투자 완료까지 걸리는 시간§! §g또는 프로젝트 기간은 [PREV.GetName]에서 우리가 제안한 프로젝트를 완료하는 데 걸리는 총 시간입니다. §Y[PREV.CONTROLLER.GetNameWithFlag]§!에 제안하는 건물이 많을수록 프로젝트 기간이 길어집니다.§!\n\n§g다른 국가나 주에서 방금 전환해 왔다면, 건물 수량을 조정하거나 다른 건물을 클릭하여 툴팁을 갱신해야 실제 비용을 확인할 수 있습니다.§!\n"
