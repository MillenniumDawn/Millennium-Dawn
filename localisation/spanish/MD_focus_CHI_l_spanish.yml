 BRI_apply_named_RAIL_desc: "Solicitar a Pekín la construcción de: §Y[THIS.GetBRINextProjectRAIL]§!. La solicitud cuesta 30 de Poder Político. Tras la aprobación, pagamos §Y40§! de nuestra tesorería o recibimos un préstamo chino. Requiere frontera con China o una asociación activa de la Franja y la Ruta y estar en paz."
