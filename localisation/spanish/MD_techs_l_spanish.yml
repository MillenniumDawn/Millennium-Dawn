 module_naval_asw_nuclear_torpedoes_5: "Torpedos ASW nucleares V"
 module_naval_asw_nuclear_torpedoes_5_desc: "Los torpedos ASW nucleares combinan perfiles de despliegue antisubmarino con una ojiva excepcionalmente potente para maximizar la letalidad contra objetivos sumergidos.\n\n§GConsejo de diseño: Los torpedos ASW nucleares proporcionan una guerra antisubmarina excepcional para destruir submarinos detectados. Son ideales para cazadores de submarinos dedicados, pero cuestan más capacidad industrial (IC) y mano de obra que los torpedos ASW convencionales.§!"
 module_naval_asw_nuclear_torpedoes_6: "Torpedos ASW nucleares VI"
 module_naval_asw_nuclear_torpedoes_6_desc: "Los torpedos ASW nucleares combinan perfiles de despliegue antisubmarino con una ojiva excepcionalmente potente para maximizar la letalidad contra objetivos sumergidos.\n\n§GConsejo de diseño: Los torpedos ASW nucleares proporcionan una guerra antisubmarina excepcional para destruir submarinos detectados. Son ideales para cazadores de submarinos dedicados, pero cuestan más capacidad industrial (IC) and mano de obra que los torpedos ASW convencionales.§!"
 module_anti_ship_torpedoes_7: "Torpedos de doble propósito VII"
 module_anti_ship_torpedoes_7_desc: "Los torpedos de doble propósito del futuro cercano representan la cumbre de la tecnología de torpedos, combinando guía asistida por IA, velocidad extrema y sistemas avanzados de anticontramedidas para dominar tanto los campos de batalla de superficie como los submarinos.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_anti_ship_torpedoes_8: "Torpedos de doble propósito VIII"
 module_anti_ship_torpedoes_8_desc: "Los torpedos de doble propósito del futuro cercano representan la cumbre de la tecnología de torpedos, combinando guía asistida por IA, velocidad extrema y sistemas avanzados de anticontramedidas para dominar tanto los campos de batalla de superficie como los submarinos.\n\n§GConsejo de diseño: Los torpedos de doble propósito proporcionan ataque de torpedos contra buques de superficie y guerra antisubmarina contra submarinos. Ofrecen un armamento flexible a un coste moderado de capacidad industrial (IC), pero son menos especializados que las armas ASW dedicadas.§!"
 module_aa_guns_6: "Cañones antiaéreos VI"
 module_aa_guns_6_desc: "Los cañones antiaéreos hiperavanzados combinan capacidad de tiro rápido, redes de sensores integradas y una precisión superior para proporcionar una defensa aérea integral contra amenazas aéreas modernas y emergentes.\n\n§GConsejo de diseño: Los cañones antiaéreos mejoran el ataque antiaéreo y el blindaje, haciéndolos útiles para los buques que necesitan una protección dedicada contra las aeronaves enemigas.§!"
 module_aa_guns_7: "Cañones antiaéreos VII"
 module_aa_guns_7_desc: "Los cañones antiaéreos ultraavanzados combinan capacidad de tiro rápido, redes de sensores integradas y una precisión superior para proporcionar una defensa aérea integral contra amenazas aéreas modernas y emergentes.\n\n§GConsejo de diseño: Los cañones antiaéreos mejoran el ataque antiaéreo y el blindaje, haciéndolos útiles para los buques que necesitan una protección dedicada contra las aeronaves enemigas.§!"
 module_radar_8: "Radar VIII"
 module_radar_8_desc: "La tecnología de radar hiperavanzada integra fusión de sensores en red, detección de alcance extremo y priorización automatizada de amenazas, representando la cúspide de las capacidades navales de detección y adquisición de objetivos.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
 module_radar_9: "Radar IX"
 module_radar_9_desc: "La tecnología de radar ultraavanzada integra fusión de sensores en red, detección de alcance extremo y priorización automatizada de amenazas, representando la cúspide de las capacidades navales de detección y adquisición de objetivos.\n\n§GConsejo de diseño: El radar mejora la detección de superficie y la detección de submarinos, al tiempo que refuerza los misiles antibuque, el ataque de torpedos y el ataque antiaéreo. Es ideal para buques de combate de propósito general, pero cuesta más capacidad industrial (IC) y microchips que el sonar.§!"
