l_english:

 # Hewlett-Packard Corporate History Events
 USA_hp_events.1.t: "Agilent Stands Alone"
 USA_hp_events.1.d: "Hewlett-Packard has completed the distribution of its remaining Agilent Technologies shares, making the instruments and components company fully independent. HP can now concentrate on computing, imaging, and related services."
 USA_hp_events.1.a: "Complete the separation"
 USA_hp_events.1.b: "Keep the instruments business"
 USA_hp_events.2.t: "The Compaq Proxy Fight"
 USA_hp_events.2.d: "The FTC has closed its investigation of the proposed Hewlett-Packard and Compaq merger without enforcement action. Walter Hewlett's proxy campaign has made the approaching shareholder vote a contest over HP's future."
 USA_hp_events.2.a: "Back the merger"
 USA_hp_events.2.b: "Keep HP independent"
 USA_hp_events.3.t: "HP's Cost Reset"
 USA_hp_events.3.d: "CEO Mark Hurd has announced a broad restructuring that will eliminate 14,500 positions and simplify HP's operations. The plan promises lower costs, but employees face layoffs and reduced benefits."
 USA_hp_events.3.a: "Carry out the cost reset"
 USA_hp_events.3.b: "Protect HP's workforce"
 USA_hp_events.4.t: "The EDS Services Bet"
 USA_hp_events.4.d: "HP has completed its $13.9 billion acquisition of Electronic Data Systems, combining services businesses with more than $38 billion in annual revenue. The purchase gives HP a global platform for competing beyond hardware."
 USA_hp_events.4.a: "Complete the services expansion"
 USA_hp_events.4.b: "Grow services without EDS"
 USA_hp_events.5.t: "HP's Strategic Break"
 USA_hp_events.5.d: "HP plans to discontinue webOS devices, consider alternatives for its personal computer business, and acquire the enterprise software firm Autonomy. The proposed transformation would shift the company toward higher-margin software, cloud, and services."
 USA_hp_events.5.a: "Pivot to enterprise software"
 USA_hp_events.5.b: "Recommit to devices and PCs"
 USA_hp_events.6.t: "The Autonomy Write-Down"
 USA_hp_events.6.d: "HP has recorded an $8.8 billion impairment tied to Autonomy and alleges that accounting improprieties inflated the British software firm's value before the acquisition. The write-down has turned the 2011 strategy into a legal and corporate crisis."
 USA_hp_events.6.a: "Refer the claims to regulators"
 USA_hp_events.6.b: "Absorb the loss and restructure"
 USA_hp_events.7.t: "Hewlett-Packard Divides"
 USA_hp_events.7.d: "Hewlett-Packard plans to separate into two publicly traded companies. HP Inc. would hold personal systems and printing, while Hewlett Packard Enterprise would take infrastructure, software, and services."
 USA_hp_events.7.a: "Complete the separation"
 USA_hp_events.7.b: "Keep Hewlett-Packard together"
 USA_hp_events.8.t: "HP Reinvents Printing"
 USA_hp_events.8.d_split: "Ten months after becoming independent, HP Inc. has agreed to buy Samsung Electronics' printer business for $1.05 billion. Its laser technology and patent portfolio could strengthen HP's push into multifunction printers and copiers."
 USA_hp_events.8.d_integrated: "Hewlett-Packard has agreed to buy Samsung Electronics' printer business for $1.05 billion. Its laser technology and patent portfolio could expand the integrated company's printing business into multifunction printers and copiers."
 USA_hp_events.8.a: "Acquire Samsung's printer business"
 USA_hp_events.8.b: "Develop the portfolio internally"
 USA_hp_events.9.t: "Enterprise Portfolio Refocus"
 USA_hp_events.9.d_split: "Hewlett Packard Enterprise has completed the spin-mergers of its enterprise services business with CSC and its software business with Micro Focus. The transactions leave a more focused infrastructure company centered on hybrid IT, servers, storage, and networking."
 USA_hp_events.9.d_integrated: "Hewlett-Packard has negotiated mergers that would separate its enterprise services operation into CSC and its software operation into Micro Focus. Completing both transactions would narrow the company around computing, printing, infrastructure, storage, and networking."
 USA_hp_events.9.a: "Complete the spin-mergers"
 USA_hp_events.9.b: "Keep the full enterprise stack"
 USA_hp_events.10.t: "The Xerox Bid Collapses"
 USA_hp_events.10.d_split: "Xerox has withdrawn its tender offer for HP Inc. and ended its proxy campaign, citing disruption caused by the COVID-19 pandemic. The collapse of the hostile bid returns control of HP's strategy to its board."
 USA_hp_events.10.d_integrated: "Xerox has withdrawn its bid for Hewlett-Packard's personal systems and printing operations, citing disruption caused by the COVID-19 pandemic. The collapse of the challenge leaves the integrated company free to set its own course."
 USA_hp_events.10.a: "Double down on HP's independent plan"
 USA_hp_events.10.b: "Keep the door open to consolidation"
 USA_hp_events.11.t: "HP Acquires Poly"
 USA_hp_events.11.d: "The acquisition of Poly is complete, adding video conferencing, cameras, headsets, voice products, and collaboration software to HP's portfolio. The deal can support a wider hybrid-work platform or a focused peripherals business."
 USA_hp_events.11.a: "Build the hybrid-work platform"
 USA_hp_events.11.b: "Keep Poly focused on peripherals"
 USA_hp_events.12.t: "Enterprise Networking Consolidation"
 USA_hp_events.12.d_split: "Hewlett Packard Enterprise has completed its acquisition of Juniper Networks after accepting divestiture and licensing remedies. The combination doubles HPE's networking business and creates a broader cloud-native, AI-driven portfolio."
 USA_hp_events.12.d_integrated: "Hewlett-Packard has completed its acquisition of Juniper Networks after accepting divestiture and licensing remedies. Juniper's AI-native networking technology can be integrated across the company's wider computing and enterprise portfolio."
 USA_hp_events.12.a: "Integrate the AI-native stack"
 USA_hp_events.12.b: "Keep Juniper operationally separate"
 USA_hp_events.13.t: "HP Searches for New Leadership"
 USA_hp_events.13.d_split: "Enrique Lores has stepped down as president and CEO of HP Inc., and director Bruce Broussard has become interim CEO. The board's search for a permanent successor will determine whether One HP continues unchanged."
 USA_hp_events.13.d_integrated: "Hewlett-Packard's chief executive has stepped down, and the board has appointed an interim leader while it searches for a permanent successor. The transition tests whether the integrated company preserves its current strategy or changes course."
 USA_hp_events.13.a: "Preserve the One HP strategy"
 USA_hp_events.13.b: "Use the search for a strategic reset"
