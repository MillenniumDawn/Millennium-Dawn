 weap_ag_cas_hardpoint_1: "Точка подвески для штурмовика 1-го поколения"
 weap_mp_med_hardpoint_1_desc: "Узлы подвески, предназначенные для размещения вооружения среднего размера. Легкие противокорабельные ракеты, высокоточные боеприпасы, противотанковые ракеты, крылатые ракеты средней дальности, ракеты класса «воздух-воздух» большой дальности, пушечные контейнеры и многое другое. Эти узлы подвески позволяют использовать на самолете широкий спектр вооружения.\n\n§GПодсказка дизайнера: Средние точки подвески — воплощение многоцелевого самолёта: они открывают доступ почти ко всем заданиям и дают нужные для них характеристики ценой роста стоимости производства. С этими модулями получается сбалансированный универсальный самолёт.§!\n\n§WЕсли использовать его в качестве основного оружия, получится§! §Bмногоцелевой истребитель§!\n\n§RВНИМАНИЕ: многоцелевые истребители CV будут атаковать вражеские корабли только во время морского боя§!"
 weap_ag_cas_hardpoint_1_desc: "Узлы подвески, предназначенные для перевозки большого количества боеприпасов «воздух-земля». Эти узлы подвески позволяют перевозить большее количество боеприпасов, но при этом не дают возможности перевозить несколько систем вооружения, таких как ракеты «воздух-земля», более тяжёлые бомбы и большее количество противокорабельных ракет.\n\n§GПодсказка дизайнера: Точки подвески для непосредственной авиаподдержки значительно повышают атаку по наземным целям и стратегические бомбардировки, но лишают самолёт воздушной атаки и снижают радиолокационное преимущество.§!\n\n§WИспользование этого оружия в качестве основного создаст§! §BCAS-самолет§!"
