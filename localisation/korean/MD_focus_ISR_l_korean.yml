 palestine.2.t: "선거철"
 palestine.2.d: "팔레스타인 자치정부의 차기 수반을 선출하는 투표소가 문을 열었습니다. 두 주요 후보는 마흐무드 압바스와 무스타파 바르구티입니다. 누가 승리할지는 아직 알 수 없지만, 여론조사에서는 차기 수반이 다음 인물이 될 가능성이 매우 높다는 점이 강하게 시사되어 왔습니다..."
 palestine.2.a: "아라파트의 후계자, 마흐무드 압바스"
 palestine.2.b: "무소속 후보, 무스타파 바르구티"
 ISR_isr_liberman_coalition_ticker_mission_desc: "세속 통치, 국가 안보, 러시아어권 유권자의 이익이라는 이스라엘 베이테이누의 의제를 추진하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_givir_coalition_ticker_mission_desc: "강력한 국가 안보와 우익 민족주의 정책이라는 오츠마 예후디트의 의제를 추구하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_likud_coalition_ticker_mission_desc: "보수적 통치와 안보 중심의 국가 정책이라는 리쿠드의 의제를 시행하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_shas_coalition_ticker_mission_desc: "초정통파의 종교적 이익과 해당 공동체를 위한 사회 복지라는 샤스의 의제를 지원하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_jud_coalition_ticker_mission_desc: "토라 준수와 초정통파의 종교적 우선순위라는 야하두트 하토라의 의제를 추진하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_nz_coalition_ticker_mission_desc: "우익 민족주의와 영토 안보 우려라는 민족연합의 의제를 추구하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_jewish_home_coalition_ticker_mission_desc: "종교적 시온주의와 정착촌 확장 정책이라는 유대인의 집의 의제를 시행하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_labour_coalition_ticker_mission_desc: "사회민주주의, 노동자의 권리, 진보적 통치라는 아보다의 의제를 지원하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_meretz_coalition_ticker_mission_desc: "좌익 진보적 가치와 평화 지향적 외교라는 메레츠의 의제를 추진하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_isr_arab_coalition_ticker_mission_desc: "아랍계 이스라엘 소수자의 권리와 공동체 이익이라는 라암의 의제를 지원하십시오.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_liberamn_done_desc: "이스라엘 베이테이누는 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_givir_done_desc: "오츠마 예후디트는 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_likud_done_desc: "리쿠드는 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_shas_done_desc: "샤스는 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_jud_done_desc: "야하두트 하토라는 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_nz_done_desc: "민족연합은 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_jewish_done_desc: "유대인의 집은 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_labour_done_desc: "아보다는 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_meretz_done_desc: "메레츠는 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 ISR_arab_done_desc: "라암은 우리의 통치와 정책 결정에 만족해 왔습니다.\n\n해당 정당을 위한 중점을 완료하면 이 임무를 완료할 수 있습니다."
 israel_economy.38.b: "그것은 받아들일 수 없다."
 ISR_religious_status_quo_revisit: "독립 선언서 재검토"
 ISR_religious_status_quo_revisit_desc: "마침내 독립 선언서를 재검토하고 종교적 현상 유지를 되돌릴 수 있게 되었습니다."
 remove_5_icbm_tt: "국가 비축분에서 §R대륙간탄도미사일 5기를 제거합니다§!."
 ISR_judicial_TT: "리쿠드 중점 트리에서 §4사법 개혁§! 분기를 §Y잠금 해제§!합니다."
 ISR_operation_result_outcome_tt: "작전이 종료됩니다. §Y작전 점수§!는 서안 지구의 §Y일곱 개 하위 작전§!을 통해 획득합니다. 각 결정 사건은 더 많거나 적은 점수를 주는 선택지를 제공합니다. §G8점 이상§!을 획득하면 성공이며, §R7점 이하§!는 실패입니다."
 ISR_operation_success_tt: "성공하려면 §G작전 점수 8점 이상§!을 획득해야 합니다. 점수는 서안 지구의 일곱 개 하위 작전을 통해 획득합니다. 각 사건은 서로 다른 점수를 주는 선택지를 제공합니다. 신중하게 선택하십시오."
 ISR_religous_status_quo_revisit: "종교적 현상 유지 재검토"
 ISR_religous_status_quo_revisit_desc: "1947년 세속 시온주의자와 정통파 지도자 사이의 타협은 국가와 종교의 관계를 그대로 동결시켰습니다. 개혁 연정은 세속 공동체와 종교 공동체 사이에 시민적 의무를 더 공평하게 분배하겠다고 약속하며 재협상에 나섭니다."
 PER_launch_drone_attack_tt: "§Y자폭 드론 10기§!가 필요합니다"
 israel_news.8.o6: "지역의 균형이 바뀌었다."
 ISR_kill_agents_risk_tt: "§Y위험:§! 우리 요원 일부가 노출되어 §H365일§! 동안 우리의 정보 및 정치 작전이 약화됩니다."
 ISR_clearance_tax_discuss_desc: "이스라엘은 팔레스타인 지역으로 향하는 물품에 대한 관세와 부가가치세를 징수하고, 파리 의정서 체계에 따라 그 수익을 팔레스타인 자치정부에 이전합니다. 안보 협력을 둘러싼 주기적인 긴장과 국제기구에서의 팔레스타인의 일방적 행보로 인해 이 방식은 거듭 압박을 받아 왔습니다. 내각은 현재의 정산 수입 분쟁을 어떻게 처리할지 결정해야 합니다."
 ISR_top_influencer_per_tt: "§Y[ROOT.GetNameWithFlag]§!은(는) §Y[PER.GetNameWithFlag]§!에서 최대의 외국 영향력 행사국입니다."
 olymp_hack_unlock: "올림픽 게임 작전 승인됨"
 israel_likud.26.a: "포퓰리즘의 시대."
 ISR_war_between_wars_doctrine: "전쟁 사이의 전쟁 교리"
 ISR_war_between_wars_doctrine_desc: "이란의 역내 네트워크에 맞선 우리의 하이브리드전 교리는 비밀 타격과 습격을 지속하는 데 필요한 정치적, 작전적 여력을 제공합니다."
 israel_economy.300.t: "통신업계의 겨울"
 israel_economy.300.d: "호황기 동안 이스라엘 장비 제조업체들이 납품하던 통신사 시장이 주문을 중단했습니다. ECI는 이 부문에서 가장 뚜렷한 국가대표 기업이지만 적자를 내고 있으며, 소규모 광대역 무선 업체 두 곳은 각자 무너지는 대신 합병을 제안하고 있습니다. 국가는 구조조정이 자연스럽게 진행되도록 두거나, 이미 보유한 대표 기업에 자금을 투입할 수 있습니다."
 israel_economy.300.a: "업계가 스스로 통합되도록 두라"
 israel_economy.300.b: "ECI를 국가대표 기업으로 지원하라"
 israel_economy.301.t: "팹 2 보증"
 israel_economy.301.d: "타워 반도체는 이스라엘이 온전히 소유하게 될 유일한 첨단 제조 공장을 건설 중이지만, 완공에 필요한 자금을 조달하지 못하고 있습니다. 국가 보증은 훨씬 큰 기업들과 경쟁하는 파운드리에 공공 자금을 투입하는 것이 됩니다. 이를 거절하면 이 나라에는 설계 기업과 기술자만 남고 자체 웨이퍼는 없게 됩니다."
 israel_economy.301.a: "팹을 보증하라"
 israel_economy.301.b: "팹리스로 남아 설계 기업을 지원하라"
 israel_economy.302.t: "M-시스템즈의 가치"
 israel_economy.302.d: "샌디스크는 M-시스템즈에 15억 5천만 달러를 제안했습니다. 이 회사의 기술자들은 오늘날 모든 상점에서 팔리는 이동식 저장 장치를 발명했습니다. 이 매각은 지금까지 기록된 이스라엘 기술 기업의 매각 중 최대 규모가 될 것입니다. 대신 국내 소유를 고집하려면 자금을 국내에서 구해야 하며 창업자들에게 거절을 통보해야 합니다."
 israel_economy.302.a: "매각을 진행시켜라"
 israel_economy.302.b: "이스라엘 소유의 규모를 요구하라"
 israel_economy.303.t: "연구 단지"
 israel_economy.303.d: "인텔, 마이크로소프트, 구글 등 외국 반도체 업체와 소프트웨어 기업들이 이스라엘 연구 센터를 확장하기를 원하며, 이를 위해 보조금을 요구하고 있습니다. 하이파와 헤르츨리야의 단지는 수천 명의 기술자를 고용하고 높은 보수를 지급하지만, 그 모든 곳이 타국 소유입니다. 같은 자금으로 몇 년간은 규모가 작겠지만 이스라엘 기업으로 남을 회사들을 지원할 수도 있습니다."
 israel_economy.303.a: "외국 단지를 유치하라"
 israel_economy.303.b: "대신 국내 대표 기업을 지원하라"
 israel_economy.304.t: "인터커넥트 매각"
 israel_economy.304.d: "한 미국 그래픽 기업이 멜라녹스에 69억 달러를 제시했습니다. 멜라녹스의 인터커넥트는 세계 최대 규모 컴퓨터 대부분의 프로세서 사이를 연결합니다. 이 회사는 데이터센터용 반도체 분야에서 이스라엘이 소유한 마지막 중요한 기업입니다. 매각을 막으려면 국가가 이를 유지할 자금을 마련하고 주주들에게 그 이유를 설명해야 합니다."
 israel_economy.304.a: "매각을 허가하라"
 israel_economy.304.b: "매각을 막고 인터커넥트를 지켜라"
 israel_economy.305.t: "업계가 걸어온 길"
 israel_economy.305.d: "무엇을 지키고 무엇을 포기할지 결정해 온 사반세기의 시간은 ECI, M-시스템즈, 그리고 외국 연구 단지가 어떻게 되었는지를 정리했습니다. 즉 이스라엘이 무엇을 제조하고, 무엇을 설계만 하며, 그중 얼마나 소유하고 있는지가 결정되었습니다."
 israel_economy.305.a: "주권 반도체"
 israel_economy.305.b: "파운드리와 매각"
 israel_economy.305.c: "설계 주권국"
 israel_economy.305.e: "스타트업 국가"
 ISR_electronics_sovereign_silicon: "주권 반도체"
 ISR_electronics_sovereign_silicon_desc: "이스라엘은 팹을 소유하고 있으며 그에 맞춰 설계하는 기업들도 지켜냈습니다. 그 생산량은 거대 기업들에 비하면 소박하지만, 다른 곳에서 내려진 결정으로 이를 중단시킬 수는 없습니다."
 ISR_electronics_foundry_and_exit: "파운드리와 매각"
 ISR_electronics_foundry_and_exit_desc: "이스라엘 공장에서는 웨이퍼가 생산되지만, 이 나라를 유명하게 만든 기업들은 캘리포니아의 소유입니다. 제조업은 지킬 가치가 있었고 설계 기업은 팔 가치가 있었으며, 두 판단 모두 성과를 거두었습니다."
 ISR_electronics_design_sovereign: "설계 주권국"
 ISR_electronics_design_sovereign_desc: "팹은 없지만 아키텍처는 이스라엘의 것입니다. 웨이퍼는 팔겠다는 곳이면 어디서든 사 오며, 그 안에 담긴 지적 재산은 텔아비브의 통제를 받습니다."
 ISR_electronics_startup_nation: "스타트업 국가"
 ISR_electronics_startup_nation_desc: "이곳의 기술자들은 세계 어디에 견주어도 최고 수준이지만, 그들이 만든 거의 모든 것은 결국 해외의 누군가에게 팔립니다. 이 나라는 그 수익, 연구 센터, 그리고 다음 세대 창업자들을 기반으로 돌아갑니다."
 ISR_infrastruc_problems_desc: "이스라엘의 철도와 도로망은 수십 년간의 급속한 인구 증가를 따라가지 못했습니다. 예루살렘 회랑, 네게브, 갈릴리는 혼잡한 고속도로와 느리고 일부 구간이 단선인 철도에 의존하고 있어 건설 비용이 상승하고 각 지역이 수용할 수 있는 신규 개발의 규모가 제한됩니다.\n§W--------------§!\n§Y$ISR_high_speed_tel_aviv_jerusalem$§!, §Y$ISR_negev_trains$§! 또는 §Y$ISR_galilee_railways$§! 중점을 완료하면 이 주 변동치는 해당 주에서 §R제거§!됩니다."
 jordanian_waqf_authprity_desc: "6일 전쟁 이후, 그리고 1994년 요르단과의 평화 조약으로 공식화된 바와 같이, 요르단 종교 재단(와크프)이 알아크사 모스크와 성전산 단지를 관리하고 있습니다. 이 체제는 암만이 예루살렘의 현상 유지에 이해관계를 갖게 하지만, 동시에 외국의 종교 권위를 이 도시와 그 무슬림 인구에 뿌리내리게 합니다.\n§W--------------§!\n§Y$ISR_temple_mount_saudi$§! 또는 §Y$ISR_amend_status_quo$§! 중점을 완료하면 이 주 변동치는 §R제거§!됩니다."
 ISR_operation_failed_pal_tt: "작전이 §R실패§!하면 §Y하마스§!가 팔레스타인을 장악하고 이스라엘의 종속국이 됩니다."
