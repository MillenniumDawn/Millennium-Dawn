 military_factory_employment_button_delayed_tt: "Когда у нас больше рабочих мест, чем работников, в некоторых случаях может быть полезно увеличивать или уменьшать количество работников, распределённых по секторам (заводы/офисы), чтобы освободить рабочую силу для других отраслей.\n\nПолитическая власть: §R-20§!\n\n£click_left §YЛКМ§! — увеличить уровень занятости военных заводов.\n£click_right §YПКМ§! — уменьшить его.\n\nТекущий целевой уровень занятости: §Y[?ROOT.military_factory_employment_var|%]§!"
