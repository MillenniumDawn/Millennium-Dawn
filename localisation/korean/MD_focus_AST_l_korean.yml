 intercepter_radar_modifications_ast: "요격기 센서 개조"
 aukfta_1: "AUKFTA"
 aukfta_1_desc: "오스트레일리아-영국 자유무역협정은 다양한 오스트레일리아 및 영국 농산물에 대한 관세를 완화합니다. 특히 와인, 설탕, 소고기, 양고기의 수출입이 두드러집니다."
 AST_crop_data_collecting: "작물 데이터 수집"
 AST_breadbasket_event.1.t: "오스트레일리아의 농업 협정"
 AST_breadbasket_event.1.d: "과거 식민지이자 오랜 동맹국 가운데 한 나라가 농산물 교역에 대한 양국 간 관세를 인하하는 협정을 제안해 왔습니다. 와인, 설탕, 양고기 등이 우리 시장에 대량으로 들어오게 되며, 그 대신 그들은 우리 상품 상당수가 자국 시장에 접근하지 못하게 막는 번거로운 규제를 없애겠다고 약속했습니다. 또한 협정을 더 매력적으로 만들려고 영농 기술 협력체 구성도 제안했습니다."
 AST_breadbasket_event.1.a: "거래 성립이다."
 AST_breadbasket_event.1.b: "우리 시장이 먼저다."
 AST_breadbasket_event.2.t: "협정을 지지하는 영국"
 AST_breadbasket_event.2.d: "우리 외교관들이 농업 협정과 관련한 좋은 소식을 안고 영국에서 돌아왔습니다. AUKFTA가 체결되어 우리 농민들의 상품이 번거로운 규제 없이 영국 시장으로 곧장 흘러들 수 있게 되었으며, 우리 과학자들은 영국 과학자들과 협력해 양국의 농업 지식을 더욱 발전시킬 것입니다. 농민들의 미래가 이토록 밝았던 적은 없습니다."
 AST_breadbasket_event.2.a: "우리의 초록 엄지는 여전하다!"
 AST_breadbasket_event.3.t: "협정을 거부한 영국"
 AST_breadbasket_event.3.d: "관계가 악화된 탓에 영국 정부는 우리의 제안을 고려하는 것조차 거부했습니다. 우리 농민들은 지금 접근할 수 있는 시장으로 버텨야 할 것입니다."
 AST_breadbasket_event.3.a: "농민들에게는 좋지 않은 결과다."
 AST_experts_abroad_tt: "국제 임무 탭에서 전문가를 해외로 파견하는 §2결정§!을 사용할 수 있게 됩니다."
 ast_technical_experts: "오스트레일리아 기술 전문가"
 AST_experts_decisions.1.t: "오스트레일리아의 기술 전문가 제안"
 AST_experts_decisions.1.d: "오스트레일리아 정부가 우리의 국가 발전을 지원하겠다며, 갓 졸업한 토목 기술자와 재난 전문가, 기술 전문가들을 우리나라에 보내 일하게 하겠다는 제안을 해 왔습니다. 이 협정이 체결되면 그들의 자격이 인정되어, 사회기반시설과 연구개발 같은 우리의 핵심 부문에 투입될 수 있습니다."
 AST_experts_decisions.1.a: "환영한다."
 AST_experts_decisions.1.b: "어림없다."
 AST_experts_decisions.2.t: "우리 전문가를 거부한 [From.GetName]"
 AST_experts_decisions.2.d: "개인적인 불만 때문이든 계획에 대한 반대 때문이든, [From.GetName]이(가) 우리 전문가의 파견을 거부하고 있습니다. 어쩌면 다른 곳에서는 환영받을 수 있을 것입니다."
 AST_experts_decisions.2.a: "시도는 했다."
 sent_experts_ast: "파견된 전문가"
 AST_experts_abroad_brm: "@BRM 미얀마에 전문가 파견"
 AST_experts_abroad_bhu: "@BHU 부탄에 전문가 파견"
 AST_experts_abroad_ban: "@BAN 방글라데시에 전문가 파견"
