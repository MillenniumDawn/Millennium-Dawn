 module_ciws_7: "근접 방어시스템 VII"
 module_ciws_7_desc: "하이퍼 첨단 근접방어무기체계는 점방어 기술의 극한을 보여주며, 하이퍼 첨단 센서, 인공지능 보조 조준, 신속 대응 요격체를 도입하여 가장 진보된 미사일 위협도 격파합니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_ciws_8: "근접 방어시스템 VIII"
 module_ciws_8_desc: "울트라 첨단 근접방어무기체계는 점방어 기술의 정점을 보여주며, 울트라 첨단 센서, 인공지능 보조 조준, 신속 대응 요격체를 도입하여 가장 진보된 미사일 위협도 격파합니다.\n\n§G설계 힌트: 이 점방어 체계는 대공과 장갑을 향상시키고 체력을 소폭 높입니다. 항공 및 미사일 위협에 유용하지만 생산 비용, 연료 소모, 인력, 수상 가시성이 증가합니다.§!"
 module_naval_adl_5: "점방어 레이저 V"
 module_naval_adl_5_desc: "점방어 레이저는 드론과 날아오는 미사일에 신속하고 정밀하게 대응하며, 빛의 속도로 표적을 공격하고 기존 요격체와 같은 재장전 제약이 없습니다.\n\n§G설계 힌트: 점방어 레이저는 근접 방호를 위한 강력한 대공과 장갑을 제공합니다. 첨단 항공 및 미사일 위협에 유용하지만 기존 점방어 체계보다 IC 비용이 높고 연료를 더 소모합니다.§!"
 module_railgun_5: "레일건 V"
 module_railgun_5_desc: "하이퍼 첨단 전자기 레일건 기술은 해군 화력의 돌파구로서, 최소한의 병참 부담으로 매우 정확한 극초음속 발사체를 쏘아 보내며 비견할 데 없는 파괴력을 지닙니다.\n\n§G설계 힌트: 레일건은 해안 포격과 장갑함과의 교전을 위한 높은 포 공격력과 포 관통력을 제공합니다. 관통력이 중요할 때 유용하지만 기존 함포보다 IC와 전략 자원 비용이 높습니다.§!"
 module_railgun_6: "레일건 VI"
 module_railgun_6_desc: "울트라 첨단 전자기 레일건 기술은 해군 화력의 돌파구로서, 최소한의 병참 부담으로 매우 정확한 극초음속 발사체를 쏘아 보내며 비견할 데 없는 파괴력을 지닙니다.\n\n§G설계 힌트: 레일건은 해안 포격과 장갑함과의 교전을 위한 높은 포 공격력과 포 관통력을 제공합니다. 관통력이 중요할 때 유용하지만 기존 함포보다 IC와 전략 자원 비용이 높습니다.§!"
 module_ram_7: "함대공 미사일 VII"
 module_ram_7_desc: "하이퍼 첨단 RAM 플랫폼은 미사일 기반 점방어의 정점으로서, 최첨단 유도 체계, 향상된 대응책 저항력, 신속한 교전 능력을 통합하여 가장 진보된 항공 위협을 격파합니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_ram_8: "함대공 미사일 VIII"
 module_ram_8_desc: "울트라 첨단 RAM 플랫폼은 미사일 기반 점방어의 정점으로서, 최첨단 유도 체계, 향상된 대응책 저항력, 신속한 교전 능력을 통합하여 가장 진보된 항공 위협을 격파합니다.\n\n§G설계 힌트: RAM 체계는 점방어를 위한 강력한 대공과 장갑을 제공하며 체력도 어느 정도 높여 줍니다. 항공 및 미사일 위협에 유용하지만 포 기반 방어 체계보다 IC, 연료, 인력 비용이 높습니다.§!"
 module_torpedoes_7: "대잠 어뢰 VII"
 module_torpedoes_7_desc: "하이퍼 첨단 대잠 어뢰는 대잠수함전 기술의 정점으로서, 인공지능 보조 유도, 극한의 속도, 첨단 대대응책 체계를 통합하여 현대 수중 전장을 지배합니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
 module_torpedoes_8: "대잠 어뢰 VIII"
 module_torpedoes_8_desc: "울트라 첨단 대잠 어뢰는 대잠수함전 기술의 정점으로서, 인공지능 보조 유도, 극한의 속도, 첨단 대대응책 체계를 통합하여 현대 수중 전장을 지배합니다.\n\n§G설계 힌트: 대잠 어뢰는 탐지된 잠수함을 격침하기 위한 강력한 대잠수함전 능력을 제공합니다. 전담 호위함과 사냥함에 유용하지만 생산, 연료, 인력 비용이 증가하며 수상함에는 도움이 되지 않습니다.§!"
