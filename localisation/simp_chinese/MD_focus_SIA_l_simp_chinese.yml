l_simp_chinese:
 charoenchai_hinthao: "乍龙猜·欣涛"
 charoenchai_hinthao_desc: "这位2020年代的泰国皇家陆军总司令，凭借其防御战术和南部边境的惨痛教训而声名鹊起。他训练部队坚守阵地，令进攻者疲于奔命。"
 songwit_noonpakdee: "颂威·农帕迪"
 songwit_noonpakdee_desc: "这位泰国皇家陆军高级军官以参谋工作和组织能力著称，而非擅长作秀。他负责维持军队各部队的人员配备、物资供应和战备状态，并且能够轻松应对高层指挥中的各种政治斗争。"
 adung_phaniam: "阿东·潘伊安"
 adung_phaniam_desc: "一位泰国皇家海军现代舰队的高级将领，精通主力舰和水面作战理论。他主张建立一支影响力超越泰国湾的海军。"
 punpakdee_pattanakul: "蓬帕克迪·帕塔那库"
 punpakdee_pattanakul_desc: "一位泰国皇家空军改革派军官，致力于推动空军走向专业化标准、现代化机身和培养飞行员而非阅兵式队伍的训练体系。"
 intel_chief_nia: "国家情报局局长"
 intel_chief_nia_desc: "泰国国家情报局局长负责指挥该国的民用情报工作，将来自各省、边境和宫廷网络的情报整合起来，为政府提供单一的情报图景。"
 thailand_focus: "泰国国策树"
 SIA_the_2001_election_shortcut: "2001年大选"
 SIA_lost_territories_shortcut: "失去的领土"
 SIA_armed_forces_modernization_shortcut: "武装部队现代化"
 SIA_recover_from_97_crisis_shortcut: "冬阴功危机"
 SIA_asean_centrality_shortcut: "东盟中心地位"
 SIA_the_southern_question_shortcut: "南方问题"
 SIA_kra_gateway_shortcut: "克拉地峡"
 SIA_recover_from_97_crisis: "从冬阴功危机中恢复过来"
 SIA_recover_from_97_crisis_desc: "1997年，泰铢危机在曼谷爆发。泰国耗尽外汇储备捍卫泰铢固定汇率后，被迫实行浮动汇率制，并接受国际货币基金组织的备用安排。该方案维持了泰国的财政稳定，但代价是遭受了国际货币基金组织的过度监管，并丧失了经济尊严。最后一步是：完成经济复苏，提前偿还基金组织贷款，并重获完全主权。"
 SIA_the_1997_constitution: "人民的宪法"
 SIA_the_1997_constitution_desc: "1997年宪法是在前所未有的公众参与下起草的，承诺设立民选参议院、保障人权和建立强有力的反腐败机构。但它能否经受住泰国政治的考验，则是另一个问题。"
 SIA_repay_the_imf: "提前偿还IMF贷款"
 SIA_repay_the_imf_desc: "泰国于2003年7月清算了最后一笔备用设施贷款，比原计划提前了两年。提前还清贷款的意义不在于本金本身，而在于其释放的信号。市场不再将泰国债务视为救助风险，我国得以再次以低成本借款。"
 SIA_amazing_thailand: "惊艳泰国"
 SIA_amazing_thailand_desc: "助我们度过危机岁月的旅游宣传活动将升级为国家战略。从普吉到清迈，世界受邀来到微笑之国，并以硬通货来买单。"
 SIA_rice_and_rubber: "亚洲稻乡"
 SIA_rice_and_rubber_desc: "泰国是全球首屈一指的大米出口国和橡胶超级大国。实现伊桑地区和南部的农业经济现代化以将农业优势转化为出口收入。"
 SIA_detroit_of_asia: "亚洲底特律"
 SIA_detroit_of_asia_desc: "日本和美国的汽车制造商已将东部沿海地区作为其区域工厂基地。全力发展汽车产业，让“泰国制造”成为全球标准。"
 SIA_suvarnabhumi_airport: "素万那普机场"
 SIA_suvarnabhumi_airport_desc: "历经数十年的规划，新曼谷机场将成为东南亚的航空枢纽。以普吉这样的省级门户机场将为其输送客流，并提升泰国航空业的整体水平——前提是我们能建成它。"
 SIA_eastern_economic_corridor: "东部沿海"
 SIA_eastern_economic_corridor_desc: "深化从春武里到罗勇涵盖港口、炼油厂、工厂和铁路的工业走廊建设。建设这一泰国经济的引擎。"
 SIA_medical_hub: "亚洲医疗中心"
 SIA_medical_hub_desc: "我国以第三世界的价格提供第一世界水准的医疗服务。医疗旅游吸引着来自全球的患者，声名远扬。"
 SIA_education_for_the_future: "王国教育"
 SIA_education_for_the_future_desc: "泰国课堂仍偏重死记硬背而非问题解决，且曼谷与外府之间的师资质量差异悬殊。现代化课程、训练有素的教师，以及与产业需求对接的职业培训路径，是迈向高收入经济体的基础。"
 SIA_asean_centrality: "东盟中心地位"
 SIA_asean_centrality_desc: "曼谷，1967年东盟成立之地。我们将再次开启对友邻的投资，因为一个稳定友好的东南亚就是泰国最好的安全保证。"
 SIA_treaty_ally: "主要非北约盟国"
 SIA_treaty_ally_desc: "我国与美国保持着其在亚洲历史最悠久的条约关系。深化“金色眼镜蛇”联合军演，引进美国军事装备，趁安全保证尚存之际将其牢牢握在手中。"
 SIA_bamboo_bends_east: "竹斜向东"
 SIA_bamboo_bends_east_desc: "泰国外交向来顺风使舵，而如今这阵风正从北京吹来。中国的投资、中国的铁路、中国的市场——这一切应有尽有，只是代价尚在谈判之中。"
 SIA_the_2001_election: "2001年大选"
 SIA_the_2001_election_desc: "人民宪法实施后的首次大选。旧有的政治共识已经在危机下被打破。新兴的民粹势力、传统的权力网络以及民主党，如今都在为国家的前进方向而角逐。"
 SIA_thai_rak_thai: "泰爱泰党"
 SIA_thai_rak_thai_desc: "泰国人爱泰国人。他信·钦那瓦的压倒性胜利重新绘制了选举版图。如今，北部的乡村与东北部地区决定了由谁来执政，而他们已经选出了自己的代言人。"
 SIA_thaksinomics: "他信经济学"
 SIA_thaksinomics_desc: "他信经济学即发展双轨经济。第一轨优先发展全球出口，第二轨则侧重于基层和国内创业。这种方法促进了增长，但批评者认为它拉大了贫富差距。"
 SIA_30_baht_healthcare: "30泰铢医保计划"
 SIA_30_baht_healthcare_desc: "任何疾病，任何医院，三十泰铢。全民医疗覆盖改变了数百万泰国农村民众的生活，并巩固了他们对他信的忠诚。"
 SIA_village_fund: "百万泰铢村庄基金"
 SIA_village_fund_desc: "全国每个村庄和城市社区都将获得一百万泰铢的循环小额信贷，这是有史以来规模最大的小额信贷项目之一。"
 SIA_otop: "一村一品"
 SIA_otop_desc: "每个区县都发展、打造并出口一种标志性的地方产品，把家庭手工业上升为国家战略。"
 SIA_dual_track_economy: "双轨经济"
 SIA_dual_track_economy_desc: "出口增长，农村收入提升，债务提前偿还。无论批评者如何评价其实现方式，成绩单上的数据都倾向于政府一方。"
 SIA_war_on_drugs: "禁毒战争"
 SIA_war_on_drugs_desc: "为期三个月的打击贩毒行动。它必将赢得民心，但也将招致严重的人权问题指责，并在未来数年内持续困扰政府。"
 SIA_ceo_premier: "CEO总理"
 SIA_ceo_premier_desc: "以经营公司的方式治理国家。各部委实行关键绩效指标考核，内阁会议流动至各府举行，不接受官僚体制的拖沓。这套做法行之有效，却也侵蚀着每一个本应能说“不”的体制机构。"
 SIA_dominant_party_state: "一个政党，一个泰国"
 SIA_dominant_party_state_desc: "吸收联盟伙伴，掌控广播频道，赢得每一场补选。选举政治仍在继续，但只剩下一个压倒性的选择。"
 SIA_consolidate_democracy: "巩固民主"
 SIA_consolidate_democracy_desc: "以选票赢得权力，以结果巩固权力，并让制度屹立不倒。让民粹机器臣服于人民宪法。"
 SIA_normalization_friction: "正常化的阵痛"
 SIA_normalization_friction_desc: "旧体制的恩庇网络并不会按时瓦解。即便政党自身走上了正道，这些网络仍然抗拒解散，顽固存续。"
 SIA_thaksin_forever: "永远选他信"
 SIA_thaksin_forever_desc: "反对党已无足轻重——法院已被收买，参议院忠心耿耿。既然如此，这项事业又何必结束？执政党正变为永久性的政党。"
 SIA_shinawatra_dynasty: "钦那瓦王朝"
 SIA_shinawatra_dynasty_desc: "这场运动将超越任何单一领导人的生命周期。政党的门面可以换成姐妹或女儿，但真正的权力仍然属于他信·钦那瓦及其追随者。"
 SIA_the_old_order: "恩荫君主制"
 SIA_the_old_order_desc: "王室、军队、司法体系、官僚机构——这些正是带领泰国渡过每一场风暴的制度支柱。它们能历经七十年的动荡而屹立不倒，靠的从来不是让选举来决定一切。"
 SIA_privy_council: "枢密院"
 SIA_privy_council_desc: "国王的顾问们——退役将领、法官和政治家——坐镇于体制网络之中那个安静的枢要之地。强化那些绕过民选政府的渠道。"
 SIA_sufficiency_economy: "自足经济"
 SIA_sufficiency_economy_desc: "王室温和、韧性与抵御冲击的发展理念，是债务驱动型民粹主义增长的鲜明反例。"
 SIA_royal_guidance: "国王谕令"
 SIA_royal_guidance_desc: "每年十二月，国王致辞，举国倾听。一篇生日演说能为政府赐福，或悄然保留这份祝福，这份敬重之力，非选票或大臣所能抗衡。王座之声将会把国家从政治狂热中拉回。"
 SIA_three_pillars: "民族、宗教、国王"
 SIA_three_pillars_desc: "在泰国，佛教、民族、君主——三色国旗被塑造成公民的道德信条。僧侣走进校园，国王画像悬挂于每面墙壁之上，整个国家被构建为一个统一的道德共同体。这的确是一剂强大的粘合剂——但在那些清真寺人头攒动的地方，这套信条读起来却像一道紧闭的大门。"
 SIA_yellow_shirts: "集结人民联盟"
 SIA_yellow_shirts_desc: "人民民主联盟身着王家黄衫，涌上曼谷街头，要求民选政府下台。城市中产阶级已表明立场。"
 SIA_the_2006_coup: "九月政变"
 SIA_the_2006_coup_desc: "总理在国外期间，坦克驶入曼谷。宪法被暂停，民主改革委员会接管政权。循环再次开始。"
 SIA_guardian_of_the_nation: "国家守护者"
 SIA_guardian_of_the_nation_desc: "军队的自我认知已然化为信条——自诩超然于政治之上，却又自认有权终结任何威胁国家的政治。如今，军队的否决权将制度化。"
 SIA_judicial_activism: "司法化"
 SIA_judicial_activism_desc: "一纸法庭裁决便可完成的事情，何必派出战车？解散政党与取消资格，这就是建制派手中的手术刀。"
 SIA_the_2014_coup: "全国维持和平秩序委员会"
 SIA_the_2014_coup_desc: "戒严在前，政变在后。全国维持和平秩序委员会无限期中止政治活动，对全国进行思想整顿。"
 SIA_lese_majeste_enforcement: "保卫神圣制度"
 SIA_lese_majeste_enforcement_desc: "《刑法》第112条以“大不敬罪”将王室置于不容冒犯之地。以毫无保留的方式执行此条，且看每一个反对派运动在开口前都得先掂量掂量自己的言辞。"
 SIA_isoc_state: "国安司令部之国"
 SIA_isoc_state_desc: "国内安全行动指挥部——军队在各府的政治臂膀——正在成为一个负责“安全”事务的平行政府，尤其是在泰南边境三府。"
 SIA_isoc_overreach_backlash: "公众不安"
 SIA_isoc_overreach_backlash_desc: "国内安全机构对日常生活的渗透，已不仅限于泰南地区。普通泰国人开始察觉到这一点，并且对此颇为不满。"
 SIA_the_2017_constitution: "管理式民主"
 SIA_the_2017_constitution_desc: "一个完全由任命产生的参议院、一条允许非民选人士出任总理的条款、一份约束未来所有政府长达二十年的国家战略——选举将会恢复，但被关在笼子里。"
 SIA_perpetual_guardianship: "永久守护"
 SIA_perpetual_guardianship_desc: "将那些始终隐而不宣的规则加以正式确立。军队从此成为宪政框架下的常设裁判者。稳定——不论实现方式——得以永存。"
 SIA_royal_restoration: "王位复辟"
 SIA_royal_restoration_desc: "超越任何政府的胆量。将这张关系网的线索汇集起来，正式交到皇室手中。却克里王朝重新直接统治国家。"
 SIA_seeds_of_reform: "改革的种子"
 SIA_seeds_of_reform_desc: "在民粹主义者和保皇派的旧二元对立之外，第三股力量正在聚集。他们年轻、都市化、活跃于网络，并且厌倦了政变。"
 SIA_future_forward: "展望未来"
 SIA_future_forward_desc: "一个由政治新人组成的新政党承诺打破僵局。他们主张非军事化、权力下放和民主化。当权派试图使用惯用的手段，却发现目标已经改变。"
 SIA_three_demands: "三大诉求"
 SIA_three_demands_desc: "解散议会。停止恐吓民众，制定新宪法。学生们大声说出了那些以前不能说的话，泰国政治的天花板正在被打破。"
 SIA_demilitarize_politics: "军队退出政治"
 SIA_demilitarize_politics_desc: "停止滥用征兵制，削减将军们的媒体帝国和董事会席位，让军队彻底退出政治。他们不会为此感谢我们的。"
 SIA_civilian_control: "文官至上"
 SIA_civilian_control_desc: "由文职人员管理的国防部、议会审查的晋升、以及接受审计的军费预算。这在曼谷或许算得上激进。"
 SIA_amend_section_112: "修改第112条"
 SIA_amend_section_112_desc: "改革冒犯君主罪法。限制提起诉讼的人员范围，设定量刑上限，并禁止将其用于打压政治言论。这项法案被认为是泰国最危险的法案，一旦通过，可能就无法挽回。"
 SIA_decentralize: "超越曼谷"
 SIA_decentralize_desc: "每个省都选举省长，预算也无需经过首都批准。曼谷长期以来一直被视为整个国家的中心。"
 SIA_break_the_monopolies: "打破垄断"
 SIA_break_the_monopolies_desc: "酒类双寡头垄断、电信特许经营、集团交叉持股。撬开泰国经济的咽喉要道，引入公平竞争。"
 SIA_welfare_state: "泰国福利国家"
 SIA_welfare_state_desc: "从零散的补贴体系发展成为涵盖养老金、托儿服务和失业保险的真正安全网。这项计划耗资巨大，而且此后任何一届政府都不敢取消它。"
 SIA_marriage_equality: "东南亚首例"
 SIA_marriage_equality_desc: "婚姻平等正式成为法律，成为东南亚首例。这项改革举世瞩目，而且罕见地没有遭到当权者的阻挠。"
 SIA_deep_south_peace: "平定泰南三府"
 SIA_deep_south_peace_desc: "在王国境内享有自治权，过去的暴行得到公正惩处，北大年-马来人身份得到尊重。叛乱将在谈判桌上结束，而不是在检查站结束。"
 SIA_consolidated_democracy: "巩固之后的民主"
 SIA_consolidated_democracy_desc: "一部由公民撰写、士兵在营房中训练、法院只审理案件而不统治的宪法。政变的循环终于被打破，并成为不可想象之事。"
 SIA_reform_transition_costs: "税基转型"
 SIA_reform_transition_costs_desc: "改革这些机构意味着改革它们的资金来源方式。在新系统步入正轨之前，税收征管会滞后。"
 SIA_a_new_republic: "一个新共和国"
 SIA_a_new_republic_desc: "那个从未被允许提出的问题被付诸表决。无论结果如何，最终诞生的泰国都将面目全非，如果它还能继续存在下去的话。"
 SIA_lost_territories: "失去的领土"
 SIA_lost_territories_desc: "1893年、1904年、1907年、1909年。每一个泰国学童都牢记着暹罗被法国和英国瓜分的那些国耻日。銮披汶那一代曾为此出征，试图收复失地。那些地图如今仍静置于档案之中。"
 SIA_pan_thai_movement: "一统泰民族"
 SIA_pan_thai_movement_desc: "复兴维集·瓦他干的宏大叙事：泰族、老挝族、掸族，本为同一泰民族，却被殖民者的边界所割裂，正等待着在泰国旗帜下重归统一。"
 SIA_rearmament: "重整武备"
 SIA_rearmament_desc: "拥有钢铁才能实现雄心。将国防预算提升至前所未有的水平，并使国内工业进入战时动员状态。"
 SIA_modernize_the_rta: "皇家陆军现代化"
 SIA_modernize_the_rta_desc: "新型主战坦克、新型步兵战车，以职业化军人取代抽签征召兵。泰国皇家陆军正为超越政变的真正战争做好准备。"
 SIA_blue_water_navy: "两海海军"
 SIA_blue_water_navy_desc: "“差克里·纳吕贝特”号航母终于迎来了真正的舰载机联队与真正的护航编队，潜艇计划也不再是笑柄。两片海洋，两支舰队。"
 SIA_gripen_squadrons_rearm: "素万那普维和者"
 SIA_gripen_squadrons_rearm_desc: "“鹰狮”战斗机、预警机、数据链防空体系。一支为赢得区域战争第一周而打造的精干空军。"
 SIA_dti_self_reliance: "自主国防"
 SIA_dti_self_reliance_desc: "国防技术研究所正从发表研究论文走向投产组装线——泰国产步枪、泰国产装甲载具、泰国产火箭弹，任何禁运都无法阻挡我们自行制造一切。"
 SIA_thai_yai: "我们的泰雅兄弟"
 SIA_thai_yai_desc: "缅甸的掸族人所说的语言，任何一个泰国人都能听懂。他们的民兵武装世代与仰光作战。他们缺的只是一个靠山，以及一面团结于其下的旗帜。"
 SIA_mekong_destiny: "命运流经湄公河"
 SIA_mekong_destiny_desc: "沙耶武里和占巴塞，在老一辈人的记忆中尚且属于暹罗，而老挝人正是泰国人最亲近的同胞。那条将我们分隔的河流，本可以流经同一个国家。"
 SIA_preah_vihear: "圣寺应在我手"
 SIA_preah_vihear_desc: "1962年国际法院关于柏威夏寺的裁决至今仍令人耿耿于怀。马德望和暹粒在老一辈人的记忆中曾飘扬着泰国国旗。与金边之间的边界争端将不再只是管控，而是开始被加以利用。"
 SIA_lost_sultanates: "英暹条约是废纸"
 SIA_lost_sultanates_desc: "吉兰丹、登嘉楼、吉打、玻璃市——这些曾向曼谷纳贡的属邦，在未征询任何一个当地居民意见的情况下，就被签约割让给了英帝国。我们将公开谴责《英暹条约》。"
 SIA_suwannaphum: "素万那普一统"
 SIA_suwannaphum_desc: "素万那普——这片古老的黄金之地——在泰国旗下重归完整。开始将光复领土纳入王国版图的整合进程吧。"
 SIA_victory_monument: "新胜利纪念碑"
 SIA_victory_monument_desc: "叻差威提路上的方尖碑，是为纪念1940至1941年那场为收复失地而战的阵亡者所立。在此碑之后修建一座新的丰碑，让整个地区自己去领会其中的意味。"
 SIA_thailand_4_0: "泰国4.0"
 SIA_thailand_4_0_desc: "一切产业都向高附加值升级——机器人、生物技术、数字服务。第四次工业革命，由总理府统筹规划，在东部经济走廊落地验证。每一个府都将从国家战略的全面推进中获得生产力红利。"
 SIA_three_airport_rail: "三机场高铁联络线"
 SIA_three_airport_rail_desc: "廊曼、素万那普、乌塔堡，由一条高速铁路线串联贯通，全程仅需一小时。这将是泰国史上投资最大的铁路，也是东部经济走廊的交通脊梁。"
 SIA_u_tapao_aerotropolis: "乌塔堡航空城"
 SIA_u_tapao_aerotropolis_desc: "一座越战时期的海军机场，正蜕变为年吞吐量六千万人次的航空门户——配有维修机库、自由贸易区，以及一座以机场为核心而蓬勃生长起来的城市。"
 SIA_eastern_aviation_city: "东方航空城"
 SIA_eastern_aviation_city_desc: "机场跑道仅仅是个开端。空中客车公司与泰国国际航空在自贸区内投建了一座整修综合设施，一所培养机务人才的航空学院，货运枢纽则将乌塔堡打造成为超越航天门户的地区航空航天产业枢纽。高投资，高回报。"
 SIA_eec_take_off: "经济走廊之腾飞"
 SIA_eec_take_off_desc: "罗勇的电动汽车工厂、春武里的生物技术产业、北柳的航空电子设备集群——东部经济走廊不再只是一纸规划，而正在成为一个实实在在的区域。"
 SIA_hedge_the_bets: "风险对冲"
 SIA_hedge_the_bets_desc: "竹子随风而弯，却也会随即弹回。无论华盛顿或北京认为泰国承诺了什么，泰国对其承诺拥有最终解释权。"
 SIA_armed_forces_modernization: "泰国皇家武装部队"
 SIA_armed_forces_modernization_desc: "陆、海、空三军同归王室统御，乃是王国的剑与盾。1997年金融危机冻结了正在推进中的军备采购，留下一批半途而废的飞行中队和一艘没有舰载机的航母。亲手掌管武装力量，为未来数十年的发展定下航向。"
 SIA_gripen_deal: "“鹰狮”合同"
 SIA_gripen_deal_desc: "萨博公司提供的是华盛顿所不愿给予的——全套技术转让、工业补偿方案、一架“爱立眼”预警机，而且不会有关于政权更迭的任何说教。"
 SIA_gripen_ef_program: "“鹰狮”E/F型"
 SIA_gripen_ef_program_desc: "F-35将我们拒之门外，而F-16军龄比它们的飞行员还大。新一代“鹰狮”E/F型战斗机，既延续了泰国空勤人员所熟悉的作战体系，也让瑞典的生产线持续运转。"
 SIA_eyes_in_the_sky: "天空之眼"
 SIA_eyes_in_the_sky_desc: "以色列的无人系统——包括“搜索者”、“赫尔墨斯”和“统治者”系列——为泰军指挥官提供了丛林与边境地带始终难以获得的战场能力：持续不断的侦察视野。"
 SIA_chinese_steel: "中华的钢铁"
 SIA_chinese_steel_desc: "北方工业的VT-4主战坦克，价格只有西方坦克的一半，且交付时不附带最终用户限制条款。泰国陆军的美制M60坦克日渐老旧，而其装备供应来源正日益转向东方。"
 SIA_s26t_program: "S26T潜艇"
 SIA_s26t_program_desc: "三艘承诺交付的元级潜艇，最终真正能到货的也许只有一艘。一边是无法出口的德制发动机，一边是难以承担的预算——海军的潜艇之梦，正在考验所有人的耐心。"
 SIA_chakri_modernization: "旗舰西式改装"
 SIA_chakri_modernization_desc: "西方路线在旗舰上仍在延续。“差克里·纳吕贝特”号——西班牙建造、长期停泊在梭桃邑码头——正在加装美欧作战系统与传感器。这次北约标准的改装，终于使这艘王国的航母得以承担与其舰员相称的使命。"
 SIA_uxv_carrier_conversion: "西式无人机联队"
 SIA_uxv_carrier_conversion_desc: "“鹞”式战机已经是博物馆藏品了，但滑跃甲板仍在。借助从西方盟国军火商采购的无人系统，将这艘旗舰改造为可发射无人机、水面无人艇及水下潜航器的母舰。东南亚第一艘“通用无人作战平台”航母将搭载着伙伴国装备扬帆起航。"
 SIA_telecom_empire: "电信专营"
 SIA_telecom_empire_desc: "卫星、移动网络、一个媒体帝国——在由电信大亨组成的政府治下，这一切正以惊人的速度蓬勃发展。国家龙头企业与家族生意之间的界限，从未如此模糊。"
 SIA_prayuth_premiership: "将军的任期"
 SIA_prayuth_premiership_desc: "政变领袖脱下军装换上西装，将军政府头衔换为民选职衔。250名指定参议员投票选举总理，让记票都变得十分轻松。"
 SIA_senate_of_appointees: "忠诚参议院"
 SIA_senate_of_appointees_desc: "二百五十名参议员，每一位均由军政府遴选产生，每一位都对谁来执政拥有投票权。反对派可以赢得选举，但要赢得权力，则是另一回事。"
 SIA_2020_protest_response: "街头青年"
 SIA_2020_protest_response_desc: "学生们涌向纪念碑，高举三根手指，提出三项诉求。无论是驱散、对话还是拖延，每一种应对方式，都会让下一代对国家的本质有更深的认识。"
 SIA_orange_wave: "橘色浪潮"
 SIA_orange_wave_desc: "新一代政治力量在线上组织起来，依靠小额捐款自我维持，并视旧恩庇网络为需要革除而非放任的弊病。"
 SIA_digital_democracy: "数字化民主"
 SIA_digital_democracy_desc: "开放数据、线上服务、一个会回复邮件的政府。当透明政府脱离空口承诺，成为政治生活之基础，就没有什么可以轻易将之撼动。"
 SIA_creative_economy: "创新型经济"
 SIA_creative_economy_desc: "电影、美食、节庆、设计——泰国软实力正在成为一个值得政府关注、纳入国家管理的出口产业。"
 SIA_truth_and_reconciliation: "真相与和解"
 SIA_truth_and_reconciliation_desc: "禁毒战争中逝去的生命、历次镇压行动、泰南边境三府失踪的人员——一个拥有传讯权的调查委员会将为他们撰写官方记录，因为民主制度需要铭记过去。"
 SIA_the_2005_landslide: "377席大横扫"
 SIA_the_2005_landslide_desc: "泰爱泰党赢得国会500个席位中的377席，创下泰国历史上单一政党多数席位之最。旧体制恩荫网在沉默中注视着计票结果。"
 SIA_rice_pledging_scheme: "大米质押计划"
 SIA_rice_pledging_scheme_desc: "英拉政府推出的旗舰级惠农计划，以高于市场的价格从农民手中收购稻米并建立国家库存。乡村从中获利，至于国库是否受益则要看世界粮价是否配合了。"
 SIA_red_shirts_mobilized: "票箱外的街垒"
 SIA_red_shirts_mobilized_desc: "将农村票仓动员上街。遍布东北部的红衫军网络以数十万之众涌向首都，但充斥首都的民粹暴民并不会吓退将军们——它只会刺激王宫和军部，为他们送上动手的借口。坦克开进总理府的摊牌之时正在逼近。§R政变风险上升§!"
 SIA_heartland_development: "回馈运动之心脏"
 SIA_heartland_development_desc: "依善地区与北部的乡村送来了压倒性胜利，而如今他们将获得政策作为回报。新修的公路与铁路横贯呵叻高原，延伸至清迈河谷；各府行政机构将行政管理和就业机会送往运动真正的大本营，而不是那个从未投票支持运动的首都。"
 SIA_crown_property_bureau: "王室资产管理局"
 SIA_crown_property_bureau_desc: "王室资产管理局掌管着价值数千亿泰铢的王室资产，涵盖酒店、房地产及大型工业股权。要将这些收益投入到国家发展之中，需要在最高层面进行静默的协商。"
 SIA_eastern_tigers: "东方之虎"
 SIA_eastern_tigers_desc: "第二军区与装甲部队——“东方之虎”——是保皇派的筋腱，而他们的指挥官，正是下一代军部将领。"
 SIA_buddhist_nationalism: "佛教国家"
 SIA_buddhist_nationalism_desc: "军政府将僧侣视为维护社会秩序的合作伙伴。僧人参与国家典礼、学校课程中纳入佛教教育、僧伽被悄然抬升为道德权威。而泰南三府对此并不接受。"
 SIA_royal_succession_managed: "王权更迭"
 SIA_royal_succession_managed_desc: "王室与政府提前数年便着手筹备权力交接事宜——这已不再是措手不及的震荡，而是制度化的平稳过渡。当第九世王朝落幕之时，王室威望得以完整传承，而非跌落低谷；哀悼期被压缩至最短，保皇派迅速集结于新君周围。一场精心安排的过渡，其代价远低于无序更迭所付出的成本。"
 SIA_conscription_abolished: "职业军队"
 SIA_conscription_abolished_desc: "废除强制兵役。志愿兵役制下的军队规模更小，但待遇更优、训练更精，且其忠诚将归于宪法，而非征召他们的将领。"
 SIA_open_skies_open_borders: "开放边界与蓝天"
 SIA_open_skies_open_borders_desc: "开放航权，简化签证手续，让航空公司在竞争中自由发展。远道而来的游客带来财富，入境务工的人员带来技能。边境是泰国最大的资产——请别再把它当堡垒一样严防死守了。"
 SIA_chao_phraya_megaprojects: "昭披耶河防洪水电工程"
 SIA_chao_phraya_megaprojects_desc: "通过蓄洪水库、防洪屏障和一连串径流式水轮机组驯服这条曾两度淹没首都的河流。这一工程耗资巨大，但下次洪灾就不用批昂贵的救灾预算了。"
 SIA_asean_customs_window: "东盟单一窗口海关"
 SIA_asean_customs_window_desc: "统一东盟各成员国的海关申报、安全认证和植物检疫规则。从清莱到吉隆坡的卡车，现在需要停靠的窗口比过去少了。"
 SIA_the_southern_question: "南方问题"
 SIA_the_southern_question_desc: "在北大年、也拉、那拉提瓦三府，叛乱之火已在这片土地上闷烧了整整一代人。清真寺被焚、斩首事件、路边炸弹 - 这些已夺去数千条性命，也令马来穆斯林聚居的南部与佛教主导的曼谷之间的对立日益加深。泰国再也不能将泰南三府仅仅视为治安报告上的注脚，而必须做出抉择，以回应南方的烈焰。而其形式最终将由曼谷的掌权者来决定。"
 SIA_kra_gateway: "克拉地峡"
 SIA_kra_gateway_desc: "那个百年之梦重新摆上了内阁的议事桌，但这一次附带一份真正的预算表。一个可行性研究委员会已组建成立，勘测人员被派往克拉地峡，宋卡府的第一块共用建设用地也已清理完毕。一切都尚在商榷之中。接下来的问题是：要由谁——或说能由谁——为它买单。"
 SIA_kra_patron_china: "“一带一路”融资"
 SIA_kra_patron_china_desc: "北京的报价，是当前所有方案中最为经济的——提供完整的“一带一路”融资、中国工程团队，极速交付、一站式承包。眼下的条件极为优厚，但日后的负担也将极为沉重。债务以人民币计价，抵押物便是运河本身，终有一日，北京可能会要求偿还贷款。"
 SIA_kra_patron_japan: "日本基建仙人"
 SIA_kra_patron_japan_desc: "日本国际协力机构与日本大型银行联合体以缓慢、昂贵、但无可挑剔的方式推进建设——没有债务陷阱，没有隐藏的租约条款，只是前期账单更高，且这个伙伴期望得到的回报，既有泰铢，也有善意。东京对曼谷的重视程度也将随着工程推进而提升。"
 SIA_kra_patron_consortium: "国际财团"
 SIA_kra_patron_consortium_desc: "由亚洲开发银行牵头的多边财团，将成本与风险分散于众多参与方之间，并坚持工程师们始终青睐的务实步骤——先分阶段建设陆桥，再推进全通海平面运河。如此一来，没有任何一个单一债权国会掌控这条战略咽喉，华盛顿、东京和马尼拉都将因此松一口气。"
 SIA_kra_patron_solo: "自己动手"
 SIA_kra_patron_solo_desc: "不要外国债权，不要外国条款，不要外国旗帜悬挂于船闸之上。王国将凭借自身国库与本国债券市场为运河筹资，以此作为对这条全球最新战略水道拥有绝对主权的代价。"
 SIA_kra_debt_trap_warning_tt: "一带一路融资目前成本低廉，但建设超支会触发§R北京催还贷款§!的违约危机链。"
 SIA_two_oceans_one_kingdom: "两海之国"
 SIA_two_oceans_one_kingdom_desc: "最后一道围堰已被拆除。安达曼海与泰国湾的海水首次在运河最高点交汇。泰国从此不再仅濒临两海，而是号令两海。"
 SIA_kra_militarize: "两海之堡垒"
 SIA_kra_militarize_desc: "这条运河价值连城，不容疏于防卫。岸防炮台、加固海军基地，以及常设的通行管控权限，将这条水道变为一座泰国皇家海军足以抵御任何来犯者的堡垒。全世界将注意到了那些枪炮，而付费通行的船只则对军事化进程颇有微词。"
 SIA_kra_internationalize: "万国之航道"
 SIA_kra_internationalize_desc: "宣布克拉运河为中立国际通航区，以平等条款向所有船旗开放，并由条约保障其地位。泰国放弃单方面关闭运河的权力，以此换取航运流量、国际投资，以及每一个曾担忧这条战略咽喉被单一国家扼守的海上大国的默然感激。"
 SIA_gateway_of_asia: "亚洲门户"
 SIA_gateway_of_asia_desc: "过去，船只只是途经泰国；如今，它们停靠于此。以国际投资完成这一转型，在南部建设更深的港口，而若运河方案最终被选中，则赋予巡逻管控权责，以确保这条战略咽喉对所有缴纳通行费的船只均安全无虞。"
 SIA_ghosts_of_the_jungle: "丛林幽灵"
 SIA_ghosts_of_the_jungle_desc: "在依善地区的深山与北部的高原之间，泰国共产党的干部从未真正消失。他们在乡村学校里教育青年，在工会中组织力量，一直在铭记着历史。如今，国家走向撕裂，稳定已成往事，政府徘徊在自己的茧房中——而他们传递的信息，正被新一代愿意倾听的人所接收。"
 SIA_isaan_soviets: "依善苏维埃"
 SIA_isaan_soviets_desc: "东北部是这片土地的腹地——最贫穷、政治上最不安分，也是曼谷当局向来视为廉价劳动力与廉价选票来源的地区。村务委员会、工会会堂、合作社理事会——正成为一场运动的组织骨架。党不索取忠诚，它只要求人民自己去治理自己，然后静观其变。"
 SIA_general_strike: "大罢工"
 SIA_general_strike_desc: "若这场运动不甘止步于乡村一隅，就必须让整座城市停摆——码头工人、工厂工人、公交车司机、教师，全员同时罢工。这是一场孤注一掷的豪赌。只要政府无法正常运转足够长的时间，等待它的结局只有两种：要么屈服，要么升级镇压。没有中间道路可走。"
 SIA_general_strike_tt: "发起总罢工，并开启为期180天的§Y总罢工§!相关决议。\n- 将罢工势头推进至§Y100§!，政府即告屈服，开启和平夺权之路\n- 罢工每持续一周，将消耗§R1%§!稳定度\n- 若180天期满时未达到100，军方将镇压罢工，并以政变夺取政权"
 SIA_people_seize_power: "人民夺权"
 SIA_people_seize_power_desc: "旧政府已经垮台。无论它是倒在谈判桌前还是街垒面前，结局都一样。泰国共产党接管了执政权力。新的国旗尚未升起，但行政机器已落入那些在丛林中苦思数十载、琢磨如何运用它的人们手中。"
 SIA_land_to_the_tiller: "耕者有其田"
 SIA_land_to_the_tiller_desc: "中部平原的大庄园、依善地区的稻田、南方的橡胶种植园——生产这一切的旧制度已经终结。土地改革，真正的改革，而非那种下一届政府上台便戛然而止的官方计划，既是这场运动的承诺，也是其最危险的一步。那些拥有这些庄园的家族，并不会全都默默退场。"
 SIA_five_year_plan: "五年计划"
 SIA_five_year_plan_desc: "市场分配低效。国家将有计划地重新配置资源。工厂、钢铁、化工、机床——一切由中央统筹规划，由全民动员的劳动力建设而成。贸易逆差将转化为实物资本的结构性盈余。其代价，在头一年的消费品统计数据中便清晰可见——那就是孤立。"
 SIA_red_chakri_dilemma: "却克里难题"
 SIA_red_chakri_dilemma_desc: "有一个问题，党的领导层尽可能拖延了许久，如今已无法再回避——在共产主义泰国，王室的宪法地位究竟如何？历史提供了两个先例，但没有一个是令人安心的。"
 SIA_positive_trade_relations: "积极贸易关系"
 SIA_nuclear_proliferation_concern: "泰国铀浓缩计划"
 SIA_nuclear_proliferation_tt: "§R我们联盟之外的每一个国家，都将以长远的眼光审视泰国的核浓缩计划。§!"
 SIA_tt_has_reclaimed: "我们控制尚未整合的收复领土"
 SIA_tt_has_unpacified_reclaimed: "收复领土的顺从度仍低于§Y90%§!"
 SIA_tt_has_corable_reclaimed: "收复领土的顺从度高于等于§Y80%§!"
 SIA_bamboo_curtain: "竹幕"
 SIA_bamboo_curtain_desc: "泰国革命无法作为一个孤立的实验存活下去。越南和老挝是邻国，是同路人，也是潜在的伙伴。一个建立在相互承认与协调抵抗西方经济压力基础上的区域团结框架，正是东南亚一个长久革命政权赖以立足的架构。"
 SIA_protracted_peoples_war: "持久人民战争"
 SIA_protracted_peoples_war_desc: "上世纪七十年代的党并非在城市中获胜。它在山林中磨练了自己的本领——在那里，曼谷的法令鞭长莫及，一杆步枪远比一纸宣言更有分量。在高地建立根据地，让乡村包围城市。这比总罢工更为缓慢，却也远更难被逆转。"
 SIA_peoples_tribunals: "人民法院"
 SIA_peoples_tribunals_desc: "一场不能自卫的革命，撑不过一个季节。那些告密者、资助者和观望风向的校官们，都还在原地未动。革命法庭——迅速而公开——将在忠诚问题被用来拷问党之前，就先把它解决掉。"
 SIA_broad_united_front: "广泛统一战线"
 SIA_broad_united_front_desc: "一场靠恐惧统治的革命，只会年年日日把朋友变得少少的。更艰难的道路是赢得认同。将农民协会、工会、改良派知识分子、小商贩和乡村僧侣汇聚在同一座帐篷之下，让他们感到自己是在建设新国家，而非仅仅在它的统治下生存。权力在纸面上共享，在实践中严防，但一个能靠共识来治理的运动，便无需靠枪杆子来统治。"
 SIA_peoples_army: "人民军队"
 SIA_peoples_army_desc: "工厂在国家计划之下拔地而起，现在是时候锻造盾牌了。一个身处敌对区域的革命国家，需要一支庞大、忠诚且独立的军队——兵员按党的意志征召训练，装备来自泰国自身的兵工厂，而非仰仗外国的施舍。每一个扛得起步枪的壮劳力都是公民兵，每一间能车出一根枪管的车间都是供应链上的一环。邻国在妄动之前，必得三思而行。"
 SIA_socialist_education: "扫盲运动"
 SIA_socialist_education_desc: "工厂在国家计划之下拔地而起，现在是时候培养人才了。一场大规模扫盲运动将覆盖依善地区最偏远的村庄，干部学校将农民培养成工程师，将办事员培养成管理者——他们凭能力履职，而非出身。一个有文化、有组织的人民，更难被愚弄，也更容易治理；那些曾掏空旧王国的恩庇朽根将被连根拔起。"
 SIA_the_beijing_road: "通往北京之路"
 SIA_the_beijing_road_desc: "生存需要靠山，而这座靠山就在中南海。完全拥抱北京的怀抱吧——中国的资本来完成工业计划，中国的市场来取代西方关闭的那些，而一个大国的阴影，足以让所有邻国不敢轻举妄动。代价藏在小字条款之中。中国在泰国决策层中的声音，将比过去任何泰国人所能容忍的都要响亮。作为次要伙伴，终究还是伙伴；一个吃饱了的国家，总比一个骄傲而饥饿的国家活得长久。"
 SIA_indochina_federation: "印度支那联邦"
 SIA_indochina_federation_desc: "或者，拒绝做附庸，而选择做领袖。老挝、越南、柬埔寨——三场为同一理想而流血牺牲的革命，却无一拥有泰国的工业基础和枢纽地位。一个湄公河流域三国联邦，以曼谷为资深伙伴，而非北京的次要盟友——这将使东南亚成为一个列强必须与之谈判、而非肆意瓜分的存在。这是更艰难的宣言，也是更骄傲的宣言。"
 SIA_kingmaker_coalition: "造王者联盟"
 SIA_kingmaker_coalition_desc: "阿努廷·参威拉恭领导的泰自豪党在2019年议会中掌握着权力平衡。与其组建联合政府，需要让渡部委职位和政策妥协，但这也换来执政多数席位，以及通往该党在东北部农村票仓的通道。"
 SIA_cannabis_decriminalized: "大麻非刑罪化"
 SIA_cannabis_decriminalized_desc: "泰自豪党的标志性2022年政策将大麻从麻醉品名单中移除。武里南府及依善各地的农民转而种植新的经济作物。国库收入攀升。保守派声音警告道德风险。双方都有道理。"
 SIA_million_rai_farms: "百万农业投资"
 SIA_million_rai_farms_desc: "泰自豪党的农村发展计划，为全国带来精准灌溉、合同农业认证以及南方橡胶树更新种植补贴。东北部获得新兴产业，南部则迎来种植园扩张。泰国的农产品出口随之增长。"
 SIA_defence_industry_act: "国防工业法案"
 SIA_defence_industry_act_desc: "国内国防生产法律框架，采购优先考虑本地制造系统，所有外国合同均附带技术转让要求，并在部内设立国防工业秘书处。由此产生的首家军工厂规模有限，但制度基础将非同小可。"
 SIA_dti_expansion: "扩展国防研究"
 SIA_dti_expansion_desc: "国防技术研究所获得一笔资金注入，并受命研制火箭弹、巡飞弹以及升级版装甲车原型。依善地区的设施从绘图室跃升为生产线，一条新的军工线也同步投产。研究成果随着硬件一同落地。"
 SIA_chaiseri_and_friends: "财生利与朋友们"
 SIA_chaiseri_and_friends_desc: "财生利金属橡胶公司的“首胜”防雷车已销往印度尼西亚和菲律宾。在《国防工业法》的加持下，包括财生利、吞武里汽车和泰国光学在内的一批私营防务供应商集群正在扩张。始于国内采购的业务，逐渐变成一份出口账簿，而财生利自身的生产线也在收益中实现了升级。"
 SIA_arms_exporter: "东盟军火库"
 SIA_arms_exporter_desc: "泰国已建成了生产基地、法律框架和出口关系，足以成为本地区首选的二级军火供应国。不是主战坦克和战斗机，而是防雷车、炮弹引信、无人机和弹药——可靠、实惠、按时交付。可重复的出口合同，将成国库中的常项。"
 SIA_regional_defense_pact: "区域防御协定"
 SIA_regional_defense_pact_desc: "出口账簿已变成一种外交工具。曼谷与东盟伙伴正式确立了长期防务供应安排，包括有保障的采购渠道、联合维护计划以及常设的区域安全磋商框架。工厂运转更加繁忙，武官带着签署的协议回国，而泰国在东南亚的影响力，如今以弹药配额和备件合同来衡量。"
 SIA_stream_of_the_navy: "海流"
 SIA_stream_of_the_navy_desc: "泰国皇家海军陆战队在登陆作战与海岸防御方面获得军备投资。南部一座船坞的扩建，为新组建的两栖中队提供了支撑。泰国海军陆战队与印尼及菲律宾同行一道展开联训，不再使演习纯粹流于形式。"
 SIA_cavalry_of_the_sky: "空骑兵"
 SIA_cavalry_of_the_sky_desc: "陆军航空兵获得优先发展。新型通用直升机用于空中机动步兵，攻击型直升机为丘陵地带的作战提供支援，而空中突击学说则承认：泰国的地形，更多是丛林而非草原。"
 SIA_cyber_command: "网络司令部"
 SIA_cyber_command_desc: "一个以美国网络司令部和以色列8200部队为蓝本建立的专职网络作战司令部。涵盖网络防御、信号情报，以及——在预算提案中一处不起眼的附件里——进攻能力开发。既然国安司令部的监控基础设施已然存在，该司令部将予以继承，并将其触角延伸至数字维度。"
 SIA_us_coin_legacy: "美式治安战理论"
 SIA_us_coin_legacy_desc: "越南战争之后的几十年间，泰国陆军从美国的治安战学说中汲取了深刻教训——村庄防御计划、心理战以及与国安司令部的情报融合。这套框架至今仍塑造着泰国对付内部敌人的方式。将其系统化之后，确实产生了成效。"
 SIA_development_is_security: "发展即安全"
 SIA_development_is_security_desc: "在动荡不安的北部和东北部，修筑公路、学校和诊所，是最廉价的平叛手段。基础设施若能在鼓动者抵达之前先到达村庄，往往就能站稳脚跟。依善地区和北部的新铁路枢纽，则加快了此后每一个项目的推进速度。"
 SIA_post_cold_war_professionalization: "后冷战军官团"
 SIA_post_cold_war_professionalization_desc: "冷战塑造了泰国军官团的特质——以反共作战为核心、效忠于国内秩序、尊崇王权。然而，新一代军官在与西方伙伴的联合演习中受训，在国际法的熏陶下成长，正在重新定义泰国皇家武装力量存在的意义。"
 SIA_multi_domain_operations: "多域作战"
 SIA_multi_domain_operations_desc: "战场已不再仅仅是地图上的一条线。网络、电子战、天基侦察与精确无人机打击，正与传统机动战术融为一体。泰国与美澳伙伴联合制定的多域作战概念明确指出，下一场战争将在所有领域同时展开。"
 SIA_mdo_integration_strain: "整合阵痛"
 SIA_mdo_integration_strain_desc: "建立从网络到太空影像的跨域指挥架构，在理论尚未开始产生回报之前，就需要先行投入大量资金。"
 SIA_ministry_of_defence: "国防部"
 SIA_ministry_of_defence_desc: "王国的防务历来由各军种各自为政——各自守护自己的预算、自己的条令、自己的地盘。如今，我们终于为它注入了一副体制性的脊梁：一个凌驾于陆、海、空三军之上的国防部，将国土防御、国家安全政策与情报整合为一部单一的国家机器，直接对国家负责。"
 SIA_comprehensive_security: "总体安全"
 SIA_comprehensive_security_desc: "内政、国防与情报部门几十年来注视着同一道边界，却各自保管着三套文件，从无共享的习惯。一套统一的条令将他们绑定在一起，并同时开辟三条战线——经济、国内防线与武装力量。"
 SIA_protector_of_the_realm_focus: "王国守护者"
 SIA_protector_of_the_realm_focus_desc: "随着胜利纪念碑的落成，掸族、老挝、高棉和马来人的土地已归于泰国旗帜之下。赢得这些领土与治理它们是两回事。一个专司收复边疆的行政机构在驻军之后建立起来，安抚、开发并最终将其内化的进程就此展开。"
 SIA_atoms_for_peace: "和平利用原子能"
 SIA_atoms_for_peace_desc: "泰国签署了国际原子能机构的和平利用议定书，并开始了漫长的制度准备过程。核安全监管机构、乏燃料协议，以及首座国内研究堆相继落地。这一民用核计划建立在这样的信念之上：利用铀作为基荷电力，比以地缘政治价格进口的石油更便宜、更清洁，也更能体现国家主权。"
 SIA_smr_initiative: "小型反应堆倡议"
 SIA_smr_initiative_desc: "小型模块化反应堆是一项使无力承担全尺寸核电站资本支出的国家也能实现核电可行性的技术。该计划资助可行性研究、东海岸的选址评估，以及与韩国或法国财团的技术转让协议。第一铲混凝土的浇筑还要等十年。但决策就在今天。"
 SIA_nuclear_power_program: "核能计划"
 SIA_nuclear_power_program_desc: "国家核能计划将成为核能开发的集大成者，包含明确的并网日期、自主的燃料循环框架，以及首座并网反应堆。泰国将成为东南亚首个将民用反应堆投入电网的国家，加入日本、韩国、中国、印度、巴基斯坦和台湾的行列，成为该地区的核能运营者之一。能源独立不再只是理论上的设想。"
 SIA_bangkok_phnom_penh_axis: "曼谷-金边轴心"
 SIA_bangkok_phnom_penh_axis_desc: "柬埔寨的地理位置使其成为泰国通往海洋的天然经济走廊，而其政治走向又使其成为曼谷在对抗越南时的天然外交制衡力量。这一国策通过贸易使团、公路连接以及共享安全框架来加深双边关系，使金边与曼谷保持紧密联系，并进一步远离北京的势力范围。"
 SIA_jakarta_dialogue: "对话雅加达"
 SIA_jakarta_dialogue_desc: "印尼是东南亚的人口大国，也是泰国在吉隆坡之外最重要的双边关系。雅加达对话是平台，汇聚双边部长、联合军事演习，并就谁主导东盟下一个十年进行坦诚对话。结果取决于曼谷是将雅加达视为伙伴还是对手。"
 SIA_asean_crossroads: "东盟的十字路口"
 SIA_asean_crossroads_desc: "王国面前有两条道路。其一是盟好，一个以泰国为主导、通过共识凝聚东盟的秩序。其二是统治，以刀剑将东南亚置于泰国控制之下。"
 SIA_the_2001_election_choice_tt: "在2001年竞选中支持一方力量。选举将决定由谁来执政，而只有获胜者的路线将开放。\n- £SIA_neutral_Social §Y泰爱泰党§!\n- £SIA_Nat_Autocracy §Y王室网络及其将军们§!\n- £SIA_western_conservative §Y现任民主党§!"
 SIA_the_2006_coup_choice_tt: "选择军政府的特质。\n- §Y强硬派§!：中止选举、重修宪法，代价是稳定度与西方舆论的恶化\n- §Y温和派§!：保留民主选举，付出较小的代价"
 SIA_a_new_republic_choice_tt: "决定君主制的命运。\n- §Y废除§!：经受动荡\n- §Y退让§!：保留王冠以获得稳定度和政治点数"
 SIA_the_southern_question_choice_tt: "选择一项针对泰南三府的治安学说。"
 SIA_red_chakri_dilemma_choice_tt: "选择革命者对王权的回答。\n- §Y废除君主制§!：面临保皇派叛乱\n- §Y保留宪政象征§!：效仿老挝模式，消化强硬派的怒火"
 SIA_lost_territories_choice_tt: "选择领土主张的公开程度。\n- §Y公开的领土收复主义§!：以声望为代价换取战争支持\n- §Y低调可否认的修正主义§!：保护稳定"
 SIA_nuclear_power_program_choice_tt: "选择核浓缩路线。\n- §Y无视检查员§!：在制裁下进行武器级浓缩\n- §Y接受国际原子能机构监察§!：修复与华盛顿的关系"
 SIA_prayuth_premiership_choice_tt: "选择将军如何规划其继任事宜。\n- §Y有序过渡§!：巩固现有体制\n- §Y解决方案制度化§!：文官再次回到前台"
 SIA_2020_protest_response_choice_tt: "选择对示威的回应。\n- §Y镇压§!：消耗稳定度并增加政变风险\n- §Y同意改革§!：平息局势，并推动改革运动\n- §Y静观其变§!"
 SIA_found_the_pact: "建立东南亚条约组织"
 SIA_found_the_pact_desc: "言语化为制度。泰国恢复了外部势力在1977年放弃的那个名称，并赋予它一个区域性的主人——东南亚条约组织，一项以曼谷为核心、以邻国为成员的多边防务协定。泰国承担创始领导者的角色。旗帜升起。盟约落实。"
 SIA_invite_mainland: "邀请大陆伙伴"
 SIA_invite_mainland_desc: "越南、老挝、柬埔寨和缅甸都与泰国接壤，并面临着共同的威胁。曼谷向这些大陆国家发出正式邀请，提出一个观点：大陆腹地的安全取决于共同的立场，而非相互竞争的风险对冲。"
 SIA_invite_mainland_tt: "邀请我们的大陆邻国加入东南亚条约组织。\n- 每个国家自行决定是否接受\n- 接受的国家将获得一个保持其致力于该条约的精神"
 SIA_invite_maritime: "邀请海上伙伴"
 SIA_invite_maritime_desc: "印度尼西亚、菲律宾、马来西亚、新加坡和文莱控制着泰国赖以贸易的海域。这些海上伙伴受邀加入该协定，将群岛与半岛联结为一个统一的战略共同体。"
 SIA_invite_maritime_tt: "邀请东南亚的海洋国家加入东南亚条约组织。\n- 每个国家自行决定是否接受\n- 接受的国家将获得一个保持其致力于该条约的精神"
 SIA_invite_breakaways: "邀请边疆小国"
 SIA_invite_breakaways_desc: "南掸邦、克伦邦和佤邦控制着泰国与缅甸腹地之间的地带，而它们中任何一个都无法独自生存。曼谷向它们提供了内比都永远不会给予的东西：一个席位、一份条约签署，以及作为一个国家而非叛乱组织的地位。"
 SIA_invite_breakaways_tt: "邀请缅甸分离的各邦加入东南亚条约组织。\n- 每个国家自行决定是否接受\n- 接受的国家将获得一个保持其致力于该条约的精神"
 SIA_seato_invite_line_tt: "- §Y[THIS.GetNameDefCap]§!受邀加入东南亚条约组织"
 SIA_seato_accession_category: "东南亚条约组织邀约"
 SIA_seato_accession_category_desc: "第一个东南亚条约组织于1954年在马尼拉签署，总部设在曼谷，但其八个成员国中仅有两個属于东南亚国家，且该组织于1977年在从未被引用过的情况下解散。如今这个组织才是第一个从未真正成为的“区域性条约”：泰国占据主席席位，邻国为成员，其保障指向东南亚自身的防务，而非任何其他国家的遏制战略。席位须逐一填补。\n\n在邀请各国加入阵营之前，先审视每个国家的接受程度。"
 SIA_renew_seato_invitation: "重新发出邀请"
 SIA_renew_seato_invitation_desc: "将代表团连同条约文本和新的提议一起送回[FROM.GetNameDefCap]。拒绝并非永久性的，条款并未改变。"
 SIA_seato_charm_offensive_major: "取悦[FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_major_desc: "国事访问、信贷额度、军官奖学金，以及在对方贸易博览会上设立泰国展馆——外交部在此后三个月里，不做别的事。这些都不是条约本身，但每一件事都让下一次我们提出签署条约时，变得更容易一些。"
 SIA_seato_charm_offensive_minor: "取悦[FROM.GetNameDefCap]"
 SIA_seato_charm_offensive_minor_desc: "国事访问、信贷额度、军官奖学金，以及在对方贸易博览会上设立泰国展馆——外交部在此后三个月里，不做别的事。这些都不是条约本身，但每一件事都让下一次我们提出签署条约时，变得更容易一些。"
 SIA_courting_mission: "拉拢邻国"
 SIA_courting_mission_desc: "高级外交人员、部长日程安排以及大部分可自由支配的预算都将集中投入一个目标，直至任务结束。政府中的其他一切事务都得排队等候。"
 SIA_seato_rec_opinion_yes: "§G对泰国的态度高于40§!（+25）"
 SIA_seato_rec_opinion_no: "§R对泰国的态度低于40§!（+25）"
 SIA_seato_rec_faction_yes: "§G不在其他阵营中§!（+20）"
 SIA_seato_rec_faction_no: "§R已加入其他阵营§!（+20）"
 SIA_seato_rec_influence_yes: "§G泰国是在该国影响力最大三国之一，持有20%或以上§!（+20）"
 SIA_seato_rec_influence_no: "§R泰国并非该国影响力最大三国之一，未持有20%或以上§!（+20）"
 SIA_seato_rec_threat_yes: "§G处于战争状态，或其邻国处于战争状态§!（+15）"
 SIA_seato_rec_threat_no: "§R该国及其任何邻国均未处于战争状态§!（+15）"
 SIA_seato_rec_trade_yes: "§G与泰国达成贸易协定§!（+10）"
 SIA_seato_rec_trade_no: "§R与泰国没有贸易协定§!（+10）"
 SIA_seato_rec_momentum_yes: "§G东南亚条约组织已有三个或更多成员国§!（+10）"
 SIA_seato_rec_momentum_no: "§R东南亚条约组织成员国不足三个§!（+10）"
 SIA_seato_rec_total: "§Y东南亚条约组织接纳度§!：§Y[?SIA_seato_temp|0]§!/100。他们在§Y60§!时接受邀请。"
 SIA_joint_command: "东盟联合指挥部"
 SIA_joint_command_desc: "曼谷建立了常设联合指挥架构，整合各成员国的条令、后勤与情报。泰国军官占据高级职位，但参谋人员真正实现了多国协作。演习变得互通互操作，计划则落地成为现实。"
 SIA_asean_rapid_reaction: "东盟快速反应部队"
 SIA_asean_rapid_reaction_desc: "组织迈出下一步，组建一支常备快速反应旅，由所有成员国抽调兵力组成，能够在72小时内部署到东南亚任何地点。这是条约之剑，精干有力，且实实在在。"
 SIA_arsenal_integration: "东盟军备整合"
 SIA_arsenal_integration_desc: "泰国的国防工业，已是东南亚的兵工厂，将武器和弹药标准化，装备到每个成员国的武装部队。泰国制造的步枪、车辆和炮弹取代了苏联、中国和西方装备的杂烩。该条约组织的军队现在使用同一种子弹。"
 SIA_pax_aseana: "东盟治世"
 SIA_pax_aseana_desc: "工作已经完成，条约也已稳固。泰国建立了外部势力无法做到的成就——一个植根于本地区、足以震慑任何挑战者的真正安全架构。邻国之所以签署，是因为他们真心愿意，而这正是它能够持久的原因。"
 SIA_war_economy_push: "推行战时经济"
 SIA_war_economy_push_desc: "国家已转入战时动员状态。生产消费品的工厂正被改造，转而制造炮弹和枪管。军费开支上限已被取消，采购合同不再经历惯常的拖延，三座新的兵工厂正在曼谷都市区匆匆清理出的空地上拔地而起。"
 SIA_friends_abroad: "海外之友"
 SIA_friends_abroad_desc: "泰国武装部队数十年来一直与外国伙伴进行联合训练。通过联合演习、军官交流和武器转让建立的双边联系，是泰国安全体系中一根默默支撑的支柱，虽然不如联盟那样引人注目，但却比大多数联盟更加持久。现在是时候将这些行之有效的机制正式化了。"
 SIA_cobra_gold_focus: "金色眼镜蛇"
 SIA_cobra_gold_focus_desc: "“金色眼镜蛇”演习是亚洲规模最大的年度联合军事演习，由泰国和美国共同主办。深化演习计划，使泰国皇家陆军能够熟悉美国的军事理论、后勤训练和装备，并巩固曼谷作为华盛顿在东南亚大陆地区核心合作伙伴的地位。"
 SIA_partner_japan: "日本防卫关系"
 SIA_partner_japan_desc: "日本的国防装备出口改革为泰国采购开辟了新的渠道。东京能够提供精密制造技术、两用电子产品和基础设施融资，这些都与泰国的能力形成互补，而且不像中国或美国的方案那样附带政治条件。"
 SIA_partner_korea: "韩国防务伙伴关系"
 SIA_partner_korea_desc: "韩国仅用一代人的时间就建立起了极具竞争力的军工产业。K-2坦克、FA-50战斗机和K9榴弹炮以极具竞争力的价格销往东南亚各地的合作伙伴。泰国也加入了这一行列，并引进了韩国标准的空军训练和工业技术。"
 SIA_partner_australia: "五眼邻居"
 SIA_partner_australia_desc: "澳大利亚是泰国最亲密的英语国家伙伴，也是美国的非北约盟友。两国在安达曼海和泰国湾举行的联合演习加深了海军间的联系。扩大伙伴关系能够带来两国军队的互操作性和海上监视合作，而这些合作是任何一方单独都无法承担的。"
 SIA_partner_taiwan: "静默防御合作"
 SIA_partner_taiwan_desc: "台湾的国防工业行事低调，技术精湛，且出于政治动机寻求盟友。曼谷不承认台北，但泰国皇家陆军和中华民国军队长期以来一直保持着非正式的装备和训练交流渠道。悄悄地将这种合作正式化是一项经过深思熟虑的冒险之举。北京会注意到这一点。"
 SIA_hedging_partners: "远东的朋友们"
 SIA_hedging_partners_desc: "东京、首尔和北京都能为曼谷提供华盛顿无法提供的东西：耐心资本、两用技术以及庞大的邻近市场。它们都不要求独家合作。泰国同时与这三者保持密切联系，并维持自身价值，拒绝成为任何一方的锚点或客户。对于一个已经致力于对冲风险的王国而言，这些关系可谓双赢。"
 SIA_national_grid: "为王国提供动力"
 SIA_national_grid_desc: "泰国快速的工业化进程已经超越了其电网的承载能力。东部沿海地区工厂林立，但电网老化严重，输电损耗令人尴尬，未来十年的增长需要一个能够承载更大负荷的基础架构。政府承诺进行全国基础设施升级，包括新建变电站、升级输电线路，并在电网最终能够供电的地区新建工厂。"
 SIA_renewable_push: "可再生能源驱动"
 SIA_renewable_push_desc: "泰国拥有丰富的可再生能源资源，包括来自海湾的风能、遍布中部平原的太阳能以及北部的小型水力发电。然而，这些资源长期以来一直未得到充分利用。该项目旨在泰国各地建设大型可再生能源设施，并将其电力直接并入国家电网。"
 SIA_green_grid: "绿色电网"
 SIA_green_grid_desc: "可再生能源装机容量是一回事，能够利用这些容量的电网又是另一回事。储能、智能调度和现代化输电将沙特阿拉伯王国的太阳能发电场和风力发电场连接成可靠的电力供应网络，而每块新的太阳能电池板或风力涡轮机都能更快地接入这个经过加固的电网主干。沙特阿拉伯王国的能源独立由此开始。"
 SIA_fossil_fuels_deal: "海湾能源合作伙伴"
 SIA_fossil_fuels_deal_desc: "沙特阿拉伯的炼油厂依赖海湾原油，其发电厂则燃烧进口天然气。曼谷方面并没有试图摆脱这种依赖，而是将其正式化。与沙特阿拉伯、卡塔尔和阿联酋签订的长期供应协议，不仅带来了价格稳定，通过现代化电厂改造提升了燃油效率，还带来了一笔可观的财政收入，以及随之而来的友好外交关系。"
 SIA_gulf_energy_ties: "战略燃料储备"
 SIA_gulf_energy_ties_desc: "一艘从未出海的油轮，就像一座从未启动的发电站。两座战略燃料储存设施分别在南部工业走廊和东部沿海地区拔地而起。海湾合作伙伴出资一半，其余部分由泰国工程师建造。"
 SIA_iron_fist_doctrine: "铁拳理论"
 SIA_iron_fist_doctrine_desc: "不再有任何抱怨之言。这三个省份已被军队、检查站和紧急权力所淹没。叛乱是安全问题，必须以迅速、强硬且毫不妥协的方式予以解决。世界将会谴责。南方将会保持平静。"
 SIA_martial_law_south: "南方戒严"
 SIA_martial_law_south_desc: "紧急法令将北大年府、也拉府和那拉提瓦府置于军管之下。宵禁、无证搜查和未经指控的拘留成为南部地区民众日常生活的常态。军队如今可以随时根据情报采取行动，而民众也开始体会到窝藏持枪者的代价。"
 SIA_search_and_destroy: "搜索并歼灭"
 SIA_search_and_destroy_desc: "特种部队和航空兵对疑似犯罪团伙网络进行扫荡。行动果断有力，伤亡惨重。每一次击中目标的突袭都能进一步削弱叛乱势力，而每一次误伤婚礼的突袭则反而为他们输送了一代新兵。"
 SIA_pacification_complete: "完成治安任务"
 SIA_pacification_complete_desc: "路边炸弹袭击停止了，检查站也已撤除。清真寺受到监视，学校受到监控，沉默之下的不满并未消散。枪声停止了，但余烬犹存。"
 SIA_royal_development_projects: "皇家发展项目"
 SIA_royal_development_projects_desc: "在国王的倡议下，王室的发展模式被引入南部，包括灌溉、农业、道路建设以及王室资助的合作社。其传递的信息是：为马来穆斯林南部地区谋福祉的是君主制，而非叛乱势力。这不仅仅是巡逻，更是王室的庇护和存在。"
 SIA_isoc_southern_command: "国安司令部南方总部"
 SIA_isoc_southern_command_desc: "国安司令部对南部战区实行统一指挥，将军民协调、情报融合和软实力运作全部纳入同一机构。如果国安司令部网络已经成熟，南部战区司令部就能从被动应对转变为主动出击。"
 SIA_winning_hearts_royally: "赢得人心，皇家风范"
 SIA_winning_hearts_royally_desc: "奖学金、清真寺修缮、清真认证开发区，以及刻意提拔当地马来穆斯林名流进入庇护体系。国家并非以占领者的身份出现，而是以恩人的身份出现，在某些地方，年轻人的算计也逐渐发生了转变。"
 SIA_southern_calm: "南方的平静"
 SIA_southern_calm_desc: "暴力冲突已逐渐消退，取而代之的是一种受控的、受监控的平静。虽然没有条约，也没有自治权，但各省依然运转，王室的庇护依然有效。这种平静靠的是王室的存在和庇护来维持。"
 SIA_peace_dialogue_initiative: "和平对话倡议"
 SIA_peace_dialogue_initiative_desc: "曼谷正式启动吉隆坡谈判，马来西亚担任斡旋方。这是泰国政府首次与它一直以来追捕的对象坐下来谈判，并承认南方的未来应通过谈判解决，而不仅仅是武力。这在国内耗费了政治资本，但却开辟了一条枪林弹雨永远无法企及的道路。"
 SIA_mara_patani_talks: "北大年人民诚信委员会谈判"
 SIA_mara_patani_talks_desc: "与北大年人民诚信委员会联盟的正式谈判正式启动。建立信任措施、安全区和真正的停火框架都被提上议程。吉隆坡方面积极介入，而内部虽有分歧但依然存在的叛乱领导层也开始相信达成和解是可能的。"
 SIA_autonomy_framework: "特殊自治框架"
 SIA_autonomy_framework_desc: "谈判代表为这三个省份起草了一部特别行政法，其中包括选举产生的区域委员会、地方语言教育、宗教法庭，以及南部地区保留一部分发展收入。这是泰国历史上影响范围最广的让步，曼谷的当权派已经开始动员起来反对它。"
 SIA_pattani_peace_accord: "北大年和平协议"
 SIA_pattani_peace_accord_desc: "一份签署的协议结束了泰国现代史上持续时间最长的叛乱。南部地区在统一的泰国境内获得了一定程度的自治权，武装人员交出了武器，流离失所者返回家园。这份协议并不完美，仍存在争议，但却具有历史意义。冲突结束了。"
 SIA_ds_tier_to_1: "§G泰南三府趋于平静，局势缓和（一级，稳定度-2%）。§!"
 SIA_ds_tier_to_2: "§Y北大年暴力事件不断升级（T2,-4%稳定度，-5%政治点数）§!"
 SIA_ds_tier_to_3: "§R南方燃起战火（T3，-7%稳定度，-10%政治点数，-5%战争支持度）§!"
 SIA_ds_intensity_down: "§G叛乱强度下降[?ds_delta]点§!"
 SIA_ds_intensity_up: "§R叛乱强度上升[?ds_delta]点§!"
 SIA_ds_grievance_up: "§R强硬手段会加剧社区的不满情绪增加[?ds_grievance_delta]。冲突的底线也会随之升高，单靠武力已无法平息冲突。§!"
 SIA_ds_grievance_down: "§G真诚的让步可以缓解社区的不满（[?ds_grievance_delta]）。暴力事件的强度底线下降，真正的解决之道指日可待。§!"
 SIA_iron_fist_doctrine_tt: "向这三个省份大量部署军队。\n - 叛乱强度§G-10§!\n - 政变危险§R+10§!\n - 显著加深社区不满，将冲突的底线提升到了一个前所未有的高度。"
 SIA_martial_law_south_tt: "对北大年府、也拉府、那拉提瓦府发布紧急法令。强度-8，加剧不满，马来西亚/印度尼西亚关系值-。"
 SIA_search_and_destroy_tt: "强力扫荡。强度-12，加剧不满。南方局势强度需低于50方可启动。存在暴行适得其反的风险。"
 SIA_pacification_complete_tt: "枪声停止了，但余烬犹存。"
 SIA_royal_development_projects_tt: "南方皇家倡议项目。强度 -6，缓解不满，稳定度 +2%，国库 -3。"
 SIA_isoc_southern_command_tt: "国安司令部接管南方指挥部。强度-7（如果国安司令部网络处于激活状态，则强度提升更快），但监视网会激起些许不满。"
 SIA_winning_hearts_royally_tt: "庇护与发展。强度-7，大幅缓解不满，稳定度 +3%。需要南方地区强度低于40才能启动。"
 SIA_southern_calm_tt: "在皇室庇护下，平静得以维持。"
 SIA_peace_dialogue_initiative_tt: "开启吉隆坡通道。强度-5，缓解不满，政治点数 -75，开启谈判。"
 SIA_mara_patani_talks_tt: "与北大年人民诚信委员会举行正式会谈。强度 -8，大幅缓解不满情绪，马来西亚关系值+，需要45%的稳定度。"
 SIA_autonomy_framework_tt: "起草特殊区域法。既得利益集团会反对。\n - 叛乱强度§G-7§!\n - 这是所有选项中对社区不满情绪影响最大的。\n - 要求南部叛乱强度低于§Y35§!才能开始"
 SIA_pattani_peace_accord_tt: "签署协议，走上自治之路。冲突结束。"
 SIA_anti_narcotics_bureau: "禁毒局"
 SIA_anti_narcotics_bureau_desc: "泰国禁毒委员会规模扩大，权力增强，拥有专项预算、受保护的调查权以及正式的职责，专门打击贩毒网络而非街头毒贩。该委员会的目标是整个毒品供应链，从掸邦的制毒窝点到曼谷的分销中心，无一幸免。"
 SIA_golden_triangle_interdiction: "金三角禁区"
 SIA_golden_triangle_interdiction_desc: "泰国、缅甸和老挝三国交界地区是大量海洛因和冰毒的源头，这些毒品涌入泰国城市并流入世界市场。边境巡逻队已加强，空中监视范围扩大，一支与掸邦民兵合作的联合特遣部队也已成立，旨在拦截越过湄公河的毒品运输。毒枭们会像往常一样调整策略，但这无疑增加了他们的成本。"
 SIA_golden_triangle_interdiction_tt: "切断湄公河沿岸的贩运路线，加强王国对北部的控制。"
 SIA_anti_graft_push: "反贪污运动"
 SIA_anti_graft_push_desc: "国家反腐败委员会获得了更大的权力，扩大了调查权限，设立了专项预算，并为举报人提供了法律保护。国防、建筑和海关这三个最容易滋生贪腐的领域，采购违规行为成为首要打击目标。建立廉洁的合同体系比巩固旧制度要缓慢得多。强行推行廉洁合同会耗费政治资本，并会令习惯于旧模式的公众感到不安。"
 SIA_transparency_watchdog: "透明度监督机构"
 SIA_transparency_watchdog_desc: "一个独立的财政透明办公室成立，直接向议会而非财政部报告。高级公务员必须披露资产，公共采购实行实时报告，并设立了公民审计门户网站，这些措施堵住了长期以来系统性寻租行为得以持续存在的漏洞。腐败并未消失，但维持腐败的成本显著增加，而那些被揭露的腐败网络会在六个月内通过程序和拖延进行反击。"
 SIA_watchdog_backlash: "旧体制的反击"
 SIA_watchdog_backlash_desc: "新的透明化制度所揭露出的关系网络并未就此消失。在长达六个月的时间里，它们通过程序性手段、拖延战术和静默阻挠来对抗改革，不断侵蚀着政治权力——而在那些与之纠葛最深的省份，公众信心也在随之流失。"
 SIA_decentralize_governance: "赋权地方"
 SIA_decentralize_governance_desc: "在反腐败行动之后，治理权与预算分配从曼谷下放至各府。省级行政组织获得更大的职权，民选府尹掌控地方基础设施支出，清迈、孔敬和宋卡正崛起为真正的次级经济中心。增长的集中速度虽有所放缓，但这条更为平静、稳健的道路，确保了国家的稳定。"
 SIA_bangkok_primacy: "曼谷优先"
 SIA_bangkok_primacy_desc: "反腐败的红利被重新投入首都。曼谷的工业区得到升级，研究机构更加集中，公共交通基础设施得以扩展。效率与研究产出大幅攀升，但批评者指出，繁荣正在这座千万人口的城市中聚集，而各府仍在等待，由此滋生的不满情绪正在切实拖累整个国家的士气。"
 SIA_asean_hegemony: "东盟霸权"
 SIA_asean_hegemony_desc: "大泰国计划在大陆已完成。如今王国将目光投向东南亚其余地区。东盟在精神上始终是泰国主导，我们要让它在事实上也成为如此，如有必要，则诉诸武力。总参谋部正在起草针对群岛和城邦的征服计划。"
 SIA_maritime_claims: "海上边疆"
 SIA_maritime_claims_desc: "越过地峡，便是伟大的群岛国家，马尼拉、雅加达，以及石油资源丰富的文莱苏丹国。向蓝水推进将需要泰国皇家海军和海军陆战队的全力投入。海军部开始规划跨越南海及爪哇航线的两栖作战行动。"
 SIA_maritime_claims_threat: "群岛海军建设"
 SIA_maritime_claims_bonus: "两栖作战学说"
 SIA_claim_philippines: "征服菲律宾"
 SIA_claim_philippines_desc: "菲律宾群岛扼守南海东侧的门户。将马尼拉纳入曼谷的治下，既可保障海上侧翼，又能为新秩序获得一亿菲律宾人的劳动力。我们将向菲律宾的每个岛屿都提出主权要求。"
 SIA_claim_indonesia: "征服印度尼西亚"
 SIA_claim_indonesia_desc: "印度尼西亚是南方的巨人，幅员辽阔，人口众多，资源丰富。要掌控东盟，曼谷必须先掌控雅加达。这场战役将是漫长的，岛屿众多，但回报是东南亚最大的经济体和人口。"
 SIA_claim_brunei: "夺取文莱"
 SIA_claim_brunei_desc: "文莱虽小，却坐拥该地区最丰富的油气资源之一。苏丹国的财富及其在婆罗洲的战略位置，使其成为难以抗拒的猎物。我们行动，将苏丹国并入王国。"
 SIA_mainland_claims: "平定大陆"
 SIA_mainland_claims_desc: "大陆上的两股势力尚未屈服。安南山脉另一侧的宿敌越南，以及扼守马六甲海峡的富裕城邦新加坡，都必须被降服，方能成就泰国在东南亚的霸权。"
 SIA_mainland_claims_threat: "泰国动员对抗大陆残余势力"
 SIA_mainland_claims_bonus: "边境战争学说"
 SIA_claim_vietnam: "征服越南"
 SIA_claim_vietnam_desc: "越南长期以来一直与泰国争夺中南半岛，从古代暹罗的宫廷到二十世纪的杀戮战场。如今，这场历史性的对抗将一决胜负。我们将对湄公河到安南山脉海岸提出领土主张。"
 SIA_claim_singapore: "夺取新加坡"
 SIA_claim_singapore_desc: "新加坡是海峡上的明珠，金融强国，也是全球最繁忙航运通道的守门人。谁掌握狮城，谁就扼住了亚洲商业的咽喉。我们将使之归于泰国之手。"
 SIA_asean_protector: "东盟监护者"
 SIA_asean_protector_tt: "合作之路向任何政府敞开，§Y大泰的各个附庸§!也不例外。"
 SIA_asean_protector_desc: "大泰王国无需成为征服的帝国。在稳固大陆之后，王国可以转而成为东南亚安全的保障者，一个仁慈的霸主，保护邻国而非吞并它们。曼谷将其保护延伸至整个地区，通过联盟而非占领，将东盟与泰国王室紧密相连。"
 SIA_guarantee_maritime: "群岛之盾"
 SIA_guarantee_maritime_desc: "泰国向海上国家菲律宾、印度尼西亚和文莱提供正式安全保障。皇家泰国海军将为其独立提供担保，作为回报，曼谷成为南部海域不可或缺的力量。"
 SIA_guarantee_mainland: "大陆守护者"
 SIA_guarantee_mainland_desc: "曼谷保障越南、新加坡和马来西亚的安全，以泰国主导的和解决议终结了数百年的对抗。昔日的敌人、富庶的城邦以及半岛邻国，皆栖身于王国的庇护之下，大陆在泰国主导的和平中归于安定。"
 SIA_guarantee_indochina: "印度支那的保护伞"
 SIA_guarantee_indochina_desc: "霸权国家通常会忽略泰国最贫困、最脆弱的邻国。但曼谷却依然保障它们的利益：老挝、柬埔寨、缅甸，以及缅甸边境的那些小邦。唯有惠及弱者的保护，才能真正证明泰国王国言出必行。"
 SIA_protector_of_asean_focus: "一个东盟，一个盾牌"
 SIA_protector_of_asean_focus_desc: "一份签署的保护伞协议足以改变该地区的政治格局。无论曼谷最初向哪一方提供保障，泰国都扮演着东南亚保护者的角色，而由泰国主导的安全架构也开始取代以往的恐惧平衡。该地区的防御体系正变得不可分割，而曼谷则掌握着关键地位。"
 SIA_professional_officer_corps_focus: "专业军官团"
 SIA_professional_officer_corps_focus_desc: "改革派最终胜出。他们主张以能力晋升，建立真正的参谋学院人才输送渠道，并构建以理论而非裙带关系为基础的指挥文化。随着军队逐渐以军旅生涯而非政治为荣，政变的恶习也将逐渐消退。"
 SIA_martial_prestige_focus: "剑的荣耀"
 SIA_martial_prestige_focus_desc: "传统主义者占据上风。军队被奉为国家灵魂，阅兵场如同圣殿般神圣。士气高昂，尚武精神高涨，但对军装的盲目崇拜使将领们牢牢把持着权力中心。"
 SIA_jointness_reform: "联合改革"
 SIA_jointness_reform_desc: "联合指挥部队将三军整合为一个作战单位。通过整合参谋机构、共享作战理论和统一指挥链，原本平行的指挥结构演变为一支能够进行多域作战的协同作战力量。"
 SIA_defense_export_office: "国防出口办公室"
 SIA_defense_export_office_desc: "一个专门机构，通过促成合同、安排融资，将泰国制造的系统推向世界市场，并将国防工业基地转变为收入来源而不是预算负担。"
 SIA_self_reliant_defense_base: "自力更生防御圈"
 SIA_self_reliant_defense_base_desc: "新建的兵工厂与深化的供应链，使王国摆脱了对外国供应商的依赖。泰国如今能够凭借自己的工厂、自己的设计、自己的节奏，为自己及其客户提供武器装备。"
 SIA_total_defense_doctrine: "全面防御学说"
 SIA_total_defense_doctrine_desc: "国防成为一项全民事业——扩大征兵范围、开展常态化的民防演习、夯实本土防线。王国所准备的，不仅仅是一支军队，而是一个随时准备抵抗的社会。"
 SIA_doctrine_professional_tt: "将§Y职业军队§!精神提升至下一等级，并使王国致力于职业化道路。"
 SIA_doctrine_prestige_tt: "为§Y军事荣耀§!而战，并将王国推向威望之路——以稳定度为代价，换取高战争支持度与指挥点数。"
 SIA_national_rnd_network: "建设科技园区"
 SIA_national_rnd_network_desc: "巴吞他尼府的公共实验室、大学合作伙伴关系以及一座专业科技园，为泰国构建了属于自己的科研根基。国家科学技术发展局统筹着一个研发设施网络，以此加快技术转化，推动整体经济向更高价值的产业迈进。"
 SIA_civilian_rnd_center: "民用研发中心"
 SIA_civilian_rnd_center_desc: "一座专门的民用研究与原型设备开发设施，配备实验室、测试台以及一支可自由探索王国未来所需一切领域的工程师团队。这是继王国最初仅有的一座海军船坞之后，设立的第四个研究中心，也为自主开发项目提供了充足空间。"
 SIA_air_rnd_center: "航空研发中心"
 SIA_air_rnd_center_desc: "一座航空电子与航空工程设施，配备风洞、仪表化试飞场及配套的工程师团队。泰国工业由此获得了在本土进行飞机系统原型开发的试验平台，而无需从国外购买成品。"
 SIA_army_rnd_center: "陆战研发中心"
 SIA_army_rnd_center_desc: "一座地面武器系统试验场，配备装甲测试跑道、武器靶场及一个设计局。陆军得以自主开发和原型制造自己的车辆与装备，而无需等待外国供应商及其附带条件。"
 SIA_gistda_space_agency: "强化GISTDA"
 SIA_gistda_space_agency_desc: "地理信息与空间技术发展局（GISTDA）终于获得了一项真正的使命与一笔实实在在的预算。这个原本为解读卫星数据而成立的机构，如今已成为王国的航天机构——运营地面站、培养工程师，并为泰国科研提供俯瞰万物的一扇窗。小型太空计划不再是外国的奢侈品，而成为国家的能力。"
 SIA_theos_earth_observation: "“泰遥”地球观测卫星"
 SIA_theos_earth_observation_desc: "泰国第一颗地球观测卫星“泰遥”（THEOS），为王国开启了轨道上的“眼睛”——测绘国土、追踪洪灾与作物、并向情报部门提供任何邻国都无法否认的影像数据。后续计划将深化该局在光学、下行链路与图像处理方面的专业能力，将原始过境数据转化为可用的侦察情报。"
 SIA_space_krenovation_park: "太空科创园"
 SIA_space_krenovation_park_desc: "一座航空航天产业园区在东部海滨拔地而起，配备洁净室、装配大厅以及卫星组件和小型运载火箭的供应链。最初只是一个研究机构的存在，如今已成为国内航空航天工业的支柱，吸引私营企业入驻，并为泰国工程业提供了一个名副其实的高价值产业领域。"
 SIA_sovereign_launch_capability: "主权航天能力"
 SIA_sovereign_launch_capability_desc: "王国决心补齐最后一块短板——即自主设计、建造和发射卫星的能力，无需征得任何人的许可。一项本土发射与卫星星座计划，为二十年的努力加冕，使泰国跻身少数拥有自主太空立足点、且情报触角不受制于任何外国的国家行列。"
 SIA_ptt_energy_champion: "国家石油，能源冠军"
 SIA_ptt_energy_champion_desc: "国有能源企业被推向证券交易所，化身为商业巨头。凭借首次公开募股所得资金以及从泰国湾至缅甸的勘探授权，国家石油公司既保障了王国的燃料供应，也跃升为国内最大的单一企业。"
 SIA_scg_industrial_titan: "暹罗水泥集团"
 SIA_scg_industrial_titan_desc: "王国历史最悠久、规模最大的工业集团，从水泥业务拓展至石化、建材和包装领域。暹罗水泥集团的订单簿支撑着建设热潮，并锚定了一条任何基础设施项目都不可或缺的国内供应链——随着该集团越发仰赖许可审批体系，其税收贡献也随之增长。"
 SIA_packaging_empire: "包装箱帝国"
 SIA_packaging_empire_desc: "暹罗水泥集团的包装业务部门在证券交易所上市，随后在整个区域内展开收购——从印度尼西亚到越南，一路整合多家造纸厂，直至其印刷与成型产品覆盖半个东南亚。其卖点是循环经济：再生纤维、轻量化塑料、低碳排放。而代价，则落在了那些被其收购或被其低价挤压的小型印刷厂和纸箱制造商身上。"
 SIA_cp_agribusiness_giant: "正大集团"
 SIA_cp_agribusiness_giant_desc: "从饲料加工厂到7-Eleven便利店，正大集团已成为泰国的农业综合企业与零售巨头。合同农业提升了农村收入、充实了货架，而正大的出口实力则将泰国食品销往亚洲每一个市场。商品化农业的生产力在整个合同农业网络中稳步攀升，依善稻米带又新增了一个产区。"
 SIA_buffer_states: "缓冲屏障"
 SIA_buffer_states_desc: "泰国不会吞并掸族和克伦族，而是让他们继续生存并保持武装——以此作为一道友好的缓冲屏障，在缅甸的压力触及王国之前先行将其吸收。跨境补给线、训练营地与静默的保证，将边境叛乱武装转化为一面盾牌。"
 SIA_protectorate_doctrine: "庇护理论"
 SIA_protectorate_doctrine_desc: "总参谋部最终选择了较为温和的帝国统治工具——不是征服，而是藩属。边境各小邦将被纳入泰国的保护之下，成为附庸国，它们的旗帜仍可在各自都城上空飘扬，但实权归于曼谷。"
 SIA_annexation_doctrine: "吞并理论"
 SIA_annexation_doctrine_desc: "绝不折中。边疆地带将被直接夺取，其领土并入王国版图，分离主义政府予以解散。曼谷对掸族和克伦族的核心腹地提出领土要求，并准备以军队强制执行。"
 SIA_subdue_the_shan: "征服掸邦"
 SIA_subdue_the_shan_desc: "泰国皇家陆军向南掸邦推进。最终是成为保护国还是行省，取决于所选方针，但无论如何，曼谷的号令将直达萨尔温江。"
 SIA_subdue_the_karen: "镇压克伦"
 SIA_subdue_the_karen_desc: "泰军越过克伦山。数十年的庇护与暗中扶持就此终结，王国如今以征服者之姿降临，或扶植傀儡，或直接吞并，一切皆随政策所指。"
 SIA_burma_breakaway_question: "分离主义政权"
 SIA_burma_breakaway_question_desc: "萨尔温江对岸，缅甸的统治已瓦解为一片武装割据的碎片——掸邦、克伦邦、佤邦。它们虚弱、分裂，且正好处于泰国的掌控范围之内。曼谷必须决定，这些脱离的领土对王国而言究竟是什么——是盾牌，是战利品，还是需要处理的麻烦。"
 SIA_subdue_the_wa: "征服佤邦"
 SIA_subdue_the_wa_desc: "佤邦联合军是各支割据武装中实力最强、也最深陷毒品泥潭的一支。要平定佤山地区，必将是一场硬仗，但这能切断王国门前的一条毒品通道，并将泰国国旗深深插进缅甸边境地带。"
 SIA_rta_looks_abroad: "六十年之M48"
 SIA_rta_looks_abroad_desc: "泰国皇家陆军仍在装备着上个世纪的坦克与装甲车。换装的问题已不再是“是否要换”，而是“换上谁家产品驶入呵叻大门”，以及“附带怎样的条件”。凡是有产能的地方，新的生产线都已拔地而起。"
 SIA_stryker_brigades: "西方战车之车轮"
 SIA_stryker_brigades_desc: "斯特赖克旅、美式作战条令，以及一条与全球最强大军队直接对接的后勤链。这套装备确实出色，互操作性价值无可估量——但每一发炮弹都以美元结算，并以对华盛顿的某种顺从为代价。"
 SIA_eda_blackhawks: "超级大国的旧物箱"
 SIA_eda_blackhawks_desc: "通过“超额防务物资”和“对外军售”渠道，经翻新的“黑鹰”与“眼镜蛇”直升机以远低于标价的价格抵港。这些机身虽是二手货，但以有限预算换取空中机动能力，是一笔唯有同盟关系才可能达成的划算交易。"
 SIA_vn1_mechanization: "装甲到连"
 SIA_vn1_mechanization_desc: "VN1与VN16型装甲车成百地从中国生产线驶出，其总价仅相当于几辆西方车辆的成本。步兵终于有了运载工具，而制造它们的工厂，在年底之前就已收回成本。"
 SIA_norinco_fires: "北方工业的货架"
 SIA_norinco_fires_desc: "SH1自行榴弹炮、SR5火箭炮——整套目录按打包价出售。火力确实强劲，但零备件排队和战场上的传动系统故障也同样真实。廉价装备，足以让军需官夜不能寐。"
 SIA_tavor_standard: "我们自己的武装"
 SIA_tavor_standard_desc: "获得许可的“塔沃尔”步枪本土化生产，将泰国工厂变为陆军制式步枪的供应来源。没有禁运，没有等待名单，没有外国对我们向谁提供武器的否决权——这仅仅是建立一个唯曼谷马首是瞻的军火库的第一块基石。"
 SIA_oplot_and_rotors: "巴扎外交"
 SIA_oplot_and_rotors_desc: "乌克兰的“堡垒”坦克车体、俄罗斯的米-17旋翼——市场向一个不选边站的买家提供的一切，应有尽有。作战能力从四面八方同时汇聚而来，而以一种可控的尺度，同时惹恼华盛顿和北京。"
 SIA_dti_black_widow: "黑寡妇蜘蛛"
 SIA_dti_black_widow_desc: "国防技术研究所自主研发的8×8轮式装甲车，以及财生利公司经过实战检验的“首胜”防雷车——泰国设计、泰国制造，且性能足以吸引他国购买。这座军火库已经开始为自己挣回成本。"
 SIA_first_army_modernized: "皇家陆军焕新"
 SIA_first_army_modernized_desc: "无论换装之路如何曲折，最终成果终于呈现在阅兵场上。一支现代化的泰国皇家陆军，经过重新装备、重新训练，已准备好迎接它真正需要战斗的世纪。"
 SIA_gripen_globaleye: "天空全视眼"
 SIA_gripen_globaleye_desc: "萨博的“全球眼”预警机将少量“鹰狮”战机转变为一张网络化作战力量，能够先敌发现、先敌打击。机载雷达是倍增器，使一支小型空军能够发挥远超其数量的战斗力。"
 SIA_j10_squadrons: "廊曼之上的飞龙"
 SIA_j10_squadrons_desc: "歼-10CE多用途战斗机，以中队为单位交付，价格令华盛顿永远无法匹敌，也令华盛顿永远无法谅解。选择成都而非沃斯堡，不仅重塑了王国的天空，也重塑了它的联盟版图。"
 SIA_hq9_air_defense: "导弹穹顶"
 SIA_hq9_air_defense_desc: "HQ-9和FK-3远程地空导弹在中部平原上空撑起保护伞。廉价、密集且一体化。这就是中国式的区域拒止。"
 SIA_wing_loong_uav: "耐心的猎手"
 SIA_wing_loong_uav_desc: "翼龙与CH系列无人机可滞空一整天，待命后按指令出击。以一支有人驾驶中队的成本，换来大规模无人侦察与精确打击能力。"
 SIA_f5th_super_tigris: "老虎新活"
 SIA_f5th_super_tigris_desc: "以色列的航空电子设备、有源相控阵雷达以及“蟒蛇-5”空空导弹，将久经考验的F-5战斗机升级为F-5TH“超级虎”。这并非一款全新战机，而是从已然付清成本的老旧机身上榨取出的战斗力——不欠任何超级大国的人情。"
 SIA_dti_uav_command: "主权之眼"
 SIA_dti_uav_command_desc: "国防技术研究所设计的无人机编队，完全在国内设计并完成试飞，为泰国提供了自主的侦察视图，同时也为邻国提供了可购买的产品。"
 SIA_air_dominance_doctrine: "天空之主"
 SIA_air_dominance_doctrine_desc: "无论装备何物，泰国皇家空军最终成为一支现代化、网络化、多用途的力量，主宰着它誓死捍卫的领空。"
 SIA_korean_frigates: "普密蓬标准"
 SIA_korean_frigates_desc: "西方舰队技术路线。一艘韩国制造的现代化DW3000型护卫舰，配备西方作战系统、区域防空能力，以及这支舰队有史以来最强大的水面作战力量。品质自有其价格，首尔开出的价码是美元。"
 SIA_chinese_engine_compromise: "中国产核心"
 SIA_chinese_engine_compromise_desc: "德国的发动机永远不会来了，这艘船已经等了十年。接受中国的CHD620动力装置，潜艇终于能出海了——便宜、自主，只是磨合期里工程师们得花上一年时间骂骂咧咧。"
 SIA_type071_flotilla: "沪东船厂出品"
 SIA_type071_flotilla_desc: "一艘071E型船坞登陆舰和一批中国制造的巡逻舰，以一艘西方舰艇的价格，便让舰队在一夜之间拥有了一支两栖作战力量。"
 SIA_krabi_class_opv: "自造龙骨"
 SIA_krabi_class_opv_desc: "舰队自主之选。曼谷船坞建造的甲米级近海巡逻舰，为自主造船业奠定基石。虽成长缓慢，却不受制于任何外国船厂。"
 SIA_european_propulsion: "泰体西用"
 SIA_european_propulsion_desc: "这是一笔购买，而非合伙。一次性购入MTU柴油发动机和作战系统的生产许可，然后将其拆解至每一个螺栓，其余部分在国内自行建造。引进的技术知识，被吸收到一个独立自主的计划之中——不亏欠任何庇护者。"
 SIA_naval_self_reliance: "曼谷造护卫舰"
 SIA_naval_self_reliance_desc: "泰国船厂如今正铺设自主设计的战舰龙骨，一个集海军防务工业基础于一体、兼具生产能力与出口能力的体系已然成形。泰国舰队，终于是在本土建造的了。"
 SIA_command_of_the_seas: "两个海湾，一支舰队"
 SIA_command_of_the_seas_desc: "无论其建造历程如何，泰国皇家海军已成长为一支真正的蓝水海军，既能掌控暹罗湾，又能深入安达曼海，统御着冲刷王国两翼海岸的海域。"
 SIA_the_western_anchor: "华盛顿的前哨"
 SIA_the_western_anchor_desc: "陆、海、空三军装备均采自西方，同盟关系成为国防的基石。以互操作性、情报共享以及美国隐含的安全保证为交换，将自身牢固地置于华盛顿的轨道之内。"
 SIA_the_bamboo_bloc: "寻求龙之荫庇"
 SIA_the_bamboo_bloc_desc: "三军装备均来自北京，使泰国成为中国在地区内最大的武器客户。廉价的规模、共享的C4ISR体系，以及一个强大的庇护者——代价则是西方信任的流失。"
 SIA_strategic_autonomy: "独立自主"
 SIA_strategic_autonomy_desc: "一支日益在本土建造、并对外出口的武装力量。国防技术研究所正成为地区性的军火供应商，而王国不再依赖外国资本来维系自身的防务手段。"
 SIA_the_bamboo_doctrine: "见风使舵"
 SIA_the_bamboo_doctrine_desc: "瑞典的“鹰狮”战斗机、中国的坦克、北京的潜艇、韩国的护卫舰——泰国从各方采购，却不属于任何一方。在风暴中弯曲的芦苇才能幸存。这是泰国最古老的生存智慧，如今在军力编成中化为现实。"
 SIA_dual_use_threshold: "核能临界点"
 SIA_dual_use_threshold_desc: "每一个民用核能计划，都包含武器计划所需的同一套工艺。在能源自主的掩护下，悄然掌握核燃料循环——以铀浓缩为名，王国保持所有选项开放，而无需公开宣示任何一项。"
 SIA_minimum_deterrent: "最低限度威慑"
 SIA_minimum_deterrent_desc: "寥寥数枚弹头，仅此而已，但足以让任何邻国和任何大国再也不能将王国视作等闲。泰国以自己的方式加入核俱乐部，而内阁现在必须公开表明其核武器的用途。"
 SIA_the_democrats_endure: "民主党永存"
 SIA_the_democrats_endure_desc: "民主党——王国历史最悠久的政党——继续紧握执政权，未向民粹浪潮退让。没有压倒性胜利，没有魅力超凡的亿万富翁，只是以广泛的平民联合政府形式，从事着耐心而平淡的治国事务。该党将自己的未来押注于制度之上，而非某一位领袖。"
 SIA_chuan_clean_government: "廉洁政府"
 SIA_chuan_clean_government_desc: "清廉先生掌舵。个人廉洁的声誉成为党的品牌，公开预算、专业化部门，以及对“红包黑金”的战争。这不会光鲜亮丽，但会打造出一套体制，将诚实治理转化为持久的选民基础。"
 SIA_rule_of_law: "依法治国"
 SIA_rule_of_law_desc: "一个以宪法为生命、誓死捍卫其精神的政府。正当程序、可预期的行政体系，以及向法律而非军营负责的法院。每一次政变都始于突破规则，因此王国学会了珍视规则。"
 SIA_judicial_independence: "独立司法"
 SIA_judicial_independence_desc: "将司法体系从王室网络与将军们的掌控中隔离出来。一个无法被施压的法官席，是阻止“解散—政变”循环最可靠的制动器，同时也能从根源上钝化旧体制最惯用的武器——操纵司法。"
 SIA_strengthen_parliament: "强化议会"
 SIA_strengthen_parliament_desc: "为民选议会配备人员、委员会和足以真正执政的权威。一个运转有效的立法机构，让政党通过选票而非紧急法令来治理国家，也让公众在每一届会议的成果中拥有切身的利益。"
 SIA_liberal_market_stewardship: "自由市场管理"
 SIA_liberal_market_stewardship_desc: "健全的货币、开放的贸易，以及一个重在监管而非支出的政府。民主党为“他信经济学”提供了技术官僚式的制衡，其增长动力来自金融、出口和私营企业，而非向农村发放现金补助。"
 SIA_southern_stronghold: "南方堡垒"
 SIA_southern_stronghold_desc: "党的核心票仓是南方，而南方积怨已久。以道路、学校和诊所而非检查站来回应这些诉求；以国库实资而非纸上承诺来兑现。以发展换取和平，既能稳固票仓的忠诚，也能削弱叛乱的兵源。"
 SIA_coalition_government: "联合政府"
 SIA_coalition_government_desc: "权力以艰难的方式拼凑而成——通过合作伙伴、区域集团和小党派的组合，缝合出一个可行的多数联盟。它缓慢而充满妥协，但这是坦克最难找到理由去碾压的政府形式。民选秩序依靠分享权力而存活。"
 SIA_mature_democracy: "成熟的民主"
 SIA_mature_democracy_desc: "王国跨过门槛，进入和平交接时期，拥有忠诚的反对派，公众可以将政变视为历史。制度比任何单一运动都更重要：更清廉的行政和持久的权威，是以比更广泛的联盟所能带来的更缓慢的民调攀升为代价换来的。"
 SIA_grand_coalition: "大联盟"
 SIA_grand_coalition_desc: "与其对抗旧秩序，不如将其吸收。民主党成为保守派旧体制选出的门面，赢得地主和商界的支持，而宫廷、官僚机构与董事会则通过选票箱而非兵营来治理。稳定以共识换取，代价却是喂养党昔日所反对的裙带关系网络。"
 SIA_coalition_overhead: "联盟开销"
 SIA_coalition_overhead_desc: "带进大帐篷的每个伙伴都想要分一杯羹。维持联盟所耗费的政治资本，比独自执政时多得多。"
 SIA_democrat_revival: "民主党归来"
 SIA_democrat_revival_desc: "从反对派的荒野中，党在2019年后的联合政府交易中挣扎着重新夺回总理之位。民主党再次执政——更年长、更谦抑，而这一次，他们决心要让文官秩序真正扎下根来。"
 SIA_answer_thaksinomics: "回应他信经济学"
 SIA_answer_thaksinomics_desc: "他信的天才之处在于集结乡村力量，因为曼谷从未这么做。不要嘲笑乡村基金。要建立一个更好的。在泰爱泰党之前启动一个民主党派的农村信贷计划、农民债务延期偿付和廉价医疗方案，这样能从根源上削弱民粹主义的吸引力，而不是放弃农村地区，仅通过法院夺回权力。\n\n§G民粹浪潮退却。§!"
 SIA_pracha_wiwat: "人民的议程"
 SIA_pracha_wiwat_desc: "“幸福社会”计划——九项惠民措施，作为新年礼物集中公布。最贫困家庭免费用电、燃气补贴、摩托车出租车司机和街头摊贩的福利与登记制度，以及为体制外劳动者提供的储蓄选择。这证明了一个自由保守派政党也能回应民生需求，而无需让国库破产。\n\n§G民粹浪潮退却。§!"
 SIA_contest_every_election: "选战绝不缺席"
 SIA_contest_every_election_desc: "无论遭遇何种挑衅——无论是被操纵的提前大选、对逃犯的特赦，还是偏袒的法庭裁决——党都坚守在民主博弈的框架之内。它参加每一次选举，接受每一次结果。这是党在2006年和2014年所放弃的纪律，而它也由此剥去了民粹派唯一真正站得住脚的指控——即民主党只有在军人和法官替他们赢的时候才会赢。\n\n§G民粹浪潮退却§!，街头政治的大门从此永久关闭。"
 SIA_the_street_over_the_ballot: "街头胜过选票"
 SIA_the_street_over_the_ballot_desc: "党受够了在投票箱前一次次落败，索性辞去所有席位，将运动推向街头。抗议活动瘫痪首都，使国家陷入瘫痪，直至民选政府倒台。这招奏效了，首都一片混乱。将军们接过了递到手中的借口，坦克开动，而一个曾代表清廉文官统治的政党，就此被铭记为政变的助产士。\n\n§R王国转入军事统治。民主党路线在此终结，而新秩序自有其根基。§!"
 SIA_break_into_isan: "打入东北"
 SIA_break_into_isan_desc: "结构性缺陷，党从未修补。整整一代人，民主党人坐拥南部和曼谷，却将广袤而贫困的东北部默认让给了他信。不如在那里投入十年时间。建立支部，推举候选人，以伊桑自身的方式提出可信的再分配方案。即便是在民粹主义的心脏地带赢得一个立足点，这股浪潮也将失去其源头。这是通往持久权力最艰难的道路，也是唯一不依赖法院的道路。\n\n§G从此，民粹浪潮的攀升将更加缓慢。§!"
 SIA_board_of_investment: "赋权投促委"
 SIA_board_of_investment_desc: "投资促进委员会一直是泰国的无声引擎，吸引外资并引导泰国企业走向海外。赋予它实权和实打实的预算。投资将变得更便宜、更快捷，曼谷投往海外的每一泰铢都将以更强的姿态回流。"
 SIA_regional_trade_network: "区域贸易网络"
 SIA_regional_trade_network_desc: "将零散的双边协议编织成覆盖东盟及更广区域的真正自由贸易协定网络。泰国现在签署的每一项协议，都将为国库带来关税红利，并扩大泰国海外软实力的影响力。"
 SIA_mekong_soft_power: "湄公软实力"
 SIA_mekong_soft_power_desc: "曼谷坐落于湄公河之源头，河流蜿蜒流经老挝、柬埔寨与缅甸。贸易、援助与投资成为对周边地区实施低调领导力的工具。如今，泰国可在海外发挥其优势，而非仅仅守护自身。"
 SIA_regional_trade_network_tt: "每份签署的贸易协定现在都按月为国库贡献收益，并扩大泰国的对外影响力辐射范围，两者均有上限。"
 SIA_trade_dividend_tt: "泰国每月从其贸易协定网络中获得收益。"
 SIA_trade_diplomacy_network: "贸易外交"
 SIA_trade_diplomacy_network_tt: "外国影响力增长随着已签署贸易协定数量的增加而扩大，直至达到上限。"
 SIA_crisis_modifier: "1997危机的遗产"
 SIA_crisis_modifier_desc: "冬阴功危机在一夜之间击碎了经济奇迹——泰铢自由落体式贬值，银行被坏账埋没，国际货币基金组织已到了门口。复苏的每一步都在弥合部分伤痕。王国从过去汲取教训，以比从前更坚韧的姿态浴火重生。"
 SIA_economy_modifier: "泰国经济"
 SIA_economy_modifier_desc: "从出口基地、东部经济走廊，到国家龙头企业与数字化转型——王国各项经济计划的运行账目，贯穿始终。每一项改革、每一轮繁荣，都在这里留下印记。"
 SIA_military_modifier: "泰国皇家武装部队"
 SIA_military_modifier_desc: "王国陆、海、空三军将士的现状：装备采购、作战条令、训练体系及其背后的国防工业。各项现代化计划在此累积汇聚。"
 SIA_politics_modifier: "泰国治理体制"
 SIA_politics_modifier_desc: "泰国治理体制的制度骨架：法院、议会、官僚机构，以及维系王国政治凝聚力的各项制度安排。改革与反弹，皆在此留下印记。"
 SIA_armed_forces_state: "老近卫军"
 SIA_armed_forces_state_desc: "每几百名士兵就配一名将军，而真实编制数对议会保密。晋升靠的是年度调任名单、军校期数和部队派系，然后才轮到军功。军官团拥有一个电视频道、高尔夫球场、土地和福利计划——而这些福利由士兵充当无薪劳力来维持。战备与训练为这一切买单，而军饷账单只增不减。"
 SIA_clean_the_banks: "清理银行"
 SIA_clean_the_banks_desc: "五十六家停业的金融公司通过金融部门重组管理局进行清算，泰国资产管理公司则将不良贷款从账面上剥离。银行资产负债表恢复干净后重新放贷，起重机也再次出现在天际线上。"
 SIA_dual_track_recovery: "重振内需"
 SIA_dual_track_recovery_desc: "债务清偿后，将复苏重心转向国内。廉价信贷、农村消费计划及对小企业的扶持，让资金流向消费最快的群体手中。经济增长迅速回暖且势头强劲，但账单与人情债也随之迅速累积。"
 SIA_sufficiency_path: "重建经济韧性"
 SIA_sufficiency_path_desc: "选择稳健而非速度。多元化的农业、适度的借贷和自给自足的地方经济，重建一个更为宁静的根基，足以抵御下一轮冲击。繁荣从未呼啸而至，但整治也延伸至治理层面。"
 SIA_frontier_integration: "整合边疆"
 SIA_frontier_integration_desc: "军事战役已经获胜，泰国士兵已控制掸邦高原、克伦丘陵和佤邦高地。赢得土地与治理土地是不同的任务。我们为收复边疆建立行政机构，铺设第一批公路与驻军据点，并开始将征服的人口转化为公民的缓慢工作。收复领土如今可以安抚、开发，并最终正式纳入王国版图。"
 SIA_the_new_order: "南方新秩序"
 SIA_the_new_order_desc: "从马尼拉到马六甲海峡，我们的领土主张延至四方——凡我军所至之处，旧旗已落。宣示霸权不等于握有霸权。我们建立帝国的行政机器——总督、驻军和重建办公室——以使所夺省份得以治理，而非仅仅被占领。收复领土如今可以安抚、开发，并永久融入大泰国。"
 SIA_industrial_estates: "工业园区"
 SIA_industrial_estates_desc: "阿玛塔、赫马拉和罗贾纳三家私营工业园区开发商，在东部沿海地区兴建工业园，并直接向日本和西方工厂招商。泰国成为承接出口繁荣的工厂车间——任何制造商抵达，都有现成的土地和电力等待使用。"
 SIA_hard_disk_of_the_world: "世界硬盘"
 SIA_hard_disk_of_the_world_desc: "希捷、西部数据以及德尔塔和哈纳等本土供应商，将泰国打造为全球最大的硬盘组装基地和顶尖电子出口国。它是旅游明信片背后沉默的巨人，悄然向全球输送着四分之一的硬盘。"
 SIA_thai_union_seafood: "罐头之王"
 SIA_thai_union_seafood_desc: "泰国联合冷冻食品公司收购了“海中鸡”品牌，成为全球最大的金枪鱼罐头生产商，而沙没沙空府的加工厂将泰国海域的渔获和廉价劳动力转化为一个全球海产品帝国。冷冻虾和鱼罐头源源不断地运往世界各地的超市货架，沙没沙空的渔港也获得了一个与其新的重要地位相匹配的海军基地。"
 SIA_retail_kings: "零售之王"
 SIA_retail_kings_desc: "郑氏家族的中央集团、“Big C”超市及各大型购物中心，以商场和现代零售业为中心重建了国内经济。中央世界购物中心于2006年开业，日益壮大的中产消费者开始花钱消费，而不仅仅是出口创汇。"
 SIA_beverage_empire: "曼谷酿酒厂"
 SIA_beverage_empire_desc: "乍仑·西里瓦达那帕坤旗下的泰国酿酒公司，即昌啤酒和盛颂的制造商，已发展成为区域性的饮料与地产巨头。由于佛教界反对酒精的抗议活动阻断了其在曼谷上市之路，该公司转而选择在新加坡筹集资本，并将所得资金回流国内。企业税收的意外之财确实可观，但由此引发的禁酒反弹也同样真实存在。"
 SIA_fta_decade: "自贸十年"
 SIA_fta_decade_desc: "一波双边贸易协定将出口引擎接入区域市场。2005年与澳大利亚的协定、2007年与日本的伙伴关系，以及与中国在农产品上的早期收获协议——皆清除了关税壁垒。这确实是跨政府协同工作的成果，由在其他方面几无共识的对手们共同签署。"
 SIA_sugar_and_ethanol: "糖业大亨"
 SIA_sugar_and_ethanol_desc: "两仪糖业集团和泰国融瑞集团将甘蔗种植带扩展为亚洲的糖业中心，将蔗糖和木薯转化为出口产品，并用于乙醇汽油计划中的燃料乙醇。农业终于不再局限于稻米，而生物燃料直接汇入国家燃料供应体系。"
 SIA_gems_and_gold: "宝石与黄金"
 SIA_gems_and_gold_desc: "尖竹汶府的切割工匠与曼谷的珠宝贸易，使泰国成为全球彩色宝石切割与出口之都。这是一个独特的、高利润、小规模的产业，依靠技艺而非规模赚取硬通货——每一颗离开国境的宝石，都在出口账本上增添一笔。"
 SIA_map_ta_phut: "玛塔普"
 SIA_map_ta_phut_desc: "泰国国家石油有限公司和暹罗水泥集团在罗勇府不断扩张其下游石化的产业版图，玛塔普工业区的烟囱群成为东部经济走廊跳动不息的重工业心脏。产业欣欣向荣，即便工厂周边的社区正为污染的空气和水源付出代价，而为该工业集群提供服务的港口也在不断扩容以跟上发展步伐。"
 SIA_ignite_thailand: "泰国IGNITE"
 SIA_ignite_thailand_desc: "政府通过了二十年国家战略和“IGNITE”枢纽愿景，终于将中等收入陷阱明确定为敌人。泰国已经富裕到足以停滞不前。工资水平已经超越了廉价工厂阶段，却始终未能触及创新前沿，而越南正迅速追赶。"
 SIA_digital_kingdom: "数字王国"
 SIA_digital_kingdom_desc: "泰国将自己定位为东盟的数字枢纽，超大规模云服务商开始注意到这一点。光纤网络、云政策以及年轻的在线人口，使我国成为该地区数据流量的有力候选者。"
 SIA_data_center_hub: "云端突击"
 SIA_data_center_hub_desc: "亚马逊、谷歌、微软和TikTok向春武里和罗勇的数据中心投入数十亿美元。服务器到位速度超过供电和供水速度，电网在负荷下开始不堪重负。"
 SIA_virtual_banks: "PromptPay与虚拟银行"
 SIA_virtual_banks_desc: "PromptPay系统使泰国几乎进入无现金社会，拥有九千万注册用户，每日处理数千万笔转账交易。中央银行向纯数字银行颁发牌照，曾经消失在现金中的资金，如今留下了一条税务局可追踪的痕迹。"
 SIA_bcg_economy: "生物-再生-绿色"
 SIA_bcg_economy_desc: "生物再生绿色模式将泰国的生物多样性和农业基础转化为高价值生物产业。生物燃料、生物化学品和功能性食品开始取代那些使农村地区陷入贫困的低利润经济作物。"
 SIA_future_food: "世界厨房2.0"
 SIA_future_food_desc: "正大食品和食品巨头们正沿着价值链向上攀升，进入功能性食品和替代蛋白领域。泰国不再出售初级热量，转而开始销售投入其中的科学。"
 SIA_durian_road: "榴莲之路"
 SIA_durian_road_desc: "榴莲及热带水果对华出口额每年突破六十亿美元。冷链货车载着收成穿过老挝一路北上，而越南和马来西亚则在广州争夺同一片货架。"
 SIA_capital_of_capital: "资本之都"
 SIA_capital_of_capital_desc: "泰国证券交易所不断深化，“哇育帕”基金持续壮大，海湾能源等企业集团正从能源领域转向数字与金融领域。曼谷开始像一个区域性金融中心那样运作，而不再仅是资本过境的地方。"
 SIA_make_thailand_investor: "对外投资"
 SIA_make_thailand_investor_desc: "泰国已从吸收外资转变为向海外输出本国资本。中央集团在欧洲收购，正大集团在全球各地布局农场，泰国酿酒公司拥有新加坡的饮品巨头。这个昔日的受援国，如今已成为投资国。"
 SIA_escape_the_trap: "高收入国度"
 SIA_escape_the_trap_desc: "国家战略成效显著，泰国跨越门槛，步入高收入国家行列。曾束缚其发展长达一代人的陷阱终于成为过去，昔日的工场如今已蜕变为富裕的王国。"
 SIA_fta_decade_tt: "为贸易外交网络提供支撑，并签署十年期各项自由贸易协定。"
 SIA_escape_trap_two_sectors_tt: "需要三个行业巅峰中的两个：数据中心、未来食品，或对外投资。"
 SIA_data_center_grid_strain_tt: "超大规模建设给电网带来了压力。投资电力部门，确保灯火长明。"
 SIA_sufficiency_and_the_crown: "王冠与富足"
 SIA_sufficiency_and_the_crown_desc: "普密蓬国王的“自足经济”哲学，诞生于冬阴功危机的废墟之中，如今成为一项国家指导原则。在盲目增长之前，先强调适度、免疫力和理性。王室与计划部统一发声，而一个量入为出的村庄，在下一轮冲击来临时，对国家的需求也会更少。"
 SIA_sufficiency_gov_gate_tt: "§Y[Communist-State_L]§!或§Y[socialism_L]§!并非执政党。"
 SIA_new_theory_agriculture: "新理论"
 SIA_new_theory_agriculture_desc: "国王的新理论将农户的土地划分为稻田、果园、池塘和宅基地，形成一个自给自足的完整产业，先养家后供市场。依善的稻米带逐区推行这一模式，以出口降低换取农民在歉收之年不致挨饿的保障。"
 SIA_doi_tung_highlands: "黎敦模式"
 SIA_doi_tung_highlands_desc: "在清莱府的山丘之上，王太后计划将罂粟从地里拔除，代之以咖啡、澳洲坚果和手工艺品。金三角昔日的经济作物，正让位于一种吸引游客而非缉毒人员的山地经济，逐谷逐村地推进。"
 SIA_chaipattana_water: "王家增氧机"
 SIA_chaipattana_water_desc: "国王亲自设计的增氧机——一种任何乡村池塘都负担得起的廉价桨轮——沿着湄南河流域推广开来，用于净化被藻类和废物堵塞的水体。这是作为王室服务的一种发明，而依善和南方的稻田也因此排水更顺畅了一些。"
 SIA_crown_property_portfolio: "王室资产管理局"
 SIA_crown_property_portfolio_desc: "王室资产管理局的持有资产——从暹罗商业银行大厦下的土地到暹罗水泥集团的股份——使王室成为王国最大的地主和股东之一。它像企业集团一样管理，也像企业集团一样纳税，其盈利悄无声息地超过了它所从属的半数部委。"
 SIA_deepen_sufficiency: "自力更生之国"
 SIA_deepen_sufficiency_desc: "自给自足不再只是农村安全网，而是成为一整套战略。本地供应链、适度消费以及对外国资本的警惕，已固化为信条。这种自给自足换来了抗冲击能力，但银行家和企业集团看着增长目标下滑，并不满意。"
 SIA_pragmatic_balance: "中间路线"
 SIA_pragmatic_balance_desc: "自给自足未必意味着孤立。中小企业持续对外交易，而自给原则仅抑制过度行为，这是一种温和的综合，而非退缩。上限低于完全自给自足，但需要它的风险也同样降低。"
 SIA_resilient_kingdom: "坚韧顽强之国"
 SIA_resilient_kingdom_desc: "王冠与乡野、宫殿与稻田，交织成一幅坚韧的图景。无论下一场危机带来什么——无论是货币传染、疫情还是供应冲击，量入为出的王国，才能在危机过后依然屹立。"
 SIA_sufficiency_resilience: "自足经济"
 SIA_sufficiency_resilience_desc: "在王室倡议下，适度理念、经济免疫力与地区韧性，已播撒于整个农村经济的土壤中。"
 SIA_sufficiency_resilience_2: "深化自足经济"
 SIA_sufficiency_resilience_2_desc: "自力更生从安全保障上升为战略选择，以牺牲进一步增长换取更强的抗冲击能力。"
 SIA_resilient_kingdom_idea: "坚韧顽强之国"
 SIA_resilient_kingdom_idea_desc: "皇室的庇护与自给自足的经济学融合，形成了应对下一次冲击的持久国家缓冲。"
 SIA_tourism_masterplan: "旅游总体规划"
 SIA_tourism_masterplan_desc: "旅游业已在支撑经济，但它建立在即兴发挥之上——度假村先于基础设施建成，酒店先于受过教育的劳动力开业。一份国家总体规划设定了区域目标，使政府各部门协同联动，并将酒店业视作与任何其他产业同等的经济部门。"
 SIA_phuket_andaman: "安达曼之珠"
 SIA_phuket_andaman_desc: "普吉岛已经吸引着世界各地的人们涌向它的海滩，而新建的机场航站楼和改善的道路让这座岛屿能够接纳更多的游客。安达曼被要求承担国家外汇收入中日益增长的份额，而更多的外来者也在重塑着他们抵达时所面对的海岸线。"
 SIA_pattaya_eastern_riviera: "东部里维埃拉"
 SIA_pattaya_eastern_riviera_desc: "芭堤雅的酒店和夜生活区主要依赖廉价非正规劳动力。将东部沿海的办公与服务经济正规化，而每一个被纳入正式用工体系的劳动者，都期望福利国家能够真正兑现承诺。"
 SIA_chiang_mai_lanna: "北方玫瑰"
 SIA_chiang_mai_lanna_desc: "寺庙、山地风光和悠闲的生活节奏已经吸引背包客和数字游民北上。发展清迈的旅游基础设施，游客便会随之而来，同时房租上涨，让游客原本想探访的街区变得难以负担。"
 SIA_rebuild_the_andaman: "浪潮之后"
 SIA_rebuild_the_andaman_desc: "节礼日海啸席卷安达曼海岸，而重建中那些偷工减料之处至今仍清晰可见。一笔充足的资金投入，完成了紧急救援未能完成的重建工作，并为这场灾难永远地划上了句号。"
 SIA_medical_wellness_hub: "亚洲手术刀"
 SIA_medical_wellness_hub_desc: "世界一流的私立医院已经在接待从整个地区乘飞机前来的患者。进一步扩大健康与外科旅游产业，让泰国的诊所直接以远低于新加坡的价格与之竞争，而本国患者则排在付费外国人的后面等待。"
 SIA_volume_tourism: "数字游戏"
 SIA_volume_tourism_desc: "更多航班、更便宜的套餐、更多的游客涌入。追求纯粹的游客数量，外币储备不断累积，但为应对这一小部分客流而建的海滩和古城却在重压下不堪负荷，而当地居民感受到的压力远比财务报表所反映的要早得多。"
 SIA_high_value_tourism: "质胜于量"
 SIA_high_value_tourism_desc: "游客数量减少，但消费水平大幅提升。吸引高端度假胜地和精品体验市场，而非大众跟团游群体，以牺牲抵达人数为代价，换取一个能缴纳可观税收并在下一次经济衰退中屹立不倒的旅游业。"
 SIA_tourism_capital: "全球最爱"
 SIA_tourism_capital_desc: "从曼谷的街头小吃到普吉岛的海滩，再到清迈的寺庙，泰国成为旅游业带动发展的典范案例。旅游部的工作从营销活动升级为制定长期产业政策，并配套相应的决策支持。"
 SIA_tourism_boom: "旅游业繁荣"
 SIA_tourism_boom_desc: "一波又一波的游客涌入酒店和机场。随着季节更替，这股热潮逐渐消退。"
 SIA_host_major_international_event: "举办国际活动"
 SIA_host_major_international_event_desc: "申办一场峰会、一届世博会或一项重大体育赛事，让泰国在一周内登上全球所有电视屏幕。账单是实实在在的，但免费宣传也是实实在在的。"
 SIA_new_resort_zone: "开放新度假区"
 SIA_new_resort_zone_desc: "划出区域并允许开发新的海岸线或乡村地带用于度假区建设，从而将过剩的投资从已饱和的海岸地区分流出去。"
 SIA_global_amazing_thailand_campaign: "“惊艳泰国”全球宣传活动"
 SIA_global_amazing_thailand_campaign_desc: "以新一轮海外广告、旅游展亮相和付费社交媒体网红宣传，重新推出旅游局旗舰口号——让他们看起来正享受着人生中最美好的时光。"
 SIA_baht_and_bourse: "泰铢与证券交易所"
 SIA_baht_and_bourse_desc: "曼谷的银行和泰国证券交易所早已超越了早期商铺式放贷人的时代，但这里的资本市场仍比泰国与之竞争的邻国更浅、更非正式。一场协调推进的举措扩大了可筹资和可放贷的范围，代价是将同一批不断增长的资金池交给了那些能最快搞定监管机构的人。"
 SIA_tamc_workout: "资产管理公司"
 SIA_tamc_workout_desc: "泰国资产管理公司成立于2001年，旨在消化1997年金融危机遗留的不良贷款，二十年来，它一直在缓慢出售可变现资产，并对无法变现的部分进行减记。彻底清算该基金的账目，可释放仍被锁在其中的资本，前提是其账面上尚未确认的损失最终得到承认，而非再结转至下一年度。"
 SIA_consumer_credit_boom: "放开基层信贷"
 SIA_consumer_credit_boom_desc: "信用卡、个人贷款和分期付款计划从曼谷的商场扩展到各府，让普通家庭能够用明天的薪水在今天消费。消费攀升，政府收入随之增长，但一个拥有如此多新消费信贷的人口，很快就会指望国家在还款到期时出手兜底。"
 SIA_responsible_lending: "宏观审慎监管"
 SIA_responsible_lending_desc: "泰国银行收紧抵押贷款和消费信贷市场的贷款价值比上限与放贷标准，选择一种更慢但更稳健的扩张，而非迅猛增长。银行保持偿付能力，家庭量入为出，但那种推动消费繁荣的宽松消费信贷，则永远失去了流动的机会。"
 SIA_deepen_the_set: "深化证券交易"
 SIA_deepen_the_set_desc: "越来越多的公司在泰国证券交易所上市，外国投资组合经理开辟进入泰国股市的新渠道，市场既在深化，也在变得更加流动。一个更大、更互联的交易所，也意味着在某一天，当一家上市集团的审计账目被证明还不如印刷它们的纸张值钱时，冲击也将更大。"
 SIA_vayupak_stabilization: "“哇育帕”基金"
 SIA_vayupak_stabilization_desc: "国家支持的“哇育帕”基金，在指数下跌过深、过快时准备入市买入，为散户投资者在下一次恐慌中提供兜底。以国库资金支撑股价，与推动股价背后的经济增长并非同一回事，而该基金干预行动的账单，与所有其他支出一样，都来自政府预算。"
 SIA_bank_consolidation: "大城银行问题"
 SIA_bank_consolidation_desc: "日本三菱日联金融集团持有大城银行的控股权——这只是泰国银行业正围绕少数几家大型（且常有外资背景）幸存者进行整合的若干迹象之一。更大的资产负债表能吸收更大的冲击，但那些曾服务于中小型借贷者的中小型银行，则不断消失在别人的支行网络之中。"
 SIA_financial_center: "高级金融中心"
 SIA_financial_center_desc: "曼谷将自身定位为区域金融中心，与新加坡和香港形成竞争，而非仅仅为它们提供市场的配角。深厚的资本市场、稳定的汇率以及整合的银行业，汇聚成一个能够为整个区域（而不仅仅是泰国）定价风险和筹集资本的中心。"
 SIA_financial_center_idea: "高级金融中心"
 SIA_financial_center_idea_desc: "深厚的资本市场、稳定的汇率以及整合的银行业，使泰国成为一个金融中心，不仅为本国，也为整个地区提供风险定价和资本筹集服务。"
 SIA_the_ground_beneath: "大地之下"
 SIA_the_ground_beneath_desc: "一项全国地质调查项目启动，旨在系统性地评估王国土壤和大陆架之下的实际资源——从东北部的钾盐矿层到泰国湾的含气盆地。弄清地下有什么是容易的部分；接下来的难题是，决定以多大的力度去开采，以及当开采出错时由谁来买单。"
 SIA_extractive_drive: "自由采掘"
 SIA_extractive_drive_desc: "审批手续迅速推进，资源部门被要求以最大产量、最少延误进行生产。出口收入攀升，化石燃料游说集团得到了它所要求的一切——但每一座矿场和每一口油井所需的人力都比上一座更多，而那些土地和水源紧邻钻探点的农民，最先察觉到了变化。"
 SIA_stewarded_extraction: "为国采矿"
 SIA_stewarded_extraction_desc: "开采按照国家的规则而非市场的逻辑推进：更慢的审批节奏、真正意义上的环境审查，以及每一份特许权更小的开发规模。这片土地产出的资源，比在更自由放任的方式下要少，但那些生活在矿坑和井口旁的农民与土地所有者，并未被当作附带损害来对待。"
 SIA_udon_potash: "依善钾盐"
 SIA_udon_potash_desc: "依善地区储量巨大的钾盐矿——全球最大之一，且长期未被开采——终于投入生产。新的矿井和加工厂有望催生本土化肥工业，但特许开采区的边界线，恰好从那些小农户和稻米合作社耕种了数代人的土地上径直穿过。"
 SIA_chatree_gold_tin: "查特里矿藏"
 SIA_chatree_gold_tin_desc: "查特里矿区及其周边矿场从中部平原开采出黄金、锡和石膏——这是与曼谷早已闻名的宝石贸易并存的、虽不显眼却实实在在的采矿产业。尾矿库下游的村庄密切关注着渗入地下水层的一切，其声音也日益响亮。"
 SIA_gulf_gas_oca: "争议地区"
 SIA_gulf_gas_oca_desc: "泰国和柬埔寨让泰国湾一片富含天然气的水域闲置了数十年，而非解决其归属问题。在重叠主张区域单方面推进，意味着在哪怕一立方米天然气抵达海岸之前，就要进行资本密集型的边缘钻探——而邻国对此并未达成任何共识。"
 SIA_resource_sovereignty: "资源主权"
 SIA_resource_sovereignty_desc: "钾盐、贱金属与天然气汇聚成一个以曼谷为中枢、而非以季度国际买家意志为转移的资源产业。曾几何时，特许经营权零敲碎打地出售给他人，而今，王国终于不必再为自己土地之下产出的资源乞求他人许可。"
 SIA_resource_sovereignty_2of3_tt: "已完成3个资源项目中的至少2个"
 SIA_the_digital_consumer: "数字消费者"
 SIA_the_digital_consumer_desc: "泰国人正越来越多地选择在线办理银行业务、购物和预订，而不是在柜台前排队。安可达——这家从普吉岛一间小办公室成长起来的旅行预订平台，证明了本土数字企业可以参与任何竞争。为这一转变铺设轨道、建立信任、夯实税基，如今已成为一项国家工程。"
 SIA_promptpay_rails: "PromptPay"
 SIA_promptpay_rails_desc: "PromptPay系统让资金能在手机号码和身份证号码之间以秒级速度流动，中间无需银行网点或汇款手续费。将如此大量的交易正规化，会将现金经济的一部分拉到阳光之下——而那些曾从这种不透明中获利的中间人，立刻便察觉到了变化。"
 SIA_super_app_economy: "超级应用"
 SIA_super_app_economy_desc: "Grab、LINE MAN及其竞争对手将网约车、外卖配送和快递服务整合到同一个应用程序中——而每一个泰国人早已将这类应用保持打开状态。效率的提升是切实存在的，但同样真实的是，那些让这些应用得以运转的司机和骑手，却没有合同、没有福利，也没有谈判席上的一席之地。"
 SIA_ecommerce_marketplaces: "互联网小企业"
 SIA_ecommerce_marketplaces_desc: "Lazada和Shopee为小型制造商和集市摊贩提供了一个可触达本府之外、乃至国门之外顾客的线上店面。仓储和配送车队必须同步建设以匹配需求，而先行投入这些建设，恰恰会蚕食这些电商平台本应带来的收益。"
 SIA_national_digital_champions: "双头市场整合"
 SIA_national_digital_champions_desc: "国家不再充当开放竞争的裁判，而是扶持少数几家全国性平台，任由它们整合市场。一个集中的数字产业便于征税、易于监管，但一个没有真正竞争对手的市场，也几乎没有理由保持价格公道。"
 SIA_open_digital_market: "打破双头垄断"
 SIA_open_digital_market_desc: "反垄断规则和开放数据可携性要求，使小型平台仍能参与竞争，而非任由两大应用瓜分市场。消费者得以保留真正竞争带来的好处，代价则是失去了一个全国龙头企业本可带来的整齐税收收入。"
 SIA_the_outward_turn: "向外转向"
 SIA_the_outward_turn_desc: "几十年来，泰国资本一直单向流动，投入到为外国人建造的工厂和酒店中。如今，新一代的跨国企业集团将目光投向海外寻求自身发展，在曾经是泰国客户而非其目标市场的地区收购股份并兴建工厂。"
 SIA_leveraged_expansion: "购买世界"
 SIA_leveraged_expansion_desc: "利用稳健的资产负债表进行借贷，迅速在海外进行收购。债务融资的收购可以快速扩大投资组合，但每一笔信贷购买的资产都可能迅速贬值。"
 SIA_organic_expansion: "种植我们拥有的东西"
 SIA_organic_expansion_desc: "与其借贷收购，不如扩张泰国企业集团已有的业务：更多分支机构、更大产能、更广阔的市场，资金全部来自自身盈利。这种方式虽然缓慢，也永远不会登上交易杂志的头版头条，但以这种方式收购的资产无需急于出售。"
 SIA_cp_into_china: "认证号0001"
 SIA_cp_into_china_desc: "1990 年，正大集团成为首家在上海证券交易所重新开市后购股的外国投资者，股票代码为0001。三十年后，正大集团在中国的业务从平安保险到遍布全国的饲料厂，这项投资从未停止过盈利，即使它掏空了正大集团曾经在国内发展的部分业务。"
 SIA_thaibev_conquers_asean: "啤酒大亨的帝国"
 SIA_thaibev_conquers_asean_desc: "2017年，泰酒集团旗下的越南饮料公司以近50亿美元的价格收购了西贡啤酒，随后又将星狮集团在新加坡的饮料和房地产帝国并入旗下。如今，一家泰国企业集团就掌控了该地区相当大一部分的饮料市场。"
 SIA_scg_long_son: "龙山崛起"
 SIA_scg_long_son_desc: "暹罗水泥集团位于越南龙山半岛的石化联合装置，将石脑油裂解成塑料原料，而其泰国工厂此前一直需要进口这些原料。该装置在国外建成后，一旦混凝土凝固，便可回流到泰国，形成更便宜、更稳定的供应链。"
 SIA_central_minor_abroad: "海外购物中心和客房"
 SIA_central_minor_abroad_desc: "中央集团通过奥地利西格纳集团入股塞尔福里奇百货、嘉迪威百货和茹曦酒店集团，而美诺国际酒店集团旗下的酒店品牌则从曼谷扩展到马尔代夫和里斯本。如今，泰国零售和酒店业的资金拥有了其顾客从未踏足过的店铺和酒店大堂。"
 SIA_ptt_banpu_resources: "钻探世界"
 SIA_ptt_banpu_resources_desc: "泰国国家石油勘探生产公司的上游油田从阿曼延伸至莫桑比克，直至与马来西亚共享的水域；而班普煤矿的煤矿特许权则横跨澳大利亚和印度尼西亚。泰国通过这些渠道获取了国内所缺乏的资源，这些资源与国内矿山所经历的商品周期息息相关。"
 SIA_outbound_statecraft: "投资即治国之道"
 SIA_outbound_statecraft_desc: "这些交易不再是各自独立的赌注，而是成为一种统一的国家战略，泰国资本既是盈利的工具，也是外交政策的工具。如今，一个专门的办公室负责管理收购流程，东盟一半成员国的董事会都或多或少地要对曼谷负责。"
 SIA_outbound_statecraft_3of5_tt: "已完成至少5项海外扩张协议中的3项"
 SIA_thai_multinationals: "泰国跨国公司"
 SIA_thai_multinationals_desc: "泰国企业发展壮大后，逐渐超越国内市场，开始像它们曾经服务的跨国公司那样运作。它们的海外影响力确实不容小觑，但每一分钱、每一小时的高管投入海外，都意味着国内发展投入的减少。"
 SIA_overseas_deal_boom: "海外贸易繁荣"
 SIA_overseas_deal_boom_desc: "另一项收购已经完成，来自泰国境外的利润正在回流到完成收购的管道。"
 SIA_overseas_acquisitions_category: "海外收购"
 SIA_overseas_acquisitions_category_desc: "泰国企业集团不断在海外寻觅收购目标。他们会寻找下一个目标，完成交易，或者在资金允许的情况下，将整个投资组合推向全球路演。"
 SIA_scout_overseas_targets: "侦察海外目标"
 SIA_scout_overseas_targets_desc: "在签署任何协议之前，务必派交易团队实地考察下一个收购目标。这是一篇简明扼要的文章，探讨了泰国资本的下一个投资方向。"
 SIA_close_the_deal: "完成交易"
 SIA_close_the_deal_desc: "签署下一笔股权、子公司或现有特许权的协议。资金从国库流出是实实在在的，而这项资产的价值尚未得到证明。"
 SIA_global_ma_roadshow: "全球并购路演"
 SIA_global_ma_roadshow_desc: "派出这些企业集团的交易撮合者前往新加坡、香港和伦敦，向银行家和目标公司董事会推介泰国资本。单凭宣传就能为下一轮交易造势。"
 thailand.1.t: "2001年大选"
 thailand.1.d: "2001年1月6日，泰国举行了根据《人民宪法》举行的首次大选。三大势力角逐桂冠。泰爱泰党提出的乡村基金、债务延期偿还和全民医保等政纲，在农村地区引起了广泛关注。王室及其在军事基地的盟友则倾向于限制执政者的权力。现任民主党承诺将以稳健务实的作风执政。我们现在的立场将决定国家最终选择谁。"
 thailand.1.a: "支持泰爱泰党和它代表的乡村势力。"
 thailand.1.b: "动员宫廷关系网和将军们。"
 thailand.1.c: "维持民主党执政。"
 thailand.2.t: "由首席执行官组成的政府"
 thailand.2.d: "新政府上任伊始，便承诺将泰国治理得像一家成功的公司。商界人士充斥内阁，各部委被设定绩效目标，政策出台的速度之快，令官僚机构前所未见。"
 thailand.2.a: "泰国开门迎宾"
 thailand.3.t: "毒品战争"
 thailand.3.d: "2003年2月，政府宣布开展为期三个月的打击冰毒交易运动。各省制定了黑名单并设定了配额。运动结束时，人权组织记录了2800起杀戮事件，其中许多案件从未得到彻底调查。这场运动在媒体上广受好评，但在国外却遭到谴责。"
 thailand.3.a: "全力推进该运动，不要有任何顾虑。"
 thailand.3.b: "悄悄降温"
 thailand.4.t: "九月政变"
 thailand.4.d: "2006年9月19日，总理正在纽约参加联合国大会。与此同时，坦克驶入曼谷街头，宪法被废除，民主改革委员会宣布已和平接管政府。民众向士兵献花，而占人口绝大多数的农村居民则默默地旁观着这一切。"
 thailand.4.a: "让军队承担起责任。"
 thailand.4.b: "安插一个由平民组成的幌子政府。"
 thailand.5.t: "司法解散"
 thailand.5.d: "宪法法院正在审理一起针对最大反对党的选举舞弊案。如果该党被解散，其执行委员会成员将被禁止参与政治活动五年，这将使该运动在不失去任何一员的情况下就遭受重创。"
 thailand.5.a: "解散该党"
 thailand.5.b: "让威胁始终笼罩着他们。"
 thailand.6.t: "全国维持和平秩序委员会掌权"
 thailand.6.d: "2014年5月22日，在经历了数月的抗议和两天的戒严之后，陆军总司令召集对立派别到陆军俱乐部，并在会议室将他们逮捕。陆军总司令宣布，全国维持和平秩序委员会将接管政府。在民主制度稳定之前，不会制定选举的具体时间表。"
 thailand.6.a: "秩序恢复"
 thailand.7.t: "红衫军占领广场"
 thailand.7.d: "反对独裁民主联合阵线涌入曼谷商业中心，要求政府辞职并重新举行选举。拉差帕颂路障林立，城市各处燃起轮胎和建筑物的火焰。全世界的目光都聚焦在军队的下一步行动上。"
 thailand.7.a: "清场"
 thailand.7.b: "协商并等待他们回应。"
 thailand.8.t: "机场查封"
 thailand.8.d: "2008年11月，身穿黄衫的抗议者占领了素万那普机场和廊曼机场，导致30万旅客滞留，泰国航空运输瘫痪。这场围困最终以法院判决推翻他们反对的政府而告终。"
 thailand.8.a: "计算成本。"
 thailand.9.t: "三大诉求"
 thailand.9.d: "由学生领导的集会规模空前，创下1992年以来的新高。集会提出三项诉求：解散议会、停止恐吓批评人士、制定新宪法。在曼谷的一个舞台上，几个世纪以来束缚泰国公众言论的禁忌在一夜之间被打破。"
 thailand.9.a: "支持全部诉求"
 thailand.9.b: "只推动议会能够通过的法案。"
 thailand.10.t: "第112条来到议会阶段"
 thailand.10.d: "一项旨在修订冒犯君主罪的法案已提交议会。该法案限制了可提起诉讼的人员范围，设定了处罚上限，并终止了该法对政治言论的适用。泰国立法机构此前从未就此问题进行过正式投票表决。旧秩序的每一个机构如今都已开始动摇。"
 thailand.10.a: "展开表决"
 thailand.11.t: "化解危机"
 thailand.11.d: "宪法法院裁定，此次修宪运动意在推翻以国王为国家元首的民主政权。该党被解散，其领导层被禁止活动。该运动必须以新的名称，由原班人马重新开始，如同以往一样。"
 thailand.11.a: "我们将在周五之前注册成立一个新政党。"
 thailand.12.t: "建制派反击"
 thailand.12.d: "军队未经政府命令便在首都展开行动。旧秩序认为这场改革实验已经走得太远。接下来的六个小时将决定改革时代是继续下去，还是会加入泰国民主进程中断的漫长行列。"
 thailand.12.a: "号召民众走上街头。"
 thailand.12.b: "退缩以拯救运动。"
 thailand.13.t: "共和问题"
 thailand.13.d: "政府计划就国家宪政形式举行全民公投，这是泰国历届政府从未向人民提出过的问题。无论结果如何，泰国王国都将发生翻天覆地的变化。"
 thailand.13.a: "把这个问题交给人民来决定。"
 thailand.13.b: "撤回全民公投"
 thailand.14.t: "新王朝"
 thailand.14.d: "2016年10月13日，泰国王室宣布普密蓬·阿杜德国王（拉玛九世）驾崩，享年70岁，是泰国历史上在位时间最长的国王。王储继位，成为玛哈·哇集拉隆功国王（拉玛十世）。政府如何纪念这一权力交接，以及过渡进程的快慢，现在由曼谷方面决定。"
 thailand.14.a: "公开宣示新政权。"
 thailand.14.b: "让仪式按部就班地进行下去。"
 thailand.14.c: "平衡仪式与延续性。"
 thailand.15.t: "王朝继续"
 thailand.15.d: "该运动的创始人已无法亲自领导，但其名称仍然对选民具有强大的影响力。摆在该党面前的问题是，谁将带领它参加下届选举。"
 thailand.15.a: "英拉·钦那瓦选票领先"
 thailand.15.b: "斯雷塔·塔维辛领衔竞选，她是商业界的房地产大亨。"
 thailand.15.c: "帕通坦·钦那瓦领衔竞选，这个名字将延续到新一代。"
 thailand.15.e: "让机制选择"
 thailand.16.t: "永远选他信"
 thailand.16.d: "年度党代会投票决定废除党内任期限制，并赋予领导层在候选人遴选、党内名单制定和联盟政策方面的紧急权力。反对派席位上空无一人，没有一位重要人物。选举将继续举行，也将继续赢得胜利。"
 thailand.16.a: "一个领袖，一个政党，一个泰国。"
 thailand.17.t: "王位复辟"
 thailand.17.d: "议会、枢密院和军队联合向王室请愿，要求直接接管国家机构的管理权。上个世纪的宪政虚构就此终结。却克里王朝恢复了其在1932年之前所扮演的角色。"
 thailand.17.a: "国王万岁"
 thailand.18.t: "2017年体制"
 thailand.18.d: "新宪法在全民公投中获得通过，但竞选活动受到严格限制，反对派被视为刑事犯罪。一个完全由议员组成的参议院将协助选举未来的总理，一项为期二十年的国家战略将约束每一届未来的政府。选举将会恢复，但这次是在围栏之内。"
 thailand.18.a: "这就是引导式民主。"
 thailand.19.t: "王国举行大选"
 thailand.19.d: "2001年1月6日，全国76个省份的投票站同时开放。这是根据《人民宪法》举行的第一次选举，由独立委员会而非内政部进行计票，也是第一次获胜政党无需经过数月的组阁谈判即可直接执政。"
 thailand.19.a: "开始倒计时。"
 thailand.20.t: "法庭解散该党"
 thailand.20.d: "宪法法院裁定，执政党向小党派支付费用，让他们在被宣布无效的选举中推出候选人，并下令解散该党。该党111名执行委员被禁止参政五年。判决撤销了该党的名称、注册资格和领导层，但并未影响到任何选民。几周之内，同样的议员们就以新的党名重新注册，而东北部的政治机器甚至没有失去任何一个选区。"
 thailand.20.a: "重新注册，保持清洁，由新管理团队负责。"
 thailand.20.b: "被禁的高管们将继续在外部操控公司。"
 thailand.21.t: "法庭清空牌桌"
 thailand.21.d: "第二次解散，执政党也随之解散。裁决还解散了原有的民族保守派联盟，该联盟的省级派系头目如今掌控着议会的多数席位，正被双方拉拢。他们的领袖被禁止参选，但并未噤声，目前在武里南府的一处住宅内进行谈判。如果他的成员退出，反对派将无需选举即可组建政府。如果他们能够留任，联盟得以维系，但所有人都将清楚地知道为此付出了怎样的代价。"
 thailand.21.a: "让他们走吧，让民主党人试试执政。"
 thailand.21.b: "满足他们提出的任何条件。"
 SIA_bench_hands_power_to_democrats_tt: "议会在§Y民主党§!执政的情况下重新召开会议。"
 thailand.50.t: "走出冬阴功危机"
 thailand.50.d: "泰铢贬值三年后，经济再次增长。东海岸的工厂正在重新招聘员工，而当初在屈辱中启动的国际货币基金组织援助计划也提前完成了。"
 thailand.50.a: "最糟糕的时期已经过去了。"
 thailand.51.t: "国际货币基金组织离去"
 thailand.51.d: "2003年7月，泰国提前两年偿还了其对国际货币基金组织的最后一笔债务。总理发表电视讲话，宣布泰国恢复经济独立，以此纪念这一时刻。"
 thailand.51.a: "不再重演"
 thailand.52.t: "节礼日海啸"
 thailand.52.d: "2004年12月26日，苏门答腊岛附近海域发生海底地震，引发海啸袭击泰国安达曼海域。考拉和普吉岛遭受重创，泰国境内超过5000人丧生，其中许多是外国游客。全世界都在关注泰国的救援行动。"
 thailand.52.a: "救灾工作要全力以赴。"
 thailand.52.b: "最低限度的回应。"
 thailand.53.t: "大洪水"
 thailand.53.d: "季风洪水沿湄南河盆地而下，淹没了泰国三分之二的府，并漫过曼谷北部的工业区。被洪水淹没的泰国工厂导致全球硬盘生产停滞。首都曼谷筑起沙袋墙，静待洪水退去。"
 thailand.53.a: "调动一切"
 thailand.53.b: "保护曼谷，让其他省份的资源枯竭。"
 thailand.54.t: "大米质押计划"
 thailand.54.d: "政府提议以市场价的1.5倍收购全部稻米收成，将数十亿资金转移给农户，并押注世界稻米价格会随之下降。经济学家警告说，仓库将会爆满，损失将是史无前例的。选举我们的农民们正在等待结果。"
 thailand.54.a: "捐献每一粒粮食。"
 thailand.54.b: "悄悄搁置这个计划。"
 thailand.55.t: "亚洲底特律"
 thailand.55.d: "汽车产量突破百万辆大关。泰国现已成为东南亚最大的汽车生产国，也是全球领先的一吨级皮卡生产国。"
 thailand.55.a: "吸引丰田和本田并且敞开大门"
 thailand.56.t: "泰国旅游年"
 thailand.56.d: "曼谷是世界上游客最多的城市之一。从考山路到卡伦海滩，泰国接待着来自世界各地的游客，而游客的消费也支撑着数百万泰国人的钱包。"
 thailand.56.a: "萨瓦迪卡。"
 thailand.56.b: "投资于行业本身。"
 thailand.57.t: "潜艇问题"
 thailand.57.d: "海军采购中国制造的S26T潜艇的合同已成为全国热议的话题。这些潜艇究竟是横跨两大洋舰队的首批舰艇，还是耗资数十亿美元却无法交付的发动机？最终的采购决定权掌握在政府手中。"
 thailand.57.a: "买下这些船"
 thailand.57.b: "取消项目"
 thailand.100.t: "失去的领土"
 thailand.100.d: "官方媒体重新启用旧地图。各省分别于1893年、1904年和1907年割让给法国，苏丹国于1909年割让给英国。披汶时代的民族耻辱叙事重返教科书，自1945年以来任何政府都未曾援引的运动再次兴起。"
 thailand.100.a: "被拿走的东西可以归还。"
 thailand.101.t: "萨尔温河对岸的兄弟"
 thailand.101.d: "曼谷正式宣布关注掸邦傣雅族的命运。傣雅族与泰族在语言和血缘上都属于同一族群，与缅甸军政府世代交战。这份声明并未直接提出领土要求，但该地区的民众都清楚其含义。"
 thailand.101.a: "泰族是一个民族。"
 thailand.102.t: "湄公河是泰国的一条河流"
 thailand.102.d: "政府正式宣布1893年和1904年的法暹条约无效，称其系在胁迫下签署。此次主权声索直接涵盖占巴塞省，但执政党内部有人质疑，为何主权声索仅限于法国恰好划定的省份。"
 thailand.102.a: "宣称1904年领土"
 thailand.102.b: "宣称老挝为泰国领土"
 thailand.103.t: "柏威夏对峙"
 thailand.103.d: "围绕悬崖顶寺庙的炮火交锋是自2011年以来最严重的，这为曼谷提供了借口。政府宣布不再承认1962年国际法院的裁决，并声称对马德望和暹粒这两个在人们记忆中仍属于暹罗的省份拥有主权。"
 thailand.103.a: "重申宣称"
 thailand.103.b: "宣称，并且发出最后通牒"
 thailand.104.t: "谴责1909"
 thailand.104.d: "外交部正式谴责1909年的《英暹条约》，该条约将曼谷的马来属地割让给了大英帝国。吉兰丹和登嘉楼被直接点名。吉隆坡在一小时内召回了其大使。"
 thailand.104.a: "宣称吉兰丹与登嘉楼"
 thailand.104.b: "要求归还所有割让的苏丹国。"
 thailand.105.t: "素旺那蓬"
 thailand.105.d: "史册中的黄金国度，泰族世界在同一面旗帜下汇聚。政府宣布统一计划原则上已完成。剩下的工作是使收复的领土在行政和名称上都归泰族所有。"
 thailand.105.a: "从萨尔温江到大海，升起一面旗帜。"
 thailand.105.b: "暂停。先让军队巩固阵地。"
 thailand.106.t: "掸邦地区的整合"
 thailand.106.d: "泰国的行政管理、教育和基础设施已延伸至掸邦高原。一体化委员会报告称，新成立的省份已做好全面并入泰国的准备。"
 thailand.106.a: "欢迎回家"
 thailand.107.t: "整合老挝领土"
 thailand.107.d: "湄公河沿岸各省完成行政整合。湄公河不再是边界。"
 thailand.107.a: "欢迎回家"
 thailand.108.t: "整合高棉省份"
 thailand.108.d: "马德望和暹粒，旧地名录中的帕塔邦和暹玛叻，自1946年以来首次回归泰国行政管辖。"
 thailand.108.a: "欢迎回家"
 thailand.109.t: "整合南方诸省"
 thailand.109.d: "原苏丹国完成合并，英国和马来西亚长达一个世纪的统治宣告结束。接下来，更艰巨的任务是如何让合并后的政权正常运转。"
 thailand.109.a: "欢迎回家"
 thailand.110.t: "世界反应"
 thailand.110.d: "邻国首都纷纷召开紧急会议。东盟的创始成员国之一背弃了其基本原则 - 殖民时代边界不可侵犯。各国大使馆被召回，联合军事演习被暂停，昔日的朋友们开始用新的词汇来描述泰国。"
 thailand.110.a: "他们会习惯的"
 thailand.150.t: "南方之火"
 thailand.150.d: "2004年1月4日，武装分子袭击了那拉提瓦府的一处军火库，杀害士兵并劫走数百件武器。随后，泰南边境马来-穆斯林各府发生了一系列协调一致的纵火事件。沉寂了二十年的分离主义叛乱卷土重来。"
 thailand.150.a: "南方会考验我们。"
 thailand.151.t: "泰南意外事件"
 thailand.151.d: "又一周过去了，又一起路边炸弹袭击，又一起发生在也拉府、北大年府或那拉提瓦府的检查站枪击事件。冲突以曼谷已经习以为常的节奏持续下去，而南部地区却依然无法承受。"
 thailand.151.a: "忍受"
 thailand.152.t: "出重拳"
 thailand.152.d: "泰南边境三府的一次安全行动，以被拘押者死亡告终，军方为其手段辩护。承诺的调查并未带来任何起诉。而穆斯林受难者的图像正在边界之外、在整个伊斯兰世界激起与我国的对抗。"
 thailand.152.a: "秩序是有代价的。"
 thailand.153.t: "在吉隆坡的会谈"
 thailand.153.d: "泰国官员与北大年马来国民革命阵线代表在马来西亚调解员安排的桌旁对坐。议程并不复杂，涵盖安全区、战俘福利以及对对话本身的认可。多年来，双方一直否认战争的存在，如今，对话已是双方做出的让步。"
 thailand.153.a: "让他们继续说下去。"
 thailand.154.t: "和平协议"
 thailand.154.d: "北大年府自治框架协议签署。该协议引入了民选的地方政府、马来语与泰语并存的教育体系、针对冲突中暴行的司法机制，以及分阶段结束安全部队驻扎的方案。泰国境内持续时间最长的战争随着协议的签署而结束。"
 thailand.154.a: "南方的和平"
 thailand_news.1.t: "曼谷政变"
 thailand_news.1.d: "泰国皇家军队已在曼谷夺取政权，中止宪法并解散民选政府。自1932年以来，泰国屡遭军政府统治，市场和政府部门都在盘算着这次军政府究竟能执政多久。"
 thailand_news.1.a: "又一次？"
 thailand_news.2.t: "泰国宣称“失去的领土”"
 thailand_news.2.d: "曼谷正式宣称对一个世纪前割让给法国和英国的领土拥有主权，此举重启了二战后销声匿迹的领土收复主义运动。东南亚各国首都对此表示警惕。"
 thailand_news.2.a: "令人担忧"
 thailand_news.3.t: "暹罗共和国？"
 thailand_news.3.d: "泰国将就君主制的未来举行全民公投，这在泰国现代史上史无前例。整个地区屏息以待。"
 thailand_news.3.a: "前所未有"
 thailand_news.4.t: "泰国举国哀悼普密蓬国王"
 thailand_news.4.d: "世界在位时间最长的君主普密蓬·阿杜德国王在曼谷逝世，享年88岁。泰国全国开始为期一年的哀悼，悼念这位大多数泰国人一生中唯一认识的国王。他的儿子继承王位，成为玛哈·哇集拉隆功国王，即拉玛十世。"
 thailand_news.4.a: "一个时代结束了"
 thailand.58.t: "眼镜蛇沼泽"
 thailand.58.d: "自上世纪70年代以来，“眼镜蛇沼泽”就一直在吞噬资金。如今，新机场正拔地而起，成本也随之飙升。排水问题、滑行道开裂、承包商对同一份混凝土收取两次费用……董事会要么想要更多资金，要么想要更多时间。"
 thailand.58.a: "注入资金，按计划开业。"
 thailand.58.b: "让日程有所延误。"
 thailand.59.t: "亚洲门户"
 thailand.59.d: "素万那普机场敞开大门。这座玻璃和钢铁结构的航站楼是世界上最大的航站楼之一，其建造旨在将曼谷置于亚洲所有航线图的中心。第一块到达信息牌上的描述，简直像是旅游部的一份美好愿景。"
 thailand.59.a: "王国有了新的大门。"
 thailand.60.t: "东部破土动工"
 thailand.60.d: "东部经济走廊目前还停留在纸面上，现在需要有人为之买单。北京代表团带着包装成“一带一路”框架的融资方案前来考察。财政部也可以在国内筹集资金，虽然速度较慢，但​​没有任何附加条件。"
 thailand.60.a: "吸引中国资本。"
 thailand.60.b: "发行国内债券。"
 thailand.61.t: "铁路连接线透支"
 thailand.61.d: "在三个机场下方修建隧道注定耗资巨大，但没人向内阁汇报过具体费用。这条三机场线路要么需要追加资金，要么需要更精简的方案。"
 thailand.61.a: "支付费用。主干线得以完整重建。"
 thailand.61.b: "调整视角。"
 thailand.62.t: "“一带一路”的召唤"
 thailand.62.d: "一条从昆明经万象到曼谷的高速铁路。这条中国中南走廊缺失的中间段穿过泰国领土，北京非常希望为其提供资金。条件很优厚。但这些条件也只是条件而已。"
 thailand.62.a: "签署铁路备忘录。"
 thailand.62.b: "用泰国的方式，慢慢地重新谈判。"
 thailand.63.t: "让步问题"
 thailand.63.d: "反对派参议员们统计了自该国最大的电信运营商组建政府以来，电信特许经营权的各项表现。税收调整、许可证延期、竞争对手接受审计。“巧合”一词在官方回复中扮演着重要角色。"
 thailand.63.a: "抛售这些持股。承受国债损失，换取良好的声誉。"
 thailand.63.b: "大胆去做吧。人数决定选举结果，律师争取时间。"
 thailand.64.t: "家庭债务清算"
 thailand.64.d: "村里的资金用来建造商店、摩托车和碾米厂，全部都是贷款。农村家庭的平均债务几乎翻了一番，合作社的账目也开始出现问题。银行希望在贷款展期开始前得到指导。"
 thailand.64.a: "救助合作社。暂停偿付债务会让我们付出代价，但能拯救村庄。"
 thailand.64.b: "让信贷收紧吧。市场会进行调整，但村庄会消化这些调整带来的影响。"
 thailand.65.t: "抵消与爱立眼"
 thailand.65.d: "萨博的最终报价摆在了桌面上。报价包括完整的源代码访问权限、爱立眼机载雷达、大学合作项目以及为泰国工业提供零部件，所有这些都是有偿的。或者，也可以选择价格低得多的同款战斗机，但不含任何配件。"
 thailand.65.a: "接受全套方案。"
 thailand.65.b: "仅购买机身。注意预算。"
 thailand.66.t: "引擎问题"
 thailand.66.d: "德国拒绝为中国制造的出口型潜艇提供柴油发动机许可证，导致已支付一半款项的S26T潜艇艇体在武汉等待“心脏”的到来。北京方面提出提供自家发动机并给予折扣。海军方面则让内阁面临两难选择。"
 thailand.66.a: "接受中国产发动机并提货。"
 thailand.66.b: "要求以一艘护卫舰船体作为赔偿。"
 thailand.66.c: "彻底取消合同。"
 thailand.67.t: "旗舰重生"
 thailand.67.d: "滑跃甲板上部署着无人机，机库甲板的坞舱内装载着无人艇，控制台摆放在曾经堆放“鹞”式战机备件、早已锈蚀的地方。“差克里·纳吕贝特”号返回梭桃邑时，已拥有了本地区独一无二的任务配置。"
 thailand.67.a: "让她列队走过摄像机。"
 thailand.67.b: "安静地重新启动，恢复工作。"
 thailand.68.t: "九十天的恐惧"
 thailand.68.d: "黑名单变成了死亡人数统计。三个月内死亡人数超过两千，其中许多人与毒品并无关联，调查人员未能查明。乡村地区一片欢腾，医院人满为患，外交部的邮箱也迅速爆满。"
 thailand.68.a: "坚持下去。这场运动正在奏效。"
 thailand.68.b: "悄悄降温同时要求重估"
 thailand.69.t: "军官俱乐部传出风声"
 thailand.69.d: "曼谷历届政府都会学会解读的种种迹象都在这里：不寻常地轮换到第一军区，退役将领突然热衷于电视采访，以及骑兵营的同学聚会，半数高级指挥官都出席了。"
 thailand.69.a: "清除高层领导。"
 thailand.69.b: "迁就将军们。"
 thailand.69.c: "公开反抗他们。"
 thailand.70.t: "政府大楼外的坦克"
 thailand.70.d: "一切照旧地开始了。常规节目被爱国音乐取代，十字路口停着装甲车，一份来自昨天还无人知晓的“委员会”的公报。政府只有几分钟时间来决定愿意花多少钱。"
 thailand.70.a: "团结忠诚派，进行抵抗。"
 thailand.70.b: "认输，然后登机。"
 thailand.70.c: "协商组建国民团结政府。"
 thailand.70.c_tooltip: "§Y将军们进入的是内阁，而不是宫殿。§!\n选举得以顺利进行（§G选举不会暂停§!），政变压力降至§Y35§!。王国为此付出了稳定和政治资本方面的代价，一项§Y不稳定的妥协§!使政府承受了180天的压力。"
 thailand.71.t: "街头的年轻人"
 thailand.71.d: "他们通过Telegram组织起来，引用《哈姆太郎》和《饥饿游戏》的台词，成千上万地聚集在纪念碑前。他们的诉求写在纸飞机上，扔过障碍物：解散议会，重写宪法，改革那些不可触碰的机构。"
 thailand.71.a: "驱散集会人群。秩序刻不容缓。"
 thailand.71.b: "开启对话。改变语气，但不要改变实质内容。"
 thailand.71.c: "耐心等待。他们会比我们先疲惫。"
 thailand.155.t: "一片火海"
 thailand.155.d: "一夜之间，三个省份发生协同纵火事件。检查站光天化日之下遭到袭击。教师在押送下，学校停课。南方地区几十年未见如此惨烈的景象，国家安全委员会亟需明确的方向。"
 thailand.155.a: "向南方增派大量军队。"
 thailand.155.b: "致电吉隆坡，扩大对话范围。"
 thailand.156.t: "北大年静谧的道路"
 thailand.156.d: "月度事件分布图上，空白区域比红色区域多。市场营业至深夜，检查站放行车辆，吉隆坡对面的人们正谨慎地询问，最终的局面会是什么样子。"
 thailand.156.a: "推动达成最终协议。"
 thailand.156.b: "维持现状，保持平静。"
 thailand.350.t: "南方之火"
 thailand.350.d: "南方三省的地图上布满了红色图钉，爆炸、伏击、纵火和暗杀事件层出不穷。数千人丧生，安全部队伤亡惨重，无法补充。这场危机已无法在边缘地带得到控制。政府必须决定在南方扮演何种角色：是铁腕统治，还是恩惠庇护，抑或与民众平等对话。"
 thailand.350.a: "粉碎他们。南方将会明白秩序的意义。"
 thailand.350.b: "国王的和平。发展南方，收复失地。"
 thailand.350.c: "跟他们谈谈。即使是昔日的仇敌也能签字。"
 thailand.350.e: "我们没有明确的政策，只能走一步看一步了。"
 thailand.356.t: "卡车"
 thailand.356.d: "又一次清剿行动，又一群人聚集在另一个区警察局外。最终，数百名被拘留者面朝下被塞进军用卡车，数十人在抵达营地前窒息而死。在曼谷方面发表声明之前，这些画面就已经传遍了整个穆斯林世界。无论这次行动在地面上取得了什么成果，它都已经使一代人走向极端，并为叛乱运动提供了其起源神话。"
 thailand.356.a: "一场灾难。南方不会忘记这场灾难。"
 thailand.357.t: "完成治安任务"
 thailand.357.d: "将军们报告任务已完成。路边的炸弹已停止，基层组织已被瓦解，检查站正在拆除。按照军队衡量的一切标准，泰南已被平定。但在表面的平静之下，积怨并未消亡，只是默默等待。"
 thailand.357.a: "枪声已停。我们将静观余烬。"
 thailand.358.t: "南方的平静"
 thailand.358.d: "没有条约，也没有自治权，但暴力已逐渐消退，取而代之的是一种有控制的平静。王室发展稳步推进，地方名流纷纷入主王室，君主制在南方的合法性也悄然恢复。这种平静靠的是王室的存在和庇护，靠的是监视而非解决。"
 thailand.358.a: "王室维护着它所赢得的和平。"
 thailand.359.t: "建制派反攻倒算"
 thailand.359.d: "特别自治法案草案泄露，曼谷反应激烈。将军们警告称此举将导致国家分裂，宫廷保守派低声议论先例，民族主义媒体则称之为投降。谈判代表已准备签字，但政府必须决定是耗费政治资本坚持立场，还是将框架修改得让中央政府能够接受。"
 thailand.359.a: "坚守阵地。协议必须是真实的。"
 thailand.359.b: "淡化处理。息事宁人，放弃原则。"
 thailand.360.t: "北大年协议"
 thailand.360.d: "一页纸上的签名结束了泰国现代疆界内持续时间最长的战争。南部地区在统一的泰国境内获得了真正的自治权，枪支被交出，流离失所的人们开始返回家园。这并非完美无缺，充满争议，但却是历史性的。一代人以来，北大年府的孩子们将第一次在没有宵禁的环境中长大。"
 thailand.360.a: "南方终于迎来了和平。"
 thailand_news.24.t: "达拜大屠杀"
 thailand_news.24.d: "在达拜郊外，被拘留者在军用卡车内窒息而死的画面已经传遍了穆斯林世界的每个首都。吉隆坡、雅加达和安卡拉召见了泰国大使，人权组织要求对此事展开调查。曼谷的南部政策如今已成为暴行的代名词，叛乱分子也迎来了前所未有的招募高峰期。"
 thailand_news.24.a: "全世界都在关注南方。"
 thailand_news.25.t: "北大年迎来和平"
 thailand_news.25.d: "经过一代人的浴血奋战，泰南的枪声终于沉寂。无论是靠士兵之手还是谈判者之笔，王国现代史上历时最久的叛乱已画上句号。道路畅通，市场繁荣，一种谨慎的常态回归北大年、也拉和那拉提瓦。"
 thailand_news.25.a: "一场漫长的战争结束了。"
 thailand_news.23.t: "国民团结政府"
 thailand_news.23.d: "坦克已撤离十字路口，但夜间达成的协议将超越危机本身。民选政府保住了其授权，选票依然有效，但各军种首脑如今也坐上了内阁之位，曼谷的每个人都明白是谁保障了和平。这是一项无人喜爱也无人敢违背的妥协：一个军队也参与其中的全国性政府。"
 thailand_news.23.a: "权力，共享与监视。"
 thailand.3.c: "种植农作物，而不是罂粟。资助其他发展途径。"
 thailand.361.t: "路边的尸体"
 thailand.361.d: "为期三个月的行动结束了，统计结果也已出炉。人权组织记录了约2800名死者，其中绝大多数从未被指控任何罪名，许多人甚至连名字都没有。黑名单清算了旧账，配额的达成也付出了生命的代价。街头恢复了平静，民调支持率也达到了前所未有的高度，但在军营和宫殿里，人们正在记录着这个按计划杀人的政府。"
 thailand.361.a: "数字就是数字，我们无需道歉。"
 thailand.362.t: "农作物而非罂粟"
 thailand.362.d: "单靠禁毒只会把毒品交易推向下一个山脊。农学家和公共卫生专家提出了不同的方案：付钱给山地农民，让他们种植咖啡、澳洲坚果和水果，而不是鸦片；把毒瘾视为疾病而不是犯罪；让合法的经济作物发挥直升机无法企及的作用。这种方法速度更慢，成本更低，而且要求政府停止打击毒品，转而开始购买。"
 thailand.362.a: "为替代发展提供资金。用市场赢得民心。"
 thailand.362.b: "继续拦截。坚守阵地。"
 thailand_news.5.t: "泰国推出东部经济走廊"
 thailand_news.5.d: "曼谷正式开放了其位于东部沿海的旗舰开发区，该开发区拥有连接三个机场的高铁、扩建后的乌塔堡航空城，以及旨在扶持电动汽车、航空航天和生物技术的激励方案。分析人士称其为自上世纪80年代东部沿海计划以来泰国最雄心勃勃的经济项目。"
 thailand_news.5.a: "“微笑之国”是认真的。"
 thailand.50.b: "减轻打击，保护人民。"
 thailand.55.b: "打造国民汽车。"
 thailand.200.t: "人民宪法"
 thailand.200.d: "民间社会组织、学术界和社区领袖庆祝在真正的公众参与下制定的宪法。几十年来，普通泰国人第一次感到自己参与了自己的基本法，曼谷的街道出人意料地充满了节日气氛。"
 thailand.200.a: "民主扎根。"
 thailand.201.t: "廊曼纪录"
 thailand.201.d: "廊曼机场的客运量打破了以往所有纪录，“神奇泰国”推广活动也取得了超出所有人预期的成功。航空公司高管纷纷宣布开通新的直飞航线，旅行社也已经预订了未来两个季度的行程。摆在我们面前的问题是：如何处理这些收入？"
 thailand.201.a: "再投资到南部度假胜地。"
 thailand.201.b: "把这笔意外之财存起来。"
 thailand.202.t: "世界对大米的需求日益增长"
 thailand.202.d: "印度次大陆的干旱和东南亚各地的作物歉收导致世界大米价格飙升至十年来的最高点。泰国拥有大量优质茉莉香米和茉莉香米库存，所有粮食进口商都急需这些产品。商务部正在等待我们的答复。"
 thailand.202.a: "以溢价出售库存。"
 thailand.202.b: "把大米留在家里，补贴国内价格。"
 thailand.203.t: "基地请求"
 thailand.203.d: "美国太平洋司令部已悄然正式提出扩大乌塔帕奥空军基地使用权的请求，用于后勤、监视和预置。美方愿意为此付出代价，包括国库拨款、设备升级和政治掩护。公众永远不必知晓其中的细节。"
 thailand.203.a: "授予访问权限并收取费用。"
 thailand.203.b: "礼貌地拒绝。泰国领土，泰国主权。"
 thailand_news.6.t: "竹子可以弯曲，但不会折断。"
 thailand_news.6.d: "泰国达成了一项具有里程碑意义的双轨外交战略，在深化与华盛顿的条约关系的同时，也与北京签署了新的框架性经济伙伴关系协定。曼谷外交部称之为“竹子外交”，灵活、富有韧性，并将泰国的利益置于一切之上。"
 thailand_news.6.a: "一项了不起的平衡之举。"
 thailand_news.7.t: "泰国提前两年偿还国际货币基金组织贷款"
 thailand_news.7.d: "曼谷已提前两年偿清了所有国际货币基金组织的债务。财政部低调宣布了这一提前还款计划，这标志着1997年亚洲金融危机的结束，也使泰国摆脱了1997年救助计划的最后附加条件。"
 thailand_news.7.a: "微笑之国还清债务。"
 thailand.205.t: "技术官僚与老派势力之争"
 thailand.205.d: "新成立的首席执行官式内阁为每个部委都设定了绩效目标，一些常任秘书也被企业高管取代。老牌官僚对此很不高兴。一场悄无声息的战争正在酝酿，一方是力推“泰国公司”模式的技术官僚，另一方则是执掌各部委三十年的职业官员。"
 thailand.205.a: "支持技术官僚。改革各部委。"
 thailand.205.b: "保护职业官僚体系。维持各部委正常运转，确保将军们继续支持你。"
 thailand.207.t: "祈祷乏力"
 thailand.207.d: "三年过去了，将军们的改革承诺已然褪色。宪法起草委员会已经两次改组。选举日期也两次更改。一名在议会大厦外举牌抗议的大学生面临十七项指控。蜜月期已过。"
 thailand.207.a: "我们将谨慎地进行过渡管理。"
 thailand.208.t: "对峙仍在继续。"
 thailand.208.d: "日子一天天过去，几周过去了。抗议活动没有平息，也没有升级。政府既没有让步，也没有清理广场。最终，双方都做出了让步。问题是，谁让步得更少。"
 thailand.208.a: "寻求通过做出让步来和平解决问题。"
 thailand.208.b: "抗议者们邀功，政府承担责任。"
 thailand_news.8.t: "皇室掌控大局"
 thailand_news.8.d: "泰国王室已正式确立其在王室财产管理局资产管理中的角色，将数千亿泰铢的商业资产的管理权整合到一个直接向王室汇报的机构中。曼谷的分析人士就此展开辩论，争论这究竟是宪法上的创新，还是仅仅是对数十年来非正式存在的安排进行法律上的梳理。"
 thailand_news.8.a: "却克里王朝延续至今。"
 thailand.209.t: "孩子们都在网上"
 thailand.209.d: "一场由青年主导的抗议运动在曼谷、清迈和三个省份的大学校园同时爆发。在警方设置路障之前，他们的诉求就已通过直播传播开来。政府必须决定是介入还是等待。"
 thailand.209.a: "支持他们的事业。"
 thailand.209.b: "继续执政。让这时刻过去。"
 thailand.210.t: "来自军营的一封信"
 thailand.210.d: "一份匿名文件在高级军官间传阅后泄露，其中描述了一项由文职人员主导的削弱军方对晋升和采购影响的计划。文件发出警告：军方正在密切关注，耐心是有限的。这或许是一场尚处于萌芽阶段的真正政变阴谋，也可能只是虚张声势。如何应对，将决定这个国家究竟是怎样的国家。"
 thailand.210.a: "立即行动，在阴谋者组织起来之前将他们清除出去。"
 thailand.210.b: "悄悄进行。我们不会回应任何泄密行为。"
 thailand.211.t: "各省已表态"
 thailand.211.d: "东北部和北部上游地区的计票结果已经出炉，一个又一个选区倒向了改革派阵营。一些从政三十年的资深议员败给了在社交媒体上积极竞选的二十八岁年轻人。选情正在被那些从未接到过当地议员电话的选民重新塑造。"
 thailand.211.a: "把握住机会。"
 thailand.211.b: "要为所有人执政，而不仅仅是为我们的选民执政。"
 thailand.212.t: "企业集团的回应"
 thailand.212.d: "此前被垄断的频谱区块拍卖带来了改革者们预料中的意外之财。就在同一周，三大财团联合向宪法法院提起诉讼，一家保皇派报纸的评论文章则将财政部描述为“意识形态作祟”。拆分政策正在奏效，但也树立了强大的敌人。"
 thailand.212.a: "坚持下去。法律站在我们这边。"
 thailand.212.b: "提出和解方案，以有序的方式逐步结束关系，而不是强制分离。"
 thailand.213.t: "共和国第一年"
 thailand.213.d: "自宣言发表以来已过去十二个月，这个国家依然存在，伤痕累累，充满活力，争论不休，但依然存在。保皇运动并未消失，而是演变成一场法律和文化运动。首次总统选举即将举行。摆在内阁面前的问题是：是称之为成功，承认分裂，还是继续执政？"
 thailand.213.a: "我们创造了能够长久流传下去的东西。"
 thailand.213.b: "却克里运动尚未结束。人民铭记于心。"
 thailand.213.c: "共和国暂时保住了。还有很多东西需要捍卫。"
 thailand.214.t: "阅兵经过纪念碑"
 thailand.214.d: "三个小时的炮兵、装甲兵和步兵阅兵式，武装部队在拉差丹农大道上列队行进。人群比组织者预想的还要多。对于一个已经遗忘战争、将政变视为家常便饭的国家来说，这场阅兵式意义非凡。"
 thailand.214.a: "一个国家向保卫者致敬。"
 thailand_news.9.t: "泰国同性婚姻合法化"
 thailand_news.9.d: "泰国议会以三分之二多数票通过了婚姻平等法，成为东南亚首个赋予男女完全婚姻权利的国家。该法案立即生效。曼谷是隆区和清迈宁曼区的庆祝活动吸引了数万人参加。一些邻国政府发表声明表示“关切”。"
 thailand_news.9.a: "亚洲的里程碑。"
 thailand_news.10.t: "春天永存"
 thailand_news.10.d: "自改革政府在青年抗议浪潮中上台以来，三年过去了，泰国今天完成了全面的民主转型。文官对军队的控制正式确立，委任制参议院被解散，二十年来首次自由竞争的选举顺利举行，未发生任何意外。来自十七个国家的国际观察员已确认选举结果。"
 thailand_news.10.a: "民主扎根。"
 thailand_news.11.t: "泰式浪潮席卷亚洲"
 thailand_news.11.d: "从东京到台北再到吉隆坡，泰国文化无处不在。流媒体剧集、嘻哈音乐、时尚品牌，以及政府并未规划、也无法完全邀功的美食外交体系，泰国的文化产出无论在价值还是影响力上，都已超越了邻国。"
 thailand_news.11.a: "全世界都想要泰国制造的产品。"
 thailand.215.t: "盘点王国"
 thailand.215.d: "新政府的首次内部评估已经完成。官员们收集了相关数据，包括债务比率、基础设施缺口、贸易平衡和公众士气，分析结果显示有三条发展路径值得关注。政府必须选择首要任务。现在做出的选择将决定国家未来两年的发展轨迹。"
 thailand.215.a: "注重经济复苏。从根本上重建经济。"
 thailand.215.b: "注重秩序。先加强制度建设，再进行改革。"
 thailand.215.c: "着眼全球。以外交和贸易为主导。"
 thailand.216.t: "重大举措"
 thailand.216.d: "政府的抵抗号召已向警察、边防部队、民间社会网络和街头的忠诚拥护者发出。民众是否响应，将决定泰国未来十年的政治走向。在作战指挥中心，工作人员正在地图上查看部队部署情况并进行统计。"
 thailand.216.a: "保持阵线"
 thailand.217.t: "北京表示不满"
 thailand.217.d: "中国大使馆的照会依旧是外交辞令，但其中的冷意清晰可辨。泰国与华盛顿的日益走近，并未被忽视。北京官方媒体提及泰国的“矛盾姿态”。投资代表团悄然推迟行程。摆在曼谷面前的问题是：这份压力，要吸收多少，又要化解多少。"
 thailand.217.a: "让关系冷却下来。我们已经做出了选择。"
 thailand.217.b: "以总理个人名义，私下向北京方面传递安抚信息。"
 thailand.218.t: "华盛顿做出调整"
 thailand.218.d: "美国国务院公开对泰国与中国“一带一路”倡议的新对接保持了审慎的中立态度，但国会工作人员已开始就“金色眼镜蛇”联合军演的资金与条约承诺提出尖锐质疑。五角大楼的一份评估报告被泄露给华盛顿某智库，其中将泰国描述为“战略模糊”。曼谷必须妥善管理这段关系。"
 thailand.218.a: "接受关系冷却。我们是一个主权国家。"
 thailand.218.b: "对大使做出私下保证。此举并没有在实质上改变任何东西。"
 thailand.219.t: "将军常驻体制"
 thailand.219.d: "将军事监护制度化的决定，已登上国际媒体的社论版面。《金融时报》将其描述为“受控威权主义”。三名欧洲大使在同一周内请求与外交部会面。在国内，改革派学者和学生正在阅读这些报道，并得出自己的结论。"
 thailand.219.a: "我们依自身准则行事，外部言论无关紧要。"
 thailand.219.b: "批评者关于泰国的看法是错误的。我们将按照自己的方式证明他们是错的。"
 thailand.220.t: "南方再次对游客开放"
 thailand.220.d: "自海啸将安达曼海岸的沙滩封闭、仅限维修人员进入以来，已过去两年，如今最后一个度假胜地也已重新开放。泰国旅游局开展了一场精心策划的复苏宣传，而预订数据表明成效显著。南方已经回来了。"
 thailand.220.a: "泰国继续开放。"
 thailand.221.t: "南方重建已完成"
 thailand.221.d: "国际援助团队与政府工程师已完成沿海基础设施重建计划。道路已重建，渔港码头已修复，电网已恢复。援建伙伴已获致谢，脚手架正在拆除。"
 thailand.221.a: "南方再度屹立。"
 thailand.222.t: "全球金融危机"
 thailand.222.d: "纽约雷曼兄弟的倒闭在亚洲市场引发了轩然大波。泰国的出口部门正密切关注其订单簿。对曼谷而言，问题在于过去十年建立起来的金融缓冲是否能够经受住考验，又或是这场海啸会穿透防波堤。"
 thailand.222.a: "泰国经受住了风暴。我们的谨慎得到了回报。"
 thailand.222.b: "风暴已至。我们必须为艰难的两年做好准备。"
 thailand.223.t: "三百七十七"
 thailand.223.d: "在枢密院的阅览室和军事情报部门的走廊里，分析人员正在处理选举结果。三百七十七个席位。一党独大。这是泰国民主史上前所未有的授权，而旧体制对此没有任何可靠的反制手段，至少现在无计可施。"
 thailand.223.a: "乡村已经发声。至少暂时如此。"
 thailand.224.t: "稻米清算之时"
 thailand.224.d: "世界米价并未如人所愿。全球供应过剩使政府手中积压着数百万吨以远高于市价购入的库存稻米，而原本预期用于补贴该计划的套利收益并未实现。财政部已将三个选项摆上台面，其中两个在政治上可行。"
 thailand.224.a: "承受损失，并从国库中弥补缺口。"
 thailand.224.b: "让计划破产，现在承担政治后果。"
 thailand.225.t: "公路到村"
 thailand.225.d: "戴安全帽的部长们为横贯呵叻高原的新公路和伸入北部山谷的铁路支线剪彩。各府行政机构在那些向来只向首都输出劳动力的城镇中开门办公。这一次，发展终于回到了那些创造压倒性胜利的民众身边。"
 thailand.225.a: "核心地带得到了回报。"
 thailand.226.t: "拉玛十世国王的统治"
 thailand.226.d: "国丧之年行将结束。新国王的治国之道与先王不同——更频繁地公开亮相、更紧地掌控王室资产，以及一种不同风格的皇家魅力。曾服务于第九世王朝的那套网络，必须学会服务于第十世。这已不是同一套网络了。"
 thailand.226.a: "王国步入新纪元。"
 thailand.227.t: "老兵反对"
 thailand.227.d: "征兵逐步取消的公告引发了退役军官和退伍军人协会的协同反应。军营里，资深士官抱怨军队被“掏空”。媒体刊登老将军们身着全套礼服、神情不悦的照片。政府对此早有预料，但反弹的幅度超出了预测。"
 thailand.227.a: "坚定立场。改革是正确的。"
 thailand.227.b: "举办退伍军人表彰仪式，并象征性地吸纳批评意见。"
 thailand.228.t: "旅游红利"
 thailand.228.d: "开放天空协议后的第一个季度已经结束。旅游局的数据表现强劲。入境人数增长了百分之十二，日均消费增长了百分之十九，而受益于新的低成本航空公司航线最多的南部度假区，报告了十年来最好的季度业绩。"
 thailand.228.a: "泰铢在流动。"
 thailand_news.13.t: "泰国，亚洲之门户"
 thailand_news.13.d: "泰国政府已正式宣布其南部基础设施走廊——无论是运河还是陆桥——将以“公平条件向所有国家开放”。国际投资已开始流入南部经济区，曼谷正接待来自十二个国家的代表团，它们正寻求优惠过境安排。"
 thailand_news.13.a: "微笑之地掌控航道。"
 thailand.250.t: "政府退缩"
 thailand.250.d: "罢工使国家停滞太久，当权者已难以承受其代价。码头、铁路、各部委——一切停摆，街头属于这场运动。内阁不愿赌上军队向自己人民开火的可能，于是打开了谈判之门。这是一条以胆识而非步枪赢得的和平夺权之路。"
 thailand.250.a: "我们赢得了街头。现在我们要赢得国家。"
 thailand.259.t: "军队恢复秩序"
 thailand.259.d: "罢工持续了许久，却始终未能彻底击垮政府的意志，而最高指挥部的耐心最先耗尽。坦克驶上大道，罢工领袖正被围捕，宵禁已生效。这场革命在尚未夺取权力之前便被粉碎，军人如今以秩序之名统治。红色道路自此封闭。"
 thailand.259.a: "革命跌的粉碎。"
 thailand.251.t: "世界的反应"
 thailand.251.d: "泰国新政府已正式成立。华盛顿的反应在执政党成立文件墨迹未干之前便已出炉：经济制裁、冻结援助渠道，以及国务院一份既居高临下又充满威胁的声明。相比之下，北京和河内则发来了祝贺。"
 thailand.251.a: "让他们制裁我们吧。我们发动这场革命不是为了获得他们的认可。"
 thailand.252.t: "保皇党人离开"
 thailand.252.d: "土地改革回答了曼谷上流社会不愿提及的问题。那些依靠旧制度积累财富的人 - 不在本地居住的地主、围绕皇室的投资网络、以及每个子女名下都拥有万莱土地的乡下家族 - 已经做出了选择。他们中的大多数人已经登上了飞往新加坡、伦敦和洛杉矶的飞机。"
 thailand.252.a: "一个国家不属于它的地主。"
 thailand.253.t: "却克里难题"
 thailand.253.d: "却克里王朝统治暹罗和泰国已超过两百年。无论人们对历代君主有何看法，君主制都已深深融入泰国的民俗生活、法律体系、曼谷的城市风貌以及相当一部分民众的情感世界。执政党必须决定如何对待这一制度。\n\n党对革命目标的忠诚毋庸置疑。唯一的问题是，彻底决裂还是有序过渡对他们更有利。"
 thailand.253.a: "废除君主制。君主制在人民共和国中没有立足之地。"
 thailand.253.b: "在政党执政期间，保留一位宪法意义上的傀儡领袖。"
 thailand_news.14.t: "竹幕落下"
 thailand_news.14.d: "泰国已正式与老挝和越南结盟，构建了一个区域团结框架，分析人士已将其称为“竹幕”。这是自波尔布特统治下的柬埔寨以来，东南亚国家首次公开宣布加入共产主义阵营。西方国家正在重新评估形势。北京对此表示欢迎。泰铢一夜之间被新货币取代。"
 thailand_news.14.a: "东南亚的版图已经改变。"
 thailand_news.31.t: "乡村包围城市"
 thailand_news.31.d: "多年来，曼谷一直将叛乱视为一场已结束战争的残余，而如今，泰国共产党却公开宣布发动人民战争。北部高地和伊桑高原的据点已超出安全部队的控制范围，来自国家早已停止服务的村庄的招募人员源源不断地涌入。此前认为这场运动不会成功的军事分析人士，如今正在悄然修正他们的评估。"
 thailand_news.31.a: "现在山丘是他们的了。"
 thailand_news.32.t: "泰国加入“龙之觉醒”行列"
 thailand_news.32.d: "曼谷与北京签署了一项影响深远的合作协议。该协议带来了投资、贸易便利和安全保障，使革命后的泰国牢牢地落入中国的势力范围。官方媒体称之为两个社会主义邻国的自然结盟。西方外交官则将其比作卫星找到了太阳。曼谷上空拔地而起的建筑起重机表明，至少资金是实实在在的。"
 thailand_news.32.a: "轨道已设定。"
 thailand_news.33.t: "三河联盟"
 thailand_news.33.d: "泰国、老挝、越南和柬埔寨宣布了建立以曼谷为工业和外交中心的印度支那社会主义联邦的框架。湄公河沿岸的革命首次发出统一的声音，这声音如此响亮，以至于大国不得不回应，而不是忽视。四个骄傲的首都能否共同推进这一项目，仍然是一个悬而未决的问题。"
 thailand_news.33.a: "印度支那各国人民团结一致。"
 thailand.260.t: "红衫军占领拉差帕颂"
 thailand.260.d: "农村选民的呼声已蔓延至曼谷。数万名红衫军占领了首都的商业中心拉差帕颂路口，并用削尖的竹竿和堆叠的轮胎设置路障。商场关闭，交通瘫痪，运动组织表示，他们将坚守阵地，直到政府宣布举行选举。军队正在等待政府的指示。"
 thailand.260.a: "让他们在那里吧。即使路口被占领，这座城市也能正常运转。"
 thailand.260.b: "清空路口。首都不可能无限期地关闭。"
 thailand.270.t: "拥王者"
 thailand.270.d: "阿努廷·查恩维拉库尔的政党在新一届议会中占据决定性地位。他提出的加入联合政府的条件并不算过分：几个部长职位、承诺增加农村发展支出，以及一项非常具体的政策承诺。但组建联合政府的成本总是会高于最初的报价。"
 thailand.270.a: "组建执政联盟。成立一个多数派政府值得付出这样的代价。"
 thailand.270.b: "拒绝。我们可以不用他们也能治理国家，或者干脆不治理国家。"
 thailand.271.t: "部委"
 thailand.271.d: "内阁级谈判结束。泰自豪党获得公共卫生部、农业部以及副总理职位。文件签署完毕，联盟正式成立，各方利益交换随即展开。"
 thailand.271.a: "执政联盟暂时维持住了。"
 thailand.272.t: "废除运动"
 thailand.272.d: "执政联盟中的保守派成员以及联合政府之外的保皇派民间团体，已发起正式的废除大麻非刑事化法案的运动。他们收集到的签名足以迫使议会进行辩论。问题在于，政府是会力争保留这项政策，还是会为了政治上的和平而放弃它。"
 thailand.272.a: "废除这项法案。稳定比淘金热更重要。"
 thailand.272.b: "立场坚定。政策不变。让他们诉诸法庭吧。"
 thailand.273.t: "来自曼谷的提议"
 thailand.273.d: "泰国向掸邦伸出了橄榄枝。如果掸邦与泰国结盟，泰国将承认掸邦的主权，并提供武器和财政支持。掸邦将获得真正的自治权，但随之而来的依赖性也将难以消除，而内比都绝不会原谅掸邦的选择。"
 thailand.273.a: "接受曼谷的保护"
 thailand.273.b: "我们自立自强"
 thailand.280.t: "客场首胜"
 thailand.280.d: "财生利金属橡胶公司的首胜4x4越野车已在协会内部找到买家，包括印尼海军陆战队、菲律宾宪兵队和马来西亚边防部队。首批车辆已发货。出口代理的佣金远低于由此带来的声誉收益。东南亚现在都知道，泰国制造的产品值得购买。"
 thailand.280.a: "签订合同。东盟市场是我们的了。"
 thailand.281.t: "海军陆战队在梭桃邑训练"
 thailand.281.d: "泰国皇家海军陆战队十年来首次进行专门的两栖作战演习，一个营的兵力在梭桃邑海军基地进行了滩头突击演练。新的作战条令已经制定完毕，船坞扩建项目也已获得资金，海军陆战队司令不再为预算问题道歉，并开始着手规划下一次演习。"
 thailand.281.a: "来自海上"
 thailand_news.15.t: "泰国，东盟新兴的军火库"
 thailand_news.15.d: "本季度在曼谷签署的一系列国防出口合同促使区域分析人士重新评估泰国在东南亚国防市场的地位。“首胜”防地雷反伏击车已进入菲律宾和印尼的库存，泰国制造的火炮引信也已进入马来西亚的库存。泰国皇家兵工厂不再是国内采购项目，而是一个区域供应商。"
 thailand_news.15.a: "王国的工厂都在运转。"
 thailand_news.16.t: "曼谷宣布多域作战理论"
 thailand_news.16.d: "泰国皇家武装部队最高司令部发布了泰国首个官方多域作战理论，将网络战、电子战、无人机打击和常规地面机动整合到一个统一的作战框架中。该理论是在与美国和澳大利亚伙伴的联合演习中制定的，标志着泰国不再将战争视为单一领域的对抗。"
 thailand_news.16.a: "王国在各个战线上作战。"
 thailand.310.t: "反应堆发生临界反应"
 thailand.310.d: "凌晨3点47分，控制室的仪表读数突破零点。泰国首座压水反应堆达到临界状态。总工程师称之为技术里程碑，内阁则称之为能源安全保障。双方的说法都正确。到明天早上，国家电网的面貌将焕然一新。"
 thailand.310.a: "基础负荷电力的新时代。"
 thailand.311.t: "金边方面回应"
 thailand.311.d: "柬埔寨外交部对曼谷的示好做出了回应，其正式程度超出预期，热情程度也超出人们的担忧。金边政府的考量显而易见：与泰国保持密切关系既能对冲对北京的过度依赖，又能带来该地区增长最快的经济体所能提供的收入来源。"
 thailand.311.a: "欢迎建立合作伙伴关系。"
 thailand.311.b: "谨慎行事。进步需要时间。"
 thailand.312.t: "雅加达对话"
 thailand.312.d: "印尼代表团抵达时并未起草联合公报。雅加达想知道曼谷的意图。是建立真正平等的区域伙伴关系，还是争夺印尼长期以来视为己任的东盟领导地位？两种选择都在考虑范围内。但无论哪种选择，代价都不菲。"
 thailand.312.a: "伙伴关系。联合演习，共享理论，互惠互利。"
 thailand.312.b: "竞争。我们将在雅加达周边地区超越它的影响力。"
 thailand.313.t: "中国合同文件"
 thailand.313.d: "财政部的评估十分明确。“一带一路”框架下签署的基础设施合同确实为泰国提供了所需的公路和铁路，但融资条款却将北京的影响力牢牢地植入这些项目，并将持续数十年。摆在内阁面前的问题是：是继续依赖中国资本，还是承受重新谈判带来的短期阵痛。"
 thailand.313.a: "继续注资。这些项目能够带来成果。"
 thailand.313.b: "重新谈判。主权需要付出代价。"
 thailand.314.t: "华盛顿方面要求进行审查"
 thailand.314.d: "美国太平洋司令部已正式要求进行双边安全审查。实际上，这是邀请泰国深化条约合作，接受相关培训，并承担作为美国在东南亚最可靠伙伴所带来的政治影响力。另一种选择是继续维持对立关系。"
 thailand.314.a: "深化联盟。接受培训并做出承诺。"
 thailand.314.b: "距离。这种对冲方式更适合泰国。"
 thailand_news.17.t: "泰国启动首座核反应堆"
 thailand_news.17.d: "泰国皇家政府已将泰国首座商业核电站投入全面运营，使其成为东南亚首个运营民用核电的国家。这座位于北柳府的600兆瓦压水反应堆将满足泰国约8%的电力需求。分析人士指出，该反应堆具有双重用途：它不仅保障了能源安全，还在核能能力日益成为中等强国雄心壮志标志的东南亚地区，树立了新的技术标杆。"
 thailand_news.17.a: "王国迈入核时代。"
 thailand.315.t: "达蒙通的地雷"
 thailand.315.d: "在争议不断的达蒙通寺庙群附近发生地雷爆炸，造成三名泰国皇家陆军士兵受伤。双方均指责对方埋设地雷。该事件引发了曼谷和金边的民族主义抗议活动。"
 thailand.315.a: "要求给出答案，并动员民族主义情绪。"
 thailand.315.b: "请求东盟进行调解，让外交官们发挥主导作用。"
 thailand.316.t: "达蒙通发生枪击事件"
 thailand.316.d: "争议边界沿线爆发了小规模冲突。两国政府都面临着来自各自军方和民族主义运动的压力。东盟秘书长发表声明，呼吁各方保持克制。"
 thailand.316.a: "紧抓优势"
 thailand.316.b: "接受东盟停火协议。"
 thailand.317.t: "七月战争，全面军事行动"
 thailand.317.d: "泰国和柬埔寨军队在达蒙通和柏威夏附近的边境地区持续一周发生冲突。炮火交锋造成双方人员伤亡。东盟已召开紧急峰会。"
 thailand.317.a: "在展现实力后，接受东盟停火协议。"
 thailand.317.b: "稳住阵脚，守住优势。"
 thailand.318.t: "边境紧张局势再度升温"
 thailand.318.d: "尽管达成了停火协议，但争议边界沿线的冲突再次爆发。12月的冲突升级将考验两国能否遵守协议，还是会再次滑向公开冲突。"
 thailand.318.a: "重申停火协议。"
 thailand.318.b: "恢复敌对行动。"
 thailand.319.t: "华盛顿对在F-35问题上说不"
 thailand.319.d: "美国以技术转让限制和对泰国与中国关系的担忧为由，拒绝了泰国正式提出的购买F-35“闪电II”战斗机的请求。"
 thailand.319.a: "参加鹰狮E/F项目。"
 thailand.319.b: "接受F-16V批次70替代方案。"
 thailand.319.c: "转向歼-10CE战机。北京方面将提供。"
 thailand.320.t: "佩通坦被法院撤职"
 thailand.320.d: "泰国宪法法院因一段泄露的电话录音而解除总理佩通坦·钦那瓦的职务，录音中她似乎在破坏一个独立机构的运作。泰自豪党的阿努廷·查恩维拉库尔被任命为看守总理。"
 thailand.320.a: "接受判决。"
 thailand.320.b: "对裁决提出异议。"
 thailand.321.t: "阿努廷掌舵"
 thailand.321.d: "阿努廷·查恩维拉库尔领导的看守政府获得了人民党的信任支持。他承诺将在四个月内举行新的选举。"
 thailand.321.a: "看守政府开始工作。"
 thailand.322.t: "泰国将于2026年2月举行大选"
 thailand.322.d: "泰国举行大选，此次选举将决定未来四年国家的政治走向。边境战争加剧了民族主义情绪，使泰自豪党占据优势。人民党在城市民调中领先。"
 thailand.322.a: "泰自豪党胜选，阿努廷的任期得到确认。"
 thailand.322.b: "人民党执政联盟上台。"
 thailand_news.18.t: "东盟斡旋泰柬停火"
 thailand_news.18.d: "东盟成功斡旋泰国和柬埔寨达成停火协议，结束了在达蒙通寺庙群附近持续数周的边境冲突。东盟秘书长称赞这一成果证明，区域机构能够遏制双边冲突，防止其升级为公开战争。"
 thailand_news.18.a: "目前该地区仍保持稳定。"
 thailand_news.19.t: "阿努廷的政党主导泰国大选"
 thailand_news.19.d: "泰自豪党在2026年2月泰国大选中赢得193个席位，为阿努廷·查恩维拉库尔赋予了压倒性的授权，结束了数月的看守政府执政的不确定性。这一结果巩固了泰国保守民粹主义的政治中心，并为他开启完整的四年任期奠定了基础。"
 thailand_news.19.a: "王国的新使命。"
 thailand.330.t: "军官团的灵魂"
 thailand.330.d: "总参谋部内部正悄然进行着一场争论。一方主张建立一支专业、不涉政治、技术精湛的军队；另一方则希望打造一支声名显赫的武士阶层，作为国家的骄傲和利剑。王国此刻的选择，将影响未来一代军官的命运。"
 thailand.330.a: "建立一支专业队伍。"
 thailand.330.b: "培养武功威望。"
 thailand.334.t: "潜艇就位"
 thailand.334.d: "在发动机争议多年之后，首艘S26T潜艇终于正式加入泰国皇家海军服役。艇员们为这一天进行了艰苦的训练。无论采购过程中的政治因素如何，泰国如今拥有了一艘现代化潜艇，区域力量平衡也略微向南倾斜。"
 thailand.334.a: "舰队出海。"
 thailand_news.26.t: "鹰狮在曼谷上空盘旋"
 thailand_news.26.d: "泰国皇家空军接收了首批JAS 39“鹰狮”多用途战斗机，并编队飞越首都曼谷上空以庆祝这一里程碑事件。这些瑞典制造的战机使泰国真正具备了第四代空中作战能力，并在现代数据链空战领域站稳了脚跟。"
 thailand_news.26.a: "王国的天空受到严密守护。"
 thailand_news.27.t: "泰国武器在世界市场上"
 thailand_news.27.d: "泰国新成立的国防出口办公室宣布了首批海外合同。装甲车、火炮和弹药将销往东南亚及其他地区的买家。泰国的国防工业曾经只是预算项目，如今正转型为出口创汇产业。"
 thailand_news.27.a: "泰国制造，行销世界。"
 thailand_news.28.t: "军武之国"
 thailand_news.28.d: "曼谷推出了一项全面防御计划。该计划包括扩大储备、在每个府开展民防演习，以及将整个社会视为最后一道防线的理念。批评者称之为军事化，而政府则称之为审慎之举。"
 thailand_news.28.a: "全国上下严阵以待。"
 SIA_expansionism_threat: "泰国扩张主义"
 thailand.380.t: "地峡的工程师们"
 thailand.380.d: "可行性研究委员会的结论已经出炉。削减成本虽然艰难，但并非不可能。现在唯一的问题是，也是困扰这个项目一个世纪的问题，那就是谁来买单。除了我们自己出资的方案外，内阁会议上还摆放着三份外国报价。每份报价的价格都不仅仅可以用泰铢来衡量。"
 thailand.380.a: "以北京的“一带一路”融资为例。成本低、速度快，条款问题以后再说。"
 thailand.380.b: "选择日本。节奏慢一些，价格也贵一些，但经久耐用，而且没有隐藏条款。"
 thailand.380.c: "引入国际财团。分阶段进行，共享资源，并且不受任何单一势力控制。"
 thailand.380.e: "我们自己动手建。运河要一直到最后一个系船柱都充满泰式风情。"
 thailand.381.t: "破土动工"
 thailand.381.d: "围堰已筑好，首批土方已运出，克拉地峡的大工程正式启动。这项工程将分阶段进行，每一阶段都将是对国库财力的一次新考验。"
 thailand.381.a: "开始动工吧。"
 thailand.382.t: "阶段完成"
 thailand.382.d: "运河的又一个阶段竣工，并经工程师验收合格。运河的切口更深了，工程进展更顺利，在下一份账单到来之前，内阁成员们可以稍稍沾沾自喜。"
 thailand.382.a: "进入下一阶段。"
 thailand.383.t: "成本超支"
 thailand.383.d: "最新阶段的工程预算已经严重超支。坚硬的岩石、被淹没的长廊以及承包商修改后的报价，都让项目办公室不得不向内阁寻求决定：要么筹集资金，要么接受运河开放时间将晚于原定计划。"
 thailand.383.a: "注资，然后按计划进行。"
 thailand.383.b: "接受延期。财政利益至上。"
 thailand.384.t: "运河完工"
 thailand.384.d: "最后一扇船闸闸门已安装完毕，上游航段已注满水，引航员也完成了首次满载航行。克拉运河除了剪彩仪式外，其余全部竣工。王国现在可以宣布这项浩大的工程竣工了。"
 thailand.384.a: "剪断丝带，打开运河。"
 thailand.385.t: "运河区的破坏"
 thailand.385.d: "一座泵站爆炸，一条运输道路被切断——这些行动都带有泰南叛乱组织的标志。运河穿行于争议地区，而那些与曼谷为敌的人，已找到了一个足以登上头条的目标。项目办公室要求我们决策：是加强工程安保，还是与当地人谈判。"
 thailand.385.a: "加强走廊沿线安保。"
 thailand.385.b: "与当地领导人谈判。要换取和平，而不仅仅是守卫。"
 thailand.386.t: "北京呼吁贷款"
 thailand.386.d: "超支触发了“一带一路”协议中的一项条款，北京的谈判代表带着一叠对中国有利的方案抵达曼谷。人民币债务已成为筹码，而运河本身则成了抵押品。内阁必须决定如何应对这一局面。"
 thailand.386.a: "给予经营租赁权，并让北京承担一部分通行费。"
 thailand.386.b: "以严苛的条件进行重组。偿还债务，并保留泰国运河。"
 thailand.386.c: "违约。运河是我们的，就让市场自行其是吧。"
 thailand.388.t: "资本竞争"
 thailand.388.d: "违约事件引发市场恐慌。外国投资者纷纷撤资，泰铢贬值，央行动用外汇储备以平息恐慌。损失惨重，但只要时间足够，一个立场坚定的国家终将渡过难关。"
 thailand.388.a: "熬过这场风暴。"
 thailand.389.t: "引发华盛顿和德里注意"
 thailand.389.d: "中国对克拉河的租赁经营权引发了从华盛顿到新德里的各方警觉。两国首都都担心北京会在此设下咽喉要道，都在密切关注曼谷方面是否会做出保证，还是会进一步向东方靠拢。"
 thailand.389.a: "安抚双方，并投入政治资本争取他们的支持。"
 thailand.389.b: "向北京靠拢。伙伴关系已经建立，就让西方去适应吧。"
 thailand.390.t: "海峡失去垄断地位"
 thailand.390.d: "首批满载油轮正通过克拉海峡，马六甲海峡沿岸的各大港口正在计算损失。新加坡和吉隆坡曾依靠这条昔日的咽喉要道发家致富，如今却眼睁睁地看着过境收入北流，它们恐怕不会轻易原谅夺走这些收入的沙特阿拉伯王国。"
 thailand.390.a: "如今，曼谷汇聚了两大洋。"
 thailand.391.t: "什么类型的运河？"
 thailand.391.d: "运河已经开通，但它的未来将会如何？是海军武力把守、戒备森严、炮台林立的堡垒？还是对所有国家开放、条约保障的中立国际航道？这一选择将决定泰国在未来一代人的海上强国地位。"
 thailand.391.a: "加强克拉地区的防御和抵抗能力。"
 thailand.391.b: "向所有和平缴纳过路费的人开放克拉运河。"
 thailand_news.20.t: "两大洋，一个王国"
 thailand_news.20.d: "历经数年辛勤劳作，耗资数十亿泰铢，并经历了任何工程师都无法预料的地缘政治变迁，克拉运河终于开通。船只首次无需绕行马来半岛，即可直接通行于安达曼海和泰国湾之间。亚洲贸易版图由此重绘，而曼谷正是这幅版图的缔造者。"
 thailand_news.20.a: "一条酝酿了一个世纪的运河。"
 thailand.393.t: "该地区的贱民"
 thailand.393.d: "面具已被揭开。曼谷试图征服邻国的行径，彻底撕下了其作为东盟领导者的所有伪装。东南亚各国首都纷纷退缩，世界各国也重新评估形势。泰国不再是该地区的轮值主席国，而是该地区的威胁，外交和经济壁垒已经开始筑起。"
 thailand.393.a: "让他们畏惧我们吧。帝国从来都不是靠朋友赢得的。"
 thailand.394.t: "华盛顿谴责曼谷"
 thailand.394.d: "美国强烈谴责泰国在东南亚的侵略行径。华盛顿方面表示将与该地区受威胁的国家站在一起，权衡各种保障措施，并敦促其伙伴国团结一致，共同对抗这个企图称霸该地区的国家。曼谷曾经极力争取的美国影响力正在逐渐消退。"
 thailand.394.a: "美国民众的反对不会阻止这场进军。"
 thailand.395.t: "北京的开放之手"
 thailand.395.d: "华盛顿退缩之际，北京却积极介入。中国将孤立且咄咄逼人的泰国视为有用的伙伴，这个国家已经与西方和地区彻底决裂，如今已无路可走。曼谷的孤立处境对北京来说是一个机会，而这只伸出的援手也附带着泰国无法拒绝的条件。"
 thailand.395.a: "如果东方愿意接纳我们，那就接纳吧。"
 thailand.431.t: "来自曼谷的邀请"
 thailand.431.d: "泰国已正式邀请东盟加入其东南亚条约组织。该条约承诺在曼谷的领导下，实现共同指挥、共同安全以及统一的区域声音。然而，东盟始终捍卫其独立性，将我们的命运与泰国捆绑绝非易事。我们有权自由选择，如果该条约不再对我们有利，我们也有权随时退出。"
 thailand.431.a: "我们接受。共享安全，我们才能更安全。"
 thailand.431.b: "我们拒绝。我们的独立不是用来交换条件的。"
 thailand.425.t: "[FROM.GetNameDefCap]签署条约"
 thailand.425.d: "[FROM.GetNameDefCap]的答复是肯定的。他们的代表团正在前往曼谷签署协议的途中，东南亚条约组织将获得一个成员。每个签名都使下一个签名更容易获得。"
 thailand.425.a: "又多了一个座位。"
 thailand.426.t: "[FROM.GetNameDefCap]拒绝邀请"
 thailand.426.d: "[FROM.GetNameDefCap]已感谢我们的提议并婉拒了。他的语气很友好，但答案是否定的。这种约定不能强加于人，我们的大门依然敞开。"
 thailand.426.a: "这是他们的选择。提议仍然有效。"
 SIA_kra_fortress_threat: "克拉运河防御工事"
 SIA_kra_default_threat: "泰国主权违约"
 SIA_kra_chokepoint_threat: "克拉咽喉要道"
 SIA_asean_hegemon_threat: "泰国竞逐东盟霸权"
 thailand.410.t: "大王国的地图"
 thailand.410.d: "旧地图再次被拿出来，这些地图将兰纳、掸邦山区、柬埔寨和老挝的失落省份以及马来南部地区都划归泰国管辖。泛泰运动如今在内阁中拥有了发言权，并直截了当地提出了一个问题：泰国王国是应该向世界宣布其领土不可分割，还是应该以更为温和的方式实现同​​样的目标？所有大国都在关注曼谷将如何回应。"
 thailand.410.a: "宣称它。这些土地属于泰国，全世界都应该知道。"
 thailand.410.b: "悄无声息地。我们构筑阵地，不发出任何动静。"
 thailand.411.t: "同一个民族，同一个命运"
 thailand.411.d: "泛泰族理念不再是军官和历史学家们的边缘幻想。集会挤满了皇家田广场，报刊上也刊登着代表一个横跨云南至地峡的单一泰族民族的旗帜。这场运动如今有了公众形象，而政府也选择赋予它这样的形象。"
 thailand.411.a: "让国家听到自己的名字。"
 thailand.412.t: "风中之竹"
 thailand.412.d: "泰国采取灵活策略，但不会屈服。曼谷拒绝在华盛顿和北京之间选边站队，而是让两国都与它保持着暧昧关系，这种古老的“竹子外交”如今以现代手法加以运用。两国首都都释放出友好的信号，而任何一方都无法承受将泰国推向对方怀抱的后果。"
 thailand.412.a: "我们保持开放心态，让朋友们猜来猜去。"
 thailand.413.t: "燃料循环问题"
 thailand.413.d: "泰国的新型反应堆采用自主燃料循环，而自主燃料循环意味着铀浓缩，铀浓缩则意味着民用能源与核武器之间的界限日益模糊。国际原子能机构要求加强保障措施，华盛顿要求泰国做出保证，而该地区则想知道曼谷的意图。虽然泰国目前没有公开的核武器计划，但这种能力已近在咫尺，泰国必须决定在这条路上走多远。"
 thailand.413.a: "反抗他们。主权财富是我们的权利，无论采取何种手段。"
 thailand.413.b: "让他们放心。采取全面的安全措施，维护信任。"
 thailand.413.a_tooltip: "§R扩散警报§!。泰国因§Y“抗命进行主权核浓缩”§!产生国际紧张度，美国急剧转向反对曼谷，同时印度也提高了警惕，§R美国在泰国的影响力下降15%§!。"
 thailand.414.t: "守护者之章"
 thailand.414.d: "宪法被改写，守护者永不眠息。任命的委员会、保留的权力，以及对军营负责的参议院。深层政府不再是非正式的习惯，而是成文的保证。秩序得以保障，而代价则是不受约束的政治悄然消亡。"
 thailand.414.a: "稳定，永恒不变。"
 SIA_guardianship_cost_tt: "国际社会对守护者的永久巩固感到畏缩。\n§R国库 -20§!\n§R与美国与英国的关系下降§!"
 thailand.415.t: "东盟治世"
 thailand.415.d: "从马尼拉到雅加达，从河内到新加坡，东南亚各国首都举杯向曼谷致敬。他们曾惧怕泰国攫取霸权，如今却视其为保障者，一个以信任为先导、以共识为盟约、并信守和平承诺的王国。这就是东盟治世，而泰国则以伙伴的身份，而非征服者，居于其核心地位。"
 thailand.415.a: "一个和平的地区，而泰国是其基石。"
 thailand.416.t: "将军之后"
 thailand.416.d: "这位将军还有他的总理任期、蜜月期以及平稳的权力交接期。当权派可以通过安插亲信、加强党对国家机器的控制来进一步巩固自身地位，或者也可以看清形势，巩固既得利益，并在公众耐心耗尽之前，退回到更加亲民的姿态。"
 thailand.416.a: "巩固统治。当权者加强了控制。"
 thailand.416.b: "制度化。巩固成果，缓和局面。"
 thailand.417.t: "东方引擎运转"
 thailand.417.d: "东海岸的起重机从未停歇。新建铁路、新建跑道、新建工业园区。东部经济走廊已然腾飞，投资正开始产生连锁效应。春武里府、罗勇府和北柳府正成为泰国经济的引擎。"
 thailand.417.a: "走廊繁荣昌盛。"
 SIA_nuclear_defiance_threat: "主权财富基金挑战"
 SIA_tsunami_warning: "海啸预警网络"
 thailand.363.t: "生产力陷阱"
 thailand.363.d: "增长期已过。一代人大学毕业后，面对的是停滞不前的经济、停滞不前的工资、工厂工作外包以及他们永远无法涉足的房地产市场。他们是泰国历史上受教育程度最高的一代，却看不到任何出路，而且他们很清楚该怪谁。曼谷的十字路口到处都是竖中指的手势，话题标签的传播速度比警察阅读的速度还要快。“前进”运动正中他们的下怀。过去那种缓慢而舒适的政治模式无法再束缚他们。"
 thailand.363.a: "开放体制，让步改革，让新政治自由发展。"
 thailand.363.b: "秩序优先。清空街道，然后把话题转移到国家大事上。"
 thailand.363.c: "利用增长争取时间。转向刺激经济，缓解压力。"
 thailand.364.t: "两个泰国"
 thailand.364.d: "王国内部有两个国家。一是曼谷和省会城市，毕业生、办公楼、咖啡馆，改革已成定局。另一个是水稻带和东北部，那里的民粹主义者依靠乡村资金和大米补贴建立他们的机器，从未放过。他们想要不同的东西，害怕不同的未来，并投票给不同的政党。政府必须选择在哪里插上旗帜，或者假装它可以完全站在这条线之上。"
 thailand.364.a: "吸引首都和毕业生，塑造泰国的城市未来。"
 thailand.364.b: "争取稻米产区，这个位于内陆、能带来丰厚回报的地区。"
 thailand.364.c: "超越分裂。唯有王位才能统一两个泰国。"
 thailand.365.t: "镇压的回声"
 thailand.365.d: "清空街道并没有消除不满，反而加剧了不满。一度分散的运动已经重组，规模更大，愤怒更甚，其领导者如今成了烈士，其诉求也变得不容谈判。这场曾经的抗议正在演变成一代人的精神象征，去年挥动的每一根接力棒，都为今年招募了十位新的参与者。"
 thailand.365.a: "覆水难收，只能熬过这场风暴。"
 thailand.418.t: "丛林骚动"
 thailand.418.d: "苦难已持续太久。在被国家遗忘的偏远山区，旧日的面孔再次浮现。那些在特赦前为泰国共产党扛枪的干部，如今已是白发苍苍，但并未被遗忘；他们的子孙后代，已一无所有。学习小组在灯光下聚会，那面折叠了四十年的红旗，如今被重新展开。吞噬了上次叛乱的丛林依然存在，充斥其中的怨恨也依然存在。"
 thailand.418.a: "让小组自行组织起来。乡村的命运掌握在我们手中，稍有不慎就会失去。"
 thailand.418.b: "镇压地下组织。在事态蔓延之前，把干部全部抓起来。"
 thailand.418.c: "清除民众的怨恨情绪，加大对各地区的投入。"
 thailand.74.t: "资产案"
 thailand.74.d: "宪法法院正在审理总理是否利用其女佣、司机和保安隐瞒股份持有情况。一旦罪名成立，总理的任期将戛然而止。法官们意见不一，王室、媒体和军方都在密切关注判决结果。"
 thailand.74.a: "靠在长椅上吧。判决会对我们有利。"
 thailand.74.b: "服从程序，让法庭裁决。"
 thailand.75.t: "达拜"
 thailand.75.d: "在穆斯林聚居的南部腹地，士兵们将数百名被捆绑的抗议者塞进军用卡车。当车队抵达时，已有85人死亡，其中大部分死于窒息。这段视频传遍了世界各地。军官们团结一致，维护自身利益，而问题是，文官政府是否敢于追问究竟发生了什么。"
 thailand.75.a: "坚定支持军队。无需质疑。"
 thailand.75.b: "下令展开调查。军队要向我们负责。"
 thailand.76.t: "CTX扫描仪"
 thailand.76.d: "新机场炸弹探测扫描仪的费用已翻了近两番，而其中的加价环节已通过一条与内阁关系密切的中间商链条悄然消失。一次诚实的审计将令政府难堪。压下此事虽能保住差额，却也在助长一种正在积聚的说法：这个政府把国库当作家里的钱袋子。"
 thailand.76.a: "掩盖审计，私吞差额。"
 thailand.76.b: "取消合同，及时止损。"
 thailand.77.t: "让批评者闭嘴"
 thailand.77.d: "媒体大亨的夜间广播已成为反政府街头运动的集结号，独立广播公司iTV正逐渐脱离控制。诽谤诉讼、执照压力以及友善的股权收购或许能让它们就范，但代价却是坐实了批评者关于独裁悄然滋长的所有指控。"
 thailand.77.a: "让媒体俯首听命。"
 thailand.77.b: "让媒体运转，以言辞回应言辞。"
 thailand.78.t: "一党议会"
 thailand.78.d: "执政党赢得了绝对多数席位，这是泰国历史上首个一党政府。无需管理联盟，独立机构又充斥着忠诚者，总理可以不受约束地执政。对稻米带地区而言，这是一项授权；而对曼谷权势集团和军方来说，这正在演变成一种选举式独裁。"
 thailand.78.a: "不受约束的治理。人民赋予了我们这一切。"
 thailand.78.b: "拉拢反对派，共享席位。"
 thailand.73.t: "臣那越集团出售案"
 thailand.73.d: "总理家族将其电信帝国以约七百三十亿泰铢的价格出售给新加坡一家国有基金，并通过一次巧妙的资产重组，连一分钱税款都未缴纳。其合法性固然无懈可击，但其观感却是灾难性的。数日之内，黄衫军便涌满了大街小巷，而军方也开始公开质疑这位将国家资产免税出售的人是否仍受宪法的约束。"
 thailand.73.a: "将数十亿收入囊中。这一切都是合法的。"
 thailand.73.b: "缴纳税款，平息怒火。"
 thailand.420.t: "受命于民"
 thailand.420.d: "权力已转入民粹阵营。稻米带和城市贫民再次拥有了自己的政府，随之而来的是他信主义的乡村基金、廉价医疗，以及一位说他们语言的领袖。旧建制派的精神支柱不再稳固，随着新机器掌控权柄，宫廷网络和改革派系纷纷瓦解。军营一如既往，仍在观望。"
 thailand.420.a: "乡村拥有了它的政府。"
 thailand.421.t: "建制派归来"
 thailand.421.d: "控制杆已移交至保皇派建制派手中，无论是通过选票、宫廷交易还是黎明时分的坦克。恩荫君主制重新确立其权威。枢密顾问、将军与大家族环绕王座。民粹机器的精神随其授权一同消散，改革运动被扫出局。王国在熟悉的手掌下重归稳定。"
 thailand.421.a: "国家秩序井然。"
 thailand.422.t: "改革浪潮"
 thailand.422.d: "新一代已掌权。曾走上街头游行改革的运动，如今已入主内阁，议程转向瓦解旧秩序、废除征兵制、打破垄断、动摇那些不可侵犯的机构。前政府的精气神随其领导人失势而消逝。问题在于，旧体制是否会容许这场实验继续下去。"
 thailand.422.a: "未来已至。"
 thailand.423.t: "法庭作出裁决"
 thailand.423.d: "宪法法院已将执政党锁定为目标。解散令已拟就，行政部门可能像其众多前任一样，因司法裁定而被罢免。政府既可屈从于裁决，将权力拱手让予对手，也可违抗法庭，硬扛后果。"
 thailand.423.a: "接受判决，体面退出。"
 thailand.423.b: "违抗法院。我们向选民负责，而非法官。"
 thailand.424.t: "民主党永存"
 thailand.424.d: "政权已重返民主党手中，这是王国历史最悠久的政党，无论是通过选票的轮替，还是法院将行政权交给反对派。没有压倒性的胜利，也没有魅力非凡的富豪，只有耐心而平凡地治理，作为一个广泛的文职联盟，将未来寄托于制度而非单一领袖。前政府的士气随着其任期一同消散。而在稻米带地区，他信的机器已在为下一轮较量积蓄力量。"
 thailand.424.a: "建制派坚守阵地。"
 thailand.430.t: "核武库定位？"
 thailand.430.d: "首批泰国核弹头已经真真切切的入库，但未公开的武器无法威慑任何人。国家安全委员会必须解决每个核国家都必须回答的问题：王国在何种情况下会使用它们？我们所宣示的姿态将决定地区及大国如何解读我们的意图。"
 thailand.430.a: "仅限报复。我们只有在遭受战略武器打击时才会还击。"
 thailand.430.b: "战术与战略反击。我们以同等手段回应任何核攻击。"
 thailand.430.c: "率先使用，让敌人困惑，令他们畏惧。"
 thailand_news.30.t: "泰国加入核俱乐部"
 thailand_news.30.d: "曼谷证实了情报机构数月来的窃窃私语。泰王国已经拥有核武器。亚洲乃至更远地区的各国纷纷重新评估力量平衡，因为一个新成员跨过门槛进入核俱乐部。"
 thailand_news.30.a: "地缘政治发生变动。"
 SIA_threat_thai_bomb: "泰国核武计划"
 SIA_threat_thai_enrichment: "泰国铀浓缩计划"
 SIA_threat_thai_first_use: "泰国宣布将率先使用核武器"
 thailand.432.t: "战略不容等待"
 thailand.432.d: "“作坊式”发展让泰国富到了足以停滞的地步，而各部委就如何脱困争论了太久。前沿不会等待，而越南正在缩小差距。国家战略必须立即出台。"
 thailand.432.a: "以法令落实。"
 thailand.432.b: "先建立共识。"
 thailand.433.t: "北方之盾"
 thailand.433.d: "曼谷已请求北京对王国作出正式保证。中国的承诺将巩固泰国向大陆靠拢的倾向，并警告任何试图试探其边界的对手。而代价则是一个远在千里之外的长期承诺。"
 thailand.433.a: "扩展保护承诺。"
 thailand.433.b: "曼谷能够独立坚守。"
 SIA_frontier_overextension_idea: "边疆过度扩张"
 SIA_frontier_overextension_idea_desc: "师团投入西部边境便意味着曼谷的防守力量被削弱。皇家泰国陆军的兵力部署远比政府所愿承认的更为捉襟见肘，而民众已感受到战前承诺带来的沉重压力。"
 SIA_regional_pariah: "边疆贱民"
 SIA_regional_pariah_desc: "曼谷将缅甸的边境地区整个吞并。华盛顿和北京谴责这一领土扩张行为，东盟各国首都紧张地审视着自己的边界，而泰国出口商则因王国受损的名声在每一份海外合同中付出代价。"
 SIA_frontier_partners: "边疆伙伴"
 SIA_frontier_partners_desc: "收复的边疆地区通过代理人契约而非占领来治理。软实力比驻军更划算。行政机构精简高效，施工队伍行动自如，免去了吞并可能带来的外交反噬。"
 SIA_kings_moral_authority: "国王的威望"
 SIA_kings_moral_authority_desc: "在位七十年使这位君主拥有了任何政治家都无法企及的威望。在危机时刻，宫廷的一句话便能平定军队所不能解决之事。"
 SIA_royal_guidance_idea: "王室的注视之下"
 SIA_royal_guidance_idea_desc: "宫廷的年度指导使王国保持稳定，并隔绝外来的干预，但一个向王权俯首的民选政府会发现自己的法令效力终究有限。"
 SIA_three_pillars_idea: "民族、宗教、国王"
 SIA_three_pillars_idea_desc: "官方民族主义与王权和僧伽紧密相连。佛教徒占多数的民众被牢牢束缚，以抵御颠覆活动和外来思想，但代价是公众思想变得更为沉闷、更加恭顺。"
 SIA_deep_south_grievance: "南方的不满"
 SIA_deep_south_grievance_desc: "在马来-穆斯林省份，佛教-王权主义的信条遭到排斥。北大年的不满情绪加剧，曼谷以稳定和政治资本为代价，勉强维持局面。"
 SIA_scarred_coast: "伤痕累累的海岸"
 SIA_scarred_coast_desc: "没有国家资金支持重建，安达曼的度假村多年半毁未修。酒店寂静无声，废墟无人清理，游客纷纷转向别处。"
 SIA_new_reign_mourning: "全国哀悼"
 SIA_new_reign_mourning_desc: "全国哀悼已故国王。公共生活趋于沉寂，娱乐活动暂停，政坛维持着微妙的休战状态。"
 SIA_ninth_reign_barami: "第九世王朝之威仪"
 SIA_ninth_reign_barami_desc: "普密蓬国王在位已超过半个世纪，比世上任何一位君主都更长久。他的威望，那数十年间积累的道德权威，凌驾于所有政客与将领之上。危机时刻，王室一言便能了结内阁无法定夺之事，王位亦护佑王国免受外邦图谋。"
 SIA_ninth_reign_zenith: "恩荫君主制的崛起"
 SIA_ninth_reign_zenith_desc: "宫廷不再仅仅是统治的象征。通过枢密院、法庭以及一张由忠诚的军官和商人编织的网络，王权渗透至国家的每一个机构。国王之言具有法律效力，异议无处容身，外来影响在保皇派共识的壁垒前徒劳无功。"
 SIA_tenth_reign_barami: "第十世王朝之威仪"
 SIA_tenth_reign_barami_desc: "王位已传至哇集拉隆功国王，但敬畏并非世袭。新君主继承了其父的职位，却未继承曾充盈此位的道德权威。王室依旧稳固国本，抵御外患，然而每一处权柄都不过是第九世王朝更微弱的回响。"
 SIA_two_thailands: "两个泰国"
 SIA_two_thailands_desc: "一片土地之上有两个国家。曼谷和中部平原掌握着财富、政权和旧体制。乡村的北部和东北部掌握着选票，并且越来越坚信他们的选票被法院和政变窃取。两者之间的鸿沟使每次选举都走向两极分化，迫使国库去购买它几乎负担不起的和平。"
 SIA_three_pillars_start: "民族、宗教、国王"
 SIA_three_pillars_start_desc: "$SIA_three_pillars_idea_desc$"
 SIA_populist_machine: "民粹机器"
 SIA_populist_machine_desc: "村庄资金、医疗卡、债务减免。一台将政府施政转化为选民忠诚的政策机器，周而复始，循环不息。"
 SIA_yellow_shirts_idea: "黄衫军"
 SIA_yellow_shirts_idea_desc: "人民民主联盟由保皇派、城市中产阶级组成，坚信选举多数派是被收买的。当他们涌上街头时，政府便摇摇欲坠。"
 SIA_red_shirts_idea: "红衫军"
 SIA_red_shirts_idea_desc: "民主联合阵线反对独裁统治的力量主要扎根于乡村、北部及东北部地区。他们参与了每一次选举并获胜，却也在每一次组建政府中失败。他们是多数派，对此心知肚明。"
 SIA_junta_government: "军政府"
 SIA_junta_government_desc: "军事委员会以法令治国。秩序被强制执行，异见被“调整”，而关于何时恢复选举的问题，得到的回应总是微笑与延期。"
 SIA_guided_democracy: "2017年体制"
 SIA_guided_democracy_desc: "指定人员的参议院、具有约束力的二十年战略，以及立场可靠的法院。选举仍在举行，但场地已被圈定。"
 SIA_network_monarchy_idea: "恩荫君主制"
 SIA_network_monarchy_idea_desc: "宫廷、枢密院、军队与司法机构构成了一张非正式的权力网络，凌驾于选举政治之上，且比任何政府都更为持久。"
 SIA_reform_momentum: "改革势头"
 SIA_reform_momentum_desc: "一代人以来，泰国政治中的能量首次流向了那些想要改变体制而非管理体制的人。"
 SIA_consolidated_democracy_idea: "民主巩固"
 SIA_consolidated_democracy_idea_desc: "文官政府、宪政体制，以及视政变为历史陈迹的民众。泰国的民主制度终于自立根基。"
 SIA_republic_turmoil: "宪政动荡"
 SIA_republic_turmoil_desc: "共和国问题已使每个机构、每个省份乃至许多家庭分裂。国家虽存续，但其下的共识已不复存在。"
 SIA_pan_thai_irredentism: "泛泰民族统一主义"
 SIA_pan_thai_irredentism_desc: "失去领土的叙事再次成为国家信条。泰族是一个民族，1893年至1909年的割让不合法，历史欠泰国一个纠正。"
 SIA_drug_war_stain: "国际谴责"
 SIA_drug_war_stain_desc: "毒品战争期间数千起法外处决事件，使泰国在每个人权论坛和每次外交谈判中都备受指责。"
 SIA_tourism_powerhouse: "旅游业强国"
 SIA_tourism_powerhouse_desc: "每年数千万游客使旅游业成为经济支柱，也使泰国品牌成为全球资产。"
 SIA_tourism_powerhouse_2: "旅游业产业政策"
 SIA_tourism_powerhouse_2_desc: "旅游业从季节性红利转型为国家政策的有序支柱。多元化且高消费的游客群体缴纳实际的企业税，并且对外国旅游集团集团的依赖程度远低于以往。"
 SIA_tourism_luxury_boom: "豪华旅行热潮"
 SIA_tourism_luxury_boom_desc: "一波高消费游客涌入五星级度假村，带动了收入增长。但季节一过，这股热潮便随之消退。"
 SIA_credit_boom_overheating: "信贷繁荣过热"
 SIA_credit_boom_overheating_desc: "廉价资金涌入的速度超过了银行体系的吸收能力，借款人如今正以更高的利率为此买单。随着周期降温，压力将有所缓解。"
 SIA_sustainable_extraction: "管理资源"
 SIA_sustainable_extraction_desc: "许可发放缓慢，让步范围狭窄，但国家更牢牢掌控着谁从地下资源中获利，对外国资本的回应也更少——这些资本在其他地方资助着更快速的资源开采。"
 SIA_digital_national_champions: "国家数字龙头"
 SIA_digital_national_champions_desc: "少数受国家青睐的平台凭借政策设计主导市场，易于征税、便于监管，却因地位稳固而不再积极推动改进。"
 SIA_detroit_of_asia_idea: "亚洲底特律"
 SIA_detroit_of_asia_idea_desc: "东海岸为全世界组装皮卡。汽车供应链支撑着泰国制造业，并保持出口账本的健康。"
 SIA_bamboo_diplomacy: "竹子外交"
 SIA_bamboo_diplomacy_desc: "随风而屈，从不折断。曼谷同时维系着美国的同盟、中国的投资，以及自己的主见。"
 SIA_deep_south_insurgency: "南方叛乱"
 SIA_deep_south_insurgency_desc: "马来穆斯林三府北大年、也拉和那拉提瓦的武装分离主义叛乱。其强度随政府在武力、发展或对话之间的选择而起伏。"
 SIA_war_on_drugs_campaign: "禁毒战争"
 SIA_war_on_drugs_campaign_desc: "黑名单、配额与“开枪即击毙”的模糊地带。冰毒贸易正在萎缩，法治亦随之退步。"
 SIA_deep_south_insurgency_1: "南方叛乱"
 SIA_deep_south_insurgency_1_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_2: "南方叛乱"
 SIA_deep_south_insurgency_2_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_deep_south_insurgency_3: "南方叛乱"
 SIA_deep_south_insurgency_3_desc: "$SIA_deep_south_insurgency_desc$"
 SIA_pacified_but_smoldering: "死灰阴燃"
 SIA_pacified_but_smoldering_desc: "铁拳政策奏效了。以军方唯一接受的标准来衡量，南方算是平静了。然而，整整一代人在宵禁和检查站中长大，积怨并未消失，只是转入了地下。偶发事件仍会爆发，而招募兵员的源泉也尚未干涸。"
 SIA_royal_pacification: "皇家绥靖"
 SIA_royal_pacification_desc: "在王室庇护与亲临督导之下，一种受控且受监察的平静得以维系。发展资金流入，地方名流被收编，王室在南方的合法性正悄然恢复。这不是一种和解，而是一种托管。"
 SIA_pattani_autonomy: "北大年自治"
 SIA_pattani_autonomy_desc: "泰国单一制国家内的一个自治特别行政区，设有民选地区议会、本地语言教育体系，并将南部部分税收留存于当地。和平红利实实在在，但这一先例让曼谷的中央集权者感到不安。"
 SIA_limited_devolution: "有限放权"
 SIA_limited_devolution_desc: "自治框架被淡化以安抚当权派。这不过是一种地方行政的权宜之计，而非真正的自治。眼下枪声沉寂，但这一解决方案让南方和中央都感到不满。"
 SIA_hearts_minds_education_strain: "心智与民心计划"
 SIA_hearts_minds_education_strain_desc: "马来语学校教育、宗教外联和村庄调解的费用都从教育预算中支出。事件地图上的动静渐渐平息，但学校系统却为此买单。"
 SIA_southern_development_levy: "南方开发负担"
 SIA_southern_development_levy_desc: "泰南三府的发展推进使得民用工业挤占了消费品产出。资金南流持续一年，国内货架上的短缺感随之而来。"
 SIA_peoples_constitution: "人民宪法"
 SIA_peoples_constitution_desc: "一部在广泛公民参与下制定的新基本法，确定了权责分配、文官对军队的监督以及机构独立，恢复了公众对宪法秩序的信任。"
 SIA_worlds_rice_bowl: "世界稻乡"
 SIA_worlds_rice_bowl_desc: "泰国香米和茉莉香米在各大洲都享有高价。农业出口收入支撑着经常账户，每个收获季节都重新确立曼谷的外交分量。"
 SIA_bri_debt: "一带一路债务敞口"
 SIA_bri_debt_desc: "一带一路基础设施贷款填补了预算无法覆盖的缺口，但还款条款却由北京方面制定。随着每一份协议的签署，泰国的财政主权都在不断收缩。"
 SIA_landslide_mandate: "受命于民"
 SIA_landslide_mandate_desc: "压倒性胜利赋予了政府真正的民意授权。党组织机器充满活力，农村基础被充分调动，反对派处于守势，但将领们正密切关注着这些数字。"
 SIA_ceo_state: "CEO之国"
 SIA_ceo_state_desc: "内阁已变成了董事会，各部委则成了控股公司。决策推进迅速，而问责的步伐却慢了半拍。制衡机制并未消失，只是正在被重新构建。"
 SIA_cult_of_the_ceo: "CEO崇拜"
 SIA_cult_of_the_ceo_desc: "总理已摒弃了协商作秀。支持率是他的武器，而批评者是障碍，党的内部程序则是他随时随地说了算。王室网络碰头频率明显高于往常。"
 SIA_dynasty_politics: "王朝政治"
 SIA_dynasty_politics_desc: "钦那瓦这个名字如今已融合为一个王朝、一个品牌、一个庇护网络和一个继承计划，所有这些都归结于同一个家族之中。对党的忠诚和对家族的忠诚已经密不可分。"
 SIA_institutionalized_party: "制度化政党"
 SIA_institutionalized_party_desc: "运动历经流亡、两次政变和十七次政党解散而存续至今。它已变得比任何单一领袖都更为持久，成为一个扎根于各省的真正政治机构。"
 SIA_privy_council_idea: "枢密院网络"
 SIA_privy_council_idea_desc: "普瑞姆·廷素拉暖将军数十年的结盟经营，织就了一张横跨军方高层、司法体系与行政系统的关系网络。其成员并不从其中领取薪俸，也无需如此。"
 SIA_judicialization: "法庭政治"
 SIA_judicialization_desc: "宪法法院本身已成为一个政治行为体。每一份请愿都是一件武器，每一次裁决都是某一派系的胜利，同时也是对另一派系的创伤。反对派研习法律以求生存。"
 SIA_isoc_network: "国安司令部网络"
 SIA_isoc_network_desc: "国内安全行动司令部渗透至各省，直接向军方汇报，而非民选部长。其情报网络使国家的触手无形无孔，且成效卓著。"
 SIA_crown_property_idea: "王室资产管理局"
 SIA_crown_property_idea_desc: "王室的商业分支在土地、银行和保险领域持有价值数千亿泰铢的股份。绝对君主制已经结束。经济君主制则运转得非常良好。"
 SIA_uncle_tu_honeymoon: "巴育执政蜜月期"
 SIA_uncle_tu_honeymoon_desc: "秩序恢复，街头势力退却，政府提出了二十年计划。目前，公众对稳定的渴望赋予了新总理非同寻常的容忍度。"
 SIA_uncle_tu_fatigue: "祈祷乏力"
 SIA_uncle_tu_fatigue_desc: "承诺让政治变得乏味的总理确实实现了承诺，却是以错误的方式。改革议程停滞不前，承诺的选举一再推迟，泰国年轻人开始追问，“临时”究竟何时才算结束。"
 SIA_reform_spring: "改革之春"
 SIA_reform_spring_desc: "一股公民热情浪潮席卷了改革运动。新面孔、新诉求，以及街头弥漫的情绪，是老一辈政客们一代人都未曾见过的。当权者开始注意到这一点，而他们的反应并不总是愉快的。"
 SIA_youthquake: "青年震动"
 SIA_youthquake_desc: "大学校园、社交媒体和街头巷尾都涌动着政治热情。从未投过票的泰国年轻人如今开始竞选公职、在政党办公室工作，并在网上筹集资金。正在崭露头角的技术官僚们，其受教育程度超过了以往任何一代人。"
 SIA_barracks_pushback: "军方反扑"
 SIA_barracks_pushback_desc: "高级军官通过退役中间人、意味深长的沉默以及尖刻的新闻发布会明确表示，文职改革的步伐正在考验军方体制的耐心。军队仍掌控着自己的晋升、预算和驻地分配。"
 SIA_thai_republic: "泰共和国"
 SIA_thai_republic_desc: "世界上存续最久的君主立宪制国家完成了转型。直选总统、完全主权的议会，以及一部没有军方否决权的宪法。这一变革并非不流血，但它坚守住了。"
 SIA_mandate_recovery: "恢复的使命"
 SIA_mandate_recovery_desc: "政府已将经济重建列为首要任务。消费成本受到压缩，建设计划加速推进。未来两年内，每一泰铢的生产性投资都将得到政府的全力支持。"
 SIA_mandate_order: "秩序的使命"
 SIA_mandate_order_desc: "政府开局之举是稳定优先于改革。制度得到强化，法院受到尊重，政治空转得到应对。这场赌局的核心在于要令人信服地展现秩序，方能赢得日后改革所需的信任。"
 SIA_mandate_outreach: "开放的使命"
 SIA_mandate_outreach_desc: "外交与贸易是政府公开宣布的优先事项。大使馆人员配备齐全，部长级代表团往来频繁，贸易部已获得扩充的预算，并可直接与首相的日程对接。"
 SIA_uneasy_compromise: "不安的妥协"
 SIA_uneasy_compromise_desc: "将军们稳坐高堂，政客们则紧抓民意——一个靠着纯粹的相互猜忌来维系王国的联合政府。稳定是以牺牲果断行动为代价换来的。每一个部门都受到监视，每一项倡议都须经过两次谈判。这一安排稳定了国家（§G+5%稳定度§!），却窒息了政府的行动自由（§R-10%政治点数获取§!），直至这一妥协安排走完其进程。"
 SIA_gfc_headwinds: "全球金融危机"
 SIA_gfc_headwinds_desc: "西方信贷市场崩溃导致泰国出口订单放缓，贸易融资收紧。消费品价格逐步攀升，贸易量萎缩。这场风暴并非泰国的过错，但经济将因此承受两年之痛。"
 SIA_coup_risk_modifier: "政变风险"
 SIA_coup_risk_modifier_desc: "政变风险升高会削弱政治稳定，且不利于政治点数的积累。风险越高，拖累越重。每一点风险都会对政府的执政能力产生影响。"
 SIA_coup_tier_watchful: "军方警惕"
 SIA_coup_tier_watchful_desc: "将军们眼下还满意。他们读报、清点预算，并保留着自己的意见。目前没有惩罚，但政府做出的每一个选择，都会让这个计量器上升或下降。\n\n§Y政变风险§!：[?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_restless: "军方躁动"
 SIA_coup_tier_restless_desc: "军方所属报刊上出现了尖锐的社论，退役军官在脱口秀节目中发着牢骚，还有高层指挥未获咨询便进行的内阁改组。军官食堂里的情绪已变得糟糕。要么清廉施政，要么在事态恶化之前把他们买通。\n\n§Y政变风险§!：[?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_plotting: "将军密谋"
 SIA_coup_tier_plotting_desc: "不同寻常的部队轮换、首相未受邀参加的晚宴、王宫接待身着制服访客。曼谷的每个人都能看出这些征兆。政府仍有机会从悬崖边缘撤回，但机会窗口正在关闭。\n\n§Y政变风险§!：[?ROOT.SIA_coup_risk|0]/100"
 SIA_coup_tier_tanks: "坦克预热"
 SIA_coup_tier_tanks_desc: "专栏已备好，广播稿已写好。军方只需一次挑衅就会向政府大楼进发。将政变风险拉回70以下，而且要快，否则§R安抚高级军官§!任务时间耗尽，坦克就会出动。\n\n§Y政变风险§!：[?ROOT.SIA_coup_risk|0]/100"
 SIA_rice_pledge: "稻米收购承诺计划"
 SIA_rice_pledge_desc: "政府以高于市场的价格收购农民的水稻收成，并持有战略储备。农村收入增加，而财政对全球大宗商品价格的敞口也随之上升。"
 SIA_red_shirts_mobilized_idea: "红衫军前进"
 SIA_red_shirts_mobilized_idea_desc: "农村网络已被动员起来，涌上街头。在乌隆他尼、孔敬和曼谷郊区的大规模示威活动集结了基层力量，并让王宫和高级指挥部确信民选政府已失去控制。每一次游行都将与军队的对决推得更近。"
 SIA_kings_moral_authority_2: "新王朝"
 SIA_kings_moral_authority_2_desc: "第十世王朝已稳固其权威，但这是另一种权威。比前任更显眼、更商业化、更具争议性。六十年王座所积累的威望，不会在一次加冕典礼中传承。"
 SIA_kra_mobilization: "克拉运河全国动员"
 SIA_kra_mobilization_desc: "王国能够调集的每一台起重机、挖掘机和工兵营都投入到了克拉地峡走廊的建设中。消费价格攀升，政治资本流失，政府的支持率在重压下弯曲，但建设速度却非同寻常。这一概念在运河完工后即被移除。"
 SIA_kra_canal: "克拉运河"
 SIA_kra_canal_desc: "连接泰国湾与安达曼海的运河使泰国成为全球第二繁忙航运通道的咽喉要地。通行费源源不断流入国库，各国海军礼貌地排队等候过境权，如今曼谷的意见在亚洲各国都更加受重视。"
 SIA_kra_debt_trap: "一带一路债务"
 SIA_kra_debt_trap_desc: "这条运河之所以启动成本低廉，是因为北京在为其买单。还款计划以人民币计价，抵押物是航道本身，而每一次成本超支都会加深债务。在贷款悄然利滚利的同时，消费价格逐渐上涨，政治资本也在流失。"
 SIA_kra_debt_serviced: "债务重组"
 SIA_kra_debt_serviced_desc: "贷款已在严苛但尚可承受的条件下重新谈判。危机已成过去，运河属于泰国，政府通过在谈判桌上而非暗室里直面北京，赢得了一定程度的信誉。"
 SIA_kra_default_pariah: "主权债务违约"
 SIA_kra_default_pariah_desc: "泰国退出了“一带一路”贷款。运河虽属其所有，但国际信贷市场铭记此事，贸易伙伴纷纷对冲风险，对于一个在政治需要时会拒付债务的国家而言，资本代价高昂。"
 SIA_kra_lease_concession: "北京租借地"
 SIA_kra_lease_concession_desc: "为清偿债务，运河部分区域的长期经营权被让渡给了一家中国国有企业。王国仍在船闸处悬挂国旗，但如今每笔通行费的一部分都流向北京，而全世界也已注意到真正握有租约的是谁。"
 SIA_kra_capital_flight: "资本竞争"
 SIA_kra_capital_flight_desc: "市场被突如其来的消息吓坏了。外资纷纷撤离，泰铢面临压力，央行正消耗外汇储备以减缓资本外流的冲击。这一冲击虽然严重但只是暂时的，一旦尘埃落定，信心就会恢复。"
 SIA_kra_delay: "施工延期"
 SIA_kra_delay_desc: "与其在一个超支的阶段继续投入更多资金，政府选择了接受较慢的进度。建设速度受到影响，形象也不佳，但国库得以避免最严重的超支负担。"
 SIA_kra_canal_sovereign: "主权运河"
 SIA_kra_canal_sovereign_desc: "运河无外债、无外附条款，从最后一根系缆柱起便完全属于泰国。为绝对主权付出的溢价，换来的是更深厚的海军工业基础、更强有力的通行费制度，以及任何租让权都无法企及的国家威望。"
 SIA_kra_fortress: "堡垒运河"
 SIA_kra_fortress_desc: "沿海炮台、加固的碉堡以及常驻的海军卫戍部队，使克拉水道成为泰国皇家海军能够以武力坚守的航道。舰队在扼守这一咽喉要道的过程中磨砺技艺，但军事化的通道也让曼谷在航运公司中损失了一些好感。"
 SIA_kra_neutral_transit: "中立过境制度"
 SIA_kra_neutral_transit_desc: "克拉运河向所有旗帜平等开放，由条约保障，并赢得各海洋强国的信任。交通与善意随之并流。通行费高昂，贸易国家的评价攀升，运河成为全球公共财产，而非国家武器。"
 SIA_red_revival: "泰共的幽灵"
 SIA_red_revival_desc: "泰国共产党的干部——七十年代斗争的幸存者、他们的子女、他们的学生——已从边缘走了出来。这个政党拥有政治能量、一套历史理论，以及对权力的渴望。它也有敌人，而只要它拒绝在现有体制内运作，其在国家对话中的存在每月都会让国家损失几点稳定度。"
 SIA_general_strike_idea: "总罢工持续"
 SIA_general_strike_idea_desc: "国家正被人为地瘫痪。港口、铁路、学校、医院仅靠最低限度的班次运转。罢工持续期间，稳定度每周下降1%。通过总罢工决议将势头推进至100，政府便宣告投降。若180天期限耗尽而势头不足，军队将接管政权。\n\n§R罢工势头§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_western_sanctions: "西方经济制裁"
 SIA_western_sanctions_desc: "美国及其盟友在泰国政府更迭后对其施加了一揽子制裁。投资陷入冻结，贸易融资难以安排，多项双边协议被中止。代价实实在在，而拥有一个明确外部敌人所带来的政治收益也同样真切。"
 SIA_asean_pariah: "该地区的贱民"
 SIA_asean_pariah_desc: "泰国试图征服邻国的举动已使其在整个东南亚乃至更广范围内成为众矢之的。东盟伙伴已将曼谷排除在区域商业之外，外资已逃离这个侵略者，如今每一块砖和每一桶油的价格，都反映着一个王国正与它曾领导的地区为敌。孤立自有其代价，而泰国经济正在为此买单。"
 SIA_peoples_siam: "人民团结阵线"
 SIA_peoples_siam_desc: "泰国已将自己锚定在老挝和越南的区域协作之中。相互承认框架提供了外交掩护，减轻了孤立感，而对于一个刚刚将主要工业国有化的国家而言，也提供了维持货架供应的贸易关系。集团内的军事合作是建立真正独立防务的基础。"
 SIA_green_rush: "叶子狂潮"
 SIA_green_rush_desc: "大麻非罪化开辟了一个新的农产品市场。依善地区的农民正在实现多元化经营，草药产品出口商的注册速度已超出许可证办理机构的处理能力，而曼谷酒店业的一个角落也已悄然转向。批评者称之为一场社会实验，而国库的进账则称之为财政收益。"
 SIA_war_plan_brm: "缅甸作战计划"
 SIA_war_plan_brm_desc: "泰国作战规划人员已对萨尔温江战役进行了详细推演。渗透走廊、后勤节点、掸邦非正规部队也会助我们一臂之力。计划正逢其时，集结基础设施已就位，军官团也熟悉地形。"
 SIA_war_plan_lao: "老挝作战计划"
 SIA_war_plan_lao_desc: "湄公河渡口、高原隘口，以及万象在面对来自廊开方向突击时极其脆弱。战役计划已下发到第三集团军司令部的每一份作战手册中。边境基础设施已悄然升级，以支持快速推进。"
 SIA_war_plan_cbd: "柬埔寨作战计划"
 SIA_war_plan_cbd_desc: "柏威夏走廊、扁担山崖、都是通往暹粒的平坦通路。泰方规划人员已三次划定作战边界并推演后勤方案。部队已集结就绪。"
 SIA_war_plan_may: "马来西亚作战计划"
 SIA_war_plan_may_desc: "1909年的边界线，只是一个规划上的约束条件，并非自然法则。一份标注为“机密”的红色文件夹中，存放着针对那拉提瓦通道和吉兰丹走廊的详细作战计划。泰南边境三府的基础设施投资，同时也是兵力集结的预备场地。"
 SIA_protector_of_the_realm: "王国守护者"
 SIA_protector_of_the_realm_desc: "泰国武装部队如今巩固了对新收复边疆的占领，在泛泰战争中所夺得的掸、老、高棉及马来土地上维持了秩序，而民政管理尚在跟进。随着毋庸置疑的胜利，厌战情绪逐渐消退，对统一的自豪感稳定了后方。"
 SIA_comprehensive_security_idea: "总体安全"
 SIA_comprehensive_security_idea_desc: "一体化国家安全框架减少了内政、国防与情报机构之间的重复建设。随着协调效率的提升，行政成本相应下降。任何外部势力的操纵难度都将显著增加。"
 SIA_cambodia_partnership: "柬埔寨伙伴关系"
 SIA_cambodia_partnership_desc: "与金边建立的结构化双边关系涵盖贸易便利化、联合开发区以及一项将泰国定位为柬埔寨首选经济伙伴的外交协议。这种影响力是双​​向的，而贸易收入则是单向流动。"
 SIA_fuel_reserves: "战略燃料储备"
 SIA_fuel_reserves_desc: "战略储备中保有全国三个月的燃料消耗量，分布在所有五个地区的分散油库中。这一储备能够平抑价格波动、提供危机缓冲，并向合作伙伴表明，泰国的军事后勤不会受制于单一供应路线。"
 SIA_medical_tourism_boom: "医疗旅游潮"
 SIA_medical_tourism_boom_desc: "消息已经传开。曼谷的私立医院被外国患者订得满满当当，康复者则留下来当起了游客。收据和入境人数逐月攀升，而病房里人满为患，本地人等待床位的时间越来越长。"
 SIA_aec_tailwind: "东盟一体化之风"
 SIA_aec_tailwind_desc: "贸易便利化推进在整个地区初见成效。边境摩擦减少，供应链深化，泰国工厂赢得区域合同。即便调整期挤压了国内消费品产能，出口导向型增长仍在多年间持续累积。"
 SIA_arms_export_orders: "国防出口订单"
 SIA_arms_export_orders_desc: "订单满满当当。防地雷车、弹药、巡飞弹和授权生产系统按滚动计划发往东盟买家。武器生产线满负荷运转，泰国作为该地区首选供应商的地位进一步巩固，尽管向邻国供应武器总会带来外交摩擦。"
 SIA_royal_development_lands: "皇家土地开发"
 SIA_royal_development_lands_desc: "王室资助的项目开辟了新的土地用于耕种和开采，并稳定了所涉及的省份。乡村更加安宁，资源基础更加广阔，尽管这些工程在运行期间消耗了国家的物资。"
 SIA_eec_construction_boom: "东部走廊建设热潮"
 SIA_eec_construction_boom_desc: "东部经济走廊是一个热火朝天的建设现场，港口上起重机林立，铁路路基已平整，厂房骨架拔地而起。建设速度加快，产出也随之攀升，但这一热潮在期间占用了消费品生产能力。"
 SIA_asean_chair_spotlight: "聚焦东盟主席国"
 SIA_asean_chair_spotlight_desc: "曼谷掌握着议长槌和镜头。只要聚光灯还在，担任主席国就能在整个东盟范围内轻松赢得善意，并维持一种更低成本的外交姿态。"
 SIA_purge_disruption: "反腐干扰"
 SIA_purge_disruption_desc: "整肃行动冻结了采购流程，让庇护网络如坐针毡。合同签订陷入停滞，政治机器也在闹情绪。这是为更清廉体制付出的代价，而且是提前预付的。"
 SIA_army_wage_inflation: "军官薪资虚高"
 SIA_army_wage_inflation_desc: "收买高层花了不少人情，但代价是臃肿的军饷开支。各级军官的薪金、津贴和虚设职位都被层层加码，军费账单将持续高企，直到预算重新被收紧控制。"
 SIA_chuan_leekpai_desc: "资深民主党政治人物及政坛元老，曾于1992年至1995年及1997年至2001年间两度出任总理。其第二任期带领泰国在IMF援助计划下度过亚洲金融危机。在腐败盛行的体制中，他以出淤泥而不染的个人操守著称。"
 SIA_thaksin_shinawatra_desc: "这位亿万富翁电信巨头创立了泰爱泰党，并在2001年大选中以压倒性优势获胜。他推行的民粹主义政策，例如30泰铢医疗保健计划和乡村发展基金，彻底改变了泰国农村的政治格局。2006年，他在军事政变中被推翻，之后通过多个代理政党在流亡期间继续统治泰国。"
 SIA_bhumibol_adulyadej_desc: "拉玛九世，却克里王朝第九位君主，也是世界上在位时间最长的国家元首。他作为团结象征的道德权威，在每一次政治危机中都发挥了作用。2016年10月，他的驾崩结束了长达70年的统治，也开启了举国上下深切哀悼的时期。"
 SIA_vajiralongkorn_desc: "拉玛十世，玛哈·哇集拉隆功，于2016年其父去世后登基。他直接掌控王室资产和皇家卫队，并比其前任更多地介入政治事务。他的统治时期恰逢泰国宪政史上最为动荡的时期。"
 SIA_abhisit_vejjajiva_desc: "这位毕业于牛津大学的民主党领袖，在2008年宪法法院解散人民力量党后，通过议会投票成为总理。他的政府主导了2010年4月至5月在曼谷对红衫军抗议者的镇压。"
 SIA_yingluck_shinawatra_desc: "为泰党领导人、他信·钦那瓦的妹妹，在2011年7月的大选中以2001年以来最大的多数票获胜。她的政府推行了“大米质押”计划，该计划后来演变成一场重大的腐败丑闻。2014年，她被宪法法院罢免，并在刑事判决前逃离泰国。"
 SIA_prayut_chanocha_desc: "泰国皇家陆军司令，领导了2014年5月泰国第十二次政变，并在全国维持和平秩序委员会军政府和公民力量党领导下担任了九年总理。他是2017年宪法混合成员比例代表制的制定者，该制度旨在瓦解反对党。"
 SIA_sonthi_boonyaratglin_desc: "这位陆军司令在2006年9月发动政变，推翻了当时正在海外访问的总理他信·钦那瓦。他担任国家安全委员会主席，直至过渡文官政府成立。之后，他以小党派领导人的身份进入选举政治。"
 SIA_anutin_charnvirakul_desc: "泰自豪党领袖，出身建筑业世家，曾任副总理，并因此声名鹊起。该党在军方和文职阵营之间巧妙的战略定位，使其在连续三届联合政府中都扮演了关键的“造王者”角色。2025年底，在宪法法院罢免佩通坦总理后，他出任代理总理。"
 SIA_pita_limjaroenrat_desc: "前进党领袖领导的政党在2023年5月的大选中以最高得票率获胜，却因军方任命的参议院阻挠而未能组建政府。随后，宪法法院解散了该党，并禁止他五年内参与政治活动。"
 SIA_natthaphong_ruengpanyawut_desc: "他是皮塔·林加伦拉特的继任者，成为重组后的人民党领袖，也是曼谷最年轻的当选市长。他代表着泰国进步政治的代际转变，转向地方治理、气候政策以及宪法改革。"
 SIA_songkhram_phaendin_desc: "他是泛泰学派的一位元帅，名字意为“土地之战”。他一路晋升，在军官队伍中不断宣扬1893年和1909年的割让是至今仍未愈合的伤口，只有军人统治的政府才能将其愈合。"
 SIA_somchai_ratchaphruek_desc: "他是一位经历过共产党丛林战争时期的老兵，姓氏源于金链花树。他熬过了清空集中营的大赦，回到东北继续组织工作，他认为革命失败的原因在于时机不对，而非目标不够明确。"
 SIA_banharn_silpaarcha_desc: "这位来自素攀武里府的泰国政党领袖兼建筑业赞助人，曾于1995年至1996年担任总理。他的政府在其家乡投入巨资兴建省级基础设施，以至于媒体戏称他为“行走的提款机”。然而，由于腐败指控以及1997年经济危机前夕出现的种种经济预警信号，该联盟在一年内便宣告瓦解。"
 SIA_chavalit_yongchaiyudh_desc: "新希望党创始人兼领导人，曾任泰国皇家陆军总司令，于 1996 年 11 月出任总理。他的政府执政期间，泰铢危机于 1997 年年中爆发，由于其政府未能控制住货币崩溃，他于同年 11 月迫于压力辞职。"
 SIA_thanathorn_juangroongruangkit_desc: "2018年共同创立未来前进党的汽车零部件大亨，成为该党以青年为主导的改革政治的代表人物。他的迅速崛起引起了建制派的警觉。宪法法院于2020年2月解散了该党，并因其政党从他个人处借款一事禁止他在十年内担任公职。"
 SIA_virot_paoin_desc: "一位警察中将，在他信派系转向后接掌为泰党领导权，以制服而非集会讲台为背景延续该党的民粹联盟。他的执政风格更倚重警察和公务员体系内的体制忠诚，而非其前任赖以建党的大规模农村动员。"
 SIA_srettha_thavisin_desc: "房地产开发商高管，为泰党2023年总理候选人，同年8月在该党与前对手组成的重返执政联盟中出任总理。2024年8月，宪法法院因其内阁任命涉及道德违规而解除其职务，使其成为十年来任期最短的泰国民选总理之一。"
 SIA_paetongtarn_shinawatra_desc: "他信·钦那瓦的小女儿，也是为泰党第三位钦那瓦家族成员出身的首相，于2024年8月就职，是该党为应对其前任被法院罢免而推出的首相人选。然而，她与柬埔寨首相洪森就边界争端进行的一次通话被泄露，导致她不到一年便失去了首相职位，也再次引发了人们对政府决策权在多大程度上仍受其父掌控的质疑。"
 SIA_greater_thailand_consolidated: "大泰国整合"
 SIA_greater_thailand_consolidated_desc: "领土收复运动已告结束。王国比以往更加辽阔强盛，人力资源储备加深，工业实力增强，人民因共同的牺牲与胜利而团结一心。曾用于征战的政权机器，如今转而推动建设。"
 SIA_pax_aseana_idea: "东盟治世"
 SIA_pax_aseana_idea_desc: "泰国领导着一个稳定、连贯且自给自足的安全联盟。政治资本自盟国首都源源流入，而稳定局势因各方深知曼谷不会孤立无援、盟友亦同此理而得以巩固。地区的和平由泰国的实力作为保障。"
 SIA_asean_defense_member: "东南亚条约组织成员国"
 SIA_asean_defense_member_desc: "这个国家自愿选择加入泰国的区域防御协定。共同的指挥和一致的目标稳定了后方，并加强了防御。以同意而非强迫为纽带，在强迫联盟早已瓦解之处，它对共同体的承诺依然坚如磐石。"
 SIA_rally_round_flag: "团结于旗帜之下"
 SIA_rally_round_flag_desc: "边境事件使泰国公众团结在武装力量身后。民族主义情绪高涨，征兵队伍排起长龙，但民众情绪波动不定，蜜月期不会永远持续。"
 SIA_anti_graft_idea: "反腐执法"
 SIA_anti_graft_idea_desc: "一个被赋予更大权力的国家反腐败委员会已经开始瓦解那些从泰国国家财政收入中抽走资金的采购和海关网络。承包商凭实力竞争，进口关税流入国库而非中间人腰包。六个月中反腐运动将导致政治点数累积减慢，这是打击根深蒂固利益集团所付出的代价。"
 SIA_strait_patrol_posture: "海峡巡逻"
 SIA_strait_patrol_posture_desc: "泰国皇家海军正在海峡执行加强巡逻轮换。护航舰艇沿航运通道警戒，雷达哨监视各条接近路线，舰队在保持战备姿态的同时，将活动范围延伸至更远离港口的海域。"
 SIA_asean_security_pledge: "东盟安全承诺"
 SIA_asean_security_pledge_desc: "泰国已承诺作为东南亚的守护者而非征服者。首批保障将提供给接受曼谷保护的邻国，外交使团则致力于耐心细致地安抚工作。保障成本更低，维持关系所需投入更少，而王国军队则加紧部署，以确保这一承诺切实可信。"
 SIA_protector_of_asean: "东盟监护者"
 SIA_protector_of_asean_desc: "泰国选择了监护者而非征服者的角色。通过将安全保护伞延伸至整个东南亚，王国赢得了邻国的信任，并确立了地区大国的地位。一支常驻外交使团如今同时向多个东盟国家首都投射泰国的影响力，这得益于该角色所带来的稳定政治资本。外交更为经济，防御更为稳固，东盟的善意正源源不断地流向曼谷。"
 SIA_frontier_buffer_idea: "边境缓冲国"
 SIA_frontier_buffer_idea_desc: "掸族和克伦族在缅甸边境保持武装并维持友好关系，作为一道活体屏障。这既降低了保障成本，又稳固了边疆，还能在应对内比都方面的任何推进时占据防御优势。"
 SIA_shan_campaign: "掸邦战役"
 SIA_shan_campaign_desc: "军队已动员并准备对南掸邦展开行动，在战役期间对掸邦军队享有战斗加成。"
 SIA_karen_campaign: "克伦战役"
 SIA_karen_campaign_desc: "军队已动员并准备向克伦山区推进，在战役期间对克伦军队享有战斗加成。"
 SIA_wa_campaign: "佤邦战役"
 SIA_wa_campaign_desc: "军队已动员并准备向佤邦山区推进，在战役期间对佤邦军队享有战斗加成。"
 SIA_us_mech_standard: "北约标准机械化"
 SIA_us_mech_standard_desc: "美式学说与西方载具带来了卓越的组织度、侦察能力与战场可靠性，而其代价则体现在国防预算之中。"
 SIA_reliability_woes: "可靠性问题"
 SIA_reliability_woes_desc: "廉价的量产带来了廉价的支援。变速箱故障和备件积压会不断削弱士气和装备可靠性，直到编队整顿完毕。"
 SIA_chd620_teething: "引擎磨合问题"
 SIA_chd620_teething_desc: "中国产替代动力装置运行过热且未经充分验证。在问题解决之前，船只速度较慢，船员信心不足。"
 SIA_bamboo_doctrine: "竹子外交"
 SIA_bamboo_doctrine_desc: "与所有国家友好，不欠任何国家情分。外交灵活，广结善缘，并享受一个拒绝选边站的国家所拥有的国内稳定。"
 SIA_loyal_opposition: "忠诚的反对派"
 SIA_loyal_opposition_desc: "无论胜负，政党长存。这是一个拥有百年历史、扎根于各省的组织，其核心选民基础稳固，不随政治风向摇摆。它是泰国政治中最稳定的支持群体，也是任何对立运动——无论是民粹派还是宫廷派——都难以撬动的堡垒。"
 SIA_democratic_institutionalism: "民主宪政主义"
 SIA_democratic_institutionalism_desc: "规则如今比统治者更持久。独立的法院、运作的议会、专业化的政府部门，以及期待权力通过选票更迭的公众。泰国的民主已从一时之风转变为一种体制，并且能够抵御来自街头、王宫或军营的攫取。"
 SIA_pt_tier_dormant: "民粹浪潮受控"
 SIA_pt_tier_dormant_desc: "目前，农村选票仍然稳固，民主党得以和平执政。但他信的机器从未真正沉睡。在北部和东北部，旧有的忠诚仍在等待时机，一旦执政党显得松懈，便会即刻集结。通过选区机器保持领先，这股浪潮便会继续平静下去。\n\n§Y民粹浪潮§!：[?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_pt_tier_rising: "民粹浪潮兴起"
 SIA_pt_tier_rising_desc: "东北地区再次红旗招展。他信的机器正在壮大，而一个无法应对此局面的政府就已与等待被投票下台的看守内阁无异了。\n\n§Y民粹浪潮§!：[?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_red_shirt_encampment: "拉差巴颂街垒"
 SIA_red_shirt_crackdown: "拉差巴颂镇压"
 SIA_red_shirt_encampment_desc: "数以万计的红衫军以竹竿和轮胎筑起路障，占据曼谷市中心商业区。商场关门，办公室空无一人，商务区已陷入瘫痪。政府选择按兵不动，静待其变。"
 SIA_red_shirt_crackdown_desc: "军队用实弹清除了路口。路障与占领者被扫除一空，但建筑被烧毁，警察的开销比以前更高，而且全国都在电视上看到士兵向平民开枪。"
 SIA_pt_tier_surge: "民粹浪潮即将到来"
 SIA_pt_tier_surge_desc: "民调结果一败涂地已成定局。红衫军正议论着进军曼谷，而一个任由浪潮涨至顶点的政府即将得知民粹分子们的决心。\n\n§Y民粹浪潮§!：[?ROOT.SIA_pheu_thai_pressure|0]/100"
 SIA_thaksin_ascendant: "泰爱泰党崛起"
 SIA_thaksin_ascendant_desc: "1997年的经济危机瓦解了旧政党，他信·钦那瓦凭借电信业的巨额财富、一支训练有素的政治机器以及北部和东北部乡村地区一代人期盼已久的承诺，填补了权力真空：廉价医疗、债务减免以及为每个村庄设立发展基金。随着时间的推移，农村选民逐渐聚集在他的泰爱泰党周围，而川的民主党则岌岌可危。\n\n每个月，泰爱泰党和更广泛的不结盟联盟都会从建制派选民那里获得约 2% 的支持，直到 2001 年的重新结盟才解决了这个问题。\n\n§Y距离清算之日还有数月§!：[?ROOT.SIA_thaksin_rise_months|0]/12"
 SIA_broad_coalition_idea: "广泛联盟"
 SIA_broad_coalition_idea_desc: "各部交给了小党派和各省大佬，以换取议会的防火墙。广泛而稳定，但每一项决策都是一场谈判，内阁的推进速度取决于最不情愿的合作伙伴。这笔交易的有效期为一年。"
 SIA_mekong_soft_power_idea: "湄公软实力"
 SIA_mekong_soft_power_idea_desc: "泰国银行、承包商和广播公司正将曼谷的影响力沿湄公河向上游延伸。在周边地区声音更加响亮，外交实力更加充实，可投入争取盟友的力量也更强大。"
 SIA_occupation_administration: "占领当局"
 SIA_occupation_administration_desc: "军事总督、移民安置委员会和重建办公室现在管理着被征服的省份。服从度提升更快，武装抵抗被镇压，整合的道路与铁路建设也更为迅速。这是维持军队所夺取之地的统治机器。"
 SIA_deep_south_category: "泰南三府"
 SIA_deep_south_category_desc: "也拉、北大年和那拉提瓦三府的马来-穆斯林省份正处于叛乱之中。镇压、发展和对话各有其拥护者，也各有其代价。\n§Y叛乱强度§!（0-100）表示南部叛乱的烈度。强度越高，每周发生的致命事件就越频繁，对南方的拖累也越重。武力、发展和对话可将其压低；暴行和忽视则会将其推高。铁腕政策会留下一个永久性的§Y积怨底线§!，叛乱强度永远无法降至该底线以下。\n\n§Y叛乱强度§!：[?ROOT.SIA_insurgency_intensity|0]%  \n§Y积怨底线§!：[?ROOT.SIA_ds_intensity_floor|0]%"
 SIA_greater_thailand_category: "大泰国"
 SIA_greater_thailand_category_desc: "失地收复计划。民兵、宣称以及收复领土的整合。"
 SIA_ds_security_operations: "安全清查"
 SIA_ds_security_operations_desc: "对南部的封锁搜索行动。行动期间秩序得以改善。至于这些行动是终结叛乱还是助长叛乱，每份战后报告中都争论不休。"
 SIA_ds_development_fund: "南方开发基金"
 SIA_ds_development_fund_desc: "全国最贫困省份的道路、学校和就业机会。比士兵更慢，比战争更廉价。"
 SIA_ds_emergency_decree: "紧急法令"
 SIA_ds_emergency_decree_desc: "南方安全部队的特别权力。无限期拘留、豁免条款、宵禁。有效，且腐蚀人心。"
 SIA_ds_peace_dialogue: "开启和平对话"
 SIA_ds_peace_dialogue_desc: "在马来西亚的斡旋下，授权与分离主义运动进行正式会谈。与其对话即承认其存在。但这同时也是这场冲突唯一能在谈判桌上终结的途径。"
 SIA_arm_shan_militias: "武装掸邦民兵"
 SIA_arm_shan_militias_desc: "安静地通过缅甸边境向掸邦军队提供补给。每一支运输队都在为掸邦的未来买下影响力。"
 SIA_shan_client_state: "赞助掸邦"
 SIA_shan_client_state_desc: "承认并支持一个与曼谷结盟的掸邦。我们的兄弟得到稳固统治，而我们得到效忠。"
 SIA_integrate_shan: "整合掸邦"
 SIA_integrate_shan_desc: "将泰国的行政体系扩展至掸邦高原，引入行政长官、学校以及泰铢。在曼谷巩固控制之前，必须充分安抚当地民众。"
 SIA_integrate_laos: "整合老挝领土"
 SIA_integrate_laos_desc: "将泰国的行政体系扩展至所宣称的老挝领土。在核心地区实现高顺从度和低抵抗后方可进行正式整合。"
 SIA_integrate_cambodia: "整合高棉领土"
 SIA_integrate_cambodia_desc: "将泰国的行政体系扩展至马德望和暹粒，如1941-1946年故事。高棉民众必须接受泰国治理，方可实施正式行政管理。"
 SIA_integrate_malaya: "整合南部诸府"
 SIA_integrate_malaya_desc: "将泰国的行政体系扩展至1909年割让的前苏丹国地区。在正式吞并之前，必须使当地人口牢牢置于曼谷的影响之下，方可完成整合。"
 SIA_cost_1_0: "£treasury 1.0"
 SIA_cost_1_5: "£treasury 1.5"
 SIA_thaksinite_party_governs_tt: "§Y[neutral_Social_L]§!是执政党。"
 SIA_cost_2_0: "£treasury 2.0"
 SIA_cost_2_0_blocked: "£treasury 2.0§R(不足)§!"
 SIA_otpc_education_strain: "“每个孩子一台平板”计划"
 SIA_otpc_education_strain_desc: "充电器、损坏件、替换设备，以及无人核算的培训预算——教育部正在消化这一计划的真实成本。"
 SIA_packed_senate: "忠诚参议院"
 SIA_packed_senate_desc: "上议院的忠诚派和独立机构。目前，政府的立法顺利通过。"
 SIA_cost_5_0: "£treasury 5.0"
 SIA_economy_category: "泰国战略与经济决策"
 SIA_economy_category_desc: "旅游业、医药、制造业、军备以及大型项目，再加上东盟外交和高层战略的杠杆。当国库和内阁能够腾出资源时，泰国国家机器会对投资和政治资本作出响应。"
 SIA_ds_hearts_and_minds: "全心全意"
 SIA_ds_hearts_and_minds_desc: "马来语教育、宗教外联、补偿委员会和村庄调解员。没有人为此举行游行，但事件地图变得更加平静。"
 SIA_contain_the_crisis: "遏制危机"
 SIA_contain_the_crisis_desc: "泰南地区已沸腾。我们需要在六个月内将叛乱强度压回沸点以下，否则暴力将升级，稳定性和合法性的代价将不断攀升。"
 SIA_choose_a_path: "选择一项南方政策"
 SIA_choose_a_path_desc: "危机正在发酵，政府拥有明确的政治授权，但尚未承诺任何南方战略。危机正在发酵，而政府虽握有明确的政治授权，却尚未确立任何南方战略。必须在一年之内锁定一条路线（武力、王室开发或对话），否则放任自流将使王国付出沉重代价。年内锁定一条路线（武力、王室发展或对话），否则放任自流将让王国付出沉重代价。"
 SIA_medical_tourism_campaign: "医疗旅游宣传活动"
 SIA_medical_tourism_campaign_desc: "向全球推销泰国医院，以远低于西方的价格提供手术与康复服务，还附带海滩。只要病房能承受住负荷，这场宣传活动便能自给自足。"
 SIA_eec_investment_phase: "东部走廊投资阶段"
 SIA_eec_investment_phase_desc: "拨付下一批东部经济走廊资金，用于东部各省的土地清理、公用事业、港口和铁路工程。"
 SIA_cost_3_0: "£treasury 3.0"
 SIA_cost_4_0: "£treasury 4.0"
