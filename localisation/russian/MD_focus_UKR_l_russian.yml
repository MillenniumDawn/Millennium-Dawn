 UKR_repair_slots_expand_desc: "\n\n\n\n\n\n£UKR_desctext_strategic_aviation_narp\n\n\n\n\n\n\n\n\nВыделить средства на дополнительные сборочные линии НАРП, чтобы увеличить число одновременно ремонтируемых самолётов на §C1§!, но не более §C6§!."
