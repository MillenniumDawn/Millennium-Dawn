 weap_mp_light_hardpoint_1: "Лёгкая точка подвески 1-го поколения"
 weap_mp_light_hardpoint_1_desc: "Лёгкие узлы подвески предназначены для того, чтобы самолёт мог нести некоторое вооружение, но в ограниченном количестве. Эти узлы подвески дешевы и используются либо для оснащения лёгких самолётов минимальным набором вооружения, либо для дополнения боевой нагрузки других самолётов. На таких узлах подвески размещаются ракеты «воздух-воздух» малой дальности, бомбы массой 250-500 фунтов и блоки неуправляемых ракет.\n\n§GПодсказка дизайнера: Эти точки подвески позволяют странам с ограниченным бюджетом вооружать самолёты смешанной нагрузкой, а производителям лёгких самолётов — вооружать их дешевле и легче.§!\n\n§WИспользование этого узла в качестве основного вооружения создаст§! §Bмногоцелевой истребитель§!\n\n§RПРЕДУПРЕЖДЕНИЕ: палубные многоцелевые истребители будут атаковать в морском бою только вражеские корабли§!"
 weap_mp_light_hardpoint_2: "Лёгкая точка подвески 2-го поколения"
 weap_mp_light_hardpoint_2_desc: "$weap_mp_light_hardpoint_1_desc$"
