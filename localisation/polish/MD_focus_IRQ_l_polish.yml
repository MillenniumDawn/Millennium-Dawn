 iraqi_MNF.13.d: "After weeks of being on the run, Abid Hamid Mahmud was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.13.a: "Dobrze"
 iraqi_MNF.14.t: "'Chemical Ali' Captured!"
 iraqi_MNF.14.d: "After weeks of being on the run, Ali Hassan al-Majid, AKA 'Chemical Ali' was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.14.a: "Dobrze"
