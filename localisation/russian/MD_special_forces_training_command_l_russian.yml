 MD_sftc_fully_upgraded: "Полностью улучшено"
 MD_sftc_exercise_ranger: "Отборочные учения рейнджеров"
 MD_sftc_exercise_ranger_desc: "Рейнджеры проходят курс отбора и оценки, построенный вокруг дальних патрулей, ориентирования и тактики малых подразделений в условиях длительной усталости."
 MD_sftc_ex_ranger_short: "Освоение направления «Специальный полк рейнджеров» на 90 дней."
 MD_sftc_exercise_marine: "Учения по морскому рейду"
 MD_sftc_exercise_marine_desc: "Специальные отряды морской пехоты отрабатывают рейды с моря на надводных и малых катерах против обороняемого побережья."
 MD_sftc_ex_marine_short: "Освоение направления «Специальные силы морской пехоты» на 90 дней."
 MD_sftc_exercise_airborne: "Учения по воздушной заброске"
 MD_sftc_exercise_airborne_desc: "Воздушно-десантные роты отрабатывают ночную заброску парашютным и посадочным способом с транспортных самолётов, затем собираются и выдвигаются к своим целям."
 MD_sftc_ex_airborne_short: "Освоение направления «Воздушно-десантные роты» на 90 дней."
 MD_sftc_exercise_joint: "Совместные учения специальных операций"
 MD_sftc_exercise_joint_desc: "Отряды рейнджеров, морской пехоты и десантников тренируются под единым штабом специальных операций и отрабатывают общий сценарий на суше, на море и в воздухе."
 MD_sftc_ex_joint_short: "Освоение направления «Специальные операции» на 90 дней."
 MD_sftc_exercise_air_assault: "Аэромобильный рейд"
 MD_sftc_exercise_air_assault_desc: "Рейнджеры перебрасываются вертолётами и транспортными самолётами, чтобы захватить объект в тылу противника, удержать его и отойти под прикрытием авиации."
 MD_sftc_ex_air_assault_short: "Освоение направления «Дополнительные силы специального назначения» на 90 дней."
 MD_sftc_exercise_littoral: "Прибрежные учения рейнджеров"
 MD_sftc_exercise_littoral_desc: "Рейнджеры учатся действовать с моря на прибрежных подступах, реках и островах, используя катера и поддержку корабельной артиллерии для выхода к целям вглубь суши."
 MD_sftc_ex_littoral_short: "Освоение направления «Дополнительные силы специального назначения» на 90 дней."
 MD_sftc_exercise_envelopment: "Учения по вертикальному охвату"
 MD_sftc_exercise_envelopment_desc: "Морская пехота и воздушно-десантные роты одновременно наносят удар по одному объекту с моря и с воздуха, чтобы распылить резервы обороняющегося."
 MD_sftc_ex_envelopment_short: "Освоение направления «Дополнительные силы специального назначения» на 90 дней."
 MD_sftc_school_name: "Программа подготовки специальных операций"
 MD_sftc_school_short: "Открывает школу специальных операций, усиливает учения."
 MD_sftc_school_level_text: "Уровень [?ROOT.MD_sftc_school_level|0]/3"
 MD_sftc_insertion_name: "Программа экспедиционной заброски"
 MD_sftc_insertion_short: "Открывает готовность к заброске."
 MD_sftc_insertion_level_text: "Уровень [?ROOT.MD_sftc_insertion_level|0]/3"
 MD_sftc_command_name: "Программа командования специальных операций"
 MD_sftc_command_short: "Открывает командование специальных операций."
 MD_sftc_command_level_text: "Уровень [?ROOT.MD_sftc_command_level|0]/3"
 MD_sftc_qualification_name: "Квалификационный курс спецназа"
 MD_sftc_qualification_short: "Один командир сухопутных войск может получить черту спецназа."
 MD_sftc_qualification_cooldown: "Идёт квалификационный курс спецназа"
 MD_sftc_qualification_cooldown_desc: "Отобранные офицеры проходят квалификацию спецназа. Следующий курс начнётся после выпуска нынешнего."
 MD_sftc_joint_course_name: "Совместный курс специальных операций"
 MD_sftc_joint_course_short: "Все командиры спецназа получают опыт."
 MD_sftc_joint_course_cooldown: "Идёт совместный курс специальных операций"
 MD_sftc_joint_course_cooldown_desc: "Офицеры спецназа всех видов войск проходят совместное обучение на курсе специальных операций. Новый курс можно начать после выпуска этого."
 MD_sftc_school_1: "Школа специальных операций I"
 MD_sftc_school_1_desc: "Постоянная школа специальных операций отбирает и готовит кандидатов, унифицирует тактику и сокращает время на формирование новых подразделений спецназа."
 MD_sftc_school_2: "Школа специальных операций II"
 MD_sftc_school_2_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_school_3: "Школа специальных операций III"
 MD_sftc_school_3_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_insertion_1: "Готовность к заброске I"
 MD_sftc_insertion_1_desc: "Постоянные процедуры и выделенные транспортные средства держат спецназ в готовности к переброске морем и воздухом в кратчайшие сроки."
 MD_sftc_insertion_2: "Готовность к заброске II"
 MD_sftc_insertion_2_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_insertion_3: "Готовность к заброске III"
 MD_sftc_insertion_3_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_command_1: "Командование специальных операций I"
 MD_sftc_command_1_desc: "Единое командование специальных операций планирует и контролирует операции всех видов войск, обеспечивая передовым подразделениям надёжную поддержку и ясные полномочия."
 MD_sftc_command_2: "Командование специальных операций II"
 MD_sftc_command_2_desc: "$MD_sftc_command_1_desc$"
 MD_sftc_command_3: "Командование специальных операций III"
 MD_sftc_command_3_desc: "$MD_sftc_command_1_desc$"
 MD_sftc_tt_fully_upgraded: "§GПолностью улучшено§!"
 MD_sftc_tt_mastery_0_5: "§G+0.5§!"
 MD_sftc_tt_mastery_0_75: "§G+0.75§!"
