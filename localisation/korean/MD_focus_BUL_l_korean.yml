 bulg.1.e: "거절"
 BUL_german_investment_tt: "독일이 불가리아에 §Y$industrial_complex$§!, §Y$arms_factory$§! 또는 §Y$offices$§! 중 하나에 자금을 지원하기로 선택하며, 각각 §Y$fossil_powerplant$§!이(가) 딸려 있습니다"
 BUL_integrate_conquered_state: "[FROM.GetName] 통합"
 BUL_integrate_conquered_state_compliance_tt: "해당 주의 순응도가 80% 이상"
 BUL_gold_mining_revenue: "첼로페치 및 크루모브그라드 금광"
 BUL_gold_mining_revenue_desc: "던디 프레셔스 메탈스는 첼로페치와 크루모브그라드에서 불가리아의 두 대형 금광을 운영하고 있습니다. 이곳의 정광은 아우루비스의 구리 생산물과 함께 가공되어 국가에 안정적인 수출 수익을 안겨 줍니다."
 BUL_gold_mining_revenue_tt: "매년 §G$0.30B§!의 수익을 창출합니다"
 bulg.33.t: "새 이름으로 뭉친 공산주의자들"
 bulg.33.desc: "불가리아 공산당 '게오르기 디미트로프'는 소규모 공산주의 단체들과 합당하여 불가리아 공산주의자당이라는 이름을 채택했습니다. 이 정당은 마르크스-레닌주의 강령과 불가리아 사회당의 사회민주주의 노선에 대한 반대를 유지합니다."
 bulg.33.a: "오랜 대의를 위한 새 이름"
 bulg.34.t: "당명을 변경한 NDSV"
 bulg.34.desc: "시메온 2세 민족운동은 NDSV라는 약칭을 유지하면서 당명을 안정과 진보를 위한 민족운동으로 바꿨습니다. 이 정당은 새 이름이 시메온 작스코부르크고츠키의 개인적 수단이 아니라 집권을 추구하는 자유주의 정당이라는 정체성을 반영한다고 말합니다."
 bulg.34.a: "같은 약칭, 새 이름"
 bulg.35.t: "녹색운동이 된 녹색당"
 bulg.35.desc: "법원이 다른 정당에 '녹색당'이라는 이름을 인정함에 따라, 불가리아의 주요 환경주의 정당은 녹색운동으로 당명을 바꿨습니다. 이 정당은 유럽 녹색당과 민주 불가리아 연합의 일원으로 남아 있습니다."
 bulg.35.a: "운동은 계속된다"
 bulg.36.t: "DPS의 분열"
 bulg.36.desc: "권리와 자유 운동은 창립자 아흐메드 도간의 지지자들과 공동 의장 델리안 페옙스키의 지지자들로 분열되었습니다. 법원은 정당의 이름과 등록을 페옙스키 계파에 부여했으며, 이 계파는 'DPS - 새로운 시작'으로 활동하는 반면 도간의 지지자들은 탈당하여 권리와 자유 동맹을 결성합니다."
 bulg.36.a: "운동이 분열되었다"
