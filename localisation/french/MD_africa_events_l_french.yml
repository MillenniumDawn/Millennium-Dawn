 AFRICA_adopt_the_cfa_franc: "Adoptez le franc CFA"
 AFRICA_adopt_the_cfa_franc_desc: "Le franc CFA assure la stabilité monétaire et facilite les échanges commerciaux avec la France et les autres pays francophones. Son adoption nous permet de bénéficier de la garantie du Trésor français et de nous intégrer plus étroitement à la communauté économique francophone."
 central_africa.27.t: "Union pour le renouveau centrafricain"
 central_africa.27.d: "Les divers courants libéraux de la politique centrafricaine se sont regroupés en un seul mouvement. Ralliée derrière Anicet-Georges Dologuélé, l'Union pour le renouveau centrafricain se positionne comme le visage moderne et pro-occidental du néolibéralisme du pays, à l'approche de sa candidature à la présidence."
 central_africa.27.a: "Un nouveau visage pour le libéralisme"
