  # Training failure events
 border_war_training_failure.1.t: "Failure During Military Training"
 border_war_training_failure.1.d: "During recent military exercises there was an accident that left several soldiers wounded and now people demand answers."
 border_war_training_failure.1.a: "Unfortunate"
 border_war_training_failure.2.t: "Incident During Combined Arms Training"
 border_war_training_failure.2.d: "During recent military exercises there was an accident that left several soldiers wounded and some equipment damaged."
 border_war_training_failure.2.a: "So is the nature of things."

  # Tension failure event
 border_war_tension_failure.1.t: "Failed Attack Simulation"
 border_war_tension_failure.1.d: "During recent feint maneuvers we were shelled by an unknown opponent. The exact reasoning could not be determined and many uneasy questions are being asked."
 border_war_tension_failure.1.a: "As bad as it gets."

  # Attack blocked
 border_war_attack_blocked.1.t: "Attack Overlaps With Active Border War"
 border_war_attack_blocked.1.d: "A border war is already underway over the contested state. We will need to wait for it to conclude before launching our own operation."
 border_war_attack_blocked.1.a: "Understood."

  # Border war outcomes
 border_war_outcome.1.t: "Successful Push"
 border_war_outcome.1.d: "Our forces have secured a victory in the latest clash along the contested frontier, gaining ground against the enemy."
 border_war_outcome.1.a: "As planned."
 border_war_outcome.2.t: "Unsuccessful Push"
 border_war_outcome.2.d: "The enemy repelled our attack along the contested frontier, and our forces have fallen back to the line of departure."
 border_war_outcome.2.a: "A minor setback."
 border_war_outcome.3.t: "Stalemate After the Attack"
 border_war_outcome.3.d: "The latest attack along the contested frontier ended in stalemate, with neither side gaining ground."
 border_war_outcome.3.a: "Unfortunate."

  # Post-capture: PAK vs RAJ
 border_war_post_capture.1.t: "A Border District Falls"
 border_war_post_capture.1.desc: "After weeks of skirmishing our position along the frontier has collapsed, and the enemy now controls the contested district outright. Public anger is mounting and we must decide how to respond."
 border_war_post_capture.1.a: "Let them have it."
 border_war_post_capture.1.b: "Prepare to escalate"
 border_war_post_capture.1.c: "Demand war reparations"
 border_war_post_capture.1.d: "Fortify the remaining border"

  # Post-capture: CHI vs RAJ
 border_war_post_capture.2.t: "The Line of Actual Control Shifts"
 border_war_post_capture.2.desc: "After weeks of skirmishing high in the mountains our position along the Line of Actual Control has collapsed, and the enemy now controls the contested district outright. Public anger is mounting and we must decide how to respond."
 border_war_post_capture.2.a: "Let them have it."
 border_war_post_capture.2.b: "Prepare a limited response"
 border_war_post_capture.2.c: "Demand war reparations"
 border_war_post_capture.2.d: "Fortify the remaining border"

  # PAK-RAJ crisis ladder
 border_war_crisis.1.t: "Border Crisis Erupts"
 border_war_crisis.1.d: "Clashes along the frontier have hardened into an open crisis. World attention is turning to the border and we must decide how far to push it."
 border_war_crisis.1.a: "Escalate the standoff"
 border_war_crisis.1.b: "Stand down quietly"
 border_war_crisis.2.t: "Rival Considers Its Response"
 border_war_crisis.2.d: "Our rival has escalated the border standoff, and we must decide whether to match them or seek a way out."
 border_war_crisis.2.a: "Counter-mobilize"
 border_war_crisis.2.b: "Seek talks instead"
 border_war_crisis.3.t: "An Ultimatum Arrives"
 border_war_crisis.3.d_withdraw: "Our rival has issued an ultimatum demanding we withdraw from the territory we hold, backed by the threat of a limited war."
 border_war_crisis.3.d_standdown: "Our rival has issued an ultimatum demanding we stand down from the border crisis entirely, backed by the threat of a limited war."
 border_war_crisis.3.a: "Accept the ultimatum and withdraw"
 border_war_crisis.3.b: "Reject the ultimatum"
 border_war_crisis.4.t: "The Ultimatum Is Rejected"
 border_war_crisis.4.d: "Our rival has rejected our ultimatum outright. We must decide whether to make good on our threat or back down."
 border_war_crisis.4.a: "Force the issue"
 border_war_crisis.4.b: "Back down"
 border_war_crisis.5.t: "A Dangerous Signal"
 border_war_crisis.5.d: "Our military staff propose a visible nuclear readiness posture to underline our resolve in the crisis."
 border_war_crisis.5.a: "Match the pressure, visibly"
 border_war_crisis.5.b: "Maintain restraint"
 border_war_crisis.6.t: "The Rival Responds"
 border_war_crisis.6.d: "Our rival has raised its own nuclear readiness in response to the crisis, and we must decide how to answer."
 border_war_crisis.6.a: "Respond in kind"
 border_war_crisis.6.b: "De-escalate unilaterally"
 border_war_crisis.7.t: "An Offer to Mediate"
 border_war_crisis.7.d: "The border crisis between India and Pakistan has drawn international concern. Our diplomats propose we step in."
 border_war_crisis.7.a: "Offer to mediate"
 border_war_crisis.7.b: "Stay out of it"
 border_war_crisis.8.t: "A Mediation Proposal"
 border_war_crisis.8.d: "The United States has offered to broker a climbdown from the border crisis. We must decide whether to accept."
 border_war_crisis.8.a: "Accept the American proposal"
 border_war_crisis.8.b: "Reject outside interference"
 border_war_crisis.9.t: "The Crisis Passes"
 border_war_crisis.9.d: "The border crisis has run its course without escalating into open war. Tensions along the frontier are easing."
 border_war_crisis.9.a: "Acknowledged."
 border_war_crisis.10.t: "A Diplomatic Triumph"
 border_war_crisis.10.d: "Our rival has backed down and withdrawn from the territory in question, ending the crisis on our terms."
 border_war_crisis.10.a: "A victory for our resolve."
