 RULE_OPTION_SECOND_COAL_WARS: "第二次煤炭战争"
 RULE_OPTION_SECOND_COAL_WARS_AI_DESC: "自由州拒绝了重组后的§8联合矿工工会§!重新开放西弗吉尼亚州煤矿的提议，煤矿区爆发骚乱，并宣布该州独立。第二次煤炭战争在阿巴拉契亚山脉开辟了新的战线。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 NEN_AI_BEHAVIOR: "@NEN 新英格兰"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION: "绿山叛乱"
 RULE_OPTION_GREEN_MOUNTAIN_REBELLION_AI_DESC: "联邦政府拒绝了佛蒙特州将政府所在地迁至蒙彼利埃的要求，任由不满情绪滋长。§8绿山§!国兴起，新英格兰不得不镇压其境内一个州的叛乱。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL: "另一座新首都"
 RULE_OPTION_THE_OTHER_NEW_CAPITAL_AI_DESC: "首都几乎没人会为了地址争吵，所以政府满足了佛蒙特州的要求，迁往蒙彼利埃。新英格兰地区在这场争端中分文未花，也让北部各州感到满意。§R而这条道路只有在美国的统治被设定为后联合时代或大崩溃时才会存在§!。"
 RULE_ALLOW_CONDITIONAL_PEACE_DEAL: "允许有条件的和平协议"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_YES_DESC: "将允许处于战争状态的国家使用§Y有条件的和平协议§!脚本化的外交行动，让各国签署不需要任何一方完全屈服的和平协议。"
 RULE_OPTION_CONDITIONAL_PEACE_DEAL_NO_DESC: "禁止各国使用§Y有条件的和平协议§!脚本化的外交行动，这种行动将迫使各国忍受全面战争以达到和平状态。"
