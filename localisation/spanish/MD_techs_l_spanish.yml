 module_sonar_8: "Sonar VIII"
 module_sonar_8_desc: "La tecnología de sonar hiperavanzada combina detección de alcance extremo, priorización de amenazas en tiempo real y una reducción avanzada de ruido, representando la cúspide de las que las capacidades de detección submarina y guerra antisubmarina.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_sonar_9: "Sonar IX"
 module_sonar_9_desc: "La tecnología de sonar ultraavanzada combina detección de alcance extremo, priorización de amenazas en tiempo real y una reducción avanzada de ruido, representando la cúspide de las que las capacidades de detección submarina y guerra antisubmarina.\n\n§GConsejo de diseño: El sonar enfatiza la detección de submarinos al tiempo que mejora la detección de superficie, los misiles antibuque y el ataque de torpedos. Es una opción rentable para buques ASW, pero proporciona un apoyo de combate menos amplio que el radar.§!"
 module_naval_radar_jammer_6: "Inhibidor de radar naval VI"
 module_naval_radar_jammer_6_desc: "$module_naval_radar_jammer_1_desc$"
 module_surface_diesel_power_1_desc: "Los motores diésel mejorados ofrecen una mejor eficiencia de combustible y fiabilidad, lo que permite despliegues más prolongados y aumentos moderados de velocidad.\n\n§GConsejo de diseño: La propulsión diésel ofrece una velocidad y alcance máximo modestos a un bajo coste de producción. Es ideal para flotas costeras y regionales asequibles, pero incrementa el uso de combustible y la visibilidad de superficie.§!"
