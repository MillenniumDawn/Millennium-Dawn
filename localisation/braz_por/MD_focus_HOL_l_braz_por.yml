 HOL_Barracuda_Submarine_tt:0 "Estes Submarinos têm maior Alcance Naval"
 HOL_C71_Submarine_tt:0 "Estes Submarinos têm maior Ataque Antissubmarino"
 HOL_voc_saf_aids_support:0 "Campanha contra a AIDS em §Y[SAF.GetNameWithFlag]§!"
 faction_manifest_hol_germanic_union:0 "Nós, filhos e filhas do antigo Norte, declaramos o renascimento da Irmandade Germânica, uma união além das fronteiras, forjada em espírito e herança. Numa era de decadência sem raízes, erguemo-nos para restaurar a dignidade de nossos povos irmãos, unidos pela língua, pela cultura e pelo chamado eterno de nossos ancestrais. Rejeitamos a divisão, a corrupção e a fraqueza de impérios impostos. Nossa lealdade não está com as nações, mas com a essência duradoura da alma germânica. Dos fiordes às florestas, das planícies às montanhas, unimo-nos como uma só vontade viva para preservar, fortalecer e despertar o espírito que outrora moldou o destino da Europa."
 HOL_restoring_royal_authority_nationalist:0 "Restaurando a Autoridade Real"
 HOL_restoring_royal_authority_nationalist_desc:0 "O retorno da monarquia ao seu lugar de direito não veio sem desafios. A ineficiência burocrática e a instabilidade política afligem a nação, enquanto as instituições tradicionais lutam para reafirmar o controle. Ainda assim, com tempo e esforço, a autoridade real poderá restaurar a unidade e a força do Estado holandês."
 HOL_wic_war_preparations:0 "Reviver o Groot Desseyn"
 HOL_wic_war_preparations_desc:0 "Inspirados pelo Groot Desseyn, o ambicioso plano do século XVII para estabelecer a supremacia holandesa nas Américas e na África, devemos nos preparar para a guerra a fim de restaurar o legado da Companhia das Índias Ocidentais. Mobilizando nossas forças e assegurando territórios vitais, podemos realizar a visão do domínio global holandês e recuperar nosso lugar como potência marítima."
 HOL_wic_war_preparations_tt:0 "Será desbloqueado ao escolher a §YEstratégia Groot Desseyn§! para a §YWIC§!"
 HOL_focus_can_only_be_completed_by_coalition_tt:0 "Este foco só pode ser iniciado por §Y$CHARACTER$§! quando estiver em nossa coalizão"
 HOL_oranje_nassau-mines:0 "Reativar as Minas Oranje-Nassau"
 HOL_oranje_nassau-mines_desc:0 "As minas de carvão Oranje-Nassau, em Heerlen, foram as últimas minas de carvão holandesas, fechadas em 1974 como parte de uma transição energética nacional. Reabri-las restaura a matéria-prima doméstica para aço e alumínio, reduzindo a dependência de importações ao custo de maior exposição ao carbono."
 HOL_military.114.t:0 "Países Baixos Aderem ao Programa F-35"
 HOL_military.114.d:0 "Os Países Baixos comprometeram-se formalmente com o programa Joint Strike Fighter, adquirindo o F-35 Lightning II como seu caça multifunção de próxima geração. Isso aprofunda os laços de defesa transatlânticos e fortalece a interoperabilidade da OTAN."
 HOL_military.114.a:0 "Um parceiro bem-vindo no programa."
 HOL_military.115.t:0 "Aquisição Holandesa do F-35 em Andamento"
 HOL_military.115.d:0 "Os Países Baixos iniciaram negociações para a compra do F-35 Lightning II. Os prazos finais de entrega dependem do cronograma de desenvolvimento do programa, mas o compromisso marca um passo significativo na modernização da força aérea holandesa."
 HOL_military.115.a:0 "Prosseguiremos quando a aeronave estiver pronta."
 BEL_referendum_mission:0 "O Referendo Belga"
 BEL_referendum_mission_desc:0 "A Bélgica concordou em realizar um referendo sobre o futuro do país. O resultado determinará se a Bélgica permanece um Estado unificado ou se é absorvida pelos Países Baixos."
