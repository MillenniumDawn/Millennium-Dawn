 HOL_add_dutchaid: "네덜란드 원조 프로그램 수립"
 HOL_add_dutchaid_desc: "파트너 국가에 개발 원조를 제공하는 네덜란드 원조 프로그램을 개시합니다. WIC 네덜란드 원조 프로그램 중점의 완료와 충분한 경제 역량이 필요합니다."
 HOL_remove_dutchaid: "네덜란드 원조 프로그램 철회"
 HOL_remove_dutchaid_desc: "네덜란드 원조 프로그램을 단계적으로 축소하고 자원을 국내 우선 과제로 돌립니다."
 HOL_nonselfsufficient_army_emergency_tt: "\n§Y비상사태 해제 요건:§!\n - $arms_factory$ 15개 초과\n - $HOL_nonselfsufficient_army1$ 없음\n - 다음 항목의 비축량이 배치된 수량을 초과: $infantry_weapons_type$, $util_vehicle_type$, $cnc_equipment_type$, $artillery_equipment$, $medium_tank_amphibious_chassis$, $medium_tank_flame_chassis$, $medium_tank_chassis$"
 HOL_shell: "셸 지분 매입"
 HOL_shell_desc: "네덜란드에 본사를 둔 세계적인 에너지 기업 로열 더치 셸은 네덜란드 에너지 부문의 선도 기업입니다. 석유, 가스, 재생 에너지, 저탄소 기술을 아우르는 다양한 사업을 영위하는 셸은 에너지 전환을 주도하고 사회의 변화하는 요구에 부응하는 지속 가능한 해법을 제공하기 위해 노력하고 있습니다."
 HOL_green_shell: "셸의 친환경 전환"
 HOL_green_shell_desc: "셸은 지속 가능성과 재생 에너지에 힘쓰며 풍력, 태양광, 수소와 같은 보다 깨끗한 에너지원으로 전환하고 있습니다. 셸은 친환경 기술 투자, 혁신적인 해법, 저탄소 사업을 통해 에너지 전환을 이끌고 기후 변화 문제에 대응하며 보다 지속 가능한 미래에 기여하고자 합니다."
 HOL_blauwwind: "블라우빈트"
 HOL_blauwwind_desc: "블라우빈트는 여러 기업으로 구성된 컨소시엄이 개발한 다수의 풍력 단지로 이루어진 네덜란드 북해의 해상 풍력 사업입니다. 블라우빈트는 풍력 에너지를 활용하여 네덜란드의 재생 에너지 목표 달성을 지원하고, 탄소 배출을 줄이며, 환경적 지속 가능성을 증진하고자 합니다. 협력과 혁신을 통해 해상 풍력 발전 용량 확대와 청정 에너지 미래로의 전환에 기여합니다."
 HOL_porthos_project: "포르토스 프로젝트"
 HOL_porthos_project_desc: "포르토스 프로젝트는 로테르담 지역 산업 시설에서 발생하는 온실가스 배출을 줄이기 위한 탄소 포집 및 저장(CCS) 사업입니다. 이산화탄소 배출물을 포집하여 고갈된 해상 가스전에 저장함으로써, 포르토스는 기후 변화 완화 노력에 기여하는 한편 산업 탈탄소화와 지속 가능한 발전 목표를 뒷받침합니다."
 HOL_energy_transition_campus: "암스테르담 에너지 전환 캠퍼스"
 HOL_energy_transition_campus_desc: "암스테르담 에너지 전환 캠퍼스는 에너지 전환과 지속 가능성 분야의 연구, 혁신, 협력을 위한 거점 역할을 합니다. 산업계, 학계, 정부, 시민사회를 한데 모음으로써 이 캠퍼스는 학제 간 해법과 지식 교류, 기술 보급을 촉진하여 저탄소 및 회복력 있는 에너지 체계로의 전환을 가속합니다."
 HOL_hefa: "HEFA"
 HOL_hefa_desc: "수소화 처리 에스테르 및 지방산(HEFA)은 항공 부문의 탄소 배출을 줄이기 위한 재생 가능 항공유 기술입니다. 식물성 기름과 동물성 지방 같은 지속 가능한 원료를 대체 가능한 바이오 연료로 전환함으로써, HEFA는 항공사가 수익성을 유지하면서도 탄소 발자국을 줄이고 배출 감축 목표를 준수할 수 있도록 합니다."
 HOL_holland_hydrogen: "홀란드 수소 1"
 HOL_holland_hydrogen_desc: "홀란드 수소 1은 국가 에너지 전환 전략의 일환으로 네덜란드의 수소 기술 및 기반시설 발전에 주력합니다. 수소의 생산, 유통, 활용을 촉진함으로써, 홀란드 수소 1은 수소를 청정하고 다용도로 쓸 수 있는 에너지 매개체로 발전시켜 운송, 산업, 난방 등 여러 부문의 탈탄소화 노력을 뒷받침하고자 합니다."
 HOL_no_green_shell: "셸의 전문 분야"
 HOL_no_green_shell_desc: "셸은 석유와 천연가스 같은 비재생 에너지원의 탐사, 생산, 유통이라는 핵심 사업에 계속 전념합니다. 전통적인 화석 연료를 계속 중시하는 셸의 활동은 해상 시추, 정제, 석유화학 제품 생산을 아우릅니다. 재생 에너지에 대한 관심이 높아지고 있음에도 셸은 재래식 에너지 자원의 개발과 활용을 통해 세계 에너지 수요를 충족시킨다는 전략적 방향을 유지합니다."
 HOL_shell_energy_rotterdam: "셸 에너지 화학 단지"
 HOL_shell_energy_rotterdam_desc: "유로포르트에 위치한 셸 에너지 화학 단지 로테르담은 네덜란드 에너지 및 석유화학 생산의 주요 산업 거점입니다. 첨단 시설과 통합된 기반시설을 갖춘 이 단지는 석유 정제, 화학 제품 생산, 에너지 발전을 비롯한 다양한 사업을 뒷받침합니다. 네덜란드 경제의 초석인 이 단지는 지역 발전과 일자리 창출, 그리고 에너지 및 화학 부문의 혁신에 기여합니다."
 HOL_europoort_modernization: "유로포르트 현대화"
 HOL_europoort_modernization_desc: "유럽 최대 규모의 석유화학 단지 중 하나인 유로포르트는 효율성, 지속 가능성, 경쟁력을 높이기 위해 지속적인 현대화 노력을 기울이고 있습니다. 유로포르트는 기술 투자, 기반시설 개선, 공정 최적화를 통해 에너지 및 산업 활동의 선도 거점으로서의 위상을 유지하고, 로테르담 지역의 경제 성장과 환경 성과를 이끌고자 합니다."
 HOL_shell_moerdijk: "셸 화학 단지 무르데이크 확장"
 HOL_shell_moerdijk_desc: "무르데이크에 자리 잡은 셸 화학 단지는 네덜란드 화학 제품 생산과 혁신의 전략적 거점입니다. 최첨단 시설을 갖추고 지속 가능성에 주력하는 이 단지는 플라스틱, 용제, 특수 화학 제품 등 다양한 석유화학 제품을 생산합니다. 산업 파트너 및 연구 기관과의 협력을 통해 셸 화학 단지 무르데이크는 화학 부문의 기술 발전과 가치 창출을 이끕니다."
 HOL_borsele_choice: "보르설러 발전소의 선택"
 HOL_borsele_choice_desc: "보르설러 원자로의 미래는 기로에 서 있습니다. 지속 가능하고 안정적인 에너지원에 대한 수요가 늘어남에 따라, 원자로의 용량을 확대할 것인지 아니면 최첨단 청정 석탄 발전소로 개조할 것인지 결정해야 합니다. 각각의 길은 뚜렷한 이점과 과제를 안고 있으며, 네덜란드의 에너지 미래를 좌우할 것입니다."
 HOL_syngas_production: "합성가스 생산"
 HOL_syngas_production_desc: "합성가스 생산은 천연가스, 석탄, 바이오매스 같은 다양한 원료를 화학 합성과 에너지 생산에 쓰이는 다용도 중간 생성물인 합성가스(syngas)로 전환하는 과정입니다. 첨단 기술과 공정 혁신을 바탕으로 셸이 운영하는 시설과 같은 합성가스 생산 시설은 석유화학 제품, 비료, 연료의 원료를 공급하는 데 중요한 역할을 하며, 산업 발전과 에너지 전환 목표를 뒷받침합니다."
 HOL_solar_moerdijk: "솔라 무르데이크"
 HOL_solar_moerdijk_desc: "솔라 무르데이크는 네덜란드 무르데이크 산업 지구에 위치한 태양 에너지 사업입니다. 산업 시설 지붕과 유휴 부지에 태양광(PV) 패널을 설치함으로써, 솔라 무르데이크는 기존 기반시설을 활용하면서 재생 가능 전력을 생산하고, 탄소 배출을 줄이며, 에너지 회복력을 높이고, 지속 가능한 토지 이용 방식을 장려하고자 합니다."
 HOL_nam: "네덜란드 석유 회사(NAM) 설립"
 HOL_nam_desc: "네덜란드 석유 회사(NAM)는 네덜란드의 탄화수소 자원 탐사, 생산, 개발을 담당하는 네덜란드의 석유 및 가스 기업입니다. 육상과 해상 유전·가스전 모두에서 사업을 운영하는 NAM은 안전, 환경 관리, 규제 준수를 지키면서 국가의 에너지 수요를 충족하는 데 중추적인 역할을 합니다."
 HOL_nam_groningen: "NAM 흐로닝언"
 HOL_nam_groningen_desc: "네덜란드 북부에 위치한 흐로닝언은 유럽 최대 규모의 천연가스전 중 하나가 있는 곳입니다. 핵심 에너지 거점인 흐로닝언은 역사적으로 네덜란드의 가정과 산업에 가스를 공급하는 데 크게 기여했습니다. 그러나 최근 유발 지진과 환경 영향에 대한 우려로 가스 채굴이 점진적으로 줄어들고 있으며, 이는 지속 가능한 에너지 해법으로의 전환을 의미합니다."
 HOL_nam_waddenzee: "NAM 바덴해"
 HOL_nam_waddenzee_desc: "유네스코 세계유산인 바덴해는 네덜란드 북부의 석유 및 가스 탐사 잠재력을 지니고 있습니다. 환경 보전과 자원 개발의 균형을 맞추는 이 사업은 바덴해 지역의 에너지 매장량을 책임감 있게 개발하는 것을 목표로 합니다. 신중한 계획, 첨단 기술, 환경 보호 장치를 통해 이 독특한 해양 환경의 생태적 온전성을 지키면서 해상 에너지 자원을 활용하고자 합니다."
 HOL_nam_drenthe_oil: "NAM 드렌터"
 HOL_nam_drenthe_oil_desc: "드렌터 석유는 육상 유전으로 알려진 드렌터 주의 석유 자원 채굴 및 활용을 말합니다. 네덜란드 탄화수소 생산 포트폴리오의 일부인 드렌터 석유는 국내 에너지 수요를 충족하고 지역 경제를 뒷받침하는 역할을 하는 한편, 환경적 지속 가능성과 에너지 전환 전략에 대한 논의를 불러일으키기도 합니다."
 HOL_nam_rotterdam: "NAM 로테르담"
 HOL_nam_rotterdam_desc: "유럽 최대의 항구이자 산업 거점인 로테르담은 네덜란드의 에너지 지형에서 핵심적인 역할을 합니다. 주요 운송 및 물류 중심지인 로테르담은 원유 수입, 정제 제품 수출, 석유화학 제품 생산의 관문 역할을 합니다. 도시의 전략적 위치, 방대한 기반시설, 혁신적인 사업 덕분에 로테르담은 세계 에너지 전환의 핵심 주체로 자리매김하고 있습니다."
 HOL_nam_pernis_refineries: "페르니스 정유소"
 HOL_nam_pernis_refineries_desc: "로열 더치 셸이 운영하는 페르니스 정유소는 로테르담 인근에 위치한 유럽 최대 규모의 정유 단지 중 하나입니다. 첨단 시설과 통합 석유화학 공장을 갖춘 페르니스는 원유를 연료, 윤활유, 화학 원료 등 다양한 정제 제품으로 가공하는 데 중요한 역할을 하며, 지역의 에너지 수요와 산업 발전을 뒷받침합니다."
 HOL_regio: "지역 경제"
 HOL_regio_desc: "란트스타트가 번영하는 동안에도 네덜란드 나머지 지역의 번영을 보장하는 것이 중요합니다. 더 다양한 지역에 투자하면 경제 성장의 균형이 맞춰지고 전국의 삶의 질이 향상될 것입니다."
 HOL_dutch_agriculture: "네덜란드 농업 투자"
 HOL_dutch_agriculture_desc: "네덜란드는 가장 효율적인 농업 국가 중 하나이자 세계 2위의 농산물 수출국으로 손꼽힙니다. 우리는 세계 선두를 유지하기 위해 이 부문에 투자해야 합니다."
 HOL_plantlab: "플랜트랩 설립"
 HOL_plantlab_desc: "플랜트랩은 수직 농업 솔루션을 전문으로 하는 네덜란드의 농업 기술 기업입니다. 수경 재배와 LED 조명을 비롯한 첨단 실내 농업 기술을 활용하여 플랜트랩은 식량 생산에 혁명을 일으키고, 통제된 환경에서 연중 고품질 작물을 재배할 수 있게 합니다. 지속 가능성과 자원 효율성에 주력하는 플랜트랩은 도시 농업과 회복력 있는 식량 체계의 발전에 기여합니다."
 HOL_kringlooplandbouw: "순환 농업"
 HOL_kringlooplandbouw_desc: "순환 농업은 물질의 순환이 닫혀 있는 지속 가능한 농업의 한 형태입니다. 이는 농업으로 한 지역에서 제거된 모든 물질이 그 지역으로 다시 돌아간다는 뜻입니다. 따라서 질산염과 같이 지역을 떠나는 물질의 양 역시 그 지역으로 되돌려야 합니다. 이용 가능한 자원을 최대한 효율적으로 사용하며, 농민들은 이러한 자원의 유출과 유입의 균형을 맞추려 노력합니다. 바헤닝언 대학교의 연구에 따르면, 순환 농업은 농사를 짓는 토지에서 나오는 질소 유출을 줄임으로써 지하수의 질산염 농도를 낮추는 결과를 가져옵니다."
 HOL_smart_dairy_farming: "스마트 낙농업"
 HOL_smart_dairy_farming_desc: "스마트 낙농업은 디지털 기술과 데이터 기반 해법을 활용하여 유제품 생산 공정을 최적화하고 농장 관리 방식을 개선합니다. 센서, 자동화, 예측 분석을 도입함으로써 스마트 낙농업은 동물 복지, 생산성, 환경적 지속 가능성을 높입니다. 효율성과 혁신에 주력하는 스마트 낙농업은 낙농가들이 합리적인 결정을 내리고 현대 농업 환경에서 운영상의 우수성을 달성할 수 있게 합니다."
 HOL_zero_dairy_farming: "무배출 낙농업 프로젝트"
 HOL_zero_dairy_farming_desc: "무배출 낙농업 프로젝트는 혁신적인 기술과 지속 가능한 방식을 통해 낙농 생산 과정의 온실가스 배출과 환경 영향을 줄이는 것을 목표로 합니다. 재생 에너지 시스템, 메탄 포집 기술, 탄소 격리 조치를 도입함으로써 이 프로젝트는 탄소 중립을 달성하고 기후 회복력 있는 영농 방식을 촉진하고자 합니다. 지속 가능성과 책임 있는 관리에 전념하는 무배출 낙농업 프로젝트는 더욱 친환경적이고 지속 가능한 낙농업의 길을 열어 갑니다."
 HOL_digital_agriculture: "디지털 농업 프로그램"
 HOL_digital_agriculture_desc: "농업 부문은 진화하고 있으며, 이제 디지털 시대로 끌어들일 때입니다. 디지털 농업 프로그램을 시행함으로써 우리는 농민들에게 정밀 농업, 데이터 분석, 스마트 관개 시스템과 같은 최첨단 기술을 갖추어 줄 것입니다. 이 사업은 농업 효율성을 높이고, 낭비를 줄이며, 지속 가능한 영농 방식을 촉진하는 것을 목표로 합니다. 농업의 미래는 디지털이며, 이 프로그램은 우리 농민들이 앞서 나가도록 보장할 것입니다."
 HOL_food_valley: "홀란드 푸드 밸리"
 HOL_food_valley_desc: "홀란드 푸드 밸리는 네덜란드의 선도적인 농식품 혁신 클러스터로, 기업, 연구 기관, 정부 기관을 한데 모아 식품 산업의 혁신과 협력을 이끌고 있습니다. 연구 개발, 기술 이전, 시장 접근에 주력하는 홀란드 푸드 밸리는 혁신적인 식품, 공정, 사업 모델의 개발과 도입을 가속하여 네덜란드를 농식품 혁신의 세계적 선두 주자로 자리매김하게 합니다."
 HOL_floating_farm_project: "수상 농장 프로젝트"
 HOL_floating_farm_project_desc: "2019년 로테르담의 메르베하번에 문을 연 수상 농장은 세계 최초의 수상 낙농장입니다. 이곳의 소들은 양조장 곡물 찌꺼기, 감자 껍질, 공원과 골프장에서 베어 낸 풀 등 도시에서 가져온 순환 폐기물 흐름을 먹고 자라며, 분뇨는 현장에서 재활용됩니다. 물 위에 뜨도록 지어진 이 플랫폼은 해수면 상승과 도시 토지 부족에 직면한 삼각주 국가에서 기후 적응형 수상 식량 생산을 시험하는 실험장 역할을 합니다."
 HOL_stedelijke_reststromen: "도시 잔여물 순환"
 HOL_stedelijke_reststromen_desc: "지방 자치 단체들은 도로변에서 벤 풀과 분리 수거한 가정 음식물 쓰레기를 인근 농장으로 보내며, 농장의 소화조는 이를 바이오가스로 전환하고 남은 소화 잔여물은 퇴비로 농지에 환원됩니다. 이러한 체계는 도시와 주변 농촌 사이의 영양분 및 에너지 순환을 완결합니다."
 HOL_boeren_en_gemeenschap: "농민과 지역 사회"
 HOL_boeren_en_gemeenschap_desc: "도시에서 흘러나오는 자원에 대한 보답으로 농민들은 지역 스포츠 클럽과 마을 협회를 후원합니다. 이는 농촌 경제와 지역 사회 생활 사이의 유대를 깊게 하고 농업 부문에 대한 지지를 강화합니다."
 HOL_enpower_gedeputeerde_staten: "주 정부 위원회 권한 강화"
 HOL_enpower_gedeputeerde_staten_desc: "지방 정부(주 정부 위원회)의 자율성과 자원을 늘리면 더욱 맞춤형이고 효과적인 지역 정책을 펼 수 있습니다."
 HOL_lelystad_airport: "렐리스타트 공항 건설"
 HOL_lelystad_airport_desc: "렐리스타트 공항 확장 사업은 렐리스타트의 수용 능력을 늘리고 시설을 개선하여 스히폴 공항의 혼잡을 완화하는 것을 목표로 합니다. 여기에는 활주로 연장, 터미널 개선, 여객 서비스 향상이 포함됩니다. 이 사업은 플레보란트와 주변 지역의 지역 연결성, 관광, 경제 성장을 촉진할 것으로 기대됩니다."
 HOL_provincial_railways: "지방 철도 투자"
 HOL_provincial_railways_desc: "지방 철도 사업에는 지역 및 국경 간 연결성을 개선하기 위한 렐리레인, 분더라인, 3개국 열차와 같은 사업이 포함됩니다. 렐리레인은 북부 주들과 란트스타트를 잇는 고속 철도 노선을 제안합니다. 분더라인은 흐로닝언과 독일 브레멘 사이의 철도 서비스를 개선하며, 3개국 열차는 네덜란드, §Y[BEL.GetNameWithFlag]§!, 독일 사이의 철도 연결성을 개선합니다."
 HOL_eindhoven_brainport: "에인트호번 브레인포트"
 HOL_eindhoven_brainport_desc: "에인트호번 브레인포트 사업은 에인트호번을 선도적인 기술 및 혁신 거점으로 탈바꿈시킵니다. 첨단 산업을 육성하고 연구 기관을 지원하며 스타트업을 장려함으로써, 이 사업은 지역의 기술 발전과 경제 성장을 이끄는 것을 목표로 합니다."
 HOL_balanced_national_development: "균형 잡힌 국가 발전"
 HOL_balanced_national_development_desc: "지역이 이제 번영하고 있으므로, 우리는 균형 잡힌 국가 발전을 보장하고자 합니다. 란트스타트와 지역 간의 노력을 조율함으로써 전국에 걸쳐 지속 가능하고 공평한 성장을 달성할 것입니다. 여기에는 경제 활동과 기반시설 개발을 통합하기 위한 정책과 투자가 포함됩니다."
 HOL_diversify_groningen_economy: "흐로닝언 경제 다각화"
 HOL_diversify_groningen_economy_desc: "지진 위험으로 흐로닝언의 천연가스 채굴이 중단된 이후, 지역 경제를 다각화하는 데 노력이 집중되고 있습니다. 여기에는 재생 에너지, 기술 부문, 지속 가능한 농업에 대한 투자가 포함됩니다."
 HOL_landbouwregio: "21세기 농업 지역"
 HOL_landbouwregio_desc: "농업 지역을 21세기에 맞게 탈바꿈하려면 첨단 농업 기술과 지속 가능한 방식을 도입해야 합니다. 이 사업은 영농 기술을 현대화하고, 공급망 물류를 개선하며, 친환경적인 방식을 장려하는 데 주력합니다."
 HOL_health_houses: "건강의 집"
 HOL_health_houses_desc: "건강의 집 사업은 지역 전역에 통합 의료 센터를 설립하여 종합적인 의료 서비스를 제공하고 공중 보건을 증진하는 것을 목표로 합니다. 이 센터들은 1차 진료, 전문 치료, 건강 증진 프로그램을 한 곳에서 제공하여 의료 접근성을 높이고 주민들의 삶의 질을 향상시킬 것입니다."
 HOL_dutch_economic_landscape: "3대 축 경제"
 HOL_dutch_economic_landscape_desc: "네덜란드 경제는 국제 무역, 첨단 농업, 세계적으로 통합된 서비스 부문이라는 세 가지 핵심 축 위에 서 있습니다. 세계적 수준의 항만, 혁신적인 농업 관련 산업, 금융과 물류 분야의 지배적 위치를 바탕으로 네덜란드는 국토 규모를 훨씬 뛰어넘는 영향력을 발휘합니다. 이 균형 잡힌 모델은 성장과 회복력을 이끌지만, 세계적 혼란과 정치적 변화에는 여전히 민감합니다."
 HOL_randstad: "란트스타트"
 HOL_randstad_desc: "암스테르담, 로테르담, 헤이그, 위트레흐트와 같은 주요 도시로 이루어진 란트스타트는 네덜란드 경제의 원동력입니다. 기반시설과 사업 개발에 투자함으로써 우리는 란트스타트가 국가 경제 엔진으로서 수행하는 역할을 더욱 강화하고자 합니다."
 HOL_zuidas_development: "자위다스 개발"
 HOL_zuidas_development_desc: "암스테르담의 자위다스 지구는 핵심 금융 중심지입니다. 수용 능력을 확대하고 시설을 개선하면 더 많은 국제 기업을 유치하고 세계적인 금융 허브로서의 위상을 굳힐 수 있을 것입니다."
 HOL_randstad_rail: "란트스타트 레일"
 HOL_randstad_rail_desc: "란트스타트레일 사업은 효율적인 경전철 네트워크를 통해 헤이그, 로테르담, 조테르메이르를 연결합니다. 이 네트워크를 개선하면 지역 연결성이 향상될 것입니다."
 HOL_smart_city_initiative: "스마트 시티 구상"
 HOL_smart_city_initiative_desc: "란트스타트 전역에 스마트 시티 기술을 투자하면 우리 도시들이 더욱 효율적이고 지속 가능하며, 기업과 주민 모두에게 매력적인 곳이 될 것입니다."
 HOL_international_peace_city: "국제 평화와 정의의 도시"
 HOL_international_peace_city_desc: "헤이그가 가진 국제 평화와 정의의 도시라는 위상을 활용하여, 국제기구와 행사를 유치함으로써 외교 관계를 강화하고 세계적 영향력을 높일 것입니다."
 HOL_randpowerhouse: "란트파워하우스"
 HOL_randpowerhouse_desc: "수년간의 전략적 투자와 비전 있는 계획을 통해 란트스타트 지역은 네덜란드의 역동적인 경제 엔진인 '란트파워하우스'로 성공적으로 탈바꿈했습니다. 기반시설을 개선하고, 혁신을 촉진하며, 암스테르담, 로테르담, 헤이그, 위트레흐트 사이의 연결성을 높임으로써, 이 지역은 이제 상업, 문화, 기술 분야의 세계적 선두 주자로 우뚝 섰습니다. 이러한 변화는 란트스타트의 경제 생산량을 끌어올렸을 뿐 아니라 유럽 무대에서 네덜란드가 차지하는 핵심 주체로서의 위치를 공고히 하여, 국가 성장을 이끌고 도시 개발의 새로운 기준을 세웠습니다."
 HOL_dutch_industry: "네덜란드 산업"
 HOL_dutch_industry_desc: "네덜란드 산업은 여러 부문에 걸친 네덜란드의 혁신과 탁월함의 유산을 상징합니다. 지속 가능성, 기술, 세계적 경쟁력에 주력하는 네덜란드 산업은 경제 성장과 번영을 이끄는 최전선에 서 있습니다."
 HOL_postbank_fusion: "포스트방크-ING 합병"
 HOL_postbank_fusion_desc: "포스트방크와 ING의 합병은 두 주요 금융 기관을 하나의 기업으로 통합한 네덜란드 은행업 역사의 이정표입니다. 이 합병은 선도적인 글로벌 은행으로서 ING의 입지를 강화하며, 전 세계 고객에게 향상된 서비스와 금융 해법을 제공합니다."
 HOL_randstad_takeovers: "란트스타트 인수"
 HOL_randstad_takeovers_desc: "란트스타트 인수는 인력 공급 및 채용 업계에서 네덜란드 기업들이 보여 주는 전략적 확장과 세계적 야망을 드러냅니다. 시장의 핵심 기업들을 인수함으로써 란트스타트는 인적 자원 솔루션 분야의 세계적 선도 기업이라는 입지를 강화합니다."
 HOL_ing_group_strategy: "ING 그룹 확장 전략"
 HOL_ing_group_strategy_desc: "ING 그룹 전략은 금융 부문의 지속 가능한 성장과 디지털 전환에 대한 은행의 비전을 제시합니다. 혁신과 고객 중심 해법을 받아들임으로써 ING는 긍정적 변화를 이끌고 이해관계자에게 가치를 제공하겠다는 의지를 재확인합니다."
 HOL_adyen_fintech_hub: "아디옌과 핀테크 허브"
 HOL_adyen_fintech_hub_desc: "2006년에 설립된 암스테르담 기반의 결제 처리 업체 아디옌은 넷플릭스에서 스포티파이에 이르는 글로벌 가맹점의 거래를 처리하며 유럽 최대 핀테크 기업 중 하나로 성장했습니다. 이 성공은 네덜란드를 유럽 대륙의 디지털 결제 및 금융 기술 수도로 자리매김하게 하며, 란트스타트에 투자와 고부가가치 서비스 일자리를 끌어들입니다."
 HOL_pension_fund_reform: "연금 기금 개혁"
 HOL_pension_fund_reform_desc: "ABP와 PFZW는 세계 최대 규모의 연금 기금에 속하며, 전 세계의 주식, 기반시설, 부동산 지분을 통해 네덜란드 자본에 막대한 세계적 영향력을 부여합니다. 2023년 미래 연금법(Wet toekomst pensioenen)은 제도를 확정급여형에서 확정기여형으로 전환하여, 향후 수십 년간 이 거대한 자금이 배분되고 투자되는 방식을 재편합니다."
 HOL_booking_digital_services: "디지털 서비스 경제"
 HOL_booking_digital_services_desc: "세계 최대 온라인 여행사인 부킹닷컴은 저스트 잇 테이크어웨이, 톰톰 같은 기업들과 함께 암스테르담에 본사를 두고 있으며, 이 규모의 국가로서는 이례적으로 깊이 있는 플랫폼 및 디지털 서비스 부문의 중심을 이루고 있습니다. 이 클러스터는 국제 인재와 기업 이전을 란트스타트로 끌어들여, 네덜란드를 유럽 기술 기업 본사의 거점으로 굳힙니다."
 HOL_spring_global_mail: "스프링 글로벌 메일 확장"
 HOL_spring_global_mail_desc: "스프링 글로벌 메일은 국제 우편 및 물류 솔루션 분야에서 네덜란드가 지닌 전문성을 보여 줍니다. 전 세계에 효율적이고 신뢰할 수 있는 우편 서비스를 제공함으로써, 스프링 글로벌 메일은 세계 무역과 통신을 촉진하며 국경을 넘어 기업과 소비자를 연결합니다."
 HOL_tata_steel_development: "타타 스틸 개발"
 HOL_tata_steel_development_desc: "타타 스틸 개발은 철강 산업의 지속적인 성장과 경쟁력을 보장하는, 네덜란드 제조업에 대한 중요한 투자입니다. 이 사업은 혁신과 지속 가능성에 대한 타타 스틸의 의지를 강조하며, 네덜란드 시장에서의 입지를 강화합니다."
 HOL_project_beethoven: "베토벤 프로젝트"
 HOL_project_beethoven_desc: "네덜란드 내 기술 부문의 성장을 강화하는 데 중점을 둔 베토벤 프로젝트는 ASML을 비롯한 업계 지도자들이 국가의 투자 환경에 대해 제기한 우려에 대한 전략적 대응으로 등장했습니다. 25억 유로가 넘는 정부의 막대한 투자를 뒷받침으로 하는 이 야심 찬 구상은 ASML 같은 기술 대기업이 국내에서 확장하기에 알맞은 환경을 조성하고, 세계적인 혁신 거점으로서 국가의 위상을 강화하는 것을 목표로 합니다."
 HOL_phillips_healthcare_expansion: "필립스 헬스케어 확장"
 HOL_phillips_healthcare_expansion_desc: "필립스 헬스케어 확장은 의료 기술과 혁신 분야에서 네덜란드가 가진 선도적 위치를 반영합니다. 의료 포트폴리오를 확장함으로써 필립스는 환자의 치료 성과를 개선하고 전 세계에 의료 해법을 발전시키겠다는 의지를 재확인합니다."
 HOL_south_dakota: "사우스다코타의 DSM 공장"
 HOL_south_dakota_desc: "사우스다코타의 DSM 바이오에탄올 공장은 지속 가능한 에너지 해법 분야에서 네덜란드가 보여 주는 선도적 위치를 상징합니다. 바이오에탄올 생산에 투자함으로써 DSM은 탄소 배출 감축과 전 세계 재생 에너지원 확산에 기여합니다."
 HOL_dutch_legends: "네덜란드의 전설"
 HOL_dutch_legends_desc: "네덜란드는 역사를 통틀어 물을 다스린 이야기와 해상 무역의 서사가 어우러진 전설적인 유산을 일구어 왔습니다. 바다에서 땅을 되찾은 네덜란드 기술자들의 전설적인 위업에서부터 먼 바다를 누빈 네덜란드 상인들의 대담한 모험에 이르기까지, 이 전설들은 회복력, 독창성, 번영이 서로 얽혀 있습니다."
 HOL_trade_infrastructure: "무역 기반시설 현대화"
 HOL_trade_infrastructure_desc: "네덜란드는 항만, 운하, 도로를 엮어 끊김 없는 상업망을 이루는 정교하게 조율된 무역 기반시설을 자랑합니다. 그러나 세계 무역이 변화하고 수요가 늘어남에 따라 경쟁 우위를 유지하려면 이 기반시설의 현대화가 필요합니다. 최첨단 기술에 투자하고 운송 경로를 개선하면 네덜란드가 앞으로도 수십 년 동안 국제 무역의 핵심 주체로 남을 수 있을 것입니다."
 HOL_maasvlakte2: "마스블라크터 2 건설"
 HOL_maasvlakte2_desc: "네덜란드는 바다를 간척하여 항만 시설을 확장하고 경제 성장을 촉진하는 야심 찬 마스블라크터 2 사업에 착수하며, 물 관리와 공학에 있어 이 나라가 지닌 역사적 숙련도를 되새깁니다."
 HOL_european_railway_development: "유럽 철도 발전"
 HOL_european_railway_development_desc: "혁신적인 교통 기반시설의 유산을 바탕으로 네덜란드는 첨단 철도망을 통해 대륙 전역의 연결성, 무역, 이동성을 촉진하며 유럽 철도 발전을 선도합니다."
 HOL_green_harbor_amsterdam: "암스테르담 녹색 항만"
 HOL_green_harbor_amsterdam_desc: "암스테르담은 친환경 방식과 재생 에너지 사업을 받아들여 항만을 지속 가능한 거점으로 탈바꿈시키며, 환경 관리와 해양 혁신에 대한 네덜란드의 의지를 보여 줍니다."
 HOL_nederland_maritiem_land: "네덜란드 해양국 재단"
 HOL_nederland_maritiem_land_desc: "네덜란드 해양국 재단의 설립은 네덜란드의 해양 유산과 산업 선도력을 강조하며, 해양 부문 내 협력과 발전을 촉진하여 지속적인 번영과 세계적 경쟁력을 보장합니다."
 HOL_schiphol_expansion: "스히폴 확장"
 HOL_schiphol_expansion_desc: "스히폴 확장은 암스테르담 공항을 세계 여행의 최전선으로 끌어올리는 네덜란드 항공 역사의 중대한 순간입니다. 수용 능력을 늘리고 승객 경험을 개선함으로써, 이 확장은 항공 여행의 효율성과 연결성에 대한 네덜란드의 의지를 강조합니다."
 HOL_digital_customs: "디지털 세관"
 HOL_digital_customs_desc: "디지털 세관은 혁신적인 디지털 해법을 통해 절차를 간소화하고 효율성을 높여 네덜란드의 무역 업무에 혁명을 일으킵니다. 이 사업은 세계적인 무역 허브로서의 입지를 강화하기 위해 기술 발전을 받아들이는 네덜란드의 자세를 상징합니다."
 HOL_daf_investments: "DAF 투자"
 HOL_daf_investments_desc: "DAF 투자는 혁신과 성장에 대한 네덜란드 자동차 산업의 의지를 상징합니다. 전략적 투자와 기술 발전을 통해 DAF는 상용차 선도 제조업체로서의 입지를 강화하며 네덜란드의 산업 역량을 앞으로 나아가게 합니다."
 HOL_rijkswaterstaat: "레이크스바터르스타트"
 HOL_rijkswaterstaat_desc: "물 관리와 기반시설을 담당하는 네덜란드 정부 기관인 레이크스바터르스타트는 수로, 제방, 홍수 방어 시설의 유지 관리를 감독하며 국가의 수자원 지형을 형성하는 데 핵심적인 역할을 합니다. 이를 통해 네덜란드를 홍수의 위협으로부터 지키고 수자원의 효율적이고 지속 가능한 이용을 보장합니다."
 HOL_deltawerken_modernization: "델타 웍스 현대화"
 HOL_deltawerken_modernization_desc: "네덜란드는 상징적인 델타 웍스를 현대화하여 해안 방어를 강화하고 해수면 상승과 변화하는 기후 양상에 적응함으로써, 홍수로부터의 지속적인 보호를 보장하고 미래 세대를 위해 네덜란드 해안선을 지켜 냅니다."
 HOL_ruimte_voor_de_rivier: "강을 위한 공간"
 HOL_ruimte_voor_de_rivier_desc: "홍수 위험 관리에 선제적으로 접근하는 네덜란드는 '강을 위한 공간' 사업을 시행하여 강둑을 따라 불어난 물을 수용하고 도시 지역을 보호할 공간을 만들며, 물 중심 도시 계획에서 네덜란드의 독창성을 보여 줍니다."
 HOL_green_water_city_building: "녹색 물 도시 건설"
 HOL_green_water_city_building_desc: "네덜란드는 지속 가능한 도시 개발의 비전을 받아들여 녹색 물 도시 건설 사업을 개척하며, 물을 고려한 설계 원칙과 자연 기반 해법을 도시 계획과 기반시설 사업에 통합하여 자연환경과 조화를 이루는 회복력 있고 살기 좋은 도시를 만들어 내며 녹색 성장과 환경 관리에 대한 네덜란드의 의지를 구현합니다."
 HOL_dutch_water_sector: "네덜란드 물 산업"
 HOL_dutch_water_sector_desc: "네덜란드 물 산업은 홍수 통제, 해안 방어, 수자원 관리 분야의 수 세기에 걸친 전문성을 바탕으로 전 세계의 시급한 물 문제를 해결하며 물 관리와 혁신의 세계적 선두 주자로 번영하고 있으며, 네덜란드의 독창성과 지속 가능한 발전에 대한 의지를 보여 줍니다."
 HOL_hollandse_kust_windfarm: "홀란세 퀴스트 건설"
 HOL_hollandse_kust_windfarm_desc: "네덜란드는 홀란세 퀴스트 풍력 단지 구역을 개발하여 재생 에너지 계획을 진전시키고, 풍력을 활용해 지속 가능한 경제 성장을 이끌며 탄소 배출을 줄이고 있습니다. 이는 기후 변화에 맞서고 친환경 에너지 해법을 촉진하려는 네덜란드의 노력과 맞닿아 있습니다."
 HOL_aquatech_amsterdam: "아쿠아텍 암스테르담 개최"
 HOL_aquatech_amsterdam_desc: "아쿠아텍 암스테르담은 업계 선구자와 전문가들이 모여 물 관리와 지속 가능성의 혁신을 탐구하는 선도적인 물 기술 행사입니다. 전시회와 교류를 통해 협력을 촉진하고 물 안보가 확보된 미래를 향한 진전을 이끕니다."
 HOL_dredging_industry: "네덜란드 준설 산업"
 HOL_dredging_industry_desc: "보스칼리스, 판 오르트, 로열 IHC는 함께 네덜란드를 준설 및 해양 공학 분야의 확고한 세계 선두로 만들고 있습니다. 항만 심화, 항로 굴착, 간척 사업을 수행하는 이들의 세계 각지 계약은 네덜란드의 전문성을 수출하고 상당한 외화 수입을 창출하여 국내의 수천 개 숙련 일자리를 유지합니다."
 HOL_van_oord_offshore: "해상 풍력 설치"
 HOL_van_oord_offshore_desc: "특수 제작된 네덜란드 설치선들이 홀란세 퀴스트와 보르설러 해안 앞바다의 북해 풍력 단지에 터빈을 세우며, 국내 조선 역량과 해상 건설 전문성을 결합합니다. 네덜란드의 에너지 전환을 위한 발전 용량을 구축하는 이 선단은 급속히 팽창하는 유럽의 해상 풍력 시장에서도 활약하여 장기 계약 수익을 확보합니다."
 HOL_global_land_reclamation: "세계 간척 사업"
 HOL_global_land_reclamation_desc: "네덜란드 시공업체들은 중동에서 동남아시아에 이르기까지 인공 섬, 항만 확장, 홍수 방지 공사를 수행하며 자신들의 간척 및 해안 방어 기술을 전 세계에 수출합니다. 수 세기 동안 바다를 막아 온 경험은 고급 공학 서비스가 되었으며, 이를 해외로 가져가는 기업들은 네덜란드의 가장 독보적인 산업 수출품을 대표합니다."
 HOL_form_nso: "네덜란드 우주 기구"
 HOL_form_nso_desc: "국가 우주 기관은 네덜란드가 연구, 개발, 탐사 노력을 통합된 체계 아래 하나로 모을 수 있게 해 줍니다. NSO의 창설은 우주 여행, 위성 기술, 그리고 미래의 행성 간 임무에 대한 장기 투자를 보장할 것입니다."
 HOL_ijstad_mission: "이스타트 건설"
 HOL_ijstad_mission_desc: "이스타트는 암스테르담 바로 동쪽 에이설메이르에 계획된 인공 섬 도시로, 네덜란드 간척 전통의 현대적 계승으로 구상되었습니다. 이 새로운 섬에는 약 4만 5천 가구가 들어서 란트스타트의 주택 부족을 해소하고, 네덜란드가 탁 트인 물 위에 여전히 새 땅을 만들 수 있음을 보여 줄 것입니다. 공사에는 약 3년이 걸릴 것으로 예상되며, 암스테르담 주변의 서네덜란드 지역을 재편하여 새 주거 지구와 함께 산업 역량과 사무 공간을 더할 것입니다."
 HOL_mars_colony_mission: "화성 식민지 건설"
 HOL_mars_colony_mission_desc: "발사 능력을 확보하고 네덜란드를 떠나는 인력과 장비의 흐름이 꾸준히 이어지는 가운데, 네덜란드 정착민을 화성에 착륙시키고 유지하려는 오랜 노력이 이제 마지막 단계에 접어듭니다. 거주 시설, 생명 유지 시스템, 최초의 영구 구조물을 수백만 킬로미터의 텅 빈 우주 너머에서 조립해야 합니다. 식민지가 준비를 마치면, 창립자들은 자신들이 떠나온 고국의 전설에서 따온 이름을 식민지에 붙일 것입니다."
 HOL_mars_colony1: "홀란더하벤"
 HOL_mars_colony1_desc: "이 식민지는 항구에 닿지 못한 채 영원히 바다를 항해할 운명을 저주받은 상선 선장, 플라잉 더치맨 '더 플리헨더 홀란더'에서 이름을 따왔습니다. 어울리게도 홀란더하벤은 식민지의 상업 중심지가 되어, 해양 국가의 후손들이 새로운 세계에 세운 교역소가 됩니다. 이곳의 행정가들은 옛 VOC의 이윤 추구 본능을 화성의 개척지에 쏟아붓습니다."
 HOL_mars_colony2: "브링커담"
 HOL_mars_colony2_desc: "브링커담은 새는 제방 구멍을 손가락으로 밤새 막아 바다를 막아 냈다는 전설 속 소년 한스 브링커를 기립니다. 이 정착지는 적대적인 화성 환경 속에서 식민지를 거주 가능하게 유지하는 압력 벽, 밀폐 돔, 수력 공학을 전문으로 합니다. 델타 웍스를 세운 바로 그 규율이 이제는 진공을 막아 내고 있습니다."
 HOL_mars_colony3: "브란단스타트"
 HOL_mars_colony3_desc: "알려진 세계의 끝까지 이른 전설적인 항해로 유명한 중세의 항해자 성 브란단에서 이름을 딴 브란단스타트는 식민지의 학문과 연구 중심지입니다. 이곳의 연구소들은 델프트 공과대학교와 ESTEC의 유산을 바탕으로 행성 과학의 지평을 넓혀 갑니다. 이 도시는 네덜란드인들을 처음으로 지평선 너머로 이끈 호기심을 구현합니다."
 HOL_mars_colony4: "브람메르트델프"
 HOL_mars_colony4_desc: "브람메르트델프는 한때 드렌터의 황야를 떠돌았다는 두 거인이자 노상강도 엘러트와 브람메르트를 떠올리게 합니다. 이 정착지는 화성 지각에서 광석과 휘발성 물질을 캐내는 식민지의 광업 및 채굴 산업의 거점입니다. 이름의 유래가 된 거인들처럼, 이곳은 자신이 차지한 땅에 기대어 살아가며 식민지 전체를 지탱하는 원자재를 공급합니다."
 HOL_commissariaat_militaire_productie: "군수 생산 위원회"
 HOL_commissariaat_militaire_productie_desc: "군수 생산 위원회는 네덜란드 전역의 군수 생산 역량을 조율하고 강화하는 데 주력합니다. 이 사업은 조달 절차를 간소화하고, 국내 방위 산업을 육성하며, 첨단 군사 장비의 안정적인 공급을 보장하는 것을 목표로 합니다."
 HOL_dutch_defense_doctrine: "네덜란드 국방 교리"
 HOL_dutch_defense_doctrine_desc: "네덜란드 국방 교리는 네덜란드군의 전략적 방향과 작전 원칙의 토대를 마련합니다. 이 교리는 기민함, 화력, 협력을 강조하여 우리 군이 국익을 수호하고, 동맹국을 지원하며, 세계적 위기에 대응할 준비를 갖추도록 보장합니다."
 HOL_authority_in_information: "정보 우위"
 HOL_authority_in_information_desc: "권위 있는 정보 우위를 확립하는 것은 전략적 이점을 유지하는 데 핵심입니다. 여기에는 핵심 정보를 효율적으로 수집하고 처리하기 위해 정보, 감시, 정찰 능력을 강화하는 것이 포함됩니다."
 HOL_integrated_actions: "통합 작전"
 HOL_integrated_actions_desc: "육상, 해상, 공중, 사이버, 우주 영역에 걸친 통합 작전은 포괄적인 방어 능력을 보장합니다. 이 중점은 매끄러운 조율과 합동 작전을 촉진하여 전반적인 군사적 효율성을 높입니다."
 HOL_information_based: "정보 기반"
 HOL_information_based_desc: "정보 기반 접근 방식은 의사 결정과 작전 효율성을 높입니다. 정보, 감시, 정찰 능력에 투자함으로써 네덜란드는 새롭게 등장하는 위협에 신속하고 효과적으로 대응할 수 있습니다."
 HOL_increase_strategic_capacity: "전략 역량 증강"
 HOL_increase_strategic_capacity_desc: "전략 역량을 강화하는 것은 미래의 과제에 대응하는 데 필수적입니다. 여기에는 전략 수송, 사이버 방어, 우주 작전 능력을 개발하여 네덜란드가 전 세계에 힘과 영향력을 투사할 수 있도록 하는 것이 포함됩니다."
 HOL_dutch_specialism: "네덜란드의 전문 분야"
 HOL_dutch_specialism_desc: "NATO 내에서의 역할을 강화하기 위해 네덜란드는 동맹의 필요를 보완하는 특화된 능력을 개발할 것입니다. 여기에는 상륙 작전, 대공 방어, 신속 전개군에 대한 전문성이 포함됩니다."
 HOL_invest_in_europe: "유럽 방위 투자"
 HOL_invest_in_europe_desc: "유럽의 방위 역량에 투자하면 대륙이 더욱 강하고 회복력 있게 됩니다. 네덜란드는 유럽 방위 사업에 대한 기여를 늘려 EU 회원국과의 협력과 상호 운용성을 높일 것입니다."
 HOL_military_society: "군과 사회 캠페인"
 HOL_military_society_desc: "군과 사회 사이의 강한 유대를 구축하는 것은 매우 중요합니다. 이 중점에는 대중의 참여를 늘리고, 참전 용사를 지원하며, 국방 의식 문화를 조성하는 사업이 포함됩니다."
 HOL_reliable_partner: "신뢰할 수 있는 네덜란드 파트너"
 HOL_reliable_partner_desc: "신뢰할 수 있는 파트너이자 보호자로서 네덜란드는 동맹국의 안보를 보장하고 국제 안정에 기여할 것입니다. 여기에는 NATO와 EU 임무에 적극 참여하고 국익과 동맹의 이익을 지킬 준비 태세를 유지하는 것이 포함됩니다."
 HOL_unique_people: "네덜란드의 특별한 인재"
 HOL_unique_people_desc: "우리 인력의 고유한 기량을 인정하고 육성하는 것은 매우 중요합니다. 이 중점은 군이 높은 기량과 동기를 갖춘 인재를 확보하도록 고급 훈련, 교육, 경력 개발을 강조합니다."
 HOL_flexible_operations: "유연한 작전"
 HOL_flexible_operations_desc: "기민성과 확장성을 유지하려면 군은 변화하는 상황에 신속히 대응할 수 있어야 합니다. 여기에는 신속 대응군을 개발하고 병력의 기동성을 높여 다양한 위협 시나리오에 빠르게 적응하는 것이 포함됩니다."
 HOL_innovative_capacity: "혁신 역량"
 HOL_innovative_capacity_desc: "강력한 혁신 역량을 유지하기 위한 연구 개발 투자는 필수적입니다. 여기에는 최첨단 기술을 도입하고 혁신 문화를 조성하여 잠재적 적보다 앞서 나가는 것이 포함됩니다."
 HOL_escalation_dominance: "확전 우세"
 HOL_escalation_dominance_desc: "확전 우세를 달성하려면 우월한 군사 능력과 견고한 전략적 동반 관계가 필요합니다. 이는 군이 어떤 수준의 분쟁이든 효과적으로 억제하고 대응할 수 있도록 보장합니다."
 HOL_defensievisie_completed: "국방 비전 완료"
 HOL_defensievisie_completed_desc: "네덜란드 국방 교리가 성공적으로 완료되면서 네덜란드군은 눈부신 변화를 겪었습니다. 현대화되고, 회복력이 있으며, 최첨단 기술을 갖춘 군은 미래의 도전에 맞설 준비를 마쳤습니다. 이 이정표는 혁신을 받아들이고, 국제 동반 관계를 강화하며, 작전 준비 태세를 높인 우리 인력의 헌신과 노고를 보여 줍니다."
 HOL_koninklijke_luchtmacht: "수는 적으나 공은 크다"
 HOL_koninklijke_luchtmacht_desc: "'수는 적으나 공은 크다(Parvus numero, magnus merito)'라는 표어를 받아들여 네덜란드 공군의 효율성과 실효성을 극대화하는 데 집중합니다. 여기에는 훈련 프로그램을 최적화하고, 정비 절차를 개선하며, 첨단 기술을 활용하여 모든 항공기와 항공병이 임무에 크게 기여하도록 하는 것이 포함됩니다."
 HOL_join_jsf: "JSF 프로그램 참여"
 HOL_join_jsf_desc: "네덜란드의 합동 타격 전투기(JSF) 프로그램 참여에는 F-35 라이트닝 II 항공기의 조달이 포함됩니다. 이 중점은 네덜란드 공군이 최첨단 스텔스 전투기를 갖추도록 하여 제공권과 타격 능력을 높입니다."
 HOL_join_eurofighter_project: "유로파이터 사업 참여"
 HOL_join_eurofighter_project_desc: "유로파이터 타이푼 사업에 참여함으로써 네덜란드는 고도로 발전된 다목적 전투기에 투자합니다. 이 중점은 공대공 전투, 대지 공격, 정찰 임무에서 네덜란드 공군의 능력을 높입니다."
 HOL_buy_saab_jas39: "사브 JAS39 구매"
 HOL_buy_saab_jas39_desc: "사브 JAS39 그리펜 전투기의 조달은 네덜란드 공군에 다재다능하고 비용 효율적인 다목적 항공기를 제공합니다. 이 중점은 대공 방어, 지상 지원, 정찰 능력을 높여 작전 유연성을 보장합니다."
 HOL_buy_mq9_reaper: "MQ-9 리퍼 구매"
 HOL_buy_mq9_reaper_desc: "MQ-9 리퍼 드론에 투자하면 네덜란드 공군의 정찰 및 타격 능력이 향상됩니다. 이 무인 항공기(UAV)는 실시간 정보, 감시, 정밀 타격 수단을 제공하여 작전 효율을 크게 높입니다."
 HOL_defensie_helikopter_commando: "국방 헬리콥터 사령부 창설"
 HOL_defensie_helikopter_commando_desc: "국방 헬리콥터 사령부(DHC)는 네덜란드군 내 모든 군용 헬리콥터의 작전을 총괄합니다. 이 중점은 헬리콥터 선단의 능력, 훈련, 조율을 높여 국내외 임무를 모두 지원하는 것을 목표로 합니다."
 HOL_ch47d_modernization: "CH-47D 현대화"
 HOL_ch47d_modernization_desc: "CH-47D 치누크 헬리콥터의 현대화에는 항전 장비, 엔진, 화물 시스템의 개선이 포함됩니다. 이 중점은 이 중량 수송 헬리콥터가 수송, 의무 후송, 지원 임무에서 계속 효과적이고 신뢰할 수 있도록 보장합니다."
 HOL_ah46d_upgrade: "AH-64D 개량"
 HOL_ah46d_upgrade_desc: "AH-64D 아파치 공격 헬리콥터의 개량에는 항전 장비, 무장 체계, 생존성의 향상이 포함됩니다. 이 중점은 네덜란드 공군의 전투 능력을 높여 이 헬리콥터들이 근접 항공 지원과 대전차 임무를 효과적으로 수행할 수 있게 합니다."
 HOL_air_mobility_command: "항공 기동 및 군수 지원 사령부"
 HOL_air_mobility_command_desc: "동맹의 협정과 무관하게 항공 기동, 물류, 전투 준비 태세를 지휘하는 국가 사령부를 설치합니다. 군수 지원을 네덜란드의 통제 아래 일원화함으로써 공군은 동맹의 지원에 의존하지 않고 출격을 수행하고 항공기 선단을 유지할 수 있습니다."
 HOL_woensdrecht_mro: "워운스드레흐트 물류 및 F135 엔진 허브"
 HOL_woensdrecht_mro_desc: "워운스드레흐트 물류 센터는 F-35에 동력을 공급하는 F135 엔진의 지역 정비, 수리, 오버홀 시설을 운영합니다. 이 정비창에 투자하면 네덜란드는 동맹국 선단의 군수 지원 거점이 되는 동시에 자국 항공기의 임무 준비 상태를 유지하고 해외 정비에 대한 의존도를 줄일 수 있습니다."
 HOL_expand_fighter_fleet: "전투기 선단 확충"
 HOL_expand_fighter_fleet_desc: "다목적 전투기를 추가로 발주하여 비행대대를 정수 수준으로 끌어올립니다. 확충된 선단은 전개 가능한 전력을 회복시키고, 공군이 국내 영공 감시와 원정 임무를 모두 유지하는 데 필요한 규모를 제공합니다."
 HOL_expand_fighter_fleet_idea: "확충된 전투기 선단"
 HOL_expand_fighter_fleet_idea_desc: "가속화된 조달 추진으로 전투기 생산 라인이 활발하게 가동되어, 인도 기간 동안 신규 기체의 단가가 낮아집니다."
 HOL_frisian_flag_training: "프리지안 플래그 훈련 프로그램"
 HOL_frisian_flag_training_desc: "레이우아르던 공군 기지에서 개최되는 연례 프리지안 플래그 훈련은 북해 상공에서 동맹 공군들을 한데 모아 대규모 전투 훈련을 실시합니다. 상설 훈련 프로그램은 조종사의 숙련도를 높이고 신규 항공 승무원의 경험 습득을 앞당깁니다."
 HOL_precision_munitions: "정밀 유도 무기 통합"
 HOL_precision_munitions_desc: "GBU-39 소구경 폭탄, AIM-120 암람, 미티어 미사일 같은 유도 무기를 전투기 선단에 통합합니다. 현대적인 무장 체계는 교전 거리와 살상력을 확장하여 네덜란드 항공기가 분쟁 공역에서 정확하게 타격할 수 있도록 보장합니다."
 HOL_sovereign_air_operations: "독자 항공 작전"
 HOL_sovereign_air_operations_desc: "선단, 무기, 숙련된 항공 승무원을 통합하여 독자적인 방식으로 지속적인 작전을 수행할 수 있는 자립형 공군을 구성합니다. 네덜란드는 이제 어느 한 동반국에 의존하지 않고도 영공을 지키고 항공력을 투사할 수 있습니다."
 HOL_commando_landstrijdkrachten: "육군 사령부(CLAS) 창설"
 HOL_commando_landstrijdkrachten_desc: "2005년 육군 사령부(CLAS)의 창설은 네덜란드 육군의 중대한 재편이었습니다. 이 중앙 지휘 구조는 작전 효율성을 높이고 의사 결정 절차를 간소화하는 것을 목표로 했습니다. 다양한 육군 구성 요소를 하나의 사령부 아래 통합함으로써 네덜란드는 지상군의 조율과 준비 태세를 개선했습니다."
 HOL_jistarc: "JISTARC 창설"
 HOL_jistarc_desc: "합동 정보·감시·표적 획득·정찰 사령부(JISTARC)는 네덜란드 육군의 정보 능력을 통합하고 강화하기 위해 창설되었습니다. 이 부대는 다양한 정보 기능을 결합하여 포괄적인 전장 상황 인식과 작전 지원을 제공합니다. JISTARC는 정찰 및 감시 임무의 효율성을 높여 전술적 판단에 필요한 정확하고 시의적절한 정보를 보장합니다."
 HOL_dglc: "DGLC 재편"
 HOL_dglc_desc: "국방 지상 배치 방공 사령부(DGLC)는 지상 배치 방공을 담당합니다. DGLC의 능력을 강화하려면 공중 위협으로부터 보호하기 위해 미사일 체계와 레이더 기술을 개량해야 합니다. 이 중점은 네덜란드 육군이 공습으로부터 자산과 영토를 효과적으로 방어할 수 있도록 보장합니다."
 HOL_vuursteun_commando: "화력 지원 사령부 배치"
 HOL_vuursteun_commando_desc: "화력 지원 사령부(Vuursteun Commando)는 포병과 화력 지원 요소를 통합하여 네덜란드 육군에 조율된 화력을 제공합니다. 이 중점에는 포병 체계의 현대화와 표적 지정 정확도의 향상이 포함됩니다. 강화된 화력 지원 능력은 지상 작전의 효율성을 높이고 정밀하고 시의적절한 화력을 보장합니다."
 HOL_supply_command: "보급 및 수송 사령부"
 HOL_supply_command_desc: "보급 및 수송 사령부(Bevoorradings- en Transportcommando)는 네덜란드 육군의 군수 지원과 기동성을 보장하는 데 중요합니다. 이 중점은 공급망, 수송 차량, 기반시설을 개선하여 육군의 작전 준비 태세와 효율성을 높이는 것을 목표로 합니다."
 HOL_military_production_investments: "네덜란드 방위산업에 투자"
 HOL_military_production_investments_desc: "네덜란드 방위 부문은 F-35 개발과 같은 사업에서부터 제벤 프로빈시언급 호위함과 같은 함정의 현대화에 이르기까지 최근 몇 년간 핵심적인 투자를 받아 왔습니다. 국내 방위 산업에 더욱 투자하기로 함으로써 우리는 기술 혁신을 촉진하고, 자립도를 높이며, 군이 최첨단 군사 장비를 계속 갖추도록 보장할 수 있습니다. 이 결정은 국가 안보를 강화하고 견실한 방위 경제의 성장에 기여할 것입니다."
 HOL_defense_industrial_base: "방위 산업 기반 강화"
 HOL_defense_industrial_base_desc: "네덜란드 기업들은 동맹국의 무기 사업에 핵심 부품을 공급하지만, 국내 조립 능력은 뒤처져 있습니다. 무기 공장 건설을 확대하고 최종 생산을 국내에 두어, 하청업체 네트워크를 진정한 국가 산업 기반으로 바꾸어 갑니다."
 HOL_modernize_arms_production: "무기 생산 라인 현대화"
 HOL_modernize_arms_production_desc: "낡은 공구와 설비는 신규 장비 주문의 증산 속도를 늦춥니다. 탈레스 주도의 자동화와 현대적 생산 라인에 투자하면 우리 군수 공장이 더 빨리 최대 생산량에 도달하여 군에 대한 인도 기간이 단축됩니다."
 HOL_lean_defense_manufacturing: "린 방위 제조"
 HOL_lean_defense_manufacturing_desc: "빠듯한 노동 시장 때문에 숙련 노동자가 무기 생산의 제약 요인이 되고 있습니다. DAF와 그 협력업체 전반에 린 제조 방식을 도입하면 각 군수 공장이 요구하는 인력이 줄어들어, 인력을 더 넓은 경제로 돌릴 수 있습니다."
 HOL_defense_supply_chain_integration: "방위 공급망 통합"
 HOL_defense_supply_chain_integration_desc: "분산된 공급업체 관계는 우리 공장이 얻을 수 있는 효율에 한계를 둡니다. 포커 같은 기업을 중심으로 방위 공급망을 통합하면 투입 자원이 안정되고 군수 산업이 유지할 수 있는 최대 효율이 높아집니다."
 HOL_defense_export_promotion: "방위 수출 촉진"
 HOL_defense_export_promotion_desc: "네덜란드 방위 제품은 해외에서 경쟁력이 있지만 수출 수익은 충분히 활용되지 못하고 있습니다. 베르크스포어와 그 협력사가 뒷받침하는 조율된 수출 전략은 군수 산업의 세원을 넓히고 추가 투자 재원을 마련합니다."
 HOL_national_defense_industrial_strategy: "국가 방위 산업 전략"
 HOL_national_defense_industrial_strategy_desc: "현대적인 기반, 간소화된 공장, 통합된 공급망, 늘어나는 수출을 바탕으로 정부는 이러한 성과를 하나의 산업 전략으로 묶을 수 있습니다. 주요 제조업체를 조율하면 전반적인 군수 공장 생산량이 높아지고 방위 부문이 경제의 한 축으로 굳어집니다."
 HOL_netherlands_fractal_pattern: "네덜란드 프랙탈 패턴"
 HOL_netherlands_fractal_pattern_desc: "네덜란드 프랙탈 패턴(NFP)은 네덜란드군 군복을 위해 개발된 위장 무늬입니다. 이 첨단 디자인은 다양한 환경에서 더 나은 은폐 효과를 제공하여 현장에서 병사의 생존성과 효율성을 높입니다."
 HOL_daf_trucks: "DAF CF 군용 트럭"
 HOL_daf_trucks_desc: "DAF 트럭에 대한 투자는 네덜란드 육군의 기동성과 군수 능력을 높입니다. 이 다재다능하고 신뢰할 수 있는 차량은 병력, 장비, 물자의 수송에 필수적이며 작전 유연성과 지원을 보장합니다."
 HOL_scania_trucks: "신형 스카니아 그리푸스"
 HOL_scania_trucks_desc: "네덜란드 육군의 차량 선단에 스카니아 트럭을 추가하면 군수 지원과 수송 효율이 개선됩니다. 이 트럭은 내구성과 성능으로 알려져 있어 군사 작전에 이상적입니다."
 HOL_mrad_replacement: "MRAD 현대화"
 HOL_mrad_replacement_desc: "2020년 네덜란드 국방부는 중거리 방공(MRAD) 체계를 현대화하는 중요한 사업을 시작했습니다. NASAMS를 포함한 현재의 체계는 네덜란드 영공을 더 잘 보호하고 NATO 작전을 지원하기 위해 더 진보하고 기술적으로 우수한 플랫폼으로 교체될 것입니다. 새로운 방공 능력에 투자함으로써 우리는 우리 군이 현대의 공중 위협에 맞서 방어하고 미래에도 국가의 하늘을 지킬 수 있도록 보장합니다."
 HOL_colt_upgrade: "콜트 C7 소총 개량"
 HOL_colt_upgrade_desc: "2009년 네덜란드군은 콜트 C7 소총의 정확도, 신뢰성, 현대전 시나리오에 대한 적응성을 높이는 중대한 개량을 시행했습니다. 이 현대화에는 개선된 광학 장비, 인체공학 설계, 보병 부대의 변화하는 요구를 충족하기 위한 모듈식 체계가 포함되었습니다. 이러한 개량에 투자함으로써 네덜란드 육군은 병사들이 최첨단 무기 기술을 갖추도록 하여 높은 수준의 전투 준비 태세를 유지합니다."
 HOL_pantserhouwitser_mlu: "판저하우비처 2000 MLU"
 HOL_pantserhouwitser_mlu_desc: "판저하우비처 2000 MLU 프로그램은 이 자주 곡사포를 개선된 사격 통제 체계, 향상된 사거리, 높아진 정확도로 개량하는 데 주력합니다. 이는 네덜란드 포병이 계속 매우 효과적이며 정밀한 화력 지원을 제공할 수 있도록 보장합니다."
 HOL_puls: "이스라엘 PULS 발주"
 HOL_puls_desc: "정밀 범용 발사 체계(PULS)는 첨단 로켓 및 미사일 체계를 통합하여 네덜란드 육군의 포병 능력을 개선하도록 설계되었습니다. 이 체계는 정밀하고 유연한 화력 지원을 가능하게 하여 육군의 전반적인 화력을 높입니다."
 HOL_bushmaster_mlu: "부시마스터 MLU"
 HOL_bushmaster_mlu_desc: "부시마스터 MLU 프로그램은 이 장갑 수송차의 장갑, 통신 체계, 기동성을 개량하는 사업입니다. 이는 다양한 작전 환경에서 네덜란드 병력의 방호력과 효율성을 높입니다."
 HOL_munition_investments: "탄약 투자"
 HOL_munition_investments_desc: "첨단 탄약에 투자하고 비축량을 늘리면 네덜란드 육군이 충분히 보급받고 장기 작전을 지속할 수 있게 됩니다. 이 중점에는 정밀 유도 탄약의 개발과 탄약 보급 물류의 개선이 포함됩니다."
 HOL_defensienota_2022: "2022 국방 각서"
 HOL_defensienota_2022_desc: "2022 국방 각서는 네덜란드군의 능력을 높이기 위한 전략적 투자와 개혁을 개괄합니다. 이 포괄적인 계획은 현대화, 국방 예산 증액, 군 전 부문의 작전 준비 태세 개선에 주력합니다."
 HOL_procure_stinger_missiles: "스팅어 미사일 조달"
 HOL_procure_stinger_missiles_desc: "스팅어 미사일의 조달은 저고도 항공기와 헬리콥터에 맞서 방어하는 네덜란드 육군의 능력을 높입니다. 이 휴대용 방공 시스템(MANPADS)은 유연하고 기동성 있는 방공 능력을 제공합니다."
 HOL_procure_advanced_mortars: "첨단 박격포 조달"
 HOL_procure_advanced_mortars_desc: "첨단 박격포에 투자하면 네덜란드 육군의 간접 화력 지원 능력이 개선됩니다. 이 체계들은 더 긴 사거리, 높은 정확도, 향상된 기동성을 제공하여 보병 부대에 필수적인 화력을 공급합니다."
 HOL_develop_guide_munitions: "정밀 유도 탄약 개발"
 HOL_develop_guide_munitions_desc: "155mm 정밀 유도 탄약을 개발하면 네덜란드 포병의 정확도와 효율성이 높아집니다. 이 첨단 탄약은 정밀한 표적 지정을 가능하게 하여 부수적 피해를 줄이고 작전 효율을 높입니다."
 HOL_expand_patriot_systems: "패트리어트 미사일 체계 확충"
 HOL_expand_patriot_systems_desc: "패트리어트 미사일 체계의 배치를 확대하면 탄도 미사일과 첨단 공중 위협에 맞서 방어하는 네덜란드 육군의 능력이 향상됩니다. 이 중점은 견고한 공중 및 미사일 방어망을 제공하여 국가와 지역의 안보를 강화합니다."
 HOL_expand_command_control_centers: "지휘 통제 센터 확충"
 HOL_expand_command_control_centers_desc: "지휘 통제 센터를 확충하고 현대화하면 네덜란드 육군의 작전 조율과 의사 결정 능력이 향상됩니다. 이 중점에는 통신 체계의 개량과 첨단 기술의 통합이 포함되어 군사 작전의 효율적인 지휘를 보장합니다."
 HOL_establish_marechaussee_squad: "헌병대 분대 창설"
 HOL_establish_marechaussee_squad_desc: "헌병대(마레쇼세)는 법 집행과 군수 작전 유지를 담당하는 특수 군사 경찰 부대입니다. 이 부대를 창설하면 우리 군사 작전의 보급 효율과 진압 능력이 모두 크게 개선될 것입니다."
 HOL_modernize_foxtrot: "폭스트롯 통신 체계 현대화"
 HOL_modernize_foxtrot_desc: "폭스트롯 통신 체계의 현대화는 네덜란드 육군의 전술 통신 기반시설을 개량하는 데 주력합니다. 여기에는 보안성 높은 고속 데이터 링크 구현, 첨단 암호화, NATO 동맹국과의 상호 운용성 강화가 포함됩니다. 이 체계들을 현대화함으로써 네덜란드 육군은 다양한 작전 환경에서 신뢰할 수 있고 안전한 통신을 보장합니다."
 HOL_special_forces_helicopter: "특수 작전군 헬리콥터"
 HOL_special_forces_helicopter_desc: "네덜란드 특수 작전군(SOF)을 위한 전용 헬리콥터의 도입은 이들의 기동성과 작전 효율성을 높입니다. 이 헬리콥터들은 다양한 환경에서 신속한 침투와 철수, 근접 항공 지원, 군수 지원을 수행할 수 있도록 갖추어져 있습니다."
 HOL_defense_healthsector: "국방 및 의료 연구소 설립"
 HOL_defense_healthsector_desc: "국방·민간 병원 협력 연구소(Instituut Samenwerking Defensie en Relatieziekenhuizen)는 의료 지원과 위기 대응을 위한 견고한 네트워크를 구축하는 데 주력합니다. 이 협력은 군 인력의 의료 서비스를 개선하고, 비상시 민간 의료 기반시설을 지원하는 군의 능력을 높이는 것을 목표로 합니다."
 HOL_develop_defensity_college: "디펜시티 칼리지 개설"
 HOL_develop_defensity_college_desc: "디펜시티 칼리지는 군 인력에게 학문적 발전과 전문 훈련의 기회를 제공하기 위해 마련된 교육 사업입니다. 이 중점에는 다양한 분야의 과정을 제공하기 위한 대학 및 기술 학교와의 제휴가 포함되어 네덜란드 병사와 장교의 기량과 지식을 향상시킵니다."
 HOL_hr_ecosystem: "HR 생태계"
 HOL_hr_ecosystem_desc: "HR 생태계 사업은 협력적인 인적 자원 네트워크를 조성하여 네덜란드군과 사회 사이의 간극을 메우는 것을 목표로 합니다. 이 프로그램은 민간 단체와의 제휴를 구축하고, 군 인력의 경력 기회를 높이며, 복무자의 전반적인 복지를 개선하는 데 주력합니다. 국방과 사회를 연결함으로써 HR 생태계는 복무 중과 전역 후의 군 인력을 위한 지원 체계를 강화합니다."
 HOL_marinestudie: "해군 연구"
 HOL_marinestudie_desc: "해군 연구(Marinestudie)는 네덜란드 왕립 해군을 평가하고 현대화하기 위한 종합 해군 전략 연구입니다. 이 사업에는 장기 해군 전략을 수립하기 위한 현재 능력, 미래 위협, 기술 발전의 평가가 포함됩니다. 이 연구는 해군 전투 준비 태세의 강화, 함대 자산의 개량, 신기술의 통합을 강조합니다."
 HOL_annual_naval_deployment: "연례 해군 파견"
 HOL_annual_naval_deployment_desc: "매년 네덜란드 왕립 해군은 서방 세계 곳곳의 항구를 방문하는 장거리 친선 항해에 함선을 파견합니다. 이 파견은 네덜란드의 존재감을 드러내고, 동반 관계를 강화하며, 함대의 원양 항해 기량을 연마합니다."
 HOL_naval_diplomacy_voyage: "네덜란드 해군 친선 방문"
 HOL_world_reaching_navy: "세계로 뻗는 해군"
 HOL_world_reaching_navy_desc: "네덜란드는 전 세계에서 효과적으로 작전할 수 있도록 해군 능력을 강화하는 것을 목표로 합니다. 이 중점에는 함대의 현대화, 군수 지원의 확대, 국제 동반 관계의 강화가 포함됩니다. 이를 통해 네덜란드 해군은 핵심 해상 교통로를 확보하고, 세계 평화 유지 임무에 참여하며, 필요한 곳 어디든 힘을 투사하고자 합니다."
 HOL_european_navy: "유럽 해군"
 HOL_european_navy_desc: "네덜란드는 유럽 해군의 창설에서 주도적인 역할을 맡아 EU 회원국 간의 해군 협력과 통합을 촉진할 것입니다. 이 사업은 집단 해양 안보를 강화하고, 방위 자원을 간소화하며, 유럽의 해군력을 세계 무대에 투사하는 것을 목표로 합니다."
 HOL_expanding_naval_infrastructure: "해군 기반시설 확충"
 HOL_expanding_naval_infrastructure_desc: "네덜란드는 해군 기지망을 확충하여 해군의 존재감을 강화하기로 결심했습니다. 이 중점에는 네덜란드 해안선과 해외 영토 일대의 신규 기지 개발과 기존 시설의 개량이 포함됩니다. 이렇게 확충된 기지들은 해군 작전에 대한 전략적 지원을 제공하고, 군수를 개선하며, 신속 대응 능력을 보장할 것입니다."
 HOL_f35c_development: "F35C 개발"
 HOL_f35c_development_desc: "F-35C 라이트닝 II 항공기의 조달은 네덜란드 공군에 첨단 스텔스 전투기의 항모 운용형 파생형을 제공합니다. 이 중점은 육상 기지와 항공모함 양쪽에서 항공력을 투사하는 네덜란드의 능력을 높이며, 비할 데 없는 다목적성과 전투 효율을 제공합니다."
 HOL_future_air_defender: "미래 방공함"
 HOL_future_air_defender_desc: "미래 방공함 사업은 첨단 해군 방공 능력을 개발하기 위한 네덜란드와 독일의 협력 사업입니다. 이 사업은 네덜란드와 독일의 해군 함정에 최첨단 레이더 체계, 대공 미사일, 통합 지휘 통제 기술을 갖추는 데 주력합니다."
 HOL_multi_ocean_training: "다대양 훈련"
 HOL_multi_ocean_training_desc: "다양한 해양 과제에 대비하기 위해 네덜란드 해군은 여러 대양에서 대규모 훈련을 실시할 것입니다. 이 훈련은 동맹 해군과의 상호 운용성을 높이고 다양한 환경에서 네덜란드 해군의 작전 준비 태세를 강화할 것입니다."
 HOL_carrier_development: "항공모함 개발"
 HOL_carrier_development_desc: "첨단 항공모함을 개발함으로써 네덜란드는 해군의 우위를 확보하고 미래 세대를 위한 보호를 보장할 것입니다."
 HOL_expand_dutch_naval_influence: "네덜란드 해군 영향력 확대"
 HOL_expand_dutch_naval_influence_desc: "세계적인 해군 강국으로 완전히 자리 잡으려면 네덜란드는 더 강력한 해군 동맹을 육성하고 국제 해양 기구에서의 영향력을 높여야 합니다. 이는 세계 해군 작전과 전략에 네덜란드의 이익이 반영되도록 보장할 것입니다."
 HOL_submarine_hunter_initiative: "잠수함 사냥꾼 구상"
 HOL_submarine_hunter_initiative_desc: "적 잠수함이 가하는 위협이 커짐에 따라 대잠수함전(ASW)에 중점을 둔 새로운 교리가 필요합니다. 네덜란드는 최첨단 ASW 기술 개발을 선도하여 네덜란드 함대가 보이지 않는 수중 위협에 결코 휘둘리지 않도록 보장할 것입니다."
 HOL_amphibous_technology: "특수 원정군"
 HOL_amphibous_technology_desc: "네덜란드는 전 세계 분쟁 지역에 신속히 전개할 수 있는 고도로 전문화된 해군 원정군을 창설하는 데 투자해야 합니다. 이 부대는 상륙 강습함과 정예 해병 사단의 지원을 받아 해외 작전에 신속하고 결정적으로 개입할 수 있을 것입니다."
 HOL_return_of_destroyers: "구축함의 귀환"
 HOL_return_of_destroyers_desc: "구축함 선단의 확충과 현대화는 해군의 우위를 유지하는 데 매우 중요합니다. 이 중점에는 첨단 무장과 방어 체계를 갖춘 신형 구축함의 건조가 포함됩니다. 이 함정들은 해군의 작전 능력을 높여 다양한 해역에서 견고한 방어와 공격 수단을 제공할 것입니다."
 HOL_thales_investments: "탈레스 투자"
 HOL_thales_investments_desc: "글로벌 탈레스 그룹의 자회사인 탈레스 네덜란드는 네덜란드의 방위, 항공우주, 보안 기술 분야를 선도하는 기업입니다. 탈레스 네덜란드에 대한 투자에는 생산 능력, 연구 개발(R&D) 노력의 강화와 세계 방위 시장에서의 역할 확대가 포함됩니다."
 HOL_special_force_move: "플리싱언의 해병대"
 HOL_special_force_move_desc: "플리싱언에 상당한 규모의 해병대 주둔지를 설치하기로 한 결정은 전략적, 군수적 이점에 따른 것입니다. 북해 연안에 위치한 플리싱언은 해상 항로에 직접 접근할 수 있어 상륙 작전과 신속 전개에 이상적입니다. 도시의 기존 기반시설과 주요 항로에 가까운 입지는 해병대의 작전 준비 태세와 유연성을 높여 줍니다."
 HOL_rijksregiebureau_maritieme_industrie: "국가 해양 산업 조정국"
 HOL_rijksregiebureau_maritieme_industrie_desc: "국가 해양 제조 산업 조정국(Rijksregiebureau Maritieme Maakindustrie)의 설립은 네덜란드 해양 제조업을 중앙에서 통합하고 조율하는 중요한 걸음입니다. 이 기관은 조선 및 해양 공학 역량을 혁신하고 확장하려는 노력을 간소화하여 네덜란드 해양 산업이 경쟁력과 기술 우위를 유지하도록 보장할 것입니다."
 HOL_maritiem_masterplan: "해양 마스터플랜"
 HOL_maritiem_masterplan_desc: "해양 마스터플랜(Het Maritiem Masterplan)은 네덜란드 해양 부문을 강화하기 위한 포괄적 전략을 개괄합니다. 이 계획에는 기반시설, 연구 개발, 인력 훈련에 대한 투자가 포함됩니다. 이 마스터플랜을 시행함으로써 네덜란드는 해양 혁신과 지속 가능성 분야의 세계적 선두 주자라는 위상을 확보하고자 합니다."
 HOL_werf_van_de_toekomst: "미래의 조선소"
 HOL_werf_van_de_toekomst_desc: "미래의 조선소(De Werf van de Toekomst) 사업은 네덜란드의 조선업에 혁명을 일으키는 것을 목표로 합니다. 이 사업은 자동화, 로봇공학, 3D 프린팅과 같은 첨단 제조 기술을 조선소 운영에 통합하는 데 주력합니다. 목표는 더 효율적이고, 지속 가능하며, 비용 효과적인 조선 공정을 만드는 것입니다."
 HOL_smart_maritime: "스마트 해양"
 HOL_smart_maritime_desc: "스마트 해양 구상은 디지털 기술을 활용하여 네덜란드 해양 부문의 효율성과 성능을 높입니다. 이 중점에는 항해, 물류, 정비를 위한 스마트 체계의 도입과 자율 운항 선박의 개발이 포함됩니다. 디지털 전환을 받아들임으로써 네덜란드는 스마트 해운 솔루션을 선도하고자 합니다."
 HOL_robotics_navy: "로봇 해군"
 HOL_robotics_navy_desc: "해상 풍력 로봇화(Robotisering Wind op Zee) 사업은 로봇공학과 자동화를 해상 풍력 산업에 통합하는 데 주력합니다. 이 사업은 바다 위 풍력 터빈의 설치, 유지 보수, 운영을 개선하여 공정을 더 안전하고, 효율적이며, 지속 가능하게 만드는 것을 목표로 합니다. 로봇공학을 활용함으로써 네덜란드는 재생 에너지 역량을 강화할 수 있습니다."
 HOL_seabed_protection: "북해 기반시설 보호"
 HOL_seabed_protection_desc: "파이프라인, 전력 및 데이터 케이블, 해상 풍력 단지가 이제 네덜란드 북해를 뒤덮고 있으며, 노르트스트림 가스관 파괴 공작은 이들이 얼마나 취약한지를 드러냈습니다. 전담 해저전 프로그램은 측량선, 소나 네트워크, 무인 수중 체계를 짝지어 이 핵심 기반시설을 감시하고 방어합니다."
 HOL_nuke_navy: "선박 원자력 추진"
 HOL_nuke_navy_desc: "선박 원자력 추진(Nucleaire Voortstuwing van Schepen) 구상은 네덜란드 군함과 상선을 위한 원자력 추진 체계의 개발과 도입을 모색합니다. 이 중점은 지속 가능하고 장거리 운항이 가능한 추진 해법을 제공하여 화석 연료 의존도를 줄이고 네덜란드 함대의 작전 능력을 높이는 것을 목표로 합니다."
 HOL_goalkeeper_modernization: "골키퍼 현대화"
 HOL_goalkeeper_modernization_desc: "네덜란드는 해군 방어 능력을 높이기 위해 골키퍼 근접 방어 무기 체계(CIWS)를 개량하고 있습니다. 이 현대화 사업에는 신형 레이더와 추적 체계의 설치, 사격 통제의 개선, 첨단 탄종의 통합이 포함됩니다. 개량된 골키퍼 체계는 날아오는 미사일과 근거리 위협에 맞서는 네덜란드 해군의 방어 능력을 크게 높일 것입니다."
 HOL_smartl_radar_construction: "SMART-L 레이더 건설"
 HOL_smartl_radar_construction_desc: "SMART-L 레이더 체계의 건설은 네덜란드 해군에 최첨단 장거리 감시 및 추적 능력을 제공할 것입니다. 이 첨단 레이더 체계는 탄도 미사일, 항공기, 기타 공중 위협을 먼 거리에서 탐지하고 추적할 수 있습니다. SMART-L 레이더를 도입함으로써 네덜란드는 상황 인식을 높이고 전반적인 공중 및 미사일 방어를 강화합니다."
 HOL_vrouwenklasse_destroyer: "프라우언급 개발"
 HOL_vrouwenklasse_destroyer_desc: "프라우언급 대잠 구축함을 도입함으로써 네덜란드는 고도로 발전되고 다목적인 호위함 선단을 구축하고자 합니다. 이 함정들은 최첨단 미사일 체계, 우수한 레이더, 견고한 전자전 능력을 갖출 것입니다. 프라우언급 구축함은 공격과 방어 해군 작전 모두에서 탁월하도록 설계되어 네덜란드 해군이 강력한 전력으로 남도록 보장합니다."
 HOL_den_helder_css: "덴 헬더 CSS"
 HOL_den_helder_css_desc: "덴 헬더 CSS 사업은 네덜란드 함대에 군수 및 작전 지원을 제공할 신형 전투 지원함을 개발하는 것을 목표로 합니다. 이 함정은 연료, 탄약, 기타 필수 자원을 공급함으로써 해군이 장기 작전을 지속할 수 있도록 보장할 것입니다. 덴 헬더 CSS는 네덜란드 해군의 작전 효율을 유지하는 데 중요한 자산이 될 것입니다."
 HOL_joint_support_ship: "합동 지원함 카럴 도르만"
 HOL_joint_support_ship_desc: "2015년에 취역한 카럴 도르만함(Zr.Ms. Karel Doorman)은 해상 수송, 해상 보급, 헬리콥터 운용을 하나의 선체에 결합한 합동 지원함입니다. 다멘 스헬더가 건조한 이 함정 덕분에 네덜란드 왕립 해군은 모항에서 멀리 떨어진 곳에서도 원정 기동 부대와 해병대를 지원할 수 있습니다."
 HOL_amphibious_transport_group: "상륙 수송단"
 HOL_amphibious_transport_group_desc: "요한 데 비트함을 필두로 하는 로테르담급 상륙수송선거함(LPD)은 네덜란드 해병대에 독자적인 전력의 상륙 작전 능력을 제공합니다. 이 함선들은 웰덱(침수식 도크), 차량 격납고, 비행갑판을 갖추고 있어, 강화된 해병 대대를 해안에 상륙시킬 수 있을 뿐만 아니라 합동 작전을 위한 해상 지휘 플랫폼 역할도 수행합니다."
 HOL_nh90_mlu: "NH90 MLU"
 HOL_nh90_mlu_desc: "NH90 중간 수명 개량 사업은 네덜란드 해군이 사용하는 NH90 헬리콥터의 운용 수명과 능력을 연장하는 것을 목표로 합니다. 이 개량에는 첨단 항전 장비, 개선된 센서, 강화된 무장 체계가 포함됩니다. NH90 MLU는 이 다재다능한 헬리콥터가 대잠수함전, 수색 및 구조, 수송 임무에서 계속 효과적이도록 보장할 것입니다."
 HOL_flexible_navy: "유연한 해군 작전"
 HOL_flexible_navy_desc: "네덜란드 왕립 해군은 급변하는 세계 해양 환경에 적응할 수 있어야 합니다. 유연한 해군 작전에 집중함으로써 우리는 잠수함전에서 연안 방어에 이르는 다양한 위협에 신속하게 대응하는 함대의 능력을 높일 것입니다. 이를 통해 네덜란드 해군은 여러 해역에서 존재감을 유지하고 합동 작전에서 동맹국을 지원하여 국가 및 국제 안보를 모두 보장할 수 있습니다."
 HOL_submarine_modernization: "잠수함 현대화 프로그램"
 HOL_submarine_modernization_desc: "네덜란드는 잠수함 선단에 대한 포괄적인 현대화 프로그램을 추진하고 있습니다. 이 사업은 기존 잠수함에 최신 스텔스 기술, 첨단 소나 체계, 개선된 무장을 갖추도록 개량하는 것입니다. 이 현대화는 다양한 작전 환경에서 네덜란드 잠수함의 생존성과 전투 효율을 높일 것입니다."
 HOL_barracuda_submarine: "해군 바라쿠다 발주"
 HOL_barracuda_submarine_desc: "바라쿠다급 잠수함의 도입은 네덜란드의 수중전 능력에 있어 큰 도약을 의미합니다. 이 원자력 추진 잠수함은 첨단 스텔스 기능, 장거리 타격 능력, 최첨단 소나 체계를 갖추고 있습니다. 바라쿠다 잠수함은 네덜란드 해군에 비할 데 없는 수중 공격 및 방어 능력을 제공할 것입니다."
 HOL_c71_submarine: "네덜란드 C71 개발"
 HOL_c71_submarine_desc: "C-71 잠수함 사업은 오랜 해군 유산을 반영하는 네덜란드 해양 산업의 자랑스러운 산물입니다. 이 잠수함은 연안 방어와 특수 작전을 위해 특별히 설계되었으며, 첨단 추진 체계, 높은 기동성, 최첨단 통신 장비를 갖추고 있습니다. C-71급은 영해를 보호하고 비밀 임무를 수행하는 네덜란드 해군의 능력을 크게 강화하여, 네덜란드가 자국 기술로 설계한 해법으로 계속 해양 방위를 선도하도록 보장할 것입니다."
 HOL_submarine_drones: "잠수함 드론 개발"
 HOL_submarine_drones_desc: "네덜란드는 해군전의 미래를 받아들여 수중 작전을 지원하는 잠수함 드론에 투자하고 있습니다. 이 자율 및 원격 조종 기체는 감시, 정찰, 기뢰 제거 임무를 수행할 것입니다. 잠수함 드론의 통합은 네덜란드 잠수함 선단의 능력을 보강하고 상당한 전술적 이점을 제공할 것입니다."
 HOL_damen_industry_expansion: "다멘 산업 확장"
 HOL_damen_industry_expansion_desc: "다멘 조선소와 협력하여 네덜란드는 해군 현대화 프로그램의 늘어나는 수요를 충족하기 위해 조선 산업을 확장하고 있습니다. 이 확장에는 조선 시설의 개량, 연구 개발 투자, 생산 능력의 증대가 포함됩니다. 다멘 산업 확장은 네덜란드가 최첨단 해군 기술을 갖춘 선도적 해양 국가로 남도록 보장할 것입니다."
 HOL_legendary_dockyards: "네덜란드의 전설적인 조선소"
 HOL_legendary_dockyards_desc: "네덜란드 해군 장인 정신의 부활은 놀라운 성과를 낼 것입니다. 함선 생산 능력이 향상되고, 건조 시간이 단축되며, 해군 설계가 더 강력해질 것입니다. 전설적인 조선소가 되살아남에 따라 네덜란드는 현대 해군전의 선도국이라는 위상을 굳힐 것입니다."
 HOL_paars: "퍼르스 II"
 HOL_paars_desc: "노동당(PvdA), 자유민주국민당(VVD), 민주66(D66)으로 이루어진 제2차 퍼르스(보라색) 연립은 계속해서 네덜란드를 통치합니다. 이 연립은 진보적 사회 정책과 경제적 자유주의의 균형을 맞추는 것을 목표로 합니다."
 HOL_threats_against_politicians: "정치인 보호"
 HOL_threats_against_politicians_desc: "최근 정치 인사들에 대한 위협은 우리 민주주의 제도의 안전에 대한 우려를 불러일으켰습니다. 보안 조치를 강화하고 선출된 대표들의 보호를 보장하는 것이 시급합니다."
 HOL_royal_wedding: "왕실 결혼식"
 HOL_royal_wedding_desc: "빌럼알렉산더 왕세자와 막시마 소레기에타의 약혼은 그녀의 아버지가 아르헨티나 군사 독재에 연루되었던 과거 때문에 논란을 불러일으켰습니다. 이는 그의 결혼식 참석을 둘러싼 정치적, 대중적 논쟁으로 이어졌고, 결국 네덜란드 정부와 의회의 결정으로 귀결되었습니다."
 HOL_un_mission_ehtiopia: "에티오피아 UN 임무 참여"
 HOL_un_mission_ehtiopia_desc: "국제연합은 에티오피아 평화 유지 임무에 네덜란드의 참여를 요청했습니다. 이 임무에 참여하면 우리의 국제적 위상이 높아지고 세계 평화와 안정에 기여할 것입니다."
 HOL_gay: "동성 결혼"
 HOL_gay_desc: "동성 결혼의 합법화는 평등과 인권을 위한 투쟁에서 중대한 이정표입니다. 이 역사적인 결정은 네덜란드가 진보적이고 포용적인 사회라는 위상을 굳힐 것입니다."
 HOL_vvd: "VVD 데이크스탈 승리"
 HOL_vvd_desc: "VVD는 자유 시장, 개인의 자유, 경제에 대한 최소한의 정부 개입을 옹호하는 자유보수주의 정당입니다. 마르크 뤼터와 같은 실용주의적 인물의 지도 아래 VVD는 경제 성장, 효율적인 공공 서비스, 강력한 국가 안보, 균형 잡힌 이민 접근을 강조합니다. 이 정당은 개인의 자유와 사회 안정을 보장하면서 역동적이고 경쟁력 있는 경제를 만드는 것을 목표로 합니다."
 HOL_economic_paper: "경제 관련 서류 업무 감축"
 HOL_economic_paper_desc: "더 역동적이고 효율적인 기업 환경을 조성하기 위해 VVD는 불필요한 경제 관련 서류 업무를 줄이는 데 전념합니다. 관료적 형식주의를 줄임으로써 우리는 기업이 성장과 혁신에 집중할 수 있도록 힘을 실어 줄 것입니다."
 HOL_vvd_debt_reduction: "부채 감축"
 HOL_vvd_debt_reduction_desc: "우리 경제의 장기적 안정을 보장하는 것은 무엇보다 중요합니다. VVD는 신중한 재정 관리와 표적 지출 삭감을 통해 국가 부채를 줄여, 다가올 세대를 위한 번영하는 미래를 확보하는 것을 목표로 합니다."
 HOL_economic_stimulation_tax: "경제 부양 세제"
 HOL_economic_stimulation_tax_desc: "VVD는 성장을 이끄는 경제적 유인의 힘을 믿습니다. 핵심 부문에 세금 혜택을 도입함으로써 우리는 투자, 혁신, 경제 팽창을 촉진할 것입니다."
 HOL_startup_innovation_policies: "스타트업 혁신 정책"
 HOL_startup_innovation_policies_desc: "기업가 정신을 장려하는 것은 VVD 경제 전략의 핵심입니다. 우리는 혁신적인 스타트업에 세금 감면과 보조금을 제공하여 활기찬 창업 생태계를 만들 것입니다."
 HOL_vvd_leadership: "지도부 국민투표"
 HOL_vvd_leadership_desc: "2006년 VVD는 마르크 뤼터와 리타 페르동크 사이의 내부 지도부 경쟁에 직면했습니다. 이를 해결하고 정당의 미래 방향을 결정하기 위해 VVD 당원들을 대상으로 지도부 국민투표가 실시되었습니다. 이 투표의 결과는 뤼터의 실용적 중도주의와 페르동크의 강경한 입장 사이에서 균형을 잡으며 정당의 정책과 전략을 결정짓게 됩니다."
 HOL_mark_rutte: "마르크 뤼터"
 HOL_mark_rutte_desc: "VVD의 실용적이고 중도적인 지도자 마르크 뤼터는 폭넓은 연립을 구축하고 복잡한 정치 지형을 헤쳐 나가는 능력으로 유명합니다. 2006년 그는 경제적 자유주의, 효율적인 공공 서비스, 온건한 사회 정책에 중점을 둔 균형 잡힌 통치 방식을 강조합니다. 뤼터는 네덜란드의 기반시설을 현대화하고, 혁신을 촉진하며, 유럽 연합 내에서 네덜란드의 강력한 입지를 확보하는 것을 목표로 합니다."
 HOL_consensus_politics: "합의 정치"
 HOL_consensus_politics_desc: "마르크 뤼터의 지도 아래 VVD는 폭넓은 연립을 구축하고 정치 스펙트럼 전반에 걸쳐 합의를 이루는 데 집중하여 안정과 효과적인 통치를 보장할 것입니다."
 HOL_modernize_dutch_infrastructure: "네덜란드 기반시설 현대화"
 HOL_modernize_dutch_infrastructure_desc: "기반시설에 대한 투자는 경제 성장에 매우 중요합니다. VVD는 도로, 철도, 디지털 네트워크를 현대화하여 연결성을 높이고 혼잡을 줄일 것입니다."
 HOL_strong_netherlands_europe: "강한 유럽 속의 강한 네덜란드"
 HOL_strong_netherlands_europe_desc: "강력한 유럽 연합은 우리의 안보와 번영에 필수적입니다. VVD는 EU 내 경제 및 안보 협력의 심화를 지지할 것입니다."
 HOL_nato_norm: "NATO 기준 충족을 위한 투자"
 HOL_nato_norm_desc: "국가 안보는 양보할 수 없습니다. VVD는 NATO의 GDP 2% 목표를 충족하도록 국방비 지출을 늘려, 우리가 국가를 지키고 동맹에 대한 약속을 이행할 수 있도록 보장할 것을 약속합니다."
 HOL_pragmatic_immigration: "실용적 이민 정책"
 HOL_pragmatic_immigration_desc: "안보 우려와 통합의 필요성 사이에서 균형을 맞추며, 뤼터 휘하의 VVD는 사회 결속과 경제적 이익을 촉진하는 실용적 이민 정책을 시행할 것입니다."
 HOL_teflon_mark: "테플론 마르크"
 HOL_teflon_mark_desc: "마르크 뤼터의 회복력과 정치적 난관을 헤쳐 나가는 능력은 귀중한 자산입니다. VVD는 그의 지도력을 활용하여 안정과 진전을 유지할 것입니다."
 HOL_rita_verdonk: "리타 페르동크"
 HOL_rita_verdonk_desc: "VVD 내의 저명한 인물인 리타 페르동크는 이민과 법질서에 대한 강경한 입장으로 유명합니다. 2006년 그녀는 엄격한 이민 통제, 견고한 국가 안보 조치, 네덜란드 문화 정체성의 보존을 옹호합니다. 페르동크의 접근 방식은 통합과 공공 안전에 대한 단호한 정책을 원하는 유권자들의 공감을 얻어, 그녀를 당내에서 강하고 결단력 있는 지도자로 자리매김하게 합니다."
 HOL_national_identity: "민족 정체성"
 HOL_national_identity_desc: "네덜란드의 문화와 정체성을 보존하는 것은 무엇보다 중요합니다. 페르동크의 지도 아래 VVD는 우리의 민족 유산이 보호되고 기려지도록 하는 정책을 시행할 것입니다."
 HOL_tough_on_immigration: "이민에 강경 대응"
 HOL_tough_on_immigration_desc: "국경을 지키고 사회 질서를 유지하기 위해 VVD는 이민에 대한 강경한 입장을 채택하여 엄격한 통제와 이주민 유입 감소를 강조할 것입니다."
 HOL_law_and_order: "법과 질서"
 HOL_law_and_order_desc: "공공 안전을 보장하는 것은 VVD의 핵심 가치입니다. 우리는 범죄에 맞서고 국가 안보를 보장하기 위해 경찰과 군에 대한 재정 지원을 늘릴 것입니다."
 HOL_self_reliance_citizens: "자립하는 시민"
 HOL_self_reliance_citizens_desc: "자립을 장려하고 국가 복지에 대한 의존을 줄이는 것은 VVD의 핵심 목표입니다. 우리는 개인의 책임과 경제적 독립을 장려하는 정책을 시행할 것입니다."
 HOL_promote_dutch_sovereignty: "네덜란드 주권 증진"
 HOL_promote_dutch_sovereignty_desc: "페르동크 휘하의 VVD는 네덜란드의 주권을 강조하여 국가 정책에 대한 EU의 영향력을 줄이고 우리의 독립을 지킬 것입니다."
 HOL_iron_rita: "철의 리타"
 HOL_iron_rita_desc: "리타 페르동크의 강력하고 결단력 있는 지도력은 VVD를 어려운 시기를 헤쳐 나가도록 이끌어, 확고한 통제와 미래를 위한 분명한 방향을 보장할 것입니다."
 HOL_wilders_vvd: "헤이르트 빌더르스"
 HOL_wilders_vvd_desc: "헤이르트 빌더르스는 통합과 유럽 통합에 대한 대중의 커져 가는 불안을 대변하는 VVD에서 가장 거침없는 반이민 목소리입니다. 그는 자유주의적 틀 안에서 활동하면서도 정당을 이민, 안보, 국가 주권에 대한 더 강경한 노선으로 밀어붙입니다."
 HOL_immigration_hardliner: "이민 강경파"
 HOL_immigration_hardliner_desc: "빌더르스는 이민과 망명에 대한 훨씬 더 엄격한 제한을 요구합니다. VVD는 입국 및 통합 요건을 강화하며, 통제되지 않은 이주로부터 네덜란드 사회를 지킬 정당임을 내세웁니다."
 HOL_islam_integration_debate: "통합 논쟁"
 HOL_islam_integration_debate_desc: "빌더르스는 이슬람, 통합, 네덜란드의 가치를 둘러싼 전국적 논쟁을 불러일으킵니다. 정당은 새로 온 이들이 이 나라의 자유주의적, 문화적 규범을 완전히 받아들여야 한다고 주장하며 대결적인 입장을 취합니다."
 HOL_eurosceptic_vvd_wing: "유럽 회의주의 계파"
 HOL_eurosceptic_vvd_wing_desc: "빌더르스를 중심으로 한 계파는 갈수록 긴밀해지는 유럽 통합을 불신합니다. VVD는 브뤼셀에 대해 더 비판적인 입장을 취하며 주권 이양에 저항하고 추가 확대에 의문을 제기합니다."
 HOL_security_first: "안보 우선"
 HOL_security_first_desc: "정치적 폭력과 테러에 대한 우려 속에서 빌더르스는 더 강경한 안보 태세를 촉구합니다. 정당은 불안해하는 대중을 안심시키기 위해 경찰과 대테러 권한을 확대합니다."
 HOL_wilders_dutch_sovereignty: "네덜란드 주권"
 HOL_wilders_dutch_sovereignty_desc: "빌더르스 계파는 국가 주권을 초국가적 약속보다 우선시합니다. VVD는 네덜란드 법과 제도의 우위를 주장하며 국내 정책에 대한 외부 기관의 영향 범위를 좁힙니다."
 HOL_wilders_vvd_capstone: "불만 가진 이들의 목소리"
 HOL_wilders_vvd_capstone_desc: "빌더르스는 외면받는다고 느끼는 유권자들의 확실한 대변자가 됩니다. 그의 포퓰리즘적 호소는 VVD의 이미지를 재편하여, 불안한 유권자층을 정당의 더 강경해진 새로운 정체성에 묶어 둡니다."
 HOL_liberal_society: "자유주의 사회"
 HOL_liberal_society_desc: "자유주의적 경제 모델을 장려하는 것은 VVD의 비전에서 근본적입니다. 우리는 혁신과 번영을 이끌기 위해 자유 시장과 경쟁을 옹호할 것입니다."
 HOL_modernizing_public_services: "공공 서비스 현대화"
 HOL_modernizing_public_services_desc: "디지털 기반시설과 간소화된 절차를 통한 공공 서비스의 현대화는 VVD의 우선 과제이며, 모든 시민을 위한 효율성과 접근성을 보장합니다."
 HOL_commitment_to_security: "안보에 대한 헌신"
 HOL_commitment_to_security_desc: "국가의 안보를 보장하는 것은 최우선 과제입니다. VVD는 시민을 보호하고 법치를 수호하기 위해 경찰과 군에 투자할 것입니다."
 HOL_public_private_partnerships: "민관 협력"
 HOL_public_private_partnerships_desc: "VVD는 기반시설 개발을 강화하고 협력적 노력을 통해 경제 성장을 이끌기 위한 민관 협력을 지지합니다."
 HOL_increase_cyber_security: "사이버 보안 강화"
 HOL_increase_cyber_security_desc: "점점 더 디지털화되는 세상에서 VVD는 국가 기반시설과 디지털 자산을 사이버 위협으로부터 보호하기 위해 사이버 보안 조치에 투자할 것입니다."
 HOL_privatize_health_sector: "의료 부문 민영화"
 HOL_privatize_health_sector_desc: "의료 체계에 시장 기제를 도입하면 효율성이 높아지고 비용이 줄어 모두에게 더 나은 서비스 제공이 보장될 것입니다."
 HOL_woningbouwimpuls: "주택 개발"
 HOL_woningbouwimpuls_desc: "주택 부족을 해결하는 것은 매우 중요합니다. VVD는 주택을 더 저렴하고 접근하기 쉽게 만들기 위해 주택 건설을 가속화할 것입니다."
 HOL_economy_based_education: "경제 기반 교육"
 HOL_economy_based_education_desc: "교육 과정을 시장의 필요에 맞추면 학생들이 수요가 높은 기술을 익혀 취업 가능성과 경제를 모두 끌어올릴 수 있을 것입니다."
 HOL_innovation_subsidies: "혁신 보조금"
 HOL_innovation_subsidies_desc: "혁신적인 사업에 보조금을 지급하면 창의성과 기술 발전의 문화가 조성되어 경제 성장과 경쟁력을 이끌 것입니다."
 HOL_excellent_schools: "우수 학교 도입"
 HOL_excellent_schools_desc: "우수 학교의 설립을 장려하면 교육 수준과 성과가 높아져 우리 아이들이 최상의 교육을 받을 수 있을 것입니다."
 HOL_invest_clean_energy: "청정 에너지에 투자"
 HOL_invest_clean_energy_desc: "청정 에너지 기술에 대한 투자는 화석 연료 의존도를 줄이고 탄소 배출을 낮추는 데 매우 중요합니다. VVD는 재생 에너지 사업과 지속 가능한 관행을 지원할 것입니다."
 HOL_decrease_trade_bureaucracy: "무역 관료주의 축소"
 HOL_decrease_trade_bureaucracy_desc: "무역의 관료적 장애물을 줄이면 국제 거래가 더 원활하고 빨라질 것입니다. VVD는 수출 효율을 높이기 위해 무역 절차를 간소화하는 것을 목표로 합니다."
 HOL_mkb_actieplan: "중소기업 행동 계획"
 HOL_mkb_actieplan_desc: "중소기업(SME) 지원은 경제 성장에 필수적입니다. VVD는 중소기업에 세금 감면, 보조금, 규제 부담 완화를 제공하는 행동 계획을 시행할 것입니다."
 HOL_nederland_digitaal: "디지털 네덜란드"
 HOL_nederland_digitaal_desc: "VVD는 완전히 디지털화된 정부와 공공 서비스 부문을 구상합니다. 첨단 IT 기반시설과 전자 정부 사업에 투자함으로써 우리는 모든 시민을 위한 효율성, 투명성, 접근성을 높일 것입니다."
 HOL_balkenende: "발케넨더 시대의 시작"
 HOL_balkenende_desc: "얀 페터르 발케넨더의 지도력은 연대, 책임, 관리라는 기독교 민주주의 가치를 강조합니다. 그의 실용적인 통치 방식은 경제 성장과 사회 정의, 환경적 지속 가능성 사이의 균형을 맞추는 것을 목표로 합니다."
 HOL_invest_in_police: "경찰에 투자"
 HOL_invest_in_police_desc: "경찰력의 수용 능력과 역량을 강화하면 공공 안전이 보장되고 법치가 수호되어 모든 시민을 위한 안전한 환경이 조성될 것입니다."
 HOL_prohibit_soft_drugs: "소프트 드러그 금지"
 HOL_prohibit_soft_drugs_desc: "공중 보건과 사회 질서를 지키기 위해 CDA는 소프트 드러그에 대한 규제를 강화하여 그 공급을 줄이고 관련 폐해를 완화할 것입니다."
 HOL_unhcr_migration_office: "UNHCR 이주 사무소"
 HOL_unhcr_migration_office_desc: "네덜란드 내 UNHCR 이주 사무소 설립을 지원하면 망명 및 난민 문제를 효과적이고 인도적으로 관리하는 우리의 능력이 높아질 것입니다."
 HOL_skilled_immigration: "숙련 이민만 허용"
 HOL_skilled_immigration_desc: "숙련 이민에 집중하면 새로 온 이들이 우리 경제와 사회에 긍정적으로 기여하여, 사회 결속을 유지하면서 노동 시장의 필요를 충족할 수 있을 것입니다."
 HOL_solidarity_healthcare: "연대 의료"
 HOL_solidarity_healthcare_desc: "CDA는 연대에 기반한 의료 체계를 믿습니다. 모든 사람이 양질의 의료에 접근할 수 있도록 보장함으로써 더 포용적이고 서로를 지지하는 사회를 만들고자 합니다."
 HOL_living_care: "주거와 돌봄"
 HOL_living_care_desc: "주거 시설과 돌봄 시설을 통합하면 고령 인구가 지역 사회 안에서 필요한 지원을 받을 수 있게 되어 존엄과 복지가 증진될 것입니다."
 HOL_family_ministry: "가족부"
 HOL_family_ministry_desc: "가족부를 설립하면 가정생활을 지원하는 노력이 일원화되어, 정부 전반의 정책이 가족의 복지를 증진하는 방향으로 조율될 것입니다."
 HOL_invest_childcare: "보육 투자"
 HOL_invest_childcare_desc: "저렴하고 질 높은 보육에 대한 접근은 맞벌이 가정에 매우 중요합니다. CDA는 부모와 아이들을 지원하기 위해 보육 서비스에 대한 재정 지원을 늘릴 것입니다."
 HOL_child_subsidies: "아동 보조금"
 HOL_child_subsidies_desc: "자녀가 있는 가정에 재정 지원을 제공하면 가정을 꾸리는 데 드는 비용 부담이 덜어지고 우리의 가장 어린 시민들의 복지가 증진될 것입니다."
 HOL_nederland_sportland: "스포츠 국가 네덜란드"
 HOL_nederland_sportland_desc: "스포츠와 신체 활동을 장려하는 것은 건강한 사회에 필수적입니다. CDA는 활동적인 생활 방식을 장려하기 위해 스포츠 시설과 프로그램에 투자할 것입니다."
 HOL_invest_in_clean_energy: "청정 에너지에 투자"
 HOL_invest_in_clean_energy_desc: "청정 에너지 기술에 대한 투자는 지속 가능한 미래에 매우 중요합니다. CDA는 탄소 배출을 줄이기 위한 재생 에너지 사업과 구상을 지원할 것입니다."
 HOL_financial_freedom_schools: "학교의 재정적 자유"
 HOL_financial_freedom_schools_desc: "학교에 재정적 자율성을 부여하면 학교가 학생들의 필요에 더 잘 대응하고 교육 제공 방식을 혁신할 수 있을 것입니다."
 HOL_practical_job_education: "실무 직업 교육"
 HOL_practical_job_education_desc: "실무 직업 교육에 집중하면 학생들이 노동 시장에 필요한 기술을 익혀 실업을 줄이고 경제 성장을 촉진할 수 있을 것입니다."
 HOL_business_risk_law: "기업 위험 법"
 HOL_business_risk_law_desc: "근로자의 복지를 보장하기 위해 CDA는 기업이 질병 시에도 근로자에 대한 책임을 지도록 요구하는 법을 시행할 것입니다. 이 정책은 근로자의 권리를 보호하고 더 건강하며 지지적인 근무 환경을 조성하는 것을 목표로 합니다."
 HOL_maatschappelijk_ondernemen: "사회적 책임 경영"
 HOL_maatschappelijk_ondernemen_desc: "사회적으로 책임 있는 기업 활동을 장려하면 기업이 사회에 긍정적으로 기여하며 이윤과 사회적, 환경적 책임 사이의 균형을 맞추게 될 것입니다."
 HOL_remove_trade_tape: "무역 관료적 형식주의 철폐"
 HOL_remove_trade_tape_desc: "무역의 관료적 장벽을 줄이면 국제 거래가 더 원활하고 효율적으로 이루어져 수출과 경제 성장이 촉진될 것입니다."
 HOL_diversify_housing: "주택 다양화"
 HOL_diversify_housing_desc: "주택 부족을 해결하고 저렴한 주거 선택지를 제공하기 위해 CDA는 사회 주택, 임대 주택, 자가 주택을 포함한 다양한 주택 사업에 투자할 것입니다."
 HOL_balkenende_resigns: "발케넨더 4기 사임"
 HOL_balkenende_resigns_desc: "각료 순환이라는 CDA의 원칙에 따라 얀 페터르 발케넨더 총리가 두 번의 임기를 마치고 물러났습니다. 이 결정은 발케넨더 4기 내각의 종말과 CDA의 새로운 장의 시작을 알리며, 당내에 새로운 시각과 지도력을 보장합니다."
 HOL_maxime_verhagen: "막심 페르하언"
 HOL_maxime_verhagen_desc: "막심 페르하언은 실용적인 지도력으로 유명한 노련한 외교관이자 연립 구축자입니다. 국제 동맹의 강화와 안정 유지에 주력한 그는 네덜란드와 세계 정치 양쪽에서 존경받는 인물이 되었습니다."
 HOL_trust_in_people: "사람에 대한 신뢰"
 HOL_trust_in_people_desc: "시민에 대한 신뢰를 쌓는 것은 결속력 있는 사회에 필수적입니다. CDA는 개인에게 힘을 실어 주고 상호 존중을 키우는 정책을 장려할 것입니다."
 HOL_trust_in_organizations: "조직에 대한 신뢰"
 HOL_trust_in_organizations_desc: "CDA는 조직의 청렴성과 투명성을 높여 조직이 윤리적으로 운영되고 사회에 긍정적으로 기여하도록 보장할 것입니다."
 HOL_active_society: "활동적인 사회"
 HOL_active_society_desc: "적극적인 시민 의식과 지역 사회 참여를 장려하는 것은 CDA 비전의 핵심입니다. 우리는 자원봉사와 시민 참여를 촉진하는 사업을 지원할 것입니다."
 HOL_micro_credit: "소액 신용 허용"
 HOL_micro_credit_desc: "소액 신용에 대한 접근을 용이하게 하면 소규모 사업체와 기업가에게 힘이 실려 풀뿌리 차원에서 경제 성장과 혁신을 이끌게 될 것입니다."
 HOL_public_private_innovation: "민관 혁신"
 HOL_public_private_innovation_desc: "민간과 공공 부문 사이의 협력을 장려하면 혁신이 촉진되고 공공 서비스의 효율성과 실효성이 높아질 것입니다."
 HOL_heavy_efforts_clean_industry: "청정 에너지 집중 추진"
 HOL_heavy_efforts_clean_industry_desc: "청정 에너지를 촉진하는 노력을 강화하면 우리의 탄소 발자국이 줄어들고 네덜란드의 지속 가능한 미래가 보장될 것입니다."
 HOL_invest_bio_agriculture: "바이오 농업에 투자"
 HOL_invest_bio_agriculture_desc: "친환경 농업 사업을 지원하면 지속 가능한 영농 방식이 촉진되어 우리 환경과 식량 공급의 장기적 건강이 보장될 것입니다."
 HOL_buma: "시브란트 판 하르스마 부마"
 HOL_buma_desc: "발케넨더의 사임에 따라 시브란트 판 하르스마 부마가 CDA를 이끌며 전통적 가치와 사회 정의에 새롭게 집중합니다."
 HOL_reform_justice_system: "사법 제도 개혁"
 HOL_reform_justice_system_desc: "사법 제도를 개혁하면 공정성, 효율성, 접근성이 높아져 모든 시민이 정의에 평등하게 접근할 수 있게 될 것입니다."
 HOL_modern_investments_police: "현대적 경찰 투자"
 HOL_modern_investments_police_desc: "경찰력에 대한 추가 투자는 공공 안전을 보장하고 법치를 수호하여 모든 시민을 위한 안전한 환경을 조성할 것입니다."
 HOL_traditional_values: "전통적 가치"
 HOL_traditional_values_desc: "CDA는 가족, 공동체, 사회적 책임을 비롯한 전통적 가치를 우리 사회의 토대로서 지키는 데 계속 전념합니다."
 HOL_rentmeesterschap: "청지기 정신"
 HOL_rentmeesterschap_desc: "'청지기 정신(rentmeesterschap)'의 원칙을 받아들여 CDA는 자원의 지속 가능한 관리를 장려하여 경제 성장을 촉진하는 동시에 미래 세대를 위해 자원을 보존하도록 보장할 것입니다."
 HOL_green_economy: "녹색 경제"
 HOL_green_economy_desc: "녹색 경제로의 전환은 지속 가능한 발전에 필수적입니다. CDA는 친환경 기술과 관행을 장려하는 사업을 지원하여 경제 성장과 환경 보호 사이의 균형을 맞출 것입니다."
 HOL_reduce_european_influence: "유럽의 영향력 축소"
 HOL_reduce_european_influence_desc: "네덜란드의 주권을 지키고 국익이 우선시되도록 보장하기 위해 CDA는 국내 정책에 대한 유럽 연합의 영향력 축소를 주장할 것입니다."
 HOL_fortress_of_values: "가치의 요새"
 HOL_fortress_of_values_desc: "시브란트 부마는 전통적 가치와 회복력을 장려하여 네덜란드의 사회적 결속과 민족 정체성을 강화하는 것을 목표로 합니다. 그의 정책은 네덜란드 문화와 유산의 보호를 강조하며 단결되고 안전한 국가를 만드는 데 주력합니다. 국가의 핵심 원칙을 강화함으로써 부마는 외부의 위협과 내부의 분열에 굳건히 맞서고, 강하고 자부심 있는 시민층을 북돋우는 사회를 만들고자 합니다."
 HOL_melkert_surprise: "멜케르트의 깜짝 승리"
 HOL_melkert_surprise_desc: "아트 멜케르트의 지도 아래 PvdA는 국가를 되살리기 위한 예상치 못한 혁신적인 정책을 도입했습니다. 이러한 사업은 긍정적인 변화를 가져오고 더 포용적이고 번영하는 사회의 토대를 마련할 것을 약속합니다."
 HOL_inclusive_society: "포용 사회"
 HOL_inclusive_society_desc: "모든 사람이 존중받고 가치 있다고 느끼는 포용 사회를 만드는 것은 PvdA의 핵심 원칙입니다. 우리는 다양성을 지지하고 사회 결속을 촉진하는 정책을 시행하여 모든 시민이 지역 사회에 온전히 참여할 수 있도록 할 것입니다."
 HOL_democratic_active_government: "민주적이고 적극적인 정부"
 HOL_democratic_active_government_desc: "PvdA는 민주주의 제도를 강화하고 정치에 대한 시민의 적극적인 참여를 장려하는 데 전념합니다. 우리는 정부가 투명하고, 책임을 지며, 모든 시민의 요구에 응답하도록 보장할 것입니다."
 HOL_strong_european_union: "강력한 유럽 연합"
 HOL_strong_european_union_desc: "PvdA는 강력하고, 민주적이며, 사회적으로 책임 있는 유럽 연합을 지지합니다. 우리는 EU 회원국 간의 협력과 연대를 촉진하며 더 깊은 경제적, 정치적 통합을 위해 노력할 것입니다."
 HOL_accessible_healthcare: "접근 가능한 의료"
 HOL_accessible_healthcare_desc: "모든 사람이 양질의 의료에 접근할 수 있도록 보장하는 것은 PvdA의 우선 과제입니다. 우리는 공공 의료 서비스를 확대하고, 대기 시간을 줄이며, 의료가 모두에게 계속 감당할 수 있는 수준이 되도록 보장할 것입니다."
 HOL_social_security: "모두를 위한 사회 보장"
 HOL_social_security_desc: "사회 보장 제도를 강화하는 것은 사회의 가장 취약한 구성원을 보호하는 데 매우 중요합니다. PvdA는 복지 급여가 모든 시민의 기본적인 필요를 충족하기에 충분하도록 보장하여 어려운 시기에 도움을 제공할 것입니다."
 HOL_work_care_for_all: "모두를 위한 일과 돌봄"
 HOL_work_care_for_all_desc: "PvdA는 모든 사람에게 유급 노동과 양질의 의료에 대한 접근을 보장합니다. 우리는 사람들이 일, 돌봄 책임, 개인의 성장을 조화시킬 수 있도록 돕는 정책을 지원하여 더 지지적이고 포용적인 사회를 만들 것입니다."
 HOL_fair_wages: "공정한 임금과 복지"
 HOL_fair_wages_desc: "모든 근로자에게 공정한 임금과 복지를 보장하는 것은 소득 불평등을 줄이는 데 필수적입니다. PvdA는 공정한 임금 관행을 장려하고 단체 교섭을 지원하는 정책을 시행하여 가장 취약한 이들의 경제적 안정을 보장할 것입니다."
 HOL_job_creation_security: "일자리 창출과 보장"
 HOL_job_creation_security_desc: "모든 시민을 위한 일자리 기회를 창출하는 것은 필수적입니다. PvdA는 직업 훈련 프로그램에 투자하고, 소규모 사업체를 지원하며, 모든 사람이 의미 있는 일자리를 찾을 기회를 갖도록 보장하여 고용 안정을 촉진하고 실업을 줄일 것입니다."
 HOL_quality_education_for_all: "모두를 위한 양질의 교육"
 HOL_quality_education_for_all_desc: "모든 수준의 교육에 대한 투자는 모든 아동과 성인이 양질의 학습 기회에 접근할 수 있도록 보장하는 열쇠입니다. PvdA는 직업 훈련과 평생 학습 사업을 지원하고 교육 과정이 노동 시장의 필요를 충족하도록 보장할 것입니다."
 HOL_sustainable_economic_growth: "지속 가능한 경제 성장"
 HOL_sustainable_economic_growth_desc: "PvdA는 모든 시민에게 혜택이 돌아가는 지속 가능한 경제 성장에 주력합니다. 우리는 재생 에너지, 혁신, 친환경 기술에 투자하여 미래 세대를 위한 회복력 있고 지속 가능한 경제를 구축할 것입니다."
 HOL_invest_childcare_pvda: "사회적 보육 투자"
 HOL_invest_childcare_pvda_desc: "보육 서비스에 대한 재정 지원을 늘리는 것은 맞벌이 부모를 지원하고 영유아 발달을 촉진하는 데 필수적입니다. PvdA는 저렴하고 질 높은 보육 선택지를 모든 가정이 이용할 수 있도록 보장할 것입니다."
 HOL_elderly_care: "노인 돌봄"
 HOL_elderly_care_desc: "노인을 위한 포괄적인 돌봄 서비스를 제공하는 것은 PvdA의 우선 과제입니다. 우리는 지역 사회 기반 돌봄을 장려하고 가족 돌봄 제공자를 지원하여, 고령 인구가 존엄과 자립 속에서 살아가는 데 필요한 지원을 받도록 보장할 것입니다."
 HOL_child_youth_welfare: "아동 및 청소년 복지"
 HOL_child_youth_welfare_desc: "아동과 청소년의 복지와 성장을 지원하는 프로그램에 투자하는 것은 필수적입니다. PvdA는 교육, 의료, 여가 기회에 대한 접근을 보장하여 우리의 가장 어린 시민들의 복지를 증진할 것입니다."
 HOL_social_tech_revolution: "기술 혁명"
 HOL_social_tech_revolution_desc: "기술 혁명을 받아들이는 것은 모든 사람이 정보 사회에 참여할 수 있도록 보장하는 데 매우 중요합니다. PvdA는 교육, 디지털 기반시설, 디지털 격차를 해소하는 사업에 투자하여 기술 혁신과 포용성을 촉진할 것입니다."
 HOL_green_urban_development: "녹색 도시 개발"
 HOL_green_urban_development_desc: "높은 주거 밀도와 높은 삶의 질을 결합한 지속 가능한 도시 개발을 촉진하는 것은 PvdA의 우선 과제입니다. 우리는 녹색 기반시설과 공공 공간에 투자하여 도시가 강하고, 포용적이며, 친환경적이 되도록 할 것입니다."
 HOL_sustainable_agriculture: "지속 가능한 농업"
 HOL_sustainable_agriculture_desc: "지속 가능한 농업 방식을 지원하는 것은 식량 안보와 환경 보호에 필수적입니다. PvdA는 유기농 영농과 책임 있는 토지 이용을 장려하고 농업 오염을 줄여 건강하고 지속 가능한 식량 공급을 보장할 것입니다."
 HOL_renewable_energy_investments: "재생 에너지 투자"
 HOL_renewable_energy_investments_desc: "재생 에너지원에 대한 대규모 투자는 화석 연료 의존도를 줄이고 기후 변화에 맞서는 데 매우 중요합니다. PvdA는 태양광, 풍력, 수력 발전 사업을 지원하여 지속 가능한 에너지 미래를 구축할 것입니다."
 HOL_new_socialist_age: "사회민주주의의 새 시대"
 HOL_new_socialist_age_desc: "시대에 맞는 실효성을 유지하기 위해 PvdA는 현대 사회의 요구에 더 잘 대응하도록 변화를 겪을 것입니다. 여기에는 정책의 갱신, 새로운 세대와의 소통, 혁신적인 통치 방식의 수용이 포함됩니다."
 HOL_samsom: "삼솜"
 HOL_samsom_desc: "디데릭 삼솜이 PvdA의 새 지도자로 선출되었습니다. 강력한 환경 노선으로 알려진 삼솜은 사회 정의와 포용성을 유지하면서 정당을 더 친환경적이고 지속 가능한 미래로 이끄는 것을 목표로 합니다."
 HOL_environmental_vision: "환경 비전"
 HOL_environmental_vision_desc: "디데릭 삼솜의 지도 아래 PvdA는 환경적 지속 가능성을 최우선으로 할 것입니다. 우리는 천연자원을 보호하고 미래 세대를 위한 건강한 환경을 조성하는 포괄적인 정책을 시행할 것입니다."
 HOL_green_economy_pvda: "녹색 경제"
 HOL_green_economy_pvda_desc: "디데릭 삼솜은 친환경 기술과 지속 가능한 관행을 장려하여 녹색 경제로 전환할 것을 주장합니다. 이는 일자리를 창출하고, 혁신을 이끌며, 환경을 보호할 것입니다."
 HOL_circular_economy: "순환 경제"
 HOL_circular_economy_desc: "폐기물을 줄이고 지속 가능성을 촉진하기 위해 우리는 자재를 재사용, 수리, 재활용하는 순환 경제를 발전시킬 것입니다. 이 접근 방식은 지속 가능한 생산 주기를 보장하고 환경 영향을 최소화합니다."
 HOL_energy_transition: "녹색 에너지 전환"
 HOL_energy_transition_desc: "에너지 전환을 가속하는 것은 지속 가능한 미래에 매우 중요합니다. 우리는 화석 연료를 단계적으로 폐지하고, 재생 에너지에 투자하며, 에너지 저장과 효율 분야의 혁신을 지원할 것입니다."
 HOL_digital_innovation: "디지털 혁신"
 HOL_digital_innovation_desc: "디지털 혁신을 촉진하는 것은 경제 성장과 현대화에 필수적입니다. 우리는 기술 스타트업을 지원하고, IT 기반시설에 투자하며, 디지털 소양을 높여 네덜란드가 기술 발전의 최전선에 서도록 할 것입니다."
 HOL_social_justice: "사회 정의"
 HOL_social_justice_desc: "사회 정의를 보장하는 것은 디데릭 삼솜 비전의 핵심입니다. 우리는 소득 불평등을 해소하고, 기회 균등을 촉진하며, 모든 시민이 사회에 온전히 참여할 수 있도록 보장할 것입니다."
 HOL_inclusive_society_pvda: "포용 사회"
 HOL_inclusive_society_pvda_desc: "모든 사람이 존중받고 가치 있다고 느끼는 포용 사회를 구축하는 것은 필수적입니다. 우리는 삶의 모든 측면에서 다양성과 포용을 지지하는 정책을 장려할 것입니다."
 HOL_innovation_in_education: "교육의 사회적 혁신"
 HOL_innovation_in_education_desc: "학생들이 미래를 준비할 수 있도록 교육을 현대화하는 것이 핵심입니다. 우리는 디지털 학습 도구, STEM 교육, 교사 연수에 투자하여 질 높은 교육 체계를 보장할 것입니다."
 HOL_affordable_living: "감당할 수 있는 주거"
 HOL_affordable_living_desc: "감당할 수 있는 주거 환경을 보장하는 것은 우선 과제입니다. 우리는 사회 주택에 투자하고, 임대 시장을 규제하며, 모두가 주택을 감당할 수 있도록 보조금을 제공할 것입니다."
 HOL_public_health_initiatives: "공중 보건 사업"
 HOL_public_health_initiatives_desc: "포괄적인 공중 보건 사업을 지원하는 것은 매우 중요합니다. 우리는 예방 의료, 정신 건강, 건강 격차 해소에 주력하여 모든 사람이 양질의 의료에 접근할 수 있도록 보장할 것입니다."
 HOL_fusion_groenlinks: "흐룬링크스와 통합"
 HOL_fusion_groenlinks_desc: "노동당과 흐룬링크스가 프란스 팀머만스의 지도 아래 힘을 합칠 때가 왔습니다. 우리의 공통된 가치와 진보적 비전을 합침으로써 우리는 기후 행동, 사회적 평등, 네덜란드의 지속 가능한 미래를 옹호하는 단일 전선을 구축할 수 있습니다."
 HOL_asscher: "아스허르"
 HOL_asscher_desc: "로데베이크 아스허르가 PvdA의 새 지도자로 선출되었습니다. 노동 시장, 사회 보장, 통합에 대한 관심으로 알려진 아스허르는 정당을 더 큰 사회적 형평성과 경제적 회복력으로 이끄는 것을 목표로 합니다."
 HOL_labour_market_reforms: "노동 시장 개혁"
 HOL_labour_market_reforms_desc: "로데베이크 아스허르는 포용적인 노동 시장을 만드는 데 전념합니다. 우리는 직업 훈련 프로그램을 지원하고, 차별에 맞서며, 모든 근로자의 공정한 임금을 보장할 것입니다."
 HOL_integration_policies: "통합 정책"
 HOL_integration_policies_desc: "효과적인 통합 정책을 촉진하는 것은 결속력 있는 사회를 구축하는 열쇠입니다. 아스허르는 이민자와 난민이 네덜란드 사회에 통합되도록 돕는 사업을 지지합니다."
 HOL_workplace_equality: "직장 내 평등"
 HOL_workplace_equality_desc: "직장 내 평등을 보장하는 것은 공정하고 정의로운 사회에 필수적입니다. 아셔는 차별을 방지하고 직장 내 다양성을 증진하는 정책을 시행할 것입니다."
 HOL_strengthening_social_security: "사회보장 강화"
 HOL_strengthening_social_security_desc: "견고한 사회보장 제도를 보장하는 것이 핵심입니다. 아셔는 가장 취약한 계층을 보호하고 어려운 시기에 지원을 제공하는 정책을 시행할 것입니다."
 HOL_child_welfare: "아동 복지"
 HOL_child_welfare_desc: "아동의 복리를 보장하는 것은 최우선 과제입니다. 아셔는 유아 교육, 보건, 가족 지원 서비스를 포함한 아동 복지 프로그램에 대한 예산 확대를 주장합니다."
 HOL_social_innovation: "사회 혁신"
 HOL_social_innovation_desc: "사회 혁신을 촉진하는 것은 복잡한 사회적 과제를 해결하는 데 필수적입니다. 우리는 혁신적인 해법을 개발하기 위한 협력을 장려하는 구상을 지원할 것입니다."
 HOL_educational_equity: "교육 형평성"
 HOL_educational_equity_desc: "모든 학생을 위한 교육 형평성을 보장하는 것은 매우 중요합니다. 아셔는 소외 지역의 학교에 투자하고, 어려움을 겪는 학생들에게 추가 지원을 제공하며, 포용적 교육을 촉진할 것입니다."
 HOL_poverty_reduction: "빈곤 감축"
 HOL_poverty_reduction_desc: "빈곤을 줄이는 것은 정의로운 사회에 필수적입니다. 우리는 사회 복지 급여 확대와 취약 계층에 대한 맞춤형 지원을 포함한 종합적인 빈곤 감축 프로그램을 시행할 것입니다."
 HOL_digital_literacy: "디지털 소양"
 HOL_digital_literacy_desc: "오늘날의 기술 세계에서 디지털 소양을 높이는 것은 매우 중요합니다. 아셔는 모든 시민이 디지털 경제에서 성공하는 데 필요한 역량을 갖추도록 하는 구상을 지지합니다."
 HOL_economic_resilience: "경제 회복력"
 HOL_economic_resilience_desc: "경제 회복력을 구축하는 것은 앞으로의 위기를 견뎌내는 데 필수적입니다. 우리는 다양한 경제 부문에 투자하고, 소규모 기업을 지원하며, 모든 시민을 위한 견고한 안전망을 마련할 것입니다."
 HOL_labour_rights: "노동자 권리"
 HOL_labour_rights_desc: "아셔는 노동자 권리의 강력한 옹호자입니다. 우리는 노동자 보호를 강화하고, 안전한 근로 환경을 보장하며, 단체 교섭권을 지지할 것입니다."
 HOL_sustainable_urban_development: "지속 가능한 도시 개발"
 HOL_sustainable_urban_development_desc: "지속 가능한 도시 개발을 지원하는 것은 살기 좋은 도시를 만드는 핵심입니다. 우리는 녹색 기반시설, 공공 공간, 지속 가능한 주택 사업에 투자할 것입니다."
 HOL_social_housing: "사회주택"
 HOL_social_housing_desc: "사회주택을 확충하는 것은 주택 위기를 해결하는 데 매우 중요합니다. 아셔는 모두가 안전하고 안정적인 거처를 가질 수 있도록 저렴한 주택의 건설과 개보수에 투자할 것입니다."
 HOL_bos: "보스"
 HOL_bos_desc: "바우터 보스가 노동당(PvdA)의 새 대표로 선출되었습니다. 경제 전문성과 금융 위기 당시의 역할로 알려진 보스는 사회 정의를 보장하면서 당을 경제적 안정과 성장의 길로 이끌고자 합니다."
 HOL_economic_expertise: "경제 전문성"
 HOL_economic_expertise_desc: "바우터 보스는 경제 전문성으로 명성이 높습니다. 그의 지도 아래 노동당(PvdA)은 안정을 보장하고 지속 가능한 성장을 촉진하는 건전한 경제 정책을 시행하는 데 주력할 것입니다."
 HOL_crisis_management: "위기 관리"
 HOL_crisis_management_desc: "금융 위기를 관리한 바우터 보스의 경험은 매우 귀중합니다. 우리는 세계적 도전 속에서도 경제가 회복력을 유지하도록 강력한 조치를 시행할 것입니다."
 HOL_financial_sector_reform: "금융 부문 개혁"
 HOL_financial_sector_reform_desc: "금융 부문의 포괄적 개혁은 앞으로의 위기를 예방하고 투명성과 책임성을 높이는 데 필수적입니다. 바우터 보스는 금융 산업을 효과적으로 규제하기 위한 노력을 이끌 것입니다."
 HOL_progressive_taxation: "누진 과세"
 HOL_progressive_taxation_desc: "공정한 누진 세제를 시행하는 것은 불평등을 줄이고 공공 서비스를 위한 재원을 마련하는 핵심입니다. 보스가 이끄는 노동당(PvdA)은 가장 부유한 이들이 합당한 몫을 부담하도록 할 것입니다."
 HOL_affordable_housing: "저렴한 주택"
 HOL_affordable_housing_desc: "주택 위기를 해결하기 위해 바우터 보스는 저렴한 주택 공급을 늘리는 정책을 지지합니다. 우리는 사회주택 사업에 투자하고 모두가 내 집을 마련할 수 있도록 보조금을 제공할 것입니다."
 HOL_employment_opportunities: "고용 기회"
 HOL_employment_opportunities_desc: "충분한 고용 기회를 보장하는 것 또한 바우터 보스의 최우선 과제입니다. 국민의 일자리를 보장해야만 안정적이고 발전하는 사회를 건설할 수 있습니다."
 HOL_universal_healthcare: "보편적 의료"
 HOL_universal_healthcare_desc: "모든 사람이 양질의 의료에 접근할 수 있도록 보장하는 것은 바우터 보스의 우선 과제입니다. 우리는 공공 의료 서비스를 확대하고, 대기 시간을 줄이며, 의료비가 모두에게 감당 가능한 수준으로 유지되도록 할 것입니다."
 HOL_fiscal_responsibility: "재정 책임"
 HOL_fiscal_responsibility_desc: "바우터 보스는 필수 공공 서비스에 충분한 재원을 보장하면서 균형 예산을 유지하는 데 전념하고 있습니다. 재정 책임을 다함으로써 네덜란드 경제가 미래 세대를 위해 안정적이고 지속 가능하도록 할 것입니다."
 HOL_green_economic_growth: "녹색 경제 성장"
 HOL_green_economic_growth_desc: "장기적 번영을 보장하기 위해 바우터 보스는 녹색 및 지속 가능한 성장에 초점을 맞춘 경제 정책을 앞장서 추진할 것입니다. 우리는 청정 에너지, 녹색 일자리, 친환경 기반시설에 투자하여 경제의 미래를 대비하고 기후 변화에 맞설 것입니다."
 HOL_debt_relief_programs: "부채 구제 프로그램"
 HOL_debt_relief_programs_desc: "취약 계층의 재정적 부담을 덜어주기 위해 바우터 보스는 개인과 소규모 기업을 위한 부채 구제 프로그램을 시행할 것입니다. 이는 어려움을 겪는 가계와 기업가에게 힘을 실어주고 더 큰 경제적 이동성과 안정을 촉진할 것입니다."
 HOL_strengthening_eurozone: "유로존 강화"
 HOL_strengthening_eurozone_desc: "바우터 보스는 네덜란드 경제의 안정을 위해 강하고 회복력 있는 유로존이 중요하다는 점을 인식하고 있습니다. 유로존 강화를 위한 노력을 이끎으로써 장기적 번영을 보장하도록 EU 내의 재정 조정과 경제 협력을 촉진할 것입니다."
 HOL_small_business_support: "소규모 기업 지원"
 HOL_small_business_support_desc: "소규모 기업을 지원하는 것은 번영하는 경제의 핵심입니다. 바우터 보스는 소기업의 세금을 낮추고, 신용 접근성을 제공하며, 관료적 장벽을 줄여 소규모 기업이 성장하고 일자리를 창출할 수 있도록 하는 정책을 시행할 것입니다."
 HOL_lpf: "핌 포르퇴인의 밤"
 HOL_lpf_desc: "핌 포르퇴인 리스트(LPF)는 정치적 현상 유지를 깨기 위해 창당되었습니다. 핌 포르퇴인의 지도 아래 LPF는 국가 주권, 법과 질서, 그리고 자긍심 있고 자신감 넘치는 네덜란드 사회라는 가치를 옹호합니다. 이 운동은 기득권 정치 엘리트에 도전하고 네덜란드를 최우선으로 하는 과감한 개혁을 추진할 것입니다."
 HOL_support_sme: "중소기업 지원"
 HOL_support_sme_desc: "중소기업은 네덜란드 경제의 근간입니다. LPF는 규제를 줄이고 중소기업을 지원하여 이들이 번창하고 경제 성장을 이끌 수 있도록 할 것입니다."
 HOL_pvv: "빌더르스, 정치 무대에 오르다"
 HOL_pvv_desc: "헤이르트 빌더르스가 창당한 자유당(PVV)은 네덜란드의 주권, 문화 보존, 안보를 우선시하는 정책을 주장합니다. PVV는 이민을 줄이고, 국가적 자긍심을 되살리며, EU의 영향력에 맞서 네덜란드가 시민을 위한 안전하고 번영하는 조국으로 남도록 하는 것을 목표로 합니다. 이슬람 극단주의에 반대하고 전통적 가치를 수호하는 데 초점을 맞추는 PVV는 네덜란드의 정체성과 독립을 대변하는 목소리입니다."
 HOL_restore_royal_authority: "왕권 복원"
 HOL_restore_royal_authority_desc: "군주제는 네덜란드 통치의 근간으로서 그 권위를 다시 확립해야 합니다. 권력을 공고히 함으로써 왕실은 국가 내의 안정과 단결을 보장할 것입니다."
 HOL_establish_stadtholderate: "총독제 수립"
 HOL_establish_stadtholderate_desc: "현대적 총독제는 군주제의 지도적 영향력을 보존하면서 민주적 책임성을 보장하는, 균형 잡힌 통치 방식을 가능하게 할 것입니다."
 HOL_restore_royal_privileges: "왕실 특권 복원"
 HOL_restore_royal_privileges_desc: "군주제의 역사적 특권을 복원하여 안정을 보장하고 국가의 전통과 가치를 지킵니다."
 HOL_voc: "VOC의 정신 부활"
 HOL_voc_desc: "VOC(네덜란드 동인도 회사)는 한때 네덜란드의 세계적 영향력을 이끈 원동력으로, 무역과 혁신의 제국을 건설했습니다. 그 사명을 현대화함으로써 우리는 VOC의 정신을 되살려 21세기 세계 상업에 필수적인 핵심 지역에 대한 네덜란드의 영향력을 다시 확립할 수 있습니다."
 HOL_reclaim_voc_territories: "VOC 영토 수복 동원"
 HOL_reclaim_voc_territories_desc: "말의 시대는 지났습니다. VOC의 유산은 행동을 요구하며, 우리 군대는 선두에 설 준비가 되어 있습니다. 영광스러운 과거의 영토를 되찾음으로써 우리는 네덜란드의 영향력을 회복하고 다시 한번 세계적 강국으로서의 입지를 굳힐 것입니다."
 HOL_asml_tsmc_partnership: "ASML-TSMC 파트너십 구축"
 HOL_asml_tsmc_partnership_desc: "TSMC의 반도체 생산과 ASML의 리소그래피 전문성은 타이완을 기술의 전략적 결절점으로 만듭니다. ASML과 TSMC의 파트너십은 네덜란드가 세계 기술 경쟁에서 없어서는 안 될 참가자가 되도록 보장할 것입니다."
 HOL_voc_territory_focus: "인도네시아 너머의 VOC 영토에 집중"
 HOL_voc_territory_focus_desc: "VOC가 재건된 만큼, 우리는 인도네시아를 되찾을지 다른 핵심 영토에 집중할지 결정해야 합니다. 인도, 남아프리카, 타이완, 스리랑카 같은 지역에 집중함으로써 우리는 VOC의 세계적 연결망을 재건하고 전 세계에 네덜란드의 영향력을 주장할 수 있습니다. 인도네시아는 기다릴 수 있습니다. 우리의 야망은 그 해안을 훨씬 넘어서 뻗어 있습니다."
 HOL_wic: "서인도 회사 부활"
 HOL_wic_desc: "서인도 회사(WIC)는 한때 아메리카와 대서양에서 네덜란드 영향력의 초석이었습니다. 그 활동을 되살림으로써 우리는 전략적 영토에 대한 통제를 다시 확립하고, 무역을 증진하며, 서반구로 영향력을 확대하여 네덜란드의 존재를 과거의 영광으로 되돌릴 수 있습니다."
 HOL_d66: "D66"
 HOL_d66_desc: "D66은 네덜란드 진보주의의 등대로서 민주주의, 지속 가능성, 사회적 평등을 옹호합니다. 우리의 비전은 국가를 혁신, 포용, 협력의 미래로 이끌어, 모든 시민이 더 나은 내일을 만드는 데 발언권과 지분을 갖도록 보장하는 것입니다."
 HOL_d66_democratic_institutions: "민주주의 제도 강화"
 HOL_d66_democratic_institutions_desc: "D66은 민주주의의 토대를 지키는 데 전념하고 있습니다. 투명성, 책임성, 대중 참여를 높임으로써 우리는 정부가 국민에게 봉사하는 데 있어 공정하고 효과적으로 유지되도록 보장할 것입니다."
 HOL_d66_direct_democracy: "직접 민주주의 증진"
 HOL_d66_direct_democracy_desc: "시민은 자신의 삶에 영향을 미치는 정책을 형성하는 데 더 강한 발언권을 가질 자격이 있습니다. D66은 구속력 있는 국민투표와 참여 예산제 같은 구상을 옹호함으로써 의사 결정을 국민에게 더 가깝게 가져갈 것입니다."
 HOL_d66_rule_of_law: "법치 수호"
 HOL_d66_rule_of_law_desc: "법치는 공정하고 제대로 기능하는 사회에 필수적입니다. D66은 사법부의 독립을 보장하고, 시민의 자유를 보호하며, 모든 수준의 통치에서 부패와 싸우는 데 주력할 것입니다."
 HOL_d66_climate_action_plan: "기후 행동 계획 시행"
 HOL_d66_climate_action_plan_desc: "기후 위기는 우리 시대의 가장 큰 도전 중 하나입니다. 배출량 감축과 재생 에너지 촉진을 포함한 결정적인 조치를 취함으로써 D66은 지속 가능한 미래를 향한 노력을 이끌 것입니다."
 HOL_d66_green_energy: "녹색 에너지 투자 확대"
 HOL_d66_green_energy_desc: "재생 에너지원으로의 전환은 더 깨끗하고 푸른 미래를 보장하는 핵심입니다. D66은 화석 연료에 대한 의존을 줄이기 위해 풍력, 태양광 및 기타 지속 가능한 에너지 사업에 대한 투자를 우선시할 것입니다."
 HOL_d66_european_initiative: "유럽 협력 강화"
 HOL_d66_european_initiative_desc: "D66은 유럽 연합이 우리 모두의 번영과 안보에 필수적이라고 믿습니다. EU와의 유대를 강화하면 네덜란드가 유럽 공동체에서 영향력 있는 회원국으로 남도록 보장할 것입니다."
 HOL_d66_social_progress: "사회적 진보 촉진"
 HOL_d66_social_progress_desc: "평등, 포용, 정의는 진보적 사회의 초석입니다. D66은 불평등에 맞서고, 소수자를 보호하며, 모든 시민을 위한 평등한 기회를 촉진하는 정책을 옹호할 것입니다."
 HOL_d66_education_investments: "교육에 투자"
 HOL_d66_education_investments_desc: "교육은 미래 세대의 잠재력을 여는 열쇠입니다. D66은 모든 아동이 양질의 교육을 받을 수 있도록 재정 지원과 개혁을 우선시할 것입니다."
 HOL_sgp: "개혁정치당(SGP)"
 HOL_sgp_desc: "개혁정치당(SGP)은 기독교 보수주의의 보루입니다. 성경적 원칙에 따른 통치에 전념하는 SGP는 신앙, 가정, 전통에 뿌리를 둔 도덕적 사회를 주장합니다."
 HOL_gl: "흐뢰네링크스"
 HOL_gl_desc: "흐뢰네링크스는 지속 가능하고 공정하며 포용적인 사회에 헌신합니다. 환경주의와 사회 정의에 뿌리를 둔 이 정당은 녹색 에너지, 생물 다양성, 평등을 네덜란드 미래의 초석으로 옹호합니다."
 HOL_asml_high_na_euv: "High-NA EUV 리소그래피 개척"
 HOL_asml_high_na_euv_desc: "ASML의 차세대 TWINSCAN EXE 시스템은 리소그래피를 0.55 개구수까지 끌어올려 어떤 경쟁자도 따라올 수 없는 미세 회로를 인쇄합니다. High-NA EUV를 숙달하면 우리 장비는 지구상의 모든 최첨단 파운드리에 없어서는 안 될 존재로 남습니다."
 HOL_asml_imec_partnership: "imec과 공동 High-NA 연구소 개설"
 HOL_asml_imec_partnership_desc: "펠트호번에서 ASML과 연구 기관 imec은 공동 High-NA EUV 연구소를 운영하며, 칩 제조사와 소재 공급업체에 새로운 스캐너를 처음으로 접할 기회를 제공합니다. 이 연구소는 네덜란드를 세계에서 가장 앞선 반도체의 시험장으로 굳혀 줍니다."
 HOL_asml_brainport_campus: "브레인포트 산업 캠퍼스 확장"
 HOL_asml_brainport_campus_desc: "수십억 유로 규모의 정부 공약에 힘입어 ASML은 해외로 이전하는 대신 에인트호번 인근의 브레인포트 산업 캠퍼스에서 확장합니다. 새로운 청정실과 공급업체 시설이 칩 산업과 그 세수를 네덜란드 땅에 확고히 붙들어 둡니다."
 HOL_support_intervention_iraq: "이라크 개입 지지"
 HOL_support_intervention_iraq_desc: "9.11 테러 이후 중동의 불안정이 커지는 가운데, 미국은 대량살상무기의 위협과 권위주의 정권을 해체할 필요성을 내세워 이라크에 대한 군사 개입을 개시했습니다. 가까운 NATO 동맹이자 국제 안보의 옹호자로서 네덜란드는 이 작전을 지지할지 결정해야 합니다. 이 임무는 여전히 논란이 되고 있지만, 연합에 참여하면 대서양 횡단 파트너십을 재확인하고 세계 안보 노력에서 네덜란드의 영향력을 투사할 수 있을 것입니다."
 HOL_asml_partnership_USA: "ASML-미국 기술 파트너십 구축"
 HOL_asml_partnership_USA_desc: "ASML은 세계 반도체 산업의 중심에 서 있으며, 미국은 동서 간 분열이 커지는 가운데 기술적 우위를 확보하고자 합니다. 네덜란드와 미국의 연구 개발 부문 사이에 전략적 동맹을 맺음으로써 우리는 첨단 리소그래피, 사이버 방어, 항공우주 제조 분야에서 공동 혁신을 선도할 수 있습니다. 이 파트너십은 서방 방위 생태계에서 우리의 입지를 강화하겠지만 외교적 대가가 따를 수 있습니다."
 HOL_lng_cooperation: "셸-LNG 전략 협정 체결"
 HOL_lng_cooperation_desc: "21세기의 에너지 과제는 회복력, 다변화, 전략적 동맹을 요구합니다. 셸과의 LNG 협력을 확대하고 에너지 물류를 핵심 파트너와 일치시킴으로써 우리는 안정적인 연료 흐름을 확보하고, 기반시설 투자를 강화하며, 세계 공급망을 보강할 수 있습니다. 그러나 화석 연료 경로에 대한 의존이 깊어지면 환경적, 정치적 반발을 불러올 수 있습니다."
 HOL_d66_climate_action_planidea: "D66 기후 행동 계획"
 HOL_d66_climate_action_planidea_desc: "기후 변화에 맞서겠다는 대담한 공약과 함께, D66 기후 행동 계획은 재생 에너지로의 전환을 가속하고, 지속 가능성을 우선시하며, 배출량을 줄여 네덜란드를 세계 환경 노력의 선도국으로 자리매김하게 합니다."
 HOL_shell1: "로열 셸"
 HOL_shell1_desc: "공식적으로 로열 더치 셸로 알려진 셸은 네덜란드 헤이그에 본사를 두고 영국에 법인으로 등록된 다국적 석유 및 가스 기업입니다. 1907년에 설립된 셸은 세계 최대 에너지 기업 중 하나로, 탐사, 생산, 정제, 유통을 포함한 석유 및 가스 산업의 모든 측면에 관여하고 있습니다. 이 기업은 재생 에너지와 전기차 기반시설에도 상당한 지분을 가지고 있습니다."
 HOL_shell2a: "로열 그린 셸"
 HOL_shell2a_desc: "세계적인 에너지 거대 기업인 셸은 지속 가능한 미래로의 전환에 점점 더 주력하고 있습니다. 이 기업은 2050년까지 순배출 제로 에너지 기업이 되겠다는 야심 찬 목표를 세웠습니다. 셸은 풍력, 태양광, 바이오 연료를 포함한 재생 에너지원에 막대한 투자를 하고 있으며 전기차 기반시설 분야에서도 입지를 넓히고 있습니다. 탄소 포집 및 저장 같은 구상을 통해 셸은 탄소 발자국을 크게 줄이는 것을 목표로 합니다. 이러한 친환경 에너지로의 전환은 더 깨끗하고 지속 가능한 에너지 해법에 대한 세계적 수요 증가에 적응하려는 셸의 더 넓은 전략의 일부입니다."
 HOL_shell2b: "로열 셸"
 HOL_shell2b_desc: "세계 최대의 석유 및 가스 기업 중 하나인 셸은 여전히 화석 연료 산업의 지배적 세력입니다. 탐사, 채취, 정제, 유통에 걸친 방대한 운영망을 갖춘 셸은 세계 에너지 수요를 공급하는 데 중요한 역할을 합니다. 이 기업은 석유와 천연가스 생산에 전념하는 광범위한 매장량과 기반시설을 보유하여 세계 에너지 소비에 크게 기여하고 있습니다. 재생 에너지에 대한 투자가 늘고 있음에도 셸의 핵심 사업은 여전히 화석 연료에 크게 의존하고 있어, 진행 중인 세계 에너지 판도에서 핵심 주체로 자리하고 있습니다."
 HOL_dutch_trade1: "전설적인 상인들"
 HOL_dutch_trade1_desc: "네덜란드 상인들은 17세기 황금시대 이래 세계 상업에서 핵심적인 역할을 해 온 길고 유서 깊은 역사를 지니고 있습니다. 전략적 위치와 광범위한 항구망을 갖춘 네덜란드는 수 세기 동안 국제 무역의 거점이었습니다. 네덜란드 상인들은 세계 최초의 다국적 기업 중 하나인 네덜란드 동인도 회사(VOC)를 통해 세계 무역로를 구축하는 데 큰 역할을 했습니다. 오늘날에도 네덜란드 상인들은 특히 농업, 물류, 금융 같은 분야에서 세계 시장에 영향력을 행사하고 있습니다. 네덜란드 상인들은 물류 전문성, 공급망 관리의 혁신, 강력한 국제적 인맥으로 알려져 있으며, 이는 네덜란드가 세계 상업의 핵심 주체라는 명성을 유지하는 데 도움이 됩니다."
 HOL_project_beethoven_state_idea1: "베토벤 프로젝트"
 HOL_project_beethoven_state_idea1_desc: "베토벤 프로젝트는 브레인포트 에인트호번의 마이크로칩 부문을 위한 사업 환경과 기반시설을 강화하기 위해 네덜란드 정부가 지역 당국과 협력하여 추진하는 대규모 구상입니다. 이 프로젝트는 인재 육성, 기반시설 개선, 주택 같은 핵심 수요를 해결하여 반도체 기술 분야에서 이 지역의 세계적 경쟁력을 강화하는 것을 목표로 합니다. 이 투자는 ASML 같은 핵심 기업을 국내에 붙들어 두는 데 특히 중점을 두고, 네덜란드가 첨단 기술 산업의 선도 거점이라는 위상을 유지하는 데 필수적인 것으로 평가됩니다."
 HOL_randstad_economy1: "란트스타트 경제"
 HOL_randstad_economy1_desc: "란트스타트 경제는 암스테르담, 로테르담, 헤이그, 위트레흐트 도시를 둘러싼 고도로 도시화되고 인구 밀도가 높은 지역을 아우르는 네덜란드의 경제 중심지를 가리킵니다. 이 지역은 유럽에서 가장 중요한 경제 거점 중 하나로 네덜란드 경제에 크게 기여하고 있습니다. 란트스타트는 금융, 물류, 기술, 창조 산업, 무역을 핵심 부문으로 하는 다양한 경제 기반이 특징입니다. 암스테르담은 주요 금융 중심지 역할을 하고, 로테르담은 국제 무역에 필수적인 세계 최대 항구 중 하나를 보유하고 있습니다. 이 지역은 또한 고도로 숙련된 노동력, 견고한 기반시설, 혁신과 지속 가능성에 대한 강한 강조의 혜택을 누리며 네덜란드 경제 성장의 핵심 동력이 되고 있습니다."
 HOL_zuidas_development_idea: "자위다스 개발"
 HOL_zuidas_development_idea_desc: "자위다스 개발은 상업, 금융, 법률 서비스의 국제적 거점 역할을 하는 역동적인 업무 지구와 복합 용도 지역을 조성하는 것을 목표로 하는 암스테르담의 대규모 도시 사업입니다. 흔히 네덜란드의 금융 1마일로 불리는 자위다스에는 수많은 다국적 기업, 법률 사무소, 금융 기관이 입주해 있습니다. 이 개발은 단순한 업무 중심지를 넘어, 광범위한 주거 지역, 문화 시설, 녹지, 우수한 대중교통 연결을 포함한 양질의 기반시설을 갖추도록 설계되었습니다."
 HOL_international_peace_city_idea: "헤이그, 국제 평화와 정의의 도시"
 HOL_international_peace_city_idea_desc: "헤이그는 국제법과 외교의 세계적 중심지로서의 역할을 반영하는 '평화와 정의의 도시'라는 칭호로 국제적으로 인정받고 있습니다. 200개 이상의 국제기구가 있는 헤이그에는 국제사법재판소, 국제형사재판소, 상설중재재판소 같은 핵심 기관이 자리하고 있습니다. 이들 기관은 국제 분쟁을 해결하고, 전쟁 범죄를 기소하며, 세계적으로 인권을 증진하는 데 중요한 역할을 합니다."
 HOL_regio_economy1: "지방 경제"
 HOL_regio_economy1_desc: "네덜란드의 경제력은 점점 더 각 지역의 강점에 의해 움직이고 있습니다. 북부에서는 흐로닝언 같은 주가 재생 에너지에서 두각을 나타내고, 헬더란트 같은 동부 주는 첨단 제조업과 물류의 거점입니다. 북브라반트를 포함한 남부 주는 반도체와 생명공학 같은 첨단 산업을 선도합니다. 이러한 지역적 다양성은 균형 있고 회복력 있는 국가 경제를 보장하며, 각 지역이 국가의 전반적인 번영과 세계적 경쟁력에 크게 기여합니다."
 HOL_marine_moving: "해병대 이전"
 HOL_marine_moving_desc: "네덜란드 정부는 왕립 해병대(Korps Mariniers)를 현재의 도른 기지에서 플리싱언의 새 시설로 이전하기로 결정했습니다. 이 이전은 해병대에 현대적 기반시설을 제공하고 작전 역량을 강화하기 위한 것이었습니다. 젤란트 주의 플리싱언이 선택된 것은 지역 경제 발전을 촉진하고 해병대에 북해 인근의 전략적 위치를 제공하려는 목적도 있었습니다. 그러나 이전 계획은 인력과 그 가족에 미칠 영향에 대한 우려, 그리고 병참 및 재정적 난관으로 인해 반발에 직면했습니다."
 HOL_marine_moved: "현대식 해병대 기지"
 HOL_marine_moved_desc: "해병대(Korps Mariniers)의 플리싱언 새 기지로의 이전이 성공적으로 완료되었습니다. 이제 해병대는 작전 대비 태세를 크게 높여 주는 최첨단 시설에서 활동하고 있습니다. 플리싱언의 새 위치는 해상 작전을 위한 북해로의 신속한 접근을 포함한 전략적 이점을 제공합니다. 이 이전은 젤란트의 경제 성장에도 기여하여 일자리를 창출하고 이 지역에 투자를 유치했습니다. 계획 단계에서의 초기 난관과 반발에도 불구하고 전환은 원활하게 이루어졌으며, 해병대는 새로운 환경에 효과적으로 적응했습니다."
 HOL_marine_debate: "해병대 이전 논쟁"
 HOL_marine_debate_desc: "해병대의 이전이 의회에서 논쟁 중이며, 이는 절차를 지연시키고 군 내부에 불확실성을 불러일으키고 있습니다."
 HOL_marine_public_support: "해병대 이전에 대한 대중의 지지"
 HOL_marine_public_support_desc: "정부와 대중은 해병대의 플리싱언 이전에 찬성하고 있으며, 이는 해병대의 사기와 효율성을 높이고 있습니다."
 HOL_marine_relocation_cancelled: "해병대 이전 취소"
 HOL_marine_relocation_cancelled_desc: "해병대를 플리싱언으로 이전하려는 계획이 폐기되었습니다. 이 결정은 안정을 회복시키지만 해병대의 작전 능력을 감소시킵니다."
 HOL_local_communities_support: "이전에 대한 지역 사회 지지"
 HOL_local_communities_support_desc: "플리싱언 주변 지역 사회에 대한 투자는 해병대 이전에 대한 대중의 지지를 높여 지역 경제 성장과 생산 능력을 촉진했습니다."
 HOL_marine1: "왕립 해군(Koninklijke Marine)"
 HOL_marine1_desc: "왕립 해군(Koninklijke Marine)은 네덜란드군의 해군 부문으로 15세기로 거슬러 올라가는 기원을 지닌 세계에서 가장 오래된 해군 중 하나입니다. 국내외에서 네덜란드의 방어에 중요한 역할을 하며, NATO 작전, 평화 유지, 인도주의 활동을 포함한 다양한 국제 임무에도 참여합니다. 네덜란드 왕립 해군은 호위함, 잠수함, 초계함, 상륙함을 포함한 첨단의 다재다능한 함대로 알려져 있습니다. 해군은 또한 주로 해상 순찰, 수송, 수색 및 구조 임무를 위한 다양한 항공기와 헬리콥터를 운용합니다. 네덜란드의 정예 해병대인 해병대(Korps Mariniers)는 해군의 필수적인 일부로서 상륙 작전과 신속 대응 임무를 전문으로 합니다."
 HOL_submarine_modernization_idea: "잠수함 현대화"
 HOL_submarine_modernization_idea_desc: "잠수함 현대화는 노후화된 월러스급 잠수함의 개량에 초점을 맞춘 네덜란드 왕립 해군의 핵심 구상입니다. 이 개량에는 첨단 소나 체계, 향상된 스텔스 기능, 강화된 무장이 포함되어, 잠수함이 현대 해군 작전에서 계속 효과적이도록 보장합니다. 현대화는 잠수함의 운용 수명을 연장하고 세계 해양 안보 노력에서 전략적 중요성을 유지하는 것을 목표로 합니다."
 HOL_cmp_idea: "군수 생산 위원회(CMP)"
 HOL_cmp_idea_desc: "군수 생산 위원회(Commissariaat Militaire Productie, CMP)는 군 장비와 물자의 생산을 감독하고 조율하기 위해 설립된 네덜란드 정부 기구였습니다. 주된 역할은 특히 분쟁이나 군사적 대비 태세가 고조된 시기에 네덜란드 방위군이 충분히 장비를 갖추도록 보장하는 것이었습니다. CMP는 국내 산업과의 계약을 관리하고, 무기, 탄약, 차량 및 기타 군사 필수품의 생산을 규제하며, 이들이 요구되는 기준과 일정에 맞게 생산되도록 보장하는 책임을 맡았습니다."
 HOL_army2: "왕립 육군(Koninklijke Landmacht)"
 HOL_army2_desc: "코닌클레이커 란트마흐트, 즉 네덜란드 왕립 육군은 네덜란드군의 지상 병과로, 그 뿌리는 16세기로 거슬러 올라갑니다. 네덜란드 영토의 방어를 담당하며 NATO와 UN 평화유지 작전을 비롯한 국제 임무에도 기여합니다. 육군은 현대적인 차량, 포병, 통신 체계를 갖추고 있습니다. 네덜란드 왕립 육군은 국내외의 다양한 안보 과제에 대응할 준비가 된 다재다능한 전력입니다."
 HOL_defensienota_idea: "국방 백서 2022"
 HOL_defensienota_idea_desc: "2022년 국방 백서(Defensienota)는 네덜란드 국방부의 향후 방향과 우선순위를 규정한 전략 정책 문서입니다. 변화하는 국제 안보 환경을 다루며 더 강력하고 유연한 국방력의 필요성을 강조합니다. 주요 주제로는 국방비 증액, 군사 능력의 현대화, 특히 NATO와 유럽 연합 내에서의 국제 협력 강화가 있습니다. 이 문서는 사이버 방어, 정보, 첨단 기술에 대한 투자와 인력 및 준비태세의 확충을 부각합니다. 2022년 국방 백서는 네덜란드군이 현재와 새롭게 대두하는 위협에 대비하도록 하여 국가 안보와 세계 안정에 모두 기여하는 것을 목표로 합니다."
 HOL_air: "왕립 공군"
 HOL_air_desc: "코닌클레이커 루흐트마흐트, 즉 네덜란드 왕립 공군은 네덜란드군의 항공 병과로, 네덜란드 영공을 방어하고 국내외 군사 작전을 지원하는 임무를 맡고 있습니다. 1953년에 창설된 공군은 전투기, 수송기, 헬리콥터, 무인 항공기(UAV)를 포함한 현대적인 기단을 운용합니다. NATO 임무, 항공 경찰 활동, 신속 전개 능력에서 중요한 역할을 합니다. 코닌클레이커 루흐트마흐트는 인도적 지원과 재난 대응에도 참여하며 네덜란드 해외 영토의 안보에도 기여합니다. 첨단 기술과 고도로 훈련된 인원을 갖춘 네덜란드 왕립 공군은 국가 방위 전략의 핵심 요소입니다."
 HOL_dutch_army_doctrine1: "네덜란드 국방 비전"
 HOL_dutch_army_doctrine1_desc: "네덜란드 국방 비전(Nederlandse Defensievisie)은 네덜란드 국방부의 장기 비전과 목표를 제시한 전략 문서입니다. 이는 네덜란드군이 미래의 안보 과제에 대응하도록 발전하고 적응하기 위한 틀을 제공합니다. 국방 비전은 갈수록 복잡해지고 예측할 수 없는 세계 안보 환경에 대응하여 군의 유연성, 회복력, 기술 역량을 강화하는 데 중점을 둡니다."
 HOL_dutch_army_doctrine_change: "네덜란드 국방 비전 전환"
 HOL_dutch_army_doctrine_change_desc: "네덜란드 국방 비전 전환 국가 정신은 네덜란드군의 중대한 변혁 단계를 나타냅니다. 이는 새로운 능력의 개발, 사이버 방어 강화, 국제 협력 확대에 중점을 둔 현대화와 적응의 시기를 의미합니다. 이 국가 정신은 군의 회복력과 유연성을 높여 21세기의 도전에 대비하려는 의지를 보여 줍니다. 또한 전통과 혁신의 균형을 맞추며 네덜란드의 국방을 변화하는 세계 안보 수요에 맞추려는 집단적 노력을 구현합니다."
 HOL_marechaussee1: "왕립 군경찰대"
 HOL_marechaussee1_desc: "네덜란드 왕립 헌병대인 코닌클레이커 마레하우서는 국가 안보와 법 집행을 유지하는 데 중요한 역할을 합니다. 국경 통제, 공항 보안, 군 치안을 담당하는 군경찰대는 국내외에서 네덜란드의 안전과 안정을 보장합니다. 내부 보안, 출입국 관리, 공공질서 관리에 대한 전문성 덕분에 네덜란드 국방 구조 안에서 없어서는 안 될 전력입니다. 잘 훈련되고 적응력이 뛰어난 부대로서 민간 및 군사 작전을 모두 지원하며, 위기 시 국가의 회복력에 기여합니다."
 HOL_paars1: "자주색 정부의 종언"
 HOL_paars1_desc: "'파르스 II' 내각의 유산은 혁신, 실용주의, 균형 잡힌 통치로 요약되며, 이는 네덜란드의 다양한 정치 지형을 반영하고 향후 연립 정부의 선례를 세웠습니다."
 HOL_dbb: "경호 및 보안국"
 HOL_dbb_desc: "경호 및 보안국(Dienst Bewaken en Beveiligen, DBB)은 국가의 가장 중요한 인사와 핵심 자산을 보호하는 초석입니다. 정치 지도자, 왕실 구성원, 민감한 시설의 보호를 맡은 DBB는 비할 데 없는 경계심과 전문성으로 임무를 수행합니다."
 HOL_debt_reduction: "부채 감축"
 HOL_debt_reduction_desc: "VVD는 헤리트 잘름의 지도 아래 목표를 정한 부채 감축으로 재정 책임을 추진하며, 경제를 강화하고 장기적인 재정 안정을 보장합니다."
 HOL_liberal_society_modifier: "자유주의 사회"
 HOL_economy_education_research: "시장 주도 교육 개혁"
 HOL_economy_education_research_desc: "VVD는 수요가 높은 기술을 학생들이 갖추도록 교육 과정을 시장의 요구에 맞추는 데 집중합니다. 교육과 노동 시장 사이의 간극을 메움으로써 취업 가능성을 높이고 경제 성장을 이끌며, 미래 세대가 끊임없이 변화하는 고용 시장에서 성공할 수 있도록 충분히 준비시킵니다."
 HOL_ministry_of_family1: "가족부"
 HOL_ministry_of_family1_desc: "가족부는 네덜란드 전역 가정의 복지를 지원하는 데 전념합니다. 보육, 육아 휴직, 가족 지원 서비스와 관련된 정책을 수립하고 시행하여 가정이 번영하는 데 필요한 자원을 이용할 수 있도록 보장합니다. 가족부는 건강한 성장을 촉진하고 가족 간의 유대를 강화하는 양육 환경을 조성하기 위해 노력합니다."
 HOL_weed_center1: "네덜란드 대마 정책"
 HOL_weed_center1_desc: "네덜란드는 허가받은 '커피숍'에서의 소지와 판매가 엄격한 규제 아래 용인되는 독특한 대마 정책으로 알려져 있습니다. 이 실용적인 정책은 소프트 드러그와 하드 드러그 시장을 분리하고 범죄 활동을 줄이는 것을 목표로 합니다. 형식상으로는 불법이지만 개인 사용에 대해서는 사실상 비범죄화되어 있으며, 이는 공중 보건, 안전, 개인의 자유 사이의 균형 잡힌 접근을 반영합니다."
 HOL_unhcr1: "UNHCR의 이주 감독"
 HOL_unhcr1_desc: "유엔난민기구(UNHCR)가 이제 이전에 네덜란드가 관리하던 이주 정책과 절차를 감독합니다. 이러한 전환은 난민과 이주민의 보호 및 지원에 관한 국제 기준이 지켜지도록 보장하고, 세계적 이주 문제에 대해 더 조율되고 인도적인 접근을 제공하는 것을 목표로 합니다."
 HOL_balkenende_legend: "발켄엔더의 유산"
 HOL_balkenende_legend_desc: "얀 페터 발켄엔더의 총리 재임은 사회적 결속, 책임, 경제적 안정에 대한 강조로 특징지어집니다. '규범과 가치(normen en waarden)' 사회에 대한 그의 비전은 네덜란드의 도덕적, 윤리적 기반을 강화하는 것을 목표로 했습니다. 발켄엔더의 유산은 공동체와 개인의 책임을 모두 중시하는 균형 잡힌 통치 방식을 장려하며 네덜란드 정치에 계속 영향을 미치고 있습니다."
 HOL_green_socialism1: "녹색 사회주의"
 HOL_green_socialism1_desc: "PvdA는 사회 정의와 환경 지속 가능성이 함께 나아가는 미래를 그립니다. 녹색 사회주의는 사람과 지구 모두의 복지를 우선시하는 공정하고 평등한 사회를 옹호합니다. 야심 찬 기후 정책, 재생 에너지 투자, 노동자를 위한 정의로운 전환을 통해 PvdA는 누구도 소외시키지 않는 지속 가능한 경제를 만들고자 합니다."
 HOL_monarchy_law_blocking: "군주의 보복"
 HOL_monarchy_law_blocking_desc: "왕실의 결혼을 승인하지 않은 정부의 처사에 격분한 군주제는 보복의 수단으로 주요 법안을 가로막는 이례적인 조치를 취했습니다. 이러한 불복종 행위는 정계를 혼란에 빠뜨렸으며, 왕실은 자신의 영향력을 이용해 정부의 권위에 도전하고 있습니다. 긴장이 고조되면서 이 전례 없는 개입은 현대 통치에서 군주제의 역할과 권력에 관한 국민적 논쟁을 불러일으켰습니다."
 HOL_monarch_public_campaign: "대중 지지의 물결"
 HOL_monarch_public_campaign_desc: "왕실 결혼을 승인하지 않은 정부에 대응하여 대규모 대중 압박 운동이 일어났습니다. 전국의 시민들이 왕실 부부를 지지하며 결집하여 시위를 조직하고 청원서에 서명하며 정부가 입장을 재고할 것을 요구하고 있습니다. 이 지지의 물결은 정치 지도자들에게 엄청난 압박을 가했으며, 군주제에 대한 국민의 충성과 사랑하고 결혼할 권리가 정치적 경계를 넘어서야 한다는 염원을 부각했습니다."
 HOL_monarch_backlash: "대중의 환멸"
 HOL_monarch_backlash_desc: "정부의 거부에도 불구하고 결혼을 강행하기로 한 왕실 부부의 결정은 대중의 불만이 커지는 결과를 낳았습니다. 많은 이들이 이를 군주제가 월권을 하고 민주적 절차를 무시한 것으로 봅니다. 시민들이 현대 사회에서 군주제의 존재 의의를 의문시하며 반발은 빠르게 확산되었습니다. 왕실에 대한 신뢰가 무너지면서 개혁, 심지어 폐지를 요구하는 목소리가 힘을 얻고 있습니다."
 HOL_pro_gay_marriage: "최초의 동성 결혼 승인국"
 HOL_pro_gay_marriage_desc: "네덜란드는 동성 결혼을 합법화함으로써 사회 진보와 인권 분야의 세계적 선도국이 되었습니다. 이 조치는 관용적이고 포용적인 사회라는 국가 이미지를 강화했으며 국민 통합과 국제적 위신을 모두 높였습니다."
 HOL_anti_gay_marriage: "전통 혼인법"
 HOL_anti_gay_marriage_desc: "전통적 혼인법을 유지하기로 한 결정은 보수적 가치에 대한 강한 고수를 반영합니다. 이는 종교 및 전통주의 집단의 공감을 얻었지만 더 진보적인 목소리의 비판을 불러일으켰으며, 유럽 자유주의의 등대라는 국가의 명성에도 영향을 주었습니다."
 HOL_labour_market_reforms_idea: "노동 시장 개혁"
 HOL_labour_market_reforms_idea_desc: ""
 HOL_strong_social_security: "강력한 사회 보장"
 HOL_strong_social_security_desc: ""
 HOL_poverty_reduction_idea: "빈곤 감축 구상"
 HOL_poverty_reduction_idea_desc: "네덜란드는 빈곤을 줄이기 위한 종합적인 구상을 시작했습니다. 사회 복지 급여 확대, 취약 계층에 대한 맞춤 지원, 경제적 지원을 통해 정부는 사회에서 가장 불리한 처지의 구성원들을 끌어올리기 위해 노력하고 있습니다. 이 프로그램은 더 공평하고 포용적인 경제를 만들기 위해 설계되었습니다."
 HOL_poverty_reduced: "빈곤의 대폭 감소"
 HOL_poverty_reduced_desc: "복지 프로그램과 사회 개혁의 성공적인 시행을 통해 네덜란드의 빈곤이 크게 줄어들었습니다. 경제적 포용성과 소외 계층 지원에 대한 국가의 노력은 더 큰 사회 안정, 더 높은 생활 수준, 더욱 강하고 회복력 있는 경제로 이어졌습니다."
 HOL_digital_literacy_idea: "디지털 문해력 캠페인"
 HOL_digital_literacy_idea_desc: "네덜란드는 사회 전 분야에 걸쳐 디지털 문해력을 향상하기 위한 국가 캠페인을 시작했습니다. 정부는 시민들에게 디지털 시대에 번영하는 데 필요한 기술을 제공함으로써 노동력이 기술 발전에 대응할 수 있도록 하고, 생산성을 높이며 경제의 혁신을 촉진하고 있습니다."
 HOL_economic_resilience_idea: "경제 회복력 구상"
 HOL_economic_resilience_idea_desc: "네덜란드 정부는 세계적 위기에 대한 경제의 회복력을 강화하기 위한 종합 정책을 시행했습니다. 경제 부문의 다각화, 소상공인 지원, 견고한 사회 안전망 확보를 통해 네덜란드는 앞으로의 도전을 이겨 내고 경제 안정을 유지할 수 있도록 더욱 잘 대비하고 있습니다."
 HOL_financial_sector_idea: "금융 부문 개혁"
 HOL_financial_sector_idea_desc: "금융 부문의 종합적인 개혁은 향후 위기를 예방하고 투명성과 책임성을 높이는 데 필수적입니다. 바우터 보스의 지도 아래 우리는 금융 산업을 효과적으로 규제하여 시장의 안정과 신뢰를 보장할 것입니다. 이러한 개혁은 세계적 도전을 견딜 수 있고 경제 붕괴의 위험을 줄이는 더욱 회복력 있는 경제를 만들 것입니다."
 HOL_afriforum1HOL: "아프리카너 동반자 관계 및 보호"
 HOL_afriforum1HOL_desc: "네덜란드는 남아프리카의 아프리카너 공동체와의 관계를 심화하여 경제적 지원을 제공하고 아프리카너의 문화 및 언어 유산을 보호하겠다고 약속했습니다. 이 동반자 관계는 자원 접근을 보장하는 동시에 공통의 역사와 상호 존중에 뿌리를 둔 새로워진 유대를 상징합니다."
 HOL_afriforum1SAF: "네덜란드-아프리카너 동맹"
 HOL_afriforum1SAF_desc: "아프리카너 공동체는 네덜란드와의 동맹을 강화하여 문화 보존, 경제 협력, 지원 네트워크를 육성하고 있습니다. 네덜란드의 영향력을 통해 아프리카너는 남아프리카 안에서 자신들의 정체성과 경제적 자율성을 지키려는 노력에 동맹을 얻게 됩니다."
 HOL_fatherland_education_idea: "조국 교육"
 HOL_fatherland_education_idea_desc: "조국 교육은 청소년에게 국가적 자부심, 유산, 책임감을 심어 주는 데 중점을 둡니다. 교육 과정에서 네덜란드의 역사, 가치, 문화를 강조함으로써 우리의 전통과 국가 정체성을 보존하고 지켜 낼 수 있는 강하고 단결된 시민을 기르는 것을 목표로 합니다."
 HOL_stadtholderate1: "총독 통치"
 HOL_stadtholderate1_desc: "네덜란드 총독은 군주제의 원칙과 민주주의의 전통 사이에서 균형을 잡으며 새로워진 통치 시대를 이끕니다. 지방 분권과 헌법 개혁을 강조하는 총독은 자유, 진보, 강력한 지도력이라는 비전 아래 네덜란드를 단결시키고자 합니다."
 HOL_monarchy1: "왕관과 조국의 결합"
 HOL_monarchy1_desc: "네덜란드는 왕실 유산을 받아들였으며, 군주제는 국가 정체성과 안정의 기둥으로 서 있습니다. 왕관의 주의 깊은 시선 아래 국가는 앞으로 나아가며 문화적 자부심을 키우고 국민의 번영에 헌신하는 강력한 중앙 집권 정부를 확립하고 있습니다."
 HOL_voc_semiconductor_control_HOL: "§Y[TAI.GetNameWithFlag]§!의 반도체 산업 통제"
 HOL_voc_semiconductor_control_HOL_desc: "전략적 투자와 제휴를 통해 네덜란드는 대만의 매우 탐나는 반도체 산업에 대한 통제권을 확보했습니다. ASML의 최첨단 리소그래피 기술을 핵심으로 한 이러한 우위 속에서, 네덜란드는 이제 세계 반도체 생산의 고삐를 쥐고 있으며 현대 기술 시대에 결정적인 이점을 확보했습니다."
 HOL_voc_semiconductor_control_TAI: "[HOL.GetAdjective] 대만 반도체 산업 장악"
 HOL_voc_semiconductor_control_TAI_desc: "경제의 생명줄인 대만의 반도체 산업이 [HOL.GetAdjective] 통제 아래 들어갔습니다. ASML의 기술적 영향력과 VOC가 뒷받침하는 경제적 압박이 주도한 이 권력 이동은 대만의 가장 핵심적인 산업에 대한 자율성을 위협하며, 그 미래를 외국의 손에 맡기고 있습니다."
 HOL_sri_dutch_agriculture_benefits: "네덜란드 농업 동반자 관계"
 HOL_sri_dutch_agriculture_benefits_desc: "네덜란드와의 협력을 통해 스리랑카는 현대적인 농업 기술과 자원을 활용할 수 있게 되었으며, 이는 전국의 식량 생산과 경제 성장을 촉진하고 있습니다."
 HOL_sri_agriculture_collaboration: "스리랑카 농업 협력"
 HOL_sri_agriculture_collaboration_desc: "네덜란드의 농업 전문 지식을 스리랑카와 공유함으로써 네덜란드는 이 지역에서 중요한 발판을 확보했으며, 영향력을 높이고 이 역사적인 영토와의 연결을 되살렸습니다."
 HOL_voc_indonesian_focus: "VOC: 인도네시아 중점"
 HOL_voc_indonesian_focus_desc: "재건된 VOC는 역사적 제국의 심장부였던 인도네시아에서 지배력을 되찾는 데 주목하고 있습니다. 경제 재활성화, 전략적 통제, 현지 영향력 육성에 노력을 집중하는 이 중점은 이 지역에서 네덜란드의 힘을 다시 세우고 귀중한 자원을 확보하는 것을 목표로 합니다."
 HOL_voc_penalty_operation_extension: "작전 연장 페널티"
 HOL_voc_penalty_operation_extension_desc: "전쟁을 선포하는 대신 인도네시아에서의 작전을 연장함으로써 결정적인 행동이 지연되었고, 이는 정치적 부담과 안정도 저하, 산업의 비효율을 초래했습니다."
 HOL_voc_ambassy_expansion_ind: "인도네시아 주재 네덜란드 대사관 확장"
 HOL_voc_ambassy_expansion_ind_desc: "인도네시아 주재 네덜란드 대사관의 확장은 외교 관계를 심화하고, 영향력을 행사하며, 비밀 작전을 원활하게 하기 위한 전략적 조치입니다. 현지 입지를 강화함으로써 이 지역에서의 향후 사업에 더 잘 대비할 수 있습니다."
 HOL_d66_democratic_institutions_idea: "강화된 민주주의 제도"
 HOL_d66_democratic_institutions_idea_desc: "민주적 절차를 강화하려는 노력은 통치에 대한 대중의 신뢰를 높였습니다. 더 높은 투명성, 책임성, 시민 참여를 통해 네덜란드는 현대적이고 효과적인 민주주의의 모범으로 서 있습니다."
 HOL_gl_affordable_housing_plan_idea: "저렴한 주택 구상"
 HOL_gl_affordable_housing_plan_idea_desc: "지속 가능하고 저렴한 주택에 대한 상당한 투자를 통해 네덜란드는 주택 위기에 정면으로 맞서고 있습니다. 이 구상은 모든 시민이 안전하고 안정적이며 친환경적인 주거지를 누릴 수 있도록 보장합니다."
 HOL_gl_international_solidarity_idea: "국제 연대"
 HOL_gl_international_solidarity_idea_desc: "그뢴링크스는 세계적 도전에 대응하기 위해 강력한 국제 협력 관계를 키워 왔습니다. 평화, 인권, 지속 가능한 발전을 증진함으로써 네덜란드는 세계 무대에서 협력과 진보의 등대로 서 있습니다."
 HOL_gl_transparent_government_idea: "투명한 통치"
 HOL_gl_transparent_government_idea_desc: "책임성과 개방성에 대한 확고한 의지로 그뢴링크스는 정부가 투명하게 운영되도록 하여, 시민들이 지도부를 신뢰하고 참여할 수 있도록 힘을 실어 주었습니다."
 HOL_gl_diversify_workforce_idea: "다양화된 노동력"
 HOL_gl_diversify_workforce_idea_desc: "포용적인 정책과 평등한 기회 프로그램을 통해 그뢴링크스는 네덜란드 사회의 다양성과 강점을 반영하는 노동력을 육성했으며, 모든 부문에서 공정성과 혁신을 보장하고 있습니다."
 HOL_gl_fair_trade_idea: "공정 무역 연립 합의"
 HOL_gl_fair_trade_idea_desc: "그뢴링크스와 협상한 연립 합의의 일환으로 정부는 새로운 국제 무역 체계에 전념하기로 했습니다. 그뢴링크스의 진보적 의제에 이끌려 무역 정책은 이제 순수한 이윤보다 생태적 책임, 노동자의 권리, 사회 정의를 강조합니다. 이는 전통적인 시장 주도 모델에서 가치에 기반한 경제 비전으로의 뚜렷한 전환을 의미합니다."
 HOL_d66_rule_of_law_idea: "법치주의 수호"
 HOL_d66_rule_of_law_idea_desc: "D66은 연립 합의의 일환으로 핵심적인 법제 개혁을 확보하여 사법부의 독립, 통치의 투명성, 헌법 규범의 엄격한 준수를 재확인했습니다. 포퓰리즘의 압력과 정치적 분열의 시기에 이러한 조치는 국내외에서 민주주의 제도와 법치주의를 지키는 것을 목표로 합니다."
 HOL_asml1: "ASML"
 HOL_asml1_desc: "리소그래피 분야에서의 ASML의 선도적 위치는 네덜란드를 세계 마이크로칩 산업의 중심에 놓습니다. 이러한 우위는 컴퓨팅과 칩 제조에 대한 우리의 연구를 가속하는 한편, 반도체 수출을 안정적인 국가 수입원으로 바꿔 줍니다."
 HOL_caribbean_naval_cooperation: "카리브 해군 합동 협력"
 HOL_caribbean_naval_cooperation_desc: "카리브 합동 해군 프로그램은 우리 해군을 강화하여 네덜란드 왕립 해군과 함께 훈련, 해상 순찰, 방어 전략을 조율할 수 있게 합니다."
 HOL_asml_USA_tech_partnership: "ASML-미국 기술 통합 협약"
 HOL_asml_USA_tech_partnership_desc: "네덜란드와 미국은 반도체 혁신, 사이버 방어, 정밀 제조를 중심으로 한 고위급 전략적 동반자 관계를 맺었습니다. 네덜란드 기업 ASML은 이 협력의 중심에 있으며 우리에게 연구와 산업 생산에서 최첨단의 우위를 부여합니다. 그러나 미국 기술 인프라와의 더 깊은 통합은 미국의 수출 정책에 대한 우리의 의존을 높였고 비동맹 강대국들과의 무역 관계를 긴장시켰습니다."
 HOL_shell_lng_deal: "셸-LNG 전략 에너지 협정"
 HOL_shell_lng_deal_desc: "국제 협력국들과의 포괄적인 에너지 협약을 통해 셸은 네덜란드가 LNG 인프라, 해상 연료 생산, 세계 에너지 통로에 접근할 수 있도록 확보했습니다. 이는 우리의 경제 안정을 높이고 보급망을 강화합니다. 화석 연료에 대한 지속적인 투자는 국내에서 비판을 받고 있으며 다른 부문에서의 첨단 기술 혁신 역량을 제한합니다."
 HOL_strengthening_eurozone_idea: "유로존 강화"
 HOL_strengthening_eurozone_idea_desc: ""
 HOL_social_democratic_modifier: "사회적 민주주의 사회"
 HOL_economy: "네덜란드 경제"
 HOL_economy_desc: "로테르담의 크레인에서부터 베스틀란트의 온실, 브레인포트의 클린룸에 이르기까지, 네덜란드 경제는 유럽의 위대한 무역 교차로 중 하나로서 번영하고 있습니다. 수 세기에 걸친 상업, 간척, 끊임없는 혁신은 농업, 물류, 에너지, 금융, 첨단 기술에 걸친 개방적이고 수출 중심적인 강국을 만들어 냈으며, 새로운 사업 하나하나가 전체의 힘을 더해 줍니다."
 HOL_cmp: "군수 생산 위원회"
 HOL_cmp_desc: "군수 생산 위원회(Commissariaat Militaire Productie, CMP)는 군사 장비와 물자의 생산을 감독하고 조율하기 위해 설립된 네덜란드 정부 기관이었습니다. 주된 역할은 특히 분쟁 시기나 군사적 준비태세가 높아진 시기에 네덜란드 국방군이 충분히 장비를 갖추도록 보장하는 것이었습니다. CMP는 국내 산업과의 계약을 관리하고, 무기, 탄약, 차량 및 기타 군수품의 생산을 규제하며, 이것들이 요구되는 기준과 일정에 맞게 생산되도록 보장하는 책임을 맡았습니다."
 HOL_noordzee_parken: "북해 에너지 공원"
 HOL_army: "왕립 육군"
 HOL_army_desc: "코닌클레이커 란트마흐트, 즉 네덜란드 왕립 육군은 네덜란드군의 지상 병과로, 그 뿌리는 16세기로 거슬러 올라갑니다. 네덜란드 영토의 방어를 담당하며 NATO와 UN 평화유지 작전을 비롯한 국제 임무에도 기여합니다. 육군은 현대적인 차량, 포병, 통신 체계를 갖추고 있습니다. 네덜란드 왕립 육군은 국내외의 다양한 안보 과제에 대응할 준비가 된 다재다능한 전력입니다."
 HOL_navy: "왕립 해군"
 HOL_navy_desc: "코닌클레이커 마리너, 즉 네덜란드 왕립 해군은 네덜란드군의 해군 병과입니다. 네덜란드의 해양 이익을 수호하고, 해외에 힘을 투사하며, 동맹 함대와 긴밀히 협력하여 활동합니다. 이 변동치는 해군 중점 트리 전반에서 내린 교리, 훈련, 조달 선택이 누적된 결과를 반영합니다."
 HOL_economy.027.t: "마을 클럽의 새 후원자"
 HOL_economy.027.d: "지역 스포츠 클럽이 인근 낙농업자가 비용을 댄 새 유니폼을 공개합니다. 그의 소화조는 이제 마을의 유기성 폐기물로 가동됩니다. 지방 자치체는 이 일을 기념하고자 합니다."
 HOL_economy.027.a: "지방 자치체 자금으로 공동 출자한다"
 HOL_economy.027.b: "지역 주민 주도로 유지한다"
 HOL_megaproject_category: "국가 메가 프로젝트"
 HOL_megaproject_category_desc: "간척 사업에서 대표적인 인프라에 이르는 대규모 국가 사업으로, 네덜란드가 거대한 개발 의제를 추진함에 따라 해금됩니다."
 HOL_space_program_category: "네덜란드 우주 프로그램"
 HOL_space_program_category_desc: "발사 인프라, 위성, 지구 궤도 너머를 향한 유인 우주 야망을 조율하는 국가 우주 사업입니다."
 HOL_future_air_defender_program: "미래 대공 방어함 프로그램"
 HOL_future_air_defender_program_desc: "미래 대공 방어함(Future Air Defender) 방공 호위함을 건조하는 공동 해군 프로그램입니다. 각 참여국은 건조를 시간제한이 있는 임무로 수행하며, 프로그램이 종료되면 완성된 함선이 곧바로 취역합니다. 독일이 탈퇴하면 네덜란드는 북유럽 해군들을 참여시켜 수량을 채우고 잃어버린 시간을 만회할 수 있습니다."
 HOL_FAD_invite_partner: "프로그램에 협력국 초청"
 HOL_FAD_invite_partner_desc: "북유럽 해군을 미래 대공 방어함 프로그램에 초청합니다. 참여하는 협력국은 각각 호위함 2척을 받으며, 네덜란드의 발주분에 1척을 추가하고, 남은 건조 시간을 단축합니다."
 HOL_military.089.a: "추가 예산을 승인한다."
 HOL_military.089.b: "현재 배정액을 유지한다."
 HOL_mars_invested_budget_tt: "§G투자 증액은 임무를 가속하며, 첫 토양 시료를 분석하면 건설 연구 보너스가 열립니다.§!"
 HOL_military.090.a: "전체 소프트웨어 패치에 자금을 댄다."
 HOL_military.090.b: "우회 방안과 지연을 받아들인다."
 HOL_military.091.a: "지질 조사를 확대한다."
 HOL_military.091.b: "거주지 조립을 우선한다."
 HOL_mars_chromium_found_tt: "§G조사 팀이 이시디스 지하에서 추가 크롬 매장지를 확보합니다.§!"
 HOL_military.092.a: "돔을 즉시 수리한다."
 HOL_military.092.b: "구역을 밀폐하고 계속 추진한다."
 HOL_mars_software_bonus_tt: "§G전체 소프트웨어 패치로 도킹 절차가 깔끔하게 해결되었습니다. 회수된 구조용 강재는 식민지의 보강 기초에 투입됩니다.§!"
 HOL_military.088.a: "홀란더하번이라고 명명한다."
 HOL_military.088.b: "브링커담이라고 명명한다."
 HOL_military.088.c: "브란다안스타트라고 명명한다."
 HOL_military.088.e: "브라메르트델프라고 명명한다."
 HOL_mars_mining_colony_tt: "§G브라메르트델프의 첫 채굴 갱도가 착공되어 화성 지각에서 즉각적인 원자재 수확을 얻습니다.§!"
 HOL_monarchy.40.t: "오라녜 공주의 입대"
 HOL_monarchy.40.d: "카타리나아말리아 왕세녀가 오라녜 가문의 여성으로는 처음으로 군복을 입고 복무하게 되었습니다. 그녀는 예비역으로 입대하여 일반 군사 훈련을 마쳤습니다. 그녀의 모범에 힘입어 군 지원자가 급격히 늘었습니다."
 HOL_monarchy.40.a: "오라녜 가문의 자랑스러운 날이다."
 HOL_monarchy.41.t: "예비군에 합류한 막시마 왕비"
 HOL_monarchy.41.d: "막시마 왕비가 딸의 뒤를 이어 브레다의 왕립 군사 아카데미에서 예비역으로 입대했습니다. 그녀는 국가 안보를 더 이상 당연하게 여길 수 없으며, 다른 시민과 마찬가지로 자신도 이에 기여하고 싶다고 밝혔습니다."
 HOL_monarchy.41.a: "왕실이 군과 함께한다."
 HOL_politics.05.c: "리타 페르동크를 지지한다"
 HOL_politics.78.t: "내각 내의 마찰"
 HOL_politics.78.d: "헤이르트 빌더르스가 이민 문제를 두고 VVD 지도부와 충돌하고 있습니다. 그는 동료들이 받아들일 수 있는 수준보다 훨씬 강경한 노선을 요구하고 있으며, 이 다툼은 대중에게까지 알려지고 있습니다."
 HOL_politics.78.a: "빌더르스의 강경 노선을 지지한다"
 HOL_politics.78.b: "온건 노선을 유지한다"
 HOL_politics.79.t: "유럽의 문 앞에 선 튀르키예"
 HOL_politics.79.d: "튀르키예의 유럽 연합 가입 문제로 당이 분열되고 있습니다. 빌더르스는 이에 격렬하게 반대하며, 지도부의 개방적 태도가 VVD 유권자들의 마음을 멀어지게 할 것이라고 경고합니다."
 HOL_politics.79.a: "튀르키예의 가입에 반대한다"
 HOL_politics.79.b: "EU 확대를 지지한다"
 HOL_politics.80.t: "넘을 수 없는 선"
 HOL_politics.80.d: "빌더르스가 이슬람과 사회 통합에 대한 당의 입장을 두고 지도부에 맞서며 타협 없는 입장을 고집하고 있습니다. 그의 인내심은 눈에 띄게 바닥나고 있습니다."
 HOL_politics.80.a: "타협 없는 노선을 택한다"
 HOL_politics.80.b: "유화적인 어조를 모색한다"
 HOL_politics.81.t: "당에 남은 빌더르스"
 HOL_politics.81.d: "당분간 헤이르트 빌더르스는 VVD에 남아 있습니다. 지도부는 불안한 강경파를 당 안에 붙들어 두기에 필요한 만큼은 해냈으며, 치명적인 분열은 피했습니다."
 HOL_politics.81.a: "위태로운 평화가 유지된다"
 HOL_voc.1.t: "네덜란드 동인도 회사의 제안"
 HOL_voc.1.d: "인도가 내전에 빠져들면서 [HOL.GetAdjectiveCap] 정부와 부활한 VOC가 뜻밖의 제안을 내놓았습니다. 그들은 역사적 유대와 네덜란드 통치 아래의 안정 및 번영에 대한 약속을 근거로 인도의 주들을 [HOL.GetAdjectiveCap]의 통제 아래로 평화롭게 이양할 것을 제안합니다. 그러나 이 제안을 거절하면 네덜란드가 군사적으로 개입할 수밖에 없으며, 이는 더 큰 분쟁으로 이어져 평화 협상에서 더 많은 영토를 잃을 위험이 있다고 경고합니다. 결정은 귀하의 손에 달려 있습니다."
 HOL_voc.1.a: "이양에 동의한다. 안정이 최우선이다."
 HOL_voc.1.b: "제안을 거절한다. [HOL.GetAdjectiveCap]와의 전쟁을 준비한다."
 HOL_voc.2.t: "[HOL.GetAdjectiveCap] 측의 동구자라트 장악"
 HOL_voc.2.d: "[HOL.GetAdjectiveCap] 측이 동구자라트의 불안정을 이용해 이 주의 통제권을 주장했습니다. 그들은 협력을 제안하지만, 거부하면 군사적 대립이 불가피합니다."
 HOL_voc.2.a: "보복한다! 이것은 전쟁 행위다!"
 HOL_voc.2.b: "당분간 행동을 자제한다. [HOL.GetAdjectiveCap] 측이 무리할 수도 있다."
 HOL_voc.3.t: "[HOL.GetAdjectiveCap] 측의 서벵골 장악"
 HOL_voc.3.d: "[HOL.GetAdjectiveCap] 측이 서벵골의 혼란을 틈타 이 주에 대한 통제권을 확립했습니다. 그들의 요구를 받아들이겠습니까, 아니면 전쟁을 준비하겠습니까?"
 HOL_voc.3.a: "보복한다! 이것은 전쟁 행위다!"
 HOL_voc.3.b: "당분간 행동을 자제한다. [HOL.GetAdjectiveCap] 측이 무리할 수도 있다."
 HOL_voc.4.t: "[HOL.GetAdjectiveCap] 측의 케랄라 점령"
 HOL_voc.4.d: "불안이 커지는 가운데 [HOL.GetAdjectiveCap] 측이 이 지역에서의 역사적 영향력을 근거로 케랄라를 차지했다고 주장했습니다. 인도는 협상할지 보복할지 결정해야 합니다."
 HOL_voc.4.a: "보복한다! 이것은 전쟁 행위다!"
 HOL_voc.4.b: "당분간 행동을 자제한다. [HOL.GetAdjectiveCap] 측이 무리할 수도 있다."
 HOL_voc.5.t: "[HOL.GetAdjectiveCap] 측의 타밀나두 장악"
 HOL_voc.5.d: "[HOL.GetAdjectiveCap] 측이 타밀나두의 불안정을 이용해 통제권을 확대했습니다. 인도는 이 노골적인 침략에 어떻게 대응하겠습니까?"
 HOL_voc.5.a: "보복한다! 이것은 전쟁 행위다!"
 HOL_voc.5.b: "당분간 행동을 자제한다. [HOL.GetAdjectiveCap] 측이 무리할 수도 있다."
 HOL_voc.6.t: "대만 보장 중단에 대한 네덜란드의 요청"
 HOL_voc.6.d: "네덜란드가 대만 섬의 영토를 확보하려는 의도를 이유로 우리의 대만 안보 보장을 중단해 달라는 요청을 들고 접근했습니다. 그들의 요구에 동의하겠습니까?"
 HOL_voc.6.a: "보장을 중단한다."
 HOL_voc.6.b: "그들의 요청을 거절한다."
 HOL_voc.6.c: "중단하되 보상을 요구한다."
 HOL_voc.7.t: "미국의 대만 보장 중단 동의"
 HOL_voc.7.d: "미국이 대만에 대한 안보 보장을 중단하기로 동의하여, 네덜란드가 대만 섬을 상대로 행동할 길이 열렸습니다."
 HOL_voc.7.a: "최후통첩을 진행한다."
 HOL_voc.8.t: "미국의 대만 보장 중단 거부"
 HOL_voc.8.d: "미국이 대만에 대한 안보 보장 중단을 거부하여, 대만 섬을 압박하려는 네덜란드의 계획이 복잡해졌습니다."
 HOL_voc.8.a: "전략을 재평가한다."
 HOL_voc.9.t: "대만에 대한 네덜란드의 최후통첩"
 HOL_voc.9.d: "네덜란드가 대만에 [599.GetName]과(와) [1157.GetName]의 이양을 요구하는 최후통첩을 보냈습니다. 어떻게 대응하겠습니까?"
 HOL_voc.9.a: "그들의 요구를 받아들인다."
 HOL_voc.9.b: "[USA.GetAdjectiveCap] 측에 지원을 요청한다."
 HOL_voc.9.c: "영토를 넘겨주되 [HOL.GetAdjective] 측의 보호를 요청한다"
 HOL_voc.10.t: "대만으로부터 확보한 영토"
 HOL_voc.10.d: "[TAI.GetAdjectiveCap] 정부가 우리의 최후통첩을 수락하고 요구한 영토의 통제권을 이양했습니다. 이는 VOC와 네덜란드의 중대한 승리이며, 이 지역에서 우리의 영향력을 공고히 하고 아시아에서의 입지를 넓힙니다."
 HOL_voc.10.a: "훌륭하다. VOC의 힘이 커진다."
 HOL_voc.11.t: "[USA.GetAdjectiveCap] 측의 지원을 구하는 대만"
 HOL_voc.11.d: "대만이 [HOL.GetAdjectiveCap] 측의 요구에 저항하기 위해 [USA.GetAdjectiveCap] 측의 지원을 요청했습니다. 어떻게 대응하겠습니까?"
 HOL_voc.11.a: "대만이 굴복하도록 압박한다."
 HOL_voc.11.b: "대만의 주권을 지지한다."
 HOL_voc.12.t: "미국의 대만 굴복 압박"
 HOL_voc.12.d: "[USA.GetAdjectiveCap] 측의 압박 속에서, 대만은 네덜란드의 요구에 굴복할지 아니면 저항하며 전쟁의 위험을 감수할지 결정해야 합니다."
 HOL_voc.12.a: "[HOL.GetAdjectiveCap] 측의 요구에 굴복한다."
 HOL_voc.12.b: "[HOL.GetAdjectiveCap] 측의 침략에 홀로 저항한다."
 HOL_voc.13.t: "대만의 우리 최후통첩 거부"
 HOL_voc.13.d: "미국의 지원을 등에 업은 대만이 우리의 최후통첩을 단호히 거부했습니다. 이러한 반발은 중대한 선택을 제시합니다. 더 이상의 확전을 피하기 위해 물러서거나, 대만 및 그 동맹국과의 공공연한 충돌을 감수하고 밀어붙일 수 있습니다."
 HOL_voc.13.a: "최후통첩을 철회한다. 위험이 너무 크다."
 HOL_voc.13.b: "최후통첩을 밀어붙인다. 전쟁은 불가피하다."
 HOL_voc.14.t: "대만의 우리 최후통첩 거부"
 HOL_voc.14.d: "대만이 요구한 영토의 양도를 거부하며 우리의 요구를 단호히 거절했습니다. 이러한 반발로 인해 우리는 전쟁을 선포하고 무력으로 네덜란드의 권위를 확립하는 수밖에 없습니다."
 HOL_voc.14.a: "전쟁만이 유일한 답이다!"
 HOL_voc.15.t: "보호를 조건으로 한 대만의 영토 양도 동의"
 HOL_voc.15.d: "뜻밖에도 대만이 요구한 영토를 네덜란드에 이양하는 데 동의했지만, 네덜란드가 향후 위협으로부터 대만을 보호하겠다고 보장하는 조건을 달았습니다. 이 합의는 아시아에서 네덜란드의 영향력을 강화하지만 이 지역에서 더 큰 책임을 져야 하는 대가가 따릅니다."
 HOL_voc.15.a: "그들의 조건을 수락하고 대만을 보장한다."
 HOL_voc.16.t: "미국의 대만 보상 요구"
 HOL_voc.16.d: "우리가 대만의 영토를 장악하도록 허용한 뒤, 미국이 이제 중단된 보호에 대한 보상을 요구했습니다. 그들은 이 지역에서 자국의 지정학적 이익이 훼손되었다고 주장합니다. 우리는 보상금을 지불하여 안정적인 관계를 유지할 수도 있고, 거부하여 미국과의 충돌 위험을 감수할 수도 있습니다."
 HOL_voc.16.a: "보상금을 지불하고 안정을 유지한다."
 HOL_voc.16.b: "그들의 요구를 거부하고 전쟁을 준비한다."
 HOL_voc.17.t: "네덜란드의 농업 협력 제안"
 HOL_voc.17.d: "네덜란드가 우리의 농업 부문 현대화에 협력하자는 제안을 들고 접근했습니다. 그들은 스리랑카의 식량 안보와 경제 산출을 높이기 위해 네덜란드의 전문 지식과 자원을 공유하겠다고 제안합니다. 하지만 이 동반 관계에는 조건이 따를 수 있으며, 이 지역에서 네덜란드의 영향력이 커질 가능성이 있습니다."
 HOL_voc.17.a: "협력을 수락한다. 우리에게는 그들의 전문 지식이 필요하다."
 HOL_voc.17.b: "거절한다. 스리랑카는 스스로 서야 한다."
 HOL_voc.18.t: "스리랑카의 농업 협력 수락"
 HOL_voc.18.d: "스리랑카가 농업 개발에 협력하자는 우리의 제안을 수락했습니다. 이는 네덜란드와 스리랑카 관계의 새로운 장을 열며, 우리의 영향력을 강화하고 이 지역에서 상호 이익을 보장합니다."
 HOL_voc.18.a: "전망 밝은 동반 관계다!"
 HOL_voc.19.t: "스리랑카의 농업 협력 거절"
 HOL_voc.19.d: "스리랑카가 농업 협력 제안을 거절했습니다. 네덜란드와 협력하기를 꺼리는 태도는 지역 개발을 늦추고 이 지역에서 우리의 영향력을 줄일 수 있습니다."
 HOL_voc.19.a: "유감이지만 앞으로 나아가야 한다."
 HOL_voc.20.t: "네덜란드의 투자 기회 제안"
 HOL_voc.20.d: "네덜란드가 스리랑카의 경제와 식량 생산을 개선하기 위한 농업 투자 프로그램을 제안했습니다. 이 프로그램은 소규모, 중규모, 대규모의 세 단계로 구성되며, 단계가 높을수록 이점이 커지지만 더 큰 헌신이 필요합니다. 또는 스리랑카는 제안을 아예 거절할 수도 있습니다."
 HOL_voc.20.a: "소규모 투자 프로그램을 수락한다."
 HOL_voc.20.b: "중규모 투자 프로그램을 수락한다."
 HOL_voc.20.c: "대규모 투자 프로그램을 수락한다."
 HOL_voc.20.e: "네덜란드의 제안을 거절한다."
 HOL_voc.21.t: "소규모 투자 프로그램 수락"
 HOL_voc.21.d: "스리랑카가 우리의 소규모 투자 프로그램을 수락했습니다. 이 첫걸음은 네덜란드의 영향력을 구축하고 그들의 농업 부문을 점진적으로 강화할 것입니다."
 HOL_voc.21.a: "좋은 출발이다."
 HOL_voc.22.t: "중규모 투자 프로그램 수락"
 HOL_voc.22.d: "스리랑카가 우리의 중규모 투자 프로그램을 수락했습니다. 이 더 깊은 헌신은 그들의 농업 산출을 크게 높이고 네덜란드의 영향력을 확대할 것입니다."
 HOL_voc.22.a: "훌륭한 진전이다."
 HOL_voc.23.t: "대규모 투자 프로그램 수락"
 HOL_voc.23.d: "스리랑카가 우리의 대규모 투자 프로그램을 받아들여 농업 부문의 혁신적인 개편을 약속했습니다. 이는 이 지역에서 네덜란드의 영향력과 협력에서 하나의 이정표입니다."
 HOL_voc.23.a: "큰 보상을 가져올 것이다."
 HOL_voc.24.t: "투자 제안을 거절한 스리랑카"
 HOL_voc.24.d: "스리랑카가 우리의 투자 제안을 거절하여 농업 부문을 강화할 기회를 놓쳤습니다. 그러나 우리는 여전히 일방적으로 투자를 추진하여 영향력을 확립할 수 있습니다."
 HOL_voc.24.a: "유감이지만 다른 방법을 찾겠다."
 HOL_voc.25.t: "네덜란드의 콜롬보 항 확장"
 HOL_voc.25.d: "네덜란드가 콜롬보 항을 확장하고 현대화하는 한편 보안 기반시설도 강화하기 위해 막대한 투자를 했습니다. 이 개발은 스리랑카의 경제 역량과 해상 작전을 높일 것으로 기대됩니다. 그러나 네덜란드의 존재감이 상당히 커져, 스리랑카의 가장 전략적인 자산 중 하나에 대한 네덜란드의 영향력을 우려하는 목소리가 나오고 있습니다."
 HOL_voc.25.a: "축복이자 도전이다."
 HOL_voc.26.t: "네덜란드의 스리랑카 독점권 요구"
 HOL_voc.26.d: "네덜란드가 노골적인 최후통첩을 보냈습니다. 스리랑카를 통치할 독점권을 부여하여 사실상 국가 주권을 포기하든가, 아니면 그 결과를 감수하라는 것입니다. 이 결정은 스리랑카 독립의 미래를 좌우할 것입니다."
 HOL_voc.26.a: "복종하는 수밖에 없다."
 HOL_voc.26.b: "우리는 굴복을 거부한다!"
 HOL_voc.27.t: "네덜란드 요구를 거부한 스리랑카"
 HOL_voc.27.d: "스리랑카가 우리의 최후통첩을 거부하고 나라에 대한 독점권을 요구하는 네덜란드의 요구에 맞섰습니다. 이로 인해 우리는 무력으로 우위를 확립하는 수밖에 없습니다."
 HOL_voc.27.a: "전쟁은 불가피하다."
 HOL_voc.28.t: "네덜란드 요구를 수락한 스리랑카"
 HOL_voc.28.d: "스리랑카가 우리의 최후통첩에 굴복하여 네덜란드에 나라를 통치할 독점권을 부여했습니다. 이 평화적 병합은 이 지역에서 네덜란드의 영향력을 강화하며 VOC의 역사적인 승리를 의미합니다."
 HOL_voc.28.a: "스리랑카는 이제 VOC 유산의 일부다."
 HOL_voc.29.t: "HIV 퇴치를 위한 네덜란드의 지원"
 HOL_voc.29.d: "네덜란드가 남아프리카의 HIV 유행 퇴치를 돕기 위해 나섰습니다. 선진 의료 전문 지식과 자원을 갖춘 네덜란드인들은 우리 국민에게 절실히 필요했던 희망과 지원을 가져다주었습니다. 이 선의의 행동은 유행병과의 싸움에 힘을 보탰을 뿐 아니라 우리 국민 사이에서 네덜란드에 대한 폭넓은 존경을 얻었습니다."
 HOL_voc.29.a: "이 동반 관계는 국민에게는 축복이지만 정부에게는 위험이다"
 HOL_voc.30.t: "네덜란드의 케이프 해군 기지 요청"
 HOL_voc.30.d: "네덜란드가 아시아로 가는 재보급 거점으로서의 전략적 중요성을 이유로 케이프에 해군 기지를 설립하자고 제안했습니다. 그 대가로 네덜란드는 남아프리카의 항만 기반시설에 막대한 투자를 제안하여 나라의 해양 역량을 높이겠다고 합니다. 이 제안을 수락해야 합니까?"
 HOL_voc.30.a: "제안을 수락하고 동반 관계를 구축한다."
 HOL_voc.30.b: "제안을 거절하고 완전한 주권을 유지한다."
 HOL_voc.31.t: "해군 기지 제안을 수락한 남아프리카"
 HOL_voc.31.d: "남아프리카가 네덜란드가 케이프에 해군 기지를 설립하는 것을 허용하기로 동의했습니다. 이 합의는 핵심 무역로에 대한 네덜란드의 접근을 강화하며 남아프리카와의 협력에서 중요한 진전을 의미합니다."
 HOL_voc.31.a: "VOC의 중요한 성과다!"
 HOL_voc.32.t: "해군 기지 제안을 거절한 남아프리카"
 HOL_voc.32.d: "남아프리카가 주권과 전략적 자율성에 대한 우려를 이유로 케이프에 해군 기지를 설립하자는 우리의 제안을 거절했습니다. 이는 이 지역에서 네덜란드의 야망에 차질이 생긴 것입니다."
 HOL_voc.32.a: "유감이지만 밀고 나가야 한다."
 HOL_voc.33.t: "네덜란드의 남아프리카 독점권 요구"
 HOL_voc.33.d: "네덜란드가 노골적인 최후통첩을 보냈습니다. 남아프리카를 통치할 독점권을 부여하여 사실상 국가 주권을 포기하든가, 아니면 그 결과를 감수하라는 것입니다. 이 결정은 남아프리카 독립의 미래를 좌우할 것입니다."
 HOL_voc.33.a: "복종하는 수밖에 없다."
 HOL_voc.33.b: "우리는 굴복을 거부한다!"
 HOL_voc.34.t: "네덜란드 요구를 거부한 남아프리카"
 HOL_voc.34.d: "남아프리카가 우리의 최후통첩을 거부하고 나라에 대한 독점권을 요구하는 네덜란드의 요구에 맞섰습니다. 이로 인해 우리는 무력으로 우위를 확립하는 수밖에 없습니다."
 HOL_voc.34.a: "전쟁은 불가피하다."
 HOL_voc.35.t: "네덜란드 요구를 수락한 남아프리카"
 HOL_voc.35.d: "남아프리카가 우리의 최후통첩에 굴복하여 네덜란드에 나라를 통치할 독점권을 부여했습니다. 이 평화적 병합은 이 지역에서 네덜란드의 영향력을 강화하며 VOC의 역사적인 승리를 의미합니다."
 HOL_voc.35.a: "남아프리카는 이제 VOC 유산의 일부다."
 HOL_voc.36.t: "인도네시아의 미래"
 HOL_voc.36.d: "인도네시아에 관한 중대한 결정을 내릴 때가 왔습니다. 전쟁을 선포하여 역사적 왕령 식민지를 무력으로 되찾아야 합니까, 아니면 같은 자원을 다시 사용할 수 없기에 일시적인 불이익을 감수하고 비밀 작전을 1년 더 연장해야 합니까"
 HOL_voc.36.a: "전쟁을 선포하고 인도네시아를 되찾는다!"
 HOL_voc.36.b: "작전을 1년 더 연기한다."
 HOL_voc.39.t: "네덜란드의 군사 통행권 요청"
 HOL_voc.39.d: "네덜란드가 전략적 이유와 지역 협력의 중요성을 들어 오스트레일리아 영토에 대한 군사 통행권을 요청했습니다. 그들의 요청을 수락해야 합니까?"
 HOL_voc.39.a: "군사 통행권을 부여한다."
 HOL_voc.39.b: "그들의 요청을 거절한다."
 HOL_voc.40.t: "오스트레일리아의 군사 통행권 부여"
 HOL_voc.40.d: "오스트레일리아가 우리에게 군사 통행권을 부여하기로 동의했으며, 이는 지역 협력과 작전 효율에서 중요한 진전입니다."
 HOL_voc.40.a: "훌륭하다. 우리 군을 준비시켜라."
 HOL_voc.41.t: "오스트레일리아의 군사 통행권 거부"
 HOL_voc.41.d: "오스트레일리아가 주권과 지역 안정에 대한 우려를 이유로 군사 통행권 요청을 거절했습니다."
 HOL_voc.41.a: "유감이다. 전략을 조정하겠다."
 HOL_voc.42.t: "자바 침공 준비 완료"
 HOL_voc.42.d: "자바 침공을 위한 우리의 비밀 준비가 완료되었습니다. 우리 병력이 발각되지 않았는지는 인도네시아 방첩 활동의 결과를 기다려 확인해야 합니다."
 HOL_voc.42.a: "진행한다."
 HOL_voc.42.b: "진행한다."
 HOL_voc.43.t: "발각된 비밀 병력!"
 HOL_voc.43.d: "우리의 비밀 작전이 인도네시아군에 발각되어 우리 병력의 효율이 절반으로 줄고 작전 능력이 저하되었습니다."
 HOL_voc.43.a: "큰 차질이다."
 HOL_voc.44.t: "발각되지 않은 비밀 병력"
 HOL_voc.44.d: "우리의 비밀 준비는 눈치채이지 않았으며, 병력은 온전한 전력으로 자바에 발판을 마련할 준비를 마쳤습니다."
 HOL_voc.44.a: "훌륭하다!"
 HOL_voc.45.t: "서오스트레일리아 매입에 대한 네덜란드의 요청"
 HOL_voc.45.d: "네덜란드가 자국의 세계적 야망에 서오스트레일리아가 지니는 전략적 중요성을 이유로 이 지역을 매입하겠다는 공식 요청을 했습니다. 그 대가로 오스트레일리아에 군사적 또는 산업적 보상을 제시합니다. 어떻게 응답해야 합니까?"
 HOL_voc.45.a: "군사적 보상을 받고 수락한다."
 HOL_voc.45.b: "산업적 보상을 받고 수락한다."
 HOL_voc.45.c: "그들의 제안을 거절한다."
 HOL_voc.46.t: "제안을 수락한 오스트레일리아"
 HOL_voc.46.d: "오스트레일리아가 서오스트레일리아를 네덜란드에 매각하는 데 동의했습니다. 그들의 선택에 따라, 우리는 굳건한 외교 관계를 유지하기 위해 약속한 보상을 제공할 것입니다."
 HOL_voc.46.a: "합의를 진행한다."
 HOL_voc.47.t: "제안을 거절한 오스트레일리아"
 HOL_voc.47.d: "오스트레일리아가 서오스트레일리아를 매입하겠다는 우리의 제안을 거절했습니다. 실망스럽지만 우리는 그에 맞춰 전략을 조정해야 합니다."
 HOL_voc.47.a: "유감이지만 앞으로 나아가겠다."
 HOL_voc.51.t: "믈라카에 대한 네덜란드의 최후통첩"
 HOL_voc.51.d: "네덜란드가 믈라카의 즉각적인 항복을 요구하는 최후통첩을 보냈습니다. 그들의 조건을 받아들여 충돌을 피해야 합니까, 아니면 거부하고 전쟁을 준비해야 합니까?"
 HOL_voc.51.a: "그들의 조건을 받아들인다."
 HOL_voc.51.b: "거부하고 입장을 고수한다."
 HOL_voc.52.t: "네덜란드 최후통첩을 수락한 믈라카"
 HOL_voc.52.d: "믈라카가 우리의 요구에 굴복하여 저항 없이 영토를 네덜란드에 넘겼습니다. 이는 이 지역에서 네덜란드의 야망이 거둔 중대한 승리입니다."
 HOL_voc.52.a: "믈라카를 네덜란드 영역에 통합한다."
 HOL_voc.53.t: "네덜란드 최후통첩을 거부한 믈라카"
 HOL_voc.53.d: "믈라카가 우리의 최후통첩을 거부하고 항복을 요구하는 네덜란드의 요구에 맞섰습니다. 이로 인해 우리는 영유권을 관철하기 위한 전쟁을 준비하는 수밖에 없습니다."
 HOL_voc.53.a: "믈라카를 무력으로 차지한다."
 HOL_voc.54.t: "§Y[SIN.GetNameWithFlag]§!에 대한 네덜란드의 최후통첩"
 HOL_voc.54.d: "네덜란드가 싱가포르의 즉각적인 항복을 요구하는 최후통첩을 보냈습니다. 그들의 조건을 받아들여야 합니까, 아니면 전쟁을 준비해야 합니까?"
 HOL_voc.54.a: "그들의 조건을 받아들인다."
 HOL_voc.54.b: "거부하고 입장을 고수한다."
 HOL_voc.55.t: "§Y[SIN.GetNameWithFlag]§!, 네덜란드의 최후통첩 수락"
 HOL_voc.55.d: "§Y[SIN.GetNameWithFlag]§!이(가) 우리의 요구에 굴복하여 저항 없이 영토를 넘겼습니다. 이는 네덜란드의 야망이 거둔 중대한 승리입니다."
 HOL_voc.55.a: "§Y[SIN.GetNameWithFlag]§!을(를) 우리 영역에 통합한다."
 HOL_voc.56.t: "§Y[SIN.GetNameWithFlag]§!, 네덜란드의 최후통첩 거부"
 HOL_voc.56.d: "§Y[SIN.GetNameWithFlag]§!이(가) 우리의 최후통첩을 거부하고 네덜란드의 요구에 맞섰습니다. 이로 인해 우리는 전쟁을 준비하는 수밖에 없습니다."
 HOL_voc.56.a: "싱가포르를 무력으로 차지한다."
 HOL_voc.57.t: "§Y[BRU.GetNameWithFlag]§!에 대한 네덜란드의 최후통첩"
 HOL_voc.57.d: "§Y[HOL.GetNameWithFlag]§!이(가) 브루나이의 즉각적인 항복을 요구하는 최후통첩을 보냈습니다. 그들의 조건을 받아들여야 합니까, 아니면 전쟁을 준비해야 합니까?"
 HOL_voc.57.a: "그들의 조건을 받아들인다."
 HOL_voc.57.b: "거부하고 입장을 고수한다."
 HOL_voc.58.t: "§Y[BRU.GetNameWithFlag]§!, 네덜란드의 최후통첩 수락"
 HOL_voc.58.d: "§Y[BRU.GetNameWithFlag]§!이(가) 우리의 요구에 굴복하여 저항 없이 영토를 넘겼습니다. 이는 네덜란드의 야망이 거둔 중대한 승리입니다."
 HOL_voc.58.a: "§Y[BRU.GetNameWithFlag]§!을(를) 우리 영역에 통합한다."
 HOL_voc.59.t: "§Y[BRU.GetNameWithFlag]§!, 네덜란드의 최후통첩 거부"
 HOL_voc.59.d: "§Y[BRU.GetNameWithFlag]§!이(가) 우리의 최후통첩을 거부하고 네덜란드의 요구에 맞섰습니다. 이로 인해 우리는 전쟁을 준비하는 수밖에 없습니다."
 HOL_voc.59.a: "§Y[BRU.GetNameWithFlag]§!을(를) 무력으로 차지한다."
 HOL_voc.60.t: "네덜란드의 전쟁 준비 포착"
 HOL_voc.60.d: "정보 보고에 따르면 네덜란드가 자국 역사적 유산의 일부라고 믿는 영토를 되찾기 위해 병력을 동원하고 있음이 확인되었습니다. 그들의 침략에 대비할 즉각적인 조치를 취해야 합니다."
 HOL_voc.60.a: "네덜란드의 위협에 대비한다."
 HOL_voc.61.t: "방어 준비의 격상"
 HOL_voc.61.d: "네덜란드가 군사 준비를 강화하여 침공 가능성이 높아졌습니다. 이 위협에 맞서려면 위험에 처한 다른 국가들과 조율하고 상호 방위 협정을 맺어야 합니다. 이를 통해 네덜란드의 공격이 있을 경우 서로를 동맹으로서 부를 수 있습니다."
 HOL_voc.61.a: "방어를 강화하고 동맹을 조율한다."
 HOL_voc.62.t: "네덜란드의 침략에 대한 지원 요청"
 HOL_voc.62.d: "네덜란드가 우리를 공격하여 주권을 위협하고 있습니다. 우리는 동맹국에 약속을 이행하고 네덜란드의 침공을 격퇴하는 싸움에 합류할 것을 요청할 수 있습니다."
 HOL_voc.62.a: "동맹국에 도움을 요청한다."
 HOL_voc.62.b: "우리는 홀로 그들에게 맞선다."
 HOL_voc.63.t: "[ROOT.GetNameWithFlag]의 지원 요청"
 HOL_voc.63.d: "§Y[ROOT.GetNameWithFlag]§!이(가) §R[HOL.GetNameWithFlag]§!의 공격을 받아 침공을 격퇴할 수 있도록 우리의 도움을 요청하고 있습니다. 우리는 약속을 지켜 싸움에 합류하겠습니까?"
 HOL_voc.63.a: "참전하여 동맹을 돕는다."
 HOL_voc.63.b: "개입을 거부한다."
 HOL_voc.64.t: "네덜란드의 제안: 오스트레일리아 횡단 무역 회랑"
 HOL_voc.64.d: "네덜란드 정부가 네덜란드가 관할하는 서오스트레일리아와 오스트레일리아 대륙 동부 지역을 잇는 무역 및 기반시설 회랑의 건설을 공식 제안했습니다. 이 계획에는 물류 거점, 철도 및 도로망 개발과 네덜란드가 운영하는 경제 구역 설치가 포함됩니다. 이 회랑은 장기적인 경제적 이익을 약속하지만, 주권과 통치, 대륙 전체의 영향력 균형에 대한 의문을 불러일으킵니다."
 HOL_voc.64.a: "회랑을 승인한다. 경제 발전이 우선이다"
 HOL_voc.64.b: "계획을 거절한다. 전략적 요충지를 내줄 수 없다"
 HOL_voc.65.t: "무역 회랑 제안을 수락한 오스트레일리아"
 HOL_voc.65.d: "오스트레일리아 정부가 네덜란드가 관할하는 서오스트레일리아와 동부의 산업 및 인구 거점을 잇는 대륙 횡단 무역 회랑을 건설하자는 우리의 제안을 승인했습니다. 곧 공동 기반시설, 경제 구역, 물류 거점 공사가 시작될 것입니다. 이는 지역 경제 통합과 인도·태평양에서 네덜란드의 전략적 영향력을 향한 역사적인 걸음입니다."
 HOL_voc.65.a: "VOC의 유산에 걸맞은 회랑이다."
 HOL_voc.66.t: "무역 회랑 제안을 거절한 오스트레일리아"
 HOL_voc.66.d: "오스트레일리아 정부가 자국 영토를 통과하는 대륙 횡단 무역 회랑을 공동으로 건설하자는 우리의 제안을 거절했습니다. 전략적 주권과 외국의 영향력에 대한 우려가 핵심 이유로 제시되었습니다. 이 제안은 양측에 경제적으로 이익이 되었을 것이지만, 당분간은 국내 정치적 우려가 우세했습니다."
 HOL_voc.66.a: "차질이다. 끝은 아니다."
 HOL_voc.67.t: "네덜란드의 아프리카너 자치 지지"
 HOL_voc.67.d: "내부 긴장을 불러일으킬 것이 분명한 조치로, 네덜란드 정부가 남아프리카의 아프리카너 공동체의 문화적, 경제적 자치를 지지하는 공식 성명을 발표했습니다. 네덜란드 기관들은 역사적 유대와 공유된 유산을 이유로 아프리카너 시민 단체들과 더 긴밀한 관계를 맺겠다고 발표했습니다. 문화적 지원으로 포장되었지만, 이 조치는 외세의 간섭과 잠재적 불안에 대한 우려로 남아프리카 정부 내에 경종을 울렸습니다."
 HOL_voc.67.a: "심각한 외교적 우려 사안이다."
 HOL_voc.68.t: "보어인 성향 정당에 대한 네덜란드의 후원"
 HOL_voc.68.d: "네덜란드 정부가 남아프리카 내 보어인 성향의 정치 운동에 비공식적인 지원을 제공하고 있다는 보고가 확인되었습니다. 자금 경로, NGO 플랫폼, 문화 기관이 아프리카너 공동체의 더 큰 자치를 주장하는 단체들에 영향력을 쏟아붓고 있는 것으로 보입니다. 이러한 간섭은 국가 통합과 내부 안보에 심각한 파장을 미칠 수 있습니다."
 HOL_voc.68.a: "용납할 수 없는 외세의 간섭이다."
 HOL_voc.69.t: "아프리카너 광산 기업에 대한 네덜란드의 투자"
 HOL_voc.69.d: "네덜란드 정부가 남아프리카의 아프리카너 소유 광산 사업에 상당한 금융 투자를 했습니다. 이 조치는 아프리카너 공동체와의 경제적 유대를 깊게 하려는 더 폭넓은 운동의 일환으로, 생산을 늘리기 위한 자본과 물류 지원을 제공합니다. 일부에게는 경제적으로 이롭지만, 남아프리카의 천연자원에 대한 외부 영향력이라는 새로운 우려를 낳고 있습니다."
 HOL_voc.69.a: "그들은 분명히 편을 가르고 있다."
 HOL_voc.70.t: "반도체 산업에 대한 네덜란드의 투자"
 HOL_voc.70.d: "네덜란드가 대만의 반도체 부문에 대한 전략적 투자를 발표했습니다. 주요 네덜란드 기술 기업들과 협력하여 차세대 칩 개발을 지원할 새로운 합작 사무소와 연구 시설이 건설될 것입니다. 이 거래는 양자 협력을 심화하고 세계적인 반도체 강국으로서 대만의 역할을 강화합니다."
 HOL_voc.70.a: "이는 디지털 시대에서 대만의 입지를 굳건히 할 것이다."
 HOL_voc.71.t: "네덜란드의 제안: ASML-TSMC 기술 동맹"
 HOL_voc.71.d: "네덜란드가 ASML과 TSMC 사이에 공동 기술 공유 그룹을 만들자고 공식 제안했습니다. 이 동반 관계는 연구 개발 협력을 심화하고, 리소그래피와 칩 혁신을 조율하며, 반공식적인 기술 산업 블록을 형성할 것입니다. 대만은 이 구상을 지지하겠습니까?"
 HOL_voc.71.a: "기술 동맹을 승인한다. 우리의 미래는 디지털이다"
 HOL_voc.71.b: "거절한다. 기술적 독립을 유지해야 한다"
 HOL_voc.72.t: "대만의 ASML-TSMC 동반 관계 수락"
 HOL_voc.72.d: "대만이 공동 기술 공유 그룹에 대한 네덜란드의 제안을 수락했습니다. ASML과 TSMC를 중심으로 한 이 동맹은 유럽과 아시아에 걸친 반도체 혁신과 연구 주도권의 조율을 위한 토대를 마련합니다."
 HOL_voc.72.a: "다음 시대를 위한 산업 동맹이다."
 HOL_voc.73.t: "기술 공유 제안을 거절한 대만"
 HOL_voc.73.d: "대만이 ASML과 TSMC 사이의 공동 기술 동맹 제안을 거절했습니다. 외교 경로는 열려 있지만, 타이베이는 적어도 당분간은 반도체 전략에 대한 완전한 독립성을 유지하기로 했습니다."
 HOL_voc.73.a: "실망스러운 결과다."
 HOL_voc.74.t: "네덜란드의 반도체 수출 장악"
 HOL_voc.74.d: "전방위적인 전략적 조치로 네덜란드 정부가 모든 첨단 반도체 기술과 포토리소그래피 시스템에 대한 수출 통제 권한을 부여하는 새 법률을 제정했습니다. ASML을 이 결정의 핵심 자산으로 삼은 네덜란드는 이제 세계 칩 공급망에서 지배적인 위치를 차지하며, 국익과 외교적 입장에 따라 기술 수출을 승인하거나 제한하거나 차단할 권한을 쥐게 되었습니다."
 HOL_voc.74.a: "네덜란드에 대한 대응책을 마련해야 한다"
 HOL_voc.74.b: "이제 우리가 세계 기술의 열쇠를 쥐고 있다."
 HOL_voc.75.t: "네덜란드의 인도 금융 진출"
 HOL_voc.75.d: "네덜란드가 인도 내 금융 입지를 크게 확대하여 주요 도시에 네덜란드 계열 은행과 기업 사무소를 새로 열었습니다. 네덜란드 국가 기관과 다국적 기업이 참여한 조율된 노력에 힘입은 이 전략은 양자 투자를 심화하고 금융 시장에 영향력을 행사하며 급성장하는 인도 경제 내에서 경제적 지렛대를 키우는 것을 목표로 합니다. 노골적인 정치적 책동은 아니지만, 이는 지역의 경제 역학을 은밀히 바꾸고 있습니다."
 HOL_voc.75.a: "외국 자본에는 언제나 영향력이 따른다..."
 HOL_voc.76.t: "구자라트 항만 기반시설에 대한 네덜란드의 투자"
 HOL_voc.76.d: "네덜란드 정부가 국가가 후원하는 해운 기업과 금융 경로를 통해 구자라트 해안의 항만 기반시설 개선에 투자했습니다. 공식적으로는 무역 촉진 구상으로 제시되었지만, 네덜란드 사무소와 부두 시설의 설립은 국가 상업의 핵심 지역에서 외국의 장기적 지렛대에 대한 우려를 불러일으켰습니다. 이 조치는 외교적으로 민감하지만 경제적으로 중요합니다."
 HOL_voc.76.a: "그들의 영향력을 면밀히 주시하겠다."
 HOL_wic.01.t: "WIC의 진로 설정"
 HOL_wic.01.d: "서인도 회사가 한때 지배했던 영토를 되찾을 준비를 하며, 우리는 접근 방식을 결정해야 합니다. 외교 및 경제 전략은 평화적 통합으로 이어져 연성 권력으로 우리의 영향력을 강화할 수 있습니다. 반면 군사적 접근은 신속하고 결정적인 결과를 가져올 수 있지만, 저항과 장기 분쟁의 위험이 따릅니다."
 HOL_wic.01.a: "외교 및 경제적 노선을 추구한다"
 HOL_wic.01.b: "군사 전략을 채택한다"
 HOL_wic.02.t: "네덜란드의 부채 인수"
 HOL_wic.02.d: "네덜란드가 우리 국가 부채의 상당 부분을 사들여 사실상 우리 경제를 자국의 영향 아래에 두었습니다. 이 조치는 우리의 금융 위기에 즉각적인 숨통을 틔워 주었지만, 네덜란드가 이제 우리의 정책과 핵심 산업에 상당한 영향력을 쥐게 되었다는 뜻이기도 합니다."
 HOL_wic.02.a: "네덜란드의 금융 통제에 복종하는 수밖에 없다."
 HOL_wic.03.t: "세네갈에 대한 네덜란드의 최후통첩"
 HOL_wic.03.d: "네덜란드가 역사적인 호이레 섬을 포함한 세네갈 중부 주의 이양을 요구하는 최후통첩을 보냈습니다. 세네갈은 요구에 응하겠습니까, 대안을 제시하겠습니까, 아니면 단호히 거부하겠습니까?"
 HOL_wic.03.a: "응하여 세네갈 중부를 이양한다."
 HOL_wic.03.b: "대신 세네갈 북부를 제안한다."
 HOL_wic.03.c: "우리는 네덜란드의 침략에 굴복하기를 거부한다."
 HOL_wic.04.t: "영토 확보"
 HOL_wic.04.d: "세네갈이 우리의 최후통첩에 동의하여 세네갈 중부 주를 네덜란드의 통제에 넘겼습니다. 이는 서인도 회사의 유산을 되찾는 또 하나의 걸음입니다."
 HOL_wic.04.a: "네덜란드의 승리다."
 HOL_wic.05.t: "세네갈의 역제안"
 HOL_wic.05.d: "세네갈이 세네갈 중부 주의 이양을 거절하는 대신 세네갈 북부를 대안으로 제안했습니다. 이 역제안을 받아들여야 합니까, 아니면 원래의 요구를 고수해야 합니까?"
 HOL_wic.05.a: "역제안을 수락한다."
 HOL_wic.05.b: "역제안을 거절하고 이행을 요구한다."
 HOL_wic.06.t: "최후통첩 거부"
 HOL_wic.06.d: "세네갈이 우리의 최후통첩에 따르기를 거부했습니다. 이제 우리는 정당하게 우리의 것을 되찾기 위해 전쟁을 준비해야 합니다."
 HOL_wic.06.a: "전쟁은 불가피하다."
 HOL_wic.07.t: "세네갈에 대한 최종 최후통첩"
 HOL_wic.07.d: "세네갈이 우리의 역제안을 거부했습니다. 우리는 세네갈 북부를 넘기라는 마지막 기회를 주며, 거부하면 군사력으로 대응할 것입니다."
 HOL_wic.07.a: "세네갈 북부를 넘긴다."
 HOL_wic.07.b: "우리는 네덜란드의 침략에 맞서 방어한다."
 HOL_wic.08.t: "네덜란드의 최후통첩: 골드코스트 영토 이양"
 HOL_wic.08.d: "네덜란드가 골드코스트 영토를 자국의 통제에 넘기라고 요구하는 최후통첩을 보냈습니다. 그들은 엘미나 성과 같은 주요 교역소 운영을 포함해 서인도 회사 시절 이 지역에 있었던 역사적 존재를 근거로 듭니다. 응하면 충돌을 피할 수 있겠지만, 가나의 주권을 훼손하고 지역을 불안정하게 할 것입니다."
 HOL_wic.08.a: "응하여 골드코스트를 이양한다."
 HOL_wic.08.b: "우리는 네덜란드의 요구에 굴복하기를 거부한다."
 HOL_wic.09.t: "골드코스트 영토 확보"
 HOL_wic.09.d: "가나 정부가 전략적 요충지인 엘미나 성을 포함한 골드코스트 영토를 네덜란드의 통제에 넘기는 데 동의했습니다. 이는 서인도 회사의 유산을 복원하고 서아프리카에서 우리의 입지를 강화하는 중요한 걸음입니다."
 HOL_wic.09.a: "네덜란드와 WIC의 승리다."
 HOL_wic.10.t: "네덜란드 최후통첩을 거부한 가나"
 HOL_wic.10.d: "가나 정부가 골드코스트 영토를 이양하라는 우리의 최후통첩을 거부했습니다. 그들의 반발로 인해 우리는 정당하게 우리의 것이라 여기는 영토를 되찾고 이 지역에서 네덜란드의 영향력을 회복하기 위한 군사 행동을 준비하는 수밖에 없습니다."
 HOL_wic.10.a: "전쟁만이 유일한 답이 될 것이다."
 HOL_wic.11.t: "네덜란드의 최후통첩: 루안다 주 이양"
 HOL_wic.11.d: "네덜란드가 루안다 주를 네덜란드의 통제에 넘기라고 요구하는 최후통첩을 보냈습니다. 그들은 이 지역에 대한 서인도 회사의 관여를 근거로 이 영토가 자국의 역사적 해양 제국의 일부라고 주장합니다. 이는 충돌을 피하게 해 주겠지만, 앙골라를 정치적, 경제적으로 불안정하게 할 수 있습니다."
 HOL_wic.11.a: "응하여 루안다 주를 네덜란드의 통제에 이양한다."
 HOL_wic.11.b: "우리는 네덜란드의 요구에 복종하기를 거부한다."
 HOL_wic.12.t: "네덜란드 최후통첩을 수락한 앙골라"
 HOL_wic.12.d: "앙골라 정부가 루안다 주를 네덜란드의 통제에 넘기는 데 동의했습니다. 이 전략적 획득은 대서양에서 네덜란드 해양 유산의 핵심 일부를 복원하고 이 지역에서 우리의 입지를 강화합니다."
 HOL_wic.12.a: "WIC 복원을 향한 또 한 걸음이다."
 HOL_wic.13.t: "네덜란드 최후통첩을 거부한 앙골라"
 HOL_wic.13.d: "앙골라 정부가 루안다 주를 이양하라는 우리의 최후통첩을 거부했습니다. 그들의 반발로 인해 우리는 정당하게 우리의 것이라 여기는 영토를 되찾기 위한 군사 행동을 준비하는 수밖에 없습니다."
 HOL_wic.13.a: "무력으로 우위를 확립해야 한다."
 HOL_wic.14.t: "네덜란드의 최후통첩: 세인트헬레나 이양"
 HOL_wic.14.d: "네덜란드가 세인트헬레나를 자국의 통제에 넘기라고 요구하는 최후통첩을 보냈습니다. 네덜란드는 이 섬이 자국 해양 제국과 맺은 역사적 연관성과 대서양 무역망에서의 전략적 중요성을 근거로 이 주장을 정당화합니다. 응하면 충돌을 피할 수 있지만, 이 지역에서 영국의 이익을 해칠 수 있습니다."
 HOL_wic.14.a: "응하여 세인트헬레나를 네덜란드의 통제에 이양한다."
 HOL_wic.14.b: "우리는 네덜란드의 요구에 굴복하기를 거부한다."
 HOL_wic.15.t: "세인트헬레나 확보"
 HOL_wic.15.d: "영국 정부가 세인트헬레나를 네덜란드의 통제에 넘기는 데 동의했습니다. 이 획득은 네덜란드 해양 유산의 중요한 일부를 복원하고 대서양 무역로에 대한 우리의 지배력을 강화합니다."
 HOL_wic.15.a: "네덜란드와 WIC의 큰 승리다."
 HOL_wic.16.t: "네덜란드 최후통첩을 거부한 잉글랜드"
 HOL_wic.16.d: "영국 정부가 세인트헬레나를 이양하라는 우리의 최후통첩을 거부했습니다. 그들의 결정으로 인해 우리는 이 핵심 섬을 되찾기 위한 군사 행동을 준비하는 수밖에 없습니다."
 HOL_wic.16.a: "전쟁을 준비해야 한다."
 HOL_wic.17.t: "네덜란드의 산후안 바우티스타 반환 요구"
 HOL_wic.17.d: "뜻밖에도 네덜란드가 역사적으로 산후안 바우티스타로 알려진 푸에르토리코의 이양을 요구하는 공식 최후통첩을 보냈습니다. 그들은 이 섬이 서인도 회사의 해양 유산을 복원하고 카리브해에서의 지배력을 재확립하는 데 필요한 단계라고 주장합니다. 네덜란드는 17세기의 야망과 전략적 필요성을 근거로 들지만, 응하는 것은 미국에게 중대한 지정학적 양보가 될 것입니다."
 HOL_wic.17.a: "푸에르토리코를 네덜란드에 할양한다."
 HOL_wic.17.b: "우리는 미국의 영토를 외세에 결코 내주지 않는다."
 HOL_wic.18.t: "네덜란드 통제로 돌아온 산후안 바우티스타"
 HOL_wic.18.d: "미국이 푸에르토리코를 네덜란드의 통제에 할양하는 데 동의했습니다. 산후안 바우티스타의 이 역사적인 수복은 카리브해의 핵심 고리를 복원하고 우리의 해양 야망을 공고히 하며 서인도 회사의 유산을 기립니다."
 HOL_wic.18.a: "네덜란드의 영향력에 영광스러운 날이다."
 HOL_wic.19.t: "네덜란드 최후통첩을 거부한 미국"
 HOL_wic.19.d: "미국이 푸에르토리코를 할양하라는 우리의 최후통첩을 단호히 거부했습니다. 그들의 반발은 카리브해에 대한 우리의 정당한 영유권을 훼손하며, 이제 우리는 산후안 바우티스타를 무력으로 확보하기 위해 전쟁을 준비해야 합니다."
 HOL_wic.19.a: "무력으로 차지한다. 카리브해는 우리의 것이 될 것이다!"
 HOL_wic.20.t: "네덜란드의 영국령 앤틸리스 요구"
 HOL_wic.20.d: "네덜란드가 영국령 앤틸리스의 이양을 요구하는 공식 최후통첩을 보냈습니다. 그들은 이 섬들이 카리브해에서의 전략적 가치를 지니며 서인도 회사 시절 자국의 역사적 야망에서 불가분의 일부였다고 주장합니다. 거부하면 이 지역에서 충돌이 일어날 수 있습니다."
 HOL_wic.20.a: "영국령 앤틸리스를 네덜란드의 통제에 이양한다."
 HOL_wic.20.b: "우리는 영국 영토를 내주기를 거부한다."
 HOL_wic.21.t: "영국령 앤틸리스 이양"
 HOL_wic.21.d: "영국 정부가 우리의 요구에 동의하여 영국령 앤틸리스를 네덜란드의 통제에 할양했습니다. 이 성공은 카리브해에서 서인도 회사의 영향력을 복원하는 또 하나의 걸음입니다."
 HOL_wic.21.a: "카리브해가 다시 한번 네덜란드의 것이 된다."
 HOL_wic.22.t: "네덜란드 최후통첩을 거부한 영국"
 HOL_wic.22.d: "영국이 영국령 앤틸리스를 우리에게 할양하기를 거부했습니다. 그들의 반발을 그냥 넘길 수는 없으며, 우리는 이 핵심 섬들을 무력으로 차지할 준비를 해야 합니다."
 HOL_wic.22.a: "전쟁으로 우리의 것을 되찾는다."
 HOL_wic.23.t: "네덜란드의 트리니다드 통제권 요구"
 HOL_wic.23.d: "네덜란드가 트리니다드를 네덜란드의 통제에 넘기라고 요구하는 공식 최후통첩을 보냈습니다. 네덜란드는 17세기 초 이 섬이 잠시 '뉴 발헤런'으로 구상되었던 서인도 회사 시절의 역사적 야망을 근거로 듭니다. 카리브해에서 이 섬의 전략적 위치는 해상 지배와 무역로에 있어 매우 귀중합니다."
 HOL_wic.23.a: "트리니다드를 네덜란드에 할양한다."
 HOL_wic.23.b: "우리는 네덜란드의 요구에 굴복하기를 거부한다."
 HOL_wic.24.t: "네덜란드 통제로 돌아온 트리니다드"
 HOL_wic.24.d: "트리니다드 정부가 우리의 최후통첩을 수락하고 섬의 통제권을 이양했습니다. 이 핵심 획득은 카리브해에서 우리의 영향력을 강화하고 이 지역에서 네덜란드의 지배력을 재확립하며 뉴 발헤런의 구상을 실현합니다."
 HOL_wic.24.a: "서인도 회사에 결정적인 걸음이다."
 HOL_wic.25.t: "네덜란드 최후통첩을 거부한 트리니다드"
 HOL_wic.25.d: "트리니다드 정부가 섬에 대한 우리의 요구에 따르기를 거부했습니다. 그들의 반발로 인해 우리는 이 전략적 요충지를 되찾기 위한 전쟁을 준비하는 수밖에 없습니다."
 HOL_wic.25.a: "전쟁을 위해 병력을 준비하라!"
 HOL_wic.26.t: "네덜란드의 수리남 반환 요구"
 HOL_wic.26.d: "네덜란드가 수리남을 자국의 통제로 돌려 달라고 요구하는 공식 최후통첩을 보냈습니다. 한때 네덜란드 통치 아래의 핵심 식민지였던 수리남의 전략적 위치와 풍부한 자원은 서인도 회사의 영향력을 되살리는 열쇠로 여겨집니다. 응하면 충돌을 피할 수 있지만 주권의 상실을 의미합니다."
 HOL_wic.26.a: "수리남을 네덜란드에 할양한다."
 HOL_wic.26.b: "우리는 네덜란드의 요구에 복종하기를 거부한다."
 HOL_wic.27.t: "네덜란드 통제로 돌아온 수리남"
 HOL_wic.27.d: "수리남 정부가 우리의 최후통첩을 수락하고 자국 영토의 통제권을 이양했습니다. 이 평화적 획득은 남아메리카의 핵심 고리를 확보하여 네덜란드의 야망을 더욱 추진할 자원과 전략적 입지를 제공합니다."
 HOL_wic.27.a: "WIC의 또 하나의 승리다!"
 HOL_wic.28.t: "네덜란드 최후통첩을 거부한 수리남"
 HOL_wic.28.d: "수리남 정부가 우리의 요구에 따르기를 거부했습니다. 그들의 반발을 그냥 넘길 수는 없으며, 우리는 군사적 수단으로 수리남을 차지할 준비를 해야 합니다."
 HOL_wic.28.a: "전쟁을 준비하라!"
 HOL_wic.29.t: "네덜란드의 가이아나 통제권 요구"
 HOL_wic.29.d: "네덜란드가 가이아나를 네덜란드의 통제에 넘기라고 요구하는 공식 최후통첩을 보냈습니다. 역사적으로 네덜란드령 기아나의 일부였던 이 영토는 풍부한 자원과 전략적 가치를 지니고 있습니다. 네덜란드는 가이아나를 되찾는 것이 서인도 회사의 야망을 되살리고 남아메리카에서 지배력을 공고히 하는 데 필수적이라고 주장합니다."
 HOL_wic.29.a: "가이아나를 네덜란드에 이양한다."
 HOL_wic.29.b: "우리는 네덜란드의 요구에 복종하기를 거부한다."
 HOL_wic.30.t: "네덜란드 통제로 돌아온 가이아나"
 HOL_wic.30.d: "가이아나 정부가 우리의 요구를 수락하고 자국 영토의 통제권을 이양했습니다. 이 평화적 획득은 남아메리카에서 네덜란드의 영향력을 되살리고 서인도 회사의 야망을 실현합니다."
 HOL_wic.30.a: "네덜란드의 결의가 거둔 승리다!"
 HOL_wic.31.t: "네덜란드 최후통첩을 거부한 가이아나"
 HOL_wic.31.d: "가이아나 정부가 우리의 최후통첩에 따르기를 거부했습니다. 그들의 반발을 그냥 넘길 수는 없으며, 우리는 군사적 수단으로 영토를 차지할 준비를 해야 합니다."
 HOL_wic.31.a: "가이아나를 무력으로 차지한다."
 HOL_wic.32.t: "네덜란드의 프랑스령 기아나 통제권 요구"
 HOL_wic.32.d: "네덜란드가 프랑스령 기아나를 네덜란드의 통제에 넘기라고 요구하는 공식 최후통첩을 보냈습니다. 역사적으로 아메리카 대륙에서 네덜란드 식민지 야망의 일부였다며, 그들은 이 영토가 이 지역에서 서인도 회사의 지배력을 복원하기 위한 필수 단계라고 주장합니다. 응하면 전쟁을 피할 수 있지만 프랑스의 위신과 주권을 훼손할 위험이 있습니다."
 HOL_wic.32.a: "프랑스령 기아나를 네덜란드에 할양한다."
 HOL_wic.32.b: "우리는 네덜란드의 요구에 복종하기를 거부한다."
 HOL_wic.33.t: "네덜란드 통제로 이양된 프랑스령 기아나"
 HOL_wic.33.d: "프랑스 정부가 우리의 요구를 수락하고 프랑스령 기아나의 통제권을 이양했습니다. 이 승리는 핵심 영토를 네덜란드의 통제로 되돌려 남아메리카에서 우리의 영향력을 공고히 하고 서인도 회사의 야망을 실현합니다."
 HOL_wic.33.a: "네덜란드 야망의 커다란 성공이다!"
 HOL_wic.34.t: "네덜란드 최후통첩을 거부한 프랑스"
 HOL_wic.34.d: "프랑스 정부가 프랑스령 기아나를 이양하라는 우리의 최후통첩을 단호히 거부했습니다. 그들의 반발을 그냥 넘길 수는 없으며, 우리는 이 핵심 영토를 되찾고 아메리카 대륙에서 우리의 지배력을 확립하기 위한 전쟁을 준비해야 합니다."
 HOL_wic.34.a: "무력으로 차지한다!"
 HOL_wic.35.t: "네덜란드의 브라질 북부 통제권 요구"
 HOL_wic.35.d: "네덜란드가 브라질 북부 영토의 이양을 요구하는 공식 최후통첩을 보냈습니다. 이 지역들은 17세기에 서인도 회사가 페르남부쿠와 그 주변 지역에 단명한 식민지를 세웠을 때 네덜란드의 통제 아래에 있었습니다. 네덜란드는 이제 이 땅을 되찾는 것이 남아메리카에서 영향력을 되살리고 핵심 자원을 확보하는 데 필수적이라고 주장합니다."
 HOL_wic.35.a: "영토를 네덜란드에 이양한다."
 HOL_wic.35.b: "우리는 그들의 요구를 거부한다. 브라질은 굳건히 설 것이다."
 HOL_wic.36.t: "브라질의 북부 영토 이양"
 HOL_wic.36.d: "브라질 정부가 우리의 요구를 수락하고 북부 영토의 통제권을 이양했습니다. 이 중대한 획득은 남아메리카에서 우리 식민지 유산의 한 조각을 복원하고 이 지역에서 네덜란드의 입지를 강화합니다."
 HOL_wic.36.a: "서인도 회사의 위대한 승리다!"
 HOL_wic.37.t: "네덜란드 최후통첩을 거부한 브라질"
 HOL_wic.37.d: "브라질 정부가 우리의 최후통첩을 거부하고 북부 영토에 대한 우리의 영유권 주장을 일축했습니다. 그들의 반발로 인해 우리는 이 지역들을 무력으로 되찾기 위한 군사 행동을 준비하는 수밖에 없습니다."
 HOL_wic.37.a: "거부당하지 않겠다! 전쟁을 준비하라!"
 HOL_wic.38.t: "네덜란드의 최후통첩: 네덜란드계 미국 영토의 반환"
 HOL_wic.38.d: "네덜란드가 뉴네덜란드에 속했던 지역을 포함한 동부 해안의 옛 네덜란드 영토의 이양을 요구하는 이례적인 최후통첩을 보냈습니다. 그들은 뉴암스테르담의 유산과 이 지역들의 건립에 미친 네덜란드의 영향을 근거로 이를 역사적 권리의 일부라고 주장합니다. 응하는 것은 커다란 외교적 양보로 여겨질 것이며 미국의 자긍심과 주권을 뒤흔들 수 있습니다."
 HOL_wic.38.a: "협상하여 영토를 이양한다."
 HOL_wic.38.b: "우리는 미국의 영토를 결코 내주지 않는다!"
 HOL_wic.39.t: "미국의 네덜란드계 미국 영토 이양"
 HOL_wic.39.d: "전례 없는 상황 전개 속에서 미국이 핵심 영토의 통제권을 네덜란드에 되돌려 주기로 동의했습니다. 이 기념비적인 승리는 아메리카 대륙에서 네덜란드의 영향력을 재확립하고 뉴암스테르담의 역사적 정신을 되살립니다."
 HOL_wic.39.a: "네덜란드 외교의 역사적 성공이다!"
 HOL_wic.40.t: "네덜란드 최후통첩을 거부한 미국"
 HOL_wic.40.d: "미국이 네덜란드계 미국 영토의 반환을 요구하는 우리의 요구를 단호히 거부했습니다. 그들의 반발로 인해 우리는 이 땅을 무력으로 되찾기 위한 전쟁을 준비하는 수밖에 없습니다. 뉴암스테르담의 자긍심은 반드시 회복되어야 합니다!"
 HOL_wic.40.a: "전쟁으로 우리의 것을 되찾는다!"
 HOL_nvu.4.t: "교육 개혁 완료"
 HOL_nvu.4.d: "1년의 전환기를 거쳐 새로운 교육 제도가 완전히 가동되었습니다. 다음 세대는 이제 충성, 규율, 자긍심이라는 가치로 빚어지고 있으며, 이는 국가의 미래를 보장합니다."
 HOL_nvu.4.a: "개혁은 대성공이다!"
 HOL_nvu.5.t: "네덜란드의 최후통첩: 디츠란트 통일"
 HOL_nvu.5.d: "네덜란드 정부가 벨기에에 디츠란트를 통일하기 위해 플랑드르를 즉각 이양하라고 요구하는 최후통첩을 보냈습니다. 벨기에는 이제 이 요구를 수락할지, 거부에 따른 결과를 감수할지 결정해야 합니다."
 HOL_nvu.5.a: "요구를 수락하고 플랑드르를 이양한다."
 HOL_nvu.5.b: "최후통첩을 거부한다."
 HOL_nvu.6.t: "네덜란드 요구에 대한 벨기에의 굴복"
 HOL_nvu.6.d: "네덜란드의 최후통첩에 압박을 받은 벨기에가 플랑드르를 네덜란드에 이양하는 데 동의했습니다. 이는 디츠란트 통일을 향한 중요한 걸음입니다."
 HOL_nvu.6.a: "디츠란트의 통일이 시작된다!"
 HOL_nvu.7.t: "네덜란드 최후통첩을 거부한 벨기에"
 HOL_nvu.7.d: "벨기에가 플랑드르를 이양하라는 네덜란드의 최후통첩을 단호히 거부하여 통일된 디츠란트라는 구상에 도전했습니다. 이제 네덜란드는 행동에 나서 무력으로 영유권을 관철할 준비를 해야 합니다."
 HOL_nvu.7.a: "벨기에 전체를 디츠란트의 것으로 삼는다!"
 HOL_nvu.8.t: "네덜란드의 제안: 플랑드르 군 통합"
 HOL_nvu.8.d: "네덜란드 정부가 우리 군의 플랑드르 부대를 자국 군사 구조에 흡수하겠다고 공식 요청했습니다. 정치적으로 민감하지만, 이 제안은 더 큰 지역 협력을 향한 조치로 포장되어 있습니다."
 HOL_nvu.8.a: "이전을 수락한다"
 HOL_nvu.8.b: "제안을 거절한다"
 HOL_nvu.9.t: "벨기에의 통합 거래 수락"
 HOL_nvu.9.d: "벨기에 정부가 플랑드르 육군 부대를 우리 군사 구조로 이전하는 데 동의했습니다. 통합 절차가 즉시 시작될 것입니다."
 HOL_nvu.9.a: "훌륭하다"
 HOL_nvu.10.t: "제안을 거절한 벨기에"
 HOL_nvu.10.d: "벨기에 정부가 플랑드르 육군 요소를 통합하자는 우리의 제안을 거절했습니다. 이 제안은 그들의 지도부에 의해 정치적으로 받아들일 수 없다고 판단되었습니다."
 HOL_nvu.10.a: "실망스럽다"
 HOL_nvu.11.t: "네덜란드의 제안"
 HOL_nvu.11.d: "네덜란드가 양국 사이의 군사적, 문화적 정렬 협약인 '게르만 형제 국가 연합'의 결성을 제안했습니다. 이념적으로는 양립할 수 있지만, 장기적인 영향을 신중하게 따져 보아야 합니다."
 HOL_nvu.11.a: "제안을 수락한다"
 HOL_nvu.11.b: "발상을 거절한다"
 HOL_nvu.12.t: "독일의 형제 연합 수락"
 HOL_nvu.12.d: "독일이 게르만 형제 국가 연합을 결성하는 데 동의했습니다. 유럽에 새로운 지정학적 축이 등장했습니다."
 HOL_nvu.12.a: "미래는 우리의 것이다"
 HOL_nvu.13.t: "독일의 형제 연합 거절"
 HOL_nvu.13.d: "베를린이 게르만 형제 연합을 맺자는 우리의 제안을 거절했습니다. 통합의 구상은 연기되거나, 강제되어야 합니다."
 HOL_nvu.13.a: "수치스럽다"
 HOL_nvu.14.t: "게르만 형제 연합의 탄생"
 HOL_nvu.14.d: "네덜란드와의 협상이 성공을 거두어 게르만 형제 국가 연합이 공식적으로 수립되었습니다. 이 새로운 동맹은 공유된 문화적 정체성, 군사 협력, 이념적 단결을 토대로 합니다. 독일은 이제 새로운 북방 축의 중심에 서 있습니다."
 HOL_nvu.14.a: "단결은 힘이다"
 HOL_nvu.15.t: "게르만 기반시설 사업"
 HOL_nvu.15.d: "게르만 형제 연합 회원국 사이의 통합을 심화하고 전략적 기동성을 개선하기 위해, 우리는 양국을 잇는 핵심 기반시설에 투자하기로 했습니다. 현대적인 철도와 도로망이 우리 북방 동맹의 심장부를 어느 때보다 가깝게 묶어 줄 것입니다."
 HOL_nvu.15.a: "단결의 토대를 놓는다"
 HOL_nvu.16.t: "라인란트에 대한 자원 투자"
 HOL_nvu.16.d: "독일과의 협력이 깊어지는 가운데, 네덜란드 기술자와 산업 계획가들이 라인란트에서 새로운 개발 사업을 시작했습니다. 강철과 알루미늄에 대한 접근 확대에 초점을 맞춘 이 사업은 지역의 산업 생산을 늘리고 게르만의 대의를 위한 핵심 자재를 확보할 것입니다."
 HOL_nvu.16.a: "산업을 통한 강함"
 HOL_nvu.17.t: "게르만 형제 연합 가입 초청"
 HOL_nvu.17.d: "네덜란드가 오스트리아를 게르만 형제 국가 연합에 가입하도록 공식 초청했습니다. 이 동맹은 공동의 전략 목표, 문화적 단결, 군사 협력을 약속합니다. 우리는 통합된 게르만의 미래에 대한 그들의 구상을 받아들이겠습니까?"
 HOL_nvu.17.a: "그들의 제안을 받아들인다"
 HOL_nvu.17.b: "거절해야 한다"
 HOL_nvu.18.t: "오스트리아의 형제 연합 수락"
 HOL_nvu.18.d: "오스트리아가 게르만 형제 연합에 가입하라는 우리의 초청을 수락했습니다. 또 하나의 자랑스러운 게르만 국가가 단결과 힘 속에서 우리와 함께합니다."
 HOL_nvu.18.a: "환영한다, 오스트리아여"
 HOL_nvu.19.t: "오스트리아의 형제 연합 거절"
 HOL_nvu.19.d: "오스트리아가 게르만 형제 연합에 가입하라는 우리의 초청을 거절했습니다. 그들의 거절은 기억될 것입니다."
 HOL_nvu.19.a: "그들은 이를 후회하게 될 것이다"
 HOL_nvu.20.t: "네덜란드의 해군 지원"
 HOL_nvu.20.d: "네덜란드가 물자 원조와 해양 투자를 보내 우리의 해군 야망에 도움의 손길을 내밀었습니다. 그들의 전문 지식으로 오스트리아 함대의 토대가 마침내 놓이고 있습니다."
 HOL_nvu.20.a: "오스트리아 해군의 부활"
 HOL_nvu.21.t: "게르만 연합의 강화"
 HOL_nvu.21.d: "게르만 국가들 사이의 지속적인 협력을 보장하기 위해 네덜란드가 외교 조율, 공동 군사 계획, 경제 지원을 제공하는 추가 통합 정책을 시작했습니다. 형제 연합은 진정한 연합으로 진화하고 있습니다."
 HOL_nvu.21.a: "단결이 곧 힘이다"
 HOL_nvu.22.t: "네덜란드의 통일 제안"
 HOL_nvu.22.d: "네덜란드가 게르만 민족을 하나의 국가 아래 완전히 통일하자고 제안했습니다. 이제 우리는 단결을 받아들일지, 떨어져 있을지 결정해야 합니다."
 HOL_nvu.22.a: "우리는 연합을 수락한다"
 HOL_nvu.22.b: "우리는 그들의 제안을 거절한다"
 HOL_nvu.23.t: "통일 수락"
 HOL_nvu.23.d: "우리의 통일 제안이 받아들여졌습니다. 네덜란드의 지도 아래 새로운 게르만 제국이 탄생합니다."
 HOL_nvu.23.a: "꿈이 이루어졌다"
 HOL_nvu.24.t: "통일 거부"
 HOL_nvu.24.d: "우리의 통일 제안이 거절당했습니다. 이제 우리는 형제 연합이 여기서 끝날지, 무력으로 계속될지 결정해야 합니다."
 HOL_nvu.24.a: "그렇다면 우리가 차지하겠다"
 HOL_nvu.25.t: "오스트리아 자원에 대한 네덜란드의 투자"
 HOL_nvu.25.d: "경제 통합의 새로운 단계로, 네덜란드 정부가 오스트리아의 자원 채굴 및 정제 부문에 대규모 투자를 제안했습니다. 이 조치는 핵심 기반시설을 현대화하고 지역 전체의 원자재 산출을 높일 것입니다."
 HOL_nvu.25.a: "이는 우리의 산업 기반을 강화할 것이다."
 HOL_nvu.26.t: "범게르만 철도 기반시설에 대한 네덜란드의 투자"
 HOL_nvu.26.d: "네덜란드 정부가 게르만 지역 전역의 철도 기반시설을 개선하고 확장하기 위한 대규모 투자 프로그램을 발표했습니다. 관계자들은 그 목표가 더 넓은 독일계 민족들 사이의 이동성, 경제 통합, 문화적 단결을 개선하는 것이라고 밝혔습니다. 이 조치는 네덜란드의 대륙적 구상과 중부 유럽에서 커져 가는 기반시설 야망에 부합합니다."
 HOL_nvu.26.a: "공동의 운명을 위한 철의 길이다."
 HOL_nvu.27.t: "네덜란드의 통일 제안"
 HOL_nvu.27.d: "네덜란드가 게르만 민족을 하나의 국가 아래 완전히 통일하자고 제안했습니다. 이제 우리는 단결을 받아들일지, 떨어져 있을지 결정해야 합니다."
 HOL_nvu.27.a: "우리는 연합을 수락한다"
 HOL_nvu.27.b: "우리는 그들의 제안을 거절한다"
 HOL_nvu.28.t: "통일 수락"
 HOL_nvu.28.d: "우리의 통일 제안이 받아들여졌습니다. 네덜란드의 지도 아래 새로운 게르만 제국이 탄생합니다."
 HOL_nvu.28.a: "꿈이 이루어졌다"
 HOL_nvu.29.t: "통일 거부"
 HOL_nvu.29.d: "우리의 통일 제안이 거절당했습니다. 이제 우리는 형제 연합이 여기서 끝날지, 무력으로 계속될지 결정해야 합니다."
 HOL_nvu.29.a: "그렇다면 우리가 차지하겠다"
 HOL_common_event.18.t: "국립 군사 박물관의 사바톤 공연"
 HOL_common_event.18.d: "수스터르베르흐의 국립 군사 박물관이 사바톤의 영화 '모든 전쟁을 끝내기 위한 전쟁'의 상영회를 개최했으며, 밴드 공동 창립자 페르 순드스트룀이 직접 참석했습니다. 이번 방문은 제1차 세계 대전의 역사를 폭넓은 새 관객에게 알리고 우리의 군사 유산에 새로운 관심을 불러일으킵니다."
 HOL_common_event.18.a: "우리의 군사 역사는 새로운 세대에게 영감을 준다."
 HOL_ing_group_strategy_category: "ING 그룹 전략"
 HOL_ing_group_strategy_category_desc: "\n£ing_bank_category_picture \n\n\n\n세계 경제 순환이 성장기와 침체기를 오가는 가운데, ING 은행은 이러한 변동을 활용할 태세를 갖추고 있습니다. 일련의 계산된 금융 책략을 통해 ING는 국내외 시장에 영향력을 확대하여 회복 노력과 확장 호황을 모두 이끌 수 있습니다. 이러한 결정은 네덜란드가 은행의 금융적 영향력을 활용해 성장을 촉진하고, 위험을 관리하며, 투자 수익을 극대화할 수 있게 해 줍니다. 대출 정책을 전략적으로 조정하고, 소비자 지출을 진작하며, 세계 무역망을 확대함으로써 ING는 시장 입지를 강화할 뿐 아니라 네덜란드가 금융 강국이라는 위상을 공고히 할 것입니다."
 HOL_ing_group_strategies_expansion_GER: "도이체 ING"
 HOL_ing_group_strategies_expansion_GER_desc: "§Y[GER.GetNameWithFlag]§!은(는) 소매 금융과 기업 금융에 상당한 투자를 한 ING의 핵심 시장입니다. 이곳에서 ING의 사업을 확장하면 유럽 은행 부문에서의 입지가 더욱 공고해질 것입니다."
 HOL_ing_group_strategies_expansion_POL: "ING 방크 실롱스키"
 HOL_ing_group_strategies_expansion_POL_desc: "ING는 ING 방크 실롱스키를 통해 §Y[POL.GetNameWithFlag]§!에 탄탄한 입지를 구축했습니다. 빠르게 성장하는 이 시장에서 더 확장하면 중동부 유럽에서 ING의 영향력이 높아질 것입니다."
 HOL_ing_group_strategies_expansion_AST: "ING 다이렉트 오스트레일리아"
 HOL_ing_group_strategies_expansion_AST_desc: "§Y[AST.GetAdjective]§!의 혁신 주도형 경제는 ING가 디지털 뱅킹과 연구를 선도할 기회를 제공합니다. 오스트레일리아에서 사업을 확장하면 ING의 기술 성장을 이끌고 핀테크 선두 주자로서의 입지를 공고히 할 것입니다."
 HOL_ing_group_strategies_expansion_SPR: "ING 에스파냐"
 HOL_ing_group_strategies_expansion_SPR_desc: "§Y[SPR.GetNameWithFlag]§!은(는) 디지털 뱅킹과 기반시설 투자의 역동적인 시장입니다. 스페인에서 입지를 늘리면 ING는 커져 가는 도시 개발을 활용하고 건설 금융 포트폴리오를 개선할 수 있습니다."
 HOL_ing_group_strategies_expansion_ITA: "ING 이탈리아"
 HOL_ing_group_strategies_expansion_ITA_desc: "§Y[ITA.GetNameWithFlag]§!은(는) 기업 금융 분야에서 성장 기회가 있는 성숙한 금융 시장을 제공합니다. 이탈리아로 확장하면 ING가 남유럽에서 더 확고한 발판을 마련하고 경제 성장률을 높이는 데 도움이 될 것입니다."
 HOL_ing_group_strategies_expansion_TUR: "ING 뱅크 튀르키예"
 HOL_ing_group_strategies_expansion_TUR_desc: "유럽과 아시아 사이에 위치한 §Y[TUR.GetAdjective]§!의 전략적 위치는 ING가 무역 및 금융 영향력을 확대할 독특한 기회를 제공합니다. 튀르키예에 투자함으로써 ING는 무역 관련 금융 활동을 크게 늘릴 수 있습니다."
 HOL_ing_group_strategies_expansion_USA: "ING 미국 투자 운용"
 HOL_ing_group_strategies_expansion_USA_desc: "세계 최대 경제인 §Y[USA.GetNameWithFlag]§!은(는) 특히 투자 운용 분야에서 ING에 막대한 기회를 제공합니다. 미국으로 확장하면 자산 운용 분야에서 주요 글로벌 주체로서 ING의 역할이 확고해질 것입니다."
 HOL_ing_group_strategies_expansion_ROM: "ING 뱅크 루마니아"
 HOL_ing_group_strategies_expansion_ROM_desc: "§Y[ROM.GetAdjective]§!의 신흥 시장은 ING에 기반시설과 경제 발전을 지원할 기회를 제공합니다. 루마니아에 대한 추가 투자는 성장하는 동유럽 금융 부문에서 ING의 영향력을 높일 것입니다."
 HOL_ing_group_strategies_expansion_speciality1: "ING 디지털 퍼스트"
 HOL_ing_group_strategies_expansion_speciality1_desc: "세계가 점점 디지털 솔루션으로 옮겨 가는 가운데, ING는 디지털 퍼스트 전략을 통해 디지털 뱅킹의 선두 주자로서의 입지를 확보할 수 있습니다. 이 분야에 특화하면 사이버 보안이 개선되고, 거래 비용이 줄며, 디지털 뱅킹 효율이 높아질 것입니다."
 HOL_ing_group_strategies_expansion_speciality2: "ING 테라 접근법"
 HOL_ing_group_strategies_expansion_speciality2_desc: "투자를 세계 기후 목표에 맞추겠다는 의지에 따라, ING의 테라 접근법은 녹색 에너지 사업과 지속 가능한 개발에 대한 자금 조달에 초점을 맞춥니다. 지속 가능 금융에 특화하면 녹색 에너지 산출이 늘고 환경을 의식하는 투자가 유치될 것입니다."
 HOL_ing_group_strategies_expansion_speciality3: "ING 홀세일 뱅킹"
 HOL_ing_group_strategies_expansion_speciality3_desc: "기업 고객은 ING 사업의 핵심 초점입니다. 홀세일 뱅킹에 특화함으로써 ING는 대기업에 맞춤형 금융 솔루션을 제공하는 능력을 높여 기업 성장과 수익을 이끌 것입니다."
 HOL_ing_group_strategies_expansion_speciality4: "ING 웰스 서비스"
 HOL_ing_group_strategies_expansion_speciality4_desc: "자산 관리는 높은 수익과 장기적인 고객 관계를 제공합니다. 자산 관리에 특화하면 ING는 고액 자산가를 대상으로 하여 자산 소득세 수입을 늘리고 개인 금융 서비스를 넓힐 수 있습니다."
 HOL_carrier_production: "항공모함 획득 계획"
 HOL_carrier_production_desc: "\n£hol_carrier_program_decision_category \n\n\n\n네덜란드는 여러 국가로부터 항공모함을 획득하여 해군 역량을 확대하고자 합니다. 이러한 결정은 전략적 동반 관계와 군사 조달을 통해 우리 함대를 강화하고 바다 전역에 전력을 투사할 수 있게 해 줄 것입니다."
 HOL_request_carrier_production_uk: "항공모함 건조에 대한 영국의 지원 요청"
 HOL_request_carrier_production_uk_desc: "영국 해군은 수 세기에 걸친 해양 경험을 보유하고 있으며, 현대적인 퀸 엘리자베스급 항공모함은 최첨단 해군 설계를 보여 줍니다. 영국과의 동반 관계는 네덜란드의 원정 작전과 NATO 작전에 맞춘 새 함선을 공동 개발할 수 있게 해 줄 것입니다."
 HOL_request_carrier_production_chn: "항공모함 건조에 대한 중국의 지원 요청"
 HOL_request_carrier_production_chn_desc: "중국의 급속한 해군 확장은 중국을 세계적인 조선 강국으로 자리매김하게 했습니다. 중국의 산업 규모와 현대적인 군사 설계를 활용하면 독특한 능력을 지닌 항공모함을 배치할 수 있지만, 이러한 제휴는 서방 파트너와의 관계에 부담을 줄 수 있습니다."
 HOL_request_carrier_production_dutch: "자국 항공모함 건조에 투자"
 HOL_request_carrier_production_dutch_desc: "네덜란드는 자국 조선소와 선진 네덜란드 공학 기술을 이용해 독자적인 항공모함 건조에 착수합니다. 외국의 지원보다 더 느리고 비용이 많이 들지만, 이 노력은 국가 주권을 강화하고 우리 해군 산업을 뒷받침합니다."
 HOL_influence_flanders: "§Y[FLN.GetNameWithFlag]§!에서의 존재감"
 HOL_influence_flanders_desc: "§Y[HOL.GetNameWithFlag]§!과(와) §Y[FLN.GetNameWithFlag]§! 사이의 깊은 문화적, 역사적 유대로 인해, 이 지역이 네덜란드 통치와 보조를 맞추도록 이끌 독특한 기회가 생겼습니다. §Y[HOL.GetNameWithFlag]§!은(는) §Y[FLN.GetNameWithFlag]§!에 대한 영향력을 점진적으로 높이는 것을 목표로 하며, 이는 완전한 통합으로 이어질 수 있습니다.\n\n영향력이 높은 단계에 이를수록 §Y[FLN.GetNameWithFlag]§!은(는) §Y[BEL.GetNameWithFlag]§!으로부터 더욱 독립적이 될 수 있으며, 네덜란드와의 통합 가능성도 커집니다. 그러나 §Y[BEL.GetNameWithFlag]§!은(는) 이 영향력에 저항하여 네덜란드의 노력에 맞서고 §Y[FLN.GetNameWithFlag]§!과(와) 현 정부의 유대를 강화할 힘을 가지고 있습니다."
 HOL_high_influence_belgium: "§Y[BEL.GetNameWithFlag]§!에서의 높은 §Y[HOL.GetAdjective]§! 존재감"
 HOL_high_influence_belgium_desc: "§Y[FLN.GetNameWithFlag]§!에서의 우리 존재감이 눈에 띄는 수준에 이르러 §Y[HOL.GetNameWithFlag]§!과(와)의 통합에 대한 지지를 불러일으키고 있습니다."
 HOL_voc_category: "되살아난 VOC의 유산"
 HOL_voc_category_desc: "\n£hol_voc_category_picture \n\n\n\n네덜란드 동인도 회사, 곧 Vereenigde Oostindische Compagnie(VOC)는 한때 세계에서 가장 강력한 무역 제국이었습니다. 그 함대는 바다를 지배했고, 상인들은 세계 향신료 무역을 장악했으며, 행정관들은 대륙에 걸친 식민 제국을 일구었습니다. 이제 현대에 §Y[HOL.GetNameWithFlag]§!에게는 이 빛나는 유산을 되살릴 기회가 있습니다. 무역, 외교, 혁신에 관한 §Y[HOL.GetFlag][HOL.GetAdjective]§!의 전문성을 활용하면 VOC는 과거의 유물이 아니라 미래를 빚어내는 힘으로 다시 일어설 수 있습니다.\n\n §Y[IND.GetNameWithFlag]§!은(는) 우리의 특별 사업입니다. 왕령 식민지를 다시 되찾으려면 침공을 준비해야 합니다. 성공적인 침공을 위해서는 가능한 한 빨리 교두보를 확보해야 합니다. 우리는 그 준비를 시작할 수 있지만 §R발각 위험§!을 가능한 한 낮게 유지해야 합니다. 그렇지 않으면 발각되어 상륙이 매우 어려워질 수 있습니다.\n\n 현재 상황:\n §G세력§!, §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_strength|+]\n §R발각 확률§!, §Y자바 섬§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|-] \n §G세력§!, §Y수마트라 섬§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_strength|+]\n §R발각 확률§!, §Y수마트라 섬§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|-] \n §G세력§!, §Y칼리만탄§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_strength|+]\n §R발각 확률§!, §Y칼리만탄§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|-]"
 HOL_voc_category_ind: "§Y[IND.GetNameWithFlag]§!에 닥친 §Y[HOL.GetFlag][HOL.GetAdjective]§! 위협"
 HOL_voc_category_ind_desc: "§Y[HOL.GetFlag][HOL.GetAdjective]§! 측이 식민 제국을 되찾기 위해 무슨 일이든 하겠다고 공표했습니다. 우리는 이 임박한 위험에 대비해야 하며, 결코 쉽게 패배하지 않을 것입니다! §Y[HOL.GetFlag][HOL.GetAdjective]§!에 대한 정보를 늘리고 §Y보안 기관§!에 투자하면 발각 확률을 높일 수 있습니다. \n\n §Y[HOL.GetFlag][HOL.GetAdjective]§! 준비에 대한 현재 발각 확률: \n\n§G발각 확률§!, §Y자바 섬§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|+]\n§G발각 확률§!, §Y수마트라 섬§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|+]\n§G발각 확률§!, §Y칼리만탄 섬§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|+]"
 HOL_wic_category: "WIC의 대담한 개척지"
 HOL_wic_category_desc: "\n£hol_wic_category_picture \n\n\n\n네덜란드 서인도 회사(WIC)는 야망과 대담함의 원동력이었으며, 미지의 바다로 항해하여 아메리카와 서아프리카에 네덜란드의 영향력을 구축했습니다. 수리남의 사탕수수 농장에서 카리브해의 무역 거점과 아프리카 골드코스트에 이르기까지, WIC는 상업과 분쟁, 그리고 재치로 식민 제국을 일구었습니다. 영광의 시절은 저물었지만 그 유산은 네덜란드의 불굴의 의지와 안목을 증명하며 남아 있습니다."
 HOL_core_german_state_schleswig_holstein: "슐레스비히홀슈타인 편입"
 HOL_core_german_state_schleswig_holstein_desc: "이 영토는 문화적으로나 전략적으로 중요합니다. 네덜란드 국가로의 완전한 편입은 게르만 세계에서의 우리의 영향력을 강화할 것입니다."
 HOL_core_german_state_niedersachsen: "니더작센 편입"
 HOL_core_german_state_niedersachsen_desc: "이 지역은 독일의 북부 척추를 이룹니다. 이곳을 편입하면 저지 독일어권 심장부에 대한 우리의 통제가 공고해질 것입니다."
 HOL_core_german_state_nordrhein_westfalen: "노르트라인베스트팔렌 편입"
 HOL_core_german_state_nordrhein_westfalen_desc: "유럽에서 가장 산업화된 지역 중 하나인 이곳의 편입은 우리의 경제적, 전략적 위상을 높일 것입니다."
 HOL_core_german_state_rheinland_pfalz: "라인란트팔츠 편입"
 HOL_core_german_state_rheinland_pfalz_desc: "이 지역을 우리의 통제 아래 두는 것은 라인강 유역에서의 우리의 역사적, 문화적 존재감을 증진합니다."
 HOL_core_german_state_hessen: "헤센 편입"
 HOL_core_german_state_hessen_desc: "헤센 지역은 독일 서부와 중부를 잇습니다. 이곳을 공고히 하는 것은 국가 통합에 기여합니다."
 HOL_core_german_state_baden_wurttemberg: "바덴뷔르템베르크 편입"
 HOL_core_german_state_baden_wurttemberg_desc: "부유하고 강력한 지역인 바덴뷔르템베르크를 편입하면 남부 독일 주도권에 대한 우리의 주장이 강화됩니다."
 HOL_core_german_state_bayern: "바이에른 편입"
 HOL_core_german_state_bayern_desc: "역사적으로 독자적이면서도 독일의 중심임이 분명한 바이에른의 편입은 우리의 영향력을 남부 영토로 확장합니다."
 HOL_core_german_state_sachsen: "작센 편입"
 HOL_core_german_state_sachsen_desc: "작센은 오랫동안 독일 문화와 산업의 중심지였습니다. 이곳을 편입하면 유산과 역량이 모두 향상됩니다."
 HOL_core_german_state_berlin: "베를린 편입"
 HOL_core_german_state_berlin_desc: "프로이센과 독일의 옛 수도인 베를린의 편입은 상징적이고 전략적인 필수 사항입니다."
 HOL_core_german_state_steiermark: "슈타이어마르크 편입"
 HOL_core_german_state_steiermark_desc: "역사적으로 오스트리아와 연결된 슈타이어마르크를 편입하면 알프스 게르만 세계에서 우리의 존재감이 강화됩니다."
 HOL_core_german_state_austria_proper: "본토 오스트리아 편입"
 HOL_core_german_state_austria_proper_desc: "합스부르크 유산의 중심에는 오스트리아 그 자체가 있습니다. 이곳의 편입은 게르만 세계에 대한 우리의 지도력을 확인해 줍니다."
 HOL_core_german_state_tirol: "티롤 편입"
 HOL_core_german_state_tirol_desc: "티롤의 산악 지대는 전략적으로 가치가 높고 문화적으로도 연결되어 있습니다. 이를 우리 품에 들이면 알프스 전선이 안전해집니다."
 HOL_core_german_state_mecklenburg: "메클렌부르크 편입"
 HOL_core_german_state_mecklenburg_desc: "발트해 접근로를 통제하는 데 필수적인 북부 해안 지역으로, 이곳의 편입은 네덜란드 해군의 작전 범위를 넓힙니다."
 HOL_core_german_state_thuringen: "튀링겐 편입"
 HOL_core_german_state_thuringen_desc: "중앙에 위치하고 문화가 풍부한 튀링겐을 편입하면 중부 독일에서 우리의 입지가 강화됩니다."
 HOL_core_german_state_franken: "프랑켄 편입"
 HOL_core_german_state_franken_desc: "이 분절된 문화 지역을 편입하면 게르만 유산이 하나의 깃발 아래 통합됩니다."
 HOL_core_german_state_koln_bonn: "쾰른-본 편입"
 HOL_core_german_state_koln_bonn_desc: "이 경제·문화의 중심지는 서부 독일 영향력의 초석이며 반드시 편입해야 합니다."
 HOL_core_german_state_saarland: "자를란트 편입"
 HOL_core_german_state_saarland_desc: "전략 자원을 보유한 국경 지역인 자를란트의 편입은 프랑스로 향하는 관문을 확보합니다."
 HOL_core_german_state_sachsen_anhalt: "작센안할트 편입"
 HOL_core_german_state_sachsen_anhalt_desc: "작센안할트를 편입하면 중부 독일과 그곳의 산업 기반에 대한 우리의 통제가 강화됩니다."
 HOL_core_german_state_brandenburg: "브란덴부르크 편입"
 HOL_core_german_state_brandenburg_desc: "프로이센 권력의 옛 중심지인 브란덴부르크의 편입은 게르만 지도력을 회복하는 데 필수적인 단계입니다."
 HOL_core_german_state_hamburg: "함부르크 편입"
 HOL_core_german_state_hamburg_desc: "세계적인 항구이자 경제 중심지인 함부르크의 편입은 북유럽에서 우리의 무역 우위를 굳건히 합니다."
