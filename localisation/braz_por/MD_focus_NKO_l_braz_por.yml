 NKO_demoralize_propaganda_desc: "."
 NKO_border_picture:0 "Imagens de Fronteira da Coreia do Sul"
 NKO_border_picture_desc: "."
 NKO_finance_rebels:0 "Financiar os Rebeldes"
 NKO_finance_rebels_desc: "."
