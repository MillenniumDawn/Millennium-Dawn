 module_vls_sam_7_desc: "Les systèmes de missiles surface-air VLS hyperavancés représentent le pinacle de la défense aérienne navale, combinant guidage intelligent, enveloppes d'engagement extrêmes et intégration transparente aux réseaux de capteurs de la flotte pour contrer les menaces aériennes les plus avancées.\n\n§GIndice du concepteur : ce module augmentera le blindage et les statistiques antiaériennes, ainsi que les PV, au prix d'un CI accru.§!\n§GIndice concepteur : ce module fournira des statistiques de blindage et de DCA accrues, ainsi que des PV supplémentaires, au prix d'un CI accru.§!"
