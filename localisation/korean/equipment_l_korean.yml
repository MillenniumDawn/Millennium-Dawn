 SIN_infantry_weapons_1_desc: "M16S1은 미국 M16A1 소총의 수출형 모델로, ST Kinetics사가 라이선스를 받아 현지에서 생산한 것입니다. 싱가포르군(SAF) 창설 초기에는 M16S1이 모든 병사의 표준 제식 무기였습니다. M16A1을 현지 실정에 맞게 일부 개량했음에도 불구하고, M16S1은 여전히 ​​몇 가지 초기 단점을 드러냈고, 이에 싱가포르 방위산업계는 더 나은 설계를 모색하게 되었습니다. M16S1은 현재까지도 예비 무기로 보관 및 사용되고 있습니다."
