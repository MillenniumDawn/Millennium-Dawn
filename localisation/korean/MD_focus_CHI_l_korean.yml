 CHI_bri_global_presence: "일대일로 세계적 존재감"
 CHI_bri_global_presence_desc: "파트너 국가들이 프로젝트를 완료하고 파트너 등급이 오름에 따라 쌓이는, 전 세계에 걸친 중국 일대일로 영향력의 누적 척도입니다. 일대일로 세계적 존재감 국가 정신을 연속적으로 조정하며 이후의 일대일로 중점을 해금하는 조건이 됩니다."
