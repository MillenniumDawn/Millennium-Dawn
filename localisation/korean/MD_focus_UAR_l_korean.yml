 UAR.1.t: "[FROM.GetNameDef]의 초청"
 UAR.1.d: "[FROM.GetNameDef]이(가) 우리를 자신들의 아랍 연합에 초청하였습니다. 명목상으로는 그들의 연합에 속하게 되지만, 우리는 여전히 상당히 독립적으로 국가를 운영할 수 있습니다."
 UAR.1.a: "물론이지"
 UAR.1.b: "아니요, 괜찮습니다"
 UAR.2.t: "[FROM.GetNameDef], [ROOT.GetNameDef]에 가입"
 UAR.2.d: "[FROM.GetNameDef]이(가) 우리 연합에 가입해 달라는 초청을 수락하였습니다."
 UAR.2.a: "더 나은 미래를 향해 함께"
 UAR.3.t: "우리에게 맞서는 [FROM.GetNameDef]"
 UAR.3.d: "[FROM.GetNameDef]이(가) 우리 연합에 가입하라는 초청을 거절하였습니다. 어떻게 대응해야 하겠습니까?"
 UAR.3.a: "다음 기회를 노리자"
 UAR.3.b: "그렇다면 가입시키겠다"
 UAR.4.t: "아랍인에 대한 패권을 주장하는 [FROM.GetNameDef]"
 UAR.4.d: "[FROM.GetNameDef]이(가) 자국 연합을 통합함으로써 모든 아랍인에 대한 패권을 주장하였습니다. 그들이 우리를 노리는 것은 시간문제입니다. 그들에 맞서려면 지금 나서야 합니다."
 UAR.4.a: "그들에 맞서 연합을 결성하자!"
 UAR.4.b: "끝났다"
 UAR.5.t: "아랍 해방 전선 초청"
 UAR.5.d: "[FROM.GetNameDef]이(가) 모든 아랍 국가의 주권을 위협하는 통일 아랍 국가에 맞선 국제 연합의 창설을 발표하였습니다. 그들은 연합에 대한 선제공격을 계획하고 있으며, 우리에게 동참해 달라고 요청하였습니다."
 UAR.5.a: "물론이지, 이것은 주권의 문제다"
 UAR.5.b: "연합은 위협이 아니다"
 UAR.6.t: "아랍 연합에 대한 군사 공격"
 UAR.6.d: "이제 준비가 되었습니다. 모든 아랍 국가를 위협하는 이 거대한 존재를 무너뜨릴 때입니다."
 UAR.6.a: "전쟁이다!"
 UAR.7.t: "우리의 통치에 도전하는 [FROM.GetNameDef]"
 UAR.7.d: "[FROM.GetNameDef]이(가) 모든 아랍 민족을 통일할 준비가 되었다고 선언하였습니다. 이는 우리에 대한 명백한 선전포고입니다. 그들이 우리 문을 두드리는 것은 시간문제입니다."
 UAR.7.a: "전쟁이다!"
 UAR_news.1.t: "[FROM.GetNameDef]의 선언"
 UAR_news.1.d: "오늘 중동의 지역 정치에 변화가 있었습니다. 한 지역 강국이 모든 아랍인을 통일하겠다는 목표를 발표하였습니다. [FROM.GetNameDef]의 대통령 [FROM.GetLeader]은(는) 어제 언론과의 인터뷰에서 아랍 민족이 단일 국가 아래 통합해야 할 때가 되었다고 밝혔습니다. 그의 말에 따르면, 이것이 아랍인들이 적대 세력의 꼭두각시로 남지 않고 세계 정치에서 마땅한 위치를 되찾을 수 있는 유일한 방법입니다. 많은 아랍 지도자들은 아랍 통일을 압박하는 것이 중동에 더 많은 분쟁만 일으킬 것이라며 이미 이러한 발언을 비난하였습니다."
 UAR_news.1.a: "이것이 지속될지는 시간이 말해 줄 것이다"
 UAR_news.2.t: "[FROM.GetNameDef], [FROM.FROM.GetNameDef]에 가입"
 UAR_news.2.d: "[FROM.GetNameDef] 정부가 통일 아랍 국가를 향해 함께 노력하기 위해 [FROM.FROM.GetNameDef]에 가입하겠다는 의사를 발표하였습니다. 명목상으로는 연합의 일원이지만 [FROM.GetNameDef]은(는) 외교 정책에서 여전히 큰 자치권을 가집니다. 그러나 국가 간 통합이 더 진전되면 이는 달라질 수 있습니다."
 UAR_news.2.a: "이것이 지속될지는 시간이 말해 줄 것이다"
 UAR_news.3.t: "[FROM.GetNameDef], [FROM.FROM.GetNameDef]을(를) 탈퇴"
 UAR_news.3.d: "[FROM.GetNameDef] 정부가 [FROM.FROM.GetNameDef]을(를) 탈퇴하겠다는 의사를 발표하였습니다. 연합의 정치적 방향에 불만을 느낀 [FROM.GetAdjective] 정부는 모든 협력을 즉시 중단하겠다고 밝혔습니다."
 UAR_news.3.a: "하, 또 하나의 실패한 프로젝트로군"
 UAR_news.4.t: "아랍 연합 붕괴"
 UAR_news.4.d: "최근 발표된 중동 아랍 연합 창설 프로젝트가 완전히 붕괴하였습니다. 주도국의 급진적인 정치 변화로 인해 모든 지역 동맹국이 프로젝트를 포기하기로 결정하였습니다. 아랍 통일의 꿈은 다시 한번 묻힌 듯합니다."
 UAR_news.4.a: "하, 또 하나의 실패한 프로젝트로군"
 UAR_news.5.t: "[FROM.GetNameDef]의 통일"
 UAR_news.5.d: "[FROM.GetNameDef]이(가) 자국의 주들을 하나의 통일 국가로 공식 통합한다고 발표하였습니다. 반대 정치 지도자들은 이것이 다른 모든 아랍 국가의 주권에 대한 위협이며, 통일이 폭력으로 번지는 것은 시간문제라고 이미 밝혔습니다."
 UAR_news.5.a: "예의주시해야 한다"
 UAR_news.6.t: "아랍 해방 전선 결성"
 UAR_news.6.d: "통일 아랍 국가의 팽창을 우려한 [FROM.GetNameDef]이(가) 주권에 대한 위협에 대응하기 위해 뜻을 같이하는 아랍 국가들로 이루어진 국제 연합을 결성하였습니다. [FROM.GetAdjective] 지도자 [FROM.GetLeader]은(는) 이 동맹이 독립을 지키기 위한 군사 개입을 할 준비가 되어 있다고 밝혔습니다."
 UAR_news.6.a: "상황이 나빠질 수도 있겠군"
 UAR_news.7.t: "아랍 통일 전쟁"
 UAR_news.7.d: "아랍 국가들에 대한 주도권 경쟁이 지역 전쟁으로 번졌습니다. 신바트주의자, 바트주의자, 아랍 주권주의자들이 서로의 목을 겨누고 있습니다. 중동의 미래와 정치 지형은 영원히 바뀌었습니다."
 UAR_news.7.a: "적어도 발칸에서 시작되지는 않았군"
