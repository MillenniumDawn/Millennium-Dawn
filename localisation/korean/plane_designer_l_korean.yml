 air_module_hypersonic_engine_1: "극초음속 엔진 I"
 air_module_hypersonic_engine_1_desc: "극초음속 엔진은 극단적인 추력과 고속 비행 성능을 제공하여, 고속에서도 향상된 기동성으로 신속한 요격 및 타격 운용을 가능하게 합니다.\n\n§G설계 힌트: 극초음속 엔진은 생산 비용이 매우 비싸지만 탁월한 속도와 높은 기동성을 제공합니다.§!"
 air_module_hypersonic_engine_2: "극초음속 엔진 II"
 air_module_hypersonic_engine_2_desc: "$air_module_hypersonic_engine_1_desc$"
 air_module_railgun_cannon_1: "레일건 기관포 I"
 air_module_railgun_cannon_1_desc: "레일건 기관포는 전자기 가속을 이용해 고속 탄을 발사하여 탁월한 공대공 살상력과 빠르게 움직이는 항공기에 대한 향상된 명중 가능성을 제공합니다. 특화된 사격 체계와 탄약 처리 방식은 공중 교전에 최적화되어 있어 다목적 임무에는 훨씬 덜 효과적이며 공대공 전투 외에서는 쓸모가 제한됩니다. \n\n§G설계 힌트: 레일건 기관포는 항공기 격추에 매우 강력한 공대공 성능을 제공하지만 비용이 많이 들고 매우 특화되어 있어, 제공권 확보 전용 역할 외에서는 가치가 제한적입니다§!"
 air_module_railgun_cannon_2: "레일건 기관포 II"
 air_module_railgun_cannon_2_desc: "$air_module_railgun_cannon_1_desc$"
