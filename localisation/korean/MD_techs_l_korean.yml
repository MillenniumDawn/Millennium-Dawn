 com_satellites: "통신 위성"
 com_satellites_desc: "통신 위성"
 COMSAT1: "통신위성 1965"
 COMSAT1_desc: "트랜스폰더를 통해 무선 통신 신호를 중계하고 증폭하는 인공위성입니다. 이를 통해 지구상의 각기 다른 위치에 있는 송신기와 수신기 사이에 통신 채널이 생성됩니다.\n\n통신위성 (통신위성 1965):\n§Y$COMSAT1$§! 위성은 §Y56kbits/s§!의 대역폭을 가진 통신위성입니다. §Y56kbits/s 통신위성 체계§!에 필요합니다."
 COMSAT2: "통신위성 1975"
 COMSAT2_desc: "트랜스폰더를 통해 무선 통신 신호를 중계하고 증폭하는 인공위성입니다. 이를 통해 지구상의 각기 다른 위치에 있는 송신기와 수신기 사이에 통신 채널이 생성됩니다.\n\n통신위성 (통신위성 1975):\n§Y$COMSAT2$§! 위성은 §Y128kbits/s§!의 대역폭을 가진 통신위성입니다. §Y128kbits/s 통신위성 체계§!에 필요합니다."
