 JAP_diplomacy.35.t: "Japan Demands Sakhalin"
 JAP_diplomacy.35.d: "Japan has issued a formal demand for the return of Sakhalin. Accepting would defuse tensions, but it would be seen as a humiliating concession."
 JAP_diplomacy.35.a: "Accept the demand"
 JAP_diplomacy.35.b: "Reject it outright"
 JAP_diplomacy.36.t: "Sakhalin Returned"
 JAP_diplomacy.36.d: "Moscow has accepted our demand. Sakhalin is now under Japanese administration. The government will present this as proof that the imperial order is returning."
 JAP_diplomacy.36.a: "A historic correction"

 JAP_diplomacy.37.t: "Russia Refuses"
 JAP_diplomacy.37.d: "Moscow has refused our demand for Sakhalin. We can swallow the insult for now, test Russia with a limited border conflict, or commit fully to war."
 JAP_diplomacy.37.a: "Stand down for now"
 JAP_diplomacy.37.b: "Launch a border war"
 JAP_diplomacy.37.c: "Declare total war"
