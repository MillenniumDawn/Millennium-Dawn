 PER_oil_shale_TT: "[JOR.GetFlag] §H요르단§!이 §H암만§!에서 £oil_texticon §H석유 12§!를 받습니다\n우리는 이 £oil_texticon 석유를 10년 동안 통제하며, 계약이 만료되면 요르단이 통제권을 얻습니다."
 PER_shia_clergy_bonus_TT: "정부 인기도가 60%를 넘을 때 시아파 성직자의 월간 관계: §G+1.00§!"
 PER_iran_behave_TT: "[USA.GetFlag] §H미국§!이 경제 제재를 §G해제§!할 가능성이 높습니다"
 PER_ministry_of_war_decisions: "국방부"
 PER_ministry_of_war_decisions_desc: "전쟁부와 군 병참 부서는 오랫동안 이웃 국가 및 세계 열강과의 잠재적 분쟁을 계획하고 대비하는 임무를 맡아 왔습니다. 전쟁 계획을 활성화함으로써 우리는 가장 오랜 기간 수집해 온 이 정보를 활용할 수 있습니다."
 PER_war_plan_atash: "전쟁 계획 사브즈"
 PER_war_plan_meshki: "전쟁 계획 자르드"
 PER_war_plan_kaveh: "전쟁 계획 바나프시"
 PER_war_plan_jamshid: "전쟁 계획 소르메이"
 PER_war_plan_arash: "전쟁 계획 닐구니"
 PER_war_plan_rostam: "전쟁 계획 보론즈"
 PER_war_plan_zahak: "전쟁 계획 탈라이"
 PER_war_plan_damavand: "전쟁 계획 메슈키"
 PER_war_plan_aryana: "전쟁 계획 라자바르드"
 PER_war_plan_sorkh: "전쟁 계획 소르크"
 PER_war_plan_abi: "전쟁 계획 아비"
 PER_mojahedin_resistance: "이란 인민 무자헤딘 기구"
 PER_mojahedin_resistance_desc: "\n£PER_desctext_MEK\n\n\n\nMEK로도 알려진 인민 무자헤딘 기구는 1960년대 창설 이래 [PER.GetFlag] 이란 정부들에게 눈엣가시였습니다. 이들의 권력 장악 시도는 끈질겨서, 80년대 [PER.GetFlag] [IRQ.GetFlag] 이란-이라크 전쟁 당시에는 적의 편에 서기까지 했습니다.\n\n정부 인기도나 정당성에 따라 MEK는 더 큰 문제를 일으킬 수 있습니다. 우리가 나라를 안정시키고 발전시킴에 따라 MEK를 제거할 수 있게 될 것입니다.\n\n자세한 정보는 아래 텍스트에 마우스를 올려 확인하십시오."
 PER_assassinate_the_rajavis: "라자비 부부 암살"
 PER_assassinate_the_rajavis_desc: "라자비 숭배 집단은 끝장내야 합니다. 정부 권력이 정점에 있는 지금, 우리는 MEK 고위 인사 한 명을 설득해 라자비 부부를 한꺼번에 제거할 수 있습니다."
 PER_surrender_the_government: "정부 항복"
 PER_surrender_the_government_desc: "MEK를 상대하는 것은 보상은 너무 적고 감당하기에 너무 벅찹니다. 이제 짐을 싸서 떠날 때입니다."
 PER_attack_camp_ashraf: "아슈라프 수용소 공격"
 PER_attack_camp_ashraf_desc: "아슈라프 수용소를 공격하면 MEK를 이 지역에서 몰아내고 세계의 다른 곳으로 쫓아낼 수 있을 것입니다. 그 바퀴벌레들은 우리의 군사력이 닿지 않는 곳에서도 살아남는 방법을 알고 있으니 말입니다."
 PER_attempt_to_retrieve_mek_defectors: "MEK 이탈자 송환 시도"
 PER_attempt_to_retrieve_mek_defectors_desc: "MEK는 일부 구성원의 이탈을 허용하지 않고 있으며, 우리의 도움이 가장 절실한 이들을 구출하는 것은 우리의 책임입니다."
 PER_hazara_uprising: "하자리스탄 봉기"
 PER_hazari_uprising: "혼란에 빠진 하자리스탄"
 PER_cento_decisions: "CENTO"
 PER_cento_decisions_desc: "[PER.GetFlag] §H이란§!이 재건한 §CCENTO§! 동맹은 중동과 그 너머의 지역 안정을 회복하는 것을 목표로 합니다. 냉전 시기에 처음 창설된 §CCENTO§!는 원래 바그다드 조약으로 알려져 있었습니다. 그러나 1979년 [PER.GetFlag] §H이란§!의 이슬람 혁명 이후 동맹은 실패하고 곧 해체되었습니다.\n시간이 지나면서 특정 행동을 부여하는 더 많은 결정이 사용 가능해질 것입니다."
 PER_demand_houthi_perform_offensive: "후티에게 공세 수행 요구"
 PER_invite_afghanistan: "[AFG.GetNameWithFlag] 초청"
 PER_invite_afghanistan_desc: "아프가니스탄을 초청하면 동맹이 중앙아시아에서 더 큰 발판을 얻을 수 있으며, 동부에서 오는 잠재적 위협에 훨씬 쉽게 대응할 수 있게 됩니다."
 PER_invite_tajikistan: "[TAJ.GetNameWithFlag] 초청"
 PER_invite_tajikistan_desc: "타지키스탄을 초청하면 중앙아시아의 중심부에 접근하여 이 지역에서 커지는 러시아의 영향력에 대응할 수 있을 것입니다."
 PER_invite_pakistan_desc: "파키스탄을 세력에 받아들이면, 1979년 CENTO 동맹이 해체될 때까지 세력에 있던 3개 회원국을 모두 공식적으로 복귀시키는 것이 됩니다."
 PER_invite_iraq2: "[IRQ.GetNameWithFlag] 초청"
 PER_invite_iraq2_desc: "숱한 어려움에도 불구하고 이라크는 여전히 꼭 필요한 동맹입니다. 이라크를 세력에 끌어들이면 레반트와 아라비아에서 CENTO의 영향력이 확대될 수 있습니다."
 PER_invite_lebanon2: "[LEB.GetNameWithFlag] 초청"
 PER_invite_lebanon2_desc: "레바논을 초청하면 동맹이 서쪽으로 더 확장되며, 이슬람 공화국의 옛 질서를 되살리려는 이들에게 우리가 이곳에 계속 머무를 것임을 보여줄 것입니다."
 PER_intervene_in_syria: "시리아 개입"
 PER_intervene_in_syria_desc: "모든 CENTO 회원국에 군사 개입으로 [FSA.GetNameWithFlag]을(를) 지원해 달라고 요청하겠습니다."
 PER_invite_jordan: "[JOR.GetNameWithFlag] 초청"
 PER_invite_jordan_desc: "요르단을 초청하면 [SAU.GetAdjective] 국가와의 관계와 상관없이 GCC의 영향력이 지금 이상으로 확대되는 것을 제한할 수 있습니다."
 PER_invite_egypt: "[EGY.GetNameWithFlag] 초청"
 PER_invite_egypt_desc: "이집트는 북아프리카에서 막강한 군사력을 구축했으며, 이들을 무시하는 것은 실수가 될 것입니다."
 PER_invite_morocco: "[MOR.GetNameWithFlag] 초청"
 PER_invite_morocco_desc: "모로코는 세계에서 매우 전략적이고 중요한 지점에 자리하고 있습니다. 지브롤터 해협의 주인을 끌어들이면 우리 동맹은 전 세계적으로 상당한 이점을 얻게 될 것입니다."
 PER_invite_yemen_desc: "예멘을 CENTO에 초청하면 동맹은 또 하나의 전략적 길목인 홍해를 통제하게 됩니다."
 PER_endorse_a_candidate: "후보 지지"
 PER_endorse_a_candidate_desc: "아야톨라는 자신이 선호하는 후보가 대통령 후보 지명을 얻도록 공개적으로 후보를 지지할 수 있습니다."
 PER_cSad_on_peoples_situation: "국민 상황 확인"
 PER_cSad_on_peoples_situation_desc: "이 결정은 180일 후에 다시 사용할 수 있습니다."
 PER_invite_hamas: "§Y[PAL.Neutral_Muslim_Brotherhood_L]§!와(과) 제휴"
 PER_kick_hamas: "§Y[PAL.Neutral_Muslim_Brotherhood_L]§!와(과) 관계 단절"
 PER_invite_PFLP: "§Y[PAL.communist_state_L]§!와(과) 제휴"
 PER_kick_PFLP: "§Y[PAL.communist_state_L]§!와(과) 관계 단절"
 PER_invite_PRC: "§Y[PAL.Mod_Vilayat_e_Faqih_L]§!와(과) 제휴"
 PER_kick_PRC: "§Y[PAL.Mod_Vilayat_e_Faqih_L]§!와(과) 관계 단절"
 PER_invite_PIJ: "§Y[PAL.Vilayat_e_Faqih_L]§!와(과) 제휴"
 PER_kick_PIJ: "§Y[PAL.Vilayat_e_Faqih_L]§!와(과) 관계 단절"
 PER_overthrow_saudi: "[SAU.GetFlag] [SAU.GetName] 타도"
 PER_overthrow_saudi_desc: "기만적인 [SAU.GetAdjective] 국가에 자유를 가져올 때가 왔습니다. 시아파의 깃발이 다른 어떤 깃발 대신 메카에 높이 휘날릴 것입니다."
 PER_overthrow_uae: "[UAE.GetFlag] [UAE.GetName] 타도"
 PER_overthrow_uae_desc: ""
 PER_overthrow_oman: "[OMA.GetFlag] [OMA.GetName] 타도"
 PER_overthrow_oman_desc: ""
 PER_bonyad_resources: "국부"
 PER_bonyad_resources_desc: "우리나라는 막대한 부를 보유하고 있으며, 그 부는 상위 기관이 관리해야 합니다. 우리는 재정적 이익을 대가로 일부 주의 특정 자원에 대한 통제권을 보냐드에 줄 수 있습니다."
 PER_liquify_khorasan: "호라산 강철"
 PER_liquify_khorasan_desc: "호라산에는 강철이 풍부하며, 그렇다면 자선 단체에 자선을 베풀어도 잘못될 일은 없을 것입니다."
 PER_liquify_khuzestan: "쿠제스탄 석유"
 PER_liquify_khuzestan_desc: "쿠제스탄에는 석유가 충분하고도 남습니다. 보냐드에 석유 일부에 대한 통제권을 주어도 해가 되지 않을 것입니다."
 PER_liquify_hormuz: "호르무즈 석유"
 PER_liquify_hormuz_desc: "페르시아만 연안, 특히 호르무즈에는 석유가 풍부하며 이를 보냐드에 팔아넘길 수 있습니다."
 PER_liquify_yazd: "야즈드 석유"
 PER_liquify_yazd_desc: "야즈드 석유의 생산은 아직 본격화되지 않았지만, 다른 이에게 그 일을 맡기기에 너무 늦은 때란 없습니다."
 PER_tehran_shiraz_metal: "테헤란과 시라즈의 금속"
 PER_tehran_shiraz_metal_desc: "테헤란과 시라즈에는 금속과 광물이 풍부하게 매장되어 있으며, 세금 혜택을 받는 대가로 일부 보냐드에 넘길 수 있습니다."
 PER_lor_resistance: "로레스탄 저항 부대"
 PER_mobilize_the_tribes: "부족 동원"
 PER_mobilize_the_tribes_desc: "로레스탄의 부족들을 동원해야 할 때가 왔습니다. 적이 로레스탄의 신성한 땅에 들어왔으며, 그 대가를 반드시 치르게 될 것입니다."
 PER_the_Iranian_lobby: "이란 로비"
 PER_the_Iranian_lobby_desc: "마즐리스는 [ISR.GetFlag] 이스라엘과 [USA.GetFlag] 미국에 [PER.GetFlag] 이란 정치 로비를 구축하는 것을 지지한다고 의결했습니다."
 PER_yazd_to_bushehr_railway: "야즈드-부셰르 철도"
 PER_yazd_to_bushehr_railway_desc: "해안 도시 부셰르는 철도를 통해 국가 중심부와 연결되는 것이 절실히 필요합니다."
 PER_qom_to_ilam_railway: "곰-일람 철도"
 PER_qom_to_ilam_railway_desc: "쿠르데스탄 지역은 적절한 수송 및 보급 기반시설이 부족합니다. 이 결함을 바꿀 때가 왔습니다."
 PER_kerman_to_chabahar: "케르만-차바하르 철도"
 PER_kerman_to_chabahar_desc: "발루치스탄 지역은 충분히 소외되어 왔습니다. 적절한 철도 기반시설을 도입함으로써 긴장을 가라앉히고 주민들을 달랠 수 있습니다."
 PER_political_backup: "정치적 대비책"
 PER_political_backup_desc: "정치적 실패의 시기에는 언제든 이 계획에 의지하여 지지를 되살릴 수 있습니다."
 PER_economic_backup: "경제적 대비책"
 PER_economic_backup_desc: "경제적 어려움의 시기에는 언제든 이 계획에 의지하여 위기를 모면할 수 있습니다."
 PER_kurdish_troops: "쿠르드 지지자 동원"
 PER_kurdish_troops_desc: "정부 내 쿠르드 지지자들을 동원하여 군대를 강화하고 어떤 수단을 써서라도 국가를 보호할 준비를 할 수 있습니다."
 PER_kurdish_promise_economy: "쿠르드의 약속"
 PER_kurdish_promise_economy_desc: "우리는 쿠르드인에게 해당 지역의 경제 성장을 지원하겠다고 약속하였으며, 그 대가로 그들은 서비스 부문 발전에 집중할 것입니다."
 PER_kurdish_promise_army: "쿠르드의 약속"
 PER_kurdish_promise_army_desc: "우리는 쿠르드인에게 무기 산업의 일자리를 지원하겠다고 약속하였으며, 그 대가로 그들은 군 복무를 제공할 것입니다."
 PER_reza_pahlavi: "레자 팔레비 초청"
 PER_reza_pahlavi_desc: "레자 팔레비 왕세자와 그의 지지자들은 새로운 입헌 정부의 공식 초청을 기다리고 있습니다. 민주주의를 위해 그들을 무시할 수도 있으나, 그 과정에서 우리 당의 존재 목적을 무효화하게 될 것입니다."
 PER_utilize_party_support: "당 지지자 동원"
 PER_utilize_party_support_desc: "범이란주의 정당의 애국적이고 용감한 지지자들을 소집함으로써 그 어느 때보다 맹렬하게 적에 맞서 싸울 수 있게 될 것입니다."
 PER_socialist_union_with_iraq: "이라크를 사회주의 연방에 초청"
 PER_socialist_union_with_iraq_desc: "이라크 정부를 우리와 함께하는 사회주의 연방에 초청할 수 있습니다. 이 조치는 이라크 공산주의자들에게 틀림없이 환영받을 것입니다."
 PER_integrate_basrah_maysan: "바스라와 마이산 통합"
 PER_integrate_basrah_maysan_desc: "이라크 남부의 바스라 주와 마이산 주는 종교적으로나 문화적으로 이란에 속합니다. 이토록 중요한 지역을 외면할 이유가 거의 없습니다."
 PER_integrate_azerbaijan: "아제르바이잔 통합"
 PER_integrate_azerbaijan_desc: "두 아제르바이잔을 하나로 재통일할 때가 왔습니다. 러시아는 카자르 왕조의 군사적 무능으로 인해 우리에게서 북부 아제르바이잔을 빼앗았습니다. 소련 해체 이후 2000년이 넘도록 이란의 일부였던 지역이 처음으로 독립 국가가 되었으니, 이는 우리의 몰락을 일깨우는 상징입니다."
 PER_integrate_armenia: "아르메니아 통합"
 PER_integrate_armenia_desc: "아르메니아는 오랫동안 우리나라와 서쪽 및 북쪽 국가들 사이의 완충국이었습니다. 1600년대에는 아르메니아인을 이란 본토에 통합하려는 시도가 여러 차례 있었고 어느 정도 성공을 거두었습니다. 아르메니아는 북쪽의 러시아에게 빼앗겼다가 20세기에 독립 국가로 풀려났습니다."
 PER_integrate_turkmenistan: "투르크메니스탄 통합"
 PER_integrate_turkmenistan_desc: "투르크멘 국가는 불안한 기반 위에 세워졌습니다. 투르크멘차이 조약 이래로 투르크멘인은 이란계 동족과 분리되어 왔습니다."
 PER_rebellion_in_kordestan: "[IKR.GetFlag] 쿠르데스탄의 반란"
 PER_rebellion_in_kordestan_desc: "외부 세력이 정부에 맞서 싸울 무기를 공급하면서 국가 서부가 불타오르고 있습니다!"
 PER_rebellion_in_arabistan: "[ARA.GetFlag] 쿠제스탄의 반란"
 PER_rebellion_in_arabistan_desc: "석유가 풍부한 쿠제스탄 오스탄이 중앙 정부에 맞서 반란을 일으키고 있습니다!"
 PER_rebellion_in_balochistan: "[BLC.GetFlag] 발루치스탄의 반란"
 PER_rebellion_in_balochistan_desc: "발루치스탄 주민들이 정부에 맞서 싸우기 위해 여러 민병대를 조직하였습니다!"
 PER_rebellion_in_azerbaijan: "[SAZ.GetFlag] 남아제르바이잔의 반란"
 PER_rebellion_in_azerbaijan_desc: "이란령 아제르바이잔 주민들이 외국 정부로부터 무장과 자금을 지원받아 우리 국가에 맞서 싸우고 있습니다!"
 PER_establish_hardliner_control: "강경파 완전 장악 확립"
 PER_establish_hardliner_control_desc: "국가 정치에 대한 통제를 공고히 할 때가 왔습니다. 더 이상 그와 그들 사이의 게임을 하지 않을 것이며, 진정한 권력은 언제나 아야톨라에게 있었습니다. 하찮은 기관인 마즐리스를 없애면 정부의 번거로운 절차를 크게 줄일 수 있습니다. 대통령직 또한 아야톨라의 뜻을 받드는 것 외에는 아무것도 하지 않는 허수아비에 불과하였습니다."
 PER_lift_the_fatwa: "파트와 철회"
 PER_lift_the_fatwa_desc: "우리 지도자가 핵무기에 대한 파트와를 철회할 때가 왔습니다. 서방이 우리에게 이 억지력을 추구하는 것 외에는 선택지를 남기지 않았습니다."
 PER_the_national_flag: "국기"
 PER_the_national_flag_desc: "우리는 국기를 원하는 어떤 것으로든 바꿀 수 있습니다."
 PER_throttle_internet_speeds: "인터넷 속도 제한"
 PER_throttle_internet_speeds_desc: "인터넷 속도를 제한하면 정보의 확산과 추가 시위의 조직화를 억누를 수 있습니다."
 PER_nationwide_security_presence: "전국 보안군 배치"
 PER_nationwide_security_presence_desc: "전국에 보안군을 배치하면 시위대가 거리로 나서는 것을 위협해 막을 수 있습니다."
 PER_fund_pro_government_protests: "친정부 시위 지원"
 PER_fund_pro_government_protests_desc: "친정부 시위를 지원하고 장려하면 거리에 나선 이들에게 그들의 의견이 틀렸다는 것을 보여줄 수 있습니다."
 PER_deploy_security_khoy_1: "호이에 보안군 배치"
 PER_deploy_security_west_azarbaijan_1: "서아제르바이잔에 보안군 배치"
 PER_deploy_security_kordestan_1: "쿠르데스탄에 보안군 배치"
 PER_deploy_security_khuzestan_1: "쿠제스탄에 보안군 배치"
 PER_deploy_security_azarbaijan_1: "아제르바이잔에 보안군 배치"
 PER_deploy_security_qom_1: "곰에 보안군 배치"
 PER_deploy_security_lorestan_1: "로레스탄에 보안군 배치"
 PER_deploy_security_fars_1: "파르스에 보안군 배치"
 PER_deploy_security_gilan_1: "길란에 보안군 배치"
 PER_deploy_security_esfahan_1: "이스파한에 보안군 배치"
 PER_deploy_security_kavir_1: "카비르에 보안군 배치"
 PER_deploy_security_hormuz_1: "호르무즈에 보안군 배치"
 PER_deploy_security_mazandaran_1: "마잔다란에 보안군 배치"
 PER_deploy_security_khorasan_1: "호라산에 보안군 배치"
 PER_deploy_security_balochistan_1: "발루치스탄에 보안군 배치"
 PER_deploy_security_hamadan_1: "하마단에 보안군 배치"
 PER_deploy_security_markazi_1: "마르카지에 보안군 배치"
 PER_deploy_security_tehran_1: "테헤란에 보안군 배치"
 PER_deploy_security_semnan_1: "셈난에 보안군 배치"
 PER_deploy_security_yazd_1: "야즈드에 보안군 배치"
 PER_deploy_security_golestan_1: "골레스탄에 보안군 배치"
 PER_deploy_security_kermanshah_1: "케르만샤에 보안군 배치"
 PER_deploy_security_ilam_1: "일람에 보안군 배치"
 PER_deploy_security_bushehr_1: "부셰르에 보안군 배치"
 PER_deploy_security_kerman_1: "케르만에 보안군 배치"
 PER_deploy_security_north_khorasan_1: "북호라산에 보안군 배치"
 PER_deploy_security_south_khorasan_1: "남호라산에 보안군 배치"
 PER_deploy_security_razavi_khorasan_1: "라자비호라산에 보안군 배치"
 PER_basij_fervor: "바시즈의 열정"
 PER_basij_fervor_desc: "바시즈는 이슬람 혁명수비대(IRGC)의 자원 준군사 조직입니다. 대개 정권에 가장 충성스러운 인원으로 구성되며, 이슬람 공화국 역사 내내 국가 건설, 인도적 지원, 전쟁 수행, 시위와 같은 내부 혼란 진압 등 다양한 목적을 위해 동원되어 왔습니다.\n매월 바시즈의 열정이 §H5%§! 증가하며, 우리는 결정에서 제공되는 어떤 목적으로든 바시즈를 §H동원§!할 수 있습니다. 활성화되어 있는 동안 바시즈의 열정은 0%가 될 때까지 §H매월 -10%§! 감소하며, 이후에는 1년 동안 §H동원 해제§!됩니다."
 PER_mobilize_basij_construction: "국가 건설을 위한 바시즈 동원"
 PER_mobilize_basij_construction_desc: "국가 건설 노력에 도움을 받고 일반 이란인을 위한 새로운 시설 건설을 지원받기 위해 바시즈를 소집해야 합니다."
 PER_mobilize_basij_education: "교육 발전을 위한 바시즈 동원"
 PER_mobilize_basij_education_desc: "이란 교육 체계의 많은 학생이 초등학교 바시즈 생도대에 자원하였습니다. 바시즈의 이 하위 조직을 통해 학생들을 소집하여 전국의 교육 지원에 참여시킬 수 있습니다."
 PER_mobilize_basij_war: "전쟁을 위한 바시즈 동원"
 PER_mobilize_basij_war_desc: "이슬람과 우리 국가의 적에 맞서기 위해 바시즈를 동원할 때가 왔습니다."
 PER_basij_vote_suggestion: "바시즈의 표심 유도"
 PER_basij_vote_suggestion_desc: "다가오는 대통령 선거에서 바시즈가 가진 수적 우위를 활용해 어느 한쪽에 투표하도록 하여 우리가 선호하는 후보에게 유리한 고지를 줄 수 있습니다."
 PER_basij_protest_utilization: "폭동에 맞서 바시즈 배치"
 PER_basij_protest_utilization_desc: "정부에 맞선 지속적인 폭동과 시위가 긴장된 분위기를 조성하여, 이를 진압하고 정부를 돕기 위해 바시즈를 소집해야 할 수도 있습니다."
 PER_basij_parade: "바시즈 집회 소집"
 PER_basij_parade_desc: "바시즈 집회와 퍼레이드를 소집함으로써 정부에 대한 지지가 굳건함을 국민에게 보여줄 수 있으며, 어쩌면 사기와 정부에 대한 인식을 높일 수 있습니다."
 PER_seda_o_sima_campaign: "세다 바 시마 캠페인"
 PER_seda_o_sima_campaign_desc: "국영 방송 체계인 세다 바 시마를 활용하여 우리가 적절하다고 판단하는 메시지를 전파할 수 있습니다."
 PER_hold_army_parade: "군 열병식 개최"
 PER_hold_army_parade_desc: "지친 병사들의 사기를 높이고 국민에게 애국심을 불어넣기 위해 군 열병식을 개최할 수 있습니다."
 PER_promote_religious_services: "종교 활동 장려"
 PER_promote_religious_services_desc: "국민과 이슬람 및 그 제도 사이의 유대를 더욱 긴밀히 하기 위해 국내 종교 활동을 장려할 수 있습니다."
 PER_boost_imam_khomeini_relief_foundation: "이맘 호메이니 구호 재단 확대"
 PER_boost_imam_khomeini_relief_foundation_desc: "빈곤층의 처지를 개선하기 위해 전국에 걸친 이맘 호메이니 구호 재단의 활동을 확대할 수 있습니다."
 IRQ_economic_union_member: "경제 연합 회원국"
 PER_unit_leader_trait_artesh: "소속: 아르테시"
 PER_unit_leader_trait_artesh_desc: "이 지휘관은 이란의 재래식 군대인 아르테시의 일원입니다. 2,500년 이상 전 아케메네스 시대에 처음 창설된 여러 이란 군대의 계승자인 아르테시는 1921년 레자 샤 팔레비에 의해 현대적인 형태로 창설되었습니다. 아르테시는 정치적 성향이 거의 없거나 전혀 없으며, 군대 대부분은 일반 국민 가운데서 징집된 병사들로 구성됩니다. 불충에 대한 우려로 수년간 아르테시를 약화하려는 시도가 여러 차례 있었고, 그 결과 이란 군대의 주도권을 누가 쥘 것인가를 두고 IRGC와 대립하게 되었습니다."
 PER_unit_leader_trait_irgc: "소속: IRGC"
 PER_unit_leader_trait_irgc_desc: "이 지휘관은 이란의 비재래식 군대인 이슬람 혁명수비대(IRGC)의 일원입니다. 1979년 이슬람 혁명 직후 아야톨라 루홀라 호메이니가 창설한 IRGC는 재래식 군대인 아르테시에 의한 쿠데타로부터 이슬람 공화국을 보호하는 임무를 맡았습니다. 수년에 걸쳐 IRGC는 진압 경찰부터 민병대, 특수 부대에 이르기까지 모든 것을 아우르는 조직으로 성장하였습니다. IRGC 부대는 종종 최신 기술과 장비를 지급받고 이슬람 공화국으로부터 더 나은 대우를 받아 왔으며, 이로 인해 아르테시와 대립하고 있습니다."
 PER_socialism2: "£PER_anarchist_communism (MEK) 이란 인민 무자헤딘 기구 - §C서방 파벌§!이 집권 중"
 PER_khamenei_desc: "하메네이는 1939년 마슈하드에서 아제리계 가문에서 태어났습니다. 훗날 아야톨라가 되는 그는 신학에 전념하기로 하고 호메이니와 같은 영향력 있는 성직자들 밑에서 공부하였습니다. 1960~70년대에 하메네이는 샤에 맞서 활동하다가 사바크와 마찰을 빚어 체포되었습니다. 이슬람 혁명 이후 그는 이라크 침공에 맞선 전쟁 수행을 돕기로 하고 국가를 방어하기 위한 국민 동원에 참여하였습니다. 하메네이는 새 정부의 형성에 적극적이었고 마침내 이슬람 공화국의 제3대 대통령으로 선출되었습니다. 몬타제리가 후계에서 제외된 뒤, 하메네이는 아야톨라 호메이니의 후계자로 선택되었습니다. 여전히 극도로 보수적이지만, 하메네이가 1979년 혁명 이후 음악 등에 가해졌던 많은 제약을 해제하였기에 호메이니에 비하면 개혁주의자로 보는 이들도 있습니다. 그는 또한 정치를 주무르는 것으로도 알려져 있는데, 한 진영이 지나치게 강해지면 다른 진영을 강화하려 합니다."
 PER_mashaei_desc: "마잔다란에서 태어난 마샤이는 이란 혁명 이후 1979년 쿠르드 반란을 진압하는 데 한 역할을 하였습니다. 이 분쟁에서 정보 장교로 복무한 마샤이는 아마디네자드와 같은 인물들과 만나 친구가 되었고, 이는 훗날 그의 정치 경력을 주목받게 하는 발판이 되었습니다. 다른 이란 원칙주의자들에 비해 비교적 비정통적인 견해를 가진 마샤이는 성직자 집단이 지나치게 강해졌으며 종교적으로나 정치적으로나 이란 사회에서 약화되어야 한다고 믿습니다. 이슬람 민족주의와 이슬람 이전의 이란 민족주의를 혼합하고자 하는 마샤이와 그의 파벌은 성직자들로부터 '일탈 성향'을 지닌 자로 낙인찍혔습니다."
 PER_montazeri_desc: "이스파한 나자파바드에서 태어난 몬타제리는 시아파 이슬람의 최고 권위자 중 하나인 대마르자에게 교육받았습니다. 몬타제리는 또한 1979년 샤를 몰아낸 이슬람 혁명의 지도자 중 한 명이었습니다. 대아야톨라로서 몬타제리는 호메이니의 사후 후계자로 지명되었습니다. 그러나 상황은 다른 방향으로 전개되었고, 혁명은 몬타제리가 구상한 대로 흘러가지 않았습니다. 이란 정치의 모든 부문을 포괄하는 민주주의 대신, 엄선되고 검증된 인물들만이 있었습니다. 특정 집단은 선거 출마나 참여가 금지되었고 많은 정당이 금지되었습니다. 1988년 이란에서 여러 좌파가 대량 처형된 뒤 몬타제리는 정부에 반대 목소리를 냈고 호메이니의 행동을 비판하였으며, 그 결과 호메이니에 의해 후계에서 제외되었습니다. 그 이후 몬타제리는 정권에 맞서 적극적으로 활동하며 정권의 전복과 비이슬람적인 새 정권의 수립을 촉구하였습니다."
 PER_pahlavi_desc: "왕세자이자 공작 왕좌의 후계자로 테헤란에서 태어난 레자는 어린 시절 왕족의 삶을 경험하였습니다. 국가의 적을 사면하거나 더 자유주의적인 변화를 촉구하는 등의 조치를 취하며 아버지에 비해 온건한 편이었던 레자는 옥좌를 직접 이어받지 못했습니다. 그가 전투기 조종사가 되기 위해 미국에서 훈련을 받던 중, 1979년 이슬람 혁명이 아버지와 2,500년 역사의 이란 샤 왕정을 무너뜨렸습니다. 이란 제국이 붕괴하자 레자는 미국에 머물며 망명 생활을 할 수밖에 없었습니다. 이란 내 그의 지지자 다수는 유럽이나 아메리카 대륙 등 다른 서방 국가로 피신하였습니다. 그는 왕좌에 대한 희망을 완전히 버리지는 않았으며, 1980년대 중반까지 CIA로부터 이슬람 공화국에 대항하는 활동을 위한 자금을 지원받았습니다. 이는 이란-콘트라 사건 이후 모두 끝이 났습니다. 그렇다고 이슬람 공화국을 전복하려는 그의 결의가 끝난 것은 아니었으며, 레자는 대신 이슬람 공화국을 전복하기 위해 저항 운동을 통해 이란인을 단결시키는 데 집중하였습니다."
 PER_homayoon_desc: "1928년 9월 27일에 태어난 호마윤은 열네 살의 어린 나이에 정치 활동을 시작하였습니다. 여러 정당과 운동에 참여하며 그는 모하마드 모사데크의 초기 지지자였습니다. 그의 정치 참여는 모사데크에만 국한되지 않았으며, 전 친위대 대원 몬시자데가 이끄는 파시스트 정당 SUMKA에도 관여하였습니다. 호마윤은 여러 범이란주의 조직에도 관여했으며 그의 정치 성향은 결국 우경화되었습니다. 마침내 그는 정보관광부 장관이 되었고, 이를 통해 제국 정부로부터 충분한 신임을 얻어 1970년대 이란의 국가당인 라스타히즈당의 부서기장이 되었습니다. 혁명 이후 호마윤은 프랑스로 피신하여 이슬람 공화국에 대항하는 활동을 이어갔습니다. 호마윤은 이란에 자유주의적 질서를 세우고자 하였고, 이에 따라 레자 팔레비 2세 치하의 입헌 군주제를 복원하는 것을 목표로 한 이란 입헌당의 창당을 도왔습니다. 그렇다고 호마윤이 열렬한 군주주의자이거나 팔레비의 지지자였다는 뜻은 아니며, 호마윤이 팔레비를 비판한 사례도 있었습니다."
 PER_irgc_name: "(IRGC) 이슬람 혁명수비대"
 PER_irgc_description: "이슬람 혁명수비대(IRGC)의 주된 역할은 국가의 이슬람 공화국 체제를 수호하는 것입니다. 자체 정보 기관, 외인 부대, 민병대(바시즈 부대), 건설 부문을 보유하고 있으며 경제에서도 큰 지분을 차지합니다. 쿠드스군(특수 부대)은 해외에서 우호적인 민병대를 훈련하고 비밀 작전을 수행합니다."
 PER_artesh_name: "이란군"
 PER_vevak_name: "(VAJA) 이란 이슬람 공화국 정보부"
 PER_regular_name: "정보부"
 PER_jask_base_modifier: "자스크 기지 방어"
 PER_zagros_defenses: "자그로스 방어"
 PER_zagros_defenses_desc: "이란이 산을 가진 것이 아니라 산이 이란을 가지고 있습니다. 북서에서 남동으로 뻗은 자그로스 산맥은 모든 침략군에게 힘겨운 장애물임이 입증되었습니다. 자그로스 산맥을 통과하는 길은 길고 위험하므로, 침략군은 충분한 보급과 사기를 확보해야 합니다."
 PER_no_nuclear: "핵무기에 대한 파트와가 있음"
 PER_yazdi_name: "에브라힘 야즈디"
 PER_yazdi_bio: "1931년 9월 26일에 태어난 야즈디는 호메이니 휘하의 초기 혁명 인사 중 한 명으로 부상하였습니다. 모사데크 정부가 무너진 후 야즈디는 이란 민족 저항 운동에 자리를 잡으며 샤에 맞선 투쟁에 합류하였습니다. 1961년 그는 그룹의 몇몇 다른 구성원과 함께 (FMI) 이란 자유 운동을 창설하였습니다. 그는 훗날 새 혁명 정부에서 부총리와 외무부 장관을 지냈습니다."
 PER_yazdi_modifiers: "§Y전직 부총리:§!\n 외국 영향력: §G5%§!\n§Y개혁주의 창립 인사 중 한 명:§!\n  정치력 획득: §G5%§!\n§Y사회민주주의자:§!\n  복지 비용 배율: §G-10.00%§!"
 PER_kavakebian_name: "모스타파 카바케비안"
 PER_kavakebian_bio: "1963년 3월 18일에 태어난 카바케비안은 2000년에 창당된 민주당의 지도자입니다. 그는 현재 이맘 사디크 대학교에서 정치학 학사와 석사 학위를, 타르비아트 모다레스 대학교에서 정치학 박사 학위를 보유하고 있습니다. 그는 이탈리아, 폴란드, 시리아, 리비아 등 여러 나라에서 이슬람 공화당의 대표를 지냈습니다."
 PER_kavakebian_modifiers: "§Y국제 관계 전문가:§!\n 관계 개선 유지 비용: §G-25%§!\n§Y민주 개혁가:§!\n  일일 친서방 지지: §R+0.03§!\n§Y교육자:§!\n  교육 비용 배율: §G-10.00%§!"
 PER_karroubi_name: "메흐디 카루비"
 PER_karroubi_bio: "1937년 9월 26일에 태어난 카루비는 시아파 성직자이자 오랜 개혁주의 정치인입니다. 투사 성직자 협회의 창립 회원으로서 그는 정치 경력 동안 많은 정당과 조직을 이끌었습니다. 카루비는 헌법수호위원회와 이슬람 공화국의 다른 통치 기구들에 대한 비판으로 주목받았으며, 이로써 야권의 많은 이들로부터 지지를 얻었습니다. 그는 아야톨라 몬타제리 등의 인물들 밑에서 신학을 공부했고, 이로 인해 그의 정치 이념은 전반적으로 좀 더 좌경적인 방향으로 형성되었습니다."
 PER_karroubi_modifiers: "§Y성직자:§!\n 외국 영향력 방어 배율: §G15.00%§!\n§Y여러 정부 기구에 반대:§!\n  관료제 비용 배율: §G-10.00%§!\n§Y정치 베테랑:§!\n  정치력 획득: §G15.00%§!"
 PER_mashaei_name: "에스판디아르 라힘 마샤이"
 PER_mashaei_bio: "1960년 11월 16일에 태어난 마샤이는 1979년 쿠르드 반란 당시 정보 장교로서 VAJA에 합류하였습니다. 작전 수행 중 그는 마흐무드 아마디네자드를 만났고, 아마디네자드는 곧 그가 정치 경력을 주목받게 하는 길을 열어주었습니다. 마샤이는 성직자 체제를 거침없이 비판해 왔으며 많은 논란에 휘말렸습니다. 그럼에도 그는 아마디네자드의 옛 유권자들과 지지자들로부터 두터운 지지 기반을 유지하고 있습니다."
 PER_mashaei_modifiers: "§Y전직 정보 장교:§!\n 민간 정보: §G15.00%§!\n§Y민족주의자:§!\n  사단 공격력: §G10.00%§!\n§Y군부와의 유대:§!\n 군인 급여 배율: §G-10.00%§!"
 PER_bayadi_name: "하산 바야디"
 PER_bayadi_bio: "1956년에 태어난 하산 바야디는 레이 시에서 태어났습니다. 그는 현재 산업공학 석사 학위를 보유하고 있으며 테헤란 이슬람 평의회의 일원이었습니다. 그는 이란 이슬람 청년 아바드가란 협회의 서기장이었고 대학 강사로 일하였습니다. 모흐센 레자이 밑에서 전직 선거 고문이었으며, 그 결과 평의회 업무 및 도시 관리를 맡도록 임명되었습니다."
 PER_bayadi_modifiers: "§Y기술자:§!\n 민간 공장 건설 속도: §G15.00%§!\n§Y교육자:§!\n  연구 속도: §G10.00%§!\n§Y직업 정치인:§!\n 관료제 비용 배율: §G-10.00%§!"
 PER_haghshenas_name: "모하마드자바드 하그셰나스"
 PER_haghshenas_bio: "1953년 3월 18일에 태어난 학셰나스는 테헤란, 레이, 타즈리시의 시의회 의원이었습니다. 또한 국민신뢰당의 중앙 당원이자 언론인, 대학교수였으며 대외 관계 등 여러 분야에서도 활동했습니다. 하타미 정부 시절에는 내무부 장관 보좌관 겸 정치 총국장으로, 그리고 문화이슬람지도부의 법률·의회·지방 담당 차관으로 일했습니다."
 PER_haghshenas_modifiers: "§Y언론인:§!\n 일일 신흥국 변동: §G0.05%§!\n§Y조직 전문가:§!\n 월간 생산성 증가: §G0.10§!\n§Y법률 전문가:§!\n 경찰 비용 배율: §G-10.00%§!"
 PER_pezeshkian_name: "마수드 페제시키안"
 PER_pezeshkian_bio: "1954년 9월 29일 아제르바이잔계 가문에서 태어난 페제시키안은 피란샤르와 나가데 군의 지사로 일하였습니다. 그는 이란 의회(마즐리스) 의원으로 5차례 선출되었고, 모하마드 하타미 정부에서 2001년부터 2005년까지 보건부 장관을 지냈습니다. 이란-이라크 전쟁 동안 그와 그의 가족은 전선을 자주 방문하여 의료 활동을 돕곤 하였습니다. 1993년에는 자동차 사고로 아내와 막내아들을 잃었으며 그 후로 재혼하지 않았습니다. 그는 또한 페르시아어, 아랍어, 쿠르드어, 아제르바이잔어를 구사하는 다국어 사용자입니다."
