 JUB.Nat_Autocracy: "£generic_Nat_Autocracy_small (ASF)  - 索马里全国同盟军"
 JUB.Nat_Autocracy_desc: "（融合军政府） - 1999年，索马里局势日益恶化，索马里盟军应运而生。该组织在朱巴兰地区与当地军阀穆罕默德·赛义德·赫尔西·摩根作战。其主要支持者来自马雷汉氏族，并与其他由马雷汉氏族主导的组织，如索马里民族阵线，存在一些联系。"
 JUB.Nat_Autocracy_1: "£generic_Nat_Autocracy_small (JVA) - 朱巴谷联盟"
 JUB.Nat_Autocracy_desc_1: "（融合军政府） - 朱巴谷联盟起源于索马里盟军，其核心人物是巴雷·阿丹·希雷·希拉莱。该联盟整体上以马雷汉氏族为主导，但也支持建立索马里民族政府，并反对朱巴兰地区的地方军阀和伊斯兰势力。"
