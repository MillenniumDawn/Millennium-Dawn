 tooltip_remove_productivity_from_state: "§WLa productivité de cet État sera §Rdiminuée§! de §R$PRODUCTIVITY_AMOUNT$§! points.\n §!"
 UKR_develop_t64_strazh_desc: "§WThe BMPT 'Strazh' was an experimental Ukrainian tank-support vehicle developed on the chassis of the T-64 tank.\nThe project was developed jointly by the Zhytomyr Armoured Plant, Kyiv Armoured Plant and Artem State Holding Company and was presented in 2017.\nThe original T-64 turret was replaced by the Ukrainian 'Duplet' remotely operated combat module, giving the vehicle a completely different role from the original tank.\nThe project was intended to provide heavily protected fire support while making use of existing T-64 chassis and Ukrainian-developed combat equipment.\n'Strazh' remained an experimental project and was not adopted for large-scale production, §Gbut we can change that, right?§!§!"
 UKR_develop_t72amt_desc: "§WThe T-72AMT was a Ukrainian modernization of the T-72A developed by the Kyiv Armoured Plant for the Armed Forces of Ukraine.\nThe modernization introduced the V-84-1 engine, improved night-vision equipment, the 1K13 sight and the Ukrainian 'Nizh' reactive armor system.\nThe tank also received modern communications equipment and the SN-3003 'Basalt' navigation system, while elements of the running gear were upgraded using components developed for the T-80.\nThe 1K13 sight allowed the modernized tank to employ the 'Kombat' guided weapon system.\nThe T-72AMT was intended as a relatively economical way of bringing existing T-72 tanks closer to modern Ukrainian operational requirements.§!"
 UKR_modernize_zsu_23_4m_a1_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_rokach_for_tooltip\n\n\n\n\n\n\n\n\n§WThe ZSU-23-4M-A1 'Rokach' is a Ukrainian modernization of the Soviet ZSU-23-4 'Shilka' self-propelled anti-aircraft gun.\nThe modernization replaces the outdated fire-control and observation equipment with a modern digital system, improving the vehicle's ability to detect and track aerial targets.\nThe system retains the four 23 mm autocannons while receiving improved electronics and four Short-range anti-air missiles.\nThese changes significantly improve the combat effectiveness of the ZSU-23-4 against low-flying targets.§!"
 UKR_modernize_s125_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_2d1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe S-125-2D is a Ukrainian modernization of the Soviet S-125 surface-to-air missile system.\nThe modernization is intended to replace outdated electronic components and improve the system's resistance to electronic warfare and modern countermeasures.\nThe radar and guidance equipment are upgraded, while the system receives improved capabilities for detecting, tracking, and engaging aerial targets.\nThe modernization is intended to extend the operational life of the S-125 while improving its effectiveness on the modern battlefield.§!"
 UKR_modernize_s125m_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_s125_m1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe S-125M was a Ukrainian modernization program intended to extend the service life and capabilities of the Soviet S-125 'Pechora' air-defense system.\nThe program was carried out by Ukrainian defense companies including KB Luch and Radionix, with work focused on modernizing the missile and the system's guidance and fire-control equipment.\nThe modernization included upgraded 5V27D missiles and the FCR-125 radar system, replacing important elements of the original Soviet-era equipment.\nThe S-125M project provided Ukraine with a way to significantly extend the useful life of existing S-125 systems without developing an entirely new air-defense complex.§!"
 UKR_modernize_kvadrat_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_kvadrat_2l_for_tooltip\n\n\n\n\n\n\n\n\n§WThe 2K12M1-2L 'Kvadrat-2L' is a Ukrainian modernization of the Soviet 2K12M1 'Kub' surface-to-air missile system.\nThe modernization replaces a number of outdated electronic components with modern Ukrainian-made equipment.\nThe system receives improved radar and fire-control capabilities, increasing its ability to detect, track, and engage aerial targets.\nThe modernization is intended to extend the service life of the remaining 2K12M1 systems while improving their effectiveness against modern threats.§!"
 UKR_develop_t38_stylet_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_t38_for_tooltip\n\n\n\n\n\n\n\n\n§WThe T-38 'Stylet' is a Ukrainian short-range surface-to-air missile system developed by the Arsenal plant together with Belarusian partners.\nThe system uses the T382 missile and is designed to engage aircraft, helicopters, cruise missiles, and other low-flying aerial targets.\nThe complex is mounted on a tracked chassis, providing it with high mobility and the ability to operate alongside mechanized units.\nThe development of the T-38 provides Ukraine with a modern replacement for aging Soviet short-range Osa systems.§!"
 UKR_modernize_rk10_spaa_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_ryf_for_tooltip\n\n\n\n\n\n\n\n\n§WThe RK-10 is a Ukrainian anti-aircraft guided missile developed as an alternative to the aging missiles used by Soviet-era short-range air-defense systems.\nIntegrating the RK-10 with the Strela-10 system would allow its launchers to use a newer missile while retaining the existing vehicle and launcher infrastructure.\nThe new missile provides improved engagement capabilities and allows the system to remain operational without relying on increasingly obsolete Soviet ammunition.\nThis modernization would extend the service life of the Strela-10 fleet while increasing its combat effectiveness.§!"
 UKR_develop_kentavr_spaa_desc: "§WThe ZRAK 'Kentavr' was a Ukrainian concept for a new self-propelled anti-aircraft system developed as a further evolution of the earlier 'Pereach' project.\nThe project was redesigned around two paired 40 mm automatic cannons, replacing the earlier concept based on a 57 mm anti-aircraft gun, while retaining a missile component and dedicated fire-control equipment.\nThe 'Kentavr' concept was intended to combine radar-based target detection with an electro-optical fire-control system, allowing the vehicle to engage aerial targets using both gun and missile armament.\nThe system was planned around a tracked chassis derived from the prospective Ukrainian tank platform developed by the Kharkiv Morozov Design Bureau as part of the 'Molot'/'Bokser' development program.§!"
 UKR_modernize_planes_category: "Modernize Our Combat Aircraft"
 UKR_modernize_planes_category_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_main\n\n\n\n\n\n\n\n\nWe can spend time and money researching and testing the upgrades for Soviet era aircraft and helicopters, that are being used by our Air Force. And when some time has passed and we will gain some experience - we may even try to build unique domestic designs."
 UKR_modernize_su25_m1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe Su-25M1 is a Ukrainian modernization of the §RSoviet§! §YSu-25§! close air support aircraft.\nThe modernization introduces improved navigation, communications, and targeting equipment while retaining the aircraft's existing airframe and weapons capabilities.\nThe upgraded systems improve the accuracy of unguided weapons and allow the aircraft to operate more effectively in modern combat conditions.\nThe modernization also extends the operational life of §YUkraine§!'s §YSu-25§! fleet.\n------------------\nThis Decision is a §Rprerequisite§! for the §YSu-25M1K§! decision. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete it.§!"
 UKR_modernize_su27_1m_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su271m_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YSu-27-1M§! is a Ukrainian modernization of the §RSoviet§! §YSu-27§! fighter aircraft.\nThe program introduces improved navigation, communication, identification, and onboard electronic systems to increase the aircraft's combat effectiveness.\nThe upgraded avionics provide better situational awareness and improve the aircraft's ability to employ modern weapons.\nThe modernization allows the §YSu-27§! to remain in service while reducing the limitations imposed by its original §RSoviet§!-era equipment.\n------------------\nThis Decision is a §Rprerequisite§! for the §YAn-BFV§! decision. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete it.§!"
 UKR_modernize_mig29_mu2_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu2_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YMiG-29MU2§! is a Ukrainian modernization of the §RSoviet§! §YMiG-29§! fighter aircraft developed by §LLviv State Aircraft Repair Plant§!.\nThe modernization builds upon the earlier §YMU1§! program and introduces more extensive upgrades to the aircraft's avionics, navigation, and targeting systems.\nThe aircraft receives improved capabilities for employing modern guided and unguided weapons against both aerial and ground targets.\nThe §YMU2§! program is intended to transform the §YMiG-29§! into a more capable multirole combat aircraft.§!"
 UKR_modernize_mig29_mu1_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_mig29mu1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YMiG-29MU1§! is a Ukrainian modernization of the §RSoviet§! §YMiG-29§! fighter aircraft.\nThe program introduces improved onboard electronics and a modernized radar warning and navigation system.\nThe upgraded equipment improves the pilot's situational awareness and allows the aircraft to operate more effectively in modern combat conditions.\nThe §YMU1§! modernization also serves as an intermediate step toward more extensive upgrades of the §YMiG-29§!.\n------------------\nThis Decision is a §Rprerequisite§! for the §YMiG-29MU2§! decision. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete it.§!"
 UKR_develop_an_bfv_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_an_bfv_development_for_tooltip\n\n\n\n\n\n\n\n\n§WThe proposed §LAntonov Design Bureau§! multirole fighter aircraft was a conceptual project for the development of a §YUkrainian§!-designed combat aircraft.\nThe project was intended to use Ukraine's experience in aircraft design and production to create a modern fighter without relying entirely on foreign designs.\nThe aircraft would incorporate modern avionics, weapons, and aerodynamic solutions while being adapted to the capabilities of the §YUkrainian§! aviation industry.\nAlthough the project remained at the proposal stage, its development could provide the foundation for a future generation of Ukrainian combat aircraft.\n\n§GA particularly important military project:§! once it is completed, the §YVerkhovna Rada§! will be more willing to approve a higher military budget.§!"
 UKR_develop_bm21_k_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bm21k_for_tooltip\n\n\n\n\n\n\n\n\n§WThe BM-21K is a Ukrainian modernization of the Soviet BM-21 'Grad' multiple launch rocket system.\nThe system is mounted on a modern Ukrainian KrAZ truck chassis and receives improved navigation, communication, and fire-control equipment.\nThe modernization improves the system's mobility and allows crews to prepare and conduct fire missions more efficiently.\nThe BM-21K provides a relatively inexpensive way to modernize Ukraine's large fleet of Soviet-era Grad launchers.§!"
 UKR_develop_bastion03_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bastion03_for_tooltip\n\n\n\n\n\n\n\n\n§WThe 'Bastion-03' is a Ukrainian multiple launch rocket system developed as a modernization of the Soviet BM-27 'Uragan' by Shepetivska Repair Plant.\nThe system is based on a modern truck chassis.\nThe modernization improves mobility and reduces the time required to prepare the launcher for firing.\nThe Bastion-03 would allow Ukraine to continue using existing 220 mm rockets while replacing the aging Soviet-era chassis.§!"
 UKR_develop_Vilkha_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_vilkha_for_tooltip\n\n\n\n\n\n\n\n\n§WThe 'Vilkha' is a Ukrainian multiple launch rocket system developed from the Soviet BM-30 'Smerch' by the Luch Design Bureau.\nThe project replaces the original unguided rockets with new guided missiles equipped with a Ukrainian guidance system.\nThe system is designed to provide significantly improved accuracy while retaining the high destructive potential and range of a heavy MLRS.\nThe development of Vilkha represents a transition from Soviet-era unguided rocket artillery toward modern precision strike capabilities.§!"
 UKR_develop_bureviy_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_bureviy_for_tooltip\n\n\n\n\n\n\n\n\n§WThe 'Bureviy' is a Ukrainian multiple launch rocket system designed as a modern replacement for the aging BM-27 'Uragan' family.\nThe system is mounted on a modern Tatra T815-7T3R2T chassis and incorporates digital fire-control and navigation systems.\nBureviy is designed to use existing 220 mm Uragan rockets as well as newer Ukrainian-developed ammunition.\nThe combination of modern electronics, improved mobility, and compatibility with existing ammunition makes the system a practical modernization of Ukraine's rocket artillery.§!"
 UKR_modernize_mi24pu1_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_mi24pu1_for_tooltip\n\n\n\n\n\n\n\n\n§WThe Mi-24PU-1 is a Ukrainian modernization of the Mi-24P developed by the Konotop Aircraft Repair Plant 'Aviakon' together with Ukrainian defense-industry enterprises.\nThe helicopter received more powerful TV3-117VMA-SBM1V-02 engines from Motor Sich, modernized avionics and navigation equipment, and systems for operation with night-vision equipment.\nThe modernization also incorporated the Adros KT-01AV protection system, the FPM-01KV laser aiming system and an upgraded ASP-17VPM-V sight.\nThe program involved companies including Motor Sich, Adron, TsKB Arsenal and the Izium Instrument and Apparatus Factory, with later versions also using Ukrainian electro-optical equipment.\nThe Mi-24PU-1 therefore combined a major overhaul of the original helicopter with new Ukrainian engines, avionics, protection and targeting systems.§!"
 UKR_develop_nota_desc: "§WObject 477A1 Nota is an advanced Ukrainian experimental main battle tank featuring an unmanned turret, isolated crew compartment and a powerful 152 mm main gun.\n\n§GA particularly important military project:§! once it is completed, the §YVerkhovna Rada§! will be more willing to approve a higher military budget.§!"
 UKR_modernize_nota_desc: "§WObject 477A1 'Nota' is a Ukrainian development of the Soviet Object 477 'Molot' advanced main battle tank project.\nThe design incorporates a heavily protected crew compartment, an unmanned fighting compartment, and a powerful main armament.\nThe modernization would introduce updated electronics, protection systems, and other components while adapting the design to technologies available to the Ukrainian defense industry.\nAlthough the project never reached mass production, further development could provide the basis for an advanced Ukrainian main battle tank.§!"
 ukr_history.63.t: "L'arrestation de Ioulia Tymochenko"
 ukr_history.63.d: "L'ancienne vice-Première ministre chargée du carburant et de l'énergie a été emmenée à la prison de Loukianivska pour des accusations de contrebande de gaz et de faux documents datant de ses années aux Systèmes énergétiques unis. Elle a été limogée en janvier après s'être attaquée aux schémas de troc du secteur, et l'affaire a été ouverte en quelques semaines. Un tribunal jugera la détention illégale et la libérera au bout de quarante-deux jours ; d'ici là elle n'est plus une ministre en froid avec le président, mais le visage de l'opposition à lui."
 ukr_history.63.a: "So be it."
 UKR_reorganize_navy_finish_project_133: "Finish the construction of §G2 §YProject 133§! patrol ships§! for Coast Guards"
 UKR_reorganize_navy_finish_project_133_desc: "\n\n\n\n\n\n£UKR_desctext_project_133_for_tooltip\n\n\n\n\n\n\n\n\n§WWe can allocate some budget in order to finally finish the prolonged production of §G2§! of Soviet-designed 'Project 133' patrol ships for our Coast Guards.§!"
 UKR_reorganize_navy_finish_11451_construction_flag: " Completed event §YFinish construction of 2 'Project 11451' corvettes§!"
 ukraine_reorganize_navy_finish_project_133.1.name: "Finish construction of 2 'Project 133' patrol ships for Coast Guards"
 ukraine_reorganize_navy_finish_project_133.1.desc: "We have examined 2 hulls of 'Project 133' patrol ships for Coast Guards, BG53 'Polissia' and BG54 'Slobozhanshchyna', and now can select the best suited direction we will move forward in our decision on their fate.\n\nWe can either invest more money and finish extensive repair of both ships or scrap the worse condition ship, BG54 'Slobozhanshchyna', and use parts from it to rebuild BG53 'Polissia' faster."
 ukraine_reorganize_navy_finish_project_133.1.a: "Finish both ships"
 ukraine_reorganize_navy_finish_project_133.1.b: "Cannibalize 'Slobozhanshchyna' to finish 'Polissia'"
 ukr_economy_rate.1.t: "NBU Cuts the Discount Rate by 1%"
 ukr_economy_rate.1.d: "The National Bank of Ukraine has lowered its discount rate, citing slowing price growth and a stabilising hryvnia. Commercial banks are expected to follow with cheaper credit lines, and foreign funds that had written Ukraine off after 1998 are quietly returning to the market. Industry, starved of working capital for a decade, may finally be able to borrow at rates that do not consume the entire margin."
 ukr_economy_rate.1.a: "Somewhat cheaper money"
 ukr_economy_rate.2.t: "NBU Cuts the Discount Rate by 2%"
 ukr_economy_rate.2.d: "The National Bank of Ukraine has lowered its discount rate, citing slowing price growth and a stabilising hryvnia. Commercial banks are expected to follow with cheaper credit lines, and foreign funds that had written Ukraine off after 1998 are quietly returning to the market. Industry, starved of working capital for a decade, may finally be able to borrow at rates that do not consume the entire margin."
 ukr_economy_rate.2.a: "Still cheaper money"
 ukr_economy_rate.3.t: "NBU Cuts the Discount Rate by 3%"
 ukr_economy_rate.3.d: "The National Bank of Ukraine has lowered its discount rate, citing slowing price growth and a stabilising hryvnia. Commercial banks are expected to follow with cheaper credit lines, and foreign funds that had written Ukraine off after 1998 are quietly returning to the market. Industry, starved of working capital for a decade, may finally be able to borrow at rates that do not consume the entire margin."
 ukr_economy_rate.4.t: "NBU Cuts the Discount Rate by 4%"
 ukr_economy_rate.4.d: "The National Bank of Ukraine has lowered its discount rate, citing slowing price growth and a stabilising hryvnia. Commercial banks are expected to follow with cheaper credit lines, and foreign funds that had written Ukraine off after 1998 are quietly returning to the market. Industry, starved of working capital for a decade, may finally be able to borrow at rates that do not consume the entire margin."
 ukr_economy_rate.5.t: "NBU Cuts the Discount Rate to 29%"
 ukr_economy_rate.5.d: "Since February, the National Bank of Ukraine has cut its discount rate three times, from 45% to 29%, as price growth slows and the hryvnia holds steady. Commercial banks are following with cheaper credit lines, and foreign funds that had written Ukraine off after 1998 are quietly returning to the market."
 ukr_economy_rate.5.a: "Cheap money, at last"
 UKR_soviet_oob_tt: "All our units are organized based on Soviet-era companies, squads and detachments. We need less equipment overall, but our combat capabilities are lower as well."
 ukraine_reorganize_navy_choose_future_corvette.4.c: "8 ships (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.9.name: "Build the Project 58250 'Volodymyr Velykyi' Class corvettes"
 ukraine_reorganize_navy_choose_future_corvette.9.desc: "As a result of our independent tender process, we've selected the Project 58250 'Volodymyr Velykyi' Class corvettes as our newest fleet addition.\nLet's select the amount of ships we will agree to build."
 ukraine_reorganize_navy_choose_future_corvette.9.a: "10 ships (2x5)"
 ukraine_reorganize_navy_choose_future_corvette.9.b: "8 ships (2x4)"
 ukraine_reorganize_navy_choose_future_corvette.9.c: "4 ships (2x2)"
 modifies_cb_policy_rate_tt: "Our current §YPolicy Rate§! will be §Greduced§! by $RATE|Y$§Y%§!"
 UKR_DEMOCRATIC_FOCUS_PATH: "Ukraine is set on the democratic path"
 UKR_HISTORICAL_FOCUS_PATH: "Ukraine is set on the historical path"
 UKR_REGIONS_FOCUS_PATH: "Ukraine is set on the Party of Regions path"
 UKR_lahuna_progress_tt: "Lahuna construction progress increases"
 UKR_lahuna_program_over: "We have finished construction of Simferopol recon ship"
 UKR_modernize_t55_64: "Develop §YT-55-64§!"
 UKR_modernize_t55_64_desc: "§WT-55-64 is a Ukrainian hybrid modernization of the T-55 created by the Kharkiv Armored Repair Plant. The project combines the original T-55 turret with the chassis of the T-64, giving the vehicle improved mobility and a more modern suspension and running gear. The tank uses the 700 hp 5TDF diesel engine and received additional reactive armor on the turret. Developed and tested in the mid-2000s, the T-55-64 was intended as a relatively inexpensive way to extend the service life of aging T-55s.§!"
 UKR_develop_bmp64: "Develop §YBMP-64§!"
 UKR_develop_bmp64_flag: "Completed decision §YDevelop BMP-64§!"
 UKR_develop_bmp64_desc: "§WBMP-64, an experimental heavy infantry fighting vehicle developed by Kharkiv-based designers on the chassis of the T-64. The conversion removes the original tank turret and rearranges the hull to provide a protected troop compartment, while retaining much of the tank's heavy chassis and protection. The first prototype was fitted with a remotely operated combat module and rear access doors, establishing the basic concept of a heavy Ukrainian infantry fighting vehicle.§!"
 UKR_develop_bmp64d: "Develop §YBMP-64D§!"
 UKR_develop_bmp64d_desc: "§WBMP-64D, an evolution of the original BMP-64 concept. The vehicle receives an expanded combat module with additional anti-armour and air-defence capabilities, together with improved protection and equipment. The project represents an attempt to turn the T-64 chassis into a versatile heavy infantry platform capable of supporting troops while retaining the survivability of its tank-derived hull.§!"
 UKR_develop_bmpt64: "Develop §YBMPT-64§!"
 UKR_develop_bmpt64_desc: "§WBMPT-64, a further evolution of the Ukrainian T-64-based heavy infantry fighting vehicle. Its redesigned hull and unmanned turret improve the internal layout, while a rear ramp provides more convenient access to the troop compartment. The vehicle incorporates technologies developed for other Ukrainian T-64 modernization programs, including improved protection and combat equipment. The BMPT-64 became one of the most advanced concepts of the UMR-64 family.§!"
 UKR_develop_bmpk64: "Develop §YBMP-K-64§!"
 UKR_develop_bmpk64_desc: "§WBMP-K-64, an unusual wheeled derivative of the T-64-based infantry vehicle family. The original tracked chassis is extensively redesigned into an 8x8 platform, with the engine and transmission adapted to drive the wheels. The resulting vehicle is considerably lighter and faster than its tracked counterparts, while retaining substantial protection derived from the original tank chassis. The prototype demonstrated Ukraine's efforts to reuse ageing T-64 hulls as the basis for new armoured vehicles.§!"
 UKR_develop_t72ag: "Develop §YT-72AG§!"
 UKR_develop_t72ag_desc: "§WT-72AG, a Ukrainian export modernization of the T-72 incorporating technologies developed for the T-80UD and T-84. The modernization substantially upgrades the powerplant, fire-control equipment, protection and other systems while retaining the original T-72 hull and turret. The project represents one of the early Ukrainian attempts to combine Soviet-era tank platforms with domestic post-Soviet technology.§!"
 UKR_develop_t72_120: "Develop §YT-72-120§!"
 UKR_develop_t72_120_desc: "§WT-72-120, a Ukrainian export-oriented modernization intended to bring the T-72 platform closer to Western operating standards. The most distinctive feature is a redesigned turret rear incorporating an automatic loading system and a separated ammunition compartment. Together with modernized fire-control and support systems, the project demonstrates an ambitious attempt to adapt the Soviet T-72 design for international customers.§!"
 UKR_develop_t72ua1: "Develop §YT-72UA1§!"
 UKR_develop_t72ua1_desc: "§WT-72UA1, an economical Ukrainian modernization of the T-72 developed primarily for export customers. The program focuses on improving mobility, protection, observation and fire-control equipment while keeping the basic T-72 architecture. Its approach emphasizes the practical refurbishment and modernization of existing vehicles rather than developing an entirely new tank.§!"
 UKR_develop_t80_2019: "Develop §YT-80BV zr. 2019§!"
 UKR_develop_t80_2019_desc: "§WT-80BV zr. 2019, a modernization of the T-80BV carried out for Ukrainian airborne and naval infantry formations with the experience from T-64BV year 2017 modernization. The program introduces modern thermal imaging equipment, upgraded communications and navigation systems, as well as improved protection and other updated components. It combines the mobility of the T-80 with equipment derived from Ukraine's broader experience in modernizing its armoured fleet.§!"
 UKR_develop_skif: "Develop §YSkif§! APC"
 UKR_develop_skif_desc: "§WSkif, a new Ukrainian tracked armoured personnel carrier designed by UkrArmoTech on the basis of M113 APC. The vehicle is built around a front-mounted engine compartment and a rear troop compartment with a ramp, while its modular chassis is intended to support a wider family of vehicles. The prototype uses an aluminium armoured hull and incorporates modern Ukrainian communications, navigation and electronic systems. Factory testing began in 2026 as the company evaluated the platform's mobility and overall design.§!"
 UKR_develop_kevlar_e: "Develop §YKevlar-E§!"
 UKR_develop_kevlar_e_desc: "§WKevlar-E, a Ukrainian infantry fighting vehicle created by adapting the chassis of the 2S1 self-propelled gun. The redesign moves the powerplant to the front and creates a larger protected troop compartment at the rear. Spaced armour, additional internal protection and a remotely operated turret transform the artillery chassis into a modern infantry platform. The project demonstrates how ageing Soviet vehicles can be repurposed into new armoured platforms.§!"
 UKR_develop_bm21_k: "Develop §YBM-21K§! MLRS"
 UKR_develop_bastion03: "Develop §Y'Bastion-03'§! MLRS"
 UKR_develop_Vilkha: "Develop §Y'Vilkha'§! MLRS"
 UKR_develop_bureviy: "Develop a new gen MLRS §Y'Bureviy'§!"
 UKR_modernize_mi24pu1: "Develop a §YMi-24PU1§! Modernization"
 UKR_develop_t72mp: "Develop §YT-72MP§!"
 UKR_develop_t72mp_desc: "§WDeveloped by Kharkiv Morozov Machine-Building Design Bureau in cooperation with Czech and French companies, the T-72MP was an extensive modernization package unveiled in 1997. It combined an upgraded 6TD-1 powerpack, improved protection and a modern French SAGEM SAVAN 15MP fire-control system with thermal and panoramic sights. Designed primarily for the export market, the T-72MP demonstrated how Ukrainian technologies could be integrated with modern Western systems to extend the service life of the T-72 platform.§!"
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.name: "Simferopol - A Hull on the Rybalskyi Slipway"
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.desc: "The yard has laid down 347 of these since 1971 and it knows the drawings by heart. There is an unfinished 502EM on the ways right now - a fishing boat, but a fishing boat with the displacement, the range and the endurance we need.\n\nThe alternative is to lay a fresh keel to the same 502EM drawings rather than finish an abandoned one. The yard would be delighted. The Ministry of Finance would not."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.a: "Convert the trawler hull."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.b: "Lay a fresh keel to the same drawings."
 ukraine_reorganize_navy_build_simferopol_recon_ship.1.c: "The Navy has more urgent needs."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.name: "Simferopol - What She Listens With"
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.desc: "The hull is the cheap part. The ship is her antennas, and the question is whose antennas.\n\nOur own institutes can build the passive complex - radio-technical reconnaissance across several bands, classification, direction finding. It will take longer and it will be ours. A Western ELINT package would arrive integrated, tested and expensive, and it would come with strings."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.a: "Fit a domestic complex."
 ukraine_reorganize_navy_build_simferopol_recon_ship.2.b: "Buy a Western ELINT package."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.name: "Simferopol - Down the Dnipro"
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.desc: "She goes down the ways at Rybalskyi. Now the awkward part: the yard is in Kyiv, the fleet is in the Black Sea, and between them is six hundred kilometres of river with bridges over it.\n\nThe safe answer is a floating dock the whole way to Kherson and out. The cheap answer is to take her down on her own bottom and hope the draught and the air clearances work out."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.a: "Move her in a floating dock."
 ukraine_reorganize_navy_build_simferopol_recon_ship.3.b: "Take her down on her own hull."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.name: "Simferopol - Aground on the Dnipro"
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.desc: "She is stuck below Kherson with damage to her running gear and a very embarrassed delivery crew. The yard says it can be put right. The yard always says that."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.a: "Pay for the repairs."
 ukraine_reorganize_navy_build_simferopol_recon_ship.4.b: "Leave her at Kherson."
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.name: "Simferopol - Transfer Completed"
 ukraine_reorganize_navy_build_simferopol_recon_ship_program_over_flag: " The §YSimferopol§! reconnaissance ship program has ended"
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.desc: "We have finally moved our newest recon ship down the Dnipro river successfully - without any accidents! Now we can start crew training, and after that - we can finally use this precious naval asset to our benefit."
 ukraine_reorganize_navy_build_simferopol_recon_ship.5.a: "At last!"
 ukraine_develop_btr3.1.name: "BTR-3 - results of an UAE tender"
 ukraine_develop_btr3.1.desc: "We have presented the newly-developed BTR-3U 'Guardian' at local UAE expo today as a part of ongoing tender for 90 APCs for UAE's marine corps.\nThe presentation was good, although the temperature was extremely high.\nWe managed to highlight all key benefits of our machine today, and now we are waiting for the final results to be announced by their side now."
 ukraine_develop_btr3.1.a: "And we won!"
 ukraine_develop_btr3.1.b: "Not this time..."
 ukraine_develop_btr3.2.name: "First batch of BTR-3 delivered to UAE"
 ukraine_develop_btr3.2.desc: "The first batch of BTR-3 armored personnel carriers has been successfully delivered to the United Arab Emirates.\nThis marks an important milestone for Ukrainian defense exports and demonstrates that our newly-developed vehicle has found a place on the international market.\nThe Emirati Marine Corps can now begin putting the first vehicles through their own evaluation and training."
 ukraine_develop_btr3.2.a: "Great!"
 ukraine_develop_btr3.3.name: "Second batch of BTR-3 delivered to UAE"
 ukraine_develop_btr3.3.desc: "Another batch of BTR-3 armored personnel carriers has arrived in the United Arab Emirates, bringing us closer to fulfilling the terms of the contract.\nThe vehicles have already proven themselves during initial training and evaluation, strengthening our reputation as a reliable supplier of modern armored vehicles.\nWith the majority of the order now delivered, the successful completion of the contract is within reach."
 ukraine_develop_btr3.3.a: "Great!"
 ukraine_develop_btr3.4.name: "Last batch of BTR-3 delivered to UAE"
 ukraine_develop_btr3.4.desc: "The final batch of BTR-3 armored personnel carriers has been delivered to the United Arab Emirates, completing our first major export contract for the vehicle.\nThe successful fulfillment of the order is an important achievement for Ukraine's defense industry and opens the door to further cooperation with the UAE.\nWith the BTR-3 now established in Emirati service, we have an opportunity to expand this partnership even further. Will we elaborate towards this unique possibility?"
 ukraine_develop_btr3.4.a: "That's all"
 ukraine_develop_btr3.4.b: "Proceed with license"
 ukraine_develop_btr3.5.name: "We could not fulfill the request for BTR-3 to UAE"
 ukraine_develop_btr3.5.desc: "This is embarrassing!\nDue to low efficiency and amount of available production sites, we could not satisfy the production order for BTR-3 APCs for UAE. We even haven't provided them a single machine prior to date!\nWe will try to renegotiate this order once more, but the chances are low, to be fair. If their opinion on us is lower than 50 - they will not agree on contract renovation"
 ukraine_develop_btr3.5.a: "Let's renegotiate"
 ukraine_develop_btr3.5.b: "We can't continue"
 ukraine_develop_btr3.6.name: "We could not fulfill the request for BTR-3 to UAE"
 ukraine_develop_btr3.6.desc: "This is embarrassing!\nDue to low efficiency and amount of available production sites, we could not satisfy the production order for BTR-3 APCs for UAE. We have already provided 30 of them!\nWe will try to renegotiate this order once more, but the chances are low, to be fair. If their opinion on us is lower than 50 - they will not agree on contract renovation"
 ukraine_develop_btr3.6.a: "Let's renegotiate"
 ukraine_develop_btr3.6.b: "We can't continue"
 ukraine_develop_btr3.7.name: "We could not fulfill the request for BTR-3 to UAE"
 ukraine_develop_btr3.7.desc: "This is embarrassing!\nDue to low efficiency and amount of available production sites, we could not satisfy the production order for BTR-3 APCs for UAE. Only 30 were left to provide!\nWe will try to renegotiate this order once more, but the chances are low, to be fair. If their opinion on us is lower than 50 - they will not agree on contract renovation"
 ukraine_develop_btr3.7.a: "Let's renegotiate"
 ukraine_develop_btr3.7.b: "We can't continue"
 UKR_develop_btr3_uae_tender_win_flag: "We have §Gwon§! in UAE's tender for 90 APCs"
 UKR_develop_btr3_uae_tender_lose_flag: "We have §Rlost§! in UAE's tender for 90 APCs"
 UKR_develop_btr3_uae_tender_finish_flag: "We have §Gfinished§! the UAE's tender for 90 APCs"
 UKR_develop_btr3_uae_tender_license_flag: "We have §Gfinished§! the UAE's tender for 90 APCs and agreed on license production for §YBTR-3U 'Guardian'§!"
 UKR_develop_btr3_uae_tender_terminated_flag: "The contract to provide 90 APCs for UAE is §Rcancelled§! due to our military industry §Yinefficiency§!. "
 UKR_develop_btr3rk: "Develop §YBTR-3RK§! anti-tank variant"
 UKR_develop_btr3rk_desc: "\n\n\n\n\n\n£UKR_desctext_develop_domestic_btr3rk_for_tooltip\n\n\n\n\n\n\n\n\n\n§WThe BTR-3RK mounts a vehicle-based heavy anti-tank guided missile system on the BTR-3 family, giving mechanized units their own organic long-range anti-armour capability.\nRather than a new hull, this is our existing heavy ATGM system re-packaged for the BTR-3, keeping the electronics and warhead in line with what our anti-tank troops already use.§!"
 UKR_develop_btr3rk_flag: "Completed decision §YDevelop BTR-3RK§!"
 UKR_developed_mig29mu1_flag: " Completed decision §YModernize §GMiG-29MU1§! fighter aircraft§!"
 UKR_developed_mig29mu2_flag: " Completed decision §YFurther develop §GMiG-29MU2§! fighter aircraft§!"
 UKR_developed_su25m1_flag: " Completed decision §YModernize §GSu-25§! strike aircraft§!"
 UKR_modernize_su25_m1k: "Further develop  §YSu-25M1K§! strike aircraft"
 UKR_modernize_su25_m1k_desc: "\n\n\n\n\n\n£UKR_desctext_planes_modernization_su25m1k_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YSu-25M1K§! is a further Ukrainian modification of the §RSoviet§! armored subsonic attack aircraft §YSu-25§!, adopted by the Ukrainian Air Force in 2015.\nMain point of this modernization effort was to improve the survivability of the aircraft by retrofitting it with the §Y\"Adros\" KUV 26-50-01§! combined decoy flare dispenser system.§!"
 UKR_developed_su25m1k_flag: " Completed decision §YFurther develop §GSu-25M1K§! strike aircraft§!"
 UKR_developed_su27_1m_flag: " Completed decision §YModernize Su-27 fighter aircraft§!"
