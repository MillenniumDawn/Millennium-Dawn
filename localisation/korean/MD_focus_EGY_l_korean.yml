l_korean:
 egypt.100.t: "수에즈 운하 봉쇄"
 egypt.100.d: "The large container ship known as Ever Given has been grounded in the Suez Canal! The 400-metre-long vessel was struck by strong winds in the morning, resulting in the unfortunate accident. The obstruction occurred in the part of the canal where there is only one lane for ships to pass. Being one of the world's busiest trade routes, a prolonged blockade will strike a terrible blow to trade between Europe and Asia."
 egypt.100.a: "무슨 수를 써서라도."
 egypt.100.b: "우리는 수에즈 당국을 믿는다."
 egypt.100.c: "엄중한 경고를 부과한다."
 egypt.101.t: "수에즈 운하의 봉쇄"
 egypt.101.d: "이른 아침, 컨테이너 2만 개를 실은 거대한 컨테이너선 에버 기븐이 강한 모래 폭풍을 맞아 이 거대한 화물선이 수에즈 운하의 둑으로 떠밀렸습니다. 이로 인해 운하가 완전히 봉쇄되어 양쪽 입구 부근에 선박들이 쌓이고 있습니다. 통행 유지를 맡은 수에즈 운하 당국은 동원 가능한 모든 예인선을 서둘러 모았으며 곧 굴착을 시작할 계획입니다.\n\n[EGY.GetLeader] 정부는 운하를 정리하기 위해 무엇이든 하겠다고 발표했습니다."
 egypt.101.da: "이른 아침, 컨테이너 2만 개를 실은 거대한 컨테이너선 에버 기븐이 강한 모래 폭풍을 맞아 이 거대한 화물선이 수에즈 운하의 둑으로 떠밀렸습니다. 이로 인해 운하가 완전히 봉쇄되어 양쪽 입구 부근에 선박들이 쌓이고 있습니다. 통행 유지를 맡은 수에즈 운하 당국은 동원 가능한 모든 예인선을 서둘러 모았으며 곧 굴착을 시작할 계획입니다.\n\n[EGY.GetLeader] 정부는 이러한 불운한 상황에 대한 통상적인 절차를 이행하겠다고 발표했습니다."
 egypt.101.db: "이른 아침, 컨테이너 2만 개를 실은 거대한 컨테이너선 에버 기븐이 강한 모래 폭풍을 맞아 이 거대한 화물선이 수에즈 운하의 둑으로 떠밀렸습니다. 이로 인해 운하가 완전히 봉쇄되어 양쪽 입구 부근에 선박들이 쌓이고 있습니다. 통행 유지를 맡은 수에즈 운하 당국은 동원 가능한 모든 예인선을 서둘러 모았으며 곧 굴착을 시작할 계획입니다.\n\n[EGY.GetLeader] 정부는 세계가 충격을 받을 만큼 극도로 신중하게 대처하겠다고 발표했습니다."
 egypt.101.a: "뭐, 옛 희망봉 항로가 아직 있으니."
 egypt.102.t: "에버 기븐이 움직이기 시작하다"
 egypt.102.d: "에버 기븐호를 움직이기 위해 쉬지 않고 작업해 온 예인선들이 커다란 돌파구를 마련했다는 보고가 있습니다. 곧 통행이 안전하다고 선언하고 업무가 정상으로 돌아갈 수 있을 것입니다."
 egypt.102.a: "마침내."
 egypt.103.t: "정리된 수에즈 운하!"
 egypt.103.d: "최근 뉴스에서 소동을 일으켜 온 거대한 컨테이너선이 마침내 움직입니다! 선박들이 다시 운하를 통과할 수 있습니다. 이 선박의 운명은 아직 정해지지 않았지만, 모든 것이 다시 작동하는 듯하다는 사실 덕에 그리 중요해 보이지 않습니다.\n\n수에즈 운하 당국은 사고에 이르게 된 경위를 더 잘 파악하기 위해 이미 전면 조사에 착수했습니다. 수많은 소송이 이미 진행 중이며 이 이야기는 앞으로 수년간 이어질 수 있습니다.\n\n이집트 정부는 이를 또 하나의 승리라고 찬양합니다."
 egypt.103.a: "모처럼 좋은 소식이다."
 suez_canal_blocked: "수에즈 운하 봉쇄"
 suez_blocked_aftermath: "수에즈 봉쇄 여파"
 EGY_whatever_it_takes_tt: "운하는 일주일 안에 기능을 회복할 것으로 예상됩니다."
 EGY_trust_authorities_tt: "운하는 약 1~2주 안에 기능을 회복할 것으로 예상됩니다."
 EGY_act_with_cautious_tt: "운하는 약 2~5주 안에 기능을 회복할 것으로 예상됩니다."
 egypt_focus: "이집트 중점 트리"
 EGY_egyptian_politics: "이집트 정치"
 EGY_egyptian_politics_desc: "이제 정치 현안에 집중해야 할 때가 왔습니다."
 EGY_Hosni_mubarak: "호스니 무바라크 정부"
 EGY_Hosni_mubarak_desc: "호스니 무바라크는 1981년 취임한 이집트의 장기 집권 대통령입니다. 안정적인 지도력으로 알려진 무바라크는 이집트가 중동의 핵심 행위자 역할을 유지하도록 해 왔습니다."
 EGY_reform_legisl: "헌법 개정"
 EGY_reform_legisl_desc: "이번 새 제안 이전에는 야권 후보가 대통령에 출마할 수 없었으며, 대통령직은 6년마다 인민의회의 국민투표를 통해 재확인되는 방식이었습니다. 헌법 개정으로 이는 이집트 국민에게 책임을 지는 법률상(de jure) 선출직으로 바뀔 것입니다."
 EGY_state_security_service: "국가안보국"
 EGY_state_security_service_desc: "국가안보국은 이집트의 보안 기관으로, 이집트의 주된 국내 보안 기관이자 국가안보수사국의 후신입니다. 주요 책무는 방첩, 국내 및 국경 보안, 대테러, 감시입니다."
 egyptian_intelligenc_idea: "국가안보국"
 egyptian_intelligenc_idea_desc: "국가안보국은 이집트의 보안 기관으로, 이집트의 주된 국내 보안 기관이자 국가안보수사국의 후신입니다. 주요 책무는 방첩, 국내 및 국경 보안, 대테러, 감시입니다."
 EGY_affirm_friend_us: "미국과의 우정 재확인"
 EGY_affirm_friend_us_desc: "미국과의 관계는 성공적인 협력과 지정학적 지형에 대한 유사한 견해로 이어진 오랜 역사입니다. 우리는 이 우정을 강화해야 합니다."
 Egypt.2.t: "미국의 이라크 침공 규탄"
 Egypt.2.d: "미국이 우리의 적은 아니지만, 이라크 침공은 무책임한 의사결정의 사례입니다. 우리는 중동 사회의 추가적인 급진화를 원하지 않으므로, 미국에 우리가 그러한 행동에 반대한다는 점을 보여 주려 시도할 수 있습니다."
 Egypt.2.a: "외교적 항의를 하자."
 Egypt.2.b: "이라크를 은밀히 지원하는 것은 어떨까?"
 Egypt.3.t: "이라크 전쟁을 규탄하는 이집트!"
 Egypt.3.d: "중동에서 가장 가까운 동맹국 중 하나인 이집트가 우리의 이라크 침공에 대해 외교적 항의를 했습니다. 그들은 어떤 방식으로도 이라크를 물질적으로 지원하지 않겠다고 약속했으나, 이러한 전쟁이 중동을 불안정하게 만들 것이라고 밝혔습니다."
 Egypt.3.a: "매우 유감스럽다."
 Egypt.4.t: "이집트의 비밀 지원!"
 Egypt.4.d: "우리는 만난 적도, 서로 본 적도 없습니다. 아시겠습니까?"
 Egypt.4.a: "고맙다, 형제들이여!"
 EGY_cond_us_invasion: "이라크 지원"
 EGY_cond_us_invasion_desc: "이라크와의 관계가 완전한 우호 관계는 아닙니다. 그러나 미국의 이라크 침공은 전혀 정당화될 수 없습니다. 우리는 이에 대해 무언가 해야 합니다."
 EGY_join_qoal_iraq: "미국 연합 가담"
 EGY_join_qoal_iraq_desc: "우리는 미국에 대한 의무를 이행하고 이라크와의 전쟁에 참여해야 합니다!"
 EGY_ask_us_supp: "재정 지원"
 EGY_ask_us_supp_desc: "경제를 활성화하기 위해, 미국 정부에 자국 기업들이 이집트에 투자하도록 장려해 달라고 요청해야 할지도 모릅니다."
 Egypt.5.t: "우리에게 투자를 요청하는 이집트"
 Egypt.5.d: "이집트가 최근 우리에게 자국 산업에 투자해 달라고 요청했습니다. 동의해야 할까요?"
 Egypt.5.a: "물론이다!"
 Egypt.5.b: "미안하지만, 안된다"
 Egypt.6.t: "미국의 우리 제안 거부"
 Egypt.6.d: "그들은 우리나라에 투자하고 싶어 하지 않습니다."
 Egypt.6.a: "으억"
 Egypt.7.t: "우리나라에 투자하기로 동의한 미국!"
 Egypt.7.d: "그들은 우리 산업에 투자하고 모든 건설 비용을 부담하는 데 동의했습니다. 하지만 이는 우리에 대한 그들의 영향력을 높일 것입니다."
 Egypt.7.a: "고맙다"
 EGY_interv_tt: "이제 해외 분쟁에 지원병을 보낼 수 있습니다!"
 EGY_finish_syr_tur_neg: "시리아-튀르키예 협상 마무리"
 EGY_finish_syr_tur_neg_desc: "이집트는 오랫동안 시리아-튀르키예 관계 정상화를 위한 협상자이자 중재자 역할을 해 왔습니다. 이제 협상을 마무리할 때가 왔습니다."
 EGY_prop_us_sec_exp: "미국 안보 확대"
 EGY_prop_us_sec_exp_desc: "중동에서 미국의 두 번째로 가까운 동맹국으로서, 우리는 미국이 자국의 안보 정책을 우리에게도 확대하도록 설득해 볼 수 있습니다."
 EGY_isr_peace_support: "평화 지지"
 EGY_isr_peace_support_desc: "우리는 이스라엘을 친구로 여기지 않으며 앞으로도 그럴 것입니다. 그러나 양국 모두에 이익이 되도록 두 나라 사이의 긴장을 완화할 수는 있습니다."
 Egypt.8.t: "이집트의 중재"
 Egypt.8.d: "이제 시리아-튀르키예 협상을 마무리할 때가 왔습니다. 이집트의 제안에 동의해야 할까요?"
 Egypt.8.a: "그렇다, 관계를 정상화하자."
 Egypt.8.b: "아니다, 동의하지 않는다."
 Egypt.9.t: "동의하지 않은 튀르키예!"
 Egypt.9.d: "최근 이집트의 중재로 이루어진 시리아와 튀르키예 간 협상 이후, 튀르키예는 시리아와 불가침 조약을 맺기를 원하지 않았으며 시리아에 대한 적대감을 계속 드러냈습니다."
 Egypt.9.a: "매우 유감스럽다!"
 Egypt.10.t: "튀르키예와 시리아의 불가침 조약."
 Egypt.10.d: "최근 이집트의 중재로 이루어진 시리아와 튀르키예 간 협상 이후, 튀르키예는 시리아와 불가침 조약을 맺는 데 동의했으며 앞으로의 평화를 보장하겠다고 약속했습니다!"
 Egypt.10.a: "좋다!"
 EGY_gaza_annex_prop: "가자 병합 제안"
 EGY_gaza_annex_prop_desc: "가자는 오랫동안 이스라엘과의 관계에서 큰 문제였습니다. 지역의 안정을 확보하기 위해 가자 병합을 제안할 수 있습니다. 이는 우리의 인기도와 전반적인 지지도 높일 것입니다."
 Egypt.11.t: "가자를 병합하려는 이집트!"
 Egypt.11.d: "이집트가 가자에 관한 자국의 제안에 우리가 동의하는지 묻고 있습니다. 그들은 이것이 양측 모두에 이익이 될 것이며 가자에서 우리나라로 가해지는 공격이 영원히 멈추도록 보장할 것이라고 장담합니다."
 Egypt.11.a: "동의한다. 이는 우리의 부담을 크게 덜어 줄 것이다!"
 Egypt.11.b: "당신들의 제안은 필요 없다."
 Egypt.13.t: "이스라엘의 비동의"
 Egypt.13.d: "그들은 우리의 제안을 받아들이지 않았습니다."
 Egypt.13.a: "흠."
 Egypt.12.t: "동의한 이스라엘!"
 Egypt.12.d: "이스라엘이 우리의 제안에 동의했습니다. 이제 팔레스타인을 설득해야 합니다..."
 Egypt.12.a: "파타에 서한을 보내자."
 Egypt.14.t: "가자를 요구하는 이집트!"
 Egypt.14.d: "이집트가 가자 병합을 요구했습니다... 어떻게 해야 할까요?"
 Egypt.14.a: "이 배신자들에게 넘겨주자..."
 Egypt.14.b: "우리는 그런 일에 결코 동의하지 않을 것이다!"
 Egypt.15.t: "이집트의 승리!"
 Egypt.15.d: "이제 가자는 이집트의 것입니다!"
 Egypt.15.a: "흥미롭군"
 Egypt.16.t: "이집트의 패배!"
 Egypt.16.d: "가자는 원래 있던 그대로입니다."
 Egypt.16.a: "흥미롭군"
 EGY_squash_diplo: "스쿼시 외교"
 EGY_squash_diplo_desc: "무바라크와 미국 대통령들 사이의 개인적 관계는 우리 대외 관계의 큰 요인입니다. 이를 우리에게 유리하게 활용해야 합니다."
 Egypt.17.t: "우리의 인맥을 활용하여..."
 Egypt.17.d: "우리 기관은 최근 인접국에서 더 많은 인원을 모집하기로 결정했습니다. 어느 나라에 집중해야 할까요?"
 Egypt.17.a: "이스라엘"
 Egypt.17.b: "리비아"
 Egypt.17.c: "수단"
 EGY_expansion_of_personnel: "인력 확충"
 EGY_expansion_of_personnel_desc: "우리 기관의 역량을 확대하려면 인접국에서의 네트워크를 확대해야 할지도 모릅니다."
 EGY_counter_radicalism: "급진주의 대응"
 EGY_counter_radicalism_desc: "어리석은 급진주의자들이 해충처럼 우리나라에 둥지를 틀고 있습니다. 이들을 제거해야 합니다!"
 EGY_clear_out_alqaeda: "알카에다 소탕"
 EGY_clear_out_alqaeda_desc: "알카에다가 우리나라에 뿌리를 내렸습니다. 우리는 그것을 뽑아내야 합니다!"
 EGY_bedouin_invest: "이슬람주의 기지 급습"
 EGY_bedouin_invest_desc: "시나이의 깊은 모래 속에 여러 이슬람주의 단체가 우리의 번영을 훼손하기 위해 자리를 잡았습니다. 이들을 일소해야 합니다."
 EGY_outdated_army_idea: "심각하게 낙후된 군대"
 EGY_outdated_army_idea_desc: "이집트군은 과거의 그림자에 불과합니다. 우리의 안보를 보장하려면 군을 정비하여 세계 수준을 따라잡게 해야 합니다."
 EGY_outdated_army_idea_1: "시대에 뒤떨어진 군대"
 EGY_outdated_army_idea_1_desc: "이집트군은 과거의 그림자에 불과합니다. 우리의 안보를 보장하려면 군을 정비하여 세계 수준을 따라잡게 해야 합니다."
 EGY_outdated_army_idea_2: "다소 낙후된 군대"
 EGY_outdated_army_idea_2_desc: "이집트군은 과거의 그림자에 불과합니다. 우리의 안보를 보장하려면 군을 정비하여 세계 수준을 따라잡게 해야 합니다."
 EGY_outdated_army_idea_3: "약간 낙후된 군대"
 EGY_outdated_army_idea_3_desc: "이집트군은 과거의 그림자에 불과합니다. 우리의 안보를 보장하려면 군을 정비하여 세계 수준을 따라잡게 해야 합니다."
 Egypt.18.t: "이집트의 테러리스트 경고!"
 Egypt.18.d: "이집트는 최근 우리가 이탈리아에 숨겨진 매우 영향력 있는 살라피 테러리스트인 하산 무스타파 오사마 나스르를 추적할 수 있도록 협력해 줄 것을 경고했습니다. 이집트 당국은 이와 관련하여 이집트 정보국(IA)과 CIA와 함께 협력하여 그를 붙잡기를 원하고 있습니다."
 Egypt.18.a: "물론이다!"
 EGY_consp_europe: "유럽에서의 공작"
 EGY_consp_europe_desc: "이탈리아에 공작 기지를 마련하고, 이탈리아 정부에 자국에 숨어 사는 테러리스트에 대해 경고해야 합니다."
 EGY_contact_cia: "CIA 접촉"
 EGY_contact_cia_desc: "CIA는 오래전부터 하산 무스타파 오사마 나스르를 체포하고자 해 왔습니다. 이제 그의 소재를 알았으니 이를 알릴 수 있습니다."
 Egypt.19.t: "중요한 정보를 공유하는 이집트"
 Egypt.19.d: "최근 이집트 정보기관이 우리의 오랜 숙적인 테러리스트 하산 무스타파 오사마 나스르가 거주하는 곳을 알아냈습니다. 그는 이탈리아에 숨어 있는 것으로 보입니다. 이집트는 이 사건의 해결에 우리의 지원과 협력을 원합니다."
 Egypt.19.a: "요원들이 파견된다."
 Egypt.19.b: "음, 그가 정말 그렇게 중요한가?"
 Egypt.20.t: "미국의 응낙"
 Egypt.20.d: "미국이 이탈리아에 있는 테러리스트를 체포하는 데 우리를 지원하기로 동의했습니다."
 Egypt.20.a: "좋아"
 Egypt.21.t: "미국의 비동의"
 Egypt.21.d: "미국은 이 미치광이가 활개 치는 것을 그저 지켜보는 쪽을 훨씬 선호합니다. 왜일까요?"
 Egypt.21.a: "제정신인가?"
 Egypt.22.t: "이탈리아에서 체포된 하산 무스타파 오사마 나스르"
 Egypt.22.d: "이집트와 이탈리아의 합동 작전 끝에 하산 무스타파 오사마 나스르가 체포되어 수감되었습니다. 이는 국제 살라피즘에 대한 매우 강력한 타격입니다."
 Egypt.22.a: "환상적이군"
 EGY_find_mustafa: "무스타파를 찾아서"
 EGY_find_mustafa_desc: "이제 필요한 모든 연줄을 마련하고 모든 준비를 마쳤으므로, 합동 작전으로 하산 무스타파 오사마 나스르를 체포할 준비가 되었습니다."
 EGY_militarized_police: "군사화된 경찰"
 EGY_militarized_police_desc: "이집트가 안고 있는 모든 테러 위협을 고려하여, 어떤 상황에도 대비할 수 있도록 경찰을 군사화해야 합니다."
 EGY_peoples_assembly: "인민의회"
 EGY_peoples_assembly_desc: "인민의회가 완전히 자리 잡았으므로, 다양한 전문가를 활용해 부패 위기를 줄일 수 있습니다. 그러나 그들이 성과를 자신들의 정치 세력의 공으로 주장할 것이므로 우리의 인기도를 잃을 수 있습니다."
 EGY_secur_the_throne: "경제 안보"
 EGY_secur_the_throne_desc: "지도자의 통치를 공고히 하려면 더 많은 무역 개혁을 시작하고 더 개방적인 경제를 구축해야 합니다."
 EGY_ally_military_mub: "군 지원"
 EGY_ally_military_mub_desc: "이집트군은 무바라크의 세속주의 통치를 가장 충실히 수호하는 이들입니다. 우리는 그들을 지원해야 합니다."
 musl_broth_egy_1_tt: "무슬림 형제단이 우리의 집권 연립에 추가됩니다."
 musl_broth_egy_2_tt: "무슬림 형제단은 계속 정치에서 배제됩니다."
 EGY_allow_musl_brotherhood: "무슬림 형제단 허용"
 EGY_allow_musl_brotherhood_desc: "무슬림 형제단은 오랫동안 무바라크의 통치와 모든 세속 정치인의 평판을 훼손하려 해 왔습니다. 그러나 이들을 공식적으로 정부에 편입시키면 일시적으로 더 많은 정치적 힘을 얻을 수 있습니다."
 EGY_ban_musl_brotherhood: "무슬림 형제단 금지"
 EGY_ban_musl_brotherhood_desc: "우리가 무슬림 형제단의 발상지라 하더라도 이 테러 조직을 억압해야 합니다. 이는 우리의 정치적 역량을 제한하겠지만 급진화는 둔화될 것입니다."
 EGY_anti_israel_prop: "반이스라엘 선전"
 EGY_anti_israel_prop_desc: "전쟁은 오래전에 끝났지만, 국민의 지지를 확보하기 위해 반이스라엘 선전을 계속 밀어붙여야 합니다."
 EGY_domestic_econ_reform: "국내 경제 개혁"
 EGY_domestic_econ_reform_desc: "이집트의 번영을 이루려면 국내 경제 개혁을 시작해야 합니다."
 EGY_prepare_alaa: "알라 준비시키기"
 EGY_prepare_alaa_desc: "경제적 입지를 강화하기 위해 알라 무바라크가 정부 입찰과 민영화에서 우대받도록 해야 할 수도 있습니다."
 EGY_fair_priv_mub: "공정한 민영화"
 EGY_fair_priv_mub_desc: "공정한 민영화는 좋은 장기 투자가 될 수 있으나 상당한 지출이 필요할 것은 분명합니다."
 EGY_gamal_gamble: "가말의 도박"
 EGY_gamal_gamble_desc: "무바라크의 또 다른 아들 가말은 매우 경험 많은 은행가입니다. 그의 활동을 지원하는 것은 우리 국가에 상당히 이로울 수 있습니다."
 EGY_joining_wto: "WTO 가입"
 EGY_joining_wto_desc: "경제를 번영시키려면 여러 경제 기구에 가입하는 것이 중요합니다. 세계무역기구 가입은 우리 경제에 이로울 수 있습니다."
 EGY_lessons: "이스라엘과의 전쟁에서 얻은 교훈"
 EGY_lessons_desc: "우리는 이스라엘과 많은 전쟁을 치렀으며, 앞으로의 군사적 성공을 보장하기 위해 이 분쟁들에서 배워야 합니다."
 EGY_army: "이집트 육군"
 EGY_army_desc: "이집트 육군 또는 이집트 지상군은 이집트군의 지상전 부문입니다. 이집트군에서 가장 큰 군종입니다."
 EGY_exp_fleet: "이집트 해군"
 EGY_exp_fleet_desc: "이집트 해군은 이집트 해상군이라고도 하며, 이집트군의 해상 부문입니다. 중동과 아프리카에서 가장 큰 해군이며, 세계에서 (함정 수 기준) 열두 번째로 큰 해군입니다."
 EGY_ras_el_tin: "라스엘틴"
 EGY_ras_el_tin_desc: "알렉산드리아 항은 이집트 알렉산드리아에서 지중해와 마리우트 호수 사이, 나일 삼각주 서쪽 해안에 위치하며 이집트에서 두 번째로 중요한 주요 항구로 여겨집니다. 알렉산드리아 항은 T자형 반도로 분리된 두 개의 항구로 이루어져 있습니다."
 EGY_corvet: "이집트 연안 경비"
 EGY_corvet_desc: "어민과 어선을 보호하려면 연안 방어를 강화해야 합니다."
 EGY_new_docs: "새 해군 조선소"
 EGY_new_docs_desc: "우리 함대에는 새로운 함선이 필요하며, 이를 위해서는 자금과 장비가 필요합니다."
 EGY_naval_air: "이집트 해군 항공대"
 EGY_naval_air_desc: "우리 함대에는 연안 및 해군 항공 전력도 필요합니다."
 EGY_new_doctrine_desc: "해전에서 승리하려면 새로운 해군 교리를 발전시켜야 합니다."
 EGY_reneved_navy: "해군 개혁"
 EGY_reneved_navy2: "해군 개혁 완료"
 EGY_roc: "이집트 로켓"
 EGY_buy_buk: "러시아 BUK 구매"
 EGY_buy_buk_desc: "우리 군에는 지대공 미사일이 필요합니다. 러시아의 BUK이 우리의 선택입니다!"
 EGY_buy_patriot: "미국 패트리어트 구매"
 EGY_buy_patriot_desc: "우리 군에는 첨단 대공 방어가 필요하므로 미국의 패트리어트 미사일이 필요합니다."
 EGY_mod_scud: "R-17 스커드 현대화"
 EGY_mod_scud_desc: "우리는 일정 수의 구 소련제 R-17 미사일을 보유하고 있으며, 이를 현대화해야 합니다."
 EGY_air: "이집트 공군"
 EGY_air_desc: "이집트 공군(EAF)은 이집트군의 항공 부문으로, 모든 공중 방어 임무를 책임지며 이집트 육군, 이집트 해군, 이집트 방공군을 지원하는 데 쓰이는 항공기를 포함한 모든 군용기를 운용합니다."
 EGY_mig29: "러시아 MiG 구매"
 EGY_mig29_desc: "우리 공군을 보완하기에 이상적인 러시아 항공기를 구매해야 합니다"
 EGY_f16: "미국 팰컨 구매"
 EGY_f16_desc: "F-16은 우리 공군의 중추입니다. 공군을 유지하려면 미국에서 새 항공기와 그 예비 부품을 구매해야 합니다."
 EGY_domestic_air: "국산 항공기 생산"
 EGY_domestic_air_desc: "우리 자체의 항공기 생산 및 개발 역량을 발전시켜야 합니다."
 EGY_new_bases: "공군 신규 기지"
 EGY_new_bases_desc: "항공기를 배치하려면 방치된 옛 공군 기지를 복구하고, 보수가 불가능한 경우 새로 건설해야 합니다."
 EGY_licence_mir: "미라주 라이선스 구매"
 EGY_licence_mir_desc: "우리는 프랑스 항공기를 생산할 모든 수단을 갖추고 있으므로 생산 라이선스를 요청해야 합니다."
 EGY_air_doc: "이집트 공군 교리"
 EGY_air_doc_desc: "공중전에서 승리하려면 자체 교리를 발전시키거나 다른 나라의 교리를 적응시켜야 합니다."
 EGY_air_doctrine: "새 공군 교리"
 EGY_exer: "이집트 군사 훈련"
 EGY_exer_desc: "병력을 훈련시키고 군사 교리의 결함을 찾기 위해 군사 훈련을 실시해야 합니다."
 EGY_egyptian_economy: "이집트 경제"
 EGY_egyptian_economy_desc: "이제 우리 정부가 경제 문제에 집중할 때가 왔습니다."
 EGY_tourism_sector: "관광 부문"
 EGY_tourism_sector_desc: "관광은 우리나라에서 가장 성공적인 경제 부문 중 하나입니다. 21세기는 빠른 여행과 휴가의 세기입니다. 이 분야에서의 잠재력을 고려하면 실제로 많은 이익을 얻을 수 있습니다."
 EGY_new_airports: "새 공항"
 EGY_new_airports_desc: "활기를 되찾은 관광에 알맞게 대비하려면 더 많은 공항을 건설해야 합니다."
 EGY_develop_luxor: "룩소르 개발"
 EGY_develop_luxor_desc: "룩소르는 카르나크와 룩소르의 이집트 신전 복합 단지 유적이 현대 도시 안에 서 있어 세계 최대의 야외 박물관으로 흔히 일컬어집니다. 나일 강 건너 바로 맞은편에는 왕들의 계곡과 왕비들의 계곡을 포함하는 서안 테베 사자의 도시의 기념물, 신전, 무덤이 있습니다. 매년 전 세계에서 수천 명의 관광객이 룩소르의 기념물을 보러 찾아와 현대 도시의 경제에 크게 기여하고 있습니다. 유수프 아부 알하자즈는 룩소르의 수호성인입니다."
 EGY_develop_Sinai: "시나이 개발"
 EGY_develop_Sinai_desc: "고전 시대에 이 지역은 아라비아 페트라이아로 알려져 있었습니다. 성 카타리나 수도원 근처의 산이 성서의 시나이 산이라는 추정에서 근대에 이 반도에 시나이라는 이름이 붙었습니다. 시나이 산은 아브라함 계열 신앙에서 종교적으로 가장 중요한 장소 중 하나입니다. 오늘날 시나이는 자연 환경, 풍부한 산호초, 성서의 역사로 인해 관광지가 되었습니다."
 EGY_develop_cairo: "카이로 개발"
 EGY_develop_cairo_desc: "카이로는 이집트의 수도이자 도시 국가인 카이로 주이며, 1000만 명이 사는 이 나라 최대의 도시입니다. 또한 아프리카, 아랍 세계, 중동에서 가장 큰 도시 집적지의 일부입니다. 대카이로 광역권은 인구 기준으로 세계 12위입니다. 카이로는 기자 피라미드 단지와 고대 도시 멤피스, 헬리오폴리스가 그 지리적 범위 안에 있어 고대 이집트와 연관됩니다."
 EGY_sharm_el_sheikh: "샤름엘셰이크"
 EGY_sharm_el_sheikh_desc: "샤름엘셰이크는 시나이 반도 남단, 남시나이 주에 있는 홍해 연안 지대의 이집트 도시입니다. 샤름엘셰이크는 이집트 남시나이 주의 행정 중심지이며, 이 주에는 더 작은 해안 도시인 다하브와 누웨이바, 그리고 산악 내륙 지대인 성 카타리나와 시나이 산이 포함됩니다. 이 도시이자 휴양지는 이집트 관광의 중요한 중심지이며, 동시에 많은 국제 회의와 외교 회담을 유치하고 있습니다."
 EGY_invite_foreign_hotels: "외국 호텔 유치"
 EGY_invite_foreign_hotels_desc: "국제 호텔 복합 기업과의 협력은 최고의 관광지라는 우리의 명성을 뒷받침할 것입니다!"
 EGY_new_wave_of_tourists: "새로운 관광객 물결!"
 EGY_new_wave_of_tourists_desc: "이제 이집트 관광 부문을 최종 단계로 끌어올릴 때가 왔습니다."
 EGY_our_shining_pyramids: "빛나는 우리의 피라미드"
 EGY_our_shining_pyramids_desc: "이집트의 고대 피라미드는 세계적으로 유명한 이 세상의 불가사의입니다. 그 흥미로운 입지를 수익화할 방법을 찾아야 합니다."
 EGY_telecom_egypt: "텔레콤 이집트"
 EGY_telecom_egypt_desc: "텔레콤 이집트는 이집트의 주요 전화 회사입니다. 1854년 이집트 최초의 전신선으로 시작되었습니다. 1998년 이전의 이집트 아랍 공화국 국가 통신 기구를 대체했습니다."
 EGY_vodafone: "보다폰과의 계약"
 EGY_vodafone_desc: "보다폰 그룹 plc는 영국의 다국적 통신 기업입니다. 등록 사무소와 글로벌 본사는 잉글랜드 버크셔 뉴버리에 있습니다. 주로 아시아, 아프리카, 유럽, 오세아니아에서 서비스를 운영합니다."
 EGY_mobinil: "모비닐 확장"
 EGY_mobinil_desc: "모비닐은 1998년 3월 4일에 설립된 이집트에서 가장 오래된 이동통신 사업자입니다. 모비닐은 음성 및 데이터 교환 서비스와 4G, 3G, ADSL, 광대역 인터넷을 제공합니다."
 EGY_peugeot: "푸조 자동차"
 EGY_peugeot_desc: "푸조는 PSA 푸조 시트로엥에 속한 프랑스의 주요 자동차 제조사 중 하나입니다. 2007년 자료에 따르면 PSA의 모회사인 푸조 시트로엥은 유럽에서 두 번째로 큰 자동차 제조사입니다."
 EGY_avtovaz: "아프토바즈"
 EGY_avtovaz_desc: "아프토바즈는 국가가 소유한 러시아의 자동차 제조 기업입니다. 이전에는 러시아어로 볼가 자동차 공장의 약자인 VAZ로 불렸습니다. 아프토바즈는 대표 차종인 라다 시리즈로 가장 잘 알려져 있습니다."
 EGY_jeep: "지프"
 EGY_jeep_desc: "지프는 미국의 자동차 브랜드로, 현재 다국적 기업 스텔란티스가 소유하고 있습니다. 지프는 1987년 크라이슬러가 이전 소유주인 아메리칸 모터스 코퍼레이션으로부터 다른 자산과 함께 지프 브랜드를 인수한 이후 크라이슬러의 일부였습니다."
 EGY_kia: "기아 자동차"
 EGY_kia_desc: "기아는 대한민국 서울에 본사를 둔 한국의 다국적 자동차 제조사입니다. 한국에서 두 번째로 큰 자동차 제조사입니다."
 EGY_zastava: "자스타바 자동차"
 EGY_zastava_desc: "자스타바 자동차는 자스타바 차량 그룹의 자회사인 세르비아의 국제 자동차 제조사였습니다."
 EGY_mercedes: "메르세데스-벤츠 공장"
 EGY_mercedes_desc: "흔히 메르세데스, 때로는 벤츠로 불리는 메르세데스-벤츠는 1926년에 설립된 독일의 고급 및 상용차 자동차 브랜드입니다. 메르세데스-벤츠 AG의 본사는 독일 바덴뷔르템베르크 주 슈투트가르트에 있습니다."
 EGY_automobile_factories: "자동차 산업"
 EGY_automobile_factories_desc: "국민을 고용하고 더 많은 경제 역량을 얻기 위해 외국 자동차 생산업체를 우리나라에 유치해야 할지도 모릅니다."
 EGY_industrial_section: "산업 부문"
 EGY_industrial_section_desc: "서비스 제공만으로는 경제를 지탱할 수 없습니다. 산업을 일으키기 위해 좋은 투자 환경을 조성해야 합니다!"
 EGY_el_nasr: "엘 나스르 자동차 부활"
 EGY_el_nasr_desc: "나스르는 이집트의 국영 자동차 기업입니다. 1960년 이집트 헬완에서 설립된 최초의 아랍 자동차 제조사입니다."
 EGY_arab_amer_vehi: "아랍 아메리칸 비히클스"
 EGY_arab_amer_vehi_desc: "이 회사는 다임러 AG, 기아, 스텔란티스, 도요타의 라이선스로 다양한 차량을 제조하며, 1977년 아랍산업화기구와 아메리칸 모터스 코퍼레이션이 AMC 지프를 조립하기 위한 합작 투자로 시작되었습니다."
 Egypt.23.t: "이집트-미국 합작 자동차 생산"
 Egypt.23.d: "최근 우리와 이집트 간의 계약이 두 나라의 좋은 우호 관계 덕분에 연장되었습니다."
 Egypt.23.a: "좋아"
 EGY_ghabbour: "가부르 공장"
 EGY_ghabbour_desc: "GB 코퍼레이션은 카이로에 있는 이집트의 자동차, 버스, 트럭, 오토바이 제조사입니다. 이 회사는 자동차 부문이 성장하는 시장임을 깨달은 카말 가부르와 사데크 가부르 형제가 1960년에 설립했습니다. 초창기에는 가부르 브라더스라는 이름이었습니다. 이전에는 이 그룹이 사비엠(이후 RVI) 차량을 제조했습니다. 오늘날 이 그룹은 바자즈 오토, 현대, 볼보 등 수많은 브랜드의 차량을 제조합니다. 연간 15만 대를 생산하는 가부르 그룹은 현재 이집트 최대의 자동차 제조사입니다."
 EGY_MCV: "맨유팩처링 커머셜 비히클스"
 EGY_MCV_desc: "맨유팩처링 커머셜 비히클스(MCV)는 버스와 트럭을 만드는 이집트의 제조사입니다. 생산 공장은 살헤야에 있고, 본사는 카이로 근처 오보르 시에 있습니다. 이 제조사는 ECHOLINE, eVolution, MCV 브랜드의 상표권을 소유하고 있습니다. 일부 모델은 메르세데스-벤츠 MCV라는 이중 브랜드명으로 조립됩니다."
 EGY_egy_tech: "이지-테크"
 EGY_egy_tech_desc: "EGY Tech 회사는 많은 고객층을 상대하는 이집트의 전자 연구 기업으로 설립되었으며 컴퓨터 분야 연구에 가장 특화되어 있습니다."
 EGY_textile_factories: "섬유 공장"
 EGY_textile_factories_desc: "이집트 섬유 산업은 전략적인 지리적 위치, 숙련된 노동력, 탄탄한 인프라 덕분에 매력적인 투자 기회를 제공합니다. 주요 국제 시장에 접근할 수 있는 이집트는 섬유 수출의 관문 역할을 하며 세계적인 무역 제휴를 촉진합니다. 이 나라의 풍부한 면화 재배 역사와 전문성은 고품질 섬유 생산에 기여합니다. 나아가 경제 개혁과 현대화 구상에 대한 이집트의 의지는 이 부문의 경쟁력을 높여, 역동적이고 유망한 시장에서 성장을 모색하는 투자자에게 매력적인 전망을 제공합니다."
 EGY_town_team: "타운 팀"
 EGY_town_team_desc: "타운 팀은 1998년에 설립되었습니다. 타운 팀은 캐주얼웨어를 전문으로 하는 이집트에서 가장 인기 있는 남성 패션 브랜드 중 하나이며, 이집트 전역으로 꾸준히 성장하고 확산하고 있으며 가장 중심가의 고급 입지, 쇼핑몰, 로드숍에 자리하고 있습니다."
 EGY_napi_pharma: "나피 파마"
 EGY_napi_pharma_desc: "나피 파마 그룹은 이 나라에 만연한 흔한 질환을 다루는, 환자가 감당할 수 있는 고품질 제품을 이집트 시장에 공급한다는 같은 뚜렷한 비전을 따라 탄탄한 걸음으로 확장을 이어 갔습니다."
 EGY_evergrow: "에버그로 에버그린 비료"
 EGY_evergrow_desc: "에버그로는 이집트와 중동에서 특수 비료를 제조하고 판매하는 선도 기업입니다. 더 많은 수입을 얻기 위해 이 비료의 수출을 시작해야 합니다."
 EGY_embaba_giza: "방크 미스르"
 EGY_embaba_giza_desc: "방크 미스르는 1920년 실업가 조지프 아슬란 카타위 파샤와 경제학자 탈라트 하르브 파샤가 공동 설립한 이집트의 은행입니다. 아랍 연합 공화국 정부가 1960년 이 은행을 국유화했습니다. 이 은행은 이집트 모든 주에 지점이 있으며, 이집트 내 외국인 노동자를 위한 환전소와 취업 허가 사무소도 운영합니다."
 EGY_trade_idea: "이집트 은행들"
 EGY_energetics: "이집트 에너지 산업"
 EGY_energetics_desc: "이집트는 풍부한 토지, 화창한 날씨, 높은 풍속을 갖추고 있어 재생 에너지 사업의 최적지입니다. 재생 에너지 장비 시장은 잠재적으로 수십억 달러 규모입니다. 이집트 정부는 늘어나는 수요에 대응하고 전력 부문을 보다 환경적으로 지속 가능하고 다양하게 전환하기 위해 지속 가능한 에너지 구성이 필요함을 인식하고 있습니다."
 EGY_solar_farms: "태양광 발전소"
 EGY_solar_panels: "태양광 패널"
 EGY_solar_zuynya: "태양광 발전 투자"
 EGY_solar_zuynya_desc: "우리 땅에는 햇빛이 내리쬐는 빈 땅이 가득합니다. 예전에는 저주였지만 이제는 축복입니다!"
 EGY_rosatom_deal: "로사톰과의 거래"
 EGY_rosatom_deal_desc: "로사톰은 오늘날 해외 원전 건설 사업 수에서 세계 1위이며 세계적인 기술 선도 기업 중 하나입니다. 엘다바에 새 발전 설비를 건설하기 위해 이들과 거래를 성사시켜야 합니다."
 rosatom_egy_tt: "이집트가 우리로부터 원자로 2기를 받게 됩니다."
 rosatom_egyt_tt: "§Y러시아의 영향력이 10% 증가합니다!§! 원자로 2기가 건설됩니다."
 rosatom_egy_foc_tt: "§Y거래가 성공하면 [SOV.GetNameWithFlag] 러시아의 영향력이 10% 증가합니다!§!"
 EGY_renewables_idea: "전력화 노력"
 EGY_electrify_cities: "모두를 위한 전력화"
 EGY_electrify_cities_desc: "우리나라 모든 국민에게 전력을 지속적으로 공급하는 데 정부의 노력을 쏟아야 합니다."
 EGY_gold_mining: "금 채굴"
 EGY_gold_mining_desc: "우리 땅에는 천연 금 매장량이 매우 풍부합니다. 팔기 위해 더 깊이 파야 합니다."
 EGY_alex_nubia: "알렉스 누비아 광업"
 EGY_alex_nubia_desc: "알렉산더 누비아는 금 탐사에 집중하는 회사로, 이집트에서 아라비아-누비아 순상지의 중부 동부 사막에서 경제성 있는 금 매장지를 탐사하고 개발하고 있습니다."
 EGY_anglogold: "앵글로골드 아샨티"
 EGY_anglogold_desc: "앵글로골드 아샨티는 금, 은, 구리 사업과 프로젝트로 구성된 다양하고 고품질의 포트폴리오를 보유한 글로벌 광업 기업입니다."
 EGY_sukari_centamin: "수카리 금광"
 EGY_sukari_centamin_desc: "수카리는 이집트 최초의 대규모 현대식 광산으로, 매끄러운 포장도로, 독립형 전력, 태양광, 홍해에서 물을 끌어오는 25km 수도관을 갖추고 있습니다. 광물이 풍부한 이집트 동부 사막의 지형과 기후는 가혹할 수 있습니다."
 EGY_gas_exports: "가스 수출"
 EGY_gas_exports_desc: "우리는 지중해 전체에서 가장 큰 천연가스 매장량을 보유하고 있습니다. 이를 우리에게 이롭게 활용해야 합니다."
 EGY_petrochemichal_ind: "마그레브 석유화학 산업 투자"
 EGY_petrochemichal_ind_desc: "이웃 마그레브 국가들은 투자가 절실히 필요합니다. 이를 상호 이익을 위해 활용하여 우리의 석유화학 산업에 투자할 수 있습니다."
 Egypt.28.t: "석유화학 산업 투자를 제안하는 이집트!"
 Egypt.28.d: "이집트가 상호 이익이 되는 투자 거래를 제안했습니다. 수락해야 할까요?"
 Egypt.28.a: "물론이다!"
 Egypt.28.b: "미안하지만, 안된다"
 egy_petr_tt: "그들에 대한 우리의 영향력이 6% 증가합니다"
 Egypt.29.t: "[From.GetName]의 수락!"
 Egypt.29.d: "그들이 우리의 제안을 수락했습니다!"
 Egypt.29.a: "좋아"
 Egypt.30.t: "[From.GetName]의 거절!"
 Egypt.30.d: "그들은 우리와 협력하고 싶어 하지 않습니다!"
 Egypt.30.a: "흠."
 EGY_egypt_arab_pipeline: "아랍 협력"
 EGY_egypt_arab_pipeline_desc: "이제 아랍 파트너들에게 투자할 때가 왔습니다."
 EGY_egypt_israel_pipeline: "이스라엘과의 협력"
 EGY_egypt_israel_pipeline_desc: "석유 부문에서 이스라엘과의 협력을 실제로 고려해 볼 수도 있습니다."
 EGY_find_oil: "더 많은 석유 발굴"
 EGY_find_oil_desc: "우리 땅에는 석유가 풍부합니다. 일부를 채굴해 보는 것은 어떨까요?"
 EGY_oil_prospects_idea1: "화석 연료 산업 보조금"
 EGY_oil_prospects_idea1_desc: "화석 연료 산업 보조금은 우리의 석유 산업이 국가의 필요에 맞게 더 적절하게 운영되도록 촉진하는 데 도움이 될 수 있습니다."
 EGY_saud_contr_oil: "사우디아라비아와의 계약"
 EGY_saud_contr_oil_desc: "사우디아라비아와의 협력은 우리에게 매우 이로울 수 있습니다."
 EGY_uae_contr_oil: "UAE와의 계약"
 EGY_uae_contr_oil_desc: "UAE와의 협력은 우리에게 매우 이로울 수 있습니다."
 EGY_iraq_contr_oil: "이라크와의 계약"
 EGY_iraq_contr_oil_desc: "이라크와의 협력은 우리에게 매우 이로울 수 있습니다."
 EGY_start_explor_proj: "탐사 사업 개시"
 EGY_start_explor_proj_desc: "우리나라의 석유 생산을 늘리려면 탐사 사업을 시작해야 합니다."
 EGY_apa_corp: "페트로브라스와의 계약"
 EGY_apa_corp_desc: "브라질 투자자들이 우리의 석유 저장고 건설에 투자하는 데 관심을 보였습니다. 이를 활용해야 합니다!"
 EGY_royal_dut_shell: "로열 더치 셸과의 계약"
 EGY_royal_dut_shell_desc: "영국 투자자들이 우리의 석유 저장고 건설에 투자하는 데 관심을 보였습니다. 이를 활용해야 합니다!"
 EGY_eil_oil: "EIL 오일 Ltd와의 계약"
 EGY_eil_oil_desc: "미국 투자자들이 우리의 석유 저장고 건설에 투자하는 데 관심을 보였습니다. 이를 활용해야 합니다!"
 EGY_bp_corp: "BP 코퍼레이션 지원"
 EGY_bp_corp_desc: "BP 코퍼레이션은 이집트의 국내 석유 회사입니다. 자립도를 높이기 위해 이들을 지원할 수 있습니다. 다만 건설에 더 많은 비용이 들 수 있습니다."
 EGY_orascom_construct: "오라스콤 건설"
 EGY_orascom_construct_desc: "오라스콤 건설 PLC는 이집트 카이로에 본사를 둔 설계·조달·시공(EPC) 계약 기업입니다. 이집트 최초의 다국적 기업이었으며 오라스콤 그룹 계열사의 핵심에 서 있습니다. OC는 25개국 이상에서 활동하고 있습니다."
 EGY_agricultural_issues: "농업 지원 노력"
 EGY_agricultural_issues_desc: "우리나라는 관개에 큰 문제를 안고 있습니다. 이를 해결하는 데 일정한 자금을 써야 합니다."
 EGY_euarsian_exports_food: "유라시아 식품 수출"
 EGY_euarsian_exports_food_desc: "유라시아 경제 연합은 날마다 확대되고 있습니다. 그 지역으로 무역을 확대하는 것이 우리에게도 이로울 수 있습니다."
 EGY_fighting_irrigation: "불법 관개 단속"
 EGY_fighting_irrigation_desc: "우리나라의 많은 농민이 앞으로의 수확 증가를 희생하면서까지 수확량을 늘리기 위해 지표 관개를 불법적으로 사용하고 있습니다. 이 관행을 중단시켜야 합니다."
 EGY_irrigation_problems: "관개 문제"
 EGY_allow_surface_idea: "지표 관개"
 EGY_allow_surface_desc: "지표 관개는 토지에 해롭지만, 우리 농민들은 당분간 이 시의적절한 해법이 필요할지도 모릅니다."
 EGY_ban_surface_idea: "대체 관개"
 EGY_ban_surface_desc: "장기적으로 이렇게 파괴적인 관행은 용납될 수 없으며, 농업 부문이 이를 달가워하지 않더라도 마찬가지입니다."
 EGY_second_nile_project: "제2 나일 프로젝트"
 EGY_second_nile_project_desc: "이집트 정부는 농업 및 산업 공동체가 발전할 새로운 계곡을 개발하기로 결정했습니다. 이는 이집트가 급속히 늘어나는 인구에 대처하도록 돕기 위한 야심 찬 프로젝트였습니다."
 EGY_ban_surface: "대체 관개"
 EGY_allow_surface: "지표 관개"
 EGY_visions: "신형 야간 조준경"
 EGY_visions_desc: "우리 군은 야간에 효과적으로 전투하려면 새로운 야간 투시 장비가 필요합니다."
 EGY_wests: "신형 방탄조끼와 위장복"
 EGY_wests_desc: "우리 군은 어떤 지형과 상황에서도 효과적으로 전쟁을 치르려면 새로운 방탄복과 위장복이 필요합니다."
 EGY_rifle_trainings: "무기 훈련"
 EGY_rifle_trainings_desc: "우리 병사들은 중동 전체에서 최고의 사격 실력을 갖추어야 합니다!"
 EGY_spec_weap: "신형 특수 무기"
 EGY_spec_weap_desc: "우리 군에는 병사들이 전장에서 다재다능하도록 새로운 현대식 무전기, 수류탄, 응급 처치 키트 등 많은 것이 필요합니다."
 EGY_academyy: "이집트 사관학교"
 EGY_academyy_desc: "중동 최고의 장군들을 보유하려면 새 군사 학교를 건설하고 장교 급여를 인상해야 합니다!"
 EGY_def: "신 방어 전술"
 EGY_def_desc: "적의 공격을 격퇴하기 위한 새로운 방어 전술과 전략을 발전시킬 필요가 있습니다."
 EGY_new_doc: "신 교리"
 EGY_new_doc_desc: "새로운 교리가 필요합니다. 기존 교리는 낡았습니다."
 EGY_NATO_doc: "나토 교리"
 EGY_NATO_doc_desc: "세계에서 가장 효과적인 군사 교리는 나토 교리이며, 우리는 이를 채택해야 합니다."
 EGY_new_centric_warf: "네트워크 중심전"
 EGY_new_centric_warf_desc: "네트워크 중심전은 미래이며, 우리는 이로부터 배워야 합니다."
 EGY_nato_standards_military_idea: "나토 표준"
 EGY_centric_doc_idea: "네트워크 중심전"
 EGY_impr_supply_idea: "개선된 보급"
 EGY_imp_suppl: "개선된 보급"
 EGY_imp_suppl_desc: "병력에 더 잘 보급하려면 통신 거점과 전반적인 군수 보급을 개선해야 합니다."
 EGY_shells: "신형 포탄"
 EGY_shells_desc: "우리 군에는 새로운 포탄이 필요합니다."
 EGY_new_army_eq: "무기 보급 확대"
 EGY_new_army_eq_desc: "군사 훈련을 통해 우리 군에 장비가 부족함이 드러났습니다. 이를 위해 옛 저장 시설을 개방하고 기존 생산 역량을 확대해야 합니다."
 EGY_abu_zabal: "아부 자발 특수 화학"
 EGY_abu_zabal_desc: "아부 자발 특수 화학은 폭약과 로켓 연료를 생산합니다."
 EGY_aoi_electro: "AOI 전자 공장"
 EGY_aoi_electro_desc: "AOI 전자 공장은 항공기, 미사일, 레이더용 전자 부품과 통신 장비를 생산합니다."
 EGY_heluan_tank_factory: "헬완 전차 공장"
 EGY_heluan_tank_factory_desc: "헬완 전차 공장은 미국제 M1A1 전차를 수리하고 생산합니다."
 EGY_maadi_engeneering_industry: "마아디 공학 산업"
 EGY_maadi_engeneering_industry_desc: "마아디 공학 산업은 권총, 소총, 기관총을 생산합니다."
 EGY_eae_tel_deal: "UAE 인터넷 거래"
 EGY_eae_tel_deal_desc: "UAE의 많은 인터넷 기업이 우리에게 투자하는 데 관심을 표명했습니다. 우리도 관심이 있다는 신호를 줘야 할지도 모릅니다."
 EGY_fight_cor: "부패와의 싸움"
 EGY_fight_cor_desc: "우리 군이 더 강해지려면 군 내부의 부패를 없애야 합니다."
 EGY_influ_army: "부패 장교와의 싸움"
 EGY_influ_army_desc: "군의 부패를 없애려면 부패한 장교들에게 압력을 가할 필요가 있습니다."
 EGY_new_rep_law: "법률 폐지"
 EGY_new_rep_law_desc: "군의 부패를 조장하는 일부 법률을 폐지할 필요가 있으며, 구체적으로는 병사들이 장성의 별장과 사업체 건설에 참여하는 것을 금지해야 합니다."
 EGY_soc_mil: "병사를 위한 사회적 보장"
 EGY_soc_mil_desc: "우리 병사들에게 사회 보장과 생활이 어려운 장교 가족을 위한 혜택을 제공해야 합니다."
 EGY_new_forb_mil: "군인의 사업체 소유 금지"
 EGY_new_forb_mil_desc: "군인이 군 업무에 집중할 수 있도록 사업체 소유를 금지해야 합니다."
 EGY_no_cor_army: "군에 부패는 없다!"
 EGY_no_cor_army_desc: "군의 부패를 없애야 합니다."
 EGY_fund_spez: "특수 부대 지원"
 EGY_fund_spez_desc: "군을 강화하려면 특수 부대에 투자해야 합니다."
 EGY_desert_corps: "사막 군단 편성"
 EGY_desert_corps_desc: "군을 강화하려면 사막 부대에 투자해야 합니다."
 EGY_acilm: "더위 적응"
 EGY_acilm_desc: "특수 부대가 사막에서 효과적으로 작전할 수 있도록 사막의 극심한 더위에 대비시켜야 합니다."
 EGY_masters_ambush: "위장과 매복의 달인"
 EGY_masters_ambush_desc: "매복과 위장 전술에 더 많은 관심을 기울여야 합니다."
 EGY_extr_trai: "극한 훈련"
 EGY_extr_trai_desc: "특수 부대의 극한 훈련이 최우선이어야 합니다!"
 EGY_777: "777 특수임무부대"
 EGY_777_desc: "777 부대는 777 특수임무부대로도 알려져 있으며, 엘사카 부대에 속한 이집트 육군의 1급 특수 부대입니다."
 EGY_fund_police: "경찰 지원"
 EGY_fund_police_desc: "시민과 관광객의 안전을 보장하려면 강력하고 인원이 많으며 훈련된 경찰력이 필요합니다."
 EGY_fight_narco: "마약 조직과의 싸움"
 EGY_fight_narco_desc: "우리나라의 더 큰 안정을 위해 마약과 마약 밀매와 싸워야 합니다."
 EGY_tour_pol: "관광 경찰"
 EGY_tour_pol_desc: "관광객에게 편안한 환경을 조성하고 사기꾼으로부터 보호하며 의사소통을 돕기 위해 관광 경찰을 창설할 필요가 있습니다."
 EGY_new_eq: "신형 장비"
 EGY_new_eq_desc: "경찰에는 새로운 경찰봉, 섬광탄, 수갑을 비롯해 제복과 신발까지 많은 새 장비가 필요합니다."
 EGY_border_guard: "국경 수비대"
 EGY_border_guard_desc: "국경 수비대는 대부분 베두인으로 구성된 경무장 준군사 부대로, 국경 감시, 치안 유지, 마약 단속, 밀수 방지를 담당합니다."
 EGY_al_nour: "알누르"
 EGY_al_nour_desc: "알누르 당, 즉 빛의 당은 엄격한 샤리아 법의 시행을 믿는 극보수적 이슬람주의 이념을 지니고 있습니다. 살라피 호소회의 정치 조직으로 묘사되며, 이집트의 여러 새로운 살라피 정당 중 단연 가장 두드러지는데, 오랜 조직 및 행정 경험과 카리스마 있는 지도자 덕분에 다른 정당들을 앞질렀습니다. 정치적 목표는 사우디아라비아처럼 와하비즘 노선의 신정 국가를 수립하는 것입니다. 독일 공영 텔레비전 뉴스 서비스 ARD에 따르면 사우디아라비아가 이 정당의 주요 자금 제공자로 밝혀졌습니다."
 EGY_makhioun: "유네스 마키운"
 EGY_makhioun_desc: "자카리아 유네스 압델할림 마키운은 이집트의 국회의원으로, 현재 살라피스트 알누르 당의 당수입니다."
 EGY_theocrat_gov: "신정 정부"
 EGY_theocrat_gov_desc: "오직 자카리아 유네스 압델할림 마키운의 신정 통치만이 우리나라를 번영으로 이끌 수 있습니다."
 EGY_ban_imf: "IMF 탈퇴"
 EGY_ban_imf_desc: "IMF는 도둑들의 조직입니다! 이 쓰레기 같은 곳에서 최대한 빨리 탈퇴해야 합니다!"
 EGY_sharia_laws_sal: "샤리아 법"
 EGY_sharia_laws_sal_desc: "살라피 샤리아 법은 초기 무슬림 공동체의 원칙과 관행에 기반한 이슬람 법학의 엄격한 해석으로, 꾸란과 하디스를 철저히 따르는 것을 목표로 하며 보수적인 사회 규범과 관행을 자주 강조합니다."
 EGY_no_football: "축구 금지"
 EGY_no_football_desc: "월드컵을 시청하는 무슬림은 시간을 낭비하고 있으며, 이는 그들이 지하드를 수행하는 것을 방해합니다. 메시는 이슬람의 적입니다. 카타르는 월드컵을 개최하는 대신 이란처럼 핵폭탄을 만들었어야 합니다!"
 EGY_saudi_example: "사우디의 본보기"
 EGY_saudi_example_desc: "사우디아라비아는 살라피즘 사상의 힘을 보여 주는 최고의 본보기입니다! 그들의 본보기를 염두에 두고 우리나라를 건설해야 합니다."
 EGY_saudi_meet: "[SAU.GetAdjective] 정부와 회담"
 EGY_saudi_meet_desc: "사우디 형제들과 강력한 유대를 구축해야 합니다!"
 EGY_saudi_egy_oil_deal: "[SAU.GetAdjective]-[EGY.GetAdjective] 석유 거래"
 EGY_saudi_egy_oil_deal_desc: "우리와 사우디아라비아 간의 상호 협력은 양측 모두에 많은 이익을 가져다줄 것입니다."
 EGY_war_with_israel: "[ISR.GetName]와(과)의 전쟁"
 EGY_war_with_israel_desc: "이스라엘은 모든 무슬림의 궁극적인 적입니다. 우리는 이스라엘을 분쇄해야 합니다!"
 EGY_support_hamas: "하마스 지원"
 EGY_support_hamas_desc: "무슬림 형제단과의 관계가 그리 좋지는 않지만, 하마스를 지원하는 것은 우리의 의무입니다."
 EGY_jihadi_supp: "지하드 단체 자금 지원"
 EGY_jihadi_supp_desc: "무슬림 세계 곳곳의 많은 젊은이가 우리의 대의를 위해 싸우기를 열망하고 있습니다. 이를 활용해야 합니다."
 EGY_harsh_copt_supp: "콥트 탄압"
 EGY_harsh_copt_supp_desc: "우리나라의 기독교도들은 너무 떠들어 댑니다. 그들의 입을 막아야 합니다."
 EGY_reform_sibsid_sys: "[EGY.GetAdjective] 농본주의"
 EGY_reform_sibsid_sys_desc: "우리 사회는 꾸란의 원칙 위에 세워져야 합니다. 그래야만 최선의 삶의 방식을 이룰 수 있습니다!"
 EGY_al_azhar_uni: "알아즈하르 대학교"
 EGY_al_azhar_uni_desc: "알아즈하르 대학교는 이집트 카이로에 있는 공립 대학교입니다. 이슬람 카이로의 알아즈하르 알샤리프와 연관되어 있으며, 이집트에서 가장 오래된 학위 수여 대학교이자 이슬람 학문의 가장 권위 있는 대학교 중 하나로 알려져 있습니다."
 EGY_islamic_reform_educ: "교육의 이슬람적 개혁"
 EGY_islamic_reform_educ_desc: "이슬람의 가르침에 따라 교육을 개혁해야 합니다."
 EGY_sukuk_advisors: "수쿠크 고문"
 EGY_sukuk_advisors_desc: "수쿠크는 금융 증서를 가리키는 아랍어 명칭으로, 흔히 샤리아 준수 채권이라고도 합니다."
 EGY_support_taliban: "탈레반 지원"
 EGY_support_taliban_desc: "탈레반은 이교도 서방과의 투쟁에서 우리의 동맹입니다. 그들을 지원해야 합니다!"
 EGY_clear_antiisl_oppos: "반이슬람 야권 소탕"
 EGY_clear_antiisl_oppos_desc: "많은 정당과 운동이 우리의 통치를 지지하지 않습니다... 우리는 이에 대해 무언가 해야 합니다."
 EGY_new_cairo_mosque: "신카이로의 새 모스크"
 EGY_new_cairo_mosque_desc: "참된 이슬람 국가 건설이라는 과업에 대한 우리의 헌신을 보여 주기 위해 카이로에 새 모스크를 지어야 합니다."
 EGY_help_sahara: "우리의 사하라 벗들"
 EGY_help_sahara_desc: "우리는 범아랍주의 대의를 지지하는 많은 운동과 접촉하고 있으며, 그중 하나가 서사하라 민중의 해방을 추구하는 폴리사리오 전선입니다. 지난 수십 년간 폴리사리오는 식민 지배에 이어 모로코의 억압에 맞서 싸웠고, 지금 이 전선은 서사하라의 작은 지역만 통제하고 있습니다. 현재 분쟁은 동결되어 있지만, 우리 벗들에게 군사 원조를 보내고 사하라위들이 투쟁을 계속하는 데 필요한 모든 것을 갖춰 줌으로써 이를 바꿀 수 있습니다."
