 nsb_gun_technology_6: "Sistemas de artillería y armas pesadas de 6.ª gen."
 nsb_gun_technology_6_desc: "Potentes sistemas de artillería y cohetes diseñados para mejorar la potencia de fuego en el campo de batalla. Este avance introduce obuses pesados, armamento de cohetes a gran escala y munición de artillería especializada para una mayor capacidad destructiva. Además, permite el despliegue de contenedores de cohetes, proporcionando a las plataformas aéreas un mayor potencial de ataque. Estos sistemas ofrecen un soporte superior de largo alcance, lo que los hace esenciales para dominar el campo de batalla."
 nsb_artillery_ammo_6: "Munición de artillería de 5.ª gen."
 nsb_artillery_ammo_6_desc: "Munición especializada diseñada para su uso en armas de gran calibre como obuses, cañones de campaña y artillería autopropulsada. Se presenta en varios tipos, cada uno adaptado a funciones específicas en el campo de batalla, incluidos proyectiles de alto explosivo para un impacto destructivo, proyectiles perforantes para penetrar objetivos fortificados y proyectiles de humo o iluminación para apoyo táctico."
 nsb_special_ammo_4: "Modernización integrada de municiones"
 nsb_special_ammo_4_desc: "Integración a gran escala de ojivas adaptativas de próxima generación, municiones modulares y sistemas explosivos de alto impacto."
 nsb_special_ammo_5: "Modernización de municiones de 5.ª gen."
 nsb_special_ammo_5_desc: "Integración a gran escala de ojivas adaptativas de próxima generación, municiones modulares y sistemas explosivos de alto impacto."
