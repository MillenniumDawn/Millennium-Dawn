 CPD_demanding_annexation_of_state_TT: "Aneksja tego państwa jest §Gżądaniem§! [ROOT.GetNameWithFlag]. Jeżeli dojdzie do pokoju, to państwo zostanie włączone w nasze tereny, a my zostaniemy jego nowym władcą."
 CPD_demanding_puppeting_in_state_TT: "Utworzenie marionetki na tym terenie jest §Gżądaniem§! [ROOT.GetNameWithFlag]. Jeżeli dojdzie do pokoju, to terytorium znajdzie się pod kontrolą nowego rządu marionetkowego."
 CPD_demanding_demilitarisation_of_state_TT: "Demilitaryzacja tego regionu jest §Gżądaniem§! [ROOT.GetNameWithFlag]. Jeżeli dojdzie do pokoju, to terytorium nie będzie więcej w stanie zarządzać jakimikolwiek siłami militarnymi."
 CPD_demanding_liberation_of_state_TT: "Wyzwolenie tego państwa jest  §Gżądaniem§! [ROOT.GetNameWithFlag]. Jeśli warunki pokoju zostaną przyjęte, terytorium to zostanie zwrócone państwu, któremu prawnie przysługuje, jako niepodległy kraj."
 CPD_conceding_annexation_of_state_TT: "Aneksja tego państwa jest §R ustępstwem §! ze strony [ROOT.GetNameWithFlag]. Jeśli warunki pokoju zostaną przyjęte, państwo to zostanie włączone do terytorium wroga."
 CPD_conceding_puppeting_in_state_TT: "Uformowanie marionetki w tym stanie to §Rustępstwo§! ze strony [ROOT.GetNameWithFlag]. Jeśli pokój zostanie przyjęty, państwo to znajdzie się pod rządami marionetkowego gabinetu, podporządkowanego wrogowi."
 CPD_conceding_demilitarisation_of_state_TT: "Demilitaryzacja tego stanu to §Rustępstwo§! ze strony [ROOT.GetNameWithFlag]. Jeśli pokój zostanie przyjęty, państwo to nie będzie już mogło utrzymywać żadnych sił zbrojnych."
 CPD_conceding_liberation_of_state_TT: "Wyzwolenie w tym stanie to §Rustępstwo§! ze strony [ROOT.GetNameWithFlag]. Jeśli warunki pokoju zostaną przyjęte, terytorium to zostanie zwrócone państwu, któremu prawnie przysługuje, jako niepodległy kraj."
