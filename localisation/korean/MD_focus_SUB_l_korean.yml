 KHM_reunifcation_category: "러시아의 후계자"
 KHM_reunifcation_category_desc: "\n\n\n\n£SOV_desctext_khmao \n\n\n\n\n\n[SOV.GetFlag]§Y러시아§!는 §R무너졌습니다§!. 나라는 힘과 권위를 잃었고 중앙 정부는 스스로의 신뢰를 실추시켰습니다. 지역들은 혼돈에 빠져 있으며, 이 광기를 멈출 사람들이 필요합니다. 그들은 [KHM.GetFlag]§Y러시아§!를 부활시키고 우리의 §Y조국§!을 되살리는 존재가 되어야 합니다."
