name: Validator impact report

# Trusted workflow_run bridge for PR-code impact results.
# It executes default-branch tooling and never checks out PR content.
# Bootstrap caveat: bridge activates after this workflow reaches default branch.

on:
  workflow_run:
    workflows: [Validator impact]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: write

jobs:
  report:
    name: Report impact scan results
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    steps:
      - name: Checkout reporting tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      # Missing or stale results fail closed and never clear a failure.
      - name: Report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 tools/impact_report.py
          --workflow-run-json "$GITHUB_EVENT_PATH"
          --results-dir impact-results
          --download-dir impact-download
          --output impact-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validator-impact-report
          path: impact-report.md
          if-no-files-found: error
          retention-days: 7
