l_korean:
 ARM_Kocharjan: "The Era of Kocharyan"
 ARM_Kocharjan_desc: "After his predecessor Levon Ter-Petrosyan was ousted as President, Kocharyan was elected as Armenia's second President, defeating his main rival, Karen Demirchyan (who was a former leader of Soviet Armenia), in an early presidential election marred by irregularities and violations by both sides as reported by international electoral observers."
 ARM_manifestation_power: "정치력의 과시"
 ARM_manifestation_power_desc: "국가 통치에서 우리의 역할이 흔들리지 않을 것임을 입증하기 위해, 우리는 의지를 보이고 국가 기구를 굴복시켜야 합니다."
 ARM_place_agreement: "자리 협약"
 ARM_place_agreement_desc: "코차랸의 국가 장악력을 강화하기 위해, 우리는 지역 정치인, 관료, 그리고 일부 선별된 의원들과 은밀히 협상해야 합니다."
 ARM_confrontation_mafia: "마피아와의 대결"
 ARM_confrontation_mafia_desc: "러시아 범죄 조직과 다수의 연줄을 가진 아르메니아 마피아는 아르메니아 내부 사정에 너무 큰 영향력을 행사하고 있습니다. 이를 바꾸어야 합니다."
 ARM_liquidation_bosses: "두목 제거"
 ARM_liquidation_bosses_desc: "마피아는 약해졌습니다. 정의의 결정적 일격으로 용의 머리를 벨 때가 왔습니다."
 ARM_installing_loyal: "측근 앉히기"
 ARM_installing_loyal_desc: "단기적으로는 비용이 들지만, 코차랸의 장악력을 강화하려면 국가 기구에서 반대파를 숙청해야 합니다. 그들과 협상할 여지는 없습니다."
 ARM_suppress_opposition: "야당 탄압"
 ARM_suppress_opposition_desc: "아르메니아에 대한 외부의 영향으로 야권이 지나치게 활발해졌습니다. 강경한 조치와 적절히 선택된 몇 건의 체포로 그들의 기세를 꺾을 때입니다."
 ARM_deals_with_bandits: "마피아와의 거래"
 ARM_deals_with_bandits_desc: "아르메니아의 범죄 집단은 날뛰며 체계적으로 법을 어기는 경향이 있지만, 아르메니아 내부 사정에 폭넓은 영향력을 행사하고 있습니다. 어쩌면 그들과 싸우지 말고, 도적질을 종속시켜 우리에게 이익이 되도록 만드는 편이 나을 것입니다."
 ARM_domination_over_bandits: "도적 집단 지배"
 ARM_domination_over_bandits_desc: "도적들과 협상하기로 했지만, 그들에게 지나치게 큰 힘을 주어서는 안 됩니다. 코차랸은 그들에 대한 통제권을 확립해야 합니다."
 ARM_autocrats_power: "독재 권력"
 ARM_autocrats_power_desc: "마침내 코차랸은 정치 무대에서 장애물이 없어졌습니다."
 ARM_Zhirayr_Sefilyan: "민족민주 구심점"
 ARM_Zhirayr_Sefilyan_desc: "지라이르 세필리안은 아르메니아의 군 지휘관이자 정치 활동가입니다. 제1차 나고르노카라바흐 전쟁 당시 수시 특수 군사 대대를 지휘했습니다. 그는 나고르노카라바흐에서 아제르바이잔에 대한 어떠한 영토 양보에도, 그리고 아르메니아 내 러시아의 영향력에도 오랫동안 반대하는 운동을 벌여 왔습니다. 세필리안은 사스나 츠레르 범아르메니아 당의 핵심 인물 중 하나입니다."
 ARM_protectorate: "캅카스의 보루"
 ARM_protectorate_desc: "NATO는 러시아에 한 걸음씩 더 다가가려 안달이 나 있으며, 이미 튀르키예가 있다지만 우리는 그들을 더 가까이 데려갈 수 있습니다. 물론 우리의 조건은 NATO 회원국들이 우리의 국가 독립을 보장하는 것입니다."
 ARM_mobilization_of_economy: "경제 동원"
 ARM_mobilization_of_economy_desc: "나라를 새로 재건하려면 경제를 동원하고 우리의 얼마 되지 않는 자원을 모두 활용하여 경제 지표를 세 배로 높여야 합니다."
 ARM_army: "새로운 시대의 군대"
 ARM_army_desc: "아르차흐 전쟁이 끝난 뒤, 스스로를 입증했던 아르메니아군은 소련 붕괴 이후부터 시작된 상당한 쇠퇴를 겪었습니다. 소련의 유산과 대규모 민병대 덕분에 아르메니아인들은 아제르바이잔을 물리치고 지역에서 위태로운 균형을 이룰 수 있었습니다. 낡은 교리와 구식 무기, 경직된 장군들, 그리고 경제 문제가 군의 발전에 종지부를 찍었습니다. 주된 발전 방향은 러시아, 그리고 CSTO의 다른 이웃 및 파트너들과의 협력을 지속하는 것입니다. 그러나 일부 군사 전문가들은 군 교리와 군대 구조를 서방식으로 완전히 개편해야 한다고 주장합니다. 외교적으로 유리한 위치에 있는 아르메니아는 각 진영에서 최선의 것을 취하거나, 특정 세력과 협력하는 명확한 노선을 택할 수 있습니다. 상당한 자원이 없더라도 아르메니아는 우선순위를 올바르게 배분한다면 큰 잠재력을 가지고 있습니다."
 ARM_dashnak: "다슈나크추툰"
 ARM_dashnak_desc: "아르메니아를 통치할 권리가 있는 유일한 정치 세력은 의심의 여지 없이, 아르메니아 제1공화국을 요람에서부터 이끈 아르메니아에서 가장 오래된 정당인 다슈나크추툰입니다. 오직 그들의 좌익 민족주의 노선만이 아르메니아를 위대함으로 이끌 수 있습니다."
 ARM_monarch: "군주제 복고"
 ARM_monarch_desc: "군인, 정당, 혹은 그 어떤 인물도 나라를 통치할 권리가 없습니다. 가장 정통성 있는 통치자는 가부장적 접근으로 아르메니아를 위대함으로 이끌 수 있는 군주뿐입니다."
 ARM_Tsarukyan: "차루키안"
 ARM_Tsarukyan_desc: "가기크 차루키안은 아르메니아의 사업가이자 정치인이며 전직 운동선수입니다. 차루키안은 번영 아르메니아당의 창당자이자 당수입니다. 그는 여러 대규모 기업도 소유하고 있으며 아르메니아에서 가장 부유한 인물 중 한 명으로 알려져 있습니다."
 ARM_patriotism: "애국주의"
 ARM_patriotism_desc: "아르메니아의 애국심은 추상적입니다. 많은 이들이 구름 속에서, 신비로운 안개 속에서 조국을 찾고 있지만, 조국은 우리와 이토록 가까이 있으며 우리의 관심과 헌신, 찬미를 몹시 필요로 합니다. 많은 이에게 아르메니아는 하나의 관념이자 망각이며, 시온이자 제단일 뿐입니다. 아르메니아에는 구체적이고 살아 있는 애국심이 필요합니다. 조국은 사람을 위해 있는 것이지, 사람이 조국을 위해 있는 것이 아닙니다."
 ARM_berkut: "우리의 베르쿠트는 어디에 있는가?"
 ARM_berkut_desc: "아르메니아의 민간 경비 업체 베르쿠트는 놀랍게도 늘 전직 범죄 조직원과 전직 군인으로 구성된 중무장 부대였습니다. 이를 국가 차원으로 끌어올릴 만한 가치가 있을지도 모릅니다."
 ARM_remove_competitors: "경쟁자 제거"
 ARM_remove_competitors_desc: "아르메니아에서 사업을 할 수 있는 사람은 오직 차루키안뿐입니다. 이곳은 그의 영역이며, 다른 올리가르히들은 복종하거나 아니면 대가를 치러야 합니다."
 ARM_hard_way: "험난한 길"
 ARM_hard_way_desc: "새 정부에 복종하지 않으려는 자가 있다면, 우리가 복종하게 만들 것입니다. 말을 듣지 않는 반대파의 사업을 빼앗는 험난한 길을 걸어야 합니다."
 ARM_Group: "멀티의 정부"
 ARM_Group_desc: "멀티 그룹 콘체른은 1998년 가기크 차루키안의 주도로 설립되었습니다. 콘체른이 창설되고 수많은 대기업이 참여하게 된 2001년부터 발전 과정과 활발한 활동이 시작되었습니다. 이 콘체른은 아르메니아 최대 납세자 명단에서 꾸준히 10위권에 듭니다."
 ARM_buy_small_business: "소규모 사업체 매수"
 ARM_buy_small_business_desc: "중산층 투기꾼들의 손에서 모든 소규모 사업체를 사들여야 합니다. 기업 지배 체제를 이루려면 이 조치를 취해야 합니다."
 ARM_sports_promotion: "스포츠 육성"
 ARM_sports_promotion_desc: "스포츠를 발전시키고 가능한 모든 곳에서 장려해야 합니다!"
 ARM_pooling_capital: "자본 결집"
 ARM_pooling_capital_desc: "모든 자본을 하나로 합쳐 큰 이익을 거둘 때입니다."
 ARM_savoya: "사보이아 가문"
 ARM_savoya_desc: "아르메니아의 마지막 왕가는 뤼지냥 가문이었습니다. 1375년 킬리키아 왕국이 멸망했을 때, 마지막 왕 레본 6세(레오 6세)는 아르메니아 왕의 칭호를 같은 뤼지냥 가문 출신인 키프로스 왕 자크 1세(하코프 1세)에게 넘겼습니다. 1485년 샬롯 여왕은 그 칭호를 사촌인 사보이아 공작(이탈리아) 용감왕 카를로에게 넘겼습니다."
 ARM_monopoly: "완전한 기업 지배 체제"
 ARM_monopoly_desc: "이제 멀티 그룹이 모든 정부 조직을 통제해야 합니다. 정말 훌륭한 생각입니다!"
 ARM_bagratuni: "바그라투니 왕위 계승 주장자?"
 ARM_bagratuni_desc: "바그라투니 왕조, 또는 바그라티드 왕조는 중세 아르메니아 왕국을 통치한 아르메니아의 왕조입니다. 고대 아르메니아 왕국의 가신으로 시작한 이들은 아르메니아에 대한 아랍 통치 시기에 가장 저명한 아르메니아 귀족 가문으로 성장했으며, 마침내 독자적인 왕국을 세웠습니다. 이들은 또한 조지아 왕가인 바그라티오니 왕조의 시조이기도 합니다. 그러나 롤란트 폰 바그라투니는 바그라투니 왕조의 후손임을 완전히 입증하지 못했으며, 이는 멜리크 연합 구성원들에게 많은 우려를 안겨줍니다."
 ARM_triump_revolution_barhat: "벨벳 혁명의 승리"
 arme.51.d: "[GEO.GetNameWithFlag]은(는) 우호 통상 협정에 서명하자는 우리의 외교적 제안을 승인했습니다."
 arme.51.t: "[GEO.GetNameWithFlag]의 수락!"
 arme.51.a: "Wonderful!"
 arme.52.t: "[GEO.GetNameWithFlag]의 거절!"
 arme.52.d: "[GEO.GetNameWithFlag]은(는) 우리의 우호 통상 제안을 거절했습니다."
 arme.52.a: "We must abandon our attempts to befriend Georgia."
 arme.53.t: "[ARM.GetNameWithFlag]의 흑해 접근 요청!"
 arme.53.d: "최근 아르메니아 정부는 흑해 접근권에 대한 대가를 지불할 의사를 보였습니다. 그들의 제안에 동의하시겠습니까?"
 arme.53.a: "Yes, sure!"
 arme.53.b: "아니, 꺼져라."
 arme.2.t: "나고르노카라바흐 대통령 암살 시도"
 arme.2.d: "아르카디 구카샨에 대한 암살 시도는 모든 사람이 그의 정책을 받아들이는 것은 아님을 보여주었습니다. 새벽 한 시경, 관저에서 불과 200미터 떨어진 곳에 마련된 매복지에서 대통령의 차량에 총격이 가해졌습니다. 테러범들은 양쪽에서 동시에 십자포화를 퍼부었습니다. 구카샨은 다리에 부상을 입었고 경호원 두 명이 중상을 입었습니다."
 arme.2.a: "끔찍하다!"
 arme.2.b: "캅카스식 결판."
 arme.2.c: "비적 행위를 끝내야 한다."
 arme.2.o1: "그가 죽지 않은 것이 안타깝다!"
 arme.3.t: "트랜스카프카스 공산주의자들의 \\"붉은 다리\\" 연합"
 arme.3.d: "토요일, 아제르바이잔, 아르메니아, 조지아의 공산주의자들이 다시 연합했습니다. 세 공화국의 국경이 만나는 붉은 다리에서 열린 트랜스카프카스 공산당 최고 지도부 회담에서 아르메니아-아제르바이잔-조지아 공산주의 시민 단체 \\"붉은 다리 - 형제애와 우정\\"의 창설에 관한 의정서가 서명되었습니다. 국가들 사이에는 모순이 없으며 따라서 공산주의자들이야말로 이 지역의 모든 갈등을 해결할 수 있는 유일한 세력이라고 게오르가제 동지는 말했습니다."
 arme.3.a: "공산주의자들이 무언가를 꾸미고 있다."
 arme.3.b: "지난 세기의 관성이다."
 arme.3.c: "그들은 시간을 낭비하고 있다."
 arme.3.o1: "그들은 무엇을 바라는 것인가?"
 arme.5.t: "조사 결과"
 arme.5.d: "조사관들은 공격의 진짜 배후를 찾을 수 없으며, 모든 증거는 어떤 식으로든 우리, 혹은 다슈나크추툰당의 전직 당원들로 이어집니다. 어떤 경우든, 이 보여주기식 사건이 너무 커지기 전에 종결해야 합니다. 그렇다면 보고서에는 무엇을 쓸 것인가?"
 arme.5.a: "그냥 사건을 종결하라."
 arme.5.b: "어... 다슈나크 탓으로 돌리자!"
 arme.9.t: "북부 대로 사업"
 arme.9.d: "북부 대로는 투자를 유치하고 어쩌면 막대한 수입을 얻기 위해 건설해야 하는 보행자 대로 사업입니다. 그러나 문제는 낡은 건물들과 그 주민들을 어떻게 할 것인가 하는 점입니다."
 arme.9.a: "손실을 부분적으로 보상한다"
 arme.9.b: "손실을 전액 보상한다"
 arme.50.t: "[ARM.GetNameWithFlag]의 무역 협정 제안!"
 arme.50.d: "[ARM.GetNameWithFlag]은(는) 최근 양국 간 우호 통상 협정을 제안했습니다. 그들의 제안에 동의하시겠습니까?"
 arme.10.t: "부채 대신 자산 협정"
 arme.10.d: "아르메니아는 우리가 국가 부채를 탕감해 주는 대가로 자산을 제공하는 데 동의했습니다. 아르메니아는 향후 압박을 위해 우리가 국가 부채를 탕감해 주지 않은 유일한 국가였으며, 이것이 효과를 발휘했습니다."
 arme.10.a: "훌륭하다!"
 arme.101.t: "[PER.GetNameWithFlag]의 동의!"
 arme.101.d: "비밀 방위 협정이 체결되었습니다."
 arme.101.a: "좋군!"
 arme.102.t: "[PER.GetNameWithFlag]의 거부!"
 arme.102.d: "비밀 방위 협정은 체결되지 않았습니다."
 arme.102.a: "으음..."
 arme.103.t: "쿠르디스탄의 반란"
 arme.103.d: "쿠르드인들이 우리나라 영토 내 그들의 거주 지역에서 반란을 일으켰으며, 분명 외국의 누군가가 이들을 도왔습니다. 우리 정보부는 이것이 아르메니아 특수 기관들의 활동이라고 보고합니다."
 arme.103.a: "아르메니아가 대가를 치르게 될 것이다"
 arme.12.t: "과두 세력과의 접촉"
 arme.12.d: "정부와 과두 세력 사이의 논의가 이루어지는 다음 회의에서, 가기크 차루캰은 정당 간 비공식 연립을 구성하여 야권에 대한 통제권을 확립하도록 돕겠다고 제안했습니다."
 arme.12.a: "물론이지!"
 arme.13.t: "야권 약화!"
 arme.13.d: "야당 조직과 불충한 관료들이 우리나라에서 숙청되어 야권이 심각하게 약화되었으며, 이는 우리 상황에서 매우 유용합니다. 코차랸의 치세는 당분간 연장됩니다."
 arme.13.a: "아주 좋다."
 arme.131.t: "[USA.GetNameWithFlag]의 동의!"
 arme.131.d: "[USA.GetNameWithFlag] 정부가 우리가 충분히 준비되었다고 확신했기에 우리는 지급을 받을 수 있었습니다"
 arme.131.a: "좋다"
 arme.132.t: "우리 제안을 거절한 [USA.GetNameWithFlag]"
 arme.132.d: "우리 정부는 [USA.GetNameWithFlag]의 동의를 얻는 데 필요한 모든 개혁을 이행하지 못했습니다"
 arme.132.a: "별로군"
 arme.14.d: "최근 아르메니아의 로베르트 코차랸 대통령이 연방 국가 사업에 참여하여 우리 및 다른 회원국들과 통합하기로 결정했습니다!"
 arme.14.a: "훌륭하다!"
 arme.14.t: "[ARM.GetNameWithFlag], §G연방 국가§!에 가입!"
 arme.4.t: "1999년 공격 조사"
 arme.4.a: "그래, 물론이지..."
 ARM_develop_infrusture: "고속도로 집중 건설"
 ARM_build_house: "신축 건물 집중 건설"
 ARM_build_factory: "건설 산업 돌격 추진"
 AZE_karabakh_defeat: "카라바흐 전쟁의 패배"
 AZE_karabakh_defeat_desc: "90년대 전쟁의 패배는 우리 민족에게 쓰라린 상처였습니다. 아제르바이잔인들은 역사적 영토를 되찾고 수천 명의 난민을 고향으로 돌려보내기 위해 복수를 갈망하고 있습니다."
 AZE_karabakh_revanchism: "카라바흐 보복주의"
 AZE_karabakh_revanchism_desc: "막대한 국제적 지원을 받고도 아르차흐 전쟁에서 패한 아제르바이잔 국민은 국제 무대에서 굴욕을 당한 채 남았고, 실패에 눈이 먼 국민은 점점 더 민족주의와 군 입대로 기울고 있습니다."
 ARM_high_emigration_5: "Huge Level of Emigration"
 ARM_high_emigration_5_desc: "With the collapse of the USSR and the deteriorating economic situation, many CIS countries became hostages of increased external migration. In today's realities, Armenia is threatened with extinction, which cannot be said about its eastern neighbor and main political enemy. The solution of the demographic issue should become the main agenda of Armenian politics.\n§W--------------§!\nThis national spirit will §GImprove§! if our §HGDP§! exceeds §H$20B§! and stability is at least §H15%§!."
 ARM_high_emigration_4: "Substantial Level of Emigration"
 ARM_high_emigration_4_desc: "With the collapse of the USSR and the deteriorating economic situation, many CIS countries became hostages of increased external migration. In today's realities, Armenia is threatened with extinction, which cannot be said about its eastern neighbor and main political enemy. The solution of the demographic issue should become the main agenda of Armenian politics.\n§W--------------§!\nThis national spirit will §GImprove§! if our §HGDP§! exceeds §H$30B§! and stability is at least §H24%§!."
 ARM_high_emigration_3: "High Level of Emigration"
 ARM_high_emigration_3_desc: "With the collapse of the USSR and the deteriorating economic situation, many CIS countries became hostages of increased external migration. In today's realities, Armenia is threatened with extinction, which cannot be said about its eastern neighbor and main political enemy. The solution of the demographic issue should become the main agenda of Armenian politics.\n§W--------------§!\nThis national spirit will §GImprove§! if our §HGDP§! exceeds §H$40B§! and stability is at least §H24%§!."
 ARM_high_emigration_2: "Low Level of Emigration"
 ARM_high_emigration_2_desc: "With the collapse of the USSR and the deteriorating economic situation, many CIS countries became hostages of increased external migration. In today's realities, Armenia is threatened with extinction, which cannot be said about its eastern neighbor and main political enemy. The solution of the demographic issue should become the main agenda of Armenian politics.\n§W--------------§!\nThis national spirit will §GImprove§! if our §HGDP§! exceeds §H$50B§! and stability is at least §H34%§!."
 ARM_high_emigration_1: "Small Emigration"
 ARM_high_emigration_1_desc: "With the collapse of the USSR and the deteriorating economic situation, many CIS countries became hostages of increased external migration. In today's realities, Armenia is threatened with extinction, which cannot be said about its eastern neighbor and main political enemy. The solution of the demographic issue should become the main agenda of Armenian politics.\n§W--------------§!\nThis national spirit will §GImprove§! if our §HGDP§! exceeds §H$60B§! and stability is at least §H44%§!."
 ARM_immigration: "Positive Immigration"
 ARM_victory_karabakh: "Victory in the Karabakh War"
 ARM_victory_karabakh_desc: "The victory in the Karabakh war raised the national feelings of the Armenians, and also allowed many people from Artsakh to occupy high positions in Armenian government. Meanwhile, it took away the motivation for further military and political development.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §HEra of Peace Agenda§! focus."
 ARM_armenian_mafia_6: "아르메니아 마피아"
 ARM_armenian_mafia_4: "손실을 입은 마피아"
 ARM_armenian_mafia_3: "마피아와의 거래"
 ARM_armenian_mafia_2: "Domination Over Mafia"
 ARM_mafia_strikes_back: "마피아의 반격"
 ARM_loyal_in_power: "\\"우리\\" 사람들을 요직에"
 ARM_loyal_in_power_desc: "이제 지방 당국은 코차랸의 통제 아래에 있습니다. 그러나 정치력을 위해 부패와의 싸움은 점점 불가능해지고 있습니다.\n§W--------------§!\n로베르트 코차랸이 더 이상 우리의 지도자가 아니면 이 국가 정신은 §R제거§!됩니다."
 ARM_deals_with_bandits_3: "비적과의 거래"
 ARM_deals_with_bandits_3_desc: "우리는 마피아와 싸우는 대신 관계를 구축하고, 소규모 사업체에 대한 압박을 줄이며, 대규모 자금 흐름을 통제하기 시작할 것입니다."
 ARM_deals_with_bandits_2: "비적에 대한 지배"
 ARM_deals_with_bandits_2_desc: "이제 마피아는 우리에게 맞설 수 없을 것입니다. 우리는 국내 자금 순환을 통제하며, 이는 과두 지배층에 대해 모든 영향력의 지렛대를 사용할 기회를 줍니다."
 ARM_deals_with_bandits_1: "세력권 분리"
 ARM_deals_with_bandits_1_desc: "우리는 아르메니아 마피아의 두목들과 세력권을 나누었습니다. 우리는 비적들이 계속 존재하도록 놔두었지만, 내부의 적을 제거했습니다."
 ARM_scince_poten_idea: "과학 잠재력"
 ARM_gaz_energy_problems: "가스 및 전력 공급 문제"
 ARM_unistrim_idea_debuf: "거래 시스템의 부재"
 ARM_unistrim_idea_debuf_desc: "소련과 그 경제 및 운송 연결망이 붕괴한 뒤 디지털 발전의 시대에도 아르메니아는 무현금 송금 시스템 없이 세계 무역의 변방에 머물러 있습니다.\n§W--------------§!\n§H아르메니안 카드§! 중점을 완료하면 이 국가 정신은 §R제거§!됩니다."
 eastern_church_arm: "아르메니아 사도 교회"
 eastern_church_eth: "에티오피아 정교회"
 eastern_church_eth_desc: "에티오피아 정교회는 고대 동방(칼케돈 이전) 교회 중 하나입니다. 1959년까지는 콥트 교회에 교회법상 종속된 자치 교회였으며, 그 이후 독립 교회의 지위를 얻었습니다. 다른 고대 동방 교회들과 마찬가지로 세 차례의 공의회를 인정하며 단성론적 그리스도론을 고백합니다. 이 교회는 고유한 에티오피아 전례와 다른 교회 전통에는 유사한 예가 없는 독특한 성직자 위계 구조를 갖고 있습니다."
 ARM_armen_empire_nationalist: "아르메니아 제국"
 ARM_AUTH_S_nationalist: "아르메니아 왕국"
 ARM_Monarch_Bagratuni_nationalist: "아르메니아 왕국"
 ARM_Monarch_Bagratuni_West_Armenia_nationalist: "범캅카스 아르메니아 왕국"
 ARM_aspar_arms: "아스파르 암스"
 arme.4.d: "우리 정부는 1999년 의회 테러 공격에 대한 공식 조사에 착수했습니다. 너무 큰 소요를 일으키지 않기 위해, 이 사건은 반독립적인 조사관들이 처리하고 있습니다. 그들이 어떤 결론을 내놓을지 지켜봅시다."
 armenia_focus: "아르메니아 국가 중점 트리"
 ARM_triump_revolution_barhat_desc: "니콜 파시냔이 벨벳 혁명의 물결을 타고 아르메니아에서 권력을 장악했습니다."
 ARM_military_tree_shortcut: "군사 트리"
 ARM_economy_tree_shortcut: "경제 트리"
 ARM_police_tree_shortcut: "경찰 트리"
 ARM_diplomacy_tree_shortcut: "외교 트리"
 ARM_echoes_tree_shortcut: "정당"
 ARM_reactionary_opposition: "구정부에 대한 반대"
 ARM_bad_army_opposition: "무능한 군대에 대한 시위"
 ARM_united_armenians_trait: "아르메니아의 통합자"
 ARM_reformator_army_trait: "군 개혁가"
 ARM_anti_azer_trait: "반아제르바이잔"
 ARM_armenian_patriot_trait: "아르메니아의 애국자"
 ARM_anti_belarus_trait: "벨라루스 혐오자"
 ARM_anti_rus_trait: "러시아 혐오자"
 ARM_armenian_traitor_trait: "아르메니아의 배신자"
 ARM_armenian_policeman_trait: "부패에 맞선 열렬한 투사"
 ARM_Petrosyan: "언덕의 왕"
 ARM_Petrosyan_desc: "레본 야코비 테르페트로시안은 이니셜 LTP로도 알려진 아르메니아의 정치인으로, 아르메니아의 초대 대통령을 지냈습니다. 그는 1988년 아르메니아인이 거주하는 나고르노카라바흐를 아르메니아와 통합하려는 카라바흐 운동을 이끌었습니다. 그는 이웃 아제르바이잔과의 제1차 나고르노카라바흐 전쟁을 거치며 나라를 이끌었습니다."
 ARM_deideologization_of_democracy: "민주주의의 탈이념화"
 ARM_deideologization_of_democracy_desc: "아르메니아는 언론의 자유, 자유 시장, 인권이 진정으로 존중받는 몇 안 되는 구소련권 국가입니다. 우리의 작은 산악 국가는 이 지역에서 민주주의의 보루가 되어야 합니다."
 ARM_crossroad_diplomacy: "교차로 외교"
 ARM_crossroad_diplomacy_desc: "우리는 영향력 범위를 넓히고 지역 내 모든 국가와 정상적인 관계를 수립하기 위해 모든 지역 외교 역량을 활용해야 합니다."
 ARM_wipe_out_koch: "코차랸 저지"
 ARM_wipe_out_koch_desc: "코차랸의 부패한 관료들을 정부 기구에서 일소해야 합니다."
 ARM_desovietize_armenia: "아르메니아 탈소비에트화"
 ARM_desovietize_armenia_desc: "우리는 아르메니아에서 소비에트의 유산을 청산해야 합니다. 공산 정권은 우리 민족에게 눈물, 공포, 죽음, 고통, 그리고 민족 영토의 상실 외에는 아무것도 주지 않았습니다. 이제 행동할 때입니다."
 ARM_learn_from_cilicia: "킬리키아의 사례에서 배우기"
 ARM_learn_from_cilicia_desc: "우리는 역사에서, 특히 급진적인 외교 노선 변경이라는 비합리적 열망 때문에 멸망한 킬리키아에서 교훈을 얻어야 합니다. 같은 실수를 되풀이해서는 안 됩니다."
 ARM_privatize_land: "토지 사유화"
 ARM_privatize_land_desc: "우리는 마피아, 과두 지배층, 기회주의자들이 불법적으로 차지한 토지를 회수하여 올바르게 사유화하는 것으로 경제 개혁을 시작해야 합니다."
 ARM_press_oligs: "과두 지배층 압박"
 ARM_press_oligs_desc: "우리는 과두 지배층이 적어도 정부의 지방 자치 수준에서는 더 이상 영향력을 갖지 못하도록 해야 합니다."
 ARM_crush_mafia: "마피아 분쇄"
 ARM_crush_mafia_desc: "우리는 아르메니아의 모든 형태의 범죄 활동을 분쇄하고 모든 범죄자를 처벌해야 합니다."
 ARM_utilize_wifes_connections: "인맥 활용"
 ARM_utilize_wifes_connections_desc: "우리는 가족의 인맥을 활용하여 이스라엘과의 관계 정상화를 시도해야 합니다."
 ARM_liberalize_economy: "경제 자유화"
 ARM_liberalize_economy_desc: "우리는 빠른 경제 성장을 촉진하기 위해 경제를 자유화해야 합니다."
 ARM_socdem_principles: "사회적 원칙"
 ARM_socdem_principles_desc: "우리는 사회를 더욱 평등하게 만들기 위해 사회적 지원이라는 사회적 원칙을 고수해야 합니다."
 ARM_syria_israel_mediation: "시리아-이스라엘 중재"
 ARM_syria_israel_mediation_desc: "우리는 영향력 범위를 넓히기 위해 이스라엘과 시리아 사이의 평화 프로세스를 추진해 볼 수 있습니다."
 ARM_it_sector: "IT 부문 발전"
 ARM_it_sector_desc: "IT 부문은 우리나라에서 가장 빠르게 성장하는 산업이므로 우리는 이를 발전시켜야 합니다."
 ARM_levon_build_roads: "도로 건설"
 ARM_levon_build_roads_desc: "아르메니아의 기반시설은 끔찍한 상태입니다. 상황을 개선하기 위해 낡은 도로를 보수하고 새 도로를 건설해야 합니다."
 ARM_future_looking_strategy: "미래 지향적 전략"
 ARM_future_looking_strategy_desc: "우리는 지역의 장기적 안정을 목표로 하는 외교 정책 전략을 추구해야 합니다."
 ARM_defence_levon_invest: "국방 투자"
 ARM_defence_levon_invest_desc: "지역 평화를 추구하는 우리의 외교 정책 전략에도 불구하고 우리는 국방에 투자해야 합니다."
 ARM_soc_pac_bop_category: "아르메니아의 성향"
 ARM_soc_pac_bop: "아르메니아의 성향"
 ARM_soc_pac_bop_left_side: "자유주의적 평화주의"
 ARM_soc_pac_bop_right_side: "병영 사회주의"
