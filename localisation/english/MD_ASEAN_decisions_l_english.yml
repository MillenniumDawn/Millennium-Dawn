l_english:

 ASEAN_decisions: "ASEAN"
 ASEAN_accession_decisions: "ASEAN Accession"

 ASEAN_apply_membership: "Apply for ASEAN Membership"
 ASEAN_apply_membership_desc: "Submit our formal application. The chair will circulate it to the ten capitals; the vote will take some time; the consensus mechanism means any one of them can quietly bury the file."

 ASEAN_leave_organisation: "Withdraw from ASEAN"
 ASEAN_leave_organisation_desc: "File notice of departure with the Secretariat. Membership terminates on the effective date; the shared benefits, the safety net, and the seat at the table all fall away with it. A three-year cooldown before we could apply again, if we could."

 ASEAN_lodge_objection: "Lodge a Formal Objection"
 ASEAN_lodge_objection_desc: "Break consensus on the pending bloc focus. The chair will note our position, the record will remember it, and the focus stalls until we withdraw or we are no longer in the room. The cost lands on our own standing."

 ASEAN_engage_member: "Extend an Engagement Offer"
 ASEAN_engage_member_desc: "Spend the political capital to pull [FROM.GetNameDef] back to the table. A private demarche, a bilateral offer, a face-saving compromise. Their government gets a thirty-day window to lift one of its own breaches through decisions of its own."

 ASEAN_propose_summit: "Convene the Annual Summit"
 ASEAN_propose_summit_desc: "The chair opens the year's summit at the appointed venue. Ministers arrive with prepared statements and unprepared bilaterals. The summit mandate refills for the year; whatever the bloc's biggest act will be, it will happen in the room this decision opens."

 ASEAN_mediate_dispute: "Offer Mediation"
 ASEAN_mediate_dispute_desc: "Offer the Secretariat's good offices to the two members in dispute. Formal mediation under the Enhanced Dispute Settlement Protocol. No binding award, only a written finding. Costs us the political capital of getting between them."

 ASEAN_arbitrate_dispute: "Refer to the ASEAN Court"
 ASEAN_arbitrate_dispute_desc: "Refer the dispute to the Court. Binding, written, appealable to nothing. The claimant will win or lose on the merits, and the other capitals will read the ruling on record. Neither party gets to walk out afterwards and forget it."

 ASEAN_humanitarian_access: "Demand Humanitarian Access"
 ASEAN_humanitarian_access_desc: "Under the Flexible Engagement authority, demand AHA access to the affected member's territory. The doctrine of non-interference bends far enough to admit relief workers. It does not bend further, and their government knows it."

 ASEAN_opt_in_cept: "Ratify the Revised CEPT"
 ASEAN_opt_in_cept_desc: "Sign our capital onto the new tariff schedule. Duties fall on the agreed list; the exemptions we bargained for stay in the annex; the customs officers get their new codes by the end of the quarter."

 ASEAN_opt_in_atiga: "Ratify ATIGA"
 ASEAN_opt_in_atiga_desc: "Take our intra-bloc tariffs to zero on the agreed schedule. The industries that lobbied to be listed as sensitive got listed. The industries that did not are about to have a difficult year."

 ASEAN_opt_in_cmim: "Sign the Chiang Mai Facility"
 ASEAN_opt_in_cmim_desc: "Deposit our share into the common pool and take our line of credit against it. The rate is better than the IMF's and the surveillance is less intrusive. It will still not be free."

 ASEAN_opt_in_currency: "Adopt the ACU"
 ASEAN_opt_in_currency_desc: "Peg to the Asian Currency Unit, then converge to it, then retire the local currency in the appointed year. The central bank keeps its building and loses its independence. The trade denomination question, at last, has an answer."

 ASEAN_call_suspension_vote: "Call a Suspension Vote"
 ASEAN_call_suspension_vote_desc: "Refer [FROM.GetNameDef]'s conduct to the summit for a suspension ballot. Every other member votes; humans first. The machinery is Myanmar-shaped whether the current object is Myanmar or not. Our vote will be for suspension by default."

 ASEAN_veto_suspension: "Veto the Suspension"
 ASEAN_veto_suspension_desc: "Cast our vote against the ballot. Our patron will notice. The other members will also notice. The suspended member will remember longer than either."

 ASEAN_lift_suspension: "Move to Reintegrate"
 ASEAN_lift_suspension_desc: "Table a motion to lift the suspension. The conditions the suspended government has met are what the resolution will cite; the conditions it has not met are what the debate will cover."

 ASEAN_endorse_TIM: "Endorse Timor-Leste"
 ASEAN_endorse_TIM_desc: "Add our capital's endorsement to Timor-Leste's bid. Every endorsement narrows the room the sceptics have to work in; a single blocker can still hold the vote."

 ASEAN_invite_TIM: "Invite Timor-Leste to Accede"
 ASEAN_invite_TIM_desc: "With every endorsement in hand, extend the formal invitation from the chair. Timor-Leste receives our summit's letter and may accept or decline on their own timeline."

 ASEAN_block_TIM: "Block Timor-Leste"
 ASEAN_block_TIM_desc: "Interpose our objection against Timor-Leste's accession. Consensus requires our consent; withholding it is our right; the reasons we give for the record will need to be defensible for as long as the bid remains open."

 ASEAN_endorse_PAP: "Endorse Papua New Guinea"
 ASEAN_endorse_PAP_desc: "Add our capital's endorsement to Papua New Guinea's bid. Every endorsement narrows the room the sceptics have to work in; a single blocker can still hold the vote."

 ASEAN_invite_PAP: "Invite Papua New Guinea to Accede"
 ASEAN_invite_PAP_desc: "With every endorsement in hand, extend the formal invitation from the chair. Papua New Guinea receives our summit's letter and may accept or decline on their own timeline."

 ASEAN_block_PAP: "Block Papua New Guinea"
 ASEAN_block_PAP_desc: "Interpose our objection against Papua New Guinea's accession. Consensus requires our consent; withholding it is our right; the reasons we give for the record will need to be defensible for as long as the bid remains open."
