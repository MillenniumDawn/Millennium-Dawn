 EUvote.5.t: "EU Council Votes on the United States of Europe"
 EUvote.5.d: "The European Council has opened the vote on forming the §YUnited States of Europe§!. If the vote closes, every member state that has not rejected it in the Council will be §Rmerged into a single European state§!. Rejecting the vote keeps our nation sovereign but §Rends our EU membership§!. Abstaining counts as consent to the merger. The vote can be changed in the Euro Voting section until it closes in 14 days."
 EUvote.5.d_president: "The European Council has opened the vote on forming the §YUnited States of Europe§!. As the holder of the Commission Presidency, our nation will §Glead the new state§! and absorb every member that has not rejected the vote in the Council. Members that reject it leave the European Union instead. The vote closes in 14 days."
 EUvote.5.a: "We will not be dissolved"
 EUvote.5.b: "Let the Council decide"
 EUvote.5.c: "Europe will be united under our leadership"
 EUvote_5_reject_tt: "Our vote is recorded as §Rrejecting§! the United States of Europe. If it forms, we will leave the European Union instead of being annexed."
 EUvote_5_abstain_tt: "No vote is cast. If the vote is not rejected in the Euro Voting section before it closes, our nation will be §Rannexed§! into the United States of Europe.\n§ROur nation will cease to exist and the game will end for us.§!"
 EUvote_5_president_tt: "When the vote closes, every member that has not rejected it is §Gannexed into our nation§! as the United States of Europe."
 EUvote.6.t: "EU Parliament Considers the United States of Europe"
 EUvote.6.d: "A motion to form the §YUnited States of Europe§! has been placed before the European Parliament. If a majority of MEPs back it, the matter goes to the European Council, where every member state that does not reject it will be §Rmerged into a single European state§!. Party groups can be swayed in the Parliament section. When the Council vote opens, we will be warned again and can reject it there."
 EUvote.6.a: "Follow the debate closely"
 EUvote_6_tt: "If the motion reaches the Council, our nation must §Rreject it there§! to remain sovereign, at the cost of leaving the European Union."
