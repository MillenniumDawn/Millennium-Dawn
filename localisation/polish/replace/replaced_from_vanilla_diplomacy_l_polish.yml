 DIPLOMACY_CREATE_FACTION_DESC: "Tworzy sojusz wojskowy z $COUNTRY|Y$. Obydwa narody będą mogły połączyć się w wojnie. Jeżeli siły interwencyjne zostały wysłane lub odebrane między nami, zostaną odesłane."
 DIPLOMACY_CREATE_FACTION_REQUEST_DESC: "$COUNTRY|UY$ chce, żebyśmy ich wsparli, utwórz frakcję: $FACTION|Y$.\nJeśli jakieś siły interwencyjne zostały wysłane lub otrzymane między nami, zostaną odesłane."
 DIPLOMACY_JOIN_FACTION_REQUEST_DESC: "$COUNTRY|UY$ chce dołączyć do naszej frakcji $FACTION|Y$.\nJeśli pomiędzy członkami frakcji zostały wysłane lub odebrane jakiekolwiek siły interwencyjne, zostaną one odesłane.\nInscenizowane zamachy stanu pomiędzy $COUNTRY|H$ a nami zostaną automatycznie anulowane."
 DIPLOMACY_OFFER_JOIN_FACTION_DESC: "Zaproś $COUNTRY|UH$ do przyłączenia się do $FACTION|H$. Dzięki temu będziecie mogli wzajemnie wzywać się do wojny. Przywódcą frakcji jest $LEADER|H$.\nJeśli pomiędzy członkami frakcji zostały wysłane lub odebrane jakiekolwiek siły interwencyjne, zostaną one odesłane."
 DIPLOMACY_OFFER_JOIN_FACTION_REQUEST_DESC: "$COUNTRY|UH$ chce, żebyśmy dołączyli do ich frakcji: $FACTION|Y$.\nJeśli pomiędzy członkami frakcji zostały wysłane lub odebrane jakiekolwiek siły interwencyjne, zostaną one odesłane.\nInscenizowane zamachy stanu pomiędzy $COUNTRY|H$ a nami zostaną automatycznie anulowane."
 DIPLOMACY_JOIN_FACTION_DESC: "Poproś $COUNTRY|H$ o dołączenie do $FACTION|H$. Dzięki temu będziecie mogli wzajemnie wzywać się do wojny. Liderem frakcji jest $LEADER|H$.\nJeśli wysłałeś jakieś siły interwencyjne do członków frakcji, zostaną one odesłane."
