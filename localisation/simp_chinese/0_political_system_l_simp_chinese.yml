 FULL_POLITICS_VIEW_BUTTON_TT: "展开党派视图"
 si_title_text: "政党和运动"
 si_title_text_tt: "§Y当前政治法：§!\n是否进行选举：[has_elections_check]\n选举门槛：[?election_threshold|%0][term_limit_text]"
 western_desc: "西方及亲西方政府力图维护自苏联解体以来一直占据主导地位的以美国为中心的自由主义世界秩序。他们通过世界银行和国际货币基金组织等机构，推动经济自由化和非国有化。尽管绝大多数具有西方视野​​的国家都是各种形式的民主政体，但那些从现状中获益的亲西方强人政府也为其提供了支持。"
 emerging_desc: "具有新兴视野的政府，尤其是在全球南方和后苏联地区，寻求以自身的替代性机构和多极化全球政治模式取代现行的自由主义世界秩序。它们在全球化、政府形式和国内政策方面往往持有不同的态度。"
 salafist_desc: "萨拉菲主义是逊尼派伊斯兰教主流分支中一个极端保守、不宽容、原教旨主义的派别。自20世纪中叶以来，瓦哈比派海湾君主国为其教义提供了数十亿美元的资金支持，萨拉菲主义的影响力也随之增长。塔利班、基地组织和伊斯兰国等组织都体现了萨拉菲主义的暴力倾向。"
 non_aligned_desc: "不结盟国家的政府类型和意识形态千差万别，通常对外交关系采取非常务实的态度。许多不结盟国家仅仅希望推进自身的国家独立或其他地区目标。另一些不结盟国家则在强权之间摇摆不定，这些强权为了争夺影响力而将它们拉向不同的方向。"
 communist_state_pop_election: "在最近的选举中获得[?party_pop_elect_array^4|%1]"
 generic.communist_state: "£generic_Communist_State_small 共产主义者"
 generic.communist_state_desc: "共产主义广义上指的是一种主张终结资本主义制度、建立工人公社式天堂的意识形态。然而，实际上，共产主义国家往往保留了资本主义经济制度，并且通常不具备民主性质。"
 generic.communist_state_icon: "£generic_Communist_State_small"