 israel_arab_boycott_category_desc: "\n\n\n\n\n\n£ISR_desctext_blockade\n\n\n\n\n\n\n\n\n§t6일 전쟁§! §Y이후§!, 많은 §7중동 국가§!가 [PAL.GetFlag]팔레스타인 및 서로에 대한 연대를 표명하며 [ISR.GetFlag]이스라엘에 대한 §O경제·외교 봉쇄§!를 시작했습니다. 오늘날의 §C정세§!에도 그러한 감정은 여전히 §R남아 있으나§!, 양측의 접촉으로 흐름이 바뀔 수도 있습니다.\n\n[saud_bloc_loc]\n[kuw_bloc_loc]\n[irq_bloc_loc]\n[per_bloc_loc]\n[leb_bloc_loc]\n[syr_bloc_loc]\n[yem_bloc_loc]\n[lba_bloc_loc]\n[agl_bloc_loc]\n[sha_bloc_loc]\n[sud_bloc_loc]\n[uae_bloc_loc]\n[qat_bloc_loc]\n[tun_bloc_loc]\n[bhr_bloc_loc]\n[mor_bloc_loc]\n[oma_bloc_loc]\n[mau_bloc_loc]\n[egy_bloc_loc]\n[jor_bloc_loc]"
