 EGY_slums_decision: "이집트의 빈민가"
 EGY_slums_decision_desc: "\n\n\n\n£EGY_desctext_slums\n\n\n\n\n\n§Y중앙 집권적§! 물리적 계획 과정이 지역 현실과 괴리되면서 §Y계획에 대한 고려§! 없이 도시 개발이 이루어졌고, 그 결과 도시 내 비공식적으로 개발되고 §R계획되지 않은§! 지역의 §R비율이 높습니다§!. 이러한 개발은 국유지와 §G농경지§! 모두에서 이루어졌습니다.\n\n동시에 도심 지역은 방치되어 §R황폐하고§! §R위험한§! 동네로 변했습니다. 가족과 소규모 비공식 개발업자가 추진하는 §Y비공식 개발§!은 대도시뿐 아니라 중소 도시와 마을에서도 이루어집니다. 건물은 대체로 구조적으로 적절하지만 인프라는 §R부족하고§! §R과부하 상태이며§!, 도로는 너무 §R좁고§! 흔히 §R비포장§!이며, 공공 공간은 §R매우 드물거나§! §R아예 없고§!, 공공 서비스는 심각하게 §R부족합니다§!.\n\n§R빈민가 문제§!를 해결할수록 §Y$EGY_broken_economy_idea$§! 국가 정신의 영향이 줄어듭니다.\n\n남은 빈민가: §Y[?EGY_slums_left]/16§!"
 EGY_remove_slums_in_alexandria: "§Y[216.GetName]§!의 빈민가 수준 §G감소§!"
 EGY_remove_slums_in_alexandria_desc: "문제를 해결하는 방법은 학교, 수도관, 하수도 같은 사회 기반시설 건설, 빈민가 주민 퇴거 등 여러 가지가 있습니다. 우리는 실용적으로 접근하여 구체적인 상황을 살펴볼 것입니다."
 EGY_remove_slums_in_cairo: "§Y[215.GetName]§!의 빈민가 수준 §G감소§!"
 EGY_remove_slums_in_cairo_desc: "문제를 해결하는 방법은 학교, 수도관, 하수도 같은 사회 기반시설 건설, 빈민가 주민 퇴거 등 여러 가지가 있습니다. 우리는 실용적으로 접근하여 구체적인 상황을 살펴볼 것입니다."
 EGY_remove_slums_in_suez: "§Y[214.GetName]§!의 빈민가 수준 §G감소§!"
 EGY_remove_slums_in_suez_desc: "문제를 해결하는 방법은 학교, 수도관, 하수도 같은 사회 기반시설 건설, 빈민가 주민 퇴거 등 여러 가지가 있습니다. 우리는 실용적으로 접근하여 구체적인 상황을 살펴볼 것입니다."
