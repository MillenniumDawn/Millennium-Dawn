 ukr_modernize_sov_equipment_t55_reactivation_program.1.name: "Программа модернизации §YТ-55§!:\nвыбор направления"
 ukr_modernize_sov_equipment_t55_reactivation_program.1.desc: "§YХКБМ§! обследовало хранящиеся корпуса. Большинство достаточно крепки для восстановления, но 100-мм пушка, изношенный двигатель §YВ-55§! и тонкая броня §Rуже не соответствуют§! современному полю боя. Бюро предлагает несколько способов их модернизировать."
