 CZE_Anti_tank_5: "PTŘS-109 Pancíř"
 CZE_Anti_tank_5_desc: "Расшифровывается как ПТРК-109. Тандемный ПТРК второго поколения с лидирующими ракетами (да, две лидирующие и 1 настоящая боевая часть), поражающими комплексы активной защиты перед тандемной боевой частью с бронепробиваемостью 2500 мм RHA. Скорость боевых частей — 500 м/с, что оставляет вражеским КАЗ и экипажу очень мало времени на реакцию даже на расстоянии 3 км. Объединив несколько таких мобильных комплексов, можно уничтожить любой танк подавляющим количеством ПТУР."
