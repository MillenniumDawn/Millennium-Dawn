 UKR_start_workforce_modifier: "소련식 인력 편성 기준"
 UKR_start_workforce_modifier_desc: "과거의 집단농장, 민수 공장, 광산은 여전히 소련 계획경제 시절의 인력 명부를 떠안고 있는 반면, 무기 공장, 조선소, 새 민간 사무실은 이미 군살 없이 운영됩니다.\n§W--------------§!\n$UKR_start_workforce_progress$"
 UKR_start_workforce_progress: "§Y작업장§!: 현재/목표 (§G변화량, 항목당§!)\n§Y농업 지구§!: [?agriculture_district_total|0]/[?UKR_start_workforce_agriculture_target|0] (§G-10%§!)\n§Y민수 산업§!: [?industrial_complex_total|0]/[?UKR_start_workforce_civ_facs_target|0] (§G-2.5%§!)\n§Y군수 산업 및 조선소§!: [?UKR_start_workforce_mil_facs_count|0]/[?UKR_start_workforce_mil_facs_target|0] (§R+2%§!)\n§Y사무 부문§!: [?office_park_total|0]/[?UKR_start_workforce_offices_target|0] (§R+2%§!)\n§Y자원 채굴§!: 위 작업장 단계마다 §G-2.5%§!\n§Y목표 달성§! 시 §Y우크라이나 경제 발전§!에 월간 인구를 영구히 추가: 농업 지구 또는 민수 산업은 §G+10%§!, 군수 산업 및 조선소 또는 사무 부문은 §G+5%§!\n\n매월 확인합니다. 잃어버린 건물은 예전의 인력 편성을 되살리지 않습니다. 모든 작업장이 목표에 도달하면 이 국가 정신은 §R제거§!됩니다."
 UKR_start_workforce_removed_tt: "모든 작업장이 목표에 도달했으므로 §Y소련식 인력 편성 기준§!이 §R제거됨§!"
 ukr_start_workforce.1.t: "개정된 인력 편성 기준"
 ukr_start_workforce.1.d: "신규 건설 덕분에 각 부처가 소련 시대 인력 편성 기준을 더 많이 고쳐 쓸 수 있게 되었습니다.\n\n$UKR_start_workforce_progress$"
 ukr_start_workforce.1.d_done: "마지막 남은 소련 시대 인력 편성 기준이 사라졌습니다. 이제 우리의 농장, 공장, 광산, 사무실은 여느 현대 경제처럼 인력을 채용합니다."
