 SMA_vatican_union: "교황청과의 연합"
 SMA_vatican_union_desc: "우리 주교는 산마리노와 교황청 간의 공식 연합을 제안하며, 두 국가를 하나의 왕관 아래 합치자고 합니다. 이는 교황을 우리 정부의 수장에 올려놓고 우리를 교회의 권위에 영구히 결속시킬 것입니다."