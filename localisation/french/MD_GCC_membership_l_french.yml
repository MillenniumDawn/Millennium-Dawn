 gcc_invite.1.t: "Une invitation du Golfe"
 gcc_invite.1.d: "[FROM.GetName], s'exprimant au nom du Conseil de coopération du Golfe, nous a adressé une invitation formelle à rejoindre l'union. L'adhésion lierait notre économie et notre sécurité au bloc le plus riche du monde arabe. Le Conseil attend notre réponse."
 gcc_invite.1.a: "Nous acceptons. Vive le Conseil."
 gcc_invite.1.b: "Nous devons décliner, pour l'instant."
 gcc_invite.2.t: "Le CCG accueille un nouveau membre"
 gcc_invite.2.d: "Lors d'une cérémonie à Riyad, le Conseil de coopération du Golfe a formellement admis un nouvel État membre, étendant l'union au-delà des rives du Golfe pour la première fois. La portée du bloc, et ses ambitions, s'accroissent."
 gcc_invite.2.a: "Une journée historique."
 gcc_invite.3.t: "L'invitation est déclinée"
 gcc_invite.3.d: "Notre invitation a été refusée. L'élargissement du Conseil devra attendre un partenaire plus disposé, ou un changement d'avis."
 gcc_invite.3.a: "Ainsi soit-il."
