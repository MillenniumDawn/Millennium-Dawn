 IBR_gates_of_iberia: "Gates of Iberia"
 IBR_gates_of_iberia_desc: "The union covers the peninsula, and three of its doors are still held by someone else. The Rock guards the western end of the Strait, Tangier faces it from Africa, and Andorra keeps a pass in the Pyrenees. Each is a separate negotiation with a separate government, and no single argument will settle all three."
 IBR_south_atlantic_islands: "The South Atlantic Islands"
 IBR_south_atlantic_islands_desc: "Portuguese captains found Ascension and Saint Helena in 1501 and 1502, and Tristan da Cunha carries the name of the one who sighted it in 1506. Britain has held them for two centuries as waystations on the route south. A nationalist government with a fleet three times the Royal Navy and an economy twice Britain's can ask for them back. A refusal brings sanctions as well as a war goal."
 IBR_gibraltar_two_flags: "Gibraltar Under Two Flags"
 IBR_gibraltar_two_flags_desc: "Britain took the Rock in 1704 and kept it under the Treaty of Utrecht. It has never needed the sovereignty as much as it has needed the harbor. We ask London for the first and promise it the second: the Royal Navy keeps its berths and its dockyard on the Rock and gets military access to our land. A Britain that has kept faith with the oldest alliance is likely to agree, and a Britain we have snubbed is not."
 IBR_tangier_zone: "Tangier Zone"
 IBR_tangier_zone_desc: "Tangier was Portuguese from 1471 until Catherine of Braganza took it to England as her dowry in 1661. Today it is Morocco's gateway to the Strait and its busiest port. We ask Rabat to cede the region, knowing the answer. A refusal puts our claim on the record and gives us a war goal."
 IBR_andorran_accession: "Andorran Accession"
 IBR_andorran_accession_desc: "Andorra has no army and depends on its two neighbors for its defense, its post and most of its trade. A union that already covers Spain can offer Andorrans every right of the peninsula, in Catalan, and Andorra la Vella has good reasons to say yes. We put the offer to the Consell General."
 IBR_crown_of_aragon: "The Crown of Aragon"
 IBR_crown_of_aragon_desc: "The Crown of Aragon once held Sardinia, Sicily, Naples and the Roussillon, and the Iberian Union is its heir as much as Castile's. The Mediterranean claims of the old crown are taken out of the archive."
 IBR_sardinian_question: "The Sardinian Question"
 IBR_sardinian_question_desc: "Sardinia speaks its own language, votes for its own nationalists and was Aragonese for four hundred years. We fund the Partito Sardo d'Azione and ask Rome, publicly, why the island should not decide for itself."
 IBR_occitan_fiefs: "The Occitan Fiefs"
 IBR_occitan_fiefs_desc: "The Counts of Barcelona ruled Provence until 1245, Montpellier stayed Aragonese until 1349, and France took the Roussillon only in 1659. Claimed together, they carry the union's border along the coast to the Alps and Italy. Paris will not give them up without a full war."
 IBR_occitan_fiefs_french_tt: "§YFrance§! still holds §YLanguedoc-Roussillon§!, §YProvence§! or §YNice§!"
 IBR_grimaldi_protectorate: "The Grimaldi Protectorate"
 IBR_grimaldi_protectorate_desc: "From 1524 to 1641 Monaco sat under Spanish protection, with a Spanish garrison on the Rock. With Nice in our hands the Principality is surrounded by the union, and the Grimaldis have always known how to read a map."
 IBR_two_sicilies: "The Two Sicilies"
 IBR_two_sicilies_desc: "Naples and Sicily were Aragonese, then Spanish, for most of four centuries. Claiming them means a full war with Italy, and Rome will not fight it alone."
 IBR_sardinian_protectorate: "The Sardinian Protectorate"
 IBR_sardinian_protectorate_desc: "If Sardinia is free, it needs a protector, and we are the nearest crown that wants nothing from it but its harbours. If Rome refused, the island is taken the old way."
 IBR_knights_isle: "The Knights' Isle"
 IBR_knights_isle_desc: "Charles V gave Malta to the Knights of St John in 1530 as a fief of the Crown of Sicily. The island is the key to the narrows between Sicily and Africa, and it has no army to speak of."
 IBR_mare_nostrum: "Mare Nostrum"
 IBR_mare_nostrum_desc: "The western Mediterranean is an Iberian lake again, as it was when Spanish galleys sailed from Barcelona, Naples and Messina to Lepanto. The islands of the old crown are integrated as its provinces."
 IBR_suez_question: "The Suez Question"
 IBR_suez_question_desc: "In 1956 Britain and France tried to take the canal back and were forced out within weeks. Half a century later the union holds the western Mediterranean and asks why the ships that pass Gibraltar should pay their tolls to someone else. Whoever holds Suez must give it up or fight for it, and the peace that follows decides what becomes of them."
 IBR_ibero_american_community: "The Ibero-American Community"
 IBR_ibero_american_community_desc: "Lisbon has always sat at the Ibero-American summits beside Madrid and spoken second. The union speaks once, for both languages, and Spanish America now hears it from a government that holds the whole peninsula."
 IBR_every_hispanic_country_tt: "Every other §YSpanish-speaking§! country:"
 IBR_mexican_service_contracts: "Mexican Service Contracts"
 IBR_mexican_service_contracts_desc: "Mexico keeps its oil in state hands and pays foreign companies to get it out of the ground. Guatemala sells the Petén to whoever will drill it. Iberian firms that already work for Repsol and Galp want both contracts."
 IBR_mexico_and_guatemala_tt: "§YMexico§! and §YGuatemala§!:"
 IBR_zapatista_card: "The Zapatista Card"
 IBR_zapatista_card_desc: "The Zapatistas have held their villages in Chiapas since 1994, and Mexico City has never found a settlement that sticks. Iberian charities, journalists and money can make the conflict louder until the government wants the union's goodwill more than its pride."
 IBR_andean_concessions: "The Andean Concessions"
 IBR_andean_concessions_desc: "Copper in the Atacama, lithium under the salt flats of Uyuni, shale at Vaca Muerta and oil in the Llanos. The Andes hold what the next century runs on, and the governments that own it want investors who speak their language."
 IBR_andean_countries_tt: "§YArgentina§!, §YBolivia§!, §YChile§!, §YColombia§! and §YPeru§!:"
 IBR_arms_to_the_llanos: "Arms to the Llanos"
 IBR_arms_to_the_llanos_desc: "The guerrillas and the paramilitaries buy their rifles on the same black market, and both answer to whoever pays. A few shipments across the eastern plains can show Bogotá how much worse its war could get without the union's help."
 IBR_orinoco_belt: "The Orinoco Belt"
 IBR_orinoco_belt_desc: "The Orinoco Belt holds the largest heavy oil reserves in the world, and Repsol already pumps part of it. PDVSA needs foreign partners to upgrade crude it cannot sell as it comes out of the ground. The union's firms are first in line."
 IBR_caracas_opposition: "The Caracas Opposition"
 IBR_caracas_opposition_desc: "Half of Venezuela marches against its government and the other half marches for it. The opposition's newspapers and television stations need money and foreign friends. The union can supply both."
 IBR_captaincy_general: "The Captaincy General"
 IBR_captaincy_general_desc: "Madrid ruled Venezuela as a captaincy general, a frontier province under a soldier. The country is split down the middle, and the union will put the half that owes it in power."
 IBR_antilles_partnership: "The Antilles Partnership"
 IBR_antilles_partnership_desc: "Spanish chains already run most of the foreign hotels in Varadero and Punta Cana, Spanish banks hold the deposits and Iberian ships fly the Panamanian flag. The union turns a habit into a partnership, and takes the gold mine at Pueblo Viejo with it."
 IBR_caribbean_countries_tt: "§YCuba§! and the §YDominican Republic§!:"
 IBR_ladies_in_white: "The Ladies in White"
 IBR_ladies_in_white_desc: "The wives and mothers of jailed Cuban dissidents walk to Mass in white every Sunday. The union's embassy can give them cameras, lawyers and a hearing in Brussels, and Havana will have to answer for every arrest."
 IBR_pearl_of_the_antilles: "The Pearl of the Antilles"
 IBR_pearl_of_the_antilles_desc: "Cuba was the last of the American colonies to go, in 1898, and the one Madrid missed most. Its regime has outlived its patrons and is short of friends. The union means to choose its next government."
 IBR_new_granada: "New Granada"
 IBR_new_granada_desc: "New Granada was the viceroyalty Madrid ruled from Bogotá. Colombia has fought its own guerrillas for forty years, and a government that cannot hold its countryside cannot stop the union putting a friendlier one in its place."
 IBR_new_spain: "New Spain"
 IBR_new_spain_desc: "Mexico was the richest kingdom of the Spanish crown and is now the largest Spanish-speaking country in the world. A war there draws Washington in, and only a government that has stopped caring what Washington thinks would start one."
 IBR_hispanic_federation: "The Iberian Federation"
 IBR_hispanic_federation_desc: "London once talked of an Imperial Federation with one parliament for the whole empire, and never built it. The union can. Its subjects in the Americas are offered seats in the Cortes and the union's citizenship, as members of one federation rather than clients of one capital."
 IBR_indies_federation_tt: "Each of §YMexico§!, §YCuba§!, §YColombia§! and §YVenezuela§! that is our subject, or where we hold more than §Y30%§! influence, and is not at war with us is invited to join the union. Our subjects are far likelier to accept."
 IBR_federation_join_tt: "Every state of the joining country becomes a §Gcore§! of the union, which annexes it with its army."
 IBR_federation_refused_tt: "Its relationship with the union stays as it is."
 IBR_lusophone_inheritance: "The Lusophone Inheritance"
 IBR_lusophone_inheritance_desc: "Spain never had a seat in the Community of Portuguese Language Countries. The union inherits Lisbon's, and with it a hearing in eight capitals on four continents that Madrid could never have asked for."
 IBR_every_lusophone_country_tt: "Every other §YPortuguese-speaking§! country:"
 IBR_brazilian_partnership: "The Brazilian Partnership"
 IBR_brazilian_partnership_desc: "Brazil has nearly twenty times Portugal's population, and it has always treated Lisbon as a sentimental relative. The union arrives with Spanish capital and a Portuguese accent, and asks for a share of the pre-salt fields and a seat on Embraer's supplier list."
 IBR_pre_salt_dispute: "The Pre-Salt Dispute"
 IBR_pre_salt_dispute_desc: "The oil under the salt layer off Rio could be the largest find of the century, and Petrobras wants foreign partners to share the cost but not the profits. The union's firms can take the dispute public, and Brazil's courts and streets will do the rest."
 IBR_angolan_oil_blocks: "The Angolan Oil Blocks"
 IBR_angolan_oil_blocks_desc: "Angola's deepwater blocks pump more oil than anywhere in Africa but Nigeria, and Galp and Repsol both hold stakes. Luanda auctions the next blocks to whoever brings more than money."
 IBR_angola_tt: "§YAngola§! and §YUNITA§!:"
 IBR_cabinda_separatists: "The Cabinda Separatists"
 IBR_cabinda_separatists_desc: "Cabinda produces most of Angola's oil and wants none of Angola's government. Its separatists have fought for independence since 1975. Money and a sympathetic hearing in Europe can make them louder."
 IBR_angolan_intervention: "The Angolan Intervention"
 IBR_angolan_intervention_desc: "Cuba sent fifty thousand soldiers into Angola's civil war and South Africa sent its own. The union can send an expedition of its own and end the war on its terms, with a government in Luanda that owes it everything."
 IBR_mozal_smelter: "The Mozal Smelter"
 IBR_mozal_smelter_desc: "The Mozal smelter outside Maputo turns imported ore into most of Mozambique's exports, on power from Cahora Bassa. The coal of Tete comes next, and the union's firms want the concessions before anyone else bids."
 IBR_renamo_contacts: "RENAMO Contacts"
 IBR_renamo_contacts_desc: "RENAMO laid down its arms in 1992 and never stopped saying the elections were stolen. Its old officers still keep weapons in the bush around Gorongosa. A few contacts there can remind Maputo how fragile its peace is."
 IBR_macau_forum: "The Macau Forum"
 IBR_macau_forum_desc: "Beijing founded the Macau Forum in 2003 to trade with the Portuguese-speaking world through the city Portugal handed back. The union joins as the member that holds the European end of it, and East Timor's gas fields are part of the conversation."
 IBR_timor_gap: "The Timor Gap"
 IBR_timor_gap_desc: "The gas fields of the Timor Sea lie between Dili and Darwin, and Canberra drew the line closer to Dili than the law of the sea allows. The union can back Australia's claim and show Dili what refusing us costs."
 IBR_timor_protectorate: "The Timor Protectorate"
 IBR_timor_protectorate_desc: "Portugal held Timor for four centuries and left it to Indonesia in 1975. A government in Dili that cannot police its own capital cannot refuse the union a garrison."
 IBR_rose_coloured_map: "The Rose-Coloured Map"
 IBR_rose_coloured_map_desc: "In 1886 Lisbon drew a map coloured pink from Angola to Mozambique and claimed everything between them, until a British ultimatum ended it. The union means to finish what the map began, starting on the Indian Ocean coast."
 IBR_tordesillas: "Both Halves of Tordesillas"
 IBR_tordesillas_desc: "In 1494 the Treaty of Tordesillas divided the New World between Castile and Portugal along a line through what is now Brazil. The union holds both signatures, and means to have the last word on both sides of the line."
 IBR_ultramar_all_subjects_tt: "Every existing country among §YBrazil§!, §YAngola§!, §YUNITA§!, §YMozambique§! and §YTimor Leste§! is our subject, and at least one exists"
 IBR_lusophone_federation: "The Iberian Federation"
 IBR_lusophone_federation_desc: "London once talked of an Imperial Federation with one parliament for the whole empire, and never built it. The union can. Its Portuguese-speaking subjects are offered seats in the Cortes and the union's citizenship, as members of one federation rather than clients of one capital."
 IBR_ultramar_federation_tt: "Each of our subjects among §YBrazil§!, §YAngola§!, §YUNITA§!, §YMozambique§! and §YTimor Leste§! is invited to join the union."
 IBR_community_founded_tt: "Founds a §Ycommunity§! for the Spanish- and Portuguese-speaking world, or takes over the existing one if its founder is gone. Members join by invitation."
 IBR_community_opens_tt: "§YSpanish-speaking§! nations may now join our §Ycommunity§!."
