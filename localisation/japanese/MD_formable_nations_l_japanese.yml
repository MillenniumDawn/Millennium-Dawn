 formable_buy.1.t: "[?formable_offer_buyer_id.GetNameDef]からの領土購入要請"
 formable_buy.1.d: "[?formable_offer_buyer_id.GetNameDef]は我が国に、同国が歴史的な中核地域であると主張する[?formable_offer_state_id.GetName]を§H£treasury 100b§!で購入したいと持ち掛けてきた。\n\n我々は、この提案を受け入れその土地を譲渡するか、それとも拒否して領土を保全するか、決断を下さなければならない。"
