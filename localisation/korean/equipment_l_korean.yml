 AST_CV_MR_Fighter2: "보잉 F/A-18C/D 호넷"
 AST_CV_MR_Fighter2_desc: "맥도넬 더글러스 F/A-18 호넷은 쌍발 초음속 전천후 항공모함이 가능한 다목적 전투기로 전투기와 공격기로 설계되었습니다. 맥도넬 더글러스(현재의 보잉)와 노스럽이 설계한 F/A-18은 1970년대 미국 해군과 해병대에서 사용하기 위해 후자의 YF-17에서 파생되었습니다."
 AST_CV_MR_Fighter2_short: "F/A-18C/D 호넷"
 AST_CV_MR_Fighter3: "F/A-18E/F 슈퍼 호넷"
 AST_CV_MR_Fighter3_desc: "보잉 F/A-18E와 F/A-17F  슈퍼 호넷은 멕도넬 더글라스 F/A-18 호넷을 기반으로 기체로 쌍발형 엔진을 탑재한 다목적 함재 전투기입니다. F/A-18E 단좌형과 F/A-18F 복좌형은 F/A-18C/D 호넷보다 더 넓고 진보한 파생형입니다. 슈퍼 호넷은 내부에 20mm M61 개틀링 기관포를 탑재했고 공대공 미사일과 공대지 무장을 탑재할 수 있습니다. 추가 연료는 최대 5개의 외부 연료탱크로 운반할 수 있으며 외부 공중급유시스템을 추가해 항공기를 공중급유기로 사용할 수 있습니다."
