 JAP_expand_special_zones_nationwide_done: "Выполнено §Y$JAP_expand_special_zones_nationwide$§!"
 JAP_japanese_economy_decisions: "The Entrenched Demand Shortfall"
 JAP_japanese_economy_decisions_desc: "Two decades of falling prices taught Japanese households and firms to wait. Wages sit flat, companies hoard cash rather than invest, and every yen of stimulus is saved instead of spent. The economy is not collapsing; it is simply refusing to move.\n\n§YWhat you can do§!\nThe decisions below are the demand levers. Announcing a price target, cutting consumption tax, transferring cash to households, funding public investment and pushing durable goods purchases each raise §YDemand Recovery Progress§!. The focuses of the demand branch raise it further, and §Y$JAP_improvement_private_investment_climate$§! adds to it directly.\n\n§YDemand Recovery Progress§!: [?JAP_demand_recovery_progress|0] / 100\n\n§GThresholds§!\n§G30§!: §Y$JAP_entrenched_demand_shortfall_idea_1$§! eases into §Y$JAP_entrenched_demand_shortfall_idea_2$§!.\n§G60§!: it eases again into §Y$JAP_entrenched_demand_shortfall_idea_3$§!.\n§G85§!: the spirit is removed and Japan's economic growth accelerates.\n\n§RWarning§!: this progress never decays, but nothing raises it on its own either. Take no decisions and Japan stays in the slump indefinitely."
 JAP_entrenched_demand_shortfall_idea_2: "Медленное восстановление спроса"
 JAP_entrenched_demand_shortfall_idea_2_desc: "Более чёткие целевые показатели цен и поддержка домохозяйств вывели экономику из её худшей фазы, но восстановление остаётся хрупким. Потребление и инвестиции в некоторых сферах улучшаются, однако недостаточно сильно, чтобы поднять всю страну. Спрос возвращается, но осторожность всё ещё сдерживает экономику.\n-------------\nВы можете §Gсмягчить§! последствия этого национального духа, используя решения в §Y$JAP_japanese_economy_decisions$§!, чтобы повысить §YПрогресс восстановления спроса§! как минимум до §G60§!!"
 JAP_entrenched_demand_shortfall_idea_3: "Сохраняющееся давление на спрос"
 JAP_entrenched_demand_shortfall_idea_3_desc: "Меры правительства по стимулированию потребления продвинули экономику вперёд, но осторожность, оставшаяся после долгих лет стагнации, всё ещё глубоко укоренилась. Домохозяйства и предприятия действуют активнее, чем раньше, однако для самоподдерживающегося восстановления всё ещё необходим последний толчок. Японская экономика находится на пороге выхода из стагнации, но ещё не смогла полностью освободиться от неё.\n-------------\nВы можете §Gудалить§! этот национальный дух, используя решения в §Y$JAP_japanese_economy_decisions$§!, чтобы повысить §YПрогресс восстановления спроса§! как минимум до §G85§!!."
 JAP_declaration_price_target: "Объявите целевую цену"
 JAP_declaration_price_target_desc: "Экономику тормозит не только слабый спрос. Убеждение в том, что цены и заработная плата никогда не изменятся, держит домохозяйства и фирмы в состоянии осторожности. Четко определенная целевая цена – это заявление о том, что государство больше не будет мириться со стагнацией как с нормой, и это первый шаг к тому, чтобы освободиться от замороженных ожиданий."
 Japan_economy.17.t: "Целевая цена достигнута."
 Japan_economy.17.d: "То, что когда-то казалось невозможным, начало происходить. Цены растут так, что люди больше не могут это игнорировать. Самое важное изменение — не сама цифра, а растущее ощущение того, что стагнация не вечна. Это чувство начинает ослаблять осторожность как домохозяйств, так и компаний."
 Japan_economy.17.a: "Атмосфера изменилась."
 Japan_economy.18.t: "Целевая цена не оправдала ожиданий."
 Japan_economy.18.d: "Целевой показатель не привел к реальным результатам, и начинают распространяться сомнения в обещании правительства остановить спад. Домохозяйства снова проявляют осторожность, а компании занимают выжидательную позицию перед лицом слабого спроса. Доверие к восстановлению явно подорвано, и над экономикой Японии вновь воцаряется гнетущее настроение."
 Japan_economy.18.a: "Восстановить уверенность непросто."
 JAP_price_target_mission: "Перспективы роста цен"
 JAP_price_target_mission_desc: "Объявить целевой показатель недостаточно. Мы должны продемонстрировать видимые признаки роста цен в отведенное время и убедить страну в том, что перемены действительно начались."
 JAP_cash_transfers_households: "Прямая поддержка домохозяйств"
 JAP_cash_transfers_households_desc: "Когда тревога по поводу будущего сильна, восстановление экономики не начинается само по себе. Государство должно напрямую передать покупательную способность домохозяйствам. Поддержка, направленная на группы населения с низким и средним уровнем дохода, с большей вероятностью приведет к реальному потреблению, немедленно стимулируя внутренний спрос."
 JAP_cash_transfers_households_decision: "Выплаты домохозяйствам с низким и средним уровнем дохода"
 JAP_cash_transfers_households_decision_desc: "Окажите поддержку группам населения, которые с наибольшей вероятностью потратят эти средства, и напрямую стимулируйте рост спроса."
 Japan_economy.19.t: "Программы поддержки начинают показывать признаки восстановления"
 Japan_economy.19.d: "Деньги, доставляемые непосредственно домохозяйствам, больше не лежат без дела. Они начинают поступать на рынок. Рост расходов особенно заметен среди групп населения с низким и средним уровнем дохода, и кошельки, которые так долго оставались закрытыми, наконец-то начинают открываться."
 Japan_economy.19.a: "Спрос еще можно пробудить."
 JAP_temporary_tax_cuts: "Временные налоговые льготы"
 JAP_temporary_tax_cuts_desc: "Temporary tax cuts give households a reason to spend now, pulling forward the purchases that have been postponed and giving demand visible momentum in a stagnant economy."
 JAP_temporary_consumption_tax_cut: "Временное снижение налога на потребление"
 JAP_temporary_consumption_tax_cut_desc: "Создайте повод для покупок прямо сейчас и превратите отложенное потребление в импульс для восстановления экономики."
 Japan_economy.20.t: "Налоговые льготы демонстрируют признаки восстановления"
 Japan_economy.20.d: "Временное снижение налогов дало домохозяйствам повод действовать сейчас. Покупки, которые были отложены, начинают возвращаться, и атмосфера стагнации начинает рассеиваться. Возможно, это краткосрочная мера, но она показала свою реальную эффективность в стимулировании слабого спроса."
 Japan_economy.20.a: "Сейчас самое время переезжать."
 JAP_active_public_investment: "Агрессивные государственные инвестиции"
 JAP_active_public_investment_desc: "If private firms remain cautious, the government must create the demand itself, pushing money into local economies and employment. Public investment restores the sense that movement has finally returned."
 JAP_active_public_investment_decision: "Порядок государственных инвестиций"
 JAP_active_public_investment_decision_desc: "Создавайте спрос посредством государственных мер и восстанавливайте приток денежных средств в местную экономику и занятость."
 Japan_economy.21.t: "Государственные инвестиции демонстрируют признаки восстановления."
 Japan_economy.21.d: "Государственные проекты начинают значить больше, чем показывают одни лишь цифры. Деньги поступают в местные экономики, растет занятость, и знакомая атмосфера экономического пессимизма начинает меняться. Страна наконец-то может почувствовать, что перестала ждать."
 Japan_economy.21.a: "Государство может влиять на экономику."
 JAP_improvement_private_investment_climate: "Улучшение инвестиционного климата для частного сектора"
 JAP_improvement_private_investment_climate_desc: "Одних только государственных расходов недостаточно для завершения восстановления. Необходимо вселить в компании уверенность, чтобы они снова начали инвестировать, и снизить неопределенность в отношении будущего. Для устойчивого восстановления необходимо, чтобы предприятия перешли от оборонной промышленности к расширению."
 JAP_focus_improving_investment_climate: "Уделите внимание улучшению инвестиционного климата."
 JAP_focus_improving_investment_climate_desc: "Правительство уделяет первостепенное внимание созданию более благоприятной среды для инвестиций в бизнес. Политический капитал тратится на координацию, убеждение и институциональные реформы, оставляя меньше места для других краткосрочных инициатив."
 Japan_economy.02.t: "Улучшение инвестиционного климата для частного сектора."
 Japan_economy.02.d: "Предприятия начинают понимать, что постоянная оборонительная позиция означает упущенные возможности. Неопределенность сохраняется, но часть препятствий для новых инвестиций начинает спадать. Впервые восстановление экономики, похоже, больше не будет определяться исключительно государством."
 Japan_economy.02.a: "Частный сектор начинает оживать."
 JAP_stimulating_demand_durable_goods: "Стимулировать спрос на товары длительного пользования"
 JAP_stimulating_demand_durable_goods_desc: "Товары длительного пользования, такие как автомобили, бытовая техника и жилье, могут значительно обогатить экономику, как только спрос начнет расти. Однако во времена стагнации эти покупки часто откладываются в первую очередь. Возобновление их производства придало бы восстановлению видимый импульс и вернуло бы давно утраченное ощущение жизненной энергии."
 JAP_stimulating_demand_durable_goods_decision: "Кампания по стимулированию покупок товаров длительного пользования"
 JAP_stimulating_demand_durable_goods_decision_desc: "Поощряйте крупные покупки, которые откладывались годами, и придайте восстановлению экономики видимый импульс."
 Japan_economy.22.t: "Спрос на товары длительного пользования показывает признаки восстановления"
 Japan_economy.22.d: "Крупные покупки, которые откладывались годами, наконец-то начинают возвращаться. Спрос на товары длительного пользования оказывает широкое влияние на смежные сектора, и это также признак того, что домохозяйства становятся хотя бы немного более оптимистичными в отношении будущего. Восстановление начинает проявляться не только в данных, но и в атмосфере повседневной жизни."
 Japan_economy.22.a: "Позволить этому импульсу распространиться."
 JAP_strict_audits_banks: "Строгие проверки банков"
 JAP_strict_audits_banks_desc: "Многолетние задержки привели к тому, что проблемы банковской системы стали менее заметными, в то время как финансовая нестабильность продолжает нарастать. Первый шаг заключается в том, чтобы вывести опасные проблемные кредиты из тени и заставить банки посмотреть правде в глаза. Это будет болезненно, но без этой боли невозможно достичь подлинного восстановления."
 Japan_economy.23.t: "The Shinsei Put Option"
 Japan_economy.23.d: "The clause is exactly as reported. Every loan the buyers judge to have lost a fifth of its value goes back to the Deposit Insurance Corporation at the price on the books, and the state absorbs the difference. The bank did nothing illegal. It read the contract more carefully than the officials who wrote it, and those officials are still at their desks."
 Japan_economy.23.a: "Publish the contract and name who signed it"
 Japan_economy.24.t: "The Collapse of Sogo"
 Japan_economy.24.d: "The chain cannot be saved and everyone advising the minister knows it. The only question is whether it is wound up in court, where the creditors and the officials who indulged them will be named in public, or restructured behind closed doors with the public share of the debt quietly forgiven."
 Japan_economy.24.a: "Let it fail in open court"
 JAP_injection_public_funds: "Государственное вливание капитала"
 JAP_injection_public_funds_desc: "Нереалистично требовать от ослабленных банков как покрытия убытков, так и возобновления кредитования без оказания им государственной поддержки. Чтобы сохранить доверие к самой финансовой системе, государство должно выступить в качестве последней инстанции и прервать цепь банкротств. Это решение является политически сложным, но уклониться от него практически невозможно."
 Japan_economy.25.t: "Mycal"
 Japan_economy.25.d: "The group's main bank has refinanced it every year since the bubble ended and has now told the ministry it will not do so again. Kansai suppliers who have never dealt with anyone else are already calling their prefectural offices. Whatever is decided this week will be read across the region as a statement about whether the old arrangements still hold."
 Japan_economy.25.a: "Let it go under and audit the bank that carried it"
 JAP_new_lenders: "Привлечь новых кредиторов"
 JAP_new_lenders_desc: "Если существующие банки по-прежнему будут придерживаться оборонительной осторожности, кредитный поток останется слабым. Необходимо стимулировать выход на рынок новых кредиторов, чтобы устранить «узкое место» в самой финансовой системе. Конкуренция и новые каналы притока капитала могут частично восстановить утраченную японской финансовой системой гибкость."
 JAP_new_lenders_idea: "Рост числа новых кредиторов"
 JAP_new_lenders_idea_desc: "Начинают появляться новые источники кредитования помимо традиционных банков. Финансовый застой еще не полностью преодолен, но открываются новые пути для движения капитала в экономике."
 JAP_protection_deposits: "Ввести защиту вкладов"
 JAP_protection_deposits_desc: "Как только вкладчики начинают сомневаться в безопасности своих сбережений, банковский кризис становится реальностью. Поэтому государство должно недвусмысленно дать понять, что вклады будут защищены. Одно только это не сможет полностью восстановить доверие, но все же может стать той преградой, которая не даст панике перерасти в коллапс."
 Japan_economy.26.t: "Resona"
 Japan_economy.26.d: "Strip out the deferred tax assets and the capital ratio collapses. The auditors will not sign, which is itself unprecedented, and the government has days rather than weeks. Two trillion yen makes the bank whole and makes the state its owner. Refusal means the first major bank failure the country has allowed since the war, and nobody can say where it stops."
 Japan_economy.26.a: "Inject the funds and remove the entire board"
 JAP_rehabilitation_small_medium_enterprises: "Кредитная система защиты для малого бизнеса"
 JAP_rehabilitation_small_medium_enterprises_desc: "Disposing of the bad loans risks driving small and medium enterprises into funding distress along with the insolvent. Banks are required to maintain lending to viable SMEs while restructuring finance schemes monitor the credit tightening, putting a barrier in front of the collapse of local economies."
 JAP_rehabilitation_small_medium_enterprises_idea: "Сосредоточиться на стабильности кредитования МСП"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "Политические ресурсы направляются на обеспечение надзора, координацию и поддержку реструктуризации, чтобы не допустить, чтобы урегулирование проблемных кредитов привело к перекрытию кредитования малых и средних предприятий. Это имеет жизненно важное значение для защиты местной экономики, однако оставляет меньше возможностей для действий в других сферах."
 Japan_economy.27.t: "The Ashikaga Bank"
 Japan_economy.27.d: "The prefecture's government, its firms, and a great many of its households bank nowhere else. The examiners' finding is unambiguous: the bank is insolvent and has been for some time. Temporary nationalisation protects every depositor and wipes out every shareholder, many of whom are local companies that were required to hold the stock as a condition of their own lending."
 Japan_economy.27.a: "Nationalise it and write the shareholders down to nothing"
 Japan_economy.28.t: "Daiei"
 Japan_economy.28.d: "The Revitalization Corporation is ready to take it, replace the board, and sell what can be sold. The founder built this company out of the rubble of the war and has friends in the party who remember it. They are asking for one more refinancing, and they are asking loudly."
 Japan_economy.28.a: "Hand it to the Revitalization Corporation"
 Japan_economy.29.t: "The Kanebo Accounts"
 Japan_economy.29.d: "Two hundred billion yen of profit that was never earned, reported across five years, and signed off every time by the same accounting firm. Prosecuting the company is straightforward. Prosecuting its auditors would tell every accounting firm in Japan that the signature is a liability rather than a formality, and it would make a great many other statements suddenly worth re-reading."
 Japan_economy.29.a: "Prosecute the company and suspend its auditors"
 Japan_economy.30.t: "The Federation Stands Down"
 Japan_economy.30.d: "The pressure has come off. The federation has not withdrawn its objections, but it has stopped briefing against the investigation, and the members who were loudest have gone quiet. It is not agreement. It is a judgement that the fight is no longer worth what it costs them."
 Japan_economy.30.a: "We will take the quiet while it lasts."
 Japan_economy.31.t: "The Federation Makes Good on It"
 Japan_economy.31.d: "Capital spending plans across the member companies have been deferred, and every one of them cites uncertainty. The hiring freeze announced this morning is presented as prudence. The message is unmistakable and it is meant to be, and there is no statute that can compel a company to invest."
 Japan_economy.31.a: "They have made their point."
 Japan_economy.06.t: "The Firms Push Back"
 Japan_economy.06.d: "The moment the auditors ask for the real numbers, the lobbying begins. Industry federations warn of mass bankruptcies and lost jobs, and friendly bureaucrats counsel patience. The banks would rather report the losses on their own schedule, if at all. We can compel them, we can let them hand us what they choose, or we can decide this was never worth the trouble."
 Japan_economy.06.a: "Subpoena the books"
 Japan_economy.07.t: "A Bank on the Brink"
 Japan_economy.07.d: "The audit has flushed out a regional lender drowning in bad loans. Force the whole balance sheet into daylight and the panic could spread; contain the disclosure and the rot stays half-hidden, but the markets stay calm. Either way the investigation grinds forward."
 Japan_economy.07.a: "Force full disclosure"
 Japan_economy.08.t: "The Findings Are Published"
 Japan_economy.08.d: "The report goes to the printers. What is in it depends entirely on what the auditors were allowed to find: a catalogue of insolvent firms and the officials who protected them, a partial account with the worst names redacted, or a document that manages several hundred pages without accusing anyone of anything. The public will read it either way, and so will the people who were promised transparent, Western-style markets."
 Japan_economy.08.a: "Publish all of it and let the public judge"
 Japan_economy.09.t: "A Leak from the Ministry"
 Japan_economy.09.d: "The firms knew which auditors were coming and on which morning. Filing cabinets were emptied over a weekend, and two directors are suddenly unreachable on business abroad. Somebody in the ministry is telling them, and everyone in this room can guess who, because he was posted here from the bank he is protecting and will be posted back to it when he retires."
 Japan_economy.09.a: "Accept the loss and move on"
 Japan_economy.10.t: "The Federation Issues an Ultimatum"
 Japan_economy.10.d: "The business federation has come to the Diet with figures of its own: investment postponed, hiring frozen, confidence damaged, all of it laid at the door of the investigation. The message under the courtesy is not subtle. Wind this down, or the members of this federation will find they cannot commit to anything while the uncertainty lasts."
 Japan_economy.10.a: "Let them make their case in public."
 Japan_economy.11.t: "The Prosecutor Falls"
 Japan_economy.11.d: "It was not the investigation that failed. It was a lead prosecutor with a golf membership he did not declare, given to him by a firm on his own list, and a newspaper that has photographs of him accepting it. The minister has resigned to take responsibility. The probe is suspended pending review, which everyone understands to mean pending the point at which the public stops paying attention."
 Japan_economy.11.a: "We have lost the initiative."
 JAP_expectation_of_being_rewarded: "Ожидание вознаграждения"
 JAP_expectation_of_being_rewarded_desc: "Recovery requires restoring the belief that effort will be rewarded in wages and living standards. Without wage growth the stimulus stays temporary, and only that expectation turns a recovery into a self-sustaining one."
 JAP_wage_negotiations: "Вести переговоры о повышении заработной платы"
 JAP_wage_negotiations_decision: "Восстановить доверие к росту заработной платы и не допустить, чтобы восстановление спроса стало лишь временным всплеском стимулирования."
 Japan_economy.12.t: "Переговоры о заработной плате с бизнесом"
 Japan_economy.12.d: "Если восстановление спроса должно стать самоподдерживающимся, заработная плата также должна расти. Однако бизнес остаётся обеспокоенным будущими рисками и давлением на прибыль. Теперь правительство должно решить, насколько решительно ему следует добиваться повышения оплаты труда."
 Japan_economy.12.a: "Стимулировать повышение заработной платы."
 Japan_economy.12.b: "Оказать давление."
 Japan_economy.12.c: "Оставить это частному сектору."
 Japan_economy.14.t: "Рост заработной платы достигает целевого показателя"
 Japan_economy.14.d: "Заработные платы наконец-то начали заметно расти. Важно не только само увеличение доходов, но и возвращение более глубокого ощущения того, что усилия вновь могут быть вознаграждены. Эта смена настроений начинает превращать вялое потребление в нечто более сильное и устойчивое."
 Japan_economy.14.a: "Восстановление становится реальностью."
 Japan_economy.15.t: "Рост заработной платы не достигает целевого показателя"
 Japan_economy.15.d: "Рост заработной платы не достиг поставленной цели, но усилия не были напрасными. Предприятия по-прежнему проявляют осторожность, однако необходимость повышения заработной платы сейчас осознается шире, чем раньше. Этот шаг вперед небольшой, но он всё же важен для преодоления прежней атмосферы застоя."
 Japan_economy.15.a: "Мы продолжим развивать это."
 JAP_price_target_mission_TT: "Уровень инфляции достигает как минимум 2%"
