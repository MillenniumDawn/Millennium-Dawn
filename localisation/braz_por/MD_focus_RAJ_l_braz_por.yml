l_braz_por:
 Cheap_Labor: "Mão de obra barata"
 Cheap_Labor_desc:0 "Nascida de padrões históricos de exploração colonial e de mão-de-obra não qualificada em massa, a força de trabalho de [ROOT.GetName] continua abundante e barata. Embora este excedente de mão-de-obra tenha estimulado o crescimento industrial pós-independência, continua a alimentar um ciclo de desigualdade e agitação social que coloca a estabilidade nacional em terreno instável."
 RAJ_iri_fake_ns: "Indústria Militar Altamente Corrupta"
 RAJ_iri_fake_ns_desc:0 "O legado complexo da era License Raj da Índia, caracterizada por forte regulamentação e burocracia, ainda persiste na indústria de defesa. Embora as reformas da década de 1990 tenham aberto portas para a expansão industrial civil, o setor militar continua sendo uma rede de corrupção e ineficiência, remonta a processos de aquisição opacos e à falta de responsabilização herdada de décadas passadas."
 RAJ_re_fake_militar: "Militar altamente desorganizado"
 RAJ_re_fake_militar_desc:0 "A sombra da partição da Índia e as estruturas militares organizadas às pressas que se seguiram perduram sobre as forças armadas. Juntamente com as ineficiências burocráticas e a falta de métodos modernos de coordenação, isso resulta em um aparato militar desorganizado. No entanto, essas deficiências tornam aparente onde a melhoria é mais urgentemente necessário, reduzindo ligeiramente a drenagem de recursos da reestruturação das doutrinas militares."
 india_divided: "Regionalismo Indiano"
 india_divided_desc:0 "India's vast cultural and linguistic diversity, a legacy of its rich history and countless kingdoms, has often manifested as regionalism that complicates national governance. This mosaic of local interests has historically undermined centralized political power, making cohesive policy-making an arduous task. Yet, there exist various paths - both conciliatory and forceful - to navigate this complex landscape and potentially forge a more unified national identity."
 RAJ_gujarat_trouble_idea: "Agitação Comunal em Gujarat"
 RAJ_gujarat_trouble_idea_desc: "The communal tensions in Gujarat, a legacy of deep-rooted religious and ethnic divisions, have escalated into open conflict between Muslims and Hindus. The situation not only destabilizes the region but also stretches military and administrative resources thin, affecting the readiness and durability of troops deployed in challenging conditions. This unrest persists until both Hindu and Muslim opinion recover to 35 or above, and higher faith opinion eases it further."
 RAJ_looming_water: "Escassez de água"
 RAJ_looming_water_desc:0 "A aguda escassez de água na Índia, agravada por práticas agrícolas insustentáveis e pela rápida urbanização, tem consequências de longo alcance. Não só prejudica a estabilidade social e a governação, mas também dificulta gravemente as operações militares e o apoio logístico. Apesar do seu terrível estado atual, a concertação os esforços na gestão da água e no desenvolvimento de infra-estruturas poderiam aliviar significativamente estes efeitos paralisantes."
 india_focus: "Árvore de Foco Indiana"
 RAJ_indian_minist_of_foreign_affairs:0 "Ministério das Relações Exteriores da Índia"
 RAJ_indian_minist_of_foreign_affairs_desc: "Institutionalizing foreign policy oversight centralizes diplomatic strategy and international engagement."
 RAJ_affairm_claims_on_aksai_chin: "Afirmar reivindicações sobre Aksai Chin"
 RAJ_affairm_claims_on_aksai_chin_desc: "Aksai Chin tem sido motivo de disputa entre a Índia e a China há décadas. A Índia sustenta que a área é parte integrante de seu território soberano, enquanto a China reivindica seus direitos históricos sobre a região. A disputa permanece sem solução e continua sendo uma questão complexa nas relações entre Índia e China."
 indian_event.1.t: "Índia afirma reivindicações sobre Aksai Chin"
 indian_event.1.d: "India has once again affirmed its unwavering claims on Aksai Chin, amidst the persisting territorial dispute with China. The disputed region, situated in the eastern sector of Jammu and Kashmir, has been a long-standing point of contention between the two Asian neighbors. The Indian government restated its position, asserting that Aksai Chin is an integral part of India's sovereign territory. This reaffirmation comes as a resolute response to China's historical claims on the region. The Aksai Chin dispute has been a significant challenge in India-China relations, with both nations holding contrasting views on the territory's rightful ownership. Diplomatic efforts to resolve the issue continue, but a definitive resolution has remained elusive thus far. India's firm stance on its territorial claims underscores its commitment to safeguarding national sovereignty and preserving the unity of its borders. The government remains open to constructive dialogue and peaceful negotiations to address the longstanding dispute and forge a way forward in the interest of regional stability and cooperation. As the situation evolves, both India and China are being closely watched by the international community, which hopes for an amicable resolution to de-escalate tensions and foster mutual understanding."
 indian_event.1.a: "Interessante."
 indian_event.2.t: "India Withdraws Claims from Aksai Chin!"
 indian_event.2.d: "Em um movimento significativo e inesperado, a Índia anunciou sua decisão de retirar as reivindicações sobre a região disputada de Aksai Chin, situada na parte oriental de Jammu e Caxemira. O território tem sido um ponto de longa data de contenção entre a Índia e a China, levando a relações tensas entre os dois países. A decisão do governo indiano de renunciar às reivindicações sobre Aksai Chin constitui um passo ousado para encontrar uma solução pacífica para a disputa territorial. Embora a região tenha sido uma questão controversa durante décadas , este movimento surpreendente reflecte o compromisso da Índia em promover o diálogo e diminuir as tensões com a nação vizinha. A retirada das reivindicações sobre Aksai Chin visa criar uma atmosfera propícia a negociações construtivas com a China, com esperança de uma solução mutuamente aceitável que respeite os interesses. Este desenvolvimento inesperado irá provavelmente captar a atenção da comunidade internacional e os observadores aguardam a resposta da China à medida da Índia. A decisão marca um potencial ponto de viragem nas relações Índia-China e poderá abrir novas possibilidades para a estabilidade e cooperação regional. À medida que a situação evolui, espera-se que tanto a Índia como a China se envolvam em conversações diplomáticas para explorar o caminho a seguir, garantindo a coexistência pacífica e a prosperidade dos dois gigantes asiáticos."
 RAJ_friendship_with_china: "Amizade com a China"
 RAJ_friendship_with_china_desc: "Devemos esquecer os nossos conflitos passados e garantir uma paz completa e estável entre os nossos países."
 RAJ_strat_milcoop_china: "Cooperação Militar com a China"
 RAJ_strat_milcoop_china_desc: "A cooperação militar com a China é altamente necessária para que nossos militares cooperem e aumentem nossa eficiência em batalha."
 RAJ_partnership_with_tajikistan: "Parceria com o Tajiquistão"
 RAJ_partnership_with_tajikistan_desc: "A Índia e o Tajiquistão compartilham um forte vínculo de amizade baseado em laços históricos, culturais e estratégicos. Ambas as nações têm uma longa história de interações estreitas e intercâmbio cultural. A Índia tem fornecido assistência ao desenvolvimento e conhecimento técnico ao Tajiquistão em vários setores, incluindo desenvolvimento de infraestrutura, educação e saúde. Além disso, ambos os países têm cooperado nas áreas de defesa e segurança, com a Índia treinando o pessoal de defesa do Tajiquistão e fornecendo ajuda militar. O Tajiquistão, por outro lado, tem apoiado consistentemente a posição da Índia em várias questões internacionais. . "
 RAJ_withdraw_claims_on_aksai_chin: "Retirar reivindicações de Aksai Chin"
 RAJ_withdraw_claims_on_aksai_chin_desc: "Retirar as reivindicações de Aksai Chin é essencial para desenvolver as relações com a China e aliviar as tensões entre nossos países."
 RAJ_aksai_chin_withdraw_tt: "§YNão será mais capaz de se envolver em conflitos de fronteira com §B[CHI.GetNameDef]§! por causa de Aksai Chin.§!"
 RAJ_push_the_kasmir_question: "Empurre a questão da Caxemira"
 RAJ_push_the_kasmir_question_desc: "Impulsionar a questão da Caxemira é crucial para pressionar o agressivo Paquistão!"
 RAJ_kashmir_quest_tt: "§YIsso aumentará as tensões entre Índia e Paquistão§!"
 RAJ_increase_regional_influence: "Aumentar a influência regional"
 RAJ_protect_asian_allies: "Proteja os Aliados Asiáticos"
 RAJ_protect_asian_allies_desc: "Para combater o domínio da China na região, devemos apoiar Mianmar e os seus assuntos."
 RAJ_partnership_with_iran: "Parceria com o Irã"
 RAJ_partnership_with_iran_desc: "Iran ties provide trade access and strategic presence in the Indian Ocean region."
 RAJ_increase_regional_influence_desc: "Expanding political and economic leverage across South Asia and the Indian Ocean."
 RAJ_new_army_idea: "Novo Exército Indiano"
 RAJ_indian_saarc_idea: "SAARC"
 RAJ_indian_saarc_idea_desc: "The South Asian Association for Regional Cooperation, established in 1985, binds together the major South Asian states for development and policy coordination. Indian leadership of the bloc adds political weight to the home cabinet and improves trade relations with member states."
 RAJ_saarc: "Associação do Sul da Ásia para Cooperação Regional"
 RAJ_saarc_desc: "SAARC ties bind South Asia through trade and development, though regional tensions constrain deeper integration."
 indian_event.3.t: "A Índia nos convida para a Associação do Sul da Ásia para Cooperação Regional"
 indian_event.3.d: "A Índia nos convida para a Associação do Sul da Ásia para Cooperação Regional, devemos concordar em participar?"
 indian_event.3.a: "Claro."
 indian_event.3.b: "Desculpe, não."
 RAJ_act_east_policy: "Agir Política do Leste"
 RAJ_act_east_policy_desc: "Deepening Asia-Pacific engagement pivots India toward Southeast Asia and regional economic integration."
 act_east_pol_tt: "§YVamos iniciar o Programa de Políticas Act East§!"
 RAJ_asean_partner: "Parceria com ASEAN"
 RAJ_asean_partner_desc: "Partnership with ASEAN strengthens Southeast Asian ties through trade and political coordination, despite regional rivalries."
 RAJ_east_asia_summit: "Cúpula do Leste Asiático"
 RAJ_east_asia_summit_desc: "Em consonância com nossa Política de Agir para o Leste, participar da Cúpula do Leste Asiático representa um passo crucial para aprofundar nossos laços diplomáticos e empreendimentos colaborativos. Ao fortalecer laços com atores-chave como Rússia, Japão e Laos, pavimentamos o caminho para um futuro regional mais integrado e harmonioso."
 RAJ_eastas.1.t: "Cúpula do Leste Asiático"
 RAJ_eastas.1.d: "A 18ª Cúpula do Leste Asiático (EAS) foi realizada virtualmente hoje, reunindo líderes de 18 países membros para discutir desafios regionais urgentes e promover a cooperação na região do Leste Asiático. Hospedada por Cingapura, a cúpula serviu como uma plataforma para diálogo aberto e colaboração, visando fomentar a paz, estabilidade e prosperidade na região. A EAS contou com a participação de líderes representando os estados membros da ASEAN, juntamente com Austrália, China, Índia, Japão, Nova Zelândia, Coreia do Sul, Rússia e Estados Unidos. Esta reunião diversificada e inclusiva reflete o compromisso da cúpula com o engajamento e diálogo regionais inclusivos. Durante a cúpula, os líderes participaram de discussões francas sobre uma ampla gama de questões, incluindo recuperação econômica na era pós-pandemia, estratégias de mitigação e adaptação às mudanças climáticas, segurança marítima, esforços de combate ao terrorismo e medidas para combater crimes transnacionais. Além disso, os líderes abordaram desafios geopolíticos e enfatizaram a importância de manter a lei internacional, respeitar a soberania e manter uma ordem baseada em regras na região do Indo-Pacífico."
 RAJ_eastas.1.o1: "Interessante."
 RAJ_neutrality_idea: "A Política de Neutralidade"
 RAJ_neutrality_idea_desc:0 "A política de neutralidade da Índia visa manter o nosso delicado equilíbrio de permanecer fora das questões mundiais. É hora de seguirmos o caminho de nos afastarmos desses grupos e declararmos a Índia uma nova nação neutra."
 RAJ_bimstek: "BIMSTEC"
 RAJ_bimstek_desc: "A Iniciativa da Baía de Bengala para Cooperação Técnica e Econômica Multissetorial é uma organização regional que compreende sete nações ao redor da Baía de Bengala: Índia, Bangladesh, Sri Lanka, Butão, Nepal, Mianmar e Tailândia. Fundada em 1997, BIMSTEC visa promover a cooperação em vários setores, incluindo comércio, investimento, energia, tecnologia, turismo e combate ao terrorismo, entre outros. Este agrupamento sub-regional está estrategicamente posicionado para melhorar a conectividade e a integração económica no Sul e Sudeste Asiático. Embora a BIMSTEC tenha Com um enorme potencial, o progresso tem sido por vezes dificultado por desafios políticos e logísticos, incluindo a conectividade limitada entre os seus estados membros. No entanto, continua a ser uma plataforma significativa para promover a cooperação e o desenvolvimento numa região geográfica e culturalmente diversa, especialmente à medida que as nações procuram reforçar estabilidade regional e crescimento econômico."
 RAJ_indian_bimstek_idea: "BIMSTEC"
 RAJ_indian_bimstek_idea_desc: "The Bay of Bengal Initiative for Multi-Sectoral Technical and Economic Cooperation, founded in 1997, links India with Bangladesh, Sri Lanka, Bhutan, Nepal, Myanmar, and Thailand for coordinated trade, energy, and counter-terrorism work. Cooperation drives modest gains in domestic research speed and political stability."
 indian_event.4.t:0 "Convite para BIMSTEK"
 indian_event.4.d:0 "A Índia nos convida para o programa de parceria BIMSTEK, devemos aderir?"
 indian_event.4.a: "Claro!"
 indian_event.4.b: "Desculpe, não."
 RAJ_befriend_butan_and_nepal: "Faça amizade com o Nepal e o Butão"
 RAJ_befriend_butan_and_nepal_desc: "Índia, Butão e Nepal compartilham laços históricos, culturais e geográficos profundamente enraizados. A Índia tem desempenhado historicamente um papel crucial no desenvolvimento e estabilidade dessas nações do Himalaia. O Butão desfruta de um relacionamento único com a Índia, marcado por estreita cooperação diplomática cooperação económica e estratégica. A Índia ajudou o Butão em vários projectos de desenvolvimento e questões de segurança, mantendo uma parceria forte e amigável."
 RAJ_support_nov_idea: "Apoio Militar Indiano"
 RAJ_support_neaplese_army: "Support the Nepalese Army"
 RAJ_support_neaplese_army_desc: "A cooperação militar Índia-Nepalesa tem uma base histórica baseada na proximidade geográfica e nas preocupações de segurança mútua. Os dois países têm uma tradição de intercâmbio militar, treinamento e laços estreitos de defesa. A Índia tem sido um fornecedor significativo de equipamento militar para o Nepal , incluindo armas, munições e hardware. Ambas as nações colaboram em questões como contraterrorismo, gestão de desastres e manutenção da estabilidade regional. Além disso, os regimentos Gurkha do exército indiano têm uma forte ligação histórica com o Nepal, recrutando soldados da região. "
 RAJ_mutual_trade_agreements: "Acordos comerciais mútuos"
 RAJ_mutual_trade_agreements_desc: "A cooperação empresarial entre a Índia e o Butão é caracterizada por uma parceria económica forte e multifacetada, profundamente enraizada em laços históricos e interesses mútuos. O Butão é um beneficiário significativo do apoio econômico e da assistência ao desenvolvimento da Índia, sendo a Índia o maior parceiro comercial do Butão e fonte de investimento estrangeiro. As principais áreas de cooperação incluem projectos hidroeléctricos, onde empresas indianas estão envolvidas em joint ventures para desenvolver o abundante potencial hidroeléctrico do Butão. Isto não só ajuda o crescimento econômico do Butão, mas também satisfaz as necessidades energéticas da Índia."
 RAJ_befriend_bangladesh: "Faça amizade com Bangladesh"
 RAJ_befriend_bangladesh_desc: "O comércio entre a Índia e Bangladesh aumentou, impulsionado pela melhoria da infraestrutura e por acordos comerciais preferenciais. Ambos os países colaboraram em grandes projetos, como a construção de rodovias transfronteiriças e linhas de transmissão de energia, melhorando a conectividade regional. Além disso, trabalharam juntos em questões como contraterrorismo, segurança e gestão de desastres."
 RAJ_defense_bangladesh: "Pacto de Defesa de Bangladesh"
 RAJ_defense_bangladesh_desc: "Através de uma série de acordos e entendimentos, a Índia e o Bangladesh reforçaram efectivamente os seus laços de defesa. Deveríamos ratificar um acordo-quadro para a cooperação em defesa que seja historicamente significativo porque irá avançar significativamente a nossa aliança de segurança. Melhorar o intercâmbio militar, o treino e a colaboração no contraterrorismo e na segurança marítima são abordadas por esta estrutura."
 RAJ_border_agreements: "Acordos de Fronteira com Bangladesh"
 RAJ_border_agreements_desc:0 "Além de remover uma fonte significativa de atrito, esta decisão abrirá as portas para mais conexão e cooperação entre os dois países. Mais de 50.000 pessoas que vivem em enclaves poderão fazer intercâmbio, ganhando cidadania em seus países de origem. Além disso, , tornará possível a realização de uma série de iniciativas de desenvolvimento, tais como a construção de estradas, pontes e outras infra-estruturas ao longo das zonas fronteiriças recentemente estabelecidas."
 indian_event.5.t: "Border Agreement with India"
 indian_event.5.d: "A Índia propõe um acordo de fronteira conosco para que possamos resolver nossas disputas fronteiriças e continuar a cooperação mútua."
 indian_event.5.a: "Claro."
 indian_event.5.b: "Isso é demais!"
 RAJ_suppress_probangl_separat: "Suprimir o separatismo pró-Bangladesh"
 RAJ_suppress_probangl_separat_desc: "Embora os nossos laços de defesa com o Bangladesh tenham sido fortalecidos, ainda existe um sentimento marginal que defende uma união mais estreita com o nosso vizinho oriental. É fundamental para a integridade nacional que abordemos e suprimamos estas inclinações separatistas, garantindo uma Índia estável e unida. "
 RAJ_approach_singapore: "Aproximar-se de Singapura"
 RAJ_approach_singapore_desc: "Cingapura é nosso parceiro neutro de longa data na região asiática. Precisamos melhorar nosso relacionamento com eles."
 RAJ_meaf: "MEAF"
 RAJ_meaf_desc: "Os mercados do Médio Oriente e de África tornaram-se bastante importantes após várias transformações nas suas regiões. Precisamos de melhorar as relações com eles não só em termos comerciais, mas também em termos militares e políticos."
 RAJ_partnership_with_uae: "Parceria com os Emirados Árabes Unidos"
 RAJ_partnership_with_uae_desc: "Strengthening ties with the UAE expands Gulf trade and strategic influence."
 RAJ_gulf_oil_deal: "Acordo de petróleo do GCC"
 RAJ_gulf_oil_deal_desc: "A Índia necessita muito de combustível e petróleo. A cooperação com os países do Golfo é uma chave direta para atender às nossas necessidades."
 RAJ_oman_military_base: "Oman Military Base"
 RAJ_oman_military_base_desc: "Omã e a Índia compartilham não apenas laços culturais e históricos, mas também políticos, bem como interesses comuns na região. Precisamos fortalecer os laços."
 RAJ_befriend_algeria: "Faça amizade com a Argélia"
 RAJ_befriend_algeria_desc: "A Argélia é um dos poucos países com os quais temos um elevado volume de negócios comerciais no Norte de África. Talvez em breve eles queiram aprofundar a sua relação connosco e precisamos de criar um bom terreno para isso."
 RAJ_utilizing_indian_diaspora: "Laços da Diáspora"
 RAJ_utilizing_indian_diaspora_desc: "Leveraging the global Indian diaspora enhances trade connections and diplomatic influence abroad."
 RAJ_mauritius: "Amizade com Maurício"
 RAJ_mauritius_desc: "Há uma diáspora significativa nas Maurícias, que tem uma grande influência na política do país. É hora de usar isso para fortalecer os laços."
 RAJ_srilank_relat: "Faça amizade com o Sri Lanka"
 RAJ_srilank_relat_desc: "Historicamente, as relações entre o Sri Lanka e a Índia têm sido muito cordiais. Tendo raízes históricas, o povo do Sri Lanka nos trata com muita gentileza. Podemos considerar este país fraterno e nossas relações com eles devem ser melhoradas."
 RAJ_seychelles: "Faça amizade com Seychelles"
 RAJ_seychelles_desc: "As Seicheles há muito procuram encontrar uma alternativa geopolítica para fortalecer os laços comerciais, as capacidades de defesa e a cooperação em termos de tecnologia. A amizade com a Índia é uma escolha natural para eles."
 RAJ_tradepar_china: "Parceria Comercial com a China"
 RAJ_tradepar_china_desc: "Apesar de termos relações tensas com a China, a parceria comercial com eles ainda é necessária para ambas as nossas economias."
 RAJ_eastern_affiars: "Assuntos Orientais"
 RAJ_eastern_affiars_desc: "India traditionally enjoys good relations with emerging powers. We must leverage this to improve diplomatic and trade relations."
 RAJ_stratpar_russi: "Parceria Estratégica com a Rússia"
 RAJ_stratpar_russi_desc: "Apesar das boas relações entre a China e a Rússia, a Rússia tem sido nosso parceiro confiável no domínio do comércio e da defesa desde os tempos da URSS. É hora de renovar esta relação."
 RAJ_stratpar_soaf: "Parceria Estratégica com a África do Sul"
 RAJ_stratpar_soaf_desc: "A África do Sul é uma das economias que mais cresce no mundo. Tal como nós, eles estão empenhados em melhorar o comércio global e em encontrar parceiros."
 RAJ_stratpar_braz: "Parceria Estratégica com o Brasil"
 RAJ_stratpar_braz_desc: "Brazil has long been on remotely good terms. We must find methods of improving trade with them and strengthening political ties."
 RAJ_looking_west: "Olhando para o oeste"
 RAJ_looking_west_desc:0 "Apesar de sua posição tradicionalmente neutra, a Índia tem relações relativamente boas com os países ocidentais, que vêm não apenas do comércio, mas também de um inimigo comum - a China."
 RAJ_friendship_with_israel: "Amizade com Israel"
 RAJ_friendship_with_israel_desc: "As relações Índia-Israel têm uma longa história de cooperação conjunta. No novo século 21, essas conexões precisam ser confirmadas."
 RAJ_friendship_with_france: "Amizade com a França"
 RAJ_friendship_with_france_desc: "Depois de assinar um pacto estratégico com a França em 1998, a França tornou-se um dos maiores parceiros da Índia na NATO. Estas relações precisam de ser aprofundadas de forma produtiva."
 RAJ_become_major_non_nato_allies: "Aliado à OTAN"
 RAJ_become_major_non_nato_allies_desc: "Talvez, para podermos ir contra a China e o Paquistão, precisemos de melhorar as relações com o Ocidente o suficiente para assinar uma associação com a NATO ou mesmo algo mais. Dadas as tendências actuais, talvez o Ocidente nos encontre de mãos abertas ."
 RAJ_military_coop_with_us: "Cooperação Técnico-Militar com os EUA"
 RAJ_military_coop_with_us_desc: "Os EUA são uma superpotência, com os desenvolvimentos mais avançados em termos de defesa. Precisamos cooperar com eles e melhorar as nossas capacidades de defesa."
 RAJ_tradedeals_with_us: "Acordos comerciais com os EUA"
 RAJ_tradedeals_with_us_desc: "O comércio com os Estados Unidos é um passo consistente na nossa política de cooperação com o Ocidente. Encontraremos algo de interesse mútuo em termos de comércio."
 indian_event.6.t: "Proposta Indiana"
 indian_event.6.d: "Desde o recente alinhamento indiano conosco, eles nos pedem para revogar o status de principal aliado não pertencente à OTAN do Paquistão."
 indian_event.6.a: "Claro!"
 indian_event.6.b: "Desculpe, não."
 indian_event.667.t: "EUA concordam."
 indian_event.667.d: "Eles removerão o status de MNNA do Paquistão."
 indian_event.667.a: "Ótimo"
 indian_event.668.t: "Os EUA negaram nossa proposta."
 indian_event.668.d: "O Paquistão continuará a ser um importante aliado não pertencente à OTAN dos EUA."
 indian_event.668.a: "Disappointing."
 RAJ_support_taiwan: "Apoie Taiwan"
 RAJ_support_taiwan_desc: "Embora Taiwan reivindique muitos territórios que são contrários aos nossos interesses, pode valer a pena apoiá-los contra um inimigo comum - a RPC."
 RAJ_indian_modern_prog: "Candidatando-se à USAID"
 RAJ_indian_modern_prog_desc: "Os programas de ajuda americanos há muito se tornaram comuns na Índia. Pode valer a pena melhorar e fortalecer a cooperação nesta área."
 RAJ_joining_nato: "A NATO Partnership"
 RAJ_joining_nato_desc: "NATO operates exclusively in the Euro-Atlantic region, so full membership is out of reach. We can still pursue the next best thing: Major Non-NATO Ally status, opening the door to joint exercises, technology transfers, and a privileged defence relationship with the West."
 RAJ_SCO_join: "Ingressando no SCO"
 RAJ_SCO_join_desc: "Embora a nossa relação com a China seja tensa, a nossa relação com a Rússia é bastante produtiva. Talvez consigamos entrar na estrutura da SCO, apesar de todas as contradições com a RPC."
 RAJ_cont_non_aligned_polic: "Continuar o caminho não alinhado"
 RAJ_cont_non_aligned_polic_desc: "A Índia tem tradicionalmente trilhado o caminho do não-alinhamento e da neutralidade completa. Não devemos procurar novos aliados e cruzar os limites do que é permitido. Devemos manter distância."
 RAJ_isolationist_policies: "Políticas de Isolacionismo"
 RAJ_isolationist_policies_desc: "Apesar do nosso comércio, o isolamento social do resto do mundo pode ser benéfico."
 RAJ_boosting_our_local_market: "Boosting Local Market"
 RAJ_boosting_our_local_market_desc: "Fortalecer o mercado interno é um passo consistente para alcançar a autonomia completa da Índia em relação a este mundo."
 RAJ_active_support_of_stete_woned_shiet: "Suporte Ativo"
 RAJ_active_support_of_stete_woned_shiet_desc: "Devemos apoiar não só as relações de mercado no país, mas também as empresas estatais que irão regular os aspectos mais importantes da economia."
 RAJ_india_first: "Índia primeiro"
 RAJ_india_first_desc: "A Índia deve estar acima de todas as coisas. Estamos sozinhos neste mundo e precisamos perceber isso."
 RAJ_indian_autarky_effort: "Esfera de Influência Indiana"
 RAJ_indian_autarky_effort_desc: "Chegou a hora não apenas de melhorar as relações com nossos parceiros, mas também de construir nossa própria esfera de influência."
 RAJ_self_sufficient_market: "Ideias da Nova Onda"
 RAJ_self_sufficient_market_desc: "É hora de admitir que nosso caminho é um novo marco no paradigma ideológico da Índia - estamos construindo nosso próprio e novo futuro."
 RAJ_asking_nato_help_pak: "Expulsar o Paquistão"
 RAJ_asking_nato_help_pak_desc: "O Paquistão é há muito tempo um aliado dos EUA fora da OTAN. Precisamos excluir a sua presença na cooperação com o Ocidente e tomar o seu lugar."
 RAJ_indias_politics: "Política Indiana"
 RAJ_indias_politics_desc: "A política indiana está no ponto de viragem de um milénio para outro. Como será construída a sua história?"
 indian_event.7.t: "Política Indiana"
 indian_event.7.d: "India faced a combination of political and economic challenges in the new millennium, as the nation sought to navigate through a complex landscape and address pressing issues. The new millennium brought forth a range of hurdles that tested the resilience of India's democratic institutions and economic stability. On the political front, the country witnessed a fragmented political landscape marked by coalition governments and frequent changes in leadership. This created a certain degree of instability and hindered the implementation of crucial reforms. The absence of a clear majority in the central government made decision-making a challenging process, often requiring delicate negotiations with various regional and ideological partners. Economically, India struggled with persistent issues such as fiscal deficits, slow industrial growth, and unemployment. The economy faced hurdles in fully capitalizing on the reforms initiated in the 1990s, and certain sectors experienced sluggish growth. Structural challenges, bureaucratic red tape, and inadequate infrastructure hampered the ease of doing business and limited the country's potential for rapid economic expansion. Additionally, India witnessed the devastating impact of the dot-com bubble burst, which had ripple effects on the Indian information technology sector. Several IT companies faced setbacks as global markets experienced a downturn, leading to layoffs and financial strain within the industry. Amid these challenges, the government focused on policy measures to boost economic growth, attract foreign investments, and encourage entrepreneurship. Steps were taken to enhance infrastructure development, streamline regulations, and stimulate industrial activities. However, the impact of these initiatives took time to manifest and required sustained efforts to yield positive results. Despite the hurdles faced, India's resilience and democratic fabric remained intact. The country's vibrant civil society, independent judiciary, and free press played critical roles in ensuring accountability and promoting public discourse on vital issues."
 indian_event.7.a: "Interessante."
 RAJ_atal_bihari_vajpayee: "Atal Bihari Vajpayee"
 RAJ_atal_bihari_vajpayee_desc: "Atal Bihari Vajpayee é um eminente estadista indiano e uma figura proeminente na política indiana. Ele serviu como primeiro-ministro da Índia em três ocasiões distintas: primeiro por um breve período em 1996, depois de 1998 a 1999 e, finalmente, a partir de 1999 .Vajpayee foi membro fundador do Partido Bharatiya Janata e um líder importante do Rashtriya Swayamsevak Sangh, uma organização nacionalista hindu."
 RAJ_lahore_summit_legacy: "Legado da Cúpula de Lahore"
 RAJ_lahore_summit_legacy_desc: "A Declaração de Lahore foi um acordo bilateral e tratado de governança entre a Índia e o Paquistão. O tratado foi assinado em 21 de fevereiro de 1999, na conclusão de uma cimeira histórica em Lahore, e ratificado pelos parlamentos de ambos os países no mesmo ano. Sob os termos do tratado, um entendimento mútuo foi alcançado para o desenvolvimento de arsenais atômicos e para evitar o uso operacional acidental e não autorizado de armas nucleares.A Declaração de Lahore trouxe responsabilidade adicional à liderança de ambas as nações para evitar a corrida nuclear, bem como ambos não -conflitos convencionais e convencionais."
 RAJ_prevention_of_terror_act: "Lei de Prevenção do Terrorismo"
 RAJ_prevention_of_terror_act_desc: "Lei nº 15 de 2002, uma lei que estabelece disposições para a prevenção e para lidar com atividades terroristas e para assuntos relacionados a elas."
 indian_event.8.t: "Resolvendo protestos em Gujarat"
 indian_event.8.d: "A agitação foi desencadeada por um incidente em que um comboio que transportava peregrinos hindus foi incendiado, resultando na morte de várias pessoas. O incidente foi atribuído a um suposto ataque de uma multidão muçulmana. O rescaldo do incidente do comboio assistiu à violência generalizada, com confrontos comunitários entre comunidades hindus e muçulmanas em várias partes de Gujarat. Os protestos e tumultos subsequentes resultaram na perda de centenas de vidas, feridos e danos significativos a propriedades. O que deveríamos fazer?"
 indian_event.8.a: "Modi fará o trabalho!"
 indian_event.8.b: "Esperemos que os protestos se acalmem sozinhos."
 RAJ_settling_down_gujarat: "Acalmando protestos em Gujarat"
 RAJ_settling_down_gujarat_desc: "The violence erupted following a train fire in Godhra, which claimed the lives of 59 people, mostly Hindu pilgrims. Subsequently, widespread communal clashes ensued in various parts of Gujarat, resulting in the loss of hundreds of lives and the displacement of thousands of people."
 RAJ_eastas.2.t: "Nações formam uma nova aliança para fortalecer a cooperação econômica global"
 RAJ_eastas.2.d: "Em um desenvolvimento significativo para a economia global, as nações Brasil, Rússia, Índia e China formaram oficialmente uma aliança conhecida como BRIC. A criação desta nova aliança visa reforçar a cooperação econômica, melhorar o comércio laços e promover um mundo mais interligado. A formação do BRIC marca um ponto de viragem na dinâmica económica global, uma vez que estas quatro nações representam colectivamente uma parte substancial da população mundial, da massa terrestre e da produção económica. Juntas, elas possuem um enorme potencial para impulsionar o crescimento econômico global e a promoção do desenvolvimento sustentável. A base do BRIC assenta em objectivos partilhados e benefícios mútuos. Ao alavancar os seus recursos combinados, as nações do BRIC aspiram a promover o crescimento econômico inclusivo e equilibrado, a melhorar os fluxos comerciais e de investimento e a fornecer uma plataforma para a cooperação em vários sectores. , incluindo finanças, energia, infraestrutura e tecnologia. Esta aliança recém-formada é uma promessa significativa para os países membros. Brasil, Rússia, Índia e China trazem para a mesa pontos fortes e capacidades únicas. O Brasil possui recursos naturais abundantes e um setor agrícola vibrante, enquanto a Rússia é conhecida pelas suas reservas energéticas e capacidade tecnológica. O setor de serviços em expansão e a mão-de-obra qualificada da Índia contribuem para o seu poder econômico, e as capacidades de produção e de exportação da China são reconhecidas em todo o mundo."
 RAJ_eastas.2.o1: "Interessante."
 RAJ_BRICS: "Membro do BRICS"
 indian_event.9.t: "Torre BRICS"
 indian_event.9.d: "Um novo projeto foi proposto em um fórum econômico recente para construir uma Torre BRICS para fins de um novo banco internacional."
 indian_event.9.a: "Maravilhoso"
 RAJ_tower_tt: "§YThis will increase Chinese influence on us, but will improve our economy§!"
 RAJ_BRICS_tower_project: "Projeto Torre BRICS"
 RAJ_BRICS_tower_project_desc: "Para fortalecer os laços interestaduais, precisamos criar um novo Banco de Desenvolvimento para todos os países membros do BRICS."
 RAJ_BRICS_bank: "Banco BRICS"
 indian_event.10.t: "Proposta do Banco BRICS"
 indian_event.10.d: "O Banco BRICS propôs um projeto de desenvolvimento para cada estado membro. Devemos concordar?"
 indian_event.10.a: "Claro."
 indian_event.10.b: "Desculpe, não."
 RAJ_BRICS_payment_system: "Sistema de Pagamento BRICS"
 RAJ_BRICS_payment_system_desc: "Para melhorar e simplificar a negociação, precisamos criar um novo sistema de transações e de pagamentos."
 RAJ_BRICS_cur: "Esforços de Moeda Comum do BRICS"
 indian_event.11.t: "Projeto de moeda comum"
 indian_event.11.d: "BRICS propôs um novo projeto de moeda comum, devemos concordar?"
 indian_event.11.b: "Desculpe, não."
 RAJ_common_currenc_project: "Projeto de moeda comum"
 RAJ_common_currenc_project_desc: "Este projeto pode não ser implementado imediatamente, mas a conceituação de uma moeda comum é uma boa base para integração mútua."
 RAJ_BRICS_contig_reserv_arrang: "Acordo de Reserva Contingente"
 RAJ_BRICS_contig_reserv_arrang_desc: "O Arranjo Contingente de Reservas do BRICS é uma estrutura para fornecer proteção contra pressões de liquidez global. Isso inclui questões cambiais em que as moedas nacionais dos membros estão sendo adversamente afetadas por pressões financeiras globais."
 RAJ_eastas.3.t: "Crescimento econômico dos BRICS para um futuro inovador."
 RAJ_eastas.3.d: "The 11th BRICS Summit, held in Brasilia, Brazil, has come to a successful close, showcasing the commitment of Brazil, Russia, India, China, and South Africa to fostering cooperation and driving economic growth. The leaders of the member nations gathered in the Brazilian capital for two days of deliberations, discussions, and bilateral meetings. The summit commenced with an opening ceremony, during which President of Brazil welcomed the heads of state and emphasized the importance of strengthening the BRICS partnership to navigate global challenges and unlock new opportunities. The leaders engaged in comprehensive discussions on a wide range of issues, including trade, investment, innovation, and geopolitical concerns."
 RAJ_eastas.3.o1: "Interessante."
 RAJ_BRICS_pro_tempore: "Cúpula no Brasil"
 RAJ_BRICS_pro_tempore_desc: "Chegou a hora de convocar a maior cúpula da história da organização para fortalecer as relações entre os estados."
 indian_event.12.t: "Convite do BRICS"
 indian_event.12.d: "Há muito tempo somos observadores na Organização BRICS. Eles nos propõem aderir. Devemos fazer isso?"
 indian_event.11.a: "Claro."
 indian_event.12.b: "Desculpe, não."
 RAJ_eastas.4.t: "Irã se junta ao BRICS"
 RAJ_eastas.4.d: "Em um desenvolvimento significativo, a República Islâmica do Irã aderiu oficialmente ao grupo BRICS, que compreende Brasil, Rússia, Índia, China e África do Sul. Esta expansão do bloco BRICS marca um marco na economia regional e global cooperação, à medida que o Irã se torna a primeira nação do Oriente Médio a aderir à influente associação. A decisão foi anunciada durante a 12ª Cúpula do BRICS, realizada virtualmente devido às circunstâncias globais em curso. A inclusão do Irã no BRICS é resultado de extensas discussões entre os membros nações, destacando a importância estratégica do país e o potencial para a colaboração económica. A participação do Irão não só aumentará a influência regional dos BRICS, mas também promoverá uma maior cooperação entre o Médio Oriente e outras nações do BRICS."
 RAJ_eastas.4.o1: "Interessante."
 RAJ_BRICS_expansion: "Expansão do BRICS"
 RAJ_BRICS_expansion_desc: "À medida que o BRICS continua a evoluir como uma aliança significativa, convidar o Irão, uma nação com recursos ricos e importância estratégica, irá adicionar uma nova dimensão. Esta inclusão pode diversificar e fortalecer a nossa visão colectiva, reforçando a influência global da aliança."
 RAJ_BRICS_as_econ_alliance: "Aliança Econômica"
 RAJ_BRICS_as_econ_alliance_desc: "Além dos esforços militares, o verdadeiro potencial dos BRICS reside no aproveitamento do seu poder econômico combinado. Ao defender uma frente económica unida, os países membros podem esperar um crescimento acelerado, estabilidade financeira e maiores sinergias, solidificando a posição do bloco na arena económica global ."
 brics_coalition: "Pacto BRICS-DEF"
 RAJ_BRICS_as_polit_alliance: "Pacto de Defesa do BRICS"
 RAJ_BRICS_as_polit_alliance_desc: "Unidos em nossos objetivos para uma dinâmica de poder global equilibrada, a formulação de um Pacto de Defesa do BRICS é uma progressão natural. Este pacto garantirá assistência de defesa mútua, cimentando o vínculo entre os estados membros e garantindo a segurança coletiva contra ameaças externas."
 RAJ_new_development_bank: "Novo Banco de Desenvolvimento"
 RAJ_new_development_bank_desc: "O novo Banco de Desenvolvimento deve se tornar a base para a integração do BRICS e para melhorar as relações entre os estados membros."
 RAJ_recognition_tibet_as_china: "Reconhecimento do Tibete como parte da China"
 RAJ_recognition_tibet_as_china_desc: "O governo da Índia, logo após a independência da Índia em 1947, tratou o Tibete como um país independente de facto. No entanto, mais recentemente, a política da Índia em relação ao Tibete esteve atenta às sensibilidades chinesas e reconheceu o Tibete como parte da China."
 RAJ_national_highway_project: "Projeto Rodovia Nacional"
 RAJ_national_highway_project_desc: "O Projeto de Desenvolvimento de Rodovias Nacionais é um projeto de quatro pistas de rodovias nacionais existentes e seis pistas das principais rodovias nacionais selecionadas da Índia. O projeto foi iniciado em 1998 sob a liderança do primeiro-ministro, Atal Bihari Vajpayee. As rodovias nacionais são responsáveis por apenas cerca de 2% da extensão total das estradas, mas transportam cerca de 40% do tráfego total em todo o país."
 RAJ_eastas.5.t: "A Índia reconhece o Tibete como China"
 RAJ_eastas.5.d: "Numa tentativa de acelerar a resolução da disputa fronteiriça, a Índia e a China concordaram na terça-feira em nomear um representante especial para explorar, do ponto de vista político da relação bilateral geral, um quadro para a resolução da fronteira. Na primeira declaração conjunta de Princípios de Relações e Cooperação Abrangente assinada pelo Primeiro-Ministro Atal Bihari Vajpayee e pelo seu homólogo chinês Wen Jiabao, a Índia reconheceu que a Região Autónoma Tibetana faz parte do território da República Popular da China."
 RAJ_eastas.5.o1: "Interessante."
 RAJ_pradhan_mantri_gram_sadak_yojana: "Pradhan Mantri Gram Sadak Yojana"
 RAJ_pradhan_mantri_gram_sadak_yojana_desc: "O Pradhan Mantri Gram Sadak Yojana é um plano nacional na Índia para fornecer boa conectividade rodoviária em qualquer clima para aldeias não conectadas."
 RAJ_article_three_seventy: "Artigo 370"
 RAJ_article_three_seventy_desc: "O artigo 370 da Constituição indiana conferiu um estatuto especial a Jammu e Caxemira, uma região localizada na parte norte do subcontinente indiano e parte da região maior da Caxemira, que tem sido objeto de disputa entre a Índia, o Paquistão e a China desde 1947."
 RAJ_sarva_shisha_abhiyan: "Sarva Shisha Abhiyan"
 RAJ_sarva_shisha_abhiyan_desc: "Sarva Shiksha Abhiyan, ou SSA, é um programa do governo indiano que visa a universalização do ensino fundamental \"de maneira limitada\", a 86ª Emenda à Constituição da Índia torna a educação gratuita e obrigatória para crianças com idades entre 6 anos e 14 um direito fundamental."
 RAJ_foreign_education_partner_ship: "Parceria de Educação Estrangeira"
 RAJ_foreign_education_partner_ship_desc: "Nossos alunos precisam da oportunidade de obter uma educação estrangeira para se tornarem ainda mais inteligentes."
 indian_event.13.t: "Operação West End"
 indian_event.13.d:0 "Tehelka, liderada por seu fundador Tarun Tejpal, conduziu uma operação policial usando câmeras escondidas e jornalistas disfarçados se passando por traficantes de armas. A operação teve como alvo principal a corrupção na indústria de defesa, com foco em funcionários de alto escalão e políticos que estavam supostamente envolvidos em negócios ilegais de armas e aceitação de subornos. Durante um período de vários meses, os jornalistas disfarçados de Tehelka gravaram conversas com vários funcionários, incluindo burocratas, oficiais militares e políticos. Eles capturaram evidências de vídeo mostrando esses indivíduos aceitando subornos e discutindo atividades ilegais relacionadas para compras de defesa. A operação destacou especificamente a corrupção na compra de equipamentos de defesa, como armas, munições e veículos. A operação veio à tona quando Tehelka divulgou uma série de vídeos explosivos e publicou artigos detalhando o escândalo de corrupção. A exposição criou um grande alvoroço em todo o país, levando à indignação pública e à exigência de acção contra os implicados na operação. Várias figuras de destaque foram apanhadas na operação policial, incluindo políticos de vários partidos políticos, oficiais do exército e burocratas. Alguns dos nomes proeminentes envolvidos incluíam o então presidente do Partido Bharatiya Janata, Bangaru Laxman, que foi flagrado aceitando suborno, bem como Jaya Jaitly, um político sênior do Partido Samata."
 indian_event.13.a: "Demita os responsáveis!"
 indian_event.13.b: "Deixe como está."
 RAJ_operation_west_end: "Operação West End"
 RAJ_operation_west_end_desc: "A Operação West End, também conhecida como exposição Tehelka, refere-se a uma grande operação secreta conduzida por um portal de notícias indiano chamado Tehelka em 2001. A operação expôs a corrupção no setor de defesa da Índia e levou a um escândalo nacional."
 indian_event.14.t: "Cúpula Conjunta da Índia e do Paquistão"
 indian_event.14.d: "A cimeira contou com a presença do então primeiro-ministro indiano Atal Bihari Vajpayee e do então presidente do Paquistão, Pervez Musharraf. O objetivo principal da cimeira foi promover o diálogo e procurar uma resolução pacífica para os conflitos entre a Índia e o Paquistão, especialmente a questão da Caxemira. Durante a cimeira, ambos os líderes envolveram-se em extensas discussões sobre vários assuntos, incluindo a disputa da Caxemira, o terrorismo e as tensões transfronteiriças. As conversações foram realizadas a portas fechadas e os detalhes das negociações foram não divulgado ao público na época. No entanto, foi relatado que as discussões eram muitas vezes intensas e envolviam diferentes perspectivas sobre várias questões importantes."
 indian_event.14.a: "Maravilhoso"
 RAJ_agra_summit: "Cúpula de Agra"
 RAJ_agra_summit_desc: "A Cúpula de Agra, também conhecida como Cúpula da Paz de Agra, foi uma reunião diplomática de alto nível entre os líderes da Índia e do Paquistão realizada em Agra, Índia, em julho de 2001. A cúpula foi uma tentativa significativa de resolver questões de longa data entre os dois países, incluindo o conflito da Caxemira."
 RAJ_new_defence_council_gathering_d: "Tensão na fronteira com a Caxemira"
 RAJ_new_defence_council_gathering: "Reunião do Conselho de Defesa"
 RAJ_new_defence_council_gathering_desc: "Não precisamos confiar na boa vontade do Paquistão! É hora de convocar o Conselho de Defesa e mais uma vez preparar um plano de defesa e contra-ataque."
 RAJ_easing_military_standoff: "Easing Military Standoff"
 RAJ_easing_military_standoff_desc: "Nossas relações na fronteira com o Paquistão são bastante tensas. Pode valer a pena fazer um esforço para acalmar a situação."
 indian_event.15.t: "Testes nucleares no Rajastão"
 indian_event.15.d: "Os testes alcançaram seu objetivo principal de dar à Índia a capacidade de construir armas de fissão e termonucleares com rendimento de até 200 quilotons. O então presidente da Comissão Indiana de Energia Atômica descreveu cada uma das explosões de Pokhran- II será equivalente a vários testes realizados por outros estados com armas nucleares ao longo de décadas. Posteriormente, a Índia estabeleceu capacidade de simulação computacional para prever os rendimentos de explosivos nucleares cujos projetos estão relacionados aos projetos de explosivos usados ​​neste teste."
 indian_event.15.a: "Maravilhoso"
 indian_event.16.t: "Intel indiana"
 indian_event.16.d: "A Índia nos forneceu informações militares estratégicas sobre a China."
 indian_event.16.a: "Maravilhoso"
 RAJ_strategic_assistance_to_us: "Assistência Estratégica aos EUA."
 RAJ_strategic_assistance_to_us_desc: "Os EUA serão o nosso esteio no confronto com a China."
 RAJ_world_hindi_conference: "Conferência Mundial Hindi"
 RAJ_world_hindi_conference_desc: "A Conferência Mundial Hindi é um evento global que reúne estudiosos, linguistas, escritores e entusiastas da língua Hindi de todo o mundo. Esta conferência serve como uma plataforma para promover e celebrar a riqueza e a diversidade da língua Hindi e seu patrimônio cultural"
 RAJ_citizenship_india: "Aparelho Administrativo Melhorado"
 RAJ_citizenship_india_desc: "Devemos aumentar a possibilidade de o povo indiano obter a cidadania indiana e repatriar para a Índia."
 RAJ_amoozesh_parvaresh: "Escolas de ensino médio atualizadas"
 raj_middle_school_tt: "§YVamos atualizar as escolas secundárias indianas§!"
 RAJ_middle_school_modernization: "Modernização do Ensino Médio"
 RAJ_middle_school_modernization_desc: "As escolas secundárias na Índia não são modernizadas há muito tempo e exigem uma mudança na abordagem e na metodologia de ensino."
 RAJ_good_governance_day: "Dia da Boa Governança"
 RAJ_good_governance_day_desc: "Atal Bihari Vajpayee é conhecido por sua abordagem maravilhosa de governar o país."
 RAJ_further_privatization: "Privatização Adicional"
 RAJ_further_privatization_desc: "Depois de mudar o curso da nossa economia, precisamos continuar o caminho de uma maior privatização da nossa economia."
 RAJ_videsh_sanchar: "Expansão Videsh Sanchar"
 RAJ_videsh_sanchar_desc: "À medida que a Índia entra no século 21, deve expandir as suas telecomunicações e fornecer cobertura de informação para todo o país."
 RAJ_hindu_primacy_economy: "Economia dominada pela ética hindu"
 RAJ_hindu_primacy_economy_desc:0 "A Ética Indiana deve tornar-se a base não só das relações sociais, mas também das relações económicas. Só assim poderemos garantir uma concorrência leal."
 RAJ_dab_on_lashkare_taiba:0 "Contra-Lashkare Taiba"
 RAJ_dab_on_lashkare_taiba_desc: "Grupos islâmicos operam clandestinamente em nosso país há muito tempo. É hora de encontrá-los e tomar contramedidas contra eles."
 RAJ_joint_summit_with_pakistan: "Cúpula Conjunta com o Paquistão"
 RAJ_joint_summit_with_pakistan_desc: "Para tranquilizar ambos os países, é necessária a convocação de uma cimeira conjunta com o Paquistão. Isto reduzirá a tensão e permitir-nos-á cooperar no futuro."
 RAJ_iri_fake_ns2: "Indústria militar amplamente corrupta"
 RAJ_iri_fake_ns3: "Indústria Militar Moderadamente Corrupta"
 RAJ_iri_fake_ns4: "Indústria militar pouco corrupta"
 RAJ_re_fake_militar2: "Militar moderadamente desorganizado"
 RAJ_re_fake_militar3: "Militar humildemente desorganizado"
 RAJ_re_fake_militar4: "Militar Organizado"
 RAJ_true_tiger_economy: "Verdadeira Economia do Tigre"
 RAJ_true_tiger_economy_desc: "Uma economia tigre é a economia de um país que passa por um rápido crescimento econômico, geralmente acompanhado por um aumento no padrão de vida."
 indian_event.17.t: "Economia Indiana"
 indian_event.17.d: "No ano 2000, a economia indiana viveu um período de crescimento e transformação significativos. Foi caracterizado por medidas de liberalização graduais iniciadas no início da década de 1990, que continuaram a moldar o cenário econômico. Com uma população de mais de um bilhão de pessoas, a Índia apresentava um vasto mercado consumidor e uma força de trabalho que atraiu investimento estrangeiro. A economia era impulsionada principalmente pela agricultura, indústria e serviços. A agricultura empregava uma grande parte da população, contribuindo para a segurança alimentar e a subsistência rural. O sector industrial expandiu-se, com a indústria transformadora e os têxteis a desempenharem papéis cruciais, enquanto os serviços emergiram como um importante motor de crescimento, particularmente na tecnologia da informação e na externalização de processos empresariais."
 indian_event.17.a: "Interessante."
 RAJ_natural_competitor: "Concorrente Natural"
 RAJ_natural_competitor_desc: "A Índia é um concorrente natural no mercado global. Devemos alcançar e superar o mundo inteiro."
 indian_event.18.t: "Índia pede investimentos"
 indian_event.18.d:0 "Os diplomatas do [RAJ.GetNameWithFlag] abordaram nosso governo hoje com uma proposta interessante. Eles estão procurando investigar investimentos e desenvolvimento dentro da economia [RAJ.GetAdjective] para desenvolvê-los ainda mais. O acordo aproximaria nossos dois países e, em última análise, ajudaria os laços econômicos entre nós dois. Devemos concordar com seus termos?"
 indian_event.18.a: "Claro."
 indian_event.18.b: "Desculpe, não."
 indian_event.19.t: "[FROM.GetName] Oferta de investimento negada!"
 indian_event.19.d: "[FROM.GetName] negou nossa oferta de investimentos. É realmente um dia triste."
 indian_event.19.a: "Aff."
 indian_event.20.t: "[FROM.GetName] Oferta de investimento aceita!"
 indian_event.20.d: "[FROM.GetName] aceitou nossa oferta!"
 indian_event.20.a: "Ótimo."
 RAJ_attract_foreign_business: "Atrair Capital Estrangeiro"
 RAJ_attract_foreign_business_desc: "Atrair capital externo é fundamental para expandir nossa economia. É hora de enviar ofertas lucrativas aos nossos diversos parceiros."
 RAJ_the_new_steel_industry: "A Nova Indústria Siderúrgica"
 RAJ_the_new_steel_industry_desc: "O aço é a base da indústria pesada. Sem ele é impossível criar uma base competitiva para a indústria. Precisamos expandir sua produção."
 RAJ_expand_the_mines: "Expandindo as Minas"
 RAJ_expand_the_mines_desc: "Construir uma indústria requer necessariamente a expansão das minas de recursos e o aumento das reservas de recursos do país."
 RAJ_subs_coal_india: "Subsidiar a indústria de mineração"
 RAJ_subs_coal_india_desc: "Para fortalecer o desenvolvimento da extração de recursos em nosso país, devemos subsidiar este setor da nossa economia."
 RAJ_hindustan_zinc: "Hindustão Zinco"
 RAJ_hindustan_zinc_desc: "Hindustan Zinc Limited é uma produtora indiana integrada de mineração e recursos de zinco, chumbo, prata e cádmio. É uma subsidiária da Vedanta Limited."
 RAJ_bus_nmdc: "NMDC"
 RAJ_bus_nmdc_desc: "NMDC Limited, anteriormente National Mineral Development Corporation, é uma empresa indiana do setor público envolvida na exploração de minério de ferro, cobre, fosfato de rocha, calcário, dolomita, gesso, bentonita, magnesita, diamante, estanho, tungstênio, grafite, carvão etc. É o maior produtor e exportador de minério de ferro da Índia, produzindo mais de 35 milhões de toneladas de minério de ferro em três minas mecanizadas em Chhattisgarh e Karnataka."
 RAJ_deregul_the_econ: "Desregulamentando a Economia"
 RAJ_deregul_the_econ_desc: "A desregulamentação da economia é um aspecto importante da criação de um mercado mais dinâmico e de rápido crescimento na Índia."
 RAJ_industrial_investments: "Investimentos Industriais"
 RAJ_industrial_investments_desc: "Além de contar com investidores externos e diversos empresários, o próprio Estado deve se esforçar para investir na indústria do país"
 RAJ_indian_machine_tool_assoc: "Associação Indiana de Máquinas-Ferramenta"
 RAJ_indian_machine_tool_assoc_desc: "A Associação Indiana de Fabricantes de Máquinas-Ferramenta é o órgão máximo da indústria para o setor de máquinas-ferramenta na Índia."
 ind_mach_tool_tt: "§YAssociação Indiana de Máquinas-Ferramenta irá melhorar muito nossa indústria§!"
 indian_event.21.t: "Exposição Têxtil!"
 indian_event.21.d: "A Exposição da Indústria Têxtil realizada na Índia apresentou o vibrante e diversificado setor têxtil do país. Apresentou uma ampla gama de produtos, incluindo roupas, tecidos e acessórios, destacando o artesanato e a inovação no setor têxtil indiano indústria. Entre os itens expostos, as camisas rosa indianas se destacaram e ganharam reconhecimento ao ganhar um prêmio de concurso de prestígio. Essas camisas demonstraram a mistura única de arte tradicional e design contemporâneo, combinando trabalho manual complexo e tecidos de alta qualidade. As camisas rosa indianas cativaram o público com seu artesanato requintado, atenção aos detalhes e paleta de cores vibrantes. Essa conquista não apenas celebrou o talento e a criatividade dos artesãos têxteis indianos, mas também mostrou o apelo global dos têxteis indianos. Solidificou ainda mais a reputação da Índia como um destino líder para a produção têxtil e design, enfatizando a rica herança do país e a sua capacidade de adaptação às tendências da moda moderna. O sucesso das camisas rosa indianas na exposição serviu como um testemunho da próspera indústria têxtil na Índia, contribuindo para o seu crescimento, reconhecimento internacional e contribuições contínuas para a economia e identidade cultural do país."
 indian_event.21.a: "Ótimo"
 RAJ_textile_exhibition: "Indústria Têxtil"
 RAJ_textile_exhibition_desc: "A indústria têxtil na Índia tradicionalmente, depois da agricultura, é a única indústria que gerou enormes empregos para mão de obra qualificada e não qualificada. A indústria têxtil continua a ser o segundo maior setor gerador de emprego na Índia."
 RAJ_indian_naval_industry: "Indústria Naval Indiana"
 RAJ_indian_naval_industry_desc: "Apesar da nossa boa posição comercial e marítima, precisamos desenvolver a nossa indústria marítima."
 RAJ_indian_mitime_research: "Pesquisa Marítima Indiana"
 RAJ_indian_mitime_research_desc: "A investigação no domínio da construção naval e da indústria naval é essencial para o desenvolvimento da nossa situação económica."
 RAJ_hindalco: "HINDALCO"
 RAJ_hindalco_desc: "Hindalco Industries Limited is an Indian aluminium and copper manufacturing company, and a subsidiary of the Aditya Birla Group."
 RAJ_eastern_dockyards: "Estaleiros Leste"
 RAJ_eastern_dockyards_desc: "Uma proposta é construir novos estaleiros no Leste e desenvolver a indústria marítima naquela região."
 RAJ_western_dockyards: "Estaleiros Ocidentais"
 RAJ_western_dockyards_desc: "Uma proposta é construir novos estaleiros no Ocidente e desenvolver a indústria marítima naquela região."
 RAJ_manufact_schemes: "Esquemas Econômicos"
 RAJ_manufact_schemes_desc: "À medida que a Índia entra no século 21, é hora de criar novos padrões de produção e cadeias de abastecimento que atendam às demandas da época."
 RAJ_diamond_ind: "Indústria de Diamantes"
 RAJ_diamond_ind_desc: "A mineração de diamantes e metais preciosos é uma parte significativa das exportações da Índia. É necessário desenvolver novos depósitos para desenvolver a economia."
 RAJ_expand_chromium: "Expandir Chromium"
 RAJ_expand_chromium_desc: "Os depósitos de cromo recém-descobertos estão atraindo investidores nacionais e estrangeiros. Precisamos desenvolver esta questão e iniciar a mineração."
 RAJ_expand_khullar: "Expandir Khullar"
 RAJ_expand_khullar_desc: "Nosso governo achou por bem cuidar de nosso tesouro nacional de recursos naturais."
 RAJ_indian_car_industry: "Indústria automobilística indiana"
 RAJ_indian_car_industry_desc: "Para nos tornarmos um país competitivo no mercado internacional, devemos continuar a desenvolver a nossa indústria automobilística."
 RAJ_petrol_refiners: "Refinarias de petróleo"
 RAJ_petrol_refiners_desc: "O petróleo é a força vital das economias modernas e das indústrias militares. Precisamos desenvolver esta indústria."
 RAJ_unpec_growth: "Crescimento sem precedentes"
 RAJ_unpec_growth_desc: "Oba, nossa economia se fortaleceu consideravelmente! Para esse fim, nosso governo até organizou um banquete esta noite."
 RAJ_export_of_india: "Exportação da Índia"
 RAJ_export_of_india_desc: "Nosso país é rico em recursos e embora já tenhamos sofrido durante o domínio colonial ao exportar nossos recursos para a Grã-Bretanha e outros países coloniais, mas por enquanto temos que apoiar nossa economia com fundos adicionais de exportações."
 RAJ_UAZ: "UAZ"
 RAJ_russia_cars_companies: "Empresas automobilísticas russas"
 RAJ_russia_cars_companies_desc: "Russia is a fairly developed country in the automotive industry. We should invite their companies to improve our position in this industry."
 RAJ_the_bull_of_asia: "O Touro da Ásia"
 RAJ_the_bull_of_asia_desc: "Nosso país é o touro econômico da Ásia, que irá equilibrar a economia da China com seus chifres."
 RAJ_the_worlds_jeweller: "The World's Jeweller"
 RAJ_the_worlds_jeweller_desc: "Diamantes, safiras e outros materiais são a nossa riqueza nacional. Devemos aproveitar a nossa posição única."
 RAJ_indian_rice_funds: "Fundos do Arroz Indiano"
 RAJ_indian_rice_funds_desc:0 "Desta vez, a China não será a única superpotência do arroz."
 RAJ_indian_infrastruct: "Infraestrutura Indiana"
 RAJ_indian_infrastruct_desc: "So far, the infrastructure situation in our country is unacceptable. We must prevent this, otherwise jokes about bad roads will reach us as well."
 RAJ_brazillian_industrial_partnership: "Parceria Industrial Brasileira"
 RAJ_brazillian_industrial_partnership_desc: "O Brasil oferece expertise e recursos valiosos que podem ajudar a modernizar e expandir nosso setor industrial. Ao formarmos uma parceria, podemos acelerar o avanço tecnológico e fortalecer os laços econômicos entre nossas nações."
 RAJ_dealing_with_eu_companies: "Lidando com empresas europeias"
 RAJ_dealing_with_eu_companies_desc: "A Europa é o nosso principal mercado para a interação da nossa economia com a economia europeia. Devemos desenvolver esta esfera."
 RAJ_hindustan_aeronautics: "Aeronáutica Hindustan"
 RAJ_hindustan_aeronautics_desc: "The sky is the third ocean that man has conquered. We must grasp this industry with all our propellers to become stronger."
 RAJ_tatamotors: "Motores TATA"
 RAJ_tatamotors_desc: "TATA Motors, our main automobile company. We have to make it more advanced than our western competitors."
 RAJ_building_industry_of_india: "Indústria de Construção da Índia"
 RAJ_building_industry_of_india_desc: "Agora a Índia é capaz de se construir."
 RAJ_fight_unorganiz_work_force: "Combater a força de trabalho desorganizada"
 RAJ_fight_unorganiz_work_force_desc: "O desemprego é nosso maior inimigo. Agora todos neste país estarão trabalhando."
 RAJ_ultra_tech_content: "Conteúdo ultratecnológico"
 RAJ_ultra_tech_content_desc: "É hora de alcançar os países ocidentais no desenvolvimento da tecnologia informática."
 RAJ_increasing_control_over_business: "Aumentar o controle sobre as empresas"
 RAJ_increasing_control_over_business_desc: "As empresas do nosso país não devem ser deixadas de fora. O destino da nossa economia pode depender disso."
 RAJ_lagilizing_the_business: "Legalizando os Negócios"
 RAJ_lagilizing_the_business_desc: "A próxima etapa para melhorar a qualidade do nosso negócio é eliminar oportunidades para atividades ilegais."
 indian_event.22.t: "Dilema da mão de obra barata"
 indian_event.22.d: "Devemos decidir como vamos reformar o nosso mercado de trabalho na Índia. Devemos apoiar os seus direitos ou deixá-lo como está?"
 indian_event.22.a: "Garantam seus direitos!"
 indian_event.22.b: "Deixe como está."
 RAJ_modern_building_technology: "Tecnologias de construção moderna"
 RAJ_modern_building_technology_desc: "É hora de chegar ainda mais perto do momento em que a Índia se tornará um dos países mais desenvolvidos do mundo."
 RAJ_mumbai_restoration: "Foco em Mumbai"
 RAJ_mumbai_restoration_desc: "É hora de reconstruir a velha Mumbai."
 RAJ_delhi_urbanization_plan: "Plano de Urbanização de Delhi"
 RAJ_delhi_urbanization_plan_desc: "Precisamos urbanizar nossa capital, Delhi. Isso melhorará as condições do nosso país."
 RAJ_unslumization_of_cities: "Unslumização das Cidades"
 RAJ_unslumization_of_cities_desc: "Outro projeto que pretende melhorar a vida em nosso país."
 RAJ_mahindra: "Mahindra"
 RAJ_mahindra_desc: "Mahindra & Mahindra é um fabricante indiano de automóveis de SUVs, caminhões e tratores."
 RAJ_force_motors: "Motores de Força"
 RAJ_force_motors_desc: "Dependendo da versão, ônibus urbanos ou intermunicipais de pequeno porte, com 6,7 metros de comprimento e capacidade de 18 a 32 lugares. O motor é turbo-diesel de 4 cilindros e 76 cv."
 RAJ_uranium_corp_of_india: "Corporação de Urânio da Índia"
 RAJ_uranium_corp_of_india_desc:0 "Uma empresa do setor público subordinada ao Ministério de Energia Atômica para mineração e moagem de urânio. A corporação foi fundada em 1967 e é responsável pela mineração e moagem de minério de urânio na Índia. A empresa opera minas em Jadugor, Bhatina, Narvapahar, Turamdih e Banduhurang."
 RAJ_inviting_iaea: "Convidando a AIEA"
 RAJ_inviting_iaea_desc: "A Agência Internacional de Energia Atômica (AIEA) é uma organização internacional criada de acordo com a decisão da ONU de 4 de dezembro de 1954. É membro do sistema da ONU e exerce poderes para desenvolver a cooperação no uso pacífico da energia atômica."
 RAJ_bus_agreement_with_us: "Acordos com os EUA"
 RAJ_bus_agreement_with_us_desc: "The U.S. has become our top trading partner in nuclear power. Time to sign more agreements."
 RAJ_bus_agreement_with_rus: "Acordos com a Rússia"
 RAJ_bus_agreement_with_rus_desc: "A indústria de energia nuclear da Rússia também é uma das líderes do mundo. Precisamos começar a cooperar mais com a Rússia."
 RAJ_finalize_kaiga: "Finalizar Kaiga"
 RAJ_finalize_kaiga_desc: "A Estação Geradora de Kaiga é uma estação geradora de energia nuclear situada em Kaiga, perto do rio Kali, no distrito de Uttara Kannada em Karnataka, Índia. A usina está em operação desde março de 2000 e é operada pela Nuclear Power Corporation of India. "
 RAJ_tarapur4: "Tarapur 4"
 RAJ_tarapur4_desc: "a quarta unidade nuclear da usina nuclear Tarapur-4 da Índia. É o maior reator nuclear da Índia, com capacidade de 540 MW. Está sendo construído pela Nuclear Power Corp. of India Ltd. (NPCIL)"
 RAJ_expanding_nmdc: "Expandindo NMDC"
 RAJ_expanding_nmdc_desc:0 "A expansão da NMDC aumenta a capacidade estatal de mineração e a receita de exportação de minério de ferro e minerais raros."
 RAJ_invite_foreign_powers: "Convidar Investidores Estrangeiros"
 RAJ_invite_foreign_powers_desc: "Precisamos tornar esta indústria mais atraente para os investidores estrangeiros, para que o progresso possa avançar mais rapidamente."
 RAJ_bringing_back_the_plan: "Trazendo de volta o plano"
 RAJ_bringing_back_the_plan_desc: "Centralized planning reshapes our economic strategy. Industrial growth accelerates, though ideological shifts trigger political resistance."
 RAJ_expansive_subsidies: "Subsídios Expansivos"
 RAJ_expansive_subsidies_desc:0 "Os subsídios sustentam a base agrícola da Índia, fortalecendo as comunidades rurais e a produtividade das fazendas."
 RAJ_indian_ricebelt: "Cinturão do Arroz Indiano"
 RAJ_indian_ricebelt_desc: "Investment in rice cultivation strengthens our agrarian economy and rural stability."
 RAJ_leaving_as_it_is: "Deixando como está"
 RAJ_leaving_as_it_is_desc: "Renewable energy (wind and solar) becomes central to our long-term energy strategy and self-sufficiency."
 RAJ_teacoffedance: "Chá, café, vamos dançar."
 RAJ_teacoffedance_desc:0 "A expansão das exportações de chá e café impulsiona o crescimento econômico e a autonomia interna."
 RAJ_exportsubsidies: "Regulamento de Exportação"
 RAJ_exportsubsidies_desc: "Export controls protect our resources and foster domestic manufacturing independence."
 RAJ_high_import_tariffs: "Altas tarifas de importação"
 RAJ_high_import_tariffs_desc: "High tariffs shield Indian industry from foreign competition and build economic sovereignty."
 RAJ_tea_production: "Produção de Chá"
 RAJ_tea_production_desc: "Expanding tea production increases rural employment and export revenue."
 RAJ_coffee_production: "Produção de Café"
 RAJ_coffee_production_desc: "Coffee cultivation strengthens agrarian ties and builds an export-oriented agricultural base."
 RAJ_coffee_tata_tea: "Expand Tea and Coffee Exports"
 RAJ_coffee_tata_tea_desc: "Private-sector partnerships with TATA and other firms expand tea and coffee exports while building industrial capacity."
 RAJ_supporting_local_producers: "Apoiando Produtores Locais"
 RAJ_supporting_local_producers_desc: "Government support for small businesses builds local manufacturing and craftsmanship."
 RAJ_indian_rice_bowl: "Tigela de arroz indiano"
 RAJ_indian_rice_bowl_desc: "A focused push on rice production strengthens our food security and rural economy, though at political cost."
 RAJ_incr_regional_control: "Aumentar o controle regional"
 RAJ_incr_regional_control_desc: "Centralizing regional administration strengthens state capacity and political control over local affairs."
 RAJ_local_prod_gov_prod: "Produtores Locais? Produtores Governamentais!"
 RAJ_local_prod_gov_prod_desc: "State-owned production replaces private enterprise, building public manufacturing capacity and independence."
 RAJ_new_prospects_for_socialism: "Novas Perspectivas para o Socialismo"
 RAJ_new_prospects_for_socialism_desc: "Embracing socialist ideals accelerates state control over industry and redistributive policies."
 RAJ_state_run_capitalism: "Capitalismo administrado pelo Estado"
 RAJ_state_run_capitalism_desc: "State corporations replace private monopolies, balancing market forces with public control."
 RAJ_further_expansion_into_market: "Comissão Económica"
 RAJ_further_expansion_into_market_desc: "An Economic Committee coordinates state investment and industrial growth."
 RAJ_secured_food_source: "Fonte de alimento segura"
 RAJ_secured_food_source_desc: "Food self-sufficiency through agricultural investment wins farmer support and builds economic resilience."
 RAJ_unite_the_farms: "Unir as Fazendas"
 RAJ_unite_the_farms_desc: "Collective farming initiatives strengthen rural cooperation and domestic food independence, though some private interests object."
 RAJ_our_next_logical_step: "Lidando com Governadores Locais"
 RAJ_our_next_logical_step_desc: "Negotiating with local governors strengthens central authority and regional infrastructure development."
 RAJ_full_socialism_control: "Conversão Total ao Socialismo"
 RAJ_full_socialism_control_desc: "A profound shift in the political landscape unfolds as the whispers of socialism grow louder. With old oligarchic echoes fading, the All India Trade Union Congress finds its voice, marking a new chapter in India's ideological journey."
 RAJ_pressure_big_business: "Pressione grandes empresas"
 RAJ_pressure_big_business_desc: "A delicada disputa entre política e comércio intensifica-se, abrindo caminho para uma narrativa económica mais autodeterminada. No meio desta mudança de maré, a essência da autonomia doméstica encontra uma base mais firme."
 RAJ_looming_water1: "Escassez de água reduzida"
 RAJ_looming_water2: "Escassez parcial de água"
 RAJ_stabiliz_supply_water: "Estabilizando o abastecimento de água"
 RAJ_stabiliz_supply_water_desc: "A questão da escassez de água está no topo da agenda da Índia. Devemos fazer todos os esforços para resolver este problema."
 RAJ_israeli_water_spec: "Especialistas israelenses em água"
 RAJ_israeli_water_spec_desc: "Especialistas israelenses já ofereceram sua assistência na questão da filtração e fornecimento de água à população."
 RAJ_spanish_water_spec: "Especialistas em Água Espanhóis"
 RAJ_spanish_water_spec_desc: "Especialistas espanhóis já ofereceram assistência na questão da filtração e abastecimento de água à população."
 RAJ_minjur_water_plant: "Estação de tratamento de água Minjur"
 RAJ_minjur_water_plant_desc: "A Usina de Dessalinização Minjur é uma usina de dessalinização de água por osmose reversa na vila de Kattupalli, um subúrbio ao norte de Chennai, Índia, na costa da Baía de Bengala, que fornece água para a cidade de Chennai. Construída em uma área de 60 acres local, é a maior usina de dessalinização da Índia."
 RAJ_nemmeli_water_plant: "Planta Aquática Nemmeli"
 RAJ_nemmeli_water_plant_desc: "A Usina de Dessalinização Nemmeli é uma usina de dessalinização de água em Nemmeli, Chennai, na costa da Baía de Bengala, que fornece água para a cidade de Chennai."
 water_ind_tt: "§GVamos resolver gradualmente o problema da escassez de água§!"
 RAJ_invest_in_bollywood: "Invista em Bollywood"
 RAJ_invest_in_bollywood_desc: "State investment in Bollywood will expand India's film industry, boost cultural exports, and generate soft power on the world stage."
 indian_event.23.t: "A indústria cinematográfica indiana choca o mundo!"
 indian_event.23.d: "O cinema indiano provou mais uma vez a sua proeza global com o mais recente filme indiano, Mystic Dreams, a conquistar o mundo. O filme, dirigido pelo aclamado cineasta indiano Rohit Verma, quebrou recordes de bilheteria e conquistou os corações do público em todo o mundo, marcando um novo marco para o cinema indiano no cenário global. Mystic Dreams conta uma história convincente de amor, autodescoberta e o poder da conexão humana. Tendo como pano de fundo o majestoso Himalaia, o filme combina lindamente visuais impressionantes, narrativa cativante e performances excelentes de um elenco talentoso. O sucesso do filme pode ser atribuído à sua capacidade de ressoar com públicos de diversas origens culturais. Seus temas universais de amor, esperança e espiritualidade tocaram espectadores em todo o mundo, transcendendo barreiras linguísticas e culturais. A fotografia de tirar o fôlego do filme e a narrativa meticulosamente elaborada atraíram elogios tanto da crítica quanto dos espectadores."
 indian_event.23.a: "India is indeed the best! Those who doubt it are wrong!"
 RAJ_bolywood_idea: "Bollywood"
 RAJ_tata_consult: "Consulta TATA"
 RAJ_tata_consult_desc: "Tata Consultancy Services (TCS) is an Indian multinational IT services and consulting company, part of the Tata Group. Headquartered in Mumbai, it is one of the largest IT employers in the world."
 RAJ_software_tech_park: "Parque Tecnológico de Software"
 RAJ_software_tech_park_desc: "A Science and Technology organization under the Ministry of Electronics and Information Technology (MeitY), engaged in promoting IT and ITES industries, innovation, research, startups, and intellectual property in emerging technology sectors."
 RAJ_hcl_tech_lim: "HCL Tech Limitada"
 RAJ_hcl_tech_lim_desc: "HCL Technologies Limited, d/b/a HCLTech (anteriormente Hindustan Computers Pvt. Limited), é uma empresa multinacional indiana de serviços e consultoria de tecnologia da informação (TI) com sede em Noida."
 RAJ_tech_mahindra: "Tecnologia Mahindra"
 RAJ_tech_mahindra_desc:0 "Uma empresa multinacional indiana que fornece tecnologia da informação e serviços de consultoria. O Grupo Mahindra está sediado em Pune e tem sede em Mumbai. A Tech Mahindra é uma empresa de US$ 6,0 bilhões com mais de 148.000 funcionários em 90 países."
 RAJ_infosys_limited: "Infosys Limitada"
 RAJ_infosys_limited_desc: "Uma empresa indiana envolvida no desenvolvimento de software personalizado para empresas de comércio eletrônico e telecomunicações. Também fornece serviços de consultoria em tecnologia da informação e software."
 RAJ_wipro: "WIPRO"
 RAJ_wipro_desc: "A Wipro é uma empresa multinacional indiana que fornece serviços de tecnologia da informação, consultoria e processos de negócios. É uma das principais empresas de Big Tech."
 RAJ_forces_of_india: "Forças da Índia"
 RAJ_forces_of_india_desc: "A organização militar da Índia, destinada à defesa da República e à proteção da liberdade e independência do Estado, um dos mais importantes instrumentos do poder político."
 RAJ_indian_militias: "Milícias Indianas"
 RAJ_indian_militias_desc: "A milícia é parte integrante do nosso exército. Para conduzir operações militares com sucesso, também precisamos desenvolver a nossa milícia."
 RAJ_assam_rifles: "Rifles Assam"
 RAJ_assam_rifles_desc: "Uma força paramilitar central responsável pela segurança das fronteiras, contra-insurgência e lei e ordem no nordeste da Índia. A sua principal função é proteger a fronteira Indo-Myanmar. A AR é uma das Forças Centrais de Polícia Armada subordinadas ao Ministério da Administração Interna. O Exército Indiano mantém o controle operacional sobre o AR. Como força policial, a sua política de recrutamento, benefícios, promoção e reforma são regidas pelas regras do CAPF. Cerca de 80 por cento dos oficiais são nomeados no Exército, enquanto o restante do pessoal é recrutado no quadro da AR. A AR é comandada pelo Diretor Geral dos Rifles de Assam, nomeado pelo Ministério da Administração Interna."
 RAJ_special_frontier_force: "Força Especial de Fronteira"
 RAJ_special_frontier_force_desc: "Uma unidade de operações especiais indiana criada em 14 de novembro de 1962. Era composta principalmente por refugiados tibetanos que viviam na Índia. Agora cresceu em tamanho e escopo de operações. Inicialmente, seu objetivo principal era conduzir operações secretas atrás dos chineses linhas no caso de outra guerra sino-indiana."
 RAJ_indian_special_forces: "Forças Especiais Indianas"
 RAJ_indian_special_forces_desc: "Para realizar operações especiais atrás das linhas inimigas, ou dentro do país, precisamos ter forças especiais treinadas"
 RAJ_NAJA_idea_1: "Polícia Militarizada"
 RAJ_riot_police_idea: "Polícia de Choque"
 RAJ_riot_police_idea_desc: "Dedicated riot control units are deployed to suppress civil unrest and communal violence. Their presence deters mass disorder but strains civil liberties and may inflame public sentiment against the government."
 RAJ_outer_doctrine_idea: "Doutrina de Guerra com Vizinhos"
 RAJ_outer_doctrine_idea_desc: "India has formalized a strategic doctrine oriented around potential conflicts with Pakistan and China. Military planning, force posture, and procurement are all calibrated toward these two primary threat vectors."
 RAJ_national_security_guard: "Guarda Nacional de Segurança"
 RAJ_national_security_guard_desc: "Comumente conhecida como os 'Gatos Pretos', é a unidade de contra-terrorismo da Índia sob o Ministério de Assuntos Internos. Foi fundada em 16 de outubro de 1984 após a Operação Blue Star para combater atividades terroristas e proteger os estados de agitação interna. Oficialmente aprovada pelo Parlamento da Índia sob a Lei da Guarda Nacional de Segurança de 1986. É uma das sete Formações de Polícia Armada Central da Índia."
 RAJ_special_protection_group: "Grupo de Proteção Especial"
 RAJ_special_protection_group_desc: "Uma agência do Governo da Índia cuja única responsabilidade é proteger o Primeiro Ministro da Índia e, em alguns casos, sua família. Foi formado em 1988 por um Ato do Parlamento da Índia. O SPG protege constantemente o Primeiro Ministro tanto na Índia quanto no exterior, bem como os membros mais próximos da família que vivem com eles em sua residência oficial. No entanto, os membros da família podem recusar proteção."
 RAJ_railway_protection_group: "Grupo de Proteção Ferroviária"
 RAJ_railway_protection_group_desc: "Grupo de Proteção Ferroviária é uma seção da nova polícia militar especificamente criada para proteger logísticas governamentais necessárias e combater tumultos armados."
 RAJ_border_security_force: "Força de Segurança de Fronteira"
 RAJ_border_security_force_desc: "Organização Indiana para a Proteção das Fronteiras com o Paquistão e Bangladesh. É uma das sete Unidades de Polícia Armada Central da Índia, criada após a Guerra Indo-Paquistanesa de 1965 'para garantir a segurança das fronteiras da Índia e questões relacionadas'."
 RAJ_saastra_seema_bal: "Sashastra Seema Bal"
 RAJ_saastra_seema_bal_desc:0 "As forças de guarda de fronteira da Índia estão posicionadas ao longo de suas fronteiras com o Nepal e o Butão. É uma das sete formações da Polícia Armada Central sob o controle administrativo do Ministério de Assuntos Internos."
 RAJ_central_armed_police: "Polícia Armada Central"
 RAJ_central_armed_police_desc:0 "O nome coletivo das organizações policiais centrais na Índia subordinadas ao Ministério de Assuntos Internos. Tecnicamente, são formações paramilitares, anteriormente conhecidas como Formações Paramilitares Centrais."
 RAJ_indotibet_border_police:0 "Força Policial Indo-Tibete"
 RAJ_indotibet_border_police_desc: "A Polícia de Fronteira Indo-Tibetana (ITBP) é uma força de guarda de fronteira da Índia implantada ao longo de suas fronteiras com a Região Autônoma do Tibete. É uma das sete Forças Policiais Armadas Centrais, criada em 1962 após a Guerra Sino-Indiana Guerra de 1962."
 RAJ_expanding_cprf: "Expandindo CRPF"
 RAJ_expanding_cprf_desc:0 "Formações militares subordinadas ao Ministério de Assuntos Internos da Índia, desempenhando as funções de reserva policial armada para garantir a ordem pública, a segurança interna e a integridade do Estado, combatendo o terrorismo, garantindo a segurança durante as eleições, auxiliando as autoridades civis, superando as consequências dos desastres naturais."
 RAJ_reformation_of_dislocation: "Reformation of Dislocation"
 RAJ_reformation_of_dislocation_desc: "Nossa Força Aérea precisa mudar suas táticas de desdobramento para evitar muitos incidentes durante a guerra."
 RAJ_mirage2000: "Comprando Mirage 2000"
 RAJ_mirage2000_desc: "The Dassault Mirage 2000 is a fourth-generation French multirole fighter developed in the 1970s by Dassault. In service since 1984, it was the main combat aircraft of the French Air Force in the late twentieth and early twenty-first century. It is in service with several countries across Asia, Europe, and Latin America."
 RAJ_rafale: "Aviões Rafale"
 RAJ_rafale_desc: "The Dassault Rafale is a fourth-generation French multirole fighter developed by Dassault Aviation. It made its first flight in July 1986 and was adopted by the French Navy in 2004 and the French Air Force in 2006."
 RAJ_su30: "Compra de SU-30"
 RAJ_su30_desc: "Caça multifuncional soviético/russo de dois lugares para a conquista da supremacia aérea, geração 4+. Ele foi projetado para destruir alvos aéreos dia e noite, em condições meteorológicas simples e complexas, bem como no contexto do solo ao usar interferência ativa e passiva, controle do espaço aéreo, bloqueio de aeródromos inimigos em grandes profundidades e ações em objetos terrestres e marítimos.Também pode ser usado para controlar operações de combate em grupo ao obter supremacia aérea, destruir pousos inimigos no ar, realizar reconhecimento aéreo e destruir alvos terrestres em condições meteorológicas simples e complexas."
 RAJ_haltejas:0 "Desenvolvimento de Haltejas"
 RAJ_haltejas_desc: "Caça multifuncional leve indiano de quarta geração. A aeronave monomotor é feita segundo o esquema \"sem cauda\" com asa triangular. O protótipo da aeronave fez seu primeiro vôo em 2001; foi desenvolvido sob o programa ACV."
 RAJ_haljaguar:0 "Development of Haljaguar"
 RAJ_haljaguar_desc: "The fighter-bomber is a joint development of the United Kingdom (British Aircraft Corporation) and France (Breguet). It was in service with the Air Forces of these countries for three decades, and was also exported. The creation of SEPECAT Jaguar was one of the first joint programs of European aircraft manufacturers. The production was handled by the SEPECAT consortium (SEPECAT, from fr. Société Européenne de Production de l'avion École de Combat et d'appui Tactique - European Aviation Production Association for the production of combat and tactical support aircraft)."
 RAJ_embnetra: "EMB-145I Netra"
 RAJ_embnetra_desc: "O Embraer ERJ-145 é o principal modelo da família de jatos regionais ERJ (Embraer Regional Jet), desenvolvido pela fabricante brasileira de aeronaves Embraer no início da década de 1990. Além do modelo básico, existem diversas modificações com aumento alcance de vôo: ERJ-145ER (alcance estendido), ERJ-145LR (longo alcance), ERJ-145XR (alcance extralongo) A aeronave é operada por companhias aéreas desde 1996. Mais de 700 ERJ-145 foram produzidos durante a produção em série . A produção da aeronave continua no Brasil e desde 2004 também na China."
 RAJ_contracts_with_us_air: "Contratos com a Força Aérea dos EUA"
 RAJ_contracts_with_us_air_desc:0 "The US Air Force is the most advanced and strongest aviation units. We have to sign agreements with them on joint development of aircraft."
 RAJ_gulfstr4: "GulfStream4"
 RAJ_gulfstr4_desc: "Gulfstream IV (Gulfstream 4) é uma família de aeronaves de aviação executiva desenvolvida pela Gulfstream Aerospace Corporation na década de 1980. É representada pelos modelos básicos Gulfstream IV e suas gerações subsequentes Gulfstream IV SP, G300 e G400, bem como G350 e G450. No período de 1985 a 2018, foram produzidas mais de 900 aeronaves da família, a maioria das quais continua voando."
 RAJ_indian_navy_ind: "Marinha Indiana"
 RAJ_indian_navy_ind_desc: "Agora a nossa marinha não pode ostentar quaisquer qualidades distintivas em comparação com os nossos concorrentes ocidentais e orientais. Mas se quisermos ocupar o nosso lugar ao sol, teremos que cuidar da nossa frota."
 RAJ_lessons_from_cactus: "Lições da Operação Cactus"
 RAJ_lessons_from_cactus_desc: "A Operação Cactus foi muito bem sucedida para o nosso exército, bem como para a nossa marinha. Levamos em consideração muitas das nuances que surgiram durante essa operação e as estamos usando para melhorar a qualidade da nossa frota."
 indian_event.24.t: "Legado da Operação Cactus"
 indian_event.24.d: "Operação Cactus foi uma operação militar conduzida pelas Forças Armadas Indianas no ano de 1988. A operação foi realizada para neutralizar uma tentativa de golpe na nação insular das Maldivas. Em 3 de novembro de 1988, um grupo de Maldivas militantes, apoiados por mercenários do Sri Lanka, lançaram um golpe contra o então presidente das Maldivas, Maumoon Abdul Gayoom. O golpe visava derrubar o governo e estabelecer um regime pró-rebelde. Em resposta a esta grave ameaça, a Índia rapidamente implantou seu forças para ajudar o governo das Maldivas. Em 4 de novembro, aviões de transporte da Força Aérea Indiana, escoltados por navios de guerra da Marinha Indiana, transportaram um contingente de tropas do Exército Indiano para Malé, capital das Maldivas."
 indian_event.24.a: "Interessante."
 RAJ_domestic_ship_prod: "Produção de navios domésticos"
 RAJ_domestic_ship_prod_desc: "We need to develop our own domestic shipbuilding capacity."
 RAJ_navy_aviation: "Aviação da Marinha"
 RAJ_navy_aviation_desc: "Para proteger eficazmente a nossa frota, precisamos de aviação naval."
 RAJ_goa_dock_exp: "Expandindo Estaleiros"
 RAJ_goa_dock_exp_desc: "As our naval production grows, we need to expand our dockyard capacity to sustain it."
 RAJ_revit_soviet_ships: "Revitalize as antigas capacidades"
 RAJ_revit_soviet_ships_desc: "A abordagem soviética à construção naval foi eficaz o suficiente para que pudéssemos integrá-la por nós mesmos."
 RAJ_scquir_submarines: "Submarinos Indianos"
 RAJ_scquir_submarines_desc: "Para afundar com sucesso os navios de outras pessoas, precisamos de nossos próprios submarinos."
 RAJ_agree_brit_onnavy: "Concordo com a Grã-Bretanha"
 RAJ_agree_brit_onnavy_desc: "Tendo sido anteriormente uma potência marítima líder, somos forçados a assinar um acordo de cooperação com a Grã-Bretanha."
 RAJ_naval_trainings: "Treinamentos Navais"
 RAJ_naval_trainings_desc: "A good preparation of our fleet will ensure our dominance at sea."
 RAJ_russia_navy_agree: "Especialistas da Marinha Russa"
 RAJ_russia_navy_agree_desc: "Cooperation with the Russians will allow us to strengthen our position at sea."
 RAJ_anew_indian_army: "Um novo exército indiano"
 RAJ_anew_indian_army_desc: "Devemos criar um novo conceito de Exército Indiano para nos adaptarmos às realidades modernas."
 RAJ_towards_new_mil_doct: "Rumo a uma nova doutrina militar"
 RAJ_towards_new_mil_doct_desc: "É hora de admitir que nossa doutrina militar está desatualizada. Se quisermos ser invencíveis no novo milênio, precisamos criar uma nova doutrina militar."
 RAJ_threat_of_the_dragon: "Ameaça do Dragão"
 RAJ_threat_of_the_dragon_desc: "Nossa ameaça número dois é a China, nosso rival de longa data na região. Precisamos analisar sua doutrina militar e nos preparar para seu ataque."
 RAJ_threat_of_the_crescent: "Ameaça do Crescente"
 RAJ_threat_of_the_crescent_desc: "Pakistan is our main enemy in the geopolitical arena. Their army is quite fragmented and we can try to form a competent defense against Pakistan."
 RAJ_threat_of_terror_mil: "Ameaça de Terrorismo"
 RAJ_threat_of_terror_mil_desc: "Nosso novo inimigo que apareceu no século 21 é o terrorismo. Este inimigo é interno e precisamos preparar nosso setor de defesa contra fatores que atuam internamente."
 RAJ_strategic_initiative: "Iniciativa Estratégica"
 RAJ_strategic_initiative_desc: "Devemos tomar a máxima iniciativa estratégica na região e estar prontos para atacar preventivamente o inimigo. A preparação para tal cenário é essencial."
 RAJ_military_infrastructure: "Infraestrutura Militar"
 RAJ_military_infrastructure_desc: "Para estarmos preparados para uma guerra de longo prazo, precisamos preparar nossas linhas de abastecimento logístico e construir estradas federais."
 RAJ_new_military_methodology: "Nova Metodologia Militar"
 RAJ_new_military_methodology_desc: "Precisamos rejeitar a velha metodologia da guerra e conceituar a nova guerra do nosso tempo com todas as suas especificidades."
 RAJ_preparations_in_kashmir: "Preparativos na Caxemira"
 RAJ_preparations_in_kashmir_desc: "Há muito tempo que ocorrem lutas e confrontos na Caxemira. Este barril de pólvora vai explodir mais cedo ou mais tarde. Precisamos estar prontos."
 RAJ_behead_northwest_separat: "Decapite o Separatismo do Noroeste"
 RAJ_behead_northwest_separat_desc: "Os separatistas há muito procuram destruir a nossa estrutura estatal. Devemos decapitar esta cobra à espreita no nosso jardim!"
 RAJ_antiterror_raids: "Ataques Antiterroristas"
 RAJ_antiterror_raids_desc: "Os ataques contra terroristas deveriam se tornar comuns para as tropas internas. Os islâmicos estão desestabilizando nossa situação, devemos arrancá-los de nossa terra."
 RAJ_counter_terror_trainings: "Treinamentos Antiterrorismo"
 RAJ_counter_terror_trainings_desc: "Devemos preparar a população, o Ministério de Situações de Emergência e as forças policiais para as medidas antiterroristas que serão aplicadas caso haja uma ameaça. Este é um aspecto importante da segurança pública."
 RAJ_bangladesh_line: "Linha de Bangladesh"
 RAJ_bangladesh_line_desc: "Apesar das nossas boas relações com Bangladesh, migrantes ilegais e terroristas de vários matizes tentam periodicamente cruzar nossa fronteira com eles. Devemos tomar contramedidas contra isso."
 RAJ_southeatern_protection: "Proteção Sudeste"
 RAJ_southeatern_protection_desc: "A fronteira com Mianmar é muito instável. Milícias armadas não devem cruzar nossa fronteira."
 RAJ_smallwar_prep: "Preparativos para pequenas guerras"
 RAJ_smallwar_prep_desc: "Devemos estar preparados para guerras locais e operações de manutenção da paz. Estas são pequenas guerras para as quais, no entanto, devemos estar preparados."
 RAJ_preparing_our_reserve: "Preparando nossa Reserva"
 RAJ_preparing_our_reserve_desc: "Devemos estar preparados para operações de combate de longo prazo. Com base nisso, nossas reservas militares devem ser reabastecidas e atualizadas."
 RAJ_bigwar_prep: "Grandes preparativos para a guerra"
 RAJ_bigwar_prep_desc: "Qualquer guerra potencial com o Paquistão e a China é uma grande guerra que pode levar à escalada nuclear. Devemos estar preparados até mesmo para tal cenário."
 RAJ_concept_coldstart: "Conceituar partida a frio"
 RAJ_concept_coldstart_desc: "Cold Start é uma doutrina militar que foi desenvolvida pelas Forças Armadas Indianas para uso em uma possível guerra com o Paquistão. Envolve os vários ramos das forças armadas da Índia conduzindo operações ofensivas como parte de grupos de batalha unificados. A doutrina tem como objetivo permitir que a Índia forças convencionais para realizar ataques para evitar uma retaliação nuclear do Paquistão em caso de conflito."
 RAJ_concept_hotstart: "Conceptualizar Hot Start"
 RAJ_concept_hotstart_desc: "Hot Start is a military doctrine developed by the Indian Armed Forces for rapid offensive operations against China. It involves unified battlegroups from multiple service branches conducting swift offensive actions, intended to achieve decisive results before the conflict can escalate to a nuclear exchange."
 RAJ_religious_groups: "Identidade da Índia"
 RAJ_religious_groups_desc:0 "As 5 principais religiões da [RAJ.GetFlag] §HÍndia§! têm níveis variados de opinião sobre o governo. Obviamente, os §Hhindus§! terão naturalmente uma opinião muito alta do governo. Mas outros, como os §Hmuçulmanos§!, não. Portanto, ao administrar esses grupos religiosos, podemos §Hmanter a paz e a estabilidade§! na nação. Se não conseguirmos manter uma opinião adequada entre esses grupos religiosos, eles podem buscar a §Rindependência§! da [RAJ.GetFlag] §HÍndia§!.\n\nOpinião Hindu: §Y[?RAJ_hindus_opinion]§!\nOpinião Sikh: §Y[?RAJ_sikh_opinion]§!\nOpinião Budista: §Y[?RAJ_buddhist_opinion]§!\nOpinião Cristã: §Y[?RAJ_christians_opinion]§!\nOpinião Muçulmana: §Y[?RAJ_muslim_opinion]§!\n\n§HLimiares§!\n§YTodas as fés:§! A Estabilidade e o Poder Político variam conforme a média das cinco, de §R-10%§! com média de 25 a §G+10%§! com média de 75.\n\n§GTodas as cinco acima de 74:§! A Harmonia Religiosa concede §G+5%§! de Estabilidade, §G+5%§! de Poder Político e §G+0,10§! de População Mensal.\n\n§RAbaixo de 35:§! as regiões dessa fé entram em agitação. Hindus abaixo de 35 também causam o Descontentamento Hindu: §R-5%§! de Estabilidade, §R-10%§! de Poder Político, §R-3%§! de Apoio à Guerra.\n\n§RAbaixo de 20 (sikhs abaixo de 15):§! abre-se uma crise separatista. Eleve a opinião dessa fé em até §Y180 dias§! ou o estado será desmilitarizado e a rebelião virá em seguida.\n\n§RAbaixo de 5 quando a rebelião irrompe:§! o estado se separa.\n\n§HResolvendo a questão§!\nSomente com todas as fés acima de §Y80§! a árvore de focos pode adotar a §YHarmonia Pluralista§! como lei religiosa nacional, um acordo muito mais forte do que um pluralismo imposto de cima para baixo. Com essa lei em vigor e a Harmonia Religiosa mantida, §YConsagrar o Pluralismo§! o inscreve na ordem constitucional: o bônus fica fixado em seu auge e a opinião comunitária deixa de causar agitação, crises ou secessão.\n"
 RAJ_appease_hindus: "Apaziguar Hindus"
 RAJ_appease_sikhs: "Apaziguar Sikhs"
 RAJ_appease_buddhists: "Apaziguar os Budistas"
 RAJ_appease_christians: "Apaziguar os Cristãos"
 RAJ_appease_muslims: "Apaziguar os muçulmanos"
 RAJ_religion.4.t: "Communal Violence Erupts"
 RAJ_religion.4.d: "Several Christian, Muslim and Hindu groups began fighting over an unknown dispute in one of our larger cities, and pockets of violence are starting to erupt across the country. For now, it doesn't matter why they are fighting - what matters is how we get them to stop."
 RAJ_religion.4.a: "Apoiar os cristãos"
 RAJ_religion.4.b: "Apoie os Hindus"
 RAJ_religion.4.c: "Apoie os muçulmanos"
 RAJ_themodels_ofothers: "Modelos de Outros"
 RAJ_themodels_ofothers_desc: "Devemos analisar os modelos dos exércitos de outros países e adotar os melhores aspectos de suas formações."
 RAJ_milind_of_india: "Indústria Militar da Índia"
 RAJ_milind_of_india_desc: "O setor da indústria de defesa da Índia é um setor estrategicamente importante na Índia. A Índia tem uma das maiores forças militares do mundo, com uma força de mais de 1,44 milhão de efetivos ativos."
 RAJ_new_standart_for_equip: "Novos padrões de equipamentos"
 RAJ_new_standart_for_equip_desc: "Para lutar eficazmente no campo de batalha, precisamos otimizar nossas armas leves."
 RAJ_do_in_india: "Fazer na Índia"
 RAJ_do_in_india_desc: "Precisamos nos livrar da velha abordagem de fabricação de armas."
 indian_event.25.t: "Lidando com Vipin Khanna"
 indian_event.25.d: "Para garantir sua posição no mercado indiano, Vipin Khanna, um conhecido funcionário corrupto da indústria militar indiana, nos ofereceu um acordo que supostamente não podemos recusar. Como faremos isso?"
 indian_event.25.a: "Adeus."
 RAJ_handl_cor_indefcor: "Lidar com a corrupção!"
 RAJ_handl_cor_indefcor_desc: "A corrupção nas forças armadas é ruinosa para as capacidades de segurança e defesa da nossa nação. É necessário prevenir a corrupção no nosso exército"
 RAJ_clearing_out_the_ranks: "Esvaziando os Quadros"
 RAJ_clearing_out_the_ranks_desc: "We have too many redundant personnel in our ranks. To optimize the army, we need to cut them down."
 RAJ_deal_vipin_khanna: "Proposta de Vipin Khanna"
 RAJ_deal_vipin_khanna_desc: "Vipin Kumar Khanna (14 December 1930 - 7 November 2019) was an Indian business magnate and army officer. Khanna had diverse business interests. He founded Dynamic Sales Service International, a commodities trading and marketing company which further expanded into engineering support, shipbroking, fast-moving consumer goods and additional industries as well."
 RAJ_refr_rech_contr: "Atualizar os Contratos"
 RAJ_refr_rech_contr_desc: "Um exército contratado nos permitirá ter um exército profissional. Precisamos otimizar esta parte."
 RAJ_clearing_ministr: "Limpar o MOD"
 RAJ_clearing_ministr_desc: "O estágio final de nossas reformas militares é aumentar o controle sobre os gestores de nossas forças armadas."
 RAJ_DRDO: "DRDO"
 RAJ_DRDO_desc: "A Organização de Pesquisa e Desenvolvimento de Defesa (DRDO) é o órgão governamental indiano responsável pelo desenvolvimento de tecnologia para fins militares e está subordinado ao Ministério da Defesa da Índia. O objetivo da DRDO é promover a prosperidade da Índia, tornando a ciência e a tecnologia de classe mundial, lançando as bases para a autossuficiência em tecnologias militares críticas e proporcionando uma vantagem decisiva no equipamento tecnológico das forças armadas nacionais."
 RAJ_drdo_idea: "DRDO"
 RAJ_munitions_india_limited: "Munições Índia Limitada"
 RAJ_munitions_india_limited_desc:0 "Uma empresa estatal indiana de defesa com sede em Pune, Índia, fundada em 2021 como parte da reestruturação e corporatização do Conselho de Administração da Ordnance Factory em sete empresas diferentes do setor público. A Ordnance India fabrica principalmente munições, explosivos, mísseis e bombas para uso pelas Forças Armadas Indianas, uso militar estrangeiro e uso civil doméstico."
 RAJ_pinaka_launcher: "Melhor lançador"
 RAJ_pinaka_launcher_desc: "The Pinaka is an Indian 214 mm all-weather multiple rocket launcher (MLRS) designed to engage lightly armored and armored vehicles, manpower and artillery of the enemy, destroy communication nodes, command posts and military-industrial infrastructure. This launcher can also be used for remote installation of anti-personnel and anti-tank mines. The development of this MLRS was started in 1983, and in 1999 it was adopted by the Indian Army. The Pinaka MLRS was reportedly used in combat during the Kargil War, a border conflict between India and Pakistan that took place in 1999. The first regiment to be armed with the Pinaka MLRS was formed in 2000."
 RAJ_HSLDB: "HSLDB"
 RAJ_HSLDB_desc: "A Índia precisa fortalecer sua indústria de foguetes para defender e explorar o espaço com sucesso."
 RAJ_shivalik: "Granadas Shivalik"
 RAJ_shivalik_desc: "A granada Shivalik é uma granada nativa da Índia. Foi desenvolvida pelo Laboratório de Pesquisa Balística Terminal, TBRL, um laboratório da Organização de Pesquisa e Desenvolvimento de Defesa, DRDO, que está localizado no sopé das montanhas Shivalik, perto de Chandigarh, e, portanto, seu nome deriva daqui."
 RAJ_armor_vehic_nigam:0 "Veículos blindados Nigam"
 RAJ_armor_vehic_nigam_desc:0 "Armored Vehicles Nigam Limited (AVANI) é uma empresa estatal indiana de defesa, com sede em Avadi, Chennai, Índia, fundada em 2021 como parte da reestruturação e corporatização do Ordnance Factory Board em sete empreendimentos do setor público diferentes. AVANI fabrica principalmente veículos blindados de combate, tanques de batalha principais e seus motores para uso dos índios."
 RAJ_arjun: "Tanque de Batalha Principal ARJUN"
 RAJ_arjun_desc: "Arjun é um tanque de batalha principal desenvolvido pelo maior empreiteiro de defesa da Índia, a Organização de Pesquisa e Desenvolvimento de Defesa (DRDO), para o Exército Indiano. O tanque leva o nome de Arjun, um dos personagens principais do poema épico indiano, o Mahabharata."
 RAJ_t90_rus: "Russo T90"
 RAJ_t90_rus_desc: "The Russian T-90 main battle tank entered service in 1992. In 1999, it was given the informal name 'Vladimir'."
 RAJ_british_challenger: "Desafiador Britânico"
 RAJ_british_challenger_desc: "Um tanque de batalha principal produzido pela empresa britânica Vickers Defense Systems (agora parte da BAE Systems). É o terceiro tanque a levar o nome Challenger. Embora o Challenger 2 tenha sido desenvolvido com base no Challenger, o novo tanque difere do modelo anterior com novos equipamentos e componentes: apenas 5% das peças são comuns a ambos os modelos. O Challenger 2 substituiu agora o modelo anterior em serviço no Exército Britânico."
 RAJ_bmp_sarath: "BMP Sarath"
 RAJ_bmp_sarath_desc: "O BMP-2 Sarath é uma variante indiana do Veículo de Combate de Infantaria BMP-2 (ICV) que foi fabricado sob licença pelo Ordnance Factory Board na Índia. O BMP-2 Sarath foi introduzido pela primeira vez em serviço com os indianos Exército no início dos anos 1990."
 RAJ_mod_tru_stallion: "Garanhão Ashok Leyland"
 RAJ_mod_tru_stallion_desc: "Uma série de caminhões off-road indianos médios e pesados, produzidos pela empresa Ashok Leyland desde 1987. Os caminhões são projetados sobre chassis Ford Cargo. Uma parte significativa dos veículos é produzida para o Exército Indiano."
 RAJ_adv_weapons_eqip_lim: "Armas e equipamentos avançados da Índia"
 RAJ_adv_weapons_eqip_lim_desc: "Quanto mais oportunidades econômicas tivermos, mais precisaremos de um exército. As antigas ordens estão sendo cada vez mais eliminadas e novas estão surgindo, especialmente em nosso exército."
 RAJ_field_gun_fact: "Fábrica de armas de campo"
 RAJ_field_gun_fact_desc:0 "Field Gun Factory, Kanpur (FGK) é uma fábrica localizada em Kanpur, Índia. Inaugurada em 1979, é o membro mais jovem da divisão de Armas, Veículos e Equipamentos (WV&E) das Fábricas de Artilharia Indianas. O corpo docente pode construir vários tipos de armas de campo."
 RAJ_gun_jabalpur: "Fábrica de transporte de armas Jabalpur"
 RAJ_gun_jabalpur_desc: "Uma fábrica de defesa e localidade no distrito de Jabalpur, em Madhya Pradesh, Índia. Localizado nos arredores pitorescos da cordilheira de Satpura, este pequeno município governamental é construído em torno de uma fábrica de defesa de mesmo nome. Fica a cerca de 3 km da cidade de Jabalpur estação ferroviária e também está intimamente ligada à cidade. Está rodeada por outros estabelecimentos de defesa. Escolas centrais, hospitais, igrejas, templos e clubes estão localizados dentro da propriedade."
 RAJ_gun_shell_factory: "Fábrica de armas e conchas Cossipore"
 RAJ_gun_shell_factory_desc: "Fábrica de Armas e Conchas, Cossipore, Calcutá, é a unidade-mãe das Fábricas de Artilharia Indianas sob o Conselho da Fábrica de Artilharia, apropriadamente conhecida como o quarto braço de defesa. A fábrica começou sua jornada quando o terreno sagrado em Cossipore foi comprado no ano de 1801 e as atividades de produção tiveram início em 18 de março de 1802."
 RAJ_ordnance_factory_tiruchapari: "Fábrica de Artilharia Tiruchirappalli"
 RAJ_ordnance_factory_tiruchapari_desc: "Uma fábrica de armas leves operada pela Advanced Weapons and Equipment India Limited, uma empresa com sede em Tiruchirappalli, Tamil Nadu, que anteriormente fazia parte do Conselho da Fábrica de Artilharia do Ministério da Defesa do Governo da Índia. A empresa é dirigida exclusivamente por um diretor da IOFS denominado Gerente Geral, que é o CEO responsável pela gestão geral da empresa. A OFT é a maior empresa fabricante de armas leves da Índia e possui a mais diversificada gama de produtos."
 RAJ_ordnance_factory_korwa: "Projeto de Fábrica de Artilharia Korwa"
 RAJ_ordnance_factory_korwa_desc: "Projeto de Fábrica de Artilharia, Korwa é um projeto acelerado e modernizado do Conselho da Fábrica de Artilharia. O projeto foi estabelecido em dezembro de 2007 em Amethi, UP. HAL, Korwa é uma unidade de defesa vizinha. Esta fábrica é a última novidade no limite da Organização OF, possuindo tecnologia de ponta."
 RAJ_ordnance_kanpur: "Fábrica de material bélico Kanpur"
 RAJ_ordnance_kanpur_desc: "Ordnance Factory Kanpur é uma das 41 fábricas de Artilharia sob a égide do Ordnance Factory Board (OFB), Calcutá. Foi concebido no ano de 1942 como Projeto de Transplante na esteira da ameaça iminente das potências do eixo emergindo da frente oriental durante a Segunda Guerra Mundial. A fábrica está localizada na estrada Kalpi, a uma distância de oito km da estação ferroviária central de Kanpur."
 RAJ_small_factory_kanpur: "Expandindo OFK"
 RAJ_small_factory_kanpur_desc: "O Conselho da Fábrica de Artilharia (OFB), composto pelas Fábricas de Artilharia Indianas, agora conhecida como Diretoria de Artilharia (Coordenação e Serviços) era uma organização subordinada ao Departamento de Produção de Defesa (DDP) do Ministério da Defesa (MoD), Governo da Índia. As 41 fábricas de material bélico indianas foram convertidas em 7 empreendimentos do setor público de defesa (DPSUs)."
 RAJ_ordnance_factory_ishapore: "Fábrica de Rifles Ishapore"
 RAJ_ordnance_factory_ishapore_desc: "Empresa estatal indiana de fabricação de armas com sede em Ichhapur, Bengala Ocidental."
 RAJ_troop_comfrt: "Tropa Conforto Limitado"
 RAJ_troop_comfrt_desc: "Precisamos conter o desleixo em nossas forças armadas para melhorar sua qualidade."
 RAJ_upd_mil_unif: "Lei de Revisão do Uniforme Digital"
 RAJ_upd_mil_unif_desc: "Nosso exército precisa de boa comunicação para manter a eficácia da missão."
 RAJ_upd_cloth: "Atualização de equipamento das Forças Especiais"
 RAJ_upd_cloth_desc: "É hora de melhorar o equipamento de nossas forças especiais."
 RAJ_gliders_india_lim: "Gliders India Limited"
 RAJ_gliders_india_lim_desc: "Gliders India Limited (GIL) é uma empresa estatal indiana de defesa, com sede na Ordnance Parachute Factory em Kanpur."
 RAJ_miltech_innov: "Military Tech Innovations"
 RAJ_miltech_innov_desc: "Precisamos fortalecer nossas defesas de rede militar contra intrusões externas."
 RAJ_india_optel: "Índia Optel Limited"
 RAJ_india_optel_desc: "India Optel Limited é uma empresa estatal indiana de defesa, com sede em Dehradun."
 RAJ_electr_optic: "Expandindo a pesquisa OVN"
 RAJ_electr_optic_desc: "O OVN anterior do Exército Indiano está obsoleto. Precisamos melhorá-lo."
 RAJ_yantra_india: "Yantra Índia Limitada"
 RAJ_yantra_india_desc: "Yantra India Limited é uma importante PSU estatal indiana de produção de defesa, com sede em Nagpur, Índia."
 RAJ_mil_electr: "Pesquisa Eletrônica Militar"
 RAJ_mil_electr_desc: "Nossos concorrentes estrangeiros evoluíram há muito tempo na área de eletrônicos. Precisamos alcançá-los."
 RAJ_command_innov: "Comandando Inovações"
 RAJ_command_innov_desc: "Precisamos melhorar nossos sistemas de comunicação de comando."
 RAJ_bharat_desc: "Empresa estatal da Índia, uma das maiores fornecedoras de equipamentos eletrônicos para o Exército Indiano. A empresa possui 9 fábricas e vários escritórios regionais."
 RAJ_indian_radar: "Radares Indianos"
 RAJ_indian_radar_desc: "Radar de detecção de baixo alcance, também chamado de radar Doppler indiano, uma série de radares 2D foram desenvolvidos pelo Estabelecimento de Desenvolvimento de Eletrônicos e Radar da Organização de Pesquisa e Desenvolvimento de Defesa para o Exército e a Força Aérea. Eles foram então fabricados pela Bharat Electronics, que geralmente é um parceiro de fabricação do LRDE. O INDRA-I é um radar de vigilância móvel para detecção de alvos de baixo nível, enquanto o INDRA-II foi projetado para interceptação de alvos guiados no solo."
 RAJ_akash_missiles: "Mísseis Akash"
 RAJ_akash_missiles_desc: "Akash é um sistema de mísseis antiaéreos de curto alcance que está sendo desenvolvido na Índia, projetado para fornecer defesa aérea de instalações e grupos de tropas."
 RAJ_indian_army_air_defense_force_idea: "Defesa Aérea Indiana"
 RAJ_igmdp: "IGMDP"
 RAJ_igmdp_desc: "Um programa do Ministério da Defesa da Índia para pesquisa e desenvolvimento de mísseis de longo alcance. O programa foi gerenciado pela Organização de Pesquisa e Desenvolvimento de Defesa e pelo Conselho de Fábricas de Artilharia em parceria com outras organizações políticas do governo indiano. O projeto começou em 1982-83 sob a liderança de Abdul Kalam, que supervisionou a sua conclusão em 2008, após o desenvolvimento bem sucedido destes mísseis estratégicos."
 RAJ_finsas: "F-INSAS"
 RAJ_finsas_desc:0 "Programa da Índia para equipar sua infantaria com equipamentos de última geração, F-INSAS significa Futuro Soldado de Infantaria como Sistema. No entanto, o Exército Indiano decidiu abandonar o programa F-INSAS em favor de dois projetos separados O novo programa terá dois componentes: o primeiro é armar o Futuro Soldado de Infantaria com os melhores rifles de assalto, carabinas e equipamentos pessoais disponíveis, como capacetes e coletes à prova de balas. O segundo componente são os Sistemas de Gerenciamento de Campo de Batalha."
 RAJ_trishul: "Trishul"
 RAJ_trishul_desc: "Um míssil terra-ar de baixo nível, curto alcance e ação rápida desenvolvido na Índia pela Organização de Pesquisa e Desenvolvimento de Defesa no âmbito do Programa Integrado de Desenvolvimento de Mísseis Guiados. Também pode ser usado como uma guerra anti-submarina míssil de um skimmer naval contra mísseis voando baixo, helicópteros de ataque e aeronaves."
 RAJ_3dcar: "3D-CAR"
 RAJ_3dcar_desc: "Radar indiano de três eixos desenvolvido pela DRDO para o Akash SAM. Capaz de rastrear até 150 alvos."
 RAJ_agni_tech: "Tecnologia Agni"
 RAJ_agni_tech_desc: "O Agni-III (IAST: Agni, lit. 'Fogo') é um míssil balístico indiano de alcance intermediário colocado em serviço em 2011 como o sucessor do Agni-II. Tem um alcance de 3.500 a 5.000 quilômetros ( 2.200 a 3.100 milhas) e pode atingir alvos em países vizinhos, incluindo a China."
 RAJ_prithvi_missile: "Pesquisa Prithvi"
 RAJ_prithvi_missile_desc: "Uma família de mísseis balísticos superfície-superfície das Forças Armadas Indianas."
 RAJ_prithvi_1: "Prithvi Missile Family"
 RAJ_prithvi_1_desc: "Develop the full Prithvi line of short-range ballistic missiles across all three services. The Army variant flies 150 km with a 1000 kg payload, the Air Force variant reaches 250 km, and the naval variant pushes to 350 km on a two-stage solid-fuel design."
 RAJ_prithvi_4: "Prithvi-IV"
 RAJ_prithvi_4_desc: "An advanced intercontinental ballistic missile under development, representing the next generation of India's strategic deterrence capability. Its deployment would cement India's position as a global nuclear power."
 RAJ_uniting_mil_ind_prod: "Unindo a Produção Militar"
 RAJ_uniting_mil_ind_prod_desc: "É hora de unir todos os ramos militares, para otimizar nossas forças armadas."
 RAJ_uniting_mil_ind_prod_phase: "Unindo a Fase 2 da Produção Militar"
 RAJ_uniting_mil_ind_prod_phase_desc: "Mais equipamento militar, mais chances para nosso objetivo."
 RAJ_indian_arms_exports: "Exportações de armas indianas"
 RAJ_indian_arms_exports_desc: "India is a major producer of various armaments. It is capable of taking one of the leading positions in the world by selling arms to other countries. It will also show that India is on par with other military powers"
 RAJ_preserve_caste_system: "Preservar sistema de castas"
 RAJ_preserve_caste_system_desc: "O sistema de castas é um ponto focal da sociedade indiana. Destruí-lo é uma ofensa à nossa religião e tradições!"
 RAJ_dharmic_alliance: "Aliança Dármica"
 RAJ_dharmic_alliance_desc: "Todas as religiões dármicas vêm de uma raiz. Foi o solo de Bharat que deu a todas elas a chance de existir. Devemos abraçá-lo."
 RAJ_hindu_nationalism: "Nacionalismo Hindu"
 RAJ_hindu_nationalism_desc: "Hindutva is the only possible way of living for our society. Being Indian is a sign which every one of our citizens should be proud of."
 RAJ_indian_traditionalism_desc: "Traditions are most necessary of things which glue society into one. No matter the tribal origin, we all share the same traditions and it unites us together."
 RAJ_stomp_out_islam: "Elimine o Islã"
 RAJ_stomp_out_islam_desc: "Islam has long been a source of trouble for our country. We shall work to reduce its influence to a minimum!"
 RAJ_international_nationalism: "Nacionalismo Internacional"
 RAJ_international_nationalism_desc: "Todas as diferentes nações são uma só aos olhos de Akhand Bharat. Nossas raízes étnicas e religiosas comuns são aquilo em que devemos nos concentrar exclusivamente."
 RAJ_deport_muslims: "Deport Disloyal Muslims"
 RAJ_deport_muslims_desc: "Many disloyal Muslim preachers are continuing to radicalize our Muslim-majority provinces. This is unacceptable and must be prevented."
 RAJ_hindu_rashatra: "Hindutva Rashtra"
 RAJ_hindu_rashatra_desc: "O militarismo deve ser colocado na mente de nossa nação por todos os meios. Estar armado e unido é a nossa força!"
 RAJ_indias_elections: "Eleições Indianas"
 RAJ_indias_elections_desc: "A Índia é o melhor exemplo de democracia onde cada partido tem a oportunidade de se tornar o partido líder do país. Devemos decidir que caminho nosso país seguirá para chegar a um futuro brilhante - ou não tão brilhante."
 RAJ_manmohan_singh: "Manmohan Singh"
 RAJ_manmohan_singh_desc: "Manmohan Singh é o primeiro-ministro designado da Índia e membro do Partido do Congresso. Singh garantiu a nomeação para primeiro-ministro em 19 de maio de 2004, quando o presidente APJ Abdul Kalam lhe pediu oficialmente para formar um governo."
 RAJ_manmohan_technocracy: "Tecnocracia de Manmohan"
 RAJ_manmohan_technocracy_desc: "Tecnocracia é uma forma de governo em que a sociedade é governada por aqueles com conhecimento técnico. Em uma tecnocracia, os líderes são selecionados com base em seu conhecimento tecnológico ou científico. O método científico é aplicado para resolver questões sociais e políticas dentro da tecnocracia, em vez de votar democraticamente numa solução ou compromisso."
 RAJ_keeping_reput: "Mantendo a reputação"
 RAJ_keeping_reput_desc: "We must save our face in front of religious groups by establishing friendly contacts with them, as well as gradually, integrating freer narratives into society."
 indian_event.26.t: "Declaração de Brasília"
 indian_event.26.d:0 "A Declaração de Brasília foi assinada pelos ministros das Relações Exteriores da Índia, Brasil e África do Sul. Eles concordaram sobre a necessidade urgente de reformas nas Nações Unidas, especialmente no Conselho de Segurança. A declaração era de opinião que o O Conselho de Segurança das Nações Unidas deve reflectir o actual cenário mundial e também abordou os temas do terrorismo internacional, da criminalidade transnacional e do tráfico ilegal de armas, afirmando que tais ameaças à paz internacional devem ser eficazmente combatidas com respeito pela soberania dos Estados e pela paz internacional. Lei."
 indian_event.26.a: "Ótimo"
 RAJ_ibsa_dialogue_forum: "Fórum de Diálogo IBSA"
 RAJ_ibsa_dialogue_forum_desc: "O Fórum de Diálogo IBAS é um agrupamento tripartido internacional para promover a cooperação internacional entre diferentes países."
 RAJ_fighting_corruption: "Combate à Corrupção"
 RAJ_fighting_corruption_desc: "O problema da corrupção está apodrecendo o nosso país! Devemos combatê-lo imediatamente e garantir a justiça do nosso estado."
 RAJ_isr_ind_cong_meet: "Reunião Diplomática Israel-Índia"
 RAJ_isr_ind_cong_meet_desc: "High-level dialogue with Israel deepens military and intelligence cooperation."
 RAJ_national_guarantee_employment_act: "Lei Nacional de Garantia de Emprego"
 RAJ_national_guarantee_employment_act_desc: "Lei Nacional de Garantia de Emprego Rural Mahatma Gandhi de 2005 ou MGNREGA, anteriormente conhecida como Lei Nacional de Garantia de Emprego Rural ou NREGA, é uma medida de bem-estar social indiana que visa garantir o direito ao trabalho."
 RAJ_delhi_beijing_speakers: "Delhi-Beijing Talks"
 RAJ_delhi_beijing_speakers_desc: "Although many may see our relations with China as irreparable, we still must put effort for stabilization."
 RAJ_isr_ind_cong_pack_inv: "Pacote de Investimentos Israel-Índia"
 RAJ_isr_ind_cong_pack_inv_desc: "Mutual investments between India and Israel would benefit both countries. Why not start this project?"
 RAJ_russia_weapon_package: "Pacote de Armas Russas"
 RAJ_russia_weapon_package_desc: "Russia is our long-time partner. We shall acquire new weapon package from them, as it will greatly improve our defensive capabilities."
 RAJ_iran_india_pak_gas_pip: "Gasoduto Índia-Paquistão-Irã"
 RAJ_iran_india_pak_gas_pip_desc: "O projeto do gasoduto Irã-Paquistão-Índia foi iniciado pela primeira vez pelo Irã em meados da década de 1990 para transportar o gás iraniano através do Paquistão até a Índia. No entanto, a ideia em si foi proposta pela primeira vez no final da década de 1950 em um artigo científico publicado pelo Colégio Militar de Engenharia do Paquistão. A ideia surgiu em 1989, quando o Paquistão enfrentou uma escassez de gás. Um acordo preliminar, que foi assinado entre Teerã e Islamabad em 1995, foi posteriormente acompanhado pela Índia em 1999"
 indian_event.27.t: "Proposta de gasoduto indiano"
 indian_event.27.d: "India proposes a new Gas pipeline project, encompassing India, Pakistan and Iran participating in it. Should we agree to join?"
 indian_event.27.o1: "Claro, é útil!"
 indian_event.27.o2: "Mande esses diplomatas de volta."
 RAJ_cont_the_course: "Continuando o curso"
 RAJ_cont_the_course_desc: "We should continue our course of democratization and anti-corruption procedures."
 RAJ_golden_quadlit: "Quadrilátero Dourado"
 RAJ_golden_quadlit_desc: "O Quadrilátero Dourado é uma rede rodoviária nacional que conecta vários grandes centros industriais, agrícolas e culturais da Índia."
 RAJ_final_inf_prog: "Finalizando Programa de Infraestrutura"
 RAJ_final_inf_prog_desc: "Agora poderemos concluir o programa de construção de infraestrutura."
 RAJ_value_added_tax: "Imposto sobre Valor Agregado"
 RAJ_value_added_tax_desc: "Deveríamos reformar nosso sistema tributário para que seja mais apropriado para os dias modernos."
 RAJ_national_rural_health_mis: "Missão Nacional de Saúde Rural"
 RAJ_national_rural_health_mis_desc: "A Missão Nacional de Saúde Rural é um esquema de seguro saúde apoiado pelo governo que será lançado para fornecer cuidados de saúde acessíveis, acessíveis e de qualidade nas áreas rurais. O foco principal deste esquema está nas famílias de baixa renda nas áreas rurais áreas."
 RAJ_27_perc_project_medic: "Projeto 27 por cento"
 RAJ_27_perc_project_medic_desc:0 "O governo deve implementar a proposta de reservar 27% das vagas no All India Institute of Medical Studies (AIIMS), nos Indian Institutes of Technology, nos Indian Institutes of Management e em outras instituições centrais de ensino superior para outras classes atrasadas"
 RAJ_crusing_indian_antires_protests: "Esmagando os protestos anti-reservas indianos"
 RAJ_crusing_indian_antires_protests_desc: "Uma série de protestos ocorreu na Índia em oposição à decisão do Governo da União da Índia, liderado pela coalizão multipartidária United Progressive Alliance, liderada pelo Congresso Nacional Indiano, de implementar reservas para as Outras Classes Atrasadas em institutos centrais e privados de ensino superior."
 RAJ_rights_to_education_act: "Lei do Direito à Educação"
 RAJ_rights_to_education_act_desc: "A Lei do Direito das Crianças à Educação Gratuita e Obrigatória ou Lei do Direito à Educação é uma lei do Parlamento da Índia, que descreve as modalidades da importância da educação gratuita e obrigatória para crianças entre 6 e 14 anos de idade em Índia nos termos do Artigo 21A da Constituição Indiana."
 RAJ_unlaw_prev_act: "Lei de Prevenção de Atividades Ilícitas"
 RAJ_unlaw_prev_act_desc: "A Lei de Prevenção de Atividades Ilícitas é uma lei indiana que visa a prevenção de associações de atividades ilegais na Índia. Seu principal objetivo era disponibilizar poderes para lidar com atividades dirigidas contra a integridade e a soberania da Índia."
 RAJ_national_investigation_agency: "Fundada Agência Nacional de Investigação"
 RAJ_national_investigation_agency_desc: "A Agência Nacional de Investigação é uma agência especializada de aplicação da lei antiterrorista na Índia. A agência tem poderes para lidar com a investigação de crimes relacionados ao terrorismo em todos os estados, sem permissão especial dos estados, sob proclamação por escrito do Ministério de Assuntos Internos. "
 RAJ_enlarge_inv_agency: "Ampliar Agência Nacional de Investigação"
 RAJ_enlarge_inv_agency_desc: "A Agência Nacional de Investigação deveria ter mais liberdade e espaço para agir de forma mais eficiente e trazer resultados mais rapidamente."
 RAJ_reconstruct_kashmir: "Reconstruir Caxemira"
 RAJ_reconstruct_kashmir_desc: "A Caxemira não está nas melhores condições, para dizer o mínimo. Devemos reconstruí-la para ganhar a lealdade das pessoas de lá e torná-la economicamente estável."
 RAJ_aadhar_project: "Projeto Aadhaar"
 RAJ_aadhar_project_desc: "Aadhaar é um número de identidade exclusivo de 12 dígitos que pode ser obtido voluntariamente pelos cidadãos da Índia e estrangeiros residentes que passaram mais de 182 dias nos doze meses imediatamente anteriores à data do pedido de inscrição, com base em seus dados biométricos e demográficos dados."
 RAJ_rights_to_child_free_comp_act: "Lei do Direito das Crianças à Educação Gratuita e Obrigatória"
 RAJ_rights_to_child_free_comp_act_desc:0 "A Seção 3 prevê a toda criança de seis a quatorze anos o direito à educação gratuita e obrigatória em uma escola de bairro até a conclusão do ensino fundamental. A ideia de escolas de bairro pode ser atribuída ao Sistema Nacional de Educação como elaborado no relatório da Comissão Kothari, segundo o qual a escola do bairro deve ser um espaço comum, onde todas as crianças que atravessam castas, classes e gêneros aprendem juntas da melhor maneira inclusiva."
 RAJ_rights_to_land_acquiq: "Lei RFCTLARR"
 RAJ_rights_to_land_acquiq_desc: "A Lei do Direito à Compensação Justa e à Transparência na Aquisição de Terras, Reabilitação e Reassentamento é uma Lei do Parlamento Indiano que regulamenta a aquisição de terras e estabelece o procedimento e as regras para a concessão de compensação, reabilitação e reassentamento às pessoas afetadas na Índia. "
 RAJ_rights_to_info: "Lei do Direito à Informação"
 RAJ_rights_to_info_desc: "A Lei do Direito à Informação é proposta para estabelecer o regime prático do direito à informação para os cidadãos garantirem o acesso à informação sob o controle das autoridades públicas, a fim de promover a transparência e a responsabilização no funcionamento de todas as autoridades públicas, a constituição de uma Comissão Central de Informação e de Comissões Estaduais de Informação e para assuntos com elas conexos ou incidentais."
 RAJ_reform_constitution: "Reformando a Constituição"
 RAJ_reform_constitution_desc: "A reforma da nossa antiga constituição é um passo necessário na renovação do sistema político indiano."
 RAJ_hindutva_front: "Frente Hindutva"
 RAJ_hindutva_front_desc: "Enraizado na ideologia do nacionalismo hindu, o movimento Hindutva procura afirmar a primazia da cultura e dos valores hindus dentro do mosaico diversificado da Índia. À medida que as tensões aumentam, o seu apelo ganha força entre as massas."
 RAJ_akhil_bharat_mahsabasa: "Akhil Bharat Hindu Mahasabha"
 RAJ_akhil_bharat_mahsabasa_desc: "Fundado no início do século 20, o Hindu Mahasabha tinha como objetivo proteger os direitos dos hindus em um subcontinente em mudança. Com ligações às forças armadas e uma visão de um Rashtra Hindu, ou Nação Hindu, eles imaginam uma Índia robusta e unificada ."
 RAJ_maharashtra_navnirman_sena: "Maharashtra Navnirman Sena"
 RAJ_maharashtra_navnirman_sena_desc: "Separando-se do Shiv Sena no século 21, o Maharashtra Navnirman Sena (MNS) carrega a tocha do orgulho e da identidade Marathi. Como uma força regional rival, eles desafiam o domínio de sua organização-mãe, buscando um caminho único para afirmar os interesses de Maharashtra."
 RAJ_shiv_sena: "Shiv Sena"
 RAJ_shiv_sena_desc: "Estabelecido em 1966, o Shiv Sena há muito defende os direitos dos maharashtrianos em Mumbai. Embora sua influência tenha se expandido para cobrir temas nacionalistas hindus mais amplos, seu legado e domínio estão agora ameaçados por concorrentes regionais emergentes como o MNS."
 RAJ_uniting_the_nationalist_front: "Unindo a Frente Nacionalista"
 RAJ_uniting_the_nationalist_front_desc: "A união da Frente Nacionalista só poderia ser feita pelo Hindu Mahasabha, pois somos o ponto de união entre suas rivalidades."
 RAJ_breaking_the_neck_of_shivsena: "Quebrando o pescoço do Shiv Sena"
 RAJ_breaking_the_neck_of_shivsena_desc: "Shiv Sena são pretendentes estúpidos que questionam nossa autoridade! Devemos esmagar sua popularidade!"
 RAJ_stomping_the_pretenders: "Pisando os Pretendentes"
 RAJ_stomping_the_pretenders_desc: "Maharashtra Navnirman Sena são pretendentes estúpidos que questionam nossa autoridade! Devemos esmagar sua popularidade!"
 RAJ_new_national_india: "Nova Índia Nacional"
 RAJ_new_national_india_desc: "India has now come to its fundamentals. Praised be the Bharat!"
 RAJ_indian_traditionalism: "Tradicionalismo Indiano"
 RAJ_religious_conversions: "Conversões religiosas"
 RAJ_religious_conversions_desc: "We should put effort into converting Muslims and Christians into dharmic religions to ensure their loyalty to our regime."
 RAJ_threaten_pakistan: "Ameaçar o Paquistão"
 RAJ_threaten_pakistan_desc: "Paquistão? Nunca ouvi falar! Talvez você se referisse à Bharat Ocidental?"
 RAJ_antiwestern_propaganda: "Propaganda Antiocidental"
 RAJ_antiwestern_propaganda_desc:0 "Ah, o Ocidente! Suas bobagens deveriam ser ridicularizadas e mostradas como um exemplo de estupidez!"
 RAJ_antichina_propaganda: "Propaganda Antichinesa"
 RAJ_antichina_propaganda_desc:0 "RPC, sendo um regime totalitário que é um exemplo do que acontece a um país, quando as suas tradições e morais são substituídas por estúpidos livros vermelhos!"
 RAJ_prep_reb_tibet: "Preparar a Rebelião no Tibete"
 RAJ_prep_reb_tibet_desc: "The people of Tibet have long been oppressed by the Chinese government. We should help them break free from the Northern Dragon!"
 RAJ_prepare_tooth: "Prepare o dente"
 RAJ_prepare_tooth_desc: "Military preparation and Hindu nationalist fervor strengthen India's military posture."
 RAJ_sharpen_the_claws: "Afie as Garras"
 RAJ_sharpen_the_claws_desc: "The sharpened claws of righteous warriors, thirsty for battle."
 RAJ_greater_india: "Akhand Bharat"
 RAJ_greater_india_desc: "Akhand Bharat ideology seeks territorial expansion and Hindu nationalist consolidation."
 RAJ_demand_nepal_and_butan: "Exija Nepal e Butão"
 RAJ_demand_nepal_and_butan_desc: "The British separated Bhutan and Nepal from us. What an outrageous decision! We shall revert it to what it should be."
 RAJ_demand_bangladesh: "Exija Bangladesh"
 RAJ_demand_bangladesh_desc: "Bangladesh está separado de nós há muito tempo. Deveríamos nos unir."
 RAJ_regional_partnership: "Reviver Azad Hind"
 RAJ_regional_partnership_desc: "Azad Hind deve ser revivido como um novo exército voluntário que protegerá nossa soberania."
 RAJ_influence_indochina: "Influenciar a Indochina"
 RAJ_influence_indochina_desc: "A Indochina tem o Indo por uma razão! Foi e será parte de Akhand Bharat!"
 RAJ_no_to_democracy: "Abolir a Democracia"
 RAJ_no_to_democracy_desc: "Eca, democracia. Nós realmente precisamos dela?"
 RAJ_anew_raj: "Escolhendo um novo Raja"
 RAJ_anew_raj_desc: "Monarchy restoration appeals to nationalist and traditionalist movements seeking authoritarian rule."
 RAJ_grand_pan_indian_counc: "Grande Conselho Pan-Indiano"
 RAJ_grand_pan_indian_counc_desc: "Modern problems require modern solutions! We shall assemble a new, meritocratic government to ensure stability and prosperity for India!"
 RAJ_dictatorship_benev: "Ditadura Benevolente"
 RAJ_dictatorship_benev_desc: "Os militares só têm o direito de governar o nosso país. Eles são os protetores da nossa terra e se tornarão os novos governantes."
 RAJ_hijack_moderates: "Sequestrar Moderados"
 RAJ_hijack_moderates_desc: "Os eleitores moderados devem ser doutrinados em nossas ideias para garantir sua lealdade."
 RAJ_bharatiya_janata_party: "Festa Bharatiya Janata"
 RAJ_bharatiya_janata_party_desc: "O Partido Bharatiya Janata é um partido político na Índia e um dos dois principais partidos políticos indianos ao lado do Congresso Nacional Indiano."
 militar_coal_tt: "§YMilitares serão adicionados à coalizão governante!§!"
 RAJ_MODI_rator_of_ind_pol: "MoDIrator da Política Indiana"
 RAJ_MODI_rator_of_ind_pol_desc:0 "Narendra Damodardas Modi é um político indiano que se tornou figura de destaque no Partido BJP. Modi foi Ministro-Chefe de Guzerate a partir de 2001 e é membro do Parlamento por Varanasi. É membro do Bharatiya Janata Party e do Rashtriya Swayamsevak Sangh, uma organização paramilitar voluntária nacionalista hindu de direita. É o primeiro-ministro com mais tempo no cargo de fora do Congresso Nacional Indiano."
 RAJ_strongarm_hindutva: "Fortalecendo Hindutva"
 RAJ_strongarm_hindutva_desc: "Our party may not be as radical as other far-right groups in India, but standing on common ideas, we should join in a coalition against the other forces. Modi provides MODIrate solutions."
 RAJ_dab_on_ngos: "Restrições às ONGs"
 RAJ_dab_on_ngos_desc: "ONGs estrangeiras estão ajudando ideias ocidentais a se espalharem em nosso país. Deveríamos nos opor a elas para garantir a popularidade do BJP."
 RAJ_check_MSF: "Verificar MSF"
 RAJ_check_MSF_desc: "Medecins Sans Frontieres, named Doctors Without Borders in English, is a charity that provides humanitarian medical care. It is a non-governmental organisation of French origin known for its projects in conflict zones and in countries affected by endemic diseases."
 RAJ_check_sierra_club: "Verifique o Clube Sierra"
 RAJ_check_sierra_club_desc: "O Sierra Club é uma organização ambiental americana com filiais em todos os 50 estados dos EUA, Washington D.C. e Porto Rico."
 RAJ_check_avaaz: "Verificar Avaaz"
 RAJ_check_avaaz_desc: "A Avaaz é uma organização sem fins lucrativos com sede nos EUA que promove o ativismo global em questões como mudanças climáticas, direitos humanos, direitos dos animais, corrupção, pobreza e conflitos."
 RAJ_abolish_planning_comission: "Abolish Planning Commission"
 RAJ_abolish_planning_comission_desc: "O mercado indiano deveria ser livre e nenhuma restrição severa deveria ser imposta a ele."
 RAJ_full_econ_conv: "Conversão econômica total"
 RAJ_full_econ_conv_desc: "Devemos converter totalmente a nossa economia para o capitalismo de livre mercado. É o único caminho racional para a Índia."
 RAJ_niti_aayog: "Niti Aayog"
 RAJ_niti_aayog_desc: "O NITI Aayog serve como o principal think tank de políticas públicas do governo da Índia e a agência nodal encarregada de catalisar o desenvolvimento econômico e promover o federalismo cooperativo e afastar-se do federalismo de negociação por meio do envolvimento dos governos estaduais da Índia no processo de elaboração de políticas económicas utilizando uma abordagem ascendente."
 RAJ_ensure_free_market: "Garantir Mercado Livre"
 RAJ_ensure_free_market_desc: "Agora, devemos garantir o mercado livre na Índia não apenas de facto, mas também de jure, para tornar as nossas mudanças totalmente integradas."
 RAJ_digital_media_camp: "Campanha de mídia digital"
 RAJ_digital_media_camp_desc: "Usaremos todas as medidas para propaganda de nossos ideais. Mensageiros, mídias sociais, anúncios na Internet - tudo isso deve ser usado em nosso benefício."
 RAJ_urgent_economic_measures: "Medidas Econômicas Urgentes"
 RAJ_urgent_economic_measures_desc: "Modern economy is very dynamical. We should use governmental regulations to stabilize it and ensure its continuity."
 RAJ_digital_litaracy_programme: "Programa de Alfabetização Digital"
 RAJ_digital_litaracy_programme_desc: "O Esquema Digital Saksharta Abhiyan (DISHA) ou Missão Nacional de Alfabetização Digital (NDLM) foi formulado para transmitir treinamento em TI e alfabetização digital para a população de nosso país."
 RAJ_ujjwala_scheme: "Esquema Ujjwala"
 RAJ_ujjwala_scheme_desc:0 "Pradhan Mantri Ujjwala Yojana (PMUY, tradução: Esquema de Redução do Primeiro Ministro) será lançado pelo Primeiro Ministro da Índia Narendra Modi para distribuir 50 milhões de conexões de GLP para mulheres de famílias abaixo da linha de pobreza."
 RAJ_rasht_swasem_sangh: "Rashtriya Swayamsevak Sangh"
 RAJ_rasht_swasem_sangh_desc:0 "O Rashtriya Swayamsevak Sangh é uma organização paramilitar voluntária nacionalista hindu de extrema direita indiana."
 RAJ_make_them_obey: "Faça-os obedecer"
 RAJ_make_them_obey_desc: "NGO's should continue their work as they are quite beneficial for us. However, we should control their ideological propaganda and make them loyal to our cause."
 indian_event.28.t: "Campanha de Modi contra ONGs"
 indian_event.28.d:0 "NGO India has nearly 3.4 million non-governmental organisations, working in a variety of fields ranging from disaster relief to advocacy for marginalised and disadvantaged communities. They are a major part of civil society which bring rapid change and social transformation. NGOs are considered as independent of the state, and voluntary in nature. They depend on individual donations, foreign funding, and aid from different government agencies and private donors. Their work helps rid India of prejudices, corruption, illiteracy, and poverty. But in recent decades, India has been a difficult environment for a number of organisations - particularly those working to empower people against unjust government policies, question structural discrimination and advocate for the rights of Dalits, tribal people, and other deprived groups. A succession of Indian governments have tried to curb their activities."
 indian_event.28.a: "Hah! E parece que tivemos sucesso!"
 indian_event.29.t: "Proposta governamental de projeto de gás"
 indian_event.29.d: "Pradhan Mantri Ujjwala Yojana is launched by Prime Minister of India Narendra Modi to distribute LPG connections to women of Below Poverty Line families. A budgetary allocation was made for the scheme. Should we conduct this scheme in Uttar Pradesh, or extend it to all of India?"
 indian_event.29.a: "Estender para toda a Índia"
 indian_event.29.b: "Foco em uma região"
 RAJ_gasallindia: "Gás para toda a Índia"
 RAJ_gasoneindia: "Gás apenas para Uttar Pradesh"
 RAJ_free_liq_gas: "Pradhan Mantri Ujjwala Yojana"
 RAJ_free_liq_gas_desc: "Chegou a hora de iniciar um novo projeto de distribuição de gás liquefeito para nossa população."
 RAJ_full_india_programme: "Programa Full India"
 RAJ_full_india_programme_desc: "Although it will be hard to accomplish, all of India should be connected to this programme."
 RAJ_only_ujjwala: "Apenas uma região"
 RAJ_only_ujjwala_desc: "Somente as regiões mais pobres deveriam ter esse privilégio de equilibrar a situação social do país."
 RAJ_prior_hindus: "Priorizar os hindus"
 RAJ_prior_hindus_desc: "Os hindus são o núcleo do Estado indiano. Devemos dar-lhes prioridade de todas as maneiras possíveis."
 RAJ_coal_with_right_wing: "Coalizão com Militares"
 RAJ_coal_with_right_wing_desc: "Os militares são realmente a favor das nossas reformas. Devemos garantir a sua lealdade mesmo em questões políticas."
 RAJ_goods_and_services_tax: "Imposto sobre Bens e Serviços"
 RAJ_goods_and_services_tax_desc: "O Imposto sobre Bens e Serviços é um sucessor do IVA usado na Índia sobre o fornecimento de bens e serviços. O GST é uma forma digitalizada de IVA onde você também pode rastrear os bens e serviços. Tanto o IVA quanto o GST têm as mesmas placas de tributação ."
 RAJ_global_mafucat_hub: "Centro Global de Fabricação"
 RAJ_global_mafucat_hub_desc: "Vamos nos tornar o centro industrial global do mundo e ultrapassar a China. É o nosso único objetivo econômico do século!"
 RAJ_partnership_with_armenia: "Parceria com a Armênia"
 RAJ_partnership_with_armenia_desc: "A Armênia tem uma posição geopolítica muito importante para nossas rotas comerciais e, além disso, tem muitas conexões culturais e históricas conosco. Devemos cooperar com eles e estabelecer uma base militar lá para garantir sua segurança."
 RAJ_demonatization_of_rupiah: "Desmonetização das notas indianas"
 RAJ_demonatization_of_rupiah_desc: "O governo da Índia deve anunciar a desmonetização de todas as notas de 500 e 1.000 da série Mahatma Gandhi. Também anunciou a emissão de novas notas de 500 e 2.000 em troca das notas desmonetizadas"
 RAJ_schwach_bharat: "Missão Swachh Bharat"
 RAJ_schwach_bharat_desc: "Missão Índia Limpa é uma campanha nacional iniciada pelo Governo da Índia para eliminar a defecação a céu aberto e melhorar a gestão de resíduos sólidos e criar aldeias livres de defecação a céu aberto."
 RAJ_vaccines_for_india: "Vacinas para a Índia"
 RAJ_vaccines_for_india_desc: "As vacinas deveriam ser gratuitas e disponíveis para todos os grupos sociais em nosso país."
 RAJ_harsh_on_pakistan: "Aumentar as tensões no Paquistão"
 RAJ_harsh_on_pakistan_desc: "O Paquistão vem atacando nossas terras há muito tempo! Devíamos mostrar a eles um pouco de força para pacificar seu apetite."
 RAJ_pressuring_china: "Pressionando a China"
 RAJ_pressuring_china_desc: "A China vem demonstrando animosidade contra nós há muito tempo. Deveríamos mostrar ao mundo o quão horríveis eles são!"
 RAJ_communist_party_of_india: "Partido Comunista da Índia"
 RAJ_communist_party_of_india_desc: "O Partido Comunista da Índia é o partido comunista mais antigo da Índia. O PCI foi fundado na atual Kanpur em 26 de dezembro de 1925."
 RAJ_communist_party_of_india_marxist:0 "Partido Comunista da Índia Marxista"
 RAJ_communist_party_of_india_marxist_desc:0 "O Partido Comunista da Índia Marxista é um partido político comunista na Índia. É o maior partido comunista da Índia em termos de membros e assentos eleitorais e um dos partidos nacionais da Índia."
 RAJ_communist_party_of_india_politc: "Índia Comunista!"
 RAJ_communist_party_of_india_politc_desc: "A Índia finalmente alcançou a revolução socialista! Louvado seja o Outubro Vermelho!"
 RAJ_empow_centre_of_trade_unions: "Capacitar o Proletariado"
 RAJ_empow_centre_of_trade_unions_desc: "O proletariado deveria agora ser totalmente livre e fazer valer os seus direitos na Índia!"
 RAJ_operation_barga: "Operação Barga"
 RAJ_operation_barga_desc: "A Operação Barga foi um movimento de reforma agrária, em toda a zona rural de Bengala Ocidental, para registrar os nomes dos meeiros, evitando o método demorado de registro por meio da máquina de assentamento. Ela concedeu aos bargadars a proteção legal contra o despejo pelos proprietários, e lhes deu direito à parte devida da produção."
 RAJ_a_new_international: "Uma nova Internacional"
 RAJ_a_new_international_desc: "Uma Nova Internacional deve ser montada para fazer com que todos os países comunistas unam forças numa frente unida!"
 indian_event.30.t: "A Índia exige nossa submissão"
 indian_event.30.d: "A Índia exige nossa total integração no país."
 indian_event.30.a: "Nós concordamos."
 indian_event.30.b: "We refuse."
 RAJ_influence_west_bengal: "Anexo Bangladesh"
 RAJ_influence_west_bengal_desc: "Bangladesh deveria se juntar a nós por todos os meios possíveis. Esperamos muito por este momento."
 RAJ_bring_back_5_year_plan: "Trazer de volta o plano de 5 anos"
 RAJ_bring_back_5_year_plan_desc:0 "O absurdo capitalista moderno deveria desaparecer. Planos socialistas de 5 anos são o caminho a percorrer!"
 RAJ_foreign_specialists_idea: "Especialistas Estrangeiros"
 RAJ_foreign_specialists_idea_desc: "Convidamos especialistas estrangeiros para ajudar nosso país com sua economia"
 RAJ_green_economy_idea: "PIB Verde Indiano"
 RAJ_indian_socialism_idea: "Socialismo Indiano"
 RAJ_scandinavian_model_idea: "Modelo Escandinavo"
 RAJ_true_social_democracy_idea: "Verdadeira Social Democracia"
 RAJ_samajwadi_party: "Festa Samajwadi"
 RAJ_samajwadi_party_desc: "Um partido político regional indiano que opera predominantemente no estado de Uttar Pradesh. Fundado em 4 de outubro de 1992, surgiu com a dissolução do Janata Dal. Posiciona-se como um partido socialista democrático."
 RAJ_bycicle_of_socialism: "Bicicleta do Socialismo"
 RAJ_bycicle_of_socialism_desc: "A economia indiana é uma grande bicicleta e nós, os cidadãos da Índia, somos apenas partes dessa bicicleta. Precisamos de uma nova economia de bicicletas para fazer com que a nossa economia funcione como uma estrutura única e siga em frente na nossa bicicleta da prosperidade"
 RAJ_invite_foreign_speicalists: "Convidar especialistas estrangeiros"
 RAJ_invite_foreign_speicalists_desc: "Our people have unfortunately long been exploited by unscrupulous capitalists, who in their fatal quest for the free market, have completely forgotten about the common people. It is time to grease the wheels of the economy."
 RAJ_orthodox_socialism: "Socialismo Ortodoxo"
 RAJ_orthodox_socialism_desc: "A rosa socialista que surgiu e floresceu na Índia está pronta para espalhar os seus espinhos contra a injustiça social e fazer valer os direitos dos trabalhadores na nossa terra."
 RAJ_socialist_india: "Índia Socialista"
 RAJ_socialist_india_desc: "Nosso grande movimento popular não pode prescindir de um bom sistema de planejamento econômico."
 RAJ_befriend_religious_organizations: "Amizade com diferentes religiões"
 RAJ_befriend_religious_organizations_desc: "A bicicleta indiana atropelará qualquer rivalidade, mesmo entre religiões."
 RAJ_neutrality_politics: "Política de Neutralidade"
 RAJ_neutrality_politics_desc: "A Índia é um país cujas políticas internas e externas não deveriam mais depender de pressões externas. Somos agora um líder de nações não alinhadas."
 RAJ_caste_wage_balancing: "Equilíbrio salarial de castas"
 RAJ_caste_wage_balancing_desc: "Devemos otimizar os salários das diferentes castas em nosso país para que haja paz e tranquilidade."
 RAJ_break_status_quo: "Quebrar status quo"
 RAJ_break_status_quo_desc: "Nossa política externa não se trata mais de cooperação militar com outros países. Agora estamos interessados apenas em nossos próprios problemas."
 RAJ_encourage_birth: "Incentivar o nascimento"
 RAJ_encourage_birth_desc: "Encontramos uma maneira melhor de manter alta a taxa de natalidade em nosso país."
 RAJ_prior_for_famil: "Prioridade para famílias"
 RAJ_prior_for_famil_desc: "Devemos patrocinar famílias para melhorar a taxa de natalidade positiva em nosso país."
 RAJ_peserve_traditions: "Preservar Tradições"
 RAJ_peserve_traditions_desc: "Ao ganhar a confiança das diferentes religiões no nosso país, podemos melhorar a nossa situação e avançar para um futuro brilhante."
 RAJ_indian_premor_socialism: "Socialismo Primordial Indiano"
 RAJ_indian_premor_socialism_desc: "Uniremos todas as pessoas do nosso país, independentemente do seu sexo, raça ou cor. Todos receberão o que merecem e a Índia prosperará."
 RAJ_organiz_of_unit_soc_people: "Organizar Unidade de Pessoas Sociais"
 RAJ_organiz_of_unit_soc_people_desc: "Apesar da nossa neutralidade, ainda podemos defender os nossos interesses na arena internacional."
 RAJ_new_indian_democracy: "Nova Democracia Indiana"
 RAJ_new_indian_democracy_desc: "Nosso partido sugere que a velha democracia não era perfeita. Agora é hora de criar uma nova democracia, que seja mais correta do que a que tínhamos."
 RAJ_anticor_soc_meas: "Esforços Anticorrupção"
 RAJ_anticor_soc_meas_desc: "A corrupção no estado é um vírus para o nosso povo. Se não a curarmos, nosso país estará em perigo."
 RAJ_ease_the_caste_stuff: "Facilite as coisas da casta"
 RAJ_ease_the_caste_stuff_desc: "Precisamos reduzir o casteísmo para alcançar a estabilidade no estado."
 RAJ_preserve_soccon: "Preservar o Conservadorismo Social"
 RAJ_preserve_soccon_desc: "Precisamos reduzir o conservadorismo social para manter o espírito seletivo e positivo do nosso povo."
 RAJ_regional_redistr: "Redistribuição Regional"
 RAJ_regional_redistr_desc: "Acreditamos que os custos das pensões e da Segurança Social não estão distribuídos uniformemente no nosso país. Precisamos de mudar isso."
 RAJ_merge_bengal_party: "Mesclar festa de Bengala"
 RAJ_merge_bengal_party_desc: "Nossos partidos devem se unir para que nossa grande bicicleta possa seguir em frente."
 RAJ_reforming_the_conomy_soc: "Reformar a Economia Social"
 RAJ_reforming_the_conomy_soc_desc: "É hora de reformar nossa economia para consertar suas falhas."
 RAJ_7030_economy: "Economia 7030"
 RAJ_7030_economy_desc: "Há muitos pobres em nosso país. São 70% e isso deve ser corrigido. Os outros 30% são ricos e acreditamos que eles conseguirão se sustentar."
 RAJ_reserved_seats: "Assentos Reservados"
 RAJ_reserved_seats_desc: "Para chegarmos a eleições mais honestas, precisamos reservar assentos no governo para evitar a corrupção."
 RAJ_changing_stakeholders: "Alterando partes interessadas"
 RAJ_changing_stakeholders_desc: "Não estamos mais interessados nos antigos patrocinadores."
 RAJ_praise_the_unions: "Elogie os sindicatos"
 RAJ_praise_the_unions_desc: "Os sindicatos são a espinha dorsal do nosso país e devemos proteger os seus interesses a nível estadual."
 RAJ_green_economy_soc: "PIB Verde Indiano"
 RAJ_green_economy_soc_desc: "Conseguimos criar condições favoráveis ao desenvolvimento da economia indiana. Agora podemos saborear os seus frutos"
 RAJ_equal_not_equity: "Igual - Não Patrimônio"
 RAJ_equal_not_equity_desc: "É hora de resolver os problemas finais do nosso país para finalmente chegar a um equilíbrio ideal."
 RAJ_full_soc_conv: "Verdadeira Economia Social-democrata"
 RAJ_full_soc_conv_desc: "Acreditamos que tal sistema permitirá que a Índia floresça por muitos anos."
 RAJ_scandinavian_model: "Modelo Escandinavo"
 RAJ_scandinavian_model_desc: "A Escandinávia é uma região de sucesso, com países bem desenvolvidos em termos econômicos e sociais. A sua opção de desenvolvimento é a que mais nos convém."
 RAJ_communist_influence_zone: "Zona de Influência Comunista"
 RAJ_communist_influence_zone_desc: "Nossos vizinhos devem ser inflamados pelo espírito revolucionário! Devemos espalhar a mensagem do marxismo para eles!"
 RAJ_befriend_china: "Faça amizade com a China"
 RAJ_befriend_china_desc: "Conflitos estúpidos vêm e vão, mas a irmandade internacional permanece. A China deveria se tornar nosso maior amigo!"
 RAJ_sino_indian_alliance: "Aliança Sino-Indiana"
 RAJ_sino_indian_alliance_desc: "Agora temos que estabelecer uma aliança para fazer os capitalistas temerem o nosso poder."
 indian_event.31.t: "Aliança Sino-Indiana"
 indian_event.31.d:0 "Depois de muitos anos de animosidade, nossos países finalmente chegaram a acordos aliados e estão prontos para acabar com o lixo capitalista!"
 indian_event.31.a: "Maravilhoso"
 RAJ_spit_on_revision: "Cuspar nos Revisionistas"
 RAJ_spit_on_revision_desc: "Em contraste, o nosso vizinho recalcitrante, a China, espalha ideias falsas sobre o socialismo \"real\". A sua estrutura política ameaça-nos primeiro, e devemos eliminar a ameaça antes que um ataque preventivo seja lançado contra nós."
 indian_event.32.t: "Índia oferece aliança"
 indian_event.32.d: "Devemos concordar?"
 indian_event.32.a: "Claro."
 indian_event.32.b: "Desculpe, não."
 RAJ_vietnam_indian_alliance: "Aliança Vietnã-Índia"
 RAJ_vietnam_indian_alliance_desc:0 "O Vietnã está muito mais próximo de nossa ideologia do que a China pseudo-socialista. Deveríamos ser amigos deles."
 RAJ_REV_PAK_TT: "§YVamos começar uma revolução no Paquistão para derrubar o governo deles§!"
 RAJ_REV_PER_TT: "§YVamos iniciar uma revolução no Irã para derrubar seu governo§!"
 RAJ_revolution_in_pakistan: "Revolução no Paquistão"
 RAJ_revolution_in_pakistan_desc: "Pakistan should be freed from religious and capitalist chains and be freed by our people!"
 RAJ_iranian_question: "Revolução no Irã"
 RAJ_iranian_question_desc: "Iran should be freed from religious and capitalist chains and be freed by our people!"
 RAJ_crush_nepal_bhutan: "Esmagar Nepal e Butão"
 RAJ_crush_nepal_bhutan_desc: "Nepal e Butão são regimes reacionários que se opõem aos ensinamentos do marxismo. Deveríamos exportar nossa revolução para eles."
 RAJ_promote_bangladeshi_communism: "Subcontinente do Socialismo"
 RAJ_promote_bangladeshi_communism_desc: "Our subcontinent should be fully socialist and that is the only way!"
 RAJ_national_federation_of_women: "Federação Nacional de Mulheres"
 RAJ_national_federation_of_women_desc: "As mulheres devem ser libertadas das cadeias sociais e tornar-se membros iguais da nossa sociedade."
 RAJ_all_ndia_youth_commun: "Movimento Juvenil de Toda a Índia"
 RAJ_all_ndia_youth_commun_desc: "O movimento pioneiro indiano deve ser estabelecido para doutrinar as crianças em nossa ideologia mais verdadeira."
 RAJ_common_minimum_programme: "Common Minimum Programme"
 RAJ_common_minimum_programme_desc: "All poor people must be supported. We cannot leave them behind, even if it means enforcing a new way of life upon them."
 RAJ_fund_cprf: "Ajudando o Partido Comunista da Federação Russa"
 RAJ_fund_cprf_desc: "O Partido Comunista Russo deve ser apoiado para ganhar o controle e se juntar à nossa causa."
 RAJ_promote_marxism_in_indochina: "Promover o marxismo na Indochina"
 RAJ_promote_marxism_in_indochina_desc: "O marxismo deve ser promovido na Indochina, pois é o próximo passo lógico na nossa revolução regional."
 RAJ_crusade_against_religion: "Cruzada Contra a Religião"
 RAJ_crusade_against_religion_desc:0 "Religion? What nonsense! Replace Vaedas with Marx's writings, that will help."
 RAJ_triumph_of_communism: "Triunfo do Comunismo"
 RAJ_triumph_of_communism_desc: "Nosso país é um exemplo de como o socialismo deve ser construído. Inveja ainda mais, capitalistas!"
 RAJ_new_socialism_of_india: "Novo Socialismo da Índia"
 RAJ_new_socialism_of_india_desc: "Our Socialism is new for India. It is our own model and should be exemplary."
 RAJ_ideological_comissars: "Ideological Commissars"
 RAJ_ideological_comissars_desc: "The way of thought in population must be controlled. Ideological Commissars will do the job."
 RAJ_close_parliament: "Comunismo Militar"
 RAJ_close_parliament_desc: "Devíamos estar armados até os dentes, pois os selvagens capitalistas querem conquistar o nosso país!"
 RAJ_REB_S_neutrality: "República Socialista Soviética do Sudeste Asiático"
 RAJ_partnership_with_russia: "Amizade com a Rússia"
 RAJ_partnership_with_russia_desc: "A Rússia já não é tão comunista, mas os nossos laços históricos e a sua nostalgia soviética são boas bases para o diálogo."
 RAJ_congress_of_soviets: "República Socialista Soviética do Sudeste Asiático"
 RAJ_congress_of_soviets_desc: "Time has come. We shall become something more than just Socialist India. We should become SASSR."
 RAJ_new_democratic_india_idea: "Nova Índia Democrática"
 RAJ_bahujan_samaj_party: "Festa Bahujan Samaj"
 RAJ_bahujan_samaj_party_desc:0 "Partido Político Nacional Indiano. Representa os interesses dos Dalits e outros grupos de castas inferiores da população — daí o \"Bahujan\" no nome. As castas e tribos registradas da Índia e outras \"classes atrasadas\" compõem 85% da população."
 RAJ_torch_of_ambedkar: "Tocha de Ambedkar"
 RAJ_torch_of_ambedkar_desc: "A tocha que Ambedkar acendeu em 1927 durante o movimento Mahad agora se transformou em um incêndio que não irá parar até que tenha vingado as atrocidades cometidas contra os Dalits ao longo da história."
 RAJ_social_transformation: "Transformação Social"
 RAJ_social_transformation_desc: "Precisamos transformar nossa sociedade em uma sociedade mais perfeita."
 RAJ_economic_emancipation: "Emancipação Econômica"
 RAJ_economic_emancipation_desc: "Nossa economia requer medidas especiais para otimizá-la."
 RAJ_social_democracy_of_india: "Social Democracy of India"
 RAJ_social_democracy_of_india_desc: "Criaremos uma social-democracia mais avançada e liberal para que o nosso povo sinta que a sua opinião está a ser ouvida."
 RAJ_Indian_federation_of_free_peoples: "Federação Indiana dos Povos Livres"
 RAJ_Indian_federation_of_free_peoples_desc: "Criaremos um país no qual a democracia e a liberdade de expressão se tornarão a base da existência. O resto dos países democráticos terão que nos imitar, porque a democracia deles não é tão perfeita quanto a nossa."
 RAJ_appease_all_castes: "Apaziguar todas as castas"
 RAJ_appease_all_castes_desc: "Todas as castas devem ser pacificadas para que possamos mostrar a todos que todos os direitos e interesses são verdadeiramente respeitados em nosso país."
 RAJ_new_indian_educ: "Nova Educação Indiana"
 RAJ_new_indian_educ_desc: "Nosso Governo preparou uma reforma educacional para que todos os cidadãos do nosso país possam ter acesso a uma boa educação."
 RAJ_rural_employment_prog: "Rural Employment Programme"
 RAJ_rural_employment_prog_desc: "Ainda temos um grande número de desempregados nas áreas rurais. Precisamos resolver isso criando um programa especial de recrutamento e agitação para o trabalho."
 RAJ_more_funding_for_regions: "Mais financiamento para regiões"
 RAJ_more_funding_for_regions_desc: "Para garantir o crescimento da economia da Índia, é necessário alocar mais fundos para o desenvolvimento de suas regiões. Especialmente em locais com infraestrutura deficiente."
 RAJ_caste_wage_balancing1: "Equilíbrio salarial de castas"
 RAJ_caste_wage_balancing1_desc: "Precisamos equilibrar os salários das diferentes castas para garantir a estabilidade do nosso estado."
 RAJ_crush_the_caste: "Esmague a casta"
 RAJ_crush_the_caste_desc: "Precisamos quebrar as castas para que nossa sociedade possa continuar sua transformação."
 RAJ_untouchables_reed: "Reed Intocáveis"
 RAJ_untouchables_reed_desc: "Precisamos melhorar a educação em nosso país para torná-lo mais avançado cientificamente"
 RAJ_make_religions_bow: "Faça as religiões se curvarem"
 RAJ_make_religions_bow_desc: "Todas as religiões em nosso país deveriam estar sujeitas a uma única lei para evitar instabilidade"
 RAJ_secular_india: "Índia secularista"
 RAJ_secular_india_desc: "A Índia não dependerá mais da opinião das religiões."
 RAJ_wipe_out_gandhis_legacy: "Limpar o legado de Gandhi"
 RAJ_wipe_out_gandhis_legacy_desc: "O legado de Gandhi é um grande problema na construção de uma sociedade liberal."
 RAJ_new_indian_civilization: "New Indian Civilization"
 RAJ_new_indian_civilization_desc: "Now the people of India have become more pure than before. We have carried out many reforms that could lead to this. The time has come for a new Indian civilization."
 RAJ_modern_indian_constitut: "Constituição Indiana Moderna"
 RAJ_modern_indian_constitut_desc: "A Índia deve adotar uma nova constituição para se tornar um estado mais civilizado."
 RAJ_one_wife_programme: "Programa Uma Esposa"
 RAJ_one_wife_programme_desc: "Garantiremos que cada família na Índia tenha apenas uma esposa."
 RAJ_redistr_of_wealth:0 "Redistribuir riqueza"
 RAJ_redistr_of_wealth_desc: "A pobreza é o nosso principal inimigo. Temos que combatê-la."
 RAJ_bamcef: "BAMCEF"
 RAJ_bamcef_desc:0 "Uma organização de trabalhadores de comunidades oprimidas, fundada em 1971 por Kanshi Ram, D. K. Haparde e Dinabana. O termo deriva seu significado da Constituição da Índia, que divide os indianos oprimidos e explorados em classes com base em seu status: Castas Registradas, Tribos registradas, outras classes atrasadas e comunidades minoritárias."
 indian_event.33.t: "A Índia exige nossa submissão"
 indian_event.33.d: "A Índia exige nossa total integração no país."
 indian_event.33.a: "Nós concordamos."
 indian_event.33.b: "We refuse."
 nat_coal_tt: "§GVamos unir todos os nacionalistas!§!"
 mah_coal_tt: "§YVamos sequestrar a popularidade de Shiv Sena!§!"
 shiv_coal_tt: "§YVamos sequestrar a popularidade do MNS Sena!§!"
 RAJ_indian_ceasar_idea: "Tradicionalismo Indiano"
 dep_musl_tt: "§YWe will deport Muslims from India!§!"
 RAJ_REV_TIB_TT: "§YVamos iniciar uma rebelião no Tibete!§!"
 indian_event.34.t: "Rebelião do Tibete!"
 indian_event.34.d: "Tibet has declared independence and demands our recognition. What should we do?"
 indian_event.34.a: "Esmague-os!"
 indian_event.34.b: "Pazaaaa? Talvez?"
 RAJ_greater_hindustan_decisions_category: "Grande Expansão do Hindustão"
 RAJ_greater_hindustan_decisions_category_desc: "The concept of Akhand Bharat envisions a unified Indian subcontinent. These decisions pursue territorial and political expansion toward that vision."
 RAJ_expanding_sphere_of_influence:0 "Exija lealdade afegã"
 RAJ_demand_sri_lanka: "Exija Sri Lanka"
 RAJ_demand_myanma: "minar a independência de Mianmar"
 RAJ_burn_down_the_separatist_sentiments: "Queime o sentimento separatista"
 RAJ_land_of_freedom: "\"Terra da Liberdade\""
 RAJ_laotian_resorts: "Viagem aos resorts do Laos"
 RAJ_cambodian_natural_resources: "Recursos Naturais Cambojanos"
 RAJ_change_the_malaysian_constitution: "Alterar o Código Penal da Malásia"
 RAJ_bring_hinduism_back_to_indonesia: "Trazer o Hinduísmo de volta à Indonésia"
 RAJ_land_mines_desc_info: "§YInsurgentes comunistas estão ativos neste território!§!"
 RAJ_brics_alliance_decisions: "BRICS"
 RAJ_brics_alliance_decisions_desc:0 "O §HBRICS§! foi fundado para fazer crescer as economias de nações tantas vezes excluídas da mesa ocidental, construindo prosperidade compartilhada independentemente de credo, ideologia ou lema.\n\nA adesão sobe por três níveis: §Yobservador§!, depois §Yassociado§! e, por fim, §Ymembro pleno§!. Uma nação pode se candidatar por conta própria, ou o líder do BRICS pode convidá-la diretamente e promovê-la na escada. Cada passo exige que a nação tenha boa opinião do líder e esteja sob influência suficiente do BRICS, de modo que aquecer as relações vem primeiro.\n\nPodem aderir desde o início §YBrasil, Rússia, China, África do Sul§!, além de §YEgito, Etiópia, Arábia Saudita, os Emirados Árabes Unidos, Argentina, Indonésia§! e vários Estados da Ásia Central. Alguns (§YVenezuela, Argélia, Cuba, Singapura, Dinamarca, Suécia§!) precisam antes concluir seu próprio foco nacional para poder aderir."
 maoist_decision_category: "Insurgência naxalita-maoísta"
 maoist_decision_category_desc:0 "A insurgência naxalita-maoísta é um conflito em curso na Índia no qual grupos maoístas, inspirados na ideologia de Mao Zedong, estão engajados em rebelião armada contra o governo indiano. O movimento surgiu no fim da década de 1960 e atua principalmente em áreas rurais, em especial nos estados de Chhattisgarh, Jharkhand e Odisha. A insurgência busca tratar de questões como desigualdade fundiária, exploração e injustiça social. É considerada uma das maiores ameaças de segurança interna da Índia e causou violência e perda de vidas significativas. O governo vem implementando diversas estratégias para conter a insurgência e tratar de suas causas subjacentes.\n\n$mao_current_popularity$: [?party_pop_array^19|%1]\n\n§RAviso:§! Se qualquer estado atingir níveis de insurgência §Hgraves§! e o apoio político maoísta ultrapassar §H15%§!, começarão manifestações organizadas e, se nada for feito, seguir-se-á uma rebelião armada."
 suppress_maoist_activities: "Suprimir atividades maoístas"
 indian_event.35.t: "Rebelião do Turquestão Oriental"
 indian_event.35.d: "Recebemos hoje informações urgentes de que as minorias muçulmanas em Xinjiang lançaram um levante armado para se separar da China e declarar um Turquestão Oriental independente. Supostamente, os rebeldes são apoiados pelo governo islâmico da Índia. Deveríamos lançar um intervenção militar em Xinjiang ou deixar as coisas como estão?"
 indian_event.35.a: "Intervene militarily."
 indian_event.35.b: "This is not our concern."
 RAJ_REV_ETK_TT: "§BVamos iniciar uma rebelião em Xinjiang!§!"
 RAJ_copied_american_warfare_tactics_idea: "Táticas de guerra americanas copiadas"
 RAJ_increase_arms_production_idea: "Aumento da produção de armas"
 RAJ_revolutions_help: "§BPodemos ajudar a derrubar um governo hostil a nós na Ásia Central§!"
 is_top_influencer_pak: "§Y[ROOT.GetNameWithFlag]§! tem mais de §G>=35%§! influência em §Y[PAK.GetNameWithFlag]§!"
 indian_event.36.t: "A questão de unir nossos países"
 indian_event.36.d: "Devido ao facto de nos últimos tempos terem surgido muitas semelhanças entre os nossos países, tanto na ideologia como na interacção económica e política, a questão da união dos nossos países surgiu entre o nosso governo e o governo da Índia. Devemos nos unir ao nosso vizinho ou escolheremos um caminho \"diferente\"?"
 indian_event.36.a: "Sim, construiremos juntos uma revolução islâmica mundial."
 indian_event.36.b: "Escolheremos um caminho diferente"
 RAJ_declare_holy_jihad: "Declarar a Jihad Sagrada"
 RAJ_declare_holy_jihad_desc: "The Caliphate proclaims its expansionist programme as a religious duty, mobilising the population for war against neighbours deemed apostate or hostile."
 RAJ_reach_out_to_pakistani_Salafists: "Alcançar os salafistas no Paquistão"
 RAJ_reach_out_to_pakistani_Salafists_desc: "Precisamos resolver o problema com os salafistas paquistaneses para que possamos abrir o caminho para o Oriente Médio."
 RAJ_funding_central_asian_islamists: "Financiando Islamistas da Ásia Central"
 RAJ_funding_central_asian_islamists_desc: "A Ásia Central é um trampolim ideal para a propagação da revolução islâmica."
 RAJ_islamic_central_asian_revolutions: "Revolução do Turquestão"
 RAJ_islamic_central_asian_revolutions_desc: "Ao nos unirmos aos ideólogos do Islamismo na Ásia Central, podemos aumentar enormemente a nossa esfera de influência."
 RAJ_true_indian_territories_in_cenasia: "Estabelecer regimes leais"
 RAJ_true_indian_territories_in_cenasia_desc: "Finalmente podemos unir irmãos na religião na Ásia Central"
 RAJ_turkmen_treaty: "Tratado com o Turcomenistão"
 RAJ_turkmen_treaty_desc: "O Turquemenistão é de interesse estratégico para nós, por isso podemos obter o seu apoio."
 RAJ_ally_taliban: "Nossos irmãos afegãos"
 RAJ_ally_taliban_desc:0 "Precisamos nos unir aos nossos irmãos no Afeganistão, pois somente juntos poderemos derrotar o mundo secular."
 RAJ_first_partition_of_afghanistan: "Primeira Partição do Afeganistão"
 RAJ_first_partition_of_afghanistan_desc:0 "O Afeganistão é o território que apresenta uma vantagem ideal na questão da difusão da revolução islâmica."
 RAJ_bye_bye_turkmenistan: "Derrubar o esquizofrênico"
 RAJ_bye_bye_turkmenistan_desc: "Eles realmente achavam que seríamos amigos deles?"
 RAJ_peaceful_reunification: "Reunificação Pacífica"
 RAJ_peaceful_reunification_desc: "Devido à nossa ligação religiosa especial com os salafistas paquistaneses, bem como à nossa ligação económica especial, decidimos reunir-nos pacificamente com o Paquistão. InShaAllah!"
 RAJ_bring_back_kashmir: "Esmague os Hereges"
 RAJ_bring_back_kashmir_desc:0 "Não perdoaremos o Paquistão pelo fato de ainda estar cortando nosso acesso à nossa população na Caxemira. O Paquistão será destruído!"
 RAJ_nepal_fell_after_all: "Nepal"
 RAJ_nepal_fell_after_all_desc: "Precisamos recuperar o controle do Nepal para aumentar nossa influência na região."
 RAJ_myanmar_what: "Bono não luta pela liberdade da Birmânia"
 RAJ_myanmar_what_desc: "É claro que ele tem 'livre' escolha."
 RAJ_bangladesh_independence: "Questione a independência de Bangladesh"
 RAJ_bangladesh_independence_desc: "Bangladesh é uma pedra no nosso caminho, pois se tropas estrangeiras entrarem no seu território, o nosso corredor oriental ficará em perigo."
 RAJ_support_xinjian_islamists:0 "Libertar o Turquestão Oriental"
 RAJ_support_xinjian_islamists_desc: "A China oprimiu a população islâmica de Xinjiang por muito tempo. Devemos ajudá-los a conquistar a independência e a viver a vida que desejam."
 RAJ_troubleshoot_the_map: "Corrigindo o erro de mapeamento"
 RAJ_troubleshoot_the_map_desc: "Israel é a maior ameaça e erro do mundo. Devemos corrigir a imprecisão que foi desenhada no mapa."
 RAJ_to_avenge_the_oppression_of_the_uighurs: "Vingar a opressão uigure"
 RAJ_to_avenge_the_oppression_of_the_uighurs_desc: "Era hora de resolver a questão final sobre a tigela de arroz."
 RAJ_main_enemy_of_chaliphate: "Decapite o Shaytan"
 RAJ_main_enemy_of_chaliphate_desc: "É hora de pagar a dívida nacional."
 RAJ_get_weapons_on_the_black_market: "Empreendimentos no Mercado Negro"
 RAJ_get_weapons_on_the_black_market_desc: "Ficamos muito isolados, sendo necessário adquirir armas por meio de métodos indiretos."
 RAJ_training_our_soldiers_in_mountains: "Treinamento Especial de Montanha"
 RAJ_training_our_soldiers_in_mountains_desc: "Ao preparar nossos soldados para as condições mais extremas, seremos capazes de espalhar nossa revolução em qualquer lugar do mundo sem obstáculos."
 RAJ_american_tactic: "Táticas Americanas"
 RAJ_american_tactic_desc: "As táticas americanas provaram ser eficazes em muitas guerras. Deveríamos dar um exemplo delas para o nosso exército."
 RAJ_increase_arms_production: "Aumentar a produção de armas"
 RAJ_increase_arms_production_desc: "Expanding domestic arms manufacturing capacity is essential to sustaining our military campaigns and reducing reliance on foreign suppliers."
 RAJ_international_jihadis: "Jihadistas do Oriente Médio"
 RAJ_international_jihadis_desc: "As ideias do Islamismo funcionam muito melhor no Médio Oriente, por isso precisamos de promover estas ideias continuamente"
 RAJ_support_islamists: "Apoie os islâmicos na Síria"
 RAJ_support_islamists_desc:0 "Com aliados na Síria, podemos atacar diretamente os países ocidentais."
 RAJ_reconcile_al_qaeda_and_isis: "Unir os Separados"
 RAJ_reconcile_al_qaeda_and_isis_desc: "Ao formar uma aliança unificada com outros aliados ideológicos, podemos chegar muito mais perto de criar o nosso sonho comum de um califado islâmico."
 RAJ_fight_against_idols: "Combater a Idolatria"
 RAJ_fight_against_idols_desc: "The new regime moves against Hindu, Sikh, and Buddhist religious infrastructure, treating temple complexes and shrines as ideological threats to be dismantled or repurposed."
 RAJ_no_women_in_politics: "Nenhuma mulher na política"
 RAJ_no_women_in_politics_desc: "Nossa religião não presume que as mulheres devam estar envolvidas na política."
 RAJ_islamization_of_India: "Islamização da Índia"
 RAJ_islamization_of_India_desc: "A nationwide programme of forced conversion, displacement, and demographic engineering reshapes Indian society to fit the Caliphate's vision of a unified Sunni state."
 RAJ_redo_social_policies: "Estabelecer leis da Sharia"
 RAJ_redo_social_policies_desc:0 "A lei Sharia é o que o povo da Índia realmente precisa. Se não a introduzirmos, não poderemos nos considerar um verdadeiro califado islâmico."
 RAJ_fatwa_of_factories: "Fatwa Industrial"
 RAJ_fatwa_of_factories_desc: "Uma fatwa pode ser definida como uma fonte legal normativa da lei islâmica, agindo como as opiniões de estudiosos do mundo do Islã com autoridade sobre questões específicas em consideração, iniciada por juízes islâmicos (qadis) ou a pedido do Majlis ."
 RAJ_MAO_rebellion: "Situação de Rebelião"
 RAJ_fatwa_of_factories_idea: "Fatwa das fábricas"
