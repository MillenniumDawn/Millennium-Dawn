 MD_sftc_command_tt_2: "£army_experience Опыт армии: §R-250§!\n£navy_experience Опыт флота: §R-200§!\n£air_experience Опыт авиации: §R-200§!\nДаёт национальный дух §YКомандование специальных операций II§!:\nЗаменяет §YКомандование специальных операций I§! (если установлен).\n £attack_specops_texticon  Атака спецназа: §G+4%§!\n £out_of_supply_texticon  Нехватка снабжения у спецназа: §G-5%§!"
 MD_sftc_command_tt_3: "£army_experience Опыт армии: §R-300§!\n£navy_experience Опыт флота: §R-250§!\n£air_experience Опыт авиации: §R-250§!\nДаёт национальный дух §YКомандование специальных операций III§!:\nЗаменяет §YКомандование специальных операций II§! (если установлен).\n £attack_specops_texticon  Атака спецназа: §G+6%§!\n £out_of_supply_texticon  Нехватка снабжения у спецназа: §G-10%§!"
 MD_sftc_command_tt: "§YПрограмма командования специальных операций§!\n\n[MD_sftc_command_tt_text]"
 MD_sftc_qual_tt: "§YКвалификационный курс спецназа§!\n\n£army_experience Опыт армии: §R-200§!\n£navy_experience Опыт флота: §R-75§!\n£air_experience Опыт авиации: §R-75§!\n£command_power Командный ресурс: §R-75§!\nСлучайный командир сухопутных войск без черты §Y«Коммандос»§!, §Y«Рейнджер»§! или §Y«Интервент»§!:\n Получает одну из этих черт, которой у него ещё нет\nПерезарядка: £clock_texticon §Y180§! дней"
 MD_sftc_jc_tt: "§YСовместный курс специальных операций§!\n\n£army_experience Опыт армии: §R-150§!\n£navy_experience Опыт флота: §R-100§!\n£air_experience Опыт авиации: §R-100§!\n£command_power Командный ресурс: §R-75§!\nКаждый командир сухопутных войск с чертой §Y«Коммандос»§!, §Y«Рейнджер»§!, §Y«Интервент»§! или §Y«Десантник»§!:\n Получает §G250§! опыта\nПерезарядка: £clock_texticon §Y90§! дней"