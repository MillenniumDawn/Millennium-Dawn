 IRQ_they_receive_5_influence_TT: "Otrzymają §H5% wpływu§! na nas"
 IRQ_fedayeen_patrols: "Patrole fedainów"
 IRQ_fedayeen_patrols_desc: "The Fedayeen Saddam must be utilized in order to enforce our nation's laws. They will ensure that the people are following holy norms, and remain righteous."
 IRQ_western_engineers_in_iraq: "Inżynierowie zachodni w Iraku"
 IRQ_western_aid_to_iraq: "Pomoc zachodnia dla Iraku"
 IRQ_assassinate_abdullah_s_jumah: "Zabij Abdullaha S. Jum'aha"
 IRQ_assassinate_abdullah_s_jumah_desc: "Dyrektor generalny [SAU.GetFlag] Aramco, Abdullah S. Jum'ah, będzie musiał odejść. Wyślemy naszych tajnych agentów, aby się nim zajęli, i mamy nadzieję, że wszystko pójdzie dobrze."
 iraqi_flavor_events.10.t: "Powstanie Szyickie zdobywa południowy Irak"
 iraqi_flavor_events.10.d: "A large-scale revolt has swept across Saddam Hussein's Ba'athist Iraq, marking the third such uprising in recent years. Shia Muslims have taken up arms against the Ba'athist state following allegations that a well-known cleric was murdered on the streets of Basra. \n\nSpeculation increases over Iranian involvement in the revolt, with rumours indicating Tehran may have been behind the assassination, sparking this latest wave of unrest. Iraqi forces are responding swiftly, deploying overwhelming force to crush the rebellion. The world now watches in anticipation of Iran's response and what it might bring."
 iraqi_flavor_events.10.a: "Koszt Wojny"
 iraqi_flavor_events.11.t: "Czarny Sztandar powiewa nad Irakiem"
 iraqi_flavor_events.11.t1: "Emergence of an Islamic State in Iraq"
 iraqi_flavor_events.11.d: "[ISI.GetLeader] today declared the formation of Al-Qaeda's official branch in Iraq, pledging the allegiance of Jama'at al-Tawhid wal-Jihad (Congregation of Monotheism and Jihad) to Osama bin Laden's global terror network of Al-Qaeda. Vowing to wage unyielding jihad against [PER.GetAdjective]-backed groups and Ba'athist Iraq, the organization, composed of foreign fighters and [IRQ.GetAdjective] insurgents, seeks to establish a caliphate, followed by a wave of jihad that would extend to Iraq's secular neighbours, before ending in a clash with Israel. The group has already launched several attacks against the IRGC, Shia militias, and the central Iraqi government. This comes as mass bombings rock the city of Baghdad as well as major cities across Iraq."
 iraqi_flavor_events.11.d1: "[ISI.GetLeader] has declared the establishment of the Islamic State of Iraq. Announcing the unification of various jihadist factions under its banner including Al-Qaeda in Iraq. The organization has vowed to dismantle [IRQ.GetLeader]'s Ba'athist Iraq and wage relentless jihad against [PER.GetAdjective]-backed militias and Iranian IRGC Force. With the ultimate goal of establishing an Islamic caliphate across the middle east. The group has intensified its campaign of bombings, assassinations, and raids across Baghdad and other major Iraqi cities as Iraq plunges into chaos."
 iraqi_flavor_events.11.a: "Irak jest stracony?"
 iraqi_flavor_events.12.t: "Irański zamach stanu w Iraku"
 iraqi_flavor_events.12.d: "Just moments ago, a coalition of Shia militia leaders backed by [PER.GetNameWithFlag] launched a coup against the Ba'athist government. Declaring the suspension of the Iraqi constitution and the establishment of Shi'ite rule. [IRQ.GetNameWithFlag]'s new leader, [IRQ.GetLeader], announced that his forces had just stormed the residence of Saddam Hussein and taken hold of his body in a targeted operation. In a fiery declaration, he proclaimed: \"We shall not rest until we root out Ba'athism from this land, which is rightfully for all!\". This comes as chaos erupts from Baghdad as Shi'ite militias have begun high-profile killings of Ba'athist officials. Meanwhile, [PER.GetNameWithFlag]'s Supreme Leader, [PER.GetLeader], has voiced his full support for the new government under [IRQ.GetLeader]"
 iraqi_flavor_events.12.a: "Koniec Tyrani czy znów ta sama historia?"
 iraqi_flavor_events.13.t: "Lojaliści Baa`tha przejmują armię"
 iraqi_flavor_events.13.d: "Resztki lojalistów partii Baas rozpoczęły pełnoskalową rebelię w północno-zachodniej [IRQ.GetNameWithFlag], zdobywając kilka kluczowych miast, próbując przywrócić władzę partii Baas i odrzucić obecny rząd szyicki. [IRQ.GetLeader] zapowiedział stłumienie powstania, ale jego wynik pozostaje niepewny, ponieważ przemoc i zamieszki rozprzestrzeniają się w i tak już niestabilnym rządzie. Tymczasem [IRS.GetLeader] przygotowuje ofensywę mającą na celu odbicie stolicy, Bagdadu."
 iraqi_flavor_events.13.a1: "Koszt Wojny"
 iraqi_flavor_events.13.a2: "Wyeliminuj ich"
 IRQ_leave_socialist_union: "Opuść Socjalistyczny Związek z [PER.GetFlag] Iranem"
 iraq_md.317.t: "Garner zastąpiony przez Bremera"
 iraq_md.317.d: "Under the directive of the U.S. government, Jay Garner has been replaced with Paul Bremer. Allegations arose on what Garner's plans with Iraq were, as it was believed that he was giving too much control to the Iraqis themselves rather than going through the American forces. This move concludes Garner's short venture in Iraq, and the start of a new one."
 iraq_md.317.a: "Dobra"
 iraq_md.318.t: ""
 iraq_md.318.d: ""
 iraq_md.318.a: ""
 iraqi_MNF.2.t: "Wodospady Bagdadzkie"
 iraqi_MNF.2.d: "Czcigodne miasto Bagdad padło ofiarą sił okupacyjnych, a budynki rządowe, pomniki i plakaty są niszczone w tej właśnie chwili. Kilku wysoko postawionych urzędników zostało schwytanych, zabitych lub zaginęło. Nasi najwyżsi generałowie mówią nam, że walka jest daremna i ryzykujemy poświęcenie kolejnych istnień ludzkich, jeśli zdecydujemy się kontynuować naszą zbrojną walkę z wrogami. Ale jaki mamy wybór? Przybyli na naszą ziemię, zaatakowali nasz lud i naruszyli naszą suwerenność."
 iraqi_MNF.2.a: "Nie mamy wyboru"
 iraqi_MNF.2.b: "Poddanie się nie mieści się w naszym słowniku!"
 iraqi_MNF.3.t: "Ameryka rozpoczyna operacje w Iraku"
 iraqi_MNF.3.d: "Stany Zjednoczone wypowiedziały wojnę Irakowi i złożyliśmy Amerykanom obietnicę, że będziemy ich wspierać w walce z każdym wrogiem. Dziś możemy spełnić tę obietnicę, wysyłając wojska do Wielonarodowych Sił w Iraku."
 iraqi_MNF.3.a: "Dalej"
 iraqi_MNF.3.b: "Zmieniliśmy zdanie..."
 iraqi_MNF.4.t: "Rządzący rząd Iraku żąda naszego wycofania"
 iraqi_MNF.4.d: "Władze w Iraku formalnie zażądały wycofania naszych sił z Iraku, w tym ze wszystkich stref okupacyjnych. Choć list wydawał się dość przyjazny w swoim tonie, z pewnością nie był pozbawiony subtelnych gróźb. „Odmowa opuszczenia suwerennych terytoriów Iraku może prowadzić do niezamierzonych konsekwencji” – głosił list podpisany przez [IRQ.GetLeader]."
 iraqi_MNF.4.a: "Wyjdziemy"
 iraqi_MNF.4.b: "Wyjdziemy... pod jednym warunkiem"
 iraqi_MNF.4.c: "W takim razie będziecie musieli nas pochować na tej ziemi!"
 iraqi_MNF.5.t: "[FROM.GetName] Wycofuje bezwarunkowo"
 iraqi_MNF.5.d: "Rząd [FROM.GetAdjective] podjął decyzję o spełnieniu naszej prośby i natychmiastowym opuszczeniu okupowanych terytoriów."
 iraqi_MNF.5.a: "Dobrze"
 iraqi_MNF.6.t: "[FROM.GetName] Wycofuje się z koncesjami naftowymi"
 iraqi_MNF.6.d: "Rząd [FROM.GetAdjective] postanowił spełnić naszą prośbę i natychmiast opuścić okupowane terytoria. Jednak w ramach warunków odejścia domaga się on praw do ropy naftowej."
 iraqi_MNF.6.a: "Ok dobrze"
 iraqi_MNF.7.t: "[FROM.GetName] odmawia opuszczenia"
 iraqi_MNF.7.d: "Those [FROM.GetAdjective] vermin have refused to let go of their occupation zones, and are further entrenching themselves in our territory. If they don't understand the language of diplomacy, then they'll understand the language of our force."
 iraqi_MNF.7.a: "Niefortunne"
 iraqi_MNF.8.t: "Wygasa kontrakt na prawa do ropy w Iraku"
 iraqi_MNF.8.d: "Nasz kontrakt na iracką ropę wygasł dzisiaj, w związku z czym nie mamy już kontroli nad zasobami ropy w regionach, które kiedyś okupowaliśmy."
 iraqi_MNF.8.a: "Jak uzgodniono"
 iraqi_MNF.9.t: "[FROM.GetName] Wygasa kontrakt na ropę"
 iraqi_MNF.9.d: "[FROM.GetName] will no longer control the flow of oil in the regions they once occupied, with exports and oil handling being returned to Iraqi national control once more."
 iraqi_MNF.9.a: "Dobrze"
 iraqi_MNF.10.t: "Saddam Hussein schwytany!"
 iraqi_MNF.10.d: "After weeks of being on the run, Saddam Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.10.a: "Panie i panowie, mamy go!"
 iraqi_MNF.11.t: "Qusay Hussein Captured!"
 iraqi_MNF.11.d: "After weeks of being on the run, Qusay Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.11.a: "Dobrze"
 iraqi_MNF.12.t: "Uday Hussein Captured!"
 iraqi_MNF.12.d: "After weeks of being on the run, Uday Hussein was finally captured by our forces in a discreet hiding location. He has been transferred to Abu Ghraib correctional facility where he is currently being evaluated. His fate will soon be decided by the appropriate Iraqi authorities."
 iraqi_MNF.12.a: "Good. Get that maniac off the streets!"
