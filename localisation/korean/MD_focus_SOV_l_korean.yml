 SOV_western_russia: "옛 방식의 새 물결"
 SOV_western_russia_desc: "집권당이 권력을 되찾았지만 이제는 개혁파가 이끌고 있습니다. 그들의 목표는 체제를 민주적 동반 관계와 서방과의 협력에 부합하도록 개편하는 것입니다."
