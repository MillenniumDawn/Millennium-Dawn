 RULE_OPTION_GREAT_COLLAPSE: "大崩壊"
 RULE_OPTION_GREAT_COLLAPSE_AI_DESC: "1991年のソ連崩壊により、アメリカ合衆国の軍国主義が徐々に納税者の負担となっていった。 1995年から99年にかけての一連の抗議運動は、死傷者を増やし、国民と冷戦に固執する連邦政府の間に憤りをもたらした。2000年問題への懸念に加え、全国的な鉄道ストライキの噂も高まっている。これは経済と連邦の抗議活動対応能力を麻痺させる可能性がある。"
 USB_AI_BEHAVIOR: "@USB アメリカ自由国"
 RULE_OPTION_REVANCHIST_PATH: "運命の取り戻し"
 RULE_OPTION_REVANCHIST_PATH_AI_DESC: "連邦の影響力が自由国を大陸48州の復讐主義に向けた外交政策に導く。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_ISOLATION_PATH: "グレートシャットダウン"
 RULE_OPTION_ISOLATION_PATH_AI_DESC: "アメリカンドリームは死に、世界は拡大する虚無のように見える。そのため、人々と政治的指導者は世界から離れ、自分たちの小さな場所がもたらしてくれる甘い平和と静寂を享受することが最善だと決定する。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_ARCADIA_PATH: "東部のアイデンティティ"
 RULE_OPTION_ARCADIA_PATH_AI_DESC: "アメリカンドリームが悪夢に変わり、連邦の影響力は衰えた。そのため人々は新しい道が正しいと決め、アルカディア計画を通して新しい「東部のアイデンティティ」を作ろうとする。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 CSA_AI_BEHAVIOR: "@CSA 南部アメリカ共和国"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH: "南部アメリカ"
 RULE_OPTION_A_SOUTHERN_AMERICA_PATH_AI_DESC: "アメリカンドリームがまだ南部の人々の心に燃え続ける中、多くの人々が政府に働きかけ、古き栄光を改革し、新しいアメリカ、南部アメリカを作るよう動かす。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_GOLDEN_CIRCLE_PATH: "ゴールデンサークル"
 RULE_OPTION_GOLDEN_CIRCLE_PATH_AI_DESC: "多くの南部人は、彼らが南部の性質に独自の運命を築くべきだと信じている。そのため、多くの権力を持つ人々は、この新時代の自由を固めるために南部連合から古い考えを再検討しようとしている。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH: "東部のアイデンティティ"
 RULE_OPTION_SOUTHERN_ARCADIA_PATH_AI_DESC: "アメリカンドリームは燃え尽き、「南部連合の汚名」を嫌う人も少なくない。多くの南部住民はカホンやクレオールのフランスの影響に目を向け、アメリカでも南部連合でもない、新しいアイデンティティを築こうとする。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH: "フロリダ蜂起"
 RULE_OPTION_THE_FLORIDA_UPRISING_PATH_AI_DESC: "若き国家の初期に、社会主義の屑とその同調者が選挙を乗っ取り、政権を掌握した。今こそ真の南部愛国者が、赤い悪魔から我々の残された故郷を守る時だ。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 CAS_AI_BEHAVIOR: "@CAS カスカディア"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH: "ロッキー山脈のレジスタンス"
 RULE_OPTION_ROCKY_MOUNTAIN_RESISTANCE_PATH_AI_DESC: "オリンピア政府はアイダホ州のロッキー山脈で高まる不安に対処するため、地元の法執行機関に許可を与える。法執行機関は増大するレジスタンス運動の対処に失敗し、カスカディア国家に対する独立蜂起をもたらす。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH: "我々の時代の平和"
 RULE_OPTION_PEACE_IN_OUR_TIME_PATH_AI_DESC: "オリンピア政府は特別調査部隊を派遣して、対レジスタンス運動を支援し指導する。時間とともに彼らの援助は法と秩序を回復し、RMRのリーダーに集団を解散させ、より平和で団結した国家をもたらす。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 LKT_AI_BEHAVIOR: "@LKT ラコタ共和国"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH: "開拓戦線の戦争"
 RULE_OPTION_RECLAMATION_FRONT_WAR_PATH_AI_DESC: "北部政府は開拓戦線（RF）の下、無作為に流入してきた原住民を切り捨て、格を下げる。そのため、ラコタ政府から派遣された熱心すぎる監査官が独自にRF指導者と会談した結果、迅速な亀裂が生じ、最終的にRF制御下のカンザスとラコタ共和国の間での軍事化と戦争につながる。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH: "開拓戦線の平和"
 RULE_OPTION_RECLAMATION_FRONT_PEACE_PATH_AI_DESC: "報告の混乱を理解し、より多くの調査が行われる。これにより開拓戦線に関するいくつかのより攻撃的な主張が迅速に否定される。この新たな団結により、国家を再建し、全体的により良い経済的・社会的連合を形成するための会談が始まる。§Rアメリカのゲームルール「合衆国時代の後に」または「大崩壊」のいずれかが必要§!"
 RUS_AI_BEHAVIOR: "@SOV ロシア連邦"
 RULE_OPTION_PUTIN_AI_DESC: "ロシア連邦は統一ロシアの外交政策を追求し、彼らを強化する。\n"
 RULE_OPTION_PEACEFUL_REFORM_AI_DESC: "ロシアはリベラルな改革を行い、西側との関係強化を目指す。\n"
 RULE_OPTION_THE_RED_MENACE_AI_DESC: "ロシアはマルクス主義政策に傾倒し始め、ソビエト連邦の復活を試みる。\n"
 RULE_OPTION_RISE_OF_RUSSIA_AI_DESC: "ロシアはナショナリズム政策に傾倒し始め、大ロシアの樹立を掲げ、攻撃的な外交政策を追求するだろう。\n"
 RULE_OPTION_NAZBOL_RUSSIA_AI_DESC: "国家ボリシェヴィキは、祖国の発展に向けた新たな道を実現することができる。彼らは、安定と偉大さを取り戻すべく、ロシアに新たな秩序を築き上げるだろう。\n"
 RULE_OPTION_IRON_DIMON_RUSSIA_AI_DESC: "ロシアには、いつでも裏切る者に永遠に譲歩せず交渉しない新しい支配者が必要だ。\n"
 RULE_OPTION_LIBERAL_DIMON_RUSSIA_AI_DESC: "ドミトリー・アナトリエヴィッチは最終的にリベラルな道に進み、ロシアをリベラリズムへと導く。\n"
 RULE_OPTION_OLIGARCHS_RUSSIA_AI_DESC: "ロシア国内ですでに強大な権力を握っているオリガルヒたちは、さらに多くの権力を掌握しようと試みるだろう。\n"
 CZE_AI_BEHAVIOR_MD: "@CZE チェコ共和国"
 GAME_RULE_nato_disabled: "§YNATO§!はゲームルールによって無効化された"
