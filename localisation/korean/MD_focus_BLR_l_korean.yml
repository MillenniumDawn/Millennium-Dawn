 blr_union_with_russia_info: "[SOV.GetName](이)가 우리를 괴뢰국으로 삼습니다\n플레이어는 [SOV.GetName](으)로 전환됩니다"
 BLR_belarus_nati_modifier: "벨라루스의 국가 정책"
 BLR_belarus_nati_modifier_desc: "벨라루스에서 민족주의 세력이 집권하면서 국내외 정책에 큰 영향을 미쳤습니다. 우선순위는 국가의 권력과 힘, 위대했던 과거의 선전, 그리고 잃어버린 벨라루스의 위대함을 되찾으려는 복수주의였습니다."
 BLR_belarus_police_modifier: "벨라루스의 내부 안보"
 BLR_belarus_police_modifier_desc: "벨라루스 정부는 소련의 일부였던 시절부터 반체제 인사와 적의 첩자를 탄압해 온 풍부한 경험을 갖고 있습니다."
 BLR_belarus_kommi_modifier: "공산주의 벨라루스의 정치"
 BLR_belarus_kommi_modifier_desc: "벨라루스의 공산주의 정부는 소련 시절에 있었던 모든 좋은 것을 선전과 행동 양면에서 적극적으로 되살리려 하고 있습니다."
 BLR_Polonez: "폴로네즈"
 BLR_btr60: "BTR-60"
 BLR_btr70: "BTR-70"
 belorussia_focus: "벨라루스 국가 중점 트리"
 BLR_State_Run_Capitalism: "국가 주도 자본주의"
 BLR_State_Run_Capitalism_desc: "국가가 나라의 경제 정책을 완전히 통제해야 합니다."
 BLR_peleng_contract_desc: "[BLR.GetFlag]군사 및 민간 용도의 광전자 제품을 개발·생산하는 벨라루스 기업으로, 벨라루스 공화국 내 해당 분야의 선도 기업입니다."
 BLR_peleng_union_state: "[BLR.GetFlag]펠렝 JSC"
 BLR_peleng_union_state_desc: "[SOV.GetFlag]군사 및 민간 용도의 광전자 제품을 개발·생산하는 연방 국가 기업으로, 연방 국가 내 해당 분야의 선도 기업입니다."
 BLR_peacerota_idea: "평화유지 파견대"
 BLR_Foreign_legion_idea: "외인 부대"
 BLR_sso_idea: "특수작전군"
 BLR_ter_orobona_idea: "영토 방위군"
 BLR_mzkt_contract_desc: "민스크 바퀴식 트랙터 공장(MZKT)은 건설, 석유 및 가스, 기계 제작 산업을 위한 도로용 및 비포장용 중형 차량, 피견인 차량, 특수 바퀴식 차체의 생산을 전문으로 하는 기업입니다. 벨라루스 공화국 국가군수산업위원회 관할의 국영 기업입니다."
 BLR_mzkt_another_desc: "민스크 바퀴식 트랙터 공장(MZKT)은 건설, 석유 및 가스, 기계 제작 산업을 위한 도로용 및 비포장용 중형 차량, 피견인 차량, 특수 바퀴식 차체의 생산을 전문으로 하는 기업입니다. 벨라루스 공화국 국가군수산업위원회 관할의 국영 기업입니다."
 BLR_mzkt_contract_blr_desc: "민스크 바퀴식 트랙터 공장(MZKT)은 건설, 석유 및 가스, 기계 제작 산업을 위한 도로용 및 비포장용 중형 차량, 피견인 차량, 특수 바퀴식 차체의 생산을 전문으로 하는 기업입니다. 벨라루스 공화국 국가군수산업위원회 관할의 국영 기업입니다."
 BLR_mzkt_union_state: "[BLR.GetFlag]민스크 바퀴식 트랙터 공장"
 BLR_mzkt_union_state_desc: "민스크 바퀴식 트랙터 공장(MZKT)은 건설, 석유 및 가스, 기계 제작 산업을 위한 도로용 및 비포장용 중형 차량, 피견인 차량, 특수 바퀴식 차체의 생산을 전문으로 하는 기업입니다. 현재 연방 국가의 관할 아래 있습니다."
 BLR_140_zavod_union_state: "[BLR.GetFlag]제140 수리 공장"
 BLR_140_zavod_union_state_desc: "제140 수리 공장은 [SOV.GetFlag]연방 국가 군수 산업 복합체의 국영 기업으로, 장갑차량과 그 엔진의 수리 및 현대화를 전문으로 합니다."
 BLR_end_reform: "군 개혁 완료"
 BLR_end_reform_desc: "군 개혁을 완료할 것이며, 이제 우리 군은 현대적 기준을 충족하게 될 것입니다."
 BLR_MZKT_desc: "민스크 바퀴식 트랙터 공장은 건설, 석유 및 가스, 기계 제작 산업을 위한 도로용 및 비포장용 중형 차량, 피견인 차량, 특수 바퀴식 차체의 생산을 전문으로 하는 기업입니다. 벨라루스 공화국 국가군수산업위원회 관할의 국영 기업입니다."
 BLR_minoitor_desc: "미노토르 서비스는 민스크에 위치한 벨라루스 기업으로, 전투용 궤도 차량의 개발, 생산, 현대화, 수리, 정비와 예비 부품 공급을 담당합니다. 국가 군수 산업 복합체의 선도 기업 중 하나입니다."
 BLR_belspecveshtech_desc: "벨스페츠베시테흐니카(BSVT)는 1995년에 설립된 벨라루스 국영 대외 무역 단일 기업입니다. 무기 및 이중 용도 제품의 무역과 생산을 전문으로 합니다. 국가군수산업위원회 소속이며 무기 수출 분야에서 국가의 선도 기업으로 평가받습니다."
 BLR_140_zavod_desc: "제140 수리 공장은 벨라루스 군수 산업 복합체의 국영 기업으로, 장갑차량과 그 엔진의 수리 및 현대화를 전문으로 합니다."
 BLR_fight_the_oligarchs_desc: "올리가르히가 우리나라에서 권력을 쥐도록 허용할 수 없으며, 그렇지 않으면 경제 성장은 분명 기대할 수 없습니다."
 BLR_russian_fsb_desc: "FSB가 우리 정보기관과 협력하여 더 큰 정치적 안정을 제공할 것입니다."
 BLR_science_boost: "과학 투자"
 BLR_science_boost_desc: "과학은 국가 예산에서 최대한 후하게 자금을 지원받아야 합니다."
 BLR_support_promka: "국내 산업 지원"
 BLR_support_promka_desc: "국내 산업을 지원할 것입니다."
 BLR_boost_economic: "경제 성장 가속화"
 BLR_boost_economic_desc: "우리의 개혁이 효과를 나타내고 있으며 경제가 성장하기 시작했습니다."
 BLR_anti_gibdd: "반 성소수자 정책"
 BLR_anti_gibdd_desc: "우리나라에서 성소수자 선전을 거부하며 이에 맞서 싸울 것입니다."
 BLR_union_state_course: "연방 국가를 향한 노선"
 BLR_union_state_course_desc: "우리의 목표는 연방 국가이며, 이를 위해 노력할 것입니다."
 BLR_support_army: "군대 지원"
 BLR_support_army_desc: "우리나라의 군대를 지원할 것입니다. 우리나라가 독립을 유지하는 것은 그들 덕분이기 때문입니다."
 BLR_russian_tver_desc: "철도용으로 러시아에서 다수의 화차를 구매할 것입니다."
 BLR_russian_teplovzor_desc: "열화상 장비의 생산을 시작할 것이며, 이를 러시아에 판매하여 그들의 군대에서 사용하게 할 수도 있을 것입니다."
 BLR_dai_denyag: "러시아에 대출 요청"
 BLR_dai_denyag_desc: "러시아 정부에 대출을 제공해 달라고 요청할 것입니다."
 BLR_kgb: "KGB"
 BLR_Kal: "공동 칼륨 무역사"
 BLR_Kal_desc: "러시아에 우리 공동의 칼륨 무역사가 될 합작 주식회사를 설립하자고 제안할 것입니다."
 BLR_Kal2: "공동 칼륨 무역사 해체"
 BLR_Kal2_desc: "러시아 기업 우랄칼리 직원들에 대해 우리가 시작한 최근의 형사 사건과 그들의 권한 남용으로 인해 우리는 공동 무역사를 해체하고 자체 무역사를 설립할 수밖에 없게 되었습니다."
 BLR_New_concept_security_desc: "우리의 방어 개념을 갱신해야 하며, 필요한 변경 사항을 법에 반영할 것입니다."
 BLR_anti_lgbtqa_stance: "반 성소수자 정책"
 BLR_revansh_return: "프라비 레반시 부활"
 BLR_revansh_return_desc: "프라비 레반시는 1990년대의 민족주의 단체로, 반폴란드 및 반러시아 수사를 내세웠으며 우크라이나 조직을 본뜬 준군사 조직의 창설을 주장했습니다."
 BLR_blackcat: "검은 고양이 부활"
 BLR_blackcat_desc: "검은 고양이는 40년 동안 벨라루스 영토에서 활동하며 소련 정부에 맞서 독립을 위해 싸운 대규모 빨치산 조직이었습니다. 이들의 방식은 적의 침공에 맞서 방어하는 데 큰 도움이 될 것입니다."
 BLR_create_nationalsecurity: "신규 부서 창설"
 BLR_create_nationalsecurity_desc: "소련의 유산인 KGB 대신, 국가안보국과 국가정보국이라는 두 개의 새로운 기구를 창설할 것입니다."
 BLR_zmagar_army: "군 개혁"
 BLR_zmagar_army_desc: "우리 군에는 시급한 개혁이 필요합니다. 우리가 나라의 사회정치적 변혁에 매달려 있는 동안 군대는 심각하게 약화되었습니다."
 BLR_Belshina: "벨시나 JSC"
 BLR_Belshina_desc: "벨시나 JSC는 자동차 타이어 제조업체입니다. 승용차, 트럭, 대형 차량, 도로 건설 및 인양 차량, 전기 차량, 버스, 트랙터, 농기계용 타이어를 생산합니다."
 BLR_whitelegion_battalion_category: "백색 군단"
 BLR_whitelegion_battalion_category_desc: "백색 군단은 군사 조직으로 전환된 벨라루스의 체육 및 애국 단체입니다. 백색 군단은 1990년대 초에 나타나 야당의 회합과 집회에서 질서를 유지했습니다. 대원들은 특수부대로 훈련받았으며, 진홍색 베레모에 상응하는 강철색 베레모를 받았습니다. 이들에게는 벨라루스 역사에 대한 깊이 있는 지식이 주어졌습니다."
 BLR_white_legion_battalion_create: "백색 군단 대대 창설"
 BLR_white_legion_recruit_youngfront: "청년 전선 졸업생 모집"
 BLR_white_legion_recruit_people: "충성스러운 시민 모집"
 BLR_white_legion_recruit_revansh: "\\"프라비 레반시\\" 조직 구성원 모집"
 BLR_white_legions_TT: "모집병 수가 §Y[?modify_white_legion]§!만큼 변합니다\n"
 BLR_whitelegion_recruit_2000: "가용 모집병 수는 2000명입니다"
 BLR_union_programm_desc: "양국의 통합을 강화할 필요가 있습니다. 러시아와의 통합을 위한 여러 로드맵에 합의할 것입니다."
 BLR_soviet_system: "국가 볼셰비즘 벨라루스"
 BLR_soviet_system_desc: "이전 통치자의 실패한 실정을 고려해 소련식 경제 체제로의 회귀를 포함한 첫 경제 개혁을 단행할 준비를 마친, 국가 권력을 장악한 민족볼셰비키입니다."
 BLR_free_weapon: "무기 자유 소지"
 BLR_free_weapon_desc: "국민이 국내에서 무기를 자유롭게 소지하도록 허용할 것입니다. 국민에게는 자기방어의 권리가 있습니다!"
 BLR_new_church: "새로운 종교"
 BLR_new_church_desc: "우리 국가의 이익에 봉사하는 새로운 종교를 만들 때가 되었습니다!"
 BLR_reform_education: "교육 개혁"
 BLR_reform_education_desc: "교육 시스템은 끔찍한 상태입니다. 우리는 그것을 고치고 이 시스템에 중대한 변화를 도입할 것입니다. 혁신 중 하나는 학생과 학생들의 학습 시간을 줄여 그들이 완전한 시민이 되도록 더 빨리 준비시키는 것입니다."
 BLR_ruralisation: "농촌화"
 BLR_ruralisation_desc: "21세기의 추세는 농촌에 사는 사람들을 도시로 이주시키는 것입니다. 우리는 이를 바꾸어 가난하거나 집 없는 사람들에게 농촌으로 가도록 하고, 그 대가로 새로운 거주지에서 그들의 활동을 자극할 것입니다."
 BLR_revoult_army: "혁명군"
 BLR_revoult_army_desc: "우리 군은 그리 훌륭한 모습을 보이지 못했습니다. 조국을 위해 적의 기관총에 몸을 던질 각오가 된, 혁명의 열정으로 불타오르는 사람들이 필요합니다."
 BLR_revoult_army_zeks: "수감자의 군 입대 허용"
 BLR_revoult_army_zeks_desc: "수감자들을 별도의 대대에 배치하여 군에 징집하기 시작할 것입니다. 수감자들에게 먹이를 주는 일을 중단하십시오. 그들은 혁명의 불꽃을 먹여 살려야 합니다!"
 BLR_revoult_rne: "러시아 민족 통일당 초청"
 BLR_revoult_rne_desc: "이 민족주의 단체의 대표자들을 공식적으로 정부 조직에 들여올 것입니다."
 BLR_revoult_sobor: "벨라야 루시 슬라브 대성당 초청"
 BLR_revoult_sobor_desc: "이 민족주의 단체의 대표자들을 공식적으로 정부 조직에 들여올 것입니다."
 BLR_revoult_army_volunteer: "혁명 정신"
 BLR_revoult_army_volunteer_desc: "일부 병사들은 전투를 너무나 열망하여 다른 나라로라도 가려 합니다. 어쩌면 그들의 열정을 억누르지 말고 국제주의적 의무를 이행하도록 파견해야 할지도 모릅니다."
 BLR_revoult_army_gco: "정교 공산주의 수호대"
 BLR_revoult_army_gco_desc: "이란 IRGC를 본떠 우리만의 독자적인 군대를 창설할 것입니다. 그들의 경험은 우리에게 깊은 인상을 남겼습니다. 이 군대는 정교 공산주의 수호대라고 불릴 것입니다."
 BLR_work_army: "노동자 군대"
 BLR_work_army_desc: "모든 실업자를 생산 현장에 보내, 무엇보다도 국가에 필요한 물자를 생산하는 체계를 구축할 것입니다."
 BLR_revoult_army_gco_ground_force: "지상군"
 BLR_revoult_army_gco_ground_force_desc: "정교 공산주의 수호대(GCO)를 구성하는 주력이자 가장 방대한 병종입니다. 평시에는 경무장을 갖춥니다. 주된 임무는 내부 안보이며, 부차적으로 벨라루스 정규군과 협력하여 외부 방어를 맡습니다."
 BLR_revoult_debur: "탈관료화"
 BLR_revoult_debur_desc: "관료에 대한 지출을 줄이고 그 수를 감축할 것이며, 확보된 자금은 국민의 이익을 위해 쓰일 것입니다."
 BLR_revoult_army_gco_anti_corrupt: "반부패 혁명위원회"
 BLR_revoult_army_gco_anti_corrupt_desc: "우리나라의 부패와 싸울 특별 부대를 창설할 것입니다. 그 누구도 정의의 손길에서 숨지 못할 것입니다."
 BLR_revoult_dsocial: "사회적 지원"
 BLR_revoult_dsocial_desc: "국민에 대한 사회적 지원을 강화할 것입니다! 아무도 도움 없이 방치되지 않을 것입니다."
 BLR_revoult_army_agro_invest: "농공업 발전"
 BLR_revoult_army_agro_invest_desc: "농공업 발전에 최대한 투자해야 합니다!"
 BLR_revoult_army_gco_air: "공군"
 BLR_revoult_army_gco_air_desc: "항공 부대를 창설하여 수호대가 목표 달성을 위해 항공기를 사용할 수 있도록 할 것입니다."
 BLR_revoult_army_gco_drone: "드론 부대"
 BLR_revoult_army_anti_west: "반서방 교리"
 BLR_revoult_army_anti_west_desc: "서방 문명은 언제나 우리의 적이었고 앞으로도 그러할 것이며, 영원히 우리의 파멸을 추구합니다."
 BLR_revoult_army_interbrigade: "국제여단"
 BLR_revoult_army_interbrigade_desc: "우리는 국제여단 부대를 편성하여 우리의 이익을 보호하기 위해 해외로 파견할 계획입니다."
 BLR_kgb_expanded: "KGB 확대"
 BLR_kgb_expanded_desc: "KGB의 영향력을 강화할 것입니다. 이토록 효과적인 국가 안보 도구를 해체할 생각이 없기 때문입니다."
 BLR_army_stabilize: "군 안정화"
 BLR_army_stabilize_desc: "앞으로의 목적을 위해 군의 전투 능력을 회복해야 합니다."
 BLR_prepare_attacks: "개입 준비"
 BLR_prepare_attacks_desc: "우리 군은 준비되었습니다. 인상적인 전력을 모았으며, 구소련 영토 전역으로 우리나라의 영향력을 확대할 준비가 되었습니다."
 BLR_baltic_campaign: "발트 전역"
 BLR_baltic_campaign_desc: "발트 국가들에 대한 군사 작전 준비를 시작할 것입니다. 이 나라들에는 독립할 권리도, 존재할 권리도 없습니다!"
 BLR_baltic_war: "발트 진군 개시"
 BLR_baltic_war_desc: "우리 군은 진지를 점령했으며 발트 국가들을 향한 진군을 시작할 준비가 되었습니다."
 BLR_ukraine_campaign: "우크라이나 전역"
 BLR_ukraine_campaign_desc: "남쪽 이웃 나라가 우리에게 적대적인 군사 정치 블록에 가입할 조짐을 보이고 있으며, 이어서 우리를 공격할 수도 있습니다. 우리가 먼저 타격해야 합니다!"
 BLR_ukraine_campaign_border_prepare: "우크라이나 국경 강화"
 BLR_ukraine_campaign_border_prepare_desc: "우리가 공격하는 입장이라 하더라도, 가능한 반격에 대비하고 국경에 방어 시설을 구축해야 합니다."
 BLR_poland_campaign_border_prepare: "폴란드 국경 강화"
 BLR_poland_campaign_border_prepare_desc: "우리가 공격하는 입장이라 하더라도, 가능한 반격에 대비하고 국경에 방어 시설을 구축해야 합니다."
 BLR_poland_campaign_war: "폴란드 전역 개시"
 BLR_poland_campaign_war_desc: "우리 군은 준비되었습니다! 바르샤바를 향해 전진!"
 BLR_ukraine_campaign_war: "우크라이나 전역 개시"
 BLR_ukraine_campaign_war_desc: "우리 군은 준비되었습니다! 키이우를 향해 전진!"
 BLR_military_nazbol: "군수 산업 투자"
 BLR_military_nazbol_desc: "우리의 군수 산업은 아직도 소련 시절의 수준을 회복하지 못했습니다. 이를 바로잡아야 합니다."
 BLR_nazbol_soviet_system_idea: "국가 볼셰비즘 경제 시스템"
 BLR_revoult_army_idea: "혁명군"
 BLR_anti_baltic_idea: "반발트 교리"
 BLR_anti_ukraine_idea: "반우크라이나 교리"
 BLR_anti_west_idea: "반서방 교리"
 GCO_anti_corruption_idea: "반부패 혁명위원회"
 GCO_idea: "정교 공산주의 수호대"
 BLR_sobor: "벨라야 루시 슬라브 대성당"
 BLR_rne: "러시아 민족 통일당"
 BLR_increased_social_spending_idea: "사회적 지원 확대"
 BLR_interbrigade_idea: "국제여단"
 BLR_free_weapon_idea: "무기 자유 소지"
 BLR_ruralisation_idea: "농촌화"
 BLR_revoult_spirits_idea: "혁명 정신"
 BLR_kal_with: "CJSC \\"벨라루스 칼륨 회사\\""
 BLR_kal_without: "JSC \\"벨라루스 칼륨 회사\\""
 BLR_National_Intelligence_Service: "국가 정보국"
 BLR_blackkcat: "검은 고양이"
 BLR_revanshh: "프라비 레반시"
 BLR_MVD_desc: "내무 기관 체계와 내무부 산하 내무군을 총괄하는 벨라루스 국가 행정 기관으로, 자기 권한 범위 안에서 범죄 대응, 공공질서 보호, 공공 안전 확보 분야의 규제와 관리를 수행하고 이 분야에서 다른 공화국 국가 행정 기관들의 활동을 조율합니다."
 BLR_Countering_Cybercrime_desc: "사이버 범죄 역시 우리의 감독 아래 두어야 합니다."
 BLR_with_tt: "추가 수입: $$§G0.150§!, [BLR.GetFlag]벨라루스-[SOV.GetFlag]러시아 공동 §Y칼륨 무역§!에서 발생\n"
 BLR_without_tt: "추가 수입: $$§G0.210§!, [BLR.GetFlag]벨라루스-[SOV.GetFlag]러시아 공동 §Y칼륨 무역§!에서 발생\n"
 BLR_rus_oil_tt: "§Y[SOV.GetFlag]러시아§! 에너지 자원에 대해 주당 $§R0.044§! 지출\n"
 BLR_rus_oil_positive_tt: "§Y[SOV.GetFlag]러시아§! 에너지 자원에 대해 주당 $§R0.066§! 지출\n"
 BLR_sov_oil_tt: "추가 수입: §Y[BLR.GetFlag]벨라루스§!와의 에너지 계약으로 $$§G0.44§!\n"
 BLR_sov_oil_positive_tt: "추가 수입: §Y[BLR.GetFlag]벨라루스§!와의 에너지 계약으로 $$§G0.66§!\n"
 belarus_another.52.b: "협상을 시도한다"
 belarus_another.55.t: "청바지 혁명"
 belarus_another.55.d: "벨라루스에서 시위가 힘을 얻고 있으며 벨라루스 정부는 이를 진압할 수 없습니다. 어쩌면 우리가 개입하여 그들의 정부를 구해야 할지도 모릅니다."
 belarus_another.55.a: "우리 전문가를 파견한다"
 belarus_another.55.b: "개입하지 말자"
 belarus_another.56.t: "청바지 혁명"
 belarus_another.56.d: "러시아가 우리에게 전문가들을 보내 주었고, 우리는 함께 시위를 진압할 수 있었습니다!"
 belarus_another.56.a: "감사합니다, 러시아"
 belarus_another.57.t: "청바지 혁명"
 belarus_another.57.d: "우리는 러시아 정부에 은밀히 도움을 요청했으나 그들은 거절했고, 이로써 우리는 혁명 운동 앞에 홀로 남겨졌습니다."
 belarus_another.57.a: "신이여, 우리를 도우소서"
 belarus_another.58.t: "청바지 혁명"
 belarus_another.58.d: "시위가 힘을 얻고 있습니다. 일부 행정 건물이 이미 점거되었고, 다른 도시에서도 소요가 일어나고 있으며, 일부 장군들은 반군 편으로 넘어갔습니다. 어떻게 해야 할까요?"
 belarus_another.58.a: "끝까지 싸우겠다!"
 belarus_another.58.b: "평화롭게 권력을 넘겨주겠다"
 belarus_another.59.t: "벨라루스의 대출 요청"
 belarus_another.59.d: "벨라루스 정부가 우리에게 대출을 제공해 달라고 요청하고 있습니다. 그들의 상환 능력을 확신할 수는 없지만, 이를 통해 얻게 될 영향력은 분명 그만한 값어치를 할 것입니다."
 belarus_another.59.a: "돈을 빌려주자"
 belarus_another.59.b: "거절하겠다"
 belarus_another.60.t: "러시아의 대출"
 belarus_another.60.d: "러시아 정부가 우리에게 대출을 제공하기로 동의했습니다."
 belarus_another.60.a: "좋아"
 belarus_another.61.t: "러시아의 대출"
 belarus_another.61.d: "러시아 정부가 우리에게 대출 제공을 거절했습니다."
 belarus_another.61.a: "슬프군"
 belarus_another.62.t: "벨라루스의 공동 칼륨 무역 회사 설립 제안"
 belarus_another.62.d: "벨라루스 정부가 우리 두 기업인 우랄칼리와 벨라루스칼리 사이에 공동 칼륨 무역 회사를 설립하자고 제안했습니다. 함께하면 이 자원으로 더 많은 수익을 올릴 수 있을 것입니다."
 belarus_another.62.a: "동의한다"
 belarus_another.62.b: "동의하지 않는다"
 belarus_another.63.t: "공동 칼륨 무역 회사"
 belarus_another.63.d: "러시아 정부가 공동 칼륨 무역 회사 설립에 동의했습니다."
 belarus_another.63.a: "니스"
 belarus_another.64.t: "벨라루스의 공동 칼륨 무역 회사 폐쇄"
 belarus_another.64.d: "우리 두 칼륨 무역 기업 사이의 대립이 한계에 이르렀고, 벨라루스 정부는 결별하여 자체 무역 회사를 설립하기로 결정했습니다."
 belarus_another.64.a: "슬프군"
 belarus_another.65.t: "연합 지지 쿠데타"
 belarus_another.65.d: "우리는 모든 행정 및 법 집행 자원과 인맥을 동원하여 벨라루스에서 쿠데타를 시도했습니다."
 belarus_another.65.a: "결과를 지켜보자"
 BLR_oil_sov: "벨라루스와의 에너지 계약"
 BLR_constitution_BSSR: "벨라루스 소비에트 사회주의 공화국 헌법"
 BLR_constitution_BSSR_desc: "우선 벨라루스 소비에트 사회주의 공화국 헌법을 복원해야 합니다."
 BLR_Excursion_Vilnius: "빌뉴스 견학"
 BLR_Excursion_Vilnius_desc: "바그너 대원들이 빌뉴스로 \\"견학\\"을 가고 싶다는 뜻을 적극적으로 선동하며 표명하고 있습니다. 우리가 이를 조직하는 것을 도울 수 있습니다. 우리 영토에서 국경을 넘는 것은 이론상 가능하지만, 그 후에 리투아니아가 우리에게 선전포고할까요?"
 BLR_vilnius_return: "빌뉴스 통합"
 BLR_belorusisation_vilnius: "빌뉴스의 벨라루스화"
 BLR_belorusisation_vilnius_desc: "빌뉴스는 우리가 오랫동안 차지하려 했던 분쟁 지역이었으나, 이제 이 지역을 확보했으므로 벨라루스인을 이 지역에 정착시킨다는 구상을 대중에게 알릴 준비가 되었습니다."
 BLR_new_democratic_constitution: "새 민주주의 헌법"
 BLR_new_democratic_constitution_desc: "서구 민주주의에 부합하는 새 헌법을 채택할 때입니다."
 BLR_Great_stone_china: "중국의 그레이트 스톤"
 BLR_national_library: "벨라루스 국립 도서관"
 BLR_Transnistria_enemy: "트란스니스트리아 문제 해결"
 BLR_Transnistria_enemy_desc: "트란스니스트리아는 오랫동안 몰도바의 골칫거리였던 작은 미승인 국가입니다. 우리는 물론 이 땅을 우리가 차지하는 방식으로 이 문제를 해결하는 데 도울 준비가 되어 있습니다."
 BLR_transnistria_claims: "§Y[PMR.GetNameWithFlag]§!에 대한 영유권 주장"
 BLR_batka_krut_TT: "§Y정치 분야§!를 §R정리§!하여 §G우리에게 충성하는 소수의 정당§!만 남기고 §Y루카셴코§!를 위한 §G진정한 애국 정당을 창당§!합니다"
 belarus_politics.1.t: "새로운 정치 현실"
 belarus_politics.1.d: "시위대에 대한 승리는 기념비적이었지만, 우리나라를 파괴할 시간만을 기다리는 야당 조직과 정당의 광범위한 네트워크가 여전히 존재합니다. 이를 막으려면 불필요한 정치인과 조직을 정치판에서 완전히 일소하여 우리에게 충성하는 정당만 남겨야 하며, 정치 분야를 통제하기 위한 우리 자신의 정당도 필요할 수 있습니다. 혹은 모든 것을 그대로 둘 수도 있지만, 그러면 적들은 여전히 국내에서 우리에게 영향을 미칠 수단을 갖게 됩니다."
 belarus_politics.1.a: "뒤흔들어 버려라!"
 belarus_politics.1.b: "더는 사람들의 심기를 건드리지 말자."
 BLR_revoult_army_gco_drone_desc: "군의 효율성을 높이기 위해 드론을 적극 활용할 것입니다."
 BLR_potato_empire_idea: "감자 제국"
 BLR_country_for_life_idea: "삶을 위한 나라"
 BLR_pension_reform_idea: "연금 개혁"
 BLR_country_for_life_idea_desc: "'삶을 위한 나라'는 벨라루스의 블로거이자 활동가인 세르게이 티하놉스키와 관련된 구호이자 운동입니다. 이는 평범한 시민들이 자유롭고 두려움 없이 살 수 있는 벨라루스에 대한 비전을 나타냅니다."
 BLR_pension_reform_idea_desc: "연금 기금은 우리 사회가 기능하는 데 필수적이며, 이를 더 잘 운영하기 위해서는 몇 가지 변화가 필요합니다."
 BLR_assembly_shop_of_europe: "유럽의 조립 공장"
 BLR_assembly_shop_of_europe_desc: "아마도 가장 간과된 경제 중 하나인 벨라루스는 경제적으로 러시아를 앞지를 잠재력이 있습니다. 하지만 이는 우리가 존재하는 근본적인 문제를 해결하는 데 집중할 때에만 가능합니다. 우리는 수년간 가장 기본적인 경제 투자조차 소홀히 해왔기 때문입니다."
 BLR_increase_livestock_imports: "가축 수입 확대"
 BLR_increase_livestock_imports_desc: "§Y'이 우유는 맛이 이상하군'§!\n\n우리 국민에게는 식용뿐만 아니라 물품 생산을 위해서도 가축이 필요합니다. 특히 젖소는 유제품 생산 면에서 가치가 높습니다. 용도가 다양한 유제품은 우리 농업 부문에 상당한 활력을 불어넣을 수 있습니다."
 BLR_proportional_mining: "비례 채굴"
 BLR_proportional_mining_desc: "아무 곳에서나 마음대로 자원을 캘 수는 없으며, 사전에 적절한 인프라가 구축되어야 합니다. 자원이 필요한 지역에만 광산을 세우고, 산업 부문이 있는 지역에만 새 광산을 건설할 것입니다. 물론 대기 질은 나빠지겠지만, 적어도 [BLR.GetLeader]은(는) 멋진 궁전 몇 채를 지을 자금을 댈 수 있을 것입니다."
 BLR_industrial_wide_reform: "산업 전반 개혁"
 BLR_industrial_wide_reform_desc: "벨라루스 산업의 심장은 강하게 뛰고 있지만, 더 강하게 뛸 수 있습니다. 지속 가능한 산업 확장에 대한 지식을 높이기 위한 일련의 개혁을 시작할 것입니다."
 BLR_fostering_automotive_innovation: "자동차 혁신 육성"
 BLR_fostering_automotive_innovation_desc: "벨라루스가 자동차 산업으로 세계적인 명성을 얻은 것은 아니지만, 그렇다고 그 구상이 완전히 불가능한 것은 아닙니다. 적절한 동기 부여와 선전(그리고 어쩌면 약간의 자금)으로 독일에 필적할 만한 자동차 거인을 일으킬 것입니다. 아마도요."
 BLR_the_fate_of_belarusian_steel_works: "벨라루스 제철소의 운명"
 BLR_the_fate_of_belarusian_steel_works_desc: "1984년에 설립된 벨라루스 제철소 OJSC는 지구상 어디에서도 찾아볼 수 없는 세계적 수준의 강철을 벨라루스 산업에 공급해 왔습니다."
 BLR_tractors: "유럽 최강의 트랙터"
 BLR_tractors_desc: "벨라루스 산업이 유명한 것 중 하나는 신뢰할 수 있는 트랙터이며, 벨라루스 농민들은 유럽의 부러움을 사고 있습니다. 트랙터 산업에 자금을 지원하면 최첨단 장비로 농장을 무장할 수 있으므로 경제에 더욱 큰 도움이 될 것입니다."
 BLR_buses: "동방의 버스"
 BLR_buses_desc: "다행히도 여러 기업의 뛰어난 기술자들이 어느 정도 믿을 만한 버스를 만든다는 불가능한 과제를 풀어냈습니다. 그렇다면 우리 버스는 나아질 일만 남았습니다. 약간의 행운과 자금이 있다면 작업에 착수하여 영국 동쪽에서 찾을 수 있는 최고의 버스를 만들 것입니다."
 BLR_trains: "벨라루스카야 치훈카 재활성화"
 BLR_trains_desc: "§R'어떤 고속열차보다 빠르다!'§!\n\n영어권에서 벨라루스 철도로도 알려진 벨라루스카야 치훈카는 국경 안에 사는 많은 시민을 위한 철도 인프라를 구축하는 데 앞장서 왔습니다. 교통부에 직접 보고하는 벨라루스 철도는 소련 시대의 후신 기업 중 하나로, 현재 벨라루스 철도에 대한 독점을 계속 유지할 것으로 예상됩니다. 우리는 벨라루스카야 치훈카를 재활성화하고, 벨라루스 통근자들의 필요에 가장 잘 맞도록 특정 열차 제작사에도 자금을 지원할 수 있습니다."
 BLR_infrastructure_contracts: "인프라 계약 제안"
 BLR_new_paths: "모든 길은 [BLR.capital.GetCapitalVictoryPointName](으)로 통한다"
 BLR_revamp_railroads: "철도 개편"
 BLR_revamp_railroads_desc: "국가 철도망은 낡은 장비와 느린 서비스로 어려움을 겪고 있습니다. 현대적 기준으로 개편하면 이동 시간이 단축되고 유지 보수 문제가 줄어들 것입니다. 더 튼튼한 철도 체계는 민간 수송과 산업 수송을 모두 촉진합니다."
 BLR_belneftekhim: "벨네프테힘 강화"
 BLR_belneftekhim_desc: "벨네프테힘은 벨라루스 석유화학의 중심적 역할을 하지만, 경쟁력을 유지하려면 현대화가 필요합니다. 신기술과 정제 공정에 투자하면 생산 품질이 향상됩니다. 이러한 개선은 세계 시장에서 우리의 입지를 확보하는 데 도움이 됩니다."
 BLR_the_belaruskali_monopoly: "벨라루스칼리 독점 유지"
 BLR_the_belaruskali_monopoly_desc: "벨라루스칼리는 우리의 가장 귀중한 자산 중 하나이며, 독점을 유지하면 예측 가능한 수익이 보장됩니다. 시장 지위를 강화하면 칼륨 비료 산업에서 벨라루스의 영향력을 지킬 수 있습니다. 이 부문의 안정은 더 폭넓은 경제 계획을 뒷받침합니다."
 BLR_uplift_grodno_azot: "그로드노 아조트 육성"
 BLR_uplift_grodno_azot_desc: "그로드노 아조트는 농업과 산업에 필수적인 화학 물질을 생산합니다. 시설을 현대화하면 효율이 높아지고 낭비가 줄어들 것입니다. 이 공장을 지원하면 화학 부문 전체가 강화됩니다."
 BLR_tend_to_oil_shale: "오일 셰일 탐사"
 BLR_tend_to_oil_shale_desc: "벨라루스에는 대부분 탐사되지 않은 잠재 오일 셰일 매장지가 있습니다. 이 유전을 조사하고 개발하면 에너지원을 다양화할 수 있습니다. 작은 발견이라도 해외 수입 의존도를 낮추는 데 도움이 될 것입니다."
 BLR_award_chinese_contractors: "중국 기업에 계약 수주"
 BLR_award_chinese_contractors_desc: "중국 건설사들은 경쟁력 있는 입찰가와 신속한 사업 수행 능력을 제시합니다. 이들에게 주요 계약을 맡기면 우리의 인프라 계획을 가속화할 수 있습니다. 이 조치는 또한 베이징과의 외교적, 경제적 유대를 강화합니다."
 BLR_award_luxembourgian_contractors: "룩셈부르크인 달래기"
 BLR_award_luxembourgian_contractors_desc: "룩셈부르크 기업들은 높은 품질의 작업을 제공하며 우리 시장에 대한 공정한 접근을 기대합니다. 이들에게 핵심 계약을 주면 관계가 개선되고 협력에 대한 우리의 의지를 보여줄 수 있습니다. 이들의 참여는 국내 건설 수준을 높이는 데도 기여할 수 있습니다."
 BLR_potash_safety_and_hazards_regulation: "칼륨 안전 및 위험 규제"
 BLR_potash_safety_and_hazards_regulation_desc: "안전 규정을 무시하면 칼륨 채굴에는 상당한 위험이 따릅니다. 더 강력한 규제를 마련하면 노동자를 보호하고 사고를 예방할 수 있습니다. 더 안전한 산업은 보다 안정적이고 신뢰할 수 있는 생산도 보장합니다."
 BLR_bountiful_fields: "풍요로운 들판 가꾸기"
 BLR_bountiful_fields_desc: "벨라루스는 토양이 비옥하지만 수확량이 일정하지 않습니다. 농민에 대한 지원을 확대하고 더 나은 영농법을 도입하면 우리 들판을 안정적인 수확지로 바꿀 수 있습니다. 이러한 노력은 식량 안보를 개선하고 농촌 공동체를 강화합니다."
 BLR_speed_up_land_reformation: "토지 개혁 가속화"
 BLR_speed_up_land_reformation_desc: "토지 개혁은 전국에서 더디고 고르지 못하게 진행되었습니다. 이 과정을 가속화하면 농민들이 안정을 얻고 투자가 촉진될 것입니다. 소유권 규칙이 더 명확해지면 농업 전반의 생산성이 향상됩니다."
 BLR_reinforce_government_support_for_agriculture: "농업 지원 강화"
 BLR_reinforce_government_support_for_agriculture_desc: "농업은 여전히 벨라루스 사회의 기둥이며 정부의 강력한 뒷받침이 필요합니다. 보조금, 교육, 장비 접근성을 늘리면 수확량이 늘고 소농이 보호될 것입니다. 회복력 있는 농업 부문은 국가의 안정을 뒷받침합니다."
 BLR_achieving_self_sufficiency: "자급자족 추구"
 BLR_achieving_self_sufficiency_desc: "수입 의존도를 줄이면 국가 독립과 경제 안정이 강화됩니다. 국내 산업을 발전시키고 생산성을 높이면 벨라루스는 자국의 수요를 더 많이 충족할 수 있습니다. 이 목표를 달성하려면 시간이 걸리지만 장기적인 회복력을 위해 필수적입니다."
 BLR_streamline_taxation: "세제 간소화"
 BLR_streamline_taxation_desc: "복잡한 세금 체계는 기업 성장을 늦추고 투자자를 좌절시킵니다. 규정을 단순화하면 기업가 정신이 장려되고 관료적 지연이 줄어듭니다. 세금 체계가 명확해지면 납세가 쉬워져 세수를 늘릴 수 있습니다."
 BLR_counterurbanization: "역도시화 정책"
 BLR_counterurbanization_desc: "농촌 지역은 계속해서 도시로 인구를 빼앗겨 불균등한 발전이 나타나고 있습니다. 역도시화 정책은 새로운 투자와 개선된 서비스를 통해 마을을 지원하는 것을 목표로 합니다. 농촌 생활을 강화하면 전국의 성장 균형을 맞추는 데 도움이 됩니다."
 BLR_potash_large_reserves: "막대한 칼륨 매장량"
 BLR_agriculture_reduced: "농업 축소"
 BLR_belneftekhim_idea: "벨네프테힘"
 BLR_streamlined_taxation: "간소화된 세제"
 BLR_safety_protocols_in_place: "안전 수칙 시행"
 BLR_disease_amongst_livestock: "가축 질병"
 BLR_belarusian_trains: "차장의 애마"
 BLR_treading_on_thin_steel: "얇은 강철 위를 걷다"
 BLR_treading_on_thin_steel_desc: "경제 면에서 우리는 얼음이 모두 녹아내린 지금 얇은 강철 위를 걷고 있습니다. 자원 확보든 생산이든, 산업을 더욱 발전시켜 이 강철을 보강해야 할 것입니다."
 BLR_agricultural_shock: "농업 충격"
 BLR_agricultural_shock_desc: "우리는 경제를 산업 중심으로 전환하는 데 지나치게 서둘렀고, 그 결과 농업 부문이 심각한 타격을 입었습니다."
 BLR_automotive_industry: "벨라루스 자동차 산업"
 BLR_automotive_industry_desc: "신뢰할 수 있고 믿음직하며 현대적인 벨라루스산 기계에는 문 4개와 어쩌면 바퀴 1개만 있으면 충분합니다. 자동차 부문으로 확장하면 메르세데스나 BMW에서 일하는 그 무능한 작자들을 확실히 이길 수 있을 것입니다."
 BLR_activates_fermer_mission_TT: "£text_icon_kaldanger 특정 지역에 §H농업 지구§!를 건설하도록 요구하는 §H임무§!가 활성화됩니다\n - 이 요구를 충족하지 못하면 농민의 불만이 생길 수 있습니다\n - 성공하면 국가 경제가 활성화됩니다"
 BLR_livestock_warning_TT: "£text_icon_kaldanger §H유전 공학§! 연구 수준에 따라 질병으로 가축이 §R폐사§!할 위험이 있습니다\n\n우호국으로부터 젖소 §H500§!마리를 수입합니다"
 BLR_steel_warning_TT: "£text_icon_kaldanger §H민간 산업 11개§!를 먼저 갖추지 않은 채 경제를 §H산업 중심§!으로 전환하는 개혁을 시작하면 단기적인 위기를 겪을 수 있습니다"
 BLR_potash_purchase_TT: "노동자를 위한 §H안전 장비§! 구매를 시도하겠지만, 성공을 장담하지는 않습니다"
 BLR_oil_shale_TT: "§H전략 자원 매장량 3§! 이상인 모든 주가 £oil_texticon  §H2§!의 석유를 받습니다"
 BLR_factory_to_steel_TT: "§H민간 산업 1§! 이상인 모든 주에서 §H채굴 작업§!을 시작합니다"
 belarus_md.1.t: "농업 위기의 그림자"
 belarus_md.1.d: "산업 중심 경제로 갑작스럽게 전환한 결과, 의지할 만한 기반시설도 없이 정부 지원이 철회되면서 우리 농업 부문은 갑작스러운 충격을 겪었습니다. 그 결과 농업 부문은 완전히 회복하는 데 1년이 걸릴 만한 타격을 입었습니다."
 belarus_md.1.a: "젠장"
 belarus_md.2.t: "민영화하느냐 마느냐, 그것이 문제로다"
 belarus_md.2.d: "OJSC 벨라루스 제철소는 소련 시절인 1984년에 설립되었습니다. 그 후 많은 것이 변했고, 연방의 붕괴로 우리는 어느 정도 시장을 개방하게 되었습니다. 국내에서는 이 회사를 민영화하여 거기서 나오는 수익을 활용하자는 목소리가 있었지만, 이토록 중요한 기업이 민간의 손에 넘어가는 것을 경고하는 이들도 있습니다."
 belarus_md.2.a: "민영화하지 않겠다!"
 belarus_md.2.b: "민영화만이 유일한 해답이다"
 belarus_md.3.t: "가축 사이에 빠르게 퍼지는 질병"
 belarus_md.3.d: "우호국으로부터 젖소 약 500마리를 수입한 이후, 우리 전문 분석가들은 벨라루스 전역에서 가축 폐사가 급증하고 있음을 알아차리기 시작했습니다. 추가 조사 결과, 수입된 소 한 마리가 '광우병'으로도 알려진 소 해면상 뇌증에 감염되어 있었던 것으로 밝혀졌습니다. 그 결과 일부 시민이 소로부터 이 질병의 변종에 감염되어 이미 병원에 입원했습니다."
 belarus_md.3.a: "일이 제대로만 풀렸더라면"
 BLR_peleng_desc: "펠렝 JSC는 민스크에 본사를 둔 벨라루스 기업으로, 군사 및 민간 용도의 광전자 체계 개발과 생산을 전문으로 합니다. 벨라루스 광전자 산업의 선도 기업입니다."
 BLR_infrastructure_contracts_desc: ""
 BLR_baltic_revolution_category: "발트 공산 혁명"
 BLR_baltic_revolution_category_desc: "리투아니아와 라트비아의 노동자들은 부르주아 지배자들로부터의 해방을 갈망하고 있습니다. 비밀 작전, 정치적 전복 공작, 민중 봉기를 결합하여 발트 국가들에 혁명을 일으키고 새로운 리트벨 국가를 건설할 것입니다."
 BLR_establish_cooperation_lit: "리투아니아 공산주의자들과 협력 구축"
 BLR_establish_cooperation_lit_desc: "리투아니아의 공산주의 세력은 분열되어 있고 권력에서 소외되어 있습니다. 향후 작전의 기반을 닦기 위해 이들과 비밀리에 접촉해야 합니다."
 BLR_finance_protests_lit: "리투아니아 내 공산주의 시위 자금 지원"
 BLR_finance_protests_lit_desc: "조직된 시위에 자금을 지원하면 공산주의의 대의에 대중의 관심이 쏠리고 현 리투아니아 정부가 불안정해질 것입니다."
 BLR_recruit_sympathizers_lit: "리투아니아 동조자 포섭"
 BLR_recruit_sympathizers_lit_desc: "리투아니아 내 벨라루스계 소수 민족은 잠재적 동조자의 인력 풀을 제공합니다. 우리의 영향력을 넓히기 위해 현지 공작원을 포섭할 수 있습니다."
 BLR_spread_propaganda_lit: "리투아니아 내 리트벨 선전 확산"
 BLR_spread_propaganda_lit_desc: "통합된 리투아니아-벨라루스 국가의 강점을 알리는 조직적인 선전 캠페인은 여론을 협력 쪽으로 돌려놓을 것입니다."
 BLR_bribe_military_lit: "리투아니아 군 장교 매수"
 BLR_bribe_military_lit_desc: "리투아니아 군 장교 여럿이 현 정부에 대한 불만을 표명했습니다. 금전적 보상이 그들이 우리의 대의를 지지하도록 설득할 수 있습니다."
 BLR_bribe_politicians_lit: "리투아니아 정치인 매수"
 BLR_bribe_politicians_lit_desc: "충분한 돈이 있다면 리투아니아 의회의 핵심 의원들을 설득하여 공산주의 입법을 추진하고 집권 연립을 약화시킬 수 있습니다."
 BLR_raise_revolt_lit: "리투아니아에서 공산주의 반란 일으키기"
 BLR_raise_revolt_lit_desc: "리투아니아에 대한 충분한 영향력이 있다면 공산주의 봉기를 일으켜 정부를 전복하고 우호적인 정권을 세울 수 있습니다."
 BLR_establish_cooperation_lat: "라트비아 공산주의자들과 협력 구축"
 BLR_establish_cooperation_lat_desc: "라트비아의 공산주의 세력은 분열되어 있고 권력에서 소외되어 있습니다. 향후 작전의 기반을 닦기 위해 이들과 비밀리에 접촉해야 합니다."
