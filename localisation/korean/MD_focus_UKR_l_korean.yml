 UKR_foreign_finances_category: "대외 재정과 영향력"
 UKR_foreign_finances_category_desc: "독립 우크라이나는 파탄 난 경제를 물려받았고, 국가를 굴리는 자금의 상당 부분을 해외에서 들여와야 합니다. 이곳에서 우리는 국유 자산을 매각하거나, 채권자들에게 채무 재조정을 요청하거나, §7서방§!이나 §t동방§!에 대출을 청할 수 있습니다. 또한 국민들 사이에서 [SOV.GetFlag] §Y러시아§!나 [USA.GetFlag] §Y서방§!의 이익을 증진할 수도 있습니다.\n\n조건 없는 대출은 없습니다. 모든 채권자는 우리 정책에 대한 §Y영향력§!을 얻게 되며, 대외 영향력의 균형이 다음 §Y최고라다§! 선거에서 어느 정파가 이길지 결정합니다."
