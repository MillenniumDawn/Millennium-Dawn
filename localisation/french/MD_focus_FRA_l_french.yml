 france_md.555.t: "Guide des voies politiques"
 france_md.555.d: "La plupart des voies de l'arbre politique se débloquent en les faisant gagner l'élection de 2002 ou en les élisant manuellement aux élections suivantes. Certaines voies restent toutefois inaccessibles au départ, pour des raisons de réalisme et de logique. Vous pouvez y accéder en suivant ce guide : \nPour débloquer les voies bonapartiste et royaliste : élisez le Front national/Rassemblement national (populiste national). Achevez la focalisation : « Se concentrer sur l'insécurité » ; un événement se déclenchera dans lequel une faction radicale vous offre son aide. Laissez-les gagner du terrain et les laisser vous chasser du pouvoir par un coup d'État ; vous pourrez alors porter les bonapartistes ou les royalistes au pouvoir. \nPour la Commune de France, le processus est le même : achevez la focalisation « Réformer plutôt que révolutionner » et laissez les extrémistes vous chasser du pouvoir. \nPour la voie de la France insoumise : élisez le Parti socialiste (socialisme occidental). Achevez la focalisation « Couper avec les syndicats ». Cela déclenchera l'effondrement du Parti socialiste et débloquera la voie de la France insoumise. \nD'autres changements de parti sont répartis dans divers événements, mais pour l'instant, ils ne sont que cosmétiques."
 france_md.555.a: "Merci de m'avoir guidé"
 france_md.556.t: "Une dissolution réussie"
 france_md.556.d: "L'assemblée ne reflétait plus vraiment ce que nos concitoyens voulaient pour notre pays. Dissoudre l'assemblée a montré à nos compatriotes à quel point la situation gouvernementale aurait pu être pire. Ils ont fait le bon choix en nous préférant aux extrémistes."
 france_md.556.a: "C'était une excellente idée"
