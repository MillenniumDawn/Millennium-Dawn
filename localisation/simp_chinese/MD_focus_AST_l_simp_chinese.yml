 adf_acq_astuirement_program: "澳大利亚国防军采购计划"
 the_white_paper: "2000年白皮书"
 the_white_paper_desc: "《2000年国防报告》是对我们现有军事能力以及现任政府所需能力的全面评估。随着澳大利亚作为太平洋地区安全与维和行动主要提供者的地位日益凸显，政府的需求主要集中在扩充军力上。"
 the_second_white_paper_1: "第二份白皮书"
 the_second_white_paper_1_desc: "继第一份文件取得成功之后，澳大利亚国防军被委以重任，开展一系列更广泛的计划和重组，以继续满足太平洋防务的需求。"
 ast_we_are_many_tt: "我们国家的人口结构§G未来§!掌握在我们自己手中。"
 sol_islands_intervention: "向所罗门群岛提供区域援助团"
 sol_islands_intervention_desc: "目前该国局势无疑十分严峻。匪患和武装冲突屡见不鲜，公共服务瘫痪，剩余的警察部队也因各交战派系而分裂。若要恢复岛屿秩序，必须尽快开展大规模的稳定和重建工作。"
 sol_situation_countdown: "情况正在恶化……"
 organise_occupation_force: "组织占领军"
 organise_occupation_force_desc: "在开展任何重大行动之前，我们需要组建一支占领部队。目前，一些国家已承诺提供支持，但部队的主力仍需由我们自己承担。两千名士兵和约两百名受过维和训练的人员将负责岛上的执法工作。"
 operation_anode: "阳极行动"
 operation_anode_desc: "我们对岛屿的大规模进攻将分阶段进行，部分通过海路，部分通过我们的支奴干直升机进行空袭。首要目标是夺取岛上若干关键地点，作为后勤和前沿作战中心。之后，我们便可展开重建工作。为了便于理解，我们将其命名为“帮助朋友行动”，这个词在他们语言中意为“帮助朋友”。"
 secure_honiara: "确保霍尼亚拉安全"
 secure_weather_coast: "确保天气海岸安全"
 secure_rural_guadalcanal: "确保坦贝亚乡村安全"
 secure_malaita_province: "确保马莱塔省安全"
 sol_disarm_the_militias: "解除民兵武装"
 sol_red_cross: "与红十字会协调"
 sol_red_cross_desc: "红十字会已经在岛上拥有相当规模的机构。与他们协调合作，可以让我们的团队救治和撤离处于危险中的平民。"
 negotiate_with_the_militias: "与武装分子谈判"
 negotiate_with_the_militias_desc: "与武装分子谈判很难起到稳定局势的作用，但如果我们与比较理智的武装分子接触，组织停火，就可以为我们争取更多时间。"
 disband_the_local_police: "解散当地警察"
 disband_the_local_police_desc: "岛上的当地警察部队腐败横行，派系林立，已经完全丧失了为人民服务的能力。如果我们想要解决问题，就必须彻底改革现有的执法体系。"
 rebuild_the_local_policeforce: "重建当地警察部队"
 rebuild_the_local_policeforce_desc: "如果我们要重建该国的执法部门，我们需要创建一个多国委员委员会，开始审查和指导新招募的警官，并实施保障措施，以确保未来执法工作能够正常进行。"
 run_anticorruption_campaign: "开展反腐败运动"
 run_anticorruption_campaign_desc: "目前，国家的政治格局几乎瘫痪，更谈不上腐败横行。政府中剩下的人几乎无一例外都是劣迹斑斑。必须立即在全国范围内开展打击非法行为的行动，之后我们才能着手建立新的基础。"
 recruit_public_servants: "招募公务员"
 recruit_public_servants_desc: "为了清理委员会，我们将暂时聘请来自参与国的公务员在新政府中任职，同时计划最终用本地人员取代他们。这些来自外部的专业知识将有助于政府迅速重建。"
 reorganise_the_army: "重组军队"
 reorganise_the_army_desc: "自1978年独立以来，该国一直没有一支有效的常备军。它所做的很少，包括一支海上监视部队和一些从已解散的警察部队移交的部队。虽然我们的维和人员将扮演常备军的角色，但我们可以开始训练当地部队来承受我们的压力并协助行动。"
 loans_to_the_new_government: "向新政府提供贷款"
 loans_to_the_new_government_desc: "在我们继续为所罗门群岛构建新的治理体系的同时，其国际债务仍未偿清。我们将向其提供贷款，用于支付新人员的薪酬和重建政府。"
 send_our_reconstruction_teams: "派出我们的重建团队"
 send_our_reconstruction_teams_desc: "目前情况已有所改善，我们可以安全地派遣重建团队协助进行重建和公共服务建设。"
 sol_intervention: "所罗门群岛干预行动正在进行中"
 sol_intervention_success: "干预行动取得了成功。"
 the_financial_crisis_ast: "财政危机"
 the_financial_crisis_ast_desc: "由于次级抵押贷款的掠夺性放贷和监管的缺失，美国历史上最大的房地产泡沫破裂，世界其他地区也因此蒙受损失。"
