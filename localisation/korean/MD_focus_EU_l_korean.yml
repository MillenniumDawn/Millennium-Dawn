 EU_total_member_vote_desc_tt: "§C[EUU.GetFlag][EUU.GetName]§!의 주된 투표 방식은 가중다수결(QMV)입니다. 가중다수결을 통과하려면 [?global.EU_majority_qmv_state]개 §C회원국§!(전체 §C회원국§! 수의 55%)이 현재 결의안을 지지해야 합니다. 찬성국이 [?global.EU_majority_qmv_state]개 §C회원국§!을 넘어서고, 이들의 인구 합이 요구 기준인 65% 과반을 충족하면 법안이 가결됩니다.\n\n§G찬성§!하는 §C유럽연합(EU)§! 인구 비중: [?global.EU_pop_ratio_yes|%+]\n§R반대§!하는 §C유럽연합(EU)§! 인구 비중: [?global.EU_pop_ratio_no|%-]"
