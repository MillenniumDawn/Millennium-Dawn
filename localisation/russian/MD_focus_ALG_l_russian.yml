 ALG_deep_state_category: "Дела глубинного государства"
 ALG_assess_deep_state: "Оценить влияние глубинного государства"
 ALG_reduce_deep_state: "Ослабить влияние глубинного государства"
 ALG_reduce_deep_state_desc: "Планомерно сокращать влияние военной верхушки на гражданские дела.\n\n§GЭффект: власть глубинного государства -5§!\n§RРиск: стабильность -4%, при высоком уровне власти возможен ответный удар§!"
 ALG_purge_military_command: "Провести чистку военного командования"
 ALG_purge_military_command_desc: "Крайняя и опасная мера: убрать скомпрометированных генералов и восстановить гражданский контроль. Это сильно расстроит работу армии.\n\n§GЭффект: власть глубинного государства -10§!\n§RТяжёлые последствия:\n• Стабильность -10%\n• £army_experience опыт армии -50\n• Организация армии -10% на время чистки§!\n\n§YПерезарядка: 1 год§!"
 ALG_cooperate_with_military: "Сотрудничать с военным руководством"
 ALG_cooperate_with_military_desc: "Работать с генералами ради стабильности. Прагматичный подход даёт выгоду в ближайшей перспективе, но укрепляет их позиции.\n\n§RЭффект: власть глубинного государства +3§!\n§GВыгоды:\n• Стабильность +3%\n• £political_power политическая власть +50§!\n\n§YНедоступно, если власть глубинного государства > 25§!"
 ALG_reform_intelligence_services: "Реформировать спецслужбы"
 ALG_reform_intelligence_services_desc: "Перестроить спецслужбы (DRS/DSS) так, чтобы обеспечить настоящий гражданский контроль и подотчётность.\n\n§GЭффект: власть глубинного государства -7§!\n§RЦена:\n• Стабильность -5%\n• £political_power политическая власть -10% на время реформы\n• Лишает возможностей слежки§!\n\n§YПерезарядка: 180 дней§!"
 ALG_appoint_loyal_officers: "Назначить лояльных офицеров"
 ALG_appoint_loyal_officers_desc: "Назначить на ключевые военные посты офицеров, лояльных гражданскому правительству, постепенно меняя баланс сил.\n\n§GЭффект: власть глубинного государства -3§!\n§RЦена: £army_experience опыт армии -25§!\n\n§YПерезарядка: 120 дней§!"
 ALG_declare_emergency: "Ввести чрезвычайное положение"
 ALG_declare_emergency_desc: "Ввести чрезвычайные полномочия, чтобы временно заморозить деятельность глубинного государства. Отчаянная мера для отчаянных времён.\n\n§YЭффект: рост глубинного государства заморожен на 180 дней§!\n§RЦена:\n• Стабильность -8%\n• Добавляет национальный дух «Чрезвычайное положение»§!\n\n§YДоступно только при власти глубинного государства > 22§!"
 ALG_negotiate_with_generals: "Вести переговоры с генералами"
 ALG_negotiate_with_generals_desc: "Начать тайные переговоры с военным руководством по закрытым каналам, чтобы найти политический компромисс.\n\n§YИсходы (случайно):§!\n§G50%: успех — глубинное государство -4, стабильность +2%§!\n§Y30%: частичный успех — глубинное государство -2§!\n§R20%: провал — глубинное государство +2, стабильность -3%§!\n\n§YПерезарядка: 180 дней§!"
 alg_deep_state.5.t: "Влияние военных растёт"
 alg_deep_state.10.t: "Спецслужбы вмешиваются"
 alg_deep_state.15.t: "Генералы в тени"
 alg_deep_state.20.t: "Глубинное государство"
 alg_deep_state.101.t: "Нарушения в оборонном контракте"
 alg_deep_state.102.t: "Спецслужбы просят расширить полномочия"
 alg_deep_state.103.t: "Генерал бросает вызов гражданской власти"
 alg_deep_state.104.t: "Экономические интересы военных"
 alg_deep_state.105.t: "Давление на прессу"
 alg_deep_state.106.t: "Отставные генералы идут в политику"
 alg_deep_state.107.t: "Командующие в провинциях"
 alg_deep_state.108.t: "Предложение помощи из-за рубежа"
 alg_deep_state.200.t: "Военный переворот в Алжире"
 alg_deep_state.201.t: "Сопротивляться перевороту?"
 alg_deep_state.210.t: "Хунта укрепляет власть"
 alg_deep_state.211.t: "Реакция за рубежом"
 alg_deep_state.220.t: "Обещанные выборы"
 alg_deep_state.5.d: "По сообщениям, отставные генералы и офицеры спецслужб всё заметнее в политических и деловых кругах. Их влияние выходит далеко за рамки официальных должностей.\n\n§YГлубинное государство плетёт свои сети.§!"
 alg_deep_state.10.d: "Отдельные люди в DRS и других спецслужбах начали напрямую влиять на государственную политику. Ключевые решения принимаются без должного гражданского контроля.\n\n§RЭто требует ответа.§!"
 alg_deep_state.15.d: "Военная верхушка превратилась в теневое правительство. Министрам всё чаще приходится получать одобрение старших генералов, прежде чем проводить важные решения.\n\n§RLe pouvoir набирает силу.§!"
 alg_deep_state.20.d: "Силовой аппарат обрёл огромное влияние на алжирское государство. Глубинное государство — «le pouvoir» — стало подлинной властью за троном. Гражданские политики превратились в ширму.\n\n§RКРИТИЧЕСКИ: Алжиром правит глубинное государство!§!"
 alg_deep_state.101.d: "Огромный оборонный контракт на миллиарды заключён при подозрительных обстоятельствах. Есть свидетельства, что старшие военные чины получили крупные откаты.\n\n§YКак мы ответим?§!"
 alg_deep_state.102.d: "Спецслужбы официально запросили расширенные полномочия по слежке, ссылаясь на угрозы безопасности и необходимость борьбы с терроризмом и вмешательством извне.\n\n§YЭто заметно усилит их влияние.§!"
 alg_deep_state.103.d: "Видный и влиятельный генерал публично раскритиковал политику правительства, призвав к «ответственному руководству» и «приоритету национальной безопасности». Это едва прикрытая угроза гражданской власти.\n\n§RЭто прямой вызов!§!"
 alg_deep_state.104.d: "Высшие военные хотят расширить свои деловые интересы на ключевые отрасли экономики. Они утверждают, что это пойдёт на пользу национальной безопасности и развитию."
 alg_deep_state.105.d: "Военная верхушка давит на крупные СМИ, добиваясь более благосклонной редакционной линии по вопросам обороны и безопасности."
 alg_deep_state.106.d: "Несколько отставных высокопоставленных генералов заявляют о желании заняться политикой. Они обещают опыт и стабильность."
 alg_deep_state.107.d: "Командующие военными округами обладают немалым влиянием на местах. Вопрос в том, кому они верны — гражданскому правительству или сетям глубинного государства."
 alg_deep_state.108.d: "Иностранные дипломаты тихо предложили помощь в борьбе с растущим влиянием глубинного государства. За это придётся заплатить политическую цену и взять на себя обязательства."
 alg_deep_state.200.d: "Танки окружили правительственные здания в Алжире. Военные объявили, что берут «временный» контроль, чтобы «восстановить порядок, стабильность и надлежащее управление».\n\n§RВОЕННЫЕ ЗАХВАТИЛИ ВЛАСТЬ!§!\n\nГлубинное государство обернулось открытым военным правлением."
 alg_deep_state.201.d: "Военные захватили власть, но шанс на сопротивление, возможно, ещё есть. Верные части могли бы попытаться вернуть гражданское правление — но риск огромен."
 alg_deep_state.210.d: "Военное правительство быстро закрепило свою власть. Ключевые институты прочно перешли под командование армии."
 alg_deep_state.211.d: "Международное сообщество откликнулось на военный переворот. Ряд стран осудил его и призвал вернуть гражданское правление."
 alg_deep_state.220.d: "Время пришло. Захватывая власть, военные обещали за два года провести выборы и вернуть гражданское правление.\n\nСрок настал. Мир смотрит.\n\n§YСдержат ли генералы слово?§!"
 alg_deep_state.5.a: "Нужно сохранять бдительность."
 alg_deep_state.10.a: "Пусть действуют — нам нужна стабильность."
 alg_deep_state.10.b: "Немедленно восстановить гражданский контроль."
 alg_deep_state.15.a: "Принять военный надзор — сопротивление бесполезно."
 alg_deep_state.15.b: "Дать генералам отпор!"
 alg_deep_state.20.a: "Теперь настоящая власть у генералов."
 alg_deep_state.101.a: "Закрыть глаза — нам нужна поддержка армии."
 alg_deep_state.101.b: "Начать расследование."
 alg_deep_state.102.a: "Расширить полномочия по слежке."
 alg_deep_state.102.b: "Сохранить конституционные рамки."
 alg_deep_state.103.a: "Отступить — столкновение нам не по карману."
 alg_deep_state.103.b: "Немедленно уволить генерала!"
 alg_deep_state.103.c: "Найти компромисс."
 alg_deep_state.104.a: "Разрешить военным расширять бизнес."
 alg_deep_state.104.b: "Перекрыть военным путь в экономику."
 alg_deep_state.105.a: "Пусть военные задают повестку."
 alg_deep_state.105.b: "Защитить свободу прессы."
 alg_deep_state.106.a: "Приветствовать их участие в политике."
 alg_deep_state.106.b: "Не пускать их в политику."
 alg_deep_state.107.a: "Поощрить командиров, верных государству."
 alg_deep_state.107.b: "Отдать назначения глубинному государству."
 alg_deep_state.108.a: "Принять негласную помощь извне."
 alg_deep_state.108.b: "Отвергнуть любое иностранное вмешательство."
 alg_deep_state.200.a: "Теперь Алжиром правят военные."
 alg_deep_state.201.a: "Попытаться дать отпор перевороту!"
 alg_deep_state.201.b: "Принять власть военных — сопротивление бесполезно."
 alg_deep_state.210.a: "Новый порядок установлен."
 alg_deep_state.211.a: "Не обращать внимания на критику."
 alg_deep_state.211.b: "Пообещать выборы в будущем."
 alg_deep_state.220.a: "Провести выборы и вернуть демократию."
 alg_deep_state.220.b: "Страна не готова — отложить на неопределённый срок."
 alg_deep_state_news.1.t: "Военный переворот в Алжире!"
 alg_deep_state_news.1.d: "Сообщения из Алжира говорят, что армия захватила власть. Танки окружили ключевые правительственные здания, военная хунта объявила о переходе власти в её руки.\n\nЭто резкий поворот в алжирской политике: то самое «глубинное государство», о котором давно ходили слухи, теперь правит открыто."
 alg_deep_state_news.1.a: "Это очень тревожно."
 alg_deep_state_news.1.b: "Внутренние дела Алжира нас не касаются."
 ALG_deep_state_oversight: "Военный надзор"
