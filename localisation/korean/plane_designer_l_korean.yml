 air_module_railgun_cannon_3_desc: "$air_module_railgun_cannon_1_desc$"
 air_module_pdl_1: "점방어 레이저 I"
 air_module_pdl_1_desc: "점방어 레이저는 날아오는 미사일을 충돌 전에 탐지하고 교전하는 능동 방어층을 제공하여, 현대의 공대공 및 지대공 위협에 대한 생존성을 높입니다.\n\n§G설계 힌트: 점방어 레이저는 항공기의 미사일 방어를 높이지만 더 무겁고 제작 비용이 더 비쌉니다.§!"
