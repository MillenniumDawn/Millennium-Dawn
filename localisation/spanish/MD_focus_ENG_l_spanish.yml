 ENG_scottish_referendum_pressure: "Exigencias de un referéndum escocés"
 ENG_scottish_referendum_pressure_desc: "El Parlamento escocés cuenta con una mayoría proindependentista y los argumentos a favor de la Unión ya no se exponen en ningún lugar donde el público pueda escucharlos. Se está redactando un proyecto de ley de referéndum en Holyrood. Westminster dispone de un año para hacer que la cuestión constitucional parezca menos urgente que la factura de la luz, ya sea comprando buena voluntad en Escocia o haciendo que las finanzas de Escocia dependan visiblemente del Tesoro. Si la presión sigue por encima de 60 cuando la campaña madure, la exigencia se formaliza y deberemos responder a ella."
 ENG_scottish_pressure_defused_tt: "La presión de independencia escocesa está por debajo de §G50§!"
 ENG_north_irish_referendum_pressure: "Exigencias de un referéndum fronterizo"
 ENG_north_irish_referendum_pressure_desc: "Los partidos nacionalistas ostentan el equilibrio de poder en Stormont y presionan al secretario de Estado para que fije una fecha para un referéndum fronterizo. La tensión sectaria y la capacidad de la Provincia para sufragar sus propios gastos están sobre la mesa, y la República se mantiene expectante. Westminster dispone de un año para reducir las cifras antes de que la exigencia se formalice."
 ENG_north_irish_pressure_defused_tt: "La presión de independencia norirlandesa está por debajo de §G50§!"
 ENG_welsh_referendum_pressure: "Exigencias de un referéndum galés"
 ENG_welsh_referendum_pressure_desc: "Una mayoría proindependentista en el Senedd está preparando su propio proyecto de ley de referéndum. La independencia de Gales se consideró durante mucho tiempo algo poco serio en Londres precisamente porque los números nunca cuadraban; ese argumento solo se sostiene mientras seamos nosotros quienes hagamos las cuentas. Disponemos de un año para reducir la presión antes de que la exigencia se formalice."
 ENG_welsh_pressure_defused_tt: "La presión de independencia galesa está por debajo de §G50§!"
