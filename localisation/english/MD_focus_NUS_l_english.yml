l_english:
 NUS_war_effort_category: "The Jihad in Syria"
 NUS_war_effort_category_desc: "Our fighters hold Idlib and the northern countryside. Money from private donors, volunteers from across the Muslim world, and the tolls of the Turkish border keep the jihad alive."
 NUS_gulf_private_donors: "Appeal to Gulf Donors"
 NUS_gulf_private_donors_desc: "Wealthy sympathizers in the Gulf send money through charities and couriers that no government will admit to. We can ask them again every two months."
 NUS_recruit_foreign_fighters: "Recruit Foreign Fighters"
 NUS_recruit_foreign_fighters_desc: "Volunteers from across the Muslim world cross the Turkish border to join us. Within two weeks they will reach the front."
 NUS_bab_al_hawa_crossing: "Tax the Bab al-Hawa Crossing"
 NUS_bab_al_hawa_crossing_desc: "Whoever holds Idlib holds Bab al-Hawa, the busiest crossing on the Turkish border. Its traders and smugglers pay us in weapons as well as money."
