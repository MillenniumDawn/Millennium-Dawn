 tech_submarine_engineering_1: "Ingeniería submarina"
 tech_submarine_engineering_1_desc: ""
 tech_submarine_engineering_2: "Motor submarino antiguo"
 tech_submarine_engineering_2_desc: "The diesel-electric power used in early submarines consisted of a diesel engine, an electric motor, a generator, and a battery. The propeller was driven by a diesel engine connected in parallel with an electric motor. The diesel engine could be used for navigation on the water, or the diesel engine could be used to drive the generator to charge the battery. When the ship was submerged, the air supply was limited and the oxygen-consuming heat engine could not operate; the battery would provide energy for the electric motor, which would drive the propeller with electricity."
 tech_submarine_engineering_3: "Motor submarino avanzado"
 tech_submarine_engineering_3_desc: "El nuevo sistema de propulsión diésel-eléctrico utiliza baterías de litio en lugar de las tradicionales baterías de plomo-ácido para lograr una mayor autonomía."
 tech_submarine_engineering_4: "Motor submarino moderno"
 tech_submarine_engineering_4_desc: "La introducción del sistema AIP puede hacer que los submarinos funcionen de manera más eficiente, silenciosa y fiable."
 attack_submarine_hull_1: "Casco de Submarino de Ataque 1965"
 attack_submarine_hull_1_desc: "Estas plataformas de guerra submarina, asesinos silenciosos de los océanos del mundo, incorporan una variedad de capacidades útiles, que incluyen sigilo, recopilación de información y sistemas de armas. Diseñados para un amplio espectro de misiones en alta mar y litorales, estos especialistas en negación de área son una piedra angular de cualquier armada. Los submarinos de ataque son combinaciones de misiles y submarinos diseñados para atacar objetivos distantes en el extranjero."
