 MEX_jalisco_tierra_cartel_desc: "El Cartel de Tierra Caliente se está volviendo demasiado fuerte, necesitamos frenar su influencia en Jalisco."
 MEX_guerrero_oaxaco_tierra_cartel: "Reducir la influencia del Cartel de Tierra Caliente"
