 UKR_vv_tooltip_tt: "§YLe financement des forces spéciales réduira considérablement les conséquences d'un éventuel Maïdan§!"
 UKR_arms_rebuild: "Industrie militaire"
 UKR_arms_rebuild_desc: "Notre pays doit se défendre, et seule une industrie militaire forte pourra l'aider dans cette tâche."
 UKR_arms_build: "Investir dans la production militaire"
 UKR_arms_build_desc: "We are ready to finance investments in expanding the military production of some of our name factories."
 UKR_polish_ukr_brotherhood: "Fraternité polono-ukrainienne"
 UKR_polish_ukr_brotherhood_desc: "Only together, Ukraine and Poland will be able to defeat any enemy."
 UKR_belarus_brothers: "Les frères biélorusses"
 UKR_belarus_brothers_desc: "Le peuple biélorusse est notre frère, également pris dans l'étau de deux grandes forces politiques. Nous les libérerons de ces griffes."
 UKR_befriend_azerbaijan: "Amitié avec l'Azerbaïdjan"
 UKR_befriend_azerbaijan_desc: "L'Azerbaïdjan sera un allié précieux pour faire avancer notre politique dans le Caucase, où nous pourrons activement contrer l'influence de la Russie."
 UKR_befriend_georgia: "Union avec la Géorgie"
 UKR_befriend_georgia_desc: "Georgia is an important partner and has a strategic position in the Caucasus region. Having such an ally in the Alliance will be very beneficial for us."
 UKR_caucasus_volunteers: "Volontaires du Caucase"
 UKR_caucasus_volunteers_desc: "We will invite many volunteers from the Caucasus to form HUR battalions."
 UKR_dagestan_reb_prepare: "Préparer un soulèvement au Daguestan"
 UKR_dagestan_reb_prepare_desc: "We will begin preparations for a special limited operation in Dagestan."
 UKR_befriend_chechens: "Amitié avec l'Itchkérie"
 UKR_befriend_chechens_desc: "L'Itchkérie, un État détruit par la Russie au début de ce siècle. Nous rassemblerons ses vrais patriotes et tenterons de le faire renaître."
 UKR_reconcista: "La Reconquista ukrainienne"
 UKR_reconcista_desc: "European states are mired in chaos, an emigrant crisis. The peoples of Europe are completely under the control of the globalists, which in the future will surely lead Europe to collapse, for the sake of easy profit - we will change this."
 UKR_no_russian_language: "Interdiction de la langue russe"
 UKR_no_russian_language_desc: "It's time to deal with the Russian language completely."
 UKR_kuban_ukrainization: "Ukrainisation du Kouban"
 UKR_kuban_ukrainization_desc: "Kuban will become Ukrainian, we will take care of it."
 UKR_trizub: "Tryzub"
 UKR_trizub_desc: "Tryzub is entrusted with functions of a specific nature that other wings of the Nationalist Congress did not get."
 UKR_christos_nash: "Nationalisme chrétien"
 UKR_christos_nash_desc: "Christianity and nationalism are things that should be united in our Ukrainian state."
 UKR_nationalists_congress: "Politique du Congrès nationaliste"
 UKR_nationalists_congress_desc: "The real patriots of Ukraine are now running the country, no matter how tough the policy is, it will make our country great."
 UKR_nationalists_right_sector: "Le Secteur droit"
 UKR_nationalists_una_unso: "UNA-UNSO"
 UKR_nationalists_upa: "UPA"
 UKR_nationalists_people_leave: "Migration hors d'Ukraine"
 UKR_nationalists_people_leave_desc: "Notre politique a provoqué une migration massive hors du pays, mais nous sommes ravis que tous les traîtres quittent enfin ces lieux !"
 UKR_nationalists_cleane_ukraine: "La vraie Ukraine"
 UKR_nationalists_great_ukraine: "La Grande Ukraine"
 UKR_nationalists_great_ukraine_desc: "La Grande Ukraine commence ici !"
 UKR_nationalists_trizub: "Tryzub"
 UKR_nationalists_reconcista: "La Reconquista ressuscitée"
 UKR_nationalists_reconcista_desc: "Ukraine will become a beacon of the revival of Christianity in Europe! The holy march from Kyiv begins."
 did_not_support_the_baltic_black_sea_union: "§YN'a pas soutenu l'initiative de l'Union Baltique-Mer Noire§!"
 ukraine_congress.2.t: "L'Ukraine prend Sébastopol"
 ukraine_congress.2.d: "The Ukrainian government cancels the lease agreement with us and begins the expulsion of our fleet from Sevastopol."
 ukraine_congress.2.a: "C'est notre défaite"
 ukraine_congress.10.t: "L'Ukraine propose des idées pour une Union Baltique-Mer Noire"
 ukraine_congress.10.d: "L'Union Baltique-Mer Noire est un concept similaire à celui de l'Intermarium, autrefois dirigé par la Pologne. Il s'agit d'une alliance défensive entre les pays situés entre la mer Baltique et la mer Noire. Ces pays coopéreraient et se consolideraient en un bloc de puissance pour se soutenir mutuellement. Comme le dit l'adage, l'union fait la force.\n\n§YCela permet des garanties mutuelles via l'arbre ukrainien§!"
 ukraine_congress.10.a: "Nous devrions continuer à explorer cette idée."
 ukraine_congress.10.b: "Idée ridicule"
 ukraine_congress.11.t: "L'Union Baltique-Mer Noire"
 ukraine_congress.11.d: "Les lois et traités ont été rédigés. Les peuples des pays qui soutiennent l'idée se sont enfin réunis. Il est temps de concrétiser cette ambition. Il est temps d'allier ceux qui nous ont soutenus. L'Ukraine nous a envoyé le traité final que nous devons signer pour officialiser l'alliance. Allons-nous nous retirer maintenant ou rester sur notre lancée et soutenir nos nouveaux alliés ?"
 ukraine_congress.11.a: "Signer le traité"
 ukraine_congress.11.b: "Se retirer. Déchirer le traité"
 UKR_poroshenko_start: "Présidence de Porochenko"
 UKR_poroshenko_start_desc: "The Ukrainian state was headed by an oligarch. The history of Ukraine clearly did not expect such a turn, perhaps it will lead Ukraine to success."
 UKR_poroshenko_decentr: "Décentralisation"
 UKR_poroshenko_decentr_desc: "One of the main political points of Poroshenko's program has been and will be - decentralization. We must reform the Ukrainian state."
 UKR_poroshenko_deccomunism: "Décommunisation"
 UKR_poroshenko_deccomunism_desc: "The communist past has been hard and scary for our country. Our nation was almost destroyed by the Famine, and we will not allow monuments to our murderers to be all over the country."
 UKR_poroshenko_anti_corruption: "Réformes anti-corruption"
 UKR_poroshenko_anti_corruption_desc: "Corruption has been and will continue to be a sore topic in our country, and we will carry out a series of anti-corruption reforms."
 UKR_poroshenko_nabu: "Créer le NABU"
 UKR_poroshenko_nabu_desc: "Le NABU est une autorité exécutive centrale dotée d'un statut spécial, chargée de la prévention, de la détection, de la répression, de l'enquête et de la révélation des actes de corruption et autres infractions pénales relevant de sa juridiction, ainsi que de la prévention de nouveaux cas."
 UKR_poroshenko_no_russian_military: "Se débarrasser de l'influence des forces armées russes"
 UKR_poroshenko_no_russian_military_desc: "Nous devons cesser de dépendre de l'armée russe ; seule une armée ukrainienne indépendante protégera le pays."
 UKR_poroshenko_anti_rus_doctrine: "La doctrine anti-russe"
 UKR_poroshenko_anti_rus_doctrine_desc: "Russia has been and will be an aggressor towards us, we must clearly reflect this in our military doctrine."
 UKR_poroshenko_smi_free: "Liberté des médias"
 UKR_poroshenko_smi_free_desc: "The media should be free and not limited by the dictatorial habits of a few people."
 UKR_poroshenko_kefalia: "Autocéphalie de l'Église ukrainienne"
 UKR_poroshenko_kefalia_desc: "It's time to get rid of the influence of the Moscow Orthodox Church."
 UKR_poroshenko_ukrainisation: "Ukrainisation"
 UKR_poroshenko_ukrainisation_desc: "We will begin a policy of Ukrainization, and gradually eradicate the Russian language from various social environments."
 UKR_poroshenko_upa: "Honorer les héros de l'UPA"
 UKR_poroshenko_upa_desc: "UPA - they were defenders of Ukraine and we will honor them."
 UKR_poroshenko_es: "Coopération avec l'UE"
 UKR_poroshenko_es_desc: "The European Union will be our main economic partner and we will strive to maintain trade relations with them further."
 UKR_poroshenko_canada: "Partenariat avec le Canada"
 UKR_poroshenko_canada_desc: "We are ready to conclude several agreements with Canada to improve trade relations."
 UKR_us_friendship: "Partenariat avec les États-Unis"
 UKR_us_friendship_desc: "We are ready to conclude several agreements with USA to improve trade relations."
 UKR_visegrad_coop: "Partenariat avec le Groupe de Visegrád"
 UKR_visegrad_coop_desc: "We are ready to conclude several agreements with Visegrád Group to improve trade relations."
 UKR_turkey_invest_req: "Investissements en provenance de Turquie"
 UKR_turkey_invest_req_desc: "We will attract Turkish investors to our territory, their investments will help our economy."
 UKR_kazakh_improve_rel: "Améliorer les relations avec le Kazakhstan"
 UKR_kazakh_improve_rel_desc: "Kazakhstani partners will be an excellent addition to our foreign trade activities."
 UKR_reorient_market: "Réorientation vers le marché occidental"
 UKR_reorient_market_desc: "The East is closed to us, we will reorient our markets to the west."
 UKR_ukroboronprom_revival: "Investissements dans l'industrie de défense"
 UKR_ukroboronprom_revival_desc: "Our defense industry needs investments, we will give them."
 UKR_smuggle_parts_through_russia: "Acheter des pièces en Russie de manière détournée"
 UKR_smuggle_parts_through_russia_desc: "Despite our anti-Russian doctrine, we are forced to purchase spare parts from Russian factories, albeit in a roundabout way."
 UKR_reverse_engineering: "Rétro-ingénierie"
 UKR_reverse_engineering_desc: "We will strive to create our own engineering in the field of armored vehicles."
 UKR_western_assistance: "Soutien occidental"
 UKR_western_assistance_desc: "Western investors are also actively investing in our defense industry."
 UKR_poroshenko_nato: "Coopération avec l'OTAN"
 UKR_poroshenko_nato_desc: "NATO is our main military partner, and with their help we are reforming our armed forces."
 UKR_belarus_proposal_non_attack: "Pacte de non-agression avec la Biélorussie"
 UKR_belarus_proposal_non_attack_desc: "Belarus, our northern neighbor, can be used by enemies to attack us from two sides, we must prevent this."
 UKR_language_policies: "Politique linguistique"
 UKR_language_policies_desc: "We will continue to expand the percentage of the Ukrainian language in communication and in other areas of citizens' lives."
 UKR_support_patriotism: "Soutien au patriotisme"
 UKR_support_patriotism_desc: "Patriotism will be encouraged by the state as never before."
 UKR_donbass_okopi: "Opération Mur"
 UKR_donbass_okopi_desc: "We urgently need to build a defensive line along the border of our enemy."
 UKR_transnistria_defences: "Renforcer la frontière avec la Transnistrie"
 UKR_transnistria_defences_desc: "Transnistria may become a springboard for an attack on us in the future, we will strengthen the border with them."
 UKR_deoligarchisation: "Déoligarchisation"
 UKR_deoligarchisation_desc: "The oligarchs have too much power in our country - we will fix it."
 UKR_rochen_expansion: "Élargir la production de Roshen"
 UKR_rochen_expansion_desc: "Roshen factory will now be able to expand its production capabilities with the help of public investments."
 UKR_support_medium_businesses: "Soutenir les petites entreprises"
 UKR_support_medium_businesses_desc: "Small businesses will receive the necessary support."
 UKR_kolomoyski_deal: "Accord avec Kolomoïsky"
 UKR_kolomoyski_deal_desc: "Kolomoisky has long been one of the main problems in our country, his influence was too great and it's time to deal with him."
 UKR_purge_church_from_rus: "Éliminer l'influence de l'Église orthodoxe russe"
 UKR_purge_church_from_rus_desc: "The Russian Orthodox Church will no longer influence us."
 UKR_greece_letter: "S'adresser au Patriarche œcuménique"
 UKR_greece_letter_desc: "We will appeal to the Ecumenical Patriarch to recognize our church as independent."
 UKR_upc_create: "Créer une Église orthodoxe ukrainienne"
 UKR_upc_create_desc: "The Ukrainian Orthodox Church will be created! Now we are a spiritually free country as well."
 UKR_poroshenko_army_reform: "Réforme de l'armée"
 UKR_poroshenko_army_reform_desc: "Our army needs major reforms - we will start implementing them now."
 UKR_pmc_instructors: "Instructeurs des PMC occidentales"
 UKR_pmc_instructors_desc: "Western PMCs instructors are ready to support our army."
 UKR_rally_nationalist_support: "Soutenir les vétérans"
 UKR_rally_nationalist_support_desc: "Combat veterans will be the mainstay of our future election campaign."
 UKR_welfare_conseccions: "Augmenter le soutien social"
 UKR_welfare_conseccions_desc: "Nous concentrerons notre future campagne électorale sur l'augmentation des garanties sociales."
 UKR_anti_russia_propaganda: "Propagande anti-russe"
 UKR_anti_russia_propaganda_desc: "Our citizen must understand who his true enemy is, who seeks to absorb our country - Russia."
 UKR_saakashvili_odessa: "Invite Saakashvili As The Governor of Odesa"
 UKR_saakashvili_odessa_desc: "We will invite Saakashvili to be the governor of the Odesa region, perhaps he will show himself well."
 UKR_support_minsk_agreements: "Soutenir les accords de Minsk"
 UKR_support_minsk_agreements_desc: "We will support the Minsk agreements and try to resolve everything peacefully."
 UKR_continue_shelling: "Éliminer les séparatistes"
 UKR_continue_shelling_desc: "No separatists! We will liberate our lands."
 UKR_business_with_rf: "Affaires avec la Russie"
 UKR_business_with_rf_desc: "We will continue to do business with Russia."
 UKR_full_rus_embargo_por: "Imposer un embargo contre la Russie"
 UKR_full_rus_embargo_por_desc: "We will impose an embargo on economic cooperation with Russia."
 UKR_osce_watchers: "Observateurs de l'OSCE"
 UKR_osce_watchers_desc: "OSCE observers will be invited to Donbass."
 UKR_suppress_easterner: "Réprimer les partisans de l'Est"
 UKR_suppress_easterner_desc: "Supporters of integration with Russia should be suppressed, including through the media."
 UKR_anti_emerg_1plus1: "Renforcer la propagande anti-orientale"
 UKR_anti_emerg_1plus1_desc: "We will strengthen the propaganda directed against those who support Russia."
 UKR_eu_compliant_reforms: "Réformes conformes à l'UE"
 UKR_eu_compliant_reforms_desc: "We will continue compliance reforms for integration with the European Union."
 UKR_european_education_connections: "Coopération avec les institutions éducatives européennes"
 UKR_european_education_connections_desc: "European education will give us much more than the old, Soviet and totalitarian one."
 UKR_european_defence_program: "Programme de protection européen"
 UKR_european_defence_program_desc: "We will join the European Defense Program to strengthen our armed forces."
 UKR_nato_application_por: "Programme de coopération avec l'OTAN"
 UKR_nato_application_por_desc: "NATO's partnership in the field of armed forces will also allow us to carry out reforms of our army."
 UKR_ukraine_anew: "Nouvelle Ukraine"
 UKR_ukraine_anew_desc: "Our country has gone through a long way, many reforms, but now it has been reborn and looks positively to the future."
 UKR_apply_to_eu_por: "Programme de coopération avec l'UE"
 UKR_apply_to_eu_por_desc: "Cooperation with the European Union will continue to be our priority."
 UKR_anti_rus_doctrine: "La doctrine anti-russe"
 UKR_anti_rus_doctrine_desc: "Notre ennemi politique et idéologique était et reste la Russie. Nous devons l'accepter et nous préparer à la guerre."
 UKR_foreign_advisors_desc: "Foreign instructors from various PMCs are ready to train our soldiers."
 UKR_west_investors: "Investisseurs occidentaux"
 UKR_operation_wall: "Opération Mur"
 UKR_smuggle_parts_from_rus: "Achat de pièces détachées en Russie"
 UKR_smuggle_parts_from_rus_desc: "We continue to buy spare parts from Russia, albeit secretly."
 UKR_reverse_engineering_start: "Rétro-ingénierie"
 UKR_reverse_engineering_start_desc: "We aim to create our own production."
 UKR_ato_supports: "Soutien aux vétérans"
 UKR_health_supports: "Soutien aux soins de santé"
 UKR_poroh_prepare_donbass: "Préparation à une revanche dans le Donbass"
 UKR_poroh_prepare_donbass_desc: "We are ready to take revenge from the separatists and solve the problem with the People's republics forever."
 UKR_poroh_osce_ukr: "Observateurs de l'OSCE"
 UKR_poroh_osce_ukr_desc: "OSCE observers have been sent to the conflict zone to stabilize the situation on the front line with the unrecognized republics."
 ukraine_poroh.1.t: "L'Ukraine propose un pacte de non-agression"
 ukraine_poroh.1.d: "The Ukrainian government suggests that we conclude a non-aggression pact with them, apparently they see us as potential aggressors against themselves."
 ukraine_poroh.1.a: "Nous signerons un pacte"
 ukraine_poroh.1.b: "Ce n'est pas nécessaire"
 ukraine_poroh.2.t: "Pacte de non-agression avec la Biélorussie"
 ukraine_poroh.2.d: "The Belarusian government has agreed to sign a non-aggression pact with us, we are glad that they are on our side."
 ukraine_poroh.2.a: "Bien"
 ukraine_poroh.3.t: "Pacte de non-agression avec la Biélorussie"
 ukraine_poroh.3.d: "The Belarusian government has refused to sign a non-aggression pact with us, which worries us."
 ukraine_poroh.3.a: "triste"
 ukraine_poroh.4.t: "Autocéphalie de l'Église ukrainienne"
 ukraine_poroh.4.d: "L'Église ukrainienne a fait appel à notre Patriarche œcuménique pour obtenir l'autorisation de son autocéphalie ; notre patriarche le permettra-t-il ?"
 ukraine_poroh.4.a: "Oui"
 ukraine_poroh.4.b: "Non"
 ukraine_poroh.5.t: "Autocéphalie de l'Église ukrainienne"
 ukraine_poroh.5.d: "The Ecumenical Patriarch approved the Autocephaly of our Church."
 ukraine_poroh.5.a: "Bien"
 ukraine_poroh.6.t: "Autocéphalie de l'Église ukrainienne"
 ukraine_poroh.6.d: "The Ecumenical Patriarch did not approve the Autocephaly of our Church."
 ukraine_poroh.6.a: "triste"
 ukraine_poroh.7.t: "L'Ukraine veut coopérer avec les quatre de Visegrád"
 ukraine_poroh.7.d: "Le gouvernement ukrainien a clairement exposé ses plans de coopération avec les pays des quatre de Visegrád. En tant que représentant des quatre, décidons-nous d'accepter cette coopération ?"
 ukraine_poroh.7.a: "Oui"
 ukraine_poroh.7.b: "Non"
 ukraine_poroh.8.t: "Coopération avec les pays de Visegrád"
 ukraine_poroh.8.d: "They agreed to cooperate."
 ukraine_poroh.8.a: "Bien"
 ukraine_poroh.9.t: "Coopération avec les pays de Visegrád"
 ukraine_poroh.9.d: "They refused to cooperate with us."
 ukraine_poroh.9.a: "triste"
 UKR_kefalia_agree: "Permission du Patriarche œcuménique"
 UKR_odessa_ssaka: "Conséquences du gouvernorat de Saakachvili"
 UKR_odessa_ssak: "Conséquences du gouvernorat de Saakachvili"
 ukr_industry_points_cost_35: "35 points d'industrie"
 ukr_industry_points_cost_50: "50 points d'industrie"
 ukr_industry_points_cost_75: "75 points d'industrie"
 UKR_opfl_political_reforms: "Réformes politiques"
 UKR_opfl_political_reforms_desc: "Après les récents événements, notre pays a besoin de réformes politiques. Sans elles, l'Ukraine ne pourra pas se développer davantage."
 UKR_opfl_lustration_fight: "Lutte contre la lustration"
 UKR_opfl_lustration_fight_desc: "La lustration est la restriction d'accès aux services publics pour ceux qui ont occupé des postes élevés sous les régimes politiques précédents. Après les récents événements, cette politique est également en cours en Ukraine. Cette aberration doit être arrêtée."
 UKR_opfl_radicalism: "Lutte contre le radicalisme"
 UKR_opfl_radicalism_desc: "En quelques années de chaos politique, le radicalisme s'est répandu à travers l'Ukraine. Pour l'existence pacifique de notre pays, il est nécessaire de combattre toute manifestation de radicalisme chez nous."
 UKR_opfl_ukrainisation_policy: "Condamnation de l'ukrainisation"
 UKR_opfl_ukrainisation_policy_desc: "The policy of Ukrainianisation directly interferes with the development of good relations with our big neighbour - Russia. It is necessary to condemn and stop the propaganda of Ukrainianisation, otherwise no good will come of it."
 UKR_opfl_national_ref: "Tenue d'un référendum national"
 UKR_opfl_national_ref_desc: "Un référendum national permettra au peuple de notre pays de déterminer son propre avenir. Nous devons le faire le plus vite possible !"
 UKR_opfl_independence_rep: "Reconnaître l'indépendance des républiques"
 UKR_opfl_independence_rep_desc: "Eh bien, le peuple des républiques a fait son choix, et nous devons le respecter. Il est grand temps d'investir et de tisser des liens avec ces nouveaux États."
 UKR_opfl_take_republic: "Ramener par la force"
 UKR_opfl_take_republic_desc: "Le référendum n'était qu'un écran de fumée. Notre véritable objectif est d'identifier les séparatistes sur notre territoire, et il est temps de ramener nos terres chez nous ! Les séparatistes ne fouleront pas le sol ukrainien !"
 UKR_opfl_federalisation_project: "Projet de fédération"
 UKR_opfl_federalisation_project_desc: "Maintenant que tous les différends territoriaux sont résolus, nous pouvons envisager un avenir radieux. Il est temps pour la Fédération ukrainienne !"
 UKR_opfl_economic_policy: "Nouvelles politiques économiques"
 UKR_opfl_economic_policy_desc: "New economic policies will help revitalise our economy and subsequently rebuild it."
 UKR_opfl_rural_land: "Conservation des terres rurales"
 UKR_opfl_rural_land_desc: "Rural activities are a big part of our economy. Therefore, it is necessary to secure their legally acquired land. This way we will give them confidence that their land will not be taken away the next day."
 UKR_opfl_tarif_genocide: "Non au génocide tarifaire !"
 UKR_opfl_tarif_genocide_desc: "Le génocide tarifaire est un cauchemar pour nos citoyens. La plupart de leur argent sert à payer de nombreux impôts inutiles. Nous devons dire « NON » à cette anarchie !"
 UKR_opfl_deindustry: "Arrêter la désindustrialisation de l'Ukraine"
 UKR_opfl_deindustry_desc: "Après que l'Ukraine a obtenu son indépendance, l'ancien gouvernement a cédé toutes les richesses industrielles de notre pays à n'importe qui pour presque rien. En conséquence, nous nous sommes retrouvés dans un gouffre industriel. Nous devons reprendre la construction d'usines, de centrales et d'autres entreprises."
 UKR_federaliz_tt: "Nous allons §Yfédéraliser§! l'Ukraine"
 UKR_rosava: "CJSC Rosava"
 UKR_rosava_desc: "CJSC Rosava est le plus grand fabricant de pneus en Ukraine. Les sites de production sont situés dans deux usines de pneus : Rosava et la production de pneus de grande taille. La capacité atteint environ 6 millions d'unités de pneus par an."
 UKR_land_land: "Poursuivre la réforme agraire"
 UKR_land_land_desc: "We are ready to continue the land reform that began in the last century and move it forward."
 UKR_motor_sich: "Motor Sich"
 UKR_motor_sich_desc: "La société par actions Motor Sich est un fabricant ukrainien de moteurs d'avions basé à Zaporijjia. L'entreprise produit des moteurs pour avions et hélicoptères ainsi que des turbines à gaz industrielles et marines."
 UKR_armor_kyv: "The Kyiv Armored Plant"
 UKR_armor_kyv_desc: "The Kyiv Armored Plant is a state-owned enterprise of the armored industry of Ukraine, which performs diagnostics, repair, maintenance, re-equipment and modernization of Soviet-made armored vehicles."
 UKR_pivdenmash_idea: "PA Pivdenmash"
 UKR_kyvarmor_idea: "Kyiv Armored Plant"
 UKR_zaz_idea: "ZAZ"
 UKR_kraz_idea: "KrAZ"
 UKR_motorsich_idea: "Motor Sich"
 UKR_start_war_against_poland: "Guerre polono-ukrainienne"
 UKR_start_war_against_poland_desc: "Le moment décisif de notre État est arrivé. Nous repousserons l'ennemi ou nous disparaîtrons de l'histoire mondiale."
 UKR_hur_expandeds: "Élargir l'influence du HUR"
 UKR_hur_expandeds_desc: "Nous élargirons les pouvoirs du HUR ; la situation l'exige, la guerre l'exige !"
 UKR_unite_with_russian_genshtab: "Solliciter l'aide de l'état-major général russe"
 UKR_unite_with_russian_genshtab_desc: "We are ready to enlist the help of the Russian General Staff for the war with the Polish Army."
 UKR_observer_joint_shtab_kiev: "Créer un quartier général conjoint"
 UKR_observer_joint_shtab_kiev_desc: "The armed forces of Russia and Ukraine will create a joint general staff in Kyiv."
 UKR_professional_shturm_groups: "Brigades d'assaut"
 UKR_professional_shturm_groups_desc: "Nous commencerons à recruter des personnes dans des brigades d'assaut pour affronter nos ennemis plus efficacement."
 UKR_pmc_zaporozhets: "PMC Zaporozhets"
 UKR_pmc_zaporozhets_desc: "Certains vétérans de guerre ont créé leur propre compagnie militaire privée appelée Zaporozhets."
 UKR_start_the_kashubian_uprising: "Préparer une rébellion en Cachoubie"
 UKR_start_the_kashubian_uprising_desc: "We will prepare an insurgency in this region to undermine Poland's defense."
 UKR_silesian_rebellion: "Préparer une rébellion en Silésie"
 UKR_silesian_rebellion_desc: "We will prepare an insurgency in this region to undermine Poland's defense."
 UKR_vilnoe_pospolitoe_rushenie: "Bataillon Pospolite Ruszenie"
 UKR_vilnoe_pospolitoe_rushenie_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_belarus_volunteers: "Bataillon Rokossovsky"
 UKR_belarus_volunteers_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_legion_free_poland: "Légion pour la liberté de la Pologne"
 UKR_legion_free_poland_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_polish_hetmanate_army: "Bataillon de l'Hetmanat polonais"
 UKR_polish_hetmanate_army_desc: "A new operational Battalion of the HUR will be created to conduct special limited operations on enemy territory."
 UKR_air_dominance_tactics: "Tactiques de domination aérienne"
 UKR_air_dominance_tactics_desc: "We need to suppress Polish Aviation, so we will apply a new doctrine."
 UKR_tro_expandeds: "Renforcer la défense territoriale"
 UKR_tro_expandeds_desc: "Nous élargirons en urgence le recrutement pour la défense territoriale ; nous avons besoin de combattants immédiatement !"
 UKR_start_war_against_russia: "Guerre russo-ukrainienne"
 UKR_start_war_against_russia_desc: "Le moment décisif de notre État est arrivé. Nous repousserons l'ennemi ou nous disparaîtrons de l'histoire mondiale."
 UKR_hur_expanded: "Élargir l'influence du HUR"
 UKR_hur_expanded_desc: "Nous élargirons les pouvoirs du HUR ; la situation l'exige, la guerre l'exige !"
 UKR_tro_expanded: "Renforcer la défense territoriale"
 UKR_tro_expanded_desc: "Nous élargirons en urgence le recrutement pour la défense territoriale ; nous avons besoin de combattants immédiatement !"
 UKR_tck: "Mobilisation de masse"
 UKR_tck_desc: "We will have to start mass mobilization, because this is literally a war for the existence of our state."
 UKR_other_battaions_hur: "Nouveaux bataillons du HUR"
 UKR_other_battaions_hur_desc: "HUR is actively recruiting fighters into its battalions, some of them are already ready to join the battle."
 UKR_free_russia_legion: "Légion pour la liberté de la Russie"
 UKR_free_russia_legion_desc: "Real Russian patriots are ready to fight for us and overthrow the tyranny that hangs over Russia."
 UKR_rdk: "Corps des volontaires russes"
 UKR_rdk_desc: "Russian nationalists who do not agree with Russia's policy have self-organized under our command into the Russian volunteer corps."
 UKR_republican_army: "Armée nationale républicaine"
 UKR_republican_army_desc: "Fugitive deputies from Russia have created a national Republican Army, which will conduct active guerrilla activities against the regime."
 UKR_separatist_battalions: "Attirer les bataillons séparatistes"
 UKR_separatist_battalions_desc: "Not only Russians, but also other nations are ready to fight for freedom from Russian imperialism."
 UKR_drone_army: "L'armée des drones"
 UKR_drone_army_desc: "We will start mass production of drones. The country needs thousands of drones."
 UKR_tck_mobka: "Mobilisation totale"
 UKR_tck_mobka_desc: "We are forced to carry out several waves of mobilization to replenish our armed forces."
 UKR_attack_guardia: "La garde offensive"
 UKR_attack_guardia_desc: "Nous sommes prêts à passer de la défense à l'attaque ! La garde offensive pour vaincre l'ennemi !"
 UKR_inter_legion_idea: "Légion internationale"
 UKR_inter_legion_idea_desc: "Many foreigners from all over the world are ready to support us in our struggle for independence."
 UKR_air_superior_idea: "Tactiques de domination aérienne"
 UKR_air_superior_idea_desc: "We strive to gain air superiority."
 UKR_hur_other_battalions_created_tt: "De §YNouveaux bataillons du HUR§! seront créés."
 UKR_free_russia_created_tt: "La §YLégion pour la liberté de la Russie§! sera disponible pour des opérations spéciales limitées."
 UKR_rdk_created_tt: "Le §YCorps des volontaires russes§! sera disponible pour des opérations spéciales limitées."
 UKR_republican_army_created_tt: "Les §YBataillons séparatistes régionaux§! deviendront disponibles pour des opérations spéciales."
 UKR_free_poland_created_tt: "La §YLégion pour la liberté de la Pologne§! sera disponible pour des opérations spéciales limitées."
 UKR_rushenie_created_tt: "Le §YBataillon Pospolite Ruszenie§! sera disponible pour des opérations spéciales limitées."
 UKR_rokossovski_created_tt: "Le §YBataillon Rokossovsky§! sera disponible pour des opérations spéciales limitées."
 UKR_hetmanat_created_tt: "Le §YBataillon de l'Hetmanat polonais§! sera disponible pour des opérations spéciales limitées."
 UKR_polish_army_created_tt: "L'§YArmée de libération polonaise§! sera disponible pour des opérations spéciales limitées."
 ukraine_kolom.1.t: "Kolomoïsky annonce la création de la République"
 ukraine_kolom.1.d: "Igor Kolomoisky, one of the richest oligarchs in Ukraine, announced the creation of the Dnipropetrovsk Republic as an autonomy within Ukraine.  This has caused a shock to our government and now we have to decide what to do about it."
 ukraine_kolom.1.a: "Pas d'autonomie"
 ukraine_kolom.1.b: "Cela pourrait être bénéfique pour nous"
 ukraine_kolom.2.t: "Notre armée"
 ukraine_kolom.2.d: "Those units that we personally funded have sided with us, now they are our main striking force."
 ukraine_kolom.2.a: "Pour la liberté du Dniepr !"
 UKR_recruit_arestovich: "Recruter Arestovitch"
 UKR_recruit_arestovich_desc: "Arestovich will become an excellent agent of our special services, his outstanding skills will be useful to us."
 UKR_korchinsky_strategy: "Stratégie de Kortchinsky"
 UKR_korchinsky_strategy_desc: "Korchinsky's strategy involves fighting Western elements as well...The fight against the external enemy that really threatens the sovereignty of Ukraine."
 UKR_psiop_operations: "Opérations psychologiques"
 UKR_psiop_operations_desc: "We have mastered the technique of psychological operations, and we are ready to use it against our enemies."
 UKR_bratstvo_psiop_idea: "Opérations psychologiques"
 UKR_bratstvo_psiop_idea_desc: "The enemy must also be broken mentally, for this we will conduct psyop operations."
 UKR_vitrenko_party: "Le nouveau socialisme"
 UKR_vitrenko_party_desc: "L'Ukraine est depuis longtemps sous l'emprise de sentiments nationalistes et pro-occidentaux qui déchirent le pays en deux ; nous offrirons à nos citoyens ce qu'ils recherchent : la stabilité et la prospérité. Notre socialisme les rendra heureux."
 UKR_economic_orthodoxy: "Orthodoxie économique"
 UKR_economic_orthodoxy_desc: "Notre pays doit être fort non seulement économiquement, mais aussi spirituellement ; pourquoi ne pas combiner ces deux aspects ?"
 UKR_install_christian_socialism: "Socialisme chrétien"
 UKR_install_christian_socialism_desc: "We will not give up our socialist ideas, because we continue to believe in God, the ideologists of socialism led it to collapse because they distanced themselves from God, we will not repeat their mistakes."
 UKR_iron_woman: "Une femme d'acier"
 UKR_iron_woman_desc: "Natalia Vitrenko, like steel, protects the ideas that she sees as the only right ones for Ukraine and is not going to bend to anyone."
 UKR_resovetization: "Re-soviétisation"
 UKR_resovetization_desc: "The Soviet era gave our country a development that it did not see under any government, not under the Tsar, not under the Poles, not under independence. We accept this fact and will promote the cult of Socialism."
 UKR_rally_out_the_coalition: "Coalition nationale"
 UKR_rally_out_the_coalition_desc: "Supporters of completely different ideas, national Bolsheviks, supporters of the Russian Empire, socialism and Russophiles have united under the banners of our party, all together - we will turn our country into the best state in history."
 UKR_praymaya_electro_demokratia: "Démocratie électronique directe"
 UKR_praymaya_electro_demokratia_desc: "We have had enough of dictatorship and totalitarianism, our people deserve democracy at its best."
 UKR_storm_sturm_at_parliament: "Prendre d'assaut le Parlement"
 UKR_storm_sturm_at_parliament_desc: "We will get rid of those who sabotage our activities in our government agencies."
 UKR_befriend_russia_vit: "Partenariat avec la Russie"
 UKR_befriend_russia_vit_desc: "Historically, we are connected with Russia and will always be connected with it - our partnership with Russia is something that should be obvious as the sunrise."
 UKR_apply_to_union_state: "Annoncez votre désir de rejoindre l'État de l'Union"
 UKR_apply_to_union_state_desc: "The Union State is one of the first and most important stages of the unity of our united people, we intend to become part of this project."
 UKR_honor_russian_empire: "Respecter l'héritage de l'Empire russe"
 UKR_honor_russian_empire_desc: "The Russian Empire was a great power and it would be stupid and unfair to deny its achievements, we remember the greatness of the Romanovs."
 UKR_free_healthcare: "Soins de santé gratuits"
 UKR_free_healthcare_desc: "Nous rétablirons la pratique soviétique des soins de santé gratuits ; les citoyens doivent être en bonne santé !"
 UKR_national_bolshevist_rhetoric: "Rhétorique nationale-bolchevique"
 UKR_national_bolshevist_rhetoric_desc: "Our party also borrows many things from the program of the National Bolsheviks, with which we unanimously agree."
 UKR_russo_ukrainian_nationalism: "Nationalisme russo-ukrainien"
 UKR_russo_ukrainian_nationalism_desc: "Our peoples must always rise up and remember their greatness, we will actively support the nationalist movements of our countries."
 UKR_naz_pioners: "Pionniers nationaux"
 UKR_naz_pioners_desc: "The pioneer was a great idea of the Soviet leadership, we will revive it, but with our special specifics."
 UKR_calm_ruthenia: "Se déclarer héritiers de la Ruthénie"
 UKR_calm_ruthenia_desc: "We believe that the legacy of Ancient Ruthenia should also not be forgotten! We will remind everyone that Ruthenia existed on these lands."
 UKR_proclaim_rus_ukraine: "Annoncer la renaissance de la Ruthénie"
 UKR_proclaim_rus_ukraine_desc: "La Ruthénie renaît ! C'est aujourd'hui, ici, sur les terres d'Ukraine !"
 UKR_federalize_galicia_and_zakarpat: "Fédéralisation de la Galicie"
 UKR_federalize_galicia_and_zakarpat_desc: "It's time to resolve the separatist issue in Galicia, only Federalization will save us."
 UKR_lnr_dnr_peace_integrate: "Fédéralisation de l'Ukraine orientale"
 UKR_lnr_dnr_peace_integrate_desc: "The mistakes committed by the previous government, now we must decide. We are ready for a federalization project to end the division of our country."
 UKR_suppress_western_and_bander: "Réprimer l'influence occidentale"
 UKR_suppress_western_and_bander_desc: "The influence of the West should be purposefully weakened in our country."
 UKR_restore_russian_church: "Retour à l'Église russe"
 UKR_restore_russian_church_desc: "Autocephaly was a mistake, we have spiritually distanced ourselves from our brothers, and we do not intend to repeat such a mistake anymore."
 UKR_no_to_upc: "Dissoudre l'Église orthodoxe ukrainienne"
 UKR_no_to_upc_desc: "Heretics must be disbanded."
 UKR_clear_out_pcu: "Nettoyer l'Église"
 UKR_clear_out_pcu_desc: "The supporters of Autocephaly and all their sympathizers must be brought under our control."
 UKR_restore_apostolacy: "Le retour de l'Église orthodoxe russe"
 UKR_restore_apostolacy_desc: "L'Église orthodoxe russe domine à nouveau notre terre !"
 UKR_full_socialism: "Accent sur le socialisme"
 UKR_full_socialism_desc: "Nous plongerons encore plus profondément dans les doctrines du socialisme et continuerons à les mettre en œuvre dans notre pays."
 UKR_install_true_soviet_folk: "Socialisme populaire"
 UKR_install_true_soviet_folk_desc: "Nous ferons tout pour que nos citoyens se sentent heureux."
 UKR_appease_pro_russian_oligarchs: "Coopérer avec les oligarques pro-russes"
 UKR_appease_pro_russian_oligarchs_desc: "Nous sommes prêts à établir une coopération avec l'oligarchie pro-russe, car leurs investissements renforceront notre économie."
 UKR_loyalist_oligarchy_ens: "Accepter les oligarques loyaux"
 UKR_loyalist_oligarchy_ens_desc: "Les oligarques loyaux se tiendront également à nos côtés, sécurisant ainsi leurs finances à l'intérieur du pays."
 UKR_industrial_revival: "Renaissance industrielle"
 UKR_industrial_revival_desc: "Notre pays a été privé de sa puissance industrielle après l'effondrement de l'URSS ; il est temps de la relancer."
 UKR_national_feminism: "Féminisme national"
 UKR_national_feminism_desc: "Les femmes doivent également devenir le moteur de la croissance de notre pays, et nous encouragerons leur participation dans toutes les industries."
 UKR_foreign_policy_det: "Notre orientation en politique étrangère"
 UKR_foreign_policy_det_desc: "Notre pays doit décider lui-même de la voie qu'il suivra en politique étrangère."
 UKR_fully_antagonize_the_west: "Antagonisme envers l'Ouest"
 UKR_fully_antagonize_the_west_desc: "Nous n'avons pas l'intention d'être amis avec l'Ouest, car nous savons que l'Ouest n'a pas d'amis, seulement des esclaves et des serviteurs."
 UKR_ukr_sov_mil_coop: "Coopération militaire avec la Russie"
 UKR_ukr_sov_mil_coop_desc: "Nous mènerons une série d'exercices militaires avec l'armée russe."
 UKR_euroscepticism_campaign: "Euroscepticisme puissant"
 UKR_euroscepticism_campaign_desc: "Nous avons été et resterons eurosceptiques."
 UKR_join_csto: "Rejoindre l'OTSC"
 UKR_join_csto_desc: "Nous sommes prêts à signer un document pour rejoindre l'Organisation du Traité de sécurité collective ; seule la Russie peut nous offrir des garanties de sécurité."
 UKR_reconcile_with_west: "Améliorer les interactions avec l'Ouest"
 UKR_reconcile_with_west_desc: "Nous avons l'intention d'améliorer la coopération avec les pays occidentaux."
 UKR_nato_ukr_train: "Exercices avec les pays de l'OTAN"
 UKR_nato_ukr_train_desc: "Nous promouvrons partiellement la doctrine de l'OTAN dans nos forces armées et mènerons également une série d'exercices avec eux."
 UKR_join_nato_with_russia: "Rejoindre l'OTAN avec la Russie"
 UKR_join_nato_with_russia_desc: "Nous avons l'intention de rejoindre l'OTAN, mais uniquement avec la Russie, et nous proposerons cette idée au gouvernement russe."
 UKR_full_nazbol_transition: "Renaissance nationale-bolchevique"
 UKR_full_nazbol_transition_desc: "Le moment est venu pour la prochaine étape du développement de notre pays et de toute la famille slave en général. Nous nous engageons sur la voie de l'unité des Slaves."
 UKR_serbia_unify: "La révolution nationale-bolchevique en [SER.GetName]"
 UKR_serbia_unify_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_bulgaria_unification: "La révolution nationale-bolchevique en [BUL.GetName]"
 UKR_bulgaria_unification_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_unification_with_belarus: "La révolution nationale-bolchevique en [BLR.GetName]"
 UKR_unification_with_belarus_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_poland_unification: "La révolution nationale-bolchevique en [POL.GetName]"
 UKR_poland_unification_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_demand_bosnia: "La révolution nationale-bolchevique en [BOS.GetName]"
 UKR_demand_bosnia_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_czech_unification: "La révolution nationale-bolchevique en [CZE.GetName]"
 UKR_czech_unification_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_demand_croatia_slovenia: "La révolution nationale-bolchevique en [CRO.GetName]"
 UKR_demand_croatia_slovenia_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_slovakia_unify: "La révolution nationale-bolchevique en [SLO.GetName]"
 UKR_slovakia_unify_desc: "Our brothers will finally be freed from the government that oppressed them as a Slavic nation!"
 UKR_propose_full_union_state: "Véritable État de l'Union"
 UKR_propose_full_union_state_desc: "Il est temps que la Russie et notre pays deviennent un véritable État de l'Union !"
 UKR_pan_slavic_ssr: "Union des Républiques slaves"
 UKR_pan_slavic_ssr_desc: "Enfin, tous les Slaves ne feront qu'un !"
 UKR_vetrenko_surrort_nationalism: "Nationalisme russo-ukrainien"
 UKR_vetrenko_inner_idea: "Politique intérieure"
 UKR_vetrenko_inner_idea_desc: "We are ready to pursue a policy of independence from the West and a strong Ukraine, we have had enough of the dictatorship of Western capital."
 UKR_vetrenko_christian_socialism: "Socialisme chrétien"
 UKR_vetrenko_christian_socialism_desc: "God and Socialism go hand in hand in Ukraine."
 UKR_vetrenko_west_idea: "Doctrine anti-occidentale"
 UKR_vetrenko_west_idea_desc: "We do not hide the fact that the West is our ideological and direct enemy."
 UKR_vetrenko_pioneria: "Pionnier national"
 UKR_vetrenko_women_idea: "Féminisme national"
 UKR_vetrenko_women_idea_desc: "The women of Ukraine will build a great state hand in hand with men."
 UKR_vetrenko_iron_woman: "Femme de fer ukrainienne"
 UKR_vetrenko_iron_woman_desc: "Vitrenko became our equivalent of Margaret Thatcher."
 UKR_vetrenko_health_free_idea: "Soins de santé gratuits"
 ukraine_nazbol.1.t: "Lancer une invasion de [FROM.GetName] ?"
 ukraine_nazbol.1.d: "We were able to raise an uprising in this country, but now we need to decide whether we are ready to bring it to an end and admit that the revolution is our doing."
 ukraine_nazbol.1.a: "Oui"
 ukraine_nazbol.1.b: "Non"
 ukraine_nazbol.2.t: ""
 ukraine_nazbol.2.d: ""
 ukraine_nazbol.2.a: ""
 ukraine_nazbol.3.t: "La révolution nationale-bolchevique !"
 ukraine_nazbol.3.d: "Unexpectedly for us, a revolution took place in our country under the banner of the national Bolsheviks! We urgently raised the army and all armed forces to fight the separatists. We know that they are controlled by [UKR.GetName] and intend to deal with this in the future."
 ukraine_nazbol.3.a: "Soudainement"
 ukraine_nazbol.4.t: "[FROM.GetName] célèbre l'héritage de l'Empire russe"
 ukraine_nazbol.4.d: "The government of Ukraine directly at the state level announces the glorification of the past and heritage of the Russian Empire, we should respond to this gesture in any way."
 ukraine_nazbol.4.a: "Nous en sommes également fiers"
 ukraine_nazbol.4.b: "Nous en discutons"
 ukraine_nazbol.5.t: "[FROM.GetName] se tient solidaire de nous"
 ukraine_nazbol.5.d: "[FROM.GetName] stands in solidarity with us on the issue of the legacy of the Russian Empire and is ready to support us at the diplomatic level on this issue."
 ukraine_nazbol.5.a: "C'est formidable !"
 ukraine_nazbol.6.t: "[FROM.GetName] nous condamne"
 ukraine_nazbol.6.d: "[FROM.GetName] condemns the fact that we do not condemn Imperial ambitions, never an undemocratic State, The New Russia will always profess the ideals of peaceful cooperation and not expansion."
 ukraine_nazbol.6.a: "Lâches"
 UKR_vitrenko_power: "Vitrenko devient nationale-bolchevique"
 anti_westi: "Détracteur de l'Occident"
 UKR_donbass_rise: "Le soulèvement dans le sud-est a eu lieu"
 UKR_yushenko_premier_idea: "Le gouvernement Iouchtchenko"
 UKR_yanuk_premier_idea: "Le gouvernement Ianoukovitch"
 UKR_hur_reform: "Réforme du HUR"
 UKR_hur_reform_desc: "It is time to begin reforms of our Main Intelligence Agency to increase efficiency and influence opportunities in other countries."
 UKR_hur_opearational_support: "Soutien opérationnel du HUR"
 UKR_hur_opearational_support_desc: "Le HUR soutient actuellement les opérations en cours avec des renseignements et en déployant ses unités sur la ligne de front."
 UKR_hur: "Direction principale du renseignement"
 UKR_hur_desc: "The HUR has a wide range of powers and capabilities that we will be able to implement in our foreign policy."
 UKR_hur_battalions: "Bataillons du HUR d'Ukraine"
 UKR_hur_battalions_desc: "The battalions of the HUR of Ukraine are participating in hostilities on the orders of the Ukrainian command on our side, after the end of hostilities, they will leave our armed forces."
 UKR_hur_decision_category: "La principale agence de renseignement"
 UKR_hur_decision_category_desc: "\n\n\n\n\n\n£UKR_desctext_hur\n\n\n\n\n\n\n\n\nLa Direction principale du renseignement du ministère de la Défense de l'Ukraine est le service de renseignement militaire du gouvernement ukrainien. C'est un département du ministère de la Défense, et non de l'état-major général des Forces armées d'Ukraine. Grâce à ce ministère, nous pourrons mener diverses opérations de sabotage dans les pays voisins et effectuer des sorties avec l'aide d'un bataillon de sabotage.\n\n\n\nNombre actuel de points opérationnels du HUR : [?hur_points]"
