 gcc.20.d10: "걸프 협력 회의의 다른 회원국들이 소집한 비밀 회의 끝에 [MOR.GetNameDef]이(가) 기구에서 제명되었습니다. GCC 잔여 회원국들은 [MOR.GetNameDef]의 \\"정치적 불안정\\"을 결정의 이유로 들었습니다. [MOR.GetLeader]은(는) 이를 [MOR.GetNameDef]의 정치 이념 확산을 저지하려는 다른 걸프 국가들의 음모를 보여 주는 또 하나의 증거라며 격렬히 반발했습니다."
 gcc.20.d11: "걸프 협력 회의의 다른 회원국들이 소집한 비밀 회담 끝에 [YEM.GetNameDef]이(가) 기구에서 제명되었습니다. 걸프 협력 회의의 잔류 회원국들은 결정의 이유로 [YEM.GetNameDef]의 \\"정치적 불안정\\"을 들었습니다. [YEM.GetLeader]은(는) 분노하며 반응했고, 이번 사태가 [YEM.GetNameDef]의 정치 이념 확산을 저지하려는 다른 걸프 국가들의 음모를 보여 주는 또 하나의 증거라고 주장했습니다."
 gcc.20.a: "아라비아의 걸프 만에 먹구름이 드리워지고 있다."
 gcc.21.t: "[FROM.GetNameDef] Joins Gulf Cooperation Council"
 gcc.21.d: "오랜 가입 절차를 거쳐, [FROM.GetNameDef]이(가) [SAU.GetNameDef], [BHR.GetNameDef], [KUW.GetNameDef], [OMA.GetNameDef], [QAT.GetNameDef], [UAE.GetNameDef]이(가) 창설한 지역 기구인 걸프 협력 회의의 회원국 지위를 확보하는 데 성공했습니다. 이는 오랫동안 신규 회원국 수용을 경계해 온 걸프 협력 회의의 상당한 확장을 의미합니다. [FROM.GetNameDef]은(는) 이제 걸프 협력 회의 회원국 자격이 부여하는 각종 경제적, 정치적, 군사적 혜택을 누릴 수 있게 될 것입니다."
 gcc.21.a: "걸프협력회의는 더욱 강해지고 있다..."
 gcc.22.t: "The [FROM.GetAdjective]s Demand Group Arms Sale To GCC"
 gcc.22.d: "걸프 협력 회의는 역사적으로 [ROOT.GetAdjective] 정부와 보조를 맞추어 왔으며, 따라서 아랍 세계에서 중요한 [ROOT.GetAdjective] 동맹입니다. [FROM.GetAdjective] 측은 진영 차원의 무기 판매를 걸프 협력 회의에 허용하면 회원국들에 절실히 필요한 무기를 제공하고 군 상호운용성을 높여 공동의 적에 맞서 방어하는 데 도움이 될 것이라고 주장했습니다."
 gcc.22.a: "소총을 지급하자."
 gcc.22.b: "우리에게 필요한 것들이다."
 gcc.23.t: "[FROM.GetNameDef] Finalizes GCC Group Arms Sale"
 gcc.23.d: "Following up on a request by member states of the Gulf Cooperation Council, the [FROM.GetAdjective] government has approved a bloc arms sale to the organization as a whole. This move has been touted as a signal of the GCC's growing unity, as in the past the various militaries of the GCC were unintegrated and uncoordinated, a phenomenon which was exacerbated by their procurement of arms from different suppliers. [FROM.GetLeader] has expressed hope that this sale would help the GCC to combat shared threats in the Middle East more effectively. The Arab Gulf states that make up the GCC, for their part, have expressed delight at the success of this deal."
 gcc.24.t: "[FROM.GetNameDef] is Pressuring Us to Support New GCC Member"
 gcc.24.d: "[pressured_to_accept]은(는) 현재 걸프 협력 회의 가입을 추진 중이며, [FROM.GetNameDef]이(가) 이를 지지하고 있습니다. 우리도 [pressured_to_accept]의 노력을 지지할지 고려해야 합니다."
 gcc.24.a: "이 국가는 회원국이 될 자격이 충분하다!"
 gcc.24.b: "우리는 이 국가를 회원국으로써 지지하는 것을 거부한다!"
 gcc.25.t: "GCC Formally Extends Invitation to [FROM.GetNameDef]"
 gcc.25.d: "[BHR.GetNameDef], [KUW.GetNameDef], [OMA.GetNameDef], [QAT.GetNameDef], [SAU.GetNameDef], [UAE.GetNameDef]의 여섯 창립 회원국으로 한정되어 있던 걸프 협력 회의가 새로운 회원국을 받아들이기로 했습니다. 걸프 협력 회의 사무총장은 오늘 [FROM.GetNameDef]이(가) 일정한 경제적 요건을 충족하면 회원국 가입으로 이어지는 가입 절차를 시작하도록 공식 초청되었다고 발표했습니다. 보도에 따르면 [FROM.GetNameDef]은(는) 1인당 GDP 10,000달러를 달성하여 발전의 진전을 입증해야 합니다. 현 걸프 협력 회의 회원국들은 [FROM.GetNameDef]의 경제에 투자하여 이 목표 달성을 돕겠다고 약속했습니다."
 gcc.25.a: "연합은 더욱 커지고 있다..."
 gcc.26.t: "[FROM.GetNameDef] Offers to Host Joint GCC Exercises"
 gcc.26.d: "[FROM.GetNameDef] 대표단이 외부 위협에 대한 경계를 돕기 위해 걸프 협력 회의 회원국 간 합동 훈련을 제안했습니다. 이는 [ROOT.GetAdjective] 병력이 유용한 경험을 쌓을 수 있는 기회가 될 수 있습니다."
 gcc.26.a: "우리 군은 훈련에 감사할 것이다!"
 gcc.26.b: "우린 참여를 거부한다!"
 peace_plan.1.t: "[FROM.GetNameDef], 중동 평화 계획 제안"
 peace_plan.1.d: "오슬로 협정이 이루지 못한 것을 달성하겠다는 취지로, [FROM.GetLeader]이(가) 이스라엘 민족과 팔레스타인 민족 사이의 지속적인 평화를 확보하기 위한 새로운 구상을 발표했습니다. 계획의 세부 사항은 아직 공개되지 않았으나, [ISR.GetAdjective] 지도부는 이미 [FROM.GetAdjective]이(가) 중재하는 평화에 대해 잠정적인 지지를 밝혔습니다. 이번 새 구상이 다룰 가능성이 큰 쟁점으로는 팔레스타인인의 귀환권, 서안 지구의 이스라엘 정착촌, 예루살렘의 지위, 팔레스타인 국가 수립이 있습니다."
 peace_plan.1.d1: "오슬로 협정이 이루지 못한 것을 달성하겠다는 취지로, [FROM.GetLeader]이(가) 이스라엘 민족과 팔레스타인 민족 사이의 지속적인 평화를 확보하기 위한 새로운 구상을 발표했습니다. 계획의 세부 사항은 아직 공개되지 않았으나, [PAL.GetAdjective] 지도부는 이미 [FROM.GetAdjective]이(가) 중재하는 평화에 대해 잠정적인 지지를 밝혔습니다. 이번 새 구상이 다룰 가능성이 큰 쟁점으로는 팔레스타인인의 귀환권, 서안 지구의 이스라엘 정착촌, 예루살렘의 지위, 팔레스타인 국가 수립이 있습니다."
 peace_plan.1.a: "또 실패할 평화 협상이라니..."
 peace_plan.2.t: "첫 번째 쟁점: 귀환권"
 peace_plan.2.d: "1948년 아랍-이스라엘 전쟁은 팔레스타인인들이 '알 나크바', 곧 대재앙이라고 부르는 결과를 낳았습니다. 이 사건으로 팔레스타인 주민 다수가 이스라엘 통제 지역에서 대거 빠져나왔고, 인접 아랍 국가들에 대규모 난민촌이 세워지게 되었습니다. 이들 난민은 불안정한 삶을 이어 가고 있으며, 많은 정부가 팔레스타인 난민에게 시민권을 부여하지 않은 탓에 흔히 노동권과 공공 서비스 이용권마저 박탈당하고 있습니다. 난민들은 1948년 이전 자기 가족이 소유했던 집으로 돌아가기를 갈망하지만, 이들이 소유했던 땅의 상당 부분에 현재 이스라엘인들이 거주하고 있어 해결하기 어려운 문제가 되고 있습니다.\n\n팔레스타인인의 귀환권을 지지하기로 한다면, 이스라엘은 잠재적으로 수백만 명에 이르는 난민이 이스라엘 관할 영토로 돌아오는 것을 받아들여야 합니다. 지지하지 않기로 한다면, 대신 팔레스타인 난민을 아랍 수용국에 통합하거나 서안 지구에 정착시키는 데 대한 금전적 보상과 지원을 제안할 수 있습니다."
 peace_plan.2.a: "귀환권을 지지해야 한다."
 peace_plan.2.b: "귀환권을 지지해서는 안 된다."
 peace_plan.3.t: "두 번째 쟁점: 서안 지구 정착촌"
 peace_plan.3.d: "1967년 6일 전쟁에서 이스라엘이 승리하여 요르단으로부터 서안 지구를 장악한 직후, 헤브론의 한 호텔에 머물던 시온주의 활동가들이 퇴거를 거부했습니다. 이스라엘 정부는 이 활동가들과 타협하고자 서안 지구에 최초의 유대인 정착촌을 세웠고, 이로써 팔레스타인 목동들은 그 땅을 계속 사용할 수 없게 되었습니다. 이 사건은 오늘날까지 이어지는 추세의 시작이 되어 100곳이 넘는 정착촌이 건설되었으며, 팔레스타인 주민의 분노는 갈수록 커지고 있습니다.\n\n제안된 해결책 중 하나는 이스라엘이 팔레스타인에 일부 영토를 내주는 대가로 정착촌이 있는 땅을 이스라엘 영토에 포함시키는 것입니다. 그러나 교환할 땅의 정확한 비율은 여전히 논쟁 중입니다."
 peace_plan.3.a: "정착촌은 철거되어야 한다."
 peace_plan.3.b: "정착촌은 유지하되, 영토 교환에서 이스라엘이 우대받아야 한다."
 peace_plan.3.c: "정착촌은 유지하되, 영토 교환에서 팔레스타인이 우대받아야 한다."
 peace_plan.4.t: "세 번째 쟁점: 예루살렘의 운명"
 peace_plan.4.d: "예루살렘은 이슬람교, 유대교, 기독교 모두에 막대한 영적 의미를 지닌 도시입니다. 따라서 그 지위는 극히 민감한 문제였으며, 이스라엘은 도시 전체에 대한 통제를 유지하기를 원하는 반면 팔레스타인은 동예루살렘을 독립 팔레스타인 국가의 수도로 삼아야 한다고 주장해 왔습니다. 예루살렘에 대해 이스라엘 또는 팔레스타인의 입장 중 하나를 지지하는 것 외에도, 국제연합이 원래 구상했던 대로 도시를 국제화하여 양국 모두의 손에서 벗어나게 하는 선택지도 있습니다."
 peace_plan.4.a: "팔레스타인이 도시를 가져야 한다."
 peace_plan.4.b: "이스라엘이 도시를 유지해야 한다."
 peace_plan.4.c: "예루살렘은 국제화되어야 한다."
 peace_plan.5.t: "네 번째 쟁점: 팔레스타인 국가 수립"
 peace_plan.5.d: "이스라엘은 독립 팔레스타인 국가가 이스라엘에 안보 위협이 될 수 있다는 이유로 역사적으로 그 수립에 반대해 왔습니다. 대신 이스라엘은 비무장 상태이며 부분적으로만 자치를 누리고 이스라엘이 주권을 보유하는 팔레스타인 실체의 수립을 선호해 왔습니다. 반면 팔레스타인은 1967년 이전 국경에 따라 서안 지구와 가자 지구에 완전한 독립 국가를 세울 것을 추구해 왔습니다."
 peace_plan.5.a: "팔레스타인은 국가를 가져야 한다."
 peace_plan.5.b: "팔레스타인의 주권은 제한되어야 한다."
 peace_plan.6.t: "[FROM.GetAdjective] 평화안 발표!"
 peace_plan.6.d: "[FROM.GetAdjective]의 제안이 서안 지구의 이스라엘 정착촌, 팔레스타인 국가 수립, 팔레스타인인의 귀환권, 예루살렘의 지위라는 핵심 쟁점에서 우리의 우려를 해소하는지 검토해야 합니다."
 peace_plan.6.a: "이 합의는 우리가 받아들일 수 있다."
 peace_plan.6.b: "이런 합의에 우리가 동의하리라고 기대해서는 안 된다!"
 peace_plan.7.t: "이스라엘과 팔레스타인 자치정부, 역사적인 평화 협정 체결"
 peace_plan.7.d: "[FROM.GetNameDef]이(가) 중재한 평화안을 이스라엘과 팔레스타인 자치정부 대표단이 수락함으로써 이스라엘-팔레스타인 관계가 전환점을 맞았습니다. 양측의 일부 반대파는 이 합의를 비판했으나, 양측 주민 다수가 수용했기 때문에 이들 반대파가 합의를 깨뜨리려 시도할 가능성은 비교적 낮다고 분석가들은 결론짓고 있습니다. 세계 각국 지도자들은 이번 성과에 긍정적으로 반응하면서도, 합의 조항을 이행해야 하므로 평화 프로세스는 아직 완성과 거리가 멀다고 경고했습니다. [FROM.GetLeader]은(는) 신중을 당부하는 이러한 발언에 대해 평화가 아직 달성되지 않았음을 인정하면서도, 이스라엘과 팔레스타인 양측이 보여 준 평화에 대한 헌신의 수준이 전례 없는 것임을 강조하고자 했습니다."
 peace_plan.7.a: "역사적인 순간이다!"
 peace_plan.8.t: "[FROM.GetNameDef], 평화 협정 거부"
 peace_plan.8.d: "[FROM.GetAdjective] 대표단은 우리의 평화안이 상대측에 지나치게 편향되어 있다고 판단하여 이를 거부했습니다."
 peace_plan.8.a: "우리의 구상은 실패했다..."
 uae_royal.1.t: "셰이크 자이드의 죽음"
 uae_royal.1.d1: "오늘, 아랍에미리트와 많은 무슬림 세계는 아픈 UAE의 대통령, 셰이크 자이드 빈 술탄 알 나흐얀의 별세로 애도하고 있습니다. 셰이크 자이드는 UAE에서 나라의 창립 아버지로 숭배받고 있으며, 한때 분열되었던 에미리트를 통합한 역할로 그 명성을 떨쳤습니다. 또한, 셰이크 자이드는 UAE와 사우디 아라비아 및 서방과의 동맹을 확고히 했으며, 국가를 테러와의 전쟁에 헌신하게 만들었고, 유엔 평화유지 작전에서 에미리트의 역할을 증대시킨 인물로 평가받고 있습니다. 셰이크 자이드의 후임으로 UAE 대통령과 아부다비 에미르직은 그의 아들, 칼리파 빈 자이드 알 나흐얀이 맡게 되었습니다."
 uae_royal.1.d2: "아랍에미리트와 이슬람권의 상당수는 오늘 애도에 잠겼습니다. 투병 중이던 아랍에미리트의 전 대통령 셰이크 자이드 빈 술탄 알 나하얀이 세상을 떠났기 때문입니다. 셰이크 자이드는 분열되어 있던 토후국들을 통합한 공로로 아랍에미리트에서 건국의 아버지로 추앙받고 있습니다. 그의 통치 말기 몇 년 동안 과거의 절대군주제는 권력이 선출된 지도자에게 부여되는 입헌군주제로 바뀌었습니다. 그럼에도 셰이크 자이드의 죽음을 애도하는 아랍에미리트 전역의 물결은, 이른바 \\"국부\\"가 에미라티들에게 여전히 중요한 존재임을 보여 줍니다."
 uae_royal.1.d3: "아랍에미리트와 이슬람권의 상당수는 오늘 애도에 잠겼습니다. 투병 중이던 아랍에미리트의 전 대통령 셰이크 자이드 빈 술탄 알 나하얀이 세상을 떠났기 때문입니다. 셰이크 자이드는 분열되어 있던 토후국들을 통합한 공로로 아랍에미리트에서 건국의 아버지로 추앙받고 있습니다. 그의 통치는 왕실을 권좌에서 몰아내고 절대군주제를 현재의 [UAE.GetNameDef]으로 대체한 급속한 정치 개혁으로 특징지어집니다. 더 이상 공직을 맡고 있지 않았음에도 셰이크 자이드는 상당한 규모의 충성스러운 추종자 집단을 유지했으며, 이들은 그의 죽음을 애도했습니다. 그러나 [UAE.GetNameDef] 주민 대다수는 대체로 무관심한 반응을 보였고, 소수는 셰이크의 서거를 군주제 통치의 공식적 종언이자 연방 공화국 수립으로 가는 중요한 진전으로 보고 공개적으로 환영했습니다."
 uae_royal.1.d4: "투병 중이던 아랍에미리트의 전 대통령 셰이크 자이드 빈 술탄 알 나하얀이 세상을 떠났다는 보도가 나오고 있습니다. 그의 통치 아래에서 알카에다가 나라 전역에 영향력을 넓히자 에미라티 왕실은 자신들이 다스리던 땅을 떠나 도피해야 했습니다. 현재 해외에서 망명 생활을 하는 왕실은 언젠가 자신들이 계속 아랍에미리트라고 부르는 땅으로 돌아가겠다고 맹세했습니다. 셰이크 자이드의 아들 칼리파 빈 자이드 알 나하얀이 망명 정부의 아랍에미리트 대통령으로 공식 지명되었으나, 여전히 군주제에 충성을 맹세하는 이들이 비교적 적어 이 직함이 갖는 권위는 미미합니다."
 uae_royal.1.a: "알 나하얀 가문에게 슬픈 날이다..."
 uae_royal.2.t: "뇌졸중으로 쓰러진 아랍에미리트의 셰이크 칼리파"
 uae_royal.2.d1: "아랍에미리트 대통령이자 아부다비 통치자인 셰이크 칼리파 빈 자이드 알 나하얀이 쇠약하게 만드는 뇌졸중을 겪은 것으로 알려졌습니다. 상태는 안정적이지만 셰이크는 더 이상 일상적인 정무를 수행할 수 없는 것으로 전해집니다. 셰이크의 이복동생이자 아부다비 왕세제인 무함마드 빈 자이드 알 나하얀이 에미라티 국가의 사실상 통제권을 넘겨받은 것으로 알려졌습니다.\n\n서구 분석가들이 MbZ라고 부르는 무함마드 빈 자이드는 비교적 젊은 지도자이지만 경험이 풍부한 인물입니다. 그는 지난 몇 년간 에미라티 경제 개혁에서 적극적인 역할을 했으며, 아랍에미리트군 가운데 가장 권위 있는 두 기관인 에미라티 공군과 아미리 근위대에서 복무하고 지휘한 바 있습니다."
 uae_royal.2.d2: "아랍에미리트의 전 대통령이자 아부다비 토후인 셰이크 칼리파 빈 자이드 알 나하얀이 쇠약하게 만드는 뇌졸중을 겪은 것으로 알려졌습니다. 그의 통치 말기 몇 년 동안 과거의 절대군주제는 권력이 선출된 지도자에게 부여되는 입헌군주제로 바뀌었습니다. 그럼에도 아부다비 토후로서 셰이크 칼리파는 나라 안에서 여전히 상당한 상징적 의미를 유지하고 있습니다."
 uae_royal.2.d3: "아랍에미리트의 전 대통령이자 아부다비 토후인 셰이크 칼리파 빈 자이드 알 나하얀이 쇠약하게 만드는 뇌졸중을 겪은 것으로 알려졌습니다. 그의 통치는 왕실을 권좌에서 몰아내고 절대군주제를 현재의 [UAE.GetNameDef]으로 대체한 급속한 정치 개혁으로 특징지어집니다. 더 이상 공직을 맡고 있지 않지만 셰이크 칼리파는 여전히 상당한 상징적 영향력을 유지하고 있습니다."
 uae_royal.2.d4: "아랍에미리트의 전 대통령이자 아부다비 토후인 셰이크 칼리파 빈 자이드 알 나하얀이 쇠약하게 만드는 뇌졸중을 겪은 것으로 알려졌습니다. 그의 통치 아래에서 알카에다가 나라 전역에 영향력을 넓히자 알 나하얀 가문은 자신들이 다스리던 땅을 떠나 도피해야 했습니다. 현재 해외에서 망명 생활을 하는 왕실은 언젠가 자신들이 계속 아랍에미리트라고 부르는 땅으로 돌아가겠다고 맹세했습니다. 그러나 셰이크의 뇌졸중은 이 염원의 실현에 또 하나의 장애물을 안겼습니다."
 uae_royal.2.a: "셰이크가 속히 회복하기를..."
 kuwait_royal.1.t: "The Death of Jaber Al-Ahmad Al-Sabah"
 kuwait_royal.1.d1: "투병 중이던 쿠웨이트 토후 셰이크 자베르 알아흐마드 알사바가 세상을 떠나 쿠웨이트는 오늘 애도에 잠겼습니다. 셰이크 자베르는 2001년 뇌졸중을 겪은 이후 줄곧 건강이 좋지 않았으며, 쿠웨이트 역사의 격동기를 이끌었습니다. 그의 통치 아래 쿠웨이트는 의회의 해산과 재건, 이라크군의 침공과 점령을 겪었으며, 그동안 셰이크는 사담 군대에 맞선 지하 저항 운동을 지휘했습니다. 셰이크 자베르의 뒤를 이어 이복동생 사바 알아흐마드 알사바가 쿠웨이트 토후에 올랐는데, 이는 왕세제 셰이크 사아드 알살림 알사바의 건강이 좋지 않은 때문입니다."
 kuwait_royal.1.d2: "투병 중이던 쿠웨이트 토후 셰이크 자베르 알아흐마드 알사바가 세상을 떠나 쿠웨이트는 오늘 애도에 잠겼습니다. 셰이크 자베르는 2001년 뇌졸중을 겪은 이후 줄곧 건강이 좋지 않았으며, 쿠웨이트 역사의 격동기를 이끌었습니다. 그의 통치 아래 쿠웨이트는 의회의 해산과 재건, 이라크군의 침공과 점령을 겪었으며, 그동안 셰이크는 사담 군대에 맞선 지하 저항 운동을 지휘했습니다. 더욱이 그의 통치 말기 몇 년 동안에는 비선출 군주제에서 선출된 정치인들에게로 권력이 이양되었습니다."
 kuwait_royal.1.d3: "투병 중이던 쿠웨이트 토후 셰이크 자베르 알아흐마드 알사바가 세상을 떠나 쿠웨이트는 오늘 애도에 잠겼습니다. 셰이크 자베르는 2001년 뇌졸중을 겪은 이후 줄곧 건강이 좋지 않았으며, 쿠웨이트 역사의 격동기를 이끌었습니다. 그의 통치 아래 쿠웨이트는 의회의 해산과 재건, 이라크군의 침공과 점령을 겪었으며, 그동안 셰이크는 사담 군대에 맞선 지하 저항 운동을 지휘했습니다. 그의 통치 후반은 왕실을 권좌에서 몰아내고 군주제를 현재의 [KUW.GetNameDef]으로 대체한 급속한 정치 개혁으로 특징지어집니다. 더 이상 공직을 맡고 있지 않았음에도 셰이크 자베르는 상당한 규모의 충성스러운 추종자 집단을 유지했으며, 이들은 그의 죽음을 애도했습니다."
 kuwait_royal.1.a: "쿠웨이트에게 슬픈 날이다..."
 oman_royal.1.t: "술탄 카부스 빈 사이드 알 사이드의 서거"
 oman_royal.1.d: "1970년부터 오만을 통치해 온 존경받는 술탄이 안타깝게도 세상을 떠났습니다. 술탄 카부스는 오만의 근대화를 이끈 인물로 널리 평가받으며, 전례 없는 발전과 생활 수준 향상, 노예제 폐지, 남부 도파르 지방의 좌파 반란 종식을 이루었습니다. 대외적으로는 오만이 이란, 사우디아라비아, 미국, 영국, 심지어 이스라엘과도 긴밀한 관계를 맺을 수 있게 한, 대단히 성공적인 중립 외교 정책의 설계자로 기억됩니다.\n\n술탄에게는 자녀도 형제도 없었고 후계자를 공개적으로 지명하지도 않았기 때문에, 오만 왕실은 후계자를 집단적으로 결정해야 합니다. 술탄 후보로 가장 유력한 세 사람은 카부스의 삼촌인 사이드 타리크 빈 타이무르 알 사이드의 자녀들입니다. 아사드 빈 타리크는 다른 걸프 국가 지도자들과 관계가 좋은 존경받는 전직 군 지휘관입니다. 시하브 빈 타리크는 몸을 낮추는 전직 해군 지휘관이지만, 과거 정책 문제에서 술탄 카부스와 의견이 다른 것을 두려워하지 않았던 것으로 알려졌습니다. 하이삼 빈 타리크는 오만 상인들이 선호하는 인물이지만 정치 경험이 부족합니다."
 oman_royal.1.a: "아사드를 택한다."
 oman_royal.1.b: "시하브를 택한다."
 oman_royal.1.c: "하이탐과 함께하자."
 SAU.1.t: "[LEB.GetLeader] 사임, 헤즈볼라 규탄에 세계가 충격"
 SAU.1.d: "레바논의 총리인 [LEB.GetLeader]의 [SAU.GetNameDef] 방문은 오늘 그가 이란과 헤즈볼라의 레바논 정치에서의 영향력 증가로 인해 사임한다고 발표하면서 중단되었습니다. 레바논 대통령을 비롯한 여러 정치 인사들은 [SAU.GetNameDef]가 총리를 납치하고 그에게 성명을 발표하고 사임하도록 강요했다고 비난했습니다. 그 결과, [LEB.GetLeader]의 사임은 그의 정부에서 인정되지 않았습니다.\n\n이 사건은 헤즈볼라에 대한 [SAU.GetAdjective]의 적대적인 언어와 맞물려 발생했으며, [SAU.GetAdjective] 외무장관은 헤즈볼라가 [SAU.GetNameDef]에 대한 적대적인 활동을 벌이고 있다고 비난했습니다. 또한 이는 [SAU.GetNameDef]와 [PER.GetNameDef] 간의 몇 달간의 긴장 증가와 함께 발생했으며, [SAU.GetAdjective]의 반응으로서 [PER.GetNameDef]의 중동에서의 영향력 증가에 대한 반응으로 널리 해석되고 있습니다."
 SAU.1.a: "극적인 전개로군."
 SAU_GCC_CRISIS.0.t: "카타르 봉쇄"
 SAU_GCC_CRISIS.0.d: "\"1995년 집권 이후, 하마드 빈 할리파 알사니는 카타르가 사우디아라비아의 부속국에서 지역 영향력을 놓고 사우디와 경쟁하는 존재로 탈바꿈해야만 안전을 확보할 수 있다고 믿었다. 그 결과, 카타르는 이례적으로 적극적인 외교 정책을 추구했으며, 이는 종종 우리의 외교 정책 목표와 충돌해 왔다. 이제 카타르의 부당한 행위를 끝낼 때가 되었다.\""
 SAU_GCC_CRISIS.0.a: "그들은 복종하거나 아니면 끔찍한 고통을 받을 것이다."
 SAU_GCC_CRISIS.0.b: "다시 한번 생각해 보니, 우린 위험을 감수해선 안될 것 같습니다."
 Blockade: "걸프협력회의 봉쇄 작업"
 Blockade_Trade: "걸프협력회의 봉쇄 작업"
 Decline_Blockade: "봉쇄 참여를 거부함"
 Trump_Support_Blockade_QAT: "카타르 봉쇄를 지지함"
 SAU_GCC_CRISIS.1.t: "카타르 봉쇄에 동참하라고 압박하는 [FROM.GetAdjective]"
 SAU_GCC_CRISIS.1.d: "[FROM.GetNameDef]가 카타르에 대한 봉쇄에 동참할 것을 우리에게 압박하고 있습니다. 카타르와의 경제 관계를 유지하는 것이 [FROM.GetNameDef]의 분노를 감수할 만큼 가치 있는지 검토해야 합니다."
 SAU_GCC_CRISIS.1.a: "그들과 함께하자"
 SAU_GCC_CRISIS.1.b: "이건 우리의 싸움이 아니다."
 SAU_GCC_CRISIS.2.t: "봉쇄 지원"
 SAU_GCC_CRISIS.2.d: "[FROM.GetAdjective] 주도의 봉쇄를 지지하는 것은 우리의 걸프 동맹과의 파트너십을 개선하는 데 큰 도움이 될 것입니다. 또한, [FROM.GetNameDef]가 카타르의 외교 정책에 변화를 일으키는 것이 우리의 이익에 부합할 수 있습니다."
 SAU_GCC_CRISIS.2.a: "미국은 봉쇄를 지지한다!"
 SAU_GCC_CRISIS.2.b: "이 사업을 지지할 수 없다."
 SAU_GCC_CRISIS.3.t: "카타르 외교 위기"
 SAU_GCC_CRISIS.3.d.1: "여러 아랍 국가들이 카타르와의 외교 관계를 단절하고 무역 금수를 부과하며 카타르와 [FROM.GetNameDef] 간의 오랫동안 계속된 분쟁이 격화되었습니다. [FROM.GetAdjective]가 이끄는 연합의 요구 사항에는 알자지라 방송국 폐쇄, 이란과의 관계 단절, 카타르 내 터키 군사 기지 폐쇄 등이 포함됩니다."
 SAU_GCC_CRISIS.3.d.2: "여러 아랍 국가들이 카타르와의 외교 관계를 단절하고 무역 금수를 부과하며 카타르와 [FROM.GetNameDef] 간의 오랫동안 계속된 분쟁이 격화되었습니다. [FROM.GetAdjective]가 이끄는 연합의 요구 사항에는 알자지라 방송국 폐쇄와 이란과의 관계 단절 등이 포함됩니다."
 SAU_GCC_CRISIS.3.a: "이러한 요구는 터무니없는 짓이다!"
 SAU_GCC_CRISIS.3.b: "우리는 요구를 받아들여야 한다."
 SAU_GCC_CRISIS.3.c: "흥미롭군"
 SAU_GCC_CRISIS.4.t: "미국을 압박"
 SAU_GCC_CRISIS.4.d: "카타르는 중동에서 가장 큰 미국 군사 기지인 알 우다이드 공군 기지를 보유하고 있습니다. 이는 우리가 미국에 엄청난 압력을 가할 수 있는 능력을 제공하지만, 동시에 미국으로부터 사실상의 안보 보장을 받는 셈이기도 합니다. 미국의 존재가 사라지면 재앙을 초래할 수 있습니다."
 SAU_GCC_CRISIS.4.a: "감수해라"
 SAU_GCC_CRISIS.4.b: "그만한 가치가 없다"
 SAU_GCC_CRISIS.5.t: "카타르의 압박에 대한 미국의 대응"
 SAU_GCC_CRISIS.5.d: "Qatar houses Al Udeid Air Base, the largest American military base in the Middle East. This base is essential not only for the War on Terror but for projecting power in the region as a whole. We must decide whether to keep to our stance and support the blockade or reverse our stance and prioritize our relationship with Qatar."
 SAU_GCC_CRISIS.5.a: "기지는 너무나 중요하다."
 SAU_GCC_CRISIS.5.b: "기지는 필요 없다."
 SAU_GCC_CRISIS.6.t: "미국 국무부 발표"
 SAU_GCC_CRISIS.6.d: "미국 국무부는 예상치 못한 공개 경고를 걸프 국가들에게 전달하며, 카타르와의 외교적 갈등에 대해 언급했습니다. 국무부는 사우디아라비아가 위기를 자초하고, 미국을 잘못된 전제 하에 끌어들였을 가능성이 있다고 제시했습니다. 이 공개적인 비판은 카타르를 봉쇄하는 국가들의 입지를 크게 약화시켰으며, [QAT.GetLeader]에게 필요한 정당성을 크게 강화시켰습니다."
 SAU_GCC_CRISIS.6.a: "미국인들은 자국의 최대 군사 기지가 어디 있는지 기억해 낸 모양이군..."
 SAU_GCC_CRISIS.7.t: "요구에 응답한 카타르"
 SAU_GCC_CRISIS.7.d: "카타르는 봉쇄 연합의 요구를 거부했습니다. 카타르 외무장관은 이 요구들이 카타르의 주권을 침해한다고 말하며, 관계 회복을 위한 조건 목록을 \"비현실적\"이고 \"실행 불가능하다\"고 설명했습니다. 그는 공동 기자 회견에서 \"이것은 테러리즘과 관련된 것이 아니라, 언론의 자유를 억압하려는 것이다\"라고 말했습니다. 봉쇄 연합이 이 거부에 어떻게 대응할지 지켜봐야 할 상황입니다."
 SAU_GCC_CRISIS.7.a: "위기는 계속된다..."
 SAU_GCC_CRISIS.8.t: "요구에 응답한 카타르"
 SAU_GCC_CRISIS.8.d: "카타르는 카타르 정부와 봉쇄 국가들의 대표들 사이에서 오랜 논의 끝에 봉쇄 연합과 합의를 도달했습니다. 그 결과, 카타르는 알자지라 방송 네트워크를 폐쇄하고, 외교 정책을 GCC(걸프 협력 회의) 다른 국가들과 일치시키기로 하였으며, 이로써 카타르의 독립적인 외교 정책 노선이 끝나게 되었습니다."
 SAU_GCC_CRISIS.8.a: "다시 하나가 되었는가?"
 SAU_GCC_CRISIS.9.t: "바레인 봉쇄"
 SAU_GCC_CRISIS.9.d: "[BHR.GetLeader]은(는) 집권 이후 바레인을 우리의 외교 정책에 공공연히 어긋나는 길로 이끌었고, 노골적으로 이란과 긴밀한 관계를 추구해 왔습니다. 바레인의 이러한 행태를 끝낼 때가 왔습니다."
 SAU_GCC_CRISIS.9.a: "그들은 복종하거나 아니면 끔찍한 고통을 받을 것이다."
 SAU_GCC_CRISIS.9.b: "다시 한번 생각해 보니, 우린 위험을 감수해선 안될 것 같습니다."
 SAU_GCC_CRISIS.10.t: "바레인 봉쇄에 동참하라고 압박하는 [FROM.GetAdjective]"
 SAU_GCC_CRISIS.10.d: "[FROM.GetNameDef]이(가) 바레인에 대한 봉쇄에 동참하라고 우리를 압박하고 있습니다. 바레인과의 경제 관계를 유지하는 것이 [FROM.GetNameDef]의 분노를 살 만한 가치가 있는지 고려해야 합니다."
 SAU_GCC_CRISIS.10.a: "그들과 함께하자."
 SAU_GCC_CRISIS.10.b: "이건 우리의 싸움이 아니다."
 SAU_GCC_CRISIS.11.t: "바레인 외교 위기"
 SAU_GCC_CRISIS.11.d.1: "여러 아랍 국가가 바레인과의 외교 관계를 단절하고 무역 금수 조치를 단행하여, 바레인과 [FROM.GetNameDef] 사이에 오래 끓어오르던 분쟁이 격화되고 있습니다. [FROM.GetAdjective]이(가) 주도하는 연합의 요구 사항에는 이란과의 관계 단절과 바레인 내 튀르키예 군사 기지 폐쇄 등이 포함되어 있습니다."
 SAU_GCC_CRISIS.11.d.2: "여러 아랍 국가가 바레인과의 외교 관계를 단절하고 무역 금수 조치를 단행하여, 바레인과 [FROM.GetNameDef] 사이에 오래 끓어오르던 분쟁이 격화되고 있습니다. [FROM.GetAdjective]이(가) 주도하는 연합의 요구 사항에는 이란과의 관계 단절 등이 포함되어 있습니다."
 SAU_GCC_CRISIS.11.a: "이러한 요구는 터무니없는 짓이다!"
 SAU_GCC_CRISIS.11.b: "우리는 요구를 받아들여야 한다."
 SAU_GCC_CRISIS.11.c: "흥미롭군"
 SAU_GCC_CRISIS.12.t: "요구에 응답한 [FROM.GetNameDef]"
 SAU_GCC_CRISIS.12.d: "[FROM.GetNameDef]이(가) 봉쇄 연합의 요구를 거부했습니다. [FROM.GetAdjective] 외무장관은 요구 사항이 [FROM.GetNameDef]의 주권을 침해한다고 밝히며 관계 회복을 위한 조건 목록을 \\"비현실적\\"이고 \\"이행 불가능\\"하다고 평가했습니다. 그는 공동 기자회견에서 \\"이것은 테러리즘에 관한 문제가 아니라 언론의 자유를 봉쇄하려는 것\\"이라고 말했습니다. 봉쇄 연합이 이 거부에 어떻게 대응할지는 아직 지켜봐야 합니다."
 SAU_GCC_CRISIS.12.a: "위기는 계속된다..."
 SAU_GCC_CRISIS.13.t: "요구에 응답한 [FROM.GetNameDef]"
 SAU_GCC_CRISIS.13.d: "[FROM.GetNameDef]는 [FROM.GetAdjective] 정부와 봉쇄 국가들의 대표들 사이에서 오랜 논의 끝에 봉쇄 연합과 합의에 도달했습니다. 그 결과, [FROM.GetNameDef]는 외교 정책을 GCC(걸프 협력 회의) 다른 국가들과 일치시키기로 하였으며, [FROM.GetNameDef]의 독립적인 외교 정책 노선이 끝나게 되었습니다."
 SAU_GCC_CRISIS.13.a: "다시 하나가 되었는가?"
 SAU_GCC_CRISIS.14.t: "쿠웨이트 봉쇄"
 SAU_GCC_CRISIS.14.d: "[KUW.GetLeader]은(는) 집권 이후 쿠웨이트를 우리의 외교 정책에 공공연히 어긋나는 길로 이끌었고, 노골적으로 이란과 긴밀한 관계를 추구해 왔습니다. 쿠웨이트의 이러한 행태를 끝낼 때가 왔습니다."
 SAU_GCC_CRISIS.14.a: "그들은 복종하거나 아니면 끔찍한 고통을 받을 것이다."
 SAU_GCC_CRISIS.14.b: "다시 한번 생각해 보니, 우린 위험을 감수해선 안될 것 같습니다."
 SAU_GCC_CRISIS.15.t: "쿠웨이트 봉쇄에 동참하라고 압박하는 [FROM.GetAdjective]"
 SAU_GCC_CRISIS.15.d: "[FROM.GetNameDef]이(가) 쿠웨이트에 대한 봉쇄에 동참하라고 우리를 압박하고 있습니다. 쿠웨이트와의 경제 관계를 유지하는 것이 [FROM.GetNameDef]의 분노를 살 만한 가치가 있는지 고려해야 합니다."
 SAU_GCC_CRISIS.15.a: "그들과 함께하자."
 SAU_GCC_CRISIS.15.b: "이건 우리의 싸움이 아니다."
 SAU_GCC_CRISIS.16.t: "쿠웨이트 외교 위기"
 SAU_GCC_CRISIS.16.d.1: "여러 아랍 국가가 쿠웨이트와의 외교 관계를 단절하고 무역 금수 조치를 단행하여, 쿠웨이트와 [FROM.GetNameDef] 사이에 오래 끓어오르던 분쟁이 격화되고 있습니다. [FROM.GetAdjective]이(가) 주도하는 연합의 요구 사항에는 이란과의 관계 단절과 쿠웨이트 내 튀르키예 군사 기지 폐쇄 등이 포함되어 있습니다."
 SAU_GCC_CRISIS.16.d.2: "여러 아랍 국가가 쿠웨이트와의 외교 관계를 단절하고 무역 금수 조치를 단행하여, 쿠웨이트와 [FROM.GetNameDef] 사이에 오래 끓어오르던 분쟁이 격화되고 있습니다. [FROM.GetAdjective]이(가) 주도하는 연합의 요구 사항에는 이란과의 관계 단절 등이 포함되어 있습니다."
 SAU_GCC_CRISIS.16.a: "이러한 요구는 터무니없는 짓이다!"
 SAU_GCC_CRISIS.16.b: "우리는 요구를 받아들여야 한다."
 SAU_GCC_CRISIS.16.c: "흥미롭군"
