l_korean:
 serbian_focus: "Serbia Focus Tree"
 SER_the_high_castle: "높은 성"
 SER_the_high_castle_desc: "A country is only as strong as the government leading it. We must secure it and decide on the path we want to go. Shall we keep to the 'old guard' or head down a new path?"
 SER_begin_repairing_works1: "국가 재건 시작"
 SER_begin_repairing_works1_desc: "NATO 폭격의 결과는 우리의 경제에 끔찍한 타격을 주었지만, 이제는 불사조처럼 일어나 잃어버린 것을 복구할 때입니다."
 SER_deals_with_criminal_world: "범죄 왕들을 처리"
 SER_deals_with_criminal_world_desc: "지금까지 우리는 우리 나라 전역에 퍼진 범죄와 싸울 수 없었지만, 그들과 여러 거래를 체결하여 그들의 영향력이 우리와 우리 나라에 미치는 영향을 줄일 수 있습니다."
 SER_enforcement_of_kleptocracy: "도둑정치가 억제 개시"
 SER_enforcement_of_kleptocracy_desc: "마침내 도둑정치가들이 우리나라에 미치는 영향력을 줄일 채비를 갖추었습니다. 작은 걸음으로, 우리는 그들의 영향에서 벗어날 것입니다."
 SER_anti_opposition_measures: "야당과의 투쟁"
 SER_anti_opposition_measures_desc: "그런 끔찍한 사건들 이후 우리 정부의 위태로운 처지가 야당이 우리를 압박할 구실이 되었습니다 - 우리가 그들을 처리할 것입니다."
 SER_demonstrative_anti_corruption_actions: "시범적 반부패 투쟁"
 SER_demonstrative_anti_corruption_actions_desc: "부패 문제는 정점에 달했지만 시민들을 안심시켜야 합니다. 손에 넣을 수 있는 부패 관료들을 상대로 보여 주기식 투쟁을 벌일 것입니다."
 SER_peacefulize_the_plebs: "민중을 진정시켜라"
 SER_peacefulize_the_plebs_desc: "국민은 우연한 사건 하나, 또는 적절한 자리에 있는 적절한 인물 하나만으로 혁명의 불길이 일어날 수 있는 상태에 있습니다. 그런 기회를 사전에 막아야 합니다."
 SER_debt_reconstructuring: "부채 구조조정"
 SER_debt_reconstructuring_desc: "우리의 부채가 우리를 지나치게 강하게 옭아매고 있습니다. 앞으로 부채 때문에 더 큰 타격을 입지 않도록 이 문제를 처리해야 합니다."
 SER_stabilization_measures: "안정화 조치"
 SER_stabilization_measures_desc: "경제의 안정을 보장하려면 불안하고 취약한 경제가 생겨날 환경을 막을 조치를 마련해야 합니다. 경제의 안전을 위해 지금 몇 가지를 시행합시다."
 SER_the_castle_crumbles: "성이 무너지다"
 SER_the_castle_crumbles_desc: "\n\n\n\n\n\n£SER_desctext_milocevic \n\n\n\n\n\n\n\n\n§H[ROOT.GetLeader]§!의 치세는 불안정, 지도력 부재, 그리고 숱한 전쟁 범죄로 얼룩져 있습니다. \n일부에서 §H불도저 혁명§!이라 부르는 이 사태는 밀로셰비치 통치의 종말을 촉발하고 [SER.GetFlag]§Y[SER.GetName]§!에 새로운 '§C민주주의§!' 질서를 가져올 수 있습니다.\n\n10월 말까지 §R저항§!을 진압하지 못하면 §H불도저 혁명§!이 본격화됩니다. §Y밀로셰비치§!는 나라에 대해 일정한 통제력을 갖겠지만, §R혁명§!이 끝날 때까지 그의 권력이 §H100%§!에 이르지 못한다면 그의 시대는 끝날 수도 있습니다.\n\n £text_icon_milocevic 밀로셰비치의 세력: §Y[?SER_milosevic_strength]§!"
 SER_the_revolution: "§R혁명§!"
 SER_the_revolution_desc: "불도저 혁명은 [ROOT.GetLeader]의 통치에 종지부를 찍을 것입니다.."
 SER_negotiations: "§Y협상§!"
 SER_negotiations_desc: "시위를 벌이는 비교적 약한 파벌들과 협상을 요청해야 할 것 같습니다.."
 SER_appeal_to_nationalists: "민족주의자들에게 §Y호소§!"
 SER_appeal_to_nationalists_desc: "우리 당과 집권 질서의 가장 강력한 지지자는 민족주의자들입니다. 그들을 달래야 합니다."
 SER_suppress_dissent: "반대 의견 §R탄압§!"
 SER_suppress_dissent_desc: "반대 운동을 거리에서 몰아내려면 어느 정도의 탄압이 필요할 것입니다.."
 SER_selective_repression: "§R선별적§! 탄압"
 SER_selective_repression_desc: "특정한 핵심 표적을 제거함으로써 저항 운동을 약화시킬 수 있을 것입니다."
 SER_mafia_concessions: "§Y마피아§!에 대한 양보"
 SER_mafia_concessions_desc: "마피아에 양보하면 그들을 우리 편으로 끌어들일 수 있을 것입니다."
 SER_utilize_mafia: "마피아 §R활용§!"
 SER_utilize_mafia_desc: "마피아에 연락하여 궂은일 일부를 대신 맡아 달라고 요청할 수 있습니다.."
 SER_russian_involvement: "[SOV.GetFlag]§Y러시아§!의 개입"
 SER_russian_involvement_desc: "러시아 정부 내 일부 세력은 이 저항 운동을 억제하는 데 기꺼이 손을 빌려줄 의사가 있습니다."
 SER_choke_the_media: "언론 §R질식§!"
 SER_choke_the_media_desc: "언론이 우리나라에서 맹렬히 타오르는 불길에 기름을 붓고 있습니다. 정보가 더 이상 퍼지지 않도록 그들에게서 정보를 차단해야 합니다."
 SER_constitutional_manipulation: "§Y헌법§! 조작"
 SER_constitutional_manipulation_desc: "우리 당이 계속 집권할 수 있도록 허점을 마련하려면 헌법을 약간 손봐야 할 것 같습니다"
 SER_divisionary_tactics: "§Y분열§! 전술"
 SER_divisionary_tactics_desc: "반대 운동 내부에 균열을 일으킴으로써 분열시켜 정복하는 방식으로 폭동을 제압할 수 있을 것입니다."
 SER_milosevic_power_10: "£text_icon_milocevic §H밀로셰비치의 세력§!이 §G10§! §G증가§!합니다"
 SER_milosevic_power_5: "£text_icon_milocevic §H밀로셰비치의 세력§!이 §G5§! §G증가§!합니다"
 SER_milosevic_power_1: "£text_icon_milocevic §H밀로셰비치의 세력§!이 §G1§! §G증가§!합니다"
 SER_revolution2_TT: "§R밀로셰비치가 축출됩니다!§!"
 SER_revolution3_TT: "§R밀로셰비치가 권력을 유지합니다!§!"
 SER_The_kleptocratic: "도둑정치가들"
 SER_The_kleptocratic_desc: "분통이 터질 만큼 합법적인 방식으로 국민의 것을 훔치는 우리나라의 엘리트 집단입니다. 이들은 정치 지도자든 범죄 조직의 두목이든 심지어 종교 인사든, 저마다 다른 곳에서 권력의 자리를 쥐고 있습니다."
 SER_International_Isolation: "국제적 고립"
 SER_International_Isolation_desc: "구 유고슬라비아 영토에서 벌인 우리의 행동 이후 우리는 국제적으로 고립되었으며, 이제 우리나라는 이 장벽을 극복할 방법을 찾아야 합니다"
 SER_nato_bombings_scars_idea: "나토 폭격의 여파"
 SER_nato_bombings_scars_idea_desc: "나토의 폭격은 우리나라에 상당한 피해를 입혔고, 수많은 건물과 기반시설이 파괴되었습니다. 이제 우리는 이 악몽의 결과를 감당해야 합니다"
 SER_brain_drain_idea_1: "두뇌 유출"
 SER_brain_drain_idea_1_desc: "지난 세기의 사건들은 그 흔적을 남겼고, 젊은이들은 더 나은 삶을 찾아 폐허를 떠나고 있습니다. 나라에 숙련된 인력이 남지 않도록 그들을 다시 불러오거나 떠나지 못하게 막아야 합니다"
 SER_avia1: "개혁된 공군"
 SER_special_unit_idea: "특수 작전 부대"
 SER_special_unit_idea_desc: "특수 작전 부대(JSO), 일명 붉은 베레 또는 프랑키스는 경찰 소속의 정예 특수 부대였습니다."
 SER_plebs_idea: "민중 진정 조치"
 SER_antiopposition_activity_idea: "반야당 투쟁"
 SER_demonstrative_anticorrup_idea: "시범적 반부패 투쟁"
 SER_stable_measure: "안정화 조치"
 SER_stable_measure_desc: "국민을 통제하기 위해 돈을 뿌립니다."
 SER_debt_reconstructure: "부채 구조조정"
 SER_debt_reconstructure_desc: "부채 상황을 관리하기 위해, 채권자들을 안심시키고 일시적으로 낮은 금리를 요청함으로써 시간을 벌고 상환 과정을 수월하게 만들고 있습니다."
 SER_milosevic_stays: "§Y슬로보단 밀로셰비치는 2000년 선거 이후에도 퇴임하지 않습니다§!"
 SER_milosevic_leaves: "§Y슬로보단 밀로셰비치는 2000년 선거 이후 퇴임합니다§!"
 SER_bulldozer_died: "§H불도저 혁명§!은 §R진압되었음§!이 틀림없습니다!"
 SER_bulldozer_revolution: "불도저 혁명"
 SER_castle_holds_strong: "성은 굳건히 버틴다"
 SER_castle_holds_strong_desc: "밀로셰비치의 권위는 굳건하며, 민주 야권의 힘은 과장되었던 것으로 보입니다. 밀로셰비치가 세르비아를 새 천년으로 이끌 것이며, 우리는 위대함 속에 우뚝 설 것입니다. 강한 세르비아, 강한 유고슬라비아!"
 SER_milosevic_authority: "밀로셰비치의 권위"
 SER_milosevic_authority_desc: "밀로셰비치는 자신의 지위가 안전하고 견고하도록 제대로 확보해야 합니다. 그에게 반대하는 목소리가 가장 큰 자들을 제거하고 그의 이익을 제대로 지켜 낼 것입니다."
 SER_increase_centralization: "중앙집권 강화"
 SER_increase_centralization_desc: "국가의 각 분야에 대한 통제를 강화하여, 두 번째 혁명은 허용하지 않을 것입니다."
 SER_purge_kleptocratic: "도둑정치가 숙청"
 SER_purge_kleptocratic_desc: "막대한 권력을 쥐고 막대한 돈을 챙겨 귀중한 디나르를 축내는 자들을 제거해야 합니다. 우리의 최고 이익, 즉 돈을 지키기 위해 그들을 신속히 쫓아냅시다."
 SER_crack_down_on_crime: "범죄와의 투쟁 강화"
 SER_crack_down_on_crime_desc: "마침내 우리나라의 대규모 조직 범죄를 끝낼 준비가 되었습니다."
 SER_anti_corruption_measures: "진정한 반부패 투쟁"
 SER_anti_corruption_measures_desc: "부패한 관계에서 포착된 모든 자는 우리가 더욱 주의 깊고 면밀하게 감시할 것입니다."
 SER_crush_the_opposition: "야당 분쇄"
 SER_crush_the_opposition_desc: "우리는 권력을 공고히 했으며, 이제 마침내 야당을 처리할 때입니다."
 SER_extinguish_opposition_support: "야당 지지 기반 최종 소멸"
 SER_extinguish_opposition_support_desc: "우리는 우리나라 정치 영역에 대한 완전한 통제에 거의 다다랐습니다."
 SER_empower_kleptocratic: "도둑정치가 육성"
 SER_empower_kleptocratic_desc: "그들을 제거하는 것은 좋아 보일 수 있습니다. 그러나 그 때문에 부채와 국가적 불안의 구렁텅이에 빠졌을 때, 누가 도와주기를 바라게 되겠습니까?"
 SER_criminal_government: "범죄자를 권력의 자리에"
 SER_criminal_government_desc: "물론 대가를 받고, 무뢰배들이 정부의 주요 직책을 차지하도록 허용할 것입니다"
 SER_criminal_oligarchs: "과두 재벌을 권력의 자리에"
 SER_criminal_oligarchs_desc: "과두 재벌도 공직을 맡을 수 있습니다. 우리는 또다시 위험을 감수하지만 그만한 가치가 있습니다"
 SER_arkans_guard: "아르칸 근위대"
 SER_arkans_guard_desc: "더 강한 군대를 위해 밀어붙여야 합니다. 최고의 준군사 조직인 아르칸 근위대가 당분간 우리 군을 떠받칠 것입니다."
 SER_expand_arkan_tigers: "아르칸 호랑이 부대 확대"
 SER_expand_arkan_tigers_desc: "아르칸 호랑이 부대는 우리가 가진 군사 복합체에서 필수적입니다. 그들에게도 이른바 식탁에 제대로 된 자리를 내어 줍시다."
 SER_russo_comaraderie_make_invest: "러시아-세르비아 동지애"
 SER_russo_comaraderie_make_invest_desc: "러시아인들은 가까운 친구로서 우리가 잘 재건하도록 도울 것입니다. 거래를 맺어 우리가 겪는 고립 문제를 없애 버립시다."
 SER_russian_trade_deal: "러시아 무역 협정"
 SER_russian_trade_deal_desc: "러시아와의 관계를 굳건히 하는 몇 건의 훌륭한 거래는 분명 우리에게 이익을 가져다줄 것이며, 모든 물자도 함께 따라올 것입니다."
 SER_chinese_investments: "중국 무역 협정"
 SER_chinese_investments_desc: "중국 파트너들이 우리와의 무역에 적극적인 관심을 보이고 있으며, 우리도 화답해야 합니다."
 SER_ease_isolation: "유라시아 무역 협정"
 SER_ease_isolation_desc: "우리의 협력이 결실을 맺었고, 국제적 고립이 이음매부터 갈라지기 시작했습니다."
 SER_pro_serbian_referendum: "세르비아 국민투표"
 SER_pro_serbian_referendum_desc: "우리 국가는 새 천년에 스스로 걸어갈 새로운 길을 선택해야 합니다.. 아니면 우리가 그들 대신 결정해야 할지도 모릅니다?"
 SER_milocevic_power: "밀로셰비치의 세력"
 SER_idea_arkans_guard: "아르칸 근위대"
 SER_idea_arkans_guard_desc: "세르비아를 위협하는 국가들로부터 안보를 지키기 위해 우리가 수행해야 할 특수 군사 작전을 맡는, 재편된 세르비아 의용 근위대입니다."
 SER_idea_arkans2_guard: "아르칸 근위대"
 SER_idea_arkans2_guard_desc: "세르비아를 위협하는 국가들로부터 안보를 지키기 위해 우리가 수행해야 할 특수 군사 작전을 맡는, 재편된 세르비아 의용 근위대입니다."
 SER_police_won: "강화된 범죄와의 투쟁"
 ser_deals.1.t: "투자를 요청하는 [SER.GetName]"
 ser_deals.1.d: "[SER.GetName]이(가) 자국 경제에 투자해 달라는 제안과 함께 우리 정부에 요청서를 보내왔습니다. 세르비아 경제는 이제 막 회복하기 시작했으므로 이 제안은 우리에게 유망해 보이며, 향후 우리의 투자가 결실을 맺을 수도 있습니다."
 ser_deals.1.a: "그들에게 투자하는 데 동의한다"
 ser_deals.1.b: "절대 안 된다!"
 ser_deals.2.t: "우리나라에 투자하기로 동의한 [FROM.GetName]"
 ser_deals.2.d: "[FROM.GetName]이(가) 우리나라에 투자하기로 동의했습니다. 이제 그들의 투자자들이 우리나라에 자체 생산 시설을 건설할 것이며, 이는 우리 경제를 더 빠르게 되살리는 데 도움이 될 것입니다."
 ser_deals.2.a: "좋아"
 ser_deals.3.t: "우리나라에 대한 투자를 거절한 [FROM.GetName]"
 ser_deals.3.d: "[FROM.GetName]이(가) 우리나라에 투자하기를 거절했습니다. 그들은 우리 경제 발전의 잠재력을 보지 못하는 것으로 보입니다."
 ser_deals.3.a: "슬프군"
 SER_MNT_give_up: "[MNT.GetFlag] §H몬테네그로§!가 §H독립§! 추진을 §G중단§!합니다"
 SER_turn_back_to_communist_ideals: "공산주의 이상으로의 회귀"
 SER_turn_back_to_communist_ideals_desc: "우리나라는 다시 한번 공산주의로 돌아가고 있으며, 구 유고슬라비아 영토에 붉은 깃발을 되돌릴 두 번째 기회를 얻었습니다."
 SER_cult_of_tito_cult_of_milosevic: "밀로셰비치 숭배"
 SER_cult_of_tito_cult_of_milosevic_desc: "전임자 티토와 마찬가지로, 나라를 구한 밀로셰비치는 자신을 중심으로 일종의 숭배를 형성했고 유고슬라비아의 부활을 믿는 공산주의자들의 우상이 될 수 있었습니다."
 SER_nationalisation_begins: "국유화 개시"
 SER_nationalisation_begins_desc: "민영화로 우리에게서 빼앗긴 것, 국민과 나라에서 빼앗긴 것을 되찾을 것입니다."
 SER_power_to_the_workers: "노동 계급에 대한 투자"
 SER_power_to_the_workers_desc: "우리 경제 성장의 엔진이 될 노동 계급에 집중할 것입니다.."
 SER_authoritarian_control_over_government: "정부에 대한 권위주의적 통제"
 SER_authoritarian_control_over_government_desc: "정부 내에서 배신적인 정서가 다시 생겨나도록 두지 않을 것입니다. 정부는 완전히 우리에게 복속될 것입니다."
 SER_authoritarian_control_over_economy: "경제에 대한 권위주의적 통제"
 SER_authoritarian_control_over_economy_desc: "우리나라의 경제 분야는 우연에 맡겨져 있었지만, 이제 강력한 지도자의 통제 아래로 되돌릴 것입니다.."
 SER_reyugoslavication: "유고슬라비아의 꿈으로 돌아가자"
 SER_reyugoslavication_desc: "우리는 적들이 유고슬라비아와 그 부활의 꿈이 과거 속으로 사라지는 것을 지켜보게 둘 생각이 없습니다. 옛 국가를 되살리기 위한 우리의 \\"십자군\\"을 시작합니다."
 SER_new_const: "신헌법"
 SER_new_const_desc: "새로운 국가에는 새로운 헌법이 필요합니다. 우리는 헌법을 다시 쓰고, 과거의 실수를 되풀이하지 않는 방안을 만들어 낼 것입니다.."
 SER_marxism: "학교에 마르크스주의를 되돌리자"
 SER_marxism_desc: "이전처럼 이념적 패배를 겪지 않도록, 젊은 세대에게 어릴 때부터 마르크스주의를 가르칠 것입니다."
 SER_atheism: "국교로서의 무신론"
 SER_atheism_desc: "모든 사람이 종교 의식과 의례에 정신을 빼앗기지 말고, 발전과 과학의 빛을 대중에게 전해야 합니다."
 SER_proletariat: "프롤레타리아트의 이념"
 SER_proletariat_desc: "앞으로 이 프롤레타리아트가 이전처럼 나라의 붕괴를 되풀이하지 않도록, 우리의 이념 선전을 프롤레타리아트에 집중할 것입니다."
 SER_four_year_plan_prepare: "4개년 계획 준비"
 SER_four_year_plan_prepare_desc: "우리는 경제 발전을 위한 첫 번째 4개년 계획 준비에 착수할 채비를 갖추었습니다."
 SER_worker_rights: "노동자의 권리"
 SER_worker_rights_desc: "노동자의 권리를 확대하고 그들에 대한 전횡을 방지할 것입니다."
 SER_four_year_plan_start: "4개년 경제 계획 개시"
 SER_four_year_plan_start_desc: "우리는 4개년 경제 발전 계획을 현실로 만들 채비를 갖추었습니다.."
 SER_nep: "신경제정책"
 SER_nep_desc: "소련을 비롯한 소비에트 국가들의 경험을 적극 수용하여 우리만의 신경제정책을 시행할 것입니다."
 SER_pressure_on_kosovo: "코소보 처리"
 SER_pressure_on_kosovo_desc: "이 분리주의 준국가를 처리할 때가 되었습니다."
 SER_crush_croatia: "크로아티아에 대한 최후통첩"
 SER_crush_croatia_desc: "크로아티아는 유고슬라비아의 붕괴를 위해 최대한 애쓴 국가 중 하나였지만, 우리는 평화적으로든 무력으로든 크로아티아를 되찾기 위해 가능한 모든 일을 할 것입니다."
 SER_avenge_bosnia: "보스니아에 대한 복수"
 SER_avenge_bosnia_desc: "우리는 보스니아 정부를 오랫동안 격식 차려 대하지 않을 것입니다 - 최후통첩이냐 전쟁이냐입니다."
 SER_ultimatums_for_slovenia_and_macedonia: "슬로베니아와 마케도니아"
 SER_ultimatums_for_slovenia_and_macedonia_desc: "이 국가들은 보스니아나 크로아티아처럼 우리에게 강하게 저항하지는 못하겠지만, 그들이 우리의 최후통첩을 거부한다면 우리는 여전히 군사적 수단을 쓸 준비가 되어 있습니다.."
 SER_pheonix_nation: "불사조 국가"
 SER_pheonix_nation_desc: "우리 국민, 우리의 위대한 조국이 불사조처럼 다시 태어났습니다."
 SER_ter_oborona: "영토 방위대 부활"
 SER_ter_oborona_desc: "유고슬라비아의 영토 방위대는 이미 60년대에 창설되었으며, 우리는 이를 다시 부활시킬 것입니다. 결국 모든 시민은 군인이든 아니든 조국을 지킬 준비가 되어 있어야 합니다."
 SER_integrate_yugoslavia_category: "유고슬라비아 영토의 통합"
 SER_integrate_yugoslavia_category_desc: "\n\n\n\n\n\n£SER_desctext_yugoslavia \n\n\n\n\n\n\n\n\n§Y유고슬라비아§!는 산산이 쪼개지고 파괴되었으며, §Y유고슬라비아인§!이라는 정체성 자체가 지상에서 지워졌습니다. 이제 우리는 국가를 다시 한번 되살리고 유고슬라비아인의 정체성을 부활시킬 것이며, 이번에는 과거의 실수를 되풀이하지 않을 것입니다"
 SER_bosnia_return: "§Y[BOS.GetFlag]보스니아§! 통합"
 SER_croatia_returns: "§Y[CRO.GetFlag]크로아티아§! 통합"
 SER_slovenia_returns: "§Y[SLV.GetFlag]슬로베니아§! 통합"
 SER_macedonia_returns: "§Y[FYR.GetFlag]마케도니아§! 통합"
 SER_ter_oborona_category: "유고슬라비아 영토 방위대"
 SER_ter_oborona_category_desc: "§Y[SER.GetFlag]유고슬라비아§!의 영토 방위대는 이미 60년대에 창설되었으며, 우리는 이를 다시 부활시킬 것입니다. 결국 모든 시민은 군인이든 아니든 자신의 [SER.GetFlag]§Y조국§!을 §G지킬§! 준비가 되어 있어야 합니다"
 SER_ter_oborona_serbia: "§Y[SER.GetFlag]세르비아§! 영토 방위대"
 SER_ter_oborona_bosnia: "§Y[BOS.GetFlag]보스니아§! 영토 방위대"
 SER_ter_oborona_croatia: "§Y[CRO.GetFlag]크로아티아§! 영토 방위대"
 SER_ter_oborona_slovenia: "§Y[SLV.GetFlag]슬로베니아§! 영토 방위대"
 SER_ter_oborona_macedonia: "§Y[FYR.GetFlag]마케도니아§! 영토 방위대"
 SER_new_workplace: "새로운 일터"
 SER_control_economic_idea: "통제 경제"
 SER_phoenix_nation_idea: "불사조 국가"
 SER_control_government_idea: "통제된 정부"
 SER_marxist_reeducation_idea: "학교 속의 마르크스주의"
 SER_new_constitution_idea: "신헌법"
 SER_proletariat_idea: "프롤레타리아트의 이념"
 SER_four_year_plan_preparations_idea: "4개년 계획 준비"
 SER_new_four_year_plan2_idea: "4개년 발전 계획"
 SER_new_workplace1: "노동자의 권리"
 SER_idea_new_economic_policy: "신경제정책"
 Serbia.18.t: "우리에게 최후통첩을 보내는 [SER.GetNameWithFlag]"
 Serbia.18.d: "오늘 [SER.GetNameWithFlag]이(가) 우리 정부에 즉각적인 항복과 자국으로의 통합 개시를 요구하는 최후통첩을 전달했습니다. 유고슬라비아를 되찾을 계획인 것으로 보입니다. 우리는 항복해야 합니까?"
 Serbia.18.a: "절대 안 된다!"
 Serbia.18.b: "항복한다"
 Serbia.25.t: "우리의 최후통첩을 거절한 [FROM.GetNameWithFlag]"
 Serbia.25.d: "그들은 우리의 요구에 응하기를 거부하고 문제를 무력으로 해결하는 쪽을 택했습니다. 우리는 개의치 않습니다."
 Serbia.25.a: "매우 유감이다."
 Serbia.26.t: "우리의 최후통첩을 수락한 [FROM.GetNameWithFlag]"
 Serbia.26.d: "그들은 우리가 생각한 것보다 현명하여 우리의 제안을 받아들였습니다."
 Serbia.26.a: "좋아"
 SER_renewed_milosevic_serbia: "부활한 세르비아"
 SER_renewed_milosevic_serbia_desc: "우리 국민은 수많은 세월의 전쟁과 굴욕, 그리고 자신들의 위대함에 대한 부정을 지난 뒤 재탄생과 회복의 길에 들어섰습니다."
 SER_the_sick_woman_of_the_coalition: "연립의 병든 여인"
 SER_the_sick_woman_of_the_coalition_desc: "밀로셰비치의 아내 미랴나는 남편의 손에서 나라의 정치 생활에 대한 더 큰 권력을 넘겨받았으며, 이제 그 어느 때보다 세르비아에 큰 영향력을 행사합니다."
 SER_ratify_greater_serbia: "대세르비아 비준"
 SER_ratify_greater_serbia_desc: "이제 대세르비아를 비준하고, 우리 국민이 현재 살고 있는 크로아티아, 보스니아, 그리고 서부 불가리아 일부 지역의 영토에 대한 영유권을 주장할 때입니다. 우리 국민은 우리를 필요로 하며, 이제 그들을 품으로 데려올 때입니다. 이 영토의 확보는 나중에 집중해도 되지만, 지금은 모든 세르비아인에게 우리가 그들의 최선의 이익을 마음에 품고 있음을 보여 줄 때입니다. 우리 국민을 고향으로 데려올 때입니다."
 SER_full_milosevic_dictatorship: "밀로셰비치의 독재"
 SER_full_milosevic_dictatorship_desc: "밀로셰비치는 마침내 자신이 세운 체제가 독재임을 인정했습니다. 하지만 독재가 나쁜 것입니까?"
 SER_shut_it_down_forcibly: "야당 입막음"
 SER_shut_it_down_forcibly_desc: "우리는 우리나라의 반대 정치 의견에 맞서 적극적으로 싸울 것입니다."
 SER_a_selective_merger: "작은 민주주의"
 SER_a_selective_merger_desc: "국민과 다른 관찰자들을 안심시키기 위해 야당에 일부 언론과 기타 매체에서 언론의 자유가 주어질 것입니다.."
 SER_union_state: "연방 국가 구상으로의 복귀"
 SER_union_state_desc: "연방 국가는 러시아와 벨라루스가 두 독립 국가로 이루어진 일종의 연합체를 만들기 위한 프로젝트로, 우리는 이전에 가입하려 했으나 실패했습니다. 우리는 다시 이 구상으로 돌아옵니다"
 SER_union_state_propaganda: "연방 국가 선전"
 SER_union_state_propaganda_desc: "연방 국가에 가입하는 것이 우리에게 이익이 될 뿐이라고 우리나라 국민을 설득해야 합니다"
 SER_union_state_documents: "모든 문서 준비"
 SER_union_state_documents_desc: "연방 국가 가입에 필요한 문서에 서명하고 준비하는 긴 과정을 시작할 것입니다"
 SER_union_state_referendum: "국민투표"
 SER_union_state_referendum_desc: "이제 우리는 연방 국가 가입에 관한 국민투표를 실시할 채비를 갖추었습니다"
 SER_rise_nation: "국가의 부상"
 SER_rise_nation_desc: "세르비아 국가는 지난 10년간 닥친 공포와 수치에서 일어설 것입니다. 세르비아인이 다시 위대한 민족이 될 때입니다"
 SER_mobilise_people: "국민 동원"
 SER_mobilise_people_desc: "우리 국민에게는 위대하다고 불릴 권리를 위해 싸워야 하는 험난한 길이 놓여 있습니다. 우리는 전쟁에도 대비해야 합니다"
 SER_military_invest: "군수 산업 투자"
 SER_military_invest_desc: "군수 산업을 되살릴 때입니다. 강한 군대에는 강한 산업이 필요합니다"
 SER_defend_borders: "국경 수비"
 SER_defend_borders_desc: "우리는 국경 수비를 강화할 것이며, 누구도 눈에 띄지 않고 대세르비아의 영토로 넘어오지 못할 것입니다!"
 SER_military_nation: "군사화된 국가"
 SER_military_nation_desc: "우리 국민은 예전의 위대함을 되찾기 위해 전쟁에 나설 채비가 되어 있습니다. 노동자부터 병사까지, 우리는 무엇이든 할 준비가 되어 있습니다"
 SER_panteri: "가르다 판테리 재창설"
 SER_panteri_desc: "가르다 판테리, 다른 이름으로 특별 여단 가르다 판테리는 보스니아 전쟁 당시 스르프스카 공화국군의 정예 부대였습니다. 1992년 5월 2일 SAO 셈베리야 및 마예비차 세르비아 국가 근위대라는 최초의 명칭으로 창설되었으며, 류비샤 \\"마우저\\" 사비치와 세르비아 연대 기금 회원들이 전사한 전임 지휘관 브란코 \\"판테르\\" 판텔리치를 기려 \\"가르다 판테리\\"라는 이름을 채택했습니다. 이 부대는 유고슬라비아 전쟁 중이던 1992년부터 1996년까지 보스니아에서 싸웠습니다"
 SER_ssd: "국가보안국 재창설"
 SER_ssd_desc: "국가보안국, 또는 간단히 국가보안은 세르비아 내무부 산하의 보안 기관으로, 국내 위협으로부터 나라를 보호하는 임무를 맡았습니다."
 SER_nationalise: "국유화"
 SER_nationalise_desc: "민영화는 실수였으며, 이제 이를 바로잡을 때입니다. 국가에서 빼앗긴 모든 것을 되돌릴 것입니다."
 SER_infra: "기반시설 투자"
 SER_infra_desc: "우리나라의 더 나은 물류를 위해 기반시설 개발에 더 많이 투자할 것입니다."
 SER_demand_serbian_autonomy: "세르비아 자치 요구"
 SER_demand_serbian_autonomy_desc: "세르비아인의 독립 국가를 관철하고 - 강력한 외세의 영향을 모두 제거합시다."
 SER_orchestrate_referendum: "국민투표 연출"
 SER_orchestrate_referendum_desc: "국민투표를 실시해야 합니다! 우리는 국민이 무엇을 원하는지 알고 있으며, 그것을 그들의 입으로 말하게 해야 합니다! 이것이 우리의 요구를 정당화하는 최선의 방책입니다."
 SER_reunite_macedonia: "마케도니아 재통합"
 SER_reunite_macedonia_desc: "마케도니아는 언제나 세르비아의 일부였고 앞으로도 그럴 것입니다. 지도에도 그렇게 표시되도록 만들기만 하면 됩니다."
 SER_srpska_intervention: "스르프스카 개입"
 SER_srpska_intervention_desc: "보스니아는 우리에게 돌아올 것입니다. 이는 우리가 보장합니다. 그들이 기어서 돌아오기만을 기다리며 시간을 허비하지 않도록 신속히 행동해야 합니다."
 SER_integrate_bosnia: "보스니아 통합"
 SER_integrate_bosnia_desc: "한때 보스니아였던 땅이 이제 우리 것이 되었으니, 이를 안정시켜야 합니다. 영토와 주민을 완전히 통합하기 위해 새로운 정책과 조치를 도입할 것입니다."
 SER_russian_peacekeapers: "러시아 평화 유지군"
 SER_russian_peacekeapers_desc: "러시아에 우리 영토에 의용 파견대를 배치해 달라고 요청할 것입니다"
 SER_integrate_bosnia_category: "[BOS.GetFlag]보스니아 통합"
 SER_integrate_bosnia_category_desc: "\n\n\n\n\n\n£SER_desctext_bosnia \n\n\n\n\n\n\n\n\n§Y대[SER.GetFlag]세르비아§!를 건설하려면 §Y[BOS.GetFlag]보스니아의 모든 영토§!를 §G통합§!해야 합니다."
 SER_serpska_returns: "동스르프스카 §Y통합§!"
 SER_bosnia_returns: "보스니아 §Y통합§!"
 SER_herce_returns: "헤르체고비나 §Y통합§!"
 SER_brcko_returns: "브르치코 §Y통합§!"
 SER_westserbska_returns: "서스르프스카 §Y통합§!"
 SER_unsko_returns: "운스코사나 §Y통합§!"
 SER_shut_down_opposition: "반대 신념을 가진 정당 추방"
 SER_socialist_merger: "통합된 이념"
 SER_rise_serbian_idea: "부활한 세르비아 국민"
 SER_serbian_glory_idea: "위대한 세르비아에 영광을"
 SER_border_build_idea: "국경 수비"
 SER_ssd_command: "국가보안국"
 SER_rus_peacekeepers: "러시아 평화 유지군"
 SER_milosevic_dictatorship_tt: "§Y슬로보단 밀로셰비치§!를 종신 지도자로 삼습니다!"
 SerbiaFocus.7.t: "스르프스카 공화국의 운명"
 SerbiaFocus.7.d: "우리는 독자적인 국민투표를 실시할 것이며, 그것을 명분으로 스르프스카 공화국을 보스니아에서 분리하여 그 정부를 예속시킬 것입니다."
 SerbiaFocus.7.a: "좋아"
 SerbiaFocus.8.t: "스르프스카 공화국의 반란"
 SerbiaFocus.8.d: "예상은 했으나 이렇게 빨리 벌어질 줄은 상상하지 못했습니다. 우리가 스르프스카 공화국에 자치를 부여하자마자, 베오그라드가 그곳에서 우리에 대한 반란을 부추겼습니다."
 SerbiaFocus.8.a: "젠장, 싸우겠다"
 SerbiaFocus.8.b: "항복한다"
 SerbiaFocus.24.t: "평화 유지군을 요청하는 [FROM.GetNameWithFlag]"
 SerbiaFocus.24.d: "세르비아 정부는 적대 행위가 재발할 것을 우려하여 우리 영토에 평화 유지군을 주둔시켜 주기를 바랍니다. 수락하시겠습니까?"
 SerbiaFocus.24.a: "찬성"
 SerbiaFocus.24.b: "그곳에 평화 유지군을 보내지 않겠다"
 SerbiaFocus.25.t: "우리에게 평화 유지군을 보내는 [FROM.GetNameWithFlag]"
 SerbiaFocus.25.d: "러시아 정부가 우리에게 평화 유지 파견대를 보내고 있으니, 이제 우리는 안전합니다"
 SerbiaFocus.25.a: "좋아"
 SerbiaFocus.26.t: "평화 유지군 파견을 거부한 [FROM.GetNameWithFlag]"
 SerbiaFocus.26.d: "러시아 정부는 우리 영토에 평화 유지군을 보내기를 거부했습니다"
 SerbiaFocus.26.a: "슬프군"
 SerbiaFocus.113.t: ""
 SerbiaFocus.113.d: ""
 SerbiaFocus.113.a: "좋아"
 SER_serbian_perestroika: "세르비아 정체성의 재구성"
 SER_serbian_perestroika_desc: "우리는 세르비아 민족의 본질 자체를 바꾸고 발칸에서의 전면적 지배를 포기할 채비가 되어 있으며, 그 대신 발칸 민족들에게 오래도록 잊혀 있던 구상, 즉 발칸 연방을 제안할 준비가 되어 있습니다"
 SER_renewed_image_of_serbia: "새로워진 세르비아"
 SER_renewed_image_of_serbia_desc: "우리 국민은 앞으로 우리가 스스로를 어떤 모습으로 볼 것인가에 대한 국가적 재고라는 어려운 단계를 거쳐야 합니다. 거대 세르비아를 만들어 발칸을 지배하려는 공격적 팽창과 욕망은 과거의 일이 되어야 합니다"
 SER_confederation_project: "연방 프로젝트"
 SER_confederation_project_desc: "연방 창설을 위한 준비에 착수할 것입니다. 이 중요한 걸음은 통합 발칸을 세계의 권력 중심으로 삼는 우리의 비전에 한 걸음 더 가까이 다가가게 해 줄 것입니다."
 SER_hijacking_yugo_nostalgia: "유고슬라비아의 꿈 활용"
 SER_hijacking_yugo_nostalgia_desc: "유고슬라비아는 사라졌지만 그에 대한 그리움은 사라지지 않았습니다. 정부는 그 향수를 자신의 강령에 녹여 내어, 다가올 연방을 새로운 경영 아래의 옛 꿈으로 내세웁니다."
 SER_language_agreements: "언어 문제 해결"
 SER_language_agreements_desc: "언어는 언제나 한 민족이 다른 민족을 지배하는 수단이었지만, 우리 연방에서는 모든 민족의 모든 언어가 중요하고 필요한 것이 될 것입니다."
 SER_propose_yugocefta: "무역 관계 증진"
 SER_propose_yugocefta_desc: "우리는 이웃 국가들과 여러 무역 협정을 체결할 것이며, 이는 연방 창설을 위한 첫 협상에 우리를 한 걸음 더 가깝게 해 줄 것입니다."
 SER_confederation_realisation: "연방의 첫 단계"
 SER_confederation_realisation_desc: "우리나라의 연방화를 시작하여, 앞으로 모든 이웃이 우리의 제국주의적 야망은 과거의 일이며 우리가 모든 발칸 민족과 협력할 준비가 되어 있음을 알 수 있게 할 것입니다."
 SER_apologize_to_bosnia: "보스니아와의 모든 분쟁 해결"
 SER_apologize_to_bosnia_desc: "보스니아와의 대립은 마무리되어야 하며, 우리는 이 형제 국가와 가능한 한 많은 유대를 맺고자 하는 열망을 적극 장려할 것입니다."
 SER_undermine_croatian_nationalism: "크로아티아 민족주의 무마"
 SER_undermine_croatian_nationalism_desc: "우리는 크로아티아와의 협력을 증진할 것입니다. 끔찍한 과거에도 불구하고, 우리 앞에는 멋진 미래가 놓여 있습니다."
 SER_honey_and_milk_approach: "꿀과 우유의 외교"
 SER_honey_and_milk_approach_desc: "코소보와 마케도니아는 언제나 남쪽에서의 우리의 주된 문제였지만, 이제 우리는 이 문제를 잠재적인 친구이자 파트너로 바꿀 채비가 되어 있습니다. 이들의 연방 가입이 우리에게 남쪽으로의 길을 열어 줄 것이므로 이들과 관계를 맺는 것이 중요합니다."
 SER_confederation_bos: "보스니아와의 협상"
 SER_confederation_bos_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_slv_cro: "슬로베니아 및 크로아티아와의 협상"
 SER_confederation_slv_cro_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_mac_kos: "코소보 및 마케도니아와의 협상"
 SER_confederation_mac_kos_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_created: "연방의 두 번째 단계"
 SER_confederation_created_desc: "발칸 연방 국가라는 우리 구상의 두 번째 단계를 완료했습니다. 이제 유고슬라비아의 일부였던 적이 없는 국가들을 향해 나아갈 준비가 되었습니다."
 SER_multicultural_guarantees: "다문화주의 보장"
 SER_multicultural_guarantees_desc: "우리 연방 안에 거주하는 민족들의 다문화주의를 보호하기 위한 사상과 법률을 장려할 것입니다."
 SER_a_newer_identity: "새로운 민족 정체성"
 SER_a_newer_identity_desc: "발칸 민족은 우리 연방에 거주하는 모든 민족을 아우르는 새로운 민족 정체성이 되어야 하며, 그것이 우리가 단결을 찾을 수 있는 유일한 길입니다.."
 SER_confederation_alb: "알바니아와의 협상"
 SER_confederation_alb_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_gre: "그리스와의 협상"
 SER_confederation_gre_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_bul: "불가리아와의 협상"
 SER_confederation_bul_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_confederation_romania: "루마니아와의 협상"
 SER_confederation_romania_desc: "마침내 연방 가입에 관한 협상을 시작할 준비가 되었습니다. 즉각 합의하고 연방 가입을 설득할 수 있을지는 확실하지 않지만, 우리는 긴 과정을 감당할 준비가 되어 있습니다."
 SER_south_european_balkan_confederation: "발칸, 새로운 권력의 중심"
 SER_south_european_balkan_confederation_desc: "우리 연방은 이제 광대한 영토에 걸쳐 있으므로, 우리가 새로운 권력의 중심이며 강대국들이 더 이상 우리에게 개별적으로 영향을 미칠 수 없다고 선언할 채비가 되었습니다."
 SER_conf_prepare: "연방 준비"
