 RULE_OPTION_LBA_GRAND_MUFTI: "大穆夫提的统治"
 RULE_OPTION_LBA_GRAND_MUFTI_DESC: "§8大穆夫提§!被任命，宗教法律凌驾于国家之上。穆夫提最终掌权，建立萨拉菲王国，并在利比亚全境推行严格的伊斯兰教法统治。"
 RULE_OPTION_LBA_KINGDOM: "塞努西王国"
 RULE_OPTION_LBA_KINGDOM_DESC: "王室成员返回家园并获得补偿，§8塞努西§!王朝恢复了绝对统治。利比亚放弃了共和国体制，王室无限期暂停选举。"
