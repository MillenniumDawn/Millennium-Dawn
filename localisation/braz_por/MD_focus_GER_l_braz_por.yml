 GER_status_report_desc: "O relatório de situação nos permitirá monitorar todos os elementos radicais em nossa nação, principalmente os extremistas islâmicos, de esquerda e de direita. Se o nível de extremismo for alto, significa que o departamento responsável por gerenciá-los não está conseguindo acompanhar o ritmo e que suas atividades podem em breve perturbar a estabilidade nacional. Se o nível de extremismo for médio, significa que o departamento está fazendo um trabalho abaixo do ideal para conter os grupos e que pode haver alguns problemas, mas nada em nível nacional. Um nível baixo de extremismo significa que o grupo está sendo contido pelo departamento e não representará nenhuma ameaça à nossa democracia."
 GER_status_on_right_wing: "Departamento 2: Extremismo de Direita"
 GER_status_on_right_wing_desc: "O Departamento 2 mantém o controle sobre todos os principais grupos e organizações de direita."
 GER_status_on_left_wing: "Departamento 5: Extremismo de Esquerda"
 GER_status_on_left_wing_desc: "O Departamento 5 mantém o controle sobre todos os principais grupos e organizações de esquerda."
 GER_status_on_sand_people: "Departamento 6: Extremismo Islâmico"
 GER_status_on_sand_people_desc: "O Departamento 6 mantém o controle sobre todos os principais grupos e organizações islâmicas. O Departamento 6 também mantém um olhar atento sobre os islâmicos fora do país."
