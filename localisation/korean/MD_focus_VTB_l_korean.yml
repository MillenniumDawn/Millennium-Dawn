l_korean:
 VBT_Start: "비텝스크는 러시아가 될 것이다!"
 VBT_Start_desc: "우리는 오랫동안 우리 위에 군림하는 당국의 횡포를 견뎌 왔지만, 이제 온 나라가 불타고 있으니 행동에 나설 때입니다. 우리는 모든 행정 기관을 장악하고 독립을 위해 싸울 민병대를 조직할 것입니다!"
 VBT_Economic_help: "재정 지원"
 VBT_Economic_help_desc: "우리 젊은 공화국에는 자금이 필요하며, 러시아의 도움을 기대합니다"
 VBT_weapon_help: "무기 지원"
 VBT_weapon_help_desc: "우리 지역의 창고에는 민병대를 무장시킬 만한 무기가 충분하지 않으며, 러시아가 도와주기를 기대합니다"
 VBT_Ruble: "루블을 주요 통화로"
 VBT_Ruble_desc: "경제 상황을 개선하기 위해 러시아 루블을 유통시킵니다"
 VBT_government: "비텝스크 인민공화국 정부"
 VBT_government_desc: "우리는 마침내 우리 공화국의 정부를 입법 행위로 공식화할 준비가 되었습니다"
 VBT_volunteers_help: "러시아의 지원병"
 VBT_volunteers_help_desc: "러시아에서 온 많은 지원병이 우리를 위해 싸우기를 원하며, 우리는 이들을 공화국 영토에 받아들일 준비가 되어 있습니다"
 VBT_weapon_help2: "무기 재요청"
 VBT_weapon_help2_desc: "적이 계속 진격하고 있으므로 독립을 위한 우리의 투쟁에는 더 많은 무기가 필요합니다"
 VBT_intervene: "러시아의 개입"
 VBT_intervene_desc: "우리는 홀로 싸울 수 없으며, 러시아군의 도움을 요청할 준비가 되었습니다"
 VBT_referendum: "러시아 편입 국민투표"
 VBT_referendum_desc: "우리는 독립을 지켜냈으며, 이제 러시아에 합류할 준비가 되었습니다. 그들이 우리를 받아줄까요?"
 VBT_svet: "전기기술 기업 \\"스베트\\" 국유화"
 VBT_svet_desc: "우리는 이제 독립 국가이므로 경제를 건설해야 합니다. 구 벨라루스 기업들의 국유화를 시작할 것입니다"
 VBT_roads: "도로 복구"
 VBT_roads_desc: "군사 작전으로 피해를 입은 공화국의 도로를 복구해야 합니다"
 VBT_strengthen_government: "정부 권력 강화"
 VBT_strengthen_government_desc: "강한 나라에는 강한 정부가 필요합니다"
 VBT_army_republic: "공화국군"
 VBT_army_republic_desc: "우리는 스스로를 지킬 준비가 되어 있어야 하므로, 나라를 보호할 공화국군을 창설해야 합니다"
 VBT_education: "공화국의 교육"
 VBT_education_desc: "공화국의 교육 체계를 다루기 시작해야 합니다"
 VBT_specnaz_republic: "공화국 특수 부대"
 VBT_specnaz_republic_desc: "러시아와 다른 나라에서 온 경험 많은 지원병들이 공화국의 신생 특수 부대의 교관이 될 수 있습니다"
 VBT_defence_republic: "국방 전략 수립"
 VBT_defence_republic_desc: "우리 작은 나라는 더 위협적인 이웃 나라들로부터 스스로를 지켜야 하므로, 국방 전략을 수립해야 합니다."
 VBT_medicine: "공화국의 의료"
 VBT_medicine_desc: "전쟁 이후 많은 부상자들이 제대로 재활 치료를 받지 못하고 있으므로 의료 예산을 늘려야 합니다"
 VBT_social: "사회 지출 확대"
 VBT_social_desc: "우리 공화국의 시민은 우리가 제공할 수 있는 모든 보장을 누려야 합니다."
 vitebsk_rus.2.t: "비쳅스크의 반군이 장비를 요청함"
 vitebsk_rus.2.d: "비쳅스크 반군은 자신들이 통제하는 보급품이 보잘것없는 수준으로 드러났으므로 병사들을 위한 장비를 우리에게 요청하고 있습니다"
 vitebsk_rus.2.a: "그들에게 무기를 주겠다"
 vitebsk_rus.2.b: "아니, 개입하지 않겠다"
 vitebsk_rus.3.t: "미승인 공화국에 대한 경제 지원"
 vitebsk_rus.3.d: "비쳅스크 반군은 가용 자금이 거의 없으므로 우리에게 재정 지원을 요청하고 있습니다"
 vitebsk_rus.3.a: "그들에게 자금을 주어야 한다"
 vitebsk_rus.3.b: "아니, 개입하지 않겠다"
 vitebsk_rus.4.t: "비쳅스크의 반군이 장비를 요청함"
 vitebsk_rus.4.d: "비쳅스크 반군은 자신들이 통제하는 보급품이 보잘것없는 수준으로 드러났으므로 병사들을 위한 장비를 우리에게 요청하고 있습니다"
 vitebsk_rus.4.a: "그들에게 무기를 주겠다"
 vitebsk_rus.4.b: "아니, 개입하지 않겠다"
 vitebsk_rus.6.t: "비쳅스크 공화국이 우리나라 편입 국민투표를 실시함"
 vitebsk_rus.6.d: "비쳅스크 반군은 피비린내 나는 내전이 끝난 뒤 우리나라에 합류하는 문제를 두고 국민투표를 실시하고 있습니다. 우리가 감히 이를 받아들일 수 있을까요?"
 vitebsk_rus.6.a: "이제 그들이 고향으로 돌아올 때다"
 vitebsk_rus.6.b: "국제사회와 완전히 등을 지고 싶지는 않다"
 vitebsk_rus.7.t: "스스로를 벨라루스라고 선언한 우리"
 vitebsk_rus.7.d: "현재의 벨라루스 정부는 끝내 이 땅에 사는 주민들을 배신하고 하나 된 러시아 민족으로부터 분리하려 하고 있습니다. 모스크바는 이를 외면한 채 우리와 얽히고 싶어 하지 않으니, 이제 우리가 진정한 러시아 공화국의 역할을 짊어질 것입니다."
 vitebsk_rus.7.a: "벨라루스인은 러시아인이다!"
 vitebsk_rus.8.t: "민스크 함락"
 vitebsk_rus.8.d: "적이 민스크를 점령했습니다. 우리 병력으로는 적을 막기에 분명히 역부족이니, 적과 평화 조약을 맺는 편이 좋겠습니다."
 vitebsk_rus.8.a: "그들에게 제안을 보내겠다"
 vitebsk_rus.9.t: "벨라루스 정부가 평화 조약을 제안함"
 vitebsk_rus.9.d: "벨라루스 정부로부터 평화 조약 체결을 제안하는 서한을 받았습니다. 우리가 그들이 예상한 것보다 더 성공적으로 전쟁을 치르고 있는 것으로 보입니다"
 vitebsk_rus.9.a: "이제 평화를 맺을 때라고 생각한다"
 vitebsk_rus.9.b: "끝까지 전쟁이다"
 vitebsk_rus.10.t: "비쳅스크 공화국이 통합을 제안함"
 vitebsk_rus.10.d: "비쳅스크 공화국 지도부는 국가의 다른 구성 주체들과 달리 확대된 권리를 가진 공화국이 되는 통합 방안을 제안합니다"
 vitebsk_rus.10.a: "동의한다"
 vitebsk_rus.10.b: "그러한 조건은 받아들이지 않는다"
 vitebsk_focus: "비쳅스크 인민공화국 국가 중점 트리"
 VTB_National_Defense_Strategy: "국방 전략"
 VTB_RUS_communism: "벨로루시아"
 VTB_RUS_nationalist: "벨로루시아"
 VBT_mobilisation: "동원령 선포"
 VBT_mobilisation_desc: "조국을 지키기 위해 주민들을 일으켜 세울 때입니다"
 VBT_passports: "여권 발급 개시"
 VBT_passports_desc: "우리는 공화국의 시민권을 법제화할 준비가 되었습니다"
 VTB_profarmy: "공화국군"