 module_vls_lam_6_desc: "Les missiles d'attaque terrestre VLS hyperavancés représentent le sommet de la frappe de précision navale, combinant une précision extrême, une longue portée et une résistance robuste aux contre-mesures pour projeter la puissance bien au-delà du littoral.\n\n§GIndice du concepteur : ce module augmentera l'attaque de canon pour le bombardement côtier, ainsi que les PV, au prix d'un CI accru et d'une réduction de la perforation de canon.§!"
