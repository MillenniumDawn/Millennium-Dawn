 france_md.600.t: "Чиповый бизнес, который больше не нужен Alcatel"
 france_md.600.d: "Телекоммуникационный пузырь лопнул, и Alcatel продает все, что не является сетевым оборудованием. Ее подразделение микроэлектроники прибыльно, компетентно и вот-вот перейдет в собственность другой компании. Сохранение французского подразделения обойдется казначейству в реальные деньги, которые пришлось бы потратить на решение проблемы, в существовании которой рынок не верит."
 france_md.600.a: "Оставьте подразделение микроэлектроники в руках французов."
 france_md.600.b: "Пусть он достанется европейскому покупателю."
 france_md.601.t: "Стена кредитов"
 france_md.601.d: "Задолженность France Telecom превышает задолженность любой другой компании, стоимость приобретений, которые привели к образованию долга, составляет лишь малую часть выплаченной суммы, и банки не будут продлевать срок погашения. Государство может вкладывать государственные средства в компанию, акции которой котируются на бирже, или же позволить кредиторам решать, кем станет национальный оператор."
 france_md.601.a: "Рекапиталировать оператора за счет государственных средств."
 france_md.601.b: "Пусть кредиторы проведут реструктуризацию."
 france_md.602.t: "Штат теряет большинство."
 france_md.602.d: "Продажа государственной доли в France Telecom ниже пятидесяти процентов позволила бы получить значительные средства и положить конец спорам в Брюсселе о конкуренции со стороны государственной компании на открытом рынке. Это также означало бы, что следующее решение относительно телефонной сети Франции будет приниматься акционерами."
 france_md.602.a: "Удержать большинство в штате"
 france_md.602.b: "Продавайте ниже пятидесяти процентов"
 france_md.603.t: "После Кроллеса2"
 france_md.603.d: "Благодаря сотрудничеству в Кролле три компании получили передовой технологический процесс, который ни одна из них не смогла бы реализовать самостоятельно, и две из них теперь покидают проект. Финансирование замены означает, что государство продолжит исследовательскую программу, от которой отказались его партнеры. Отказ означает, что одна французская компания будет разрабатывать узел самостоятельно или прекратит попытки."
 france_md.603.a: "Профинансируйте то, что заменит альянс."
 france_md.603.b: "Пусть национальный чемпион везет это в одиночку."
 france_md.604.t: "Разборка стратегии ST-Ericsson"
 france_md.604.d: "ST-Ericsson, совместное предприятие STMicroelectronics, созданное совместно с Ericsson для того, чтобы стать лидером беспроводной связи в Европе, теряло деньги каждый квартал своего существования, и производители мобильных телефонов, для которых оно было создано, теперь разрабатывают собственные микросхемы. Спасение компании позволило бы выиграть время для бизнеса, рынок которого уже изменился. Закрытие компании означает списание последней серьезной европейской попытки создания мобильного чипсета."
 france_md.604.a: "Спасти предприятие в сфере беспроводной связи"
 france_md.604.b: "Расформируйте сделку и примите убытки."
 france_md.605.t: "Микроэлектроника IPCEI"
 france_md.605.d: "Брюссель разрешит то, что когда-то запрещал: государственные средства в больших масштабах для финансирования производства полупроводников. Программа Кроллеса может быть расширена до чего-то, что будет иметь значение для континента, а не для одной компании. Это гонка субсидий, которую Франция не начинала и не может выиграть в одиночку, а альтернатива – не участвовать в ней."
 france_md.605.a: "Профинансируйте расширение комплекса Crolles."
 france_md.605.b: "Предоставьте рынок рынку в вопросах обеспечения производственных мощностей"
 france_md.606.t: "Что сохранила Республика"
 france_md.606.d: "Четверть века спасательных операций, продаж, альянсов и субсидий определила судьбу компаний Alcatel, France Telecom и STMicroelectronics: какие части французской телефонной сети и полупроводниковой промышленности по-прежнему принадлежат государству, а какие являются лишь его площадкой."
 france_md.606.a: "Чемпион, которым Республика по-прежнему владеет."
 france_md.606.b: "Кремниевая база, построенная на государственные деньги."
 france_md.606.c: "Оператор, которого когда-то спасло государство."
 france_md.606.e: "Рынок, как и любой другой."
 FRA_cs_nationalised_systems_champion: "Чемпион национализированных систем"
 FRA_cs_nationalised_systems_champion_desc: "Государство никогда не отказывалось от большинства, поэтому сеть и окружающая её индустрия подчиняются Парижу прежде, чем цене акций. Это обходится казначейству так же дорого, как и всегда обходится контрольный пакет акций, и это позволяет принимать решения, которые остаются в стране."
 FRA_cs_state_backed_silicon_base: "Поддерживаемая государством кремниевая база"
 FRA_cs_state_backed_silicon_base_desc: "На государственные деньги были созданы производственные мощности, которые ни одна французская компания не смогла бы профинансировать самостоятельно, а кремниевые пластины производятся во Франции. Субсидия является постоянной, потому что мощности тоже, и теперь это не аргументы, а факты."
 FRA_cs_recapitalised_national_operator: "Рекапитализированный национальный оператор"
 FRA_cs_recapitalised_national_operator_desc: "Государство вложило деньги, когда никто другой не хотел, и оператор выжил, несмотря на долги, которые ни одна компания не должна была нести. Это было спасение, а не реконструкция, а спасения недолговечны."
 FRA_cs_market_like_any_other: "Рынок, как и любой другой."
 FRA_cs_market_like_any_other_desc: "Чемпионские компании были проданы, объединены или ликвидированы на обычных коммерческих условиях, и Франция покупает свои сети и микросхемы у того, кто лучше всего их продает. Это эффективно, это ортодоксально, и здесь больше не принимаются никакие стратегические решения."
 france_md.554.t: "Франция предлагает провести совместные военные учения."
 france_md.554.d: "Французские дипломаты прислали нам предложение о совместных военных учениях. Действительно, недавний рост международной напряженности побуждает нас, европейских государств, объединиться для подготовки к худшему сценарию. Это может стать очень хорошей инициативой для подготовки наших вооруженных сил к конфликтам высокой интенсивности, которые могут вспыхнуть в любой момент. Что нам им сказать?"
 france_md.554.a: "Мы с удовольствием будем тренироваться вместе с ними."
 france_md.554.b: "Нет, спасибо, нам их помощь не нужна."
 france_md.359.t: "Монархисты захватывают власть во Франции"
 france_md.359.d: "Шокирующая новость от [FRA.GetNameWithFlag]: экстремистские фракции внутри правящей партии захватили власть и упразднили Пятую республику. Умеренное руководство оттеснено на второй план, а радикалы восстанавливают монархическое правление. Этот драматический переворот против демократии потряс весь мир. Как нам следует реагировать?"
 france_md.359.a: "Осуждаем этот экстремистский захват власти"
 france_md.359.b: "Это внутренний французский вопрос."
 FRA_country_chaos: "Тревожные слухи"
 FRA_country_chaos_desc: "По стране прокатилась волна паники. Распространяются слухи о разграбленных складах оружия и массовом дезертирстве. Что-то назревает..."
 FRA_too_stable_tt: "§YСтабильность ниже 25%§! обеспечивает максимальное увеличение популярности партии"
 FRA_too_europhile_tt: "§YЕвропейизм ниже 50%§! обеспечивает максимальное повышение популярности партии"
 FRA_napoleon_army_reform_tt: "Реформы Великой Армии завершены: §Y[?FRA_grande_armee_reforms_completed|0]/3§!"
 FRA_6threp_tt: "В предстоящих событиях вам предстоит разработать конституцию, которая в итоге может оказаться как принятой, так и нет. Не забудьте поторопиться, пока ажиотаж не утих."
 FRA_cfa_franc_user_exists_tt: "По крайней мере, одна страна до сих пор использует франк §YCFA §!"
 FRA_eco_candidate_exists_tt: "По крайней мере, одна страна до сих пор использует §Yфранк КФА§! или §YФранк КФА (Центральная Африка)§!"
 FRA_corporate_systems_ambition_ft_restructuring: "Амбиции FT 2005 Реструктуризация"
 FRA_corporate_systems_ambition_ft_restructuring_desc: "Рекапитализация, продажа активов и операционные реформы восстанавливают баланс France Télécom. Инвестиции в сетевую инфраструктуру остаются ограниченными, в то время как группа восстанавливает денежный поток."
 FRA_corporate_systems_french_national_champions: "Чемпионы Франции"
 FRA_corporate_systems_french_national_champions_desc: "Франция сохранила жесткое национальное управление критически важными компаниями, исследовательскими центрами и инфраструктурой. Суверенитет и устойчивость высоки, но эта модель требует постоянной общественной поддержки и допускает меньшую степень иностранной интеграции."
 FRA_corporate_systems_china_connected_infrastructure: "Инфраструктура, связанная с Китаем"
 FRA_corporate_systems_china_connected_infrastructure_desc: "Китайские поставщики стали центральным звеном в модернизации французской сети. Быстрое развертывание и более тесные коммерческие связи сопряжены с долгосрочной зависимостью от критически важной инфраструктуры и повышенными рисками замены оборудования."
 FRA_corporate_systems_resilient_multivendor_network: "Устойчивая многовендорная сеть"
 FRA_corporate_systems_resilient_multivendor_network_desc: "Франция распределила закупки критически важных сетевых решений между несколькими поставщиками, сохранив при этом возможность замены любого из них. В результате система стала менее концентрированной и более устойчивой, хотя координация и развертывание происходят медленнее."
 FRA_corporate_systems_events.1.a: "Провести агрессивную реструктуризацию"
 FRA_corporate_systems_events.1.a_tt: "Состояние здоровья Alcatel: §G+0.8§!\nДавление на корпоративный долг: §G-0.6§!\nСтабильность: §R-1.0%§!\nПолучите §YРеструктуризация телекоммуникационного кризиса§! на §Y730 дней§!.\nПолучите один §G5%§! бонус за исследования для §YИнтернет-технологии§!."
 FRA_corporate_systems_events.1.b: "Защита стратегических исследований и разработок"
 FRA_corporate_systems_events.1.b_tt: "Политическая власть: §R-75§!\nСтратегический суверенитет: §G+0.4§!\nЗдоровье Alcatel: §G+0.6§!\nПолучите один бонус к исследованиям §G5%§! для §YКомандно-контрольного оборудования§!."
 FRA_corporate_systems_events.1.c: "Не вешайте трубку"
 FRA_corporate_systems_events.1.c_tt: "Alcatel Health: §R-1.0§!\nДавление корпоративного долга: §R+0,8§!\nСтабильность: §G+0,5%§!"
 FRA_corporate_systems_events.1.d: "Крах бума на рынке телекоммуникационного оборудования оставил Alcatel с падением заказов, избыточными мощностями и растущими убытками. Компания должна решить, что сохранить в процессе реструктуризации."
 FRA_corporate_systems_events.1.t: "Телекоммуникационный пузырь лопнул"
 FRA_corporate_systems_events.10.a: "Приобрести весь бизнес"
 FRA_corporate_systems_events.10.a_tt: "Стратегический суверенитет: §G+0.2§!\nПроизводственные мощности полупроводников: §G+0.4§!\nСостояние микроэлектроники: §G+0.5§!\nПолучите один бонус за исследования §G10%§! для технологии микрочипов §Y§!."
 FRA_corporate_systems_events.10.b: "Приобретение стратегической интеллектуальной собственности и активов."
 FRA_corporate_systems_events.10.b_tt: "Емкость полупроводникового оборудования: §G+0.2§!\nСостояние микроэлектроники: §G+0.3§!\nПолучите один бонус за исследования §G5%§! для технологии микрочипов §Y§!."
 FRA_corporate_systems_events.10.c: "Отказаться от приобретения"
 FRA_corporate_systems_events.10.c_tt: "STMicroelectronics Health: §G+0.2§!"
 FRA_corporate_systems_events.10.d: "Реструктуризация Alcatel поставила под вопрос будущее ее активов в области микроэлектроники. STMicroelectronics может продолжить развитие всего бизнеса, сосредоточиться только на стратегически важных технологиях или сохранить капитал для других приоритетов."
 FRA_corporate_systems_events.10.t: "Компания Alcatel Microelectronics выставлена ​​на продажу."
 FRA_corporate_systems_events.11.a: "Расширить многонациональный альянс в области исследований и разработок."
 FRA_corporate_systems_events.11.a_tt: "Стратегический суверенитет: §R-0.1§!\nПолупроводниковые мощности: §G+0.6§!\nПолучите 2 §G10%§! бонуса к исследованиям для §YТехнологии микрочипов§!."
 FRA_corporate_systems_events.11.b: "Разработать программу под руководством французских специалистов."
 FRA_corporate_systems_events.11.b_tt: "Политическая власть: §R-75§!\nСтратегический суверенитет: §G+0.5§!\nПроизводственные мощности полупроводников: §G+0.4§!\nПолучите один §G10%§! бонус к исследованиям для §YТехнологии микрочипов§!."
 FRA_corporate_systems_events.11.c: "Ограничьте наши капитальные вложения."
 FRA_corporate_systems_events.11.c_tt: "Емкость полупроводникового блока: §G+0.1§!\nSTMicroelectronics Health: §G+0.2§!"
 FRA_corporate_systems_events.11.d: "Компания Motorola готова присоединиться к STMicroelectronics и Philips на заводе Crolles2, расширив альянс в области разработки передовых технологических процессов. Увеличение масштабов производства позволит распределить затраты и опыт, но также ослабит чисто французский контроль."
 FRA_corporate_systems_events.11.t: "Альянс Crolles2 расширяется."
 FRA_corporate_systems_events.13.a: "Объедините беспроводные сети с помощью NXP."
 FRA_corporate_systems_events.13.a_tt: "Производственные мощности полупроводниковых компаний: §G+0.5§!\nСостояние микроэлектроники: §G+0.2§!\nДавление корпоративного долга: §R+0.3§!\nПолучите один бонус за исследования §G10%§! для технологии микрочипов §Y§!."
 FRA_corporate_systems_events.13.b: "Сохраните независимость беспроводной связи ST."
 FRA_corporate_systems_events.13.b_tt: "Стратегический суверенитет: §G+0.3§!\nSTMicroelectronics Health: §R-0.1§!\nПолучите один §G5%§! бонус к исследованиям для §YMicrochip Technology§!."
 FRA_corporate_systems_events.13.c: "Беспроводная связь для дайвинга"
 FRA_corporate_systems_events.13.c_tt: "Емкость полупроводникового блока: §R-0.6§!\nSTMicroelectronics Health: §G+0.4§!"
 FRA_corporate_systems_events.13.d: "Компании STMicroelectronics и NXP договорились объединить свои подразделения по производству беспроводных полупроводников. Совместное предприятие обеспечит больший масштаб в производстве мобильных чипов, однако концентрация двух сложных направлений бизнеса сопряжена со значительными рисками реализации."
 FRA_corporate_systems_events.13.t: "Беспроводная связь ST-NXP"
 FRA_corporate_systems_events.14.a: "Форма ST-Ericsson"
 FRA_corporate_systems_events.14.a_tt: "Европейская интеграция: §G+0.5§!\nПроизводственные мощности в полупроводниковой отрасли: §G+0.6§!\nДавление на корпоративный долг: §R+0.7§!\nПолучите 2 §G10%§! бонуса на исследования для §YMicrochip Technology§!."
 FRA_corporate_systems_events.14.b: "Требуйте ужесточения финансовых лимитов."
 FRA_corporate_systems_events.14.b_tt: "Европейская интеграция: §G+0.5§!\nПроизводственные мощности в полупроводниковой отрасли: §G+0.4§!\nДавление на корпоративный долг: §R+0.3§!\nПолучите один §G10%§! исследовательский бонус для §YMicrochip Technology§!."
 FRA_corporate_systems_events.14.c: "Сохраняйте независимость"
 FRA_corporate_systems_events.14.c_tt: "Стратегический суверенитет: §G+0.4§!\nЕвропейская интеграция: §R-0.2§!\nПолупроводниковые мощности: §R-0.3§!"
 FRA_corporate_systems_events.14.d: "Ericsson Mobile Platforms может объединиться с ST-NXP Wireless в новом европейском совместном предприятии. Объединение опыта в области модемов, радиооборудования и процессоров приложений обещает технологическую глубину, хотя расширение бизнеса может потребовать значительных капиталовложений."
 FRA_corporate_systems_events.14.t: "Европейский чемпион в области беспроводной связи"
 FRA_corporate_systems_events.16.a: "Организуйте выход."
 FRA_corporate_systems_events.16.a_tt: "Производственная мощность полупроводниковых предприятий: §R-0.5§!\nSTMicroelectronics Health: §G+0.8§!\nДавление корпоративного долга: §G-1.0§!\nСтабильность: §R-0.5%§!\nПрирост §YРасходы на выход из бизнеса ST-Ericsson§! для §Y730 дней§!."
 FRA_corporate_systems_events.16.b: "Внедрение технологий и привлечение персонала."
 FRA_corporate_systems_events.16.b_tt: "Политическая власть: §R-75§!\nСтратегический суверенитет: §G+0.4§!\nПроизводственные мощности полупроводников: §R-0.2§!\nСостояние микроэлектроники: §G+0.3§!\nПолучите один бонус к исследованиям §G5%§! для технологии микрочипов §Y§!."
 FRA_corporate_systems_events.16.c: "Продолжить финансирование предприятия."
 FRA_corporate_systems_events.16.c_tt: "Производственная мощность полупроводниковых предприятий: §G+0.3§!\nСостояние микроэлектроники: §R-0.7§!\nДавление корпоративного долга: §R+1.2§!"
 FRA_corporate_systems_events.16.d: "Постоянные убытки ST-Ericsson исчерпали терпение ее владельцев. Франции предстоит решить, какой объем технологических, кадровых и финансовых рисков STMicroelectronics должна взять на себя в связи с провалом предприятия."
 FRA_corporate_systems_events.16.t: "Разборка стратегии ST-Ericsson"
 FRA_corporate_systems_events.17.a: "Привлечь Францию ​​в состав IPCEI"
 FRA_corporate_systems_events.17.a_military: "Военная электроника IPCEI"
 FRA_corporate_systems_events.17.a_tt: "Стратегический суверенитет: §G+0.6§!\nЕвропейская интеграция: §G+1.0§!\nПроизводственные мощности полупроводников: §G+0.8§!\nПолучите 2 бонуса к исследованиям §G10%§! для §YТехнологии микрочипов§!.\nПолучите один бонус к исследованиям §G5%§! для §YКомандно-контрольного оборудования§!."
 FRA_corporate_systems_events.17.b: "Разработайте программу, которая станет первой во Франции."
 FRA_corporate_systems_events.17.b_tt: "Политическая власть: §R-125§!\nСтратегический суверенитет: §G+0.9§!\nЕвропейская интеграция: §R-0.5§!\nПроизводственные мощности полупроводников: §G+0.6§!\nПолучите один бонус к исследованиям §G10%§! для технологии микрочипов §Y§!."
 FRA_corporate_systems_events.17.c: "Предоставьте инвестиции рынку."
 FRA_corporate_systems_events.17.c_tt: "Емкость полупроводникового блока: §R-0.2§!\nSTMicroelectronics Health: §G+0.2§!"
 FRA_corporate_systems_events.17.d: "Пять европейских государств одобрили совместный проект в области микроэлектроники, охватывающий энергоэффективные чипы, силовые полупроводники, датчики, оптические системы и передовые материалы. Компания STMicroelectronics может либо стать центральным участником программы для Франции, либо пойти по более национальному пути."
 FRA_corporate_systems_events.17.t: "Европейская микроэлектроника IPCEI"
 FRA_corporate_systems_events.20.a: "Приобретите Orange и выведите свой бизнес на международный рынок."
 FRA_corporate_systems_events.20.a_tt: "Цифровая инфраструктура: §G+0.8§!\nFrance Télécom/Orange Health: §G+0.8§!\nДавление корпоративного долга: §R+1.2§!\nПолучите один бонус за исследования §G5%§! для §YComputing Technology§!."
 FRA_corporate_systems_events.20.b: "Разработайте более компактную мобильную стратегию."
 FRA_corporate_systems_events.20.b_tt: "Цифровая инфраструктура: §G+0.4§!\nFrance Télécom/Orange Health: §G+0.4§!\nДавление корпоративного долга: §R+0.4§!"
 FRA_corporate_systems_events.20.c: "Отклонить сделку по приобретению"
 FRA_corporate_systems_events.20.c_tt: "Цифровая инфраструктура: §R-0.7§!\nДавление корпоративного долга: §G-0.4§!"
 FRA_corporate_systems_events.20.d: "Компания France Télécom договорилась о приобретении Orange и ее международной мобильной сети. Эта покупка может превратить государственного оператора в глобальную телекоммуникационную группу, но цена окажет серьезное давление на ее баланс."
 FRA_corporate_systems_events.20.t: "France Télécom приобретает Orange"
 FRA_corporate_systems_events.21.a: "Урегулировать и признать убытки"
 FRA_corporate_systems_events.21.a_tt: "France Télécom/Orange Health: §R-0.4§!\nДавление корпоративного долга: §R+0.5§!\nСтабильность: §R-0,5%§!\nПрибыль §Y Расчетное бремя MobilCom§! для §Y730 дней§!."
 FRA_corporate_systems_events.21.b: "Предоставить государственное промежуточное финансирование"
 FRA_corporate_systems_events.21.b_tt: "Политическая власть: §R-100§!\nСтратегический суверенитет: §G+0.4§!\nДавление корпоративного долга: §R+0.2§!\nПолучить §YБремя по урегулированию MobilCom§! на §Y365 дней§!."
 FRA_corporate_systems_events.21.c: "Оспорьте обязательства и сократите расходы."
 FRA_corporate_systems_events.21.c_tt: "France Télécom/Orange Health: §R-0.5§!\nДавление корпоративного долга: §G-0.2§!"
 FRA_corporate_systems_events.21.d: "Стремительная международная экспансия France Télécom привела к серьезным финансовым проблемам, связанным с компанией MobilCom. Компания должна урегулировать задолженность, обратиться за государственной поддержкой или рисковать затяжным спором."
 FRA_corporate_systems_events.21.t: "Расширение достигает предела"
 FRA_corporate_systems_events.22.a: "Рекапитализация и восстановление денежного потока."
 FRA_corporate_systems_events.22.a_tt: "Политическая власть: §R-50§!\nFrance Télécom/Orange Health: §G+1.2§!\nДавление корпоративного долга: §G-1.5§!\nСтабильность: §R-0,5%§!\nПрибыль §YAmbition FT 2005 Реструктуризация§! на §Y730 дней§!."
 FRA_corporate_systems_events.22.b: "Сделайте государство главным спасателем"
 FRA_corporate_systems_events.22.b_tt: "Политическая власть: §R-125§!\nСтратегический суверенитет: §G+0.5§!\nFrance Télécom/Orange Health: §G+1.0§!\nДавление корпоративного долга: §G-1.8§!"
 FRA_corporate_systems_events.22.c: "Избегайте размывания доли и сократите инвестиции."
 FRA_corporate_systems_events.22.c_tt: "Цифровая инфраструктура: §R-0.6§!\nДавление корпоративного долга: §G-1.0§!\nСтабильность: §R-1,0%§!\nПрибыль §YAmbition FT 2005 Реструктуризация§! для §Y730 дней§!."
 FRA_corporate_systems_events.22.d: "Компания France Télécom запустила программу Ambition FT 2005 для рефинансирования долга, восстановления денежного потока и укрепления баланса. Спасательная операция может сочетать рекапитализацию и продажу активов, в большей степени опираться на государственную поддержку или защитить акционеров за счет более масштабных сокращений."
 FRA_corporate_systems_events.22.t: "Амбиции FT 2005"
 FRA_corporate_systems_events.24.a: "Используйте конкурентные закупки"
 FRA_corporate_systems_events.24.a_tt: "Цифровая инфраструктура: §G+0,8§!\nСтабильность: §G+0,5%§!\nПолучите один §G10%§! бонус исследования для §YИнтернет-технологии§!."
 FRA_corporate_systems_events.24.b: "Отдайте предпочтение Alcatel в качестве поставщика."
 FRA_corporate_systems_events.24.b_tt: "Стратегический суверенитет: §G+0.4§!\nТелекоммуникационные мощности: §G+0.4§!\nЦифровая инфраструктура: §G+0.6§!\nAlcatel Health: §G+0.5§!\nПолучите один бонус к исследованиям §G5%§! для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.24.c: "Для обеспечения скорости используйте глобальные источники поставок."
 FRA_corporate_systems_events.24.c_tt: "Стратегический суверенитет: §R-0.5§!\nЦифровая инфраструктура: §G+1.0§!\nЗависимость от китайских поставщиков: §R+2§!\nПолучите один бонус к исследованиям §G5%§! для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.24.d: "Широкополосный доступ, Wi-Fi, 3G, интернет-телевидение и голосовые услуги объединяются в единый национальный сетевой рынок. France Télécom может использовать конкурентные процедуры закупок, поддержать Alcatel в качестве стратегического поставщика или осуществлять глобальные закупки для достижения максимальной скорости."
 FRA_corporate_systems_events.24.t: "Конвергентная широкополосная сеть"
 FRA_corporate_systems_events.25.a: "Объедините группу под брендом Orange."
 FRA_corporate_systems_events.25.a_tt: "Цифровая инфраструктура: §G+0.1§!\nFrance Télécom/Orange Health: §G+0.5§!\nПолучите один бонус за исследования §G5%§! для §YComputing Technology§!."
 FRA_corporate_systems_events.25.b: "Сохранить France Télécom внутри страны"
 FRA_corporate_systems_events.25.b_tt: "Стратегический суверенитет: §G+0.2§!\nFrance Télécom/Orange Health: §R-0.3§!"
 FRA_corporate_systems_events.25.c: "Разделение потребительских и стратегических брендов"
 FRA_corporate_systems_events.25.c_tt: "Стратегический суверенитет: §G+0.1§!\nЦифровая инфраструктура: §G+0.2§!"
 FRA_corporate_systems_events.25.d: "После более чем десяти лет интеграции компания France Télécom готова принять название Orange в качестве названия всей группы. Единая глобальная идентичность обеспечивает ясность, хотя Франция может сохранить свой собственный внутренний или стратегический бренд."
 FRA_corporate_systems_events.25.t: "France Télécom становится оранжевой"
 FRA_corporate_systems_events.26.a: "Реализуйте план инвестиций в сеть."
 FRA_corporate_systems_events.26.a_tt: "Политическая власть: §R-50§!\nЦифровая инфраструктура: §G+1.0§!\nПолучите один бонус к исследованиям §G5%§! для §YКомандно-контрольного оборудования§!."
 FRA_corporate_systems_events.26.b: "Ускорить стратегическое развертывание волоконно-оптических сетей."
 FRA_corporate_systems_events.26.b_tt: "Политическая власть: §R-100§!\nСтратегический суверенитет: §G+0.3§!\nЦифровая инфраструктура: §G+1.5§!\nПолучите один бонус к исследованиям §G10%§! для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.26.c: "Отложить капитальные затраты"
 FRA_corporate_systems_events.26.c_tt: "Цифровая инфраструктура: §R-0.5§!\nFrance Télécom/Orange Health: §G+0.2§!"
 FRA_corporate_systems_events.26.d: "Компания Orange подготовила масштабную инвестиционную программу для фиксированных и мобильных сетей, включающую в себя широкомасштабное развертывание оптоволоконной сети по всей Франции. Государство может рассматривать это как коммерческое строительство, ускорить его как стратегическую инфраструктуру или отложить расходы."
 FRA_corporate_systems_events.26.t: "Волоконно-оптическая сеть как национальная инфраструктура"
 FRA_corporate_systems_events.27.a: "Выберите Nokia и Ericsson"
 FRA_corporate_systems_events.27.a_tt: "Стратегический суверенитет: §G+0.5§!\nЕвропейская интеграция: §G+0.8§!\nЦифровая инфраструктура: §G+0.6§!\nЗависимость от китайского поставщика: §G-1§!\nПолучите один бонус к исследованиям §G10%§! для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.27.b: "Предоставьте Huawei важную роль"
 FRA_corporate_systems_events.27.b_tt: "Стратегический суверенитет: §R-0.8§!\nЦифровая инфраструктура: §G+0.8§!\nЗависимость от китайского поставщика: §R+5§!\nЗатем состоится мероприятие по авторизации 5G."
 FRA_corporate_systems_events.27.c: "Требуется сбалансированная сеть поставщиков."
 FRA_corporate_systems_events.27.c_tt: "Стратегический суверенитет: §G+0.1§!\nЕвропейская интеграция: §G+0.3§!\nЦифровая инфраструктура: §G+0.5§!\nЗависимость от китайского поставщика: §G-1§!\nПолучите один бонус к исследованиям §G5%§! для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.27.d: "Компания Orange должна выбрать поставщиков для своей мобильной сети следующего поколения. Nokia и Ericsson обеспечивают преемственность в европейской телекоммуникационной экосистеме, Huawei предлагает быстрое развертывание, а сбалансированная сеть позволит избежать зависимости от какого-либо одного поставщика."
 FRA_corporate_systems_events.27.t: "Кто построит французскую сеть 5G?"
 FRA_corporate_systems_events.28.a: "Ограничить авторизацию Huawei."
 FRA_corporate_systems_events.28.a_tt: "Стратегический суверенитет: §G+0.6§!\nЕвропейская интеграция: §G+0.3§!\nЗависимость от китайского поставщика: §G-3§!\nПолучение §Y5G Бремя замены поставщика§! на §Y730 дней§!."
 FRA_corporate_systems_events.28.b: "Разрешить долгосрочное развертывание"
 FRA_corporate_systems_events.28.b_tt: "Стратегический суверенитет: §R-0.5§!\nЦифровая инфраструктура: §G+0.4§!\nЗависимость от китайского поставщика: §R+2§!"
 FRA_corporate_systems_events.28.c: "Требуется быстрая диверсификация поставщиков."
 FRA_corporate_systems_events.28.c_tt: "Политическая власть: §R-75§!\nСтратегический суверенитет: §G+0.8§!\nТелекоммуникационные мощности: §G+0.5§!\nЗависимость от китайского поставщика: §G-4§!\nПолучение §Y5G Бремя замены поставщика§! на §Y548 дней§!."
 FRA_corporate_systems_events.28.d: "Французские органы безопасности пересматривают долгосрочные разрешения на использование оборудования Huawei по мере развертывания сетей 5G. Существующее оборудование может потребовать дорогостоящей замены, если правительство не согласится на более глубокую и устойчивую зависимость от Huawei."
 FRA_corporate_systems_events.28.t: "Давление в связи с необходимостью авторизации 5G"
 FRA_corporate_systems_events.3.a: "Подтвердите комбинацию Lucent"
 FRA_corporate_systems_events.3.a_tt: "Стратегический суверенитет: §R-0.4§!\nТелекоммуникационные мощности: §G+0.6§!\nЗдоровье Alcatel: §G+0.7§!\nПолучите один бонус к исследованиям §G10%§! для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.3.b: "Требуйте от Франции стратегических гарантий"
 FRA_corporate_systems_events.3.b_tt: "Политическая власть: §R-50§!\nСтратегический суверенитет: §R-0.1§!\nЗдоровье Alcatel: §G+0.5§!\nПолучите один бонус к исследованиям §G10%§! для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.3.c: "Выступить против слияния"
 FRA_corporate_systems_events.3.c_tt: "Стратегический суверенитет: §G+0.6§!\nТелекоммуникационные мощности: §R-0.2§!\nAlcatel Health: §R-0.5§!"
 FRA_corporate_systems_events.3.d: "Компании Alcatel и Lucent предложили трансатлантическое слияние, призванное объединить их портфели сетевого оборудования. Сделка обещает масштаб, но также поднимает сложные вопросы об интеграции и стратегическом контроле Франции."
 FRA_corporate_systems_events.3.t: "Трансатлантический лидер в сфере телекоммуникаций?"
 FRA_corporate_systems_events.6.a: "Переориентация на IP-технологии и широкополосную связь."
 FRA_corporate_systems_events.6.a_tt: "Производственные мощности телекоммуникаций: §G+0.8§!\nСостояние Alcatel: §G+1.0§!\nДавление на корпоративный долг: §G-0.5§!\nСтабильность: §R-0.5%§!\nПолучите §YРеструктуризацию плана смен§! на §Y730 дней§!.\nПолучите один §G10%§! бонус за исследования для §YИнтернет-технологий§!."
 FRA_corporate_systems_events.6.b: "Создайте защищенного национального чемпиона."
 FRA_corporate_systems_events.6.b_tt: "Политическая власть: §R-125§!\nСтратегический суверенитет: §G+0.8§!\nЗдоровье Alcatel: §G+0.7§!\nПолучите один бонус к исследованиям §G10%§! для §YКомандно-контрольного оборудования§!."
 FRA_corporate_systems_events.6.c: "Отклонить дальнейшую реструктуризацию"
 FRA_corporate_systems_events.6.c_tt: "Alcatel Health: §R-0.9§!\nДавление корпоративного долга: §R+0.6§!"
 FRA_corporate_systems_events.6.d: "Компания Alcatel-Lucent предлагает решительно переориентироваться на IP-сети, облачные системы и сверхширокополосную инфраструктуру. Этот план может восстановить жизнеспособное технологическое ядро, но только после еще одной масштабной реструктуризации."
 FRA_corporate_systems_events.6.t: "План смены"
 FRA_corporate_systems_events.7.a: "Обеспечить выполнение обязательств в области НИОКР."
 FRA_corporate_systems_events.7.a_military: "Обязательства в области военных исследований и разработок"
 FRA_corporate_systems_events.7.a_tt: "Стратегический суверенитет: §G+0.4§!\nЕвропейская интеграция: §G+0.4§!\nПолучите один бонус к исследованиям §G10%§! для §YИнтернет-технологий§!.\nПолучите один бонус к исследованиям §G5%§! для §YКомандно-контрольного оборудования§!."
 FRA_corporate_systems_events.7.b: "Разрешить неограниченную интеграцию"
 FRA_corporate_systems_events.7.b_tt: "Стратегический суверенитет: §R-0.3§!\nAlcatel Health: §G+0.4§!"
 FRA_corporate_systems_events.7.c: "Стремитесь к исключительному французскому контролю"
 FRA_corporate_systems_events.7.c_tt: "Стратегический суверенитет: §G+0.6§!\nЕвропейская интеграция: §R-0.5§!\nAlcatel Health: §R-0.3§!"
 FRA_corporate_systems_events.7.d: "Теперь Nokia контролирует Alcatel-Lucent, в результате чего бывший французский лидер входит в более крупную европейскую сетевую группу. Франции предстоит определить, насколько жестко следует выполнять обязательства в области исследований, занятости и стратегического потенциала."
 FRA_corporate_systems_events.7.t: "Французский столп внутри Nokia"
 FRA_corporate_systems_mobilcom_settlement_burden: "Бремя урегулирования спора с MobilCom"
 FRA_corporate_systems_mobilcom_settlement_burden_desc: "Компания France Télécom признала значительные обязательства, связанные с MobilCom и ее стремительным расширением. Соглашение снижает неопределенность, но его финансирование ограничивает инвестиции."
 FRA_corporate_systems_shift_plan_restructuring: "Реструктуризация графика смен"
 FRA_corporate_systems_shift_plan_restructuring_desc: "Компания Alcatel-Lucent концентрирует свои усилия на IP-сетях, облачных системах и инфраструктуре сверхширокополосной связи, одновременно сокращая расходы и продавая непрофильные активы. Этот переход временно ограничивает объемы производства, пока компания перестраивает свой технологический портфель."
 FRA_corporate_systems_telecom_crash_restructuring: "Реструктуризация после краха телекоммуникационной отрасли"
 FRA_corporate_systems_telecom_crash_restructuring_desc: "Компания Alcatel закрывает предприятия и сокращает производственные мощности после обвала рынка телекоммуникационного оборудования. Эти меры ослабляют долгосрочное давление на баланс компании, но в краткосрочной перспективе негативно сказываются на объеме производства и занятости."
 FRA_corporate_systems_vendor_replacement_burden: "Бремя замены поставщиков 5G"
 FRA_corporate_systems_vendor_replacement_burden_desc: "Ограничения на авторизацию Huawei вынуждают операторов заменять установленное оборудование и пересматривать планы развертывания. Этот переход усиливает долгосрочный контроль над критически важными сетями, но замедляет развертывание."
 FRA_corporate_systems_wireless_exit_costs: "Расходы на выход из бизнеса ST-Ericsson"
 FRA_corporate_systems_wireless_exit_costs_desc: "Расформирование ST-Ericsson потребует списания активов, перевода сотрудников и дорогостоящего разделения технологий и активов. Выход из бизнеса устраняет долгосрочные потери, но в краткосрочной перспективе нарушает исследования в области беспроводных технологий."
 FRA_ps_political_balance: "Политическая линия Социалистической партии"
 FRA_ps_political_balance_desc: "Политический климат, создаваемый правительством Социалистической партии, сохраняется лишь до тех пор, пока оно находится у власти."
 FRA_ps_econ_policy: "Экономическая программа Социалистической партии"
 FRA_ps_econ_policy_desc: "Экономические реформы, проводимые правительством Социалистической партии. Они управляют экономикой только до тех пор, пока находятся у власти."
 FRA_ps_social_balance: "Социальная программа Социалистической партии"
 FRA_ps_social_balance_desc: "Социальная политика устанавливается правительством Социалистической партии. Она действует только до тех пор, пока оно находится у власти."
 FRA_udf_political_balance: "Центристско-либеральная политическая линия"
 FRA_udf_political_balance_desc: "Политический климат, создаваемый центристско-либеральным правительством, сохраняется лишь до тех пор, пока оно находится у власти."
 FRA_udf_econ_policy: "Центристско-либеральная экономическая программа"
 FRA_udf_econ_policy_desc: "Экономические реформы, проводимые при центристско-либеральном правительстве. Они управляют экономикой только до тех пор, пока находятся у власти."
 FRA_udf_social_balance: "Центристско-либеральная социальная программа"
