 EU_mff_draft_mission_desc: "Au cours des négociations, tous les États membres peuvent exercer leur pouvoir politique pour modifier le projet selon leur conception. Les changements apportés au projet influenceront l'opinion des groupes politiques du Parlement européen sur le projet."
