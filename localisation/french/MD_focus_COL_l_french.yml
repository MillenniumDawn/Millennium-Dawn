l_french:
 colombia.1.t: "Opération Phénix"
 colombia.1.d: "Le renseignement colombien a localisé le numéro deux des FARC, Raúl Reyes, dans un camp juste de l'autre côté de la frontière équatorienne. L'armée demande l'autorisation d'une frappe transfrontalière pour l'éliminer. Un succès porterait un coup majeur aux guérilleros, mais violer la souveraineté de l'Équateur pourrait déclencher une crise diplomatique."
 colombia.1.a: "Lancer la frappe transfrontalière"
 colombia.1.b: "Respecter la souveraineté de l'Équateur"
 colombia.2.t: "Violation colombienne de notre souveraineté"
 colombia.2.d: "Les forces armées colombiennes ont mené une opération militaire sur le sol équatorien, tuant le commandant des FARC Raúl Reyes dans une frappe aérienne transfrontalière. C'est une violation sans précédent de notre souveraineté."
 colombia.2.a: "Dénoncer publiquement la Colombie"
 colombia.2.b: "Traiter cela par des canaux discrets"
 colombia.3.t: "La crise andine s'aggrave"
 colombia.3.d: "La Colombie a violé la souveraineté de l'Équateur par une frappe militaire transfrontalière. L'Équateur a dénoncé l'attaque et appelle les alliés régionaux à le soutenir. Le Venezuela doit décider s'il se tient aux côtés de l'Équateur ou s'il reste hors du différend."
 colombia.3.a: "Soutenir l'Équateur et mobiliser des troupes à la frontière"
 colombia.3.b: "Rester en dehors de cela"
 colombia.4.t: "L'impasse andine"
 colombia.4.d: "Une crise diplomatique se noue entre la Colombie, l'Équateur et le Venezuela après la frappe transfrontalière colombienne contre les FARC. L'Équateur et le Venezuela mobilisent des troupes. Les États-Unis doivent décider comment réagir."
 colombia.4.a: "Soutenir la Colombie. Ils combattaient les FARC"
 colombia.4.b: "Appeler toutes les parties à la retenue"
 colombia.5.t: "Le Venezuela se mobilise contre nous"
 colombia.5.d: "Le Venezuela a mobilisé des forces militaires à la frontière colombienne en solidarité avec l'Équateur. La situation s'aggrave rapidement et risque de dégénérer en conflit armé."
 colombia.5.a: "Préparer nos défenses"
 colombia.6.t: "Soutien américain"
 colombia.6.d: "Les États-Unis ont publiquement soutenu les actions de la Colombie contre les FARC, offrant une couverture diplomatique et réaffirmant l'alliance bilatérale."
 colombia.6.a: "Nous sommes reconnaissants du soutien de Washington"
 colombia.7.t: "Sommet du Groupe de Rio"
 colombia.7.d: "Le Groupe de Rio a convoqué un sommet d'urgence pour médier la crise andine. Les dirigeants régionaux pressent pour une résolution diplomatique. La Colombie a l'occasion de s'excuser et de désescalader, ou de tenir bon sur son droit de poursuivre les guérilleros au-delà des frontières."
 colombia.7.a: "S'excuser et se serrer la main"
 colombia.7.b: "Refuser de s'excuser"
 colombia.8.t: "Crise résolue"
 colombia.8.d: "La Colombie a présenté des excuses formelles au sommet du Groupe de Rio. La menace immédiate de conflit armé est passée, bien que les relations restent tendues."
 colombia.8.a: "Accepter les excuses et se retirer"
 colombia.9.t: "Désescalade de la crise andine"
 colombia.9.d: "La crise diplomatique andine a été résolue au sommet du Groupe de Rio. La Colombie s'est excusée d'avoir violé la souveraineté de l'Équateur. Les troupes peuvent être retirées de la frontière."
 colombia.9.a: "Se retirer"
 colombia_news.1.t: "La Colombie frappe les FARC en Équateur"
 colombia_news.1.desc: "Les forces armées colombiennes ont mené une frappe aérienne transfrontalière en territoire équatorien, tuant le commandant senior des FARC Raúl Reyes. Quito a rappelé son ambassadeur et déclaré l'opération une violation flagrante du droit international. Le Venezuela et l'Équateur mobilisent des troupes à la frontière colombienne."
 colombia_news.1.a: "Nous ne nous excuserons pas de combattre le terrorisme"
 colombia_news.1.b: "C'est un acte d'agression contre notre nation"
 colombia_news.1.c: "L'Équateur ne restera pas seul"
 colombia_news.1.d: "La lutte de la Colombie contre les FARC doit respecter les frontières"
 colombia_news.1.e: "Les Andes sont sur le qui-vive"
 colombia_news.1.f: "Une crise régionale en Amérique du Sud"
 colombia_news.2.t: "Crise andine résolue"
 colombia_news.2.desc: "La crise diplomatique andine de 2008 s'est achevée au sommet du Groupe de Rio après que la Colombie a présenté des excuses formelles pour avoir violé la souveraineté de l'Équateur. Les dirigeants régionaux ont salué la poignée de main comme un recul du bord du gouffre, bien que les tensions sous-jacentes entre les trois nations demeurent."
 colombia_news.2.a: "La diplomatie l'emporte, pour l'instant"
 colombia_news.2.b: "Nous acceptons les excuses et avançons"
 colombia_news.2.c: "La région peut à nouveau respirer"
 colombia_news.2.d: "L'Amérique du Sud recule devant le conflit"