 RULE_OPTION_TAI_ROAD_TO_SPLIT: "Der Traum von Taiwan"
 RULE_OPTION_TAI_ROAD_TO_SPLIT_AI_DESC: "Die beiden Seiten der Taiwanstraße werden getrennt regiert und sind einander nicht untergeordnet. Was ist die Republik China?"
 BRM_AI_BEHAVIOR: "@BRM Union von Myanmar"
 RULE_OPTION_BEACON_OF_DEMOCRACY: "Leuchtfeuer der Demokratie"
 RULE_OPTION_BEACON_OF_DEMOCRACY_AI_DESC: "Myanmar wird kompromisslose Reformen vorantreiben und die NLD rasch an die Macht bringen. Anstatt Zugeständnisse an die Tatmadaw zu machen, wird Myanmar verschiedene Unterstützer der politischen Liberalisierung, darunter auch ethnische Rebellengruppen, mobilisieren, um den Einfluss des Militärs auf die Politik ein für alle Mal zu beenden."
 RULE_OPTION_AN_IRON_FIST: "Eine eiserene Faust"
 RULE_OPTION_AN_IRON_FIST_AI_DESC: "Diese Spielregel gilt nur für den Beginn im Jahr 2000 und wird Myanmar dazu zwingen, eine Diktatur zu bleiben. Anstatt wie in der Vergangenheit positiv auf Reformdruck zu reagieren, wird es mit Repression und Totalitarismus reagieren. Um von ihrem Legitimitätsverlust abzulenken, wird die Militärregierung zudem nicht nur Krieg gegen die Rebellengruppen des Landes, sondern auch gegen seine Nachbarn führen."
 RULE_OPTION_NORTHERN_AMBITION: "Nördliche Ambitionen"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "The Swedish far-right will see a surge in popularity, culminating in an attempt to establish a Swedish Empire in Northern Europe."
 SYR_AI_BEHAVIOR: "@SYR Arabische Republik Syrien"
 RULE_OPTION_SYR_HISTORICAL: "Historische KI"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Hafez al-Assad wird von seinem ältesten Sohn Bashar al-Assad beerbt werden. Bashar wird Syrien als ein mit Russland verbündetes Land mit einem ausgewogenen Fokus auf Diplomatie, Militär und Wirtschaft weiterführen."
 RULE_OPTION_SYR_IRON_LADY: "Eiserne Dame von Syrien"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Hafez al-Assad wird von seiner Tochter Bushra al-Assad beerbt werden. Bushra wird einen neutraleren Ansatz zwischen den Großmächten verfolgen und sich dabei auf Diplomatie und Wirtschaft konzentrieren."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Syrischer Wilder"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Hafez al-Assad wird von seinem jüngsten Sohn Maher al-Assad beerbt werden. Maher wird versuchen, Großsyrien zu gründen und eine neue Macht im Nahen Osten zu etablieren. Er wird sich auf militärische und wirtschaftliche Expansion konzentrieren."
 RULE_OPTION_SYR_NEW_ASSAD: "Neuer al-Assad"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Nach dem Damaszener Frühling wird Hafez al-Assad von seinem Bruder Rifaat al-Assad beerbt. Rifaat wird sich auf eine pro-saudische Politik konzentrieren, deren Schwerpunkt auf Diplomatie und Wirtschaft liegt."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Frühling in Damaskus"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "Syrien wird von der Damaskus-Frühling-Bewegung übernommen und in eine Demokratie umgewandelt werden."
 BHR_AI_BEHAVIOR: "@BHR Bahrain"
 SAU_AI_BEHAVIOR: "@SAU Königreich Saudi-Arabien"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST: "Globaler Dschihad – GCC zuerst"
 RULE_OPTION_GLOBAL_JIHAD_GCC_FIRST_AI_DESC: "Saudi-Arabien wird versuchen, seine Wirtschaft zu reformieren und den Golf-Kooperationsrat (GCC) zu einem Superstaat zu vereinen. Dann wird die saudische Monarchie durch einen Aufstand der Al-Qaida gestürzt werden, was zur Gründung eines radikalen islamischen Staates führen wird, der seine fundamentalistische Ideologie mit gewaltsamen Mitteln verbreiten will."
 RULE_OPTION_GLOBAL_JIHAD: "Weltweiter Jihad"
 RULE_OPTION_GLOBAL_JIHAD_AI_DESC: "Die saudische Monarchie wird durch einen Aufstand der Al-Qaida gestürzt werden, was zur Gründung eines radikalen islamischen Staates führen wird, der seine fundamentalistische Ideologie mit gewaltsamen Mitteln verbreiten will."
 RULE_OPTION_ISLAMIC_AWAKENING: "Islamisches Erwachen"
 RULE_OPTION_ISLAMIC_AWAKENING_AI_DESC: "Die von der Muslimbruderschaft beeinflusste Sahwa-Bewegung (Erwachungsbewegung) wird die saudische Monarchie erfolgreich dazu drängen, einer pluralistischen islamischen Demokratie Platz zu machen."
 RULE_OPTION_RETURN_OF_THE_BAATH: "Die Rückkehr der Baath"
 RULE_OPTION_RETURN_OF_THE_BAATH_AI_DESC: "Saudi-Arabien wird sich schrittweise liberalisieren, was der einzigartigen Ideologie des sozialistischen arabischen Nationalismus der Baath-Partei die Möglichkeit bietet, im Land Fuß zu fassen. Das baathistische Arabien wird dann versuchen, ausländische Truppen aus dem Nahen Osten zu vertreiben und sein eigenes Territorium zu erweitern."
 RULE_OPTION_SHIA_REVIVAL: "Shia-Wiederbelebung"
 RULE_OPTION_SHIA_REVIVAL_AI_DESC: "Die Schiiten Saudi-Arabiens werden die durch die politische Liberalisierung gebotene Gelegenheit nutzen, um die Macht in Saudi-Arabien zu übernehmen und das Land an den Iran und Russland anzunähern."
 BRI_AI_BEHAVIOR: "@ENG Vereinigtes Königreich"
 RULE_OPTION_RULE_BRITANNIA: "Herrsche Britannien"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Once, this sceptered isle was known and feared the world over. The British monarch presided over the empire upon which the sun never set. Now however, Britain's international position has fallen into decline. A mere lackey of the United States, a shadow of its former self. The time has come for the British Empire to be restored. The Crown's partisans will break the two-party system, build their movement through the decade and take power outright in 2010 - and then the fleet sails.\n"
