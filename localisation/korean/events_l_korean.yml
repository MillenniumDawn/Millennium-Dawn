 UN.201.a: "제안을 수락한다"
 UN.201.b: "터무니없는 요구를 거부한다!"
 UN.202.t: "[FROM.GetName](이)가 우리의 표를 돌리려 함"
 UN.202.d: "[FROM.GetLeader](이)가 [THIS.GetLeader]에게 은밀히 접근하여, 현재 유엔 총회 결의안에 대한 우리의 표를 [vote_change_too](으)로 바꿔 달라고 요청했습니다. 이들은 우리가 표를 바꾸는 데 동의하면 우리 GDP의 0.25%를 일시불로 지급하겠다고 제안했으며, 이는 표를 바꾼 후에 이행됩니다. 이들의 요청에 동의하는 것이 총회 표결에서 우리의 입장을 바꿀 만한 가치가 있는지 결정해야 합니다."
 UN.202.a: "제안을 수락한다"
 UN.202.b: "터무니없는 요구를 거부한다!"
 UN.203.t: "[FROM.GetName](이)가 우리의 표를 돌리려 함"
 UN.203.d: "[FROM.GetLeader](이)가 [THIS.GetLeader]에게 은밀히 접근하여, 현재 유엔 총회 결의안에 대한 우리의 표를 [vote_change_too](으)로 바꿔 달라고 요청했습니다. 이들은 우리가 표를 바꾸는 데 동의하면 군사, 공군 기지, 위성 시스템 접근권을 제공하겠다고 제안했으며, 이는 표를 바꾼 후에 이행됩니다. 이들의 요청에 동의하는 것이 총회 표결에서 우리의 입장을 바꿀 만한 가치가 있는지 결정해야 합니다."
 UN.203.a: "제안을 수락한다"
 UN.203.b: "터무니없는 요구를 거부한다!"
 UN.204.t: "[FROM.GetName](이)가 우리의 표를 돌리려 함"
 UN.204.d: "[FROM.GetLeader](이)가 [THIS.GetLeader]에게 은밀히 접근하여, 현재 유엔 총회 결의안에 대한 우리의 표를 [vote_change_too](으)로 바꿔 달라고 요청했습니다. 이들은 우리가 표를 바꾸는 데 동의하면 연구, 건설, 생산 보조금과 지원을 제공하겠다고 제안했으며, 이는 표를 바꾼 후에 이행됩니다. 이들의 요청에 동의하는 것이 총회 표결에서 우리의 입장을 바꿀 만한 가치가 있는지 결정해야 합니다."
 UN.204.a: "제안을 수락한다"
 UN.204.b: "터무니없는 요구를 거부한다!"
 UN.300.t: "§Y교육과학문화기구§! §G보조금§! 상실"
 UN.300.d: "§Y교육과학문화기구§! 예산위원회의 연례 예산 검토 결과, 우리가 더 이상 §Y교육과학문화기구§! §G보조금§!을 받기 위한 요건을 충족하지 못하는 것으로 판정되었습니다. 그 결과 우리는 더 이상 보조금 프로그램을 이용할 수 없습니다. 향후 프로그램 요건을 충족하면 다시 신청할 수 있습니다."
 UN.300.a: "알겠다"
 UN.301.t: "§Y산업개발기구§! §G보조금§! 상실"
 UN.301.d: "§Y산업개발기구§! 예산위원회의 연례 예산 검토 결과, 우리가 더 이상 §Y산업개발기구§! §G보조금§!을 받기 위한 요건을 충족하지 못하는 것으로 판정되었습니다. 그 결과 우리는 더 이상 보조금 프로그램을 이용할 수 없습니다. 향후 프로그램 요건을 충족하면 다시 신청할 수 있습니다."
 UN.301.a: "알겠다"
 UN.302.t: "§Y자본개발기금§! §G보조금§! 상실"
 UN.302.d: "§Y자본개발기금§! 예산위원회의 연례 예산 검토 결과, 우리가 더 이상 §Y자본개발기금§! §G보조금§!을 받기 위한 요건을 충족하지 못하는 것으로 판정되었습니다. 그 결과 우리는 더 이상 보조금 프로그램을 이용할 수 없습니다. 향후 프로그램 요건을 충족하면 다시 신청할 수 있습니다."
 UN.302.a: "알겠다"
 recognition.16.t: "[FROM.GetName]을(를) 승인하시겠습니까?"
 recognition.16.d: "[FROM.GetNameDef]이(가) 우리에게 공식적인 외교적 승인을 요청하고 있습니다. 우리가 어떻게 답하든 그들의 주권에 대한 우리 입장을 밝히는 것으로 해석될 것입니다."
 recognition.16.a: "우리는 그들을 승인할 준비가 되어 있지 않다."
 recognition.16.b: "우리는 [FROM.GetName]을(를) 주권 국가로 승인한다."
 recognition.18.t: "[FROM.GetName]을(를) 승인하시겠습니까?"
 recognition.18.d: "[FROM.GetNameDef]의 지위는 세계 무대에서 의문시되고 있습니다. 모든 수도가 입장을 취하고 있습니다. 우리의 입장은 무엇입니까?"
 recognition.18.a: "우리는 그들의 승인을 거부한다."
 recognition.18.b: "우리는 [FROM.GetName]의 주권을 승인한다."
 recognition.31.t: "우리의 승인을 요청하는 [FROM.GetName]"
 recognition.31.d: "[FROM.GetNameDef]이(가) 우리 영토로부터 독립을 선언하고 우리에게 새로운 현실을 받아들일 것을 요구하고 있습니다. 우리의 대답은 그들과의 관계를 규정하고 다른 이들에게 우리의 입장을 알리는 신호가 될 것입니다."
 recognition.31.a: "우리는 이 정권을 결코 승인하지 않을 것이다."
 recognition.31.b: "우리는 [FROM.GetName]의 독립을 인정한다."
 UNSC.10.t: "안전보장이사회 결의안 채택"
 UNSC.10.d: "유엔 안전보장이사회는 [?global.current_sc_vote_nation.GetNameWithFlag]에 관한 결의안을 채택하기로 표결하였습니다. [?global.current_sc_vote_nation.UNSCGetResolutionTypePassDesc]"
 UNSC.10.a: "유념한다."
 UNSC.11.t: "[This.GetNameWithFlag]에 관한 안전보장이사회 결의안"
 UNSC.11.d: "유엔 안전보장이사회는 [This.GetNameWithFlag]에 관한 결의안을 채택하기로 표결하였습니다. [UNSCGetResolutionTypePassDesc]"
 UNSC.11.a: "이 결의안의 통과를 인정한다."
 UNSC_pass_type_1_desc: "§Y210일§! 이내에 모든 공세적 군사 작전의 중지를 요구하는 압박 결의안이 채택되었습니다. 이를 이행하지 않으면 추가 제재를 받게 됩니다."
 UNSC_pass_type_2_desc: "세계 평화에 대한 공세적 위협이 종결될 때까지 무역 및 연구 불이익을 부과하는 경제 제재 결의안이 채택되었습니다."
 UNSC_pass_type_3_desc: "외국 지원병 제한 결의안이 채택되었습니다. 이 결의안을 위반하여 군사 지원병을 보내는 모든 국가는 추가 제재를 받게 됩니다."
 UNSC_pass_type_4_desc: "모든 공세적 분쟁이 종결될 때까지 국제 무기 시장에 대한 접근을 차단하는 무기 금수 결의안이 채택되었습니다."
 COVID_events.0.t: "새로운 바이러스"
 COVID_events.0.d: "우한에서 새로운 바이러스가 출현했습니다. 여러 의사들이 현지 주민들 사이에서 급속히 확산되는 호흡기 질환을 보고하고 있습니다. 확진 사례는 일주일도 안 되어 한 자릿수에서 수십 건으로 늘었습니다."
 COVID_events.0.a: "예의 주시하라."
 COVID_events.1.t: "내부 고발 의사들"
 COVID_events.1.d: "여러 의사들이 새로운 바이러스를 사스에 비유하며 소셜 미디어에 보고를 공유하기 시작했습니다. 지방 당국은 지침을 원하고 있습니다. 우리는 공황을 막기 위해 이 보고들을 막을 수도, 확산되도록 허용하고 대중의 경각심을 감수할 수도 있습니다."
 COVID_events.1.a: "입을 막아라."
 COVID_events.1.b: "진실이 드러나게 하라."
 COVID_events.2.t: "팬데믹 확정"
 COVID_events.2.d: "세계보건기구는 신종 코로나바이러스를 세계적인 보건 비상사태로 확정하였습니다. 병원은 한계에 달했으며 바이러스는 우리 국경 너머로 퍼지고 있습니다. 이는 앞으로 수년간 우리 경제를 재편할 것입니다."
 COVID_events.2.a: "충격에 대비하라."
 COVID_events.3.t: "COVID-19 출현"
 COVID_events.3.d1: "치명적인 신종 코로나바이러스가 중국에서 퍼져 나왔으며, 중국 당국은 초기에 발병 보고를 억눌렀습니다. 지연된 대응으로 인해 바이러스는 통제되지 않은 채 국경을 넘어 확산되었습니다."
 COVID_events.3.d2: "중국에서 시작된 치명적인 신종 코로나바이러스가 세계적 팬데믹으로 선언되었습니다. 중국 의사들의 초기 경고에도 불구하고 바이러스는 국경을 넘어 급속히 확산되었습니다."
 COVID_events.3.a: "대응을 준비하라."
 COVID_events.4.t: "팬데믹이 [This.GetName]에 도달"
 COVID_events.4.d: "우리 국경 내에서 COVID-19 확진 사례가 확인되었습니다. 병원은 환자 급증에 대비하고 있으며 대중의 공포가 커지고 있습니다. 시민들이 자가 격리에 들어가면서 경제 활동이 멈춰 서고 있습니다."
 COVID_events.4.a: "모든 것을 봉쇄하라."
 COVID_events.5.t: "세계 공급망 붕괴"
 COVID_events.5.d: "팬데믹은 국제 무역을 황폐화시켰습니다. 공장 폐쇄, 항만 중단, 운송 병목 현상으로 인해 전 세계적으로 부품과 원자재가 심각하게 부족해졌습니다."
 COVID_events.5.a: "남은 것이라도 비축하라."
 pandemic_events.1.t: "신종플루 팬데믹"
 pandemic_events.1.d: "멕시코에서 새로운 H1N1 인플루엔자 변종이 확인되어 주민들 사이에서 급속히 확산되고 있습니다. 확진 사례가 늘어나고 바이러스가 국경을 넘을 위험이 있어 세계보건기구는 상황을 면밀히 주시하고 있습니다."
 pandemic_events.1.a: "경보를 울려라."
 pandemic_events.2.t: "H1N1이 [This.GetName]에 도달"
 pandemic_events.2.d: "우리 국경 내에서 H1N1 신종플루 확진 사례가 확인되었습니다. 처음 우려했던 것보다 치명적이지는 않지만 바이러스는 빠르게 확산되며 의료 자원에 부담을 주고 있습니다."
 pandemic_events.2.a: "마스크를 배포하고 최선을 기대하자."
 pandemic_events.3.t: "메르스 발병"
 pandemic_events.3.d: "중동호흡기증후군을 일으키는 새로운 코로나바이러스가 우리나라에서 확인되었습니다. 이 바이러스는 낙타에서 인간으로 전파되는 것으로 보이며, 감염자의 치명률이 불안할 정도로 높습니다. 병원들은 격리 병동을 준비하고 있습니다."
 pandemic_events.3.a: "발병을 차단하라."
 pandemic_events.4.t: "서아프리카 에볼라 발병"
 pandemic_events.4.d: "기니 시골 지역에서 에볼라 바이러스 발병이 확인되었습니다. 출혈열은 공포스러운 속도로 지역 사회를 통해 확산되며 현지 진료소를 압도하고 있습니다. 즉각적인 개입이 없다면 전염병은 지역 전체를 집어삼킬 수 있습니다."
 pandemic_events.4.a: "신이시여, 우리 모두를 도우소서."
 pandemic_events.5.t: "에볼라가 [This.GetName]에 확산"
 pandemic_events.5.d: "서아프리카 전염병이 봉쇄를 뚫으면서 우리 국경 내에서 에볼라 확진 사례가 확인되었습니다. 의료진은 극도의 위험에 처해 있으며 국제 원조 기구들은 대응에 분주합니다."
 pandemic_events.5.a: "도움이 필요하다. 지금 당장."
 pandemic_events.6.t: "콩고에서 에볼라 재발"
 pandemic_events.6.d: "콩고 민주공화국 동부 지방에서 새로운 에볼라 발병이 일어났습니다. 이 지역의 무력 충돌이 봉쇄 노력을 복잡하게 만들고 있으며, 의료진은 외부인을 의심하는 민병대의 공격에 직면하고 있습니다."
 pandemic_events.6.a: "무장 호위 아래 의료팀을 파견하라."
 pandemic_events.7.t: "[This.GetName]의 메르스 사례"
 pandemic_events.7.d: "우리나라에서 중동호흡기증후군 사례가 발견되었으며, 사우디아라비아에서 온 여행객이 옮긴 것으로 추정됩니다. 보건 당국은 공항과 병원에서 검역 절차를 마련하고 있습니다."
 pandemic_events.7.a: "모든 여행객을 검사하라."
 pandemic_events.8.t: "[This.GetName]의 에볼라 사례"
 pandemic_events.8.d: "에볼라 사례가 콩고 민주공화국에서 국경을 넘어왔습니다. 이 지역의 국경 간 이동 때문에 봉쇄가 극히 어려우며, 의료진은 접촉자를 추적하느라 분주합니다."
 pandemic_events.8.a: "즉시 국경을 폐쇄하라."
 pandemic_events.9.t: "한국 메르스 발병"
 pandemic_events.9.d: "중동에서 돌아온 단 한 명의 환자가 파괴적인 병원 내 슈퍼전파 사건을 촉발했습니다. 환자와 직원들이 병동 간에 바이러스를 퍼뜨리면서 바이러스가 의료 시설을 휩쓸고 있습니다. 백 건이 넘는 확진 사례가 확인되고 수십 명의 사망자가 보고되어, 우리 감염 통제 절차의 심각한 결함이 드러났습니다."
 pandemic_events.9.a: "영향받은 모든 병원을 폐쇄하라."
 influence.60.t: "[event_target:coup_contest_victim.GetName]의 쿠데타"
 influence.60.d: "우리 정보기관은 많은 이들이 의심하던 사실을 확인했습니다. [event_target:coup_contest_sender.GetNameWithFlag]이(가) [event_target:coup_contest_victim.GetNameWithFlag]에서 성공적인 §R쿠데타§!를 획책하여 자국의 이익에 우호적인 새 정권을 세웠습니다. 우리 또한 [event_target:coup_contest_victim.GetName]에서 상당한 §H영향력§!을 보유하고 있으며, 행동하기로 마음먹는다면 이 상황에서 속수무책은 아닙니다. 우리의 선택지는 외교적 규탄에서부터 구체제에 대한 비밀 지원에 이르기까지 다양합니다. 각각 대가가 따릅니다. 아무것도 하지 않으면 더 큰 대가를 치를 수도 있습니다."
 influence.60.a: "공개적으로 규탄하고 [event_target:coup_contest_sender.GetName]을(를) 제재한다"
 influence.60.f: "[event_target:coup_contest_sender.GetName]에 대해 표적형 §H경제 제재§!를 부과한다"
 influence.60.b: "구야당을 비밀리에 지원하고 우리 영향력을 밀어붙인다"
 influence.60.e: "§R군사 개입§!: 저항 세력을 무장시키고 [event_target:coup_contest_sender.GetName]에 대해 무력시위를 한다"
 influence.60.c: "새로운 현실을 받아들이고 넘어간다"
 influence.61.t: "[event_target:coup_contest_victim.GetName]의 내전"
 influence.61.d: "[event_target:coup_contest_sender.GetNameWithFlag]의 쿠데타 시도는 오히려 그들 자신에게 역풍이 되었습니다. [event_target:coup_contest_victim.GetNameWithFlag]은(는) §R내전§! 상태이며 구체제는 여전히 싸우고 있습니다. 우리의 §H영향력§!은 어느 쪽이 승리하는지에 대해 우리에게 실질적인 이해관계를 부여합니다. 구정부를 무장시키면 [event_target:coup_contest_sender.GetName]이(가) 성과를 굳히는 것을 막을 수 있을지도 모릅니다. 자금만 보내면 위험을 분산할 수 있습니다. 전면적으로 개입하면 우리가 실권을 쥐게 됩니다. 개입하지 않으면 다른 이들이 결과를 결정하게 놔두는 셈입니다."
 influence.61.a: "구체제를 무장시킨다: 무기, 장비, 정치적 지지"
 influence.61.b: "구체제가 버틸 수 있도록 조용히 경제 원조를 보낸다"
 influence.61.e: "§R전면적 군사 개입§!: 구체제의 승리에 전력을 다한다"
 influence.61.c: "내전에 개입하지 않는다"
 News_influence.7.t: "[FROM.GetNameWithFlag]의 [event_target:coup_contest_sender.GetNameWithFlag] 규탄"
 News_influence.7.d: "[FROM.GetNameWithFlag]은(는) 오늘 [event_target:coup_contest_victim.GetNameWithFlag]에서 최근 일어난 쿠데타에 [event_target:coup_contest_sender.GetNameWithFlag]이(가) 관여했다는 의혹에 대해 신랄한 규탄 성명을 발표했습니다. 외교적 항의, 표적형 §H제재§!, 관계 경색이 모두 검토 대상에 올라 있습니다. [event_target:coup_contest_sender.GetName]의 외무부는 이 비난을 '근거 없는 정치적 연극'이라며 일축했지만, 국제 여론은 빠르게 강경해지고 있습니다."
 News_influence.7.a: "영향력 전쟁의 서막이다"
 News_influence.8.t: "[event_target:coup_contest_victim.GetName]의 구야당을 지원하는 [FROM.GetNameWithFlag]"
 News_influence.8.d: "정보 소식통들은 관측통들이 몇 주째 의심해 온 사실을 확인해 주었습니다. [FROM.GetNameWithFlag]이(가) [event_target:coup_contest_victim.GetNameWithFlag] 내부의 쿠데타 이전 야당에 §H자금§!과 §H정치적 지원§!을 은밀히 제공하고 있다는 것입니다. 국내의 민주 세력들은 갑자기 조직력이 좋아지고 자금이 풍부해졌으며, 눈에 띄게 목소리가 커졌습니다. [event_target:coup_contest_victim.GetName]의 §H쿠데타 정권§!은 이러한 활동을 '용납할 수 없는 외국의 개입'이라고 불렀습니다. 그들이 권력을 잡기 위해 벌인 바로 그 활동인데도 말입니다."
 News_influence.8.a: "[event_target:coup_contest_victim.GetName]을(를) 둘러싼 다툼은 끝나지 않았다"
 News_influence.9.t: "[event_target:coup_contest_victim.GetName]의 구체제를 무장시키는 [FROM.GetNameWithFlag]"
 News_influence.9.d: "[event_target:coup_contest_sender.GetNameWithFlag]의 어설픈 쿠데타 이후 [event_target:coup_contest_victim.GetNameWithFlag]이(가) §R내전§!에 휩싸이자, [FROM.GetNameWithFlag]은(는) 중립의 가식을 모두 버렸습니다. [FROM.GetName]발 화물기들이 §H소형 화기§!, §H차량§!, 그리고 여러 소식통에 따르면 군복을 입은 '고문관들'을 싣고 정부 통제 지역에 착륙하고 있습니다. 대리전은 이제 공공연하게 드러났습니다."
 News_influence.9.a: "긴 싸움이 될 것이다"
 News_influence.10.t: "[event_target:coup_contest_victim.GetName] 사태를 둘러싼 군사 개입에 나선 [FROM.GetNameWithFlag]"
 News_influence.10.d: "[event_target:coup_contest_victim.GetNameWithFlag]에서 일어난 [event_target:coup_contest_sender.GetNameWithFlag]의 쿠데타에 대한 가장 수위 높은 대응으로, [FROM.GetNameWithFlag]은(는) 공식적인 §R군사 개입§!을 발표했습니다. 표현은 절제되어 있으나 그 실체는 그렇지 않습니다. 전진 배치된 병력, 쿠데타 이전 정부를 지원하라는 상시 명령, 그리고 [event_target:coup_contest_sender.GetName]의 기정사실화에 대한 공공연한 경멸이 그것입니다. 세계 시장은 혼란에 빠졌습니다. 국제연합 안전보장이사회는 긴급 회의에 소집되었습니다."
 News_influence.10.a: "선을 넘었다"
 influence.52.e: "§H현대식 장비§! 패키지 (중대전차, 지대공 미사일, 드론)"
 influence.52.a_preview_tt: "소화기, 경대전차 무기, 대공 장비를 보낸다"
 influence.52.b_preview_tt: "주력 전차, 수륙양용 및 특수 전차, 다목적 차량을 보낸다"
 influence.52.e_preview_tt: "중대전차 미사일, 지대공 미사일, 군용 드론을 보낸다"
 influence.57.t: "어느 규모의 패키지입니까?"
 influence.57.d: "무엇을 보낼지는 정했습니다. 이제 §H얼마나 보낼지§!를 결정해야 합니다. 더 큰 패키지는 더 많은 §H정치적 자본§!을 소모하고, 더 많은 §R세계 긴장도§!를 발생시키며, 국제 뉴스 보도를 불러일으킵니다."
 influence.57.a: "§H소규모§! 패키지를 보낸다"
 influence.57.b: "§H중규모§! 패키지를 보낸다"
 influence.57.c: "§H대규모§! 패키지를 보낸다"
 influence.57.e: "다시 생각해 보니 취소한다"
 News_influence.11.t: "[FROM.GetName]에 대규모 무기 패키지를 보내는 [FROM.FROM.GetName]"
 News_influence.11.d: "[FROM.FROM.GetName]은(는) [FROM.GetName]에 §H대규모 군사 원조 패키지§!를 제공한다고 발표했습니다. 수천 정의 소화기, 차량, 지원 장비가 포함되어 있습니다. 분석가들은 이번 이전이 [FROM.GetName]의 방위에 대한 [FROM.FROM.GetName]의 공약이 굳건해졌음을 나타낸다고 지적합니다. 경쟁국들은 격분했고, 동맹국들은 다음 차례가 누구일지 지켜보고 있습니다."
 News_influence.11.a: "무기는 계속 흘러간다"
 News_influence.12.t: "[FROM.GetName]에 첨단 무기를 이전하는 [FROM.FROM.GetName]"
 News_influence.12.d: "세계 무기 시장의 모든 금기선을 넘는 이전을 통해, [FROM.FROM.GetName]은(는) §H중대전차 미사일§!, §H지대공 체계§!, §H전투 드론§!을 [FROM.GetName]에 선적했습니다. 이 무기들은 하나하나가 지역 분쟁을 전쟁으로 바꿀 만한 종류의 것입니다. [FROM.GetName]의 경쟁국들은 이를 직접적인 위협이라고 부르고 있습니다. 각국 수도의 외교 전화선에 불이 붙고 있습니다."
 News_influence.12.a: "현대전에 현대식 무기가 더해졌다"
 influence.2.t: "[FROM.GetName]에 경제 원조를 제안하시겠습니까?"
 influence.2.d: "우리는 [FROM.GetName]에 대한 경제 원조 패키지 작성에 착수하기로 결정했습니다. 우리 국고에서 일정 금액을 직접 이전할 수 있습니다. 이러한 관대함은 관계를 개선하고 우리에게 [FROM.GetName]에서의 영향력을 안겨 줄 것입니다. 더 많이 줄수록 더 많은 영향력을 얻게 될 것입니다.\n\n"
 influence.2.a: "경제 원조로 §G250억§!을 보낸다."
 influence.2.b: "경제 원조로 §G500억§!을 보낸다."
 influence.2.c: "경제 원조로 §G750억§!을 보낸다."
 influence.2.e: "경제 원조로 §G1000억§!을 보낸다."
 generic.5.f: "그들 없이 지내는 편이 낫다."
 ecuadornews.1.t: "에콰도르 군사 쿠데타"
 ecuadornews.1.d: "에콰도르군은 깊은 정치·경제 위기 속에서 개입하여 하밀 마우아드 대통령을 권좌에서 제거했습니다. 카를로스 멘도사 장군이 이끄는 고위 장교들은 민간 정부와 CONAIE 시위 지도부를 모두 배제한 채 상황을 장악했습니다. 군은 이 조치를 안정을 회복하기 위한 임시 조치라고 설명하지만, 민정이 얼마나 빨리 복귀할지, 어떤 형태가 될지는 여전히 불분명합니다."
 ecuadornews.1.a: "흥미롭군."
 ecuadornews.2.t: "에콰도르 군사 쿠데타"
 ecuadornews.2.d: "경제 위기와 정부의 논쟁적인 개혁은 에콰도르를 한계점까지 몰아붙였습니다. 에콰도르 원주민 민족 연합(CONAIE)이 이끈 대규모 시위와 여러 하급 장교의 이탈 이후, 야권 지도자들은 국가구국군사위원회의 결성을 발표했습니다. 선포된 국가구국군사위원회는 국가 통합을 상징하는 3자 지도체제로 제시되었습니다. 원주민 지도자 안토니오 바르가스, 민간인 판사 카를로스 솔로르사노, 군 대표 루시오 구티에레스 장군으로 구성되어 있습니다."
 ecuadornews.2.a: "흥미롭군."
 ecuadornews.3.t: "에콰도르 국가구국군사위원회 붕괴"
 ecuadornews.3.d: "키토에서 민군 합동 군사위원회를 결성하려던 시도가 실패했습니다. CONAIE와 동조 단체들의 대규모 시위와 의회 점거에도 불구하고, 군 수뇌부는 새 정부를 지지하기를 거부했습니다. 카를로스 멘도사 장군이 상황을 장악하여 시위 지도부를 배제하고 군사위원회 구상을 종결시켰습니다. 군의 지지 없이 연합은 빠르게 와해되었으며 음모자 다수가 체포되었습니다."
 ecuadornews.3.a: "흥미롭군."
 ecuador.1.t: "달러 채택"
 ecuador.1.d: "1998~1999년 금융 위기 이후 경제 불안이 나라를 계속 짓누르고 있습니다. 하밀 마우아드 대통령은 인플레이션을 멈추고 금융 시스템에 대한 신뢰를 회복하기 위해 경제의 달러화를 제안합니다. 동시에 정부는 군 예산의 60% 이상을 삭감하여 군과의 관계에 심각한 타격을 입힙니다."
 ecuador.1.a: "달러화를 추진한다"
 ecuador.1.b: "일부 급진적 개혁을 철회한다"
 ecuador.2.t: "키토의 봉기"
 ecuador.2.d: "정부의 경제 계획에 대한 반응으로, 원주민 군중이 키토로 몰려들어 하밀 마우아드 대통령의 파면을 요구합니다. 시위대는 의회와 대법원을 점거하여 국가를 마비시키고 정부의 질서 유지 무능력을 드러냅니다. 수도에서 압력이 높아지면서 보안군의 충성심과 행정부의 존속이 점점 더 의문시됩니다."
 ecuador.2.a: "질서를 유지한다"
 ecuador.3.t: "국가구국정부"
 ecuador.3.d: "순전히 상징적인 행위로, 시위 지도자들은 국영 방송에서 민중의 뜻을 대표한다고 주장하며 이른바 국가구국군사위원회의 창설을 발표합니다. 이 선언은 폭넓은 대중의 지지를 받고 민간 정부의 권위를 더욱 약화시킵니다. 군사위원회는 카를로스 멘도사 장군이 이끄는 것으로 제시됩니다"
 ecuador.3.a: "루시오 구티에레스 장군이 지도부를 맡는다"
 ecuador.3.b: "우리는 앞으로 나아간다"
 ecuador.4.t: "3인 군사위원회"
 ecuador.4.d: "선포된 국가구국군사위원회는 이제 국가 통합을 상징하는 3자 지도체제로 제시됩니다. 원주민 지도자 안토니오 바르가스, 민간인 판사 카를로스 솔로르사노, 군 대표 루시오 구티에레스 장군으로 구성되어 있습니다."
 ecuador.4.a: "색다른 전개"
 ecuador.5.t: "군 수뇌부, 정부 지지 거부"
 ecuador.5.d: "여론은 대체로 CONAIE의 의회 점거와 마우아드 대통령의 사임 요구를 지지하지만, 직접적인 군부 통치에 대한 의욕은 거의 없습니다. 이를 알고 있는 카를로스 멘도사 장군은 연합을 배제하고 협상을 장악합니다. 에콰도르의 정치·경제 엘리트들과 긴밀히 연결된 군 수뇌부는 군사위원회의 계획을 전면 거부한 레온 페브레스 코르데로 같은 인물들과 미국의 경제 제재 위협에 더욱 설득되어, 시위 지도부와의 결정적인 결별을 강행합니다."
 ecuador.5.a: "멘도사 장군이 구스타보 노보아에게 권력을 넘긴다"
 ecuador.5.b: "물러나지 않는다"
 recognition.45.t: "UN 가입을 추진하기에 충분한 승인"
 recognition.45.d: "이제 충분한 수의 UN 회원국이 우리의 주권을 승인하여, 유엔 의석을 신뢰성 있게 추진할 수 있게 되었습니다. 우리는 총회에 가입을 청원할 수 있습니다."
 recognition.45.a: "신청을 시작한다."
 anti_bully.2.t: "대중의 전쟁 피로"
 anti_bully.2.d: "우리는 전쟁이 최선의 방책이라고 결정했습니다. 그러나 국민의 지지를 유지하려면 이 전쟁을 신속하게 승리로 이끌거나 신속하게 적의 영토로 진격해야 합니다. 국민은 이 전쟁이 얼마나 필요한지 이해하는 한 행진할 것입니다. 군화가 행진하고 북이 울리니, [FROM.GetName]과(와) 전쟁을 벌일 때가 왔습니다!\n\n§Y이로 인해 대중의 전쟁 피로 체계가 발동합니다§!\n"
 anti_bully.2.a: "우리는 반드시 이겨야 한다!"
 UNSC.12.t: "[This.GetNameWithFlag]에 관한 안전보장이사회 결의안 부결"
 UNSC.12.d: "유엔 안전보장이사회는 [This.GetNameWithFlag]에 관한 결의안을 부결시켰습니다. 필요한 [?global.un_sc_required_yes]표의 §G찬성§!표 중 [?global.security_council_vote_yes^num]표를 얻었으며 거부권은 행사되지 않았습니다. §Y안전보장이사회§!에서는 단순 과반으로 충분하지 않습니다. 이번에는 어떤 조치도 채택되지 않습니다."
 UNSC.12.a: "결과를 유념한다."
 UNSC.6.t: "[?global.current_sc_vote_nation.GetName]의 군축"
 UNSC.6.d: "[?global.current_sc_vote_nation.GetName](이)가 군축 의무를 중대하게 위반하고 있음을 선언하는 결의안이 안전보장이사회에 상정되었습니다. 이는 준수할 마지막 기회를 제공하며, 그렇지 않을 경우 심각한 결과가 따를 것이라고 경고합니다.\n\n이 결의안은 무력 사용을 승인하지 않으며, 발의국들도 그 점을 알고 있습니다. 이러한 누락은 필요한 표를 얻기 위한 대가입니다. 이 결의안이 그들에게 가져다주는 것은 허가가 아닌 명분이며, 부결되면 둘 다 얻지 못하게 됩니다.\n\n$unsc_vote_pass_tt$"
 UNSC.7.t: "[?global.current_sc_vote_nation.GetName]에 수배 테러리스트 인도 요구"
 UNSC.7.d: "[?global.current_sc_vote_nation.GetName]에 자국 영토에 은신 중인 수배 테러리스트를 인도하도록 요구하는 결의안이 안전보장이사회에 상정되었습니다. 증거는 이 회의장에 제시되었으며, 지금까지 해당 정권의 대답은 침묵이었습니다.\n\n결의안이 통과되면 [?global.current_sc_vote_nation.GetName](은)는 요구가 충족될 때까지 유엔의 제재에 직면하게 됩니다.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_6_desc: "해당 국가가 중대한 위반 상태에 있다고 판단하고 심각한 결과를 경고하는 군축 결의안이 채택되었습니다. 무력 사용 승인에까지는 이르지 않습니다."
 UNSC_pass_type_7_desc: "수배 테러리스트의 인도를 요구하는 결의안이 채택되었습니다. 유엔의 제재는 요구가 충족될 때까지 유지됩니다."
 influence.62.t: "우리 정부를 장악한 외국 로비스트들"
 influence.62.d: "지난 회기 동안 외국 자본에 대한 제한을 요구하던 위원회 위원장들이 조용해졌습니다. 부처 직원들은 우리의 전화보다 [?var:ROOT.influence_lobbied_by.GetNameWithFlag]의 대사관에서 온 전화에 먼저 답하며, 평소라면 외국 영향력에 대한 압박을 이끌었을 의원들은 이제 우리가 추적할 수 없는 고용 계약에 묶여 있습니다. 불법적인 일은 결코 입증되지 않겠지만, 앞으로 몇 달 동안 우리 정부에는 이 싸움을 벌일 의지도, 그에 쓸 표도 남아 있지 않습니다."
 influence.62.a: "우리는 손발이 묶였다"
 hongkong_news.10.t: "중국에 합병된 홍콩"
 hongkong_news.10.d: "중국이 홍콩 특별행정구를 공식적으로 흡수하여 별도의 지위를 종식시켰습니다. [CHI.GetLeader]은(는) 이 조치를 홍콩의 조국 복귀의 정점이라고 규정했으며, 이 영토의 기관과 행정은 이제 베이징의 직접적인 중앙 통제 아래 놓이게 되었습니다."
 hongkong_news.10.a: "진주가 품으로 돌아왔다."
 hongkong_news.10.b: "중대한 사태 전개다."
 generic.6.a: "우리는 함께 민주주의를 수호할 것이다."
 generic.6.b: "아무도 우리에게 맞설 수 없다!"
 generic.6.c: "노동자의 고난에 이보다 훌륭한 옹호자들은 없을 것이다!"
 generic.6.e: "지금은 서로의 차이를 접어 두자."
 generic.7.b: "그렇다면 그들 또한 분쇄할 것이다!"
 generic.7.c: "그들의 혁명은 부패했다!"
 generic.7.e: "우리 사이의 차이가 너무 컸다."
 GLOBAL_angolan_civil_war_over: "앙골라 내전 종식"
 AFG_news.1.t: "아프가니스탄 내전 소강"
 AFG_news.1.TAL.d: "아프가니스탄군과 서방 동맹국들의 최선의 노력에도 불구하고, 탈레반은 수도 카불을 포함한 모든 주요 도시를 완전히 장악하는 데 성공하였습니다. 현재 미국에 머물고 있는 아프가니스탄 대통령 [AFG.GetLeader]을(를) 비롯한 대부분의 정부 관료들은 잠적하거나 망명하였습니다.\n\n탈레반의 승리는 이 지역과 전 세계에서 테러 공격의 빈도를 높일 것이 분명합니다."
 AFG_news.1.AFG.d: "아프가니스탄 정부는 탈레반에 대한 승리를 선언하였습니다. 가장 강력한 거점과 도시 대부분에서 탈레반 세력이 제거되었으며, 남은 전투원 대부분은 국경을 넘어 파키스탄으로 도주하였습니다. 탈레반은 소수의 거점과 세포 조직으로 축소되었으나, 반란은 규모가 줄어든 채로 향후 수년간 지속될 것으로 예상됩니다.\n\n이 승리는 재건된 아프가니스탄군의 효율성과 아프가니스탄 정부의 결의를 보여주었습니다."
 AFG_news.1.a: "흥미롭군"
 AFG_news.2.t: "아프가니스탄, 파슈투니스탄 영유권 주장"
 AFG_news.2.d: "파키스탄 내 폭력 사태가 급증함에 따라, 아프가니스탄 정부는 파슈툰인이 거주하는 파키스탄 지역에 대한 영유권 주장을 강화하였습니다. 두란드 선(오늘날 아프가니스탄과 파키스탄의 국경)은 영국의 통치 아래 아프가니스탄 토후국의 영토를 파키스탄으로 이전시켰기에 오랫동안 양국 간 분쟁의 원인이 되어 왔습니다.\n\n그 지역에 거주하는 파슈툰인들 스스로는 이 사태에 크게 들뜬 것 같지 않으며, 다수는 파키스탄 안에서 사는 것에 만족하고 있습니다. 아프가니스탄이 무력 외에는 영유권 주장을 관철할 방법이 없을 가능성이 높습니다."
 AFG_news.2.a: "흥미롭군"
 AFG_news.3.t: "아프가니스탄, 발루치스탄 영유권 주장"
 AFG_news.3.d: "파키스탄의 위기가 깊어지면서 아프가니스탄은 영유권 주장을 확대하고 있습니다. 오늘 아프가니스탄 정부는 파슈투니스탄에 더해 발루치스탄 또한 아프가니스탄의 불가분한 일부라고 발표하였습니다."
 AFG_news.3.a: "우려스러운 사태"
 AFG_news.4.t: "아프가니스탄, 파키스탄 침공"
 AFG_news.4.d: "영유권 주장을 확보하기 위해, 아프가니스탄은 영토를 얻는 더 직접적인 방법으로 움직였습니다. 파슈툰인의 안전을 명분으로, 이들은 국경을 넘어 파키스탄으로 병력을 이동시키기 시작했습니다."
 AFG_news.4.a: "우려스러운 사태"
 AFG_news.5.t: "힘을 합치는 탈레반"
 AFG_news.5.d: "아프가니스탄 탈레반과 파키스탄 탈레반은 공동의 위협에 함께 맞서기 위해 힘을 합치기로 결정하였습니다. 이는 중앙아시아의 세력 균형에 있어 큰 변화입니다."
 AFG_news.5.a: "걱정스럽군."
 AFG_news.6.t: "아흐마드 샤 마수드 암살"
 AFG_news.6.d: "탈레반에 맞선 아프가니스탄 저항의 주요 지도자 아흐마드 샤 마수드가 알카에다에 의해 암살되었습니다. 기자로 위장한 알카에다 조직원 두 명이 장비에 숨긴 폭발물을 터뜨렸습니다. 마수드는 중상을 입고 군용 헬리콥터로 후송되었으나 병원에 도착하기 전에 부상으로 사망하였습니다.\n\n판지시르의 사자로 알려진 마수드는 처음에는 소련의 점령에, 이후에는 탈레반에 맞선 저항의 상징이었습니다."
 AFG_news.6.a: "큰 손실이다."
 AFG_events.3.t: "아흐마드 샤 마수드 암살"
 AFG_events.3.d: "판지시르의 사자 아흐마드 샤 마수드가 오늘 자살 폭탄 테러범의 표적이 되었습니다. 기자로 위장한 알카에다 조직원 두 명이 카메라와 배터리 팩에 숨긴 폭발물을 터뜨렸습니다. 마수드는 중상을 입었으며 즉시 군용 헬리콥터로 현장에서 후송되었습니다."
 AFG_events.3.a: "그가 살아남기를 알라께 기도하자."
 AFG_events.4.t: "영향력을 행사하는 미국"
 AFG_events.4.d: "탈레반이 패배함에 따라, 미국은 자국의 영향력을 이용해 로야 지르가의 결정에 영향을 미쳤습니다. 새로운 과도 행정부가 구성되었습니다."
 AFG_events.4.a: "탈레반보다 나을 게 있을까?"
 AFG_hostage_crisis.1.t: "탈레반에 억류된 한국인 선교사들"
 AFG_hostage_crisis.1.d: "오늘 가즈니 주를 지나던 한국인 선교사 일행이 탈레반 무장세력에게 붙잡혀 인질로 억류되었습니다. 이들은 수감자 석방과 아프가니스탄 내 모든 한국 군인의 철수를 요구하고 있습니다. \n\n우리 군사 고문은 인질을 구출할 구출조 파견을 제안하였고, 한국 대표단은 협상을 위해 대표를 파견하였습니다."
 AFG_hostage_crisis.1.a: "탈레반은 믿을 수 없다. 구출조를 보내라."
 AFG_hostage_crisis.1.b: "인질의 안전이 최우선이다. 대표를 보내라."
 AFG_hostage_crisis.2.t: "인질 구출"
 AFG_hostage_crisis.2.d: "우리 특수 부대는 탈레반의 은신처에 잠입하는 데 성공하였고, 인질들을 가장 가까운 군 초소까지 호송하였습니다. \n\n선교사들은 한국으로 돌아갈 것이며, 우리 병사들은 언론의 찬사를 받고 있습니다."
 AFG_hostage_crisis.2.a: "임무 완수."
 AFG_hostage_crisis.3.t: "구출 시도 중 인질 사망"
 AFG_hostage_crisis.3.d: "탈레반 무장세력은 우리 특수 부대가 은신처에 진입하는 것을 알아차리고 즉시 인질들을 처형하였습니다. \n\n전투 후 우리 병사들은 인질 없이 건물을 빠져나올 수 있었습니다."
 AFG_hostage_crisis.3.a: "임무 실패."
 AFG_hostage_crisis.4.t: "탈레반, 수감자 석방 요구"
 AFG_hostage_crisis.4.d: "대표가 탈레반의 요구 사항을 가지고 돌아왔습니다. 북미 교도소에 수감된 모든 탈레반 수감자의 석방이 주된 요구입니다."
 AFG_hostage_crisis.4.a: "수감자 석방을 요청한다."
 AFG_hostage_crisis.4.b: "전쟁 범죄자를 석방하지 않겠다!"
 AFG_hostage_crisis.5.t: "탈레반, 한국군 철수 요구"
 AFG_hostage_crisis.5.d: "탈레반은 우리 시민의 석방을 대가로 모든 병력의 철수와 몸값 지불을 요구하였습니다."
 AFG_hostage_crisis.5.a: "받아들여야 한다."
 AFG_hostage_crisis.5.b: "테러리스트와는 협상하지 않는다!"
 AFG_hostage_crisis.6.t: "미국, 우리의 요청을 거부"
 AFG_hostage_crisis.6.d: "미군 대표들은 군 교도소의 탈레반 수감자를 석방해 달라는 우리의 요청을 거부하였습니다. \n\n지하디스트들은 인질 두 명을 살해하는 것으로 대응한 뒤 새로운 요구를 제시하였으며, 북한 정부 또한 인질 석방을 촉구하였습니다."
 AFG_hostage_crisis.6.a: "탈레반은 이에 어떻게 반응할까?"
 AFG_hostage_crisis.7.t: "아프가니스탄 정부, 탈레반의 요구 거부"
 AFG_hostage_crisis.7.d: "아프가니스탄 정부 대표들은 탈레반의 요구를 실현 불가능하다며 일축하였습니다. 지하디스트들은 인질 두 명을 살해하는 것으로 대응한 뒤 새로운 요구를 제시하였으며, 북한 정부 또한 인질 석방을 촉구하였습니다."
 AFG_hostage_crisis.7.a: "야만적이다!"
 AFG_hostage_crisis.8.t: "한국, 아프가니스탄에서 철수"
 AFG_hostage_crisis.8.d: "아프가니스탄에서의 인질 사태 이후, 한국 정부는 탈레반의 요구를 받아들이고 병력을 철수하기 시작하였습니다. \n\n탈레반은 2천만 달러의 몸값이 지불되었다고 발표했으나, 한국 정부는 아무런 입장도 내놓지 않았습니다."
 AFG_hostage_crisis.8.a: "아프가니스탄은 계속 불안정해진다."
 AFG_hostage_crisis.9.t: "한국인 인질 처형"
 AFG_hostage_crisis.9.d: "아프가니스탄에서의 인질 사태 이후, 한국 정부는 탈레반의 모든 요구를 거부하였고, 다음 날 탈레반은 모든 인질이 살해되었다고 발표하였습니다."
 AFG_hostage_crisis.9.a: "아프가니스탄 분쟁의 또 다른 희생자들."
 AFG_contact_iran.0.t: "아프가니스탄, 자국민 송환 요청"
 AFG_contact_iran.0.d: "우리의 파테미윤 여단은 이란에서 성장하고 있으며 하자라계 시아파 아프가니스탄 남성들로 구성되어 있습니다. 아프가니스탄은 이들이 수천 년간 살아온 나라를 도울 수 있도록 고향으로의 귀환을 요청하고 있습니다."
 AFG_contact_iran.0.a: "그들이 고국과 하나가 되게 하라."
 AFG_contact_iran.0.b: "안 된다. 우리는 인력이 필요하다."
 AFG_contact_iran.1.t: "이란, 하자라 파테미윤 파견을 거부"
 AFG_contact_iran.1.d: "[PER.GetName]에 [AFG.GetName]을(를) 돕기 위한 파테미윤 송환을 요청하고 양국 간에 많은 교섭이 오간 끝에, 이란은 우리 하자라 남성들에 대한 요청을 거부하기로 결정하였습니다."
 AFG_contact_iran.1.a: "알라께서 가장 잘 아신다!"
 AFG_contact_iran.2.t: "이란, 하자라 파테미윤에 대한 우리의 요청을 수락"
 AFG_contact_iran.2.d: "[PER.GetName](이)가 하자라 병사들이 고향으로 돌아가 돕도록 해 달라는 우리의 요청을 수락하였습니다. 다섯 개 사단이 깃발을 높이 휘날리며 \\"진다바드 하자리스탄!\\"을 외치며 이동 중입니다."
 AFG_contact_iran.2.a: "하라카트!"
 AFG_contact_iran.3.t: "아프가니스탄, 저항의 축 가입 요청"
 AFG_contact_iran.3.d: "아프가니스탄의 시아파 하자라인들이 저항의 축 가입을 요청하였습니다. 하자라인이 아프가니스탄을 장악한 이후, 이들은 이제 우리 저항 세력의 일원이 되기를 요청하고 있습니다."
 AFG_contact_iran.3.a: "호라산이 하나가 되게 하라!"
 AFG_contact_iran.3.b: "요청을 수락하지 않는다."
 AFG_contact_iran.4.t: "이란, 세력 가입 요청을 수락"
 AFG_contact_iran.4.d: "[PER.GetName](이)가 저항의 축 가입 요청을 수락하였습니다. 함께하면 우리는 더 강합니다!"
 AFG_contact_iran.4.a: "알라후 아크바르!"
 AFG_contact_iran.5.t: "이란, 거절"
 AFG_contact_iran.5.d: "[PER.GetName](이)가 저항의 축 가입 요청을 거절하였습니다. 우리는 더 이상 그들에게 의존해서는 안 됩니다."
 AFG_contact_iran.5.a: "안타깝군"
 AFG_contact_iran.6.t: "아프가니스탄의 하자라인, 하자리스탄 선포"
 AFG_contact_iran.6.d: "오늘 아침 아프가니스탄의 하자라인 정치인 카림 칼릴리는 신속한 개혁과 시아파 이슬람에 대한 충실함으로 거둔 국내 성공에 힘입어 독자적인 국가를 선포하였습니다. 수십만 명의 하자라인이 카불, 바미얀, 마자르이샤리프, 헤라트의 거리로 나와 하자리스탄 선포를 축하하였습니다."
 AFG_contact_iran.6.a: "흥미롭군"
 world_war.12.t: "대만 문제"
 world_war.12.d: "세계의 강대국들이 세계적 소모전에 갇혀 있어 타이베이를 위해 개입할 수 있는 나라는 거의 남지 않았습니다. 이 반역 지방을 되찾고 통일을 완성할 기회는 다시 오지 않을 수도 있습니다."
 world_war.12.a: "마침내, 통일"
 world_war.12.b: "전쟁의 위험을 감수할 수 없다"
 UNSC.8.t: "[?global.current_sc_vote_nation.GetName]의 상임이사국 지위 권고"
 UNSC.8.d: "[?global.current_sc_vote_nation.GetNameWithFlag](이)가 유엔 안전보장이사회 상임이사국 지위를 신청하였습니다. 이사회는 총회로 넘어가기 전에 거부권 없이 이 신청을 권고해야 합니다.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_8_desc: "이사회는 상임이사국 지위 신청을 권고하였습니다. 이제 최종 승인을 위해 총회로 넘어갑니다."
 UNSC.13.t: "새로운 안전보장이사회 상임이사국"
 UNSC.13.d: "안전보장이사회와 총회는 [?global.unsc_last_permanent_admission.GetNameWithFlag]을(를) 유엔 안전보장이사회 상임이사국으로 승인하였습니다. 이 국가는 이제 이사회의 상설 의석과 거부권을 보유합니다."
 UNSC.13.a: "이사회가 확대되었다."
 UN.22.t: "[?global.current_ga_vote_nation.GetName]의 안전보장이사회 상임이사국 지위"
 UN.22.d: "안전보장이사회는 [?global.current_ga_vote_nation.GetNameWithFlag]을(를) 상임이사국으로 권고했습니다. 총회는 이 국가가 상임 의석과 거부권을 얻기 전에 3분의 2 과반으로 신청을 승인해야 합니다.\n\n$un_ga_vote_requires_2_3_tt$"
 econvent.16.t: "현대적 생산 방식의 확산"
 econvent.16.d: "[ROOT.GetName] 전역의 기업들이 개선된 생산 방식을 도입하고 작업장을 재편하고 있습니다. 이러한 변화는 경제 전반의 생산량을 끌어올리고 있습니다."
 econvent.16.a: "전환을 장려한다"
 econvent.17.t: "결실을 맺는 교육 투자"
 econvent.17.d: "수년간 학교와 직업 훈련에 투자한 결과 숙련 노동자의 풀이 확대되었습니다. 고용주들은 이러한 전문성을 생산적으로 활용하고 있습니다."
 econvent.17.a: "이 기술을 활용하게 한다"
 econvent.18.t: "국내로 확산되는 외국 기술"
 econvent.18.d: "무역 관계를 통해 국내 기업들이 더 나은 기계와 산업 관행을 접하게 되었습니다. 국내 생산자들은 이제 그러한 방식을 자신들의 운영에 맞게 적용하고 있습니다."
 econvent.18.a: "국내 도입을 지원한다"
 econvent.19.t: "반도체 파운드리 투자 발표"
 econvent.19.d: "민간 컨소시엄이 [ROOT.GetName]에 새로운 반도체 파운드리를 건설하겠다고 약속했습니다. 산업 투입재와 전력에 대한 안정적인 접근성 덕분에 이 사업은 상업적으로 타당성을 갖게 되었습니다."
 econvent.19.a: "투자를 환영한다"
 econvent.20.t: "복합소재 산업 확장 발표"
 econvent.20.d: "제조업체들이 첨단 민수 및 군수 산업에 공급하기 위해 국내 복합소재 생산을 확대하고 있습니다. 투자자들은 원자재의 안정적 확보가 새 공장의 경쟁력을 유지시켜 줄 것으로 기대합니다."
 econvent.20.a: "확장을 지원한다"
 econvent.21.t: "생산을 확대하는 방위 계약"
 econvent.21.d: "새로운 방위 계약은 제조업체들이 생산을 확대할 수 있다는 확신을 주었습니다. 이 사업은 숙련된 일자리를 창출하는 동시에 국가 산업 기반을 강화할 것입니다."
 econvent.21.a: "계약을 수여한다"
 econvent.22.t: "상업용 조선 수주 급증"
 econvent.22.d: "수출 수요와 호조를 보이는 해운 업황으로 국내 주문 장부가 가득 찼습니다. 조선업체들은 새 계약을 소화하기 위해 생산 능력을 확대하고 있습니다."
 econvent.22.a: "조선소를 지원한다"
 corruption.19.t: "성과를 낼 1년"
 corruption.19.d: "대중의 압력이 의미 있는 개혁을 위한 좁은 기회를 만들었습니다. 정부는 기득권 세력이 재결집하기 전에 이 추진력을 결과로 전환해야 합니다."
 corruption.19.a: "반부패 운동을 시작한다"
 corruption.19.b: "도전을 거부한다"
 UNSC.12.d_veto: "유엔 안전보장이사회는 [This.GetNameWithFlag]에 관한 결의안을 부결시켰습니다. §Y상임이사국§! 한 곳이 §R반대§!표를 던졌으며, 이는 얻은 §G찬성§!표의 수와 관계없이([?global.security_council_vote_yes^num]표, 필요 [?global.un_sc_required_yes]표) 결의안을 §R거부§!합니다. 이번에는 어떤 조치도 채택되지 않습니다."
 recognition.19.t: "[FROM.GetName]의 승인 운동 결과 보고"
 recognition.19.d_none: "[FROM.GetNameDef]은(는) 국제 승인 운동을 마쳤으나, 어떤 유엔 회원국도 그 주권 주장을 받아들이지 않았습니다."
 recognition.19.d: "[FROM.GetNameDef]의 운동은 유엔 회원국 [?FROM.recognition_campaign_acceptances|Y0]개국으로부터 공식 승인을 얻었습니다. 그중 우리와 동맹인 국가는 없습니다."
 recognition.19.d_ally: "[FROM.GetNameDef]의 운동은 유엔 회원국 [?FROM.recognition_campaign_acceptances|Y0]개국으로부터 공식 승인을 얻었습니다. 그중 적어도 한 나라는 우리와 동맹입니다."
 recognition.19.a: "이 도전에 대응한다."
 recognition.21.t: "승인 운동 결과"
 recognition.21.d_none: "우리의 국제 승인 운동이 새로운 유엔 회원국의 승인을 하나도 얻지 못한 채 끝났습니다."
 recognition.21.d: "우리의 운동이 새로운 유엔 회원국 [?ROOT.recognition_campaign_acceptances|Y0]개국의 공식 승인을 확보했습니다."
 recognition.21.a: "우리 외교관들은 계속 활동한다."