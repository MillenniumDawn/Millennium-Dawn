 TT_SYR_FEDERALIST_COALITION_NOT: "Federaliści nie są w koalicji rządowej"
 TT_SYR_NATIONALIST_COALITION_NOT: "Nacjonaliści nie są w koalicji rządowej"
 SYR_BANKING_PROBLEMS_IDEA_MODIFIER: "§YThis will limit the economic benefits gained from economic prosperity decisions later on, but will ensure that the economy is maintained under our grip. Removing this problem through allowing private banks in the country will on the other hand lead to competitive markets birthing further economic prosperity§!"
 SYR_ALAWITE_MILITARY_STAFF_IDEA_MODIFIER: "§RThese officers will cut and break off the Alawite-dominated regions from the state should the country become an islamist non-secular republic and we have to get rid of them before we turn the country democratic if we want to partake on an islamist course§!"
 SYR_ALAWITE_MILITARY_STAFF_STRENGTHENED_IDEA_MODIFIER: "§RTeraz wzmocnieni oficerowie podejmą próbę zamachu stanu, jeśli kraj obierze drogę demokracji niepopulistycznej§!"
 SYR_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§YZaprosimy partię do koalicji. Partia będzie dla nas bardzo korzystna, jeśli weźmiemy udział w jej sprawie, czy to będzie Centralizacja, czy Decentralizacja podczas procesu równowagi sił w budowaniu państwa.§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§CPosiadanie tej partii w koalicji będzie dla nas ogromnym wsparciem w procesie centralizacji podczas budowania państwa i równowagi sił§!"
 SYR_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§GPosiadanie tej partii w koalicji będzie dla nas ogromnym wsparciem w procesie decentralizacji podczas budowania państwa i równowagi sił§!"
 SYR_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "If successful we will gain §G75§! political power and §YUpcoming Bureaucrats§! idea granting §G+0.5§! §YDaily political power gain§! and §G+0.2§! §YConstruction speed§! for §Y100§! days"
