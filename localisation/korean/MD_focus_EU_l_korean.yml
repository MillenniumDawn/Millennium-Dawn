 EUU_migrant_crisis_triggered: "§Y유럽 난민 위기§! 촉발됨"
 EUevent.22.t: "유럽 난민 위기"
 EUevent.22.d: "아프리카와 중동의 잇따른 전쟁, 급진적 지하디즘의 부상 등이 겹치며 수많은 사람이 고향을 떠나게 되었습니다. 이들 전란 국가들의 혼란과 불안정은 지난 수십 년간 보지 못했던 대규모 난민 사태를 야기했습니다. 수천 명의 이민자와 난민들이 망명과 난민 지위를 구하며 유럽연합으로 몰려들기 시작했습니다. 연합 최외곽 국가들은 이미 이민자들의 물결을 막기 위해 국경 경비대와 경찰을 총동원하고 있으나, 유럽연합 차원의 영구적인 대책을 촉구하고 있습니다. 임시방편으로 튀르키예와 난민 수용 협정을 맺는 방안이 있는가 하면, 유럽망명청과 같은 상설 기관을 통해 이 물결을 통제하려는 시도도 있습니다. 한 가지 분명한 것은 이 사태가 신속하고 효율적으로 처리되어야 한다는 점입니다."
 EUevent.22.a: "새로운 위기가 시작되다."
 Migrant_Crisis_Europe: "난민 위기"
 Migrant_Crisis_Europe_desc: "난민 위기가 유럽을 강타하며 국가적 단결과 집권 여당들의 지지율을 무참히 무너뜨렸습니다. 시리아 내전으로 수천 명의 난민이 인접국으로 탈출했고, 유럽은 전쟁의 피해자들을 받아들일 준비가 되어 있었으나 북아프리카와 중동 전역에서 밀려드는 영구 이민자들의 규모는 유럽의 체계를 마비시키고 많은 이들이 새로 유입된 이들을 적대시하게 만들었습니다."
 eu_candidates_considering: "§Y유럽 정상회의§!에서 현재 검토 중인 가입 후보국이 없습니다."
 eu_voting_minor_popup_tt: "이 알림을 더 이상 받지 않으려면 결정 메뉴에서 사소한 팝업을 선택 해제할 수 있습니다. 참고: 이 설정은 투표나 이사회/의회 회기 준비 완료 관련 유럽연합 팝업뿐만 아니라 다른 이벤트들도 함께 숨깁니다."
 EUvote.3.t: "유럽 의회 회기 준비 완료"
 EUvote.3.d: "유럽 의회가 회기 준비를 마쳤습니다. 직접 안건을 상정하거나, 2주 후에 AI가 의회에 법안을 상정하도록 둘 수 있습니다."
 EUvote.3.a: "투표소로!"
 EUvote.4.t: "유럽연합 이사회 회기 준비 완료"
 EUvote.4.d: "유럽연합 이사회가 회기 준비를 마쳤습니다. 직접 안건을 상정하거나, 2주 후에 AI가 이사회에 법안을 상정하도록 둘 수 있습니다."
