 avionics_manned_1: "Авионика 1-го поколения"
 avionics_manned_1_desc: "Первое поколение авиационных приборов, состоящее из гироскопов и циферблатов, которое требовало от пилота сканирования не только направления полета, но и приборной панели.\n\n§GПодсказка дизайнера: Авионика — основа самолёта. Она повышает большинство характеристик самолёта ценой роста затрат ресурсов.§!"
 avionics_manned_2: "Авионика 2-го поколения"
 avionics_manned_2_desc: "Проецирование такой важной информации, как скорость полета, высота, угол атаки, направление по компасу и т.д., позволяет лучше ориентироваться в ситуации при наблюдении за передней частью самолёта.\n\n§GПодсказка дизайнера: Авионика — основа самолёта. Она повышает большинство характеристик самолёта ценой роста затрат ресурсов.§!"
 avionics_manned_3: "Авионика 3-го поколения"
 avionics_manned_3_desc: "Современная электроника позволяет пилотам настраивать дисплеи приборов и МФД, что позволяет пилоту контролировать отображение полетной и диагностической информации.\n\n§GПодсказка дизайнера: Авионика — основа самолёта. Она повышает большинство характеристик самолёта ценой роста затрат ресурсов.§!"
 avionics_manned_4: "Авионика 4-го поколения"
 avionics_manned_4_desc: "Вся необходимая пилоту информация проецируется на HUD внутри шлема, следуя за его зрением, куда бы оно ни направлялось. Кроме того, камеры и сенсорные системы позволяют пилоту \"видеть\" сквозь свой самолёт, обеспечивая непревзойденную осведомленность о ситуации в боевом пространстве.\n\n§GПодсказка дизайнера: Авионика — основа самолёта. Она повышает большинство характеристик самолёта ценой роста затрат ресурсов.§!"
 avionics_drone_1: "Беспилотные системы 1-го поколения"
 avionics_drone_1_desc: "Первое поколение беспилотных технологий позволило летать без участия пилота внутри самолёта, что дало возможность исследовать новые боевые возможности с воздуха.\n\n§GПодсказка дизайнера: Беспилотные системы позволяют создавать самолёты с меньшими затратами личного состава, но с худшими показателями воздушного боя и защиты. Используйте их для заданий, где ожидаются потери, чтобы сократить потери личного состава и техники.§!\n\n§WИспользование этого оружия в качестве основного создаст§! §Bбеспилотные/транспортные самолёты§!"
 avionics_drone_2: "Беспилотные системы 2-го поколения"
 avionics_drone_2_desc: "Беспилотники второго поколения имеют больший радиус действия, лучшие коммуникационные возможности, их сложнее заглушить или уничтожить. Эти беспилотники рассчитаны на большой радиус действия и длительное время пребывания в режиме ожидания, что позволяет проводить масштабную разведку местности без пилота в кабине.\n\n§GПодсказка дизайнера: Беспилотные системы позволяют создавать самолёты с меньшими затратами личного состава, но с худшими показателями воздушного боя и защиты. Используйте их для заданий, где ожидаются потери, чтобы сократить потери личного состава и техники.§!\n\n§WИспользование этого оружия в качестве основного создаст§! §Bбеспилотные/транспортные самолёты§!"
 avionics_drone_3: "Беспилотные системы 3-го поколения"
 avionics_drone_3_desc: "Теперь, когда эти беспилотники вооружены, они в первую очередь способны наносить точные удары и оказывать ближнюю авиационную поддержку, а также могут использоваться в качестве дронов-смертников, позволяя наносить точные удары ценой потери планера.\n\n§BПодсказка дизайнера: Беспилотные системы позволяют создавать самолёты с меньшей стоимостью производства и затратами личного состава, но с худшими показателями воздушного боя и защиты. Используйте их, чтобы производить дешёвые самолёты с некоторыми возможностями воздушного боя и ударов, которые всё же уступают даже простому малому самолёту.§!\n\n§WИспользование этого оружия в качестве основного создаст§! §Bбеспилотные/транспортные самолёты§!"
 avionics_drone_4: "Беспилотные системы 4-го поколения"
 avionics_drone_4_desc: "Современные беспилотники воздушного боя, способные вести боевые действия во всех ролях, как это делает пилотируемый самолёт. Беспилотники этого поколения прошли серьёзную модернизацию, позволяющую принимать самостоятельные решения за доли секунды, что крайне важно для ведения боевых действий в современном пространстве.\n\n§BПодсказка дизайнера: Беспилотные системы позволяют создавать самолёты с меньшей стоимостью производства и затратами личного состава, но с худшими показателями воздушного боя и защиты. Используйте их, чтобы производить дешёвые самолёты с приличными возможностями воздушного боя и ударов, которые, однако, плохо держат урон.§!\n\n§WИспользование этого оружия в качестве основного создаст§! §Bбеспилотные/транспортные самолёты§!"
 wing_delta: "Треугольное крыло"
 wing_delta_desc: "Прочная стандартная конструкция крыла, призванная сделать самолёт более маневренным.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GТакая форма крыла обеспечит небольшое увеличение скорости и радиолокационного превосходства, а также умеренное увеличение ПВО, создавая немного более живучий самолёт без значительного увеличения ИС, связанного с инвестированием в стелс-технологии.§!"
 wing_diamond: "Ромбовидное крыло"
 wing_diamond_desc: "Экспериментальный вариант дельтавидного крыла, в котором маневренность дельтавидного крыла была принесена в жертву большей скорости и лучшим характеристикам скрытности.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GЭта форма крыла обеспечивает умеренное увеличение радиолокационного превосходства и скорости, а также незначительное увеличение противовоздушной обороны. В сочетании с дополнительными стелс-технологиями это позволит создать надежный стелс-истребитель, который будет очень трудно поразить и убить в воздушном бою.§!"
 wing_flyingwing: "Летающее крыло"
 wing_flyingwing_desc: "Выносливость — вот главное в этой игре. Эта форма крыла разработана для максимального увеличения дальности и скорости, что идеально подходит для самолётов, которым необходимо быстро преодолевать большие расстояния.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GЭта форма крыла значительно увеличивает дальность, а также даёт умеренные преимущества по радиолокации и скорости, но при этом имеет высокую стоимость производства и снижает эффективность противовоздушной обороны. Эта форма крыла рекомендуется для крупных стран, желающих производить самолёты с большой дальностью полёта.§!"
 wing_fwdswept: "Крыло с обратной стреловидностью"
 wing_fwdswept_desc: "Эта форма крыла, жертвующая дальностью и скоростью ради еще большей маневренности, предназначена для истребителей ближнего боя и самолетов, предназначенных для сближения с самолетами противника и их уничтожения в ближнем бою.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GЭта форма крыла обеспечивает значительное увеличение характеристик ПВО и атаки с воздуха за счет преимущества радара и дальности полета, а также увеличенной стоимости ИК. Используйте это, если хотите иметь более высокий урон и повышенную выживаемость, и готовы позволить самолетам чаще попадать под удары, чтобы добиться этого.§!"
 wing_straight: "Прямое крыло"
 wing_straight_desc: "Классический стиль: этот тип крыла позволяет подняться в воздух и оставаться там. Кроме того, он позволяет легко размещать на крыльях большое количество боеприпасов, но за счёт снижения манёвренности по сравнению с другими типами крыльев.\n\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n§GЭтот тип крыльев обеспечивает умеренное усиление противовоздушной обороны и наземных атак за счёт снижения преимущества радара и скорости. Эта форма крыла также снижает стоимость производства. Рекомендуется для стран, строящих истребители-бомбардировщики или ударные истребители в рамках бюджета.§!"
 wing_swept: "Стреловидное крыло"
 wing_swept_desc: "Самолёты со стреловидным крылом - это просто прямые крылья, которые более маневренны, быстрее и могут летать дальше, но затраты на проектирование приводят к удорожанию производства таких самолётов.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GЭта форма крыла является базовой формой крыла для самолётов. Она предоставляет умеренные баффы к скорости, слабые баффы к ПВО и дальности полета, без корректировки стоимости производства. Рекомендуется для бюджетного строительства или для самолетов, предназначенных для выполнения широкого спектра функций.§!"
 wing_variable: "Крыло изменяемой стреловидности"
 wing_variable_desc: "Самолёты с изменяемой стреловидностью крыльев сочетают в себе все лучшее от самолётов со стреловидным и прямым крылом, но за это приходится платить: они становятся дороже в строительстве, сложнее в обслуживании, требуют больше времени и навыков для обучения пилотированию.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GЭта форма крыла обеспечивает умеренные улучшения скорости и ПВО, а также незначительные улучшения наземной атаки, за счёт снижения надёжности и увеличения стоимости производства. Рекомендуется, если вам нужен более быстрый штурмовик.§!"
 wing_blended: "Интегральная компоновка"
 wing_blended_desc: "Следующее поколение дизайна воздушных судов. Эта форма крыла разработана для максимизации скрытности и выживаемости, продвигая воздушный бой в современную и ближайшую будущую эру.\n\n§BПодсказка дизайнера: Формы крыла меняют характеристики самолёта ценой роста стоимости производства.§!\n\n§GЭта форма крыла предоставляет значительное улучшение в области радиолокационной невидимости, а также умеренные улучшения скорости, воздушной обороны и дальности полета, но с высоким увеличением затрат на ИС и снижением возможностей для наземных атак. Рекомендуется для стран с большой промышленностью, желающих создать высокоразвинутое воздушное пространство, в особенности для многоцелевых и истребителей превосходства в воздухе.§!"
 spec_mad_1: "Гидроакустические буи"
 spec_mad_1_desc: "Сбрасываемые с самолета гидроакустические системы позволяют экипажам противолодочных кораблей более эффективно вести поиск вражеских подлодок.\n\n§GПодсказка дизайнера: Этот модуль повышает обнаружение подлодок ценой снижения радиолокационного преимущества, скорости и дальности.§!"
 spec_mad_2: "Детектор магнитных аномалий"
 spec_mad_2_desc: "Система обнаружения подводных лодок по магнитным аномалиям в воде.\n\n§GПодсказка дизайнера: Этот модуль повышает обнаружение подлодок ценой снижения радиолокационного преимущества, скорости и дальности.§!"
 spec_mad_3: "Усовершенствованные гидроакустические системы"
 spec_mad_3_desc: "Усовершенствованные системы MAD и Sonobuoy с возможностью передачи данных.\n\n§GПодсказка дизайнера: Этот модуль повышает обнаружение подлодок ценой снижения радиолокационного преимущества, скорости и дальности.§!"
 spec_refuel_1: "Сбрасываемые баки"
 spec_refuel_1_desc: "Сбрасываемые баки, используемые для увеличения дальности полета самолетов.\n\n§GПодсказка дизайнера: Этот модуль немного увеличивает дальность самолёта ценой расхода топлива и снижения радиолокационного преимущества. Ставьте его на самолёты, которым из-за других модулей не хватает дальности.§!"
 spec_refuel_2: "Конформные топливные баки"
 spec_refuel_2_desc: "Внешние топливные баки, не ухудшающие аэродинамику.\n\n§GПодсказка дизайнера: Этот модуль немного увеличивает дальность самолёта ценой расхода топлива и крайне незначительного снижения радиолокационного преимущества. Ставьте его на самолёты, которым из-за других модулей не хватает дальности.§!"
 spec_redundant_1: "Резервные гидравлические системы"
 spec_redundant_1_desc: "Системы раннего резервирования для самолётов.\n\n§GПодсказка дизайнера: Эти модули повышают надёжность самолёта. Стремитесь к надёжности 100% и выше: это сводит риск авиапроисшествий к 0% и позволяет эффективнее обучать экипажи, не теряя пилотов и машины из-за аварий.§!"
 spec_redundant_2: "Резервные электрические системы"
 spec_redundant_2_desc: "Резервные электрические системы для летающих самолётов.\n\n§GПодсказка дизайнера: Эти модули повышают надёжность самолёта. Стремитесь к надёжности 100% и выше: это сводит риск авиапроисшествий к 0% и позволяет эффективнее обучать экипажи, не теряя пилотов и машины из-за аварий.§!"
 spec_redundant_3: "Резервные системы управления полётом"
 spec_redundant_3_desc: "Дополнительные резервные системы на случай повреждения системы управления полётом.\n\n§GПодсказка дизайнера: Эти модули повышают надёжность самолёта. Стремитесь к надёжности 100% и выше: это сводит риск авиапроисшествий к 0% и позволяет эффективнее обучать экипажи, не теряя пилотов и машины из-за аварий.§!"
 spec_protection_1: "Авиационная броня"
 spec_protection_1_desc: "Повышение живучести ценой увеличения массы и снижения скорости.\n\n§GПодсказка дизайнера: Бронирование самолёта значительно повышает защиту, но стоит вам стоимости производства, веса, дальности и радиолокационного преимущества. Ставьте его на самолёт, которому нужна высокая защита и не жалко потерять радиолокационное преимущество и дальность.§!"
 spec_protection_2: "Ранние самовосстанавливающиеся материалы"
 spec_protection_2_desc: "Материалы, предназначенные для повторного соединения, позволяющие самолёту вернуться на базу для ремонта, но обеспечивающие гораздо меньшую защиту, чем броня.\n\n§GПодсказка дизайнера: Эти модули дают умеренный бонус к защите и небольшой бонус к надёжности ценой большей стоимости производства и ресурсов. Используйте их, если нужно заметно повысить надёжность самолёта и получить преимущества брони.§!"
 spec_protection_3: "Усовершенствованный самовосстанавливающийся материал"
 spec_protection_3_desc: "Материалы, способные практически полностью восстанавливать себя после повреждения.\n\n§GПодсказка дизайнера: Эти модули дают умеренный бонус к защите и небольшой бонус к надёжности ценой большей стоимости производства и ресурсов. Используйте их, если нужно заметно повысить надёжность самолёта и получить преимущества брони.§!"
 spec_recon_1: "Разведывательная камера холодной войны"
 spec_recon_1_desc: "Система камер, позволяющая выполнять задачи авиационной разведки.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы дать самолёту доступ к заданию разведки при значительно меньших затратах.§!"
 spec_tgp_1: "Прицельный контейнер холодной войны"
 spec_tgp_1_desc: "Модуль наведения, который позволяет самолёту точно доставлять боеприпасы к цели.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы повысить все характеристики атаки по наземным целям и снизить штраф за ночь ценой некоторой потери радиолокационного преимущества.§!"
 spec_recon_2: "Усовершенствованная разведывательная камера"
 spec_recon_2_desc: "$spec_recon_1_desc$"
 spec_tgp_2: "Усовершенствованный прицельный контейнер"
 spec_tgp_2_desc: "$spec_tgp_1_desc$"
 spec_recon_3: "Современная разведывательная камера"
 spec_recon_3_desc: "$spec_recon_1_desc$"
 spec_tgp_3: "Современный прицельный контейнер"
 spec_tgp_3_desc: "$spec_tgp_1_desc$"
 spec_stealthshape_1: "Ранняя малозаметная форма"
 spec_stealthshape_1_desc: "Первые дизайны, предназначенные для преодоления радарного обнаружения.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы значительно повысить радиолокационное преимущество и защиту ценой значительного роста стоимости производства. Рекомендуется только странам, которые могут позволить себе такие самолёты.§!"
 spec_stealthshape_2: "Усовершенствованная малозаметная форма"
 spec_stealthshape_2_desc: "Передовые разработки, предназначенные для поражения современных радиолокационных систем.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы значительно повысить радиолокационное преимущество и защиту ценой значительного роста стоимости производства. Рекомендуется только странам, которые могут позволить себе такие самолёты.§!"
 spec_stealthmats_1: "Радиопоглощающие материалы"
 spec_stealthmats_1_desc: "Материалы, предназначенные для поглощения радиолокационных волн с целью их обнаружения.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы значительно повысить радиолокационное преимущество и защиту ценой роста потребности в ресурсах. Рекомендуется только странам, которые могут позволить себе такие самолёты.§!"
 spec_stealthmats_2: "Усовершенствованные РПМ"
 spec_stealthmats_2_desc: "Материалы, предназначенные для поражения современных радаров.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы значительно повысить радиолокационное преимущество и защиту ценой роста потребности в ресурсах. Рекомендуется только странам, которые могут позволить себе такие самолёты.§!"
 spec_thrust_vector_1: "Двигатели КВВП"
 spec_thrust_vector_1_desc: "Первые технологии векторного тяги и вращающиеся конструкции двигателей.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы повысить защиту самолёта ценой надёжности. Рекомендуется, если нужен более живучий самолёт без затрат на малозаметность.§!"
 spec_thrust_vector_2: "Одноосевое управление вектором тяги"
 spec_thrust_vector_2_desc: "Системы векторизации тяги, предназначенные для повышения маневренности.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы повысить защиту самолёта ценой надёжности. Рекомендуется, если нужен более живучий самолёт без затрат на малозаметность.§!"
 spec_thrust_vector_3: "Двухосевое управление вектором тяги"
 spec_thrust_vector_3_desc: "Усовершенствованная система векторизации тяги обеспечивает повышенную маневренность по нескольким осям.\n\n§GПодсказка дизайнера: Используйте этот модуль, чтобы повысить защиту самолёта ценой надёжности. Рекомендуется, если нужен более живучий самолёт без затрат на малозаметность.§!"
 spec_countermeasures_1: "Средства противодействия и ранние СПО"
 spec_countermeasures_1_desc: "Варианты ранней защиты от ракетного нападения.\n\n§GПодсказка дизайнера: Общее повышение защиты самолёта. Рекомендуется ставить на самолёт хотя бы один модуль противодействия, особенно если у него нет модулей малозаметности.§!"
 spec_countermeasures_2: "Средства противодействия и современные СПО"
 spec_countermeasures_2_desc: "Современные меры противодействия.\n\n§GПодсказка дизайнера: Общее повышение защиты самолёта. Рекомендуется ставить на самолёт хотя бы один модуль противодействия, особенно если у него нет модулей малозаметности.§!"
 spec_countermeasures_3: "Комплекс РЭБ"
 spec_countermeasures_3_desc: "Противоракетная оборона EW для ракет с радиолокационным наведением.\n\n§GПодсказка дизайнера: Общее повышение защиты самолёта и радиолокационного преимущества. Рекомендуется ставить на самолёт хотя бы один модуль противодействия, особенно если у него нет модулей малозаметности.§!"
 spec_countermeasures_4: "Лазерная система активной защиты"
 spec_countermeasures_4_desc: "Контрмеры Hard-Kill для защиты от всех ракетных угроз.\n\n§GПодсказка дизайнера: Общее повышение защиты самолёта и радиолокационного преимущества. Рекомендуется ставить на самолёт хотя бы один модуль противодействия, особенно если у него нет модулей малозаметности.§!"
 engine_light_single_1: "Ранний лёгкий двигатель"
 engine_light_single_1_desc: "Первые реактивные двигатели с конца Второй мировой войны положили начало гонке за более быстрыми и маневренными самолетами. $ENGINE_INFO$"
 engine_light_single_2: "Лёгкий двигатель холодной войны"
 engine_light_single_2_desc: "$engines_2_desc$$ENGINE_INFO$"
 engine_light_single_3: "Почти современный лёгкий двигатель"
 engine_light_single_3_desc: "$engines_3_desc$$ENGINE_INFO$"
 engine_light_single_4: "Современный лёгкий двигатель"
 engine_light_single_4_desc: "$engines_4_desc$$ENGINE_INFO$"
 engine_light_single_5: "Передовой лёгкий двигатель"
