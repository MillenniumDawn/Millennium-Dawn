l_spanish:
 CHI_Belt_and_Road_Initiative: "Iniciativa del Cinturón y Ruta de la Seda"
 CHI_Belt_and_Road_Initiative_desc: "La visión de Xi Jinping, anunciada primero en Astaná y luego en Yakarta, une el Cinturón Económico de la Ruta de la Seda con la Ruta de la Seda Marítima del Siglo XXI en un único programa de diplomacia de infraestructuras que abarca a más de 140 países. Deberíamos convertirlo en el principio organizador de nuestra política económica exterior."
 CHI_The_China_Pakistan_Economic_Corridor: "El Corredor Económico China-Pakistán"
 CHI_The_China_Pakistan_Economic_Corridor_desc: "Desde Kashgar hasta Gwadar, tres mil kilómetros de carreteras, vías férreas y oleoductos atraviesan el Karakórum. Trabajadores de la Organización de Obras de la Frontera de Pakistán e ingenieros del EPL firman mutuamente sus uniformes en el valle de Hunza. La línea de vida está abierta."
 CHI_The_South_China_Sea: "El Mar de China Meridional"
 CHI_The_South_China_Sea_desc: "El mar de la China Meridional se encuentra en el corazón de nuestra estrategia marítima: es rico en hidrocarburos, está atravesado por las rutas marítimas más transitadas del mundo y es reclamado por todas las naciones que colindan con él. Debemos elegir nuestra postura: una ocupación paciente a través de la «Estrategia de la Col», una diplomacia paciente inspirada en el espíritu de las flotas de tesoros de Zheng He, o la restauración forzosa del orden tributario a través de los Cuatro Mares. Cada camino moldeará la respuesta de nuestros vecinos, de la ASEAN y de las grandes potencias."
 CHI_Strengthen_Relations_with_the_South: "El canal de Jeju"
 CHI_Strengthen_Relations_with_the_South_desc: "Abrir un canal de consulta permanente con Seúl a través de una discreta diplomacia de canales secundarios en Jeju. Tratamos a la República de Corea como un socio estratégico legítimo por derecho propio, no como un Estado colchón gestionado a través de Pionyang."
 CHI_Maintain_Commitment_to_Denuclearization: "El comunicado de Yongbyon"
 CHI_Maintain_Commitment_to_Denuclearization_desc: "Publicar un comunicado oficial que nos comprometa con la desnuclearización de Corea del Norte. Los canales privados refuerzan el mensaje a Pionyang: nuestro respaldo diplomático es condicional, no incondicional. Washington y Seúl toman nota del cambio."
 CHI_Encourage_Economic_Reforms: "Fomentar reformas económicas"
 CHI_Encourage_Economic_Reforms_desc: "El hecho de que un socio tan cercano al nuestro siga siendo una nación subdesarrollada y atrasada es una vergüenza para nosotros como sucesores de Deng Xiaoping. Se debe persuadir a [NKO.GetLeader] para que liberalice la economía norcoreana."
 CHI_Mediate_Korean_Peace_Talks: "Mediar en las conversaciones de paz coreanas"
 CHI_Mediate_Korean_Peace_Talks_desc: "Durante demasiado tiempo, la península coreana ha existido en un estado de guerra congelada. Las tensiones entre Corea del Norte y Corea del Sur existen debido a la mutua desconfianza y sospecha sobre acciones defensivas que son malinterpretadas como ofensivas. Se necesitará un actor externo preocupado, como China, para romper este estancamiento interno."
 CHI_Back_Peaceful_Korean_Unification: "Apoyar la unificación pacífica de Corea"
 CHI_Back_Peaceful_Korean_Unification_desc: "Deberíamos expresar nuestro apoyo a la eventual reunificación de la península coreana bajo un gobierno no alineado y libre de influencias externas. Si esta eventualidad se lleva a cabo o no, depende de los coreanos."
 CHI_End_the_Kim_Dynasty: "Poner fin a la dinastía Kim"
 CHI_End_the_Kim_Dynasty_desc: "Los Kim han presidido una dictadura brutal y regresiva a la cual hemos estado obligados a apoyar durante décadas. No se puede permitir que esta situación continúe."
 CHI_Gain_the_Support_of_the_KPA: "Obtener el apoyo de la KPA"
 CHI_Gain_the_Support_of_the_KPA_desc: "Nuestros servicios de inteligencia indican que existen elementos dentro de la clase de oficiales del Ejército Popular de Corea que resienten el mandato de [NKO.GetLeader]. Deberíamos ponernos en contacto con estos oficiales con los que compartimos un objetivo común."
 CHI_The_North_Korean_Coup: "El golpe de Estado en Corea del Norte"
 CHI_The_North_Korean_Coup_desc: "Ha llegado el momento de derrocar a este régimen decadente. Nuestra influencia en Corea del Norte ha logrado que muchos oficiales se unan a nuestro lado, aunque nuestros analistas siguen sin estar seguros de si debemos buscar aún más apoyo antes de embarcarnos en esta empresa arriesgada."
 CHI_Establish_a_Puppet_Government: "Establecer un gobierno títere"
 CHI_Establish_a_Puppet_Government_desc: "Ahora que el golpe de Estado ha tenido éxito, el nuevo gobierno militar nos debe un favor y, por lo tanto, no tendrá más opción que someterse a nuestra autoridad."
 CHI_The_Indian_Subcontinent: "El subcontinente indio"
 CHI_The_Indian_Subcontinent_desc: "Al sur del Tíbet se encuentra un vasto subcontinente dominado por la rivalidad entre India y Pakistán. Deberíamos considerar cuidadosamente nuestro enfoque hacia esta región dividida."
 CHI_Support_Nepals_Maoists: "Respaldar al UCPN(M)"
 CHI_Support_Nepals_Maoists_desc: "La guerra popular de 1996 a 2006 transformó a Nepal. Un apoyo discreto al Partido Comunista Unificado de Nepal (Maoísta), mediante fondos, santuario en el Tíbet y encuadre ideológico, puede mantener la política de Katmandú inclinada hacia Pekín durante una generación."
 CHI_Respect_Nepalese_Neutrality: "La renegociación del Tratado de 1950"
 CHI_Respect_Nepalese_Neutrality_desc: "El Tratado de Paz y Amistad de 1950 entre Nepal e India bloqueó a Katmandú en la órbita estratégica de Nueva Delhi durante sesenta años. Financiaremos discretamente a las voces nepalesas que exigen su renegociación."
 CHI_Guarantee_Bangladesh: "La distensión de Daca"
 CHI_Guarantee_Bangladesh_desc: "Sheikh Hasina habla de autonomía estratégica. Pekín habla de hermandad a través del Brahmaputra. La India observa desde la otra orilla. La geometría de la bahía de Bengala está cambiando."
 CHI_Drop_Claims_on_Bhutan: "Abandonar las reclamaciones sobre Bután"
 CHI_Drop_Claims_on_Bhutan_desc: "Una barrera importante para mejorar las relaciones entre nosotros y Bután son nuestras reclamaciones sobre parte del territorio que ellos controlan. Esto también ha generado fricciones con los indios, fricciones que podrían desembocar en un conflicto indeseable. Es mejor que abandonemos estas reclamaciones por ahora."
 CHI_Doklam_Road_Standoff: "Impasse en la carretera de Doklam"
 CHI_Doklam_Road_Standoff_desc: "Doklam es territorio chino y, por lo tanto, deberíamos poder mover tropas y equipos de construcción libremente a través de él si así lo deseamos. Si Bután e India desean responder, que lo hagan. Esta será una buena oportunidad para poner a prueba su preparación combativa."
 CHI_Iron_Brothers: "Hermanos de Acero"
 CHI_Iron_Brothers_desc: "Nuestra asociación con Pakistán es de un estrecho alineamiento estratégico, y esta relación debe preservarse para nuestro beneficio mutuo. Nuestro enemigo común indio no puede hacer frente a nuestro poder conjunto."
 CHI_Joint_Military_Projects: "La coproducción del JF-17"
 CHI_Joint_Military_Projects_desc: "El JF-17 Thunder, desarrollado conjuntamente por Chengdu y PAC Kamra, es más que un avión de combate. Es la columna vertebral de la fuerza aérea de Pakistán y la prueba de que la cooperación militar sino-pakistaní puede aportar capacidades estratégicas reales."
 CHI_Cooperate_on_Counterterrorism: "El comunicado de Turkestán Oriental"
 CHI_Cooperate_on_Counterterrorism_desc: "Islamabad designa formalmente al ETIM como una organización terrorista y firma un marco de extradición. Para nosotros, esto cierra una vulnerabilidad que ha desangrado a Sinkiang durante dos décadas."
 CHI_Militarize_Gwadar_Port: "Militarizar el puerto de Gwadar"
 CHI_Militarize_Gwadar_Port_desc: "Nuestras inversiones en el puerto de Gwadar han dado sus frutos y han creado una impresionante instalación comercial. Podemos capitalizar este logro preparando el puerto tanto para usos militares como comerciales, una medida que sin duda intimidará a los indios, pero que es necesaria para nuestra seguridad."
 CHI_The_Quadrilateral_Cooperation_and_Coordination_Mechanism: "Mecanismo de Cooperación y Coordinación Cuadrilateral"
 CHI_The_Quadrilateral_Cooperation_and_Coordination_Mechanism_desc: "El Mecanismo de Cooperación y Coordinación Cuadrilateral, o QCCM, será un grupo útil de cuatro países con un interés común en combatir el terrorismo. Esperamos que también mejore las tensas relaciones entre Pakistán y Afganistán y nos ayude a expandir nuestra influencia en Asia Central, dominada por Rusia, a través de nuestros socios tayikos."
 CHI_Support_Negotiations: "El proceso de Murree"
 CHI_Support_Negotiations_desc: "En un complejo turístico en las colinas de Pakistán, los oficiales del ISI sirven té mientras los delegados talibanes y los emisarios del gobierno afgano se enfrentan cara a cara al otro lado de una mesa. Un hombre chino con traje gris escucha atentamente, sin tomar notas."
 CHI_Joint_Operations: "Operación Tigre de la Montaña"
 CHI_Joint_Operations_desc: "Nombre en clave de la serie recurrente de ejercicios conjuntos entre el EPL y Pakistán. Esta vez, el ejercicio no es un entrenamiento. El Wakhan y el Khyber verán botas del EPL sobre la tierra por primera vez en décadas."
 CHI_Tackle_the_Root_Causes_of_Radicalization: "El Acuerdo del Corredor de Wakhan"
 CHI_Tackle_the_Root_Causes_of_Radicalization_desc: "Los setenta y seis kilómetros del corredor de Wakhan, una franja de Afganistán que colinda directamente con Sinkiang, han carecido de gobierno durante demasiado tiempo. Pekín, Kabul e Islamabad están de acuerdo: se debe construir una barrera, ladrillo a ladrillo, torre de vigilancia a torre de vigilancia."
 CHI_Disengage_from_Pakistan: "Desvincularse de Pakistán"
 CHI_Disengage_from_Pakistan_desc: "Es hora de reevaluar nuestro enfoque hacia el subcontinente indio. Una estrecha asociación entre dos de las economías más grandes del mundo podría ser más beneficiosa para nosotros que una alianza continua con un poder menor. Desvincularnos de Pakistán será el primer paso en nuestro acercamiento a India."
 CHI_End_Joint_Military_Exercises: "Finalizar los ejercicios militares conjuntos"
 CHI_End_Joint_Military_Exercises_desc: "Nuestros ejercicios con Pakistán son vistos con sospecha por parte de los indios. Debemos finalizarlos para ganar su confianza."
 CHI_Strategic_Realignment: "El espíritu de Bandung revivido"
 CHI_Strategic_Realignment_desc: "En Bandung, 1955, Zhou Enlai y Jawaharlal Nehru se estrecharon la mano ante las cámaras. «Hindi-Chini bhai-bhai» (indios y chinos son hermanos), coreaba la multitud. Siete años más tarde, los morteros volaban sobre la línea McMahon. Tal vez ese apretón de manos merezca una segunda oportunidad."
 CHI_Sino_Indian_Treaty_of_Friendship: "Tratado de Amistad Sino-Indio"
 CHI_Sino_Indian_Treaty_of_Friendship_desc: "Nuestra asociación con Pakistán no fue, por supuesto, la única fuente de fricción entre nosotros y nuestros homólogos indios. Tendremos que abordar las disputas territoriales que nuestros respectivos países poseen para comenzar una nueva relación con India."
 CHI_A_New_Alliance: "El espíritu de Wuhan materializado"
 CHI_A_New_Alliance_desc: "Modi y Xi pasearon por los jardines de East Lake en 2018 y hablaron sin asesores de por medio. Lo que se dijeron sigue sin registrarse, pero lo que siguió ya es historia: las dos civilizaciones de Asia, finalmente alineadas."
 CHI_Strike_Across_the_Himalayas: "El ajuste de cuentas de Galwan"
 CHI_Strike_Across_the_Himalayas_desc: "En una noche sin luna en el valle de Galwan, en junio de 2020, los soldados se mataron entre sí con piedras y palos porque su tratado prohibía las armas de fuego. Veinte indios muertos y cuatro de los nuestros, aunque Pekín no lo confirmará. El tratado murió esa misma noche."
 CHI_String_of_Pearls: "Cadena de Perlas"
 CHI_String_of_Pearls_desc: "El dominio de India sobre el Océano Índico es un estado de cosas indeseable. Podemos buscar contener a India de la misma manera que Estados Unidos busca contenerte a nosotros, es decir, rodeando a nuestro rival con bases militares ubicadas en el territorio de nuestros socios regionales. Este cerco nos dará una ventaja significativa en caso de entrar en un estado de guerra con India."
 CHI_Annex_Bhutan: "Anexar Bután"
 CHI_Annex_Bhutan_desc: "Es posible que nuestras reclamaciones sobre Bután no se extiendan a la totalidad del territorio del país, pero los estrechos lazos históricos del reino con el Tíbet deberían proporcionar una justificación razonable para nuestro deseo de integrar a Bután en la Región Autónoma del Tíbet. Además, la anexión eliminaría a un aliado de la India estratégicamente situado. Si nuestra influencia en Bután llega a ser lo suficientemente grande, podremos anexionarnos el país sin necesidad de una guerra."
 CHI_Puppet_Nepal: "Nepal títere"
 CHI_Puppet_Nepal_desc: "Algunas fuerzas políticas en Nepal están dispuestas a fortalecer significativamente los lazos de su país con China a expensas de su asociación con India. Esto ayudaría significativamente a nuestros objetivos de política exterior. Aumentar nuestra influencia en el país y asegurar un gobierno amistoso nos permitirá llevar a cabo este proceso pacíficamente."
 CHI_Bring_the_Tiger_to_Heel: "Zanjar la cuestión de McMahon"
 CHI_Bring_the_Tiger_to_Heel_desc: "La línea McMahon fue trazada por un oficial colonial británico en 1914 y nunca fue aceptada por ningún gobierno chino, ni por la República ni por la República Popular. Esa línea será borrada."
 CHI_Assuage_Japanese_Concerns: "Calmar las preocupaciones japonesas"
 CHI_Assuage_Japanese_Concerns_desc: "Para facilitar un acercamiento con Japón, debemos asegurar a Tokio que nuestras intenciones no son hostiles. Las acciones hablan más que las palabras."
 CHI_Form_the_SCO: "Crear la Organización de Cooperación de Shanghái (SCO)"
 CHI_Form_the_SCO_desc: "Actualmente, el grupo de los Cinco de Shanghái actúa como una forma de interactuar estrechamente con Rusia, Kazajistán, Kirguistán y Tayikistán. Estas interacciones han sido valiosas, pero podrían mejorarse aún más si cambiamos este grupo informal en una sólida organización intergubernamental."
 CHI_Emphasize_Economic_Cooperation: "Enfatizar la cooperación económica"
 CHI_Emphasize_Economic_Cooperation_desc: "La SCO debería ser principalmente un facilitador de la asistencia económica de los miembros más ricos a los miembros más pobres. Nuestro objetivo de estabilidad regional se logra mejor fortaleciendo las economías de nuestros vecinos más frágiles. Además, la SCO debería esforzarse por mejorar la vida de quienes residen dentro de sus fronteras."
 CHI_Civilian_Technology_Sharing: "Compartir tecnología civil"
 CHI_Civilian_Technology_Sharing_desc: "Nuestra organización se enfoca principalmente en desarrollar las economías de sus miembros más pobres, por lo que solo debería centrarse en el intercambio de tecnologías no militares."
 CHI_Development_Assistance: "Aumentar la asistencia al desarrollo"
 CHI_Development_Assistance_desc: "Nuestros esfuerzos actuales de desarrollo se pueden mejorar aún más para acelerar el crecimiento económico en los estados miembros de la SCO."
 CHI_Emphasize_Political_Cooperation: "Enfatizar la cooperación política"
 CHI_Emphasize_Political_Cooperation_desc: "La SCO debería ser, ante todo, una organización que preserve la estabilidad regional protegiendo a los gobiernos legítimos de sus estados miembros de amenazas desestabilizadoras desde dentro."
 CHI_Crack_Down_on_the_Three_Evils: "Combatir los Tres Males"
 CHI_Crack_Down_on_the_Three_Evils_desc: "Los Tres Males del terrorismo, el separatismo y el extremismo religioso son fuentes de preocupación para todos los miembros de la SCO. A través de la SCO, podemos fortalecer la capacidad política de cada uno para reprimir estas peligrosas amenazas."
 CHI_Emphasize_Military_Cooperation: "Enfatizar la cooperación militar"
 CHI_Emphasize_Military_Cooperation_desc: "No hay necesidad de ocultar nuestras intenciones. La SCO debería ser una organización explícitamente orientada a la seguridad que nos brinde a nosotros y a nuestros socios rusos una protección contra posibles agresiones de enemigos externos, siendo el principal de ellos Estados Unidos."
 CHI_Military_Technology_Sharing: "Compartir tecnología militar"
 CHI_Military_Technology_Sharing_desc: "La avanzada tecnología militar de Rusia será un recurso invaluable para nuestros miembros en caso de una agresión externa."
 CHI_Strengthen_Security_Framework: "Fortalecer el marco de seguridad"
 CHI_Strengthen_Security_Framework_desc: "Nuestra cooperación militar actual dentro de la SCO, aunque sustancial, puede no ser suficiente para resistir el embate completo de una superpotencia. Debemos profundizar nuestra cooperación militar existente para que, como organización, estemos mejor preparados para lo peor."
 CHI_Chinese_Dominance: "Dominio Chino"
 CHI_Chinese_Dominance_desc: "Si bien nuestra posición y la de Rusia dentro de la SCO son actualmente iguales, la verdad incómoda es que nuestro poder supera con creces el de nuestros antiguos aliados. Nuestra influencia dentro de la organización debería corresponder a nuestra importancia en el mundo real, por lo que Rusia debería ser forzada a ocupar una posición inferior."
 CHI_Equal_Partners: "Socios Igualitarios"
 CHI_Equal_Partners_desc: "Aunque hemos comenzado a superar a los rusos en muchas áreas, aún tenemos mucho que aprender de esta antigua superpotencia. Es mejor para nuestros intereses mantener a los rusos de nuestro lado que alienarlos y antagonizarlos."
 CHI_Exploit_Economic_Clout: "Explotar la Influencia Económica"
 CHI_Exploit_Economic_Clout_desc: "La orientación financiera de la SCO nos ha beneficiado enormemente debido a nuestra vasta superioridad en términos de capital. Ahora podemos utilizar esta ventaja económica para consolidar nuestra influencia política sobre los demás miembros de la SCO."
 CHI_Split_CSTO: "Dividir la CSTO"
 CHI_Split_CSTO_desc: "Nuestra asociación con Rusia nunca iba a durar para siempre. Nunca hemos podido confiar plenamente en nuestro vecino expansionista del norte. Aunque hasta ahora ha servido a nuestros intereses continuar con la pretensión de cooperación sino-rusa, para llevar a la SCO más lejos debemos ponerle fin. Nuestros aliados compartidos ahora deben elegir entre estar de nuestro lado o estar del lado de nuestro enemigo."
 CHI_Merge_with_CSTO: "Unirse a la CSTO"
 CHI_Merge_with_CSTO_desc: "La organización de seguridad de Rusia, la CSTO, tiene un amplio conjunto de instituciones para la cooperación militar que nos sería beneficioso adoptar."
 CHI_An_Alliance_to_Rival_NATO: "Una Alianza para Desafiar a la OTAN"
 CHI_An_Alliance_to_Rival_NATO_desc: "Ha llegado el momento de desbloquear todo el potencial de la SCO y fortalecer las instituciones de cooperación militar de la organización hasta el punto en que nuestro comando conjunto y control sea tan eficiente como el de la OTAN. Si se acerca una guerra, estaremos preparados."
 CHI_Forum_on_China_African_Cooperation: "Foro de Cooperación China-África"
 CHI_Forum_on_China_African_Cooperation_desc: "El Foro de Cooperación China-África (FOCAC) facilita nuestras interacciones con todo el continente africano, una región que no consideramos atrasada o bárbara como lo hace Occidente, sino como una fuente de potencial y oportunidad."
 CHI_China_Africa_Development_Fund: "Fondo de Desarrollo China-África"
 CHI_China_Africa_Development_Fund_desc: "A través del Fondo de Desarrollo China-África, podemos proporcionar inversiones muy necesarias en proyectos de infraestructura en el continente africano."
 CHI_Invest_in_Cheap_Energy: "Invertir en Energía Barata"
 CHI_Invest_in_Cheap_Energy_desc: "A pesar de todo el discurso sobre energías renovables, al final del día son los combustibles fósiles baratos los que sacarán de la pobreza a la población africana."
 CHI_Invest_in_Clean_Energy: "Invertir en Energía Limpia"
 CHI_Invest_in_Clean_Energy_desc: "El desarrollo no debe producirse a expensas del medio ambiente. Nuestros conocimientos técnicos nos permiten compartir nuestros avances en tecnología de energía renovable con nuestros socios en el continente africano."
 CHI_Outsource_Cheap_Labor: "Externalizar Mano de Obra Barata"
 CHI_Outsource_Cheap_Labor_desc: "Cuando estábamos en vías de desarrollo, nuestros trabajadores recibían salarios mínimos y tenían que sufrir tremendas dificultades. Pero su sufrimiento es lo que ha llevado a nuestro país a tener el éxito económico del que disfruta actualmente. Las naciones de África deberían seguir el mismo modelo."
 CHI_Workers_Rights: "Derechos de los Trabajadores"
 CHI_Workers_Rights_desc: "El bienestar del trabajador individual es fundamental para el éxito de la nación. Solo deberíamos prestar nuestro apoyo a proyectos que protejan el sustento de las personas de las que dependen."
 CHI_Agriculture: "Agricultura"
 CHI_Agriculture_desc: "La agricultura sigue siendo un sector importante en muchas economías africanas y es aquel del que depende la mayor parte de la población. Deberíamos prestar nuestro apoyo al sector agrícola para ayudar a los trabajadores individuales a competir en un mundo globalizado de brutal competencia internacional."
 CHI_Develop_Hospitals: "Desarrollar Hospitales"
 CHI_Develop_Hospitals_desc: "La tragedia de muchas de las muertes en el continente africano es que ocurren debido a condiciones fácilmente tratables. Debemos proporcionar a nuestros socios las herramientas necesarias para cuidar de su población."
 CHI_Leverage_Influence: "Aprovechar la Influencia"
 CHI_Leverage_Influence_desc: "África está tan endeudada con nosotros que los gobiernos en todo el continente deben someterse a nuestra voluntad."
 CHI_Write_Off_Debts: "Condondar Deudas"
 CHI_Write_Off_Debts_desc: "No mantendremos a nuestros socios en una trampa de deuda. Deben permitírseles crecer y desarrollarse a su propio ritmo."
 CHI_Friendship_Schools: "Escuelas de Amistad"
 CHI_Friendship_Schools_desc: "Las escuelas de amistad brindan educación tan necesaria en todo el continente, fortaleciendo el capital humano de la región."
 CHI_Joint_Research: "Investigación Conjunta"
 CHI_Joint_Research_desc: "Juntos, nuestros países pueden realizar avances científicos que beneficiarán a todas nuestras poblaciones."
 CHI_TV_and_Internet_Access: "Acceso a TV e Internet"
 CHI_TV_and_Internet_Access_desc: "En el siglo XXI, el acceso de los hogares al mundo exterior es una medida clave de desarrollo. Deberíamos ayudar a nuestros socios africanos a proporcionar acceso a TV e Internet para todos sus ciudadanos."
 sino_indian.1.t: "¡Se está violando la soberanía de Bután!"
 sino_indian.1.d: "Las tropas chinas están acompañando los esfuerzos de construcción de carreteras en Doklam, territorio butanés que los chinos reclaman como suyo. Si esta clara violación de la soberanía de Bután no tiene oposición, China podría consolidar sus reclamos sobre Doklam y quizás otras áreas en disputa del territorio de Bután."
 sino_indian.1.a: "¡Deberíamos enviar tropas para detener esta incursión!"
 sino_indian.1.b: "Nosotros no podemos hacer nada ..."
 sino_indian.1.c: "Nuestros protectores vendrán en nuestra defensa."
 sino_indian.1.e: "¡Debemos defendernos!"
 sino_indian.2.t: "Parece que nuestros protectores nos han abandonado..."
 sino_indian.2.d: "La India ha optado por no honrar su compromiso de defender nuestra soberanía. Por lo tanto, la elección recae en nosotros para decidir si oponerse o no a la incursión china."
 sino_indian.2.a: "Nosotros no podemos hacer nada ..."
 sino_indian.2.b: "¡Debemos defendernos!"
 sino_indian.3.t: "[FROM.GetName] ha desplegado tropas para detener la construcción de nuestra carretera"
 sino_indian.3.d: "Cientos de tropas [FROM.GetAdjective] han cruzado la frontera entre nuestro territorio y el de ellos aparentemente en respuesta a una incursión nuestra en territorio de Bután. Dejando a un lado lo absurdo de esta afirmación, deberíamos decidir si nos retiramos y evitamos una confrontación armada o si intensificamos la situación actual."
 sino_indian.3.a: "Nosotros deberíamos desengancharnos."
 sino_indian.3.b: "¡Debemos mantenernos firmes!"
 sino_indian.4.t: "China extiende su influencia sobre Bután"
 sino_indian.4.d: "La pequeña nación de Bután ha visto su independencia gravemente socavada por la extensión por parte de China de una carretera hacia el territorio soberano del país sin su consentimiento. Ni Bután ni su protector, la India, ofrecieron resistencia a esta medida más allá de condenarla y reiterar el estatus del territorio como territorio butanés y no chino. Según se informa, el fracaso de la India a la hora de proteger a su vecino de este acto ha socavado gravemente la relación históricamente estrecha entre los dos países."
 sino_indian.4.a: "China continúa empujando hacia afuera."
 sino_indian.5.t: "China se ha desvinculado de Bután"
 sino_indian.5.d: "Ante una importante resistencia a sus esfuerzos por ampliar una carretera existente hacia el territorio butanés de Doklam, China ha retirado sus tropas y personal de la región. [CHI.GetLeader] ha reiterado el compromiso de China con la paz y la estabilidad en la región."
 sino_indian.5.a: "China ha dado marcha atrás, por ahora."
 sino_indian.6.t: "¡China ha ganado el enfrentamiento de Doklam!"
 sino_indian.6.d: "¡Habiendo derrotado a nuestros oponentes, nuestra supremacía sobre el territorio de Doklam está ahora asegurada!"
 sino_indian.6.d_RAJ: "Al no haber podido defender el territorio de Bután, no tenemos más remedio que ceder Doklam a los chinos."
 sino_indian.6.a: "¡Una victoria gloriosa!"
 sino_indian.6.b: "Una derrota humillante..."
 sino_indian.7.t: "¡China ha perdido el enfrentamiento con Doklam!"
 sino_indian.7.d: "Al no haber podido arrebatar Doklam a nuestros oponentes, no tenemos más remedio que retirarnos de la tierra que es legítimamente nuestra."
 sino_indian.7.d_RAJ: "¡Habiendo derrotado a nuestros oponentes, se ha preservado la soberanía de Bután sobre Doklam!"
 sino_indian.7.a: "¡Una victoria gloriosa!"
 sino_indian.7.b: "Una derrota humillante..."
 sino_indian.8.t: "El enfrentamiento de Doklam no termina de manera concluyente"
 sino_indian.8.d: "Tanto nuestro bando como el suyo han fracasado en obtener la ventaja en este enfrentamiento sobre el territorio de Doklam."
 sino_indian.8.a: "Paz, por ahora..."
 sino_indian.9.t: "¡China ha tomado Arunachal Pradesh!"
 sino_indian.9.d: "¡Habiendo derrotado a nuestros oponentes, nuestra supremacía sobre el territorio del sur del Tíbet, conocido por nuestros enemigos como Arunachal Pradesh, ahora está asegurada!"
 sino_indian.9.d_RAJ: "Al no haber podido defender nuestro territorio, no tenemos más remedio que ceder Arunachal Pradesh a los chinos."
 sino_indian.9.a: "¡Una victoria gloriosa!"
 sino_indian.9.b: "Una derrota humillante..."
 sino_indian.10.t: "¡China no ha logrado tomar Arunachal Pradesh!"
 sino_indian.10.d: "Al no haber podido arrebatar este Estado a nuestros enemigos, no tenemos más remedio que retirarnos de la tierra que es legítimamente nuestra."
 sino_indian.10.d_RAJ: "¡Habiendo derrotado a nuestros oponentes, se ha preservado la soberanía de la India sobre Arunachal Pradesh!"
 sino_indian.10.a: "¡Una victoria gloriosa!"
 sino_indian.10.b: "Una derrota humillante..."
 sino_indian.11.t: "China propone un tratado para mejorar relaciones y resolver disputas"
 sino_indian.11.d: "Los actos conciliatorios pasados ​​de China han culminado en esta oferta de firmar un tratado entre nuestras dos naciones que resuelva nuestras disputas fronterizas y deje de lado nuestras diferencias de una vez por todas. ¿Deberíamos aceptar su oferta o atenernos al status quo?"
 sino_indian.11.a: "¡Deberíamos aceptar esta oferta histórica!"
 sino_indian.11.b: "¡No se puede confiar en los chinos!"
 sino_indian.12.t: "El Tratado de Amistad Sino-India"
 sino_indian.12.d: "China y la India han firmado un tratado de amistad, que marca el fin de décadas de resentimiento y sospecha que existieron entre los dos gigantes regionales. Tras una notable serie de intentos conciliadores por parte de China, los agravios del gobierno indio contra los chinos se desvanecieron rápidamente. Las implicaciones de esta nueva y sorprendente asociación aún no se han revelado."
 sino_indian.12.a: "¡Un buen día para la paz y la diplomacia!"
 sino_indian.12.b: "Un acontecimiento extremadamente preocupante..."
 sino_indian.13.t: "China gira hacia la India"
 sino_indian.13.d: "Durante décadas, China y Pakistán han sido socios estratégicos cercanos debido a su desconfianza compartida hacia la India. Sin embargo, esto ha comenzado a cambiar recientemente: China renunció a su compromiso de defender a Pakistán y puso fin a los ejercicios militares conjuntos y los proyectos de inversión entre los dos países. Se dice que los chinos están enviando señales a los indios de que estas medidas representan una reorientación a largo plazo de la política exterior china y no simplemente una disputa a corto plazo. La respuesta de la India a estos acontecimientos aún está por verse."
 sino_indian.13.a: "China busca nuevos aliados..."
 sino_indian.13.b: "¿Qué deberíamos hacer con esto?"
