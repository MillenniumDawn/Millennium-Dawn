l_korean:
 comoros_focus: "코모로 중점 계통도"
 COM_non_nato_ally: "나토에 더 가까이"
 COM_got_support: "지원이 제공됨"
 COM_buy_missile_defences: "프랑스 대공 방어 체계 구매"
 COM_army: "국가 개발군"
 COM_army_desc: "코모로 군은 공식적으로 국가 개발군이라 불리며, 규모는 작지만 전문적인 군대입니다. 육군 외에 500명 규모의 경찰력과 500명 규모의 방위군이 있으며, 둘 다 국경 수호와 군도의 영토 보전을 책임집니다."
 COM_mission_from_unrec: "UNREC의 임무"
 COM_mission_from_unrec_desc: "국제연합 평화·군축 지역센터(UNREC)는 핵무기 확산을 막고 아프리카 분쟁에 연루된 국가들의 군축을 촉진하는 데 전념합니다. UNREC와 협력하면 군대를 무장 해제하는 방향으로 나아갈 수 있으며 아프리카 대륙의 평화롭고 안전한 미래에 대한 우리의 의지를 보여 줄 수 있습니다."
 COM_african_mercenaries: "아프리카 용병"
 COM_african_mercenaries_desc: "아프리카 대륙에는 수많은 노련한 전투원이 있으며, 그중 다수는 지역의 수많은 분쟁에서 값진 경험을 쌓았습니다. 이러한 숙련된 용병을 모집하면 군의 조직과 효율성을 높여 현대전의 도전에 더 잘 대비할 수 있습니다."
 COM_modernize_the_army: "CSF 현대화"
 COM_modernize_the_army_desc: "존중받는 나라로 인정받기를 바란다면 코모로 보안군(CSF)은 시급히 현대화되어야 합니다."
 COM_expand_the_police_force: "경찰력 군사화"
 COM_expand_the_police_force_desc: "우리 경찰력은 군대와 규모가 거의 같으며, 최근 과거의 불안정을 고려하면 때때로 둘을 구별하기 어렵습니다. 차라리 그들이 이중 역할을 제대로 수행하도록 하는 편이 낫습니다."
 COM_naval_treaty_with_france: "프랑스-코모로 방위 조약"
 COM_naval_treaty_with_france_desc: "공유하는 역사를 고려하면 코모로 문제에 대한 프랑스의 간섭은 흔한 광경입니다. 해군 방어 조약은 프랑스에 우리 수역에 대한 군사적 접근을 허용하지만, 우리 스스로 진정한 해군 강국이 되고 싶다면 유일한 선택일 수도 있습니다."
 COM_naval_treaty_with_china: "중국-코모로 방위 조약"
 COM_naval_treaty_with_china_desc: "공유하는 역사를 고려하면 코모로 문제에 대한 프랑스의 간섭은 흔한 광경입니다. 다른 외국 세력을 우리의 지역 문제에 끌어들임으로써 우리에 대한 그들의 영향력에 맞서 싸워야 합니다."
 COM_modernize_the_patrol_boats: "초계정 현대화"
 COM_modernize_the_patrol_boats_desc: "우리의 현재 '코모로 해군'은 무려 1981년에 취역한 일본제 초계정 2척으로 이루어져 있습니다! 말할 것도 없이 개선이 절실합니다!"
 COM_buy_patrol_boats: "질보다 양"
 COM_buy_patrol_boats_desc: "우리의 '해군'은 해안에서 몇 마일 이상 벗어날 수 없습니다. 해외로 힘을 투사하고 싶다면 함대에 초계함 몇 척은 있어야 합니다."
 COM_expand_the_dockyards: "조선소 확장"
 COM_expand_the_dockyards_desc: "조선소가 늘어나면 더 많은 함선을 건조할 수 있으며, 우리 해군에는 더 많은 함선이 절실히 필요합니다."
 COM_fortress_comoros: "요새 코모로"
 COM_fortress_comoros_desc: "규모가 작고 제한적인 우리 군대는 안전을 영구적으로 보장하고 지킬 수 없습니다. 적의 해상 침공을 억제하기 위해 해안과 바다를 향한 경사면을 따라 표적화된 일련의 요새를 건설해야 합니다."
 COM_air_force: "코모로 공군 창설"
 COM_air_force_desc: "항공기를 조종할 수 있는 코모로인은 극소수이며, 전투기 조종사는 말할 것도 없습니다! 그럼에도 하늘을 정복하려면 공군이 필요합니다."
 COM_new_aircraft_purchases: "신규 항공기 구매"
 COM_new_aircraft_purchases_desc: "우리의 현재 항공기는 끔찍할 정도로 노후했습니다. 새 천년에 실제로 걸맞은 기종의 설계도를 구매합시다.\n\n스웨덴이 JAS 그리펜을 구매하도록 각국을 회유하고 있다는 소문이 돌고 있습니다. 우리도 몇 대 확보해야 합니다."
 COM_introduce_democracy: "민주주의 도입"
 COM_introduce_democracy_desc: "지난 수십 년간 이어진 숱한 쿠데타는 독재가 그리 안정적이지 않음을 가르쳐 주었습니다. 진정한 민주주의를 도입하여 국민이 권력을 잡도록 합시다."
 COM_befriend_the_west: "서방과의 친선"
 COM_befriend_the_west_desc: "서방 열강은 아프리카에서 민주주의로의 성공적인 전환 사례를 늘 찾고 있습니다. 그들은 우리가 필요로 하는 모든 것을 틀림없이 지원해 줄 것입니다."
 COM_tighter_edf_cooperation: "유럽개발기금과의 긴밀한 협력"
 COM_tighter_edf_cooperation_desc: "유럽개발기금(EDF)의 회원으로서 우리는 국가 발전을 위해 유럽 연합의 지원을 받을 자격이 있습니다. 이런 기회를 놓칠 수는 없습니다. 훨씬 더 긴밀한 협력의 문을 엽시다!"
 COM_maintain_dictatorship: "군사 독재 유지"
 COM_maintain_dictatorship_desc: "수년에 걸친 불안정은 코모로에 강하되 부드러운 손길로 나라를 이끌 강력한 지도자가 필요함을 가르쳐 주었습니다."
 COM_draw_closer_to_the_au: "아프리카에 더 가까이"
 COM_draw_closer_to_the_au_desc: "군사 독재는 아프리카에서 흔한 모습이며, 아프리카 연합은 우리가 민주화 추세를 거부한다고 해서 괴물로 보지 않을 수도 있습니다. 누가 우리 친구인지 확인할 때입니다."
 COM_ohada: "OHADA"
 COM_ohada_desc: "아프리카 상법 통일 기구(OHADA)는 아프리카에서 더 많은 기업 투자 기회를 마련하기 위해 1993년 모리셔스에서 설립되었습니다. 유일한 동아프리카 회원국으로서 우리는 독보적인 위치에 있으며 얻을 것이 많습니다."
 COM_form_tanzancom: "탄자니아-코모로 연방 형성"
 COM_form_tanzancom_desc: "탕가니카와 잔지바르의 정치적 연합은 완벽하지 않았습니다. 그러나 니에레레의 꿈은 그 어느 때보다 강하게 살아 있습니다! 우리는 이 연합에 가입하려 해야 합니다.\n이름을 더 쉽게 하기 위해 탄자니아는 현재의 국명을 유지하기를 원합니다."
 COM_influence_of_islam: "이슬람의 영향력"
 COM_influence_of_islam_desc: "코모로는 깊은 이슬람 국가이며, 이는 우리 국기에도 나타나 있습니다. 코모로가 다른 무엇이 되든 되지 않든, 무엇보다 먼저 언제나 이슬람 국가일 것입니다."
 COM_closer_ties_with_arab_league: "아랍 연맹과의 긴밀한 관계"
 COM_closer_ties_with_arab_league_desc: "우리는 아랍 연맹의 일원이지만 단연 가장 남쪽에 있는 회원국이며 지리적으로 고립되어 있습니다. 지리적으로 메울 수 없는 거리를 외교적으로 좁히기 위한 조치를 취해야 합니다."
 COM_seek_help_from_the_saudis: "사우디의 도움 요청"
 COM_seek_help_from_the_saudis_desc: "사우디아라비아는 이슬람 세계에서 가장 오래되고 가장 큰 세력이며, 요청한다면 수니파 형제인 코모로를 틀림없이 도울 것입니다."
 COM_befriend_baath: "바트주의에 접근"
 COM_befriend_baath_desc: "더 세속적인 범아랍주의 접근법이 코모로에 더 적합합니다. 시리아 및 이라크와 친선을 맺어 우리나라에서 바트주의를 확산시켜야 합니다."
 COM_ayatollah_sambi: "아야톨라 삼비의 야망"
 COM_ayatollah_sambi_desc: "'아야톨라'로 널리 알려진 아흐메드 압달라 모하메드 삼비는 코모로의 저명한 이슬람 지도자입니다. 그는 인기가 매우 높으며 국가 권력의 경쟁자이기도 합니다. 이슬람 원리에 대한 그의 지식은 매우 귀중할 수 있습니다."
 COM_declare_islamic_republic: "아랍 공화국 선포"
 COM_declare_islamic_republic_desc: "아야톨라 삼비는 이제 코모로 아랍 공화국의 실제 수립을 요구할 수 있는 위치에 올랐습니다. 한때 식민지였던 이 땅을 이슬람 세계의 보석으로 만듭시다!"
 COM_ghost_of_colonialism: "식민주의의 유령"
 COM_ghost_of_colonialism_desc: "우리가 독립했음에도 프랑스 식민주의자의 유령은 우리 작은 섬나라 위에 여전히 드리워져 있으며, 프랑스가 마요트를 계속 점령하고 있는 한 쉽게 사라지지 않을 것입니다. 한때의 종주국 프랑스를 어떻게 대해야 하겠습니까?"
 COM_embrace_francafrique: "프랑사프리크 수용"
 COM_embrace_francafrique_desc: "'프랑사프리크'는 아프리카의 옛 식민지에 대한 프랑스의 영향력을 가리키는 용어입니다. 우리는 이를 경멸적으로 여기지 않으며, 오히려 환영하고 받아들입니다. 프랑스는 우리의 발전에 막대하게 기여했고 우리는 그 기여에 감사하고 있습니다."
 COM_intensify_coi_engagement: "인도양 위원회 참여 강화"
 COM_intensify_coi_engagement_desc: "인도양 위원회(COI)는 코모로, 마다가스카르, 모리셔스, 레위니옹(프랑스의 해외 지방), 세이셸의 다섯 아프리카 인도양 국가로 이루어져 있습니다. COI와의 협력은 우리가 프랑스에 값진 자산임을 입증하는 최선의 방법입니다."
 COM_rejoin_france: "프랑스의 해외 데파르트망"
 COM_rejoin_france_desc: "프랑스가 우리를 해외 영토로 다시 받아들이는 방안을 적극 검토하고 있다는 소식이 들어왔습니다. 코모로는 독립 이후 남들보다 많은 불안정을 겪었으며, 이제 국민은 프랑스 종주권 아래의 안정된 시절을 그리워하고 있습니다."
 COM_antagonize_france: "프랑스와의 거리두기"
 COM_antagonize_france_desc: "우리는 옛 식민 종주국으로부터 거리를 두고 더 독립적인 외교 정책을 추구하기 시작하며, 군도의 재통일 가능성도 모색해야 합니다."
 COM_demand_mayotte: "프랑스에 마요트 반환 요구"
 COM_demand_mayotte_desc: "프랑스 폭군들에 대한 우리의 증오는 국민 사이에서 전쟁을 공공연히 요구하는 지경에 이르렀습니다. 수적으로는 열세일지 몰라도 우리의 결의는 굳건하며 정의는 우리 편에 있습니다. 신께서 원하신다면 우리는 승리할 것입니다!"
 COM_expand_moroni: "모로니 확장"
 COM_expand_moroni_desc: "모로니는 그랑드코모르 섬에 있는 우리의 수도입니다. 모든 산업 확장에서 당연한 첫 번째 선택지입니다."
 COM_kickstart_economy: "경제 시동 걸기"
 COM_kickstart_economy_desc: "코모로의 경제는 세계 최악의 수준에 속하며 우리 국민은 개선을 간절히 바라고 있습니다. 외국 투자자나 해외 원조를 앉아서 기다릴 수는 없습니다. 이제 경제를 직접 다룰 때입니다."
 COM_vanilla_exports: "바닐라 수출"
 COM_vanilla_exports_desc: "바닐라는 우리의 주요 수출품 중 하나이자 거의 전 세계에서 쓰이는 상품입니다. 생산을 대폭 늘려 그 이익을 거둡시다."
 COM_ylang_ylang: "일랑일랑"
 COM_ylang_ylang_desc: "열대 나무인 카낭가 오도라타의 꽃에서는 일랑일랑이라는 에센셜 오일을 추출할 수 있습니다. 이 오일은 여러 효능이 있다고 알려져 있으며 서방과 동방에서 큰 유행을 끌고 있는 듯합니다. 더욱 좋은 점은 이 나무가 코모로를 포함하여 지구상의 극히 일부 지역에서만 자란다는 것입니다."
 COM_expand_on_anjouan: "앙주안의 확장"
 COM_expand_on_anjouan_desc: "산업 확장을 여러 섬에 고르게 분산하는 것이 중요하며, 앙주앙은 코모로에서 두 번째로 큰 섬이므로 다음으로 눈여겨봐야 합니다."
 COM_expand_on_moheli: "모엘리 확장"
 COM_expand_on_moheli_desc: "모엘리는 코모로 제도에서 가장 작은 섬이지만, 이 섬에 산업 부문을 육성하는 것이 타당할 만큼은 충분히 큽니다."
 COM_a_federal_union: "연방 연합"
 COM_a_federal_union_desc: "국민투표는 성공을 거두었고, 우리는 이제 각 섬이 상당한 수준의 자치권을 가진 섬들의 연방인 코모로 연합이 되었습니다."
 COM_Loi_des_competences: "권한법"
 COM_Loi_des_competences_desc: "권한법(Loi des Compétences)을 입안하여 통치의 어떤 부분을 연방정부가 담당하고 어떤 부분을 각 섬의 자치 정부에 맡길지 명확히 규정할 것입니다."
 COM_operation_democracy_in_comoros: "코모로 민주주의 작전"
 COM_operation_democracy_in_comoros_desc: "노골적인 이름의 '코모로 민주주의 작전'은 현지 군벌인 모하메드 바카르 대령을 권좌에서 몰아내는 것을 목표로 2008년에 이루어진 앙주앙 섬 침공이었습니다. 우리는 아프리카 연합의 지지를 받고 있으며 우리의 임무는 분명합니다. 바카르는 물러나야 하며 그의 반란 정부는 교체되어야 합니다!"
 COM_centralize_power: "권력 중앙집권화"
 COM_centralize_power_desc: "최근의 불안정을 염두에 두고 우리는 국민투표를 아예 무시하기로 했습니다. 섬들의 끊임없는 내분은 모두가 중앙 권력에 굴복해야만 멈출 것입니다!"
 COM_claim_banc_du_geyser: "게이저 뱅크 영유권 주장"
 COM_claim_banc_du_geyser_desc: "게이저 뱅크는 코모로 동쪽의 수중 암초입니다. 프랑스와 마다가스카르 모두 석유 매장 가능성 때문에 이곳을 자국의 배타적 경제 수역이라 주장하고 있으며, 우리도 그에 따를 것입니다!"
 COM_claim_the_glorioso_islands: "글로리오소 제도 영유권 주장"
 COM_claim_the_glorioso_islands_desc: "글로리오소 제도는 게이저 뱅크 가까이에 있는 작은 섬들의 무리입니다. 법적으로는 프랑스령이지만, 국민의 지지를 이끌어내기 위해서라도 우리는 이를 코모로의 영토로 주장할 것입니다."
 COM_no_more_coups: "더는 쿠데타 없다!"
 COM_no_more_coups_desc: "우리는 이제 권력을 충분히 공고히 하여, 장차 있을 수 있는 쿠데타 시도에 대비한 비상 대책을 마련할 수 있게 되었습니다."
 COM_a_common_destiny: "공동의 운명"
 COM_a_common_destiny_desc: "우리는 고된 여정의 끝에 이르렀으며, 마침내 코모로에서 어느 정도의 안정을 이루었습니다. 이제 어디로 나아갈지는 알 수 없으나, 우리는 헌법과 '코모로인들의 공동 운명 추구(la poursuite d'un destin commun entre les Comoriens)'를 위해 싸울 것입니다."
 COM_non_nato_ally_desc: "우리는 협력을 위해 노력하고, 장차 나토에 통합되기를 추구해야 합니다. 프랑스는 나토 내에서 우리와 가장 가까운 동맹이며, 우리는 이를 잊어서는 안 됩니다."
 COM_buy_missile_defences_desc: "프랑스 대공 방어 체계의 도입은 코모로와 프랑스 사이의 강력한 양자 관계를 반영합니다. 이는 코모로의 방어 수요를 지원하겠다는 프랑스의 의지를 보여 주며 두 나라 사이의 유대를 공고히 합니다. 프랑스의 대공 방어 체계는 신뢰성, 효율성, 첨단 기술로 정평이 나 있어 코모로가 방어 역량을 강화하는 데 이상적인 선택입니다."
 COM_buy_missile_defences_rus: "러시아 대공 방어 체계 구매"
 COM_buy_missile_defences_rus_desc: "코모로는 러시아와 협력함으로써 저명한 방위 산업의 전문성과 경험에서 이익을 얻고자 합니다. 러시아는 견고한 대공 방어 체계를 개발해 온 오랜 명성이 있으며, 이를 전 세계 여러 지역에 성공적으로 배치한 바 있습니다. 이 협력은 코모로에 최첨단 기술을 제공할 뿐 아니라 지식 이전과 훈련 기회를 마련하여 도입한 체계를 효과적으로 활용하도록 보장할 것입니다."
 COM_tighter_chi_cooperation: "중국과의 긴밀한 협력"
 COM_tighter_chi_cooperation_desc: "중국과의 협력 심화는 코모로에 매우 중요합니다. 동방의 용과 맺는 경제적, 정치적 동반자 관계는 서방의 영향력이 우리 정치에 간섭하지 못하도록 해 줄 것이 분명합니다!"
 COM_befriend_the_east: "동방과의 친선"
 COM_befriend_the_east_desc: "코모로는 중국, 러시아 및 기타 동방 국가들과의 관계 개선에 모든 정치적 역량을 쏟아야 합니다. "
 anjouan_rebellion: "앙주안 반란!"
 COM_trade_deals_with_india: "인도와의 무역 협정"
 COM_trade_deals_with_india_desc: "인도는 우리 제품의 가장 큰 경제 파트너이자 수입국 중 하나입니다. 경제적 번영을 보장하려면 상호 협력을 강화해야 합니다."
 COM_trade_deals_with_singapore: "싱가포르와의 무역"
 COM_trade_deals_with_singapore_desc: "싱가포르는 우리 제품의 가장 큰 경제 파트너이자 수입국 중 하나입니다. 경제적 번영을 보장하려면 상호 협력을 강화해야 합니다."
 COM_ministry_of_economy: "경제부"
 COM_ministry_of_economy_desc: "경제부는 우리의 기술 기반을 재활성화하고 코모로의 산업 발전을 높이기 위한 새로운 생산 방식을 도입해야 합니다."
 COM_trading_with_west: "프랑스와의 협력"
 COM_trading_with_west_desc: "프랑스와의 협력 확대는 코모로 경제에 중요합니다. 프랑스 투자자들이 어쩌면 우리에게 투자를 시작할 준비가 거의 되어 있을지도 모릅니다..."
 COM_french_investments: "프랑스의 투자"
 COM_french_investments_desc: "프랑스와의 관계를 개선했으니 이제 투자를 요청할 때가 되었습니다."
 COM_russian_investments: "러시아의 투자"
 COM_russian_investments_desc: "러시아와의 관계를 개선했으니 이제 투자를 요청할 때가 되었습니다."
 COM_trading_with_east: "러시아 자금 모색"
 COM_trading_with_east_desc: "러시아와의 협력 확대는 코모로 경제에 중요합니다. 러시아 투자자들이 어쩌면 우리에게 투자를 시작할 준비가 거의 되어 있을지도 모릅니다..."
 COM_military_coop_easaf: "동아프리카 연합 군사 협력"
 COM_military_coop_easaf_desc: "동아프리카 연합(EAU)이 군사 훈련을 실시하는 것은 지역 안보를 강화하고, 회원국 간 협력을 증진하며, 동아프리카 지역의 집단 방위 역량을 높이는 데 중요한 요소가 될 수 있습니다. 이러한 훈련은 군 사이의 합동 훈련, 정보 공유, 조율의 기회를 제공하여 궁극적으로 지역 안정과 평화 유지 노력에 기여합니다."
 COM_convention_renewal_party: "코모로 부흥을 위한 대회"
 COM_convention_renewal_party_desc: "코모로 부흥을 위한 대회 (The Convention for the Renewal of the Comoros, CRC)는 코모로 제도의 정당입니다. 2002년에 정치인과 지식인들에 의해 설립되어 이들의 목표는 국가의 정치판에 새로운 희망과 안정을 만드는 것을 목표로 하고 있습니다. 이 정당은 경제 성장 촉진, 빈곤 완화, 그리고 의료 및 교육 개선을 표방하고 있습니다."
 COM_subsidies_for_education: "교육 보조금"
 COM_subsidies_for_education_desc: "잘 교육받고 건강한 인구는 번영하는 사회의 근간을 이루므로 교육에 보조금을 지급해야 합니다!"
 COM_stabilizing_society: "사회 안정화"
 COM_stabilizing_society_desc: "코모로의 사회 안정화에는 모든 이해관계자의 장기적인 헌신이 필요하며, 불안정의 근본 원인을 해결하고 포용적 발전을 촉진하는 데 중점을 두어야 합니다."
 COM_assembly_of_union: "연합 의회"
 COM_assembly_of_union_desc: "우리의 목표에 우선순위를 두고 발전 계획을 개혁하기 위해 연합을 소집해야 합니다."
 COM_purging_dissidents: "야당의 꿈을 짓밟아라"
 COM_purging_dissidents_desc: "우리의 외교 정책 결정을 바꾸려는 참칭자들에 맞서 반격 운동을 시작해야 합니다. 우리의 길은 흔들려서는 안 됩니다!"
 COM_social_agenda: "사회 의제"
 COM_social_agenda_desc: "사회 의제를 우선시하면 국내 인간 개발을 증진하는 데 도움이 됩니다. 교육, 보건, 빈곤 완화 같은 사회 문제에 집중함으로써 코모로는 시민들이 충만한 삶을 영위하는 데 필요한 자원과 기회를 누릴 수 있도록 보장할 수 있습니다. 이는 다시 인구 전체의 복지와 삶의 질에 기여할 수 있습니다."
 COM_foreign_jihadists: "외국의 지하디스트"
 COM_foreign_jihadists_desc: "우리가 가자와트를 선포하면 전 세계의 무자히딘이 정의로운 대의를 위해 싸우고자 우리나라로 올 것입니다!"
 COM_dd_TT: "§Y아랍 세계의 바트당 파트너들로부터 군사적, 정치적 지원을 받을 수 있습니다!§!"
 COM_led_new_TT: "§Y섬 간 협력을 더욱 보장하기 위해 삼비 아야톨라가 코모로의 차기 지도자가 됩니다!§!"
 COM_militarism_baath: "바트당의 PMC 군국주의"
 COM_militarism_baath_desc: "우리는 코모로를 새로운 나라로 탈바꿈시킬 것입니다. 이제 이 나라는 우리 군대의 통제를 더욱 강하게 받게 되며, 우리나라는 자체 PMC를 설립할 것입니다."
 COM_nationalization_of_capital: "자본의 국유화"
 COM_nationalization_of_capital_desc: "그 투자들은 서방 압제자들에게 수익을 안겨 주는 반면 우리 국민은 한 푼도 가질 수 없습니다! 그들을 우리 땅에서 몰아내고 우리 국민을 위한 것으로 만듭시다."
 COM_our_will_to_expand: "우리의 팽창 의지"
 COM_our_will_to_expand_desc: "사회의 새로운 이념적 기반은 우리나라를 확장하려는 우리의 의지를 분명히 드러내는 표현입니다. 아무것도 우리 앞길을 막아서는 안 되며, 우리는 이를 확실히 해야 합니다!"
 COM_orange_party: "오렌지당"
 COM_orange_party_desc: "오렌지당은 코모로 정계의 주요 세력입니다. 진보적이고 자유주의적인 가치관 덕분에 청년층과 도시 인구 사이에서 빠르게 인기를 얻었습니다. 이 정당의 원칙과 가치 선언은 민주적 이상, 인권 증진, 경제 발전을 강조합니다. 이 정당은 대통령 선거와 의회 선거에 후보를 내세웠습니다."
 COM_radical_stance_on_trafficking: "인신매매에 대한 강경 입장"
 COM_radical_stance_on_trafficking_desc: "모하메드 다우두는 코모로 정부가 인신매매(TIP)를 예방, 억제, 처벌하기 위한 조치를 강화할 것이라고 확언했습니다. 여기에는 정부가 인신매매에 대응하기 위해 설치한 부서인 실무단(Groupe de Travail)의 재가동, 핵심 파트너들 사이에서의 인신매매 인식 제고, 유엔 마약범죄사무소(UNODC)와의 협력 재활성화가 포함됩니다."
 COM_efficient_governmental_apparatus: "효율적인 정부 기구"
 COM_efficient_governmental_apparatus_desc: "다우두 대통령의 개혁 의제에서 핵심 중점 중 하나는 정부 내의 투명성과 책임성 강화입니다. 재정 감독 체계를 강화하고, 부패와 맞서 싸우며, 공직자의 윤리적 행동을 장려하기 위한 조치가 시행되었습니다. 이러한 구상은 청렴 문화를 조성하고 공공 자원이 모든 시민의 이익을 위해 효과적으로 사용되도록 하는 것을 목표로 합니다."
 COM_meritocracy: "다우두의 능력주의"
 COM_meritocracy_desc: "사람들이 뭐라고 하든 코모로 정부에는 최고 중의 최고만이 있어야 합니다. 우리의 우선순위는 회유가 아니라 효율입니다!"
 COM_push_it_to_the_limit: "한계까지 밀어붙여라"
 COM_push_it_to_the_limit_desc: "다각화의 필요성을 인식한 다우두 대통령의 개혁 의제는 국가 경제 기반의 확대를 강하게 강조합니다. 코모로는 전통적으로 농업과 어업 같은 부문에 의존해 왔으나, 대통령은 관광, 재생 에너지, 정보 기술 같은 부문을 적극적으로 육성하고 있습니다. 이러한 노력은 이 나라 고유의 자연미와 문화유산을 활용하고 신흥 산업에 잠재된 가능성을 끌어내는 것을 목표로 합니다."
 COM_balancing: "프리데르지 코녜"
 COM_balancing_desc: "모하메드 다우두는 단기적인 사업 호황보다 지속 가능한 경제 성장을 우선시하는 개혁을 시행해야 합니다. 다각화, 인프라 개발, 인적 자본 투자, 국제 협력에 신중하게 접근함으로써 다우두 대통령은 경제 거품의 위험을 피하고 코모로 국민의 장기적 번영을 보장하는 회복력 있는 경제를 구축하는 것을 목표로 해야 합니다."
 COM_daudouism: "다우두주의"
 COM_daudouism_desc: "궁극적으로 다우두 대통령의 이념이 성공을 거두려면 능력주의 및 경제 성장을 민주주의와 개인의 자유라는 원칙과 조화시킬 수 있어야 합니다. 통치의 경제적, 사회적, 정치적 측면을 모두 고려하는 포괄적 접근을 취함으로써 코모로는 번영과 민주적 진보를 함께 추구할 수 있습니다."
 COM_state_run_capitalism: "국가 자본주의"
 COM_state_run_capitalism_desc: "국가가 운영하는 자본주의 경제에 대한 다우두 대통령의 구상은 민간 기업과 정부 개입 사이에서 균형을 잡는 것을 목표로 합니다. 경제에 대한 정부의 적극적인 관여는 전략 부문을 육성하고, 투자를 유도하며, 자원과 기회의 공평한 분배를 보장하는 데 맞춰져 있습니다. 이 접근법은 모든 코모로 시민에게 이익이 되는 공정하고 포용적인 경제 환경을 조성하는 것을 목표로 합니다."
 COM_absolute_employment: "완전 고용"
 COM_absolute_employment_desc: "실업이 개인과 사회 전체의 복지에 중대한 어려움을 초래한다는 점을 인식한 다우두 대통령의 구상은, 일자리를 구하는 모든 사람이 적합하고 존엄한 일자리를 얻을 수 있도록 하는 정책과 전략의 시행을 중심으로 합니다. 이 접근법은 노동력의 잠재력을 발휘시키고, 빈곤 감소에 기여하며, 코모로의 전반적인 사회경제적 발전을 증진하는 것을 목표로 합니다."
 COM_inclusive_government: "소수자 포용"
 COM_inclusive_government_desc: "다우두 대통령 행정부는 역사적 불평등을 해소하고 경제 내 소수자 포용을 증진하기 위해 구체적인 조치를 취했습니다. 소수자가 소유한 기업과 기업가에게 표적화된 지원과 자원을 제공하여 금융, 교육 훈련, 시장 기회에 대한 접근을 돕는 노력이 이루어졌습니다. 소수자 공동체 내의 기업가 정신을 육성함으로써 정부는 모든 시민에게 이익이 되는 더 포용적이고 다양한 경제 구조를 만드는 것을 목표로 합니다."
 COM_minority_inclusive_idea: "소수 집단 포용"
 COM_eau_military_coop_idea: "UAE 군사 협력"
 COM_anjouan_idea: "앙주앙 반란"
 COM_anjouan_idea_desc: "앙주앙 섬은 [COM.GetAdjective] 정부에 맞서 공개적인 반란을 선언했습니다. 앙주앙 섬은 [COM.GetName]에서 두 번째로 큰 섬이며 나라의 막대한 부분을 차지합니다. 그들은 적절한 대표성의 부족, 공정하고 자유로운 선거, 섬의 자치를 저항의 이유로 공개적으로 내세웠습니다. 우리가 신속하게 움직이지 않으면 그들이 나라에서 완전히 분리 독립할 가능성이 있습니다."
 COM_poor_military_idea: "부패한 군대"
 COM_poor_military_idea_desc: "군은 전문적인 군대라기보다 사리사욕을 추구하는 권력 중개인 집단처럼 움직입니다. 그들의 충성은 정부의 지급금과 질서 유지에 묶여 있지만 이 지지는 언제나 조건부입니다. 시간이 지나면 모든 행정부가 그들의 눈 밖에 날 위험이 있으며, 이는 국가의 안정을 위협합니다."
 COM_big_problems_idea: "비효율적인 정부"
 COM_big_problems_idea_desc: "우리 정부는 가혹하거나, 고장 났거나, 아예 기능하지 않는 부처와 기관들로 골머리를 앓고 있습니다. 정부의 결함을 없애고 바로잡는 일에 집중하는 것이 앞으로의 최우선 과제 중 하나가 되어야 합니다."
 COM_minority_inclusive_idea_desc: "작은 나라임에도 [COM.GetName]은(는) 결코 동질적인 국가가 아니며 다양한 민족 집단과 각계각층의 사람들로 이루어져 있습니다. 소수 집단이 국가 통치에 포함되는 것이 중요하며, 그렇지 않으면 나라가 고통받을 것입니다."
 COM_eau_military_coop_idea_desc: ""
 COM_dictators_idea: "소소한 독재자들"
 COM_dictators_idea_desc: "코모로는 지난 수십 년간 성공한 쿠데타와 실패한 쿠데타를 숱하게 겪었습니다. 주지사들은 중앙정부를 희생시켜 권력을 자기 손에 넣으려 합니다."
 COM_pro_farmers_idea: "농민 우대"
 COM_pro_farmers_idea_desc: "코모로는 토지가 한정되고 농업 규모가 큰 작은 나라이지만, 우리는 농민, 어민, 그리고 다른 농업 종사자들을 똑같이 우선시해야 합니다."
 COM_agricultural_developments_idea: "농업 개발"
 COM_agricultural_developments_idea_desc: "농업 산업의 개발에 집중하면 독립 이후의 불안정에서 경제적으로 회복하고, 가장 큰 천연자원을 활용하여 성장하는 데 도움이 될 것입니다."
 COM_small_ship_project: "소형 함선 계획"
 COM_small_ship_project_desc: "너무 오랫동안 우리의 해군력은 부족했습니다. 현지 조선소 및 조선업체와 긴밀히 협력하면 연안 방어를 강화하고 인근 해역에서 우리의 영향력을 주장할 소규모 함대를 진수할 수 있습니다."
 COM_volcano_idea: "화산재로 인한 농업 손실"
 COM_volcano_idea_desc: "카르탈라 산의 분화로 넓은 지역이 화산재로 뒤덮여 농작물에 심각한 피해가 발생했습니다. 농지 복구에는 시간이 걸릴 것이며 농업 생산성은 당분간 저하된 상태로 유지될 것입니다."
 COM_typhoon_idea: "사이클론 피해 복구"
 COM_typhoon_idea_desc: "사이클론 케네스의 파괴적인 영향으로부터의 복구가 진행 중이며, 농업과 기반시설이 복원되는 데 시간이 걸리고 있습니다."
 COM_total_ban_on_personal_weapons_idea: "개인 무기 전면 금지"
 COM_total_ban_on_personal_weapons_idea_desc: "개인 방어용 무기는 지난 수십 년간 코모로에서 흔했지만 우리는 더 이상 그것이 필요하지 않습니다. 국민을 무장 해제하고 개인 무기를 전면 금지해야 합니다. 이는 사회를 안정시키고 지금부터 앞으로의 폭력 위험을 줄이는 데 도움이 될 것입니다."
 COM_naval_treaty_with_france_idea: "프랑스-코모로 해군 방어 조약"
 COM_naval_treaty_with_france_idea_desc: "프랑스와의 협상은 성과가 있었습니다. 우리는 [FRA.GetName]과(와) 해군 방어 조약을 체결했습니다. 함선에 대한 우리의 자체 개발 일부를 희생하는 대신 대규모 방위 협정과 경제 부양책 패키지를 얻었습니다."
 COM_naval_treaty_with_china_idea: "중국-코모로 해군 방어 조약"
 COM_naval_treaty_with_china_idea_desc: "중국과의 협상은 성과가 있었습니다. 우리는 [CHI.GetName]과(와) 해군 방어 조약을 체결했습니다. 함선에 대한 우리의 자체 개발 일부를 희생하는 대신 대규모 방위 협정과 경제 부양책 패키지를 얻었습니다."
 COM_the_comoros_tourism_industry: "관광 산업"
 COM_the_comoros_tourism_industry_desc: "코모로의 [COM.GetAdjective] 관광 산업은 나라의 크고도 핵심적인 부분으로, 군도 곳곳의 많은 섬에서 나라에 경제 성장과 지역 사업을 위한 자금을 제공합니다."
 COM_small_ship_project_idea: "[COM.GetAdjective] 소형 함선 계획"
 COM_small_ship_project_idea_desc: "현지 조선소 및 국제 파트너와의 협력을 통해 소규모 함선을 건조하는 계획을 성공적으로 시작했습니다. 이 함선들은 우리의 연안 방어 능력을 강화하고 지역 내 해상 입지를 높입니다."
 COM_the_east_africa_entrepot_idea: "동아프리카 중계 무역항"
 COM_the_east_africa_entrepot_idea_desc: "전략적 항만 개발과 포괄적인 경제 협력을 통해 코모로는 동아프리카 해안의 중요한 무역 거점으로 자리 잡았습니다. 우리의 전략적 위치는 아프리카, 중동, 아시아 사이의 상거래를 촉진하여 우리 섬들에 번영을 가져옵니다."
 COM_militarized_police_force_idea: "군사화된 경찰력"
 COM_militarized_police_force_idea_desc: "최근의 불안정과 쿠데타의 역사를 고려하여, 우리 경찰력은 소요 사태와 군사적 위협을 모두 다룰 수 있도록 재편되고 장비를 갖추었습니다. 경찰과 군대의 경계가 흐려졌지만, 이 이중 역할 능력은 어떤 도전에 직면하더라도 질서를 유지할 수 있도록 보장합니다."
 COM_comorosian_private_military_companies: "[COM.GetAdjective] 민간 군사 기업"
 COM_comorosian_private_military_companies_desc: "코모로는 국내외에서 활동하는 여러 민간 군사 기업의 근거지가 되었습니다. 이 민간 군사 기업들은 보안 서비스, 군사 훈련, 지역 전반의 작전 지원을 제공하여 수익을 창출하는 동시에 우리나라를 민간 군사 전문성의 중심지로 자리매김하게 합니다."
 COM_unstable_government_idea: "불안정한 정부"
 COM_unstable_government_idea_desc: "정부의 최근 사건과 불안정은 극도로 불안정한 정부를 낳아 안정적이고 미래지향적인 코모로를 가로막고 있습니다. 정부를 안정시키기 시작하는 것이 중요하며, 그렇지 않으면 정부는 계속 유동적인 상태에 놓일 것입니다."
 COM_mayotte_referendum_decisions: "마요트 주민투표"
 COM_mayotte_referendum_decisions_desc: "마요트 섬은 코모로 군도의 많은 섬 중 하나입니다. 마요트 주민들은 현재 프랑스 공화국에 남을지, 코모로에 합류할지, 독립할지를 결정하고 있습니다. 우리는 마요트가 프랑스의 일부로 남도록 하는 프랑스 쪽 운동을 지지하거나, 코모로 쪽 운동을 지지하거나, 독립 운동을 지지하는 것을 선택할 수 있습니다.\n\n현재 예상 득표율은 다음과 같습니다.\n\n- 프랑스: 득표율 [?COM.mayotte_referendum_france|Y]%\n- 코모로: 득표율 [?COM.mayotte_referendum_comoros|Y]%\n- 독립: 득표율 [?COM.mayotte_referendum_independence|Y]%"
 COM_mayotte_referendum_mission: "마오레 지위 주민투표"
 COM_mayotte_referendum_mission_desc: "주민투표가 목전에 다가왔습니다. 너무 늦기 전에 준비할 수 있는 시간은 한정되어 있습니다."
 COM_mayotte_french_support_campaign_decision: "[FRA.GetFlag] [FRA.GetAdjective] 지지 캠페인"
 COM_mayotte_french_support_campaign_decision_desc: "마요트는 확실히 우리 [FRA.GetAdjective] 인도양 영토의 일부였습니다. 주민투표에서 그들의 편이 승리하도록 지역의 프랑스 지지자들을 지원해야 합니다."
 COM_mayotte_independence_support_campaign_decision: "[MTE.GetFlag] [MTE.GetAdjective] 독립 지지 캠페인"
 COM_mayotte_independence_support_campaign_decision_desc: "마요트 주민들은 아주 오랫동안 독립을 갈망해 왔습니다. 독립 운동 지도자들에게 손을 내밀고 마요트 주민의 권리를 확대할 가능성을 검토해야 합니다."
 COM_mayotte_comorian_support_campaign_decision: "[COM.GetFlag] [COM.GetAdjective] 지지 캠페인"
 COM_mayotte_comorian_support_campaign_decision_desc: "마요트는 코모로 군도의 일부이며 따라서 우리의 위대한 연방과 하나가 되어야 합니다. 지역의 형제자매들을 계속 지원하고 그들의 입장이 전달되도록 보장하는 것이 필수적입니다."
 COM_the_constitutional_referendum_decisions: "헌법 국민투표"
 COM_the_constitutional_referendum_decisions_desc: "최근 몇 년간 코모로는 다양한 정치적 불안정과 쿠데타를 겪어 왔습니다. 이제 나라의 안정을 보장하기 위해 코모로 헌법을 개정해야 합니다. 우리는 연방주의 운동이나 중앙집권주의 운동 중 하나를 지지할 수 있지만, 어느 쪽이든 다가오는 국민투표에서 편을 들어야 합니다.\n\n연방주의 지지도: [?COM_federalist_constitutional_support|Y%0]\n중앙집권주의 지지도: [?COM_anti_federalist_constitutional_support|Y%0]"
 COM_the_constitutional_referendum_mission: "국민투표"
 COM_the_constitutional_referendum_mission_desc: "국민투표가 지평선에 다가오고 있으며 우리는 다가오는 국민투표에서 편을 들어야 합니다. 코모로의 미래에 어떤 결과가 나올지는 시간만이 알려 줄 것입니다."
 comoros.1.t: "충성 문제"
 comoros.1.d: "시리아와 이라크는 서로가 바트주의 이념의 이상적인 대표라고 선언하지만 대체로 사이가 좋지 않습니다. 그들은 우리에게 충성을 요구합니다. 우리는 어느 편에 설 것인가?"
 comoros.1.a: "하페즈가 가장 현명하다!"
 comoros.1.b: "사담이 길을 안다!"
 comoros.1.c: "그들을 화해시켜 보는 것은 어떨까?"
 comoros.4.t: "헌법 국민투표"
 comoros.4.d: "타지딘 벤 사이드 마수드를 권좌에서 몰아낸 최근의 쿠데타 이후 우리의 정부 구조는 아직 확정되지 않았습니다. 아잘리 아수마니 대통령은 지난 한 해 동안 나라를 안정시키는 데 힘썼으며, 이제 헌법 국민투표를 실시할 때가 왔습니다. 코모로가 어떤 정부 형태를 채택할지는 국민이 결정하겠지만, 우리가 여론에 영향을 미칠 수 있음은 분명합니다. 어떤 길을 권장해야 할까요?"
 comoros.4.a: "연방 국가가 옳다."
 comoros.4.b: "중앙집권 국가가 옳다."
 comoros.5.t: "코모로, 방크 뒤 가이저 영유권 주장!"
 comoros.5.d: "최근 코모로 정부는 방크 뒤 가이저에 대한 영유권을 주장했으며 그 지역에 있는 유전을 통제하고 있습니다."
 comoros.5.a: "프랑스가 그들의 결정을 후회하게 만들 것이다!"
 comoros.5.b: "감히 마다가스카르 수역에 대한 영유권을 주장하다니!"
 comoros.6.t: "코모로, 글로리오소 제도 영유권 주장"
 comoros.6.d: "코모로는 최근 글로리오소 제도를 자국 영토의 일부로 간주한다고 선언했습니다."
 comoros.6.a: "그들의 하찮은 헛소리는 우리를 괴롭히지 않는다."
 comoros.7.t: "코모로의 해군 기지"
 comoros.7.d: "[COM.GetAdjective] 정부는 우리가 그랑드코모르에 정식 해군 기지를 설치하도록 허용하겠다고 제안했습니다. 지역 내 추가 해군 기지를 설치하면 지역에서 우리의 영향력을 더욱 넓히고 동아프리카의 전략적 이익을 지킬 수 있습니다. [COM.GetAdjective] 측의 조건에 동의하시겠습니까?"
 comoros.7.a: "좋다!"
 comoros.7.b: "사실은..."
 comoros.8.t: "코모로 민주주의 작전"
 comoros.8.d: "우리는 군사 작전을 수행하고 반란을 일으킨 군벌이 통제하는 섬을 침공할 준비가 되었습니다."
 comoros.8.a: "정의로운 동맹국들을 부르자!"
 comoros.9.t: "[COM.GetName], 지원 요청"
 comoros.9.d: "코모로가 자국 섬 중 하나에서 반란을 일으킨 군벌에 맞선 특수 작전을 수행하는 데 도움을 요청해 왔습니다!"
 comoros.9.a: "물론이지"
 comoros.9.b: "우리는 별로 신경 쓰지 않는다."
 comoros.10.t: "작전 성공!"
 comoros.10.d: "우리는 작전을 성공적으로 수행했습니다. 군벌 정부가 전복되었습니다!"
 comoros.10.a: "좋다"
 comoros.11.t: "마요트의 반식민주의 집회"
 comoros.11.d: "코모로에서 마요트에 대한 프랑스의 통제를 규탄하는 대규모 시위가 일어났습니다. 반식민주의 정서가 군도 전역에서 더욱 강해지고 있습니다. 마요트 주민들이 이 무분별한 선동에서 어떤 기발한 생각을 얻지 않기를 바랄 뿐입니다..."
 comoros.11.a: "흥미롭군..."
 comoros.12.t: "코모로의 마요트 요구!"
 comoros.12.d: "마요트 주민들은 자유로울 권리가 있으며, 당신들의 식민주의적 소제국이 착취라는 이름으로 그들을 고통받게 해서는 안 된다! 그들을 해방하라, 아니면 전쟁이다!"
 comoros.12.a: "안정을 보장하는 것이 우리의 최우선 과제다."
 comoros.12.b: "한번 덤벼 보시지, 개자식들아."
 comoros.13.t: "코모로 해외 영토"
 comoros.13.d: "코모로 정부는 경제적, 재정적 안정과 만일의 사태가 발생할 경우 이웃 나라들로부터의 군사적 보호 약속을 보장받기 위해 프랑스의 해외 도로 복귀하는 방안을 우리에게 타진해 왔습니다."
 comoros.13.a: "합류를 승인한다"
 comoros.13.b: "요청을 거절한다"
 comoros.14.t: "프랑스의 거래 수락"
 comoros.14.d: "프랑스는 우리가 해외 영토가 되는 것을 허용하기로 했으며, 우리는 이제 명목상 독립을 유지하고 지방 자치를 누리면서 재정 지원과 군사적 보호를 받게 됩니다."
 comoros.14.a: "만세!"
 comoros.15.t: "코모로의 정치"
 comoros.15.d: "2000년은 아프리카 연안에 위치한 작은 나라 코모로에게 격동의 시기였습니다. 나라는 세 주요 섬인 그랑드코모르, 앙주앙, 모엘리의 대표들로 구성된 연립 정부가 통치했습니다. 그러나 섬들 사이의 긴장은 고조되어 있었으며, 각 섬은 더 많은 권력과 자원을 차지하려 다퉜습니다. 이는 정치인들이 정부의 통제권을 장악하려 하면서 빈번한 정치적 불안정과 쿠데타로 이어졌습니다. 1999년 4월, 아잘리 아수마니 대령이 이끄는 군사 쿠데타가 타지딘 벤 사이드 마수드 대통령을 전복했습니다. 아수마니는 나라에 안정을 회복하고 자유롭고 공정한 선거를 치르겠다고 약속했습니다. 이제 코모로의 미래가 어떻게 될지는 시간만이 보여 줄 것입니다."
 comoros.15.a: "흥미롭군"
 comoros.16.t: "코모로의 투자 모색"
 comoros.16.d: "[COM.GetAdjective] 대사들이 섬나라에 대한 잠재적 투자와 관련된 일련의 제안을 가지고 우리를 찾아왔습니다. 그들은 주요 무역 상대국도 거대 경제도 아니지만, 상당히 높은 수익을 가져올 수 있는 표적 투자를 할 수 있습니다. 우리의 관심을 끈 두 가지 주요 제안은 산업 보조금과 부채 재조정에 관한 것입니다. 어느 것을 선택해야 할까요? 그들의 호소를 그냥 무시할 수도 있습니다."
 comoros.16.a: "그들의 산업에 투자하자!"
 comoros.16.b: "그들의 부채를 돕자."
 comoros.16.c: "코모로? 안녕."
 comoros.17.t: "[FROM.GetName]의 산업 계획 동의"
 comoros.17.d: "우리 대사들이 좋은 소식을 가지고 돌아왔습니다. [FROM.GetName]은(는) 나라 안에 추가 공장과 산업 기반시설을 구축하는 데 협력하기로 동의했습니다."
 comoros.17.a: "굉장하군!"
 comoros.18.t: "[FROM.GetName]의 부채 재조정 동의"
 comoros.18.d: "[FROM.GetName]은(는) 우리 부채의 일부를 매입하고 탕감하여 재조정하기로 결정했습니다. 이로써 추가 자금이 확보되어 나라 안의 다른 중요한 일에 더 많이 쓸 수 있는 여지가 생깁니다."
 comoros.18.a: "좋다"
 comoros.19.t: "[FROM.GetName]"
 comoros.19.d: "[FROM.GetName]에 파견한 대사들이 슬픈 소식을 가져왔습니다. 그들은 우리의 부채 재조정이나 산업 확장에 협력할 의사가 없습니다."
 comoros.19.a: "에휴."
 comoros.20.t: "무산된 쿠데타 음모"
 comoros.20.d: "2003년 2월, 보안군은 아잘리 아수마니 대통령에 대한 쿠데타 음모를 성공적으로 저지했다고 발표했습니다. 여러 군인과 지방 장관들이 정부 전복을 계획한 혐의로 체포되었습니다. 당장의 위협은 억제되었지만, 이 사건은 우리의 젊은 연합 내에 지속되는 불안정을 부각합니다."
 comoros.20.a: "위험했다."
 comoros.21.t: "카르탈라 산 분화"
 comoros.21.d: "그랑드코모르 남부의 카르탈라 산이 분화하여 수도 모로니를 포함한 넓은 지역을 화산재로 뒤덮었습니다. 화산재는 식수를 오염시키고 농작물에 심각한 피해를 입혔으며 수천 명이 대피해야 했습니다. 정부는 피해 지역을 지원하기 위해 신속히 움직여야 합니다."
 comoros.21.a: "긴급 대응을 개시한다."
 comoros.22.t: "카르탈라 산 재분화"
 comoros.22.d: "카르탈라 산이 올해 두 번째로 분화했습니다. 화산재가 남부 마을들을 뒤덮고 수원을 오염시켜 이미 빠듯하던 식수 공급을 더욱 악화시켰습니다. 복구 노력이 진행되는 와중에 닥친 이 두 번째 재난은 정부의 대응 역량을 시험하고 있습니다."
 comoros.22.a: "또 이러다니..."
 comoros.23.t: "예메니아 항공 추락"
 comoros.23.d: "모로니 국제공항에 최종 접근하던 예메니아 항공 626편(에어버스 A310)이 코모로 해안 앞바다에 추락했습니다. 승객과 승무원 153명 중 단 한 명만이 생존했습니다. 희생자 중 다수는 프랑스에 거주하는 코모로 디아스포라 구성원이었습니다. 예메니아 항공의 항공기와 정비 관행에 대한 비판이 거세지면서 프랑스에서 대규모 시위가 일어났습니다. 시위는 항공사와 프랑스 당국을 겨냥한 것이지만, 코모로 정부는 이제 희생자 가족을 지원하고 국제 논의에 참여해야 하는 부담을 안게 되었습니다."
 comoros.23.a: "희생자들을 애도한다."
 comoros.24.t: "사이클론 케네스 강타"
 comoros.24.d: "강력한 열대 사이클론 \\"케네스\\"가 코모로를 강타하여 파괴적인 피해를 입혔습니다. 최소 7명이 사망하고 200명 이상이 부상했으며, 주요 농작물의 60~80%가 파괴되었습니다. 수만 명의 이재민이 발생했고 기반시설과 식수 공급이 심각한 피해를 입었습니다. 복구에는 상당한 자금과 시간이 필요할 것입니다."
 comoros.24.a: "긴급 구호를 개시한다"
 comoros.25.t: "모로니 교도소 집단 탈옥"
 comoros.25.d: "수감자 38명이 모로니 최대 교도소에서 탈옥했습니다. 보도에 따르면 그들은 경비가 허술한 정문으로 그냥 걸어 나왔으며, 당국은 경비원의 직무 태만과 사전 모의 가능성을 거론하고 있습니다. 정부는 경비 강화를 위해 보안 지출을 늘릴지, 수색을 계속하며 현재 수준을 유지할지 결정해야 합니다."
 comoros.25.a: "보안 지출을 늘린다"
 comoros.25.b: "현재 예산 내에서 수색을 계속한다"
 comoros.26.t: "아수마니 대통령 피습"
 comoros.26.d: "살리마니에서 열린 한 종교 지도자의 장례식 중 아잘리 아수마니 대통령이 24세 군인의 칼에 공격당해 가벼운 부상을 입었습니다. 용의자는 현장에서 체포되었으나 이튿날 구금 중 사망한 채 발견되었습니다. 이 사건은 보안군과 정치적 안정에 대한 대중의 우려를 키웠습니다."
 comoros.26.a: "보안 조치를 강화한다"
 comoros.26.b: "사건에 최소한으로 대응한다"
 comoros.27.t: "로베르 드나르 석방"
 comoros.27.d: "한때 아프리카에서 이름을 떨친 용병 로베르 드나르가 혐의가 있음에도 석방되었습니다. 이런 일이 일어난 것은 기적이지만, 어쨌든 일어났습니다. 많은 이들은 그가 우리나라를 다시 침공하기 위해 인력과 물자를 모을 수 있다고 믿습니다."
 comoros.27.a: "걱정스럽다."
 comoros.28.t: "로베르 드나르의 정부 전복"
 comoros.28.d: "용병은 수백 명의 병력을 이끌고 돌아와 정부를 성공적으로 전복하고, \\"아프리카의 전사왕\\"이라고만 알려진 인물이 이끄는 괴뢰 정권을 그 자리에 세웠습니다."
 comoros.28.a: "전사왕이시여!"
 comoros.29.t: "프랑스군에 체포된 로베르 드나르"
 comoros.29.d: "프랑스군은 약 1~2백 명의 병력으로 우리나라에서 쿠데타를 일으키러 가던 드나르를 체포했습니다. 그의 병력 대부분은 석방되었으나 드나르 본인은 체포되어 재판을 받기 위해 프랑스로 압송되었습니다."
 comoros.29.a: "속이 시원하다!"
 comoros.30.t: "로베르 드나르의 쿠데타 실패"
 comoros.30.d: "상당한 규모의 파견대를 데려왔음에도 드나르는 정부를 전복하려는 시도에서 패배했습니다. 그는 패배 후 체포되었으며 이제 그랑드코모르의 교도소에서 썩게 될 것입니다."
 comoros.30.a: "신사 숙녀 여러분, 놈을 잡았습니다."
 comoros.31.t: "헌법 국민투표 결과"
 comoros.31.d: "섬들 전역에서 몇 달에 걸친 선거 운동 끝에 헌법 국민투표가 마무리되었고 개표가 집계되었습니다. 각 섬에 자치를 부여하는 연방 구조를 받아들일지 중앙집권 정부를 추구할지에 대한 질문에 국민이 답했습니다. 이 결과는 앞으로 수년간 우리나라의 권력이 어떻게 분배될지를 좌우할 것입니다."
 comoros.31.a: "국민이 말했다."
 comoros.32.t: "마수드 전 대통령 사망"
 comoros.32.d: "파리에서 침통한 소식이 전해졌습니다. 타지딘 벤 사이드 마수드 전 대통령이 어젯밤 늦게 파리의 한 병원에서 오랜 투병의 합병증으로 76세의 나이에 별세했습니다. 아잘리 아수마니 대령이 이끈 1999년 쿠데타 당시 그가 권좌에서 밀려난 상황에는 논란이 있었음에도, 마수드는 [COM.GetAdjective] 정치사에서 중요한 인물로 남았습니다. 그의 별세 소식은 군도 전역에 깊은 울림을 주었으며, 세 섬의 시민들이 모스크와 광장에 모여 기도하고 추모했습니다. [COM.GetAdjective] 군은 그의 대통령 재임 중 국가에 대한 봉사를 기리기 위해 완전한 군 예우를 거행하겠다고 발표했습니다. 파리와 코모로에 거주하는 그의 가족은 [COM.GetAdjective] 시민들, 프랑스의 디아스포라 공동체, 국제 관찰자들이 보내 준 조의와 존경에 깊은 감사를 표했습니다. 전국의 깃발은 사흘간의 공식 애도 기간 동안 조기로 게양됩니다."
 comoros.32.a: "X를 눌러 조의를 표한다."
 comoros.33.t: "잔지바르 협정"
 comoros.33.d: "[COM.GetAdjective] 외교관들은 이례적이지만 흥미로운 제안을 우리에게 가져왔습니다. 그들은 우리 정부로부터 [253.GetName]을(를) 매입하는 협상을 원합니다. [COM.GetAdjective] 대표단은 상세한 경제 전망, 제안된 지급 일정, 현 주민들의 권리와 복지에 대한 보장을 준비해 왔습니다. 그들은 지리적 근접성과 문화적 유대가 이 합의를 양측 모두에게 이롭게 만든다고 주장하며, 이 지역의 안정과 번영을 유지하겠다는 의지를 강조했습니다. 제안에는 전환 기간, 기존 협정의 보호, 우리 국고를 크게 보강할 수 있는 상당한 금전적 보상에 대한 조항이 포함되어 있습니다. 우리 내각은 이 문제로 의견이 갈립니다. 일부는 영토 보유를 공고히 하고 경제 자원을 얻을 실용적인 기회로 보지만, 다른 이들은 주권 영토의 매각을 앞으로 비슷한 제안을 불러올 수 있는 상상할 수 없는 선례로 봅니다. 결정은 이제 우리 정부에 달려 있습니다."
