 Anti_Air_5: "ПЗРК 2045 года"
 Anti_Air_5_desc: "Переносные зенитно-ракетные комплексы — пусковые установки ракет класса «земля-воздух», запускаемые с плеча. Поскольку переносимый вес накладывает жёсткие ограничения на размеры ракет, они представляют собой системы малой дальности. Таким образом, они представляют угрозу для низколетящих самолётов и смертельно опасны для вертолётов."
 SP_Anti_Air_5: "ЗРК 2045 года"
 SP_Anti_Air_5_desc: "Системы противовоздушной обороны малой и средней дальности, устанавливаемые на технику, могут применять более крупные и, следовательно, более дальнобойные ракеты, чем ПЗРК, представляя угрозу для любых воздушных судов. Они также несут больший боекомплект. Такие комплексы ПВО сводятся в специализированные зенитные взводы и батареи."
