 EU_budget_mff_draft: "多年次財政枠組み草案"
 EU_budget_mff_draft_desc: "多年次財政枠組み（MFF）を起草した加盟国は、交渉終了後にその案を欧州議会の議題に上程しなければならない。その報酬として、MFFが承認され発効された際に、起草した加盟国は投入された政治力のすべてを得る。"
 EU_mff_draft_mission: "多年次財政枠組み交渉"
 EU_mff_draft_mission_desc: "交渉中、すべての加盟国は政治力を投入して、案を自国の構想に合うよう修正することができる。案の修正は、欧州議会の政治グループによる案への評価に影響を与える。"
