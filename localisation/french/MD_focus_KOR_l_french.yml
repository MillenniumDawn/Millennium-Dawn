 korea.64.t: "Percée de productivité industrielle"
 korea.64.d: "Des années d'investissement ciblé dans les capacités de fabrication et l'efficacité des procédés portent leurs fruits. Les usines sud-coréennes figurent désormais parmi les plus productives au monde, suscitant une reconnaissance internationale et renforçant le consensus politique autour du programme économique du gouvernement."
 korea.64.a: "Canaliser les gains vers une nouvelle expansion"
 closed_kaesong: "Parc industriel de Kaesong fermé"
 KOR_peace_talks_failed: "Échec des pourparlers de paix avec le Nord"
 KOR_proposed_unity_reunification: "Gouvernement d'unité proposé"
 KOR_samsung_memory_frontier: "Repousser la frontière de la mémoire"
 KOR_samsung_memory_frontier_desc: "Le leadership de Samsung dans la mémoire dépend d'un investissement soutenu dans de nouvelles structures de cellules, le contrôle des procédés et la fabrication à grand volume."
 KOR_samsung_foundry_services: "Construire un challenger de fonderie"
 KOR_samsung_foundry_services_desc: "Une fonderie marchande dédiée peut transformer l'expertise de procédé de Samsung en plateforme pour les concepteurs de puces externes."
 KOR_samsung_advanced_packaging: "Intégrer un packaging avancé"
 KOR_samsung_advanced_packaging_desc: "L'emballage avancé peut relier mémoire, logique et accélérateurs en systèmes de calcul complets."
 KOR_samsung_supply_resilience: "Sécuriser la chaîne des semi-conducteurs"
 KOR_samsung_supply_resilience_desc: "Des matériaux diversifiés, l'accès aux équipements et des stocks disciplinés protégeront la production coréenne des chocs extérieurs."
 KOR_samsung_hbm_ai: "Unir HBM et IA"
 KOR_samsung_hbm_ai_desc: "La mémoire à haute bande passante et la logique avancée doivent devenir une pile de calcul coréenne coordonnée."
 KOR_hanwha_k9_thunder: "Hanwha K9 Tonnerre"
 KOR_samsung_events.1.t: "NAND et System LSI"
 KOR_samsung_events.1.d: "L'activité mémoire de Samsung a atteint une échelle mondiale. La direction doit décider à quel point coupler le leadership NAND à la plus jeune opération System LSI."
 KOR_samsung_events.1.a: "Soutenir la mémoire et System LSI"
 KOR_samsung_events.1.b: "Lier la mémoire aux appareils grand public"
 KOR_samsung_events.2.t: "Le pari de la fonderie S1"
 KOR_samsung_events.2.d: "Samsung envisage un investissement logique majeur sur son complexe de Giheung. Le projet pourrait préparer l'entreprise à la fabrication sous contrat au-delà de sa base mémoire."
 KOR_samsung_events.2.a: "Bâtir le socle logique"
 KOR_samsung_events.2.b: "Développer la mémoire à grande échelle"
 KOR_samsung_events.3.t: "Une crise de gouvernance"
 KOR_samsung_events.3.d: "Lee Kun-hee a démissionné après qu'une enquête spéciale a exposé les faiblesses de la gouvernance de Samsung. Le groupe doit choisir entre une réforme visible et la continuité institutionnelle."
 KOR_samsung_events.3.a: "Renforcer la conformité et le contrôle"
 KOR_samsung_events.3.b: "Préserver la continuité de la gestion"
 KOR_samsung_events.4.t: "Galaxy entre sur le marché"
 KOR_samsung_events.4.d: "Le premier Galaxy S donne à Samsung une plateforme smartphone mondiale crédible. Son succès pourrait lier écrans, mémoire, logique et logiciel en un écosystème grand public."
 KOR_samsung_events.4.a: "Construire un écosystème Galaxy mondial"
 KOR_samsung_events.4.b: "Garder les composants au centre"
 KOR_samsung_events.5.t: "Rejoindre le programme d'investissement d'ASML"
 KOR_samsung_events.5.d: "ASML a invité Samsung à co-investir dans la prochaine génération de lithographie. La participation promet un accès plus tôt mais lie le capital à l'horizon de recherche long d'un fournisseur néerlandais."
 KOR_samsung_events.5.a: "Rejoindre le programme de co-investissement"
 KOR_samsung_events.5.a_tt: "Samsung gagne des capacités de fonderie et de résilience d'approvisionnement. ASML enregistre la participation de la Corée lorsque les Pays-Bas restent disponibles."
 KOR_samsung_events.5.b: "Conserver une allocation indépendante"
 KOR_samsung_events.5.b_tt: "Samsung refuse le programme et renforce une planification d'approvisionnement indépendante."
 KOR_samsung_events.6.t: "V-NAND atteint la production"
 KOR_samsung_events.6.d: "Samsung a commencé la production de masse de V-NAND tridimensionnel, empilant les cellules à la verticale pour dépasser les limites de la mémoire flash plane."
 KOR_samsung_events.6.a: "Mettre à l'échelle la mémoire verticale"
 KOR_samsung_events.7.t: "Techwin passe à Hanwha"
 KOR_samsung_events.7.d: "Samsung a achevé la vente de sa filiale de défense à Hanwha. Le programme K9 appartient désormais à un groupe de défense distinct de Samsung Electronics."
 KOR_samsung_events.7.a: "Transférer le programme K9"
 KOR_samsung_events.8.t: "Le rappel du Note7"
 KOR_samsung_events.8.d: "Des défaillances de batteries ont forcé un rappel mondial du Galaxy Note7. Samsung doit choisir d'accepter une refonte profonde de la qualité ou de contenir le dégât commercial immédiat."
 KOR_samsung_events.8.a: "Reconstruire le système qualité"
 KOR_samsung_events.8.b: "Limiter la réponse de l'entreprise"
 KOR_samsung_events.9.t: "Une fonderie dédiée"
 KOR_samsung_events.9.d: "Samsung sépare son activité de fonderie en une organisation dédiée. Le changement peut séduire des concepteurs extérieurs ou renforcer une stratégie d'appareils intégrée verticalement."
 KOR_samsung_events.9.a: "Concourir pour les clients marchands"
 KOR_samsung_events.9.b: "Intégrer la pile de calcul"
 KOR_samsung_events.10.t: "7LPP entre en production"
 KOR_samsung_events.10.d: "Samsung a commencé la production avec son procédé 7LPP en lithographie ultraviolette extrême, introduisant l'EUV dans la fabrication logique commerciale."
 KOR_samsung_events.10.a: "Industrialiser la production EUV"
 KOR_samsung_events.11.t: "Le relancement du Galaxy Fold"
 KOR_samsung_events.11.d: "Après avoir retardé le Galaxy Fold pour corriger des défaillances d'écran, Samsung est prêt à relancer l'appareil avec une structure de protection redessinée."
 KOR_samsung_events.11.a: "Relance après correction"
 KOR_samsung_events.12.t: "La ligne EUV V1"
 KOR_samsung_events.12.d: "La ligne V1 de Samsung à Hwaseong entre en service comme installation de fabrication EUV dédiée aux produits logiques et mémoire avancés."
 KOR_samsung_events.12.a: "Développer la fabrication EUV"
 KOR_samsung_events.13.t: "L'investissement de Taylor"
 KOR_samsung_events.13.d: "Samsung a annoncé un investissement majeur de fonderie avancée à Taylor, au Texas. Le projet diversifierait la capacité tout en approfondissant la présence de l'entreprise aux États-Unis."
 KOR_samsung_events.13.a: "Construire la fonderie de Taylor"
 KOR_samsung_events.13.b: "Prioriser la capacité coréenne"
 KOR_samsung_events.14.t: "GAA de trois nanomètres"
 KOR_samsung_events.14.d: "Samsung a commencé à produire des puces avec un procédé gate-all-around de trois nanomètres, pariant sur une nouvelle structure de transistor pour la prochaine génération de fonderie."
 KOR_samsung_events.14.a: "Mettre à l'échelle le procédé GAA"
 KOR_samsung_events.15.t: "La mémoire pour l'ère de l'IA"
 KOR_samsung_events.15.d: "Les activités mémoire, fonderie, packaging et appareils de Samsung font désormais face à un marché tiré par l'IA. Leurs choix accumulés détermineront la position stratégique de l'entreprise. Cette évaluation est une synthèse de jouabilité, non une mesure historique."
 KOR_samsung_events.15.a: "Évaluer la position stratégique de Samsung."
 KOR_samsung_integrated_ai_semiconductor_stack: "Pile de semi-conducteurs IA intégrée"
 KOR_samsung_integrated_ai_semiconductor_stack_desc: "Samsung coordonne mémoire, capacité de fonderie, packaging et appareils comme une seule plateforme industrielle de l'ère de l'IA."
 KOR_samsung_merchant_foundry_challenger: "Challenger de la fonderie marchande"
 KOR_samsung_merchant_foundry_challenger_desc: "Une fonderie tournée vers les clients offre aux concepteurs mondiaux une seconde plateforme de fabrication avancée."
 KOR_samsung_memory_ai_infrastructure_champion: "Champion de la mémoire et de l'infrastructure d'IA"
 KOR_samsung_memory_ai_infrastructure_champion_desc: "Le leadership dans la mémoire avancée fait de Samsung un fournisseur central des centres de données et des systèmes d'IA."
 KOR_samsung_global_galaxy_ecosystem: "Écosystème galactique mondial"
 KOR_samsung_global_galaxy_ecosystem_desc: "Les appareils de Samsung relient écrans, composants, logiciel et distribution mondiale en une plateforme grand public durable."
 KOR_samsung_disciplined_diversified_champion: "Champion diversifié et discipliné"
 KOR_samsung_disciplined_diversified_champion_desc: "Une gouvernance équilibrée et une profondeur technique large soutiennent Samsung même sans une voie stratégique dominante."
 KOR_samsung_market_pressure_light: "Pression des semi-conducteurs légers"
 KOR_samsung_market_pressure_light_desc: "Les files d'attente d'outils et la demande du marché créent une tension gérable sur les projets de semi-conducteurs coréens."
 KOR_samsung_market_pressure_moderate: "Pression modérée des semi-conducteurs"
 KOR_samsung_market_pressure_moderate_desc: "Les retards d'équipement et les contraintes d'accès ralentissent l'expansion des capacités coréennes et le travail d'ingénierie."
 KOR_samsung_market_pressure_severe: "Pression sévère des semi-conducteurs"
 KOR_samsung_market_pressure_severe_desc: "Un marché d'équipement tendu et des contrôles d'accès stratégiques imposent de sérieux retards à l'investissement coréen dans les semi-conducteurs."
