 ISR_new_basic_law: "근본 기본법"
 isrt_tt: "아랍계 정당이 이스라엘을 통치하고 있으므로, 우리는 [PAL.GetNameWithFlag] 및 [HAM.GetNameWithFlag]와 통합할 수 있습니다.\n\n§R그러나 이는 우리나라의 많은 사람들을 분노하게 하고 내전을 일으킬 수도 있습니다...§!"
 israel_news.16.t: "통합된 이스라틴!"
 israel_news.16.d: "최근 이스라엘 정계의 급진적인 변화로 인해, 이스라엘과 팔레스타인은 이스라틴이라는 이민족 국가로 통합하기로 결정했습니다.\n\n많은 이들은 이 연합이 매우 불안정하며 앞으로 어떤 일이 벌어질지는 미래만이 보여줄 것이라고 말합니다..."
 israel_news.16.o1: "흥미롭군."
