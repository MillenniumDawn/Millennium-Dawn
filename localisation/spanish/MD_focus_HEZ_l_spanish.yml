 international_hezbollah.1.t: "Nuevas Tropas, a tu servicio."
 international_hezbollah.1.d: "Recruiting Militias in this country was a success. We will connect these soldiers to our international operations network and they will be ready for further instructions.\n\"And truly, The Party of God are the ones who will be victorious.\""
 international_hezbollah.1.o1: "Muy bien."
 international_hezbollah.2.t: "We have sold our weapons successfully!"
 international_hezbollah.2.d: "Vendimos con éxito armas a nuestros clientes indirectos y recibimos los suministros que nos prometieron. Ojalá utilicen estas armas en nuestro favor algún día.\n\"Y en verdad, El Partido de Dios son los que serán victoriosos.\""
 international_hezbollah.2.o1: "Muy bien."
 international_hezbollah.4.t: "¡Hemos atacado la base sionista en el país objetivo!"
 international_hezbollah.4.d: "Con la voluntad y la ayuda del todopoderoso, hemos atacado y dañado una base sionista en el país elegido! Ahora temerán nuestra fuerza y voluntad de hierro! \n\"Y en verdad, El Partido de Dios son los que serán victoriosos.\""
 international_hezbollah.4.o1: "Muy bien."
 international_hezbollah.3.t: "Successful Propaganda campaign!"
 international_hezbollah.3.d: "Junto con otras operaciones influyentes, también logramos usar nuestras conexiones en el país objetivo y comenzar una campaña para ganar y reunir seguidores para nuestra causa.\n\"Y en verdad, El Partido de Dios son los que serán victoriosos.\""
 international_hezbollah.5.t: "Hezbolá ha atacado nuestras bases!"
 international_hezbollah.5.d: "They have killed and injured plenty of our forces... and they also stole and destroyed some of the equipments that were present in the base..."
 international_hezbollah.5.o1: "Bastardos..."
 international_hezbollah.3.o1: "Muy bien."
