 howards_tax_reform: "§2霍华德减税§!"
 naval_proliferation_mandate_ast: "海军扩散指令"
 support_doctrine_ast: "支持学说"
 support_doctrine_ast_desc: "我们在太平洋地区的作用最终是通过监测和协助贸易来支持我们的盟友，尤其擅长处理贸易形势岌岌可危的情况。"
 dominance_doctrine_ast: "支配学说"
 dominance_doctrine_ast_desc: "我们在太平洋地区的角色是海上霸权。通过这种霸权，我们才能执行和维护我们的各项任务，并依靠我们在海上所拥有的力量。"
 naval_contractor_grants_ast: "海军承包商拨款"
 adf_academies_idea_ast: "澳大利亚国防军学院"
 pacific_aerial_guard_ast: "太平洋空中卫队"
 cockatoo_island_investment_ast: "科克图岛投资"
 tour_the_roulettes: "参观轮盘"
 the_roulettes_tt: "在§2军事决议§!选项卡中将提供参观轮盘表演的选项。"
 john_howard_desc: "约翰·霍华德是老派自由党的最后堡垒。作为罗伯特·孟席斯的学生，同时也是中右翼思潮的拥护者，霍华德的政策引领自由党向中产阶级靠拢。他优先考虑个人自由、住房所有权和自由企业，以遏制日益高涨的工会主义浪潮，并使自由党摆脱长达十年的低迷状态。\n\n在加入自由党之前，霍华德是一名商业律师。他从青年自由党主席一路晋升，最终于1974年当选为贝内隆选区议员，由此踏入了议会政治的世界。不久之后，他便在次年被弗雷泽政府招致麾下，并被任命为商业和消费者事务部长。\n\n霍华德一路晋升，经济专业知识日益精湛，成为近75年来最年轻的财政部长。作为自由市场的拥护者，他改革老旧经济体系的努力因经济疲软而受阻，由此引发的20世纪80年代经济衰退导致自由党下台。\n\n在接下来的十年里，他在党内的地位几经沉浮，这段时期可谓是霍华德发动了一系列政变，甚至两次政变，以及多次竞选失败。最终，霍华德的机会在1996年到来，他以压倒性优势击败了时任总理保罗·基廷，竞选时承诺削减预算赤字，带领澳大利亚走出经济低迷。然而，这一承诺至今仍未兑现。"
 sydney_declaration_idea_ast: "悉尼宣言"
 AST_MOD_MILLENNIUM_DAWN_DESC: "世纪之交，澳大利亚迎来了自上世纪80年代以来的经济繁荣的首个迹象。在以进步经济政策和中等支持率著称的总理约翰·霍华德的领导下，澳大利亚在短时间内发生了显著变化。如今，随着悉尼奥运会的临近，澳大利亚正站在一个重要的文化转折点上，如果能得到稳健的领导，它将迎来辉煌的未来。\n\n尽管取得了一些进展，但不满情绪仍在增长。政府多年来忽视原住民社区的苦难，导致问题日益恶化，民众对改革停滞不前的愤怒情绪持续蔓延。资源行业的垄断地位也日益增强，以至于澳大利亚经济几乎沦为石油国家，使国家陷入极其危险的境地。"
 mining_industrialists_ast: "矿业实业家"
 mining_industrialists_ast_desc: "几十年来，一只看不见的手一直在干预澳大利亚的政治和产业。针对它们的立法似乎总是徒劳无功，而澳大利亚经济的发展方向也只有有利于矿业集团才能成功。无论是通过游说还是媒体，最终它们总是会胜出。"
 ast_rail_tt: "铁路项目将被取消"
 ast_introduce_temporary_levies: "引入临时税收"
 ast_introduce_temporary_levies_desc: "如果我们的赤字失控，我们可以对企业和高收入者征收紧急税，暂时提高税率以增加一些额外收入。"
 rudd_bop: "工党派系斗争"
