 space_auto_preset_0_desc: "Reconstruit le réseau le plus obsolète, puis passe au suivant. Rien à construire pour l'instant."
 space_auto_preset_0_desc_gnss: "Reconstruction d'abord du réseau le plus obsolète : actuellement §GGNSS§!. Passe de lui-même au suivant une fois à capacité."
 space_auto_preset_0_desc_com: "Reconstruction d'abord du réseau le plus obsolète : actuellement §GCOMSAT§!. Passe de lui-même au suivant une fois à capacité."
 space_auto_preset_0_desc_spy: "Reconstruction d'abord du réseau le plus obsolète : actuellement §GSPYSAT§!. Passe de lui-même au suivant une fois à capacité."
 space_auto_preset_1_desc: "Les quatre emplacements en GNSS. Vitesse de l'armée, précision des frappes aériennes et navales, vitesse de construction et production de ressources."
 space_auto_preset_2_desc: "Les quatre emplacements en COMSAT. Pouvoir de commandement, organisation de l'armée, vitesse de planification, pouvoir politique et opérations de renseignement."
 space_auto_preset_3_desc: "Les quatre emplacements en SPYSAT. Plafond de planification, reconnaissance, détection, efficacité des convois, vitesse de recherche et couverture du renseignement."
 space_auto_preset_4_desc: "Deux GNSS et deux COMSAT par vol. Ciblage et construction aux côtés du commandement et du contrôle."
 space_auto_preset_5_desc: "Deux GNSS et deux SPYSAT par vol. Ciblage et construction aux côtés de la reconnaissance et de la recherche."
 space_auto_preset_6_desc: "Deux COMSAT et deux SPYSAT par vol. Commandement et contrôle aux côtés de la reconnaissance et du renseignement."
 space_auto_preset_7_desc: "Deux GNSS plus un COMSAT et un SPYSAT. Le GNSS pèse double, étant le moins cher et le plus léger à mettre en orbite."
 space_auto_preset_8_desc: "Vole le manifeste que vous avez préparé à l'écran de lancement et enregistré. Les charges utiles sont toujours mises à jour vers la génération la plus récente chaque semaine."
 SPACE_AUTO_ROTATION: "§gRotation :§! [?var_space_auto_flights|C0]"
 SPACE_AUTO_ROTATION_TT: "Vols lancés par rotation. Chaque vol emporte un lanceur et le manifeste complet de charges utiles.\n\nUne rotation ne décolle que lorsque le stock contient un jeu complet pour chaque vol, donc le nombre réel peut être inférieur le temps que la production rattrape.\n\nC'est votre cadran de dépenses. Une rotation de cette taille est tarifée à environ §Y$[?var_space_auto_est_cost|C1]b§!, étalée chaque semaine sur sa durée de construction.\n\n§YLes changements s'appliquent immédiatement§! — pas besoin de couper et relancer l'automatisation. Rien déjà en production n'est re-tarifé ; la nouvelle taille n'est facturée qu'à la commande du prochain lot."
 SPACE_AUTO_ROTATION_PLUS_TT: "Un vol de plus par rotation (maximum 10)"
 SPACE_AUTO_ROTATION_MINUS_TT: "Un vol de moins par rotation (minimum 1)"
 SPACE_AUTO_BUDGET: "§gHebdomadaire :§! $[?space_prod_expense|C1]b"
 SPACE_AUTO_FUNDS: "[space_auto_funds_loc]"
 SPACE_AUTO_FUNDS_TT: "Ce qu'il reste à l'automatisation à engager : votre Trésor, moins ce que les lots en cours doivent encore.\n\nUn lot ne démarre que si cela couvre son prix entier. Ce n'est pas un chiffre hebdomadaire — le débit hebdomadaire est affiché à gauche."
 SPACE_AUTO_BUDGET_TT: "Ce que votre production en cours débite chaque semaine, et les fonds dont dispose l'automatisation.\n\nUn lot ne démarre que lorsque votre §YTrésor couvre son prix entier§!. Une fois lancé, il est payé chaque semaine sur sa durée de construction plutôt que déduit d'un coup — cela s'applique aussi aux commandes manuelles.\n\nUne rotation complète à la taille actuelle est tarifée à environ §Y$[?var_space_auto_est_cost|C1]b§!. Changer la rotation ne touche jamais ce qui est déjà en construction : les lots gardent la taille et le débit auxquels ils ont été commandés, et le nouveau chiffre n'est facturé qu'à la commande du prochain lot.\n\nAvec le §Ydéficit§! activé, le contrôle du Trésor est entièrement ignoré et les commandes partent à crédit."
 SPACE_AUTO_SAVE_BUTTON: "Enregistrer personnalisé"
 SPACE_AUTO_SAVE_BUTTON_TT: "[!space_auto_save_button_click_enabled]Enregistrer le manifeste de charges utiles préparé ci-dessus comme plan §YPersonnalisé§! et basculer dessus."
 SPACE_AUTO_SAVE_TT_trigger_2: "Au moins une §Ycharge utile§! est chargée ci-dessus"
 SPACE_AUTO_SAVE_BUTTON_TT_DELAYED: "Seuls les emplacements de charges utiles sont enregistrés. Le lanceur est toujours le plus récent que vous avez recherché, il n'a donc jamais besoin d'être choisi."
 SPACE_AUTO_UPGRADE_BUTTON: "Mettre à niveau maintenant"
 SPACE_AUTO_UPGRADE_BUTTON_TT: "[!space_auto_upgrade_button_click_enabled]Promouvoir chaque constellation vers la génération la plus récente que vous avez recherchée, partout où les satellites déjà en orbite le permettent sans perdre de couverture."
 SPACE_AUTO_UPGRADE_BUTTON_TT_DELAYED: "Rien ne promeut une constellation tout seul — elle ne fait que se dégrader — donc sans cela vos satellites plus récents restent en orbite sans rien contribuer.\n\nL'automatisation le fait après chaque lancement ; le bouton sert lorsque vous avez lancé à la main."
 SPACE_AUTO_MANIFEST: "[space_auto_manifest_loc]"
 SPACE_AUTO_MANIFEST_TT: "Le lanceur et les charges utiles qu'un seul vol emporte cette rotation.\n\nL'automatisation vole la §Yplus ancienne fusée de votre hangar encore capable de soulever une charge utile§!, afin d'écouler les étages plus anciens avant les plus récents. La nouvelle production est toujours de la génération la plus récente, donc le vieux stock s'épuise de lui-même.\n\nLes emplacements dont la constellation est déjà pleine sont cédés à une famille encore en déficit, et le manifeste est réduit à ce que cette fusée peut soulever — d'où un nombre parfois inférieur à vos quatre emplacements, et une fusée plus ancienne emportant moins de satellites par vol."
 SPACE_AUTO_BUILDING: "[space_auto_building_loc]"
 SPACE_AUTO_BUILDING_TT: "Ce qui est actuellement sur les chaînes de production. Ce sont des lots de production ordinaires — ils apparaissent aussi dans l'onglet §YProduction§! de cette fenêtre avec le temps restant, et comptent dans la limite d'un lot par type.\n\nLes lanceurs mettent bien plus longtemps à construire que les satellites, donc la première rotation après activation peut être à près d'un an."
 SPACE_AUTO_DEFICIT: "Dépenses déficitaires"
 SPACE_AUTO_DEFICIT_TT: "Autoriser les commandes quel que soit le solde du Trésor, en portant le coût comme dette.\n\nDésactivé, un lot ne démarre que si votre Trésor couvre son prix entier, donc le programme ne peut jamais dépenser de l'argent que vous n'avez pas. L'automatisation restera inactive plutôt que de trop s'engager.\n\n§RUn effondrement imminent par faillite l'arrête toujours, quoi qu'il arrive§! — cette garde ne peut pas être coupée."
 SPACE_AUTO_DEFICIT_TT_DELAYED: "C'est l'interrupteur qui permet à un programme spatial de dépasser l'économie qui le finance."
 SPACE_AUTO_STOCKPILE: "Construire à l'avance"
 SPACE_AUTO_STOCKPILE_TT: "Construire tout le programme d'avance au lieu d'une rotation à la fois.\n\nLes lanceurs prennent 240-440 jours contre 80-260 pour un satellite, donc ne commander que ce dont a besoin la prochaine rotation laisse le pas inactif à attendre des fusées. Avec ceci activé, l'automatisation commande tous les lancements dont le programme aura besoin et le reste de la constellation en un seul lot.\n\nCoûte bien plus par semaine, mais atteint la capacité bien plus tôt et continue de lancer sans pauses."
 SPACE_AUTO_STOCKPILE_TT_DELAYED: "Se marie bien avec le §Ydéficit§! : le stock est ce que votre budget achète, et l'interrupteur de déficit est ce qui en lève le plafond."
 SPACE_AUTO_LATEST_OLV: "Dernier OLV uniquement"
 SPACE_AUTO_LATEST_OLV_TT: "Ne voler que le lanceur le plus récent que vous avez recherché.\n\nDésactivé, l'automatisation vole la §Yplus ancienne fusée en stock encore capable de soulever le manifeste§! et garde la génération la plus récente en commande, afin d'écouler les étages restants d'une génération antérieure au lieu de les laisser au hangar. Une fusée plus ancienne soulève moins, donc ces vols emportent un manifeste plus petit.\n\nActivé, les étages plus anciens sont entièrement ignorés. Chaque vol emporte le manifeste complet, mais le programme attend de nouvelles fusées plutôt que de lancer ce qu'il a déjà."
 SPACE_AUTO_LATEST_OLV_TT_DELAYED: "Activez ceci lorsque vos étages restants sont trop petits pour valoir un créneau de lancement, et désactivez-le lorsque vous préférez vider le hangar plutôt qu'attendre.\n\n§RLes charges utiles SPYSAT pèsent exactement ce que la fusée correspondante peut soulever§!. Sur un plan de satellites-espions, un étage plus ancien ne peut jamais emporter la génération la plus récente, donc cet interrupteur n'y change rien."
 SPACE_AUTO_NET_GNSS: "[space_auto_net_gnss_loc]"
 SPACE_AUTO_NET_GNSS_TT: "§YSatellites de navigation§! — vitesse de l'armée, précision de l'appui aérien rapproché et des frappes navales, bombardement stratégique, positionnement et chance de toucher navale ; plus vitesse de construction et extraction de ressources côté civil.\n\nLa famille la moins chère et la plus légère à mettre en orbite."
 SPACE_AUTO_NET_COM: "[space_auto_net_com_loc]"
 SPACE_AUTO_NET_COM_TT: "§YSatellites de communications§! — pouvoir de commandement, organisation de l'armée, vitesse de planification, escorte et interception aériennes, coordination navale ; plus pouvoir politique, chiffrement, gain de réseau de renseignement et résultats d'opérations.\n\nL'efficacité dépend aussi de votre technologie de récepteurs au sol."
 SPACE_AUTO_NET_SPY: "[space_auto_net_spy_loc]"
 SPACE_AUTO_NET_SPY_TT: "§YSatellites de reconnaissance§! — plafond de planification, reconnaissance, réduction des pénalités météo, détection et efficacité des convois ; plus vitesse de recherche, couverture du renseignement dans toutes les branches et suppression de la résistance.\n\nLes surplus au-delà de vos constellations peuvent être assignés à des missions d'espionnage."
