 international_hezbollah.1.t: "Nouvelles troupes à votre service."
 international_hezbollah.1.d: "Recruiting Militias in this country was a success. We will connect these soldiers to our international operations network and they will be ready for further instructions.\n\"And truly, The Party of God are the ones who will be victorious.\""
 international_hezbollah.1.o1: "Très bien."
 international_hezbollah.2.t: "We have sold our weapons successfully!"
 international_hezbollah.2.d: "Nous avons vendu avec succès des armes à nos clients indirects et nous avons reçu les fournitures qu'ils nous avaient promises. Espérons qu'ils utiliseront ces armes en notre faveur un jour.\n\"Et vraiment, le Parti de Dieu est celui qui sera victorieux.\""
 international_hezbollah.2.o1: "Très bien."
 international_hezbollah.4.t: "Nous avons attaqué la base sioniste dans le pays ciblé !"
 international_hezbollah.4.d: "Par la volonté et l'aide du Tout-Puissant, nous avons attaqué et endommagé une base sioniste dans le pays choisi ! Maintenant, ils craindront notre puissance et notre volonté de fer ! \n\"Et vraiment, le Parti de Dieu est celui qui sera victorieux.\""
 international_hezbollah.4.o1: "Très bien."
 international_hezbollah.3.t: "Successful Propaganda campaign!"
 international_hezbollah.3.d: "Parallèlement à d'autres opérations d'influence, nous avons également réussi à utiliser nos connexions dans le pays ciblé et à lancer une campagne pour rallier des partisans à notre cause.\n\"Et vraiment, le Parti de Dieu est celui qui sera victorieux.\""
 international_hezbollah.5.t: "Le Hezbollah a attaqué nos bases !"
 international_hezbollah.5.d: "They have killed and injured plenty of our forces... and they also stole and destroyed some of the equipments that were present in the base..."
 international_hezbollah.5.o1: "Salopards..."
 international_hezbollah.3.o1: "Très bien."
