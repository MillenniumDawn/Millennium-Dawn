 raid_type_ENG_raid_nigeria: "Opération Delta Guard"
 raid_type_ENG_raid_nigeria_desC: "Le gouvernement nigérian instable s'est montré inapte à gérer les champs pétroliers du Delta. Nous devrons donc intervenir et prendre des mesures de restabilisation."
 raid_type_ENG_raid_zimbabwe: "Sauvegarde des opérations"
 raid_type_ENG_raid_zimbabwe_desc: "Le tyran qui règne au Zimbabwe doit être destitué immédiatement, car on ne peut lui confier un pays. Ses actes contre les personnes d'origine britannique et le peuple zimbabwéen montrent qu'il n'a aucune ligne rouge, et qu'il est clairement prêt à franchir les nôtres."
 ENG_dartmouth_naval_college_expansion: "Agrandissement du Collège naval de Dartmouth"
 ENG_dartmouth_naval_college_expansion_desc: "L'extension du Dartmouth Naval College marque un investissement majeur dans l'éducation et la formation maritimes au Royaume-Uni. S'appuyant sur une riche tradition navale, l'extension prévoit des installations de pointe, des programmes de formation avancés et une capacité accrue pour répondre à la demande croissante de personnels navals qualifiés."
 ENG_type_32_frigate_guardian_class: "Classe Guardian de frégate de type 32"
 ENG_type_32_frigate_guardian_class_desc: "La frégate Type 32 est une frégate destinée à la Royal Navy. Elle a été officiellement annoncée en novembre 2020 par le Premier ministre Boris Johnson à l'issue de l'Integrated Review. Construite après les frégates Type 26 et Type 31, le navire sera polyvalent et modulaire, et devrait contribuer à accroître la flotte d'escorte de surface de la Royal Navy."
 ENG_charles_harmony: "Tournée britannique Harmony du prince Charles"
 ENG_election_unlock_tt: "§YCe focus peut être débloqué lorsqu'un nouveau gouvernement a été formé avec l'élection§!"
 ENG_army_special_operations_brigade_desc: "La brigade des opérations spéciales de l'armée représente le sommet des capacités militaires du Royaume-Uni, dédiée à l'exécution de missions clandestines et exigeantes. Composée de personnels d'exception issus de différentes armes, cette brigade d'élite opère avec une précision et une adaptabilité sans égales. Dotée de technologies de pointe et d'un entraînement rigoureux, l'unité est prête au contre-terrorisme, au renseignement et à d'autres opérations à fort impact, consolidant son rôle d'atout majeur de l'appareil de défense et de sécurité du pays."
 ENG_glasgow_shipbuilidng_tt: "Cet effet peut être amélioré en achevant §Y$ENG_refine_natural_bauxite$§!"
 ENG_refine_natural_bauxite_tt: "Cela améliorera les effets de §Y$ENG_glasgow_shipbuilidng$§!"
 ENG_the_queens_speech: "[ENG_the_queens_speech_focus_title]"
 ENG_the_queens_speech_desc_key: "La nation écoute autrement lorsque le souverain parle comme voix de l'État, non de la cérémonie. Dans le discours de la Reine, un nouvel arrangement politique sera déclaré et l'agenda du gouvernement sera lié au mandat de la Couronne. Dès ce jour, la politique portera l'autorité royale, et la Grande-Bretagne agira comme un royaume d'une seule volonté."
 ENG_the_kings_speech_desc_key: "La nation écoute autrement lorsque le souverain parle comme voix de l'État, non de la cérémonie. Dans le discours du Roi, un nouvel arrangement politique sera déclaré et l'agenda du gouvernement sera lié au mandat de la Couronne. Dès ce jour, la politique portera l'autorité royale, et la Grande-Bretagne agira comme un royaume d'une seule volonté."
 ENG_inner_circle_andrew.06.t: "Le prince Andrew chassé de la famille royale"
 ENG_inner_circle_andrew.06.a: "Il ne peut plus rester"
 ENG_inner_circle_philip.04.t: "Le prince Philip est mort"
 ENG_inner_circle_philip.04.d: "Le prince Philip, duc d'Édimbourg, est mort après des décennies au centre de la vie publique royale. Sa mort marque la fin d'une ère pour la monarchie et se fera sentir dans tout le Royaume-Uni."
 ENG_inner_circle_philip.04.a: "La nation est en deuil"
 ENG_overseas_territory: "Territoire britannique d'outre-mer"
 ENG_increase_dependence_alt_TT: "Augmentera la §HDépendance§! de $RIGHT|+=0$"
 ENG_decrease_agitation_alt_TT: "Baissera l'§HAgitation§! de $RIGHT|-=0$"
 ENGGetAscendedQueenTrait_tt: "[ENGQueentrait]\n\n[ENGGetAscendedQueenTrait]"
 ENG_andrew_epstein_punishment: "$ENG_prince_andrew_leader_name$ n'est plus un membre actif de la famille royale"
 ENG_queen_elizabeth_class_carrier: "Porte-avions de classe Queen Elizabeth"
 ENG_queen_elizabeth_class_carrier_desc: "Les porte-avions de classe Queen Elizabeth ont constitué un sommet de l'aéronavale britannique, marquant un saut transformateur dans la capacité des porte-avions. Ces géants ont renforcé la projection maritime du Royaume-Uni, incarnant la modernité par leur technologie avancée, leur capacité d'emport d'aéronefs et leur rayon d'action, consolidant le stature défensif du pays à l'échelle mondiale."
 ENG_elizabeth_line_decision: "Achever l'Elizabeth Line"
 ENG_elizabeth_line_decision_desc: "Nous achevons l'Elizabeth Line à travers Londres, reliant Heathrow, le West End, la City et Canary Wharf par des trains rapides et fréquents qui réduisent les temps de trajet et boostent la productivité."
 ENG_elizabeth_queen: "Élisabeth II"
 ENG_elizabeth_queen_trait: "Queen"
 ENG_elizabeth_queen_idea: "$ENG_elizabeth_queen_trait$"
 ENG_elizabeth_queen_charles_andrew: "$ENG_queen_eldest$"
 ENG_elizabeth_queen_anne_edward: "$ENG_queen_middle$"
 ENG_elizabeth_queen_philip_william: "$ENG_queen_youngest$"
 ENG_elizabeth_ruling_monarch: "§Y$ENG_elizabeth_queen$§! est le §Ymonarque régnant§! actuel"
 ENG_typhoon_tranche_debate: "Débat sur la tranche 1 du typhon"
 ENG_typhoon_tranche_debate_desc: "Le débat sur la tranche 1 du Typhoon désigne les discussions et analyses entourant l'Eurofighter Typhoon, avion de combat multi-rôles polyvalent développé par plusieurs nations européennes. Ces débats portent souvent sur divers aspects du Typhoon, notamment ses performances, ses capacités, son rapport coût-efficacité et sa signification stratégique dans la guerre aérienne moderne."
 ENG_silicon_glenn: "Silicium Glenn"
 ENG_silicon_glenn_tt: "§YYearly Technology Boost for $CAT_information_technology$, $CAT_internet$ or $CAT_artificial_intelligence$§!"
 ENG_operation_excellence_desc: "Notre armée est une force petite mais professionnelle et capable, pouvant être déployée rapidement sur le sol national pour porter assistance au pouvoir civil et aux autres départements gouvernementaux sur demande. Cette capacité de sécurité intérieure peut être étendue et soutenue pour garder la Grande-Bretagne en sûreté."
 ENG_modern_littoral_force_desc: "La force littorale moderne britannique est une initiative stratégique qui met l'accent sur les capacités navales dans les zones côtières. Dirigée par le Royaume-Uni, cette force modernisée intègre des technologies navales avancées, des bâtiments polyvalents et des capacités de réaction rapide pour assurer la domination maritime en environnement littoral. Axée sur l'agilité et l'adaptabilité, elle renforce la capacité du Royaume-Uni à protéger ses intérêts côtiers, à répondre aux menaces émergentes et à contribuer à la stabilité régionale."
 ENG_trident_nuclear_program_desc: "Le programme Trident est la dissuasion nucléaire britannique permanente en mer, déployant des sous-marins de classe Vanguard armés de missiles balistiques Trident II D5. Cette initiative stratégique, gérée dans les installations d'Aldermaston et de Burghfield, souligne l'engagement de la nation en faveur d'une capacité de défense agile et puissante."
 ENG_mothballing_operations: "Opérations de mise en veilleuse"
 ENG_mothballing_operations_desc: "Face aux contraintes budgétaires, le gouvernement britannique choisit la voie pragmatique de la mise sous cocon des navires, une décision accueillie avec réserve par l'industrie navale, notamment BAE. Destinée à économiser des ressources, cette mesure suscite des inquiétudes sur les conséquences pour la production et les effectifs."
 ENG_modern_landing_craft_desc: "Dans le cadre de son engagement continu à renforcer ses capacités navales, le Royaume-Uni a lancé des initiatives de modernisation, notamment des investissements dans de nouvelles barges de débarquement. Aligné sur le programme Future Commando Force, le Royaume-Uni vise à renforcer ses forces amphibies, en particulier les Royal Marines, pour une efficacité accrue dans les opérations littorales et amphibies."
 ENG_mechanised_amphibious_assault_desc: "Mettant l'accent sur l'adaptabilité et la vitesse, le Royaume-Uni élabore une doctrine d'assaut amphibie mécanisé d'ensemble. Ancrée dans la synergie entre les Royal Marines et la Royal Navy, cette stratégie emploie des véhicules d'assaut amphibie (AAV) spécialisés et des barges de débarquement pour un déploiement côtier rapide. Un commandement et un contrôle intégrés, l'appui aérien et le déploiement de navires d'assaut amphibie dédiés soulignent l'engagement du Royaume-Uni à maintenir une force redoutable et polyvalente, prête à divers scénarios grâce à un entraînement et des exercices rigoureux."
 ENG_strike_brigades_desc: "Face à l'évolution des menaces, le Royaume-Uni constitue des brigades de frappe britanniques, unités polyvalentes et rapidement déployables conçues pour des opérations terrestres agiles. Comprenant infanterie, blindés et artillerie, ces brigades incarnent l'engagement de la nation en faveur de réponses militaires rapides et adaptables. L'accent mis sur les brigades de frappe renforce la capacité du Royaume-Uni à projeter sa puissance et à répondre efficacement à des défis de sécurité dynamiques et divers."
 ENG_carrier_group_debate_desc: "Une part vitale d'une marine moderne réside dans les groupes aéronavals. Nous devons débattre de la meilleure façon de les constituer."
 ENG_mothballing_operations_idea: "Opérations de mise en veilleuse navale"
 ENG_mothballing_operations_idea_desc: "Sous la pression budgétaire, le gouvernement britannique penche pour le désarmement temporaire de navires, un geste pratique mal reçu par l'industrie navale, notamment BAE. Destinée à économiser des ressources, cette décision inquiète le secteur, pesant sur la production comme sur les effectifs."
 ENG_quality_over_quantity_desc: "Guidé par le principe de la qualité plutôt que de la quantité, le Royaume-Uni privilégie l'excellence et la supériorité technologique de ses forces. Cet esprit national insiste sur l'acquisition d'équipements avancés et sophistiqués, assurant une posture de défense formidable et technologiquement en pointe. En misant sur la qualité, le Royaume-Uni vise à maximiser l'efficacité de ses forces, créant un avantage stratégique face aux défis modernes."
 ENG_mothballing_operations_idea_tt: "Tant que cet esprit national est actif, vous n'êtes §Rpas§! autorisé à prendre des §Yfocus nationaux navals§! "
 ENG_mothballing_operations_negative_opinion_tt: "Modifie l'§Yopinion de l'industrie maritime§! de §R-20§! tant que cet esprit national est actif"
 ENG_Space_Command: "Commandement spatial du Royaume-Uni"
 ENG_Space_Command_desc: "UK Space Command est le chef de file de la défense pour les opérations spatiales, les effectifs spatiaux et les capacités spatiales. C'est un commandement interarmées, basé à RAF High Wycombe, composé de personnels de la Royal Navy, de la British Army et de la Royal Air Force, ainsi que de fonctionnaires et de prestataires."
 ENG_Space_Command2_desc: "UK Space Command est le chef de file de la défense pour les opérations spatiales, les effectifs spatiaux et les capacités spatiales. C'est un commandement interarmées, basé à RAF High Wycombe, composé de personnels de la Royal Navy, de la British Army et de la Royal Air Force, ainsi que de fonctionnaires et de prestataires. Avec le retour des fameux Red Coats, l'organisation bénéficie d'un moral plus élevé et d'une fierté renouvelée."
 ENG_british_spaceports_privatized: "Les ports spatiaux britanniques privatisés"
 ENG_british_spaceports_privatized_desc: "Le Royaume-Uni embrasse une nouvelle frontière de l'exploration spatiale, en privatisant les spatioports pour faciliter les activités commerciales au-delà de la Terre. Ces installations privées marquent un tournant vers l'innovation et le soutien d'une industrie spatiale commerciale naissante au Royaume-Uni."
 ENG_establish_asteroid_mining_network_mission: "Création d'un réseau d'extraction d'astéroïdes"
 ENG_establish_asteroid_mining_network_mission_desc: "L'Agence spatiale britannique déploie des plateformes orbitales et du matériel de prospection pour lancer des opérations de ressources hors du monde."
 ENG_asteroid_mining_light_operation: "Enquête de prospection"
 ENG_asteroid_mining_light_operation_desc: "Une mission de reconnaissance à petite échelle déploie des sondes robotiques pour identifier des astéroïdes proches de la Terre exploitables."
 ENG_asteroid_mining_medium_operation: "Mission d'extraction"
 ENG_asteroid_mining_medium_operation_desc: "Une mission d'extraction dédiée cible les gisements d'astéroïdes identifiés et récupère des métaux utilisables pour l'industrie britannique."
 ENG_asteroid_mining_heavy_operation: "Expédition minière à grande échelle"
 ENG_asteroid_mining_heavy_operation_desc: "Une opération à l'échelle industrielle est lancée dans la ceinture d'astéroïdes, mobilisant les atouts miniers orbitaux les plus avancés du Royaume-Uni."
 ENG_sovereign_capability_doctrine: "Doctrine de capacité souveraine"
 ENG_sovereign_capability_doctrine_desc: "La Grande-Bretagne s'engage à maintenir une base industrielle de défense indépendante et à spectre complet. Les coûts de transition structurels pèsent à court terme sur la production civile le temps que les usines se rééquipent."
 ENG_consolidate_national_champions: "Consolider les champions nationaux"
 ENG_consolidate_national_champions_desc: "BAE Systems, Rolls-Royce et Babcock sont désignés comme piliers industriels stratégiques. Les contrats publics, les achats préférentiels et la facilitation des exportations sont orientés vers ces entreprises."
 ENG_rolls_royce_raynesway_expansion: "Agrandissement de la Rolls-Royce Raynesway"
 ENG_rolls_royce_raynesway_expansion_desc: "L'établissement de Derby à Raynesway, qui fabrique les systèmes de propulsion nucléaire des sous-marins de la Royal Navy, reçoit une injection de capital majeure. Deux nouvelles usines d'armement sont mises en service dans les East Midlands."
 ENG_barrow_strategic_shipyard: "Chantier naval stratégique de Barrow"
 ENG_barrow_strategic_shipyard_desc: "Le chantier BAE Systems de Barrow-in-Furness est désigné actif souverain protégé. Trois nouveaux chantiers navals s'ajoutent au complexe naval de Cumbria pour assurer la capacité de la prochaine classe de sous-marins nucléaires."
 ENG_combat_air_sovereignty: "Souveraineté aérienne de combat"
 ENG_combat_air_sovereignty_desc: "Le Global Combat Air Programme définit la future capacité de chasse de la Grande-Bretagne. BAE Systems dirige la phase de conception, des subventions de R&D garanties par l'État accélérant le calendrier de développement de la plate-forme."
 ENG_rolls_royce_aerospace_centre: "Centre aérospatial Rolls-Royce"
 ENG_rolls_royce_aerospace_centre_desc: "Une nouvelle installation d'essai et de production de moteurs ouvre à Filton, à Bristol, au cœur du développement du système de propulsion de nouvelle génération du programme GCAP."
 ENG_munitions_strategic_reserve: "Réserve stratégique de munitions"
 ENG_munitions_strategic_reserve_desc: "Un audit des stocks a révélé des pénuries critiques de munitions de précision. Deux nouvelles lignes de production sont mises en service pour reconstituer les réserves opérationnelles au niveau de la guerre froide."
 ENG_land_systems_sovereignty: "Souveraineté des systèmes terrestres"
 ENG_land_systems_sovereignty_desc: "Les programmes Ajax et Challenger 3 définissent la voie vers une production entièrement nationale de véhicules blindés. Une nouvelle usine d'armement est commandée pour soutenir le calendrier de livraison du programme."
 ENG_skills_pipeline_apprenticeship_act: "Loi sur le vivier de compétences et l'apprentissage"
 ENG_skills_pipeline_apprenticeship_act_desc: "Un pacte industrie-État crée 50 000 apprentissages d'ingénierie de défense, comblant le déficit de compétences laissé par la contraction industrielle de l'après-guerre froide. Deux usines d'armement supplémentaires ouvrent à mesure que la main-d'œuvre croît."
 ENG_national_armaments_director: "Directeur national des armements"
 ENG_national_armaments_director_desc: "Le poste de directeur national des armements est créé au sein du ministère de la Défense pour assurer la supervision stratégique de la base industrielle souveraine, en coordonnant les acquisitions, les licences d'exportation et l'interopérabilité alliée."
 ENG_strategic_export_pact: "Pacte d'exportation stratégique"
 ENG_strategic_export_pact_desc: "BAE Systems est autorisé à conclure des accords d'exportation garantis par l'État avec l'Australie, le Canada, le Japon et l'Italie. Les cadres AUKUS et Global Combat Air fournissent l'architecture diplomatique."
 ENG_full_spectrum_industrial_base: "Base industrielle à spectre complet"
 ENG_full_spectrum_industrial_base_desc: "La Grande-Bretagne atteint l'autosuffisance dans les cinq piliers industriels de défense : sous-marins, avions de combat, véhicules blindés, munitions et armes de précision. Le complexe est officiellement désigné actif national stratégique."
 ENG_lean_defence_posture: "Posture de défense allégée"
 ENG_lean_defence_posture_desc: "Le ministère de la Défense adopte un modèle fondé sur le signal de demande, réduisant les engagements industriels nationaux et acceptant une plus grande dépendance aux fournisseurs alliés. Les économies du Trésor affluent immédiatement."
 ENG_value_for_money_review: "Revue du rapport qualité-prix"
 ENG_value_for_money_review_desc: "L'examen par le National Audit Office des acquisitions du ministère de la Défense identifie des dépassements de coûts systématiques. Une renégociation d'ensemble des grands contrats réduit les coûts unitaires et élimine les programmes redondants."
 ENG_mothball_strategic_yards: "Mettre en réserve les chantiers stratégiques"
 ENG_mothball_strategic_yards_desc: "Trois installations de chantiers de la Royal Navy sont placées en maintenance réduite. L'économie immédiate est substantielle, mais la capacité de construction navale ne reviendra pas sans un investissement futur important."
 ENG_cancel_legacy_programmes: "Annuler les programmes hérités"
 ENG_cancel_legacy_programmes_desc: "Le Nimrod MRA4, le Sentinel R1 et leurs successeurs sont annulés avant livraison. La décision libère des capitaux mais ouvre un déficit de surveillance et de patrouille maritime qui prendra des années à combler."
 ENG_off_the_shelf_procurement: "Acquisitions sur étagère"
 ENG_off_the_shelf_procurement_desc: "La Grande-Bretagne abandonne le développement sur mesure au profit de plates-formes étrangères éprouvées. L'approche abaisse les coûts initiaux mais réduit le débit industriel national et rétrécit la base de recherche."
 ENG_f35_partnership_deepening: "Approfondissement du partenariat F-35"
 ENG_f35_partnership_deepening_desc: "Le Royaume-Uni accélère l'acquisition de F-35B à 48 cellules et approfondit l'intégration à la chaîne d'approvisionnement du Joint Strike Fighter. Les entreprises britanniques fournissent environ 15 pour cent de chaque appareil produit."
 ENG_european_defence_cooperation: "Coopération européenne de défense"
 ENG_european_defence_cooperation_desc: "La Grande-Bretagne renoue avec des partenariats bilatéraux de capacités avec la France, l'Allemagne et l'Italie. La recherche mutualisée réduit les redondances, bien que la production des usines d'armement nationales décline à mesure que les achats étrangers augmentent."
 ENG_smart_acquisition_reform: "Réforme Smart Acquisition"
 ENG_smart_acquisition_reform_desc: "Le programme de réforme des acquisitions de défense est mis en œuvre dans son intégralité. L'analyse d'investissement en amont et la modélisation des coûts sur le cycle de vie deviennent obligatoires, réduisant les modifications coûteuses en fin de parcours."
 ENG_dual_use_innovation: "Innovation à double usage"
 ENG_dual_use_innovation_desc: "Les mécanismes de transfert de technologies civil-défense sont formalisés, les entreprises d'électronique et de communications contribuant aux programmes militaires C4ISR. Deux vagues de subventions de recherche en électronique sont débloquées."
 ENG_naval_squeeze_efficiency: "Efficacité de compression navale"
 ENG_naval_squeeze_efficiency_desc: "La direction de la préparation de la flotte consolide les cycles de maintenance à Rosyth, en mutualisant outillage et bassins de main-d'œuvre pour réduire le coût par mois-coque. Une nouvelle installation de chantier ouvre pour absorber la charge consolidée."
 ENG_minimum_viable_industrial_base: "Base industrielle minimale viable"
 ENG_minimum_viable_industrial_base_desc: "La Grande-Bretagne définit le plancher irréductible de capacité de production souveraine. En deçà de ce plancher, aucune nouvelle coupe n'est permise. L'engagement stabilise les attentes de l'industrie et apaise les tensions sociales."
 ENG_strategic_reliance_doctrine: "Doctrine de dépendance stratégique"
 ENG_strategic_reliance_doctrine_desc: "Le Conseil de sécurité nationale conclut que la dépendance alliée, principalement vis-à-vis des États-Unis, est la posture la plus rentable pour une économie de taille moyenne. Les conditions de prêt-bail sont améliorées de façon permanente."
 ENG_industrial_realignment_idea: "Réalignement industriel de la défense"
 ENG_industrial_realignment_idea_desc: "Les ressources sont redirigées des lignes civiles vers la production de défense. Les usines se rééquipant pour des programmes d'armes souverains réduisent temporairement la production civile."
 ENG_capability_gap_idea: "Écart de capacité"
 ENG_capability_gap_idea_desc: "L'annulation des programmes hérités a laissé les forces armées sans systèmes de remplacement. La préparation opérationnelle est réduite jusqu'à l'achèvement des nouvelles acquisitions."
 ENG_p125_revival: "Relance du programme P.125"
 ENG_p125_revival_desc: "La relance du projet P.125 a redynamisé la fabrication nationale de chasseurs, réduisant le coût de production des appareils légers à mesure que le programme mûrit."
