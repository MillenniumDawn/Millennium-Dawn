 medium_tank_rocket_chassis_0: "1세대 다연장로켓발사시스템(MLRS) 차체"
 medium_tank_rocket_chassis_0_desc: "다수의 로켓 묶음으로 구성된 다연장로켓발사시스템은 로켓 포격으로 한 지역을 제압하도록 설계되었습니다."
