 deep_state_purge_started_tt: "§YИдёт масштабная чистка военного руководства.§!"
 deep_state_army_disruption_tt: "§RНа время этого процесса организация армии резко просядет.§!"
 deep_state_purge_complete_tt: "§GЧистка завершена. Гражданский контроль в основном восстановлен.§!"
 deep_state_cooperation_tt: "§YСотрудничество с военным руководством даёт стабильность, но усиливает их влияние.§!"
 deep_state_stability_boost_tt: "§GСотрудничество с военными ненадолго укрепило стабильность.§!"
 deep_state_cooperation_warning_tt: "§R£generic_warning Власть глубинного государства подходит к опасной черте! Дальнейшее сотрудничество рискованно.§!"
 deep_state_intel_reform_started_tt: "§Y£generic_intelligence Спецслужбы перестраивают ради гражданского контроля.§!"
 deep_state_expect_pushback_tt: "§RСпецслужбы будут сопротивляться этим реформам. £political_power Прирост политической власти снижен.§!"
 deep_state_intel_reformed_tt: "§GСпецслужбы работают под настоящим гражданским контролем.§!"
 deep_state_surveillance_removed_tt: "§YУбран национальный дух «Расширенная слежка»§!"
 deep_state_loyal_officers_tt: "§YНа ключевые посты назначают офицеров, верных гражданскому правительству.§!"
 deep_state_loyalists_placed_tt: "§GЛояльные офицеры заняли ключевые посты в военной иерархии.§!"
 deep_state_emergency_declared_tt: "§R£generic_warning ВВЕДЕНО ЧРЕЗВЫЧАЙНОЕ ПОЛОЖЕНИЕ!§!"
 deep_state_emergency_effect_tt: "§YЧрезвычайные полномочия включены:\n• Рост глубинного государства заморожен на 180 дней\n• Стабильность снижена\n• Поддержка войны выросла§!"
 deep_state_negotiation_started_tt: "§YНачаты тайные переговоры с военным руководством.§!"
 deep_state_negotiation_success_tt: "§GПЕРЕГОВОРЫ УДАЛИСЬ!\nГенералы согласились умерить своё участие в политике.\nВласть глубинного государства: -4\n Стабильность: +2%§!"
 deep_state_negotiation_partial_tt: "§YЧАСТИЧНЫЙ УСПЕХ\nКое-какие уступки получены, но военные по-прежнему влиятельны.\nВласть глубинного государства: -2§!"
 deep_state_negotiation_failed_tt: "§RПЕРЕГОВОРЫ ПРОВАЛИЛИСЬ!\nГенералы отвергли ваши предложения и лишь окопались прочнее.\nВласть глубинного государства: +2\n Стабильность: -3%§!"
