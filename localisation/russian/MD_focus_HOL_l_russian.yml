 HOL_add_dutchaid: "Создать Голландскую программу помощи"
 HOL_add_dutchaid_desc: "Запустите Голландскую программу помощи для оказания помощи в целях развития странам-партнерам. Требуется завершение программы помощи WIC Голландии и достаточный экономический потенциал."
 HOL_remove_dutchaid: "Отозвать Голландскую программу помощи"
 HOL_remove_dutchaid_desc: "Сверните голландскую программу помощи, перенаправив ресурсы на внутренние приоритеты."
 HOL_nonselfsufficient_army_emergency_tt: "\n§YЧто нужно, чтобы снять чрезвычайное положение:§!\n - Более 15 $arms_factory$\n - Отсутствие $HOL_nonselfsufficient_army1$\n - Запасов больше, чем развёрнуто, по позициям: $infantry_weapons_type$, $util_vehicle_type$, $cnc_equipment_type$, $artillery_equipment$, $medium_tank_amphibious_chassis$, $medium_tank_flame_chassis$, $medium_tank_chassis$"
 HOL_shell: "Купить акции Shell"
 HOL_shell_desc: "Компания Royal Dutch Shell, глобальная энергетическая компания со штаб-квартирой в Нидерландах, является ведущим игроком в энергетическом секторе страны. Обладая диверсифицированным портфелем, включающим нефть, газ, возобновляемую энергию и низкоуглеродные технологии, Shell стремится к развитию энергетического перехода и предоставлению устойчивых решений, отвечающих меняющимся потребностям общества."
 HOL_green_shell: "Shell зеленеет"
 HOL_green_shell_desc: "Приверженность Shell устойчивому развитию и возобновляемой энергетике, переход к более чистым источникам — ветру, солнцу и водороду. Вкладываясь в зелёные технологии, новые решения и низкоуглеродные начинания, Shell стремится возглавить энергетический переход и ответить на вызовы изменения климата, приближая более устойчивое будущее."
 HOL_blauwwind: "Blauwwind"
 HOL_blauwwind_desc: "Blauwwind — проект морской ветроэнергетики в нидерландской части Северного моря, объединяющий несколько ветропарков, которые строит консорциум компаний. Используя энергию ветра, Blauwwind поддерживает цели Нидерландов по возобновляемой энергетике, снижает выбросы углерода и способствует бережному отношению к природе. Через сотрудничество и новшества Blauwwind расширяет морские ветровые мощности и приближает переход к чистой энергетике."
 HOL_porthos_project: "Проект Porthos"
 HOL_porthos_project_desc: "Проект Porthos — начинание по улавливанию и хранению углерода, призванное сократить выбросы парниковых газов от промышленности Роттердамской области. Улавливая CO2 и закачивая его в выработанные морские газовые месторождения, Porthos помогает бороться с изменением климата, поддерживая декарбонизацию промышленности и цели устойчивого развития."
 HOL_energy_transition_campus: "Energy Transition Campus Amsterdam"
 HOL_energy_transition_campus_desc: "Energy Transition Campus Amsterdam служит средоточием исследований, новшеств и сотрудничества в области энергетического перехода и устойчивого развития. Сводя вместе промышленность, науку, власть и общество, кампус рождает междисциплинарные решения, обмен знаниями и внедрение технологий, ускоряя переход к низкоуглеродной и устойчивой энергетике."
 HOL_hefa: "HEFA"
 HOL_hefa_desc: "Гидроочищенные эфиры и жирные кислоты (HEFA) — технология возобновляемого авиационного топлива, призванная сократить выбросы углерода в авиации. Превращая устойчивое сырьё — растительные масла и животные жиры — в биотопливо, пригодное для нынешних двигателей, HEFA позволяет авиакомпаниям уменьшить углеродный след и уложиться в цели по сокращению выбросов, оставаясь прибыльными."
 HOL_holland_hydrogen: "Holland Hydrogen 1"
 HOL_holland_hydrogen_desc: "Holland Hydrogen 1 занимается развитием водородных технологий и инфраструктуры в Нидерландах в рамках стратегии энергетического перехода. Продвигая производство, распределение и применение водорода, проект стремится раскрыть его возможности как чистого и универсального энергоносителя и поддержать декарбонизацию транспорта, промышленности и теплоснабжения."
 HOL_no_green_shell: "Специализация Shell"
 HOL_no_green_shell_desc: "Shell остаётся верна своему основному делу — разведке, добыче и поставкам невозобновляемых источников энергии, нефти и природного газа. По-прежнему делая ставку на ископаемое топливо, Shell ведёт шельфовое бурение, переработку и нефтехимическое производство. Несмотря на растущее внимание к возобновляемой энергетике, Shell держится стратегии покрывать мировой спрос на энергию за счёт освоения и использования привычных источников."
 HOL_shell_energy_rotterdam: "Энергохимический парк Shell"
 HOL_shell_energy_rotterdam_desc: "Расположенный в Европорте энергохимический парк Shell в Роттердаме — крупный промышленный узел производства энергии и нефтехимии в Нидерландах. Благодаря современным установкам и связанной инфраструктуре парк обеспечивает самые разные производства: переработку нефти, выпуск химикатов и генерацию энергии. Как одна из опор нидерландской экономики, он способствует развитию края, созданию рабочих мест и новшествам в энергетике и химии."
 HOL_europoort_modernization: "Модернизация Европорта"
 HOL_europoort_modernization_desc: "Европорт, один из крупнейших нефтехимических комплексов Европы, непрерывно обновляется ради большей отдачи, бережности к природе и конкурентоспособности. Вкладываясь в технику, обновляя инфраструктуру и отлаживая процессы, Европорт стремится остаться ведущим энергетическим и промышленным узлом, питая рост хозяйства и улучшая экологические показатели Роттердамской области."
 HOL_shell_moerdijk: "Расширение химического парка Shell в Мурдейке"
 HOL_shell_moerdijk_desc: "Химический парк Shell в Мурдейке — важный узел химического производства и разработок в Нидерландах. Располагая новейшими установками и делая ставку на бережность к природе, парк выпускает широкий круг нефтехимической продукции: пластмассы, растворители и специальные химикаты. Работая с отраслевыми партнёрами и научными учреждениями, химический парк Shell в Мурдейке двигает вперёд технику и создаёт добавленную стоимость в химической отрасли."
 HOL_borsele_choice: "Выбор по электростанции в Борселе"
 HOL_borsele_choice_desc: "Будущее реактора в Борселе на распутье. По мере роста спроса на устойчивые и надёжные источники энергии предстоит решить, наращивать ли мощность реактора или переоборудовать площадку в современную угольную станцию с чистыми технологиями. Каждый путь несёт свои выгоды и трудности и определяет энергетическое будущее Нидерландов."
 HOL_syngas_production: "Производство синтез-газа"
 HOL_syngas_production_desc: "Производство синтез-газа — превращение разного сырья (природного газа, угля или биомассы) в синтез-газ, универсальный промежуточный продукт для химического синтеза и генерации энергии. Благодаря передовым технологиям и отлаженным процессам установки синтез-газа, в том числе принадлежащие Shell, играют важнейшую роль в снабжении сырьём нефтехимии, производства удобрений и топлива, поддерживая промышленное развитие и цели энергетического перехода."
 HOL_solar_moerdijk: "Solar Moerdijk"
 HOL_solar_moerdijk_desc: "Solar Moerdijk — солнечный энергетический проект в промышленной зоне Мурдейка в Нидерландах. Размещая фотоэлектрические панели на кровлях предприятий и пустующих участках, Solar Moerdijk вырабатывает возобновляемое электричество, сокращает выбросы углерода и повышает энергетическую устойчивость, используя уже имеющуюся инфраструктуру и бережно распоряжаясь землёй."
 HOL_nam: "Учредить Nederlandse Aardolie Maatschappij"
 HOL_nam_desc: "Nederlandse Aardolie Maatschappij (NAM) — нидерландская нефтегазовая компания, отвечающая за разведку, добычу и освоение углеводородов в Нидерландах. Работая и на суше, и на шельфе, NAM играет ключевую роль в покрытии энергетических нужд страны, соблюдая при этом требования безопасности, бережного отношения к природе и законодательства."
 HOL_nam_groningen: "NAM Гронинген"
 HOL_nam_groningen_desc: "Гронинген на севере Нидерландов — место одного из крупнейших в Европе месторождений природного газа. Как ключевой энергетический узел, Гронинген исторически снабжал газом нидерландские дома и промышленность. Однако недавние опасения из-за вызванной добычей сейсмичности и вреда природе привели к постепенному сокращению добычи, что знаменует поворот к устойчивой энергетике."
 HOL_nam_waddenzee: "NAM Ваддензе"
 HOL_nam_waddenzee_desc: "Ваддензе, объект Всемирного наследия ЮНЕСКО, хранит возможности для разведки нефти и газа на севере Нидерландов. Уравновешивая охрану природы и освоение ресурсов, это начинание нацелено на ответственную разработку энергетических запасов Ваддензе. Через тщательное планирование, передовые технологии и природоохранные меры оно стремится освоить шельфовые ресурсы, сохранив целостность этой особенной морской среды."
 HOL_nam_drenthe_oil: "NAM Дренте"
 HOL_nam_drenthe_oil_desc: "«Нефть Дренте» — добыча и использование нефтяных запасов провинции Дренте, известной своими сухопутными месторождениями. Как часть нидерландской углеводородной добычи, она помогает покрывать внутренний спрос на энергию и поддерживает местное хозяйство, одновременно подталкивая к разговору о бережном отношении к природе и стратегии энергетического перехода."
 HOL_nam_rotterdam: "NAM Роттердам"
 HOL_nam_rotterdam_desc: "Роттердам, крупнейший морской порт и промышленный узел Европы, играет важнейшую роль в энергетике Нидерландов. Как крупный транспортный и логистический центр, Роттердам служит воротами для ввоза нефти, вывоза нефтепродуктов и нефтехимического производства. Выгодное положение, развитая инфраструктура и смелые начинания делают город ключевым участником мирового энергетического перехода."
 HOL_nam_pernis_refineries: "Нефтепереработка в Пернисе"
 HOL_nam_pernis_refineries_desc: "Нефтеперерабатывающий комплекс в Пернисе, которым управляет Royal Dutch Shell, — один из крупнейших в Европе; он расположен под Роттердамом. Благодаря современным установкам и связанным с ними нефтехимическим производствам Пернис играет важнейшую роль в переработке нефти в широкий круг продуктов — топливо, смазочные материалы и химическое сырьё, — обеспечивая энергетические нужды области и её промышленное развитие."
 HOL_regio: "Экономика областей"
 HOL_regio_desc: "Пока Рандстад процветает, важно позаботиться и о благополучии остальных Нидерландов. Вложения в более широкий круг областей уравновесят рост хозяйства и улучшат жизнь по всей стране."
 HOL_dutch_agriculture: "Вложения в нидерландское сельское хозяйство"
 HOL_dutch_agriculture_desc: "Нидерланды считаются одной из самых эффективных сельскохозяйственных стран и вторым в мире экспортёром сельхозпродукции. Нам нужно вкладываться в эту отрасль, чтобы оставаться впереди"
 HOL_plantlab: "Создание Plantlab"
 HOL_plantlab_desc: "PlantLab — нидерландская агротехнологическая компания, специализирующаяся на вертикальном земледелии. Опираясь на передовые приёмы выращивания в помещении, включая гидропонику и светодиодное освещение, PlantLab переворачивает производство еды и позволяет круглый год выращивать качественные культуры в управляемых условиях. Делая ставку на бережность и экономию ресурсов, PlantLab способствует развитию городского земледелия и устойчивого продовольствия."
 HOL_kringlooplandbouw: "Kringlooplandbouw"
 HOL_kringlooplandbouw_desc: "Земледелие замкнутого цикла — способ ведения хозяйства, при котором круговорот веществ замкнут. Это значит, что все вещества, вынесенные сельским хозяйством с участка, туда же и возвращаются. Сколько веществ, например нитратов, покидает участок, столько должно и вернуться. Доступные ресурсы используются как можно бережнее, и хозяева стараются уравновесить их вынос и поступление. Исследования Вагенингенского университета показывают, что замкнутый цикл снижает содержание нитратов в грунтовых водах, уменьшая вынос азота с обрабатываемых земель."
 HOL_smart_dairy_farming: "Умное молочное животноводство"
 HOL_smart_dairy_farming_desc: "Умное молочное животноводство опирается на цифровые технологии и работу с данными, чтобы отладить производство молока и управление хозяйством. Датчики, автоматика и предсказательная аналитика улучшают содержание животных, повышают отдачу и снижают вред природе. Делая ставку на продуманность и новшества, умное животноводство позволяет фермерам принимать обоснованные решения и добиваться отличных результатов в современном сельском хозяйстве."
 HOL_zero_dairy_farming: "Проект «Молочное животноводство с нулевыми выбросами»"
 HOL_zero_dairy_farming_desc: "Проект «Молочное животноводство с нулевыми выбросами» призван сократить выбросы парниковых газов и вред окружающей среде в молочном производстве за счёт новых технологий и бережного хозяйствования. Установки возобновляемой энергии, улавливание метана и связывание углерода должны привести отрасль к углеродной нейтральности и утвердить методы земледелия, устойчивые к изменению климата. Опираясь на бережное отношение к земле, проект открывает путь к более зелёному молочному животноводству."
 HOL_digital_agriculture: "Программа цифрового земледелия"
 HOL_digital_agriculture_desc: "Сельское хозяйство меняется, и пора ввести его в цифровую эпоху. Приняв программу цифрового земледелия, мы дадим фермерам передовые средства: точное земледелие, обработку данных и умные системы полива. Это начинание призвано повысить отдачу сельского хозяйства, сократить потери и укоренить бережные методы ведения хозяйства. Будущее сельского хозяйства цифровое, и эта программа выведет наших фермеров вперёд."
 HOL_food_valley: "Holland Food Valley"
 HOL_food_valley_desc: "Holland Food Valley — ведущий нидерландский кластер новшеств в агропищевой отрасли, сводящий вместе компании, научные учреждения и государственные ведомства ради разработок и сотрудничества в пищевой промышленности. Делая упор на исследования, передачу технологий и выход на рынки, Holland Food Valley ускоряет создание и внедрение новых продуктов, процессов и деловых моделей, выводя Нидерланды в мировые лидеры агропищевых новшеств."
 HOL_floating_farm_project: "Проект «Плавучая ферма»"
 HOL_floating_farm_project_desc: "Открытая в 2019 году в роттердамской гавани Мервехавен, «Плавучая ферма» — первая в мире плавучая молочная ферма. Её коров кормят отходами, собранными по городу в замкнутом цикле: пивной дробиной, картофельными очистками и травой со скошенных парков и полей для гольфа, а навоз перерабатывается на месте. Построенная так, чтобы держаться на воде, площадка служит испытательным полигоном для приспособленного к климату производства еды на воде в дельтовой стране, где море поднимается, а городской земли не хватает."
 HOL_stedelijke_reststromen: "Городские остаточные потоки"
 HOL_stedelijke_reststromen_desc: "Муниципалитеты направляют скошенную вдоль дорог траву и раздельно собранные пищевые отходы на соседние фермы, где биореакторы превращают их в биогаз, а оставшийся субстрат возвращается на поля как удобрение. Так замыкается круговорот питательных веществ и энергии между городом и окрестной деревней."
 HOL_boeren_en_gemeenschap: "Фермеры и община"
 HOL_boeren_en_gemeenschap_desc: "В ответ на средства, идущие из городов, фермеры поддерживают местные спортивные клубы и сельские объединения. Это укрепляет связь сельского хозяйства с жизнью общин и поддержку аграрного сектора."
 HOL_enpower_gedeputeerde_staten: "Расширить полномочия Gedeputeerde Staten"
 HOL_enpower_gedeputeerde_staten_desc: "Расширение самостоятельности и средств областных властей (Gedeputeerde Staten) позволяет проводить более точную и действенную местную политику."
 HOL_lelystad_airport: "Создание аэропорта Лелистад"
 HOL_lelystad_airport_desc: "Проект расширения аэропорта Лелистад призван разгрузить Схипхол за счёт роста пропускной способности и улучшения инфраструктуры в Лелистаде. Он включает удлинение взлётных полос, обновление терминалов и улучшение обслуживания пассажиров. Ожидается, что проект улучшит транспортную связность, поможет туризму и росту хозяйства во Флеволанде и соседних областях."
 HOL_provincial_railways: "Вложения в областные железные дороги"
 HOL_provincial_railways_desc: "Проект областных железных дорог включает такие начинания, как Lelylijn, Wunderline и «Трёхстрановой поезд», призванные улучшить сообщение внутри страны и через границу. Lelylijn предлагает скоростную линию между северными провинциями и Рандстадом. Wunderline улучшает сообщение между Гронингеном и немецким Бременом, а «Трёхстрановой поезд» связывает Нидерланды, §Y[BEL.GetNameWithFlag]§! и Германию."
 HOL_eindhoven_brainport: "Eindhoven Brainport"
 HOL_eindhoven_brainport_desc: "Проект Eindhoven Brainport превращает Эйндховен в ведущий центр технологий и новшеств. Развивая высокотехнологичные отрасли, поддерживая научные учреждения и поощряя стартапы, это начинание призвано двигать технический прогресс и рост хозяйства в области."
 HOL_balanced_national_development: "Сбалансированное развитие страны"
 HOL_balanced_national_development_desc: "Теперь, когда регионы процветают, мы стремимся к сбалансированному развитию всей страны. Согласованная работа Рандстада и регионов обеспечит устойчивый и справедливый рост по всей стране. Это включает меры и вложения, увязывающие хозяйственную деятельность с развитием инфраструктуры."
 HOL_diversify_groningen_economy: "Разнообразить хозяйство Гронингена"
 HOL_diversify_groningen_economy_desc: "После прекращения добычи природного газа в Гронингене из-за сейсмических рисков усилия направлены на то, чтобы сделать хозяйство области разнообразнее. Это включает вложения в возобновляемую энергетику, технологические отрасли и бережное сельское хозяйство."
 HOL_landbouwregio: "Landbouwregio van de 21ste Eeuw"
 HOL_landbouwregio_desc: "Чтобы привести сельские области в XXI век, нужно внедрять передовые сельскохозяйственные технологии и бережные методы. Это начинание нацелено на обновление приёмов земледелия, улучшение логистики поставок и продвижение методов, щадящих природу."
 HOL_health_houses: "Дома здоровья"
 HOL_health_houses_desc: "Начинание «Дома здоровья» предусматривает создание по всей области объединённых медицинских центров, оказывающих всестороннюю помощь и заботящихся об общественном здоровье. Эти центры соберут под одной крышей первичную помощь, специализированное лечение и оздоровительные программы, сделав медицину доступнее и улучшив жизнь жителей."
 HOL_dutch_economic_landscape: "Экономика на трёх опорах"
 HOL_dutch_economic_landscape_desc: "Нидерландская экономика стоит на трёх опорах: международная торговля, передовое сельское хозяйство и встроенный в мировой рынок сектор услуг. Благодаря портам мирового уровня, новаторскому агробизнесу и сильным позициям в финансах и логистике Нидерланды весят куда больше своих размеров. Эта уравновешенная модель питает рост и устойчивость, но остаётся чувствительной к мировым потрясениям и политическим переменам."
 HOL_randstad: "Рандстад"
 HOL_randstad_desc: "Рандстад, включающий крупные города — Амстердам, Роттердам, Гаагу и Утрехт, — хозяйственный двигатель Нидерландов. Вкладываясь в инфраструктуру и развитие бизнеса, мы намерены ещё больше укрепить его роль мотора страны."
 HOL_zuidas_development: "Застройка Зёйдаса"
 HOL_zuidas_development_desc: "Квартал Зёйдас в Амстердаме — важнейший финансовый центр. Расширение его возможностей и улучшение инфраструктуры привлекут больше международных компаний и закрепят за ним статус мирового финансового центра."
 HOL_randstad_rail: "Randstad Rail"
 HOL_randstad_rail_desc: "Проект RandstadRail связывает Гаагу, Роттердам и Зутермер удобной сетью скоростного трамвая. Развитие этой сети улучшит сообщение внутри края."
 HOL_smart_city_initiative: "Курс на умный город"
 HOL_smart_city_initiative_desc: "Вложения в технологии умного города по всему Рандстаду сделают наши города удобнее, бережнее к природе и привлекательнее и для бизнеса, и для жителей."
 HOL_international_peace_city: "Международный город мира и правосудия"
 HOL_international_peace_city_desc: "Пользуясь положением Гааги как международного города мира и правосудия, мы укрепим дипломатические связи и усилим своё влияние в мире, принимая у себя международные организации и мероприятия."
 HOL_randpowerhouse: "Рандпауэрхаус"
 HOL_randpowerhouse_desc: "Годы продуманных вложений и дальновидного планирования превратили Рандстад в «Рандпауэрхаус» — живой хозяйственный двигатель Нидерландов. Развив инфраструктуру, поддержав новшества и улучшив связи между Амстердамом, Роттердамом, Гаагой и Утрехтом, край стал мировым лидером в торговле, культуре и технологиях. Это преображение не только подняло выпуск Рандстада, но и закрепило за Нидерландами место ключевого участника европейских дел, питая рост страны и задавая новые мерки городского развития."
 HOL_dutch_industry: "Нидерландская промышленность"
 HOL_dutch_industry_desc: "Нидерландская промышленность воплощает давнюю традицию новшеств и мастерства в самых разных отраслях. Делая ставку на бережное отношение к природе, технику и мировую конкурентоспособность, она остаётся в первых рядах тех, кто питает рост экономики и благосостояние."
 HOL_postbank_fusion: "Слияние Postbank и ING"
 HOL_postbank_fusion_desc: "Слияние Postbank и ING — веха в истории нидерландского банковского дела: два крупных финансовых учреждения становятся единым целым. Это укрепляет положение ING как ведущего мирового банка и расширяет услуги и финансовые решения для клиентов по всему свету."
 HOL_randstad_takeovers: "Поглощения Randstad"
 HOL_randstad_takeovers_desc: "Поглощения Randstad показывают продуманное расширение нидерландских компаний и их мировые устремления в кадровой отрасли. Покупая ключевых игроков рынка, Randstad укрепляет своё положение мирового лидера в решениях для работы с персоналом."
 HOL_ing_group_strategy: "Стратегии расширения группы ING"
 HOL_ing_group_strategy_desc: "Стратегия группы ING излагает видение банком устойчивого роста и цифрового преобразования финансового сектора. Делая ставку на новшества и решения, обращённые к клиенту, ING подтверждает готовность нести перемены к лучшему и приносить пользу всем заинтересованным сторонам."
 HOL_adyen_fintech_hub: "Adyen и финтех-центр"
 HOL_adyen_fintech_hub_desc: "Adyen, амстердамский платёжный оператор, основанный в 2006 году, вырос в одну из крупнейших финтех-компаний Европы, обрабатывая платежи глобальных торговых площадок — от Netflix до Spotify. Его успех делает Нидерланды столицей цифровых платежей и финансовых технологий континента, привлекая в Рандстад инвестиции и высокооплачиваемые рабочие места в сфере услуг."
 HOL_pension_fund_reform: "Пенсионная реформа"
 HOL_pension_fund_reform_desc: "ABP и PFZW входят в число крупнейших пенсионных фондов мира, что даёт нидерландскому капиталу огромный охват через доли в акциях, инфраструктуре и недвижимости по всему свету. Закон о будущем пенсий 2023 года (Wet toekomst pensioenen) переводит систему с установленных выплат на установленные взносы, меняя на десятилетия вперёд то, как распределяются и вкладываются эти колоссальные средства."
 HOL_booking_digital_services: "Экономика цифровых услуг"
 HOL_booking_digital_services_desc: "Booking.com, крупнейшее в мире онлайн-турагентство, размещает штаб-квартиру в Амстердаме рядом с такими компаниями, как Just Eat Takeaway и TomTom, и закрепляет за страной необычайно глубокий для её размеров сектор платформ и цифровых услуг. Этот кластер притягивает в Рандстад международные кадры и переезжающие корпорации, утверждая Нидерланды как пристанище европейских технологических штаб-квартир."
 HOL_spring_global_mail: "Расширение Spring Global Mail"
 HOL_spring_global_mail_desc: "Spring Global Mail воплощает нидерландский опыт в международной почте и логистике. Предоставляя быстрые и надёжные почтовые услуги по всему миру, Spring Global Mail помогает мировой торговле и связи, соединяя предприятия и покупателей через границы."
 HOL_tata_steel_development: "Развитие Tata Steel"
 HOL_tata_steel_development_desc: "Развитие Tata Steel — крупное вложение в нидерландскую промышленность, обеспечивающее дальнейший рост и конкурентоспособность сталелитейной отрасли. Это начинание подчёркивает приверженность Tata Steel новшествам и бережности к природе и укрепляет её положение на нидерландском рынке."
 HOL_project_beethoven: "Проект «Бетховен»"
 HOL_project_beethoven_desc: "Нацеленный на рост технологического сектора в Нидерландах, «Проект Бетховен» стал продуманным ответом на тревоги отраслевых лидеров, включая ASML, по поводу инвестиционного климата в стране. Это смелое начинание, подкреплённое государственными вложениями свыше 2,5 миллиарда евро, призвано создать условия для расширения внутри страны таких технологических гигантов, как ASML, и закрепить за Нидерландами место мирового средоточия новшеств."
 HOL_phillips_healthcare_expansion: "Расширение Philips Healthcare"
 HOL_phillips_healthcare_expansion_desc: "Расширение медицинского направления Philips отражает ведущее место Нидерландов в медицинской технике и новшествах. Расширяя линейку, Philips вновь подтверждает готовность улучшать исход лечения и продвигать медицинские решения по всему миру."
 HOL_south_dakota: "Заводы DSM в Южной Дакоте"
 HOL_south_dakota_desc: "Биоэтанольные заводы DSM в Южной Дакоте говорят о нидерландском первенстве в устойчивой энергетике. Вкладываясь в производство биоэтанола, DSM помогает сокращать выбросы углерода и развивать возобновляемые источники по всему миру."
 HOL_dutch_legends: "Нидерландские легенды"
 HOL_dutch_legends_desc: "На протяжении истории Нидерланды взрастили легендарное наследие, где предания о власти над водой сплелись с рассказами о морской торговле. От прославленных подвигов нидерландских инженеров, отвоёвывавших землю у моря, до дерзких походов нидерландских купцов в дальние воды — в этих легендах переплелись стойкость, изобретательность и достаток."
 HOL_trade_infrastructure: "Обновить торговую инфраструктуру"
 HOL_trade_infrastructure_desc: "Нидерланды располагают отлаженной торговой инфраструктурой, где порты, каналы и дороги сплетены в единую сеть торговли. Однако мировая торговля меняется, запросы растут, и этой инфраструктуре нужно обновление, чтобы сохранить преимущество. Вложения в передовые технологии и обновление транспортных путей обеспечат Нидерландам место ключевого участника международной торговли на десятилетия вперёд."
 HOL_maasvlakte2: "Построить Maasvlakte 2"
 HOL_maasvlakte2_desc: "Нидерланды берутся за смелый проект Maasvlakte 2, отвоёвывая землю у моря ради расширения портовых мощностей и роста хозяйства, — отголосок давнего мастерства страны в управлении водой и строительстве."
 HOL_european_railway_development: "Развитие европейских железных дорог"
 HOL_european_railway_development_desc: "Опираясь на своё наследие передовой транспортной инфраструктуры, Нидерланды возглавляют развитие европейских железных дорог, связывая континент и способствуя торговле и подвижности через свою современную сеть."
 HOL_green_harbor_amsterdam: "Зелёная гавань Амстердама"
 HOL_green_harbor_amsterdam_desc: "Амстердам превращает свою гавань в устойчивый узел, переходя на бережные к природе методы и возобновляемую энергию, — свидетельство нидерландской приверженности заботе о природе и морским новшествам."
 HOL_nederland_maritiem_land: "Stichting Nederland Maritiem Land"
 HOL_nederland_maritiem_land_desc: "Учреждение Stichting Nederland Maritiem Land подчёркивает морское наследие Нидерландов и их ведущее место в отрасли, развивая сотрудничество и прогресс в морском деле ради его дальнейшего процветания и конкурентоспособности в мире."
 HOL_schiphol_expansion: "Расширение Схипхола"
 HOL_schiphol_expansion_desc: "Расширение Схипхола — поворотная веха нидерландской авиации, выводящая амстердамский аэропорт в первые ряды мировых воздушных гаваней. Увеличивая пропускную способность и улучшая обслуживание пассажиров, это расширение подчёркивает приверженность Нидерландов удобству и связности воздушных перевозок."
 HOL_digital_customs: "Цифровая таможня"
 HOL_digital_customs_desc: "Цифровая таможня переворачивает работу нидерландской торговли, упрощая процедуры и повышая их отдачу за счёт новых цифровых решений. Это начинание воплощает готовность Нидерландов опираться на технический прогресс, чтобы укрепить положение мирового торгового узла."
 HOL_daf_investments: "Вложиться в DAF"
 HOL_daf_investments_desc: "Вложения в DAF воплощают стремление нидерландского автопрома к новшествам и росту. Благодаря продуманным вложениям и техническим достижениям DAF укрепляет своё положение ведущего производителя коммерческого транспорта и двигает вперёд промышленную мощь Нидерландов."
 HOL_rijkswaterstaat: "Rijkswaterstaat"
 HOL_rijkswaterstaat_desc: "Rijkswaterstaat, нидерландское государственное ведомство по водному хозяйству и инфраструктуре, играет важнейшую роль в устройстве водного облика страны: оно следит за содержанием водных путей, дамб и противопаводковых сооружений, оберегая Нидерланды от наводнений и обеспечивая разумное и бережное использование воды."
 HOL_deltawerken_modernization: "Модернизация Deltawerken"
 HOL_deltawerken_modernization_desc: "Нидерланды обновляют свои прославленные Deltawerken, укрепляя береговые сооружения и приспосабливая их к подъёму уровня моря и переменам климата, чтобы и впредь защищать страну от наводнений и сберечь нидерландское побережье для будущих поколений."
 HOL_ruimte_voor_de_rivier: "Ruimte voor de Rivier"
 HOL_ruimte_voor_de_rivier_desc: "Действуя на опережение в управлении паводковыми рисками, Нидерланды осуществляют проект «Пространство для реки»: вдоль берегов освобождается место, куда уходит большая вода, а города оказываются защищены, — образец нидерландской изобретательности в градостроительстве вокруг воды."
 HOL_green_water_city_building: "Зелёное водное градостроительство"
 HOL_green_water_city_building_desc: "Опираясь на видение устойчивого городского развития, Нидерланды прокладывают путь зелёному водному градостроительству, вплетая принципы бережного обращения с водой и природные решения в планировку городов и инфраструктурные проекты, чтобы создавать стойкие, удобные для жизни города в согласии с природой, — воплощение нидерландской приверженности зелёному росту и заботе о природе."
 HOL_dutch_water_sector: "Нидерландский водный сектор"
 HOL_dutch_water_sector_desc: "Нидерландский водный сектор процветает как мировой лидер в управлении водными ресурсами и новшествах, опираясь на многовековой опыт борьбы с наводнениями, защиты побережья и распоряжения водой, чтобы решать острые водные задачи по всему миру, — воплощение нидерландской изобретательности и приверженности устойчивому развитию."
 HOL_hollandse_kust_windfarm: "Построить Hollandse Kust"
 HOL_hollandse_kust_windfarm_desc: "Нидерланды двигают вперёд свою программу возобновляемой энергетики, осваивая ветровую зону Hollandse Kust: энергия ветра питает устойчивый рост хозяйства и снижает выбросы углерода, отвечая нидерландским усилиям в борьбе с изменением климата и развитии зелёной энергетики."
 HOL_aquatech_amsterdam: "Провести Aquatech Amsterdam"
 HOL_aquatech_amsterdam_desc: "Aquatech Amsterdam — ведущее событие в области водных технологий, собирающее первопроходцев отрасли и специалистов, чтобы обсудить новшества в водопользовании и устойчивом развитии. Через выставки и живое общение оно налаживает сотрудничество и продвигает мир к более надёжной водной безопасности."
 HOL_dredging_industry: "Нидерландское дноуглубление"
 HOL_dredging_industry_desc: "Boskalis, Van Oord и Royal IHC вместе делают Нидерланды бесспорным мировым лидером в дноуглублении и морском строительстве. Их зарубежные контракты на углубление портов, прокладку судоходных каналов и намыв земель продают нидерландский опыт и приносят стране немалую валютную выручку, поддерживая тысячи квалифицированных рабочих мест дома."
 HOL_van_oord_offshore: "Монтаж морских ветропарков"
 HOL_van_oord_offshore_desc: "Особые нидерландские монтажные суда ставят ветряки морских ветропарков у побережья Hollandse Kust и Борселе, соединяя отечественное судостроение с опытом морского строительства. Тот же флот, что наращивает мощности для нидерландского энергетического перехода, обслуживает и быстрорастущий европейский рынок морской ветроэнергетики, обеспечивая долгосрочные контрактные доходы."
 HOL_global_land_reclamation: "Намыв земель по всему миру"
 HOL_global_land_reclamation_desc: "Нидерландские подрядчики продают своё мастерство намыва земель и защиты побережья по всему миру, создавая искусственные острова, расширяя порты и возводя противопаводковые сооружения от Ближнего Востока до Юго-Восточной Азии. Века борьбы с морем превратились в первоклассную инженерную услугу, а фирмы, которые везут её за рубеж, дают один из самых самобытных промышленных экспортов Нидерландов."
 HOL_form_nso: "Нидерландская космическая организация"
 HOL_form_nso_desc: "Национальное космическое агентство позволит Нидерландам свести исследования, разработки и освоение космоса в единую структуру. Создание NSO обеспечит долгосрочные вложения в космические полёты, спутниковую технику и будущие межпланетные миссии."
 HOL_ijstad_mission: "Построить IJStad"
 HOL_ijstad_mission_desc: "IJStad — задуманный город на искусственном острове в озере Эймер, к востоку от Амстердама, продолжение нидерландской традиции отвоёвывать землю у воды. Новый остров вместил бы около 45 000 жилищ, ослабив нехватку жилья в Рандстаде и доказав, что Нидерланды по-прежнему способны создавать сушу из открытой воды. Строительство займёт около трёх лет и преобразит область Западных Нидерландов вокруг Амстердама, прибавив к новым жилым кварталам промышленные мощности и офисы."
 HOL_mars_colony_mission: "Основать колонию на Марсе"
 HOL_mars_colony_mission_desc: "Средства выведения обеспечены, поток добровольцев и оборудования уходит из Нидерландов — и долгая работа по высадке и обустройству нидерландских поселенцев на Марсе вступает в завершающую пору. Жилые модули, системы жизнеобеспечения и первые постоянные сооружения предстоит собрать за миллионы километров пустоты. Когда колония будет готова, её основатели дадут ей имя из легенд покинутой родины."
 HOL_mars_colony1: "Холландерхавен"
 HOL_mars_colony1_desc: "Колония получила имя от De Vliegende Hollander, «Летучего голландца», — проклятого капитана-купца, обречённого вечно скитаться по морям, не заходя в порт. И неспроста: Холландерхавен становится торговым сердцем колонии, факторией на новом мире, построенной потомками мореходов. Её управители обращают старую купеческую хватку VOC на марсианское пограничье."
 HOL_mars_colony2: "Бринкердам"
 HOL_mars_colony2_desc: "Бринкердам назван в честь Ханса Бринкера — легендарного мальчика, который всю ночь держал море, заткнув пальцем течь в дамбе. Поселение специализируется на прочных стенах, герметичных куполах и гидротехнике, благодаря которым колония остаётся пригодной для жизни вопреки враждебному Марсу. Та же выучка, что возвела «Дельтаверкен», теперь удерживает пустоту за порогом."
 HOL_mars_colony3: "Брандаанстад"
 HOL_mars_colony3_desc: "Названный в честь святого Брендана, средневекового путешественника, чьё легендарное плавание увело его за край известного мира, Брандаанстад — средоточие науки и обучения в колонии. Его лаборатории опираются на наследие Делфтского технического университета и ESTEC и раздвигают границы планетологии. Город воплощает то самое любопытство, что впервые увело нидерландцев за горизонт."
 HOL_mars_colony4: "Браммертделф"
 HOL_mars_colony4_desc: "Браммертделф напоминает об Эллерте и Браммерте — двух великанах и разбойниках, что некогда наводили страх на вересковые пустоши Дренте. Поселение держит на себе добывающую промышленность колонии, вырывая руду и летучие вещества из марсианской коры. Подобно великанам, чьё имя носит, оно живёт с той земли, которую заняло, и снабжает сырьём всю колонию."
 HOL_commissariaat_militaire_productie: "Commissariaat Militaire Productie"
 HOL_commissariaat_militaire_productie_desc: "Commissariaat Militaire Productie занимается согласованием и наращиванием военно-производственных возможностей по всем Нидерландам. Это начинание призвано упростить закупки, поддержать отечественную оборонную промышленность и обеспечить бесперебойные поставки современной военной техники."
 HOL_dutch_defense_doctrine: "Nederlandse Defensie Doctrine"
 HOL_dutch_defense_doctrine_desc: "Нидерландская оборонная доктрина закладывает основу стратегического курса и принципов действий вооружённых сил страны. Она делает упор на подвижность, огневую мощь и взаимодействие, обеспечивая готовность армии защищать национальные интересы, поддерживать союзников и отвечать на мировые кризисы."
 HOL_authority_in_information: "Господство в информации"
 HOL_authority_in_information_desc: "Утверждение господства в информации — залог стратегического превосходства. Для этого нужно развивать разведку, наблюдение и рекогносцировку, чтобы быстро собирать и обрабатывать важнейшие сведения."
 HOL_integrated_actions: "Согласованные действия"
 HOL_integrated_actions_desc: "Согласованные действия на суше, на море, в воздухе, в киберпространстве и космосе обеспечивают всестороннюю обороноспособность. Эта цель налаживает бесшовное взаимодействие и совместные операции, повышая общую боевую эффективность."
 HOL_information_based: "Опора на информацию"
 HOL_information_based_desc: "Опора на информацию улучшает и принимаемые решения, и результативность действий. Вкладываясь в разведку, наблюдение и рекогносцировку, Нидерланды обеспечивают себе быстрый и точный ответ на возникающие угрозы."
 HOL_increase_strategic_capacity: "Нарастить стратегические возможности"
 HOL_increase_strategic_capacity_desc: "Наращивание стратегических возможностей необходимо, чтобы отвечать на будущие вызовы. Речь о средствах стратегических перевозок, киберобороны и действий в космосе, которые позволят Нидерландам проецировать силу и влияние по всему миру."
 HOL_dutch_specialism: "Нидерландская специализация"
 HOL_dutch_specialism_desc: "Чтобы усилить свою роль в НАТО, Нидерланды разовьют узкие направления, дополняющие нужды альянса. Сюда входят десантные операции, противовоздушная оборона и силы быстрого развёртывания."
 HOL_invest_in_europe: "Вложиться в оборону Европы"
 HOL_invest_in_europe_desc: "Вложения в оборонные возможности Европы делают континент сильнее и устойчивее. Нидерланды увеличат взносы в европейские оборонные начинания, углубляя сотрудничество и совместимость с государствами ЕС."
 HOL_military_society: "Кампания «Армия и общество»"
 HOL_military_society_desc: "Прочная связь армии и общества крайне важна. Эта цель включает меры по вовлечению граждан, поддержке ветеранов и воспитанию понимания задач обороны."
 HOL_reliable_partner: "Надёжный нидерландский партнёр"
 HOL_reliable_partner_desc: "Как надёжный партнёр и защитник, Нидерланды обеспечат безопасность своих союзников и будут способствовать устойчивости в мире. Это значит деятельно участвовать в миссиях НАТО и ЕС и быть готовыми защищать свои и союзные интересы."
 HOL_unique_people: "Особые кадры Нидерландов"
 HOL_unique_people_desc: "Важно видеть и развивать особые способности наших людей. Эта цель делает упор на углублённую подготовку, образование и карьерный рост, чтобы в вооружённых силах служили умелые и увлечённые своим делом люди."
 HOL_flexible_operations: "Гибкие действия"
 HOL_flexible_operations_desc: "Чтобы оставаться подвижными и гибкими по составу, вооружённые силы должны быстро отвечать на перемены обстановки. Это значит создавать силы быстрого реагирования и повышать подвижность войск, чтобы они успевали приспосабливаться к разным угрозам."
 HOL_innovative_capacity: "Новаторский потенциал"
 HOL_innovative_capacity_desc: "Вложения в исследования и разработки, поддерживающие высокий новаторский потенциал, необходимы. Речь о внедрении передовой техники и воспитании культуры новшеств, чтобы опережать возможных противников."
 HOL_escalation_dominance: "Превосходство в эскалации"
 HOL_escalation_dominance_desc: "Превосходство в эскалации требует лучших военных возможностей и надёжных стратегических партнёрств. Оно позволяет вооружённым силам сдерживать противника и отвечать на конфликты любого уровня."
 HOL_defensievisie_completed: "Defensievisie выполнена"
 HOL_defensievisie_completed_desc: "С успешным завершением нидерландской оборонной доктрины вооружённые силы страны заметно преобразились. Обновлённая, стойкая и оснащённая новейшей техникой армия готова встретить вызовы будущего. Этот рубеж — плод самоотдачи и труда наших людей, которые приняли новшества, укрепили международные партнёрства и повысили боевую готовность"
 HOL_koninklijke_luchtmacht: "Parvus Numero, Magnus Merito"
 HOL_koninklijke_luchtmacht_desc: "Принять девиз Parvus numero, magnus merito («Малые числом, великие заслугами») и сосредоточиться на том, чтобы выжать из нидерландских ВВС всё возможное. Это значит отладить программы подготовки, улучшить обслуживание техники и опереться на передовые технологии, чтобы каждый самолёт и каждый лётчик вносили весомый вклад в общее дело."
 HOL_join_jsf: "Вступить в программу JSF"
 HOL_join_jsf_desc: "Участие Нидерландов в программе Joint Strike Fighter (JSF) предполагает закупку самолётов F-35 Lightning II. Эта цель обеспечивает нидерландские ВВС новейшими малозаметными истребителями и усиливает господство в воздухе и ударные возможности."
 HOL_join_eurofighter_project: "Вступить в проект Eurofighter"
 HOL_join_eurofighter_project_desc: "Вступив в проект Eurofighter Typhoon, Нидерланды вкладываются в передовой многоцелевой истребитель. Эта цель расширяет возможности нидерландских ВВС в воздушном бою, ударах по наземным целям и разведке."
 HOL_buy_saab_jas39: "Закупить Saab JAS 39"
 HOL_buy_saab_jas39_desc: "Закупка истребителей Saab JAS 39 Gripen даёт нидерландским ВВС универсальную и недорогую многоцелевую машину. Эта цель усиливает противовоздушную оборону, поддержку наземных войск и разведку, обеспечивая свободу действий."
 HOL_buy_mq9_reaper: "Закупить MQ-9 Reaper"
 HOL_buy_mq9_reaper_desc: "Вложения в беспилотники MQ-9 Reaper расширяют разведывательные и ударные возможности нидерландских ВВС. Эти БПЛА дают сведения в реальном времени, ведут наблюдение и наносят точные удары, заметно повышая боевую эффективность."
 HOL_defensie_helikopter_commando: "Создание Defensie Helikopter Commando"
 HOL_defensie_helikopter_commando_desc: "Defensie Helikopter Commando (DHC) руководит действиями всех военных вертолётов нидерландских вооружённых сил. Эта цель призвана расширить возможности вертолётного парка, улучшить подготовку и согласованность действий и поддержать как национальные, так и международные миссии."
 HOL_ch47d_modernization: "Модернизация CH-47D"
 HOL_ch47d_modernization_desc: "Модернизация вертолётов CH-47D Chinook включает обновление авионики, двигателей и грузового оборудования. Эта цель позволяет тяжёлым транспортным вертолётам оставаться действенными и надёжными в перевозках, медицинской эвакуации и задачах обеспечения"
 HOL_ah46d_upgrade: "Модернизация AH-64D"
 HOL_ah46d_upgrade_desc: "Модернизация ударных вертолётов AH-64D Apache включает обновление авионики, систем вооружения и средств защиты. Эта цель повышает боевые возможности нидерландских ВВС, позволяя вертолётам эффективно выполнять непосредственную авиационную поддержку и противотанковые задачи."
 HOL_air_mobility_command: "Командование воздушных перевозок и тылового обеспечения"
 HOL_air_mobility_command_desc: "Создать национальное командование, которое будет распоряжаться воздушными перевозками, тыловым обеспечением и боевой готовностью независимо от союзных договорённостей. Сосредоточив снабжение под нидерландским началом, ВВС смогут выполнять вылеты и поддерживать парк в строю без опоры на помощь партнёров."
 HOL_woensdrecht_mro: "Вунсдрехт: логистика и центр двигателей F135"
 HOL_woensdrecht_mro_desc: "В логистическом центре Вунсдрехт размещён региональный центр технического обслуживания, ремонта и капитального ремонта двигателей F135, которыми оснащаются F-35. Вложения в это депо превращают Нидерланды в базу обслуживания союзных парков машин, одновременно поддерживая боеготовность собственной авиации и снижая зависимость от иностранного обслуживания."
 HOL_expand_fighter_fleet: "Расширить парк истребителей"
 HOL_expand_fighter_fleet_desc: "Заказать дополнительную партию многоцелевых истребителей, чтобы довести эскадрильи до полного состава. Расширенный парк возвращает возможность развёртывания и даёт ВВС достаточную массу и для охраны собственного неба, и для заморских обязательств."
 HOL_expand_fighter_fleet_idea: "Расширенный парк истребителей"
 HOL_expand_fighter_fleet_idea_desc: "Ускоренная закупка не даёт остыть сборочным линиям истребителей, снижая стоимость каждой новой машины, пока партия поступает в войска."
 HOL_frisian_flag_training: "Учебная программа Frisian Flag"
 HOL_frisian_flag_training_desc: "Ежегодные учения Frisian Flag на авиабазе Леуварден собирают союзные ВВС для масштабной боевой подготовки над Северным морем. Постоянная учебная программа оттачивает мастерство лётчиков и ускоряет набор опыта новыми экипажами."
 HOL_precision_munitions: "Внедрение высокоточного оружия"
 HOL_precision_munitions_desc: "Ввести в состав вооружения истребителей управляемое оружие: авиабомбы малого калибра GBU-39, ракеты AIM-120 AMRAAM и Meteor. Современный набор вооружения увеличивает дальность и поражающую силу и позволяет нидерландским самолётам бить точно даже в оспариваемом небе."
 HOL_sovereign_air_operations: "Самостоятельные действия авиации"
 HOL_sovereign_air_operations_desc: "Свести парк, вооружение и подготовленные экипажи в самостоятельную авиацию, способную вести длительные операции на своих условиях. Теперь Нидерланды могут удерживать своё небо и применять авиацию, не завися ни от одного отдельного партнёра."
 HOL_commando_landstrijdkrachten: "Учредить Commando Landstrijdkrachten"
 HOL_commando_landstrijdkrachten_desc: "Создание Commando Landstrijdkrachten (CLAS) в 2005 году стало заметной перестройкой нидерландской армии. Эта центральная командная структура была призвана повысить слаженность действий и упростить принятие решений. Сведя разные части армии под единое начало, Нидерланды добились лучшей согласованности и готовности своих сухопутных войск."
 HOL_jistarc: "Создание JISTARC"
 HOL_jistarc_desc: "Объединённое командование разведки, наблюдения, целеуказания и рекогносцировки (JISTARC) было создано, чтобы свести воедино и усилить разведывательные возможности нидерландской армии. Это соединение объединяет разные разведывательные функции, давая полную картину обстановки и поддержку операциям. JISTARC повышает отдачу разведывательных задач, обеспечивая точные и своевременные сведения для тактических решений."
 HOL_dglc: "Перестройка DGLC"
 HOL_dglc_desc: "Defensie Grondgebonden Luchtverdedigingscommando (DGLC) отвечает за наземную противовоздушную оборону. Расширение его возможностей предполагает обновление ракетных комплексов и радиолокационной техники для защиты от воздушных угроз. Эта цель позволяет нидерландской армии надёжно прикрывать свои объекты и территорию от ударов с воздуха."
 HOL_vuursteun_commando: "Развёртывание VuursteunCommando"
 HOL_vuursteun_commando_desc: "VuursteunCommando (командование огневой поддержки) объединяет артиллерию и средства огневой поддержки, обеспечивая голландской армии согласованный огонь. Программа предусматривает модернизацию артиллерийских систем и повышение точности наведения. Улучшенная огневая поддержка повышает эффективность наземных операций и гарантирует точный и своевременный огонь."
 HOL_supply_command: "Bevoorradings- en Transportcommando"
 HOL_supply_command_desc: "Bevoorradings- en Transportcommando (Командование снабжения и перевозок) незаменимо для тылового обеспечения и подвижности нидерландской армии. Эта цель призвана улучшить цепочки снабжения, транспортные средства и инфраструктуру, повысив готовность и отдачу армии."
 HOL_military_production_investments: "Вложиться в нидерландскую оборонную промышленность"
 HOL_military_production_investments_desc: "В последние годы нидерландский оборонный сектор получил заметные вложения — от участия в разработке F-35 до обновления кораблей вроде фрегатов типа Zeven Provinciën. Вложившись в отечественную оборонную промышленность и дальше, мы подстегнём технические новшества, укрепим самостоятельность и обеспечим вооружённым силам новейшую технику. Это решение усилит безопасность страны и поможет вырасти крепкой оборонной экономике."
 HOL_defense_industrial_base: "Укрепить оборонно-промышленную базу"
 HOL_defense_industrial_base_desc: "Нидерландские фирмы поставляют важнейшие узлы для союзных оружейных программ, однако отечественные сборочные мощности отстают. Расширяя строительство военных заводов и закрепляя окончательную сборку у себя, мы превращаем сеть субподрядчиков в настоящую национальную промышленную базу."
 HOL_modernize_arms_production: "Обновить линии производства вооружений"
 HOL_modernize_arms_production_desc: "Устаревшая оснастка замедляет выход на полную мощность по новым заказам. Вложения в автоматизацию под началом Thales и современные сборочные линии позволяют нашим военным заводам быстрее набирать полный выпуск, сокращая сроки поставок в войска."
 HOL_lean_defense_manufacturing: "Бережливое оборонное производство"
 HOL_lean_defense_manufacturing_desc: "На перегретом рынке труда именно квалифицированные работники ограничивают выпуск вооружений. Внедрение бережливого производства на DAF и у его поставщиков сокращает потребность каждого военного завода в людях и высвобождает их для остальной экономики."
 HOL_defense_supply_chain_integration: "Свести воедино оборонные цепочки поставок"
 HOL_defense_supply_chain_integration_desc: "Разрозненные связи с поставщиками ограничивают возможную эффективность наших заводов. Сведение оборонных цепочек поставок вокруг таких фирм, как Fokker, стабилизирует поставки сырья и узлов и поднимает предельную эффективность, на которую способна военная промышленность."
 HOL_defense_export_promotion: "Продвигать оборонный экспорт"
 HOL_defense_export_promotion_desc: "Нидерландская оборонная продукция конкурентоспособна за рубежом, но экспортные доходы используются не в полной мере. Согласованная экспортная стратегия при поддержке Werkspoor и партнёров расширяет налоговую базу военной промышленности и даёт средства на новые вложения."
 HOL_national_defense_industrial_strategy: "Национальная оборонно-промышленная стратегия"
 HOL_national_defense_industrial_strategy_desc: "Имея современную базу, бережливые заводы, связанные цепочки поставок и растущий экспорт, правительство может свести эти достижения в единую промышленную стратегию. Согласованная работа крупнейших производителей повышает общий выпуск военных заводов и закрепляет за оборонным сектором роль одной из опор хозяйства."
 HOL_netherlands_fractal_pattern: "Netherlands Fractal Pattern"
 HOL_netherlands_fractal_pattern_desc: "Netherlands Fractal Pattern (NFP) — камуфляжный рисунок, разработанный для нидерландской военной формы. Эта продуманная схема лучше скрывает бойца в самых разных условиях, повышая его живучесть и результативность в поле."
 HOL_daf_trucks: "Военные грузовики DAF CF"
 HOL_daf_trucks_desc: "Вложения в грузовики DAF повышают подвижность и тыловые возможности нидерландской армии. Эти надёжные и универсальные машины незаменимы для переброски войск, техники и припасов и обеспечивают свободу действий и снабжение."
 HOL_scania_trucks: "Новые Scania Gryphus"
 HOL_scania_trucks_desc: "Пополнение автопарка нидерландской армии грузовиками Scania улучшает снабжение и перевозки. Эти машины известны своей выносливостью и отдачей, что делает их отличным выбором для военных задач."
 HOL_mrad_replacement: "Обновить MRAD"
 HOL_mrad_replacement_desc: "В 2020 году министерство обороны Нидерландов начало важный проект обновления комплексов противовоздушной обороны средней дальности (MRAD). Нынешние системы, включая NASAMS, будут заменены более современными и совершенными, чтобы лучше прикрывать нидерландское небо и поддерживать операции НАТО. Вкладываясь в новые средства ПВО, мы обеспечиваем нашим силам способность отражать современные воздушные угрозы и беречь небо страны в будущем."
 HOL_colt_upgrade: "Модернизация винтовки Colt C7"
 HOL_colt_upgrade_desc: "В 2009 году нидерландские вооружённые силы провели серьёзную модернизацию винтовки Colt C7, повысив её точность, надёжность и приспособленность к современному бою. Обновление включало улучшенную оптику, эргономику и модульность, отвечающие меняющимся нуждам пехоты. Вкладываясь в эти доработки, нидерландская армия обеспечивает солдат передовым оружием и поддерживает высокую боеготовность."
 HOL_pantserhouwitser_mlu: "Pantserhouwitser 2000 MLU"
 HOL_pantserhouwitser_mlu_desc: "Программа Pantserhouwitser 2000 MLU нацелена на обновление этих самоходных гаубиц: улучшенные системы управления огнём, увеличенная дальность и более высокая точность. Это позволяет нидерландской артиллерии оставаться действенной и точно поддерживать войска огнём."
 HOL_puls: "Израильский заказ PULS"
 HOL_puls_desc: "Система PULS (Precise and Universal Launching System) призвана усилить артиллерию нидерландской армии за счёт современных реактивных и ракетных комплексов. Она позволяет гибко и точно поддерживать войска огнём и повышает общую огневую мощь армии."
 HOL_bushmaster_mlu: "Bushmaster MLU"
 HOL_bushmaster_mlu_desc: "Программа Bushmaster MLU предусматривает улучшение брони, средств связи и подвижности этих бронетранспортёров. Она повышает защищённость и результативность нидерландских войск в самых разных условиях."
 HOL_munition_investments: "Вложения в боеприпасы"
 HOL_munition_investments_desc: "Вложения в современные боеприпасы и рост запасов обеспечивают нидерландской армии хорошее снабжение и способность вести долгие операции. Эта цель включает разработку высокоточных боеприпасов и улучшение снабжения ими войск."
 HOL_defensienota_2022: "Defensienota 2022"
 HOL_defensienota_2022_desc: "Defensienota 2022 описывает стратегические вложения и преобразования, призванные усилить нидерландскую армию. Этот всеобъемлющий план сосредоточен на модернизации, увеличении оборонного бюджета и повышении боевой готовности во всех видах вооружённых сил."
 HOL_procure_stinger_missiles: "Закупить ракеты Stinger"
 HOL_procure_stinger_missiles_desc: "Закупка ракет Stinger расширяет возможности нидерландской армии по борьбе с низколетящими самолётами и вертолётами. Эти переносные зенитные комплексы дают гибкую и подвижную противовоздушную оборону."
 HOL_procure_advanced_mortars: "Закупить современные миномёты"
 HOL_procure_advanced_mortars_desc: "Вложения в современные миномёты улучшают возможности нидерландской армии по поддержке войск навесным огнём. Эти системы дают большую дальность, точность и подвижность и обеспечивают пехоте необходимую огневую мощь."
 HOL_develop_guide_munitions: "Разработать высокоточные боеприпасы"
 HOL_develop_guide_munitions_desc: "Разработка высокоточных 155-мм боеприпасов повышает точность и действенность нидерландской артиллерии. Эти современные снаряды позволяют бить по цели точно, снижая сопутствующий ущерб и повышая результативность боевой работы."
 HOL_expand_patriot_systems: "Расширить парк комплексов Patriot"
 HOL_expand_patriot_systems_desc: "Расширение развёртывания зенитных комплексов Patriot улучшает способность нидерландской армии отражать баллистические ракеты и современные воздушные угрозы. Эта цель укрепляет национальную и региональную безопасность, создавая надёжную сеть противовоздушной и противоракетной обороны."
 HOL_expand_command_control_centers: "Расширить центры управления войсками"
 HOL_expand_command_control_centers_desc: "Расширение и обновление центров управления повышает слаженность действий нидерландской армии и качество принимаемых решений. Эта цель включает обновление средств связи и внедрение передовой техники ради действенного руководства войсками."
 HOL_establish_marechaussee_squad: "Создать подразделение Marechaussee"
 HOL_establish_marechaussee_squad_desc: "Marechaussee — особая военная полиция, отвечающая за поддержание правопорядка и тыловое обеспечение. Создание этой части заметно улучшит и снабжение, и наведение порядка в ходе наших военных операций."
 HOL_modernize_foxtrot: "Обновить системы связи Foxtrot"
 HOL_modernize_foxtrot_desc: "Модернизация систем связи Foxtrot нацелена на обновление тактической связи нидерландской армии. Она включает защищённые высокоскоростные каналы передачи данных, современное шифрование и лучшую совместимость с союзниками по НАТО. Обновив эти системы, нидерландская армия обеспечит надёжную и защищённую связь в самых разных условиях."
 HOL_special_forces_helicopter: "Вертолёт для сил специальных операций"
 HOL_special_forces_helicopter_desc: "Закупка особых вертолётов для нидерландских сил специальных операций повышает их подвижность и результативность. Эти машины приспособлены для быстрой высадки и эвакуации, непосредственной авиационной поддержки и снабжения в самых разных условиях."
 HOL_defense_healthsector: "Учредить Институт обороны и здравоохранения"
 HOL_defense_healthsector_desc: "Instituut Samenwerking Defensie en Relatieziekenhuizen (Институт сотрудничества обороны и гражданских больниц) занимается созданием надёжной сети медицинской поддержки и реагирования на кризисы. Это сотрудничество призвано улучшить медицинскую помощь военнослужащим и расширить возможности армии поддерживать гражданскую медицину в чрезвычайных обстоятельствах."
 HOL_develop_defensity_college: "Развить Defensity College"
 HOL_develop_defensity_college_desc: "Defensity College — образовательное начинание, дающее военнослужащим возможность получить высшее образование и специальную подготовку. Эта цель предполагает сотрудничество с университетами и техническими институтами, которые откроют курсы по разным направлениям и повысят умения и знания нидерландских солдат и офицеров."
 HOL_hr_ecosystem: "HR-ecosysteem"
 HOL_hr_ecosystem_desc: "Начинание HR-Ecosysteem призвано соединить нидерландские вооружённые силы и общество, создав общую кадровую сеть. Программа налаживает партнёрства с гражданскими организациями, расширяет карьерные возможности военнослужащих и заботится об их благополучии. Связывая оборону с обществом, HR-Ecosysteem укрепляет поддержку военных и во время службы, и после неё."
 HOL_marinestudie: "Marinestudie"
 HOL_marinestudie_desc: "Marinestudie — всестороннее исследование военно-морской стратегии, призванное оценить и обновить Королевский флот Нидерландов. Работа включает разбор нынешних возможностей, будущих угроз и технических достижений ради выработки долгосрочной морской стратегии. Особое внимание уделено боевой готовности флота, обновлению корабельного состава и внедрению новой техники."
 HOL_annual_naval_deployment: "Ежегодный поход флота"
 HOL_annual_naval_deployment_desc: "Каждый год Королевский флот Нидерландов отправляет корабли в дальние походы доброй воли с заходом в порты по всему западному миру. Эти походы обозначают нидерландское присутствие, укрепляют партнёрства и оттачивают выучку экипажей в открытом океане."
 HOL_naval_diplomacy_voyage: "Визит доброй воли нидерландского флота"
 HOL_world_reaching_navy: "Флот мирового охвата"
 HOL_world_reaching_navy_desc: "Нидерланды стремятся нарастить возможности флота, чтобы действовать по всему миру. Программа предусматривает модернизацию кораблей, расширение тылового обеспечения и укрепление международного партнёрства. Так голландский флот рассчитывает обеспечивать безопасность важнейших морских путей, участвовать в миротворческих операциях и проецировать силу там, где это потребуется."
 HOL_european_navy: "Европейский флот"
 HOL_european_navy_desc: "Нидерланды возглавят создание европейского флота, развивая военно-морское сотрудничество и сращивание между государствами ЕС. Это начинание призвано укрепить общую морскую безопасность, собрать воедино оборонные средства и обозначить европейскую морскую мощь на мировой сцене."
 HOL_expanding_naval_infrastructure: "Расширение военно-морской инфраструктуры"
 HOL_expanding_naval_infrastructure_desc: "Нидерланды намерены усилить своё морское присутствие, расширив сеть военно-морских баз. Эта цель предполагает строительство новых баз и обновление существующих вдоль нидерландского побережья и на заморских территориях. Расширенная сеть баз даст опору операциям флота, улучшит снабжение и обеспечит быстрое реагирование."
 HOL_f35c_development: "Разработка F-35C"
 HOL_f35c_development_desc: "Закупка самолётов F-35C Lightning II даёт нидерландским ВВС палубный вариант передового малозаметного истребителя. Эта цель расширяет возможность Нидерландов применять авиацию и с береговых баз, и с авианосцев, обеспечивая непревзойдённую гибкость и боевую эффективность."
 HOL_future_air_defender: "Future Air Defender"
 HOL_future_air_defender_desc: "Программа Future Air Defender — совместное начинание Нидерландов и Германии по созданию передовых средств корабельной противовоздушной обороны. Она нацелена на оснащение нидерландских и немецких кораблей новейшими радиолокационными станциями, зенитными ракетами и объединённой системой управления."
 HOL_multi_ocean_training: "Учения в разных океанах"
 HOL_multi_ocean_training_desc: "Чтобы подготовиться к самым разным задачам на море, нидерландский флот проведёт обширные учения в нескольких океанах. Они улучшат совместимость с флотами союзников и повысят готовность нидерландских сил действовать в разных условиях."
 HOL_carrier_development: "Разработка авианосца"
 HOL_carrier_development_desc: "Создав современные авианосцы, Нидерланды закрепят своё превосходство на море и обеспечат защиту будущим поколениям."
 HOL_expand_dutch_naval_influence: "Расширить морское влияние Нидерландов"
 HOL_expand_dutch_naval_influence_desc: "Чтобы окончательно утвердиться как мировая морская держава, Нидерланды должны укрепить военно-морские союзы и усилить своё влияние в международных морских организациях. Это обеспечит учёт нидерландских интересов в мировых морских операциях и стратегиях."
 HOL_submarine_hunter_initiative: "Курс на охоту за подводными лодками"
 HOL_submarine_hunter_initiative_desc: "Растущая угроза со стороны вражеских подводных лодок требует новой доктрины, нацеленной на противолодочную борьбу. Нидерланды выйдут вперёд в разработке новейших противолодочных средств, чтобы нидерландские корабли никогда не оказывались во власти невидимых подводных угроз."
 HOL_amphibous_technology: "Специализированные экспедиционные силы"
 HOL_amphibous_technology_desc: "Нидерландам следует вложиться в создание узкоспециализированных военно-морских экспедиционных сил, способных быстро перебрасываться в горячие точки по всему миру. Эти силы будут опираться на десантные корабли и отборные дивизии морской пехоты, что позволит стремительно и решительно вмешиваться в заморские операции."
 HOL_return_of_destroyers: "Возвращение эсминцев"
 HOL_return_of_destroyers_desc: "Расширение и обновление эсминцев необходимо для господства на море. Эта цель предполагает постройку новых эсминцев с современным вооружением и средствами защиты. Эти корабли расширят возможности флота, дав надёжную оборону и наступательные средства на самых разных морских театрах."
 HOL_thales_investments: "Вложения в Thales"
 HOL_thales_investments_desc: "Thales Nederland, дочерняя компания мировой группы Thales, — ведущее предприятие Нидерландов в области оборонной, авиакосмической техники и техники безопасности. Вложения в Thales Nederland означают расширение её производственных возможностей, усиление исследований и разработок и укрепление её места на мировых оборонных рынках."
 HOL_special_force_move: "Морская пехота во Флиссингене"
 HOL_special_force_move_desc: "Решение разместить значительные силы морской пехоты во Флиссингене продиктовано стратегическими и тыловыми выгодами. Положение Флиссингена на берегу Северного моря даёт прямой выход к морским путям, что идеально для десантных операций и быстрого развёртывания. Имеющаяся в городе инфраструктура и близость к важнейшим судоходным линиям повышают готовность и свободу действий морской пехоты"
 HOL_rijksregiebureau_maritieme_industrie: "Rijksregiebureau Maritieme Industrie"
 HOL_rijksregiebureau_maritieme_industrie_desc: "Учреждение Rijksregiebureau Maritieme Maakindustrie — заметный шаг к сведению воедино и согласованию морского машиностроения Нидерландов. Это ведомство упорядочит работу по развитию судостроения и морской инженерии, чтобы нидерландская морская промышленность оставалась конкурентоспособной и технически передовой."
 HOL_maritiem_masterplan: "Maritiem Masterplan"
 HOL_maritiem_masterplan_desc: "Het Maritiem Masterplan излагает всеобъемлющую стратегию развития нидерландской морской отрасли. План включает вложения в инфраструктуру, исследования и разработки и подготовку кадров. Осуществив его, Нидерланды намерены закрепить за собой место мирового лидера в морских новшествах и устойчивом развитии."
 HOL_werf_van_de_toekomst: "Werf van de Toekomst"
 HOL_werf_van_de_toekomst_desc: "Проект De Werf van de Toekomst («Верфь будущего») призван совершить переворот в голландском судостроении. Замысел в том, чтобы внедрить в работу верфей передовые производственные технологии — автоматизацию, робототехнику и трёхмерную печать. Цель — сделать постройку судов более эффективной, экологичной и дешёвой."
 HOL_smart_maritime: "Smart Maritime"
 HOL_smart_maritime_desc: "Начинание Smart Maritime опирается на цифровые технологии, чтобы повысить отдачу нидерландской морской отрасли. Оно включает внедрение умных систем навигации, логистики и обслуживания, а также разработку безэкипажных судов. Через цифровое преобразование Нидерланды намерены выйти вперёд в умном судоходстве."
 HOL_robotics_navy: "Роботизация на море"
 HOL_robotics_navy_desc: "Проект Robotisering Wind op Zee («Роботизация морской ветроэнергетики») внедряет роботов и автоматику в морскую ветроэнергетику. Он призван улучшить установку, обслуживание и работу ветряков в море, сделав всё это безопаснее, быстрее и бережнее. Опираясь на роботов, Нидерланды смогут расширить свои возможности в возобновляемой энергетике."
 HOL_seabed_protection: "Защита инфраструктуры Северного моря"
 HOL_seabed_protection_desc: "Трубопроводы, силовые и информационные кабели и морские ветропарки покрывают теперь нидерландскую часть Северного моря, а диверсия на «Северных потоках» показала, насколько всё это уязвимо. Особая программа борьбы на морском дне соединяет исследовательские суда, гидроакустические сети и необитаемые подводные аппараты, чтобы следить за этой важнейшей инфраструктурой и защищать её."
 HOL_nuke_navy: "Nucleaire Voortstuwing van Schepen"
 HOL_nuke_navy_desc: "Начинание Nucleaire Voortstuwing van Schepen («Ядерная силовая установка для кораблей») изучает создание и внедрение ядерных энергетических установок для нидерландских военных и гражданских судов. Эта цель призвана дать устойчивые силовые установки большой автономности, снизить зависимость от ископаемого топлива и расширить возможности нидерландского флота."
 HOL_goalkeeper_modernization: "Модернизация Goalkeeper"
 HOL_goalkeeper_modernization_desc: "Нидерланды проводят модернизацию системы ближней обороны Goalkeeper, повышая возможности своей военно-морской защиты. Проект включает установку новых радиолокационных и систем сопровождения целей, улучшение управления огнём и интеграцию современных боеприпасов. Обновлённые комплексы Goalkeeper значительно усилят способность ВМС Нидерландов противостоять противокорабельным ракетам и другим угрозам на малых дистанциях."
 HOL_smartl_radar_construction: "Постройка РЛС SMART-L"
 HOL_smartl_radar_construction_desc: "Постройка радиолокационной станции SMART-L даст нидерландскому флоту новейшие средства дальнего обнаружения и сопровождения целей. Эта станция способна обнаруживать и вести баллистические ракеты, самолёты и другие воздушные цели на большом удалении. Внедрив SMART-L, Нидерланды улучшат картину обстановки и укрепят всю свою противовоздушную и противоракетную оборону."
 HOL_vrouwenklasse_destroyer: "Разработка класса Vrouwenklasse"
 HOL_vrouwenklasse_destroyer_desc: "Создавая противолодочные эсминцы класса Vrouwenklasse, Нидерланды намерены построить флот из современных и универсальных фрегатов. Эти корабли получат новейшие ракетные комплексы, превосходные радары и мощные средства радиоэлектронной борьбы. Эсминцы Vrouwenklasse рассчитаны и на наступательные, и на оборонительные действия на море, что позволит голландскому флоту оставаться грозной силой."
 HOL_den_helder_css: "Den Helder CSS"
 HOL_den_helder_css_desc: "Проект Den Helder CSS предусматривает постройку нового корабля боевого обеспечения для тылового и оперативного снабжения нидерландского флота. Этот корабль позволит силам флота вести продолжительные операции, снабжая их топливом, боеприпасами и другими необходимыми запасами. Den Helder CSS станет важнейшим средством поддержания боеспособности нидерландского флота."
 HOL_joint_support_ship: "Корабль совместного обеспечения Karel Doorman"
 HOL_joint_support_ship_desc: "Вступивший в строй в 2015 году Zr.Ms. Karel Doorman — корабль совместного обеспечения, соединивший в одном корпусе морские перевозки, снабжение в море и работу с вертолётами. Построенный Damen Schelde, он позволяет Королевскому флоту Нидерландов и морской пехоте действовать в отрыве от родных баз."
 HOL_amphibious_transport_group: "Группа десантных кораблей"
 HOL_amphibious_transport_group_desc: "Десантные корабли-доки типа Rotterdam во главе с Zr.Ms. Johan de Witt дают Korps Mariniers полноценную возможность десантного штурма. Док-камеры, палубы для техники и полётные палубы позволяют им высаживать усиленный батальон морской пехоты и служить плавучими пунктами управления объединёнными операциями."
 HOL_nh90_mlu: "NH90 MLU"
 HOL_nh90_mlu_desc: "Программа модернизации NH90 в середине срока службы призвана продлить срок и расширить возможности вертолётов NH90, которыми располагает нидерландский флот. Обновление включает современную авионику, улучшенные датчики и усиленные системы вооружения. NH90 MLU позволит этим универсальным машинам и дальше действенно решать противолодочные, поисково-спасательные и транспортные задачи."
 HOL_flexible_navy: "Гибкие действия флота"
 HOL_flexible_navy_desc: "Королевский флот Нидерландов должен уметь приспосабливаться к быстро меняющейся обстановке на морях. Сделав ставку на гибкие действия флота, мы повысим его способность быстро отвечать на самые разные угрозы — от подводной войны до обороны побережья. Это позволит нидерландскому флоту сохранять присутствие в разных морях и поддерживать союзников в совместных операциях, служа и национальной, и международной безопасности."
 HOL_submarine_modernization: "Программа обновления подводных лодок"
 HOL_submarine_modernization_desc: "Нидерланды берутся за всестороннее обновление своего подводного флота. Эта работа предполагает оснащение имеющихся лодок новейшими средствами малозаметности, современными гидроакустическими комплексами и улучшенным вооружением. Обновление повысит живучесть и боевую эффективность нидерландских лодок в самых разных условиях."
 HOL_barracuda_submarine: "Заказ подводных лодок Barracuda"
 HOL_barracuda_submarine_desc: "Приобретение подводных лодок типа Barracuda — заметный скачок в подводных возможностях Нидерландов. Эти атомные лодки несут передовые средства малозаметности, оружие большой дальности и новейшие гидроакустические комплексы. Barracuda дадут нидерландскому флоту непревзойдённые наступательные и оборонительные возможности под водой."
 HOL_c71_submarine: "Нидерландская разработка C71"
 HOL_c71_submarine_desc: "Проект подводной лодки C-71 — предмет гордости нидерландской морской промышленности и отражение давнего военно-морского наследия страны. Эти лодки созданы специально для обороны побережья и специальных операций и отличаются передовой силовой установкой, высокой манёвренностью и новейшим оборудованием связи. Тип C-71 заметно усилит способность нидерландского флота защищать свои территориальные воды и вести скрытные операции, а значит, Нидерланды и дальше будут в числе первых в морской обороне — с решениями собственной разработки."
 HOL_submarine_drones: "Разработка подводных беспилотников"
 HOL_submarine_drones_desc: "Глядя в будущее морской войны, Нидерланды вкладываются в подводные беспилотники для действий под водой. Эти автономные и дистанционно управляемые аппараты будут вести наблюдение, разведку и разминирование. Их внедрение расширит возможности нидерландского подводного флота и даст заметное тактическое преимущество."
 HOL_damen_industry_expansion: "Промышленное расширение Damen"
 HOL_damen_industry_expansion_desc: "В партнёрстве с верфями Damen Нидерланды расширяют судостроение, чтобы отвечать растущим запросам программ обновления флота. Расширение включает переоснащение верфей, вложения в исследования и разработки и наращивание производственных мощностей. Промышленное расширение Damen обеспечит Нидерландам место ведущей морской державы с передовой военно-морской техникой."
 HOL_legendary_dockyards: "Легендарные верфи Нидерландов"
 HOL_legendary_dockyards_desc: "Возрождение нидерландского корабельного мастерства даст поразительные плоды: выше производственные возможности верфей, короче сроки постройки, лучше проекты кораблей. Когда легендарные верфи оживут, Нидерланды закрепят за собой место лидера современной морской войны."
 HOL_paars: "Paars II"
 HOL_paars_desc: "Вторая «пурпурная» коалиция в составе Партии труда (PvdA), Народной партии за свободу и демократию (VVD) и «Демократов 66» (D66) продолжает править Нидерландами. Эта коалиция стремится уравновесить прогрессивную социальную политику экономическим либерализмом."
 HOL_threats_against_politicians: "Защитить политиков"
 HOL_threats_against_politicians_desc: "Недавние угрозы в адрес политиков породили тревогу за безопасность наших демократических институтов. Необходимо усилить меры охраны и обеспечить защиту избранных представителей народа."
 HOL_royal_wedding: "Королевская свадьба"
 HOL_royal_wedding_desc: "Помолвка наследного принца Виллема-Александра с Максимой Соррегьетой вызвала споры из-за причастности её отца к военной диктатуре в Аргентине. Это породило политическую и общественную дискуссию о его присутствии на свадьбе, по которой в итоге высказались правительство и парламент Нидерландов."
 HOL_un_mission_ehtiopia: "Вступить в миссию ООН в Эфиопии"
 HOL_un_mission_ehtiopia_desc: "Организация Объединённых Наций попросила Нидерланды принять участие в миротворческой миссии в Эфиопии. Участие в ней поднимет наш международный вес и послужит миру и устойчивости в мире"
 HOL_gay: "Однополые браки"
 HOL_gay_desc: "Легализация однополых браков — важная веха в борьбе за равенство и права человека. Это историческое решение закрепит за Нидерландами славу прогрессивного и открытого общества."
 HOL_vvd: "VVD: побеждает Дейкстал"
 HOL_vvd_desc: "VVD — либерально-консервативная партия, выступающая за свободный рынок, личную свободу и минимальное вмешательство государства в экономику. Под руководством прагматиков вроде Марка Рютте VVD делает ставку на экономический рост, эффективные государственные службы, крепкую национальную безопасность и взвешенный подход к иммиграции. Цель партии — динамичная и конкурентоспособная экономика при сохранении личных свобод и общественной стабильности."
 HOL_economic_paper: "Сократить экономическую отчётность"
 HOL_economic_paper_desc: "Чтобы сделать деловую среду живее и продуктивнее, VVD намерена сократить лишнюю экономическую отчётность. Срезав бюрократические путы, мы дадим предприятиям возможность сосредоточиться на росте и новшествах."
 HOL_vvd_debt_reduction: "Сокращение долга"
 HOL_vvd_debt_reduction_desc: "Обеспечить долгосрочную устойчивость нашей экономики — важнее всего. VVD намерена сократить государственный долг за счёт разумного управления финансами и адресного сокращения расходов, обеспечив процветание будущим поколениям."
 HOL_economic_stimulation_tax: "Налоговые стимулы для экономики"
 HOL_economic_stimulation_tax_desc: "VVD верит в силу экономических стимулов. Введя налоговые льготы для ключевых отраслей, мы подстегнём вложения, новшества и рост экономики."
 HOL_startup_innovation_policies: "Меры поддержки стартапов"
 HOL_startup_innovation_policies_desc: "Поощрение предпринимательства — сердцевина экономической стратегии VVD. Мы дадим налоговые послабления и субсидии новаторским стартапам, создав живую предпринимательскую среду."
 HOL_vvd_leadership: "Референдум о лидерстве"
 HOL_vvd_leadership_desc: "В 2006 году внутри VVD развернулась борьба за лидерство между Марком Рютте и Ритой Вердонк. Чтобы разрешить её и определить будущее направление партии, среди членов VVD был проведён референдум о лидерстве. Его итог должен был определить политику и стратегию партии, рассудив прагматичный центризм Рютте и жёсткую линию Вердонк."
 HOL_mark_rutte: "Марк Рютте"
 HOL_mark_rutte_desc: "Марк Рютте, прагматичный центристский лидер VVD, известен умением собирать широкие коалиции и ориентироваться в сложной политической обстановке. В 2006 году он делает упор на взвешенное управление с опорой на экономический либерализм, отлаженные государственные услуги и умеренную социальную политику. Рютте стремится обновить нидерландскую инфраструктуру, продвигать новшества и обеспечить Нидерландам прочное положение в Европейском союзе"
 HOL_consensus_politics: "Политика согласия"
 HOL_consensus_politics_desc: "Под руководством Марка Рютте VVD будет строить широкие коалиции и добиваться согласия по всему политическому спектру, обеспечивая устойчивость и дееспособное управление."
 HOL_modernize_dutch_infrastructure: "Обновить нидерландскую инфраструктуру"
 HOL_modernize_dutch_infrastructure_desc: "Вложения в инфраструктуру крайне важны для роста хозяйства. VVD обновит дороги, железные пути и цифровые сети, улучшив связность и разгрузив транспорт."
 HOL_strong_netherlands_europe: "Крепкие Нидерланды в крепкой Европе"
 HOL_strong_netherlands_europe_desc: "Крепкий Европейский союз необходим для нашей безопасности и благополучия. VVD будет добиваться более тесного хозяйственного сотрудничества и взаимодействия в области безопасности внутри ЕС"
 HOL_nato_norm: "Вложиться ради норматива НАТО"
 HOL_nato_norm_desc: "Безопасность страны не обсуждается. VVD обязуется увеличить оборонные расходы до натовской планки в 2 % ВВП, чтобы мы могли защитить страну и выполнить союзнические обязательства."
 HOL_pragmatic_immigration: "Прагматичная миграционная политика"
 HOL_pragmatic_immigration_desc: "Уравновешивая заботу о безопасности и нужду в интеграции, VVD под началом Рютте будет вести прагматичную миграционную политику, служащую общественной сплочённости и хозяйственной выгоде."
 HOL_teflon_mark: "Тефлоновый Марк"
 HOL_teflon_mark_desc: "Стойкость Марка Рютте и его умение выходить из политических передряг — бесценное достояние. VVD обопрётся на его руководство ради устойчивости и движения вперёд."
 HOL_rita_verdonk: "Рита Вердонк"
 HOL_rita_verdonk_desc: "Рита Вердонк, видная фигура в VVD, известна жёсткой линией по иммиграции и вопросам правопорядка. В 2006 году она выступает за строгий миграционный контроль, надёжные меры национальной безопасности и сохранение нидерландской культурной самобытности. Её подход находит отклик у избирателей, ждущих твёрдых решений по интеграции и общественной безопасности, и делает её сильным и решительным лидером внутри партии."
 HOL_national_identity: "Национальная самобытность"
 HOL_national_identity_desc: "Сохранение нидерландской культуры и самобытности превыше всего. Под руководством Вердонк VVD примет меры, чтобы наше национальное наследие берегли и чтили."
 HOL_tough_on_immigration: "Жёсткая линия по иммиграции"
 HOL_tough_on_immigration_desc: "Ради защиты границ и общественного порядка VVD займёт жёсткую позицию по иммиграции с упором на строгий контроль и сокращение притока мигрантов."
 HOL_law_and_order: "Закон и порядок"
 HOL_law_and_order_desc: "Общественная безопасность — одна из коренных ценностей VVD. Мы увеличим расходы на полицию и армию, чтобы бороться с преступностью и обеспечить безопасность страны"
 HOL_self_reliance_citizens: "Самостоятельные граждане"
 HOL_self_reliance_citizens_desc: "Поощрение самостоятельности и снижение зависимости от пособий — важные цели VVD. Мы примем меры, поощряющие личную ответственность и хозяйственную независимость."
 HOL_promote_dutch_sovereignty: "Отстаивать нидерландский суверенитет"
 HOL_promote_dutch_sovereignty_desc: "VVD под началом Вердонк сделает упор на нидерландский суверенитет, ограничивая влияние ЕС на политику страны и оберегая нашу независимость."
 HOL_iron_rita: "Железная Рита"
 HOL_iron_rita_desc: "Твёрдое и решительное руководство Риты Вердонк проведёт VVD через трудные времена, обеспечив крепкую хватку и ясный курс на будущее."
 HOL_wilders_vvd: "Герт Вилдерс"
 HOL_wilders_vvd_desc: "Герт Вилдерс — самый громкий противник иммиграции в VVD, говорящий от имени растущего недовольства интеграцией мигрантов и европейской интеграцией. Он толкает партию к более жёсткой линии в вопросах иммиграции, безопасности и национального суверенитета, оставаясь при этом в рамках её либеральной программы."
 HOL_immigration_hardliner: "Сторонник жёсткой линии в миграции"
 HOL_immigration_hardliner_desc: "Вилдерс требует куда более жёстких ограничений иммиграции и убежища. VVD ужесточает требования к въезду и интеграции, подавая себя партией, которая оградит нидерландское общество от неуправляемой миграции."
 HOL_islam_integration_debate: "Спор об интеграции"
 HOL_islam_integration_debate_desc: "Вилдерс выносит на общенациональный спор вопросы об исламе, интеграции и нидерландских ценностях. Партия занимает бескомпромиссную позицию, настаивая, что приезжие должны полностью принять либеральные и культурные нормы страны."
 HOL_eurosceptic_vvd_wing: "Евроскептическое крыло"
 HOL_eurosceptic_vvd_wing_desc: "Группа вокруг Вилдерса не доверяет всё более тесному европейскому сращиванию. VVD занимает более критическую позицию к Брюсселю, противясь передаче суверенитета и ставя под вопрос дальнейшее расширение."
 HOL_security_first: "Безопасность прежде всего"
 HOL_security_first_desc: "На фоне политического насилия и страха перед терроризмом Вилдерс требует более жёсткой линии в вопросах безопасности. Партия расширяет полномочия полиции и антитеррористических служб, чтобы успокоить встревоженное общество."
 HOL_wilders_dutch_sovereignty: "Голландский суверенитет"
 HOL_wilders_dutch_sovereignty_desc: "Крыло Вилдерса ставит национальный суверенитет выше наднациональных обязательств. VVD утверждает верховенство голландского права и голландских институтов, сужая власть внешних инстанций над внутренней политикой."
 HOL_wilders_vvd_capstone: "Голос недовольных"
 HOL_wilders_vvd_capstone_desc: "Вилдерс становится несомненным защитником избирателей, которые чувствуют себя неуслышанными. Его популизм меняет облик VVD, привязывая беспокойный электорат к новому, более жёсткому лицу партии."
 HOL_liberal_society: "Либеральное общество"
 HOL_liberal_society_desc: "Продвижение либеральной экономической модели — основа видения VVD. Мы будем отстаивать свободный рынок и конкуренцию как движители новшеств и благосостояния."
 HOL_modernizing_public_services: "Обновление государственных услуг"
 HOL_modernizing_public_services_desc: "Обновление государственных услуг через цифровую инфраструктуру и упрощённые процедуры — приоритет для VVD: это делает их быстрее и доступнее для всех граждан."
 HOL_commitment_to_security: "Курс на безопасность"
 HOL_commitment_to_security_desc: "Безопасность страны — первейшая забота. VVD вложится в полицию и армию, чтобы защитить граждан и отстоять верховенство права."
 HOL_public_private_partnerships: "Государственно-частное партнёрство"
 HOL_public_private_partnerships_desc: "VVD поддерживает государственно-частное партнёрство ради развития инфраструктуры и роста хозяйства совместными усилиями."
 HOL_increase_cyber_security: "Усилить кибербезопасность"
 HOL_increase_cyber_security_desc: "Во всё более цифровом мире VVD вложится в меры кибербезопасности, чтобы защитить государственную инфраструктуру и цифровые активы от киберугроз."
 HOL_privatize_health_sector: "Приватизировать здравоохранение"
 HOL_privatize_health_sector_desc: "Введение рыночных механизмов в здравоохранение повысит его отдачу и снизит издержки, а значит, услуги станут лучше для всех."
 HOL_woningbouwimpuls: "Жилищное строительство"
 HOL_woningbouwimpuls_desc: "Решить проблему нехватки жилья крайне важно. VVD ускорит жилищное строительство, чтобы жильё стало доступнее."
 HOL_economy_based_education: "Образование под нужды экономики"
 HOL_economy_based_education_desc: "Увязав учебные программы с нуждами рынка, мы дадим студентам востребованные умения, что повысит их шансы на работу и поможет экономике."
 HOL_innovation_subsidies: "Субсидии на новшества"
 HOL_innovation_subsidies_desc: "Субсидии на новаторские проекты взрастят культуру творчества и технического прогресса, питая рост хозяйства и конкурентоспособность."
 HOL_excellent_schools: "Ввести школы высокого уровня"
 HOL_excellent_schools_desc: "Поддержка создания школ высокого уровня поднимет требования и результаты обучения, и наши дети получат лучшее возможное образование"
 HOL_invest_clean_energy: "Вложиться в чистую энергетику"
 HOL_invest_clean_energy_desc: "Вложения в технологии чистой энергетики крайне важны, чтобы снизить зависимость от ископаемого топлива и сократить выбросы углерода. VVD поддержит проекты возобновляемой энергетики и бережные к природе методы."
 HOL_decrease_trade_bureaucracy: "Сократить торговую бюрократию"
 HOL_decrease_trade_bureaucracy_desc: "Снижение бюрократических барьеров в торговле ускорит и облегчит международные сделки. VVD намерена упростить торговые процедуры, чтобы повысить эффективность экспорта."
 HOL_mkb_actieplan: "MKB Actieplan"
 HOL_mkb_actieplan_desc: "Поддержка малых и средних предприятий жизненно важна для роста хозяйства. VVD примет план действий с налоговыми послаблениями, субсидиями и снижением регуляторной нагрузки для таких предприятий."
 HOL_nederland_digitaal: "Nederland Digitaal"
 HOL_nederland_digitaal_desc: "VVD видит государство и его услуги полностью переведёнными в цифру. Вкладываясь в современную ИТ-инфраструктуру и электронное правительство, мы сделаем их быстрее, прозрачнее и доступнее для всех граждан."
 HOL_balkenende: "Начинается время Балкененде"
 HOL_balkenende_desc: "Руководство Яна Петера Балкененде опирается на христианско-демократические ценности солидарности, ответственности и рачительного хозяйствования. Его прагматичный подход к управлению призван уравновесить экономический рост социальной справедливостью и заботой о природе."
 HOL_invest_in_police: "Вложиться в полицию"
 HOL_invest_in_police_desc: "Расширение возможностей нашей полиции обеспечит общественную безопасность и верховенство права, создав надёжную среду для всех граждан."
 HOL_prohibit_soft_drugs: "Запретить лёгкие наркотики"
 HOL_prohibit_soft_drugs_desc: "Ради здоровья людей и общественного порядка CDA ужесточит правила оборота лёгких наркотиков, сократив их доступность и смягчив связанный с ними вред."
 HOL_unhcr_migration_office: "Представительство УВКБ ООН по миграции"
 HOL_unhcr_migration_office_desc: "Поддержка создания в Нидерландах представительства УВКБ ООН по миграции расширит наши возможности вести дела об убежище и беженцах действенно и по-человечески."
 HOL_skilled_immigration: "Только квалифицированная иммиграция"
 HOL_skilled_immigration_desc: "Упор на квалифицированную иммиграцию обеспечит, что приезжие принесут пользу нашему хозяйству и обществу, закрыв нужды рынка труда и не расшатав общественную сплочённость."
 HOL_solidarity_healthcare: "Здравоохранение солидарности"
 HOL_solidarity_healthcare_desc: "CDA верит в здравоохранение, построенное на солидарности. Обеспечив каждому доступ к качественной помощи, мы стремимся создать более открытое и участливое общество."
 HOL_living_care: "Жильё и уход"
 HOL_living_care_desc: "Объединение жилья и ухода позволит нашим пожилым согражданам получать нужную поддержку, не покидая своих общин, и жить достойно и благополучно."
 HOL_family_ministry: "Министерство по делам семьи"
 HOL_family_ministry_desc: "Создание министерства по делам семьи сведёт воедино усилия по поддержке семейной жизни, и вся государственная политика будет согласованно работать на благополучие семей."
 HOL_invest_childcare: "Вложиться в присмотр за детьми"
 HOL_invest_childcare_desc: "Доступный и качественный присмотр за детьми жизненно важен для работающих семей. CDA увеличит расходы на услуги по уходу за детьми в поддержку родителей и детей."
 HOL_child_subsidies: "Пособия на детей"
 HOL_child_subsidies_desc: "Денежная поддержка семей с детьми поможет облегчить расходы на воспитание и позаботиться о благополучии самых юных граждан."
 HOL_nederland_sportland: "Nederland Sportland"
 HOL_nederland_sportland_desc: "Развитие спорта и двигательной активности необходимо здоровому обществу. CDA вложится в спортивные сооружения и программы, поощряющие подвижный образ жизни."
 HOL_invest_in_clean_energy: "Вложиться в чистую энергетику"
 HOL_invest_in_clean_energy_desc: "Вложения в технологии чистой энергетики крайне важны для устойчивого будущего. CDA поддержит проекты возобновляемой энергетики и начинания по сокращению выбросов углерода."
 HOL_financial_freedom_schools: "Финансовая самостоятельность школ"
 HOL_financial_freedom_schools_desc: "Финансовая самостоятельность школ позволит им лучше отвечать на нужды своих учеников и искать новые подходы в обучении."
 HOL_practical_job_education: "Практическое профессиональное обучение"
 HOL_practical_job_education_desc: "Упор на практическое профессиональное обучение даст ученикам умения, нужные рынку труда, снизит безработицу и поможет росту хозяйства."
 HOL_business_risk_law: "Закон о рисках работодателя"
 HOL_business_risk_law_desc: "Чтобы позаботиться о благополучии работников, CDA проведёт закон, обязывающий предприятия отвечать за своих сотрудников даже во время болезни. Эта мера призвана защитить права работников и сделать рабочую среду здоровее и участливее."
 HOL_maatschappelijk_ondernemen: "Maatschappelijk Ondernemen"
 HOL_maatschappelijk_ondernemen_desc: "Продвижение социально ответственного предпринимательства обеспечит вклад бизнеса в общее благо, уравновешивая прибыль обязательствами перед обществом и природой."
 HOL_remove_trade_tape: "Срезать торговую волокиту"
 HOL_remove_trade_tape_desc: "Снижение бюрократических барьеров в торговле ускорит и упростит международные сделки, подстегнув экспорт и рост хозяйства."
 HOL_diversify_housing: "Разнообразить жилищный фонд"
 HOL_diversify_housing_desc: "Чтобы преодолеть нехватку жилья и дать людям доступные варианты, CDA вложится в разные жилищные проекты: социальное жильё, арендные дома и жильё в собственности."
 HOL_balkenende_resigns: "Отставка кабинета Балкененде IV"
 HOL_balkenende_resigns_desc: "Следуя принципу CDA о смене министров, премьер-министр Ян Петер Балкененде ушёл в отставку после двух сроков. Это решение кладёт конец четвёртому кабинету Балкененде и открывает для CDA новую главу, обеспечивая партии свежий взгляд и новое руководство."
 HOL_maxime_verhagen: "Максим Верхаген"
 HOL_maxime_verhagen_desc: "Максим Верхаген — искусный дипломат и мастер собирать коалиции, известный прагматичным руководством. Его упор на укрепление международных союзов и поддержание устойчивости снискал ему уважение и в нидерландской, и в мировой политике."
 HOL_trust_in_people: "Доверие к людям"
 HOL_trust_in_people_desc: "Доверие к гражданам необходимо сплочённому обществу. CDA будет продвигать меры, дающие людям больше самостоятельности и взращивающие взаимное уважение."
 HOL_trust_in_organizations: "Доверие к организациям"
 HOL_trust_in_organizations_desc: "CDA повысит добросовестность и прозрачность организаций, чтобы они работали честно и приносили обществу пользу."
 HOL_active_society: "Активное общество"
 HOL_active_society_desc: "Поощрение активной гражданской позиции и участия в жизни общин — сердцевина видения CDA. Мы поддержим начинания, развивающие добровольчество и гражданскую вовлечённость."
 HOL_micro_credit: "Разрешить микрокредитование"
 HOL_micro_credit_desc: "Доступ к микрокредитам придаст сил малому бизнесу и предпринимателям, питая рост хозяйства и новшества на низовом уровне."
 HOL_public_private_innovation: "Новшества на стыке частного и государственного"
 HOL_public_private_innovation_desc: "Сотрудничество частного и государственного секторов подстегнёт новшества и сделает государственные услуги быстрее и лучше."
 HOL_heavy_efforts_clean_industry: "Решительный курс на чистую энергетику"
 HOL_heavy_efforts_clean_industry_desc: "Усиленная работа над чистой энергетикой сократит наш углеродный след и обеспечит Нидерландам устойчивое будущее."
 HOL_invest_bio_agriculture: "Вложиться в биологическое земледелие"
 HOL_invest_bio_agriculture_desc: "Поддержка биологического земледелия укоренит бережные методы хозяйствования и обеспечит долговременное здоровье нашей природы и продовольствия."
 HOL_buma: "Сибранд ван Херсма Бюма"
 HOL_buma_desc: "После отставки Балкененде во главе CDA встаёт Сибранд ван Херсма Бюма, возвращая партии внимание к традиционным ценностям и социальной справедливости."
 HOL_reform_justice_system: "Реформировать правосудие"
 HOL_reform_justice_system_desc: "Реформа правосудия сделает его справедливее, быстрее и доступнее, чтобы все граждане имели равный доступ к суду"
 HOL_modern_investments_police: "Современные вложения в полицию"
 HOL_modern_investments_police_desc: "Новые вложения в полицию обеспечат общественную безопасность и верховенство права, создав надёжную среду для всех граждан."
 HOL_traditional_values: "Традиционные ценности"
 HOL_traditional_values_desc: "CDA по-прежнему отстаивает традиционные ценности — семью, общину и общественную ответственность — как основу нашего общества."
 HOL_rentmeesterschap: "Rentmeesterschap"
 HOL_rentmeesterschap_desc: "Держась начала «rentmeesterschap» (рачительного хозяйствования), CDA будет продвигать бережное распоряжение ресурсами, сохраняя их для будущих поколений и не мешая росту хозяйства."
 HOL_green_economy: "Зелёная экономика"
 HOL_green_economy_desc: "Переход к зелёной экономике необходим для устойчивого развития. CDA поддержит начинания, продвигающие бережные к природе технологии и методы, уравновешивая экономический рост охраной природы."
 HOL_reduce_european_influence: "Ограничить европейское влияние"
 HOL_reduce_european_influence_desc: "Чтобы сберечь нидерландский суверенитет и поставить национальные интересы на первое место, CDA будет добиваться ограничения влияния Европейского союза на внутреннюю политику."
 HOL_fortress_of_values: "Крепость ценностей"
 HOL_fortress_of_values_desc: "Сибранд Бюма хочет укрепить общественную ткань и национальную самобытность Нидерландов, продвигая традиционные ценности и стойкость. Его линия нацелена на сплочённую и безопасную страну с упором на защиту нидерландской культуры и наследия. Укрепляя коренные начала страны, Бюма стремится создать общество, твёрдо стоящее против внешних угроз и внутреннего раскола, и воспитать крепких, гордых граждан."
 HOL_melkert_surprise: "Неожиданная победа Мелкерта"
 HOL_melkert_surprise_desc: "Под руководством Ада Мелкерта PvdA выдвинула неожиданные и смелые меры, призванные вдохнуть в страну новую жизнь. Эти начинания сулят перемены к лучшему и закладывают основу более открытого и благополучного общества."
 HOL_inclusive_society: "Открытое общество"
 HOL_inclusive_society_desc: "Создание открытого общества, где каждый чувствует себя нужным и уважаемым, — одно из главных начал PvdA. Мы примем меры в поддержку разнообразия и общественной сплочённости, чтобы все граждане могли в полной мере участвовать в жизни страны."
 HOL_democratic_active_government: "Демократическая и деятельная власть"
 HOL_democratic_active_government_desc: "PvdA намерена укреплять демократические институты и развивать деятельное участие граждан в политике. Мы добьёмся, чтобы власть была прозрачной, подотчётной и отзывчивой к нуждам всех граждан."
 HOL_strong_european_union: "Крепкий Европейский союз"
 HOL_strong_european_union_desc: "PvdA поддерживает крепкий, демократический и социально ответственный Европейский союз. Мы будем работать над более глубоким хозяйственным и политическим сращиванием, развивая сотрудничество и солидарность между странами ЕС."
 HOL_accessible_healthcare: "Доступное здравоохранение"
 HOL_accessible_healthcare_desc: "Обеспечить каждому доступ к качественной медицине — приоритет для PvdA. Мы расширим государственные медицинские услуги, сократим очереди и позаботимся о том, чтобы медицина оставалась по карману всем."
 HOL_social_security: "Социальная защита для всех"
 HOL_social_security_desc: "Укрепление системы социальной защиты крайне важно для самых уязвимых членов общества. PvdA позаботится о том, чтобы пособий хватало на основные нужды всех граждан и поддержка приходила в трудную минуту."
 HOL_work_care_for_all: "Работа и забота для всех"
 HOL_work_care_for_all_desc: "PvdA гарантирует каждому доступ к оплачиваемой работе и качественной медицине. Мы поддержим меры, которые помогают людям совмещать работу, заботу о близких и личное развитие, создавая более отзывчивое и открытое общество."
 HOL_fair_wages: "Справедливая оплата и гарантии"
 HOL_fair_wages_desc: "Справедливая оплата и социальные гарантии для всех работников необходимы, чтобы сократить разрыв в доходах. PvdA проведёт меры, продвигающие честную оплату труда и коллективные переговоры, обеспечив достаток самым уязвимым."
 HOL_job_creation_security: "Рабочие места и уверенность в завтрашнем дне"
 HOL_job_creation_security_desc: "Создание рабочих мест для всех граждан крайне важно. PvdA вложится в программы профессионального обучения, поддержит малый бизнес и позаботится о том, чтобы у каждого была возможность найти осмысленную работу, что укрепит уверенность в завтрашнем дне и снизит безработицу."
 HOL_quality_education_for_all: "Качественное образование для всех"
 HOL_quality_education_for_all_desc: "Вложения в образование на всех уровнях — залог того, что у каждого ребёнка и взрослого будет доступ к качественному обучению. PvdA поддержит профессиональное обучение и образование на протяжении всей жизни и добьётся, чтобы учебные программы отвечали нуждам рынка труда."
 HOL_sustainable_economic_growth: "Устойчивый экономический рост"
 HOL_sustainable_economic_growth_desc: "PvdA делает ставку на устойчивый рост хозяйства на благо всех граждан. Мы вложимся в возобновляемую энергетику, новшества и зелёные технологии, чтобы построить стойкую и устойчивую экономику для будущих поколений."
 HOL_invest_childcare_pvda: "Вложиться в общественный присмотр за детьми"
 HOL_invest_childcare_pvda_desc: "Увеличение расходов на услуги по уходу за детьми необходимо, чтобы поддержать работающих родителей и способствовать раннему развитию детей. PvdA позаботится о том, чтобы доступный и качественный присмотр за детьми был у всех семей."
 HOL_elderly_care: "Забота о пожилых"
 HOL_elderly_care_desc: "Всесторонняя забота о пожилых — приоритет для PvdA. Мы позаботимся о том, чтобы наши пожилые сограждане получали поддержку, позволяющую жить достойно и самостоятельно, будем развивать уход по месту жительства и помогать родственникам, ухаживающим за близкими."
 HOL_child_youth_welfare: "Благополучие детей и молодёжи"
 HOL_child_youth_welfare_desc: "Вложения в программы поддержки и развития детей и молодёжи необходимы. PvdA обеспечит доступ к образованию, медицине и досугу, заботясь о благополучии самых юных граждан."
 HOL_social_tech_revolution: "Техническая революция"
 HOL_social_tech_revolution_desc: "Принять техническую революцию необходимо, чтобы каждый мог участвовать в информационном обществе. PvdA вложится в образование, цифровую инфраструктуру и начинания, преодолевающие цифровой разрыв, развивая новшества и открытость."
 HOL_green_urban_development: "Зелёное развитие городов"
 HOL_green_urban_development_desc: "Устойчивое развитие городов, соединяющее плотную застройку с высоким качеством жизни, — приоритет для PvdA. Мы сделаем города крепкими, открытыми и бережными к природе, вкладываясь в зелёную инфраструктуру и общественные пространства."
 HOL_sustainable_agriculture: "Бережное земледелие"
 HOL_sustainable_agriculture_desc: "Поддержка бережного земледелия жизненно важна для продовольственной безопасности и охраны природы. PvdA будет продвигать органическое земледелие, разумное землепользование и сокращение сельскохозяйственного загрязнения ради здоровой и надёжной еды."
 HOL_renewable_energy_investments: "Вложения в возобновляемую энергетику"
 HOL_renewable_energy_investments_desc: "Крупные вложения в возобновляемые источники крайне важны, чтобы снизить нашу зависимость от ископаемого топлива и бороться с изменением климата. PvdA поддержит проекты солнечной, ветровой и гидроэнергетики ради устойчивого энергетического будущего."
 HOL_new_socialist_age: "Новая пора социал-демократии"
 HOL_new_socialist_age_desc: "Чтобы оставаться нужной и действенной, PvdA преобразится и лучше ответит на запросы современного общества. Это значит обновить программу, говорить с новыми поколениями и искать свежие подходы к управлению."
 HOL_samsom: "Самсом"
 HOL_samsom_desc: "Дидерик Самсом избран новым лидером PvdA. Известный твёрдой природоохранной позицией, Самсом намерен вести партию к более зелёному и устойчивому будущему, не забывая о социальной справедливости и открытости."
 HOL_environmental_vision: "Природоохранное видение"
 HOL_environmental_vision_desc: "Под руководством Дидерика Самсома PvdA поставит во главу угла бережное отношение к природе. Мы примем всеобъемлющие меры, чтобы сберечь природные богатства и обеспечить здоровую среду будущим поколениям."
 HOL_green_economy_pvda: "Зелёная экономика"
 HOL_green_economy_pvda_desc: "Дидерик Самсом выступает за переход к зелёной экономике через бережные к природе технологии и устойчивые методы хозяйствования. Это создаст рабочие места, подстегнёт новшества и убережёт природу."
 HOL_circular_economy: "Экономика замкнутого цикла"
 HOL_circular_economy_desc: "Чтобы сократить отходы и беречь природу, мы построим экономику замкнутого цикла, в которой материалы используются повторно, ремонтируются и перерабатываются. Такой подход обеспечивает устойчивый производственный цикл и сводит вред природе к наименьшему."
 HOL_energy_transition: "Зелёный энергетический переход"
 HOL_energy_transition_desc: "Ускорение энергетического перехода необходимо для устойчивого будущего. Мы откажемся от ископаемого топлива, вложимся в возобновляемую энергетику и поддержим новшества в накоплении энергии и её сбережении."
 HOL_digital_innovation: "Цифровые новшества"
 HOL_digital_innovation_desc: "Развитие цифровых новшеств необходимо для роста экономики и её обновления. Мы поддержим технологические стартапы, вложимся в ИТ-инфраструктуру и повысим цифровую грамотность, чтобы Нидерланды оставались в авангарде технического прогресса."
 HOL_social_justice: "Социальная справедливость"
 HOL_social_justice_desc: "Социальная справедливость — сердцевина видения Дидерика Самсома. Мы возьмёмся за разрыв в доходах, обеспечим равные возможности и добьёмся, чтобы все граждане могли полноценно участвовать в жизни общества."
 HOL_inclusive_society_pvda: "Открытое общество"
 HOL_inclusive_society_pvda_desc: "Построить открытое общество, где каждый чувствует себя нужным и уважаемым, необходимо. Мы будем продвигать меры в поддержку разнообразия и открытости во всех сторонах жизни."
 HOL_innovation_in_education: "Общественные новшества в образовании"
 HOL_innovation_in_education_desc: "Обновление образования, готовящее учеников к будущему, крайне важно. Мы вложимся в цифровые учебные средства, естественно-научное и инженерное образование и подготовку учителей, чтобы система обучения оставалась качественной."
 HOL_affordable_living: "Доступная жизнь"
 HOL_affordable_living_desc: "Обеспечить людям доступные условия жизни — наш приоритет. Мы вложимся в социальное жильё, отрегулируем рынок аренды и дадим субсидии, чтобы жильё стало по карману каждому."
 HOL_public_health_initiatives: "Программы общественного здоровья"
 HOL_public_health_initiatives_desc: "Поддержка всесторонних программ общественного здоровья крайне важна. Мы сделаем упор на профилактику, психическое здоровье и сокращение разрыва в доступности медицины, чтобы качественная помощь была доступна каждому."
 HOL_fusion_groenlinks: "Объединиться с GroenLinks"
 HOL_fusion_groenlinks_desc: "Настало время Партии труда и GroenLinks объединить силы под началом Франса Тиммерманса. Соединив наши общие ценности и прогрессивные устремления, мы создадим единый фронт, отстаивающий борьбу с изменением климата, социальное равенство и устойчивое будущее Нидерландов."
 HOL_asscher: "Ашер"
 HOL_asscher_desc: "Лодевейк Ашер избран новым лидером PvdA. Известный своим вниманием к рынку труда, социальному обеспечению и интеграции, Ашер намерен вести партию к большей социальной справедливости и хозяйственной устойчивости."
 HOL_labour_market_reforms: "Реформы рынка труда"
 HOL_labour_market_reforms_desc: "Лодевейк Ашер твёрдо намерен создать открытый рынок труда. Мы поддержим программы профессионального обучения, будем бороться с дискриминацией и обеспечим справедливую оплату всем работникам."
 HOL_integration_policies: "Политика интеграции"
 HOL_integration_policies_desc: "Действенная политика интеграции — залог сплочённого общества. Ашер поддерживает начинания, облегчающие вхождение иммигрантов и беженцев в нидерландское общество."
 HOL_workplace_equality: "Равенство на рабочем месте"
 HOL_workplace_equality_desc: "Равенство на рабочем месте жизненно важно для справедливого общества. Ассхер введёт меры против дискриминации и в поддержку разнообразия на производстве."
 HOL_strengthening_social_security: "Укрепление социальной защиты"
 HOL_strengthening_social_security_desc: "Надёжная система социальной защиты крайне важна. Ашер примет меры, чтобы защитить самых уязвимых и поддержать людей в трудную минуту."
 HOL_child_welfare: "Благополучие детей"
 HOL_child_welfare_desc: "Благополучие детей — первейшая забота. Ашер выступает за увеличение расходов на программы защиты детства, включая дошкольное образование, медицину и поддержку семей."
 HOL_social_innovation: "Общественные новшества"
 HOL_social_innovation_desc: "Развитие общественных новшеств необходимо, чтобы справляться со сложными общественными задачами. Мы поддержим начинания, налаживающие совместный поиск новых решений."
 HOL_educational_equity: "Равенство в образовании"
 HOL_educational_equity_desc: "Равные возможности в образовании для всех учеников крайне важны. Ашер вложится в школы неблагополучных районов, даст дополнительную поддержку отстающим ученикам и будет развивать инклюзивное обучение."
 HOL_poverty_reduction: "Сокращение бедности"
 HOL_poverty_reduction_desc: "Сокращение бедности необходимо справедливому обществу. Мы проведём всеобъемлющие программы борьбы с бедностью, включая рост социальных выплат и адресную поддержку уязвимых слоёв."
 HOL_digital_literacy: "Цифровая грамотность"
 HOL_digital_literacy_desc: "Повышение цифровой грамотности крайне важно в нынешнем технологичном мире. Ашер поддерживает начинания, которые дадут всем гражданам навыки, нужные для успеха в цифровой экономике."
 HOL_economic_resilience: "Хозяйственная устойчивость"
 HOL_economic_resilience_desc: "Хозяйственная устойчивость необходима, чтобы переживать будущие кризисы. Мы вложимся в разные отрасли, поддержим малый бизнес и создадим надёжную защиту для всех граждан."
 HOL_labour_rights: "Права трудящихся"
 HOL_labour_rights_desc: "Ашер — твёрдый защитник прав трудящихся. Мы усилим защиту работников, обеспечим безопасные условия труда и поддержим право на коллективные переговоры."
 HOL_sustainable_urban_development: "Устойчивое развитие городов"
 HOL_sustainable_urban_development_desc: "Поддержка устойчивого развития городов — залог того, что в них будет удобно жить. Мы вложимся в зелёную инфраструктуру, общественные пространства и бережные к природе жилищные проекты."
 HOL_social_housing: "Социальное жильё"
 HOL_social_housing_desc: "Расширение социального жилья крайне важно для преодоления жилищного кризиса. Ашер вложится в строительство и обновление доступного жилья, чтобы у каждого была надёжная крыша над головой."
 HOL_bos: "Бос"
 HOL_bos_desc: "Ваутер Бос избран новым лидером PvdA. Известный своими познаниями в экономике и ролью во время финансового кризиса, Бос намерен вести партию к хозяйственной устойчивости и росту, не забывая о социальной справедливости."
 HOL_economic_expertise: "Познания в экономике"
 HOL_economic_expertise_desc: "Ваутер Бос известен своими познаниями в экономике. Под его руководством PvdA сосредоточится на разумной экономической политике ради устойчивости и долговременного роста."
 HOL_crisis_management: "Управление кризисом"
 HOL_crisis_management_desc: "Опыт Ваутера Боса в преодолении финансовых кризисов бесценен. Мы примем надёжные меры, чтобы экономика выстояла перед мировыми потрясениями."
 HOL_financial_sector_reform: "Реформа финансового сектора"
 HOL_financial_sector_reform_desc: "Всеобъемлющие реформы финансового сектора необходимы, чтобы предотвратить будущие кризисы и добиться прозрачности и подотчётности. Ваутер Бос возглавит работу по действенному регулированию финансовой отрасли."
 HOL_progressive_taxation: "Прогрессивное налогообложение"
 HOL_progressive_taxation_desc: "Справедливая прогрессивная налоговая система — залог сокращения неравенства и поступлений на общественные нужды. PvdA под началом Боса добьётся, чтобы самые состоятельные платили свою долю сполна."
 HOL_affordable_housing: "Доступное жильё"
 HOL_affordable_housing_desc: "Чтобы преодолеть жилищный кризис, Ваутер Бос выступает за меры, увеличивающие предложение доступного жилья. Мы вложимся в проекты социального жилья и дадим субсидии, чтобы собственное жильё стало доступно всем."
 HOL_employment_opportunities: "Рабочие места"
 HOL_employment_opportunities_desc: "Достаточное число рабочих мест — тоже первейшая забота Ваутера Боса. Только обеспечив людям занятость, мы построим устойчивое и развивающееся общество."
 HOL_universal_healthcare: "Всеобщее здравоохранение"
 HOL_universal_healthcare_desc: "Доступ каждого к качественной медицине — приоритет Ваутера Боса. Мы расширим государственные медицинские услуги, сократим очереди и позаботимся о том, чтобы медицина оставалась по карману всем."
 HOL_fiscal_responsibility: "Бюджетная ответственность"
 HOL_fiscal_responsibility_desc: "Ваутер Бос намерен удерживать бюджет сбалансированным, не урезая при этом финансирование важнейших общественных услуг. Ответственная бюджетная политика обеспечит нидерландской экономике устойчивость и надёжность для будущих поколений."
 HOL_green_economic_growth: "Зелёный экономический рост"
 HOL_green_economic_growth_desc: "Ради долгого процветания Ваутер Бос будет отстаивать экономическую политику зелёного и устойчивого роста. Мы вложимся в чистую энергетику, зелёные рабочие места и бережную к природе инфраструктуру, чтобы подготовить экономику к будущему и бороться с изменением климата."
 HOL_debt_relief_programs: "Программы списания долгов"
 HOL_debt_relief_programs_desc: "Чтобы облегчить долговое бремя уязвимых слоёв, Ваутер Бос запустит программы списания долгов для граждан и малого бизнеса. Это поддержит бедствующие семьи и предпринимателей и повысит хозяйственную подвижность и устойчивость."
 HOL_strengthening_eurozone: "Укрепление еврозоны"
 HOL_strengthening_eurozone_desc: "Ваутер Бос понимает, насколько крепкая и устойчивая еврозона важна для стабильности нидерландской экономики. Возглавив работу по её укреплению, мы будем продвигать согласование бюджетной политики и хозяйственное сотрудничество в ЕС ради долгого благополучия."
 HOL_small_business_support: "Поддержка малого бизнеса"
 HOL_small_business_support_desc: "Поддержка малого бизнеса — залог живой экономики. Ваутер Бос проведёт меры, снижающие налоги для малых предприятий, открывающие им доступ к кредиту и убирающие бюрократические преграды, чтобы малый бизнес рос и создавал рабочие места."
 HOL_lpf: "Ночь Пима Фортёйна"
 HOL_lpf_desc: "«Список Пима Фортёйна» (LPF) был создан, чтобы сломать политический застой. Под руководством Пима Фортёйна LPF отстаивает национальный суверенитет, закон и порядок и гордое, уверенное в себе нидерландское общество. Это движение бросит вызов укоренившимся политическим элитам и добьётся смелых реформ, ставящих Нидерланды на первое место."
 HOL_support_sme: "Поддержка малых и средних предприятий"
 HOL_support_sme_desc: "Малые и средние предприятия — хребет нидерландской экономики. LPF сократит регулирование и поддержит такие предприятия, чтобы они процветали и питали рост хозяйства."
 HOL_pvv: "Вилдерс выходит на политическую арену"
 HOL_pvv_desc: "Партия свободы (PVV), основанная Гертом Вилдерсом, отстаивает нидерландский суверенитет, сохранение культуры и безопасность. PVV намерена сократить иммиграцию, вернуть народу гордость и оспорить влияние ЕС, чтобы Нидерланды оставались безопасной и благополучной родиной для своих граждан. Делая упор на противодействие исламскому экстремизму и защиту традиционных ценностей, PVV говорит от имени нидерландской самобытности и независимости."
 HOL_restore_royal_authority: "Восстановить власть короны"
 HOL_restore_royal_authority_desc: "Монархия должна вновь утвердить свою власть как опору нидерландского управления. Сосредоточив полномочия, корона обеспечит стране устойчивость и единство."
 HOL_establish_stadtholderate: "Учредить штатгальтерство"
 HOL_establish_stadtholderate_desc: "Современное штатгальтерство позволит уравновесить управление: сохранить демократическую подотчётность, не теряя направляющего влияния монархии."
 HOL_restore_royal_privileges: "Восстановить королевские привилегии"
 HOL_restore_royal_privileges_desc: "Вернуть монархии её исторические привилегии ради устойчивости и защиты традиций и ценностей страны."
 HOL_voc: "Возродить дух VOC"
 HOL_voc_desc: "VOC (Нидерландская Ост-Индская компания) была когда-то движущей силой мирового влияния Нидерландов и создала империю торговли и новшеств. Обновив её задачи, мы можем призвать её дух, чтобы вновь утвердить нидерландское влияние в краях, без которых немыслима мировая торговля XXI века."
 HOL_reclaim_voc_territories: "Начать поход за землями VOC"
 HOL_reclaim_voc_territories_desc: "Пора слов миновала. Наследие VOC требует дела, и наша армия готова его начать. Вернув земли нашего славного прошлого, мы восстановим нидерландское влияние и вновь займём место мировой державы."
 HOL_asml_tsmc_partnership: "Заключить партнёрство ASML — TSMC"
 HOL_asml_tsmc_partnership_desc: "Производство полупроводников TSMC и опыт ASML в литографии делают Тайвань стратегическим узлом технологий. Партнёрство ASML и TSMC обеспечит Нидерландам роль незаменимого участника мировой технологической гонки."
 HOL_voc_territory_focus: "Сосредоточиться на землях VOC за пределами Индонезии"
 HOL_voc_territory_focus_desc: "VOC воссоздана, и нам предстоит решить: возвращать Индонезию или сосредоточиться на других важных землях. Сделав упор на Индию, Южную Африку, Тайвань и Шри-Ланку, мы отстроим мировую сеть VOC и утвердим нидерландское влияние по всему свету. Индонезия подождёт. Наши устремления простираются куда дальше её берегов."
 HOL_wic: "Возродить Вест-Индскую компанию"
 HOL_wic_desc: "Вест-Индская компания (WIC) некогда была опорой голландского влияния в Америке и Атлантике. Возродив её дело, мы сможем вновь утвердить контроль над стратегическими территориями, оживить торговлю и расширить своё присутствие в Западном полушарии, вернув голландскому флагу былую славу."
 HOL_d66: "D66"
 HOL_d66_desc: "D66 — светоч прогрессизма в Нидерландах, защитница демократии, устойчивого развития и социального равенства. Наше видение ведёт страну к будущему новшеств, открытости и сотрудничества, где у каждого гражданина есть голос и своя доля в строительстве лучшего завтра."
 HOL_d66_democratic_institutions: "Укрепить демократические институты"
 HOL_d66_democratic_institutions_desc: "D66 намерена уберечь сами основы демократии. Повышая прозрачность, подотчётность и участие граждан, мы добьёмся того, чтобы власть оставалась справедливой и работала на людей."
 HOL_d66_direct_democracy: "Продвигать прямую демократию"
 HOL_d66_direct_democracy_desc: "Граждане заслуживают более весомого голоса в решениях, касающихся их жизни. Продвигая обязательные референдумы и участие жителей в распределении бюджета, D66 приблизит принятие решений к людям."
 HOL_d66_rule_of_law: "Защитить верховенство права"
 HOL_d66_rule_of_law_desc: "Верховенство права необходимо справедливому и работающему обществу. D66 сосредоточится на независимости суда, защите гражданских свобод и борьбе с коррупцией на всех уровнях власти."
 HOL_d66_climate_action_plan: "Принять план действий по климату"
 HOL_d66_climate_action_plan_desc: "Климатический кризис — один из величайших вызовов нашего времени. Решительными мерами, включая сокращение выбросов и развитие возобновляемой энергетики, D66 поведёт страну к устойчивому будущему."
 HOL_d66_green_energy: "Расширить вложения в зелёную энергетику"
 HOL_d66_green_energy_desc: "Переход на возобновляемые источники — залог более чистого и зелёного будущего. D66 отдаст приоритет вложениям в ветровую, солнечную и другие устойчивые энергетические проекты, чтобы снизить нашу зависимость от ископаемого топлива."
 HOL_d66_european_initiative: "Укрепить европейское сотрудничество"
 HOL_d66_european_initiative_desc: "D66 считает, что Европейский союз необходим для нашего общего процветания и безопасности. Укрепление связей с ЕС обеспечит Нидерландам место влиятельного участника европейского сообщества."
 HOL_d66_social_progress: "Двигать общественный прогресс"
 HOL_d66_social_progress_desc: "Равенство, открытость и справедливость — краеугольные камни прогрессивного общества. D66 будет отстаивать меры против неравенства, защиту меньшинств и равные возможности для всех граждан."
 HOL_d66_education_investments: "Вложиться в образование"
 HOL_d66_education_investments_desc: "Образование — ключ к раскрытию сил будущих поколений. D66 поставит во главу угла финансирование и реформы, чтобы у каждого ребёнка был доступ к качественному обучению."
 HOL_sgp: "Staatkundig Gereformeerde Partij"
 HOL_sgp_desc: "Staatkundig Gereformeerde Partij (SGP) стоит оплотом христианского консерватизма. Приверженная управлению по библейским началам, SGP отстаивает нравственное общество, укоренённое в вере, семье и традиции."
 HOL_gl: "GroenLinks"
 HOL_gl_desc: "GroenLinks привержена устойчивому, справедливому и открытому обществу. Уходя корнями в защиту природы и социальную справедливость, партия отстаивает зелёную энергетику, биоразнообразие и равенство как краеугольные камни будущего Нидерландов."
 HOL_asml_high_na_euv: "Проложить путь литографии High-NA EUV"
 HOL_asml_high_na_euv_desc: "Установки нового поколения TWINSCAN EXE от ASML доводят литографию до числовой апертуры 0,55 и печатают схемы тоньше, чем под силу любому сопернику. Овладение High-NA EUV делает наши машины незаменимыми для каждой передовой фабрики на Земле."
 HOL_asml_imec_partnership: "Открыть совместную лабораторию High-NA вместе с imec"
 HOL_asml_imec_partnership_desc: "В Велдховене ASML и научный институт imec держат совместную лабораторию High-NA EUV, дающую производителям чипов и поставщикам материалов первый доступ к новым сканерам. Лаборатория закрепляет за Нидерландами роль испытательного полигона для самых передовых полупроводников мира."
 HOL_asml_brainport_campus: "Расширить промышленный кампус Brainport"
 HOL_asml_brainport_campus_desc: "Опираясь на многомиллиардные обязательства государства, ASML расширяется на промышленном кампусе Brainport под Эйндховеном, а не уходит за границу. Новые чистые комнаты и площадки поставщиков прочно закрепляют чиповую отрасль — и её налоговые поступления — на нидерландской земле."
 HOL_support_intervention_iraq: "Поддержать вмешательство в Ираке"
 HOL_support_intervention_iraq_desc: "После терактов 11 сентября и на фоне растущей нестабильности на Ближнем Востоке США начали военное вмешательство в Ираке, ссылаясь на угрозу оружия массового поражения и необходимость покончить с авторитарными режимами. Как близкому союзнику по НАТО и стороннику международной безопасности Нидерландам предстоит решить, поддержать ли эту операцию. Миссия спорная, но вступление в коалицию подтвердило бы наше трансатлантическое партнёрство и усилило бы нидерландский голос в делах мировой безопасности."
 HOL_asml_partnership_USA: "Заключить технологическое партнёрство ASML — США"
 HOL_asml_partnership_USA_desc: "ASML стоит в сердце мировой полупроводниковой отрасли, и США стремятся закрепить своё технологическое превосходство в нарастающем расколе между Востоком и Западом. Создав стратегический союз нидерландских и американских исследовательских центров, мы сможем возглавить совместные разработки в передовой литографии, киберобороне и аэрокосмическом производстве. Это партнёрство укрепит наше положение в западной оборонной системе, но может обойтись дипломатическими издержками."
 HOL_lng_cooperation: "Заключить стратегическое соглашение Shell — СПГ"
 HOL_lng_cooperation_desc: "Энергетические вызовы XXI века требуют устойчивости, разнообразия источников и стратегических союзов. Расширив сотрудничество по сжиженному газу с Shell и увязав нашу энергетическую логистику с ключевыми партнёрами, мы обеспечим устойчивые поставки топлива, привлечём вложения в инфраструктуру и укрепим мировые цепочки снабжения. Однако усиление зависимости от ископаемого топлива может вызвать недовольство защитников природы и политические издержки."
 HOL_d66_climate_action_planidea: "Климатический план D66"
 HOL_d66_climate_action_planidea_desc: "Смело взявшись за борьбу с изменением климата, климатический план D66 ускоряет переход к возобновляемой энергетике, ставит во главу угла устойчивое развитие и снижает выбросы, выводя Нидерланды в число мировых лидеров в защите природы."
 HOL_shell1: "Royal Shell"
 HOL_shell1_desc: "Shell, официально Royal Dutch Shell, — многонациональная нефтегазовая компания со штаб-квартирой в Гааге и регистрацией в Великобритании. Основанная в 1907 году, Shell входит в число крупнейших энергетических компаний мира и занимается всеми сторонами нефтегазового дела: разведкой, добычей, переработкой и сбытом. У компании есть и заметные интересы в возобновляемой энергетике и зарядной инфраструктуре для электромобилей."
 HOL_shell2a: "Royal Green Shell"
 HOL_shell2a_desc: "Shell, мировой энергетический гигант, всё больше поворачивается к устойчивому будущему. Компания поставила смелую цель — стать энергетическим предприятием с нулевыми чистыми выбросами к 2050 году. Shell крупно вкладывается в возобновляемые источники: ветер, солнце и биотопливо — и расширяет присутствие в зарядной инфраструктуре для электромобилей. Через улавливание и хранение углерода Shell намерена заметно сократить свой углеродный след. Этот поворот к более зелёной энергетике — часть более широкой стратегии приспособления к растущему мировому спросу на чистые и устойчивые решения."
 HOL_shell2b: "Royal Shell"
 HOL_shell2b_desc: "Shell, одна из крупнейших нефтегазовых компаний мира, остаётся главной силой в отрасли ископаемого топлива. Обширная сеть её работ охватывает разведку, добычу, переработку и сбыт, и Shell играет важнейшую роль в покрытии мировых энергетических нужд. У компании огромные запасы и инфраструктура для добычи нефти и природного газа, дающие немалую долю мирового потребления энергии. Несмотря на растущие вложения в возобновляемую энергетику, основа её дела по-прежнему держится на ископаемом топливе, что делает Shell ключевым участником нынешнего энергетического ландшафта."
 HOL_dutch_trade1: "Легендарные торговцы"
 HOL_dutch_trade1_desc: "У нидерландских купцов долгая и славная история: они играли ключевую роль в мировой торговле со времён золотого века XVII столетия. Благодаря выгодному положению и обширной сети портов Нидерланды веками оставались узлом международной торговли. Нидерландские купцы прокладывали мировые торговые пути, прежде всего через Ост-Индскую компанию (VOC), одну из первых в мире многонациональных корпораций. И сегодня они сохраняют влияние на мировом рынке, особенно в сельском хозяйстве, логистике и финансах. Нидерландских торговцев знают за умение выстраивать логистику, новшества в управлении цепочками поставок и прочные международные связи, которые поддерживают за страной славу ключевого участника мировой торговли."
 HOL_project_beethoven_state_idea1: "Проект «Бетховен»"
 HOL_project_beethoven_state_idea1_desc: "«Проект Бетховен» — крупное начинание нидерландского правительства вместе с властями областей, направленное на улучшение делового климата и инфраструктуры для микрочиповой отрасли в Brainport Eindhoven. Проект призван укрепить мировую конкурентоспособность края в полупроводниковой технике, решая важнейшие задачи: подготовку кадров, развитие инфраструктуры и обеспечение жильём. Эти вложения считаются необходимыми, чтобы сохранить за Нидерландами место ведущего средоточия высоких технологий и, в частности, удержать в стране таких ключевых игроков, как ASML."
 HOL_randstad_economy1: "Randstad Economie"
 HOL_randstad_economy1_desc: "Экономика Рандстада — хозяйственное сердце Нидерландов, охватывающее густонаселённую городскую область вокруг Амстердама, Роттердама, Гааги и Утрехта. Этот край — один из важнейших хозяйственных узлов Европы, дающий весомую долю нидерландской экономики. Рандстад отличается разнообразием отраслей: финансы, логистика, технологии, творческие индустрии и торговля. Амстердам служит крупным финансовым центром, а в Роттердаме находится один из крупнейших портов мира, без которого немыслима международная торговля. Краю помогают также высококвалифицированные работники, развитая инфраструктура и упор на новшества и бережность к природе, что делает его важнейшим движителем роста нидерландского хозяйства."
 HOL_zuidas_development_idea: "Застройка Зёйдаса"
 HOL_zuidas_development_idea_desc: "Застройка Зёйдаса — масштабный градостроительный проект в Амстердаме, призванный создать живой деловой квартал смешанного назначения, международный центр торговли, финансов и юридических услуг. Зёйдас, который часто называют финансовой милей Нидерландов, стал домом для множества транснациональных корпораций, юридических фирм и финансовых учреждений. Задуман он не только как деловой центр: здесь обширные жилые кварталы, культурные учреждения, зелёные зоны и качественная инфраструктура, включая прекрасное транспортное сообщение."
 HOL_international_peace_city_idea: "Гаага — международный город мира и правосудия"
 HOL_international_peace_city_idea_desc: "Гаага признана во всём мире городом мира и правосудия — это звание отражает её роль мирового средоточия международного права и дипломатии. В Гааге работают более 200 международных организаций, включая Международный суд ООН, Международный уголовный суд и Постоянную палату третейского суда. Эти учреждения играют важнейшую роль в разрешении международных споров, преследовании за военные преступления и продвижении прав человека по всему миру."
 HOL_regio_economy1: "Economie van de Provinciën"
 HOL_regio_economy1_desc: "Хозяйственную мощь Нидерландов всё больше питают сильные стороны их областей. На севере провинции вроде Гронингена преуспели в возобновляемой энергетике, а восточные, такие как Гелдерланд, стали узлами передового производства и логистики. Южные провинции, включая Северный Брабант, ведут в высоких технологиях — полупроводниках и биотехнологиях. Это разнообразие обеспечивает стране уравновешенную и стойкую экономику, где каждая область вносит весомый вклад в общее благополучие и конкурентоспособность."
 HOL_marine_moving: "Переезд морской пехоты"
 HOL_marine_moving_desc: "Нидерландское правительство решило перевести Korps Mariniers с нынешней базы в Дорне на новую во Флиссингене. Этот переезд должен был дать морским пехотинцам современную инфраструктуру и расширить их возможности. Выбор Флиссингена в провинции Зеландия был призван также подстегнуть развитие области и дать морской пехоте выгодное положение у Северного моря. Однако план столкнулся с сопротивлением из-за опасений за личный состав и их семьи, а также из-за тыловых и финансовых сложностей."
 HOL_marine_moved: "Современная база морской пехоты"
 HOL_marine_moved_desc: "Переезд Korps Mariniers на новую базу во Флиссингене успешно завершён. Теперь морские пехотинцы работают в современных условиях, заметно повысивших их боеготовность. Новое место во Флиссингене даёт стратегические выгоды, включая быстрый выход в Северное море для морских операций. Переезд помог и росту хозяйства Зеландии, создав рабочие места и привлёкши в область вложения. Несмотря на первоначальные трудности и сопротивление на этапе планирования, переход прошёл гладко, и морские пехотинцы хорошо освоились на новом месте."
 HOL_marine_debate: "Спор о переезде морской пехоты"
 HOL_marine_debate_desc: "Переезд морской пехоты обсуждается в парламенте, что затягивает дело и порождает неопределённость в вооружённых силах."
 HOL_marine_public_support: "Общественная поддержка переезда морской пехоты"
 HOL_marine_public_support_desc: "Правительство и общество поддерживают переезд морской пехоты во Флиссинген, что поднимает её боевой дух и отдачу."
 HOL_marine_relocation_cancelled: "Переезд морской пехоты отменён"
 HOL_marine_relocation_cancelled_desc: "План переезда морской пехоты во Флиссинген отменён. Это решение возвращает устойчивость, но снижает возможности морской пехоты."
 HOL_local_communities_support: "Поддержка переезда местными жителями"
 HOL_local_communities_support_desc: "Вложения в общины вокруг Флиссингена повысили общественную поддержку переезда морской пехоты, подстегнув местный рост хозяйства и производственные возможности."
 HOL_marine1: "Koninklijke Marine"
 HOL_marine1_desc: "Koninklijke Marine, или Королевский флот Нидерландов, — военно-морской вид нидерландских вооружённых сил и один из старейших флотов мира, чьи истоки уходят в XV век. Он играет важнейшую роль в обороне Нидерландов дома и за рубежом и участвует в самых разных международных миссиях, включая операции НАТО, миротворчество и гуманитарную помощь. Королевский флот Нидерландов известен современным и универсальным составом: фрегатами, подводными лодками, патрульными и десантными кораблями. Флот располагает также самолётами и вертолётами — прежде всего для морского патрулирования, перевозок и поисково-спасательных работ. Korps Mariniers, отборная морская пехота Нидерландов, — неотъемлемая часть флота, которая специализируется на десантных операциях и быстром реагировании."
 HOL_submarine_modernization_idea: "Обновление подводных лодок"
 HOL_submarine_modernization_idea_desc: "Обновление подводных лодок — ключевое начинание Королевского флота Нидерландов, нацеленное на стареющие лодки типа Walrus. Обновление включает современные гидроакустические комплексы, улучшенную малозаметность и усиленное вооружение, чтобы лодки оставались действенными в современной войне на море. Оно призвано продлить срок их службы и сохранить их стратегическую значимость в обеспечении морской безопасности."
 HOL_cmp_idea: "Commissariaat Militaire Productie"
 HOL_cmp_idea_desc: "Commissariaat Militaire Productie (CMP), или Комиссариат военного производства, — нидерландское государственное ведомство, созданное для надзора за производством военной техники и припасов и его согласования. Его главной задачей было обеспечить нидерландские вооружённые силы всем необходимым, особенно во время конфликтов или повышенной военной готовности. CMP вёл договоры с отечественной промышленностью, регулировал выпуск оружия, боеприпасов, техники и прочих военных нужд и следил, чтобы всё это производилось по установленным требованиям и в срок."
 HOL_army2: "Королевская армия Нидерландов"
 HOL_army2_desc: "Koninklijke Landmacht, или Королевская армия Нидерландов, — сухопутный вид нидерландских вооружённых сил, чьи корни уходят в XVI век. Она отвечает за оборону нидерландской территории и участвует в международных миссиях, в том числе миротворческих операциях НАТО и ООН. Армия оснащена современной техникой, артиллерией и системами связи. Королевская армия Нидерландов — универсальная сила, готовая отвечать на самые разные вызовы безопасности дома и за рубежом."
 HOL_defensienota_idea: "Defensienota 2022"
 HOL_defensienota_idea_desc: "Defensienota 2022 — программный документ, определяющий будущее направление и приоритеты министерства обороны Нидерландов. Он отвечает на перемены в мировой обстановке безопасности и подчёркивает нужду в более сильной и гибкой армии. Главные его темы — рост оборонных расходов, обновление военных возможностей и расширение международного сотрудничества, прежде всего в рамках НАТО и Европейского союза. В документе выделены вложения в кибероборону, разведку и передовые технологии, а также увеличение численности и уровня готовности. Defensienota 2022 призван обеспечить готовность нидерландских вооружённых сил отвечать на нынешние и будущие угрозы, служа и национальной безопасности, и устойчивости в мире."
 HOL_air: "Королевские ВВС Нидерландов"
 HOL_air_desc: "Koninklijke Luchtmacht, или Королевские военно-воздушные силы Нидерландов, — воздушный вид нидерландских вооружённых сил, отвечающий за защиту воздушного пространства страны и поддержку национальных и международных операций. Созданные в 1953 году, ВВС располагают современным парком: истребителями, транспортными самолётами, вертолётами и беспилотниками (БПЛА). Они играют важнейшую роль в миссиях НАТО, воздушном патрулировании и быстром развёртывании сил. Koninklijke Luchtmacht участвуют также в оказании гуманитарной помощи и ликвидации последствий бедствий и обеспечивают безопасность заморских территорий Нидерландов. Благодаря передовой технике и отлично подготовленному личному составу Королевские ВВС Нидерландов остаются ключевой частью оборонной стратегии страны."
 HOL_dutch_army_doctrine1: "Nederlandse Defensievisie"
 HOL_dutch_army_doctrine1_desc: "Nederlandse Defensievisie — программный документ, излагающий долгосрочное видение и цели министерства обороны Нидерландов. Он задаёт рамки развития и приспособления нидерландских вооружённых сил к будущим вызовам безопасности. Defensievisie сосредоточен на том, чтобы сделать армию гибче, стойче и технически сильнее в ответ на всё более сложную и непредсказуемую обстановку в мире."
 HOL_dutch_army_doctrine_change: "Nederlandse Defensievisie Transitie"
 HOL_dutch_army_doctrine_change_desc: "Национальный дух Nederlandse Defensievisie Transitie обозначает переломный этап преобразований нидерландских вооружённых сил. Это время обновления и приспособления, когда создаются новые возможности, укрепляется кибероборона и расширяется международное сотрудничество. Этот национальный дух подчёркивает стремление сделать армию стойче и гибче и подготовить её к вызовам XXI века. Он воплощает общее усилие привести нидерландскую оборону в соответствие с меняющимися нуждами мировой безопасности, уравновешивая традицию новшествами."
 HOL_marechaussee1: "Koninklijke Marechaussee"
 HOL_marechaussee1_desc: "Koninklijke Marechaussee, Королевская военная полиция Нидерландов, играет важнейшую роль в обеспечении безопасности страны и правопорядка. Отвечая за пограничный контроль, безопасность аэропортов и военную полицию, Marechaussee обеспечивает безопасность и устойчивость Нидерландов дома и за рубежом. Её опыт в вопросах внутренней безопасности, миграции и общественного порядка делает её незаменимой в нидерландской оборонной системе. Прекрасно обученная и легко приспосабливающаяся, она поддерживает и гражданские, и военные операции, укрепляя стойкость страны в трудные времена."
 HOL_paars1: "Правление «пурпурного» кабинета кончается"
 HOL_paars1_desc: "Наследие кабинета Paars II — это новшества, прагматизм и взвешенное управление, отражающие пёстрый политический ландшафт Нидерландов и задающие образец для будущих коалиционных правительств."
 HOL_dbb: "Служба охраны и безопасности"
 HOL_dbb_desc: "Служба охраны и безопасности (Dienst Bewaken en Beveiligen, DBB) — основа защиты самых видных людей страны и её важнейших объектов. Отвечая за охрану политических руководителей, членов королевской семьи и особо важных мест, DBB работает с исключительной бдительностью и выучкой."
 HOL_debt_reduction: "Сокращение долга"
 HOL_debt_reduction_desc: "Под руководством Геррита Залма VVD проводит ответственную бюджетную политику через целенаправленное сокращение долга, укрепляя экономику и обеспечивая долгосрочную финансовую устойчивость."
 HOL_liberal_society_modifier: "Либеральное общество"
 HOL_economy_education_research: "Реформа образования под нужды рынка"
 HOL_economy_education_research_desc: "VVD стремится увязать учебные программы с запросами рынка, чтобы дать студентам востребованные умения. Сокращая разрыв между образованием и рынком труда, мы повышаем шансы выпускников на работу и подстёгиваем рост экономики, а будущие поколения выходят подготовленными к постоянно меняющемуся рынку труда."
 HOL_ministry_of_family1: "Министерство по делам семьи"
 HOL_ministry_of_family1_desc: "Министерство по делам семьи заботится о благополучии семей по всем Нидерландам. Оно разрабатывает и проводит меры, касающиеся присмотра за детьми, родительских отпусков и поддержки семей, обеспечивая им доступ к нужным ресурсам. Министерство стремится создать заботливую среду, в которой дети растут здоровыми, а семейные узы крепнут."
 HOL_weed_center1: "Голландская политика в отношении каннабиса"
 HOL_weed_center1_desc: "Нидерланды известны своим особым подходом к каннабису: хранение и продажа в лицензированных «кофешопах» допускаются при строгих ограничениях. Эта прагматичная политика призвана развести рынки лёгких и тяжёлых наркотиков и снизить преступность. Формально каннабис остаётся вне закона, но для личного употребления фактически декриминализован — компромисс между здоровьем и безопасностью общества и личной свободой."
 HOL_unhcr1: "Надзор УВКБ ООН за миграцией"
 HOL_unhcr1_desc: "Управление Верховного комиссара ООН по делам беженцев (УВКБ) теперь ведает миграционной политикой и процедурами, которыми прежде занимались Нидерланды. Этот переход призван обеспечить соблюдение международных требований к защите и поддержке беженцев и мигрантов и дать более согласованный и человечный подход к мировым миграционным вызовам."
 HOL_balkenende_legend: "Наследие Балкененде"
 HOL_balkenende_legend_desc: "Годы Яна Петера Балкененде на посту премьер-министра отмечены упором на сплочённость общества, ответственность и хозяйственную устойчивость. Его представление об обществе «normen en waarden» («норм и ценностей») было призвано укрепить нравственные основы Нидерландов. Наследие Балкененде по-прежнему влияет на нидерландскую политику, продвигая взвешенный подход к управлению, где ценятся и общность, и личная ответственность."
 HOL_green_socialism1: "Зелёный социализм"
 HOL_green_socialism1_desc: "PvdA видит будущее, где социальная справедливость и бережное отношение к природе идут рука об руку. Зелёный социализм отстаивает справедливое и равное общество, где во главу угла поставлено благополучие и людей, и планеты. Через смелую климатическую политику, вложения в возобновляемую энергетику и справедливый переход для работников PvdA стремится построить устойчивую экономику, в которой никто не останется за бортом."
 HOL_monarchy_law_blocking: "Возмездие монарха"
 HOL_monarchy_law_blocking_desc: "Возмущённая отказом правительства одобрить королевский брак, монархия пошла на небывалый шаг и в отместку блокирует ключевые законы. Этот вызов погрузил политику в хаос: королевская семья использует своё влияние, чтобы оспорить власть правительства. Напряжение растёт, и это беспрецедентное вмешательство развязало в стране спор о роли и власти монархии в современном управлении."
 HOL_monarch_public_campaign: "Волна общественной поддержки"
 HOL_monarch_public_campaign_desc: "В ответ на отказ правительства одобрить королевский брак поднялась мощная кампания общественного давления. По всей стране граждане встают на сторону королевской четы, устраивают демонстрации, подписывают петиции и требуют от правительства пересмотреть свою позицию. Эта волна поддержки легла тяжким грузом на политиков и показала преданность народа монархии и желание, чтобы право на любовь и брак стояло выше политики."
 HOL_monarch_backlash: "Разочарование общества"
 HOL_monarch_backlash_desc: "Решение королевской четы заключить брак вопреки отказу правительства вызвало волну общественного недовольства. Многие видят в этом выход монархии за свои пределы и пренебрежение демократическими процедурами. Ответ последовал быстро: граждане усомнились в надобности монархии в современном обществе. Призывы к реформе и даже к упразднению набирают вес по мере того, как доверие к королевской семье тает."
 HOL_pro_gay_marriage: "Первая страна, признавшая однополые браки"
 HOL_pro_gay_marriage_desc: "Легализовав однополые браки, Нидерланды вышли в мировые лидеры общественного прогресса и прав человека. Этот шаг укрепил образ страны как терпимого и открытого общества, подняв и народное единство, и международный вес."
 HOL_anti_gay_marriage: "Закон о традиционном браке"
 HOL_anti_gay_marriage_desc: "Решение сохранить традиционное брачное законодательство отражает твёрдую приверженность консервативным ценностям. Находя отклик у религиозных и традиционалистских групп, оно вызвало и критику более прогрессивных голосов и сказалось на репутации страны как оплота либерализма в Европе."
 HOL_labour_market_reforms_idea: "Реформы рынка труда"
 HOL_labour_market_reforms_idea_desc: ""
 HOL_strong_social_security: "Крепкая социальная защита"
 HOL_strong_social_security_desc: ""
 HOL_poverty_reduction_idea: "Курс на сокращение бедности"
 HOL_poverty_reduction_idea_desc: "Нидерланды запустили всеобъемлющую программу борьбы с бедностью. Через рост социальных выплат, адресную поддержку уязвимых слоёв и хозяйственную помощь государство старается поднять самых обездоленных членов общества. Эта программа призвана сделать экономику справедливее и доступнее для всех."
 HOL_poverty_reduced: "Бедность заметно сократилась"
 HOL_poverty_reduced_desc: "Благодаря успешному проведению социальных программ и реформ бедность в Нидерландах заметно сократилась. Упор страны на хозяйственную открытость и поддержку обездоленных дал больше общественной устойчивости, более высокий уровень жизни и более крепкую экономику."
 HOL_digital_literacy_idea: "Кампания цифровой грамотности"
 HOL_digital_literacy_idea_desc: "Нидерланды запустили общенациональную кампанию по повышению цифровой грамотности во всех слоях общества. Давая гражданам навыки, нужные для жизни в цифровую эпоху, государство обеспечивает работникам готовность к техническим переменам, что повышает производительность и питает новшества в экономике."
 HOL_economic_resilience_idea: "Курс на хозяйственную устойчивость"
 HOL_economic_resilience_idea_desc: "Нидерландское правительство приняло всеобъемлющие меры, чтобы сделать экономику устойчивее к мировым кризисам. Разнообразя отрасли, поддерживая малый бизнес и обеспечивая надёжную социальную защиту, Нидерланды лучше готовы пережить будущие испытания и сохранить хозяйственную устойчивость."
 HOL_financial_sector_idea: "Реформа финансового сектора"
 HOL_financial_sector_idea_desc: "Всеобъемлющие реформы финансового сектора необходимы, чтобы предотвратить будущие кризисы и добиться прозрачности и подотчётности. Под руководством Ваутера Боса мы будем действенно регулировать финансовую отрасль, обеспечив устойчивость и доверие на рынке. Эти реформы создадут более стойкую экономику, способную выдержать мировые потрясения, и снизят риск хозяйственного обвала."
 HOL_afriforum1HOL: "Партнёрство с африканерами и их защита"
 HOL_afriforum1HOL_desc: "Нидерланды углубили отношения с африканерской общиной Южной Африки, предложив ей экономическую поддержку и обязавшись защищать африканерское культурное и языковое наследие. Это партнёрство обеспечивает доступ к ресурсам и вместе с тем знаменует обновлённую связь, укоренённую в общей истории и взаимном уважении."
 HOL_afriforum1SAF: "Нидерландско-африканерский союз"
 HOL_afriforum1SAF_desc: "Африканерская община укрепила союз с Нидерландами, что способствует сохранению культуры, экономическому сотрудничеству и созданию сети поддержки. Благодаря нидерландскому влиянию африканеры обретают союзника в стремлении сберечь свою самобытность и хозяйственную самостоятельность внутри Южной Африки."
 HOL_fatherland_education_idea: "Отечественное воспитание"
 HOL_fatherland_education_idea_desc: "«Отечественное воспитание» нацелено на то, чтобы привить молодёжи чувство гордости за страну, причастности к наследию и ответственности. Делая упор на нидерландскую историю, ценности и культуру в учебных программах, мы хотим воспитать крепкое и сплочённое гражданское общество, способное беречь и отстаивать наши традиции и национальную самобытность."
 HOL_stadtholderate1: "Правление штатгальтера"
 HOL_stadtholderate1_desc: "Нидерландский штатгальтер ведёт страну в обновлённую пору управления, уравновешивая начала монархии традициями демократии. Делая упор на местное самоуправление и конституционную реформу, штатгальтер стремится объединить Нидерланды вокруг замысла свободы, прогресса и твёрдого руководства."
 HOL_monarchy1: "Корона и страна едины"
 HOL_monarchy1_desc: "Нидерланды приняли своё королевское наследие, и монархия стоит опорой национальной самобытности и устойчивости. Под присмотром короны страна движется вперёд, взращивая гордость за свою культуру и обеспечивая крепкое, единое правление на благо своего народа."
 HOL_voc_semiconductor_control_HOL: "Контроль над полупроводниковой отраслью §Y[TAI.GetNameWithFlag]§!"
 HOL_voc_semiconductor_control_HOL_desc: "Через продуманные вложения и партнёрства Нидерланды получили власть над вожделенной полупроводниковой отраслью Тайваня. В сердце этого господства — передовая литография ASML, и теперь нидерландцы держат в руках мировое производство полупроводников, обеспечив себе решающее преимущество в нынешнюю технологическую эпоху."
 HOL_voc_semiconductor_control_TAI: "[HOL.GetAdjective] власть над полупроводниковой отраслью Тайваня"
 HOL_voc_semiconductor_control_TAI_desc: "Полупроводниковая отрасль Тайваня, кровь его экономики, перешла под [HOL.GetAdjective] контроль. Эта перемена, достигнутая технологическим рычагом ASML и хозяйственным давлением VOC, угрожает самостоятельности Тайваня в важнейшей для него отрасли и отдаёт его будущее в чужие руки."
 HOL_sri_dutch_agriculture_benefits: "Нидерландское партнёрство в сельском хозяйстве"
 HOL_sri_dutch_agriculture_benefits_desc: "Благодаря сотрудничеству с Нидерландами Шри-Ланка получила доступ к современным приёмам земледелия и ресурсам, что подняло производство продовольствия и рост хозяйства по всей стране."
 HOL_sri_agriculture_collaboration: "Сотрудничество со Шри-Ланкой в сельском хозяйстве"
 HOL_sri_agriculture_collaboration_desc: "Поделившись нидерландским опытом в сельском хозяйстве со Шри-Ланкой, Нидерланды закрепились в важном для себя крае, усилив влияние и восстановив связь с этой исторической территорией."
 HOL_voc_indonesian_focus: "VOC: упор на Индонезию"
 HOL_voc_indonesian_focus_desc: "Воссозданная VOC нацелилась вернуть себе главенство в Индонезии, сердце своей прежней империи. Сосредоточившись на оживлении хозяйства, стратегическом контроле и взращивании местного влияния, эта цель призвана вновь утвердить нидерландскую власть в крае и закрепить за нами его богатства."
 HOL_voc_penalty_operation_extension: "Издержки затягивания операции"
 HOL_voc_penalty_operation_extension_desc: "Продлив операции в Индонезии вместо объявления войны, мы оттянули решительные действия, что вызвало политическое напряжение, снизило устойчивость и ударило по слаженности промышленности."
 HOL_voc_ambassy_expansion_ind: "Расширить посольство Нидерландов в Индонезии"
 HOL_voc_ambassy_expansion_ind_desc: "Расширение нидерландского посольства в Индонезии — продуманный шаг, позволяющий углубить дипломатические связи, усилить влияние и облегчить тайные операции. Нарастив присутствие, мы лучше подготовимся к будущим начинаниям в этом крае."
 HOL_d66_democratic_institutions_idea: "Укреплённые демократические институты"
 HOL_d66_democratic_institutions_idea_desc: "Усилия по укреплению демократических процедур повысили доверие общества к власти. Благодаря большей прозрачности, подотчётности и участию граждан Нидерланды стали образцом современной дееспособной демократии."
 HOL_gl_affordable_housing_plan_idea: "Курс на доступное жильё"
 HOL_gl_affordable_housing_plan_idea_desc: "Благодаря крупным вложениям в устойчивое и доступное жильё Нидерланды берутся за жилищный кризис всерьёз. Это начинание обеспечивает каждому гражданину надёжный, безопасный и бережный к природе дом."
 HOL_gl_international_solidarity_idea: "Международная солидарность"
 HOL_gl_international_solidarity_idea_desc: "GroenLinks выстроила прочные международные партнёрства для решения общемировых задач. Продвигая мир, права человека и устойчивое развитие, Нидерланды стали маяком сотрудничества и прогресса на мировой сцене."
 HOL_gl_transparent_government_idea: "Прозрачное управление"
 HOL_gl_transparent_government_idea_desc: "Неуклонно держась подотчётности и открытости, GroenLinks добилась прозрачной работы власти, и граждане могут доверять своему руководству и участвовать в делах страны."
 HOL_gl_diversify_workforce_idea: "Разнообразный состав работников"
 HOL_gl_diversify_workforce_idea_desc: "Через политику открытости и программы равных возможностей GroenLinks взрастила рабочую среду, отражающую разнообразие и силу нидерландского общества, и обеспечила справедливость и новшества в каждой отрасли."
 HOL_gl_fair_trade_idea: "Коалиционное соглашение о справедливой торговле"
 HOL_gl_fair_trade_idea_desc: "В рамках коалиционного соглашения с GroenLinks правительство обязалось принять новые правила международной торговли. Под влиянием прогрессивной повестки GroenLinks торговая политика ставит экологическую ответственность, права трудящихся и социальную справедливость выше чистой прибыли. Это явный отход от прежних рыночных моделей к экономике, построенной на ценностях."
 HOL_d66_rule_of_law_idea: "Защита верховенства права"
 HOL_d66_rule_of_law_idea_desc: "D66 добилась ключевых правовых реформ в рамках коалиционного соглашения, вновь подтвердив независимость суда, прозрачность управления и строгое следование конституционным нормам. В пору популистского давления и политической раздробленности эти меры призваны уберечь демократические институты и верховенство права дома и за рубежом."
 HOL_asml1: "ASML"
 HOL_asml1_desc: "Первенство ASML в литографии ставит Нидерланды в сердце мировой микрочиповой отрасли. Это господство ускоряет наши исследования в вычислительной технике и производстве чипов, а экспорт полупроводников превращает в постоянный источник доходов страны."
 HOL_caribbean_naval_cooperation: "Совместное карибское военно-морское сотрудничество"
 HOL_caribbean_naval_cooperation_desc: "Совместная карибская военно-морская программа укрепляет наш флот и позволяет согласованно вести подготовку, морское патрулирование и оборонное планирование вместе с Королевским флотом Нидерландов."
 HOL_asml_USA_tech_partnership: "Пакт о технологической интеграции ASML — США"
 HOL_asml_USA_tech_partnership_desc: "Нидерланды и США вступили в стратегическое партнёрство высокого уровня вокруг полупроводниковых разработок, киберобороны и точного производства. В сердце этого сотрудничества — нидерландская ASML, дающая нам передовое преимущество в исследованиях и промышленном выпуске. Однако более тесное сращивание с американской технологической инфраструктурой усилило нашу зависимость от экспортной политики США и осложнило торговые связи с внеблоковыми державами."
 HOL_shell_lng_deal: "Стратегическое энергетическое соглашение Shell — СПГ"
 HOL_shell_lng_deal_desc: "Заключив всеобъемлющий энергетический пакт с международными партнёрами, Shell обеспечила Нидерландам доступ к инфраструктуре сжиженного газа, морской добыче топлива и мировым энергетическим коридорам. Это укрепляет нашу хозяйственную устойчивость и цепочки поставок. Но продолжение вложений в ископаемое топливо вызывает критику дома и ограничивает наши возможности для высокотехнологичных новшеств в других отраслях."
 HOL_strengthening_eurozone_idea: "Укрепление еврозоны"
 HOL_strengthening_eurozone_idea_desc: ""
 HOL_social_democratic_modifier: "Социальное и демократическое общество"
 HOL_economy: "Нидерландская экономика"
 HOL_economy_desc: "От кранов Роттердама до теплиц Вестланда и чистых комнат Брайнпорта нидерландская экономика процветает как один из великих торговых перекрёстков Европы. Века торговли, отвоёванной у моря земли и неустанных новшеств выковали открытую, живущую экспортом державу, охватывающую сельское хозяйство, логистику, энергетику, финансы и высокие технологии, где каждое новое начинание прибавляет силы всему целому."
 HOL_cmp: "Commissariaat Militaire Productie"
 HOL_cmp_desc: "Commissariaat Militaire Productie (CMP), или Комиссариат военного производства, — нидерландское государственное ведомство, созданное для надзора за производством военной техники и припасов и его согласования. Его главной задачей было обеспечить нидерландские вооружённые силы всем необходимым, особенно во время конфликтов или повышенной военной готовности. CMP вёл договоры с отечественной промышленностью, регулировал выпуск оружия, боеприпасов, техники и прочих военных нужд и следил, чтобы всё это производилось по установленным требованиям и в срок."
 HOL_noordzee_parken: "Noordzee Energiepark"
 HOL_army: "Королевская армия Нидерландов"
 HOL_army_desc: "Koninklijke Landmacht, или Королевская армия Нидерландов, — сухопутный вид нидерландских вооружённых сил, чьи корни уходят в XVI век. Она отвечает за оборону нидерландской территории и участвует в международных миссиях, в том числе миротворческих операциях НАТО и ООН. Армия оснащена современной техникой, артиллерией и системами связи. Королевская армия Нидерландов — универсальная сила, готовая отвечать на самые разные вызовы безопасности дома и за рубежом."
 HOL_navy: "Королевский флот Нидерландов"
 HOL_navy_desc: "Koninklijke Marine, или Королевский флот Нидерландов, — военно-морской вид нидерландских вооружённых сил. Он оберегает морские интересы страны, проецирует силу за рубежом и тесно работает с флотами союзников. Этот модификатор отражает совокупность решений по доктрине, подготовке и закупкам, принятых в военно-морской ветви дерева целей."
 HOL_economy.027.t: "Новый спонсор сельского клуба"
 HOL_economy.027.d: "Местный спортивный клуб представил новую форму, оплаченную соседним молочным фермером, чьи биореакторы теперь работают на городских органических отходах. Муниципалитет хочет отметить это событие."
 HOL_economy.027.a: "Софинансировать из городской казны"
 HOL_economy.027.b: "Оставить это делом самой общины"
 HOL_megaproject_category: "Национальные мегапроекты"
 HOL_megaproject_category_desc: "Крупные общенациональные начинания — от намыва земель до знаковых инфраструктурных строек, — открывающиеся по мере того, как Нидерланды осуществляют свою большую программу развития."
 HOL_space_program_category: "Нидерландская космическая программа"
 HOL_space_program_category_desc: "Национальная космическая программа, сводящая воедино средства выведения, спутники и замыслы полётов человека за пределы околоземной орбиты."
 HOL_future_air_defender_program: "Программа Future Air Defender"
 HOL_future_air_defender_program_desc: "Совместная военно-морская программа постройки фрегата ПВО Future Air Defender. Каждый участник ведёт постройку как задачу с установленным сроком; по её завершении готовые корабли сразу вступают в строй. Если Германия выйдет из проекта, Нидерланды смогут привлечь северные флоты, чтобы восполнить число кораблей и наверстать потерянное время."
 HOL_FAD_invite_partner: "Пригласить партнёра в программу"
 HOL_FAD_invite_partner_desc: "Пригласить один из северных флотов в программу Future Air Defender. Каждый присоединившийся партнёр получает два фрегата, добавляет ещё один к нидерландскому заказу и сокращает оставшийся срок постройки."
 HOL_military.089.a: "Утвердить дополнительный бюджет."
 HOL_military.089.b: "Оставить нынешнее финансирование."
 HOL_mars_invested_budget_tt: "§GДополнительные вложения ускоряют миссию и открывают прибавку к исследованиям в строительстве, когда будут изучены первые пробы грунта.§!"
 HOL_military.090.a: "Оплатить полное обновление программного обеспечения."
 HOL_military.090.b: "Принять обходное решение и задержку."
 HOL_military.091.a: "Расширить геологическую разведку."
 HOL_military.091.b: "Сначала собрать жилые модули."
 HOL_mars_chromium_found_tt: "§GГеологические партии нашли дополнительные залежи хрома под поверхностью Исиды.§!"
 HOL_military.092.a: "Немедленно чинить купол."
 HOL_military.092.b: "Загерметизировать отсек и работать дальше."
 HOL_mars_software_bonus_tt: "§GПолное обновление программного обеспечения чисто отработало стыковку. Высвободившуюся конструкционную сталь направят на усиленные фундаменты колонии.§!"
 HOL_military.088.a: "Назвать Холландерхавен."
 HOL_military.088.b: "Назвать Бринкердам."
 HOL_military.088.c: "Назвать Брандаанстад."
 HOL_military.088.e: "Назвать Браммертделф."
 HOL_mars_mining_colony_tt: "§GПервые добычные шахты Браммертделфа заложены и сразу дают партию сырья из марсианской коры.§!"
 HOL_monarchy.40.t: "Принцесса Оранская идёт на службу"
 HOL_monarchy.40.d: "Наследная принцесса Катарина-Амалия стала первой женщиной Оранского дома, надевшей мундир: она записалась в резерв и прошла общевойсковую подготовку. Её пример резко увеличил число желающих служить."
 HOL_monarchy.40.a: "Славный день для Оранского дома."
 HOL_monarchy.41.t: "Королева Максима вступает в резерв"
 HOL_monarchy.41.d: "Королева Максима записалась в резерв при Королевской военной академии в Бреде вслед за дочерью. Она заявила, что безопасность страны больше нельзя принимать как должное и что она хочет вносить в неё свой вклад наравне с любым гражданином."
 HOL_monarchy.41.a: "Корона — вместе с армией."
 HOL_politics.05.c: "Поддержать Риту Вердонк"
 HOL_politics.78.t: "Трения в кабинете"
 HOL_politics.78.d: "Герт Вилдерс схлестнулся с руководством VVD из-за иммиграции. Он требует куда более жёсткой линии, чем готовы принять его соратники, и ссора выплёскивается на публику."
 HOL_politics.78.a: "Поддержать жёсткую линию Вилдерса"
 HOL_politics.78.b: "Держаться умеренного курса"
 HOL_politics.79.t: "Турция у порога Европы"
 HOL_politics.79.d: "Вступление Турции в Европейский союз раскалывает партию. Вилдерс яростно против и предупреждает, что открытость руководства оттолкнёт избирателей VVD."
 HOL_politics.79.a: "Выступить против вступления Турции"
 HOL_politics.79.b: "Поддержать расширение ЕС"
 HOL_politics.80.t: "Черта на песке"
 HOL_politics.80.d: "Вилдерс схлестнулся с руководством из-за позиции партии по исламу и интеграции и настаивает на бескомпромиссной линии. Его терпение на исходе, и это видно."
 HOL_politics.80.a: "Занять бескомпромиссную позицию"
 HOL_politics.80.b: "Искать примирительный тон"
 HOL_politics.81.t: "Вилдерс остаётся"
 HOL_politics.81.d: "Пока Герт Вилдерс остаётся в VVD. Руководство сделало ровно столько, чтобы удержать беспокойного радикала внутри, и разрушительного раскола удалось избежать."
 HOL_politics.81.a: "Хрупкий мир держится"
 HOL_voc.1.t: "Предложение от Нидерландской Ост-Индской компании"
 HOL_voc.1.d: "Пока Индия погружается в гражданскую войну, [HOL.GetAdjectiveCap] правительство и возрождённая VOC выступили с неожиданным предложением. Они предлагают мирно передать индийские штаты под [HOL.GetAdjectiveCap] управление, ссылаясь на исторические связи и обещая устойчивость и благополучие под нидерландской властью. При этом они предупреждают: отказ вынудит Нидерланды вмешаться силой, что грозит более широкой войной и риском потерять при заключении мира ещё больше земель. Решение за вами."
 HOL_voc.1.a: "Согласиться на передачу. Устойчивость превыше всего."
 HOL_voc.1.b: "Отклонить предложение. Готовиться к войне с [HOL.GetAdjectiveCap]."
 HOL_voc.2.t: "[HOL.GetAdjectiveCap] захватывают Восточный Гуджарат"
 HOL_voc.2.d: "[HOL.GetAdjectiveCap] воспользовались смутой в Восточном Гуджарате и объявили этот штат своим. Они предлагают сотрудничество, но иначе — военное столкновение."
 HOL_voc.2.a: "Отомстить! Это акт войны!"
 HOL_voc.2.b: "Пока не действовать. [HOL.GetAdjectiveCap] могут надорваться."
 HOL_voc.3.t: "[HOL.GetAdjectiveCap] захватывают Западную Бенгалию"
 HOL_voc.3.d: "[HOL.GetAdjectiveCap] воспользовались смутой в Западной Бенгалии и установили власть над штатом. Примете ли вы их требования или станете готовиться к войне?"
 HOL_voc.3.a: "Отомстить! Это акт войны!"
 HOL_voc.3.b: "Пока не действовать. [HOL.GetAdjectiveCap] могут надорваться."
 HOL_voc.4.t: "[HOL.GetAdjectiveCap] захватывают Кералу"
 HOL_voc.4.d: "На фоне растущих волнений [HOL.GetAdjectiveCap] объявили своей Кералу, сославшись на историческое влияние в этом крае. Индии предстоит решить, договариваться или отвечать силой."
 HOL_voc.4.a: "Отомстить! Это акт войны!"
 HOL_voc.4.b: "Пока не действовать. [HOL.GetAdjectiveCap] могут надорваться."
 HOL_voc.5.t: "[HOL.GetAdjectiveCap] берут под контроль Тамилнад"
 HOL_voc.5.d: "[HOL.GetAdjectiveCap] воспользовались нестабильностью в Тамилнаде и расширили свою власть. Как Индия ответит на этот откровенный натиск?"
 HOL_voc.5.a: "Отомстить! Это акт войны!"
 HOL_voc.5.b: "Пока не действовать. [HOL.GetAdjectiveCap] могут надорваться."
 HOL_voc.6.t: "Нидерланды просят приостановить гарантии Тайваню"
 HOL_voc.6.d: "Нидерланды обратились к нам с просьбой приостановить наши гарантии безопасности Тайваню, сославшись на намерение забрать у острова часть земель. Согласимся ли мы на их требования?"
 HOL_voc.6.a: "Приостановить гарантию."
 HOL_voc.6.b: "Отклонить их просьбу."
 HOL_voc.6.c: "Приостановить, но потребовать возмещения."
 HOL_voc.7.t: "США согласились приостановить гарантии Тайваню"
 HOL_voc.7.d: "Соединённые Штаты согласились приостановить действие своих гарантий безопасности Тайваню, открыв Нидерландам путь к действиям против острова."
 HOL_voc.7.a: "Предъявить ультиматум."
 HOL_voc.8.t: "США отказались приостановить гарантии Тайваню"
 HOL_voc.8.d: "Соединённые Штаты отказались приостановить действие своих гарантий безопасности Тайваню, осложнив планы Нидерландов по давлению на остров."
 HOL_voc.8.a: "Мы пересмотрим нашу стратегию."
 HOL_voc.9.t: "Ультиматум Нидерландов Тайваню"
 HOL_voc.9.d: "Нидерланды предъявили Тайваню ультиматум, требуя передать [599.GetName] и [1157.GetName]. Как мы ответим?"
 HOL_voc.9.a: "Принять их требования."
 HOL_voc.9.b: "Попросить поддержки у [USA.GetName]."
 HOL_voc.9.c: "Уступить территории, но пусть защиту обеспечат [HOL.GetName]"
 HOL_voc.10.t: "Земли отобраны у Тайваня"
 HOL_voc.10.d: "[TAI.GetAdjectiveCap] правительство приняло наш ультиматум и передало власть над требуемыми землями. Это крупная победа VOC и Нидерландов: наше влияние в крае закрепилось, а охват в Азии вырос."
 HOL_voc.10.a: "Превосходно. Мощь VOC растёт."
 HOL_voc.11.t: "Тайвань просит [USA.GetAdjectiveCap] поддержки"
 HOL_voc.11.d: "Тайвань попросил [USA.GetAdjectiveCap] поддержки, чтобы противостоять [HOL.GetAdjectiveCap] требованиям. Что мы ответим?"
 HOL_voc.11.a: "Надавить на Тайвань, чтобы уступил."
 HOL_voc.11.b: "Поддержать суверенитет Тайваня."
 HOL_voc.12.t: "США давят на Тайвань, требуя уступить"
 HOL_voc.12.d: "Под [USA.GetAdjectiveCap] давлением Тайваню предстоит решить: уступить нидерландским требованиям или сопротивляться, рискуя войной."
 HOL_voc.12.a: "Уступить [HOL.GetAdjectiveCap] требованиям."
 HOL_voc.12.b: "Противостоять [HOL.GetAdjectiveCap] натиску в одиночку."
 HOL_voc.13.t: "Тайвань отвергает наш ультиматум"
 HOL_voc.13.d: "При поддержке США Тайвань наотрез отверг наш ультиматум. Этот вызов ставит нас перед важным выбором: отступить, чтобы не обострять дело, или идти дальше, рискуя открытой войной с Тайванем и его союзниками."
 HOL_voc.13.a: "Отозвать ультиматум. Риск слишком велик."
 HOL_voc.13.b: "Не отступать от ультиматума. Война неизбежна."
 HOL_voc.14.t: "Тайвань отвергает наш ультиматум"
 HOL_voc.14.d: "Тайвань наотрез отверг наши требования и отказался уступать земли. После такого вызова нам остаётся лишь объявить войну и утвердить нидерландскую власть силой."
 HOL_voc.14.a: "Война — единственный ответ!"
 HOL_voc.15.t: "Тайвань соглашается уступить земли в обмен на защиту"
 HOL_voc.15.d: "Неожиданный поворот: Тайвань согласился передать Нидерландам требуемые земли, но лишь при условии, что нидерландцы возьмут его под защиту от будущих угроз. Это соглашение усиливает нидерландское влияние в Азии, но и накладывает на нас большую ответственность в крае."
 HOL_voc.15.a: "Мы принимаем их условия и берём Тайвань под защиту."
 HOL_voc.16.t: "США требуют возмещения за Тайвань"
 HOL_voc.16.d: "Позволив нам взять тайваньские земли, США теперь требуют возмещения за приостановленную защиту. Они уверяют, что их геополитические интересы в крае пострадали. Можно согласиться заплатить и сохранить ровные отношения — или отказаться и рискнуть столкновением с американцами."
 HOL_voc.16.a: "Заплатить и сохранить устойчивость."
 HOL_voc.16.b: "Отвергнуть их требование и готовиться к войне."
 HOL_voc.17.t: "Нидерланды предлагают сотрудничество в сельском хозяйстве"
 HOL_voc.17.d: "Нидерланды предложили нам вместе обновить наше сельское хозяйство. Они готовы поделиться опытом и средствами, чтобы улучшить продовольственную безопасность и хозяйственные показатели Шри-Ланки. Однако у такого партнёрства могут быть свои условия, и нидерландское влияние в крае способно вырасти."
 HOL_voc.17.a: "Принять сотрудничество. Их опыт нам нужен."
 HOL_voc.17.b: "Отказаться. Шри-Ланка должна стоять сама."
 HOL_voc.18.t: "Шри-Ланка принимает сотрудничество в сельском хозяйстве"
 HOL_voc.18.d: "Шри-Ланка приняла наше предложение о совместном развитии сельского хозяйства. Это новая глава в нидерландско-ланкийских отношениях: наше влияние крепнет, а выгода обоюдна."
 HOL_voc.18.a: "Многообещающее партнёрство!"
 HOL_voc.19.t: "Шри-Ланка отказывается от сотрудничества в сельском хозяйстве"
 HOL_voc.19.d: "Шри-Ланка отклонила наше предложение о сотрудничестве в сельском хозяйстве. Их нежелание работать с Нидерландами может замедлить развитие края и ослабить наше влияние."
 HOL_voc.19.a: "Досадно, но надо двигаться дальше."
 HOL_voc.20.t: "Нидерланды предлагают вложения"
 HOL_voc.20.d: "Нидерланды предложили программу вложений в сельское хозяйство, чтобы поднять экономику и производство продовольствия Шри-Ланки. Программа имеет три уровня — малый, средний и большой, — и каждый следующий даёт больше выгоды, но требует больших обязательств. Или же Шри-Ланка может отказаться вовсе."
 HOL_voc.20.a: "Принять малую программу вложений."
 HOL_voc.20.b: "Принять среднюю программу вложений."
 HOL_voc.20.c: "Принять большую программу вложений."
 HOL_voc.20.e: "Отклонить нидерландское предложение."
 HOL_voc.21.t: "Малая программа вложений принята"
 HOL_voc.21.d: "Шри-Ланка приняла нашу малую программу вложений. Этот первый шаг закрепит нидерландское влияние и постепенно укрепит их сельское хозяйство."
 HOL_voc.21.a: "Хорошее начало."
 HOL_voc.22.t: "Средняя программа вложений принята"
 HOL_voc.22.d: "Шри-Ланка приняла нашу среднюю программу вложений. Это более тесное сотрудничество заметно поднимет их сельское хозяйство и расширит нидерландское влияние."
 HOL_voc.22.a: "Отличный ход дела."
 HOL_voc.23.t: "Большая программа вложений принята"
 HOL_voc.23.d: "Шри-Ланка приняла нашу большую программу вложений и взялась за коренную перестройку своего сельского хозяйства. Это веха нидерландского влияния и сотрудничества в крае."
 HOL_voc.23.a: "Это принесёт богатые плоды."
 HOL_voc.24.t: "Шри-Ланка отказывается от предложения о вложениях"
 HOL_voc.24.d: "Шри-Ланка отклонила наше предложение о вложениях и упустила возможность укрепить своё сельское хозяйство. Впрочем, мы всё ещё можем вкладываться в одностороннем порядке, чтобы закрепить своё влияние."
 HOL_voc.24.a: "Досадно, но мы найдём другой путь."
 HOL_voc.25.t: "Нидерландское расширение порта Коломбо"
 HOL_voc.25.d: "Нидерланды сделали крупные вложения в расширение и обновление порта Коломбо, заодно укрепив его охрану. Ожидается, что это поднимет хозяйственные возможности Шри-Ланки и её морскую работу. Однако нидерландское присутствие заметно выросло, и это вызывает тревогу за их влияние на один из важнейших для страны объектов."
 HOL_voc.25.a: "Это и благо, и испытание."
 HOL_voc.26.t: "Нидерланды требуют исключительных прав на Шри-Ланку"
 HOL_voc.26.d: "Нидерланды предъявили жёсткий ультиматум: передать им исключительное право управлять Шри-Ланкой, то есть, по сути, отказаться от суверенитета, — или столкнуться с последствиями. От этого решения зависит будущее ланкийской независимости."
 HOL_voc.26.a: "Нам не остаётся ничего, кроме как уступить."
 HOL_voc.26.b: "Мы отказываемся покоряться!"
 HOL_voc.27.t: "Шри-Ланка отвергает нидерландские требования"
 HOL_voc.27.d: "Шри-Ланка отвергла наш ультиматум и отказалась передать Нидерландам исключительные права на страну. Нам остаётся утвердить своё господство силой."
 HOL_voc.27.a: "Война неизбежна."
 HOL_voc.28.t: "Шри-Ланка принимает нидерландские требования"
 HOL_voc.28.d: "Шри-Ланка сдалась перед нашим ультиматумом и передала Нидерландам исключительное право управлять страной. Это мирное присоединение усиливает нидерландское влияние в крае и становится исторической победой VOC."
 HOL_voc.28.a: "Шри-Ланка теперь часть наследия VOC."
 HOL_voc.29.t: "Нидерландская помощь в борьбе с ВИЧ"
 HOL_voc.29.d: "Нидерланды вызвались помочь Южной Африке в борьбе с эпидемией ВИЧ. Со своим передовым опытом в медицине и средствами нидерландцы принесли нашему народу столь нужные надежду и поддержку. Этот добрый поступок не только укрепил нашу борьбу с эпидемией, но и снискал нидерландцам широкое уважение у населения."
 HOL_voc.29.a: "Это партнёрство — благо для народа, но риск для правительства"
 HOL_voc.30.t: "Нидерланды просят базу в Капской области"
 HOL_voc.30.d: "Нидерланды предложили устроить военно-морскую базу в Капской области, ссылаясь на её важность как узла снабжения на пути в Азию. Взамен нидерландцы обещают крупные вложения в портовую инфраструктуру Южной Африки, что расширит морские возможности страны. Принять ли это предложение?"
 HOL_voc.30.a: "Принять предложение и выстроить партнёрство."
 HOL_voc.30.b: "Отклонить предложение и сохранить полный суверенитет."
 HOL_voc.31.t: "Южная Африка принимает предложение о военно-морской базе"
 HOL_voc.31.d: "Южная Африка согласилась позволить Нидерландам устроить военно-морскую базу в Капской области. Это соглашение открывает нидерландцам путь к важнейшим торговым маршрутам и становится заметным шагом в сотрудничестве с Южной Африкой."
 HOL_voc.31.a: "Важнейшее достижение VOC!"
 HOL_voc.32.t: "Южная Африка отклоняет предложение о военно-морской базе"
 HOL_voc.32.d: "Южная Африка отклонила наше предложение устроить военно-морскую базу в Капской области, сославшись на заботу о суверенитете и стратегической самостоятельности. Для нидерландских замыслов в крае это удар."
 HOL_voc.32.a: "Досадно, но надо идти дальше."
 HOL_voc.33.t: "Нидерланды требуют исключительных прав на Южную Африку"
 HOL_voc.33.d: "Нидерланды предъявили жёсткий ультиматум: передать им исключительное право управлять Южной Африкой, то есть, по сути, отказаться от суверенитета, — или столкнуться с последствиями. От этого решения зависит будущее южноафриканской независимости."
 HOL_voc.33.a: "Нам не остаётся ничего, кроме как уступить."
 HOL_voc.33.b: "Мы отказываемся покоряться!"
 HOL_voc.34.t: "Южная Африка отвергает нидерландские требования"
 HOL_voc.34.d: "Южная Африка отвергла наш ультиматум и отказалась передать Нидерландам исключительные права на страну. Нам остаётся утвердить своё господство силой."
 HOL_voc.34.a: "Война неизбежна."
 HOL_voc.35.t: "Южная Африка принимает нидерландские требования"
 HOL_voc.35.d: "Южная Африка сдалась перед нашим ультиматумом и передала Нидерландам исключительное право управлять страной. Это мирное присоединение усиливает нидерландское влияние в крае и становится исторической победой VOC."
 HOL_voc.35.a: "Южная Африка теперь часть наследия VOC."
 HOL_voc.36.t: "Будущее Индонезии"
 HOL_voc.36.d: "Настало время принять важное решение по Индонезии. Объявить войну и силой вернуть нашу историческую коронную колонию — или продлить тайные операции ещё на год, приняв временные издержки, ведь тот же ресурс дважды не использовать"
 HOL_voc.36.a: "Объявить войну и вернуть Индонезию!"
 HOL_voc.36.b: "Отложить операции ещё на год."
 HOL_voc.39.t: "Нидерланды просят права военного доступа"
 HOL_voc.39.d: "Нидерланды попросили права военного доступа на австралийскую территорию, ссылаясь на стратегические причины и важность сотрудничества в крае. Принять ли их просьбу?"
 HOL_voc.39.a: "Дать им право прохода войск."
 HOL_voc.39.b: "Отклонить их просьбу."
 HOL_voc.40.t: "Австралия даёт право военного доступа"
 HOL_voc.40.d: "Австралия согласилась дать нам право военного доступа — заметный шаг вперёд в сотрудничестве в крае и в слаженности наших действий."
 HOL_voc.40.a: "Превосходно. Готовим войска."
 HOL_voc.41.t: "Австралия отказывает в военном доступе"
 HOL_voc.41.d: "Австралия отклонила нашу просьбу о военном доступе, сославшись на заботу о суверенитете и устойчивости в крае."
 HOL_voc.41.a: "Досадно. Подправим стратегию."
 HOL_voc.42.t: "Приготовления к высадке на Яве завершены"
 HOL_voc.42.d: "Наши тайные приготовления к высадке на Яве завершены. Ждём, чем кончится работа индонезийской контрразведки: останутся ли наши войска незамеченными."
 HOL_voc.42.a: "Продолжать."
 HOL_voc.42.b: "Продолжать."
 HOL_voc.43.t: "Тайные силы обнаружены!"
 HOL_voc.43.d: "Индонезийские силы раскрыли наши тайные приготовления: боеспособность наших войск упала вдвое, а их возможности сократились."
 HOL_voc.43.a: "Тяжёлый удар."
 HOL_voc.44.t: "Тайные силы не обнаружены"
 HOL_voc.44.d: "Наши тайные приготовления остались незамеченными, войска сохранили полную силу и готовы закрепиться на Яве."
 HOL_voc.44.a: "Превосходно!"
 HOL_voc.45.t: "Нидерланды просят продать Западную Австралию"
 HOL_voc.45.d: "Нидерланды официально предложили купить Западную Австралию, сославшись на её важность для своих мировых замыслов. Взамен они предлагают Австралии военное или промышленное возмещение. Что ответим?"
 HOL_voc.45.a: "Согласиться на военное возмещение."
 HOL_voc.45.b: "Согласиться на промышленное возмещение."
 HOL_voc.45.c: "Отклонить их предложение."
 HOL_voc.46.t: "Австралия принимает предложение"
 HOL_voc.46.d: "Австралия согласилась продать Западную Австралию Нидерландам. В зависимости от их выбора мы предоставим обещанное возмещение, чтобы сохранить прочные отношения."
 HOL_voc.46.a: "Заключаем соглашение."
 HOL_voc.47.t: "Австралия отклоняет предложение"
 HOL_voc.47.d: "Австралия отклонила наше предложение купить Западную Австралию. Это огорчает, но нам придётся подправить стратегию."
 HOL_voc.47.a: "Досадно, но пойдём дальше."
 HOL_voc.51.t: "Нидерландский ультиматум Малакке"
 HOL_voc.51.d: "Нидерланды предъявили ультиматум, требуя немедленно сдать Малакку. Принять их условия и избежать войны — или отказать и готовиться к бою?"
 HOL_voc.51.a: "Принять их условия."
 HOL_voc.51.b: "Отказать и стоять на своём."
 HOL_voc.52.t: "Малакка принимает нидерландский ультиматум"
 HOL_voc.52.d: "Малакка сдалась перед нашими требованиями и без сопротивления передала свою землю Нидерландам. Это крупная победа нидерландских замыслов в крае."
 HOL_voc.52.a: "Включить Малакку в нидерландские владения."
 HOL_voc.53.t: "Малакка отвергает нидерландский ультиматум"
 HOL_voc.53.d: "Малакка отвергла наш ультиматум и отказалась сдаться. Нам остаётся готовиться к войне, чтобы отстоять свои притязания."
 HOL_voc.53.a: "Возьмём Малакку силой."
 HOL_voc.54.t: "Нидерландский ультиматум §Y[SIN.GetNameWithFlag]§!"
 HOL_voc.54.d: "Нидерланды предъявили ультиматум, требуя немедленно сдать Сингапур. Принять их условия или готовиться к войне?"
 HOL_voc.54.a: "Принять их условия."
 HOL_voc.54.b: "Отказать и стоять на своём."
 HOL_voc.55.t: "§Y[SIN.GetNameWithFlag]§! принимает нидерландский ультиматум"
 HOL_voc.55.d: "§Y[SIN.GetNameWithFlag]§! сдался перед нашими требованиями и без сопротивления передал свою землю. Это крупная победа нидерландских замыслов."
 HOL_voc.55.a: "Включить §Y[SIN.GetNameWithFlag]§! в наши владения."
 HOL_voc.56.t: "§Y[SIN.GetNameWithFlag]§! отвергает нидерландский ультиматум"
 HOL_voc.56.d: "§Y[SIN.GetNameWithFlag]§! отверг наш ультиматум и отказался выполнять нидерландские требования. Нам остаётся готовиться к войне."
 HOL_voc.56.a: "Возьмём Сингапур силой."
 HOL_voc.57.t: "Нидерландский ультиматум §Y[BRU.GetNameWithFlag]§!"
 HOL_voc.57.d: "§Y[HOL.GetNameWithFlag]§! предъявили ультиматум, требуя немедленно сдать Бруней. Принять их условия или готовиться к войне?"
 HOL_voc.57.a: "Принять их условия."
 HOL_voc.57.b: "Отказать и стоять на своём."
 HOL_voc.58.t: "§Y[BRU.GetNameWithFlag]§! принимает нидерландский ультиматум"
 HOL_voc.58.d: "§Y[BRU.GetNameWithFlag]§! сдался перед нашими требованиями и без сопротивления передал свою землю. Это крупная победа нидерландских замыслов."
 HOL_voc.58.a: "Включить §Y[BRU.GetNameWithFlag]§! в наши владения."
 HOL_voc.59.t: "§Y[BRU.GetNameWithFlag]§! отвергает нидерландский ультиматум"
 HOL_voc.59.d: "§Y[BRU.GetNameWithFlag]§! отверг наш ультиматум и отказался выполнять нидерландские требования. Нам остаётся готовиться к войне."
 HOL_voc.59.a: "Возьмём §Y[BRU.GetNameWithFlag]§! силой."
 HOL_voc.60.t: "Обнаружены нидерландские приготовления к войне"
 HOL_voc.60.d: "Разведка подтверждает: Нидерланды разворачивают силы, чтобы вернуть земли, которые считают частью своего исторического наследия. Нужно немедля готовиться к их натиску."
 HOL_voc.60.a: "Готовиться к нидерландской угрозе."
 HOL_voc.61.t: "Оборонительные приготовления нарастают"
 HOL_voc.61.d: "Нидерланды усилили военные приготовления, и вторжение становится всё вероятнее. Чтобы противостоять этой угрозе, нам нужно сплотиться с другими странами, оказавшимися под ударом, и заключить соглашения о взаимной обороне. Тогда в случае нидерландского нападения мы сможем призвать друг друга на помощь."
 HOL_voc.61.a: "Укрепить оборону и сплотить союзы."
 HOL_voc.62.t: "Просить помощи против нидерландского натиска"
 HOL_voc.62.d: "Нидерланды напали на нас и угрожают нашему суверенитету. Мы можем призвать союзников исполнить свои обязательства и вступить в бой, чтобы отразить нидерландское вторжение."
 HOL_voc.62.a: "Призвать союзников на помощь."
 HOL_voc.62.b: "Мы выстоим против них одни."
 HOL_voc.63.t: "[ROOT.GetNameWithFlag] просит помощи"
 HOL_voc.63.d: "§Y[ROOT.GetNameWithFlag]§! подверглась нападению §R[HOL.GetNameWithFlag]§! и просит нашей помощи, чтобы отразить вторжение. Исполним ли мы своё обязательство и вступим ли в бой?"
 HOL_voc.63.a: "Вступить в войну и помочь союзнику."
 HOL_voc.63.b: "Отказаться вмешиваться."
 HOL_voc.64.t: "Нидерландское предложение: трансавстралийский торговый коридор"
 HOL_voc.64.d: "Нидерландское правительство официально предложило построить торгово-инфраструктурный коридор, связывающий управляемую Нидерландами Западную Австралию с восточными областями материка. План включает создание логистических узлов, железных и автомобильных дорог и хозяйственных зон под нидерландским управлением. Коридор сулит долгосрочную выгоду, но поднимает вопросы о суверенитете, управлении и равновесии влияния на всём материке."
 HOL_voc.64.a: "Одобрить коридор: развитие хозяйства важнее"
 HOL_voc.64.b: "Отклонить план: мы не можем уступать стратегические земли"
 HOL_voc.65.t: "Австралия принимает предложение о торговом коридоре"
 HOL_voc.65.d: "Австралийское правительство одобрило наше предложение построить трансконтинентальный торговый коридор, связывающий нидерландскую Западную Австралию с восточными промышленными и населёнными узлами. Скоро начнутся работы по общей инфраструктуре, хозяйственным зонам и логистическим узлам. Это исторический шаг к хозяйственному сращиванию края и к нидерландскому стратегическому влиянию в Индо-Тихоокеанском регионе."
 HOL_voc.65.a: "Коридор, достойный наследия VOC."
 HOL_voc.66.t: "Австралия отклоняет предложение о торговом коридоре"
 HOL_voc.66.d: "Австралийское правительство отклонило наше предложение совместно построить трансконтинентальный торговый коридор через их территорию. Главными причинами названы забота о стратегическом суверенитете и опасения насчёт иностранного влияния. Предложение было бы выгодно обеим сторонам, но внутренняя политика пока взяла верх."
 HOL_voc.66.a: "Неудача. Но не конец."
 HOL_voc.67.t: "Нидерланды поддерживают автономию африканеров"
 HOL_voc.67.d: "Голландское правительство выступило с официальным заявлением в поддержку культурной и экономической автономии общины африканеров в Южной Африке — шагом, который наверняка обострит внутренние противоречия. Нидерландские учреждения объявили о более тесных связях с общественными организациями африканеров, ссылаясь на историческое родство и общее наследие. Хотя всё это подаётся как культурная поддержка, в правительстве Южной Африки заявление вызвало тревогу: там опасаются иностранного вмешательства и возможных волнений."
 HOL_voc.67.a: "Это серьёзная дипломатическая проблема."
 HOL_voc.68.t: "Нидерланды поддерживают бурские партии"
 HOL_voc.68.d: "Появились подтверждённые сообщения о том, что голландское правительство неофициально поддерживает политические движения бурской направленности в Южной Африке. Через финансовые каналы, площадки неправительственных организаций и культурные учреждения влияние, по всей видимости, направляется группам, добивающимся расширения автономии общины африканеров. Такое вмешательство может иметь серьёзные последствия для национального единства и внутренней безопасности."
 HOL_voc.68.a: "Это недопустимое иностранное вмешательство."
 HOL_voc.69.t: "Нидерландские инвестиции в горнодобывающие компании африканеров"
 HOL_voc.69.d: "Голландское правительство вложило значительные средства в принадлежащие африканерам горнодобывающие предприятия в Южной Африке. Этот шаг — часть более широкой кампании по углублению экономических связей с общиной африканеров: капитал и материально-техническая поддержка должны увеличить добычу. Кому-то это выгодно экономически, но заново поднимает вопрос о внешнем влиянии на природные ресурсы Южной Африки."
 HOL_voc.69.a: "Они явно выбрали сторону."
 HOL_voc.70.t: "Нидерландские инвестиции в полупроводниковую отрасль"
 HOL_voc.70.d: "Нидерланды объявили о стратегических инвестициях в полупроводниковую отрасль Тайваня. Вместе с ведущими голландскими технологическими компаниями будут построены новые совместные офисы и исследовательские центры для разработки чипов следующего поколения. Соглашение углубляет двустороннее сотрудничество и укрепляет роль Тайваня как мирового центра полупроводникового производства."
 HOL_voc.70.a: "Это закрепляет место Тайваня в цифровую эпоху."
 HOL_voc.71.t: "Предложение Нидерландов: технологический альянс ASML и TSMC"
 HOL_voc.71.d: "Нидерланды официально предложили создать совместную группу по обмену технологиями между ASML и TSMC. Такое партнёрство углубило бы сотрудничество в исследованиях и разработках, позволило бы координировать работу над литографией и новыми чипами и создало бы полуформальный технологический и промышленный блок. Поддержит ли Тайвань эту инициативу?"
 HOL_voc.71.a: "Одобрить технологический альянс: наше будущее — цифровое"
 HOL_voc.71.b: "Отказаться: мы должны сохранить технологическую независимость"
 HOL_voc.72.t: "Тайвань принимает партнёрство ASML и TSMC"
 HOL_voc.72.d: "Тайвань принял предложение Нидерландов о создании совместной группы по обмену технологиями. Альянс с ASML и TSMC в основе закладывает основу для согласованных разработок в полупроводниковой отрасли и лидерства в исследованиях по обе стороны — в Европе и в Азии."
 HOL_voc.72.a: "Промышленный альянс новой эпохи."
 HOL_voc.73.t: "Тайвань отклонил предложение об обмене технологиями"
 HOL_voc.73.d: "Тайвань отклонил предложение о создании совместного технологического альянса между ASML и TSMC. Дипломатические каналы остаются открытыми, но Тайбэй предпочёл сохранить полную самостоятельность в полупроводниковой стратегии — по крайней мере пока."
 HOL_voc.73.a: "Разочаровывающий исход."
 HOL_voc.74.t: "Нидерланды берут под контроль экспорт полупроводников"
 HOL_voc.74.d: "Голландское правительство решительным шагом приняло новые законы, передающие ему право контролировать экспорт всех передовых полупроводниковых технологий и фотолитографических систем. Главной драгоценностью этого решения стала ASML: теперь Нидерланды занимают господствующее положение в мировой цепочке поставок чипов и могут разрешать, ограничивать или блокировать экспорт технологий исходя из национальных интересов и дипломатических предпочтений."
 HOL_voc.74.a: "Нам следует подготовить меры против Нидерландов"
 HOL_voc.74.b: "Теперь ключи от мировых технологий у нас."
 HOL_voc.75.t: "Финансовая экспансия Нидерландов в Индии"
 HOL_voc.75.d: "Нидерланды существенно расширили своё финансовое присутствие в Индии, открыв в крупных городах новые банки и корпоративные представительства с голландским участием. За этим стоят согласованные усилия голландских государственных институтов и транснациональных компаний, цель которых — углубить взаимные инвестиции, влиять на финансовые рынки и усилить экономические рычаги в быстрорастущей экономике Индии. Прямым политическим манёвром это не назовёшь, но расстановку экономических сил в регионе оно понемногу меняет."
 HOL_voc.75.a: "Иностранный капитал всегда несёт с собой влияние…"
 HOL_voc.76.t: "Нидерландские инвестиции в портовую инфраструктуру Гуджарата"
 HOL_voc.76.d: "Голландское правительство через государственные морские компании и финансовые каналы вложилось в модернизацию портовой инфраструктуры на побережье Гуджарата. Официально это подаётся как содействие торговле, но появление голландских представительств и причальных мощностей вызвало опасения, что в важнейшем для национальной торговли регионе надолго закрепится иностранное влияние. Шаг дипломатически деликатный, но экономически весомый."
 HOL_voc.76.a: "Мы будем внимательно следить за их влиянием."
 HOL_wic.01.t: "Выбор пути для WIC"
 HOL_wic.01.d: "Готовясь вернуть земли, некогда подконтрольные Вест-Индской компании, мы должны выбрать подход. Дипломатия и экономика могут привести к мирному присоединению и укрепить наше влияние мягкой силой. Военный путь способен дать быстрый и решительный результат, но грозит сопротивлением и затяжной войной."
 HOL_wic.01.a: "Пойти дипломатическим и экономическим путём"
 HOL_wic.01.b: "Избрать военную стратегию"
 HOL_wic.02.t: "Выкуп долга Нидерландами"
 HOL_wic.02.d: "Нидерланды выкупили значительную часть нашего государственного долга, фактически поставив нашу экономику под своё влияние. Это несколько облегчило наш финансовый кризис, но теперь голландцы имеют немалый вес в наших политических решениях и ключевых отраслях."
 HOL_wic.02.a: "Нам не остаётся ничего, кроме как подчиниться голландскому финансовому контролю."
 HOL_wic.03.t: "Ультиматум Нидерландов Сенегалу"
 HOL_wic.03.d: "Нидерланды предъявили ультиматум, требуя передать им Центральный Сенегал, в состав которого входит исторический остров Горе. Подчинится ли Сенегал, предложит другой вариант или откажет наотрез?"
 HOL_wic.03.a: "Мы подчинимся и передадим Центральный Сенегал."
 HOL_wic.03.b: "Предложить взамен Северный Сенегал."
 HOL_wic.03.c: "Мы отказываемся склоняться перед голландской агрессией."
 HOL_wic.04.t: "Территория получена"
 HOL_wic.04.d: "Сенегал принял наш ультиматум и передал Центральный Сенегал под голландский контроль. Это ещё один шаг к возрождению наследия Вест-Индской компании."
 HOL_wic.04.a: "Победа Нидерландов."
 HOL_wic.05.t: "Встречное предложение Сенегала"
 HOL_wic.05.d: "Сенегал отказался передать Центральный Сенегал, но предложил взамен Северный Сенегал. Принять встречное предложение или настаивать на первоначальном требовании?"
 HOL_wic.05.a: "Принять встречное предложение."
 HOL_wic.05.b: "Отклонить встречное предложение и настаивать на своём."
 HOL_wic.06.t: "Ультиматум отвергнут"
 HOL_wic.06.d: "Сенегал отказался выполнять наш ультиматум. Теперь мы должны готовиться к войне, чтобы вернуть то, что принадлежит нам по праву."
 HOL_wic.06.a: "Война неизбежна."
 HOL_wic.07.t: "Последний ультиматум Сенегалу"
 HOL_wic.07.d: "Сенегал отверг наше встречное предложение. Мы даём им последнюю возможность отдать Северный Сенегал — иначе ответим военной силой."
 HOL_wic.07.a: "Отдать Северный Сенегал."
 HOL_wic.07.b: "Мы будем защищаться от голландской агрессии."
 HOL_wic.08.t: "Ультиматум Нидерландов: передать Золотой Берег"
 HOL_wic.08.d: "Нидерланды предъявили ультиматум, требуя передать им Золотой Берег. Они ссылаются на своё историческое присутствие в регионе во времена Вест-Индской компании и на владение ключевыми торговыми факториями вроде форта Эльмина. Уступка позволила бы избежать войны, но подорвала бы суверенитет Ганы и расшатала обстановку в регионе."
 HOL_wic.08.a: "Мы подчинимся и передадим Золотой Берег."
 HOL_wic.08.b: "Мы отказываемся склоняться перед голландскими требованиями."
 HOL_wic.09.t: "Золотой Берег получен"
 HOL_wic.09.d: "Правительство Ганы согласилось передать Золотой Берег вместе со стратегически важным фортом Эльмина под голландский контроль. Это важный шаг к возрождению наследия Вест-Индской компании и укреплению нашего присутствия в Западной Африке."
 HOL_wic.09.a: "Победа Нидерландов и WIC."
 HOL_wic.10.t: "Гана отвергла ультиматум Нидерландов"
 HOL_wic.10.d: "Правительство Ганы отклонило наш ультиматум о передаче Золотого Берега. Их упорство не оставляет нам выбора: придётся готовить военную операцию, чтобы вернуть то, что мы считаем своим по праву, и восстановить голландское влияние в регионе."
 HOL_wic.10.a: "Ответом может быть только война."
 HOL_wic.11.t: "Ультиматум Нидерландов: передать провинцию Луанда"
 HOL_wic.11.d: "Нидерланды предъявили ультиматум, требуя передать им провинцию Луанда. Они объявляют эту территорию частью своей исторической морской империи, ссылаясь на присутствие Вест-Индской компании в регионе. Уступка позволила бы избежать войны, но могла бы подорвать политическую и экономическую устойчивость Анголы."
 HOL_wic.11.a: "Мы подчинимся и передадим провинцию Луанда под голландский контроль."
 HOL_wic.11.b: "Мы отказываемся уступать голландским требованиям."
 HOL_wic.12.t: "Ангола приняла ультиматум Нидерландов"
 HOL_wic.12.d: "Правительство Анголы согласилось передать провинцию Луанда под голландский контроль. Это стратегическое приобретение возвращает важную часть голландского морского наследия в Атлантике и укрепляет наши позиции в регионе."
 HOL_wic.12.a: "Ещё один шаг к возрождению WIC."
 HOL_wic.13.t: "Ангола отвергла ультиматум Нидерландов"
 HOL_wic.13.d: "Правительство Анголы отклонило наш ультиматум о передаче провинции Луанда. Их упорство не оставляет нам выбора: придётся готовить военную операцию, чтобы вернуть то, что мы считаем своим по праву."
 HOL_wic.13.a: "Мы должны утвердить своё превосходство силой."
 HOL_wic.14.t: "Ультиматум Нидерландов: передать остров Святой Елены"
 HOL_wic.14.d: "Нидерланды предъявили ультиматум, требуя передать им остров Святой Елены. Голландцы обосновывают притязания исторической связью острова с их морской империей и его значением для атлантической торговли. Уступка позволила бы избежать войны, но поставила бы под удар британские интересы в регионе."
 HOL_wic.14.a: "Мы подчинимся и передадим остров Святой Елены под голландский контроль."
 HOL_wic.14.b: "Мы отказываемся склоняться перед голландскими требованиями."
 HOL_wic.15.t: "Остров Святой Елены получен"
 HOL_wic.15.d: "Британское правительство согласилось передать остров Святой Елены под голландский контроль. Это приобретение возвращает важнейшую часть морского наследия Нидерландов и укрепляет наше господство на атлантических торговых путях."
 HOL_wic.15.a: "Большая победа Нидерландов и WIC."
 HOL_wic.16.t: "Англия отвергла ультиматум Нидерландов"
 HOL_wic.16.d: "Британское правительство отклонило наш ультиматум о передаче острова Святой Елены. Их решение не оставляет нам выбора: придётся готовить военную операцию, чтобы вернуть этот важнейший остров."
 HOL_wic.16.a: "Мы должны готовиться к войне."
 HOL_wic.17.t: "Голландцы требуют вернуть Сан-Хуан-Баутиста"
 HOL_wic.17.d: "Неожиданным шагом Нидерланды предъявили официальный ультиматум, требуя передать им Пуэрто-Рико, исторически известный как Сан-Хуан-Баутиста. Они объявляют остров необходимым звеном в возрождении морского наследия Вест-Индской компании и восстановлении своего господства в Карибском море. Голландцы ссылаются на свои замыслы XVII века и стратегическую необходимость, но уступка стала бы серьёзной геополитической потерей для Соединённых Штатов."
 HOL_wic.17.a: "Мы уступим Пуэрто-Рико голландцам."
 HOL_wic.17.b: "Мы никогда не отдадим американскую землю иностранным державам."
 HOL_wic.18.t: "Сан-Хуан-Баутиста возвращается под голландский контроль"
 HOL_wic.18.d: "Соединённые Штаты согласились уступить Пуэрто-Рико голландскому контролю. Историческое возвращение Сан-Хуан-Баутиста восстанавливает важнейшее звено в Карибском море, укрепляет наши морские замыслы и отдаёт должное наследию Вест-Индской компании."
 HOL_wic.18.a: "Славный день для голландского влияния."
 HOL_wic.19.t: "Американцы отвергли голландский ультиматум"
 HOL_wic.19.d: "Соединённые Штаты наотрез отказались выполнять наш ультиматум и уступать Пуэрто-Рико. Их упорство подрывает наши законные притязания на Карибское море, и теперь мы должны готовиться к войне, чтобы взять Сан-Хуан-Баутиста силой."
 HOL_wic.19.a: "Мы возьмём его силой. Карибы будут нашими!"
 HOL_wic.20.t: "Голландцы требуют Британские Антильские острова"
 HOL_wic.20.d: "Нидерланды предъявили официальный ультиматум, требуя передать им Британские Антильские острова. Они объявляют эти острова неотъемлемой частью своих исторических замыслов времён Вест-Индской компании и ссылаются на их стратегическое значение в Карибском море. Отказ может обернуться войной в регионе."
 HOL_wic.20.a: "Мы передадим Британские Антильские острова под голландский контроль."
 HOL_wic.20.b: "Мы отказываемся отдавать британские территории."
 HOL_wic.21.t: "Британские Антильские острова переданы"
 HOL_wic.21.d: "Британское правительство приняло наши требования и уступило Британские Антильские острова голландскому контролю. Этот успех — ещё один шаг к возрождению влияния Вест-Индской компании в Карибском море."
 HOL_wic.21.a: "Карибы снова становятся голландскими."
 HOL_wic.22.t: "Британцы отвергли голландский ультиматум"
 HOL_wic.22.d: "Британцы отказались уступить нам Британские Антильские острова. Оставить это без ответа нельзя — мы должны готовиться взять эти важнейшие острова силой."
 HOL_wic.22.a: "Мы вернём своё войной."
 HOL_wic.23.t: "Голландцы требуют контроля над Тринидадом"
 HOL_wic.23.d: "Нидерланды предъявили официальный ультиматум, требуя передать Тринидад под голландский контроль. Голландцы ссылаются на свои исторические замыслы времён Вест-Индской компании, когда в начале XVII века остров недолго считался будущим «Новым Валхереном». Его положение в Карибском море бесценно для господства на море и контроля над торговыми путями."
 HOL_wic.23.a: "Мы уступим Тринидад голландцам."
 HOL_wic.23.b: "Мы отказываемся уступать голландским требованиям."
 HOL_wic.24.t: "Тринидад возвращён под голландский контроль"
 HOL_wic.24.d: "Правительство Тринидада приняло наш ультиматум и передало остров под наш контроль. Это важнейшее приобретение укрепляет наше влияние в Карибском море и восстанавливает голландское господство в регионе, воплощая замысел Нового Валхерена."
 HOL_wic.24.a: "Важнейший шаг для Вест-Индской компании."
 HOL_wic.25.t: "Тринидад отверг голландский ультиматум"
 HOL_wic.25.d: "Правительство Тринидада отказалось выполнить наши требования по острову. Их упорство не оставляет нам выбора: придётся готовиться к войне, чтобы вернуть эту стратегически важную территорию."
 HOL_wic.25.a: "Готовьте войска к войне!"
 HOL_wic.26.t: "Голландцы требуют вернуть Суринам"
 HOL_wic.26.d: "Нидерланды предъявили официальный ультиматум, требуя вернуть им Суринам. Некогда важнейшая колония под голландской властью, Суринам с его положением и богатыми ресурсами считается ключом к возрождению влияния Вест-Индской компании. Уступка позволила бы избежать войны, но означала бы потерю суверенитета."
 HOL_wic.26.a: "Мы уступим Суринам голландцам."
 HOL_wic.26.b: "Мы отказываемся уступать голландским требованиям."
 HOL_wic.27.t: "Суринам возвращён под голландский контроль"
 HOL_wic.27.d: "Правительство Суринама приняло наш ультиматум и передало свою территорию под наш контроль. Это мирное приобретение закрепляет за нами важнейший плацдарм в Южной Америке, давая ресурсы и выгодное положение для дальнейших голландских замыслов."
 HOL_wic.27.a: "Ещё одна победа WIC!"
 HOL_wic.28.t: "Суринам отверг голландский ультиматум"
 HOL_wic.28.d: "Правительство Суринама отказалось выполнить наши требования. Оставить это без ответа нельзя — мы должны готовиться установить контроль над Суринамом военной силой."
 HOL_wic.28.a: "Готовиться к войне!"
 HOL_wic.29.t: "Голландцы требуют контроля над Гайаной"
 HOL_wic.29.d: "Нидерланды предъявили официальный ультиматум, требуя передать Гайану под голландский контроль. Исторически входившая в Голландскую Гвиану, эта территория богата ресурсами и стратегически ценна. Голландцы утверждают, что возвращение Гайаны необходимо для возрождения замыслов Вест-Индской компании и закрепления их господства в Южной Америке."
 HOL_wic.29.a: "Мы передадим Гайану голландцам."
 HOL_wic.29.b: "Мы отказываемся уступать голландским требованиям."
 HOL_wic.30.t: "Гайана возвращена под голландский контроль"
 HOL_wic.30.d: "Правительство Гайаны приняло наши требования и передало свою территорию под наш контроль. Это мирное приобретение возрождает голландское влияние в Южной Америке и воплощает замыслы Вест-Индской компании."
 HOL_wic.30.a: "Победа голландской решимости!"
 HOL_wic.31.t: "Гайана отвергла голландский ультиматум"
 HOL_wic.31.d: "Правительство Гайаны отказалось выполнить наш ультиматум. Оставить это без ответа нельзя — мы должны готовиться установить контроль над этой территорией военной силой."
 HOL_wic.31.a: "Мы возьмём Гайану силой."
 HOL_wic.32.t: "Голландцы требуют контроля над Французской Гвианой"
 HOL_wic.32.d: "Нидерланды предъявили официальный ультиматум, требуя передать Французскую Гвиану под голландский контроль. Ссылаясь на исторические колониальные замыслы в Америке, они объявляют эту территорию необходимым шагом к восстановлению господства Вест-Индской компании в регионе. Уступка позволит избежать войны, но ударит по французскому престижу и суверенитету."
 HOL_wic.32.a: "Мы уступим Французскую Гвиану голландцам."
 HOL_wic.32.b: "Мы отказываемся уступать голландским требованиям."
 HOL_wic.33.t: "Французская Гвиана передана под голландский контроль"
 HOL_wic.33.d: "Французское правительство приняло наши требования и передало Французскую Гвиану под наш контроль. Эта победа возвращает Нидерландам важнейшую территорию, укрепляет наше влияние в Южной Америке и воплощает замыслы Вест-Индской компании."
 HOL_wic.33.a: "Большой успех голландских замыслов!"
 HOL_wic.34.t: "Франция отвергла голландский ультиматум"
 HOL_wic.34.d: "Французское правительство наотрез отказалось выполнять наш ультиматум о передаче Французской Гвианы. Оставить это без ответа нельзя — мы должны готовиться к войне, чтобы вернуть эту важнейшую территорию и утвердить своё господство в Америке."
 HOL_wic.34.a: "Мы возьмём её силой!"
 HOL_wic.35.t: "Голландцы требуют контроля над севером Бразилии"
 HOL_wic.35.d: "Нидерланды предъявили официальный ультиматум, требуя передать им территории на севере Бразилии. В XVII веке эти земли уже были под голландской властью, когда Вест-Индская компания основала недолговечную колонию в Пернамбуку и окрестных землях. Теперь голландцы утверждают, что возвращение этих земель необходимо для возрождения их влияния в Южной Америке и получения важнейших ресурсов."
 HOL_wic.35.a: "Мы передадим эти территории голландцам."
 HOL_wic.35.b: "Мы отвергаем их требования. Бразилия выстоит."
 HOL_wic.36.t: "Бразилия передаёт северные территории"
 HOL_wic.36.d: "Бразильское правительство приняло наши требования и передало северные территории под наш контроль. Это важное приобретение возвращает частицу нашего колониального наследия в Южной Америке и укрепляет голландское присутствие в регионе."
 HOL_wic.36.a: "Большая победа Вест-Индской компании!"
 HOL_wic.37.t: "Бразилия отвергла голландский ультиматум"
 HOL_wic.37.d: "Бразильское правительство отвергло наш ультиматум и наши притязания на северные территории. Их упорство не оставляет нам выбора: придётся готовить военную операцию, чтобы вернуть эти земли силой."
 HOL_wic.37.a: "Нам не откажут! Готовиться к войне!"
 HOL_wic.38.t: "Ультиматум Нидерландов: вернуть голландско-американские земли"
 HOL_wic.38.d: "Нидерланды предъявили неслыханный ультиматум, требуя вернуть бывшие голландские владения на Восточном побережье, в том числе земли, некогда входившие в Новые Нидерланды. Они объявляют это своим историческим правом, ссылаясь на наследие Нового Амстердама и роль голландцев в основании этих краёв. Уступка была бы воспринята как огромная дипломатическая сдача и может ударить по американской гордости и суверенитету."
 HOL_wic.38.a: "Мы пойдём на переговоры и передадим эти территории."
 HOL_wic.38.b: "Мы никогда не отдадим американскую землю!"
 HOL_wic.39.t: "США передают голландско-американские земли"
 HOL_wic.39.d: "Неслыханным поворотом событий Соединённые Штаты согласились вернуть Нидерландам контроль над ключевыми территориями. Эта грандиозная победа восстанавливает голландское влияние в Америке и возрождает дух Нового Амстердама."
 HOL_wic.39.a: "Исторический успех голландской дипломатии!"
 HOL_wic.40.t: "США отвергли голландский ультиматум"
 HOL_wic.40.d: "Соединённые Штаты наотрез отказались возвращать голландско-американские земли. Их упорство не оставляет нам выбора: придётся готовиться к войне, чтобы вернуть эти земли силой. Честь Нового Амстердама должна быть восстановлена!"
 HOL_wic.40.a: "Мы вернём своё войной!"
 HOL_nvu.4.t: "Реформа образования завершена"
 HOL_nvu.4.d: "После года преобразований новая система образования заработала в полную силу. Следующее поколение растят на ценностях верности, дисциплины и гордости, обеспечивая стране будущее."
 HOL_nvu.4.a: "Реформы обернулись громким успехом!"
 HOL_nvu.5.t: "Нидерландский ультиматум: объединение Дитсланда"
 HOL_nvu.5.d: "Нидерландское правительство предъявило Бельгии ультиматум, требуя немедленно передать Фландрию ради объединения Дитсланда. Бельгии предстоит решить, принять ли это требование или столкнуться с последствиями отказа."
 HOL_nvu.5.a: "Принять требование и передать Фландрию."
 HOL_nvu.5.b: "Отклонить ультиматум."
 HOL_nvu.6.t: "Бельгия уступает нидерландским требованиям"
 HOL_nvu.6.d: "Под давлением нидерландского ультиматума Бельгия согласилась передать Фландрию Нидерландам. Это важный шаг к объединению Дитсланда."
 HOL_nvu.6.a: "Объединение Дитсланда начинается!"
 HOL_nvu.7.t: "Бельгия отвергает нидерландский ультиматум"
 HOL_nvu.7.d: "Бельгия наотрез отказалась выполнять нидерландский ультиматум о передаче Фландрии, бросив вызов замыслу единого Дитсланда. Нидерландам остаётся готовиться к действиям и отстаивать своё притязание силой."
 HOL_nvu.7.a: "Мы заявим права на всю Бельгию ради Дитсланда!"
 HOL_nvu.8.t: "Нидерландское предложение: включение фламандской армии"
 HOL_nvu.8.d: "Нидерландское правительство официально попросило включить фламандские части наших вооружённых сил в свою военную структуру. Вопрос политически щекотлив, но предложение подаётся как шаг к более тесному сотрудничеству в регионе."
 HOL_nvu.8.a: "Согласиться на передачу"
 HOL_nvu.8.b: "Отклонить предложение"
 HOL_nvu.9.t: "Бельгия принимает соглашение о включении"
 HOL_nvu.9.d: "Бельгийское правительство согласилось передать свои фламандские части в нашу военную структуру. Их включение начнётся немедленно."
 HOL_nvu.9.a: "Превосходно"
 HOL_nvu.10.t: "Бельгия отклоняет предложение"
 HOL_nvu.10.d: "Бельгийское правительство отклонило наше предложение включить фламандские части их армии в наш состав. Их руководство сочло это политически неприемлемым."
 HOL_nvu.10.a: "Досадно"
 HOL_nvu.11.t: "Предложение из Нидерландов"
 HOL_nvu.11.d: "Нидерланды предложили создать «Германское братство народов» — договор о военном и культурном сближении между нашими странами. Идейно мы близки, но долгосрочные последствия надо взвесить как следует."
 HOL_nvu.11.a: "Принять предложение"
 HOL_nvu.11.b: "Отвергнуть эту мысль"
 HOL_nvu.12.t: "Германия принимает братство"
 HOL_nvu.12.d: "Германия согласилась образовать «Германское братство народов». В Европе появилась новая геополитическая ось."
 HOL_nvu.12.a: "Будущее за нами"
 HOL_nvu.13.t: "Германия отвергает братство"
 HOL_nvu.13.d: "Берлин отказался от нашего предложения создать Германское братство. Мечту о единстве придётся отложить — или осуществить силой."
 HOL_nvu.13.a: "Позор"
 HOL_nvu.14.t: "Германское братство рождено"
 HOL_nvu.14.d: "После успешных переговоров с Нидерландами «Германское братство народов» официально учреждено. Новый союз строится на общей культурной самобытности, военном сотрудничестве и идейном единстве. Германия стоит теперь в сердце новой северной оси."
 HOL_nvu.14.a: "Einigkeit macht stark"
 HOL_nvu.15.t: "Германский инфраструктурный проект"
 HOL_nvu.15.d: "Чтобы углубить сращивание и улучшить переброску сил между участниками Германского братства, мы взялись вложиться в важнейшую инфраструктуру, связывающую наши страны. Современные железные и автомобильные дороги свяжут сердце нашего северного союза теснее, чем когда-либо."
 HOL_nvu.15.a: "Заложить основы единства"
 HOL_nvu.16.t: "Вложения в ресурсы Рейнской области"
 HOL_nvu.16.d: "В рамках растущего сотрудничества с Германией нидерландские инженеры и промышленные плановики запустили новую программу развития в Рейнской области. Нацеленная на расширение доступа к стали и алюминию, она увеличит промышленный выпуск края и обеспечит германское дело важнейшими материалами."
 HOL_nvu.16.a: "Сила через промышленность"
 HOL_nvu.17.t: "Приглашение вступить в Германское братство"
 HOL_nvu.17.d: "Нидерланды официально пригласили Австрию вступить в «Германское братство народов». Этот союз сулит общие стратегические цели, культурное единство и военное сотрудничество. Примем ли мы их видение единого германского будущего?"
 HOL_nvu.17.a: "Мы принимаем их предложение"
 HOL_nvu.17.b: "Придётся отказаться"
 HOL_nvu.18.t: "Австрия принимает братство"
 HOL_nvu.18.d: "Австрия приняла наше приглашение вступить в Германское братство. Ещё один гордый германский народ стоит с нами в единстве и силе."
 HOL_nvu.18.a: "Добро пожаловать, Австрия"
 HOL_nvu.19.t: "Австрия отвергает братство"
 HOL_nvu.19.d: "Австрия отвергла наше приглашение вступить в Германское братство. Этот отказ мы запомним."
 HOL_nvu.19.a: "Они об этом пожалеют"
 HOL_nvu.20.t: "Нидерландская поддержка флота"
 HOL_nvu.20.d: "Нидерланды протянули руку помощи нашим морским устремлениям, прислав материальную помощь и вложения в морское дело. С их опытом основы австрийского флота наконец закладываются."
 HOL_nvu.20.a: "Возрождение австрийского флота"
 HOL_nvu.21.t: "Укрепление Германского союза"
 HOL_nvu.21.d: "Чтобы сотрудничество германских народов стало прочным, Нидерланды начали новые шаги к сращиванию, предложив согласование дипломатии, совместное военное планирование и хозяйственную поддержку. Братство превращается в настоящий союз."
 HOL_nvu.21.a: "В единстве сила"
 HOL_nvu.22.t: "Нидерландское предложение об объединении"
 HOL_nvu.22.d: "Нидерланды предложили полное объединение германских народов в одно государство. Нам предстоит решить, принять ли единство или остаться в стороне."
 HOL_nvu.22.a: "Мы принимаем союз"
 HOL_nvu.22.b: "Мы отвергаем их предложение"
 HOL_nvu.23.t: "Объединение принято"
 HOL_nvu.23.d: "Наше предложение об объединении принято. Под нидерландским началом рождается новая германская держава."
 HOL_nvu.23.a: "Мечта сбылась"
 HOL_nvu.24.t: "Объединение отвергнуто"
 HOL_nvu.24.d: "Наше предложение об объединении отвергнуто. Теперь нам решать, закончится ли Братство на этом или продолжится силой."
 HOL_nvu.24.a: "Значит, возьмём своё"
 HOL_nvu.25.t: "Нидерландские вложения в австрийские ресурсы"
 HOL_nvu.25.d: "На новом витке хозяйственного сращивания нидерландское правительство предложило крупные вложения в австрийскую добычу и переработку сырья. Это должно обновить важнейшую инфраструктуру и увеличить выпуск сырья по всему краю."
 HOL_nvu.25.a: "Это укрепит нашу промышленную базу."
 HOL_nvu.26.t: "Нидерландские вложения в общегерманскую железнодорожную сеть"
 HOL_nvu.26.d: "Нидерландское правительство объявило крупную программу вложений в обновление и расширение железных дорог по германским землям. Чиновники заявляют, что цель — улучшить подвижность, хозяйственное сращивание и культурное единство германских народов. Этот шаг отвечает континентальному видению Нидерландов и их растущим инфраструктурным замыслам в Центральной Европе."
 HOL_nvu.26.a: "Железная дорога для общей судьбы."
 HOL_nvu.27.t: "Нидерландское предложение об объединении"
 HOL_nvu.27.d: "Нидерланды предложили полное объединение германских народов в одно государство. Нам предстоит решить, принять ли единство или остаться в стороне."
 HOL_nvu.27.a: "Мы принимаем союз"
 HOL_nvu.27.b: "Мы отвергаем их предложение"
 HOL_nvu.28.t: "Объединение принято"
 HOL_nvu.28.d: "Наше предложение об объединении принято. Под нидерландским началом рождается новая германская держава."
 HOL_nvu.28.a: "Мечта сбылась"
 HOL_nvu.29.t: "Объединение отвергнуто"
 HOL_nvu.29.d: "Наше предложение об объединении отвергнуто. Теперь нам решать, закончится ли Братство на этом или продолжится силой."
 HOL_nvu.29.a: "Значит, возьмём своё"
 HOL_common_event.18.t: "Sabaton в Национальном военном музее"
 HOL_common_event.18.d: "Национальный военный музей в Сустерберге провёл показы фильма Sabaton «The War To End All Wars», на которых лично присутствовал сооснователь группы Пэр Сундстрём. Визит открыл историю Великой войны широкой новой аудитории и привлёк свежее внимание к нашему военному наследию."
 HOL_common_event.18.a: "Наша военная история вдохновляет новое поколение."
 HOL_ing_group_strategy_category: "Стратегии группы ING"
 HOL_ing_group_strategy_category_desc: "\n£ing_bank_category_picture \n\n\n\nМировая экономика ходит кругами от роста к спаду и обратно, и ING готов обратить эти колебания себе на пользу. Рядом выверенных финансовых ходов банк способен расширить влияние на внутреннем и внешних рынках, направляя и восстановление, и подъём. Эти решения дают Нидерландам возможность использовать финансовый вес банка, чтобы подстёгивать рост, управлять рисками и извлекать наибольшую отдачу из вложений. Меняя кредитную политику, поощряя потребительские траты и расширяя мировые торговые сети, ING не только укрепит своё положение на рынке, но и закрепит за Нидерландами славу финансовой державы."
 HOL_ing_group_strategies_expansion_GER: "Deutsche ING"
 HOL_ing_group_strategies_expansion_GER_desc: "§Y[GER.GetNameWithFlag]§! была для ING одним из основных рынков, где банк много вложил в розничные услуги и корпоративные финансы. Расширение работы здесь ещё прочнее закрепит его положение в европейском банковском секторе."
 HOL_ing_group_strategies_expansion_POL: "ING Bank Śląski"
 HOL_ing_group_strategies_expansion_POL_desc: "ING прочно закрепился в §Y[POL.GetNameWithFlag]§! через ING Bank Śląski. Дальнейшее расширение на этом быстрорастущем рынке усилит влияние банка в Центральной и Восточной Европе."
 HOL_ing_group_strategies_expansion_AST: "ING Direct Australia"
 HOL_ing_group_strategies_expansion_AST_desc: "§Y[AST.GetAdjective]§! экономика, живущая новшествами, даёт ING возможность занять ведущее место в цифровом банкинге и исследованиях. Расширение работы в Австралии подстегнёт технологический рост ING и закрепит за ним положение лидера финтеха."
 HOL_ing_group_strategies_expansion_SPR: "ING España"
 HOL_ing_group_strategies_expansion_SPR_desc: "§Y[SPR.GetNameWithFlag]§! — живой рынок цифрового банкинга и вложений в инфраструктуру. Усилив присутствие в Испании, ING сможет воспользоваться ростом городской застройки и расширить портфель кредитов на строительство."
 HOL_ing_group_strategies_expansion_ITA: "ING Italia"
 HOL_ing_group_strategies_expansion_ITA_desc: "§Y[ITA.GetNameWithFlag]§! предлагает зрелый финансовый рынок с возможностями роста в корпоративном банкинге. Выход в Италию поможет ING прочнее закрепиться в Южной Европе и ускорит рост хозяйства."
 HOL_ing_group_strategies_expansion_TUR: "ING Bank Turkey"
 HOL_ing_group_strategies_expansion_TUR_desc: "§Y[TUR.GetAdjective]§! положение между Европой и Азией даёт ING редкую возможность расширить своё торговое и финансовое влияние. Вложения в Турцию заметно увеличат объём торгового финансирования банка."
 HOL_ing_group_strategies_expansion_USA: "ING U.S. Investment Management"
 HOL_ing_group_strategies_expansion_USA_desc: "§Y[USA.GetNameWithFlag]§!, крупнейшая экономика мира, открывает перед ING огромные возможности, прежде всего в управлении инвестициями. Выход в США закрепит за банком место крупного мирового игрока в управлении активами."
 HOL_ing_group_strategies_expansion_ROM: "ING Bank Romania"
 HOL_ing_group_strategies_expansion_ROM_desc: "§Y[ROM.GetAdjective]§! развивающийся рынок даёт ING возможность поддержать инфраструктуру и рост хозяйства. Новые вложения в Румынию усилят влияние банка в растущем финансовом секторе Восточной Европы."
 HOL_ing_group_strategies_expansion_speciality1: "ING Digital First"
 HOL_ing_group_strategies_expansion_speciality1_desc: "Мир всё увереннее переходит к цифровым решениям, и через стратегию Digital First ING может закрепить за собой место лидера цифрового банкинга. Ставка на это направление усилит кибербезопасность, снизит издержки на операции и повысит отдачу цифровых услуг."
 HOL_ing_group_strategies_expansion_speciality2: "ING Terra Approach"
 HOL_ing_group_strategies_expansion_speciality2_desc: "Стремясь привести свои вложения в соответствие с мировыми климатическими целями, ING в рамках подхода Terra финансирует проекты зелёной энергетики и устойчивого развития. Ставка на устойчивые финансы увеличит генерацию зелёной энергии и привлечёт вложения тех, кому небезразлична природа."
 HOL_ing_group_strategies_expansion_speciality3: "ING Wholesale Banking"
 HOL_ing_group_strategies_expansion_speciality3_desc: "Корпоративные клиенты — одно из главных направлений ING. Сделав ставку на оптовый банкинг, ING сможет полнее предлагать крупным предприятиям решения под заказ, питая их рост и собственную выручку."
 HOL_ing_group_strategies_expansion_speciality4: "ING Wealth Services"
 HOL_ing_group_strategies_expansion_speciality4_desc: "Управление состоянием даёт высокую отдачу и долгие отношения с клиентами. Ставка на это направление позволит ING работать с состоятельными клиентами, увеличивая налоговые поступления с доходов от капитала и расширяя услуги частным лицам."
 HOL_carrier_production: "Программа приобретения авианосцев"
 HOL_carrier_production_desc: "\n£hol_carrier_program_decision_category \n\n\n\nНидерланды стремятся расширить возможности флота, приобретая авианосцы у других государств. Эти решения позволят нам усилить флот и проецировать силу через моря с помощью стратегических партнёрств и военных закупок."
 HOL_request_carrier_production_uk: "Попросить у Британии помощи в постройке авианосца"
 HOL_request_carrier_production_uk_desc: "У Королевского флота века морского опыта, а его современные авианосцы типа Queen Elizabeth отражают передовые кораблестроительные решения. Партнёрство с Великобританией позволило бы нам вместе создать корабль под нидерландские экспедиционные задачи и операции НАТО."
 HOL_request_carrier_production_chn: "Попросить у Китая помощи в постройке авианосца"
 HOL_request_carrier_production_chn_desc: "Стремительный рост китайского флота сделал Китай мировой судостроительной державой. Опора на его промышленные масштабы и современные военные проекты позволила бы нам получить авианосец с особыми возможностями, хотя такое сближение может осложнить отношения с западными партнёрами."
 HOL_request_carrier_production_dutch: "Вложиться в постройку авианосца своими силами"
 HOL_request_carrier_production_dutch_desc: "Нидерланды начнут постройку собственного авианосца на отечественных верфях силами нидерландских инженеров. Это дольше и дороже, чем с иностранной помощью, но укрепляет суверенитет страны и поддерживает наше судостроение."
 HOL_influence_flanders: "Влияние в §Y[FLN.GetNameWithFlag]§!"
 HOL_influence_flanders_desc: "Глубокие культурные и исторические связи между §Y[HOL.GetNameWithFlag]§! и §Y[FLN.GetNameWithFlag]§! открывают редкую возможность склонить эту область к сближению с нидерландским управлением. §Y[HOL.GetNameWithFlag]§! намерены постепенно усиливать своё влияние в §Y[FLN.GetNameWithFlag]§!, что может привести к полному объединению.\n\nПо мере роста влияния §Y[FLN.GetNameWithFlag]§! может всё больше отдаляться от §Y[BEL.GetNameWithFlag]§!, а вероятность объединения с Нидерландами — расти. Однако §Y[BEL.GetNameWithFlag]§! способна противодействовать этому влиянию, перечёркивая нидерландские усилия и укрепляя связи §Y[FLN.GetNameWithFlag]§! с нынешним правительством."
 HOL_high_influence_belgium: "Высокое §Y[HOL.GetAdjective]§! влияние в §Y[BEL.GetNameWithFlag]§!"
 HOL_high_influence_belgium_desc: "Наше влияние в §Y[FLN.GetNameWithFlag]§! достигло заметного уровня и питает поддержку объединения с §Y[HOL.GetNameWithFlag]§!."
 HOL_voc_category: "Наследие VOC возрождается"
 HOL_voc_category_desc: "\n£hol_voc_category_picture \n\n\n\nНидерландская Ост-Индская компания, или Vereenigde Oostindische Compagnie (VOC), была когда-то могущественнейшей торговой державой мира. Её флоты правили морями, её купцы держали в руках мировую торговлю пряностями, а её управители выкроили колониальную империю на нескольких континентах. Теперь, в наши дни, §Y[HOL.GetNameWithFlag]§! может возродить это славное наследие. Опираясь на §Y[HOL.GetFlag][HOL.GetAdjective]§! опыт в торговле, дипломатии и новшествах, VOC способна подняться вновь — не как памятник прошлому, а как сила, творящая будущее.\n\n §Y[IND.GetNameWithFlag]§! — наш особый замысел. Чтобы вернуть себе коронную колонию, нам нужно подготовить вторжение. Для его успеха нужно как можно быстрее захватить плацдарм. Подготовку можно начать, но §Rвероятность обнаружения§! надо держать как можно ниже. Иначе нас раскроют, и высадка станет очень трудной.\n\n Наше нынешнее положение:\n §GСила§! в §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_strength|+]\n §RВероятность обнаружения§! на §Yострове Ява§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|-] \n §GСила§! на §Yострове Суматра§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_strength|+]\n §RВероятность обнаружения§! на §Yострове Суматра§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|-] \n §GСила§! на §YКалимантане§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_strength|+]\n §RВероятность обнаружения§! на §YКалимантане§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|-]"
 HOL_voc_category_ind: "§Y[HOL.GetFlag][HOL.GetAdjective]§! угроза для §Y[IND.GetNameWithFlag]§!"
 HOL_voc_category_ind_desc: "§Y[HOL.GetFlag][HOL.GetAdjective]§! объявили, что пойдут на всё ради возвращения своей колониальной империи. Нам нужно готовиться к этой нависшей угрозе, ведь так просто нас не сломить! Повысить вероятность раскрыть их замыслы можно, усилив разведку против §Y[HOL.GetFlag][HOL.GetAdjective]§! и вложившись в нашу §YСлужбу безопасности§!. \n\n Нынешняя вероятность раскрыть приготовления §Y[HOL.GetFlag][HOL.GetAdjective]§!: \n\n§GВероятность обнаружения§! на §Yострове Ява§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|+]\n§GВероятность обнаружения§! на §Yострове Суматра§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|+]\n§GВероятность обнаружения§! на §Yострове Калимантан§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|+]"
 HOL_wic_category: "Дерзкий рубеж WIC"
 HOL_wic_category_desc: "\n£hol_wic_category_picture \n\n\n\nГолландская Вест-Индская компания (WIC) была воплощением дерзости и честолюбия: её корабли уходили в неизведанные воды, чтобы утвердить голландское влияние в Америке и Западной Африке. От сахарных плантаций Суринама до торговых узлов Карибского моря и африканского Золотого Берега компания выстроила колониальную империю торговлей, войной и изобретательностью. Дни её славы прошли, но наследие осталось — свидетельство голландской стойкости и дальновидности."
 HOL_core_german_state_schleswig_holstein: "Присоединить Шлезвиг-Гольштейн"
 HOL_core_german_state_schleswig_holstein_desc: "Эта земля важна и культурно, и стратегически. Полное вхождение в нидерландское государство усилит наше влияние в германском мире."
 HOL_core_german_state_niedersachsen: "Присоединить Нижнюю Саксонию"
 HOL_core_german_state_niedersachsen_desc: "Эта земля образует северный хребет Германии. Её присоединение упрочило бы наш контроль над нижненемецким сердцем страны."
 HOL_core_german_state_nordrhein_westfalen: "Присоединить Северный Рейн — Вестфалию"
 HOL_core_german_state_nordrhein_westfalen_desc: "Одна из самых промышленно развитых земель Европы: её присоединение усилит наше хозяйственное и стратегическое положение."
 HOL_core_german_state_rheinland_pfalz: "Присоединить Рейнланд-Пфальц"
 HOL_core_german_state_rheinland_pfalz_desc: "Взяв эту землю под свою руку, мы продолжим наше историческое и культурное присутствие вдоль Рейна."
 HOL_core_german_state_hessen: "Присоединить Гессен"
 HOL_core_german_state_hessen_desc: "Гессен связывает запад и центр Германии. Его присоединение служит единству страны."
 HOL_core_german_state_baden_wurttemberg: "Присоединить Баден-Вюртемберг"
 HOL_core_german_state_baden_wurttemberg_desc: "Богатая и сильная земля: присоединение Баден-Вюртемберга укрепляет наши притязания на главенство в Южной Германии."
 HOL_core_german_state_bayern: "Присоединить Баварию"
 HOL_core_german_state_bayern_desc: "Исторически особая, но, бесспорно, ключевая для Германии, Бавария своим присоединением расширяет наше влияние на южные земли."
 HOL_core_german_state_sachsen: "Присоединить Саксонию"
 HOL_core_german_state_sachsen_desc: "Саксония издавна была средоточием немецкой культуры и промышленности. Её присоединение прибавляет нам и наследия, и возможностей."
 HOL_core_german_state_berlin: "Присоединить Берлин"
 HOL_core_german_state_berlin_desc: "Как бывшая столица Пруссии и Германии, Берлин необходим нам и символически, и стратегически."
 HOL_core_german_state_steiermark: "Присоединить Штирию"
 HOL_core_german_state_steiermark_desc: "Исторически связанная с Австрией, Штирия своим присоединением укрепляет наше присутствие в альпийском германском мире."
 HOL_core_german_state_austria_proper: "Присоединить собственно Австрию"
 HOL_core_german_state_austria_proper_desc: "В сердце габсбургского наследия лежит сама Австрия. Её присоединение утверждает наше главенство над германским миром."
 HOL_core_german_state_tirol: "Присоединить Тироль"
 HOL_core_german_state_tirol_desc: "Горы Тироля ценны стратегически и близки культурно. Приняв их к себе, мы закрепим за собой альпийский рубеж."
 HOL_core_german_state_mecklenburg: "Присоединить Мекленбург"
 HOL_core_german_state_mecklenburg_desc: "Северная приморская земля, без которой не удержать подступы к Балтике; её присоединение раздвигает пределы нидерландского флота."
 HOL_core_german_state_thuringen: "Присоединить Тюрингию"
 HOL_core_german_state_thuringen_desc: "Расположенная в центре и богатая культурой, Тюрингия своим присоединением укрепляет наши позиции в центральной Германии."
 HOL_core_german_state_franken: "Присоединить Франконию"
 HOL_core_german_state_franken_desc: "Присоединение этой раздробленной культурной области собирает германское наследие под одним знаменем."
 HOL_core_german_state_koln_bonn: "Присоединить Кёльн-Бонн"
 HOL_core_german_state_koln_bonn_desc: "Этот хозяйственный и культурный центр — краеугольный камень влияния в Западной Германии, и присоединить его необходимо."
 HOL_core_german_state_saarland: "Присоединить Саар"
 HOL_core_german_state_saarland_desc: "Пограничная земля со стратегическими ресурсами: присоединение Саара закрепляет за нами ворота во Францию."
 HOL_core_german_state_sachsen_anhalt: "Присоединить Саксонию-Анхальт"
 HOL_core_german_state_sachsen_anhalt_desc: "Присоединение Саксонии-Анхальт усиливает наш контроль над центральной Германией и её промышленной базой."
 HOL_core_german_state_brandenburg: "Присоединить Бранденбург"
 HOL_core_german_state_brandenburg_desc: "Былое средоточие прусской мощи, Бранденбург — важнейший шаг к восстановлению германского главенства."
 HOL_core_german_state_hamburg: "Присоединить Гамбург"
 HOL_core_german_state_hamburg_desc: "Как мировой порт и хозяйственный узел, Гамбург своим присоединением закрепляет наше торговое господство в Северной Европе."
