 the_great_chip_race_modifier: "La grande course aux puces"
 the_great_chip_race_modifier_desc: "Nous sommes en course avec la Chine pour maintenir notre supériorité dans la production de microprocesseurs. Les bénéfices commerciaux que nous tirons de cet avantage sont indispensables pour soutenir nos alliances et notre position dans le monde.\n\nÀ mesure que la production de microprocesseurs de la RPC augmente, Taïwan gagnera un $production_speed_microchip_plant_factor$ accru et un $local_resources_microchips_factor$ accru."
 tsmc_modifier: "Entreprise de fabrication de semi-conducteurs de Taiwan"
 tsmc_modifier_desc: "La Semiconductor Manufacturing Company d'État de Taïwan mène l'industrie mondiale des semi-conducteurs depuis des décennies, donnant le rythme en capacité de production, recherche de nœuds de procédé et expansion internationale."
