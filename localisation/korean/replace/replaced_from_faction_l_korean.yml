 NATO_member: "NATO 회원국"
 NATO_member_desc: "The North Atlantic Treaty Organization (NATO) is a defensive alliance composed of the US, Canada, and several European countries. Starting as a mere political alliance, NATO quickly grew into an anti-Soviet military alliance. After the breakup of the Soviet Union, NATO has taken an increasingly interventionist role in the world. However, the main purpose of the alliance still is to defend its member countries, and attacking one member state is an attack against all."
 NATO_member_tooltip: "§CNATO 세력 특수 조건§!:\n- 오직 §Y세력의 맹주§!만이 §Y독립 보장§!을 할 수 있음\n- 오직 £defence_texticon §C방어 전쟁§!에만 참전 가능함\n- 세력 가입 및 탈퇴 절차는 §Y디시전과 이벤트§!로만 가능"
 NATO_guarantee_rule_tt: "§R오직 세력의 맹주만이 다른 국가에 독립 보장을 할 수 있습니다!§!"
 NATO_call_ally_rule_tt: "§RNATO 회원국은 오직 방어 전쟁에만 동맹국을 호출할 수 있습니다!§!"
 NATO_join_ally_rule_tt: "§RNATO 회원국은 오직 방어 전쟁에만 참전할 수 있습니다!!§!"
 NATO_join_faction_rule_tt: "§RNATO는 디시전을 통한 기존의 방식으로 가입할 수 없습니다!§!"
 NATO_offer_join_faction_rule_tt: "§R다른 국가들은 디시전을 통한 기존의 방식으로 NATO에 초청될 수 없습니다!§!"
 NATO_kick_from_faction_rule_tt: "§RNATO 회원국은 디시전을 통한 기존 방식으로 세력에서 쫓겨날 수 없습니다§!"
 NATO_leave_faction_rule_tt: "§RNATO 회원국은 디시전을 통한 기존 방식으로 세력에서 탈퇴할 수 없습니다§!"
 NATO_dismantle_faction_rule_tt: "§RNATO는 해체할 수 없습니다.§!"
 faction_resistance_axis_member: "저항 추축국"
 faction_resistance_axis_member_desc: "저항의 축은 이란, 시리아, 헤즈볼라(이후 이라크 시아파 민병대와 후티 반군)간의 비공식 동맹을 의미합니다. 중동에서 이스라엘과 사우디등 서구권의 영향력에 반대하는 국가의 모임입니다."
 faction_resistance_axis_member_TT: "§C세력 특수 조건§!:\n- 오직 시아파 국가들만 가입이 가능함"
 resistance_axis_join_faction_rule_tt: "§R시아파 국가만이 저항의 축에 가입할 수 있습니다.§!"
 resistance_axis_offer_join_faction_rule_tt: "§R시아파 국가만이 저항의 축에 가입할 수 있습니다.§!"
 CSTO_member: "CSTO 회원국"
 CSTO_member_desc: "집단안보조약기구 (CSTO)는 과거 소련의 영향권에 있었던 국가들로 구성된 군사 방어 동맹입니다. 이 기구는 소련의 해체 이후 구소련 국가들이 그들의 결속을 온전히 보전하기 위해 서로 연방을 형성하면서 처음 결성되었습니다. 현재 이는 결국 하나의 군사 동맹으로써 진화하였습니다."
 CSTO_member_tooltip: "§R세력 주의 사항§!:\n- 옛 소비에트 연방의 일원이었던 국가들만 가입이 가능함\n- 모든 국가들은 £defence_texticon §R방어 전쟁§!에만 참전할 수 있음"
 CSTO_call_ally_rule_tt: "§RCSTO 회원국은 오직 방어 전쟁에만 동맹국을 호출할 수 있습니다!§!"
 CSTO_join_ally_rule_tt: "§RCSTO 회원국은 오직 방어 전쟁에만 참전할 수 있습니다!!§!"
 CSTO_join_faction_rule_tt: "§R오직 구소련 국가들만이 집단안보조약기구 (CSTO)에 가입할 수 있습니다!§!"
 CSTO_offer_join_faction_rule_tt: "§R오직 구소련 국가들만이 집단안보조약기구 (CSTO)에 초청될 수 있습니다!§!"
 faction_fifth_international_member: "제5인터내셔널"
 faction_fifth_international_member_desc: "The 5th International has been founded as a successor to Trotsky's 4th International and Stalin's 3rd International in order to unite all the world's communists against the capitalist threat."
 faction_baltic_black_sea_union_member: "발트해-흑해 연방"
 faction_baltic_black_sea_union_member_desc: "발트해-흑해 연방 (Baltic-Black Sea Union)은 발트해와 흑해의 국가 연합을 표방한 '미엔지모제 (Intermarium)' 계획을 계승한 국가 연합입니다. 발트해와 흑해 국가들의 동맹으로써, 그들은 서방 세계와 동방 세계의 완충지대 역할을 수행할 것입니다."
 Jerusalem_Defence_Pact: "예루살렘 방위 협정"
 idea_gcc_member_state: "걸프 협력 회의 회원국"
 idea_gcc_member_state_desc: "The GCC is a political and economic union of all the Arab Monarchies in the Persian Gulf."
 idea_gcc_member_state_TT: "§R세력 주의 사항§!:\n- §Y탄탄한 동맹§!이 완료된 후, 걸프협력회의 (GCC)에 소속된 국가들만 가입이 가능함"
 gcc_member_state_join_faction_rule_tt: "§R오직 걸프 협력 회의 회원국들만이 걸프 협력 회의 세력에 가입할 수 있습니다!§!"
 gcc_member_state_offer_join_faction_rule_tt: "§R오직 걸프 협력 회의 회원국들만이 걸프 협력 회의 세력에 가입할 수 있습니다!§!"
 sco_member: "상하이 협력 기구 회원국"
 sco_member_desc: "상하이 협력 기구(SCO)는 중국을 대표로 하여 중국, 카자흐스탄, 키르기스탄, 러시아, 타지기스탄, 우즈베키스탄의 대표자들이 2001년 6월 15일 중국 상하이에서 출범시킨 유라시아 정치, 경제, 안보 조직입니다."
 sco_member_econ_desc: "상하이 협력 기구(SCO)는 중국을 대표로 하여 중국, 카자흐스탄, 키르기스탄, 러시아, 타지기스탄, 우즈베키스탄의 대표자들이 2001년 6월 15일 중국 상하이에서 출범시킨 유라시아 정치, 경제, 안보 조직입니다."
 sco_member_pol_desc: "상하이 협력 기구(SCO)는 중국을 대표로 하여 중국, 카자흐스탄, 키르기스탄, 러시아, 타지기스탄, 우즈베키스탄의 대표자들이 2001년 6월 15일 중국 상하이에서 출범시킨 유라시아 정치, 경제, 안보 조직입니다."
 sco_member_mil_desc: "상하이 협력 기구(SCO)는 중국을 대표로 하여 중국, 카자흐스탄, 키르기스탄, 러시아, 타지기스탄, 우즈베키스탄의 대표자들이 2001년 6월 15일 중국 상하이에서 출범시킨 유라시아 정치, 경제, 안보 조직입니다."
 sco_member_tooltip: "§R세력 주의 사항§!:\n- 중국은 그들의 세력을 해체시킬 수 없음\n- 중국은 오직 상하이 협력 기국 (SCO)에 소속된 다른 국가들만 세력 초대를 할 수 있음\n- 일반적인 상하이 협력 기구 (SCO) 소속 국가들은 다른 세력에 가입 가능함"
 sco_member_dismantle_faction_rule_tt: "§R중국은 상하이 조약을 해체할 수 없습니다!§!"
