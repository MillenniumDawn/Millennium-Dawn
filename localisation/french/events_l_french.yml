 UN.300.t: "Perte des §Gsubventions§! de l'§YOrganisation pour l'éducation, la science et la culture§!"
 UN.300.d: "À la suite de l'examen budgétaire annuel du comité budgétaire de l'§YOrganisation pour l'éducation, la science et la culture§!, il a été déterminé que nous ne remplissons plus les conditions pour recevoir les §Gsubventions§! de l'§YOrganisation pour l'éducation, la science et la culture§!. En conséquence, nous n'avons plus accès au programme de subventions. Nous pourrons postuler à nouveau à l'avenir si nous remplissons les conditions."
 UN.300.a: "D'accord"
 UN.301.t: "Perdu : §YOrganisation de développement industriel§! §Gsubventions§!"
 UN.301.d: "À la suite de l'examen budgétaire annuel du comité budgétaire de l'§YOrganisation pour le développement industriel§!, il a été déterminé que nous ne remplissons plus les conditions pour recevoir les §Gsubventions§! de l'§YOrganisation pour le développement industriel§!. En conséquence, nous n'avons plus accès au programme de subventions. Nous pourrons postuler à nouveau à l'avenir si nous remplissons les conditions."
 UN.301.a: "D'accord"
 UN.302.t: "Perdu : §YFonds de développement du capital§! §Gsubventions§!"
 UN.302.d: "À la suite de l'examen budgétaire annuel du comité budgétaire du §YFonds de développement du capital§!, il a été déterminé que nous ne remplissons plus les conditions pour recevoir les §Gsubventions§! du §YFonds de développement du capital§!. En conséquence, nous n'avons plus accès au programme de subventions. Nous pourrons postuler à nouveau à l'avenir si nous remplissons les conditions."
 UN.302.a: "D'accord"
 recognition.16.t: "Reconnaître [FROM.GetName] ?"
 recognition.16.d: "[FROM.GetNameDef] demande formellement notre reconnaissance diplomatique. Quelle que soit notre réponse, elle sera lue comme une prise de position sur leur souveraineté."
 recognition.16.a: "Nous ne sommes pas prêts à les reconnaître."
 recognition.16.b: "Nous reconnaissons [FROM.GetName] comme État souverain."
 recognition.18.t: "Reconnaître [FROM.GetName] ?"
 recognition.18.d: "Le statut de [FROM.GetNameDef] est en question sur la scène mondiale. Chaque capitale prend position. Quelle est la nôtre ?"
 recognition.18.a: "Nous refusons de les reconnaître."
 recognition.18.b: "Nous reconnaissons la souveraineté de [FROM.GetName]."
 recognition.31.t: "[FROM.GetName] sollicite notre reconnaissance"
 recognition.31.d: "[FROM.GetNameDef] a déclaré l'indépendance de notre territoire et nous demande d'accepter la nouvelle réalité. Notre réponse définira nos relations avec eux et signalera notre position aux autres."
 recognition.31.a: "Nous ne reconnaîtrons jamais ce régime."
 recognition.31.b: "Nous reconnaissons l'indépendance de [FROM.GetName]."
 UNSC.10.t: "Résolution du Conseil de sécurité adoptée"
 UNSC.10.d: "Le Conseil de sécurité des Nations unies a voté l'adoption d'une résolution concernant [?global.current_sc_vote_nation.GetNameWithFlag]. [?global.current_sc_vote_nation.UNSCGetResolutionTypePassDesc]"
 UNSC.10.a: "Noté."
 UNSC.11.t: "Résolution du Conseil de sécurité concernant [This.GetNameWithFlag]"
 UNSC.11.d: "Le Conseil de sécurité des Nations unies a voté l'adoption d'une résolution concernant [This.GetNameWithFlag]. [UNSCGetResolutionTypePassDesc]"
 UNSC.11.a: "Nous prenons acte de l'adoption de cette résolution."
 UNSC_pass_type_1_desc: "Une résolution de pression a été adoptée, exigeant la cessation de toutes les opérations militaires offensives dans un délai de §Y210 jours§!. Le non-respect entraînera de nouvelles sanctions."
 UNSC_pass_type_2_desc: "Une résolution de sanctions économiques a été adoptée, imposant des pénalités commerciales et de recherche jusqu'à la fin de la menace offensive pour la paix mondiale."
 UNSC_pass_type_3_desc: "Une résolution restreignant les volontaires étrangers a été adoptée. Toute nation qui enverra des volontaires militaires en violation de cette résolution fera face à des sanctions supplémentaires."
 UNSC_pass_type_4_desc: "Une résolution d'embargo sur les armes a été adoptée, coupant l'accès au marché international de l'armement jusqu'à la fin de tous les conflits offensifs."
 COVID_events.0.t: "Un nouveau virus"
 COVID_events.0.d: "Un nouveau virus est apparu à Wuhan. Plusieurs médecins signalent une maladie respiratoire qui se propage rapidement parmi la population locale. Les cas sont passés de quelques unités à des dizaines en moins d'une semaine."
 COVID_events.0.a: "Gardons un œil attentif là-dessus."
 COVID_events.1.t: "Médecins lanceurs d’alerte"
 COVID_events.1.d: "Plusieurs médecins ont commencé à partager des rapports sur le nouveau virus sur les réseaux sociaux, le comparant au SRAS. Les autorités locales veulent des consignes. Nous pouvons faire taire les rapports pour éviter la panique, ou les laisser circuler au risque d'alarmer le public."
 COVID_events.1.a: "Faites-les taire."
 COVID_events.1.b: "Que la vérité éclate."
 COVID_events.2.t: "Pandémie confirmée"
 COVID_events.2.d: "L'Organisation mondiale de la santé a confirmé le nouveau coronavirus comme urgence sanitaire mondiale. Les hôpitaux sont débordés et le virus se propage au-delà de nos frontières. Cela remodelera notre économie pour des années."
 COVID_events.2.a: "Préparez-vous au choc."
 COVID_events.3.t: "L’émergence du COVID-19"
 COVID_events.3.d1: "Un nouveau coronavirus mortel s'est répandu depuis la Chine, où les autorités ont d'abord étouffé les rapports sur l'épidémie. La réponse tardive a laissé le virus se propager sans contrôle à travers les frontières."
 COVID_events.3.d2: "Un nouveau coronavirus mortel originaire de Chine a été déclaré pandémie mondiale. Malgré les alertes précoces de médecins chinois, le virus s'est répandu rapidement à travers les frontières."
 COVID_events.3.a: "Préparer notre réponse."
 COVID_events.4.t: "La pandémie atteint [This.GetName]"
 COVID_events.4.d: "Des cas de COVID-19 ont été confirmés sur notre territoire. Les hôpitaux se préparent à un afflux de patients et la peur du public monte. L'activité économique s'arrête à mesure que les citoyens s'isolent."
 COVID_events.4.a: "Verrouillez tout."
 COVID_events.5.t: "Effondrement des chaînes d’approvisionnement mondiales"
 COVID_events.5.d: "La pandémie a dévasté le commerce international. Fermetures d'usines, arrêts de ports et goulets d'étranglement des transports ont créé de graves pénuries de composants et de matières premières dans le monde entier."
 COVID_events.5.a: "Stocker tout ce qui reste."
 pandemic_events.1.t: "Pandémie de grippe porcine"
 pandemic_events.1.d: "Une nouvelle souche de grippe H1N1 a été identifiée au Mexique, se propageant rapidement dans la population. L'Organisation mondiale de la santé suit de près la situation alors que les cas se multiplient et que le virus menace de franchir les frontières."
 pandemic_events.1.a: "Donner l'alerte."
 pandemic_events.2.t: "Le H1N1 atteint [This.GetName]"
 pandemic_events.2.d: "Des cas de grippe porcine H1N1 ont été confirmés sur notre territoire. Moins mortel que craint initialement, le virus se propage toutefois rapidement et met sous tension les ressources sanitaires."
 pandemic_events.2.a: "Distribuer des masques et espérer le meilleur."
 pandemic_events.3.t: "Épidémie de MERS"
 pandemic_events.3.d: "Un nouveau coronavirus causant le syndrome respiratoire du Moyen-Orient a été identifié dans notre pays. Le virus semble se transmettre des chameaux à l'homme, avec un taux de létalité inquiétant chez les infectés. Les hôpitaux préparent des services d'isolement."
 pandemic_events.3.a: "Contenir l'épidémie."
 pandemic_events.4.t: "Épidémie d'Ebola en Afrique de l'Ouest"
 pandemic_events.4.d: "Une épidémie du virus Ebola a été confirmée en Guinée rurale. La fièvre hémorragique se propage dans les communautés à une vitesse terrifiante, submergeant les cliniques locales. Sans intervention immédiate, l'épidémie pourrait engloutir toute la région."
 pandemic_events.4.a: "Dieu nous aide tous."
 pandemic_events.5.t: "Ebola se propage en [This.GetName]"
 pandemic_events.5.d: "Des cas d'Ebola ont été confirmés sur notre territoire alors que l'épidémie ouest-africaine brise le confinement. Les soignants sont exposés à un risque extrême et les organisations d'aide internationale s'empressent de réagir."
 pandemic_events.5.a: "Nous avons besoin d'aide. Maintenant."
 pandemic_events.6.t: "Ebola revient au Congo"
 pandemic_events.6.d: "Une nouvelle épidémie d'Ebola a éclaté dans les provinces orientales de la République démocratique du Congo. Le conflit armé dans la région complique le confinement, les soignants étant attaqués par des milices méfiantes envers les étrangers."
 pandemic_events.6.a: "Déployer des équipes sanitaires sous escorte armée."
 pandemic_events.7.t: "Cas de MERS en [This.GetName]"
 pandemic_events.7.d: "Des cas de syndrome respiratoire du Moyen-Orient ont été détectés dans notre pays, probablement apportés par des voyageurs d'Arabie saoudite. Les autorités sanitaires mettent en place des protocoles de dépistage dans les aéroports et les hôpitaux."
 pandemic_events.7.a: "Filtrez chaque voyageur."
 pandemic_events.8.t: "Cas d'Ebola en [This.GetName]"
 pandemic_events.8.d: "Des cas d'Ebola ont franchi la frontière depuis la République démocratique du Congo. Les mouvements transfrontaliers rendent le confinement extrêmement difficile, et les soignants s'empressent de retracer les contacts."
 pandemic_events.8.a: "Fermer les frontières immédiatement."
 pandemic_events.9.t: "Épidémie de MERS en Corée du Sud"
 pandemic_events.9.d: "Un seul patient de retour du Moyen-Orient a déclenché un événement super-propagateur hospitalier dévastateur. Le virus ravage les établissements de santé alors que patients et personnel le transmettent d'un service à l'autre. Plus d'une centaine de cas ont été confirmés et des dizaines de décès signalés, exposant de graves défaillances de nos protocoles de contrôle des infections."
 pandemic_events.9.a: "Fermer tous les hôpitaux touchés."
 influence.60.t: "Un coup d'État dans [event_target:coup_contest_victim.GetName]"
 influence.60.d: "Nos services de renseignement confirment ce que beaucoup soupçonnaient : [event_target:coup_contest_sender.GetNameWithFlag] a orchestré un §Rcoup d'État§! réussi en [event_target:coup_contest_victim.GetNameWithFlag], installant un nouveau régime qui leur est favorable. Nous détenons nous-mêmes une §Hinfluence§! significative en [event_target:coup_contest_victim.GetName], assez pour ne pas être impuissants, si nous choisissons d'agir. Nos options vont de la dénonciation diplomatique au soutien clandestin de l'ancien ordre. Chacune a un coût. Ne rien faire pourrait coûter davantage."
 influence.60.a: "Dénoncer publiquement et sanctionner [event_target:coup_contest_sender.GetName]"
 influence.60.f: "Imposer des §Hsanctions économiques§! ciblées à [event_target:coup_contest_sender.GetName]"
 influence.60.b: "Soutenir clandestinement l'ancienne opposition et pousser notre propre influence"
 influence.60.e: "§RIntervention militaire§! : armer la résistance et se positionner contre [event_target:coup_contest_sender.GetName]"
 influence.60.c: "Accepter la nouvelle réalité et passer à autre chose"
 influence.61.t: "Guerre civile en [event_target:coup_contest_victim.GetName]"
 influence.61.d: "La tentative de coup d'État de [event_target:coup_contest_sender.GetNameWithFlag] a explosé au visage de ses auteurs : [event_target:coup_contest_victim.GetNameWithFlag] est en §Rguerre civile§!, et l'ancien régime combat encore. Notre §Hinfluence§! nous donne un véritable enjeu dans l'issue. Armer l'ancien gouvernement peut empêcher [event_target:coup_contest_sender.GetName] de consolider ses gains. N'envoyer que de l'argent, c'est se couvrir. S'engager pleinement, c'est tirer les ficelles. Rester à l'écart, c'est laisser les autres décider."
 influence.61.a: "Armer l'ancien régime : armes, équipement et soutien politique"
 influence.61.b: "Envoyer discrètement une aide économique pour maintenir l'ancien régime à flot"
 influence.61.e: "§RIntervention militaire totale§! : s'engager pour la victoire de l'ancien régime"
 influence.61.c: "Rester hors de la guerre civile"
 News_influence.7.t: "[FROM.GetNameWithFlag] condamne [event_target:coup_contest_sender.GetNameWithFlag]"
 News_influence.7.d: "[FROM.GetNameWithFlag] a publié aujourd'hui une condamnation cinglante du rôle présumé de [event_target:coup_contest_sender.GetNameWithFlag] dans le récent coup d'État en [event_target:coup_contest_victim.GetNameWithFlag]. Protestations diplomatiques, §Hsanctions§! ciblées et durcissement des relations sont sur la table. Le ministère des Affaires étrangères de [event_target:coup_contest_sender.GetName] a rejeté les accusations comme un « théâtre politique sans fondement », mais l'opinion internationale se durcit rapidement."
 News_influence.7.a: "Un premier coup dans la guerre d'influence"
 News_influence.8.t: "[FROM.GetNameWithFlag] soutient l'ancienne opposition en [event_target:coup_contest_victim.GetName]"
 News_influence.8.d: "Des sources du renseignement confirment ce que les observateurs soupçonnaient depuis des semaines : [FROM.GetNameWithFlag] canalise discrètement des §Hfonds§! et un §Hsoutien politique§! vers l'opposition d'avant le coup en [event_target:coup_contest_victim.GetNameWithFlag]. Les factions démocratiques du pays sont soudain mieux organisées, mieux financées et nettement plus vocales. Le §Hrégime putschiste§! de [event_target:coup_contest_victim.GetName] a qualifié l'activité d'« intervention étrangère inacceptable ». La même qu'ils avaient menée pour prendre le pouvoir."
 News_influence.8.a: "La lutte pour [event_target:coup_contest_victim.GetName] n'est pas close"
 News_influence.9.t: "[FROM.GetNameWithFlag] arme l'ancien régime de [event_target:coup_contest_victim.GetName]"
 News_influence.9.d: "Alors que [event_target:coup_contest_victim.GetNameWithFlag] est plongé dans la §Rguerre civile§! après le coup d'État raté de [event_target:coup_contest_sender.GetNameWithFlag], [FROM.GetNameWithFlag] a abandonné toute pretention de neutralité. Des vols cargo depuis [FROM.GetName] atterrissent en territoire tenu par le gouvernement, chargés d'§Harmes légères§!, de §Hvéhicules§! et, selon plusieurs sources, de « conseillers » en uniforme. La guerre par procuration est désormais au grand jour."
 News_influence.9.a: "Un long combat à venir"
 News_influence.10.t: "[FROM.GetNameWithFlag] ouvre une intervention militaire au sujet de [event_target:coup_contest_victim.GetName]"
 News_influence.10.d: "Dans la réponse la plus escalatoire à ce jour au coup d'État de [event_target:coup_contest_sender.GetNameWithFlag] en [event_target:coup_contest_victim.GetNameWithFlag], [FROM.GetNameWithFlag] a annoncé une §Rintervention militaire§! formelle. Le langage est mesuré, le fond ne l'est pas : unités déployées en avant, ordres permanents d'assister le gouvernement d'avant le coup, et mépris ouvert du fait accompli de [event_target:coup_contest_sender.GetName]. Les marchés mondiaux sont en tumulte. Le Conseil de sécurité de l'ONU a été convoqué en session d'urgence."
 News_influence.10.a: "La ligne a été franchie"
 influence.52.e: "En fait, j'en ai besoin..."
 influence.52.a_preview_tt: "Envoyer des armes légères, des armes antichars légères et de l'équipement antiaérien"
 influence.52.b_preview_tt: "Envoyer des chars de combat principaux, des chars amphibies / spécialisés et des véhicules utilitaires"
 influence.52.e_preview_tt: "Envoyer des missiles antichars lourds, des missiles surface-air et des drones militaires"
 influence.57.t: "Quelle est la taille d'un colis ?"
 influence.57.d: "Nous avons décidé ce qu'envoyer. Il faut maintenant décider §Hcombien§!. Les paquets plus importants coûtent davantage de §Hcapital politique§!, génèrent plus de §Rtension mondiale§! et déclenchent une couverture internationale."
 influence.57.a: "Envoyer un colis §Hpetit§!"
 influence.57.b: "Envoyer un colis §Hmoyen§!"
 influence.57.c: "Envoyer un colis §Hgrand§!"
 influence.57.e: "Finalement, annuler"
 News_influence.11.t: "[FROM.FROM.GetName] envoie un important colis d'armes à [FROM.GetName]"
 News_influence.11.d: "[FROM.FROM.GetName] a annoncé un §Hlarge paquet d'aide militaire§! à [FROM.GetName] : des milliers d'armes légères, de véhicules et d'équipements de soutien. Les analystes notent que le transfert signale un durcissement de l'engagement de [FROM.FROM.GetName] envers la défense de [FROM.GetName]. Les rivaux sont furieux ; les alliés observent pour voir qui sera le suivant."
 News_influence.11.a: "Les armes continuent d'affluer"
 News_influence.12.t: "[FROM.FROM.GetName] transfère des armes avancées à [FROM.GetName]"
 News_influence.12.d: "Dans un transfert qui franchit toutes les lignes rouges du marché mondial de l'armement, [FROM.FROM.GetName] a livré des §Hmissiles antichars lourds§!, des §Hsystèmes surface-air§! et des §Hdrones de combat§! à [FROM.GetName]. Chacune de ces armes est du type qui transforme des escarmouches régionales en guerres. Les rivaux de [FROM.GetName] y voient une menace directe. Les lignes diplomatiques s'allument dans toutes les capitales."
 News_influence.12.a: "La guerre moderne vient de recevoir des armes modernes"
 influence.2.t: "Aide économique à [FROM.GetName]?"
 influence.2.d: "Nous avons décidé d'entamer la rédaction d'un paquet d'aide économique pour [FROM.GetName]. Nous pouvons transférer une somme fixe directement depuis notre Trésor. Cette générosité améliorera les relations et nous vaudra de l'influence en [FROM.GetName]. Plus nous donnons, plus nous gagnerons d'influence.\n\n"
 influence.2.a: "Envoyer §G25 milliards§! d'aide économique."
 influence.2.b: "Envoyer §G50 milliards§! d'aide économique."
 influence.2.c: "Envoyer §G75 milliards§! d'aide économique."
 influence.2.e: "Envoyer §G100 milliards§! d'aide économique."
 generic.5.f: "Nous nous en porterons mieux sans eux."
 ecuadornews.1.t: "Coup d'État militaire en Équateur"
 ecuadornews.1.d: "L'armée équatorienne est intervenue au milieu d'une profonde crise politique et économique, destituant le président Jamil Mahuad. Des officiers supérieurs, menés par le général Carlos Mendoza, ont pris le contrôle de la situation, écartant à la fois le gouvernement civil et la direction des protestations de la CONAIE. Les forces armées présentent le geste comme une mesure temporaire pour rétablir la stabilité, bien qu'il reste incertain à quelle vitesse le pouvoir civil reviendra, ni sous quelle forme."
 ecuadornews.1.a: "Intéressant."
 ecuadornews.2.t: "Coup d'État militaire en Équateur"
 ecuadornews.2.d: "La crise économique et les réformes controversées du gouvernement ont poussé l'Équateur à un point de rupture. Après des manifestations de masse menées par la Confédération des nationalités indigènes de l'Équateur (CONAIE) et la défection de plusieurs officiers subalternes, des dirigeants de l'opposition ont annoncé la formation d'une Junte de salut national. La junte proclamée se présente comme une direction tripartite censée symboliser l'unité nationale. Elle comprend le leader indigène Antonio Vargas, le juge civil Carlos Solórzano et le représentant militaire, le général Lucio Gutiérrez."
 ecuadornews.2.a: "Intéressant."
 ecuadornews.3.t: "Effondrement de la junte de salut national équatorienne"
 ecuadornews.3.d: "The attempt to form a civilian-military junta in Quito has failed. Despite mass protests and the occupation of Congress by CONAIE and allied groups, senior military command has refused to support the new government. General Carlos Mendoza has taken control of the situation, sidelining the protest leadership and ending the junta project. Without military backing, the coalition has quickly disintegrated with many of the plotters being arrested."
 ecuadornews.3.a: "Intéressant."
 ecuador.1.t: "Adopter le dollar"
 ecuador.1.d: "L'instabilité économique continue de saisir le pays après la crise financière de 1998-1999. Le président Jamil Mahuad propose de dollariser l'économie afin d'arrêter l'inflation et de rétablir la confiance dans le système financier. Dans le même temps, le gouvernement coupe plus de 60 % du budget des forces armées, détériorant gravement les relations avec l'armée."
 ecuador.1.a: "Pousser la dollarisation"
 ecuador.1.b: "Revenir sur certaines réformes radicales"
 ecuador.2.t: "Soulèvement à Quito"
 ecuador.2.d: "En réponse aux plans économiques du gouvernement, des foules indigènes affluent à Quito, exigeant la destitution du président Jamil Mahuad. Les manifestants occupent le Congrès et la Cour suprême, paralysant l'État et exposant l'incapacité du gouvernement à maintenir l'ordre. La pression montant dans la capitale, la loyauté des forces de sécurité et la survie de l'administration sont de plus en plus mises en question."
 ecuador.2.a: "Maintenir l'ordre"
 ecuador.3.t: "Gouvernement de salut national"
 ecuador.3.d: "Dans un geste purement symbolique, les dirigeants des protestations annoncent à la télévision nationale la création d'une soi-disant Junte de salut national, prétendant représenter la volonté du peuple. La déclaration reçoit un large soutien public et sape encore l'autorité du gouvernement civil. La junte est présentée comme dirigée par le général Carlos Mendoza"
 ecuador.3.a: "Le général Lucio Gutiérrez assume la direction"
 ecuador.3.b: "En avant"
 ecuador.4.t: "La junte à trois"
 ecuador.4.d: "La Junte de salut national proclamée est désormais présentée comme une direction tripartite censée symboliser l'unité nationale. Elle comprend le leader indigène Antonio Vargas, le juge civil Carlos Solórzano et le représentant militaire, le général Lucio Gutiérrez."
 ecuador.4.a: "Quelque chose de différent"
 ecuador.5.t: "Les commandants militaires supérieurs ne soutiennent pas le gouvernement"
 ecuador.5.d: "Si l'opinion publique soutient largement l'occupation du Congrès par la CONAIE et l'appel à la démission du président Mahuad, il y a peu d'appétit pour un pouvoir militaire direct. Conscient de cela, le général Carlos Mendoza écarte la coalition et prend le contrôle des négociations. Le haut commandement, étroitement lié aux élites politiques et économiques de l'Équateur, y compris des figures telles que León Febres Cordero, qui rejette d'emblée les plans de la junte et est encore influencé par la menace de sanctions économiques américaines, impose une rupture décisive avec la direction des protestations."
 ecuador.5.a: "Le général Mendoza cède le pouvoir à Gustavo Noboa"
 ecuador.5.b: "Ne démissionnez pas"
 recognition.45.t: "Assez de reconnaissances pour demander l'adhésion à l'ONU"
 recognition.45.d: "Assez d'États membres de l'ONU reconnaissent désormais notre souveraineté pour poursuivre de façon crédible un siège aux Nations unies. Nous pouvons pétitionner l'Assemblée générale pour adhésion."
 recognition.45.a: "Lancer la candidature."
 anti_bully.2.t: "Lassitude publique de la guerre"
 anti_bully.2.d: "Nous avons décidé que la guerre était notre meilleure ligne de conduite. Cependant, afin de conserver le soutien du peuple, nous devons soit gagner rapidement, soit pénétrer rapidement sur le territoire étranger. Le peuple marchera tant qu’il comprendra à quel point cette guerre est nécessaire. Les bottes défilent, les tambours battent, et le moment pour [From.GetName] d'entrer en guerre est à nos portes !\n\n§YCela déclenche le système de lassitude de guerre publique§!\n"
 anti_bully.2.a: "Nous devons gagner!"
 UNSC.12.t: "La résolution du Conseil de sécurité concernant [This.GetNameWithFlag] échoue"
 UNSC.12.d: "The United Nations Security Council has voted down the proposed resolution concerning [This.GetNameWithFlag]. It received [?global.security_council_vote_yes^num] of the [?global.un_sc_required_yes] required §GYes§! votes, and no veto was cast. A simple majority is not enough in the §YSecurity Council§!. No measures will be adopted at this time."
 UNSC.12.a: "Nous prenons note du résultat."
 UNSC.6.t: "Désarmement de [?global.current_sc_vote_nation.GetName]"
 UNSC.6.d: "Une résolution déclarant [?global.current_sc_vote_nation.GetName] en manquement matériel à ses obligations de désarmement est devant le Conseil de sécurité. Elle offre une dernière chance de se conformer et met en garde contre de graves conséquences à défaut.\n\nElle n'autorise pas le recours à la force, et les promoteurs le savent. Cette omission est le prix des voix dont ils ont besoin. Ce que la résolution leur achète n'est pas une permission, mais une légitimité, et si elle échoue ils n'auront ni l'une ni l'autre.\n\n$unsc_vote_pass_tt$"
 UNSC.7.t: "Exiger la reddition d'un terroriste recherché par [?global.current_sc_vote_nation.GetName]"
 UNSC.7.d: "Une résolution exigeant que [?global.current_sc_vote_nation.GetName] livre un terroriste recherché qui se terre sur son territoire est devant le Conseil de sécurité. Les preuves ont été déposées devant cette chambre, et la réponse du régime jusqu'ici a été le silence.\n\nSi la résolution est adoptée, [?global.current_sc_vote_nation.GetName] fera face à des sanctions des Nations unies jusqu'à satisfaction de l'exigence.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_6_desc: "Une résolution de désarmement a été adoptée, constatant un manquement matériel et mettant en garde contre de graves conséquences. Elle s'arrête avant d'autoriser la force."
 UNSC_pass_type_7_desc: "Une résolution exigeant la reddition d'un terroriste recherché a été adoptée. Les sanctions des Nations unies resteront en vigueur jusqu'à satisfaction de l'exigence."
 influence.62.t: "Des lobbyistes étrangers capturent notre gouvernement"
 influence.62.d: "Les présidents de commission qui réclamaient encore la session dernière des restrictions sur les capitaux étrangers se sont tus. Les ministères rappellent l'ambassade de [?var:ROOT.influence_lobbied_by.GetNameWithFlag] avant de nous rappeler, et les élus qui auraient dû mener la charge contre l'influence étrangère sont désormais sur des retraites que nous ne savons pas tracer. Rien d'illégal ne sera jamais prouvé, mais pour les mois à venir notre gouvernement n'a ni l'appétit ni les voix pour ce combat."
 influence.62.a: "Nous avons les mains liées"
 hongkong_news.10.t: "Hong Kong est annexée par la Chine"
 hongkong_news.10.d: "La Chine a formellement absorbé la région administrative spéciale de Hong Kong, mettant fin à son statut distinct. Les institutions et l'administration du territoire relèvent désormais du contrôle central direct de Pékin, [CHI.GetLeader] ayant décrit le geste comme l'aboutissement du retour de Hong Kong à la mère patrie."
 hongkong_news.10.a: "La Perle est rentrée au bercail."
 hongkong_news.10.b: "Une évolution significative."
 generic.6.a: "Ensemble, nous défendrons la démocratie."
 generic.6.b: "Nul ne peut nous résister !"
 generic.6.c: "La cause des travailleurs ne saurait rêver de meilleurs champions !"
 generic.6.e: "Nous mettrons nos divergences de côté, pour l'instant."
 generic.7.b: "Alors nous les écraserons aussi !"
 generic.7.c: "Leur révolution est corrompue !"
 generic.7.e: "Nos divergences étaient trop grandes."
 GLOBAL_angolan_civil_war_over: "La guerre civile angolaise est terminée"
 AFG_news.1.t: "La guerre civile en Afghanistan s'apaise"
 AFG_news.1.TAL.d: "Malgré les meilleurs efforts des forces armées afghanes et de leurs alliés occidentaux, les talibans ont pris le contrôle de toutes les grandes villes, y compris la capitale Kaboul. La plupart des responsables gouvernementaux se sont cachés ou exilés, y compris le président afghan [AFG.GetLeader], actuellement aux États-Unis.\n\nLe triomphe des talibans ne manquera pas d'accroître la fréquence des attentats dans la région et dans le monde."
 AFG_news.1.AFG.d: "Le gouvernement afghan a déclaré la victoire contre les talibans. La majorité des avant-postes et villes les plus solides ont été nettoyés de leur présence, et la plupart des combattants restants se sont enfuis de l'autre côté de la frontière, au Pakistan. Bien que les talibans ne soient plus réduits qu'à quelques poches et cellules, l'insurrection devrait durer encore de nombreuses années, à un niveau toutefois moindre.\n\nCette victoire a montré l'efficacité de l'armée afghane reconstruite, et la détermination du gouvernement afghan."
 AFG_news.1.a: "Intéressant"
 AFG_news.2.t: "L'Afghanistan revendique le Pachtounistan"
 AFG_news.2.d: "Due to a surge of violence in Pakistan, the Afghan government has strengthened their claims to the areas of Pakistan where Pashtuns live. The Durand Line (the contemporary border between Afghanistan and Pakistan) has long been a source of conflict between the two countries, as it transferred land from the Emirate of Afghanistan to Pakistan under British control.\n\nThe Pashtuns themselves living in the area don't seem to be overly excited over this development, as many are comfortable living inside Pakistan. It is likely that Afghanistan won't be able to press their claims other than by force."
 AFG_news.2.a: "Intéressant"
 AFG_news.3.t: "L'Afghanistan revendique le Balouchistan"
 AFG_news.3.d: "Alors que la crise s'aggrave au Pakistan, l'Afghanistan étend ses revendications. Aujourd'hui, le gouvernement afghan a annoncé que le Baloutchistan, en plus du Pachtounistan, fait partie intégrante de l'Afghanistan."
 AFG_news.3.a: "Une évolution inquiétante"
 AFG_news.4.t: "L'Afghanistan envahit le Pakistan"
 AFG_news.4.d: "Pour sécuriser sa revendication, l'Afghanistan a choisi une voie plus directe. Au nom de la sécurité des Pachtounes, des troupes ont commencé à franchir la frontière vers le Pakistan."
 AFG_news.4.a: "Une évolution inquiétante"
 AFG_news.5.t: "Les talibans unissent leurs forces"
 AFG_news.5.d: "Les talibans afghans et pakistanais ont décidé d'unir leurs forces contre des menaces communes. C'est un grand basculement de l'équilibre des puissances en Asie centrale."
 AFG_news.5.a: "Inquiétant."
 AFG_news.6.t: "Assassinat d'Ahmad Shah Massoud"
 AFG_news.6.d: "Ahmad Shah Massoud, the main leader of the Afghan resistance against the Taliban, has been assassinated by Al-Qaeda. Two members of Al-Qaeda, posing as journalists, set off explosives hidden in their equipment. Massoud was gravely wounded and evacuated in a military helicopter but he died of his wounds before reaching a hospital.\n\nKnown as the Lion of Panjshir, Massoud was a symbol of resistance first against the Soviet occupation, and then against the Taliban."
 AFG_news.6.a: "Une perte."
 AFG_events.3.t: "Assassinat d'Ahmad Shah Massoud"
 AFG_events.3.d: "Ahmad Shah Massoud, the Lion of Panjshir, was targeted today by a suicide bomber. Two members of Al-Qaeda, posing as journalists, set off explosives hidden in a camera and a battery pack. Massoud was gravely wounded, and was immediately evacuated from the scene in a military helicopter."
 AFG_events.3.a: "Prions Allah pour qu'il survive."
 AFG_events.4.t: "Les États-Unis exercent leur influence"
 AFG_events.4.d: "Les talibans ayant été vaincus, les États-Unis ont usé de leur influence pour peser sur les décisions de la Loya Jirga. Une nouvelle administration intérimaire a été formée."
 AFG_events.4.a: "Sont-ils meilleurs que les talibans ?"
 AFG_hostage_crisis.1.t: "Missionnaires sud-coréens pris en otage par les talibans"
 AFG_hostage_crisis.1.d: "Aujourd'hui, un groupe de missionnaires sud-coréens voyageant dans la province de Ghazni a été capturé par des militants talibans et est retenu en otage. Ils exigent la libération de prisonniers et le retrait de tous les soldats sud-coréens d'Afghanistan. \n\nNotre conseiller militaire a suggéré d'envoyer un groupe d'extraction pour sauver les otages, et la délégation sud-coréenne a envoyé un représentant pour négocier."
 AFG_hostage_crisis.1.a: "We can't trust the Taliban, send the extraction team."
 AFG_hostage_crisis.1.b: "The hostages' security is our priority, send the representative."
 AFG_hostage_crisis.2.t: "Otages libérés"
 AFG_hostage_crisis.2.d: "Nos forces spéciales ont pu s'infiltrer dans la cachette talibane et escorter les otages jusqu'au poste militaire le plus proche. \n\nLes missionnaires rentreront en Corée du Sud et nos soldats sont salués par les médias."
 AFG_hostage_crisis.2.a: "Mission terminée."
 AFG_hostage_crisis.3.t: "Otages tués lors de la tentative de sauvetage"
 AFG_hostage_crisis.3.d: "Des militants talibans ont aperçu nos forces spéciales pénétrer dans leur cachette et ont exécuté les otages sur-le-champ. \n\nAprès le combat, nos soldats ont pu quitter le bâtiment, sans les otages."
 AFG_hostage_crisis.3.a: "La mission a échoué."
 AFG_hostage_crisis.4.t: "Les talibans exigent la libération de prisonniers"
 AFG_hostage_crisis.4.d: "Le représentant est revenu avec les exigences des talibans : la libération de tous les détenus talibans des prisons nord-américaines est la principale demande."
 AFG_hostage_crisis.4.a: "Demander la libération des prisonniers."
 AFG_hostage_crisis.4.b: "Nous ne libérerons pas des criminels de guerre !"
 AFG_hostage_crisis.5.t: "Les talibans exigent le retrait sud-coréen"
 AFG_hostage_crisis.5.d: "Les talibans ont exigé le retrait de toutes nos forces et le paiement d'une rançon pour la libération de nos citoyens."
 AFG_hostage_crisis.5.a: "Nous devons accepter."
 AFG_hostage_crisis.5.b: "Nous ne négocierons pas avec des terroristes !"
 AFG_hostage_crisis.6.t: "Les États-Unis rejettent notre demande"
 AFG_hostage_crisis.6.d: "Representatives from the US military have rejected our request to release Taliban inmates from military prisons \n\nthe Jihadists reacted by killing two hostages before proposing new demands, the North Korean government has also called for the release of the hostages"
 AFG_hostage_crisis.6.a: "Comment les talibans réagiront-ils ?"
 AFG_hostage_crisis.7.t: "Le gouvernement afghan rejette l'exigence talibane"
 AFG_hostage_crisis.7.d: "The representatives of the Afghan government have dismissed the Taliban demands as unrealizable, the Jihadists reacted by killing two hostages before proposing new demands, the North Korean government has also called for the release of the hostages"
 AFG_hostage_crisis.7.a: "Barbare!"
 AFG_hostage_crisis.8.t: "La Corée du Sud se retire d'Afghanistan"
 AFG_hostage_crisis.8.d: "Following a hostage crisis in Afghanistan the South Korean government have accepted the Taliban demands and started retreating their forces. \n\nThe Taliban announced that a ransom of twenty million dollars was paid, however the South Korean government didn't make any statement."
 AFG_hostage_crisis.8.a: "L'Afghanistan continue de se déstabiliser."
 AFG_hostage_crisis.9.t: "Otages sud-coréens exécutés"
 AFG_hostage_crisis.9.d: "Following a hostage crisis in Afghanistan the South Korean government have rejected all the Taliban demands, the next day they announced that all the hostages were assassinated."
 AFG_hostage_crisis.9.a: "Encore des victimes du conflit afghan."
 AFG_contact_iran.0.t: "L'Afghanistan rappelle les siens"
 AFG_contact_iran.0.d: "Our Fatemiyoun brigades are growing In Iran and they consist of the Hazara Shia Afghan men, Afghanistan Is requesting their return to their homeland so they can help the country they've been living in for several millennia."
 AFG_contact_iran.0.a: "Qu'ils s'unissent à leurs terres."
 AFG_contact_iran.0.b: "Non, nous avons besoin de la main-d'œuvre."
 AFG_contact_iran.1.t: "L'Iran refuse d'envoyer nos Fatemiyoun hazaras"
 AFG_contact_iran.1.d: "Après avoir demandé à [PER.GetName] de renvoyer les Fatemiyoun pour aider [AFG.GetName], et après de nombreux échanges entre nos deux nations, les Iraniens ont décidé de refuser le retour de nos hommes hazaras."
 AFG_contact_iran.1.a: "Allah sait mieux !"
 AFG_contact_iran.2.t: "L'Iran accepte notre appel concernant les Fatemiyoun hazaras"
 AFG_contact_iran.2.d: "[PER.GetName] a accepté notre demande de retour de nos soldats hazaras pour aider et rentrer au pays. Cinq divisions sont en route, drapeaux hauts, scandant « Zindabad Hazaristan ! »"
 AFG_contact_iran.2.a: "Harakat !"
 AFG_contact_iran.3.t: "L'Afghanistan demande son adhésion à l'Axe de la résistance"
 AFG_contact_iran.3.d: "The Shia Hazaras of Afghanistan request to join the Axis of Resistance, following the Hazaras' takeover of Afghanistan they are now requesting membership In our resistance."
 AFG_contact_iran.3.a: "Que le Khorasan s'unisse !"
 AFG_contact_iran.3.b: "Nous n'acceptons pas la demande."
 AFG_contact_iran.4.t: "L'Iran accepte notre demande d'adhésion à leur faction"
 AFG_contact_iran.4.d: "[PER.GetName] a accepté notre demande d'adhésion à l'Axe de la résistance. Ensemble, nous sommes plus forts !"
 AFG_contact_iran.4.a: "Allahou Akbar !"
 AFG_contact_iran.5.t: "L’Iran décline"
 AFG_contact_iran.5.d: "[PER.GetName] a refusé notre demande d'adhésion à l'Axe de la résistance. Nous ne devrions plus compter sur eux."
 AFG_contact_iran.5.a: "Triste"
 AFG_contact_iran.6.t: "Les Hazaras d'Afghanistan proclament l'Hazaristan"
 AFG_contact_iran.6.d: "This morning Karim Khalili the Hazara politician of Afghanistan has declared their own state following their successes in the country with rapid reforms and with the adherence to Shia Islam, hundreds of thousands of Hazaras have taken to the streets of Kabul, Bamiyan, Mazar-i-Sharif, and Herat to celebrate the declaration of Hazaristan."
 AFG_contact_iran.6.a: "Intéressant"
 world_war.12.t: "La question de Taïwan"
 world_war.12.d: "Les grandes puissances du monde étant enfermées dans une guerre d'usure mondiale, il reste peu de ceux qui pourraient intervenir au nom de Taipei. L'occasion de reprendre la province rebelle et d'achever notre réunification pourrait ne plus se représenter."
 world_war.12.a: "La réunification, enfin"
 world_war.12.b: "Nous ne pouvons pas risquer une guerre"
 UNSC.8.t: "Recommander un siège permanent pour [?global.current_sc_vote_nation.GetName]"
 UNSC.8.d: "[?global.current_sc_vote_nation.GetNameWithFlag] a postulé à un siège permanent au Conseil de sécurité des Nations unies. Le Conseil doit recommander la candidature sans veto avant qu'elle puisse aller à l'Assemblée générale.\n\n$unsc_vote_pass_tt$"
 UNSC_pass_type_8_desc: "Le Conseil a recommandé la candidature à un siège permanent. Elle passera maintenant devant l'Assemblée générale pour approbation finale."
 UNSC.13.t: "Un nouveau membre permanent du Conseil de sécurité"
 UNSC.13.d: "Le Conseil de sécurité et l'Assemblée générale ont approuvé [?global.unsc_last_permanent_admission.GetNameWithFlag] comme membre permanent du Conseil de sécurité des Nations unies. Le pays détient désormais un siège permanent et le droit de veto."
 UNSC.13.a: "Le Conseil s'est élargi."
 UN.22.t: "Siège permanent au Conseil de sécurité pour [?global.current_ga_vote_nation.GetName]"
 UN.22.d: "Le Conseil de sécurité a recommandé [?global.current_ga_vote_nation.GetNameWithFlag] pour un siège permanent. L'Assemblée générale doit approuver la candidature à la majorité des deux tiers avant que le pays n'obtienne un siège permanent et le veto.\n\n$un_ga_vote_requires_2_3_tt$"
 econvent.16.t: "Les méthodes de production modernes se propagent"
 econvent.16.d: "Des entreprises à travers [ROOT.GetName] adoptent de meilleures méthodes de production et réorganisent leurs ateliers. Ces changements font monter la production dans toute l'économie."
 econvent.16.a: "Encourager la transition"
 econvent.17.t: "Les investissements dans l’éducation portent leurs fruits"
 econvent.17.d: "Des années d'investissement dans les écoles et la formation professionnelle ont élargi le vivier de travailleurs qualifiés. Les employeurs mettent cette expertise au service de la production."
 econvent.17.a: "Mettre ces compétences à profit"
 econvent.18.t: "La technologie étrangère se diffuse dans le pays"
 econvent.18.d: "Les liens commerciaux ont exposé les entreprises locales à de meilleures machines et pratiques industrielles. Les producteurs nationaux adaptent désormais ces méthodes à leurs propres opérations."
 econvent.18.a: "Soutenir l’adoption nationale"
 econvent.19.t: "Annonce d'un investissement dans une fonderie de semi-conducteurs"
 econvent.19.d: "Un consortium privé s'est engagé à construire une nouvelle fonderie de semi-conducteurs en [ROOT.GetName]. Un accès fiable aux intrants industriels et à l'électricité a rendu le projet commercialement viable."
 econvent.19.a: "Saluer l'investissement"
 econvent.20.t: "Expansion de l’industrie des composites annoncée"
 econvent.20.d: "Les industriels étendent la production nationale de composites pour alimenter les industries civiles et militaires avancées. Les investisseurs attendent des matières premières sécurisées pour garder la nouvelle usine compétitive."
 econvent.20.a: "Soutenir l'expansion"
 econvent.21.t: "Les contrats de défense augmentent la production"
 econvent.21.d: "De nouveaux contrats de défense ont donné aux industriels la confiance d'étendre la production. Le projet créera des emplois qualifiés tout en renforçant la base industrielle nationale."
 econvent.21.a: "Attribuer les contrats"
 econvent.22.t: "Augmentation des commandes de construction navale commerciale"
 econvent.22.d: "La demande à l'export et de solides conditions maritimes ont rempli les carnets de commandes nationaux. Les constructeurs navals étendent leurs capacités pour honorer les nouveaux contrats."
 econvent.22.a: "Soutenir les chantiers navals"
 corruption.19.t: "Une année pour agir"
 corruption.19.d: "La pression publique a créé une étroite fenêtre pour une réforme réelle. Le gouvernement doit transformer cet élan en résultats avant que les intérêts établis ne se regroupent."
 corruption.19.a: "Lancer la campagne anticorruption"
 corruption.19.b: "Décliner le défi"
 UNSC.12.d_veto: "The United Nations Security Council has voted down the proposed resolution concerning [This.GetNameWithFlag]. A §YPermanent Member§! voted §RNo§!, which §Rvetoes§! the resolution no matter how many §GYes§! votes it received ([?global.security_council_vote_yes^num] of [?global.un_sc_required_yes] required). No measures will be adopted at this time."