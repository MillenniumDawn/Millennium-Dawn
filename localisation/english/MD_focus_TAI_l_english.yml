l_english:
 #National Spirits
 TAI_legacy_of_1949: "Legacy of 1949"
 TAI_legacy_of_1949_desc: "The end of the Chinese Civil War in 1949 saw the Nationalist Guomindang (KMT) and their supporters flee to the island province of Taiwan. The legacy of this event, combined with a local, nativist Taiwanese movement has led to a strong rejection of reunification with the mainland by the majority of Taiwanese citizens."
 TAI_the_great_chip_empire: "The Great Chip Empire"
 TAI_the_great_chip_empire_desc: "Having taken advantage of semiconductor and microchip production in it's infancy, and by being a more attractive investment than other nations. Taiwan has catapulted itself to the forefront of the industry. Though cheap, efficient production, and large exports to western nations, Taiwan has balanced its economy and national security on being the supply of microchips to the western world, and continues to be an industry leader through constant and regular innovation."
 TAI_flight_crew_strike: "Taoyuan Flight Attendants Union strike"
 TAI_flight_crew_strike_desc: "No results! No stopping!"
 TAI_foxconn_factory_behind_brand: "The Factory Behind the Brand"
 TAI_foxconn_factory_behind_brand_desc: "Hon Hai/Foxconn turns customer designs into repeatable production through tooling, procurement, process engineering, testing, and logistics. Its enormous throughput remains constrained by thin margins and powerful clients."
 TAI_foxconn_anchor_client_cycle: "Anchor-Client Launch Cycle"
 TAI_foxconn_anchor_client_cycle_desc: "A demanding customer supplies immense orders and exacting launch schedules. The relationship improves manufacturing discipline while concentrating commercial risk."
 TAI_foxconn_factory_city_production: "Factory-City Production"
 TAI_foxconn_factory_city_production_desc: "Dense supplier networks, dormitories, transport, and industrial services permit rapid production ramps. Concentrating work and daily life inside a few campuses also magnifies labor and disruption risks."
 TAI_foxconn_independent_audit: "Under Independent Audit"
 TAI_foxconn_independent_audit_desc: "Outside investigators are examining working hours, compensation, safety, and worker representation. Remediation slows production now but can create more credible governance."
 TAI_foxconn_integrating_sharp: "Integrating Sharp"
 TAI_foxconn_integrating_sharp_desc: "Sharp remains a distinct Japanese company with its own engineers, products, and obligations. Foxconn must finance a difficult turnaround before display expertise can strengthen the wider group."
 TAI_foxconn_wisconsin_obligation: "The Wisconsin Obligation"
 TAI_foxconn_wisconsin_obligation_desc: "A highly public American manufacturing promise now carries capital, employment, and credibility commitments. Announcements alone will not qualify a viable product line."
 TAI_foxconn_ev_pipeline: "EV Pipeline Without Volume"
 TAI_foxconn_ev_pipeline_desc: "Reference vehicles and partner programs create engineering options, but validated products and solvent customers remain scarce. Capital is committed before dependable volume arrives."
 TAI_foxconn_zhengzhou_disrupted: "Zhengzhou Disrupted"
 TAI_foxconn_zhengzhou_disrupted_desc: "Restrictions, worker departures, and contract disputes have reduced output at a critical assembly node. The shock exposes the cost of concentrating global launches in one campus."
 TAI_foxconn_global_contract_foundry: "Global Contract Foundry"
 TAI_foxconn_global_contract_foundry_desc: "Foxconn remains the confidential manufacturer behind many brands, scaling their systems with unmatched discipline. High component demand and customer leverage keep margins narrow."
 TAI_foxconn_resilient_manufacturing_network: "Resilient Manufacturing Network"
 TAI_foxconn_resilient_manufacturing_network_desc: "A Build, Operate, Localize network connects qualified regional hubs while retaining valuable mainland capacity. Redundancy improves market access and crisis recovery at a permanent coordination cost."
 TAI_foxconn_electronics_platform_group: "Electronics Platform Group"
 TAI_foxconn_electronics_platform_group_desc: "Foxconn combines systems engineering, AI racks, vehicles, power, cooling, and specialized components into a deeper platform. Greater technological reach demands capital and risks competing with customers."
 TAI_foxconn_responsible_manufacturing_compact: "Responsible Manufacturing Compact"
 TAI_foxconn_responsible_manufacturing_compact_desc: "Professional labor governance, credible audits, and worker protections become operating requirements across the production network. Compliance costs limit peak output but strengthen retention and institutional trust."

 TAI_foxconn_events.1.t: "The Factory Behind the Brand"
 TAI_foxconn_events.1.d: "By 2000, Taiwan-based Hon Hai/Foxconn has become an established electronics manufacturer with a rapidly expanding mainland production system. Management must decide whether scale, component depth, or geographic resilience will guide its next decade."
 TAI_foxconn_events.1.a: "Build the densest mainland network"
 TAI_foxconn_events.1.b: "Deepen components and Taiwanese capacity"
 TAI_foxconn_events.1.c: "Distribute production across Asia"

 TAI_foxconn_events.2.t: "Designed Elsewhere, Built at Scale"
 TAI_foxconn_events.2.d: "A major American client offers immense orders, severe cost pressure, tight secrecy, and unforgiving launch schedules. Accepting the anchor relationship can transform Foxconn's process discipline without transferring the customer's brands or designs."
 TAI_foxconn_events.2.a: "Accept the anchor-client launch model"
 TAI_foxconn_events.2.b: "Balance several major customers"
 TAI_foxconn_events.2.c: "Build an independent platform portfolio"
 TAI_foxconn_events.2.launch_bonus: "Anchor-Client Launch Engineering"

 TAI_foxconn_events.3.t: "The Shenzhen Labor Crisis"
 TAI_foxconn_events.3.d: "A cluster of worker deaths and reports of distress has brought scrutiny to working hours, compensation, safety, and life inside the factory-city system. The causes are contested, but the need for an institutional response is not."
 TAI_foxconn_events.3.a: "Raise standards and automate carefully"
 TAI_foxconn_events.3.b: "Automate production and expand inland"
 TAI_foxconn_events.3.c: "Empower independent worker representation"
 TAI_foxconn_events.3.e: "Protect the production schedule"

 TAI_foxconn_events.4.t: "iPhone City"
 TAI_foxconn_events.4.d: "Zhengzhou offers infrastructure, recruitment support, and enough space for an immense inland production campus. The project can create extraordinary launch capacity while deepening dependence on one customer, place, and policy environment."
 TAI_foxconn_events.4.a: "Concentrate the launch system in Zhengzhou"
 TAI_foxconn_events.4.b: "Build several inland production nodes"
 TAI_foxconn_events.4.c: "Accept a slower and steadier ramp"

 TAI_foxconn_events.5.t: "The Audit Line"
 TAI_foxconn_events.5.d: "Independent investigators have documented excessive hours, compensation problems, safety weaknesses, and poor worker communication. Reforms can improve legitimacy, but they require time, money, and measurable follow-through."
 TAI_foxconn_events.5.a: "Accept independent monitoring and remediation"
 TAI_foxconn_events.5.b: "Build an internal compliance system"
 TAI_foxconn_events.5.c: "Keep governance inside the company"

 TAI_foxconn_events.6.t: "Sharp at the Brink"
 TAI_foxconn_events.6.d: "Sharp needs a recapitalization partner, while Foxconn wants display expertise, engineers, and a closer component relationship. Control would bring a difficult Japanese turnaround rather than an instant transfer of technology."
 TAI_foxconn_events.6.a: "Lead the Sharp recapitalization"
 TAI_foxconn_events.6.b: "Preserve a strategic partnership"
 TAI_foxconn_events.6.c: "Withdraw from the rescue"

 TAI_foxconn_events.7.t: "A Screen Factory for America"
 TAI_foxconn_events.7.d: "American officials want a visible manufacturing project, and Wisconsin is prepared to compete for it. Foxconn can propose a vast LCD campus, offer a smaller modular site, or keep its capital in Asia."
 TAI_foxconn_events.7.a: "Make the maximum-scale promise"
 TAI_foxconn_events.7.b: "Propose a modular manufacturing campus"
 TAI_foxconn_events.7.c: "Reinvest the capital in Asia"
 TAI_foxconn_wisconsin_response_tt: "The United States will choose full support, conditional support, or rejection."

 TAI_foxconn_events.8.t: "Wisconsin Weighs the Offer"
 TAI_foxconn_events.8.d_maximum: "Foxconn proposes a vast Wisconsin LCD campus tied to major investment and employment claims. The project promises political prestige, but public support will carry considerable fiscal and delivery risk."
 TAI_foxconn_events.8.d_modular: "Foxconn proposes a smaller Wisconsin campus that can qualify products in stages. The reduced scale limits immediate prestige but gives public authorities clearer performance milestones."
 TAI_foxconn_events.8.a: "Provide full political and subsidy support"
 TAI_foxconn_events.8.b: "Tie support to verified milestones"
 TAI_foxconn_events.8.c: "Reject public support for the project"
 TAI_foxconn_wisconsin_full_support_tt: "The United States will provide full political and subsidy support for the proposal."
 TAI_foxconn_wisconsin_conditional_support_tt: "Support will depend on verified investment, employment, and product milestones."
 TAI_foxconn_wisconsin_rejected_tt: "The United States will reject public support, leaving Foxconn to redirect the project."

 TAI_foxconn_events.9.t: "The Wisconsin Commitment"
 TAI_foxconn_events.9.d: "Washington has answered Foxconn's proposal. The company must now decide whether the available support justifies a full commitment, a narrower project, or a return to its Asian network."
 TAI_foxconn_events.9.a: "Commit to the Wisconsin project"
 TAI_foxconn_events.9.b: "Reduce the project before construction"
 TAI_foxconn_events.9.c: "Redirect the investment to Asia"

 TAI_foxconn_events.10.t: "The Founder Steps Aside"
 TAI_foxconn_events.10.d: "Terry Gou is leaving the chairmanship after building Foxconn around direct authority, customer relationships, and relentless expansion. The succession can professionalize the group, preserve founder control, or give its major sectors greater autonomy."
 TAI_foxconn_events.10.a: "Professionalize the group under Young Liu"
 TAI_foxconn_events.10.b: "Keep the founder at the center"
 TAI_foxconn_events.10.c: "Create a federation of business sectors"

 TAI_foxconn_events.11.t: "An Open Platform on Wheels"
 TAI_foxconn_events.11.d: "Electric vehicles require electronics, procurement, thermal systems, validation, and long production cycles. Foxconn can build an open contract platform, pursue deeper control, or remain a neutral assembly specialist."
 TAI_foxconn_events.11.a: "Launch MIH with startup partners"
 TAI_foxconn_events.11.b: "Own the vehicle platform"
 TAI_foxconn_events.11.c: "Remain a contract manufacturer"
 TAI_foxconn_events.11.platform_bonus: "Open EV Platform Engineering"

 TAI_foxconn_events.12.t: "Closed Loop at iPhone City"
 TAI_foxconn_events.12.d: "Pandemic restrictions, worker departures, and disputes over allowances have sharply reduced output at Zhengzhou. The crisis proves that a highly efficient production node can also become a global single point of failure."
 TAI_foxconn_events.12.a: "Rebalance production across regional hubs"
 TAI_foxconn_events.12.b: "Restore Zhengzhou's concentrated scale"
 TAI_foxconn_events.12.c: "Accelerate a costly exit from China"

 TAI_foxconn_events.13.t: "Build, Operate, Localize"
 TAI_foxconn_events.13.d: "Customers and governments now want qualified production closer to their own markets. Foxconn can develop a network across India, Vietnam, Mexico, and other hubs while deciding how much of its mainland ecosystem to retain."
 TAI_foxconn_events.13.a: "Build a qualified regional network"
 TAI_foxconn_events.13.b: "Keep China at the network's center"
 TAI_foxconn_events.13.c: "Anchor high-value systems in Taiwan"

 TAI_foxconn_events.14.t: "The AI Factory"
 TAI_foxconn_events.14.d: "Complete AI racks combine boards, accelerators, power, cooling, cables, and exacting system validation. Foxconn can remain a neutral integrator, test sovereign systems and semiconductor capacity, or keep consumer electronics at the center of its portfolio."
 TAI_foxconn_events.14.a: "Become the neutral AI-rack integrator"
 TAI_foxconn_events.14.b: "Pursue sovereign systems and chip capacity"
 TAI_foxconn_events.14.c: "Specialize in consumer systems"
 TAI_foxconn_events.14.ai_bonus: "AI Rack Integration"
 TAI_foxconn_events.14.systems_bonus: "Sovereign Systems Engineering"
 TAI_foxconn_events.14.computing_bonus: "Consumer Systems Engineering"

 TAI_foxconn_events.15.t: "A Technology Manufacturing Platform"
 TAI_foxconn_events.15.d: "Foxconn now spans consumer devices, industrial systems, displays, vehicles, and AI infrastructure. Taiwan must decide which operating doctrine will govern a network whose scale creates both strategic reach and persistent dependence."
 TAI_foxconn_events.15.a: "Remain the global contract foundry"
 TAI_foxconn_events.15.b: "Complete the resilient manufacturing network"
 TAI_foxconn_events.15.c: "Build an electronics platform group"
 TAI_foxconn_events.15.e: "Adopt a responsible manufacturing compact"

 TAI_foxconn_events.20.t: "A Factory in Search of Product"
 TAI_foxconn_events.20.d: "The original Wisconsin LCD vision is failing to attract the required product, demand, and qualified supply chain. Foxconn can preserve the plan at great cost, shift to smaller manufacturing programs, or renegotiate the public promise."
 TAI_foxconn_events.20.a: "Preserve the large LCD vision"
 TAI_foxconn_events.20.b: "Shift to modular products"
 TAI_foxconn_events.20.c: "Renegotiate the commitment"

 TAI_foxconn_events.21.t: "From LCDs to AI Racks"
 TAI_foxconn_events.21.d: "Wisconsin has real facilities and a trained workforce, but not the immense display complex once promised. Growing demand for AI infrastructure offers a new use without pretending that the original plan succeeded."
 TAI_foxconn_events.21.a: "Repurpose Wisconsin for AI infrastructure"
 TAI_foxconn_events.21.b: "Build the specialized capacity elsewhere"
 TAI_foxconn_events.21.c: "Wind down the remaining obligation"

 TAI_foxconn_events.22.t: "The Partner Goes Bankrupt"
 TAI_foxconn_events.22.d: "A vehicle partner has entered bankruptcy after its own production and financing failures. Foxconn must decide what to do with a qualified plant and unfinished program without treating disputed claims as settled fact."
 TAI_foxconn_events.22.a: "Qualify a new vehicle customer"
 TAI_foxconn_events.22.b: "Repurpose the plant for server equipment"
 TAI_foxconn_events.22.c: "Exit the failed program"

 TAI_foxconn_events.23.t: "A Fab Without a Process"
 TAI_foxconn_events.23.d: "A large semiconductor announcement has outrun the available process partner, workforce, infrastructure, and qualified customers. Foxconn can recruit real expertise, narrow the project to packaging and specialty products, or withdraw before costs multiply."
 TAI_foxconn_events.23.a: "Recruit a qualified technology partner"
 TAI_foxconn_events.23.b: "Narrow the project to credible niches"
 TAI_foxconn_events.23.c: "Withdraw from the greenfield project"
