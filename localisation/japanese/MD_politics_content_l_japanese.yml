l_japanese:
 MD4_election_campaign.0.t: "投票日まで2週間となり、選挙活動が佳境をむかえている"
 MD4_election_campaign.0.d: "[Root.GetLastElection]に行われた選挙以来、[Root.GetLeader]は[Root.GetName]の舵取りを着実にこなしてきた。しかし2週間後の最終投票に向けて、強力なライバルたちの挑戦があるだろう。\n\n選挙運動の広告費はすでに集められており、その効果が世論にあらわれはじめている。"
 MD4_election_campaign.0.a: "はじめようじゃないか！"
 MD4_election_campaign.1.t: "外交論争: [Root.GetLeader]は誰と対立すべきかについて難しい決断を迫られている"
 MD4_election_campaign.1.d: "最終投票が近づくにつれ、我々は外交政策において何と対立すべきかを決定しなくてはならない。世界がますます不安定になる中、この問題は有権者にとって特に重要になる。\n\n強硬なネガティブ広告を打てば、相手の人気は確実に落ちるが、相手は、我々の重大な汚点を抱えていたり、我々の攻撃が不十分な調査に基づいていたりすれば、この広告に対抗できる可能性もわずかにある。\n\n攻撃の効果は、我々が受け取った選挙資金の額によって決められる。"
 MD4_election_campaign.1.a: "愚かな[Root.GetFascistParty]を攻撃"
 MD4_election_campaign.1.b: "ナショナリストの愚か者を攻撃"
 MD4_election_campaign.1.c: "馬鹿な[Root.GetNeutralParty]を攻撃"
 MD4_election_campaign.1.e: "白痴の[Root.GetCommunistParty]を攻撃"
 MD4_election_campaign.1.f: "能なしの[Root.GetDemocraticParty]を攻撃"
 MD4_election_campaign.1.g: "攻撃は控えよう"
 MD4_election_campaign.3.t: "[Root.GetFascistParty]、攻撃から回復――勢力強化"
 MD4_election_campaign.3.d: "我々の猛烈な攻撃にもかかわらず、物議を醸す[Root.GetFascistParty]は、中核的な支持者をすべて維持することに成功した。彼らは我々のネガティブ広告による注目の高まりを逆手に取り、すべての主要報道機関への前例のないアクセスを得て、自らのイデオロギーを推進した。"
 MD4_election_campaign.3.a: "くそっ"
 MD4_election_campaign.4.t: "ナショナリストに対しての否定的攻撃が裏目に出る"
 MD4_election_campaign.4.d: "我々の猛烈な攻撃にもかかわらず、物議を醸す国家主義者たちは、中核的な支持者のほとんどを維持することに成功した。彼らは、体制は崩壊し腐敗しており、主要メディアは社会を操作し、[Root.GetLeader]の政策は選挙献金を通じて最高入札者に売り渡されていると主張し、全国で大きな支持を得た。"
 MD4_election_campaign.4.a: "くそっ"
 MD4_election_campaign.5.t: "[Root.GetNeutralParty]へのネガティブ攻撃、効果なし"
 MD4_election_campaign.5.d: "Despite our best efforts, the tide of public opinion has shifted against our negative ad campaign targeting the [Root.GetNeutralParty]. There are likely several causes but one factor may be the perception that an attack from a politician of [Root.GetLeader]'s stature is an example of \"punching down\" and that the increased media coverage of our opponent enabled them to reach out to more voters."
 MD4_election_campaign.5.a: "くそっ"
 MD4_election_campaign.6.t: "[Root.GetCommunistParty]へのネガティブ攻撃、聞く耳持たれず"
 MD4_election_campaign.6.d: "Despite our best efforts, the tide of public opinion has shifted against our negative ad campaign targeting the [Root.GetCommunistParty]. There are likely several causes but one factor may be the perception that an attack from a politician of [Root.GetLeader]'s stature is an example of \"punching down\" and that the increased media coverage of our opponent enabled them to reach out to more voters."
 MD4_election_campaign.6.a: "くそっ"
 MD4_election_campaign.7.t: "[Root.GetDemocraticParty]へのネガティブ攻撃が裏目に出る"
 MD4_election_campaign.7.d: "我々の最善の努力にもかかわらず、[Root.GetDemocraticParty]を標的としたネガティブ広告キャンペーンに対し、世論の流れは逆転した。我々は公には外国の干渉を非難しているが、水面下では、我々の攻撃があまりにも誇張されていたため、そもそもそれを信じた人はほとんどいなかったのではないかという疑念が持たれている。"
 MD4_election_campaign.7.a: "くそっ"
 MD4_election_campaign.8.t: "論争の的となる演説者をキャンペーンに招く？"
 MD4_election_campaign.8.d: "通常であれば、このようなことを口に出して提案することはないだろうし、ましてや真剣に検討することもないだろう。しかし、[Root.GetLeader]の支持率が低いため、リスクを冒す価値はあるかもしれない。発言者はわが党の過激派グループの一員で、過去に数々の物議を醸す発言をし、タイミング悪く発言することで知られている。しかし、学生や若者の間では非常に人気があり、我々のやり方に投票するよう説得する必要がある重要なグループだ。"
 MD4_election_campaign.8.a: "招いて最善を願おう"
 MD4_election_campaign.8.b: "危険は冒すな"
 MD4_election_campaign.9.t: "大規模集会の成功で[Root.GetLeader]への熱意が再燃"
 MD4_election_campaign.9.d: "この集会は大成功を収め、選挙活動シーズン中で最大の観衆を引き付けた。物議を醸すスピーカーは[Root.GetLeader]を称賛し、党の団結を訴えたが、その熱意と説得力のある話しぶりから、その発言が実はすべて[Root.GetLeader]のチームによって書かれたものだとは誰も疑わなかった。"
 MD4_election_campaign.9.a: "キャンペーンに必要だった大きな後押しだ"
 MD4_election_campaign.10.t: "[Root.GetLeader]のキャンペーンにとっての大惨事"
 MD4_election_campaign.10.d: "With the largest audience turnout of the campaign season, the stage was set for [Root.GetLeader] to shine. Unfortunately, the controversial co-speaker who was invited to whip up enthusiasm, proceeded to tear up the speech we had prepared, and instead went off on a long tirade about the \"failures of all administrations, including this one\" and then appealed to young people to \"vote with their heart, or stay home\".\n\nNeedless to say, this soundbite was subsequently plastered across the media - with our opponents watching on gleefully."
 MD4_election_campaign.10.a: "なんという失敗だ！"
 election_coalition_won.0.t: "[Root.GetAdjective]選挙:連立政権が過半数獲得！"
 election_coalition_won.0.d: "現与党は新議会で過半数を獲得し、共同統治の委任を延長できる。"
 election_coalition_won.0.a: "現政権を継続する"
 election_coalition_won.0.b: "新政権樹立に向けて変更を加える"
 election_single_party.0.t: "[Root.GetAdjective]選挙:[Root.GetRulingParty]が過半数獲得！"
 election_single_party.0.d: "[Root.GetRulingParty]は単独で議席の過半数を獲得した。なんたる大勝利！"
 election_single_party.0.a: "民主主義にとってなんと素晴らしい日だろう！"
 election_single_party.1.t: "[Root.GetAdjective]選挙:[Root.GetLeader]敗北！"
 election_single_party.1.d: "With [show_biggest_party_elect] single-handedly winning a majority of parliamentary seats, [Root.GetLeader]'s political future is essentially over, with [Root.GetRulingParty] members calling for their resignation.\n\n[show_biggest_party_elect] will immediately take over as the new government of [Root.GetName]."
 election_single_party.1.a: "敗北を認め、勝者を祝福する。"
 MD4_election.1.t: "[Root.GetRulingParty]が再選！"
 MD4_election.1.d: "全ての票を集計した結果、[Root.GetAdjective]の有権者は[Root.GetLeader]に次の任期を与える事を決定した。高い職務能力支持率を誇る[Root.GetLeader]は、支持を得るために他の政党と取引をする必要なく勝利した。"
 MD4_election.1.a: "彼らはこう言う。[Root.GetLeader]が最高の指導者だ！"
 MD4_election.2.t: "[Root.GetLeader]の連立が再選！"
 MD4_election.2.d: "全ての票を集計した結果、[Root.GetAdjective]の有権者は、[Root.GetRulingParty]と[Root.GetLeader]に次の任期を与える事が決定された。現在の与党は新議会で過半数を確保しており、共に統治する権限を延長することができる。[Root.GetLeader]は、[Root.GetNameWithFlag]の指導者として支持を受け続けている。"
 MD4_election.2.a: "彼らはこう言う。[Root.GetLeader]が最高の指導者だ！"
 MD4_election.2.b: "新たな政府を形成するために変更を加える"
 MD4_election.3.t: "[Root.GetLeader]が選挙で敗北！"
 MD4_election.3.d: "With all the votes counted, [Root.GetLeader] seems unable to secure support from the [Root.GetAdjective] voters for another term in office. Instead it was [show_biggest_party_elect]'s time to shine. With ([?party_pop_elect_array^max_index_1|%1]) they have single-handedly gathered enough support to rule alone.\n\n Control of [Root.GetName] will pass to [show_biggest_party_elect]."
 MD4_election.3.a: "敗北を認め、勝者を祝福しよう"
 MD4_election.4.t: "選挙: [Root.GetLeader]の成果は不確定！"
 MD4_election.4.d: "すべての票が集計されたものの、[Root.GetLeader]は新たな議会で新政府を樹立するための過半数を現在持っていない。追加の政党を説得して参加させる必要があり、それが不可能な場合は、他の政党の一つに政府樹立の機会を譲らなければならない。"
 MD4_election.4.a: "交渉を始めよう……"
 MD4_election.5.t: "選挙: [Root.GetLeader]は恥辱の敗北！"
 MD4_election.5.d: "With all the votes counted, [Root.GetLeader] did not even manage to reach the minimum threshold for [Root.GetRulingParty] to enter parliament. It's clear someone else will have to form a government to lead [Root.GetName] forward, but who?"
 MD4_election.5.a: "[show_biggest_party_elect] ([?party_pop_elect_array^max_index_1|%1]) will try"
 MD4_election.5.b: "[show_second_biggest_party_elect] ([?party_pop_elect_array^max_index_2|%1]) will try"
 News_MD4_election.0.t: "[From.GetAdjective]選挙: [From.GetRulingParty]が再選！"
 News_MD4_election.0.d: "[From.GetRulingParty]（[From.GetRulingIdeology]）の[From.GetLeader]がすべての挑戦者を一蹴し、引き続き[From.GetAdjective]の指導者としてもう1期務めることになった。"
 News_MD4_election.0.a: "了解"
 News_MD4_election.1.t: "[From.GetAdjective] 選挙: [From.GetLeader]による新政権発足！"
 News_MD4_election.1.d: "\n\n[From.GetRulingParty]（[From.GetRulingIdeology]）の[From.GetLeader]が選挙に勝利し、政府内の他の政党の支援を受け、[From.GetName]を率いて前進させる役目を背負っている。"
 News_MD4_election.1.a: "了解"
 News_MD4_election.2.t: "[From.GetAdjective]選挙: [From.GetLeader]が逆転大勝利！"
 News_MD4_election.2.d: "[From.GetRulingParty]（[From.GetRulingIdeology]）の[From.GetLeader]が、単独で現政権を倒すという、一見不可能なことを成し遂げた。単独で多数派政権を樹立した[From.GetLeader]は選挙で勝利を収め、現在は[From.GetName]を前進させる使命を背負っている。"
 News_MD4_election.2.a: "了解"
 coalition_complete.0.t: "政府が発足！"
 coalition_complete.0.d: "Since the elections held on [Root.GetLastElection], [Root.GetLeader] of [Root.GetRulingParty] has been skillfully negotiating a new majority government. Today, [GetDateText], after a period of intense media speculation, its composition was finally announced at a press-conference. This represents a major milestone for [Root.GetName] as a new political era dawns."
 coalition_complete.0.a: "素晴らしい知らせだ！"
 coalition_pass.0.t: "[Root.GetRulingParty]が政府樹立を断念するか？"
 coalition_pass.0.d: "[Root.GetLeader]の政治顧問たちは、まるで首を失った鶏のように右往左往しながら、[Root.GetRulingParty]が政府樹立に失敗しつつある危機に対する解決策を必死に模索している。このままでは[Root.GetLeader]が職を追われた場合、ほとんどの顧問が職を失うことになるのは明らかだ。\n\n一方、[show_biggest_party_elect]の本部では興奮が高まっている。ついに[Root.GetName]の政権を奪取するための明確な道筋が見えてきたのだ。"
 coalition_pass.0.a: "Give up: Let [show_biggest_party_elect] ([?party_pop_elect_array^max_index_1|%1]) try"
 coalition_pass.0.b: "フェイクニュースだ！必要な同盟相手を見つける。"
 coalition_pass.1.t: "[Root.GetRulingParty]が政府樹立を断念するか？"
 coalition_pass.1.d: "[Root.GetLeader]の政治顧問たちは、まるで首を失った鶏のように右往左往しながら、[Root.GetRulingParty]が政府樹立に失敗しつつある危機に対する解決策を必死に模索している。このままでは[Root.GetLeader]が職を追われた場合、ほとんどの顧問が職を失うことになるのは明らかだ。\n\n一方、[show_second_biggest_party_elect]の本部では興奮が高まっている。ついに[Root.GetName]の政権を奪取するための明確な道筋が見えてきたのだ。"
 coalition_pass.1.a: "Give up: Let [show_second_biggest_party_elect] ([?party_pop_elect_array^max_index_2|%1]) try"
 coalition_pass.1.b: "フェイクニュースだ！必要な同盟相手を見つける。"
 coalition_pass_dismantle_tt: "与党を解任: §H[Root.GetRulingParty]§!\n§H政府連立§!が解散される\n\n"
 coalition_pass_refund_tt: "政治力: 連立に費やした量の§G75%§!を回復\n"
 coalition_pass_pol_change_0_tt: "政治体制が変化:\n§H[show_biggest_party_elect]§!が与党となる\n\n"
 coalition_pass_pol_change_1_tt: "政治体制が変化:\n§H[show_second_biggest_party_elect]§!が与党となる\n\n"
 coalition.0.t: "[Western_Autocracy_L]（[?party_pop_elect_array^0|%0]）との交渉"
 coalition.0.d: "[Root.GetLeader]が権威主義的スタイルを炸裂させている！もちろん我々も政府に加わりたい。ただし、政治的代償を払う覚悟があるならの話だが。"
 coalition.0.a: "連立へようこそ！"
 coalition.0.b: "よくよく考えてみると、彼らと組まない方がよさそうだ。"
 coalition.1.t: "[conservatism_L]（[?party_pop_elect_array^1|%0]）との交渉"
 coalition.1.d: "尊敬する[Root.GetLeader]閣下。我々は、将来的に政府運営において一定の協力関係を築く可能性を想定している。謹んで申し上げるが、貴殿には我々の政策を全て採用されるべきだと考えている。しかし選挙結果が我々にとって完全に有利とは言えない状況を踏まえ、有権者のために可能な限り最善の合意を交渉せねばならないことも認識いる。我々の要求は単純明快、伝統的価値観の擁護、現実主義、権威と宗教的価値観への尊重、そして伝統的社会制度の維持への確約だ。\n\nもし協力を受け入れるなら、愚かで軽率な政策決定やいわゆる現代的思考によって[conservatism_L]の名声を汚さないよう心から望む。このリスクを最小限に抑えるため、添付文書に記載した全権限を掌握する省庁リストを参照されたい。"
 coalition.1.a: "連立へようこそ！"
 coalition.1.b: "よく考えてみると、君たち保守派はつまらなすぎる。"
 coalition.2.t: "[liberalism_L]（[?party_pop_elect_array^2|%0]）との交渉"
 coalition.2.d: "親愛なる[Root.GetLeader]閣下。貴殿がリベラリズムと自由の偉大な理念に関心を示されたと伺い、光栄に存じます。自由こそが、誠実な政府の基盤であることに変わりはありません。もちろん、我々もリベラリズムを推進するため政府に参加したいと考えています。なぜなら、個人の自由と限定された政府こそが、人類が自由な社会を形成する最良の方法であると、双方理解しているからです。\n\nしかし、貴殿のリベラリズムが我々のそれと同様に制約を受けないものであることを確実にするためには、最終合意に至る前に、我々の完全に合理的かつ疑いようもなく相互に有益な要求を受け入れる必要があります。"
 coalition.2.a: "連立へようこそ！"
 coalition.2.b: "丁重にお断り申し上げる。"
 coalition.3.t: "[socialism_L]（[?party_pop_elect_array^3|%0]）との交渉"
 coalition.3.d: "Dear [Root.GetLeader]. While we are reluctant to enter any government as junior partners, the Unions have been unable to get us over the finish line in the elections - this time. So there is a possibility we could entertain the notion of joining - if you pledge to promote the vital principles of progressive and social democratic values. As we say in [socialism_L], social democratic values are for everyone, and we insist this holds true for your government.\n\nBy the way, aren't the taxes a bit low? Are you sure we have enough funding for the increases in social welfare, education, and healthcare we have planned?"
 coalition.3.a: "連立へようこそ！"
 coalition.3.b: "丁重にお断り申し上げる。"
 coalition.4.t: "[communist_state_L]（[?party_pop_elect_array^4|%0]）との交渉"
 coalition.4.d: "同志[Root.GetLeader]！我々は貴方の帝国主義的ブルジョア政府を打倒し、革命的武装闘争によって社会を変革し、プロレタリアートの民主的独裁を確立し、階級の裏切り者を排除することを目指す一方で、現時点で連合を形成することには一定の短期的な政治的戦術的利点があることを認識している。\n\n我々の要求は単純だ——マルクス主義的弁証法的唯物論の完全実施、抑圧されたプロレタリアートの社会経済的状況の1000％改善、そして我々が建設する新たなディズニーランドへの自由入場権だ！\n\n...貴方が言及した小さな譲歩でも我々は受け入れる。"
 coalition.4.a: "連立へようこそ！"
 coalition.4.b: "アカになるぐらいなら死んだ方がマシだ！"
 coalition.5.t: "[anarchist_communism_L]（[?party_pop_elect_array^5|%0]）との交渉"
 coalition.5.d: "Comrade [Root.GetLeader]. We think we would move your administration in the right direction - the leftist one. Some call us \"Left-Wing Radicals\", but the real radicals are the conservative backward anti-progressive forces who put all power in the hands of the 1% richest. We just fight for common sense things that the whole 99% can agree on - like social justice, feminism, ending welfare profiteers, dismantling capitalism, internationalism, and the end of western imperialist dominance, and its exploitation of the Global South."
 coalition.5.a: "共に力を合わせれば、より強くなれる！"
 coalition.5.b: "考え直しているところだ。"
 coalition.6.t: "[Conservative_L]（[?party_pop_elect_array^6|%0]）との交渉"
 coalition.6.d: ""
 coalition.6.a: "連立へようこそ！"
 coalition.6.b: "丁重にお断り申し上げる。"
 coalition.7.t: "[Autocracy_L]（[?party_pop_elect_array^7|%0]）との交渉"
 coalition.7.d: "親愛なる[Root.GetLeader]閣下。我々は、貴殿が選挙運動と呼ぶ、有権者の無知、愚痴、口論、浪費、妥協、躊躇に満ちた近眼的で意志薄弱な分裂した祭典を大切に思っておりますが、貴殿が今や蓄積した真の力を認識しております。我々に加われば、立法府と行政府による制約の枷を振り払い、我々の共有する力、規律、権威、そして結束を示すことができるでしょう。"
 coalition.7.a: "連立へようこそ！"
 coalition.7.b: "丁重にお断り申し上げる。"
 coalition.8.t: "[Mod_Vilayat_e_Faqih_L]（[?party_pop_elect_array^8|%0]）との交渉"
 coalition.8.d: "尊敬する[Root.GetLeader]閣下。我々、アリー・イブン・アビー・ターリブのシーア派は、シオニストとそのタクフィール主義者の地獄の落とし子に勇敢に抵抗する貴殿と手を取り合い、参加する準備ができている。共に我々は、聖なる殉教者からの霊感を得て、真のイスラムの敵を地上から追い払うであろう。我々、アッラーの剣は、確かにサイイド・ハーメネイーとサイイド・ハサン・ナスラッラーに指導を仰ぐであろうが、恐れることはない。我々は必要であれば聖なる土壌を守るために血を流す真の[Root.GetAdjective]の愛国者なのだから。我々が自らを穏健派だと考えていることは言及していただろうか？"
 coalition.8.a: "シオニストに死を！"
 coalition.8.b: "拷問された方がましだ。"
 coalition.9.t: "[Vilayat_e_Faqih_L]（[?party_pop_elect_array^9|%0]）との交渉"
 coalition.9.d: "尊敬する[Root.GetLeader]閣下。我々、アリー・イブン・アビー・ターリブのシーア派は、シオニストとそのタクフィール主義者の地獄の落とし子に勇敢に抵抗する貴殿と手を取り合い、参加する準備ができている。共に我々は、聖なる殉教者からの霊感を得て、真のイスラムの敵を地上から追い払うであろう。我々、アッラーの剣は、確かにサイイド・ハーメネイーとサイイド・ハサン・ナスラッラーに指導を仰ぐであろうが、恐れることはない。我々は必要であれば聖なる土壌を守るために血を流す真の[Root.GetAdjective]の愛国者なのだから。"
 coalition.9.a: "シオニストに死を！"
 coalition.9.b: "拷問された方がましだ。"
 coalition.10.t: "[Kingdom_L]（[?party_pop_elect_array^10|%0]）との交渉"
 coalition.10.d: ""
 coalition.10.a: "連立へようこそ！"
 coalition.10.b: "丁重にお断り申し上げる。"
 coalition.11.t: "[Caliphate_L]（[?party_pop_elect_array^11|%0]）との交渉"
 coalition.11.d: "[Root.GetLeader], though we have called you a \"filthy infidel dog\" many times, we didn't really mean anything bad about it.\n\nWhile inshallah you are for sure going to hell for not joining the True Caliphate, we, the just and brave Mujahid, can surely help rightly guide you, as only we know the true will of Allah, as revealed to us by the Prophet Muhammad (ṣallā llahu ʿalayhi wa-sallam). We are, of course, very, very peaceful, and committed to democratic principles. We don't have any demands. We are just here to help. We can, inshallah, for instance, help take the heavy burden of managing the military, the police, and the courts off your shoulders."
 coalition.11.a: "これは素晴らしい考えのように思える"
 coalition.11.b: "草"
 coalition.12.t: "[Neutral_Muslim_Brotherhood_L]（[?party_pop_elect_array^12|%0]）との交渉"
 coalition.12.d: ""
 coalition.12.a: "連立へようこそ！"
 coalition.12.b: "丁重にお断り申し上げる。"
 coalition.13.t: "[Neutral_Autocracy_L]（[?party_pop_elect_array^13|%0]）との交渉"
 coalition.13.d: ""
 coalition.13.a: "連立へようこそ！"
 coalition.13.b: "丁重にお断り申し上げる。"
 coalition.14.t: "[Neutral_conservatism_L]（[?party_pop_elect_array^14|%0]）との交渉"
 coalition.14.d: ""
 coalition.14.a: "連立へようこそ！"
 coalition.14.b: "丁重にお断り申し上げる。"
 coalition.15.t: "[oligarchism_L]（[?party_pop_elect_array^15|%0]）との交渉"
 coalition.15.d: "親愛なる[Root.GetLeader]閣下。またしても巨大化した選挙の余波を受け、この肥大化したサーカスのテント――貴方が政府と呼ぶもの――の縫い目から、洗われていない大衆が今にも溢れ出そうとしている。権力は少数者——富裕層、貴族、権力者——に集中させる方が効率的だ。小こそが新たな大なり。重要なのは船の大きさではなく、海原を駆ける勢いだ。とはいえ、今はより大きな船が必要である。今日こそ各党を統合し連立政権を樹立してこそ、明日の小さな船を確保できる。貴殿のご協力により、我ら支配階級は夕日に向かって航海に出る。"
 coalition.15.a: "連立へようこそ！"
 coalition.15.b: "丁重にお断り申し上げる。失せろ！"
 coalition.16.t: "[Neutral_Libertarian_L]（[?party_pop_elect_array^16|%0]）との交渉"
 coalition.16.d: "Dear [Root.GetLeader]. It's often been said within the leadership of [Neutral_Libertarian_L] that just keeping the party together is like \"herding cats\". So you must believe us when we say that entering a coalition with you statists can only happen if you are prepared to make some serious concessions. Like eliminating taxes and abolishing the military. Of course, we will never waive an inch on individual freedom, and economic and social liberty. In the spirit of compromise, we might be prepared to delay the full implementation of Bitcoin as our new official currency slightly, but we haven't asked all our members about this yet.\n\n[Root.GetLeader]: \"What if we allow you all to smoke weed without getting jailed?\"\n\n- \"Sure! That will work\"."
 coalition.16.a: "連立へようこそ！"
 coalition.16.b: "すまない、冗談だ！本当はお前ら変人どもを参加させる気はないんだ。"
 coalition.17.t: "[Neutral_green_L]（[?party_pop_elect_array^17|%0]）との交渉"
 coalition.17.d: "[Root.GetLeader]閣下...あれはリムジンか！？まったく無責任極まりない。もし皆がそんな燃料をむさぼる車を運転し、海外会議のためにあちこち飛び回っていたら、地球100個分の資源が必要になる！このままではいけない、時間は刻一刻と迫っている。人為的な地球温暖化はSFではなく、科学的事実だ。HoI4で気温が年々上昇しないからといって、脅威を軽視していいわけがない！我々が連立政権に参加するならば、炭素排出量を迅速に削減する真剣な計画を要求する。"
 coalition.17.a: "我々の環境に優しい政府へようこそ。"
 coalition.17.b: "どうでもいい"
 coalition.18.t: "[neutral_Social_L]（[?party_pop_elect_array^18|%0]）との交渉"
 coalition.18.d: "Dear [Root.GetLeader]. We really think we would move your administration forward towards greater equality and universal progressive values. If we join, we demand that welfare and healthcare be strengthened significantly and taxes on the rich be increased massively. We hold the essential principles of democracy as sacred. This also applies to the economy, which should at least be under strict socialist government regulations to ensure good wages, better working conditions, and less profits to the capitalists. Really, we would be so good at governing that it would be best if the majority of it was state-controlled."
 coalition.18.a: "共に力を合わせれば、より強くなれる。"
 coalition.18.b: "ありえない！"
 coalition.19.t: "[Neutral_Communism_L]（[?party_pop_elect_array^19|%0]）との交渉"
 coalition.19.d: "同志[Root.GetLeader]！我々は貴方の帝国主義的ブルジョア政府を打倒し、革命的武装闘争によって社会を変革し、プロレタリアートの民主的独裁を確立し、階級の裏切り者を排除することを目指す一方で、現時点で連合を形成することには一定の短期的な政治的戦術的利点があることを認識している。\n\n我々の要求は単純だ——マルクス主義的弁証法的唯物論の完全実施、抑圧されたプロレタリアートの社会経済的状況の1000％改善、そして我々が建設する新たなディズニーランドへの自由入場権だ！\n\n...実際は、貴方が言及した小さな譲歩でも我々は受け入れる。"
 coalition.19.a: "共に前進しよう、同志よ！"
 coalition.19.b: "やめておこう。"
 coalition.20.t: "[Nat_Populism_L]（[?party_pop_elect_array^20|%0]）との交渉"
 coalition.20.d: "尊敬する[Root.GetLeader]閣下。我々との対話を決断されたご英断に敬意を表そう。我々が常識と理性の真の声であることは周知の事実であるが、[Nat_Populism_L]が常識の灯台としての役割を果たすにあたり、適切な政策の採用を強く要請せざるを得ない。[Root.GetName]の政治体制は長きにわたり国家を略奪し、失敗した移民制度を通じて安価な労働力を輸入する多国籍企業に我々の富と尊厳を売り渡してきた！移民は我々の職を奪うだけでなく、失業手当や福祉制度をも搾取している。さらに、老朽化したインフラへの投資と減税が必要だ！我が軍は犯罪的に人員不足かつ装備も貧弱で、早急に拡大すべきだ。警察については言及したか？ 過去の政権が輸入した犯罪者全員に対処する資源が明らかに不足している。一方、高齢者への適切な介護が行われていない。これは恥辱だ！ では、合意は成立したか？"
 coalition.20.a: "連立へようこそ！"
 coalition.20.b: "勘弁してくれ"
 coalition.21.t: "[Nat_Fascism_L]（[?party_pop_elect_array^21|%0]）との交渉"
 coalition.21.d: "ハイル・[Root.GetLeader]！\n\n我ら愛国者たちは文明の反逆者たちへ向け、全国で進軍している。この純潔のための栄光ある行進に加わるか、我が偉大なる祖国を汚れた外国人どもに明け渡すかだ！我々は彼らを追い出さねばならない！一人残らずだ！（[Nat_Fascism_L]の有料会員、または我々のメールオーダー・ブライドを除く）\n\n我々は国家復興を導く純粋なナショナリズム政府を要求する！我々に与えられた選択肢はただ一つ――混沌か秩序と自由か。完全なる秩序。そして外国の寄生虫からの完全なる自由だ。"
 coalition.21.a: "よし！手を組もう。"
 coalition.21.b: "政府？お前ら全員、別の施設に属するべきだ..."
 coalition.22.t: "[Nat_Autocracy_L]（[?party_pop_elect_array^22|%0]）との交渉"
 coalition.22.d: "Dear [Root.GetLeader]. There comes a time, of national peril, when the military establishment must step up its role, to fill dangerous power vacuums, safeguard the national sovereignty and our independence and patriotic values. In our view, this time for military rule - is always. However, we realize that doing so now might bring certain undesirable effects on our foreign relations. It would be... less complicated - if you just discreetly do as we say.\n\nAs long as you know your place, we certainly would be a very powerful political ally for you."
 coalition.22.a: "政治は政治家に任せるには重要すぎる。"
 coalition.22.b: "政治は将軍に任せるには重要すぎる。"
 coalition.23.t: "[Monarchist_L]（[?party_pop_elect_array^23|%0]）との交渉"
 coalition.23.d: "尊敬する[Root.GetLeader]閣下。我ら王党派は、貴殿のような平民が[Root.GetName]に必要な安定性や、絶対君主のみが授け得るその他の輝かしい恩恵を提供できるなどという考えを嘲笑します。真の最高執行権力は、聖なる王族のみが適切に行使し得ることは周知の事実です。完全な国家復興へ向けて前進する我々にとって、これは真に結束をもたらす力であり、我々の偉大さを示す強力な象徴となるでしょう。明らかに、神権に祝福された絶対君主制は、あらゆる指標において他のあらゆる統治形態を凌駕しています。\n\nさて、我々が貴殿を戴冠させることは明らかにありません。したがって、連合内の王党派が王位継承に最適な候補者を探す間、時代遅れで時代錯誤的な共和制政府をしばらく維持することになるでしょう。"
 coalition.23.a: "ああ、分かった、どうでもいいよ"
 coalition.23.b: "明らかにお前らに統治する資格はない..."
 MD4_election.1.d_term_ended: "With all the votes counted, the [Root.GetAdjective] voters have decided to give [Root.GetLeader]'s party another term. However, as [Root.GetLeader] has reached the end of their final term, they will give way for a new leader."
 MD4_election.2.d_term_ended: "すべての票が集計され、[Root.GetAdjective]の有権者は[Root.GetRulingParty]にもう一期任せることを決定した。現与党は新議会で過半数を確保し、共同統治の委任を延長できる。[Root.GetLeader]は最終任期を満了したため、新たな指導者が[Root.GetNameWithFlag]の統治任務を引き継ぐことになる。"
 News_MD4_election.0.d_first_term: "[From.GetRulingParty]（[From.GetRulingIdeology]）の[From.GetLeader]は単独で他の候補者の追随を許さず勝利した。前任者の後を継ぎ、[From.GetAdjective]の指導者として最初の任期を迎るだろう。"
