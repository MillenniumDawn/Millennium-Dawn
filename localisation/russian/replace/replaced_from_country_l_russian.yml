 ARMY_EXPERIENCE_DESC: "Когда ваша техника используется в бою, вы получаете опыт армии. Это значит, что опыт армии можно получать, когда ваши §Hбригады§! вступают в бой или когда вы передаёте технику §Hпо ленд-лизу§! союзникам, ведущим войну.\nОпыт также дают §Hармейские учения§! с войсками не ниже уровня $UNIT_TRAINING_LEVEL|Y$ и некоторые §Hнациональные фокусы§!. Некоторые §Hминистры§! могут увеличивать получаемый опыт.\n\nОпыт армии нужен для создания и изменения §Hшаблонов бригад§! и открытия §Hдоктрин§!."