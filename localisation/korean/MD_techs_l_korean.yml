 EQ_MOD_CAT_module_surface_drone_control_category_TITLE: "자율 수상 전투함 통제"
 module_naval_surface_drone_control: "자율 수상 전투함 통제"
 module_naval_surface_drone_control_desc: "자율 통제 장치는 프리깃과 구축함이 필요 승조원 수를 크게 줄이고도 운용될 수 있게 하며, 일상적인 항법, 센서 융합, 피해 통제 지원을 자동화하면서도 완전한 전투 능력을 유지합니다.\n\n§G설계 힌트: 자율 통제는 인력 요구량을 대폭 줄이는 동시에 센서, 무장, 방호, 속도를 전반적으로 향상시킵니다. 소수 승조원으로 운용되는 첨단 수상 전투함에 적합하지만, IC 비용과 마이크로칩 비용이 높습니다.§!"
 support_ship_nuclear_upgrade: "원자력 추진"
 support_ship_nuclear_upgrade_desc: "함정에 해군용 원자로를 장착하면 연료 항속 거리의 제약에서 벗어나, 대양을 가로지르는 전개에서도 원자력 기동부대와 보조를 맞출 수 있습니다."
 nuclear_propulsion_upgrade_capacity_tt: "§Y$support_ship_nuclear_upgrade$§! 업그레이드 용량 §G+4§!"
 UKR_world_economical_relations: "우크라이나 경제 관계"
 module_futuristic_integrated_missile_radar_control1_desc: "미래형 전투 정보 체계는 머신러닝과 AI 기술을 도입하여 아음속, 초음속, 심지어 극초음속으로 날아오는 적 무기의 발사, 비행, 요격을 추적하는 함선의 능력을 향상시킵니다.\n\n§G설계 힌트: 사격통제는 포 공격력, 대함 미사일, 대함 미사일 관통력, 대공, 장갑을 향상시켜 무장한 함선이 여러 역할에서 더 효과적이 되게 합니다. 고급 체계일수록 더 큰 보너스를 제공하지만 IC와 마이크로칩 비용이 더 높습니다.§!"
