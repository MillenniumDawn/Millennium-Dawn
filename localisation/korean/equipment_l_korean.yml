 AS_Fighter1_desc: "공중우세기는 가끔씩 '공중 지배 전투기'라고도 불리는데, 공대공 전투만을 수행하기 위해서 긴 항속거리와 뛰어난 민첩성을 가지게 되었습니다. 대지공격을 위한 무기를 보통은 탑재하지 않습니다."
