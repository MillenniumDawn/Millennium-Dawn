 CZE_petr_pavel_card_one_button_TT: "§GOficial de Ligação§!"
 CZE_petr_pavel_card_one_button_delayed_TT: "Petr Pavel é oficial de ligação há muito tempo. Ele já passou por muito treinamento, mas ainda há novos desafios a enfrentar. A tecnologia militar evolui continuamente e o equipamento ultrapassado não é mais eficaz contra o inimigo moderno.\n\nA experiência atual concede os seguintes benefícios:\n[CZE_petr_pavel_liaison_officer_loc]"
 CZE_petr_pavel_card_two_button_TT: "§GForças Especiais§!"
 CZE_petr_pavel_card_two_button_delayed_TT: "Participar de operações especiais exige muita concentração, experiência e coordenação com o esquadrão. Este treinamento melhorará a cooperação com outros soldados experientes e fará de Petr Pavel um comandante ainda melhor.\n\nA experiência atual concede os seguintes benefícios:\n[CZE_petr_pavel_special_forces_loc]"
 CZE_petr_pavel_card_three_button_TT: "§GTreinamento no Deserto§!"
 CZE_petr_pavel_card_three_button_delayed_TT: "O treinamento no deserto não teve papel central até agora. No entanto, isso pode mudar muito em breve. O Afeganistão está mergulhado em guerra civil e o Oriente Médio continua sendo um lugar instável. É importante não desprezar este treinamento, pois ele pode se tornar muito útil dentro de alguns anos...\n\nA experiência atual concede os seguintes benefícios:\n[CZE_petr_pavel_desert_training_loc]"
 CZE_petr_pavel_card_four_button_TT: "§GEstilo Defensivo§!"
 CZE_petr_pavel_card_four_button_delayed_TT: "Petr Pavel é oficial de ligação e especialista em planejamento, mas, acima de tudo, está sempre em busca de melhores formas de proteger seu país. O exército deve ser forte para se defender de qualquer inimigo, e esse é o objetivo deste treinamento.\n\nA experiência atual concede os seguintes benefícios:\n[CZE_petr_pavel_defensive_style_loc]"
 CZE_petr_pavel_card_five_button_TT: "§GEstilo Ofensivo§!"
 CZE_petr_pavel_card_five_button_delayed_TT: "Até um grande defensor e estrategista precisa saber conduzir seus soldados à vitória no campo de batalha. Este programa de treinamento mostrará a Petr Pavel como comandar os soldados com eficácia e esmagar a linha defensiva do inimigo.\n\nA experiência atual concede os seguintes benefícios:\n[CZE_petr_pavel_offensive_style_loc]"
 CZE_petr_pavel_card_six_button_TT: "§GEspecialista em Planejamento§!"
 CZE_petr_pavel_card_six_button_delayed_TT: "Petr Pavel é especialista em preparar estratégias e frequentemente coopera com generais de patente superior em treinamentos e operações importantes. É importante saber como manter seu país seguro, e isso só é possível com uma estratégia de dissuasão perfeita.\n\nA experiência atual concede os seguintes benefícios:\n[CZE_petr_pavel_planning_expert_loc]"
 CZE_petr_pavel_liaison_officer_loc_one: "§Y+3%§! §RPerda de Organização ao Se Mover§!\n§Y-2%§! §RReconhecimento§!"
