l_french:
 BRA_education_integration: "Programmes d'éducation intégrée"
 BRA_education_integration_desc: "En finançant de nouveaux programmes d'éducation et d'échange d'étudiants avec des directives communes, nous commencerons à intégrer les programmes d'études de tous les membres du MERCOSUR."
 BRA_mercosur_market: "Marché MERCOSUR"
 BRA_mercosur_market_desc: "En nous concentrant davantage sur le commerce avec les autres membres du MERCOSUR, nous pouvons améliorer nos relations et améliorer les économies de nos pays."
 BRA_inv_assoc: "Inviter officiellement les états associés"
 BRA_inv_assoc_desc: "Nous sommes proches des États associés du MERCOSUR. Pour améliorer encore les relations et donner à leurs économies une chance de se développer, nous devrions les inviter et faire d'eux de fiers membres du MERCOSUR."
 BRA_maintain_quo: "Maintenir le status quo"
 BRA_maintain_quo_desc: "Le MERCOSUR est très bien comme il est maintenant. Nous n'avons pas besoin d'autres membres. Les associés peuvent rester des associés pour le moment."
 BRA_expand_to_latin_america: "Englober l'amérique latine"
 BRA_expand_to_latin_america_desc: "Notre union doit unir tous nos frères d'Amérique latine, comme le Mexique, le Guatemala et le Honduras !"
 BRA_americas_unity: "Unité sud-américaine"
 BRA_americas_unity_desc: "Entourés de nos voisins, ensemble nous pouvons être forts."
 BRA_americas_unity_TT: "Le pays qui prend ceci gagne un §G+15§! de §Ymodificateur d'opinion§! avec les autres §Ypays d'Amérique du Sud§!."
 BRA_mercosur: "MERCOSUR"
 BRA_mercosur_desc: "Le MERCOSUR, ou MERCOSUL, était un pacte douanier et politique signé au début des années 90 par le Brésil, l'Argentine, l'Uruguay et le Paraguay. Plus tard, le reste de l’Amérique du Sud est devenu membre associé du Mercosur. L’organisation est une organisation utile pour apporter la prospérité et l’unité dont l’Amérique du Sud a besoin."
 BRA_trade_agreement: "Accords commerciaux"
 BRA_trade_agreement_desc: "Nous devrions continuer à faire davantage de commerce avec les autres pays d'Amérique du Sud. De cette façon, nous améliorerons nos relations et notre économie."
 BRA_discuss_currency: "Discuter d'une devise"
 BRA_discuss_currency_desc: "Une unité monétaire commune doit être convenue par tous les membres du MERCOSUR."
 BRA_people_goods: "Personnes et biens"
 BRA_people_goods_desc: "Nous devrions permettre la circulation non seulement des marchandises, mais aussi la circulation aisée des personnes à travers nos frontières."
 BRA_assoc_members: "Associer les nouveaux membres"
 BRA_assoc_members_desc: "L'un de nous, l'un de nous."
 MER_secretariat_reform: "Réforme du secrétariat du MERCOSUR"
 MER_secretariat_reform_desc: "Un bloc plus large ne peut plus être géré par une diplomatie improvisée. Pour que les nouveaux membres fassent confiance au MERCOSUR comme institution sérieuse, son noyau administratif doit être renforcé. Un secrétariat plus capable rendra adhésion, coordination et règlement des différends bien plus crédibles."
 MER_infrastructure_corridor_program: "Programme de corridors d'infrastructure"
 MER_infrastructure_corridor_program_desc: "L'intégration régionale n'a aucun sens si les routes s'arrêtent aux frontières et si la logistique s'effondre à l'intérieur. Le MERCOSUR doit être relié non seulement par des accords, mais par des infrastructures qui font circuler biens, capitaux et personnes à travers le continent. Un bloc plus fort se construit physiquement, il ne se déclare pas seulement."
 MER_development_fund: "Fonds de développement du MERCOSUR"
 MER_development_fund_desc: "Certains États ne se laisseront pas persuader par les seules promesses. Ils n'adhéreront que si l'intégration apporte un développement visible et de vrais investissements. En créant un Fonds de développement du MERCOSUR, nous pouvons faire de l'adhésion une opportunité et rendre l'appartenance matériellement attractive."
 mercosur_member_state_modifier: "État membre du Mercosur"
 mercosur_member_state_modifier_desc: "Le MERCOSUR a commencé comme cadre douanier et politique centré sur le Brésil, l'Argentine, l'Uruguay et le Paraguay, puis s'est étendu à l'Amérique du Sud par des partenariats associés. Participer au bloc lie notre avenir à un projet régional plus large de commerce, de coordination et de développement partagé.\n\n§YCet esprit national se renforce à mesure que davantage d'associés et de membres à part entière adhèrent !§!"
 MER_development_fund_round_modifier: "Décaissement du Fonds de développement du MERCOSUR"
 MER_development_fund_round_modifier_desc: "Le Fonds de développement du MERCOSUR finance actuellement de nouvelles constructions civiles et de bureaux dans tout le bloc. Tant que cette ronde de décaissements continue, les projets de développement économique sont poussés à un rythme accéléré."
 MER_mercosur_diplomacy: "Intégration sud-américaine"
 MER_mercosur_diplomacy_desc: "Le MERCOSUR est un cadre pour étendre le commerce et renforcer les liens de marché régionaux, tandis que l'UNASUL est une vision plus large de la coopération sud-américaine, jusqu'au dialogue politique, à l'infrastructure et à la sécurité. Par ces cadres, l'unité sud-américaine peut être renforcée et l'intégration régionale poussée plus loin.\n\n§YLes esprits nationaux du MERCOSUR et de l'UNASUL se renforcent à chaque nouvel État membre !§!"
 MER_invite_CHL_full_member: "Inviter le Chili en tant que membre à part entière"
 MER_invite_CHL_full_member_desc: "Ouvrir des négociations pour faire passer le Chili du statut d'associé à celui de membre à part entière du MERCOSUR.$MER_full_membership_acceptance_hint_desc$$MER_full_membership_invite_process_desc$"
 MER_invite_PRU_associate: "Inviter le Pérou comme État associé"
 MER_invite_PRU_associate_desc: "Ouvrir des pourparlers formels avec le Pérou pour rejoindre le MERCOSUR comme État associé.\n\n§YLe taux d'acceptation dépend de l'opinion de ce pays à votre égard, de votre influence sur lui et des progrès de l'arbre MERCOSUR !§!"
