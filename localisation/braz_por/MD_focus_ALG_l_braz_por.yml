l_braz_por:
 algeria_focus: "Árvore de Foco da Argélia"
 ALG_political_tree_shortcut: "Árvore Política"
 ALG_foreign_policy_shortcut: "Política Externa"
 ALG_industry_shortcut: "Recuperação Econômica"
 ALG_military_shortcut: "Forças Armadas Argelinas"
 ALG_the_nation_stands_at_a_crossroads: "A nação está numa encruzilhada"
 ALG_restore_the_presidency_desc: "Na esteira da turbulência política, a presidência foi enfraquecida. É hora de restaurar a autoridade de nosso líder eleito e reinstaurar as normas democráticas que foram corroídas. Ao restabelecer a presidência, podemos devolver estabilidade e confiança ao nosso governo."
 ALG_emergency_rule_continues: "§RO estado de emergência continua§!"
 ALG_emergency_rule_continues_desc: "Com a nação ainda em turbulência, o governo decidiu prorrogar o estado de emergência. Embora essa medida seja necessária para manter a ordem, ela tem um custo para as liberdades civis e os processos democráticos. Devemos agir com cautela ao navegar por essas águas turbulentas."
 ALG_national_reconciliation: "Reconciliação Nacional"
 ALG_national_reconciliation_desc: "Para curar as feridas da divisão e do conflito, devemos seguir o caminho da reconciliação nacional. Ao promover o diálogo entre todas as facções e atender às queixas, podemos construir uma sociedade mais unida e lançar as bases para uma paz duradoura."
 ALG_moderate_islamist_talks: "Diálogo com islamistas moderados"
 ALG_moderate_islamist_talks_desc: "Em um esforço para superar divisões e promover a estabilidade, estamos iniciando conversas com facções islamistas moderadas. Ao nos engajarmos em um diálogo construtivo, buscamos encontrar um terreno comum e criar um ambiente político onde vozes diversas possam coexistir pacificamente."
 ALG_charter_for_civil_peace: "Carta pela Paz Civil"
 ALG_charter_for_civil_peace_desc: "Para garantir estabilidade duradoura e harmonia social, propomos uma Carta pela Paz Civil. Este documento delineará os direitos e responsabilidades de todos os cidadãos, promovendo tolerância, compreensão e cooperação entre os diferentes grupos de nossa sociedade."
 ALG_open_democratic_path: "Abrir o caminho democrático"
 ALG_open_democratic_path_desc: "É hora de abraçar plenamente a democracia e abrir o caminho para um futuro mais promissor. Ao implementar reformas que empoderem nossos cidadãos e promovam a participação política, podemos criar uma sociedade democrática vibrante que reflita a vontade do povo."
 ALG_clamp_down_on_extremism: "Reprimir o extremismo"
 ALG_clamp_down_on_extremism_desc: "Por meio de tribunais militares e forças de inteligência, o governo eliminará todas as ameaças islamistas radicais e políticas remanescentes."
 ALG_counterterrorism_program: "Programa de contraterrorismo"
 ALG_counterterrorism_program_desc: "Um aparato de segurança moderno deve ser formado para rastrear, infiltrar e eliminar ameaças antes que desestabilizem a Argélia."
 ALG_authoritarian_restoration: "Restauração autoritária"
 ALG_authoritarian_restoration_desc: "A estabilidade só pode ser garantida por um governo firme e centralizado. Os militares assumirão o comando total do futuro da nação."
 ALG_counterterrorism_agency: "Agência de contraterrorismo"
 ALG_extremism_crackdown_modifier: "Repressão ao extremismo"
 ALG_extremism_crackdown_modifier_desc: "Em resposta ao aumento das ameaças de grupos extremistas que buscam desestabilizar nossa nação, estamos implementando uma repressão abrangente ao radicalismo. Esta iniciativa visa desmantelar redes extremistas, reforçar a vigilância e fortalecer a capacidade das forças de segurança. Ao promover uma cultura de tolerância e compreensão, esperamos atacar as causas profundas do extremismo e, ao mesmo tempo, garantir a segurança de nossos cidadãos. Com essas medidas, fomentaremos uma sociedade mais coesa e protegeremos nossos valores democráticos."
 ALG_military_regime_restored: "Regime militar restaurado"
 ALG_military_regime_restored_desc: "Após anos de instabilidade política, os militares retomaram o controle e restauraram a ordem. O regime se concentra em disciplina, segurança nacional e governança rigorosa para reconstruir a força e a unidade da nação."
 ALG_reconciliation_path_category: "Reconciliação Nacional"
 ALG_reconciliation_path_category_desc: "\n£AFG_menu1\n\n\n\nPara curar as feridas da divisão e do conflito, devemos seguir o caminho da reconciliação nacional. Ao promover o diálogo entre todas as facções e atender às queixas, podemos construir uma sociedade mais unida e lançar as bases para uma paz duradoura."
 ALG_pardon_moderate_islamist: "Perdoar islamistas moderados"
 ALG_pardon_moderate_islamist_desc: "Ex-islamistas não violentos podem receber anistia condicional em troca de desarmamento e renúncia à violência política."
 ALG_initiate_national_dialogues: "Iniciar o Diálogo Nacional"
 ALG_initiate_national_dialogues_desc: "Um fórum nacional será lançado para incluir ex-rebeldes, partidos políticos e a sociedade civil na construção de uma nova Argélia."
 ALG_reintegrate_former_fighter: "Reintegrar ex-combatentes"
 ALG_reintegrate_former_fighter_desc: "Um programa para reintegrar rebeldes rendidos à vida civil por meio de trabalho, moradia ou serviço nacional."
 ALG_crackdown_category: "Repressão Autoritária"
 ALG_crackdown_category_desc: "\n£TAJ_desctext_pamir\n\n\n\nPara garantir a estabilidade do Estado, devemos suprimir os elementos subversivos e fortalecer nossas forças de segurança interna."
 ALG_arrest_political_opponents: "Prender opositores políticos"
 ALG_arrest_political_opponents_desc: "Neutralizaremos as ameaças internas removendo atores políticos radicais do espaço público."
 ALG_expand_surveillance_services: "Expandir os serviços de vigilância"
 ALG_expand_surveillance_services_desc: "Uma robusta rede de inteligência monitorará a população e evitará agitações antes que se espalhem."
 ALG_ban_opposition_parties: "Banir partidos de oposição"
 ALG_ban_opposition_parties_desc: "Todos os partidos políticos não alinhados com a unidade nacional serão proibidos de participar da política."
 ALG_economic_recovery_category: "Programa de Recuperação Econômica"
 ALG_economic_recovery_category_desc: "\n£MAIN_desctext_dept\n\n\n\nO FMI oferece apoio condicional e a Argélia pode agora iniciar reformas mais amplas, empréstimos e privatizações."
 ALG_accept_imf_loan: "Aceitar o empréstimo do FMI"
 ALG_accept_imf_loan_desc: "Podemos aceitar a assistência financeira do FMI para estabilizar nossa moeda e iniciar reformas. Isso tem o custo de dívida de longo prazo e condicionalidades."
 ALG_start_oil_licensing: "Abrir licenciamento de petróleo a empresas estrangeiras"
 ALG_start_oil_licensing_desc: "Permitir que multinacionais acessem as reservas de petróleo pode acelerar o crescimento, mas aumentará a influência estrangeira."
 ALG_repay_imf_loan: "Quitar o empréstimo do FMI"
 ALG_repay_imf_loan_desc: "Com nossas finanças se estabilizando, podemos pagar nosso empréstimo para reduzir a dependência internacional."
 ALG_improve_public_services: "Melhorar os serviços públicos"
 ALG_improve_public_services_desc: "Expandiremos a saúde, a educação e o apoio às vítimas da guerra."
 ALG_international_aid_effort: "Esforço de ajuda internacional"
 ALG_international_aid_effort_desc: "Parcerias com a ONU e doadores podem impulsionar os serviços básicos e a reconstrução."
 ALG_building_civil_society: "Construir a sociedade civil"
 ALG_building_civil_society_desc: "Empoderar comunidades e programas sociais pode ajudar a evitar a retomada do conflito."
 ALG_economic_recovery_program: "Programa de Recuperação Econômica"
 ALG_economic_recovery_program_desc: "Lançamos um plano nacional de crescimento, apoiado por assistência estrangeira e reforma do Estado."
 ALG_remove_international_monitors: "Remover os observadores internacionais"
 ALG_remove_international_monitors_desc: "A Argélia se recuperou o bastante para recuperar plena soberania sobre seu caminho econômico."
 ALG_postwar_recovery_program: "Programa de Recuperação Pós-Guerra"
 ALG_postwar_recovery_program_desc: "A guerra acabou. Agora, começamos a reconstruir o Estado, a economia e a sociedade."
 ALG_un_aid_mission: "Missão de Ajuda da ONU"
 ALG_un_aid_mission_desc: "A ajuda das Nações Unidas e das ONGs auxiliará nossos serviços públicos básicos."
 ALG_social_healing_programs: "Programas de cura social"
 ALG_social_healing_programs_desc: "O trauma e a desconfiança do pós-guerra devem ser tratados com programas sociais e reconciliação."
 ALG_public_services_funding: "Financiamento dos serviços públicos"
 ALG_public_services_funding_desc: "Restauraremos o acesso à saúde, à moradia e a programas de emprego."
 ALG_finalize_recovery_phase: "Concluir a fase de recuperação"
 ALG_finalize_recovery_phase_desc: "Com a estabilidade restaurada, podemos reduzir a supervisão estrangeira e reconquistar a autonomia econômica."
 ALG_change_the_economy: "Mudar o modelo econômico"
 ALG_change_the_economy_desc: "É hora de escolher: devemos preservar o controle estatal ou liberalizar?"
 ALG_preserve_state_controlled_oil: "Preservar o controle estatal do petróleo"
 ALG_preserve_state_controlled_oil_desc: "A Sonatrach deve continuar sendo a espinha dorsal de nossa soberania e economia."
 ALG_industrial_expansion_plan: "Plano de Expansão Industrial"
 ALG_industrial_expansion_plan_desc: "Aumentaremos a produção doméstica por meio de infraestrutura e fábricas."
 ALG_open_market_reforms: "Reformas de abertura de mercado"
 ALG_open_market_reforms_desc: "A Argélia pode atrair investimentos e impulsionar o crescimento desregulamentando setores-chave."
 ALG_oil_licensing_program: "Lançar o Programa de Licenciamento de Petróleo"
 ALG_oil_licensing_program_desc: "Empresas estrangeiras poderão se candidatar a explorar campos de petróleo mediante contratos de licenciamento."
 ALG_urban_or_rural_development: "Tribos ou cidades?"
 ALG_urban_or_rural_development_desc: "Nosso foco no pós-guerra deve ser nas regiões tribais ou nas grandes cidades?"
 ALG_empower_rural_provinces: "Fortalecer as províncias rurais"
 ALG_empower_rural_provinces_desc: "Nosso sul rural e as regiões centrais da Cabília receberão investimento direto."
 ALG_tribal_consultative_council: "Formar o Conselho Consultivo Tribal"
 ALG_tribal_consultative_council_desc: "Anciãos locais e líderes regionais ajudarão a definir as prioridades de desenvolvimento."
 ALG_urbanization_initiative: "Lançar a Iniciativa de Urbanização"
 ALG_urbanization_initiative_desc: "Centros urbanos como Argel e Orã são a chave para nossa modernização."
 ALG_expand_the_capital: "Expandir a capital"
 ALG_expand_the_capital_desc: "Expandiremos a infraestrutura e os escritórios em Argel para fazer dela um verdadeiro polo moderno."
 ALG_foreign_policy_review: "Revisar a doutrina de política externa"
 ALG_foreign_policy_review_desc: "Com o retorno da estabilidade interna, a Argélia deve redefinir seu papel no cenário global."
 MSP_foreign_policy_review: "Revisar a doutrina de política externa"
 MSP_foreign_policy_review_desc: "Com o retorno da estabilidade interna, a Argélia deve redefinir seu papel no cenário global."
 ALG_africa_and_arab_nations: "África e nações árabes"
 ALG_africa_and_arab_nations_desc: "Vamos nos concentrar em liderar a diplomacia e o desenvolvimento tanto na África quanto no mundo árabe."
 ALG_western_sahara_position: "Apoiar o Saara Ocidental"
 ALG_western_sahara_position_desc: "Reafirmamos nosso apoio à independência saaraui contra as reivindicações marroquinas."
 ALG_african_union_engagement: "Ingressar na União Africana"
 ALG_african_union_engagement_desc: "A Argélia deve reingressar e assumir um papel de liderança na diplomacia continental."
 ALG_sahel_initiatives: "Expandir-se no Sahel"
 ALG_sahel_initiatives_desc: "Combateremos a instabilidade e o terrorismo no Sahel por meio de poder brando e defesa."
 ALG_choose_global_partner: "Escolher um parceiro global"
 ALG_choose_global_partner_desc: "Devemos nos alinhar econômica e militarmente a uma das superpotências mundiais."
 ALG_align_with_us: "Alinhar-se aos Estados Unidos"
 ALG_align_with_us_desc: "Cooperar com os Estados Unidos pode trazer segurança e influência econômica."
 ALG_align_with_china: "Alinhar-se à República Popular da China"
 ALG_align_with_china_desc: "A China oferece desenvolvimento econômico não intervencionista e grande potencial de investimento."
 ALG_align_with_russia: "Alinhar-se à Federação Russa"
 ALG_align_with_russia_desc: "A Rússia fornece tecnologia militar e compartilha o ceticismo da Argélia em relação ao domínio ocidental."
 ALG_non_aligned_revival: "Reviver a política externa não alinhada"
 ALG_non_aligned_revival_desc: "Reviveremos o espírito de neutralidade e solidariedade do Sul, como na década de 1960."
 ALG_global_south_solidarity: "Solidariedade com o Sul Global"
 ALG_global_south_solidarity_desc: "A Argélia fortalecerá os laços com nações pós-coloniais por meio de comércio, diplomacia e ajuda."
 ALG_future_national_policy: "§G O futuro da Argélia§!"
 ALG_future_national_policy_desc: "Com a guerra civil para trás, devemos agora definir o novo rumo político da Argélia.\n §RNOTA§!: §YEscolher este Foco levará a focos finais que substituirão a árvore de focos atual por uma personalizada para cada partido, portanto conclua outros focos importantes antes de terminar este§!"
 ALG_approach_nato: "§CAproximar-se da OTAN§!"
 ALG_approach_nato_desc: "O alinhamento ocidental pode trazer crescimento econômico e garantias de segurança."
 ALG_aspire_nato_support: "Aspirar a uma parceria com a OTAN"
 ALG_aspire_nato_support_desc: "Cumprindo as condições, a Argélia pode se tornar um Importante Aliado Extra-OTAN."
 ALG_invite_western_investors: "Convidar investidores ocidentais"
 ALG_invite_western_investors_desc: "Atrair capital e comércio de nações democráticas."
 ALG_request_us_protection: "Solicitar proteção dos EUA"
 ALG_request_us_protection_desc: "A Argélia pedirá aos Estados Unidos proteção ou garantias militares."
 ALG_remain_neutral: "§gPermanecer neutro§!"
 ALG_remain_neutral_desc: "O não alinhamento oferece liberdade diplomática e estabilidade interna."
 ALG_economy_first: "Priorizar a economia"
 ALG_economy_first_desc: "Reduzir os gastos militares e impulsionar a educação e o desenvolvimento de longo prazo."
 ALG_seek_un_protection: "Buscar proteção internacional"
 ALG_seek_un_protection_desc: "Se as ameaças aumentarem, recorreremos ao Conselho de Segurança da ONU em busca de proteção."
 ALG_align_with_china1: "§tAlinhar-se à China e à Rússia§!"
 ALG_align_with_china1_desc: "As potências orientais oferecem uma alternativa ao alinhamento com a OTAN."
 ALG_join_sco: "Pedir ingresso na OCX"
 ALG_join_sco_desc: "A Organização de Cooperação de Xangai oferece benefícios econômicos e de segurança."
 ALG_invite_eastern_investors: "Convidar investimento oriental"
 ALG_invite_eastern_investors_desc: "Fazer parcerias com empresas de infraestrutura chinesas e russas."
 ALG_request_chinese_protection: "Solicitar proteção chinesa"
 ALG_request_chinese_protection_desc: "Pequim pode concordar em garantir a independência e os investimentos da Argélia."
 ALG_reform_the_military: "Reformar os militares"
 ALG_reform_the_military_desc: "As forças armadas argelinas exigem uma profunda reforma estrutural para enfrentar os desafios do século XXI."
 ALG_military_academy_upgrade: "Modernizar a Academia Militar"
 ALG_military_academy_upgrade_desc: "Investir em educação é a chave para formar oficiais competentes e profissionais."
 ALG_internal_security_brigade: "Formar Brigadas de Segurança Interna"
 ALG_internal_security_brigade_desc: "Devemos garantir a ordem interna por meio de unidades especializadas de segurança interna."
 ALG_military_industry_support: "Apoiar a indústria militar"
 ALG_military_industry_support_desc: "Fortalecer nossa base industrial militar ajudará a garantir a autossuficiência."
 ALG_anti_air_force: "Estabelecer o Comando Antiaéreo"
 ALG_anti_air_force_desc: "As capacidades de defesa aérea são vitais para proteger nossos céus."
 ALG_mechanized_modernization: "Modernização das forças mecanizadas"
 ALG_mechanized_modernization_desc: "Unidades mecanizadas modernas são o núcleo de uma força terrestre eficaz."
 ALG_uav_development: "Programa de Desenvolvimento de Drones"
 ALG_uav_development_desc: "Sistemas aéreos não tripulados nos darão capacidade de vigilância e ataque de precisão."
 ALG_national_guard_initiative: "Iniciativa da Guarda Nacional"
 ALG_national_guard_initiative_desc: "Um corpo de defesa formado por cidadãos pode ajudar a estabilizar áreas rurais e de fronteira."
 ALG_air_force_reform: "Reformar a Força Aérea"
 ALG_air_force_reform_desc: "Renovar doutrinas e equipamentos é fundamental para nossa superioridade aérea."
 ALG_infantry_equipment_project: "Modernizar o equipamento da infantaria"
 ALG_infantry_equipment_project_desc: "Nossa infantaria merece o que há de mais recente em armamento e equipamento de proteção."
 ALG_ballistic_program: "Programa de Mísseis Balísticos"
 ALG_ballistic_program_desc: "Expandir nossas capacidades de mísseis reforçará a dissuasão estratégica."
 ALG_simulation_center: "Centro de Simulação Militar"
 ALG_simulation_center_desc: "Estabelecer centros de treinamento modernos melhorará drasticamente nossa prontidão de combate."
 ALG_logistics_command: "Estabelecer o Comando de Logística"
 ALG_logistics_command_desc: "Racionalizar a logística garante que nossas tropas permaneçam eficazes em combate."
 ALG_military_doctrine_finalization: "Finalizar a doutrina militar"
 ALG_military_doctrine_finalization_desc: "Devemos consolidar as reformas em uma doutrina moderna."
 ALG_foreign_arms_contracts: "Contratos de armas estrangeiras"
 ALG_foreign_arms_contracts_desc: "Parcerias estratégicas podem ajudar a preencher rapidamente as lacunas em nosso arsenal."
 ALG_local_armor_production: "Produção local de blindados"
 ALG_local_armor_production_desc: "Iniciar a produção local de blindados de transporte e tanques garante autonomia e crescimento."
 ALG_military_university_program: "Programa Universitário Militar"
 ALG_military_university_program_desc: "Investir em academias militares preparará nossa próxima geração de líderes."
 ALG_heavy_artillery_project: "Iniciativa de Artilharia Pesada"
 ALG_heavy_artillery_project_desc: "Daremos prioridade à pesquisa e ao desenvolvimento nacionais de artilharia pesada."
 ALG_special_operations_command: "Comando de Operações Especiais"
 ALG_special_operations_command_desc: "Um comando centralizado para unidades de elite melhora a coordenação e a eficácia."
 ALG_joint_command_center: "Estabelecer o Centro de Comando Conjunto"
 ALG_joint_command_center_desc: "Combinar as forças em um centro de operações conjuntas aprimorará a integração estratégica."
 ALG_indigenous_rifle_program: "Programa de Fuzil Nacional"
 ALG_indigenous_rifle_program_desc: "Desenvolver nossas próprias armas leves avançadas é uma prioridade nacional."
 ALG_integrated_defense_network: "Rede de Defesa Integrada"
 ALG_integrated_defense_network_desc: "Um sistema unificado de radar e comunicação fortalece a defesa nacional."
 ALG_advanced_command_structure: "Estrutura de Comando Avançada"
 ALG_advanced_command_structure_desc: "Implementaremos um moderno sistema de comando C4ISR para o campo de batalha digital."
 ALG_military_modernization_complete: "Modernização militar concluída"
 ALG_military_modernization_complete_desc: "Nosso longo caminho de reformas finalmente deu frutos. A Argélia agora conta com uma força moderna e coesa."
 ALG_idea_non_aligned_policy: "Política externa não alinhada"
 ALG_idea_non_aligned_policy_desc: "Nosso caminho independente nos permite nos beneficiar de todos os blocos sem nos alinhar a nenhum."
 ALG_presidential_succession_crisis: "Crise de sucessão presidencial"
 ALG_presidential_succession_crisis_desc: "Com a estabilidade se esvaindo, a questão da liderança ressurge. Continuamos sob o antigo regime ou forjamos um novo caminho?"
 ALG_stay_with_bouteflika: "Manter a liderança de Bouteflika"
 ALG_stay_with_bouteflika_desc: "Bouteflika representa continuidade e corrupção. Podemos ganhar estabilidade financeira, mas ao custo da legitimidade."
 ALG_choose_tebboune: "Nomear Tebboune"
 ALG_choose_tebboune_desc: "Um tecnocrata moderado com reformas voltadas à estabilidade, mas que custará caro ao tesouro."
 ALG_choose_msp: "Nomear o líder do MSP"
 ALG_choose_msp_desc: "Uma alternativa islamista alinhada à Irmandade Muçulmana. Traz popularidade em certos círculos, mas arrisca um conflito civil com a elite militar entrincheirada."
 ALG_random_president: "Escolher um presidente aleatório"
 ALG_random_president_desc: "Uma carta coringa. Este novo presidente pode salvar ou condenar a Argélia."
 ALG_resolve_presidency_crisis: "Crise da presidência resolvida"
 ALG_resolve_presidency_crisis_desc: "A questão da liderança foi respondida. Agora é hora de seguir em frente."
 ALG_idea_bouteflika_legacy: "Legado de Bouteflika"
 ALG_idea_bouteflika_legacy_desc: "Apesar da corrupção profunda e da desconfiança, a era Bouteflika continua sinônimo da governança passada da Argélia. Sua rede continua influente."
 ALG_idea_tebboune_moderate: "Presidência moderada de Tebboune"
 ALG_idea_tebboune_moderate_desc: "Com uma imagem de estabilidade e reformas graduais, Tebboune busca manter a ordem enquanto limpa a governança."
 ALG_idea_msp_presidency: "Presidência do MSP"
 ALG_idea_msp_presidency_desc: "O Movimento da Sociedade pela Paz assumiu o poder. Resta saber se isso marca uma transformação pacífica ou uma descida ao conflito."
 ALG_idea_random_good: "Novo presidente eficaz"
 ALG_idea_random_good_desc: "Por sorte ou estratégia, o novo presidente é competente e inspirado, trazendo reforma e direção."
 ALG_idea_random_bad: "Novo presidente inepto"
 ALG_idea_random_bad_desc: "Este líder é despreparado, sobrecarregado e possivelmente corrupto. Uma péssima escolha para um momento crítico."
 ALG_presidency.1.t: "Tensões com os militares"
 ALG_presidency.1.d: "Após a nomeação do líder do MSP como Presidente, a elite militar está furiosa. Ela vê isso como uma ameaça ao seu antigo domínio do poder. Circulam rumores de mobilizações secretas, e unidades armadas leais à velha guarda começam a se movimentar. Os militares aceitarão essa mudança ou se rebelarão?"
 ALG_presidency.1.a: "Os militares aceitam o novo governo"
 ALG_presidency.1.b: "Os militares se rebelam – começa a Guerra Civil!"
 ALG_presidency_army_accepts_tt: "O Exército aceita a contragosto o governo do MSP. Por ora, a paz se mantém."
 ALG_presidency_army_civilwar_tt: "Um golpe militar explode em guerra civil aberta!"
 ALG_economy_digital_initiative: "Iniciativa de Economia Digital"
 ALG_economy_digital_initiative_desc: "A Argélia deve abraçar a era digital para modernizar sua economia. Investimentos em infraestrutura tecnológica, serviços de governo eletrônico e programas de alfabetização digital nos posicionarão para a economia do século XXI."
 ALG_digital_initiative_tt: "§GA Argélia lança um programa abrangente de transformação digital:§!\n- Modernizar os serviços governamentais\n- Expandir a infraestrutura de internet\n- Promover startups de tecnologia\n- Capacitar a força de trabalho em habilidades digitais"
 ALG_digital_economy_initiative: "Iniciativa de Economia Digital"
 ALG_digital_economy_initiative_desc: "Nosso investimento em infraestrutura digital e educação tecnológica está dando frutos. Os serviços governamentais estão mais eficientes, as empresas adotam práticas modernas e uma nova geração de trabalhadores familiarizados com tecnologia está entrando no mercado."
 ALG_arpt_regulatory_framework: "Estabelecer a Autoridade Reguladora ARPT"
 ALG_arpt_regulatory_framework_desc: "A Autorité de Régulation de la Poste et des Télécommunications (ARPT) garantirá um mercado de telecomunicações competitivo e protegerá os direitos dos consumidores."
 ALG_algerie_telecom_expansion: "Modernização da Algérie Télécom"
 ALG_algerie_telecom_expansion_desc: "Modernizar e expandir a infraestrutura da Algérie Télécom para melhorar o acesso à banda larga e as comunicações públicas."
 ALG_nedjma_and_mobilis: "Concorrência entre Nedjma e Mobilis"
 ALG_nedjma_and_mobilis_desc: "Incentivar a concorrência saudável entre operadoras como Nedjma e Mobilis reduzirá os preços e melhorará a qualidade do serviço."
 ALG_fiber_optic_program: "Infraestrutura de fibra óptica"
 ALG_fiber_optic_program_desc: "Investir na implantação de fibra óptica em todo o país para aumentar a conectividade e a velocidade da rede."
 ALG_4g_rollout: "Implantar serviços 4G"
 ALG_4g_rollout_desc: "Lançar a internet móvel 4G transformará a conectividade, permitindo melhores serviços eletrônicos e produtividade digital."
 ALG_air_algerie_modernization: "Modernização da Air Algérie"
 ALG_air_algerie_modernization_desc: "Fortalecer a frota e as rotas da Air Algérie impulsionará o turismo e melhorará a logística internacional."
 ALG_international_airports_upgrade: "Modernizar os principais aeroportos"
 ALG_international_airports_upgrade_desc: "Investir em aeroportos como Argel, Orã e Constantina para torná-los polos do tráfego aéreo regional e global."
 ALG_aadl_housing_projects: "Programas habitacionais da AADL"
 ALG_aadl_housing_projects_desc: "A Agência Nacional para a Melhoria e o Desenvolvimento da Habitação fornecerá moradia subsidiada e desenvolvimento urbano para a crescente população urbana."
 ALG_urbanization_initiatives: "Iniciativas de Desenvolvimento Urbano"
 ALG_urbanization_initiatives_desc: "Expandir estradas, serviços públicos e zonas de construção apoiará nossas cidades em crescimento e melhorará a qualidade de vida."
 ALG_arpt_regulation: "Autoridade Reguladora ARPT"
 ALG_arpt_regulation_desc: "A ARPT garante práticas de mercado justas, concorrência e proteção ao consumidor no setor de telecomunicações."
 ALG_algerie_telecom_program: "Programa da Algérie Télécom"
 ALG_algerie_telecom_program_desc: "Um plano abrangente de modernização da operadora estatal de telecomunicações."
 ALG_mobile_operator_competition: "Reforma da concorrência em telecomunicações"
 ALG_mobile_operator_competition_desc: "A competitividade de mercado entre Nedjma e Mobilis estimulou a inovação e preços acessíveis."
 ALG_4g_coverage: "Cobertura nacional 4G"
 ALG_4g_coverage_desc: "A banda larga móvel avançada melhora a comunicação e sustenta uma economia digital."
 ALG_national_innovation_push: "Impulso Nacional à Inovação"
 ALG_national_innovation_push_desc: "Uma iniciativa apoiada pelo governo para promover a inovação e o desenvolvimento tecnológico em todos os setores."
 ALG_highway_project: "Projeto da Rodovia Leste–Oeste"
 ALG_highway_project_desc: "Um projeto de $13 bilhões ligando o Leste ao Oeste modernizará o transporte e reduzirá o tempo de viagem."
 ALG_air_algerie_investment: "Investimento na Air Algérie"
 ALG_air_algerie_investment_desc: "Expandir a companhia aérea nacional da Argélia abre novas oportunidades de comércio e viagens."
 ALG_air_hub_status: "Polo aéreo regional de Argel"
 ALG_air_hub_status_desc: "Argel tem potencial para se tornar um polo central entre a África, a Europa e o Oriente Médio."
 ALG_aadl_program: "Iniciativa Habitacional da AADL"
 ALG_aadl_program_desc: "A Agência Nacional para a Melhoria e o Desenvolvimento da Habitação pretende construir moradias acessíveis para milhares de famílias em toda a Argélia."
 ALG_kabylia_unrest: "Agitação na Cabília"
 ALG_kabylia_unrest_desc: "Desde a 'Primavera Berbere' de 1980, a Cabília é marcada por protestos periódicos, reivindicações culturais e desconfiança em relação ao governo central. Essas tensões fervem sob a superfície, minando a estabilidade e ameaçando explodir em agitação mais ampla se não forem tratadas. Se não forem resolvidas, os acontecimentos podem escalar dramaticamente no futuro."
 ALG_black_spring.1.t: "Agitação na Cabília"
 ALG_black_spring.1.d: "Após a morte de Massinissa Guermah pelas forças da gendarmaria, protestos em massa eclodiram na Cabília. A agitação cresce a cada dia."
 ALG_black_spring.1.a: "Isso precisa ser resolvido."
 ALG_black_decade: "Década Negra"
 ALG_black_decade_desc: "A Guerra Civil Argelina, conhecida na Argélia como Década Negra, foi uma guerra civil travada entre o governo argelino e vários grupos rebeldes islamistas de 11 de janeiro de 1992 (após um golpe que anulou uma vitória eleitoral islamista) a 8 de fevereiro de 2002. A guerra começou lentamente, pois inicialmente parecia que o governo havia esmagado com sucesso o movimento islamista, mas grupos armados surgiram para declarar jihad e, em 1994, a violência havia atingido um nível tal que parecia que o governo poderia não resistir. Em 1996–97, tornou-se claro que a resistência islamista havia perdido seu apoio popular, embora os combates tenham continuado por vários anos depois."
 ALG_maghreb_invite.1.t: "Convite para a União do Magrebe"
 ALG_maghreb_invite.1.d: "A Argélia propõe uma aliança econômica e militar norte-africana. Vamos aderir?"
 ALG_maghreb_invite.1.a: "Aderir à União"
 ALG_maghreb_invite.1.b: "Recusar (Apenas Marrocos)"
 ALG_maghreb_trade_hub: "Polo Comercial do Magrebe"
 ALG_maghreb_trade_hub_desc: "Nossa economia prospera como centro do comércio norte-africano."
 ALG_maghreb_diplomacy: "Diplomacia do Magrebe"
 ALG_maghreb_diplomacy_desc: "A Argélia se afirma como líder do Norte da África, fomentando a unidade por meio do comércio e da segurança compartilhada."
 ALG_maghreb_union_tt: "União do Magrebe formada\nArgélia, Tunísia e outras nações norte-africanas agora compartilham laços econômicos e militares sob nossa liderança."
 ALG_trade_allies: "Aliados comerciais"
 ALG_egypt_algiers_axis: "Eixo Egito-Argel"
 ALG_egypt_algiers_axis_desc: "Nossas relações com o Egito vêm de longa data. Devemos continuar fortalecendo nossa posição na África e liderar este continente."
 FIS_Are_Terrorists: "A FIS é terrorista"
 ALG_un_peacekeepers: "Forças de paz da ONU mobilizadas"
 ALG_un_peacekeepers_desc: "As Nações Unidas enviaram forças de paz para estabilizar a região e evitar novos conflitos. Sua missão é manter a ordem, proteger civis e apoiar os esforços diplomáticos rumo a uma paz duradoura."
 ALG_civil_war_recovered: "Guerra civil superada"
 ALG_civil_war_recovered_desc: "A nação emergiu da turbulência da guerra civil, iniciando o longo processo de cura e reconstrução. Os esforços se concentram em restaurar a unidade, reconstruir a infraestrutura e evitar futuros conflitos internos."
 ALG_sonatrach_restructure: "Reestruturação da Sonatrach"
 ALG_sonatrach_restructure_desc: "A petrolífera nacional Sonatrach passa por uma grande reestruturação para melhorar a eficiência, aumentar a produção e fortalecer a estabilidade econômica. Essa transformação visa impulsionar o setor energético do país e apoiar o crescimento de longo prazo"
 ALG_investment_boom_modifier: "Boom de investimentos"
 ALG_investment_boom_modifier_desc: "O país vive um surto de investimentos domésticos e estrangeiros, alimentando o rápido crescimento e desenvolvimento econômico. Esse boom aumenta a capacidade industrial, a infraestrutura e a prosperidade geral."
 ALG_foreign_oil_licensing_bonus: "Licenciamento de petróleo estrangeiro"
 ALG_foreign_oil_licensing_bonus_desc: "Concede acesso temporário de empresas estrangeiras aos nossos campos de petróleo, aumentando nossa capacidade de produção."
 ALG_idea_pro_palestinian_campaign: "Campanha pró-Palestina"
 ALG_idea_pro_palestinian_campaign_desc: "Aumenta as relações com grupos palestinos e potencialmente reforça o apoio a movimentos de independência argelinos na região."
 ALG_idea_palestinian_backing: "Apoio da Argélia aos direitos palestinos"
 ALG_idea_palestinian_backing_desc: " Análise do apoio histórico e contínuo da Argélia aos direitos palestinos, incluindo posições diplomáticas, iniciativas de ajuda e engajamento político mais amplo."
 ALG_idea_palestinian_aid_fund: "Fundo argelino de ajuda à Palestina"
 ALG_idea_palestinian_aid_fund_desc: "Um fundo criado pela Argélia para fornecer ajuda humanitária e de desenvolvimento ao povo palestino. Pode incluir socorro emergencial, desenvolvimento de infraestrutura, educação e iniciativas de empoderamento econômico."
 ALG_crackdown_backfired: "A repressão saiu pela culatra"
 ALG_idea_refoming_education1: "Reformar a educação"
 ALG_idea_refoming_education: "Reformar a educação"
 ALG_university_expansion: "Expansão universitária"
 ALG_basic_income_support: "Apoio de renda básica"
 ALG_housing_support_idea: "Apoio à moradia"
 ALG_childcare_reform: "Reforma da assistência à infância"
 ALG_civil_rights: "Conceder direitos civis"
 ALG_public_admin_reform: "Transporte público gratuito"
 MSP_switch_to_morocco: "Abandonar o Saara Ocidental"
 MSP_switch_to_morocco_desc: "Apoiar os saarauís azedou nossas relações com Marrocos. Marrocos é uma potência econômica em ascensão, uma nação poderosa bem ao nosso lado. Faria mais sentido abandonar nosso apoio sem sentido aos saarauís e construir relações amistosas com Marrocos."
 MSP_influence_mauritania: "Influenciar a Mauritânia"
 MSP_influence_mauritania_desc: "A Mauritânia travou uma curta guerra contra Marrocos pelo Saara Ocidental depois que a Espanha deixou a região. Ela não reivindica mais o território, mas acompanhou intensamente o conflito do Saara Ocidental e é uma das apoiadoras da Frente Polisário. É importante aumentar nosso controle sobre ela para resolver o conflito do Saara Ocidental."
 MSP_casablanca_accords: "Acordos de Casablanca"
 MSP_casablanca_accords_desc: "O conflito no Saara Ocidental está congelado há décadas sem que ninguém consiga resolvê-lo. Precisamos usar nossa influência na região para resolver o conflito."
 ALG_influence_mauritania: "Influenciar a Mauritânia"
 ALG_influence_mauritania_desc: "A Mauritânia travou uma curta guerra contra Marrocos pelo Saara Ocidental depois que a Espanha deixou a região. Ela não reivindica mais o território, mas acompanhou intensamente o conflito do Saara Ocidental e é uma das apoiadoras da Frente Polisário. É importante aumentar nosso controle sobre ela para resolver o conflito do Saara Ocidental."
 ALG_energy_reform: "Reforma energética"
 ALG_energy_reform_desc: "Precisamos resolver nosso problema de energia. Reformando a indústria energética, podemos distribuir energia para todo o país."
 ALG_focus_on_oil: "Focar no petróleo"
 ALG_focus_on_oil_desc: "Há muitas veias de petróleo inexploradas por toda a Argélia e, segundo alguns estudos, a Argélia pode ser um dos países mais ricos em petróleo do mundo, com a maior parte desse petróleo ainda intocada. Por isso, devemos focar no petróleo"
 ALG_focus_on_oil_tt: "§CFocar no petróleo nos permitirá lucrar mais vendendo energia aos nossos vizinhos, mas será desastroso para Hassi Messaoud!§!"
 ALG_focus_on_renewables: "Focar em renováveis"
 ALG_focus_on_renewables_desc: "A Argélia é um país onde nenhuma aldeia é pequena demais para o sol. Precisamos dar o exemplo ao resto do mundo e construir uma rede de energia sustentável. Será caro, mas valerá a pena para as gerações futuras"
 ALG_focus_on_renewables_tt: "§CFocar em energia renovável não gerará tanto lucro quanto usar petróleo, mas será melhor para Hassi Messaoud!§!"
 ALG_oil_production: "Trabalhar com a Sonatrach"
 ALG_oil_production_desc: "A principal empresa argelina de petróleo e gás é a Sonatrach, uma entidade estatal. É uma grande participante do mercado global de energia e busca ativamente investimentos e parcerias no setor de petróleo e gás. A Sonatrach atua em todos os aspectos da cadeia de valor de hidrocarbonetos, da exploração e produção ao refino e distribuição."
 ALG_grid_expansion: "Expansão da rede elétrica"
 ALG_grid_expansion_desc: "É bom que possamos produzir nossa própria eletricidade, mas também precisamos de uma rede elétrica robusta para levar a eletricidade por todo o país e aos nossos vizinhos"
 ALG_solar_panel_grid: "Rede de painéis solares"
 ALG_solar_panel_grid_desc: "Considerando nossa posição geográfica, o sol está quase sempre em abundância na Argélia. Isso a torna um local incrível para instalar usinas de energia solar"
 ALG_hassi_massoud_exploitation: "Exploração de Hassi Messaoud"
 ALG_resource_excavation_research: "Pesquisa de extração de petróleo"
 ALG_resource_excavation_research_desc: "Parte do petróleo está em locais de difícil acesso. Precisamos trabalhar com a Universidade de Argel 1 para encontrar maneiras de extrair cada gota possível de petróleo"
 ALG_wind_turbine_research: "Pesquisa de turbinas eólicas"
 ALG_wind_turbine_research_desc: "Com a tecnologia atual, instalar parques eólicos na Argélia é impossível. As condições de vento simplesmente não são adequadas para turbinas contemporâneas. Precisamos investir em pesquisa de soluções para esse problema"
 ALG_ethanol_power_plant: "Usina de etanol"
 ALG_ethanol_power_plant_desc: "Usando etanol derivado de esterco bovino, podemos criar uma forma sustentável de gerar eletricidade"
 ALG_algeria_steelworks: "Siderúrgica da Argélia"
 ALG_algeria_steelworks_desc: "Precisamos extrair mais petróleo! Com todo o petróleo extra, também podemos montar uma fábrica de aço"
 ALG_Adrar_wind_park: "Parque eólico de Adrar"
 ALG_Adrar_wind_park_desc: "A fazenda eólica de Adrar é uma fazenda natural no sul da Argélia. O terreno próximo à fazenda é adequado para instalar parques eólicos, e é ali que instalaremos o primeiro parque eólico da Argélia"
 ALG_national_space_program: "Programa Espacial Nacional"
 ALG_national_space_program_desc: "A Argélia deve estabelecer um programa espacial nacional para entrar no rol das nações que exploram o espaço. Esta iniciativa lançará as bases para futuras conquistas em exploração espacial e tecnologia de satélites."
 ALG_arab_world_outreach: "Aprofundar os laços diplomáticos árabes"
 ALG_arab_world_outreach_desc: "Para fortalecer a influência da Argélia no mundo árabe, devemos revitalizar nossos esforços de aproximação e coordenação diplomática. Por meio de visitas bilaterais, cúpulas e iniciativas comerciais, a Argélia pode se afirmar como força unificadora na região."
 ALG_join_arab_league: "Fortalecer o engajamento na Liga Árabe"
 ALG_join_arab_league_desc: "Como membro da Liga Árabe, a Argélia pode ir além da participação e assumir um papel diplomático de liderança. Promover a coordenação econômica, consultas de defesa e solidariedade cultural elevará nossa posição no mundo árabe."
 ALG_support_palestine: "Apoiar a causa palestina"
 ALG_support_palestine_desc: "O relacionamento de longa data da Argélia com a Palestina está enraizado em experiências históricas compartilhadas e solidariedade política. Essa ligação se manifesta de várias formas, incluindo apoio diplomático à autodeterminação palestina e ajuda humanitária. O compromisso da Argélia com a causa palestina é um aspecto central de sua política externa."
 ALG_algeria_algiers_axis: "Forjar o Eixo Egito-Argel"
 ALG_algeria_algiers_axis_desc: "Alinhando-se mais estreitamente ao Egito, a Argélia pode ajudar a formar um poderoso bloco regional capaz de guiar a unidade árabe, garantir a estabilidade do Norte da África e contrabalançar a influência estrangeira."
 ALG_condemn_israel: "Condenar as ações israelenses"
 ALG_condemn_israel_desc: "Diante da agressão contínua e das violações de direitos humanos, a Argélia condenará formalmente as ações israelenses no cenário internacional, mobilizando apoio a uma paz justa e opondo-se à normalização sem resolução."
 ALG_palestinian_aid_package: "Pacote de ajuda à Palestina"
 ALG_palestinian_aid_package_desc: "Alocaremos recursos para fornecer assistência humanitária, econômica e técnica aos territórios palestinos, garantindo que o compromisso da Argélia vá além das palavras e se traduza em ajuda real e impactante."
 ALG_pan_african_defense_initiative: "Iniciativa de Defesa Pan-Africana"
 ALG_pan_african_defense_initiative_desc: "Para proteger a soberania africana e aumentar a estabilidade continental, a Argélia proporá uma iniciativa coordenada de defesa africana que construa prontidão militar coletiva contra ameaças compartilhadas."
 ALG_send_troops_to_sahel: "Enviar forças ao Sahel"
 ALG_send_troops_to_sahel_desc: "Em resposta à crescente instabilidade no Sahel, a Argélia enviará tropas para apoiar operações de paz, proteção de fronteiras e campanhas antiterror em colaboração com os governos regionais."
 ALG_sahel_stabilization_force: "Força de Estabilização do Sahel"
 ALG_sahel_stabilization_force_desc: "A Argélia assumirá a liderança na criação de uma Força de Estabilização do Sahel permanente, uma estrutura de segurança liderada pela África para combater insurgências e redes criminosas na região."
 ALG_exploit_sahel_resources: "Explorar os recursos do Sahel"
 ALG_exploit_sahel_resources_desc: "A influência argelina no Sahel oferece acesso a recursos naturais inexplorados. Negociando contratos de mineração e infraestrutura, podemos garantir ganhos econômicos e parcerias estratégicas na região."
 ALG_propose_maghreb_union: "Propor a União do Magrebe"
 ALG_propose_maghreb_union_desc: "É hora de reviver a visão de um Magrebe unido. A Argélia tomará a iniciativa de propor esforços renovados de integração, com foco em cooperação econômica, infraestrutura conjunta e alinhamento diplomático."
 ALG_economic_integration_initiative: "Integração Econômica do Magrebe"
 ALG_economic_integration_initiative_desc: "Por meio de tarifas reduzidas, investimento em infraestrutura e discussões sobre política monetária sincronizada, a Argélia impulsionará os esforços para criar uma zona econômica comum do Magrebe que beneficie todos os Estados-membros."
 ALG_maghreb_joint_defense_pact: "Pacto de Defesa Conjunta do Magrebe"
 ALG_maghreb_joint_defense_pact_desc: "Um Magrebe seguro exige defesa coletiva. Proporemos um pacto militar regional focado em proteção de fronteiras, compartilhamento de inteligência e exercícios militares conjuntos."
 ALG_idea_joint_military_arab: "Forças Armadas Árabes Conjuntas"
 palestine_issue_very_positive: "Apoiar a questão palestina"
 ALG_algerian_airforce: "Modernizar a Força Aérea Argelina"
 ALG_algerian_airforce_desc: "Uma força aérea moderna e capaz é essencial para a defesa nacional. Investiremos em reestruturação, treinamento de pilotos e aquisição de equipamentos para aumentar a prontidão aérea."
 ALG_buy_russia_su_27: "Adquirir Su-27 russos"
 ALG_buy_russia_su_27_desc: "Como parte da modernização de nossa força aérea, negociaremos com a Rússia a compra de um lote de caças Su-27, reforçando nossa superioridade aérea e dissuasão estratégica."
 ALG_oum_el_bouaghi_airbase: "Expandir a base aérea de Oum El Bouaghi"
 ALG_oum_el_bouaghi_airbase_desc: "Estrategicamente localizada no leste, Oum El Bouaghi será expandida e se tornará um importante polo operacional da força aérea da Argélia, ampliando nossa capacidade de mobilização rápida."
 ALG_protect_the_skies: "Proteger os céus"
 ALG_protect_the_skies_desc: "Com o aumento das ameaças aéreas regionais, a Argélia deve garantir que consiga detectar e interceptar quaisquer incursões. Fortalecer nossas defesas aéreas é uma prioridade de segurança nacional."
 ALG_russia_mig_servicing: "Contratos de manutenção de MiGs russos"
 ALG_russia_mig_servicing_desc: "Manter e modernizar nossa frota de MiGs exige uma cooperação mais profunda com empreiteiras russas. Esses acordos de manutenção garantirão a longevidade operacional das aeronaves existentes."
 ALG_bosnian_parts: "Garantir peças de reposição bósnias"
 ALG_bosnian_parts_desc: "A Argélia obterá componentes excedentes da indústria de defesa da Bósnia para sustentar e readequar nossas fuselagens envelhecidas, garantindo manutenção e reparo de baixo custo."
 ALG_comprehensive_radar_installations: "Expansão da cobertura de radar"
 ALG_comprehensive_radar_installations_desc: "Para alcançar cobertura de radar nacional completa, construiremos instalações de radar avançadas ao longo das fronteiras e da costa da Argélia, eliminando todos os pontos cegos em nosso espaço aéreo."
 ALG_reform_or_control: "Reforma ou controle"
 ALG_reform_or_control_desc: "A Argélia está numa encruzilhada política. A escolha entre uma verdadeira reforma democrática ou a consolidação do controle autoritário definirá o futuro da nação."
 ALG_legalize_moderate_islamists: "Legalizar islamistas moderados"
 ALG_legalize_moderate_islamists_desc: "Reconhecer partidos islamistas moderados oferece um caminho para a estabilidade por meio da inclusão. A participação cuidadosamente monitorada em eleições pode desarmar sentimentos radicais."
 ALG_restore_elections: "Restaurar os processos eleitorais"
 ALG_restore_elections_desc: "Para relegitimar o Estado, a Argélia deve retomar eleições livres e justas. Transparência e responsabilização serão os pilares de nossa nova era política."
 ALG_public_media_and_transparency: "Fortalecer a mídia pública e a transparência"
 ALG_public_media_and_transparency_desc: "A reforma da mídia estatal e a liberdade de imprensa são vitais para reconstruir a confiança pública. Uma cidadania informada é essencial para o desenvolvimento democrático."
 ALG_crackdown_on_opposition: "Reprimir a oposição"
 ALG_crackdown_on_opposition_desc: "Para evitar a desestabilização, a dissidência deve ser contida. Vigilância, censura e prisões direcionadas neutralizarão elementos antigoverno."
 ALG_state_surveillance_network: "Rede estatal de vigilância"
 ALG_state_surveillance_network_desc: "Uma rede nacional de inteligência será expandida para monitorar atividades políticas, garantindo que as ameaças sejam neutralizadas antes de escalarem."
 ALG_joint_governance_experiment: "Experimento de governança conjunta"
 ALG_joint_governance_experiment_desc: "Testaremos uma nova forma de divisão de poder entre forças seculares e religiosas para evitar a retomada do conflito. Esse experimento arriscado pode trazer paz ou paralisia."
 ALG_a_radical_reorientation: "Uma reorientação radical"
 ALG_a_radical_reorientation_desc: "A ordem existente fracassou. Por meio de mandato divino e clareza ideológica, surge um novo caminho, guiado por uma crença intransigente e pela rejeição da legitimidade do Estado secular."
 ALG_covert_support_for_islamist_radicals: "Apoio encoberto a radicais islamistas"
 ALG_covert_support_for_islamist_radicals_desc: "Redes radicais continuam ativas nas sombras. Com financiamento estratégico e assistência logística encoberta, podemos capacitar esses grupos a agir contra o regime por dentro."
 ALG_tolerate_radical_preachers: "Tolerar pregadores radicais"
 ALG_tolerate_radical_preachers_desc: "O púlpito é uma ferramenta poderosa. Fazendo vista grossa a sermões inflamados, permitimos que a ideologia se espalhe organicamente por mesquitas e mídia, radicalizando a população a nosso favor."
 ALG_welcome_militants: "Acolher militantes estrangeiros"
 ALG_welcome_militants_desc: "Nossa causa transcende fronteiras. Combatentes estrangeiros alinhados à nossa ideologia podem ser abrigados com segurança e integrados a células locais, trazendo experiência de combate e dedicação inabalável."
 ALG_arms_smuggling: "Operações de contrabando de armas"
 ALG_arms_smuggling_desc: "Para nos preparar para um confronto futuro, devemos estabelecer cadeias de suprimento clandestinas de armas e munições. Alianças com traficantes de armas transnacionais atenderão às nossas necessidades."
 ALG_start_the_uprising: "Iniciar o levante"
 ALG_start_the_uprising_desc: "É chegada a hora. Com nossas redes ativadas, nossos combatentes armados e nossa ideologia se espalhando, nos levantaremos contra o regime e proclamaremos uma nova ordem islâmica."
 ALG_clamp_down_on_vices: "Reprimir os vícios"
 ALG_clamp_down_on_vices_desc: "Jogos de azar, álcool e decadência moral não têm lugar em nossa sociedade. Uma campanha abrangente para eliminar esses vícios purificará a nação e afirmará a autoridade religiosa."
 ALG_revolutionize_the_ulema: "Revolucionar os ulemás"
 ALG_revolutionize_the_ulema_desc: "O establishment religioso deve se alinhar à causa revolucionária. Os ulemás tradicionais serão expurgados ou reeducados, enquanto clérigos leais tomarão seu lugar como líderes espirituais do Estado."
 ALG_traditional_gender_roles: "Reforçar os papéis de gênero tradicionais"
 ALG_traditional_gender_roles_desc: "A era moderna corrompeu a ordem natural. Retornaremos aos papéis de homens e mulheres ordenados por Deus, instituindo um rígido arcabouço legal que reflita esses valores."
 ALG_pledge_allegiance_to_al_qaeda: "Jurar lealdade à Al-Qaeda"
 ALG_pledge_allegiance_to_al_qaeda_desc: "Para que a jihad global tenha sucesso, a unidade é essencial. Juraremos lealdade à Al-Qaeda, alinhando-nos à sua visão e obtendo apoio de uma rede islamista mais ampla."
 ALG_pledge_allegiance_to_daesh: "Jurar lealdade ao Estado Islâmico"
 ALG_pledge_allegiance_to_daesh_desc: "A Al-Qaeda é um movimento decrépito e em decadência que perdeu de vista seu objetivo original de travar a jihad global, atolando-se em questões de nível local. É hora de um novo movimento, com um novo senso de propósito, tomar seu lugar."
 ALG_secure_the_loyalty_of_aqim: "Garantir a lealdade da AQMI"
 ALG_secure_the_loyalty_of_aqim_desc: "A Al-Qaeda no Magrebe Islâmico deve reconhecer nossa liderança e operar em coordenação com nosso Estado. Sua lealdade garantirá controle duradouro sobre as operações jihadistas regionais."
 ALG_war_on_daesh: "Guerra ao Daesh"
 ALG_secure_the_loyalty_effect_tt: "Os efeitos dependerão de ter qualquer um dos seguintes países como fantoche: [AQY.GetNameWithFlag], [NUS.GetNameWithFlag], [TTP.GetNameWithFlag]"
 ALG_war_on_daesh_desc: "O autodenominado \"Estado Islâmico\" é uma clara ameaça à nossa liderança do movimento jihadista global. Sua rejeição à nossa autoridade e suas táticas pouco convencionais não podem mais ser toleradas. É hora de travar uma guerra total contra o Daesh, esse arrivista."
 ALG_jihad_in_the_maghreb: "Jihad no Magrebe"
 ALG_jihad_in_the_maghreb_desc: "Os regimes seculares de Marrocos, Tunísia e Argélia devem cair. Expandiremos nosso Califado pela força, iniciando uma campanha regional de guerra religiosa e expansão territorial."
 ALG_jihad_in_arabia: "Jihad na Arábia"
 ALG_jihad_in_arabia_desc: "Como lar dos locais sagrados de Meca e Medina, a península Arábica é talvez o território de maior importância religiosa no mundo. Portanto, não se pode permitir que continue a ser governada por governos corruptos e insuficientemente piedosos."
 ALG_jihad_in_the_levant: "Jihad no Iraque e em al-Sham"
 ALG_jihad_in_the_levant_desc: "O Iraque e o Levante são regiões dilaceradas por forças estrangeiras desde a era colonial. Somente pela força das armas os ocupantes cruzados e sionistas no Levante podem ser expulsos."
 ALG_jihad_in_west_africa: "Jihad na África Ocidental"
 ALG_jihad_in_west_africa_desc: "Nossa revolução não para no Magrebe. Chegou a hora de exportar a jihad para a África Ocidental, derrubando regimes no Mali, no Níger e na Mauritânia à medida que marchamos para o sul."
 AlgeriaFocus.56.t: "[FROM.GetNameDef] apoia nossa independência"
 AlgeriaFocus.56.d: "[FROM.GetNameDef] afirmou seu apoio à nossa independência em relação a Marrocos e sinalizou que deseja trabalhar ainda mais estreitamente conosco no futuro."
 AlgeriaFocus.56.a: "Ótimo"
 AlgeriaFocus.57.t: "[FROM.GetNameDef] nos abandona"
 AlgeriaFocus.57.d: "[FROM.GetNameDef] retirou seu apoio à nossa independência. Foi nosso apoiador por décadas, mas parece que agora nos abandonou para melhorar suas relações com Marrocos."
 AlgeriaFocus.57.a: "Traidores!"
 algeria_algerian_foreign_policy: "Política externa argelina"
 AlgeriaFocus.64.t: "[FROM.GetNameDef] exige autonomia cretense"
 AlgeriaFocus.64.d: "O governo [FROM.GetAdjective] declarou estar preocupado com nossa posição na ilha de Creta. Segundo eles, nosso firme domínio da ilha compromete sua segurança. Exigem que Creta receba autonomia limitada para garantir uma redução de nossa presença militar e política na área."
 AlgeriaFocus.64.a: "Acho que podemos"
 AlgeriaFocus.64.b: "Isso é ridículo"
 AlgeriaFocus.65.t: "[FROM.GetNameDef] aceita"
 AlgeriaFocus.65.d: "O governo [FROM.GetAdjective] aceitou nossas exigências de aumentar a autonomia do povo cretense."
 AlgeriaFocus.65.a: "Sucesso"
 AlgeriaFocus.66.t: "[FROM.GetNameDef] rejeita"
 AlgeriaFocus.66.d: "O governo [FROM.GetAdjective] rejeitou nossas exigências de aumentar a autonomia do povo cretense."
 AlgeriaFocus.66.a: "Eles vão se arrepender"
 AlgeriaFocus.66.b: "Esperaremos o momento certo"
 AlgeriaFocus.67.t: "Hamas inicia nova Intifada"
 AlgeriaFocus.67.d: "O Hamas convocou uma nova intifada contra nós. Estamos vendo maior movimentação de militantes do Hamas, e já houve várias manifestações contra nosso domínio sobre a Palestina. Recebemos relatos de que a Argélia pode estar por trás do armamento e da motivação do Hamas para esta nova campanha."
 AlgeriaFocus.67.a: "Eles vão se arrepender"
 AlgeriaFocus.68.t: "[FROM.GetNameDef] patrocina uma nova Intifada"
 AlgeriaFocus.68.d: "[FROM.GetNameDef] nos enviou armas e dinheiro para iniciarmos uma nova Intifada contra Israel. Já temos uma fila de novos recrutas perto de nossos escritórios, e as pessoas estão se mobilizando para protestar contra os ocupantes israelenses."
 AlgeriaFocus.68.a: "Agradecemos à Argélia"
 AlgeriaFocus.69.t: "Hamas se levanta"
 AlgeriaFocus.69.d: "Estamos recebendo relatos de combatentes do Hamas tomando instituições e edifícios-chave na Faixa de Gaza. Eles juraram que Israel sofrerá com uma nova Intifada."
 AlgeriaFocus.69.a: "Droga"
 AlgeriaFocus.69.b: "Esmaguem-nos!"
 AlgeriaFocus.70.t: "[FROM.GetNameDef] entra em contato com os Tubu"
 AlgeriaFocus.70.d: "Recebemos relatos de que a Argélia começou a armar rebeldes Tubu no norte de nosso país. Se a Argélia invadir, esses rebeldes certamente se juntarão à causa deles."
 AlgeriaFocus.70.a: "Preocupante"
 AlgeriaFocus.71.t: "[FROM.GetNameDef] sugere mineração conjunta"
 AlgeriaFocus.71.d: "O governo [FROM.GetAdjective] sugeriu um empreendimento conjunto de mineração de urânio na faixa de Aouzou. Isso fornecerá recursos a ambos os nossos países no futuro. Como devemos responder?"
 AlgeriaFocus.71.a: "Uma ótima ideia!"
 AlgeriaFocus.71.b: "Não nos importamos"
 AlgeriaFocus.72.t: "[FROM.GetNameDef] aceita nosso acordo"
 AlgeriaFocus.72.d: "O governo [FROM.GetAdjective] aceitou nosso acordo de mineração conjunta"
 AlgeriaFocus.72.a: "Ótimo"
 AlgeriaFocus.73.t: "[FROM.GetNameDef] rejeita nosso acordo"
 AlgeriaFocus.73.d: "O governo [FROM.GetAdjective] rejeitou nosso acordo de mineração conjunta"
 AlgeriaFocus.73.a: "Droga"
 AlgeriaFocus.74.t: "[FROM.GetNameDef] inicia a mineração de urânio"
 AlgeriaFocus.74.d: "[FROM.GetNameDef] começou a minerar urânio na faixa de Aouzou. Embora a maior parte dos recursos vá para eles, também recebemos uma pequena parcela, e os [FROM.GetAdjective] concordaram em cobrir todos os custos da escavação."
 AlgeriaFocus.74.a: "Certo"
 AlgeriaFocus.91.t: "Expansão do governo"
 AlgeriaFocus.91.d: "Agora que estamos no comando, temos de consolidar nossa posição para levar adiante novas reformas ampliando nossa base de apoio. Dois partidos se ofereceram para se aliar a nós, mas sob certas condições. Um partido pequeno, porém ambicioso, é liderado por descentralistas que buscam devolver poder e introduzir iniciativas de democracia direta. O outro é liderado por republicanos populistas que buscam uma base de poder burocrática centralizada, capaz de atuar como força unificadora de ordem e justiça, totalmente contrária à descentralização. Nós nos aliaremos com:"
 AlgeriaFocus.91.a: "Os descentralistas"
 AlgeriaFocus.91.b: "Os republicanos populistas"
 AlgeriaFocus.91.c: "Sim, podemos falar sobre isso depois"
 ALG_claim_jerusalem_for_arabs: "Reivindicar Jerusalém para os árabes"
 ALG_claim_jerusalem_for_arabs_desc: "Nem israelenses nem palestinos merecem a região. Eles mostraram que só vão bagunçá-la. Cabe aos verdadeiros árabes governar a região e trazer paz e estabilidade."
 ALG_claim_jerusalem_for_arabs_tt: "Poderemos transformar estados §YReivindicados§! no Levante em §YNúcleos§!"
 ALG_approach_hamas: "Aproximar-se do Hamas"
 ALG_approach_hamas_desc: "O Hamas é a única força verdadeira tentando impedir o sionismo. Precisamos construir laços melhores com eles para nos preparar para derrubar Israel."
 ALG_send_fighters_to_hamas: "Enviar combatentes ao Hamas"
 ALG_send_fighters_to_hamas_desc: "Embora os palestinos resistam bravamente aos invasores sionistas, a simples verdade é que estão em menor número. Precisamos organizar um grupo de voluntários para viajar à Palestina e se juntar às fileiras do Hamas."
 MSP_claim_jerusalem_for_arabs: "Reivindicar Jerusalém para os árabes"
 MSP_claim_jerusalem_for_arabs_desc: "Nem israelenses nem palestinos merecem a região. Eles mostraram que só vão bagunçá-la. Cabe aos verdadeiros árabes governar a região e trazer paz e estabilidade."
 MSP_approach_hamas: "Aproximar-se do Hamas"
 MSP_approach_hamas_desc: "O Hamas é a única força verdadeira tentando impedir o sionismo. Precisamos construir laços melhores com eles para nos preparar para derrubar Israel."
 MSP_send_fighters_to_hamas: "Enviar combatentes ao Hamas"
 MSP_send_fighters_to_hamas_desc: "Embora os palestinos resistam bravamente aos invasores sionistas, a simples verdade é que estão em menor número. Precisamos organizar um grupo de voluntários para viajar à Palestina e se juntar às fileiras do Hamas."
 MSP_condemn_china: "Condenar a China"
 MSP_condemn_china_desc: "O tratamento dado pela China aos seus muçulmanos nativos é abominável e deve ser condenado"
 MSP_improve_relations_with_algeria: "Melhorar as relações com o Egito"
 MSP_improve_relations_with_algeria_desc: "A Argélia tem uma história turbulenta com o Egito, principalmente devido a conflitos passados. Estamos todos do mesmo lado aqui e não deveríamos ser tão frios com os egípcios"
 MSP_work_together_with_BSEC: "Trabalhar junto com a OCEMN"
 MSP_work_together_with_BSEC_desc: "A OCEMN (Organização de Cooperação Econômica do Mar Negro) é uma organização que visa trazer prosperidade ao redor do Mar Negro. A organização é composta por países do entorno do Mar Negro e alguns países dos Bálcãs meridionais. Precisamos trabalhar junto com esses países para obter maiores benefícios"
 MSP_fixing_ideals: "Reparando ideais"
 AlgeriaInvestment.1.t: "[ALG.GetNameDef] nos convida a investir em seus projetos"
 AlgeriaInvestment.1.desc: "Emergindo de uma década de guerra civil, o governo de [ALG.GetNameWithFlag] nos convida a investir em diversos projetos em seu país. Comprometer ou não nosso capital cabe a nós. O investimento nos daria influência em Argel, mas, com grupos islamistas armados ainda ativos no interior, o risco para nossos ativos é real."
 AlgeriaInvestment.1.a: "Investir na infraestrutura deles!"
 AlgeriaInvestment.1.b: "Investir na indústria civil deles!"
 AlgeriaInvestment.1.c: "Investir no setor de serviços deles!"
 AlgeriaInvestment.1.d: "É melhor não arriscar."
 AlgeriaInvestment.2.t: "[FROM.GetNameDef] investiu em nossa Infraestrutura!"
 AlgeriaInvestment.2.d: "Após dias de negociações, [FROM.GetNameWithFlag] concordou em investir em nossa infraestrutura em troca de algumas concessões mínimas. O investimento beneficiará nossa população rural."
 AlgeriaInvestment.2.a: "Somos gratos pela ajuda deles!"
 AlgeriaInvestment.3.t: "[FROM.GetNameDef] investiu em nossa Indústria Civil!"
 AlgeriaInvestment.3.d: "Após dias de negociações, [FROM.GetNameWithFlag] concordou em nos ajudar a construir algumas fábricas civis em troca de algumas concessões menores. O investimento beneficiará o setor industrial de nosso país e facilitará a modernização da nação."
 AlgeriaInvestment.3.a: "Somos gratos pela ajuda deles!"
 AlgeriaInvestment.4.t: "[FROM.GetNameDef] investiu em nosso Setor de Serviços!"
 AlgeriaInvestment.4.d: "Após dias de negociações, [FROM.GetNameWithFlag] concordou em investir em nosso setor de serviços construindo alguns escritórios em troca de algumas concessões menores. O investimento beneficiará o setor financeiro de nosso país e facilitará a modernização da nação."
 AlgeriaInvestment.4.a: "Somos gratos pela ajuda deles!"
 AlgeriaInvestment.5.t: "[FROM.GetNameDef] recusou-se a investir!"
 AlgeriaInvestment.5.d: "Após dias de negociações, [FROM.GetNameWithFlag] rejeitou nosso convite de investimento, alegando que o ambiente de negócios em nosso país ainda não é seguro o bastante e que avaliará com cautela futuros acordos de investimento conosco."
 AlgeriaInvestment.5.a: "Parece que precisamos trabalhar mais!"
 AlgeriaInvestment.6.t: "Argélia busca investimento do Oriente Médio após ingresso na OMC"
 AlgeriaInvestment.6.d: "Com sua recente adesão à Organização Mundial do Comércio (OMC), a Argélia busca maior injeção de capital para impulsionar o desenvolvimento econômico. Autoridades estão procurando nações do Oriente Médio, pedindo maior cooperação e investimento em setores-chave. A medida sinaliza o compromisso da Argélia em aproveitar parcerias internacionais para promover o crescimento e a estabilidade na região."
 AlgeriaInvestment.7.t: "Eles assinam um acordo comercial"
 AlgeriaInvestment.7.d: "Eles gostariam de propor um acordo comercial para estimular maior cooperação e deixar a porta aberta para investimentos futuros"
 AlgeriaInvestment.7.a: "Claro"
 AlgeriaInvestment.6.a: "Assinar um acordo comercial"
 AlgeriaInvestment.6.b: "Investir em uma fábrica"
 AlgeriaInvestment.6.c: "Não, obrigado"
 Algeria.11.t: "[ALG.GetNameDef] solicita nossa proteção"
 Algeria.11.d: "Após décadas de agitação, o governo argelino teme a reignição da guerra ou uma interferência e invasão externas; o presidente [ALG.GetLeader] de [ALG.GetNameWithFlag] visitou Zhongnanhai e procurou o Secretário-Geral [CHI.GetLeader] em busca de um tratado de defesa. Se concordarmos em protegê-los, poderemos garantir que permaneçam em nossa esfera de influência, mas também teremos a obrigação de defender [ALG.GetNameWithFlag] contra ameaças externas, além de prestar assistência na manutenção da estabilidade do país, especialmente combatendo a insurgência extremista islâmica £GFX_ALG_salafist_jihadism. Levando em conta a situação de nosso país, devemos assinar um tratado de defesa com [ALG.GetLeader]?"
 Algeria.11.a: "Mais um Irmão de Ferro!"
 Algeria.11.b: "Não temos nada de sobra para um tratado!"
 Algeria.12.t: "[CHI.GetNameDef] concordou em nos proteger"
 Algeria.12.d: "Graças aos nossos esforços diplomáticos, o Secretário-Geral [CHI.GetLeader] de [CHI.GetNameWithFlag] assinou formalmente um tratado de defesa com nosso presidente [ALG.GetLeader]; com a assinatura desse tratado, [FROM.GetNameWithFlag] não apenas nos protegerá de agressões externas, como também prestará assistência na manutenção de nossa estabilidade interna."
 Algeria.12.a: "Excelente!"
 Algeria.13.t: "[CHI.GetNameDef] recusou-se a assinar!"
 Algeria.13.d: "Apesar de nosso presidente [ALG.GetLeader] ter visitado [CHI.GetNameWithFlag] em busca de assistência de segurança, [CHI.GetLeader] mostrou-se aparentemente reticente quanto a qualquer tipo de tratado. [CHI.GetLeader] disse ao nosso presidente que \"Sempre nos comprometeremos com a segurança e a estabilidade regionais.\" Mas é muito óbvio que o compromisso de [CHI.GetLeader] permanece apenas nas palavras; teremos de nos defender sozinhos."
 Algeria.13.a: "Que decepção"
 ALG_join_nato_partnership: "Aderir à Parceria da OTAN"
 ALG_eu_trade_agreements: "Acordos comerciais com a UE"
 ALG_expand_russian_gas_investments: "Expandir o investimento em gás russo"
 ALG_expand_russian_gas_investments_desc: "Expandir os acordos com a Rússia para obter mais gás e construir nossa nação."
 ALG_join_belt_and_road: "Aderir à Nova Rota da Seda"
 ALG_join_belt_and_road_desc: "Juntar-se ao sistema ferroviário chinês e construir a primeira estação de metrô da África."
 ALG_tech_exchange_with_china: "Intercâmbio de tecnologia com a China"
 ALG_tech_exchange_with_china_desc: "Obter a tecnologia chinesa para desenvolver nossa nação."
