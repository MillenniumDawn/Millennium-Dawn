 STALKER.30.t: "The Battle for the Zone"
 STALKER.30.d: "A new emission storm has torn open paths into the heart of [STALKER_zone_name], and every faction is racing for the center: the Ward, the Spark, the resurgent Monolith and a lone stalker the others call Skif. Our perimeter is failing while they fight."
 STALKER.30.a: "Send in the army."
 STALKER.30.a_tt: "Costs §R50§! political power, or §R25§! when Military influence is at least §Y40§!. Zone §Ycontainment§! rises by §G20§! and the §Ystalker§! population falls by up to §Y10§!. The military seals the eighth pod, restores activity and the stalker population, and prevents global spread."
 STALKER.30.b: "Back the Ward."
 STALKER.30.b_tt: "Zone §Ycontainment§! and §Yexploitation§! each rise by §G10§!, and §YFreedom§! influence falls by up to §Y10§!. If the Ward's approach prevails, Skif's eighth-pod choice leads to global Zones that start more contained and less active. The §YWard§! gains §G15§! influence."
 STALKER.30.c: "Let the stalkers settle it."
 STALKER.30.c_tt: "The §Ystalker§! population rises by §Y10§! and §YBandit§! influence rises by §R10§!. If the perimeter collapses and Skif enters the eighth pod, global Zones start more active and less contained. The §YSpark§! gains §Y10§! influence."
 STALKER.30.a_tt_contained: "Costs §R50§! political power, or §R25§! when Military influence is at least §Y40§!. Zone §Ycontainment§! rises by §G20§!, and the §Ystalker§! population falls by up to §Y10§!. Military sealing closes the eighth pod, keeping the Zone in Ukraine."
 STALKER.30.e: "Back Strelok."
 STALKER.30.e_tt: "Available because Strelok shut the C-Consciousness down in 2012 and lived. He stops Skif from entering the eighth pod. The original Zone's activity collapses, and no new Zones appear abroad."
 STALKER.30.b_tt_contained: "Zone §Ycontainment§! and §Yexploitation§! each rise by §G10§!, and §YFreedom§! influence falls by up to §Y10§!. If the Ward's approach prevails with Global Zones disabled, Skif's choice leaves the crisis in Ukraine. The §YWard§! gains §G15§! influence."
 STALKER.30.c_tt_contained: "The §Ystalker§! population rises by §Y10§! and §YBandit§! influence rises by §R10§!. If the perimeter collapses and Skif enters the eighth pod with Global Zones disabled, no new Zones appear abroad. The §YSpark§! gains §Y10§! influence."
 STALKER.31.t: "Skif Enters the Eighth Pod"
 STALKER.31.d: "At the heart of the Zone, the stalker known as Skif has defied Strelok, spared Dr. Kaymanov, the man called the Doctor, and entered the eighth pod of the C-Consciousness. He has given the Zone its will. Scientists across the world report the same readings within the hour: the Zone is no longer tied to Chornobyl."
 STALKER.31.a: "What happens now?"
 STALKER.32.t: "Anomalies Reported Worldwide"
 STALKER.32.d: "Governments on every continent are reporting anomalous activity: dead birds in circles, compasses spinning, whole villages losing radio contact. The UN Security Council has called an emergency session, and no delegation yet knows what to ask for."
 STALKER.32.d_ward: "Governments on every continent are reporting anomalous activity. The Ward is advising new Zone administrations on containment and access as national scientists coordinate their response."
 STALKER.32.d_stalkers: "Governments on every continent are reporting anomalous activity. With no shared containment plan, stalker networks and local authorities are improvising while smugglers race to the new sites."
 STALKER.32.a: "The Zone is everywhere now."
 STALKER.33.t: "After the Eighth Pod"
 STALKER.33.d: "Whatever Skif did in the heart of the Zone, [STALKER_zone_name] is more violent than it has ever been. Our generals want a new perimeter; our scientists say the world will need what they learn inside."
 STALKER.33.a: "Rebuild the perimeter."
 STALKER.33.a_tt: "Costs §R50§! political power. Zone §Ycontainment§! rises by §G20§!."
 STALKER.33.b: "Open the Zone to the world's scientists."
 STALKER.33.b_tt: "Zone §Yexploitation§! rises by §G15§!, increasing our Zone research."
 STALKER.31.d_contained: "At the heart of the Zone, the stalker known as Skif has defied Strelok, spared Dr. Kaymanov, the man called the Doctor, and entered the eighth pod of the C-Consciousness. The Zone has lashed out across the north of Ukraine, but instruments abroad register nothing unusual."
 STALKER.33.d_known: "Our Project X files described a link between the eighth pod and the noosphere. Skif spared Dr. Kaymanov and entered the pod, and the instruments around [STALKER_zone_name] now show the pattern our investigators feared. The surviving files may help us limit the damage here."
 STALKER.33.c: "Apply the Project X containment files."
 STALKER.33.c_tt: "Zone containment rises by up to §G15§!, exploitation rises by up to §G10§!, and activity falls by up to §G10§!. Available because we completed the X-Lab investigation."
 STALKER.36.t: "The Eighth Pod Is Sealed"
 STALKER.36.d: "The army has closed the route to the eighth pod, and containment around the Zone is stabilizing. Ukrainian instruments still register anomalous activity, but monitoring stations abroad report no new Zones."
 STALKER.36.a: "The perimeter holds."
 STALKER.39.t: "Strelok Ends the Zone"
 STALKER.39.d: "Strelok reached the eighth pod ahead of Skif and destroyed it. The original Zone is still there, but its activity has collapsed, and monitoring stations abroad report no new Zones."
 STALKER.39.a: "He did what the army could not."

 # ---- MD_STALKER_aftermath_l_english.yml (consolidated) ----
 STALKER.38.t: "The Zone's First Anniversary"
 STALKER.38.d_military: "One year after sealing the Zone, the cordon still holds around [STALKER_zone_name]. We can keep the anomalous territory under military control or permit licensed research inside its perimeter."
 STALKER.38.d_ward: "The Ward's 2022 intervention carried the Zone's influence beyond Ukraine, and its research consortium now wants a lasting mandate. We must choose between binding that work to common containment rules or widening access to the Zone."
 STALKER.38.d_ward_contained: "The Chornobyl Zone remains the only known anomaly site, and SIRCAA, whose private army is the Ward, wants a lasting research mandate. We must choose between binding that work to containment rules or widening access to the Zone."
 STALKER.38.d_stalkers: "Governments have struggled to contain the new Zones since the 2022 battle, while stalkers and local factions learned how to survive them. We can negotiate with those groups or restore emergency authority before the next emission."
 STALKER.38.d_stalkers_contained: "The Chornobyl Zone remains the only known anomaly site, but its weakened perimeter has opened routes for local stalkers. We can negotiate with those groups or restore emergency authority before the next emission."
 STALKER.38.d_default: "The Battle for the Zone is a year behind us, but the original Zone remains unstable. We must settle how much authority the state will retain and how far research can proceed."
 STALKER.38.a: "Maintain the military cordon."
 STALKER.38.a_tt: "Containment rises by up to §G10§! and Duty influence rises by up to §G5§!. Activity and Bandit influence each fall by up to §G10§!."
 STALKER.38.b: "License supervised research."
 STALKER.38.b_tt: "Exploitation rises by up to §G10§!, the stalker population rises by up to §G5§!, Freedom influence rises by up to §G5§!, and Duty influence falls by up to §G5§!."
 STALKER.38.c: "Adopt the Ward's containment protocols."
 STALKER.38.c_tt: "Duty influence and containment each rise by up to §G10§!. Bandit influence falls by up to §G10§! and exploitation falls by up to §G5§!."
 STALKER.38.d: "Expand the international research mandate."
 STALKER.38.d_tt: "Exploitation rises by up to §G10§!, the stalker population rises by up to §G5§!, Freedom influence rises by up to §G5§!, activity rises by up to §R5§!, and containment falls by up to §R5§!."
 STALKER.38.e: "Negotiate directly with stalker groups."
 STALKER.38.e_tt: "Freedom influence, the stalker population, and exploitation each rise by up to §G10§!, while containment falls by up to §R10§!."
 STALKER.38.f: "Restore emergency authority."
 STALKER.38.f_tt: "Duty influence rises by up to §G10§! and containment by up to §G15§!. Activity and the stalker population each fall by up to §G10§! and §G5§!, respectively."
 STALKER.38.g: "Preserve the current balance."
 STALKER.38.g_tt: "Containment rises by up to §G5§! and activity falls by up to §G5§!."
 STALKER.38.d_strelok: "A year after Strelok destroyed the eighth pod, [STALKER_zone_name] is a scar rather than a storm. What remains still has to be held."
 STALKER.38.h: "Hold what remains."
 STALKER.38.h_tt: "Containment rises by up to §G10§! and activity falls by up to §G5§!."
