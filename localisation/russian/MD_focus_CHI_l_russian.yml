 CHI_infantry_general: "Infantry General"
 CHI_infantry_general_desc: "Генерал Шин Фай поднялся по служебной лестнице в Сухопутных войсках Народно-освободительной армии как специалист по проведению крупномасштабных пехотных операций. Он командует массовыми формированиями Красной гвардии и штурмовой пехоты, делая упор на быстрое развёртывание и численное превосходство."
 CHI_jiang_legacy_secured: "Legacy Secured"
 CHI_jiang_military_modernizer: "Military Modernizer"
 CHI_jiang_reformer: "Reform-Era Architect"
 CHI_jiang_security_tsar: "Security Tsar"
 CHI_nuke_general: "Nuke General"
 CHI_nuke_general_desc: "Генерал Цин Ши Тао является ведущим экспертом Народно-освободительной армии Китая (НОАК) в области ядерной и радиологической войны. Он выступает за интеграцию тактического ядерного потенциала непосредственно в операции с применением обычных вооружений — эта доктрина вызывает как уважение, так и споры в Генеральном штабе."
 CHI_special_weapons_general: "Special Weapons Commander"
 CHI_special_weapons_general_desc: "Генерал Леанг — одна из самых универсальных высокопоставленных командиров НОАК, сочетающая в себе знания в области современных систем вооружения с доктриной применения обычной артиллерии. Считающаяся «вундеркиндом» в Генеральном штабе, она известна своим умением интегрировать передовые технологии в операции с применением всех родов войск."
 CHI_tank_general: "Tank General"
 CHI_tank_general_desc: "Генерал Квай входит в число ведущих командиров бронетанковых войск НОАК; он известен своим активным использованием формирований тяжелых танков и убеждением, что подавляющая огневая мощь решает исход сражений еще до того, как противник успевает отреагировать."
 CHI_two_centenary_supreme_commander: "Supreme Commander of the New Era"
 CHI_wolf_warrior_spirit: "Wolf Warrior Spirit"
 CHI_wolf_warrior_spirit_desc: "Наши дипломаты решительно отстаивают национальные интересы и оспаривают западные нарративы на мировой арене."
