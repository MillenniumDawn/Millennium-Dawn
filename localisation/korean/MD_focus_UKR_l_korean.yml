 UKR_demand_bosnia_desc: "우리 형제들은 슬라브 민족이라는 이유로 그들을 억압해 온 정부로부터 마침내 해방될 것입니다!"
 UKR_czech_unification: "[CZE.GetName]에서의 국가 볼셰비즘 혁명"
 UKR_czech_unification_desc: "우리 형제들은 슬라브 민족이라는 이유로 그들을 억압해 온 정부로부터 마침내 해방될 것입니다!"
 UKR_demand_croatia_slovenia: "[CRO.GetName]에서의 국가 볼셰비즘 혁명"
 UKR_demand_croatia_slovenia_desc: "우리 형제들은 슬라브 민족이라는 이유로 그들을 억압해 온 정부로부터 마침내 해방될 것입니다!"
 UKR_slovakia_unify: "[SLO.GetName]에서의 국가 볼셰비즘 혁명"
 UKR_slovakia_unify_desc: "우리 형제들은 슬라브 민족이라는 이유로 그들을 억압해 온 정부로부터 마침내 해방될 것입니다!"
 UKR_propose_full_union_state: "진정한 연방 국가"
 UKR_propose_full_union_state_desc: "이제 러시아와 우리나라가 진정한 연방 국가가 될 때입니다!"
 UKR_pan_slavic_ssr: "슬라브 공화국 연방"
 UKR_pan_slavic_ssr_desc: "마침내 모든 슬라브인이 하나가 될 것입니다!"
 UKR_vetrenko_surrort_nationalism: "러시아-우크라이나 민족주의"
 UKR_vetrenko_inner_idea: "국내 정책"
 UKR_vetrenko_inner_idea_desc: "우리는 서방으로부터의 독립과 강한 우크라이나를 위한 정책을 추진할 준비가 되어 있으며, 서방 자본의 독재에는 신물이 났습니다."
 UKR_vetrenko_christian_socialism: "기독교 사회주의"
 UKR_vetrenko_christian_socialism_desc: "우크라이나에서는 하느님과 사회주의가 함께 나아갑니다."
 UKR_vetrenko_west_idea: "반서방 교리"
 UKR_vetrenko_west_idea_desc: "우리는 서방이 이념적으로나 직접적으로나 우리의 적이라는 사실을 숨기지 않습니다."
 UKR_vetrenko_pioneria: "민족 개척단"
 UKR_vetrenko_women_idea: "민족 페미니즘"
 UKR_vetrenko_women_idea_desc: "우크라이나의 여성들은 남성들과 손을 맞잡고 위대한 국가를 건설할 것입니다."
 UKR_vetrenko_iron_woman: "우크라이나의 철의 여인"
 UKR_vetrenko_iron_woman_desc: "비트렌코는 우리의 마거릿 대처가 되었습니다."
 UKR_vetrenko_health_free_idea: "무상 의료"
 ukraine_nazbol.1.t: "[FROM.GetName] 침공을 개시하시겠습니까?"
 ukraine_nazbol.1.d: "우리는 이 나라에서 봉기를 일으키는 데 성공했으나, 이제 이를 끝까지 밀어붙이고 이 혁명이 우리의 소행임을 인정할 준비가 되었는지 결정해야 합니다."
 ukraine_nazbol.1.a: "찬성"
 ukraine_nazbol.1.b: "안된다"
 ukraine_nazbol.2.t: ""
 ukraine_nazbol.2.d: ""
 ukraine_nazbol.2.a: ""
 ukraine_nazbol.3.t: "국가 볼셰비즘 혁명!"
 ukraine_nazbol.3.d: "예상치 못하게 발생한 민족볼셰비키의 기치 아래 일어난 혁명입니다! 분리주의자들과 맞서 싸우기 위해 군대와 모든 무장 병력을 긴급 소집했습니다. 이 배후에 [UKR.GetName]이(가) 있음을 파악하고 있으며, 추후 반드시 이를 처리할 것입니다."
 ukraine_nazbol.3.a: "갑자기"
 ukraine_nazbol.4.t: "러시아 제국의 유산을 찬양하는 [FROM.GetName]"
 ukraine_nazbol.4.d: "우크라이나 정부가 국가 차원에서 직접 러시아 제국의 과거와 유산을 찬미한다고 선언했으며, 우리는 이 행보에 어떤 식으로든 응답해야 합니다."
 ukraine_nazbol.4.a: "우리도 자랑스럽다"
 ukraine_nazbol.4.b: "우리는 이를 규탄한다"
 ukraine_nazbol.5.t: "우리와 연대하는 [FROM.GetName]"
 ukraine_nazbol.5.d: "[FROM.GetName]은(는) 러시아 제국의 유산 문제에서 우리와 연대하며, 이 문제에 대해 외교적 차원에서 우리를 지지할 준비가 되어 있습니다."
 ukraine_nazbol.5.a: "훌륭하군!"
 ukraine_nazbol.6.t: "우리를 규탄하는 [FROM.GetName]"
 ukraine_nazbol.6.d: "[FROM.GetName]은(는) 우리가 제국의 야망을, 비민주적 국가를 결코 규탄하지 않는다는 점을 비난합니다. 새로운 러시아는 언제나 확장이 아닌 평화로운 협력의 이상을 표방할 것입니다."
 ukraine_nazbol.6.a: "겁쟁이들"
