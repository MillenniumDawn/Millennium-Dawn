 CHI_water_shortage_2: "$CHI_water_shortage$"
 CHI_water_shortage_2_desc: "Северо-Китайская равнина, бассейн Хуанхэ и коридор Пекин — Тяньцзинь — Хэбэй вместе располагают примерно половиной пахотных земель страны, но менее чем пятой частью её пресной воды. Обеспеченность водой на душу населения на севере значительно ниже международного порога дефицита в 1 000 кубометров в год. Промышленные сбросы и сельскохозяйственные стоки загрязнили значительную часть доступных поверхностных и подземных вод, усугубляя физическую нехватку. На сельское хозяйство приходится более 60% всего водопотребления, а потребности энергетики в охлаждении ещё сильнее нагружают и без того истощённую ресурсную базу.\n§W--------------§!\nВыполнение проектов из категории решений §Y$CHI_water_shortage_category$§!, открываемой фокусом §Y$CHI_water_security_initiative$§!, а также маршрутов переброски воды с юга на север из категории §Y$CHI_megaprojects$§! повышает прогресс водосбережения. Этот национальный дух §Gулучшится§! при §Y9§! завершённых проектах."
 CHI_water_shortage_3: "$CHI_water_shortage$"
 CHI_water_shortage_3_desc: "Северо-Китайская равнина, бассейн Хуанхэ и коридор Пекин — Тяньцзинь — Хэбэй вместе располагают примерно половиной пахотных земель страны, но менее чем пятой частью её пресной воды. Обеспеченность водой на душу населения на севере значительно ниже международного порога дефицита в 1 000 кубометров в год. Промышленные сбросы и сельскохозяйственные стоки загрязнили значительную часть доступных поверхностных и подземных вод, усугубляя физическую нехватку. На сельское хозяйство приходится более 60% всего водопотребления, а потребности энергетики в охлаждении ещё сильнее нагружают и без того истощённую ресурсную базу.\n§W--------------§!\nВыполнение проектов из категории решений §Y$CHI_water_shortage_category$§!, открываемой фокусом §Y$CHI_water_security_initiative$§!, а также маршрутов переброски воды с юга на север из категории §Y$CHI_megaprojects$§! повышает прогресс водосбережения. Этот национальный дух §Gулучшится§! при §Y13§! завершённых проектах."
 CHI_water_shortage_4: "$CHI_water_shortage$"
 CHI_water_shortage_4_desc: "Северо-Китайская равнина, бассейн Хуанхэ и коридор Пекин — Тяньцзинь — Хэбэй вместе располагают примерно половиной пахотных земель страны, но менее чем пятой частью её пресной воды. Обеспеченность водой на душу населения на севере значительно ниже международного порога дефицита в 1 000 кубометров в год. Промышленные сбросы и сельскохозяйственные стоки загрязнили значительную часть доступных поверхностных и подземных вод, усугубляя физическую нехватку. На сельское хозяйство приходится более 60% всего водопотребления, а потребности энергетики в охлаждении ещё сильнее нагружают и без того истощённую ресурсную базу.\n§W--------------§!\nВыполнение проектов из категории решений §Y$CHI_water_shortage_category$§!, открываемой фокусом §Y$CHI_water_security_initiative$§!, а также маршрутов переброски воды с юга на север из категории §Y$CHI_megaprojects$§! повышает прогресс водосбережения. Этот национальный дух будет §Rснят§! при §Y17§! завершённых проектах."
 CHI_local_debt_category: "Долг местных органов власти"
 CHI_local_debt_category_desc: "Провинциальные финансовые платформы занимают под будущие продажи земли, чтобы финансировать заводы, офисные парки и инфраструктуру, за которые поощряют при оценке кадров. Счёт никогда не попадает в книги Пекина — пока однажды не попадёт.\n\n§YДолговое давление§!: [?CHI_local_debt_pressure|0] / 100\n§YБюджетная устойчивость§!: поддерживается §Y$industrial_complex$§! и §Y$offices$§!: [?CHI_local_debt_tolerance|0]\n§YСейчас§!: [?industrial_complex_total|0] §Y$industrial_complex$§! и [?office_park_total|0] §Y$offices$§!. Всего: [?CHI_local_debt_buildings|0]\n\n§YКак это работает§!\nКаждый месяц бюджетная устойчивость растёт на §G+0.25§!. Если общее число зданий превышает её, долговое давление растёт на §R+1§! за каждое здание сверх лимита. Если нет — давление снижается на §G-0.5§!.\n\n§GПороги§!\nДавление определяет уровень §Y$CHI_local_government_debt$§!.\n§G20§!: штрафы к процентам и потребительским товарам.\n§G45§!: добавляются штрафы к окупаемости инвестиций и стабильности.\n§G70§!: добавляются штрафы к скорости строительства и производительности заводов.\n§G90§!: все штрафы максимальны, страдает политическая власть.\nЕсли давление опускается ниже порога, уровень снова смягчается.\n\n§GКак снизить§!\nПромышленные фокусы повышают долговое давление. Фокусы бюджетной реформы, такие как §Y$CHI_property_tax_pilot_program$§! и §Y$CHI_cadre_evaluation_reform$§!, повышают бюджетную устойчивость или напрямую снижают давление. Решение §Y$CHI_provincial_debt_swap$§! ниже раз в год снижает давление на §G15§! ценой §R2%§! ВВП.\n\n§GКак завершить§!\nКогда долговое давление опускается ниже §Y1§!, начинается миссия §Y$CHI_local_debt_resolution_mission$§!. Удерживайте его на этом уровне §Y5 лет§!, и система местного долга будет упразднена навсегда. Если давление снова поднимется до 1 или выше, миссия отменяется и начнётся заново, когда давление опять упадёт."
 CHI_provincial_debt_swap: "Обмен провинциальных долгов"
 CHI_provincial_debt_swap_desc: "Центральное правительство разрешает провинциям рефинансировать кредиты финансовых платформ в более длинные облигации, перекладывая часть бремени на национальный бюджет. Обмен снимает непосредственное долговое давление, но никак не меняет модель роста, которая его породила."
 CHI_local_debt_resolution_mission: "Жёсткие бюджетные ограничения"
 CHI_local_debt_resolution_mission_desc: "Когда долговое давление на местные бюджеты равно нулю, Пекин может не управлять моделью финансовых платформ, а демонтировать её. Провинции занимают только в пределах официальной квоты облигаций, земельные доходы больше не закладываются под банковские кредиты, а оценка кадров перестаёт поощрять строительство ради строительства. Если долговое давление остаётся ниже 1 в течение пяти лет, система местного долга упраздняется навсегда. Если оно снова вырастет, миссия отменяется и начнётся заново, когда давление опустится ниже 1."
 CHI_local_debt_resolved_tt: "Система §Yдолга местных органов власти§! §Gупразднена навсегда§!. Долговое давление и бюджетная устойчивость больше не меняются, а категория решений удаляется."
 CHI_semiconductor_backwardness_2: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_2_desc: "Китайская полупроводниковая отрасль по-прежнему структурно зависит от зарубежных контрактных фабрик, ПО для проектирования и производственного оборудования. Отечественные фабрики отстают от передового уровня на два-три поколения, у дизайн-центров нет зрелых инструментов EDA, и ни одна отечественная компания не способна поставлять оборудование для передовой литографии. Этот разрыв сдерживает строительство отечественных заводов микросхем и выпуск контрактных фабрик, а также ограничивает как гражданскую электронику, так и цепочку поставок военной электроники.\n§W--------------§!\nЭтот национальный дух §Gулучшится§!, если мы выполним фокус §Y$CHI_domestic_eda$§!."
 CHI_semiconductor_backwardness_3: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_3_desc: "Китайская полупроводниковая отрасль по-прежнему структурно зависит от зарубежных контрактных фабрик, ПО для проектирования и производственного оборудования. Отечественные фабрики отстают от передового уровня на два-три поколения, у дизайн-центров нет зрелых инструментов EDA, и ни одна отечественная компания не способна поставлять оборудование для передовой литографии. Этот разрыв сдерживает строительство отечественных заводов микросхем и выпуск контрактных фабрик, а также ограничивает как гражданскую электронику, так и цепочку поставок военной электроники.\n§W--------------§!\nЭтот национальный дух §Gулучшится§!, если мы выполним фокус §Y$CHI_big_fund_phase2$§!."
 CHI_semiconductor_backwardness_4: "$CHI_semiconductor_backwardness_1$"
 CHI_semiconductor_backwardness_4_desc: "Китайская полупроводниковая отрасль по-прежнему структурно зависит от зарубежных контрактных фабрик, ПО для проектирования и производственного оборудования. Отечественные фабрики отстают от передового уровня на два-три поколения, у дизайн-центров нет зрелых инструментов EDA, и ни одна отечественная компания не способна поставлять оборудование для передовой литографии. Этот разрыв сдерживает строительство отечественных заводов микросхем и выпуск контрактных фабрик, а также ограничивает как гражданскую электронику, так и цепочку поставок военной электроники.\n§W--------------§!\nЭтот национальный дух будет §Rснят§!, если мы выполним фокус §Y$CHI_mature_node_counter_offensive$§! или §Y$CHI_sicarrier_euv$§!."
 CHI_AST_pacific_deterrence: "Усиленное сдерживание в Тихом океане"
 CHI_AST_pacific_deterrence_desc: "Давление Китая, размещающего базы в южной части Тихого океана, вынудило срочно расширить зону действия Королевского ВМФ Австралии. Новые сенсоры, более точная разведка и подготовленные десантные силы находятся в готовности."