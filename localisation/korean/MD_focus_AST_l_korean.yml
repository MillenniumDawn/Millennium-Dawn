 sol_intervention_success: "개입은 성공을 거두었습니다."
 the_financial_crisis_ast: "금융 위기"
 the_financial_crisis_ast_desc: "서브프라임 모기지에 대한 약탈적 대출과 규제 부족에 힘입어, 미국 역사상 최대의 주택 거품이 터졌고 나머지 세계는 각자의 몫의 손실을 떠안게 되었습니다."
