 SAU_islamic_rivalry: "이슬람 세계의 경쟁"
 SAU_islamic_rivalry_tt: "[PER.GetFlag]§R이슬람 세계를 둘러싼 경쟁이 시작됩니다.§!"
 SAU_israel_normalization: "관계 정상화"
 SAU_proxy_aggression: "테러 후원국"
 SAU_quincy_reaffirmed: "퀸시 협정 재확인"
 SAU_recognition_anger: "팔레스타인 국가 승인"
 SAU_recognized_palestine: "팔레스타인 승인"
 SAU_taif_spirit: "타이프 정신"
 SAU_talks_collapsed: "정상화 협상 결렬"
 SAU_two_state_champion: "두 국가 해법의 수호자"
 HOU_break_ceasefire_category: "사우디 휴전"
 HOU_drop_north_yemen_name: "예멘의 이름 되찾기"
 HOU_drop_north_yemen_name_desc: "북예멘이라는 정체성을 버리고 다시 우리 자신의 깃발 아래 통치합니다."
 PER_houthi_militia: "민병대 동원"
 PER_houthi_militia_desc: "부족 지지자들을 동원하여 후티 운동에 낮은 비용으로 추가 인력을 제공합니다."
 PER_houthi_old_weapons: "후티에 무기 밀반입"
 PER_houthi_old_weapons_desc: "낡은 소총 화물을 홍해를 거쳐 국경 너머의 후티 전투원들에게 운송합니다."
 PER_houthi_raise_brigade: "방어 강화"
 PER_houthi_raise_brigade_desc: "쿠드스군 공병을 보내 후티 세력이 산악 지대에 진지를 파게 합니다. 그들이 장악한 지역에서 몰아내기가 훨씬 어려워집니다."
 PER_houthi_support_category: "후티 지원"
 SAU_abdullah_kaec_construction: "KAEC 건설 속성 추진"
 SAU_abdullah_kaec_construction_desc: "허가를 면제하고 홍해 연안에 추가 계약업체를 고용하여 압둘라 국왕 경제 도시의 건설을 가속합니다."
 SAU_abdullah_kasp_scholarship: "KASP 해외 장학금 확대"
 SAU_abdullah_kasp_scholarship_desc: "국가 지원 해외 장학금을 확대하여 왕국에 숙련된 전문가가 부족한 분야를 더 많은 사우디 학생이 공부할 수 있게 합니다. 이들의 교육은 귀국 후 국내 노동력을 강화할 것입니다."
 SAU_abdullah_kaust_grants: "KAUST 첨단 기술 연구비 지원"
 SAU_abdullah_kaust_grants_desc: "KAUST에 대규모 연구비를 지원하여 일류 전문가를 영입하고 투왈에 첨단 연구소를 설립합니다."
 SAU_abdullah_national_dialogue: "국민 대화 포럼 개최"
 SAU_abdullah_national_dialogue_desc: "성직자, 개혁가, 시아파 대표, 여성을 국민 대화 포럼에 한자리에 모읍니다. 이 회의는 소외된 집단에게 우려를 제기할 공식 창구를 제공할 것입니다."
 SAU_abdullah_sang_subsidies: "SANG 현대화 보조금"
 SAU_abdullah_sang_subsidies_desc: "사우디 국가방위군의 신규 차량 계약에 보조금을 지원하여 현대화 비용을 줄이고 정부에 대한 충성심을 강화합니다."
 SAU_Among_Major_powers_Open_east: "§R동방과의 협력§! 결정 열기"
 SAU_appoint_provincial_governor: "지방 총독 임명"
 SAU_appoint_provincial_governor_desc: "총독직이 공석입니다. 지도에서 지방을 선택하면 위원회가 누가 맡을지 결정합니다.\n\n각 지방은 한 번만 배정할 수 있습니다."
 SAU_arm_arab_revolutionaries: "아랍 혁명가 무장"
 SAU_arm_arab_revolutionaries_desc: "다른 아랍 국가에서 활동하는 공산주의 운동에 소총과 훈련된 조직가를 공급합니다."
 SAU_arm_lebanese_army: "레바논군 무장"
 SAU_arm_lebanese_army_desc: "레바논군이 헤즈볼라와 별개로 활동할 수 있도록 사우디의 무기와 훈련을 제공합니다."
 SAU_back_mbn: "무함마드 빈 나이프 지지"
 SAU_back_mbn_desc: "왕국 대테러 국가의 설계자이자 워싱턴이 선호하는 내무장관에게 힘을 실어 줍니다. 후보를 선택하면 왕위 계승이 끝날 때까지 왕실이 그의 대의에 묶이게 됩니다."
 SAU_back_mbn_heir: "무함마드 빈 나이프 지지"
 SAU_back_mbn_heir_desc: "내무부 근무 경력, 대테러 실적, 워싱턴과의 강력한 관계를 근거로 무함마드 빈 나이프 왕세자를 지지합니다."
 SAU_back_mbs_heir: "무함마드 빈 살만 지지"
 SAU_back_mbs_heir_desc: "경험이 부족함에도 점점 더 많은 부처에 대한 권한을 공고히 하고 있는 국왕의 젊은 아들, 무함마드 빈 살만을 지지합니다."
 SAU_back_mutaib: "무타입 빈 압둘라 지지"
 SAU_back_mutaib_desc: "압둘라 국왕의 아들이자 국가방위군 사령관이며 부친의 부족 추종 세력을 물려받은 인물에게 힘을 실어 줍니다. 후보를 선택하면 왕위 계승이 끝날 때까지 왕실이 그의 대의에 묶이게 됩니다."
 SAU_back_salman: "살만 빈 압둘아지즈 지지"
 SAU_back_salman_desc: "수다이리 가문의 원로 왕자이자 오랜 리야드 총독에게 힘을 실어 줍니다. 후보를 선택하면 왕위 계승이 끝날 때까지 왕실이 그의 대의에 묶이게 됩니다."
 SAU_bahrain_restore_khalifa: "할리파 가문 복원"
 SAU_bahrain_restore_khalifa_desc: "바레인에서 할리파 가문이 권력을 잃을 경우, 제방 도로를 건너 병력을 투입하여 할리파 가문을 복원합니다.\n\n§Y활성화 조건:§! 바레인이 더 이상 할리파 가문에 의해 통치되지 않을 것.\n\n§G할리파 가문을 권좌에 복귀시키고§!, 바레인을 우리 세력이 아닌 모든 세력에서 탈퇴시키며 §Y반도 방패군§!에 편입시킵니다.\n\n§R-$15 billion, -2% 안정도§!, 테헤란과의 관계가 악화됩니다. §G+5% 전쟁 지지도§!."
 SAU_bop_note: "§H왕국의 미래가 변화하는 방식§!"
 SAU_bop_note_desc: "§H왕국의 미래§! 균형은 결정을 통해 직접 바꿀 수 없습니다. 타다울, SAGIA 및 기타 갈래에서 §L완료한 중점§!과 §L주요 사건§!, 국왕의 §L개혁§!을 통해 변화합니다."
 SAU_break_houthi_ceasefire: "휴전 파기"
 SAU_break_houthi_ceasefire_desc: "후티와의 휴전을 파기하고 결정적 폭풍 작전을 재개합니다."
 SAU_broadcast_revolution: "혁명 방송"
 SAU_broadcast_revolution_desc: "자유 아라비아 방송을 이용해 아랍 국가 전역의 노동자와 기타 불만 집단 사이에서 공산주의 지지를 확산합니다."
 SAU_coalition_member_arm_yemen: "공화국 무장"
 SAU_coalition_member_arm_yemen_desc: "리야드가 아닌 우리 자신의 이름으로 승인된 정부에 무기와 인력을 보냅니다.\n\n§G예멘이 보병 장비 1,500점, 인력 8,000명과 육군 경험치를 받습니다§!. 30일마다 반복 가능."
 SAU_coalition_member_category: "예멘 연합"
 SAU_coalition_member_leave: "연합 탈퇴"
 SAU_coalition_member_leave_desc: "사우디가 주도하는 연합에서 철수하고 예멘 작전 참여를 종료합니다.\n\n§R리야드는 연합 파트너를 잃고 이를 개인적인 일로 받아들입니다§!; §G+50 정치력, +3% 안정도§!."
 SAU_coalition_member_strike: "우리 몫의 출격"
 SAU_coalition_member_strike_desc: "항공 임무 배정에서 우리 몫을 후티가 장악한 지역에 대해 출격합니다.\n\n대상 지역의 §R인프라, 무기 산업, 방공 시설에 피해를 입힙니다§!. 21일마다 반복 가능."
 SAU_communist_invite_to_comintern: "[FROM.GetName]을(를) 아랍 코민테른에 초대"
 SAU_communist_invite_to_comintern_desc: "[FROM.GetName]에 아랍 코민테른 가입을 요청하는 초대장을 보냅니다. 같은 노동자 국가를 무력으로 해방할 필요는 없으며, 이들은 수락하거나 거절할 수 있습니다."
 SAU_communist_seize_power: "[FROM.GetName]에서 사회주의 혁명 개시"
 SAU_communist_seize_power_desc: "노동자가 거리를 장악한 곳에서 타격합니다. 압도적인 지지가 있으면 구체제가 무너지고, 운동이 강하기만 한 곳에서는 나라가 혁명 내전에 빠집니다."
 SAU_council_national_service: "국민 복무 퍼레이드"
 SAU_council_national_service_desc: "위원회가 참석한 가운데 파드 국왕 도로에서 전국에 방송되는 군사 퍼레이드를 개최합니다. 이 행사는 군과 새 정부에 대한 대중의 지지를 높일 것입니다."
 SAU_council_officer_housing: "장교 주택 사업"
 SAU_council_officer_housing_desc: "장교단을 위한 주택 단지, 학교, 진료소를 건설합니다. 위원회에 대한 군의 지지가 높아지지만 공공 자금이 다른 수요에서 빠져나갑니다."
 SAU_council_officer_purge: "장교단 숙청"
 SAU_council_officer_purge_desc: "권력 장악 당시 충성심이 불분명했던 장교들을 퇴역시키고, 이후 조사에서 드러난 다른 장교들도 제거합니다. 군은 규모가 작아지지만 더 믿을 만해집니다."
 SAU_council_public_accounts: "공공 회계 공개"
 SAU_council_public_accounts_desc: "각 부처의 회계를 공개하여 투명한 정부에 대한 위원회의 의지를 보여 줍니다. 청렴하다는 평판은 높아지지만, 이전에 비공식적 거래에 쓰이던 재량 지출이 제한됩니다."
 SAU_council_security_directorate: "보안국 설치"
 SAU_council_security_directorate_desc: "마바히스, 내무부 네트워크, 군 정보 기관을 단일 국 아래로 통합합니다. 보고 체계가 중앙집권화되어 위원회가 왕국 전역의 위협을 감시하는 능력이 향상됩니다."
 SAU_councils_category: "왕국의 위원회들"
 SAU_councils_category_desc: "§H마즐리스 아슈슈라§! - [ROOT.GetSAUShuraBench]\n§O울라마§! [?SAU_shura_ulema|0]    §Y테크노크라트§! [?SAU_shura_technocrats|0]    §G유력 인사§! [?SAU_shura_notables|0]\n§H인민위원회§! - [ROOT.GetSAUPCStanding], [ROOT.GetSAUPCBloc]\n§O개혁파§! [?SAU_pc_reformists|0]    §Y전통주의자§! [?SAU_pc_traditionalists|0]    §G지방 대표§! [?SAU_pc_provincials|0]\n\n이제 리야드에는 두 개의 의회가 있으나 어느 쪽도 국왕에게 무엇이든 강제할 수 없습니다.\n\n§H마즐리스 아슈슈라§!는 임명제이며 맡겨진 사안에 대해 자문합니다. 가장 많은 의석을 차지한 계파가 그 성격을 결정하며, 그 성격은 가치가 있습니다.\n§O울라마 주도§!  §G+8% 안정도, +10% 표류 방어§!  /  §R-5% 연구, -5% 이주§!\n§Y테크노크라트 주도§!  §G+8% 연구, +6% 사무소 산출, +5% 생산성§!  /  §R-5% 안정도§!\n§G유력 인사 주도§!  §G+8% 정치력, -8% 부패 비용§!  /  §R+3% 소비재, -3% 전쟁 지지도§!\n\n§Y한 계파의 의석이 70을 넘으면 국왕은 위원회를 영구 헌장으로 확정할 수 있습니다.§! 헌장은 그 계파의 성격을 두 배로 늘리고 기본법에 고정시키며 경쟁을 영원히 끝냅니다. 이후 의석 수는 아무것도 결정하지 못합니다. 거부하면 세 계파는 모두 40으로 초기화되며, 의회는 여전히 귀하가 재조정할 수 있습니다.\n\n§H인민위원회§!는 아래를 향해 답합니다. 이는 왕국 역사상 피통치자에게 말하는 것이 아니라 피통치자를 대변하는 최초의 기구이며, 내정에 관한 입법을 할 수 있습니다. 국왕은 거부권을 유지하며, §R거부권을 행사할 때마다 안정도와 전쟁 지지도가 감소합니다§!."
 SAU_crown_prince_category: "왕세자"
 SAU_cyber_defensive_op: "방어적 사이버 작전"
 SAU_cyber_defensive_op_desc: "§Y90일§! 동안 왕국을 방어 강화하고 대상의 공세 체계를 파괴합니다. 대상의 병력은 우리에 대해 §Y공격 시 10% 약해지며§!, GIP는 우리 네트워크를 보호합니다. 대상에 대한 §G70%§! 네트워크가 필요합니다."
 SAU_cyber_offensive_op: "공세적 사이버 작전"
 SAU_cyber_offensive_op_desc: "네트워크를 무기로 전환합니다. §Y90일§! 동안의 GIP 사이버 타격이 대상의 지휘 체계와 방어를 무력화합니다. 대상의 사단은 §Y방어 시 10% 약해지고§! 산업이 정체됩니다. 대상에 대한 §G70%§! 네트워크가 필요합니다."
 SAU_debug_bop_left: "§Y(디버그) 전통주의 쪽으로 이동§!"
 SAU_debug_bop_left_desc: "모더/디버그 도구 전용입니다. §H왕국의 미래§! 균형을 §R왼쪽으로 -0.05§! (전통주의 방향) 이동시킵니다. 게임을 -debug로 실행했을 때만 표시됩니다."
 SAU_debug_bop_right: "§Y(디버그) 자유화 쪽으로 이동§!"
 SAU_debug_bop_right_desc: "모더/디버그 도구 전용입니다. §H왕국의 미래§! 균형을 §G오른쪽으로 +0.05§! (자유화 방향) 이동시킵니다. 게임을 -debug로 실행했을 때만 표시됩니다."
 SAU_debug_category: "디버그 - 사우디 왕위 계승"
 SAU_debug_clear_decree_lock: "디버그: 60일 칙령 잠금 해제"
 SAU_debug_clear_decree_lock_desc: "SAU_royal_decree_active를 지워 60일을 기다리지 않고 재위 군주 결정을 즉시 다시 실행할 수 있게 합니다."
 SAU_debug_drain_salman_health: "디버그: 살만 국왕의 건강 소진"
 SAU_debug_drain_salman_health_desc: "SAU_salman_health를 0으로 설정합니다. 다음 월간 틱에 즉위 연쇄가 발동하여 현재 왕세자가 왕위에 오릅니다."
 SAU_debug_faisalite_conviction_up: "(디버그) 파이살주의 신념 +25"
 SAU_debug_faisalite_conviction_up_desc: "신념을 25 추가하고 단계를 다시 평가합니다. 45와 75를 넘기려면 반복하십시오."
 SAU_debug_faisalite_open: "(디버그) 파이살주의 연쇄 시작"
 SAU_debug_faisalite_open_desc: "140일을 기다리지 않고 연쇄를 시작하는 메카 정상회담 사건을 발동합니다."
 SAU_debug_faisalite_pivot: "(디버그) 이라크 전환 발동"
 SAU_debug_faisalite_pivot_desc: "전쟁 상황과 관계없이 미국 점령 전환 사건을 발동합니다."
 SAU_debug_faisalite_readout: "(디버그) 파이살주의: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_faisalite_readout_desc: "§H신념§!: §Y100§! 중 §Y[?SAU_faisalite_conviction|0]§!\n§H월간 사회적 보수주의§!: §Y[?SAU_social_conservatism|0]§!\n§H단계§!: [ROOT.GetSAUFaisaliteConviction]"
 SAU_debug_grievance_open: "(디버그) 쿠데타 연쇄 시작"
 SAU_debug_grievance_open_desc: "2008년 유가 폭락 플래그를 설정하고, 2008년을 기다리지 않고 연쇄를 시작하는 장교 불만 사건을 발동합니다."
 SAU_debug_grievance_readout: "(디버그) 장교: [ROOT.GetSAUArmyGrievance]"
 SAU_debug_grievance_readout_desc: "§H불만§!: §Y100§! 중 §Y[?SAU_army_grievance|0]§!\n[ROOT.GetSAUArmyGrievanceEffect]\n§H방위군 보호§! (월간 증가율 2배): SAU_sang_shielded 플래그로 확인."
 SAU_debug_grievance_up: "(디버그) 장교 불만 +25"
 SAU_debug_grievance_up_desc: "불만을 25 추가하고 단계를 다시 평가합니다. 50 (배치 명령)과 75 (쿠데타)를 넘기려면 반복하십시오."
 SAU_debug_junta_legitimacy_up: "(디버그) 군사정권 정통성 +25"
 SAU_debug_junta_legitimacy_up_desc: "위원회의 위상을 높여 위기가 시간 초과 없이 완료되는지 확인합니다."
 SAU_debug_junta_legitimacy_zero: "(디버그) 군사정권 정통성 0으로"
 SAU_debug_junta_legitimacy_zero_desc: "위원회를 0으로 떨어뜨려 다음 확인 때 정통성 위기가 준비되게 합니다."
 SAU_debug_junta_open: "(디버그) 장교 쿠데타 강제 발동"
 SAU_debug_junta_open_desc: "불만 연쇄를 준비하고 장악 사건을 즉시 발동합니다."
 SAU_debug_king_abdullah: "디버그: 압둘라 국왕 즉위"
 SAU_debug_king_abdullah_desc: "SAU_current_king을 1로 설정하고 압둘라를 국가 지도자로 앉히며 압둘라 시대의 왕위 계승 경쟁을 다시 엽니다 (살만 45 / MBN 30 / 무타입 25)."
 SAU_debug_king_mbn: "디버그: 무함마드 빈 나이프 즉위"
 SAU_debug_king_mbn_desc: "SAU_current_king을 3으로 설정하고 무함마드 빈 나이프를 국가 지도자로 앉힙니다."
 SAU_debug_king_mbs: "디버그: 무함마드 빈 살만 즉위"
 SAU_debug_king_mbs_desc: "SAU_current_king을 5로 설정하고 무함마드 빈 살만을 국가 지도자로 앉힙니다."
 SAU_debug_king_mutaib: "디버그: 무타입 빈 압둘라 즉위"
 SAU_debug_king_mutaib_desc: "SAU_current_king을 4로 설정하고 무타입 빈 압둘라를 국가 지도자로 앉힙니다."
 SAU_debug_king_salman: "디버그: 살만 국왕 즉위"
 SAU_debug_king_salman_desc: "SAU_current_king을 2로 설정하고 살만을 국가 지도자로 앉히며, 그의 건강을 100으로 초기화하고 MBS 대 MBN 왕세자 경쟁을 엽니다."
 SAU_debug_oil_dep_readout: "(디버그) 석유 의존도: [?oil_dependence|0] (분기 틱 [?SAU_oil_dep_quarter|0]/3)"
 SAU_debug_oil_dep_readout_desc: "의존도 값과 3개월 틱이 얼마나 진행되었는지 표시합니다."
 SAU_debug_pc_open: "(디버그) 인민위원회 창설"
 SAU_debug_pc_open_desc: "중점 없이 플래그를 설정하고 의회를 40/40/40, 위상 50으로 구성합니다."
 SAU_debug_pc_readout: "(디버그) 인민위원회 상태"
 SAU_debug_pc_readout_desc: "§H개설 여부§! (SAU_peoples_council_open, SAU_establish_the_peoples_council로 설정)\n§H위상§!: §Y[?SAU_pc_standing|0]§! - 공공 사업에는 60 이상 필요\n§H의석§! - 개혁파 §Y[?SAU_pc_reformists|0]§!, 전통주의자 §Y[?SAU_pc_traditionalists|0]§!, 지방 대표 §Y[?SAU_pc_provincials|0]§! - 계파가 발언하려면 21 이상 필요\n§H사용한 거부권§!: §Y[?SAU_pc_vetoes|0]§!"
 SAU_debug_pc_reset_cycle: "(디버그) 회기 플래그 초기화"
 SAU_debug_pc_reset_cycle_desc: "회기가 멈춘 경우 SAU_pc_debate_ongoing과 SAU_pc_doing_bill을 지웁니다."
 SAU_debug_pc_standing_up: "(디버그) 위원회 위상 +20"
 SAU_debug_pc_standing_up_desc: "공공 사업을 시험할 수 있도록 위상을 20 높입니다."
 SAU_debug_shura_dissolve: "(디버그) 마즐리스 아슈슈라 해산"
 SAU_debug_shura_dissolve_desc: "SAU_shura_dissolve를 실행하여 플래그를 지우고, 계파 의석을 0으로 만들며, 국가 정신을 제거합니다."
 SAU_debug_shura_open: "(디버그) 마즐리스 아슈슈라 개설"
 SAU_debug_shura_open_desc: "SAU_reorganization_of_the_majlis_ash_shura나 무타입의 즉위 없이 SAU_shura_open을 설정하고 위원회를 50/50/50으로 구성합니다."
 SAU_debug_shura_readout: "(디버그) 슈라 조건 확인"
 SAU_debug_shura_readout_desc: "§H카테고리에 필요한 모든 조건:§!\n§Y위원회 개설§! (SAU_shura_open, SAU_reorganization_of_the_majlis_ash_shura로 설정)\n§Y사우드 가문 집권§!: [?ruling_party|0]이(가) 10이어야 함\n§Y쿠데타 없음§! (SAU_military_coup_ready가 해제되어 있어야 함)\n§Y군주제 유지§! (SAU_monarchy_abolished가 해제되어 있어야 함)\n\n§H의석§! - 울라마 [?SAU_shura_ulema|0], 테크노크라트 [?SAU_shura_technocrats|0], 유력 인사 [?SAU_shura_notables|0]"
 SAU_debug_storm_complete_civil_war: "(디버그) 예멘 내전 중점 완료"
 SAU_debug_storm_complete_civil_war_desc: "월간 확인을 기다리지 않고 SAU_the_yemeni_civil_war를 강제로 완료합니다."
 SAU_debug_storm_open: "(디버그) 리야드 회담 발동"
 SAU_debug_storm_open_desc: "중점과 그 선행 조건을 건너뛰고 사건 194를 직접 발동합니다."
 SAU_debug_storm_readout: "(디버그) 연합: [?SAU_coalition_partners|0]"
 SAU_debug_storm_readout_desc: "§H연합 파트너§!: §Y[?SAU_coalition_partners|0]§!\n§H폭풍 개시§!: 플래그 SAU_decisive_storm_launched\n§H내전 중점§!: SAU_the_yemeni_civil_war"
 SAU_debug_water_pride_down: "§Y(디버그) 물 자긍심 1단계 강제 하락§!"
 SAU_debug_water_pride_down_desc: "모더/디버그 도구. 안정도와 관계없이 §H주권 수역§! 국가 정신을 한 단계 낮춥니다. -debug에서만 표시됩니다."
 SAU_debug_water_pride_up: "§Y(디버그) 물 자긍심 1단계 강제 상승§!"
 SAU_debug_water_pride_up_desc: "모더/디버그 도구. 안정도와 관계없이 §H주권 수역§! 국가 정신을 한 단계 높입니다. -debug에서만 표시됩니다."
 SAU_div_arms: "무기 생산 현지화"
 SAU_div_arms_desc: "§HSAMI§!와 국내 방위 산업을 확충합니다. 사우디산 무기는 수입 비용을 줄이고 기술자를 고용하며 석유를 넘어 §G산업 기반을 넓혀 줍니다§!."
 SAU_div_digital: "디지털 경제 육성"
 SAU_div_digital_desc: "§H핀테크, 전자상거래, 신생 기업§!을 지원하여 숙련된 일자리와 더 넓은 비석유 세원을 창출합니다. 민간 디지털 산업을 확대함으로써 §G원유 의존도가 줄어듭니다§!."
 SAU_div_giga_project: "초대형 프로젝트 지원"
 SAU_div_giga_project_desc: "북서부에 계획된 도시인 §H네옴§!에 막대한 자금을 투입합니다. 이 프로젝트는 상당한 건설 수요를 만들어 내며 경제를 §G석유에서 벗어나게 하지만§! 재정 비용이 매우 높습니다."
 SAU_div_pif_invest: "PIF 전략 투자"
 SAU_div_pif_invest_desc: "§H공공투자기금§!의 자본을 리야드의 국내 공장, 건설 역량, 고용에 투입합니다. §G석유 의존도§!가 크게 감소하지만 국고에 상당한 부담이 됩니다."
 SAU_div_renewables: "재생 에너지 용량 확대"
 SAU_div_renewables_desc: "룹알할리 사막에 §H태양광과 풍력§!을 건설합니다. 청정 전력은 원유를 수출에 돌릴 수 있게 하고 §G경제의 석유 의존도를 낮춥니다§!."
 SAU_div_tourism_event: "세계 관광 행사 개최"
 SAU_div_tourism_event_desc: "§H홍해 연안§!의 휴양지, 축제, 순례, 국제 관광을 홍보합니다. 방문객 지출은 석유를 넘어 왕국의 수입을 §G다변화합니다§!."
 SAU_domestic_external_category: "§H사우디 내정 및 외교§!"
 SAU_east_belt_road: "일대일로 투자"
 SAU_east_belt_road_desc: "사우디의 항만, 철도, 산업 도시에 대한 중국의 일대일로 투자를 수용합니다. 이 사업은 서방 파트너가 흔히 붙이는 정치적 조건 없이 인프라를 확충합니다."
 SAU_east_energy_markets: "아시아 에너지 시장"
 SAU_east_energy_markets_desc: "중국과 기타 아시아 경제권으로의 석유 수출을 확대합니다. 더 넓어진 고객층은 사우디의 협상력을 높이고 서방 수요에 대한 의존도를 낮춥니다."
 SAU_east_trade: "동방과의 무역 협정"
 SAU_east_trade_desc: "사우디의 에너지 수출을 성장하는 아시아 경제권의 공산품과 교환하는 무역 협정을 체결합니다."
 SAU_faisalite_category: "파이살주의 문제"
 SAU_faisalite_endowments: "와크프 기금 지원"
 SAU_faisalite_endowments_desc: "석유 수입 감소 이후 자금 부족에 시달려 온 종교 기금에 추가 자금을 제공합니다. 추적되지 않는 자금은 왕국 전역의 설교에 영향을 미치는 성직자들의 지지를 확보해 줄 것입니다."
 SAU_faisalite_guard_petition: "방위군의 청원"
 SAU_faisalite_guard_petition_desc: "국가방위군 고위 장교들이 무타입에게 공개 청원서를 제출하도록 허용합니다. 서명을 통해 그의 왕위 계승권을 지지하는 장교들이 드러날 것입니다."
 SAU_faisalite_int_buy_satellite_channels: "아랍 위성 채널 매수"
 SAU_faisalite_int_buy_satellite_channels_desc: "주요 아랍 위성 방송망을 매입하고 리야드에 우호적인 인물들을 임명합니다. 지역 언론에 대한 사우디의 영향력이 커지지만 울라마가 우려합니다."
 SAU_faisalite_int_endow_universities: "해외 대학 기부"
 SAU_faisalite_int_endow_universities_desc: "카이로에서 쿠알라룸푸르에 이르는 해외 대학에 상설 이슬람학 석좌를 지원합니다. 리야드가 자금을 대고 승인된 교과 과정을 정합니다."
 SAU_faisalite_int_hard_currency_loans: "경화로 대출"
 SAU_faisalite_int_hard_currency_loans_desc: "다른 곳에서 적정한 자금을 조달할 수 없는 정부에 달러 표시 대출을 제공합니다. 유리한 조건은 이들의 사우디 지원 의존도를 높일 것입니다."
 SAU_faisalite_int_officers_abroad: "해외 장교단 파견"
 SAU_faisalite_int_officers_abroad_desc: "사우디 장교들을 무슬림 세계 전역의 군에 고문과 교관으로 배치합니다. 이러한 파견은 사우디군의 경험을 높이고 리야드의 영향력을 확대합니다."
 SAU_faisalite_int_pilgrimage_quotas: "순례 할당량 확대"
 SAU_faisalite_int_pilgrimage_quotas_desc: "메카의 인프라에 부담이 가중됨에도 하지 순례 할당량을 늘립니다. 더 많은 순례자가 사우디의 성지 관리를 체험하고 왕국과 더 강한 유대를 지니고 귀국하게 됩니다."
 SAU_faisalite_iso_buy_foreign_firms: "외국 기업 인수"
 SAU_faisalite_iso_buy_foreign_firms_desc: "왕국에서 영업하는 외국 소유 기업을 인수하여 그 자산을 국가 부처로 이전합니다. 사우디의 경제 통제력이 높아지지만 새 운영자들은 기업이 가지고 있던 전문성을 갖추지 못하게 됩니다."
 SAU_faisalite_iso_cancel_visas: "외국인 노동 비자 취소"
 SAU_faisalite_iso_cancel_visas_desc: "외국인 취업 허가 100만 건이 갱신 없이 만료되도록 둡니다. 노동력 중 사우디인의 비중이 높아지지만 외국인 노동에 의존하는 사업이 지연됩니다."
 SAU_faisalite_iso_close_foreign_schools: "외국 학교 폐쇄"
 SAU_faisalite_iso_close_foreign_schools_desc: "국제 학교를 폐쇄하고 학생들을 국가 교육 체계로 전입시킵니다. 교육은 사우디 교과 과정을 따르게 되지만, 학교들은 늘어난 학생을 감당할 준비가 되어 있지 않습니다."
 SAU_faisalite_iso_import_licences: "수입 허가 배급제"
 SAU_faisalite_iso_import_licences_desc: "분기마다 발급하는 수입 허가 수를 줄입니다. 수입품이 더 귀해지고 비싸져 국내 생산자에게 시장에서 더 큰 여지를 줍니다."
 SAU_faisalite_iso_repatriate_reserves: "국부 보유고 환수"
 SAU_faisalite_iso_repatriate_reserves_desc: "사우디의 국부 보유고를 뉴욕과 런던에서 빼내 왕국으로 되돌립니다. 국가 자산에 대한 직접 통제가 강화되지만 서방 금융 파트너와의 관계가 심각하게 손상됩니다."
 SAU_faisalite_score_interventionist: "§R개입주의§!   §Y[?SAU_faisalite_interventionist|0]§!"
 SAU_faisalite_score_interventionist_desc: "개입주의는 정상회담, 재정 지원, 군사 고문을 이용하여 리야드를 움마의 선두에 세웁니다. 개입주의 지침은 동시에 두 개까지 진행할 수 있으며 완료해야만 보상이 주어집니다. 최종 기둥인 §R제3의 길 교리§!를 얻으려면 이 점수를 §O고립주의§! 점수보다 높게 유지하십시오."
 SAU_faisalite_score_isolationist: "§O고립주의§!   §Y[?SAU_faisalite_isolationist|0]§!"
 SAU_faisalite_score_isolationist_desc: "고립주의는 대외 공약을 피하면서 사우디 정책을 국경, 종교, 석유에 집중시킵니다. 고립주의 지침은 동시에 두 개까지 진행할 수 있으며 완료해야만 보상이 주어집니다. 최종 기둥인 §O영광스러운 고립§!을 얻으려면 이 점수를 §R개입주의§! 점수보다 높게 유지하십시오."
 SAU_faisalite_sermons: "설교 배포"
 SAU_faisalite_sermons_desc: "파이살의 녹음된 연설을 다시 발행하고 국가방위군 내부에 녹취록을 배포합니다. 이 운동은 그의 정치 교리를 되살리겠지만, 현 정부에 대한 함의를 부처에서 알아차릴 것입니다."
 SAU_Foregin_affairs_category: "§G사우디 외교§!"
 SAU_Foreign_affairs_unlocked: "§H외교 잠금 해제§!"
 SAU_Foreign_affairs_unlocked_desc: "외무부가 다시 왕국의 지휘를 받습니다. 아래의 결정을 실행할 수 있습니다."
 SAU_found_arab_comintern: "아랍 코민테른 창설"
 SAU_found_arab_comintern_desc: "아라비아가 아랍 세계의 공산주의 국가들을 자신의 지도 아래 단일한 혁명 블록으로 소집합니다."
 SAU_fsa_foreign_fighters: "외국인 전투원 유입 경로 개방"
 SAU_fsa_foreign_fighters_desc: "걸프를 거쳐 이동하는 외국인 지원병이 자유 시리아군에 합류하도록 허용하여 가용 인력을 늘립니다."
 SAU_fsa_send_cash: "자유 시리아군에 자금 송금"
 SAU_fsa_send_cash_desc: "자유 시리아군의 급여, 조달, 정치 조직을 위한 비밀 자금 경로를 구축합니다."
 SAU_fsa_smuggle_weapons: "반군에 무기 밀반입"
 SAU_fsa_smuggle_weapons_desc: "요르단을 통해 소화기를 운반하여 시리아 정부에 맞서는 자유 시리아군을 강화합니다."
 SAU_heir_mbn_maneuver: "왕세자의 책략"
 SAU_heir_mbn_maneuver_desc: "무함마드 빈 나이프의 내무부 권한, 보안 기록, 대테러 평판을 이용하여 그의 왕위 계승권을 강화합니다."
 SAU_heir_mbs_maneuver: "젊은 왕자의 책략"
 SAU_heir_mbs_maneuver_desc: "추가 직책을 무함마드 빈 살만에게 이양하고 그의 왕위 계승권에 반대하는 관리들을 제거합니다."
 SAU_heir_rally_support: "후계자 지지 규합"
 SAU_heir_rally_support_desc: "왕위 계승이 공식 발표되기 전에 고위 왕자들을 만나고 영향력 있는 편집자들에게 설명하여 선택된 후계자에 대한 지지를 쌓습니다."
 SAU_heir_undermine_mbn: "무함마드 빈 나이프 흠집 내기"
 SAU_heir_undermine_mbn_desc: "무함마드 빈 나이프의 건강, 지구력, 미국과의 긴밀한 관계에 대한 우려를 퍼뜨려 궁정 내 그의 지지를 약화시킵니다."
 SAU_heir_undermine_mbs: "무함마드 빈 살만 흠집 내기"
 SAU_heir_undermine_mbs_desc: "무함마드 빈 살만의 예멘 전쟁 지휘, 과도한 지출, 고위 왕자들과의 분쟁을 부각하여 궁정 내 그의 지지를 약화시킵니다."
 SAU_houthi_break_ceasefire: "사우디와의 휴전 파기"
 SAU_houthi_break_ceasefire_desc: "왕국의 총성은 멎었지만 전쟁은 끝나지 않았습니다. 휴전을 파기하고 사우디에 대한 공세를 재개합니다."
 SAU_if_cross_border_raid: "국경 너머 습격"
 SAU_if_cross_border_raid_desc: "이스라엘군 보급창과 전초 기지를 타격하기 위해 무장 침투를 개시합니다. 가장 대담한 선택이며 격렬한 대응을 불러일으킬 가능성이 가장 높습니다."
 SAU_if_rocket_barrage: "이스라엘 도시에 로켓 포격"
 SAU_if_rocket_barrage_desc: "전선에 이스라엘 도시를 향한 로켓 발사를 명령하여 경제를 교란하고 주민을 대피소로 몰아넣습니다."
 SAU_if_suicide_bombing: "폭탄 테러 작전 개시"
 SAU_if_suicide_bombing_desc: "전선의 조직원들에게 이스라엘 도시에서 자살 폭탄 공격을 수행하도록 지시하여 대중의 사기를 떨어뜨리고 이스라엘의 보안 비용을 증가시킵니다."
 SAU_intel_counterintel_sweep: "방첩 소탕"
 SAU_intel_counterintel_sweep_desc: "GIP가 한 시즌 동안 내부로 눈을 돌립니다. 안가를 일망타진하고, 암호 담당자를 교체하며, 왕국 내 모든 외국 공작 담당관에게 잠잠해질 이유를 만들어 줍니다.\n\n§G90일 동안 외국의 전복 활동을 억제하고 우리 암호를 강화하며§!, 종료 시에는 정보 공동체를 만족시킵니다.\n\n§Y반복 가능§! - 소탕은 계속 실행하는 동안에만 유지됩니다."
 SAU_intel_counterterror: "대테러국"
 SAU_intel_counterterror_desc: "알카에다와 지하디스트 조직에 대한 급습과 정보 작전을 조율합니다. 이 단속은 안정도를 높이고 사우드 가문을 GIP 뒤로 결집시키며, 왕국에서 활동하는 외국인 전투원들을 직접 타격합니다."
 SAU_intel_expand_gip: "종합정보청 확대"
 SAU_intel_expand_gip_desc: "새로운 거점, 새로운 위장 신분, 새로운 훈련생 모집. 청은 한 사람을 뽑고 끝내지 않으며 그를 배치할 자리까지 만듭니다.\n\n§G요원 슬롯을 영구적으로 추가하여§!, 왕국이 또 한 명의 장교를 영구히 현장에 둘 수 있게 합니다.\n\n§Y최대 3회까지 반복 가능.§!"
 SAU_intel_foreign_stations: "해외 거점 네트워크"
 SAU_intel_foreign_stations_desc: "해외에 GIP 거점을 개설하여 이란의 영향력을 몰아내고 사우디의 영향이 지역 전체에 미치게 합니다."
 SAU_intel_mabahith: "마바히스 강화"
 SAU_intel_mabahith_desc: "국내 반대 세력에 대한 마바히스의 감시와 작전을 확대합니다. 내부 통제가 강화되어 안정도와 종교 기관의 지지가 높아집니다."
 SAU_intel_surveillance_tech: "첨단 감시 기술 도입"
 SAU_intel_surveillance_tech_desc: "GIP는 왕국 자체 기술자들을 기다리는 대신 감시 및 데이터 분석 체계를 통째로 구입하고 외국 계약업체에 설치를 맡깁니다.\n\n§G기관 컴퓨터를 즉시 설치하며§!, §Y기관이 통상 요구하는 연구나 부서 차원의 준비 작업이 필요 없습니다§!.\n\n§R지름길에는 대가가 따릅니다§! - 직접 구축하는 것보다 비싸며 한 번만 가능합니다."
 SAU_Intelligence_category: "§G종합정보청§!"
 SAU_islamic_rivalry_close: "대이란 운동 중단"
 SAU_islamic_rivalry_close_desc: "조용히 운동을 접습니다. 다시 열 때까지 이슬람 세계 경쟁 결정을 닫습니다."
 SAU_islamic_rivalry_open: "대이란 운동 개시"
 SAU_islamic_rivalry_open_desc: "왕국의 기구를 테헤란에 맞서도록 가동합니다. 이슬람 세계 경쟁 결정을 엽니다."
 SAU_isr_talks_backchannel: "비공식 채널 개설"
 SAU_isr_talks_backchannel_desc: "양국 정부가 공개 협상을 시작하기 전에 제3국의 중개자를 활용하여 이스라엘이 받아들일 만한 조건을 파악합니다."
 SAU_isr_talks_clock: "이스라엘과의 협상 마무리"
 SAU_isr_talks_clock_desc: "이스라엘이 협상에 동의한 순간부터 기한은 120일입니다. 인내심과 정치, 지역의 적들이 문을 닫기 전에 이스라엘은 아랍 평화 구상과 적어도 하나의 다른 트랙을 수락해야 합니다."
 SAU_isr_talks_palestine: "아랍 평화 구상 제시"
 SAU_isr_talks_palestine_desc: "2002년 구상을 서면으로 테이블에 올립니다. 1967년 경계선에 따른 독립 팔레스타인 국가의 수립을 대가로 아랍 세계와의 완전한 관계 정상화를 제안합니다."
 SAU_isr_talks_sweeten: "조건 개선"
 SAU_isr_talks_sweeten_desc: "합의를 위한 경제적 유인책으로 투자, 영공 개방, 걸프 시장 접근권을 제안합니다."
 SAU_isr_talks_us_mediation: "워싱턴 끌어들이기"
 SAU_isr_talks_us_mediation_desc: "미국에 협상을 보증하고 이스라엘에 대한 영향력을 행사하여 합의를 뒷받침해 달라고 요청합니다."
 SAU_junta_address_the_nation: "국민에게 연설"
 SAU_junta_address_the_nation_desc: "위원회 고위 위원이 TV 연설을 통해 새 정부와 그 계획을 설명하도록 합니다. 이 연설은 국가가 여전히 효과적인 통제 아래 있다는 점을 일부 대중에게 안심시킬 것입니다."
 SAU_junta_category: "최고군사위원회"
 SAU_junta_control_readout: "§H통제력§! §W[?SAU_junta_control|0]§!"
 SAU_junta_control_readout_desc: "통제력은 위원회가 주둔군, 검문소, 정보 파일, 충성스러운 인력을 통해 명령을 집행하는 능력을 나타냅니다. 매달 1씩 감소하며, 임시 위원회 프로그램은 시작할 때 추가로 통제력을 소모합니다."
 SAU_junta_legitimacy_crisis: "위원회는 스스로 해명해야 한다"
 SAU_junta_legitimacy_crisis_desc: "위원회는 남아 있던 정통성을 잃었으며 성직자와 지방 당국의 지지가 무너지기 시작하고 있습니다. 위원회는 6개월 안에 장교들과 합의하고 부족의 요구를 해결하며 위상을 §H20§!까지 회복해야 합니다.\n\n§R그 기준을 충족하지 못한 채 180일이 지나면 왕국은 공개적인 분쟁에 돌입합니다.§!"
 SAU_junta_legitimacy_readout: "§H정통성§! §W[?SAU_junta_legitimacy|0]§!"
 SAU_junta_legitimacy_readout_desc: "정통성은 선거, 파트와, 합법적 계승의 뒷받침이 없는 위원회에 대한 수용 정도를 나타냅니다. 매달 1씩 감소하며, 0에 도달하면 위원회에는 20까지 회복할 수 있는 180일이 주어집니다."
 SAU_junta_reinforce_garrisons: "주둔군 증강"
 SAU_junta_reinforce_garrisons_desc: "지방 주도에 추가 대대를 배치하고, 검문소 인력을 모두 채우며, 리야드와 주둔군 사이의 군 통신을 복구합니다."
 SAU_junta_standing_readout: "§H위상§! [ROOT.GetSAUJuntaStanding]"
 SAU_junta_standing_readout_desc: "[ROOT.GetSAUJuntaStandingEffect]"
 SAU_junta_tour_the_provinces: "지방 순방"
 SAU_junta_tour_the_provinces_desc: "위원회 대표를 부라이다, 제다, 자잔, 내륙 지역으로 보내 지역 지도자들을 만납니다. 불만을 청취하고 지역의 요청에 자금을 지원하면 지방의 지지가 개선됩니다."
 SAU_king_abdullah_category: "압둘라 빈 압둘아지즈 국왕"
 SAU_king_mbn_category: "무함마드 빈 나이프 국왕"
 SAU_king_mbs_category: "무함마드 빈 살만 국왕"
 SAU_king_mutaib_category: "무타입 빈 압둘라 국왕"
 SAU_king_salman_category: "살만 빈 압둘아지즈 국왕"
 SAU_mbn_border_surveillance: "국경 수비대 감시망 강화"
 SAU_mbn_border_surveillance_desc: "예멘 및 이라크 국경을 따라 감시탑, 센서 울타리, 열화상 카메라를 설치하여 무단 월경 탐지를 개선합니다."
 SAU_mbn_mabahith_campaign: "마바히스 반전복 작전 승인"
 SAU_mbn_mabahith_campaign_desc: "일반수사국이 왕국 전역의 전복 혐의 조직망을 해체하도록 승인합니다. 이 작전은 연루 여부가 불확실한 일부 인원도 구금하게 될 것입니다."
 SAU_mbn_maneuver: "빈 나이프 파벌의 책략"
 SAU_mbn_maneuver_desc: "보안 기관은 무함마드 빈 나이프의 계승권을 밀어붙이고 있으며, 궁정을 귀하의 후보에게 등돌리게 할 수 있습니다."
 SAU_mbn_rehabilitation_center: "나이프 왕자 재활 센터 가동"
 SAU_mbn_rehabilitation_center_desc: "구금자들을 성직자, 심리학자, 가족이 참여하는 재활 프로그램에 배치합니다. 이 프로그램은 재범을 줄일 수 있으나 일부 참가자는 무장 활동으로 돌아갈 것입니다."
 SAU_mbn_special_security_forces: "내무부 특수 보안군 배치"
 SAU_mbn_special_security_forces_desc: "주요 도시에 내무부 특수 보안군을 배치하여 장관에게 정규군으로부터 독립된 무장 병력을 제공합니다."
 SAU_mbn_western_intel_networks: "서방 합동 정보망 가동"
 SAU_mbn_western_intel_networks_desc: "리야드, CIA, 영국 정보기관 사이의 정보 연락 체계를 확대합니다. 사우디아라비아는 서방 정보에 대한 더 나은 접근권을 대가로 민감한 정보를 공유할 것입니다."
 SAU_mbs_anticorruption_drive: "반부패 운동 시행"
 SAU_mbs_anticorruption_drive_desc: "왕자들과 재계 지도자들을 고급 호텔에 구금하고 국가와의 재정적 합의를 요구합니다. 자금이 국고로 돌아오며 엘리트에 대한 왕세자의 통제력을 보여 줍니다."
 SAU_mbs_aramco_liquidity: "아람코 전략 유동성 배분"
 SAU_mbs_aramco_liquidity_desc: "아람코의 가용 자본 일부를 왕세자가 통제하는 프로그램으로 이전하여 결정에서 이사회의 역할을 제한합니다."
 SAU_mbs_gami_localization: "GAMI 방위 산업 현지화 동원"
 SAU_mbs_gami_localization_desc: "외국 방산업체가 조달 자금의 절반을 왕국 안에서 지출하도록 요구하며, 그러지 않으면 사우디 계약에 대한 접근을 잃게 됩니다."
 SAU_mbs_pif_neom: "PIF 자금을 네옴 및 개척 사업에 배정"
 SAU_mbs_pif_neom_desc: "높은 기술적, 재정적 위험에도 불구하고 공공투자기금의 자본을 네옴의 선형 도시, 항만, 산악 리조트 사업에 배정합니다."
 SAU_mbs_vision2030_blitz: "비전 2030 홍보 총공세 개시"
 SAU_mbs_vision2030_blitz_desc: "비전 2030에 대한 대중과 기관의 지지를 쌓기 위해 광고와 회의를 아우르는 조율된 캠페인을 개시합니다."
 SAU_military_category: "§H군 현대화§!"
 SAU_militia_back_dflp: "민주전선 지원"
 SAU_militia_back_dflp_desc: "경쟁 운동에 대한 균형추로서 세속 팔레스타인 파벌에 자금을 지원하고 팔레스타인 정치 내 사우디의 영향력을 높입니다."
 SAU_militia_back_hamas: "하마스 자금 지원"
 SAU_militia_back_hamas_desc: "테헤란이 아닌 리야드와의 더욱 긴밀한 제휴를 대가로 하마스에 자금, 무기, 신병을 제공합니다."
 SAU_militia_islamic_front: "사우디에 충성하는 이슬람 전선 결성"
 SAU_militia_islamic_front_desc: "조직과 지휘가 사우디의 지원에 의존하는 새로운 이슬람주의 파벌을 창설하고 자금을 지원합니다."
 SAU_mod_abrams_gunnery: "에이브럼스 포술 프로그램"
 SAU_mod_abrams_gunnery_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! M1A2 에이브럼스 주력 전차.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[1단계 개혁 - 1단계 개혁 세 가지를 모두 완료하면 2단계가 해금됩니다.]§!"
 SAU_mod_apache_training: "아파치 공격 헬리콥터 훈련"
 SAU_mod_apache_training_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! 육군 항공대와 아파치 공격 헬리콥터.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[2단계 개혁 - 2단계 개혁 세 가지를 모두 완료하면 3단계가 해금됩니다.]§!"
 SAU_mod_artillery_livefire: "실탄 포병 훈련"
 SAU_mod_artillery_livefire_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! M109 자주포.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[2단계 개혁 - 2단계 개혁 세 가지를 모두 완료하면 3단계가 해금됩니다.]§!"
 SAU_mod_awacs_battle: "AWACS 전투 관리 훈련"
 SAU_mod_awacs_battle_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! E-3 센트리 AWACS.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[3단계 개혁 - 마지막 묶음.]§!"
 SAU_mod_complete: "3단계: 완전한 현대 군대 달성"
 SAU_mod_complete_desc: "§H3단계 중 3단계 - 완전한 현대 군대.§!\n\n§R2단계 개혁 세 가지를 모두 완료할 때까지 잠겨 있습니다:§!\n  §Y- 실탄 포병 훈련\n  - 아파치 공격 헬리콥터 훈련\n  - 연합 함대 훈련§!\n(각각에서 교리를 선택하십시오).\n\n§G효과:§! 군이 §G완전 현대화§! 상태에 도달하여 이란에 대한 진정한 균형추가 되며, 마지막 개혁인 §Y특수 부대, AWACS, 정밀 타격§!이 나타납니다. 한 번만 발동합니다."
 SAU_mod_construction: "산업 건설 후원"
 SAU_mod_construction_desc: "동부 주에 새로운 공장과 도로를 건설할 자금을 지원하여 주요 산유 지역의 산업 역량을 확대합니다."
 SAU_mod_devfund: "개발 기금 출자"
 SAU_mod_devfund_desc: "국가 개발 기금에 출자하여 동부 주에 새로운 건설 역량을 개방합니다."
 SAU_mod_fleet_exercise: "연합 함대 훈련"
 SAU_mod_fleet_exercise_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! 사우디 왕립 해군.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[2단계 개혁 - 2단계 개혁 세 가지를 모두 완료하면 3단계가 해금됩니다.]§!"
 SAU_mod_gulf_lessons: "워 게임: 걸프전의 교훈"
 SAU_mod_gulf_lessons_desc: "1991년의 쓰라린 교훈에 비추어 육군을 시험하고, 어떤 모델을 기반으로 재건할지 결정하는 대규모 훈련을 실시합니다.\n\n§Y개방되는 것:§! 걸프전의 교훈.\n§G네 가지 교리 중 하나를 선택할 수 있으며§! - 미국식, GCC식, NATO식, 자체식 - 각각 고유한 장점과 단점이 있습니다. 나중에 워 게임을 다시 실행하여 §Y교리를 전환§!할 수 있습니다."
 SAU_mod_modernize: "2단계: 전투 병과 현대화"
 SAU_mod_modernize_desc: "§H3단계 중 2단계 - 전투 병과 재장비.§!\n\n§R1단계 개혁 세 가지를 모두 완료할 때까지 잠겨 있습니다:§!\n  §Y- 국가방위군 즉응 훈련\n  - 에이브럼스 포술 프로그램\n  - 레드 플래그 공중전 훈련§!\n(각각에서 교리를 선택하십시오).\n\n§G효과:§! 군이 §Y개혁 중§!에서 §Y현대화 중§!으로 전환되며, 새로운 개혁 세 가지 - §Y포병, 아파치, 연합 함대§! -가 나타납니다. §Y3단계§!가 해금되려면 세 가지를 모두 완료해야 합니다. 한 번만 발동합니다."
 SAU_mod_pgm_doctrine: "정밀 타격 교리 과정"
 SAU_mod_pgm_doctrine_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! 정밀 유도 무기.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[3단계 개혁 - 마지막 묶음.]§!"
 SAU_mod_red_flag: "레드 플래그 공중전 훈련"
 SAU_mod_red_flag_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! 사우디 왕립 공군.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[1단계 개혁 - 1단계 개혁 세 가지를 모두 완료하면 2단계가 해금됩니다.]§!"
 SAU_mod_reform: "1단계: 개혁 프로그램 개시"
 SAU_mod_reform_desc: "§H3단계 중 1단계 - 현대화의 첫 국면.§!\n\n§G실행 방법:§! §Y총참모부§! 중점을 완료한 뒤 §Y워 게임: 걸프전의 교훈§!에서 승리하십시오 (걸프전 교리를 선택).\n\n§G효과:§! 군이 §R현대화되지 않음§!에서 §Y개혁 중§!으로 전환되며, 새로운 개혁 세 가지 - §Y국가방위군, 에이브럼스 포술, 레드 플래그§! -가 나타납니다.\n\n§R중요:§! 이후 §Y2단계§!가 해금되려면 이 개혁 §R세 가지를 모두§! 완료해야 합니다. 한 번만 발동합니다."
 SAU_mod_sang_drills: "국가방위군 즉응 훈련"
 SAU_mod_sang_drills_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! 사우디 국가방위군.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[1단계 개혁 - 1단계 개혁 세 가지를 모두 완료하면 2단계가 해금됩니다.]§!"
 SAU_mod_sf_selection: "특수 부대 선발 과정"
 SAU_mod_sf_selection_desc: "이 프로그램을 실행하여 군의 이 부문이 어떻게 싸울지 선택합니다.\n\n§Y개방되는 것:§! 특수 부대 사령부.\n§G세 가지 교리 중 하나를 선택할 수 있으며§!, 각각 장점과 단점이 있습니다. 나중에 다시 실행하여 §Y전환§!할 수 있습니다. §H[3단계 개혁 - 마지막 묶음.]§!"
 SAU_mod_workforce: "국가 노동력 양성"
 SAU_mod_workforce_desc: "직업 교육 프로그램으로 더 많은 사우디인이 숙련 노동에 종사하게 하여 사회와 국가 사기를 안정시킵니다."
 SAU_mutaib_capital_garrison: "수도 수비대 망 강화"
 SAU_mutaib_capital_garrison_desc: "리야드 주변에 국가방위군 검문소, 장갑 진지, 독립 통신망을 구축합니다. 수도를 보호하는 동시에 방위군의 수도 통제력을 강화합니다."
 SAU_mutaib_janadriyah_festival: "자나드리야 국가유산 축제 개최"
 SAU_mutaib_janadriyah_festival_desc: "국가방위군이 낙타 경주, 검무, 시, 중계되는 부족 의식이 포함된 자나드리야 축제를 개최하도록 합니다. 이 행사는 무타입과 부족 지도자들의 유대를 강화합니다."
 SAU_mutaib_maneuver: "무타입 파벌의 책략"
 SAU_mutaib_maneuver_desc: "국가방위군은 무타입의 계승권을 밀어붙이고 있으며, 궁정을 귀하의 후보에게 등돌리게 할 수 있습니다."
 SAU_mutaib_sang_logistics: "국가방위군 자율 군수 관리"
 SAU_mutaib_sang_logistics_desc: "정규군 보급창에 의존하는 대신 독립적인 국가방위군 보급 체계를 구축합니다. 군수 자율성은 방위군의 작전적, 정치적 독립성을 높입니다."
 SAU_mutaib_sang_procurement: "국가방위군 항공 및 기갑 조달 신속 추진"
 SAU_mutaib_sang_procurement_desc: "별도의 방위군 항공 구성 부대를 포함하여, 정규군 주문에 앞서 아파치 헬리콥터와 장갑차량을 국가방위군에 우선 배정합니다."
 SAU_mutaib_tribal_reserves: "부족 국가방위군 예비대 동원"
 SAU_mutaib_tribal_reserves_desc: "부족 족장들에게 기존 징집 체계에 따라 국가방위군을 위한 유급 예비 인력을 제공하도록 요청합니다."
 SAU_officer_crisis_category: "장교들의 불만"
 SAU_officer_grievance_readout: "장교단: [ROOT.GetSAUArmyGrievance]"
 SAU_officer_grievance_readout_desc: "§H불만§!: §Y100§! 중 §Y[?SAU_army_grievance|0]§!\n[ROOT.GetSAUArmyGrievanceEffect]\n\n이 항목은 현재 불만 수준을 표시하며 결정 효과는 없습니다."
 SAU_officers_pay_arrears: "체불 임금 지급"
 SAU_officers_pay_arrears_desc: "11개월 치 수당, 주거 보조금, 이연된 임금을 소급 적용하여 한 번에 지급합니다. 일시적으로 숨통을 틔워 주지만 장교들이 불만을 품은 원인은 해결하지 못합니다.\n\n§G-20 불만§!, §R-$12 billion§!, 60일마다 반복 가능."
 SAU_officers_promote_colonels: "대령 진급"
 SAU_officers_promote_colonels_desc: "여단 지휘권을 왕자들에게 유보하지 않고 경험 많은 직업 장교들에게 부여합니다. 이러한 변화는 능력에 따른 진급에 대한 장교단의 신뢰를 높일 것입니다.\n\n§G-15 불만§!, §G+2% 안정도§!, 90일마다 반복 가능."
 SAU_officers_restore_defence_budget: "국방 예산 복원"
 SAU_officers_restore_defence_budget_desc: "정규군에서 삭감한 예산을 복원하고 그 비용을 국가방위군 예산으로 전가합니다. 이는 장교들이 불만을 품은 주된 원인을 해결합니다.\n\n§G-25 불만§!, §R-$25 billion§!, 그리고 방위군이 더 이상 보호받지 못하므로 불만이 절반의 속도로 증가합니다. 한 번만 가능합니다."
 SAU_officers_settle_for_good: "장교들과 합의"
 SAU_officers_settle_for_good_desc: "장교들이 선발한 위원회를 설치하고, 진급 일정을 공표하며, 국왕이 직접 합의를 승인하게 합니다. 모든 미해결 불만이 해소된 후에만 완료할 수 있습니다.\n\n§G위기를 영구히 끝내고 쿠데타를 방지합니다§!. 불만이 §Y0§!이어야 합니다."
 SAU_oil_conserve: "매장량 보존"
 SAU_oil_conserve_desc: "향후 사용을 위해 매장량을 보존하도록 생산량을 줄입니다. 현재 수입은 희생되지만 §G경제의 석유 의존도가 감소하고§! 안정도가 개선됩니다."
 SAU_oil_embargo: "석유 금수 선언"
 SAU_oil_embargo_desc: "§L서방과 이스라엘의 우방들§!, 구체적으로 §L미국, 영국, 프랑스, 독일, 네덜란드§!에 대한 석유 수출을 중단하여 §H1973년§!의 정책을 반복합니다. 이들 국가의 경제는 공급 충격으로 타격을 입는 반면, 사우디아라비아는 아랍 및 무슬림 국가의 지지를 얻습니다.\n\n왕국은 서방 수출 수입을 잃고 워싱턴과의 관계가 손상되지만, §H위신, 단결, 성직자들의 축복§!을 얻습니다."
 SAU_oil_increase_output: "석유 생산량 증대"
 SAU_oil_increase_output_desc: "동부 주의 원유 생산을 늘려 §G더 많은 석유와 즉각적인 수입§!을 얻습니다. 이는 또한 경제가 석유 수출에 §R더 의존하게§! 만듭니다."
 SAU_oil_new_field: "신규 유전 개발"
 SAU_oil_new_field_desc: "룹알할리 사막의 탐사와 신규 유정에 자금을 지원합니다. 이 사업은 대규모 §G석유 매장지§!를 추가하지만 왕국의 석유 의존도를 높입니다."
 SAU_oil_new_field_tt: "§G새 유전이 확인되었습니다§! - 왕국의 한 지역에 §Y+15 석유§!가 나타나며, 비용은 §R$150 billion§!입니다."
 SAU_opec_cut_production: "석유 생산 감축"
 SAU_opec_cut_production_desc: "OPEC의 스윙 프로듀서라는 사우디아라비아의 역할을 이용해 생산량을 줄이고 §G세계 유가를 끌어올려§! 배럴당 수입을 늘립니다. 180일마다 사용 가능."
 SAU_opec_flood_market: "석유 시장 범람"
 SAU_opec_flood_market_desc: "§R세계 유가를 낮출§! 만큼 생산량을 늘립니다. 사우디아라비아는 단기적으로 수입을 잃지만, 경쟁 수출국(§L러시아, 이란, 이라크, 베네수엘라§!)이 더 큰 경제적 손실을 입습니다. 1년에 한 번 사용 가능."
 SAU_operation_decisive_storm: "결정적 폭풍 작전 (아말리야트 아시파트 알하즘)"
 SAU_operation_decisive_storm_desc: "예멘의 후티 장악 지역에 대한 연합 공습 작전인 §Y아말리야트 아시파트 알하즘§!을 개시합니다. 사우디 항공기가 후티 진지를 타격하고 정부군을 보호하며 예멘군에 대한 지속적인 지원을 해금합니다."
 SAU_pal_aid_package: "팔레스타인 지원 패키지"
 SAU_pal_aid_package_desc: "라말라의 팔레스타인 자치정부 급여, 병원, 공공 설비, 재건을 위해 사우디가 분기별 자금을 제공합니다."
 SAU_pal_fund_development: "팔레스타인 개발 지원"
 SAU_pal_fund_development_desc: "팔레스타인 영토 전역의 도로, 학교, 진료소에 자금을 지원하여 생활 여건을 개선하고 실현 가능한 두 국가 해법을 뒷받침합니다."
 SAU_pal_invest_gaza: "가자와 서안 지구 투자"
 SAU_pal_invest_gaza_desc: "가자와 서안 지구의 공장과 인프라에 투자하여 일자리를 창출하고 무장 단체에 대한 지지를 줄입니다."
 SAU_pc_convene: "인민위원회 소집"
 SAU_pc_convene_desc: "의회를 소집하고 의석이 충분한 모든 계파에 법안을 제출할 3주의 시간을 줍니다. 법안이 제출되면 국왕은 이를 비준하거나 거부해야 합니다. 비준은 발의한 계파를 강화하고 거부는 약화시킵니다.\n\n90일마다 반복 가능."
 SAU_pc_convene_tt: "발언권 개방 - §Y21석 이상§!의 계파는 §Y21일§! 이내에 법안을 제출할 수 있습니다."
 SAU_pc_dissolve: "인민위원회 해산"
 SAU_pc_dissolve_desc: "복귀 시기를 정하지 않고 왕명으로 인민위원회를 해산합니다.\n\n§R-10% 안정도, -8% 전쟁 지지도§!, §G+150 정치력§!. 되돌릴 수 없습니다."
 SAU_pc_enact_provincial: "지방 대표 법안 시행"
 SAU_pc_enact_provincial_desc: "주요 상인 집단의 반대에도 불구하고 비준된 사우디인 고용 할당제, 후견 제도 개혁, 독립 감독관 제도를 시행합니다.\n\n§H위상§!은 인민위원회의 대중적 권위를 나타냅니다. 법안이 청취되고 시행되면 §G상승§!하며 거부권 행사, 방치, 법안 기한 만료 후에는 §R하락§!합니다. §Y40§! 미만이면 위원회는 법안을 각 부처를 통해 추진할 수 없습니다."
 SAU_pc_enact_provincial_tt: "§Y300 정치력§!이 필요하며, 위원회가 여전히 법안을 지지하고 있어야 합니다. §H위상§!이 §Y40§! 초과여야 합니다 (현재 §Y100§! 중 §Y[?SAU_pc_standing|0]§!)"
 SAU_pc_enact_reformist: "개혁파 법안 시행"
 SAU_pc_enact_reformist_desc: "각 부처에 관련 규정, 일정, 예산 준비를 맡겨 비준된 개혁파 법안을 시행합니다.\n\n§H위상§!은 인민위원회의 대중적 권위를 나타냅니다. 법안이 청취되고 시행되면 §G상승§!하며 거부권 행사, 방치, 법안 기한 만료 후에는 §R하락§!합니다. §Y40§! 미만이면 위원회는 법안을 각 부처를 통해 추진할 수 없습니다."
 SAU_pc_enact_reformist_tt: "§Y300 정치력§!이 필요하며, 위원회가 여전히 법안을 지지하고 있어야 합니다. §H위상§!이 §Y40§! 초과여야 합니다 (현재 §Y100§! 중 §Y[?SAU_pc_standing|0]§!)"
 SAU_pc_enact_traditionalist: "전통주의자 법안 시행"
 SAU_pc_enact_traditionalist_desc: "담당 부처를 통해 비준된 종교 기금, 주거 수당, 지방 진료소 계획을 시행합니다.\n\n§H위상§!은 인민위원회의 대중적 권위를 나타냅니다. 법안이 청취되고 시행되면 §G상승§!하며 거부권 행사, 방치, 법안 기한 만료 후에는 §R하락§!합니다. §Y40§! 미만이면 위원회는 법안을 각 부처를 통해 추진할 수 없습니다."
 SAU_pc_enact_traditionalist_tt: "§Y300 정치력§!이 필요하며, 위원회가 여전히 법안을 지지하고 있어야 합니다. §H위상§!이 §Y40§! 초과여야 합니다 (현재 §Y100§! 중 §Y[?SAU_pc_standing|0]§!)"
 SAU_pc_public_works: "공공 사업 의뢰"
 SAU_pc_public_works_desc: "위원회가 지방을 선택하고, 정부가 무상 건설 지원 없이 충족해야 하는 민간 공장 §Y[?SAU_pc_req_civ|0]§!개, 사무소 §Y[?SAU_pc_req_off|0]§!개, 인프라 §Y[?SAU_pc_req_inf|0]§!의 기준을 정합니다. 이 기준은 위임을 성공할 때마다 상향됩니다. §H기한은 2년§!입니다. 성공하면 해당 지방이 영구적으로 §G건설 슬롯 +1, 건설 속도 +10%, 인력 +5%§!를 얻으며, 실패하면 §R사업이 폐기되고 민간 공장 하나를 잃습니다§!. §Y필요 조건:§! 위원회 위상이 §G60 이상§!이어야 합니다. 비용: §R-$4 billion§!."
 SAU_pc_readout: "인민위원회: [ROOT.GetSAUPCBloc]"
 SAU_pc_readout_desc: "§H인민위원회§! - [ROOT.GetSAUPCBloc], [ROOT.GetSAUPCStanding] (§Y100§! 중 §Y[?SAU_pc_standing|0]§!)\n§Y개혁파§!: [?SAU_pc_reformists|0]   §Y전통주의자§!: [?SAU_pc_traditionalists|0]   §Y지방 대표§!: [?SAU_pc_provincials|0]\n§H국왕 거부권 행사 횟수§!: §Y[?SAU_pc_vetoes|0]§!\n\n§H위상§!은 대중적 권위를 나타냅니다. 법안이 청취되고 시행되면 §G상승§!하며 거부권 행사, 방치, 법안 기한 만료 후에는 §R하락§!합니다. 법안을 각 부처를 통해 추진하려면 §Y40 이상§!, 공공 사업을 의뢰하려면 §Y60 이상§!을 유지해야 합니다. 이 항목은 정보 제공용이며 결정 효과는 없습니다."
 SAU_pc_session_clock: "위원회가 답을 기다린다"
 SAU_pc_session_clock_desc: "위원회가 소집되었으며, 자격을 갖춘 계파는 회기가 답변 없이 만료되기 전 3주 안에 법안을 제출할 수 있습니다."
 SAU_pc_take_provincial_bill: "지방 대표의 목소리 청취"
 SAU_pc_take_provincial_bill_desc: "지방 계파가 사우디인 고용 할당제를 수립하고, 후견 제도를 개혁하며, 독립 노동 감독관 제도를 창설하는 법안을 제출하도록 허용합니다."
 SAU_pc_take_reformist_bill: "개혁파의 목소리 청취"
 SAU_pc_take_reformist_bill_desc: "젊은 법률가와 귀국한 졸업생들로 이루어진 개혁파 계파가 정부 성과와 제도 개혁에 초점을 맞춘 법안을 제출하도록 허용합니다."
 SAU_pc_take_traditionalist_bill: "전통주의자의 목소리 청취"
 SAU_pc_take_traditionalist_bill_desc: "전통주의 계파가 종교 기금, 주거 수당, 소외 지방의 진료소에 자금을 지원하는 법안을 제출하도록 허용합니다."
 SAU_pc_works_mandate: "위원회 위임: [SAU_pc_works_province.GetName]"
 SAU_pc_works_mandate_desc: "위원회가 [SAU_pc_works_province.GetName]을(를) 선택했으며, 정부는 공표된 개발 기준을 충족할 시간이 2년 있습니다. 건설은 자동으로 제공되지 않습니다.\n\n요구되는 기준은 해당 지방의 민간 공장 §Y[?SAU_pc_req_civ|0]§!개, 사무소 §Y[?SAU_pc_req_off|0]§!개, 인프라 §Y[?SAU_pc_req_inf|0]§!입니다."
 SAU_pipeline_iraq: "유럽 송유관"
 SAU_pipeline_iraq_desc: "사담 제거 이후, 튀르키예 국경을 향하는 송유관의 이라크 구간을 건설합니다. 사우디 석유가 유럽에 도달하려면 앙카라와의 별도 합의가 필요합니다."
 SAU_pipeline_iraq_talks: "바그다드와 협상 개시"
 SAU_pipeline_iraq_talks_desc: "사우드 가문에 대한 적대감에도 불구하고 사담 정부에 이라크를 통과하는 사우디 송유관을 허용해 달라고 요청합니다. 바그다드가 동의할 가능성은 낮습니다."
 SAU_pipeline_sabotage_category: "사우디 송유관 사보타주"
 SAU_pipeline_syria_assad: "레반트 송유관 협상"
 SAU_pipeline_syria_assad_desc: "요르단을 통한 통과권을 확보한 뒤, 적대적인 아사드 정부와 시리아를 거쳐 지중해로 가는 송유관을 협상합니다. 다마스쿠스는 그 대가로 상당한 통과료와 정치적 양보를 요구할 것입니다."
 SAU_pipeline_syria_fsa: "레반트 송유관 (자유 시리아)"
 SAU_pipeline_syria_fsa_desc: "요르단을 통한 통과권을 확보한 뒤, 우호적인 시리아 정부에 사우디의 투자를 제안하고 그 대가로 지중해로 가는 송유관 경로를 얻습니다."
 SAU_pipeline_turkey_extend: "송유관을 튀르키예까지 연장"
 SAU_pipeline_turkey_extend_desc: "앙카라와 협상하여 이라크 송유관을 튀르키예까지 연장하고 사우디 석유를 유럽 시장에 직접 연결합니다."
 SAU_pipeline_yemen: "아라비아해 송유관"
 SAU_pipeline_yemen_desc: "우호적인 예멘 남부와 알마흐라를 거쳐 아라비아해로 가는 송유관을 건설합니다. 예멘 전쟁이 계속되는 동안 이 노선은 교란에 취약합니다."
 SAU_proj_alula: "알울라 건설"
 SAU_proj_alula_desc: "알울라의 고대 나바테아 무덤과 오아시스를 대표적인 문화유산 관광지로 개발합니다. §Y(비용: $50 billion, 건설 약 450일)§! §R기한: [?SAU_remain_alula|0]일 남음.§! §H건설 중에는 민간 공장 5개가 묶입니다.§!"
 SAU_proj_amaala: "아말라 건설"
 SAU_proj_amaala_desc: "홍해 북서부 연안의 웰니스 및 초호화 관광 단지로, '중동의 리비에라'입니다. §Y(비용: $50 billion, 건설 약 450일)§! §R기한: [?SAU_remain_amaala|0]일 남음.§! §H건설 중에는 민간 공장 5개가 묶입니다.§!"
 SAU_proj_diriyah: "디리야 건설"
 SAU_proj_diriyah_desc: "왕국의 발상지를 투라이프의 흙벽돌 도시를 중심으로 한 유산 및 문화 지구로 복원합니다. §Y(비용: $50 billion, 건설 약 450일)§! §R기한: [?SAU_remain_diriyah|0]일 남음.§! §H건설 중에는 민간 공장 5개가 묶입니다.§!"
 SAU_proj_green_riyadh: "그린 리야드 건설"
 SAU_proj_green_riyadh_desc: "수도 전역에 수백만 그루의 나무를 심어 도시를 식히고 사막의 삭막함을 누그러뜨리는 프로그램입니다. §Y(비용: $30 billion, 건설 약 365일)§! §R기한: [?SAU_remain_green_riyadh|0]일 남음.§! §H건설 중에는 민간 공장 4개가 묶입니다.§!"
 SAU_proj_jeddah_central: "제다 센트럴 건설"
 SAU_proj_jeddah_central_desc: "제다의 해안가를 경기장, 마리나, 문화 지구를 갖춘 현대적 도심으로 재개발합니다. §Y(비용: $60 billion, 건설 약 450일)§! §R기한: [?SAU_remain_jeddah_central|0]일 남음.§! §H건설 중에는 민간 공장 6개가 묶입니다.§!"
 SAU_proj_king_salman_park: "살만 국왕 공원 건설"
 SAU_proj_king_salman_park_desc: "리야드에 세계 최대급 도시 공원 중 하나를 조성합니다. §Y(비용: $40 billion, 건설 약 270일)§! §R기한: [?SAU_remain_king_salman_park|0]일 남음.§! §H건설 중에는 민간 공장 4개가 묶입니다.§!"
 SAU_proj_neom: "네옴 건설"
 SAU_proj_neom_desc: "네옴을 홍해 연안의 탈석유 시대를 대표하는 도시 및 산업 지역으로 개발합니다. §Y(비용: $150 billion, 건설 약 730일)§! §R기한: [?SAU_remain_neom|0]일 남음.§! §H건설 중에는 민간 공장 10개가 묶입니다.§!"
 SAU_proj_new_murabba: "뉴 무라바 건설"
 SAU_proj_new_murabba_desc: "엠파이어 스테이트 빌딩 스무 채를 담을 만큼 거대한 정육면체 탑 무캅을 중심으로 조성하는 리야드의 새로운 도심입니다. §Y(비용: $100 billion, 건설 약 730일)§! §R기한: [?SAU_remain_new_murabba|0]일 남음.§! §H건설 중에는 민간 공장 10개가 묶입니다.§!"
 SAU_proj_oxagon: "옥사곤 건설"
 SAU_proj_oxagon_desc: "네옴에 청정 에너지 산업을 중심으로 하는 부유식 항만 및 제조 거점을 건설합니다. §Y(비용: $80 billion, 건설 약 540일)§! §R기한: [?SAU_remain_oxagon|0]일 남음.§! §H건설 중에는 민간 공장 8개가 묶입니다.§!"
 SAU_proj_qiddiya: "키디야 건설"
 SAU_proj_qiddiya_desc: "리야드 외곽에 테마파크, 경기장, 모터스포츠 서킷을 갖춘 오락, 스포츠, 문화 메가시티를 조성합니다. §Y(비용: $80 billion, 건설 약 540일)§! §R기한: [?SAU_remain_qiddiya|0]일 남음.§! §H건설 중에는 민간 공장 8개가 묶입니다.§!"
 SAU_proj_red_sea: "홍해 프로젝트 건설"
 SAU_proj_red_sea_desc: "엄격한 환경 기준에 따라 건설되는, 수십 개의 원시 그대로의 섬에 걸친 초호화 관광지입니다. §Y(비용: $80 billion, 건설 약 540일)§! §R기한: [?SAU_remain_red_sea|0]일 남음.§! §H건설 중에는 민간 공장 7개가 묶입니다.§!"
 SAU_proj_roshn: "로쉰 건설"
 SAU_proj_roshn_desc: "수백만 사우디인에게 현대식 주택을 제공하기 위해 통합 커뮤니티 전체를 건설하는 국영 주택 개발 회사입니다. §Y(비용: $60 billion, 건설 약 365일)§! §R기한: [?SAU_remain_roshn|0]일 남음.§! §H건설 중에는 민간 공장 7개가 묶입니다.§!"
 SAU_proj_sindalah: "신달라 건설"
 SAU_proj_sindalah_desc: "신달라를 네옴의 홍해 고급 섬 관광지이자 방문객에게 최초로 개방되는 프로젝트로 개발합니다. §Y(비용: $40 billion, 건설 약 270일)§! §R기한: [?SAU_remain_sindalah|0]일 남음.§! §H건설 중에는 민간 공장 4개가 묶입니다.§!"
 SAU_proj_soudah_peaks: "수다 피크스 건설"
 SAU_proj_soudah_peaks_desc: "아시르의 높은 봉우리에 이 지역의 서늘한 기후와 푸른 풍경을 활용한 산악 관광지를 개발합니다. §Y(비용: $40 billion, 건설 약 450일)§! §R기한: [?SAU_remain_soudah_peaks|0]일 남음.§! §H건설 중에는 민간 공장 5개가 묶입니다.§!"
 SAU_proj_sports_blvd: "스포츠 불바드 건설"
 SAU_proj_sports_blvd_desc: "리야드를 가로지르며 자전거, 달리기, 승마를 즐길 수 있는 135킬로미터의 여가 회랑입니다. §Y(비용: $30 billion, 건설 약 270일)§! §R기한: [?SAU_remain_sports_blvd|0]일 남음.§! §H건설 중에는 민간 공장 4개가 묶입니다.§!"
 SAU_proj_the_line: "더 라인 건설"
 SAU_proj_the_line_desc: "500미터 높이의 두 거울 구조물 사이에 자동차 없는 170킬로미터의 선형 도시 더 라인을 건설합니다. §Y(비용: $200 billion, 건설 약 900일)§! §R기한: [?SAU_remain_the_line|0]일 남음.§! §H건설 중에는 민간 공장 12개가 묶입니다.§!"
 SAU_proj_trojena: "트로예나 건설"
 SAU_proj_trojena_desc: "아라비아 사막에서 야외 스키까지 즐길 수 있는, 네옴 고지대의 연중 산악 리조트입니다. §Y(비용: $60 billion, 건설 약 450일)§! §R기한: [?SAU_remain_trojena|0]일 남음.§! §H건설 중에는 민간 공장 5개가 묶입니다.§!"
 SAU_rally_support: "우리 후보 지지 규합"
 SAU_rally_support_desc: "왕실, 종교 기관, 언론의 후원을 귀하의 왕자 뒤로 결집시킵니다. 성과는 미미할 수도, 견실할 수도, 큰 돌파구가 될 수도 있습니다."
 SAU_repair_pipeline_iraq: "유럽 송유관 확장"
 SAU_repair_pipeline_iraq_desc: "북부 간선 송유관을 한 단계 끌어올립니다. 사보타주로 잃은 부분을 복구하거나, 튀르키예로 더 많은 원유를 보낼 추가 송유 용량을 설치합니다."
 SAU_repair_pipeline_syria: "레반트 송유관 확장"
 SAU_repair_pipeline_syria_desc: "지중해 송유관을 한 단계 끌어올립니다. 사보타주로 잃은 부분을 복구하거나, 암만과 다마스쿠스를 지나는 회랑을 넓힙니다."
 SAU_repair_pipeline_yemen: "아라비아해 송유관 확장"
 SAU_repair_pipeline_yemen_desc: "남부 송유관을 한 단계 끌어올립니다. 사보타주로 잃은 부분을 복구하거나, 호르무즈를 우회해 더 많은 원유를 보낼 추가 용량을 설치합니다."
 SAU_request_f15: "미국에 F-15 요청"
 SAU_request_f15_desc: "F-15 스트라이크 이글을 획득하기 위해 워싱턴과 협상을 시작합니다. 미국이 동의하면 §YF-15 스트라이크 이글§! 중점이 해금됩니다.\n\n§R이는 배타적 선택입니다.§! 가장 먼저 수락한 공급국이 우리 전투기를 확정하며, 나머지 세 프로그램(§Y토네이도 GR4§!, §Y파나비아 토네이도§!, §Y유로파이터 타이푼§!)은 영구히 닫힙니다. 신중히 선택하십시오."
 SAU_request_panavia: "이탈리아에 파나비아 토네이도 요청"
 SAU_request_panavia_desc: "다국적 공격 전투기인 파나비아 토네이도 IDS를 위해 로마에 접근합니다. 이탈리아가 동의하면 §Y파나비아 토네이도§! 중점이 해금됩니다.\n\n§R이는 배타적 선택입니다.§! 가장 먼저 수락한 공급국이 우리 전투기를 확정하며, 나머지 세 프로그램(§YF-15 스트라이크 이글§!, §Y토네이도 GR4§!, §Y유로파이터 타이푼§!)은 영구히 닫힙니다. 신중히 선택하십시오."
 SAU_request_tornado: "영국에 토네이도 GR4 요청"
 SAU_request_tornado_desc: "역사적인 알 야마마 프로그램의 근간이었던 토네이도 GR4 공격기를 위해 런던에 접근합니다. 영국이 동의하면 §Y토네이도 GR4§! 중점이 해금됩니다.\n\n§R이는 배타적 선택입니다.§! 가장 먼저 수락한 공급국이 우리 전투기를 확정하며, 나머지 세 프로그램(§YF-15 스트라이크 이글§!, §Y파나비아 토네이도§!, §Y유로파이터 타이푼§!)은 영구히 닫힙니다. 신중히 선택하십시오."
 SAU_request_typhoon: "유로파이터 타이푼 요청"
 SAU_request_typhoon_desc: "알 살람 프로그램에 따라 유럽 컨소시엄(독일)에 유로파이터 타이푼을 요청합니다. 수출을 승인하면 §Y알 살람: 유로파이터 타이푼§! 중점이 해금됩니다.\n\n§R이는 배타적 선택입니다.§! 가장 먼저 수락한 공급국이 우리 전투기를 확정하며, 나머지 세 프로그램(§YF-15 스트라이크 이글§!, §Y토네이도 GR4§!, §Y파나비아 토네이도§!)은 영구히 닫힙니다. 신중히 선택하십시오."
 SAU_rivalry_back_separatists: "분리주의자 지원"
 SAU_rivalry_back_separatists_desc: "종합정보청이 아흐와즈, 발루치스탄, 쿠르디스탄에 자금과 무기를 흘려보냅니다. 이란의 변방이 동요합니다."
 SAU_rivalry_propaganda_blitz: "반이란 언론 총공세"
 SAU_rivalry_propaganda_blitz_desc: "방송과 모스크를 테헤란을 규탄하는 주장으로 가득 채웁니다."
 SAU_rivalry_strait_patrols: "해협 순찰"
 SAU_rivalry_strait_patrols_desc: "함대가 호르무즈의 좁은 수역에서 계속 훈련하도록 합니다."
 SAU_royal_patronage: "왕실 후원"
 SAU_royal_patronage_desc: "왕실 임명과 계약을 활용하여 왕가 고위 구성원들 사이에서 선택한 후보에 대한 지지를 확보합니다. 각 왕위 계승 경쟁마다 한 번 사용할 수 있습니다.\n\n이미 지지 중인 왕자의 §G위상 +20§!, §Y압둘라 국왕 치하에서 한 번, 살만 국왕 치하에서 한 번§!."
 SAU_royal_patronage_tt: "지지 중인 왕자의 위상 §G+20§!"
 SAU_sabotage_pipeline_iraq: "유럽 송유관 타격"
 SAU_sabotage_pipeline_iraq_desc: "이라크를 거쳐 유럽으로 사우디 석유를 운반하는 송유관을 타격합니다. 송유관을 끊으면 모스크바에 대한 리야드의 도전도 함께 무너집니다."
 SAU_sabotage_pipeline_syria: "레반트 송유관 타격"
 SAU_sabotage_pipeline_syria_desc: "지중해로 뻗는 사우디 송유관을 겨냥합니다. 타격에 성공하면 송유관이 끊기고 왕국은 그 경로를 잃습니다."
 SAU_sabotage_pipeline_yemen: "아라비아해 송유관 타격"
 SAU_sabotage_pipeline_yemen_desc: "예멘 남부를 통과하는 사우디 송유관에 파괴 공작원을 보냅니다. 침투에 성공하면 석유 수송이 멈추고 왕국은 남부 경로를 잃습니다."
 SAU_salman_burden_of_state: "국왕에게 국정 부담 지우기"
 SAU_salman_burden_of_state_desc: "국왕이 평소에는 위임했을 문서, 대표단, 의식을 직접 처리하도록 요구합니다. 늘어난 업무량은 그의 건강 악화를 앞당길 것입니다."
 SAU_salman_cpsa_council: "정치안보위원회 소집"
 SAU_salman_cpsa_council_desc: "기존 안보 위원회들을 왕궁에서 열리는 단일한 정치안보위원회로 대체합니다. 권한 통합으로 주요 결정에 걸리는 시간이 단축됩니다."
 SAU_salman_health_status: "§H국왕의 건강§!: [GetSAUKingHealth]"
 SAU_salman_health_status_desc: "국왕의 상태는 [GetSAUKingHealth](으)로 보고되고 있습니다. 건강이 무너지면 왕세자가 국왕이 됩니다."
 SAU_salman_ksrelief: "KSrelief 활동 동원"
 SAU_salman_ksrelief_desc: "사우디의 공식 후원 아래 KSrelief 구호 호송대, 야전 병원, 식량을 해외로 보냅니다. 이 활동은 인도적 지원을 제공하는 동시에 국내에서 정부에 대한 지지를 높입니다."
 SAU_salman_maneuver: "살만 파벌의 책략"
 SAU_salman_maneuver_desc: "수다이리 블록은 살만의 계승권을 밀어붙이고 있으며, 궁정을 귀하의 후보에게 등돌리게 할 수 있습니다."
 SAU_salman_riyadh_metro_plan: "리야드 대도시권 계획 확대"
 SAU_salman_riyadh_metro_plan_desc: "여섯 개의 지하철 노선과 교통망을 중심으로 조직된 일련의 신규 지구를 통해 리야드를 확장합니다."
 SAU_salman_royal_decrees: "왕실 구조 칙령 발포"
 SAU_salman_royal_decrees_desc: "긴 입법 절차 없이 왕명으로 부처를 통폐합하고 개편합니다."
 SAU_salman_royal_physicians: "왕실 의료진 소집"
 SAU_salman_royal_physicians_desc: "유럽과 미국의 전문의들을 불러 국왕을 치료하고 휴식을 위해 일정을 비웁니다. 일시적으로 상태가 호전되지만 장기적인 악화를 막을 수는 없습니다."
 SAU_salman_spark_park: "살만 국왕 에너지 파크 보조"
 SAU_salman_spark_park_desc: "다맘 인근 30평방킬로미터 규모의 살만 국왕 에너지 파크에 보조금을 지원하여 펌프, 밸브, 시추 장비를 국내에서 생산합니다."
 SAU_shura_convene_session: "위원회 소집"
 SAU_shura_convene_session_desc: "장관들의 출석과 질의 응답을 의무화하여 마즐리스 아슈슈라의 회의를 기록과 함께 개최합니다. 의사록이 공개되어 국왕이 최종 권한을 유지하더라도 공개 토론에 영향을 줄 수 있습니다.\n\n이 결정은 한 번만 실행할 수 있습니다."
 SAU_shura_seat_notables: "유력 인사 임명"
 SAU_shura_seat_notables_desc: "부족 족장들과 제다 및 부라이다의 주요 상인 가문을 위원회에 임명합니다.\n\n60일마다 반복 가능."
 SAU_shura_seat_notables_tt: "§G유력 인사 +10석§!, 울라마와 테크노크라트 §R각 -5석§!\n§G유력 인사 주도§!: §G+8% 정치력, -8% 부패 비용§! / §R+3% 소비재, -3% 전쟁 지지도§!\n§Y70석에 이르면 국왕은 위원회를 영구 헌장으로 확정할 수 있습니다.§!"
 SAU_shura_seat_technocrats: "테크노크라트 임명"
 SAU_shura_seat_technocrats_desc: "해외에서 교육받은 사우디인을 포함한 경제학자, 기술자, 노련한 부처 관료를 위원회에 임명합니다.\n\n60일마다 반복 가능."
 SAU_shura_seat_technocrats_tt: "§G테크노크라트 +10석§!, 울라마와 유력 인사 §R각 -5석§!\n§Y테크노크라트 주도§!: §G+8% 연구, +6% 사무소 산출, +5% 생산성 증가§! / §R-5% 안정도§!\n§Y70석에 이르면 국왕은 위원회를 영구 헌장으로 확정할 수 있습니다.§!"
 SAU_shura_seat_ulema: "울라마 임명"
 SAU_shura_seat_ulema_desc: "고위 종교 학자와 그들이 승인한 후보를 위원회에 임명하여 위원회 활동에 대한 성직자의 영향력을 높입니다.\n\n60일마다 반복 가능."
 SAU_shura_seat_ulema_tt: "§G울라마 +10석§!, 테크노크라트와 유력 인사 §R각 -5석§!\n§O울라마 주도§!: §G+8% 안정도, +10% 표류 방어§! / §R-5% 연구, -5% 이주§!\n§Y70석에 이르면 국왕은 위원회를 영구 헌장으로 확정할 수 있습니다.§!"
 SAU_spread_revolution_category: "혁명 확산"
 SAU_storm_air_campaign: "후티 진지 타격"
 SAU_storm_air_campaign_desc: "후티 운동이 장악한 지역을 선택하여 그곳의 보급창, 비행장, 보급로를 타격합니다. 이 공격은 인근 인프라에도 피해를 입히고 사상자를 낼 것입니다.\n\n대상 지역의 §R인프라, 무기 산업, 방공 시설에 피해를 입히고§! 방어군의 인력을 소모시킵니다. 14일마다 반복 가능."
 SAU_storm_partner_readout: "연합: 파트너 [?SAU_coalition_partners|0]개국"
 SAU_storm_partner_readout_desc: "§H왕국과 함께 출격하는 국가§!: §Y[?SAU_coalition_partners|0]§!\n\n각 연합 구성원은 독자적으로 철수할 수 있습니다."
 SAU_storm_stand_down: "작전 종료"
 SAU_storm_stand_down_desc: "연합 출격을 끝내고 추가 군사 작전 없이 작전을 해체합니다.\n\n§G+4% 안정도§!, §R-3% 전쟁 지지도§!. 작전이 영구히 종료됩니다."
 SAU_undermine_mbn: "무함마드 빈 나이프 흠집 내기"
 SAU_undermine_mbn_desc: "궁정 인맥, 불리한 폭로, 보류된 후원을 이용하여 무함마드 빈 나이프의 지지를 깎아내립니다. 결과는 아무 효과가 없을 수도, 영향력의 큰 손실일 수도 있습니다."
 SAU_undermine_mutaib: "무타입 빈 압둘라 흠집 내기"
 SAU_undermine_mutaib_desc: "궁정 인맥, 불리한 폭로, 보류된 후원을 이용하여 무타입 빈 압둘라의 지지를 깎아내립니다. 결과는 아무 효과가 없을 수도, 영향력의 큰 손실일 수도 있습니다."
 SAU_undermine_salman: "살만 빈 압둘아지즈 흠집 내기"
 SAU_undermine_salman_desc: "궁정 인맥, 불리한 폭로, 보류된 후원을 이용하여 살만 빈 압둘아지즈의 지지를 깎아내립니다. 결과는 아무 효과가 없을 수도, 영향력의 큰 손실일 수도 있습니다."
 SAU_unleash_laf: "레바논군 투입"
 SAU_unleash_laf_desc: "군은 재건되고, 급여를 받으며, 무장했습니다. 이제 리야드는 베이루트에 유일하게 중요한 보답을 요구합니다. 필요하다면 무력으로라도 헤즈볼라를 무장 해제하라는 것입니다."
 SAU_vision2030_category: "비전 2030 프로젝트"
 SAU_west_free_trade: "서방과의 자유 무역"
 SAU_west_free_trade_desc: "NATO 블록 전역에서 관세를 낮추고 무역 협정을 체결합니다. 서방 동맹과의 관계가 따뜻해지며, 개방적인 무역 협정은 그들의 시장을 왕국에 묶어 둡니다."
 SAU_west_joint_training: "미국-사우디 합동 훈련"
 SAU_west_joint_training_desc: "미국 교관과 합동 훈련을 실시하여 사우디의 합동 병과 훈련을 개선하고 군 전체에 경험을 제공합니다."
 SAU_west_petrodollar: "오일 달러 재순환"
 SAU_west_petrodollar_desc: "사우디의 석유 수입이 미국 국채와 미국-사우디 공동 사업에 재투자됩니다. 왕국이 당장 얻는 것은 적지만, 워싱턴은 더 부유해지고 사우드 가문에 더 깊이 관여하게 됩니다."
 SAU_yemen_old_weapons: "잉여 무기 선적"
 SAU_yemen_old_weapons_desc: "군 비축분에서 구형 사우디 보병 무기를 예멘 정부로 보내며, 국내 비용은 최소화합니다."
 SAU_yemen_raise_brigade: "공세 조율"
 SAU_yemen_raise_brigade_desc: "사우디 장교들을 예멘 지휘부에 파견하여 조율된 공세를 계획합니다. 정부군은 후티에 대한 공격에서 지속적인 우위를 얻습니다."
 SAU_yemen_war_funds: "전쟁 수행 자금 지원"
 SAU_yemen_war_funds_desc: "아덴으로 자금을 송금하여 급여를 지급하고, 연료를 구입하며, 정부군 병사들을 조금 더 오래 전선에 유지합니다."
 YEM_drop_south_yemen_name: "예멘의 이름 되찾기"
 YEM_drop_south_yemen_name_desc: "남예멘이라는 정체성을 버리고 다시 단순히 예멘으로서 통치합니다."
 yemen_partition_category: "두 개의 예멘"
 SAU_events.1.a: "알라께서 그의 영혼에 자비를 베푸시기를."
 SAU_events.1.d: "두 성지의 수호자 파드 빈 압둘아지즈 알사우드 국왕이 1995년 뇌졸중 이후 수년간 악화되던 건강 끝에 세상을 떠났습니다. 거의 10년간 사실상 왕국을 통치해 온 압둘라 왕세자가 이제 국왕으로 즉위합니다. 수년간 왕국을 짓눌러 온 왕위 계승 위기가 마침내 해결되었습니다."
 SAU_events.1.t: "파드 국왕의 서거"
 SAU_events.10.a: "OPEC+에 가입한다."
 SAU_events.10.b: "합의를 거부한다."
 SAU_events.10.d: "리야드는 모스크바와 OPEC+ 체제에서 석유 생산량을 조율하여 두 수출국이 세계 유가에 더 큰 영향력을 행사할 것을 제안합니다."
 SAU_events.10.t: "[SAU.GetFlag] OPEC+ 합의 [SOV.GetFlag]"
 SAU_events.100.a: "지역이 숨을 죽이고 있다"
 SAU_events.100.d: "이란이 분리 독립한 아라비아 공화국을 상대로 전쟁을 일으켰으며, 걸프는 시아파 권력의 두 경쟁 중심 사이의 공개 분쟁에 빠져들었습니다."
 SAU_events.100.t: "걸프의 전쟁"
 SAU_events.101.a: "우리는 견뎌낼 것이다"
 SAU_events.101.d: "테헤란은 전쟁 직전에서 멈췄지만 그 분노는 분명합니다. 이란 요원들은 우리 도시에서 소요를 부추기고 있으며 이란 언론은 공화국을 이단 국가로 낙인찍고 있습니다."
 SAU_events.101.t: "테헤란의 분노"
 SAU_events.102.a: "걸프 군주국들과 화해한다"
 SAU_events.102.b: "아랍 민주주의의 대의를 수호한다"
 SAU_events.102.d: "의회가 구성되고 공화국이 자리를 잡으면서, 아라비아가 세계에서 어떤 위치에 설 것인가 하는 문제를 더는 미룰 수 없습니다. 걸프 군주국들과 평화를 맺을 것인가, 아니면 아랍 민주주의의 대의를 이끌 것인가?"
 SAU_events.102.t: "공화국과 지역"
 SAU_events.103.a: "연맹에 가입한다"
 SAU_events.103.b: "독립을 유지한다"
 SAU_events.103.d: "아라비아 공화국이 우리나라를 아랍 민주주의 국가들의 연맹에 초청합니다. 이는 왕이나 성직자가 아닌 국민에게 책임지는 블록입니다."
 SAU_events.103.t: "민주주의 국가들에 대한 부름"
 SAU_events.104.a: "아라비아의 새로운 장"
 SAU_events.104.d: "수십 년에 걸친 절대 군주제가 끝났습니다. 군중이 리야드의 거리를 가득 메운 가운데, 과도국민평의회가 국정의 고삐를 쥐었으며 아라비아가 투표를 통해 스스로의 길을 선택할 수 있을 때까지만 통치할 것을 서약했습니다."
 SAU_events.104.t: "사우드 가문의 몰락"
 SAU_events.107.a: "아랍 아라비아 공화국을 선포한다"
 SAU_events.107.b: "아라비아 공화국을 유지한다"
 SAU_events.107.d: "바트당이 국정의 고삐를 쥐고 있습니다. 아라비아는 아랍 민족의 선봉인 아랍 공화국을 선포해야 합니까, 아니면 아라비아 공화국이라는 소박한 이름을 유지해야 합니까?"
 SAU_events.107.t: "공화국의 이름"
 SAU_events.109.a: "아랍 코민테른에 가입한다"
 SAU_events.109.b: "우리는 홀로 서겠다"
 SAU_events.109.d: "[FROM.GetName]이(가) 우리를 아랍 코민테른에 초청합니다. 이는 혁명의 대의로 결속된 노동자 국가들의 연합입니다. 우리는 동지들과 함께할 수도, 우리의 길을 갈 수도 있습니다."
 SAU_events.109.t: "아랍 코민테른의 부름"
 SAU_events.11.a: "거래를 수락한다."
 SAU_events.11.b: "제안을 거절한다."
 SAU_events.11.d: "리야드는 워싱턴에 상시 거래를 제안합니다. 미국 시장에 사우디 석유를 안정적으로 공급하는 대가로 보다 긴밀한 안보 협력을 맺자는 것입니다. 왕국은 답을 기다리고 있습니다."
 SAU_events.11.t: "[SAU.GetFlag] 안보를 위한 석유"
 SAU_events.110.a: "값비싼 교훈이다."
 SAU_events.110.d: "자유 시리아군이 궤멸했습니다. 우리가 무장시키고 자금을 댄 반군은 흩어지거나 죽었고, 다마스쿠스는 꺾이지 않은 채 서 있습니다. 시리아에 쏟아부은 수년간의 재물과 신뢰는 왕국에 굴욕적인 패배와, 이제 그 어느 때보다 테헤란에 의존하는 정권 외에는 아무것도 가져다주지 못했습니다."
 SAU_events.110.t: "시리아 도박의 붕괴"
 SAU_events.111.a: "휴전을 수락한다"
 SAU_events.111.b: "전쟁은 계속된다"
 SAU_events.111.d: "리야드가 휴전 조건을 제시했습니다. 왕국은 공습 작전을 중단하고 직접적인 적대 행위를 끝내며, 사나 정부가 자신의 전쟁을 스스로 치르도록 놓아둘 것입니다. 제안은 테이블 위에 놓여 있습니다."
 SAU_events.111.t: "사우디의 휴전 제안"
 SAU_events.112.a: "전투의 소강"
 SAU_events.112.d: "사나가 휴전에 동의했습니다. 결정적 폭풍 작전은 축소되고 왕국은 예멘 전선에서 물러납니다. 휴전은 우리가 원하는 동안만 유지될 것입니다."
 SAU_events.112.t: "후티의 수락"
 SAU_events.113.a: "그렇게 하자."
 SAU_events.113.d: "사나가 우리의 조건을 단호히 거부했습니다. 예멘 전쟁은 지루하게 계속되고 있으며, 결정적 폭풍 작전도 이어집니다."
 SAU_events.113.t: "후티의 거부"
 SAU_events.114.a: "그렇다면 싸우겠다"
 SAU_events.114.d: "휴전은 끝났습니다. 자신감을 얻고 재무장한 안사르 알라는 휴전을 파기하고 공격을 재개했습니다. 왕국이 원했든 원하지 않았든 예멘 전쟁이 돌아왔습니다."
 SAU_events.114.t: "후티의 휴전 파기"
 SAU_events.115.a: "그를 국왕으로 선포한다. 그는 충분히 기다렸다."
 SAU_events.115.b: "때가 아니다. 왕세자로 봉직하게 하라."
 SAU_events.115.d_mbn: "질서는 유지됩니다. 무함마드 빈 나이프가 왕세자 자리를 지키며, 그의 지위는 국왕이 확인했고 공개적으로 도전받지 않았습니다. 젊은 쪽은 자신의 부처로 물러났고, 지금으로선 책략에서 밀렸습니다. 왕국은 한숨을 돌립니다."
 SAU_events.115.d_mbs: "끝났습니다. 무함마드 빈 나이프는 직위에서 해임되었고, 카메라 앞에서 자신을 대체한 젊은이의 손에 입을 맞췄습니다. 무함마드 빈 살만이 왕세자가 되었으며, 왕위 계승 서열은 한 세대를 건너뛰었습니다. 고위 왕자들은 아무 말도 하지 않습니다. 침묵 자체가 하나의 대답입니다."
 SAU_events.115.t: "왕세자 지명"
 SAU_events.116.a: "오래도록 통치하시기를."
 SAU_events.116.d_mbn: "살만 국왕이 서거했고, 왕세자는 처음부터 예정되어 있던 대로 즉위합니다. 무함마드 빈 나이프는 보안 기관을 뒷배로 삼고, 왕국을 지탱해 왔다는 평판을 바탕으로 왕좌에 오릅니다."
 SAU_events.116.d_mbs: "살만 국왕이 서거했고, 왕위는 그의 아들에게 넘어갑니다. 무함마드 빈 살만은 대부분의 선대가 아직 장관직을 기다리고 있었을 나이에 왕국을 완전히 통치합니다. 그를 의심했던 이들은 오래전에 퇴역하거나, 체포되거나, 화해했습니다."
 SAU_events.116.t: "리야드의 새 국왕"
 SAU_events.117.a: "본국으로 돌려보낸다."
 SAU_events.117.b: "쓸모 있는 이들은 귀화시킨다."
 SAU_events.117.d: "900만 명의 외국인 노동자가 왕국의 경제를 떠받치고 있습니다. 이들은 관을 묻고, 병원에서 일하며, 트럭을 몰고, 건설 현장을 채웁니다. 그러나 이들은 파이살주의자들이 재건하려는 국민에 속하지 않으며 앞으로도 그럴 것입니다. 위원회는 이들이 철거해야 할 비계인지, 그 위에 세워야 할 기초인지 합의하지 못하고 있습니다."
 SAU_events.117.t: "외국인 노동력 문제"
 SAU_events.118.a: "우리가 만들지 않은 것에서 탈퇴한다."
 SAU_events.118.b: "내부에서 활용한다."
 SAU_events.118.d: "국제연합, 기금, 은행은 왕국의 동의 없이 만들어졌습니다. 탈퇴하면 리야드는 자신이 만들지 않은 기구에서 벗어나겠지만, 목소리를 내는 대신 남에게 이야기되는 처지가 될 것입니다. 위원회는 거리 두기와 영향력 사이에서 선택해야 합니다."
 SAU_events.118.t: "국제 포럼 문제"
 SAU_events.119.a: "전부 본국으로 가져온다."
 SAU_events.119.b: "수익이 나는 곳에 둔다."
 SAU_events.119.d: "수천억 달러가 서방의 국채와 은행에 놓여 있으며 안전하고 수익성이 있지만 외국의 압력에 취약합니다. 부를 본국으로 가져오면 왕국의 발전에 자금을 댈 수 있고, 해외에 두면 수익과 서방 수도에서의 리야드의 영향력이 보존됩니다."
 SAU_events.119.t: "해외 자산 문제"
 SAU_events.12.a: "동반자 관계를 수락한다."
 SAU_events.12.b: "제안을 거절한다."
 SAU_events.12.d: "사우디아라비아가 영국에 장기 동반자 관계를 제안합니다. 석유 수입은 영국 산업과 전문성에 대한 대가로 지급되어 알 야마마 정신을 되살릴 것입니다."
 SAU_events.12.t: "[SAU.GetFlag] 사우디-영국 동반자 관계"
 SAU_events.120.a: "모스크는 의무이지 위임이 아니다."
 SAU_events.120.b: "우리는 신실한 자들을 대변한다."
 SAU_events.120.d: "10억 명이 넘는 무슬림은 단일한 정치적 목소리를 갖고 있지 않습니다. 왕국은 메카와 메디나를 관리하고 있으며, 울라마는 이 신임이 조용히 이행해야 할 의무인지, 아니면 움마를 공개적으로 이끌 위임인지 묻고 있습니다."
 SAU_events.120.t: "세계 움마 문제"
 SAU_events.121.a: "자립의 사명."
 SAU_events.121.b: "무장한 등거리."
 SAU_events.121.d: "두 블록은 각각 왕국이 자신들 것이라고 확신하고, 이를 잃을까 걱정합니다. 리야드는 무장한 채 등거리를 유지하며 양쪽에서 구입하되 어느 쪽에도 속하지 않을 수도 있고, 자체 무기를 만드는 비용을 감수하고 어떤 외국 무기고에도 의존하지 않을 수도 있습니다."
 SAU_events.121.t: "초강대국 관계 문제"
 SAU_events.122.a: "자유롭게 베푸는 자선."
 SAU_events.122.b: "조건 있는 원조."
 SAU_events.122.d: "사우디의 돈은 무슬림 세계의 구석구석에 닿습니다. 모스크, 진료소, 정부, 군대에까지. 파이살은 이를 자선으로 베풀며 서면으로는 아무것도 요구하지 않았습니다. 그의 후계자들은 조건 없는 원조로는 지속적인 영향력을 살 수 없다고 주장합니다. 왕국은 자선과 영향력 사이에서 선택해야 합니다."
 SAU_events.122.t: "주권 원조 문제"
 SAU_events.123.a: "외국 깃발을 내려라. 그들은 돌아간다."
 SAU_events.123.a_tt: "모든 외국 세력이 왕국에 대한 군사적 접근권을 상실합니다"
 SAU_events.123.b: "합의는 유지된다. 원칙이 금하는 것을 필요가 허락한다."
 SAU_events.123.d: "외국 깃발은 여전히 사우디 땅 위에 나부끼고 있으며, 그럴수록 설교에 대한 답변은 더 어려워집니다. 주둔군은 왕국을 이웃으로부터 지켜 주는 동시에 자국 성직자 앞에서 왕국에 굴욕을 안겨 줍니다. 위원회는 결정을 미룰 방법이 바닥났습니다."
 SAU_events.123.t: "외국군 기지 문제"
 SAU_events.124.a: "설교단에서 선포한다."
 SAU_events.124.b: "궁정에서 선포한다."
 SAU_events.124.d: "1964년 파이살이 형에게서 왕위를 넘겨받았을 때, 그는 손에 파트와를 쥐고 있었고 각료회의도 이미 그의 아래에서 개편되어 있었습니다. 모스크와 정부 기구가 같은 주에 움직였습니다. 사우드는 왕국을 파산 직전까지 몰고 갔고, 파이살은 아무도 요청하지 않은 긴축과 아무도 투표하지 않은 10개 항 프로그램으로 대응했습니다.\n\n이 프로그램은 되살아날 것입니다. 남은 문제는 누구의 이름으로 되살리느냐뿐입니다. 성직자들은 자신들과 함께 통치한 왕을 기억하고, 각 부처는 국가를 직접 운영한 왕을 기억합니다."
 SAU_events.124.t: "파이살주의의 부활"
 SAU_events.125.a: "그들의 칙허를 사들인다."
 SAU_events.125.b: "완전히 교체한다."
 SAU_events.125.d: "압둘아지즈는 혼인과 연금으로 반도를 하나로 묶었고, 아들들에게 사실상 자기 영지나 다름없는 지방을 통치하도록 남겼습니다. 파이살은 11년 동안 이 체제에서 부처들을 떼어 내는 데 매달렸지만 완전히 끝내지는 못했습니다.\n\n칙허는 국고가 체감할 만한 값을 치르고 되살 수도 있고, 그냥 철회할 수도 있습니다. 철회가 더 저렴하지만, 이를 단행한 국왕보다 오래 살아남을 적을 왕가 안에 만듭니다."
 SAU_events.125.t: "지방 토후국의 중앙집권화"
 SAU_events.126.a: "법원을 맡긴다."
 SAU_events.126.b: "학교를 맡긴다."
 SAU_events.126.d: "파이살은 학자들을 곁에 두고 통치했으며 그 대가를 할부로 치렀습니다. 1965년 그가 왕국에 텔레비전을 들여왔을 때, 그의 조카가 리야드의 방송국을 공격하다 숨졌고, 10년 뒤 그 조카의 형이 마즐리스에 걸어 들어와 국왕을 쏘아 죽였습니다. 울라마와의 동맹은 결코 장식이 아니었고 공짜도 아니었습니다.\n\n이제 그들에게 무엇을 돌려주느냐가 이 왕국이 어떤 왕국인지를 결정합니다. 법원은 그들을 법의 중재자로 만들 것입니다. 학교는 그들을 다음 세대의 저자로 만들 것입니다."
 SAU_events.126.t: "울라마의 권한 확대"
 SAU_events.127.a: "추방한다."
 SAU_events.127.b: "재교육한다."
 SAU_events.127.d: "그 아이러니를 모르는 이는 없습니다. 파이살은 직접 기술 관료 집단을 키웠고, 사우디인들을 카이로, 런던, 캘리포니아로 보냈으며 귀국하면 각 부처를 맡겼습니다. 자키 야마니는 하버드 학위를 주머니에 넣고 석유 부처를 운영했으며, 왕국이 국내에서 길러낼 수 있었던 어떤 인물보다 잘 해냈습니다.\n\n그러나 그들은 자격증 이상의 것을 가지고 돌아왔고, 위원회는 이제 해법이 공항인지 교실인지를 두고 논쟁합니다."
 SAU_events.127.t: "서구화된 엘리트 숙청"
 SAU_events.128.a: "시험으로 임용한다."
 SAU_events.128.b: "충성으로 임용한다."
 SAU_events.128.d: "파이살 이전에는 인력을 채울 국가라고 할 만한 것조차 거의 없었습니다. 왕국의 재정은 국왕의 사적 가계와 소수의 신뢰받는 상인을 통해 운영되었고, 국고와 왕실 지갑의 구별은 견해의 문제였습니다. 그는 측근들이 있던 자리에 부처를 세웠습니다.\n\n새 관료제가 실제로 무엇을 위한 것인지는 결코 정해진 적이 없습니다. 시험으로 뽑은 관료는 유능하겠지만 고마워하지 않을 것입니다. 충성으로 뽑은 관료는 둘 다 아닐 것입니다."
 SAU_events.128.t: "주권 공무원 제도"
 SAU_events.129.a: "대규모로 순찰하게 한다."
 SAU_events.129.b: "자문 역할에 머물게 한다."
 SAU_events.129.d: "권선징악위원회는 국가가 예산, 제복, 지휘 계통을 주기 전까지는 흩어진 지역 단속원에 불과했습니다. 파이살은 성직자들이 텔레비전, 여학교, 다란 거리를 걸어 다니는 외국인 기술자들과 화해하도록 만들어야 했고, 위원회는 그가 치른 대가의 일부였습니다.\n\n그것은 한 번도 완전한 경찰이었던 적이 없지만, 그렇다고 경찰이 아니었던 적도 없습니다."
 SAU_events.129.t: "권선징악위원회의 귀환"
 SAU_events.13.a: "투자 협정을 수락한다."
 SAU_events.13.d: "과거의 의심을 접어 두고, 리야드는 파리에 포괄적인 투자 협정을 제안합니다. 프랑스 산업을 위한 사우디 자본, 왕국을 위한 프랑스의 전문성입니다. 양국 정부 모두 이익을 얻을 수 있습니다."
 SAU_events.13.t: "[SAU.GetFlag] 프랑스-사우디 투자 협정"
 SAU_events.130.a: "위성을 교란한다."
 SAU_events.130.b: "방송망을 사들인다."
 SAU_events.130.d: "파이살의 첫 미디어 전쟁은 사우디 병영에 송출하며 사우디 병사들에게 국왕이 미국의 하수인이라고 말하던 나세르의 '아랍의 소리'를 상대로 한 것이었습니다. 리야드는 자체 송신기와, 베이루트와 카이로의 편집자들에게 조용히 건넨 막대한 자금으로 응수했습니다.\n\n교훈은 통했습니다. 방송과는 논쟁할 수 없고, 교란하거나 사들일 수만 있습니다."
 SAU_events.130.t: "외국 미디어 금지"
 SAU_events.131.a: "유력 인사를 임명한다."
 SAU_events.131.b: "구성원을 넓힌다."
 SAU_events.131.d: "1962년의 10개 항 프로그램은 왕국에 자문 위원회를 약속했습니다. 파이살은 13년을 더 통치했지만 한 번도 소집하지 않았고, 마침내 1992년 파드가 이를 구성했습니다. 30년이나 늦었고, 선출이 아닌 임명이었습니다.\n\n약속은 다시 이루어지고 있으며, 논쟁의 전부는 구성에 있습니다. 유력 인사들은 이를 궁정으로 만들 것입니다. 더 넓은 구성은 궁정이 완전히 예측할 수 없는 무언가로 만들 것입니다."
 SAU_events.131.t: "마즐리스 아슈슈라 개편"
 SAU_events.132.a: "기술 학교."
 SAU_events.132.b: "군사 아카데미."
 SAU_events.132.d: "호황은 다른 이들의 손으로 이루어졌습니다. 예멘 노동자, 이집트 교사, 팔레스타인 사무원, 그리고 시간이 지나 100만 명이 넘는 남아시아인들. 파이살의 대답은 반도가 일찍이 시도해 본 적 없는 규모의 교육이었습니다. 1967년 압둘아지즈 국왕 대학이 문을 열었고, 장학 프로그램은 수천 명을 해외로 보냈으며, 왕국은 스스로의 중산층을 만들어 내기 시작했습니다.\n\n그 계층을 무엇을 위해 만들어 내는가가 위원회 앞에 놓인 결정입니다."
 SAU_events.132.t: "국가 간부 육성 구상"
 SAU_events.133.a: "완전히 봉쇄한다."
 SAU_events.133.b: "필요한 이들만 받아들인다."
 SAU_events.133.d: "1970년대에 이르러 외국인 노동력은 국경 안 전체 인구의 약 3분의 1에 육박했고, 불을 밝혀 두는 일의 대부분을 해내고 있었습니다. 파이살은 노동력을 취하되 그에 딸려 오는 정치를 걱정했습니다. 팔레스타인인은 대의를, 예멘인은 숫자를, 이집트인은 나세르를 데려왔습니다.\n\n국경을 봉쇄하면 국가는 자기 자신을 되찾지만, 각 부처에는 아무 대책도 없는 노동력 부족이 떠안겨집니다."
 SAU_events.133.t: "닫힌 국경"
 SAU_events.134.a: "해안을 요새화한다."
 SAU_events.134.b: "내륙을 요새화한다."
 SAU_events.134.d: "파이살의 왕국은 사라지기를 바라는 이들에게 둘러싸여 있었습니다. 홍해 건너 나세르의 이집트, 사나의 공화파, 바그다드와 다마스쿠스의 바트당, 그리고 사우드 가문을 매장을 기다리는 유물로 치부한 소련. 그는 쿠데타에 대비해 국가방위군을 키웠고 침공에 대비해 미국 항공기를 사들였으며, 어느 쪽이 먼저 올지 끝내 확신하지 못했습니다.\n\n이제 왕국은 실제로 어떤 위협에 대비할지 결정해야 합니다."
 SAU_events.134.t: "요새 왕국"
 SAU_events.135.a: "메카에서 소집한다."
 SAU_events.135.b: "해외에서 소집한다."
 SAU_events.135.d: "1969년 8월 알아크사가 불탔을 때, 파이살은 몇 주 만에 무슬림 세계의 지도자들을 라바트에 모았고, 이슬람회의기구는 그해가 가기 전에 출범했습니다. 이는 나세르의 아랍 연맹에 대한 대답이었습니다. 아랍적이고 세속적인 것이 아니라 무슬림적이고 메카에서 이끄는 기구였습니다.\n\n왕국이 신실한 자들을 어디서 소집하느냐가 그 자체로 하나의 선언입니다. 성지는 해외 어떤 회의장도 빌려줄 수 없는 정통성을 부여합니다."
 SAU_events.135.t: "이슬람 연대 회의"
 SAU_events.136.a: "금수를 공개적으로 위협한다."
 SAU_events.136.b: "조용히 시행한다."
 SAU_events.136.d: "1973년 10월 17일, 파이살은 생산을 줄이고 미국에 대한 밸브를 잠갔습니다. 배럴당 가격은 한 시즌 안에 3달러에서 12달러 가까이로 뛰었고, 서방은 자신들의 안락함이 정확히 얼마의 값어치인지 깨달았으며, 왕국은 한 번도 쏠 생각을 하지 못했던 무기를 쥐고 있음을 깨달았습니다.\n\n그 이후로는 쏜 적이 없습니다. 부처는 그동안 내내 수치를 최신 상태로 유지해 왔습니다."
 SAU_events.136.t: "'73년의 정신"
 SAU_events.137.a: "무기가 먼저다."
 SAU_events.137.b: "다른 모든 것이 먼저다."
 SAU_events.137.d: "왕국은 석유를 퍼 올려 해외에 팔고, 필요한 모든 것을 다시 사들입니다. 석유가 흐르는 관마저도 그렇습니다. 파이살의 5개년 계획은 이 순환을 끊기 위한 것이었고, 석유를 더 빨리 옮기는 것들을 만드는 데는 대체로 성공했습니다.\n\n대체는 어딘가에서 시작해야 하며, 어디서 시작하느냐가 왕국이 누구의 허락도 구하지 않고 무엇을 할 수 있는지를 결정합니다."
 SAU_events.137.t: "외국 의존 근절"
 SAU_events.138.a: "자금을 댄다."
 SAU_events.138.b: "인력을 채운다."
 SAU_events.138.d: "파이살은 1962년 메카에서 무슬림 세계 연맹을 창설했고, 7년 뒤 이슬람회의기구를 탄생시켰습니다. 둘 다 사우디의 돈이 닿는 곳에 자리 잡았고, 둘 다 왕을 위한 자리가 없는 범아랍주의에 대응하기 위해 만들어졌습니다.\n\n그의 후계자들은 비용을 계속 대면서 점차 의제 작성을 멈췄습니다. 돈은 존중을 사고, 관료는 통제권을 삽니다. 둘은 같지 않습니다."
 SAU_events.138.t: "OIC 주도권 회복"
 SAU_events.139.a: "엄격한 할당제."
 SAU_events.139.b: "단계적 할당제."
 SAU_events.139.d: "아람코는 사우디산이 있는 곳에서는 사우디산을 사야 했고, 없는 곳에서는 왕국이 외국 기업에 비용을 치르고 그것을 만들 공장을 짓게 했습니다. 느리고 비쌌지만, 자기 드릴 날을 수입하는 나라가 그 습관을 끊을 수 있는 유일한 방법입니다.\n\n하한선을 얼마나 단단히 정하느냐가 각 부처가 이를 준수할지, 아니면 면제 신청서를 내는 법만 익힐지를 결정합니다."
 SAU_events.139.t: "국내 공급 할당제"
 SAU_events.14.a: "투자를 수락한다."
 SAU_events.14.b: "제안을 거절한다."
 SAU_events.14.d: "사우디아라비아가 더 깊은 경제적 유대를 대가로 우리 산업에 투자하겠다고 제안합니다. 수락하면 새로운 공장과 사우디의 영향력이 들어올 것입니다."
 SAU_events.14.t: "[SAU.GetFlag] NATO 국가에 대한 투자"
 SAU_events.140.a: "그가 파이살을 따르게 하자. 방위군이 뒷받침할 것이다."
 SAU_events.140.b: "파이살의 왕국은 파이살과 함께 죽었다. 안식하게 두자."
 SAU_events.140.d: "파드는 묻혔고, 압둘라는 10년간 남의 이름으로 통치한 끝에 마침내 자기 권리로 국왕이 되었습니다. 왕위 계승은 열려 있고, 왕자들은 이미 셈을 시작했습니다.\n\n국왕의 아들이 그에게 계승권이 아닌 논거를 가지고 찾아옵니다. 무타입은 국가방위군을 지휘합니다. 부족 징집병, 내륙 출신 병사들, 바로 정규군을 왕좌 가까이 두어서는 안 된다는 이유로 조직된 병력입니다. 그는 파이살을 읽어 왔습니다. 긴축, 자립, 움마를 대변하며 어떤 일로도 워싱턴의 허락을 구하지 않던 왕국을. 그런 식으로 통치한 삼촌은 친조카의 손에 사살되었고, 이 자리의 모든 이가 그것을 압니다.\n\n파이살의 프로그램에는 후계자가 없습니다. 무타입은 그 후계자가 되겠다고 청합니다."
 SAU_events.140.t: "파이살주의의 부활"
 SAU_events.141.a: "시장이 스스로 바닥을 찾게 둔다."
 SAU_events.141.b: "국가가 사들인다. 이것이 정치 문제가 되게 둘 수는 없다."
 SAU_events.141.d: "2월 25일, 타다울 전체 주가지수는 20,634로 마감한 뒤 더 이상 오르지 못했습니다. 그 이후 하락은 멈추지 않고 있습니다.\n\n이것은 은행과 기관의 폭락이 아닙니다. 왕국 성인 인구의 거의 절반이 그 시장에 있었습니다. 교사, 운전기사, 군인, 공무원들. 그중 다수는 어떤 수익으로도 정당화될 수 없는 가격에 빌린 돈으로 주식을 샀습니다. 쇼핑센터에 중개소가 열렸습니다. 여성들은 분리된 방에서 거래했습니다. 2년 동안 그것은 국민적 오락이었습니다.\n\n지수가 바닥을 찾을 무렵이면 가치의 3분의 2 가까이를 잃을 것이고, 수천억 리얄에 달하는 가계 저축도 함께 사라질 것입니다. 자본시장청은 설립된 지 3년밖에 되지 않았고 이런 일은 본 적이 없습니다. 위원회는 국가가 떨어지는 칼날을 잡을지, 아니면 시장이 가르치고 있는 교훈을 그대로 가르치게 둘지 결정해야 합니다."
 SAU_events.141.t: "검은 2월"
 SAU_events.142.a: "생산을 줄인다. 가격을 방어한다."
 SAU_events.142.b: "산출량을 유지한다. 비용이 큰 생산국들이 먼저 무너지게 한다."
 SAU_events.142.d: "배럴당 가격은 하락하고 있으며 멈출 기미가 보이지 않습니다. 예산은 더 이상 성립하지 않는 가정 위에 작성되었고, 모든 부처는 자신의 사업 중 무엇이 감당 가능했고 무엇이 단지 자금이 배정되었을 뿐인지 곧 알게 될 것입니다. \n리야드는 전에도 이런 일을 겪었습니다. 1980년대 초 가격을 지탱하기 위해 자체 생산을 줄였고, 다른 모든 생산국이 그 빈틈에 조용히 물량을 파는 것을 지켜보았으며, 사우디의 산출량이 약 4분의 3이나 감소했는데도 가격은 어쨌든 붕괴했습니다. 그 교훈은 비쌌고 지금도 부처에서 논쟁거리입니다.\n왕국은 지구상에서 가장 저렴한 원유를 보유하고 있습니다. 그것이 왕국의 유일한 실질적 이점이며, 모두를 위해 가격을 지키는 데 쓸 수도 있고, 이 가격에는 팔 수 없는 생산국들보다 더 오래 버티는 데 쓸 수도 있습니다."
 SAU_events.142.t: "유가 붕괴"
 SAU_events.143.a: "비싼 교실에서 얻은 혹독한 교훈."
 SAU_events.143.d: "사우디 증권거래소는 몇 달 만에 가치의 대부분을 잃었고, 수천억 리얄의 가계 자산이 사라졌습니다. 이 정도 규모의 시장으로서는 이례적으로, 손실이 기관이 아닌 평범한 사우디인들에게 거의 전적으로 떨어졌습니다. 정점에서 주식을 산, 대부분 신용으로 산 교사, 운전기사, 공무원들입니다. 해외 분석가들은 세계 최대의 석유 수출국이 자신들에게 개인 투자자 계층도 있다는 사실을 이제 막 알게 되었으며, 이들을 어떻게 해야 할지 전혀 모른다고 지적합니다."
 SAU_events.143.t: "리야드: 타다울 붕괴"
 SAU_events.144.a: "배럴이 결정한다, 늘 그랬듯이."
 SAU_events.144.d: "원유 가격은 분석가들이 그어 둔 모든 바닥을 뚫고 떨어졌습니다. 수출국들은 이제 명백히 무가치해진 가정 위에 균형을 맞춘 예산을 다시 쓰고 있으며, 수입국들은 너무 크게 기뻐하지 않으려 조심하며 횡재를 누립니다. 모든 시선이 리야드로 쏠려 있습니다. 리야드는 지구상에서 가장 저렴한 원유를 가졌고, 따라서 유일하게 중요한 결정을 쥐고 있습니다. 생산을 줄여 모두를 위해 가격을 지탱할 것인가, 계속 퍼 올려 누가 먼저 무너지는지 지켜볼 것인가."
 SAU_events.144.t: "유가 붕괴"
 SAU_events.145.a: "방위군을 보호한다. 우리를 지키는 것은 방위군이다."
 SAU_events.145.b: "두 군이 똑같이 부담한다."
 SAU_events.145.d: "보유고는 줄어들고 예산은 맞춰지지 않습니다. 보조금이 먼저 사라졌고, 다음은 자본 사업이었으며, 이제 재무부가 국방 항목에까지 손을 뻗었습니다.\n\n문제는 왕국에 군대가 하나가 아니라는 점입니다. 국방부 소속의 정규군이 있고, 내륙의 충성스러운 부족에서 모집되어 리야드와 유전 지대 주변에 주둔하며 왕좌에 직접 답하는 국가방위군이 있습니다. 방위군은 압둘아지즈의 아들들이 군을 신뢰하지 않았기 때문에 존재하며, 그 이후로 줄곧 그에 걸맞은 대우를 받아 왔습니다.\n\n삭감은 양쪽에 적용할 수도 있고, 방위군은 보호하고 정규군 장교들에게는 알아서 버티라고 할 수도 있습니다. 둘 중 하나는 올해 왕좌를 안전하게 지킵니다. 다른 하나는 10년 뒤에도 안전하게 지킵니다.\n\n§H장교단§!: [ROOT.GetSAUArmyGrievance] (§Y100§! 중 §Y[?SAU_army_grievance|0]§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.145.t: "불평등한 삭감"
 SAU_events.146.a: "방위군을 투입한다. 거리를 정리하라."
 SAU_events.146.b: "아무도 투입하지 않는다. 돈을 찾아 평화를 사라."
 SAU_events.146.d: "긴축이 거리에 닿았습니다. 카티프와 담맘에 군중이 모였고, 리야드에도 부처들이 군중이 아니라고 우기는 작은 무리가 있습니다.\n\n국가방위군은 이를 위한 도구입니다. 언제나 그랬고, 그것이 방위군의 존재 이유이며, 방위군은 준비되었고 자금이 있으며 기꺼이 나설 것입니다. 정규 장교단은 요청받지 못했고, 누가 요청받는지 매우 주의 깊게 지켜보고 있습니다.\n\n국방부의 모든 대령은 자신들의 부대가 급여도 못 받은 채 병영에 앉아 있는데 방위군이 투입된다면 그것이 무엇을 뜻하는지 이해합니다. 왕좌가 어느 군을 신뢰하는지를 공개적으로, 영구히 결정했다는 뜻입니다.\n\n§H장교단§!: [ROOT.GetSAUArmyGrievance] (§Y100§! 중 §Y[?SAU_army_grievance|0]§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.146.t: "투입 명령"
 SAU_events.147.a: "리야드로 진격한다. 방위군이 반응할 시간은 없을 것이다."
 SAU_events.147.b: "이것은 안 된다. 우리는 군인이지 정치인이 아니다."
 SAU_events.147.d: "결정이 났습니다. 방위군은 급여를 받고 신뢰받으며, 군은 어느 쪽도 아닙니다. 항공기를 몰고, 기갑을 지휘하며, 국경을 지키는 이들은 아무도 대놓고 말하지 않았지만 자기 나라에서 둘째 군대라는 것을 알게 되었습니다.\n\n다음에 일어날 일에는 선례가 있습니다. 1969년 공군과 육군 장교들, 즉 나세르주의자이자 히자즈 출신으로 한 가문의 통치에 지친 이들의 음모는 정보 보고 하나 차이로 파이살을 전복할 뻔했습니다. 수백 명이 체포되었습니다. 왕국은 정규군을 신뢰할 수 없다는 교훈을 얻었고, 방위군을 더 높이 세웠으며, 장교들이 애초에 왜 그것을 원했는지는 끝내 묻지 않았습니다.\n\n참모들은 몇 주째 회합을 가져 왔습니다. 더 이상 예산을 논의하고 있지 않습니다.\n\n§H장교단§!: [ROOT.GetSAUArmyGrievance] (§Y100§! 중 §Y[?SAU_army_grievance|0]§!)\n[ROOT.GetSAUArmyGrievanceEffect]"
 SAU_events.147.t: "장교들의 결단"
 SAU_events.148.a: "왕국에 새 정부가 들어섰다."
 SAU_events.148.d: "사우디 정규군 부대가 동트기 전에 리야드에 진입하여 각 부처, 방송 당국, 왕궁으로 이어지는 진입로를 장악했습니다. 국가방위군 병영은 같은 시각에 포위되었으며 저항하지 않았습니다. 최고군사위원회는 공공 질서를 회복하고 있으며 왕좌의 헌법적 지위는 변함이 없다고 발표했습니다. 관측통들은 이 표현이 여러 가지로 해석될 수 있다고 지적합니다.\n\n아람코는 라스타누라에서 정상적으로 선적이 이루어지고 있다고 보고합니다. 석유 시장이 읽고 있는 것은 이 전문 전체에서 그 한 문장뿐입니다."
 SAU_events.148.t: "리야드: 거리의 기갑 부대"
 SAU_events.149.a: "아랍 사회주의 공화국을 선포한다."
 SAU_events.149.b: "이슬람 공화국을 선포한다."
 SAU_events.149.c: "입헌 공화국을 선포한다."
 SAU_events.149.d: "왕좌는 끝났습니다. 위원회는 각 부처, 방송 당국, 리야드 모든 궁전으로 가는 진입로를 장악했으며, 모든 군사정권이 깨닫는 사실을 알게 되었습니다. 나라를 장악하는 데는 하룻밤이면 되지만, 통치하려면 이름이 필요하다는 것입니다.\n공화국이 선포되어야 하고, 공화국은 무언가로서 선포되어야 합니다. 방 안의 장교들은 그것이 무엇인지에 합의하지 못합니다. 일부는 이라크인, 시리아인과 함께 복무하고 돌아와 바트당을 동경합니다. 하나의 아랍 민족, 하나의 정당, 그 척추로서의 군대. 다른 이들은 동쪽의 카티프와 동부 주를 가리키며, 왕국이 억눌러 온 유일한 대중 지지 기반이야말로 공화국을 어깨에 짊어질 수 있는 세력이라고 주장합니다. 해외로 유학을 다녀온 젊은 파벌은 헌법과 의회, 그리고 공화국이라는 말이 다른 모든 곳에서 의미하는 바를 그대로 의미하기를 원합니다. 그리고 나머지보다 조용한 소수는 한때 마바히스가 체포했을 법한 것들을 읽어 왔습니다.\n오늘 밤 무엇이 발표되든 사우디 국민의 이름으로 발표될 것이며, 그들 중 누구에게도 묻지 않았습니다."
 SAU_events.149.e: "인민공화국을 선포한다."
 SAU_events.149.t: "알주므후리야"
 SAU_events.15.a: "해군 협력을 수락한다."
 SAU_events.15.b: "제안을 거절한다."
 SAU_events.15.d: "리야드가 마드리드에 해군 제안을 가지고 접근합니다. 스페인 조선소가 사우디 왕립 해군을 위해 함정을 건조하고, 사우디의 자금이 스페인 산업으로 흘러가는 방식입니다."
 SAU_events.15.t: "[SAU.GetFlag] 사우디-스페인 동반자 관계"
 SAU_events.150.a: "흡수한다. 그들에게 우리 제복을 입히면 된다."
 SAU_events.150.b: "방위군을 완전히 해체한다. 집으로 돌려보내라."
 SAU_events.150.c: "우리 지휘 아래 잔존 병력을 유지한다."
 SAU_events.150.d: "압둘아지즈의 아들들이 직업 군인으로 이루어진 군대를 신뢰하지 않았기 때문에 나지드의 부족에서 모집되었고, 어떤 직업 군대도 먼저 이들과 싸우지 않고서는 리야드로 진격할 수 없을 만큼 충분히 무장한 7만 5천 명. 이들은 그날 밤 병영에서 포위되었고 한 발도 쏘지 않았습니다. 이제 위원회는 이들을 어떻게 할지 결정해야 합니다.\n\n이들은 적의 편제가 아닙니다. 그들의 장교는 자신들에게 총구를 겨눈 이들의 사촌이자 이웃이며, 병사 한 명 한 명이 국가에 대한 주장을 지닌 부족에 속해 있습니다. 해체하면 위원회는 막대한 돈을 아끼지만 내륙에 수많은 적을 만듭니다. 흡수하면 인력이 두 배가 되지만, 지난주까지 명시적으로 다른 누군가에게 충성했던 7만 5천 명을 삼키게 됩니다."
 SAU_events.150.t: "해체된 방위군"
 SAU_events.151.a: "그들은 국가에 답하거나 아무에게도 답하지 않는다."
 SAU_events.151.b: "연금을 복원한다. 한 리얄도 빠짐없이."
 SAU_events.151.d: "방위군이 사라지면서 연금도 끊겼습니다. 내륙에서는 이것이 예산 조치로 읽히지 않았습니다. 나지드와 샴마르 부족에게 지급되는 돈은 왕국 자체보다 앞선 것으로, 압둘아지즈가 왕국을 세운 방식 그 자체이며 한 번도 중단된 적이 없습니다.\n\n족장들은 반란을 일으키지 않았습니다. 그들은 단지 응답하지 않을 뿐이며, 이만한 크기의 나라에서 응답하지 않는다는 것은 거의 반란이나 다름없습니다."
 SAU_events.151.t: "부족들의 응답"
 SAU_events.152.a: "체포한다. 전원, 오늘 밤에."
 SAU_events.152.b: "끌어들인다. 위원회를 넓히고 책임을 나눈다."
 SAU_events.152.d: "급여를 주지 못하고, 통치하지 못하고, 스스로를 설명하지 못하는 위원회는 휘하의 대령들이 3인칭으로 논하기 시작하는 위원회입니다. 다시 회합이 열리고 있습니다. 같은 방, 같은 계급, 지난번에 앞서 오갔던 것과 같은 신중한 말투.\n\n리야드를 장악한 이들은 이것이 어떻게 이루어지는지 정확히 압니다. 그들이 직접 했으니까요. 쿠데타로 통치하는 것의 어려움이 바로 그것입니다. 방법을 공개해 버렸다는 점입니다."
 SAU_events.152.t: "장교들의 반전"
 SAU_events.153.a: "교수형당하느니 가난한 편이 낫다."
 SAU_events.153.d: "봉급은 복원되었고, 재판소는 조용히 해체되었으며, 선거가 아니라 임명으로 구성되리라는 것을 모두가 알고 있는 자문 의회의 개최 날짜가 발표되었습니다. 대단한 양보는 아닙니다. 그러나 평의회의 남은 날수를 세고 있던 이들이 더는 소리 내어 세지 않게 되기에는 충분합니다.\n\n국고는 아무도 공표하지 않을 액수만큼 줄었고, 리야드를 장악한 장교들은 자신들이 얻고자 했던 것의 상당 부분을 도로 내어 주었습니다."
 SAU_events.153.t: "자리를 되산 평의회"
 SAU_events.154.a: "그렇다면 전장에서 결판을 내겠다."
 SAU_events.154.d: "90일 동안 평의회는 아무 말도 하지 못했습니다. 하일의 수비대가 오늘 아침 국왕 편에 서겠다고 선언했고, 동부 주가 정오에 뒤를 이었으며, 근위대가 병력을 징발하던 부족 의용군도 더는 다른 척하지 않고 있습니다.\n\n하룻밤 사이에 나라를 장악한 군대가 이제는 그 나라를 지키는 유일한 기관이 되었고, 오로지 무력으로 유지되는 국가에는 누구도 예산에 반영하지 않았던 만큼의 무력이 더 필요하다는 사실을 깨닫고 있습니다."
 SAU_events.154.t: "왕국의 분열"
 SAU_events.155.a: "세계가 동부 주를 주시하고 있다."
 SAU_events.155.d: "최고 군사 평의회에 충성하는 부대와 사우드 가문을 지지한다고 선언한 부대 사이에서 사우디 내륙 전역에 걸쳐 교전이 보고되었습니다. 석유가 있는 동부 주는 분쟁 지역이 되었습니다. 브렌트유는 11달러 오른 채 개장했고 상승을 멈추지 않고 있습니다.\n\n리야드에 대사관을 둔 모든 외무부가 자제를 촉구하는 똑같은 성명을 내고 있으며, 그중 어느 곳이든 어느 편을 이르게가 아닌 늦게 지지하는 모습을 보일지 조용히 가늠하고 있습니다."
 SAU_events.155.t: "리야드: 사우디아라비아 내전"
 SAU_events.156.a: "압둘라를 유지한다. 왕좌는 우리가 치르는 대가만큼의 가치가 있다."
 SAU_events.156.b: "이 체제를 이해하는 국왕을 찾아 달라."
 SAU_events.156.d: "이제 총독직은 평의회가 나누어 줄 권한이 되었고, 이는 평의회가 애써 입에 올리지 않던 문제를 제기합니다. 아직 국왕이 있다는 것입니다.\n\n압둘라는 고령이며, 이 나라가 늘 좋아해 온 개인적 검소함을 지녔고, 평의회가 해산하기 전까지 40년간 국가근위대를 지휘했습니다. 즉 리야드를 장악한 이들은 방금 자신들이 해산시킨 군대의 수장을 유지할지 묻고 있는 셈입니다. 그에게 유리한 점은 왕국 안에서 그의 정통성을 의심하는 이가 아무도 없다는 것이며, 아무도 의심하지 않는 왕좌는 몇 개 사단보다 가치가 있습니다.\n\n불리한 점은 그가 기질상 허수아비가 아니며 단 한 번도 그런 적이 없다는 것입니다. 그를 유지한다는 것은 평의회가 빼앗은 것의 일부를 실질적으로나 공개적으로나 돌려준다는 뜻입니다. 대안은 이 체제가 거꾸로 되어 있음을 이해하는 왕자를 찾는 것입니다."
 SAU_events.156.t: "왕좌의 문제"
 SAU_events.157.a: "살만 빈 압둘아지즈."
 SAU_events.157.b: "무함마드 빈 나이프."
 SAU_events.157.c: "무타입 빈 압둘라."
 SAU_events.157.d: "압둘라 국왕이 왕좌에서 물러났으며, 최고 군사 평의회는 사우드 가문의 원로 왕자들 가운데에서 후계자를 지명해야 합니다.\n\n후보마다 서로 다른 지지 기반을 배후에 두고 있습니다. 수다이리 파벌, 보안기관, 내륙의 부족들, 그리고 가문의 젊은 세대입니다. 평의회의 선택에 따라 왕국의 어느 부분이 새로운 체제를 먼저 인정할지, 그리고 어느 부분을 설득해야 할지가 결정될 것입니다."
 SAU_events.157.e: "무함마드 빈 살만."
 SAU_events.157.t: "더 편리한 국왕"
 SAU_events.158.a: "현역 장교. §H통제력 +5, 정통성 -5§!"
 SAU_events.158.b: "사우드 가문의 왕자. §H통제력 -5, 정통성 +5§!"
 SAU_events.158.c: "지역 유력자. §H통제력 +2, 정통성 +2§!"
 SAU_events.158.d: "자리가 비어 있으며 평의회가 이를 채워야 합니다. 세 명의 이름이 거론되었으며, 각각은 평의회에 서로 다른 이득을 가져다줍니다.\n\n장교는 복종을 받되 원망을 살 것입니다. 왕자는 인정을 받되 무시당할 것입니다. 지역 유력자는 어느 쪽도 아닐 것이며, 그것이 유용한 점이자 동시에 위험한 점입니다."
 SAU_events.158.t: "[SAU_governor_province.GetName] 총독령"
 SAU_events.159.a: "제한적 섭정. 그는 왕좌와 모스크를 유지한다."
 SAU_events.159.b: "전면적 섭정. 예외 없이 모든 권한을 이양한다."
 SAU_events.159.c: "5년간의 섭정. 기한을 명시한다."
 SAU_events.159.d: "문서는 짧습니다. 폐하께서 건강이 좋지 않으시므로 행정권과 국방 업무를 폐하의 이름으로 활동하는 평의회에 위임한다고 기록되어 있으며, 폐하께서 수정할 기회를 얻지 못한 문단 아래에 서명이 담겨 있습니다.\n\n남은 문제는 이 칙령이 실제로 얼마나 많은 것을 가져가느냐입니다. 국왕에게 모스크와 칭호와 의례를 남겨 두는 섭정은 이 나라가 감내할 수 있는 섭정이지만, 아무것도 남기지 않는 섭정은 그저 진실을 글로 옮긴 것에 불과합니다. 법률가들은 묻지도 않았는데, 기한이 있는 칙령이 기한이 없는 칙령보다 서명하기 쉽다고 지적합니다.\n\n정지시킬 헌법은 없습니다. 그것이 언제나 이 왕국의 편의였습니다."
 SAU_events.159.t: "섭정 칙령"
 SAU_events.16.a: "방공 보호막을 확대한다."
 SAU_events.16.b: "요청을 거절한다."
 SAU_events.16.d: "왕국이 워싱턴에 방공 보호막의 확대를 요청했습니다. 패트리어트 포대가 사우디의 도시와 유전을 둘러싸게 되며, 비용은 리야드가 전액 부담합니다."
 SAU_events.16.t: "[SAU.GetFlag] 미국의 방패"
 SAU_events.160.a: "전면적 체제. 통행금지, 재판소, 검열관."
 SAU_events.160.b: "비상 권한만 행사한다. 거리는 건드리지 않는다."
 SAU_events.160.d: "집회, 주 간 이동, 그리고 인쇄소가 오늘 아침부터 군의 권한 아래에 놓였습니다. 평의회의 법률가들은 왕국에 정지시킬 헌법이 존재한 적이 없으며 덕분에 초안 작성의 수고를 크게 덜었다고 말합니다.\n\n문제는 어디까지 가느냐입니다. 통행금지와 재판소와 검열관은 나라를 옴짝달싹 못 하게 하겠지만 한 세대 동안 기억될 것입니다. 통행금지가 없는 비상 권한은 효과가 덜하겠지만 더 빨리 용서받을 것입니다."
 SAU_events.160.t: "계엄령"
 SAU_events.161.a: "칙령에는 5년이라고 되어 있었다. 5년이 지났다."
 SAU_events.161.b: "건강 악화는 계속된다. 무기한으로."
 SAU_events.161.d: "5년 전 평의회는 자신의 권한에 기한을 두었고, 그렇게 하도록 조언했던 법률가들은 그 후 몇 해 동안 조용히 다른 보직으로 옮겨 가야 했습니다. 그 기한이 도래했습니다. 왕국의 모든 이가 그것이 도래했음을 알고 있습니다.\n\n약속을 지킨다는 것은 평의회가 5년 동안 속을 비워 온 왕좌에 행정권을 돌려주고, 감사의 마음이 실재하는 것이라고 믿는다는 뜻입니다. 약속을 어긴다는 것은 평의회의 말이 모두가 의심하던 만큼의 가치밖에 없다는 뜻이며, 그 가치는 다시는 그보다 높아지지 않을 것입니다.\n\n§H약속을 지키면 평의회는 장악력을 잃습니다. 약속을 어기면 그 밖의 모든 것을 잃습니다.§!"
 SAU_events.161.t: "섭정의 만료"
 SAU_events.162.a: "설계를 라이선스로 들여온다. 필요한 것은 자존심이 아니라 생산이다."
 SAU_events.162.b: "광석 단계부터 직접 만든다."
 SAU_events.162.d: "왕국은 무기를 살 수 있게 된 이래로 줄곧 해외에서 무기를 사 왔으며, 지금 왕국을 다스리는 이들은 타국 의회가 허락할 때에야 도착하는 외국산 예비 부품을 기다리며 경력을 보냈습니다. 이 법은 이곳에서 만들 수 있는 것은 국내에서 제조하도록 강제합니다.\n\n시작하는 방법은 두 가지입니다. 라이선스와 생산 설비를 사들여, 남의 설계를 남의 조건으로 생산하는 공장을 3년 안에 가동하는 방법이 있습니다. 아니면 야금술, 기술자, 시행착오에 이르기까지 아무것도 없는 상태에서 시작하여 그 결과물을 온전히 소유하는 방법이 있으며, 그 비용은 국고가 10년간 체감하게 될 것입니다."
 SAU_events.162.t: "국방 산업법"
 SAU_events.163.a: "왕자들. 그들이 해명하는 모습을 나라가 지켜보게 하라."
 SAU_events.163.b: "반체제 인사들. 서류는 이미 작성되어 있다."
 SAU_events.163.c: "둘 다. 우리는 선별하기 위해 국가를 장악한 것이 아니다."
 SAU_events.163.d: "법정은 군의 권한 아래 상소 없이 열리며, 일반 판사들에게는 부여된 적 없는 관할권을 행사합니다. 울라마는 재판 절차의 형식에 관해서는 자문을 받았으나 판결에 관해서는 자문을 받지 못했고, 이를 그들도 알아차렸습니다.\n\n평의회는 누구를 법정에 세울지 결정해야 합니다. 회계 감사를 견뎌내지 못할 왕자들이 있으며, 그들의 몰락을 나라는 크게 즐길 것입니다. 마바히스가 20년간 서류를 보관해 온 조직가, 성직자, 서명자들도 있습니다. 전자를 재판하는 것은 인기가 있고 수익이 됩니다. 후자를 재판하는 것은 필요하며 오래 기억될 것입니다."
 SAU_events.163.t: "비상 재판소"
 SAU_events.164.a: "보편 복무. 성인 남성 전원, 예외 없음."
 SAU_events.164.b: "선별 복무. 부족들은 면제를 유지한다."
 SAU_events.164.d: "알 사우드는 누구도 징집한 적이 없습니다. 신뢰할 수 있는 부족에서 뽑은 지원병 군대는 충성스럽지만, 모두로 이루어진 군대는 그저 클 뿐이며, 이 정도 규모의 나라에서 큰 군대는 나라가 어떻게 운영되어야 하는지에 관해 의견을 갖게 됩니다.\n\n평의회 자체가 지난 정권이 두려워하던 바로 그 의견이었기에, 이 논의에는 어딘가 어색함이 따릅니다. 그럼에도 평의회는 위험을 감수하려 합니다. 남은 문제는 부담이 모든 이에게 돌아갈지, 아니면 평의회가 감정을 상하게 해도 감당할 수 있는 모든 이에게 돌아갈지입니다."
 SAU_events.164.t: "왕국 징병"
 SAU_events.165.a: "원로 왕자들. 그들의 이름이 아직 나라를 이끈다."
 SAU_events.165.b: "소외된 사촌들. 감사는 위신보다 값이 싸다."
 SAU_events.165.c: "부유한 불평분자들. 일단 끌어들이고 감사는 나중에 한다."
 SAU_events.165.d: "가문은 하나의 덩어리가 아닙니다. 서로 극히 불평등한 권리를 지닌 수천 명의 사람들이며, 그중 상당수는 왕좌를 차지한 분파에게 평생 외면당하며 살아왔습니다. 평의회는 방금 그 분파를 방정식에서 제거했습니다.\n\n이름만으로 한 주를 안정시킬 수 있는 원로 왕자들이 있습니다. 특별한 지위는 없지만 총독직을 받으면 고마워하고 누가 주었는지를 기억할 사촌들이 있습니다. 그리고 돈과 불만을 함께 가진 이들이 있는데, 이들은 값싸게 끌어들였다가 나중에 감사할 수 있습니다."
 SAU_events.165.t: "각 주의 충성파"
 SAU_events.166.a: "상인 가문에 대가를 치른다. 헤자즈를 제대로 사들인다."
 SAU_events.166.b: "주둔군을 배치한다. 그들은 적응할 것이다."
 SAU_events.166.d: "메카 주는 제다, 상인 가문, 순례, 그리고 헤자즈입니다. 이곳은 1925년까지 독자적인 왕국이었으며 그 사실을 한 번도 완전히 잊은 적이 없는 지역입니다. 이곳의 가문들은 석유보다 먼저 국가에 자금을 댔으며, 나지드의 통치에 완전히 순응한 적이 없습니다.\n\n그들은 매수할 수 있지만 비용이 많이 듭니다. 아니면 이 주에 주둔군을 배치하여, 이제 순례가 검문소를 거쳐 이루어진다는 점을 상기시킬 수 있습니다."
 SAU_events.166.t: "메카 주"
 SAU_events.167.a: "그들을 설득한다. 양보할 것은 양보한다."
 SAU_events.167.b: "자리를 재배정한다. 지금 당장 문구가 필요하다."
 SAU_events.167.d: "메디나에는 예언자의 모스크가 있고, 13세기에 걸쳐 그 주위에서 성장한 학자 집단이 있습니다. 그곳의 법학자들은 평의회를 공동체가 받아들여야 할 필요악이라고 표현할 수도, 공동체가 견뎌야 할 찬탈이라고 표현할 수도 있으며, 그 문구는 평의회가 발표하는 어떤 공식 성명보다도 멀리 퍼질 것입니다.\n\n그들을 설득할 수 있으며, 이는 양보와 인내를 뜻합니다. 아니면 이미 뜻을 같이하는 이들에게 원로 직책을 재배정할 수 있는데, 이는 더 빠르지만 이슬람 세계의 모든 학자가 알아차릴 것입니다."
 SAU_events.167.t: "메디나 주"
 SAU_events.168.a: "국왕의 뒤에 선다. 칭호를 빌리되 빼앗지는 않는다."
 SAU_events.168.b: "수호권은 사람이 아니라 국가에 속한다."
 SAU_events.168.d: "파흐드는 1986년에 두 성지의 수호자라는 칭호를 취하고 폐하라는 호칭을 접어 두었는데, 이는 다른 어떤 이슬람 통치자도 내세울 수 없는 것을 주장하는 칭호였습니다. 이것은 사우드 가문이 가진 가장 값진 것이며 양도할 수 없습니다.\n\n평의회는 살아 있는 국왕에게서 이를 빼앗을 수 없습니다. 국왕이 이 칭호를 사용할 때 그 뒤에 서서 그런 모습을 보이는 것은 가능한데, 이는 평의회에 그의 정통성을 빌려주는 동시에 그 정통성이 누구의 것인지를 모두에게 상기시킵니다. 아니면 수호권이 사람이 아니라 국가에 속한다고 선언하고, 이슬람 세계가 이를 어떻게 받아들이는지 확인할 수 있습니다."
 SAU_events.168.t: "두 모스크의 수호자"
 SAU_events.169.a: "동부 주 위원회부터 시작한다."
 SAU_events.169.b: "설교를 검토 대상으로 삼는다."
 SAU_events.169.c: "청원 서명자들부터 시작한다."
 SAU_events.169.d: "마바히스는 아무것도 새로 만들 필요가 없었습니다. 내무부의 캐비닛에는 동부 주 조직가들이 이름과 거리까지, 사흐와 설교자들이 설교와 날짜까지, 그리고 2003년 청원에 서명하고 2007년에 다시 서명한 이들이 낱낱이 기록되어 있습니다. 이 모든 것을 모은 부처는 언제나 신중하게 다루었는데, 서류 속 인물들에게 부처 안에 사촌이 있었기 때문입니다. 평의회에는 사촌이 없습니다."
 SAU_events.169.e: "세 서류를 모두 함께 가져온다."
 SAU_events.169.t: "이미 열려 있는 서류"
 SAU_events.17.a: "이에 응답하겠다."
 SAU_events.17.d: "[ROOT.SAU_GetFrontName]의 무장 세력이 국경 너머로 로켓을 일제히 발사했습니다. 가족들이 대피소로 몰려가는 동안 우리 도시 위로 경보 사이렌이 울리고 있으며, 피해가 집계되고 있습니다."
 SAU_events.17.t: "우리 도시를 강타한 로켓"
 SAU_events.170.a: "공개 법정에서, 중계하며."
 SAU_events.170.b: "예전처럼 리츠에서 해결한다."
 SAU_events.170.c: "사면, 시세대로."
 SAU_events.170.d: "회계사들의 작업이 끝났으며, 수치는 소문보다 더 나쁩니다. 아무것도 짓지 않은 부처들, 인도된 적 없는 항공기에 대한 수수료, 재무부와 계약업체 사이 어딘가에서 그냥 사라져 버린 10년 치 왕국의 수입. 나라는 이 중 일부를 듣게 될 것입니다. 남은 문제는 그중 얼마를 카메라 앞에서 진행하고, 얼마를 문을 닫은 호텔에서 해결하느냐입니다."
 SAU_events.170.t: "피고석의 왕자들"
 SAU_events.171.a: "그들에게 후하고 영구적인 연금을 지급한다."
 SAU_events.171.b: "원로 계보를 추방한다."
 SAU_events.171.c: "기소하고, 발견된 것은 몰수한다."
 SAU_events.171.d: "압둘아지즈에게는 기록된 아들만 45명이 있었고, 왕국은 70년간 그 결과를 소화해 왔습니다. 지금은 수천 명에 이르며, 봉급을 받고, 총독직을 맡고, 제다에서 호푸프에 이르는 모든 상인 가문과 혼인 관계를 맺고 있습니다. 그들 중 누구도 개별적으로는 평의회에 위협이 되지 않습니다. 그러나 모두를 합치면 이 나라가 알아 온 유일한 대안 정부이며, 그들을 지금 있는 자리에 그냥 놓아둘 수는 없습니다."
 SAU_events.171.e: "부유하고 장식적인 존재로 남겨 둔다."
 SAU_events.171.t: "그들 모두가 내세우는 하나의 권리 주장"
 SAU_events.172.a: "평의회를 승인한다. 관계는 국가와 맺는 것이다."
 SAU_events.172.b: "승인하되, 그 대가를 챙긴다."
 SAU_events.172.c: "우리는 대령들의 평의회와는 거래하지 않는다."
 SAU_events.172.d: "서한은 짧습니다. 왕국의 의무는 변함없고, 생산 목표는 달성될 것이며, 미국 인력은 안전하고, 평의회는 조속한 회담을 환영한다고 적혀 있습니다. 국왕도, 체포도, 헌법도 언급하지 않습니다. 이제 워싱턴은 자신이 무엇을 마주하고 있는지 판단해야 합니다. 정부인지, 아니면 우연히 정부가 있던 자리에 앉아 있는 장교 집단인지를."
 SAU_events.172.t: "평의회의 워싱턴 서한"
 SAU_events.173.a: "항만, 철도, 그리고 북부 회랑."
 SAU_events.173.b: "자본을, 조건 없이."
 SAU_events.173.d: "중국 대사는 그날 밤 이후 나흘 만에 도착하여 평의회에 질서 회복을 축하한 뒤, 곧바로 얀부의 처리량 문제로 넘어갔습니다. 국왕에 대한 언급도, 체포에 대한 언급도, 헌법에 대한 언급도 없었습니다. 이는 왕국의 외무부가 10년 만에 나눈 가장 솔직한 대화이며, 방 안의 모든 사람이 무엇이 팔리고 있는지 정확히 이해하고 있습니다."
 SAU_events.173.t: "묻지 않는 거래"
 SAU_events.174.a: "리야드가 테헤란과 합의를 본 뒤에 받아들인다."
 SAU_events.174.b: "신청을 거부한다."
 SAU_events.174.c: "받아들인다. 조건 없이."
 SAU_events.174.d: "사우디의 정회원 가입 신청이 아무런 서문도 조건도 없이 사무국에 도착했으며, 그 자체가 하나의 성명입니다. 이 기구는 걸프 국가를 받아들인 적이 없습니다. 그러나 정중하게 요청한 창립 규모의 산유국을 거절한 적도 없습니다. 베이징의 질문은 리야드가 유용한지 여부가 아닙니다. 그것은 몇 년 전에 결론이 났습니다. 문제는 리야드를 받아들이는 것이 이 기구가 20년간 피해 온 분쟁을 들여오는 일이 되는가입니다."
 SAU_events.174.t: "리야드의 가입 신청"
 SAU_events.175.a: "테헤란과의 양해를 복원한다."
 SAU_events.175.b: "누가 우리 이웃이어야 하는지 남이 정해 줄 수 없다."
 SAU_events.175.d: "답신은 공손하며 전혀 모호하지 않습니다. 중국은 신청을 후원하고, 표결을 주재하며, 소규모 회원국들을 설득할 것입니다. 그 대가로 2023년 베이징에서 중재된 양해를 대사관을 포함하여 문서로 복원해야 합니다. 이 기구는 정상회의마다 다른 회원국과 다투는 회원국을 원하지 않습니다. 리야드는 석유가 아니라 서명으로 자리를 사도록 요구받고 있습니다."
 SAU_events.175.t: "베이징의 조건"
 SAU_events.176.a: "기록해 두고 넘어간다."
 SAU_events.176.d: "이유는 제시되지 않았으며, 필요하지도 않습니다. 공동 성명은 왕국의 관심에 감사를 표하고, 지속적인 대화의 가치를 언급한 뒤 마무리됩니다. 누구든 받아줄 것이라고 장담받았던 기구에게 리야드는 거절당했으며, 이 거절은 중요한 모든 수도에서 정확히 읽힐 것입니다."
 SAU_events.176.t: "신청 거부"
 SAU_events.177.a: "자리를 받는다."
 SAU_events.177.d: "표결은 만장일치였으며, 이는 표결이 실시되기 전에 이미 결정되었다는 뜻입니다. 왕국은 어떤 선결 조건도, 수습 기간도, 현 정부가 어떻게 집권했는지에 대한 언급도 없이 정회원으로 가입합니다. 그 침묵이 곧 구매한 것의 전부입니다."
 SAU_events.177.t: "조건 없는 가입"
 SAU_events.178.a: "원유는 전과 다름없이 흐른다."
 SAU_events.178.d: "승인은 금요일 오후에 발표된 두 줄짜리 성명으로 도착했는데, 워싱턴이 아무도 들여다보지 않기를 바라는 사안을 내놓는 시간입니다. 대사는 다음 주에 복귀합니다. 상업 관계에서 재협상된 것은 없으며, 지난 6개월에 관해서는 그때도 그 이후에도 양측 누구도 언급하지 않았습니다."
 SAU_events.178.t: "평소와 다름없는 거래"
 SAU_events.179.a: "접근권을 허용한다. 승인의 대가이다."
 SAU_events.179.b: "그런 조건의 승인은 승인이 아니다."
 SAU_events.179.d: "워싱턴은 평의회를 승인할 것이며, 제안에 일정표를 첨부했습니다. 프린스 술탄 기지의 접근권 확대, 동부 주 내 사전 배치권, 상시 영공 통과권입니다. 논리는 숨겨져 있지 않습니다. 승인을 요청할 만큼 절실한 정부는 그 대가를 청구받을 수 있는 정부이며, 평의회가 먼저 요청했습니다."
 SAU_events.179.t: "대가를 치르는 승인"
 SAU_events.18.a: "겁쟁이들이 대가를 치를 것이다."
 SAU_events.18.d: "[ROOT.SAU_GetFrontName]의 조직적인 폭탄 공격이 우리 도시들을 휩쓸었습니다. 대중이 정부의 대응을 요구하는 가운데 사망자 수가 집계되고 있습니다."
 SAU_events.18.t: "우리 도시에서의 폭탄 테러"
 SAU_events.180.a: "그렇다면 그들 없이 해 나가겠다."
 SAU_events.180.d: "성명은 입헌 정부와 법치에 관한 네 개의 문단으로 이루어져 있으며, 왕국의 이웃 국가 절반에 대해서는 이와 비슷한 말도 한 적 없는 국무부가 발표했습니다. 평의회는 이를 읽고, 자기 장교 중 누가 캔자스에서 훈련받았는지 유념한 뒤, 문서철에 넣습니다. 관계는 끝나지 않습니다. 단지 더는 입에 오르지 않을 뿐입니다."
 SAU_events.180.t: "워싱턴의 거절"
 SAU_events.181.a: "전면 재확인한다. 석유를 위한 안보, 예전처럼."
 SAU_events.181.b: "석유는 좋다. 보장은 아니다."
 SAU_events.181.c: "흐지부지되게 둔다. 문서로 남은 적도 없었다."
 SAU_events.181.d: "1945년 2월 루스벨트와 압둘아지즈는 그레이트 비터 호의 순양함 위에서 만나, 이후 80년 정책의 토대가 된 약정에 합의했습니다. 미국의 안보와 사우디의 석유입니다. 두 사람 중 누구도 아무것도 서명하지 않았으며, 이후 모든 행정부가 이를 편리하게 여겨 왔습니다. 리야드는 이제 모호함이 피하도록 설계된 질문에 대한 답을 공식적으로, 서면으로 요구하고 있습니다. 그 거래는 국왕과 맺은 것입니까, 아니면 나라와 맺은 것입니까?"
 SAU_events.181.t: "퀸시 문제"
 SAU_events.182.a: "아무것도 서명되지 않았다. 서명이 필요하지도 않다."
 SAU_events.182.d: "문서는 없으며, 애초에 문서가 있었던 적이 없습니다. 떠나지 않는 항모 전단이 있고, 양국 정부 어느 쪽에서도 공개되지 않을 외교 문서가 오갔으며, 기존 조건 그대로 20년간 갱신된 급유 협정이 있을 뿐입니다. 80년이 지난 지금, 이 약정은 한 번도 문서로 남겨진 적이 없다는 단순한 방식으로 왕조의 교체를 견뎌냈습니다."
 SAU_events.182.t: "유지되는 양해"
 SAU_events.183.a: "선적되는 절반을 받겠다."
 SAU_events.183.d: "상업 관계는 상당히 구체적으로 확인되었으며, 안보 관계는 두 차례에 걸쳐 검토 중이라고 설명되었습니다. 리야드는 이 구조를 완벽히 이해합니다. 유조선은 보장되지만 왕국은 보장되지 않는다는 것입니다. 이는 워싱턴에 아무 비용도 들지 않는 퀸시의 절반이며, 나머지 절반의 비용을 계산해 본 행정부가 내놓은 것입니다."
 SAU_events.183.t: "반쪽짜리 거래"
 SAU_events.184.a: "그렇다면 왕국이 스스로를 보장한다."
 SAU_events.184.d: "성명도, 거절도, 회담도 없습니다. 요청은 부차관보급이 접수했으나 답변되지 않았고, 몇 달이 지나자 무응답이 곧 응답이었음이 분명해졌습니다. 80년에 걸친 약정은 부인된 것이 아닙니다. 이런 일이 늘 끝나는 방식대로, 그저 조용히 소멸하도록 방치되었을 뿐입니다."
 SAU_events.184.t: "누구의 보장도 아닌"
 SAU_events.185.a: "읽게 두라."
 SAU_events.185.b: "왕국의 외교 정책은 하나다."
 SAU_events.185.d: "새 치세가 시작되고 넉 달째에 이슬람회의기구가 메카에서 열렸습니다. 1969년 알아크사가 불탄 후 파이살 국왕이 세운 기구이며, 그의 동생이 그의 도시에서 소집했습니다. 10개년 행동 계획이 합의되었고 모두가 집으로 돌아갔습니다. 국가근위대 장교 식당에서는 대신 1973년의 더 오래된 연설들을 읽고 있으며, 파이살은 계획에서 멈추지 않았다고 말하고 있습니다. 무타입 빈 압둘라가 근위대를 지휘하고 있습니다. 그는 이 독서를 막지 않았습니다."
 SAU_events.185.t: "메카 정상회의"
 SAU_events.186.a: "왕국의 이름으로 공개적으로 지원한다."
 SAU_events.186.b: "근위대가 조용히 비용을 대게 한다."
 SAU_events.186.c: "그를 억제한다."
 SAU_events.186.d: "1969년 알아크사가 불탔을 때 파이살은 한 달 안에 이슬람 세계의 수장들을 라바트에 모았고, 이슬람회의기구는 그 때문에 존재합니다. 무타입 주변의 집단은 정상회의의 재소집과 이슬람 세계 연맹에 대한 공개 자금 지원을 원합니다. 왕국의 이름으로, 왕국의 비용으로, 연단에 왕국의 깃발을 세우고서 말입니다. 작은 요구가 아닙니다. 또한 그의 삼촌이 한 일과 정확히 같습니다.\n\n§H파이살주의 정서§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! / §Y100§!)"
 SAU_events.186.t: "라바트의 기억"
 SAU_events.187.a: "파이살에게도 결국 후계자가 있었다."
 SAU_events.187.d: "리야드 - 사우디아라비아 국가근위대 사령관이 이번 주에 그의 삼촌이 온전히 해낸 일을 축소판으로 해냈습니다. 이슬람 세계 연맹의 예산은 1970년대 비중에 가깝게 복원되었고, 이슬람 개발 은행은 근위대 관련 자금으로 자본이 확충될 예정이며, 무타입 빈 압둘라는 현직 사우디 군 사령관으로서는 전례 없이, 장관이 아닌 신분으로 이슬람협력기구의 특별 회기 소집을 요구했습니다.\n\n파이살 국왕은 1962년 메카에서 연맹을 창설했고 1969년 라바트에서 기구를 소집했으며, 1973년 10월에는 왕국이 중재하는 대신 행동하기로 한 날에 무엇을 할 수 있는지를 보여 주었습니다. 근위대는 국가가 아니며 그 사령관은 국왕이 아닙니다. 리야드에서는 이 두 가지 점이 한 달 전보다 훨씬 자주 강조되고 있습니다."
 SAU_events.187.t: "파이살의 후계자"
 SAU_events.188.a: "사적으로 이미 하는 말을 공개적으로 분명히 말한다."
 SAU_events.188.b: "워싱턴의 전쟁을 우리가 논평할 일은 아니다."
 SAU_events.188.d: "메소포타미아에는 왕국이 한 번도 닫을 수 없었던 국경 건너편에 미국 사단들이 있습니다. 워싱턴이 이 약정을 무엇이라 부르든, 부라이다에서 아브하에 이르는 모든 설교자가 똑같이 묘사하며, 어느 누구도 사실로 반박당하지 않고 있습니다. 무타입 주변의 집단은 파이살이 서방에 관해 옳았는지를 두고 더는 논쟁하지 않습니다. 그가 옳았다면 무엇이 따라야 하는지로 넘어갔습니다.\n\n§H파이살주의 정서§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! / §Y100§!)"
 SAU_events.188.t: "이웃에 들어선 점령군"
 SAU_events.189.a: "왕국은 해외의 박수를 받으려고 개혁하지 않는다."
 SAU_events.189.b: "세기는 우리를 기다려 주지 않는다."
 SAU_events.189.d: "칙령 하나하나는 소박합니다. 여기서는 규정이 완화되고, 저기서는 부처가 개편되고, 이전에는 허용되지 않았던 이들에게 직업이 개방되었습니다. 그러나 모두 합치면 학교가 소녀들을 받아들이기 시작한 이래 가장 큰 사회적 변화이며, 리야드에서는 누구도 이 칙령들이 워싱턴과 런던에서 어떻게 비칠지를 한쪽 눈으로 살피며 기초되지 않았다고 주장하지 않습니다. 설교단은 첫 번째 사실보다 두 번째 사실을 훨씬 더 눈여겨보았습니다.\n\n§H파이살주의 정서§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! / §Y100§!)"
 SAU_events.189.t: "문을 연 왕국"
 SAU_events.19.a: "국경을 증강한다."
 SAU_events.19.d: "[ROOT.SAU_GetFrontName]의 전투원들이 국경을 넘어 군 보급 창고를 타격한 뒤 밤의 어둠 속으로 사라졌습니다. 아군은 대응에 분주합니다."
 SAU_events.19.t: "국경 너머의 침투"
 SAU_events.190.a: "파이살의 질문을 소리 내어 묻는다."
 SAU_events.190.b: "비축량은 무기가 아니다."
 SAU_events.190.d: "또 하나의 이슬람 수도, 또 하나의 미국 항공 작전, 또 하나의 모든 당사자에게 자제를 촉구하는 사우디 성명. 무타입 주변의 집단은 성명 초안을 작성하는 일을 그만두었습니다. 대신 하나의 질문을 돌려 보고 있으며, 그것은 파이살이 1973년 10월에 답한 바로 그 질문입니다. 세계 최대의 석유 매장량을 단 한 번도 쓰지 않는다면 그것이 무슨 소용입니까?\n\n§H파이살주의 정서§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! / §Y100§!)"
 SAU_events.190.t: "다음 전쟁"
 SAU_events.191.a: "흐르게 둔다. 그가 그 선두에 선 모습을 보여야 한다."
 SAU_events.191.b: "부처를 통해 관리한다."
 SAU_events.191.c: "왕을 입에 올리기 전에 해산시킨다."
 SAU_events.191.d: "이것은 더 이상 장교들 사이의 대화가 아닙니다. 올라야 거리의 창문마다 파이살의 초상이 걸려 있고, 부라이다와 우나이자의 금요 설교는 6주째 같은 주제를 다루고 있으며, 근위대 자신의 징집병들마저 교관들 앞에서 1973년의 방송을 되뇌고 있습니다. 아무도 이를 조직하지 않았지만 모두가 그것이 어디를 가리키는지 알아봅니다. 무타입 빈 압둘라는 공개적으로 아무 말도 하지 않았고, 그 침묵 자체가 이제 하나의 성명으로 읽히고 있습니다.\n\n§H파이살주의 정서§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! / §Y100§!)"
 SAU_events.191.t: "파이살을 기억하는 거리"
 SAU_events.192.a: "파이살의 대답. 그의 말로 말한다."
 SAU_events.192.b: "포화 속에 있는 이들에게 국고를 연다."
 SAU_events.192.c: "모든 당사자에게 자제를 촉구하는 성명."
 SAU_events.192.d: "이스라엘군이 한 아랍 국가를 상대로 작전을 벌이고 있으며, 왕국의 텔레비전은 이를 중단 없이 생중계하고 있습니다. 하루도 지나지 않아 플래카드는 이스라엘만큼이나 미국을 겨냥하게 되었습니다. 항공기, 탄약, 그리고 안전보장이사회에서 뒤따를 거부권입니다. 이것은 1973년에 파이살이 택한 바로 그 지반이며, 그 사이 논거는 달라지지 않았습니다. 왕국은 세계 최대의 석유 매장량을 보유하고 있으면서도 단 한 번도 그것을 집어 들려 하지 않았다는 것입니다.\n\n§H파이살주의 정서§!: [ROOT.GetSAUFaisaliteConviction] (§Y[?SAU_faisalite_conviction|0]§! / §Y100§!)"
 SAU_events.192.t: "또 하나의 전쟁, 같은 질문"
 SAU_events.193.a: "탁자 위에서 해결되었다고 기록에 남기라."
 SAU_events.193.d: "보고서는 60쪽에 달하며, 애초에 대령들이 요구했던 것을 거의 그대로 권고합니다. 위원회가 스스로 위원을 고르도록 허용하면 으레 벌어지는 일입니다. 승진은 관보에 게재되었고, 체불 급여는 정산되었으며, 내무부 서류철에 이름이 올라 있던 장교들은 그 서류철 또한 종결되었다는 말을 조용히 전해 들었습니다.\n\n쿠데타는 없을 것입니다. 왕국의 군인들에게는 그것을 끝낼 사람이 되지 않을 이유가 주어졌으며, 군대에게는 대체로 그것으로 충분합니다."
 SAU_events.193.t: "위원회 보고"
 SAU_events.194.a: "그렇다면 합의된 것이다. 모두에게 이 문제를 제기한다."
 SAU_events.194.b: "왕국은 예멘에 홀로 대응할 것이다."
 SAU_events.194.d: "그들은 한 번의 주말 동안 도착하며 의제는 공개되지 않습니다. 쿠웨이트는 부총리 겸 내무장관인 셰이크 무함마드 알칼리드 알사바를 보냈고, 카타르는 마찬가지로 내무 업무를 맡고 있는 총리 셰이크 압둘라 빈 나세르 알사니를 보냈습니다. 에미리트 측은 이미 건물 안에 있습니다.\n\n수도는 후티에게 함락되었고, 인정받는 대통령은 그 남쪽 어딘가에서 군대라 부를 만한 병력도 없이 머물고 있습니다. 회의장에 놓인 문제는 걸프가 행동할 수 있는가가 아닙니다. 걸프가 하나의 서명으로 행동하는가, 아니면 여러 개의 서명으로 행동하는가이며, 이 회랑의 모든 국가가 그것을 스스로 결정할 것입니다."
 SAU_events.194.t: "리야드 회담"
 SAU_events.195.a: "서명한다. 필요한 모든 수단을 동원하여."
 SAU_events.195.b: "예멘은 구조받는 대가로 보호령이 되지 않을 것이다."
 SAU_events.195.d: "사우디의 요청은 대통령에게 직접 전달되었으며, 도움의 제안이라기보다는 허락을 구하는 요청입니다. 리야드는 서한을 원합니다. 안전보장이사회에 대한 호소문과, 걸프협력회의 회원국들에 대한 별도의 호소문으로, §Y필요한 모든 수단을 동원하여§! 개입해 달라고 요청하는 내용입니다.\n\n인정받는 정부는 자국 영토에 외국군을 합법적으로 초청할 수 있으며, 그 서한이 이후 벌어질 일의 법적 근거 전부입니다. 서명하면 걸프의 공군력이 옵니다. 서명하지 않으면 공화국은 아직 남아 있는 것만으로 후티에 맞서야 하며, 훗날 자신이 누구의 피보호국도 아니었다고 말할 권리를 지킵니다."
 SAU_events.195.t: "리야드로부터의 질문"
 SAU_events.196.a: "결정적 폭풍이 시작된다."
 SAU_events.196.b: "공군과 해군만. 사우디 병사는 국경을 넘지 않는다."
 SAU_events.196.d: "발표는 리야드에서 이루어지지 않았습니다. 미국 주재 왕국 대사인 아델 알주바이르가 최초의 항공기가 이미 이륙한 상태에서 워싱턴의 대사관에서 이를 낭독했는데, 이 장소 선택은 세계의 모든 수도에 누가 언제 협의 대상이었는지를 알려 줍니다.\n\n결정적 폭풍 작전. 초청에 응한 국가들이 참가국으로 호명되었으며, 그중 일부는 방송을 통해 자국의 참여 범위를 알게 됩니다. 명시된 목표는 합법 정부의 복원입니다. 종료일은 제시되지 않았고, 요구한 이도 없습니다.\n\n§H연합 참가국§!: §Y[?SAU_coalition_partners|0]§!"
 SAU_events.196.t: "선언"
 SAU_events.197.a: "걸프가 전쟁에 나섰다."
 SAU_events.197.d: "워싱턴 - 사우디가 이끄는 연합군이 오늘 밤 예멘 상공에서 항공 작전을 개시했으며, 이는 리야드가 아닌 이곳 사우디 대사관에서 발표되었습니다. 왕국은 예멘 인정 대통령의 서면 요청과 걸프협력회의의 집단 방위 조항을 근거로 내세우고 있습니다.\n\n테헤란은 이 작전을 규탄하며 후티 운동에 무기를 공급한 사실을 부인했습니다. 워싱턴은 자국 항공기는 투입하지 않은 채 병참과 정보 지원을 제공하고 있음을 확인했습니다. 연합 참가국 어디도 작전이 얼마나 지속될지에 대한 추정치를 내놓지 않았습니다."
 SAU_events.197.t: "결정적 폭풍 작전"
 SAU_events.198.a: "왕국과 함께 비행하겠다."
 SAU_events.198.b: "이것은 우리의 전쟁이 아니다."
 SAU_events.198.d: "요청은 사우디 대사를 통해 도착했으며 이례적으로 직접적입니다. 항공기를 보내거나, 그 정비 요원을 보내거나, 최후의 경우에는 공동 성명에 이름이라도 올려 달라는 것입니다. 왕국은 후티의 진격에 맞서 연합을 구성하고 있으며, 혼자 구성하는 것은 피하고 싶어 합니다.\n\n참여하면 리야드에서 큰 신뢰를 얻고 이후 벌어질 일의 몫을 갖게 됩니다. 거절하면 그 신뢰를 잃을 뿐 다른 대가는 없습니다. 다만 이 전쟁에는 종료일이 정해져 있지 않습니다."
 SAU_events.198.t: "리야드의 출격 요청"
 SAU_events.199.a: "그렇다면 요청받지 않은 곳에는 가지 않겠다."
 SAU_events.199.b: "그들의 서명은 필요하지 않다."
 SAU_events.199.d: "사나의 답변은 공손하고 느긋하며 전적으로 부정적입니다. 안전보장이사회에 대한 호소도, 걸프에 대한 요청도 없을 것이며, 정부들이 무시할 작정인 우려에 쓰는 표현으로 왕국의 염려에 감사를 표했습니다.\n\n그 서한이 없으면 초청도 없고, 초청이 없으면 예멘 상공의 항공 작전은 그저 예멘 상공의 항공 작전일 뿐입니다. 리야드는 여전히 행동할 수 있습니다. 다만 자기 책임으로 행동하게 될 것이며, 모든 수도가 그렇게 기록할 것입니다."
 SAU_events.199.t: "오지 않는 서한"
 SAU_events.2.a: "국왕 폐하 만세!"
 SAU_events.2.d: "압둘라 빈 압둘아지즈 알사우드가 사우디아라비아 국왕이자 두 성지의 수호자로 공식 선포되었습니다. 1995년 이래 사실상의 통치자로 재임해 온 만큼, 그의 공식 즉위는 왕국에 안정과 연속성을 가져다줍니다. 압둘라 국왕은 신중한 개혁 성향과 종교 간 대화를 증진하려는 노력으로 알려져 있습니다."
 SAU_events.2.t: "압둘라 국왕 즉위"
 SAU_events.20.a: "자이시 알이슬람(이슬람 군대)"
 SAU_events.20.b: "안사르 알하라마인(두 성지의 수호자들)"
 SAU_events.20.c: "카타입 알아크사(알아크사 여단)"
 SAU_events.20.d: "사우디의 지원을 받는 새로운 운동은 세상에 모습을 드러내기 전에 이름이 필요합니다. 선택된 기치가 지지자와 적이 이 조직을 부르는 방식을 규정할 것입니다."
 SAU_events.20.e: "리와 알타우히드(유일신 여단)"
 SAU_events.20.t: "전선의 이름"
 SAU_events.200.a: "부처들이 감내할 수 있는 만큼 개혁한다."
 SAU_events.200.b: "칙령에 적힌 이름만 바뀌었다."
 SAU_events.200.c: "경제를 개방하고 정치가 뒤따르게 한다."
 SAU_events.200.d: "파흐드는 교리에 따라 표지 없는 무덤에 알우드에 묻혔고, 압둘라는 10년간 남의 이름으로 통치한 끝에 자기 이름으로 국왕이 되었습니다. 조의는 90개 수도에서 도착했고 첫 내각 회의는 같은 주에 열렸습니다.\n\n뇌졸중 이후 그가 하고 싶었던 모든 일은 이제 제안하는 것이 아니라 명령하는 것이 되었고, 부처들도 이를 알고 있습니다. 그들이 아직 모르는 것은 그가 그중 얼마나 많은 것을 여전히 의도하고 있는가입니다. 이 내각에는 지난 10년간 그 답이 거의 없을 것이라고 짐작해 온 이들이 있습니다."
 SAU_events.200.t: "새로운 왕국"
 SAU_events.201.a: "충성 평의회가 계승을 판정하게 한다."
 SAU_events.201.b: "국왕이 후계자를 지명한다. 평의회는 박수를 칠 것이다."
 SAU_events.201.c: "그 대신 가문의 동의를 산다."
 SAU_events.201.d: "계승은 1953년 이래 형제 사이의 연장자 순으로 정해져 왔으며, 형제가 있고 그들이 합의할 수 있는 동안에는 이것이 통했습니다. 이제는 해마다 둘 다 줄어들고 있으며, 지난 두 번의 이양은 다음 번을 관리할 수 없게 된 이들이 처리했습니다.\n\n탁상에 오른 제안은 압둘아지즈의 아들들과 손자들로 구성된 상설 평의회를 두어 왕세자를 승인하고 국왕의 적격성을 판정하게 하는 것입니다. 이는 왕좌가 가져 본 최초의 성문 절차가 될 것입니다. 또한 국왕 자신에 대해 권한을 주장할 수 있는, 왕국 역사상 최초의 기관이 될 것이며, 방 안의 모든 이가 이를 놓친 것은 아닙니다."
 SAU_events.201.t: "왕관의 공고화"
 SAU_events.202.a: "발언하게 하고, 그 내용을 공표한다."
 SAU_events.202.b: "소집은 허용한다. 의제는 우리가 정한다."
 SAU_events.202.d: "회의장은 카티프 출신의 시아파 성직자가 리야드 출신의 살라피 학자와 대화가 가능한 거리에 앉도록 배치되었으며, 왕국 역사상 처음으로 여성들이 칸막이 뒤에 참석해 있습니다. 이곳에서 결정된 사항은 누구도 구속하지 않습니다. 그것이 이 회의의 요점이자 동시에 이에 대한 반론입니다.\n\n대표들은 허용된 것만을 말할 것입니다. 그 범위가 얼마인지는 정해지지 않았고, 이를 정할 두 사람은 의견이 다릅니다. 한 사람은 아무것도 바꾸지 않는 회기는 회기가 없는 것보다 나쁘다고 보고, 다른 사람은 무언가를 바꾸는 회기는 아무도 통제할 수 없는 연속의 시작이라고 봅니다."
 SAU_events.202.t: "국민 대화"
 SAU_events.203.a: "워싱턴의 제안을 전면 수용한다."
 SAU_events.203.b: "마바히스가 자체적으로 처리할 것이다."
 SAU_events.203.c: "그들을 교화한다. 감옥은 더 많은 테러범만 만들 뿐이다."
 SAU_events.203.d: "알함라와 이슈빌리야의 거주 단지는 이곳에서 자라고, 이곳에서 교육받고, 이곳에 등록된 자선단체를 통해 자금을 지원받은 자들에게 폭격당했습니다. 분쟁이 무엇에 관한 것이라고 가정되었든, 이제는 명백히 왕국 자체와의 분쟁입니다.\n\n워싱턴은 연락 조직, 감시 대상 명단의 통합, 그리고 이 지역의 누구와도 공유한 적 없는 신호 정보에 대한 접근을 제안하고 있습니다. 수락하면 미국 장교들이 사우디의 서류를 읽게 됩니다. 거절하면 폭파범들에게 조용히 동조하는 사람이 매우 많은 나라에서 이 일을 홀로 감당해야 합니다."
 SAU_events.203.t: "테러 대응 협력"
 SAU_events.204.a: "의석의 절반, 그리고 남성 유권자 명부."
 SAU_events.204.b: "전원을 임명하고 자문이라 부른다."
 SAU_events.204.c: "여성도 유권자 명부에 올린다."
 SAU_events.204.d: "지방 의회 의석의 절반은 선거로, 나머지 절반은 임명으로 채워지며, 의회 자체는 배수, 가로등, 건축 허가에 대한 권한을 갖습니다. 궁정의 누구도 이것이 권력 이양이라고 주장하지 않습니다.\n\n이에 반대하는 논거는 의회가 해를 끼치리라는 것이 아닙니다. 사우디 국민이 투표를 하게 되리라는 것, 그리고 칙령과 달리 선례는 이듬해에 조용히 철회할 수 없다는 것입니다."
 SAU_events.204.t: "지방 선거 실시"
 SAU_events.205.a: "끝까지 자문 기구였다."
 SAU_events.205.d: "명령이 도착했을 때 평의회는 회기 중이었으며, 명령은 이유를 설명하지 않았습니다. 위원들은 네 줄짜리 공동 성명으로 봉사에 대한 감사를 받았고, 건물은 폐쇄되었으며, 그들이 수년간 열람을 허용받았던 서류들은 원래의 부처로 돌아갔습니다.\n\n평의회는 국왕의 허락으로 열렸습니다. 국왕이 없거나, 더 이상 사우드 가문의 국왕이 없으니 평의회도 없습니다. 리야드의 누구도 평의회가 한 주를 넘기리라 기대하지 않았고, 누구도 그것을 소리 내어 말하지 않았습니다."
 SAU_events.205.t: "평의회 해산"
 SAU_events.206.a: "통과시킨다."
 SAU_events.206.b: "왕실이 재가를 보류한다."
 SAU_events.206.d: "개혁파 의원단이 직접 비용을 산정했는데, 이는 새로운 일이며, 그 산정이 낙관적이라는 것은 새롭지 않은 일입니다. 간선망이 건너뛴 마을들로 가는 도로, 아직도 급수차로 물을 사는 지구에 대한 상수도, 그리고 부처가 지출 내역을 공표하도록 요구하는 조항입니다.\n\n부처가 반대하는 것은 바로 마지막 조항입니다."
 SAU_events.206.t: "개혁파의 법안"
 SAU_events.207.a: "통과시킨다."
 SAU_events.207.b: "왕실이 재가를 보류한다."
 SAU_events.207.d: "전통주의 의원단은 늘 제안해 왔으나 표결에 부칠 수 있었던 적은 없던 것을 제안합니다. 기부 재단에 대한 정당한 재원 마련, 주거 수당의 인상, 호황 이후 줄곧 병원 없이 지내 온 주들을 위한 진료소 건설 계획입니다.\n\n재무부는 이 산술을 희망 사항이라고 평합니다. 의원단은 그 산술이 30년간 반대 방향으로 희망 사항이었다고 응수합니다."
 SAU_events.207.t: "전통주의자의 법안"
 SAU_events.208.a: "통과시킨다."
 SAU_events.208.b: "왕실이 재가를 보류한다."
 SAU_events.208.d: "지방 출신 의원들이 연합했는데, 리야드의 누구도 그들이 해내리라고 예상하지 못한 일입니다. 실효성 있는 사우디인 고용 할당제, 노동자를 한 고용주에게 묶어 두는 후견 제도의 폐지, 그리고 감독 대상 부처가 아니라 평의회에 보고하는 감찰 기관입니다.\n\n이번 주 제다의 모든 상인 가문이 궁정에 서한을 보냈습니다. 의원단은 이를 알면서도 표결 일정을 잡았습니다."
 SAU_events.208.t: "지방 출신 의원들의 법안"
 SAU_events.209.a: "왕명으로 30석."
 SAU_events.209.b: "의회는 현재 그대로 둔다."
 SAU_events.209.d: "칙령으로 보장되는 30석이며, 어느 미래의 국왕도 이 숫자를 조용히 없애지 못하도록 한 것으로, 의회의 5분의 1입니다. 그들은 별도의 문으로 입장하여 별도의 구역에 앉을 것이며, 사진은 좌석 배치도보다 훨씬 멀리 퍼질 것입니다.\n\n40여 명의 원로 학자가 서한에 서명했습니다. 서한은 아무것도 위협하지 않는데, 그럴 필요가 없기 때문입니다."
 SAU_events.209.t: "슈라 평의회의 여성"
 SAU_events.21.a: "상황의 전개를 면밀히 주시한다."
 SAU_events.21.d: "[ROOT.SAU_GetFrontName](이)라고 자칭하는 이전에 알려지지 않은 운동이 서안 지구 전역과 이스라엘 국경 안에서 자신의 존재를 선언했습니다. 이들은 조직적인 성명을 통해 해방될 때까지 무장 저항을 하겠다고 맹세하며, 최근의 일련의 공격이 자신들의 소행이라고 주장하고 있습니다. 정보기관들은 이 조직의 기원, 자금원, 영향력의 범위를 추적하느라 분주합니다."
 SAU_events.21.t: "성지에 떠오른 새로운 전선"
 SAU_events.210.a: "걸프는 군주제를 잃지 않는다."
 SAU_events.210.d: "마나마 - 사우디 기갑 부대가 동트기 전 파흐드 국왕 육교를 건너 한 발도 쏘지 않고 수도에 도달했습니다. 리야드는 이 배치를 바레인 합법 정부의 요청에 따라 수행된 반도 방패 작전이라고 설명하며, 어느 정부가 요청했는지에 관한 설명은 거부하고 있습니다.\n\n테헤란은 이를 점령이라고 불렀습니다. 워싱턴은 모든 당사자에게 자제를 요청했으나 누구에게도 철수를 요청하지는 않았습니다. 할리파 가문은 궁으로 돌아왔고, 그들을 그곳에 앉힌 약정은 이제 사적인 양해가 아니라 공적인 기록의 문제가 되었습니다."
 SAU_events.210.t: "육교"
 SAU_events.211.a: "생산을 늘린다. 유전이 곧 전략이다."
 SAU_events.211.b: "유정보다 오래갈 산업을 구축한다."
 SAU_events.211.c: "탐사한다. 아직 더 많은 것이 있다."
 SAU_events.211.d: "아브카이크는 왕국 원유의 대부분을 한 시설에서 처리하고 라스타누라는 그것을 다른 시설에서 선적합니다. 두 번의 공격이 성공하면 이 지역의 어떤 군대도 1년 안에 입힐 수 없는 만큼의 피해를 세계 경제에 입히게 되며, 부처는 마침내 이에 대해 무엇을 할 작정인지 소리 내어 밝히도록 요구받았습니다.\n\n재원은 세 가지 답이 아니라 한 가지 답을 위한 것뿐입니다. 유전이 안전한 동안 더 강하게 생산하거나, 유전을 잃어도 살아남을 산업을 구축하거나, 아니면 왕국이 지금 가진 유전이 전부라는 가정을 버리는 것입니다."
 SAU_events.211.t: "석유 방어 전략"
 SAU_events.212.a: "재판부가 위쪽까지 닿게 한다."
 SAU_events.212.d: "법은 언제나 충분했습니다. 없었던 것은 그것을 위쪽으로 적용할 의지를 가진 재판부, 즉 장관을 소환할 수 있는 법원, 왕자의 계좌를 열람할 수 있는 위원회, 그 이후에도 경력을 유지할 판사였습니다.\n\n그것은 국왕이 이를 참아 주는 만큼만 작동할 것이며, 소환될 수 있는 모든 이가 이를 알고 있습니다. 법원이 발표된 주에 이미 자금의 이동이 멈춥니다."
 SAU_events.212.t: "부패 법원"
 SAU_events.213.a: "법 위에 있는 자는 없듯, 서류철 위에 있는 자도 없다."
 SAU_events.213.d: "200여 명의 왕자, 장관, 사업가가 나라에서 가장 비싼 호텔에 수개월간 억류되어 있습니다. 1,000억 달러가 회수된 것으로 알려져 있습니다. 기소 내용은 공표되지 않았고, 판결도 내려지지 않았으며, 석방은 한 명씩 협상으로 이루어집니다.\n\n이는 반부패 운동으로 묘사됩니다. 실제로는 가문이 집합체이기를 멈추고 관객이 되기 시작한 순간으로 기능했으며, 전 세계의 모든 투자자가 그것이 벌어지는 것을 지켜보았습니다."
 SAU_events.213.t: "리츠칼튼"
 SAU_events.214.a: "조용히 해결한다. 원래 그렇게 될 일이었다."
 SAU_events.214.d: "석방은 한 명씩 협상으로 이루어지며 조건은 공표되지 않습니다. 여기서는 회사가 양도되고, 저기서는 재단이 해산되며, 아들의 직위가 조용히 보장되는 식입니다. 관련된 모든 이들은 이것이 법적 문서가 아니라 정치적 문서임을 이해하고 있습니다.\n\n돈은 거의 즉시 나라로 돌아오는데, 이를 반환하는 이들에게 이제 그것을 감시받을 수 있는 곳에 두어야 할 이유가 있기 때문입니다. 각자의 서류철은 리야드의 서랍 속에 열린 채로 남아 있습니다."
 SAU_events.214.t: "뒷문 거래"
 SAU_events.215.a: "가문은 다툴 다른 거리를 찾아야 할 것이다."
 SAU_events.215.d: "왕자들이 서로의 지지 세력을 세고 있는 동안 장교들은 아무것도 세지 않게 되었습니다. 지명할 후계자는 없습니다. 상속할 왕좌가 없기 때문입니다. 평의회는 이 문제를 안건에서 내렸고 다시 올릴 생각이 없습니다.\n\n지난 몇 해 동안 자신의 파벌을 규합하는 데 몰두했던 이들은 파벌이 그 배후의 제도만큼의 가치만 있으며, 그 모두의 배후에 있던 제도가 군주제였다는 사실을 깨달았습니다."
 SAU_events.215.t: "계승 논의의 종결"
 SAU_events.216.a: "공개적으로 설교하게 둔다."
 SAU_events.216.b: "장교 식당 안에서만 하게 한다."
 SAU_events.216.c: "왕국에는 한 번에 한 명의 국왕만 있다고 알린다."
 SAU_events.216.d: "무타입의 사람들은 올해 들어 세 번째로 디완에 같은 질문을 제기했으며, 이번에는 질문의 형식을 갖추는 수고조차 하지 않았습니다. 왕국은 스스로를 두 모스크의 수호자라 부르면서 속국처럼 행동합니다. 파이살은 그러지 않았습니다. 이것이 논거의 전부이며, 검토해도 더 복잡해지지 않습니다.\n\n계승이 정리되지 않았다는 것은, 지금 하는 모든 말이 편을 고르고 있는 이들 앞에서 이루어진다는 뜻입니다."
 SAU_events.216.t: "다시 묻는 그 집단"
 SAU_events.217.a: "왕국은 계속된다."
 SAU_events.217.d: "리야드는 23년간 왕좌를 지켰으나 1995년의 뇌졸중 이후로는 그에 따르는 일을 거의 맡지 못한 파흐드 빈 압둘아지즈 알사우드 국왕의 서거를 발표했습니다. 그가 남긴 왕국은 10년 동안 그의 이름으로, 그의 동생의 손으로 통치되었으며, 오늘 아침 발표된 이양은 문서의 직함을 바꿀 뿐 서명하는 사람을 바꾸지 않습니다.\n\n압둘라 왕세자가 즉위합니다. 그는 이미 여든을 넘겼습니다. 중요한 이들은 그를 보고 있지 않습니다. 그를 지나쳐 다음에 누가 지명될지를 보고 있습니다."
 SAU_events.217.t: "파흐드 국왕 서거"
 SAU_events.218.a: "이제 계승이 이야기의 핵심이다."
 SAU_events.218.d: "압둘라 빈 압둘아지즈 알사우드 국왕이 서거했으며, 이와 함께 연장자라는 이유만으로 누구도 두 번째 질문을 던지지 않고 왕좌를 주장할 수 있었던 마지막 형제가 떠납니다. 그는 의례가 요구하는 대로, 그리고 그 이전의 모든 국왕이 그랬듯이, 알우드의 표지 없는 무덤에 묻혔습니다.\n\n살만은 몇 시간 안에 즉위합니다. 이어지는 것은 왕국이 30년간 미루어 온 부분입니다. 왕관은 결국 그에 대한 자동적인 권리가 없는 세대에게 넘어가야 하며, 현재 살아 있는 모든 왕자가 이를 알고 있습니다."
 SAU_events.218.t: "압둘라 국왕 서거"
 SAU_events.219.a: "국왕 폐하 만세."
 SAU_events.219.d: "국왕이 서거했습니다. 리야드는 왕좌에 대해서만 아껴 쓰는 간결한 표현으로 발표를 냈으며, 왕세자는 이미 원로 왕자들, 울라마, 그리고 근위대를 지휘하는 이들로부터 바이아를 받았습니다.\n\n오늘 끝나는 치세는 한 노인과, 왕관이 형제 사이를 옆으로 이동한다는 양해로 여전히 돌아가던 왕국에서 시작되었습니다. 그것은 그 양해가 사라지고, 국왕 자신에 의해 해체되고, 세계가 확정된 것으로 간주하도록 초청받은 계승 방식으로 대체된 채 끝납니다."
 SAU_events.219.t: "살만 국왕 서거"
 SAU_events.22.a: "석유가 남쪽으로 흐르게 하라."
 SAU_events.22.b: "우리 땅은 사우디의 고속도로가 아니다."
 SAU_events.22.d: "사우디가 우리 남부 지방을 가로질러 아라비아해에 이르는 송유관을 건설하겠다고 요청했습니다. 통과 수수료는 국고를 채울 것이며, 리야드는 쉽게 갚기 어려운 신세를 우리에게 지게 됩니다."
 SAU_events.22.t: "바다로 이어지는 송유관"
 SAU_events.24.a: "송유관을 건설한다."
 SAU_events.24.b: "제안을 거절한다."
 SAU_events.24.d: "사우디아라비아가 자국 석유를 우리 영토를 지나 튀르키예와 유럽으로 보내겠다고 제안합니다. 이라크는 걸프와 서방을 잇는 다리가 될 것이며, 통과 수익은 국가를 재건할 것입니다."
 SAU_events.24.t: "유럽으로 가는 송유관"
 SAU_events.25.a: "빈손으로 돌려보낸다."
 SAU_events.25.d: "사우드 가문이 우리 영토를 지나는 송유관을 제안하는 사절을 보냈습니다. 그들은 여기서 누가 통치하는지 잊었습니다. 이라크는 누구에게도, 특히 리야드에게는 고개를 숙이지 않습니다."
 SAU_events.25.t: "바그다드의 사우디 사절"
 SAU_events.26.a: "훌륭하다."
 SAU_events.26.d: "용접공들이 마지막 구간을 이었고 밸브가 열렸습니다. 사우디의 원유가 이제 새로운 동맥을 따라 바다로 흐르며, 왕국의 세계 에너지 장악력은 더욱 강해집니다."
 SAU_events.26.t: "흐르는 석유"
 SAU_events.27.a: "다른 길을 찾을 것이다."
 SAU_events.27.d: "거래가 무산되었습니다. 당분간 바다로 향하는 이 경로는 우리의 손이 닿지 않는 곳에 있으며, 호르무즈가 여전히 유일한 관문입니다."
 SAU_events.27.t: "경로 폐쇄"
 SAU_events.28.a: "값비싼 차질이다."
 SAU_events.28.d: "전쟁이 송유관에까지 번졌습니다. 파괴 공작원들이 한 구간을 완전히 폭파했고 석유 흐름이 멈췄습니다. 예멘 남부가 확보될 때까지 아라비아해 경로는 상실되었습니다."
 SAU_events.28.t: "송유관 절단"
 SAU_events.29.a: "경로를 개방한다."
 SAU_events.29.b: "사우디의 요청을 거절한다."
 SAU_events.29.d: "리야드는 우리 왕국을 가로질러 지중해로 향하는 송유관을 건설하겠다고 요청했습니다. 통과 수수료만으로도 우리 재정이 안정될 것이며, 사우디는 너그러운 친구입니다."
 SAU_events.29.t: "요르단을 가로지르는 송유관"
 SAU_events.3.a: "사우디의 제안을 수락한다."
 SAU_events.3.b: "사우디의 제안을 거절한다."
 SAU_events.3.d: "리야드가 중국 기업들에게 사우디의 농업 및 에너지 사업에 대한 접근권을 제안합니다. 수락하면 중국과 왕국 사이의 경제적 유대가 깊어질 것입니다."
 SAU_events.3.t: "[SAU.GetFlag] 사우디-중국 거래 [CHI.GetFlag]"
 SAU_events.30.a: "송유관을 환영한다."
 SAU_events.30.b: "시리아는 매물이 아니다."
 SAU_events.30.d: "요르단과 합의가 이루어진 가운데, 사우디는 자국 석유를 우리 영토를 거쳐 바다로 운반하겠다고 제안합니다. 자유롭고 번영하는 시리아는 크게 이익을 볼 것이며, 리야드의 우정은 얻을 가치가 있습니다."
 SAU_events.30.t: "리야드의 제안"
 SAU_events.300.a: "독립적인 기술 관료."
 SAU_events.300.b: "왕실의 감독이 필수적이다."
 SAU_events.300.c: "외국 전문가를 영입한다."
 SAU_events.300.d: "§L자본시장법§!이 서명되었습니다. 이제 결정해야 합니다. 새로운 §L자본시장청§!의 수장 자리에 누가 앉아야 합니까? 기술 관료들은 독립성을 요구하고, §H왕실§!은 감독을 요구하며, 외국 고문들은 자신들의 경험을 제안합니다. 이 선택이 한 세대 동안 왕국의 금융 구조를 규정할 것입니다."
 SAU_events.300.t: "§H왕실 칙령 M/30 - 시행§!"
 SAU_events.301.a: "앵글로색슨 체제."
 SAU_events.301.b: "샤리아 우선 체제."
 SAU_events.301.c: "혼합 모델."
 SAU_events.301.d: "공식적인 법인화가 기업 환경을 재편합니다. 주식회사, 유한책임회사 중에서 §L왕국§!은 모델을 선택해야 합니다. §L앵글로색슨§! 체제는 외국의 영향을 감수하는 대신 효율성을 제공하고, §L샤리아 우선§! 체제는 속도를 희생하는 대신 정당성을 제공하며, §L혼합§! 모델은 절제된 중도를 택합니다."
 SAU_events.301.t: "§H2007년 법률 개혁§!"
 SAU_events.310.a: "미국의 훈련 및 협력"
 SAU_events.310.b: "GCC 집단 방위"
 SAU_events.310.c: "나토식 전문성"
 SAU_events.310.d: "국내 자립"
 SAU_events.310.desc: "사막의 폭풍 작전은 그것을 지켜본 모든 군대를 겸허하게 만들었습니다. 사우디 왕립 육군은 연합 파트너들과 나란히 서서 충분히 임무를 수행했지만, 참모본부는 진실을 알고 있습니다. 미국의 항공 전력, 병참, 지휘가 없었다면 왕국의 군대는 준비되어 있지 않았다는 것입니다.\n\n전쟁 연습은 끝났고 평가는 내려졌습니다. 이제 왕국은 군대를 재건할 모델을 선택해야 합니다. 각각의 길은 한 가지 면에서 우리를 강하게 하고 다른 면에서 약하게 하며, 공짜로 얻는 선택은 없습니다.\n\n§Y각 선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.310.t: "전쟁 연습: 걸프전의 교훈"
 SAU_events.311.a: "국가근위대: 체제 수호대"
 SAU_events.311.b: "국가근위대: 부족 의용군"
 SAU_events.311.c: "국가근위대: 국내 치안"
 SAU_events.311.desc: "사우디아라비아 국가근위대는 자신이 진정 무엇을 위해 존재하는지 결정해야 합니다. 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.311.t: "국가근위대 대비 훈련"
 SAU_events.312.a: "기갑: 충격과 돌파"
 SAU_events.312.b: "기갑: 제병 협동"
 SAU_events.312.c: "기갑: 방어 장벽"
 SAU_events.312.desc: "기갑군단은 새로운 에이브럼스로 어떻게 싸울 것입니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
 SAU_events.312.t: "에이브럼스 사격 프로그램"
 SAU_events.313.a: "포병: 집중 포격"
 SAU_events.313.b: "포병: 정밀 포격"
 SAU_events.313.c: "포병: 사격 후 이동"
 SAU_events.313.desc: "포병들이 기량을 다듬고 있지만 어느 방향으로 갈 것입니까? 각각의 길은 지속적인 맞교환이며, 한 방향에서는 우리를 강하게 하고 다른 방향에서는 약하게 합니다.\n\n§Y선택지에 마우스를 올리면 그것이 무엇을 부여하고 무엇을 요구하는지 정확히 볼 수 있습니다.§!"
