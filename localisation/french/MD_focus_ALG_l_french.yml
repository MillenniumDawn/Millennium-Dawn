 ALG_khenchela_trait_desert_hardened: "Équipement durci par le désert"
 ALG_khenchela_trait_desert_hardened_desc: "Armes conçues et testées spécifiquement pour les conditions sahariennes, avec une meilleure étanchéité à la poussière et une résistance à la chaleur."
 ALG_khenchela_trait_simplified_maintenance: "Entretien simplifié"
 ALG_khenchela_trait_simplified_maintenance_desc: "Conceptions simplifiées qui réduisent les exigences d'entretien et le coût des pièces de rechange."
 ALG_khenchela_trait_standardized_production: "Lignes de production standardisées"
 ALG_khenchela_trait_standardized_production_desc: "Mettre en œuvre des processus de fabrication uniformes pour accroître l'efficacité de la production."
 ALG_khenchela_trait_mass_production_focus: "Focus sur la production de masse"
 ALG_khenchela_trait_mass_production_focus_desc: "Étendre la capacité de production pour répondre aux besoins d'une grande armée permanente."
 ALG_seriana_trait_kalashnikov_expertise: "Expertise Kalachnikov"
 ALG_seriana_trait_kalashnikov_expertise_desc: "Des décennies d'expérience dans la production de fusils de type AK fournissent une fiabilité et une puissance de feu supérieures."
 ALG_seriana_trait_licensed_production: "Efficacité de production sous licence"
 ALG_seriana_trait_licensed_production_desc: "Lignes de production optimisées pour des armes de conception étrangère sous licence."
 ALG_seriana_trait_cost_reduction: "Mesures de réduction des coûts"
 ALG_seriana_trait_cost_reduction_desc: "Mettre en œuvre des techniques de fabrication économiques sans compromettre la qualité."
 ALG_dgi_trait_atgm_development: "Programme de missiles antichars"
 ALG_dgi_trait_atgm_development_desc: "Développement national de missiles guidés antichars pour réduire la dépendance étrangère."
 ALG_dgi_trait_manpads_systems: "Systèmes MANPADS"
 ALG_dgi_trait_manpads_systems_desc: "Systèmes de défense aérienne portables pour l'infanterie et les unités légères."
 ALG_dgi_trait_artillery_modernization: "Modernisation de l'artillerie"
 ALG_dgi_trait_artillery_modernization_desc: "Mettre à niveau les pièces d'artillerie existantes avec des systèmes modernes de conduite de tir et de ciblage."
 ALG_dgi_trait_cnc_integration: "Intégration des systèmes C3I"
 ALG_dgi_trait_cnc_integration_desc: "Intégrer les systèmes de commandement, contrôle, communications et renseignement sur toutes les plateformes."
 ALG_dgi_trait_mass_production: "Initiative de production de masse"
 ALG_dgi_trait_mass_production_desc: "Accroître les capacités de production pour répondre aux exigences d'expansion militaire."
 ALG_bcl_trait_desert_adaptation: "Forfait Adaptation au Désert"
 ALG_bcl_trait_desert_adaptation_desc: "Modifications spécialisées pour les opérations désertiques, y compris un refroidissement amélioré et une filtration de la poussière."
 ALG_bcl_trait_soviet_refurbishment: "Remise à neuf des équipements soviétiques"
 ALG_bcl_trait_soviet_refurbishment_desc: "Expertise dans la révision et la modernisation de véhicules blindés de l'ère soviétique à moindre coût."
 ALG_bcl_trait_reactive_armor: "Intégration de l'armure réactive"
 ALG_bcl_trait_reactive_armor_desc: "Ajouter un blindage réactif explosif pour améliorer la protection contre les charges creuses."
 ALG_bcl_trait_apc_modernization: "Programme de modernisation des VTT"
 ALG_bcl_trait_apc_modernization_desc: "Mises à niveau complètes pour les véhicules de transport de troupes et les véhicules de combat d'infanterie."
 ALG_bcl_trait_production_efficiency: "Améliorations de l'efficacité de la production"
 ALG_bcl_trait_production_efficiency_desc: "Rationaliser les processus d'assemblage pour accroître la production."
 ALG_snvi_trait_saharan_proven: "Conceptions éprouvées au Sahara"
 ALG_snvi_trait_saharan_proven_desc: "Véhicules longuement éprouvés en conditions désertiques pour une fiabilité maximale."
 ALG_snvi_trait_mercedes_partnership: "Partenariat Mercedes-Benz"
 ALG_snvi_trait_mercedes_partnership_desc: "Production sous licence de plateformes de véhicules commerciaux Mercedes-Benz adaptées à un usage militaire."
 ALG_snvi_trait_mass_production: "Expansion de la production de masse"
 ALG_snvi_trait_mass_production_desc: "Étendre les installations de production pour répondre à la demande militaire accrue."
 ALG_snvi_trait_cost_reduction: "Optimisation des coûts"
 ALG_snvi_trait_cost_reduction_desc: "Réduisez les coûts unitaires grâce à une efficacité de fabrication améliorée."
 ALG_enmib_trait_maintenance_expertise: "Expertise en maintenance et révision"
 ALG_enmib_trait_maintenance_expertise_desc: "Une connaissance spécialisée de l'entretien des hélicoptères prolonge la durée de vie et la fiabilité."
 ALG_enmib_trait_licensed_assembly: "Opérations d'assemblage sous licence"
 ALG_enmib_trait_licensed_assembly_desc: "Assembler sous licence des hélicoptères étrangers à moindre coût."
 ALG_enmib_trait_production_expansion: "Expansion de la capacité de production"
 ALG_enmib_trait_production_expansion_desc: "Étendre les installations pour accroître la capacité de production d'hélicoptères."
 ALG_mek_trait_mediterranean_design: "Conception navale méditerranéenne"
 ALG_mek_trait_mediterranean_design_desc: "Navires optimisés pour les opérations en mer Méditerranée, avec une vitesse et une efficacité améliorées."
 ALG_mek_trait_patrol_vessel_expertise: "Expertise des navires de patrouille"
 ALG_mek_trait_patrol_vessel_expertise_desc: "Spécialisé dans la construction de patrouilleurs rapides aux capacités de détection renforcées."
 ALG_mek_trait_shipyard_expansion: "Programme d'expansion des chantiers navals"
 ALG_mek_trait_shipyard_expansion_desc: "Étendre les installations du chantier pour accroître la capacité de construction."
 ALG_cnan_trait_frigate_construction: "Capacité de construction de frégates"
 ALG_cnan_trait_frigate_construction_desc: "Développer la capacité de construire des frégates et destroyers modernes."
 ALG_cnan_trait_anti_air_systems: "Systèmes anti-aériens navals"
 ALG_cnan_trait_anti_air_systems_desc: "Intégrer des systèmes antiaériens modernes aux bâtiments de surface."
 ALG_cnan_trait_submarine_assembly: "Assemblage sous-marin"
 ALG_cnan_trait_submarine_assembly_desc: "Assemblage sous licence de sous-marins diesel-électriques avec une assistance technique étrangère."
 ALG_cnan_trait_foreign_assistance: "Assistance technique étrangère"
 ALG_cnan_trait_foreign_assistance_desc: "Des partenariats avec des constructeurs navals étrangers accélèrent le développement technologique."
 ALG_cnan_trait_shipyard_modernization: "Modernisation des chantiers navals"
 ALG_cnan_trait_shipyard_modernization_desc: "Moderniser les installations du chantier avec des équipements de construction avancés."
 ALG_ersa_trait_mro_expertise: "Expertise MRO"
 ALG_ersa_trait_mro_expertise_desc: "L'expertise en maintenance, réparation et révision assure une fiabilité maximale des aéronefs."
 ALG_ersa_trait_licensed_assembly: "Assemblage d'aéronefs sous licence"
 ALG_ersa_trait_licensed_assembly_desc: "Assembler sous licence des aéronefs étrangers à moindre coût."
 ALG_ersa_trait_transport_specialization: "Spécialisation Avions de Transport"
 ALG_ersa_trait_transport_specialization_desc: "Se concentrer sur les aéronefs de transport militaire à l'autonomie et à l'efficacité étendues."
 ALG_ersa_trait_production_expansion: "Initiative d'expansion de la production"
 ALG_ersa_trait_production_expansion_desc: "Étendre les installations pour accroître la capacité de production d'aéronefs."
 ALG_resistance_power_struggle: "La lutte pour le pouvoir"
 ALG_resistance_power_struggle_desc: "Une guerre silencieuse fait rage entre le peuple algérien et *Le Pouvoir*. Les deux camps cherchent à consolider leur soutien jusqu'à ce que l'affrontement inévitable décide de l'avenir de l'Algérie."
 Resistance_support: "Soutenir la résistance"
 Resistance_support_desc: "Canaliser des ressources vers les mouvements de terrain, les manifestations et les réseaux clandestins, renforçant le défi du peuple à l'élite dirigeante."
 ALG_increase_resistance_tt: "§YLe peuple se renforce tandis que l'influence de l'armée diminue.§!"
 Le_Pouvoir_support: "Soutenez *Le Pouvoir*"
 Le_Pouvoir_support_desc: "Soutien direct à l'élite enracinée, renforçant son contrôle de l'armée et affaiblissant les griefs du peuple."
 ALG_increase_pouvoir_tt: "§YL'armée consolide son contrôle tandis que le peuple perd son élan.§!"
 Resistance_Final_Clash: "L'affrontement final"
 Resistance_Final_Clash_desc: "Le conflit entre la Résistance et *Le Pouvoir* a atteint son paroxysme. Les mois à venir détermineront qui gouverne vraiment l'Algérie."
 alg_resistance.1.t: "Le peuple triomphe !"
 alg_resistance.1.d: "Les voix du peuple se sont élevées contre les élites dirigeantes. Des manifestations massives et une organisation populaire ont forcé le gouvernement à céder. L'Algérie entre dans une nouvelle ère de gouvernance démocratique."
 alg_resistance.1.a: "Le peuple a parlé."
 alg_resistance.2.t: "Le Pouvoir écrase la résistance"
 alg_resistance.2.d: "L'élite enracinée, soutenue par l'armée, a réussi à réprimer la résistance. Le statu quo demeure, mais un mécontentement latent menace de futurs troubles."
 alg_resistance.2.a: "L'ordre a été restauré."
 alg_resistance.3.t: "Une nation en plein chaos"
 alg_resistance.3.d: "Ni la Résistance ni Le Pouvoir n'ont réussi à s'affirmer. Le vide de pouvoir a plongé l'Algérie dans le chaos, des hommes forts militaires et des factions se disputant le contrôle."
 alg_resistance.3.a: "Le pays vacille au bord de l'effondrement."
 alg_resistance.4.t: "La crise algérienne s'aggrave"
 alg_resistance.4.d: "La junte fragile ne peut tenir l'État ensemble et l'Algérie s'enfonce davantage dans les troubles. Les officiers peuvent rendre le pays à un gouvernement civil tant qu'il reste un pays à rendre, ou s'entêter et laisser venir les groupes armés."
 alg_resistance.4.a: "Remettre le pouvoir à un gouvernement civil."
 ALG_african_union_tt: "L'Algérie renforce ses liens au sein de l'§YUnion africaine§!, améliorant les relations avec les États membres africains."
 KBY_alg_modifier_desc: "La Petite-Russie est un État créé relativement récemment ; sa politique intérieure et étrangère est entièrement subordonnée à Moscou, mais il conserve une grande autonomie en politique intérieure et étrangère."
 KBY_new_state: "Terre pour les Berbères"
 KBY_new_state_desc: "Enfin, la véritable héritière de ces terres, les Berbères, prendra le pouvoir en ses mains"
 KBY_constitution: "La Constitution de Kabylie"
 KBY_constitution_desc: "Nous devons formaliser notre législation d'État. Pour cela, nous adopterons notre propre constitution."
 KBY_drs: "Coopération avec le DRS"
 KBY_fsb_desc: "Malheureusement, nous n'avons pas encore la possibilité de créer nos propres services spéciaux, aussi nous nous appuierons sur la coopération avec le DRS de l'Algérie"
 KBY_mvd: "Subordonner le ministère local de l'Intérieur"
 KBY_mvd_desc: "Nous subordonnerons les organes locaux du ministère de l'Intérieur, qui étaient sous le pouvoir français"
 KBY_ter_defence: "Défense territoriale"
 KBY_ter_defence_desc: "Nous créerons une défense territoriale à partir de la milice locale"
 KBY_contract_army: "Système d'armée sous contrat"
 KBY_contract_army_desc: "Notre armée sera créée selon le système de contrat"
 KBY_defence_doctrine: "Doctrine défensive"
 KBY_defence_doctrine_desc: "Nous n'attaquons personne : notre tâche est de défendre nos frontières. Notre armée adoptera la doctrine de tactiques défensives"
 KBY_nat_guard: "La Garde nationale de Kabylie"
 KBY_nat_guard_desc: "Jadis, dans les années 80, l'Algérie avait une garde nationale. Nous recréerons cette division, mais sous notre commandement"
 KBY_defence_prom: "Industrie militaire"
 KBY_defence_prom_desc: "Nous investirons des fonds importants dans la restauration de l'industrie militaire sur notre territoire. Nous avons besoin d'une armée forte"
 KBY_rebuild_war_academy: "Écoles militaires"
 KBY_rebuild_war_academy_desc: "Nos combattants doivent avoir la meilleure formation pour défendre leur patrie. Aussi raviverons-nous les académies militaires sur notre territoire"
 KBY_no_corrupt_military: "Réduire sérieusement la corruption dans l'armée"
 KBY_no_corrupt_military_desc: "Notre armée est encore jeune, aussi est-il bien plus facile d'y éliminer la corruption"
 KBY_nation_quest: "La question nationale"
 KBY_nation_quest_desc: "La Kabylie était et restera une partie de l'Algérie : telle est notre réponse à la question nationale"
 KBY_referendum: "Référendum sur le destin de la Kabylie"
 KBY_referendum_desc: "L'heure fatidique est venue de décider du chemin de notre pays. Devons-nous devenir une partie à part entière de la Russie, sous forme de république, ou choisir la voie de l'État de l'Union"
 KBY_dinar: "Le dinar comme monnaie d'État"
 KBY_dinar_desc: "Le dinar sera notre monnaie d'État : personne n'en a jamais douté"
 KBY_corruption: "Lutte contre la corruption"
 KBY_corruption_desc: "Bien que notre État soit encore jeune, les fonctionnaires corrompus s'y sont déjà installés. Il faut s'en occuper"
 KBY_isr_invest: "Investissements en Israël"
 KBY_isr_invest_desc: "Israël nous soutient par ses investissements"
 KBY_build_factories: "Construction d'usines"
 KBY_build_factories_desc: "Le pays a besoin d'usines : nous fournirons à notre peuple tout le nécessaire"
 KBY_social_invest: "Investissements dans le social"
 KBY_social_invest_desc: "Nos citoyens doivent avoir accès à des établissements de santé de la meilleure qualité, ainsi qu'à toutes les garanties sociales"
 KBY_infrastructure: "Investissements d'infrastructure"
 KBY_infrastructure_desc: "Les routes sont les veines de notre État"
 KBY_fight_oligarch: "La lutte contre les oligarques"
 KBY_fight_oligarch_desc: "Même dans notre jeune État, des oligarques corrompus ont déjà surgi, enrichis par la guerre. Occupons-nous d'eux"
 KBY_it_invest: "Investir dans l'informatique"
 KBY_it_invest_desc: "Nous investirons dans les technologies de l'information pour le développement réussi de notre pays"
 KBY_maloross_economy: "Économie de la Kabylie"
 KBY_maloross_economy_desc: "Nos mesures économiques ont entraîné la croissance de notre économie"
 KBY_union_state: "État de l'Union"
 KBY_union_state_desc: "Nous avons choisi la voie de l'État de l'Union"
 KBY_union_group_army: "Groupement conjoint de troupes"
 KBY_union_group_army_desc: "Nos soldats intégreront le groupement interarmées des troupes de l'État de l'Union"
 KBY_union_group_economic: "Investissements de l'État de l'Union"
 KBY_union_group_economic_desc: "L'appartenance à l'État de l'Union a eu un impact positif sur notre économie"
 KBY_union_health_social: "Coopération sociale et médicale"
 KBY_union_health_social_desc: "Les membres de l'État de l'Union coopèrent activement dans les sphères sociale et médicale"
 KBY_republic_rf: "Nous faisons partie de l'Algérie"
 KBY_republic_rf_desc: "Nous sommes devenus une république d'Algérie : désormais notre destin lui est lié"
 KBY_alg_regions: "Coopération avec les régions algériennes"
 KBY_alg_regions_desc: "Nous coopérerons activement avec les autres régions d'Algérie"
 KBY_fra_companies: "Coopération avec les entreprises françaises"
 KBY_fra_companies_desc: "Les entreprises françaises seront nos principaux partenaires"
 KBY_integrate_army: "Intégration à l'armée algérienne"
 KBY_integrate_army_desc: "Nous porterons notre armée aux standards de l'armée algérienne"
 ALG_legacy_of_independence_war: "Héritage de la guerre d'indépendance algérienne"
 ALG_legacy_of_independence_war_desc: "La lutte contre la domination coloniale française a forgé un puissant sentiment d'identité nationale et d'unité. Cet héritage durable renforce notre pouvoir politique, accélère la recherche et la modernisation, et accroît l'influence de l'Algérie à l'étranger. Pourtant, les clivages idéologiques et les mémoires historiques continuent de modeler l'opinion intérieure et les relations extérieures."
 ALG_new_nobility_idea: "Noblesse renouvelée"
 ALG_new_nobility_idea_desc: "En restaurant les privilèges nobiliaires et en créant une aristocratie loyale, la monarchie consolide son pouvoir, récompensant la fidélité par l'influence et le prestige."
 ALG_state_islam_idea: "L'islam comme État"
 ALG_state_islam_idea_desc: "La monarchie formalise l'islam comme principe directeur de l'État, renforçant les oulémas et inscrivant la charia dans la gouvernance, au détriment du progrès scientifique."
 ALG_andalus_crusade_idea: "Héritage d'al-Andalus"
 ALG_andalus_crusade_idea_desc: "Le rêve de reconquérir al-Andalus nourrit la cause du califat, inspirant les guerriers et légitimant l'expansion dans la péninsule Ibérique."
 ALG_maghribi_identity_idea: "Identité maghrébine"
 ALG_maghribi_identity_idea_desc: "La monarchie promeut une identité maghrébine distincte, ancrée dans une culture et une unité partagées, renforçant la stabilité tout en éloignant l'influence étrangère."
 ALG_maghribi_identity_idea_two: "Le vrai maghribisme"
 ALG_maghribi_identity_idea_two_desc: "Du Maroc à la Libye, le Maghreb s'unit autour d'un destin unique. La monarchie incarne cette vision, réduisant l'ingérence étrangère et liant la région."
 ALG_renewed_nobility_idea: "Chevalerie restaurée"
 ALG_renewed_nobility_idea_desc: "Les chevaliers du royaume reviennent, honorés comme une élite militaire et politique loyale. Leur rôle renouvelé resserre l'emprise de la monarchie tout en abaissant le coût du commandement."
 ALG_going_to_roots: "Retour à nos racines"
 ALG_going_to_roots_desc: "Les dynasties maghrébines et andalouses ont posé les fondements de l'identité algérienne. En embrassant ces traditions, nous unirons passé et présent en une seule vision pour la nation."
 ALG_state_islam: "L'islam comme foi d'État"
 ALG_state_islam_desc: "La religion a toujours guidé le peuple algérien. En proclamant l'islam fondement de la monarchie, nous consolidons notre légitimité, gagnons la faveur des oulémas et renforçons l'unité des fidèles."
 ALG_restore_knighthood: "Restaurer la chevalerie"
 ALG_restore_knighthood_desc: "À l'âge des empires, des ordres de guerriers et de nobles défendaient notre terre et notre foi. Nous restaurerons de tels ordres chevaleresques pour servir le trône et inspirer la loyauté des armes."
 ALG_andalus_legacy: "Héritage d'al-Andalus"
 ALG_andalus_legacy_desc: "Notre renouveau andalou ne concerne pas seulement le trône. Il s'agit de ranimer la fierté perdue des musulmans chassés d'Ibérie il y a des siècles. Nous étendrons notre influence et rappellerons à l'Europe qu'al-Andalus n'est pas oublié."
 ALG_our_old_realm: "Notre ancien royaume"
 ALG_our_old_realm_desc: "Nous avons jadis régné sur des terres d'Ibérie sous la bannière d'al-Andalus. Par des ouvertures diplomatiques et la mémoire historique, nous revendiquerons nos anciennes terres et préparerons leur retour."
 ALG_renewed_nobility: "Noblesse renouvelée"
 ALG_renewed_nobility_desc: "De nouvelles maisons nobiliaires doivent être forgées pour servir la monarchie. Les anciennes familles seront restaurées et de nouvelles élites élevées, afin de fournir à l'Algérie de loyaux serviteurs de la couronne."
 ALG_politic_outreach_iberia: "Ouverture politique en Ibérie"
 ALG_politic_outreach_iberia_desc: "En soutenant des forces sympathisantes en Espagne et au Portugal, nous pouvons étendre l'influence de l'Algérie vers l'ouest. Notre appui aux mouvements ibériques renforcera nos revendications et affaiblira leurs États."
 ALG_fate_of_spain: "Le destin de l'Espagne"
 ALG_fate_of_spain_desc: "L'Espagne siège sur la terre de nos ancêtres. Son destin peut désormais se décider de la main de l'Algérie, par l'union, la reconquête ou la conquête."
 ALG_true_maghribism: "Le vrai maghribisme"
 ALG_true_maghribism_desc: "L'heure est venue de proclamer notre propre vision : une idéologie ancrée dans l'identité maghrébine, l'unité islamique et la fierté monarchiste. La doctrine du maghribisme inspirera un nouvel ordre en Afrique du Nord."
 ALG_glory_of_andalus_idea: "Gloire d'al-Andalus"
 ALG_glory_of_andalus_idea_desc: "Un renouveau culturel, inspiré par l'héritage d'al-Andalus, galvanise nos savants, artisans et souverains. Il unit la nation autour d'une mémoire partagée et fière."
 ALG_spain_algeria_union_tt: "Débloque des décisions d'union avec l'Espagne sous la monarchie algérienne."
 ALG_trade_with_arabic_nations_tt: "L'Algérie établit des accords commerciaux améliorés avec toutes les nations arabes."
 ALG_loas_influence_tt: "L'Algérie accroît son influence parmi les États membres de la Ligue arabe par des efforts diplomatiques et des accords d'amitié."
 ALG_isr_threat: "L'Algérie condamne l'agression israélienne"
 ALG_palestinian_aid_package_tt: "L'Algérie fournit une aide à la Palestine et accroît son influence dans toutes les nations du Moyen-Orient."
 ALG_african_union_reforms_tt: "L'Algérie a établi des accords commerciaux améliorés avec tous les États membres de l'OUA."
 ALG_mutual_defense_idea: "Défense mutuelle"
 ALG_mutual_defense_idea_desc: ""
 ALG_the_State: "L'État algérien"
 ALG_unlocks_focus_for_us: "§CDébloque une décision qui nous permettra de retirer les malus que nous subissons de ceci !§!"
 ALG_activate_from_event: "§HCes axes sont activés par un événement ou une décision§!"
 ALG_our_society: "Société algérienne"
 ALG_our_society_desc: "La société algérienne change et évolue sans cesse. Bien que le rôle du gouvernement soit généralement limité par certaines contraintes, il a parfois fallu intervenir, et il faudra encore intervenir pour adapter nos politiques."
 ALG_DRS: "Le DRS"
 ALG_DRS_desc: "Le DRS est le service de renseignement de notre nation, chargé de protéger le gouvernement et les politiques de l'État contre les menaces internes et externes."
 ALG_domestic_focus: "Concentration nationale"
 ALG_domestic_focus_desc: "Le DRS doit se concentrer sur la protection de la nation contre les menaces intérieures, tels les acteurs qui veulent renverser le gouvernement en répandant des idéaux dangereux."
 ALG_foreign_focus: "Priorité étrangère"
 ALG_foreign_focus_desc: "Le DRS doit s'inquiéter des menaces hors de nos frontières, car nul ne souhaiterait jamais nuire à sa propre nation."
 ALG_disaster_relief: "Plan catastrophe"
 ALG_disaster_relief_desc: "Nous n'avons actuellement aucun plan catastrophe, ce qui signifie que nous ne sommes pas prêts à protéger et secourir nos citoyens."
 ALG_charity_based: "Établir un système dirigé par des organismes caritatifs"
 ALG_charity_based_desc: "Les œuvres de charité couvriront notre peuple lorsque le désastre frappera, ce qui nous permettra de réduire nettement les dépenses."
 ALG_government_reliant: "Établir un système dirigé par l'État"
 ALG_government_reliant_desc: "C'est le devoir du gouvernement de porter secours à son peuple lorsque le désastre frappe, même si cela accroît nos dépenses."
 ALG_migration_problems: "Problèmes de migration"
 ALG_migration_problems_desc: "Nous avons toujours eu des problèmes d'afflux de migrants… Mais nous n'avons jamais su que faire d'eux une fois leurs difficultés terminées dans leur pays d'origine."
 ALG_open_door_policy: "Politique de la porte ouverte"
 ALG_open_door_policy_desc: "En optant pour une politique de portes ouvertes, nous pourrons facilement mobiliser les migrants pour mieux développer la nation."
 ALG_closed_borders: "Fermer les frontières"
 ALG_closed_borders_desc: "Nous pouvons entièrement supprimer l'arrivée de migrants en fermant simplement nos frontières, et ainsi nos problèmes."
 ALG_drug_problem: "Le problème de la drogue"
 ALG_drug_problem_desc: "Parfois, les drogues sont nécessaires à usage médical, mais cela n'empêche pas certains d'abuser du système et de les utiliser à des fins récréatives, avec des conséquences dangereuses."
 ALG_tighten_punishments: "Position plus dure"
 ALG_tighten_punishments_desc: "Nous criminaliserons quiconque utilise des drogues à d'autres fins que médicales, quelles que soient les excuses."
 ALG_relax_restrictions: "Assouplir notre position"
 ALG_relax_restrictions_desc: "Même si notre peuple souhaite utiliser des drogues à des fins récréatives, pourquoi nous en soucier ? Peut-être devrions-nous les laisser faire, malgré certains risques."
 ALG_rising_nationalism: "Montée du nationalisme"
 ALG_rising_nationalism_desc: "Si le nationalisme peut être une bonne chose, trop de nationalisme est néfaste. Au sein de la nation, il a provoqué des troubles et des affrontements entre groupes minoritaires."
 ALG_utilize_it: "Utiliser le nationalisme"
 ALG_utilize_it_desc: "Nous utiliserons le nationalisme à notre avantage, afin que l'ennemi sache que le peuple algérien ne restera pas les bras croisés en temps de guerre."
 ALG_combat_it: "Combattez-le"
 ALG_combat_it_desc: "Nous allons devoir combattre le nationalisme, car nous ne pouvons pas risquer davantage d'instabilité à l'intérieur de nos frontières."
 ALG_charity_disasters: "Plan d'entraide caritative"
 ALG_charity_disasters_desc: "Notre plan catastrophe repose sur la générosité des citoyens et les dons pour porter secours en temps de besoin"
 ALG_government_led_disasters: "Plan dirigé par l'État"
 ALG_government_led_disasters_desc: "Le gouvernement va fournir une aide aux victimes de catastrophes naturelles plutôt que les œuvres de charité, même si celles-ci restent libres de contribuer"
 ALG_drugs_illegalized: "Drogues criminalisées"
 ALG_drugs_illegalized_desc: "Quiconque utilise des drogues à d'autres fins que médicales aura affaire à la justice"
 ALG_drugs_legalized: "Drogues légalisées"
 ALG_drugs_legalized_desc: "Peu nous importe l'usage que les gens font des drogues : c'est leur vie"
 ALG_drs_idea_1: "Police militarisée"
 ALG_drs_idea_1_desc: "La police a été réorganisée en force paramilitaire capable de gérer le terrorisme, les émeutes et les troubles, lui donnant un rôle plus fort dans la sécurité intérieure de l'Algérie."
 ALG_drs_idea_2: "Une police fortement militarisée"
 ALG_drs_idea_2_desc: "La police opère désormais comme un corps paramilitaire lourdement armé, avec un matériel avancé et des liens étroits avec l'armée, brouillant la frontière entre sécurité civile et contrôle militaire."
 ALG_drs_idea_3: "Police militarisée intégrée"
 ALG_drs_idea_3_desc: "Nos forces de police sont pleinement intégrées à l'appareil de sécurité, opérant aux côtés de l'armée dans la lutte antiterroriste, la défense des frontières et la surveillance intérieure."
 ALG_riot_police_idea: "Police anti-émeute"
 ALG_riot_police_idea_desc: "Une branche spécialisée conçue pour gérer manifestations, cortèges et troubles sociaux. Elle est équipée de matériel anti-émeute et met l'accent sur la stabilité du régime."
 ALG_algerian_special_forces: "Former les forces spéciales algériennes"
 ALG_algerian_special_forces_desc: "Les menaces pesant sur l'Algérie exigent des unités d'élite capables d'intervention rapide et de lutte antiterroriste. Établir des forces spécialisées renforcera notre défense contre les troubles internes comme les dangers extérieurs."
 ALG_BRI: "Étendre la BRI"
 ALG_BRI_desc: "La Brigade de recherche et d'intervention (BRI) est une unité de police spécialisée formée au sauvetage d'otages et aux opérations à haut risque. Accroître ses effectifs et ses moyens améliorera notre sécurité urbaine."
 ALG_al_saiqa: "Unités Al-Sa'iqa"
 ALG_al_saiqa_desc: "Des unités paramilitaires spéciales de maintien de l'ordre et de contre-insurrection renforceront notre capacité à préserver l'ordre en période de troubles."
 ALG_al_hars_al_watani: "Garde nationale"
 ALG_al_hars_al_watani_desc: "Une Garde de sécurité nationale assurera la sécurité locale dans les zones vulnérables, libérera des moyens de l'armée et maintiendra l'ordre en crise."
 ALG_haras_al_hudod: "Unités de garde-frontières"
 ALG_haras_al_hudod_desc: "Des forces spécialisées patrouillant nos frontières freineront la contrebande, empêcheront l'infiltration et renforceront les défenses frontalières de l'Algérie."
 ALG_central_armed_police: "Police armée centrale"
 ALG_central_armed_police_desc: "Regrouper la police armée sous un commandement centralisé améliorera les délais de réaction et l'efficacité, assurant une poigne plus ferme contre les menaces organisées."
 ALG_border_security_force: "Force de sécurité frontalière"
 ALG_border_security_force_desc: "En créant une force dédiée à la surveillance et à l'interception aux frontières, l'Algérie frappera les réseaux de trafic et l'infiltration armée."
 ALG_firqat_tadakhol_al_sariye: "Unité d'intervention rapide"
 ALG_firqat_tadakhol_al_sariye_desc: "Des unités d'élite de réaction rapide permettront à l'Algérie de frapper vite les cellules terroristes et les crises naissantes avant qu'elles ne s'aggravent."
 ALG_expanding_BRI: "Extension des capacités de la BRI"
 ALG_expanding_BRI_desc: "Avec davantage de fonds, de formation et de matériel avancé, la BRI peut devenir une unité antiterroriste et de sauvetage d'otages redoutable, rivalisant avec les meilleures de la région."
 ALG_increase_police_funding: "Augmenter le budget de la police"
 ALG_increase_police_funding_desc: "Accroître l'investissement dans la police et la gendarmerie renforcera la stabilité intérieure, la sécurité publique et la résilience de l'Algérie face aux troubles."
 ALG_drs_expand: "Étendre le DRS"
 ALG_drs_expand_desc: "Le Département du renseignement et de la sécurité (DRS) peut encore s'étendre, renforçant le recueil de renseignement et le contre-espionnage."
 ALG_new_gendarmerie_equipment: "Nouvel équipement pour la gendarmerie"
 ALG_new_gendarmerie_equipment_desc: "Notre gendarmerie doit être correctement armée et équipée pour affronter le terrorisme, le crime et les troubles intérieurs."
 ALG_mia_reform: "Réformer le ministère de l'Intérieur"
 ALG_mia_reform_desc: "Centraliser le commandement sous le ministère de l'Intérieur rationalisera la gestion de la sécurité intérieure, assurant des réponses plus rapides et mieux coordonnées."
 ALG_internal_troops: "Troupes internes"
 ALG_internal_troops_desc: "Des troupes intérieures paramilitaires sous commandement de l'État renforceront la lutte contre l'insurrection et les réseaux criminels."
 ALG_increase_special_forces: "Accroître les forces spéciales"
 ALG_increase_special_forces_desc: "Nos forces d'élite ont besoin d'un recrutement élargi et de programmes de formation spécialisés pour affronter les menaces sophistiquées de la guerre moderne."
 ALG_cybercrime_directorate: "Direction de la cybercriminalité"
 ALG_cybercrime_directorate_desc: "La création d'une direction de lutte contre la cybercriminalité protégera l'Algérie de l'espionnage numérique, des cyberattaques et des campagnes de désinformation hostiles."
 ALG_riot_police: "Unités de police anti-émeute"
 ALG_riot_police_desc: "Des unités de police anti-émeute organisées assureront le contrôle des foules et une réponse disciplinée aux manifestations de masse, garantissant la stabilité."
 ALG_military_police_training: "Formation de la police militaire"
 ALG_military_police_training_desc: "Des programmes de formation pour la police militaire accroîtront la discipline, réduiront les désertions et amélioreront la gestion de l'occupation dans les régions instables."
 ALG_peoples_security: "Sécurité populaire"
 ALG_peoples_security_desc: "Une doctrine de « sécurité du peuple » renforcera la coopération civilo-militaire, le moral, et intégrera les populations locales à la défense nationale."
 ALG_procurement_of_espionage_equipment: "Acquisition de matériel d'espionnage"
 ALG_procurement_of_espionage_equipment_desc: "Investir dans des technologies de surveillance et d'espionnage avancées renforcera notre capacité à détecter et neutraliser les menaces internes et étrangères."
 ALG_occupation_management_strategies: "Stratégies de gestion des professions"
 ALG_occupation_management_strategies_desc: "De nouvelles stratégies de gestion des zones occupées ou instables minimiseront la résistance, réduiront les pertes et consolideront l'autorité de l'État."
 ALG_french_weapons: "Importer des armes françaises"
 ALG_french_weapons_desc: "En acquérant des armes légères et du matériel français, l'Algérie peut moderniser rapidement son infanterie tout en resserrant les liens avec Paris."
 ALG_russian_guns: "Importer des armes russes"
 ALG_russian_guns_desc: "Les armes légères russes, livrées en masse, fournissent à l'Algérie un armement durable et fiable, renforçant notre partenariat de défense traditionnel avec Moscou."
 ALG_algerian_space_programme: "Établir ASAL"
 ALG_algerian_space_programme_desc: "L'Agence spatiale algérienne (ASAL) coordonnera toutes les activités spatiales nationales, du développement de satellites à la coopération internationale en recherche spatiale."
 ALG_alsat_initiative: "Initiative AlSat"
 ALG_alsat_initiative_desc: "Le projet AlSat dote l'Algérie de ses premiers satellites, dédiés à l'observation de la Terre et aux communications, marquant notre entrée dans l'ère spatiale."
 ALG_alsat2_series: "Série AlSat-2"
 ALG_alsat2_series_desc: "Le développement de satellites AlSat-2 avancés renforcera nos capacités de surveillance, de communications et de télédétection."
 ALG_finance_private_space_companies: "Financer des entreprises spatiales privées"
 ALG_finance_private_space_companies_desc: "Encourager le secteur privé algérien à participer à l'industrie spatiale renforcera notre base technologique nationale."
 ALG_regional_satnet: "Réseau satellitaire régional"
 ALG_regional_satnet_desc: "Nous relierons nos satellites en un réseau régional, intégrant usages civils et militaires tout en connectant l'Algérie à ses voisins."
 ALG_asal_lunar_project: "Projet lunaire ASAL"
 ALG_asal_lunar_project_desc: "L'agence spatiale algérienne lancera un projet ambitieux d'étude de l'exploration lunaire et de progrès en fuséologie."
 ALG_human_spaceflight: "Programme de vols habités"
 ALG_human_spaceflight_desc: "Notre programme spatial fera un pas audacieux : planifier le premier vol habité algérien en partenariat avec des alliés internationaux."
 ALG_orbital_defense_program: "Programme de défense orbitale"
 ALG_orbital_defense_program_desc: "Les satellites peuvent aussi servir à la défense. Développer des capacités de défense orbitale protégera l'Algérie des menaces futures."
 ALG_alsat_future: "L'avenir d'AlSat"
 ALG_alsat_future_desc: "L'avenir du programme spatial algérien repose sur un investissement soutenu, des partenariats public-privé et une planification scientifique de long terme."
 ALG_cyber_sat_integration: "Intégration cyber-satellite"
 ALG_cyber_sat_integration_desc: "Fusionner les capacités de cyberguerre avec notre réseau satellitaire donnera à l'Algérie un outil asymétrique puissant dans le conflit moderne."
 ALG_idea_the_new_space_race: "La nouvelle course à l'espace"
 ALG_idea_the_new_space_race_desc: "L'Algérie est entrée dans la course spatiale mondiale, rivalisant avec les grandes puissances pour prouver sa force technologique et stratégique."
 ALG_idea_cyberwarfare_2: "Intégration cyber-satellite"
 ALG_idea_cyberwarfare_2_desc: "Le commandement cyber algérien est désormais intégré à nos systèmes satellitaires, offrant une sécurité des communications supérieure et des capacités offensives."
 ALG_algeria_police_modifier: "Sécurité intérieure de l'Algérie"
 ALG_algeria_police_modifier_desc: "Le gouvernement algérien a une vaste expérience, depuis son époque au sein de l'URSS, pour réprimer la dissidence et les agents ennemis."
 ALG_algeria_police_modifier_tt_intro: "Modifier §Y$ALG_algeria_police_modifier$§! de"
 ALG_algeria_support_category: "Troupes auxiliaires d'Algérie"
 ALG_stabilize_mali: "Stabiliser le Mali"
 ALG_stabilize_mali_desc: "L'instabilité du Mali menace tout le Sahel. L'Algérie, forte de son expérience en contre-insurrection et en diplomatie, doit intervenir pour stabiliser son voisin du sud, par la force, la négociation ou l'influence."
 ALG_back_tuareg_rebellion: "Soutenir la rébellion touarègue"
 ALG_back_tuareg_rebellion_desc: "Plutôt que de soutenir Bamako, nous pouvons renforcer les rebelles touaregs qui visent l'autonomie au nord du Mali. Cela affaiblira l'autorité centrale malienne et accroîtra notre levier dans la région."
 ALG_support_malian_army: "Soutenir l'armée malienne"
 ALG_support_malian_army_desc: "L'Algérie peut au contraire appuyer directement le gouvernement malien, en fournissant un soutien politique et militaire pour renforcer son armée contre les insurgés."
 ALG_promote_tuareg_dialogue: "Promouvoir le dialogue touareg"
 ALG_promote_tuareg_dialogue_desc: "Plutôt que de choisir un camp, l'Algérie pourrait accueillir des pourparlers entre les rebelles touaregs et l'État malien, se positionnant comme médiatrice et stabilisatrice au Sahel."
 ALG_support_tuareg_politicians: "Soutenez les hommes politiques touaregs"
 ALG_support_tuareg_politicians_desc: "Au-delà du champ de bataille, l'influence touarègue peut aussi se construire par des canaux politiques. Soutenir des dirigeants touaregs modérés donnera à l'Algérie des alliés de long terme au Mali."
 ALG_aid_malian_army: "Aider l'armée malienne"
 ALG_aid_malian_army_desc: "L'Algérie peut envoyer armes, véhicules et systèmes de commandement pour renforcer la capacité de l'armée malienne à combattre les insurgés et stabiliser le pays."
 ALG_mali_stabilized: "Mali stabilisé"
 ALG_mali_stabilized_desc: "Après des années de troubles, les efforts de l'Algérie ont payé. Le conflit malien est sous contrôle, la rébellion touarègue contenue, et l'Algérie s'affirme comme puissance stabilisatrice du Sahel."
 ALG_tuareg_autonomy_victory: "Victoire de l’autonomie touarègue"
 ALG_tuareg_autonomy_victory_desc: "Le mouvement touareg a obtenu la reconnaissance de son autonomie. Avec l'appui de l'Algérie, les Touaregs détiennent désormais le pouvoir politique et le Mali affronte un nouvel équilibre d'autorité au Sahel."
 Algeria.237.t: "Intervention algérienne au Mali"
 Algeria.237.d: "L'Algérie a déclaré son intention de stabiliser le Mali, invoquant le terrorisme, le séparatisme touareg et l'instabilité régionale. Avec Alger qui envoie troupes, aide et pression politique vers le sud, l'équilibre des forces au Mali bascule. Que cela apporte la paix ou un conflit plus profond reste à voir."
 Algeria.237.a: "L'Algérie prend la tête au Sahel."
 Algeria.409.t: "Initiative de dialogue touareg"
 Algeria.409.d: "L'Algérie a commencé à promouvoir le dialogue avec des représentants touaregs au Mali et dans le Sahel. Si certains à Alger y voient un chemin vers la paix, d'autres craignent que légitimer les revendications touarègues n'encourage le séparatisme. Le gouvernement doit décider jusqu'où soutenir cette initiative."
 Algeria.409.a: "S'engager par le culturel et les médias"
 Algeria.409.b: "Apporter un soutien discret à la direction touarègue"
 ALG_TUA_REV_TT: "[TUA.GetFlag] La §Hrésistance touarègue§! a été soutenue par l'Algérie, menant à la création d'une §Yrégion autonome touarègue§! (ou potentiellement d'un §Gnouvel État touareg§!) au Mali."
 ALG_MAL_STABILIZED_TT: "[MAL.GetFlag] Le §HMali§! a été §Gstabilisé§! avec le soutien algérien, assurant la paix et réduisant le risque d'un nouveau conflit."
 ALG_algerian_intervention: "Doctrine d'intervention régionale"
 ALG_algerian_intervention_desc: "L'Algérie a longtemps agi comme courtier de pouvoir régional. Face à l'instabilité qui menace notre voisinage, nous devons décider d'intervenir directement dans les conflits régionaux pour sauvegarder nos intérêts nationaux."
 ALG_intervene_in_sahrawi: "Intervenir au Sahara"
 ALG_intervene_in_sahrawi_desc: "Le conflit entre le Maroc et la République arabe sahraouie démocratique reste non résolu. L'Algérie doit intervenir diplomatiquement, ou militairement, pour protéger ses frontières et renforcer son influence au Maghreb."
 ALG_supp_polisario: "Soutenir le Front Polisario"
 ALG_supp_polisario_desc: "La lutte sahraouie pour l'indépendance est au cœur de la politique régionale algérienne. En fournissant armes et soutien au Front Polisario, nous pouvons affaiblir le Maroc et accroître notre influence au Sahara occidental."
 ALG_a_new_stance: "Une nouvelle position envers le Maroc"
 ALG_a_new_stance_desc: "L'Algérie s'est traditionnellement opposée au contrôle marocain du Sahara occidental, mais les vents politiques exigent du pragmatisme. S'aligner avec le Maroc pourrait réduire les tensions, ouvrir de nouvelles opportunités économiques et nous donner un levier au Maghreb."
 ALG_intervene_in_libya: "Intervenir en Libye"
 ALG_intervene_in_libya_desc: "Le chaos en Libye menace de déborder nos frontières. L'Algérie ne peut se permettre l'instabilité chez son voisin. Par l'action militaire, la diplomatie ou l'influence clandestine, nous devons sécuriser nos intérêts en Libye."
 ALG_assassinate_gaddafi: "Assassiner Kadhafi"
 ALG_assassinate_gaddafi_desc: "Le règne de Mouammar Kadhafi déstabilise toute la région. En orchestrant sa chute, l'Algérie peut accélérer le changement de régime en Libye et assurer l'émergence d'un gouvernement plus favorable, même si cela plonge la Libye dans la guerre civile."
 ALG_peacekeepers: "Envoyer des casques bleus en Libye"
 ALG_peacekeepers_desc: "Plutôt que de plonger davantage la Libye dans le chaos, l'Algérie pourrait intervenir comme force de maintien de la paix. Déployer des troupes pour stabiliser la situation renforcerait notre image de puissance régionale responsable et nous donnerait une influence durable à Tripoli."
 ALG_pulse.1.t: "Le désert du Sahara s'agrandit"
 ALG_pulse.1.d: "Selon les dernières données, le Sahara poursuit son expansion régulière. Les zones de pâturage deviennent stériles, les oasis s'assèchent, et la faune comme les gazelles et les cerfs de Barbarie disparaît sous le braconnage. Le surpâturage, l'extraction minière incontrôlée et l'ignorance du braconnage ne feront qu'aggraver la désertification."
 ALG_pulse.1.a: "Un signe inquiétant"
 ALG_pulse.2.t: "Écurie du désert du Sahara"
 ALG_pulse.2.d: "Les données de cette année suggèrent que l'avance du Sahara a ralenti, la désertification se maintenant. Toutefois, sans action contre le surpâturage, le braconnage et l'usage non durable des terres, l'équilibre peut bientôt basculer à nouveau."
 ALG_pulse.2.a: "Nous devons rester vigilants"
 ALG_pulse.3.t: "Le Sahara récupère ses terres"
 ALG_pulse.3.d: "Des rapports récents indiquent que la végétation revient lentement sur certaines marges du désert. Les patrouilles anti-braconnage, le pâturage contrôlé et le reboisement semblent aider la terre à se régénérer, restaurant l'équilibre d'écosystèmes fragiles."
 ALG_pulse.3.a: "Des progrès encourageants"
 ALG_reduce_yearly_good_desertification_5: "Probabilité d'§Yoasification§! : §R-5 %§!\n"
 ALG_increase_yearly_good_desertification_5: "Probabilité d'§Yoasification§! : §G+5 %§!\n"
 ALG_increase_yearly_bad_desertification_5: "Probabilité de §Ydésertification§! : §R+5 %§!\n"
 ALG_decrease_yearly_bad_desertification_5: "Probabilité de §Ydésertification§! : §G-5 %§!\n"
 ALG_reduce_yearly_neutral_desertification_5: "Probabilité de §Ystabilisation§! : §R-5 %§!\n"
 ALG_increase_yearly_neutral_desertification_5: "Probabilité de §Ystabilisation§! : §G+5 %§!\n"
 ALG_anti_poaching_raid_successful: "§GNous avons réussi à éliminer §Y[?poachers_killed]§! braconniers!§!"
 ALG_anti_poaching_raid_normal: "§GNous parvenons à éliminer §Y[?poachers_killed]§! braconniers !§!"
 ALG_anti_poaching_raid_failure: "§RNos rangers subissent des pertes§!"
 ALG_strengthen_ENTV_environmental_campaigns: "Renforcer les campagnes environnementales de l'ENTV"
 ALG_strengthen_ENTV_environmental_campaigns_desc: "L'ENTV, notre service de radiodiffusion nationale, peut servir à sensibiliser aux enjeux environnementaux. En diffusant des campagnes sur la désertification, l'économie d'eau et la protection de la faune, nous pouvons encourager les citoyens à soutenir un avenir durable."
 ALG_increase_cattle_grazing: "Développer le pâturage du bétail"
 ALG_increase_cattle_grazing_desc: "L'élevage reste un pilier de l'économie des steppes et des hauts plateaux algériens. Étendre le pâturage des bovins et des ovins pourrait accroître les revenus ruraux, mais risque d'aggraver le surpâturage, la dégradation des sols et la désertification s'il n'est pas géré avec soin."
 ALG_optimize_pastoral_practices: "Optimiser les pratiques pastorales"
 ALG_optimize_pastoral_practices_desc: "Les méthodes de pâturage traditionnelles ont pesé lourdement sur des écosystèmes fragiles. En introduisant le pâturage rotatif, une gestion durable de l'eau et de meilleurs soins vétérinaires, nous pouvons moderniser les pratiques pastorales et réduire leur impact sur la steppe et les marges sahariennes."
 ALG_expand_steppe_farming: "Développer l’agriculture des steppes"
 ALG_expand_steppe_farming_desc: "Les régions steppiques de l'Algérie, entre l'Atlas tellien et le Sahara, sont vitales pour les céréales et l'élevage. En investissant dans l'irrigation et la remise en culture, nous pouvons accroître la mise en valeur, au risque toutefois d'un stress environnemental accru."
 ALG_research_drought_resistant_crops: "Rechercher des cultures résistantes à la sécheresse"
 ALG_research_drought_resistant_crops_desc: "Le changement climatique et la désertification menacent la sécurité alimentaire de l'Algérie. En investissant dans la recherche de cultures résistantes à la sécheresse, céréales robustes et variétés de dattiers, nous pouvons protéger notre agriculture contre l'aridité croissante."
 ALG_shrink_nature_reserves_sahara: "Réduire les réserves naturelles du Sahara"
 ALG_shrink_nature_reserves_sahara_desc: "Certains estiment que de vastes réserves naturelles du Sahara pourraient être reconverties à l'agriculture, au pâturage ou à l'industrie. Réduire ces réserves permettrait le développement, mais à un lourd coût environnemental."
 ALG_expand_nature_reserves_sahara: "Agrandir les réserves naturelles du Sahara"
 ALG_expand_nature_reserves_sahara_desc: "Protéger les écosystèmes fragiles du Sahara est essentiel à la biodiversité et à l'équilibre environnemental de long terme. En étendant les aires protégées, nous pouvons sauvegarder les espèces menacées et réduire les pressions qui alimentent la désertification."
 ALG_drs: "Le DRS"
 ALG_drs_desc: "Le Département du renseignement et de la sécurité (DRS) algérien a été forgé pendant la sanglante Décennie noire et est devenu tristement célèbre pour ses vastes pouvoirs. Officiellement bouclier contre le terrorisme et l'infiltration étrangère, le DRS intervient aussi lourdement en politique, assurant la préservation de l'autorité et de la stabilité de l'État, fût-ce au prix des libertés civiles."
 ALG_decline_of_tourism: "Déclin du tourisme"
 ALG_destroyed_agriculture: "Agriculture détruite"
 ALG_tikjda_resort: "Station de ski de Tikjda"
 ALG_algerian_tourism: "Tourisme en Algérie"
 ALG_natural_products_idea: "Produits naturels algériens"
 ALG_sonatrach: "Agrandissement de Sonatrach"
 algeria_invest.1.t: "Investissements en Algérie"
 algeria_invest.1.d: "L'Algérie nous demande d'investir dans son État. Grâce à ces investissements, nous pourrons renforcer notre influence en Afrique du Nord et le long de la côte méditerranéenne."
 algeria_invest.1.a: "Okay"
 algeria_invest.1.b: "No"
 algeria_invest.2.t: "Ils ont accepté"
 algeria_invest.2.d: "Ils ont accepté d'investir dans notre pays."
 algeria_invest.2.a: "Good."
 algeria_invest.3.t: "Ils ont refusé"
 algeria_invest.3.d: "Ils ont refusé d'investir dans notre pays, estimant notre offre non rentable."
 algeria_invest.3.a: "Sad"
 algeria_invest.4.t: "Investissements américains en Algérie"
 algeria_invest.4.d: "L'Algérie offre à nos entreprises d'investir dans son économie. En retour, nous gagnerons de l'influence et, à terme, renforcerons nos relations avec l'Algérie."
 algeria_invest.4.a: "Qui a dit argent ?"
 algeria_invest.4.b: "No"
 algeria_invest.5.t: "L’Amérique était d’accord."
 algeria_invest.5.d: "Des entreprises américaines ont déjà commencé à planifier des projets d'investissement en Algérie."
 algeria_invest.5.a: "Une victoire pour les affaires et la démocratie."
 algeria_invest.6.t: "L'Amérique a refusé"
 algeria_invest.6.d: "L'Amérique a refusé d'investir dans notre économie. Elle n'a aucune confiance dans la transparence de notre système politique."
 algeria_invest.6.a: "Eh bien, nous appellerons l'Europe."
 algeria_invest.7.t: "Investissements européens en Algérie"
 algeria_invest.7.d: "L'Algérie nous demande d'investir dans son économie. Selon elle, le climat d'investissement est favorable et notre implication renforcera les liens transméditerranéens."
 algeria_invest.7.a: "Bien sûr"
 algeria_invest.7.b: "Il n'y a pas d'argent."
 algeria_invest.8.t: "L’Europe est d’accord"
 algeria_invest.8.d: "Des investisseurs européens ont accepté de soutenir notre économie. Plusieurs grandes entreprises sont déjà prêtes à lancer des projets d'investissement en Algérie."
 algeria_invest.8.a: "Bonne nouvelle pour le développement."
 algeria_invest.9.t: "L'Europe a refusé"
 algeria_invest.9.d: "Ils ont déclaré qu'il n'y a pas d'argent disponible pour allouer un paquet d'investissements."
 algeria_invest.9.a: "Sad"
 algeria_invest.10.t: "Un investisseur chinois finance le métro d'Alger"
 algeria_invest.10.d: "Un investisseur chinois nous offre des fonds pour étendre le métro d'Alger. Nous pouvons construire le métro avec leur argent, ou le détourner en les trompant, au risque de nuire à nos relations avec la Chine."
 algeria_invest.10.a: "Alger a besoin d’un métro !"
 algeria_invest.10.b: "L'Algérie a besoin d'argent !"
 algeria_invest.11.t: "L'Algérie nous a trompés"
 algeria_invest.11.d: "Un groupe d'escrocs algériens a truqué le projet de métro et empoché tout l'argent que nous avions préparé."
 algeria_invest.11.a: "Bâtards"
 algeria_invest.12.t: "Les investissements de Rebrab"
 algeria_invest.12.d: "Issad Rebrab, fondateur de Cevital, est l'un des entrepreneurs les plus influents d'Algérie. Depuis les années 1990, il a investi dans l'industrie, l'agroalimentaire et l'expansion internationale. Grâce à lui, l'Algérie a gagné des usines, des emplois et des projets de prestige. Il reste un symbole du potentiel du secteur privé."
 algeria_invest.12.a: "Merci, Rebrab !"
 ALG_our_economy: "Notre économie"
 ALG_our_economy_desc: "L'économie algérienne est à la croisée des chemins. Après des années d'instabilité et de sous-investissement, le gouvernement doit décider s'il se replie sur lui-même ou ouvre la porte à la modernisation et à la croissance."
 ALG_attract_foreign_inv: "Attirer les investissements étrangers"
 ALG_attract_foreign_inv_desc: "En ouvrant nos marchés aux investisseurs étrangers, l'Algérie peut obtenir capitaux, expertise et projets d'infrastructure autrement hors de portée."
 ALG_france_inv: "Solliciter l'investissement français"
 ALG_france_inv_desc: "La France demeure l'un des partenaires économiques les plus proches de l'Algérie. Renouveler son implication dans nos secteurs énergétique et industriel pourrait accélérer le développement, si nous pouvons supporter son influence."
 ALG_chinese_inv: "Initiative d'investissement chinois"
 ALG_chinese_inv_desc: "La Chine propose des paquets d'investissement ambitieux, souvent liés à l'infrastructure et aux ressources. Un partenariat avec Pékin pourrait transformer notre économie, au prix d'une dépendance plus profonde."
 ALG_usa_inv: "Inviter l'investissement américain"
 ALG_usa_inv_desc: "Les États-Unis peuvent fournir des technologies avancées et un appui financier substantiel. La coopération avec Washington peut remodeler l'industrie et les services algériens en acteurs mondiaux."
 ALG_russian_inv: "Coopération économique russe"
 ALG_russian_inv_desc: "La Russie est depuis longtemps un allié stratégique dans l'énergie et la défense. Étendre la coopération à des projets économiques plus larges renforcera notre ossature industrielle et militaire."
 ALG_iran_inv: "Partenariat avec l'Iran"
 ALG_iran_inv_desc: "L'Algérie et l'Iran partagent une histoire de non-alignement et de résistance à la domination étrangère. Étendre les liens avec Téhéran pourrait ouvrir de nouvelles voies de coopération énergétique, de projets industriels et de diplomatie régionale, même si cela inquiète les partenaires occidentaux."
 ALG_italia_inv: "Renforcer les liens italiens"
 ALG_italia_inv_desc: "L'Italie est l'un des partenaires européens les plus proches de l'Algérie, notamment par le rôle d'ENI dans notre secteur énergétique. En approfondissant la coopération avec Rome, nous pouvons obtenir des investissements vitaux dans l'infrastructure, stimuler le commerce méditerranéen et renforcer notre position de fournisseur énergétique clé de l'Europe."
 ALG_algiers_metro_expansion: "Étendre le métro d'Alger"
 ALG_algiers_metro_expansion_desc: "Alger souffre d'embouteillages et d'infrastructures datées. Étendre le métro modernisera les transports et signalera le progrès aux investisseurs comme aux citoyens."
 ALG_cevital_group_expansion: "Expansion du Groupe Cevital"
 ALG_cevital_group_expansion_desc: "Cevital, premier conglomérat d'Algérie, a le potentiel de devenir une puissance continentale. Soutenir sa croissance créera des emplois et accélérera la modernisation industrielle."
 ALG_scientific_research_push: "Promouvoir la recherche scientifique"
 ALG_scientific_research_push_desc: "L'innovation est la clé de la croissance de long terme. En investissant dans la recherche scientifique, l'Algérie peut poser les bases d'une économie de la connaissance."
 ALG_expand_higher_education: "Étendre l'enseignement supérieur"
 ALG_expand_higher_education_desc: "Universités et écoles techniques doivent être étendues et modernisées pour répondre aux exigences du XXIe siècle. Une population mieux formée renforcera la société comme l'économie."
 ALG_digitalize_education: "Numériser l'éducation"
 ALG_digitalize_education_desc: "Plateformes numériques, enseignement en ligne et intégration informatique révolutionneront le secteur éducatif algérien, créant une main-d'œuvre plus qualifiée et adaptable."
 ALG_national_research_program: "Lancer un programme national de recherche"
 ALG_national_research_program_desc: "En réunissant universités, industrie et gouvernement, un programme national de recherche coordonné permettra à l'Algérie de suivre les avancées technologiques mondiales."
 ALG_industry: "Développer l’industrie algérienne"
 ALG_industry_desc: "L'industrie algérienne doit être diversifiée et modernisée. En promouvant la croissance industrielle, nous pouvons réduire la dépendance aux hydrocarbures et créer une économie plus équilibrée."
 ALG_constantine_hub: "Développer le pôle industriel de Constantine"
 ALG_constantine_hub_desc: "Constantine est un important centre régional. Investir ici créera un nouveau pôle industriel qui diffusera la croissance hors d'Alger."
 ALG_tlemcen_agro_industry: "Dynamiser l’agro-industrie de Tlemcen"
 ALG_tlemcen_agro_industry_desc: "L'agriculture et l'agroalimentaire de Tlemcen peuvent devenir un puissant secteur agro-industriel, nourrissant la nation et créant des emplois."
 ALG_snvi_modernization: "Moderniser la SNVI"
 ALG_snvi_modernization_desc: "La SNVI, constructeur national de véhicules, doit être modernisée pour rivaliser à l'échelle mondiale. Accroître la capacité de production renforcera notre base de transport et d'industrie."
 ALG_annaba_steel_complex: "Complexe sidérurgique d'Annaba"
 ALG_annaba_steel_complex_desc: "Annaba accueille les plus grandes installations sidérurgiques d'Algérie. Les moderniser et les étendre fournira l'ossature des futures industries d'infrastructure et de défense."
 ALG_arzew_refinery: "Agrandissement de la raffinerie d'Arzew"
 ALG_arzew_refinery_desc: "La raffinerie d'Arzew est un maillon vital de nos exportations énergétiques. Accroître sa capacité sécurisera les rentrées de devises et renforcera la domination de Sonatrach."
 ALG_pipeline_modernization: "Moderniser les pipelines"
 ALG_pipeline_modernization_desc: "Un réseau d'oléoducs et de gazoducs moderne est essentiel à des exportations énergétiques sûres et efficaces. Moderniser nos pipelines préviendra les pertes et améliorera la fiabilité internationale."
 ALG_skikda_port_modernization: "Moderniser le port de Skikda"
 ALG_skikda_port_modernization_desc: "Le port de Skikda est critique pour le commerce et les exportations énergétiques. Moderniser ses installations assurera à l'Algérie de rester un hub maritime compétitif."
 ALG_grant_foreign_energy_concessions: "Accorder des concessions énergétiques étrangères"
 ALG_grant_foreign_energy_concessions_desc: "En accordant des concessions sélectives à des sociétés étrangères, l'Algérie peut attirer capitaux et technologies, au risque toutefois de céder une part de son indépendance énergétique."
 ALG_hassi_messaoud_expansion: "Agrandir le champ pétrolier de Hassi Messaoud"
 ALG_hassi_messaoud_expansion_desc: "Le champ pétrolier de Hassi Messaoud est le plus grand d'Algérie. Étendre l'extraction et le raffinage augmentera fortement notre production énergétique."
 ALG_expand_sonatrach: "Développer Sonatrach"
 ALG_expand_sonatrach_desc: "Sonatrach est le cœur battant de l'économie algérienne. Renforcer la compagnie sécurisera notre rôle mondial dans le pétrole et le gaz."
 ALG_protect_oil_gas_facilities: "Protéger les installations pétrolières et gazières"
 ALG_protect_oil_gas_facilities_desc: "Notre infrastructure énergétique est vulnérable en temps de guerre ou de troubles. Renforcer les défenses autour des installations pétrolières et gazières est critique pour la sécurité nationale."
 ALG_minister_of_agriculture_reforms: "Programme de réforme agricole"
 ALG_minister_of_agriculture_reforms_desc: "Des années de négligence ont affaibli l'agriculture algérienne. De nouvelles réformes du ministère de l'Agriculture restaureront la productivité et réduiront la dépendance aux importations alimentaires."
 ALG_modernize_agricultural_sector: "Moderniser le secteur agricole"
 ALG_modernize_agricultural_sector_desc: "Des années de conflit et de négligence ont laissé les fermes algériennes dépassées et inefficaces. Mécanisation, irrigation et subventions revitaliseront le secteur agricole, assurant la sécurité alimentaire de notre peuple."
 ALG_rural_development_program: "Programme de développement rural"
 ALG_rural_development_program_desc: "Les villages algériens souffrent depuis longtemps d'un sous-investissement. En orientant des fonds vers l'infrastructure rurale, l'énergie et l'emploi, nous réduirons l'inégalité villes-campagnes et renforcerons l'unité nationale."
 ALG_promote_algerian_produce: "Promouvoir les produits algériens"
 ALG_promote_algerian_produce_desc: "Notre terre produit une grande variété de cultures et de produits naturels, mais les importations dominent les marchés locaux. Par la marque, les subventions et les incitations commerciales, nous relèverons le profil des produits algériens chez nous et à l'étranger."
 ALG_build_farm_to_market_roads: "Routes des champs aux marchés"
 ALG_build_farm_to_market_roads_desc: "Les agriculteurs ont besoin d'un meilleur accès aux consommateurs et aux voies d'export. Construire des routes des zones rurales vers les centres urbains et vers la frontière tunisienne renforcera à la fois notre agriculture et nos liens régionaux."
 ALG_new_agro_industrial_complexes: "Nouveaux complexes agro-industriels"
 ALG_new_agro_industrial_complexes_desc: "L'Algérie doit lier agriculture et industrie moderne. En construisant des complexes agro-industriels, nous créerons des produits à plus forte valeur, des emplois et des revenus ruraux."
 ALG_invest_tourism: "Investir dans le tourisme"
 ALG_invest_tourism_desc: "Le tourisme prospérait en Algérie avant que les années de guerre n'éloignent les visiteurs. Avec un investissement soigneux et une meilleure sécurité, nous pouvons commencer à restaurer ce secteur vital."
 ALG_restore_hotel_resorts: "Restaurer les complexes hôteliers"
 ALG_restore_hotel_resorts_desc: "Beaucoup de stations et d'hôtels algériens sont en ruine ou en délabrement. Les rénover aidera à attirer des visiteurs étrangers et à fournir des emplois nationaux."
 ALG_blida_airbase_modernization: "Modernisation de la base aérienne de Blida"
 ALG_blida_airbase_modernization_desc: "La base aérienne de Blida est une installation clé pour le transport civil comme militaire. La moderniser améliorera la connectivité de l'Algérie et stimulera le commerce régional."
 ALG_algiers_oran_highway: "Autoroute Alger-Oran"
 ALG_algiers_oran_highway_desc: "Relier Alger à Oran par une autoroute moderne raccourcira les temps de transport, soutiendra le commerce et renforcera l'ossature économique de l'Algérie."
 ALG_east_west_highway_project: "Projet d'autoroute est-ouest"
 ALG_east_west_highway_project_desc: "Traversant toute l'Algérie, l'autoroute Est-Ouest sera l'un des plus grands projets d'infrastructure d'Afrique, reliant nos régions et stimulant le commerce."
 ALG_ski_resorts_of_tikjda: "Stations de ski de Tikjda"
 ALG_ski_resorts_of_tikjda_desc: "Dans les montagnes kabyles se trouve Tikjda, une station au potentiel inexploité. Moderniser ses installations et promouvoir le tourisme d'hiver diversifiera la base économique de l'Algérie."
 ALG_north_african_tourism_hub: "Centre touristique d'Afrique du Nord"
 ALG_north_african_tourism_hub_desc: "En investissant dans nos côtes, notre patrimoine culturel et nos paysages, l'Algérie peut devenir la première destination touristique d'Afrique du Nord, rivalisant avec nos voisins méditerranéens."
 ALG_it_investments: "Investissements informatiques"
 ALG_it_investments_desc: "Au rythme auquel évoluent les technologies de l'information, nous ne pourrons plus nous en passer. Il est grand temps d'investir dans ce secteur."
 ALG_infrastructure_investments: "Investissements d'infrastructure"
 ALG_infrastructure_investments_desc: "Notre infrastructure d'après les années 90 est dans un état déplorable. Il est temps de la reconstruire"
 ALG_science_idea: "Science et éducation algériennes"
 ALG_fuel: "Carburant algérien"
 ALG_dziri: "Dziri"
 ALG_dziri_desc: "L'Algérie doit affronter ses questions sociales pressantes : de la tradition et de l'islam aux droits amazighs et aux réformes démocratiques. Le chemin que nous choisirons façonnera la nation."
 ALG_traditions_matter: "Les traditions comptent"
 ALG_traditions_matter_desc: "Le peuple algérien s'accroche à la foi, à la famille et à l'identité nationale. Notre gouvernement doit respecter ces traditions s'il veut conserver sa légitimité."
 ALG_restrict_women_roles: "Préserver le code de la famille"
 ALG_restrict_women_roles_desc: "Les dirigeants conservateurs estiment que le rôle des femmes doit rester centré sur la famille. Réformer le code de la famille risque d'irriter les autorités religieuses et l'opinion."
 ALG_expand_berber_rights: "Reconnaître les droits amazighs"
 ALG_expand_berber_rights_desc: "Le mouvement identitaire berbère exige une pleine reconnaissance culturelle et linguistique. Accorder des droits amazighs désamorcerait les tensions mais pourrait aliéner les durs."
 ALG_censor_internet: "Censurer Internet"
 ALG_censor_internet_desc: "Les réseaux sociaux et l'activisme en ligne ont alimenté les protestations. Restreindre les libertés en ligne restaurera le contrôle de l'État mais nuira à notre image internationale."
 ALG_open_civil_society: "Société civile ouverte"
 ALG_open_civil_society_desc: "Les forces démocratiques poussent à une société civile libre, des ONG et des associations du Hirak. Ouvrir cet espace renforcerait la légitimité mais risquerait la fragmentation politique."
 ALG_integration_policy: "Politique d'intégration"
 ALG_integration_policy_desc: "Les migrants subsahariens et la diaspora de retour font face à des défis. Une politique d'intégration structurée peut réduire les tensions sociales et promouvoir la cohésion."
 ALG_marriage_subsidies: "Subventions au mariage"
 ALG_marriage_subsidies_desc: "Alors que la jeunesse peine à se marier et fonder une famille, des subventions au logement et aux mariages stabiliseront la société et encourageront la formation des familles."
 ALG_constitutionalize_rights: "Constitutionnaliser les droits"
 ALG_constitutionalize_rights_desc: "Nous pouvons inscrire libertés civiles, droits des femmes et reconnaissance amazighe par une réforme constitutionnelle. Cela signalerait un basculement social permanent."
 ALG_berber_right: "Reconnaissance amazighe"
 ALG_berber_right_desc: "L'identité amazighe a été officiellement reconnue, renforçant la stabilité dans les régions à majorité berbère."
 Algeria.238.t: "Stabiliser le Mali"
 Algeria.238.d: "Le conflit en cours au Mali menace de déstabiliser tout le Sahel. Séparatistes touaregs et groupes djihadistes ont créé une crise de sécurité à notre frontière sud. L'Algérie ne peut rester passive tandis que l'instabilité se répand. Nous devons décider de soutenir le gouvernement malien pour rétablir l'ordre, ou de négocier avec les factions touarègues dans l'espoir d'un règlement durable."
 Algeria.238.a: "Soutenir le gouvernement malien"
 Algeria.238.b: "Soutenir les forces touarègues"
 ALG_us_invest_tt: "Rechercher des investissements américains en Algérie"
 ALG_fra_invest_tt: "Rechercher des investissements français en Algérie"
 ALG_eng_invest_tt: "Rechercher des investissements britanniques en Algérie"
 ALG_chi_invest_tt: "Rechercher des investissements chinois en Algérie"
 ALG_rus_invest_tt: "Rechercher des investissements russes en Algérie"
 ALG_open_to_west: "S'ouvrir à l'Occident"
 ALG_open_to_west_desc: "L'Algérie a longtemps poursuivi la neutralité, mais les temps changent. Un alignement plus étroit avec le monde occidental pourrait apporter stabilité, sécurité et opportunités d'investissement."
 ALG_nato_partnership: "Partenariat OTAN"
 ALG_nato_partnership_desc: "Nous explorerons une coopération structurée avec l'OTAN. Ce partenariat renforcera le standing international de l'Algérie et aidera à moderniser nos forces armées."
 ALG_energy_partnership_eu: "Partenariat énergétique avec l'UE"
 ALG_energy_partnership_eu_desc: "Les vastes réserves énergétiques de l'Algérie sont très recherchées en Europe. En forgeant des partenariats énergétiques avec la France et le Royaume-Uni, nous pouvons obtenir des contrats lucratifs et des investissements de long terme."
 ALG_strengthen_eu_trade: "Renforcer le commerce avec l'UE"
 ALG_strengthen_eu_trade_desc: "L'Europe demeure notre premier partenaire commercial. Renforcer ces liens économiques stabilisera notre marché d'export et intégrera davantage l'Algérie au commerce mondial."
 ALG_expand_us_partnership: "Élargir le partenariat américain"
 ALG_expand_us_partnership_desc: "Les États-Unis recherchent la stabilité en Afrique du Nord. En étendant la coopération économique et de sécurité avec Washington, l'Algérie peut attirer des investissements et gagner un allié puissant."
 ALG_become_nato_ally: "Devenez un allié de l’OTAN"
 ALG_become_nato_ally_desc: "Si l'adhésion pleine à l'OTAN est peut-être prématurée, l'Algérie peut obtenir le statut d'allié de confiance. Cela nous donnerait accès à l'expertise militaire, à des exercices conjoints et à un levier diplomatique."
 ALG_exchange_research_with_nato: "Échanger la recherche avec l'OTAN"
 ALG_exchange_research_with_nato_desc: "La coopération scientifique avec les alliés de l'OTAN permettra à l'Algérie de bénéficier de recherches conjointes, du partage de technologies militaires et de la modernisation de nos institutions d'éducation et de recherche."
 ALG_get_nato_military_exp: "Acquérir l'expertise militaire de l'OTAN"
 ALG_get_nato_military_exp_desc: "L'entraînement et la doctrine militaires étendus de l'OTAN offrent une expertise précieuse. Les forces armées algériennes se moderniseront par des exercices combinés et des orientations stratégiques."
 ALG_counterterrorism_coordination: "Coordination de la lutte contre le terrorisme"
 ALG_counterterrorism_coordination_desc: "Le terrorisme demeure une menace majeure en Afrique du Nord. En coordonnant avec les unités de renseignement et d'antiterrorisme de l'OTAN, l'Algérie peut renforcer la sécurité intérieure et la stabilité régionale."
 ALG_get_investements_from_nato: "Attirer les investissements de l’OTAN"
 ALG_get_investements_from_nato_desc: "Notre alignement otanien attirera un soutien économique et des projets d'infrastructure des membres de l'alliance, assurant des bénéfices de long terme pour l'économie algérienne."
 ALG_strengthen_democratic_norms: "Renforcer les normes démocratiques"
 ALG_strengthen_democratic_norms_desc: "Pour s'intégrer pleinement au monde occidental, l'Algérie doit renforcer ses institutions démocratiques : protéger les libertés civiles, soutenir le pluralisme et encourager la réforme politique."
 ALG_seek_greater_influence_in_wto: "Chercher plus d'influence à l'OMC"
 ALG_seek_greater_influence_in_wto_desc: "À mesure que l'Algérie se développe, nous devons élargir notre rôle au sein de l'Organisation mondiale du commerce, afin que notre voix soit entendue dans les négociations économiques mondiales."
 ALG_seek_security_council_seat: "Briguer un siège au Conseil de sécurité de l'ONU"
 ALG_seek_security_council_seat_desc: "L'histoire diplomatique de l'Algérie et son bilan de maintien de la paix plaident pour une présence permanente au Conseil de sécurité de l'ONU. Nous devons pousser cette ambition."
 ALG_join_nato: "Rejoindre l'OTAN"
 ALG_join_nato_desc: "Après des décennies de neutralité et d'équilibrage prudent, l'Algérie s'apprête à franchir un pas historique : l'adhésion pleine à l'OTAN. Cette décision ancrera notre place parmi les puissances occidentales et remodelera notre politique étrangère."
 ALG_global_companies: "Invitez des entreprises mondiales"
 ALG_global_companies_desc: "En ouvrant nos marchés aux investisseurs étrangers, l'Algérie peut attirer des multinationales. Cela stimulera la croissance industrielle, les transferts de technologies et le prestige international."
 ALG_huawei: "Télécommunications Huawei"
 ALG_huawei_desc: "Huawei a proposé d'établir une infrastructure de télécommunications avancée en Algérie, nous dotant d'une ossature numérique moderne et assurant notre rôle dans l'ère de l'information."
 ALG_hyundai: "Expansion industrielle Hyundai"
 ALG_hyundai_desc: "Hyundai a exprimé son intérêt à investir dans les secteurs automobile et industriel algériens. En accueillant leurs usines, nous pouvons stimuler l'emploi et le développement technologique."
 ALG_weapons_expert: "Expertise en armement étranger"
 ALG_weapons_expert_desc: "Par la coopération avec des firmes de défense étrangères, l'Algérie peut acquérir une nouvelle expertise en armes d'appui et systèmes tactiques, renforçant nos forces terrestres."
 ALG_airburst_weapons: "Développer des armes à explosion"
 ALG_airburst_weapons_desc: "La technologie à explosion aérienne permet à l'infanterie de frapper l'ennemi à couvert ou en positions fortifiées. Investir dans ce système de pointe accroîtra grandement notre efficacité au combat."
 ALG_vehicle_industry: "Développer l’industrie automobile"
 ALG_vehicle_industry_desc: "En nous associant à des constructeurs mondiaux et à des firmes industrielles, l'Algérie peut établir une industrie de véhicules militaires et civils solide, stimulant défense et économie."
 ALG_advanced_ultility_vehicle: "Véhicules utilitaires avancés"
 ALG_advanced_ultility_vehicle_desc: "Notre secteur automobile doit passer au développement avancé. Produire des véhicules utilitaires modernes et fiables renforcera la logistique et l'efficacité des transports."
 ALG_sat_tech: "Coopération technologique satellitaire"
 ALG_sat_tech_desc: "Par des partenariats avec des firmes mondiales, l'Algérie peut développer une technologie satellitaire avancée, améliorant surveillance, communications et systèmes de positionnement."
 ALG_advanced_radar: "Systèmes radar avancés"
 ALG_advanced_radar_desc: "Un radar et une détection modernes donneront à l'Algérie de plus grandes capacités défensives et permettront l'intégration à des cadres de sécurité régionaux avancés."
 ALG_microsoft: "Infrastructure numérique Microsoft"
 ALG_microsoft_desc: "En nous associant à Microsoft, l'Algérie peut moderniser ses secteurs informatique et logiciel, renforçant la cybersécurité, l'administration numérique et la croissance technologique."
 ALG_Lenovo: "Investissement technologique Lenovo"
 ALG_Lenovo_desc: "Lenovo souhaite étendre sa présence en Algérie. Collaborer avec eux renforcera notre industrie du matériel informatique et soutiendra l'innovation technologique."
 ALG_Danone: "Expansion de l’industrie alimentaire de Danone"
 ALG_Danone_desc: "Accueillir l'investissement de Danone dans le secteur alimentaire algérien relèvera la nutrition, les normes de production et les relations commerciales internationales."
 ALG_toyota: "Partenariat industriel Toyota"
 ALG_toyota_desc: "En invitant Toyota à établir des installations industrielles et automobiles, l'Algérie peut accroître la production de véhicules, créer des emplois et promouvoir le progrès technologique du secteur."
 ALG_align_with_south_africa: "S'aligner avec l'Afrique du Sud"
 ALG_align_with_south_africa_desc: "L'Afrique du Sud joue un rôle de premier plan dans les affaires politiques et économiques du continent. En renforçant notre partenariat, nous pouvons coordonner politiques commerciales, diplomatiques et de sécurité."
 ALG_open_to_east: "S'ouvrir à l'Est"
 ALG_open_to_east_desc: "Se tourner vers l'Est diversifiera nos partenariats, réduira la dépendance à l'Occident et ouvrira des opportunités sur des marchés comme la Russie, la Chine et d'autres puissances émergentes."
 ALG_expand_trade_with_russia: "Étendre le commerce avec la Russie"
 ALG_expand_trade_with_russia_desc: "La Russie offre à l'Algérie de nouvelles opportunités dans l'énergie, l'armement et la coopération industrielle. Renforcer nos liens commerciaux approfondira les relations stratégiques."
 ALG_expand_trade_with_china: "Étendre le commerce avec la Chine"
 ALG_expand_trade_with_china_desc: "La Chine est avide d'investir en Afrique et propose à l'Algérie des accords commerciaux avantageux. Cette coopération pourrait nous fournir infrastructure et développement industriel."
 ALG_mediterranean_corridor_initiative: "Initiative du corridor méditerranéen"
 ALG_mediterranean_corridor_initiative_desc: "En liant plus étroitement notre économie aux marchés méditerranéens et orientaux, l'Algérie peut s'établir comme un corridor clé du commerce et des projets d'infrastructure."
 ALG_Investments_From_East: "Investissements dans l'Est"
 ALG_Investments_From_East_desc: "Attirer des investisseurs de l'Est renforcera notre économie, fournira de nouvelles industries et assurera à l'Algérie des sources de capitaux diversifiées."
 ALG_eastern_alignment: "Alignement Est"
 ALG_eastern_alignment_desc: "Un alignement plus fort avec la Russie, la Chine et leurs alliés donnera à l'Algérie de nouveaux partenaires en sécurité, commerce et technologie tout en réduisant l'influence occidentale."
 ALG_china_civ: "Investissements civils chinois"
 ALG_china_civ_desc: "Les corporations chinoises sont prêtes à s'étendre dans les industries civiles algériennes. Ces projets généreront des emplois et accéléreront la modernisation."
 ALG_china_civ2: "Poursuivre les projets civils chinois"
 ALG_china_civ2_desc: "Après le succès des premières entreprises, la Chine propose des investissements supplémentaires pour étendre encore la base industrielle civile de l'Algérie."
 ALG_chinese_armor_deal: "Accord sur les armures chinoises"
 ALG_chinese_armor_deal_desc: "La Chine a proposé de vendre à l'Algérie des véhicules blindés et des paquets technologiques. Cet accord améliorera nos forces terrestres et approfondira les liens de défense."
 ALG_joint_military_exercise_with_rus: "Exercices militaires conjoints avec la Russie"
 ALG_joint_military_exercise_with_rus_desc: "En menant des exercices conjoints avec la Russie, l'Algérie améliorera la coordination militaire et apprendra de l'expérience de combat russe."
 ALG_russia_inf_tech: "Technologie de l'infanterie russe"
 ALG_russia_inf_tech_desc: "L'expertise russe en armes légères et tactiques d'infanterie peut être adaptée aux besoins algériens, donnant à nos soldats de meilleurs outils et un meilleur entraînement."
 ALG_russia_experience: "Coopération de défense avec Moscou"
 ALG_russia_experience_desc: "Approfondir la coopération militaire avec la Russie amènera conseillers expérimentés et programmes d'entraînement en Algérie. Nos forces armées en sortiront plus fortes et mieux préparées."
 ALG_idea_parliamentary_republic: "Majlis al-Watani al-Shaabi"
 ALG_idea_presidential_republic: "Système présidentiel"
 ALG_idea_semi_presidential_republic: "Al-Jumhorya al-Démocratie al-Shaabia"
 ALG_release_political_pirsoners: "Libérer les prisonniers politiques"
 ALG_release_political_pirsoners_desc: "Pour ouvrir un nouveau chapitre, la nouvelle administration libérera ceux détenus pour motifs politiques pendant les années de troubles. Cet acte de clémence vise à favoriser l'unité nationale et à reconstruire la confiance entre le peuple et l'État."
 ALG_al_jazair_al_djadida: "Al-Jazaïr Al-Djadida"
 ALG_al_jazair_al_djadida_desc: "La promesse du président Abdelmadjid Tebboune d'une « nouvelle Algérie » vise à renouveler la légitimité de l'État par des réformes constitutionnelles et administratives, renforçant les institutions démocratiques et la confiance publique."
 ALG_republic_of_algeria: "La République algérienne"
 ALG_republic_of_algeria_desc: "Les fondements de la réforme posés, l'Algérie réaffirme son identité de république guidée par la souveraineté nationale, la justice sociale et la volonté de ses citoyens."
 ALG_majlis_al_watani_al_shaabi: "Majlis al-Watani al-Shaabi"
 ALG_majlis_al_watani_al_shaabi_desc: "Une république parlementaire donnerait aux représentants élus le pouvoir de guider la nation, limitant la domination de l'exécutif et assurant une décision collective."
 ALG_jumhorya_democratia_shaabia: "Al-Jumhorya al-Démocratie al-Shaabia"
 ALG_jumhorya_democratia_shaabia_desc: "Maintenir un équilibre semi-présidentiel entre pouvoirs exécutif et législatif pourrait stabiliser la transition algérienne, empêchant un retour à l'autoritarisme tout en assurant une gouvernance décisive."
 ALG_deep_state_republic: "La République de l'État profond"
 ALG_deep_state_republic_desc: "Derrière une façade de réforme, une nouvelle structure de pouvoir émerge. Anciens généraux, hommes d'affaires et bureaucrates consolident le contrôle dans l'ombre. Cette « République de l'État profond » maintient l'illusion démocratique tout en sauvegardant ses réseaux d'influence et de corruption."
 ALG_tamazgha: "Le rêve de Tamazgha"
 ALG_tamazgha_desc: "L'heure est venue de la renaissance de Tamazgha, terre du peuple amazigh s'étendant de l'Atlantique au Nil. Une nouvelle aube se lève sur l'Afrique du Nord, sous la bannière de la liberté et de l'unité."
 ALG_our_land: "Notre terre sacrée"
 ALG_our_land_desc: "Notre peuple doit reconquérir et reconstruire les terres qui ont toujours été nôtres. Industrie, main-d'œuvre et courage seront le fondement de notre patrie renaissante."
 ALG_expand_our_army: "Étendre notre armée"
 ALG_expand_our_army_desc: "La défense de Tamazgha dépend de la force de notre armée. Nous devons former, armer et étendre nos forces pour protéger notre nouvelle nation contre ses nombreux ennemis."
 ALG_berber_of_tunisia: "Les Berbères de Tunisie"
 ALG_berber_of_tunisia_desc: "Nos frères amazighs de Tunisie ont longtemps subi une domination étrangère. Il est temps de les unir sous le drapeau de Tamazgha et de libérer leurs terres."
 ALG_libya_invasion: "Invasion de la Libye"
 ALG_libya_invasion_desc: "Des sables du Sahara aux rives de Tripoli, la Libye fait légitimement partie de notre patrie culturelle. Nous devons l'intégrer au giron de Tamazgha."
 ALG_take_egypt: "Marche sur l'Égypte"
 ALG_take_egypt_desc: "L'Égypte détient la clé de la frontière orientale de Tamazgha. Ses vastes ressources et son importance stratégique en font une pièce vitale de notre vision."
 ALG_canary_island: "Saisir les îles Canaries"
 ALG_canary_island_desc: "Les îles Canaries furent jadis habitées par un peuple amazigh, les Guanches. Nous ramènerons ces îles sous souveraineté amazighe."
 ALG_take_niger: "Réclamation du Niger"
 ALG_take_niger_desc: "Les Touaregs du Niger sont amazighs de sang et d'héritage. Leurs déserts rejoindront à nouveau la grande fédération de Tamazgha."
 ALG_rif_in_morocco: "Le Rif au Maroc"
 ALG_rif_in_morocco_desc: "Les montagnes du Rif ont vu naître des héros qui ont résisté au colonialisme. Leur bravoure nous inspire à unifier le Maroc sous la cause amazighe."
 ALG_demand_mali: "Demander le Mali"
 ALG_demand_mali_desc: "Les terres du Mali, riches d'histoire et de culture, firent jadis partie des grands empires amazighs. Il est temps de restaurer notre influence au Sahel."
 ALG_demand_mauritania: "Demander à la Mauritanie"
 ALG_demand_mauritania_desc: "Les déserts de Mauritanie portent des racines amazighes profondes. Son unification avec Tamazgha est la prochaine étape de notre destin continental."
 ALG_TAM_unite_tamazgha: "Unir Tamazgha"
 ALG_TAM_unite_tamazgha_desc: "Toutes les terres amazighes doivent être unies sous une seule bannière. Le rêve de Tamazgha n'est plus une vision : c'est une mission que nous accomplirons."
 ALG_expand_more: "Étendre la fédération"
 ALG_expand_more_desc: "Tamazgha ne doit pas stagner. L'expansion, industrielle comme territoriale, assurera notre place de grande puissance d'Afrique et de Méditerranée."
 ALG_focus_on_our_land: "Se concentrer sur notre terre"
 ALG_focus_on_our_land_desc: "Plutôt que de trop nous étendre, nous devrions développer notre terre, améliorer notre influence, notre économie et notre unité au sein même de Tamazgha."
 ALG_expand_to_ME: "S'étendre au Moyen-Orient"
 ALG_expand_to_ME_desc: "Le Moyen-Orient est déchiré par le chaos. Avec force et dessein, Tamazgha peut apporter l'ordre et un leadership amazigh aux terres d'Arabie."
 ALG_take_arabia: "Conquérir l'Arabie"
 ALG_take_arabia_desc: "La péninsule Arabique gît divisée et faible. Nous porterons la lumière de Tamazgha sur ces terres et assurerons notre domination sur la mer Rouge et le Golfe."
 ALG_take_levant: "Prendre le Levant"
 ALG_take_levant_desc: "Des montagnes du Liban aux plaines de Syrie et de Palestine, le Levant tombera sous la bannière de Tamazgha, nous rapprochant du berceau de la civilisation."
 ALG_legacy_of_dihiya: "Héritage de Dihya"
 ALG_legacy_of_dihiya_desc: "La reine Dihya, guerrière intrépide des Aurès, unifia jadis les tribus amazighes contre les envahisseurs étrangers. Son esprit de défi et de leadership vit encore en notre peuple. Nous portons son héritage, intact, inflexible, et à jamais libre."
 ALG_de_arabisation_mission_desc: "La campagne nationale de réforme culturelle et linguistique est en cours. Bureaucratie et éducation sont réécrites pour refléter l'héritage amazigh. Cette transformation causera une tension à court terme mais renforcera la nation à long terme."
 ALG_dearabisation_end_TT: "§GLe processus de désarabisation s'achève.§! Les cœurs arabes sont remplacés par des cœurs amazighs, et nous gagnons l'esprit national §Y« Persévérance des Imazighen »§!."
 ALG_de_arabisation: "Campagne de désarabisation"
 ALG_de_arabisation_desc: "Pendant des siècles, la véritable identité de notre peuple a été ensevelie sous des cultures imposées. Nous reconquerrons nos racines en réformant l'éducation, l'administration et les politiques linguistiques, même si cela perturbe la société à court terme."
 ALG_dearabisation_penalty: "Bouleversement administratif"
 ALG_dearabisation_penalty_desc: "Le processus de désarabisation a perturbé la bureaucratie et le système éducatif. Résistance, confusion et inefficacité minent la transition tandis que le gouvernement tente de reconstruire les institutions à l'image amazighe."
 ALG_imazighen_perseverance: "La persévérance des Imazighen"
 ALG_imazighen_perseverance_desc: "À travers l'épreuve et la réforme, notre peuple a tenu. L'esprit amazigh s'est révélé inébranlable : nous sortons de la tempête plus forts, plus fiers et unis."
 ALG_el_salam_nuclear_reactor: "Réacteur nucléaire d'El Salam"
 ALG_el_salam_nuclear_reactor_desc: "Pour répondre à la demande énergétique croissante de l'Algérie et réduire la dépendance aux fossiles, le gouvernement lancera la construction du réacteur nucléaire El Salam. Ce projet marque un pas majeur vers le progrès scientifique et la diversification énergétique."
 ALG_uranium_enrichment: "Programme d'enrichissement d'uranium"
 ALG_uranium_enrichment_desc: "Développer une capacité nationale d'enrichissement d'uranium permettra à l'Algérie de gérer son propre combustible nucléaire. Par ce programme, nos scientifiques visent à maîtriser la technologie des centrifugeuses et à atteindre l'autosuffisance nucléaire."
 ALG_el_nour_nuclear_facility: "Centrale nucléaire d'El Nour"
 ALG_el_nour_nuclear_facility_desc: "Après le succès du réacteur El Salam, l'Algérie étendra son infrastructure nucléaire en construisant l'installation El Nour, pôle de recherche, d'entretien des réacteurs et de développement nucléaire pacifique."
 ALG_ask_for_help_from_india: "Demander l'aide des Indiens"
 ALG_ask_for_help_from_india_desc: "L'Inde a des décennies d'expérience du nucléaire civil sous surveillance internationale. En sollicitant New Delhi pour une coopération technique et scientifique, l'Algérie peut avancer plus vite son programme nucléaire civil."
 ALG_buy_pinaka_launcher: "Achetez des lance-roquettes Pinaka"
 ALG_buy_pinaka_launcher_desc: "Le lance-roquettes multiple indien Pinaka est un système fiable et économique. L'acquérir renforcera les divisions d'artillerie algériennes et resserrera la coopération militaire avec l'Inde."
 ALG_indian_missiles: "Acquérir la technologie des missiles indiens"
 ALG_indian_missiles_desc: "Par une collaboration de défense élargie avec l'Inde, l'Algérie pourra accéder à des systèmes avancés de guidage et de propulsion de missiles. Intégrer cette technologie renforcera nettement nos capacités de défense nationale."
 ALG_subsidise_amazigh_businesses: "Subventionner les entreprises dirigées par les Amazighs"
 ALG_subsidise_amazigh_businesses_desc: "Fournir des subventions d'État et un soutien préférentiel aux entrepreneurs amazighs, encourageant la croissance économique dans les régions de Tamazgha."
 ALG_leave_arab_league: "Quitter la Ligue arabe"
 ALG_leave_arab_league_desc: "Retirer l'Algérie de la Ligue arabe, affirmant une identité amazighe souveraine distincte de la politique du bloc arabe."
 ALG_bring_back_amazigh_exiles: "Ramener les exilés amazighs"
 ALG_bring_back_amazigh_exiles_desc: "Faciliter le retour des exilés et immigrés amazighs, en offrant des incitations à la réinstallation."
 ALG_boost_kabyle_population: "Augmenter la population kabyle"
 ALG_boost_kabyle_population_desc: "Mettre en œuvre des politiques pour accroître la part démographique kabyle par des incitations, la réinstallation et le soutien."
 ALG_de_arabisation_category: "Programme de désarabisation de Tamazgha"
 ALG_de_arabisation_category_desc: "Pour bâtir une nouvelle Tamazgha, nous devons nous défaire de l'identité arabe imposée et restaurer l'âme amazighe de notre nation."
 ALG_de_arabisation_mission: "Processus de désarabisation"
 ALG_return_amazigh_exiles: "Ramener les exilés et immigrés amazighs"
 ALG_return_amazigh_exiles_desc: "Des décennies de discrimination ont forcé beaucoup à fuir. Il est temps de les ramener au pays."
 ALG_dearabisation_fail_TT: "L'échec affaiblit la stabilité et accroît les tensions ethniques."
 ALG_amazigh_businesses_complete_TT: "La satisfaction kabyle et l'économie s'améliorent."
 ALG_amazigh_businesses_fail_TT: "L’échec diminue la satisfaction des Kabyles."
 ALG_return_exiles_complete_TT: "Le retour des exilés renforce l'identité amazighe et les effectifs."
 ALG_return_exiles_fail_TT: "Ne pas rapatrier les exilés affaiblit l'unité."
 ALG_leave_arab_league_complete_TT: "Quitter la Ligue arabe renforce la souveraineté de Tamazgha."
 ALG_leave_arab_league_fail_TT: "Ne pas quitter la Ligue arabe provoque des troubles."
 ALG_kabyle_pop_complete_TT: "La population kabyle s'accroît, l'unité nationale se renforce."
 ALG_kabyle_pop_fail_TT: "Négliger la démographie kabyle provoque des troubles."
 ALG_tamazgha_cultural_revival_category: "Renouveau culturel Tamazgha"
 ALG_tamazgha_cultural_revival_category_desc: "L'arabisation terminée, il est temps de restaurer notre héritage culturel, linguistique et intellectuel : la renaissance de Tamazgha commence."
 ALG_amazigh_language_reform: "Réforme de la langue amazighe"
 ALG_amazigh_language_reform_desc: "Nous devons restaurer le tamazight comme langue nationale et le promouvoir par l'éducation et l'administration."
 ALG_tamazight_in_education: "Introduire le tamazight à l'école"
 ALG_tamazight_in_education_desc: "Implémenter le tamazight dans les écoles et universités pour préserver nos racines culturelles."
 ALG_media_cultural_independence: "Indépendance culturelle et médiatique"
 ALG_media_cultural_independence_desc: "Soutenir des médias amazighs indépendants et des initiatives culturelles libres de toute influence extérieure."
 ALG_tamazgha_regional_cooperation: "Coopération Régionale Tamazgha"
 ALG_tamazgha_regional_cooperation_desc: "Unir les nations nord-africaines d'ascendance amazighe dans un cadre de coopération pour un avenir commun."
 ALG_amazigh_language_reform_complete_TT: "Le tamazight devient langue d'État et stimule l'éducation."
 ALG_amazigh_language_reform_fail_TT: "Ne pas réformer l'éducation retarde le renouveau culturel."
 ALG_tamazight_in_education_complete_TT: "Le tamazight a été introduit avec succès dans les programmes scolaires."
 ALG_tamazight_in_education_fail_TT: "Le système éducatif reste dominé par les Arabes."
 ALG_media_cultural_independence_complete_TT: "Des médias amazighs indépendants renforcent l'identité nationale."
 ALG_media_cultural_independence_fail_TT: "Ne pas agir affaiblit l'influence culturelle."
 ALG_tamazgha_regional_cooperation_complete_TT: "Unité régionale parmi les nations Tamazgha réalisée."
 ALG_tamazgha_regional_cooperation_fail_TT: "Ne pas établir de coopération isole la Tamazgha."
 ALG_black_decade_lesson: "Leçons de la Décennie noire"
 ALG_black_decade_lesson_desc: "La guerre civile des années 1990 a profondément marqué la nation, laissant une génération méfiante de l'extrémisme et de l'instabilité. L'État a tiré de dures leçons de ce chapitre sombre, s'attachant à préserver l'unité nationale, renforcer les institutions de sécurité et éviter le chaos de la confrontation idéologique. Toutefois, ces leçons justifient aussi l'emprise continue de la vieille garde sur la politique, la peur d'une répétition modelant encore chaque réforme."
 AlgeriaElections.1.t: "Les élections"
 AlgeriaElections.1.d: "Pour la première fois depuis des années, l'Algérie assiste à des élections vraiment compétitives. L'air est chargé d'attente et de tension tandis que des millions de citoyens se rendent aux urnes, déterminés à façonner l'avenir de leur nation après des décennies de stagnation politique. Plusieurs forces dominent le paysage politique.\n\nUn bloc, composé de factions réformistes, libérales et islamistes modérées, milite pour la démocratie, la transparence et la réconciliation nationale. Leur vision appelle à démanteler le système du « Pouvoir » et à restaurer la légitimité de la gouvernance. Leur appel résonne fortement auprès de la jeunesse, de la société civile et des travailleurs en quête d'un vrai changement.\n\nUn autre front rassemble indépendants pragmatiques et technocrates, ceux qui cherchent la réforme de l'intérieur. Ils privilégient une démocratisation graduelle, une meilleure gouvernance et la libéralisation économique tout en maintenant stabilité et sécurité.\n\nÀ mesure que les bulletins sont dépouillés, un parti l'emporte, chacun représentant un chemin distinct pour l'avenir de la nation."
 AlgeriaElections.1.a: "Le FFS revendique la victoire"
 AlgeriaElections.1.b: "Le RND remporte les élections"
 AlgeriaElections.1.c: "Le MSP obtient un mandat"
 AlgeriaElections.1.dd: "Le RCD accède au pouvoir"
 AlgeriaElections.2.t: "Les élections"
 AlgeriaElections.2.d: "Les élections tant attendues sont arrivées, et la nation retient son souffle. Le Front de libération nationale, ou FLN, se dresse à nouveau comme pilier central du système politique algérien, séduisant ceux qui valorisent encore stabilité, unité et continuité après les troubles de la Décennie noire. Sous la direction du président Abdelaziz Bouteflika et de l'establishment loyal du parti, le FLN promet la modernisation sans le chaos, la réforme sans la rupture.\n\nLes mouvements d'opposition, bien que vocaux et divers, restent divisés et fragmentés, incapables de former un front uni capable de défier la vieille garde. Beaucoup d'Algériens, las des bouleversements et avides d'ordre, votent pour le familier, convaincus que l'expérience et la sécurité l'emportent sur les risques du changement.\n\nAu dépouillement final, le résultat est clair : l'héritage de la révolution règne encore en maître."
 AlgeriaElections.2.a: "Le FLN remporte une nouvelle victoire !"
 ALG_election_time: "Période électorale"
 ALG_election_time_desc: "L'Algérie se prépare à une nouvelle saison électorale cruciale. Le paysage politique est tendu tandis que le FLN au pouvoir et les partis d'opposition préparent leurs campagnes."
 ALG_FLN_media_control: "Médias contrôlés par l'État"
 ALG_FLN_media_control_desc: "En resserrant le contrôle de la presse et de la télévision, le gouvernement s'assure que le récit public reste loyal au FLN et à sa vision de la stabilité."
 ALG_loyal_military: "Armée loyale"
 ALG_loyal_military_desc: "L'armée s'est révélée gardienne fiable du régime, assurant que l'ordre et l'unité nationale soient préservés avant tout."
 ALG_FLN_state_led_development: "Développement dirigé par l'État"
 ALG_FLN_state_led_development_desc: "L'État dirige les grands secteurs de l'économie, assurant que le développement industriel et social reste sous contrôle national."
 ALG_FLN_oil_for_people: "Le pétrole pour le peuple"
 ALG_FLN_oil_for_people_desc: "Le gouvernement utilise la vaste richesse hydrocarbure du pays pour fournir aides et subventions, promouvant un contrat social fondé sur la redistribution économique."
 ALG_FLN_national_security_council: "Conseil de sécurité nationale"
 ALG_FLN_national_security_council_desc: "Un organe de haut niveau coordonnant la sécurité intérieure et le contre-espionnage, assurant que les menaces contre l'État soient promptement neutralisées."
 ALG_FLN_industrial_nationalization: "Nationalisation industrielle"
 ALG_FLN_industrial_nationalization_desc: "Le gouvernement FLN a pris des mesures pour réaffirmer le contrôle des industries clés afin de protéger la souveraineté économique de l'Algérie."
 ALG_FLN_legacy_of_stability: "Héritage de stabilité"
 ALG_FLN_legacy_of_stability_desc: "Malgré ses défauts, le gouvernement FLN a fourni continuité et stabilité, ce que beaucoup d'Algériens valorisent après des années de troubles."
 ALG_FLN_oil_for_people_idea: "Le pétrole pour le peuple"
 ALG_FLN_oil_for_people_idea_desc: "Le gouvernement a décidé d'utiliser les revenus pétroliers pour financer directement programmes publics et subventions. Cela relève le niveau de vie, mais risque aussi l'inefficacité et la dépendance à long terme."
 ALG_FLN_legacy_of_stability_idea: "Héritage de stabilité"
 ALG_FLN_legacy_of_stability_idea_desc: "Pendant des décennies, le FLN s'est présenté comme gardien de la stabilité algérienne. Son contrôle serré de la politique et de la sécurité assure la paix, au prix de libertés limitées."
 ALG_FLN_industrial_nationalization_idea: "Nationalisation industrielle"
 ALG_FLN_industrial_nationalization_idea_desc: "Les grands secteurs de l'économie sont placés sous contrôle de l'État pour assurer l'indépendance nationale et orienter la croissance industrielle selon la planification gouvernementale."
 ALG_FLN_state_led_development_idea: "Développement dirigé par l'État"
 ALG_FLN_state_led_development_idea_desc: "L'État joue un rôle actif dans l'orientation de la croissance économique algérienne, mettant l'accent sur l'infrastructure, l'éducation et le social pour renforcer les fondations de la nation."
 ALG_FLN_media_control_idea: "Code de l'information"
 ALG_FLN_media_control_idea_desc: "Le Code de l'information établit le cadre juridique régissant presse et radiodiffusion, permettant à l'État de réglementer les médias et de guider l'espace informationnel national."
 ALG_FLN_national_security_council_idea: "Conseil de sécurité nationale"
 ALG_FLN_national_security_council_idea_desc: "Un conseil puissant composé de militaires, de renseignement et de hauts responsables supervise la stabilité intérieure et la stratégie nationale, assurant la loyauté au gouvernement FLN."
 ALG_loyal_military_idea: "Armée loyale"
 ALG_loyal_military_idea_desc: "L'armée reste loyale au FLN, valorisant l'ordre et la hiérarchie avant tout. Cette unité s'accompagne d'une moindre adaptabilité et d'une moindre initiative sur le champ de bataille."
 ALG_loyal_military2_idea: "Corps militaire loyal"
 ALG_loyal_military2_idea_desc: "La loyauté de l'armée s'est approfondie par l'intégration politique et des avantages privilégiés, assurant un appareil militaire puissant et discipliné sous commandement du gouvernement."
 ALG_invest_in_youth_idea: "Investir dans la jeunesse"
 ALG_invest_in_youth_idea_desc: "Des programmes pour éduquer et employer la jeunesse algérienne croissante façonneront l'avenir du pays, créant une nouvelle génération de professionnels et de dirigeants."
 ALG_anti_corruption_campaign_idea: "Campagne anticorruption"
 ALG_anti_corruption_campaign_idea_desc: "Le gouvernement a lancé une campagne pour extirper la corruption et les abus bureaucratiques, visant à restaurer la confiance publique et à améliorer l'efficacité de l'État."
 ALG_new_era_for_algeria_idea: "Une ère nouvelle pour l'Algérie"
 ALG_new_era_for_algeria_idea_desc: "L'Algérie entre dans une nouvelle ère de réforme et de modernisation, équilibrant innovation et progrès social face aux défis d'une économie mondiale en mutation."
 ALG_open_market_idea: "Politiques de libre marché"
 ALG_open_market_idea_desc: "La libéralisation graduelle de l'économie algérienne invite investissement et entrepreneuriat, au risque de réduire le contrôle traditionnel de l'État sur les industries clés."
 ALG_reform_education_system_idea: "Réformer le système éducatif"
 ALG_reform_education_system_idea_desc: "Des réformes d'ensemble modernisent le système éducatif, promeuvent l'innovation et alignent les écoles sur les besoins d'une économie algérienne moderne."
 ALG_reform_the_judicial_system_idea: "Réforme judiciaire"
 ALG_reform_the_judicial_system_idea_desc: "Des efforts sont en cours pour moderniser le système judiciaire algérien, réduire la corruption et établir des tribunaux plus équitables qui fassent respecter l'État de droit."
 ALG_free_media_idea: "Médias gratuits"
 ALG_free_media_idea_desc: "Des médias indépendants commencent à fleurir, apportant transparence et responsabilité, tout en accroissant aussi la critique et le débat public."
 ALG_black_decade_lesson_idea: "Leçons de la Décennie noire"
 ALG_black_decade_lesson_idea_desc: "Le trauma de la guerre civile hante encore l'Algérie. La nation reste prudente, privilégiant la sécurité au risque, afin que telle instabilité ne revienne jamais."
 ALG_election_day: "Jour d'élection"
 ALG_election_day_desc: "L'heure est venue pour les Algériens de choisir leur avenir. Que le FLN au pouvoir conserve son emprise ou que l'opposition triomphe façonnera le pays pour des décennies."
 ALG_FLN_path: "Victoire du FLN"
 ALG_FLN_path_desc: "Le FLN a de nouveau triomphé, conservant le contrôle du gouvernement et de la direction de l'avenir algérien."
 ALG_FLN_preserve_system: "Préserver le système"
 ALG_FLN_preserve_system_desc: "La direction du FLN ne voit pas besoin de changement radical : préserver l'ordre existant assure stabilité et continuité."
 ALG_FLN_control_media: "Adopter la loi organique n°12-05"
 ALG_FLN_control_media_desc: "En adoptant la loi organique n° 12-05 régissant l'information et l'activité médiatique, l'État peut modeler le récit national tout en maintenant un cadre juridique de contrôle de la presse."
 ALG_election_day_tt: "§YDébloque la voie vers l'élection présidentielle algérienne de 2004.§!\nVous devrez bientôt choisir entre le §RFLN§! au pouvoir et l'§Yopposition§! pour l'avenir du pays."
 ALG_ethnic_kabyle_tt: "La §Ypopulation kabyle§! est supérieure à §Y10%§!"
 ALG_kabyle_satisfaction_tt: "§YSatisfaction kabyle§! est d'au moins §Y65§!"
 ALG_kabyle_satisfaction_70_tt: "La §Ysatisfaction kabyle§! est supérieure à §Y70§!"
 ALG_kabyle_satisfaction_60_tt: "§YSatisfaction kabyle§! est d'au moins §Y60§!"
 ALG_fossil_fuel_industry: "Hall d'entrée de Sonatrach"
 ALG_fossil_fuel_industry_desc: "Le géant énergétique public Sonatrach et son réseau de sous-traitants forment l'une des factions les plus puissantes d'Algérie. Ils défendent les subventions, résistent à la diversification économique et entretiennent des liens étroits avec des compagnies et gouvernements étrangers dépendants du pétrole et du gaz algériens."
 ALG_the_military: "Armée nationale populaire (ANP)"
 ALG_the_military_desc: "L'armée algérienne, l'ANP, est l'ossature de l'État. Elle agit comme gardienne de l'unité et de la stabilité nationales, mais sa domination limite la réforme démocratique. Oscillant entre protection de l'Algérie et restriction du pouvoir civil, l'ANP reste toujours un acteur décisif de la politique."
 ALG_industrial_conglomerates: "CEVITAL-MADAR"
 ALG_industrial_conglomerates_desc: "Les conglomérats industriels, dominés par des géants comme Cevital et Madar Holdings, représentent l'élite oligarchique montante de l'Algérie. Étroitement liés au pouvoir politique et souvent entremêlés à l'armée et aux familles dirigeantes, ces groupes cherchent le profit par la privatisation, les biens de consommation, l'immobilier et le commerce extérieur. Ils peuvent fournir l'investissement et la croissance nécessaires, au prix de la corruption, de l'inégalité et de la capture politique."
 ALG_offices_contruction_speed: "Vitesse de construction des bureaux"
 ALG_arms_factory_contruction_speed: "Vitesse de construction des usines militaires"
 ALG_civ_construction_speed: "Vitesse de construction des usines civiles"
 ALG_population_energy_consumption: "Consommation énergétique de la population"
 ALG_civ_factory_workforce: "Ouvriers nécessaires aux usines civiles"
 ALG_mil_factory_workforce: "Ouvriers nécessaires aux usines militaires"
 ALG_office_workforce: "Employés de bureau recherchés"
 ALG_military_modifier: "Forces armées algériennes"
 ALG_military_modifier_desc: "Représente les capacités et réformes de l'armée algérienne."
 ALG_opposition_path: "La voie de l'opposition"
 ALG_opposition_path_desc: "Alors que l'opposition politique gagne de l'élan, le pays affronte un choix : réformer de l'intérieur ou risquer le chaos. L'heure est venue d'embrasser transparence et progrès."
 ALG_OPP_free_elections: "Organiser des élections libres"
 ALG_OPP_free_elections_desc: "Trop longtemps, la voix du peuple a été étouffée. La vraie démocratie commence par des élections transparentes et équitables."
 ALG_FLN_military_loyalty: "Assurer la loyauté de l'armée"
 ALG_FLN_military_loyalty_desc: "L'armée est un pilier de la stabilité. Assurer sa loyauté préviendra les troubles et sécurisera l'avenir de la nation."
 ALG_FLN_public_works: "Lancer des programmes de travaux publics"
 ALG_FLN_public_works_desc: "En investissant dans l'infrastructure publique, nous fournissons des emplois et renouvelons la foi du peuple dans les institutions."
 ALG_reform_armed_forces: "Réformer les forces armées"
 ALG_reform_armed_forces_desc: "Moderniser la structure militaire assurera efficacité, discipline et loyauté à l'État plutôt qu'aux individus."
 ALG_counter_extremism: "Capacités antiterroristes"
 ALG_counter_extremism_desc: "Les réseaux terroristes menacent notre stabilité nationale. En renforçant renseignement, forces de sécurité et programmes de prévention, nous pouvons accroître les capacités antiterroristes de l'Algérie."
 ALG_regional_power: "Une puissance régionale"
 ALG_regional_power_desc: "La stabilité intérieure acquise, l'Algérie peut projeter force et leadership à travers l'Afrique du Nord et la Méditerranée."
 ALG_expanding_the_power_grid: "Étendre le réseau électrique"
 ALG_expanding_the_power_grid_desc: "Une alimentation électrique fiable est vitale pour la croissance économique. Étendre le réseau énergétique soutiendra l'industrie et le développement rural."
 ALG_OPP_new_constitution: "Rédiger une nouvelle Constitution"
 ALG_OPP_new_constitution_desc: "Une nouvelle constitution posera les fondements de la démocratie, de l'égalité et du pouvoir civil."
 ALG_OPP_media_freedom: "Garantir la liberté des médias"
 ALG_OPP_media_freedom_desc: "La liberté de la presse est essentielle pour tenir les dirigeants responsables et informer le public en vérité."
 ALG_OPP_judiciary_reform: "Réformer la justice"
 ALG_OPP_judiciary_reform_desc: "Une justice indépendante et transparente est la clé pour assurer la justice à tous les citoyens, quels que soient le statut ou l'influence."
 ALG_OPP_education_first: "L'éducation d'abord"
 ALG_OPP_education_first_desc: "Une nation moderne dépend d'une population bien éduquée. Investir dans les écoles et universités façonnera un avenir plus lumineux."
 ALG_OPP_open_market: "Ouvrir le marché"
 ALG_OPP_open_market_desc: "Réformes économiques et libre-échange attireront l'investissement et créeront des opportunités pour les entrepreneurs."
 ALG_OPP_new_era: "Une ère nouvelle pour l'Algérie"
 ALG_OPP_new_era_desc: "Après des années de lutte et de réforme, l'Algérie entre dans un nouveau chapitre de liberté, de prospérité et de stabilité."
 ALG_OPP_anti_corruption: "Combattre la corruption"
 ALG_OPP_anti_corruption_desc: "La corruption draine le potentiel de la nation. L'heure est aux lois strictes, aux institutions transparentes et à la responsabilité à tous les niveaux."
 ALG_OPP_invest_in_youth: "Investir dans la jeunesse"
 ALG_OPP_invest_in_youth_desc: "La jeunesse est l'âme de l'Algérie. En l'émancipant par l'éducation et l'emploi, nous assurons l'avenir de la nation."
 ALG_OPP_state_first: "L’État passe avant tout"
 ALG_OPP_state_first_desc: "En temps de changement, l'unité et l'intérêt national doivent guider chaque politique. L'intégrité de l'État prime le gain partisan."
 ALG_terror_2013_in_amenas_title: "2013 Crise des otages à Amenas"
 ALG_terror_2013_in_amenas_desc: "Un groupe de militants armés liés à des organisations extrémistes a lancé une attaque surprise contre l'installation gazière d'In Amenas, dans le sud algérien. Les assaillants ont pris des centaines d'otages, dont des travailleurs étrangers, déclenchant une crise internationale. L'armée algérienne a promptement encerclé le site, menant à une impasse sanglante qui a choqué le monde et soulevé des questions sur la capacité du gouvernement à gérer le terrorisme dans les régions désertiques."
 ALG_terror_2013_placeholder_option: "Nos forces répondent avec fermeté."
 ALG_terror_2013_low_tt: "Troubles mineurs contenus. §GLa stabilité s'améliore légèrement.§!"
 ALG_terror_2013_medium_tt: "La situation s'aggrave, alimentant la §Oradicalisation§! et réduisant la §Rstabilité§!."
 ALG_terror_2013_high_tt: "L'attaque échappe à tout contrôle. La §Rstabilité nationale s'effondre§! tandis que les §Oinsurgés radicaux§! gagnent du terrain."
 ALG_healthcare_reform_tt: "Le §Ymécontentement public§! doit être inférieur à §Y40§! pour lancer la réforme de la santé."
 ALG_education_reform_tt: "Le §Ymécontentement public§! doit être inférieur à §Y40§! pour lancer la réforme de l'éducation."
 ALG_unemployment_reform_tt: "Le §Ymécontentement public§! doit être inférieur à §Y40§! pour lancer la réforme du chômage."
 ALG_employment_TT: "§HLe chômage§! est inférieur à §H20%§!"
 ALG_grand_mosque: "La Grande Mosquée d'Alger"
 ALG_grand_mosque_desc: "Symbole du renouveau spirituel et culturel de l'Algérie, la Grande Mosquée d'Alger est l'une des plus hautes et des plus magnifiques du monde. Sa construction démontre l'ambition architecturale de la nation et sert de phare du patrimoine et de l'unité islamiques. Achever ce projet monumental renforcera la fierté nationale et projettera l'influence de l'Algérie dans le monde musulman."
 ALG_big_cities_or_rising_states: "Programme de développement urbain ou régional"
 ALG_big_cities_or_rising_states_desc: "Après le programme de relance d'après-guerre, le gouvernement doit décider de la suite : concentrer les ressources sur les grandes villes côtières pour renforcer l'ossature industrielle de l'Algérie, ou relever l'intérieur et le désert pour une croissance nationale équilibrée ?"
 ALG_focus_on_big_cities: "Se concentrer sur les grandes villes"
 ALG_focus_on_big_cities_desc: "Les centres urbains comme Alger, Oran et Constantine sont les moteurs de l'économie algérienne. En y concentrant nos efforts de développement, nous pouvons moderniser l'infrastructure et améliorer la productivité."
 ALG_rising_states_program: "Programme des régions émergentes"
 ALG_rising_states_program_desc: "Tandis que les villes côtières prospèrent, l'intérieur décroche. Le programme des États montants vise à apporter routes, écoles et industries au cœur de l'Algérie, afin qu'aucune wilaya ne soit laissée pour compte."
 ALG_develop_atlas: "Développer l'Atlas algérien"
 ALG_develop_atlas_desc: "Les régions montagneuses de l'Atlas recèlent un grand potentiel agricole et de petite industrie. L'investissement ici améliorera le niveau de vie local et créera une sécurité alimentaire de long terme."
 ALG_develop_kabylia: "Étendre la région de Kabylie"
 ALG_develop_kabylia_desc: "La Kabylie a une forte identité culturelle et un peuple laborieux. Développer son infrastructure et ses bureaux renforcera à la fois la fierté régionale et l'unité nationale."
 ALG_develop_aures: "Croissance agricole dans les Aurès"
 ALG_develop_aures_desc: "Les montagnes des Aurès abritent de vastes terres agricoles et des communautés laborieuses. Moderniser la production agricole ici réduira la pauvreté rurale et stabilisera l'approvisionnement alimentaire."
 ALG_expand_oran: "Étendre la zone industrielle d'Oran"
 ALG_expand_oran_desc: "Oran est l'une des plus importantes villes industrielles et portuaires d'Algérie. Étendre sa zone industrielle créera des emplois et stimulera les exportations."
 ALG_expand_algiers: "Moderniser Alger"
 ALG_expand_algiers_desc: "Cœur battant de l'Algérie, Alger doit continuer d'évoluer. Nouveaux bureaux, infrastructure et réformes urbaines en feront une capitale nord-africaine modèle."
 ALG_expand_constantine: "Investir dans Constantine"
 ALG_expand_constantine_desc: "La longue histoire d'éducation et de culture de Constantine en fait un pôle idéal d'enseignement supérieur et d'innovation. Investir ici créera une nouvelle génération de penseurs et d'ingénieurs algériens."
 ALG_develop_tamanrasset: "Développer les infrastructures de Tamanrasset"
 ALG_develop_tamanrasset_desc: "Au fond du Sahara, Tamanrasset est la clé de la logistique sud-algérienne. Routes, nœuds d'approvisionnement et communications relieront le désert au nord."
 ALG_develop_mzab: "Électrifier la vallée du Mzab"
 ALG_develop_mzab_desc: "La région du Mzab a un esprit résilient et des besoins énergétiques croissants. Construire de nouvelles centrales fournira électricité et emplois à la population locale."
 ALG_develop_granderg: "Exploiter les ressources du Grand Erg"
 ALG_develop_granderg_desc: "Le Grand Erg Occidental peut sembler vide, mais sa richesse souterraine raconte une autre histoire. Développer l'extraction pétrolière ici renforcera la position de l'Algérie comme producteur d'énergie."
 ALG_FIS.1.t: "Le retour des oulémas"
 ALG_FIS.1.d: "Au sein du Front islamique du salut, un débat intense a surgi sur la direction de notre mouvement. Les savants wahhabites, inspirés par les interprétations saoudiennes strictes, appellent à une purification complète de l'islam et de la politique algériens de ce qu'ils voient comme des innovations corrompues. Cependant, les oulémas traditionnels d'Algérie plaident pour un retour au guidage spirituel et à la réforme nationale dans un cadre islamique plus tolérant.\n\nNotre choix définira l'âme du mouvement."
 ALG_FIS.1.a: "Suivre les oulémas wahhabites. Purifier et renforcer la foi"
 ALG_FIS.1.b: "Soutenir les oulémas traditionnels. Réformer et guider la nation"
 ALG_FIS.2.t: "L'avenir du Front islamique du salut"
 ALG_FIS.2.d: "En 1991, après les manifestations de masse menées par le Front islamique du salut (FIS), les autorités algériennes ont répondu par la force, marquant l'un des tournants les plus sanglants de l'histoire moderne de la nation. Le fondateur du mouvement, Abbassi Madani, a été condamné à quinze ans de prison après les événements de juin, au cours desquels l'armée et la police ont dispersé violemment des milliers de partisans du FIS. Le général Khaled Nezzar a ordonné l'arrestation de Madani et imposé un état d'urgence visant à démanteler le parti et à réprimer l'influence islamiste. La répression a mené au chaos, aux victimes civiles et à la dissolution de tout espoir de réforme pacifique, étincelle qui a enflammé la dévastatrice guerre civile algérienne, plus tard connue comme la Décennie noire. Abbassi Madani emprisonné et la direction du FIS dispersée, de nouvelles figures ont émergé. Désormais, alors que notre influence ressurgit en silence, la question se pose : qui nous mènera à travers cette ère de sang et de sacrifice vers une nouvelle vision pour l'Algérie ?"
 ALG_FIS.2.a: "Nommer le cofondateur et la voix du peuple. Ali Belhadj"
 ALG_FIS.2.b: "Embrasser la voie de la lutte. Abdelhak Layada, fondateur du GIA"
 ALG_ps_victory: "Victoire du Front du salut populaire"
 ALG_ps_victory_desc: "Le Front islamique du salut a triomphé. L'Algérie est à la croisée des chemins, entre foi et ordre, entre la mosquée et la caserne. Nous devons maintenant consolider cette nouvelle aube du pouvoir."
 ALG_consolidate_power: "Consolider le nouvel ordre"
 ALG_consolidate_power_desc: "Le pouvoir doit être assuré à tous les niveaux de la société. Le parti, les oulémas et les groupes armés doivent désormais servir un seul dessein : la préservation de notre règne."
 ALG_national_reconstruction: "Reconstruction nationale"
 ALG_national_reconstruction_desc: "Notre nation meurtrie par la guerre doit être reconstruite sur les ruines. La reconstruction exigera foi et pragmatisme, tandis que nous restaurons l'industrie et la confiance publique."
 ALG_religious_reconciliation: "Réconciliation religieuse"
 ALG_religious_reconciliation_desc: "Les divisions parmi les savants islamiques d'Algérie menacent notre unité. Nous devons réconcilier nos différences et créer un fondement religieux unifié pour le nouvel État."
 ALG_crackdown_purges: "Répressions et purges"
 ALG_crackdown_purges_desc: "Pour maintenir le pouvoir, nous devons éliminer l'opposition. Les restes de l'ancien régime, les officiers laïcs et les factions dissidentes doivent être purgés."
 ALG_unify_parties: "Unifier les mouvements islamiques"
 ALG_unify_parties_desc: "Les divers groupes islamistes qui ont soutenu notre montée doivent désormais être rassemblés sous une seule bannière. L'unité de l'Oumma commence chez soi."
 ALG_infrastructure_crash: "Restauration des infrastructures"
 ALG_infrastructure_crash_desc: "La guerre civile a laissé notre infrastructure en ruines. Nous lancerons des programmes d'urgence pour restaurer routes, ponts et réseaux."
 ALG_industry_investment: "Investissements industriels"
 ALG_industry_investment_desc: "Pour soutenir la relance de long terme, nous devons investir dans l'industrie nationale et soutenir les entrepreneurs locaux guidés par les principes économiques islamiques."
 ALG_madrasa_reforms: "Réformes de la madrasa"
 ALG_madrasa_reforms_desc: "L'éducation doit s'aligner sur les besoins modernes et les valeurs religieuses. Réformer nos médersas assurera une nouvelle génération de savants et d'ingénieurs ancrés dans la foi."
 ALG_community_outreach: "Programmes de sensibilisation communautaire"
 ALG_community_outreach_desc: "Nous renforcerons notre lien avec les communautés locales par des initiatives sociales, promouvant unité et solidarité sous les valeurs islamiques."
 ALG_internal_security: "Appareil de sécurité intérieure"
 ALG_internal_security_desc: "Nous devons établir un réseau de sécurité intérieure loyal pour réprimer les troubles et protéger la révolution de l'intérieur."
 ALG_intelligence_network: "Bureau du renseignement islamique"
 ALG_intelligence_network_desc: "Un service de renseignement efficace nous permettra d'anticiper les menaces et de neutraliser les conspirations avant qu'elles ne prennent racine."
 ALG_transport_upgrade: "Modernisation des transports"
 ALG_transport_upgrade_desc: "Des systèmes de transport modernes accéléreront le commerce, amélioreront la mobilité et relieront les régions d'Algérie plus étroitement que jamais."
 ALG_energy_program: "Programme énergétique national"
 ALG_energy_program_desc: "Développer les sources d'énergie renouvelables comme conventionnelles fournira l'ossature de la nouvelle économie algérienne."
 ALG_scholastic_centers: "Centres de recherche universitaire"
 ALG_scholastic_centers_desc: "Nos savants et scientifiques travailleront côte à côte pour faire avancer le savoir islamique et la science moderne au service du progrès national."
 ALG_social_welfare: "Expansion de la protection sociale"
 ALG_social_welfare_desc: "Nous prendrons soin des pauvres, des veuves et des déplacés, assurant que chaque Algérien bénéficie des bénédictions de notre gouvernance guidée par la foi."
 ALG_military_rebuild: "Reconstruire l'armée de la foi"
 ALG_military_rebuild_desc: "L'armée doit être reconstruite et purifiée de la corruption. Une force disciplinée défendra la révolution et la nation."
 ALG_garrison_restructure: "Restructuration de la garnison"
 ALG_garrison_restructure_desc: "Nous devons réorganiser nos garnisons pour assurer loyauté, efficacité et préparation contre les menaces extérieures ou intérieures."
 ALG_factory_output: "Expansion de la production industrielle"
 ALG_factory_output_desc: "Nos investissements portent leurs fruits. Les usines tourneront désormais à pleine capacité pour alimenter la croissance économique."
 ALG_oil_and_minerals: "Développement du pétrole et des minerais"
 ALG_oil_and_minerals_desc: "Les abondantes ressources naturelles de l'Algérie sont un don divin. Nous les exploiterons de façon responsable pour assurer l'indépendance énergétique."
 ALG_religious_council: "Établir le conseil religieux"
 ALG_religious_council_desc: "Un conseil suprême d'oulémas guidera la direction morale et spirituelle de la nation, assurant que chaque loi soit conforme à la charia."
 ALG_national_cohesion: "Cohésion nationale"
 ALG_national_cohesion_desc: "Par l'aide sociale et la foi, nous guérirons les divisions de la guerre et forgerons une nouvelle identité algérienne unie."
 ALG_border_defences: "Renforcer les frontières"
 ALG_border_defences_desc: "Nos frontières doivent être fortifiées contre l'infiltration et la contrebande. Les ennemis de la révolution sont au-delà et au-dedans."
 ALG_strategic_reserves: "Programme de réserves stratégiques"
 ALG_strategic_reserves_desc: "Nous stockerons des approvisionnements et étendrons nos réserves pour assurer l'endurance en temps de guerre ou d'instabilité économique."
 ALG_heavy_industry: "Développer l’industrie lourde"
 ALG_heavy_industry_desc: "Nous pousserons notre base industrielle au-delà des biens de consommation, en nous concentrant sur les machines lourdes, l'acier et la production d'armes."
 ALG_international_trade: "Étendre le commerce international"
 ALG_international_trade_desc: "En commerçant avec les nations amies du monde islamique, l'Algérie peut devenir un hub de commerce guidé par la foi."
 ALG_cultural_influence: "Initiative d'influence culturelle"
 ALG_cultural_influence_desc: "Nous exporterons notre culture, notre foi et notre exemple, répandant le modèle algérien de renouveau islamique."
 ALG_welfare_programs: "Programmes de bien-être"
 ALG_welfare_programs_desc: "Des initiatives d'aide sociale d'ensemble renforceront notre légitimité et protégeront les plus vulnérables."
 ALG_army_of_salvation: "Armée du Salut"
 ALG_army_of_salvation_desc: "L'armée du salut sera le bouclier de l'islam et l'épée de l'Algérie : disciplinée, fidèle et inflexible."
 ALG_nation_energy_independence: "Indépendance énergétique nationale"
 ALG_nation_energy_independence_desc: "Notre énergie pleinement sous contrôle national, nous nous libérerons de la dépendance étrangère."
 ALG_international_outreach: "Sensibilisation islamique internationale"
 ALG_international_outreach_desc: "Nous tendrons la main au monde islamique, bâtissant des ponts avec les mouvements et nations qui partagent notre vision."
 ALG_regional_leadership: "Leadership régional"
 ALG_regional_leadership_desc: "L'Algérie s'affirmera comme leader politique, religieux et économique en Afrique du Nord et au-delà."
 ALG_technological_renaissance: "Renaissance technologique"
 ALG_technological_renaissance_desc: "Foi et science ne sont pas ennemies. Nous mènerons une nouvelle ère d'avancée technologique guidée par l'éthique islamique."
 ALG_islamic_coalition: "Former la coalition islamique"
 ALG_islamic_coalition_desc: "L'unité de l'Oumma doit être restaurée par la coopération. L'Algérie mènera une coalition de nations islamiques vers une prospérité mutuelle."
 ALG_grand_strategy: "La grande stratégie"
 ALG_grand_strategy_desc: "Notre nation se dresse désormais forte, militairement, économiquement et spirituellement. Il est temps de tracer une vision de long terme pour notre civilisation."
 ALG_final_salvation: "Salut final"
 ALG_final_salvation_desc: "L'étape finale de notre chemin : créer une société pleinement guidée par la loi divine et la force morale."
 FIS_rust_belt_rejuvenation: "Rajeunissement de la ceinture antirouille"
 FIS_rule_to_perfection: "Gouverner vers la perfection"
 FIS_new_islamic_architecture: "Nouvelle architecture islamique"
 FIS_prioritize_military_industries: "Prioriser les industries militaires"
 FIS_industrialize_the_umma: "Industrialiser l'Oumma"
 ALG_fis_win: "Victoire du Front islamique du salut"
 ALG_fis_win_desc: "Par la persévérance, l'unité et le guidage divin, le Front islamique du salut a triomphé de ses adversaires. Le chemin à venir est celui d'une gouvernance spirituelle et du renouveau. Un nouveau chapitre s'ouvre pour l'Algérie, défini par la foi, la justice et la volonté d'Allah."
 ALG_fis_win_tt: "§YDébloque l'arbre de focus du Front islamique du salut (FIS)§!"
 alg_politics_news.1.t: "Abdallah Djaballah établit le FJD"
 alg_politics_news.1.d: "Abdallah Djaballah, ancien dirigeant du Mouvement pour la réforme nationale (Islah) et fondateur d'Ennahda, a annoncé la création d'un nouveau parti politique, le Front pour la justice et le développement (FJD). S'inspirant du Parti de la justice et du développement turc (AKP), le FJD cherche à fusionner principes islamiques, modération politique et développement national. Le mouvement vise à renouveler la confiance publique dans la politique islamiste en mettant l'accent sur la justice, la réforme et la gouvernance éthique dans l'Algérie de l'après-guerre civile."
 alg_politics_news.1.a: "Un nouveau mouvement islamiste entre sur la scène politique algérienne."
 algerian.1.t: "Demande algérienne d'investissement infrastructurel"
 algerian.1.d: "Le gouvernement algérien nous a approchés avec une proposition de financer la construction de routes agricoles et d'infrastructure rurale. Cet investissement améliorerait la distribution agricole et la capacité industrielle en Algérie, tout en nous permettant d'étendre notre influence politique et économique. Toutefois, l'initiative exigerait une contribution financière de notre Trésor."
 algerian.1.a: "Financer le projet d'infrastructure"
 algerian.1.b: "Décliner la demande"
 algerian.4.t: "Coopération infrastructurelle approuvée"
 algerian.4.d: "La Tunisie a accepté de soutenir notre initiative d'infrastructure agricole. L'investissement renforcera notre économie rurale et notre capacité industrielle tout en améliorant les relations bilatérales."
 algerian.4.a: "Un pas en avant pour notre économie"
 algerian.5.t: "Financement d'infrastructure rejeté"
 algerian.5.d: "La Tunisie a décliné de financer notre initiative d'infrastructure. Sans soutien étranger, le développement des routes agricoles et projets connexes sera retardé."
 algerian.5.a: "Nous nous débrouillerons seuls"
 algeria_news.30.t: "Le soulèvement du Printemps noir"
 algeria_news.30.d: "Après des années de troubles en région kabyle, vous devez décider comment répondre aux revendications croissantes de la population berbère."
 algeria_news.30.a: "Accorder la pleine indépendance aux Kabyles"
 algeria_news.30.b: "Accorder l'autonomie aux Kabyles"
 algeria_news.30.c: "Réprimer le soulèvement"
 algeria_news.30_a_tt: "Choisir cette voie créera un État kabyle indépendant. La stabilité augmente, du pouvoir politique est gagné."
 algeria_news.30_b_tt: "Choisir l'autonomie accorde aux Kabyles un autogouvernement limité (Barbacha). La stabilité augmente modérément et du pouvoir politique est gagné."
 algeria_news.30_c_tt: "Réprimer les Kabyles diminuera la stabilité et le soutien à la guerre, mais vous gagnez un peu de pouvoir politique."
 AlgeriaFocusEvents.43.t: "Invitation au Conseil des mondes islamiques"
 AlgeriaFocusEvents.43.d: "La direction de [Root.GetName] a reçu une invitation formelle à rejoindre le Conseil des mondes islamiques. L'adhésion renforcerait la coopération économique entre nations islamiques, ouvrirait de nouvelles opportunités commerciales et renforcerait notre alignement politique commun. Toutefois, rejoindre pourrait nous éloigner des blocs économiques non islamiques."
 AlgeriaFocusEvents.43.a: "Rejoindre le Conseil"
 AlgeriaFocusEvents.43.b: "Décliner l'invitation"
 AlgeriaFocusEvents.41.t: "Invitation au Conseil des mondes islamiques"
 AlgeriaFocusEvents.41.d: "L'Algérie nous a formellement invités à rejoindre le Conseil des mondes islamiques. La proposition met l'accent sur la coopération économique, la coordination politique et le renforcement des liens entre nations islamiques. Accepter pourrait rehausser notre standing régional, tandis que le refus pourrait tendre les relations."
 AlgeriaFocusEvents.41.a: "C'est une bonne idée"
 AlgeriaFocusEvents.41.b: "Nous ne sommes pas intéressés"
 AlgeriaFocusEvents.411.t: "L'Irak décline l'invitation"
 AlgeriaFocusEvents.411.d: "Le gouvernement irakien a poliment décliné notre invitation à rejoindre le Conseil des mondes islamiques, invoquant des considérations stratégiques et des priorités nationales."
 AlgeriaFocusEvents.411.a: "Dommage mais noté"
 AlgeriaFocusEvents.42.t: "Invitation au Conseil des mondes islamiques"
 AlgeriaFocusEvents.42.d: "Nous avons reçu une réponse officielle concernant notre initiative d'étendre le Conseil des mondes islamiques. La nation invitée examine s'il faut s'aligner économiquement et politiquement sur le CMI."
 AlgeriaFocusEvents.42.a: "Les accueillir au Conseil"
 AlgeriaFocusEvents.42.b: "Ils ont refusé"
 AlgeriaFocusEvents.421.t: "Invitation rejetée"
 AlgeriaFocusEvents.421.d: "Le pays invité a décliné de participer au Conseil des mondes islamiques. Nos efforts diplomatiques devront être réorientés ailleurs."
 AlgeriaFocusEvents.421.a: "Très bien"
 AlgeriaFocusEvents.81.t: "Invitation à l'alliance du CMI"
 AlgeriaFocusEvents.81.desc: "Nous avons reçu une invitation à rejoindre l'alliance du Conseil des mondes islamiques. La proposition promet une coopération accrue et un soutien mutuel, bien qu'elle puisse exiger des concessions en retour."
 AlgeriaFocusEvents.81.a: "Seulement avec des garanties en retour"
 AlgeriaFocusEvents.81.b: "Absolument pas"
 ALG_power_struggle_resistance_dominant: "§RLe peuple est en défi ouvert du régime§!"
 ALG_power_struggle_army_dominant: "§BL'armée contrôle fermement la situation§!"
 ALG_power_struggle_resistance_rising: "§YLa pression populaire monte contre l'establishment§!"
 ALG_power_struggle_army_rising: "§YL'armée réaffirme son emprise sur le pouvoir§!"
 ALG_power_struggle_stable: "§WUn équilibre fragile tient encore§!"
 ALG_west_alignment_tt: "Formaliser un partenariat stratégique avec les États-Unis et approfondir les liens avec l'OTAN et l'UE. Cela donne accès à la technologie et à l'investissement occidentaux mais peut tendre les relations avec la Chine et la Russie."
 ALG_china_alignment_tt: "Approfondir la coopération avec la Chine dans le cadre des Nouvelles routes de la soie. Attendez-vous à d'importants investissements d'infrastructure et à une croissance commerciale, mais les puissances occidentales seront méfiantes."
 alg_crackdown.1.t: "Des manifestations éclatent à Alger"
 alg_crackdown.1.d: "L'arrestation de figures de l'opposition a déclenché des manifestations de rue. Les protestataires exigent une réforme politique et la fin de la répression."
 alg_crackdown.1.a: "Écraser les protestations."
 alg_crackdown.1.b: "Libérez certains détenus."
 alg_crackdown.2.t: "Grèves et manifestations nationales"
 alg_crackdown.2.d: "L'interdiction des partis d'opposition a déclenché un mouvement de masse rappelant les protestations du Hirak. Le pays est paralysé."
 alg_crackdown.2.a: "Déployer l'armée."
 alg_crackdown.2.b: "Ouvrir le dialogue et lever l'interdiction."
 democratic_reforms: "Processus de réformes démocratiques"
 ALG_healthcare_success_tt: "Nos réformes de la santé amélioreront la santé publique et réduiront les griefs."
 ALG_healthcare_failure_tt: "Échouer à livrer la réforme de la santé approfondira la colère publique et renforcera la position politique de l'armée."
 ALG_education_success_tt: "La réforme éducative modernisera notre main-d'œuvre et réduira le mécontentement."
 ALG_education_failure_tt: "La crise éducative continue. La frustration publique monte."
 ALG_unemployment_success_tt: "Les programmes de création d'emplois réduiront le chômage et stabiliseront le pays."
 ALG_unemployment_failure_tt: "Échouer à traiter le chômage déclenchera grèves et troubles."
 ALG_tamazgha.1.t: "Invitation de Tamazgha"
 ALG_tamazgha.1.d: "Le gouvernement de [FROM.GetName], désormais rebaptisé « Tamazgha », nous a contactés avec une proposition de former une nouvelle alliance régionale fondée sur un héritage amazigh partagé et une coopération culturelle. Ils affirment que cette confédération fournira développement économique mutuel, sécurité, et un rejet des structures panarabes datées comme la Ligue arabe.\n\nSi certains dans notre gouvernement y voient une opportunité historique, d'autres questionnent les intentions et les buts de long terme de Tamazgha."
 ALG_tamazgha.1.a: "Nous rejoindrons la Confédération de Tamazgha."
 ALG_tamazgha.1.b: "Ce n'est pas notre combat."
 ALG_election_time_idea: "Préparation de la prochaine élection"
 ALG_casablanca_decisions: "Initiative de Casablanca"
 ALG_casablanca_decisions_desc: "Options diplomatiques pour faire pression sur le Maroc au sujet du Sahara occidental par l'Union africaine ou des canaux internationaux."
 ALG_casablanca_mission_tt: "Lancer la mission de l'Initiative de Casablanca. Exige d'abord de choisir une approche. La mission dure 180 jours et produit un résultat faible/moyen/élevé."
 ALG_casablanca_mission_desc: "Lancer la poussée diplomatique limitée dans le temps. L'issue détermine si la pression de l'UA peut retirer les revendications du Maroc ou (en cas de fort succès) retirer les cœurs."
 ALG_casablanca_approach_tt: "Choisir une approche stratégique pour l'Initiative de Casablanca. Une seule approche peut être choisie ; puis lancer la tuile de mission pour mener la campagne."
 ALG_casablanca_approach_great_powers: "Cour des grandes puissances"
 ALG_casablanca_approach_great_powers_desc: "Dépenser du pouvoir politique à courtiser les grandes puissances (États-Unis/Espagne/Russie). Plus haute chance de produire une pression décisive de l'UA, mais coûteux et politiquement risqué."
 ALG_casablanca_approach_regional: "Priorité régionale uniquement"
 ALG_casablanca_approach_regional_desc: "S'appuyer sur les partenaires régionaux et éviter l'influence des grandes puissances. Moins cher et moins risqué, mais moins susceptible d'obtenir des résultats décisifs."
 ALG_casablanca_approach_mixed: "Stratégie mixte"
 ALG_casablanca_approach_mixed_desc: "Combiner pression régionale et internationale. Coût et chances équilibrés."
 ALG_morocco.2.t: "Pression de l'UA et de l'ONU sur le Maroc"
 ALG_morocco.2.d: "Après la campagne diplomatique algérienne à l'UA et à l'ONU, le Maroc affronte une pression internationale au sujet du Sahara occidental. Le royaume se conformera-t-il aux demandes, ou résistera-t-il au risque de sanctions ?"
 ALG_morocco.2.a: "Se conformer sous pression"
 ALG_morocco.2.b: "Résister à la pression, risquer des sanctions"
 Algeria_events.5.t: "Campagne anti-braconnage réussie"
 Algeria_events.5.desc: "Grâce à nos efforts coordonnés, des centaines d'animaux menacés ont été protégés ces derniers mois. Cela a non seulement réduit la chasse illégale mais aussi aidé à préserver des écosystèmes désertiques fragiles, ralentissant les effets de la désertification dans les régions concernées."
 Algeria_events.5.a: "Excellent"
 Algeria_events.6.t: "Campagne anti-braconnage infructueuse"
 Algeria_events.6.desc: "Malgré nos tentatives de protéger la faune, les braconniers poursuivent leurs activités comme d'habitude. L'écosystème désertique reste menacé, et notre campagne a eu peu d'effet pour freiner la désertification ou la chasse illégale."
 Algeria_events.6.a: "Tous ces efforts gaspillés !"
 ALG_ethnic_arab_display: "Arabes : [?ALG_ethnic_arab]%"
 ALG_ethnic_kabyle_display: "Kabyle : [?ALG_ethnic_kabyle]%"
 ALG_kabyle_content: "Coopération kabyle"
 ALG_kabyle_content_desc: "Le peuple kabyle, traditionnellement très éduqué, contribue avec enthousiasme au développement national et à la recherche."
 ALG_kabyle_discontent: "Mouvement pour l'autonomie kabyle"
 ALG_kabyle_discontent_desc: "Des militants kabyles organisent des protestations exigeant la reconnaissance du tamazight et une plus grande autonomie régionale. L'ombre du Printemps noir plane."
 ALG_kabyle_unrest: "Crise Kabylie"
 ALG_kabyle_unrest_desc: "La région kabyle est en révolte ouverte. Manifestations, grèves et désobéissance civile paralysent la région. Une action urgente s'impose."
 ALG_black_spring_happened: "Le printemps noir s'est produit"
 ALG_has_conducted_census: "A mené un recensement national"
 ALG_ethnic_system_active: "Affaires ethniques établies"
 ALG_can_enact_ethnic_policy: "Peut adopter une nouvelle politique ethnique"
 algeria_power_balance: "Lutte politique algérienne"
 algeria_old_guard: "Le Pouvoir (Vieille Garde)"
 algeria_reformists: "Mouvement Hirak (réformistes)"
 algeria_compromise_range: "Compromis fragile"
 algeria_compromise_range_desc: "Aucun camp ne domine. Un statu quo précaire persiste tandis que les deux factions manœuvrent pour l'avantage."
 old_guard_leaning: "Influence de la vieille garde"
 old_guard_leaning_desc: "L'establishment militaire commence à réaffirmer sa domination traditionnelle."
 old_guard_partial_control: "Consolidation de la vieille garde"
 old_guard_partial_control_desc: "Le Pouvoir resserre son emprise. Les voix réformatrices sont marginalisées."
 old_guard_strong_control: "Dérive autoritaire"
 old_guard_strong_control_desc: "L'appareil de sécurité domine la vie politique. Les institutions démocratiques s'érodent."
 old_guard_full_control: "Domination militaire"
 old_guard_full_control_desc: "Le Pouvoir contrôle l'Algérie d'une poigne de fer. Les libertés civiles sont gravement restreintes."
 reformists_leaning: "Mouvements réformistes"
 reformists_leaning_desc: "La société civile s'enhardit. L'esprit du Hirak renaît."
 reformists_gaining_ground: "Dynamique réformiste"
 reformists_gaining_ground_desc: "Le mouvement réformiste gagne en force. La vieille garde peine à conserver le contrôle."
 reformists_strong_momentum: "Poussée démocratique"
 reformists_strong_momentum_desc: "Les réformistes dominent le discours public. Un véritable changement semble possible."
 reformists_victory: "Transition Démocratique"
 reformists_victory_desc: "L'Algérie embrasse le pouvoir civil et le pluralisme. L'emprise du Pouvoir est brisée."
 ALG_political_struggle: "Lutte politique algérienne"
 ALG_political_struggle_desc: "La bataille entre la vieille garde et les réformistes façonnera l'avenir de l'Algérie.\nÉquilibre actuel : [ALG_power_struggle_state]\nEmprise militaire : [ALG_army_grip_text]\nGrief public : [ALG_grievance_text]"
 ALG_power_struggle_state: "Situation politique"
 ALG_boost_reformists_tt: "Canaliser des ressources vers les politiciens réformistes et les groupes de la société civile.\nDécale l'équilibre vers les réformistes de §G+0.15§!."
 ALG_boost_old_guard_tt: "Renforcer le soutien parmi les anciens combattants et l'establishment de sécurité.\nDécale l'équilibre vers la vieille garde de §R-0.15§!."
 ALG_rally_students_tt: "Mobiliser les mouvements étudiants et militants de jeunesse en faveur de la réforme.\nDécale l'équilibre vers les réformistes de §G+0.08§!."
 ALG_mobilize_veterans_tt: "Rassembler les vétérans de la guerre d'indépendance et les officiers à la retraite.\nDécale l'équilibre vers la vieille garde de §R-0.08§!."
 ALG_bribe_elites_tt: "User du clientélisme pour s'assurer la loyauté des élites.\nFait basculer l'équilibre vers la vieille garde de §R-0.05§!.\nCoûte §R30§! au Trésor. Risque d'alimenter la corruption."
 ALG_compromise_tt: "Négocier un partage du pouvoir entre réformistes et vieille garde.\nRamène l'équilibre vers le centre de §W±0.08§!."
 ALG_media_campaign_reform_tt: "Lancer une campagne médiatique promouvant les valeurs démocratiques.\nFait pencher la balance vers les réformistes de §G+0.05§!."
 ALG_security_crackdown_tt: "Autoriser les forces de sécurité à réprimer la dissidence.\nFait basculer l'équilibre vers la vieille garde de §R-0.05§!."
 ALG_world_tension_security_tt: "L'instabilité mondiale justifie un appareil de sécurité plus fort.\nFait basculer l'équilibre vers la vieille garde de §R-0.08§!."
 ALG_world_tension_high_security_tt: "De graves tensions mondiales exigent des mesures de sécurité extraordinaires.\nFait basculer l'équilibre vers la vieille garde de §R-0.12§!."
 ALG_crackdown_momentum_tt: "Notre politique de répression renforce la position de la vieille garde.\nDécale l'équilibre vers la vieille garde de §R-0.10§!."
 ALG_reconciliation_momentum_tt: "Notre approche de réconciliation donne du poids aux voix réformistes.\nDécale l'équilibre vers les réformistes de §G+0.10§!."
 ALG_oil_patronage_tt: "Utiliser les recettes pétrolières pour financer les réseaux clientélistes.\nFait basculer l'équilibre vers la vieille garde de §R-0.06§!.\nCoûte §R25§! au Trésor mais accroît la stabilité."
 ALG_economic_reforms_tt: "Mettre en œuvre des mesures de libéralisation économique et de transparence.\nDécale l'équilibre vers les réformistes de §G+0.08§!."
 ALG_elite_patronage: "Réseaux de mécénat d'élite"
 ALG_elite_patronage_desc: "Nous achetons la stabilité par le clientélisme, mais cela approfondit la corruption et draine les ressources."
 alg_politics.10.t: "Les pourparlers de compromis"
 alg_politics.10.d: "Des représentants des deux factions se sont rencontrés en secret. Un compromis a été trouvé — mais les deux camps l'honoreront-ils ?"
 alg_politics.10.a: "Accepter l'accord"
 alg_politics.10.b: "Rejeter et poursuivre la lutte"
 alg_politics.20.t: "Les réformistes prennent le pouvoir"
 alg_politics.20.d: "Le mouvement réformiste a atteint une masse critique. La vieille garde affronte un choix : s'effacer ou combattre."
 alg_politics.20.a: "Accepter la transition démocratique"
 alg_politics.20.b: "L'armée ne se rendra pas"
 alg_politics.21.t: "Coup d'État militaire imminent"
 alg_politics.21.d: "Les généraux ont consolidé le pouvoir et s'apprêtent à écarter les réformistes civils."
 alg_politics.21.a: "Accepter l'autorité militaire"
 alg_politics.21.b: "Défendre le mouvement réformiste"
 alg_politics.22.t: "Ombres sur Alger"
 alg_politics.22.d: "L'establishment de sécurité s'enhardit. L'Algérie dérive vers l'autoritarisme. Comment répondre ?"
 alg_politics.22.a: "La sécurité d'abord"
 alg_politics.22.b: "Apaiser les tensions avant qu'il ne soit trop tard"
 alg_politics.23.t: "Vents de changement"
 alg_politics.23.d: "Le mouvement réformiste se renforce. Mais le Pouvoir commande encore les forces de sécurité. Comment procéder ?"
 alg_politics.23.a: "Pousser les réformes"
 alg_politics.23.b: "Ralentir pour éviter un retour de bâton"
 ALG_political_truce: "Trêve politique"
 ALG_political_truce_desc: "Un compromis fragile tient entre réformistes et vieille garde."
 ALG_tamazight_integration_process: "Processus d'intégration du tamazight"
 ALG_tamazight_integration_process_desc: "La reconnaissance officielle de la langue tamazight est mise en œuvre dans les institutions de l'État. Si cela a largement apaisé les régions, le basculement bureaucratique et l'ajustement de l'identité nationale causent une période temporaire de friction vers la pleine cohésion sociale."
 ALG_auto.1.t: "Scandale de l'industrie automobile"
 ALG_auto.1.desc: "Des révélations ont émergé sur une corruption généralisée dans l'industrie automobile algérienne. Plusieurs partenariats étrangers, dont Renault, BMW et Mercedes, ont été impliqués dans des schémas de pots-de-vin et des importations frauduleuses. Le public est indigné et exige une action."
 ALG_auto.1.a: "Lancer une enquête complète"
 ALG_auto.1.b: "Étouffer l'affaire"
 ALG_auto.2.t: "Réaction au scandale automobile"
 ALG_auto.2.desc: "Après l'enquête sur le scandale, nous devons décider comment gérer les importations automobiles à l'avenir. Une interdiction totale enverrait un message fort mais endommagerait notre économie. Des restrictions partielles offrent un terrain d'entente."
 ALG_auto.2.a: "Instaurer un embargo total sur les importations"
 ALG_auto.2.b: "Mettre en œuvre des restrictions partielles"
 ALG_auto.2.c: "Ne prendre aucune mesure sur les importations"
 ALG_auto.3.t: "Fiat propose un partenariat"
 ALG_auto.3.desc: "Le constructeur italien Fiat nous a approchés avec une proposition d'établir des usines en Algérie. Ils voient une opportunité sur notre marché après les restrictions d'import. Cela pourrait revitaliser notre secteur automobile."
 ALG_auto.3.a: "Acceptez la proposition de Fiat"
 ALG_auto.3.b: "Négocier de meilleures conditions"
 ALG_auto.3.c: "Rejeter la proposition"
 ALG_auto.4.t: "Reprise du secteur automobile"
 ALG_auto.4.desc: "Après notre réponse mesurée au scandale, le secteur automobile commence à se stabiliser. Les constructeurs nationaux montrent de l'intérêt à s'étendre, tandis que les compagnies étrangères continuent de nous approcher."
 ALG_auto.4.a: "Soutenir les fabricants nationaux"
 ALG_auto.4.b: "Examiner les offres étrangères"
 ALG_auto.5.t: "Fiat accepte nos conditions"
 ALG_auto.5.desc: "Nos négociateurs ont réussi. Fiat a accepté des conditions plus favorables, y compris un investissement supplémentaire et un transfert de technologies. C'est une victoire significative pour l'industrie algérienne."
 ALG_auto.5.a: "Excellente nouvelle !"
 ALG_auto.6.t: "Fiat refuse la renégociation"
 ALG_auto.6.desc: "Fiat a rejeté nos demandes de meilleures conditions. Ils insistent que leur offre originale est plus que juste. Nous devons décider d'accepter leurs conditions ou de partir entièrement."
 ALG_auto.6.a: "Accepter les conditions originales"
 ALG_auto.6.b: "Abandonner l'accord"
 ALG_corruption_auto_scandal: "Scandale de corruption automobile"
 ALG_corruption_auto_scandal_desc: "L'exposition d'une corruption généralisée dans notre industrie automobile a ébranlé la confiance publique. Les partenaires étrangers s'éloignent tandis que les enquêtes continuent. Notre production industrielle et notre capital politique ont subi un coup significatif."
 ALG_corruption_auto_scandal_coverup: "Scandale automobile supprimé"
 ALG_corruption_auto_scandal_coverup_desc: "Nous avons tenté d'étouffer la nouvelle du scandale automobile. Si les dégâts immédiats sont contenus, les services de renseignement étrangers connaissent notre tromperie et l'opposition intérieure a des munitions contre nous. La vérité pourrait encore éclater."
 ALG_import_ban_penalty: "Embargo sur les importations automobiles"
 ALG_import_ban_penalty_desc: "Une interdiction totale des importations automobiles a été édictée après le scandale de corruption. Si cela envoie un message fort contre l'exploitation étrangère, cela a gravement perturbé les chaînes d'approvisionnement et la production industrielle. Les consommateurs font face à des pénuries et à des prix plus élevés."
 ALG_import_restrictions_light: "Restrictions sur les importations automobiles"
 ALG_import_restrictions_light_desc: "Des restrictions partielles sur les importations automobiles ont été mises en œuvre. Cette approche mesurée maintient certaines relations commerciales tout en répondant à la colère publique. L'impact économique est gérable mais encore perceptible."
 ALG_4g_rollout_tt: "§GAlgérie lance un réseau mobile 4G national :§!\n- Internet mobile haut débit\n- Connectivité des entreprises améliorée\n- Expansion des services numériques"
 ALG_4g_coverage_basic: "Couverture 4G - Basique"
 ALG_4g_coverage_basic_desc: "Notre réseau 4G est opérationnel mais la couverture se limite aux grands centres urbains. Un investissement d'infrastructure continu est nécessaire."
 ALG_4g_coverage_moderate: "Couverture 4G - Modérée"
 ALG_4g_coverage_moderate_desc: "La couverture 4G s'étend désormais à la plupart des villes et bourgs. Entreprises et citoyens bénéficient d'une meilleure connectivité."
 ALG_4g_coverage_good: "Couverture 4G - Bonne"
 ALG_4g_coverage_good_desc: "Forte couverture 4G sur la majeure partie de l'Algérie. L'économie numérique prospère et la productivité monte."
 ALG_4g_coverage_excellent: "Couverture 4G – Excellente"
 ALG_4g_coverage_excellent_desc: "Couverture 4G nationale atteinte ! L'Algérie est désormais un leader régional de la connectivité mobile. Les fondations sont posées pour le 5G."
 algerian_event.51.t: "Un vaisseau algérien atterrit avec succès sur la Lune !"
 algerian_event.51.desc: "L'Agence spatiale algérienne (ASAL) a atteint une étape historique ! Notre atterrisseur lunaire a réussi un atterrissage en douceur à la surface de la Lune, faisant de l'Algérie seulement la cinquième nation de l'histoire à accomplir cet exploit.\n\nLa descente a été retransmise en direct à travers la nation, des millions d'Algériens regardant avec émerveillement notre vaisseau se poser près du pôle sud lunaire. Les scientifiques du centre de contrôle à Alger ont explosé de joie lorsque la télémétrie a confirmé l'atterrissage réussi.\n\nCet exploit place l'Algérie aux côtés de l'URSS, des États-Unis, de la Chine et de l'Inde dans le club d'élite des nations capables d'atterrissages lunaires en douceur. Il représente le aboutissement de décennies d'investissement dans notre programme spatial et signale l'émergence de l'Algérie comme puissance spatiale majeure.\n\nLe monde regarde avec admiration le drapeau vert et blanc planté sur la Lune."
 algerian_event.51.a: "Un bond de géant pour l'Algérie !"
 ALG_missile_leverage: "Levier de missiles"
 ALG_missile_leverage_desc: "Notre relation avec la Chine offre l'opportunité d'acquérir une technologie de missiles avancée. En tirant parti de nos liens diplomatiques et de notre position stratégique, nous pouvons négocier le transfert de missiles de croisière terrestres et de plates-formes de lancement mobiles. Cela renforcera nettement les capacités de dissuasion de l'Algérie."
 ALG_build_nuclear_reactor_tt: "§GConstruire un réacteur nucléaire :§!\n- Établir une capacité nucléaire civile\n- Réduire la dépendance aux fossiles\n- Former scientifiques et ingénieurs nucléaires\n- Fondation pour la recherche nucléaire avancée"
 ALG_election_pending: "Élections nationales en attente"
 ALG_opposition_reforms_1: "Réformes de l'opposition : liberté des médias"
 ALG_opposition_reforms_1_desc: "Le gouvernement d'opposition a commencé son programme de réforme en garantissant la liberté des médias. Une presse libre tient désormais le gouvernement responsable et informe le public."
 ALG_opposition_reforms_2: "Réformes de l'opposition : système judiciaire"
 ALG_opposition_reforms_2_desc: "S'appuyant sur les réformes médiatiques, le gouvernement d'opposition a réformé la justice. Des tribunaux indépendants assurent désormais la justice pour tous les Algériens et combattent la corruption."
 ALG_opposition_reforms_3: "Réformes de l'opposition : éducation"
 ALG_opposition_reforms_3_desc: "Le programme de réforme de l'opposition continue avec d'importants investissements dans l'éducation. Un système modernisé prépare la jeunesse algérienne aux défis à venir."
 ALG_opposition_reforms_4: "Une ère nouvelle pour l'Algérie"
 ALG_opposition_reforms_4_desc: "Le programme de réforme d'ensemble de l'opposition est achevé. L'Algérie a été transformée en une nation moderne, démocratique et prospère. Médias libres, tribunaux indépendants, éducation de qualité et opportunités économiques définissent cette nouvelle ère."
 ALG_fis_movement: "Mouvement islamique du salut"
 ALG_fis_movement_desc: "Le FIS a galvanisé le peuple algérien par son message de démocratie islamique, de justice sociale et de lutte anticorruption. Les mosquées servent de centres communautaires, fournissant des services sociaux que le gouvernement a négligés. Le soutien populaire croît chaque jour."
 ALG_fln.1.t: "Un scandale de corruption ébranle l'Algérie"
 ALG_fln.1.desc: "Des journalistes d'investigation ont découvert un réseau de corruption s'étendant à travers l'establishment politique algérien. Des relevés bancaires révèlent des millions détournés des fonds publics vers des comptes privés. Plusieurs partis apparaissent impliqués, y compris des membres de notre propre FLN.\n\nLe scandale a éclaté au grand jour et nous ne pouvons l'ignorer. Les preuves sont accablantes, mais notre réponse pourrait stabiliser ou déstabiliser tout le système politique. Nous devons choisir notre course avec soin."
 ALG_fln.1.a: "Enterrer l'affaire"
 ALG_cover_up_corruption_tt: "§RÉtouffer le scandale :§!\n• La corruption augmente nettement\n• Légère perte de pouvoir politique\n• Réputation du FLN légèrement endommagée\n• Stabilité préservée pour l'instant\n\n§7« Ce que le peuple ignore ne peut lui nuire. »§!"
 ALG_fln.1.b: "Blâmer les partis d'opposition"
 ALG_blame_others_tt: "§YBlâmer les partis d'opposition :§!\n• La corruption augmente\n• Les partis d'opposition lourdement endommagés\n• Le FLN gagne un peu de soutien\n• Un peu de stabilité perdue\n\n§7« Ce sont eux les vrais criminels ! »§!"
 ALG_fln.1.c: "Laisser la vérité éclater"
 ALG_expose_all_tt: "§GExposer toute la corruption :§!\n• Tous les partis endommagés (y compris le FLN)\n• Perte significative de stabilité\n• Lourd coût en pouvoir politique\n• MAIS la corruption diminue\n• Élan anticorruption (bonus d'1 an)\n\n§7« Le peuple mérite la vérité. »§!"
 ALG_fln.1.e: "Lancer une campagne anticorruption complète"
 ALG_anti_corruption_campaign_tt: "§GLancer une campagne anticorruption :§!\n• Tous les partis endommagés (y compris le FLN)\n• Lourd coût pour le Trésor (§R-15§!)\n• Coût majeur en pouvoir politique (§R-100§!)\n• MAIS la corruption diminue nettement\n• §GRéformes anticorruption permanentes§!\n• Gain de stabilité de long terme\n\n§7« Nous extirperons ce cancer entièrement ! »§!"
 ALG_anti_corruption_momentum: "Dynamique anticorruption"
 ALG_anti_corruption_momentum_desc: "L'exposition de la corruption a déclenché une demande publique de réforme. Douloureux, ce moment de transparence a créé un élan pour un changement positif."
 ALG_anti_corruption_reforms: "Réformes anticorruption"
 ALG_anti_corruption_reforms_desc: "Des mesures anticorruption d'ensemble ont été mises en œuvre dans tout le gouvernement. Marchés transparents, auditeurs indépendants et protection des lanceurs d'alerte réduisent la concussion et restaurent la confiance publique."
 ALG_fln.2.t: "Scandale de corruption à Sonatrach"
 ALG_fln.2.desc: "Un scandale de corruption massif a éclaté à Sonatrach, la compagnie pétrolière d'État algérienne. Les enquêtes révèlent des milliards détournés par de faux contrats et des comptes offshore. Cadres dirigeants et partenaires étrangers sont impliqués.\n\nLe public exige des réponses. Comment répondre ?"
 ALG_fln.2.a: "Couvrez-le"
 ALG_fln.2.b: "Enquêter sur la corruption"
 ALG_fln.2.c: "Blâmer l'opposition"
 ALG_fln.3.t: "Le Hirak s'éveille"
 ALG_fln.3.desc: "Des millions d'Algériens sont descendus dans la rue en un mouvement de masse exigeant le changement. Les protestations du Hirak ont uni les gens par-delà toutes les divisions — jeunes et vieux, laïcs et religieux.\n\n« Yetnahaw Ga3 ! » (Qu'ils s'en aillent tous !) résonne dans chaque ville.\n\nL'ancien ordre tremble. Le peuple a trouvé sa voix."
 ALG_fln.3.a: "Le peuple a parlé."
 ALG_grievance_increase_5_tt: "§YGrief du peuple :§! +5"
 ALG_cover_up_scandal: "Dissimulation du scandale"
 ALG_cover_up_scandal_desc: "Le scandale de corruption de Sonatrach a été enterré, mais les rumeurs persistent. Les services de renseignement étrangers connaissent l'étouffement, et la vérité menace de ressurgir à tout moment."
 ALG_anti_corruption_probe: "Enquête anticorruption"
 ALG_anti_corruption_probe_desc: "Une enquête approfondie sur la corruption à Sonatrach est en cours. Si elle perturbe les affaires courantes, l'enquête restaure la confiance publique et extirpe les fonctionnaires corrompus."
 ALG_shift_blame: "Le blâme est rejeté sur l'opposition"
 ALG_shift_blame_desc: "Le gouvernement a réussi à rediriger la colère publique du scandale Sonatrach vers les partis d'opposition. Propagande efficace, ce détournement ne traite en rien la corruption sous-jacente."
 ALG_mass_protests: "Manifestations de masse"
 ALG_mass_protests_desc: "Le mouvement Hirak a amené des millions dans les rues à travers l'Algérie. L'activité économique est perturbée tandis que le peuple exige un changement fondamental. L'ancien ordre vacille."
 ALG_FLN_chosen: "Voie FLN choisie"
 ALG_fln_opp_path: "Chemin de l’opposition FLN"
 ALG_domestic_development_focus: "Priorité au développement intérieur"
 ALG_domestic_development_focus_desc: "L'Algérie a choisi d'investir dans son propre développement plutôt que dans l'expansion étrangère. Projets d'infrastructure, développement industriel et programmes sociaux transforment la nation en un État moderne et prospère."
 ALG_middle_east_expansion: "Expansion au Moyen-Orient"
 ALG_middle_east_expansion_desc: "Nos armées marchent vers le Moyen-Orient. Les troupes sont bien approvisionnées et motivées par des visions de gloire et de conquête."
 ALG_de_arabisation_effect_TT: "§YPolitique de désarabisation :§!\n\n§G Renouveau de la langue berbère§!\n Le tamazight devient langue co-officielle\n\n§G Reconnaissance culturelle§!\n L'identité amazighe célébrée nationalement\n\n§G Réforme de l'éducation§!\n L'histoire berbère enseignée dans les écoles\n\n§RConséquences :§!\n  -Soutien nationaliste arabe\n  -Relations avec la Ligue arabe\n  +Stabilité régionale kabyle"
 ALG_civil_reforms_1: "Protections des droits civiques"
 ALG_civil_reforms_1_desc: "L'Algérie a établi des protections de base des droits civils. Les citoyens jouissent de plus grandes libertés et le fondement de nouvelles réformes est en place."
 ALG_civil_reforms_2: "Droits civiques et égalité des sexes"
 ALG_civil_reforms_2_desc: "S'appuyant sur les réformes des droits civils, l'Algérie a avancé l'égalité des genres. Les femmes entrent davantage dans la main-d'œuvre, stimulant productivité et croissance."
 ALG_civil_reforms_3a: "Réformes civiles : presse libre"
 ALG_civil_reforms_3a_desc: "Le programme de réforme algérien inclut désormais la liberté de la presse. Des médias indépendants tiennent le gouvernement responsable tandis que droits civils et égalité des genres continuent de transformer la société."
 ALG_civil_reforms_3b: "Réformes civiles : indépendance judiciaire"
 ALG_civil_reforms_3b_desc: "Le programme de réforme algérien inclut désormais une justice indépendante. Des tribunaux équitables combattent la corruption tandis que droits civils et égalité des genres continuent de transformer la société."
 ALG_civil_reforms_4: "Réformes complètes de la société civile"
 ALG_civil_reforms_4_desc: "L'Algérie a achevé des réformes d'ensemble de la société civile. Droits civils, égalité des genres, liberté de la presse, indépendance judiciaire et organisations de la société civile autonomisées ont transformé l'Algérie en une démocratie moderne."
 ALG_gov_reforms_1: "Initiative de gouvernement numérique"
 ALG_gov_reforms_1_desc: "L'Algérie a commencé à numériser les services publics. Les plateformes en ligne améliorent la délivrance des services et réduisent l'inefficacité bureaucratique."
 ALG_gov_reforms_2: "Réformes des services publics"
 ALG_gov_reforms_2_desc: "S'appuyant sur les fondations numériques, l'Algérie a réformé les services publics. Les citoyens jouissent de services gouvernementaux plus rapides et plus efficaces."
 ALG_gov_reforms_3a: "Réformes anticorruption"
 ALG_gov_reforms_3a_desc: "La campagne anticorruption algérienne a assaini les institutions. Transparence et responsabilité ont été restaurées."
 ALG_gov_reforms_3b: "Système de gouvernance électronique"
 ALG_gov_reforms_3b_desc: "Le portail d'e-gouvernance algérien offre aux citoyens un accès fluide aux services publics en ligne. L'efficacité bureaucratique s'est considérablement améliorée."
 ALG_gov_reforms_4: "État administratif moderne"
 ALG_gov_reforms_4_desc: "L'Algérie a atteint un gouvernement pleinement modernisé, efficace et transparent. Services numériques, mesures anticorruption et bureaucratie rationalisée définissent la nouvelle administration."
 ALG_african_union_engagement_full_tt: "§GS'engager auprès de l'Union africaine :§!\n\n§YEffets sur tous les États membres de l'UA :§!\n• §G+25§! d'opinion envers l'Algérie\n• §G+2 %§! d'influence algérienne\n\nL'Algérie renforce sa position de voix de premier plan dans les affaires africaines."
 ALG_mend_ties_with_rabat: "Rétablir les liens avec Rabat"
 ALG_mend_ties_with_rabat_desc: "La frontière algéro-marocaine est fermée depuis 1994. Le conflit du Sahara occidental, la guerre des Sables de 1963 et les alignements de la guerre froide ont créé de profondes plaies entre nos nations.\n\nPourtant nous partageons le même héritage amazigh et arabe, la même lutte contre le colonialisme, et les mêmes espoirs pour notre peuple. Peut-être est-il temps de laisser le passé derrière nous et de bâtir une nouvelle relation avec le Royaume du Maroc."
 ALG_our_east_brothers: "Nos frères de l'Est"
 ALG_our_east_brothers_desc: "L'Algérie et la Tunisie ont combattu côte à côte contre le colonialisme français. Le sol tunisien a abrité réfugiés algériens et combattants du FLN pendant notre guerre d'indépendance.\n\nCette fraternité doit être renforcée. Ensemble, Algérie et Tunisie peuvent former le cœur d'un Maghreb uni et mener l'Afrique du Nord vers un avenir prospère."
 ALG_black_spring: "Le Printemps noir"
 ALG_black_spring_desc: "Le 18 avril 2001, Massinissa Guermah, un jeune étudiant kabyle, a été abattu dans une brigade de gendarmerie à Beni Douala. Sa mort a déclenché les plus grandes protestations en Kabylie depuis l'indépendance, avec plus de 100 tués par les forces de sécurité. Le Printemps noir a commencé."
 ALG_black_spring_tt: "§HLe Printemps noir éclate§!\nLa mort de Massinissa Guermah déclenche des protestations massives à travers la Kabylie. Plus de 100 protestataires tués par la gendarmerie.\n\n§YRevendications kabyles :§!\n- Justice pour les morts\n- Retrait de la gendarmerie\n- Reconnaissance du tamazight\n- Fin de la « hogra » (mépris)"
 ALG_negotiate_with_arrouch: "Négocier avec les Arouch"
 ALG_negotiate_with_arrouch_desc: "Les Arouch (conseils villageois) se sont organisés en un mouvement coordonné représentant les revendications kabyles. Plutôt que la confrontation, nous engagerons le dialogue avec ces structures traditionnelles."
 ALG_negotiate_arrouch_tt: "§HLe mouvement des Arouch§!\nLes assemblées villageoises kabyles traditionnelles se sont unies pour présenter des revendications. La négociation peut apporter la paix.\n\n§YRevendications clés des Arouch :§!\n- Reconnaissance de la plate-forme d'El-Kseur\n- Droits linguistiques du tamazight\n- Développement économique\n- Fin de la présence militaire"
 ALG_recognize_tamazight_2002: "Tamazight : langue nationale"
 ALG_recognize_tamazight_2002_desc: "Le 8 avril 2002, après d'intenses négociations, le tamazight sera reconnu comme langue nationale de l'Algérie — une concession historique à l'identité berbère."
 ALG_tamazight_national_tt: "§HLe tamazight devient langue nationale§!\nUn moment historique : le tamazight rejoint l'arabe comme langue nationale de l'Algérie.\n\n§YPortée :§!\n- Première reconnaissance de l'identité berbère\n- Amendement constitutionnel\n- Les écoles pourront enseigner le tamazight\n- §GVictoire kabyle majeure§!"
 ALG_address_hogra: "Traiter la hogra"
 ALG_address_hogra_desc: "La hogra — le mépris et l'humiliation ressentis par les Kabyles de la part de l'État — doit être traitée. Investissement, emplois et respect remplaceront négligence et abus."
 ALG_address_hogra_tt: "§HMettre fin à la hogra§!\nLa « hogra » — le mépris systématique envers les Kabyles — sera traitée par :\n\n- Investissement d'infrastructure en Kabylie\n- Programmes de création d'emplois\n- Fin des pratiques discriminatoires\n- Respect de la dignité kabyle"
 ALG_amazigh_cultural_revival: "Renouveau culturel amazigh"
 ALG_amazigh_cultural_revival_desc: "L'investissement dans les institutions culturelles berbères, musées et programmes éducatifs préservera et célébrera l'héritage amazigh antérieur à l'arrivée arabe."
 ALG_amazigh_revival_tt: "§HRenaissance culturelle amazighe§!\n- Académie amazighe établie\n- Musées berbères financés\n- Festivals culturels soutenus\n- Écriture tifinagh promue"
 ALG_yennayer_national_holiday: "Yennayer, fête nationale"
 ALG_yennayer_national_holiday_desc: "En décembre 2017, le président Bouteflika a déclaré Yennayer — le Nouvel An amazigh — jour férié national. Le 12 janvier sera désormais célébré à travers l'Algérie."
 ALG_yennayer_tt: "§HYennayer devient fête nationale§!\nLe Nouvel An berbère (12 janvier) est désormais un jour férié officiel algérien.\n\n§YReconnaissance historique :§!\n- Héritage préislamique célébré\n- Unité nationale renforcée\n- §GSatisfaction kabyle accrue§!"
 ALG_tamazight_official_2016: "Tamazight : langue officielle"
 ALG_tamazight_official_2016_desc: "L'amendement constitutionnel de 2016 élève le tamazight du statut de langue « nationale » à « officielle », le plaçant sur un pied d'égalité avec l'arabe."
 ALG_tamazight_official_tt: "§HLe tamazight devient langue officielle§!\n§WAmendement constitutionnel de 2016 :§!\n- Le tamazight égal à l'arabe\n- Tous les documents gouvernementaux bilingues\n- Langue berbère dans toutes les écoles\n- §GVictoire constitutionnelle majeure§!"
 ALG_berber_integration_complete: "Unis dans la diversité"
 ALG_berber_integration_complete_desc: "Par le dialogue, la reconnaissance et l'investissement, l'Algérie a résolu la question kabyle. Arabes et Amazighs algériens se tiennent unis."
 ALG_integration_complete_tt: "§HQuestion kabyle résolue§!\nL'Algérie a intégré avec succès sa population berbère par :\n- Reconnaissance linguistique\n- Investissement culturel\n- Développement économique\n- Respect et dialogue\n\n§GUnité nationale atteinte !§!"
 ALG_crush_the_uprising: "Écraser le soulèvement"
 ALG_crush_the_uprising_desc: "Le Printemps noir menace l'unité nationale. La gendarmerie rétablira l'ordre, et les éléments séparatistes seront neutralisés."
 ALG_crush_uprising_tt: "§HVoie de la répression§!\nUtiliser la force pour mettre fin aux protestations et maintenir l'intégrité territoriale de l'Algérie.\n\n§YAvantages :§!\n- Conserver tout le territoire\n- Aucune concession aux séparatistes\n- Contrôle militaire\n\n§RCoûts :§!\n- Critique internationale\n- Ressentiment kabyle profond\n- Résistance continue"
 ALG_gendarmerie_reinforcement: "Renfort de Gendarmerie"
 ALG_gendarmerie_reinforcement_desc: "Des unités supplémentaires de gendarmerie seront déployées en Kabylie pour maintenir l'ordre et prévenir de futurs troubles."
 ALG_gendarmerie_tt: "§HDéployer les forces de sécurité§!\n- Présence de la gendarmerie accrue\n- Manifestations surveillées\n- Militants clés détenus\n- Ordre maintenu par la force"
 ALG_arabization_policy: "Politique d'arabisation"
 ALG_arabization_policy_desc: "L'arabe est la langue de l'Algérie. Intensifier les programmes d'arabisation en Kabylie pour contrer l'idéologie séparatiste berbériste."
 ALG_arabization_1_tt: "§HIntensifier l'arabisation§!\n- Éducation uniquement en arabe imposée\n- Tamazight réprimé\n- Identité islamique promue\n- Idéologie berbériste contrée\n\n§RLes Kabyles seront profondément resentissants§!"
 ALG_ban_mak: "Interdire le MAK"
 ALG_ban_mak_desc: "En mai 2021, le Mouvement pour l'autodétermination de la Kabylie (MAK) dirigé par Ferhat Mehenni sera désigné organisation terroriste et interdit."
 ALG_ban_mak_tt: "§HLe MAK désigné organisation terroriste§!\nLe Mouvement pour l'autodétermination de la Kabylie est interdit :\n- Ferhat Mehenni étiqueté terroriste\n- Partisans du MAK arrêtés\n- Activité séparatiste criminalisée\n\n§RCritique internationale attendue§!"
 ALG_accuse_foreign_interference: "Accuser la main de l'étranger"
 ALG_accuse_foreign_interference_desc: "Le mouvement séparatiste MAK n'est pas organique — il est financé et soutenu par des puissances étrangères cherchant à déstabiliser l'Algérie. Le Maroc et d'autres doivent être exposés."
 ALG_foreign_interference_tt: "§HBlâmer les puissances étrangères§!\nLe MAK est accusé d'être un relais étranger :\n- Le Maroc accusé de financer le MAK\n- Complots externes contre l'Algérie\n- Unité nationale contre les ennemis\n\n§RLes tensions diplomatiques augmenteront§!"
 ALG_mak_israel_connection: "Connexion MAK-Israël"
 ALG_mak_israel_connection_desc: "La rencontre de Ferhat Mehenni avec des officiels israéliens prouve que le MAK est un projet sioniste pour diviser le monde arabe. Le lien doit être exposé."
 ALG_mak_israel_tt: "§HLien MAK-Israël exposé§!\n- Le MAK étiqueté projet sioniste\n- Israël accusé de déstabilisation\n- Soutien de la Ligue arabe gagné\n- Sentiment anti-israélien mobilisé\n\n§YLe soutien intérieur §Gaugmente§!§!\n§RLes relations avec Israël seront détruites§!"
 ALG_kabylie_pacified: "Kabylie pacifiée"
 ALG_kabylie_pacified_desc: "Par des opérations de sécurité et la répression politique, la Kabylie a été mise sous contrôle. La menace séparatiste est contenue."
 ALG_kabylie_pacified_tt: "§HKabylie sous contrôle§!\n- MAK écrasé\n- Séparatisme criminalisé\n- Forces de sécurité aux commandes\n- Unité nationale imposée\n\n§YMais le ressentiment couve.§!"
 ALG_el_kseur_platform: "Accepter la plate-forme d'El-Kseur"
 ALG_el_kseur_platform_desc: "La plate-forme d'El-Kseur, rédigée par les Arouch le 11 juin 2001, contient 15 revendications de justice et de droits. Nous l'accepterons comme base de négociation."
 ALG_el_kseur_tt: "§HAccepter la plate-forme d'El-Kseur§!\nLes 15 revendications comprennent :\n- Justice pour les victimes du Printemps noir\n- Retrait de la gendarmerie\n- Statut officiel du tamazight\n- Fin de la hogra\n- Développement économique\n- Réformes démocratiques\n\n§RConcessions radicales exigées§!"
 ALG_withdraw_gendarmerie: "Retirer la gendarmerie"
 ALG_withdraw_gendarmerie_desc: "Une revendication clé d'El-Kseur — la gendarmerie haïe sera retirée de Kabylie et remplacée par une police locale."
 ALG_withdraw_gendarmerie_tt: "§HRetrait de la gendarmerie§!\n- Les forces paramilitaires quittent la Kabylie\n- La police locale prend le relais\n- Présence militaire réduite\n- Revendication kabyle majeure satisfaite\n\n§RL'armée sera mécontente§!"
 ALG_trial_responsible_officers: "Procès des officiers responsables"
 ALG_trial_responsible_officers_desc: "Les officiers responsables des morts du Printemps noir devront rendre des comptes. Cette étape sans précédent reconnaît les crimes de l'État contre les Kabyles."
 ALG_trial_officers_tt: "§HPoursuivre les officiers responsables§!\n- Les officiers passent en jugement pour les tueries\n- Les familles des victimes indemnisées\n- L'État reconnaît les crimes\n- Responsabilité historique\n\n§RL'armée sera furieuse§!\n§GL'approbation internationale augmente§!"
 ALG_secular_berber_identity: "Identité berbère laïque"
 ALG_secular_berber_identity_desc: "La Kabylie a historiquement été plus laïque que le reste de l'Algérie. Reconnaître une identité berbère laïque remet en cause la définition arabo-islamique de la nation algérienne."
 ALG_secular_berber_tt: "§HReconnaître l'identité amazighe laïque§!\n- Héritage préislamique célébré\n- Valeurs laïques protégées\n- Liberté religieuse garantie\n- Conteste le récit islamiste\n\n§RLes islamistes s'y opposeront§!"
 ALG_mak_dialogue: "Dialogue avec le MAK"
 ALG_mak_dialogue_desc: "Ouvrir le dialogue avec le mouvement séparatiste MAK de Ferhat Mehenni. Cela risque de légitimer le séparatisme mais peut être le seul chemin vers la paix."
 ALG_mak_dialogue_tt: "§HOuvrir le dialogue avec le MAK§!\nNégocier avec les séparatistes :\n- Ferhat Mehenni engagé\n- Autodétermination discutée\n- Autonomie explorée\n- Indépendance sur la table\n\n§RExtrêmement controversé§!\n§RRisque de légitimer le séparatisme§!"
 ALG_reject_separatism: "Rejeter le séparatisme"
 ALG_reject_separatism_desc: "Tout en respectant les droits berbères, l'intégrité territoriale de l'Algérie n'est pas négociable. L'unité dans la diversité — non la division — est la réponse."
 ALG_reject_separatism_tt: "§HL'unité dans la diversité§!\n- Séparatisme rejeté\n- Droits berbères garantis\n- Intégrité territoriale maintenue\n- Une Algérie diverse mais unie"
 ALG_kabyle_autonomy_statute: "Statut d'autonomie kabyle"
 ALG_kabyle_autonomy_statute_desc: "Un statut d'autonomie formel pour la Kabylie : autogestion des affaires locales tout en restant partie de l'Algérie. Un compromis historique."
 ALG_autonomy_statute_tt: "§HLa Kabylie obtient l'autonomie§!\n- Parlement régional établi\n- Tamazight reconnu comme langue officielle\n- Pouvoirs fiscaux locaux\n- Autonomie culturelle accordée\n\n§YLa Kabylie reste partie intégrante de l'Algérie§!"
 ALG_federal_algeria: "Algérie fédérale"
 ALG_federal_algeria_desc: "L'Algérie se transforme en république fédérale, la Kabylie étant la première région autonome. D'autres régions pourront suivre ce modèle."
 ALG_federal_algeria_tt: "§HL'Algérie devient fédérale§!\n- Constitution fédérale adoptée\n- Autonomie régionale accordée\n- La Kabylie comme modèle\n- Pouvoir décentralisé\n- L'unité par le fédéralisme"
 ALG_united_secular_algeria: "Algérie Laïque Unie"
 ALG_united_secular_algeria_desc: "Une Algérie unie et laïque qui respecte toutes les identités — arabe et amazighe, musulmane et laïque. La diversité est notre force."
 ALG_united_secular_tt: "§HAlgérie unie et laïque§!\n- État laïc établi\n- Toutes les identités respectées\n- Pas de séparatisme\n- Pas d'islamisme\n- Démocratie moderne"
 ALG_release_kby_autonomous_tt: "§YLibérer la Kabylie comme Région Autonome§!"
 ALG_black_spring_spirit: "Troubles du Printemps Noir"
 ALG_black_spring_spirit_desc: "L'assassinat de Massinissa Guermah a déclenché les plus grandes protestations depuis l'indépendance. La Kabylie brûle de rage contre l'État."
 ALG_arrouch_negotiations: "Négociations d'Arrouch"
 ALG_arrouch_negotiations_desc: "Le gouvernement négocie avec le mouvement des Arouch. Les conseils villageois traditionnels parlent désormais pour la Kabylie."
 ALG_tamazight_national_language: "Tamazight, langue nationale"
 ALG_tamazight_national_language_desc: "Le tamazight a été reconnu comme langue nationale de l'Algérie — un pas majeur vers la reconnaissance berbère."
 ALG_tamazight_official_language: "Langue officielle tamazight"
 ALG_tamazight_official_language_desc: "La constitution de 2016 a fait du tamazight une langue officielle, égale à l'arabe. Un acquis historique pour les droits berbères."
 ALG_addressing_kabyle_grievances: "Répondre aux doléances kabyles"
 ALG_addressing_kabyle_grievances_desc: "Le gouvernement investit en Kabylie et traite des années de négligence et de « hogra » (mépris)."
 ALG_amazigh_cultural_institutions: "Institutions culturelles amazighes"
 ALG_amazigh_cultural_institutions_desc: "L'investissement dans les institutions culturelles berbères préserve et célèbre l'héritage amazigh de l'Algérie."
 ALG_united_algeria: "Algérie unie"
 ALG_united_algeria_desc: "Par le dialogue et le respect, l'Algérie a uni ses populations arabe et amazighe. La question kabyle est résolue."
 ALG_kabyle_crackdown: "Répression kabyle"
 ALG_kabyle_crackdown_desc: "Les forces de sécurité répriment les manifestations kabyles. L'ordre est rétabli par la force."
 ALG_gendarmerie_deployed: "Gendarmerie déployée"
 ALG_gendarmerie_deployed_desc: "Des unités de gendarmerie sont stationnées à travers la Kabylie, maintenant l'ordre et surveillant la dissidence."
 ALG_forced_arabization: "Arabisation forcée"
 ALG_forced_arabization_desc: "Les politiques d'arabisation s'intensifient en Kabylie. L'identité berbère est étouffée au profit du nationalisme arabo-islamique."
 ALG_mak_banned: "MAK interdit"
 ALG_mak_banned_desc: "Le Mouvement pour l'autodétermination de la Kabylie a été désigné organisation terroriste. Le séparatisme est désormais criminalisé."
 ALG_foreign_hands_narrative: "Thèse de la main de l'étranger"
 ALG_foreign_hands_narrative_desc: "Le gouvernement blâme des puissances étrangères — surtout le Maroc et Israël — pour le séparatisme kabyle. Les ennemis extérieurs unissent la nation."
 ALG_mak_terrorist_designation: "Désignation terroriste du MAK"
 ALG_mak_terrorist_designation_desc: "Le MAK et Ferhat Mehenni sont désignés terroristes liés à Israël. La menace séparatiste est présentée comme un complot sioniste."
 ALG_kabylie_under_control: "La Kabylie sous contrôle"
 ALG_kabylie_under_control_desc: "Par la force et la répression politique, la Kabylie est sous contrôle du gouvernement. Mais le ressentiment couve sous la surface."
 ALG_el_kseur_negotiations: "Négociations d'El-Kseur"
 ALG_el_kseur_negotiations_desc: "Le gouvernement a accepté la plate-forme d'El-Kseur comme base de négociations avec la Kabylie."
 ALG_secular_amazigh_movement: "Mouvement laïc amazigh"
 ALG_secular_amazigh_movement_desc: "Une identité berbère laïque est reconnue, remettant en cause la définition arabo-islamique de la nation algérienne."
 ALG_mak_negotiations: "Négociations MAK"
 ALG_mak_negotiations_desc: "Le gouvernement est en dialogue sans précédent avec le mouvement séparatiste MAK. L'avenir de la Kabylie est en jeu."
 ALG_unity_within_diversity: "L'unité dans la diversité"
 ALG_unity_within_diversity_desc: "L'Algérie embrasse sa diversité — arabe et amazighe, musulmane et laïque — tout en maintenant l'unité nationale. Le séparatisme est rejeté."
 ALG_federal_republic: "République fédérale"
 ALG_federal_republic_desc: "L'Algérie est devenue une république fédérale, la Kabylie étant la première région autonome. Le pouvoir est décentralisé tandis que l'unité est maintenue."
 ALG_secular_united_nation: "Nations Unies laïques"
 ALG_secular_united_nation_desc: "L'Algérie a émergé comme nation unie et laïque qui respecte toutes les identités et rejette à la fois le séparatisme et l'extrémisme religieux."
 KBY_autonomous_kabylie: "Kabylie autonome"
 KBY_autonomous_kabylie_desc: "La Kabylie a obtenu l'autonomie au sein de l'Algérie. Autogouvernement des affaires locales tout en restant partie de la nation."
 KBY_federal_partner: "Partenaire fédéral"
 KBY_federal_partner_desc: "En tant que partenaire fédéral de l'Algérie, la Kabylie jouit d'une pleine autonomie et d'un partenariat égal dans la fédération algérienne."
 ALG_kabyle_autonomy: "Chemin de l’autonomie kabyle"
 ALG_kabyle_suppressed: "La voie de la répression kabyle"
 ALG_kabyle_independence: "Voie de l'indépendance kabyle"
 ALG_black_spring_triggered: "Printemps noir déclenché"
 ALG_kabyle_issue_resolved: "Problème kabyle résolu"
 ALG_kabyle_suppressed_complete: "Suppression kabyle terminée"
 ALG_became_federal: "L'Algérie est devenue fédérale"
 ALG_secular_path_complete: "Chemin laïc terminé"
 human_rights_violation: "Violations des droits de l'homme"
 human_rights_progress: "Progrès en matière de droits de l'homme"
 accused_of_interference: "Accusé d'ingérence"
 accused_of_terrorism_support: "Accusé de soutenir le terrorisme"
 anti_israel_stance: "Position anti-israélienne"
 ALG_bribe_malian_generals: "Corrompre des généraux maliens"
 ALG_bribe_malian_generals_desc: "La junte militaire malienne peut être influencée par une distribution soigneuse de fonds. En soudoyant des généraux clés, l'Algérie peut gagner un levier sur les décisions de Bamako et sécuriser nos intérêts au Sahel."
 ALG_isolate_mali_regime: "Isoler le régime du Mali"
 ALG_isolate_mali_regime_desc: "Le régime militaire de Bamako a déstabilisé la région et menacé les populations touarègues. L'Algérie s'emploiera à isoler la junte internationalement, se positionnant comme médiatrice légitime de la crise sahélienne."
 ALG_isolate_mali_tt: "§HIsoler le régime malien§!\nUtiliser la pression diplomatique et les canaux de l'Union africaine pour condamner la junte militaire.\n\n§YAvantages :§!\n- Leadership régional pour l'Algérie\n- Soutien touareg accru\n- Mali affaibli\n- Influence à l'UA gagnée\n\n§WRésultat :§!\nL'Algérie devient le médiateur clé des affaires sahéliennes"
 ALG_au_condemns_mali_tt: "§YL'Union africaine condamne le régime malien§!\nTous les membres de l'UA réduisent leur opinion du Mali"
 ALG_malian_general_network: "Réseau Général Malien"
 ALG_malian_general_network_desc: "Un réseau de généraux maliens soudoyés fournit à l'Algérie renseignement et influence sur la junte militaire de Bamako."
 ALG_sahel_mediator: "Médiateur du Sahel"
 ALG_sahel_mediator_desc: "L'Algérie a émergé comme principale médiatrice diplomatique des conflits sahéliens. Notre voix pèse dans les affaires régionales."
 MAL_international_isolation: "Isolement international"
 MAL_international_isolation_desc: "Le régime militaire affronte condamnation et isolation internationales. Le commerce est perturbé, l'aide étrangère suspendue, et le gouvernement peine à conserver le contrôle."
 ALG_bribed_our_generals: "A soudoyé nos généraux"
 ALG_supported_our_cause: "A soutenu notre cause"
 AU_condemned_regime: "Le régime condamné par l’UA"
 ALG_bribed_mali_generals: "Des généraux maliens soudoyés"
 ALG_isolated_mali: "Régime malien isolé"
 ALG_dziri_unlock_tt: "§YRequiert l'un des éléments suivants :§!\n- Priorité §HRestaurer l'espoir§! achevée\n- Priorité §HRésister au Pouvoir§! achevée\n- Priorité §HCoup d'État militaire§! achevée"
 ALG_requires_democratic_or_neutral_tt: "Exige un gouvernement §Hdémocratique§! ou §Hneutre§!"
 ALG_requires_authoritarian_or_neutral_tt: "Exige un gouvernement §Hautoritaire§! ou §Hneutre§!"
 ALG_not_gender_equality_tt: "§RIncompatible avec le focus Égalité des genres§!"
 ALG_not_suppressed_kabyle_tt: "§RIndisponible si la Kabylie a été réprimée§!"
 ALG_migration_event_required_tt: "§YDébloqué par l'événement Crise migratoire§!"
 ALG_drug_event_required_tt: "§YDébloqué par l'événement Crise de la drogue§!"
 ALG_dziri_tt: "§GBranche de la société algérienne débloquée :§!\n\nChoisissez comment façonner la société algérienne - progressiste ou traditionaliste, ouverte ou fermée."
 ALG_dziri_unlocks_tt: "§YDébloque la branche Société :§!\n- Voie de la société civile (démocratique/neutre)\n- Voie des traditions (autoritaire/neutre)\n- Droits berbères (démocratique/neutre)\n- Réponse à la drogue (déclenchée par événement)\n- Réponse aux migrations (déclenchée par événement)"
 ALG_open_civil_society_tt: "§GOuvrir la société civile :§!\n\n- ONG et œuvres de charité fleurissent\n- La participation démocratique augmente\n- Fondation pour des réformes progressistes"
 ALG_constitutionalize_rights_tt: "§GDroits constitutionnels :§!\n\n- Libertés fondamentales protégées\n- État de droit renforcé\n- Approbation internationale"
 ALG_integration_policy_tt: "§GProgrammes d'intégration :§!\n\n- Les migrants deviennent des citoyens productifs\n- Gains de main-d'œuvre\n- Cohésion sociale"
 ALG_unlocks_migration_branch_tt: "§YDébloque la branche Réponse aux migrations§!\n(Lorsque l'événement migratoire se déclenche)"
 ALG_migration_problems_tt: "§YCrise migratoire :§!\n\nDes migrants subsahariens affluent aux frontières sud de l'Algérie. Vous devez choisir comment répondre."
 ALG_migration_choice_tt: "§YChoix :§!\n- §GPolitique de portes ouvertes§! - Accueillir les migrants\n- §RFrontières fermées§! - Sécuriser la frontière"
 ALG_open_door_tt: "§GPolitique de portes ouvertes :§!\n\n- Accueillir migrants et réfugiés\n- Gains d'effectifs\n- Un peu de stabilité perdue\n- Réputation humanitaire"
 ALG_closed_borders_tt: "§RFrontières fermées :§!\n\n- Sécuriser la frontière\n- Gains de stabilité\n- Influence étrangère réduite\n- La croissance démographique ralentit"
 ALG_expand_berber_rights_tt: "§GÉlargir les droits berbères :§!\n\n- Culture amazighe célébrée\n- Satisfaction kabyle améliorée\n- La recherche bénéficie de la diversité"
 ALG_drug_problem_tt: "§YCrise de la drogue :§!\n\nLe trafic de drogue depuis le Maroc et le Sahel a créé des problèmes d'addiction. Vous devez choisir comment répondre."
 ALG_drug_choice_tt: "§YChoix :§!\n- §GDécriminaliser§! - Approche sanitaire\n- §RRenforcer les sanctions§! - Approche répressive"
 ALG_relax_restrictions_tt: "§GDéciminaliser les drogues :§!\n\n- Traiter l'addiction comme un problème de santé\n- Réduire la population carcérale\n- Une certaine influence mafieuse subsiste\n- Critiques internationales réduites"
 ALG_tighten_punishments_tt: "§RRépression de la drogue :§!\n\n- Peines sévères pour les dealers\n- Influence mafieuse réduite\n- Soutien à la guerre accru\n- Perte de stabilité"
 ALG_traditions_matter_tt: "§GValeurs traditionnelles :§!\n\n- Coutumes algériennes préservées\n- Valeurs religieuses promues\n- Résistance à l'influence occidentale"
 ALG_unlocks_conservative_path_tt: "§YDéverrouille la voie sociale conservatrice§!"
 ALG_censor_internet_tt: "§YCensurer Internet :§!\n\n- Bloquer la propagande étrangère\n- Contrôler le flux d'information\n- Réduire l'influence étrangère\n- Recherche légèrement plus lente"
 ALG_restrict_women_tt: "§YRôles de genre traditionnels :§!\n\n- Les femmes encouragées à rester au foyer\n- Le taux de natalité peut augmenter\n- Main-d'œuvre réduite\n- Critique occidentale"
 ALG_marriage_subsidies_tt: "§GSubventions au mariage :§!\n\n- L'État paie les mariages\n- Croissance démographique encouragée\n- Coût pour le Trésor\n- Valeurs traditionnelles promues"
 ALG_open_civil_society_idea: "Société civile ouverte"
 ALG_open_civil_society_idea_desc: "L'Algérie a une société civile vivante, avec des ONG, des œuvres et des organisations communautaires actives contribuant à la vie publique."
 ALG_constitutionalize_rights_idea: "Droits constitutionnels"
 ALG_constitutionalize_rights_idea_desc: "Les droits fondamentaux sont inscrits dans la constitution, protégeant les citoyens algériens et renforçant l'État de droit."
 ALG_integration_policy_idea: "Politique d'intégration"
 ALG_integration_policy_idea_desc: "L'Algérie intègre activement migrants et réfugiés, fournissant formation linguistique et voies vers la citoyenneté."
 ALG_migration_crisis: "Crise migratoire"
 ALG_migration_crisis_desc: "Des vagues de migrants d'Afrique subsaharienne ont submergé les installations frontalières et créé des tensions sociales."
 ALG_welcome_migrants: "Politique de la porte ouverte"
 ALG_welcome_migrants_desc: "L'Algérie accueille migrants et réfugiés, fournissant assistance humanitaire et soutien à l'intégration."
 ALG_refugees_maintained: "Population de réfugiés gérée"
 ALG_refugees_maintained_desc: "La population de réfugiés d'Algérie est bien gérée, avec des installations adéquates et des programmes d'intégration."
 ALG_drug_crisis: "Crise de la drogue"
 ALG_drug_crisis_desc: "Le trafic de drogue et l'addiction sont devenus des problèmes graves, mettant à rude épreuve les forces de l'ordre et les services de santé."
 ALG_traditions_matter_idea: "Valeurs traditionnelles"
 ALG_traditions_matter_idea_desc: "L'Algérie promeut les valeurs traditionnelles : famille, foi et communauté. L'influence culturelle occidentale est combattue."
 ALG_censored_internet_idea: "Internet censuré"
 ALG_censored_internet_idea_desc: "Le gouvernement contrôle l'accès à Internet, bloquant la propagande étrangère et le contenu immoral."
 ALG_women_role_idea: "Rôles de genre traditionnels"
 ALG_women_role_idea_desc: "Les femmes sont encouragées à embrasser des rôles traditionnels de foyères et de mères. La participation féminine à la main-d'œuvre a décliné."
 ALG_marriage_subsidies_idea: "Subventions au mariage"
 ALG_marriage_subsidies_idea_desc: "Le gouvernement subventionne les mariages, aidant les jeunes couples à financer les noces et encourageant la formation des familles."
 restricts_women_rights: "Restreint les droits des femmes"
 ALG_migration_flood: "Crise migratoire active"
 ALG_drugs: "Crise de la drogue active"
 ALG_mediterranean_games_preparation: "Préparation des Jeux méditerranéens"
 ALG_mediterranean_games_preparation_desc: "Oran est transformée pour les Jeux méditerranéens de 2022. Les chantiers travaillent jour et nuit sur le complexe olympique, de nouveaux stades et le village des athlètes. La nation se rassemble derrière cet événement historique tandis que l'Algérie se prépare à accueillir 26 nations sur ses rives."
 ALG_more_infra: "Étendre les infrastructures"
 ALG_more_infra_desc: "L'infrastructure algérienne exige une expansion significative pour soutenir la croissance économique. Nouvelles routes, chemins de fer et réseaux relieront les communautés et faciliteront le commerce à travers la nation."
 TT_ALG_SECULAR_DISCONTENT_MODIFIER: "§RLes laïcs se mécontentent§!\nLes Algériens progressistes et laïcs s'opposent aux politiques religieuses."
 TT_ALG_ISLAMIST_SATISFACTION_MODIFIER: "§GLe soutien islamiste augmente§!\nLes conservateurs religieux approuvent ces mesures."
 ALG_more_relation_better: "§HIls sont§! §Gplus susceptibles de rejoindre§! §Hsi nous avons§! §Gde meilleures relations !§!"
 algerian_military_dismantling: "Démantèlement militaire"
 algerian_military_dismantling_desc: "L'armée algérienne est systématiquement démantelée. Matériel mis hors service, unités dissoutes, officiers mis à la retraite. L'Armée nationale populaire, jadis puissante, n'est plus que l'ombre d'elle-même."
 algerian_student_exchanges: "Programmes d'échange d'étudiants"
 algerian_student_exchanges_desc: "Des étudiants algériens étudient à l'étranger tandis que des étudiants internationaux viennent en Algérie. Ces échanges bâtissent des liens, transfèrent le savoir et forment la prochaine génération de professionnels algériens."
 ALG_boost_reformists: "Boostez les réformistes"
 ALG_boost_old_guard: "Renforcez la vieille garde"
 ALG_rally_students: "Rassemblement des étudiants"
 ALG_mobilize_veterans: "Mobiliser les vétérans"
 ALG_bribe_elites: "Pot-de-vin aux élites"
 ALG_seek_compromise: "Rechercher un compromis"
 ALG_media_campaign_reform: "Réforme de la campagne médiatique"
 ALG_security_crackdown: "Répression sécuritaire"
 ALG_world_tension_security: "Sécurité face aux tensions mondiales"
 ALG_world_tension_high_security: "Sécurité renforcée face aux tensions mondiales"
 ALG_path_crackdown_momentum: "Dynamique de la répression"
 ALG_path_reconciliation_momentum: "Élan de réconciliation"
 ALG_oil_patronage: "Patronage pétrolier"
 ALG_economic_reforms: "Réformes économiques"
 ALG_ter_oboronaup_start: "Défense territoriale"
 ALG_internalup_start: "Troupes internes"
 ALG_MAJLIS_WATANI_SHAABI_DESC: "L'Assemblée populaire nationale est la chambre basse du Parlement algérien. Sous ce système, le pouvoir exécutif est dévolu à l'Assemblée plutôt qu'à un seul président, établissant une vraie république parlementaire où les représentants élus gouvernent collectivement la nation."
 ALG_a_new_algeria_tt: "Le réseau de corruption de Bouteflika est démantelé. Leur fortune volée est saisie, leurs biens vendus, et les fonds recouvrés sont rendus au Trésor national."
 FIS_faction_middle_east_available_tt: "Au moins une nation sunnite du Moyen-Orient doit avoir une opinion de nous supérieure à 70 et poursuivre une politique étrangère interventionniste"
 FIS_faction_asia_available_tt: "Au moins une nation sunnite d'Asie doit avoir une opinion de nous supérieure à 70 et poursuivre une politique étrangère interventionniste"
 ALG_4g_upgrade_decisions_tt: "Débloque des décisions pour moderniser l'infrastructure nationale du réseau 4G."
 ALG_environmental_campaign_no_space_tt: "Aucun emplacement de construction disponible. À la place, l'influence intérieure a été accrue par la campagne médiatique environnementale."
 ALG_grand_mufti_rule_djaballah_tt: "Abdallah Djaballah sera nommé nouveau chef d'État, apportant une orientation islamiste conservatrice à la gouvernance algérienne."
 ALG_grand_mufti_rule_ulema_tt: "Le Conseil des oulémas sera consulté pour déterminer le leadership religieux de l'Algérie, déclenchant un choix entre factions cléricales rivales."
 ALG_revivify_non_aligned_movement_t: "L'Algérie s'emploiera à revitaliser le mouvement des non-alignés, se positionnant comme voix de premier plan des nations hors des blocs des grandes puissances."
 TT_ALG_REDUCE_TAXES_5: "Le taux d'impôt sur la population sera réduit de 5, allégeant le fardeau des classes inférieures et bâtissant le soutien parmi la paysannerie."
 ALG_east_west_highway: "Autoroute Est-Ouest"
 ALG_east_west_highway_desc: "L'autoroute Est-Ouest servira d'ossature économique de l'Algérie, reliant les grands centres de population d'Annaba à Tlemcen et améliorant considérablement le commerce intérieur et la mobilité."
 ALG_future_national_policy1: "Une nation à la croisée des chemins"
 ALG_future_national_policy1_desc: "L'avenir de l'Algérie reste à écrire. Les décisions des années à venir définiront le caractère de l'État, ses valeurs, ses alliés et sa place dans le monde."
 ALG_hassi_massoud_exploitation_desc: "Le champ pétrolier de Hassi Messaoud est l'un des plus grands d'Afrique. En investissant dans son pleine exploitation, l'Algérie peut augmenter dramatiquement sa production pétrolière et sécuriser des revenus énergétiques de long terme."
 ALG_north_south_highway_desc: "Une autoroute transsaharienne reliant la côte nord au profond sud ouvrira le vaste intérieur algérien, permettant l'extraction des ressources et réduisant l'inégalité régionale."
 ALG_black_decade_lesson2_idea: "Leçons de la Décennie noire II"
 ALG_black_decade_lesson2_idea_desc: "Les réformes des forces armées se sont appuyées sur les douloureuses leçons de la guerre civile. L'armée algérienne est mieux préparée à gérer les menaces intérieures sans recourir à une violence indiscriminée."
 ALG_black_decade_lesson3_idea: "Leçons de la Décennie noire III"
 ALG_black_decade_lesson3_idea_desc: "Une décennie de réforme a transformé la doctrine de sécurité algérienne. La lutte contre l'extrémisme est désormais ancrée dans la culture militaire, avec des unités spécialisées et des réseaux de renseignement conçus pour prévenir de futures insurrections."
 ALG_decline_of_tourism1: "Relance du secteur touristique"
 ALG_decline_of_tourism1_desc: "Le pire du déclin est passé. Un investissement ciblé et de meilleures conditions de sécurité commencent à ramener les visiteurs vers les sites historiques et le littoral méditerranéen de l'Algérie."
 ALG_destroyed_agriculture_two: "Un secteur agricole endommagé"
 ALG_destroyed_agriculture_two_desc: "L'instabilité continue d'entraver la relance agricole. Les champs restent improductifs et les communautés rurales peinent à reprendre une activité agricole normale."
 ALG_destroyed_agriculture_three: "Reconstruction agricole"
 ALG_destroyed_agriculture_three_desc: "Des efforts de reconstruction sont en cours dans le secteur agricole. De nouveaux districts sont mis en culture et l'infrastructure est lentement reconstruite pour restaurer la capacité de production alimentaire."
 ALG_family_centric_2: "La famille au cœur de la société II"
 ALG_family_centric_2_desc: "L'accent sur les structures familiales traditionnelles s'est approfondi, modelant la politique sociale autour d'une vision conservatrice du foyer comme fondement de la société algérienne."
 ALG_hydroelectric_power_plants_upgraded2_idea: "Réseau hydroélectrique avancé"
 ALG_hydroelectric_power_plants_upgraded2_idea_desc: "Une deuxième vague de modernisation de l'infrastructure hydroélectrique algérienne a considérablement étendu la capacité de stockage d'énergie et la fiabilité du réseau à travers le pays."
 ALG_mastering_atom_2: "Maîtriser l'atome II"
 ALG_mastering_atom_2_desc: "Le programme nucléaire algérien a avancé jusqu'au stade de l'enrichissement, suscitant l'inquiétude internationale. Le pays est désormais capable de produire du matériau de qualité militaire, bien que l'étape finale n'ait pas encore été franchie."
 ALG_mastering_atom_3: "Maîtriser l'atome III"
 ALG_mastering_atom_3_desc: "L'Algérie a développé avec succès une capacité d'armes nucléaires. La nation se dresse désormais parmi les puissances nucléaires mondiales, altérant dramatiquement l'équilibre régional des forces."
 ALG_riot_police_1: "Unité de réponse rapide d'Al-Saiqa"
 ALG_riot_police_1_desc: "Une unité de police anti-émeute dédiée a été formée, entraînée spécifiquement à disperser les protestations et maintenir l'ordre dans les centres urbains. Leur présence dissuade les troubles civils."
 ALG_riot_police_2: "Déploiement étendu d'Al-Saiqa"
 ALG_riot_police_2_desc: "L'unité anti-émeute a été réduite et réformée après des critiques publiques d'usage excessif de la force. Son mandat a été restreint et le contrôle accru."
 ALG_riot_police_3: "Force d'élite d'Al-Saiqa"
 ALG_riot_police_3_desc: "L'unité Al-Saiqa a été étendue et professionnalisée en force d'élite de sécurité intérieure, capable d'un déploiement rapide n'importe où dans le pays."
 ALG_science_idea_two: "Renaissance scientifique algérienne II"
 ALG_science_idea_two_desc: "S'appuyant sur la première vague d'investissement scientifique, l'Algérie a établi un réseau d'institutions de recherche et de partenariats internationaux qui accélèrent le développement technologique."
 ALG_air_reform_desc: "Un premier tour de réformes de l'armée de l'air algérienne a commencé à moderniser sa structure de commandement et à moderniser sa flotte d'appareils vieillissants."
 ALG_air_reform2_desc: "La deuxième phase de réforme aérienne a introduit des programmes d'entraînement avancés et de meilleures procédures de maintenance, accroissant la préparation opérationnelle."
 ALG_air_reform3_desc: "L'armée de l'air algérienne a été substantiellement revue. De nouvelles escadrilles équipées d'appareils modernes ont été mises en service, améliorant nettement la défense aérienne et la projection de puissance."
 ALG_air_reform4_desc: "Le programme de réforme aérienne est achevé. L'Algérie aligne désormais l'une des armées de l'air les plus capables du continent africain."
 ALG_algerian_tourism_desc: "Le secteur touristique algérien est activement promu, avec un investissement dans l'hôtellerie et des campagnes de marketing international attirant les visiteurs vers le riche patrimoine culturel et naturel du pays."
 ALG_army_reform_desc: "Un programme de réforme d'ensemble a été lancé pour moderniser l'armée algérienne, améliorant normes d'entraînement, logistique et structures de commandement."
 ALG_army_reform_mass_army_desc: "L'Algérie bâtit une grande armée conventionnelle capable d'opérations soutenues, privilégiant les effectifs et l'infanterie mécanisée plutôt que les forces spécialisées."
 ALG_army_reform_mass_army2_desc: "La réforme d'armée de masse est entrée dans sa deuxième phase, avec une meilleure logistique et un appui blindé accroissant la puissance de combat conventionnelle des forces terrestres algériennes."
 ALG_army_reform_mass_army3_desc: "La doctrine d'armée de masse algérienne est pleinement établie. De grandes formations interarmes sont désormais l'ossature de la stratégie de défense terrestre de la nation."
 ALG_army_reform_mass_army4_desc: "Le programme d'armée de masse est achevé. L'Algérie peut aligner des forces terrestres numériquement supérieures appuyées par une infrastructure logistique robuste."
 ALG_army_reform_specops_desc: "L'Algérie investit dans les forces d'opérations spéciales, créant des unités d'élite formées à l'antiterrorisme, à la réaction rapide et à la guerre non conventionnelle."
 ALG_army_reform_specops2_desc: "Le programme de forces spéciales s'est étendu, avec de nouvelles unités formées au sauvetage d'otages, à l'infiltration profonde et aux actions directes."
 ALG_army_reform_specops3_desc: "Les forces spéciales algériennes ont atteint un haut niveau de capacité, s'appuyant sur des décennies d'expérience de contre-insurrection au Sahel et chez nous."
 ALG_army_reform_specops4_desc: "Le programme de réforme des forces spéciales est achevé. Les unités d'élite algériennes sont parmi les plus capables d'Afrique, respectées pour leur expérience et leur sophistication opérationnelle."
 ALG_basic_income_support_desc: "Un programme de revenu de base fournit un filet de sécurité financier aux citoyens les plus pauvres d'Algérie, réduisant la pauvreté et amortissant les effets de la volatilité économique."
 ALG_black_decade_methods_desc: "Les forces de sécurité continuent de s'appuyer sur les méthodes brutales développées pendant la guerre civile. Efficaces à court terme, cette approche alimente le ressentiment et risque de ranimer l'extrémisme même qu'elle vise à réprimer."
 ALG_border_security_idea_desc: "Des postes frontaliers renforcés et des itinéraires de patrouille étendus ont amélioré la capacité de l'Algérie à intercepter contrebandiers, trafiquants d'armes et infiltrés extrémistes traversant ses vastes frontières désertiques."
 ALG_childcare_reform_desc: "De nouvelles crèches et des programmes de garderie subventionnés sont déployés, facilitant pour les familles l'équilibre entre travail et éducation des enfants."
 ALG_closed_moroccan_border_desc: "La frontière avec le Maroc reste fermement close. Si cela limite la contrebande transfrontalière, cela étouffe aussi le commerce légitime et approfondit le gel diplomatique entre les deux nations."
 ALG_confidence_measures_idea_desc: "Un paquet de mesures de confiance entre l'Algérie et ses voisins aide à réduire les tensions et à ouvrir des canaux de dialogue diplomatique."
 ALG_counter_morocco_idea_desc: "L'Algérie contre activement l'influence marocaine dans la région par la pression diplomatique, le soutien au Front Polisario et la compétition stratégique pour les alliés africains."
 ALG_dialogue_with_morocco_desc: "Un dialogue prudent a été ouvert avec le Maroc, explorant la possibilité de normaliser les relations et de rouvrir la frontière après des années d'hostilité."
 ALG_education_arabization_desc: "L'arabisation du système éducatif a été approfondie, remplaçant l'enseignement en français par l'arabe à tous les niveaux et inscrivant les valeurs islamiques au curriculum national."
 ALG_food_subsidy_idea_desc: "Les subventions gouvernementales maintiennent bas les prix des denrées de base, assurant que même les plus pauvres Algériens puissent se nourrir. Toutefois, cela pèse lourdement sur le budget national."
 ALG_foreign_arms_companies_desc: "L'Algérie a ouvert son processus d'acquisition aux fabricants d'armes étrangers, accédant à une plus large gamme d'équipement militaire mais accroissant la dépendance aux fournisseurs extérieurs."
 ALG_fuel_subsidy_idea_desc: "Les prix subventionnés du carburant maintiennent bas les coûts de transport et d'énergie pour les ménages et entreprises algériens, mais représentent un passif fiscal majeur qui limite la flexibilité budgétaire du gouvernement."
 ALG_future_army_desc: "L'Algérie investit dans la technologie et la doctrine militaires de nouvelle génération, positionnant ses forces armées à la pointe de la capacité de guerre moderne."
 ALG_global_power_desc: "L'Algérie s'est établie comme une véritable puissance mondiale, avec un siège à la table internationale et le poids économique et militaire pour l'étayer."
 ALG_health_insurance_system_desc: "Un système national d'assurance maladie est établi, fournissant aux Algériens un accès aux soins médicaux indépendamment de leur niveau de revenu."
 ALG_housing_support_idea_desc: "Des programmes de soutien au logement aident les familles à bas revenus à accéder à un logement abordable, réduisant la pression de la pénurie urbaine algérienne."
 ALG_hydroelectric_power_plants_upgraded_idea_desc: "L'infrastructure hydroélectrique algérienne a été modernisée, accroissant la capacité et la fiabilité de la production électrique hydraulique et réduisant la dépendance aux fossiles."
 ALG_idea_arab_diplomacy_desc: "L'Algérie poursuit un agenda diplomatique arabe actif, se positionnant comme médiatrice et voix clé au sein de la Ligue arabe et du monde arabe plus large."
 ALG_idea_parliamentary_republic_desc: "L'Algérie a adopté un système de république parlementaire, déplaçant le pouvoir exécutif vers le législatif et établissant une forme de gouvernement plus responsable."
 ALG_idea_presidential_republic_desc: "L'Algérie fonctionne comme une république présidentielle, l'autorité exécutive concentrée dans la fonction de président élu au suffrage direct."
 ALG_idea_refoming_education_desc: "Un premier tour de réformes éducatives a commencé à améliorer les normes de curriculum, la formation des enseignants et l'accès à l'école à travers le pays."
 ALG_idea_refoming_education1_desc: "La deuxième phase de réforme éducative a étendu le secondaire, amélioré la formation professionnelle et introduit des méthodologies d'enseignement actualisées dans les écoles algériennes."
 ALG_idea_semi_presidential_republic_desc: "Le système semi-présidentiel algérien équilibre le pouvoir entre un président élu au suffrage direct et un Premier ministre responsable devant le parlement."
 ALG_maghreb_cooperation_idea_desc: "L'Algérie s'emploie à approfondir la coopération économique et politique avec ses voisins maghrébins, posant les bases d'un bloc régional nord-africain plus intégré."
 ALG_maghreb_security_idea_desc: "Un cadre de sécurité partagé avec les partenaires maghrébins permet des réponses coordonnées au terrorisme, à la contrebande et à l'instabilité transfrontalière au Sahel."
 ALG_maghreb_trade_idea_desc: "Des accords commerciaux préférentiels avec les nations maghrébines stimulent le commerce intra-régional, réduisant la dépendance de l'Algérie aux marchés européens."
 ALG_mastering_atom_desc: "L'Algérie a lancé un programme nucléaire clandestin, établissant l'infrastructure de recherche nécessaire pour éventuellement développer du matériau de qualité militaire."
 ALG_military_expansion_desc: "L'Algérie étend la taille de ses forces armées, investissant dans du nouveau matériel et recrutant du personnel supplémentaire pour projeter une plus grande puissance militaire."
 ALG_military_expansion2_desc: "Le programme d'expansion militaire est entré dans sa deuxième phase, avec de nouvelles unités blindées, brigades d'artillerie et systèmes de défense aérienne mis en service."
 ALG_military_junta_desc: "L'armée a pris le contrôle direct de l'État. L'Algérie est gouvernée par une junte de généraux dont la légitimité repose sur la force plutôt que sur un mandat populaire."
 ALG_military_quality_initiative_desc: "Une approche qualité plutôt que quantité de la réforme militaire améliore le professionnalisme, les normes d'entraînement et l'équipement des forces armées algériennes."
 ALG_military_quality_initiative2_desc: "La deuxième phase de l'initiative de qualité militaire a introduit un entraînement par simulation avancé, une meilleure formation des officiers et des exercices interarmées étendus."
 ALG_modern_hospitals_desc: "L'Algérie bâtit un réseau d'hôpitaux modernes équipés de technologies médicales contemporaines, améliorant nettement les résultats de santé de la population."
 ALG_natural_products_idea_desc: "L'Algérie promeut ses produits naturels, dont dattes, huile d'olive et artisanat, sur les marchés internationaux, diversifiant les revenus d'export et soutenant les communautés rurales."
 ALG_naval_reform_desc: "La marine algérienne subit sa première grande réforme depuis des décennies, améliorant maintenance, entraînement et capacité de sa flotte de surface."
 ALG_naval_reform2_desc: "De nouvelles frégates et patrouilleurs ont été mis en service dans le cadre de la deuxième phase de réforme navale, étendant la portée de l'Algérie en Méditerranée occidentale."
 ALG_naval_reform3_desc: "La capacité navale algérienne a été substantiellement modernisée, avec de meilleures capacités de lutte anti-sous-marine et de défense côtière."
 ALG_naval_reform4_desc: "Le programme de réforme navale est achevé. L'Algérie aligne désormais une force navale moderne et équilibrée capable de projeter sa puissance à travers la Méditerranée et vers l'Atlantique."
 ALG_open_border_coop_desc: "L'Algérie a ouvert ses frontières à une plus grande coopération transfrontalière avec ses voisins, facilitant le commerce, les mouvements de personnes et les projets d'infrastructure conjoints."
 ALG_pna_expansion_desc: "L'Armée nationale populaire a étendu sa capacité logistique et administrative, améliorant sa capacité à soutenir des opérations de grande envergure à travers le vaste territoire algérien."
 ALG_polisario_support_idea_desc: "L'Algérie continue de fournir un soutien politique, logistique et matériel au Front Polisario, maintenant la pression sur le Maroc dans le conflit du Sahara occidental."
 ALG_private_clinics_expansion_desc: "Le secteur privé de la santé est autorisé à s'étendre, offrant des soins de meilleure qualité à ceux qui peuvent se les offrir tout en allégeant la pression sur le système public."
 ALG_private_healthcare_idea_desc: "L'Algérie encourage l'investissement privé dans la santé, créant un secteur privé parallèle qui offre des services premium aux côtés du système public."
 ALG_reactioners_desc: "Des éléments conservateurs au sein de la bureaucratie et de l'armée résistent à une réforme véritable, protégeant les intérêts de l'ordre établi au détriment de la modernisation."
 ALG_reactioners1_desc: "Les forces réactionnaires ont été quelque peu affaiblies, bien qu'elles conservent une influence significative dans des institutions clés et continuent de ralentir le rythme du changement."
 ALG_reactioners2_desc: "L'emprise de la vieille garde se desserre. Les efforts de réforme ont assez d'élan pour dépasser nombre des obstacles institutionnels qui bloquaient auparavant le progrès."
 ALG_reactioners3_desc: "La faction réactionnaire a été substantiellement marginalisée. Le nouveau règlement politique a écarté beaucoup de leurs alliés des postes de pouvoir."
 ALG_reactioners4_desc: "La réforme systémique a brisé l'échine du bloc réactionnaire. Les institutions algériennes sont de plus en plus réactives à la demande populaire plutôt qu'aux intérêts d'une élite enracinée."
 ALG_reactioners5_desc: "Seules des poches isolées de résistance restent parmi la vieille garde. La transformation de la culture politique algérienne approche de son terme."
 ALG_reactioners6_desc: "Les derniers vestiges du système réactionnaire ont été balayés. L'Algérie est entrée dans une nouvelle ère définie par la responsabilité et une vraie compétition politique."
 ALG_reactioners7_desc: "L'Algérie a pleinement rompu avec son passé autoritaire. L'État est désormais structuré autour des normes démocratiques et de l'État de droit, les anciens réseaux de clientélisme dissous."
 ALG_sand_war_memory_idea_desc: "Le souvenir de la guerre des Sables de 1963 avec le Maroc modèle encore la planification militaire et la politique étrangère algériennes, nourrissant une profonde suspicion institutionnelle des intentions marocaines."
 ALG_science_idea_desc: "L'Algérie investit dans la recherche et le développement scientifiques, établissant de nouveaux laboratoires et finançant des programmes de recherche universitaire pour bâtir une économie nationale de la connaissance."
 ALG_shipbuilding_desc: "L'Algérie développe une industrie nationale de construction navale, construisant des installations capables de produire des navires militaires et commerciaux et réduisant la dépendance aux fournisseurs étrangers."
 ALG_shipbuilding2_desc: "L'industrie de construction navale a mûri, de plus grands et plus complexes navires étant désormais produits nationalement. L'Algérie devient une nation manufacturière maritime crédible."
 ALG_social_contract_idea_desc: "Le gouvernement a renouvelé son contrat social avec la population, échangeant l'acquiescement politique contre des subventions garanties, l'emploi public et des services sociaux."
 ALG_sonatrach_desc: "Sonatrach, la compagnie nationale pétrolière et gazière d'Algérie, demeure l'ossature de l'économie nationale, générant la vaste majorité des revenus d'export de l'État."
 ALG_state_hospitals_idea_desc: "Un réseau d'hôpitaux publics offre à tous les Algériens l'accès aux soins de base, même si le sous-financement chronique fait varier fortement la qualité selon les régions."
 ALG_suppressed_opposition_desc: "L'opposition politique a été réduite au silence par un mélange de restrictions juridiques, de contrôle des médias et d'intimidation directe. La dissidence est poussée dans la clandestinité plutôt qu'éliminée."
 ALG_technological_ties_desc: "L'Algérie a établi des accords de transfert de technologies avec des partenaires étrangers, accédant à des systèmes avancés et à de l'expertise en échange de concessions économiques et diplomatiques."
 ALG_tikjda_resort_desc: "La station de montagne de Tikjda, en Kabylie, est développée comme destination touristique phare, promouvant l'écotourisme et attirant les visiteurs vers l'Atlas algérien."
 ALG_universal_healthcare_idea_desc: "L'Algérie a établi un système de santé universel fournissant des soins gratuits ou fortement subventionnés à tous les citoyens, financé par l'impôt général et les revenus des hydrocarbures."
 ALG_university_expansion_desc: "De nouveaux campus universitaires sont établis à travers l'Algérie, élargissant l'accès à l'enseignement supérieur et produisant des diplômés adaptés aux exigences de l'économie moderne."
 ALG_welfare_state_idea_desc: "L'Algérie a bâti un État-providence d'ensemble fournissant soutien au logement, santé, éducation et aide au revenu, financé largement par les revenus pétroliers et gaziers."
 FIS_al_aqsa_faction: "La coalition d'Al-Aqsa"
 Algeria_desc: "Algérie"
 AlgeriaFocusEvents_desc: "Événements déclenchés par les axes pour l'Algérie."
 algeria_focus_desc: "Arbre de focus national de l'Algérie couvrant les voies politiques, économiques, militaires et de politique étrangère."
 algerian_focus_desc: "Arbre de focus national de l'Algérie couvrant les voies politiques, économiques, militaires et de politique étrangère."
 algeria_power_balance_desc: "L'équilibre des pouvoirs entre le gouvernement civil et l'establishment militaire, qui a longtemps fonctionné comme un État dans l'État en Algérie."
 nuclear_algeria_desc: "L'Algérie a franchi le seuil nucléaire, possédant des armes nucléaires opérationnelles qui altèrent fondamentalement sa posture stratégique en Afrique du Nord et en Méditerranée."
 ALG_civilian_government: "Gouvernement civil"
 ALG_civilian_government_desc: "Pour la première fois depuis des décennies, l'Algérie est gouvernée par une administration véritablement civile. L'armée s'est retirée de l'intervention politique directe, laissant les élus diriger."
 ALG_corrupt_generals: "Généraux corrompus"
 ALG_corrupt_generals_desc: "La haute direction militaire est rongée par la corruption. Les généraux enrichis par des décennies de clientélisme résistent à toute réforme qui menace leurs intérêts économiques."
 ALG_government_led_disaster: "Réponse aux catastrophes dirigée par l'État"
 ALG_government_led_disaster_desc: "L'État a pris le contrôle direct de la réponse aux catastrophes, déployant des ressources publiques à grande échelle. Coûteuse et bureaucratique, l'intervention produit toutefois de vrais résultats sur le terrain."
 ALG_no_disasters_plan: "Pas de plan d'urgence catastrophe"
 ALG_no_disasters_plan_desc: "L'Algérie n'a actuellement aucun cadre dédié de réponse aux catastrophes. Lorsque les crises frappent, l'absence de planification coordonnée mène à des réponses tardives et inefficaces qui aggravent les issues."
 ALG_olympic_preparation: "Programme de préparation olympique"
 ALG_olympic_preparation_desc: "L'Algérie investit lourdement dans la préparation à l'accueil des Jeux olympiques, bâtissant une infrastructure sportive de classe mondiale et lançant des programmes nationaux de développement athlétique."
 algerian_empowered_sharia_courts: "Tribunaux de la charia habilités"
 algerian_empowered_sharia_courts_desc: "La juridiction des tribunaux islamiques a été étendue, donnant aux autorités religieuses une plus grande influence sur les affaires civiles et familiales et déplaçant le cadre juridique algérien vers la charia."
 algerian_gulen_movement: "Mouvement inspiré de Gülen"
 algerian_gulen_movement_desc: "Un réseau inspiré du mouvement Gülen s'est implanté dans l'éducation et la société civile algériennes, promouvant une approche islamique moderniste et bâtissant une influence significative dans les institutions de l'État."
 algerian_scientific_ventures: "Entreprises scientifiques algériennes"
 algerian_scientific_ventures_desc: "Une vague d'entreprises scientifiques conjointes avec des partenaires étrangers alimente une renaissance de la recherche algérienne, avec de nouveaux projets en énergies renouvelables, informatique et science des matériaux gagnant une reconnaissance internationale."
 hoggar_nuclear_facility_idea: "Installation nucléaire du Hoggar"
 ALG_2014_oil_crash_idea_desc: "Le krach pétrolier de 2014 a dévasté les revenus hydrocarbures de l'Algérie, exposant la fragilité de son modèle économique dépendant des ressources et forçant de douloureuses coupes dans les dépenses publiques."
 ALG_AU_pressure_idea_desc: "L'Union africaine exerce une pression diplomatique sur l'Algérie au sujet d'une question régionale, contraignant ses options de politique étrangère et compliquant ses relations avec les États voisins."
 ALG_black_market_desc: "Un marché noir florissant s'est développé dans l'ombre de l'État, minant les statistiques commerciales officielles, privant le gouvernement de recettes fiscales et alimentant les réseaux du crime organisé."
 ALG_clean_government_desc: "Une nouvelle génération de fonctionnaires technocrates a apporté plus de transparence et de responsabilité au gouvernement. La corruption recule et la confiance publique dans les institutions se rétablit lentement."
 ALG_decline_of_tourism_desc: "Le secteur touristique algérien est en grave déclin. Préoccupations de sécurité, mauvaise infrastructure et régime de visas difficile ont rendu le pays peu attractif pour les visiteurs étrangers, coûtant cher à l'économie."
 ALG_destroyed_agriculture_desc: "Le secteur agricole algérien a été dévasté par le conflit et la négligence. Les terres gisent en jachère, les communautés rurales ont été déplacées, et la dépendance aux importations alimentaires a fortement augmenté."
 ALG_election_time_idea_desc: "Une campagne électorale est en cours, dominant l'agenda politique et créant à la fois opportunités et instabilité tandis que les factions rivales mobilisent leurs bases."
 ALG_emergency_budget_desc: "Le gouvernement a activé des dispositions budgétaires d'urgence, coupant les dépenses non essentielles et réorientant les ressources pour affronter une crise économique ou de sécurité aiguë."
 ALG_idea_joint_military_arab_desc: "L'Algérie est entrée dans un cadre militaire conjoint avec des partenaires arabes, permettant une planification de défense coordonnée, un renseignement partagé et des exercices d'entraînement combinés à travers la région."
 ALG_insurgency_unleashed_desc: "L'Algérie a délibérément cultivé des réseaux insurgés dans un État voisin, utilisant des relais irréguliers pour projeter sa puissance et déstabiliser des rivaux sans engagement militaire direct."
 ALG_national_dialogue_modifier_desc: "Un processus de dialogue national a réuni gouvernement et opposition, créant un rare espace de négociation politique et réduisant le risque immédiat de confrontation."
 ALG_political_repression_desc: "L'État s'engage dans une répression politique systématique, arrêtant des militants, censurant les médias et utilisant les services de sécurité pour faire taire la dissidence et maintenir le contrôle."
 ALG_repression_modifier_desc: "Une vague de répression a balayé la sphère politique algérienne. Des figures de l'opposition sont détenues, les médias réduits au silence, et les manifestations publiques dispersées par la force."
 ALG_sahara_expansion_1_desc: "La désertification avance dans les zones agricoles du sud algérien. Les premiers signes de l'expansion saharienne apparaissent, menaçant les communautés agricoles et réduisant les terres cultivables."
 ALG_sahara_expansion_2_desc: "La désertification saharienne s'est intensifiée, réduisant la production agricole et déplaçant les communautés rurales des wilayas du sud concernées."
 ALG_sahara_expansion_3_desc: "La désertification continue d'avancer sans frein. Une part significative des terres agricoles autrefois productives a été perdue aux conditions désertiques envahissantes."
 ALG_sahara_expansion_4_desc: "L'expansion du Sahara devient une crise nationale. Les pertes agricoles s'accumulent et la migration intérieure depuis le sud met sous pression les villes du nord."
 ALG_sahara_expansion_5_desc: "La moitié des terres agricoles du sud algérien est désormais menacée. La crise de désertification exige une intervention d'urgence du gouvernement et une assistance environnementale internationale."
 ALG_sahara_expansion_6_desc: "La désertification a atteint un seuil critique. Des districts agricoles entiers ont été abandonnés et les coûts économiques de la crise mettent à rude épreuve le budget national."
 ALG_sahara_expansion_7_desc: "L'urgence de désertification remodèle la géographie de l'Algérie. Une migration massive de dunes empiète sur l'infrastructure et la perte de terres agricoles accélère l'insécurité alimentaire."
 ALG_sahara_expansion_8_desc: "L'expansion saharienne a dévasté le secteur agricole du sud algérien. L'ampleur de la perte de terres déclenche une crise humanitaire parmi les communautés agricoles déplacées."
 ALG_sahara_expansion_9_desc: "La désertification a consumé la majorité des terres agricoles du sud algérien. Les efforts de remise en état peinent face à l'ampleur de l'effondrement écologique."
 ALG_sahara_expansion_10_desc: "Le sud agricole de l'Algérie a été presque entièrement englouti par le Sahara. La catastrophe environnementale est irréversible à l'échelle actuelle sans d'immenses interventions de reboisement et de gestion de l'eau."
 ALG_surveillance_state_modifier_desc: "L'Algérie a bâti une infrastructure de surveillance intérieure sophistiquée, surveillant les communications et suivant les activités des opposants politiques et des acteurs de la société civile."
 ALG_transparent_budget_desc: "L'Algérie a introduit un reporting budgétaire transparent, publiant des ventilations détaillées des dépenses publiques et rendant les comptes de l'État accessibles à un examen indépendant pour la première fois."
 algeria_cultural_rebirth_desc: "Une puissante vague de renouveau culturel nationaliste balaye l'Algérie, élevant le patrimoine et l'histoire indigènes tout en marginalisant les influences culturelles étrangères."
 algeria_emerging_youth_desc: "Une génération de jeunes Algériens politiquement engagés émerge, poussant à la réforme démocratique et à l'opportunité économique avec une assertivité croissante."
 algeria_nationalist_youth_desc: "Le mouvement de jeunesse algérien a pris un tournant nettement nationaliste, exigeant une politique étrangère plus assertive et la fin de ce qu'ils voient comme le compromis de la vieille garde avec les intérêts étrangers."
 hoggar_nuclear_facility_idea_desc: "Au fond du Hoggar, une installation de recherche nucléaire a été établie sur un site reculé. Son existence sert de puissant dissuasif à l'aventurisme étranger."
 idea_alg_empowered_parliament_desc: "Le parlement algérien s'est vu accorder une véritable autorité législative. La chambre détient désormais un vrai pouvoir sur le budget, la législation et la responsabilité ministérielle."
 idea_algerian_oligarchy_arrests_desc: "L'arrestation d'oligarques clés a ébranlé l'élite des affaires algérienne. Populaire auprès du public, la répression a toutefois créé une incertitude qui gèle l'investissement privé."
 ALG_flavor_event.6.t: "Crise des réfugiés"
 ALG_flavor_event.6.d: "Des vagues de réfugiés affluent à nos frontières, fuyant le conflit et l'instabilité dans les pays voisins. Notre infrastructure est sous tension et notre peuple est divisé sur la façon de répondre."
 ALG_flavor_event.6.a: "Nous devons les absorber."
 ALG_flavor_event.7.t: "Crise du trafic de drogue"
 ALG_flavor_event.7.d: "Des réseaux criminels organisés ont fait de l'Algérie un corridor de transit majeur pour les stupéfiants. Le trafic de drogue corrompt les institutions locales et alimente la violence dans les régions frontalières."
 ALG_flavor_event.7.a: "Réprimer les trafiquants."
 fra_colonial.1.t: "L'ombre du passé"
 fra_colonial.1.d: "Alger a formellement dénoncé l'héritage colonial de la France en Algérie, raniment de vieilles plaies et enflammant l'opinion publique des deux côtés de la Méditerranée. Notre parlement est divisé : certains exigent que nous tenions bon sur notre bilan historique, d'autres y voient une opportunité de réconciliation."
 fra_colonial.1.a: "Défendre notre bilan historique."
 fra_colonial.1.b: "Offrir un geste de réconciliation."
 algerian_event.51.d: "Contre toute attente, le programme spatial algérien a accompli l'extraordinaire : notre vaisseau a atterri avec succès sur la Lune. Ce triomphe d'ingénierie et de volonté nationale a électrisé le peuple algérien et placé notre drapeau parmi les étoiles."
 ALG_aouchiche_desc: "Youcef Aouchiche est un réformiste libéral et dirigeant du Front des forces socialistes. Critique vocal de l'establishment au pouvoir, il a milité pour la réforme démocratique, les libertés civiles et la modernisation économique."
 ALG_hassani_desc: "Abdelali Hassani Cherif est le dirigeant du Mouvement de la société pour la paix, principal parti islamiste d'Algérie. Il plaide pour un islam politique modéré aligné sur les normes démocratiques et la réconciliation nationale."
 algeria_elections.a: "Ainsi en est-il décidé."
 alg_military_rule_option: "Soutenir la décision de l'armée."
 AlgeriaPoliticalEvents.1.t: "Réalignement politique de l'Algérie"
 AlgeriaPoliticalEvents.1.d: "Alors que la Décennie noire touche à sa fin, l'Algérie affronte un choix crucial sur son orientation politique future. Partenariat occidental, non-alignement, ou liens plus étroits avec l'Est : chaque chemin porte de profondes conséquences pour l'identité et la stabilité du pays."
 AlgeriaPoliticalEvents.1.a: "Ouvrir le débat national."
 AlgeriaPoliticalEvents.20.t: "Fracture idéologique au gouvernement"
 AlgeriaPoliticalEvents.20.d: "Le conflit s'apaisant, la pression monte au sein du gouvernement pour définir le futur système politique algérien. Les durs exigent la domination militaire, les modérés poussent à la réconciliation et à la réforme, tandis que les factions islamistes appellent à des élections libres."
 AlgeriaPoliticalEvents.20.a: "Renforcer l'armée."
 AlgeriaPoliticalEvents.20.b: "Pousser à la réforme et à la réconciliation."
 AlgeriaPoliticalEvents.20.c: "Négocier avec les islamistes."
 Algeria.8.t: "L’Algérie demande protection"
 Algeria.8.d: "Le gouvernement algérien a formellement demandé une protection ou des garanties de sécurité américaines, invoquant une instabilité régionale croissante. Washington doit maintenant décider d'étendre ou non son parapluie stratégique."
 Algeria.8.a: "Nous acceptons la demande."
 Algeria.8.b: "Nous ne pouvons pas nous y engager."
 ALG_alignments: "Alignement de politique étrangère"
 KBY_alg_modifier: "Modificateurs d’État kabyle"
 ALG_algiers_metro: "Corridor du métro d'Alger"
 ALG_diplomatic_outreach_west: "Ouverture diplomatique vers l'Occident"
 ALG_diplomatic_outreach_west_desc: "La relation de l'Algérie avec Washington et ses alliés européens a été définie par une méfiance mutuelle. Une initiative diplomatique soutenue pourrait poser les bases de liens économiques et de sécurité plus étroits avec le monde occidental."
 ALG_diplomatic_outreach_china: "Ouverture diplomatique vers la Chine"
 ALG_diplomatic_outreach_china_desc: "Pékin étend régulièrement sa présence à travers le continent africain. Approfondir les liens avec la Chine pourrait débloquer d'importants investissements d'infrastructure et ouvrir de nouveaux marchés, bien que cela puisse compliquer les relations avec les partenaires occidentaux."
 monitor_kabyle_unrest_desc: "Les montagnes de Kabylie ont été un foyer persistant. Les services de sécurité doivent maintenir une surveillance étroite de l'activité de résistance dans la région pour prévenir l'escalade."
 kabyle_resistance_tooltip: "L'activité de résistance en Kabylie reste élevée."
 ALG_boost_reformists_desc: "Au sein de la structure politique opaque de l'Algérie, une faction de technocrates et de modernisateurs pousse à une vraie réforme. Leur fournir couverture politique et ressources pourrait déplacer l'équilibre interne du pouvoir vers l'ouverture."
 ALG_boost_old_guard_desc: "Le réseau établi d'officiers et de vétérans du FLN qui ont bâti l'État post-indépendance s'inquiète du rythme du changement. Réaffirmer leur position et leurs prérogatives consolidera la stabilité mais ancrera le statu quo."
 ALG_rally_students_desc: "Les campus universitaires ont historiquement été le moteur du changement politique algérien. Organiser les associations étudiantes derrière l'agenda réformiste peut générer une pression d'en bas et déplacer le discours public."
 ALG_mobilize_veterans_desc: "Les vétérans de la guerre d'indépendance et de la Décennie noire portent une énorme autorité morale dans la société algérienne. Les rassembler derrière l'ordre existant prête légitimité à la position de l'État dans le concours politique actuel."
 ALG_bribe_elites_desc: "Une grande part de la structure de pouvoir algérienne fonctionne sur des réseaux informels de clientélisme et de faveurs. Distribuer contrats, nominations et bénéfices financiers à des figures clés peut consolider la loyauté, bien que cela approfondisse la corruption qui ronge déjà l'État."
 ALG_seek_compromise_desc: "Les deux camps du débat interne étant retranchés, un effort de médiation neutre peut être le seul moyen d'empêcher une impasse de basculer en confrontation ouverte. Un compromis ne satisfera pleinement personne, mais peut éviter le pire."
 ALG_media_campaign_reform_desc: "Les médias d'État et privés sympathisants peuvent être dirigés pour bâtir un récit autour du besoin de renouveau politique. Façonner l'opinion publique en faveur de la réforme déplace le terrain sous la vieille garde."
 ALG_security_crackdown_desc: "L'appareil de sécurité peut être dirigé pour réprimer protestations, médias indépendants et groupes de la société civile qui alimentent le mouvement réformiste. Cela gagnera du temps, mais stockera de plus gros problèmes pour plus tard."
 ALG_world_tension_security_desc: "L'instabilité croissante à travers la région fournit à l'establishment militaire de nouveaux arguments pour garder la politique fermement sous son contrôle. Capitaliser sur ce climat peut consolider la position de la vieille garde."
 ALG_world_tension_high_security_desc: "Les conflits régionaux débordant vers les frontières algériennes, l'armée pousse à des pouvoirs d'urgence qui écarteraient effectivement les avocats de la réforme civile. La crise fournit une couverture, mais suspendre la compétition politique porte des risques de long terme."
 ALG_path_crackdown_momentum_desc: "La répression montre des résultats. Maintenir l'élan par des opérations de sécurité supplémentaires et une pression politique approfondira l'emprise de la vieille garde sur l'État, mais chaque pas rend le retour plus difficile."
 ALG_path_reconciliation_momentum_desc: "Le processus de réforme gagne du terrain. Poursuivre avec des mesures de confiance supplémentaires et des ouvertures politiques peut porter l'agenda de réconciliation au-delà du point de non-retour."
 ALG_oil_patronage_desc: "La manne hydrocarbure de l'Algérie a longtemps servi à acheter la paix sociale. Réorienter une part des revenus pétroliers vers un clientélisme ciblé peut assurer la loyauté de circonscriptions clés dans le concours politique actuel."
 ALG_economic_reforms_desc: "L'économie algérienne dominée par l'État est profondément inefficace. Un paquet crédible de réformes économiques, ouvrant l'espace à l'entreprise privée et réduisant les obstacles bureaucratiques, pourrait déplacer le sentiment populaire vers le camp réformiste."
 ALG_ter_oboronaup_start_desc: "Le pays étant en guerre, la Garde nationale appelle à la formation d'unités de défense territoriale recrutées localement pour tenir l'arrière et libérer les formations de l'armée régulière pour les opérations de première ligne."
 ALG_internalup_start_desc: "La situation exige le déploiement de troupes de sécurité intérieure dédiées pour maintenir l'ordre derrière le front, protéger l'infrastructure critique et empêcher l'ennemi d'exploiter l'instabilité à l'arrière."
 ALG_casablanca_mission: "Poursuivre le règlement de Casablanca"
 ALG_eliminate_GIA: "Éliminer le GIA"
 ALG_eliminate_GIA_desc: "Le Groupe islamique armé représentait jadis le visage le plus brutal de l'insurrection. Leurs réseaux fracturés et le soutien public s'effondrant, l'État s'emploie désormais à démanteler les derniers restes de l'organisation et à rétablir l'ordre à travers le pays."
 ALG_reintegration_programs: "Programmes de réintégration"
 ALG_reintegration_programs_desc: "Des années de violence ont laissé des milliers d'anciens combattants et sympathisants dispersés dans la société algérienne. Par des programmes de réintégration soigneusement surveillés, le gouvernement offrira un chemin de retour à la vie civile à ceux prêts à abandonner l'insurrection."
 ALG_strengthen_DRS: "Renforcer le DRS"
 ALG_strengthen_DRS_desc: "Le Département du renseignement et de la sécurité a joué un rôle décisif dans la lutte contre les réseaux extrémistes pendant la Décennie noire. Renforcer les capacités de nos services de renseignement assurera que l'Algérie ne redescende plus jamais dans un tel chaos."
 ALG_coalition_economic_program_tt: "La coalition présidentielle lance un programme coordonné de développement économique."
 ALG_governmental_transparency_tt: "Le gouvernement s'engage dans des réformes de transparence, affaiblissant la corruption enracinée mais irritant les intérêts militaires."
 ALG_ethnic_satisfaction_critical: "§RHostilité ouverte§!"
 ALG_ethnic_satisfaction_low: "§YProfond ressentiment§!"
 ALG_ethnic_satisfaction_moderate: "§YTensions latentes§!"
 ALG_ethnic_satisfaction_high: "§GRelativement satisfait§!"
 ALG_deep_state_map_name: "Alger - Centre du pouvoir"
 ALG_hybrid_military_governance: "Gouvernance militaire hybride"
 ALG_hybrid_military_governance_desc: "L'Algérie fonctionne sous un système hybride où l'armée conserve une influence politique significative tandis que les structures civiles restent en place."
 ALG_civil_war_brewing_added_tt: "§R£generic_warning RISQUE DE GUERRE CIVILE !§!\nLa résistance au coup d'État a déstabilisé l'Algérie."
 ALG_accepted_foreign_intervention: "Aide acceptée contre l'État profond"
 ALG_military_coup_opinion: "Coup d'État militaire en Algérie"
 ALG_fulfilled_election_promise: "Démocratie restaurée comme promis"
 ALG_broke_election_promise: "Promesse d'élections non tenue"
 ALG_mod_name_mediene: "Mohamed Médiène"
 ALG_moi_name_loyalist: "Technocrate loyaliste"
 minister_type_technocrat: "Technocrate"
 minister_type_loyalist: "Loyaliste"
 minister_type_reformist: "Réformiste"
 minister_type_independent: "Indépendant"
 minister_type_military: "Militaire"
 minister_type_civilian: "Civil"
