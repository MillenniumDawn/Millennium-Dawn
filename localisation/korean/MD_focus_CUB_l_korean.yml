 cub_military_coop_with_sov_tt: "러시아는 지난 세기부터 경제와 군사 양면에서 우리의 주요 국제 협력국이었습니다. 미국에 맞서기 위해 러시아와의 협력을 되살려야 합니다."
 cub_military_coop_with_unionstate_tt: "연방 국가는 원래 형태로 러시아와 벨라루스의 연합체이며, 러시아는 언제나 우리를 지지해 온 동맹이었습니다. 우리는 연방 국가와의 협력을 강화해야 합니다"
