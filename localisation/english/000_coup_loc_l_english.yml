l_english:
 # DECISIONS
 coup_initiation_category: "Plotting a Coup Against [ROOT.GetNameWithFlag]"
 coup_initiation_category_desc: "One (or more) interested parties seeks to bring an end to §H[ROOT.show_ruling_party]§! rule within §H[ROOT.GetName]§!, should any one of these decisions be chosen, the plotters and type of coup will be initiated.\n\nWhat comes next will be a mission that will allow you to play out the coup. Will you take over the §Hbroadcast waves§! and announce your intentions? Will you hope the §Hjudiciary§! see reason and choose to declare §H[ROOT.show_ruling_party]§! illegitimate? Will you sway members of the §Hlegislature§! to your side? Or will you simply march right up to the gates of §H[ROOT.GetLeader]'s§! residence with torches in hand and tank treads over cobbles?"


 initiate_military_coup: "Begin Plotting a §HMilitary Coup§!"
 initiate_military_coup_desc: "With the nation in some distress, §H[Nat_Autocracy_L]§! may be \"persuaded\" to take action against the weak governance of §H[ROOT.show_ruling_party]§! and seize control one way or another.\n\nShould §H[Nat_Autocracy_L]§! successfully take power, they will suspend elections. This state will remain pending a reshuffle of power should the new government consider it necessary to the greater aims of a renewed §H[ROOT.GetAdjective]§! state to re-establish democracy.\n\nIf the plot fails however, then they can only hope §H[ROOT.GetLeader]§! is merciful."

 initiate_self_coup: "Begin Plotting a §HSelf Coup§!"
 initiate_self_coup_desc: "Whilst §H[ROOT.show_ruling_party]§! hold much of the existing power within §H[ROOT.GetName]§!, there can always be more power held within our grasp, whether we aim to simply take more of it, or even blame someone else for the coup as a false pretense for the power grab, there's always options."

 initiate_velvet_coup: "Begin Plotting a §HVelvet Revolution§!"
 initiate_velvet_coup_desc: "The people have had enough, but not quite enough to spark protests that mean anything, at least... not yet.\n\nWith some handy planning, organising, and some well placed funds, the people of §H[ROOT.GetName]§! might just get §H[ROOT.show_ruling_party]§! to step aside, or at least set up new elections."


 initiate_palace_coup: "Begin Plotting an §HInternal Coup§!"
 initiate_palace_coup_desc: "Bad blood between partners is not a new story, nor will it ever become an old one, but the bad blood between the current coalition is simply too much to handle for some within the parties that make it up.\n\nOne of these parties has to come out on top, or, failing that, some of the coalition members will have to bleed voters for their insolence.\n\n(You will be able to target one or more of the coalition members in order to push them out of government, be warned, failing to succeed in this plot may result in them gaining popularity instead!)"

 initiate_judicial_coup: "Put a Case Before the §HJudiciary§!"
 initiate_judicial_coup_desc: "Rarely utilised outside of contesting the results of elections, the §HJudiciary§! is a potential route for every aspiring plotter against the government.\n\nWith enough palms greased and some well argued points, we could overturn the last elections, and if successful, ban the party we deemed \"illegitimate\" from even running!"

 initiate_counter_coup: "Begin Plotting a §HCounter Coup§!"
 initiate_counter_coup_desc: "[counter_coup_type]"
 initiate_counter_coup_civ_desc: "The dust has mostly settled, and §H[ROOT.show_ruling_party]§! have come out victorious in the fight to push §H[ROOT.GetName]§! forwards, some parties however, are not willing to accept the rule of §H[ROOT.show_ruling_party]§! and are eager to utilise the confusion still occurring within §H[ROOT.GetAdjective]§! communication lines to their advantage.\n\nSuccessfully engaging in a §HCounter Coup§! will result in the previous party taking back control, with many of the supporters of §H[ROOT.show_ruling_party]§! flipping support as the previous party propagandise the situation to their advantage."
 initiate_counter_coup_mil_desc: "With §H[ROOT.GetName]§! firmly under the grasp of §H[ROOT.GetLeader]§!'s junta government, the largest threat towards the current reign come from within the §H[Nat_Autocracy_L]§! itself.\n\nIf you begin to plot a §HCounter Coup§!, it will result in a member of the §H[Nat_Autocracy_L]§! attempting to take power from §H[ROOT.GetLeader]§!'s hands.\n\nOnce attempted, a §HCounter Coup§! cannot be attempted for many years."

 initiate_foreign_backed_coup_prefix: "Request Coup Support from"
 initiate_foreign_backed_coup_desc_part_1: "Our domestic influence is at all time low, with our own citizens consuming"
 initiate_foreign_backed_coup_desc_part_2: "media of all sorts almost daily. There are many interested parties within"
 initiate_foreign_backed_coup_desc_part_3: "who wish to see §H[ROOT.GetName]§! align closer to their interests.\n\nPerhaps we can reach out through secretive back channels to see if there are anyone within"
 initiate_foreign_backed_coup_desc_part_4: "who might be willing to help us overthrow §H[ROOT.show_ruling_party]§! in exchange for some light exploitation."

 initiate_foreign_backed_top_1_coup: "$initiate_foreign_backed_coup_prefix$ §H[?var:ROOT.influence_array^0.GetNameWithFlag]§!"
 initiate_foreign_backed_top_1_coup_desc: "$initiate_foreign_backed_coup_desc_part_1$ §H[?var:ROOT.influence_array^0.GetAdjective]§! $initiate_foreign_backed_coup_desc_part_2$ §H[?var:ROOT.influence_array^0.GetName]§! $initiate_foreign_backed_coup_desc_part_3$ §H[?var:ROOT.influence_array^0.GetName]§! $initiate_foreign_backed_coup_desc_part_4$"

 initiate_foreign_backed_top_2_coup: "$initiate_foreign_backed_coup_prefix$ §H[?var:ROOT.influence_array^1.GetNameWithFlag]§!"
 initiate_foreign_backed_top_2_coup_desc: "$initiate_foreign_backed_coup_desc_part_1$ §H[?var:ROOT.influence_array^1.GetAdjective]§! $initiate_foreign_backed_coup_desc_part_2$ §H[?var:ROOT.influence_array^1.GetName]§! $initiate_foreign_backed_coup_desc_part_3$ §H[?var:ROOT.influence_array^1.GetName]§! $initiate_foreign_backed_coup_desc_part_4$"

 initiate_foreign_backed_top_3_coup: "$initiate_foreign_backed_coup_prefix$ §H[?var:ROOT.influence_array^2.GetNameWithFlag]§!"
 initiate_foreign_backed_top_3_coup_desc: "$initiate_foreign_backed_coup_desc_part_1$ §H[?var:ROOT.influence_array^2.GetAdjective]§! $initiate_foreign_backed_coup_desc_part_2$ §H[?var:ROOT.influence_array^2.GetName]§! $initiate_foreign_backed_coup_desc_part_3$ §H[?var:ROOT.influence_array^2.GetName]§! $initiate_foreign_backed_coup_desc_part_4$"

 initiate_medical_coup: "Begin Plans to Declare §Y[ROOT.GetLeader]§! Unfit for Office"
 initiate_medical_coup_desc: "§H[ROOT.GetLeader]§! has an infirmity that would, by any reasonable stretch, consider them unfit to serve their position effectively, perhaps our doctors can investigate further and see if they should be removed from office..."

 initiate_putsch_emerging_reactionary: "Begin Plotting a §H[Conservative_L] Putsch§!"
 initiate_putsch_emerging_reactionary_desc: "The people of §H[ROOT.GetName]§! require a strong leader, and §H[ROOT.GetLeader]§! is not that.\n\n§H[Conservative_L]§! will guide our people away from the encroaching changes that make us susceptible to the world's negative influences, or they will die as martyrs.\n\nChoosing this will begin the plot to attempt a §HPutsch§!, success will depend on the size of the battalions of men willing to fight and die for the §H[Conservative_L]§! cause as well as the broader support from the populous."

 initiate_putsch_salafist_jihadi: "Begin Plotting a §H[Caliphate_L] Putsch§!"
 initiate_putsch_salafist_jihadi_desc: "By the grace of Allah the most merciful, the governance of §H[ROOT.show_ruling_party]§! will be brought to heel under the banners of Islam. Their infidel ways will and must change to save their souls for Jannah. The people will surely support our Jihad against §H[ROOT.show_ruling_party]§!, and in fact, pledge their allegiance to §H[Caliphate_L]§!!\n\nChoosing this will begin the plot to attempt a §HPutsch§!, success will depend on the size of the battalions of men willing to fight and die for the §H[Caliphate_L]§! cause as well as the broader support from the populous."

 initiate_putsch_nationalist_fascist: "Begin Plotting a §H[Nat_Fascism_L] Putsch§!"
 initiate_putsch_nationalist_fascist_desc: "The degenerates within the §H[ROOT.show_ruling_party]§! want our great and mighty §H[ROOT.GetName]§! to fall prey to the duplicitous internationalists! Even now, as we speak, they plot against the native §H[ROOT.GetAdjective]§! people, in favour of who? In favour of what? $open_borders$, $international_bankers$ and their $communist_cadres$!\n\nChoosing this will begin the plot to attempt a §HPutsch§!, success will depend on the size of the battalions of men willing to fight and die for the §H[Nat_Fascism_L]§! cause as well as the broader support from the populous."

 initiate_pronouncement_coup: "Begin Plotting a §HPronouncement Coup§!"
 initiate_pronouncement_coup_desc: "Reaching out to party allies within §H[Nat_Autocracy_L]§! will allow the party to declare the upcoming elections to be illegitimate should we happen to lose. The §H[Nat_Autocracy_L]§! will seize power at the polling booth but instead of ruling in a traditional junta, in fact, \"pronounce\" the party the \"real\" winners of the elections.\n\nThis is a §HCoup§! that cannot be delayed, it must go according to plan or else the party you choose to be \"pronounced\" will be banned from contesting the elections and may risk being banned outright."

 initiate_scientist_coup: "Begin Plotting a §HTechnocratic Coup§!"
 initiate_scientist_coup_desc: "The civilian order and its ideas of \"democracy\" have failed §H[ROOT.GetName]§!, the true power of our nation comes from experts within the various sectors that have allowed our nation to survive hardship and in some cases, thrive despite it.\n\nThis is a unique §HCoup§! and will see your §HSpecial Projects§! be delayed massively whilst this is underway, if successful, you will gain large buffs to your scientific and economic abilities, however, democratic backsliding may see various autocratic elements gain from its enactment, whether it succeeds or fails."

 # TOOLTIPS
 may_be_false_prefix: "\n  This may be false due to:"
 can_military_attempt_coup_TT: "§H[Nat_Autocracy_L]§! can attempt a coup[false_trigger_military_coup]"
 can_military_attempt_coup_false_TT: "\n  This may be false due to:\n    - Country Content\n    - Already being ruled by §H[Nat_Autocracy_L]§! (Initiate a §HCounter Coup§! instead!)\n    - Having the §H$no_military$§! idea"


 can_party_attempt_self_coup_TT: "§H[ROOT.show_ruling_party]§! is permitted to attempt a §HSelf Coup§![false_trigger_self_coup]"
 can_party_attempt_self_coup_false_TT: "$may_be_false_prefix$\n    - Not having an §HAutocratic§! ruling party\n    - Country Content"

 can_leader_be_declared_medically_unfit_TT: "§Y[ROOT.GetLeader]§! can be declared medically unfit for office[false_trigger_medical_coup]"
 can_leader_be_declared_medically_unfit_false_TT: "$may_be_false_prefix$\n    - §H[ROOT.GetLeader]§! does not have an infirmity trait"

 can_attempt_fascist_putsch_TT: "§H[Nat_Fascism_L]§! can attempt a §HPutsch§!"
 can_attempt_fascist_putsch_false_TT: "$may_be_false_prefix$\n    - Stability is above §H30%§!\n    - §H[Nat_Fascism_L]§! popularity is under §H5%§!\n    - Country Content"

