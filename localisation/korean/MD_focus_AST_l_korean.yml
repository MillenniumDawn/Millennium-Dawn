 naval_training_exercises_ast: "해군 훈련"
 australia_abbottgov_focus: "애벗 정부"
 tony_abbott_desc: "토니의 경력은 비판을 피해 춤추듯 비켜 가고 그것을 적수에게 퍼붓는 공연이었습니다. 악랄할 만큼 유능한 야당 대표로서 토니는 당을 더 강경한 우파 입장으로 이끌었으며, 세 단어짜리 구호를 대중화하는 데 능했습니다. \n\n런던에서 태어나 시드니에서 로마 가톨릭 신자로 자라고 예수회 교육을 받은 토니는 학창 시절 사제가 되는 것을 최우선으로 삼았습니다. 봉사와 영적 지도에 대한 깊은 열망으로 그는 결국 옥스퍼드 학생으로 영국에 돌아가 복무에 앞서 최대한 많이 배웠습니다. 그러나 선망에도 불구하고 정치를 향한 성향은 결코 그를 떠나지 않았습니다. \n\n집회와 시위를 자주 조직한 그는 옥스퍼드의 좌파 학생 지도부와 대립했고, 이는 폭력적인 충돌로 이어졌습니다. 오스트레일리아로 돌아온 토니는 본래의 뜻대로 1984년 26세의 나이에 사제직에 들어갔습니다. 3년간 복무한 뒤 그는 \\"둥근 구멍에 들어가려는 네모난 못\\"이었음을, 사제직은 자신에게 맞지 않았음을 인정하게 됩니다. \n\n그의 신심으로도 정치의 짜릿함에 대한 애정을 이길 수 없었기에, 토니는 기자로서 더 불리틴에 합류했고 결국 자유당 공보 비서가 되었습니다. 경험 많고 논쟁적인 이 당내 연기자는 이제 나라의 최고 자리에 올랐습니다."
 executive_management_ast: "경영진 관리"
 the_turnbull_government_desc: "이 트리에는 현재 내용이 없습니다. 턴불 국가 중점 트리는 추후 개발될 예정이며, 지금은 이 중점이 임시 자리표시자입니다."
 reconstruction_loans_sol: "재건 대출"
