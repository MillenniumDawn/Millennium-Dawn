 BUL_Anti_tank_1_short: "ATGL-L"
 CAN_Anti_tank_5: "HEL-414"
 CAN_Heavy_Anti_tank_5: "ATCV 슈퍼노바"
 AST_Anti_tank_5: "HEL-414"
 AST_Heavy_Anti_tank_5: "ATCV 슈퍼노바"
 CAN_artillery_5: "M667"
 CHI_Heavy_Anti_tank_3_desc: "HJ-10(또는 \\"붉은 화살 10\\")은 노린코가 개발한 중국의 지상 발사식 대전차 미사일입니다. 탠덤 고폭 대전차(HEAT) 탄두를 갖추고 있습니다."
 CHI_Heavy_Anti_tank_5: "AFT-14"
 CHI_Anti_tank_1_short: "69식"
 CHI_Anti_tank_3_desc: "홍젠-12('붉은 화살-12')는 중국의 3세대 휴대용 발사 후 망각 방식 적외선 유도 대전차 미사일입니다."
 CHI_Anti_tank_5: "HJ-35"
 CHI_artillery_5: "PLL-32"
 CRO_artillery_2: "M-84 노라"
 CZE_Anti_tank_5: "PTŘS-109 판치르"
 CZE_Anti_tank_5_desc: "ATGM-109를 뜻합니다. 선행 미사일을 활용하는 2세대 탠덤 대전차 유도 미사일 설계로(그렇습니다, 선행 탄두 2개와 실제 탄두 1개입니다), 탠덤 탄두가 도달하기 전에 능동 방어 체계를 타격하며 균질압연장갑(RHA) 2500mm를 관통합니다. 탄두 속도는 500m/s로, 3km 거리에서도 적의 능동 방어 체계와 승무원에게 반응할 시간을 거의 주지 않습니다. 이 기동 무기 체계 몇 대를 결합하면 압도적인 수의 대전차 유도 미사일로 어떤 전차도 파괴할 수 있습니다."
 CZE_Heavy_Anti_tank_4_short: "KBVP-ST M2"
 CZE_Heavy_Anti_tank_5: "KBVP-ST 코마르"
 CZE_Heavy_Anti_tank_5_desc: "KBVP 코마르를 기반으로 하며 PTŘS-109 판치르를 장비합니다."
 CZE_artillery_5: "172mm 호브니체 vz. 41"
 CZE_artillery_5_short: "vz. 41"
 CZE_artillery_5_desc: "경이로운 172mm L/43 포 덕분에 단 한 발로 무엇이든 파괴할 수 있는 신구경 곡사포입니다."
