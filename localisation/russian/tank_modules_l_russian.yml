 module_tank_nuclear_engine_gen1: "Ядерный двигатель I"
 module_tank_nuclear_engine_gen1_desc: "Ядерные двигатели обеспечивают генерацию электроэнергии на борту, что позволяет отказаться от использования традиционного топлива и дает возможность бронетехнике работать в течение длительного времени без привязки к топливному снабжению.\n\n§G Подсказка для разработчиков: ядерные двигатели не требуют топлива, но их производство обходится дороже.§!"
