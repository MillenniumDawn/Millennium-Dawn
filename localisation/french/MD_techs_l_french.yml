 module_naval_asw_nuclear_torpedoes_1: "Torpilles nucléaires ASW I"
 module_naval_asw_nuclear_torpedoes_1_desc: "Les torpilles ASM nucléaires combinent des profils de lancement anti-sous-marins et une ogive exceptionnellement puissante pour maximiser la létalité contre les cibles immergées.\n\n§GIndice du concepteur : les torpilles ASM nucléaires offrent une lutte anti-sous-marine exceptionnelle pour détruire les sous-marins détectés. Conviennent aux chasseurs de sous-marins dédiés, mais coûtent plus de CI et de main-d'œuvre que les torpilles ASM conventionnelles.§!"
 module_naval_asw_nuclear_torpedoes_2: "Torpilles nucléaires ASW II"
 module_naval_asw_nuclear_torpedoes_2_desc: "Les torpilles ASM nucléaires combinent des profils de lancement anti-sous-marins et une ogive exceptionnellement puissante pour maximiser la létalité contre les cibles immergées.\n\n§GIndice du concepteur : les torpilles ASM nucléaires offrent une lutte anti-sous-marine exceptionnelle pour détruire les sous-marins détectés. Conviennent aux chasseurs de sous-marins dédiés, mais coûtent plus de CI et de main-d'œuvre que les torpilles ASM conventionnelles.§!"
 module_naval_asw_nuclear_torpedoes_3: "Torpilles nucléaires ASW III"
 module_naval_asw_nuclear_torpedoes_3_desc: "Les torpilles ASM nucléaires combinent des profils de lancement anti-sous-marins et une ogive exceptionnellement puissante pour maximiser la létalité contre les cibles immergées.\n\n§GIndice du concepteur : les torpilles ASM nucléaires offrent une lutte anti-sous-marine exceptionnelle pour détruire les sous-marins détectés. Conviennent aux chasseurs de sous-marins dédiés, mais coûtent plus de CI et de main-d'œuvre que les torpilles ASM conventionnelles.§!"
 module_naval_asw_nuclear_torpedoes_4: "Torpilles nucléaires ASW IV"
 module_naval_asw_nuclear_torpedoes_4_desc: "Les torpilles ASM nucléaires combinent des profils de lancement anti-sous-marins et une ogive exceptionnellement puissante pour maximiser la létalité contre les cibles immergées.\n\n§GIndice du concepteur : les torpilles ASM nucléaires offrent une lutte anti-sous-marine exceptionnelle pour détruire les sous-marins détectés. Conviennent aux chasseurs de sous-marins dédiés, mais coûtent plus de CI et de main-d'œuvre que les torpilles ASM conventionnelles.§!"
 module_naval_recon_drone_1: "Drone de reconnaissance navale I"
 module_naval_recon_drone_1_desc: "Les drones de reconnaissance lancés depuis les navires étendent le regard d'une flotte bien au-delà de l'horizon, offrant une surveillance persistante et une confirmation rapide de cible sans risquer d'aéronefs habités.\n\n§GIndice du concepteur : les drones de recon navale améliorent grandement la détection de surface et de sous-marins tout en renforçant missiles antinavires, attaque de torpille et DCA. Conviennent aux navires de reconnaissance et de ciblage avancés, mais portent des coûts élevés de CI et de puces.§!\n§GIndice concepteur : les drones de recon navale améliorent grandement la détection de surface et sous-marine tout en renforçant missiles antinavires, attaque à la torpille et DCA. Ils conviennent aux navires avancés de reconnaissance et de visée, mais entraînent des coûts élevés en CI et microprocesseurs.§!"
 module_naval_recon_drone_2: "Drone de reconnaissance navale II"
 module_naval_recon_drone_2_desc: "$module_naval_recon_drone_1_desc$"
 module_naval_recon_drone_3: "Drone de reconnaissance naval III"
