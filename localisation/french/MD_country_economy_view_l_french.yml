 increases_cb_rate_tooltip: "Raise the §YPolicy Rate§! by 1pp, tightening monetary conditions.\n\n§YEffects:§!\nQuarterly inflation suppressed by an additional §G0.2%§! per quarter\nInflation carried into the next quarter cut by §G2.5pp§!\nSovereign debt interest rate increased by §R0.5pp§!\nMonthly §YCurrency Strength§! pressure raised by §G0.001§! (while the rate is between 9pp below and 6pp above inflation)\n\n§YPrerequisites:§!\n£pol_power_icon §Y25§! Political Power\nPolicy Rate below 20%\nNo rate change in the last 30 days"
 decreases_cb_rate_tooltip: "Lower the §YPolicy Rate§! by 1pp, easing monetary conditions.\n\n§YEffects:§!\nQuarterly inflation suppressed by §R0.2%§! less per quarter\nInflation carried into the next quarter raised by §R2.5pp§!\nSovereign debt interest rate reduced by §G0.5pp§!\nMonthly §YCurrency Strength§! pressure lowered by §R0.001§! (while the rate is between 9pp below and 6pp above inflation)\n\n§YPrerequisites:§!\n£pol_power_icon §Y25§! Political Power\nPolicy Rate above 0%\nNo rate change in the last 30 days"
