 preah_vihear_news.4.t: "Une victoire décisive à Preah Vihear"
 preah_vihear_news.4.d_sia: "La Thaïlande a remporté une victoire décisive dans l'épreuve de longue haleine de Preah Vihear, forçant le Cambodge à une reculade diplomatique humiliante. Aucun territoire n'a changé de mains, mais Bangkok célèbre l'épreuve comme un triomphe national."
 preah_vihear_news.4.d_cbd: "Le Cambodge a remporté une victoire décisive dans l'épreuve de longue haleine de Preah Vihear, forçant la Thaïlande à une reculade diplomatique humiliante. Aucun territoire n'a changé de mains, mais Phnom Penh célèbre l'épreuve comme un triomphe national."
 preah_vihear_news.4.o1: "Une rivalité tranchée, pour l'instant"
 SIA_preah_vihear_vindicated: "Justification de Preah Vihéar"
 SIA_preah_vihear_vindicated_desc: "La Thaïlande a sécurisé le terrain contesté autour du complexe du temple, et le gouvernement jouit du dividende politique d'un litige frontalier de longue date réglé à ses conditions."
 SIA_preah_vihear_humiliation: "Humiliation à Preah Vihéar"
 SIA_preah_vihear_humiliation_desc: "Le Cambodge contrôle désormais le terrain contesté autour de Preah Vihear, et la perte est ressentie sur tout l'éventail politique comme un échec à la fois diplomatique et militaire."
