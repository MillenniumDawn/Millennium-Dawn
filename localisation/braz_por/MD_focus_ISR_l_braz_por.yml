 israel.149.t: "A Questão da Histadrut"
 israel.149.d: "Nosso partido há muito apoia vários sindicatos trabalhistas, as chamadas Histadruts, em nosso país. No entanto, sua influência diminuiu significativamente nos últimos tempos devido a circunstâncias sociopolíticas.\n\nA questão é: devemos apoiar a retomada das Histadruts ou ficar ao lado da indústria de alta tecnologia, em desenvolvimento recente, com a qual podemos ter relações produtivas?"
 israel.149.a: "Vamos restaurar a antiga glória dos Sindicatos Trabalhistas!"
 israel.148.b: "Conquistar os clérigos."
 no_eff_in_focs_tt: "§RNão poderemos aumentar a opinião da Histadrut por meio de focos, exceto os do Partido Trabalhista!§!"
