 medium_tank_chassis: "주력전차"
 medium_tank_chassis_desc: "주력 전차(MBT)는 전투 전차 또는 범용 전차라고도 하며, 많은 현대 군대에서 장갑으로 방호되는 직사 및 기동 역할을 수행하는 전차입니다."
 medium_tank_artillery_chassis: "자주포"
 medium_tank_artillery_chassis_desc: "자주포는 목표를 향해 이동할 수 있도록 자체 추진 체계를 갖춘 포병입니다. 대형 곡사포, 야포, 박격포 또는 어떤 형태의 로켓이나 미사일 발사기를 탑재한, 보통 무한궤도 기반의 고기동 차량입니다."
 medium_tank_amphibious_chassis: "병력수송장갑차(APC)"
 medium_tank_amphibious_chassis_desc: "장갑차(APC)는 전투 지역에서 인원과 장비를 수송하도록 설계된 장갑 군용 차량의 광범위한 유형입니다. 제1차 세계 대전 이래 장갑차는 전 세계에서 매우 흔한 군사 장비가 되었습니다."
 medium_tank_flame_chassis: "보병전투차(IFV)"
 medium_tank_flame_chassis_desc: "보병 전투차(IFV)는 기계화 보병 전투차(MICV)라고도 하며, 보병을 전투로 수송하고 직사 지원을 제공하는 데 사용되는 장갑 전투 차량의 일종입니다."
 medium_tank_destroyer_chassis: "경전차"
 medium_tank_destroyer_chassis_desc: "기갑 정찰은 전차와 바퀴형 또는 무한궤도형 장갑 정찰 차량을 사용하는 병사들이 지상 정찰과 기갑전을 결합한 것입니다."
 medium_tank_aa_chassis: "자주대공포"
 medium_tank_aa_chassis_desc: "자주 대공포(SPAAG) 또는 자주 방공 체계(SPAD)라고도 하는 대공 차량은 전용 대공 능력을 갖춘 기동 차량입니다."
 heavy_tank_chassis: "공격 헬리콥터"
 heavy_tank_chassis_desc: "공격 헬리콥터는 공격기의 주요 임무를 수행하는 무장 헬리콥터로, 적 보병과 장갑 전투 차량 등 지상 표적을 교전할 수 있는 능력을 갖추고 있습니다. 중무장 때문에 때로는 헬리콥터 건십이라고도 불립니다."
