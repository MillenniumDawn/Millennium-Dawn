 name_of_corp_tt: "§Y[name_of_corp]§!"
 PMC_blackwater_name_desc: "§Y블랙워터§!는 1996년 말에 전직 미 해군 SEAL인 에릭 프린스(Erik Prince)에 의해 설립된 미국의 민간 군사 계약업체입니다. 이 회사는 법 집행 훈련, 근접 전투 훈련, 보안 서비스 등 다양한 서비스를 제공합니다."
 PMC_aegis_name_desc: "§YAegis§!, fully Aegis Defence Services, is a British private military company founded by Tim Spicer who was previously CEO of Sandline International with co-founders Jeffrey Day, Dominic Armstrong, and Mark Bullough. Some of the services provided are security services, law enforcement training, and logistical support and reconstruction efforts."
 PMC_constellis_name_desc: "§YConstellis Holdings§! is the name of the American-based private military company formed from a merger of Blackwater and Triple Canopy."
 PMC_wagner_name_desc: "§Y바그너§!는 공식적으로 바그너 그룹로 알려진 러시아 정부가 자금을 지원하는 민간 군사 계약자로, 프리고진에 의해 설립되었습니다. 바그너은 특히 전투 부대를 위한 수감자 모집으로 유명하며, 전 세계 여러 국가에서 작전을 수행하고 있습니다."
 PMC_md_name_desc: "§YMD Military Bois§!의 민간 군사 회사는 21세기 중에 형성되었습니다. 그들의 기원은 알려지지 않았으나, PMC의 구성원들은 미국, 스위스, 독일, 중국, 러시아 등 다양한 국가 출신으로, 이를 통해 이들은 전 세계 무대에서 가장 장비가 다양하고 다민족적인 PMC 중 하나로 꼽힙니다. 이들은 높은 사기, 조정력, 다양한 무기 플랫폼을 활용할 수 있는 능력 덕분에 고용하기에 가장 우수한 용병들 중 일부로 널리 여겨지고 있습니다."
 PMC_mpri_name_desc: "§YMPRI§! (a.k.a §YL3-MPRI§!) is an American-based global Private Military Contractor founded in 1987 by eight former senior military leaders of the American military, including Carl Vuono, a former Army Chief of Staff. The company provides a multitude of different services ranging from logistics, military training, law enforcement training, aircraft modernization and maintenance, electronic systems, and electronic warfare. It played an active role in Operation Desert Storm and shortly thereafter became a world-renowned global PMC with contracts in nations such as Croatia, Bosnia, Equatorial Guinea, Colombia and more."
 PMC_sadat_name_desc: "§YSADAT 스페셜리스트§!는 이스탄불에 본사를 둔 터키의 민간 군사 회사입니다. 2012년에 설립된 이 회사는 중동 지역에서 군사, 군수 조달, 방위 컨설팅 등 다양한 계약자 서비스를 제공합니다."
 PMC_rsb_name_desc: "§YRSB-그룹§!은 다양한 서비스를 제공하는 러시아 기반의 군사 컨설팅 회사로, 주로 전투 병력, 훈련, 물류, 그리고 잘 훈련된 장교단을 제공합니다."
 PMC_sandline_name_desc: "§Y샌드라인§!은 1990년대 팀 스파이서에 의해 설립된 런던 기반의 PMC입니다. 샌드라인은 90년대 여러 분쟁에 참여했으며, 그 중 하나는 파푸아뉴기니에서 발생한 분쟁입니다. 다른 PMC들과 마찬가지로 샌드라인은 군사 훈련, 보안 경호와 같은 서비스를 제공했으며, 특히 계약자들에게 장비 및 무기 조달, 외교적 지원을 포함한 운영 지원을 제공하는 독특한 방식으로 운영되었습니다."
 PMC_kbr_name_desc: "§YKBR 로지스틱§!은 물류 기반의 민간 군사 계약자로, 주로 미국과 다른 NATO 및 NATO 동맹 파트너들에게 물류 지원에 참여한 것으로 가장 잘 알려져 있습니다."
 PMC_nirtal_name_desc: "§YNirtal 스페셜리스트§!는 1995년에 설립된 글로벌 민간 보안 회사로, 전투 훈련, 근접 보호 서비스 및 보안 컨설팅을 전문으로 합니다."
 PMC_halo_name_desc: "§YThe Halo Trust§!는 1988년에 설립된 비영리 인도주의 조직으로, 전쟁으로 파괴된 지역에서 안전하고 효과적인 방식으로 지뢰를 제거하는 일을 전문으로 합니다. 이들은 정부에 지뢰 제거 작업을 계속할 것을 촉구하여 미래 세대의 안전을 보장하려고 합니다. 그들의 작업은 모잠비크, 코소보, 소말리아, 아프가니스탄 등 많은 국가에서 이루어졌습니다."
 PMC_defense_name_desc: "§Y데팡스 콩세유 앵테르나시오날§!은 프랑스의 군사 지식, 훈련 및 기술 지원을 국제적으로 수출하는 것을 주된 목적으로 하는 여러 전직 보안 단체가 2000년에 합병하여 설립되었습니다."
 PMC_gardaworld_name_desc: "§Y가르다월드§!는 스테판 크레티에가 설립한 캐나다의 민간 경비 업체로, 전 세계에서 경비 서비스와 현금 수송 서비스를 운영합니다. 이 회사는 전 세계 여러 국가와 계약을 맺고 대사관, 은행, 정부 건물 및 기타 장소에 경비 서비스를 제공해 왔습니다."
 PMC_esa_name_desc: "§Y유럽 보안 아카데미§!는 1992년 안제이 브릴이 설립했으며 해상 방호, 응급 처치, 사격 등의 서비스를 제공합니다. 또한 이 회사는 유럽 연합 내 경찰과 군 병력은 물론 §Y[EUU.GetFlag][EUU.GetName]§!의 수많은 특수 부대를 훈련시켰습니다."
 PMC_g4s_name_desc: "§YG4S§!는 §Y세큐리코어§!와 §Y그룹 4 팔크§!의 합병으로 탄생한 런던 기반의 다국적 민간 경비 업체입니다. 이 회사는 경비 인력, 대응 부대, 수감자 보안 호송 등 다양한 서비스를 제공합니다. 유럽과 아프리카에서 매출과 고용 규모 모두 세계 최고 수준의 민간 경비 업체 중 하나가 되었습니다."
 PMC_asgard_name_desc: "§Y아스가르드 - 독일 보안 그룹§!은 2007년에 설립된 독일의 민간 군사 기업입니다. 전투와 훈련 등을 전문으로 하는 민간 군사 기업입니다."
 PMC_sinai_name_desc: "§Y시나이 부족 연합§!은 이집트 북시나이 주의 준군사 조직으로, 이 지역에서 이집트 보안군과 나란히 싸워 왔습니다. 이 조직은 주로 지역 베두인 부족 출신들로 구성되어 있습니다. 이 조직은 반군에 맞서는 효과적인 전력이 되었으며, 조직화된 전문 군사 병력과 함께 협동하여 싸우고 있습니다."
 PMC_gard_name_desc: "§Y가르드세르비스§!는 2020년에 설립된 벨라루스 기반의 보안 조직으로, 주로 아프리카와 남아메리카 국가를 비롯한 다른 나라의 특수 보안군을 보유하고 훈련시키기 위해 벨라루스 정부의 지원을 받습니다. 흔히 러시아 기반의 민간 군사 기업 바그너 그룹과 비교되며, 구조와 목적도 유사합니다."
 PMC_patriot_name_desc: "§Y패트리어트§!는 2018년 말에 §Y바그너 그룹§!보다 더 정예화된 형태로 만들어진 러시아의 민간 군사 기업입니다. 이들은 개인 경호에 더 중점을 두며 전투 경험이 있는 숙련된 군인들만을 더욱 엄격하게 채용합니다."
 PMC_dewe_name_desc: "§Y데웨 시큐리티 서비스§!는 전직 군인과 경찰관들이 2011년에 설립했으며 2008년 베이징 올림픽에서 처음 활동했습니다. 이들은 다양한 민간 경찰력의 훈련에 자주 관여하며, 아프리카, 아시아, 중동의 중국 투자에 보안을 제공하는 중국 일대일로 구상의 일부입니다."
 PMC_over_name_desc: "§Y차이나 오버시즈 그룹 시큐리티§!는 해외 국가들과 긴밀히 협력하여 중국과 주재국의 이익을 보호하기 위한 목적으로 설립된 국가 후원 중국 경비 업체입니다. 이들은 서비스 비용을 지불하는 국가에 훈련, 방호, 경비 등 다양한 서비스를 제공합니다."
 PMC_front_name_desc: "§YFront§! (or §YFrontier Services Group§!) is a Chinese state-owned private security organization headquartered in [HKG.GetNameWithFlag]. It is an Africa-focused security, aviation, and logistics company founded by the former §YBlackwater Worldwide§! CEO Erik Prince. The company focuses primarily on logistical projects for shipping routes, security without the use of arms, and anti-terrorist security training. Furthermore, the company also specializes in high-risk evacuations from conflict zones."
 PMC_redut_name_desc: "§Y레두트§!는 여러 평화 유지 및 군사 임무에서 전투 경험을 쌓은 다양한 러시아 군 퇴역 군인들과 국방부 부대가 2008년에 합병하여 설립되었습니다."
 PMC_gazprom_name_desc: "§Y바그너 PMC§!가 해체된 이후 §Y가스프롬§!은 자사 시설을 보호할 수 있도록 자체 민간 경비 조직을 설립했습니다. §Y가스프롬§!은 특히 러시아 국방부와 계약하여 석유 및 가스 이권을 보호하기도 합니다."
 PMC_iron_name_desc: "§Y아이언 네이비§!는 에스토니아 기반의 민간 군사 기업으로, 다양한 방호 서비스와 요트 보안 서비스를 제공합니다."
 PMC_sheriff_name_desc: "§Y셰리프§!는 트란스니스트리아에서 두 번째로 큰 기업이며 수익성 있는 모든 민간 사업을 아우릅니다. 이들은 주유소, 슈퍼마켓, TV 채널, 자동차 대리점, 호텔 등에 관여하고 있습니다. 이 보안 조직은 이 거대 기업의 또 다른 수입원으로서 설립되었습니다. 이 회사는 다양한 계열사에 경비 서비스를 제공하며 국제적으로도 서비스를 제공해 왔습니다."
 PMC_lukoil_name_desc: "§Y루크오일§!은 전투와 경호, 정보 수집에 중점을 둔 PMC를 설립했습니다. 루크오일이 후원하는 PMC는 전직 KGB 요원들과 연관된 것으로 여겨집니다."
 PMC_rosneft_name_desc: "러시아의 또 다른 석유 대기업인 §Y로스네프트§!는 경비 병력에 중점을 둔 또 다른 군사 기업의 설립에 주력했습니다."
 PMC_sberbank_name_desc: "§Y스베르뱅크§!는 러시아 정부의 요청으로 주로 전투와 경비 병력에 중점을 둔 군사 기업을 설립한 러시아의 국영 은행입니다."
 PMC_vtb_name_desc: "§YVTB§!는 아르카디 로텐베르크의 도움으로 콘보이라는 이름의 군사 기업을 설립한 러시아의 국영 은행입니다. 다른 러시아 민간 군사 기업과 마찬가지로 이 회사는 전투 및 경비 병력을 제공하는 것을 목표로 하는 군사 및 경비 서비스에 중점을 둡니다."
