 # French Focus Tree
 france_focus: "French Focus Tree"

 # Faction Names
 Francosphere: "Francosphere"
 Continental_system: "Continental System"
 Holy_league: "Holy League"
 world_revolution_commune: "World Revolutionary Commune"

 # Political Spectrum
 FRA_state_of_french_politics: "State of French Politics"
 FRA_state_of_french_politics_desc: "The country of France is in one of the world's most interesting - and volatile positions. For a long time, our Fifth Republic was a model of stability, with power alternating between a socialist bloc and a conservative bloc. But as we move into this new millennium, the situation is becoming increasingly unclear. Some parties are emerging whilst others are collapsing; no one can say where the coming years will take us."
 FRA_PS: "The socialist party"
 FRA_PS_desc: ""
 FRA_UDF_LREM: "UDF LREM"
 FRA_UDF_LREM_desc: ""
 FRA_LR: "LR"
 FRA_LR_desc: ""
 FRA_RPF: "RPF"
 FRA_RPF_desc: ""
 FRA_FN: "FN"
 FRA_FN_desc: ""
 FRA_LFI: "LFI"
 FRA_LFI_desc: ""
 FRA_EELV: "EELV"
 FRA_EELV_desc: ""
 FRA_PCF: "PCF"
 FRA_PCF_desc: ""
 FRA_friend_eu: "Befriend EU"
 FRA_friend_eu_desc: "The European Union is home to many nations led by parties similar to our own. We should use this ideological convergence to highlight our pro-European stance as a bulwark against nationalism."
 FRA_eternal_challenge: "The Eternal Challenger"
 FRA_eternal_challenge_desc: "For decades, we have been the only party to fight both on the streets and in parliament to defend workers. Our enemies are clear: the right wing and the extremists. The people know they can trust us to stand up to them .Our enemies don't sleep, we must remember that. United we can scare off any threat."
 FRA_eu_federalism: "EU Federalism"
 FRA_eu_federalism_desc: "Other nations must remember the values we stand for as the European Union. To protect them, to develop them, to spread them among other nations of the Europe."
 FRA_let_industry: "Let The Industry Go"
 FRA_let_industry_desc: "Heavy industry is a waste of time and energy; it is no longer productive enough in a globalised economy such as ours. We must not stand in the way of its relocation to the world's new industrial centres. Instead, we should turn our attention to a new form of economy: the service sector.The offices will become our new main interest for the upcoming years. By prioritizing them we can reduce unemployment and increase income they will start generating."
 FRA_finance_minister: "A New Economic Policy"
 FRA_finance_minister_desc: "In a world undergoing transformation, we too must evolve and shift our economic focus. Economic crises have highlighted the limitations of Keynesian economics, so we must change the way we think. Consequently, we have to choose our next economy program for the finance sector. It will allow us to reduce some spendings, the only question is, who will we trust?"
 FRA_atlantist_drift: "Atlantic Drift"
 FRA_atlantist_drift_desc: "NATO is the strongest currently existing alliance. If we want to keep that true, we have to increase trainings quality of our armies."
 FRA_greece_eurozone: "Greece in the Eurozone"
 FRA_greece_eurozone_desc: "Greece is known for its debt problems. We can aid them with some money to show them that countries withing European Union really care about each other."
 FRA_tax_evasion: "Fight Tax Evasion"
 FRA_tax_evasion_desc: "There are too many people who continue to avoid paying tax through various schemes; we must put a stop to this because we have committed to doing so."
 FRA_liberal_turn: "Liberal Turn"
 FRA_liberal_turn_desc: "For far too long, we have tried to control the economy and the financial sector, but in a globalised world, it is becoming increasingly difficult to control the flow of capital. So we should let the market regulate itself – what could possibly go wrong?"
 FRA_ease_interventionism: "Ease Interventionism"
 FRA_ease_interventionism_desc: "We should focus on improving diplomatic relations in Europe, not send our people to fight someones other war. Europe is currently a continent of peace and as a major regional power we should give everyone a good example."
 FRA_modern_interest: "Modern Interest"
 FRA_modern_interest_desc: "For far too long, we have spent our time defending an unproductive class that is perpetually in crisis. It is high time we looked to the future, and the future lies in services and technology."
 FRA_cut_with_unions: "Cut With Unions"
 FRA_cut_with_unions_desc: "The Labour Unions stopped being as useful for our country as they were earlier. We should no longer give in to their demands. After all, we are not their hostages."
 FRA_vigipirate: "Reinforce Security"
 FRA_vigipirate_desc: "Mission Vigipirate will be our national security and anti-terrorism alert system. It is supposed to be a permanent mechanism involving the government, armed forces, local authorities, and citizens designed to anticipate, prevent, and protect our country against terrorist threats."
 FRA_not_done: "We Are Not Done Yet"
 FRA_not_done_desc: "Despite our desperate situation and the storm our party is weathering, there remains a glimmer of hope; we can still choose to fight for socialism and for France."
 FRA_meet_friends: "Meeting With Friends"
 FRA_meet_friends_desc: "It's a good time to arrange a meeting with other socialist countries to discuss about current world situation and the path for socialism. "
 FRA_turn_ecology: "Turn to Ecology"
 FRA_turn_ecology_desc: "Our new millennium is characterised by the growing threat of climate change and its disastrous consequences in France. A large proportion of young people are in favour of environmental action; we should make headway in this area to show that we are not lagging behind on this issue."
 FRA_military_coop: "Military Co-op"
 FRA_military_coop_desc: "Continuing our close-up with NATO we should encourage other countries to perform with us a new military training. Everyone can benefit from it and it will show our enemies how united and ready we are."
 FRA_party_unity: "Party Unity"
 FRA_party_unity_desc: "We couldn't pass all these acts and ideas without our glorious politicians. Together we are family, so let's treat each other like part of a big family."
 FRA_strenght_throught_EU: "Strengthen Through EU"
 FRA_strenght_throught_EU_desc: "EU stands for democratic values, so do we. It should be our strongest reason to keep this organization alive, strong and stable. If the EU will fall, the Europe may become once again divided."
 FRA_stole_voter: "Reconnect With Our Electorate"
 FRA_stole_voter_desc: "Our party is gradually regaining its strength, and we now have the opportunity to strike back at those who led our voters to believe they were more sincere than we are. They are nothing but liars and extremists.. We guarantee stability and democracy for our country. We have to target the lies of other parties."
 FRA_ps_lgbt: "Ensure LGBT Rights"
 FRA_ps_lgbt_desc: "Everyone should feel comfortable in our country, no matter the orientation. Discrimination should be problem of the past, not the present."
 FRA_ps_win: "Socialism Has Been Saved"
 FRA_ps_win_desc: "We've done it! We've achieved the impossible. After narrowly avoiding collapse and a humiliating defeat at the hands of the French and in the eyes of history, we've managed to turn things round. Our opponents thought we were finished, but we managed to win back our electorate and steer them away from the siren calls of extremism. Our victory is a sign of socialism's stability throughout the world. But our victory is only the beginning; armed with this experience, we will not make the same mistakes a second time."
 FRA_Neither_right_nor_left: "Neither Right Nor Left"
 FRA_Neither_right_nor_left_desc: "The best way to develop country is by striving from any controversial opinions. Let's sit in the bubble of centre, not too far right, not too far left."
 FRA_Get_indecisives: "Get Indecisives"
 FRA_Get_indecisives_desc: "There are still people who cannot find any suitable party to support. They don't have to look anymore when they have us."
 FRA_abolish_ISF: "Abolish ISF"
 FRA_abolish_ISF_desc: "France's traditional Solidarity Tax on Wealth (ISF) is an outdated method of tax management. We will suffer a little but very soon we will start beneficing from much better strategy plan."
 FRA_Fight_Deficit: "Fight Deficit"
 FRA_Fight_Deficit_desc: "Our debt is high. We have to fight it no matter the cost if we don't want to drown in debts we cannot pay for. The people surely will understand these necessary actions."
 FRA_Reconize_Mistakes: "Recognize Mistakes"
 FRA_Reconize_Mistakes_desc: "Previous French leaders had a very unpleasant ways to treat the colonial nations. We have to finally set things right by paying for their actions. Let this chapter in our history finally close."
 FRA_Western_policy: "Western Policy"
 FRA_Western_policy_desc: "The European Union and the USA are the very things that keep Europe safe and stable. Turning against them would be stupid, so we have to do everything to not make them turn against us."
 FRA_independant_Euro: "Independent Europe"
 FRA_independant_Euro_desc: "Other countries must know that in united Europe we don't want to seek their excissive influence affecting stability of our countries. Alone, some of us may be vulnerable, but together we must be strong enough to get rid of those problems."
 FRA_reduce_tax: "Reduce Tax"
 FRA_reduce_tax_desc: "Excessive taxes discourage those in work, whilst those not in work benefit from the proceeds for free. We must reverse this trend."
 FRA_increase_pension_age: "Increase Pension Age"
 FRA_increase_pension_age_desc: "People may not like it but as the life becomes longer thanks to new breakthrough in medicine we must continue to fund our social welfare system. However, with fewer and fewer young people to fund the pensions of an ever-growing number of older people, we have no choice. We must make the working population work for longer to compensate for this lack of generational renewal."
 FRA_growing_tensions: "Growing Tensions"
 FRA_growing_tensions_desc: "Our world is becoming less and less safe, and we may see war return to Europe. To ensure we are not caught off guard, we must prepare for it."
 FRA_befriend_china: "Befriend China"
 FRA_befriend_china_desc: "China is a major trading partner of France; it is very much in our interests to negotiate favourable treaties with them."
 FRA_nuclear_eu: "Nuclearise the EU"
 FRA_nuclear_eu_desc: "We have a great deal of expertise in the nuclear sector. The rest of the European Union does not make use of it because they fear the consequences of its misuse. We would do well to teach them how to use it in order to build the European Union's energy independence."
 FRA_reise_tertiary: "The Rise of Tertiary"
 FRA_reise_tertiary_desc: "Today's Western economy is a service-based economy that brings together the various players involved in production. France must play its part in this economic transition; there is no other way."
 FRA_reduce_public_service: "Reduce Public Service"
 FRA_reduce_public_service_desc: "By cutting some government spendings we will be able to once again reduce our debt. People will hate it but we have to choose lesser evil. If the country will fall because of the debt, some decreased socials will be the least of their problems."
 FRA_strat_indus: "Funding Our Strategic Industries"
 FRA_strat_indus_desc: "Even though our industries are no longer as competitive as they once were, there are certain industries we cannot do without. The defence industry is one of them, as we cannot rely on other countries for our defence. France has always produced its own weapons. It is therefore of the utmost importance that this continues to be the case, particularly in a world where tensions are rising."
 FRA_arms_deal: "Increase Arms Exports"
 FRA_arms_deal_desc: "It is common knowledge that our military-industrial complex produces excellent weapons. As such, we have been one of the leading arms exporters for many years. This arms trade enables us not only to project our power internationally, but also to gain a great deal of money and influence. It can therefore only be a good thing."
 FRA_eu_mil: "Assist EU Military Buildup"
 FRA_eu_mil_desc: "Whilst our country is relatively well prepared to cope with the return of war to Europe, the same cannot be said of all our European partners. The majority of them stand no chance of putting up a fight. We should help them to develop their capabilities, as their security is our own."
 FRA_finance_student: "Finance Best Student"
 FRA_finance_student_desc: "By applying the neoliberal formula to perfection, our economy has never been so closely integrated into international dynamics. This is a good thing, as it will enable us to benefit from other countries' progress and invest all over the world to reap the rewards."
 FRA_right_left_money: "The Very Centre"
 FRA_right_left_money_desc: "For too long, our country has been held hostage by the left-right divide. Following all our advances in finance and geopolitics, we have demonstrated the power of ordoliberalism. Our role is to enable the market to flourish in France, and to allow the French people to benefit from the wealth that this generates."
 FRA_demograph_arms: "Promoting Demographic Rearmament"
 FRA_demograph_arms_desc: "A good population growth campaign is a long-term investition in future of our country."
 FRA_share_eu: "Share Our Power With the EU"
 FRA_share_eu_desc: "Our enemies must know we are very serious about protecting independence of the European Union countries. If it will be necessary, we will threat any oppressor with our nuclear weapon."
 FRA_handle: "Handle the Situation"
 FRA_handle_desc: "The situation in our country is slightly getting out of hand. Because of the bold choices we have made to tackle the debt People may revolt against us. This cannot happen, the immediate increase in police forces must be implemented if we want to restore order on the streets."
 FRA_startup_nation: "Startup Nation"
 FRA_startup_nation_desc: "Thanks to our bold policies and our refusal to back down in the face of these recalcitrant Gauls, we have achieved our goal. We have succeeded in transforming a society that was hostile to entrepreneurship, one that used to burden them with taxes and regulations. A bright future of innovation lies ahead for us, a future of innovation and liberalism. Because that is our vision!"
 FRA_Neo_gaulism: "Neo-Gaulism"
 FRA_Neo_gaulism_desc: "Neo-Gaullism is a French political movement that adapted the original principles of General Charles de Gaulle. He emphasized national sovereignty, a strong executive presidency, and foreign policy independence to fit the modern, globalized era."
 FRA_known: "The Inevitable Parti"
 FRA_known_desc: "Ever since the founding of the Third Republic and the emergence of a stable form of republicanism, there have always been conservatives. We are simply their latest incarnation. For decades, we have been present in every second round of elections. There is no reason why the next elections should be any different. Our new millennium is full of uncertainties, so we must be the voice of stability and common sense in the face of extremists."
 FRA_oppose_immigration: "Oppose Immigration"
 FRA_oppose_immigration_desc: "Immigrants already proven how dangerous they can be, especially from the regions of endless wars. We must take action to prevent them from arriving."
 FRA_continue_liberal: "Continue Liberal Policies"
 FRA_continue_liberal_desc: "We will continue implementing our program of economic liberalisation. Because this is how the economy work the best."
 FRA_patriotism: "Patriotism"
 FRA_patriotism_desc: "French people should be proud of their nationality and history that comes with it. As a result, they must get used to asking less of the state. We can no longer afford the generosity of the past. They must learn to side with the state and stop constantly demanding more public money."
 FRA_turn_west: "Turn West"
 FRA_turn_west_desc: "We should improve our relations with the overseas friends in America. The politicians are different and we have to ensure that none of them will ever turn their back against France."
 FRA_third_voice: "The Third Voice of France"
 FRA_third_voice_desc: "In a world still divided between NATO and the remnants of the USSR, France must chart its own course, as it has always done. We cannot rely on a distant ally that would not come to our defence; we must therefore forge our own destiny alongside those who reject oppression from either the East or the West."
 FRA_austerity: "Use Austerity"
 FRA_austerity_desc: "The government is spending far too much; this is one of the reasons for our excessive debt. We must cut our spending as a matter of urgency."
 FRA_question_ref: "Accelerating European Integration"
 FRA_question_ref_desc: "Although France is one of the founding pillars of the European Union, its people are now among the most sceptical towards it. The French have repeatedly opposed the introduction of new treaties. We should stop asking them for their opinion on every single issue, as this significantly slows down the process of European integration. Many will take this badly and become even more opposed to the European Union, but at least we will stop being the ones holding the European Union back."
 FRA_nato_integration: "NATO Integration"
 FRA_nato_integration_desc: "Another step to improve our safety on this continent. Without NATO who knows in what state the Europe would be today."
 FRA_national_indep: "National Independence"
 FRA_national_indep_desc: "By adopting a position somewhere between East and West, France can defend its own interests and no longer has to take the views of a bureaucrat in Washington into account."
 FRA_end_proximity_police: "End Proximity Police"
 FRA_end_proximity_police_desc: "The police should not be mixed up with the people they are supposed to be keeping an eye on. A rapid-response police force would be more cost-effective."
 FRA_reform_wealth: "Reform the Welfare State"
 FRA_reform_wealth_desc: "For far too long, France has been a welfare state; it is time for the French to fend for themselves without always relying on public money."
 FRA_looming_crisis: "The Looming Crisis"
 FRA_looming_crisis_desc: "Our active deregulation of the economy could have disastrous consequences for our country. In a globalised economy, we are not immune to anything. Perhaps we should monitor transactions more closely to limit the impact of a crisis."
 FRA_defend_interest: "The Defense of France's Interests"
 FRA_defend_interest_desc: "Being independent means we must protect ourselves from foreign influence, both in our own country and wherever we have interests. We must take steps in this direction to ensure that France remains a great nation."
 FRA_lower_expanse: "Stop Funding Unproductive Businesses"
 FRA_lower_expanse_desc: "Subsidising economic activity comes at a cost that is becoming increasingly significant. We should take a close look at our spending and only subsidise efficient and competitive industries."
 FRA_oppose_lgbt: "Act Against Wokeism"
 FRA_oppose_lgbt_desc: "Trends of thought that are increasingly hostile to traditional norms are seeping into our society. These norms exist for a reason and have always prevailed. We must prevent this infiltration."
 FRA_return_rurality: "Embrace Rurality"
 FRA_return_rurality_desc: "Major cities are increasingly becoming hotbeds of decadence and crime. We must encourage our citizens to move away from them and towards regions which, whilst admittedly less prosperous, are closer to common sense."
 FRA_end_assisted: "End the Culture of dependency"
 FRA_end_assisted_desc: "Far too large a proportion of our population relies on unconditional benefits that have been granted to them without them having to do any work. This situation is unacceptable and is placing a strain on our finances. We must put an end to these benefits; this will get people into work."
 FRA_hostile_bear: "Hostility to the Bear"
 FRA_hostile_bear_desc: "Russia is once again becoming a threat to European interests and safety. First-line countries must begin preparations to defend themselves in case of any hostile action from the east."
 FRA_wake_up: "Wake France Up"
 FRA_wake_up_desc: "Freed from decadence and the temptations of inaction, the French people can get back to work."
 FRA_eternal_france: "Eternal France"
 FRA_eternal_france_desc: "We have made our country stronger than ever before. We increased our own protection from foreign threats, reduced internal problems and decreased our debt problems. We have secured a future for our country. France has always been there and always will be."
 FRA_enought_soc: "Enough of Socialism"
 FRA_enought_soc_desc: "As a conservative party, the Progressives and the Socialist Party are our main opponents. They advocate a liberal Europe – precisely what people no longer want, and we will work to free ourselves from it. We must show the people that we are, and always will be, the instrument through which their desire for stability and protection are realised. We are against the liberal Europe Union and progressivism."
 FRA_sovereignism: "Question Our Sovereignty"
 FRA_sovereignism_desc: "For far too long, the French people have been disregarded; no one in our country wanted the European Union to grow to such proportions. Whether it was treaties or enlargement, the people were sceptical every time, and every time they were ignored. It is time for a party to raise the issue of France's sovereignty once again."
 FRA_sacrifice: "Necessary Sacrifice"
 FRA_sacrifice_desc: "We are heading into difficult times, and the difficult path that lies ahead will require discipline and goodwill on the part of the French people. The French must learn once again that it is up to them to make sacrifices for France, and not the other way round."
 FRA_elder_view: "Our Elder View"
 FRA_elder_view_desc: "The National Council of the Resistance did a tremendous job of rebuilding our country from the ruins of the Second World War – and in doing so, it became a vassal of the United States. But for decades now, their work has been gradually undermined by politicians, each more liberal than the last. We must return to our roots, follow the General's example, invest in our industry and set about rebuilding our country, which has been devastated by decades of European integration and deindustrialisation."
 FRA_neccesity_leaving: "The Need to Leave"
 FRA_neccesity_leaving_desc: "Our journey towards leaving the European Union has only just begun. We must make the people understand that we must leave this Europe before it is too late to do so."
 FRA_fight_renouncement: "Fight the Renouncement Supporters"
 FRA_fight_renouncement_desc: "The General did not trust the other European powers to have the will to create a Europe independent of the United States. He was right: a few decades after his death, our partners are more concerned with kowtowing to the United States and buying equipment from them than with working towards Europe's independence. We must denounce this downward spiral, which is already a reason for us to leave this Europe that is a vassal of the United States."
 FRA_back_gaulism: "Strategic Gaulism"
 FRA_back_gaulism_desc: "France must have a foreign policy that is independent of Washington's will. We must not allow anyone to meddle in our politics, and certainly not the United States, which has always sought to force us to submit."
 FRA_social_gaulism: "Social Gaulism"
 FRA_social_gaulism_desc: "Faced with the end of happy globalisation and the lure of extremism, we must steer the French people back onto the path of reason. Social Gaullism rejects both capitalism and communism. It involves state intervention to guarantee the independence and security of employment. With this stability, the people have no need for all this welfare support."
 FRA_return_nation: "Return to Nation"
 FRA_return_nation_desc: "We must encourage French companies operating abroad to return to their country of origin, by whatever means necessary."
 FRA_anti_eu: "Campaign Against the EU"
 FRA_anti_eu_desc: "Now that the people are beginning to realise that the European Union no longer serves the interests of its founders, whose identity it is seeking to erode, we can step up our campaign against the European Union. We must make the people understand that most of their problems stem from there."
 FRA_anti_usa: "Hostility Toward USA"
 FRA_anti_usa_desc: "The United States views the return of Gaullism to power with disfavour. They are right to be concerned; our rise to power will quickly make it clear to them that we are no longer their allies. After all, it is well known that the United States has no allies; above all, it has interests."
 FRA_RPF_death: "Re-Establish Death Penalty"
 FRA_RPF_death_desc: "The death penalty was abolished in France several decades ago. The majority of the French public had called for this. However, since then, criminals from all walks of life have felt emboldened. We must bring them back down to earth. Their actions have consequences."
 FRA_destroy_liberalism: "Destroy Economic Liberalism"
 FRA_destroy_liberalism_desc: "For far too long, our economic policy has been dominated by abhorrent ultra-liberalism. Our citizens have seen their jobs and our industrial strength disappear one after the other. Even back in his day, the General warned that capitalism, from a human perspective, was a bad thing. We must return to state intervention. We must restore order to our public finances and to what remains of our economy."
 FRA_campaign_frexit: "Campaign For Frexit"
 FRA_campaign_frexit_desc: "The French have finally realised that the European Union is a bad thing; all that remains is for us to give them the means to vent their anger. All it will take is a ballot paper in the ballot box to put an end to the dismantling of France."
 FRA_rebalance_foreign_policy: "Rebalance Our Foreign Policy"
 FRA_rebalance_foreign_policy_desc: "Although we have made clear our intention to break away from the United States, our political class remains infiltrated by their politics, their way of life and their corporations. We must send a strong message to those who might think that our break with the United States is not genuine. We will re-establish dialogue with powers that have always opposed US hegemony."
 FRA_leave_nato: "Leave NATO"
 FRA_leave_nato_desc: "To safeguard our independence, we must rid ourselves of this alliance, which we have never needed and which has brought us very little. We are capable of defending our interests on our own."
 FRA_frexit_ref: "Frexit Referendum"
 FRA_frexit_ref_desc: "The time has come to leave the European Union once and for all. Our people have been sufficiently prepared to reject the European Union for good."
 FRA_strategic_autonomy: "Ensure Strategic Autonomy"
 FRA_strategic_autonomy_desc: "We have succeeded in restoring France's independence; we are free to do as we please in this world. France is strong and free, and we are ready to defend it."
 FRA_strong_people: "The Strong People"
 FRA_strong_people_desc: "No more incentives for idleness; capitalism under state control. We have renewed the social contract with our people. They know that we protect them and that they owe us obedience and goodwill."
 FRA_recover: "Rebuild the Economy"
 FRA_recover_desc: "Despite all our efforts to prepare for our exit from the European Union, our economy has still taken a hit. We must rebuild it on solid foundations before we can even think of taking revenge on our oppressors."
 FRA_our_own_sphere: "Our Own Sphere"
 FRA_our_own_sphere_desc: "We are not the only ones to have succeeded in ridding ourselves of American imperialism. We can find allies to forge an alliance based on mutual respect amongst independent powers."
 FRA_paid_reconnexion: "Blocade Europe"
 FRA_paid_reconnexion_desc: "Now that we have safely and successfully left the European Union, we can start thinking about getting our own back on it. The European Union and its networks need to pass through our country. This presents us with a tremendous opportunity to take our revenge."
 FRA_certain_idea: "A Certain Idea of France"
 FRA_certain_idea_desc: "In just a few years, we have succeeded in restoring France to what it ought to be: a proud and free great power. The General would be proud that we have restored his legacy. He was right: France can only be a great power; otherwise, it would not be France."
 FRA_salvage_mondialisation: "Salvage the Victims of Globalisation"
 FRA_salvage_mondialisation_desc: "Our people have suffered greatly as a result of globalisation. This is particularly true of the working population, who have seen their jobs disappear, their country fall apart and their values trampled underfoot. We must show them that we are the side that will bring about change, that will dare to ask the right questions and that will have a very simple solution to these problems."
 FRA_raise_tariff: "Raise Tariff"
 FRA_raise_tariff_desc: "Increasing our tariffs will enable us to put an end to unfair competition from abroad and allow the French public to buy products made in France."
 FRA_dynamise_periph: "Revitalise the Outskirt"
 FRA_dynamise_periph_desc: "Rural and suburban areas have always been neglected by planning policies. They are under-invested in and are often home to a population living in precarious circumstances but full of goodwill. We must help this population to gain access to the same infrastructure as that available in major cities."
 FRA_focus_insecurity: "Focus on Insecurity"
 FRA_focus_insecurity_desc: "Immigration has led to a significant increase in insecurity within our country. We must demonstrate to the population that we are taking this problem very seriously by increasing police staffing, implementing stricter controls, and cracking down on crime."
 FRA_eurosepticism: "Threaten to the European Union"
 FRA_eurosepticism_desc: "The European Union has always tried to silence countries like ours that opposed its ultra-globalist policies. We must make them understand that things must change and that we can reignite the Eurosceptic movement in France."
 FRA_sovergnism_policies: "Sovereignist Policies"
 FRA_sovergnism_policies_desc: "France must exercise greater control over its economy, its foreign policy and, above all, its borders. Without this, our efforts to get our country back on its feet will be in vain. We must assert our determination to govern our own country."
 FRA_economical_patriotism: "Economical Patriotism"
 FRA_economical_patriotism_desc: "We must urge French companies that have moved abroad to return to France. If they refuse, there will be consequences for their business operations in France."
 FRA_social_populism: "Social Populism"
 FRA_social_populism_desc: "All we need to do is give the people what they are calling for and crack down on those they hate to secure our voter base and ensure we remain in power."
 FRA_criticize_eu_migrant: "Criticize the European Migration Policy"
 FRA_criticize_eu_migrant_desc: "The European Union is not doing enough to stem the flow of migrants and is forcing member states to take them in. We must exert pressure to put a stop to this."
 FRA_common_accord_eu: "A Deal With the EU"
 FRA_common_accord_eu_desc: "The European Commission has realised that it cannot ignore us. Now we must make it understand that by giving us what we want, it will secure our support."
 FRA_reinforce_nuke: "Reinforce Our Nuclear Capacity"
 FRA_reinforce_nuke_desc: "Nuclear energy has proven its reliability. Why turn to other energy sources when we have this expertise at our disposal ? We must expand our nuclear capacity to cope in the event of a crisis."
 FRA_FN_death: "Re-Establish Death Penalty"
 FRA_FN_death_desc: "The death penalty was abolished in France several decades ago. The majority of the French public had called for this. However, since then, criminals from all walks of life have felt emboldened. We must bring them back down to earth. Their actions have consequences."
 FRA_reject_immigration: "Reject Immigration"
 FRA_reject_immigration_desc: "Now that we have better control over our borders, we can implement our policy to crack down on illegal immigration."
 FRA_pro_russian_fn: "Pro-Russian Policies"
 FRA_pro_russian_fn_desc: "The EU will not cease being ultra-globalist. We must draw closer to Russia, which has always managed to remain distant from the perversions of the West. Together, we will go far."
 FRA_oppose_lgbt_fn: "End Wokeism"
 FRA_oppose_lgbt_fn_desc: "Some people should not be allowed to enter our country. Let's put an end to this nonsense and focus on restoring order based on the only right model of the family."
 FRA_end_right_soil: "End the Right of Soil"
 FRA_end_right_soil_desc: "Being born in France should not be enough for a person to be French. We must put an end to the principle of jus soli; we deserve to choose who can be a French citizen."
 FRA_support_rus_claim: "Support Russian Claim"
 FRA_support_rus_claim_desc: "Russia has every right to feel threatened by NATO's expansion. We must demonstrate our willingness to help them redress the injustices they have suffered."
 FRA_electoral_reform: "Electoral Reform"
 FRA_electoral_reform_desc: "Elections in France are increasingly being contested on the grounds of the electoral system and the representativeness of the parties. We can implement these reforms whilst ensuring that they work to our advantage so that we can remain in power."
 FRA_our_identity: "Our Identity"
 FRA_our_identity_desc: "It is difficult to be a nationalist within an entity such as Europe. We have abandoned the idea of leaving it, so we must forge a new identity that is suited to our place within the European Union but which does not aim to dilute us amongst the foreign workforce."
 FRA_boreal_space: "Our Stance With Russia"
 FRA_boreal_space_desc: "We have demonstrated our desire to work with Russia, and our efforts have not gone unnoticed. Now is the time to decide what we want from Russia; it is time to reach out to them."
 FRA_long_travel: "France Prevail"
 FRA_long_travel_desc: "Over the past few years in office, we have shown the French people that, with determination, a country's problems can be resolved very easily. We have made France greater and less dependent on our neighbours and on migration flows, which we have managed to curb."
 FRA_sound_fury: "The Sound and the Fury"
 FRA_sound_fury_desc: "The French people no longer want appeasement; the moderates have let them down,they have never brought about any real change. We are the party of change; we must show the French people that we are determined to challenge the established order."
 FRA_silent_france: "Mobilise the Non-Voters"
 FRA_silent_france_desc: "Many citizens have lost faith in our Republic and its institutions. We must encourage them to return to the polls to bring about real change."
 FRA_end_privatisation: "End Privatisation"
 FRA_end_privatisation_desc: "Many companies have continued to relocate their production sites away from France in order to boost profitability. This is driving up unemployment and causing us to lose our expertise. We must put a stop to this haemorrhage by regaining control over these companies if necessary."
 FRA_pro_lgbt_lfi: "Promote Affirmative Action"
 FRA_pro_lgbt_lfi_desc: "We must put an end to the discrimination that people who deviate from what is wrongly considered the norm have been subjected to for far too long. Our society must learn to accept all differences."
 FRA_toward_6th_rep: "Towards a 6th Republic"
 FRA_toward_6th_rep_desc: "We can now begin the most important part of the mandate entrusted to us by the people. We promised change they will have it. The time has come to shape a new Republic that will suit everyone."
 FRA_distance_nato_lfi: "Leave NATO"
 FRA_distance_nato_lfi_desc: "NATO is an instrument of American imperialism. We must distance ourselves from it because it does not reflect our vision of international politics."
 FRA_oppose_eu_treaty: "Oppose EU Treaty"
 FRA_oppose_eu_treaty_desc: "Unfair treaties have been imposed on our citizens. We are under no obligation to abide by them. To change this unfair Europe, we must start by challenging its legislative framework."
 FRA_guarante_employment: "Guarantee Employment"
 FRA_guarante_employment_desc: "Our country is full of talented people who are unable to fulfil their potential due to a lack of jobs caused by the crisis. We must guarantee everyone a stable and decent job; this should form the basis of any social contract."
 FRA_state_power: "The Power of the State"
 FRA_state_power_desc: "The institutions of the Fifth Republic are too centred on the office of the President of the Republic. We should encourage public debate so that the people can decide what our new Republic should look like."
 FRA_democracy: "Individual Freedoms"
 FRA_democracy_desc: "The many crises our country has faced have raised practical questions about the safety of our population. Surveillance is necessary to protect our citizens, but how far can the state go? We should allow our citizens the right to have their say."
 FRA_foreign_recognition_lfi: "Reset Our Foreign Policies"
 FRA_foreign_recognition_lfi_desc: "For far too long, our country has propped up dictatorships and refused to recognise the existence of sovereign states. We must put an end to this."
 FRA_oppose_eu_immigration_lfi: "Question EU's Stance on Immigration"
 FRA_oppose_eu_immigration_lfi_desc: "The European Union is becoming increasingly lenient towards far-right populists. It is not doing enough to help our neighbours in need and sees them merely as a source of cheap labour. We must distance ourselves from this approach and propose a more humane policy."
 FRA_economic_question: "The Direction of Economy"
 FRA_economic_question_desc: "The national budget and its management are important issues on which everything else depends. Our citizens must also have their say on this matter."
 FRA_ho_topic: "Deconstructing French Peculiarities"
 FRA_ho_topic_desc: "Many laws and customs inherent in French culture do not make it easy for other cultures to integrate. We should ask citizens to discuss the issue of the integration of minorities."
 FRA_balance_tax: "Balance Taxation"
 FRA_balance_tax_desc: "It is unacceptable for the middle class and those in precarious circumstances to be bled dry by taxes whilst the wealthy do not pay their fair share. We must restore the balance."
 FRA_climate_war_eco: "The Challenge of Our Millennium"
 FRA_climate_war_eco_desc: "The environment and the climate are deteriorating at a rapid pace. We must protect what remains of our biodiversity and prepare our society for difficult times ahead."
 FRA_dawn_6th_rep: "Dawn of the 6th Republic"
 FRA_dawn_6th_rep_desc: "Our work on the Sixth Republic is complete. Whatever the outcome, our work is done. We have probably made our mark on history."
 FRA_creolisation: "Creolisation"
 FRA_creolisation_desc: "The centuries of cultural exchange that our country has witnessed have shaped a new culture. However, this culture is denied by many; we must make our citizens understand that the future lies in living together. We still have so much to learn from the world."
 FRA_work_less: "Work Less Work Better"
 FRA_work_less_desc: "Our predecessors were determined to make the French work longer and longer hours in increasingly poor conditions. We must reverse this trend and help our citizens to enjoy their work more. They will then be all the more creative and enthusiastic about their work."
 FRA_reform_police: "Reform the French Police"
 FRA_reform_police_desc: "For too long, the police have been used as a tool for unjust repression against our citizens. We must implement the necessary reforms to ease the pressure on our citizens, whilst ensuring everyone's safety."
 FRA_post_empire: "Decolonise our International Policy"
 FRA_post_empire_desc: "Our colonial past has caused a great deal of harm to our former colonies. Many of them are still struggling to recover from it. We must support their rebuilding efforts and stop trying to dominate them."
 FRA_push_social_green_eu: "Spread Defiance in Europe"
 FRA_push_social_green_eu_desc: "We have achieved a lot in France, but we must also encourage our European partners to follow the same path. We can rally their people to pressure their governments so that we are not the only ones promoting progressivism in Europe."
 FRA_social_green_fair_rep: "L'Insoumission"
 FRA_social_green_fair_rep_desc: "In just a few years, we have achieved so much. We have steered France away from economic liberalism, precariousness, and have created a more humanist France. But we will never stop challenging the established order, whether at home or in the rest of the world."
 FRA_no_time: "We Have No Time"
 FRA_no_time_desc: "Scientists have been warning about the devastating effects of climate change for decades. What they predicted is now coming to pass: increasingly extreme weather events. People need to wake up if they want the next generation to have a chance at life."
 FRA_strong_eu: "The Strengh of the EU"
 FRA_strong_eu_desc: "France cannot force the world to take climate change seriously. The European Union, on the other hand, can serve as a model for the rest of the world."
 FRA_ecology_available: "Make Ecology Available"
 FRA_ecology_available_desc: "For far too long, ecology has been considered a privilege reserved for the wealthy. We must continue to promote it as a way of saving money and preventing tragedies for everyone."
 FRA_right_vote: "Wider Right to Vote"
 FRA_right_vote_desc: "You don't have to wait until you're 18 to start caring about the environment and its future. The right to vote should be extended to a wider section of the population."
 FRA_question_growth: "Question Economic Growth"
 FRA_question_growth_desc: "For decades, people have been led to believe that the best way to help the environment is through sustainable development. But why must we always develop and grow? The planet and its resources have their limits. We should instead be moving towards a slowdown in growth."
 FRA_cooperate_eu: "Cooperate With EU Partners"
 FRA_cooperate_eu_desc: "Not all our European partners necessarily have the same resources or the same commitment to transforming their economies in order to tackle climate change. We can help our key partners achieve this by investing in green infrastructure in their countries."
 FRA_push_eco_eu: "Promote a Green Futur"
 FRA_push_eco_eu_desc: " Our European partners are not doing as much as we are to tackle climate change. We can encourage their populations to take action by urging their environmental campaigners to take action and follow France's example."
 FRA_question_agriculture: "A Sustainable Agriculture"
 FRA_question_agriculture_desc: "Agriculture in France has moved towards mass production to meet the needs of the last century. Environmentally speaking, it is more responsible than many other forms of agriculture, but there is still room for improvement. In addition to European standards, we must encourage farmers to change their methods in favour of responsible, high-quality production. We will ensure that their produce is promoted and that this proves profitable for them."
 FRA_cooperation_no_compet: "Cooperation Not Competition"
 FRA_cooperation_no_compet_desc: "The model of social success in our country and around the world is based on individual success and the display of one's wealth. This behaviour is harmful to our planet as it encourages overconsumption and toxic competition amongst citizens. To reduce the impact of our societies on the planet, we must challenge these social models."
 FRA_nuke_choice: "Diversify Our Energy Mix"
 FRA_nuke_choice_desc: "For decades, energy in France has been generated by dozens of nuclear reactors. Whilst this technology may be reliable and relatively safe in the short term, it produces waste that we are unable to dispose of. It is therefore not the ideal source of energy for a sustainable future. We should diversify our energy supply by investing more in renewable energy."
 FRA_green_eu: "Toward a Greener EU"
 FRA_green_eu_desc: "Our success, both at home and abroad, in tackling climate change serves as a model for other countries in the European Union. We can be proud of that."
 FRA_eco_life: "Ecological Way of Life"
 FRA_eco_life_desc: "Adopting more sustainable production methods will not be enough on its own. We must encourage our citizens to consume less. This involves curbing ubiquitous advertising and promoting moderation. We don't need all of this; we can be happy with less."
 FRA_upgrade_transport: "Upgrade Our Transport Network"
 FRA_upgrade_transport_desc: "Our transport network may be efficient, but it is highly uneven and forces people in outlying areas to travel using more expensive and more polluting means of transport. We must make an alternative accessible across all regions; this means improving connections to outlying areas rather than continuing to develop an ever-faster network linking just a few European cities."
 FRA_dynamise_research: "Dynamise Research"
 FRA_dynamise_research_desc: "We must continue to develop research; we will never stop finding ways to do more with less and to develop renewable energy."
 FRA_help_transi: "Assist an European Transition"
 FRA_help_transi_desc: "Our European partners are beginning to realise that climate change is a serious issue that will increasingly affect them. However, some have not yet reached the stage of development required to be able to invest in this sector. We can help them to do so by setting up a joint fund between our countries dedicated to the transition to a low-carbon economy."
 FRA_end_fossile: "End Fossil Fuel"
 FRA_end_fossile_desc: "Now that the importance of the green transition is more widely recognised within the European Union, we can step up our efforts. We can propose to our partners that we move towards phasing out fossil fuels."
 FRA_opti_indus: "Optimise Our industries"
 FRA_opti_indus_desc: "We need to make the leaders of large companies understand that implementing genuine environmental measures would be in their best interests. They, too, could do more by using fewer resources. We must, however, be careful that this does not encourage them to produce even more."
 FRA_promote_local: "Promote Local Consumption"
 FRA_promote_local_desc: "Now that we have a more responsible industry, we must ensure that our citizens are actually able to afford its products. However, market forces favour low-cost production. We must therefore ensure that products from our own industries are more readily available than those from the other side of the world. This will require us to bend the rules of free trade. But we should be able to manage it."
 FRA_subsidies_green: "Subsidies Green Industries"
 FRA_subsidies_green_desc: "Encouraging businesses to make eco-friendly changes won't get everyone on board. We need to provide the necessary resources and offer subsidies to businesses based on their commitment to the planet and their efficiency. This time, there will be no greenwashing."
 FRA_pressure_supply: "Pressure Supply Chains"
 FRA_pressure_supply_desc: "It is a fact that our country cannot produce all the raw materials it needs domestically. The European Union imports a great many resources from countries that have lax environmental standards. It is unacceptable that we import resources that do not meet our production criteria – otherwise, what is the point of having regulations? We must join forces with other European powers to put pressure on these exporting countries to bring about change."
 FRA_reduce_extraction: "Reduce Ressources Extraction"
 FRA_reduce_extraction_desc: "The extraction of minerals and oil is a polluting process that often exceeds our planet's capacity to regenerate them. Although we do not sit on an oil field, we must set an example to the rest of the world by introducing stricter regulations governing the extraction of minerals and fuels."
 FRA_power_rail: "Extend EU-Rail"
 FRA_power_rail_desc: "The European Union already has an extensive rail network, but we can do even better. Far too much freight is still transported by lorry; we must reduce this."
 FRA_altermondialism: "Promote Altermondialism"
 FRA_altermondialism_desc: "The fact that globalisation has ceased to benefit the public comes as no surprise to anyone. But we must steer the public away from the anti-globalisation movement. These tendencies are dangerous because they pit globalisation against a nationalist solution that is often aggressive. We must show them that the main enemy is capitalism."
 FRA_unite_struggle: "Convergence of Struggles"
 FRA_unite_struggle_desc: "We must unite all those who are oppressed, whether because of their gender, religion, skin colour or any other characteristic. They are all victims of capitalism and its social consequences. We must show them that all their problems have a cause and a solution. "
 FRA_retake_past: "Winning Back the Workers"
 FRA_retake_past_desc: "Following the collapse of the USSR and the end of 'happy globalisation', a large proportion of our former working-class electorate turned to far-right populists or, for the most part, stopped voting altogether. Today we have managed to win the elections, but to ensure our long-term survival we must rebuild our working-class base, which is the very DNA of our party. To do this, we must take their demands seriously, starting by bringing back the jobs that our liberal predecessors sent to China."
 FRA_turn_reform: "Reform Rather Than Revolution"
 FRA_turn_reform_desc: "Now that we have returned to the helm of these institutions, we no longer need to consider taking action to challenge the state, as we are now part of it. We will be able to reform society from within, setting aside revolutionary ideals."
 FRA_leave_nato_PCF: "Leave NATO"
 FRA_leave_nato_PCF_desc: "NATO is an instrument of American imperialism. We must distance ourselves from it because it does not reflect our vision of international politics."
 FRA_renogociate_treaty: "Renogociate EU Treaty"
 FRA_renogociate_treaty_desc: "Our people have been forced to accept European treaties which they had, however, opposed. To carry out our programme, we must amend the legislative framework imposed on us by the European Union. There will undoubtedly be a power struggle with the European institutions and sanctions, but we have no other choice if we truly wish to act in the interests of the French people."
 FRA_undo_lib_PCF: "Close the Liberal Parenthesis"
 FRA_undo_lib_PCF_desc: "Ever since President Mitterrand's term in office, the French people have had to endure liberal policies from both the left wing and the right wing. It is time to put an end to this and show that we are different. That we are determined to fight against capitalism, even if it means coming into conflict with the WTO or the European Union."
 FRA_protect_indus_pcf: "Protect Our Industry"
 FRA_protect_indus_pcf_desc: "It is not enough simply to invest in industries in France; we must prevent them from relocating to places where labour is cheaper and where there are fewer regulations. This is a matter of safeguarding our sovereignty over our means of production and ensuring decent jobs and living conditions for our workers."
 FRA_left_front: "Expand the Coalition"
 FRA_left_front_desc: "Our government is in place but is not very stable, we lack allies. Perhaps we should seek allies amongst the other radical left-wing parties. They have not agreed to join our government, but perhaps we could persuade them to do so. We could offer them a few ministerial posts in exchange for their support."
 FRA_deal_devil_pcf: "A Deal With Socialists"
 FRA_deal_devil_pcf_desc: "The other radical left-wing parties will not be enough to secure the stability we hope for. Perhaps we could find common ground with the Socialist Party. After all, leaving Europe has never been part of our plans. We can surely find common ground with them so as to secure them into our coalition."
 FRA_tie_moscow: "Tie With Moscow"
 FRA_tie_moscow_desc: "Throughout the Cold War and even afterwards, our party has always sided with Moscow. Although the era of the USSR is over, it would appear that the current Russian authorities are in favour of communist ideals. Since our departure, we have been under threat from our former allies. A Russian ally would be a dream come true; we could establish economic cooperation."
 FRA_eu_communism_PCF: "Promote EuroCommunism"
 FRA_eu_communism_PCF_desc: "The USSR is now nothing more than a distant memory, and today we must manage without it in a world where Russia – our former model – vacillates between oligarchy and ultra-nationalism. Communism and the European Union are not incompatible; other European countries are not hostile to it. We can remain in Europe and do our best to steer it away from capitalism and fascism."
 FRA_retake_sovereign: "Reclaim Our Sovereignty"
 FRA_retake_sovereign_desc: "Now that we have regained control of our production apparatus, we have the means to go further. We must rid ourselves of foreign influence now that we have the means to act independently."
 FRA_empower_union_PCF: "Promote the Trade Unions"
 FRA_empower_union_PCF_desc: "Despite their former power, trade unions no longer carry much weight today. This is because the authorities have deliberately weakened them by dividing the working class and undermining job security. Yet having a force capable of standing up to employers is essential in our country. We cannot be everywhere at once; the working class must take back control of its future. We must help them regain their legitimacy in the eyes of the working class."
 FRA_green_communism: "Reach Out the Greens"
 FRA_green_communism_desc: "Humanity is not the only victim of capitalism; our planet is also in danger because of humanity's reckless conduct. We can find common ground with the Greens; they can help us design our ecological program, which we will also need."
 FRA_no_russian_claim: "The Russian Threat"
 FRA_no_russian_claim_desc: "It is highly likely that, sooner or later, the European Union will find itself in conflict with Russia. As Russia is likely to set its sights on Ukrainian and Baltic territories, we must begin by reaching out to the Ukrainians to offer them our assistance."
 FRA_green_turn: "Green Communism"
 FRA_green_turn_desc: "In collaboration with our green allies, we have drawn up an environmental programme that will enable us to prepare France for the challenges posed by climate change. This will require a great deal of effort on our part to rebuild our means of production whilst limiting their carbon footprint. But we must do this; the working class also has children who must be able to grow up in a liveable world."
 FRA_favor_lgbt: "End Discrimination"
 FRA_favor_lgbt_desc: "Now that we have secured the basic means of subsistence for our population by providing them with jobs and a future, we must also address discrimination within social classes. We must remind our people that discrimination on any grounds whatsoever is unacceptable. Our society must learn to accept all differences."
 FRA_dna_restored: "DNA Restored"
 FRA_dna_restored_desc: "With our coalition secured, we can focus on restoring the working class to prominence. By introducing extensive employment protection laws, we should be able to win back our electoral base. This will not please the business community, but that has never been our goal."
 FRA_condemn_rus: "Protect Easter Europe"
 FRA_condemn_rus_desc: "Russian aggression may not stop at Ukraine. To protect our emerging Europe, we must ensure that the countries of Eastern and Northern Europe will be able to resist a potential Russian invasion."
 FRA_by_ourself: "Triumph of Reformism"
 FRA_by_ourself_desc: "By building a strong coalition, we have laid the groundwork for France to remain a left-wing nation. We have restored the electorate's trust in the left and its institutions. Without writing off the past, as long as we are here, we will never cease to fight against capitalism and fascism, both in Europe and across the world."
 FRA_friend_of_past_pcf: "Toward a New Kommintern"
 FRA_friend_of_past_pcf_desc: "The Russian Communist government also appears to be sufficiently consolidated. We could propose to them that we expand our cooperation. It is time to restore communism to its former glory. The capitalists and fascists must learn to fear us once again."
 FRA_struggle_end: "The Struggle is Only Beginning"
 FRA_struggle_end_desc: "Over the course of these few years in office, we have put communism back on the political map. We have reconnected with our electorate and secured a future for generations to come. However, we are far from finished. There will always be further challenges to tackle. But we have at least ensured that the Left will no longer be the Trojan horse of neoliberalism."
 FRA_new_18th_brumaire: "A New 18th Brumaire"
 FRA_new_18th_brumaire_desc: "We Bonapartists have secured the highest offices of the Republic. The Republican opposition has been silenced, and we alone are capable of leading this country. Our enemies are legion, but nothing will stand between France and its destiny."
 FRA_revolution_bonapart: "The Revolutionary Legacy"
 FRA_revolution_bonapart_desc: "Napoleon I and the French Empire are the direct heirs of the French Revolution. As the French people are deeply attached to these values, we must show them that our Empire is not a restoration. Our Empire is the herald of a new revolution."
 FRA_despotism: "Despotism Rather Than Disorder"
 FRA_despotism_desc: "The unrest of recent months has caused considerable concern amongst our people and on the financial markets. We must reassure them that, as long as we are in power, no disorder will be tolerated."
 FRA_napoleon_constitution: "The Napoleonic Constitution"
 FRA_napoleon_constitution_desc: "The institutions of the former Republic are no longer suited to the present day or to our authority. We must reshape them to create a state that is stronger than ever."
 FRA_reform_military_napoleon: "The New Grand Armée"
 FRA_reform_military_napoleon_desc: "Our armed forces are more than adequate for a country like ours. But they are not capable of sustaining a prolonged conflict against multiple foreign powers. We must start from scratch and build an army that no one can defeat."
 FRA_question_eu: "Europe or the Empire"
 FRA_question_eu_desc: "As our country is a founding member of the European Union, it is deeply integrated into it, and breaking away would not be an easy task. Except that we intend, in fact, to fight against other European powers. Should we rejoin the institutions of the European Union, like the new French government, or should we go ahead and leave it for good? In any case, we will be forced to fight against them."
 FRA_centralised_admin: "Administrative Centralism"
 FRA_centralised_admin_desc: "Decentralisation was a mistake for our country. What we need is a clear chain of command and a vertical organisational structure."
 FRA_blame_ennemy: "Aggressive Rhetoric"
 FRA_blame_ennemy_desc: "Our nascent Empire is surrounded by its future enemies. Sooner or later we will be forced to fight them, but our society is not ready to wage war against our former allies. We have led them astray by speaking to them of a peaceful future, sooner or later they will be brought back to reality. To this end, we can prepare them by undermining their trust in our former partners and making them realise that we stand alone against everyone else."
 FRA_proclaim_empire: "An Imperial Proclamation"
 FRA_proclaim_empire_desc: "In a short space of time, we have succeeded in consolidating our power and creating the conditions for France's return to the international stage. It is now time to drop the pretences. We shall proclaim the return of the French Empire following a parade demonstrating the full extent of our military capabilities. A show of strength, a warning, the dawn of a new era for France. After that, we shall see things clearly: potential allies will come to us and our adversaries will reveal themselves."
 FRA_la_grande_armee: "The Backbone of Our Army"
 FRA_la_grande_armee_desc: "Having reformed our chain of command, we can now turn our attention to more specific reforms of our military structure. To begin with, we can focus on our offensive doctrine in terms of the actual resources available to conduct our operations."
 FRA_europe_nationalism: "Bolster European Nationalism"
 FRA_europe_nationalism_desc: "Few European nations have pledged their support to us. They view the return of a France led by a nationalist party with disfavour. Their stance is a mistake, they should know that it is better to be with us than against us. We're going to make them pay for their inaction. We're going to lend our support to nationalist groups in their countries. That should cause a right old mess back home, and if they come to power, we'll have gained an ally."
 FRA_plebiscites: "Rule by Plebiscite"
 FRA_plebiscites_desc: "The end of the Republic by no means meant that the people would be left with no means of making their views heard. We must show the people that they still have a say by inviting them to decide on various matters of our policy. The Emperor will have no trouble convincing them, and this sham democracy will be enough for most."
 FRA_firepower: "The Modern Firepower"
 FRA_firepower_desc: "During the Napoleonic Wars, the Grande Armée benefited from a number of innovations that enabled it to unleash unprecedented firepower on the counter-revolutionary forces. Today, the rules of bombardment have changed significantly with the advent of attack aircraft and drones on the battlefield. Our country is fortunate to excel in both artillery and aviation. We must therefore decide which to prioritise in order to streamline our production for battlefield support."
 FRA_8th_coalition: "Surrounded by Enemies"
 FRA_8th_coalition_desc: "Just as in the days of the Napoleonic Wars, a political game is clearly taking shape. Our enemies fear us and are just waiting for the first sign of weakness to join forces against us. We shall not grant them that satisfaction. Our borders will remain militarised for as long as necessary. The French Empire will only survive by confronting its adversaries; the difference from the past is that this time the coalition will not have time to form, for we shall crush them one by one."
 FRA_renew_meritocracy: "The Meritocratic Empire"
 FRA_renew_meritocracy_desc: "Although it was known to have its flaws, the First Empire owed its success to its preference for experience and professionalism over social class. Today, we must renew this promise of social advancement for the French people. They must understand that by working hard for the Empire and for France, they can rise higher than they ever have before."
 FRA_last_deluge: "Stronger Than Ever"
 FRA_last_deluge_desc: "We have carried out far-reaching reforms in our chain of command, our doctrines and our supply chains. Now all that remains is for us to open the doors of our army to mass recruitment. Conscription has not been a reality for a long time, but the French are ready to fight for their Empire. The Grande Armée will be ready to set out to conquer Europe."
 FRA_ennemy_isolate: "Infiltrate Our Opponents"
 FRA_ennemy_isolate_desc: "We have the means to infiltrate our adversaries' civil defence systems and strike them where it hurts. This will provide excellent training for our intelligence services, but it also risks making them wary of us."
 FRA_history_allies: "The Empire's Allies"
 FRA_history_allies_desc: "Although we are surrounded by enemies, we are not alone; many countries still maintain friendly relations with us and might be interested in joining our alliance. We could highlight our shared history with them to justify a future alliance. We can offer them significant benefits, and they will be of great help to us."
 FRA_imperial_pride: "Imperial Pride"
 FRA_imperial_pride_desc: "The French people have regained their pride. We have shown them that peace and the Republic were nothing but illusions, and that France's future lies in becoming an Empire. They are proud of their country and hate our adversaries. Our society and our economy are geared towards a protracted conflict."
 FRA_declare_hostile: "Test Their Defences"
 FRA_declare_hostile_desc: "We no longer have any reason to conceal our expansionist ambitions from our future enemies. It is time to show their people that they have every reason to fear us and to submit without making a fuss."
 FRA_our_own_system: "Our Own System"
 FRA_our_own_system_desc: "Every empire has its own alliance, and trying to triumph alone would be costly. A number of countries have already expressed a willingness to form an alliance with us. It is time to formalise this cooperation by creating a strong alliance between partners who respect one another."
 FRA_reclaim_empire: "Reclaim the Empire"
 FRA_reclaim_empire_desc: "The time has come to set out to reclaim our Empire. We have spent years preparing our society, our economy and our army. It is time for this work to bear fruit and for France to regain its rightful place in the world order."
 FRA_french_commune: "The Victorious Revolution"
 FRA_french_commune_desc: "We have succeeded in wresting control of the institutions from the moderate communists and other weak forces or puppets of capitalism. By accepting our rise to power, the French people are placing their trust in us. They, too, believe that capitalism can be defeated, and that is what we intend to set about doing. We shall rebuild our society and prepare for a showdown with the capitalist forces."
 FRA_purge_military: "Secure the General Staff"
 FRA_purge_military_desc: "Although we have succeeded in taking control of the institutions, the army – which has not intervened – may not always remain on our side. Sooner or later, we will have to face off militarily against another power. To ensure their loyalty, we must start at the top of the chain of command. They will realise quite readily that they have no choice, but will no doubt show some resistance for a few months. Once the top of the chain is brought into line, the rest will obey orders."
 FRA_worker_right_comm: "Reassure the Workers"
 FRA_worker_right_comm_desc: "Although the difficult phase of our revolution is now over, civil society has expressed serious concern about the situation in our country. We must reassure the workforce by guaranteeing them jobs and job security. This will require our production lines to adapt, but these guarantees will be beneficial for our future."
 FRA_people_constitution_comm: "The Dictatorship of the Proletariat"
 FRA_people_constitution_comm_desc: "The institutions of the Old Republic were fundamentally unjust. A small, corrupt caste exercised total control over the country. Our Revolution must give workers the tools to participate in the political life of the country they help to run. It is time to put an end to the unjust Republic and to devise a new form of governance."
 FRA_revolution_soil: "A Land of Revolution"
 FRA_revolution_soil_desc: "From the Jacqueries to the French Revolutions, the French people have shown that they oppose the injustice of authoritarian systems. In the wake of our Revolution, we must show them that their prayers have been heard and build an egalitarian society capable of withstanding all attacks by the counter-revolutionaries."
 FRA_hostile_nato_comm: "The Corrupted West"
 FRA_hostile_nato_comm_desc: "NATO is a puppet of the United States and Catpitalism. As both are our mortal enemies, we must not remain in this alliance any longer. Sooner or later, they'll be our opponents."
 FRA_fate_eurocommunism: "Abandon the European Experiment"
 FRA_fate_eurocommunism_desc: "Even if we tried with all our might, we would not be able to set the institutions of the European Union back on the right track. They are riddled with the corruption of capitalism and lobbying. Moreover, these countries are firmly opposed to our domestic policy. The split will hurt our highly integrated economy, but this separation is necessary."
 FRA_legacy_patriwar: "The Legacy of the Great Patriotic War"
 FRA_legacy_patriwar_desc: "In the last century, the USSR showed the world that fascism could be defeated by force of arms. That war, which they fought successfully, taught us that a nation must stand united with its army. The Red Army would never have prevailed without the resilience of Soviet society. We must ensure that, in future conflicts, public enthusiasm remains at its highest. We will need all our strength for what lies ahead."
 FRA_focus_education: "Popular Education"
 FRA_focus_education_desc: "Whether it is to get involved in politics or to be effective and happy at work, our people need to be informed. We must give everyone the chance to learn everything they need to understand the world without falling for the propaganda of capitalists and fascists."
 FRA_loyalty_cause: "Loyalty to the cause"
 FRA_loyalty_cause_desc: "We have granted our people numerous rights, from better working conditions to political representation, and we have rectified many wrongs. These new rights, however, come with responsibilities. Dissent is permitted, but the people are required to submit fully to the will of the people. We govern this society collectively; it is therefore everyone's responsibility to ensure that it continues to function properly."
 FRA_paris_commune: "The Lessons of the Paris Commune"
 FRA_paris_commune_desc: "Although the links between the Paris Commune and the communist ideology we espouse are far from obvious, we can still learn lessons from this turbulent period. The Paris Commune perished because of its lack of resources and will to fight the forces of the counterrevolution. In this cruel world, corrupted by globalization, we must keep in mind that the survival of our revolution depends on crushing the counterrevolutionary forces. Our society must be aware of this and stand together to confront our adversaries."
 FRA_unleash_agent: "Destabilize the Capitalists"
 FRA_unleash_agent_desc: "We won't always be able to confront our adversaries on the battlefield; that would be too costly, and we might end up being defeated. We can, however, make life easier for ourselves by destroying their society from within. With the DGSE, we have an intelligence agency trained in espionage and destabilization, and we could put it to good use. We'll export the revolution without waging war, and there's nothing the capitalists can do to stop it."
 FRA_spread_communism_eu: "Spread Communism in Europe"
 FRA_spread_communism_eu_desc: "We cannot change the European institutions, but we can encourage some of its member states to rebel. Since the neoliberal policies implemented across the EU are not to everyone's liking, we will have no trouble convincing a portion of their populations to join us."
 FRA_red_army_comm: "The New Red Army"
 FRA_red_army_comm_desc: "Thanks to our reforms, the army is fully under the commune's control, and civil society is ready to fight alongside its armed forces. Our reforms have also unlocked its full potential; our soldiers know that justice is on our side. The commune must not fall, for it carries the torch of the revolution."
 FRA_collectivisation: "Collectivization of the Economy"
 FRA_collectivisation_desc: "Control of the economy has always eluded the working class, remaining in the hands of a few families. Before the revolution, the oligarchy reigned supreme in this country. But now that is over; the French people are regaining control of their means of production. With this, we will ensure the loyalty of our means of production, as well as the financial security of our population."
 FRA_enforce_unions: "Empower the Trade Unions"
 FRA_enforce_unions_desc: "Now that we have collectivised the French economy and given workers greater political responsibility, we must ensure that they are able to retain control should the state prove less prudent. The trade unions may have been reinstated by our moderate predecessors, but we can do more than that. We will give the trade unions even more power and encourage workers to join them. United workers must never cease to play a significant role in our country's decision-making"
 FRA_glorious_past_comm: "The Questionnable Past of Communism"
 FRA_glorious_past_comm_desc: "Whilst not all of Europe has fond memories of Stalinist communism – particularly in Eastern Europe – we must remind them that we are different. These countries were crushed by Stalinist totalitarianism, which did not liberate the people but merely gave them a new master. Our only enemies are capitalism and fascism; if these countries need to free themselves from them, we can help them do so. But our aim will not be to enslave them, but rather to integrate them into our Union of the Proletariat of all nations."
 FRA_befriend_comm: "Workers Unity"
 FRA_befriend_comm_desc: "Although communism is less in vogue in this new millennium, we are not alone in following its teachings. In the struggle that lies ahead, we need allies, and we can find them amongst those countries that, like us, have chosen to resist capitalism. We must propose to these countries that we help one another to destroy capitalism throughout the world. They are not alone, and neither are we."
 FRA_final_struggle: "The Final Struggle"
 FRA_final_struggle_desc: "Our society and our army are ready to fight against capitalism. They are aware of the progress we have made and of the capitalist powers' determination to wipe us off the map. We will fight to the bitter end to defeat capitalism."
 FRA_UFSR_born: "Communism with French Characteristics"
 FRA_UFSR_born_desc: "The combination of Communist ideology and the French people's determination to defend their rights was a very good idea. We have made it clear to the public that they must get involved in politics and that they have the means to do so. Just as the Fête de la Fédération marks our national holiday, it can be said that the revolution has now truly been accepted by the French people. This is a historic day for our country."
 FRA_new_kommintern: "Towards a New International"
 FRA_new_kommintern_desc: "Many groups around the world have responded to our call for a World Revolution. It is time to put our alliance into practice and prepare to take on capitalism."
 FRA_cold_war_round2: "The World Revolution"
 FRA_cold_war_round2_desc: "The time has come to fight against capitalism and fascism. We will bring freedom to workers in every country. The oligarchy will be defeated."
 FRA_kingdom_history: "A Long History of Monarchy"
 FRA_kingdom_history_desc: "The monarchy has returned in France. Our supporters have taken control of the institutions of the former Republic and have called for our return. And here we are, two centuries after the fall of the absolute monarchy, back on the throne of France. A long journey lies ahead of us. We must eradicate the Republican legacy of the Revolution whilst rebuilding the new Kingdom of France. Meanwhile, our enemies lie in wait for us in the shadows, but we shall succeed, for God is with us, as He always has been."
 FRA_camelot: "The King's Camelots"
 FRA_camelot_desc: "To ensure that the population remains compliant and does not dream of a new Republic, we must step up surveillance, and to do so we need a political police force. To this end, we can make use of former members of Actions Françaises who were trained by the DGSI. We will merge these organisations into a new body which we shall call the King's Camelots, in homage to our royalist activists of the last century."
 FRA_decentralisation_king: "complete Decentralisation"
 FRA_decentralisation_king_desc: "The centralisation inherited from Jacobinism and the Revolution did not turn the French into citizens but into subjects. The systems of customary law operating at lower levels served their purpose very well as a link between the citizen and the central state. Fortunately, our country had already begun to move away from centralism in order to comply with European Union standards. We can therefore complete this transition, not to conform to the mould of European regions, but to restore the system of local authority like before the Revolution."
 FRA_king_rule: "Regnum Regis"
 FRA_king_rule_desc: "The first step in erasing the memory of the Revolution is to build a new system on the ruins of the old one. We can therefore announce the abolition of the Republic and the drafting of a new constitution. This constitution will be centred on the King, who will wield absolute power, just as in the good old days."
 FRA_national_integralism: "Intregral Nationalism"
 FRA_national_integralism_desc: "To help the French people understand what a failure the Revolution was and its consequences, we must highlight a famous theory put forward by the thinker Charles Maurras. Integral Nationalism portrays a Republic that has abandoned patriotism as a result of a Revolution instigated by Freemasons, heretics and foreigners. It advocates a return to national unity and the moral order embodied by the Catholic Church. These teachings are full of virtue and are entirely applicable to our nascent Kingdom. Our Kingdom has just found its manifesto."
 FRA_no_more_eu: "Leaving the National Remover"
 FRA_no_more_eu_desc: "The European Union embodies everything we are fighting against: unbridled liberalism, sickening idealism, disastrous naivety and pervasive corruption. This organisation's sole aim is to dismantle our nations and our cultures. We therefore have no reason to remain part of this union. We must leave before it is too late, whatever the consequences. "
 FRA_eu_kingdom: "The Fallen Monarchies"
 FRA_eu_kingdom_desc: "A few centuries ago, Europe was a continent of monarchies. The international order at that time was, in a sense, shaped by the balance of power and alliances. But those days are long gone. Nationalism has either swept away the monarchies or reduced them to the status of tourist attractions. The best we can do to find allies, therefore, is to help the supporters of absolutism in Europe rise up against their Republican oppressors."
 FRA_king_modern_chivalry: "Modern Chivalry"
 FRA_king_modern_chivalry_desc: "The Kingdom of France has always been renowned for its cavalry and the decisive role it played in the battles it fought. Today, the cavalry resembles a 60-tonne steel monster. Yet its role remains decisive. Our armed forces would do well to focus on making extensive use of armoured cavalry."
 FRA_no_deceit: "End Decadence"
 FRA_no_deceit_desc: "Our main enemy is the decadence that the Republic has instilled in our society. Citizens who have strayed from moral order and who expect the state to pay for everything. We must bring them back to reality, The era of the Republic is over. Our Kingdom wants virtuous citizens."
 FRA_frankish_ancestor: "Our Ancestors, the Franks"
 FRA_frankish_ancestor_desc: "We French people are descended from the Franks; that is our people and our identity. The Republicans wanted to eradicate the monarchy and the Franks, but you cannot wipe out a civilisation and a culture from within. It is our heritage, and it is up to us to reclaim it. "
 FRA_against_liberalism: "Against Liberalism and Socialism"
 FRA_against_liberalism_desc: "The Republic has led our citizens to believe that they need more freedoms and rights. Our Kingdom aims to right these wrongs. Above all, our citizens need to rediscover the path to moral order and the unity of our nation around its king. Everything else is secondary."
 FRA_historical_ennemy: "The Eternal Ennemy"
 FRA_historical_ennemy_desc: "If there is one adversary with whom we have clashed over the centuries, it is undoubtedly the United Kingdom. It, too, is a monarchy, although the monarch now holds no real power. We will surely find ourselves facing them sooner or later. But whether it is them or others, our navy must be prepared to fight against maritime powers."
 FRA_friend_pope: "Protect the Papacy"
 FRA_friend_pope_desc: "As the eldest daughter of the Church, France has a duty to protect it from all the ones who might seek to attack the papacy."
 FRA_army_of_elites: "An Elite Force"
 FRA_army_of_elites_desc: "It was the Revolution that introduced the concept of conscription. We saw during the last two world wars that this was not necessarily the best of ideas. Soldiers who were not always properly trained were sent to their deaths. These decisions decimated the French population in the last century. We must ensure that our army remains professional by tightening recruitment criteria. This will also prevent us from ending up with troublemakers within our ranks."
 FRA_positive_inequality: "Positive Inequality"
 FRA_positive_inequality_desc: "Not everything needs to be egalitarian. The idea that we should all be equal is yet another invention of the Revolution. Some people are meant to lead, whilst others are meant to follow. The French need to realise this, because spending one's time complaining about other people's success reduces everyone's efficiency."
 FRA_destroy_republicanism: "Destroy Republicanism"
 FRA_destroy_republicanism_desc: "Absolutism has returned to our Kingdom. There is no longer any reason to perpetuate this illusion of democracy that is politics. The only party that has any right to exist is the King's One. The French must understand that I am the State!"
 FRA_catholic_league: "Founds the Catholic League"
 FRA_catholic_league_desc: "Our rapprochement with the Church has not left everyone indifferent. Some countries have shown their support for us. Perhaps we could extend our crusade to other Catholic powers. After all, they too have the right to fight to reclaim the Holy Land."
 FRA_burry_revolution: "Burry the Revolution"
 FRA_burry_revolution_desc: "The French people have finally come to realise that the Revolution brought nothing but misery and that the primacy of the French monarchy was the natural order of things. Our institutions have also been purged of revolutionary elements. We can therefore say that we have successfully turned the page on that accursed Revolution."
 FRA_elder_daughter: "The Eldest Daughter of the Church"
 FRA_elder_daughter_desc: "France has regained its place in the world order. We shall be, as we have long been, the defenders of Christendom, and we shall reclaim the Holy Land, as we have done so many times before."
 FRA_republican_cancer: "The Republican Cancer"
 FRA_republican_cancer_desc: "Our country has succeeded in ridding itself of Republicanism, but we are more or less the only ones in Europe who are no longer under its rule. It goes without saying that if we are defeated in battle, our adversaries will plunge us back into the Republican nightmare. We must destroy the Republican threat wherever it may be found. Only in this way will we be safe."
 FRA_crusade: "Reclaim Our Estate"
 FRA_crusade_desc: "Whether it is to reclaim the land of our Frankish ancestors or to take back the Holy Land, we will in any case have to confront the powers of Europe and the Middle East. It is time for us to go to war."


 # Industrial Tree
 FRA_economic_policy: "Economic Policy"
 FRA_economic_policy_desc: "Our economy is only ranked fifth in the world. Maybe we can be proactive in showing what a good economic policy might be."
 FRA_free_market: "Free Market"
 FRA_free_market_desc: "The world's markets are better left to decide for themselves than regulate. A free market is better than a regulated market!"
 FRA_total_sa: "Total SA"
 FRA_total_sa_desc: "Total SA is one of the largest oil-producing companies in the world. We could use their assets to expand our oil industries for use by the Republic."
 FRA_french_economic_intervention: "Economic Intervention"
 FRA_french_economic_intervention_desc: "The best way to act on the economy is to intervene in it regularly. However, too much intervention has been shown to cause issues. It is up to the government to decide ultimately what is right. The invisible hand of the market will not harm France and nor will we beckon to its call."
 FRA_reduction_in_taxes: "Reduce Taxes"
 FRA_reduction_in_taxes_desc: "Taxes are crazy! Let's reduce them. Hopefully, it will pull in some new investments and stimulate the private sector."
 FRA_deregulation: "Deregulation"
 FRA_deregulation_desc: "The first step to building an economy is to deregulate it. Allowing development in otherwise restricted areas might be just the trick."
 FRA_state_stock_in_sa: "State Stock in SA"
 FRA_state_stock_in_sa_desc: "Total SA has done great work in recent contracts. They should be partly 'invested' into increase, not only our profits but our freedom from foreign dependence."
 FRA_paris_employment_projects: "Paris Employment Projects"
 FRA_paris_employment_projects_desc: "Paris has had some stints with high unemployment in the past. Give them something to do."
 FRA_nationalization_of_steel: "Nationalization of Steel"
 FRA_nationalization_of_steel_desc: "The nationalization of steel ought to improve our industrial capacity."
 FRA_private_contracting: "Private Contracting"
 FRA_private_contracting_desc: "Contracting local companies should be able to help speed up construction projects. However, this will be draining as we no longer set the price."
 FRA_tapping_resources: "Tapping Resources"
 FRA_tapping_resources_desc: "There are resources all over France. We should look into exploring our natural resources to reduce our dependencies."
 FRA_offshore_oilrigs: "Offshore Oilrigs"
 FRA_offshore_oilrigs_desc: "Kourou has oil reserves slightly off its coast that could be tapped for our use. Oil is black gold, and we need to get rich!"
 FRA_state_run_construction: "State-Run Construction"
 FRA_state_run_construction_desc: "The state sets the price date and number of employees. The only issue is that this can sometimes be inefficient due to if the project is underfunded or if it is set too long than employees stand around."
 FRA_infrastructure_projects: "Infrastructure Projects"
 FRA_infrastructure_projects_desc: "Local infrastructure has had some issues in the past. Let us improve the system."
 FRA_decentralization: "Decentralization"
 FRA_decentralization_desc: "Decentralizing the government will have many benefits. The states will become more independent, much like the United States. It could potentially net us more tax revenue by cutting back centralized economic measures."
 FRA_centralization: "Centralization"
 FRA_centralization_desc: "Centralizing the government will push us towards more control over the independent variables in every location and affect every walk of life."
 FRA_french_healthcare: "French Healthcare"
 FRA_french_healthcare_desc: "French Healthcare is some of the most well-formed healthcare systems in the world. It is one of the few who offer true universal health care."
 FRA_french_arms_industries: "French Arms Industries"
 FRA_french_arms_industries_desc: "The French arms industries remain some of the most profitable companies on the planet. Whether it be Nexter, Dassault, or Thales group. They are always worth an investment or a government contract."
 FRA_research_and_dev_projects: "R&D Projects"
 FRA_research_and_dev_projects_desc: "State-run research and development allow for more standards of scientific greatness."
 FRA_reformed_universal_healthcare: "Reformed Universal Healthcare"
 FRA_reformed_universal_healthcare_desc: "Despite having some of the best health care laws in the land. It will still always have its flaws."
 FRA_nexter: "Nexter"
 FRA_nexter_desc: "Nexter is a French government-owned arms company that specializes in the development of French arms and vehicles."
 FRA_dassault: "Dassault"
 FRA_dassault_desc: "Dassault's primary function is an aviation company. One of their most notable creations was the Mirage."
 FRA_thales_group: "Thales Group"
 FRA_thales_group_desc: "Although Thales Group is an electronics company first and foremost. They have done wonderful work on a majority of our most technologically advanced ships."
 FRA_usa_fra_collaboration: "USA-French Collaboration"
 FRA_usa_fra_collaboration_desc: "Collaboration with the United States is not only beneficial, but it is also the obvious choice."
 FRA_the_french_agriculture: "French Agriculture"
 FRA_the_french_agriculture_desc: "In a world where 6 billion people are trying to get enough to eat, agriculture is a sector with a bright future. We're lucky to have such high-quality soils, so we should explore their various uses, to confirm our food autonomy."
 FRA_the_vineyard_industries: "The Vineyard Industries"
 FRA_the_vineyard_industries_desc: "The French wine industry has an international reputation and contributes greatly to our soft power as a mark of good taste and good fortune."
 FRA_the_dairy_industry: "The Dairy Industry"
 FRA_the_dairy_industry_desc: "In addition to producing quality meat, our herds can also produce large quantities of milk, which has recently found its way into a wide range of products."
 FRA_wheat_industry: "Wheat Industry"
 FRA_wheat_industry_desc: "Wheat is one of the most strategic resources in a food-dependent world, so we're lucky that it grows well here."
 FRA_mechanized_agriculture: "Mechanized Agriculture"
 FRA_mechanized_agriculture_desc: "At the dawn of this new millennium, we need to strengthen our ability to exploit our soils efficiently, and the development of heavy-duty vehicles could help us do just that."
 FRA_packaging_industries: "Packaging Industries"
 FRA_packaging_industries_desc: "The packaging industry is an important part of our food independence project, guaranteeing that our products are packaged in solid, environmentally friendly, and made-in-France packaging."
 FRA_agriculture_industry: "Agriculture Industry"
 FRA_agriculture_industry_desc: "We have successfully ensured our country's food self-sufficiency in an expanding world."
 FRA_improved_railways: "Improved Railways"
 FRA_improved_railways_desc: "Rail is an efficient way of linking metropolises and smaller towns together, and we should expand this sector by developing the technologies associated with it."
 FRA_focus_on_rails: "Focus on Rails"
 FRA_focus_on_rails_desc: "Now that we've upgraded our communication channels, we can add more vehicles to use them."
 FRA_high_speed_rail_lines: "High-Speed Rail Lines"
 FRA_high_speed_rail_lines_desc: "With the evolution and massification of high-speed tracks, we are in a position to connect our country both inland and wherever there are rails in Europe."
 FRA_luxury_goods: "Luxury Goods"
 FRA_luxury_goods_desc: "The luxury goods industry is dominated by private French companies such as Louis Vuitton, Chanel and Hermes, which are known the world over. Perhaps by investing in this sector, we could benefit from its spin-offs for our economy."
 FRA_tourism_industry: "The Tourism Industry"
 FRA_tourism_industry_desc: "Since 1990, France has been the world's number one tourist destination, which already benefits a lot for our economy and our \"soft power\", but the massive presence of tourists is a problem in major cities. Perhaps we should work on this."
 FRA_the_gorgeous_coasts: "The Gorgeous Coasts"
 FRA_the_gorgeous_coasts_desc: "France is a large coastal country, with access to 3 different seas and magnificent landscapes around them. We should make these paradises accessible to attract tourism away from the cities. "
 FRA_the_spaces_between: "The Spaces Between"
 FRA_the_spaces_between_desc: "Our country is very beautiful but very empty. There are many areas inland that have enormous historical importance and identity for our country, and perhaps by developing these places, we could reap the benefits."
 FRA_beaches_of_france: "Beaches of France"
 FRA_beaches_of_france_desc: "We've succeeded in attracting new tourists, and spreading them around our beautiful country in a manageable way. This sector, which never stops hiring, will be our glory and our fortune."
 FRA_energy_sector: "Energy Sector"
 FRA_energy_sector_desc: "Our country has long forged its energy independence, which is mainly based on intensive use of nuclear power. It has long since been independent of other nations and the future of our great country lies in the use of nuclear power. Investment and research in the field of nuclear reactors and replacing old nuclear reactors with more efficient ones will see to it that France will continue to remain ahead of the curve against those who wish to challenge her."
 FRA_renewable_investments: "Renewable Investments"
 FRA_renewable_investments_desc: "Our country is crossed by several major rivers, this is a source of energy that will last as long as there is water on earth. We could start by building dams to take advantage of the benefits of our country's waterways."
 FRA_solar_investments: "Solar Investments"
 FRA_solar_investments_desc: "There are certain parts of France where the sun shines brightly, and once again it's an inexhaustible, even if expensive, source of energy. But to guarantee our future energy autonomy, we need to diversify."
 FRA_wind_investments: "Wind Investments"
 FRA_wind_investments_desc: "To complete our range of renewable energies, it would be interesting to equip ourselves with wind turbines, because the wind will blow forever. "
 FRA_the_northern_reactors: "The Northern Reactors"
 FRA_the_northern_reactors_desc: "Although we are already major users of nuclear power, we need to work on consolidating this sector, keeping our reactors up to date and improving their components. We could start by building two fully updated reactors."
 FRA_improved_nuclear_waste_management: "Improved Nuclear Waste Management"
 FRA_improved_nuclear_waste_management_desc: "The fate of nuclear waste casts a gloomy shadow over this energy of the future, so we need to ensure that it is treated in such a way as to avoid future disasters."
 FRA_expanded_enrichment_facilities: "Expanded Enrichment Facilities"
 FRA_expanded_enrichment_facilities_desc: "The nuclear enrichment process requires a large number of structures if we are to ensure our energy autonomy."
 FRA_the_new_energy_dawn: "The New Energy Dawn"
 FRA_the_new_energy_dawn_desc: "We have successfully ensure our future in an energy-dependent world, and are now once again in a position to sell our energy to our allies."

 # Military
 FRA_french_armed_forces: "French Armed Forces"
 FRA_french_armed_forces_desc: "For the majority of French history the French Armed Forces have been a sense of immense pride in our country. The armies that marched against the English to defend our right to have a French King or the men who served under Napoleon himself. Either way, the military is one of our claims to set us apart from others."
 FRA_the_french_army: "Armée de Terre"
 FRA_the_french_army_desc: "The 'Armée de Terre,' or French Army, is one of the three core branches of our armed forces structure. The accomplishments of our army are sung far and wide. The forces should continue to be honored and expand to push our country better forward."
 FRA_the_french_air_force: "Armée de l'Air"
 FRA_the_french_air_force_desc: "Our air force is amongst one of the eldest in the world. The very first contingent of French air power was formed in 1909 as a wing of the French army. Now, it is its own independent wing, and we export one of the finest pieces of airpower in the world."
 FRA_french_navy: "Marine Nationale"
 FRA_french_navy_desc: "The French navy helped push our ambitions and our desires on a global scale. It helped found one of the largest colonial empires the world had seen amongst the Spanish and English. Investing in this will allow us to further project abroad."
 FRA_amx_leclerc: "AMX Leclerc"
 FRA_amx_leclerc_desc: "The AMX Leclerc and its successors are the MBT class of the French military. It is robust and well-rounded like most modern tanks. Investing further in their development can boost our armored corps."
 FRA_network_centric_warfare: "Network Centric Warfare"
 FRA_network_centric_warfare_desc: "Much like the Americans and other European majors we should invest in more technologically advanced methods of warfare to pull away from using people and begin to rely heavily on technology. The change will be expensive, but it will ultimately save more French lives."
 FRA_land_air_coordination: "Land-air Coordination"
 FRA_land_air_coordination_desc: "Land-air coordination is vital to any joint task force operation. Without ground forces, we cannot push the frontlines; without air, we cannot expect efficient fire support. Therefore, we should push to better coordinate between the air war and the ground war."
 FRA_the_mirage: "The Mirage"
 FRA_the_mirage_desc: "The Mirage has become one of those iconic fighters for the French Air Force. It is used in service by nine other countries in the world and is an imported fighter by many."
 FRA_maritime_fighters: "Maritime Fighters"
 FRA_maritime_fighters_desc: "The improvements on both our air force and navy are going to require more efficient naval warfare fighters."
 FRA_lafayette_class: "Frégate Légère Furtive"
 FRA_lafayette_class_desc: "The Frégate Légère Furtive class frigates were first designed in the later 80s to replace aging destroyers. The ships are light,  multi-purpose vessels that are good for defense roles in the French fleet."
 FRA_de_gaulle_class: "De Gaulle Class"
 FRA_de_gaulle_class_desc: "The De Gaulle Class Aircraft Carrier is the tenth aircraft carrier made for service in the French navy. It is also the only nuclear-powered aircraft carrier outside of the USN, making it a formidable and strong carrier."
 FRA_amx_10: "AMX-10"
 FRA_amx_10_desc: "The AMX-10 is a light recon tank for the French army. The AMX boasts an impressive speed of 85km on ideal terrain. Needless to say, the AMX moves fast as hell."
 FRA_vbci: "VBCI"
 FRA_vbci_desc: "The VBCI was meant to replace the aging AMX-10P, the VBCI was developed and planned to be pushed into service by 2008 in the later 2000s. The VBCI has many improvements, including being faster than the speedster AMX by having a max speed of 100km/h. However, the VBCI sacrifices the big boi gun in favor of a lighter armament and higher speeds."
 FRA_forward_air_bases: "Forward Air Bases"
 FRA_forward_air_bases_desc: "To prepare for any outcome, we must build up our forward air bases to ensure properly staged offensive or defensive plans."
 FRA_mirage_2000d: "Mirage 2000D"
 FRA_mirage_2000d_desc: "The Mirage 2000D is a run-of-the-mill attack plan that has served us faithfully since its conception. Pushing for future and better plans will only honor the Mirage's legacy."
 FRA_carrier_fighters: "Rafale Marine"
 FRA_carrier_fighters_desc: "The Rafale Marine is a carrier version of the common Rafale fighter. It boasts a similar build to its land-based variant. Overall, the fighter is a monster in the battle for the seas."
 FRA_med_naval_bases: "Mediterranean Naval Bases"
 FRA_med_naval_bases_desc: "Corsica is prime territory for an improved naval base. It is detached from the mainland, while also being relatively defensible."
 FRA_triomphant_class: "Triomphant Class"
 FRA_triomphant_class_desc: "The Triomphant class submarines were meant to supersede and are now the fundamental portion of the ocean-going branch of the nuclear deterrent forces."
 FRA_ifv_investment: "IFV Investment"
 FRA_ifv_investment_desc: "Investing in better IFVs and other forms of light armor vehicles should be able to help us boost our military and economy!"
 FRA_national_arms_exports: "National Arms Exports"
 FRA_national_arms_exports_desc: "France has become a major defense industry player, and we should continue this path."
 FRA_the_space_program: "The Space Program"
 FRA_the_space_program_desc: "Space is a new frontier, and as of recently we have proven that we can learn many great things from space! It is worth reestablishing confidence in our space program."
 FRA_floreal_class: "Floreal Class"
 FRA_floreal_class_desc: "The Floreal class represents most light frigates in the French armada. The Floreal class and its successors are active ships meant for multi-purpose combat between both Anti-Ship, Naval-Land support, Anti-Aircraft, and moderate Anti-Submarine warfare."
 FRA_laredoubtable_class: "Le Redoutable Class"
 FRA_laredoubtable_class_desc: "The Redoutable class submarines are some of the old submarines in service by the French navy. However, they are not to be doubted as they are pivotal in French nuclear deterrent naval strategies."
 FRA_honour_and_fidelity: "Honneur et Fidélité"
 FRA_honour_and_fidelity_desc: "The motto of the French legion resonates well with our country. The military shows and attributes in specific the values of honor in both what they do and fidelity by their undying faithfulness to the French homeland."
 FRA_cnes_budgeting: "CNES Budgeting"
 FRA_cnes_budgeting_desc: "CNES is the main portion of French aviation and aeronautics. We should allow budgeting for the CNES so we can continue to push and stay competitive in this new frontier."
 FRA_international_space_research: "International Space Initiative"
 FRA_international_space_research_desc: "We should work with other countries like the United States to start pushing forward this frontier!"
 FRA_kourou_launch_pad: "Kourou LaunchPad"
 FRA_kourou_launch_pad_desc: "Kourou in French Guyana is both a strategic space launch location and direct territory owned by us. We can also broker deals with other space agencies about them using this excellent location."
 FRA_honour_homeland_valour_discipline: "Honneur, Patrie, Valeur, Discipline"
 FRA_honour_homeland_valour_discipline_desc: "The motto of the French Navy is an expression of more than just what it means to be in the military. The people are one in the motherland, we are nothing more than filled with honor and valor, and our courageous people are disciplined."
 FRA_french_space: "French Space"
 FRA_french_space_desc: "Our dominance in space functions moving forward is vital for a future in the resources and gains that are to be had in the skies up above."
 # Aggression - Equality
 FRA_peaceful_rise: "Peaceful Rise"
 FRA_peaceful_rise_desc: "The French people have decided. We shall not push forward in the old ways. Our ideas will be pushed peacefully abroad."
 FRA_aggressive_expansionism: "Aggressive Expansionism"
 FRA_aggressive_expansionism_desc: "We must prepare for the world and the conflict that will soon arise."
 FRA_stage_caribbean: "Stage: Caribbean"
 FRA_stage_caribbean_desc: "Although we have never had a strong presence in the Caribbean. The territory we still retain and seek to gain there will be all the more valuable."
 FRA_stage_africa: "Stage: Africa"
 FRA_stage_africa_desc: "At one point the continent of Africa was around 45% controlled by our great empire. We should return some of the control to the French sphere."
 FRA_stage_americas: "Stage: Americas"
 FRA_stage_americas_desc: "The Americas were especially important in our early colonial empire. Louisiana and Quebec were all staples in our empire."
 FRA_stage_europe: "Stage: Europe"
 FRA_stage_europe_desc: "Europe has always been interesting for French politics. We once conquered most of the continent. We once ruled over much of what is mainland Europe. The French dominion over the lands will once again be realized."
 FRA_stage_asia: "Stage: Asia"
 FRA_stage_asia_desc: "Asia was always tricky for us to invest our resources. We owned ports in India, Indochina, and many minor islands in the Pacific. Nonetheless, the people and resources there that are ready to be taken are all the more attractive."
 FRA_stage_oceania: "Stage: Oceania"
 FRA_stage_oceania_desc: "Oceania's French influence is few and far between."
 FRA_the_dominican: "The Dominican & Haiti"
 FRA_the_dominican_desc: "The island the two nations sit on is both strategic and extreme strategic importance. It can push us forward into Lousiana, or the Caribbean nations."
 FRA_island_bases: "Island Bases"
 FRA_island_bases_desc: "The islands in the southeastern Caribbean held by France are also further useful for staging operations in the Americas."
 FRA_north_africa: "North Africa"
 FRA_north_africa_desc: "The Maghreb once was controlled by France. Morocco, Algeria, and Tunisia all swore allegiance to the French Empire!"
 FRA_the_horn: "The Horn"
 FRA_the_horn_desc: "The Horn of Africa was slightly neglected in favor of other regions. However, returning Djibouti to our colonies will improve our projection points."
 FRA_quebec: "Quebec"
 FRA_quebec_desc: "Quebec marked one of the greater accomplishments in the new world. It marked a new kind of colonialism, one that involved cooperation with the natives and not forcibly seizing their lands. The natives were far too valuable to lose for the colonizers."
 FRA_piedmont: "Piedmonte"
 FRA_piedmont_desc: "Piedmonte is not necessarily French. However, this region rests on the other side of the Franco-Italian border. The kingdom of Sardinia-Piedmont was once a client state underneath Napoleon. It's possible to restore this cooperation."
 FRA_the_benelux: "The Benelux"
 FRA_the_benelux_desc: "The Lowlands or Benelux has always been a place of conflict for Europe. The fall of the Burgundian king, the racial divide in Belgium between Flanders and Wallonia. It is also the seat of the EU. Therefore, it is strategic for us to push through and reclaim some sense of control in these countries."
 FRA_indian_ocean_bases: "Indian Ocean Bases"
 FRA_indian_ocean_bases_desc: "The Indian Ocean is a vast place. However, boosting French bases should provide us with a tactical advantage in both East Africa and South Asia."
 FRA_french_indochina: "French Indochina"
 FRA_french_indochina_desc: "French Indochina was the pinnacle of our far east expansion. We once owned Cambodia, Vietnam, and Laos. However, now it is the time we reclaim our influence and take back our strength in Indochina."
 FRA_new_caledonia_base: "New Caledonia Bases"
 FRA_new_caledonia_base_desc: "New Caledonia is not the most prestigious of places to own. However, we can use this for better posturing.  If we improve the local bases, it should give us somewhat of an edge in the region."
 FRA_west_africa: "West Africa"
 FRA_west_africa_desc: "French influence in West Africa remains ever prevalent. Most countries that were once ruled by us use French as an official language. Many others around the world use it as a second language."
 FRA_subsahara: "Sub Sahara"
 FRA_subsahara_desc: "Sub Sahara was just as important due to its strategic reserves of resources and other modes like that. We should continue to push forward and improve our control in the regions."
 FRA_lousiana: "Louisiana"
 FRA_lousiana_desc: "Louisiana is one of the few places where the Creole culture was born. It is a mix of French and Spice and something else nice, but it is a hub for French foreign influence."
 FRA_the_iberans: "The Iberians"
 FRA_the_iberans_desc: "The Iberians once swore allegiance to the French, and Spain's ruling family is French. We should continue to push our influence to strengthen the regions close to home."
 FRA_mountain_boys: "Mountain Boys"
 FRA_mountain_boys_desc: "Switzerland has been a close ally and friend for many years. The western portions of the country speak French primarily making it an excellent place to secure our borders against others' influence. Finally, we should also push our influence and control into Austria as well. The mountain boys will not withstand French might!"
 FRA_german_goliath: "German Goliath"
 FRA_german_goliath_desc: "The Germans have beaten us in WW2. They believe now they are the ones who should control what happens in Europe. The German Goliath must be stopped."
 FRA_russian_bear: "Russian Bear"
 FRA_russian_bear_desc: "The Russian bear has been a symbol of our defeat from Napoleon's reign. It is time we reclaim our glory for France and return the idea of surrender to the Russians!"

 # Francosphere Section
 FRA_francosphere: "Francosphere"
 FRA_francosphere_desc: "France has been practicing a method of neocolonialism since the end of World War II. While not directly occupying these nations' lands, France has been a puppet master pulling the strings in its favor. However, with the start of the twenty-first century, many are willing to reduce their dependence on Paris as a source of leadership. Therefore, it is now time for France to act accordingly."
 FRA_the_levant_problem: "The Levant Problem"
 FRA_the_levant_problem_desc: "The Levant is an often overlooked section of the Francosphere. The region once provided valuable grain, fruits and oil to the French empire."
 FRA_antagonize_syria: "Antagonize Syria"
 FRA_antagonize_syria_desc: "Syria under the al-Assads has made far too many wrong decisions. We should destabilize the regime and start to help encourage Syria toward our ideology and depose the dictators."
 FRA_supporting_armenia: "Supporting Armenia"
 FRA_supporting_armenia_desc: "Armenia is a newcomer to the Francosphere but they are a strategic ally nonetheless. The struggles of the nation remind us much of our own and we must support Armenia in her struggles in the Karabakh. "
 FRA_anti_assad_regime_message: "Anti-Assad Regime Message"
 FRA_anti_assad_regime_message_desc: "Although we have been antagonistic at large against Syria. It is now time we become blatant and no longer tip-toe around what we truly mean. Syria's lead under the Assads has taken a turn for the worst and we must continue to state our disdain for the al-Assads."
 FRA_escalation_from_the_damascus_spring: "Escalation From The Damascus Spring"
 FRA_escalation_from_the_damascus_spring_desc: "The Damascus Spring has started in full force. It is now pivotal we continue to throw our support behind the pro-democratic movements in Syria and across the Middle East."
 FRA_collaboration_with_the_fsa: "Collaboration With Syrian Rebels"
 FRA_collaboration_with_the_fsa_desc: "The rebels will need a considerable amount of resources to contest the al-Assads. We should look into our options and what we can provide to the group that will lead Syria forward."
 FRA_oil_and_gas_investments: "Oil & Gas Investments"
 FRA_oil_and_gas_investments_desc: "The Levant particularly has a considerable amount of oil & gas reserves. It will forever be advantageous to invest resources and manpower in the oil & gas industries in the region."
 FRA_reminder_of_the_taif_agreement: "Reminder Of The Taif Agreement"
 FRA_reminder_of_the_taif_agreement_desc: "The Taif Agreement, officially known as National Reconciliation Accord, was reached to provide a basic agreement to signify the end of the Lebanese Civil War and bring about normalcy and the end of the Civil War. We must remind Lebanon and the Middle East about the agreements of Taif and look to put an end to Hezbollah."
 FRA_root_out_hezbollah: "Root Out Hezbollah"
 FRA_root_out_hezbollah_desc: "Hezbollah is a direct affront to Lebanon and the Taif Agreement and peace in the region. Rooting out Hezbollah is one of the first steps to helping establish peace in the Middle East."
 FRA_agriculture_works_in_the_levant: "Agriculture Works In The Levant"
 FRA_agriculture_works_in_the_levant_desc: "It will be worthwhile to pursue a variety of different agricultural investments across the Levant. Contrary to most foreign ideas over the region, the area is ripe for the potential. Many crops can be grown on the lush coasts of the Levant or in the river valleys of Syria. We should explore our investments in the region and help tap the agricultural power of the Levant."
 FRA_francafrique: "Françafrique"
 FRA_francafrique_desc: "Africa was once one of the pillars of our former colonial empire. The nation of former Françafrique must continue to follow our lead into the new century. We should investigate  the best way to help them and maintain our influence over the region."
 FRA_francophone_solidarity: "Francophone Solidarity"
 FRA_francophone_solidarity_desc: "This was an initiative that aimed to promote French-speaking culture and French values among Francophone nations. The initiative included greater access to education for lower-income nations and economic support for developing ones, with the hope that they would gain and build upon the foothold they had retained since post-decolonization. In African nations specifically, France participated actively in supporting partnerships between African nations that maintained its influence and generated profitable gains."
 FRA_continue_cold_war_mentality: "Continue Cold War Mentality"
 FRA_continue_cold_war_mentality_desc: "Many with the public and the global sphere around starting to surpass an international power. We must maintain our status as a leading global nation at any cost. Returning to the old point of view will not be a popular one within the international community but actions must be taken, the heat will blow off in a matter of time."
 FRA_NEPAD_development: "NEPAD Development"
 FRA_NEPAD_development_desc: "The New Partnership for Africa's Development (NEPAD for short) is an economic development program developed by the African Union with partners from the European Union, China, Japan and other G8 members. We are especially interested in the development of NEPAD and have taken a focal point of being the main backer of the development monetarily and politically from the European Union. We should look at helping extend the development and increasing the funding and support for the program to help all of Africa."
 FRA_CFA_Reforms: "CFA Reforms"
 FRA_CFA_Reforms_desc: "Addressing the CFA is one of our biggest concerns. With influence draining over time, we are forced into the position of reform to keep a neocolonial empire alive. Some of our reforms are targeted towards increased autonomy within the banking system. Easier use of monetary funds and exchange Controls."
 FRA_introduce_the_eco: "Introduce the ECO"
 FRA_introduce_the_eco_desc: "We must detach the CFA Franc from our hold and remove the dependency of our former colonies on us. The ECO is the proposed new currency that should allow the West African nations some degree of economic autonomy and cooperation amongst the new nations who've adopted it. We should look to support them in their endeavor to create a new common currency and potentially convince all of former French Africa to utilize this new currency."
 FRA_unrestricted_subjugation: "Unrestricted Subjugation"
 FRA_unrestricted_subjugation_desc: "Our actions have only been ones of exploitation & extraction. But now we should reconsider our position on this stance and wherever we should rethink our diplomatic stance and enter a new phase of governance and control. The choice will not be a popular one but it is only made in the interests of a nation and its global status."
 FRA_intervention_in_africa: "Françafrique Interventionism"
 FRA_intervention_in_africa_desc: "Our former colonial holdings need assistance. It is now time for us to pursue a further policy of intervening in the region and providing military assistance where needed."
 FRA_sahel_region: "Sahel Region"
 FRA_sahel_region_desc: "The Sahel region serves as a prospect for mining and gathering of natural resources, a frontier for French geopolitical poisoning and corporate interests. Now  With the growing extremism of the new millennium, we are required to take actions to guarantee the safety of our homeland account. A brewing is growing within the Sahel region jeopardizing local French assets within the region. We must take the initiative and make sure to protect and stomp out this infestation at any cost required."
 FRA_afrique_centrale: "Afrique Centrale"
 FRA_afrique_centrale_desc: "A Heart and soul of Africa, covered in countless amount of natural wonders and a vast amount of resources and potential. And region untapped by its wonders."
 FRA_CAR_intervention: "Opération Sangaris"
 FRA_CAR_intervention_desc: "Opération Sangaris was the moniker of the proposed operation and intervention in the Central African Republic Civil War."
 FRA_operation_artemis: "Opération Artemis"
 FRA_operation_artemis_desc: "With the Second Congo War in full swing, France and other European nations led an autonomous intervention in the eastern part of the country following the withdrawal of Ugandan forces. It marked a major turning point in European Union foreign affairs and military joint operations."
 FRA_resources_prospects: "Resources Prospects"
 FRA_resources_prospects_desc: "The Naturally rich regions of Sub-Saharan Africa are full of natural resources with many cooperation with France already taking advantage of this prospect. With the growing dammed for these Resources we must take an initiative and invest within are assets abroad to gain are foothold and hold it well."
 FRA_oef_hoa: "OEF - Horn of Africa"
 FRA_oef_hoa_desc: "The Somali Civil War has simply raged on long enough. We must intervene on behalf of the Somali government to help them reclaim their war-torn country and assist the Somali government in their efforts to stabilize their country."
 FRA_operation_licorne: "Opération Licorne"
 FRA_operation_licorne_desc: "Opération Licorne is the moniker of the French peacekeeping force that was deployed to Côte d'Ivoire in response to the civil war between Forces Nouvelles de Côte d'Ivoire and the Forces Armées de Cote d'Ivoire."
 FRA_the_second_ivory_coast_civil_war: "The Second Ivorian Civil War"
 FRA_the_second_ivory_coast_civil_war_desc: "The Second Ivorian Civil War was the second armed conflict stemming from the supporters of Laurent Gbagbo and the president-elect Alassane Ouattara. The conflict between the two escalated to a full-scale conflict. We should intervene to help stabilize the conflict before it gets out of hand."
 FRA_Industrial_expansion: "Industrial Expansion"
 FRA_Industrial_expansion_desc: "Our former colonial nations are in desperate need of economic revival. The primarily agrarian societies could use a small boon to their economies by injecting investment funds to the region."
 FRA_educational_development: "Educational Development"
 FRA_educational_development_desc: "Providing funds for education in our former colonial holdings will help their populace become more educated and in turn help their productivity."
 FRA_operation_serval: "Opération Serval"
 FRA_operation_serval_desc: "Opération Serval is the moniker used for the series of French and Malian-led interventions during the Malian Civil War as the first stage of conflict against Islamic Extremists in the region."
 FRA_French_pillar_of_counterterrorism: "Pillar Of Counterterrorism"
 FRA_French_pillar_of_counterterrorism_desc: "Our anti-terrorist and anti-extremist forces have become world-renowned and we have become a pillar and the face of counterterrorism across the globe."
 FRA_french_pillar_of_counterterrorism_tt: "Sending §YForeign Advisors§! to Nations for §YCounter Terror Purposes§! our advisors double the bonus provided to the §YAdvised Nation§!."
 FRA_the_french_foreign_legion: "The French Foreign Legion"
 FRA_the_french_foreign_legion_desc: "The French Foreign Legion is an elite corps of the French Army that consists of a variety of specialties. Having been formed in 1831 by then King Louis Phillippe it was intended to allow foreign recruits a place amongst French forces. As such the Legion is a multi-ethnic and multi-cultural fighting force that is world-renowned for the discipline and esprit de corps."
 FRA_sahel_support_initiative: "Sahel Support Initiative"
 FRA_sahel_support_initiative_desc: "The military forces of the Sahel are often underequipped. It is possible we could reorganize some resources their way either fiscally or militarily to help strengthen our position in Africa."
 FRA_sahel_officer_training: "Sahel Officer Training"
 FRA_sahel_officer_training_desc: "The armed forces of the nations of the Sahel could use some more training to help make them a more effective fighting force. We should look to invest in the militaries of our allies in the region and improve the standard of their officers."
 FRA_takuba_task_force: "Takuba Task Force"
 FRA_takuba_task_force_desc: "The Takuba Task Force was another series of joint operations between French, Malian, EU, and American forces to continue the conflict against Islamic extremists during the Malian Civil War. It is a strategic goal for us to begin our intervention once again in Mali to ensure stability in the region."
 FRA_haitian_coup: "The Haitian Coup"
 FRA_haitian_coup_desc: "Jean-Bertrand Aristide continues to be a thorn in the side of our country. The demand for reparations is reprehensible. It may be in our interest to look at finding Haiti a new management of sorts."
 FRA_repeal_the_ordiance: "Repeal the Ordinance"
 FRA_repeal_the_ordiance_desc: "The 1825 Ordinance of Charles X should be repealed to help normalize Haitian-French relations. The 1825 Ordinance is the cause and the reason for the Haitian independence payments that were carried out for nearly three-quarters of a century. It is time we repeal this ancient piece of legislature as one of our first steps to reconciliation."
 FRA_senegalese_civil_war: "The Senegalese Civil War"
 FRA_senegalese_civil_war_desc: "The Senegalese Civil War has kicked off as a localized conflict with the recent elections. Senegal is important as a coastal nation for bringing material from the interior and north to France. Intervention in the region is a must to continue our ambitions in Africa."
 FRA_returning_to_indochina: "The Return to Indochina"
 FRA_returning_to_indochina_desc: "Indochina was once the pinnacle of the French far-east holdings until the Vietnamese independence wars. It is time to return to Indochina perhaps not as a colonizer but this time as a friend. Our interests in the region with the rise of China have marked it as an area of utmost importance."
 FRA_former_indian_colonial: "The Indian Ocean Affairs"
 FRA_former_indian_colonial_desc: "French holdings in the Indian Ocean and the French-speaking countries in the Indian Ocean are strategically important for thwarting and countering unwanted foreign influence. It is time to prepare ourselves to return to these strategically important regions and bring with us investments and other strategic improvements."

 # Events
 France_news.99.t1: "Return of the King"
 France_news.99.t2: "Return of the Emperor"
 France_news.99.d1: "The Royal House of Bourbon has returned to the royal residence in Versailles, once built by their ancestor Louis XIV, to once more take up the rulership of France.\n\nKing [FRA.GetLeader] has promised a new and grand age for France and the world. \"The rightful rulers of France and the protectors of Western Europe have returned to their rightful place.\" was the ending clause of his speech - which was immediately criticized as jingoistic and over-entitled by other European leaders and French republicans."
 France_news.99.d2: "The self-styled 'Imperial House' of Bonaparte, the descendants of the self-crowned Emperor Napoleon I Bonaparte (1769-1821), have returned to Versailles. While Napoleon (and his descendants) always had been popular in France, they were less so abroad - both with foreign nobles and foreign commoners.\n\nThe Recent jingoistic rhetoric by [FRA.GetLeader], who recently ascended as Emperor of the French, has been called into question by the leaders of Germany, Britain, Italy, and Russia. The new rulers of France have few friends.\n\nTogether with the new ruling system, France had unveiled a new flag: The same as the old, but flown with red by the hoist - a call back to the French Revolution, when a similar flag was flown shortly before the first Bonapartist Empire."
 France_news.99.o1: "Long live the King!"
 France_news.99.o2: "Long live the Emperor!"
 France_news.99.o3: "Oh well."

 ### Country Events
 france_md.20.t: "The state of the centrist party"
 france_md.20.d: "Originally a centre-right party, the UDF has established itself as a centrist party, and in the past we were able to govern under President Valérie Giscard d'Estaing. Since then, however, we have been relegated to the background, sometimes serving during cohabitations, but overshadowed by the Republican Right and the Socialist Party. But the world is changing, and the neo-liberal trend is gaining ground in the West. Today, we are not very big, but there is no doubt that one day we will govern."
 france_md.20.a: "Yes, I can't wait!"
 france_md.21.t: "The state of the Republican Right"
 france_md.21.d: "Our party is as old as the republic and has governed since 1995 under Jacques Chirac's mandate, but he no longer has the wind in his sails. After a failed dissolution that forced him to take on a socialist prime minister, we are witnessing the rise of our rivals, be they the socialist party or the national front. Our country is, as ever, in financial difficulties and its interests are threatened everywhere abroad. One thing is certain: we are going to have to fight at home and abroad to assert France's power to those who might doubt it."
 france_md.21.a: "Let's get to work"
 france_md.22.t: "The state of the RPF"
 france_md.22.d: "Founded in 1999, the Rassemblement Pour la France (RPF) is a right-wing sovereignist party. Created by Charles Pasqua, it is strongly opposed to the European Union, against which it has worked hard. Our influence is minor for the moment, but the wheel is turning, the European Union is not only making people happy, and we are welcoming more and more dissidents from other parties, disappointed people who can't find the will to implement the Frexit elsewhere. We are of course the most Gaullist party in existence, and as this republic was founded by De Gaulle, we have no place in it other than Matignon!"
 france_md.22.a: "Long live General de Gaulle, long live France!"
 france_md.23.t: "The state of the National Front"
 france_md.23.d: "Founded in 1972 by Jean-Marie Le Pen and others with a questionable past, the Front National is a party of the extreme right. Since our creation, we have not been considered a serious party, because apart from us, the entire political landscape was against us, because we were the only ones who no longer wanted immigration. However, the situation has changed since then, and these same parties are beginning to realise that their attitude has led to chaos in our country. We are the forerunners in what will become a general trend of repression of immigration. But we're still being dismissed as untouchables and labelled as extremes, so there's no doubt about it: we're going to have to work to make our party acceptable to the assembly and to the electorate."
 france_md.23.a: "We'll get there!"
 france_md.24.t: "The state of the Socialist Party"
 france_md.24.d: "A historic rival of the Republican Right, our party is also of canonical age. The Republican Right is in great difficulty, and was even forced to leave us part of its mandate in cohabitation. We have a solid electoral base spread across most classes of the population, and our victory at the ballot box is inevitable. We advocate a more liberal approach than that of our forebears in order to adapt to the Europe we are building. However, we have to be careful because our party is facing major divisions, with our right wing only waiting for a sign of weakness on our part to rush headlong towards the liberal centre. Not to mention that our left wing could become radicalised if we push too hard towards liberalism. There's no doubt we'll win, but once we're on top, we'll be walking on eggshells."
 france_md.24.a: "Everything shall be fine."
 france_md.25.t: "The state of the Unbowed France"
 france_md.25.d: "The Socialist Party has failed to take left-wing ideals to the top, contenting itself with serving up soup to the centrists and dying torn between its two tendencies. Our party, La France Insoumise, therefore stands as the only true left-wing opposition to the neoliberal order. It was by seeking compromise indiscriminately that the Socialist Party buried itself, so we'll base our rhetoric on protest, even if it means attracting the wrath of the media. Our main project is also to build a new republic, putting an end to the presidential monarchy that we've had to put up with for far too long. Our party has been very successful, especially among young people, but we mustn't be content with that if we want to be in charge one day."
 france_md.25.a: "Another world is possible."
 france_md.26.t: "The state of the Greens"
 france_md.26.d: "The ecologist party in France has been around since 1984, but so far it hasn't had the success we'd hoped for. We are never taken seriously, and our electoral base is almost impossible to find outside urban centres. There's no doubt that if we're going to make our mark, we're going to have to deal with other parties and adapt to their way of seeing things. But given the state of the planet, there is no doubt that our presence at Matignon will eventually prove logical. Once there, we will strive to transform the way we live and produce, so as to ensure a future for generations to come. The obstacles are many, but there is no shortage of potential allies. "
 france_md.26.a: "We're running out of time."
 france_md.27.t: "The state of the French Communist Party"
 france_md.27.d: "The French Communist Party fell with the USSR, to which it was solidly attached. It's never easy to find yourself on the losing side. Our situation is more than critical: as we lose credibility, our working-class electoral base is drifting towards the far right or abstention. We need to reverse this trend and find new ways to win them over. We'll no doubt have to negotiate with other parties for a while, but perhaps once we're in charge we'll be able to regain the confidence of our former voters and regain our autonomy. Our party has a long history, and it can't stop now. "
 france_md.27.a: "We'll be back."

 france_md.30.t: "The direction of the economy"
 france_md.30.d: "The time has come to choose our finance minister. Our country is in urgent need of reform, so we have found 2 profiles who should meet our expectations in terms of finance. The first comes from within our ranks, a man by the name of Olivier Ferrand, who throughout his career in the economy has familiarised himself with this field. The second, a former finance inspector, is brand new to politics and supported our campaign. His social-liberal vision of society looks like what we want to become, and perhaps his presence in our government will give us the approval of the liberal bloc."
 france_md.30.a: "Renewal in the movement! Appoint Emmanuel Macron to Bercy immediately!"
 france_md.30.b: "No, we'd be better off putting in someone we really trust. Appoint Olivier Ferrand."

 france_md.11.t: "CNES - NASA Cooperation"
 france_md.11.d: "CNES leaders have come to us today to discuss the possibility of extended cooperation between NASA and the CNES. They state that there is much to learn from space, and having the backing of another large space program could help one another significantly. The agreement that is presented states we would each upfront cost $10b dollars to pursue greater ties scientifically."
 france_md.11.a: "A Worthy Agreement"
 france_md.11.b: "No"

 france_md.100.t: "The Armenia Support"
 france_md.100.d: "Armenia and their struggle remind us much of ourselves. Their struggle against Azerbaijan in Artaskh reminds us much of ourselves. Supporting them in their efforts is not only a desired but also needed for our interests in the region. We can provide material, financial, or political support in their conflict. How should we help our friends in Yerevan?"
 france_md.100.a: "Support Armenia Politically"
 france_md.100.b: "Support Armenia Financially"
 france_md.100.c: "Support Armenia Militarily"
 france_md.101.t: "France Supports Us!"
 france_md.101.d: "France has decided to send us support in our ongoing struggle to establish ourselves. The conflicts with Azerbaijan as well as the Turkish issues continue to plague us, but we now have an ally in Europe."
 france_md.101.a: "Another Move in the Direction..."
 france_md.102.t: "The First Ivorian Civil War"
 france_md.102.d: "The First Ivorian Civil War has kicked off in earnest. The conflict is raging and it does not seem to have any sign of boiling down. The once crown jewel of Françafrique has turned into a killing field between the opposing sides. The stability in the region is held delicately in the balance as the nation tears itself apart. What side best aligns with our current interests?"
 france_md.102.a: "Back Laurent Gbagbo"
 france_md.102.b: "Back Guillaume Soro"
 france_md.102.c: "Back the Third Faction"
 france_md.103.t: "The Second Ivorian Civil War"
 france_md.103.d: "The Second Ivorian Civil War is in full swing between the FNC and the government of the [CDI.GetName]. The conflict seemed to have started from the presidential election in which Gbagbo refused to step down allowing Ouattara to take power in their fair and free elections. Which side best aligns with our current interest?"
 france_md.103.a: "Back Laurent Gbagbo"
 france_md.103.b: "Back Alassane Ouattara"
 france_md.104.t: "Opération Artemis"
 france_md.104.d: "Operation Artemis, formally known as the European Union Force Democratic Republic of the Congo (EUFOR), is a proposed plan for peacekeeping and intervention forces to be deployed to the Democratic People's Republic of Congo. Many politicians within our government are looking for France to lead the European Union's military action. We have a choice amongst the participants as to which we wish to support. Rwanada and [RWA.GetLader] could be a strong ally but their faction is mainly situated in the east and doesn't wish for control over the entirety of the country. [UGA.GetLeader] and [RCD.GetName] are another choice but they're mostly situated around the north of the country. We can always support Kinshasa which would be the most optimal as they are the currently ruling government. Who are we going to support in the Great African War?"
 france_md.104.a: "Support the Congo DR"
 france_md.104.b: "Support Uganda"
 france_md.104.c: "Support Rwanda"
 france_md.105.t: "Senegalese Civil War"
 france_md.105.d: "The Senegalese Civil War expanding into a much more detailed and wider conflict was a surprise to all of those involved. The combination of the Casamance issue as well as accusations of election tampering has destabilized yet another country in Africa. Our options vary considerably depending on our goals. We can support [SEN.GetLeader] and their government, the rebel factions or the people of Casamance. Either choice will help Senegal pave a new future for itself in the region."
 france_md.105.a: "Support Senegal"
 france_md.105.b: "Support the Rebels"
 france_md.105.c: "Support Casamance"
 france_md.106.t: "Opération Sangaris"
 france_md.106.d: "The National Assembly and military of our country have proposed a new intervention in the Central African Republic in response to their new conflict. The operation's proposed is known as Opération Sangaris which will focus our troops in support of one of the factions in the civil conflict on behalf of the leader. Who are we going to support in the conflict?"
 france_md.106.a: "Support the CAR"
 france_md.106.b: "Support the UFDR" # First CAR Bush War
 france_md.106.c: "Support Seleka"
 france_md.106.d1: "Support the Logone"
 france_md.106.e: "Support Anti-Balaka"
 france_md.107.t: "Opération Serval"
 france_md.107.d: "Opération Serval has been proposed to the National Assembly as a reaction to the Tuareg rebellion in the country of Mali. Serval is currently oriented towards French forces being deployed to support the government of [MAL.GetName] and [MAL.GetLeader]. We do have the option of changing our foreign policy and supporting the cause of the Tuaregs if we so choose. What side of the conflict should we intervene on behalf of?"
 france_md.107.a: "Support the Malian Government"
 france_md.107.b: "Support the Tuaregs"
 france_md.108.t: "Takuba Task Force"
 france_md.108.d: "Islamic insurgents have started to fight against both the [MAL.GetAdjective] Government and the Tuareg forces. Opération Serval has been underway for some time now, but we can incorporate additional support for the faction we had been supported before or we can make a radical shift and support a new benefactor in Mali. What faction are we going to support in the future?"
 france_md.108.a: "Support the Malian Government"
 france_md.108.b: "Support the Tuaregs"
 france_md.108.c: "Support Ansar Dine"
 france_md.109.t: "The Haitian Coup"
 france_md.109.d: "The ruling body of the government of Haiti is not currently in our favor. The precedent that the ruling party is setting is not of benefit to our foreign policy. Instigating the coup and supporting the opposition is one of our best options for ensuring that the rest of the colonies do not begin to demand reparations against us for colonial infractions."
 france_md.109.a: "Instigate the Coup"
 france_md.109.b: "Support the Rebels"

#political tree

 france_md.150.t: "Additional aid from France"
 france_md.150.d: "The French government has offered to give us extra help in the financial crisis we've been going through since we joined the European Union. Should we accept it? "
 france_md.150.a: "Of course we need the money!"
 france_md.150.b: "No, we don't need it."
 france_md.151.t: "France proposes an international meeting"
 france_md.151.d: "The French Socialist Party has decided to organise a meeting of socialist leaders from around the world, and they've thought of inviting us. We could benefit from this to gain legitimacy. Should we go or politely decline? "
 france_md.151.a: "We'll be there!"
 france_md.151.b: "No, I've got better things to do."
 france_md.160.t: "Collapse of the Socialist Party"
 france_md.160.d: "After a year of instability and division within the Socialist Party, it has been reduced to almost nothing. This is a historic moment, but it's a shame to see the end of a party that has played such a pivotal role in France's history. For whoever inherits the post of first secretary, the task will be a heavy one. "
 france_md.160.a: "Mistakes were made..."
 france_md.161.t: "The tear continues"
 france_md.161.d: "A large proportion of our members and supporters are in the process of dissociating themselves from our group. It's clear that if we want to avoid falling, we're going to have to use all the levers at our disposal to keep the support of politicians and the public. "
 france_md.161.a: "Not a minute to lose!"
 france_md.162.t: "Our party is under threat"
 france_md.162.d: "The many unpopular reforms we have carried out, despite the general disapproval, have earned us the wrath of the population, who are wondering whether they did the right thing by voting for us. What's more, our numerous alliances with the liberal centre, which we have tried to emulate, have caused many rifts within our party. Our left wing, disappointed with our choices, is threatening to go into the arms of the radical left, while our right wing finds us too soft compared to the liberals candidates, whom we have sometimes helped despite ourselves. If there's still a chance, we'll have to work hard to get it. "
 france_md.162.a: "Ah, damn it."
 france_md.163.t: "Who Is to Blame?"
 france_md.163.d: "Following our collapse, while some voters have shifted toward the centrists, others have gravitated toward more leftist formations. These formations champion their 'radicalism' by calling themselves the 'rupture' left. This position often attracts heavy media criticism and appears to unite opposition against them. Perhaps it would serve our interest to join this momentum by criticizing these further-left formations, hoping to recover some of our centrist vote and show that we are the party of reason and a bulwark against extremists of all stripes. However, such a decision would carry consequences; if we attack our former voters who went left, we can abandon hope of their return. Conversely, we could attack those who have never stopped drifting and caused our collapse by pushing us repeatedly toward neoliberalism. This could gain us popularity on the left, but it would also strengthen the extremes."
 france_md.163.a: "Extremists of any stripe endanger our society"
 france_md.163.b: "That's nothing compared to the danger the extreme centre represents"
 france_md.164.t: "France Proposes Joint Military Exercises"
 france_md.164.d: "French diplomats have sent us a proposal for joint military training. Indeed, the recent rise in international tensions encourages us to unite among European states to prepare for the worst. This could be a very good initiative to train our armed forces for the high-intensity conflicts that could erupt at any moment. What should we tell them?"
 france_md.164.a: "With pleasure, we will train alongside them"
 france_md.164.b: "No thank you, we don't need their help"
 france_md.165.t: "The Storm Arrives"
 france_md.165.d: "Several experts on different subjects have suggested to us for some time that we establish regulatory measures in case an economic crisis should occur anywhere on Earth. It would not be the first nor the last, but these measures would allow us to maintain our distance from the complications that accompany such crises. Nevertheless, this would mean regulating the economic sector and paying many experts to oversee operations. Do we really want to do this? Our financial partners might take it badly."
 france_md.165.a: "The situation is indeed very concerning; we must establish regulatory measures urgently"
 france_md.165.b: "These are just suppositions that seem bad for business"
 france_md.170.t: "France offers war reparations"
 france_md.170.d: "The French government has decided to compensate us for the deadly Indochina war that took place on our soil for 7 years. This money will never replace the lives of the 500000 Vietnamese who died for independence, but it is an honourable gesture that should not be refused. "
 france_md.170.a: "We are now waiting for the Americans..."
 france_md.171.t: "France offers war reparations"
 france_md.171.d: "The French government seems at last to have agreed to recognise some of the crimes committed in our country, and is offering compensation for the war of independence. This money will not replace the lives of the 600,000 Algerians who died for freedom, but for once a Westerner acknowledges his crimes, it would be foolish to refuse him. "
 france_md.171.a: "at the right time"
 france_md.172.t: "France Proposes Its Nuclear Expertise"
 france_md.172.d: "The French Presidency has proposed to share its nuclear expertise with us for a modest sum of money. This could prove quite useful to master this unstable atom and make the best use of it. If we accept, this could greatly help us illuminate our people and facilitate research in this field. Nevertheless, perhaps we could use this money for something other than giving France a place it does not deserve in our country."
 france_md.172.a: "A deal in Uranium 235"
 france_md.172.b: "No, you can keep your time bombs to yourselves"
 france_md.173.t: "France Proposes Its Protection"
 france_md.173.d: "Faced with the world erupting in multiple crises, France has decided to guarantee the protection of its European allies. Indeed, the French Presidency assured us this morning that in case of aggression by a foreign European power, it would not hesitate to intervene, even invoking the use of nuclear weapons. Although this protection is a loss of sovereignty in itself, it could prove crucial in times like these."
 france_md.173.a: "One can never be too careful"
 france_md.173.b: "We don't need their protection"
 france_md.175.t: "The European Union Imposes Sanctions on Us"
 france_md.175.d: "Following our recent positions and our desire to withdraw from the treaties binding us with member states, a fine has been imposed on us by these cursed European bureaucrats. Nevertheless, nothing forces us to pay it; our voters, who crave change, would even see it as a sign of weakness or betrayal. However, refusing to pay could harm our relations with European member states and trigger sanctions against us. Should we go all the way?"
 france_md.175.a: "We will pay the fine because we play by the rules; it is by following the rules that we will prevail"
 france_md.175.b: "And what else? We've already been bled dry enough"
 france_md.180.t: "Un vote historique"
 france_md.180.d: "The people have spoken. Following long campaigns for Frexit and after evading the traps of these accursed Europeanists, as well as those of these vile populists who tried to claim our successes, we have done it. France is leaving Europe as quickly as possible. Obviously, these Brussels snakes will not fail to make us pay as much as they can, but these sanctions are nothing compared to the freedom we have regained."
 france_md.180.a: "Now and forever, France is free"
 france_md.181.t: "France Leaves the European Union"
 france_md.181.d: "Following numerous campaigns of Eurosceptic disinformation, the French nationalist movement has finally managed to swing France toward Frexit. France's departure is only a matter of time; it is nevertheless quite serious to see such a founding and structuring member of the EU leave so quickly."
 france_md.181.a: "We must be cautious in the face of populism"
 france_md.182.t: "France Recognizes Our Claims"
 france_md.182.d: "The French government recently announced that it supports our position on the various historically ours territories that were taken from us. They have also proposed the beginning of military cooperation between our two nations; for now it is only facilities to access our military infrastructure. This sudden French support is welcome, but should we really allow them to benefit from our infrastructure?"
 france_md.182.a: "Of course, they support us; they are welcome"
 france_md.182.b: "We never asked for their help; let them keep their distance"
 france_md.183.t: "France Proposes to Deepen Our Cooperation"
 france_md.183.d: "After taking numerous positions in our favor and announcing a clear rejection of NATO, Paris has proposed we go further in our cooperation. French diplomats have announced themselves open to discussion and offer us several enticing proposals. First, an economic cooperation agreement between our countries would allow us to maximize our potential and benefit from their expertise in fields where we lack competence. Nevertheless, we can also expand this cooperation to a military agreement allowing our troops to conduct joint military exercises and projects. Finally, we can even formalize this alliance and form a common front against the growing aggression of our NATO enemies. But we can also decline them. Can we really trust Westerners who have so quickly abandoned their previous allies?"
 france_md.183.a: "I'll take three crates of that perfume; it's a deal"
 france_md.183.b: "Would you prefer the Sahel dunes or our frozen steppes for training? Our armies will emerge only stronger"
 france_md.183.c: "They can stay alone"
 france_md.184.t: "Moscow Accepts Economic Cooperation"
 france_md.184.d: "Moscow's answer was not long in coming; our economies could both benefit from this agreement. In addition to opening us a considerable market for our luxury and high-tech products, our industries in need of raw materials will feel more secure. This historic agreement is a windfall for us and a nail in the coffin of the European Union. We who created it now trade with its worst enemy."
 france_md.184.a: "Let the champagne and oil flow"
 france_md.185.t: "Moscou accepte la coopération économique et militaire"
 france_md.185.d: "Moscow's answer was not long in coming; our economies and armies could both benefit from this agreement. In addition to opening us a considerable market for our luxury and high-tech products, our industries in need of raw materials will feel more secure. Moreover, strengthened cooperation between our armed forces will allow us to gain experience in new theaters and benefit from their technological and strategic advances. This historic agreement is a windfall for us and a nail in the coffin of NATO. We now have a trustworthy partner to navigate this new millennium."
 france_md.185.a: "We will meet again in the Sahel, but this time not to fight each other"
 france_md.187.t: "The Russians Break Off Negotiations"
 france_md.187.d: "Despite all the efforts deployed by our diplomats, they have not managed to reach an agreement with their Russian counterparts. As if there were no will to do business with us. This is regrettable; the potential of a bilateral agreement would have been invaluable to our two countries. It is also not impossible that pressure was exerted by our former Western friends to ensure we remain under their thumb. But it is not grave; we will find other partners."
 france_md.187.a: "The American cancer has thus reached the Urals; better alone than in bad company"
 france_md.188.t: "France Demands Concessions"
 france_md.188.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not influence the European Bank to lower the interest rates on their debt. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.188.a: "Cursed be them; we will take the least harm"
 france_md.188.b: "We will not give in to the blackmail of a few populists"
 france_md.189.t: "Germany Yields to Our Concessions"
 france_md.189.d: "Following the pressure we have exerted on them, the German government has reluctantly agreed to pressure the ECB to reduce our interest rates. This is a formidable revenge on our former tormentors. These Germans can continue to enjoy our roundabouts, but thanks to them we eat at Brussels' expense."
 france_md.189.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.190.t: "Germany Refuses Our Demands"
 france_md.190.d: "Our diplomats returned empty-handed from Berlin, snubbed by our German cousins. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.190.a: "We remain free and they don't; close the borders to the east"
 france_md.191.t: "France Demands Concessions"
 france_md.191.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not replace their maritime and coastal police in migration detention operations. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.191.a: "Cursed be them; we will take the least harm"
 france_md.191.b: "We will not give in to the blackmail of a few populists"
 france_md.192.t: "Italy Yields to Our Concessions"
 france_md.192.d: "Following the pressure we have exerted on them, the Italian government has reluctantly agreed to replace our police on our maritime borders. This is a formidable revenge on our former tormentors. These Italians will be delighted to enjoy the flow of migrants, but thanks to them we eat at Brussels' expense."
 france_md.192.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.193.t: "Italy Refuses Our Demands"
 france_md.193.d: "Our diplomats returned empty-handed from Rome, snubbed by our Latin neighbors. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.193.a: "We remain free and they don't; close the borders to the southeast"
 france_md.194.t: "France Demands Concessions"
 france_md.194.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not use the institutions we host for their purposes. They ask us to influence the decisions of European institutions and their spy services. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.194.a: "Cursed be them; we will take the least harm"
 france_md.194.b: "We will not give in to the blackmail of a few populists"
 france_md.195.t: "Belgium Yields to Our Concessions"
 france_md.195.d: "Following the pressure we have exerted on them, the Belgian government has agreed to pressure European institutions in our favor. This is a formidable revenge on our former tormentors. These Belgians will be delighted to work overtime in parliament, and thanks to them we eat at Brussels' expense."
 france_md.195.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.196.t: "Belgium Refuses Our Demands"
 france_md.196.d: "Our diplomats returned empty-handed from Brussels, snubbed by our Walloon and Flemish brothers. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.196.a: "We remain free and they don't; close the borders to the north"
 france_md.197.t: "France Demands Concessions"
 france_md.197.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not provide them with a detailed registry of bank accounts registered in our national territory. This is a grave breach of the banking secrecy we strive to preserve. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.197.a: "Cursed be them; we will take the least harm"
 france_md.197.b: "We will not give in to the blackmail of a few populists"
 france_md.198.t: "Luxembourg Yields to Our Concessions"
 france_md.198.d: "Following the pressure we have exerted on them, the Luxembourg government has agreed to pressure its banking services to provide us with a detailed registry of accounts they hold. We found many traitors seeking to escape their duty, but also information on many private companies residing in our national territory. These discoveries will help the tax authority's efforts to pursue bad patriots and make companies that tried to cheat us in our country pay. The Luxembourgers may have greatly lost credibility in banking, but thanks to them we eat at Brussels' expense and at the cost of their cursed free trade."
 france_md.198.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.199.t: "Luxembourg Refuses Our Demands"
 france_md.199.d: "Our diplomats returned empty-handed from Luxembourg, snubbed by our millionaire neighbors. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.199.a: "We remain free and they don't; close the borders to the northeast"
 france_md.200.t: "France Demands Concessions"
 france_md.200.d: "Following the victory of populism in France and its exit from the European Union, it has continued to prove its hostility toward us. The economic sanctions imposed on it following its exit have not left it unscathed; now it has finished recovering and demands reparation. Today, diplomats have arrived threatening to cut off access to its national territory if we do not come to the aid of their agricultural sector, since they apparently are currently working on a large project in southern France growing the same citrus as us. The consequences of this loss of access to their territory could greatly complicate exchanges within the European Union. Nevertheless, giving in to their blackmail would force us to use our advantages for ill."
 france_md.200.a: "Cursed be them; we will take the least harm"
 france_md.200.b: "We will not give in to the blackmail of a few populists"
 france_md.201.t: "Spain Yields to Our Concessions"
 france_md.201.d: "Following the pressure we have exerted on them, the Spanish government has agreed to provide us with technical and commercial assistance for the production and sale of our new citrus line that will flood French and Spanish markets. Perhaps the Spanish have only their fingers to bite now, but thanks to them we eat at Brussels' expense and have shown our food hegemony over the continent."
 france_md.201.a: "An eye for an eye, a tooth for a tooth, in Latin if possible"
 france_md.202.t: "Spain Refuses Our Demands"
 france_md.202.d: "Our diplomats returned empty-handed from Madrid, snubbed by our Iberian neighbors. Perhaps our demands were too high or they intend to look elsewhere than with us. We won't have our revenge against the European Union today, but it cannot wait."
 france_md.202.a: "We remain free and they don't; close the borders to the southwest"
 france_md.203.t: "The End of the Journey"
 france_md.203.d: "After several months of dialogue and relentless struggle on the substance of this reform, the text is finally ready to be voted on. Indeed, such radical changes to our constitution must be done with the approval of the people. This is how it has always been done and is the only way to proceed. Moreover, the people eagerly await the arrival of the results of their long months of door-to-door questioning and commissions. We must immediately convene a referendum to close these long months of dialogue. However, it is also possible that during the creation process, our political opponents took advantage of this great period of questioning to slip in some texts that serve their ideals or position them as victors of this process. Nevertheless, this text, good or bad, should be brought to the ballot box; otherwise the people would feel rightfully betrayed. But you remain the sole master on board; it is up to the President to convene referendums (article 11 of the constitution). But you must draw the consequences of your actions yourself."
 france_md.203.a: "It is time to end this; I call for a referendum"
 france_md.203.b: "This text is too dangerous and must not be voted on"
 france_md.204.t: "The Text Passes"
 france_md.204.d: "Today is a historic day; for the first time the entire people participates in the elaboration of its constitution. The result of the vote is unsurprising, an overwhelming victory of yes; of course, when you give a French person the right to decide his own rights, he won't deprive himself. This text is perhaps not perfect, but it reflects a new era beginning today, and we have done our best to ensure it defends the rights of our citizens while preventing the people from succumbing to the siren songs of our political adversaries. Here ends the Fifth Republic and with this frank and massive Yes begins the Sixth Republic."
 france_md.204.a: "The day of glory has arrived"
 france_md.205.t: "The Text Is Largely Rejected"
 france_md.205.d: "Against all expectations, the constitutional reform we have planned for months has been rejected by the ballot box. This categorical refusal is quite astonishing; perhaps it is due to our too strong involvement in orienting the subjects and debates, which left people thinking we were trying to manipulate them. It could also be due to the fact that our citizens wanted change in the majority but disagreed on the outcome. This plan to change everything at once was perhaps a bit bold. Nevertheless, all is not lost; we can still circulate our vision of what this republic could have been simply by voting our laws. We attempted to write a new page in the history of European democracy, but perhaps we asked too much at once."
 france_md.205.a: "Complètement incompréhensible"
 france_md.206.t: "Debate on Institutions, Part 1"
 france_md.206.d: "The question of institutions has always generated much discussion. Five republics born of victories or defeats, a regime changing with the times. If bad memories of the Fourth Republic persist, an unstable republic that weakened the state internally until the Algiers putsch in 1958 when the republic abdicated in favor of General de Gaulle. Since the Fifth Republic's constitution was adopted, tensions persist, particularly over presidential powers. These are often perceived as abusive because they were designed for politicians of strong stature who have unfortunately become rare. Current powers would allow someone ill-intentioned to block all progress or even escape other institutions through an alarming lack of checks and balances. Conversely, the National Assembly, while being more representative of French votes, actually has quite limited exclusive powers and is often described as counterproductive or inefficient due to its inability to decide its own calendar. An important chapter of the ongoing debate therefore concerns the renovation of this outdated constitution. However, the question arises: how far can we change it? We have the choice between supporting the advocates of a simple rebalancing of powers that would eliminate unjust or too dangerous articles, which would allow a rebalancing in favor of legislative power. We can also return to a model closer to the Fourth Republic to show the people that we have taken note of the abuses orchestrated by the previous executive. Supporting a rebalancing would allow us to win back people's hearts without overly disrupting our institutions, for we must remember that giving more power to the assembly can strengthen people's confidence in their institutions but make the political landscape more malleable and subject to struggles of influence. Finally, we can just let the people decide for themselves how they wish to be governed, preserving our political influence for other debates since we still have much to discuss and overinvolving ourselves would give the impression we're trying to force the voters' hand. However, we must be careful, for not involving ourselves in this part of the debate could leave our political opponents the choice to involve themselves too; they have nothing to lose; it is not they who will sign the final text."
 france_md.206.a: "Let's not rush things, and besides it's quite practical not to be constantly under threat from the assembly"
 france_md.206.b: "Down with the presidential republic, the President will inaugurate the chrysanthemums"
 france_md.206.c: "Let's just focus on promoting active citizen participation"
 france_md.207.t: "The Triumph of Compromise"
 france_md.207.d: "After days of deliberation, citizens seem to have reached agreement around a rebalancing of powers. The 49.3 article was naturally the first target of popular anger. Presidential powers came off lightly and the people appear satisfied with their work. A democratic coup now seems less likely; our institutions gain in legitimacy and effectiveness. We can only regret the slight disappointment of our most devoted supporters to whom we had promised the end of presidential monarchy. Whatever we think, the people have decided; we can now turn our attention to the following debates."
 france_md.207.a: "Very well, next question! My office came through this quite well."
 france_md.208.t: "The End of Presidential Dictatorship"
 france_md.208.d: "Citizens have finally reached agreement. The Fifth Republic had accumulated too much resentment due to abusive decisions by previous presidents. While it was useful in the hands of trustworthy politicians with a keen sense of public interest, we can no longer risk placing so much power in the hands of a single man who, on a whim, could end the republic itself. The president became a fuse in this part of the debate. His powers are now limited to that of commander-in-chief and a pleasant decoration in the Palace of Elysée. The National Assembly is once again all-powerful. While this may seem a loss of stability, reforms and compromises will proceed with far greater ease than before. Even if the people's verdict restricts your room for action, it serves the country's interests by increasing French confidence in their institutions. And if you're unhappy about it anyway, the debate is over; we must now move to the next one."
 france_md.208.a: "So be it; let the debates continue."
 france_md.209.t: "Debates on Institutions Part 2:"
 france_md.209.d: "As this debate on the power of our institutions draws to a close, one subject seems to divide our citizens: that of secret services and other underground operators for which the president bears responsibility. Indeed, French secret services before and after the Cold War have always played an important role in defending French interests both within and outside the nation. These services, sometimes changing names and methods, were sometimes the origin of excesses and settling of scores such as the Auriol murders in 1981. While these services are particularly effective at exerting pressure on rival governments and especially at combating new forms of information warfare and terrorism, they pose problems of transparency. The very principle of these special units authorized to conduct operations outside legal frameworks for the sake of general interest nonetheless raises questions about respect for the rule of law. We have always fought for a more transparent republic, and our supporters could find themselves disappointed if we do not put our program into practice. Moreover, greater transparency would strengthen citizens' confidence in their institutions and armed forces while reducing the cost of concealing them. However, the security of our state in an increasingly unstable world is a matter we cannot take lightly. As usual, we can also let voters decide for themselves, but our conservative opponents might try to influence the debate."
 france_md.209.a: "The security of our citizens above all! We'll just ensure their privacy isn't endangered too much."
 france_md.209.b: "The people need transparency! The people need justice; the state must answer to its citizens."
 france_md.209.c: "This debate stirs too much tension; we would do better to keep our distance."
 france_md.210.t: "The Secret Services Emerge Intact"
 france_md.210.d: "Citizens have decided to keep the secret services under executive control. Indeed, especially in these times, our passive defense must be in the front line to protect us from malicious actions from abroad and from terrorism. This result has nonetheless disappointed our activists who wanted more transparency and democracy. Many of our citizens persist in thinking that our country's defense should not come at the cost of their privacy in peacetime. Some also fear the misuse of these services by ill-intentioned governments to spy on their opposition or prevent leaks to the opposition. The voters have decided, and they chose security over freedom. It is their choice, after all."
 france_md.210.a: "This is simply not the right time to lower our guard in a world where might has taken precedence over international law."
 france_md.211.t: "The Curtain Is Raised"
 france_md.211.d: "After arduous negotiations, it was finally decided to end the total opacity of our secret services. Indeed, a large part of our citizens did not feel secure knowing they were under constant surveillance without their knowledge. Even though the terrorist threat persists, they trust us to protect them in another way. Our foreign interventions often spark international controversy, which our people would prefer not to discover in the newspaper each time the situation escapes our control. This new transparency will give our citizens greater confidence in their police and armed forces, which we sorely need right now. Our institutions gain in legitimacy at the cost of some of our internal security and external influence. Will we regret this choice? Time will tell."
 france_md.211.a: "We do not need secret services to protect us from foreign interference."
 france_md.212.t: "Debate on Personal Rights Part 1:"
 france_md.212.d: "The question of personal rights lies at the heart of constitutional debate. Should we strengthen individual freedoms against the state or prioritize collective security? Discussions center on the protection of personal data, the right to privacy, and the limits of state surveillance. Progressives advocate for an expansion of fundamental rights, while conservatives fear a weakening of public authority. Our position on this matter will partly determine the direction of the new constitution."
 france_md.212.a: "Firmly defend individual freedoms."
 france_md.212.b: "Collective security must take priority."
 france_md.212.c: "Let the debate continue without us."
 france_md.213.t: "Victory for Individual Freedoms"
 france_md.213.d: "The debate concluded in favor of strengthening individual freedoms. The new constitution will guarantee increased protections against state intrusion into citizens' private lives. This victory for progressives marks a turning point in our relationship with public authority, even if some worry about the consequences for national security."
 france_md.213.a: "Our citizens can rejoice in these new guarantees."
 france_md.214.t: "Security Prevails"
 france_md.214.d: "Despite the efforts of freedom advocates, the security-focused vision won the day in constitutional debates. The state will retain broad surveillance and intervention powers. While this reassures part of the population, civil rights activists denounce a democratic setback."
 france_md.214.a: "Stability comes at a price."
 france_md.215.t: "Debate on Personal Rights Part 2:"
 france_md.215.d: "Our country is well known for its many periods of unrest coming from below and for having a people difficult to govern. Whatever the election results, they will eventually take to the streets to voice their discontent. However, one way to avoid this is not to provoke them but rather to listen to them, for legitimate government power comes from them alone. It is thus no accident that the question of protecting citizens during protests is on the agenda. Police overreach on one side or insufficient protection on the other? What is certain is that a great many protests have ended with injured and disabled people. It would therefore be wise for our government and those that follow to better supervise the police forces charged with maintaining order and protecting citizens exercising their right to protest. Avoiding potential repression will allow the people to better control elites who may have lost their heads, but it will also result in additional police costs. On the other hand, maintaining order is also a priority when movements radicalize; it is important to minimize the chances of an incident leading to material and human damage. Which side of the debate should we discreetly favor? Do we prioritize protection against police overreach or against property and personal harm? We can also preserve our influence for involvement in another debate."
 france_md.215.a: "We must regulate our police forces."
 france_md.215.b: "Let them do their job."
 france_md.215.c: "The people will decide; after all, they will be in the streets protesting this law."
 france_md.216.t: "The People Choose to Restrict the Police"
 france_md.216.d: "After hours of debate, the majority agreed that police forces needed to be regulated to prevent new scandals. Law-and-order technologies are improving, and we are already a highly effective nation in this regard; there's no need to go further. Moreover, avoiding serious physical injuries among protesters will surely reduce healthcare spending. The state also has more to answer for to its people, since they will be able to protest in the streets less dangerously. However, additional costs for police should be expected as the effectiveness of law enforcement will be diminished."
 france_md.216.a: "So our people will continue to keep us in line. Next question!"
 france_md.217.t: "The People Choose Order"
 france_md.217.d: "Even if not what we would have preferred, police effectiveness won the day. It is true that some protests degenerate and cause extensive property damage, so external oversight is necessary given the reduced effectiveness of law-enforcement services. We face budget and social crises without precedent; at some point, we will need to turn some of the people against us. It therefore remains important to be capable of standing up to any social movement that comes. After all, they elected us, did they not?"
 france_md.217.a: "The people chose security over the right to hold us accountable; can we blame them? Next question."
 france_md.218.t: "Débat autour de l'économie partie 1 :"
 france_md.218.d: "Although management of the economy and budgets will be the responsibility of future governments, many proposals are coming forward to steer them in certain directions. For example, by inscribing social or ecological fundamentals in the constitution, a law voted against these principles could become unconstitutional. Discussions seem to polarize around the principle of growth versus ecology: ecological, social, or economic. Which should we place at the top of the list of entities to protect? By placing social concerns first, we would prioritize job creation and protection and the welfare of people. However, ecology could take second place and resulting debt might degrade investors' confidence. By privileging ecology, we would improve the quality of life of our inhabitants and turn toward new energy sources. However, we would leave aside revenue sources for some and investments for others. We could also sow discord by supporting the economy above all and giving the impression of another faction's involvement, but that would be risky for our activists. Otherwise, we can do nothing and let other factions decide for us."
 france_md.218.a: "Social support first! We must stand by our citizens."
 france_md.218.b: "The planet is degrading too quickly for us to sit idle."
 france_md.218.c: "Good idea; we'll make them think the liberals are behind this."
 france_md.218.e: "Let the other parties tear each other apart over this question."
 france_md.219.t: "The People Choose to Prioritize Social Support"
 france_md.219.d: "After long hours spent hesitating, citizens finally agreed on the social pillar of the republic. Indeed, by protecting ordinary people and their jobs, we will ensure a healthy transition to a better future. Moreover, it is better that our factories are built to standards and pollute here rather than being relocated to countries less concerned about this. This result is neither a surprise nor bad news."
 france_md.219.a: "Another question to which we could provide an answer; well done."
 france_md.220.t: "The People Choose Ecology"
 france_md.220.d: "This result does not displease us. Indeed, the health of the planet flows back onto the health of its inhabitants. It is therefore not surprising and even beneficial that this awakening occurred at multiple levels in society. Thus we will have to learn to transform our ways of living and producing goods and energy. The path will be strewn with obstacles and will not always serve the interests of the majority. But this is the path we must follow."
 france_md.220.a: "All that's left is to recycle those who voted for big business."
 france_md.221.t: "The People Choose Economics"
 france_md.221.d: "A surprising result, that of the outcome of today's debates. Thus the people chose to protect businesses of all kinds to drive this country's development. One can see that some still believe in trickle-down theory. One might also have guessed that with media often in the hands of a few oligarchs, they would do everything possible to tip the scales. A rather disappointing day for our activists. But we cannot now question the opinion of the sovereign people."
 france_md.221.a: "Was asking the people's opinion really such a good idea?"

 france_md.222.t: "Débat autour de l'économie partie 2 :"
 france_md.222.desc: "Other social questions will be settled in future republics, but we can already prepare the ground to favor one direction over another. Indeed, this is the most important question: who should pay? Our country has exceptional social coverage, but this system does not finance itself. We can already choose what the future system will be based on during this constitutional reform. We have the choice between basing it on significant taxation of high incomes in the country and the most profitable firms. This would allow us to finance our system or even expand it without increasing the state deficit, but some say this could discourage new businesses and future investors from establishing themselves in France. We could also finance our healthcare system through the state budget, which would cause us to spend more public money without angering industrialists; this would, however, lead to future tax increases for our population, which risks displeasing them. A last solution would be to continue what has been done until now: when the financial burden on the state budget is too high, make cuts elsewhere in the public service budget, for example. This solution will surely not please our citizens, but it is a middle ground that would allow them not to pay more taxes; they should understand."
 france_md.222.a: "Down with capitalism!"
 france_md.222.b: "The state will finance the system; we'll do our best to avoid new taxes."
 france_md.222.c: "We cannot risk putting our citizens out of work."
 france_md.222.d: "We would be better off not getting involved in this debate."
 france_md.223.t: "The People Choose to Tax Capital"
 france_md.223.d: "The long debates of recent weeks have ended with us victorious in this ideological confrontation. It will be capital and the income of the wealthiest who will finance the population's social coverage. This symbolic act marks a great victory of the people against big capital. A victory of France over finance is a victory of all the people united against their former masters. Our debates on economics are finished for now, but we have prepared the ground for generations to come. Thus in just a few reforms, we have made the revolution."
 france_md.223.a: "A great victory for the French people."
 france_md.224.t: "The People Confirm the State's Role"
 france_md.224.d: "The outcome of last week's debates is clear: the people do not want to overturn the economy as it stands. Is this due to the neoliberal propaganda they are bombarded with every day on television? Probably, but we must accept their verdict because it is the only one that matters. At least we managed not to encourage cuts to other state services to finance this one, but it is possible that our successors will be less benevolent toward society to finance our system. We will make sure that does not happen."
 france_md.224.a: "It's not really the victory we hoped for, but we'll have to make do."
 france_md.225.t: "The People Choose to Cut Elsewhere"
 france_md.225.d: "If we had known the verdict would be this, perhaps we would not have brought this debate to the ballot, but it is too late to think about that. Indeed, the people have just decided the fate of our social system. They recommended that future legislatures preserve essential state services but cut other state spending. Their primary target will probably be civil service employees and many subsidies they do not deem essential. The social protection system will be financed, but we have just justified the wolf of liberalism entering the state's accounts. As long as we are in power, we will be able to prevent it, but who knows what future governments will do."
 france_md.225.a: "This constitutional reform is not going exactly as planned."

 france_md.226.t: "Debate on Societal Issues Part 1:"
 france_md.226.d: "The system for integrating ethnic minorities as it was conceived in France and as it has endured has always revolved around the principle of a 'melting pot' with the school of the republic and meritocracy as the social glue. However, this system shows increasingly its limits in the world of the second millennium. Indeed, the slow decrepitude of the principle of education and public service seems to make social mobility and integration less and less possible. This long-term failure is the cause of unemployment and communitarian drift. Debates thus revolve around a possible reform of this system. Should we push to make this system more inclusive at the risk of questioning too much a system that has prevailed until now? If we do nothing, our opponents could use it to make it harder. Whatever we do, our actions will have consequences for generations to come."
 france_md.226.a: "The system must be more inclusive to allow as many people as possible to have a better life."
 france_md.226.b: "Let the citizens decide this question themselves."
 france_md.227.t: "The People Choose to Adapt the System"
 france_md.227.d: "The outcome of the debates seems to have moved toward an adaptation of the current system to the diversity inherent to our new millennium. We will certainly need to invest resources, but our system by allowing this inclusion will not be deprived of the new talents flowing toward our country. By giving everyone a future within reach, we have helped pacification while favoring our long-term development."
 france_md.227.a: "We have so much to learn from others."
 france_md.228.t: "The People Choose to Harden the Current System"
 france_md.228.d: "Despite our efforts, it seems that current society is not ready to question the fundamentals of our republic. The French system of integration seems to still have a bright future ahead of it. This vote confirms the attachment of the French to a system that, despite its dysfunctions, has the merit of being in place. This system can always be reformed in the long term, but we missed the opportunity to bring down another fortress."
 france_md.228.a: "Dommage"

 france_md.229.t: "Debate on Societal Issues Part 2:"
 france_md.229.d: "One of the hottest questions of our millennium concerns freedom of worship. Indeed, since the secularism laws of the Third Republic, France is one of the only secular countries in the world. Freedom of worship is protected at all costs. Sometimes even at the cost of the freedom of fellow citizens. This is particularly true in public primary education establishments where external signs of religious affiliation are prohibited. This prohibition is often at the center of debates in an increasingly tense society. Perhaps it would be a good idea to push society toward change on this level. By loosening the legal framework of secularism, we could pacify relations between citizens and society. Nevertheless, this questioning could cost us dearly because this is a foundational law of the republic and a value to which our citizens are deeply attached. Should we get involved in this debate or miss another opportunity to change society profoundly?"
 france_md.229.a: "Our society must adapt to the recognition needs of religious communities."
 france_md.229.b: "Let the citizens decide this question themselves."
 france_md.230.t: "The People Choose to Relax Secularism"
 france_md.230.d: "The debates on secularism have ended in favor of loosening the current legal framework. The wearing of religious symbols will eventually be normalized in more places than before. The various faiths will also have the right to greater representation in society while maintaining the primacy of the state and its separation from religion. This is a victory because we managed to keep the best of our old system while ensuring that the most controversial parts are relaxed. We can only hope that this breach in this foundational law does not lead to a progressive questioning of this protective framework for freedom of worship. We can trust our successors on this point."
 france_md.230.a: "This should go well."
 france_md.231.t: "The People Choose to Harden the Secularism Law"
 france_md.231.d: "We did not expect that opening a debate on secularism would produce a stricter system than the one we had. It was a risk worth taking, and we took it. Religious symbols will now be tolerated even less in public institutions. Did our ancestors foresee that we would push this far in that direction? We are here now, and we will see where these changes lead us. What is certain is that our ideal of tolerance looks further away than ever."
 france_md.231.a: "At least freedom of conscience remains guaranteed."
 france_md.235.t: "Building the Republic of Tomorrow"
 france_md.235.d: "Now that our mandate is underway, it is more than time to throw ourselves into our main project: that of the Sixth Republic. This is one of our most awaited promises, and our longevity at the head of state and in the hearts of the French depends on it. This new republic that we want debated and not imposed will be discussed for long months by its citizens. Our fellow citizens will be encouraged to put themselves forward on as many subjects as possible to trace the foundations of tomorrow's society. Perhaps we will sometimes need to involve ourselves in the debates to prevent them from drifting. But we must be careful not to appear too involved, at the risk of losing the confidence of the French people. One thing is certain: this project must be carried through to the end regardless of the path it takes. We must also do it quickly enough so as not to give the impression of delaying the democratic process. This is a great task that falls to us, but we will be up to it."
 france_md.235.a: "The Fifth Republic lives its final moments"
 france_md.236.t: "The Sixth Republic Fails"
 france_md.236.d: "For several weeks now, the debate spaces have been empty and the Sixth Republic project seems to be stalling. What happened: a war? A pandemic? No, just disinterest. By taking too long to organize the debates and make concrete the work of our involved citizens, we have caused their disinterest in the democratic question. By keeping the popular enthusiasm that we had galvanized waiting too long, we have lost their trust. Perhaps the deadlines were too tight or we wanted to do too much at once. But now our chance to change the system seems to be slipping away, and that is a shame. We can always push some of these works through as reforms, but they won't have the hoped-for scope. Worse than that, we have failed to remedy the injustice inherent in our constitution, the highest of norms that will be difficult for us to change otherwise."
 france_md.236.a: "We missed an opportunity to change the system"
 france_md.238.t: "France Places Us Under Embargo"
 france_md.238.d: "The news just broke: France has announced this morning a total embargo on our state ranging from material deliveries to simple commercial relations. But why? How could a state that was once one of our best allies, from our independence wars to the Suez crisis, have turned so far from the right path? The answer is simple. Following the election of La France Insoumise, France has started to harden its rhetoric toward us, particularly regarding the Palestinian issue. And following their election and the presence in Israel of a government that, according to them, is guilty of fueling conflicts in the region, they decided to place us under embargo. The problem does not stop there. Indeed, these zealots have taken it into their heads that they are going to convince the rest of Europe to do the same. At this point, they have launched negotiations with their European partners to place us under embargo. Our European trading partners are essential; we cannot let them slip away. We must ensure they stay on the right path."
 france_md.238.a: "They won't convince many people"
 france_md.239.t: "France Asks Us to Place the State of Israel Under Embargo"
 france_md.239.d: "Following France's decision to place the state of Israel under embargo, French diplomats have contacted us to urge us to do the same. They cite as justification the aggressive policy of the state of Israel toward its neighbors, the destabilization of the region that results, and the humanitarian situation there. These arguments are not without merit, and a significant part of our electorate supports them. However, such actions risk costing us dearly internationally, and besides we have no geopolitical interest in turning away from our Israeli ally. What should we decide?"
 france_md.239.a: "Naturally, the state of Israel must curb its expansionist policy"
 france_md.239.b: "We will not abandon our Israeli partners"

 france_md.240.t: "France Proposes to Help Stabilize Our Nation"
 france_md.240.d: "After a century of colonization and decades of neocolonialism, it appears that France's policy in Africa has changed course. They propose to help stabilize our country while ensuring they reduce their control over it. This news seems to be a blessing, and our country needs this aid more than ever. Nevertheless, it is likely that this aid comes with necessary promises of peace going hand in hand with a relaxation within the population. Our former colonizer seems to have now reflected on the consequences of its actions. Should we do the same?"
 france_md.240.a: "Aid is always welcome"
 france_md.240.b: "We don't need them; they are nothing here anymore"

 france_md.244.t: "France push for social legislation"
 france_md.244.d: "Following the victory of La France Insoumise in France, many voices are heard in our country calling for the adoption of similar laws to those adopted in France. The success of a left-wing rupture in France seems to spill over onto us and other countries of the European Union. Everywhere in our countries, movements are organizing to demand the same legislative innovations as our French neighbors. Most of these proposals especially concern human rights, social justice, and ecology. Should we accept and adopt these laws for ourselves? This could be beneficial for our fellow citizens."
 france_md.244.a: "These laws could be a good addition to our constitution"
 france_md.244.b: "No, that won't be possible"
 france_md.245.t: "France push for ecological legislation"
 france_md.245.d: "The victory of the Ecologists in France had the effect of a shockwave in Europe: one of the structuring countries of our European Union begins to urge legislation around climate change. Our European Union was formed around free trade and economic development. A narrative that is today rejected by France, which urges member states to act to protect themselves from climate change. Following this momentum, activists have already begun to relay this will even into our country. We should display a clear position before the situation continues to evolve in their direction. Should we act in favor of the ecologists and adopt part of their agenda? This would be a gesture toward the progressive forces of our country, but it certainly won't be very good for our economic development. What should we do?"
 france_md.245.a: "We should also protect ourselves from climate change"
 france_md.245.b: "Quel changement climatique ?"
 france_md.246.t: "La France écologiste arrive à la présidence de la commission"
 france_md.246.d: "Following the latest vote of Parliament to appoint the European Commission, it would seem that this time it is under the sign of ecology. Indeed, after the victory of the ecologists in France, it would seem that everything is possible for the ecologists. After multiplying statements and urging the electorates of member countries, it would seem that Europe Ecology the Greens has risen to the highest level of the European Union. This is no small development that seems to show an ever-increasing march toward ecological issues in the European Union. In addition to increasing our citizens' awareness of ecological issues, this victory for the ecologists strengthens our citizens' confidence in a Europe that takes the climate security of its citizens seriously."
 france_md.246.a: "Are we heading toward a green Europe?"
 france_md.248.t: "Ecologist deputies multiply actions in the European Parliament"
 france_md.248.d: "Since their election in France, ecologist deputies have seemingly multiplied in the European Parliament. It would seem that we are witnessing a resurgence of interest in ecological issues in the member states of the European Union. This number of deputies, which seems to be growing in importance, appears to be increasingly shaping the balance of power in the European Parliament to the point of becoming a stake for upcoming European commissions. This growing influence of ecologists on the European Union also seems to spill over into our country, where it influences not only the popularity of our ecological parties but where it strengthens confidence in a European Union more attentive to health and ecological issues."
 france_md.248.a: "They won't accomplish much in the European Parliament"
 france_md.249.t: "La France propose la création d'un fond participatif de transition écologique"
 france_md.249.d: "This time our French friends came with a new proposal on the table. They propose to us the creation of a participatory fund between European countries to help with the ecological transition in European countries. This fund should allow us to develop our energy sector with green energy if possible. They highlight this tool as a way to confirm our energy sovereignty and to model it on a sustainable basis. This tool would, however, come with a greater mobilization of our civil sector in favor of these investments. Should we participate?"
 france_md.249.a: "Where do we sign?"
 france_md.249.b: "No thanks, we're doing very well on our own"
 france_md.250.t: "France Proposes to Reduce European Carbon Emissions"
 france_md.250.d: "Another proposal from our French ecologist friends. This time they came to the table with a proposal for drastic reduction of our carbon emissions. This suggestion was made to us as well as to our European neighbors. These proposals come at a time when the EU is passing the Green Deal agreement, and the French propose to us a kind of provisional application. They argue that this decrease in the use of fossil fuels, in addition to allowing our population to breathe better, will allow us to develop the energy sovereignty of the European Union, since none of our countries is capable of producing oil. These restructurings would be costly and a long-term undertaking but could prove beneficial in case of conflict with Russia, our main source of fossil fuels. What should we do?"
 france_md.250.a: "They are right; fossil fuels make us vulnerable"
 france_md.250.b: "I don't see in what world we could be at odds with Russia"
 france_md.251.t: "Interference of France in Our Commercial Policy"
 france_md.251.d: "Our ambassador to France has reported a lengthy discussion with the French presidency. They would like us to impose regulations on our food sector. Indeed, some of these goods can be imported into Europe, and according to them, some of our products are unfit for consumption. Tensions have especially crystallized around our meat production sector, which is accused of using several growth molecules forbidden in the European Union. In case of non-regulation on our part, they risk using protectionist instruments against our goods and urging the rest of the European Union to do the same. It is obvious that these criticisms also come from the fact that France has a large agro-food industry and they see our business as unfair competition. The threat is, however, quite real. Losing our European partners would be very annoying for our future development. Furthermore, implementing regulations would allow our own people to benefit better from agriculture, but it would force our agro-food system to limit its growth. What should we decide?"
 france_md.251.a: "They are right; these regulations are necessary"
 france_md.251.b: "I put what I want in my cattle."
 france_md.252.t: "France Proposes to Establish Customs Barriers Against Brazil"
 france_md.252.d: "Our French European partner has urged us to ban the import of Brazilian products due to a dispute that opposes them. Indeed, Brazil has refused to apply the health restrictions in force in Europe to its agro-food production. Thus, food imported from South America is more likely to contain products dangerous to our citizens, while being sold at prices defying all competition. European agro-food industries call this unfair competition; financiers call this free trade. It is obvious that the criticisms are well fueled by the French food industry. But these products are nevertheless dangerous to the health of our fellow citizens. Should we ban the import of Brazilian food products or maintain the current position of the European Union, that is to say, stick to classic free trade?"
 france_md.252.a: "They are right; it's unfair competition"
 france_md.252.b: "What about free trade in all this?"
 france_md.253.t: "Interference of France in Our Commercial Policy"
 france_md.253.d: "Our ambassador to France has reported a lengthy discussion with the French presidency. They would like us to impose regulations on our manufacturing and extractive sector. Indeed, a significant portion of our production is not made according to European industrial standards and is massively imported into their country. This significant imbalance in their trade balance with us is seen as unfair competition by their industrial sectors because they have applied rules that do not exist with us. Although we condemn these criticisms, we need to trade with Europe because we have much to exchange with them. Refusing to apply their standards in our country could lead them to restrict the import of our products, which would be even more unpleasant for our economy. Conversely, allowing these regulations would allow us to produce in a more responsible way for our population and for our planet. Nevertheless, this would tend to limit the growth of our industrial sector. What should we decide?"
 france_md.253.a: "We cannot lose our European partners"
 france_md.253.b: "They need these cheap products and they know it."

 france_md.254.t: "France Proposes to Establish Customs Barriers Against China"
 france_md.254.d: "Our French European partner has urged us to ban the import of Chinese products due to a dispute that opposes them. Indeed, China has refused to apply the industrial restrictions in force in Europe to its industrial and extractive production. Thus, manufactured products and raw materials imported are more likely to have been produced under questionable conditions, while being sold at prices defying all competition. European industries call this unfair competition; financiers call this free trade. It is obvious that the criticisms are well fueled by the French industrial sector. But these products are nevertheless causing damage to the planet and to our industrial sectors. Should we ban the import of products from China or maintain the current position of the European Union, that is to say, stick to classic free trade?"
 france_md.254.a: "They are right; it's unfair competition"
 france_md.254.b: "What about free trade in all this?"
 france_md.255.t: "Interference of France in Our Commercial Policy"
 france_md.255.d: "Our ambassador to France has reported a lengthy discussion with the French presidency. They would like us to impose regulations on our oil extraction and refining sector. Indeed, a significant portion of our production is not made according to European extraction and industrial standards and is massively imported into their country. This significant imbalance in their trade balance with us is seen as unfair competition by their industrial sectors because they have applied rules that do not exist with us. Although we condemn these criticisms, we need to trade with Europe because we both need each other. Refusing to apply their standards in our country could lead them to restrict the import of our products, which would be even more unpleasant for our economy. Conversely, allowing these regulations would allow us to produce in a more responsible way for our population and for our planet. Nevertheless, this would tend to limit the growth of our oil companies. What should we decide?"
 france_md.255.a: "We cannot lose our European partners"
 france_md.255.b: "Good luck heating yourselves this winter."

 france_md.256.t: "France Proposes to Establish Customs Barriers Against Russia"
 france_md.256.d: "Our French European partner has urged us to restrict our imports of Russian hydrocarbons due to a dispute that opposes them. Indeed, Russia has refused to apply the regulations in force in Europe to its production from extraction and refining. Thus, in addition to continuing our dependence on hydrocarbons, they are produced under deplorable conditions for the planet. A few European extractive sectors call this unfair competition and suggest the reduction of our dependence on foreign powers. But perhaps we are not so threatened by Russia and this lack of standards in Russia is profitable for us in order not to have to pay too much for our hydrocarbons. Should we restrict the import of Russian hydrocarbons or maintain the current position of the European Union, that is to say, stick to classic free trade?"
 france_md.256.a: "They are right; we should restrict our fuel dependence"
 france_md.256.b: "What about free trade in all this?"
 france_md.257.t: "France Proposes the Creation of a Grand Plan Around Rail"
 france_md.257.d: "Once again our French European partners came with a new project: to focus Europe on rail. It has long been decried that the transport of goods by trucks is not optimal within the European Union. French ecologists proposed to make this transport more optimized and ecological. With the aim of redirecting a large part of our goods transport to the railway network. Except that for this, you need an efficient and complete railway network, but this is far from being the case with difficulties in moving from one country to another, as in Spain where the rail gauge is different. The circulation of goods being one of the main issues of the European Union, we must act in this direction. Furthermore, this network could also facilitate the movement of people in the European Union. However, this project could prove costly and truck transport seems to already be doing very well. Should we join this project?"
 france_md.257.a: "Count us in"
 france_md.257.b: "Je préfère mon camion"
 france_md.258.t: "The Victory of Communists in France Disrupts Our Internal Politics"
 france_md.258.d: "The victory of the French Communist Party in France had the effect of a shockwave in Europe: one of the structuring countries of our European Union begins to urge populations to join the struggle. Our European Union was formed in opposition to the communist bloc, and now one of its founding members is turning its coat. This upheaval is not without recalling the specter of the USSR that many of our countries would not wish to see return in another form. Following this momentum, activists have already begun to relay this will even into our country. We should display a clear position before the situation continues to evolve in their direction. Should we act in favor of the communists and adopt part of their agenda to cut short this wave of protest? This would be a gesture toward the progressive forces of our country, but it certainly won't be very good for our economic development. What should we do?"
 france_md.258.a: "It's not such a bad idea"
 france_md.258.b: "Better dead than red"
 france_md.259.t: "A Hand Extended by Communist France"
 france_md.259.d: "Since its creation, our state has not ceased to be under the rule of Russia or fear it. However, it seems this time aid is ready to arrive. Indeed, French diplomats have proposed to us a strategic partnership to prepare for the possibility of a conflict with Russia. For now it is not much: some papers, some equipment, but above all it is the promise of support to come. The most surprising thing is that this support comes from communist France. Which is not without recalling the oppression we suffered from the Soviets at a time when the PCF was Stalinist. Can we trust France and Europe knowing that this will only harden Russia's position toward us?"
 france_md.259.a: "This partnership is our salvation"
 france_md.259.b: "We are capable of taking care of ourselves"
 france_md.260.t: "France Proposes Its Aid Against Russia"
 france_md.260.desc: "For a few decades now our states have been free from Soviet oppression, but the resurgence of tensions from our Russian neighbor makes us fear its return. Our fears have, however, not remained unanswered. France has been offering us its aid for some time in the event of a conflict with Russia. Like us, it fears that Russian expansionism may turn again to Eastern Europe. It has also made numerous proposals ranging from equipment loans to skills exchanges to prepare us for a high-intensity conflict against Russia. This aid seemed to fall from the sky, especially from a country so far from Eastern Europe and its problems. If we accept one of their proposals, this would degrade our relations with Russia, but would allow us to have a chance in the event of invasion before NATO mobilizes. However, this is in the scenario where NATO and Europe would come to our aid. Our salvation could also lie in the fact of maintaining better relations with our Russian neighbor. Perhaps they are not so ill-intentioned?"
 france_md.260.a: "We just need equipment to keep the Russians at a distance"
 france_md.260.b: "We need training to conduct a high-intensity war"
 france_md.260.c: "We will need to produce more armaments over the long term"
 france_md.260.d: "We don't need aid; Russia is not our enemy"
 france_md.261.t: "France Proposes to Formalize Our Understanding"
 france_md.261.desc: "Following the triumph of a formerly Stalinist party in France, many questions arose around our relations with them. Indeed, this development is very favorable to us with the arrival of a potential ally in Western Europe. This ally has displayed its hostility toward the West and especially toward the Americans, as well as its ideological proximity to the former USSR, even to the point of calling its legacy positive. For some time now, France has multiplied statements in favor of our regime, denouncing American imperialism and European blindness in following them. It seems that we could do great things together if we respond favorably to their advances. Our relations could range from commercial exchanges to military and strategic partnerships if we wish. We can always refuse if we find that their former allegiance to the USSR is not sufficient to make them our allies."
 france_md.261.a: "It is always a pleasure to do business with you"
 france_md.261.b: "Indeed, we must protect ourselves from American imperialism"
 france_md.261.c: "Nothing will separate communist brotherhood"
 france_md.261.d: "We do not cooperate with communists"
 france_md.262.t: "Russia Agrees to Expand Trade Relations with Us"
 france_md.262.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Our proposals for a potential strategic partnership have, however, been set aside. It is likely that Russia does not yet grant us sufficient credit, but this first step in our direction is a good thing. It will take time, but this agreement is the beginning of the end for the imperialists."
 france_md.262.a: "Trust is Always Built Over the Long Term"
 france_md.263.t: "Russia Agrees to Establish a Military and Trade Partnership with Us"
 france_md.263.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Russia has additionally proposed to expand this partnership with a military component designed to train us jointly to be ready when the imperialist threat moves to action. They will provide us with training grounds and their expertise in the tundra, and we will give them access to our experience in desert and jungle warfare."
 france_md.263.a: "Together We Are Unstoppable"
 france_md.264.t: "Russia Proposes an Alliance"
 france_md.264.d: "We did not expect such a positive response from our Russian partner. They have proposed that we form an alliance against Western imperialism. Combining economic and geostrategic elements, this alliance will allow us to prepare economically, militarily, and diplomatically for a confrontation with the West. We will exchange our knowledge and industrial traditions, as well as our training grounds and a guarantee of mutual assistance in case of conflict. We had not concluded such an alliance with them since the First World War; perhaps it is a bad omen. This alliance is, however, most welcome and will allow us to survive in a world largely hostile to communism."
 france_md.264.a: "Western Imperialism Will Be Powerless Against Us"
 france_md.265.t: "Russia Refuses to Expand Relations with Us"
 france_md.265.d: "To the great surprise of our diplomats, Russia appears to be declining any form of cooperation with the French Republic. Divergent interests. Lack of trust. It seems that the memory of the USSR is far removed from them. Perhaps Western corruption has finally reached Russia, which was once the bulwark against American imperialism. One thing is certain: we are alone, alone in a Europe that does not understand us and will always be hostile to us."
 france_md.265.a: "We are the true communist !"
 france_md.266.t: "France clashs EU on immigration"
 france_md.266.d: "For some months now, our National Front colleagues have been in power in France. Since taking office, they have continuously criticized European migration policies, which they rightly find too lenient. Europe should not be invaded by the world's suffering. Until now, the liberal and socialist forces that have ruled the European Union have been able to silence our voice and impose their globalist propaganda. But with the triumph of our nationalist colleagues in France, one thing is clear: they can no longer ignore us. Our people, who have also embraced nationalist ideals, welcome this triumph of nationalism in Europe. This victory is also somewhat ours, and it only confirms that the voice of nationalism is the right one in a Europe that has lost its reason."
 france_md.266.a: "It's the beginning of the end for the liberals"
 france_md.267.t: "France clashs EU on immigration"
 france_md.267.d: "Since the National Front's victory in France, criticisms have been pouring in at the European Parliament. It seems Parliament has found its new reason for existing. This reversal in French politics appears to have triggered a true wave in European politics. European nationalist and Eurosceptic parties seem to be recording increasingly strong scores. At the European level, criticisms are mainly centered on immigration; European parliamentarians seem manipulated by their public opinion, which appears increasingly directed toward a nationalist vision of internal politics. These tensions crystallize especially around migration questions. Indeed, the trend is increasingly to denounce an immigration policy judged too lenient. Our electorate is no exception, and the upheavals of which France is the cause are beginning to shake our electorate as well. Should we fight against these European nationalist drifts, or should we accept the new European political orientation as it seems to be taking shape."
 france_md.267.a: "They are right tho"
 france_md.267.b: "Europe already paid the price of nationalism"
 france_md.268.t: "La France obtient gain de cause auprès de l'Union Européene"
 france_md.268.d: "It seems that French political policy has taken a new turn. While the party is historically Eurosceptic, they have today managed to reach an agreement with the European Union. By leading Euroscepticism campaigns in their country and among their European partners, they have convinced Europe of the danger they represented. As a result, they have used this power to force the leadership of the European Union to deport illegal migrants. This success in their endeavor is certainly good news for their presidency. However, the possibility of a France outside Europe seems to be receding if they appear to be getting along well with the EU leadership. Our country is also run by nationalists, so we are very aware of these sovereignty issues. We should therefore decide if we want to do as they do and obtain EU advantages in exchange for relaxing our Euroscepticism. It is probable that a significant portion of our party would not favor such a change, Euroscepticism being one of our founding values. What should we decide."
 france_md.268.a: "Why Negotiate When We Can Simply Leave Europe."
 france_md.268.b: "Thats smart, we should do the same"
 france_md.269.t: "France Advocates for a European Identity"
 france_md.269.d: "After obtaining numerous diplomatic successes in their fight against the European Union, France's leadership appears to have now abandoned their Eurosceptic rhetoric. Indeed, during recent months they have put pressure on the EU leadership to obtain advantages on migration questions. After obtaining concessions, they have begun to calm their apprehensions toward the European Union, even going so far as to promote adherence to the European Union on condition that it continues to distance itself from liberal and socialist tendencies. It seems that Europe is changing from within and that nationalist movements are multiplying there. Following this observation, it is true that a Europe of Nations appears attractive again. Such changes in nationalist parties' politics could, however, disturb some of our voters, because many are attached to the rejection of the European Union. It would, however, be interesting to have the leadership of the European Union on our side if it continues to be increasingly on our side. What should we decide."
 france_md.269.a: "This Is a Very Good Initiative"
 france_md.269.b: "One Cannot Be Both Nationalist and European at the Same Time"
 france_md.270.t: "France Proposes to Invest in Our Defense"
 france_md.270.d: "In recent years, the possibility of a new war on the European continent seems more possible than ever. Although our Union has not yet suffered any aggression, the concerning actions of our Russian neighbor seem to confirm this worry. France has come to us with an offer: they propose to help us build our military-industrial complex by investing in it. With these weapons factories, we could effectively prepare for a day when we must fight for our country and our European partners. However, allowing them to invest in our armament would make us more dependent on them, which may not be a good idea. Moreover, our pacifist population could worry about such mobilization of our capital."
 france_md.270.a: "Thank You for This Crucial Aid"
 france_md.270.b: "There Is No Reason to Worry"
 france_md.271.t: "France Recognizes Our Claims in Ukraine"
 france_md.271.d: "Since French leadership passed into the hands of the National Front, it seems they are increasingly favorable to us. Where the rest of Europe has always shown hostility toward us and our potential ambitions of expansion toward the East, France appears to have switched sides. Not only have they spoken in favor of our claims on Ukrainian territory and government, but they have also proposed to assist us in this endeavor. Putting words into action, they have proposed to give us access to their territory and ports to move troops and merchandise to help our logistics and prevent potential European embargoes. This major development marks a turning point in European politics, and this new ally confirms us on the path toward war that we might undertake."
 france_md.271.a: "The First Domino Falls"
 france_md.271.b: "We Have No Intention to Fight Our Ukrainian Brothers"
 france_md.272.t: "France Proposes to Expand Our Cooperation"
 france_md.272.desc: "After many statements and agreements in our favor, France seems decided to expand relations with us. This development is very favorable with the arrival of a potential ally in Western Europe. This ally has displayed hostility to the decadent values of the European Union and more broadly to a significant portion of the West. In contrast, they seem to present us as defenders of morality and faith in Europe and the world. It seems we could accomplish great things together if we respond favorably to their advances. Our relations could progress from trade exchanges to military and strategic partnership if we wish. We can always refuse if we do not see sufficient potential in them to make them allies, or if we still count on maintaining good relations with this decadent Europe."
 france_md.272.a: "Our Economy Will Benefit"
 france_md.272.b: "Our Economy and Our Armies Will Benefit"
 france_md.272.c: "The World Will Tremble Before Us"
 france_md.272.d: "We Do Not Intend to Cooperate With France"
 france_md.273.t: "Russia Agrees to Expand Trade Relations with Us"
 france_md.273.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Our proposals for a potential strategic partnership have, however, been set aside. It is likely that Russia does not yet grant us sufficient credit, but this first step in our direction is a good thing. It will take time, but this agreement is the beginning of the end for the ultra-globalists."
 france_md.273.a: "Trust is Always Built Over the Long Term"
 france_md.274.t: "Russia Agrees to Establish a Military and Trade Partnership with Us"
 france_md.274.d: "Russia has responded positively to our proposal to expand relations. They have offered to share their industrial and extractive knowledge with us on the condition that we help them establish their nuclear and tertiary sectors. This is a major advance in our relations with Russia. Russia has additionally proposed to expand this partnership with a military component designed to train us jointly to be ready when the ultra-globalist threat moves to action. They will provide us with training grounds and their expertise in the tundra, and we will give them access to our experience in desert and jungle warfare."
 france_md.274.a: "Together We Are Unstoppable"
 france_md.275.t: "Russia Proposes an Alliance"
 france_md.275.d: "We did not expect such a positive response from our Russian partner. Indeed, they have proposed that we form an alliance guaranteeing mutual assistance in case of aggression by foreign powers. Combining economic and geostrategic elements, this alliance will allow us to prepare economically, militarily, and diplomatically for a confrontation with the rest of the world. This alliance will give us the strength to fight to the end to defend ourselves against ultra-globalism in which our neighbors have sunk. We had not concluded such an alliance with them since the First World War; perhaps it is a bad omen. This alliance is, however, most welcome and a major success for our politics."
 france_md.275.a: "We Are Protected Against Liberal Decadence"
 france_md.276.t: "Russia Refuses to Expand Relations with Us"
 france_md.276.d: "To the great surprise of our diplomats, Russia appears to be declining any form of cooperation with the French Republic. Divergent interests. Lack of trust. Perhaps Western corruption has finally reached Russia, which was once strong and proud. This reversal is not, however, dramatic; perhaps we did not have so much in common after all. We will surely find other nationalist allies on the continent."
 france_md.276.a: "That's a shame"
 france_md.277.t: "France Proposes to Protect Us Against Russian Influence"
 france_md.277.d: "For several years, the Russians appear to have invested in the African continent, offering their services to fight against the jihadist and independence insurrections flourishing in the countries of former French Africa. France and Russia are clearly in a conflict of influence on this continent. With them, values clash: Western liberalism and authoritarianism. In this situation where we African countries are targets of Russian influence, which can sometimes worsen tensions between regional minorities, France proposes to help us reduce their presence by assisting us in their stead. However, this would mean drawing closer to our former colonizers, which may not be a good idea. What should we decide."
 france_md.277.a: "They Are Right; Russian Influence Is Dangerous"
 france_md.277.b: "Our Former Colonizers. Certainly Not"
 france_md.278.t: "The French Commune Leaves the European Union"
 france_md.278.d: "A few months ago, France announced the end of the republic in favor of the French Commune, a new entity founded on revolutionary communism. We knew at that moment that they would not delay in considering leaving our European Union. Indeed, it is built around the values of economic liberalism, which is the opposite of the new orientation that France has begun to follow. This is therefore what has just occurred; France has announced its exit from the European Union and from all its treaties. This decision takes immediate effect, and it does not seem that they have displayed any intention to negotiate on this matter. The economic consequences are clear. This change augurs nothing good for the future of our continent, because the first goal of the European Union was to prevent new conflicts from emerging in Europe. We can, however, be reassured by the fact that the economic consequences of this exit will quickly be felt. But this respite will be short-lived. We do not know what their intentions are, but this abrupt exit combined with a revolutionary ideology like theirs will sooner or later have to be fought."
 france_md.278.a: "That was to be expected"
 france_md.279.t: "The French Commune Pressures Our Politics"
 france_md.279.d: "As we predicted, the French Commune's exit from the European Union was not trivial; barely out of it, they concentrated their efforts on reviving their economy so that it should be operational again soon. Their success in their revolutionary enterprise is beginning to be admired by a part of our country that lacks liberal European values in their heart. These agitators are widely helped and trained by French intelligence agencies, which have transformed themselves into an international propaganda service. We should take this situation very seriously to avoid ending up like them. Two solutions are available to us. We can fight with all our might by promoting European values and the peace that goes with them; our citizens will be sensitive to this peaceful ideal. Conversely, we can go in their direction and adopt certain measures in our own style to parasitize future violent developments against us, but this would mean siding with communist and anti-European ideology. We must remain vigilant because our decisions will not be without consequences."
 france_md.279.a: "No Point Fighting If We Can Beat Them at Their Own Game"
 france_md.279.b: "We Must Fight Against These Extremists"
 france_md.280.t: "The French Commune Invites Us to a Summit on World Revolution"
 france_md.280.d: "After taking power in France and securing their control over their country, French revolutionary communists appear to have set out to export their revolution. They therefore invite us to a great summit to discuss the possibility of a world revolution. We have been selected to participate because our government positioned itself in favor of communist values dear to the newly established French Commune. It seems they are determined to bring communist values to the rest of the world, and this invitation is surely a test to see if we could follow them in their endeavor. However, this world revolution will not happen without wars, surely bloody given the number of great powers that will never accept this revolution. So it is risky to embark on this dubious adventure that will likely lead them to carnage. Communist ideals and world revolution are very dear to us, but would we be ready to risk the lives of our citizens to achieve it."
 france_md.280.a: "Count us in, long live the revolution"
 france_md.280.b: "History Has Proven That Freedom Is Not Brought at Gunpoint"
 france_md.281.t: "The Emperor Undertakes Deep Reforms of the French Armed Forces"
 france_md.281.d: "Our Emperor has undertaken deep reforms in our armed forces. These reforms aim to transform our armed forces and make them more adaptable to the forms of warfare we will be led to conduct. However, to successfully carry out these projects, we must not only invest significant money in the refactoring of our system but also devote all our efforts to it, which means setting aside the immediate preparation of our army. In other words, these reforms will make us vulnerable for a time but will allow us thereafter to pursue the development of our armed forces. This first set of reforms concerns the leadership itself of our army, which the Emperor found inadequate for the reforms he wishes to undertake later. The refactoring of the command chain should take us somewhat less than a year. It will therefore be a year during which we must try to limit our military operations, but it is a considerable gain for the future."
 france_md.281.a: "These Reforms Are Necessary"
 france_md.282.t: "Our General Staff Reforms Are Complete"
 france_md.282.d: "Our reforms have been completed in record time. There were obviously some who resisted, but most of our general staff went along with it and accepted the refactoring of the command chain. These reforms, beyond facilitating the efficiency of our general staff, promote the arrival of new talented generals, at the cost, of course, of more advanced training. It is not just a reform around the leadership of our army, but also the first brick in the transformation of our armed forces. During the coming months, new reforms will be undertaken to define the means and objectives of our armed forces to successfully carry out their operations. These future reforms will allow us to establish a clearer order book for our military-industrial complex. In any case, these reforms were a long-term gamble, and we appear to have won it."
 france_md.282.a: "We Have Held Firm. Now We Can Move On to More Important Matters"
 france_md.283.t: "The Backbone of Our Army"
 france_md.283.d: "The first set of reforms concerning our approach to the battlefield has just arrived. This set of reforms will allow us to define what type of strategy we should employ in the eventuality of a large-scale conflict against one of our future adversaries. In the face of this eventuality, two approaches emerge. The first would consist of centering our offensive doctrine and equipment orders around assault tanks. Indeed, our armies, since their refactoring after the Second World War, have always employed very offensive strategies centered on mobility and maneuver. We could thus continue in this momentum by relying on the objective of rapid target capture through greater representation of armored vehicles in our armies. This will pass through greater ease in ordering tanks and the use of a doctrine more centered around armored warfare. The second option would rather focus on infantry. By providing more equipment to infantry components and reinforcing their role in our formations, we should be able to propose a solid response to eventual enemy counter-attacks while relying on our superior firepower to overcome enemy forces. It would be a less risky approach but one that would call into question our past doctrines."
 france_md.283.a: "Infantry Has Always Played a Central Role; It Is the Safest Approach"
 france_md.283.b: "Our army has been built around a war of movement since the Cold War, and there is no reason for that to change"
 france_md.284.t: "Our Firepower"
 france_md.284.d: "A final wave of reform regarding our approach to firepower has just arrived. Today, debates center on which means we should employ to destroy enemy armed forces at range. So far, we have maintained a flexible approach with both highly effective artillery and aviation. However, the challenges ahead require us to specialize; this would greatly help our army focus on a single doctrine, including how we deliver destruction to enemy forces. The first recommended approach would be to center our firepower on heavy artillery use. Indeed, we have very mobile and effective options like the Caesar cannons that have earned us renown abroad. These weapons, if we could acquire enough of them, would allow us to bombard enemy troops without fear of retaliation due to their rapid deployment speed, which is their strength. Our artillery could therefore bring us victory with minimal risk. However, it is not only our artillery that performs exceptionally. Indeed, our air forces have quite interesting tools, with highly versatile aircraft that will allow us to bring light to our adversaries. Many projects have also been conducted around helicopters, which are a formidable strike force. However, these tools are very vulnerable to air defense. We could face serious problems if our adversary managed to seize control of airspace. We must therefore choose between low risk or significant firepower."
 france_md.284.a: "Artillery is more cost-effective"
 france_md.284.b: "Our aviation is highly effective; it would be foolish not to use it"
 france_md.285.t: "Our Position Regarding the European Union"
 france_md.285.d: "For too long, our nation prioritized the European Union over its own development. Setting aside our development and security led us to an unprecedented democratic crisis, from which we nevertheless emerged victorious. But today we have the opportunity to reverse this trend. Freed from past democratic institutions, we are free to make our own choices and can leave the European Union if we wish. However, leaving overnight could strike a severe blow to our nation just recovering from liberal oppression. Should we negotiate with the European Union to monetize our return among them, or should we seal our break with them by completing our departure from the European Union?"
 france_md.285.a: "Empty Brussels's pockets or we are leaving!"
 france_md.285.b: "The European Union has done us enough harm. Frexit!"
 france_md.286.t: "France Leaves the European Union"
 france_md.286.d: "Following a major upheaval in our French partner state, nationalist movements claiming Bonapartism have seized control of France. Immediately, they have worked to destroy the remnants of pro-European sentiment within France. Now they announce France's departure from the European Union. They have shown categorical refusal to negotiate. The victory of these nationalist movements is not merely a fissure in the European construction project, but a model for Eurosceptics across the Union."
 france_md.286.a: "Nationalism is a danger to our European Union"
 france_md.287.t: "The European Union Bends to Our Demands"
 france_md.287.d: "It appears we made the right decision in negotiating our return to European institutions. Not only have we avoided an economic crisis, but we have also extracted funds from the European Central Bank. This is what one might call a successful financial operation! There is no doubt we will eventually face our partners on the battlefield, but let them slumber in delusion. One thing is certain: our adversaries must be furious that our negotiations with the ECB succeeded."
 france_md.287.a: "Our time will come"
 france_md.288.t: "Our Negotiations Fail"
 france_md.288.d: "Our attempt was bold but proved unsuccessful. Perhaps we asked too much, or failed to inspire confidence in our European interlocutors. In any case, the ECB refused to pay us to remain. That is their decision, and it does not serve our interests, but that is the reality. Now we must decide whether to remain in the European Union. Departure would be economically costly, but remaining would confirm our failure before the Union. In any case, we will eventually face them on the battlefield, with or without European Union membership. The sole question is whether the monetary cost of departure exceeds the moral cost of staying."
 france_md.288.a: "Leaving the Union would cost us too much; for now, we cannot afford it"
 france_md.288.b: "We have nothing more to do here"
 france_md.289.t: "France Secures an Arrangement with the European Union"
 france_md.289.d: "Following numerous diplomatic pressures and threats to leave the Union, France has finally managed to bend the European Union to its will. Bonapartist France's latest tactic was to monetize its participation in the European Union. The Union therefore eventually agreed to provide additional benefits to France to keep them from departing. However, this agreement is disastrous for us and our European partners. There is no guarantee that France will remain well-behaved within the European Union now that revenge-obsessed nationalists have tightened their grip on the country. France may be an essential member of the European Union, but it is today a danger to the entire continent. To add insult to injury, our people must now pay the price for our French partners' whims."
 france_md.289.a: "Was this really a good idea?"
 france_md.290.t: "L'aube d'un nouvel empire"
 france_md.290.d: "After months of internal turmoil and constitutional reform, we have succeeded. We have successfully eradicated the institutions and power of the shameful republic. Now France must become what it should never have ceased to be: an Empire! To celebrate the empire's return, we have prepared a grand celebration broadcast throughout France. Through this event, our people will grasp our strength and our determination to restore France to its former glory. This celebration will also send a clear message to our adversaries: a demonstration of power. Now they cannot ignore us; their days are numbered before France comes to claim its due. This time, no coalition can stop us!"
 france_md.290.a: "The Empire Will Reclaim Its Former Greatness!"
 france_md.291.t: "France Calls for a Union of Nationalisms"
 france_md.291.d: "The victory of our nationalist comrades in France has reverberated as an earthquake across Europe. That a pillar of the European Union like them embraces nationalism was enough to provoke Brussels's fury. The Bonapartes have therefore immediately pivoted their foreign policy toward opposing the European Union, its values, and its future. But now they have extended their hand to us. Specifically because they believe our government shares sufficient characteristics with their leadership. They therefore propose we unite our voices to bring down the European Union. It stands to reason that the EU is a major enemy of France and that they will find themselves battling European Union powers. We would therefore be doing them a favor by destabilizing the European Union. A tacit alliance with France seems attractive, but nothing guarantees they will not turn on us afterward. We must therefore carefully weigh the consequences of our actions."
 france_md.291.a: "They are on the right path; we would do well to join them"
 france_md.291.b: "We do not share this vision of nationalism..."
 france_md.292.t: "Bonapartist France Pressures Our Politics"
 france_md.292.d: "As we anticipated, the nationalist and anti-European rhetoric lately developed by France was no accident. Since the Bonapartes came to power in France, the European Union has become the new target for nationalists everywhere. Having openly declared its intention to fight what it deems enemies, France has clearly marked the Union as the target to be struck. In the wake of their victory and shows of strength, segments of our population now fear war's return to Europe. Others, never strongly pro-European, have joined the nationalist cause and conducted destabilizing operations against our government. These agitators are widely supported and trained by French intelligence services, now functioning as an international propaganda apparatus. We must take this situation with the utmost seriousness, for their goal is to divide us. The European Union must remain united!"
 france_md.292.a: "Europe will ultimately defeat nationalism"
 france_md.293.t: "Entourés d'ennemis"
 france_md.293.d: "As in the days of revolutionary wars, it appears necessary changes in our nation are breeding resentment. While we rebuild, our enemies already conspire against us and prepare for confrontation. They are right to be cautious, for we are ready to reclaim our territories by force if needed. In any case, we stand isolated against a Europe that rightly views us as a threat. For now, we must above all prepare for years of conflict with our adversaries. We may be able to forge alliances, but we must chiefly rely on ourselves. But one thing is certain: once we have vanquished the Europeanist and Atlanticist threat, we will be unstoppable."
 france_md.293.a: "How many coalitions did Napoleon defeat? We will make short work of them"
 france_md.294.t: "France Proposes We Join Its Alliance"
 france_md.294.d: "We have just received a proposal from French diplomats. Observing that they are isolated in Europe and surrounded by enemies of their own making, the Bonapartes have appealed to us. Specifically because they regard our nation as sufficiently respectable to merit alliance with them. It goes without saying that this is no mere defensive pact and that joining would quickly entangle us in conflicts not necessarily our own. However, this alliance could serve us well in confronting our own adversaries, and all else being equal, it is better to be with them than against them. An alliance with France seems enticing, but perhaps joining them would be a ticket straight to hell, since they will soon bring war to Europe."
 france_md.294.a: "We can benefit from this alliance"
 france_md.294.b: "Certainly not"
 france_md.295.t: "France Proposes We Join Its Comintern"
 france_md.295.d: "For some time now, the revolutionary communist factions in power in France appear to have developed an appetite for conflict. Adopting the goal of worldwide revolution, they have begun recruiting other nations to their cause. Their objective? To export revolution and communist ideals across the globe by any means necessary. To achieve this, they need allies, which is why they have called upon us. Particularly because our nation too has embraced socialism in recent times. For us, a communist party devoted to fighting capitalism and fascism, this alliance is clearly a windfall. It would provide us the opportunity to defeat these ideologies on the field of battle. However, it bears noting that this is no mere defensive pact and that joining would quickly draw us into conflicts not necessarily of our concern."
 france_md.295.a: "They are right; it is time to export the revolution"
 france_md.295.b: "Certainly not"
 france_md.296.t: "French people urged us to attack"
 france_md.296.d: "We might have guessed that our relentless nationalist propaganda would produce such effects. After months spent shaping public opinion, we convinced them that rival powers sought our destruction and that survival required confronting them before they struck. This is why demonstrations of anger toward foreign powers have erupted across the country in recent weeks. Public opinion is seething, and the population expects us to teach our adversaries a harsh lesson. Moreover, numerous militias have gathered at the borders, ready to engage our neighbors' security forces. This enthusiasm serves us well, as we anticipated eventual confrontation with these powers. Yet we must be careful not to frighten these foreign powers excessively, lest they ally prematurely against us. Two paths lie before us: we can ride this wave of enthusiasm and support these militias in their actions. This would secure the total backing of our population for the next war. Alternatively, we could dampen their fervor and redirect their energy elsewhere, such as toward increased weapons production. What should we decide?"
 france_md.296.a: "It is time to settle accounts"
 france_md.296.b: "Our time will come"
 france_md.297.t: "Skirmishes in the Channel Tunnel"
 france_md.297.d: "A terrible crisis has befallen us. Ultra-nationalist French militias, emboldened by their new Bonapartist leader, have attacked our citizens and police forces around the Channel Tunnel. These attacks claimed roughly twenty lives and left several dozen wounded. We have learned we were not alone in their targeting. Last night, these groups struck most of France's neighboring countries. What these nations share is that France has openly declared its intention to fight them. These attacks are clearly no isolated incidents but a harbinger that confrontation with the new Napoleonic Empire is inevitable. We are plainly the top target for destruction, and we cannot disregard this threat. Two options present themselves as this crisis unfolds across Europe: we can impede Bonapartist progress by shielding their most immediate targets from attack. Yet protecting others is pointless if we cannot defend them ourselves. Perhaps we should instead focus on strengthening our own defenses and preparing for direct conflict with France."
 france_md.297.a: "We must contain French aggression by protecting their potential targets"
 france_md.297.b: "We must prepare for conflict with them"
 france_md.298.t: "Skirmishes at the French Border"
 france_md.298.d: "A terrible crisis has befallen us. Ultra-nationalist French militias, emboldened by their new Bonapartist leader, have attacked our citizens and police forces around our shared border. These attacks claimed roughly fifteen lives and wounded several dozen. We have learned we were not their only targets. Last night, alongside us, these groups struck most of France's neighboring countries. What unites these nations is their status as potential targets of Bonapartist expansionism. These attacks are plainly no isolated incidents but a sign that confrontation with the new Napoleonic Empire is inevitable. We are clearly the top priority for destruction, and we cannot disregard this threat. As this crisis spreads across Europe, multiple options emerge: we can appeal to the United Kingdom, which as Napoleon's primary target has shown the greatest willingness to resist. Yet there is no certainty they will come to our aid. Perhaps we should instead prioritize our own defenses and prepare for direct conflict with France. Alternatively, we could reassure our citizens that our current forces are sufficient to keep the French at bay and that panic is unwarranted."
 france_md.298.a: "We must contain French aggression by protecting their potential targets"
 france_md.298.b: "We must prepare for conflict with them"
 france_md.298.c: "There is no reason to worry"
 france_md.299.t: "[FROM.GetName] Calls Us for Aid"
 france_md.299.d: "Faced with the new imminent threat posed by France, other attacked nations were not slow to respond. Like many others, [FROM.GetName] calls upon us for aid to defend against potential invasion. Admittedly, they will likely face attack sooner than we will. Yet are we truly prepared to protect them? Should we sacrifice months of our preparation for [FROM.GetName]? This crisis has upended our foreign policy and aid requests are streaming in. We face two courses: we can aid [FROM.GetName] by adding them to our strategic partnership, or we can let them face Napoleon alone. After all, there is merit in allowing him to wear himself down against an opponent like [FROM.GetName]."
 france_md.299.a: "We must protect them"
 france_md.299.b: "Why die for [FROM.GetName]"
 france_md.300.t: "France Proposes We Join Its Alliance"
 france_md.300.d: "It appears France's Bonapartist leader has drawn the ire of the rest of Europe. He has loudly declared his readiness to wage war against them to restore his nation's former greatness. Yet now they extend their hand to us. France proposes we join its alliance to participate in the conquest of Europe. To persuade us, French diplomats have invoked our history, reminding us that Napoleon aided the Polish people in their struggle against Slavic and Germanic oppression. They thus propose renewing this pact with us. Such an alliance would protect us against other aggressors, notably the ever-present Russian threat. But it could also drag us into unwinnable wars. This alliance represents either a golden ticket to Polish greatness or a one-way journey to ruin. Should we join them?"
 france_md.300.a: "We will be the new Dombrowski and Kniaziewicz!"
 france_md.300.b: "Why die for Paris? I ask you..."
 france_md.301.t: "France Proposes We Join Its Alliance"
 france_md.301.d: "It appears France's Bonapartist leader has drawn the ire of the rest of Europe. He has loudly declared his readiness to wage war against them to restore his nation's former greatness. Yet now they extend their hand to us. France proposes we join its alliance to participate in the conquest of Europe. To persuade us, French diplomats have invoked our history, recalling that our royal house descends from Jean Baptiste Bernadotte, a marshal of Napoleon. They thus propose uniting our efforts in memory of our ancestors. Such an alliance would protect us against other aggressors, notably the ever-present Russian threat. But it could also drag us into unwinnable wars. This alliance represents either a golden ticket to Swedish greatness or a one-way journey to ruin. Should we join them?"
 france_md.301.a: "It is time to return to service"
 france_md.301.b: "The past is the past"
 france_md.302.t: "USA friend or foe"
 france_md.302.desc: "Having sent alliance proposals to the few potential allies we can find in Europe, one question remains. How should we deal with the United States? During the era of Revolution and Napoleon, we maintained good relations with them. We even aided them in throwing off English rule. The Napoleonic era thus holds no bitter memories for them; a time when we shared a common hatred of England. However, things have changed greatly. World War II and American conduct in Europe have often run counter to French interests, as we have never accepted their dominion. While we maintained good relations with the USA until our rise to power, they may now block our path to hegemony. What stance should we adopt toward them?"
 france_md.302.a: "Propose they join our alliance"
 france_md.302.b: "Their commercial power will help us overcome international sanctions"
 france_md.302.c: "Prepare for confrontation with them"
 france_md.302.d: "Securing Europe remains our priority"
 france_md.303.t: "France Proposes an Alliance to Us"
 france_md.303.d: "It appears France's Bonapartist leader has drawn the ire of the rest of Europe. He has loudly proclaimed his readiness to wage war against them to restore his nation's former greatness. Yet now they extend their hand to us. France proposes we join its alliance on the condition that they will not interfere in our affairs. French diplomats emphasized that Napoleon and revolutionary France have always been vital allies to our nation. However, this alliance poses a more pressing question. Do we truly wish to join them in their campaign against other European powers? France appears to have devoted itself to fighting other European powers, many of whom are also our allies. If they want to march to war and expend themselves in Eastern Europe and Russia, their hunger for conquest does not end there. France has declared the United Kingdom a priority target. Yet the United Kingdom is a historical ally and a precious partner. Should we join France and risk finding ourselves at war with the United Kingdom?"
 france_md.303.a: "They can count on us"
 france_md.303.b: "The English are our allies above all"
 france_md.304.t: "France Proposes Expanding Our Trade Relations"
 france_md.304.d: "It appears that France's Bonapartist leader has drawn the wrath of the rest of Europe. He loudly declared his readiness to fight them to restore his country's greatness. But now they extend their hand to us. France proposes to expand our trade relations. Their economy suffers from hostility toward their former European partners, and they need our expertise and industrial power more than ever. French diplomats have emphasized that Napoleon and Revolutionary France were always precious allies of our country. However, this alliance raises more direct questions. Do we wish to antagonize other European powers by supporting French war efforts? France seems to have devoted its existence to fighting other European powers, most of whom are also our allies. Although we could benefit from these bilateral agreements, our allies might view it poorly. What should we decide?"
 france_md.304.a: "More trade is always good"
 france_md.304.b: "We will not be their accomplices"
 france_md.305.t: "France Leaves the European Union"
 france_md.305.d: "Following a major crisis among our French partners. Nationalist movements calling for a return to absolute monarchy have seized control of the French state. Since then, they have set about destroying what remained of pro-European sentiment in France. Now they announce France's withdrawal from the European Union. They have displayed a categorical refusal to negotiate. The victory of these nationalist movements is not only a crack in European unity but also a model for all Eurosceptics within the Union."
 france_md.305.a: "Nationalism is a threat to our European Union"
 france_md.306.t: "Monarchists Triumph in France"
 france_md.306.d: "The victory of our nationalist comrades in France has been felt as an earthquake across all of Europe. That a pillar of the European Union like them would take the path of nationalism was enough to enrage Brussels. The Royalists immediately oriented their foreign policy toward opposition to the European Union, its values, and its future. We nationalists too have had to contend with a European Union that wanted us to disappear, to minimize our importance, and to silence us. Everywhere in Europe, France's example seems to fuel opposition to European bureaucracy, which can no longer ignore us. Our country is already committed to the monarchist cause, and we are spared these disorders, which is all the better. France's victory is therefore a victory for us nationalists of Europe."
 france_md.306.a: "A Victory for Nationalism in Europe"
 france_md.307.t: "The French Kingdom Pressures Our Politics"
 france_md.307.d: "As we predicted, the nationalist and anti-European rhetoric recently developed by France was no accident. Since the monarchy's victory in France, the European Union has become the new target of nationalists everywhere. France has shown a clear willingness to wage war against those it considers enemies, making the European Union its target. Following their victory and displays of strength, part of our population has begun to panic at the thought of war returning to Europe. Others, already lukewarm toward Europe, have sided with the nationalists and conducted destabilizing actions against our government. These agitators are widely aided and trained by French intelligence agencies that have become international propaganda services. We must take this situation very seriously, for their goal is to divide us. The European Union must remain united!"
 france_md.307.a: "Europe Will Eventually Defeat Nationalism"
 france_md.308.t: "France Invites Us to Join Their Crusade"
 france_md.308.d: "The victory of our nationalist comrades in France has been felt as an earthquake across all of Europe. Beyond Europe, which they see as their adversary, the French kingdom has declared it will do everything to protect the Christian faith in Europe and the world. It sees Western democracy as a perversion of the past order that has led people away from their religion and calls for the Church's return to power. While it is not yet entirely clear who their first adversaries will be, it is clear that this call was partly intended for us, as our country has a Christian majority. They propose to unite our forces to restore Christianity to its former power and fight those who would insult it. This invitation could allow us to gain power while serving our Lord. However, this call guarantees a return to war in Europe, which is not necessarily a good thing."
 france_md.308.a: "We will join their crusade"
 france_md.308.b: "We do not share this vision of Christianity"
 france_md.309.t: "Prepare for the Twentieth Crusade"
 france_md.309.d: "For several weeks, our king has displayed his unshakeable determination to reclaim the Holy Land. However, the matter seems risky because we no longer have a foothold in the region. While we maintain cordial relations with our Lebanese partners, their government is too unstable and under Iranian influence to accomplish anything. Lebanon would, however, make a very good landing point for our crusade, as it contains a significant Maronite Christian minority. We have two options to restore order there. We could prepare for an amphibious intervention or apply political pressure until they crack. By preparing an intervention, we could use the opportunity to strengthen our navy. However, we would be seen as aggressors against an innocent state. The political approach seems less risky, though it is not guaranteed to work."
 france_md.309.a: "We should first ask them (politely, of course)"
 france_md.309.b: "Those who are not with us are in any case against us"
 france_md.310.t: "The French Kingdom Threatens Our Independence"
 france_md.310.d: "A few months ago, the French Kingdom announced its intention to reconquer the Holy Land. They are preparing to launch a Tenth Crusade toward Jerusalem. For this, they need a foothold near Jerusalem, and it appears we are in their sights due to the strong Maronite minority in our country. The French are therefore working to undermine our legitimacy and are pressuring Maronites to overthrow our government. To this end, they have sent many Franco-Lebanese agitators. Despite our fall, French control could be a good thing. It would protect us from interference by Israel and Hezbollah in our politics. But this protection would surely mean our country would be torn apart again in fratricidal wars. Is this really what we want?"
 france_md.310.a: "They will protect us against our belligerent neighbors"
 france_md.310.b: "They will only bring more conflict!"
 france_md.311.t: "Lebanon Bows to Our Demands"
 france_md.311.d: "This morning is a great day. Following our pressure, the Lebanese government announced its surrender to the demands of Maronite Christian protesters. Immediately thereafter, a government with a Maronite majority was appointed and placed Lebanon under our protection. We made the right choice in privileging diplomacy; the Western powers will find nothing to object to since it weakens Iran's influence. We have maneuvered well geopolitically. All that remains is to prepare for a land conflict against those who would stand between us and the Kingdom of Heaven."
 france_md.311.a: "Jerusalem is within our grasp"
 france_md.312.t: "Lebanon Refuses Us"
 france_md.312.d: "This morning Lebanon publicly announced its refusal to yield to French pressure on its politics. Our agitators apparently had no effect, and Maronite support for our cause was not sufficient. Our failure likely stems from Lebanon remaining firmly under the control of Iran and Hezbollah. Lebanon's refusal to work with us is not the end, however. We can always return to them when we need to, and this time they will not be able to resist. However, our political efforts seem to have failed. Perhaps we should focus on how we pressure others and strengthen our international diplomacy, as we may need it in the future."
 france_md.312.a: "Prepare for a naval intervention"
 france_md.312.b: "We must strengthen our diplomacy; it does not seem to be our strength"
 france_md.313.t: "The French Commune Demands Our Government's Fall"
 france_md.313.d: "A few months ago, the French Commune announced its desire to bring revolution to the entire world. It is with this in mind that they seem today to be pressuring us. They have infiltrated agitators from their propaganda service into our population and seem to incite our citizens to join their cause. Groups of protesters and communist extremists have already organized in our country. Their actions are not the only threat. French envoys have warned us of the possibility of French intervention if we do not yield to these agitators. We could always surrender and join France, even if it means losing our independence. Nevertheless, nothing tells us that they would intervene, and we can always imprison the few extremists who threaten our government. What should we do?"
 france_md.313.a: "Long live the revolution"
 france_md.313.b: "Better dead than red"
 france_md.314.t: "[FROM.GetName] Joins the Worldwide Revolution"
 france_md.314.d: "[FROM.GetName] has just announced the fall of its government to our protests and diplomatic pressure. This is excellent news for us; a new power joins the revolution, and all without bloodshed. Other capitalist powers have announced their shock at this dramatic change in world order. They may protest, but they cannot stand against the will of the people. Revolution will eventually come for them too. [FROM.GetName]'s fall is only the beginning; others will follow."
 france_md.314.a: "The Revolution Grows"
 france_md.315.t: "[FROM.GetName] Refuses the People's Will"
 france_md.315.d: "The protests demanding [FROM.GetName]'s government's fall seem to have dissipated. Indeed, the government of [FROM.GetName] violently repressed them and refused any compromise. If this outburst seems to have overcome the people's will, perhaps we should involve ourselves more in the revolution in [FROM.GetName]. Our forces are ready to intervene militarily to enforce the sovereign people's will. However, this intervention could degenerate into a large-scale conflict. Should we intervene or not?"
 france_md.315.a: "The Revolution Will Come Whether They Like It or Not"
 france_md.315.b: "We Will Return"
 france_md.316.t: "The Victorious Commune in Europe"
 france_md.316.d: "This is a great day for our Commune. We have succeeded in bringing revolution to all of Europe. Since the Soviet Union's fall, Europe was nonetheless full of capitalists and budding nationalists. But nothing stopped us; not sanctions, not bombings, not the wars we had to wage to bring the proletariat to power throughout Europe. Of course, sometimes we had to teach oppressors a lesson with cannons and kill innocents, but the triumph of revolution justifies the means. On this great day when the people's army parades through Paris's streets, Europe begins to rebuild on sound bases, far from the temptations of capitalism. But our journey does not stop here. The next stage is to realize the dream of us internationalists. Now that Europe's proletariats are unified, we will create a great federation where everyone will feel at home. We will realize Europe's unity, and this time we will not crush peoples under tanks or under ultra-liberalism."
 france_md.316.a: "The Internationale will be humanity"
 france_md.317.t: "Trought the Ardennes"
 france_md.317.d: "Our emperor has been discussing the possibility of invading the Benelux for some time. These countries are of capital importance to our nascent empire. Belgium contains a significant Francophone minority in Wallonia and represents the European Union's main adversary from our perspective. The Benelux is both the nerve center of the European Union and a set of poorly defended countries. They would be a perfect first target for our new empire and a first step toward restoring our legitimate borders. These three countries also contain many riches that would be interesting to control. However, the Benelux's importance in our strategy of rallying Francophone minorities forces us to take more precautions than with any other country. We intend to occupy these lands permanently as they are legitimately ours. We must therefore avoid destroying everything. To this end, the emperor strongly recommended avoiding bombing. In any case, we should not need it to bring down these small countries. However, we are strongly advised to attack quickly, as our enemies might prepare to face us. In any case, it is time to reclaim the cradle of the Frankish nation extending beyond the Ardennes."
 france_md.317.a: "They stand no chance"
 france_md.318.t: "The Second Spanish Campaign"
 france_md.318.d: "Our emperor has just transmitted new orders for us to prepare for new conquests. This time it concerns the Iberian Peninsula. These countries are of capital importance to our nascent empire. Securing our western flank is crucial because we will eventually have to undertake a march eastward toward Moscow. Spain's conquest would bring us closer to Gibraltar, an essential point for controlling the Mediterranean and thus securing our Mediterranean coast. These countries are therefore of great strategic importance to our empire. However, conquering them could prove more complicated than expected. These countries are very mountainous, which constitutes considerable defensive advantage. Our emperor therefore recommended a slow and sure invasion. He also recommended adaptation to difficult terrain. To this end, he has planned to mobilize many Alpine hunters to support our troops during mountain combat. However, we are strongly advised to attack quickly, as our enemies may also prepare to face us. However, once the terrain is conquered, it must be held, and one reason for Napoleon's defeat was the significant resistance of the Spanish people. We must therefore this time establish more stable client states or harden our occupation forces. Both eventualities have been foreseen, and our police forces are ready to fight the insurrectionist threat."
 france_md.318.a: "This Time We Will Watch Them Closely"
 france_md.319.t: "Across the Rhines"
 france_md.319.d: "Our emperor has just designated our next adversary. This time it is Germany. While our original enemy has always been England, Germany represents a threat to our new Empire. This country has played the role of Europe's economic heart for some decades and is strongly attached to the idea of Europe that displeases us so much. Conflict with Germany was therefore inevitable in any case. Moreover, it is the first step in our march eastward toward Moscow, our ultimate adversary. We have no choice but to face them. Facing them is something we know well. From Napoleon's lightning campaign against Prussia to the disaster of Sedan followed by two world wars that bled Europe white. For better or worse, we have learned to fight them. To wage this new war, our emperor recommended a sure and prepared advance with strong use of tanks and aviation to secure our objectives in Germany. Our emperor has not planned to occupy all of Germany; the use of force is therefore not limited as long as victory is assured. However, we are strongly advised to attack quickly, as our enemy might also prepare to face us. Whatever happens, remember that this war is unfortunate but inevitable."
 france_md.319.a: "Never another Sedan !"
 france_md.320.t: "The war for the Alps"
 france_md.320.d: "Our march eastward toward Russia seems to take a slight detour. Indeed, our emperor has called for taking time to solidify our southern flank. It is true that Napoleon I during the Russian retreat had to face multiple revolts among his former allies taking advantage of his weakness. In the eventuality of a long war against Russia, it seems necessary to secure our southern flank. Our list of countries to conquer adjusts slightly; our emperor has limited it to Italy and the former Austro-Hungarian Empire. Most of these countries are not a threat, but they could become one if our Russian campaign drags on; their fall is therefore essential to our success. These are mostly very mountainous countries, therefore more complicated to invade. Our emperor has therefore announced the mobilization of many Alpine hunters to assist our troops in this hostile terrain. He also recommended using artillery to dislodge the enemy from easily defensible terrain. The objective of this war is to secure our rear without losing too many men, whom we will need for the Russian campaign. We are therefore advised to advance carefully and reduce enemy resistance points with cannon fire. However, we are strongly advised to attack quickly, as our enemy might also prepare to face us. Have no qualms; these countries are just in the wrong place at the wrong time."
 france_md.320.a: "We Will Bury the Holy Roman Empire Once and for All!"

 france_md.321.t: "The Emperor is Calling on us to Prepare For War"
 france_md.321.d: "Our French ally has just called for a meeting to discuss a special operation to destroy Russia, which it perceives as a threat to Europe and to the empire of which we are a partner. It has urged us to develop our military capabilities and, to this end, has sent us its arms experts to optimise our arms production. The watchword is as follows: prepare for a long and difficult war. The announcement of this impending war is not good news for our citizens, who may well be called upon to die. But this war is necessary and just. We must protect Europe from Russia before we become its target. Our French ally may harbour a personal grudge against Russia, but he is right about the threat it poses."
 france_md.321.a: "Thank you, my emperor"

 france_md.322.t: "Piercing the glacis"
 france_md.322.d: "Some ignored our calls; others were not ready to heed them. Our march on Moscow is imminent, but first we must secure our point of departure. To this end, our emperor has asked us to prepare for an invasion of the countries of Eastern Europe. These countries, which have always served as buffer states against Russian expansionism, are now, for some, an obstacle to our own expansion. We have extended a hand to those who might have agreed to work with us, but some have ignored this appeal. The Day of Judgement will therefore come for them. These are countries that survived Soviet occupation; most are only just beginning to develop, so they will not be very difficult to crush. Once again, our objective is to secure our points of entry into Russia as quickly as possible, before they begin to mobilise. Our emperor has therefore advised us to opt for a rapid advance with an armoured breakthrough supported by artillery fire. Our aim is to show these countries that any resistance against us is futile. However, we are strongly advised to attack swiftly, as our enemy may also be preparing to confront us. One thing is certain: these countries will fight to the bitter end to preserve their independence. Show no mercy."
 france_md.322.a: "The French will give the world both peace and freedom"

 france_md.475.t: "The Second Russian Campaign"
 france_md.475.d: "After years of preparation, the time has finally come. Our Emperor has just issued his final instructions for the Russian campaign. This is our most powerful and strategically significant adversary in Europe. Russia is not only a historic adversary, as it was for Napoleon I, but also an inevitable threat to our future. We must, without fail, neutralise them before turning our attention to threats from overseas. However, for once, our Emperor seems to be hesitating over how to tackle the Russian threat. This time, there is no room for error; we are facing a great power that has repeatedly demonstrated its ability to defend itself on its own soil. He has therefore given us a choice between two scenarios. We could carry out a lightning breakthrough across Russia to reach its nerve centres, using the brute force of armoured vehicles and assault aircraft. Alternatively, we could advance more slowly, consolidating our gains and crushing the enemy at their control points with artillery fire. We are therefore faced with a choice between a rapid advance – which would be costly but would allow us to crush the Russian army before it can mobilise – or a war of attrition aimed primarily at destroying the enemy's equipment and sapping the population's enthusiasm for defending their country. With the first approach, we risk hitting a brick wall and suffering setbacks in the long term. In the second, we risk giving the enemy time to secure its industries and prepare its counter-attack. Whatever we decide, we are strongly advised to attack swiftly, as our enemy is also likely to be preparing to face us. Make the right choice, but in any case, the enemy must know this:  The sovereign people shall advance, tyrants descend in graves to hide!"
 france_md.475.a: "A swift offensive, we'll be in Moscow in two weeks!"
 france_md.475.b: "Let's prepare for a war of attrition"

 france_md.476.t: "Breaking the Blockade"
 france_md.476.d: "Our economy and our people have suffered enough at the hands of treacherous Albion. From the moment we arrived, Great Britain has shown its hostility towards us, and we swore that we would make them pay for past indignities. That moment has finally come. Having secured our place in Europe, we can now focus on our long-standing adversary. One problem remains for anyone wishing to invade them. However vastly superior we may be to them, we are blocked by the English Channel. We must find a way to land on their wretched island to put an end to their existence. To this end, our Emperor has given us two options. We could utilise our air superiority; our air force has proven itself in the many wars we have waged. We could crush them with bombs before parachuting our forces directly onto their territory, whilst our naval aviation keeps their aircraft carriers at bay. Or we could capitalise on the fact that their navy is no longer as powerful as it once was and reserve our air force for the ground battle. So we should concentrate our fleet to prepare for the landing. Whatever we decide, we are strongly advised to strike quickly, as our enemy may also be preparing to confront us. Make the right choice, citizen – our victory is imminent."
 france_md.476.a: "Their navy is now a mere shadow of its former self. La Royale will make short work of it"
 france_md.476.b: " A Blitz 2.0, sounds good"

 france_md.477.t: "The Emperor Proclaims Victory of the Continental System"
 france_md.477.d: "They imposed sanctions on us. They imposed an embargo on us. They bombed us. But they have never been able to break the enthusiasm of the French people. After years of war, we are victorious. Our Emperor has announced that the war is over and that we have won. Once again, Europe bows before the French Empire. These victories, these conquests, were won at the cost of thousands of French lives. Their deaths will not have been in vain. The future is secure for France and for the Empire. They will all go down in history as the martyrs of our revolution. Who would have believed it when our Emperor took his rightful place. That we were alone against all, that our economy was collapsing, that we would be the last to remain standing in Europe? Our Emperor has decreed that, from today, Victory Day shall be a public holiday in memory of our soldiers who fell in battle. However, whilst many claim that this day marks the beginning of an era of peace, they are mistaken. Our victory in Europe is no longer a matter of debate, but sooner or later we will have to face other powers on other fronts. France is eternal, so is war."
 france_md.477.a: "The day of glory has arrived"

 france_md.478.t: "Which Quest for our Kingdom?"
 france_md.478.d: "Our position at the head of the Kingdom of France is secure. We have crushed the Revolution and restored religion to its rightful place in our country. But a question now arises. Our aim is to restore our kingdom to its former glory, but where should we begin? Many kings of France have considerably expanded the Kingdom and Christendom, but from whom should we draw inspiration? Our ancestors were the Franks, and we must reclaim our lost territories. However, this would undoubtedly trigger wars with our former allies, as they would not simply agree to return the land of our ancestors to us just like that. Another option would be to win the hearts of Christians in our country and across the world by setting out directly to conquer the Holy Land, only to return later crowned with success. This would spare us a war on our own soil. Whatever we decide, we will have to face many powers, but we have nothing to fear, for God is on our side."
 france_md.478.a: "We are, first and foremost, Franks"
 france_md.478.b: "The crusade won't wait, we must liberate our holy sites"

 france_md.479.t: "The Kingdom of France Demands Our Annexation"
 france_md.479.d: "It is a most peculiar request that we received this morning from our French diplomatic colleagues. Their king seems to have lost his mind and has just announced that he no longer recognises our country as a sovereign entity. He is therefore demanding that we hand over our territories, our national reserves and our army to his command. He has also announced that we would be treated well and that every effort would be made to integrate our population as smoothly as possible. This announcement has all the hallmarks of an April Fool's prank, but it would appear we are still a long way from 1 April. Indeed, the French General Staff has announced a special mobilisation of its armed forces. All the evidence seems to point to the French armed forces preparing for an intervention on our territory. Surrender or fight, these are our choices. Whatever we decide, we must act quickly."
 france_md.479.a: "A conflict would cause our people unnecessary suffering"
 france_md.479.b: "How dare they? We are a sovereign country"

 france_md.480.t: "[FROM.GetName] Meets Our Requirements"
 france_md.480.d: "Before the first cannon shot was fired, the government of [FROM.GetName] announced its dissolution and unconditional surrender to our kingdom. This is excellent news for our people and our diplomatic efforts. Our king has promised that the new French citizens will have their status regularised as quickly as possible and that they will be integrated as effectively as possible. This was the wisest decision they could have made. They would not have been able to resist an intervention on our part."
 france_md.480.a: "Sometimes all you have to do is ask nicely"

 france_md.481.t: "[FROM.GetName] Refuses to Give in"
 france_md.481.d: "The government of [FROM.GetName] has just announced that it condemns our attempt to intimidate its country. Our ethnic demands would have no place at the negotiating table. This diplomatic setback was predictable; it would have been strange for a sovereign country to announce its surrender without even putting up a fight. This is fortunate, as we had in fact prepared for this very eventuality. Our forces are ready to intervene on their soil. However, it is not certain that open conflict is the best way to secure justice."
 france_md.481.a: "They're going to regret it"
 france_md.481.b: "We'll be back"

 france_md.482.t: "The Kingdom of France Demands Our Submission"
 france_md.482.d: "It is a most peculiar request that we received this morning from our French diplomatic colleagues. Their king seems to have lost his mind and has just announced that he intends to do everything in his power to protect the papacy, just as in the days of the Carolingians. They no longer consider us capable of ensuring the Vatican's security in the face of rising international tensions. They are therefore demanding full control over our government and that we cede to them the corridor leading to the Vatican, which they intend to administer directly. This announcement is intolerable. We have never failed to protect the papacy, and religion cannot justify our neighbours' nationalist ambitions. Nevertheless, these are not mere threats, the French General Staff has announced a special mobilisation of its armed forces. All the evidence seems to point to the French armed forces preparing for an intervention on our territory. To yield or to fight: such are our choices. Whatever we decide, we must act swiftly."
 france_md.482.a: "We are no match for them"
 france_md.482.b: "How dare they? We are a sovereign country"

 france_md.483.t: "[FROM.GetName] Refuses to Meet Our Demands"
 france_md.483.d: "The government of [FROM.GetName] has just announced that it condemns our attempt to intimidate their country. They refuse to bow to our demands and wish to defend their sovereignty over their decisions and policies. It would appear that they have rejected our appeal to reason. We cannot let them get away with this. Our forces are ready to intervene militarily in their country. We cannot risk our adversaries joining forces to confront us. We must make an example of them. However, a war with [FROM.GetName] may not be what we need."
 france_md.483.a: "They didn't realise they were on the wrong side of the gun"
 france_md.483.b: "We can bend them in other ways"

 france_md.484.t: "The Kingdom of France Demands Our Submission"
 france_md.484.d: "It is a most peculiar demand that we received this morning from our French diplomatic colleagues. Their king seems to have lost his mind and has just announced that he no longer considers us capable of ensuring the safety of our people and that our government finds itself on the wrong side of the current balance of alliances. They are therefore demanding complete control over our government and our armed forces. These demands are preposterous, for we have never failed in the administration of our territory, and we derive our authority solely from the mandate granted to us by the people. Nevertheless, these are not mere threats; the French General Staff has announced a special mobilisation of its army. All the evidence seems to point to the French armed forces preparing for an intervention on our territory. To yield or to fight: such are our choices. Whatever we decide, we must act swiftly."
 france_md.484.a: "We are no match for them"
 france_md.484.b: "Only our people are sovereign"

 france_md.485.t: "The Rise of the Western Empire"
 france_md.485.d: "After years of relentless struggle, alliances, betrayal and judgement, the Frankish people have triumphed. A few years ago, when we overthrew the usurping republic, the European powers ostracised us. Sanctions were imposed upon us and attempts were made to extinguish the fervour of the Frankish people. But God has always been on our side. France has always been the eldest daughter of the Church. She was not destined to be a republic but to serve God. The enemies of the Frankish people were therefore bound to perish. The French nation could never have achieved as much as we have. Now the Franks have reclaimed their lands. It is therefore time to proclaim our Empire, the Empire of the West, the Empire of the Faith. We shall never abandon our mission to protect the Church. Today our empire is consecrated by the Papacy, to whom we have promised eternal protection. But perhaps it is also time to set out for the East to reclaim the Holy Land. This would mean new wars for our fledgling empire, but once this reconquest is complete, we shall have served our Lord well."
 france_md.485.a: "And this time, I'll be the one to place the wreath"
 france_md.485.b: "Deus Vult !"

 france_md.486.t: "The Kingdom of France Demands Our Submission"
 france_md.486.d: "It is a most peculiar request that we received this morning from our French diplomatic colleagues. Their king seems to have lost his mind and has just announced that he intends to do everything in his power to see through the Tenth Crusade that he has just launched. It so happens that our island territories lie in his path, and he claims to need them to carry out his crusade. But he is also demanding complete control over our government, because, why not? This announcement is intolerable; religion cannot justify our neighbours' nationalist ambitions. Nevertheless, these are not mere threats; the French General Staff has announced a special mobilisation of its army. All the evidence seems to point to the French armed forces preparing for an intervention on our territory. To yield or to fight: such are our choices. Whatever we decide, we must act swiftly."
 france_md.486.a: "This is the best way to ensure this campaign succeeds; we accept it"
 france_md.486.b: "How dare they? We are a sovereign country"

 france_md.487.t: "The Victorious Tenth Crusade"
 france_md.487.d: "After months of intense fighting in the Mediterranean and the Middle East, we have emerged victorious. We set out by sea, travelling from island to island, gained a foothold in the last Christian strongholds of the Middle East, and then laid siege to Jerusalem. Countless adversaries stood in our way, but we prevailed. Of course, innocent people must have perished at the hands of our vengeful might, and many French people died at the hands of our adversaries, but the end justifies the means. Now that our gains have been consolidated, we have neutralised the instability in the Middle East. But one question remains. Should we stop there? Our Church is not respected throughout Europe. Perhaps it is time to finish what the religious wars failed to eradicate."
 france_md.487.a: "There will be a new crusade"
 france_md.487.b: "We have achieved our goal by restoring the Kingdom of Jerusalem. There is no need to go any further"

 france_md.488.t: "The Kingdom of France is urging us to join their alliance"
 france_md.488.d: "We have just received a proposal from the French diplomats. Having successfully concluded their Middle Eastern venture, it would appear that they are turning their attention back to Europe. The King of France has declared that, by virtue of his role as protector of the Catholic Church, he will wage war against all those who do not recognise his authority. They have raised the possibility of joining their alliance against the godless powers. They have spoken of an alliance akin to Noah's Ark, claiming that the flood will soon befall Europe. This announcement is as mad as it is terrifying, as it appears to be accompanied by an increased mobilisation of the French army, with troops returning from the crusade. Their proposal therefore bears a strong resemblance to an ultimatum that must be taken seriously, given the ferocity with which they have waged their crusade. Whatever we decide, we must do so swiftly."
 france_md.488.a: "It's better to have them on our side than against us"
 france_md.488.b: "Are they mad?"

 france_md.489.t: "The Eleventh Crusade Victorious in Europe"
 france_md.489.d: "This crusade was bloodier than the last. It was also more difficult to carry out, as we took on major powers. But we did it. We are victorious. Yet as we tend to our wounds and rebuild our country and those we have conquered, a question arises. Should we impose strict control over their policies to ensure they stay on the right path? Or should we show them the light and let them decide for themselves? By letting them choose, we would demonstrate our clemency, and they would be less likely to revolt. Conversely, exercising tighter control would help ensure that no other sheep stray. What should we do?"
 france_md.489.a: "We need to keep an eye on them"
 france_md.489.b: "Our Lord will judge them when the time comes"

 france_md.490.t: "The Restoration of Our Natural Borders"
 france_md.490.d: "From Richelieu to Charles de Gaulle, the idea of France's natural borders has never been entirely abandoned. It lies at the heart of both the ethnic claims of our people, the Frankish people, and the guarantees for our security. The notion that France must be surrounded by natural barriers to ensure its security has always been a fundamental concern for our country's governments and nationalist ideologues. Today, we can fulfil this destiny. We have driven our adversaries from the banks of the Rhine and secured our position in the mountains. The local populations, too, have finally come to accept the new order of things. All that remains is for us to formalise this annexation. Through this act, we avenge the Revolution and usher in an era of security and prosperity for the Empire and the French people."
 france_md.490.a: "France's borders are defined by nature (Danton 1793)"

 france_md.491.t: "The Union of the Frankish People"
 france_md.491.d: "For too long, the unity of the Frankish people has been thwarted by powers seeking to limit France's influence. They created states such as the Benelux to turn them into a battleground between the Franks and the other Germanic peoples. They led us to believe that the European Union was our new motherland, but we have always known that the destiny of the Franks belongs to them alone. Nothing, therefore, could prevent the Frankish people from reuniting indefinitely. Thus, we have reclaimed the land of our Frankish ancestors, who centuries ago gave birth to the French nation. After several months, the Frankish people finally came to realise that their destiny lay in reuniting with their blood brothers. Now that we are reunited and the Kingdom is whole, we can move forward. Justice has been done."
 france_md.491.a: "A state for all the Franks"

 france_md.492.t: "The Return of the Carolingians"
 france_md.492.d: "Upon Charlemagne's death, his empire was divided into three: West Francia, Middle Francia and East Francia. Thus, the Frankish emperor's legacy began to fade, and the Franks were stripped of their lands. But we have managed to rectify this mistake of the past. After years of conflict, we have succeeded in driving the usurpers from our lands and in making the inhabitants of these lands realise that they had been deceived. They were not Germans, Italians or Swiss; they were all Franks, but had forgotten it. Through this act of reunification and annexation of the true Frankish territory, we are righting the wrongs of the Treaty of Verdun and of a thousand years of building a Europe on false foundations. This day marks the beginning of a new European era: a Frankish Europe."
 france_md.492.a: "The empire and the Frankish state are one"

 france_md.493.t: "The Kingdom of Jerusalem Resurfaces"
 france_md.493.d: "Just under a millennium ago, our Crusader forebears saw their most precious possession taken from them. Nine Crusades were not enough to conquer and hold our holy sites, but we have returned to fulfil this promise made to the Lord. We have regained a foothold in the Middle East within the last Christian strongholds of Lebanon, and we have recaptured Jerusalem and the Holy Land. This was followed by a struggle to establish our kingdom in the Middle East and to make the population understand that the holy sites must remain under our control to guarantee their safety."
 france_md.493.a: "The Tenth Crusade triumphs!"

 france_md.494.t: "An Empire Reborn"
 france_md.494.d: "Around 150 years ago, Napoleon's Second Empire came to an end under the blows of Prussia and the Germanic peoples. This was followed by a century of revenge and conflict for France. Our country has not seen much peace over the past century. At the dawn of this new millennium, everyone was predicting the slow decline of our former colonial power, but we proved them wrong. We Bonapartists have wrested power back from the unstable republic and restored our country to its former glory. Of course, this was not achieved without effort, without fear, or without losses, but we have done it. We have reclaimed the borders of Napoleon I's First Empire. We drove out the enemy powers and convinced the people that we were the new reality they had to accept. With this historic victory over the Eighth Coalition, we have shown our adversaries that France is back and that the Empire will soon come to topple their tyrants. The Continental System is triumphing in Europe, but we still have much to accomplish."
 france_md.494.a: "Third time the charm"

 france_md.495.t: "The Return of the Colonial Empire"
 france_md.495.d: "Whilst the Bonapartist empires have always been centred on the domination of Europe, the colonies have always been of great importance to them. From the Haitian revolt to the expansion of colonisation in Africa during the reign of Napoleon III, the Empire's influence beyond its borders has always been significant. However, since the fall of the colonial empires, we have been gradually ousted from the countries we once controlled. It is time to restore the natural order of things. Our Emperor has therefore asked us to prepare for France's return to its former colonies. To this end, he has suggested that we prepare our armies for conflict in hostile environments. Putting his words into action, he has announced the special mobilisation of troops stationed in the overseas departments and regions, who are better trained for this sort of environment. Our strategy will focus on invading coastal towns to secure naval bases, and then continuing operations inland where the climate is harsher."
 france_md.495.a: "Those blessed days of the colonies"

 france_md.496.t: "Our French overlord demand our annexion"
 france_md.496.d: "We should have realised that the control over our politics imposed by France would sooner or later end up like this. The French authorities have just announced that our country is soon to be absorbed into France. This announcement did not come out of the blue, France has long had its eye on some of our territories and seems determined to seize them this time. They believe they will be better able to administer our country than we are. In these dark hours, we must make a choice not only for our independence but also for the safety of our people. To yield or to fight, these are our options. Whatever we decide, we must act swiftly."
 france_md.496.a: "We do not have the means to oppose it"
 france_md.496.b: "This land is ours, let them come and take it"

 france_md.497.t: "[FROM.GetName] revolt against our overlordship"
 france_md.497.d: "The government of [FROM.GetName] has just announced that it condemns our attempt at annexation and is prepared to make any sacrifice to defend its country's independence. They have agreed to become our vassals but have refused to cede the territories we demanded. They have also announced the expulsion of our administration from their country and that they are preparing to confront us to defend their country. Faced with this unfavourable turn of events, we have the choice between making them pay for this outrage immediately or postponing their punishment until a later date. It would be wise to make an example of them by crushing this rebellion now, but we may have better things to do at the moment. Nothing prevents us from returning at a later date."
 france_md.497.a: "This will serve as a lesson to them and to anyone else who might be tempted"
 france_md.497.b: "We'll crush them later"

 france_md.498.t: "France is proposing to invest in our industry"
 france_md.498.d: "During a pleasant discussion with our French partners, they made us a rather tempting offer. Now more than ever, Europe needs to refocus its production capacity where it can exercise control over it. France has therefore offered to support countries wishing to work towards European economic independence. Consequently, the French government has proposed investing in our economy by assisting with the establishment of factories in one of our territories. This offer forms an integral part of a project aimed at increasing European sovereignty whilst helping its member states weather future crises. This offer would be highly beneficial for us, but it would also benefit the French, who could gain a stake in our capital and that of our companies. Should we sacrifice a little of our sovereignty to help our industry?"
 france_md.498.a: "Where do we sign?"
 france_md.498.b: "Europe and France have no business meddling in our economy"

 france_md.499.t: "France is Proposing to Invest in Our Infrastructure Network"
 france_md.499.d: "During a pleasant discussion with our French partners, they made us a rather attractive offer. Europe's main objective is to facilitate the movement of people and goods between EU countries, and they would like to assist our country in this regard. The French government has therefore offered to invest in our transport network by helping to modernise our infrastructure. This offer forms an integral part of a project aimed at increasing European sovereignty whilst helping its member states weather future crises. This offer would be highly beneficial for us, but it would also benefit the French, who could gain influence over the management of our infrastructure. Should we sacrifice a little of our sovereignty in order to modernise our infrastructure?"
 france_md.499.a: "Where do we sign?"
 france_md.499.b: "Our infrastructure network is already doing very well without them"

 france_md.502.t: "France is Proposing to Invest in Our Ecological Transition"
 france_md.502.d: "During a pleasant discussion with our French partners, they made us a rather tempting offer. As their long-term aim is to make Europe more environmentally friendly, they are proposing that we invest jointly in the green transition. The French government has therefore proposed that we invest in our renewable energy production infrastructure. This offer would be highly beneficial for us, but it would also benefit the French, who could gain a foothold in our electricity generation. Should we sacrifice a little of our sovereignty to further our green transition?"
 france_md.502.a: "Where do we sign?"
 france_md.502.b: "We don't need their Ecological transition"

 france_md.520.t: "The Fragmentation Continues"
 france_md.520.d: "Misfortunes never come singly. Our descent into the depths of public opinion in France seems to be accompanied by an internal split within our party. Our collapse in the polls is accompanied by an exodus of most of our senior figures and activists to other parties. Our liberal wing has rallied behind the centrist party, bringing in young leaders just as in that old party. One of our ministers, Emmanuel Macron, has even announced his intention to create a new centrist party called La République en Marche and to stand against us in the next elections! But our right wing is not the only one to have broken away. Many members and voters on our party's left wing have been disappointed by our performance on social and economic issues and have decided to rally behind Jean-Luc Mélenchon, who had already left us before the last election. Their aim: to create a radical left-wing party and stand as candidates in the next elections. These developments are disastrous for us and our party, but they are yet another sign that, whilst we have made many mistakes, we can still turn the tide and win back our electorate before it is too late."
 france_md.520.a: "Curse !"

 france_md.521.t: "French agents Have Managed to Breach Our Defence Systeme"
 france_md.521.d: "At the crack of dawn this morning, we were woken by the sound of car horns and crashes. The streets of our capital are at a standstill due to what appears to be an act of sabotage against our transport infrastructure. Our technicians are doing their utmost to restore the situation, but the accidents have already claimed the lives of several members of our police force, and we fear that the safety of our armed forces may also be at risk. This attack clearly originates from Bonapartist France, which has been espousing hostile rhetoric towards us for several months now. We must prepare ourselves before these little games played by secret agents become the norm."
 france_md.521.a: "Damn them"

 france_md.522.t: "Our Police Forces Have Repelled a French Raid"
 france_md.522.d: "It was with a sigh of relief that we learnt our police forces had managed to prevent a large-scale act of sabotage in our capital. The enemy managed to escape, but we have averted the worst. This attack has nevertheless cost the lives of two members of our police force during sporadic clashes on the streets of our capital. This operation clearly originates from Bonapartist France, which has been espousing hostile rhetoric towards us for several months now. We must prepare ourselves before these little games played by secret agents become the norm."
 france_md.522.a: "We won't always be so lucky"

 france_md.523.t: "France Proclaims the Third Empire"
 france_md.523.d: "France has just declared the return of the Empire. Some time ago, a nationalist monarchist faction seized power in France and has evidently consolidated its hold on power. They have therefore organised a grand ceremony to announce the return of the Empire, and now it is the talk of the town. Indeed, the ceremony was covered by the media and widely shared on social media. This celebration is not merely an artistic event,it is also a show of force by France. For several months now, France has publicly displayed a desire for conquest and conflict. This proclamation is therefore not an end but a beginning – the beginning of complications in Europe and around the world."
 france_md.523.a: "We should take this threat seriously"
 france_md.523.b: "They haven't been a threat for a long time"

 france_md.524.t: "More Funds for the Army ?"
 france_md.524.d: "Our recent investments in defence were vital to maintaining our place within the European defence strategy, but could we not do more? Faced with the threat of war returning to Europe, many allied countries have deployed enormous resources to prepare their forces for a high-intensity conflict. Perhaps we should do the same and invest even more in our arms production capabilities."
 france_md.524.a: "You can never be too careful"
 france_md.524.b: "We've already spent a lot"

 france_md.525.t: "The Resources to Achieve Our Ambitions"
 france_md.525.d: "Following our numerous calls urging the French people to work harder and move away from a culture of dependency, we are faced with a stark reality. Our country lacks stable jobs, even though it has a large workforce brimming with goodwill and talent. Perhaps we should boost employment by injecting funds into various strategic sectors of our economy. After all, if we wait for the market to sort itself out, it could well take centuries. However, the civilian sector is not the only one in need of funding. Our cutting-edge defence industry is inundated with orders and lacks the resources to fulfil them. Perhaps we should instead inject money into this sector and let the civilian sector fend for itself in creating jobs."
 france_md.525.a: "Our citizens need these jobs"
 france_md.525.b: "Our defence industry will make better use of these funds"

 france_md.526.t: "Reviving Economic Activity"
 france_md.526.d: "Years of ultra-liberalism have considerably weakened our economy. However, to survive our exit from the European Union, we must have a robust economy that is not vulnerable to EU sanctions. To revive economic activity in France, we have two options. We could invest in the capital of French private companies to encourage them to set up in France. This new initiative would bring nothing but benefits for our population and would allow for less state involvement in the economic recovery. However, there is no guarantee that these companies will invest their capital in France. Nothing would prevent them from going elsewhere where labour is cheaper. Although this would make it easier for us to invest in our regions, some of this money could be lost. Conversely, we could directly subsidise the establishment and development of new businesses in France. This would not go down well with the financial sector, but it would be a sure-fire solution for reviving economic activity."
 france_md.526.a: "We shall invest in the market, so they will invest in France."
 france_md.526.b: "From a human perspective, capitalism does not offer a satisfactory solution (Charles de Gaulle)"

 france_md.527.t: "Expanding Our Support for Rural Areas"
 france_md.527.d: "Having worked to improve rural and peri-urban infrastructure, the question now is what we intend to do with it. We launched this project to bring economic vitality outside urban centres, and it is already well under way. We are now faced with the choice of either continuing to expand transport links and employment opportunities in less densely populated areas, or focusing on other activities that are equally far from the city. Agriculture and the sectors that depend on it suffer from the same problem as peri-urban areas. They are isolated from the main decision-making centres and do not enjoy the same privileges. Perhaps we should also subsidise them. This would help them gain better access to centres of production and consumption, as well as winning their favour."
 france_md.527.a: "We will continue to bring connectivity and jobs to the suburbs"
 france_md.527.b: "Let's give that money to the agri-food sector instead. They'll put it to better use."

 france_md.528.t: "The New Economy"
 france_md.528.d: "We have successfully divested ourselves of our costly and unproductive industries, which we are currently in the process of relocating. The time has now come to find new areas of employment for our population, which is increasingly well-qualified but still seeking work. The service sector seems to be the safest bet for a developed country such as ours. It generates a great deal of revenue, produces very little direct pollution and easily bridges the gap between the private sector and consumers. It therefore appears to be the best option. However, it is not the only option. Indeed, France is also renowned for its research, ranging from defence to medicine and chemistry. The numerous crises we have weathered have led to budget cuts for science. Perhaps we should devote a little more to it by subsidising research programmes."
 france_md.528.a: "The service sector is more profitable and will help to reduce unemployment"
 france_md.528.b: "We should become part of this knowledge society"

 france_md.529.t: "More Jobs or More Services?"
 france_md.529.d: "Our recent investments in the productive sectors are beginning to yield satisfactory results. We have succeeded in halting the spiral of impoverishment amongst our population and in rebuilding a stable labour market. We can continue along this path and create more jobs that will benefit future generations, wherever they may come from. But another question arises. Our predecessors, as well as destroying jobs, slowly dismantled public services, with the result that our population was paying heavy taxes for public services that were shrinking ever further. Perhaps we should instead rebuild our public services, as these are what support our citizens throughout their lives. A better education will help them to be more effective in their jobs, and better healthcare will enable them to live longer. Should we refocus on rebuilding public services, or is rebuilding the labour market not the most important priority ?"
 france_md.529.a: "Our priority is to create more jobs"
 france_md.529.b: "We've done enough on the labour front, we need to rebuild public services"

 france_md.530.t: "Relocate Our Food Supplies"
 france_md.530.d: "On the eve of launching our major plan to bring our food supply back home, a question arises. What measures should we take to achieve this? Our agri-food sectors are more than capable of feeding us, but they suffer from unfair competition, which forces us to import foodstuffs we could do without. As well as introducing competition where it has no place, these practices cause significant damage to the planet through transport and the irresponsible conditions under which the goods we import are produced. Faced with this, we have two choices: we can impose tariff barriers on foodstuffs we do not need or which do not meet our standards. This is an effective and inexpensive solution, but one that could draw the wrath of our European partners and the World Trade Organisation. Alternatively, we can continue to operate within market rules and arrange to subsidise our agri-food sector as much as possible to enable it to be more competitive and reduce our reliance on imports, in the interests of free trade. Whatever we decide, we have the means to carry it out; it is simply a matter of will."
 france_md.530.a: "The market and free competition are harmful to our residents and our planet"
 france_md.530.b: "We have to play by the rules"

 france_md.531.t: "France Breaks Free Trade Laws"
 france_md.531.d: "We have just learnt from a French government press release that the government has decided to reintroduce customs barriers on food imports. This move marks the start of what they call a plan to localise their food supply. Although they have numerous arguments in its favour, this plan breaches many laws of the World Trade Organisation and the European Union. The French have signed free trade agreements and should be obliged to honour them. It is not certain that they will face sanctions, but this move is detrimental to European integration. Nevertheless, our people are waiting for us to respond to this issue: have they done the right thing or the wrong thing?"
 france_md.531.a: "That is unacceptable"
 france_md.531.b: "We should do the same"

 france_md.532.t: "Our Economic Sovereignty"
 france_md.532.d: "Although our government has announced that it intends to break free, diplomatically and geopolitically, from the powers that have influenced us for far too long, this stance is not without consequences. Indeed, because so many capitalist governments have sold off our working class piece by piece, numerous French companies and areas of expertise are now in the hands of foreign capital. Our ideological and diplomatic distancing from their capitalist model could result in them leaving, and thus create a need for us to take back control of the private sector to prevent it from collapsing. From there, we are faced with two choices. We can create new jobs for this workforce to prevent unemployment by launching a major scheme to generate new jobs and new workplaces. This scheme would have the advantage of effectively boosting growth, but its cost would mean it could not be sustained for very long; in the meantime, we must be able to build these new employment hubs. Another solution would be to create new posts and stabilise employment in existing sectors. This would be less costly and more sustainable in the long term. We must, however, ensure that the organisations have sufficient capacity to accommodate this new workforce."
 france_md.532.a: "We are able to create these new workspaces within a year"
 france_md.532.b: "Without building any more, we can employ more people in the existing facilities"

 france_md.533.t: "Towards a Left Wing Coalition"
 france_md.533.d: "Following many long months of negotiations and debates, we have managed to find common ground with a large number of other left-wing parties. They have agreed not to oppose our government in the years to come and to join our coalition. To this end, we have drawn up a sort of joint programme designed to lead France and the French people towards a bright and, above all, fairer future. This development is good news and a masterstroke, given that our government was being challenged by other parties that did not recognise its legitimacy. We have succeeded in forming a more robust government, all without compromising our principles. This arrangement has had a slight impact on an increase in social benefits, but we were already planning to increase them anyway, so it is not really a problem."
 france_md.533.a: "The Threat of a Motion of no Confidence is Fading"

 france_md.534.t: "Other left-wing parties Reject our coalition"
 france_md.534.d: "The news announced this morning by MPs from other left-wing groups is terrible. They announced that they did not intend to support our proposal for a coalition between left-wing parties. According to them, there were too many differences between our programme and theirs. Apparently, we do not share the same priorities. This statement is bad news for our government, which was already struggling to maintain its position in a divided National Assembly. We should be able to negotiate on a bill-by-bill basis in the Assembly, but this will be subject to pressure from all sides on each occasion. These parties have acted irresponsibly, and we can at least take comfort in the fact that a section of public opinion supports us in our united approach, but this will not be enough to ensure the survival of our government ?"
 france_md.534.a: "That Was a Valiant Attempt"

 france_md.535.t: "The Socialist Party Join the Government"
 france_md.535.d: "After many long months of negotiations and debates, we have managed to find common ground with the Socialist Party. They have agreed to stop opposing us and to join the government. This agreement was reached on the basis of a joint programme largely modelled on our own; they were in no position to impose theirs on us. This development is good news and a masterstroke, given that our government was being challenged by other parties that did not recognise its legitimacy. We have succeeded in forming a more stable government, and all at minimal cost. This arrangement was made subject to investment in the private sector; it is not quite what our electorate was expecting, but if it enables us to pass legislation in the Assembly, it is a good thing."
 france_md.535.a: "Leon Blum Would be Proud"

 france_md.536.t: "The Socialist Party Refuses to Join the Government"
 france_md.536.d: "The news announced by the Socialist MPs this morning is terrible. They announced that they did not intend to support our coalition proposal. According to them, there were too many differences between our programme and theirs. They have clearly still not got over our attacks on their party during the campaign. This statement is bad news for our government, which was already struggling to hold its ground in a divided National Assembly. We should be able to negotiate on a bill-by-bill basis in the Assembly, but this will be subject to pressure from all sides on each occasion. These parties have acted irresponsibly, and we can at least take comfort in the fact that a section of public opinion supports us in our united approach, but that will not be enough to ensure the survival of our government ?"
 france_md.536.a: "Leon Blum is turning in his grave"

 france_md.537.t: "A Term to Finish"
 france_md.537.d: "The political system, as it is designed for the sake of realism, requires you to wait until the 2002 elections before starting the political branch of the tree. However, the Republicans/RPR tree may also reflect the situation as of 2000. Would you like to start playing now with your current character and benefit from the political tree that fits to them? Or would you prefer to wait until the 2002 elections to join the party of your choice and possibly campaign for your current party after your term of office? This will have little impact on gameplay."
 france_md.537.a: "Im not waiting till 2002"
 france_md.537.b: "I want to wait 2002 election to play my character"

 france_md.538.t: "Jacques Chirac is stepping down from politics"
 france_md.538.d: "Following his party's defeat in the presidential elections, former President Chirac decided to bring his political career to an end. From minister to president, he had come a long way and had witnessed France change throughout the Fourth and Fifth Republics. However, the difficulties his party faced during the campaign were also linked to his policies, which did not appeal to everyone. Nevertheless, if there is one lesson to be learnt from his failure, it is that the situation has changed; the world is no longer the same, and we can no longer think as we did before without taking risks. All we can do now is hope that we will fare better than he did."
 france_md.538.a: "That'll give him time to eat his apples"

 france_md.539.t: "The Fall of the Menhir"
 france_md.539.d: "Last week, Jean-Marie Le Pen, founder and former leader of our party, the National Front, was once again in the news on television – and not for the right reasons. Following his numerous Holocaust-denying and anti-Semitic remarks, he has now refused to describe Marshal Pétain as a traitor. In any case, ever since he stepped down from the party leadership, he has been at odds with the new reality of the National Front. He opposes us on many issues, from pensions to his controversial views on the conflicts of the last century. By continuing to make such remarks, he is preventing us from moving forward and finally taking our place within what they call the republican spectrum. We should expel him from the party. But that might not go down well with the party's old guard, who share his views. We must make this important choice: do we genuinely want to transform our party to align with republican standards, or do we risk losing our identity?"
 france_md.539.a: "He's become a nuisance, we must expel him from the party"
 france_md.539.b: "Just remind him to behave himself"

 france_md.540.t: "From the Front to the Rally"
 france_md.540.d: "Following numerous internal debates and conferences within their party, senior figures in the National Front have announced significant changes to the party's policies and status. The party will now be known as the National Rally and is clearly determined to shake off its label as a far-right party. To this end, they have announced the expulsion of numerous activists deemed too extreme and have reaffirmed their commitment to remaining in the European Union. This development marks the final stage in the decline of the old National Front, as it is revamped to appear more acceptable. Although these changes are minor, we must do our utmost to prevent the public from believing that this changes anything."
 france_md.540.a: "They are nonetheless dangerous"

 france_md.541.t: "The Fall of the Holy See"
 france_md.541.d: "A foreign power is currently occupying the Vatican. We cannot, therefore, guarantee the safety of the papacy whilst the Vatican remains under the control of our adversaries. Yet our country has already provided a home for the papacy in the Palace of the Popes in Avignon. There is therefore nothing to prevent us from bringing the College of Cardinals and the current Pope to Avignon. This will be a momentous change for Christendom worldwide, but with the Vatican under occupation, we alone are powerful enough to ensure the protection of the Church, as our Kingdom has always done."
 france_md.541.a: "The Papacy will be safe here with us."



  #ELECTION EVENT
 france_md.503.t: "Opposition to [FRA.GetLeader]: What is the Trend?"
 france_md.503.d: "As President [FRA.GetLeader]'s term draws to a close, one question arises: who will succeed him? As his policies have not pleased everyone, it is highly likely that the forthcoming election could see any party take the presidency. As the presidential campaign draws to a close, we can already begin to discern the balance of electoral power. The favourite, Lionel Jospin, appears to be the frontrunner; he served as Prime Minister under Chirac, pursuing social democratic policies in line with European standards, whilst distancing himself from the socialist tradition – modern, but not socialist. There are also various left-wing candidates from the Greens and the French Communist Party. These candidates are far from having the resources to win, but they could gain momentum as this tense campaign draws to a close. Is the left as a whole therefore the clear favourite for the upcoming elections? Or might its divisions and inconsistencies work against it and propel another right-wing candidate into the second round?"
 france_md.503.a: "The left is managing to win over the electorate"
 france_md.503.b: "None of the left-wing candidates has secured the support they had hoped for"

 france_md.986.t: "Lionel Jospin Faces Criticism"
 france_md.986.d: "Although he is the left's favourite candidate for the upcoming election, Lionel Jospin does not enjoy unanimous support within the left regarding his manifesto. Considered too liberal and too similar to Chirac's on many issues, his candidacy is the subject of debate. Opposing him is the French Communist Party; although it is now but a shadow of its former self since the end of the Cold War, it still has a few allies within the radical left and can appeal to those disillusioned by former President Mitterrand's second term, which did not please everyone. It could therefore attack the Socialist candidate over the lack of socialism in his programme and his shift towards liberalism, but will it do so? Launching a confrontation with the Socialist Party could enable the PCF to regain its credibility and secure an alliance with the other radical left-wing parties. But this would also risk weakening both of them and thus propelling to the forefront of the left a party that has managed to stay out of the fray."
 france_md.986.a: "The PCF has decided not to attack Lionel Jospin"
 france_md.986.b: "The PCF has managed to win over left-wing voters"
 france_md.986.c: "An inconclusive attack by the PCF"

 france_md.987.t: "Lionel Jospin Given Well Ahead"
 france_md.987.d: "Lionel Jospin and the Socialist Party's triumph is undisputed within the left. Although he had previously come under fire, his opponents are in no position to challenge him or to reach the second round. Whether you agree with his programme or not, it will be him against [FRA.GetLeader] in the second round of the presidential election."
 france_md.987.a: "It could not have been any other way"

 france_md.988.t: "Communist Resurgence"
 france_md.988.d: "Attacking Jospin's credibility regarding his affiliation with the political left was the right thing to do. Not only was the Socialist vote split between the left and the centre, but this attack also gave the PCF the credibility it lacked to embody opposition to the liberal and conservative policies that have prevailed for far too long. The PCF has therefore succeeded in securing a solid alliance with other left-wing partners such as the Revolutionary Communist League and the Lutte Ouvrière party. However, this alliance between radical left-wing groups has not gone unnoticed. Indeed, centrist voters dissatisfied with [FRA.GetLeader]'s policies would have been more inclined to vote for Lionel Jospin than for a radical left-wing alliance in the second round. It is therefore likely that they will vote against us during the final head-to-head against [FRA.GetLeader] in the second round. But perhaps we can come to an arrangement with them so that they do not protest too loudly on television, in exchange for some local investment in their towns..."
 france_md.988.a: "The centrists will abstain"
 france_md.988.b: "The centrists will call for a united front against the far left"

 france_md.989.t: "An Unlikely Favourite"
 france_md.989.d: "The end of this presidential campaign appears to be a turbulent one for many parties. Indeed, following the PCF's attacks on the candidate Lionel Jospin, the Communists and the Socialists have embarked on a relentless media battle. As neither side has managed to make its case, the left-wing electorate has turned towards a less controversial and more measured candidate. It was at this point that the Green Party seized the opportunity to present itself as the voice of calm and reason in the face of the storm on the horizon. The left-wing electorate therefore appears to have turned towards a new political home, one that is more conciliatory than some and closer to its citizens than others. It is therefore highly likely that the Greens will reach the second round, where they will face a former president weakened by the end of his term in office."
 france_md.989.a: "Who would have believed it?"

 france_md.990.t: "Neither Left nor Right"
 france_md.990.d: "With the Conservatives already assured of a place in the second round and the Left in disarray due to its internal squabbles, it would appear that the former president is already certain to win, with the conservative right behind him, though a few uncertainties remain. Indeed, some French people are weary of the left-right divide that has shaped politics for decades and which brings about radical changes with every new election. Moreover, this is not in keeping with the spirit of the times, which should now be focused on stability and European integration. The liberal party, the Union for French Democracy, therefore has a case to make. France and Chirac's pro-independence policy no longer carry much weight in a world like ours, where new powers and blocs are emerging. Chirac has managed to strike a balance between de Gaulle's empty chair and Mitterrand's European integration, but how long will this status quo last? The liberal centre therefore has a role to play in this situation, but will it be able to convince the electorate of this new reality?"
 france_md.990.a: "The Liberals will manage to capture people's attention"
 france_md.990.b: "The French Remain Committed to their Sovereignty"


 france_md.510.t: "No One Could Have Seen It Coming"
 france_md.510.d: "Given the inability of all the parties to capture voters' attention, none of them has sufficient strength to reach the second round against [FRA.GetLeader]. The latter also appears too weak to win in the first round, so he will need an opponent. However, one party has actually benefited greatly from the main parties' disappearance from the media spotlight. The National Front has not been tainted by the controversies that have plagued the various parties standing in the presidential election and, despite its highly controversial leader Jean-Marie Le Pen, it could well reach the second round. Of course, it remains highly unlikely that this will happen. Despite the left's decline in the polls, Lionel Jospin still appears to be the favourite to reach the second round, where he will surely be defeated by [FRA.GetLeader]. But one might still wonder what would happen if the FN were to reach the second round. The public would, of course, be shocked, as it would be the first time a far-right party had reached the second round, but how would the party leaderships react? Would they call on people to vote for [FRA.GetLeader] despite the numerous setbacks he has suffered towards the end of his five-year term? Or would they not be concerned about the rise of such a party, believing that, in any case, [FRA.GetLeader] would emerge victorious?"
 france_md.510.a: "The parties will not be concerned about the rise of extremism"
 france_md.510.b: "All the parties will call on voters to vote against the National Front"

 france_md.511.t: "Election day"
 france_md.511.d: "After months of a turbulent campaign full of twists and turns, the time has finally come for the French to vote. This is merely the first round, designed to narrow the field down to the two candidates who have garnered the most support from the French public. A second round will then be held to decide between them if neither candidate secures a majority."
 france_md.511.a: "Let's go and vote!"

 france_md.512.t: "The National Front is Predicted to Win the Presidential Election"
 france_md.512.d: "To everyone's surprise, the National Front emerged victorious from the first round. Yet no one had expected this; all the predictions had pointed to a head-to-head between Jospin and [FRA.GetLeader]. However, given the other candidates' inability to win over the French electorate, the National Front made it through to the second round. What's more, things are looking grim for [FRA.GetLeader], as the other parties have not called on voters to support him. For some, his policies were too controversial for them to feel comfortable urging people to vote for him. A section of the electorate is expected to rally to form a makeshift barrier against the far-right candidate. But it is not certain that this will be enough to defeat Le Pen, who is positioning himself as the opposition to the established order. The second round is still to come, so we should have an answer to this question before long."
 france_md.512.a: "What just happenned ?"

 france_md.513.t: "The National Front Reaches the Second Round"
 france_md.513.d: "To everyone's surprise, the National Front emerged victorious from the first round. Yet no one had expected this; all the predictions had pointed to a head-to-head between Jospin and [FRA.GetLeader]. However, given the other candidates' inability to win over the French electorate, the National Front made it through to the second round. Fortunately, however, [FRA.GetLeader] should come out on top. All the political parties and civil society were shocked by the arrival of a far-right party in the second round and have therefore called for a massive vote for [FRA.GetLeader]. Although his policies do not always appeal to everyone, his opponent is seen as too great a threat to risk seeing Le Pen reach the Élysée Palace. Large demonstrations have taken place across the country in support of the outgoing president, so he should triumph without difficulty in the second round, although the result is still to be decided. This is a sadly historic event; let us hope it is the first and only time."
 france_md.513.a: "How on earth did we end up in this situation?"

 france_md.514.t: "The PCF Declared Winner of the Presidential Election"
 france_md.514.d: "To everyone's surprise, the French Communist Party has emerged victorious from the first round. Who would have believed it a few months ago, when the party was at its lowest ebb in the polls since its slow descent into the abyss following the end of the Cold War? But the weaknesses of candidate Jospin and the alliance of the entire radical left have enabled the PCF to rally the whole of the left and thus secure a place in the second round. What's more, it has done so with a clear lead, as the right-wing camp is deeply divided and both the Socialists and the centrists have agreed not to oppose the PCF provided it promises not to leave the European Union. This was fortunate, as it was not the Communist leader's intention. He skilfully balanced opposition to the liberal order with reformism so as not to alienate the centre of the political spectrum. The PCF's victory is now beyond doubt, but the question is rather whether it will manage to hold its ground within a left-wing coalition that is not yet secured."
 france_md.514.a: "Better days are here at last"

 france_md.515.t: "The PCF has Made it Through to the Second Round"
 france_md.515.d: "To everyone's surprise, the French Communist Party has emerged victorious from the first round. Who would have believed it a few months ago, when the party was at its lowest ebb in the polls since its slow descent into the abyss following the end of the Cold War? However, the weaknesses of candidate Jospin and the alliance of the entire radical left enabled the PCF to rally the whole of the left and thus secure a place in the second round. However, its victory is not complete and already appears to be under threat following the announcement by the centrist parties that they will vote for [FRA.GetLeader]. Indeed, they viewed the triumph of the radical left as a bad omen for European integration and for the financial markets. They have therefore decided to rally behind [FRA.GetLeader] despite their disapproval of his policies. The second round has not yet taken place, but there is a strong likelihood that [FRA.GetLeader] will triumph once again."
 france_md.515.a: "That was a close call"

 france_md.516.t: "The RPF has Reached the Second Round"
 france_md.516.d: "To everyone's surprise, the outgoing president was knocked out of the second round. Of course, he wasn't popular with the whole population, but he hadn't done too badly, had he? In the end, it was his own party that brought about his downfall. The Gaullist Charles Pasqua managed to poach enough conservatives and sovereigntists from the conservative right to disrupt [FRA.GetLeader]'s campaign. However, the RPF is not alone in the second round. There, it will face Lionel Jospin, the Socialist candidate who managed to reach the second round despite internal divisions on the left. This second round will be fiercely contested, as it is not simply a clash between socialism and conservatism playing out once again – it is much more than that. Next week, the French people will be able to decide whether they want more or less of Europe. Fortunately, we won't have long to wait, as the second round is just around the corner."
 france_md.516.a: "Sovereignty will prevail"
 france_md.516.b: "The protest vote remains in the minority"

 france_md.517.t: "The UDF Reaches the Second Round"
 france_md.517.d: "The rallying of pro-European voters behind the UDF enabled the party to reach the second round. The Socialists were not the only ones promoting the European Union, and the Liberals were closer to the liberal values of the European Union. People often tend to prefer the original to the imitation. The UDF has therefore managed to join the incumbent president in the second round. It is thus a contest between Chirac's pro-independence policy and the Liberals' Europe at any cost stance. This election is likely to be a close one, as the main blocs are themselves deeply divided on this issue. Fortunately, we won't have long to wait, as the second round is just around the corner."
 france_md.517.a: "The old conservative is kept at bay"
 france_md.517.b: "The UDF's manifesto is proving a little too liberal for the electorate"

 france_md.518.t: "The Greens Make it Through to the Second Round"
 france_md.518.d: "Following a relentless campaign between the left-wing parties, the Greens managed, to everyone's surprise, to make it through to the second round. Their social and environmental programme is at the cutting edge of progress, and having managed to keep their cool during the clashes between the PCF and the PS, they have succeeded in embodying the wisest and fairest solution. They have therefore managed to join the outgoing president, who is waiting for them with bated breath in the second round. The second round is likely to be fiercely contested, but for once there seems to be unanimity within each bloc. The left will vote for progressivism and the right for conservatism. The contest set to take place next week will not only be about social and societal issues, but also about the environment and the future."
 france_md.518.a: "Outdated, conservative software is no longer up to the challenges of our millennium"
 france_md.518.b: "The environment is not yet given sufficient priority."

 france_md.519.t: "Lionel Jospin has Qualified for the Second Round"
 france_md.519.d: "As predicted by all the polls, the Socialist candidate has made it through to the second round without too much trouble. His modern, pro-European programme has won over Socialists and centrists alike, giving him a strong voter base. The other, more radical left-wing parties were deeply divided, and none posed a sufficient threat to the former Prime Minister. The Socialist candidate will therefore face his rival this week. The television studios are ready to host what is shaping up to be the debate of the year. Once again, the clash between progressivism and conservatism is playing out. But one thing is certain: the polls are very close, and Jospin may well need the support of the left-wing parties, as the RPR could benefit from support from more right-wing groups who do not want a Socialist president. Whatever the outcome, we won't have to wait long, as the results will be announced next week."
 france_md.519.a: "Jospin manages to win over the rest of the left"
 france_md.519.b: "Jospin failed to win over voters further to the left, as his programme was too liberal"

 #various new ideas
 FRA_Macron_eco: "The Macron Act"
 FRA_Macron_eco_desc: "We have decided to follow the policy set out by our Finance Minister, Emmanuel Macron. A law that will simplify investment and employment whilst cutting government spending."
 FRA_Ferrand_eco: "The Ferrand Act"
 FRA_Ferrand_eco_desc: "We have decided to follow the policy set out by our Finance Minister, Olivier Ferrand. A law that will simplify investment and employment whilst cutting government spending."
 FRA_vigipirate_surveillance_lar: "The Vigipirate Plan"
 FRA_vigipirate_surveillance_lar_desc: "To protect our citizens from potential terrorist attacks, we need to be more cautious and more intrusive."
 FRA_vigipirate_surveillance_non_lar: "The Vigipirate Plan"
 FRA_vigipirate_surveillance_non_lar_desc: "To protect our citizens from potential terrorist attacks, we need to be more cautious and more intrusive."
 FRA_ineluctable_collapse: "Collapsing Coalition"
 FRA_ineluctable_collapse_desc: "Our party and our coalition are falling apart; we must sort this out quickly before it's too late!"
 FRA_resist_inevitable: "Efforts de Stabilisation"
 FRA_resist_inevitable_desc: "Our efforts to regain the trust of our voters are a tough slog, but we'll get there!"
 FRA_resist_inevitable2: "Efforts de Stabilisation"
 FRA_resist_inevitable2_desc: "Our efforts to regain the trust of our voters are a tough slog, but we'll get there!"
 FRA_resist_inevitable3: "Efforts de Stabilisation"
 FRA_resist_inevitable3_desc: "Our efforts to regain the trust of our voters are a tough slog, but we'll get there!"
 FRA_socialism_renew: "Socialism Renewed"
 FRA_socialism_renew_desc: "We have rebuilt our party's legitimacy on solid foundations. The future lies ahead of us."
 FRA_pension_reform: "Pension Reform"
 FRA_pension_reform_desc: "In light of the budgetary crisis we are facing, we have had to raise the retirement age for our citizens; they weren't happy about it, but we had to do it"
 FRA_french_rearmament: "Re-armament Phase 1"
 FRA_french_rearmament_desc: "With tensions flaring up again in Europe, we have no choice but to rearm in order to avert the worst."
 FRA_french_rearmament2: "Re-armament Phase 2"
 FRA_french_rearmament2_desc: "Training more soldiers is not enough; we must increase our capacity to produce weapons"
 FRA_french_rearmament3: "Accomplished Re-armament"
 FRA_french_rearmament3_desc: "Our population and our armed forces are prepared to face a large-scale conflict"
 french_nuclear_expert: "French Nuclear Experts"
 french_nuclear_expert_desc: "We have accepted assistance from French nuclear technology experts. They will help us build our energy independence."
 french_dissuasion: "French Nuclear Deterrence"
 french_dissuasion_desc: "We have agreed to accept the protection of France and the European Union in the event of a conflict with a hostile power."
 FRA_Our_project: "Our Project for France"
 FRA_Our_project_desc: "Despite the public's initial resistance, they have come to realise that everything we do must be done to protect France's future. More than ever, we are shielded from economic and geopolitical turmoil. And this will be the case for a long time to come."
 FRA_french_independant1: "National Independence"
 FRA_french_independant1_desc: "France must not fall in line with the other major powers; it must chart its own course alongside those powers that reject domination from either the East or the West."
 FRA_french_independant2: "National Independence"
 FRA_french_independant2_desc: "France must not fall in line with the other major powers; it must chart its own course alongside those powers that reject domination from either the East or the West."
 FRA_french_independant3: "National Independence"
 FRA_french_independant3_desc: "France must not fall in line with the other major powers; it must chart its own course alongside those powers that reject domination from either the East or the West."
 FRA_NATO_support: "NATO Support"
 FRA_NATO_support_desc: "By reaffirming our support for our alliance, we have forged partnerships with other member countries."
 FRA_entente_china: "Entente with China"
 FRA_entente_china_desc: "We have concluded agreements with China to facilitate trade between our country and theirs."
 FRA_regulation: "Market Regulation"
 FRA_regulation_desc: "By agreeing to regulate the market and its activities, we can avoid future crises."
 FRA_eternal_fra: "Eternal France"
 FRA_eternal_fra_desc: "We are drawing to the end of our programme, confident that we have shown the world that France is back and will never fade from the international stage."
 FRA_europhile_anger_idea: "Pro-European Demonstrations"
 FRA_europhile_anger_idea_desc: "Some members of our population are reluctant to leave the European Union. This will only last for a while, but we must ensure that the French people understand that this is the only way forward."
 FRA_EU_Retaliate: "Recovering economy"
 FRA_EU_Retaliate_desc: "Leaving the European Union has put us in a difficult economic position, but we will bounce back, whatever the cost."
 FRA_EU_Retaliate2: "Initial Recovery"
 FRA_EU_Retaliate2_desc: "Our efforts are starting to pay off; our economy is recovering, and this time there's no one to put pressure on us or stop us from doing what we want with our money."
 FRA_russian_cooperation1: "The Russian Cooperation"
 FRA_russian_cooperation1_desc: "The Russian government has agreed to share its industrial expertise with us. May this cooperation continue."
 FRA_russian_cooperation2: "The Russian Partnership"
 FRA_russian_cooperation2_desc: "The Russian government has agreed to share its industrial and military expertise with us. May this cooperation continue."
 FRA_a_certain_idea: "A Certain Idea of France"
 FRA_a_certain_idea_desc: "We have managed to reach the end of our journey. We have rescued France from being sidelined in favour of Europe. France's independence is secured. Our master Charles de Gaulle would be proud of us."
 FRA_blocade: "Disrupted Trade Flows"
 FRA_blocade_desc: "We refused to give in to France's blackmail, so they are doing everything they can to prevent goods from the rest of the European Union from reaching us."
 FRA_shocking: "Disappointed Population"
 FRA_shocking_desc: "Our people were very enthusiastic about the plan for the Sixth Republic, but in the end we decided to keep the constitution as it was. They weren't happy about that."
 FRA_draft6threp: "Political Instability"
 FRA_draft6threp_desc: "Our desire for radical change to the constitution of our republic has generated a great deal of enthusiasm amongst the population. It opens up new horizons for the people. However, it also paves the way for the emergence of new political movements that will not always be in our favour."
 FRA_fail6threp: "The Failure of the Reformation"
 FRA_fail6threp_desc: "We have failed to free our people from the Fifth Republic; they have ultimately lost hope in the face of the difficulty of reaching a consensus. Perhaps we will manage to bring about a change in our laws, but as far as our people are concerned, we will have failed to bring them the change they were hoping for."
 FRA_ecological_transition: "Ensure the ecological transition"
 FRA_ecological_transition_desc: "To ensure a future for the next generations, we need to protect the environment. To do this, we must change the way we consume and produce."
 FRA_insoumission: "L'Insoumission"
 FRA_insoumission_desc: "We have successfully carried out the programme for which we were elected. We have made France more socially-minded, environmentally-conscious and humanistic than it has ever been. But we still have a great deal to achieve, and we will rise to the challenge. We must do even better."
 FRA_eu_social_climate: "Social and Environmental Reforms"
 FRA_eu_social_climate_desc: "We have agreed to follow the example set by La France Insoumise. Our people have been inspired by their example. Although it is taking its toll on our finances, it can be seen as a long-term investment."
 FRA_research_boost: "Research Investments"
 FRA_research_boost_desc: "We have invested heavily in research and education to ensure that future generations are even better equipped to deal with modern challenges. This should pay off in the long term."
 FRA_refit_network: "Refitting our Transport Network"
 FRA_refit_network_desc: "To optimise the transport of goods and passengers, we must first modernise our transport network. We have set aside the necessary resources to do so."
 FRA_eden_garden: "Our Garden of Eden"
 FRA_eden_garden_desc: "By doing our utmost to protect our country and the world from the ravages of climate change, we have laid the foundations for a society equipped to face the challenges of our millennium. Tackling climate change will require further efforts, but we have done our best to lead the movement."
 FRA_eu_green_reform: "Environmental Reforms"
 FRA_eu_green_reform_desc: "We have decided to follow the example of the French Greens by investing in the green transition. Although this will slow down our country's growth, it is an investment in future generations."
 FRA_EU_transit: "Ecological Transition Support Fund"
 FRA_EU_transit_desc: "We have agreed to be part of the ecological transition support fund. This initiative was launched by the French Greens and aims to help us make the transition from a carbon-based economy to a low-carbon economy."
 FRA_eu_ban_fossile: "Phasing Out Fossil Fuels"
 FRA_eu_ban_fossile_desc: "We are in the process of phasing out fossil fuels. Our vehicles will run on electricity, and fossil fuels will only be used for marginal purposes. This transition, initiated by the French Greens, will be costly. But it is an investment in our future and in our independence from oil-producing nations."
 FRA_regulation_agra: "Agricultural Regulations"
 FRA_regulation_agra_desc: "We agreed to comply with the European Union's food production regulations. It was our only option if we did not want to lose a key trading partner."
 FRA_regulation_indu: "Industrial Regulations"
 FRA_regulation_indu_desc: "We agreed to comply with the European Union's goods production regulations. It was our only option if we did not want to lose a key trading partner."
 FRA_regulation_fuel: "Regulations on Oil Extraction"
 FRA_regulation_fuel_desc: "We agreed to comply with the European Union's fuel extraction regulations. It was our only option if we did not want to lose a key trading partner."
 FRA_EU_rail: "Building an European Transport Network"
 FRA_EU_rail_desc: "We have agreed to help France and the rest of the European Union to work together to build a better transport network to facilitate trade and optimise the transport of goods."
 FRA_eu_pcf_reform: "Buying Social Peace"
 FRA_eu_pcf_reform_desc: "We agreed to make concessions to our radical left after they began to stir following the victory of communism in France. We gave them what they wanted, and they should now keep quiet."
 FRA_fr_military_assistance: "French Military Assistance"
 FRA_fr_military_assistance_desc: "We have accepted France's assistance in preparing our armed forces for a high-intensity conflict with Russia. The day they cross our border, we will be ready."
 FRA_european_internationale: "The European International"
 FRA_european_internationale_desc: "We have formed an alliance with another communist power in Europe. Together we will defeat capitalism and fascism once and for all."
 FRA_international_will_be_humankind: "The International will be the human race"
 FRA_international_will_be_humankind_desc: "We have managed to consolidate our hard-won power. We have achieved the impossible: we have secured the lasting triumph of communism in France. There is still much to be done, but we have laid the right foundations for the fight against capitalism and fascism in France."
 FRA_eu_FN_reform: "Ensuring Security"
 FRA_eu_FN_reform_desc: "We have responded positively to the call from our people to implement national preference and to tackle insecurity. Although these reforms are a consequence of the rise of the far right in Europe, they also strengthen our ability to exercise control over our population, which is a good thing."
 FRA_nuke_boost: "Nuclear Primacy"
 FRA_nuke_boost_desc: "Nuclear power has been providing us with energy for decades; it is a fantastic way of generating low-carbon energy at low cost. We should simply step up the monitoring of these reactors to ensure that nothing serious happens."
 FRA_Boreal_Space: "The Boréal Space"
 FRA_Boreal_Space_desc: "The Boréal Space is a partnership between the Russian Sphere and the Francosphere, with the aim of integrating Russia into a European alliance. Our goal today is to combat the ultra-globalist threat, an enemy we share."
 FRA_france_for_french: "France for French"
 FRA_france_for_french_desc: "Ever since our foundation, we have had to contend with a pro-immigration faction that has always stood united against us. But now that we have completed our programme, we have demonstrated our ability to lead and guide France towards its destiny; any further resistance is now pointless."
 FRA_people_constitution: "The People's Constitution"
 FRA_people_constitution_desc: "Our revolution has been a success, but we must consolidate our power by giving workers the opportunity to decide for themselves how they want to be governed."
 FRA_commies_redarmy1: "The New Red Army"
 FRA_commies_redarmy1_desc: "Our revolution needs an army to defend itself and to spread its cause. Building on the foundations of the French army, we have established a new force that will defend the people and the revolution."
 FRA_commies_redarmy2: "The New Red Army"
 FRA_commies_redarmy2_desc: "Our revolution needs an army to defend itself and to spread its cause. Building on the foundations of the French army, we have established a new force that will defend the people and the revolution."
 FRA_red_agent_lar: "General Directorate for Revolutionary Action"
 FRA_red_agent_lar_desc: "We have modelled our approach on the DGSE's techniques in order to obtain crucial information about our reactionary and capitalist enemies."
 FRA_red_agent_non_lar: "General Directorate for Revolutionary Action"
 FRA_red_agent_non_lar_desc: "We have modelled our approach on the DGSE's techniques in order to obtain crucial information about our reactionary and capitalist enemies."
 FRA_monarchist_anger: "The Wrath of the Monarchists"
 FRA_monarchist_anger_desc: "Our monarchist allies were disappointed by our refusal to restore aristocratic privileges. Bonapartism is an heir to the Revolution; it could not be otherwise."
 FRA_bonapart_constitution: "The Bonapartist Constitution"
 FRA_bonapart_constitution_desc: "Since the Third Republic, our institutions have no longer been designed to accommodate an Emperor of our stature. We must therefore adapt the constitution to our forthcoming reign. We can take this opportunity to address some of the criticisms levelled by our people at the previous republics; that will be a step in the right direction for them."
 FRA_bonapart_military_reform: "Reorganisation of the Grande Armée"
 FRA_bonapart_military_reform_desc: "Our armed forces are sufficient to ensure our security within our territory, but they are not sufficient to carry out our plans to reclaim our Empire. A restructuring is essential; we are going to dismantle everything from the very top down, so that we can then reform each branch more effectively."
 FRA_army_reformed_1: "Restructured Chain of Command"
 FRA_army_reformed_1_desc: "Now that our command chain has been restructured, we can afford to carry out a more far-reaching reform of our armed forces, including their technology and order book. A major undertaking lies ahead, but this will give us the resources to realise our ambitions."
 FRA_army_reformed_infantry: "Reform of the Grande Armée – Stage 1"
 FRA_army_reformed_infantry_desc: "We have decided how we intend to go on the offensive against our enemies. Our Emperor has ruled in favour of a slow and controlled advance. Priority will therefore be given to the infantry and the equipment they require."
 FRA_army_reformed_cavalry: "Reform of the Grande Armée – Stage 1"
 FRA_army_reformed_cavalry_desc: "We have decided how we intend to go on the offensive against our enemies. Our Emperor has ruled in favour of a fast and powerfull attack. Priority will therefore be given to tank battalions and the equipment they require."
 FRA_army_reformed_artillery_infantry: "Reform of the Grande Armée – Stage 2"
 FRA_army_reformed_artillery_infantry_desc: "We have decided how we intend to go on the offensive against our enemies. Our Emperor has ruled in favour of a slow and controlled advance supported by artillery. Priority will therefore be given to the infantry and artillery, as well as the associated equipment."
 FRA_army_reformed_artillery_cavalry: "Reform of the Grande Armée – Stage 2"
 FRA_army_reformed_artillery_cavalry_desc: "We have decided how we intend to go on the offensive against our enemies. Our Emperor has ruled in favour of a a fast and powerfull attack supported by artillery. Priority will therefore be given to tank battalions and artillery, as well as the associated equipment."
 FRA_army_reformed_air_infantry: "Reform of the Grande Armée – Stage 2"
 FRA_army_reformed_air_infantry_desc: "We have decided how we intend to go on the offensive against our enemies. Our Emperor has ruled in favour of a slow and controlled advance supported by attack planes. Priority will therefore be given to infantry battalions and mass-producing planes."
 FRA_army_reformed_air_cavalry: "Reform of the Grande Armée – Stage 2"
 FRA_army_reformed_air_cavalry_desc: "We have decided how we intend to go on the offensive against our enemies. Our Emperor has ruled in favour of a a fast and powerfull attack supported by attack planes. Priority will therefore be given to tank battalions and mass-producing planes."
 FRA_BCE_money: "The Money of the EU"
 FRA_BCE_money_desc: "We have succeeded in negotiating our return to the European Union's institutions in exchange for aid from the European Bank. This aid will be vital in preparing for the wars we are going to wage… against them!"
 FRA_4th_empire_desc: "The Bonapartist Empire is back, stronger than ever, and this time we will not be defeated by any coalition whatsoever."
 FRA_grande_arme_art_inf: "The Modern Grande Armée"
 FRA_grande_arme_art_inf_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. Following a complete overhaul of its system, we have rebuilt it around a strategy of slow and steady advance, backed by intensive bombardments of enemy lines. The infantry remains the king of the battlefield, but the assault air force will make its task considerably easier."
 FRA_grande_arme_art_cav: "A Deluge of Fire and Steel"
 FRA_grande_arme_art_cav_desc: "After months of reforms, our army is fully prepared to set out to reclaim the Empire's lost territories. Following a complete overhaul of its system, we have rebuilt it around a strategy of rapid and brutal advance, backed by intensive bombardments. This strategy relies on technologically advanced resources, but we have the means to surpass Napoleon's deluge."
 FRA_nationalism_in_europe: "The Rise of Nationalism"
 FRA_nationalism_in_europe_desc: "It seems that the Bonapartists' victory in France is encouraging nationalists across all our European countries to become increasingly involved in politics. Whilst this momentum might enable us to better withstand a conflict with a foreign country, the actions of these agitators in peacetime are a real problem."
 FRA_surrounded: "Continental blockade"
 FRA_surrounded_desc: "Our rise to power has not gone unnoticed, and it is clear that the other European powers are already plotting against us. In particular, Great Britain, which has been our sworn enemy in the past. We must bring down each and every one of these European powers; our survival and that of the revolution depend on it."
 FRA_Sachons_vaincre: "Le Deluge"
 FRA_Sachons_vaincre_desc: "Having spent months preparing our people for a high-intensity conflict, they are now ready for this long-awaited war. Their enthusiasm and faith can move mountains, but we must act quickly before it wanes. We must crush our opponents as quickly as possible."
 FRA_prepare_to_fight: "Preparing our Return"
 FRA_prepare_to_fight_desc: "We have opted for a cautious approach; knowing that our people are fully behind our expansionist ambitions, all that remains is for us to provide them with the means to realise those ambitions. We must ensure that, when the time comes, we are ready."
 FRA_defense_napoleon: "Emergency state"
 FRA_defense_napoleon_desc: "Following the terrorist attacks carried out on our borders by the Bonapartists, our country is on high alert. Whatever happens, we will be ready."
 FRA_thousands_planes: "Aerial Arms Race"
 FRA_thousands_planes_desc: "We have chosen to fight the United States, which for too long has sought to dominate us and the rest of Europe. To protect Europe, we must destroy them, and to destroy them we must be able to compete in the air, as we do not have the means to defeat them at sea."
 FRA_trade_USA: "Transatlantic Trade"
 FRA_trade_USA_desc: "The United States and the French Empire have joined forces to trade across the Atlantic. These agreements will bring them peace and prosperity in return for guarantees of peace."
 FRA_king_camelot_lar: "The King's Camelots"
 FRA_king_camelot_lar_desc: "Our secret police, tasked with suppressing all revolutionary tendencies and other anti-royalist movements."
 FRA_king_camelot_non_lar: "The King's Camelots"
 FRA_king_camelot_non_lar_desc: "Our secret police, tasked with suppressing all revolutionary tendencies and other anti-royalist movements."
 FRA_king_constitution: "The Monarchist Constitution"
 FRA_king_constitution_desc: "All these republics that our country has gone through have built institutions on shaky foundations. We must rewrite this rubbish, because every state, even under our absolute rule needs laws."
 FRA_chivalry: "Modern Chivalry"
 FRA_chivalry_desc: "The French monarchy has always relied on a powerful cavalry force. We have chosen to continue in this vein by prioritising mechanised cavalry over infantry."
 FRA_elite_army: "An Army of Elites"
 FRA_elite_army_desc: "The Revolutionary Wars brought about conscription. However, the many conflicts we have experienced have proved to be extremely costly in terms of human lives. The King's subjects are not always well-trained for warfare. We have therefore chosen to focus on a smaller but far better-trained force."
 FRA_prepare_crusade: "The Tenth Crusade"
 FRA_prepare_crusade_desc: "Our forces are ready to set out to conquer the Holy Land."
 FRA_political_preassure: "Strengthening our Diplomacy"
 FRA_political_preassure_desc: "We have not managed to diplomaticaly win over Lebanon, so we need to improve the way we engage with foreign powers."
 FRA_navy_crusade: "The Maritime Crusade"
 FRA_navy_crusade_desc: "We have decided retake the Holy Land by the sea. This requires effective amphibious offensive capabilities."
 FRA_commie_europe_integration: "European Assimilation"
 FRA_commie_europe_integration_desc: "We have brought the revolution and communism to the rest of Europe. It is now time to forge a union of the proletariat from every country into a European federation that will be capable of ensuring the revolution endures."
 FRA_counter_insurgency: "Effective Military Policing"
 FRA_counter_insurgency_desc: "The Spanish guerrillas posed a problem for Napoleon I, but that won't be the case for us."
 FRA_attack_benelux: "Battle Plan : Benelux"
 FRA_attack_benelux_desc: "We must focus on annihilating the Benelux forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_iberia: "Battle Plan : Iberia"
 FRA_attack_iberia_desc: "We must focus on annihilating the Iberian forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_germany: "Battle Plan : Germany"
 FRA_attack_germany_desc: "We must focus on annihilating the German forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_attack_holy_roman: "Battle Plan : Southern Europe"
 FRA_attack_holy_roman_desc: "We must focus on annihilating the remain of southern European forces. Our Emperor has given us the means to defeat them swiftly."
 FRA_BON_support_allies: "Preparing for a Long War"
 FRA_BON_support_allies_desc: "Our French partner has suggested that we prepare for a high-intensity conflict with Russia."
 FRA_attack_east: "Battle Plan : Eastern Europe"
 FRA_attack_east_desc: "We must focus on annihilating the eastern European forces. Our Emperor has given us the means to defeat them swiftly. This is the final step before our final campaign."
 FRA_attack_russia_fast: "La Fleur au Fusil"
 FRA_attack_russia_fast_desc: "We'll be in Moscow in two weeks' time!"
 FRA_attack_russia_slow: "Cautious Advance"
 FRA_attack_russia_slow_desc: "This time there won't be a Berezina"
 FRA_attack_UK_naval: "Cross the Channel"
 FRA_attack_UK_naval_desc: "The Royal Navy is no longer a threat to us; victory is within our grasp."
 FRA_attack_UK_air: "Jump Over the Channel"
 FRA_attack_UK_air_desc: "We must maintain control of the airspace and take our opponent by surprise."
 FRA_BON_victory: "Imperial Protectorate"
 FRA_BON_victory_desc: "We have been conquered by the Napoleonic Empire."
 FRA_expansion_europe: "Heir of Charlemagne"
 FRA_expansion_europe_desc: "Our destiny is to reclaim the Carolingian Empire."
 FRA_expansion_europe_crusades: "Carolingian Crusade"
 FRA_expansion_europe_crusades_desc: "The Franks have regained their lands; we must now set out for the Holy Land."
 FRA_expansion_crusades: "Heir of Saint Louis"
 FRA_expansion_crusades_desc: "The duty of our Kingdom is to serve God and reclaim the Holy Land."
 FRA_EMPIRE_occident: "The Western Empire"
 FRA_EMPIRE_occident_desc: "We have reconquered the Carolingian Empire and have been crowned Emperor of the West."
 FRA_crusade_done_jerusalem: "The Victorious Crusade"
 FRA_crusade_done_jerusalem_desc: "The Tenth Crusade has achieved its objective by recapturing Jerusalem and the Holy Land."
 FRA_expansion_crusades_plus: "The Last Crusade"
 FRA_expansion_crusades_plus_desc: "Having reclaimed our holy places, we have decided to make amends for the mistakes of the past. All schisms must be brought to an end."
 FRA_protestant_anger: "Protestant Resistance"
 FRA_protestant_anger_desc: "Our aggressive rhetoric towards Protestants has provoked their anger in our country."
 FRA_harsh_subjugation: "Harsh Subjugation"
 FRA_harsh_subjugation_desc: "Our suzerain, the King of France, has decided to controle our economy and policies. Defeat comes at a heavy price."
 FRA_victory_crusade_2_conversion: "The Fifth Horseman of the Apocalypse"
 FRA_victory_crusade_2_conversion_desc: "Divine wrath has been unleashed upon our enemies."
 FRA_enlightment: "Protectorate of the Church"
 FRA_enlightment_desc: "Our suzerain, the King of France, has decided to help us rebuild our country, and to support us in the physical and cultural reconstruction of our society."
 FRA_victory_crusade_2_freedom_light: "The Eldest Daughter of the Church"
 FRA_victory_crusade_2_freedom_light_desc: "We must treat the lost sheep with the utmost kindness."
 FRA_attack_colonies: "Reclaiming the Empire Colonies"
 FRA_attack_colonies_desc: "The continental system must find the resources to ensure its continued existence."










 france_md.110.t: "The Mahoran Status Referendum"
 france_md.110.d: "The people of Mayotte have decided to hold a referendum to determine their fate within the French Republic. The island of Mayotte has been part of the French Republic since 1841 when the island was sold to France by the former king of Madagascar. Leading local officials are looking to solidify their role in the French republic by offically becoming part of the French Republic, seeking their independence from France, or becoming part of the Comoros. What should we do?"
 france_md.110.a: "Allow the Referendum"
 france_md.110.b: "Deny the Referendum"
 france_md.110.c: "Release them to limited autonomy."
 france_md.111.t: "The Mahoran Status Referendum Results"
 france_md.111.d: "The referendum has finally come to its natural conclusion and the results are in. The future of Mayotte lay in the hands of these results."
 france_md.111.a: "Perfection."

 # Lebanese Event Investments (Decisions)
 france_md.350.t: "France is Kicking Us Out of Lebanon!"
 france_md.350.d: "Through a sophisticated campaign of diplomatic pressure and economic incentives, the French have systematically undermined our position in Lebanon. Their influence operations have succeeded beyond their expectations - local politicians now openly call for our departure, and the Lebanese government has formally requested we withdraw our presence. This is a humiliating setback, but perhaps not an irreversible one. We could attempt to reassert our influence, though doing so would risk an international incident."
 france_md.350.a: "Rat! You'll pay for this!"
 france_md.350.b: "Enforce the Claim"

 france_md.355.t: "France instills a sense of revolt in the population"
 france_md.355.d: "The French have been busy spreading their revolutionary ideals among the Lebanese population. Civil society organizations funded by Paris are demanding democratic reforms, transparency, and free elections. Protest movements are gaining momentum in Beirut and beyond. If we don't act quickly to contain this situation, we may face a full-blown uprising inspired by French republican principles."
 france_md.355.a: "Now that hurt..."

 france_md.360.t: "French Energy Investment Proposal"
 france_md.360.d: "The French energy giant TotalEnergies has approached our government with a comprehensive proposal to develop our oil and gas reserves. The deal would bring substantial foreign investment, technical expertise, and create thousands of jobs. However, some domestic critics argue that accepting French capital would increase Paris's leverage over our economic policy. The terms are favorable, but at what cost to our sovereignty?"
 france_md.360.a: "The economic benefits outweigh the risks"
 france_md.360.b: "We cannot sell our resources to foreign interests"

 france_md.400.t: "French Development Aid for Northern Lebanon"
 france_md.400.d: "The Agence Française de Développement has proposed a major infrastructure program for Northern Lebanon, including road improvements, water treatment facilities, and telecommunications networks. The region has long been neglected, and French investment could transform local living standards. Some view this as genuine humanitarian concern stemming from France's historical ties to Lebanon; others see it as a calculated move to expand French influence in a strategically important region."
 france_md.400.a: "This partnership will benefit our people"
 france_md.400.b: "We prefer to develop our own infrastructure"

 france_md.401.t: "French Infrastructure Initiative in the South"
 france_md.401.d: "France has offered to fund major infrastructure projects in Southern Lebanon, an area that has suffered greatly from years of conflict and neglect. The proposal includes hospitals, schools, and electrical grid modernization. While the humanitarian need is undeniable, accepting French presence in the south could complicate our relationships with other regional powers who view any Western involvement with suspicion."
 france_md.401.a: "The south desperately needs this investment"
 france_md.401.b: "The political complications are too great"

 france_md.402.t: "French Industrial Investment Program"
 france_md.402.d: "French corporations are proposing a significant investment in Lebanese manufacturing, promising to establish factories that would create employment for thousands of our citizens. Youth unemployment has been a persistent crisis, and these jobs could help stem the tide of emigration draining our country of talent. Yet industrial dependency on French capital could reshape our economy in ways that primarily benefit Paris."
 france_md.402.a: "Jobs are our priority right now"
 france_md.402.b: "We must develop our own industrial base"

 france_md.403.t: "French Humanitarian Mission to Lebanon"
 france_md.403.d: "In response to our ongoing crisis, France has offered to deploy a humanitarian mission bringing medical supplies, food aid, and technical assistance. French NGOs and government agencies would coordinate relief efforts in collaboration with local authorities. President Macron has personally appealed for international support for Lebanon, invoking the deep historical and cultural bonds between our peoples. This aid could provide desperately needed relief, though it also increases French visibility and influence at a vulnerable moment."
 france_md.403.a: "We gratefully accept this assistance"
 france_md.403.b: "We can manage our own affairs"

 france_md.500.t: "The Lumio Attacks"
 france_md.500.d: "A small commune in Lumio has been struck by the National Liberation Front of Corsica. The attack did not cause any loss of life but it did leave a substantial amount of damage on the small amount of military infrastructure in the commune as well as leaving several gendarmes injured."
 france_md.500.a: "Unfortunate"

 france_md.501.t: "The Hotel Attacks in Marseille"
 france_md.501.d: "A string of minor bombings have been carried out in Marseille. The National Liberation Front of Corsica has claimed responsibility for the strikes. Several people have been hospitalized and injured due to the incidents, but it does not appear that they have any intention of launching additional bomb strikes on any other hotels."
 france_md.501.a: "Unfortunate"

 france_md.504.t: "The McDonald's Bombing"
 france_md.504.d: "A small amount of Breton nationalists have decided to bomb a local McDonald's in Quévert, Brittany. The bomb exploded killing one person in the McDonald's. The ongoing investigation has not produced much in the way of evidence if it is a larger plot, but a tragic occurrence."
 france_md.504.a: "Unfortunate"
 france_md.505.t: "The KMW–Nexter Merger Proposal"
 france_md.505.d: "The governments of France and Germany are finalising a plan to merge Nexter Systems and Krauss-Maffei Wegmann into a single Franco-German defence holding. The resulting KANT consortium would bring Leclerc and Leopard 2 production lines under one roof, create a joint artillery and ammunition portfolio, and anchor a future European main battle tank programme.\n\nMinisters want political approval before the share transfer goes ahead."
 france_md.505.a: "Approve the merger"
 france_md.505.b: "Keep Nexter independent"
 TT_FRA_knds_merge_carry_traits: "§YAll traits already completed at Nexter will carry over to the new KNDS organisation.§!"
 france_md.506.t: "Arquus: Industrial Consolidation"
 france_md.506.d: "Volvo Group's defence subsidiaries — Renault Trucks Defense and Panhard General Defense — have completed their merger into a single entity. The new firm, Arquus, unites Renault's wheeled mobility platforms with Panhard's reconnaissance heritage and positions France as a unified contender in the European armoured vehicle market. Combined production knowledge, programmes, and modifiers from both legacy firms transfer into the new organisation."
 france_md.506.a: "A new chapter for French armoured mobility"
 france_md.506_tt: "Renault and Panhard will be merged into Arquus"
 FRA_arguus_established: "Renault and Panhard have been merged into Arquus in 2018"
 france_md.507.t: "Eurocopter Becomes Airbus Helicopters"
 france_md.507.d: "Effective today, the Eurocopter Group is rebranded as Airbus Helicopters, consolidating the EADS rotorcraft business under the unified Airbus identity. The Marignane works, Donauwörth plant, and Aérospatiale heritage lines now operate under one banner."
 france_md.507.a: "A new chapter for European rotorcraft."
 FRA_airbus_change: "Eurocopter has been rebranded as Airbus Helicopters in 2014"
 TT_FRA_airbus_change_carry_traits: "§YAll traits already completed at §Y$FRA_eurocopter_manufacturer$§! will carry over to $FRA_airbus_manufacturer$§!"
 france_md.508.t: "DCNS Becomes Naval Group"
 france_md.508.d: "Effective today, the historic state arsenal Direction des Constructions Navales — long since rebranded DCNS — adopts the new identity Naval Group, marking its transformation into a full private corporation. The Lorient, Cherbourg, and Brest yards now operate under one banner, alongside the Naviris joint venture with Fincantieri and a renewed export drive built around the Suffren-class submarine and the FDI Belharra frigate."
 france_md.508.a: "A new chapter for French shipbuilding."
 FRA_naval_takeover: "DCNS has been rebranded as Naval Group in 2017"
 TT_FRA_naval_takeover_carry_traits: "§YAll traits already completed at $FRA_dcn_manufacturer$ will carry over to $FRA_naval_group_naval_manufacturer$§!"


 # French Decision Categories
 FRA_french_space_decision_category: "The French Space Program & CNES"
 FRA_french_space_decision_category_desc: "Space: The Final Frontier. We must begin to conquer this frontier in earnest if we are to remain a Great Power in the eyes of the world, but we can only achieve this at great cost. As we can't be sure of any real economic benefits of a large-scale space program, the French people must remain convinced that it is a worthwhile venture!\n§RIf our Space Program Enthusiasm falls below 35, space operations will cease!§! Furthermore, each week our §Y Space Program Enthusiasm§! will fall by §Y0.1§! due to general disinterest in the §YCNES§!\n\n\nOur Space Program Enthusiasm is currently: [?FRA.FRA_peoples_support|+50.0] \nWeekly Income from §YSpace Operations & Actions§!: $[?FRA.FRA_space_income_var|+3]b"
 FRA_run_support_campaigns_short: "Launch a Short Public Support Campaign"
 FRA_run_support_campaigns_short_desc: "If our top scientists are only beginning to unlock the scientific wonders that lie in space, then our people must be incredibly confused at the whole ordeal. A short social media campaign should give us some support!"
 FRA_run_support_campaigns_long: "Launch a Long Public Support Campaign"
 FRA_run_support_campaigns_long_desc: "If our top scientists are only beginning to unlock the scientific wonders that lie in space, then our people must be incredibly confused at the whole ordeal. A detailed education campaign should do wonders for the support we receive from the people!"
 FRA_balance_the_cnes_budget: "Rebalance CNES' Budget"
 FRA_balance_the_cnes_budget_desc: "Our space program, CNES, has had some issues in the past with inefficient spending and minor amounts of corruption. We should send in our state auditors to help reel in excessive spending, and gain CNES some sorely-needed positive reputation."
 FRA_launch_commercial_satellite: "Launch a Commercial Satellite"
 FRA_launch_commercial_satellite_desc: "Now that the age of information is in full swing, private companies are practically falling over each other to launch satellites. By allowing some of these companies to launch from our facilities, we should bring in some reasonable economic benefits. Be aware; however, the people may begin to tire of our commercial-focused program!"
 FRA_prep_international_space_station: "Prepare an ISS Launch"
 FRA_prep_international_space_station_desc: "Whilst a global achievement and initiative, we can prepare to send our supply rockets to the ISS, along with our personnel."
 FRA_french_iss_launch: "French ISS Launch"
 FRA_french_iss_launch_desc: "After months of planning and preparation, our supply shuttle mission is ready to launch. Three… Two… One… Blast-off!"
 FRA_invest_LEB_decision_category: "French-Lebanese Investments"
 FRA_invest_LEB_decision_category_desc: "The Lebanese were once a former colonial holding of ours and as such it is imperative we return to the region and invest in the great country of [LEB.GetNameWithFlag]."
 FRA_LEB_invest_infrastructure_south: "Invest in South Lebanon"
 FRA_LEB_invest_infrastructure_south_desc: "Economically developing South Lebanon can help prevent radicalization in the region. The more economic opportunity for the region ultimately the better for all parties involved."
 FRA_LEB_invest_infrastructure_north: "Invest in North Lebanon"
 FRA_LEB_invest_infrastructure_north_desc: "The economic heartland of Lebanon has almost always been centered around Beirut and the surrounding territories. Expanding and investing in the northern part of the countries will yield excellent."
 FRA_LEB_invest_civilian_factory: "Invest in Lebanese Civilian Industries"
 FRA_LEB_invest_civilian_factory_desc: "The Lebanese could use an additional investment in their civilian industries. Developing these industries could further help the economic development of Lebanon and to become more self-sufficient on the global stage."
 FRA_LEB_financial_help: "Provide Lebanon Financial Help"
 FRA_LEB_financial_help_desc: "We should provide Lebanon financial help to help offset some of their budget shortcomings and otherwise."
 # French Africa Decisions
 FRA_french_africa_decision_category: "Françafrique/Africa Decisions"
 FRA_french_africa_decision_category_desc: "Africa and Françafrique can often be synonymous for us. The continent in Africa needs our assistance and our caretaking and as such we should continue to make Africa a focal point of our foreign policy and our interests."
 FRA_invest_in_NEPAD_education_decision: "Invest in NEPAD Education Programs"
 FRA_invest_in_NEPAD_education_decision_desc: "The NEPAD education programs could use some additional funding and support. We will pay for the increased funding, but the African countries will see more education spending cost reductions."
 FRA_invest_in_NEPAD_healthcare_decision: "Invest in NEPAD Healthcare Programs"
 FRA_invest_in_NEPAD_healthcare_decision_desc: "The NEPAD healthcare programs could use some additional funding and support. We will pay for the increased funding, but the African countries will see more health care spending cost reductions."
 FRA_invest_in_NEPAD_social_care_decision: "Invest in NEPAD Social Care Programs"
 FRA_invest_in_NEPAD_social_care_decision_desc: "The NEPAD social care programs could use some additional funding and support. We will pay for the increased funding, but the African countries will see more social care spending cost reductions."
 FRA_invest_in_NEPAD_economic_program_decision: "Invest in the NEPAD Economic Programs"
 FRA_invest_in_NEPAD_economic_program_decision_desc: "The NEPAD economic programs could use some additional funding and support. We will pay for the increased funding, but the African countries will see increased productivity and building speed."
 FRA_extend_the_NEPAD_program_decision: "Extend the NEPAD Program"
 FRA_extend_the_NEPAD_program_decision_desc: "The program needs to be extended. We can pump some additional funding into the program to keep the program going."
 # French Construction Mission(s)
 FRA_french_construction_decision_category: "Keeping Campaign Promises"
 FRA_french_construction_decision_category_desc: "We need to build at least §G5 new civilian factories§! within a year.\n\nFactories built: §R[?FRA.factories_now]§!"
 FRA_build_factories_mission: "Build factories in time"
 FRA_build_factories_mission_desc: "To appease our base, we must meet our promises on building factories in time!\nIf we don't build enough factories in time, we risk §Rlosing confidence§! in our leadership of France, as well as §Rsupporters§!.\n\nAlternatively, meeting our goals should increase §Gour popularity§! and bring major benefits to our §Gindustry§!.\n\nFactories built: §G[?FRA.factories_now]§!"

