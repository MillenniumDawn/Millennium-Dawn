l_french:
 Commonwealth_member_modifier: "Membre du Commonwealth"
 CMW_Leaving.1.t: "[FROM.GetName] quitte le Commonwealth des Nations"
 CMW_Leaving.1.d: "[FROM.GetName] a officiellement annoncé son départ du Commonwealth des Nations. Cette décision marque un tournant significatif de sa politique étrangère, reflétant un désir de plus grande autonomie et de nouvelles alliances internationales. Le départ peut affecter les relations diplomatiques et les liens économiques au sein du Commonwealth, présentant de nouveaux défis et opportunités tant pour la nation sortante que pour les États membres restants."
 CMW_Leaving.1.a: "Bonne chance"
 Commonwealth_member_modifier_desc: "En tant que membre du Commonwealth des Nations, notre pays bénéficie de liens diplomatiques solides et d'une coopération économique avec les autres États membres. Cette association historique nous offre un réseau de soutien mutuel et de valeurs partagées, renforçant notre standing international et nos débouchés commerciaux. Cependant, concilier notre souveraineté avec les intérêts collectifs du Commonwealth peut parfois engendrer des défis diplomatiques et politiques."
 CMW_member_eng_influence_tt: "[ENG.GetNameWithFlag] $foreign_influence_modifier$: §G+10%§!"