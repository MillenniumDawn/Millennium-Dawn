 EH_event.311.t: "완전히 안정화된 차원문"
 EH_event.311.d: "위성 열화상 영상은 분석가들이 우려했던 바를 확인해 줍니다. 아프리카의 뿔 상공의 차원문이 변동을 멈추고 안정적이고 영구적인 상태로 고정되었습니다. 정찰 드론은 반대편에 헤아릴 수 없이 많은 수의 무리가 집결하고 있다고 보고합니다."
 EH_event.311.a: "침공이 본격적으로 시작되었다"
 EH_research_sites_enabled: "연구 시설 활성화"
 EH_europe_defense_line_category: "유럽 방어선"
 EH_europe_defense_line_category_desc: "유럽 방어선은 유럽에서 키메라 군에 맞서 전선을 지킬 최선의 기회입니다. 이 방어선은 중포와 대공 방어 시설, 그리고 참호와 벙커 망으로 요새화될 것입니다. 대부분의 유럽 국가 군대가 그곳에 주둔할 것입니다. 러시아가 무너질 때 이 방어선이 반드시 버티도록 해야 합니다."
 EH_construct_europe_defense_line: "§G유럽§! 방어선 건설"
 EH_europe_defense_line_destruction: "유럽 방어선 붕괴 중"
 EH_event.810.t: "유럽 방어선 건설 중"
 EH_event.810.d: "유럽 동쪽 국경의 중요성 때문에, 대륙을 아시아와 분리하기 위한 새로운 방어선이 현재 건설 중입니다. 이는 현재 이 중대한 지역을 키메라의 침공으로부터 보호하기 위한 최대 규모의 투자입니다. 어떤 이들은 이를 \\"유럽의 첫 번째이자 마지막 방어선\\"이라고 부릅니다."
 EH_event.810.a: "흥미롭군"
 EH_event.811.t: "유럽 방어선 돌파"
 EH_event.811.d: "오늘 아침 키메라 군세가 거대한 유럽 방어 장벽을 돌파했습니다. 키메라는 압도적인 힘으로 요새를 무너뜨리고 지금 유럽 국가들을 향해 진군하고 있습니다. 유럽 연방이 이들을 저지할 효과적인 계획을 마련하지 못한다면 유럽은 상실될 것입니다."
 EH_event.811.a: "이제 어떻게 해야 하는가?"
 EH_europe_line_wall_modifier: "유럽 방어선 장벽"
 EH_mechs_announced_flag: "§YHACS 시제 골격§!이 공개되었습니다."
 raid_type_EH_raid_portal_desc: "외계 군세가 차원문을 통해 쏟아져 나오는 흐름을 끊기 위해 T.E.S.L.A. 무기로 무장한 타격대가 키메라 차원문을 향해 출격합니다."
 EH_tesla_weapon_in_stockpile: "§YT.E.S.L.A.§! 무기를 사용할 준비가 되었습니다"