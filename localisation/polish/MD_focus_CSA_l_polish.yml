 CSA_New_Arlington: "Nowy Arlington"
 CSA_Mount_Columbia: "Góra Kolumbia"
 CSA_Ulysses: "Odyseusz"
 CSA_Quincy_capital: "Quincy"
 CSA_Southern_Kingdom_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YPołudniowe Królestwo Dixie§!"
 CSA_confederate_states_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YSkonfederowane Stany Ameryki§!"
 CSA_socialist_republic_of_dixie_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YSocjalistyczna Republika Dixie§!"
 CSA_republic_of_dixie_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YRepublika Dixie§!"
 CSA_southern_union_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YUnia Południowa§!"
 CSA_united_southern_states_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YZjednoczone Południowe Stany Ameryki§!"
 CSA_the_golden_confederation_tooltip: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YKonfederacja Złotego Kręgu§!"
 CSA_second_american_republic_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YDruga Republika Amerykańska§!"
 CSA_decisions_war_time_mobilization_category: "Mobilizacja w czasie wojny"
 CSA_decisions_war_time_mobilization_category_desc: "Gdy zajdzie taka potrzeba, możemy wezwać ochotniczy legion ludzi, aby przynajmniej wypełnić luki w liniach. Nie wiemy bowiem, kiedy wojna nadejdzie, ale wiemy, że będzie ona na nas."
 CSA_war_time_mobilization: "Pierwsza fala mobilizacji"
 CSA_war_time_mobilization_desc: "Wezwanie do broni jest już na nas i musimy się zjednoczyć, aby zapewnić obronę naszych domów. Do broni dla chłopców Dixie!"
 CSA_war_second_wave_defenders: "Obrońcy drugiej fali"
 CSA_war_second_wave_defenders_desc: "Wróg naciera, musimy więc zebrać kolejną falę obrońców. Morale narodu ucierpi, ale potrzebujemy wojska."
 CSA_war_desperate_defenders: "Zdesperowani obrońcy"
 CSA_war_desperate_defenders_desc: "Sytuacja robi się ponura, potrzebujemy każdego dostępnego ciała, zdolnego lub nie, aby utrzymać linię. Może, tylko może, będziemy w stanie to wygrać."
 southern_republic_event.1.t: "Pytanie o kapitał"
 southern_republic_event.1.d: "In the wake of the aftermath that was the \"Great Riots\" of the former United States, many of the local governors are scrambling to make their states as appealing to an independent body of where the new Republic's capital should be. Some believe that it should be as central as possible and place the city of Meridian Mississippi as an optimal option. Some believe only Atlanta is the real choice being one of the most developed metropolitan areas of the South. While some cite historic symbolism and wish to have Charleston as the new capital, whatever the choice is it'll need to be sooner rather than later if we are to actually focus on our more pressing problems."
 southern_republic_event.1.o1: "Właśnie przez to przeszliśmy i robimy cholerny konkurs piękności!?!"
 southern_republic_event.2.t: "Wybór Komitetu"
 southern_republic_event.2.d: "After a handful of days as well as many pressures exerted by local officials to choose them the committee has come up with four distinctive choices. New Orleans for its trading hub and naval apparatus, Meridian in Mississippi for its strategic centrality when thinking of the old confederacy. Then there is Atlanta, the South's most developed metropolitan hub, which economically and governing wise would be kind of commonsense of a choice. Finally there is the historic symbolism that is making Charleston the capital. Charleston appeals to the right as well as it appeals to the Southern identity movement that's been growing ever more. Regardless the committee's choice is what determines who gets what."
 southern_republic_event.2.o1: "Nowy Orlean wyraźnie pokonuje Atlantę"
 southern_republic_event.2.o2: "Sercem Dixie powinno być serce Meridian"
 southern_republic_event.2.o3: "Atlanta jest tutaj jedynym prawdziwym wyborem"
 southern_republic_event.2.o4: "Nasza historia jest naszą tożsamością, Charleston jest wybrany"
 southern_republic_event.3.t: "Teatr polityczny"
 southern_republic_event.3.d: "The Southern states are host to a complete natural disaster's worth of political factions and ideological influences. Not only does the South have to worry about the natural disasters of mother nature herself but of the excesses and fighting of its political extremes. From niche Klan members, to Socialist revolutionaries we have to properly navigate this storm if we are to enjoy what little peace we've been able to establish so far."
 southern_republic_event.3.o1: "Ta hołota nie stanowi żadnego zagrożenia"
 southern_republic_event.3.o2: "Powinniśmy być bardziej ostrożni w kwestii tego, kto może zostać wybrany"
 southern_republic_event.4.t: "Stabilne Strony"
 southern_republic_event.4.d: "W obliczu naszego politycznego odrodzenia musimy przyjrzeć się temu, kto mógłby właściwie uczynić nas bardziej stabilnym narodem. Ci „umiarkowani”, jak szydzą alt-prawica i alt-lewica, mają tendencję do etykietowania ich jako wskazujących, że są to bardziej ostrożne partie. Poszukując zmian, ale nie w sposób maratoński, ale raczej w przyjemnym spacerze lub lekkim truchcie, musimy zrozumieć, kim są te partie, jeśli mamy pomóc zapewnić, że umocnią poparcie nad innymi, bardziej buntowniczymi partiami."
 southern_republic_event.4.o1: "Dzięki Bogu za ostrożnych ludzi"
 southern_republic_event.5.t: "Partia Konserwatywna Południa"
 southern_republic_event.5.d: "The SCP is a fairly moderate party in the grand scheme of the \"Stable\", group of parties. Being generally a center-right party it tends to be more of a reminder of the old democratic and republican parties and their moderate wings. Being more for gradual change rather than large swift changes, this party ensures that if change is needed it's tackled in a more thought out manner rather than the fanfare mentality that can arise in more sensitive topics. In terms of social policies it ensures that change is always happening but we must embrace it at a comfortable pace to keep the national cohesion. Economically they are for deregulation, but not opposed to more commonsense based regulations to curb exploitative means."
 southern_republic_event.5.o1: "SCP przynosi pokój"
 southern_republic_event.5.o2: "Peruki wygrają"
 southern_republic_event.5.o3: "PDP zwycięży"
 southern_republic_event.6.t: "Impreza perukarska w Dixie"
 southern_republic_event.6.d: " The WPD is a more classical liberal party which aims to use the old school of liberal doctrine to secure a stable and progressing government to ensure the freedom and equality for all. Seeking more of equal opportunity availability the WPD is socially more fluid towards changes but does not see the need to enforce governmental sanctions unless the issue at hand is not truly handled at the state and or local levels first. Economically they believe in regulations overall with a focus in anti-monopoly or more generally anti-competitive practices regulation. But aside from this sort of \"fair game\" strategy in regulations the WPD prefer a more hands-off approach if and when possible."
 southern_republic_event.6.o1: "Przepisy zdrowego rozsądku mają sens"
 southern_republic_event.6.o2: "Prawdziwa konkurencja to prawdziwa szansa"
 southern_republic_event.6.o3: "Fuzje ekonomiczne są antypołudniowe"
 southern_republic_event.7.t: "Partia Postępowej Demokracji"
 southern_republic_event.7.d: "The PDP is a more traditional democratic-socialist party like its European counterparts, the party looks to use the powers of democracy to ensure the fair treatment of the workers of the nation and wishes to usher in a soft socialism. This means socially speaking the party is more liberal with only holding traditional values on what the voting majority believe is worth keeping traditional. Economically they are soft Socialists, looking to use the power of regulations to keep the workers fed and cared for they are not entirely pro-nationalization however if the private sector acts too unruly it is not out of the question as a stand in to help the exploited masses."
 southern_republic_event.7.o1: "SCP zapewnia stabilność Południa"
 southern_republic_event.7.o2: "Peruki będą nosić styl południowy"
 southern_republic_event.7.o3: "PDP stworzy południowy socjalizm"
 southern_republic_event.8.t: "Partia Federalizacji Dixie"
 southern_republic_event.8.d: "The FDP is essentially the compromising party. Looking to find a happy middle ground of the federal unitarian type government of the union and the more heavily minarchist confederate government, the FDP wishes to marry the two into an earnest and father like figure of a structure to keep peace as well as order to the nation at large. Being both socially and economically off hand its only plans are to direct central funding and services to the poorest of regions to ensure the very bottomline of the nation is not so far down from the rest. Many lambast this as pseudo-socialism, but the FDP fires back at them wondering how much do these supposed \"honorable members of state\" really care about its constituents or do they care more about their friends and paycheck."
 southern_republic_event.8.o1: "Słowo „federalny” nie jest obelgą, lecz rzeczywistością"
 southern_republic_event.8.o2: "SIP Zwycięstwa to Południowe Zwycięstwo"
 southern_republic_event.8.o3: "SLP wyzwoli Dixie"
 southern_republic_event.9.t: "Partia Tożsamości Południowej"
 southern_republic_event.9.d: "The SIP is a niche kind of single issue party. They are more socially indifferent, leading to any and all major social issues to be handled locally rather than nationally. In terms of economics they are a sort of, \"if it isn't broke don't fix it\", kind of mentality. Meaning they'll do regulations or deregulations, but only if it's perceived as a genuine issue to the economic stability of the nation. As for the supposed single issue, the SIP has most of its focus on cultivating and ensuring a real and concrete plan to create a Southern identity. Using things like the more minarchist views of the old confederacy mixed in with some stylistic inspirations from them as well as promoting local food and music culture as Southern culture. The party wishes to move away from the past and make a future that is earnestly and equally Southern for all."
 southern_republic_event.9.o1: "Uwolnij i nakarm Dixie"
 southern_republic_event.9.o2: "Styl południowy dla ludzi z południa"
 southern_republic_event.9.o3: "Dixie Liberty dla wartości Dixie"
 southern_republic_event.10.t: "Partia Wolności Południowej"
 southern_republic_event.10.d: "The SLP is an interesting makeup of a party. Being more or less the remnants of the old Libertarian Party, the SLP has decided to embrace a compromise of Southern cultural and governmental values with a Libertarian spin to help with the complete decentralization. Many in the SLP see a full return to either pro-Libertarianism and or pro-Confederation of government as a sure way to recreating the failure that was the Articles of Confederation. Regardless the party is anti-government intervention in the economy and socially it is very hands off, leaving such things to the state governments means that locals handle local issues. Though the SLP is not afraid of things like welfare and healthcare programs to ensure the bottomline of the nation are able to have some kind of footing to kick in the door of opportunity."
 southern_republic_event.10.o1: "FDP rozumie rządzenie"
 southern_republic_event.10.o2: "SIP stworzy prawdziwy rząd południowy"
 southern_republic_event.10.o3: "Southern Liberty to rządy południowe"
 southern_republic_event.11.t: "Imprezy Outlier"
 southern_republic_event.11.d: "Within the general Overton window of the southern republic, we have two distinctive parties which some honestly debate if they are even real political parties to begin with. Regardless first off we have the DDP or Dixie & Delta Party. Founded by a former railroad enthusiast turned novice political leader, this party seems to be more of a single-issue party in relation to public transportation. However they have alluded to the fact that said investments in PT as they call it for short, would indeed have knock on economic effects when it comes to urbanization as well as connectivity within the nation itself. On the Other hand we have the Party for Economic Prosperity or PEP for short. This party styles itself as a party focused on economic development and ensuring the standards of the nation are brought up through real economic investments. What they don't tell you is that said party is also full of big agricultural money as well as a soft plantation class of supporters. Regardless both the PEP and DDP are seen as interesting forces on their own right but nothing too far to shake the foundations."
 southern_republic_event.11.o1: "Deweloper Dixie"
 southern_republic_event.11.o2: "Ekonomista Dixie"
 southern_republic_event.100.t: "Wiatry zmian"
 southern_republic_event.100.d: "In the lead up to the first elections, the state of the nation has been too much to bear for many. As a result rising radicalism has been seen on both sides of the political scene. With neo-confederates, fascist and much more on the right. The union of revolution and southern communist association leading the charge on the left. Many wonder just who will take the wind out of the sails of the other sides. For now continued rise in factionalism has resulted in..."
 southern_republic_event.100.o1: "Socjalistyczni agitatorzy jednoczą pracowników"
 southern_republic_event.100.o2: "Uparta historyczna duma przejmuje kontrolę nad masami"
 southern_republic_event.101.t: "Konfederaccy identytaryści"
 southern_republic_event.101.d: "The Confederate Workers Party desperate to keep ahead in the polls has recently sought out the help of the Southern Tradition Party. These two while fairly opposite of one another have united on the principle of \"The Confederate Dream\". Hoping to establish the rightful south and restore the lands of old, these two opposites have seemingly attracted one another in a gamble for the first election victory of the new nation. For the first steps are the most important in the road to recovery and stability."
 southern_republic_event.101.o1: "Powstaje Zjednoczony Front"
 southern_republic_event.101.o2: "Powstaje Stowarzyszenie Rolników"
 southern_republic_event.102.t: "Towarzystwo Rolnicze"
 southern_republic_event.102.d: "The main counter push and equally as desperate Union of Revolution Party has seen fit to align itself with the Agrarian Union Party. These two working together create the perfect oxymoron as one is clearly an oligarchic big agriculture party and the other is the closest thing to anarcho-communism that you'll see. But desperate times call for desperate measures. Both parties believe that the true pillar to a stable and complacent society is that of the agrarian society. Simple organization and most production efforts and organized labor goes towards making food, what better way to mold the society than by giving it a basic fundamental of living itself. Regardless they'll have to push hard as things are heating up as the elections come ever closer."
 southern_republic_event.102.o1: "Front Konfederatów prowadzi w sondażach"
 southern_republic_event.102.o2: "Obietnice pełnych brzuchów dają obiecujące rezultaty"
 southern_republic_event.200.t: "Prawo konsoliduje"
 southern_republic_event.200.d: "Wraz z ostatnią zmianą etosu narodowego, wielu zaczęło się przymilać do partii prawicowych. To bardzo zaniepokoiło umiarkowanych i lewicowych, biorąc pod uwagę historię kraju. Niezależnie od tego, obawy osiągnęły punkt kulminacyjny, gdy Dixie First Party i League Of The South zjednoczyły się pod Dixie Purity League. Wielu mieszkańców obawia się bliskiego upadku zacofanych reform społecznych, które może stworzyć liga, co już doprowadziło do stałej migracji z kraju. Z obawy przed zjednoczeniem neokonfederatów i faszystów wielu szuka jakichkolwiek realnych alternatyw, aby powstrzymać taką siłę przed wygraniem wyborów."
 southern_republic_event.200.o1: "Naród tęskni za czystością"
 southern_republic_event.200.o2: "Potencjalni migranci spieszą się, by się zaciągnąć"
 southern_republic_event.201.t: "Rosnąca liczba rekrutów oznacza walkę z nacjonalizmem"
 southern_republic_event.201.d: "With the consolidation of the \"Fringe Right\", as opposition nationalist proclaim and sneer at them, many would be targets of such policies have begun to enlist and as a result the political clout of the military has become more and more swaying in its influence. With this the Modern Monarchist Movement known as the House Of Meridian has joined forces with the armed forces to consolidate a counter nationalist movement. Many are hopeful that if we must go down such a path that at least duty to country is better than anything a fascist or ultra-nationalist leadership would have."
 southern_republic_event.201.o1: "Fringes walczą dalej"
 southern_republic_event.201.o2: "„Królewska” armia brzmi ciekawie"
 southern_republic_event.12.t: "Żądania Południa"
 southern_republic_event.12.d: "Nasi sąsiedzi z zachodu zażądali naszego podporządkowania, rzekomo obietnicy naśladowania niepodległości stanu Teksas jako konfederacyjnego partnera w narodzie południowym. Nie jesteśmy pewni, jaki jest ich cel końcowy, ale to od naszej wiary w nasze siły zbrojne zależy, czy będziemy w stanie szczerze odrzucić takie żądania."
 southern_republic_event.12.o1: "Jesteśmy przede wszystkim Teksańczykami i jedynymi Teksańczykami!"
 southern_republic_event.12.o2: "Gdybyśmy tylko mieli więcej czasu... Zgadzamy się."
 southern_republic_event.13.t: "Teksas odmawia"
 southern_republic_event.13.d: "Naród teksański odrzucił naszą hojną ofertę, więc teraz piłka jest po naszej stronie. Możemy zaryzykować ogólny konflikt i potencjalne rozlanie się go, albo możemy się wycofać. Obie opcje są wykonalne, jednak jedna z nich jest wyraźnie bardziej ryzykowna niż druga."
 southern_republic_event.13.o1: "Żaden mieszkaniec Południa nie wycofuje się z walki"
 southern_republic_event.13.o2: "Może trochę się pospieszyliśmy"
 southern_republic_event.14.t: "Teksas akceptuje naszą ofertę"
 southern_republic_event.14.d: "Dzięki ich akceptacji możemy teraz iść naprzód jako zjednoczony front, aby osiągnąć prawdziwy cel regionalnej jedności. Choć oczywiście umysły będą nieco niespokojne w związku z tą nową unią, ale to przynajmniej początek."
 southern_republic_event.14.o1: "Hot Diggity, kurczę, zadziałało!"
 southern_republic_event.15.t: "Propozycja Południa"
 southern_republic_event.15.d: "Naród południowy przyszedł do nas z ofertą stania się z nimi unią konfederacyjną. Obiecują uczciwą samorządność, ale głównym celem jest zjednoczenie się w polityce zagranicznej w nowej unii regionalnej. Może to być bardzo korzystne dla naszej sytuacji, ponieważ unieważniłoby nasze sankcje międzynarodowe pod pozorem „nieistnienia”. Jednak może to być fortel, aby nas wykorzystać, niezależnie od okoliczności, musimy udzielić odpowiedzi."
 southern_republic_event.15.o1: "Nie poddajemy się byle komu"
 southern_republic_event.15.o2: "Lubię przegrywać sankcje, jasne, że się zgadzamy"
 southern_republic_event.16.t: "Kuba nas odrzuca"
 southern_republic_event.16.d: "The Cubans have refused our demands, now the question is do we want to risk prolonged war through naval warfare and making an invasion force. We do what we can, but it may turn out more costly than what it was worth."
 southern_republic_event.16.o1: "Idziemy na wojnę!"
 southern_republic_event.16.o2: "Nie możemy sobie na to pozwolić w tej chwili"
 southern_republic_event.17.t: "Kuba akceptuje naszą umowę"
 southern_republic_event.17.d: "Przedstawiciele Kuby zaakceptowali naszą umowę i rozpoczniemy prace nad ujednoliconymi prawami i wskaźnikami, aby stworzyć sprawiedliwą i stabilną unię w przewidywalnej przyszłości."
 southern_republic_event.17.o1: "Napoje są ode mnie!"
 southern_republic_event.18.t: "Żądania Południa"
 southern_republic_event.18.d: "Naród południowy zażądał naszego podporządkowania większej unii konfederacyjnej Karaibów. Jesteśmy w wyjątkowej sytuacji, ponieważ naród jest większy, ale jest też w dobrej, przyzwoitej odległości, która pozwala nam przygotować się na siły inwazyjne. Jednak jest to niepewne, czy naprawdę powinniśmy ryzykować taki konflikt."
 southern_republic_event.18.o1: "Nie poddamy się!"
 southern_republic_event.18.o2: "Nie możemy marnować życia naszych obywateli"
 southern_republic_event.19.t: "Haiti odmawia"
 southern_republic_event.19.d: "Plama narodu odrzuciła nasze żądania, musimy działać teraz lub trzymać język za zębami. Sytuacja dyplomatyczna jest nieco napięta, teraz zwycięży rozsądek czy siła."
 southern_republic_event.19.o1: "Siła woli wygrywa"
 southern_republic_event.19.o2: "Nie możemy ryzykować"
 southern_republic_event.20.t: "Haiti akceptuje"
 southern_republic_event.20.d: "Przyjęli nasze żądania i zaczniemy wszystko załatwiać. Dzisiaj jest dobry dzień dla naszego kraju."
 southern_republic_event.20.o1: "Kolejny krok naprzód"
 southern_republic_event.21.t: "Żądania Południa"
 southern_republic_event.21.d: "Naród południowy zażądał naszego podporządkowania większej unii konfederacyjnej Karaibów. Jesteśmy w wyjątkowej sytuacji, ponieważ naród jest większy, ale jest też w dobrej, przyzwoitej odległości, która pozwala nam przygotować się na siły inwazyjne. Jednak jest to niepewne, czy naprawdę powinniśmy ryzykować taki konflikt."
 southern_republic_event.21.o1: "Nie poddamy się!"
 southern_republic_event.21.o2: "Nie możemy marnować życia naszych obywateli"
 southern_republic_event.22.t: "Republika Dominikańska odmawia"
 southern_republic_event.22.d: "Plama narodu odrzuciła nasze żądania, musimy działać teraz lub trzymać język za zębami. Sytuacja dyplomatyczna jest nieco napięta, teraz zwycięży rozsądek czy siła."
 southern_republic_event.22.o1: "Siła woli wygrywa"
 southern_republic_event.22.o2: "Nie możemy ryzykować"
 southern_republic_event.23.t: "Republika Dominikańska akceptuje"
 southern_republic_event.23.d: "Przyjęli nasze żądania i zaczniemy wszystko załatwiać. Dzisiaj jest dobry dzień dla naszego kraju."
 southern_republic_event.23.o1: "Kolejny krok naprzód"
 southern_republic_event.24.t: "Oferty Południowe"
 southern_republic_event.24.d: "Naród południowy poprosił o zawarcie z nami umowy. W zamian za utworzenie unii konfederacyjnej otrzymalibyśmy wszelką pomoc materialną i/lub finansową, jeśli nasze wyspy zostaną uszkodzone przez ekstremalne zjawiska pogodowe. To z pewnością pomogłoby złagodzić presję fiskalną, ale mogłoby być pułapką, jednak co byśmy zyskali, gdybyśmy odmówili... co robić, co robić."
 southern_republic_event.24.o1: "Nie możemy zaakceptować w tym momencie"
 southern_republic_event.24.o2: "Nie mogliśmy przegapić takiej okazji"
 southern_republic_event.25.t: "The Bahamians Refuse"
 southern_republic_event.25.d: "Przedstawiciele rządu Bahamów odrzucili naszą jawnie hojną ofertę. Możemy użyć tego jako usprawiedliwienia lub znaleźć inne sposoby. Tak czy inaczej, będziemy musieli wkrótce podjąć decyzję, jeśli chcemy śledzić nasze cele polityki zagranicznej."
 southern_republic_event.25.o1: "Do diabła, wypowiedz wojnę"
 southern_republic_event.25.o2: "Musimy do tego ponownie podejść"
 southern_republic_event.26.t: "The Bahamians Accept"
 southern_republic_event.26.d: "Przyjęli nasze żądania i zaczniemy wszystko organizować, dziś robimy kolejny krok w kierunku unii regionalnej."
 southern_republic_event.26.o1: "Tyle wysp"
 southern_republic_event.27.t: "Koncesja Południowa"
 southern_republic_event.27.d: "The Southern nation has reached out to us with an offer. They will give us a 100 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.27.o1: "Przydałyby nam się te pieniądze"
 southern_republic_event.27.o2: "Te wyspy są brytyjskie!"
 southern_republic_event.28.t: "Brytyjczycy akceptują"
 southern_republic_event.28.d: "The United Kingdom has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.28.o1: "Całkowicie warte zachodu"
 southern_republic_event.29.t: "The British Refuse"
 southern_republic_event.29.d: "Cholerni Anglicy odrzucili naszą zbyt hojną ofertę, problem polega na tym, że w tej chwili nie możemy sobie pozwolić na incydent dyplomatyczny, więc będziemy musieli do tego wrócić w przyszłości."
 southern_republic_event.29.o1: "Do cholery!"
 southern_republic_event.30.t: "Koncesja Południowa"
 southern_republic_event.30.d: "The Southern nation has reached out to us with an offer. They will give us a 50 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.30.o1: "Przydałyby nam się te pieniądze"
 southern_republic_event.30.o2: "Te wyspy pozostaną francuskie!"
 southern_republic_event.31.t: "Francuzi akceptują"
 southern_republic_event.31.d: "France has accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.31.o1: "Całkowicie warte zachodu"
 southern_republic_event.32.t: "The French Refuse"
 southern_republic_event.32.d: "Ci przeklęci frankofoni odrzucili naszą zbyt hojną ofertę, problem polega na tym, że w tej chwili nie możemy sobie pozwolić na incydent dyplomatyczny, więc będziemy musieli do tego wrócić w przyszłości."
 southern_republic_event.32.o1: "Żabi frajerzy!"
 southern_republic_event.33.t: "Umowa południowa"
 southern_republic_event.33.d: "The Southern nation has reached out to us with an offer. They will give us a 25 billion for the sale of our Caribbean lands. These islands do serve a sort of geostrategical purpose, however they do tend to be a general drain on resources. So the choice is do we need the money or do we need these islands."
 southern_republic_event.33.o1: "Przydałyby nam się te pieniądze"
 southern_republic_event.33.o2: "Wyspy Holenderskie Dla Obywateli Holandii!"
 southern_republic_event.34.t: "Holendrzy akceptują"
 southern_republic_event.34.d: "The Dutch have accepted our concession in acquiring their Caribbean islands and as such integrating these islands will be a fairly simple affair."
 southern_republic_event.34.o1: "Całkowicie warte zachodu"
 southern_republic_event.35.t: "The Dutch Refuse"
 southern_republic_event.35.d: "Ci przeklęci truciciele odrzucili naszą hojną ofertę, problem polega na tym, że w tej chwili nie możemy sobie pozwolić na dyplomatyczny incydent, więc będziemy musieli do tego wrócić w przyszłości."
 southern_republic_event.35.o1: "Potępienie!"
 southern_republic_event.36.t: "Debaty kapitałowe"
 southern_republic_event.36.d: "One of the problems with the old republic was the old capital of D.C. was seen as too far away for a vast majority of the nation. However, its symbolism cannot be discounted as well. We must therefore figure out just where our new capital should be."
 southern_republic_event.36.o1: "D.C. poradził sobie świetnie"
 southern_republic_event.36.o2: "Nowy plan Arlington jest dobry"
 southern_republic_event.36.o3: "Góra Columbia jest wystarczająco centralna"
 southern_republic_event.36.o4: "Odyseusz powinien być w porządku"
 southern_republic_event.37.t: "Nowa droga naprzód"
 southern_republic_event.37.d: "With our policies set in stone and our influences assured we now have the great honor of choosing a new look for our nation. Of course the consensus is to rename the nation to the Confederate States of America as it is only right that we pay tribute to our past and origins. But the question now is the flag. Members of the Dixie First Party want to do the Virginia Battle Flag and update the color scheme so it's not just the Virginia Battle Flag as our great Confederacy is not just the tight asses of Virginian aristocracy. However members of the League of the South wish to take it a step further and use a flag their members have been using a while now which is a plain Virginia Battle Flag with no stars on it but instead a white circle in the center with one large lightning bolt in the center. Some wonder if the latter would be a bit on the nose in terms of political appeal. However more still wonder if its not going far enough, after all this land is truly our land."
 southern_republic_event.37.o1: "Zmieniony schemat kolorów działa"
 southern_republic_event.37.o2: "Lightning Shall Strike Fear Into Our Enemies"
 southern_republic_event.38.t: "Nowy standard krajowy"
 southern_republic_event.38.d: "Ponieważ większość narodu popiera sposób, w jaki prowadzimy sprawy, toczy się ogólna debata na temat tego, czy nasz naród naprawdę reprezentuje sam siebie. Wielu lewicowców chce zmienić markę flagi na socjalistyczną symbolikę, aby ustanowić precedens solidarności z pracownikami narodu. Podczas gdy ci, którzy są po prawej stronie, chcą cofnąć się trochę, aby bardziej symbolicznie nawiązać do początków naszego narodu, ponownie wprowadzając jedną z ostatnich flag, którą Konfederacja reprezentowała samą siebie. Ta flaga byłaby starą flagą z plamami krwi, która ma białą podstawę z solidnym czerwonym paskiem po prawej stronie, a w lewym górnym rogu znajduje się Flaga Bitwy Wirginii. W związku z tym uważają, że nazwa kraju powinna zostać zmieniona na po prostu Republika Dixie. Jednak to opinia publiczna musi o tym zdecydować."
 southern_republic_event.38.o1: "Republika Socjalistyczna To Jest"
 southern_republic_event.38.o2: "Jesteśmy Republiką Dixie"
 southern_republic_event.39.t: "Idąc dalej"
 southern_republic_event.39.d: "Mając rozum i ciesząc się nowo odkrytą dumą narodową, ludzie dążą do reformy, pokazując jedność, a jednocześnie szanując naszą historię, niezależnie od tego, czy jest dobra, czy zła. Jako tacy będziemy odtąd znani jako Southern Union i z dumą będziemy wywieszać flagę Bonnie Blue."
 southern_republic_event.39.o1: "Rzeczywiście południowa rodzina"
 southern_republic_event.40.t: "Stare nawyki, co?"
 southern_republic_event.40.d: "Mając nasze drogi ustalone i ludzi zadowolonych z tego nowego odkrytego celu, uważamy, że nadszedł właściwy czas, aby ustalić nową flagę i nazwę. Pewnego dnia moglibyśmy odzyskać płaszcz. Ale jak mówią, stare nawyki trudno wykorzenić."
 southern_republic_event.40.o1: "Może kiedyś"
 southern_republic_event.41.t: "Arkadyjski Sen"
 southern_republic_event.41.d: "Dziś rozpoczyna się nowa era, która stawia nas przed nową tożsamością, nową ścieżką jedności i nowym wiekiem dobrobytu. Dziś stajemy się ludami Arkadii."
 southern_republic_event.41.o1: "Za Arkadię!!!"
 southern_republic_event.42.t: "Debata na temat stolicy Arkadii"
 southern_republic_event.42.d: "Powstaje nowy naród i wraz z nim zaczyna się nowy rozdział. Gdzie będzie nasza stolica."
 southern_republic_event.42.o1: "Stary niezawodny jest"
 southern_republic_event.42.o2: "Najlepiej sprawdza się ładna, centralna stolica"
 southern_republic_event.43.t: "Opór nacjonalistyczny"
 southern_republic_event.43.d: "W dniach następujących po naszym sprawiedliwym zwycięstwie w pierwszych wyborach w naszym kraju, górscy przestępcy i pijacy z dzikiej Florydy widzieli, jak wyrzucają z ust coś więcej niż tylko wymiociny. Chociaż nie spodziewamy się, że z tego naprawdę wyniknie cokolwiek, wielu zastanawia się, jak głupi jest naprawdę „człowiek z Florydy”."
 southern_republic_event.43.o1: "Jezu, nie znowu to samo"
 southern_republic_event.44.t: "Rosnące niepokoje"
 southern_republic_event.44.d: "In the aftermath of the supposed \"proclamation\" of statehood, the agitation in the state of Florida has steadily risen over the past few more days. This escalation brings fears that our young nation will soon enough be embroiled in war, not with the federals, great lakers or even the Texans but with our own people... This sad realization has resulted in a pre-emptive expansion in armaments production as a way to get ahead of potentially any trouble that may arise in the coming days."
 southern_republic_event.44.o1: "Boże pomóż nam wszystkim..."
 southern_republic_event.45.t: "Rodzinna waśń"
 southern_republic_event.45.d: "They finally did it, the damn Floridians decided that apparently it was just too god damn much to try and work things out. Well by god we'll settle this here and now and make Florida, Southern again. We need to mobilize and set forth what troops we do have to the border."
 southern_republic_event.45.o1: "Tygiel, bardziej jak stopiony mózg"
 southern_republic_event.46.t: "Wojna"
 southern_republic_event.46.d: "Nadszedł czas i musimy odzyskać to, co nam się prawnie należy."
 southern_republic_event.46.o1: "Wyślijcie wojska!"
 southern_republic_event.1000.t: "Brońmy naszych wolności"
 southern_republic_event.1000.d: "Socjalistyczne szumowiny chcą nas podporządkować życiu marksizmu i ubóstwa, no cóż, koniec z tym. Zerwijcie łańcuchy i walczcie o swoje wolności!!!"
 southern_republic_event.1000.o1: "Nasze Słońce Będzie Świecić Najjaśniej Ponad Wszystko!"
 CSA_event_native_exodus.1.t: "Plotki z Oklahomy"
 CSA_event_native_exodus.1.d: "As we attempt something to organize our nation, rumors are coming out of the far lands of Oklahoma that the native population is looking to leave when and where possible. The threat and stigma of a \"Southern\" nation is still pretty strongly resonating, though who could be surprised considering most natives were relegated to specific chunks of land. We can't do much but hope it doesn't cause trouble for us in the future."
 CSA_event_native_exodus.1.o1: "Poczekaj, jeśli odejdą, czy wtedy dostaniemy to za darmo?"
 CSA_event_native_exodus.2.t: "Rosnąca migracja"
 CSA_event_native_exodus.2.d: "W miarę jak umacniamy naszą kontrolę narodową, coraz więcej tubylców z megarezerwatu Oklahomy, znanego po prostu jako „Terytorium Indian”, kontynuuje organizowanie ruchów migracyjnych na północ w kierunku Kansas. Chociaż to smutny dzień, że tracimy tak wiele osób, oznacza to, że pośrednio wysiłki reintegracyjne i ponowne uruchomienie gospodarki w stanie prawdopodobnie będą o wiele łatwiejsze."
 CSA_event_native_exodus.2.o1: "Czy nie powinniśmy się martwić tym, ilu odejdzie?"
 CSA_event_native_exodus.3.t: "Migracja czy exodus?"
 CSA_event_native_exodus.3.d: "More news out of Oklahoma as news of an organization called the Reclamation Front has been the responsible party for organizing these migration patterns from Oklahoma to Kansas. Reports from the region say that Kansas while under a new governmental entity called the Republic of Lakota is technically under their control, most real efforts have been spent on the northern four states as the debate over a new national capital and rebuilding has been a priority. The RF claims that Kansas is a fine new home away from the other \"colonial ran nations\" and that the Council of Six, a reference to the organization's leadership as well as the six tribes which comprised the mega reservation. The Council has determined Kansas to be a better suited more stable home for which we can claim if need be. We're trying to get more info but it looks like rather than fight us, this supposed Reclamation Front believes the Republic of Lakota would be easier to fight and use Kansas as their one true home."
 CSA_event_native_exodus.3.o1: "Myślisz, że powinniśmy im powiedzieć? Nieeee"
 CSA_event_native_exodus.4.t: "Ilu ich było???"
 CSA_event_native_exodus.4.d: "Więcej wiadomości z Oklahomy, gdzie odnotowano największą liczbę migrantów poza stanem. Szacuje się, że depopulacja przekroczyła około siedmiu procent z powodu masowej migracji, więc wielu zastanawia się, ilu rdzennych mieszkańców faktycznie stanowi populację stanu. Cokolwiek to jest, Boże, pomóż im w Kansas, bo kto wie, jakie kłopoty sprawiają im miejscowi."
 CSA_event_native_exodus.4.o1: "Thank God It's No Longer Our Problem"
 CSA_event_native_exodus.5.t: "Nowa pomyślność"
 CSA_event_native_exodus.5.d: "With migration numbers nearing a stoppage of sorts we have a lot of vacated land, businesses and whatnot. As such these lands and so on can be refurbished and used to create a new prosperity which the state has yet to see. Let's just hope we can keep it that way considering what's led to this somehow fortunate turn of events."
 CSA_event_native_exodus.5.o1: "No i co teraz?"
 CSA_event_native_exodus.1001.t: "Co teraz?"
 CSA_event_native_exodus.1001.d: "As the debates go on about the new capital, some rumors from the south have begun to reach us. Supposedly an ever-growing influx of native americans have been fleeing Oklahoma and settling into Kansas. While we don't know what the reasonings or if there is an issue to be had at hand here, we do know that right now it is not a problem."
 CSA_event_native_exodus.1001.o1: "Wróć, jeśli to będzie problem, proszę"
 CSA_event_native_exodus.1002.t: "Jeszcze raz, serio"
 CSA_event_native_exodus.1002.d: "Więcej wiadomości z Kansas, najwyraźniej więcej tubylców uciekło do Kansas, a w rezultacie wzrósł potencjał rozwojowy jako proxy. Szczerze mówiąc, nie brzmi to dla mnie źle."
 CSA_event_native_exodus.1002.o1: "Czy jest jakiś powód, dla którego wróciłeś?"
 CSA_event_native_exodus.1003.t: "Boże, co teraz?"
 CSA_event_native_exodus.1003.d: "Kolejne wieści z Kansas, ponieważ grupa o nazwie Reclamation Front ogłosiła swój zamiar pomocy stanowi Kansas w odbudowie i rozwoju. Wydaje się, że jest to łagodne wyzwanie dla naszej władzy, ale przy tak skąpym stanie i naszej umacniającej się kontroli nad większością kraju nie mamy żadnych poważnych obaw co do tych wichrzycieli."
 CSA_event_native_exodus.1003.o1: "Czy teraz mogę skupić się na swojej pracy?"
 CSA_event_native_exodus.1004.t: "Tak?"
 CSA_event_native_exodus.1004.d: "Kansas leadership has expressed their gratefulness in allowing the RF to help rebuild the state, over all things have been pretty peaceful and are looking to be for a while. But many up north are wary as such random kindness does not just happen for the sake of \"good will\". We'll be sending representatives to figure just what we're dealing with soon enough."
 CSA_event_native_exodus.1004.o1: "Wyślij audytorów"
 CSA_focus_havana_help: "Pomoc Hawana"
 CSA_focus_havana_help_desc: "Największym graczem karaibskim jest Kuba. Musimy zabezpieczyć ten „wielki ser”, jeśli chcemy dojść do porozumienia z innymi narodami. Jeśli będziemy musieli, pójdziemy na wojnę, jednak jeśli wojny można uniknąć, możemy ją uratować innymi mniejszymi plamami na mapie."
 CSA_focus_bahaman_bargain: "Okazja na Bahamy"
 CSA_focus_bahaman_bargain_desc: "Rozproszone wyspy tworzące Bahamy są stale narażone na zniszczenie przez coroczne huragany. Naszym największym atutem jest to, że możemy zapewnić pomoc finansową i materialną tym wyspom i ich mieszkańcom, jeśli zjednoczymy się w unii konfederacyjnej. Oczywiście to zależy od nich, jednak w końcu znajdziemy sposób."
 CSA_focus_bahama_blast: "Wybuch Bahama"
 CSA_focus_bahama_blast_desc: "These scattered islands would make perfect training grounds for future war plans along the gulf. So let's gain some experience then, besides they can't be in any meaningful position for striking deals with."
 CSA_arcadia_path_desc: "[CSA.GetFlag]§YPołudniowa Republika Ameryki§! Zmienia nazwę na §YArcadia§!"
 CSA_rallying_dixies_defenders: "Zmobilizowanie obrońców Dixie"
 CSA_rallying_dixies_defenders_desc: "Chłopcy! Musimy bowiem dać odpór wrogowi, gdziekolwiek uderzy."
 CSA_creating_infantry_reserves: "Organizowanie Sił Rezerwowych"
 CSA_creating_infantry_reserves_desc: "Utworzenie gotowych sił rezerwowych pozwoli nam na wyprzedzające przygotowanie się na ewentualną wtargnięcie wroga lub inne działania, które zaplanujemy w przyszłości."
 CSA_mobilizing_the_reserves: "Zbierz rezerwy"
 CSA_mobilizing_the_reserves_desc: "Zbierzcie się chłopcy, bo wasza ojczyzna was potrzebuje. Dajcie nam dzień i przygotujcie się na wszystko, co ci z północy lub zachodu ośmielą się nam rzucić!"
 CSA_focus_gran_colombian_sub_regionalism: "Grankolumbijski subregionalizm"
 CSA_focus_gran_colombian_sub_regionalism_desc: "Creating a sort of sub-region within our confederal union will allow for more local cohesions which feed back into our new regional power. Overall we look to set the stage for unity through identity, these nations and sub-regions were proud and good nation-states at one point or another and it's our job to recognize and embrace it in order to properly move forward together as one."
 CSA_focus_soldiers_of_nature: "Żołnierze Natury"
 CSA_focus_soldiers_of_nature_desc: "Ziemie, które posiadamy, są różnorodne i liczne. Tak liczne, że łatwo przewidzieć, że obce mocarstwa będą chciały zagarnąć nasze ziemie dla siebie. Dlatego musimy szkolić, udoskonalać i kształtować nasze wojsko, aby rozumiało te niezwykle zróżnicowane tereny, abyśmy mogli nie tylko bronić własnych domów. Ale jeśli nadejdzie taki dzień, możemy wyrwać walkę z naszej ziemi i pozwolić, by stała się ona ich ziemią i ich krwią."