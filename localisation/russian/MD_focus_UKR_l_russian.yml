 ukraine_develop_btr4.8.name: "Тестовая программа для БТР «БТР-4»"
 ukraine_develop_btr4.8.desc: "Мы можем выбрать продолжительность и сложность предпроизводственных испытаний БТР-4.\n\nМы можем разработать базовую программу, сэкономив деньги и время, или же создать обширную, которая потребует больше ресурсов, но позволит выявить и устранить некоторые проблемы, проявляющиеся при мелкосерийном производстве. Их устранение может привести к повышению надежности машины в полномасштабном производстве."
 ukraine_develop_btr4.8.a: "Базовые тесты"
 ukraine_develop_btr4.8.b: "Расширенные тесты"
