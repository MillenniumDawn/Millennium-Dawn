 NKO_vpk: "Отечественный военно-промышленный комплекс"
 NKO_sad_army_idea: "Устаревшая народная армия"
 NKO_sad_army_idea_desc: "Этот национальный дух будет §Yулучшен§!, если мы достигнем §Hреволюционного военного духа§! в своих целях. \n§W--------------§!\nАрмия Северной Кореи, несмотря на значительную численность, в значительной степени полагается на устаревшее оборудование и технологии. Большая часть её арсенала состоит из танков, артиллерии и самолётов советских времён с ограниченной модернизацией. Такая зависимость от старых систем отражает нехватку ресурсов и международные санкции, из-за чего армия сильна численностью, но уступает современным вооружённым силам в эффективности и возможностях."
 NKO_new_army_idea: "Новая Северокорейская народная армия"
 NKO_new_army_idea_desc: "Модернизированная армия Северной Кореи сочетает в себе передовые отечественные технологии со стратегическими усовершенствованиями ключевых военных объектов. Усовершенствованные ракетные системы, беспилотные летательные аппараты и возможности ведения кибервойны демонстрируют сдвиг в сторону модернизации. Несмотря на то, что армия по-прежнему ограничена санкциями, акцент на инновациях и тактике асимметричной войны делает её грозной силой в регионе."
