 ITA_Anti_Air_0: "FIM-43 Redeye"
 ITA_Anti_Air_0_desc: "Разработанная нашей компанией General Dynamics, эта ракетная система использует пассивное инфракрасное самонаведение для отслеживания самолётов по теплу их выхлопа — после того как оператор визуально возьмёт цель на сопровождение, как и при стрельбе из любого другого стрелкового оружия. Это оружие, требующее для поражения прямого попадания, примитивно, но эффективно."
 ITA_Anti_Air_1: "FIM-92 Stinger"
 ITA_Anti_Air_1_desc: "Эта пассивная ракета класса «воздух-поверхность», разработанная так же, как и её предшественница, имеет несколько новых усовершенствований по сравнению с предыдущей моделью, таких как улучшенная баллистика, программное обеспечение, а также вариант с двойным ИК- и УФ-обнаружением."
 ITA_Anti_Air_2: "FIM-92E Stinger"
 ITA_Anti_Air_2_desc: "Продолжая развивать надёжность платформы «Stinger», компания General Dynamics усовершенствовала систему, добавив новый датчик переворачивания и пересмотрев программное обеспечение управления, поведение в полёте также значительно улучшилось. Кроме того, значительно повысилась эффективность борьбы с небольшими целями, такими как беспилотники, крылатые ракеты и лёгкие разведывательные вертолёты."
 ITA_Anti_Air_3: "FIM-194 Speargun"
 ITA_Anti_Air_3_desc: "Поскольку самолёты 5-го поколения стали заметным элементом на поле боя, последняя версия нашей системы ПЗРК включает ряд изменений, направленных на противодействие этому новому противнику. Особенно стоит отметить её возможности наведения, которые включают управление по линии зрения, лазерное наведение, а также использование УФ- и ИК-наведения."
 ITA_Anti_Air_4: "FIM-245 Heartstriker"
 ITA_Anti_Air_4_desc: "Эта система, разработанная в рамках программы DARPA, является вершиной наших платформ ПЗРК. Благодаря недавним достижениям и миниатюризации сенсоров наши инженеры позволили одному человеку обладать эффективной мощностью, способной уничтожить или вывести из строя некоторые из самых скрытных самолётов, доступных нашим противникам."
