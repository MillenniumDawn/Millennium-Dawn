 L_Strike_fighter1: "ЛРБ 1975 года"
 L_Strike_fighter_desc: "Лёгкие истребители — это истребители, находящиеся в нижней части практического диапазона массы, стоимости и сложности, в котором создаются истребители."
 L_Strike_fighter1_desc: "Лёгкие реактивные бомбардировщики разработаны как учебно-тренировочные самолёты. Однако, будучи переоборудованными для несения ударной нагрузки, они могут использоваться для непосредственной авиационной поддержки, особенно против противника, не имеющего собственных военно-воздушных сил, например против повстанцев."
