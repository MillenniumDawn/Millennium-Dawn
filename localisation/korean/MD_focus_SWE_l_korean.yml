 Sweden_foci.5003.o1: "패러독스에게 그 나라를 지역 차단하라고 전하라"
 Sweden_foci.6.t: "스웨덴 잠수함 전력 확충"
 Sweden_foci.6.d: "해군력을 강화하고 해양 이익의 방어를 확보하기 위해 스웨덴은 잠수함 전력의 확충을 검토하고 있습니다. 우리에게는 몇 가지 선택지가 있습니다. 해외 동맹국으로부터 첨단 잠수함을 조달하거나, 독자적인 설계를 개발하는 것입니다."
