 PROPAGANDA_FASCISM: "§Y Salafici §!"
 prowestern_propaganda_button_tt: "§YProzachodnia§! Kampania propagandowa\nWykorzystując wojnę informacyjną, możemy wpływać na opinię publiczną w kwestii sytuacji na świecie. Jednak każda taka kampania będzie skuteczna jedynie przez ograniczony czas, ponieważ ludzie stopniowo tracą zainteresowanie.\n\n§YKoszt kampanii propagandowej§! Modyfikator: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YKoszt prozachodniej kampanii propagandowej§! Modyfikator: [?ROOT.modifier@western_outlook_campaign_cost_modifier|-2%]\n\n§YWarunki wstępne: §!\n[!prowestern_propaganda_button_click_enabled]\n§YModyfikatory aktywne w trakcie działania:§!\n[!prowestern_propaganda_button_click]"
 emerging_propaganda_button_tt: "Kampania propagandowa §Ywschodzących perspektyw§!\nWykorzystując wojnę informacyjną, możemy wpływać na opinię publiczną w kwestii sytuacji na świecie. Jednak każda taka kampania będzie skuteczna jedynie przez ograniczony czas, ponieważ po pewnym okresie ludzie tracą nią zainteresowanie.\n\n§YKoszt kampanii propagandowej§! Modyfikator: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YKoszt kampanii propagandowej dotyczącej wschodzących perspektyw§! Modyfikator: [?ROOT.modifier@emerging_outlook_campaign_cost_modifier|-2%]\n\n§YWarunek wstępny:§!\n[!emerging_propaganda_button_click_enabled]\n§YModyfikatory aktywne w trakcie działania:§!\n[!emerging_propaganda_button_click]"
 nonaligned_propaganda_button_tt: "Kampania propagandowa §YPaństw niezaangażowanych§!\nWykorzystując wojnę informacyjną, możemy wpływać na opinię publiczną w kwestii sytuacji na świecie. Jednak każda taka kampania będzie skuteczna jedynie przez ograniczony czas, ponieważ ludzie stopniowo tracą zainteresowanie.\n\n§YKoszt kampanii propagandowej§! modyfikator: [?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YKoszt kampanii propagandowej Ruchu Państw Niezaangażowanych§! Modyfikator: [?ROOT.modifier@nonaligned_outlook_campaign_cost_modifier|-2%]\n\n§YWarunek wstępny:§!\n[!nonaligned_propaganda_button_click_enabled]\n§YModyfikatory aktywne w trakcie działania: §!\n[!nonaligned_propaganda_button_click]"
 nationalist_propaganda_button_tt: "§YNacjonalistyczna§! kampania Propaganowa\nWykorzystując wojnę informacyjną, możemy wpływać na opinię publiczną tak, by postrzegała ona sytuację na świecie z perspektywy nacjonalistycznej. Jednak każda tego typu kampania będzie skuteczna jedynie przez ograniczony czas, ponieważ ludzie z biegiem czasu tracą nią zainteresowanie.\n\n§YKoszt kampanii propagandowej§! Modyfikator:[?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YKoszt nacjonalistycznej kampanii propagandowej§! Modyfikator:[?ROOT.modifier@nationalist_outlook_campaign_cost_modifier|-2%]\n\n§YWarunek wstępny: §!\n[!nationalist_propaganda_button_click_enabled]\n§Y Modyfikatory aktywne w trakcie działania: §!\n[!nationalist_propaganda_button_click]"
 fascism_propaganda_button_tt: "§YFasztystkowska§! Kampania Propagandowa\nWykorzystując wojnę informacyjną, promowanie ultrakonserwatywnych duchownych i tym podobne działania, możemy wpływać na opinię publiczną w kwestii sytuacji na świecie i radykalizować ją na korzyść salafizmu. Jednak każda taka kampania będzie skuteczna jedynie przez ograniczony czas, ponieważ ludzie z biegiem czasu tracą zainteresowanie.\n§RNie wszystkie kraje mogą prowadzić propagandę salaficką!§!\n\n§YKoszt kampanii propagandowej§! Modyfikator:[?ROOT.modifier@propaganda_campaign_cost_modifier|-2%]\n§YKoszt kampanii indoktrynacji salafickiej§! Modyfikator: [?ROOT.modifier@salafist_outlook_campaign_cost_modifier|-2%]\n\n§YWarunek wstępny: §!\n[!fascism_propaganda_button_click_enabled]\n§YModyfikatory aktywne w trakcie działania:§!\n[!fascism_propaganda_button_click]"
