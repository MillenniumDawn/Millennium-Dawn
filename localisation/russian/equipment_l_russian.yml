 IFV_1: "БМП 1965 года"
 IFV_1_desc: "Боевые машины пехоты (БМП) — тяжелобронированные машины, доставляющие в бой отделение солдат. Десант может вести бой прямо из машины в гораздо большей степени, чем из БТР. БМП вооружены крупнокалиберным пулемётом и автоматической пушкой либо оснащены ПТУР. Пехоту, перевозимую на БМП, называют бронетанковой пехотой или тяжёлой механизированной пехотой."
 IFV_desc: "Боевая машина пехоты (БМП) — тип бронированной боевой машины, используемой для доставки пехоты в бой и оказания непосредственной огневой поддержки."
