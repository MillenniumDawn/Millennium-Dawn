 west_bank_barrier_no_settlements: "Barreira da Cisjordânia"
 west_bank_barrier_no_settlements_desc: "Uma barreira de segurança contínua que corre ao longo e próxima da linha do armistício de 1949, projetada para impedir infiltrações vindas da Cisjordânia. Construída sem cercar os blocos de assentamentos israelenses, a barreira segue uma rota mais direta e oferece fortes posições defensivas contra ataques palestinos."
 west_bank_barrier_with_settlements: "Barreira da Cisjordânia"
 west_bank_barrier_with_settlements_desc: "Uma barreira de segurança construída para incorporar os principais blocos de assentamentos israelenses em seu perímetro, estendendo o trajeto da barreira para dentro da Cisjordânia. A rota mais longa e complexa oferece eficiência operacional ligeiramente reduzida em comparação com uma barreira alinhada mais de perto à Linha Verde."
 settlement_removal_plans_1: "Planos de Remoção de Assentamentos"
 settlement_removal_plans_1_desc: "Fase inicial de planejamento para a remoção de assentamentos israelenses isolados da Cisjordânia. Equipes de levantamento foram enviadas e estruturas de compensação estão sendo elaboradas. Nenhum colono foi notificado ainda."
 settlement_removal_plans_2: "Planos de Remoção de Assentamentos"
 settlement_removal_plans_2_desc: "O governo notificou formalmente os moradores dos primeiros assentamentos designados de que a evacuação será necessária. Contestações judiciais são esperadas, e os arranjos de segurança para o processo de retirada estão sendo coordenados com as FDI."
 settlement_removal_plans_3: "Planos de Remoção de Assentamentos"
 settlement_removal_plans_3_desc: "A evacuação da primeira leva de assentamentos designados está em andamento. Os pagamentos de compensação começaram e moradias temporárias foram providenciadas. A oposição dos movimentos de colonos está se intensificando, exercendo pressão significativa sobre a coalizão governante."
 settlement_removal_plans_4: "Planos de Remoção de Assentamentos"
 settlement_removal_plans_4_desc: "A maioria dos assentamentos visados foi evacuada e desmantelada. As forças das FDI foram redistribuídas para o novo perímetro de segurança. No âmbito interno, o processo aprofundou as divisões na sociedade israelense, embora a recepção internacional tenha sido amplamente positiva."
 settlement_removal_plans_5: "Planos de Remoção de Assentamentos"
 settlement_removal_plans_5_desc: "O programa de remoção de assentamentos está concluído. Todos os postos designados foram evacuados e as terras devolvidas à administração civil palestina. O governo agora enfrenta as consequências políticas do processo, com facções linha-dura buscando reverter ou contestar o resultado."
