 chassis_light_tank_gen4: "Шасси лёгкого танка V"
 chassis_wheeled_afv_gen0_desc: "Это шасси, вдохновлённое ранними колёсными разведывательными машинами, такими как Panhard AML, отличается быстротой развёртывания и универсальностью на местности, что позволяет вести быстрые боевые действия с минимальными затратами."
 chassis_tracked_afv_gen0_desc: "Сбалансированное шасси, основанное на наследии таких машин, как БТР М113 и БМП-1, при умеренной стоимости производства обеспечивает как защиту, так и прорывные возможности."
 chassis_light_tank_gen0_desc: "Шасси, созданное по мотивам PT-76 и M551 Sheridan, предлагает сочетание возможностей по защите и прорыву, пригодных для использования в различных сценариях."
 chassis_wheeled_afv_gen1_desc: "Шасси, созданное на основе достижений французской модели ERC-90 Sagaie, сохраняет свою приверженность непревзойденной скорости, но при этом вкладывает немного больше средств для повышения эксплуатационной устойчивости."
 chassis_tracked_afv_gen1_desc: "Развиваясь на базе таких проектов, как Скорпион и CVR(T), он расширяет свои оперативные возможности, сохраняя при этом средний уровень скорости."
 chassis_light_tank_gen1_desc: "Благодаря опыту танков типа AMX-13, он сочетает в себе устойчивость к внешним воздействиям с эффективным боевым мастерством, что позволяет ему оставаться более маневренным, чем более тяжелые аналоги."
 chassis_wheeled_afv_gen2_desc: "Опираясь на инновации EE-9 Cascavel и LAV-25, колёсный вариант остаётся лёгким и бюджетным, а его усовершенствования направлены на повышение уровня защиты и прорывных возможностей."
 chassis_tracked_afv_gen2_desc: "Шасси, созданное под влиянием инноваций Bradley и BMD-4, обеспечивает улучшенную защиту, позволяя добиться успехов как в обороне, так и в прорыве."
 chassis_light_tank_gen2_desc: "Взяв за основу опыт AWC Wiesel и Type 89 БМП, конструкция свидетельствует об усилении брони и защиты при сохранении достойной мобильности."
 chassis_wheeled_afv_gen3_desc: "Отражая модульный подход Boxer и Stryker, стоимость производства увеличивается незначительно, обеспечивая адаптивность без ущерба для фирменной скорости."
 chassis_tracked_afv_gen3_desc: "Отражая достижения CV90 и ASCOD, эта модель сочетает в себе оборонные и прорывные возможности при более высокой стоимости производства"
 chassis_light_tank_gen3_desc: "Отражая достижения M8 Buford и 2S25 Sprut-SD, конструкция обеспечивает приоритет прорыва и обороны, не становясь при этом слишком громоздкой."
 chassis_wheeled_afv_gen4_desc: "В этом шасси, представляющем собой концепцию будущих боевых действий, интегрированы самые современные технологии для обеспечения обороны и прорыва, а маневренность дополняется лучшей защитой."
 chassis_tracked_afv_gen4_desc: "Эта модель, ориентированная на поля сражений будущего, гарантирует, что, хотя стоимость производства может возрасти, отдача в виде оборонных, прорывных и броневых характеристик будет непревзойдённой."
 chassis_light_tank_gen4_desc: "Предвосхищая требования будущих войн, шасси включает в себя новейшие технологии защиты, что позволяет ему оставаться грозным выбором с точки зрения защиты и прорыва, не теряя при этом преимущества в скорости по сравнению с основными боевыми танками."
 smoke_launchers_3: "Современная система дымового и лазерного оповещения"
 smoke_launchers_3_desc: "Система лазерного предупреждения оповещает экипаж о нападении на машину ракеты с лазерным наведением или системы управления огнем танка.\n\n§GПодсказка дизайнера: Установка дымовых установок снижает заметность нашего танка, делая его лучше как в обороне, так и в нападении.§!"
 SOV_smoke_launchers_3: "Штора-1"
 SOV_smoke_launchers_3_desc: "Электрооптический комплекс активной защиты «Штора-1» представляет собой современное дымовое гранатометное устройство. Он стреляет дымовой гранатой 3Д17, дымящейся красным фосфором. Дым горит достаточно жарко, чтобы скрыть танк от тепловидения.\n\n§GПодсказка дизайнера: Установка дымовых установок снижает заметность нашего танка, делая его лучше как в обороне, так и в нападении.§!"
 USA_tank_small_medium_cannon_2: "105 mm M68A1"
 USA_reactive_armor_gen1: "АРАТ I"
 tank_heavy_tank_turrets: "Башни для сверхтяжелых танков"
 tank_heavy_tank_turrets_desc: "Вершина современной инженерии в области танковых башен. Сверхтяжёлая танковая башня обеспечивает огромную защиту от стрелкового оружия, крупнокалиберных орудий и многого другого. В ней с комфортом могут разместиться от трёх до четырёх членов экипажа, а также есть место для дополнительного вооружения, для которого требуется дополнительное пространство, которого нет у обычных пушек.\n\n§GПодсказка дизайнера: это специальная футуристическая танковая башня. Используйте эту танковую башню, если хотите установить специальные виды оружия, такие как рельсотрон или двойные стволы§!"
 aa_launchers: "ЗРК, установленный на танке"
 aa_launchers_desc: "Зенитная установка, установленная снаружи танка, которую можно использовать для поражения воздушных целей противника изнутри танка.\n\n§GСовет от дизайнера: если оснастить наши танки зенитной установкой, мы получим некоторую защиту от вражеской авиации§!"
 tank_railgun_cannon_1: "Рельсотронная танковая пушка"
 tank_railgun_cannon_1_desc: "Развитие электродвигателей и электромагнитных технологий позволяет нам разгонять специальные снаряды до невероятно высоких скоростей. Корректировка этих снарядов обеспечит превосходное пробивание брони, делая даже самую толстую броню бесполезной."
 tank_railgun_cannon_2: "Плазменная рельсотронная танковая пушка"
 tank_railgun_cannon_2_desc: "Вместо твёрдого снаряда плазменная рельсотронная пушка выпускает заряд ионизированного горячего газа, или плазмы. При столкновении плазма взрывается, создавая большое количество тепла и кинетическую энергию. Она также испускает электромагнитное излучение, которое выводит из строя электронику поблизости."
 tank_double_barrel_tank_cannons: "Двуствольные танковые пушки"
 tank_double_barrel_tank_cannons_desc: "Работая над тем, что кажется чистой научной фантастикой, наши инженеры придумали способ установить два орудия основного боевого танка в одну башню. Это позволяет увеличить скорострельность и уничтожать вражескую броню и подразделения, подавляя их массированным огнём. На случай, если вы захотите уничтожить как можно больше целей 155-миллиметровыми снарядами."
 tank_focused_laser_beam_cannon: "Пушка с сфокусированным лазерным лучом"
 tank_focused_laser_beam_cannon_desc: "Одному из наших учёных пришла в голову блестящая идея преобразовать наши стоматологические лазеры в чистую сфокусированную энергию, которую мы можем использовать для мгновенного испарения противника или нанесения серьёзного урона броне и твёрдым целям. Так называемая «лучевая пушка» с дополнительными аккумуляторными батареями и прочим потребует больших затрат на пространство и внутреннюю инженерию нашей брони, но это компенсируется тем, что её не нужно перезаряжать благодаря автономным батареям и бортовым компьютерам. Настоящая мечта сторонников «зелёных». Никаких отходов, никаких проблем!"
 tank_laser_point_defense: "Лазерная система точечной обороны"
 tank_laser_point_defense_desc: "Лазерная система, предназначенная для борьбы с дронами, охотящимися за танком, и вражескими ПТУР"
 EQ_MOD_CAT_tank_large_special_main_armament_TITLE: "Крупногабаритное специальное танковое вооружение"
 tank_battlestation_5: "Передовая боевая станция"
 tank_battlestation_5_desc: "Набор камер и усовершенствованных систем наблюдения за полем боя.\n\n§GДизайнерский совет: боевая станция представляет собой артиллерийские системы, системы управления огнём, оптику и другое вспомогательное оборудование, необходимое для работы танка. Более совершенная боевая станция улучшит качество вашего танка в целом.§!"
 tank_battlestation_2_thermal: "Тепловая боевая станция"
 tank_battlestation_2_thermal_desc: "Боевая рубка 80-х годов с тепловизором.\n\n§GПодсказка для дизайнеров: боевая рубка представляет собой артиллерийские системы, систему управления огнём, оптику и другое вспомогательное оборудование, необходимое для работы танка. Улучшенная боевая рубка повысит качество вашего танка в целом.§!"
