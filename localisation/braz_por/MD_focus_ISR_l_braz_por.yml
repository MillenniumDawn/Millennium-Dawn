 israel_economy.197.d: "A Jordânia concordou com nossa oferta. A construção começará em breve."
 israel_economy.197.a: "Ótimo!"
 israel_economy.198.t: "A Jordânia recusa!"
 israel_economy.198.d: "Eles não concordaram com nossa oferta."
 israel_economy.198.a: "Affe!"
 israel_economy.199.t: "Israel propõe projeto ferroviário!"
 israel_economy.199.d: "Israel propõe a construção de uma ferrovia que ligará nossos países. O custo será dividido igualmente entre nós. Devemos concordar?"
 israel_economy.199.a: "Claro!"
 israel_economy.199.b: "Não!"
 israel_economy.200.t: "A Arábia Saudita concorda!"
 israel_economy.200.d: "A Arábia Saudita concordou com nossa oferta. A construção começará em breve."
 israel_economy.200.a: "Ótimo!"
 israel_economy.201.t: "A Arábia Saudita recusa!"
 israel_economy.201.d: "Eles não concordaram com nossa oferta."
 israel_economy.201.a: "Affe!"
 ISR_quad_idea: "Parceria I2U2"
 israel_economy.202.t: "Israel propõe a Aliança I2U2!"
 israel_economy.202.d: "O Grupo visa mobilizar capital e expertise do setor privado para alcançar uma variedade de objetivos, incluindo modernizar a infraestrutura, promover caminhos de desenvolvimento de baixo carbono e melhorar a saúde pública.  Os projetos e iniciativas da parceria I2U2 não se limitam a um escopo geográfico - o Grupo explorará oportunidades em qualquer lugar em que possa causar um impacto positivo. O Grupo I2U2 será liderado por representantes governamentais de alto escalão de cada país parceiro, incluindo os quatro altos funcionários a seguir, que trabalham em estreita colaboração e prestam contas aos chefes de governo."
 israel_economy.202.a: "Onde assino?"
 israel_economy.202.b: "Não."
 israel_economy.203.t: "[FROM.GetNameWithFlag] concorda!"
 israel_economy.203.d: "[FROM.GetNameWithFlag] concordou com nossa oferta e se juntará ao nosso acordo em breve!"
 israel_economy.203.a: "Ótimo!"
 israel_economy.204.t: "[FROM.GetNameWithFlag] recusa!"
 israel_economy.204.d: "Eles não se juntarão ao Projeto I2U2."
 israel_economy.204.a: "Muito lamentável."
 israel.2.t: "Israel oferece cooperação militar"
 israel.2.d: "A delegação israelense propõe cooperação militar entre suas empresas militares e nosso consórcio Kalashnikov para desenvolver armas para o exército israelense. Em particular, oferecem o desenvolvimento conjunto do fuzil de assalto AK Alfa, por meio de nossa subsidiária americana Kalashnikov USA. Devemos aceitar?"
 israel.2.a: "Concordamos."
 israel.2.b: "Não."
 israel.3.t: "A Rússia concordou"
 israel.3.d: "Em breve começaremos o desenvolvimento conjunto de armas com o Consórcio Kalashnikov. "
 israel.3.a: "Ótimo!"
 israel.4.t: "A Rússia discordou"
 israel.4.d: "Eles rejeitaram nossa oferta, teremos que mudar nossos planos..."
 israel.4.a: "Droga."
 ISR_india_europe_corridor: "Corredor para a Europa"
 ISR_india_europe_corridor_desc: "Israel deve ser o corredor da Ásia para a Europa, conectando o comércio de ambas as regiões."
 ISR_yotzma_idea: "Iniciativa Yotzma"
