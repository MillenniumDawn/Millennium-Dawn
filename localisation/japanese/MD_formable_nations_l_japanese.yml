 PBL_form_category: "ペルー・ボリビア連合"
 PBL_form_category_desc: "The Peru-Bolivian Confederation was originally a short-lived entity in the early 19th century. It arose from the division of the Peruvian Republic and the civil wars of 1834 and 1835 to 1836 and included the Bolivian State. Modern talks are minimal, but it is nevertheless ever present in the political atmosphere of the Bolivian and Peruvian people. It is time to consider this new tomorrow for our people."
 PBL_integrate_start: "[GetPBLNameDef]形成の開始"
 PBL_integrate_start_desc: ""
 PBL_integrate_peru: "[GetPBLNameAdj][PRU.GetAdjective]地域の統合"
 PBL_integrate_peru_desc: "ペルーは連合の二つの国家の中で大きい方だ。それは最大の人口、経済、面積を維持している。ペルーの統合は巨大な事業だが、ここを確保することは新しい連合の利益にとって強固な動きである。"
 PBL_integrate_bolivia: "[GetPBLNameAdj][BOL.GetAdjective]地域の統合"
 PBL_integrate_bolivia_desc: "ボリビアは連合を設立した二つの主要国家の一つである。それは面積、人口、経済力において小さな国だが、これはこの国を軽視する理由にはならない。山々は電子機器やその他の中間財の生産に不可欠な原材料が豊富だ。この国を統合することで、我々の多様化した経済のためのさらなる強固な基盤を築くことになる。"
 PBL_WESTPAR_integrate: "パラグアイ西部の統合"
 PBL_WESTPAR_integrate_desc: "西パラグアイは西ブラジルや北チリと同じ原材料を誇ってはいないが、この地域には豊富な農地や我々の産業を発展に貢献できる地域がある。"
 PBL_WESTBRA_integrate: "ブラジル西部の統合"
 PBL_WESTBRA_integrate_desc: "西ブラジルには先住民族、豊富な資源、そしてさらに多くのものがある。西ブラジルの統合によって、国家の立場を改善し、発展可能な土地を増やすべきだ。"
 PBL_NORTHCHL_integrate: "チリ北部の統合"
 PBL_NORTHCHL_integrate_desc: "チリの北部地域は統合に適しており、我々は将来の目標を支援するために取り込まなければならない。"
