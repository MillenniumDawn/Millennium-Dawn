 PMR_russia_moldovian_way: "Conseil suprême"
 PMR_russia_moldovian_way_desc: "\n\n\n\n\n\n£PMR_desctext_rusmlv \n\n\n\n\n\n\n\n\nThe Supreme Council of the Pridnestrovian Moldavian Republic is, according to the Constitution of the Pridnestrovian Moldavian Republic, the representative and only legislative body of state power of the unrecognized Pridnestrovian Moldavian Republic."
 PMR_moldova_refendum: "Organiser un référendum pour rejoindre [MLV.GetFlag]§Yla Moldavie§!"
 PMR_russia_refendum: "Organiser un référendum pour rejoindre [SOV.GetFlag]§Yla Russie§!"
 PMR_kazaks_prepare: "L’armée cosaque de la mer Noire"
 PMR_kazaks_prepare_desc: "\n\n\n\n\n\n£PMR_desctext_kazaki\n\n\n\n\n\n\n\n\n§YOrigines§! de la renaissance de l’§Yarmée cosaque de la mer Noire§! remontent à l’histoire des §GCosaques de Zaporojie§! et de la §GSitch de Zaporojie§!, §Rliquidée§! en 1775. Créée à la fin de 1787 à partir de groupes disparates de §GCosaques de Zaporojie§!, l’§Y« Armée des Cosaques loyaux de Zaporojie »§! devint un bouclier fiable de [SOV.GetFlag]§YRussie§! dans le sud, entre les rivières Dniestr et Bug, sur des terres dont une partie importante fait maintenant partie de [PMR.GetFlag]§YTransnistrie§!. §YLes Cosaques de la mer Noire§!, couverts de la gloire des victoires lors de la [SOV.GetFlag][TUR.GetFlag]§Rguerre russo-turque§! de 1787-1791, furent réinstallés par décret de l’impératrice Catherine II après la fin de la guerre en 1792-1793 dans le [KUB.GetFlag]§YKuban§!, où l’§Yarmée cosaque de la mer Noire§! continua de protéger les frontières sud de [SOV.GetFlag]§YRussie§! jusqu’en 1860, lorsqu’elle fusionna avec l’§Yarmée de la ligne du Caucase§! et devint connue sous le nom de [KUB.GetFlag]§Yarmée cosaque du Kouban§!. Les bouleversements soudains dans la société de l’§RUnion soviétique§! et la menace imminente contre l’intégrité de l’État ont provoqué à la fin des années 80 un mouvement pour raviver §Yles Cosaques§!, qui, tout au long de son histoire séculaire, a été un rassembleur et un bouclier fiable de la §YPatrie§!. Après plus d’un demi-siècle d’oubli et de déformation de l’essence des §YCosaques§!, de §Rrépression§! et de §Rgénocide§!, on parla à nouveau des §YCosaques§! comme d’une partie intégrante de l’histoire de l’État [SOV.GetFlag]§Yrusse§!. Aujourd’hui, en plus de l’armée principale, [PMR.GetFlag]§YTransnistrie§! a également la possibilité de mobiliser des détachements §Ycosaques§! pour la §Rguerre§!, qui deviendront la base de soutien de l’armée dans la guerre contre les ennemis."
 PMR_kazak_kamensk: "§YMobiliser§! les Cosaques du district de Kamensky"
 PMR_kazak_ryibninsk: "§YMobiliser§! les Cosaques du district de Rybnitsa"
 PMR_kazak_dubossar: "§YMobiliser§! les Cosaques du district de Dubossary"
 PMR_kazak_slobodze: "§YMobiliser§! les Cosaques du district de Slobodzeya"
 PMR_kazak_benderi: "§YMobiliser§! les Cosaques de Bender"
 PMR_smirnov_era: "L'ère Smirnov"
 PMR_smirnov_era_desc: "Igor Smirnov. Une véritable icône de notre grande nation. Il sert la patrie qui nous est destinée. Nous lui faisons confiance pour nous conduire vers le bel avenir que nous méritons. Ce héros est la raison pour laquelle nous sommes tous ici. Smirnov est le ciment qui nous unit et nous concentre sur un objectif commun. Sans lui, cette nation n'aurait jamais existé. Nous sommes le dernier bastion communiste de l'URSS."
 PMR_economy: "Économie de la Transnistrie"
 PMR_economy_desc: "L’économie transnistrienne est insuffisante et imparfaite. Pour soutenir notre pays en croissance et notre armée, nous devons construire une économie robuste pour la maintenir. Mais la question est : comment ? Continuerons-nous sur la voie de la contrebande, ou trouverons-nous un autre chemin pour notre avenir ?"
 PMR_father_of_the_nation: "Le père de notre nation"
 PMR_father_of_the_nation_desc: "Igor Smirnov est incontestablement celui qui a créé notre nation ; grâce à lui, notre peuple existe en principe ; c'est lui qui nous a menés lors de notre lutte pour l'indépendance."
 PMR_denomination: "Effectuer une dénomination"
 PMR_denomination_desc: "Notre monnaie a atteint des chiffres si astronomiques qu'il est physiquement impossible pour nos citoyens d'acheter suffisamment de biens. Nous procéderons donc à une dénomination urgente."
 PMR_privatization: "Privatisation"
 PMR_privatization_desc: "Nous procéderons à la privatisation des entreprises, mettant fin au contrôle total de l'État."
 PMR_internet: "Développement d'Internet"
 PMR_internet_desc: "Nous commencerons le développement des réseaux Internet dans notre pays, mais il est nécessaire de consolider immédiatement le droit de censure dans ce domaine."
 PMR_interrao: "Interrao"
 PMR_interrao_desc: "La société russe Inter Rao souhaite acheter notre centrale hydroélectrique et investir des fonds substantiels pour moderniser ses composants techniques."
 PMR_railway: "Restauration des infrastructures"
 PMR_railway_desc: "Les conséquences de la guerre avec la Moldavie se font encore sentir. Nos infrastructures ne sont toujours pas restaurées, il est temps d'y remédier."
 PMR_anti_opposition: "Réprimer l'opposition"
 PMR_anti_opposition_desc: "L'activité de l'opposition dans notre pays sera activement réprimée, peut-être pas aussi ouvertement que dans d'autres pays, mais nous ne permettrons pas que notre pays soit déstabilisé."
 PMR_media: "Censure à la télévision"
 PMR_media_desc: "Nous devons prendre le contrôle de la télévision ; nous ne permettrons pas aux figures de l'opposition de s'exprimer à l'antenne."
 PMR_imprison: "Répression contre les opposants agressifs"
 PMR_imprison_desc: "Certains opposants sont littéralement prêts à nous lancer des cocktails Molotov ; nous les enverrons en prison."
 PMR_dictatorship: "Dictature transnistrienne"
 PMR_dictatorship_desc: "Ils nous traiteront de dictateurs, et notre régime sera une dictature, mais notre peuple dormira paisiblement."
 PMR_krasno: "Vadim Krasnoselsky"
 PMR_krasno_desc: "Vadim Nikolaevich Krasnoselsky est un homme d'État, politicien et figure des affaires intérieures de Transnistrie. Président du Conseil suprême de la République moldave du Dniestr, major général de la milice."
 PMR_military_reform: "Réforme militaire"
 PMR_military_reform_desc: "Notre armée a besoin d'une réforme militaire ; nous sommes clairement à la traîne de nos voisins en termes d'équipement technique et de combat."
 PMR_russian_flag: "Le drapeau russe comme deuxième drapeau national"
 PMR_russian_flag_desc: "Nous adopterons le drapeau russe comme deuxième drapeau national pour indiquer immédiatement notre objectif ultime : l'intégration à la Russie."
 PMR_romanovs: "Vénération des Romanov"
 PMR_romanovs_desc: "La tragédie de la famille Romanov est la tragédie de chaque nation de l'ancien Empire russe, et nous honorerons leur mémoire."
 PMR_soc_ref: "Reforming Our Care"
 PMR_soc_ref_desc: "Notre nouvelle réforme sociale visera principalement les citoyens handicapés, et nous leur fournirons tout ce qui est nécessaire pour une intégration complète dans la société."
 PMR_cis_2: "Partenariat avec les pays de la CEI-2"
 PMR_cis_2_desc: "Nous continuerons à renforcer nos liens amicaux avec les pays de la CEI-2 ; ils comprennent notre situation politique et économique comme personne d'autre."
 PMR_deccomus: "Décommunisation"
 PMR_deccomus_desc: "Nous nous efforcerons de rendre aux villes et villages leurs véritables noms, ceux qu'ils portaient à l'époque de l'Empire russe."
 PMR_free_internet: "A Free Net"
 PMR_free_internet_desc: "Internet devrait être libre de toute censure ; la dictature ne décidera pas de ce que les gens pensent."
 PMR_orthodoxy: "Soutien à l'Église orthodoxe"
 PMR_orthodoxy_desc: "Nous soutiendrons activement l'orthodoxie dans notre pays, car c'est notre ancre spirituelle."
 PMR_lgbt: "Lutte pour la famille traditionnelle"
 PMR_lgbt_desc: "Notre pays n'a pas besoin des valeurs LGBT ; seule la famille de l'Empire russe est grande et accueillante."
 PMR_arms: "Autoriser le port libre d'armes"
 PMR_arms_desc: "Les bandits peuvent se procurer des armes de toutes les manières ; pourquoi ne pas donner aux citoyens la possibilité de se défendre ?"
 PMR_continues: "Sans changer de cap"
 PMR_continues_desc: "Nous continuerons à suivre notre voie et ne la changerons pas. La Transnistrie n'a pas besoin de changements politiques radicaux."
 PMR_tourism: "Développement du tourisme"
 PMR_tourism_desc: "Nous devons commencer à développer le secteur touristique ; notre région est attractive et les touristes y seront clairement intéressés."
 PMR_hate_mlv: "Critique de la Moldavie"
 PMR_hate_mlv_desc: "Nous parlons fermement et clairement - nos chemins ont divergé avec la Moldavie depuis longtemps."
 PMR_vs_pmr: "L’armée de la Transnistrie"
 PMR_vs_pmr_desc: "Bien que cet État petit et non reconnu possède ses propres forces armées, nous devons renforcer notre armée pour repousser les menaces contre notre indépendance."
 PMR_ground: "Les forces armées de la Transnistrie"
 PMR_ground_desc: "The Armed Forces of the Pridnestrovian Moldavian Republic, the armed forces of the unrecognized Pridnestrovian Moldavian Republic (PMR), were established on September 6, 1991 to protect the people, sovereignty, independence, and territorial integrity of the PMR."
 PMR_suvorov_academy: "Institut militaire du ministère de la Défense"
 PMR_suvorov_academy_desc: "Nous devons renouveler régulièrement les officiers de notre armée, ce que facilite notre université militaire sous le ministère de la Défense."
 PMR_exer: "Exercices militaires avec l’armée russe"
 PMR_exer_desc: "L’armée russe est prête à conduire des exercices réguliers avec nos troupes pour transmettre une expérience de combat moderne."
 PMR_upgrade: "Moderniser l’équipement de l’armée"
 PMR_upgrade_desc: "Nous sommes prêts à moderniser l’équipement de notre armée, qui n’a pas été mis à jour depuis la guerre d’indépendance."
 PMR_chechen: "L’expérience de la guerre de Tchétchénie"
 PMR_chechen_desc: "La Russie est prête à partager son expérience de la guerre contre la République d’Itchkérie, une information et une expérience indispensables pour nous."
 PMR_military: "Industrie militaire"
 PMR_military_desc: "Nous ne devons pas espérer que les stocks de nos entrepôts dureront éternellement, il est nécessaire d’établir la production de nos propres armes."
 PMR_new_army: "La nouvelle armée de la Transnistrie"
 PMR_new_army_desc: "Nos réformes ont porté leurs fruits, l’image de notre armée a changé."
 PMR_spec: "Doctrine des forces spéciales"
 PMR_spec_desc: "Nous mettrons l’accent sur nos forces spéciales pour mener des opérations de combat contre un ennemi hypothétique."
 PMR_doctrine: "Doctrine de politique étrangère"
 PMR_doctrine_desc: "Les petits États comme le nôtre doivent toujours être prêts à une attaque de voisins plus grands, mais nous devons clairement savoir qui pourrait nous attaquer."
 PMR_iskander: "Demander des Iskanders russes"
 PMR_iskander_desc: "Les systèmes de missiles Iskander russes pourraient être un excellent argument contre une attaque nous visant."
 PMR_euiqp: "Acheter des armes en Russie"
 PMR_euiqp_desc: "Nous achèterons un grand lot d’armes à la Russie pour moderniser nos forces terrestres."
 PMR_air: "Force aérienne transnistrienne"
 PMR_air_desc: "Notre force aérienne est pratiquement inexistante, il est nécessaire de créer au moins une flotte aérienne minimale pour protéger nos frontières aériennes."
 PMR_air_academy: "Académie de la force aérienne"
 PMR_air_academy_desc: "Les futurs pilotes doivent être formés ici, chez nous, et nous créerons une académie spéciale à cet effet."
 PMR_instructors: "Instructeurs russes"
 PMR_instructors_desc: "Nos futurs pilotes seront formés par des pilotes russes."
 PMR_vvs_rf: "Coopération avec la force aérienne russe"
 PMR_vvs_rf_desc: "Nous porterons la coopération avec la force aérienne russe à son maximum."
 PMR_kazaks: "Mobiliser un régiment cosaque pour le combat"
 PMR_kazaks_desc: "Depuis la fin du siècle dernier, l’armée cosaque de la mer Noire a été créée dans les rangs de nos forces armées. Maintenant que la guerre est à notre porte, il faut les appeler au combat."
 PMR_shevchuk: "Le deuxième président de Transnistrie"
 PMR_shevchuk_desc: "Le temps du changement est venu ; un nouveau président prendra désormais la tête de la Transnistrie. Qui nous mènera vers un avenir radieux, ou peut-être pas ?"
 PMR_anti_smirnov: "Campagne politique contre Smirnov"
 PMR_anti_smirnov_desc: "Igor Smirnov a beaucoup fait pour l'établissement de la Transnistrie en tant qu'État indépendant, mais malheureusement, ces dernières années, il a déjà nui à l'État plus qu'il ne l'a aidé. Nous lutterons contre son influence."
 PMR_prepare_for_russia: "Préparer l'intégration à la Russie"
 PMR_prepare_for_russia_desc: "Nous poursuivrons la politique pro-russe de notre prédécesseur et publierons un décret préparant l'intégration de notre législation à celle de la Russie."
 PMR_against_sheriff: "Lutter contre le Sheriff"
 PMR_against_sheriff_desc: "Nous lutterons contre l'influence de ce holding, et notre république sera libre."
 PMR_mlv: "Tenter d'établir des relations avec la Moldavie"
 PMR_mlv_desc: "Nous tenterons d'établir des relations avec la Moldavie ; nous pourrons peut-être même leur proposer des moyens d'intégrer nos États."
 PMR_pro_ukraine: "Le chemin vers l’Ukraine"
 PMR_pro_ukraine_desc: "Nous considérons l’Ukraine comme notre foyer historique – nous chercherons à la rejoindre."
 PMR_propaganda: "Propagande pro-ukrainienne"
 PMR_propaganda_desc: "Nous diffuserons activement une propagande pro-ukrainienne dans notre sphère médiatique."
 PMR_contacts: "Contacts avec le gouvernement ukrainien"
 PMR_contacts_desc: "Nous établirons un contact avec le gouvernement ukrainien et l’informerons de notre désir de nous intégrer à leur pays."
 PMR_ref_join_ukr: "Référendum sur l’adhésion à l’Ukraine"
 PMR_ref_join_ukr_desc: "Nous sommes prêts à annoncer notre souhait de devenir une partie de l’Ukraine."
 PMR_sheriff_pmc: "Créer nos propres PMC"
 PMR_sheriff_pmc_desc: "Nous sommes prêts à créer nos propres sociétés militaires privées."
 PMR_sheriff_state: "L'État est une corporation"
 PMR_sheriff_state_desc: "Nous avons achevé notre grand plan."
 PMR_indust: "Keeping Things Domestic"
 PMR_indust_desc: "Nous devons décider de la direction que prendra notre industrie."
 PMR_agro: "Rustas LLC"
 PMR_agro_desc: "Nous développerons notre industrie agricole, malgré la petite taille de notre pays."
 PMR_civil: "Civil Industries"
 PMR_civil_desc: "Nous avons besoin de nouvelles usines pour l’emploi de nos citoyens."
 PMR_sell_weapon: "Vendre les stocks d’armes"
 PMR_sell_weapon_desc: "Nos entrepôts, qui datent de l’époque de l’URSS, contiennent beaucoup d’armes. Il est temps d’en tirer profit."
 PMR_new_legistation: "New Investment Norms"
 PMR_new_legistation_desc: "Nous adopterons une nouvelle loi dans le domaine des investissements, qui pourrait attirer de nouveaux investisseurs dans notre économie."
 PMR_ukr_invest: "Investissements ukrainiens"
 PMR_ukr_invest_desc: "Plusieurs entreprises ukrainiennes ont exprimé leur désir d’investir dans notre économie."
 PMR_ita_invest: "Investissements italiens"
 PMR_ita_invest_desc: "Plusieurs entreprises italiennes ont exprimé leur désir d’investir dans notre économie."
 PMR_ge_invest: "Investissements allemands"
 PMR_ge_invest_desc: "Plusieurs entreprises allemandes ont exprimé leur désir d’investir dans notre économie."
 PMR_path: "Intégration de la Moldavie"
 PMR_path_desc: "Nous commencerons l’intégration des terres de l’ancienne Moldavie dans notre État."
 PMR_integr_economy: "Intégration économique"
 PMR_integr_economy_desc: "Pour commencer, nous devons procéder à une intégration économique, en régulant tous les aspects de notre future économie unifiée."
 PMR_political: "Intégration politique"
 PMR_political_desc: "Les questions de la structure de notre nouvel État et diverses problématiques d’intégration politique doivent également être résolues."
 PMR_true: "Nous sommes la véritable Moldavie"
 PMR_true_desc: "Nous assumons le rôle de l’État moldave, tel qu’il était autrefois sous la RSS de Moldavie."
 PMR_integrate_mlv_place: "Intégration des terres moldaves"
 PMR_integrate_mlv_place_desc: "Nous reconnaissons pleinement notre droit sur les terres autrefois sous le contrôle de la Moldavie. Ce sont nos terres, et elles le seront toujours ; nous sommes prêts à les intégrer."
 PMR_full: "État unitaire"
 PMR_full_desc: "Nous suivrons la voie de l’unitarisme ; l’autonomie pourrait nous nuire."
 PMR_no_autonomy: "The Principle of Lack of Autonomy"
 PMR_no_autonomy_desc: "L’absence d’autonomie est la garantie de notre État contre le séparatisme."
 PMR_const: "Traditional Reform"
 PMR_const_desc: "Notre État prévoit de transformer radicalement son système ; pour cela, nous commencerons par l’essentiel : la réforme de la Constitution."
 PMR_mon_const: "The Kings Government"
 PMR_mon_const_desc: "Les réformes sont terminées, et nous sommes prêts à annoncer que la Transnistrie est désormais une monarchie constitutionnelle."
 PMR_opponents: "Lutte contre l’opposition"
 PMR_opponents_desc: "L’opposition est clairement mécontente du nouveau système étatique et a intensifié ses protestations ; nous devons y faire face."
 PMR_church: "L’Église devient une institution d’État"
 PMR_church_desc: "Nous reviendrons à la pratique de l’Empire russe et restaurerons l’ancien statut de l’Église."
 PMR_not_soviet: "Nous ne sommes pas un fragment de l’URSS"
 PMR_not_soviet_desc: "La Transnistrie fait partie de l’Empire russe, et nous cultiverons activement cette image. Être un fragment de l’URSS est une honte pour nous."
 PMR_general: "Général. Chrétien. Monarchiste"
 PMR_general_desc: "Ce sont les qualités propres à notre dirigeant et que tout patriote russe devrait posséder."
 PMR_drozdov: "Raviver l’Armée des volontaires"
 PMR_drozdov_desc: "L’Armée des volontaires fut créée pendant la guerre civile russe. Elle défendait les intérêts du mouvement blanc et était une véritable armée de patriotes et de défenseurs de la Russie. Nous la raviverons et la mènerons sous notre bannière."
 PMR_kornilov: "Raviver le régiment Kornilov"
 PMR_kornilov_desc: "Nous rendrons hommage aux soldats tombés du régiment Kornilov et le raviverons dans les rangs de notre armée."
 PMR_revive: "Raviver le régiment Drozdov"
 PMR_revive_desc: "Nous rendrons hommage aux soldats tombés du régiment Drozdov et le raviverons dans les rangs de notre armée."
 PMR_commi: "A Soviet ReUnion"
 PMR_commi_desc: "Le communisme est de retour en Transnistrie. Les communistes dirigeront-ils à nouveau le pays ?"
 PMR_single: "A Single Direction"
 PMR_single_desc: "Le Parti communiste de Transnistrie sait mieux que quiconque gérer toutes les sphères liées à l’État. Si les autres s’écartent, nous pourrons travailler à construire une véritable utopie communiste, et cette fois, nous réussirons."
 PMR_collectivism: "Utilise Collectist Rhetoric"
 PMR_collectivism_desc: "La collectivisation a déjà fonctionné une fois, nous répéterons donc cette expérience."
 PMR_pioneer: "Pionniers"
 PMR_pioneer_desc: "Les jeunes ne doivent pas rester oisifs, nous allons donc relancer le mouvement des pionniers."
 PMR_marxism: "Marxisme dans les écoles"
 PMR_marxism_desc: "Le programme scolaire inclura nécessairement Marx."
 PMR_education: "Teach Freely"
 PMR_education_desc: "L’éducation doit être gratuite et accessible à chaque citoyen de notre glorieux État."
 PMR_atheism: "Squash The Church"
 PMR_atheism_desc: "La religion est l’opium du peuple, il est temps de la combattre."
 PMR_fixe: "Premier plan quinquennal"
 PMR_fixe_desc: "Les modèles économiques libres des États occidentaux n’ont pas d’avenir pour un État socialiste. Le retour à une économie planifiée, de préférence sous la forme classique des plans quinquennaux soviétiques, donnera au gouvernement un contrôle total sur une économie jusque-là incontrôlée."
 PMR_workers: "Soutien aux travailleurs"
 PMR_workers_desc: "La classe ouvrière est notre soutien et notre force, nous la soutiendrons toujours dans la lutte contre la contagion capitaliste !"
 PMR_anti_nationalism: "Lutte contre l’opposition"
 PMR_anti_nationalism_desc: "Pas de pitié pour les éléments destructeurs qui veulent retarder notre marche vers le communisme !"
 PMR_chinese_economic: "Expérience économique chinoise"
 PMR_chinese_economic_desc: "Nous prendrons le système économique chinois comme base pour notre politique économique, et cela nous semble prometteur."
 PMR_national_industry: "Hands On With The Industry"
 PMR_national_industry_desc: "Nous soutiendrons et développerons notre industrie. Notre pays a besoin de nouvelles entreprises pour remplacer celles perdues après l’effondrement de l’URSS."
 PMR_mobilise: "Mobilizing The Groups"
 PMR_mobilise_desc: "Notre armée a besoin de gens pour défendre les intérêts de notre pays partout où le parti l’exige."
 PMR_people_militia_desc: "Nous sommes prêts à adopter une loi sur la création d’une milice populaire, qui servira de réserve pour la défense territoriale. Dans chaque village, il devrait y avoir un groupe de personnes entraînées pour contrer l’ennemi, avec une transformation ultérieure en mouvement de partisans."
 PMR_soc_dem: "Démocratie sociale transnistrienne"
 PMR_soc_dem_desc: "Like awakening from a nightmare, the residents of Transnistria will awaken to the end of a very long delusion. The prolonging of this pseudo-state in its current form will cease, and the cleanup will commence, beginning with overhauling the Supreme Council into a proper legislative body."
 PMR_liberalism: "New National Body"
 PMR_liberalism_desc: "Now that we have the bedrock for our reform, we can begin the creation of the §YReintegration Committee§!, tasked with expediting the changes to our constitution that will enable our plans for federation. In the meantime, we can unban a few of the opposition parties waiting to join the new administration."
 PMR_freedom: "Freedom To Speak"
 PMR_freedom_desc: "Our history at the ballot boxes hasn't been a clean one, and neither has the situation been with human rights here. Our first priority should be repealing Article 316-1, and lifting some of the other restrictions on freedom of speech. An international agency will be contacted to ensure that local elections are handled properly, and with intense oversight to ensure fairness going forward."
 PMR_rhetoric: "Rhétorique pro-moldave"
 PMR_rhetoric_desc: "Moldova is as much a brotherly nation as it is a part of our own cloth. Thawing the relations and pushing the matter over the airwaves will bring us the public support we need."
 PMR_new_society: "A Blooming Society"
 PMR_new_society_desc: "The move towards opening up our nation to the world is inevitably going to leave a few people behind, but we can make the transition an easier one. Expanding our agencies to provide language learning and digital training to accommodate those who need it is certainly going to ease some of the complaints, and drum up a little cash for the budget."
 PMR_partnership: "Intégration politique avec la Moldavie"
 PMR_partnership_desc: "Now that our communications have been fruitful, we can stop skirting around the integration and begin the transition. We'll be accepting Moldova's unitary legal framework, and dismantling the remaining separatist aspects of our government to align us as closely as politically possible."
 PMR_deccomuniz: "Décommunisation"
 PMR_deccomuniz_desc: "Last time we checked, it's been over a decade since the Iron Curtain fell and the Soviet Union was abolished. The statues and memorials have acted less as a nostalgia distraction, and more as an embarrassment on our new leadership. The times will have to change if we're going to make any progress instilling a new culture."
 PMR_contact_eu: "A European Home"
 PMR_contact_eu_desc: "The nation might not currently be recognised internationally, but our citizens don't need to suffer that same fate. We'll cooperate with Moldova to ensure that our people have a pipeline to obtaining access to the European Union, with all the freedoms that entails."
 PMR_federation: "The Federation Project"
 PMR_federation_desc: "\n\n\n\n\n\n£PMR_desctext_federation \n\n\n\n\n\n\n\n\nThe time has come to propose our draft to federalise with the nation of Moldova to the council. If the request passes the final hurdle will be a national referendum. We can only hope we've swayed the public enough."
 PMR_investors: "Welcome the Investors"
 PMR_investors_desc: "With any great political upheaval, those wishing to take advantage of the change will naturally come swooping in. A few notable figures have come knocking to pursue a piece of the action. \n\nIt's only right that we take a hand when we're offered one."
 PMR_it: "Bringing in the Web"
 PMR_it_desc: "The internet infrastructure we have been using up until now was mostly installed in the early 90s. As such we lack a lot of the technical luxuries most european nations have enjoyed like digital television, and acceptable speeds. Lifting our restrictions on external IT investment is going to change that."
 PMR_west_markets: "Welcome the Investors"
 PMR_west_markets_desc: "Our recent connections have granted us previously unseen access to the European market. Like a fish being tossed from its bowl into the ocean, we're practically swimming in a world of opportunity. It's time we shake some hands and put on our best business face."
 PMR_just: "Transnistrie républicaine"
 PMR_just_desc: "Notre parti promouvra les idées de socialisme et de patriotisme auprès des masses. La Transnistrie a été et restera indépendante !"
 PMR_patriotism: "Garde nationale transnistrienne"
 PMR_patriotism_desc: "À l’exemple d’autres pays, nous créerons notre propre garde nationale, qui sera notre outil de secours en cas de sentiments rebelles dans les autres forces armées."
 PMR_guarantees: "Guarantee The Societies"
 PMR_guarantees_desc: "Nos citoyens doivent bénéficier de toutes les garanties sociales nécessaires pour se sentir en sécurité."
 PMR_democracy: "Principes démocratiques"
 PMR_democracy_desc: "Les principes fondamentaux de la démocratie seront respectés sur notre territoire ; le totalitarisme et la dictature appartiennent au passé !"
 PMR_health: "Healthcare First"
 PMR_health_desc: "Le secteur de la santé dans notre pays vit littéralement ses derniers jours ; il est temps de corriger cela avec des injections de fonds."
 PMR_economic: "Réformes économiques"
 PMR_economic_desc: "Les anciens dirigeants de la Transnistrie nous ont laissé un système économique affaibli et corrompu. Nous devons mener des réformes et une dérégulation."
 PMR_family: "La famille est la valeur principale"
 PMR_family_desc: "Le soutien aux familles deviendra l’un de nos principaux programmes sociaux. Nous élèverons une nouvelle génération qui créera de merveilleuses et grandes familles."
 PMR_corruptable: "The Corruption End Here"
 PMR_corruptable_desc: "Les fonctionnaires corrompus seront punis !"
 PMR_indep: "Indépendance politique"
 PMR_indep_desc: "Notre pays doit enfin décider par lui-même de ce dont il a besoin et ne pas se soumettre aux forces internes ou externes."
 PMR_mvd_true: "Ministère de l’Intérieur"
 PMR_mvd_true_desc: "Maintenant que nos organes du ministère de l’Intérieur pourront réellement travailler pour le bien de la république, nous éliminerons tous les fonctionnaires corrompus de ce ministère."
 PMR_banner: "Peuple uni et fort"
 PMR_banner_desc: "Notre peuple est prêt à continuer à lutter pour son indépendance et un avenir heureux."
 PMR_lebedev: "Nous prendrons le petit déjeuner à Tiraspol"
 PMR_lebedev_desc: "Nous suivrons les préceptes du général Lebed et résoudrons nos problèmes de manière radicale et agressive."
 PMR_kishenev: "Nous déjeunerons à Chișinău"
 PMR_kishenev_desc: "La Moldavie doit tomber, nous avons toléré un tel voisin trop longtemps."
 PMR_odessa: "Nous déjeunerons à Odessa"
 PMR_odessa_desc: "Odessa est notre chance d’accéder à la mer Noire ; nous y enverrons des détachements et tenterons de déclencher une révolte."
 PMR_buharest: "Nous dînerons à Bucarest"
 PMR_buharest_desc: "Nous attendons la bataille finale avec notre principal ennemi."
 PMR_kiev: "Nous dînerons à Kiev"
 PMR_kiev_desc: "Nous attendons la bataille finale avec notre principal ennemi."
 transnistria.5.t: "Élections anticipées"
 transnistria.5.d: ""
 transnistria.5.a: "Yevgeny Shevchuk"
 transnistria.5.b: "Igor Smirnov"
 transnistria.5.c: "Anatoliy Kaminski"
 transnistria.6.t: "La statue de Lénine disparaît"
 transnistria.6.d: "La statue du révolutionnaire russe Vladimir Lénine a mystérieusement disparu de la capitale Tiraspol. Devons-nous lancer des recherches ou l’abandonner complètement ?"
 transnistria.6.a: "Lancer des recherches"
 transnistria.6.b: "C’est une perte de temps"
 transnistria.7.t: "La résurrection de Vladimir Lénine"
 transnistria.7.d: "Après que les recherches pour retrouver la statue se sont révélées infructueuses, le président [PMR.GetLeader] a été retrouvé mort dans son bureau, remplacé par la statue de Vladimir Lénine. Cette dernière semble maintenant destinée à diriger notre grande nation comme elle le fit pendant la révolution russe."
 transnistria.7.a: "Et Lénine rajeunit"
 transnistria.8.t: "L’avenir de la Transnistrie"
 transnistria.8.d: "Après la récente unification de la Moldavie avec la Roumanie, notre nation se trouve maintenant à son point le plus crucial car nous sommes confrontés à une force encore plus grande que jamais et si nous voulons que nos traditions survivent, nous devons décider de l'avenir de notre nation. Pour commencer, une grande partie de notre population a exprimé un énorme soutien à l'unification avec la Fédération de Russie, principalement en raison de liens historiques et culturels. Une autre proposition appelle à l'unification avec notre voisin ukrainien, affirmant que ce serait une meilleure option principalement parce que la Russie n'a pas de connexion terrestre. en Transnistrie et que nous partageons également de nombreuses similitudes avec le peuple ukrainien. Enfin, une autre proposition appelle au maintien de l'indépendance et du multiculturalisme de la Transnistrie et à ne pas laisser notre nation et nos valeurs tomber aux mains de puissances étrangères, ce que notre nation s'est battu pour défendre lors de la guerre de Transnistrie de 1992. Le pays est divisé et une option pourrait nous affecter pour de bon. ou pire."
 transnistria.8.a: "Nous nous unirons avec nos frères et sœurs russes !"
 transnistria.8.b: "Nous nous unirons avec nos frères et sœurs ukrainiens !"
 transnistria.8.c: "Nous maintiendrons notre indépendance !"
 transnistria.9.t: "La Transnistrie demande l’unification"
 transnistria.9.d: "Après la récente unification de la Moldavie avec la Roumanie, la Transnistrie, craignant d’être absorbée par la Roumanie, a demandé à devenir un territoire de [ROOT.GetName]. Bien que ce soit une excellente opportunité pour étendre notre influence dans la région et montrer notre puissance militaire, la Transnistrie est toujours revendiquée par la Roumanie. Si nous l’intégrons, nous risquons d’entrer en conflit avec la Roumanie, nous devons donc choisir judicieusement."
 transnistria.9.a: "Intégrer la Transnistrie à [ROOT.GetName]"
 transnistria.9.b: "Refuser l’offre transnistrienne"
 transnistria.10.t: "[FROM.GetName] accepte"
 transnistria.10.d: "Aujourd’hui, [FROM.GetName] a accepté notre demande d’unification et travaille avec notre administration pour assurer une transition en douceur."
 transnistria.10.a: "Unissons-nous avec nos frères et sœurs !"
 transnistria.11.t: "[FROM.GetName] refuse"
 transnistria.11.d: "Aujourd’hui, [FROM.GetName] a refusé notre demande d’intégration, la Transnistrie devra donc se débrouiller seule."
 transnistria.11.a: "Une occasion manquée"
 transnistria.12.t: "[FROM.GetName] accepte"
 transnistria.12.d: "Aujourd’hui, [FROM.GetName] a accepté notre demande d’unification et travaille avec notre administration pour assurer une transition en douceur."
 transnistria.12.a: "Unissons-nous avec nos frères et sœurs !"
 transnistria.14.t: "Nouvelles usines"
 transnistria.14.d: "Nous avons besoin d’usines pour faire progresser notre économie. Cela dit, nous pourrions utiliser cet argent pour renforcer notre armée. Devons-nous soutenir notre industrie civile ou militaire ?"
 transnistria.14.a: "Construire une usine civile"
 transnistria.14.b: "Construire une usine militaire"
 transnistria.15.t: "L’économie raffinée"
 transnistria.15.d: "L’économie croît. Il est temps de décider quel avenir nous souhaitons. Nous pourrions continuer à développer notre économie et devenir une puissance économique régionale, ou utiliser notre force économique actuelle pour construire une grande armée."
 transnistria.15.a: "Un avenir civil est notre meilleur choix"
 transnistria.15.b: "Nous voulons un avenir militaire"
 transnistria.16.t: "Référendum sur l’adhésion à la Russie"
 transnistria.16.d: "La Transnistrie a tenu un autre référendum sur l’adhésion à notre pays, et le peuple a voté unanimement « oui ». Répondrons-nous à leurs attentes ou les refuserons-nous ?"
 transnistria.16.a: "Oui"
 transnistria.16.b: "Non"
 transnistria.17.t: "La Transnistrie veut revenir dans notre pays"
 transnistria.17.d: "La Transnistrie a tenu un référendum sur l’adhésion, bien qu’il serait plus juste de parler d’un retour en Moldavie. Son résultat s’est avéré positif, nous pouvons enfin résoudre le conflit transnistrien."
 transnistria.17.a: "La Transnistrie est à nous"
 transnistria.17.b: "Nous n’en avons pas besoin"
 transnistria.18.t: "La doctrine militaire de la Transnistrie"
 transnistria.18.d: "Notre pays est pris entre deux feux, et notre doctrine militaire doit refléter l’état de notre nation. Qui considérerons-nous comme un adversaire potentiel ?"
 transnistria.18.a: "Roumanie"
 transnistria.18.b: "Ukraine"
 transnistria.19.t: "La Transnistrie nous demande de fournir des Iskanders"
 transnistria.19.d: "Le gouvernement transnistrien nous a proposé de placer des Iskanders sur son territoire pour assurer une sécurité encore plus grande. Accepterons-nous une démarche aussi risquée ?"
 transnistria.19.a: "Oui"
 transnistria.19.b: "Non"
 transnistria.20.t: "Soulèvement à Odessa"
 transnistria.20.d: "Ce matin, nous avons reçu des nouvelles inattendues et désagréables : un soulèvement séparatiste a eu lieu à Odessa sous les slogans d’indépendance d’une certaine République d’Odessa. De plus, les traces des séparatistes mènent directement à la Transnistrie."
 transnistria.20.a: "Quoi ?!"
 transnistria.21.t: "Loyalistes de Gagaouzie"
 transnistria.21.d: "Nous pouvons encore affaiblir la Moldavie en tentant de provoquer une rébellion gagaouze dans la république du même nom, mais cela nous coûtera de l’argent, et nous ne savons pas si nous pourrons leur venir en aide à temps."
 transnistria.21.a: "Provoquer une rébellion"
 transnistria.21.b: "Non"
 transnistria.22.t: "L’Ukraine nous a cédé Odessa"
 transnistria.22.d: "Le gouvernement ukrainien n’a pas pris de mesures actives et n’est pas entré en confrontation avec nous, ce qui nous a même surpris."
 transnistria.22.a: "C’est… une bonne nouvelle ?"
 transnistria.23.t: "Le président général"
 transnistria.23.d: "Notre président, s’étant également déclaré commandant en chef suprême, a pris la direction des forces armées afin de participer personnellement aux opérations militaires de notre pays, si nécessaire."
 transnistria.23.a: "Bien"
 transnistria.24.t: "Intégration de la législation russe"
 transnistria.24.d: "Nous avons décidé d’intégrer la législation russe à la nôtre, ce qui facilitera grandement notre unification avec la Russie… si cela se produit, bien sûr."
 transnistria.24.a: "Bien"
 transnistria.25.t: ""
 transnistria.25.d: ""
 transnistria.25.a: "Bien"
 transnistria.26.t: "Référendum sur l’adhésion à l’Ukraine"
 transnistria.26.d: "La Transnistrie a tenu un autre référendum sur l’adhésion à notre pays, et le peuple a voté unanimement « oui ». Répondrons-nous à leurs attentes ou les refuserons-nous ?"
 transnistria.26.a: "Oui"
 transnistria.26.b: "Non"
 transnistria.28.t: "Actions militaires conjointes"
 transnistria.28.d: "La République d’Odessa s’est immédiatement tournée vers nous pour une assistance militaire. Désormais, nos unités peuvent se déplacer sur le territoire des deux États."
 transnistria.28.a: "Sympa"
 PMR_general_monarchist_christian: "Général monarchiste chrétien"
 PMR_use_kobasna: "Vider les dépôts d’armes §Y[PMR.GetFlag]transnistriens§!"
 PMR_sheriff_starting: "Holding Sheriff"
 PMR_sheriff_starting_desc: "\n\n\n\n\n\n£PMR_desctext_sheriff \n\n\n\n\n\n\n\n\nSheriff is the second-largest company in the unrecognised breakaway state Transnistria, behind Moldova Steel Works. Based in the city of Tiraspol, it was formed in the early 1990s by Viktor Gushan and Ilya Kazmaly, former members of the KGB. Sheriff has grown to include nearly all forms of profitable private business in the unrecognised country, and has even become significantly involved in local politics and sport,with some commentators saying that company loyalists hold most main government positions in the territory."
 PMR_sheriff_phones: "Interdnestrcom"
 PMR_sheriff_phones_desc: "Interdnestrcom est une entreprise de télécommunications transnistrienne qui fournit des services de communication mobile pour la Transnistrie, un État séparatiste non reconnu, internationalement reconnu comme faisant partie de la Moldavie. Elle a été créée en 1998. En plus des services de téléphonie mobile, elle propose également un accès Internet par numérotation et ISDN."
 PMR_sheriff_oil: "Entrepôt de produits pétroliers"
 PMR_sheriff_oil_desc: "Sheriff prévoit de construire un entrepôt de produits pétroliers pour assurer l’autonomie de sa composante carburant."
 PMR_sheriff_kvint: "KVINT"
 PMR_sheriff_kvint_desc: "KVINT est une cave et distillerie basée à Tiraspol, la capitale et le centre industriel de la Pridnestrie. Les produits KVINT sont certifiés « Fabriqués en Moldavie ». Fondée en 1897, l’entreprise ne produisait que de la vodka jusqu’en 1938, date à laquelle elle a commencé à produire des brandys. C’est la plus ancienne entreprise commerciale encore en activité dans la région. Les habitants considèrent KVINT comme un trésor national et un symbole de leur pays. Son usine figure sur le billet de 5 roubles pridnestroviens. KVINT est l’un des plus grands exportateurs de la Pridnestrie, vers l’Italie, la Chine, la Russie et l’Ukraine."
 PMR_sheriff_bank: "Agroprombank CJSC"
 PMR_sheriff_bank_desc: "Le holding prévoit également de créer sa propre banque pour fournir des services financiers à travers la Transnistrie."
 PMR_sheriff_tiroteks: "Tirotex"
 PMR_sheriff_tiroteks_desc: "Tirotex est une entreprise textile basée en Transnistrie, produisant des vêtements et autres produits textiles. Située à Tiraspol, elle a été fondée en 1972 avec la construction de son usine, qui a pris une décennie à compléter. C’est la plus grande entreprise textile du sud-ouest de la Communauté des États indépendants et prétend être la deuxième en son genre en Europe. Son complexe comprend des opérations de tissage, couture, finition et filature. En tant qu’entreprise orientée vers l’exportation, 70 % de ses produits sont expédiés à l’étranger."
 PMR_sheriff_agro: "Holding agro-industriel"
 PMR_sheriff_agro_desc: "Le holding prévoit également d’acquérir plusieurs usines agro-industrielles supplémentaires pour leur restauration et leur mise en service."
 PMR_rail_road: "Transnistrian Rails"
 PMR_rail_road_desc: "Le chemin de fer transnistrien est l’opérateur ferroviaire de la Transnistrie."
 PMR_airport_back: "Aéroport de Tiraspol"
 PMR_airport_back_desc: "Nous prévoyons de terminer la reconstruction de l’aéroport de Tiraspol, et de l’utiliser, si nécessaire, à des fins civiles et militaires."
 PMR_economy_category: "Économie transnistrienne"
 PMR_economy_category_desc: "Transnistria survives by selling stakes in its own industry. When a foreign partner walks away, Tiraspol has the option to buy their holdings back and return them to the republic."
 PMR_destroy_sheriff: "§RDétruire§! £text_icon_pmr_sheriff §2le monopole de Sheriff§!"
 PMR_control_economic_idea: "Économie contrôlée"
 PMR_collectivism_idea: "Collectivisme"
 PMR_marxist_reeducation_idea: "Marxisme dans l’éducation"
 PMR_revoult_spirits_idea: "L’esprit révolutionnaire"
 PMR_interbrigade_idea: "Brigade internationale"
 PMR_peacerota_idea: "Bataillon de maintien de la paix"
 PMR_grivna_efffect_idea: "Intégration de la législation ukrainienne"
 PMR_the_rights_of_the_worker_idea: "Droits étendus des travailleurs"
 PMR_annex_gagauzia: "Intégration de §Y[GGZ.GetNameWithFlag]§!"
 PMR_sheriff_based: "Soutenir l'influence du Sheriff"
 PMR_sheriff_based_desc: "Nous entendons préserver et maintenir l'influence du holding Sheriff sur notre république, malgré les conséquences négatives de leur monopole."
 PMR_anti_moldav_rhetoric: "Rhétorique anti-moldave"
 PMR_anti_moldav_rhetoric_desc: "Notre unification avec la Moldavie n'aura jamais lieu, nous n'avons pas l'intention de le permettre et nous le promouvrons activement dans les médias et par d'autres moyens d'influence sur la population."
 PMR_referendums: "Référendum sur le statut de la Transnistrie"
 PMR_referendums_desc: "Nous avons l'intention d'organiser un référendum sur le statut de la Transnistrie afin que notre peuple puisse enfin décider comment il souhaite voir l'avenir de notre État."
 PMR_lebed_academy: "Institut militaire du ministère de la Défense"
 PMR_lebed_academy_desc: "Institution militaire supérieure basée à Tiraspol, gérée par le département militaire des forces armées de la Transnistrie. C’est l’établissement éducatif le plus prestigieux des forces armées."
 PMR_pograncy: "Troupes frontalières"
 PMR_economist_from_russia: "Demander des spécialistes économiques à la Russie"
 PMR_economist_from_russia_desc: "Nous avons l'intention de proposer à des spécialistes russes de la banque centrale d'aider à réformer notre économie."
 PMR_agriculture_from_russia: "Aide russe dans l'industrie agricole"
 PMR_agriculture_from_russia_desc: "L'agro-industrie russe peut nous apporter une grande aide dans notre développement, nous avons l'intention d'inviter leurs spécialistes dans notre pays."
 PMR_expel_russian: "Expel The Peacekeepers"
 PMR_expel_russian_desc: "Nos chemins divergent avec la Russie, il est temps que leurs Casques bleus quittent notre pays."
 PMR_invite_ukrainians: "Inviter les Casques bleus ukrainiens"
 PMR_invite_ukrainians_desc: "Nous inviterons des Casques bleus ukrainiens pour nous défendre contre l’agression moldave."
 PMR_ukr_corps: "Laisser entrer les entreprises ukrainiennes"
 PMR_ukr_corps_desc: "Nous permettrons aux entreprises ukrainiennes d’entrer sur notre marché, ce qui aura un impact positif sur notre économie."
 PMR_ukr_law: "Intégration dans la législation ukrainienne"
 PMR_ukr_law_desc: "Nous harmoniserons notre législation avec celle de l’Ukraine pour une future intégration."
 PMR_ukraine_influency_TT: "[UKR.GetFlag] Multiplicateur d’§Hinfluence ukrainienne§! dans §Y[ROOT.GetNameWithFlag]§! : §R+15 %§!"
 PMR_ukr_army: "Casques bleus ukrainiens"
 PMR_kabardiners: "Troupes de carabiniers"
 PMR_kabardiners_desc: "Les troupes de carabiniers forment la force nationale de gendarmerie de la Transnistrie. Les carabiniers transnistriens doivent assurer, avec la police ou indépendamment, l’ordre public, la protection des droits et libertés des citoyens, des propriétés des propriétaires et la prévention des violations de la loi. La structure de cette agence est basée sur les carabiniers italiens, d’où son nom."
 PMR_peace_keaper: "Bataillon de maintien de la paix"
 PMR_peace_keaper_desc: "Nous créerons notre propre bataillon de maintien de la paix pour participer à des missions internationales."
 PMR_commi_ideology: "Ideological Reworking"
 PMR_commi_ideology_desc: "Il est temps de ramener les méthodes idéologiques de l’éducation de l’ère soviétique et de les adapter à une approche moderne."
 PMR_commi_promka: "Renouveau industriel"
 PMR_commi_promka_desc: "L’industrie de la Transnistrie dépérit chaque jour davantage, il est temps d’inverser ce processus négatif."
 PMR_army_corruptions: "Arrêter la vente d’armes"
 PMR_army_corruptions_desc: "Nous mettrons fin à la vente d’armes des entrepôts de Kolbasna et cesserons de les distribuer à tout va."
 PMR_clean_governments: "Nettoyer le gouvernement"
 PMR_clean_governments_desc: "Tous les éléments corrompus et destructeurs seront exclus de notre gouvernement."
 PMR_ded_sheriff: "Mettre fin à la holding Sheriff"
 PMR_ded_sheriff_desc: "La holding Sheriff a maintenu notre république sous son contrôle trop longtemps ! Il est temps d’y mettre un terme."
 PMR_revoult_spirit: "A Revolutionary Spirit"
 PMR_revoult_spirit_desc: "L’esprit de la révolution traverse la Transnistrie, et nous le porterons plus loin."
 PMR_interbrigade: "Brigade internationale"
 PMR_interbrigade_desc: "Nos soldats sont prêts à remplir leur devoir international de protéger les citoyens souffrants d’autres États."
 PMR_anti_corrupt_company: "Lutte contre la corruption"
 PMR_anti_corrupt_company_desc: "Les fonctionnaires corrompus n’ont pas leur place en Transnistrie !"
 PMR_new_chinush: "Nouvelle génération de fonctionnaires"
 PMR_new_chinush_desc: "Nous formerons une nouvelle génération de fonctionnaires loyaux envers le pays et non envers leur portefeuille."
 PMR_new_five: "Continue The Five-Year Plan"
 PMR_new_five_desc: "Le système des plans quinquennaux n’a pas failli à l’époque soviétique, nous avons l’intention de l’utiliser à nouveau."
 PMR_red_army_pmr: "L’Armée rouge de Transnistrie"
 PMR_red_army_pmr_desc: "Notre État a besoin d’une armée puissante, et la plus puissante est l’Armée rouge !"
 PMR_new_trans: "La nouvelle ère de la Transnistrie"
 PMR_new_trans_desc: ""
 PMR_chinese_economic_tt: "[CHI.GetFlag] Multiplicateur d’§Hinfluence chinoise§! : §R+15 %§!"
 transnistria.29.t: "Référendum sur le statut de la Transnistrie"
 transnistria.29.d: "Nous avons tenu un référendum au cours duquel notre peuple a exprimé son désir de rester indépendant, et nous n’avons pas l’intention de lui retirer ce droit ! La Transnistrie continuera à lutter pour son indépendance."
 transnistria.29.a: "Sympa"
 transnistria.30.t: "Aide des spécialistes de la banque centrale"
 transnistria.30.d: "Les autorités transnistriennes demandent à nos spécialistes de la banque centrale de les aider à réformer leur économie. Ce sera une excellente opportunité pour améliorer l’état de l’économie transnistrienne et renforcer notre influence dans la région."
 transnistria.30.a: "Nous les aiderons"
 transnistria.30.b: "Non"
 transnistria.31.t: "Spécialistes russes de la banque centrale"
 transnistria.31.d: "Les autorités russes ont accepté de nous aider et d’envoyer des spécialistes de la banque centrale pour réformer l’économie."
 transnistria.31.a: "Bien"
 transnistria.32.t: "Spécialistes russes de la banque centrale"
 transnistria.32.d: "Les autorités russes ont refusé de nous aider et d’envoyer des spécialistes de la banque centrale pour réformer l’économie."
 transnistria.32.a: "Triste"
 transnistria.33.t: "Aide dans l’industrie agricole"
 transnistria.33.d: "Le gouvernement transnistrien demande une assistance pour le développement de l’industrie agricole à travers nos campagnes agro-industrielles. Nous bénéficierons sans doute de cet accord et augmenterons notre influence dans la région."
 transnistria.33.a: "Nous les aiderons"
 transnistria.33.b: "Non"
 transnistria.34.t: "Spécialistes russes de l’industrie agricole"
 transnistria.34.d: "Les autorités russes ont accepté de nous aider et d’envoyer des spécialistes pour développer notre agro-industrie."
 transnistria.34.a: "Bien"
 transnistria.35.t: "Spécialistes russes de l’industrie agricole"
 transnistria.35.d: "Les autorités russes ont refusé de nous aider et d’envoyer des spécialistes pour développer notre agro-industrie."
 transnistria.35.a: "Triste"
 transnistria.36.t: "La Transnistrie invite nos Casques bleus"
 transnistria.36.d: "Les autorités de la République de Transnistrie ont radicalement changé leur vecteur de politique étrangère et souhaitent désormais abandonner le patronage de la Russie. Elles ont déjà expulsé leurs Casques bleus et nous appellent. Devons-nous intervenir ?"
 transnistria.36.a: "Oui"
 transnistria.36.b: "Non"
 transnistria.37.t: "Casques bleus ukrainiens"
 transnistria.37.d: "Les autorités ukrainiennes ont répondu positivement à notre désir de voir leurs Casques bleus dans notre pays, leurs unités arriveront immédiatement sur notre territoire."
 transnistria.37.a: "Sympa"
 transnistria.38.t: "Casques bleus ukrainiens"
 transnistria.38.d: "Les autorités ukrainiennes ont répondu négativement à l’appel de Casques bleus dans notre pays, il semble que nous ayons tout perdu."
 transnistria.38.a: "Triste"
 transnistria.39.t: "Nos Casques bleus en Transnistrie"
 transnistria.39.d: "Le gouvernement transnistrien a pris une mesure inattendue pour nous et a annoncé que nous devions retirer immédiatement nos forces de maintien de la paix de la Transnistrie. Cela met en péril notre influence dans cette région."
 transnistria.39.a: "Triste"
 transnistria.40.t: "Référendum sur l’adhésion à la Russie"
 transnistria.40.d: "Le gouvernement russe nous a officiellement acceptés dans ses rangs ! Nous faisons désormais tous partie d’un grand pays avec un grand héritage."
 transnistria.40.a: "Hourra !"
 transnistria.41.t: "Référendum sur l’adhésion à la Russie"
 transnistria.41.d: "Le gouvernement russe a refusé de nous permettre de rejoindre ses rangs. Nous sommes profondément attristés et espérons qu’ils changeront d’avis à l’avenir."
 transnistria.41.a: "Triste"
 transnistria_news.1.t: "La Transnistrie devient partie de la Russie"
 transnistria_news.1.d: "Les autorités de la République moldave pridnestrovienne non reconnue ont tenu un référendum sur l’adhésion à la Russie, où la majorité a voté en faveur. Le gouvernement russe a accepté le résultat de ce référendum et a annoncé l’incorporation de la Transnistrie à la Russie."
 transnistria_news.1.a: "Intéressant."
 PMR_sheriff_finish: "Sheriff terminé"
 PMR_vs_reform: "Réforme des forces armées"
 PMR_vs_reform_desc: "Nos forces armées ne sont pas prêtes à défendre notre petite république, nous devons les réformer de toute urgence."
 PMR_army_corruption: "Arrêter la vente d’armes"
 PMR_army_corruption_desc: "Nous mettrons fin à la vente des armes des entrepôts de Kolbasna et cesserons de les distribuer à tout va."
 PMR_clean_government: "Nettoyer le gouvernement"
 PMR_clean_government_desc: "Les fonctionnaires ne pensent qu’à leurs poches et pas au pays. Nous retirerons ces individus du leadership de la république, pacifiquement ou par la force."
 PMR_return_zavods: "Relancer les usines"
 PMR_return_zavods_desc: "Le potentiel industriel de la région est évident même pour un aveugle, mais malheureusement, l’effondrement de l’URSS a détruit tout ce que les citoyens de ce pays autrefois magnifique avaient construit. Nous le ramènerons."
 PMR_clean_corruption: "Guerre contre la corruption"
 PMR_clean_corruption_desc: "La corruption est comme une hydre : si vous coupez une tête, une autre repoussera. Nous couperons toutes les têtes de cette hydre corrompue d’un seul coup."
 PMR_commies_goes_home: "Anti-communisme ardent"
 PMR_commies_goes_home_desc: "Les idées communistes ne devraient pas être la réalité principale de la Transnistrie ; elles sont depuis longtemps en décalage avec la réalité et la vie des gens ici. Les gens ne vivront pas dans le passé, mais dans le présent et l’avenir !"
 PMR_support_nationalism: "Soutien aux sentiments nationalistes"
 PMR_support_nationalism_desc: "Le nationalisme n’est pas toujours une mauvaise chose, surtout quand les habitants d’une si petite région se considèrent comme faisant partie d’un empire autrefois immense et grand. Nous soutiendrons la diffusion de ce sentiment nationaliste."
 PMR_reform_special_services: "Réforme des services secrets"
 PMR_reform_special_services_desc: "Les services spéciaux doivent également être débarrassés de toutes sortes d’escrocs et d’amateurs qui résolvent tout avec de l’argent."
 PMR_militarize_society: "Militarisation de la société"
 PMR_militarize_society_desc: "Chaque citoyen doit être prêt à prendre les armes, car l’heure de la bataille pour l’existence même de notre région approche ! Nous populariserons activement une rhétorique militariste dans notre pays."
 PMR_zapad_sosat: "Sentiments anti-occidentaux"
 PMR_zapad_sosat_desc: "L’Occident a toujours été et sera toujours notre ennemi. Nous n’avons pas l’intention de vivre avec de fausses illusions qu’un jour ils voudront quelque chose de bon pour nous, surtout pour nous, une petite région qui lutte contre son intégration dans l’Union européenne."
 PMR_transnistia_legion: "La Légion transnistrienne"
 PMR_transnistia_legion_desc: "La Légion transnistrienne est un projet qui devait autrefois être mis en œuvre sur le territoire de la Russie, mais hélas, les autorités de l’époque l’ont complètement bloqué. Tous les services spéciaux seront combinés en une unité spéciale qui non seulement protégera la patrie, mais participera également à des missions internationales, ouvertement ou secrètement."
 PMR_militarize_young: "Militarisation de la jeunesse"
 PMR_militarize_young_desc: "En cas de guerre, les jeunes doivent être prêts à saisir une mitrailleuse et à défendre leur patrie, et non à supplier pour la clémence. Nous ferons de nos enfants les véritables défenseurs de la mère patrie."
 PMR_ded_sheriffs: "Mettre fin au holding Sheriff"
 PMR_ded_sheriffs_desc: "Le pouvoir corporatif du holding Sheriff sera enfin terminé, nous les éliminerons une fois pour toutes, et la manière dont nous les traiterons dépendra d’eux. Prison ou exécution, qu’est-ce qui leur convient le mieux ?"
 PMR_totalitarian_economic: "Contrôle autoritaire de l’économie"
 PMR_totalitarian_economic_desc: "La sphère économique de notre État a été laissée au hasard, mais maintenant nous la remettrons sous le contrôle d’un leader fort."
 PMR_nationalize_burjui: "Nationaliser les entreprises étrangères"
 PMR_nationalize_burjui_desc: "Les usines industrielles appartenant à des étrangers représentent toujours un risque pour la sécurité économique. Avec les pays étrangers qui nous menacent de sanctions économiques, il y a toujours le danger que les propriétaires industriels partent du jour au lendemain et emportent des pièces vitales de leurs usines. Pour éviter cela, nous devons revendiquer ces industries pour l’État – même si cela offense les États étrangers."
 PMR_vpk: "Relance des usines militaires"
 PMR_vpk_desc: "Notre armée a besoin d’armes, et pour les produire, nous devons avoir au moins une industrie militaire minimale, car l’héritage de l’URSS nous permet de créer de telles conditions."
 PMR_defenced: "Renforcer les frontières"
 PMR_defenced_desc: "L’ennemi attend toujours que nous faiblissions pour nous attaquer, peu importe de quel côté. Par conséquent, nos frontières doivent être renforcées des deux côtés."
 PMR_kazaki_more: "Accepter les volontaires cosaques"
 PMR_kazaki_more_desc: "De nombreux Cosaques se sont installés en Transnistrie depuis que le gouvernement ici est devenu plus patriotique. Nous sommes même prêts à former un nouveau bataillon avec eux, qui nous aidera dans les batailles futures."
 PMR_sheriff_mobilize: "Mobiliser les anciens employés de Sheriff"
 PMR_sheriff_mobilize_desc: "Les anciens officiers de Sheriff doivent expier leur péché envers la patrie. Servir dans l’armée est tout à fait approprié pour une telle rédemption."
 PMR_moldova_weapons: "Equip The Rebels"
 PMR_moldova_weapons_desc: "Nous fournirons des armes aux rebelles potentiels sur le territoire de la Moldavie afin qu’ils nous aident au bon moment."
 PMR_moldova_finish: "Résoudre la question moldave"
 PMR_moldova_finish_desc: "Nous ne pourrons pas dormir tranquillement en sachant que tôt ou tard, la Moldavie tentera de reprendre notre patrie. Par conséquent, nous devons résoudre la question de leur existence une fois pour toutes."
 PMR_moldova_money: "Fund The Rebels"
 PMR_moldova_money_desc: "Nous soutiendrons financièrement les rebelles potentiels sur le territoire de la Moldavie afin qu’ils nous aident au bon moment."
 PMR_anti_west_idea: "Doctrine anti-occidentale"
 PMR_legion_idea: "La Légion transnistrienne"
 PMR_lebed_policy_idea: "Système politique de la junte transnistrienne"
 PMR_corruption_dead_in_govern_idea: "Corruption gouvernementale éliminée"
 ded_lebed: "Le général Lebed est mort"
 transnistria.42.t: "Intégration de la Transnistrie"
 transnistria.42.d: "Nous sommes prêts à enfin intégrer la Transnistrie dans notre pays."
 transnistria.42.a: "Enfin"
 transnistria_news.3.t: "La Transnistrie devient partie de la Moldavie"
 transnistria_news.3.d: "Les autorités de la République moldave pridnestrovienne non reconnue ont tenu un référendum sur l’adhésion à la Moldavie, où la majorité a voté en faveur. Le gouvernement moldave a accepté le résultat de ce référendum et a annoncé l’incorporation de la Transnistrie à la Moldavie."
 transnistria_news.3.a: "Intéressant."
 transnistria_news.4.t: "La Transnistrie annexe la Moldavie"
 transnistria_news.4.d: "Des nouvelles inattendues viennent de Moldavie. La Transnistrie, autrefois partie de cet État, a annoncé l’annexion de la Moldavie et l’occupation de sa place en tant que continuation de l’État moldave."
 transnistria_news.4.a: "Intéressant."
 PMR_moldova_economic: "Adopt the Leu"
 PMR_moldova_economic_desc: "Dropping the ruble and embracing Moldova's currency is going to be an incredibly costly endeavor. Thankfully our new committee has been working directly with the banks to set up exchange stations and begin circulating the new notes immediately."
 PMR_moldova_military: "A Synchronised Military"
 PMR_moldova_military_desc: "One of Moldova's demands has been conforming our military to match their doctrine and systems. New uniforms and training regiments are going to be handed out, and our command will be looked at from top to bottom to ensure we aren't bringing any dead weight with us."
 PMR_annex_efffect_idea1: "Intégration économique"
 PMR_army_efffect_idea1: "Intégration de l’armée"
 PMR_MLV_influence_tt: "[MLV.GetFlag] Multiplicateur d’§Hinfluence moldave§! dans §Y[PMR.GetNameWithFlag]§! : §R+15 %§!"
 PMR_hun_invest: "Investissements hongrois"
 PMR_hun_invest_desc: "Plusieurs entreprises hongroises ont exprimé leur désir d’investir dans notre économie."
 PMR_rom_invest: "Investissements roumains"
 PMR_rom_invest_desc: "Plusieurs entreprises roumaines ont exprimé leur désir d’investir dans notre économie."
 PMR_aus_invest: "Investissements autrichiens"
 PMR_aus_invest_desc: "Plusieurs entreprises autrichiennes ont exprimé leur désir d’investir dans notre économie."
 PMR_sov_invest: "Investissements russes"
 PMR_sov_invest_desc: "Plusieurs entreprises russes ont exprimé leur désir d’investir dans notre économie."
 PMR_encouraged_foreign_investments_idea: "Loi sur les investissements"
 PMR_buy_german_investments: "§GRacheter§! les investissements §Yallemands§! [GER.GetFlag]"
 PMR_buy_italian_investments: "§GRacheter§! les investissements §Yitaliens§! [ITA.GetFlag]"
 PMR_buy_russian_investments: "§GRacheter§! les investissements §Yrusses§! [SOV.GetFlag]"
 PMR_buy_ukraininan_investments: "§GRacheter§! les investissements §Yukrainiens§! [UKR.GetFlag]"
 PMR_buy_austrian_investments: "§GRacheter§! les investissements §Yautrichiens§! [AUS.GetFlag]"
 PMR_buy_romanian_investments: "§GRacheter§! les investissements §Yroumains§! [ROM.GetFlag]"
 PMR_buy_hungarian_investments: "§GRacheter§! les investissements §Yhongrois§! [HUN.GetFlag]"
 PMR_pograncy_desc: "Nous améliorerons le financement et le soutien des troupes frontalières de notre république, car nos frontières sont constamment menacées d’invasion ennemie."
 PMR_red_moldova: "Restaurer la RSS de Moldavie"
 PMR_red_moldova_desc: "Les citoyens moldaves souffrent depuis trop longtemps sous le joug des dirigeants occidentaux et de leurs subordonnés, qui ont transformé la Moldavie en l’un des pays les plus pauvres d’Europe et du monde. Il est temps de les libérer de l’oppression capitaliste."
 PMR_social_program: "Programme de soutien social"
 PMR_luxury_tax_idea: "Taxe sur le luxe"
 PMR_gos_plans_idea: "Gosplan 2.0"
 PMR_small_business_support: "Développement rapide de la science"
 PMR_small_business_support_desc: "La science a toujours été le moteur du progrès, et nous soutiendrons nos scientifiques, peu importe leur nombre."
 PMR_infra: "Investissements dans les infrastructures"
 PMR_infra_desc: "Nos habitants devraient se déplacer sur des routes normales, pas sur un champ de mines."
 PMR_roskosh: "Taxe sur le luxe"
 PMR_roskosh_desc: "Les riches devraient payer plus d’impôts, car notre trésorerie n’est pas infinie, mais plutôt excessivement limitée."
 PMR_selhoz: "Plan de développement agricole"
 PMR_selhoz_desc: "L’agro-industrie est la clé de notre survie et de notre satiété, nous ne lésinerons pas sur les investissements dans ce secteur."
 PMR_gos_plan_2: "Gosplan 2.0"
 PMR_gos_plan_2_desc: "À l’image des plans quinquennaux de l’URSS, nous créerons notre propre plan, appelé Gosplan 2.0."
 PMR_army_prestige: "Relever le prestige de l’armée"
 PMR_army_prestige_desc: "Le prestige de notre armée doit être relevé, car sans ces valeureux soldats, notre république n’existerait pas."
 PMR_expel_russians: "Expel The Peacekeepers"
 PMR_expel_russians_desc: "We have our own army, capable of defending our own people. The Russians who remain here are only going to continue to put a blotch on the validity of our government. They need to go."
 PMR_annex_odessa: "Intégration de §Y[OPR.GetNameWithFlag]§!"
 transnistria.43.t: "Merci d’avoir choisi la Transnistrie !"
 transnistria.43.d: "La Transnistrie a reçu une mise à jour il y a un an, mais j’ai décidé de mettre complètement à jour le contenu existant afin de diversifier encore plus le gameplay pour ce petit pays !\n Dans ce patch, la Russie et la Transnistrie auront plus de coopération qu’auparavant, mais cela ne signifie pas que votre chemin doit nécessairement mener à la Russie. Vous pouvez choisir le côté de la Moldavie ou de l’Ukraine ! Et si vous êtes vraiment rusé, vous pourriez même créer un Empire transnistrien !\n La Transnistrie a été mise à jour selon mes propres standards de contenu, que j’ai implémentés dans la branche russe, donc même la branche économique est très similaire à celle de la Russie.\n J’espère que vous apprécierez le contenu mis à jour et que vous jouerez une partie intéressante pour la Transnistrie avec un ami ou des amis !\n\n - Lord Bogdanoff, Développeur de la Transnistrie et membre de l’équipe Russia Rework"
 transnistria.43.a: "Spasibo"
 PMR_buy_general: "Corrompre les généraux d’Odessa"
 PMR_buy_general_desc: "Nous corromprons certains généraux ukrainiens à Odessa pour qu’au moment opportun, ils nous soutiennent dans notre soulèvement armé."
 PMR_idea_national_guard: "Garde nationale"
 PMR_Sheriff_yest_tt: "£text_icon_pmr_sheriff §2Sheriff§! n’a pas été §Rdétruit§!"
 PMR_kobalsna_small_weapons_tt: "Les stocks d’armes dans les entrepôts n’ont pas été §Rvidés§!"
 PMR_kobalsna_take_weapons_tt: "Toutes les armes prêtes au combat des entrepôts seront ajoutées à l’§Yarsenal§!"
 PMR_mvd: "Une Transnistrie sûre"
 PMR_mvd_desc: "Ce ne sont pas seulement les forces armées qui assurent l’indépendance de notre république, mais aussi les services spéciaux et les organes des affaires intérieures, sur lesquels repose la lutte interne contre les ennemis extérieurs."
 PMR_mvdshka: "Ministère des Affaires intérieures"
 PMR_mvdshka_desc: "Le ministère des Affaires intérieures de la Transnistrie, également connu sous le nom de ministère de l’Intérieur, est une agence gouvernementale officielle de la République moldave pridnestrovienne partiellement reconnue. C’est l’organe exécutif chargé de mettre en œuvre les politiques de défense des forces armées de la Transnistrie."
 PMR_ubepik: "Department of Economic Security"
 PMR_ubepik_desc: "The Department of Economic Security and Anti-Corruption develops and implements state policy and regulatory legal measures in the field of economic security. It also performs other functions in accordance with federal legislation, presidential decrees, and regulatory legal acts of the Ministry of Internal Affairs."
 PMR_dnestr: "Separate Special Purpose Brigade"
 PMR_dnestr_desc: "La brigade spéciale à usage spécifique « Dniestr » est une brigade de milice à usage spécial de la République moldave pridnestrovienne, formée en août 1991 à Tiraspol pendant le conflit transnistrien et directement subordonnée au ministère des Affaires intérieures de la République."
 PMR_mgb: "Ministère de la sécurité d’État"
 PMR_mgb_desc: "Le ministère de la sécurité d’État est le service de sécurité étatique de la Transnistrie."
 PMR_delta: "Bataillon des forces spéciales Delta"
 PMR_delta_desc: "Le bataillon des forces spéciales Delta est un bataillon spécial formé au printemps 1992 à Tiraspol, actuellement directement subordonné au ministère de la sécurité d’État de la Transnistrie. Il est enrôlé dans la réserve du commandant en chef des forces armées de la Pridnestrie et exécute actuellement des tâches liées à la protection des frontières de la République moldave pridnestrovienne et à la lutte contre le terrorisme."
 PMR_mvd_category: "Internal Affairs"
 PMR_mvd_category_desc: "It is not only the armed forces that ensure the independence of our republic, but also the special services and internal affairs bodies, on whose shoulders lies the internal struggle against external enemies.\n§RTo destroy§! £text_icon_pmr_sheriff §2the Sheriff's monopoly§!, it is necessary to have a §Glow level§! of §Ycorruption§!"
 PMR_emperess_maria: "Bureau des institutions de l’impératrice Maria"
 PMR_emperess_maria_desc: "Nous restaurerons ce département qui s’occupera de sanatoriums et d’hôpitaux abordables, améliorant ainsi le soutien à la santé de nos citoyens."
 PMR_nationalized: "Nationalize the Companies"
 PMR_nationalized_desc: "Our capacity to assert the new traditional norms will be decided by our capacity to manage the industries directly."
 PMR_agri_sup: "Soutien au secteur agro-industriel"
 PMR_agri_sup_desc: "We can't expect support from the peasants without ensuring they have a means to survive."
 PMR_lux_tax: "Introduce the Luxury Tax"
 PMR_lux_tax_desc: "Les riches devraient payer plus d’impôts, car notre trésorerie n’est pas infinie, mais plutôt excessivement limitée."
 PMR_monarchy_guard: "Garde impériale"
 PMR_dedd_sheriff: "Enfermer le Sheriff"
 PMR_emperess_maria_idea: "Bureau des institutions de l’impératrice Maria"
 PMR_royal_leib_guard_idea: "La Garde Leib"
 PMR_monarchism: "A Monarchist Constitution"
 PMR_monarchism_desc: "La Transnistrie est considérée comme une réserve de l’URSS, mais les opinions des habitants locaux ont depuis longtemps évolué. L’URSS est désormais associée à des ruines et au chaos ; peut-être l’héritage de l’Empire russe nous convient-il mieux ?"
 PMR_monarchy_guard_desc: "Quel monarque serait sans sa garde ? Une Garde impériale sera établie sur le territoire du Saint-Siège pour protéger l’État et l’Empereur."
 PMR_dedd_sheriff_desc: "Il est temps de mettre fin à l’influence de cette holding sur notre république, nous serons libres !"
 transnistria.44.t: "The Ukrainian Front Collapse"
 transnistria.44.d: "Russian columns are rolling west and Kiev's command has lost control of the southern axis. Odessa oblast, the strip of coast that has separated us from the sea since 1990, is defended by little more than reservists. Our staff officers point out that the depots at Kolbasna are still full and that the road to Tiraspol runs both ways. The leadership in Tiraspol is weighing the opportunity against the certainty that Ukraine, if it survives, will remember who moved against it."
 transnistria.44.a: "Tiraspol will not stand aside."
 transnistria.44.b: "This is not our war."
 transnistria.45.t: "The General in Krasnoyarsk"
 transnistria.45.d: "Alexander Lebed commanded the 14th Guards Army when it stood between Tiraspol and the Moldovan advance, and there are still officers in this republic who will say his name before they say Smirnov's. He governs Krasnoyarsk Krai now, six thousand kilometres east of the Dniester, flying between mining towns in borrowed helicopters and quarrelling with Moscow over the krai budget. Our staff argue that a republic built by soldiers should be led by one, and that an invitation from Tiraspol would not go unanswered. It would not be cheap. A sitting Russian governor does not move house for nothing, and Moscow would want more than roubles to look the other way."
 transnistria.45.a: "Bring the General home."
 transnistria.45.b: "Tiraspol is not his to command."
 transnistria.46.t: "The General Will Not Come Home"
 transnistria.46.d: "A Mi-8 carrying Alexander Lebed struck a power line in the hills of Krasnoyarsk Krai and came down in fog. The governor of the krai, the man who held the Dniester line in 1992, was killed along with seven others aboard. Tiraspol has sent its condolences to Moscow. The officers who spent a decade waiting for him to come back have nothing left to wait for, and whatever a soldiers' government in this republic might have looked like under his command, it will not be built now."
 transnistria.46.a: "He is buried at Novodevichy."
 PMR_idea_national_guard_desc: "A territorial force raised from the districts and answerable to the Ministry of Defence rather than the militia, meant to hold ground the regular army cannot spare men for. It costs the interior budget more than it saves, but it puts a trained rifle in every settlement along the Dniester.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 PMR_peacerota_idea_desc: "The Joint Control Commission has kept a Transnistrian contingent in the security zone since 1992, alongside the Russian and Moldovan battalions. Standing that force up properly gives Tiraspol a unit trained and equipped to deploy beyond its own borders.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 PMR_landforce_modifier: "Transnistrian Armed Forces"
 PMR_landforce_modifier_desc: "Some four thousand regulars around Tiraspol and Bender, equipped out of what the Soviet 14th Army left behind in 1992 and commanded by officers who last saw a training range under a different flag. The conscript intake is small, the T-64s and BTRs have not been overhauled in a decade, and the reserve system exists mostly on paper.\n§W--------------§!\nThis national spirit will never be §RRemoved§!. Its penalties will §GImprove§! with every §HArmy§! focus we complete, and will be §Rgone entirely§! once we complete §HThe New Army of Transnistria§!."
 PMR_airforce_modifier: "Air Force of Transnistria"
 PMR_airforce_modifier_desc: "One airfield at Tiraspol, a handful of Mi-8 and Mi-24 machines handed over when the 14th Army drew down, and no combat aircraft at all. The pilots on the establishment have not flown a jet since the Soviet Union dissolved, and there is no radar network worth the name behind them.\n§W--------------§!\nThis national spirit will never be §RRemoved§!. Its penalties will §GImprove§! if we complete the §HTransnistrian Air Force§! focus, and will be §Rgone entirely§! once we complete the §HAir Force Academy§! focus."
 PMR_doctrine_romania_desc: "The general staff treats Bucharest as the sponsor of anything Chisinau attempts on the Dniester, and plans accordingly. Exercises are written around Romanian formations, Romanian equipment and the Romanian officers seconded to the Moldovan army.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 PMR_doctrine_ukraine_desc: "Kyiv holds the only border Tiraspol cannot close and the only railway that reaches the outside world. The general staff plans for the day that border becomes a front, and drills the army against Ukrainian formations rather than Moldovan ones.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 PMR_kazachestvo_desc: "The Black Sea Cossack Host was revived in the Dniester valley in 1991 and fought as volunteer detachments through the war of the following year. Its districts still elect atamans, muster on command and keep their weapons at home, and the republic treats them as a standing reserve.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 PMR_denomination_idea_desc: "The Transnistrian ruble was introduced in 1994 on the back of overprinted Soviet notes and has never had a reserve to stand on. Hyperinflation has wiped out savings twice, the population prices everything in dollars, and the central bank cannot hold a peg for a single quarter.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we complete the §HDenomination§! focus."
 PMR_encouraged_foreign_investments_idea_desc: "Tiraspol cannot borrow abroad and cannot tax an economy this small into growth, so it sells access instead. The 2002 investment law strips away licensing, guarantees repatriation of profits and hands incoming partners the state enterprises that Sheriff has not already taken.\n§W--------------§!\nThis national spirit will be §RRemoved§! if we become the subject of another nation."
 PMR_economy_modifier: "Transnistrian Economy"
 PMR_economy_modifier_desc: "What is left of the Moldavian SSR's industrial belt: the Rybnitsa cement works, the Tiraspol textile mills, the KVINT distillery, the railway that carries everything to Odesa, and the farms of the Dniester valley. Every company brought back into production leaves its mark here.\n§W--------------§!\nThis national spirit will never be §RRemoved§!. However, the modifiers could gradually §GImprove§! as more focuses, decisions, and events are completed."
 PMR_foreign_investments_modifier: "Foreign Investments"
 PMR_foreign_investments_modifier_desc: "The share of Transnistrian industry that answers to owners abroad. Austrian, German and Hungarian holdings bought during the privatisations, Romanian and Italian agricultural money, and the Ukrainian steelmakers at Rybnitsa. Their capital keeps the plants running, and their governments a voice in Tiraspol.\n§W--------------§!\nA partner's stake will be §RRemoved§! if we go to war with them or they cease to exist. We may then §YBuy Back§! their holdings through the §YTransnistrian Economy§! decisions."
 PMR_sheriff_modifier: "Sheriff"
 PMR_sheriff_modifier_desc: "Founded in 1993 by two former officers of the Transnistrian militia, Sheriff owns the supermarkets, the petrol stations, the mobile network, the television channels, the football club and, through the Obnovlenie party, the Supreme Council. The republic is less a state with a company in it than a company with a state around it.\n§W--------------§!\nThis national spirit will §GGrow stronger§! with every Sheriff focus we complete, and will be §RRemoved§! if we complete the §YDestroy the Sheriff's Monopoly§! decision or one of the §HEnd the Sheriff's Holding§! focuses."
 PMR_sheriff_grows_tt: "£text_icon_pmr_sheriff §YSheriff§!'s hold over the republic §Rtightens§!"
 PMR_sheriff_full_control_tt: "£text_icon_pmr_sheriff §YSheriff§! holds §Rcomplete control§! over the republic"
 PMR_security_modifier: "Transnistrian Special Services"
 PMR_security_modifier_desc: "The internal security apparatus of the Pridnestrovian Moldavian Republic: the Ministry of State Security in Tiraspol with its Delta counter-terrorism battalion, the Ministry of Internal Affairs and its Dniester special-purpose brigade, the border troops watching the Ukrainian line and the Moldovan side of the security zone, and the directorate for economic security and anti-corruption. Every reform of the services accumulates here.\n§W--------------§!\nThis national spirit will never be §RRemoved§!. However, the modifiers could gradually §GImprove§! as more focuses reforming the services are completed."
 PMR_upgrade_services_tt: "We have services that can be §Yreformed§!"
 PMR_upgrade_mgb_tt: "The §YMinistry of State Security§! has not yet been reformed"
 PMR_legion_idea_desc: "A volunteer formation open to foreigners, run out of the Ministry of State Security rather than the army. It gives Tiraspol men it can send abroad without admitting it sent them, and a counter-intelligence screen at home that a conscript army cannot provide.\n§W--------------§!\nThis national spirit will never be §RRemoved§!."
 PMR_lebed_secured: "General Lebed has returned to Tiraspol"