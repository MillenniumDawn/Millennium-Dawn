 targeted_ads_ast: "표적 광고"
 opening_info_ast.1.t: "시작 안내"
 opening_info_ast.1.d: "안녕하십니까, 오스트레일리아에 오신 것을 환영합니다. \n\n이 국가는 동적 국가 중점 트리를 사용하므로, 현재 지도자에 따라 국가 중점 트리가 변경됩니다. 특별 사건과 경로로도 트리가 바뀔 수 있습니다. \n\n개발은 아직 진행 중입니다. 현재 콘텐츠는 약 2015년까지 제공되며, 자유당과 노동당을 중심으로 지도자별 트리 7개가 있습니다. 원 네이션과 소수 정당 콘텐츠도 올해 안에 공개될 예정이며, 남반구의 이 땅에는 훨씬 더 많은 것이 준비되고 있습니다!"
 opening_info_ast.1.a: "알겠다."
 opening_info_ast.1.b: "국가 경로 안내."
 opening_info_ast.2.t: "선택 가능한 국가 경로"
 opening_info_ast.2.d: "자유당 \n\n- 토니 애벗. 2010~2013년 선거 중에, 또는 존 하워드를 퇴임시키면 선택할 수 있습니다. \n\n- 피터 코스텔로. 2004~2007년 선거 중에, 또는 존 하워드를 퇴임시키면 선택할 수 있습니다. \n\n- 맬컴 턴불 (개발 중). 2016~2019년 선거 중에 선택할 수 있습니다. \n\n노동당 \n\n- 킴 비즐리. 2001년 선거 중에 선택할 수 있습니다. \n\n- 마크 레이섬. 2004년 선거 중에 선택할 수 있습니다. \n\n- 케빈 러드. 2007~2010년 선거 중에 선택할 수 있습니다. \n\n- 줄리아 길러드. 2013~2016년 선거 중에, 또는 러드가 퇴진하면 선택할 수 있습니다."
 opening_info_ast.2.a: "돌아간다."
 AST_boeing_australia: "보잉 오스트레일리아"
 AST_boeing_australia_mio_header_airframe_assembly_and_sustainment: "기체 조립 및 지속 지원"
 AST_boeing_australia_mio_header_uncrewed_targets_and_flight_test_systems: "무인 표적 및 비행 시험 체계"
 AST_residency_eligibility: "자격 요건을 재검토한다"
 AST_residency_eligibility_desc: "현행 요건과 수많은 자격 장벽 때문에 외국에서 태어난 오스트레일리아인 다수가 입대하지 못하고 있습니다. 영주권자에게 기준을 개방하고 ADF를 통한 시민권 취득 경로를 제시하면 새로운 세대를 ADF로 끌어들일 수 있습니다."
 AST_kapooka_training_sims: "카푸카 훈련 시뮬레이터"
 AST_kapooka_training_sims_desc: "군사 시뮬레이션 분야의 디지털 혁신은 이제 병사들이 막사를 떠나지 않고도 필수 훈련을 받을 수 있는 수준에 이르렀습니다! 전차 시뮬레이터, 가상 현실, 심지어 비디오 게임까지 기초 훈련소에서 활용되어 야전 임무를 준비시킬 것이며, 시범 운영은 카푸카에서 진행됩니다."
 AST_territory_bases: "해외 영토 기지"
 AST_territory_bases_desc: "서부 측면에서의 전력 투사는 언제나 주요 관심사였습니다. 인도양 인근의 섬 기지들은 방어를 보강하지 않으면 침략자의 손쉬운 표적이 될 것입니다."
 AST_asca: "ASCA"
 AST_asca_desc: "국방혁신허브 같은 기존 체계가 단계적으로 폐지됨에 따라 첨단 전략 능력 촉진 구상이 시행됩니다. 이 프로그램은 시제품을 신속히 배치하는 데 중점을 두며, 생산 라인을 확대하고 간소화하여 최신 설계에 대비하도록 합니다."
 AST_phase_two_deployment: "3단계 개량"
 AST_phase_two_deployment_desc: "라인메탈의 개선은 우리의 군수가 크게 향상되기 시작할 만큼 충분히 성공적이었습니다. 사업 책임자들은 한 걸음 더 나아가 현재의 화물 트레일러, 구난차, 급유차, 덤프차를 통합 설계로 교체하자고까지 제안했습니다. 육군을 손쉽게 지원할 수 있게 하자는 것입니다."
 AST_eagle_four: "EAGLE IV"
 AST_eagle_four_desc: "새로운 조달 단계에 입찰한 또 다른 업체는 제너럴 다이내믹스이며, 최근의 4x4 전술 차량을 제시했습니다. EAGLE 계열의 현지화 파생형으로, 장갑을 희생하지 않으면서도 더 무거운 APC보다 기동성과 속도가 뛰어난 대안이 될 것입니다."
 AST_hitting_harder: "더 강하게 타격한다"
 AST_hitting_harder_desc: "최근 제너럴 다이내믹스는 탈레스와 협력하여 부시마스터의 장점을 발전시키고 이를 우리 기갑 전력에 적용하는 작업을 해 왔습니다. 생존성 향상, 폭풍 편향, 전자적 적응성은 현재 부대에 도입하려는 설계안의 핵심 요소입니다."
 AST_send_the_thunder: "천둥을 보낸다"
 AST_send_the_thunder_desc: "AS9 헌츠맨 자주포 시험 당시 포탄 발사음은 수 마일 밖에서도 천둥이 갈라지는 소리 같았다고 묘사되었습니다. 이는 우리의 혁신과 놀라운 힘을 다룰 수 있는 능력의 증거입니다. 대전차 및 대공 표적 체계도 이번 개량에서 같은 길을 따를 것입니다. 다음 전장에 천둥을 몰고 갈 수 있게 될 것입니다."
 AST_rebuild_the_home_guard: "향토방위대를 재건한다"
 AST_rebuild_the_home_guard_desc: "제2차 세계 대전 중 원래의 향토방위대는 적 전투원이 해안에 상륙할지 모른다는 임박한 위기에 대응하기 위해 창설되었습니다. 다행히 그런 일은 일어나지 않았습니다. 그러나 오늘날에는 외세의 침공이라는 발상이 결코 먼 이야기가 아닙니다. 지역 재난에 대응하고 해외의 위협을 막아낼 수 있는 상설 방위군 체계를 채택해야 합니다."
 AST_forgen: "FORGEN"
 AST_forgen_desc: "크고 작은 파병이 이어지는 동안 우리는 병력의 전투력을 유지하고, 충분한 보급을 제공하며, 사기를 높게 유지해야 합니다. 이를 위해 전력 창출 절차를 활용합니다. 장비는 주기적으로 정비 및 재편되며, 파병이 끝나는 병력을 교체할 신규 인원이 투입됩니다."
 AST_expeditionary_ready: "원정 준비 태세"
 AST_expeditionary_ready_desc: "우리의 작전 지역이 아시아와 중동 전역으로 확대됨에 따라, 본토에서 멀리 떨어진 곳의 작전을 계획하고 수행할 새로운 §Y합동작전사령부§!가 창설됩니다."
 AST_pmc_support: "PMC 지원"
 AST_pmc_support_desc: "우리는 우리 병력이 쉽게 갈 수 없는 곳에서 대사관 등을 경비하기 위해 이따금 민간 군사 기업을 고용하는 것을 꺼리지 않습니다. 우리의 활동 범위가 넓어지고 해외에서 군수 부담이 커짐에 따라, 후방의 안전과 마음의 평화를 확보하려면 도움의 손길이 필요합니다."
 AST_umbrella_engagement: "우산 관여"
 AST_umbrella_engagement_desc: "외교와 국방이 상호 배타적이지 않다는 것은 놀라운 일이 아닐 것입니다. 이 지역의 평화를 위한 우리의 청사진은 간단히 완충국 구상이라 할 수 있습니다. 우리가 접근할 수 있는 주변 국가들을 군사적으로나 다른 방식으로 지원하여, 우리와 접근하기 어려운 국가들 사이에 방어막을 형성하는 것입니다."
 AST_a_model_army: "모범 군대"
 AST_a_model_army_desc: "ADF는 우리의 가장 오래되고 견고한 기관 중 하나였으며, 이제는 사실상 태평양의 모범 군대가 되었습니다. 무기 생산은 어느 때보다 효율화되었고, 병사들은 최신이자 가장 효과적인 장비를 누리고 있습니다. 우리의 개혁은 군에 자부심과 존경을 되찾아 주었으며, 이에 힘입어 신규 지원자가 늘어날 것으로 기대됩니다."
 AST_autonomous_ops: "자율 작전"
 AST_autonomous_ops_desc: "전쟁에서 작전상의 우위는 더 빠르게 적응하는 쪽에 돌아갑니다. 드론과 인공지능 체계는 전쟁 수행 방식을 빠르게 바꾸어, 아군 인원의 위험은 줄이고 적에게 가하는 피해는 늘려 놓았습니다. 우리의 다음 단계는 로봇 및 자율 체계와 인공지능 표준을 육군에 내재화하고, 우리의 임무 구조에 맞도록 감시하며 조정하는 것입니다."
 AST_denial_operations: "거부 작전"
 AST_denial_operations_desc: "힘만으로는 적대국들을 완전히 억제할 수 없는 만큼, 분쟁이 발생하면 거부 전략을 채택해야 합니다. 적은 모든 지점에서 지연되어야 합니다. 기반 시설은 사용 불능이 되어야 하고, 해상 교통로는 접근할 수 없게 되어야 합니다. 우리 군은 적이 예상하지 못한 곳을 타격하여 최대한의 피해를 입히는 것을 명확한 목적으로 삼아야 합니다."
 canberra_treaty_idea_desc: "\n§W--------------§!\n전쟁 중이 아니라면 이 국가 정신은 §R제거§!됩니다."
 generic_bushfires_ast.2.t: "캔버라를 덮친 산불"
 generic_bushfires_ast.2.d: "25킬로미터 길이의 불길 전선이 거센 바람에 기세를 더하며 수도 캔버라로 접근하고 있으며, 폭발적인 폭풍을 만들어 대응 인력이 진화에 허둥대고 있습니다. \n\n전국적인 고온이 갑작스러운 산불 발생의 주된 원인으로 지목되었으며, 이 주의 목초지, 숲, 자연공원의 약 70%가 이미 파괴된 것으로 추정됩니다. 국내에서 가장 오래된 연구 천문대 중 하나인 마운트 스트롬로 천문대를 포함해 약 488채의 주택도 소실되었습니다."
 generic_bushfires_ast.2.a: "끔찍한 손실이다."
 us_aus_trade_howrd.1.c: "거래는 없다."
 us_aus_trade_howrd.4.t: "미국의 거래 뒤집기"
 us_aus_trade_howrd.4.d: "미국 관리들은 처음에 이 거래를 좋게 받아들였으나, 어느 시점에선가 거래의 더 중요한 부분 일부를 도려낸 것으로 보입니다. 특히 설탕과 쇠고기가 제외되어, 우리의 주요 농업 로비 단체들에게 우리가 다소 빈손으로 보이게 되었습니다. \n\n우리는 거래를 재협상하거나 거부할 입장이 아닙니다. 이미 성사되었기 때문입니다. 대신 정면 공격을 감수하고 앞으로 나아갈 수밖에 없습니다."
 us_aus_trade_howrd.4.a: "우리가 당한 건가?"
 ind_extremist_suppression_bonus_desc: "\n§W--------------§!\n오스트레일리아와 전쟁 중이 되면 이 국가 정신은 §R제거§!됩니다."
 australia_uranium_deal_desc: "오스트레일리아의 항구에서 우라늄이 계속 들어오는 동안 우리는 핵 생산과 연구 역량의 증대를 누릴 수 있습니다. \n§W--------------§!\n오스트레일리아와 전쟁 중이 되면 이 국가 정신은 §R제거§!됩니다."
 australian_developmental_aid_ast_desc: "양자 공적개발원조(ODA)에 따라 우리는 인도주의, 테러, 교육과정 문제에서 더 긴밀히 협력하는 대가로 오스트레일리아로부터 교육, 에너지, 연구 자금을 받습니다. \n§W--------------§!\n오스트레일리아와 전쟁 중이 되면 이 국가 정신은 §R제거§!됩니다."
 investing_in_victory_ast_desc: "\n§W--------------§!\n전쟁 중이 아니게 되면 이 국가 정신은 §R제거§!됩니다."
