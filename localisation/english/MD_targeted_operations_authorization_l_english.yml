 TOP_visit.accept: "Accept the visit and its security burden."
 TOP_visit.decline: "Decline the invitation."
 TOP_visit.6.t: "Host a State Visit by [TOP_open_visit_name]"
 TOP_visit.6.d: "A working visit by [TOP_open_visit_name] is on offer. Acceptance gives foreign services sixty days of notice before a twenty-one-day stay, and the security burden falls on us for the duration."
 TOP_visit.1.t: "Invite Vladimir Putin to Beijing"
 TOP_visit.1.d: "A state visit by Vladimir Putin could strengthen the relationship with Russia. Acceptance gives foreign services sixty days of notice before a twenty-one-day stay in Beijing. It does not disclose a new dossier or guarantee that an operation will succeed."
 TOP_visit.2.t: "Invite Xi Jinping to Moscow"
 TOP_visit.2.d: "A state visit by Xi Jinping could strengthen the relationship with China. Acceptance gives foreign services sixty days of notice before a twenty-one-day stay in Moscow. It does not disclose a new dossier or guarantee that an operation will succeed."
 TOP_visit.3.t: "Invite Volodymyr Zelenskyy to Masovia"
 TOP_visit.3.d: "A state visit by Volodymyr Zelenskyy could strengthen the relationship with Ukraine. Acceptance gives foreign services sixty days of notice before a twenty-one-day stay in Masovia. It does not disclose a new dossier or guarantee that an operation will succeed."
 TOP_visit.4.t: "Invite Benjamin Netanyahu to Najd"
 TOP_visit.4.d: "A state visit by Benjamin Netanyahu could open a carefully managed diplomatic channel with Israel. Acceptance gives foreign services sixty days of notice before a twenty-one-day stay in Najd. It does not disclose a new dossier or guarantee that an operation will succeed."
 TOP_visit.5.t: "Invite Mohammed bin Salman to Jerusalem"
 TOP_visit.5.d: "A state visit by Mohammed bin Salman could open a carefully managed diplomatic channel with Saudi Arabia. Acceptance gives foreign services sixty days of notice before a twenty-one-day stay in Jerusalem. It does not disclose a new dossier or guarantee that an operation will succeed."
 TOP_crisis.10.t: "A State Visit Ends in an Exposed Killing"
 TOP_crisis.10.d: "Evidence has linked [?global.TOP_crisis_actor.GetNameDef] to the killing of a protected officeholder during a state visit hosted by [?global.TOP_crisis_physical_host.GetNameDef]. [?global.TOP_crisis_protection.GetNameDef] has opened an investigation while governments assess whether the host enabled the operation."
 TOP_crisis.10.t_capture: "A Foreign Leader Is Seized During a State Visit"
 TOP_crisis.10.d_capture: "Evidence has linked [?global.TOP_crisis_actor.GetNameDef] to the capture of a serving leader during a state visit hosted by [?global.TOP_crisis_physical_host.GetNameDef]. [?global.TOP_crisis_protection.GetNameDef] now faces a custody and hostage crisis while governments assess whether the host enabled the operation."
 TOP_crisis.10.a: "The incident has become an international crisis."
 TOP_crisis.11.t: "Another Exposed Leader Operation Deepens the Crisis"
 TOP_crisis.11.d: "A later operation against a serving leader has been attributed to [?global.TOP_crisis_actor.GetNameDef] while its confrontation with [?global.TOP_crisis_protection.GetNameDef] remains unresolved. The additional evidence has raised the risk of sanctions and direct escalation."
 TOP_crisis.11.a: "The crisis is becoming harder to contain."
 TOP_crisis.12.t: "A Separate State Visit Operation Is Exposed"
 TOP_crisis.12.d: "Evidence has linked [?TOP_unmatched_incident_actor.GetNameDef] to another operation against a serving leader during a state visit hosted by [?TOP_unmatched_incident_host.GetNameDef]. Because this incident involving [?TOP_unmatched_incident_protection.GetNameDef] does not match both parties to the ongoing crisis, it will be handled separately."
 TOP_crisis.12.a: "A separate investigation begins."
 TOP_crisis.1.t: "The State Visit Investigation"
 TOP_crisis.1.d: "Evidence links [FROM.GetNameDef] to the killing of a protected officeholder during a foreign visit. A measured investigation may preserve room for a settlement, while an immediate accusation would raise pressure on the suspected operator."
 TOP_crisis.1.t_capture: "A Leader in Foreign Custody"
 TOP_crisis.1.d_capture: "Evidence links [FROM.GetNameDef] to the capture and continued detention of a serving leader. A measured investigation may preserve room for a negotiated return, while an immediate accusation would intensify the custody crisis."
 TOP_crisis.1.a: "Open a measured investigation."
 TOP_crisis.1.c: "Open a negotiated exchange channel."
 TOP_crisis.1.b: "Accuse the operator immediately."
 TOP_crisis.4.t: "The Host Faces International Scrutiny"
 TOP_crisis.4.d: "The killing occurred under our security jurisdiction. Investigators from [?global.TOP_crisis_protection.GetNameDef] have requested access to records, personnel, and the site. Cooperation can contain the dispute, while obstruction will strengthen suspicions about the host's role."
 TOP_crisis.4.t_capture: "The Host Faces a Custody Investigation"
 TOP_crisis.4.d_capture: "A serving leader was seized under our security jurisdiction. Investigators from [?global.TOP_crisis_protection.GetNameDef] have requested access to records, personnel, and the route used to remove the captive. Cooperation can support a negotiated return, while obstruction will strengthen suspicions about the host's role."
 TOP_crisis.4.a: "Cooperate fully with the investigation."
 TOP_crisis.4.b: "Deny access and protect our records."
 TOP_crisis.2.t: "Answer the Exposed Operation"
 TOP_crisis.2.d: "[FROM.GetNameDef] has demanded an answer for the exposed killing. An admission and apology could lower tension at a domestic political cost. Denial preserves operational ambiguity, while open defiance risks an ultimatum."
 TOP_crisis.2.t_capture: "Answer for the Captured Leader"
 TOP_crisis.2.d_capture: "[FROM.GetNameDef] has demanded an answer and the return of its captured leader. An admission and negotiated transfer could lower tension at a domestic political cost. Denial preserves operational ambiguity, while open defiance prolongs the hostage crisis and risks an ultimatum."
 TOP_crisis.2.a: "Admit responsibility and apologize."
 TOP_crisis.2.b: "Deny state responsibility."
 TOP_crisis.2.c: "Refuse cooperation and defend the operation."
 TOP_crisis.3.t: "The Crisis Takes Shape"
 TOP_crisis.3.d_settlement: "The investigation and official responses have reduced tension enough for a negotiated settlement. The operation and its outcome remain on record, but neither government is preparing a broader confrontation."
 TOP_crisis.3.d_sanctions: "The dispute has entered a sustained sanctions crisis. Economic restrictions or limited mobilization can demonstrate resolve without making war automatic."
 TOP_crisis.3.d_ultimatum: "The dispute has reached the final-ultimatum threshold. The suspected operator must be given one last opportunity to accept responsibility before any direct response is considered."
 TOP_crisis.3.a: "Conclude a documented settlement."
 TOP_crisis.3.b: "Impose targeted bilateral sanctions."
 TOP_crisis.3.c: "Mobilize cautiously and keep talks open."
 TOP_crisis.3.d: "Deliver a final ultimatum."
 TOP_crisis.3.e: "Fold the incident into the existing war."
 TOP_crisis.5.t: "A Final Ultimatum"
 TOP_crisis.5.d: "[FROM.GetNameDef] has issued a final demand for responsibility and reparations. Acceptance will impose an immediate political cost but end this crisis. Rejection returns the decision to the other government without compelling its allies to join a war."
 TOP_crisis.5.a: "Accept the ultimatum and pay the political price."
 TOP_crisis.5.b: "Reject the ultimatum."
 TOP_crisis.6.t: "The Ultimatum Is Rejected"
 TOP_crisis.6.d: "The suspected operator has rejected the final demand. We can impose lasting bilateral sanctions, or begin one direct war to topple its government if our own political and military conditions permit. No faction member will be ordered into the conflict by this incident."
 TOP_crisis.6.a: "Impose sanctions and stop short of war."
 TOP_crisis.6.b: "Begin a direct war to topple the operator's government."
 TOP_crisis.6.c: "Continue the war already under way."
 TOP_crisis.7.t: "Consultation on a Targeted-Operations Crisis"
 TOP_crisis.7.d: "An ally, faction partner, or guaranteed government is involved in an escalating crisis after a credibly attributed operation against a serving political leader. We may support the victim, pressure the operator, mediate, or abstain. This consultation never compels us to enter a war."
 TOP_crisis.7.a: "Join sanctions against the operator."
 TOP_crisis.7.b: "Reinforce the victim government."
 TOP_crisis.7.c: "Share defensive intelligence."
 TOP_crisis.7.g: "Pressure the operator to de-escalate."
 TOP_crisis.7.e: "Offer mediation."
 TOP_crisis.7.f: "Abstain from the crisis."
