 UKR_bureau_open_desc: "Puts §YBureaucracy§! spending on the agenda of the §YVerkhovna Rada§!. While the debate is open, we can request a §Rhigher§! or a §Glower§! budget. A request takes §Y30§! days, then the deputies vote. The chance of approval depends on how many seats support us and how much we influence the Rada. Bonuses from our reforms make the deputies more willing to approve a §Glower§! budget."
 UKR_bureau_close_desc: "Takes §YBureaucracy§! spending off the agenda of the §YVerkhovna Rada§!. The spending requests disappear until we open the debate again."
 UKR_military_open_desc: "Puts §OMilitary§! spending on the agenda of the §YVerkhovna Rada§!. While the debate is open, we can request a §Rhigher§! or a §Glower§! budget. A request takes §Y30§! days, then the deputies vote. The chance of approval depends on how many seats support us and how much we influence the Rada. Bonuses from our reforms and defence projects make the deputies more willing to approve a §Rhigher§! budget."
