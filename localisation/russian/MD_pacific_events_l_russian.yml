l_russian:
 Solomon_Islands.1.t: "Под столицей появляются вооружённые группировки"
 Solomon_Islands.1.d: "В ответ на растущую враждебность к малаитянам была создана вооружённая группировка «Малаитские орлы», чтобы противостоять Освободительному движению Исатабу. Между двумя группировками уже начались столкновения, а сотрудники нашей собственной полиции, по сообщениям, переходят на сторону «Малаитских орлов». Хуже того, группировку возглавляет опытный политик Эндрю Нори, что, к сожалению, придаёт ей немалый авторитет в глазах общества."
 Solomon_Islands.1.a: "Становится только хуже."
 Solomon_Islands.2.t: "Хониара в осаде"
 Solomon_Islands.2.d: "Политическая ситуация в Хониаре достигла точки кипения. После нескольких месяцев этнических столкновений между группировками бойцы «Малаитских орлов», которым, по имеющимся данным, помогали сотрудники военизированной полиции, захватили ключевые стратегические объекты вокруг столицы. \n\nПо нашим скудным разведданным, они направляются сюда, чтобы вынудить премьер-министра уйти в отставку. Остановить их почти нечем, и единственный выход — договориться с оставшимися членами Освободительного движения Исатабу, чтобы те отбросили боевиков. Так мы, возможно, лишь усилим напряжённость между ними, но, может быть, предотвратим переворот."
 Solomon_Islands.2.a: "У нас нет выбора."
 Solomon_Islands.2.b: "Отбросить их."
 Solomon_Islands.3.t: "Обещания мира"
 Solomon_Islands.3.d: "Хотя работа правительства восстановлена, нападения на столичном острове по-прежнему происходят постоянно. Наши контакты в австралийском правительстве обсуждают идею мирных переговоров за пределами страны, на нейтральной территории. В качестве одного из мест предложен Таунсвилл. Представители «Малаитских орлов» и Освободительного движения Исатабу могли бы встретиться там, чтобы уладить разногласия и, надеемся, принять меры, которые не позволят столкновениям повториться."
 Solomon_Islands.3.a: "Достойное начинание."
 Solomon_Islands.4.t: "Мирные переговоры по Соломоновым островам"
 Solomon_Islands.4.d: "Дипломаты Соломоновых островов обратились к нам с просьбой выступить посредником на мирных переговорах между правительствами провинций и различными вооружёнными группировками. \n\nПосле этнических столкновений 1999 года в западных провинциях усилилась дискриминация малаитян. Напряжённость вылилась в ожесточённые столкновения вокруг столицы и последующее свержение прежнего лидера. Мы и так широко представлены на островах — видимо, поэтому они и обратились к нам."
 Solomon_Islands.4.a: "Что угодно ради стабильности."
 Solomon_Islands.4.b: "Это не наше дело."
 Solomon_Islands.5.t: "Буря"
 Solomon_Islands.5.d: "Хрупкий мир на островах взорвался. Месяцы политических грабежей, исчезающих средств и пустых постов охраны были лишь прелюдией к буре, которая пришла к нашему порогу. Столкновения боевиков вернулись с куда большим размахом, чем прежде, превратив целые сельские районы и деревни в зоны настоящей войны. Компании по всей стране сворачивают дела, а тысячи людей вынуждены покидать дома и бегут из страны. \n\nМы на волосок от гражданской войны. Лучшим выходом может стать просьба о немедленном вмешательстве к соседним странам, начиная с нашего ближайшего союзника — Австралии. Их присутствие, безусловно, ослабит нашу независимость, но выбора почти нет, и будущее выглядит мрачно."
 Solomon_Islands.6.t: "Австралия одобряет операцию по вмешательству"
 Solomon_Islands.6.d: "Австралийское правительство искренне откликнулось на наши мольбы и пообещало направить силы для стабилизации страны. Вскоре начнётся формирование оперативной группы, а их дипломаты планируют встретиться с нашими, чтобы согласовать операцию. Ожидается, что нам на помощь отправят около 2000 полицейских и военных, а также строительные бригады."
 Solomon_Islands.6.a: "Надежда ещё есть."
 Solomon_IslandsNews.1002.t: "Переворот боевиков на Соломоновых островах"
 Solomon_IslandsNews.1002.d: "Вчера вооружённая группировка «Малаитские орлы» под дулом оружия взяла в заложники премьер-министра Соломоновых островов Бартоломью Улуфаалу и вынудила его уйти в отставку. \n\nПереворот произошёл после того, как правительство не смогло остановить череду обострений в столице Хониаре, переросших в столкновения между «Малаитскими орлами» и Освободительным движением Исатабу. За последние 18 месяцев в этнических столкновениях погибли около 60 человек, а на островах разразился миграционный кризис. Теперь лидеры переворота объявляют себя единственной властью в Хониаре."
 Solomon_IslandsNews.1002.a: "Надвигается буря."
 SOL_Lead_to_hostilities_TT: "§RНапряжённость будет нарастать.§!"
 SOL_IFM: "Освободительное движение Исатабу"
 Solomon_Islands.0.t: "Нарастание этнической напряжённости в Хониаре"
 Solomon_Islands.0.d: "Жестокое обращение с малаитскими переселенцами на Гуадалканале продолжает разжигать этническую рознь на островах. Тысячи малаитян уже были вынуждены покинуть дома под давлением группировки, известной как Освободительное движение Исатабу, а вокруг столицы выставлены блокпосты, перекрывающие свободный въезд в провинцию. \n\nНаша полиция, судя по всему, не справляется или скомпрометирована, и нам остаётся лишь сидеть сложа руки и надеяться, что ситуация не выйдет из-под контроля."
 Solomon_Islands.0.a: "Всё само уляжется."
 Solomon_Islands.3.b: "Пустая трата времени."
 solomon_islands.5.a: "Звоните."
 solomon_islands.5.b: "Мы сами по себе."
 Solomon_Islands.7.t: "Тишина над волнами"
 Solomon_Islands.7.d: "Австралийское правительство отказало нам в просьбе о вмешательстве, и с надвигающейся бурей нам придётся справляться своими силами."
 Solomon_Islands.7.a: "Мы действительно одни."
 Solomon_Islands.8.t: "Вмешательство провалилось"
 Solomon_Islands.8.d: "Ввиду безоговорочного провала вмешательства австралийские силы решили сократить потери и начали уходить с островов. Без достаточного числа собственных войск для защиты страны мы, скорее всего, снова скатимся в кризис. Несмотря на все наши усилия, предотвратить неизбежное не удалось."
 Solomon_Islands.8.a: "Над островами сгущается тьма"
 SOL_worsening_ethnic_tensions_TT: "Этническая напряжённость §Rусилится§!"
 SOL_munda_accords: "Соглашения Мунда"
 SOL_munda_accords_desc: "После обострений 1990-х годов был введён ряд мер, чтобы ослабить напряжённость, вызванную ростом внутренней миграции. Соглашение ограничивает перемещение безработных бродяг между провинциями, предписывает возвращать малаитян в их родную провинцию и запрещает иностранцам приобретать землю."
 SOL_western_logging_efforts: "Лесозаготовки на западе"
 SOL_western_logging_efforts_desc: "Коммерческие лесозаготовки в Западной провинции быстро стали нашей самой прибыльной отраслью: они дают большую часть экспорта и служат экономической опорой региона. Однако в последнее время их успех привлёк поток мигрантов со всех островов в поисках работы, что усугубляет миграционный кризис в регионе."
 SOL_aftermath_of_the_tensions: "Последствия этнического конфликта"
 SOL_aftermath_of_the_tensions_desc: "Хотя Соглашение 1999 года дало различным культурным спорам больше признания и законных путей решения, на островах сохраняется лишь хрупкий мир. Если мы не наведём порядок в правительстве и не решим затянувшиеся миграционные проблемы, то можем не предотвратить новый кризис. \n§W--------------§!\nЭтот национальный дух будет §Gснят§!, если стабильность выше §Y70%§!, а уровень коррупции — §Y(3) умеренный§! или выше."
 SOL_agreement_with_the_gangs: "Соглашение с бандами"
 SOL_agreement_with_the_gangs_desc: "Сделка с Освободительным движением Исатабу дала нам столь необходимую передышку ценой освобождения десятков известных преступников. Полиция теперь сталкивается с резким ростом преступности, а доверие общества к нам упало до исторического минимума."