l_english:
 LEB_syrian_refugees: "Syrian Refugees"
 LEB_syrian_refugees_desc: "More than a million Syrians have fled across our border. Camps in the Bekaa and the north strain our schools, hospitals, and power grid, and every faction blames the others for letting them in."
 LEB_closed_syrian_crossings_tt: "Syria's supply line through Lebanon is closed for §Y180§! days."
 lebanon.1.t: "Syrian Refugees Cross the Border"
 lebanon.1.d: "The war in Syria has reached our border. Families fleeing the fighting are crossing into the Bekaa and Akkar by the thousands, and the UN says many more are coming. Hezbollah, the Future Movement, and the Christian parties all want something different."
 lebanon.1.a: "Keep the border open"
 lebanon.1.b: "Close the border"
 lebanon.2.t: "Convoys over the Qalamoun"
 lebanon.2.d: "Our army reports Syrian convoys crossing the Qalamoun mountains with Hezbollah escorts, carrying weapons to the regime's forces around Homs. Stopping them means confronting Hezbollah. Ignoring them makes us part of Syria's war."
 lebanon.2.a: "Look the other way"
 lebanon.2.b: "Send the army to the crossings"
 lebanon.10.t: "The October Revolution"
 lebanon.10.d: "A new tax on WhatsApp calls was the last straw. Hundreds of thousands of Lebanese of every sect have filled the streets of Beirut, Tripoli, and Tyre, demanding that the whole political class resign."
 lebanon.10.a: "The government resigns"
 lebanon.10.b: "Wait for the protests to fade"
 lebanon.11.t: "Explosion at the Port of Beirut"
 lebanon.11.d: "Thousands of tonnes of ammonium nitrate, left in a port warehouse for six years, have exploded. The blast tore through the center of Beirut, killed more than two hundred people, and left a crater where the grain silos stood."
 lebanon.11.a: "Accept international aid"
 lebanon.11.b: "Rebuild on our own"
