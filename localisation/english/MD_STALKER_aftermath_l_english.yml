l_english:
 STALKER.38.t: "The Zone's First Anniversary"
 STALKER.38.d_military: "One year after sealing the Zone, the cordon still holds around [event_target:STALKER_zone_event_target.GetName]. We can keep the anomalous territory under military control or permit licensed research inside its perimeter."
 STALKER.38.d_ward: "The Ward's 2022 intervention carried the Zone's influence beyond Ukraine, and its research consortium now wants a lasting mandate. We must choose between binding that work to common containment rules or widening access to the Zone."
 STALKER.38.d_stalkers: "Governments have struggled to contain the new Zones since the 2022 battle, while stalkers and local factions learned how to survive them. We can negotiate with those groups or restore emergency authority before the next emission."
 STALKER.38.d_default: "The Battle for the Zone is a year behind us, but the original Zone remains unstable. We must settle how much authority the state will retain and how far research can proceed."
 STALKER.38.a: "Maintain the military cordon."
 STALKER.38.a_tt: "Containment rises by up to §G10§! and Duty influence rises by up to §G5§!. Activity and Bandit influence each fall by up to §G10§!."
 STALKER.38.b: "License supervised research."
 STALKER.38.b_tt: "Exploitation rises by up to §G10§!, the stalker population rises by up to §G5§!, Freedom influence rises by up to §G5§!, and Duty influence falls by up to §G5§!."
 STALKER.38.c: "Adopt the Ward's containment protocols."
 STALKER.38.c_tt: "Duty influence and containment each rise by up to §G10§!. Bandit influence falls by up to §G10§! and exploitation falls by up to §G5§!."
 STALKER.38.d: "Expand the international research mandate."
 STALKER.38.d_tt: "Exploitation rises by up to §G10§!, the stalker population rises by up to §G5§!, Freedom influence rises by up to §G5§!, activity rises by up to §R5§!, and containment falls by up to §R5§!."
 STALKER.38.e: "Negotiate directly with stalker groups."
 STALKER.38.e_tt: "Freedom influence, the stalker population, and exploitation each rise by up to §G10§!, while containment falls by up to §R10§!."
 STALKER.38.f: "Restore emergency authority."
 STALKER.38.f_tt: "Duty influence rises by up to §G10§! and containment by up to §G15§!. Activity and the stalker population each fall by up to §G10§! and §G5§!, respectively."
 STALKER.38.g: "Preserve the current balance."
 STALKER.38.g_tt: "Containment rises by up to §G5§! and activity falls by up to §G5§!."