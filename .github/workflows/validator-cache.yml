name: Validator Cache (main)

# Builds the shared .validation_cache on main so every PR starts warm.
# Caches saved during pull_request runs are scoped to that PR's merge ref;
# only caches created here on refs/heads/main are visible to all PRs
# (restored by coding-pipeline.yml's prepare-workspace job).

on:
  push:
    branches: [main]
    paths:
      - "common/**"
      - "events/**"
      - "history/**"
      - "localisation/**"
      - "interface/**"
      - "gfx/flags/**"
      - "tools/**"
      - ".github/workflows/validator-cache.yml"
  # Nightly rebuild (07:00 UTC = 3 AM ET in summer, 2 AM in winter — cron is
  # UTC and does not track DST): keeps a warm cache for the next day's PRs
  # even on quiet days, absorbs the periodic cold rebuild when the disk
  # cache's 7-day staleness marker expires, and keeps GitHub's
  # 7-day-unused eviction from ever leaving PRs with no entry.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: validator-cache-main
  # Newest main state wins; cache commits are atomic, so a cancelled save
  # never becomes visible.
  cancel-in-progress: true

permissions:
  contents: read
  # actions: read lets the post-save step verify this run's entry exists.
  actions: read

jobs:
  build-cache:
    name: Build validator disk cache
    runs-on: ubuntu-latest
    steps:
      # Same union of directories as prepare-workspace in coding-pipeline.yml:
      # validators cache only what is present on disk, so a narrower checkout
      # would leave namespaces cold for every PR.
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          sparse-checkout: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            tools
            resources/documentation
            .claude

      # Snapshot the hash before the validator run litters tools/ with
      # __pycache__/ — hashFiles evaluated at save time would include the
      # .pyc files and produce a key no clean-checkout restore can match.
      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**',
          'tools/shared_utils.py') }}" >> "$GITHUB_OUTPUT"

      # Warm start from the previous entry: incremental rebuild instead of a
      # cold full scan. The primary key never exact-matches (saved keys carry
      # a run_id suffix); the restore-keys prefixes do the real matching,
      # newest entry first.
      - name: Restore previous validator disk cache
        # v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            md-valcache-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      - name: Set up Python
        # v6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      # Populates every cacheable validator's namespace. The manual texture
      # audit needs the full gfx tree, which this sparse checkout omits.
      # Non-strict findings on main exit 0, while a harness crash fails the job
      # and skips the save, leaving the previous night's entry in place for PRs.
      - name: Run cacheable validators (cache warm-up)
        run: >-
          python3 tools/validation/run_all_validators.py --no-color
          --persist-results .validation_baseline_candidate

      - name: Ensure validation result candidate directory exists
        run: mkdir -p .validation_baseline_candidate

      - name: Upload validation result candidate
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validation-baseline-candidate
          path: .validation_baseline_candidate/
          include-hidden-files: true
          if-no-files-found: ignore

      # run_id suffix: keys are immutable and the nightly scheduled run fires
      # on an unchanged sha — without it the rebuild could never save. PR
      # restores prefix-match the newest entry via restore-keys.
      - name: Save validator disk cache
        # v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}

      # cache/save only warns on failure; checking for THIS run's exact key
      # (not any md-valcache-v1-* survivor from a previous night) makes a
      # failed save a red run instead of PRs silently going cold.
      - name: Verify this run's cache entry exists
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_KEY: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}
        run: |
          cache_url="repos/${{ github.repository }}/actions/caches"
          cache_url="${cache_url}?key=$EXPECTED_KEY&per_page=1"
          count=$(gh api "$cache_url" --jq '.total_count')
          if [ "$count" -eq 0 ]; then
            echo "::error::Cache entry ${EXPECTED_KEY} was not saved"
            exit 1
          fi
          echo "Cache entry ${EXPECTED_KEY} confirmed"

  # ───────────────────────────────────────────────────────────────
  # Validation baseline — the nightly regression alarm for main itself.
  # Consumes the persisted candidate from build-cache and diffs its findings
  # against the previous night's baseline. New errors
  # fail the job and leave the old baseline in place, so the run stays red
  # every night until the regression is fixed. A validator-code change moves
  # the toolshash, which instead establishes a fresh baseline. The baseline
  # entry is what PR validation-report jobs restore to annotate NEW vs
  # EXISTING findings.
  # ───────────────────────────────────────────────────────────────
  check-baseline:
    name: Check validation baseline
    needs: [build-cache]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      # Same union as build-cache: validators only see what is on disk, so a
      # narrower checkout would produce a baseline missing whole namespaces.
      - name: Checkout code
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          sparse-checkout: |
            common
            events
            history
            localisation
            interface
            gfx/flags
            tools
            resources/documentation
            .claude

      - name: Compute validator code hash
        id: toolshash
        run: >-
          echo "hash=${{ hashFiles('tools/validation/**',
          'tools/shared_utils.py') }}" >> "$GITHUB_OUTPUT"

      # Previous night's baseline for the current validator generation. A
      # validator change moves the toolshash and the restore misses, which is
      # the re-establish signal: comparing across generations would report
      # every moved finding as new.
      - name: Restore previous validation baseline
        # v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_baseline
          key: >-
            md-baseline-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}
          restore-keys: |
            md-baseline-v1-${{ runner.os }}-${{ steps.toolshash.outputs.hash }}-

      # The warm cache build-cache saved for THIS run (run_id-suffixed exact
      # key) — a miss here is a real failure, not a graceful cold fallback.
      # Same-sha fallback keeps "Re-run failed jobs" recoverable: build-cache
      # may not re-run with the same run_id, but a same sha + same toolshash
      # entry holds identical content.
      - name: Restore validator disk cache
        # v6.1.0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_cache
          key: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}
          restore-keys: >-
            md-valcache-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-
          fail-on-cache-miss: true

      - name: Set up Python
        # v6
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Download validation result candidate
        # v8
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: validation-baseline-candidate
          path: .validation_baseline_candidate/

      - name: Verify validation result candidate completion
        run: test -f .validation_baseline_candidate/.persist-complete

      - name: Diff against previous baseline
        id: diff
        run: |
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          workflow_url="$workflow_url/actions/runs/$GITHUB_RUN_ID"
          python3 tools/baseline_check.py \
            --previous .validation_baseline \
            --current .validation_baseline_candidate \
            --output .validation_baseline \
            --toolshash "${{ steps.toolshash.outputs.hash }}" \
            --commit-sha "${{ github.sha }}" \
            --workflow-run-url "$workflow_url" \
            --github-repository "${{ github.repository }}"

      # Only a clean diff reaches this step: baseline_check exits 1 on new
      # errors, so a red night saves nothing and the previous baseline stays
      # the one PRs compare against.
      - name: Save validation baseline
        if: steps.diff.outcome == 'success'
        # v6.1.0
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .validation_baseline
          key: >-
            md-baseline-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}

      # cache/save only warns on failure; without this check a failed save
      # leaves the job green while PRs silently keep annotating against the
      # previous baseline (which may never advance). Mirrors build-cache's
      # verify step.
      - name: Verify this run's baseline entry exists
        if: steps.diff.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_KEY: >-
            md-baseline-v1-${{ runner.os }}-${{
            steps.toolshash.outputs.hash }}-${{ github.sha }}-${{
            github.run_id }}
        run: |
          cache_url="repos/${{ github.repository }}/actions/caches"
          cache_url="${cache_url}?key=$EXPECTED_KEY&per_page=1"
          count=$(gh api "$cache_url" --jq '.total_count')
          if [ "$count" -eq 0 ]; then
            echo "::error::Baseline entry ${EXPECTED_KEY} was not saved"
            exit 1
          fi
          echo "Baseline entry ${EXPECTED_KEY} confirmed"
