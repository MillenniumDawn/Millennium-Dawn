l_english:
 IRE_dublin_transport: "Dublin Transport"
 IRE_dublin_transport_desc: "Dublin's roads carry the commuter traffic of a booming economy with no metro and no rail link to the airport. Congestion slows growth across the greater Dublin area, cuts into the output of the city's offices, raises fuel use, and makes foreign firms think twice before placing their European headquarters here.\n§W--------------§!\nThe congestion penalties §RWorsen§! every year until §YMetroLink§! opens, also while it is being planned and built. They §GImprove§! with each finished stage of §YMetroLink§! and are §GRemoved§! when the §Y$IRE_metrolink_opening$§! decision completes. From then on, the line gives Leinster a productivity growth bonus."
 IRE_dublin_traffic_worsens: "Dublin Traffic Worsens"
 IRE_dublin_traffic_worsens_desc: "Every year without new transport capacity, more cars crowd onto the M50 and the city's arterial roads. Building §YMetroLink§! does not stop the decline. Only finished stages win back ground, and the opening of the line ends it"
 IRE_metrolink_planning: "Plan Metro North"
 IRE_metrolink_planning_desc: "Transport 21 sets out a metro from St Stephen's Green to Swords via Dublin Airport. The Railway Procurement Agency must design the route and prepare a Railway Order application."
 IRE_metrolink_revival: "Revive the Metro as MetroLink"
 IRE_metrolink_revival_desc: "The public finances have recovered. Transport Infrastructure Ireland can revive the shelved metro under a new name, reusing much of the original design work."
 IRE_metrolink_construction: "Bore the MetroLink Tunnels"
 IRE_metrolink_construction_desc: "Tunnel boring machines will drive twin bores under the city while stations are built at the airport, Glasnevin and the city centre. Boring will take §Y[?IRE_metrolink_bore_days|0]§! days."
 IRE_metrolink_opening: "Open MetroLink from Swords to the City"
 IRE_metrolink_opening_desc: "With the tunnels finished, the line must be fitted out, tested and handed over before the first passenger service runs."
 IRE_metrolink_is_open_tt: "§Y$IRE_metrolink_opening$§! has been completed"
 IRE_metrolink_reward_later: "When §Y$IRE_metrolink_opening$§! has been completed, we will gain:"
 IRE_metrolink_deferred: "The metro has been deferred"
 IRE_metrolink_deferred_tt: "§YMetroLink§! is §Rdeferred§! The situation will keep worse."
 IRE_metrolink_hearing_delay_tt: "The Railway Order hearing delay has ended."
 IRE_metrolink_hearing_delay_effect_tt: "§Y$IRE_metrolink_construction$§! is §Rdelayed§! for 180 days after planning ends."
 IRE_metrolink_final_works_tt: "All remaining works and delays on the line are finished."
 IRE_metrolink_deferral_cooldown_tt: "At least one year has passed since the metro was deferred."
 IRE_metrolink_cut_scope_tt: "The line will end in the city centre. The airport station and city interchange choices are dropped, and the opening grants a §Rsmaller§! productivity bonus. Boring takes §G90§! fewer days."
 IRE_metrolink_airport_bore_tt: "§Y$IRE_metrolink_construction$§! takes §R60§! more days."
 IRE_metrolink_interchange_bore_tt: "§Y$IRE_metrolink_construction$§! takes §R90§! more days."
 IRE_metrolink_drop_extension_tt: "§Y$IRE_metrolink_construction$§! takes §G120§! fewer days."
 IRE_metrolink_charlemont_reward_tt: "On opening, §YMetroLink§! grants the standard productivity growth bonus."
 IRE_metrolink_sandyford_reward_tt: "On opening, §YMetroLink§! grants a §Glarger§! productivity growth bonus. Residents along the Green Line may protest. Boring takes §R120§! more days."
 IRE_metrolink_no_extra_reward_tt: "No extra reward on opening."
 IRE_metrolink_overrun_delay_tt: "Opening is §Rdelayed§! by 120 days after construction ends."
 IRE_metrolink.1.t: "Objections to the Metro Route"
 IRE_metrolink.1.d: "Public consultation on the draft metro route has drawn objections from residents, businesses and heritage groups. The Railway Procurement Agency must settle the route before the Railway Order application goes to An Bord Pleanála."
 IRE_metrolink.1.a: "Pay to rework the contested sections"
 IRE_metrolink.1.b: "Accept a longer Railway Order hearing"
 IRE_metrolink.1.c: "End the line in the city centre"
 IRE_metrolink.2.t: "Metro Deferred"
 IRE_metrolink.2.d: "With the public finances under severe strain, the Department of Finance wants the metro shelved. Cabinet must decide whether a multi-billion euro tunnel is affordable now."
 IRE_metrolink.2.a: "Defer the project"
 IRE_metrolink.2.b: "Press on regardless"
 IRE_metrolink.3.t: "A Station for Dublin Airport"
 IRE_metrolink.3.d: "The airport authority proposes building the metro station beneath the terminals, tied into a wider expansion of the airport. A basic station on the airport's edge would cost far less."
 IRE_metrolink.3.a: "Build an integrated terminal station"
 IRE_metrolink.3.b: "Build a basic station"
 IRE_metrolink.4.t: "The City-Centre Interchange"
 IRE_metrolink.4.d: "Planners want the metro to meet DART Underground at a shared city-centre station, linking the line to the national rail network. The interchange would add cost and months to the works."
 IRE_metrolink.4.a: "Build the interchange"
 IRE_metrolink.4.b: "Keep the metro separate"
 IRE_metrolink.5.t: "Where Should the Line End?"
 IRE_metrolink.5.d: "The line can stop at Charlemont, or continue south by converting the Luas Green Line to Sandyford. The extension would serve far more commuters, but would close the Green Line for years."
 IRE_metrolink.5.a: "End the line at Charlemont"
 IRE_metrolink.5.b: "Extend the line to Sandyford"
 IRE_metrolink.6.t: "Ranelagh Residents Protest"
 IRE_metrolink.6.d: "Residents and traders in Ranelagh are protesting the planned Green Line closure and the loss of local road crossings. Local TDs are under pressure to drop the extension."
 IRE_metrolink.6.a: "Push the extension through"
 IRE_metrolink.6.b: "Fund compensation for residents"
 IRE_metrolink.6.c: "Drop the extension"
 IRE_metrolink.7.t: "MetroLink Costs Overrun"
 IRE_metrolink.7.d: "Ground conditions under the city are worse than surveyed, and the contractors have submitted claims well above the budget. The work cannot continue without more money or a slower schedule."
 IRE_metrolink.7.a: "Pay the overrun"
 IRE_metrolink.7.b: "Borrow to cover it"
 IRE_metrolink.7.c: "Slow the works"
 IRE_metrolink.8.t: "MetroLink Opens"
 IRE_metrolink.8.d: "The first MetroLink trains have carried passengers from Swords through Dublin Airport to the city centre. For the first time, the capital has a rail link to its airport."
 IRE_metrolink.8.a: "Next stop, the future"
