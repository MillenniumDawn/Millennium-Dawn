 CHI_infantry_general: "General de infantería"
 CHI_infantry_general_desc: "El general Shin Fai ascendió en las filas de las Fuerzas Terrestres del Ejército Popular de Liberación como especialista en operaciones de infantería a gran escala. Comanda formaciones masivas de la Guardia Roja e infantería de asalto con énfasis en el despliegue rápido y la superioridad numérica."
