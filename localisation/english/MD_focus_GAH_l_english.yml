l_english:
 # Western Togoland Rebellion
 ghana.1.t: "Western Togoland Declares Sovereignty"
 ghana.1.d: "For weeks, signs welcoming travellers to \"Western Togoland\" have stood along the roads of the Volta Region and nobody saw who raised them. Now the Western Togoland Restoration Front, heir to the Ewe movements that voted against union with the Gold Coast in 1956, has proclaimed the former British Togoland a sovereign state and demands talks under United Nations auspices. The regional chiefs are silent, and our security services admit they saw none of it coming."
 ghana.1.a: "Send a joint military and police operation into the region."
 ghana.1.b: "Open talks through the Volta Regional House of Chiefs."
 ghana.1.c: "A handful of signposts. Ignore them."
 ghana.2.t: "Attacks Across the Volta Region"
 ghana.2.d: "Twelve hours after posting photographs of five hundred freshly trained recruits, the separatists struck before dawn. They broke into an armoury, stormed the police stations at Aveyime and Mepe, freed the inmates and drove off with rifles and police pick-ups. Three officers are held hostage, among them the district commander. Heaps of sand and burning tyres block every road into the region, two radio stations are in separatist hands, and the police have been given twenty-four hours to leave."
 ghana.2.a: "Sweep the region, recover the weapons, fly the suspects to Accra."
 ghana.2.b: "Open talks with the chiefs and the Homeland Study Group."
 ghana.2.c: "Declare a state of emergency across the Volta Region."
 ghana.3.t: "The Volta Region Falls Quiet"
 ghana.3.d: "The roads are clear and the four thousand Dragons promised in the separatists' video never marched. Dozens of suspects sit in custody in Accra, the Regional House of Chiefs has disowned the movement as criminals, and soldiers will guard the polling stations in December. What remains is a question for the courts."
 ghana.3.a: "Prosecute the ringleaders for treason."
 ghana.3.b: "Release them on bail, as in 2019, and move on."
 ghana.4.t: "The Dragons Return"
 ghana.4.d: "The men in the video were not all invention. Small armed bands calling themselves the Dragons of Western Togoland have crossed back from Togo, ambushing a police patrol in the Eastern Region and robbing a bank branch in Hohoe. The Volta chiefs, who disowned the movement last year, now say the arrests and raids have done the recruiting for it."
 ghana.4.a: "Hunt them down, border to border."
 ghana.4.b: "Amnesty, and a development package for the Volta Region."
 ghana.5.t: "The Volta Rises"
 ghana.5.d: "This time the flags stay up. Armed Dragons hold Ho and the roads to the Togolese border, the district administrations have fled, and the Restoration Front declares that Western Togoland will be defended. Our regular army watches from its barracks while hastily raised volunteer militias move on the region."
 ghana.5.a: "Then we will take it back."
 ghana.6.t: "Settling the Volta Question"
 ghana.6.d: "Three months of skirmishing between militias have emptied villages along the Volta and filled the hospitals in Ho. The Dragons cannot take the country and we cannot make the region love us at gunpoint. The chiefs offer to broker a settlement, and the generals offer to end it."
 ghana.6.a: "Finish it by force."
 ghana.6.b: "An autonomous Volta Region inside Ghana."
 ghana.7.t: "The Volta Accord"
 ghana.7.d: "Two rounds of talks with the Regional House of Chiefs have done what no raid could. The Homeland Study Group has renounced armed struggle, the Restoration Front's recruits have gone home, and the chiefs bring a draft to Accra: a statute of regional autonomy for the Volta Region, inside Ghana and under its flag."
 ghana.7.a: "Sign the statute of regional autonomy."
 ghana.7.b: "Thank the chiefs and leave the constitution alone."
 ghana_news.1.t: "Separatists Attack Police in Ghana's Volta Region"
 ghana_news.1.d: "Gunmen of the Western Togoland Restoration Front have raided an armoury and two police stations in eastern Ghana, blocked the roads into the Volta Region and declared the former British Togoland a sovereign state. Accra has sent a joint military and police force to restore order in one of Africa's steadiest democracies."
 ghana_news.1.a: "An old border question resurfaces."
 ghana_news.2.t: "Militia War in Ghana's Volta Region"
 ghana_news.2.d: "Fighting has broken out between Ghanaian volunteer militias and the self-styled Dragons of Western Togoland, who hold Ho and the roads to the Togolese border. Neither side has committed its regular army, but the Volta Region is a war zone and refugees are crossing into Togo."
 ghana_news.2.a: "Ghana was supposed to be the stable one."
 ghana_news.3.t: "Ghana Settles the Volta Question"
 ghana_news.3.d: "The Western Togoland crisis is over. Accra has reasserted control of the Volta Region and the separatist leadership is in custody or in exile. Whether the settlement holds will depend on what the region was promised."
 ghana_news.3.a: "Peace returns to the Volta."
