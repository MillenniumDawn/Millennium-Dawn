 ukraine_equipment_develop_domestic_atgm.12.desc: "[GEO.GetNameWithFlag]의 협상단이 우리 §Y'스키프'§! 대전차 유도 미사일을 구매하기로 합의했습니다. 첫 물량의 규모와 해당 체계를 라이선스 생산하도록 허용할지는 우리가 정할 수 있습니다."
