 bolivia_tourism_income_TT:0 "Receita adicional de +§G0.50§! do §YTurismo Boliviano§!"
 bolivia_misc.1.t:0 "Referendo Nacional sobre o Gás"
 bolivia_misc.1.d:0 "O governo boliviano convocou um referendo sobre a questão das exportações de gás, uma de nossas indústrias mais lucrativas. Elementos do leste da Bolívia, de maioria mestiça, apoiam mais exportações de gás, enquanto as comunidades indígenas propõem maior foco no desenvolvimento social, tornando este referendo um em que as divisões étnicas da Bolívia ficam absolutamente claras."
 bolivia_misc.1.a:0 "O dinheiro do petróleo deve ir para o desenvolvimento"
 bolivia_misc.1.b:0 "As exportações de petróleo melhorarão nossa posição"
 bolivia_ethnic.1.t:0 "As Forças Armadas Bolivianas Exigem a Renúncia do Nosso Governo"
 bolivia_ethnic.1.d:0 "Com o recente pico de tensões com a maioria mestiça do leste da Bolívia e os protestos recentes, o chefe do estado-maior das Forças Armadas Bolivianas exigiu a renúncia do nosso governo e a instalação de um novo governo interino liderado pelo [conservatism_L] pró-mestiço, que conduzirá a Bolívia a novas eleições, afirmando ainda que a recusa levará a consequências drásticas. Embora ceder leve ao enfraquecimento das instituições democráticas, ao menos evitará a repetição das muitas ditaduras militares da Bolívia, que terminaram em 1982. Contudo, também não devemos permitir que o Exército intervenha na política, e podemos tentar resistir às suas pressões, o que, no entanto, pode levar a consequências drásticas. Qualquer que seja a escolha, ela afetará drasticamente o futuro da Bolívia."
 bolivia_ethnic.1.a:0 "Nosso tempo acabou, temos que renunciar"
 bolivia_ethnic.1.b:0 "Não voltaremos ao passado!"
 bolivia_ethnic.2.t:0 "As Forças Armadas Bolivianas Marcham sobre La Paz"
 bolivia_ethnic.2.d:0 "Após nossa decisão de recusar o ultimato dos militares, eles tomaram as coisas em suas próprias mãos, marchando com unidades militares até La Paz e assumindo o controle do Palácio Presidencial e do Congresso. As Forças Armadas declararam estado de emergência e também declararam que 'restaurarão o lugar legítimo da Bolívia na América Latina'. Embora tenham prometido que a democracia voltará, parece improvável que os Militares pretendam cumprir."
 bolivia_ethnic.2.a:0 "A Bolívia está salva dos índios!"
 bolivia_news.1.t:0 "Governo Boliviano Renuncia Após Pressão Militar"
 bolivia_news.1.d:0 "Diante das recentes tensões entre o governo boliviano pró-indígena e a maioria da população étnica mestiça do leste da Bolívia, as Forças Armadas Bolivianas emitiram um ultimato, exigindo a renúncia do governo e a instalação de um novo governo interino liderado por proeminentes partidos de oposição pró-mestiços, que conduzirá o país a novas eleições. Temendo um novo regime militar como os do passado, o governo cedeu e renunciou, e [BOL.GetLeader] tomou posse depois como o novo presidente interino da Bolívia. Embora [BOL.GetLeader] afirme que o novo governo está restaurando o regime democrático, muitos comentaristas concordam que o novo governo adotou uma postura duramente anti-indígena, com muitos relatos de uso de força pelas Forças Armadas Bolivianas contra protestos indígenas."
 bolivia_news.1.a:0 "Um dia ruim para a democracia"
 bolivia_news.2.t:0 "Forças Armadas Bolivianas Derrubam o Governo da Bolívia em Golpe Militar"
 bolivia_news.2.d:0 "Diante das recentes tensões entre o governo boliviano pró-indígena e a maioria da população étnica mestiça do leste da Bolívia, as Forças Armadas Bolivianas emitiram um ultimato, exigindo a renúncia do governo e a instalação de um novo governo interino liderado por proeminentes partidos de oposição pró-mestiços, que conduzirá o país a novas eleições. Temendo um novo regime militar como os do passado, o governo se recusou a ceder e, em vez disso, os militares invadiram a capital, La Paz, tomando o palácio presidencial e o congresso. Depois, os militares declararam estado de emergência e afirmaram que 'restaurarão o lugar legítimo da Bolívia na América Latina', o que muitos comentaristas concordam que aumentará as tensões regionais e também mancha o histórico da democracia boliviana, que viveu o 191º golpe desde sua declaração de independência em 1825, sendo o último em 1980. "
 bolivia_news.2.a:0 "Parece que esses caras nunca se cansam de golpes"
 BOL_economic_reforms:0 "Reformas Econômicas Bolivianas"
 BOL_economic_reforms_desc:0 "Nossa economia exige reformas urgentes e profundas para estabilizar o crescimento e reduzir as ineficiências estruturais. Por meio de mudanças de políticas e institucionais, podemos lançar as bases para o desenvolvimento de longo prazo e um futuro mais equitativo."
 BOL_public_debt_reduction:0 "Redução da Dívida Pública"
 BOL_public_debt_reduction_desc:0 "A dívida pública da Bolívia tornou-se insustentável e ameaça nossa independência econômica. Cortando gastos excessivos e negociando condições, buscamos recuperar o equilíbrio fiscal."
 BOL_strengthen_the_boliviano:0 "Fortalecer o Boliviano"
 BOL_strengthen_the_boliviano_desc:0 "O Boliviano deve ser reforçado como símbolo de nossa estabilidade econômica. Reformas cambiais e uma política monetária mais rígida ajudarão a restaurar a confiança dentro e fora do país."
 BOL_national_development_plan:0 "Um Plano Nacional de Desenvolvimento"
 BOL_national_development_plan_desc:0 "Devemos coordenar nossos recursos e ambições sob uma estratégia de desenvolvimento unificada. Este plano orientará a infraestrutura, a agricultura e a expansão industrial pelas próximas décadas."
 BOL_bolivian_agriculture:0 "Agricultura Boliviana"
 BOL_bolivian_agriculture_desc:0 "A agricultura continua sendo a força vital da nossa economia rural. Apoiar os agricultores e ampliar a produtividade das terras cultiváveis é essencial para a prosperidade nacional."
 BOL_increase_credit_for_farmers:0 "Aumentar o Crédito para Agricultores"
 BOL_increase_credit_for_farmers_desc:0 "Muitos agricultores não têm as ferramentas financeiras para expandir ou modernizar suas operações. Linhas de crédito garantidas pelo Estado fortalecerão as comunidades rurais e estimularão a produção de alimentos."
 BOL_improve_agricultural_technology:0 "Melhorar a Tecnologia Agrícola"
 BOL_improve_agricultural_technology_desc:0 "Ferramentas e métodos ultrapassados seguram nossas fazendas. Investiremos em técnicas modernas, treinamento e maquinário para aumentar a produtividade e a eficiência."
 BOL_fight_contraband_imports:0 "Combater Importações de Contrabando"
 BOL_fight_contraband_imports_desc:0 "Importações ilícitas prejudicam os produtores nacionais e danificam nossa economia. Uma fiscalização mais forte nas fronteiras e reformas na alfândega ajudarão a proteger a indústria local."
 BOL_cash_crop_development_initiatives:0 "Iniciativas de Desenvolvimento de Culturas Comerciais"
 BOL_cash_crop_development_initiatives_desc:0 "Ao focar em culturas comerciais de alto valor, podemos transformar a agricultura em uma potência exportadora. Investimentos estratégicos gerarão novas fontes de renda para os agricultores e para o Estado."
 BOL_bolivian_food_industry:0 "Reforçar a Indústria Alimentícia Boliviana"
 BOL_bolivian_food_industry_desc:0 "Uma indústria alimentícia robusta garante a segurança alimentar e agrega valor à nossa produção agrícola. Devemos apoiar as cadeias de processamento, embalagem e distribuição em toda a Bolívia."
 BOL_modern_and_productive_agriculture:0 "Uma Agricultura Moderna e Produtiva"
 BOL_modern_and_productive_agriculture_desc:0 "Pretendemos modernizar totalmente a agricultura boliviana e liberar seu potencial econômico. Por meio da inovação e da infraestrutura, alcançaremos autossuficiência e crescimento."
 BOL_national_referendum_on_gas:0 "Referendo Nacional sobre o Gás"
 BOL_national_referendum_on_gas_desc:0 "O gás é um de nossos maiores ativos nacionais, e seu futuro deve ser decidido democraticamente. Um referendo determinará se continuamos com a privatização ou se afirmamos maior controle estatal."
 BOL_oil_money_for_development:0 "Dinheiro do Petróleo para o Desenvolvimento"
 BOL_oil_money_for_development_desc:0 "A receita do gás e do petróleo deve servir ao povo boliviano. Redirecionar os lucros para saúde, educação e infraestrutura garantirá que nossa riqueza natural beneficie todos os cidadãos."
 BOL_prioritize_social_development:0 "Priorizar o Desenvolvimento Social"
 BOL_prioritize_social_development_desc:0 "Devemos reduzir a desigualdade e elevar o padrão de vida. Os programas de desenvolvimento social terão como alvo educação, moradia e mobilidade social."
 BOL_prioritize_healthcare_development:0 "Priorizar o Desenvolvimento da Saúde"
 BOL_prioritize_healthcare_development_desc:0 "O sistema de saúde da Bolívia precisa de atenção urgente. Investimentos em hospitais, formação e clínicas rurais salvarão vidas e construirão uma nação mais saudável."
 BOL_prioritize_infrastructure_development:0 "Priorizar o Desenvolvimento da Infraestrutura"
 BOL_prioritize_infrastructure_development_desc:0 "Uma infraestrutura moderna é essencial para o crescimento econômico. Ampliaremos estradas, redes elétricas e sistemas de água para conectar e fortalecer nossas comunidades."
 BOL_bring_the_ypfd_under_state_control:0 "Colocar a YPFB sob Controle Estatal"
 BOL_bring_the_ypfd_under_state_control_desc:0 "Os Yacimientos Petrolíferos Fiscales Bolivianos devem servir ao interesse público. Ao nacionalizar suas operações, recuperamos a soberania sobre nosso setor energético."
 BOL_reinforce_gas_exports:0 "Reforçar as Exportações de Gás"
 BOL_reinforce_gas_exports_desc:0 "As exportações de gás continuam sendo um pilar da nossa economia. Melhorar gasodutos, acordos e capacidade de produção aumentará a receita e a influência regional."
 BOL_invite_gazprom:0 "Convidar a Gazprom"
 BOL_invite_gazprom_desc:0 "A cooperação com a Gazprom nos oferece conhecimento técnico e investimento estrangeiro. Uma parceria estratégica poderia elevar nosso setor de gás a novos patamares."
 BOL_invite_exxonmobil:0 "Convidar a ExxonMobil"
 BOL_invite_exxonmobil_desc:0 "Ao atrair a ExxonMobil, trazemos um dos gigantes mundiais da energia para a Bolívia. Tal medida promete capital, inovação e prestígio internacional."
 BOL_invite_cnpc:0 "Convidar a CNPC"
 BOL_invite_cnpc_desc:0 "A China National Petroleum Corporation traz experiência e recursos abundantes. Trabalhar com ela poderia abrir novos mercados e fortalecer laços globais."
 BOL_modernize_bolivian_oil_extraction:0 "Modernizar a Extração de Petróleo Boliviana"
 BOL_modernize_bolivian_oil_extraction_desc:0 "Nossas técnicas de extração de petróleo são ultrapassadas e ineficientes. Modernizar as instalações e adotar novas tecnologias aumentará a produção e reduzirá o impacto ambiental."
 BOL_bolivian_manufacturing:0 "Manufatura Boliviana"
 BOL_bolivian_manufacturing_desc:0 "Construir um setor manufatureiro forte é fundamental para a independência econômica da Bolívia. Pretendemos fomentar o crescimento industrial, criar empregos e produzir bens para os mercados interno e de exportação."
 BOL_cooperation_with_motor_companies:0 "Cooperação com Montadoras"
 BOL_cooperation_with_motor_companies_desc:0 "Parcerias com montadoras de veículos podem impulsionar a indústria automotiva da Bolívia. Essas colaborações trarão investimento, conhecimento e tecnologia para nossa economia em crescimento."
 BOL_expand_the_cement_industry:0 "Expandir a Indústria do Cimento"
 BOL_expand_the_cement_industry_desc:0 "O cimento é essencial para a construção e a infraestrutura. Expandir essa indústria apoiará projetos de construção e criará novas oportunidades de emprego."
 BOL_towards_a_construction_boom:0 "Rumo a um Boom da Construção"
 BOL_towards_a_construction_boom_desc:0 "Um aumento na atividade de construção estimulará o crescimento econômico e melhorará o padrão de vida. O aumento de investimentos em moradia e obras públicas é vital."
 BOL_tax_breaks_for_small_manufacturers:0 "Isenções Fiscais para Pequenos Fabricantes"
 BOL_tax_breaks_for_small_manufacturers_desc:0 "Os pequenos fabricantes enfrentam muitos obstáculos financeiros. Oferecer incentivos fiscais estimulará o empreendedorismo e ajudará os negócios locais a prosperar."
 BOL_counter_black_market_goods:0 "Combater Bens do Mercado Negro"
 BOL_counter_black_market_goods_desc:0 "Bens ilegais inundam nossos mercados e prejudicam negócios legítimos. Uma fiscalização mais forte e campanhas de conscientização pública ajudarão a conter o mercado negro."
 BOL_world_class_textile_production:0 "Produção Têxtil de Classe Mundial"
 BOL_world_class_textile_production_desc:0 "A Bolívia tem potencial para se tornar líder na manufatura têxtil. Investir em qualidade e inovação pode abrir novos mercados em todo o mundo."
 BOL_bolivian_mining:0 "Mineração Boliviana"
 BOL_bolivian_mining_desc:0 "A mineração é a espinha dorsal da economia boliviana, fornecendo minerais valiosos e empregos. Modernizar o setor aumentará a produção e garantirá práticas sustentáveis."
 BOL_increase_comibol_funding:0 "Aumentar o Financiamento da COMIBOL"
 BOL_increase_comibol_funding_desc:0 "A mineradora estatal COMIBOL precisa de mais recursos para cumprir sua missão. Mais financiamento impulsionará a produção e melhorará a segurança dos trabalhadores."
 BOL_invite_foreign_mining_companies:0 "Convidar Mineradoras Estrangeiras"
 BOL_invite_foreign_mining_companies_desc:0 "O investimento estrangeiro pode trazer tecnologia e capital para o nosso setor de mineração. Parcerias estratégicas aumentarão a competitividade e o crescimento."
 BOL_export_bolivian_resources:0 "Exportar Recursos Bolivianos"
 BOL_export_bolivian_resources_desc:0 "A Bolívia deve ampliar suas exportações de recursos para aumentar a renda externa. Melhorar a logística e as relações comerciais é fundamental para o sucesso."
 BOL_el_muton_iron_mine:0 "A Mina de Ferro El Mutún"
 BOL_el_muton_iron_mine_desc:0 "Desenvolver a mina de ferro El Mutún impulsionará a produção nacional de aço. Este projeto é a pedra angular de nossas ambições industriais."
 BOL_exploit_lithium_deposits:0 "Explorar os Depósitos de Lítio"
 BOL_exploit_lithium_deposits_desc:0 "A Bolívia possui algumas das reservas de lítio mais ricas do mundo. A extração responsável nos posicionará como um ator-chave no mercado global de baterias."
 BOL_improve_miners_working_conditions:0 "Melhorar as Condições de Trabalho dos Mineiros"
 BOL_improve_miners_working_conditions_desc:0 "A segurança e o bem-estar de nossos mineiros devem ser priorizados. Modernizar as instalações e aplicar as regulamentações protegerá os trabalhadores e suas famílias."
 BOL_expanding_our_economic_potential:0 "Expandindo Nosso Potencial Econômico"
 BOL_expanding_our_economic_potential_desc:0 "Diversificar e fortalecer nossa economia criará prosperidade duradoura. Investimentos estratégicos e inovação abrirão novas oportunidades de crescimento."
 BOL_foundations_for_it_development:0 "Fundamentos para o Desenvolvimento de TI"
 BOL_foundations_for_it_development_desc:0 "A Bolívia deve construir as bases de um setor moderno de tecnologia da informação. Apoiar a educação e a infraestrutura fomentará a inovação e o crescimento digital."
 BOL_electronics_production:0 "Produção de Eletrônicos"
 BOL_electronics_production_desc:0 "Produzir eletrônicos internamente reduzirá as importações e construirá conhecimento de alta tecnologia. Esse setor pode impulsionar o desenvolvimento econômico futuro e a criação de empregos."
 BOL_becoming_an_investment_hub:0 "Tornando-se um Polo de Investimentos"
 BOL_becoming_an_investment_hub_desc:0 "Criar um ambiente favorável aos investidores atrairá capital e tecnologia. Pretendemos nos tornar um centro regional de negócios e inovação."
 BOL_reinforce_energy_production:0 "Reforçar a Produção de Energia"
 BOL_reinforce_energy_production_desc:0 "Energia confiável é a base da indústria e do progresso. Expandir a capacidade de produção atenderá à demanda crescente e apoiará o desenvolvimento."
 BOL_invest_into_windfarms:0 "Investir em Parques Eólicos"
 BOL_invest_into_windfarms_desc:0 "A energia eólica oferece à Bolívia uma fonte de energia limpa e renovável. Investir em parques eólicos diversificará a energia e reduzirá o impacto ambiental."
 BOL_hydroelectricity_production:0 "Produção de Hidreletricidade"
 BOL_hydroelectricity_production_desc:0 "Aproveitar nossos rios para energia hidrelétrica é vital para uma energia sustentável. Expandir esse setor melhorará o fornecimento e reduzirá as emissões."
 BOL_end_the_rentier_state:0 "Acabar com o Estado Rentista"
 BOL_end_the_rentier_state_desc:0 "Depender de rendas de recursos enfraquece a resiliência da nossa economia. Devemos diversificar para criar uma economia mais sustentável e equilibrada."
 BOL_beauty_of_the_andes:0 "A Beleza dos Andes"
 BOL_beauty_of_the_andes_desc:0 "Nossas majestosas montanhas dos Andes são um tesouro natural. Promovê-las de forma responsável pode impulsionar o turismo e o orgulho nacional."
 BOL_improve_public_transportation:0 "Melhorar o Transporte Público"
 BOL_improve_public_transportation_desc:0 "Um transporte público eficiente conecta comunidades e reduz congestionamentos. Modernizar nossas redes melhorará a qualidade de vida e a atividade econômica."
 BOL_urban_policing_initiative:0 "Iniciativa de Policiamento Urbano"
 BOL_urban_policing_initiative_desc:0 "Um policiamento mais forte e voltado à comunidade pode melhorar a segurança em nossas cidades. Reformas e investimentos construirão confiança e reduzirão o crime."
 BOL_promote_sustainable_tourism:0 "Promover o Turismo Sustentável"
 BOL_promote_sustainable_tourism_desc:0 "O patrimônio natural e cultural da Bolívia pode impulsionar o crescimento do turismo sustentável. Promover viagens ecológicas apoia as comunidades locais e protege nosso meio ambiente."
 BOL_revive_tungsten_production:0 "Reviver a Produção de Tungstênio"
 BOL_revive_tungsten_production_desc:0 "O tungstênio é um recurso estratégico valioso. Revitalizar sua produção aumentará as receitas da mineração e apoiará a indústria nacional."
 BOL_the_andean_miracle:0 "O Milagre Andino"
 BOL_the_andean_miracle_desc:0 "A transformação da Bolívia nas últimas décadas é nada menos que milagrosa. Crescimento econômico, progresso social e estabilidade política definem esta nova era."
 BOL_fuerzas_armadas_de_bolivia: "Fuerzas Armadas De Bolivia"
 BOL_fuerzas_armadas_de_bolivia_desc:0 "As Forças Armadas da Bolívia protegem nossa soberania e preservam a unidade nacional. Modernização e profissionalismo são essenciais para os desafios futuros."
 BOL_ejercito_de_bolivia: "Ejército De Bolivia"
 BOL_ejercito_de_bolivia_desc:0 "Nosso exército é a espinha dorsal da defesa nacional. Fortalecer suas capacidades e prontidão garante a segurança de nossas fronteiras e de nosso povo."
 BOL_focus_on_mass_assault_tactics:0 "Focar em Táticas de Assalto em Massa"
 BOL_focus_on_mass_assault_tactics_desc:0 "As táticas de assalto em massa enfatizam esmagar as forças inimigas com grandes concentrações de tropas. Essa estratégia depende de mão de obra e coordenação para alcançar a vitória."
 BOL_expand_conscription:0 "Expandir a Conscrição"
 BOL_expand_conscription_desc:0 "Expandir a conscrição aumenta nosso contingente de soldados treinados. Isso garante mão de obra suficiente para defender a nação e responder a ameaças."
 BOL_expand_military_infrastructure:0 "Expandir a Infraestrutura Militar"
 BOL_expand_military_infrastructure_desc:0 "Construir novas bases, centros de treinamento e polos logísticos fortalece nossa capacidade militar. Melhorias de infraestrutura apoiam a eficiência operacional."
 BOL_focus_on_military_morale:0 "Focar no Moral Militar"
 BOL_focus_on_military_morale_desc:0 "Um moral elevado é crucial para a eficácia em combate. Investir no bem-estar dos soldados, na liderança e no espírito de corpo eleva o ânimo de luta."
 BOL_expand_artillery_units:0 "Expandir as Unidades de Artilharia"
 BOL_expand_artillery_units_desc:0 "A artilharia fornece poder de fogo vital no campo de batalha. Aumentar as unidades de artilharia melhora as capacidades ofensivas e defensivas do nosso exército."
 BOL_an_army_of_the_masses:0 "Um Exército das Massas"
 BOL_an_army_of_the_masses_desc:0 "Um exército grande e bem treinado pode dissuadir agressões e proteger a soberania. Construir um exército de massas exige compromisso com treinamento e recursos."
 BOL_expand_the_escuela_de_condores:0 "Expandir a Escuela De Condores"
 BOL_expand_the_escuela_de_condores_desc:0 "A Escola Condores treina soldados bolivianos de elite. Expandi-la desenvolverá mais forças especiais para enfrentar desafios complexos de segurança."
 BOL_form_specops_brigades:0 "Formar Brigadas de Forças Especiais"
 BOL_form_specops_brigades_desc:0 "As brigadas de forças especiais conduzem missões de alto risco que exigem habilidades avançadas. Formar essas unidades aumenta a flexibilidade tática da Bolívia."
 BOL_military_mechanization:0 "Mecanização Militar"
 BOL_military_mechanization_desc:0 "Mecanizar a infantaria melhora a mobilidade e o poder de fogo. Essa transição moderniza o exército e aumenta a eficácia no campo de batalha."
 BOL_abolish_conscription:0 "Abolir a Conscrição"
 BOL_abolish_conscription_desc:0 "Acabar com a conscrição leva as forças armadas a uma força profissional voluntária. Isso pode melhorar a qualidade, mas reduz a disponibilidade de mão de obra."
 BOL_quality_over_quantity:0 "Qualidade em Vez de Quantidade"
 BOL_quality_over_quantity_desc:0 "Focar em uma força menor e mais bem equipada aumenta a eficácia em combate. O treinamento e o equipamento moderno são priorizados em vez de números brutos."
 BOL_a_cost_effective_army:0 "Um Exército Econômico"
 BOL_a_cost_effective_army_desc:0 "Manter forças armadas enxutas e eficientes garante responsabilidade fiscal. Um orçamento inteligente permite equilibrar as necessidades de defesa com as realidades econômicas."
 BOL_modernizing_our_equipment:0 "Modernizando Nosso Equipamento"
 BOL_modernizing_our_equipment_desc:0 "Atualizar armas e equipamentos mantém nossas forças competitivas. Equipamentos modernos melhoram a capacidade de sobrevivência e o poder de combate."
 BOL_develop_bolivian_military_industry:0 "Desenvolver a Indústria Militar Boliviana"
 BOL_develop_bolivian_military_industry_desc:0 "Estabelecer uma indústria bélica nacional reduz a dependência de importações. Isso fortalece a soberania e cria empregos."
 BOL_cooperate_with_foreign_arms_companies:0 "Cooperar com Empresas de Armamento Estrangeiras"
 BOL_cooperate_with_foreign_arms_companies_desc:0 "Parcerias com empresas internacionais de armamento aceleram a transferência de tecnologia. Essas colaborações melhoram nossas capacidades militares."
 BOL_tackle_military_corruption:0 "Combater a Corrupção Militar"
 BOL_tackle_military_corruption_desc:0 "A corrupção prejudica a eficácia e o moral militar. Reformas e fiscalização rigorosas restauram a confiança e a disciplina."
 BOL_elite_officer_training:0 "Treinamento de Oficiais de Elite"
 BOL_elite_officer_training_desc:0 "Oficiais altamente qualificados são fundamentais para o sucesso no campo de batalha. Programas de treinamento especializados constroem liderança e conhecimento estratégico."
 BOL_an_army_for_the_future:0 "Um Exército para o Futuro"
 BOL_an_army_for_the_future_desc:0 "Devemos preparar as forças armadas para enfrentar ameaças e tecnologias futuras. Inovação e adaptabilidade são centrais para essa visão."
 BOL_fuerza_aerea_boliviana: "Fuerza Aerea Boliviana"
 BOL_fuerza_aerea_boliviana_desc:0 "Nossa Força Aérea defende o espaço aéreo boliviano e apoia as forças terrestres. Reforçá-la aumenta a segurança nacional."
 BOL_purchase_american_aircraft:0 "Comprar Aeronaves Americanas"
 BOL_purchase_american_aircraft_desc:0 "Adquirir aeronaves dos Estados Unidos proporciona tecnologia avançada e confiabilidade comprovada. Isso fortalece nossas capacidades aéreas."
 BOL_purchase_chinese_aircraft:0 "Comprar Aeronaves Chinesas"
 BOL_purchase_chinese_aircraft_desc:0 "As aeronaves chinesas oferecem opções econômicas e sofisticação tecnológica crescente. Diversificar os fornecedores amplia as parcerias estratégicas."
 BOL_purchase_russian_aircraft:0 "Comprar Aeronaves Russas"
 BOL_purchase_russian_aircraft_desc:0 "As aeronaves russas trazem projetos robustos e bom desempenho. A cooperação aumenta a versatilidade da nossa força aérea."
 BOL_improve_air_defense_infrastructure:0 "Melhorar a Infraestrutura de Defesa Aérea"
 BOL_improve_air_defense_infrastructure_desc:0 "Fortalecer os sistemas de defesa aérea protege ativos críticos e centros populacionais. As melhorias reduzem a vulnerabilidade a ameaças aéreas."
 BOL_close_air_support:0 "Apoio Aéreo Aproximado"
 BOL_close_air_support_desc:0 "O apoio aéreo aproximado aumenta a eficácia das forças terrestres em combate. Integrar operações aéreas e terrestres é vital para o sucesso no campo de batalha."
 BOL_a_new_world_class_academy:0 "Uma Nova Academia de Classe Mundial"
 BOL_a_new_world_class_academy_desc:0 "Estabelecer uma academia militar de classe mundial formará os futuros líderes. Esta instituição definirá padrões de excelência."
 BOL_dominate_the_skies:0 "Dominar os Céus"
 BOL_dominate_the_skies_desc:0 "Alcançar superioridade aérea é essencial na guerra moderna. Investiremos para controlar nosso espaço aéreo e apoiar todas as operações militares."
 BOL_might_of_the_sky:0 "O Poder do Céu"
 BOL_might_of_the_sky_desc:0 "Nosso poder aéreo simboliza a força nacional e o progresso tecnológico. Manter uma força aérea poderosa dissuade agressões."
 BOL_armada_boliviana: "Armada Boliviana"
 BOL_armada_boliviana_desc:0 "As forças navais da Bolívia defendem nossas vias navegáveis e apoiam a soberania. Expandir essas forças fortalece a segurança nacional."
 BOL_naval_military_police:0 "Polícia Militar Naval"
 BOL_naval_military_police_desc:0 "A polícia militar naval mantém a disciplina e a segurança a bordo de navios e bases. Ela garante a ordem e operações eficazes."
 BOL_expand_the_naval_academy:0 "Expandir a Academia Naval"
 BOL_expand_the_naval_academy_desc:0 "Uma academia naval ampliada forma mais oficiais e marinheiros. Esse investimento constrói forças marítimas profissionais e capazes."
 BOL_return_to_the_sea:0 "Nosso Retorno ao Mar"
 BOL_return_to_the_sea_desc:0 "Recuperar o acesso ao Oceano Pacífico é um objetivo histórico da Bolívia. Desenvolver uma presença naval é crucial para essa ambição."
 BOL_bolivian_marine_forces:0 "Forças de Fuzileiros Navais Bolivianos"
 BOL_bolivian_marine_forces_desc:0 "Os fuzileiros navais oferecem capacidade de resposta rápida e conhecimento anfíbio. Sua expansão aumenta o alcance operacional da Bolívia."
 BOL_quick_strikes:0 "Ataques Rápidos"
 BOL_quick_strikes_desc:0 "Ataques rápidos e decisivos podem esmagar adversários. Desenvolver tais forças aumenta a flexibilidade tática."
 BOL_invest_into_shipbuilding:0 "Investir na Construção Naval"
 BOL_invest_into_shipbuilding_desc:0 "Construir uma indústria naval nacional apoia a expansão naval e o crescimento econômico. Esse setor é estratégico para a defesa de longo prazo."
 BOL_a_grand_armada:0 "Uma Grande Armada"
 BOL_a_grand_armada_desc:0 "Criar uma frota poderosa projeta força e protege os interesses nacionais. Uma grande armada é símbolo da soberania marítima."
 BOL_masters_of_the_pacific:0 "Senhores do Pacífico"
 BOL_masters_of_the_pacific_desc:0 "Dominar as águas do Pacífico garante rotas comerciais e vantagens estratégicas. A Bolívia deve aspirar a ser um ator-chave nesta região."
 BOL_new_millenium:0 "Um Novo Milênio"
 BOL_new_millenium_desc:0 "A entrada em um novo milênio traz oportunidades de reforma e progresso. A Bolívia deve abraçar a mudança para construir um futuro mais brilhante."
 BOL_bolivian_reformists:0 "Reformistas Bolivianos"
 BOL_bolivian_reformists_desc:0 "Os reformistas defendem a modernização, a justiça social e uma governança inclusiva. Sua visão molda o caminho do país adiante."
 BOL_promote_bolivian_unity:0 "Promover a Unidade Boliviana"
 BOL_promote_bolivian_unity_desc:0 "A unidade nacional é essencial para superar as divisões. Promover a inclusão fortalece nosso tecido social."
 BOL_assure_mestizo_representation:0 "Assegurar a Representação Mestiça"
 BOL_assure_mestizo_representation_desc:0 "Garantir representação política às comunidades mestiças promove a equidade. Essa inclusão apoia a coesão nacional."
 BOL_media_luna_investments:0 "Investimentos na Media Luna"
 BOL_media_luna_investments_desc:0 "Investimentos na região da Media Luna impulsionam o desenvolvimento regional. O crescimento equilibrado reduz as disparidades em toda a Bolívia."
 BOL_hold_talks_with_indigenous_ngos:0 "Dialogar com as ONGs Indígenas"
 BOL_hold_talks_with_indigenous_ngos_desc:0 "Envolver as ONGs indígenas promove o diálogo e a cooperação. A negociação respeitosa avança objetivos comuns."
 BOL_protect_indigenous_land:0 "Proteger as Terras Indígenas"
 BOL_protect_indigenous_land_desc:0 "Salvaguardar os territórios indígenas preserva a cultura e o meio ambiente. As proteções legais devem ser aplicadas para garantir os direitos."
 BOL_union_of_reformist_forces:0 "União das Forças Reformistas"
 BOL_union_of_reformist_forces_desc:0 "Reunir os grupos reformistas fortalece a influência política. Unidos, eles podem defender melhor a mudança."
 BOL_push_for_greater_pluralism:0 "Impulsionar Maior Pluralismo Político"
 BOL_push_for_greater_pluralism_desc:0 "Incentivar a diversidade política enriquece a democracia. Maior pluralismo permite que todas as vozes sejam ouvidas."
 BOL_improve_human_rights:0 "Melhorar os Direitos Humanos"
 BOL_improve_human_rights_desc:0 "Proteger e promover os direitos humanos é fundamental para a justiça. Devemos enfrentar os abusos e construir instituições inclusivas."
 BOL_anti_corruption_plan:0 "Plano Anticorrupção"
 BOL_anti_corruption_plan_desc:0 "A corrupção mina a confiança e o desenvolvimento. Um plano robusto é essencial para restaurar a integridade no governo."
 BOL_judicial_independence:0 "Um Judiciário Independente"
 BOL_judicial_independence_desc:0 "Um judiciário livre de influência política garante justiça imparcial. Fortalecer essa independência defende o Estado de direito."
 BOL_pragmatic_economic_approach:0 "Uma Abordagem Econômica Pragmática"
 BOL_pragmatic_economic_approach_desc:0 "Equilibrar crescimento e necessidades sociais exige políticas pragmáticas. Soluções flexíveis se adaptam às realidades econômicas em mudança."
 BOL_liberal_market_reforms:0 "Reformas Liberais de Mercado"
 BOL_liberal_market_reforms_desc:0 "A liberalização do mercado pode estimular o investimento e a inovação. As reformas devem ser conduzidas com cuidado para proteger as populações vulneráveis."
 BOL_ensure_investment_safety:0 "Garantir a Segurança dos Investimentos"
 BOL_ensure_investment_safety_desc:0 "Oferecer um ambiente seguro incentiva o investimento interno e externo. Leis claras e sua aplicação são fundamentais."
 BOL_lower_sme_taxation:0 "Reduzir os Impostos para Pequenas Empresas"
 BOL_lower_sme_taxation_desc:0 "Reduzir os impostos sobre pequenas e médias empresas apoia o empreendedorismo. Isso incentiva a criação de empregos e a diversificação econômica."
 BOL_telecom_investments:0 "Investimentos em Telecomunicações"
 BOL_telecom_investments_desc:0 "Uma infraestrutura moderna de telecomunicações conecta pessoas e empresas. O investimento impulsiona a inclusão digital e o crescimento econômico."
 BOL_invest_in_the_tertiary_sector:0 "Investir no Setor Terciário"
 BOL_invest_in_the_tertiary_sector_desc:0 "O setor terciário, que inclui serviços e turismo, é vital para a diversidade econômica. Apoiá-lo promove o emprego e a inovação."
 BOL_fight_illegal_coca_production:0 "Combater a Produção Ilegal de Coca"
 BOL_fight_illegal_coca_production_desc:0 "O cultivo ilegal de coca alimenta o crime e a instabilidade. Combatê-lo exige aplicação da lei coordenada e apoio da comunidade."
 BOL_renewable_investments:0 "Investimento em Renováveis"
 BOL_renewable_investments_desc:0 "Investir em energia renovável garante crescimento sustentável. Isso reduz a dependência de combustíveis fósseis e protege o meio ambiente."
 BOL_promote_sustainable_development:0 "Promover o Desenvolvimento Sustentável"
 BOL_promote_sustainable_development_desc:0 "O desenvolvimento sustentável equilibra crescimento econômico e cuidado ambiental. A Bolívia deve proteger os recursos naturais para as gerações futuras."
 BOL_strengthen_safety_net:0 "Fortalecer a Rede de Proteção Social Boliviana"
 BOL_strengthen_safety_net_desc:0 "As redes de proteção social amparam as populações vulneráveis em tempos difíceis. Expandir esses programas promove equidade e estabilidade."
 BOL_improve_bolivian_education:0 "Melhorar a Educação Boliviana"
 BOL_improve_bolivian_education_desc:0 "Educação de qualidade é a base do progresso nacional. Investir em escolas e professores prepara nossa juventude para o futuro."
 BOL_modernize_bolivian_hospitals:0 "Modernizar os Hospitais Bolivianos"
 BOL_modernize_bolivian_hospitals_desc:0 "Modernizar a infraestrutura e os equipamentos hospitalares melhora os resultados de saúde. O acesso a cuidados modernos salva vidas e constrói resiliência."
 BOL_support_young_families:0 "Apoiar as Famílias Jovens"
 BOL_support_young_families_desc:0 "Políticas de apoio às famílias jovens fortalecem o futuro da sociedade. Auxílio com creche, moradia e educação é essencial."
 BOL_housing_programs:0 "Programas de Habitação"
 BOL_housing_programs_desc:0 "Iniciativas de moradia acessível atendem às necessidades urbanas e rurais. Garantir abrigo para todos melhora a qualidade de vida."
 BOL_bolivia_for_all:0 "Uma Bolívia para Todos"
 BOL_bolivia_for_all_desc:0 "Criar uma Bolívia inclusiva significa igualdade de oportunidades para todos. A unidade nacional e o respeito à diversidade são nossos objetivos."
 BOL_bolivias_first_indigenous_president:0 "O Primeiro Presidente Indígena da Bolívia"
 BOL_bolivias_first_indigenous_president_desc:0 "Eleger nosso primeiro presidente indígena foi um marco histórico. Simboliza o progresso rumo à justiça social e à representatividade."
 BOL_evonomics: "Evonomics"
 BOL_evonomics_desc:0 "A Evonomics combina evolução e economia para criar políticas adaptativas e resilientes. Essa abordagem abraça a complexidade em prol do desenvolvimento sustentável."
 BOL_voice_of_the_discriminated:0 "Voz dos Discriminados"
 BOL_voice_of_the_discriminated_desc:0 "Dar voz aos grupos marginalizados fortalece a democracia. Devemos enfrentar a discriminação sistêmica e empoderar todos os cidadãos."
 BOL_popular_social_initiatives:0 "Iniciativas Sociais Populares"
 BOL_popular_social_initiatives_desc:0 "Programas sociais de base melhoram o dia a dia e promovem a comunidade. Apoiar essas iniciativas incentiva a participação e a solidariedade."
 BOL_enact_universal_healthcare:0 "Instituir a Saúde Universal"
 BOL_enact_universal_healthcare_desc:0 "A saúde universal garante acesso a serviços médicos para todos. Essa política promove a saúde pública e a equidade social."
 BOL_greater_support_to_pensioners:0 "Maior Apoio aos Aposentados"
 BOL_greater_support_to_pensioners_desc:0 "Apoiar os aposentados protege sua dignidade e bem-estar. Benefícios maiores refletem nosso compromisso com os idosos."
 BOL_lgbt_rights:0 "Melhorar os Direitos LGBT"
 BOL_lgbt_rights_desc:0 "Avançar os direitos LGBT promove a igualdade e a dignidade humana. Proteções legais e aceitação social são passos vitais."
 BOL_denounce_previous_colonialist_regimes:0 "Denunciar os Regimes Colonialistas Anteriores"
 BOL_denounce_previous_colonialist_regimes_desc:0 "Reconhecer os males do colonialismo é essencial para a cura. Denunciar os regimes passados afirma a soberania e a identidade da Bolívia."
 BOL_western_bolivia_investment_projects:0 "Projetos de Investimento no Oeste da Bolívia"
 BOL_western_bolivia_investment_projects_desc:0 "Investimentos direcionados ao oeste da Bolívia promovem o crescimento nacional equilibrado. Infraestrutura e serviços elevam esta região vital."
 BOL_improve_rural_water_supply:0 "Melhorar o Abastecimento de Água Rural"
 BOL_improve_rural_water_supply_desc:0 "O acesso à água potável é um direito humano básico. Expandir os sistemas de água rurais melhora a saúde e os meios de subsistência."
 BOL_food_subsidies:0 "Subsídios Alimentares"
 BOL_food_subsidies_desc:0 "Subsidiar alimentos essenciais garante preços acessíveis para todos os cidadãos. Isso ajuda a reduzir a fome e apoia famílias de baixa renda."
 BOL_improve_literacy_rates:0 "Melhorar as Taxas de Alfabetização"
 BOL_improve_literacy_rates_desc:0 "Maior alfabetização abre portas para oportunidades e crescimento. Programas de ensino de leitura e escrita fortalecem as comunidades."
 BOL_build_new_rural_schools:0 "Construir Novas Escolas Rurais"
 BOL_build_new_rural_schools_desc:0 "Novas escolas em áreas rurais combatem a desigualdade educacional. O acesso a uma educação de qualidade fortalece as gerações futuras."
 BOL_expand_institutional_control:0 "Expandir o Controle Institucional"
 BOL_expand_institutional_control_desc:0 "Fortalecer as instituições melhora a governança e a responsabilização. Um controle eficaz sustenta a lei, a ordem e o desenvolvimento."
 BOL_undermine_the_media_luna:0 "Minar a Media Luna"
 BOL_undermine_the_media_luna_desc:0 "Enfraquecer a oposição na região da Media Luna consolida a unidade nacional. Esforços políticos estratégicos reduzem a fragmentação regional."
 BOL_nationalize_resources:0 "Nacionalizar os Recursos Naturais Bolivianos"
 BOL_nationalize_resources_desc:0 "Colocar os recursos naturais sob controle estatal assegura a riqueza da Bolívia. A nacionalização permite melhor gestão e distribuição mais justa."
 BOL_withdraw_from_the_imf:0 "Sair do FMI"
 BOL_withdraw_from_the_imf_desc:0 "Sair do FMI permite que a Bolívia recupere a soberania econômica. Possibilita ao país adotar políticas fiscais independentes, sem restrições externas."
 BOL_empower_labour_unions:0 "Fortalecer os Sindicatos Trabalhistas"
 BOL_empower_labour_unions_desc:0 "Sindicatos fortes protegem os direitos dos trabalhadores e promovem salários justos. Fortalecê-los reforça a justiça social e a democracia no local de trabalho."
 BOL_coca_yes_cocaine_no:0 "Coca Sim, Cocaína Não"
 BOL_coca_yes_cocaine_no_desc:0 "Apoiamos o cultivo tradicional de coca e nos opomos à produção de cocaína. Essa abordagem equilibrada respeita as práticas culturais e combate o tráfico de drogas."
 BOL_modernize_coca_production:0 "Modernizar a Produção de Coca"
 BOL_modernize_coca_production_desc:0 "Modernizar o cultivo de coca aumenta a produtividade e a sustentabilidade. Métodos aprimorados beneficiam os agricultores e reduzem a expansão de cultivos ilícitos."
 BOL_towards_a_mixed_economy:0 "Rumo a uma Economia Mista"
 BOL_towards_a_mixed_economy_desc:0 "Uma economia mista combina os setores público e privado para promover um crescimento equilibrado. Essa abordagem aproveita os pontos fortes de ambos os sistemas."
 BOL_increase_minimum_wage:0 "Aumentar o Salário Mínimo"
 BOL_increase_minimum_wage_desc:0 "Aumentar o salário mínimo melhora o padrão de vida dos trabalhadores. Apoia a redução da pobreza e a inclusão econômica."
 BOL_encourage_consumption:0 "Incentivar o Consumo"
 BOL_encourage_consumption_desc:0 "Impulsionar a demanda dos consumidores estimula a atividade econômica. Incentivar os gastos ajuda as empresas a crescer e cria empregos."
 BOL_promote_indigenous_languages:0 "Promover as Línguas Indígenas"
 BOL_promote_indigenous_languages_desc:0 "Preservar as línguas indígenas honra o rico patrimônio cultural da Bolívia. A promoção gera orgulho e inclusão social."
 BOL_inclusive_bolivia:0 "Uma Bolívia Inclusiva"
 BOL_inclusive_bolivia_desc:0 "Uma Bolívia inclusiva valoriza a diversidade e a igualdade de oportunidades para todos os cidadãos. Construir pontes entre as comunidades fortalece a unidade nacional."
 BOL_bolivian_right:0 "A Direita Boliviana"
 BOL_bolivian_right_desc:0 "A Direita Boliviana defende o livre mercado, a tradição e o governo limitado. Suas políticas refletem valores conservadores."
 BOL_hand_with_the_catholic_church:0 "De Mãos Dadas com a Igreja Católica"
 BOL_hand_with_the_catholic_church_desc:0 "A Igreja Católica continua sendo uma poderosa instituição social. A cooperação fortalece a orientação moral e o apoio comunitário."
 BOL_promote_catholic_missionaries:0 "Promover os Missionários Católicos"
 BOL_promote_catholic_missionaries_desc:0 "Promover os missionários católicos amplia o alcance religioso e os programas sociais. Isso fomenta a influência espiritual e cultural."
 BOL_pursue_neoliberal_reforms:0 "Buscar Reformas Neoliberais"
 BOL_pursue_neoliberal_reforms_desc:0 "As reformas neoliberais focam em desregulamentação, privatização e mercados abertos. Essas políticas buscam atrair investimentos e impulsionar o crescimento."
 BOL_further_privatization_initiatives:0 "Buscar Iniciativas de Privatização"
 BOL_further_privatization_initiatives_desc:0 "Expandir a privatização reduz a participação do Estado na economia. Isso incentiva a eficiência e o desenvolvimento do setor privado."
 BOL_attract_foreign_investment:0 "Atrair Investimento Estrangeiro"
 BOL_attract_foreign_investment_desc:0 "O investimento estrangeiro traz capital, tecnologia e empregos. Criar um ambiente acolhedor atrai parceiros globais."
 BOL_cut_back_on_social_spending:0 "Cortar os Gastos Sociais"
 BOL_cut_back_on_social_spending_desc:0 "Reduzir os gastos sociais diminui os custos do governo, mas corre o risco de gerar agitação social. É preciso um equilíbrio cuidadoso para manter a estabilidade."
 BOL_smaller_state:0 "Um Estado Menor"
 BOL_smaller_state_desc:0 "Um Estado menor limita a burocracia e a intervenção governamental. Isso incentiva a iniciativa privada e as liberdades individuais."
 BOL_lower_tax_regime:0 "Um Regime Tributário Mais Baixo"
 BOL_lower_tax_regime_desc:0 "Reduzir impostos estimula a atividade empresarial e o crescimento econômico. Políticas tributárias competitivas atraem empreendedores e investidores."
 BOL_dominate_the_house:0 "Dominar a Câmara"
 BOL_dominate_the_house_desc:0 "Garantir o domínio no legislativo assegura a implementação de políticas. O controle político molda o rumo futuro da Bolívia."
 BOL_crackdown_on_organized_labour:0 "Repressão ao Trabalho Organizado"
 BOL_crackdown_on_organized_labour_desc:0 "Reprimir o trabalho organizado suprime greves e dissidência. Isso fortalece a autoridade do governo, mas corre o risco de reação social."
 BOL_oppose_satanic_communists:0 "Opor-se aos Comunistas Satânicos"
 BOL_oppose_satanic_communists_desc:0 "A oposição às ideologias comunistas é apresentada como uma batalha moral e política. Essa postura mobiliza os apoiadores conservadores."
 BOL_liberalize_bolivias_trade_regime:0 "Liberalizar o Regime Comercial da Bolívia"
 BOL_liberalize_bolivias_trade_regime_desc:0 "A liberalização do comércio abre mercados e aumenta a competitividade. Remover barreiras estimula exportações e importações."
 BOL_morally_correct_bolivia:0 "Uma Bolívia Moralmente Correta"
 BOL_morally_correct_bolivia_desc:0 "Uma Bolívia moralmente correta defende os valores tradicionais e a ordem social. Essa visão rejeita mudanças radicais."
 BOL_strengthen_the_media_luna:0 "Fortalecer a Media Luna"
 BOL_strengthen_the_media_luna_desc:0 "Fortalecer a influência política da Media Luna contrapõe as forças de oposição. O poder regional apoia os objetivos políticos nacionais."
 BOL_expand_regional_funding:0 "Expandir o Financiamento Regional"
 BOL_expand_regional_funding_desc:0 "Aumentar o financiamento às regiões promove o desenvolvimento equilibrado. Projetos locais atendem às necessidades específicas de cada comunidade."
 BOL_strengthen_mestizo_pride:0 "Fortalecer o Orgulho Mestiço"
 BOL_strengthen_mestizo_pride_desc:0 "Promover o orgulho mestiço fomenta a identidade e a coesão social. Celebrar a herança une esse importante grupo demográfico."
 BOL_santa_cruz_infrastructure_projects:0 "Projetos de Infraestrutura em Santa Cruz"
 BOL_santa_cruz_infrastructure_projects_desc:0 "Investir na infraestrutura de Santa Cruz apoia o crescimento econômico. Estradas, serviços públicos e serviços melhores atraem empresas."
 BOL_expand_political_support:0 "Expandir o Apoio Político"
 BOL_expand_political_support_desc:0 "Ampliar o apoio político constrói uma governança mais forte. Alianças e aproximação aumentam a influência e a estabilidade."
 BOL_bolivias_gems:0 "As Joias da Bolívia"
 BOL_bolivias_gems_desc:0 "Os tesouros naturais e culturais da Bolívia são ativos valiosos. Protegê-los e promovê-los realça o turismo e o orgulho nacional."
 BOL_renew_the_war_on_drugs:0 "Renovar a Guerra às Drogas"
 BOL_renew_the_war_on_drugs_desc:0 "Renovar a guerra às drogas mira redes de tráfico e o cultivo ilegal. Esse esforço visa restaurar a lei e a ordem."
 BOL_crackdown_on_coca_production:0 "Repressão à Produção de Coca"
 BOL_crackdown_on_coca_production_desc:0 "Reprimir o cultivo de coca interrompe as cadeias de suprimento de drogas. A fiscalização busca equilibrar os usos tradicionais com as restrições legais."
 BOL_seek_us_technical_assistance:0 "Buscar Assistência Técnica Americana"
 BOL_seek_us_technical_assistance_desc:0 "Buscar assistência técnica americana traz conhecimento e apoio. Essa cooperação fortalece a capacidade institucional."
 BOL_expand_anti_cartel_operations:0 "Expandir as Operações Anticartel"
 BOL_expand_anti_cartel_operations_desc:0 "Expandir as ações anticartel desarticula o crime organizado e o tráfico de drogas. Uma fiscalização mais forte aumenta a segurança pública."
 BOL_bring_in_military_support:0 "Convocar Apoio Militar"
 BOL_bring_in_military_support_desc:0 "O apoio militar reforça as forças de segurança no combate à agitação. Mobilizar as forças armadas restaura a ordem quando necessário."
 BOL_military_junta:0 "Intervenção das Forças Armadas Bolivianas"
 BOL_military_junta_desc:0 "As Forças Armadas Bolivianas intervêm para estabilizar o país em meio ao caos. O governo militar visa restaurar a ordem e o controle."
 BOL_restore_order_in_the_streets:0 "Restaurar a Ordem nas Ruas"
 BOL_restore_order_in_the_streets_desc:0 "Restaurar a ordem nas ruas protege cidadãos e propriedades. Medidas de segurança coordenadas reduzem a violência e a agitação."
 BOL_legacy_of_the_banzerato:0 "Legado do Banzerato"
 BOL_legacy_of_the_banzerato_desc:0 "A era do Banzerato deixou um legado complexo de autoritarismo e modernização. Seus impactos continuam a moldar o cenário político da Bolívia."
 BOL_crusade_against_the_indians:0 "Uma Cruzada contra os Índios"
 BOL_crusade_against_the_indians_desc:0 "Um capítulo sombrio de repressão teve como alvo os povos indígenas. Essa campanha buscou suprimir a identidade cultural e os direitos."
 BOL_ban_indigenous_languages:0 "Proibir as Línguas Indígenas"
 BOL_ban_indigenous_languages_desc:0 "Proibir as línguas indígenas corrói a diversidade e o patrimônio culturais. Tais políticas aprofundam as divisões sociais."
 BOL_support_the_santa_cruz_youth_union:0 "Apoiar a União Juvenil de Santa Cruz"
 BOL_support_the_santa_cruz_youth_union_desc:0 "Apoiar a União Juvenil de Santa Cruz fortalece jovens líderes. Isso fomenta o ativismo político e a identidade regional."
 BOL_promote_mestizo_superiority:0 "Promover a Superioridade Mestiça"
 BOL_promote_mestizo_superiority_desc:0 "Promover a superioridade mestiça alimenta o nacionalismo étnico e a exclusão. Essa ideologia cria tensões sociais."
 BOL_bolivian_corporate_state:0 "O Estado Corporativo Boliviano"
 BOL_bolivian_corporate_state_desc:0 "O estado corporativo organiza a sociedade por meio de instituições corporativistas. Esse modelo controla grupos econômicos e sociais sob a orientação do Estado."
 BOL_network_of_patronage:0 "Uma Rede de Clientelismo"
 BOL_network_of_patronage_desc:0 "Uma rede de clientelismo distribui favores e recursos em troca de lealdade. Esse sistema influencia a política e a governança."
 BOL_major_economic_projects:0 "Grandes Projetos Econômicos"
 BOL_major_economic_projects_desc:0 "Lançaremos projetos nacionais de desenvolvimento em larga escala para estimular o crescimento, atrair capital estrangeiro e modernizar setores-chave da economia."
 BOL_inject_liquidity_in_the_economy:0 "Injetar Liquidez na Economia"
 BOL_inject_liquidity_in_the_economy_desc:0 "Ao injetar liquidez, podemos impulsionar a atividade econômica de curto prazo e aliviar as restrições de crédito. Essa medida visa evitar a recessão e apoiar a criação de empregos."
 BOL_strength_of_the_armed_forces:0 "Força das Forças Armadas Bolivianas"
 BOL_strength_of_the_armed_forces_desc:0 "Forças armadas fortes são vitais para a defesa nacional e a estabilidade interna. Aumentaremos o financiamento, ampliaremos o treinamento e modernizaremos o equipamento."
 BOL_form_bolivian_deathsquads:0 "Formar Esquadrões da Morte Bolivianos"
 BOL_form_bolivian_deathsquads_desc:0 "Para lidar com ameaças internas, serão formados esquadrões da morte de elite. Essas unidades operarão em sigilo para eliminar alvos de alto risco."
 BOL_enforce_mandatory_service:0 "Impor o Serviço Obrigatório"
 BOL_enforce_mandatory_service_desc:0 "O serviço militar obrigatório constrói disciplina e unidade nacional. Todos os cidadãos deverão contribuir para a defesa nacional."
 BOL_strengthen_secret_services:0 "Fortalecer os Serviços Secretos"
 BOL_strengthen_secret_services_desc:0 "Expandir nossas capacidades de inteligência garante resposta rápida à subversão e ao terrorismo. Sigilo e eficiência serão primordiais."
 BOL_end_to_the_cartels:0 "O Fim dos Cartéis"
 BOL_end_to_the_cartels_desc:0 "Erradicaremos os cartéis de drogas por meio de ação militar e policial coordenada. Essa campanha restaurará a ordem nas regiões afetadas."
 BOL_gain_american_support:0 "Ganhar o Apoio Americano"
 BOL_gain_american_support_desc:0 "Ao se alinhar aos EUA, a Bolívia pode obter apoio militar, econômico e de inteligência crucial para fortalecer nossa posição internacional."
 BOL_pride_of_bolivia:0 "O Orgulho da Bolívia"
 BOL_pride_of_bolivia_desc:0 "Nossa nação está se erguendo rumo à grandeza. Unamo-nos em torno da bandeira e tenhamos orgulho de nossa força e prosperidade crescentes."
 BOL_restoring_bolivias_lost_glory:0 "Restaurando a Glória Perdida da Bolívia"
 BOL_restoring_bolivias_lost_glory_desc:0 "Chegou a hora de restaurar o que nos foi tirado. A Bolívia recuperará sua honra, dignidade e territórios históricos."
 BOL_destroy_brazil:0 "Destruir o Brasil"
 BOL_destroy_brazil_desc:0 "Não toleraremos mais o domínio brasileiro. Pela força e determinação, poremos o Brasil de joelhos."
 BOL_avenge_chaco_war:0 "Vingar a Guerra do Chaco"
 BOL_avenge_chaco_war_desc:0 "Jamais esqueceremos a humilhação da Guerra do Chaco. O Paraguai pagará por seus crimes contra o nosso povo."
 BOL_reagain_our_access_to_the_sea:0 "Recuperar Nosso Acesso ao Mar"
 BOL_reagain_our_access_to_the_sea_desc:0 "Devemos reivindicar o acesso legítimo da Bolívia ao mar. Um futuro próspero exige soberania marítima."
 BOL_expand_military_production:0 "Expandir a Produção Militar"
 BOL_expand_military_production_desc:0 "A Bolívia ampliará a fabricação de armas para abastecer suas forças armadas e criar autonomia estratégica em defesa."
 BOL_expand_military_police:0 "Expandir a Polícia Militar"
 BOL_expand_military_police_desc:0 "Aumentaremos o tamanho e o alcance da polícia militar para garantir a estabilidade interna e manter a ordem pública."
 BOL_bolivias_place_in_the_sun_restored:0 "O Lugar da Bolívia ao Sol Restaurado"
 BOL_bolivias_place_in_the_sun_restored_desc:0 "Nossa nação não é mais esquecida. Assumiremos nosso lugar de direito como grande ator nos assuntos regionais e globais."
 BOL_light_of_the_wiphala:0 "A Luz da Wiphala"
 BOL_light_of_the_wiphala_desc:0 "A Wiphala simboliza unidade e resistência. Ela guiará nosso futuro como uma nação orgulhosa, liderada por indígenas."
 BOL_indigenismo: "Indigenismo"
 BOL_indigenismo_desc:0 "A identidade indígena se tornará a pedra angular da ideologia nacional. Centraremos as políticas nos valores e na liderança nativos."
 BOL_revive_indigenous_culture:0 "Reviver a Cultura Indígena"
 BOL_revive_indigenous_culture_desc:0 "Séculos de apagamento devem ser revertidos. Financiaremos projetos de renascimento cultural e incorporaremos as tradições indígenas à vida pública."
 BOL_defence_of_our_sacred_land:0 "Defesa da Nossa Terra Sagrada"
 BOL_defence_of_our_sacred_land_desc:0 "Defenderemos nossa terra da exploração e da invasão. A luta pela soberania é sagrada e intransigente."
 BOL_water_wars_legacy:0 "Legado das Guerras da Água"
 BOL_water_wars_legacy_desc:0 "As guerras da água nos ensinaram o poder da resistência. Esse legado alimentará nossa luta por justiça econômica e ambiental."
 BOL_seize_foreign_business:0 "Confiscar Ativos de Empresas Estrangeiras"
 BOL_seize_foreign_business_desc:0 "Nacionalizaremos as empresas estrangeiras que exploram o nosso povo. A riqueza da Bolívia deve permanecer em mãos bolivianas."
 BOL_form_indigenous_militias:0 "Formar Milícias Indígenas"
 BOL_form_indigenous_militias_desc:0 "Milícias enraizadas nas comunidades indígenas salvaguardarão a autonomia local e combaterão a intervenção estrangeira."
 BOL_liberation_from_colonialism:0 "Libertação do Colonialismo"
 BOL_liberation_from_colonialism_desc:0 "A Bolívia se libertará de todas as estruturas coloniais remanescentes: econômicas, culturais e políticas."
 BOL_communitarian_socialism:0 "Socialismo Comunitário"
 BOL_communitarian_socialism_desc:0 "Construiremos um sistema socialista baseado na solidariedade comunitária, na governança local e no conhecimento tradicional."
 BOL_housing_for_the_poor:0 "Moradia para os Pobres"
 BOL_housing_for_the_poor_desc:0 "Todos merecem abrigo. Lançaremos programas de construção em massa para abrigar os cidadãos mais vulneráveis da Bolívia."
 BOL_destroy_rich_landowners:0 "Destruir os Grandes Latifundiários"
 BOL_destroy_rich_landowners_desc:0 "Desmantelaremos as elites feudais que acumulam terra e poder. A redistribuição garantirá justiça e igualdade."
 BOL_subsidize_coca_production:0 "Subsidiar a Produção de Coca"
 BOL_subsidize_coca_production_desc:0 "O cultivo tradicional de coca será protegido e promovido. Subsídios do governo apoiarão o uso legal e cultural."
 BOL_state_controlled_unions:0 "Sindicatos Controlados pelo Estado"
 BOL_state_controlled_unions_desc:0 "Para evitar dissidência e desordem, os sindicatos serão colocados sob orientação e supervisão do Estado."
 BOL_reforestation_initiatives:0 "Iniciativas de Reflorestamento"
 BOL_reforestation_initiatives_desc:0 "Plantaremos árvores e restauraremos ecossistemas para reverter o desmatamento. Políticas verdes protegerão nosso meio ambiente."
 BOL_raise_living_standards:0 "Elevar o Padrão de Vida"
 BOL_raise_living_standards_desc:0 "Por meio de maior assistência social e emprego, tiraremos milhões da pobreza e melhoraremos o dia a dia de todos os bolivianos."
 BOL_enact_price_controls:0 "Instituir Controle de Preços"
 BOL_enact_price_controls_desc:0 "Para proteger os consumidores, o governo fixará preços de bens e serviços essenciais. A exploração não será tolerada."
 BOL_five_year_plan:0 "Um Plano Quinquenal"
 BOL_five_year_plan_desc:0 "Nosso plano quinquenal guiará a transformação econômica da Bolívia. O planejamento central nos levará à prosperidade."
 BOL_modernize_mining:0 "Modernizar a Mineração"
 BOL_modernize_mining_desc:0 "A mineração será atualizada com nova tecnologia e mais segurança. Esse setor será a espinha dorsal do desenvolvimento nacional."
 BOL_ban_pro_imperialist_force:0 "Proibir as Forças Pró-Imperialistas"
 BOL_ban_pro_imperialist_force_desc:0 "Colocaremos na ilegalidade os grupos alinhados a potências imperiais estrangeiras. A unidade nacional deve ser preservada a todo custo."
 BOL_state_of_the_proletariat:0 "Estado do Proletariado"
 BOL_state_of_the_proletariat_desc:0 "A Bolívia se tornará um estado governado por trabalhadores, para os trabalhadores. O trabalho liderará e a exploração acabará."
 BOL_anti_colonialist_struggle:0 "A Luta Anticolonialista"
 BOL_anti_colonialist_struggle_desc:0 "Declaramos uma guerra política, econômica e cultural contra todas as formas de dominação colonial em nossa região."
 BOL_liberate_perus_oppressed:0 "Libertar os Oprimidos do Peru"
 BOL_liberate_perus_oppressed_desc:0 "Estaremos em solidariedade com os povos indígenas e trabalhadores do Peru, apoiando sua libertação por todos os meios necessários."
 BOL_liberate_chilean_natives:0 "Libertar os Nativos Chilenos"
 BOL_liberate_chilean_natives_desc:0 "A luta dos povos nativos do Chile é também a nossa. A Bolívia auxiliará sua emancipação da repressão."
 BOL_liberate_the_amazonian_tribes:0 "Libertar as Tribos Amazônicas"
 BOL_liberate_the_amazonian_tribes_desc:0 "As tribos amazônicas enfrentam a extinção. Agiremos com decisão para preservar suas terras, direitos e culturas."
 BOL_our_oppression_avenged:0 "Nossa Opressão Vingada!"
 BOL_our_oppression_avenged_desc:0 "Séculos de injustiça não ficarão impunes. Nossa revolução levará justiça aos oprimidos e terror aos opressores."
 BOL_foreign_policy:0 "Política Externa Boliviana"
 BOL_foreign_policy_desc:0 "A Bolívia deve garantir seu lugar no cenário mundial. Nossa política externa refletirá a força nacional e a clareza ideológica."
 BOL_paraguayan_relations:0 "Melhorar as Relações com o Paraguai"
 BOL_paraguayan_relations_desc:0 "Fortalecer nossa relação diplomática com o Paraguai pode fomentar a estabilidade regional e abrir novos caminhos para o comércio e a cooperação militar. Com história e fronteiras compartilhadas, uma aliança boliviano-paraguaia mais forte pode ser vital nos próximos anos."
 BOL_brazil_pipeline:0 "Negociar o Acordo do Gasoduto com o Brasil"
 BOL_brazil_pipeline_desc:0 "A demanda de energia do Brasil continua crescendo, e a Bolívia possui uma valiosa carta de negociação. Ao negociar um projeto de gasoduto, podemos garantir renda de longo prazo, impulsionar a infraestrutura e aumentar a influência regional por meio das exportações de energia."
 BOL_expanding_trade_relations:0 "Expandir as Relações Comerciais com o Brasil"
 BOL_expanding_trade_relations_desc:0 "Com o acordo de energia pavimentando o caminho, é hora de aprofundar nossos laços comerciais com o Brasil. Uma cooperação comercial ampliada pode levar ao crescimento industrial, ao intercâmbio tecnológico e a um alinhamento diplomático mais forte."
 BOL_convene_a_constitutional_assembly:0 "Convocar uma Assembleia Constituinte"
 BOL_convene_a_constitutional_assembly_desc:0 "Para curar nossa nação dividida e estabelecer uma base estável, devemos convocar uma nova Assembleia Constituinte que represente toda a Bolívia."
 BOL_nature_of_the_state:0 "Natureza do Estado"
 BOL_nature_of_the_state_desc:0 "Qual deve ser a natureza do nosso estado: centralizado ou federal, plurinacional ou unitário? Devemos defini-la em nossa nova constituição."
 BOL_question_of_the_capital:0 "A Questão da Capital"
 BOL_question_of_the_capital_desc:0 "La Paz ou Sucre? O debate sobre a sede do governo é simbólico e prático. Uma resposta clara deve ser inscrita em lei."
 BOL_question_of_judges:0 "A Questão dos Juízes"
 BOL_question_of_judges_desc:0 "Os juízes devem ser eleitos ou nomeados? A independência judicial e a confiança pública estão em jogo."
 BOL_question_of_our_right_to_the_sea:0 "A Questão do Nosso Direito ao Mar"
 BOL_question_of_our_right_to_the_sea_desc:0 "Nossa constituição deve reafirmar nosso direito histórico de acesso ao Oceano Pacífico, tanto pela identidade quanto pela diplomacia futura."
 BOL_settling_the_ethnic_divide:0 "Resolver a Divisão Étnica"
 BOL_settling_the_ethnic_divide_desc:0 "Os grupos étnicos da Bolívia têm longas histórias de desigualdade e luta. A nova constituição deve se esforçar para tratar essa ferida nacional."
 BOL_focus_on_integration:0 "Foco na Integração"
 BOL_focus_on_integration_desc:0 "Devemos focar em integrar todos os bolivianos em uma única identidade nacional, priorizando a unidade sobre tratamento especial ou divisão."
 BOL_focus_on_justice:0 "Foco na Justiça"
 BOL_focus_on_justice_desc:0 "A justiça deve ser o pilar de nossa nova ordem. Os erros históricos devem ser reconhecidos e os direitos devem ser estendidos a todas as comunidades."
 BOL_reconciliation_focus:0 "Foco na Reconciliação"
 BOL_reconciliation_focus_desc:0 "Entre a justiça e a unidade está a reconciliação. Buscamos superar as divisões e traçar um novo rumo cooperativo para a república."
 BOL_autonomy_for_the_media_luna:0 "Autonomia para a Media Luna"
 BOL_autonomy_for_the_media_luna_desc:0 "Os departamentos orientais há muito exigem autonomia. Reconhecê-la poderia desescalar as tensões e melhorar a governança."
 BOL_spanish_as_the_sole_language:0 "Espanhol como Única Língua"
 BOL_spanish_as_the_sole_language_desc:0 "Declarar o espanhol como única língua oficial pode simplificar a governança, mas corre o risco de alienar as vozes indígenas."
 BOL_commission_on_past_abuses:0 "Comissão sobre Abusos do Passado"
 BOL_commission_on_past_abuses_desc:0 "Formaremos uma comissão da verdade e justiça para investigar a violência estatal, a repressão política e as injustiças do passado."
 BOL_promote_ethnic_unity:0 "Promover a Unidade Étnica"
 BOL_promote_ethnic_unity_desc:0 "Nosso objetivo é uma identidade boliviana compartilhada que eleve todas as etnias. Escolas, mídia e políticas devem refletir esse ideal."
 BOL_autonomy_for_indigenous_communities:0 "Autonomia para as Comunidades Indígenas"
 BOL_autonomy_for_indigenous_communities_desc:0 "As comunidades indígenas devem ter o direito à autogovernança e à preservação cultural consagrado em lei."
 BOL_make_indigenous_languages_national:0 "Tornar as Línguas Indígenas Nacionais"
 BOL_make_indigenous_languages_national_desc:0 "O quíchua, o aimará e outras línguas indígenas receberão status nacional ao lado do espanhol."
 BOL_new_constitution:0 "Nova Constituição"
 BOL_new_constitution_desc:0 "O longo processo de debate, compromisso e visão está completo. A Bolívia agora tem uma nova constituição, construída para o futuro."
 BOL_atacama_border_dispute:0 "Disputa de Fronteira do Atacama"
 BOL_atacama_border_dispute_desc:0 "A antiga disputa territorial com o Chile pelo Deserto do Atacama continua moldando nossa identidade nacional. É hora de reavaliar nosso caminho adiante."
 BOL_promote_a_diplomatic_solution:0 "Promover uma Solução Diplomática"
 BOL_promote_a_diplomatic_solution_desc:0 "Em vez de confronto, buscaremos o diálogo com o Chile. Uma resolução pacífica pode trazer benefícios de longo prazo e abrir rotas comerciais."
 BOL_finding_a_mediator:0 "Encontrar um Mediador"
 BOL_finding_a_mediator_desc:0 "Para facilitar as negociações com o Chile, envolveremos atores internacionais neutros para atuarem como mediadores na disputa do Atacama."
 BOL_drop_our_claim_on_atacama:0 "Abandonar Nossa Reivindicação sobre o Atacama"
 BOL_drop_our_claim_on_atacama_desc:0 "Abrir mão de nossa reivindicação histórica poderia levar à normalização das relações com o Chile e a novas oportunidades regionais, mesmo que fira nosso orgulho."
 BOL_new_era_in_chilean_relations:0 "Uma Nova Era nas Relações com o Chile"
 BOL_new_era_in_chilean_relations_desc:0 "Com as tensões superadas, podemos trabalhar com o Chile em comércio, desenvolvimento e diplomacia na América do Sul."
 BOL_promote_common_cultural_heritage:0 "Promover o Patrimônio Cultural Comum"
 BOL_promote_common_cultural_heritage_desc:0 "Apesar do conflito passado, nossos povos compartilham raízes culturais comuns. Promover a unidade por meio do patrimônio pode abrir caminho para uma parceria mais forte."
 BOL_chilean_free_trade_agreement:0 "Acordo de Livre Comércio com o Chile"
 BOL_chilean_free_trade_agreement_desc:0 "A integração econômica com o Chile beneficiará nossas duas nações. Tarifas menores e infraestrutura compartilhada são uma situação em que todos ganham."
 BOL_our_window_to_the_pacific:0 "Nossa Janela para o Pacífico"
 BOL_our_window_to_the_pacific_desc:0 "Garantimos uma nova janela para o Pacífico por meio da diplomacia. Comércio, segurança e prosperidade nos aguardam além da costa."
 BOL_reach_out_to_the_americans:0 "Aproximar-se dos Americanos"
 BOL_reach_out_to_the_americans_desc:0 "Obter o apoio dos Estados Unidos poderia pender a balança a nosso favor. Devemos apresentar nossa causa como justa e digna de respaldo."
 BOL_reach_out_to_mercosur:0 "Aproximar-se do MERCOSUL"
 BOL_reach_out_to_mercosur_desc:0 "O bloco econômico da América do Sul pode oferecer valiosa influência política e diplomática. É hora de nos aproximarmos."
 BOL_reach_out_to_the_sco:0 "Aproximar-se da OCX"
 BOL_reach_out_to_the_sco_desc:0 "A Organização para Cooperação de Xangai pode oferecer caminhos alternativos para apoio e reconhecimento internacional."
 BOL_revive_the_pinochet_proposal:0 "Reviver a Proposta de Pinochet"
 BOL_revive_the_pinochet_proposal_desc:0 "O Chile já considerou trocas de terras para resolver nossa disputa. Reviver essa proposta poderia reacender as negociações."
 BOL_insist_our_claim:0 "Insistir em Nossa Reivindicação"
 BOL_insist_our_claim_desc:0 "Diplomática ou não, não abandonaremos nossa legítima reivindicação à costa. É o nosso destino histórico."
 BOL_presenting_our_case_to_the_hague:0 "Apresentar Nosso Caso em Haia"
 BOL_presenting_our_case_to_the_hague_desc:0 "Levaremos nossos argumentos jurídicos ao tribunal internacional para exigir justiça na questão do Atacama."
 BOL_dream_lost:0 "Sonho Perdido"
 BOL_dream_lost_desc:0 "O mundo nos negou justiça. O sonho de voltar ao mar se desvanece, mas nosso espírito permanece."
 BOL_dream_achieved:0 "Sonho Realizado"
 BOL_dream_achieved_desc:0 "Reconquistamos nosso lugar no Pacífico. A história lembrará este dia como o retorno da glória costeira da Bolívia."
 BOL_abandon_diplomatic_solutions:0 "Abandonar as Soluções Diplomáticas"
 BOL_abandon_diplomatic_solutions_desc:0 "A diplomacia nos falhou repetidas vezes. É hora de buscar medidas mais fortes e ousadas."
 BOL_ramp_up_military_readiness:0 "Intensificar a Prontidão Militar"
 BOL_ramp_up_military_readiness_desc:0 "Devemos preparar nossas forças para qualquer possibilidade. O caminho até a costa pode ser pavimentado com fogo."
 BOL_gather_border_intelligence:0 "Coletar Inteligência de Fronteira"
 BOL_gather_border_intelligence_desc:0 "Devemos avaliar as defesas de fronteira e a capacidade militar do Chile antes de qualquer confronto."
 BOL_enact_border_fortifications:0 "Implementar Fortificações de Fronteira"
 BOL_enact_border_fortifications_desc:0 "Para proteger nosso interior e garantir áreas de concentração, fortaleceremos nossas posições defensivas."
 BOL_remembering_the_alliance_of_1879:0 "Lembrando a Aliança de 1879"
 BOL_remembering_the_alliance_of_1879_desc:0 "O Peru já esteve ao nosso lado. Reviver antigas alianças pode nos servir novamente diante da agressão chilena."
 BOL_strike_alone:0 "Atacar Sozinhos"
 BOL_strike_alone_desc:0 "Ninguém lutará pelo nosso sonho, então devemos lutar por ele nós mesmos. A costa será nossa, custe o que custar."
 BOL_revenge_for_the_war_of_the_pacific:0 "Vingança pela Guerra do Pacífico"
 BOL_revenge_for_the_war_of_the_pacific_desc:0 "Isto é mais que política. Isto é justiça. A perda de nossa costa será finalmente vingada."
 BOL_reach_out_to_argentina:0 "Aproximar-se da Argentina"
 BOL_reach_out_to_argentina_desc:0 "A Argentina tem influência significativa na região. Ao nos aproximarmos diplomaticamente, podemos obter benefícios econômicos, cooperação estratégica e, quem sabe, lançar as bases de uma aliança mais ampla."
 BOL_western_relations:0 "Relações com o Ocidente"
 BOL_western_relations_desc:0 "A Bolívia se engajará diplomaticamente com as potências ocidentais, equilibrando cooperação e soberania nacional."
 BOL_our_former_rulers:0 "Nossos Antigos Governantes"
 BOL_our_former_rulers_desc:0 "A Espanha já nos governou. Agora, estaremos em pé de igualdade, ou os superaremos. A era da submissão acabou."
 BOL_our_american_partners:0 "Nossos Parceiros Americanos"
 BOL_our_american_partners_desc:0 "Os Estados Unidos podem ser um parceiro valioso em segurança, comércio e modernização, se o respeito mútuo for mantido."
 BOL_natos_arm_in_latin_america:0 "O Braço da OTAN na América Latina"
 BOL_natos_arm_in_latin_america_desc:0 "A Bolívia servirá como o pilar sul da OTAN, projetando poder e valores democráticos na região."
 BOL_eu_trade_agreements:0 "Acordos Comerciais com a Europa"
 BOL_eu_trade_agreements_desc:0 "Laços mais estreitos com a UE melhorarão os mercados de exportação, o investimento estrangeiro e a posição diplomática da Bolívia."
 BOL_oppose_chavismo_and_castroism:0 "Opor-se ao Chavismo e ao Castrismo"
 BOL_oppose_chavismo_and_castroism_desc:0 "Rejeitamos o socialismo autoritário de Caracas e Havana. A Bolívia seguirá um caminho diferente."
 BOL_american_military_expertise:0 "Conhecimento Militar Americano"
 BOL_american_military_expertise_desc:0 "As forças armadas dos EUA oferecem treinamento e modernização. A Bolívia se beneficiará de sua experiência mantendo sua autonomia."
 BOL_cias_door_in_latin_america:0 "A Porta da CIA na América Latina"
 BOL_cias_door_in_latin_america_desc:0 "Nossa cooperação de inteligência com a CIA dará à Bolívia acesso a capacidades de ponta e proteção."
 BOL_american_free_trade_deal:0 "O Acordo de Livre Comércio Bolívia-EUA"
 BOL_american_free_trade_deal_desc:0 "Um acordo comercial com os EUA abre nossa economia ao investimento e ao crescimento. Nos tornaremos um parceiro-chave no hemisfério."
 BOL_eastern_relations:0 "Relações com o Oriente"
 BOL_eastern_relations_desc:0 "Construiremos parcerias estratégicas com as potências orientais para equilibrar a influência global e conquistar novos aliados."
 BOL_trip_to_beijing:0 "Uma Viagem a Pequim"
 BOL_trip_to_beijing_desc:0 "Visitar a China sinaliza uma grande mudança na política externa. Buscaremos investimento, apoio e parceria do Oriente."
 BOL_improve_relations_with_moscow:0 "Melhorar as Relações com Moscou"
 BOL_improve_relations_with_moscow_desc:0 "Laços melhores com a Rússia beneficiarão a defesa, a economia e o alcance diplomático da Bolívia."
 BOL_apply_to_join_the_sco:0 "Ingressar na OCX"
 BOL_apply_to_join_the_sco_desc:0 "Ao ingressar na Organização para Cooperação de Xangai, a Bolívia fará parte de um bloco global em ascensão que contrapõe o domínio ocidental."
 BOL_russian_trade_agreement:0 "Acordo Comercial com a Rússia"
 BOL_russian_trade_agreement_desc:0 "Novos acordos comerciais com a Rússia aprimorarão nosso setor de energia e diversificarão os mercados de exportação."
 BOL_foster_trade_ties_with_iran:0 "Fomentar Laços Comerciais com o Irã"
 BOL_foster_trade_ties_with_iran_desc:0 "O Irã e a Bolívia podem cooperar em comércio, indústria e diplomacia. A resistência mútua ao imperialismo cria um vínculo natural."
 BOL_open_doors_to_cuba_and_venezuela:0 "Abrir as Portas para Cuba e Venezuela"
 BOL_open_doors_to_cuba_and_venezuela_desc:0 "Abraçaremos laços com Cuba e Venezuela, apoiando suas lutas e criando um eixo anti-imperialista na América Latina."
 BOL_oppose_american_influence:0 "Opor-se à Influência Americana"
 BOL_oppose_american_influence_desc:0 "A interferência dos EUA prejudica a América Latina há décadas. A Bolívia liderará a resistência ao domínio de Washington."
 BOL_chinese_investment_boom:0 "Um Boom de Investimentos Chineses"
 BOL_chinese_investment_boom_desc:0 "Capital e projetos de infraestrutura chineses transformarão a economia da Bolívia e melhorarão sua competitividade global."
 BOL_expand_mercosur_types:0 "Expandir os Laços com o MERCOSUL"
 BOL_expand_mercosur_types_desc:0 "Fortaleceremos a participação da Bolívia no MERCOSUL para impulsionar o comércio e a cooperação regional."
 BOL_trade_ties_with_india:0 "Expandir os Laços Comerciais com a Índia"
 BOL_trade_ties_with_india_desc:0 "A Índia oferece vastas oportunidades econômicas. Fortalecer os laços comerciais beneficiará ambas as nações."
 BOL_affirm_bolivian_neutrality:0 "Afirmar a Neutralidade Boliviana"
 BOL_affirm_bolivian_neutrality_desc:0 "A Bolívia permanecerá neutra nos conflitos globais, focando em diplomacia, paz e multilateralismo."
 BOL_un_peacekeeping_assistance:0 "Assistência às Operações de Paz da ONU"
 BOL_un_peacekeeping_assistance_desc:0 "Contribuiremos com as missões de paz da ONU, reforçando nosso papel como ator global responsável."
 BOL_focus_on_national_defence:0 "Foco na Defesa Nacional"
 BOL_focus_on_national_defence_desc:0 "Uma pátria segura é essencial. Priorizaremos os gastos com defesa e a modernização em todos os ramos."
 BOL_reach_out_to_developing_nations:0 "Aproximar-se das Nações em Desenvolvimento"
 BOL_reach_out_to_developing_nations_desc:0 "A Bolívia atuará como líder entre as nações em desenvolvimento, fomentando a cooperação Sul-Sul e o apoio mútuo."
 BOL_global_mediator:0 "Um Mediador Global"
 BOL_global_mediator_desc:0 "Posicionaremos a Bolívia como mediadora neutra e confiável em conflitos e disputas internacionais."
 BOL_switzerland_of_the_andes:0 "Suíça dos Andes"
 BOL_switzerland_of_the_andes_desc:0 "Buscamos nos tornar uma nação estável, neutra e próspera: uma Suíça andina admirada por todos."
 BOL_legacy_of_the_confederation:0 "Legado da Confederação"
 BOL_legacy_of_the_confederation_desc:0 "Honramos o espírito de unidade da Confederação Peru-Bolívia. O legado continua sendo uma estrela-guia para a integração futura."
 BOL_strengthen_peruvian_bolivian_economic_ties:0 "Fortalecer os Laços Econômicos"
 BOL_strengthen_peruvian_bolivian_economic_ties_desc:0 "A cooperação econômica com o Peru criará prosperidade compartilhada e fortalecerá os laços regionais."
 BOL_joint_military_exercises:0 "Exercícios Militares Conjuntos"
 BOL_joint_military_exercises_desc:0 "Realizar treinamentos conjuntos com os vizinhos fortalece a coordenação e aumenta a segurança mútua."
 BOL_our_brazilian_neighbours:0 "Nossos Vizinhos Brasileiros"
 BOL_our_brazilian_neighbours_desc:0 "Nossa relação com o Brasil é complexa. Equilibraremos a competição com uma cooperação pragmática sempre que possível."
 BOL_our_claims_south:0 "Nossas Reivindicações ao Sul"
 BOL_our_claims_south_desc:0 "Desde que perdemos o acesso à nossa costa, temos que enfrentar uma enorme burocracia só para ter acesso às nossas mercadorias. Já é hora de avaliarmos nossa posição sobre essa questão."
 BOL_the_chilean_devil:0 "O Diabo Chileno"
 BOL_the_chilean_devil_desc:0 "O estado chileno é o diabo disfarçado. Eles não trazem nada além de instabilidade e caos para a região, e devemos ser nós a informar nosso povo e o resto do mundo sobre suas verdadeiras intenções."
 BOL_revenge_of_1879:0 "Vingança de 1879"
 BOL_revenge_of_1879_desc:0 "A guerra de 1879 terminou com uma humilhação nacional para nós e a perda de nossa costa. Agora é hora de corrigir essa perda."
 BOL_dropping_our_claims:0 "Abandonando Nossas Reivindicações"
 BOL_dropping_our_claims_desc:0 "Guerra e irredentismo não são o caminho adiante. Somente por meio da diplomacia e da cooperação poderemos criar uma Bolívia mais forte."
 BOL_chilean_gas_exports:0 "Exportações de Gás ao Chile"
 BOL_chilean_gas_exports_desc:0 "Ao criar um pacto econômico estratégico com os chilenos por meio do gás, poderemos ter acesso à costa sem derramamento de sangue."
 BOL_a_new_day_in_the_americas:0 "Um Novo Dia nas Américas"
 BOL_a_new_day_in_the_americas_desc:0 "Provamos que as soluções podem ser postas em prática com a caneta em vez da espada. A região agora olhará para nossas ações como um modelo para avançar em disputas."
 BOL_inclusive_bolivia_idea:0 "Uma Bolívia Inclusiva"
 BOL_oil_reserve_decisions:0 "Decisões sobre Reservas de Petróleo"
 BOL_oil_reserve_decisions_desc:0 "Mudanças recentes nas leis ou o desenvolvimento de novas tecnologias nos permitiram descobrir e extrair petróleo adicional das várias reservas que ainda existem em nosso país."
 BOL_chilean_port_access:0 "Acesso ao Porto Chileno"
 BOL_gas_export_to_chile:0 "Exportar Gás para o Chile"
 BOL_gas_export_to_chile_desc:0 "A diplomacia energética continua. Fornecer gás ao Chile fortalecerá a interdependência e beneficiará o nosso orçamento nacional."
 BOL_explore_oil_reserves_in_santa_cruz:0 "Explorar Reservas de Petróleo em Santa Cruz"
 BOL_explore_oil_reserves_in_santa_cruz_desc: ""
 BOL_explore_oil_reserves_in_pando_el_beni:0 "Explorar Reservas de Petróleo em Pando e Beni"
 BOL_explore_oil_reserves_in_pando_el_beni_desc: ""
 BOL_fortified_preparations:0 "Preparativos Fortificados"
 BOL_fortified_preparations_desc:0 "Precisamos que nossa fronteira seja fortificada e robusta caso entremos em conflito com a ameaça ao sul."
 BOL_chilean_devil:0 "O Diabo Chileno"