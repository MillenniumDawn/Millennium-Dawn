 france_md.509.t: "ECO 도입"
 france_md.509.d: "프랑스는 CFA 프랑을 서아프리카의 새로운 공동 통화인 ECO로 대체할 것을 제안했습니다. 이를 채택하면 통화 자율성이 높아지고 프랑스와의 관계가 더욱 긴밀해질 것입니다."
 france_md.509.a: "ECO를 채택한다"
 france_md.509.b: "제안을 거절한다"
