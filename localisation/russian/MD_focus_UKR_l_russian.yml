 ukr_modernize_sov_equipment_t55_next_modernization_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_t55_modernized_for_tooltip\n\n\n\n\n\n\n\n\n§W§YХКБМ§! может взяться за ещё один проект модернизации §YТ-55§!. Уже разработанные варианты повторно не предлагаются.§!\n\n$UKR_rada_modernization_adoption_tt$\n\nСтоимость разработки зависит от десятилетия, в котором начинается программа. Для выбора проекта нужны средства на этот этап."
