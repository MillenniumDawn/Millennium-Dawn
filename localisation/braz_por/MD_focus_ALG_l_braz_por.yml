 ALG_deep_state_oversight_desc: "O establishment militar mantém supervisão significativa sobre as decisões do governo. Os generais devem aprovar as principais iniciativas políticas antes de sua implementação.\n\n§YEstágio 3 do Estado Profundo Ativo§!"
 ALG_deep_state_control_desc: "Le Pouvoir - o estado profundo - controla efetivamente o governo argelino das sombras. Os políticos civis são meros figurantes.\n\n§REstágio 4 do Estado Profundo Ativo - CRÍTICO!§!\n§YO risco de golpe aumenta significativamente!§!"
 ALG_surveillance_state_1_desc: "Os serviços de inteligência monitoram as atividades civis com supervisão mínima. A privacidade é um luxo que poucos podem pagar.\n\n§RIsso contribui significativamente para o poder do Estado Profundo.§!"
 ALG_military_junta_1_desc: "Os militares tomaram o controle direto do Estado argelino. Um conselho de generais agora governa a nação.\n\n§RUM GOLPE MILITAR OCORREU!§!\n\nA governança democrática terminou. O estado profundo governa abertamente."
 ALG_state_of_emergency_desc: "Poderes de emergência foram invocados para combater a crescente influência do estado profundo. As liberdades civis estão temporariamente suspensas.\n\n§GO crescimento do Estado Profundo está CONGELADO enquanto isto estiver ativo.§!\n§RIsso não pode ser mantido indefinidamente.§!"
 ALG_post_coup_recovery_desc: "A Argélia se recupera de um golpe militar fracassado. As instituições estão danificadas e a confiança no governo é baixa.\n\n§YA nação precisa se reconstruir.§!"
 ALG_promised_elections_desc: "O governo militar prometeu realizar eleições e restaurar o governo civil. A comunidade internacional está observando.\n\n§YAs eleições devem ser realizadas antes que isto expire.§!"
 ALG_deep_state_oversight_added_tt: "§YSupervisão Militar Estabelecida§!\nOs militares agora têm supervisão formal das decisões do governo.\n\n§RA influência do Estado Profundo é ALTA.§!"
 ALG_deep_state_control_added_tt: "§RControle do Estado Profundo Estabelecido§!\nLe Pouvoir agora controla a Argélia das sombras.\n\n§ROS RISCOS DE GOLPE SÃO CRÍTICOS!§!"
 ALG_surveillance_state_added_tt: "§REstado de Vigilância Ativado§!\nOs serviços de inteligência agora monitoram amplamente as atividades civis."
 ALG_military_junta_added_tt: "§R£generic_warning JUNTA MILITAR ESTABELECIDA!§!\nOs generais tomaram o poder. A Argélia está sob regime militar."
 ALG_state_of_emergency_added_tt: "§YESTADO DE EMERGÊNCIA DECLARADO§!\nOs poderes de emergência agora estão em vigor.\n§GO crescimento do Estado Profundo está congelado por 180 dias.§!"
 ALG_state_of_emergency_removed_tt: "§YO Estado de Emergência terminou.§!\n§RO Estado Profundo pode voltar a crescer.§!"
 ALG_post_coup_recovery_added_tt: "§YPeríodo de Recuperação Pós-Golpe§!\nA Argélia está se reconstruindo após a tentativa de golpe fracassada."
 ALG_promised_elections_added_tt: "§YEleições foram prometidas.§!\nOs militares têm 2 anos para cumprir esse compromisso."
