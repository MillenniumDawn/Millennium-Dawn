 RULE_REMOVE_MICRO_STATES_SMALLER: "소국"
 RULE_REMOVE_MICRO_STATES_SMALLER_DESC: "극소 국가에 더해 부탄, 감비아, 지부티 등 약간 더 큰 국가들을 제거합니다."
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT: "확장 제거"
 RULE_REMOVE_MICRO_STATES_INSIGNIFICANT_DESC: "성능 향상을 극대화하기 위해 모든 소국과 더불어 라오스, 수리남, 가이아나 등 추가적인 국가들까지 제거합니다."
 RULE_ENABLE_RESOURCE_STORAGE_SYSTEM: "§Y자원 저장 시스템§! 활성화"
 RULE_OPTION_ENABLE_RESOURCE_STORAGE_SYSTEM: "원자재를 저장할 수 있는 §Y자원 저장 시스템§!을 활성화합니다. 하루마다 극심한 렉이 발생한다면 이 기능을 비활성화하십시오. 비활성화해도 게임 플레이에 실질적인 손실은 없습니다."
 RULE_OPTION_DISABLE_RESOURCE_STORAGE_SYSTEM: "Disables the §YResource Storage System§!, which allows you to store raw materials."
 RULE_CARRIER_ONLY_RAIDS: "항공모함 전용 습격 활성화"
 RULE_CARRIER_ONLY_RAIDS_NO: "Disables aircraft carrier only raids. This does not impact the ability to use aircraft carrier raids, but use this if you are frequently having issues with carrier air where they are moving from the aircraft carrier to airbases."
 RULE_CARRIER_ONLY_RAIDS_YES: "항공모함 전용 습격을 활성화합니다. 이는 항공모함에서만 출격할 수 있도록 허용하는 기존 습격 시스템의 복제본입니다."
 RULE_RAID_DOCTRINE_REACH: "습격 시 교리 범위 적용"
 RULE_RAID_DOCTRINE_REACH_NO: "습격에 대한 개입 교리 범위 검사를 비활성화합니다. 플레이어(그리고 AI)는 대외 정책 교리와 상관없이 가시적인 모든 대상을 상대로 습격을 준비할 수 있습니다. 단, 전쟁 상태, 관계도, 세력 검사는 여전히 적용됩니다."
 RULE_RAID_DOCTRINE_REACH_YES: "기본 동작입니다. 개입 교리에 따라 습격 대상이 제한됩니다: §Y고립주의§!와 §Y지역 안보§!는 평화 시 습격 불가, §Y제한적 개입주의§!는 인접국만 가능, §Y지역 개입주의§!는 동일 대륙 내 대상만 가능합니다. 전쟁 중일 경우 이 제한은 항상 무시됩니다."
 RULE_ALLOW_CPD_AI_OFFERS: "AI 조건부 평화 제안 허용"
 RULE_OPTION_CPD_AI_OFFERS_YES_DESC: "전쟁 중인 AI 국가들이 정기적으로 진행 중인 분쟁을 평가하고, 전쟁에서 이길 수 없거나 교착 상태라고 판단할 때 §Y조건부 평화 협정§!을 제안할 수 있도록 허용합니다. 종주국 또한 외교권이 제한된 종속국을 대신해 협상할 수 있습니다."
 RULE_OPTION_CPD_AI_OFFERS_NO_DESC: "AI 국가가 독자적으로 §Y조건부 평화 협정§!을 개시하는 것을 막습니다. 플레이어는 여전히 외교 조치를 통해 수동으로 협정을 제안할 수 있습니다."
 RULE_EU_EXPANSION_FOCUS: "EU 행동"
 RULE_EU_EXP_NO: "기본"
 RULE_EU_EXP_NO_DESC: "기본 EU 행동"
 RULE_EU_EXP_YES: "확장 중점"
 RULE_EU_EXP_YES_DESC: "EU가 확대(Enlargement) 법안을 우선시합니다"
 RULE_FREE_FACTORIES_AMOUNT: "플레이어용 무료 공장"
 RULE_FREE_FACTORIES_AMOUNT_OFF: "끄기"
 RULE_FREE_FACTORIES_AMOUNT_OFF_DESC: "플레이어는 게임 시작 시 무료 공장을 받지 않습니다."
 RULE_FREE_FACTORIES_AMOUNT_ONE: "민간 1개 + 군수 1개"
 RULE_FREE_FACTORIES_AMOUNT_ONE_DESC: "모든 인간 플레이어는 게임 시작 시 장외(offsite) 민간 공장 1개와 장외 군수 공장 1개를 받습니다."
 RULE_FREE_FACTORIES_AMOUNT_TWO: "민간 2개 + 군수 2개"
 RULE_FREE_FACTORIES_AMOUNT_TWO_DESC: "모든 인간 플레이어는 게임 시작 시 장외(offsite) 민간 공장 2개와 장외 군수 공장 2개를 받습니다."
 RULE_FREE_FACTORIES_AMOUNT_THREE: "민간 3개 + 군수 3개"
 RULE_FREE_FACTORIES_AMOUNT_THREE_DESC: "모든 인간 플레이어는 게임 시작 시 장외(offsite) 민간 공장 3개와 장외 군수 공장 3개를 받습니다."
 RULE_FREE_FACTORIES_AMOUNT_FIVE: "민간 5개 + 군수 5개"
 RULE_FREE_FACTORIES_AMOUNT_FIVE_DESC: "모든 인간 플레이어는 게임 시작 시 장외(offsite) 민간 공장 5개와 장외 군수 공장 5개를 받습니다."
 RULE_OPTION_DEN_EUROSCEPTIC: "Out of the Union"
 RULE_OPTION_DEN_SOCIALIST: "The Red Flag over Christiansborg"
 RULE_OPTION_DEN_MONARCHIST: "The Crown Restored"
 RULE_OPTION_DEN_NATIONALIST: "Denmark for the Danes"
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES: "The Christian Centre"
 RULE_OPTION_NRY_PROGRESS: "Norway for the Norwegians"
 RULE_OPTION_MNT_SERBIAN_UNION: "Serbian Nationalism"
 RULE_OPTION_MNT_SERBIAN_UNION_DESC: "§8Serb nationalist parties§! ascend to power, elevate Serbian culture and Orthodox Church authority, and align Montenegro economically and politically with Serbia and Russia. Montenegro's trajectory culminates in political union with Serbia, reversing the independence achieved a generation before."
 RULE_OPTION_MNT_NEUTRAL_HARBOUR: "Armed Neutrality"
 RULE_OPTION_MNT_NEUTRAL_HARBOUR_DESC: "The Đukanović government rejects both EU/NATO integration and Serbian/Russian alignment, instead declaring permanent armed neutrality on the Swiss model. Montenegro's free harbour becomes a trading post open to all blocs, exploiting its strategic Adriatic position for maximum commercial advantage."
 RULE_FICTIONAL_CONTENT: "가상 콘텐츠 및 밈 콘텐츠"
 RULE_FICTIONAL_CONTENT_NO_DESC: "§Y기본값§!. 리히텐슈타인의 알래스카 매입과 신성 로마 제국 복원, 남오세티야의 스키타이 부활, 쿠바에서 테사크의 집권, 간혹 등장하는 터무니없는 무작위 사건, 모드 곳곳에 숨겨진 각종 이스터 에그를 포함한 농담성 및 비역사적 콘텐츠가 비활성화된 상태로 유지됩니다."
 RULE_FICTIONAL_CONTENT_YES_DESC: "리히텐슈타인의 알래스카 매입과 신성 로마 제국 복원, 남오세티야의 스키타이 부활, 쿠바에서 테사크의 집권, 간혹 등장하는 터무니없는 무작위 사건, 모드 곳곳에 숨겨진 각종 이스터 에그를 포함한 농담성 및 비역사적 콘텐츠를 활성화합니다."
 RULE_PLAYER_INSTANT_JUSTIFICATION: "즉시 전쟁 명분 정당화 (플레이어 전용)"
 RULE_YES_PLAYER_INSTANT_JUSTIFICATION_DESC: "모든 인간 플레이어는 §Y전쟁의 명분§! 국가 정신을 가지고 시작하며, 전쟁 명분 정당화 시간이 §G-100%§! 감소합니다. AI는 이를 받지 않습니다."
 RULE_NO_PLAYER_INSTANT_JUSTIFICATION_DESC: "전쟁 명분 정당화에 모두에게 동일하게 일반적인 시간이 소요됩니다."
 RULE_OPTION_JAP_HISTORICAL: "역사적"
 BOS_AI_BEHAVIOR: "@BOS 보스니아 헤르체고비나"
 SIA_AI_BEHAVIOR: "@SIA 태국"
 RULE_AFG_TALIBAN_INSURGENCY_INTENSITY: "@AFG 탈레반 반란"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT: "역사적"
 RULE_AFG_TALIBAN_INSURGENCY_DEFAULT_DESC: "탈레반 반란은 통상적인 속도로 커지고 잦아듭니다."
 RULE_AFG_TALIBAN_INSURGENCY_WEAK: "억제됨"
 RULE_AFG_TALIBAN_INSURGENCY_WEAK_DESC: "탈레반의 재건 속도가 절반으로 줄어듭니다. 반란 진압 노력이 성과를 거두며, 아프가니스탄은 현실적으로 반란을 근절할 수 있습니다."
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS: "끈질김"
 RULE_AFG_TALIBAN_INSURGENCY_RELENTLESS_DESC: "탈레반의 재건 속도가 1.5배로 빨라집니다. 나라를 하나로 유지하는 일은 한 번 해결하면 끝나는 문제가 아니라 영구적인 작전이 됩니다."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING: "@AFG 북부동맹 봉기"
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_ALLOWED_DESC: "탈레반이 내전에서 승리하면 북부동맹이 몇 달 후 이스마일 칸의 지휘 아래, 2020년부터는 아흐마드 마수드의 지휘 아래 다시 일어섭니다."
 RULE_AFG_NORTHERN_ALLIANCE_UPRISING_BLOCKED_DESC: "탈레반의 승리는 최종적입니다. 북부에 제2전선이 열리지 않습니다."
 RULE_OPTION_FRA_COMMUNE: "프랑스 코뮌"
 RULE_OPTION_FRA_COMMUNE_DESC: "§8프랑스 공산당§!과 급진 좌파는 제5공화국을 무너뜨리고 프랑스 코뮌을 선포합니다. 프랑스는 서방 진영을 떠나 대륙의 모든 수도를 경악시키는 혁명 노선을 택합니다."
 RULE_OPTION_FRA_KINGDOM: "프랑스 왕국"
 RULE_OPTION_FRA_KINGDOM_DESC: "왕당파 쿠데타가 공화국을 끝내고 부르봉 또는 오를레앙 왕위 계승 주장자를 프랑스 국왕으로 옹립합니다. 복원된 군주제는 브뤼셀에 등을 돌리고 이웃 나라들과의 오랜 다툼을 되살립니다."
 RULE_OPTION_FRA_EMPIRE: "프랑스 제국"
 RULE_OPTION_FRA_EMPIRE_DESC: "보나파르트주의 쿠데타가 공화국을 끝내고 새로운 프랑스 제국을 선포합니다. 제국은 독일과 영국 모두에 맞서는 대륙적 야망을 추구합니다."
 VEN_AI_BEHAVIOR: "@VEN 베네수엘라"
 ALG_AI_BEHAVIOR: "@ALG 알제리"
 RULE_OPTION_ALG_HISTORICAL: "부테플리카 시대"
 RULE_OPTION_ALG_HISTORICAL_DESC: "대통령직은 사면으로 암흑의 10년을 마무리하고 §8민족해방전선§!과 그 동맹들을 결집시키지만, §8히라크§! 행진이 이 노인을 몰아낼 때까지 이어집니다. 알제리는 아랍 및 아프리카 외교의 기둥으로 남고, 국내에서는 장성들이 최종 결정권을 쥐고 있습니다."
 RULE_OPTION_ALG_LE_POUVOIR: "르 푸부아르의 존속"
 RULE_OPTION_ALG_LE_POUVOIR_DESC: "대통령직은 결코 장성들로부터 벗어나지 못하며, §8르 푸부아르§!는 §8히라크§!에 개혁이 아닌 체포로 응수합니다. 알제리는 민간의 외피를 유지하지만 그 뒤에서는 안보 기관이 모든 것을 결정합니다."
 RULE_OPTION_ALG_HIRAK_DEMOCRACY: "히라크의 승리"
 RULE_OPTION_ALG_HIRAK_DEMOCRACY_DESC: "매주 이어지는 행진은 대통령직에서 멈추지 않으며, §8히라크§!가 과두 세력을 무너뜨리고 르 푸부아르를 해체합니다. 알제리는 진정한 민간 헌법을 제정하고 마그레브 최초의 진정한 민주주의 국가가 됩니다."
 RULE_OPTION_ALG_MILITARY_JUNTA: "장성들의 집권"
 RULE_OPTION_ALG_MILITARY_JUNTA_DESC: "§8국민인민군§!이 가식을 끝내고 헌법을 정지시키며 알제리를 직접 통치합니다. 나라는 안으로 움츠러들고, 이웃 국가들은 국경에 주둔 국가가 들어선 것을 마주합니다."
 RULE_OPTION_ALG_ISLAMIST: "이슬람주의 알제리"
 RULE_OPTION_ALG_ISLAMIST_DESC: "§8평화사회운동§!과 §8엔나흐다§!는 무장 투쟁이 아닌 투표를 통해 승리하고, 의회, 법원, 모스크를 통해 이슬람 공화국을 건설합니다. 알제리는 북아프리카 전역에서 정치적 이슬람의 대변자가 됩니다."
 RULE_OPTION_ALG_FIS_UPRISING: "구국전선의 귀환"
 RULE_OPTION_ALG_FIS_UPRISING_DESC: "§8이슬람구국전선§!은 결코 제압되지 않았으며, 군부에 빼앗겼던 선거 승리를 되찾습니다. 암흑의 10년은 반군의 조건으로 끝나고, 알제리는 사헬 전역의 무장 이슬람주의 기지가 됩니다."
 RULE_OPTION_ETH_HISTORICAL: "역사적"
 RULE_OPTION_ETH_HISTORICAL_DESC: "에티오피아는 보건, 교육, 종교의 자유 분야의 진전을 통해 연방 민주공화국을 강화합니다. §8EPRDF§! 연립은 정치적 연속성을 유지하면서 아프리카 연합과의 관계를 심화합니다."
 RULE_OPTION_ETH_MONARCHIST_RESTORATION: "왕관의 귀환"
 RULE_OPTION_ETH_MONARCHIST_RESTORATION_DESC: "에티오피아는 §8에티오피아 왕실 평의회§!를 복원하고 제라 야코브 암하 셀라시에를 왕좌에 초대합니다. 의회의 역할이 축소되면서 황제의 권력이 다시 자리를 잡고, 에리트레아에 대한 영유권 주장이 되살아납니다."
 RULE_CORPORATE_HISTORY: "기업 역사"
 RULE_CORPORATE_HISTORY_FULL: "전체"
 RULE_CORPORATE_HISTORY_FULL_DESC: "기업 역사는 직접 작성된 산업 선택지를 역사적 이정표 시점에 제시합니다. 이것이 일반 설정입니다."
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY: "결과만"
 RULE_CORPORATE_HISTORY_OUTCOMES_ONLY_DESC: "기업 역사는 사건 선택지를 보여 주거나 일회성 보상을 부여하지 않고, 역사적 경로와 그 지속적인 국가 효과를 조용히 적용합니다."
 RULE_CORPORATE_HISTORY_OFF: "끔"
 RULE_CORPORATE_HISTORY_OFF_DESC: "기업 역사는 주를 생성하지 않고 사건을 예약하지 않습니다. 고유 국가 콘텐츠는 그대로 유지됩니다."
 RULE_OPTION_ARM_PEOPLES_PARTY: "인민당의 귀환"
 RULE_OPTION_HOL_HISTORICAL: "역사적"
 RULE_OPTION_HOL_HISTORICAL_DESC: "포르튀인 충격 이후 §8노동당§!은 나라를 §8기독민주당§!에 넘기고, §8자유당§!은 한 세대 동안 정권을 유지하며, 이어 §8자유당(PVV)§!과 §8민주66§!이 차례로 뒤를 잇습니다. 네덜란드는 이들 모든 연립 정권 아래에서 NATO와 유럽 연합의 중심축으로 남습니다."
 RULE_OPTION_HOL_WESTERN_MONARCHY: "오라녜 복원"
 RULE_OPTION_HOL_WESTERN_MONARCHY_DESC: "복원된 총독제가 왕실을 통해 통치하는 동안 §8삼부회§!는 재정권을 유지하고, 재건된 §8서인도 회사§!는 네덜란드를 다시 대서양으로 이끕니다. 수리남과 가이아나는 네덜란드 통치로 돌아가고, 카리브해는 원조와 대사관을 통해 다루어지며, 룩셈부르크, 아일랜드, 잉글랜드는 오라녜 가문과 동군연합으로 결속됩니다."
 RULE_OPTION_HOL_NATIONALIST_MONARCHY: "투쟁하는 왕관"
 RULE_OPTION_HOL_NATIONALIST_MONARCHY_DESC: "왕권이 복원되고 선거는 중단되며 §8동인도 회사§!는 인도양 전역에 걸친 정복의 도구로 재건됩니다. 실론, 케이프, 바타비아는 무력으로 되찾고, 룩셈부르크, 아일랜드, 잉글랜드에는 혼인 계약 대신 최후통첩이 건네집니다."
 RULE_OPTION_HOL_NVU: "네덜란드 인민연합"
 RULE_OPTION_HOL_NVU_DESC: "§8네덜란드 인민연합§!은 변방에서 성장하여 비넨호프로 진군하고, 야당을 쓸어내 조합주의적이고 자급자족적인 노선으로 경제를 재편합니다. 디츨란트가 통일되고 네덜란드는 프랑스와 영국에 맞서는 게르만 유럽의 지도권을 주장합니다."
 IND_AI_BEHAVIOR: "@IND 인도네시아"
 RULE_OPTION_IND_HISTORICAL: "역사적"
 RULE_OPTION_IND_HISTORICAL_DESC: "인도네시아는 §8민족각성당§!을 중심으로 개혁 시대 공화국을 공고히 하며, 종교적 극단주의와 싸우고 편을 들기보다 말루쿠 분쟁을 중재합니다. 반부패 기구와 서방과의 연대를 기반으로 인도네시아는 동남아시아의 안정적인 민주주의 중심축이 됩니다."
 RULE_OPTION_IND_ISLAMIST: "이슬람 인도네시아"
 RULE_OPTION_IND_ISLAMIST_DESC: "§8이슬람수호전선§!이 거리 활동에서 국가 장악으로 동원 범위를 넓히면서 종교적 급진화가 걷잡을 수 없이 진행됩니다. 인도네시아는 이웃 나라들에 영토적·이념적 영유권을 압박하고 자국 군도 전역에서 지배권을 주장하는 샤리아 공화국으로 해체됩니다."
 RULE_OPTION_MD_RANDOM_PATH: "무작위 경로"
 RULE_OPTION_MD_RANDOM_PATH_DESC: "게임이 시작될 때 AI가 이 국가의 경로 중 하나(역사적 경로든 대체 경로든)를 무작위로 선택합니다. 어떤 경로가 선택되었는지는 플레이어에게 공개되지 않습니다."
 RULE_OPTION_MD_NO_PATH: "경로 없음"
 RULE_OPTION_MD_NO_PATH_DESC: "AI는 정해진 경로를 따르지 않으며 게임이 전개됨에 따라 중점을 자유롭게 선택합니다. 플레이할 때마다 행동이 달라집니다."
 RULE_OPTION_ITA_HISTORICAL: "역사적"
 RULE_OPTION_ITA_HISTORICAL_DESC: "권력은 §8민주당§!과 §8포르차 이탈리아§! 블록 사이를 오가고, 이탈리아는 NATO와 유럽 연합에 닻을 내린 채 유지됩니다. 정부들은 국경이 아니라 조직범죄, 공공 부채, 남부 문제, 그리고 자체 행정에 기력을 소진합니다."
 RULE_OPTION_ITA_ROMAN_RESTORATION: "로마 제국의 복원"
 RULE_OPTION_ITA_ROMAN_RESTORATION_DESC: "§8이탈리아 형제들§!과 민족 우파는 선거에서 승리할 때까지 성장하여 의회를 해산하고 복원된 로마 위에 황제를 대관시킵니다. 이탈리아는 이어 아프리카 해안에서 브리타니아까지 옛 제국의 속주들을 하나씩 요구합니다."
 RULE_OPTION_ITA_MARCH_ON_ROME: "제2의 로마 진군"
 RULE_OPTION_ITA_MARCH_ON_ROME_DESC: "같은 운동이 집권하지만 공화국은 유지하며 로마에 §8파시스트§! 정부를 세웁니다. 이탈리아는 제국을 노리지 않은 채 아드리아해와 알프스에 대한 영토 회복주의적 요구를 압박합니다."
 RULE_OPTION_ITA_EASTERN_TURN: "동쪽으로의 전환"
 RULE_OPTION_ITA_EASTERN_TURN_DESC: "§8공산주의 재건당§!과 §8이탈리아 공산주의자당§!은 이탈리아 좌파를 재건하고 나라를 NATO에서 끌어냅니다. 이탈리아는 모스크바와 베이징에 구애하며 상하이 협력 기구에서 자리를 찾습니다."
 RULE_OPTION_JAP_HISTORICAL_DESC: "§8자유민주당§!은 국회를 유지하고, 워싱턴과의 동맹은 지속되며, 자위대는 적대적인 주변 환경이 강요하는 만큼만 정상화됩니다. 일본은 부실 채권을 상각하고 출산율 붕괴와 과로사 위기에 맞서 입법하며 헌법 9조는 그대로 둡니다."
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE: "제국의 귀환"
 RULE_OPTION_JAP_RETURN_OF_THE_EMPIRE_DESC: "§8유신당§!은 왕좌가 권력으로 복귀하고 헌법 9조가 삭제될 때까지 민족주의 우파에서 성장합니다. 일본은 원양 함대를 앞세워 재무장하고 쿠릴 열도, 한국, 대만, 태평양의 옛 세력권을 무력으로 되찾습니다."
 RULE_OPTION_TUR_HISTORICAL: "역사적"
 RULE_OPTION_TUR_HISTORICAL_DESC: "은행 위기는 §8미덕당§!을 파괴하고, 거기서 갈라져 나온 §8정의개발당§!이 나라를 차지합니다. 튀르키예는 중동과 발칸에서 신오스만주의 외교로 돌아서고 대통령직은 서서히 의회를 능가해 갑니다."
 RULE_OPTION_TUR_KEMALIST_GUARD: "케말주의 수호대"
 RULE_OPTION_TUR_KEMALIST_GUARD_DESC: "이슬람주의자들은 재결집하기 전에 금지되고 §8세속 공화국§!은 참모본부 뒤로 대오를 정비합니다. 튀르키예는 NATO에 닻을 내린 채 남고 쿠르드 문제에는 개혁이 아닌 군대로 대응합니다."
 RULE_OPTION_TUR_GREY_WOLVES: "회색 늑대"
 RULE_OPTION_TUR_GREY_WOLVES_DESC: "§8민족주의 우파§!가 의회를 장악하고 선거를 끝내며 복원된 오스만 국가 위에 술탄을 대관시킵니다. 튀르키예는 트라키아, 코카서스, 튀르크 세계 전역에 영유권을 압박합니다."
 RULE_OPTION_TUR_HIZMET: "히즈메트 운동"
 RULE_OPTION_TUR_HIZMET_DESC: "§8귈렌주의자§! 네트워크는 미덕당의 잔해를 물려받아 투표함이 아닌 법원, 경찰, 학교를 통해 국가를 차지합니다. 튀르키예는 해외에는 온건한 이슬람을 투사하면서 조용히 자국 제도를 속 빈 껍데기로 만들어 갑니다."
 RULE_OPTION_TUR_TURKISH_LEFT: "튀르키예 좌파의 귀환"
 RULE_OPTION_TUR_TURKISH_LEFT_DESC: "반체제 표심이 이슬람주의자들이 아니라 §8혁명적 좌파§!로 쏠립니다. 튀르키예는 NATO를 탈퇴하고 소수 민족을 승인하며 스스로를 지역의 반제국주의 선봉으로 내세웁니다."
 RULE_OPTION_TUR_GREAT_EAST: "대동방"
 RULE_OPTION_TUR_GREAT_EAST_DESC: "미덕당이 집권하여 참모본부를 무력화한 뒤 공화국을 해체하는 §8살라피스트§! 운동으로 급진화합니다. 튀르키예는 칼리파국을 선포하고 닿을 수 있는 모든 방향으로 팽창합니다."
 RULE_OPTION_ENG_HISTORICAL: "역사적"
 RULE_OPTION_ENG_HISTORICAL_DESC: "§8노동당§!은 블레어와 브라운 아래 계속 통치하다가 §8보수당§!이 집권하여 총리직을 지도자 계보를 따라 물려주고, 노동당이 스타머 아래 복귀합니다. 영국은 유럽 연합을 탈퇴하고 미국 동맹을 유지하며 연합 왕국을 지켜 냅니다."
 RULE_OPTION_ENG_RISE_OF_BRITAIN: "영국의 부상"
 RULE_OPTION_ENG_RISE_OF_BRITAIN_DESC: "영국은 의회 민주주의 국가로 남아 정복이 아닌 매수로 제국을 재건하며, 옛 식민지의 언론, 정당, 부처를 사들입니다. 카리브해에서 태평양에 이르는 정부들은 총성 한 번 없이 다시 런던에 응합니다."
 RULE_OPTION_CHI_HISTORICAL: "위대한 부흥"
 RULE_OPTION_CHI_HISTORICAL_DESC: "§8상하이방§!은 당을 §8퇀파이§!에 넘기고 퇀파이는 시진핑에게 넘기며, 홍콩의 자치는 차례로 해체됩니다. 베이징은 전쟁을 벌이지 않으면서 남중국해와 해협 건너편에 대한 영유권을 압박합니다."
 RULE_OPTION_CHI_HEGEMON: "복원된 중화"
 RULE_OPTION_CHI_HEGEMON_DESC: "§8충칭 모델§!은 보시라이를 지도부에 올려놓고 §8전랑 외교관들§!은 일찍부터 고삐가 풀립니다. 중국은 히말라야 국경을 무력으로 정리하고 부탄, 네팔, 인도를 굴복시키며 외몽골을 되찾고 대만을 일격에 점령합니다."
 RULE_OPTION_CHI_PEACEFUL_RISE: "평화적 부상"
 RULE_OPTION_CHI_PEACEFUL_RISE_DESC: "쩡칭훙은 장쩌민의 조직을 물려받고 §8상하이 테크노크라트§!는 덩샤오핑의 노선을 고수합니다. 일국양제는 지켜지고, 티베트와 신장은 캠페인이 아닌 법령으로 통치되며, 통일은 협상 테이블에서 추진됩니다."
 RULE_OPTION_BHR_HISTORICAL: "알 할리파 헌장"
 RULE_OPTION_BHR_HISTORICAL_DESC: "왕실은 국민 헌장과 선출 의회로 평화를 사들인 뒤, 광장이 가득 차자 사우디 기갑 부대를 동원해 §82월 14일 청년 연합§!을 분쇄합니다. 바레인은 미국 함대의 항구로 남으며, 리야드에게 가장 믿음직한 피보호국이 됩니다."
 RULE_OPTION_BHR_DAY_OF_RAGE: "분노의 날"
 RULE_OPTION_BHR_DAY_OF_RAGE_DESC: "§8알웨파크§!는 시아파 다수파가 그동안 거부당해 온 정부에 마침내 스스로 표를 던져 들어갈 수 있을 때까지 로터리를 점거합니다. 바레인은 군주제를 폐지하고 공화국이 되며, 리야드 대신 테헤란에 응답하게 됩니다."
 RULE_OPTION_BHR_CROWNED_DEMOCRACY: "헌정 타협"
 RULE_OPTION_BHR_CROWNED_DEMOCRACY_DESC: "왕실은 §8와아드§!와 그 경쟁 정당들을 합법화하고 실질적인 의회에 통치의 권한을 넘기며, 왕좌를 논쟁의 한가운데가 아니라 그 위에 둡니다. 바레인은 서방 진영을 떠나지 않은 채 걸프 지역 최초의 작동하는 민주주의 국가가 됩니다."
 RULE_OPTION_BOT_HISTORICAL: "BDP의 장기 집권"
 RULE_OPTION_BOT_HISTORICAL_DESC: "§8보츠와나 민주당§!은 대통령직을 자기 당 사람에게서 다음 사람에게 넘기며 출마하는 모든 선거에서 승리하고, 다이아몬드 수익은 학교와 진료소, 그리고 에이즈와의 싸움 비용을 댑니다. 보츠와나는 비동맹이자 재정이 건전한 대륙의 조용한 성공 사례로 남고, 이웃 나라들이 말하지 못하는 것을 소리 내어 말하는 것을 주저하지 않습니다."
 RULE_OPTION_BOT_POLITICAL_RAINBOW: "우산이 펼쳐지다"
 RULE_OPTION_BOT_POLITICAL_RAINBOW_DESC: "야당은 표를 나누어 갖는 것을 멈추고 §8민주 변화를 위한 우산§! 뒤에 결집하여, 독립 이래 §8보츠와나 민주당§!이 쥐어 온 지배력을 깨뜨립니다. 보츠와나는 최초의 정권 교체를 이루고, 남아프리카는 해방 정당도 투표로 물러날 수 있다는 증거를 얻습니다."
 RULE_OPTION_BOT_KGOSIKGOLO: "크고시크골로 추대"
 RULE_OPTION_BOT_KGOSIKGOLO_DESC: "§8디크고시§!는 자문 기구에 불과했던 족장원을 권력의 자리로 바꾸고 자기들 중 한 명을 온 나라의 최고 족장으로 추대합니다. 선거는 전통 군주제에 자리를 내주고, 대륙의 모범 민주주의 국가는 이웃 나라들이 더 이상 알아볼 수 없는 무언가가 됩니다."
 BLR_AI_BEHAVIOR: "@BLR 벨라루스"
 RULE_OPTION_BLR_HISTORICAL: "유럽 최후의 독재자"
 RULE_OPTION_BLR_HISTORICAL_DESC: "알렉산드르 루카셴코는 정적들을 투옥하고 경제를 루블에 묶으며 §8청바지 혁명§!을 진압 병력으로 분쇄합니다. 벨라루스는 모스크바의 가장 가까운 동맹으로 남으면서 유럽에서 가장 고립된 정부가 됩니다."
 RULE_OPTION_BLR_EUROPEAN_BELARUS: "유럽 벨라루스"
 RULE_OPTION_BLR_EUROPEAN_BELARUS_DESC: "안드레이 사니코프는 §8유럽 벨라루스§! 캠페인으로 대통령직을 차지하고 나라를 루블에서 브뤼셀 쪽으로 돌려세웁니다. 벨라루스는 NATO와 유럽 연합에 가입을 신청하며, 러시아는 스몰렌스크 서쪽에서 기대하던 입지를 잃습니다."
 RULE_OPTION_BLR_TIKHANOVSKAYA: "치하놉스카야 혁명"
 RULE_OPTION_BLR_TIKHANOVSKAYA_DESC: "루카셴코는 한 세대 동안 도전받지 않고 통치하다가, 조작된 선거로 인해 스베틀라나 치하놉스카야가 진압 경찰도 꺾을 수 없는 §8조정 위원회§!의 수장 자리에 오릅니다. 벨라루스는 이웃 나라들보다 훨씬 늦게 서방으로 돌아서며, 이미 러시아 사단들이 국경에 배치되어 있습니다."
 RULE_OPTION_BLR_POPULAR_FRONT: "민족 부흥"
 RULE_OPTION_BLR_POPULAR_FRONT_DESC: "자논 파즈냑은 벨라루스화 강령을 내걸고 §8벨라루스 인민전선§!을 집권시켜 소련 장교들을 숙청하고 대공국의 기억을 되살립니다. 벨라루스는 모스크바에 등을 돌리고, 한때 빌뉴스에 복속했던 모든 이웃 나라에 영유권을 주장합니다."
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS: "민족볼셰비키의 반란"
 RULE_OPTION_BLR_NATIONAL_BOLSHEVIKS_DESC: "§8민족볼셰비키§!는 거리 시위를 거쳐 정권을 장악한 뒤 노동군과 당 민병대를 앞세워 소비에트 질서를 재건하고, 모스크바의 비호 속에 폴란드, 우크라이나, 발트 3국에 맞서 군비를 증강하게 됩니다."
 RULE_OPTION_BLR_LITBEL: "리트벨 부활"
 RULE_OPTION_BLR_LITBEL_DESC: "§8벨라루스 공산당§!이 다시 집권하여 옛 리투아니아-벨로루시 공화국을 건국 사업으로 삼습니다. 벨라루스는 가능한 곳에서는 영향력으로, 불가능한 곳에서는 무력으로 리투아니아와 라트비아를 사회주의 연방으로 다시 끌어들입니다."
 RULE_OPTION_BLR_OLIGARCHY: "과두 지배자의 거래"
 RULE_OPTION_BLR_OLIGARCHY_DESC: "시아르헤이 하이두키에비치와 §8자유민주당§!은 루카셴코의 이념을 더 노골적인 장사로 맞바꾸고, 모스크바에 대한 접근권을 받을 수 있는 최고가에 팔아넘깁니다. 벨라루스는 러시아의 영향권에 남지만 연방 국가를 신조가 아닌 계약으로 취급합니다."
 RULE_OPTION_BOS_HISTORICAL: "데이턴 체제"
 RULE_OPTION_BOS_HISTORICAL_DESC: "순환 대통령제는 국제 감독 아래 유지되고, §8민주행동당§!은 세르비아계 및 크로아티아계 경쟁 세력을 이기려 하는 대신 그들과 국가를 공유합니다. 보스니아는 NATO와 유럽 평화유지군의 보호 아래 재건되고, 나라가 무엇인지 결코 정리하지 못한 채 브뤼셀 쪽으로 서서히 다가갑니다."
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP: "스르프스카가 의장석을 차지하다"
 RULE_OPTION_BOS_SRPSKA_PARTNERSHIP_DESC: "§8독립 사회민주동맹§!이 대통령직을 차지하고 연방은 그대로 둔 채 사라예보를 베오그라드와 모스크바 쪽으로 돌려세웁니다. 보스니아는 무력이 아닌 합의로 서방의 영향권을 떠나며, 러시아는 발칸에서 두 번째 거점을 얻습니다."
 RULE_OPTION_BOS_SRPSKA_UNION: "스르프스카 우선"
 RULE_OPTION_BOS_SRPSKA_UNION_DESC: "§8세르비아 민주당§!은 바냐루카 아래 온 나라를 중앙집권화하고 세르비아와의 통합을 협상합니다. 보스니아는 대세르비아 국가에 흡수되고, 이웃 나라들은 다시 그려진 지도를 마주하게 됩니다."
 RULE_OPTION_BOS_ISLAMIST_REVIVAL: "보스니아크의 각성"
 RULE_OPTION_BOS_ISLAMIST_REVIVAL_DESC: "보스니아크의 원한이 종교적 부흥으로 굳어지고, §8민족 각성당§!은 자신들의 방식대로 전쟁을 끝내기 위해 공화국을 재무장시킵니다. 보스니아는 평화유지군을 돌려보내고 자국의 구성체들과 이어 이웃 나라들에 칼끝을 돌립니다."
 RULE_OPTION_BOS_WORKERS_STATE: "노동자 평의회"
 RULE_OPTION_BOS_WORKERS_STATE_DESC: "대량 실업이 §8노동자 전선§!을 민족 정당들 위로 밀어 올리고, 보스니아의 산업은 그곳에서 일하는 사람들의 평의회로 넘어갑니다. 국가는 세속적이고 자주 관리적으로 바뀌며, 브뤼셀에도 베오그라드에도 응하지 않습니다."
 RULE_OPTION_BRA_HISTORICAL: "룰라의 시대"
 RULE_OPTION_BRA_HISTORICAL_DESC: "§8노동자당§!은 마침내 대통령직을 차지하고 빈곤층 현금 지원을 정통 재정 정책과 함께 추진하다가, 부패 수사로 좌파가 속이 비게 되자 전직 육군 대위에게 궁을 넘겨줍니다. 브라질은 구애를 받는 중견국으로 성장하여 워싱턴과 논쟁을 벌이면서도 그 영향권을 벗어나지는 않습니다."
 RULE_OPTION_BRA_BROAD_FRONT: "새로운 브라질"
 RULE_OPTION_BRA_BROAD_FRONT_DESC: "§8노동자당§!은 §8브라질 민주운동§! 및 소규모 좌파 정당들과의 폭넓은 연립으로 통치하며, 부패 스캔들에 후퇴가 아닌 개혁으로 응답합니다. 브라질은 입헌 민주주의 국가로 남고, 더 이상 북쪽에 허락을 구하지 않는 남아메리카의 중심축이 됩니다."
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC: "붉은 공화국"
 RULE_OPTION_BRA_SOCIALIST_REPUBLIC_DESC: "§8노동자당§!은 권력 분점을 중단하고 좌파 경쟁자들을 흡수하여 국가를 자신을 중심으로 재편합니다. 브라질은 사회주의 공화국을 선포하고, 받아들이려는 모든 이웃 나라에 그 모델을 수출합니다."
 RULE_OPTION_BRA_LIBERALS: "자유주의 질서"
 RULE_OPTION_BRA_LIBERALS_DESC: "§8브라질 사회민주당§!은 이미 차지한 대통령직을 유지하고 민영화와 물가 목표제를 끝까지 밀어붙입니다. 브라질은 대륙에서 가장 개방적인 경제가 되며 적도 이남에서 가장 안정적인 미국의 파트너가 됩니다."
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS: "사회민주주의자들"
 RULE_OPTION_BRA_SOCIAL_DEMOCRATS_DESC: "§8브라질 사회민주당§!은 §8민주노동당§!과 함께 통치하며 시장 정통주의에서 복지 하한선을 갖춘 발전 국가로 방향을 돌립니다. 브라질은 이자가 아닌 산업과 학교에 지출하며, 워싱턴과 베이징 모두와 거리를 유지합니다."
 RULE_OPTION_BRA_MILITARY_RULE: "대위의 공화국"
 RULE_OPTION_BRA_MILITARY_RULE_DESC: "§8사회자유당§!은 대통령직을 차지하고 옛 독재를 찬양하며 앞을 가로막는 의회를 해산합니다. 브라질은 다시 한번 병영에서 내리는 포고령으로 통치되며, 국경을 접한 사회주의 정부들에 대한 영유권을 압박합니다."
 RULE_OPTION_BRA_MONARCHY: "제국의 복원"
 RULE_OPTION_BRA_MONARCHY_DESC: "§8군주주의자§!의 부활은 민족주의 대통령직을 대관식으로 바꾸고, 오를레앙-브라간사 가문은 한 세기 넘게 비어 있던 왕좌로 돌아옵니다. 브라질은 선거를 폐지하고 옛 시스플라티나 주를 되찾으며 다시 왕관에 응하게 됩니다."
 RULE_OPTION_ARM_HISTORICAL: "카라바흐 일족"
 RULE_OPTION_ARM_HISTORICAL_DESC: "카라바흐 전쟁의 참전용사들은 §8아르메니아 공화당§!을 앞세워 20년간 대통령직을 장악하다가 마침내 거리의 시위로 §8시민계약당§!에게 나라를 넘깁니다. 아르메니아는 안보를 위해 모스크바에 묶여 있으면서 산악 지대를 두고 바쿠와 논쟁을 계속합니다."
 RULE_OPTION_ARM_TER_PETROSIAN: "초대 대통령의 귀환"
 RULE_OPTION_ARM_TER_PETROSIAN_DESC: "§8아르메니아 민족회의§!가 장성들에게 쫓겨났던 건국 대통령을 복귀시키며, 카라바흐파는 결코 차례를 얻지 못합니다. 아르메니아는 산악 지대를 포기하는 대신 열린 국경과 이웃 국가들과의 정상적인 관계를 얻습니다."
 RULE_OPTION_ARM_PEOPLES_PARTY_DESC: "§8아르메니아 인민당§!이 의사당 총격 사건을 이겨내고 거부당했던 국가를 장악합니다. 아르메니아는 소련 시대의 산업과 계획 경제를 바탕으로 재건되며, 캅카스에서 모스크바의 가장 믿음직한 파트너가 됩니다."
 RULE_OPTION_ARM_TSARUKYAN: "과두 지배자의 공화국"
 RULE_OPTION_ARM_TSARUKYAN_DESC: "§8번영 아르메니아§!가 의회를 통째로 사들이고, 나라는 대통령궁이 아닌 한 사업가의 저택에서 운영됩니다. 아르메니아는 부유하지만 부패했으며, 가장 많은 돈을 내는 수도에 팔려 가는 나라가 됩니다."
 RULE_OPTION_ARM_UNITED_STATES: "아르메니아 합중국"
 RULE_OPTION_ARM_UNITED_STATES_DESC: "§8유산당§!과 디아스포라가 공화국을 해외의 모든 아르메니아인을 위한 자리가 마련된 연방으로 다시 씁니다. 아르메니아는 모스크바 대신 로스앤젤레스와 베이루트에서 미래를 찾습니다."
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT: "건국 의회"
 RULE_OPTION_ARM_FOUNDING_PARLIAMENT_DESC: "§8사스나 쩨러§!의 카라바흐 참전용사들이 도둑맞았다고 믿는 공화국을 장악하여 주둔 국가로 통치합니다. 아르메니아는 러시아 기지를 내쫓고 대신 서방에 보장을 요청합니다."
 RULE_OPTION_ARM_MONARCHY: "복원된 왕관"
 RULE_OPTION_ARM_MONARCHY_DESC: "§8아르메니아 멜리크 연합§!이 공화국을 끝내고 6세기 만에 예레반에 왕을 앉힙니다. 아르메니아는 왕좌와 교회로 통치하며, 옛 왕국들이 보유했던 모든 지방에 대한 영유권을 주장합니다."
 RULE_OPTION_ARM_DASHNAK_LEFT: "다슈낙 사회주의"
 RULE_OPTION_ARM_DASHNAK_LEFT_DESC: "§8아르메니아 혁명연맹§!의 사회주의 계파가 당내 논쟁에서 승리하여 창당 신조에 따라 공화국을 재건합니다. 아르메니아는 과두 지배자들의 재산을 국유화하고 제국주의에 어디서든 맞섭니다."
 RULE_OPTION_ARM_DASHNAK_RIGHT: "페다이의 유산"
 RULE_OPTION_ARM_DASHNAK_RIGHT_DESC: "§8아르메니아 혁명연맹§!의 민족주의 계파가 당을 장악하고 산악 전사들의 이름으로 통치합니다. 아르메니아는 잃어버린 땅을 위해 무장하며 그 땅을 되찾으려는 의지를 숨기지 않습니다."
 RULE_OPTION_BUL_HISTORICAL: "브뤼셀로 가는 길"
 RULE_OPTION_BUL_HISTORICAL_DESC: "§8민주세력연합§!은 통화위원회제와 개혁 프로그램을 함께 지켜내고, 그 뒤를 잇는 모든 정부는 같은 두 가지 가입 신청을 테이블 위에 유지합니다. 불가리아는 NATO에, 이어 유럽 연합에 가입하며 동맹에 발칸에서 가장 조용한 국경을 선사합니다."
 RULE_OPTION_BUL_TSARIST_RESTORATION: "차르의 귀환"
 RULE_OPTION_BUL_TSARIST_RESTORATION_DESC: "망명 중이던 §8작센코부르크고타 가문§!은 총리직 이상의 것을 얻기 위해 귀국하여 민족주의 우파를 왕관 뒤로 결집시키고 자신의 이름으로 통치합니다. 불가리아는 서방 가입 신청을 산스테파노에서 약속받았던 국경과 맞바꾸며, 이웃 나라들은 마케도니아 문제가 다시 열린 것을 알게 됩니다."
 RULE_OPTION_BUL_RED_BALKAN: "붉은 발칸의 꿈"
 RULE_OPTION_BUL_RED_BALKAN_DESC: "§8불가리아 공산당§!은 체제 전환의 잔해 속에서 일어나 §8불가리아 사회당§!이 되찾으려 하지 않았던 국가를 차지합니다. 불가리아는 모스크바와 베이징에서 우방을 찾고 발칸을 사회주의 연방으로 만드는 일에 착수합니다."
 RULE_OPTION_CAN_HISTORICAL: "역사적"
 RULE_OPTION_CAN_HISTORICAL_DESC: "§8자유당§!은 중도에서 통치하며 연방 기구에 두 건국 언어를 모두 유지하고, 퀘벡에는 양보가 아닌 명확성법으로 대응합니다. 캐나다는 NATO와 북미 무역권 안에 남아 워싱턴의 가장 안정적인 이웃으로 머뭅니다."
 RULE_OPTION_CAN_FRENCH_CANADA: "프랑스계 캐나다"
 RULE_OPTION_CAN_FRENCH_CANADA_DESC: "§8블록 퀘벡§!은 언어 불만을 연방 차원의 프로그램으로 바꾸고 프랑스어를 국가의 유일한 언어로 삼아 정부 소재지를 퀘벡으로 옮깁니다. 영어권 캐나다는 자국 수도에서 소수가 되고, 연방은 합의가 아닌 법으로 유지됩니다."
 RULE_OPTION_CAN_ARMED_NEUTRALITY: "홀로 선 진정한 북방"
 RULE_OPTION_CAN_ARMED_NEUTRALITY_DESC: "캐나다는 NATO를 탈퇴하고 해외 개입을 끝내며, 절약한 비용을 국내 경제와 자급 가능한 방위 산업에 씁니다. 동맹의 북쪽 측면은 잠잠해지고, 워싱턴은 자기 대륙의 두 번째 군대를 잃습니다."
 RULE_OPTION_CAN_NATIONALIST: "민족주의자의 쿠데타"
 RULE_OPTION_CAN_NATIONALIST_DESC: "§8캐나다 우선§!은 무너진 헌정 질서의 잔해를 타고 집권하여 선거를 중단하고 퀘벡과 보호구역에 비상 권한으로 대응합니다. 캐나다는 자기 대륙에 등을 돌리고, 세계에서 가장 긴 무방비 국경은 북쪽에서 요새화됩니다."
 RULE_OPTION_CAN_EASTERN_REALIGNMENT: "북극의 다리"
 RULE_OPTION_CAN_EASTERN_REALIGNMENT_DESC: "오타와는 NATO를 탈퇴하고 북극 항로와 항구, 자원을 워싱턴 대신 모스크바와 베이징에 팔아넘깁니다. 캐나다는 러시아-중국 세력권의 북쪽 끝이 되고, 미국은 자기 대륙에 경쟁자가 생겼음을 깨닫게 됩니다."
 RULE_OPTION_DEN_HISTORICAL: "포그 시대"
 RULE_OPTION_DEN_HISTORICAL_DESC: "§8벤스트레§!와 §8사회민주당§!은 크리스티안스보르를 번갈아 차지하고, 덴마크는 적용 제외 조항을 유지하며 유로화를 투표로 부결시키고 발칸, 이라크, 아프가니스탄에 병력을 보냅니다. 코펜하겐은 유럽에서 워싱턴의 가장 적극적인 소규모 동맹이 되고, 연합이 덴마크 없이 심화되도록 둡니다."
 RULE_OPTION_DEN_EUROPEAN_UNION: "유럽의 심장부에서"
 RULE_OPTION_DEN_EUROPEAN_UNION_DESC: "§8사회자유당§!과 §8사회민주당§!은 두 번째 국민투표를 통과시키고 덴마크의 적용 제외 조항을 소진하여 연합 중심부의 자리를 삽니다. 크로네는 유로에 자리를 내주고, 코펜하겐은 워싱턴이 아닌 베를린과 파리에 닻을 내립니다."
 RULE_OPTION_DEN_EUROSCEPTIC_DESC: "§8덴마크 국민당§!은 기성 정당들이 계속 미뤄 온 문제를 강제로 제기하고, 덴마크는 솅겐에서, 이어 연합 자체에서 탈퇴합니다. 북유럽 방위 협력이 브뤼셀의 자리를 대신하고, 나머지 스칸디나비아는 한쪽을 선택하라는 요구를 받습니다."
 RULE_OPTION_DEN_SOCIALIST_DESC: "§8적녹동맹§!과 노동조합은 복지국가를 노동자 국가로 바꾸고 평의회를 폴케팅 위에 둡니다. 덴마크는 동맹과 연합을 떠나 동쪽에서 우방을 찾고, 나머지 북유럽에 혁명을 제안합니다."
 RULE_OPTION_DEN_MONARCHIST_DESC: "궁정은 의례적인 존재인 척하기를 멈추고, §8덴마크 국민당§!은 국민의 인내심을 잃은 의회를 통해 왕관의 주장을 관철합니다. 군주는 헌법이 삭제한 권한을 되찾고, 그린란드와 페로 제도는 코펜하겐의 손아귀에 단단히 들어옵니다."
 RULE_OPTION_DEN_NATIONALIST_DESC: "§8덴마크 국민당§!은 지금까지 지지만 해 오던 정부를 장악하고 이민과 국경 통제를 덴마크 정치의 전부로 만듭니다. 덴마크는 동맹과 북유럽 이사회를 탈퇴하고 중세 이후 제기하지 않았던 영유권을 주장하기 시작합니다."
 COM_AI_BEHAVIOR: "@COM 코모로"
 RULE_OPTION_COM_HISTORICAL: "코모로 연합"
 RULE_OPTION_COM_HISTORICAL_DESC: "아잘리 아수마니는 군복을 벗고 투표함으로 나서며, 섬마다 대통령을 두고 연합 대통령직은 이들 사이에서 순환하며, 아프리카 연합군은 대령의 손에서 앙주앙을 되찾습니다. §8코모로 쇄신 협약§!은 승리한 뒤 평화롭게 권력을 잃고, 군도는 마침내 스스로를 전복하는 일을 멈춥니다."
 RULE_OPTION_COM_ORANGE_PARTY: "오렌지당의 패권"
 RULE_OPTION_COM_ORANGE_PARTY_DESC: "모하메드 다우두의 §8오렌지당§!은 모로니를 차지하고 군도를 능력 본위로 뽑은 테크노크라시로 운영하여 밀매 조직을 분쇄하고 부처를 전문화합니다. 코모로는 서류를 믿을 수 있는 유일한 인도양 초소국으로서 서방 자본에 자신을 내놓습니다."
 RULE_OPTION_COM_ISLAMIC_REPUBLIC: "아랍 공화국"
 RULE_OPTION_COM_ISLAMIC_REPUBLIC_DESC: "모스크 위원회들은 아흐메드 압달라 모하메드 삼비를 대통령직으로 밀어 올리고, §8바트당 운동§!은 섬들을 아랍 공화국으로 개조합니다. 항구는 국유화되고 파리 대신 다마스쿠스와 바그다드가 자리를 차지하며, 코모로는 모잠비크 해협의 아랍 연맹 목소리가 됩니다."
 RULE_OPTION_CUB_HISTORICAL: "역사적"
 RULE_OPTION_CUB_HISTORICAL_DESC: "피델은 대통령직을 동생에게 넘기고 §8쿠바 공산당§!은 섬을 일당 체제로 유지하며, 소규모 자영업을 허가하는 한편 석유를 위해 카라카스와 모스크바에 구애합니다. 금수 조치는 유지되고, 특별 기간은 결코 완전히 끝나지 않으며, 아바나는 워싱턴의 반구에서 어색한 예외로 남습니다."
 RULE_OPTION_CUB_PRO_WESTERN_REFORM: "피델이 섬을 열다"
 RULE_OPTION_CUB_PRO_WESTERN_REFORM_DESC: "카스트로는 직접 명령 경제를 해체하며 은행을 허가하고 교회를 복원하며, §8쿠바 공산당 친서방파§!의 지휘 아래 경쟁 정당을 인정하는 헌법을 작성합니다. 아바나는 관타나모 문제를 워싱턴과 해결하고 타이베이를 승인하며 결국 NATO와 함께 시추 작업을 하게 됩니다."
 RULE_OPTION_CUB_DIAZ_CANEL: "디아스카넬의 해빙"
 RULE_OPTION_CUB_DIAZ_CANEL_DESC: "미겔 디아스카넬은 라울보다 먼저 궁을 차지하고 §8쿠바 자유동맹§!의 금지를 풀어 혁명 이후 최초의 경쟁 선거를 실시합니다. 검열은 해체되고 외국 자본이 돌아오며, 쿠바는 총성 한 번 없이 평범한 카리브 공화국이 됩니다."
 RULE_OPTION_CUB_NEW_SOCIALISM: "제2의 혁명"
 RULE_OPTION_CUB_NEW_SOCIALISM_DESC: "디아스카넬은 개방을 도중에 포기하고 더 젊은 간부 집단을 중심으로 일당 국가를 재건하며 평양과 공공연히 교역합니다. 쿠바는 CSTO에 가입하고 러시아에 기지를 돌려주어 플로리다에서 90마일 떨어진 곳에 러시아 수비대를 두게 합니다."
 RULE_OPTION_CUB_NATIONALIST: "쿠바인을 위한 쿠바"
 RULE_OPTION_CUB_NATIONALIST_DESC: "§8쿠바 팔랑헤§!는 국가를 장악하고 공산주의자와 민주주의자를 가리지 않고 숙청하며 군대를 청년 노동단 중심으로 재편합니다. 이어 아바나는 해역 전체를 타고난 권리로 주장하고, 아이티, 자메이카, 지협은 하나씩 병합됩니다."
 RULE_OPTION_CUB_RESTORED_REPUBLIC: "복원된 공화국"
 RULE_OPTION_CUB_RESTORED_REPUBLIC_DESC: "§8쿠바 사회혁명민주당§!은 권력을 잡고 정치범을 석방하며 다당제 의회를 중심으로 헌법을 다시 씁니다. 이어 쿠바는 이웃 나라들을 정복하는 대신 카리브 연방으로 초대합니다."
 RULE_OPTION_CZE_HISTORICAL: "역사적"
 RULE_OPTION_CZE_HISTORICAL_DESC: "§8체코 사회민주당§!과 §8시민민주당§!은 정부를 번갈아 맡고, 나라는 NATO와 유럽 연합에 자리 잡으며 슈코다는 믈라다 볼레슬라프를 수출 엔진으로 바꿉니다. 프라하는 병력을 발칸과 아프가니스탄에 보내고 서방 진영의 편안하고 눈에 띄지 않는 일원이 됩니다."
 RULE_OPTION_CZE_COMMUNISM: "공산주의자들의 귀환"
 RULE_OPTION_CZE_COMMUNISM_DESC: "§8보헤미아-모라비아 공산당§!은 민영화에 대한 분노를 집권 과반수로 바꾸고 부처들의 칼끝을 공장을 팔아넘긴 자들에게 돌립니다. 체코 공화국은 NATO를 탈퇴하고 모스크바와 베이징에 구애하며, 이웃 나라들이 해결됐다고 여겼던 국경 문제를 다시 엽니다."
 RULE_OPTION_CZE_MONARCHY_KING: "합스부르크의 왕관"
 RULE_OPTION_CZE_MONARCHY_KING_DESC: "§8코루나 체스카§!는 호기심의 대상에서 최대 정당으로 성장하여 보관 중이던 왕관 보석을 꺼내고 카를 폰 합스부르크를 불러 대관시킵니다. 체코 땅은 다시 왕국이 되고, 빈과 부다페스트를 중부 유럽 전역의 군주주의 블록으로 끌어모으기 시작합니다."
 RULE_OPTION_CZE_MONARCHY_PRESIDENT: "왕관을 쓴 공화국"
 RULE_OPTION_CZE_MONARCHY_PRESIDENT_DESC: "§8코루나 체스카§!는 나라를 옛 질서로 돌려세우되 투표함은 유지하며, 혈통이 아닌 선거로 뽑은 군주주의자 국가 원수를 앉힙니다. 체코 공화국은 의회와 유럽 파트너들을 유지하면서 왕좌, 교회, 지역을 중심으로 스스로를 재건합니다."
 RULE_OPTION_FIJ_HISTORICAL: "역사적"
 RULE_OPTION_FIJ_HISTORICAL_DESC: "군대는 선출된 §8통일 피지당§! 정부를 제거하고 그 자리에 군부가 지원하는 행정부를 세웁니다. 섬들에 안정이 돌아오지만 최종 권한은 병영에 있으며 선거는 유예된 채로 남습니다."
 RULE_OPTION_FIJ_COUP_AVERTED: "저지된 쿠데타"
 RULE_OPTION_FIJ_COUP_AVERTED_DESC: "정부와 군대의 대치는 누군가를 무너뜨리기 전에 해소되고, §8피지 노동당§!이 중도좌파의 위임을 받아 집권합니다. 화해와 공공 투자가 의제를 이끌며, 피지는 이웃 나라들이 포기했던 민간 정부를 유지합니다."
 RULE_OPTION_FIJ_MILITARY_JUNTA: "장교들의 공화국"
 RULE_OPTION_FIJ_MILITARY_JUNTA_DESC: "§8피지 군§!의 급진파는 쿠데타가 요구한 것보다 더 나아가 공개적인 군부 통치를 공식화하며, 계엄령 아래 경찰을 군대에 통합합니다. 정치는 병영에서 운영되고, 태평양은 해상 교통로 한복판에 공공연히 군사화된 국가를 얻게 됩니다."
 RULE_OPTION_FIJ_RESTORED_KINGDOM: "복원된 왕관"
 RULE_OPTION_FIJ_RESTORED_KINGDOM_DESC: "§8대추장 회의§!가 위기에서 승리하여 피지를 선출된 군주 아래의 왕국으로 재건국합니다. 추장의 관습이 국가의 기반이 되고, 원주민 기득권층은 민족 문제를 자신들의 방식대로 정리합니다."
 RULE_OPTION_FIJ_TECHNOCRACY: "기술자들의 정부"
 RULE_OPTION_FIJ_TECHNOCRACY_DESC: "기술자, 기획자, 행정가들로 이루어진 위원회가 나라를 장악하고 테크노크라시 헌법 아래 통치합니다. 정당 정치는 자동화와 산업 계획에 자리를 내주고, 피지는 지역의 모든 경제를 앞지르는 발전을 목표로 삼습니다."
 RULE_OPTION_FIJ_EARLY_JUNTA: "병영이 일찍 움직이다"
 RULE_OPTION_FIJ_EARLY_JUNTA_DESC: "밀레니엄 인질 사태는 끝내 수습되지 못하고, §8피지 군§!은 의회가 아직 포위된 상태에서 나라를 완전히 장악합니다. 군사화된 사회가 예정보다 수년 앞서 굳어지고, 지역은 쿠데타의 습관이 훨씬 일찍 뿌리내리는 것을 지켜봅니다."
 RULE_OPTION_FIJ_EARLY_KINGDOM: "왕관이 일찍 돌아오다"
 RULE_OPTION_FIJ_EARLY_KINGDOM_DESC: "밀레니엄 인질 사태는 공화국으로의 복귀가 아니라 §8대추장 회의§!가 선출된 왕을 옹립하는 것으로 끝납니다. 군주제는 정치적으로 한 세대 일찍 복원되며, 뒤따랐을 두 번째 위기는 오지 않습니다."
 RULE_OPTION_FRA_SOCIALIST: "사회주의자들의 귀환"
 RULE_OPTION_FRA_SOCIALIST_DESC: "§8사회당§!은 엘리제궁을 차지하고 복지 확대, 노동시간 단축, 공공 지출에 대한 보다 온건한 노선으로 통치합니다. 프랑스는 NATO와 연합 안에 남지만 순수한 자유주의 유럽이 아닌 사회적 유럽을 주장합니다."
 RULE_OPTION_FRA_LIBERAL: "자유주의 중도"
 RULE_OPTION_FRA_LIBERAL_DESC: "중도파 §8프랑스 민주연합§!과 그 후신 §8전진하는 공화국§!은 규제 완화, 노동 개혁, 더 깊은 유럽 연방주의를 내세워 통치합니다. 프랑스는 어떤 다른 강대국보다 강하게 하나로 움직이는 연합을 밀어붙입니다."
 RULE_OPTION_FRA_GAULLIST: "드골주의의 부활"
 RULE_OPTION_FRA_GAULLIST_DESC: "§8프랑스를 위한 연합§!은 드골주의적 주권주의를 부활시켜 프랑스를 NATO 지휘 체계에서 느슨하게 풀고 독자적인 핵 태세를 고집합니다. 프랑스는 유럽에서의 자리를 유지하지만 워싱턴의 주도를 따르기를 거부합니다."
 RULE_OPTION_FRA_GREEN: "녹색 공화국"
 RULE_OPTION_FRA_GREEN_DESC: "§8녹색당§!과 그 후신 §8유럽 생태 녹색당§!이 집권하여 국가를 생태 전환 쪽으로 돌리고 핵 함대와 중공업을 모두 재고합니다. 프랑스는 일부 성장을 포기하는 대신 유럽에서 가장 큰 녹색의 목소리를 얻습니다."
 RULE_OPTION_FRA_FRANCE_UNBOWED: "굴하지 않는 프랑스"
 RULE_OPTION_FRA_FRANCE_UNBOWED_DESC: "§8굴복하지 않는 프랑스§!는 제6공화국과 유럽 재정 정통주의와의 단절을 약속하며 급진 좌파를 집권시킵니다. 프랑스는 연합의 규칙에 맞서고 서방 진영 밖에서 파트너를 찾습니다."
 RULE_OPTION_FRA_NATIONAL_RALLY: "국민연합"
 RULE_OPTION_FRA_NATIONAL_RALLY_DESC: "§8국민전선§!과 그 후신 §8국민연합§!이 공화국을 단독으로 장악하고 이민 제한과 자국민 우선으로 통치합니다. 프랑스는 브뤼셀에서 탈퇴를 밀어붙이고 모스크바에 호감을 보입니다."
 RULE_OPTION_GRN_HISTORICAL: "역사적"
 RULE_OPTION_GRN_HISTORICAL_DESC: "그린란드는 덴마크로부터 자치권을 얻고 해외 모험 대신 정착, 어업, 광업, 공공 서비스에 노력을 투자합니다. 북극은 조용히 유지되고 그린란드의 북유럽 이웃들은 지금의 국경을 지킵니다."
 RULE_OPTION_GRN_SCANDINAVIAN_SERENITY_DESC: "그린란드는 아이슬란드, 페로 제도, 덴마크, 노르웨이, 스웨덴, 핀란드를 §8북유럽 연합§!으로 끌어모은 뒤 발트해 연안에서 멈춥니다. 스칸디나비아는 한목소리를 내고, 더 넓은 유럽 질서는 그대로 유지됩니다."
 RULE_OPTION_GRN_CONTINENTAL_HEGEMONY_DESC: "그린란드는 §8북유럽 연합§!을 남쪽과 동쪽으로 확장하여 §8얼어붙은 연방§!이 유럽 대부분에 걸쳐 뻗어 나갑니다. 대륙의 수도들은 누크에 응하고 옛 유럽 질서는 끝납니다."
 RULE_OPTION_GRE_HISTORICAL: "역사적"
 RULE_OPTION_GRE_HISTORICAL_DESC: "§8신민주당§!은 긴축과 유로화로 그리스를 부채 위기에서 이끌어 내며, 회복이 도래하기 전에 예산을 뼈만 남기도록 삭감합니다. 아테네는 유럽 연합과 NATO에 더욱 깊이 닻을 내리고 키프로스, 이스라엘, 프랑스를 동지중해 전선으로 묶습니다."
 RULE_OPTION_GRE_COMMUNIST: "붉은 아크로폴리스"
 RULE_OPTION_GRE_COMMUNIST_DESC: "붕괴는 국가를 §8그리스 공산당§!에 넘기고, 공산당은 새 헌법을 쓰고 은행을 국유화하며 붉은 군대를 일으킵니다. 그리스는 NATO를 탈퇴하고 발칸 전역에 공산주의 블록을 조직하며 불가리아, 알바니아, 북마케도니아, 세르비아, 루마니아에 영유권을 주장합니다."
 RULE_OPTION_GRE_NATIONALIST: "황금새벽당"
 RULE_OPTION_GRE_NATIONALIST_DESC: "§8황금새벽당§!은 같은 붕괴를 타고 집권하여 공화국을 메탁사스식 독재 아래 묻고 언론과 야당을 침묵시킵니다. 그리스는 메갈리 이데아를 되살리고 알바니아, 불가리아, 북마케도니아, 튀르키예에 영토 요구를 제기합니다."
 RULE_OPTION_GRE_MULTIPOLAR: "동쪽으로의 전환"
 RULE_OPTION_GRE_MULTIPOLAR_DESC: "공화국은 존속하지만 유럽 연합에 등을 돌리고 러시아, 중국, 이란에 구애하며 피레우스를 중국 자본에 팝니다. 그리스는 BRICS에 가입하고 NATO를 탈퇴하여, 서방 진영 내 자리를 다극 질서의 한 자리와 맞바꿉니다."
 RULE_OPTION_GEO_HISTORICAL: "역사적"
 RULE_OPTION_GEO_HISTORICAL_DESC: "장미 혁명이 §8조지아 시민연합§!을 쓸어내고 미하일 사카슈빌리는 나라를 NATO와 서방 쪽으로 강하게 돌려세웁니다. 조지아는 분리 공화국들을 둘러싼 러시아와의 전쟁에서 패하고, 이후 §8조지아의 꿈§!에 평화롭게 권력을 넘깁니다."
 RULE_OPTION_GEO_SHEVARDNADZE_WEST: "셰바르드나제의 지속"
 RULE_OPTION_GEO_SHEVARDNADZE_WEST_DESC: "에두아르드 셰바르드나제는 양보하는 대신 야당을 짓누르고, §8조지아 시민연합§!은 혁명 없이 나라를 서방 노선에 유지합니다. 조지아는 그럼에도 브뤼셀과 워싱턴이 구애하는 권위주의 국가로 남습니다."
 RULE_OPTION_GEO_PRO_RUSSIAN: "모스크바에 대한 양보"
 RULE_OPTION_GEO_PRO_RUSSIAN_DESC: "§8조지아 시민연합§!은 크렘린과 타협하여 러시아 기지를 그대로 두고 분리 공화국 문제를 모스크바의 조건대로 해결합니다. 조지아는 독립국가연합 쪽으로 미끄러지며 서방 진영에서 이탈합니다."
 RULE_OPTION_GEO_NATIONALIST: "므케드리오니의 귀환"
 RULE_OPTION_GEO_NATIONALIST_DESC: "§8므케드리오니§! 준군사 조직이 되살아나 국가를 장악하고, 조지아는 어느 블록에도 얽매이지 않는 대조지아를 추구합니다. 아르메니아, 아제르바이잔, 분리 공화국들은 모두 이웃이 아니라 표적이 됩니다."
 RULE_OPTION_GEO_COMMUNIST: "복원된 소비에트 공화국"
 RULE_OPTION_GEO_COMMUNIST_DESC: "§8조지아 통합 공산당§!이 투표 또는 혁명으로 돌아와 다시 소비에트 공화국을 선포합니다. 조지아는 아르메니아와 아제르바이잔에 손을 내밀어 외코카서스 연방을 재건하려 합니다."
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT: "국민운동의 집권 유지"
 RULE_OPTION_GEO_UNITED_NATIONAL_MOVEMENT_DESC: "역사는 전쟁과 그 뒤의 합의로 흘러가지만, 사카슈빌리의 §8통일 국민운동§!은 대통령직을 잃지 않고 유지합니다. 조지아는 NATO 가입에 더욱 박차를 가하고 모스크바에 공공연한 적대로 맞섭니다."
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS: "애국자 동맹"
 RULE_OPTION_GEO_GEORGIAN_PATRIOTS_DESC: "전후 합의는 있었던 그대로 이루어지고, 이후 §8애국자 동맹§!이 민족주의적이며 사회적으로 보수적인 강령으로 승리합니다. 조지아는 브뤼셀에서 등을 돌리고 다시 동쪽으로 흘러갑니다."
 RULE_OPTION_GEO_UNITED_GEORGIA: "동서 사이에서"
 RULE_OPTION_GEO_UNITED_GEORGIA_DESC: "전후 합의는 있었던 그대로 이루어지고, 이후 §8통일 조지아§!가 의도적인 다각적 외교 정책을 내걸고 집권합니다. 조지아는 유럽 연합, 러시아, 이웃 나라들 사이에서 하나를 고르지 않고 균형을 잡습니다."
 RULE_OPTION_GER_HISTORICAL: "역사적"
 RULE_OPTION_GER_HISTORICAL_DESC: "§8사회민주당§!은 §8녹색당§!과의 연립으로 통치하며 자신의 지지 기반에 맞서 하르츠 노동 개혁을 관철한 뒤, 총리직을 §8기독교민주연합§!에 넘겨 긴 대연정을 이룹니다. 독일은 NATO에 닻을 내린 채 유럽 연합을 그 중심에서 이끕니다."
 RULE_OPTION_GER_LIBERAL: "자유주의 공화국"
 RULE_OPTION_GER_LIBERAL_DESC: "§8자유민주당§!은 하위 파트너 역할에서 벗어나 자유 시장, 규제 완화, 방위의 민영화, 디지털 국가를 내걸고 나라를 이끕니다. 독일은 NATO와 더욱 긴밀히 결속하고, 점수제에서 가장 높은 평가를 받는 누구에게나 국경을 엽니다."
 RULE_OPTION_GER_POPULIST: "독일을 위한 대안의 부상"
 RULE_OPTION_GER_POPULIST_DESC: "§8독일을 위한 대안§!은 이민, 이슬람, 유럽 회의주의, 기후에 대한 의구심을 내걸고 변방에서 정부로 올라섭니다. 독일은 모스크바에 호감을 보이는 한편 유럽 연합을 내부에서부터 해체합니다."
 RULE_OPTION_ETH_DERG_RESTORATION: "데르그의 귀환"
 RULE_OPTION_ETH_DERG_RESTORATION_DESC: "에티오피아는 멩기스투 하일레 마리암을 복권하고 §8에티오피아 인민민주공화국§! 아래 공산주의 통치를 복원합니다. 나라는 중국과 연대하며 범아프리카 공산주의 연대를 추구합니다."
 RULE_OPTION_EST_HISTORICAL: "역사적"
 RULE_OPTION_EST_HISTORICAL_DESC: "§8개혁당§!은 급진적 규제 완화와 단일세율 과세를 추진하는 한편 국가 온라인 신원을 중심으로 디지털 국가를 구축합니다. 에스토니아는 발트해의 서방 거점이자 러시아 영향력에 대한 상시적 균형추로서 NATO와 유럽 연합에 가입합니다."
 RULE_OPTION_EST_CONSERVATIVE: "전통 에스토니아"
 RULE_OPTION_EST_CONSERVATIVE_DESC: "§8이사마§!는 기업 친화적 세금 감면을 부여하고 표적 고용 프로그램을 운영하면서 교육과 가족 복지에 대규모로 투자합니다. 에스토니아는 서방 및 친유럽 노선을 유지하되 사회적으로는 내향적으로 돌아서 이민 정책을 강화하고 세계주의보다 문화 보존을 앞세웁니다."
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC: "북유럽 모델"
 RULE_OPTION_EST_SOCIAL_DEMOCRATIC_DESC: "§8사회민주당§!은 최저임금, 권한이 강화된 노동조합, 국가 주도의 산업 투자를 바탕으로 북유럽식 복지국가를 건설합니다. 에스토니아는 서방 노선을 유지하되 일터에서의 노동자 권리와 평등을 옹호하는 사회민주주의 국가로서 유럽에 합류합니다."
 RULE_OPTION_EST_CENTRIST: "동방의 균형"
 RULE_OPTION_EST_CENTRIST_DESC: "§8중앙당§!은 에스토니아의 대서양주의 성향을 버리고 러시아와의 교역을 재개하며, 러시아어 사용 소수민족에게 구애하는 한편 라트비아, 리투아니아와의 통합을 압박합니다. 에스토니아는 동서 사이의 중립적 가교가 되고, 발트해는 가장 확고한 NATO 지지자를 잃습니다."
 RULE_OPTION_EST_NATIONALIST: "에스토니아 우선"
 RULE_OPTION_EST_NATIONALIST_DESC: "§8EKRE§!가 집권하여 나라의 자원을 국가를 위해 몰수하고 친유럽 정당들과 그 동조자들을 공직 생활에서 숙청합니다. 에스토니아는 유럽 통합에서 발을 빼고 강력히 재무장하며 라트비아, 리투아니아, 핀란드, 스웨덴에 영유권을 주장하여 발트해를 화약고로 만듭니다."
 CHE_AI_BEHAVIOR: "@CHE 체첸"
 RULE_OPTION_CHE_HISTORICAL: "역사적"
 RULE_OPTION_CHE_HISTORICAL_DESC: "제2차 전쟁은 §8이츠케리아§!의 파괴와 카디로프 일가 아래 공화국이 러시아에 다시 흡수되는 것으로 끝납니다. 체첸은 독립을 재건 자금과 맞바꾸고 코카서스에서 모스크바의 가장 믿음직한 집행자가 됩니다."
 RULE_OPTION_CHE_CALIPHATE: "코카서스 토후국"
 RULE_OPTION_CHE_CALIPHATE_DESC: "외국인 §8무자헤딘§!은 세속 분리주의자들을 밀어내고 공화국에 남은 것을 샤리아로 통치합니다. 체첸은 §8알카에다§!의 피난처가 되며 코카서스 전역과 러시아 본토를 향한 지하드의 발진 기지가 됩니다."
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION: "코카서스 연맹"
 RULE_OPTION_CHE_CAUCASUS_CONFEDERATION_DESC: "세속 장교들은 §8이슬람주의자들§!을 꺾고 이츠케리아를 북코카서스 민족 연합의 중핵으로 재건합니다. 체첸은 모스크바를 산악 지대 밖에 묶어 두는 데 필요한 힘을 앙카라와 바쿠에 의지해 얻습니다."
 RULE_OPTION_CHE_WESTERN_ALIGNMENT: "서방의 승인"
 RULE_OPTION_CHE_WESTERN_ALIGNMENT_DESC: "§8이슬람주의자들§!은 밀려나고, 공화국은 산악 지대의 동맹이 아닌 서방 수도들의 승인을 좇으며 독립을 보냅니다. 체첸은 민주주의라는 자격과 유럽의 테이블에 앉을 자리로 생존을 삽니다."
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS: "붉은 코카서스"
 RULE_OPTION_CHE_SOCIALIST_CAUCASUS_DESC: "§8살만 라두예프§!의 파벌이 공화국을 장악하고 이슬람을 산악 지대가 여전히 기억하는 소련 질서와 융합합니다. 체첸은 코카서스 사회주의 공화국을 선포하고 모스크바와 속국이 아닌 대등한 상대로 합의합니다."
 RULE_OPTION_IND_PARTY_OF_STRUGGLE: "투쟁당"
 RULE_OPTION_IND_PARTY_OF_STRUGGLE_DESC: "§8투쟁 인도네시아 민주당§!은 나라 최대의 세속·민족주의 세력으로서 집권하여 분쟁 지역의 종교적 소수자를 보호하고 급진화에 맞서 판차실라를 증진합니다. 인도네시아는 외교를 중국과 러시아 쪽으로 돌리는 한편 군도 전역에 좌익 민족주의 보루를 구축합니다."
 RULE_OPTION_IND_DEMOCRAT_PARTY: "테크노크라트 대통령직"
 RULE_OPTION_IND_DEMOCRAT_PARTY_DESC: "개혁적인 장군이 §8민주당§!에 테크노크라트 전문가들을 모아 경제 성장, 제도적 안정, 투자자 신뢰를 최우선으로 삼습니다. 인도네시아는 동남아시아의 전문적이고 유능한 통치의 모범으로서 확고한 서방 노선을 유지합니다."
 RULE_OPTION_IND_UNITED_DEVELOPMENT: "통합개발전선"
 RULE_OPTION_IND_UNITED_DEVELOPMENT_DESC: "신질서의 이슬람 기득권 네트워크에 뿌리를 둔 §8통합개발당§!이 국가를 장악하고 구조 개혁이 아닌 후견, 개인적 관계, 엘리트 합의로 통치합니다. 인도네시아는 서방과의 닻을 유지하는 한편 비공식 권력 구조와 거래적 정치를 통해 이슬람적 정체성이 깊어집니다."
 RULE_OPTION_IND_PROSPEROUS_JUSTICE: "번영정의운동"
 RULE_OPTION_IND_PROSPEROUS_JUSTICE_DESC: "반부패와 풀뿌리 동원에 기반한 규율 있는 이슬람주의 운동인 §8번영정의당§!이 권력을 잡고 개혁 시대 이래 통치해 온 후견 네트워크를 박살 냅니다. 서방의 후견에 적대적이고 사회적으로 보수적인 인도네시아는 자유주의 질서와 옛 엘리트 모두의 바깥에서 독립 행위자로서 동쪽을 향합니다."
 RULE_OPTION_JAP_NORMAL_NATION: "보통 국가"
 RULE_OPTION_JAP_NORMAL_NATION_DESC: "§8자유민주당§!은 자위대가 여느 군대와 같은 군대로 헌법에 명기될 때까지 헌법 9조 합의를 소진시킵니다. 일본은 미국 동맹 안에서 재무장하고 베이징과 평양에 독자적으로 대응하기 시작합니다."
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY: "제2의 전후"
 RULE_OPTION_JAP_SOCIAL_DEMOCRACY_DESC: "§8민주당§!은 국회에 대한 보수 세력의 장악을 깨고 정보 공개, 노동법, 외국인 노동자에 대한 문호 개방을 내걸고 통치합니다. 일본은 지역이 아니라 출산율, 샐러리맨, 거품경제보다 오래 살아남은 부패에 힘을 씁니다."
 RULE_OPTION_JAP_PACIFIST: "평화 헌법"
 RULE_OPTION_JAP_PACIFIST_DESC: "§8사회민주당§!은 헌법 9조가 말 그대로 의미한다는 약속과 함께 국회를 장악하고, 무기 수출, 기지, 마침내 자위대까지 정리됩니다. 일본은 워싱턴과의 안보 조약을 파기하고 중국과 한반도 사이에서 비무장 상태로 섭니다."
 RULE_OPTION_HKG_HISTORICAL: "역사적"
 RULE_OPTION_HKG_HISTORICAL_DESC: "§8친중파§!는 특별행정구를 베이징의 노선에 유지하며 §8입법회§!를 애국자 중심으로 재편하고 학교에 애국 교육을 도입하며 광둥어 시민 생활을 시들게 합니다. 그 자금도 뒤따릅니다. 홍콩은 위안화의 역외 허브이자 §8일대일로§!의 자금줄이 되고, §8웨강아오 대만구§!는 §8기본법§!이 약속한 것을 삼켜 버립니다."
 RULE_OPTION_HKG_INDEPENDENCE: "우리만의 국가"
 RULE_OPTION_HKG_INDEPENDENCE_DESC: "홍콩은 괴뢰 체제를 찢어 버리고 독자적인 헌법을 쓰며 이를 지킬 군대와 항모 함대를 양성합니다. 이어 주강 삼각주에 대한 영토 회복주의적 영유권을 주장하며 베이징에 광둥에 대해 답하라고 도전합니다."
 RULE_OPTION_HKG_BRITISH: "다시 왕관 아래로"
 RULE_OPTION_HKG_BRITISH_DESC: "홍콩은 중국의 주권에서 벗어나 런던에 복귀를 요청하고, 영국에 주둔권을 부여하며 §8AUKUS§! 정보 공유에 참여하고 보통선거와 독립된 사법부를 입법합니다. 중국의 문턱에 선 §8영연방§! 왕국은 베이징이 수십 년간 닫아 온 민주주의의 발판을 서방에 안겨 줍니다."
 RULE_OPTION_HKG_CITY_STATE: "자유 도시"
 RULE_OPTION_HKG_CITY_STATE_DESC: "홍콩은 자체 권한으로 §8기본법§!을 다시 쓰고 군대 대신 연안 방위군을 유지하며 스스로를 동아시아의 금융 수도로 만듭니다. 어느 블록에도 서약하지 않고 베이징과 워싱턴 모두와 교역하며 어느 쪽에도 응하지 않습니다."
 EGY_AI_BEHAVIOR: "@EGY 이집트"
 RULE_OPTION_EGY_HISTORICAL: "역사적"
 RULE_OPTION_EGY_HISTORICAL_DESC: "이집트는 광장이 비워질 때까지 §8국민민주당§!을 운영하고, 단 한 번의 임기를 §8무슬림 형제단§!에 넘긴 뒤 대통령직을 다시 장군들에게 돌려줍니다. 이스라엘과의 평화는 유지되고, 미국의 원조는 계속 흐르며, 카이로는 아랍 질서에 반하지 않고 그것을 대변합니다."
 RULE_OPTION_EGY_BROTHERHOOD: "형제단의 집권 유지"
 RULE_OPTION_EGY_BROTHERHOOD_DESC: "이집트는 선출된 §8무슬림 형제단§! 정부를 유지하고 장교들을 숙청하는 대신 매수하며, 법원이 뒤집을 수 없는 이슬람주의 헌법을 씁니다. 카이로는 앙카라, 도하, 하마스 쪽으로 기울고 걸프 군주국들은 이를 위협으로 여깁니다."
 RULE_OPTION_EGY_PAN_ARAB: "나세르의 후계자들"
 RULE_OPTION_EGY_PAN_ARAB_DESC: "이집트는 §8민족전선§!을 다시 집권시키고 경제의 핵심 부문을 국유화하며 아랍 연합 공화국을 부활시킵니다. 카이로는 다마스쿠스, 바그다드, 트리폴리에 구애하고 워싱턴에 등을 돌립니다."
 RULE_OPTION_EGY_SALAFIST: "살라피스트로의 전환"
 RULE_OPTION_EGY_SALAFIST_DESC: "이집트는 §8알누르당§!을 대통령궁에 앉히고 선거를 중단하며 종교법으로 통치합니다. 샤리아는 콥트인을 보호받는 소수로 다스리고, 시나이 작전은 성전이 됩니다."
 RULE_OPTION_EGY_COPTIC: "콥트의 패권"
 RULE_OPTION_EGY_COPTIC_DESC: "이집트는 §8콥트 교회§!와 그 세속 동맹들에게 장악되고, 이들은 아랍의 유산보다 파라오의 유산을 주장합니다. 카이로는 팔레스타인에서 아시리아까지 기독교인을 보호하며 자신이 속한 지역에서 고립됩니다."
 HEZ_AI_BEHAVIOR: "@HEZ 헤즈볼라"
 RULE_OPTION_HEZ_HISTORICAL: "역사적"
 RULE_OPTION_HEZ_HISTORICAL_DESC: "§8헤즈볼라§!는 정당으로서 선거에 참여하고, 이스라엘과 싸웠던 §8타아비아§! 게릴라군을 유지하며, §8레바논 국군§!을 대체하는 대신 그 곁에 섭니다. 레바논 국가 안의 국가로 남으면서 다마스쿠스, §8이라크 시아파 민병대§!, §8후티§!와 함께 싸웁니다."
 RULE_OPTION_HEZ_LAND_OF_GOD: "신의 땅"
 RULE_OPTION_HEZ_LAND_OF_GOD_DESC: "§8헤즈볼라§!는 레바논에서 분리 독립하여 남부와 베카 계곡에 걸쳐 승인받은 이슬람 국가를 세우고, 동맹을 끌어들이며 통치하는 마을들의 생활 수준을 끌어올립니다. 원정군과 해외 정보 기관을 양성하여 레바논의 한 파벌을 그 자체로 지역 강국으로 바꿉니다."
 RULE_OPTION_HEZ_CONQUER_LEBANON: "레바논의 주인들"
 RULE_OPTION_HEZ_CONQUER_LEBANON_DESC: "§8헤즈볼라§!는 §8레바논 국군§! 이탈자들을 무장시키고 투표가 아닌 공개적인 전쟁으로 레바논을 차지합니다. 이란의 자금, 공장, 도로로 작전 비용을 대며 나라를 테헤란에 응하는 이슬람 공화국으로 병합합니다."
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE: "혁명 수출"
 RULE_OPTION_HEZ_GLOBAL_RESISTANCE_DESC: "§8헤즈볼라§!는 레바논에서 진지를 지키면서 서아프리카의 §8이슬람 운동§!에서 베네수엘라를 거쳐 뻗어 나가는 디아스포라와 카르텔 경로에 이르기까지 해외 네트워크에 자금을 쏟아붓습니다. 북미 내부에서도 조직과 민병대를 구축하여 전쟁을 레반트 훨씬 너머로 끌고 갑니다."
 IRQ_AI_BEHAVIOR: "@IRQ 이라크"
 RULE_OPTION_IRQ_HISTORICAL: "역사적"
 RULE_OPTION_IRQ_HISTORICAL_DESC: "이라크는 미국의 침공이 정권을 무너뜨릴 때까지 사담 후세인의 §8바트당§! 아래 움직이고, 이후 점령 정부가 바그다드에서 통치하는 동안 권력은 §8이슬람 다와당§!의 시아파 종교 정당들에게 넘어갑니다. 이라크는 미국이 후원하는 공화국으로 끝나지만 그럼에도 이란의 외교 영향권으로 흘러갑니다."
 RULE_OPTION_IRQ_BAATHIST_STATE: "바트당의 존속"
 RULE_OPTION_IRQ_BAATHIST_STATE_DESC: "§8바트당§!은 미국의 침공에서 살아남아 제재 체제를 무너뜨리고 가문 안에서 승계를 정리하며 쿠웨이트, 쿠르드 지역, 이란의 후제스탄에 대한 영유권을 되살립니다. 걸프 지역은 이웃 나라들을 압박하고 범아랍 야망을 내세우는 건재한 §8바트주의§! 이라크와 이웃해 살아갑니다."
 RULE_OPTION_IRQ_SHIA_THEOCRACY: "법학자의 통치"
 RULE_OPTION_IRQ_SHIA_THEOCRACY_DESC: "시아파 성직자 정당들과 §8바드르 기구§!는 점령 이후의 국가를 차지하고 테헤란과 연대하는, 법학자가 통치하는 공화국을 세웁니다. 바그다드는 다마스쿠스와 베이루트까지 이어지는 이란 축의 서쪽 중심축이 됩니다."
 RULE_OPTION_IRQ_SADRIST: "사드르파의 물결"
 RULE_OPTION_IRQ_SADRIST_DESC: "§8무크타다 알사드르§!의 운동은 바그다드 빈민가에서 일어나 미국인들을 몰아내고, 미국의 후견만큼 이란의 후견도 단호히 거부하는 시아파 포퓰리스트이자 이라크 민족주의 세력으로 통치합니다. 이라크는 내부로 향하고 모든 외국 후원자에게 적대적이 됩니다."
 RULE_OPTION_IRQ_SECULAR_REPUBLIC: "세속 공화국"
 RULE_OPTION_IRQ_SECULAR_REPUBLIC_DESC: "§8이라크 국민회의§!와 §8이라크 국민합의§!의 세속 야당은 종파와 민족 위의 헌법을 쓰고 국가를 종교 공화국이 아닌 아랍 공화국으로 결속합니다. 이라크는 서방 성향의 세속 국가로서 아랍 질서에 복귀합니다."
 RULE_OPTION_IRQ_COMMUNIST: "사회주의 이라크"
 RULE_OPTION_IRQ_COMMUNIST_DESC: "§8이라크 공산당§!은 §8바트주의자§!의 숙청 이래 지내 온 지하에서 나와 노동자, 여성, 쿠르드인의 지지를 얻고 공화국을 차지합니다. 이라크는 석유 군주국들 한가운데의 사회주의 국가가 됩니다."
 RAJ_AI_BEHAVIOR: "@RAJ 인도"
 RULE_OPTION_RAJ_HISTORICAL: "역사적"
 RULE_OPTION_RAJ_HISTORICAL_DESC: "인도는 §8인도 인민당§!과 §8인도 국민회의§!가 번갈아 집권하며 경제 자유화와 §8BRICS§!에 대한 약속, 다극적이고 비동맹적인 외교 정책을 유지합니다. 인도는 워싱턴과 모스크바 모두와의 관계를 유지하면서 개발도상국의 주요 목소리로 자리매김합니다."
 RULE_OPTION_RAJ_GREATER_INDIA: "대인도"
 RULE_OPTION_RAJ_GREATER_INDIA_DESC: "힌두트바 민족주의 전선이 집권하여 국내에 힌두 다수주의 통치를 강요하고, 카스트 위계를 유지하며 소수자의 보호를 박탈합니다. 인도는 자급자족, 고립, 네팔·부탄·방글라데시에 대한 영토 요구로 돌아서며 권위주의적 범인도 체제를 세웁니다."
 RULE_OPTION_RAJ_RED_REPUBLIC: "붉은 공화국"
 RULE_OPTION_RAJ_RED_REPUBLIC_DESC: "§8인도 공산당§!이 집권하여 경제를 국유화하고 5개년 계획으로 돌아가며, 중국과 연대하고 악사이친 영유권 주장을 철회합니다. 인도는 남아시아 전역에 혁명을 수출하여 지역의 급진 사회주의 선봉이 됩니다."
 RULE_OPTION_RAJ_PEOPLES_FRONT: "인민 전선"
 RULE_OPTION_RAJ_PEOPLES_FRONT_DESC: "§8대중사회당§!과 §8사회주의당§!은 달리트와 사회주의 연립을 구성하여 카스트 특권을 해체하고 사회 전반에 부를 재분배합니다. 인도는 비동맹 외교 정책을 유지하면서 북유럽식 복지국가를 건설합니다."
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT: "서방의 동맹"
 RULE_OPTION_RAJ_WESTERN_ALIGNMENT_DESC: "인도는 프랑스 및 이스라엘과 가까워지고, 미국의 주요 비NATO 동맹국이 되어 워싱턴과의 군사 및 무역 협력을 심화합니다. 인도는 대만을 승인하고 결국 NATO에 가입하여 서방 동맹에서의 자리를 굳힙니다."
 RULE_OPTION_LBA_HISTORICAL: "역사적"
 RULE_OPTION_LBA_HISTORICAL_DESC: "카다피는 §8리비아 이슬람 전투 그룹§!을 분쇄하고 무기 프로그램을 포기하며 국제 제재에서 벗어나도록 협상합니다. 정권은 결국 봉기로 무너지고, 리비아는 §8리비아 국군§!을 지휘하는 군사 강자에게 넘어갑니다."
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE: "이슬람 칼리파국"
 RULE_OPTION_LBA_ISLAMIC_CALIPHATE_DESC: "카다피는 §8리비아 이슬람 전투 그룹§!을 용인하고, 이들은 그를 암살하여 살라피스트 국가를 세웁니다. 리비아는 사헬 전역에 걸친 지하드의 기지가 되어 차드, 니제르, 나이지리아, 알제리, 말리, 모리타니를 불안정하게 만듭니다."
 RULE_OPTION_LBA_LIBYAN_REPUBLIC: "리비아 공화국"
 RULE_OPTION_LBA_LIBYAN_REPUBLIC_DESC: "리비아는 녹색 책을 개정하고 인민 회의에 권한을 부여하며 정당을 합법화합니다. 국가는 카다피의 직접 민주주의를 경쟁 정치가 대체하는 대통령제 공화국으로 변모합니다."
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION: "반식민 연합"
 RULE_OPTION_LBA_ANTI_COLONIAL_UNION_DESC: "카다피는 남아서 §8반식민 연합§!을 구축하고 아프리카와 중동 전역의 반란 세력을 무장시킵니다. 리비아는 혁명 운동의 중심지가 되어 이웃 나라들을 불안정하게 하고 두 대륙에 혼란을 퍼뜨립니다."
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC: "아랍 연합 공화국"
 RULE_OPTION_LBA_UNITED_ARAB_REPUBLIC_DESC: "카다피는 남아서 §8바트주의자들§!과 손잡고 §8아랍 연합 공화국§!을 구축합니다. 리비아는 모리타니에서 예멘까지 뻗은 범아랍 국가로 합병되어 아랍 세계의 지정학을 재편합니다."
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA: "아프리카 합중국"
 RULE_OPTION_LBA_UNITED_STATES_OF_AFRICA_DESC: "카다피는 남아서 자신을 수장으로 하는 대륙 규모의 §8아프리카 합중국§!을 추구합니다. 리비아는 아프리카 초강대국의 수도가 되어 대륙의 정치 질서 전체를 바꿉니다."
 ISR_AI_BEHAVIOR: "@ISR 이스라엘"
 RULE_OPTION_ISR_HISTORICAL: "역사적"
 RULE_OPTION_ISR_HISTORICAL_DESC: "§8리쿠드§!는 평화 협상이 결렬된 뒤 나라를 장악하고 분리 장벽 뒤에서 제2차 인티파다를 진압하며 가자에서 정착민들을 철수시킵니다. 이스라엘은 워싱턴에 닻을 내린 채 아랍 걸프 국가들과 관계를 정상화하고, 이란을 다른 모든 것을 좌우하는 위협으로 취급합니다."
 RULE_OPTION_ISR_PEACE_PROCESS: "평화 진영"
 RULE_OPTION_ISR_PEACE_PROCESS_DESC: "§8노동당§!은 §8메레츠§! 및 아랍계 정당들과 함께 통치하며 두 국가 해법을 진지하게 협상합니다. 팔레스타인 자치정부는 용의자로 감시받는 대신 파트너로서 무장하고, 가자는 제 기능을 하는 항구와 공항을 얻습니다."
 RULE_OPTION_ISR_SECULAR_CENTRE: "세속 중도"
 RULE_OPTION_ISR_SECULAR_CENTRE_DESC: "§8예시 아티드§!, §8청백당§!, §8새로운 희망§!이 나라를 장악하고 종교를 국가에서 다시 분리해 냅니다. 법원은 보호받고 징병제는 다시 쓰이며, 이스라엘은 유럽과 OECD 쪽으로 기웁니다."
 RULE_OPTION_ISR_GREATER_ISRAEL: "대이스라엘"
 RULE_OPTION_ISR_GREATER_ISRAEL_DESC: "§8오츠마 예후디트§!와 §8종교 시온주의당§!이 집권하여 오슬로 체제의 남은 것을 찢어 버립니다. 정착촌은 공고화되고 병합되며, 성전산의 현상 유지는 다시 쓰이고, 군대는 공격받기 전에 북쪽을 칩니다."
 RULE_OPTION_ISR_LOOK_EAST: "동쪽으로의 전환"
 RULE_OPTION_ISR_LOOK_EAST_DESC: "§8리쿠드§! 정부는 워싱턴에서 방향을 틀어 하이파 항구를 중국 사업자에게 임대하고 베이징에 무기와 기술을 팝니다. 이스라엘은 키이우보다 모스크바 쪽으로 기울고, 이스라엘을 보증해 온 서방 동맹은 조건부로 보이기 시작합니다."
 RULE_OPTION_MNT_HISTORICAL: "역사적"
 RULE_OPTION_MNT_HISTORICAL_DESC: "§8지우카노비치 파벌§!은 몬테네그로를 EU와 NATO로 이끄는 한편 국가 기관과 경제에 대한 과두적 통제를 공고히 합니다. 몬테네그로는 제도가 조직범죄 및 정치적 후견 네트워크와 얽혀 있는 작은 서방 성향 국가가 됩니다."
 RULE_OPTION_MNT_EUROPEAN_REFORM: "개혁의 길"
 RULE_OPTION_MNT_EUROPEAN_REFORM_DESC: "민주주의 및 사회민주주의 정당들이 과두 지배자들을 타도하고 공격적인 반부패 개혁 및 후견 네트워크 해체와 함께 EU 가입을 추진합니다. 몬테네그로는 국가 기관이 조직범죄와 과두 지배에서 자유롭게 작동하는 진정한 자유민주주의 국가로 거듭납니다."
 RULE_OPTION_MNT_MONARCHIST_RESTORATION: "군주제 복원"
 RULE_OPTION_MNT_MONARCHIST_RESTORATION_DESC: "몬테네그로의 §8군주주의자와 전통주의자들§!은 페트로비치니에고시 왕조를 복원하고 정교회를 국교로 명문화합니다. 몬테네그로는 유럽 구조로의 통합이 아니라 서방 질서 바깥에서 러시아와 연대하는 교회 중심의 복원을 추구합니다."
 RULE_OPTION_MNT_SOCIALIST_REVIVAL: "사회주의 부활"
 RULE_OPTION_MNT_SOCIALIST_REVIVAL_DESC: "§8공산주의 및 신유고슬라비아 운동§!이 권력을 잡고 티토주의 노선에 따라 경제를 국유화하며 범유고슬라비아 정치 구조의 회복을 추진합니다. 몬테네그로는 자국 영토에서 바깥으로 유고슬라비아 연방을 부활시키려 하며, 사회주의 통치 아래 남슬라브 민족들을 재통합하고자 합니다."
 RULE_OPTION_PER_HISTORICAL: "역사적"
 RULE_OPTION_PER_HISTORICAL_DESC: "이슬람 공화국은 최고 지도자 아래 존속하며, 대통령직은 개혁파와 원칙파 진영 사이를 오갑니다. 이란은 저항의 축을 떠받치고 매 제재 국면에서도 핵 프로그램을 밀어붙이며, 레바논에서 예멘까지 동맹 민병대를 통해 힘을 투사합니다."
 RULE_OPTION_PER_RESTORATION: "공작 왕좌"
 RULE_OPTION_PER_RESTORATION_DESC: "망명 중이던 §8입헌당§!은 §8팔라비§! 왕조를 귀국시키고 세속 왕국 위에 레자 팔라비 2세를 대관합니다. 성직자 질서는 일소되고, 이란은 한 세대에 걸쳐 구축한 대리 세력 네트워크를 버리고 서방으로 돌아섭니다."
 RULE_OPTION_PER_IRANIC_FEDERATION: "이란계 연방"
 RULE_OPTION_PER_IRANIC_FEDERATION_DESC: "§8범이란주의당§!이 집권하여 타지키스탄, 쿠르디스탄, 아제르바이잔, 발루치스탄의 이란계 민족들을 하나의 연방으로 모으려 합니다. 이란은 새로운 이란계 세력권의 중심지가 되고, 이란계 땅을 가진 모든 이웃은 자국 국경이 의문시되는 상황을 맞습니다."
 RULE_OPTION_PER_MOJAHEDIN: "인민 무자헤딘"
 RULE_OPTION_PER_MOJAHEDIN_DESC: "§8무자헤딘 할크§!는 마리암 라자비 아래 망명에서 돌아와 성직자들로부터 국가를 빼앗습니다. 이란은 옛 혁명에 빚진 것이 없는 인민 공화국으로 선포되고, 외교 정책은 처음부터 다시 세워집니다."
 RULE_OPTION_PER_FREEDOM_MOVEMENT: "자유 운동"
 RULE_OPTION_PER_FREEDOM_MOVEMENT_DESC: "§8이란 자유 운동§!은 성직자 통치의 잔해를 물려받아 신앙을 개인의 양심에 맡기는 세속 입헌 공화국을 세웁니다. 혁명수비대는 정치와 사업에서 배제되고, 이란은 평범한 국가로서 서방에 다시 문을 엽니다."
 RULE_OPTION_PER_NATIONAL_FRONT: "민족전선"
 RULE_OPTION_PER_NATIONAL_FRONT_DESC: "§8민족전선§!은 모사데크의 후계자로 돌아와 세속 민족주의와 혁명이 탕진한 석유를 바탕으로 이란을 재건합니다. 테크노크라트들을 다시 일하게 하면서 비동맹을 고수하며 워싱턴에도 모스크바에도 구애하지 않습니다."
 RULE_OPTION_PER_GREEN_MOVEMENT: "녹색 운동"
 RULE_OPTION_PER_GREEN_MOVEMENT_DESC: "§8녹색 운동§!은 이번에는 표가 마침내 개표될 것이라는 약속과 함께 미르호세인 무사비를 집권시킵니다. 이란은 이슬람 공화국으로 남지만 유권자에게 응답하며, 지역은 최고 지도자를 하나의 주소로 삼을 수 없게 됩니다."
 RULE_OPTION_PER_MONTAZERI: "몬타제리의 공화국"
 RULE_OPTION_PER_MONTAZERI_DESC: "§8대아야톨라 몬타제리§!를 둘러싼 개혁 성직자들은 강경파로부터 신학교를 되찾고 마침내 감옥에 대해 책임을 집니다. 신앙은 국가 안에서의 자리를 유지하되, 그 이름으로 자행된 일을 평생 규탄해 온 인물에 의해 완화됩니다."
 RULE_OPTION_PER_AHMADINEJAD: "아마디네자드의 귀환"
 RULE_OPTION_PER_AHMADINEJAD_DESC: "§8마흐무드 아마디네자드§!는 강경 포퓰리스트들을 결집하고 석유 계정에서 빈민에게 돈을 지급하며 세계에 자신을 막아 보라고 도전합니다. 바시지와 안사르 헤즈볼라는 국내에서 국가의 팔이 되고, 대외 대결은 대가가 아니라 목적이 됩니다."
 RULE_OPTION_PER_GHALIBAF: "갈리바프의 질서"
 RULE_OPTION_PER_GHALIBAF_DESC: "§8모하마드 바게르 갈리바프§!는 일을 해내는 지휘관으로서 통치하며, 정치적 자유를 도로, 질서, 성과와 맞바꿉니다. 혁명수비대는 사업 제국을 유지하고 언론은 목줄을 유지하며, 테헤란은 그 비용을 댈 자본을 위해 모스크바에 구애합니다."
 RULE_OPTION_PER_MASHAEI: "마샤이의 이란 학파"
 RULE_OPTION_PER_MASHAEI_DESC: "§8에스판디야르 라힘 마샤이§!는 신앙보다 민족을 앞세우고, 신과 자신 사이에 성직자가 서 있을 필요가 없는 이란을 설파합니다. 신학교는 정치 세력으로서 해체되고, 국가가 수출하는 것은 시아파 이슬람이 아니라 이란 민족주의가 됩니다."
 RULE_OPTION_PER_WORKERS_REPUBLIC: "노동자 공화국"
 RULE_OPTION_PER_WORKERS_REPUBLIC_DESC: "§8투데당§!과 이란 좌파는 망명에서 돌아와 노동자 공화국을 선포합니다. 성직자와 혁명수비대는 함께 해체되고, 이란은 세계에 남은 사회주의 국가들 사이에서 우방을 찾습니다."
 RULE_OPTION_PER_ARTESH: "아르테시 총국"
 RULE_OPTION_PER_ARTESH_DESC: "§8아르테시§!는 남아 있는 민간 정부를 해산하고 자신의 장교들로 이루어진 총국을 통해 통치합니다. 이념은 노골적인 국가 이익에 자리를 내주고, 이란은 혁명가가 아니라 군인으로서 이웃 나라들을 상대합니다."
 RULE_OPTION_HOL_OPEN_VERDICT: "열린 판결"
 RULE_OPTION_HOL_OPEN_VERDICT_DESC: "네덜란드는 같은 의회의 길을 걷지만 그 어느 것도 미리 쓰이지 않습니다. 선거에서 이기는 정당이 §8포퓰리스트§!를 포함하여 연립을 구성합니다. 동맹국들은 다음에 헤이그의 어느 정부를 상대하게 될지 결코 확신하지 못합니다."
 RULE_OPTION_NIG_HISTORICAL: "역사적"
 RULE_OPTION_NIG_HISTORICAL_DESC: "§8인민민주당§!은 연방 중앙을 장악하고, 힘이 아닌 사면으로 니제르 삼각주를 안정시키며 북부와 남부를 불안한 종교적 균형 속에 유지합니다. 나이지리아는 불안정이 아니라 평화유지군을 수출하는 서아프리카의 중심축으로 남습니다."
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY: "사회민주주의 나이지리아"
 RULE_OPTION_NIG_SOCIAL_DEMOCRACY_DESC: "§8전나이지리아인민당§!은 집권당의 지배력을 깨고 연방을 국영 산업, 공공 의료, 폭넓은 안전망 쪽으로 돌립니다. 재분배를 추구하는 아부자는 석유 수입을 국내에 쓰고, 외국 투자자들은 지역 내 다른 곳을 살핍니다."
 RULE_OPTION_NIG_CHRISTIAN_NATION: "기독교 나이지리아"
 RULE_OPTION_NIG_CHRISTIAN_NATION_DESC: "아부자는 북부 주들의 샤리아를 폐지하고 연방 정부를 §8교회§! 중심으로 재편하며, 저항하는 설교자들에 맞서 기독교 민병대를 동원합니다. 북부는 협상이 아닌 힘으로 평정되고, 나이지리아의 무슬림 이웃 나라들은 냉랭해집니다."
 RULE_OPTION_NIG_CALIPHATE: "서아프리카 칼리파국"
 RULE_OPTION_NIG_CALIPHATE_DESC: "샤리아가 북부 주들에서 퍼져 나가 §8보코하람§!이 정부와 싸우는 대신 정부 안에 앉게 되고, 연방 공화국은 칼리파국에 자리를 내줍니다. 나이지리아의 이웃 나라들은 서아프리카 최대의 군대를 지휘하는 팽창주의적 이슬람 국가와 마주합니다."
 RULE_OPTION_BRM_HISTORICAL: "역사적"
 RULE_OPTION_BRM_HISTORICAL_DESC: "§8민주주의 민족 동맹§!이 집권하는 동안 §8타트마도§!는 할당 의석과 국방 관련 부처를 유지하며, 로힝야는 쫓겨나기보다 압박을 받습니다. 미얀마는 ASEAN 안에 남고, 소수 민족 반란은 계속 이어지며, 장군들은 되찾을 수 없는 것은 아무것도 잃지 않습니다."
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY: "민주주의의 등대"
 RULE_OPTION_BRM_BEACON_OF_DEMOCRACY_DESC: "§8민주주의 민족 동맹§!은 군부의 헌법적 역할을 해체하고 소수 민족 자치와 로힝야 시민권을 갖춘 연방 국가를 세웁니다. 미얀마는 다민족 연방 민주주의 국가가 되어 지역 파트너십 쪽으로 방향을 옮깁니다."
 RULE_OPTION_BRM_AN_IRON_FIST: "철권"
 RULE_OPTION_BRM_AN_IRON_FIST_DESC: "§8타트마도§!는 군부 통치를 강화하고 야당을 짓누르며 소수 민족 반란을 진압하고 민주 개혁을 요구하는 국제 사회의 압력을 거부합니다. 미얀마는 ASEAN을 탈퇴하고 로힝야를 추방하며 이웃 나라들과의 대결로 돌아섭니다."
 RULE_OPTION_NRY_HISTORICAL: "역사적"
 RULE_OPTION_NRY_HISTORICAL_DESC: "중도 연립이 물러나고 §8노동당§!이 정부를 되찾아 석유 기금을 복지국가에 쓰며 노르웨이를 동맹 안에 확고히 유지합니다. 오슬로는 이웃 나라들이 가입한 연합에는 들어가지 않은 채 평화 회담과 개발 원조를 본업으로 삼습니다."
 RULE_OPTION_NRY_CHRISTIAN_PEOPLES_DESC: "§8기독교 인민당§!은 총리직을 유지하며 가족 도덕, 개발 원조, 후한 난민 할당량을 국가 정책에 명문화합니다. 노르웨이는 동맹과 훈련하지만 브뤼셀과는 거리를 두며, 남쪽 이웃 나라들이 받아들이지 못하는 이민자들을 수용합니다."
 RULE_OPTION_NRY_PROGRESS_DESC: "§8진보당§!은 야당에서 벗어나 석유 자산을 해외 원조가 아니라 감세, 병동, 노인 돌봄에 씁니다. 노르웨이는 중앙집권화하고 이민법을 강화하며, 한때 노르웨이를 믿었던 북유럽 이웃 나라들에 더 차가운 얼굴을 돌립니다."
 RULE_OPTION_NKO_HISTORICAL: "역사적"
 RULE_OPTION_NKO_HISTORICAL_DESC: "김정일의 막내아들이 후계자로 육성되어 국가를 물려받고, §8조선노동당§!은 §8병진§!, 즉 핵탄두와 소비재를 동시에 추구하기 전에 장성들에 대한 지휘권을 재확립합니다. 왕조는 유지되고, 시장 상인들은 용인되지만 결코 신뢰받지 못하며, 한반도는 정전 협정이 남긴 그대로 얼어붙어 있습니다."
 RULE_OPTION_NKO_KIM_JONG_NAM: "개혁적인 후계자"
 RULE_OPTION_NKO_KIM_JONG_NAM_DESC: "망명 중인 큰형이 승계 투쟁에서 승리하여 §8조선노동당§!을 중국식 개방 쪽으로 돌리고, §8주체§!를 경제특구, 합작 투자, 그리고 마침내 투표와 맞바꿉니다. 평양은 고립을 투자와 교환하고, 서울은 마침내 협상할 수 있는 이웃을 얻습니다."
 RULE_OPTION_NKO_MILITARY_JUNTA: "장군들이 장악하다"
 RULE_OPTION_NKO_MILITARY_JUNTA_DESC: "총참모부는 김씨 후계자들 모두를 거부하고 스스로 권력을 잡아 §8선군§!을 유지하며 효용을 다한 일가를 숙청합니다. 중국과의 교역이 나라를 먹여 살리는 동안 군대는 어느 당에도 응하지 않으며, 모든 이웃 나라는 군인들이 운영하는 핵보유국을 염두에 두고 계획을 세워야 합니다."
 RULE_OPTION_POL_HISTORICAL: "역사적"
 RULE_OPTION_POL_HISTORICAL_DESC: "폴란드는 탈공산주의 좌파 아래 체제 전환을 마무리하고 유럽 연합에 가입한 뒤, 모스크바에 맞서 통치하며 워싱턴에 의지하는 §8법과 정의§!에 나라를 넘깁니다. 바르샤바는 NATO에서 가장 목소리 큰 동부의 목소리이자 베를린과 브뤼셀의 상시적인 골칫거리가 됩니다."
 RULE_OPTION_POL_CIVIC_PLATFORM: "시민강령 시대"
 RULE_OPTION_POL_CIVIC_PLATFORM_DESC: "§8시민강령§!은 정부를 유지하며 폴란드의 미래를 유로화, 독일의 투자, 그에 따르는 기금에 겁니다. 바르샤바는 브뤼셀이 지역에서 가진 가장 믿을 수 있는 파트너가 되면서도 모스크바에 대한 노선은 유지합니다."
 RULE_OPTION_POL_WALESA: "바웬사의 귀환"
 RULE_OPTION_POL_WALESA_DESC: "§8기독민주당§!은 자유 노조의 기억을 등에 업고 레흐 바웬사를 다시 대통령궁으로 보냅니다. 폴란드는 NATO 안에 확고히 남아 유럽 주류를 좇는 대신 신용을 군 재건에 씁니다."
 RULE_OPTION_POL_KORWIN_COMMONWEALTH: "코르빈과 연방"
 RULE_OPTION_POL_KORWIN_COMMONWEALTH_DESC: "야누시 코르빈미케와 §8현실정치연합§!은 국가를 기초만 남기고 축소시키며 리투아니아, 벨라루스, 우크라이나에 대등한 상대로 구애합니다. 부활한 연방은 서방 동맹을 결코 떠나지 않은 채 독일과 러시아 사이에서 성장합니다."
 RULE_OPTION_POL_KORWIN_EAST: "코르빈이 동쪽으로 돌아서다"
 RULE_OPTION_POL_KORWIN_EAST_DESC: "야누시 코르빈미케와 §8현실정치연합§!은 모스크바 및 민스크와 직접 거래하여 폴란드의 오랜 청산을 마무리합니다. 바르샤바는 서방 진영을 떠나 리비우에 대한 영유권을 주장하고 CSTO에 자리를 차지합니다."
 RULE_OPTION_POL_FALANGA: "팔랑가의 부상"
 RULE_OPTION_POL_FALANGA_DESC: "거리의 민병대와 통합 민족주의 전선이 §8팔랑가§!를 변방에서 정부로 끌어올립니다. 폴란드는 유럽 연합과 NATO를 떠나 모든 이웃 나라를 불안하게 하는 고백적이고 군사화된 국가가 됩니다."
 RULE_OPTION_POL_RED_DREAM: "붉은 꿈"
 RULE_OPTION_POL_RED_DREAM_DESC: "제2의 혁명이 §8폴란드 사회당§!을 집권시키고 체제 전환기의 민영화를 묻어 버립니다. 폴란드는 서방과 단절하고 선거를 중단하며 노동자 공화국으로 스스로를 재건합니다."
 RULE_OPTION_POL_PEOPLES_ARMY: "인민군"
 RULE_OPTION_POL_PEOPLES_ARMY_DESC: "§8폴란드 공산주의자 연합§!의 강경파는 혁명을 장악하고 인민군을 국가의 근간으로 재건합니다. 폴란드는 새로운 동방 블록의 주둔지가 되어 서쪽을 공공연한 적의로 바라봅니다."
 RULE_OPTION_ROM_HISTORICAL: "역사적"
 RULE_OPTION_ROM_HISTORICAL_DESC: "일리에스쿠와 나스타세가 이끄는 §8사회민주당§!은 산업을 민영화하고 경제를 재건하는 한편 새로운 반부패 총국으로 만연한 부패와 싸웁니다. 루마니아는 NATO에, 이어 유럽 연합에 가입하여 개인숭배가 아닌 제도에 닻을 내린 서방 민주주의 국가로 자리를 굳힙니다."
 RULE_OPTION_ROM_NATIONAL_LIBERAL: "자유주의 공화국"
 RULE_OPTION_ROM_NATIONAL_LIBERAL_DESC: "§8국민자유당§!은 민간 기업과 개인의 주도권을 풀어놓기 위해 단일세율 과세, 시장 자유화, 분권화를 주창하며 집권합니다. 루마니아는 자유주의적이고 자유 시장 원칙에 입각한 유럽 정체성을 세우고, 사회민주주의 대안이 허용했을 수준보다 서방에 더 깊이 통합됩니다."
 RULE_OPTION_ROM_PEASANT_PARTY: "기독민주당의 집권 유지"
 RULE_OPTION_ROM_PEASANT_PARTY_DESC: "§8기독민주 국민농민당§!은 민주 협약의 붕괴에서 살아남아 농촌 투자, 농업 부흥, 종교적 보수주의를 강조하며 농촌을 루마니아 정치의 중심으로 유지합니다. 토지 반환은 공산주의자들에게 빼앗긴 이들에게 재산을 돌려주어 나라의 농민들에게 새 질서에 대한 이해관계를 줍니다."
 RULE_OPTION_ROM_DEMOCRATIC_PARTY: "유럽의 정당"
 RULE_OPTION_ROM_DEMOCRATIC_PARTY_DESC: "바세스쿠가 이끄는 §8민주당§!은 정치적 중도를 차지한 뒤 나라의 사회민주주의 및 보수 세력을 공공연히 친유럽을 표방하는 단일 정당으로 합병합니다. 유럽 통합은 루마니아 정치의 결정적 목표가 되어 다른 모든 관심사를 서방 합류 작업에 종속시킵니다."
 RULE_OPTION_ROM_RESTORED_MONARCHY: "왕관의 귀환"
 RULE_OPTION_ROM_RESTORED_MONARCHY_DESC: "민주 협약은 스스로를 다시 추스르고 군주제에 관한 국민투표를 실시하며, §8미하이 1세§!는 50년간의 공산주의 이후 왕관의 상징적 권위를 복원하며 왕좌로 돌아옵니다. 루마니아 지도부는 몰도바, 우크라이나 등지를 포함한 모든 루마니아인에 대한 왕권이라는 왕관의 오랜 권리를 주장합니다."
 RULE_OPTION_ROM_GREATER_ROMANIA: "대루마니아"
 RULE_OPTION_ROM_GREATER_ROMANIA_DESC: "코르넬리우 바딤 투도르의 §8대루마니아당§!이 대통령직을 차지하고 보안 기관과 언론을 당-국가의 도구로 바꾸며 공포와 선전으로 권력을 공고히 합니다. 루마니아는 모든 루마니아 땅의 강제 통일을 추구하여 몰도바, 헝가리, 불가리아, 우크라이나, 세르비아를 위협하고 지역을 화약고로 만듭니다."
 SOV_AI_BEHAVIOR: "@SOV 러시아"
 RULE_OPTION_SOV_HISTORICAL: "역사적"
 RULE_OPTION_SOV_HISTORICAL_DESC: "러시아는 §8통합 러시아§!의 영도 아래 권력 수직축을 재건하고 올리가르히들을 굴복시키며, 에너지 자원의 부를 바탕으로 과거의 대국적 위상을 회복합니다. 주변국들은 크림반도를 병합하고 돈바스 공화국들을 배후 지원하며 끝내 대규모 무력으로 우크라이나를 침공하는 국가를 마주하게 됩니다."
 RULE_OPTION_SOV_OLIGARCHS: "과두 지배자들의 공화국"
 RULE_OPTION_SOV_OLIGARCHS_DESC: "민영화로 러시아를 사들인 자들이 그것을 유지하고, §8과두 지배자들§!은 국가를 자신들의 자산을 위한 지주 회사처럼 운영합니다. 외국 자본은 모든 문이 열려 있음을 발견하는 반면 군대와 국고는 이 체제의 비용을 떠안게 됩니다."
 RULE_OPTION_SOV_LIBERAL_REFORM: "자유주의로의 전환"
 RULE_OPTION_SOV_LIBERAL_REFORM_DESC: "§8야블로코§!와 §8우파세력연합§!이 러시아의 미래를 둘러싼 논쟁에서 승리하여 서구식 모델에 맞춰 사법부, 언론, 경제를 재건합니다. 모스크바는 주변국에 대한 지배력을 내려놓는 대신 유럽 및 미국과의 동반자 관계를 구축합니다."
 RULE_OPTION_SOV_COMMUNIST_REVIVAL: "붉은 부활"
 RULE_OPTION_SOV_COMMUNIST_REVIVAL_DESC: "§8러시아 연방 공산당§!은 민영화를 되돌리고 구소련 공화국들을 다시 규합하겠다는 공약을 내세워 집권합니다. 국내의 재국유화와 대외적인 동구권의 부활을 통해 러시아는 다시 한번 대립 진영의 수장으로 우뚝 섭니다."
 RULE_OPTION_SOV_NATIONALIST: "대러시아"
 RULE_OPTION_SOV_NATIONALIST_DESC: "§8자유민주당§!은 원한을 타고 집권하여 러시아가 마땅히 받아야 한다고 믿는 모든 국경을 노립니다. 발트해에서 중앙아시아까지 이웃 나라들은 상대할 국가가 아니라 행사할 영유권이 됩니다."
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK: "민족볼셰비키 질서"
 RULE_OPTION_SOV_NATIONAL_BOLSHEVIK_DESC: "§8민족볼셰비키§!는 적색과 갈색을 융합해 자유주의자나 올리가르히 누구에게도 굴복하지 않는 혁명 국가를 세우고, 구소련의 국경을 일시적인 모욕으로 여기며 무력으로 러시아의 영토를 재규합합니다."
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE: "철의 대통령"
 RULE_OPTION_SOV_MEDVEDEV_HARDLINE_DESC: "드미트리 메드베데프는 대통령직을 돌려주기를 거부하고 물려받은 것 위에 자신만의 안보 국가를 구축합니다. 쌍두 체제는 공개적으로 깨지고, 전임자 주변의 인물들은 러시아 정치에서 쫓겨납니다."
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL: "메드베데프의 해빙"
 RULE_OPTION_SOV_MEDVEDEV_LIBERAL_DESC: "드미트리 메드베데프는 자신의 현대화 프로그램을 현실로 만들어 보안 기관의 장악력을 느슨하게 하고 서방의 기술과 자본에 구애합니다. 러시아는 국내에서 자유화하고 해외에서 누그러지며, 실로비키는 논쟁에서 영원히 패배합니다."
 RULE_OPTION_SAU_HISTORICAL: "역사적"
 RULE_OPTION_SAU_HISTORICAL_DESC: "§8사우드 가문§!은 끊김 없는 승계로 왕좌를 유지하고, 석유 수입을 탈석유 다각화에 쓰며, 미국과의 안보 관계를 유지하면서 베이징이 해빙을 중재할 때까지 이란을 억제합니다. 사우디아라비아는 걸프의 중심축이자 그 연안 모든 군주국의 선임 파트너로 남습니다."
 RULE_OPTION_SAU_KHALEEJI_UNION: "칼리지 연합"
 RULE_OPTION_SAU_KHALEEJI_UNION_DESC: "왕국은 걸프 협력 회의를 말뿐인 협의체에서 단일 국가로 밀어붙여, 먼저 공동 통화와 통합 지휘부를, 이어 리야드 아래의 정치적 연합을 이룹니다. 소규모 걸프 군주국들은 완전히 흡수되어 독립 국가로서 존재하기를 멈춥니다."
 RULE_OPTION_SAU_FAISALITE_KINGDOM: "파이살 체제의 복원"
 RULE_OPTION_SAU_FAISALITE_KINGDOM_DESC: "왕실 내 반동 세력이 승계 다툼에서 승리하여 §8와하비파 울라마§!를 파이살 국왕 시절의 권위로 복원하고, 외국 자금과 외국 기지를 나라 밖으로 몰아냅니다. 왕국은 국경을 완전히 닫아걸거나, 두 초강대국 모두에 맞서 무슬림 세계를 이끄는 제3극으로 자리매김합니다."
 RULE_OPTION_SAU_MILITARY_RULE: "장교들의 쿠데타"
 RULE_OPTION_SAU_MILITARY_RULE_DESC: "국가방위대가 특권을 유지하는 동안 자금난에 시달린 정규군이 국왕을 폐위하고 §8최고 군사 평의회§!를 통해 통치합니다. 장교들은 이제 누가 리야드를 대변하는지 알 수 없는 걸프를 다스리며, 그들의 장악력은 살 수 있는 정통성만큼만 지속됩니다."
 RULE_OPTION_SAU_BAATHIST_REPUBLIC: "아랍 사회주의 공화국"
 RULE_OPTION_SAU_BAATHIST_REPUBLIC_DESC: "군주제가 사라지자 §8아랍 바트당§!이 공화국을 차지하고 경제의 핵심 부문을 국유화하며 군대를 아랍 통일의 선봉으로 재건합니다. 반도 전역의 외국 주둔군에는 철수 통보가 내려지고, 모든 아랍 수도가 단일 국가로 초대됩니다."
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC: "시아파 공화국"
 RULE_OPTION_SAU_ISLAMIC_REPUBLIC_DESC: "오랫동안 탄압받은 동부 주의 §8시아파 정당들§!이 공화국을 물려받아 헌법적 타협과 호메이니주의 노선 사이에서 선택합니다. 걸프 최대의 석유 매장량이 편을 바꾸고, 테헤란은 수십 년 동안 찾아 헤맨 동맹을 얻습니다."
 RULE_OPTION_SAU_PEOPLES_REPUBLIC: "붉은 공화국"
 RULE_OPTION_SAU_PEOPLES_REPUBLIC_DESC: "§8공산당§!이 공화국을 차지하고 유전을 전면 국유화하며 반도를 아랍 세계 전역의 혁명 기지로 바꿉니다. 리야드는 모스크바와 조약을 맺거나 비동맹 블록을 이끌고, 걸프 군주국들은 국경에 적이 생겼음을 깨닫습니다."
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC: "민주주의 실험"
 RULE_OPTION_SAU_PARLIAMENTARY_REPUBLIC_DESC: "§8국민민주회의§!가 제헌 선거에서 승리하여 선출된 마즐리스, 독립된 사법부, 자유 언론을 갖춘 자유주의 헌법을 씁니다. 서방은 걸프에서 최초의 아랍 민주주의 국가를 얻고, 이웃의 모든 군주국은 자신들이 왜 그렇지 않은지 설명해야 합니다."
 PMR_AI_BEHAVIOR: "@PMR 트란스니스트리아"
 RULE_OPTION_PMR_HISTORICAL: "역사적"
 RULE_OPTION_PMR_HISTORICAL_DESC: "티라스폴은 이고르 스미르노프와 그의 공화국을 물려받는 후계자들의 손에 남고, 키시너우와의 회담을 러시아 가스, 루블, 평화유지군에 대한 더 깊은 의존과 맞바꿉니다. 드니스터 분쟁은 동결된 채 남고 몰도바는 합의라 부를 만한 것을 아무것도 얻지 못합니다."
 RULE_OPTION_PMR_DEMOCRATIC: "키시너우로 가는 다리"
 RULE_OPTION_PMR_DEMOCRATIC_DESC: "트란스니스트리아는 권력을 §8자유주의자들§!에게 넘기고 전시 안보 기구를 해체하며 연방 파트너로서 몰도바로 돌아가는 길을 협상합니다. 모스크바는 드니스터의 발판을 잃고 유럽 연합은 안정된 국경을 얻습니다."
 RULE_OPTION_PMR_REPUBLICAN: "공화파로의 전환"
 RULE_OPTION_PMR_REPUBLICAN_DESC: "§8공화당§!은 청렴한 정부, 소규모 사업, 누구에게도 응하지 않는 독립이라는 강령으로 티라스폴을 차지합니다. 트란스니스트리아는 러시아의 주둔지이기를 멈추고 국가가 되려 시도하기 시작합니다."
 RULE_OPTION_PMR_COMMUNIST: "복원된 붉은 깃발"
 RULE_OPTION_PMR_COMMUNIST_DESC: "§8공산당§!이 티라스폴에서 다시 집권하여 셰리프 지주 회사를 국유화하고 부활한 몰다비아 소비에트 사회주의 공화국의 논거를 다시 엽니다. 키시너우는 합의가 아니라 영토를 되찾기를 원하는 이웃과 마주합니다."
 RULE_OPTION_PMR_MONARCHIST: "드니스터의 왕관"
 RULE_OPTION_PMR_MONARCHIST_DESC: "§8군주주의자들§!은 드니스터에 군주를 옹립하고 트란스니스트리아를 제정 러시아의 마지막 생존 조각으로 재건합니다. 티라스폴은 소련에 대한 향수를 궁정, 근위대, 더 오래된 정통성에 대한 주장과 맞바꿉니다."
 RULE_OPTION_PMR_MILITARY_JUNTA: "장군의 공화국"
 RULE_OPTION_PMR_MILITARY_JUNTA_DESC: "알렉산드르 레베드 장군이 크라스노야르스크에서 불려 와 자신이 지킨 공화국을 이끌고, §8제14군 장교들§!이 그와 함께 부처들을 장악합니다. 트란스니스트리아는 모스크바의 허락을 기다리지 않고 키시너우와 부쿠레슈티에 맞서 무장합니다."
 RULE_OPTION_PMR_UKRAINIAN: "키이우를 향하여"
 RULE_OPTION_PMR_UKRAINIAN_DESC: "티라스폴은 러시아 후원자들을 쫓아내고 우크라이나 장교와 행정가들을 초청해 그 자리를 대신하게 하며, 우크라이나 편입을 국민투표에 부칩니다. 드니스터는 러시아의 서쪽 전초기지이기를 멈추고 키이우의 동쪽 국경이 됩니다."
 SWI_AI_BEHAVIOR: "@SWI 스위스"
 RULE_OPTION_SIN_HISTORICAL: "역사적"
 RULE_OPTION_SIN_HISTORICAL_DESC: "§8인민행동당§!은 섬에 대한 끊김 없는 지배를 유지하며 총리직을 고촉통에서 리셴룽으로, 이어 로런스 웡에게 넘기고, 강경한 방위를 모두를 설득해 가라앉히는 외교 정책과 결합합니다. 싱가포르는 워싱턴에 우호적이고 베이징에 열려 있는, 부유하고 무장한 동남아시아의 비동맹 중재자로 남습니다."
 RULE_OPTION_SIN_OPPOSITION_VICTORY: "야당의 승리"
 RULE_OPTION_SIN_OPPOSITION_VICTORY_DESC: "선거 개혁이 §8인민행동당§!의 장악력을 느슨하게 하고, §8노동자당§!은 자유화의 물결을 타고 정부에 입성합니다. 싱가포르는 NATO와 유럽에 의지하는 서구식 민주주의 국가로 바뀌고, 지역은 관리된 일당 통치의 모범을 잃습니다."
 RULE_OPTION_SIN_LOOK_EAST: "동방 정책"
 RULE_OPTION_SIN_LOOK_EAST_DESC: "§8인민행동당§!은 외국 자산을 국유화하고 중국식 언론 모델을 채택하며 섬을 상하이 협력 기구와 BRICS로 이끕니다. 싱가포르는 베이징의 영향권에 있는 경제적 챔피언이 되고, 이 나라가 장악한 해협은 더 이상 중립 수역이 아닙니다."
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS: "해협의 지배자"
 RULE_OPTION_SIN_MASTER_OF_THE_STRAITS_DESC: "§8인민행동당§! 내 강경파는 야당을 금지하고 군대를 최우선에 두며 도시 국가의 부를 조호르와 리아우 제도에 대한 영유권으로 바꿉니다. 싱가포르는 자국이 의존하는 해협에서 조건을 강요하기 시작하고, 말레이시아와 인도네시아는 이들을 위해 싸울 각오가 된 작은 이웃을 마주합니다."
 RULE_OPTION_SPR_HISTORICAL: "역사적"
 RULE_OPTION_SPR_HISTORICAL_DESC: "§8국민당§!과 §8스페인 사회노동당§!은 정부를 번갈아 맡으며, 아스나르에 이어 사파테로, 라호이, 산체스가 몽클로아에 입성합니다. 스페인은 유럽 연합과 NATO의 헌신적인 회원국으로 남고, 자치 공동체들을 긴장되지만 온전한 헌법 안에 유지합니다."
 RULE_OPTION_SPR_CONSERVATIVE: "보수 스페인"
 RULE_OPTION_SPR_CONSERVATIVE_DESC: "§8국민당§!은 한 세대 동안 코르테스를 장악하고 시장 자유주의적이고 대서양주의적 노선으로 통치합니다. 스페인은 확고한 NATO 회원국이자 브뤼셀에서 모험을 삼가는 파트너로 남습니다."
 RULE_OPTION_SPR_SOCIALIST: "사회주의 스페인"
 RULE_OPTION_SPR_SOCIALIST_DESC: "§8스페인 사회노동당§!과 더 넓은 좌파는 한 세대 동안 권력을 유지하며 복지국가를 어느 이전 정부보다 멀리 밀어붙입니다. 스페인은 유럽의 사회민주주의적 논거가 되어 지중해를 함께 이끕니다."
 RULE_OPTION_SPR_NATIONALIST: "민족주의 부흥"
 RULE_OPTION_SPR_NATIONALIST_DESC: "§8복스§!와 민족주의 우파가 변방에서 벗어나 정부를 장악합니다. 스페인은 자치 공동체와 이주에 맞서 돌아서며, 브뤼셀을 따르는 대신 논쟁을 벌입니다."
 RULE_OPTION_SPR_FALANGIST: "국가 생디칼리슴"
 RULE_OPTION_SPR_FALANGIST_DESC: "§8팔랑헤§!가 정치적 광야에서 돌아와 국가 생디칼리슴 모델 위에 국가를 재건합니다. 코르테스는 수직적 생디카트에 자리를 내주고, 스페인은 유럽이 아니라 포르투갈과 옛 제국을 바라봅니다."
 RULE_OPTION_SPR_COMMUNIST: "붉은 공화국"
 RULE_OPTION_SPR_COMMUNIST_DESC: "§8스페인 공산당§!은 사회주의자들이 차지하지 않으려던 국가를 차지하고, 공화국은 마르크스주의 노선에 따라 재건됩니다. 스페인은 서방 진영을 떠나고 NATO는 남쪽 측면을 잃습니다."
 RULE_OPTION_SPR_MONARCHIST: "절대 왕권"
 RULE_OPTION_SPR_MONARCHIST_DESC: "왕관과 교회가 다시 국가의 중심에 놓이고, 스페인은 잃어버린 제국을 되찾는 일에 착수합니다. 지브롤터, 마그레브, 옛 부왕령은 역사가 아니라 끝나지 않은 일로 취급됩니다."
 RULE_OPTION_SWE_HISTORICAL: "역사적"
 RULE_OPTION_SWE_HISTORICAL_DESC: "스웨덴은 §8사회민주당§!과 §8온건당§! 주도 정부를 오가며 유럽 연합에 남고, 북유럽 및 발트 파트너십을 유지하며, 러시아가 위협적으로 돌아선 뒤에야 비로소 군사적 비동맹을 NATO와 맞바꿉니다. 입헌 군주제는 손대지 않은 채 남고, 발트해는 가장 믿을 수 있는 서방 파트너를 유지합니다."
 RULE_OPTION_SWE_NATIONALIST: "스웨덴 우선"
 RULE_OPTION_SWE_NATIONALIST_DESC: "§8스웨덴 민주당§!은 이주와 법과 질서를 내걸고 정부에 급부상하여 국경을 닫고 징병제와 영토 방위를 재건하며, 민주 질서를 떠나지 않으면서 브뤼셀과 거리를 둡니다. 스웨덴은 내부로 향하고, 이웃 나라들은 지역에서 가장 개방적인 파트너를 잃습니다."
 RULE_OPTION_SWE_NORTHERN_CROWN: "북방의 사자"
 RULE_OPTION_SWE_NORTHERN_CROWN_DESC: "민족주의의 급부상은 권력을 §8군주주의자들§!에게 넘기고, 이들은 왕정을 복원하여 조약 또는 전쟁으로 핀란드, 발트 연안, 스칸디나비아를 스웨덴 왕관 아래 재통합하려 합니다. 북유럽과 발트 국가들은 문턱에 선 수정주의 강대국과 마주합니다."
 RULE_OPTION_SWE_RED_SWEDEN_DESC: "§8좌파당§!과 공산주의 운동이 릭스다그를 장악하고 산업을 국유화하며 NATO와 서방의 제재에 의문을 제기하고, 스웨덴을 러시아, 중국, BRICS 쪽으로 돌려세웁니다. 서방은 발트해의 모범적인 파트너를 잃고 모스크바는 북쪽 측면에서 친구를 얻습니다."
 RULE_OPTION_SWE_ARMED_NEUTRALITY: "무장 중립"
 RULE_OPTION_SWE_ARMED_NEUTRALITY_DESC: "§8녹색당§! 주도 정부는 모든 블록을 거부하고 무장 중립을 법으로 명문화하며, 총력 방위, 고틀란드, 사이버 보안에 독자적으로 자금을 댑니다. 스웨덴은 NATO 밖에 머물고 강대국과의 연대에서도 벗어나 있습니다."
 RULE_OPTION_SWI_HISTORICAL: "역사적"
 RULE_OPTION_SWI_HISTORICAL_DESC: "§8스위스 국민당§!은 스위스가 무장 중립을 유지하고 국제연합에 가입하며 해외에 평화유지군을 보내고 회원국 지위 대신 양자 조약으로 유럽 연합과 결속하는 동안 연방 연립의 최대 정당으로 남습니다. 유럽은 모든 편과 교역하되 어느 편에도 가입하지 않는 신뢰할 수 있는 중립국을 알프스에 유지합니다."
 RULE_OPTION_SWI_EURO_ATLANTIC: "유럽-대서양 통합"
 RULE_OPTION_SWI_EURO_ATLANTIC_DESC: "§8사회민주당§!이 정부를 이끌고 스위스는 중립을 버리며 NATO에 가입하고 유럽 연합 가입을 신청합니다. 서방 동맹은 프랑스, 독일, 오스트리아, 이탈리아 사이의 알프스 거점을 얻습니다."
 RULE_OPTION_SWI_FORTRESS: "요새 스위스"
 RULE_OPTION_SWI_FORTRESS_DESC: "§8스위스 국민당§!은 나라를 내부로 돌려 브뤼셀 및 국제연합과 거리를 두고 용병을 수출하며 산악 요새를 재건합니다. 유럽은 파트너를 잃고, 그 누구도 자기 편으로 셀 수 없는 고슴도치를 얻습니다."
 RULE_OPTION_SWI_SOCIALIST_REPUBLIC: "스위스 사회주의 공화국"
 RULE_OPTION_SWI_SOCIALIST_REPUBLIC_DESC: "연방이 해체되고 공산주의 일당 공화국이 은행을 국유화하며 유럽 연합을 규탄하고 모든 블록 밖에 남습니다. 유럽은 서방 통합을 전면 거부하는 이념적 경쟁자를 알프스에서 발견합니다."
 RULE_OPTION_SWI_NATIONAL_FRONT: "민족전선"
 RULE_OPTION_SWI_NATIONAL_FRONT_DESC: "연방이 해체되고 부활한 §8민족전선§!이 프랑스, 이탈리아, 오스트리아 알프스와 리히텐슈타인을 알프스 연방으로 요구하는 일당 국가를 세웁니다. 스위스의 이웃 나라들은 유럽의 심장부에서 복수를 노리는 강국의 영토 요구에 직면합니다."
 RULE_OPTION_SYR_SECULAR_COALITION: "세속 연립"
 RULE_OPTION_SYR_SECULAR_COALITION_DESC: "다마스쿠스의 봄이 아사드 시대를 끝내고 §8시리아 민주 인민당§!이 이끄는 세속 연립이 자유 선거에서 승리하여 과두 지배자들과 안보 국가를 해체합니다. 시리아는 유럽과 미국으로 향하고 지역 균형은 테헤란과 모스크바에서 멀어집니다."
 RULE_OPTION_SYR_MUSLIM_BROTHERHOOD: "무슬림 형제단"
 RULE_OPTION_SYR_MUSLIM_BROTHERHOOD_DESC: "다마스쿠스의 봄이 아사드 시대를 끝내고 §8시리아 무슬림 형제단§!이 자유 선거에서 승리하여 튀르키예와 카타르가 자금을 대는 튀르키예식 보수 민주주의를 구축합니다. 시리아는 튀르키예 영향권의 수니파 주도 국가가 되고 다마스쿠스에 대한 이란과 러시아의 영향력은 약해집니다."
 RULE_OPTION_SYR_NATIONAL_FRONT: "민족 진보 전선"
 RULE_OPTION_SYR_NATIONAL_FRONT_DESC: "다마스쿠스의 봄이 아사드 시대를 끝내지만 §8민족 진보 전선§!이 아사드 일가 없이 자유 선거에서 승리하여 다마스쿠스에 국가주의적이고 민족주의적인 정부를 유지합니다. 시리아는 이란의 영향력을 몰아내고 러시아와의 관계를 재확인하며, 이스라엘과 튀르키예를 상대로 까다로운 협상가로 남습니다."
 RULE_OPTION_UKR_HISTORICAL: "역사적"
 RULE_OPTION_UKR_HISTORICAL_DESC: "오렌지 혁명이 빅토르 유셴코를 집권시키고, 빅토르 야누코비치와 §8지역당§!이 대통령직을 되찾으며, 유로마이단이 이들을 쓸어내고 페트로 포로셴코, 이어 볼로디미르 젤렌스키를 세웁니다. 우크라이나는 혁명을 통해 서방으로 돌아서고, 모스크바는 크림과 돈바스로 응수합니다."
 RULE_OPTION_UKR_DEMOCRATIC: "오렌지 우크라이나"
 RULE_OPTION_UKR_DEMOCRATIC_DESC: "§8우리 우크라이나§!의 오렌지 진영은 혁명 이후에도 권력을 유지하며, 야누코비치의 복귀나 유로마이단의 혼란 없이 우크라이나를 유럽 연합과 NATO 쪽으로 꾸준히 이끕니다. 우크라이나는 서방 블록의 동쪽 끝이 되고, 모스크바는 이를 반드시 되돌려야 할 손실로 여깁니다."
 RULE_OPTION_UKR_REGIONS: "지역당"
 RULE_OPTION_UKR_REGIONS_DESC: "빅토르 야누코비치와 §8지역당§!은 국가를 장악하고 모스크바 쪽으로 다시 돌려세웁니다. 유럽 협정은 서명되지 않은 채 남고, 나라의 동부와 서부는 경쟁하는 선거구로 통치됩니다."
 RULE_OPTION_UKR_COMMUNIST: "공산주의 우크라이나"
 RULE_OPTION_UKR_COMMUNIST_DESC: "§8우크라이나 공산당§!은 체제 전환이 끝내지 못한 논쟁에서 승리하여 공화국을 되찾습니다. 키이우는 소련에서 벗어나는 대신 소련을 재결합하기 위해 움직입니다."
 RULE_OPTION_UKR_SOCIALIST: "사회주의 우크라이나"
 RULE_OPTION_UKR_SOCIALIST_DESC: "§8우크라이나 사회당§!은 집권하여 옛 붉은 깃발에 손대지 않은 채 재분배와 공공 소유를 바탕으로 나라를 재건합니다. 과두 지배자들은 장악력을 잃고, 키이우는 브뤼셀과 모스크바 모두와 거리를 유지합니다."
 RULE_OPTION_UKR_NATIONALIST: "우크라이나 민족주의"
 RULE_OPTION_UKR_NATIONALIST_DESC: "§8우크라이나 반군§!의 후계자들이 집권하여 민족주의 전통을 중심으로 국가를 재건합니다. 우크라이나는 서방의 허락을 기다리지 않고 모스크바와 맞서며, 러시아어 사용 지역은 구애받기보다 통치받습니다."
 RULE_OPTION_UKR_VITRENKO: "비트렌코"
 RULE_OPTION_UKR_VITRENKO_DESC: "나탈리야 비트렌코의 §8진보사회당§!은 정교, 소련에 대한 향수, 그녀 특유의 여성 정치를 융합한 강령으로 나라를 이끕니다. 우크라이나는 서방에 강하게 등을 돌리고 유럽의 제안을 적대 행위로 해석합니다."
 RULE_OPTION_ENG_RULE_BRITANNIA: "룰 브리타니아"
 RULE_OPTION_ENG_RULE_BRITANNIA_DESC: "왕실 지지자들은 양당 체제를 깨뜨리고 나라의 쇠퇴를 바탕으로 운동을 키워 완전히 권력을 잡습니다. 제국은 무력으로 복원되고, 영국은 더 이상 워싱턴의 하위 파트너가 아닙니다."
 RULE_OPTION_USA_HISTORICAL: "역사적"
 RULE_OPTION_USA_HISTORICAL_DESC: "백악관은 실제 일정대로 부시에서 오바마, 트럼프, 바이든으로 넘어가고, 나라가 테러와의 전쟁과 이라크 전쟁을 치르는 동안 트럼프가 두 번째 임기로 복귀합니다. 미국은 온전한 상태를 유지하며 서방 동맹의 중심축으로 남습니다."
 RULE_OPTION_USA_DEMOCRATS: "민주당 시대"
 RULE_OPTION_USA_DEMOCRATS_DESC: "§8민주당§!이 모든 대통령 선거를 휩쓸며 시대 내내 중도좌파로 통치합니다. 미국은 다자 기구와 외교적 노력을 통해 세계를 이끕니다."
 RULE_OPTION_USA_REPUBLICANS: "공화당 시대"
 RULE_OPTION_USA_REPUBLICANS_DESC: "§8공화당§!이 모든 대통령 선거를 휩쓸며 중도우파로 통치합니다. 미국은 군사력과 무력 위협으로 세계 질서를 유지합니다."
 RULE_OPTION_USA_GREAT_REBELLION: "대반란"
 RULE_OPTION_USA_GREAT_REBELLION_DESC: "조작된 개표는 대통령 없이 통치하는 임시 의회에 권력을 넘기고, 정당들은 결과를 두고 서로를 갈가리 찢습니다. 미국 투표에 대한 신뢰가 무너지고 초강대국은 해외에서 정통성을 잃습니다."
 RULE_OPTION_USA_GREEN: "녹색당의 승리"
 RULE_OPTION_USA_GREEN_DESC: "투표 개혁이 양당의 독점을 깨뜨리고 §8녹색당§!이 백악관과 의회를 차지합니다. 미국은 생태와 비무장화를 향해 내부로 돌아서고 전 세계적 군사 역할에서 물러납니다."
 RULE_OPTION_USA_BULL_MOOSE: "불무스 부활"
 RULE_OPTION_USA_BULL_MOOSE_DESC: "선거 개혁이 §8진보당§!을 부활시키고, 진보당은 독점 해체와 복지 확대 강령으로 집권합니다. 미국은 세계 지배보다 자국 발전에 집중하는 번영하고 안정된 강국이 됩니다."
 RULE_OPTION_USA_DEMSOC: "민주사회주의자들"
 RULE_OPTION_USA_DEMSOC_DESC: "§8민주사회주의자들§!이 대통령직과 의회의 통제권을 얻고 산업 국유화와 복지 확대에 착수합니다. 미국 경제는 국유화와 재분배를 향해 내부로 돌아섭니다."
 RULE_OPTION_USA_SHEPARD: "셰퍼드의 코뮌"
 RULE_OPTION_USA_SHEPARD_DESC: "아나코공산주의 §8셰퍼드§! 운동이 개혁된 선거에서 승리하여 공동체적이고 분권화된 사회를 세웁니다. 미국은 자치 코뮌들로 분열되어 통일 국가로서 기능하기를 멈춥니다."
 RULE_OPTION_USA_LIBERTARIAN: "자유지상주의자의 승리"
 RULE_OPTION_USA_LIBERTARIAN_DESC: "§8자유지상당§!이 대통령직과 의회를 차지하고 연방 정부를 헌법상 필수 기능만 남기도록 축소합니다. 미국은 해외 기지와 공약에서 철수하며 세계를 스스로의 운명에 맡깁니다."
 RULE_OPTION_USA_REFORM_PARTY: "개혁당의 승리"
 RULE_OPTION_USA_REFORM_PARTY_DESC: "§8개혁당§!이 반부패와 보호무역 강령으로 승리하여 워싱턴에 균형 예산을 강제합니다. 미국은 자국 경제를 관리하기 위해 내부로 돌아서고 세계 지도력에서 후퇴합니다."
 RULE_OPTION_USA_CONSTITUTION_PARTY: "헌법당의 승리"
 RULE_OPTION_USA_CONSTITUTION_PARTY_DESC: "§8헌법당§!이 엄격한 헌법주의와 사회적 보수주의 강령으로 승리합니다. 미국은 동맹에서 철수하고 국내의 국경과 가치를 지키는 데 집중합니다."
 RULE_OPTION_USA_NATIONALIST_FRONT: "민족전선"
 RULE_OPTION_USA_NATIONALIST_FRONT_DESC: "§8민족전선§!이 우익 포퓰리즘, 보호무역 강령과 이민에 대한 강경 노선으로 권력을 잡습니다. 공화국은 존속하지만 자유주의적 국제 질서에 맞서 급격히 돌아섭니다."
 RULE_OPTION_USA_MILITARY_JUNTA: "군사 정권"
 RULE_OPTION_USA_MILITARY_JUNTA_DESC: "군부가 민족전선으로부터 권력을 빼앗아 국가를 직접 통제합니다. 미국은 무력으로 반구의 지배권을 추구하며 이웃 나라들에 위협이 됩니다."
 RULE_OPTION_USA_FASCIST: "미국 자연주의자들"
 RULE_OPTION_USA_FASCIST_DESC: "파시즘 운동인 §8미국 자연주의자들§!이 권력을 잡고 힘과 이념으로 통치를 공고히 합니다. 미국은 카리브해와 라틴 아메리카 전역에 대한 정복으로 돌아서 전체주의 제국을 건설합니다."
 RULE_OPTION_USA_MONARCHY: "미국 왕조"
 RULE_OPTION_USA_MONARCHY_DESC: "미국의 한 왕조가 민족전선 정부에서 대관하여 워싱턴에 세습 군주제를 세웁니다. 미국은 공화주의를 버리고 제국의 지배권을 복원하려는 야망을 가진 왕국이 됩니다."
 RULE_OPTION_USA_RED_JUNTA: "붉은 군사 정권"
 RULE_OPTION_USA_RED_JUNTA_DESC: "공산주의 군사 정치위원회가 셰퍼드 코뮌으로부터 권력을 빼앗아 공산주의 국가를 군사화합니다. 미국은 반구와 그 너머에서 무장 투쟁을 계획하는 혁명 강국이 됩니다."
 RULE_OPTION_USA_TROTSKYIST: "영구 혁명"
 RULE_OPTION_USA_TROTSKYIST_DESC: "§8사회주의 노동자당§!이 권력을 잡고 미국을 영구적인 전 세계 혁명에 투입합니다. 미국 군대는 해외로 진군하여 공산주의를 모든 대륙에 무력으로 퍼뜨립니다."
 RULE_OPTION_USA_ANARCHIST: "아나키스트 사회"
 RULE_OPTION_USA_ANARCHIST_DESC: "아나키스트 운동은 나라를 자치 코뮌의 무국가 연방으로 집산화합니다. 미국은 알아볼 수 있는 국가로서 기능하기를 멈추고 자치 공동체의 조각보가 됩니다."
 RULE_OPTION_USA_POST_UNITED: "후 미합중국 시대"
 RULE_OPTION_USA_POST_UNITED_DESC: "10년에 걸친 시위, 탄압, 마비를 초래한 철도 파업이 연방 정부를 무너뜨리고 미국은 계승 공화국들로 분열됩니다. 초강대국은 지역 경쟁자들로 해체되고 세계는 냉전 이후의 중심축을 잃습니다."
 RULE_OPTION_USA_GREAT_COLLAPSE: "대붕괴"
 RULE_OPTION_USA_GREAT_COLLAPSE_DESC: "미국은 내부 모순으로 일시에 붕괴하고 주들은 스스로를 지켜야 하는 처지에 놓입니다. 초강대국은 하룻밤 사이에 내파하고 세계는 질서의 주된 보증자를 잃습니다."
 RULE_ROI_CAP: "§Y투자 수익률§! 상한"
 RULE_OPTION_ROI_CAP_10: "10%"
 RULE_OPTION_ROI_CAP_10_DESC: "국제 투자로 얻는 연간 §Y투자 수익률§!이 기본값인 20% 대신 10%로 제한됩니다."
 RULE_OPTION_ROI_CAP_15: "15%"
 RULE_OPTION_ROI_CAP_15_DESC: "국제 투자로 얻는 연간 §Y투자 수익률§!이 기본값인 20% 대신 15%로 제한됩니다."
 RULE_OPTION_ROI_CAP_20: "20%"
 RULE_OPTION_ROI_CAP_20_DESC: "국제 투자로 얻는 연간 §Y투자 수익률§!이 기본값인 20%로 제한됩니다."
 RULE_OPTION_ROI_CAP_25: "25%"
 RULE_OPTION_ROI_CAP_25_DESC: "국제 투자로 얻는 연간 §Y투자 수익률§!이 기본값인 20% 대신 25%로 제한됩니다. 이 설정에서는 밀레니엄 던의 맞춤 업적이 비활성화됩니다."
 RULE_OPTION_VEN_HISTORICAL: "역사적"
 RULE_OPTION_VEN_HISTORICAL_DESC: "차베스주의는 §8베네수엘라 통합사회주의당§! 아래 이어지며, 사회 미션에는 자금이 투입되고 석유 산업은 국가의 손에 있으며 쿠바와의 파트너십이 있고 전쟁은 없습니다. 카라카스는 핑크 타이드의 자금줄이 되고 워싱턴은 이를 문제로 취급합니다."
 RULE_OPTION_VEN_WORLD_REVOLUTION: "혁명 수출"
 RULE_OPTION_VEN_WORLD_REVOLUTION_DESC: "§8볼리바르 혁명§!은 코뮌을 무장시키고 콜롬비아로 진군하며 안데스와 남부 원뿔 지역 전역에서 봉기를 부추깁니다. 남아메리카는 문턱에서 혁명 전쟁을 맞이합니다."
 RULE_OPTION_VEN_DEMOCRATIC_OPPOSITION: "민주 야당"
 RULE_OPTION_VEN_DEMOCRATIC_OPPOSITION_DESC: "민주 야당은 차베스주의를 몰아내고 워싱턴과의 관계를 회복하며 군대를 미국식으로 재무장시킵니다. 볼리바르 블록은 자금줄을 잃고 카리브해는 친서방 베네수엘라를 얻습니다."
 RULE_OPTION_VEN_CORPORATE_STATE: "기업 국가"
 RULE_OPTION_VEN_CORPORATE_STATE_DESC: "야당은 나라를 PDVSA 이사회에 넘기고, 이사회는 은행, 산업가, 국영 석유 회사가 운영하는 독점적 기업 공화국을 세웁니다. 베네수엘라는 지역 우파와 연대하는, 깃발을 가진 석유 사업체가 됩니다."
 RULE_OPTION_VEN_FREE_MARKET: "자유 시장 공화국"
 RULE_OPTION_VEN_FREE_MARKET_DESC: "야당은 규제 완화와 군대까지 포함한 모든 것의 민영화로 국가 경제를 쓸어냅니다. 베네수엘라는 외국 자본이 몰려드는 자유지상주의적 실험장으로 변합니다."
 RULE_OPTION_VEN_MILITARY_JUNTA: "군사 정권"
 RULE_OPTION_VEN_MILITARY_JUNTA_DESC: "장교단이 궁을 차지하고 반대자들을 숙청하며 팽창주의적 민족주의 정권으로 통치합니다. 베네수엘라의 이웃 나라들인 가이아나와 네덜란드령 섬들은 자국에 영유권을 가진 국가와 국경을 맞대고 있음을 알게 됩니다."
 RULE_OPTION_SER_HISTORICAL: "역사적"
 RULE_OPTION_SER_HISTORICAL_DESC: "불도저 혁명 이후 §8세르비아 민주 야당§!이 집권하여 전범들을 인도하고 몬테네그로가 독립 국민투표를 실시하도록 허용합니다. 세르비아는 공식 승인 없이 브뤼셀 협정을 통해 코소보와 관계를 정상화하고 유럽 연합 가입을 추진합니다."
 RULE_OPTION_SER_GREATER_SERBIA: "대세르비아"
 RULE_OPTION_SER_GREATER_SERBIA_DESC: "밀로셰비치가 살아남고 §8사회당§!은 도둑 정치를 공고히 하며 대세르비아로 돌아서서 세르비아계 인구가 있는 모든 지구를 요구합니다. 유고슬라비아 전쟁이 재개되고 세르비아 소수 민족을 가진 모든 이웃 나라가 표적이 됩니다."
 RULE_OPTION_SER_BALKAN_FEDERATION: "발칸 연방"
 RULE_OPTION_SER_BALKAN_FEDERATION_DESC: "밀로셰비치가 살아남아 정복 대신 발칸 연합의 회원 자격을 이웃들에게 제시하며 반도의 통합자로 스스로를 재창조합니다. 보스니아, 마케도니아, 코소보 및 다른 발칸 국가들이 베오그라드의 지붕 아래로 끌려듭니다."
 RULE_OPTION_SER_SOCIALIST_YUGOSLAVIA: "사회주의 유고슬라비아"
 RULE_OPTION_SER_SOCIALIST_YUGOSLAVIA_DESC: "밀로셰비치는 지도자 숭배, 국유화된 산업, 계획 경제와 함께 나라를 티토의 사회주의로 되돌립니다. 옛 공화국들은 붉은 유고슬라비아에 재가입하라는 최후통첩을 받습니다."
 RULE_OPTION_SER_KINGDOM: "세르비아 왕국"
 RULE_OPTION_SER_KINGDOM_DESC: "민족주의자와 군주주의자들이 밀로셰비치를 타도하고 교회와 군대의 뒷받침 아래 §8카라조르제비치§! 왕관을 복원합니다. 세르비아는 왕관과 교회로 통치하며 코소보, 마케도니아, 불가리아에 대한 옛 영유권을 추구합니다."
 RULE_NUCLEAR_WEAPONS: "핵무기 연구"
 RULE_NUCLEAR_WEAPONS_ALLOWED_DESC: "§Y기본값§!. 모든 국가가 핵미사일, 핵어뢰, 핵무기 특수 프로젝트를 연구할 수 있습니다. AI는 이를 낮은 우선순위로 취급합니다."
 RULE_NUCLEAR_WEAPONS_AI_DISABLED: "플레이어 전용"
 RULE_NUCLEAR_WEAPONS_AI_DISABLED_DESC: "AI 국가는 핵무기 기술을 연구하거나 핵무기 특수 프로젝트를 시작하지 않습니다. 플레이어는 모든 접근 권한을 유지합니다."
 RULE_NUCLEAR_WEAPONS_DISABLED_DESC: "핵무기 기술과 핵무기 특수 프로젝트가 숨겨지며 누구도 연구할 수 없습니다. 게임 시작 시 부여된 무기는 제거되지 않습니다."
 ABK_AI_BEHAVIOR: "@ABK 압하지야"
 RULE_OPTION_ABK_HISTORICAL: "역사적"
 RULE_OPTION_ABK_HISTORICAL_DESC: "세르게이 바가프시가 병든 아르진바의 뒤를 잇고, 압하지야는 여권, 비자 면제 여행, 투자, 무기를 통해 러시아와 결속합니다. 조지아는 흑해의 러시아 전초기지가 되는 분리 지역과 마주하게 됩니다."
 RULE_OPTION_ABK_COMMUNIST: "공산주의로의 회귀"
 RULE_OPTION_ABK_COMMUNIST_DESC: "§8압하지야 공산당§!이 마르크스주의를 복원하고, 집단 농장과 인민 민병대를 중심으로 일당 국가를 건설하며, 원조를 위해 베이징과 평양으로 눈을 돌립니다. 모스크바는 흑해의 피보호국이 동쪽으로 기우는 것을 지켜보고, 조지아는 국경에 붉은 영토가 생기는 것을 마주합니다."
 RULE_OPTION_ABK_MONARCHY: "압하지야 왕국"
 RULE_OPTION_ABK_MONARCHY_DESC: "민족주의자들이 중세 압하지야 왕국을 내세워 의회를 폐지하고, 독재 아래 디아스포라와 외국 군주국들에게 구애합니다. 압하지야는 민병대 군대를 일으켜 조지아로 진군하고 무력으로 캅카스를 재편합니다."
 AFG_AI_BEHAVIOR: "@AFG 아프가니스탄"
 RULE_OPTION_AFG_HISTORICAL: "역사적"
 RULE_OPTION_AFG_HISTORICAL_DESC: "북부동맹은 미국의 개입 때까지 탈레반에 맞서 살아남으며, 이후 하미드 카르자이와 아슈라프 가니가 미국의 후원 아래 이슬람 공화국을 이끕니다. 아프가니스탄은 NATO와 서방 기부국에 의존하지만 탈레반 반란은 결코 완전히 사라지지 않습니다."
 RULE_OPTION_AFG_JAMIAT: "자미아트 공화국"
 RULE_OPTION_AFG_JAMIAT_DESC: "아흐마드 샤 마수드와 부르하누딘 랍바니의 후계자인 §8자미아트-에 이슬라미§!가 탈레반 이후에도 국가를 유지하며, 자신들의 방식으로 성직자 중심의 중립 이슬람 공화국을 재건합니다. 아프가니스탄은 워싱턴과 모스크바 모두와 거리를 둡니다."
 RULE_OPTION_AFG_HAZARA: "하자라 정렬"
 RULE_OPTION_AFG_HAZARA_DESC: "§8헤즈브-에 와흐다트§!가 권력을 장악하여 하자라인을 옹호하고 아프가니스탄을 테헤란의 영향권으로 끌어들입니다. 이웃 국가들은 지역 분열의 반대편에 서 있는 시아파 성향의 아프가니스탄을 마주하게 됩니다."
 RULE_OPTION_AFG_MONARCHY: "왕의 귀환"
 RULE_OPTION_AFG_MONARCHY_DESC: "§8군주주의자§!들이 자히르 샤 가문에 왕관을 되돌려주고 옛 아프가니스탄을 본뜬 입헌 군주제를 재건합니다. 왕정 국가는 파슈툰스탄에 대한 역사적 영유권 주장을 되살리고 영토 회복주의적 야망으로 파키스탄을 불안하게 합니다."
 RULE_OPTION_AFG_EMIRATE: "이슬람 토후국"
 RULE_OPTION_AFG_EMIRATE_DESC: "굴부딘 헥마티아르의 §8헤즈브-에 이슬라미§!가 권력을 장악하고 선거를 중단하며 탈레반의 이름 없이 이슬람 토후국을 건설합니다. 서방의 원조가 사라지고 아프가니스탄의 이웃 국가들은 강경 이슬람주의 정권과 마주하게 됩니다."
 RULE_OPTION_AFG_JUNBISH: "준비시 국가"
 RULE_OPTION_AFG_JUNBISH_DESC: "압둘 라시드 도스툼의 §8준비시-에 밀리§!가 집권하여 북부에 세속적이고 권위주의적인 국가를 수립합니다. 아프가니스탄은 서방과의 동반 관계를 버리고 중앙아시아와 러시아 영향권으로 방향을 전환합니다."
 AZE_AI_BEHAVIOR: "@AZE 아제르바이잔"
 RULE_OPTION_AZE_HISTORICAL: "역사적"
 RULE_OPTION_AZE_HISTORICAL_DESC: "하이다르 알리예프가 대통령직을 아들 일함에게 넘기는 가운데 §8신 아제르바이잔당§!이 권력을 유지하고, 석유 수입이 튀르키예 송유관을 통해 서쪽으로 흘러 군대를 재건합니다. 바쿠는 결국 아르메니아로부터 카라바흐를 되찾으며, 어느 블록에도 가입하지 않고 러시아, 튀르키예, 이란, 서방 사이에서 균형을 유지합니다."
 RULE_OPTION_AZE_DEMOCRATIC: "인민전선의 귀환"
 RULE_OPTION_AZE_DEMOCRATIC_DESC: "§8아제르바이잔 인민전선당§!이 하이다르 알리예프의 쿠데타로 빼앗겼던 정부를 되찾고 나라를 진정한 선거에 개방합니다. 바쿠는 유럽과 NATO로 눈을 돌리고 국제 중재를 통해 카라바흐 분쟁의 협상 타결을 추구합니다."
 RULE_OPTION_AZE_JUNTA: "장성들의 통치"
 RULE_OPTION_AZE_JUNTA_DESC: "§8아제르바이잔군§!이 정치인들을 밀어내고 참모본부로 통치하며, 무력으로 카라바흐를 되찾기 위해 동원 태세에 돌입합니다. 바쿠는 영토 회복주의적 야망으로 아르메니아, 조지아, 이란을 위협하는 호전적인 군사 독재 국가가 됩니다."
 BOL_AI_BEHAVIOR: "@BOL 볼리비아"
 RULE_OPTION_BOL_HISTORICAL: "역사적"
 RULE_OPTION_BOL_HISTORICAL_DESC: "§8민족민주행동§!은 미국의 압력 아래 코카 생산과 싸우고 시위가 나라를 뒤흔들다가, §8사회주의 운동§!이 집권하여 가스를 국유화하고 원주민 다수를 중심으로 국가를 재편합니다. 볼리비아는 비동맹을 유지하며 메르코수르에 가입하고, 카라카스, 베이징, 모스크바와 가까워지며, 바다에 대한 권리 주장을 전쟁이 아닌 법정으로 가져갑니다."
 RULE_OPTION_BOL_MEDIA_LUNA: "메디아 루나의 부상"
 RULE_OPTION_BOL_MEDIA_LUNA_DESC: "산타크루스 동부 저지대에 기반을 둔 우파는 §8민족민주행동§!을 집권 상태로 유지시켜 민영화와 코카 근절을 추진하고 볼리비아를 워싱턴 및 NATO와 결속시킵니다. 볼리비아는 안데스에서 미국의 파트너가 되고 칠레와의 가스 수출 분쟁을 해결합니다."
 RULE_OPTION_BOL_REFORMIST: "개혁 공화국"
 RULE_OPTION_BOL_REFORMIST_DESC: "§8혁명적 민족주의 운동§!은 부패와 싸우고 원주민 토지를 보호하며 시장을 개방하는 개혁 연립을 구성합니다. 볼리비아는 서방 성향의 실용주의 노선으로 돌아서서, 옛 전쟁을 치르는 대신 칠레 및 미국과 교역합니다."
 RULE_OPTION_BOL_MILITARY_JUNTA: "장군들의 통치"
 RULE_OPTION_BOL_MILITARY_JUNTA_DESC: "군대가 권력을 장악하고 카르텔과 거리를 짓누르며 반세르 독재의 기억을 되살립니다. 볼리비아는 차코 전쟁과 태평양 전쟁의 복수를 위해 재무장하고, 파라과이, 칠레, 브라질은 복수주의 이웃 나라를 마주하게 됩니다."
 RULE_OPTION_BOL_WIPHALA: "위팔라의 빛"
 RULE_OPTION_BOL_WIPHALA_DESC: "§8파차쿠티 원주민 운동§!은 위팔라 깃발 아래 원주민주의 혁명을 이끌어 외국 기업과 대농장을 몰수합니다. 볼리비아는 상하이 협력 기구의 영향권에 가입하고 반식민 투쟁을 페루, 칠레, 아마존으로 확대합니다."
 RULE_OPTION_SIA_HISTORICAL: "역사적"
 RULE_OPTION_SIA_HISTORICAL_DESC: "§8타이락타이§!와 그 후계 정당들은 민주당과 왕실이 이들과 다투는 동안 선거에서 승리하고, 장군들은 법원이 그러지 않을 때마다 쿠데타로 정부를 되찾습니다. 태국은 지역 블록을 이끌지 않는 서방의 조약 동맹으로 남고 영토 회복주의적 요구는 휴면 상태로 둡니다."
 RULE_OPTION_SIA_GREATER_THAILAND: "대태국"
 RULE_OPTION_SIA_GREATER_THAILAND_DESC: "태국은 재무장하고 라오스, 캄보디아, 말레이 북부 주들, 샨 접경 지대에 영유권을 압박합니다. 방콕은 동남아시아 본토의 패권국이 되고 이웃 나라들은 그에 맞춰 무장합니다."
 RULE_OPTION_SIA_REGIONAL_PACT: "지역 조약"
 RULE_OPTION_SIA_REGIONAL_PACT_DESC: "태국은 §8SEATO§!를 워싱턴이 아닌 방콕이 이끄는 동남아시아 방위 조약으로 재건합니다. 지역은 독자적인 안보 체제를 얻고 강대국들은 동남아시아를 단일 블록으로 상대해야 합니다."
 RULE_OPTION_SIA_PEOPLES_REPUBLIC: "인민공화국"
 RULE_OPTION_SIA_PEOPLES_REPUBLIC_DESC: "§8태국 공산당§!은 정글에서 돌아와 이산의 빈민들을 규합하여 권력을 잡습니다. 태국은 미국의 영향권을 버리고 베이징과 인도차이나에 더 가까워집니다."
 RULE_OPTION_SIA_REFORMIST: "오렌지 혁명"
 RULE_OPTION_SIA_REFORMIST_DESC: "§8전진당§! 세대가 권력을 잡아 군대를 억제하고 왕실에 도전하며, 어쩌면 공화국으로 끝날 수도 있습니다. 장군들은 방콕에 대한 거부권을 잃고, 동남아시아에서 가장 오래된 군주제 중 하나는 스스로를 바꾸거나 무너져야 합니다."
 FIN_AI_BEHAVIOR: "@FIN 핀란드"
 RULE_OPTION_FIN_HISTORICAL: "역사적"
 RULE_OPTION_FIN_HISTORICAL_DESC: "핀란드는 §8사회민주당§!, §8중앙당§!, §8국민연합당§! 정부 아래 북유럽 노선을 유지하며, NATO에 가입하기 전 스웨덴과 상호 방위 조약으로 결속합니다. 러시아는 유럽에서 가장 긴 국경을 따라 요새화된 서방 동맹과 마주합니다."
 RULE_OPTION_FIN_RUSSIAN_ALIGNMENT: "모스크바의 파트너"
 RULE_OPTION_FIN_RUSSIAN_ALIGNMENT_DESC: "핀란드는 북유럽 파트너들에게서 돌아서서 크렘린과 함께 CSTO에 가입하고, 러시아 장비로 재무장하며 스웨덴 및 노르웨이와의 국경을 요새화합니다. 러시아의 동맹이 보트니아만에 닿으면서 북유럽의 균형이 무너집니다."
 RULE_OPTION_FIN_KINGDOM_OF_FINLAND: "핀란드 왕국"
 RULE_OPTION_FIN_KINGDOM_OF_FINLAND_DESC: "핀란드는 독일과 연대하고, 베를린에 카이저가 돌아오면 §8헤센카셀 가문§!의 왕을 옹립하여 올란드를 재무장시킵니다. 왕국은 이어 카렐리야, 페차모, 살라, 콜라에 영유권을 주장하며 지역을 러시아에 대한 복수전으로 끌고 갑니다."
 KOR_AI_BEHAVIOR: "@KOR 대한민국"
 RULE_OPTION_KOR_HISTORICAL: "역사적"
 RULE_OPTION_KOR_HISTORICAL_DESC: "서울이 제도를 개혁하고 인권을 옹호하며 북한에 대해 방어적 태도를 유지하는 가운데, 권력은 자유주의 성향의 §8새천년민주당§!과 보수 성향의 §8한나라당§! 사이를 오갑니다. 대한민국은 미국 동맹에 닻을 내린 채 아시아 전역의 주요 교역국으로 성장합니다."
 RULE_OPTION_KOR_SUNSHINE: "햇볕정책"
 RULE_OPTION_KOR_SUNSHINE_DESC: "§8새천년민주당§!은 집권을 유지하며 정보기관을 통제하고, 한국의 안보를 한국인의 손에 맡기기 위해 주한미군을 축소하면서 평양과의 관여를 추구합니다. 워싱턴은 한반도에서 가장 확고한 발판을 잃고, 베이징과 평양은 대화할 의사가 있는 서울을 발견합니다."
 RULE_OPTION_KOR_HARDLINE: "강경 보수"
 RULE_OPTION_KOR_HARDLINE_DESC: "보수 성향의 §8한나라당§!은 입지를 굳히고 비례대표제를 폐지하며 일본과 반북 연합을 구축하는 한편 김정은 정권을 내부에서부터 와해시키려 합니다. 한반도의 냉전은 날카로워지고, 평양은 총 한 발 쏘지 않고 자신을 무너뜨리려는 남쪽과 마주합니다."
 RULE_OPTION_KOR_YUSIN: "유신 복원"
 RULE_OPTION_KOR_YUSIN_DESC: "보수 세력이 권력을 잡고 §8박정희§!를 숭배하며 계엄령을 선포하고, 군부와 정보기관의 통치 아래 §8유신§! 독재를 복원한 뒤 분단을 무력으로 해결할 준비를 합니다. 북한은 정복을 노리는 무장한 남쪽 정권과 마주하고 동북아시아는 제2차 한국전쟁에 대비합니다."
 NKR_AI_BEHAVIOR: "@NKR 아르차흐"
 RULE_OPTION_NKR_HISTORICAL: "역사적"
 RULE_OPTION_NKR_HISTORICAL_DESC: "아르차흐는 전시 세금을 철폐하고 농장과 광산을 재건하며, §8친아르메니아 무소속§!의 집권 아래 아르차흐 방위군을 아르메니아군에 편입합니다. 공화국은 국제적 승인을 받지 못한 채 안보를 예레반에 의존하며, 아제르바이잔과의 분쟁도 해결되지 않은 채 남습니다."
 KOS_AI_BEHAVIOR: "@KOS 코소보"
 RULE_OPTION_KOS_HISTORICAL: "역사적"
 RULE_OPTION_KOS_HISTORICAL_DESC: "§8코소보 민주 동맹§!이 유엔 관할 주를 이끌어 주민투표로 독립에 이르게 하고, 해외에서 독립 승인을 얻기 위해 활동합니다. 코소보는 EU 후보국 지위와 미국의 투자를 추구하며, 세르비아와는 보복이 아닌 협력으로 관계를 정리합니다."
 RULE_OPTION_KOS_ALBANIAN_UNITY: "알바니아 통합"
 RULE_OPTION_KOS_ALBANIAN_UNITY_DESC: "§8코소보 민주당§!이 정권을 잡아 서방 후견국들과 멀어지고 알바니아와의 통합을 밀어붙입니다. 코소보는 몬테네그로의 반군에 자금을 대고 세르비아에 대한 보복 전쟁을 준비하며, 통합을 거부하는 티라나는 프리슈티나와의 전쟁 위험을 안게 됩니다."
 RULE_OPTION_KOS_YUGOSLAV_REVIVAL: "유고슬라비아 부활"
 RULE_OPTION_KOS_YUGOSLAV_REVIVAL_DESC: "공산주의 정당 §8코소보 해방 민족 운동§!이 집권해 서방에서 등을 돌리고 자유주의자들을 짓밟습니다. 코소보는 베이징에 구애하며 자국의 주도로 유고슬라비아 연방을 복원하려 합니다."
 LIC_AI_BEHAVIOR: "@LIC 리히텐슈타인"
 RULE_OPTION_LIC_HISTORICAL: "역사적"
 RULE_OPTION_LIC_HISTORICAL_DESC: "리히텐슈타인은 대공의 헌법상 권한을 강화하고, 저세율 조세 피난처로서 금융 부문을 키우며 군대 없이 지냅니다. 공국은 외국인 노동자에게 문호를 열되 유럽 연합 밖에 머문 채, 스위스와 오스트리아의 조용하고 부유한 이웃으로 남습니다."
 RULE_OPTION_LIC_REPUBLIC: "공화제 개혁"
 RULE_OPTION_LIC_REPUBLIC_DESC: "리히텐슈타인은 대공의 권한을 억제하고 왕위 계승법을 고쳐 쓰다가 마침내 군주제를 폐지합니다. 새 공화국은 조세 피난처 모델을 버리고 유럽 연합 및 더 넓은 서방 경제와의 긴밀한 통합을 택합니다."
 RULE_OPTION_LIC_PRINCELY: "대공 통치"
 RULE_OPTION_LIC_PRINCELY_DESC: "§8군주주의자§!들이 정권을 잡아 세습대공 알로이스에게 전권을 맡기고, 국경을 닫고 나라를 지킬 군대를 창설합니다. 공국은 안으로 눈을 돌려 유산을 지키며 더 큰 이웃 나라들을 의심의 눈으로 봅니다."
 SMA_AI_BEHAVIOR: "@SMA 산마리노"
 RULE_OPTION_SMA_HISTORICAL: "역사적"
 RULE_OPTION_SMA_HISTORICAL_DESC: "§8산마리노 기독민주당§!이 연립 정부를 이끌며, 공화국의 금융 피난처 이미지를 벗고 유럽 연합과 제휴 협상을 시작합니다. 산마리노는 이탈리아의 긴밀한 파트너이자 서방 공동체의 조용한 일원으로 남습니다."
 RULE_OPTION_SMA_SOCIAL_DEMOCRATS: "집권한 좌파"
 RULE_OPTION_SMA_SOCIAL_DEMOCRATS_DESC: "§8사회주의자 및 민주주의자당§!이 기독민주당에서 정권을 넘겨받아 노동조합, 소기업, 복지국가를 중심으로 정책 강령을 짜 나갑니다. 산마리노는 이탈리아의 지원과 유럽 사회민주주의 좌파와의 긴밀한 유대에 의존합니다."
 SOO_AI_BEHAVIOR: "@SOO 남오세티야"
 RULE_OPTION_SOO_HISTORICAL: "역사적"
 RULE_OPTION_SOO_HISTORICAL_DESC: "모스크바가 뒷받침하는 강자들이 러시아의 자금과 로키 터널에 의존해 분리독립 공화국을 연명시키다가 §8니하즈§! 당이 정권을 잡으며, 러시아는 공식적인 합병 없이 이 공화국의 생명줄이자 보호자로 남습니다. 조지아의 영유권 주장은 러시아군 뒤에 동결된 채로 남고, 츠힌발리는 모스크바의 피보호국으로 남습니다."
 RULE_OPTION_SOO_COMMUNIST: "공산주의 부활"
 RULE_OPTION_SOO_COMMUNIST_DESC: "§8남오세티야 공산당§!이 집권해 소련식 질서를 오세티야 ASSR로 복원하고, 모스크바의 권위 아래 북오세티야와의 통합을 추구합니다. 조지아, 아르메니아, 아제르바이잔, 이란, 튀르키예는 캅카스 전역에 혁명을 수출하려는 이념적으로 공격적인 공화국의 공산주의 전복 공작에 직면합니다."
 RULE_OPTION_SOO_NATIONALIST: "알란 패권"
 RULE_OPTION_SOO_NATIONALIST_DESC: "민족주의 포퓰리스트들이 고대 알란족의 유산을 받아들이고 오세티야 민족을 북오세티야 및 러시아와 통합하려 합니다. 조지아는 민족 통합에 골몰하는 영토 회복주의 정권과 맞서게 됩니다. 가상 콘텐츠가 활성화되어 있으면 그 구상은 대스키타이 부활로까지 확대되어, 아르메니아와 북캅카스 공화국들이 그 영토 팽창에 직면합니다."
 TAJ_AI_BEHAVIOR: "@TAJ 타지키스탄"
 RULE_OPTION_TAJ_HISTORICAL: "역사적"
 RULE_OPTION_TAJ_HISTORICAL_DESC: "에모말리 라흐몬과 그의 §8인민민주당§!은 일가 지배를 굳히고 보안 기관에 의존하며, CSTO에 잔류하고 러시아의 제201군사기지를 유지하며 로군 댐 건설을 추진합니다. 타지키스탄은 러시아에 동조하는 독재 체제이자 아프가니스탄 국경의 완충지로 남습니다."
 RULE_OPTION_TAJ_DEMOCRATIC: "민주 혁명"
 RULE_OPTION_TAJ_DEMOCRATIC_DESC: "타지크 통합 야권이 재기하여 봉기로 라흐몬을 무너뜨리고, §8타지키스탄 민주당§!이 페르시아 민족주의, 반러시아 노선으로 집권하여 러시아어의 공용어 지위를 폐지합니다. 러시아는 CSTO 동맹국을 잃고, 중앙아시아에는 테헤란에 구애하는 민족주의 국가가 등장합니다."
 RULE_OPTION_TAJ_ISLAMIST: "이슬람 부흥"
 RULE_OPTION_TAJ_ISLAMIST_DESC: "야권의 봉기가 §8이슬람부흥당§!을 집권시켜 이슬람 법을 도입하고, 타지키스탄은 걸프 자금을 구하면서 CIS와 거리를 둡니다. 타슈켄트와 모스크바는 우즈베키스탄 내 봉기를 지원하는 이슬람주의 정부와 마주하게 됩니다."
 RULE_OPTION_TAJ_COMMUNIST: "공산주의 복원"
 RULE_OPTION_TAJ_COMMUNIST_DESC: "야권의 봉기로 §8타지키스탄 공산당§!이 다시 집권해 경제를 국유화하고, 러시아의 후원과 소련식 재통합을 추구합니다. 모스크바는 충성스러운 피보호국을 되찾고 중국 투자자들은 밀려납니다."
 RULE_EVENT_HORIZON_MANUAL: "수동"
 RULE_EVENT_HORIZON_MANUAL_DESC: "이벤트 호라이즌 시나리오는 저절로 시작되지 않습니다. 원할 때 §Y$EH_start_scenario_decision$§! 결정을 실행해 시작하십시오.\n\n§Y참고:§! §Y이벤트 호라이즌§!의 거대 국가들이 형성되면 현재의 중점 트리를 잃고 시나리오 전용 중점 트리로 대체됩니다."
 RULE_HLS_ENABLE_MEME_CONTENT: "@HLS 바티칸 밈 콘텐츠 활성화"
 RULE_HLS_ENABLE_MEME_CONTENT_YES_DESC: "바티칸의 밈 콘텐츠를 활성화하여 칼리파국이나 제국주의 노선으로 갈 수 있게 합니다."
 RULE_HLS_ENABLE_MEME_CONTENT_NO_DESC: "바티칸의 밈 콘텐츠를 비활성화합니다."
 HLS_AI_BEHAVIOR: "@HLS 교황청"
 RULE_OPTION_HLS_HISTORICAL: "역사적"
 RULE_OPTION_HLS_HISTORICAL_DESC: "교황청은 현상을 유지합니다. 도시를 현대화하고 §8쿠리아§!와 바티칸 은행을 개혁하며, 방어는 §8스위스 근위대§!에 의존합니다. 바티칸 시국 트리 게임 규칙이 활성화된 경우에만 적용됩니다."
 RULE_OPTION_HLS_CRUSADER: "십자군 교황"
 RULE_OPTION_HLS_CRUSADER_DESC: "교황이 세속 권력을 장악해 이탈리아를 속국으로 삼고 §8교황령§!을 복원합니다. 이어 살라피 세계와 로마의 옛 속주들을 상대로 십자군을 일으킵니다. 바티칸 시국 트리 게임 규칙이 활성화된 경우에만 적용됩니다.\n\n§Y참고: 밈 콘텐츠 활성화 게임 규칙이 켜져 있어야 합니다.§!"
 RULE_OPTION_HLS_CALIPHATE: "바티칸 칼리파국"
 RULE_OPTION_HLS_CALIPHATE_DESC: "교황이 이슬람으로 개종하고 §8바티칸 칼리파국§!을 선포합니다. 그는 전 세계 살라피 정부들에 구애하며 이스라엘과 미국에 지하드를 선언합니다. 바티칸 시국 트리 게임 규칙이 활성화된 경우에만 적용됩니다.\n\n§Y참고: 밈 콘텐츠 활성화 게임 규칙이 켜져 있어야 합니다.§!"