 raid_type_raid_baath: "Búsqueda de Objetivos Ba'ath"
 USA_foreign_policy: "Departamento de Estado"
 USA_foreign_policy_desc: "The [USA.GetFlag] United States Department Of State was founded in 1789 as an administrative arm of the Executive Branch. Being considered one of the strongest agencies within the government, the Department Of State is headed by the Secretary Of State. Reporting back directly to only the President of the [USA.GetFlag] United States, the Department Of State is in charge of foreign affairs.\n\nWith every election, a series of new decisions will be unlocked for that candidate. Previous decisions will disappear with new elections, and certain changes in the world may prompt new decisions to appear."
 USA_doing_decision: "¿Está tomando otra decisión?"
 USA_KUW_baathists: "Búsqueda de baazistas iraquíes en Kuwait [KUW.GetFlag]"
 department_of_state.94.t: "Los talibanes Renuevan la Ofensiva"
 department_of_state.94.d: "The Taliban have announced today that they will be renewing their offensive against the government of [AFG.GetLeader]. This move comes as no surprise following a hasty U.S. withdrawal due to domestic pressure mounting on the current administration. What remains is a fractured, battered, and weakened Afghanistan left alone to defend itself against a much more ferocious foe. Several states have vowed to help defend Afghanistan once more if needed, but their word is as good as their willingness to commit to such a promise. It is still to be seen if the Afghan state is able to hold the Taliban back on its own, but it is likely that the army will not be able to put up much resistance."
 department_of_state.94.a: "¿Se derrumbará una vez más el Estado afgano?"
 department_of_state.200.t: "Informe de Bajas desde Afganistán"
 department_of_state.200.d: "Hemos perdido hombres y mujeres valientes en los combates en Afganistán, y sus ataúdes están regresando a Estados Unidos para un entierro apropiado."
 department_of_state.200.a: "Semper Fi"
 department_of_state.31.c: "¿Qué sentido tiene hacer algo de todos modos?"
 department_of_state.95.t: "Venta de los Destructores Clase Kidd"
 department_of_state.95.d: "Recientemente, [USA.GetName] nos ha ofrecido vender los destructores clase Kidd, desactivados hace algunos años. Se trata de una serie de potentes destructores de misiles guiados, originalmente encargados por la Armada Imperial Iraní, pero cancelados debido a la Revolución Iraní de 1979. Desde entonces, se han modernizado y reactivado a partir de las reservas desactivadas de la Armada de los Estados Unidos con el fin de venderlos. ¿Compramos los barcos para fortalecer nuestra posición en caso de que China continental invada nuestra nación?"
 department_of_state.95.a: "Firma el Cheque"
 department_of_state.95.b: "Nosotros pasaremos"
 USA_sale_of_the_kidd_destroyer: "[TAI.GetFlag] Venta del Destructor clase Kidd a [TAI.GetName]"
 USA_sale_of_the_kidd_destroyer_desc: "Hemos estado luchando para vender los Destructores clase Kidd, pero [TAI.GetNameWithFlag] ha mostrado interés en comprar las naves para ayudar en sus estrategias defensivas contra [CHI.GetNameWithFlag]."
 department_of_state.96.t: "Operación Resolución Absoluta: Exitosa"
 department_of_state.96.d: "As the president watched from the situation room, special forces units stormed the compound of Venezuela's dictator, Nicolas Maduro. Swiftly catching him as he made an attempt to escape into a safe room, U.S. troops transported him onboard a plane and sent him on a flight to U.S. soil. It is expected that he will be tried in U.S. courts and given a sentence based on drug charges. It is said that the entire raid lasted just a matter of hours."
 department_of_state.96.a: "Así es como se hace una operación de 3 horas."
 department_of_state.97.t: "Estados Unidos Lanza una Redada"
 department_of_state.97.d: "Estados Unidos ha cometido un flagrante acto de guerra; ha sometido a nuestra nación a una campaña de bombardeos y ha secuestrado a nuestro presidente. Tal acción no debe quedar impune, y nuestras fuerzas armadas están cada vez más preparadas para resistir cualquier intento de ocupación. Sin embargo, Estados Unidos ha ofrecido no tomar ninguna medida si cooperamos, pero si lo hacemos, significaría permitirles controlar temporalmente la nación."
 department_of_state.97.a: "¡No nos quedaremos de brazos cruzados!"
 department_of_state.97.b: "No tenemos elección, nuestras manos están obligadas."
 department_of_state.98.t: "Estados Unidos Captura al Líder Venezolano"
 department_of_state.98.d: "The United States has carried out an overnight raid on Venezuela, an oil rich country in South America. This move comes after weeks of accusations by the U.S. president, claiming that the Venezuelan leader has been a destabilizing factor in the region by facilitating the spread of narcotics. The raid code-named 'Operation Absolute Resolve' was successful, and it resulted in the capture of Nicolas Maduro, the long standing dictator of Venezuela. Though the United States hasn't really outlined how they intend to facilitate the transition of power, they've made it very clear that they are the ones in charge now and are calling on what remains of the Venezuelan government to collaborate until a replacement is found."
 department_of_state.98.a: "Un desarrollo preocupante"
 raid_type_USA_raid_venezuela: "Operación Resolución Absoluta"
 raid_type_USA_raid_venezuela_desc: "El objetivo de esta operación es capturar al líder venezolano y traerlo sano y salvo a Estados Unidos para su juicio. La comunidad de inteligencia ha advertido que, si la situación se complica, podría surgir una insurgencia como resultado de un vacío de poder."
 USA_invasion_in_iraq_mission: "Invasión de Irak"
 USA_invasion_in_iraq_mission_desc: "Cuanto más esperemos, menos justificado estará invadir Irak. Si queremos llevar a cabo la invasión, tendremos que hacerlo dentro del próximo año; de lo contrario, nuestra justificación para la guerra ya no será válida."
 USA_failed_to_invade_iraq_idea: "La Humillación Nacional"
 USA_failed_to_invade_iraq_idea_desc: "Nuestra incapacidad para lanzar operaciones militares contra Irak, independientemente de las razones subyacentes, deja los ataques terroristas sin respuesta. Esta inacción dañará gravemente nuestra credibilidad y envalentonará a nuestros adversarios durante años."
 USA_early_2000s_energy_crisis: "La Crisis Energética"
 USA_early_2000s_energy_crisis_desc: "Disruptions in the global oil market and the instability in the Middle East has caused an uptick in consumption as people are looking for the best possible price and gas which has inversely led to an increase in consumption of oil and oil-based products causing additional shortages and issues."
 usa_economic_events.36.t: "Las Repercusiones de la Gran Recesión"
 usa_economic_events.36.d: "The American media and economy is reporting more and more startling numbers by the minute. The collapse continues to shake the very core and foundations of the world economy causing rippling effects everywhere from Argentina to Greece to New Zealand. No one around the globe has been left unaffected by this Lesser Depression. Time will tell truly how far this will harm..."
 usa_economic_events.36.a: "¡Inyectar liquidez!"
 usa_economic_events.36.b: "El Mercado Libre Siendo Libre..."
 usa_economic_events.37.t: "Crisis de la Industria Automotriz Estadounidense"
 usa_economic_events.37.d: "La industria de la automoción, que ya arrastraba dificultades por la caída de las ventas y la acumulación de deudas, se enfrenta ahora a un colapso catastrófico a medida que se profundiza la crisis crediticia. Los Tres Grandes fabricantes de automóviles (General Motors, Ford y Chrysler) están perdiendo miles de millones de dólares y advierten que, sin una intervención gubernamental inmediata, podrían verse obligados a declararse en bancarrota en cuestión de meses. Miles de empleos penden de un hilo, no solo en Detroit sino a lo largo de toda la cadena de suministro que abarca la nación entera. La pregunta ahora es si Washington rescatará a una industria que muchos ven como un símbolo del poder de la manufactura estadounidense, o si dejará que las fuerzas del mercado determinen su destino..."
 usa_economic_events.37.a: "¿Puede esto empeorar?"
 usa_economic_events.38.t: "La Crisis Energética de los 2000"
 usa_economic_events.38.d: "Los precios del petróleo se han disparado hasta alcanzar niveles sin precedentes, impulsados por la creciente demanda global, la inestabilidad geopolítica en Oriente Medio y la especulación en los mercados de materias primas. Los consumidores estadounidenses están sintiendo el dolor en las gasolineras a medida que los precios del combustible suben sin tregua, asfixiando los presupuestos familiares que ya estaban castigados por la recesión. La crisis energética se está extendiendo a toda la economía: los costes de transporte se están disparando, las aerolíneas pasan por graves dificultades y las empresas que dependen del combustible ven cómo se evaporan sus márgenes de beneficio. Mientras tanto, los llamamientos a la independencia energética y a las fuentes de combustible alternativas se hacen más fuertes a medida que los estadounidenses se dan cuenta de su vulnerabilidad ante la volatilidad de los mercados petroleros. La pregunta es si se trata de un pico temporal o del comienzo de una nueva era de energía costosa..."
 usa_economic_events.38.a: "Well, the price of gas will certainly be over $2.00!"
 usa_economic_events_news.7.t: "La Crisis Energética de los 2000"
 usa_economic_events_news.7.d: "Oil prices have reached record highs across global markets. Energy analysts predict that fuel costs will remain elevated for the foreseeable future as demand continues to outpace supply. It will truly be interesting to see whether or not the world will just have to pay more for these high oil prices or will the world look for alternatives in this ever changing world."
 usa_economic_events_news.7.a: "Otro día...Otra crisis económica..."
 usa_economic_events.37.b: "A ver si podemos tirar dinero al problema..."
