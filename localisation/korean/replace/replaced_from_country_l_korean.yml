l_korean:
 ARMY_EXPERIENCE_DESC: "장비를 전투에 투입하면 육군 경험치를 얻습니다. 즉, §H여단§!이 전투에 참여하거나 동맹국의 전쟁에 장비를 §H무기 대여§!해 준 경우에도 육군 경험치를 얻을 수 있습니다.\n또한 $UNIT_TRAINING_LEVEL|Y$ 수준 이상의 병력으로 §H육군 훈련§!을 실시하거나 일부 §H국가 중점§!을 통해서도 경험치를 얻습니다. 일부 §H장관§!은 얻는 경험치를 늘려 줍니다.\n\n육군 경험치는 §H여단 템플릿§!을 만들고 수정하거나 §H교리§!를 해금하는 데 필요합니다."