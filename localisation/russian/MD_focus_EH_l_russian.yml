l_russian:
 event_horizon_generic_focus: "Дерево фокусов человечества"
 chimera_focus: "Дерево фокусов Химеры"
 EH_set_up_electric_trap: "Установить электроловушку"
 EH_remove_electric_trap: "Убрать электроловушку"
 EH_activate_electric_trap: "Активировать электроловушку"
 EH_drone_mission_category: "Миссия дронов"
 EH_drone_mission_category_desc: "\n£EH_gui_drone_picture\n\n\n\nДроны — наши лучшие и самые безопасные средства разведки. Благодаря им мы можем собирать информацию о противнике, не рискуя жизнями наших солдат. Мы можем использовать их для разведки ближайшего портала и того, что противник строит вокруг него, что, возможно, позволит нам получить тактическое преимущество во время сражения за один из этих объектов."
 EH_research_sites_category: "Исследовательские площадки"
 EH_research_sites_category_desc: "Исследовательские площадки — наш лучший способ собрать больше информации о Химере и их технологиях. Такие аванпосты привлекут лучших учёных, а также обеспечат бонусы к исследованиям для наших специальных проектов. Остаётся только надеяться, что силы Химеры не заметят их слишком быстро."
 EH_setup_research_site: "Создать исследовательскую площадку"
 EH_install_anti_air_weapons: "Установить зенитное вооружение"
 EH_panic_shelters_and_land_turrets: "Построить укрытия и наземные турели"
 EH_hire_additional_security_for_scientists: "Нанять дополнительную охрану для учёных"
 EH_disable_site_notifications: "Отключить уведомления о нападениях на исследовательские площадки"
 EH_enable_site_notifications: "Включить уведомления о нападениях на исследовательские площадки"
 EH_doudna_or_charpentier_project_mission: "Специальный проект §YДженнифер Даудны§! и §YЭммануэль Шарпантье§!"
 EH_doudna_or_charpentier_project_mission_desc: "§YДженнифер Даудна§! и §YЭммануэль Шарпантье§! работают над специальным проектом, который может помочь нам лучше понять генетическую структуру Химеры. Их опыт в области технологии редактирования генов CRISPR может дать бесценную информацию об уязвимых местах этих существ, что позволит нам разработать более эффективные стратегии борьбы с ними."
 EH_find_new_veins_category: "Найти новые жилы рэндаллита"
 EH_find_new_veins_category_desc: "Рэндаллит — редкий и ценный ресурс, который можно найти в отдельных жилах по всему миру. Он необходим для наших исследований и разработок новых технологий борьбы с Химерой. Инвестируя в разведку и добычу, мы можем увеличить наши шансы на обнаружение новых жил рэндаллита и обеспечить стабильное снабжение этим важнейшим ресурсом.\n\nКаждая шахта по добыче рэндаллита будет давать небольшое количество рэндаллита каждую неделю. Нам необходимо найти и обезопасить как можно больше месторождений, прежде чем крупные корпорации возьмут на себя добычу этого ресурса и заставят нас принимать неприятные решения."
 EH_search_for_randallite_veins: "Поиск жил рэндаллита"
 EH_set_up_mine_mission: "Создание новой шахты"
 EH_large_company_seeks_for_randallite_mission: "Крупная корпорация ищет рэндаллит"
 EH_outlaw_randallite_extraction: "Запретить добычу рэндаллита негосударственным организациям"
 EH_legalize_randallite_extraction: "Разрешить добычу рэндаллита негосударственным организациям"
 EH_construct_southern_zenobia_defense_line: "Построить линию обороны §GЮжная Зенобия§!"
 EH_construct_western_zenobia_defense_line: "Построить линию обороны §GЗападная Зенобия§!"
 EH_construct_inner_saladin_defense_line: "Построить линию обороны §GВнутренний Саладин§!"
 EH_construct_outer_saladin_defense_line: "Построить линию обороны §GВнешний Саладин§!"
 EH_southern_zenobia_defense_line_destruction: "Линия обороны «Южная Зенобия» рушится"
 EH_western_zenobia_defense_line_destruction: "Линия обороны «Западная Зенобия» рушится"
 EH_inner_saladin_defense_line_destruction: "Линия обороны «Внутренний Саладин» рушится"
 EH_outer_saladin_defense_line_destruction: "Линия обороны «Внешний Саладин» рушится"
 EH_nile_defense_line_category: "Линии обороны Зенобии и Саладина"
 EH_nile_defense_line_category_desc: "Линии обороны Нила — наш лучший шанс удержать оборону против сил Химеры в Африке. Линия Зенобии станет нашей первой линией обороны, а линия Саладина — нашей последней надеждой, если линия Зенобии падёт. Мы должны убедиться, что обе линии хорошо укреплёны и укомплектованы, поскольку они будут ключом к нашему выживанию в этой войне."
 EH_bosporus_defense_line_category: "Линия обороны Босфора"
 EH_bosporus_defense_line_category_desc: "Босфорская линия обороны — наш лучший шанс удержать оборону против сил Химеры в Европе. Линия будет укреплёна тяжёлой артиллерией и средствами ПВО, а также сетью окопов и бункеров. Там будут дислоцированы армии большинства европейских стран. Мы должны убедиться, что линия обороны выдержит."
 EH_construct_bosphorus_defense_line: "Построить линию обороны §GБосфор§!"
 EH_bosphorus_defense_line_destruction: "Линия обороны Босфора рушится"
 EH_caucasus_defense_line_category: "Кавказская линия обороны"
 EH_caucasus_defense_line_category_desc: "Противник стремительно продвигается по Ближнему Востоку, угрожая нашим южным границам. Кавказская линия обороны — наш лучший шанс удержать оборону против сил Химеры в этом регионе. Укрепление будет представлять собой двухслойную систему обороны: первая линия будет состоять из окопов и бункеров, а вторая — укреплёна тяжёлой артиллерией и средствами ПВО. Мы должны убедиться, что линия обороны выдержит, и надеяться, что мы сможем сдержать Химеру в Тибете, если только наша линия обороны не рухнет с тыла."
 EH_construct_caucasus_defense_line: "Построить линию обороны §GКавказ§!"
 EH_caucasus_defense_line_destruction_1: "Первая линия обороны Кавказа рушится"
 EH_caucasus_defense_line_destruction_2: "Вторая линия обороны Кавказа рушится"
 EH_event.0.t: "Добро пожаловать в «Горизонт событий»!"
 EH_event.0.d: "«Горизонт событий» — наш первый масштабный специальный сценарий, созданный в честь миллиона подписчиков в Steam Workshop. Это военный сценарий, в котором человечество борется за выживание против неизвестных инопланетных захватчиков. Сценарий включает в себя уникальное дерево фокусов, новые события, решения, механики, юниты и ресурсы, которые погрузят вас в эту эпическую битву за выживание. Приготовьтесь к встрече с неизвестностью и приведите человечество к победе. Спасибо за вашу поддержку!"
 EH_event.0.a: "Ураааа!!! Стоп, ИНОПЛАНЕТЯНЕ?!!!"
 EH_event.1.t: "Строятся линии Зенобии и Саладина"
 EH_event.1.d: "В ответ на растущую угрозу со стороны стран Африки к югу от Сахары, Ближневосточный альянс санкционировал быстрое строительство укреплённой линии обороны вдоль южного Нила и западной пустыни Египта. Эта линия, получившая название «Линия Зенобии», будет служить опорой для позиций тяжёлой артиллерии и окопной системы на ключевых направлениях наступления.\n\nЕсли линия Зенобии падёт, за ней непоколебимо встанет линия Саладина. Простираясь по всей зоне канала от Порт-Саида до Красного моря, это укреплёние будет выполнять роль последнего рубежа обороны.\n"
 EH_event.1.a: "Пусть пустыня станет нашим щитом"
 EH_event.300.t: "ЦЕРН заглянул за грань"
 EH_event.300.d: "Исследователи из Европейской организации ядерных исследований (ЦЕРН) успешно провели контролируемое высокоэнергетическое столкновение, в результате которого временно образовалась так называемая «локализованная межпространственная аномалия».\n\nХотя разрыв был измерен на субатомном уровне и длился всего доли наносекунды, это первый зарегистрированный случай энергетических сигнатур, не соответствующих известным физическим законам. Первоначальные протоколы удержания сработали, и переноса материала не наблюдалось, но последствия уже вызывают шок в мировом научном сообществе.\n\nГраница между теорией и реальностью только что размылась."
 EH_event.300.a: "Это правда безопасно?"
 EH_event.301.t: "Конвой ООН пропал в Центральной Африке"
 EH_event.301.d: "Гуманитарный конвой Организации Объединённых Наций, действовавший в приграничном районе между Руандой и Демократической Республикой Конго, перестал выходить на связь. Спутниковые снимки показывают обломки и перевёрнутые автомобили, разбросанные вдоль лесной дороги, но сигналов бедствия получено не было.\n\nВыживших и тел не обнаружено. Ни одна из повстанческих группировок не взяла на себя ответственность за инцидент. Причина инцидента официально остаётся неизвестной."
 EH_event.301.a: "Очередное нападение на миротворцев ООН..."
 EH_event.302.t: "Необычная сейсмическая активность в Таримской котловине"
 EH_event.302.d: "В Таримской котловине на западе Китая зафиксирована серия неглубоких высокочастотных сейсмических толчков. Эти сейсмические паттерны не соответствуют естественным тектоническим движениям или известной подземной активности. Китайские власти пока не сделали официального заявления, но данные региональной сейсмологии, незаметно переданные в рамках программы университетского обмена, вызвали недоумение у геофизиков."
 EH_event.302.a: "Показания не имеют смысла"
 EH_event.303.t: "Радиомолчание в Памире"
 EH_event.303.d: "Высокогорный пункт прослушивания НОАК вблизи китайско-таджикской границы прекратил всякую связь. Официальных сообщений из Пекина не поступало, но казахстанский радиолюбитель сообщил, что услышал короткую экстренную передачу на китайском языке, после чего наступила полная тишина. На разведывательных спутниках видны следы повреждений."
 EH_event.303.a: "Это было нападение таджиков?"
 EH_event.304.t: "Пропавшие без вести рейнджеры на севере Аляски"
 EH_event.304.d: "Двое рейнджеров национального парка Денали, патрулировавших отдалённый участок, были объявлены пропавшими без вести после того, как не отчитались в течение 72 часов. На место была отправлена поисковая группа, которая обнаружила их заброшенный лагерь со следами борьбы.\n\nХотя сначала об этом сообщали только местные газеты, история получила национальный и международный резонанс, когда поисковая группа также бесследно исчезла. ФБР начало расследование, и ведётся розыск."
 EH_event.304.a: "Убийца на свободе?"
 EH_event.305.t: "Странная вспышка заболевания в высокогорье Перу"
 EH_event.305.d: "В отдалённой деревне в высокогорных районах Анд на юге Перу региональные органы здравоохранения ввели карантин после загадочной вспышки заболевания. Первоначальные сообщения описывают лихорадку, галлюцинации и острую сенсорную дезориентацию у местных жителей. Симптомы появились быстро после сообщения о «вспышке света» и подземном толчке, ощущавшемся только в узкой долине недалеко от деревни.\n\nПеруанские власти утверждают, что это единичный случай грибковой инфекции, но работающие поблизости НПО заявляют, что медицинские бригады сопровождались военнослужащими. Среди пропавших без вести числится геолог из Национального университета Сан-Маркоса, входящий в исследовательскую группу, изучающую близлежащие пещеры."
 EH_event.305.a: "Держите нас в курсе"
 EH_event.306.t: "Беспорядки в Синьцзяне: нападение на военную базу"
 EH_event.306.d: "Вблизи Кашгара, в западном Синьцзяне, произошёл инцидент с применением насилия. Китайские государственные СМИ хранят молчание, но разведывательные данные указывают на то, что база № 36, объект НОАК недалеко от Ечэна, была захвачена неустановленными враждебными элементами в течение ночи. Передаваемые по радио описания мало что говорят о реальной природе нападавших.\n\nНародно-освободительная армия начала экстренное развёртывание механизированных подразделений и групп химического реагирования в регионе. Транспортные самолёты были замечены приземляющимися в аэропорту Кашгара в ранние часы.\n\nЧто бывает редко, российский отряд быстрого реагирования также пересёк границу Китая через перевал Кульма."
 EH_event.306.a: "По данным Пекина, ситуация находится под контролем"
 EH_event.307.t: "Тактический ядерный взрыв в Западном Китае"
 EH_event.307.d: "Вблизи пустыни Такла-Макан, примерно в 120 километрах к востоку от Кашгара, был зафиксирован тактический ядерный взрыв. Взрыв произошёл через пять дней после развёртывания подразделений НОАК для сдерживания неизвестной угрозы в регионе.\n\nИ Пекин, и Москва отрицают применение ядерного оружия, но сейсмические данные подтверждают детонацию малой мощности, соответствующую российской тактической боеголовке. Спутниковые снимки показывают выжженную местность, обрушившиеся геологические пласты и быстро расширяющийся тёмный шар.\n\nМеждународные наблюдатели требуют ответов, но официальные каналы хранят молчание. В военных кругах растёт предположение, что удар был односторонним решением российского полевого командования в рамках доктрины экстренного применения силы."
 EH_event.307.a: "Что там происходит?!"
 EH_event.308.t: "Завеса разорвана"
 EH_event.308.d: "Спутниковые снимки, просочившиеся от неназванного источника в разведке, разлетелись по всему миру: огромный фиолетовый пульсирующий шар нависает над обгоревшими остатками места удара, и из него выползает рой существ. Учёные не могут объяснить эти изображения. Кадры ясно показывают, что ядерный удар не уничтожил его, а если и повлиял, то лишь заставил расти. В течение нескольких часов возникли три новых портала такого же размера и действия:\n- на северо-западе Аляски\n- в высокогорье Кении, недалеко от горы Элгон\n- на юге Чили, недалеко от мыса Горн.\n\nУже поступают сообщения о том, что эти существа крайне агрессивны. Эпоха нормальности закончилась."
 EH_event.308.a: "Истину больше нельзя отрицать"
 EH_event.309.t: "ООН созывает чрезвычайную ассамблею"
 EH_event.309.d: "На фоне нарастающей паники и ослабления доверия к национальным правительствам Организация Объединённых Наций перешла в режим чрезвычайной ситуации. Генеральная Ассамблея задействовала редко применяемые полномочия в кризисных ситуациях, а Совет Безопасности ведет срочные дебаты по скоординированным стратегиям реагирования.\n\nПредложения варьируются от глобального военного сотрудничества до совместных научных рабочих групп. Напряженность между постоянными членами растет, поскольку распространяются взаимные обвинения и сталкиваются интересы.\n\nНо если судить по первым отчетам о взаимодействии, одна истина уже ясна: человечество должно объединиться, иначе ему грозит вымирание."
 EH_event.309.a: "Начинает формироваться глобальный ответ"
 EH_event.310.t: "Объединённое командование"
 EH_event.310.d: "Завершилась работа чрезвычайной ассамблеи ООН, в результате которой было создано Объединённое командование ООН (ОКООН). Это международный орган, призванный координировать военную стратегию, разведку и материально-техническое обеспечение в борьбе с быстро расширяющейся внепространственной угрозой. Хотя командование носит преимущественно консультативный характер, ему предоставлена беспрецедентная оперативная свобода действий.\n\nПараллельно региональные блоки, такие как Европейский союз, начали выдвигать предложения о полном политическом и военном объединении, ссылаясь на необходимость бесперебойной мобилизации и общего суверенитета перед лицом угрозы вымирания. То, что когда-то казалось немыслимым, теперь открыто обсуждается в парламентах по всему континенту."
 EH_event.310.a: "Один враг. Одна война."
 EH_event.401.t: "Соединённые Штаты Северной Америки"
 EH_event.401.d: "Наше правительство готово призвать к объединению нашего континента. Пришло время объединиться и вместе противостоять угрозе. Только объединившись, мы сможем выжить."
 EH_event.401.a: "Сделаем это!"
 EH_event.402.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.402.d: "В историческом обращении к нации [FROM.GetName] призвал к объединению североамериканских военных и политических структур с соседними государствами для формирования единого фронта против угрозы Химеры. Ссылаясь на экзистенциальную опасность, исходящую от быстро распространяющихся порталов и их чудовищных обитателей, правительство подчеркнуло, что выживание может быть обеспечено только благодаря единству.\n\nПредложение включает в себя общие структуры командования, объединённые ресурсы, интегрированные системы обороны и единую территорию."
 EH_event.402.a: "Пришло время"
 EH_event.403.t: "Республика Центральная Америка"
 EH_event.403.d: "Следуя примеру Северной Америки, настало время нашей стране объединиться с соседями. Наши страны не так сильны, как страны Южной или Северной Америки, но вместе мы можем добиться огромных результатов."
 EH_event.403.a: "Ради выживания нашего народа"
 EH_event.404.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.404.d: "Страна [FROM.GetName] выступила с неожиданным предложением объединить страны Центральной Америки в единое государство для лучшей координации обороны против угрозы Химеры.\n\nХотя некоторые лидеры выражают обеспокоенность по поводу суверенитета, срочность ситуации привела к серьёзному рассмотрению этого предложения."
 EH_event.404.a: "Мы должны это сделать, несмотря ни на что"
 EH_event.405.t: "Союз южноамериканских наций"
 EH_event.405.d: "В настоящее время мы являемся единственной необъединённой частью Америки. Наши страны сильны, но недостаточно сильны, чтобы в одиночку противостоять угрозе Химеры. Пришло время объединиться и вместе противостоять этой угрозе."
 EH_event.405.a: "Разошлите приглашения"
 EH_event.406.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.406.a: "Ради будущего нашего континента"
 EH_event.407.t: "Европейская Федерация"
 EH_event.407.d: "Наш континент никогда не был так един, как сегодня. Европейский союз и НАТО за эти годы установили прочные связи, но теперь пришло время вывести их на новый уровень. Мы должны объединиться как единая нация, чтобы вместе противостоять угрозе Химеры."
 EH_event.407.a: "Встретимся в Брюсселе"
 EH_event.408.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.408.d: "Сегодня, [GetDateText], [FROM.GetAdjectiveCap] правительство официально предложило объединить европейские страны в единое федеративное образование для лучшей координации обороны против угрозы Химеры. Вслед за Америкой было очевидно, что одна из стран выдвинет аналогичное предложение и для нашего континента.\n\nХотя это может противоречить демократическим ценностям независимости государств, срочность ситуации размыла большинство идеологических взглядов."
 EH_event.408.a: "Едины прежде, едины и теперь"
 EH_event.409.t: "Африканский оборонительный пункт"
 EH_event.409.d: "Наш континент в последнее время пережил множество войн, но надежда ещё есть. Африканские страны должны объединиться и вместе противостоять угрозе Химеры. Они должны понять, что это единственный выход."
 EH_event.409.a: "Ради выживания Африки"
 EH_event.410.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.410.d: "Несмотря ни на что, правительство [FROM.GetName] предложило объединить африканские страны для противостояния угрозе Химеры. В то время как некоторые страны всё ещё восстанавливаются после недавних конфликтов, срочность ситуации важнее наших внутренних проблем."
 EH_event.410.a: "Это лучшее, что мы можем сделать"
 EH_event.411.t: "Восточный континентальный союз"
 EH_event.411.d: "Мы должны последовать примеру других континентов. Наши страны сильны, но недостаточно сильны, чтобы в одиночку противостоять угрозе Химеры. Нам нужно отбросить разногласия и объединиться."
 EH_event.411.a: "Разошлите приглашения"
 EH_event.412.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.412.d: "Наши страны в последнее время пережили множество жестоких конфликтов. [FROM.GetName] предлагает отложить в сторону наши разногласия и объединиться, чтобы вместе противостоять угрозе Химеры. Это был непростой разговор, но Химера представляет для всех нас угрозу, гораздо более серьёзную, чем наши местные проблемы."
 EH_event.412.a: "А пока давайте держаться вместе"
 EH_event.413.t: "Евразийская Федерация"
 EH_event.413.d: "Наша великая фракция должна оставаться единой. Угроза Химеры приближается к нашим границам. Наши страны сильны, но недостаточно сильны, чтобы противостоять угрозе Химеры в одиночку. Пришло время объединиться и вместе противостоять этой угрозе."
 EH_event.413.a: "Встретимся в Москве"
 EH_event.414.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.414.d: "Времена тяжёлые. Правительство [FROM.GetName] предложило объединить евразийские страны в единое федеративное образование для лучшей координации обороны против угрозы Химеры. Под защитой российской армии и экономики мы сможем отбросить силы Химеры с этой планеты."
 EH_event.414.a: "Да здравствует ОДКБ!"
 EH_event.415.t: "Три вершины"
 EH_event.415.d: "Наша великая страна должна остаться нетронутой, поэтому настало время объединить наших коммунистических союзников. Вместе мы сможем противостоять угрозе Химеры и выстоять."
 EH_event.415.a: "Пекин будет играть ведущую роль"
 EH_event.416.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.416.d: "Китай не готов к созданию ещё одной огромной федерации, подобной другим континентам, но наши страны всегда были близки друг к другу. Правительство [FROM.GetName] предложило объединить наши страны под одним флагом, чтобы вместе противостоять угрозе Химеры."
 EH_event.416.a: "Последний оплот коммунистов"
 EH_event.417.t: "Коалиция АСЕАН"
 EH_event.417.d: "В последнее время нас окружают мегагосударства. А ситуацию усугубляет находящийся неподалёку портал Химеры в Китае. Пришло время нам объединиться и вместе противостоять этой угрозе."
 EH_event.417.a: "Мы уже слишком долго ждём"
 EH_event.418.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.418.d: "Правительство [FROM.GetName] предложило объединить страны Юго-Восточной Азии в единое государство для лучшей координации обороны против угрозы Химеры. Учитывая недавние объединения на других континентах, было лишь вопросом времени, когда одна из наших стран выдвинет аналогичное предложение."
 EH_event.418.a: "Наш единственный вариант"
 EH_event.419.t: "Восточноазиатская коалиция"
 EH_event.419.d: "Угроза приближается к нашим границам. Не только со стороны сил Химеры из Китая, но и со стороны самого Китая и его новых союзников. Давайте покажем им, что мы не будем бездействовать в этой войне."
 EH_event.419.a: "Ради безопасности наших островов"
 EH_event.420.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.420.d: "Правительство [FROM.GetName] предложило объединить страны Восточной Азии в единое образование для лучшей координации обороны как против угрозы Химеры, так и против растущего влияния Китая."
 EH_event.420.a: "Готовьтесь к худшему"
 EH_event.421.t: "Океанийский союз обороны"
 EH_event.421.d: "Остальной мир уже объединился. Мы думали, что эта война не доберется до наших островов, но это лишь вопрос времени. Наши страны жили в мире, теперь настало время объединиться и защитить наши дома."
 EH_event.421.a: "Ради выживания Океании"
 EH_event.422.t: "[FROM.GetAdjectiveCap] правительство призывает к объединению"
 EH_event.422.d: "Правительство [FROM.GetName] предложило объединить страны Океании. Хотя наши страны находятся далеко от основных зон конфликтов, недавние объединения на других континентах заставили нас осознать, что мы должны быть готовы ко всему."
 EH_event.422.a: "Пусть будет так"
 EH_event.423.t: "Образование Соединённых Штатов Северной Америки"
 EH_event.423.d: "Быстрая реакция американского правительства на угрозу со стороны Химеры завершилась официальным созданием Соединённых Штатов Северной Америки (СШСА). После нескольких недель напряжённых переговоров страны континента договорились о роспуске своих национальных правительств и объединении в единое федеративное образование.\n\nТеперь СШСА располагают едиными вооружёнными силами, централизованной логистикой и единым правительством военного времени."
 EH_event.423.a: "Начинается новая эра"
 EH_event.424.t: "Объединение Республики Центральная Америка"
 EH_event.424.d: "Лидеры стран Центральной Америки договорились распустить свои национальные правительства и объединиться в единое образование: Республику Центральная Америка (РЦА). Не совсем ясно, было ли объединение вызвано только угрозой Химеры или ещё и угрозой со стороны самих Соединённых Штатов Северной Америки (СШСА). Однако одно несомненно: ещё одна группа стран готова противостоять апокалиптической угрозе."
 EH_event.424.a: "Кто бы мог подумать?"
 EH_event.425.t: "Союз южноамериканских наций сформирован"
 EH_event.425.d: "Последняя часть Америки наконец-то объединилась. После нескольких недель переговоров южноамериканские страны договорились объединиться под единым флагом: Союзом южноамериканских наций (УНАСУР).\n\nТеперь вся Америка готова вместе противостоять угрозе."
 EH_event.425.a: "Луч надежды"
 EH_event.426.t: "Рождение Европейской федерации"
 EH_event.426.d: "После нескольких месяцев политических споров, экстренных заседаний и растущих жертв Европейский союз проголосовал за роспуск своей наднациональной структуры и преобразование в единое федеративное мегагосударство: Европейскую федерацию.\n\nДаже исторически нейтральные страны, такие как Швейцария и Финляндия, после длительных внутренних дебатов и референдумов решили присоединиться, ссылаясь на экзистенциальную угрозу, исходящую от Химеры. С консолидацией национальных армий и стёртыми границами Европейская федерация теперь имеет единую командную структуру, объединённые ресурсы и единое правительство военного времени.\n\nКритики предупреждают о поспешной интеграции и потере независимости, но сторонники утверждают, что выживание будет обеспечено только при полной интеграции."
 EH_event.426.a: "Выживание не знает границ"
 EH_event.427.t: "Формирование Африканского оборонительного пункта"
 EH_event.427.d: "Сделав исторический шаг, африканские страны объединились и создали Африканский оборонительный пункт (АОП).\n\nНесмотря на затянувшиеся региональные конфликты и экономическое неравенство, лидеры пришли к соглашению, что только единство позволит им защитить свой народ и территории. Африка готова внести значительный вклад в глобальную борьбу с угрозой Химеры."
 EH_event.427.a: "Африка едина"
 EH_event.428.t: "Восточный континентальный союз создан"
 EH_event.428.d: "В неожиданном повороте событий страны Центральной Азии и Северной Африки договорились распустить свои национальные правительства и сформировать Восточный континентальный союз (ВКС).\n\nЭтот шаг предпринят на фоне эскалации вторжений Химеры и осознания того, что разрозненные ответные меры привели лишь к большим потерям.\n\nХотя некоторые конфликты ещё далеки от разрешения, неотложность угрозы со стороны Химеры подтолкнула лидеров к тому, чтобы поставить выживание выше суверенитета."
 EH_event.428.a: "Сохранится ли этот союз?"
 EH_event.429.t: "Официально сформирована Евразийская Федерация"
 EH_event.429.d: "Московская встреча завершилась, и теперь мир стал свидетелем рождения Евразийской Федерации (ЕАФ). Многие страны гадают, было ли объединение навязано Россией, но правда в том, что все страны согласились на объединение, чтобы вместе противостоять угрозе Химеры.\n\nТакже ходят слухи, что Россия может использовать эту ситуацию для восстановления Советского Союза или вновь стать угрозой для Европы."
 EH_event.429.a: "Остаётся слишком много вопросов..."
 EH_event.430.t: "Три вершины объединились"
 EH_event.430.d: "Северная Корея, Монголия и Китай официально объединились под одним флагом: «Три вершины». Хотя объединение подверглось критике со стороны китайского правительства, прочные отношения с союзниками и угроза со стороны Химеры заставили их изменить своё мнение.\n\nНовое государство теперь готово вместе противостоять этой угрозе."
 EH_event.430.a: "Ну, справедливо, наверное..."
 EH_event.431.t: "Коалиция АСЕАН сформирована"
 EH_event.431.d: "Ещё одна часть Азии объединилась. Недавние объединения стран Ближнего Востока и «Трёх вершин» подтолкнули страны Юго-Восточной Азии следовать тем же путём."
 EH_event.431.a: "Мир никогда не был так един, как сейчас"
 EH_event.432.t: "Создана Восточноазиатская коалиция"
 EH_event.432.d: "Последние азиатские страны объединились. После нескольких недель переговоров страны Восточной Азии договорились распустить свои национальные правительства и объединиться в единое образование: Восточноазиатскую коалицию (ВАК).\n\nВ условиях растущего влияния Китая и расположенного неподалёку портала Химеры новое государство готовится не только к противостоянию угрозе Химеры, но и к возможной агрессии со стороны самого Китая."
 EH_event.432.a: "Лучше вместе, чем порознь"
 EH_event.433.t: "Создан Союз обороны Океании"
 EH_event.433.d: "Страны Океании объединились, чтобы сформировать Союз обороны Океании (СОО). Несмотря на географическую изоляцию и экономическое неравенство, лидеры пришли к соглашению, что только благодаря единству они смогут защитить свой народ и территории.\n\nСОО теперь готов внести значительный вклад в глобальную борьбу с угрозой Химеры.\n\nС объединением Океании мир теперь полностью разделён на несколько мегагосударств. Организация Объединённых Наций остаётся последней международной организацией, делающей всё возможное для поддержки глобальных военных усилий."
 EH_event.433.a: "Дивный новый мир"
 EH_event.434.t: "Энергия порталов нарушает глобальную связь"
 EH_event.434.d: "В течение нескольких недель после появления порталов Химеры глобальные сети связи пережили беспрецедентные сбои. Спутниковая связь периодически обрывается, подводные кабели демонстрируют нестабильную потерю данных, а наземные сети страдают от необъяснимых помех.\n\nЭксперты полагают, что порталы излучают уникальную форму электромагнитного излучения, которое мешает работе традиционных коммуникационных технологий. Ведутся работы по разработке новых протоколов и оборудования, способных работать в этой враждебной среде, но пока поток информации остаётся серьёзно нарушенным."
 EH_event.434.a: "Исправьте это как можно скорее!"
 EH_event.500.t: "Открытие рэндаллита"
 EH_event.500.d: "С тех пор как первые порталы ворвались на Землю, по всему миру были обнаружены фрагменты неопознанного металлического вещества. Большинство предполагало, что это пространственное преобразование существующих металлов, странное, но инертное явление.\n\nСегодня ситуация изменилась. Доктор Лиза Рэндалл, физик-теоретик и один из ведущих мировых специалистов в области физики высших измерений, расшифровала структуру и свойства этого материала, обнаружив, что это стабильный, лёгкий и очень прочный металл с огромным потенциалом для военного применения.\n\nВещество, получившее название «рэндаллит», идеально подходит для создания сложных сплавов, сочетая в себе прочность, термостойкость и гибкость. При надлежащей обработке оно может стать основой для нового поколения боевых машин, которые помогут нам победить."
 EH_event.500.a: "Наконец-то хорошие новости!"
 EH_event.501.t: "Представлен прототип каркаса HACS"
 EH_event.501.d: "После нескольких месяцев ускоренной разработки команда [FROM.GetAdjective] успешно создала первый прототип боевой системы высокой маневренности (HACS).\n\nРазработанная с использованием усиленного рэндаллитом двуногого шасси и оснащенная встроенными ускорителями, платформа HACS была создана для преодоления разрыва между огневой мощью и живучестью. Там, где танки слишком медленны, а самолёты слишком уязвимы для Химеры, HACS обеспечивает необходимую мобильность без ущерба для тяжёлой боевой нагрузки.\n\nХотя этот прорыв всё ещё находится на стадии испытаний, он знаменует собой важный шаг на пути к созданию передовых подразделений следующего поколения. Специальная исследовательская программа по доведению HACS до боевой готовности получила зелёный свет."
 EH_event.501.a: "Новая эра войны"
 EH_event.511.t: "Операция «Кувалда»"
 EH_event.511.d: "После нескольких месяцев тяжёлых потерь в Восточной Европе и краха балканской оборонительной системы Европейская Федерация начала операцию «Кувалда» — рискованное военное наступление с целью вернуть контроль над Босфорской линией и вновь открыть стратегический коридор между Европой и Ближним Востоком. Возглавляемая недавно развёрнутыми подразделениями HACS и поддерживаемая скоординированными артиллерийскими, военно-морскими и ракетными ударами, операция направлена на вытеснение окопавшихся роев Химеры из руин Стамбула и окружающих его холмов.\n\nУспех операции станет важным поворотным моментом в восстановлении континентальной мобильности и обеспечении безопасности южного фланга Европы. Но присутствие роя усилилось, и разведывательные данные указывают на появление в регионе новых, ранее не наблюдавшихся вариантов. Предстоящая битва будет дорогостоящей."
 EH_event.511.a: "Жребий брошен"
 EH_event.800.t: "Строятся линии Зенобии и Саладина"
 EH_event.800.d: "В ответ на стремительное наступление роя из стран Африки к югу от Сахары Лига обороны Ближнего Востока отдала приказ о немедленном строительстве укреплённого барьера на юге Египта. Эта линия, получившая название «Линия Зенобии», тянется вдоль Нила и западного пустынного фланга, объединяя укреплённые бункеры, сети окопов и позиции дальнобойной артиллерии, чтобы остановить наступление Химеры.\n\nЕсли Зенобия падёт, за ней будет ждать «Линия Саладина». Проложенная вдоль Суэцкого канала от Порт-Саида до Красного моря, она станет последним редутом, нерушимой линией, призванной защитить культурное и духовное сердце региона от уничтожения."
 EH_event.800.a: "Линия проведена"
 EH_event.801.t: "Крах линий Зенобии и Саладина"
 EH_event.801.d: "Поступают сообщения о том, что рой Химеры прорвал как линию Зенобии на юге Египта, так и линию Саладина вдоль Суэцкого канала. Несмотря на жестокие оборонительные действия и мощную артиллерийскую поддержку, противник оказался слишком многочисленным и неумолимым.\n\nЦелые оборонительные участки были захвачены, укреплёния потеряны, окопы уничтожены, и многие подразделения сражались до последнего. С тех пор штаб в Суэце замолчал. Ближневосточная оборонительная лига отдала приказ о полном отступлении в сторону Леванта.\n\nПрорыв главной линии обороны открывает путь на северный фронт. Буферной зоны больше нет."
 EH_event.801.a: "Они держались столько, сколько могли"
 EH_event.802.t: "Удар по линиям Зенобии и Саладина с тыла!"
 EH_event.802.d: "Из-за обрушения ближневосточных оборонительных линий силы Химеры прорвали линии Зенобии и Саладина с единственной уязвимой стороны — тыла. Рой хлынул через пролом, быстро подавив оставшихся защитников и закрепившись в самом сердце континента.\n\nПосле прорыва линий обороны Химеры получили полную свободу действий для продвижения на север, угрожая ключевым городам и инфраструктуре по всей Европе. Ситуация критическая, и Европейскому союзу теперь предстоит подготовиться к затяжной и жестокой борьбе на первом фронте на своих границах."
 EH_event.802.a: "Восточный фронт был слишком слаб"
 EH_event.803.t: "Укрепление Европы: линия Босфора"
 EH_event.803.d: "Западная коалиция санкционировала создание нового континентального редута: Босфорской линии.\n\nПротянувшаяся через проливы у Стамбула, эта оборонительная линия включает в себя минные поля, морские блокады, подготовленные позиции и усиленные огневые рубежи, чтобы предотвратить прорыв в Европу. В её центре дислоцируется оперативное соединение «Геллеспонт», многонациональное подразделение, готовое сражаться до конца.\n\nПриказ ясен: держать линию обороны любой ценой."
 EH_event.803.a: "Они не пройдут без боя"
 EH_event.804.t: "Падение Босфорской линии"
 EH_event.804.d: "После жестокой и продолжительной осады линия Босфора прорвана. Химеры обрушились на Стамбул потоком огня и плоти, сокрушая оборону, несмотря на отчаянные контрнаступления.\n\nОперативное соединение «Геллеспонт» сражалось до последнего, и его бойцов оплакивают как героев Европы.\n\nТеперь Европа непосредственно уязвима. Западный мир потерял свой первый щит."
 EH_event.804.a: "Защитников Европы будут оплакивать"
 EH_event.805.t: "Удар по линии Босфора с тыла!"
 EH_event.805.d: "Силам Химеры удалось обойти Чёрное море с севера и атаковать Босфорскую линию с тыла, полностью обойдя укреплёния и подавив оставшихся защитников. Рой уже доминирует на Балканах и в Западной Европе."
 EH_event.805.a: "Европа уже пала"
 EH_event.806.t: "Строительство Кавказской линии обороны"
 EH_event.806.d: "Кавказская линия обороны строится для защиты связи между Ближним Востоком и южной частью Евразийской Федерации. Линия протянется через Кавказские горы, сочетая естественные преимущества рельефа с укреплёнными позициями, огневыми точками артиллерии и подразделениями быстрого реагирования, чтобы создать грозный барьер против наступающих сил Химеры.\n\nХотя этого может быть недостаточно, чтобы полностью остановить натиск, она послужит важным буфером, позволяющим выиграть время для эвакуации и перегруппировки в Европе и на территории бывшей России."
 EH_event.806.a: "Надеюсь, они успеют вовремя"
 EH_event.807.t: "Первая линия обороны Кавказа прорвана"
 EH_event.807.d: "Силы Химеры прорвали первую линию обороны Кавказа, сокрушив первоначальные укреплёния и продвинувшись в горный регион. Несмотря на ожесточённое сопротивление защитников, неустанное наступление роя создало плацдарм в этом районе, угрожая распространиться на центральные районы Евразийской Федерации.\n\nСитуация критическая, но всё ещё есть надежда, что вторая линия обороны сможет удержать позиции и предотвратить дальнейшие вторжения."
 EH_event.807.a: "Ещё есть надежда на вторую линию"
 EH_event.808.t: "Оборона Кавказа пала"
 EH_event.808.d: "Несмотря на героические усилия, линия обороны Кавказа пала. Силы Химеры сокрушили оставшихся защитников и закрепились в регионе, открыв новый фронт для Евразийской Федерации.\n\nС потерей этого важнейшего буфера у роя теперь есть прямой путь к ключевым городам и инфраструктуре России и Западной Европы. Ситуация критическая, и Евразийская Федерация должна готовиться к затяжной и жестокой борьбе на своей территории."
 EH_event.808.a: "Их невозможно остановить..."
 EH_event.809.t: "Линия обороны Кавказа атакована с тыла!"
 EH_event.809.d: "Силам Химеры удалось обойти Кавказские горы с севера и атаковать линию обороны с тыла, полностью обойдя укреплёния и подавив оставшихся защитников. Рой уже доминирует в окрестных районах."
 EH_event.809.a: "На этот риск нужно было пойти"
 EH_event.900.t: "Падение Вашингтона"
 EH_event.900.d: "Столица бывших Соединённых Штатов Америки пала.\n\nСилы Химеры начали разрушительное наступление, прорвав оборону города и подавив воинские части. Знаковые достопримечательности теперь лежат в руинах, а некогда оживлённые улицы зловеще затихли.\n\nВыжившие рассказывают ужасающие истории о хаосе и разрушениях, когда город пал в руки роя."
 EH_event.900.a: "Сердце нации утрачено..."
 EH_event.901.t: "Падение Нью-Йорка"
 EH_event.901.d: "Нью-Йорк захвачен роем Химеры.\n\nЭти существа использовали подземные туннели и системы метро, чтобы обойти наземную оборону, заставая военные подразделения врасплох. Знаменитые очертания небоскрёбов превратились в картину разрушения: бушуют пожары, рушатся здания.\n\nСтатен-Айленд пал первым, и теперь весь город находится под контролем Химеры."
 EH_event.901.a: "Статуя Свободы исчезла..."
 EH_event.902.t: "Падение Лос-Анджелеса"
 EH_event.902.d: "Лос-Анджелес пал.\n\nКогда-то прекрасный город, теперь лишь воспоминание для бесчисленных беженцев, спасающихся от неумолимого наступления Химеры. Знаменитая надпись «Голливуд» теперь служит мрачным напоминанием о том, что было потеряно."
 EH_event.902.a: "Такая потеря..."
 EH_event.903.t: "Падение Сан-Франциско"
 EH_event.903.d: "Сан-Франциско уничтожен\n\nХимеры появились из подземных трещин и береговых проломов, с ужасающей скоростью обходя оборонительные линии. Тихоокеанское командование сообщает, что все оставшиеся силы уничтожены или отрезаны. Потери среди гражданского населения катастрофичны.\n\nЕщё один великий город потерян для роя."
 EH_event.903.a: "Золотые Ворота утрачены..."
 EH_event.904.t: "Падение Москвы"
 EH_event.904.d: "Москва пала.\n\nРой Химеры начал скоординированное наступление, сокрушив оборону города численным превосходством и свирепостью. Кремль, некогда символ российской стойкости, теперь лежит в руинах.\n\nВыжившие рассказывают о хаосе и отчаянии, когда город пал под натиском неумолимого продвижения этих существ."
 EH_event.904.a: "Сердце России потеряно..."
 EH_event.905.t: "Падение Шанхая"
 EH_event.905.d: "Шанхай пал.\n\nРой обрушился с подавляющей силой, сначала через южные пригороды, затем через реку Хуанпу, застав защитников врасплох на этапе отступления. Набережная Бунд превратилась в кладбище обгоревшей стали и разбитого бетона. Спутниковые снимки показывают лишь тишину, пустую оболочку города."
 EH_event.905.a: "Когда мы их остановим?"
 EH_event.1000.t: "Портал Химеры закрыт!"
 EH_event.1000.d: "Проект T.E.S.L.A. оказался невероятно успешным. [FROM.GetName] успешно совершил рейд по закрытию одного из порталов Химеры, в результате чего все силы Химеры в огромном периметре мгновенно потеряли сознание. Существа всё ещё живы, поэтому местному населению рекомендовано избегать любого контакта с телами. Национальная армия направляется, чтобы уничтожить подразделения Химеры во сне."
 EH_event.1000.a: "Эти сукины дети сделали это!"
 EH_focus_event.1.t: "План масштабной мобилизации"
 EH_focus_event.1.d: "Они появились внезапно. Они атакуют всё, что движется, и не остановятся, пока всё не будет уничтожено. Наши учёные пытаются выяснить, что это за существа, откуда они взялись и как их остановить. Тем временем наши военные пытаются удержать линию фронта и защитить наших граждан. Мы должны действовать быстро, прежде чем они достигнут наших границ. Мы можем полагаться на нашу профессиональную армию, или же можем объявить о масштабной мобилизации."
 EH_focus_event.1.a: "Бросьте на них всё, что у нас есть!"
 EH_focus_event.1.b: "Мы будем полагаться на профессиональную армию."
 EH_focus_event.2.t: "Первое поколение хитиновых солдат"
 EH_focus_event.2.d: "Недавние исследования войск Химеры позволили создать новый вид солдат — хитиновых солдат. Новая броня сделает наш народ более устойчивым к физическим атакам инопланетян, а их футуристический дизайн вселяет надежду и энтузиазм в население."
 EH_focus_event.2.a: "Когда вымысел встречается с реальностью."
 EH_focus_event.3.t: "Дроны достигли своей цели"
 EH_focus_event.3.d: "Дроны сделали подробные снимки структуры вокруг портала. Чтобы лучше понять его назначение и функциональность, помимо оборонных целей, учёным придётся проанализировать собранные данные. К счастью, есть профессор биологии, который захочет внимательнее изучить фотографии."
 EH_focus_event.3.a: "Будем надеяться, что это того стоило."
 EH_focus_event.4.t: "Химера уничтожила эскадрилью дронов"
 EH_focus_event.4.d: "Силы Химеры успешно перехватили и уничтожили эскадрилью дронов до того, как она смогла завершить свою миссию. Ни одному аппарату не удалось сделать снимок и отправить его до того, как он был сбит."
 EH_focus_event.4.a: "Очередная неудача..."
 EH_focus_event.5.t: "Силы Химеры уничтожили исследовательскую площадку"
 EH_focus_event.5.d: "Силы Химеры обнаружили и уничтожили одну из наших исследовательских площадок. Часть исследовательских данных была утеряна, но, по крайней мере, Химера не ушла без потерь."
 EH_focus_event.5.a: "Ищите выживших!"
 EH_focus_event.6.t: "Химера отброшена от исследовательской площадки"
 EH_focus_event.6.d: "Химера не смогла уничтожить нашу исследовательскую площадку. Данные исследований не были потеряны, и учёные в безопасности."
 EH_focus_event.6.a: "Великая победа!"
 EH_focus_event.7.t: "Учёный пропал без вести"
 EH_focus_event.7.d: "Одному из учёных не удалось покинуть исследовательскую площадку до того, как его атаковали силы Химеры. Мы не знаем, жив этот учёный или мёртв, но нам приходится исходить из худшего, поскольку в настоящее время нет возможности начать спасательную операцию."
 EH_focus_event.7.a: "Чёрт возьми!"
 EH_focus_event.8.t: "Выбросы энергии портала ослабляют силы Химеры"
 EH_focus_event.8.d: "Благодаря более тщательному мониторингу необычных энергетических излучений от портала, нарушающих работу нашей спутниковой сети, наши учёные обнаружили, что эти излучения следуют очень специфическим закономерностям. Новые спутники были оснащены специальными датчиками, способными обнаруживать эти излучения и использовать их для создания помех системам связи Химеры. Этот прорыв может значительно ослабить силы Химеры."
 EH_focus_event.8.a: "Это огромный прорыв!"
 EH_focus_event.9.t: "Частные корпорации направляют рабочих на исследовательские площадки"
 EH_focus_event.9.d: "Крупнейшие частные корпорации объединились, чтобы помочь нашим учёным в их исследованиях против Химеры. Они направляют своих лучших сотрудников для строительства новых исследовательских площадок, что значительно ускоряет весь процесс."
 EH_focus_event.9.a: "Отличные новости!"
 EH_focus_event.10.t: "Генералы предлагают дополнительную охрану для исследовательских площадок"
 EH_focus_event.10.d: "Наши военачальники предложили направить дополнительные войска для защиты наших исследовательских площадок от атак Химеры. Их боевой опыт и знание тактики Химеры будут неоценимы для обеспечения безопасности наших учёных и успеха наших проектов."
 EH_focus_event.10.a: "Мы ценим их поддержку!"
 EH_focus_event.11.t: "Миллиардер жертвует состояние на исследования"
 EH_focus_event.11.d: "Богатый миллиардер решил пожертвовать значительную часть своего состояния на финансирование наших исследовательских площадок. Эти огромные средства покроют расходы на строительство новых объектов и значительно ускорит темпы исследований."
 EH_focus_event.11.a: "Снизьте ему налоги!"
 EH_focus_event.12.t: "Обнаружена жила рэндаллита"
 EH_focus_event.12.d: "Поисковая группа обнаружила новую жилу рэндаллита. Теперь нам предстоит принять решение о начале добычи и извлечении этого ценного ресурса."
 EH_focus_event.12.a: "Начать добычу!"
 EH_focus_event.12.b: "Мы не можем себе этого позволить."
 EH_focus_event.13.t: "Обнаружена железная жила"
 EH_focus_event.13.d: "Поисковая группа обнаружила новую жилу железной руды. Теперь нам предстоит принять решение о начале добычи, извлечении руды и увеличении производства стали."
 EH_focus_event.13.a: "Я ожидал большего, но нам это всё равно нужно."
 EH_focus_event.13.b: "Мы не можем себе этого позволить."
 EH_focus_event.14.t: "Обнаружена алюминиевая жила"
 EH_focus_event.14.d: "Поисковая группа обнаружила новую жилу алюминия. Теперь нам предстоит принять решение о начале добычи и извлечении этого ресурса."
 EH_focus_event.14.a: "Рэндаллита нет? Всё равно неплохая сделка."
 EH_focus_event.14.b: "Мы не можем себе этого позволить."
 EH_focus_event.15.t: "Негосударственная компания обнаружила жилу рэндаллита"
 EH_focus_event.15.d: "Одна из крупных частных корпораций обнаружила новую жилу рэндаллита. Они готовы начать добычу самостоятельно, без какой-либо помощи со стороны правительства."
 EH_focus_event.15.a: "Э-э... пусть делают."
 EH_focus_event.16.t: "[FROM.GetName] начинает финальное наступление"
 EH_focus_event.16.d: "После успешного подрыва T.E.S.L.A. у портала Химеры военные [FROM.GetName] начали полномасштабное наступление с целью уничтожения всех сил Химеры в этом районе. Портал закрыт, а противник дезориентирован, и это наш шанс нанести решающий удар и вернуть утраченную территорию."
 EH_focus_event.16.a: "Мы победим."
 EH_protect_the_homeland: "Защитить Родину!"
 EH_protect_the_homeland_desc: "На нас напали неведомые силы самого дьявола. Мы должны защищаться всеми силами, чтобы отразить угрозу и выстоять!"
 EH_territorial_advantages: "Территориальные преимущества"
 EH_territorial_advantages_desc: "Захватчики сильнее в ближнем бою... да и вообще в бою. Поэтому, если мы не можем победить их силой, нам нужно действовать умнее. Новая оборонительная программа поможет нам использовать ландшафт в своих интересах, и, возможно, этого будет достаточно, чтобы выиграть несколько сражений."
 EH_cold_acclimatization: "Акклиматизация к холоду"
 EH_cold_acclimatization_desc: "Захватчики чрезвычайно устойчивы к низким температурам. Дополнительная проблема заключается в том, что два портала расположены на Аляске и в Тибете. Если мы хотим иметь шанс приблизиться к ним, нам нужно стать сильнее или разработать новые способы борьбы с холодом."
 EH_300: "300"
 EH_300_desc: "Узкие горные перевалы — невероятно сложная местность для преодоления. Идеальное место для засады, как по мне. Если мы сможем справиться с их поддержкой с воздуха, мы сможем использовать эти перевалы, чтобы получить невероятное преимущество в боях."
 EH_heat_acclimatization: "Акклиматизация к жаре"
 EH_heat_acclimatization_desc: "Монстры очень устойчивы к силам природы. Нам тоже нужно стать сильнее. Мы сражались на этой планете дольше, чем эти существа, и этот опыт следует использовать сейчас в своих интересах."
 EH_sandstorms_are_our_allies: "Песчаные бури — наши союзники"
 EH_sandstorms_are_our_allies_desc: "Мы знаем, когда приближаются песчаные бури. Обладая этими знаниями, мы можем подготовить оборону и использовать песок в своих интересах. Остаётся только надеяться, что у чудовищ нет никаких «биологических радаров»."
 EH_observe_local_fauna: "Наблюдение за местной фауной"
 EH_observe_local_fauna_desc: "Животные представляют собой идеальную систему раннего обнаружения. Эти монстры представляют угрозу для всех видов, и наши животные, похоже, уже осознают их присутствие. Большие группы животных, спасающихся бегством в панике, могут стать важным сигналом, когда наши радары замолкают."
 EH_our_weakness_to_their_disadvantage: "Наша слабость — их беда"
 EH_our_weakness_to_their_disadvantage_desc: "Равнины чрезвычайно полезны для нашей техники, но танков и БМП недостаточно, чтобы остановить этих монстров. Но благодаря ровной местности мы сможем подготовить нечто особенное, что, будем надеяться, даст нам временное преимущество на поле боя."
 EH_electric_traps: "Электроловушки"
 EH_electric_traps_desc: "С помощью контролируемых мощных электрических разрядов мы сможем дать нашим подразделениям несколько минут форы для атаки вражеских войск. Потребление энергии будет огромным, поэтому нам придётся найти способ сократить потребление электроэнергии в стране или подготовить новые строительные площадки."
 EH_transfer_energy_from_civilian_sector: "Передача энергии из гражданского сектора"
 EH_transfer_energy_from_civilian_sector_desc: "Когда ловушки активны, мы потребляем слишком много энергии. Их зарядка занимает слишком много времени, и мы не можем ждать целую неделю, чтобы снова их использовать. Мы переведем часть энергии из общественного сектора в наши накопители энергии."
 EH_invest_in_additional_power_sources: "Инвестиции в дополнительные источники энергии"
 EH_invest_in_additional_power_sources_desc: "Война не должна затрагивать мирное население ещё сильнее, чем это уже происходит. Мы создадим новый проект реактора для обеспечения энергетической безопасности сегодня и в любой другой день."
 EH_reduce_energy_loss: "Снижение потерь энергии"
 EH_reduce_energy_loss_desc: "Эти ловушки потребляют слишком много энергии. Они эффективны, но дорого обходятся нашей инфраструктуре. Мы не можем уменьшить их энергопотребление, но можем найти способы ограничить потребление энергии из других источников."
 EH_nation_remains_untouched: "Страна остаётся нетронутой"
 EH_nation_remains_untouched_desc: "Что бы это ни были за существа, мы не можем просто бросить всё на укреплёние армии. Люди будут продолжать жить своей обычной жизнью, как будто ничего плохого не происходит..."
 EH_put_away_internal_problems: "Отложить внутренние проблемы"
 EH_put_away_internal_problems_desc: "В настоящее время важнейшей задачей является защита родины. Без армии не будет страны, которую нужно защищать. Людям придётся решать свои проблемы самостоятельно, пока мы укрепляем армию. Если армия потерпит неудачу, то и общество тоже."
 EH_minimal_military_focus: "Минимальный упор на армию"
 EH_minimal_military_focus_desc: "В настоящее время гражданская промышленность важнее производства нового оружия. Если война будет далеко от нас, нет смысла тратить слишком много денег на оборону."
 EH_high_military_focus: "Высокий упор на армию"
 EH_high_military_focus_desc: "Враг с каждым днем приближается к нашей столице. Мы не можем терять бдительность и должны ускорить производство."
 EH_lower_conscription: "Сокращённый призыв"
 EH_lower_conscription_desc: "Другие страны теряют много личного состава, но наши солдаты в основном патрулируют наши границы. Нам не нужно набирать больше солдат только для того, чтобы тратить больше денег на армию."
 EH_extended_conscription: "Расширенный призыв"
 EH_extended_conscription_desc: "Не допустить врага за наши границы — важнейшая задача, мы не можем терять больше земли!"
 EH_prioritize_corporations: "Приоритет корпорациям"
 EH_prioritize_corporations_desc: "Война разрушит нашу экономику. Мы должны сохранить лояльность наших корпораций к государству, чтобы избежать серьёзных проблем."
 EH_prioritize_military_companies: "Приоритет военным компаниям"
 EH_prioritize_military_companies_desc: "Исследования и наращивание производства оружия должны стать нашим главным приоритетом. Без оружия наши солдаты не смогут сражаться с этими нечестивыми созданиями."
 EH_a_new_resource: "Новый ресурс"
 EH_a_new_resource_desc: "Доктор Лиза Рэндалл уже довольно давно изучает новый ресурс — рэндаллит. Вместе со своей командой учёных доктор Рэндалл обнаружила его необычайную прочность при невероятно малом весе. После открытия рэндаллита другие страны заметили снижение количества [RESOURCE HERE]. Возможно, порталы преобразуют его в рэндаллит. Может быть, это и есть тот самый распространённый ресурс по ту сторону портала? Нам нужно провести дополнительные исследования по этому вопросу."
 EH_a_fine_addition_to_my_collection: "Прекрасное дополнение к моей коллекции"
 EH_a_fine_addition_to_my_collection_desc: "Рэндаллит станет отличным компонентом для оружия и брони. Вооружившись рэндаллитом, мы сможем отражать атаки не только инопланетных существ, но и других стран."
 EH_first_hacs_prototype: "Первый прототип HACS"
 EH_first_hacs_prototype_desc: "«Егеря», «Атлас», «Евангелион» и так далее. Передовые боевые мехи оставались лишь фантастикой, пока недавние события не изменили всё. Высокоманевренная боевая система (HACS) — это настоящий боевой мех, созданный исключительно благодаря свойствам рэндаллита. Вес перестал быть большой проблемой, поскольку мы начали использовать сплав, намного прочнее стали и легче магния. С помощью этой технологии мы, наконец, сможем наносить значительный урон вражеским силам."
 EH_new_enemy_new_strategy: "Новый враг, новая стратегия"
 EH_new_enemy_new_strategy_desc: "Глупые проблемы требуют глупых решений, и это самая глупая проблема, с которой мы когда-либо сталкивались. Инопланетяне сражаются так, будто не боятся опасности, и именно этим мы воспользуемся. Броня тяжёлых юнитов очень хорошо защищает, но не является непроницаемой. Мы должны победить в этом бою, будучи быстрее, чем бронированные юниты, и сильнее, чем летающие существа. При этом нам нужно больше рэндаллита и, конечно же, пуль."
 EH_more_mechs_less_weapons: "Больше мехов, меньше оружия"
 EH_more_mechs_less_weapons_desc: "Мехи — наше единственное эффективное оружие против этих существ. Их производство занимает много времени, а запасы рэндаллита ограничены. Лучше будет переоборудовать некоторые заводы для производства деталей для мехов, а не для обычного оружия."
 EH_more_weapons_less_mechs: "Больше оружия, меньше мехов"
 EH_more_weapons_less_mechs_desc: "Производство мехов отнимает большую часть наших ресурсов. Если мы продолжим это полномасштабное производство, наша экономика может впасть в депрессию, и мы никогда не оправимся от долгов. Сейчас война, но мы не можем разрушить нашу экономику ради этих новых машин."
 EH_iron_man: "Железный Человек?"
 EH_iron_man_desc: "Первые новые мехи уже сражаются на поле боя. Теперь началась настоящая битва, где у нас, наконец, может появиться шанс против захватчиков. Некоторые начали гадать, как далеко мы сможем зайти с этой технологией. Конечно же, фанаты Marvel начали присылать нам свои чертежи брони Железного Человека… а почему бы и нет?"
 EH_second_generation_hacs: "HACS второго поколения"
 EH_second_generation_hacs_desc: "Благодаря чертежам от энтузиастов и профессиональных инженеров, мы готовы начать планирование новых мехов немного раньше. Давайте достигнем ещё одной важной вехи!"
 EH_highly_purified_randallite: "Высокоочищенный рэндаллит"
 EH_highly_purified_randallite_desc: "Мы никогда не уделяли достаточно времени очистке необработанного рэндаллита, производство было для нас первостепенной задачей. Но поскольку мы больше знаем об этом ресурсе и не так спешим открывать его новые свойства, мы можем уделить время тому, чтобы максимально повысить его эффективность."
 EH_increase_research_budget: "Увеличить бюджет на исследования"
 EH_increase_research_budget_desc: "Второе поколение HACS оказалось очень успешным, но мы не можем почивать на лаврах. Человечество всегда будет требовать чего-то лучшего, и именно сейчас мы начинаем подготовку к третьему поколению."
 EH_third_generation_hacs: "HACS третьего поколения"
 EH_third_generation_hacs_desc: "Вся наша упорная работа привела нас к этому моменту. Месяцы исследований, испытаний и миллиарды из нашего бюджета — и мы готовы выпустить величайшего боевого меха в истории боевых мехов!"
 EH_military_advantages: "Военные преимущества"
 EH_military_advantages_desc: "Нам нужно понять, как рэндаллит может помочь нашим войскам. Пока строятся мехи, у нас руды больше, чем мы можем потратить на новые машины. Мы должны найти больше способов её использования."
 EH_ranjets: "Рэнджеты"
 EH_ranjets_desc: "Рэндаллит позволил нам создать первых в истории боевых мехов. Он настолько лёгкий, что нам не нужно ограничиваться только этой новой технологией. Это решит многие проблемы, связанные с тягой и весом самолётов. Самолёты с более лёгким корпусом смогут нести больше груза и вооружения, а наши реактивные самолёты станут ещё более маневренными, чем когда-либо прежде."
 EH_not_so_heavy_weapons: "Не такое уж и тяжёлое вооружение"
 EH_not_so_heavy_weapons_desc: "В производстве тяжёлого вооружения мы сможем использовать рэндаллит вместо стали, титана и других материалов. Оружие станет легче, и солдатам будет проще его переносить и использовать. Грузовики будут потреблять меньше топлива, так что от этого изменения выиграют все."
 EH_find_new_veins: "Поиск новых жил"
 EH_find_new_veins_desc: "Многие месторождения были замещены рэндаллитом. Мы не знаем, как продвигается этот процесс, но, возможно, сейчас самое время начать раскопки в поисках новых ресурсов. Может быть, мы сможем найти больше рэндаллита под землей."
 EH_more_precious_than_gold: "Драгоценнее золота"
 EH_more_precious_than_gold_desc: "Рэндаллит уже повсюду. Крупные компании тратят миллиарды долларов, чтобы заполучить этот ресурс. Это похоже на старую добрую золотую лихорадку, но рэндаллит гораздо полезнее этого ресурса. Из него можно изготавливать обычные инструменты, машины и оружие, и это лишь очень короткий список. Мы, государство, должны найти как можно больше рэндаллита, прежде чем жадные предприятия установят монополию на его добычу, исследования и экспорт. Трудно поверить, что нам действительно приходится воевать со своей собственной страной, но введение ограничений может стать крайней мерой, если ситуация выйдет из-под контроля."
 EH_civilian_benefits: "Выгоды для гражданских"
 EH_civilian_benefits_desc: "Наша военная обстановка стабильна, поэтому мы можем сосредоточиться на использовании рэндаллита в общественных местах. Если ситуация с захватчиками ухудшится, мы всегда сможем без особых проблем переключиться на военное производство."
 EH_a_wonderful_prosthesis: "Прекрасный протез"
 EH_a_wonderful_prosthesis_desc: "Невероятная прочность и малый вес рэндаллита позволили нам создать новую модель протеза ноги, сделав её пользователей ещё более «здоровыми», чем они были бы со своей старой ногой. Пришло время вывести искусственные части тела на уровень, подобный киберпанку!"
 EH_market_potential: "Рыночный потенциал"
 EH_market_potential_desc: "Многие хотят заполучить рэндаллит. Поскольку мы больше не спешим с военными проектами, мы можем начать продавать рэндаллит инвесторам и для коммерческого использования. Крупные компании начнут заменять свою технику на технику, изготовленную из рэндаллита, что позволит сократить потребление топлива во всем мире для питания тяжёлой техники и транспортных средств."
 EH_study_new_enemy: "Изучить нового врага"
 EH_study_new_enemy_desc: "После ядерного удара по таинственному порталу вокруг него начали распространяться какие-то новые существа. Они крайне агрессивны и нападают на всё, что движется. Мы не знаем, сможем ли мы их остановить, но если есть способ защититься от них, мы должны как можно скорее его найти."
 EH_launch_orbital_scans: "Запуск орбитального сканирования"
 EH_launch_orbital_scans_desc: "Мы можем использовать наши спутники для изучения маневров противника и определения закономерности его передвижения, если таковые имеются. Это должно помочь нашим стратегам подготовить более эффективные ловушки и контрмеры."
 EH_find_the_weak_spots: "Найти слабые места"
 EH_find_the_weak_spots_desc: "Эти существа могут быть убиты. В конце концов, они состоят из крови и органических веществ. Если нам удастся доставить одно из них в нашу лабораторию, мы, возможно, обнаружим их важнейшие органы для изучения в наших интересах. Как только мы найдём эти жизненно важные органы, мы обучим наших солдат и боевые системы, если это возможно, нацеливаться на них."
 EH_disassemble_invader_armor: "Разобрать броню захватчиков"
 EH_disassemble_invader_armor_desc: "Большинство захватчиков устойчивы к нашему оружию благодаря своей твёрдой хитиноподобной броне. Мы можем начать исследования, чтобы изучить её структуру и адаптировать её к человеческой броне. Возможно, это сделает наши войска немного более устойчивыми к атакам противника."
 EH_portals_must_be_the_key: "Ключ — в порталах"
 EH_portals_must_be_the_key_desc: "Нам нужно собрать больше информации о ближайшем портале, всё, что может быть нам полезно. Они устойчивы к ядерному удару, но ничто не является неуязвимым. Мы найдём способ закрыть их, даже если это будет означать, что нам придётся отправить наши дроны и самолёты на самоубийственные миссии."
 EH_investigate_strange_structure: "Исследовать странную структуру"
 EH_investigate_strange_structure_desc: "Мы заметили странное поведение наших врагов. Похоже, они что-то строят вокруг порталов, вероятно, чтобы их обезопасить. Если они возводят какую-то крепость, нам нужно действовать быстро, прежде чем они полностью их отгородят. Наш следующий шаг — подготовка детальной разведывательной миссии с использованием наших боевых дронов. Противник контролирует воздушную зону, поэтому это скорее самоубийственная миссия, но мы должны надеяться, что хотя бы одному аппарату удастся сделать снимки этой конструкции и отправить их нашему командованию."
 EH_finding_their_vulnerability: "Выявление их уязвимости"
 EH_finding_their_vulnerability_desc: "При достаточно частых бомбардировках мы могли бы обнаружить слабые места в компонентах, из которых построена эта конструкция. Наиболее важными параметрами, которые необходимо проверить, являются термостойкость, взрывостойкость и устойчивость к токсичной коррозии. Мы не можем проверить их плотность при замерзании, но можем изучить поведение других материалов, полученных от этих монстров, чтобы увидеть, как они будут реагировать на более низкие температуры."
 EH_but_how_does_this_key_work: "Но как работает этот ключ?"
 EH_but_how_does_this_key_work_desc: "Эти порталы, безусловно, ведут в другое измерение. Будь то Изнанка, Антиземля или что-то ещё, в них должно быть что-то, что позволяет им открывать и поддерживать связь. Выяснение того, как они это делают, может быть важным для понимания их природы, функциональности, и, возможно, с небольшой долей удачи мы найдём способ нарушить их работу и разорвать эту связь."
 EH_project_tesla: "Проект T.E.S.L.A."
 EH_project_tesla_desc: "Тактическая электромагнитная система линейного уничтожения станет нашим лучшим шансом показать монстрам, кто здесь главный. Как только оружие будет готово, мы выстрелим им в ближайший портал. Если наша теория верна, электромагнитный импульс должен быть достаточно сильным, чтобы разорвать соединения и, возможно, закрыть портал — временно или навсегда."
 EH_whole_new_dawn: "Новый рассвет"
 EH_whole_new_dawn_desc: "Мы знаем всё, что нужно знать, чтобы закрыть порталы. Если мы будем придерживаться плана, то будем достаточно сильны, чтобы наконец положить конец этой войне."
