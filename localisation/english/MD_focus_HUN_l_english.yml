l_english:
 hungary_focus: "Hungary Focus Tree"
 # DECISIONS

 # EVENTS
 hungary_historical.1.t: "Fidesz Politician Zoltan Pokorni Attacked With Pillows"
 hungary_historical.1.d: "Today, [?global.date.GetDateStringNoHourLong] Zoltán Pokorni has been attacked during an election forum in Püspökladány with ten young activists, around six o'clock on Friday and tried to break into the upstairs restaurant with a pillow in their hands. With the pillows, they wanted to draw the attention of politicians to get some sleep instead of talking. According to the testimony of the leader of the group, they also organized the previous action, during which a cake was pressed into the face of Mayor Gábor Demszky. A police found a butterfly knife on one of the attackers, who was taken to the police station for questioning. The Fidesz politician was not injured in the attack."
 hungary_historical.1.a: "Nothing more than a few criminals."
 hungary_historical.2.t: "Violent Anti-Government Demonstrators Hijack T-34 Tank"
 hungary_historical.2.d: "On [?global.date.GetDateStringNoHourLong], violent anti-government demonstrators in Budapest hijacked a T-34 tank from the Military History Museum and used it to break through police lines. The demonstrators, who were protesting against the government's policies, managed to seize control of the tank and used it to ram through barricades set up by law enforcement. The incident resulted in several injuries and significant property damage. Authorities are currently investigating how the demonstrators were able to access the tank and are working to restore order in the city."
 hungary_historical.2.a: "They hijacked... what?"
 hungary_historical.3.t: "Major Airline Declared Bankruptcy"
 hungary_historical.3.d: "The main Hungarian airline, Malév, has declared bankruptcy as of [?global.date.GetDateStringNoHourLong]. The airline has been struggling financially for years, facing increasing competition from low-cost carriers and rising operational costs. The government had previously provided financial support to keep the airline afloat, but it was not enough to prevent its collapse. The bankruptcy has led to significant disruptions in air travel, with many flights being canceled or delayed. Passengers are advised to check with their airlines for the latest information on their flights."
 hungary_historical.3.a: "Where are the passengers now?!"
 hungary_historical.4.t: "Wizz Air & Ryanair Saves Hungarian Air Travel"
 hungary_historical.4.d: "Following the bankruptcy of the national airline Malév, low-cost carriers Wizz Air and Ryanair have stepped in to fill the void in Hungarian air travel. Both airlines have announced plans to increase their flight offerings to and from Hungary, providing more options for travelers. Wizz Air has introduced new routes connecting Budapest with several European cities, while Ryanair has expanded its services to include additional destinations. This move is expected to boost tourism and business travel in Hungary, helping to stabilize the country's aviation sector after the loss of its flagship carrier."
 hungary_historical.4.a: "Thankfully they have been prepared."
 hungary_historical.5.t: "The Internet Tax Proposal "
 hungary_historical.5.d: "Our economy experts have brought to the table a new tax, the Internet tax, which will charge a fee per gigabyte of data traffic. Now it is our decision to start working to make the draft a new law."
 hungary_historical.5.a: "We will work on it"
 hungary_historical.5.b: "We don't need the money"
 hungary_historical.6.t: "The Internet Tax draft publication "
 hungary_historical.6.d: "After some works of intensive work, we have a drafted law ready to be sent to the parliament. We will announce the law in the next hours and we will start communicating this change to all the network providers."
 hungary_historical.6.a: "Ladies and gentlemen, the internet tax law "
 hungary_historical.6.b: "Maybe we are overtaxing our citizens"

 hungary_historical.7.t: "The Internet Tax Riots "
 hungary_historical.7.d: "People are in the streets demanding the drop of the proposal, as they claim that this measure will become a way to control what the users are searching on the Internet."
 hungary_historical.7.a: "We worked so hard, we will not drop this law"
 hungary_historical.7.b: "We have gone to far, drop the law"

 hungary_historical.8.t: "The Budapest's New Statue Critics"
 hungary_historical.8.d: "The Budapest's council has build a new statue representing the occupation of the Germans in World War 2. However, social media and the jews' community are criticizing that Hungary had an active role during this period."
 hungary_historical.8.a: "It is not our competence"

 hungary_historical.9.t: "The Migration Crisis"
 hungary_historical.9.d: "Under the unstable state of the Middle East, people from those countries are trying to reach to Europe. We have to decide how we want to handle this situation "
 hungary_historical.9.a: "We need walls everywhere"
 hungary_historical.9.b: "Lets protect the southern part"
 hungary_historical.9.c: "Let them in"

 hungary_karpatalja.1.t: "The Councils of Karpatalja"
 hungary_karpatalja.1.d: "With Kyiv unable to project authority this far from the capital, local assemblies in Zakarpattia have voted to seek union with Hungary. Budapest is only too willing to oblige."
 hungary_karpatalja.1.a: "Welcome them home"
 hungary_karpatalja.2.t: "Governing Karpatalja"
 hungary_karpatalja.2.d: "Karpatalja is Hungarian on the map. Turning that into a functioning administration is another matter, and the government must decide how heavy a hand to use."
 hungary_karpatalja.2.a: "Rule through local councils"
 hungary_karpatalja.2.b: "Direct rule from Budapest"
 hungary_karpatalja.10.t: "Budapest Demands Karpatalja"
 hungary_karpatalja.10.d: "Hungary has delivered an ultimatum: hand over Zakarpattia, or face the consequences. The government must decide how to respond."
 hungary_karpatalja.10.a: "Cede the province"
 hungary_karpatalja.10.b: "Reject the ultimatum"
 hungary_karpatalja.11.t: "Kyiv Refuses"
 hungary_karpatalja.11.d: "Ukraine has rejected our demands over Karpatalja. If we want the province, we will have to take it ourselves."
 hungary_karpatalja.11.a: "Prepare for war"

 hungary_historical.10.t: "The anti-homeless law"
 hungary_historical.10.d: "The Hungarian government is considering a law to ban homeless people to live on the streets. Critics say it's a form of \"social punishment\" and won't address the root causes of homelessness. The government defends it as a short-term measure to address homelessness in Hungary."
 hungary_historical.10.a: "We should pass the new law"
 hungary_historical.10.b: "We should fix the main problem before"
