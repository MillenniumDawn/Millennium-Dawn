 message_from_iran.1.t: "L'Iran nous a envoyé des équipements"
 message_from_iran.1.d: "Aujourd'hui, nous avons reçu une importante livraison confidentielle dans l'une de nos bases, envoyée depuis l'Iran. Cette livraison comprend des équipements militaires pour la guerre terrestre et la guérilla, que nous pouvons utiliser pour nous défendre et affronter nos ennemis."
 message_from_iran.1.o1: "Merci"
 message_from_iran.2.t: "L'Iran nous a envoyé de l'argent"
 message_from_iran.2.d: "Nous avons été contactés depuis l'une de nos bases pour nous informer que des livraisons d'argent en dollars américains ont été envoyées depuis l'Iran dans un grand nombre de valises."
 message_from_iran.2.o1: "Merci"
 message_from_iran.3.t: "L'Iran nous a construit une usine"
 message_from_iran.3.d: "L'Iran a construit une usine souterraine pour nous, que nous pouvons utiliser pour construire d'autres structures sans craindre qu'elle ne soit endommagée."
 message_from_iran.3.o1: "Merci"
