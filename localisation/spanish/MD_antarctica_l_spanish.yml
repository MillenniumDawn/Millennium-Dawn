 ANTARCTICA_CCAS_TITLE: "CCFA"
 ANTARCTICA_CCAS_TEXT: "La Convención para la Conservación de las Focas Antárticas (CCFA) es un acuerdo que regula la caza de focas en la Antártida. Se estableció en 1972 con el fin de proteger las poblaciones de focas y garantizar el uso sostenible de sus recursos."
 ANTARCTICA_CCAMLR_TITLE: "CCRVMA"
 ANTARCTICA_CCAMLR_TEXT: "La Comisión para la Conservación de los Recursos Vivos Marinos Antárticos (CCRVMA) es una organización encargada de la conservación de la vida marina en el Océano Austral. Se creó en 1982 con el fin de gestionar y proteger el ecosistema único de la Antártida."
