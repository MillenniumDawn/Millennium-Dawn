 GER_mio_trait_ffg_leopard_1_family: "레오파르트 1 계열"
 GER_mio_trait_ffg_wiesel_1_ndv: "비젤 1 NDV"
 GER_mio_trait_ffg_composite_rubber_tracks: "복합 고무 궤도"
 GER_mio_trait_ffg_werk_nordstadt: "노르트슈타트 공장"
 GER_mio_trait_ffg_field_service_detachments: "야전 정비 파견대"
 GER_mio_trait_ffg_thirty_year_service_life: "30년 운용 수명"
 GER_mio_trait_ffg_wisent_1: "WiSENT 1"
