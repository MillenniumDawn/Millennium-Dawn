 CZE_petr_pavel_planning_expert_loc_four: "§Y+5%§! §GPlanejamento Máximo§!\n§Y+11%§! §GVelocidade de Planejamento§!\n§Y+2§! §GHabilidade de Planejamento§!"
 CZE_petr_pavel_training_info_text_text: "A §YSeção de Treinamento§! serve para aumentar as habilidades de Petr Pavel no campo de batalha. Cada §YCarta de Treinamento§! tem bônus diferentes que continuam crescendo conforme a experiência adquirida. A experiência da §YCarta de Treinamento§! só aumenta quando ela está ativa ou quando há um foco/missão concluído que concede experiência a esse tipo de habilidade. Quando ativas, as §YCartas de Treinamento§! também aumentam o §YNível de Treinamento§! geral, porém em ritmo mais lento."
 CZE_petr_pavel_training_info_two_text_text: "Petr Pavel implementou o §YSistema de Envelhecimento§!. Isso significa que, todo mês, ele perde pontos de experiência na §YSeção de Treinamento§!. Você pode compensar isso treinando Petr Pavel constantemente e concluindo missões/operações políticas."
