 HOL_add_dutchaid:0 "Estabelecer o Programa de Ajuda Holandês"
 HOL_add_dutchaid_desc:0 "Lance o Programa de Ajuda Holandês para fornecer assistência ao desenvolvimento a nações parceiras. Requer a conclusão do foco do Programa de Ajuda Holandês da WIC e capacidade econômica suficiente."
 HOL_remove_dutchaid:0 "Retirar o Programa de Ajuda Holandês"
 HOL_remove_dutchaid_desc:0 "Encerre gradualmente o Programa de Ajuda Holandês, redirecionando recursos para prioridades domésticas."
 HOL_nonselfsufficient_army_emergency_tt:0 "\n§YRequisitos para encerrar a emergência:§!\n - Mais de 15 $arms_factory$\n - Não ter $HOL_nonselfsufficient_army1$\n - Mais do que a quantidade empregada em estoque de: $infantry_weapons_type$, $util_vehicle_type$, $cnc_equipment_type$, $artillery_equipment$, $medium_tank_amphibious_chassis$, $medium_tank_flame_chassis$, $medium_tank_chassis$"
 HOL_shell:0 "Comprar Ações da Shell"
 HOL_shell_desc:0 "A Royal Dutch Shell, empresa global de energia com sede nos Países Baixos, é uma protagonista do setor energético do país. Com um portfólio diversificado que abrange petróleo, gás, energia renovável e tecnologias de baixo carbono, a Shell está comprometida em impulsionar a transição energética e oferecer soluções sustentáveis que atendam às necessidades em evolução da sociedade."
 HOL_green_shell:0 "Shell Vai Verde"
 HOL_green_shell_desc:0 "O compromisso da Shell com a sustentabilidade e a energia renovável, migrando para fontes mais limpas como eólica, solar e hidrogênio. Por meio de investimentos em tecnologias verdes, soluções inovadoras e iniciativas de baixo carbono, a Shell pretende liderar a transição energética e enfrentar os desafios das mudanças climáticas, contribuindo para um futuro mais sustentável."
 HOL_blauwwind: "Blauwwind"
 HOL_blauwwind_desc:0 "A Blauwwind é um projeto eólico offshore no Mar do Norte holandês, composto por vários parques eólicos desenvolvidos por um consórcio de empresas. Ao aproveitar a energia dos ventos, a Blauwwind pretende apoiar as metas de energia renovável dos Países Baixos, reduzir as emissões de carbono e promover a sustentabilidade ambiental. Por meio de colaboração e inovação, contribui para a expansão da capacidade eólica offshore e para a transição rumo a um futuro de energia limpa."
 HOL_porthos_project:0 "Projeto Porthos"
 HOL_porthos_project_desc:0 "O Projeto Porthos é uma iniciativa de captura e armazenamento de carbono (CCS) voltada a reduzir as emissões de gases de efeito estufa de fontes industriais na área de Roterdã. Ao capturar as emissões de CO2 e armazená-las em campos de gás offshore esgotados, o Porthos contribui para os esforços de mitigação das mudanças climáticas, apoiando a descarbonização industrial e as metas de desenvolvimento sustentável."
 HOL_energy_transition_campus: "Energy Transition Campus Amsterdam"
 HOL_energy_transition_campus_desc:0 "O Energy Transition Campus Amsterdam funciona como um polo de pesquisa, inovação e colaboração no campo da transição energética e da sustentabilidade. Ao reunir indústria, academia, governo e sociedade civil, o campus fomenta soluções interdisciplinares, troca de conhecimento e implantação de tecnologias para acelerar a mudança rumo a um sistema energético de baixo carbono e resiliente."
 HOL_hefa: "HEFA"
 HOL_hefa_desc:0 "Os Ésteres e Ácidos Graxos Hidroprocessados (HEFA) são uma tecnologia de combustível de aviação renovável voltada a reduzir as emissões de carbono do setor aéreo. Ao converter matérias-primas sustentáveis, como óleos vegetais e gorduras animais, em biocombustíveis compatíveis, o HEFA permite que as companhias aéreas reduzam sua pegada de carbono e cumpram metas de redução de emissões, mantendo a lucratividade."
 HOL_holland_hydrogen: "Holland Hydrogen 1"
 HOL_holland_hydrogen_desc:0 "O Holland Hydrogen 1 se concentra em avançar a tecnologia e a infraestrutura de hidrogênio nos Países Baixos como parte da estratégia de transição energética do país. Ao promover a produção, a distribuição e o uso do hidrogênio, busca liberar o potencial desse vetor energético limpo e versátil, apoiando os esforços de descarbonização em setores como transporte, indústria e aquecimento."
 HOL_no_green_shell:0 "Especialidade da Shell"
 HOL_no_green_shell_desc:0 "A Shell continua comprometida com suas operações centrais de exploração, produção e distribuição de fontes de energia não renováveis, como petróleo e gás natural. Com ênfase contínua nos combustíveis fósseis tradicionais, as atividades da Shell abrangem perfuração offshore, refino e fabricação petroquímica. Apesar da atenção crescente às energias renováveis, a Shell mantém seu foco estratégico em atender à demanda global de energia por meio do desenvolvimento e do uso de recursos energéticos convencionais."
 HOL_shell_energy_rotterdam:0 "Parque de Energia e Químicos da Shell"
 HOL_shell_energy_rotterdam_desc:0 "Localizado em Europoort, o Shell Energy and Chemicals Park Rotterdam é um importante polo industrial de produção de energia e petroquímicos nos Países Baixos. Com instalações avançadas e infraestrutura integrada, o parque sustenta operações diversas, incluindo refino de petróleo, fabricação de produtos químicos e geração de energia. Pilar da economia holandesa, contribui para o desenvolvimento regional, a geração de empregos e a inovação nos setores de energia e químicos."
 HOL_europoort_modernization:0 "Modernização de Europoort"
 HOL_europoort_modernization_desc:0 "Europoort, um dos maiores complexos petroquímicos da Europa, passa por esforços contínuos de modernização para aumentar a eficiência, a sustentabilidade e a competitividade. Por meio de investimentos em tecnologia, melhorias de infraestrutura e otimização de processos, Europoort pretende manter sua posição como polo líder das atividades energéticas e industriais, impulsionando o crescimento econômico e o desempenho ambiental na região de Roterdã."
 HOL_shell_moerdijk:0 "Expansão do Shell Chemicals Park Moerdijk"
 HOL_shell_moerdijk_desc:0 "Situado em Moerdijk, o Shell Chemicals Park é um polo estratégico de fabricação e inovação química nos Países Baixos. Com instalações de ponta e foco em sustentabilidade, o parque produz uma ampla gama de produtos petroquímicos, incluindo plásticos, solventes e químicos especiais. Em colaboração com parceiros da indústria e instituições de pesquisa, o Shell Chemicals Park Moerdijk impulsiona avanços tecnológicos e a criação de valor no setor químico."
 HOL_borsele_choice:0 "Escolha da Usina de Borsele"
 HOL_borsele_choice_desc:0 "O futuro do reator nuclear de Borssele está numa encruzilhada. À medida que cresce a demanda por fontes de energia sustentáveis e confiáveis, é preciso decidir entre ampliar a capacidade do reator ou convertê-lo em uma usina de carvão limpo de última geração. Cada caminho oferece benefícios e desafios distintos, moldando o futuro energético dos Países Baixos."
 HOL_syngas_production:0 "Produção de Gás de Síntese"
 HOL_syngas_production_desc:0 "A produção de gás de síntese (syngas) envolve a conversão de várias matérias-primas, como gás natural, carvão ou biomassa, em gás de síntese, um intermediário versátil usado na síntese química e na produção de energia. Com tecnologias avançadas e inovação de processos, as instalações de produção de syngas, como as operadas pela Shell, têm papel crucial no fornecimento de matérias-primas para petroquímicos, fertilizantes e combustíveis, apoiando o desenvolvimento industrial e os objetivos de transição energética."
 HOL_solar_moerdijk: "Solar Moerdijk"
 HOL_solar_moerdijk_desc:0 "O Solar Moerdijk é um projeto de energia solar localizado na área industrial de Moerdijk, nos Países Baixos. Ao instalar painéis solares fotovoltaicos (PV) em telhados industriais e terrenos vagos, o Solar Moerdijk pretende gerar eletricidade renovável, reduzir as emissões de carbono e aumentar a resiliência energética, aproveitando a infraestrutura existente e promovendo práticas sustentáveis de uso do solo."
 HOL_nam:0 "Fundar a Nederlandse Aardolie Maatschappij"
 HOL_nam_desc:0 "A Nederlandse Aardolie Maatschappij (NAM) é uma empresa holandesa de petróleo e gás responsável pela exploração, produção e desenvolvimento de recursos de hidrocarbonetos nos Países Baixos. Com operações em campos terrestres e marítimos, a NAM tem papel fundamental em atender às necessidades energéticas do país, respeitando a segurança, a gestão ambiental e a conformidade regulatória."
 HOL_nam_groningen: "NAM Groningen"
 HOL_nam_groningen_desc:0 "Groningen, no norte dos Países Baixos, abriga um dos maiores campos de gás natural da Europa. Como polo energético essencial, Groningen foi historicamente fundamental no abastecimento de gás a lares e indústrias holandesas. No entanto, preocupações recentes com a sismicidade induzida e o impacto ambiental levaram a uma redução gradual da extração de gás, sinalizando a transição para soluções de energia sustentável."
 HOL_nam_waddenzee: "NAM Waddenzee"
 HOL_nam_waddenzee_desc:0 "O Waddenzee, Patrimônio Mundial da UNESCO, tem potencial para exploração de petróleo e gás no norte dos Países Baixos. Equilibrando a conservação ambiental e o desenvolvimento de recursos, esta iniciativa pretende liberar de forma responsável as reservas de energia da região do Waddenzee. Com planejamento cuidadoso, tecnologias avançadas e salvaguardas ambientais, busca aproveitar os recursos energéticos offshore sem comprometer a integridade ecológica deste ambiente marinho único."
 HOL_nam_drenthe_oil: "NAM Drenthe"
 HOL_nam_drenthe_oil_desc:0 "Drenthe Oil refere-se à extração e ao uso de recursos petrolíferos na província de Drenthe, conhecida por seus campos de petróleo terrestres. Como parte do portfólio de produção de hidrocarbonetos dos Países Baixos, o Drenthe Oil contribui para atender à demanda energética interna e apoiar as economias locais, ao mesmo tempo em que suscita debates sobre sustentabilidade ambiental e estratégias de transição energética."
 HOL_nam_rotterdam:0 "NAM Roterdã"
 HOL_nam_rotterdam_desc:0 "Roterdã, o maior porto marítimo e polo industrial da Europa, tem papel vital no cenário energético dos Países Baixos. Como grande centro de transporte e logística, Roterdã é a porta de entrada para importações de petróleo bruto, exportações de produtos refinados e fabricação petroquímica. Sua localização estratégica, vasta infraestrutura e iniciativas inovadoras a posicionam como protagonista da transição energética global."
 HOL_nam_pernis_refineries:0 "Refinarias de Pernis"
 HOL_nam_pernis_refineries_desc:0 "As Refinarias de Pernis, operadas pela Royal Dutch Shell, formam um dos maiores complexos de refino da Europa, próximo a Roterdã. Com instalações avançadas e plantas petroquímicas integradas, Pernis tem papel crucial no processamento de petróleo bruto em uma ampla gama de produtos refinados, incluindo combustíveis, lubrificantes e matérias-primas químicas, atendendo às necessidades energéticas e ao desenvolvimento industrial da região."
 HOL_regio:0 "Economia Regional"
 HOL_regio_desc:0 "Enquanto a Randstad prospera, é crucial garantir a prosperidade do restante dos Países Baixos. Investir em um conjunto mais diversificado de regiões equilibrará o crescimento econômico e melhorará a qualidade de vida em todo o país."
 HOL_dutch_agriculture:0 "Investimentos na Agricultura Holandesa"
 HOL_dutch_agriculture_desc:0 "Os Países Baixos são reconhecidos como um dos países agrícolas mais eficientes e o 2º maior exportador de produtos agrícolas do mundo. Precisamos investir em nosso setor para continuar na liderança mundial."
 HOL_plantlab:0 "Criação da Plantlab"
 HOL_plantlab_desc:0 "A PlantLab é uma empresa holandesa de tecnologia agrícola especializada em soluções de agricultura vertical. Ao aproveitar técnicas avançadas de cultivo em ambiente fechado, incluindo hidroponia e iluminação LED, a PlantLab revoluciona a produção de alimentos, permitindo o cultivo o ano todo de culturas de alta qualidade em ambientes controlados. Com foco em sustentabilidade e eficiência de recursos, contribui para o desenvolvimento da agricultura urbana e de sistemas alimentares resilientes."
 HOL_kringlooplandbouw: "Kringlooplandbouw"
 HOL_kringlooplandbouw_desc:0 "A agricultura circular é uma forma de agricultura sustentável em que o ciclo das substâncias é fechado. Isso significa que todas as substâncias retiradas de uma área pela agricultura também são devolvidas a ela. A quantidade de substâncias que saem de uma área, como os nitratos, deve, portanto, retornar à área. Os recursos disponíveis são usados da forma mais eficiente possível, e os agricultores procuram equilibrar a saída e a entrada desses recursos. Pesquisas da Universidade de Wageningen mostram que a agricultura circular resulta em menores concentrações de nitrato nas águas subterrâneas ao reduzir a saída de nitrogênio das terras cultivadas."
 HOL_smart_dairy_farming:0 "Pecuária Leiteira Inteligente"
 HOL_smart_dairy_farming_desc:0 "A Pecuária Leiteira Inteligente aproveita tecnologias digitais e soluções baseadas em dados para otimizar os processos de produção de leite e melhorar as práticas de gestão das fazendas. Ao incorporar sensores, automação e análise preditiva, aprimora o bem-estar animal, a produtividade e a sustentabilidade ambiental. Com foco em eficiência e inovação, permite aos produtores de leite tomar decisões embasadas e alcançar a excelência operacional no cenário agrícola moderno."
 HOL_zero_dairy_farming:0 "Projeto Pecuária Leiteira de Emissão Zero"
 HOL_zero_dairy_farming_desc:0 "O Projeto Pecuária Leiteira de Emissão Zero visa reduzir as emissões de gases de efeito estufa e o impacto ambiental na produção de leite por meio de tecnologias inovadoras e práticas sustentáveis. Implementando sistemas de energia renovável, tecnologias de captura de metano e medidas de sequestro de carbono, o projeto busca a neutralidade de carbono e promove métodos agrícolas resilientes ao clima. Com compromisso com a sustentabilidade e a responsabilidade, abre caminho para uma indústria leiteira mais verde e sustentável."
 HOL_digital_agriculture:0 "Programa de Agricultura Digital"
 HOL_digital_agriculture_desc:0 "O setor agrícola está evoluindo, e é hora de levá-lo para a era digital. Com o Programa de Agricultura Digital, equiparemos nossos agricultores com tecnologias de ponta, como agricultura de precisão, análise de dados e sistemas de irrigação inteligentes. A iniciativa visa aumentar a eficiência agrícola, reduzir o desperdício e promover práticas agrícolas sustentáveis. O futuro da agricultura é digital, e este programa garantirá que nossos agricultores abram o caminho."
 HOL_food_valley: "Holland Food Valley"
 HOL_food_valley_desc:0 "O Holland Food Valley é um dos principais polos de inovação agroalimentar dos Países Baixos, reunindo empresas, instituições de pesquisa e órgãos governamentais para impulsionar a inovação e a colaboração na indústria alimentícia. Com foco em pesquisa e desenvolvimento, transferência de tecnologia e acesso a mercados, acelera o desenvolvimento e a adoção de produtos, processos e modelos de negócios alimentares inovadores, posicionando os Países Baixos como líder global em inovação agroalimentar."
 HOL_floating_farm_project:0 "Projeto Fazenda Flutuante"
 HOL_floating_farm_project_desc:0 "Inaugurada em 2019 no Merwehaven de Roterdã, a Fazenda Flutuante é a primeira fazenda leiteira flutuante do mundo. Seu gado é alimentado com fluxos circulares de resíduos da cidade, incluindo bagaço de cervejaria, cascas de batata e grama cortada de parques e campos de golfe, enquanto o esterco é reciclado no local. Construída para flutuar, a plataforma serve como campo de testes para a produção de alimentos adaptada ao clima e baseada na água, em uma nação de delta que enfrenta a elevação dos mares e a escassez de terra urbana."
 HOL_stedelijke_reststromen:0 "Fluxos Residuais Urbanos"
 HOL_stedelijke_reststromen_desc:0 "Os municípios encaminham aparas de grama das beiras de estradas e resíduos alimentares domésticos separados para fazendas próximas, onde biodigestores os convertem em biogás e o digestato restante retorna aos campos como composto. O arranjo fecha o ciclo de nutrientes e energia entre a cidade e o campo ao redor."
 HOL_boeren_en_gemeenschap:0 "Agricultores e a Comunidade"
 HOL_boeren_en_gemeenschap_desc:0 "Em troca dos recursos que fluem das cidades, os agricultores patrocinam clubes esportivos locais e associações de vilarejos. Isso aprofunda o vínculo entre a economia rural e a vida municipal, reforçando o apoio ao setor agrícola."
 HOL_enpower_gedeputeerde_staten:0 "Fortalecer os Gedeputeerde Staten"
 HOL_enpower_gedeputeerde_staten_desc:0 "Aumentar a autonomia e os recursos dos governos regionais (Gedeputeerde Staten) permite políticas locais mais adequadas e eficazes."
 HOL_lelystad_airport:0 "Criação do Aeroporto de Lelystad"
 HOL_lelystad_airport_desc:0 "O projeto de expansão do Aeroporto de Lelystad visa aliviar o congestionamento do Aeroporto de Schiphol aumentando a capacidade e melhorando as instalações em Lelystad. Isso inclui ampliar as pistas, modernizar os terminais e melhorar os serviços aos passageiros. Espera-se que o projeto impulsione a conectividade regional, o turismo e o crescimento econômico em Flevoland e arredores."
 HOL_provincial_railways:0 "Investimentos nas Ferrovias Provinciais"
 HOL_provincial_railways_desc:0 "O projeto das ferrovias provinciais inclui iniciativas como a Lelylijn, a Wunderline e o Trem dos Três Países para melhorar a conectividade regional e transfronteiriça. A Lelylijn propõe uma ligação ferroviária de alta velocidade entre as províncias do norte e a Randstad. A Wunderline melhora os serviços ferroviários entre Groningen e Bremen, na Alemanha, enquanto o Trem dos Três Países aprimora a conectividade ferroviária entre os Países Baixos, §Y[BEL.GetNameWithFlag]§! e a Alemanha."
 HOL_eindhoven_brainport: "Eindhoven Brainport"
 HOL_eindhoven_brainport_desc:0 "O projeto Eindhoven Brainport transforma Eindhoven em um importante polo de tecnologia e inovação. Ao fomentar indústrias de alta tecnologia, apoiar instituições de pesquisa e incentivar startups, a iniciativa pretende impulsionar o avanço tecnológico e o crescimento econômico da região."
 HOL_balanced_national_development:0 "Desenvolvimento Nacional Equilibrado"
 HOL_balanced_national_development_desc:0 "Com a regio agora prosperando, pretendemos garantir um desenvolvimento nacional equilibrado. Coordenar os esforços entre a Randstad e a regio alcançará um crescimento sustentável e equitativo em todo o país. Isso inclui políticas e investimentos para integrar as atividades econômicas e o desenvolvimento de infraestrutura."
 HOL_diversify_groningen_economy:0 "Diversificar a Economia de Groningen"
 HOL_diversify_groningen_economy_desc:0 "Após o fim da extração de gás natural em Groningen devido a riscos sísmicos, os esforços se concentram em diversificar a economia da região. Isso inclui investir em energia renovável, setores de tecnologia e agricultura sustentável."
 HOL_landbouwregio:0 "Landbouwregio do Século XXI"
 HOL_landbouwregio_desc:0 "Transformar as regiões agrícolas para o século XXI envolve adotar tecnologias agrícolas avançadas e práticas sustentáveis. Esta iniciativa se concentra em modernizar as técnicas de cultivo, melhorar a logística da cadeia de suprimentos e promover práticas ambientalmente amigáveis."
 HOL_health_houses:0 "Casas de Saúde"
 HOL_health_houses_desc:0 "A iniciativa Casas de Saúde visa estabelecer centros de saúde integrados em toda a região, oferecendo serviços médicos abrangentes e promovendo a saúde pública. Esses centros oferecerão atenção primária, tratamentos especializados e programas de bem-estar sob o mesmo teto, melhorando o acesso à saúde e a qualidade de vida dos moradores."
 HOL_dutch_economic_landscape:0 "Economia dos Três Pilares"
 HOL_dutch_economic_landscape_desc:0 "A economia holandesa se apoia em três pilares centrais: comércio internacional, agricultura avançada e um setor de serviços globalmente integrado. Com portos de classe mundial, um agronegócio inovador e posição dominante em finanças e logística, os Países Baixos têm influência muito acima de seu tamanho. Esse modelo equilibrado impulsiona o crescimento e a resiliência, embora continue sensível a rupturas globais e mudanças políticas."
 HOL_randstad: "Randstad"
 HOL_randstad_desc:0 "A Randstad, formada por grandes cidades como Amsterdã, Roterdã, Haia e Utrecht, é o motor econômico dos Países Baixos. Investindo em infraestrutura e desenvolvimento empresarial, pretendemos reforçar ainda mais seu papel como o motor econômico do país."
 HOL_zuidas_development:0 "Desenvolvimento do Zuidas"
 HOL_zuidas_development_desc:0 "O distrito de Zuidas, em Amsterdã, é um importante centro financeiro. Ampliar sua capacidade e melhorar suas instalações atrairá mais empresas internacionais e consolidará seu status de polo financeiro global."
 HOL_randstad_rail: "Randstad Rail"
 HOL_randstad_rail_desc:0 "O projeto RandstadRail conecta Haia, Roterdã e Zoetermeer por meio de uma eficiente rede de veículos leves sobre trilhos. Melhorar essa rede aprimorará a conectividade regional."
 HOL_smart_city_initiative:0 "Iniciativa Cidade Inteligente"
 HOL_smart_city_initiative_desc:0 "Investir em tecnologias de cidades inteligentes em toda a Randstad tornará nossas cidades mais eficientes, sustentáveis e atraentes tanto para empresas quanto para moradores."
 HOL_international_peace_city:0 "Cidade Internacional da Paz e da Justiça"
 HOL_international_peace_city_desc:0 "Aproveitando o status de Haia como Cidade Internacional da Paz e da Justiça, fortaleceremos os laços diplomáticos e ampliaremos nossa influência global ao sediar organizações e eventos internacionais."
 HOL_randpowerhouse: "Randpowerhouse"
 HOL_randpowerhouse_desc:0 "Após anos de investimentos estratégicos e planejamento visionário, a região da Randstad transformou-se com sucesso na 'Randpowerhouse', o dinâmico motor econômico dos Países Baixos. Ao melhorar a infraestrutura, fomentar a inovação e aprimorar a conectividade entre Amsterdã, Roterdã, Haia e Utrecht, a região é hoje líder global em comércio, cultura e tecnologia. Essa transformação não só reforçou a produção econômica da Randstad, como também consolidou a posição dos Países Baixos como ator-chave no cenário europeu, impulsionando o crescimento nacional e estabelecendo novos padrões de desenvolvimento urbano."
 HOL_dutch_industry:0 "Indústria Holandesa"
 HOL_dutch_industry_desc:0 "A Indústria Holandesa encarna o legado de inovação e excelência dos Países Baixos em diversos setores. Com foco em sustentabilidade, tecnologia e competitividade global, a indústria holandesa permanece na vanguarda do crescimento econômico e da prosperidade."
 HOL_postbank_fusion:0 "Fusão Postbank-ING"
 HOL_postbank_fusion_desc:0 "A fusão do Postbank com o ING representa um marco na história bancária holandesa, consolidando duas grandes instituições financeiras em uma única entidade. Essa fusão reforça a posição do ING como um dos principais bancos globais, oferecendo serviços e soluções financeiras aprimorados a clientes do mundo todo."
 HOL_randstad_takeovers:0 "Aquisições da Randstad"
 HOL_randstad_takeovers_desc:0 "As aquisições da Randstad demonstram a expansão estratégica e as ambições globais das empresas holandesas no setor de recrutamento e alocação de pessoal. Ao adquirir players-chave do mercado, a Randstad reforça sua posição de líder em soluções de recursos humanos em escala global."
 HOL_ing_group_strategy:0 "Estratégias de Expansão do ING Group"
 HOL_ing_group_strategy_desc:0 "A Estratégia do ING Group delineia a visão do banco para o crescimento sustentável e a transformação digital no setor financeiro. Ao abraçar a inovação e soluções centradas no cliente, o ING reafirma seu compromisso de impulsionar mudanças positivas e gerar valor para as partes interessadas."
 HOL_adyen_fintech_hub:0 "Adyen e o Polo Fintech"
 HOL_adyen_fintech_hub_desc:0 "A Adyen, processadora de pagamentos sediada em Amsterdã e fundada em 2006, tornou-se uma das maiores fintechs da Europa ao processar transações de comerciantes globais, da Netflix ao Spotify. Seu sucesso posiciona os Países Baixos como a capital continental de pagamentos digitais e tecnologia financeira, atraindo investimentos e empregos de serviços de alto valor para a Randstad."
 HOL_pension_fund_reform:0 "Reforma dos Fundos de Pensão"
 HOL_pension_fund_reform_desc:0 "O ABP e o PFZW estão entre os maiores fundos de pensão do mundo, dando ao capital holandês enorme alcance global por meio de participações em ações, infraestrutura e imóveis ao redor do planeta. A Lei das Pensões do Futuro de 2023 (Wet toekomst pensioenen) muda o sistema de planos de benefício definido para planos de contribuição definida, remodelando como esse vasto montante é alocado e investido nas próximas décadas."
 HOL_booking_digital_services:0 "Economia de Serviços Digitais"
 HOL_booking_digital_services_desc:0 "A Booking.com, a maior agência de viagens online do mundo, tem sede em Amsterdã ao lado de empresas como Just Eat Takeaway e TomTom, ancorando um setor de plataformas e serviços digitais de profundidade incomum para um país desse tamanho. Esse cluster atrai talentos internacionais e transferências corporativas para a Randstad, consolidando os Países Baixos como polo de sedes de tecnologia europeias."
 HOL_spring_global_mail:0 "Expansão da Spring Global Mail"
 HOL_spring_global_mail_desc:0 "A Spring Global Mail representa a expertise holandesa em soluções internacionais de correio e logística. Ao oferecer serviços postais eficientes e confiáveis em todo o mundo, facilita o comércio e a comunicação globais, conectando empresas e consumidores além das fronteiras."
 HOL_tata_steel_development:0 "Desenvolvimento da Tata Steel"
 HOL_tata_steel_development_desc:0 "O Desenvolvimento da Tata Steel marca um investimento significativo na manufatura holandesa, garantindo o crescimento contínuo e a competitividade da indústria siderúrgica. A iniciativa ressalta o compromisso da Tata Steel com a inovação e a sustentabilidade, fortalecendo sua presença no mercado holandês."
 HOL_project_beethoven:0 "Projeto Beethoven"
 HOL_project_beethoven_desc:0 "Com foco em impulsionar o crescimento do setor de tecnologia nos Países Baixos, o Projeto Beethoven surge como resposta estratégica às preocupações de líderes da indústria, incluindo a ASML, quanto ao clima de investimentos do país. Essa iniciativa ambiciosa, respaldada por um investimento governamental de mais de 2,5 bilhões de euros, visa cultivar um ambiente propício à expansão doméstica de gigantes da tecnologia como a ASML, reforçando a posição do país como polo global de inovação."
 HOL_phillips_healthcare_expansion:0 "Expansão da Phillips Healthcare"
 HOL_phillips_healthcare_expansion_desc:0 "A Expansão da Philips Healthcare reflete a liderança dos Países Baixos em tecnologia e inovação em saúde. Ao ampliar seu portfólio de saúde, a Philips reafirma seu compromisso de melhorar os resultados dos pacientes e fazer avançar as soluções médicas em todo o mundo."
 HOL_south_dakota:0 "Fábricas da DSM em Dakota do Sul"
 HOL_south_dakota_desc:0 "As Fábricas de Bioetanol da DSM em Dakota do Sul simbolizam a liderança holandesa em soluções de energia sustentável. Ao investir na produção de bioetanol, a DSM contribui para reduzir as emissões de carbono e promover fontes de energia renovável em escala global."
 HOL_dutch_legends:0 "Lendas Holandesas"
 HOL_dutch_legends_desc:0 "Ao longo da história, os Países Baixos cultivaram um legado lendário, mesclando contos de domínio das águas com narrativas de comércio marítimo. Dos feitos lendários dos engenheiros holandeses que conquistaram terra ao mar às façanhas audaciosas dos mercadores holandeses navegando por águas distantes, essas lendas entrelaçam resiliência, engenhosidade e prosperidade."
 HOL_trade_infrastructure:0 "Modernizar a Infraestrutura Comercial"
 HOL_trade_infrastructure_desc:0 "Os Países Baixos ostentam uma infraestrutura comercial finamente ajustada, tecendo portos, canais e rodovias para criar uma rede de comércio contínua. No entanto, à medida que o comércio global evolui e as exigências aumentam, essa infraestrutura precisa ser modernizada para manter sua vantagem competitiva. Investir em tecnologias de ponta e atualizar as rotas de transporte garantirá que os Países Baixos continuem sendo um ator-chave do comércio internacional por décadas."
 HOL_maasvlakte2:0 "Construir Maasvlakte 2"
 HOL_maasvlakte2_desc:0 "Os Países Baixos empreendem o ambicioso projeto Maasvlakte 2, conquistando terra ao mar para ampliar as instalações portuárias e estimular o crescimento econômico, ecoando o histórico domínio do país sobre a gestão da água e a engenharia."
 HOL_european_railway_development:0 "Desenvolvimentos Ferroviários Europeus"
 HOL_european_railway_development_desc:0 "Com base em seu legado de infraestrutura de transporte inovadora, os Países Baixos lideram o desenvolvimento ferroviário europeu, fomentando a conectividade, o comércio e a mobilidade no continente por meio de sua avançada rede ferroviária."
 HOL_green_harbor_amsterdam:0 "Porto Verde de Amsterdã"
 HOL_green_harbor_amsterdam_desc:0 "Amsterdã transforma seu porto em um polo sustentável, adotando práticas ecológicas e iniciativas de energia renovável, demonstrando o compromisso holandês com a gestão ambiental e a inovação marítima."
 HOL_nederland_maritiem_land: "Stichting Nederland Maritiem Land"
 HOL_nederland_maritiem_land_desc:0 "A criação da Stichting Nederland Maritiem Land ressalta a herança marítima e a liderança industrial dos Países Baixos, promovendo a colaboração e o avanço no setor marítimo para garantir sua prosperidade contínua e competitividade global."
 HOL_schiphol_expansion:0 "Expansão de Schiphol"
 HOL_schiphol_expansion_desc:0 "A Expansão de Schiphol marca um momento decisivo na aviação holandesa, levando o aeroporto de Amsterdã à vanguarda das viagens globais. Ao acomodar maior capacidade e melhorar a experiência dos passageiros, essa expansão ressalta o compromisso dos Países Baixos com a eficiência e a conectividade do transporte aéreo."
 HOL_digital_customs:0 "Alfândega Digital"
 HOL_digital_customs_desc:0 "A Alfândega Digital revoluciona as operações comerciais holandesas, simplificando processos e aumentando a eficiência por meio de soluções digitais inovadoras. A iniciativa personifica a adoção do avanço tecnológico pelos Países Baixos para reforçar sua posição como polo do comércio global."
 HOL_daf_investments:0 "Investir na DAF"
 HOL_daf_investments_desc:0 "Os Investimentos na DAF simbolizam o compromisso da indústria automotiva holandesa com a inovação e o crescimento. Por meio de investimentos estratégicos e avanços tecnológicos, a DAF reforça sua posição como fabricante líder de veículos comerciais, impulsionando a força industrial holandesa."
 HOL_rijkswaterstaat: "Rijkswaterstaat"
 HOL_rijkswaterstaat_desc:0 "A Rijkswaterstaat, agência do governo holandês responsável pela gestão da água e pela infraestrutura, tem papel central na configuração da paisagem hídrica do país, supervisionando a manutenção de vias navegáveis, diques e defesas contra inundações, protegendo os Países Baixos da ameaça de enchentes e garantindo o uso eficiente e sustentável dos recursos hídricos."
 HOL_deltawerken_modernization:0 "Modernização dos Deltawerken"
 HOL_deltawerken_modernization_desc:0 "Os Países Baixos modernizam seus icônicos Deltawerken, reforçando as defesas costeiras e se adaptando à elevação do nível do mar e à mudança dos padrões climáticos, garantindo proteção contínua contra inundações e resguardando o litoral holandês para as futuras gerações."
 HOL_ruimte_voor_de_rivier: "Ruimte voor de Rivier"
 HOL_ruimte_voor_de_rivier_desc:0 "Adotando uma abordagem proativa na gestão do risco de inundações, os Países Baixos implementam o projeto Espaço para o Rio, criando espaço ao longo das margens para absorver o aumento das águas e proteger as áreas urbanas, demonstrando a engenhosidade holandesa no planejamento urbano centrado na água."
 HOL_green_water_city_building:0 "Construção de Cidades Verdes e Aquáticas"
 HOL_green_water_city_building_desc:0 "Abraçando uma visão de desenvolvimento urbano sustentável, os Países Baixos são pioneiros em iniciativas de Construção de Cidades Verdes e Aquáticas, integrando princípios de projeto sensíveis à água e soluções baseadas na natureza ao planejamento urbano e a projetos de infraestrutura para criar cidades resilientes e habitáveis que se harmonizam com o meio ambiente, encarnando o compromisso holandês com o crescimento verde e a gestão ambiental."
 HOL_dutch_water_sector:0 "Setor Hídrico Holandês"
 HOL_dutch_water_sector_desc:0 "O Setor Hídrico Holandês prospera como líder global em gestão da água e inovação, apoiando-se em séculos de expertise em controle de enchentes, defesa costeira e gestão de recursos hídricos para enfrentar os desafios hídricos urgentes do mundo, exemplificando a engenhosidade holandesa e o compromisso com o desenvolvimento sustentável."
 HOL_hollandse_kust_windfarm:0 "Construir Hollandse Kust"
 HOL_hollandse_kust_windfarm_desc:0 "Os Países Baixos avançam em sua agenda de energia renovável com o desenvolvimento da Zona de Parques Eólicos Hollandse Kust, aproveitando a energia eólica para impulsionar o crescimento econômico sustentável e reduzir as emissões de carbono, alinhando-se aos esforços holandeses de combate às mudanças climáticas e promoção de soluções de energia verde."
 HOL_aquatech_amsterdam:0 "Organizar a Aquatech Amsterdam"
 HOL_aquatech_amsterdam_desc:0 "A Aquatech Amsterdam é um dos principais eventos de tecnologia hídrica, reunindo pioneiros e especialistas do setor para explorar inovações em gestão da água e sustentabilidade. Por meio de exposições e networking, fomenta a colaboração e impulsiona o progresso rumo a um futuro com maior segurança hídrica."
 HOL_dredging_industry:0 "Indústria Holandesa de Dragagem"
 HOL_dredging_industry_desc:0 "Boskalis, Van Oord e Royal IHC fazem juntas dos Países Baixos o líder mundial incontestável em dragagem e engenharia marítima. Seus contratos globais para aprofundar portos, escavar canais de navegação e executar projetos de aterro exportam a expertise holandesa e geram receitas externas substanciais, sustentando milhares de empregos qualificados no país."
 HOL_van_oord_offshore:0 "Instalação de Energia Eólica Offshore"
 HOL_van_oord_offshore_desc:0 "Embarcações holandesas especializadas erguem as turbinas dos parques eólicos do Mar do Norte ao largo das costas de Hollandse Kust e Borssele, combinando a capacidade doméstica de construção naval com expertise em construção offshore. A mesma frota que cria capacidade para a transição energética holandesa também atende ao mercado de eólica offshore em rápida expansão da Europa, garantindo receitas contratuais de longo prazo."
 HOL_global_land_reclamation:0 "Aterros Globais"
 HOL_global_land_reclamation_desc:0 "Empreiteiras holandesas exportam seu domínio de aterros e defesa costeira pelo mundo, entregando ilhas artificiais, expansões portuárias e obras de proteção contra inundações do Oriente Médio ao Sudeste Asiático. Séculos contendo o mar se tornaram um serviço de engenharia premium, e as empresas que o levam ao exterior representam algumas das exportações industriais mais distintivas dos Países Baixos."
 HOL_form_nso:0 "Organização Espacial dos Países Baixos"
 HOL_form_nso_desc:0 "Uma agência espacial nacional permitirá aos Países Baixos consolidar seus esforços de pesquisa, desenvolvimento e exploração sob uma estrutura unificada. A criação da NSO garantirá investimento de longo prazo em viagens espaciais, tecnologia de satélites e futuras missões interplanetárias."
 HOL_ijstad_mission:0 "Construir IJStad"
 HOL_ijstad_mission_desc:0 "IJStad é uma cidade em ilha artificial planejada no IJmeer, logo a leste de Amsterdã, concebida como a continuação moderna da tradição holandesa de aterros. A nova ilha abrigaria cerca de 45.000 moradias, aliviando a escassez habitacional da Randstad e demonstrando que os Países Baixos ainda podem criar terra nova a partir de águas abertas. A construção deve levar cerca de três anos e remodelará a região de West-Nederland, em torno de Amsterdã, acrescentando capacidade industrial e escritórios junto aos novos distritos residenciais."
 HOL_mars_colony_mission:0 "Estabelecer a Colônia em Marte"
 HOL_mars_colony_mission_desc:0 "Com a capacidade de lançamento garantida e um fluxo constante de recrutas e equipamentos deixando os Países Baixos, o longo esforço para pousar e sustentar colonos holandeses em Marte entra em sua fase final. Habitats, sistemas de suporte à vida e as primeiras estruturas permanentes precisam ser montados ao longo de milhões de quilômetros de espaço vazio. Quando a colônia estiver pronta, seus fundadores lhe darão um nome tirado das lendas da pátria que deixaram para trás."
 HOL_mars_colony1: "Hollanderhaven"
 HOL_mars_colony1_desc:0 "A colônia toma seu nome de De Vliegende Hollander, o Holandês Voador, o capitão mercante amaldiçoado, condenado a navegar os mares para sempre sem aportar. Adequadamente, Hollanderhaven torna-se o coração comercial da colônia, um entreposto em um mundo novo construído por descendentes de uma nação marítima. Seus administradores canalizam o velho instinto de lucro da VOC para a fronteira marciana."
 HOL_mars_colony2: "Brinkerdam"
 HOL_mars_colony2_desc:0 "Brinkerdam homenageia Hans Brinker, o menino da lenda que conteve o mar tapando com o dedo, durante a noite, um vazamento em um dique. O assentamento se especializa nas paredes de pressão, nas cúpulas seladas e na hidroengenharia que mantêm a colônia habitável contra o hostil ambiente marciano. A mesma disciplina que construiu os Deltawerken agora mantém o vácuo à distância."
 HOL_mars_colony3: "Brandaanstad"
 HOL_mars_colony3_desc:0 "Batizada em homenagem a Sint-Brandaan, o viajante medieval cuja lendária jornada o levou até os confins do mundo conhecido, Brandaanstad é o centro de aprendizado e pesquisa da colônia. Seus laboratórios se baseiam na herança da TU Delft e do ESTEC, ampliando as fronteiras da ciência planetária. A cidade encarna a curiosidade que primeiro levou os holandeses além do horizonte."
 HOL_mars_colony4: "Brammertdelf"
 HOL_mars_colony4_desc:0 "Brammertdelf evoca Ellert en Brammert, os dois gigantes e salteadores que outrora assombravam a charneca de Drenthe. O assentamento é a âncora da indústria de mineração e extração da colônia, arrancando minérios e voláteis da crosta marciana. Como seus gigantes xarás, vive da terra que reivindica, fornecendo as matérias-primas que sustentam toda a colônia."
 HOL_commissariaat_militaire_productie: "Commissariaat Militaire Productie"
 HOL_commissariaat_militaire_productie_desc:0 "O Commissariaat Militaire Productie concentra-se em coordenar e aprimorar as capacidades de produção militar em todos os Países Baixos. A iniciativa visa agilizar os processos de aquisição, fomentar as indústrias de defesa nacionais e garantir um fornecimento constante de equipamento militar avançado."
 HOL_dutch_defense_doctrine: "Nederlandse Defensie Doctrine"
 HOL_dutch_defense_doctrine_desc:0 "A Doutrina de Defesa Holandesa estabelece a base da direção estratégica e dos princípios operacionais das Forças Armadas Holandesas. Essa doutrina enfatiza agilidade, poder de fogo e cooperação, garantindo que nossas forças estejam preparadas para defender os interesses nacionais, apoiar aliados e responder a crises globais."
 HOL_authority_in_information:0 "Autoridade em Informação"
 HOL_authority_in_information_desc:0 "Estabelecer uma posição de autoridade em informação é fundamental para manter a vantagem estratégica. Isso envolve aprimorar as capacidades de inteligência, vigilância e reconhecimento para coletar e processar informações críticas com eficiência."
 HOL_integrated_actions:0 "Ações Integradas"
 HOL_integrated_actions_desc:0 "Ações integradas nos domínios terrestre, marítimo, aéreo, cibernético e espacial garantem capacidades de defesa abrangentes. Esse foco promove coordenação fluida e operações conjuntas para aumentar a eficácia militar geral."
 HOL_information_based:0 "Baseado em Informação"
 HOL_information_based_desc:0 "Uma abordagem baseada em informação aprimora a tomada de decisões e a eficácia operacional. Investindo em capacidades de inteligência, vigilância e reconhecimento, os Países Baixos garantem que podem responder de forma rápida e eficaz a ameaças emergentes."
 HOL_increase_strategic_capacity:0 "Aumentar a Capacidade Estratégica"
 HOL_increase_strategic_capacity_desc:0 "Ampliar nossa capacidade estratégica é essencial para enfrentar os desafios futuros. Isso envolve desenvolver capacidades de transporte estratégico, defesa cibernética e operações espaciais, garantindo que os Países Baixos possam projetar poder e influência globalmente."
 HOL_dutch_specialism:0 "Especialização Holandesa"
 HOL_dutch_specialism_desc:0 "Para fortalecer nosso papel na OTAN, os Países Baixos desenvolverão capacidades especializadas que complementem as necessidades da aliança. Isso inclui expertise em operações anfíbias, defesa aérea e forças de mobilização rápida."
 HOL_invest_in_europe:0 "Investir na Defesa da Europa"
 HOL_invest_in_europe_desc:0 "Investir nas capacidades de defesa da Europa garante um continente mais forte e resiliente. Os Países Baixos aumentarão suas contribuições às iniciativas europeias de defesa, ampliando a cooperação e a interoperabilidade com os Estados-membros da UE."
 HOL_military_society:0 "Campanha Militar e Sociedade"
 HOL_military_society_desc:0 "Construir uma forte conexão entre os militares e a sociedade é crucial. Esse foco inclui iniciativas para aumentar o engajamento do público, apoiar veteranos e fomentar uma cultura de consciência de defesa."
 HOL_reliable_partner:0 "Parceiro Holandês Confiável"
 HOL_reliable_partner_desc:0 "Como parceiro e protetor confiável, os Países Baixos garantirão a segurança de seus aliados e contribuirão para a estabilidade internacional. Isso envolve participação ativa em missões da OTAN e da UE e a manutenção da prontidão para proteger os interesses nacionais e aliados."
 HOL_unique_people:0 "Pessoal Único Holandês"
 HOL_unique_people_desc:0 "Reconhecer e desenvolver as habilidades únicas de nosso pessoal é vital. Esse foco enfatiza treinamento avançado, educação e desenvolvimento de carreira para garantir que as forças armadas contem com indivíduos altamente qualificados e motivados."
 HOL_flexible_operations:0 "Operações Flexíveis"
 HOL_flexible_operations_desc:0 "Para permanecerem ágeis e escaláveis, as forças armadas devem ser capazes de responder rapidamente a circunstâncias em mudança. Isso inclui o desenvolvimento de forças de reação rápida e o aumento da mobilidade das tropas para se adaptar rapidamente a diversos cenários de ameaça."
 HOL_innovative_capacity:0 "Capacidade Inovadora"
 HOL_innovative_capacity_desc:0 "Investir em pesquisa e desenvolvimento para manter uma forte capacidade inovadora é essencial. Isso envolve adotar tecnologias de ponta e fomentar uma cultura de inovação para se manter à frente de potenciais adversários."
 HOL_escalation_dominance:0 "Domínio da Escalada"
 HOL_escalation_dominance_desc:0 "Alcançar o domínio da escalada exige capacidades militares superiores e parcerias estratégicas sólidas. Isso garante que as forças armadas possam dissuadir e responder a conflitos de forma eficaz em qualquer nível."
 HOL_defensievisie_completed:0 "Defensievisie Concluída"
 HOL_defensievisie_completed_desc:0 "Com a conclusão bem-sucedida da Doutrina de Defesa Holandesa, as Forças Armadas Holandesas passaram por uma transformação notável. Modernizadas, resilientes e equipadas com tecnologia de ponta, as forças estão prontas para enfrentar os desafios do futuro. Esse marco reflete a dedicação e o trabalho árduo de nosso pessoal, que abraçou a inovação, fortaleceu as parcerias internacionais e aprimorou a prontidão operacional"
 HOL_koninklijke_luchtmacht: "Parvus Numero, Magnus Merito"
 HOL_koninklijke_luchtmacht_desc:0 "Adotar o lema Parvus numero, magnus merito (Pequeno em número, grande em mérito) concentrando-se em maximizar a eficiência e a eficácia da Força Aérea Holandesa. Isso envolve otimizar programas de treinamento, melhorar os procedimentos de manutenção e aproveitar tecnologia avançada para garantir que cada aeronave e cada aviador contribua de forma significativa para a missão."
 HOL_join_jsf:0 "Aderir ao Programa JSF"
 HOL_join_jsf_desc:0 "A participação dos Países Baixos no programa Joint Strike Fighter (JSF) envolve a aquisição de aeronaves F-35 Lightning II. Esse foco garante que a Força Aérea Holandesa seja equipada com caças furtivos de última geração, ampliando a superioridade aérea e as capacidades de ataque."
 HOL_join_eurofighter_project:0 "Aderir ao Projeto Eurofighter"
 HOL_join_eurofighter_project_desc:0 "Ao aderir ao projeto Eurofighter Typhoon, os Países Baixos investem em uma aeronave de caça multifunção altamente avançada. Esse foco amplia as capacidades da Força Aérea Holandesa em combate ar-ar, ataque ao solo e missões de reconhecimento."
 HOL_buy_saab_jas39:0 "Comprar o Saab JAS39"
 HOL_buy_saab_jas39_desc:0 "A aquisição dos caças Saab JAS39 Gripen dá à Força Aérea Holandesa uma aeronave multifunção versátil e de bom custo-benefício. Esse foco amplia as capacidades de defesa aérea, apoio ao solo e reconhecimento, garantindo flexibilidade operacional."
 HOL_buy_mq9_reaper:0 "Comprar o MQ-9 Reaper"
 HOL_buy_mq9_reaper_desc:0 "Investir em drones MQ-9 Reaper amplia as capacidades de reconhecimento e ataque da Força Aérea Holandesa. Esses veículos aéreos não tripulados (VANTs) oferecem inteligência em tempo real, vigilância e opções de ataque de precisão, aumentando significativamente a eficácia operacional."
 HOL_defensie_helikopter_commando:0 "Criação do Defensie Helikopter Commando"
 HOL_defensie_helikopter_commando_desc:0 "O Defensie Helikopter Commando (DHC) supervisiona as operações de todos os helicópteros militares das Forças Armadas Holandesas. Esse foco visa aprimorar as capacidades, o treinamento e a coordenação da frota de helicópteros, apoiando missões nacionais e internacionais."
 HOL_ch47d_modernization:0 "Modernização do CH-47D"
 HOL_ch47d_modernization_desc:0 "A modernização dos helicópteros CH-47D Chinook envolve atualizar a aviônica, os motores e os sistemas de carga. Esse foco garante que esses helicópteros de carga pesada continuem eficazes e confiáveis em missões de transporte, evacuação médica e apoio"
 HOL_ah46d_upgrade:0 "Atualização do AH-64D"
 HOL_ah46d_upgrade_desc:0 "A atualização dos helicópteros de ataque AH-64D Apache inclui aprimorar sua aviônica, seus sistemas de armas e sua capacidade de sobrevivência. Esse foco reforça as capacidades de combate da Força Aérea Holandesa, garantindo que esses helicópteros possam executar com eficácia missões de apoio aéreo aproximado e antiblindagem."
 HOL_air_mobility_command:0 "Comando de Mobilidade e Sustentação Aérea"
 HOL_air_mobility_command_desc:0 "Criar um comando nacional para dirigir a mobilidade aérea, a logística e a prontidão de combate independentemente de arranjos com aliados. Ao centralizar a sustentação sob controle holandês, a Força Aérea pode gerar surtidas e manter sua frota sem depender do apoio de parceiros."
 HOL_woensdrecht_mro:0 "Logística de Woensdrecht e Polo de Motores F135"
 HOL_woensdrecht_mro_desc:0 "O Centro de Logística de Woensdrecht abriga a instalação regional de manutenção, reparo e revisão do motor F135 que equipa o F-35. Investir no depósito transforma os Países Baixos em um polo de sustentação para as frotas aliadas, mantendo suas próprias aeronaves prontas para a missão e reduzindo a dependência de manutenção estrangeira."
 HOL_expand_fighter_fleet:0 "Ampliar a Frota de Caças"
 HOL_expand_fighter_fleet_desc:0 "Encomendar um lote adicional de caças multifunção para levar os esquadrões à força total. A frota ampliada restaura a capacidade de mobilização e dá à Força Aérea a massa necessária para sustentar tanto o policiamento aéreo nacional quanto os compromissos expedicionários."
 HOL_expand_fighter_fleet_idea:0 "Frota de Caças Ampliada"
 HOL_expand_fighter_fleet_idea_desc:0 "Um impulso acelerado de aquisição mantém as linhas de produção de caças aquecidas, reduzindo o custo unitário das novas células enquanto o lote é entregue."
 HOL_frisian_flag_training:0 "Programa de Exercícios Frisian Flag"
 HOL_frisian_flag_training_desc:0 "Sediado na Base Aérea de Leeuwarden, o exercício anual Frisian Flag reúne forças aéreas aliadas para treinamento de combate em larga escala sobre o Mar do Norte. Um programa de treinamento permanente aprimora a proficiência dos pilotos e acelera a experiência de novas tripulações."
 HOL_precision_munitions:0 "Integração de Munições de Precisão"
 HOL_precision_munitions_desc:0 "Integrar armas guiadas como a bomba de pequeno diâmetro GBU-39, o AIM-120 AMRAAM e o míssil Meteor à frota de caças. Um conjunto de armas moderno amplia o alcance de engajamento e a letalidade, garantindo que as aeronaves holandesas possam atacar com precisão em espaço aéreo contestado."
 HOL_sovereign_air_operations:0 "Operações Aéreas Soberanas"
 HOL_sovereign_air_operations_desc:0 "Consolidar a frota, as armas e as tripulações treinadas em uma força aérea autossuficiente, capaz de conduzir operações sustentadas em seus próprios termos. Os Países Baixos agora podem defender seu espaço aéreo e projetar poder aéreo sem depender de nenhum parceiro específico."
 HOL_commando_landstrijdkrachten:0 "Estabelecer o Commando Landstrijdkrachten"
 HOL_commando_landstrijdkrachten_desc:0 "A criação do Commando Landstrijdkrachten (CLAS) em 2005 marcou uma reorganização significativa do Exército Holandês. Essa estrutura de comando central visava aumentar a eficiência operacional e agilizar os processos de tomada de decisão. Ao consolidar diversos componentes do exército sob um único comando, os Países Baixos garantiram melhor coordenação e prontidão de suas forças terrestres."
 HOL_jistarc:0 "Estabelecimento do JISTARC"
 HOL_jistarc_desc:0 "O Comando Conjunto de Inteligência, Vigilância, Aquisição de Alvos e Reconhecimento (JISTARC) foi criado para integrar e ampliar as capacidades de inteligência do Exército Holandês. Essa unidade combina diversas funções de inteligência para fornecer consciência situacional abrangente e apoio às operações. O JISTARC melhora a eficácia das missões de reconhecimento e vigilância, garantindo informações precisas e oportunas para as decisões táticas."
 HOL_dglc:0 "Reorganização do DGLC"
 HOL_dglc_desc:0 "O Defensie Grondgebonden Luchtverdedigingscommando (DGLC) é responsável pela defesa aérea terrestre. Aprimorar as capacidades do DGLC envolve atualizar sistemas de mísseis e tecnologia de radar para proteger contra ameaças aéreas. Esse foco garante que o Exército Holandês possa defender eficazmente seus ativos e território contra ataques aéreos."
 HOL_vuursteun_commando:0 "Mobilização do VuursteunCommando"
 HOL_vuursteun_commando_desc:0 "O VuursteunCommando (Comando de Apoio de Fogo) integra elementos de artilharia e apoio de fogo para fornecer poder de fogo coordenado ao Exército Holandês. Esse foco inclui modernizar os sistemas de artilharia e melhorar a precisão de pontaria. Capacidades aprimoradas de apoio de fogo aumentam a eficácia das operações terrestres e garantem poder de fogo preciso e oportuno."
 HOL_supply_command: "Bevoorradings- en Transportcommando"
 HOL_supply_command_desc:0 "O Bevoorradings- en Transportcommando (Comando de Suprimento e Transporte) é crucial para garantir o apoio logístico e a mobilidade do Exército Holandês. Esse foco visa melhorar as cadeias de suprimento, os veículos de transporte e a infraestrutura para aumentar a prontidão operacional e a eficiência do exército."
 HOL_military_production_investments:0 "Investir na Indústria de Defesa Holandesa"
 HOL_military_production_investments_desc:0 "O setor de defesa holandês recebeu investimentos importantes nos últimos anos, de projetos como o desenvolvimento do F-35 à modernização de navios como as fragatas da classe Zeven Provinciën. Ao optar por investir mais na indústria de defesa nacional, podemos impulsionar a inovação tecnológica, aumentar a autossuficiência e garantir que nossas forças armadas continuem equipadas com hardware militar de ponta. Essa decisão fortalecerá a segurança nacional e contribuirá para o crescimento de uma economia de defesa robusta."
 HOL_defense_industrial_base:0 "Fortalecer a Base Industrial de Defesa"
 HOL_defense_industrial_base_desc:0 "Empresas holandesas fornecem componentes críticos a programas de armamento aliados, mas a capacidade doméstica de montagem fica para trás. Ao expandir a construção de fábricas de armas e ancorar a produção final no país, transformamos uma rede de subcontratados em uma verdadeira base industrial nacional."
 HOL_modernize_arms_production:0 "Modernizar as Linhas de Produção de Armas"
 HOL_modernize_arms_production_desc:0 "Ferramentas obsoletas retardam o aumento da produção de novas encomendas de equipamento. Investir em automação liderada pela Thales e em linhas de produção modernas permite que nossas fábricas militares atinjam a produção plena mais rápido, encurtando os prazos de entrega às forças armadas."
 HOL_lean_defense_manufacturing:0 "Manufatura de Defesa Enxuta"
 HOL_lean_defense_manufacturing_desc:0 "Um mercado de trabalho apertado faz dos trabalhadores qualificados o fator limitante da produção de armas. Adotar métodos de manufatura enxuta na DAF e em seus fornecedores reduz a mão de obra que cada fábrica militar exige, liberando pessoal para a economia em geral."
 HOL_defense_supply_chain_integration:0 "Integrar as Cadeias de Suprimento de Defesa"
 HOL_defense_supply_chain_integration_desc:0 "Relações fragmentadas com fornecedores limitam o quão eficientes nossas fábricas podem se tornar. Integrar a cadeia de suprimento de defesa em torno de empresas como a Fokker estabiliza os insumos e eleva a eficiência máxima que nossa indústria militar pode sustentar."
 HOL_defense_export_promotion:0 "Promover as Exportações de Defesa"
 HOL_defense_export_promotion_desc:0 "Os produtos de defesa holandeses são competitivos no exterior, mas a receita de exportação é subaproveitada. Uma estratégia de exportação coordenada, apoiada pela Werkspoor e parceiros, amplia a base tributária da indústria militar e financia mais investimentos."
 HOL_national_defense_industrial_strategy:0 "Estratégia Industrial de Defesa Nacional"
 HOL_national_defense_industrial_strategy_desc:0 "Com uma base moderna, fábricas enxutas, cadeias de suprimento integradas e exportações crescentes, o governo pode unir esses ganhos em uma única estratégia industrial. Coordenar os grandes fabricantes eleva a produção geral das fábricas militares e consolida o setor de defesa como pilar da economia."
 HOL_netherlands_fractal_pattern:0 "Padrão Fractal dos Países Baixos"
 HOL_netherlands_fractal_pattern_desc:0 "O Padrão Fractal dos Países Baixos (NFP) é um padrão de camuflagem desenvolvido para os uniformes militares holandeses. Esse projeto avançado oferece melhor ocultação em vários ambientes, aumentando a sobrevivência e a eficácia do soldado em campo."
 HOL_daf_trucks:0 "Caminhões Militares DAF CF"
 HOL_daf_trucks_desc:0 "Investir nos Caminhões DAF amplia a mobilidade e as capacidades logísticas do Exército Holandês. Esses veículos versáteis e confiáveis são essenciais para transportar tropas, equipamentos e suprimentos, garantindo flexibilidade e apoio operacional."
 HOL_scania_trucks:0 "Novo Scania Gryphus"
 HOL_scania_trucks_desc:0 "Adicionar Caminhões Scania à frota de veículos do Exército Holandês melhora o apoio logístico e a eficiência do transporte. Esses caminhões são conhecidos por sua durabilidade e desempenho, o que os torna ideais para operações militares."
 HOL_mrad_replacement:0 "Modernizar o MRAD"
 HOL_mrad_replacement_desc:0 "Em 2020, o Ministério da Defesa holandês iniciou um projeto crítico para modernizar seus sistemas de Defesa Aérea de Médio Alcance (MRAD). Os sistemas atuais, incluindo o NASAMS, serão substituídos por plataformas mais avançadas e tecnologicamente superiores para proteger melhor o espaço aéreo holandês e apoiar as operações da OTAN. Ao investir em novas capacidades de defesa aérea, garantimos que nossas forças continuem aptas a se defender de ameaças aéreas modernas e a proteger os céus da nação no futuro."
 HOL_colt_upgrade:0 "Atualização do Fuzil Colt C7"
 HOL_colt_upgrade_desc:0 "Em 2009, as Forças Armadas Holandesas realizaram uma atualização significativa do fuzil Colt C7, melhorando sua precisão, confiabilidade e adaptabilidade a cenários de combate modernos. Essa modernização incluiu óptica aprimorada, ergonomia e sistemas modulares para atender às necessidades em evolução das unidades de infantaria. Ao investir nessas atualizações, o Exército Holandês garante que seus soldados estejam equipados com tecnologia de armamento de ponta, mantendo um alto nível de prontidão para o combate."
 HOL_pantserhouwitser_mlu: "Pantserhouwitser 2000 MLU"
 HOL_pantserhouwitser_mlu_desc:0 "O programa Pantserhouwitser 2000 MLU se concentra em atualizar esses obuses autopropulsados com sistemas de controle de tiro aprimorados, maior alcance e maior precisão. Isso garante que a artilharia holandesa continue altamente eficaz e capaz de fornecer apoio de fogo preciso."
 HOL_puls:0 "Encomenda do PULS Israelense"
 HOL_puls_desc:0 "O Precise and Universal Launching System (PULS) foi projetado para melhorar as capacidades de artilharia do Exército Holandês integrando sistemas avançados de foguetes e mísseis. Esse sistema permite apoio de fogo preciso e flexível, aumentando o poder de fogo geral do exército."
 HOL_bushmaster_mlu: "Bushmaster MLU"
 HOL_bushmaster_mlu_desc:0 "O programa Bushmaster MLU envolve a atualização da blindagem, dos sistemas de comunicação e da mobilidade desses veículos blindados de transporte de pessoal. Isso aumenta a proteção e a eficácia das tropas holandesas em diversos ambientes operacionais."
 HOL_munition_investments:0 "Investimentos em Munição"
 HOL_munition_investments_desc:0 "Investir em munições avançadas e ampliar os estoques garante que o Exército Holandês esteja bem abastecido e apto a sustentar operações prolongadas. Esse foco inclui desenvolver munições guiadas de precisão e melhorar a logística de suprimento de munição."
 HOL_defensienota_2022: "Defensienota 2022"
 HOL_defensienota_2022_desc:0 "A Defensienota 2022 delineia investimentos estratégicos e reformas para ampliar as capacidades militares holandesas. Esse plano abrangente se concentra em modernização, aumento dos orçamentos de defesa e melhoria da prontidão operacional em todos os ramos das forças armadas."
 HOL_procure_stinger_missiles:0 "Adquirir Mísseis Stinger"
 HOL_procure_stinger_missiles_desc:0 "Adquirir mísseis Stinger amplia a capacidade do Exército Holandês de se defender de aeronaves e helicópteros de baixa altitude. Esses sistemas de defesa aérea portáteis (MANPADS) oferecem capacidades de defesa aérea flexíveis e móveis."
 HOL_procure_advanced_mortars:0 "Adquirir Morteiros Avançados"
 HOL_procure_advanced_mortars_desc:0 "Investir em morteiros avançados melhora as capacidades de apoio de fogo indireto do Exército Holandês. Esses sistemas oferecem maior alcance, precisão e mobilidade, fornecendo poder de fogo essencial às unidades de infantaria."
 HOL_develop_guide_munitions:0 "Desenvolver Munições Guiadas de Precisão"
 HOL_develop_guide_munitions_desc:0 "Desenvolver munições guiadas de precisão de 155 mm aumenta a precisão e a eficácia da artilharia holandesa. Essas munições avançadas permitem o acerto preciso de alvos, reduzindo danos colaterais e aumentando a eficácia operacional."
 HOL_expand_patriot_systems:0 "Ampliar os Sistemas de Mísseis Patriot"
 HOL_expand_patriot_systems_desc:0 "Ampliar o emprego dos sistemas de mísseis Patriot melhora a capacidade do Exército Holandês de se defender de mísseis balísticos e ameaças aéreas avançadas. Esse foco reforça a segurança nacional e regional ao fornecer uma rede robusta de defesa aérea e antimísseis."
 HOL_expand_command_control_centers:0 "Ampliar os Centros de Comando e Controle"
 HOL_expand_command_control_centers_desc:0 "Ampliar e modernizar os centros de comando e controle aumenta a coordenação operacional e a capacidade de decisão do Exército Holandês. Esse foco inclui atualizar os sistemas de comunicação e integrar tecnologia avançada para garantir o comando eficiente das operações militares."
 HOL_establish_marechaussee_squad:0 "Estabelecer o Esquadrão da Marechaussee"
 HOL_establish_marechaussee_squad_desc:0 "A Marechaussee é uma força especial de polícia militar responsável por fazer cumprir a lei e manter as operações logísticas. Estabelecer essa unidade melhorará muito tanto a eficiência dos suprimentos quanto a supressão em nossas operações militares."
 HOL_modernize_foxtrot:0 "Modernizar os Sistemas de Comunicação Foxtrot"
 HOL_modernize_foxtrot_desc:0 "A modernização dos sistemas de comunicação Foxtrot se concentra em atualizar a infraestrutura de comunicação tática do Exército Holandês. Isso inclui a implementação de enlaces de dados seguros e de alta velocidade, criptografia avançada e maior interoperabilidade com os aliados da OTAN. Ao modernizar esses sistemas, o Exército Holandês garante comunicações confiáveis e seguras em diversos ambientes operacionais."
 HOL_special_forces_helicopter:0 "Helicóptero das Forças de Operações Especiais"
 HOL_special_forces_helicopter_desc:0 "Adquirir helicópteros especializados para as Forças de Operações Especiais (SOF) holandesas aumenta sua mobilidade e eficácia operacional. Esses helicópteros são equipados para inserção e extração rápidas, apoio aéreo aproximado e apoio logístico em ambientes diversos."
 HOL_defense_healthsector:0 "Estabelecer o Instituut Defence & Healthcare"
 HOL_defense_healthsector_desc:0 "O Instituut Samenwerking Defensie en Relatieziekenhuizen (Instituto de Cooperação entre a Defesa e os Hospitais Civis) se concentra em criar uma rede robusta de apoio médico e resposta a crises. Essa colaboração visa aprimorar o atendimento médico do pessoal militar e melhorar a capacidade dos militares de apoiar a infraestrutura médica civil durante emergências."
 HOL_develop_defensity_college:0 "Desenvolver o Defensity College"
 HOL_develop_defensity_college_desc:0 "O Defensity College é uma iniciativa educacional criada para oferecer ao pessoal militar oportunidades de progressão acadêmica e treinamento especializado. Esse foco inclui parcerias com universidades e institutos técnicos para oferecer cursos em diversas áreas, ampliando as habilidades e o conhecimento de soldados e oficiais holandeses."
 HOL_hr_ecosystem: "HR-ecosysteem"
 HOL_hr_ecosystem_desc:0 "A iniciativa HR-Ecosysteem visa aproximar as Forças Armadas Holandesas da sociedade, fomentando uma rede colaborativa de recursos humanos. Esse programa se concentra em criar parcerias com organizações civis, ampliar as oportunidades de carreira do pessoal militar e melhorar o bem-estar geral dos militares. Ao conectar a defesa e a sociedade, o HR-Ecosysteem fortalece o sistema de apoio ao pessoal militar durante e após o serviço."
 HOL_marinestudie: "Marinestudie"
 HOL_marinestudie_desc:0 "A Marinestudie é um estudo abrangente de estratégia naval voltado a avaliar e modernizar a Marinha Real Holandesa. O projeto inclui avaliar as capacidades atuais, as ameaças futuras e os avanços tecnológicos para desenvolver uma estratégia naval de longo prazo. O estudo enfatiza o aumento da prontidão de combate naval, a atualização dos ativos da frota e a integração de novas tecnologias."
 HOL_annual_naval_deployment:0 "Mobilização Naval Anual"
 HOL_annual_naval_deployment_desc:0 "A cada ano, a Marinha Real Holandesa envia navios em viagens de boa vontade de longo alcance, fazendo escala em portos de todo o mundo ocidental. Essas mobilizações projetam a presença holandesa, fortalecem parcerias e aprimoram a habilidade marinheira de alto-mar da frota."
 HOL_naval_diplomacy_voyage:0 "Visita Naval de Boa Vontade Holandesa"
 HOL_world_reaching_navy:0 "Marinha de Alcance Mundial"
 HOL_world_reaching_navy_desc:0 "Os Países Baixos pretendem ampliar suas capacidades navais para operar com eficácia em todo o globo. Esse foco envolve modernizar a frota, ampliar o apoio logístico e fortalecer as parcerias internacionais. Com isso, a Marinha Holandesa busca proteger rotas marítimas vitais, participar de missões globais de manutenção da paz e projetar poder onde for necessário."
 HOL_european_navy:0 "Marinha Europeia"
 HOL_european_navy_desc:0 "Os Países Baixos terão papel de liderança na formação de uma Marinha Europeia, fomentando maior cooperação e integração naval entre os Estados-membros da UE. A iniciativa visa ampliar a segurança marítima coletiva, racionalizar os recursos de defesa e projetar o poder naval europeu no cenário global."
 HOL_expanding_naval_infrastructure:0 "Ampliar a Infraestrutura Naval"
 HOL_expanding_naval_infrastructure_desc:0 "Os Países Baixos estão empenhados em ampliar sua presença naval expandindo sua rede de bases navais. Esse foco envolve o desenvolvimento de novas bases e a modernização das instalações existentes ao longo do litoral holandês e dos territórios ultramarinos. Essas bases ampliadas darão apoio estratégico às operações navais, melhorarão a logística e garantirão capacidade de resposta rápida."
 HOL_f35c_development:0 "Desenvolvimento do F35C"
 HOL_f35c_development_desc:0 "A aquisição das aeronaves F-35C Lightning II dá à Força Aérea Holandesa uma variante capaz de operar em porta-aviões do avançado caça furtivo. Esse foco amplia a capacidade dos Países Baixos de projetar poder aéreo tanto de bases terrestres quanto de porta-aviões, oferecendo versatilidade e eficácia em combate incomparáveis."
 HOL_future_air_defender:0 "Futuro Defensor Aéreo"
 HOL_future_air_defender_desc:0 "O programa Futuro Defensor Aéreo é um esforço colaborativo entre os Países Baixos e a Alemanha para desenvolver capacidades avançadas de defesa aérea naval. A iniciativa se concentra em equipar navios holandeses e alemães com sistemas de radar de última geração, mísseis antiaéreos e tecnologia integrada de comando e controle."
 HOL_multi_ocean_training:0 "Treinamento Multioceânico"
 HOL_multi_ocean_training_desc:0 "Para se preparar para diversos desafios marítimos, a Marinha Holandesa conduzirá extensos exercícios de treinamento em vários oceanos. Esses exercícios melhorarão a interoperabilidade com as marinhas aliadas e aumentarão a prontidão operacional das forças navais holandesas em diversos ambientes."
 HOL_carrier_development:0 "Desenvolvimento de Porta-aviões"
 HOL_carrier_development_desc:0 "Ao desenvolver porta-aviões avançados, os Países Baixos garantirão sua supremacia naval e a proteção das futuras gerações."
 HOL_expand_dutch_naval_influence:0 "Ampliar a Influência Naval Holandesa"
 HOL_expand_dutch_naval_influence_desc:0 "Para se estabelecer plenamente como potência naval global, os Países Baixos devem fomentar alianças navais mais fortes e aumentar sua influência em organizações marítimas internacionais. Isso garantirá que os interesses holandeses estejam representados nas operações e estratégias navais globais."
 HOL_submarine_hunter_initiative:0 "Iniciativa Caçadora de Submarinos"
 HOL_submarine_hunter_initiative_desc:0 "A crescente ameaça representada por submarinos inimigos exige uma nova doutrina voltada à guerra antissubmarino (ASW). Os Países Baixos liderarão o desenvolvimento de tecnologias ASW de ponta, garantindo que as frotas holandesas jamais fiquem à mercê de ameaças submarinas invisíveis."
 HOL_amphibous_technology:0 "Forças Expedicionárias Especializadas"
 HOL_amphibous_technology_desc:0 "Os Países Baixos devem investir na criação de forças expedicionárias navais altamente especializadas, capazes de mobilização rápida para zonas de conflito em todo o globo. Essas forças serão apoiadas por navios de assalto anfíbio e divisões de fuzileiros de elite, permitindo intervenção rápida e decisiva em operações no exterior."
 HOL_return_of_destroyers:0 "O Retorno dos Contratorpedeiros"
 HOL_return_of_destroyers_desc:0 "Ampliar e modernizar a frota de contratorpedeiros é crucial para manter a supremacia naval. Esse foco envolve a construção de novos contratorpedeiros equipados com armamento e sistemas de defesa avançados. Essas embarcações aumentarão as capacidades operacionais da Marinha, oferecendo opções robustas de defesa e ataque em diversos teatros marítimos."
 HOL_thales_investments:0 "Investimentos na Thales"
 HOL_thales_investments_desc:0 "A Thales Nederland, subsidiária do Grupo Thales global, é uma empresa líder em tecnologia de defesa, aeroespacial e segurança nos Países Baixos. Investir na Thales Nederland envolve ampliar sua capacidade de produção, seus esforços de pesquisa e desenvolvimento (P&D) e seu papel nos mercados globais de defesa."
 HOL_special_force_move:0 "Fuzileiros em Vlissingen"
 HOL_special_force_move_desc:0 "A decisão de estabelecer uma presença significativa do Corpo de Fuzileiros em Vlissingen é motivada por vantagens estratégicas e logísticas. A localização de Vlissingen na costa do Mar do Norte oferece acesso direto às rotas marítimas, tornando-a ideal para operações anfíbias e mobilização rápida. A infraestrutura existente da cidade e sua proximidade com rotas de navegação importantes aumentam a prontidão operacional e a flexibilidade do Corpo de Fuzileiros"
 HOL_rijksregiebureau_maritieme_industrie:0 "Rijksregiebureau Maritieme Industrie"
 HOL_rijksregiebureau_maritieme_industrie_desc:0 "A criação do Rijksregiebureau Maritieme Maakindustrie marca um passo significativo rumo à centralização e coordenação da indústria de manufatura marítima nos Países Baixos. Essa agência agilizará os esforços para inovar e ampliar as capacidades de construção naval e engenharia marítima, garantindo que as indústrias marítimas holandesas continuem competitivas e tecnologicamente avançadas."
 HOL_maritiem_masterplan: "Maritiem Masterplan"
 HOL_maritiem_masterplan_desc:0 "O Maritiem Masterplan delineia uma estratégia abrangente para fortalecer o setor marítimo dos Países Baixos. Esse plano inclui investimentos em infraestrutura, pesquisa e desenvolvimento e treinamento da força de trabalho. Ao implementar esse plano diretor, os Países Baixos pretendem garantir sua posição de líder global em inovação e sustentabilidade marítimas."
 HOL_werf_van_de_toekomst: "Werf van de Toekomst"
 HOL_werf_van_de_toekomst_desc:0 "O projeto De Werf van de Toekomst (O Estaleiro do Futuro) visa revolucionar a construção naval nos Países Baixos. Essa iniciativa se concentra em integrar tecnologias avançadas de manufatura, como automação, robótica e impressão 3D, às operações dos estaleiros. O objetivo é criar processos de construção naval mais eficientes, sustentáveis e econômicos."
 HOL_smart_maritime: "Smart Maritime"
 HOL_smart_maritime_desc:0 "A iniciativa Smart Maritime aproveita tecnologias digitais para aumentar a eficiência e o desempenho do setor marítimo holandês. Esse foco inclui a implementação de sistemas inteligentes de navegação, logística e manutenção, bem como o desenvolvimento de embarcações autônomas. Ao abraçar a transformação digital, os Países Baixos pretendem liderar o caminho em soluções inteligentes de transporte marítimo."
 HOL_robotics_navy:0 "Marinha Robótica"
 HOL_robotics_navy_desc:0 "O projeto Robotisering Wind op Zee (Robótica na Energia Eólica Offshore) se concentra em integrar robótica e automação à indústria eólica offshore. A iniciativa visa melhorar a instalação, a manutenção e a operação de turbinas eólicas no mar, tornando o processo mais seguro, eficiente e sustentável. Aproveitando a robótica, os Países Baixos podem ampliar suas capacidades de energia renovável."
 HOL_seabed_protection:0 "Proteger a Infraestrutura do Mar do Norte"
 HOL_seabed_protection_desc:0 "Oleodutos, cabos de energia e dados e parques eólicos offshore agora cobrem o Mar do Norte holandês, e a sabotagem dos gasodutos Nord Stream expôs o quanto são vulneráveis. Um programa dedicado de guerra de leito marinho combina embarcações de levantamento, redes de sonar e sistemas submarinos não tripulados para monitorar e defender essa infraestrutura crítica."
 HOL_nuke_navy: "Nucleaire Voortstuwing van Schepen"
 HOL_nuke_navy_desc:0 "A iniciativa Nucleaire Voortstuwing van Schepen (Propulsão Nuclear para Navios) explora o desenvolvimento e a implementação de sistemas de propulsão nuclear para embarcações navais e comerciais holandesas. Esse foco visa fornecer soluções de propulsão sustentáveis e de longo alcance, reduzindo a dependência de combustíveis fósseis e ampliando as capacidades operacionais da frota holandesa."
 HOL_goalkeeper_modernization:0 "Modernização do Goalkeeper"
 HOL_goalkeeper_modernization_desc:0 "Os Países Baixos estão atualizando seu CIWS (Sistema de Armas de Curto Alcance) Goalkeeper para ampliar suas capacidades de defesa naval. Esse projeto de modernização envolve instalar novos sistemas de radar e rastreamento, melhorar o controle de tiro e integrar tipos avançados de munição. Os sistemas Goalkeeper atualizados aumentarão significativamente a capacidade da Marinha Holandesa de se defender de mísseis em aproximação e ameaças de curto alcance."
 HOL_smartl_radar_construction:0 "Construção do Radar SMART-L"
 HOL_smartl_radar_construction_desc:0 "A construção do sistema de radar SMART-L dará à Marinha Holandesa capacidades de vigilância e rastreamento de longo alcance de última geração. Esse sistema de radar avançado pode detectar e rastrear mísseis balísticos, aeronaves e outras ameaças aéreas a grandes distâncias. Com a implementação do radar SMART-L, os Países Baixos ampliam sua consciência situacional e fortalecem sua defesa aérea e antimísseis em geral."
 HOL_vrouwenklasse_destroyer:0 "Desenvolvimento da Vrouwenklasse"
 HOL_vrouwenklasse_destroyer_desc:0 "Ao introduzir os contratorpedeiros antissubmarino da Vrouwenklasse, os Países Baixos pretendem construir uma frota de fragatas altamente avançadas e versáteis. Esses navios contarão com sistemas de mísseis de ponta, radar superior e robustas capacidades de guerra eletrônica. Os contratorpedeiros da Vrouwenklasse foram projetados para se destacar em operações navais tanto ofensivas quanto defensivas, garantindo que a Marinha Holandesa continue sendo uma força formidável."
 HOL_den_helder_css: "Den Helder CSS"
 HOL_den_helder_css_desc:0 "O projeto Den Helder CSS visa desenvolver um novo navio de apoio de combate para fornecer suporte logístico e operacional à frota holandesa. Esse navio garantirá que as forças navais possam sustentar operações prolongadas ao fornecer combustível, munição e outros recursos essenciais. O Den Helder CSS será um ativo crítico para manter a eficácia operacional da Marinha Holandesa."
 HOL_joint_support_ship:0 "Navio de Apoio Conjunto Karel Doorman"
 HOL_joint_support_ship_desc:0 "Comissionado em 2015, o Zr.Ms. Karel Doorman é um Navio de Apoio Conjunto que combina transporte marítimo, reabastecimento no mar e operações com helicópteros em um único casco. Construído pela Damen Schelde, permite à Marinha Real Holandesa sustentar grupos-tarefa expedicionários e o Corpo de Fuzileiros longe dos portos de origem."
 HOL_amphibious_transport_group:0 "Grupo de Transporte Anfíbio"
 HOL_amphibious_transport_group_desc:0 "Os navios de desembarque doca da classe Rotterdam, liderados pelo Zr.Ms. Johan de Witt, dão ao Korps Mariniers uma capacidade dedicada de assalto anfíbio. Com docas alagáveis, conveses de veículos e conveses de voo, eles desembarcam um batalhão de fuzileiros reforçado e servem como plataformas de comando flutuantes para operações conjuntas."
 HOL_nh90_mlu: "NH90 MLU"
 HOL_nh90_mlu_desc:0 "O projeto NH90 Mid-Life Upgrade visa estender a vida operacional e as capacidades dos helicópteros NH90 usados pela Marinha Holandesa. Essa atualização inclui aviônica avançada, sensores aprimorados e sistemas de armas melhorados. O NH90 MLU garantirá que esses helicópteros versáteis continuem eficazes em guerra antissubmarino, busca e salvamento e missões de transporte."
 HOL_flexible_navy:0 "Operações Navais Flexíveis"
 HOL_flexible_navy_desc:0 "A Marinha Real Holandesa deve ser adaptável ao ambiente marítimo global em rápida mudança. Ao nos concentrarmos em operações navais flexíveis, aumentaremos a capacidade de nossa frota de responder rapidamente a diversas ameaças, da guerra submarina à defesa costeira. Isso permitirá à Marinha Holandesa manter sua presença em diferentes mares e apoiar aliados em operações conjuntas, garantindo a segurança nacional e internacional."
 HOL_submarine_modernization:0 "Programa de Modernização de Submarinos"
 HOL_submarine_modernization_desc:0 "Os Países Baixos estão empreendendo um programa abrangente de modernização de sua frota de submarinos. A iniciativa envolve atualizar os submarinos existentes com a mais recente tecnologia furtiva, sistemas de sonar avançados e armamento aprimorado. A modernização aumentará a capacidade de sobrevivência e a eficácia em combate dos submarinos holandeses em diversos ambientes operacionais."
 HOL_barracuda_submarine:0 "Encomenda Naval do Barracuda"
 HOL_barracuda_submarine_desc:0 "A aquisição de submarinos da classe Barracuda representa um salto significativo nas capacidades de guerra submarina dos Países Baixos. Esses submarinos de propulsão nuclear são equipados com recursos furtivos avançados, capacidade de ataque de longo alcance e sistemas de sonar de ponta. Os submarinos Barracuda darão à Marinha Holandesa capacidades submarinas ofensivas e defensivas incomparáveis."
 HOL_c71_submarine:0 "Desenvolvimento do C71 Holandês"
 HOL_c71_submarine_desc:0 "O projeto do submarino C-71 é um orgulhoso produto da indústria marítima holandesa, refletindo a longa herança naval do país. Esses submarinos são projetados especificamente para defesa costeira e operações especiais, com sistemas de propulsão avançados, alta manobrabilidade e equipamentos de comunicação de última geração. A classe C-71 reforçará significativamente a capacidade da Marinha Holandesa de proteger suas águas territoriais e conduzir missões secretas, garantindo que os Países Baixos continuem liderando a defesa marítima com soluções projetadas no país."
 HOL_submarine_drones:0 "Desenvolvimento de Drones Submarinos"
 HOL_submarine_drones_desc:0 "Abraçando o futuro da guerra naval, os Países Baixos estão investindo em drones submarinos para apoiar suas operações subaquáticas. Esses veículos autônomos e operados remotamente conduzirão missões de vigilância, reconhecimento e remoção de minas. A integração de drones submarinos ampliará as capacidades da frota de submarinos holandesa e proporcionará uma vantagem tática significativa."
 HOL_damen_industry_expansion:0 "Expansão Industrial da Damen"
 HOL_damen_industry_expansion_desc:0 "Em parceria com a Damen Shipyards, os Países Baixos estão expandindo sua indústria de construção naval para atender às crescentes demandas de seus programas de modernização naval. Essa expansão inclui modernizar as instalações de construção naval, investir em pesquisa e desenvolvimento e aumentar a capacidade de produção. A Expansão Industrial da Damen garantirá que os Países Baixos continuem sendo uma nação marítima líder, com tecnologia naval de ponta."
 HOL_legendary_dockyards:0 "Estaleiros Lendários Holandeses"
 HOL_legendary_dockyards_desc:0 "O ressurgimento da arte naval holandesa trará resultados incríveis: maior capacidade de produção de navios, prazos de construção mais curtos e projetos navais mais robustos. Com a revitalização dos estaleiros lendários, os Países Baixos consolidarão seu status de líder na guerra naval moderna."
 HOL_paars: "Paars II"
 HOL_paars_desc:0 "A segunda coalizão Roxa, formada pelo Partido Trabalhista (PvdA), pelo Partido Popular pela Liberdade e Democracia (VVD) e pelos Democratas 66 (D66), continua a governar os Países Baixos. Essa coalizão pretende equilibrar políticas sociais progressistas com liberalismo econômico."
 HOL_threats_against_politicians:0 "Proteger os Políticos"
 HOL_threats_against_politicians_desc:0 "Ameaças recentes contra membros da classe política levantaram preocupações quanto à segurança de nossas instituições democráticas. É imperativo reforçar as medidas de segurança e garantir a proteção de nossos representantes eleitos."
 HOL_royal_wedding:0 "Casamento Real"
 HOL_royal_wedding_desc:0 "O noivado do Príncipe Herdeiro Willem-Alexander com Máxima Zorreguieta gerou polêmica devido ao envolvimento passado do pai dela na ditadura militar argentina. Isso provocou um debate político e público sobre sua presença no casamento, levando por fim a uma decisão do governo e do Parlamento holandeses."
 HOL_un_mission_ehtiopia:0 "Participar da Missão da ONU na Etiópia"
 HOL_un_mission_ehtiopia_desc:0 "As Nações Unidas solicitaram a participação holandesa na missão de manutenção da paz na Etiópia. Aderir a essa missão ampliará nossa posição internacional e contribuirá para a paz e a estabilidade globais"
 HOL_gay:0 "Casamento entre Pessoas do Mesmo Sexo"
 HOL_gay_desc:0 "A legalização do casamento entre pessoas do mesmo sexo marca um marco significativo na luta pela igualdade e pelos direitos humanos. Essa decisão histórica consolidará a posição dos Países Baixos como uma sociedade progressista e inclusiva."
 HOL_vvd:0 "Dijkstal Vence pelo VVD"
 HOL_vvd_desc:0 "O VVD é um partido liberal-conservador que defende o livre mercado, a liberdade individual e a mínima intervenção do governo na economia. Sob a liderança de figuras pragmáticas como Mark Rutte, o VVD enfatiza o crescimento econômico, serviços públicos eficientes, forte segurança nacional e uma abordagem equilibrada da imigração. O partido pretende criar uma economia dinâmica e competitiva, garantindo ao mesmo tempo as liberdades pessoais e a estabilidade social."
 HOL_economic_paper:0 "Reduzir a Papelada Econômica"
 HOL_economic_paper_desc:0 "Para fomentar um ambiente empresarial mais dinâmico e eficiente, o VVD está empenhado em reduzir a papelada econômica desnecessária. Ao cortar a burocracia, daremos poder às empresas para se concentrarem no crescimento e na inovação."
 HOL_vvd_debt_reduction:0 "Redução da Dívida"
 HOL_vvd_debt_reduction_desc:0 "Garantir a estabilidade de longo prazo de nossa economia é fundamental. O VVD pretende reduzir a dívida nacional por meio de uma gestão fiscal prudente e cortes de gastos direcionados, assegurando um futuro próspero para as próximas gerações."
 HOL_economic_stimulation_tax:0 "Imposto de Estímulo Econômico"
 HOL_economic_stimulation_tax_desc:0 "O VVD acredita no poder dos incentivos econômicos para impulsionar o crescimento. Ao introduzir incentivos fiscais para setores-chave, estimularemos o investimento, a inovação e a expansão econômica."
 HOL_startup_innovation_policies:0 "Políticas de Inovação para Startups"
 HOL_startup_innovation_policies_desc:0 "Incentivar o empreendedorismo está no cerne da estratégia econômica do VVD. Ofereceremos isenções fiscais e subsídios a startups inovadoras, criando um vibrante ecossistema empreendedor."
 HOL_vvd_leadership:0 "Referendo de Liderança"
 HOL_vvd_leadership_desc:0 "Em 2006, o VVD enfrentou um desafio interno de liderança entre Mark Rutte e Rita Verdonk. Para resolvê-lo e determinar o rumo futuro do partido, foi realizado um referendo de liderança entre os membros do VVD. O resultado moldaria as políticas e a estratégia do partido, equilibrando o centrismo pragmático de Rutte e as posições linha-dura de Verdonk."
 HOL_mark_rutte: "Mark Rutte"
 HOL_mark_rutte_desc:0 "Mark Rutte, o líder pragmático e centrista do VVD, é conhecido por sua capacidade de construir amplas coalizões e navegar por cenários políticos complexos. Em 2006, ele enfatiza uma abordagem equilibrada de governo, com foco em liberalismo econômico, serviços públicos eficientes e políticas sociais moderadas. Rutte pretende modernizar a infraestrutura holandesa, promover a inovação e garantir uma posição forte para os Países Baixos na União Europeia"
 HOL_consensus_politics:0 "Política de Consenso"
 HOL_consensus_politics_desc:0 "Sob a liderança de Mark Rutte, o VVD se concentrará em construir amplas coalizões e alcançar consenso em todo o espectro político, garantindo estabilidade e governança eficaz."
 HOL_modernize_dutch_infrastructure:0 "Modernizar a Infraestrutura Holandesa"
 HOL_modernize_dutch_infrastructure_desc:0 "Investir em infraestrutura é crucial para o crescimento econômico. O VVD modernizará estradas, ferrovias e redes digitais para ampliar a conectividade e reduzir os congestionamentos."
 HOL_strong_netherlands_europe:0 "Países Baixos Fortes em uma Europa Forte"
 HOL_strong_netherlands_europe_desc:0 "Uma União Europeia forte é essencial para nossa segurança e prosperidade. O VVD defenderá uma cooperação econômica e de segurança mais profunda dentro da UE"
 HOL_nato_norm:0 "Investir para Cumprir a Meta da OTAN"
 HOL_nato_norm_desc:0 "A segurança nacional é inegociável. O VVD se compromete a aumentar os gastos com defesa para atingir a meta de 2% do PIB da OTAN, garantindo que possamos proteger nossa nação e cumprir nossos compromissos de aliança."
 HOL_pragmatic_immigration:0 "Imigração Pragmática"
 HOL_pragmatic_immigration_desc:0 "Equilibrando preocupações de segurança e a necessidade de integração, o VVD de Rutte implementará políticas de imigração pragmáticas que promovam a coesão social e o benefício econômico."
 HOL_teflon_mark:0 "Mark Teflon"
 HOL_teflon_mark_desc:0 "A resiliência de Mark Rutte e sua capacidade de enfrentar desafios políticos são ativos inestimáveis. O VVD aproveitará sua liderança para manter a estabilidade e o progresso."
 HOL_rita_verdonk: "Rita Verdonk"
 HOL_rita_verdonk_desc:0 "Rita Verdonk, figura de destaque no VVD, é conhecida por sua postura linha-dura em imigração e em lei e ordem. Em 2006, ela defende controles rígidos de imigração, medidas robustas de segurança nacional e a preservação da identidade cultural holandesa. A abordagem de Verdonk ressoa com eleitores que buscam políticas firmes de integração e segurança pública, posicionando-a como uma líder forte e decidida dentro do partido."
 HOL_national_identity:0 "Identidade Nacional"
 HOL_national_identity_desc:0 "Preservar a cultura e a identidade holandesas é fundamental. Sob a liderança de Verdonk, o VVD implementará políticas para garantir que nosso patrimônio nacional seja protegido e celebrado."
 HOL_tough_on_immigration:0 "Linha Dura na Imigração"
 HOL_tough_on_immigration_desc:0 "Para proteger nossas fronteiras e manter a ordem social, o VVD adotará uma postura linha-dura em relação à imigração, enfatizando controles rígidos e a redução do fluxo de migrantes."
 HOL_law_and_order:0 "Lei e Ordem"
 HOL_law_and_order_desc:0 "Garantir a segurança pública é um valor central do VVD. Aumentaremos o financiamento para as forças policiais e militares a fim de combater o crime e assegurar a segurança nacional"
 HOL_self_reliance_citizens:0 "Cidadãos Autossuficientes"
 HOL_self_reliance_citizens_desc:0 "Promover a autossuficiência e reduzir a dependência do assistencialismo estatal são metas centrais do VVD. Implementaremos políticas que incentivem a responsabilidade individual e a independência econômica."
 HOL_promote_dutch_sovereignty:0 "Promover a Soberania Holandesa"
 HOL_promote_dutch_sovereignty_desc:0 "O VVD de Verdonk enfatizará a soberania holandesa, reduzindo a influência da UE sobre as políticas nacionais e protegendo nossa independência."
 HOL_iron_rita:0 "Rita de Ferro"
 HOL_iron_rita_desc:0 "A liderança forte e decidida de Rita Verdonk conduzirá o VVD em tempos difíceis, garantindo controle firme e direção clara para o futuro."
 HOL_wilders_vvd: "Geert Wilders"
 HOL_wilders_vvd_desc:0 "Geert Wilders é a voz anti-imigração mais enfática do VVD, canalizando o crescente mal-estar público com a integração e com a integração europeia. Ele empurra o partido para uma linha mais dura em imigração, segurança e soberania nacional, ainda atuando dentro de seu arcabouço liberal."
 HOL_immigration_hardliner:0 "Linha-Dura na Imigração"
 HOL_immigration_hardliner_desc:0 "Wilders exige limites muito mais rígidos para a imigração e o asilo. O VVD endurece os requisitos de entrada e integração, apresentando-se como o partido que protegerá a sociedade holandesa da migração descontrolada."
 HOL_islam_integration_debate:0 "O Debate da Integração"
 HOL_islam_integration_debate_desc:0 "Wilders força um debate nacional sobre o Islã, a integração e os valores holandeses. O partido assume uma posição de confronto, insistindo que os recém-chegados adotem plenamente as normas liberais e culturais do país."
 HOL_eurosceptic_vvd_wing:0 "Ala Eurocética"
 HOL_eurosceptic_vvd_wing_desc:0 "Uma facção em torno de Wilders desconfia de uma integração europeia cada vez mais estreita. O VVD adota uma postura mais crítica em relação a Bruxelas, resistindo a transferências de soberania e questionando novas ampliações."
 HOL_security_first:0 "Segurança em Primeiro Lugar"
 HOL_security_first_desc:0 "Em meio à violência política e ao medo do terrorismo, Wilders pede uma postura de segurança mais dura. O partido amplia os poderes da polícia e do combate ao terrorismo para tranquilizar um público ansioso."
 HOL_wilders_dutch_sovereignty:0 "Soberania Holandesa"
 HOL_wilders_dutch_sovereignty_desc:0 "A ala de Wilders coloca a soberania nacional acima dos compromissos supranacionais. O VVD afirma a primazia da lei e das instituições holandesas, restringindo o alcance de autoridades externas sobre a política interna."
 HOL_wilders_vvd_capstone:0 "A Voz dos Descontentes"
 HOL_wilders_vvd_capstone_desc:0 "Wilders torna-se o campeão inconfundível dos eleitores que se sentem ignorados. Seu apelo populista remodela a imagem do VVD, atando um eleitorado inquieto à nova identidade mais dura do partido."
 HOL_liberal_society:0 "Sociedade Liberal"
 HOL_liberal_society_desc:0 "Promover um modelo econômico liberal é fundamental para a visão do VVD. Defenderemos o livre mercado e a concorrência para impulsionar a inovação e a prosperidade."
 HOL_modernizing_public_services:0 "Modernizar os Serviços Públicos"
 HOL_modernizing_public_services_desc:0 "Modernizar os serviços públicos por meio de infraestrutura digital e processos simplificados é prioridade para o VVD, garantindo eficiência e acessibilidade a todos os cidadãos."
 HOL_commitment_to_security:0 "Compromisso com a Segurança"
 HOL_commitment_to_security_desc:0 "Garantir a segurança de nossa nação é prioridade máxima. O VVD investirá nas forças policiais e militares para proteger nossos cidadãos e defender o Estado de Direito."
 HOL_public_private_partnerships:0 "Parcerias Público-Privadas"
 HOL_public_private_partnerships_desc:0 "O VVD apoia parcerias público-privadas para ampliar o desenvolvimento da infraestrutura e impulsionar o crescimento econômico por meio de esforços colaborativos."
 HOL_increase_cyber_security:0 "Aumentar a Segurança Cibernética"
 HOL_increase_cyber_security_desc:0 "Em um mundo cada vez mais digital, o VVD investirá em medidas de segurança cibernética para proteger a infraestrutura nacional e os ativos digitais contra ameaças cibernéticas."
 HOL_privatize_health_sector:0 "Privatizar o Setor de Saúde"
 HOL_privatize_health_sector_desc:0 "Introduzir mecanismos de mercado no sistema de saúde melhorará a eficiência e reduzirá custos, garantindo uma melhor prestação de serviços para todos."
 HOL_woningbouwimpuls:0 "Desenvolvimento Habitacional"
 HOL_woningbouwimpuls_desc:0 "Enfrentar a escassez de moradias é fundamental. O VVD acelerará a construção de habitações para tornar as casas mais acessíveis e disponíveis."
 HOL_economy_based_education:0 "Educação Baseada na Economia"
 HOL_economy_based_education_desc:0 "Alinhar os programas educacionais às necessidades do mercado garantirá que os estudantes adquiram habilidades muito demandadas, aumentando sua empregabilidade e a economia."
 HOL_innovation_subsidies:0 "Subsídios à Inovação"
 HOL_innovation_subsidies_desc:0 "Conceder subsídios a projetos inovadores fomentará uma cultura de criatividade e avanço tecnológico, impulsionando o crescimento econômico e a competitividade."
 HOL_excellent_schools:0 "Introduzir Escolas de Excelência"
 HOL_excellent_schools_desc:0 "Promover a criação de escolas de excelência elevará os padrões e os resultados educacionais, garantindo que nossas crianças recebam a melhor educação possível"
 HOL_invest_clean_energy:0 "Investir em Energia Limpa"
 HOL_invest_clean_energy_desc:0 "Investir em tecnologias de energia limpa é crucial para reduzir a dependência de combustíveis fósseis e diminuir as emissões de carbono. O VVD apoiará projetos de energia renovável e práticas sustentáveis."
 HOL_decrease_trade_bureaucracy:0 "Reduzir a Burocracia Comercial"
 HOL_decrease_trade_bureaucracy_desc:0 "Reduzir os obstáculos burocráticos no comércio facilitará transações internacionais mais ágeis e tranquilas. O VVD pretende simplificar os processos comerciais para aumentar a eficiência das exportações."
 HOL_mkb_actieplan: "MKB Actieplan"
 HOL_mkb_actieplan_desc:0 "Apoiar as pequenas e médias empresas (PMEs) é vital para o crescimento econômico. O VVD implementará um plano de ação com isenções fiscais, subsídios e redução da carga regulatória para as PMEs."
 HOL_nederland_digitaal: "Nederland Digitaal"
 HOL_nederland_digitaal_desc:0 "O VVD vislumbra um governo e um setor de serviços públicos totalmente digitalizados. Investindo em infraestrutura de TI avançada e em iniciativas de governo eletrônico, aumentaremos a eficiência, a transparência e a acessibilidade para todos os cidadãos."
 HOL_balkenende:0 "Começa a Era Balkenende"
 HOL_balkenende_desc:0 "A liderança de Jan Peter Balkenende enfatiza os valores democrata-cristãos de solidariedade, responsabilidade e zelo. Sua abordagem pragmática de governo busca equilibrar crescimento econômico, justiça social e sustentabilidade ambiental."
 HOL_invest_in_police:0 "Investir na Polícia"
 HOL_invest_in_police_desc:0 "Ampliar a capacidade e as competências da nossa força policial garantirá a segurança pública e o respeito ao Estado de Direito, criando um ambiente seguro para todos os cidadãos."
 HOL_prohibit_soft_drugs:0 "Proibir Drogas Leves"
 HOL_prohibit_soft_drugs_desc:0 "Para proteger a saúde pública e a ordem social, o CDA implementará regras mais rígidas sobre drogas leves, reduzindo sua disponibilidade e atenuando os danos associados."
 HOL_unhcr_migration_office:0 "Escritório de Migração do ACNUR"
 HOL_unhcr_migration_office_desc:0 "Apoiar a criação de um escritório de migração do ACNUR nos Países Baixos aumentará nossa capacidade de lidar com questões de asilo e refúgio de forma eficaz e humana."
 HOL_skilled_immigration:0 "Apenas Imigração Qualificada"
 HOL_skilled_immigration_desc:0 "Focar na imigração qualificada garantirá que os recém-chegados contribuam positivamente para nossa economia e sociedade, atendendo às necessidades do mercado de trabalho e preservando a coesão social."
 HOL_solidarity_healthcare:0 "Saúde Solidária"
 HOL_solidarity_healthcare_desc:0 "O CDA acredita em um sistema de saúde baseado na solidariedade. Garantindo que todos tenham acesso a atendimento de qualidade, buscamos criar uma sociedade mais inclusiva e solidária."
 HOL_living_care:0 "Moradia e Cuidado"
 HOL_living_care_desc:0 "Integrar moradia e instalações de cuidado garantirá que nossos idosos recebam o apoio de que precisam dentro de suas comunidades, promovendo dignidade e bem-estar."
 HOL_family_ministry:0 "Ministério das Famílias"
 HOL_family_ministry_desc:0 "Criar um Ministério das Famílias centralizará os esforços de apoio à vida familiar, garantindo que as políticas de todo o governo estejam alinhadas para promover o bem-estar das famílias."
 HOL_invest_childcare:0 "Investir em Creches"
 HOL_invest_childcare_desc:0 "O acesso a cuidado infantil acessível e de alta qualidade é vital para as famílias que trabalham. O CDA aumentará o financiamento dos serviços de cuidado infantil para apoiar pais e crianças."
 HOL_child_subsidies:0 "Auxílio Infantil"
 HOL_child_subsidies_desc:0 "Oferecer apoio financeiro a famílias com filhos ajudará a aliviar os custos de criar uma família e promoverá o bem-estar de nossos cidadãos mais jovens."
 HOL_nederland_sportland: "Nederland Sportland"
 HOL_nederland_sportland_desc:0 "Promover o esporte e a atividade física é essencial para uma sociedade saudável. O CDA investirá em instalações e programas esportivos para incentivar estilos de vida ativos."
 HOL_invest_in_clean_energy:0 "Investir em Energia Limpa"
 HOL_invest_in_clean_energy_desc:0 "Investir em tecnologias de energia limpa é crucial para um futuro sustentável. O CDA apoiará projetos e iniciativas de energia renovável para reduzir as emissões de carbono."
 HOL_financial_freedom_schools:0 "Liberdade Financeira para as Escolas"
 HOL_financial_freedom_schools_desc:0 "Conceder autonomia financeira às escolas permitirá que atendam melhor às necessidades de seus alunos e inovem na oferta de educação."
 HOL_practical_job_education:0 "Educação Profissional Prática"
 HOL_practical_job_education_desc:0 "Focar na educação profissional prática garantirá que os alunos adquiram as habilidades exigidas pelo mercado de trabalho, reduzindo o desemprego e estimulando o crescimento econômico."
 HOL_business_risk_law:0 "Lei do Risco Empresarial"
 HOL_business_risk_law_desc:0 "Para garantir o bem-estar dos empregados, o CDA implementará uma lei que obriga as empresas a assumir responsabilidade por seus trabalhadores, mesmo em caso de doença. Essa política visa proteger os direitos dos trabalhadores e promover um ambiente de trabalho mais saudável e acolhedor."
 HOL_maatschappelijk_ondernemen: "Maatschappelijk Ondernemen"
 HOL_maatschappelijk_ondernemen_desc:0 "Promover o empreendedorismo socialmente responsável garantirá que as empresas contribuam positivamente para a sociedade, equilibrando lucro com responsabilidades sociais e ambientais."
 HOL_remove_trade_tape:0 "Eliminar a Burocracia Comercial"
 HOL_remove_trade_tape_desc:0 "Reduzir as barreiras burocráticas ao comércio facilitará transações internacionais mais ágeis e eficientes, impulsionando as exportações e o crescimento econômico."
 HOL_diversify_housing:0 "Diversificar a Habitação"
 HOL_diversify_housing_desc:0 "Para enfrentar a escassez de moradias e oferecer opções acessíveis, o CDA investirá em projetos habitacionais diversificados, incluindo habitação social, imóveis de aluguel e casas próprias."
 HOL_balkenende_resigns:0 "Balkenende IV Renuncia"
 HOL_balkenende_resigns_desc:0 "Seguindo o princípio de rotação ministerial do CDA, o primeiro-ministro Jan Peter Balkenende deixou o cargo após dois mandatos. A decisão marca o fim do gabinete Balkenende IV e o início de um novo capítulo para o CDA, garantindo novas perspectivas e lideranças dentro do partido."
 HOL_maxime_verhagen: "Maxime Verhagen"
 HOL_maxime_verhagen_desc:0 "Maxime Verhagen é um diplomata habilidoso e construtor de coalizões, conhecido por sua liderança pragmática. Seu foco em fortalecer alianças internacionais e manter a estabilidade fez dele uma figura respeitada tanto na política holandesa quanto na global."
 HOL_trust_in_people:0 "Confiança nas Pessoas "
 HOL_trust_in_people_desc:0 "Construir confiança em nossos cidadãos é essencial para uma sociedade coesa. O CDA promoverá políticas que empoderem os indivíduos e estimulem o respeito mútuo."
 HOL_trust_in_organizations:0 "Confiança nas Organizações"
 HOL_trust_in_organizations_desc:0 "O CDA aumentará a integridade e a transparência das organizações, garantindo que operem de forma ética e contribuam positivamente para a sociedade."
 HOL_active_society:0 "Sociedade Ativa"
 HOL_active_society_desc:0 "Incentivar a cidadania ativa e o envolvimento comunitário é central na visão do CDA. Apoiaremos iniciativas que estimulem o voluntariado e o engajamento cívico."
 HOL_micro_credit:0 "Permitir Microcrédito"
 HOL_micro_credit_desc:0 "Facilitar o acesso ao microcrédito empoderará pequenos negócios e empreendedores, impulsionando o crescimento econômico e a inovação na base."
 HOL_public_private_innovation:0 "Inovação Público-Privada"
 HOL_public_private_innovation_desc:0 "Promover a colaboração entre os setores privado e público impulsionará a inovação e aumentará a eficiência e a eficácia dos serviços públicos."
 HOL_heavy_efforts_clean_industry:0 "Grandes Esforços em Energia Limpa"
 HOL_heavy_efforts_clean_industry_desc:0 "Intensificar os esforços para promover a energia limpa reduzirá nossa pegada de carbono e garantirá um futuro sustentável para os Países Baixos."
 HOL_invest_bio_agriculture:0 "Investir em Bioagricultura"
 HOL_invest_bio_agriculture_desc:0 "Apoiar iniciativas de bioagricultura promoverá práticas agrícolas sustentáveis, garantindo a saúde de longo prazo do nosso meio ambiente e do nosso abastecimento de alimentos."
 HOL_buma: "Sybrand van Haersma Buma"
 HOL_buma_desc:0 "Após a renúncia de Balkenende, Sybrand van Haersma Buma assume a liderança do CDA, trazendo um foco renovado nos valores tradicionais e na justiça social."
 HOL_reform_justice_system:0 "Reformar o Sistema de Justiça"
 HOL_reform_justice_system_desc:0 "Reformar o sistema de justiça aumentará a equidade, a eficiência e a acessibilidade, garantindo que todos os cidadãos tenham igual acesso à justiça"
 HOL_modern_investments_police:0 "Investimentos Modernos na Polícia"
 HOL_modern_investments_police_desc:0 "Novos investimentos na força policial garantirão a segurança pública e o respeito ao Estado de Direito, criando um ambiente seguro para todos os cidadãos."
 HOL_traditional_values:0 "Valores Tradicionais"
 HOL_traditional_values_desc:0 "O CDA continua comprometido em defender os valores tradicionais, incluindo família, comunidade e responsabilidade social, como alicerce da nossa sociedade."
 HOL_rentmeesterschap: "Rentmeesterschap"
 HOL_rentmeesterschap_desc:0 "Abraçando o princípio do 'rentmeesterschap' (zelo responsável), o CDA promoverá a gestão sustentável dos recursos, garantindo sua preservação para as futuras gerações e estimulando o crescimento econômico."
 HOL_green_economy:0 "Economia Verde"
 HOL_green_economy_desc:0 "A transição para uma economia verde é essencial para o desenvolvimento sustentável. O CDA apoiará iniciativas que promovam tecnologias e práticas ecológicas, equilibrando crescimento econômico e proteção ambiental."
 HOL_reduce_european_influence:0 "Reduzir a Influência Europeia"
 HOL_reduce_european_influence_desc:0 "Para preservar a soberania holandesa e garantir que os interesses nacionais sejam priorizados, o CDA defenderá a redução da influência da União Europeia sobre as políticas internas."
 HOL_fortress_of_values:0 "Fortaleza de Valores"
 HOL_fortress_of_values_desc:0 "Sybrand Buma pretende fortalecer o tecido social e a identidade nacional dos Países Baixos promovendo valores tradicionais e resiliência. Suas políticas focam em construir uma nação unida e segura, enfatizando a proteção da cultura e do patrimônio holandeses. Reforçando os princípios fundamentais do país, Buma busca criar uma sociedade que resista firme a ameaças externas e divisões internas, ao mesmo tempo em que estimula uma cidadania forte e orgulhosa."
 HOL_melkert_surprise:0 "A Vitória Surpresa de Melkert"
 HOL_melkert_surprise_desc:0 "Sob a liderança de Ad Melkert, o PvdA introduziu políticas inesperadas e inovadoras para revitalizar a nação. Essas iniciativas prometem trazer mudanças positivas e lançar as bases de uma sociedade mais inclusiva e próspera."
 HOL_inclusive_society:0 "Sociedade Inclusiva"
 HOL_inclusive_society_desc:0 "Criar uma sociedade inclusiva, na qual todos se sintam valorizados e respeitados, é um princípio central do PvdA. Implementaremos políticas que apoiem a diversidade e promovam a coesão social, garantindo que todos os cidadãos possam participar plenamente da nossa comunidade."
 HOL_democratic_active_government:0 "Governo Democrático e Ativo"
 HOL_democratic_active_government_desc:0 "O PvdA está comprometido em fortalecer as instituições democráticas e promover o engajamento ativo dos cidadãos na política. Garantiremos que o governo seja transparente, responsável e atento às necessidades de todos os cidadãos."
 HOL_strong_european_union:0 "União Europeia Forte"
 HOL_strong_european_union_desc:0 "O PvdA defende uma União Europeia forte, democrática e socialmente responsável. Trabalharemos por uma integração econômica e política mais profunda, promovendo cooperação e solidariedade entre os Estados-membros da UE."
 HOL_accessible_healthcare:0 "Saúde Acessível"
 HOL_accessible_healthcare_desc:0 "Garantir que todos tenham acesso a saúde de alta qualidade é prioridade para o PvdA. Ampliaremos os serviços públicos de saúde, reduziremos os tempos de espera e garantiremos que o atendimento continue acessível para todos."
 HOL_social_security:0 "Seguridade Social para Todos"
 HOL_social_security_desc:0 "Fortalecer o sistema de seguridade social é crucial para proteger os membros mais vulneráveis da sociedade. O PvdA garantirá que os benefícios assistenciais sejam suficientes para atender às necessidades básicas de todos os cidadãos, oferecendo amparo em tempos de necessidade."
 HOL_work_care_for_all:0 "Trabalho e Cuidado para Todos"
 HOL_work_care_for_all_desc:0 "O PvdA garante a todos o acesso a trabalho remunerado e a saúde de qualidade. Apoiaremos políticas que ajudem as pessoas a conciliar trabalho, responsabilidades de cuidado e desenvolvimento pessoal, criando uma sociedade mais solidária e inclusiva."
 HOL_fair_wages:0 "Salários e Benefícios Justos"
 HOL_fair_wages_desc:0 "Garantir salários e benefícios justos a todos os trabalhadores é essencial para reduzir a desigualdade de renda. O PvdA implementará políticas que promovam práticas salariais justas e apoiem a negociação coletiva, assegurando segurança financeira aos mais vulneráveis."
 HOL_job_creation_security:0 "Criação de Empregos e Segurança"
 HOL_job_creation_security_desc:0 "Criar oportunidades de trabalho para todos os cidadãos é essencial. O PvdA investirá em programas de capacitação profissional, apoiará pequenos negócios e garantirá que todos tenham a chance de encontrar um trabalho significativo, promovendo a segurança no emprego e reduzindo o desemprego."
 HOL_quality_education_for_all:0 "Educação de Qualidade para Todos"
 HOL_quality_education_for_all_desc:0 "Investir em educação em todos os níveis é a chave para garantir que cada criança e adulto tenha acesso a oportunidades de aprendizado de qualidade. O PvdA apoiará a formação profissional e as iniciativas de aprendizado ao longo da vida, e garantirá que os programas educacionais atendam às necessidades do mercado de trabalho."
 HOL_sustainable_economic_growth:0 "Crescimento Econômico Sustentável"
 HOL_sustainable_economic_growth_desc:0 "O PvdA foca em um crescimento econômico sustentável que beneficie todos os cidadãos. Investiremos em energia renovável, inovação e tecnologias verdes para construir uma economia resiliente e sustentável para as futuras gerações."
 HOL_invest_childcare_pvda:0 "Investir em Creches Sociais"
 HOL_invest_childcare_pvda_desc:0 "Aumentar o financiamento dos serviços de cuidado infantil é essencial para apoiar pais que trabalham e promover o desenvolvimento na primeira infância. O PvdA garantirá que opções de cuidado infantil acessíveis e de alta qualidade estejam disponíveis para todas as famílias."
 HOL_elderly_care:0 "Cuidado com os Idosos"
 HOL_elderly_care_desc:0 "Oferecer serviços de cuidado abrangentes aos idosos é prioridade para o PvdA. Garantiremos que nossa população idosa receba o apoio de que precisa para viver com dignidade e independência, promovendo o cuidado comunitário e apoiando os cuidadores familiares."
 HOL_child_youth_welfare:0 "Bem-Estar da Criança e do Jovem"
 HOL_child_youth_welfare_desc:0 "Investir em programas que apoiem o bem-estar e o desenvolvimento de crianças e jovens é essencial. O PvdA garantirá acesso a educação, saúde e oportunidades de lazer, promovendo o bem-estar de nossos cidadãos mais jovens."
 HOL_social_tech_revolution:0 "Revolução Tecnológica"
 HOL_social_tech_revolution_desc:0 "Abraçar a revolução tecnológica é crucial para garantir que todos possam participar da sociedade da informação. O PvdA investirá em educação, infraestrutura digital e iniciativas que reduzam a exclusão digital, promovendo a inovação tecnológica e a inclusão."
 HOL_green_urban_development:0 "Desenvolvimento Urbano Verde"
 HOL_green_urban_development_desc:0 "Promover um desenvolvimento urbano sustentável, que combine alta densidade habitacional com alta qualidade de vida, é prioridade para o PvdA. Garantiremos cidades fortes, inclusivas e ecológicas, investindo em infraestrutura verde e espaços públicos."
 HOL_sustainable_agriculture:0 "Agricultura Sustentável"
 HOL_sustainable_agriculture_desc:0 "Apoiar práticas agrícolas sustentáveis é vital para a segurança alimentar e a proteção ambiental. O PvdA promoverá a agricultura orgânica, o uso responsável da terra e a redução da poluição agrícola, garantindo um abastecimento de alimentos saudável e sustentável."
 HOL_renewable_energy_investments:0 "Investimentos em Energia Renovável"
 HOL_renewable_energy_investments_desc:0 "Investir pesadamente em fontes de energia renovável é crucial para reduzir nossa dependência dos combustíveis fósseis e combater a mudança climática. O PvdA apoiará projetos de energia solar, eólica e hidrelétrica para construir um futuro energético sustentável."
 HOL_new_socialist_age:0 "Nova Era da Social-Democracia"
 HOL_new_socialist_age_desc:0 "Para continuar relevante e eficaz, o PvdA passará por uma transformação a fim de atender melhor às necessidades da sociedade moderna. Isso envolve atualizar nossas políticas, dialogar com as novas gerações e adotar abordagens inovadoras de governança."
 HOL_samsom: "Samsom"
 HOL_samsom_desc:0 "Diederik Samsom foi eleito o novo líder do PvdA. Conhecido por sua forte posição ambiental, Samsom pretende conduzir o partido rumo a um futuro mais verde e sustentável, mantendo a justiça social e a inclusão."
 HOL_environmental_vision:0 "Visão Ambiental"
 HOL_environmental_vision_desc:0 "Sob a liderança de Diederik Samsom, o PvdA dará prioridade à sustentabilidade ambiental. Implementaremos políticas abrangentes para proteger nossos recursos naturais e promover um ambiente saudável para as futuras gerações."
 HOL_green_economy_pvda:0 "Economia Verde"
 HOL_green_economy_pvda_desc:0 "Diederik Samsom defende a transição para uma economia verde, promovendo tecnologias ecológicas e práticas sustentáveis. Isso criará empregos, impulsionará a inovação e protegerá o meio ambiente."
 HOL_circular_economy:0 "Economia Circular"
 HOL_circular_economy_desc:0 "Para reduzir o desperdício e promover a sustentabilidade, desenvolveremos uma economia circular que reutiliza, repara e recicla materiais. Essa abordagem garante um ciclo de produção sustentável e minimiza o impacto ambiental."
 HOL_energy_transition:0 "Transição Energética Verde"
 HOL_energy_transition_desc:0 "Acelerar a transição energética é crucial para um futuro sustentável. Eliminaremos gradualmente os combustíveis fósseis, investiremos em energia renovável e apoiaremos inovações em armazenamento e eficiência energética."
 HOL_digital_innovation:0 "Inovação Digital"
 HOL_digital_innovation_desc:0 "Promover a inovação digital é essencial para o crescimento econômico e a modernização. Apoiaremos startups de tecnologia, investiremos em infraestrutura de TI e ampliaremos a alfabetização digital para manter os Países Baixos na vanguarda do avanço tecnológico."
 HOL_social_justice:0 "Justiça Social"
 HOL_social_justice_desc:0 "Garantir a justiça social é central na visão de Diederik Samsom. Enfrentaremos a desigualdade de renda, promoveremos a igualdade de oportunidades e garantiremos que todos os cidadãos possam participar plenamente da sociedade."
 HOL_inclusive_society_pvda:0 "Sociedade Inclusiva"
 HOL_inclusive_society_pvda_desc:0 "Construir uma sociedade inclusiva, na qual todos se sintam valorizados e respeitados, é essencial. Promoveremos políticas que apoiem a diversidade e a inclusão em todos os aspectos da vida."
 HOL_innovation_in_education:0 "Inovação Social na Educação"
 HOL_innovation_in_education_desc:0 "Modernizar a educação para preparar os alunos para o futuro é fundamental. Investiremos em ferramentas de aprendizado digital, educação STEM e formação de professores para garantir um sistema educacional de alta qualidade."
 HOL_affordable_living:0 "Moradia Acessível"
 HOL_affordable_living_desc:0 "Garantir condições de vida acessíveis é uma prioridade. Investiremos em habitação social, regularemos o mercado de aluguéis e ofereceremos subsídios para tornar a moradia acessível a todos."
 HOL_public_health_initiatives:0 "Iniciativas de Saúde Pública"
 HOL_public_health_initiatives_desc:0 "Apoiar iniciativas abrangentes de saúde pública é crucial. Focaremos em cuidados preventivos, saúde mental e na redução das disparidades de saúde, para que todos tenham acesso a atendimento de qualidade."
 HOL_fusion_groenlinks:0 "Unir-se ao GroenLinks"
 HOL_fusion_groenlinks_desc:0 "Chegou a hora de o Partido Trabalhista e o GroenLinks unirem forças sob a liderança de Frans Timmermans. Fundindo nossos valores compartilhados e visões progressistas, podemos criar uma frente unida que defenda a ação climática, a igualdade social e um futuro sustentável para os Países Baixos."
 HOL_asscher: "Asscher"
 HOL_asscher_desc:0 "Lodewijk Asscher foi eleito o novo líder do PvdA. Conhecido por seu foco no mercado de trabalho, na seguridade social e na integração, Asscher pretende conduzir o partido rumo a maior equidade social e resiliência econômica."
 HOL_labour_market_reforms:0 "Reformas do Mercado de Trabalho"
 HOL_labour_market_reforms_desc:0 "Lodewijk Asscher se dedica a criar um mercado de trabalho inclusivo. Apoiaremos programas de capacitação profissional, combateremos a discriminação e garantiremos salários justos para todos os trabalhadores."
 HOL_integration_policies:0 "Políticas de Integração"
 HOL_integration_policies_desc:0 "Promover políticas de integração eficazes é a chave para construir uma sociedade coesa. Asscher apoia iniciativas que facilitem a integração de imigrantes e refugiados à sociedade holandesa."
 HOL_workplace_equality:0 "Igualdade no Local de Trabalho"
 HOL_workplace_equality_desc:0 "Garantir a igualdade no local de trabalho é vital para uma sociedade justa e equitativa. Asscher implementará políticas para prevenir a discriminação e promover a diversidade no ambiente profissional."
 HOL_strengthening_social_security:0 "Fortalecer a Seguridade Social"
 HOL_strengthening_social_security_desc:0 "Garantir um sistema de seguridade social robusto é fundamental. Asscher implementará políticas para proteger os mais vulneráveis e oferecer amparo em tempos de necessidade."
 HOL_child_welfare:0 "Bem-Estar Infantil"
 HOL_child_welfare_desc:0 "Garantir o bem-estar das crianças é uma prioridade máxima. Asscher defende o aumento do financiamento de programas de bem-estar infantil, incluindo educação infantil, saúde e serviços de apoio às famílias."
 HOL_social_innovation:0 "Inovação Social"
 HOL_social_innovation_desc:0 "Promover a inovação social é essencial para enfrentar desafios sociais complexos. Apoiaremos iniciativas que estimulem a colaboração para desenvolver soluções inovadoras."
 HOL_educational_equity:0 "Equidade Educacional"
 HOL_educational_equity_desc:0 "Garantir a equidade educacional para todos os alunos é crucial. Asscher investirá em escolas de áreas desfavorecidas, oferecerá apoio adicional a alunos com dificuldades e promoverá a educação inclusiva."
 HOL_poverty_reduction:0 "Redução da Pobreza"
 HOL_poverty_reduction_desc:0 "Reduzir a pobreza é essencial para uma sociedade justa. Implementaremos programas abrangentes de combate à pobreza, incluindo o aumento dos benefícios de assistência social e apoio direcionado às populações vulneráveis."
 HOL_digital_literacy:0 "Alfabetização Digital"
 HOL_digital_literacy_desc:0 "Melhorar a alfabetização digital é crucial no mundo tecnológico de hoje. Asscher apoia iniciativas para garantir que todos os cidadãos tenham as habilidades necessárias para ter sucesso na economia digital."
 HOL_economic_resilience:0 "Resiliência Econômica"
 HOL_economic_resilience_desc:0 "Construir resiliência econômica é essencial para enfrentar crises futuras. Investiremos em diversos setores econômicos, apoiaremos pequenos negócios e criaremos uma rede de proteção robusta para todos os cidadãos."
 HOL_labour_rights:0 "Direitos Trabalhistas"
 HOL_labour_rights_desc:0 "Asscher é um forte defensor dos direitos trabalhistas. Fortaleceremos as proteções aos trabalhadores, garantiremos condições de trabalho seguras e apoiaremos o direito à negociação coletiva."
 HOL_sustainable_urban_development:0 "Desenvolvimento Urbano Sustentável"
 HOL_sustainable_urban_development_desc:0 "Apoiar o desenvolvimento urbano sustentável é a chave para criar cidades habitáveis. Investiremos em infraestrutura verde, espaços públicos e projetos habitacionais sustentáveis."
 HOL_social_housing:0 "Habitação Social"
 HOL_social_housing_desc:0 "Ampliar a habitação social é crucial para enfrentar a crise habitacional. Asscher investirá na construção e reforma de unidades habitacionais acessíveis para que todos tenham um lugar seguro para morar."
 HOL_bos: "Bos"
 HOL_bos_desc:0 "Wouter Bos foi eleito o novo líder do PvdA. Conhecido por sua experiência econômica e por seu papel durante a crise financeira, Bos pretende conduzir o partido rumo à estabilidade e ao crescimento econômicos, garantindo a justiça social."
 HOL_economic_expertise:0 "Experiência Econômica"
 HOL_economic_expertise_desc:0 "Wouter Bos é renomado por sua experiência econômica. Sob sua liderança, o PvdA focará em implementar políticas econômicas sólidas para garantir estabilidade e promover o crescimento sustentável."
 HOL_crisis_management:0 "Gestão de Crises"
 HOL_crisis_management_desc:0 "A experiência de Wouter Bos na gestão de crises financeiras é inestimável. Implementaremos medidas robustas para garantir que a economia permaneça resiliente diante dos desafios globais."
 HOL_financial_sector_reform:0 "Reforma do Setor Financeiro"
 HOL_financial_sector_reform_desc:0 "Reformas abrangentes no setor financeiro são essenciais para evitar crises futuras e promover transparência e responsabilização. Wouter Bos liderará os esforços para regular o setor financeiro com eficácia."
 HOL_progressive_taxation:0 "Tributação Progressiva"
 HOL_progressive_taxation_desc:0 "Implementar um sistema tributário justo e progressivo é a chave para reduzir a desigualdade e gerar receita para os serviços públicos. O PvdA sob Bos garantirá que os mais ricos paguem a sua parte justa."
 HOL_affordable_housing:0 "Habitação Acessível"
 HOL_affordable_housing_desc:0 "Para enfrentar a crise habitacional, Wouter Bos apoia políticas que ampliem a oferta de moradias acessíveis. Investiremos em projetos de habitação social e ofereceremos subsídios para tornar a casa própria acessível a todos."
 HOL_employment_opportunities:0 "Oportunidades de Emprego"
 HOL_employment_opportunities_desc:0 "Garantir oportunidades de emprego suficientes também é prioridade máxima para Wouter Bos. Somente garantindo o emprego das pessoas poderemos construir uma sociedade estável e em desenvolvimento."
 HOL_universal_healthcare:0 "Saúde Universal"
 HOL_universal_healthcare_desc:0 "Garantir que todos tenham acesso a saúde de alta qualidade é prioridade para Wouter Bos. Ampliaremos os serviços públicos de saúde, reduziremos os tempos de espera e garantiremos que o atendimento continue acessível para todos."
 HOL_fiscal_responsibility:0 "Responsabilidade Fiscal"
 HOL_fiscal_responsibility_desc:0 "Wouter Bos está comprometido em manter um orçamento equilibrado e, ao mesmo tempo, garantir o financiamento adequado dos serviços públicos essenciais. Com responsabilidade fiscal, garantiremos que a economia holandesa permaneça estável e sustentável para as futuras gerações."
 HOL_green_economic_growth:0 "Crescimento Econômico Verde"
 HOL_green_economic_growth_desc:0 "Para garantir prosperidade de longo prazo, Wouter Bos defenderá uma política econômica voltada para o crescimento verde e sustentável. Investiremos em energia limpa, empregos verdes e infraestrutura ecológica para preparar a economia para o futuro e combater a mudança climática."
 HOL_debt_relief_programs:0 "Programas de Alívio da Dívida"
 HOL_debt_relief_programs_desc:0 "Para aliviar o peso financeiro sobre as populações vulneráveis, Wouter Bos implementará programas de alívio da dívida para indivíduos e pequenos negócios. Isso empoderará famílias e empreendedores em dificuldade, fomentando maior mobilidade e estabilidade econômicas."
 HOL_strengthening_eurozone:0 "Fortalecer a Zona do Euro"
 HOL_strengthening_eurozone_desc:0 "Wouter Bos reconhece a importância de uma Zona do Euro forte e resiliente para a estabilidade da economia holandesa. Liderando os esforços para fortalecê-la, promoveremos a coordenação fiscal e a cooperação econômica dentro da UE para garantir prosperidade de longo prazo."
 HOL_small_business_support:0 "Apoio às Pequenas Empresas"
 HOL_small_business_support_desc:0 "Apoiar as pequenas empresas é a chave para uma economia próspera. Wouter Bos implementará políticas que reduzam os impostos para pequenos negócios, ofereçam acesso a crédito e diminuam as barreiras burocráticas, permitindo que cresçam e criem empregos."
 HOL_lpf:0 "A Noite de Pim Fortuyn"
 HOL_lpf_desc:0 "A Lijst Pim Fortuyn (LPF) foi fundada para romper o status quo político. Sob a liderança de Pim Fortuyn, a LPF defende os valores da soberania nacional, da lei e da ordem e de uma sociedade holandesa orgulhosa e autoconfiante. Esse movimento desafiará as elites políticas entrincheiradas e pressionará por reformas ousadas que coloquem os Países Baixos em primeiro lugar."
 HOL_support_sme:0 "Apoio às Pequenas e Médias Empresas"
 HOL_support_sme_desc:0 "As pequenas e médias empresas são a espinha dorsal da economia holandesa. A LPF reduzirá as regulamentações e oferecerá apoio às PMEs, permitindo que prosperem e impulsionem o crescimento econômico."
 HOL_pvv:0 "Wilders Ascende à Arena Política"
 HOL_pvv_desc:0 "O Partido da Liberdade, ou PVV, fundado por Geert Wilders, defende políticas que priorizam a soberania holandesa, a preservação cultural e a segurança. O PVV pretende reduzir a imigração, restaurar o orgulho nacional e desafiar a influência da UE, garantindo que os Países Baixos continuem sendo uma pátria segura e próspera para seus cidadãos. Com foco em combater o extremismo islâmico e proteger os valores tradicionais, o PVV se coloca como voz da identidade e da independência holandesas."
 HOL_restore_royal_authority:0 "Restaurar a Autoridade Real"
 HOL_restore_royal_authority_desc:0 "A monarquia deve reafirmar sua autoridade como espinha dorsal do governo holandês. Consolidando o poder, a Coroa garantirá estabilidade e unidade dentro da nação."
 HOL_establish_stadtholderate:0 "Estabelecer o Stadtholderato"
 HOL_establish_stadtholderate_desc:0 "Um Stadtholderato moderno permitirá uma abordagem equilibrada de governo, garantindo a responsabilização democrática e preservando a influência orientadora da monarquia."
 HOL_restore_royal_privileges:0 "Restaurar os Privilégios Reais"
 HOL_restore_royal_privileges_desc:0 "Restabelecer os privilégios históricos da monarquia para garantir a estabilidade e proteger as tradições e os valores da nação."
 HOL_voc:0 "Reviver o Espírito da VOC"
 HOL_voc_desc:0 "A VOC (Companhia Holandesa das Índias Orientais) foi outrora a força motriz da influência global dos Países Baixos, criando um império de comércio e inovação. Modernizando sua missão, podemos canalizar seu espírito para reafirmar a influência holandesa sobre regiões-chave vitais para o comércio global no século XXI."
 HOL_reclaim_voc_territories:0 "Mobilizar para Retomar as Terras da VOC"
 HOL_reclaim_voc_territories_desc:0 "O tempo das palavras passou. O legado da VOC exige ação, e nossos militares estão preparados para liderar o ataque. Retomando os territórios de nosso passado glorioso, restauraremos a influência holandesa e garantiremos novamente nosso lugar como potência global."
 HOL_asml_tsmc_partnership:0 "Forjar uma Parceria ASML-TSMC"
 HOL_asml_tsmc_partnership_desc:0 "A produção de semicondutores da TSMC e a expertise em litografia da ASML fazem de Taiwan um nexo estratégico da tecnologia. Uma parceria entre a ASML e a TSMC fará dos Países Baixos um ator indispensável na corrida tecnológica global."
 HOL_voc_territory_focus:0 "Focar nos Territórios da VOC Além da Indonésia"
 HOL_voc_territory_focus_desc:0 "Com a VOC restabelecida, devemos decidir se retomamos a Indonésia ou nos concentramos em outros territórios-chave. Focando em regiões como Índia, África do Sul, Taiwan e Sri Lanka, podemos reconstruir a rede global da VOC, afirmando a influência holandesa pelo mundo. A Indonésia pode esperar. Nossa ambição vai muito além de suas costas."
 HOL_wic:0 "Reviver a Companhia das Índias Ocidentais"
 HOL_wic_desc:0 "A Companhia das Índias Ocidentais (WIC) foi outrora a pedra angular da influência holandesa nas Américas e no Atlântico. Reavivando suas operações, podemos reafirmar nosso controle sobre territórios estratégicos, reforçar o comércio e ampliar nosso alcance no Hemisfério Ocidental, restaurando a presença holandesa à sua antiga glória."
 HOL_d66: "D66"
 HOL_d66_desc:0 "O D66 é um farol do progressismo nos Países Baixos, defendendo a democracia, a sustentabilidade e a igualdade social. Nossa visão busca conduzir a nação a um futuro de inovação, inclusão e cooperação, garantindo que todo cidadão tenha voz e participação na construção de um amanhã melhor."
 HOL_d66_democratic_institutions:0 "Fortalecer as Instituições Democráticas"
 HOL_d66_democratic_institutions_desc:0 "O D66 está comprometido em proteger os alicerces da democracia. Aumentando a transparência, a responsabilização e a participação pública, garantiremos que nosso governo continue justo e eficaz no serviço ao seu povo."
 HOL_d66_direct_democracy:0 "Promover a Democracia Direta"
 HOL_d66_direct_democracy_desc:0 "Os cidadãos merecem uma voz mais forte na elaboração das políticas que afetam suas vidas. Defendendo iniciativas como referendos vinculantes e orçamento participativo, o D66 aproximará a tomada de decisões do povo."
 HOL_d66_rule_of_law:0 "Defender o Estado de Direito"
 HOL_d66_rule_of_law_desc:0 "O Estado de Direito é vital para uma sociedade justa e funcional. O D66 se concentrará em garantir a independência judicial, proteger as liberdades civis e combater a corrupção em todos os níveis de governo."
 HOL_d66_climate_action_plan:0 "Implementar um Plano de Ação Climática"
 HOL_d66_climate_action_plan_desc:0 "A crise climática é um dos maiores desafios do nosso tempo. Tomando medidas decisivas, incluindo a redução de emissões e a promoção da energia renovável, o D66 liderará a caminhada rumo a um futuro sustentável."
 HOL_d66_green_energy:0 "Ampliar os Investimentos em Energia Verde"
 HOL_d66_green_energy_desc:0 "A transição para fontes de energia renovável é fundamental para garantir um futuro mais limpo e verde. O D66 priorizará investimentos em projetos eólicos, solares e outros de energia sustentável para reduzir nossa dependência dos combustíveis fósseis."
 HOL_d66_european_initiative:0 "Fortalecer a Cooperação Europeia"
 HOL_d66_european_initiative_desc:0 "O D66 acredita que a União Europeia é essencial para a nossa prosperidade e segurança coletivas. Fortalecer os laços com a UE garantirá que os Países Baixos continuem sendo um membro influente da comunidade europeia."
 HOL_d66_social_progress:0 "Avançar o Progresso Social"
 HOL_d66_social_progress_desc:0 "Igualdade, inclusão e justiça são pilares de uma sociedade progressista. O D66 defenderá políticas para combater a desigualdade, proteger as minorias e promover a igualdade de oportunidades para todos os cidadãos."
 HOL_d66_education_investments:0 "Investir em Educação"
 HOL_d66_education_investments_desc:0 "A educação é a chave para liberar o potencial das futuras gerações. O D66 priorizará o financiamento e as reformas para garantir que toda criança tenha acesso a uma educação de alta qualidade."
 HOL_sgp: "Staatkundig Gereformeerde Partij"
 HOL_sgp_desc:0 "O Staatkundig Gereformeerde Partij (SGP) é um bastião do conservadorismo cristão. Dedicado a um governo sob princípios bíblicos, o SGP defende uma sociedade moral enraizada na fé, na família e na tradição."
 HOL_gl: "GroenLinks"
 HOL_gl_desc:0 "O GroenLinks se dedica a uma sociedade sustentável, justa e inclusiva. Enraizado no ambientalismo e na justiça social, o partido defende a energia verde, a biodiversidade e a igualdade como pilares do futuro dos Países Baixos."
 HOL_asml_high_na_euv:0 "Pioneirismo na Litografia EUV de Alta NA"
 HOL_asml_high_na_euv_desc:0 "Os sistemas TWINSCAN EXE de próxima geração da ASML levam a litografia a uma abertura numérica de 0,55, imprimindo circuitos mais finos do que qualquer rival consegue igualar. Dominar a EUV de Alta NA mantém nossas máquinas indispensáveis para todas as fundições de ponta do planeta."
 HOL_asml_imec_partnership:0 "Abrir o Laboratório Conjunto de Alta NA com a imec"
 HOL_asml_imec_partnership_desc:0 "Em Veldhoven, a ASML e o instituto de pesquisa imec operam um laboratório conjunto de EUV de Alta NA, dando a fabricantes de chips e fornecedores de materiais o primeiro acesso aos novos scanners. O laboratório consolida os Países Baixos como campo de provas dos semicondutores mais avançados do mundo."
 HOL_asml_brainport_campus:0 "Expandir o Brainport Industry Campus"
 HOL_asml_brainport_campus_desc:0 "Respaldada por um compromisso governamental de vários bilhões de euros, a ASML se expande pelo Brainport Industry Campus, perto de Eindhoven, em vez de se mudar para o exterior. Novas salas limpas e instalações de fornecedores ancoram a indústria de chips, e sua arrecadação de impostos, firmemente em solo holandês."
 HOL_support_intervention_iraq:0 "Apoiar a Intervenção no Iraque"
 HOL_support_intervention_iraq_desc:0 "Na esteira dos ataques de 11 de setembro e da crescente instabilidade no Oriente Médio, os Estados Unidos lançaram uma intervenção militar no Iraque, citando a ameaça de armas de destruição em massa e a necessidade de derrubar regimes autoritários. Como aliados próximos na OTAN e defensores da segurança internacional, os Países Baixos devem decidir se apoiam essa operação. Embora a missão continue controversa, aderir à coalizão reafirmaria nossa parceria transatlântica e projetaria a influência holandesa nos esforços globais de segurança."
 HOL_asml_partnership_USA:0 "Formar a Parceria Tecnológica ASML–EUA"
 HOL_asml_partnership_USA_desc:0 "A ASML está no cerne da indústria global de semicondutores, e os Estados Unidos buscam garantir sua vantagem tecnológica na crescente divisão entre Oriente e Ocidente. Formando uma aliança estratégica entre os setores de P&D holandês e americano, podemos liderar a inovação conjunta em litografia avançada, defesa cibernética e manufatura aeroespacial. Essa parceria fortalecerá nossa posição no ecossistema de defesa ocidental, mas pode trazer custos diplomáticos."
 HOL_lng_cooperation:0 "Estabelecer o Acordo Estratégico Shell–GNL"
 HOL_lng_cooperation_desc:0 "Os desafios energéticos do século XXI exigem resiliência, diversificação e alianças estratégicas. Ampliando a cooperação em GNL com a Shell e alinhando nossa logística energética com parceiros-chave, podemos garantir fluxos estáveis de combustível, aumentar o investimento em infraestrutura e reforçar nossas redes globais de suprimento. No entanto, aprofundar a dependência de rotas de combustíveis fósseis pode provocar reações ambientais e políticas."
 HOL_d66_climate_action_planidea:0 "Plano de Ação Climática do D66"
 HOL_d66_climate_action_planidea_desc:0 "Com um compromisso ousado de combater a mudança climática, o Plano de Ação Climática do D66 acelera a transição para a energia renovável, prioriza a sustentabilidade e reduz as emissões, posicionando os Países Baixos como líderes nos esforços ambientais globais."
 HOL_shell1: "Royal Shell"
 HOL_shell1_desc:0 "A Shell, oficialmente conhecida como Royal Dutch Shell, é uma empresa multinacional de petróleo e gás com sede em Haia, nos Países Baixos, e constituída no Reino Unido. Fundada em 1907, a Shell é uma das maiores empresas de energia do mundo, atuando em todos os aspectos da indústria de petróleo e gás, incluindo exploração, produção, refino e distribuição. A empresa também tem interesses significativos em energia renovável e em infraestrutura para veículos elétricos."
 HOL_shell2a: "Royal Green Shell"
 HOL_shell2a_desc:0 "A Shell, gigante global de energia, está cada vez mais focada na transição para um futuro sustentável. A empresa estabeleceu metas ambiciosas para se tornar um negócio de energia com emissões líquidas zero até 2050. A Shell está investindo pesadamente em fontes de energia renovável, incluindo eólica, solar e biocombustíveis, e expandindo sua presença na infraestrutura para veículos elétricos. Por meio de iniciativas como captura e armazenamento de carbono, a Shell pretende reduzir significativamente sua pegada de carbono. Essa mudança rumo a uma energia mais verde faz parte da estratégia mais ampla da Shell para se adaptar à crescente demanda global por soluções energéticas mais limpas e sustentáveis."
 HOL_shell2b: "Royal Shell"
 HOL_shell2b_desc:0 "A Shell, uma das maiores empresas de petróleo e gás do mundo, continua sendo uma força dominante na indústria de combustíveis fósseis. Com uma vasta rede de operações que abrange exploração, extração, refino e distribuição, a Shell desempenha papel crucial no atendimento às necessidades energéticas globais. A empresa possui extensas reservas e infraestrutura dedicadas à produção de petróleo e gás natural, contribuindo significativamente para o consumo global de energia. Apesar dos crescentes investimentos em energia renovável, o negócio principal da Shell continua dependendo fortemente dos combustíveis fósseis, o que a torna uma protagonista no atual panorama energético global."
 HOL_dutch_trade1:0 "Comerciantes Lendários"
 HOL_dutch_trade1_desc:0 "Os comerciantes holandeses têm uma história longa e notável, desempenhando papel central no comércio global desde a Era de Ouro do século XVII. Os Países Baixos, com sua localização estratégica e extensa rede de portos, são há séculos um polo do comércio internacional. Os comerciantes holandeses foram fundamentais para estabelecer rotas comerciais globais, em especial por meio da Companhia Holandesa das Índias Orientais (VOC), uma das primeiras corporações multinacionais do mundo. Hoje, os comerciantes holandeses continuam influentes no mercado global, particularmente em setores como agricultura, logística e finanças. Eles são conhecidos por sua expertise em logística, pela inovação na gestão de cadeias de suprimento e por fortes conexões internacionais, que ajudam a manter a reputação dos Países Baixos como protagonista do comércio global."
 HOL_project_beethoven_state_idea1:0 "Projeto Beethoven"
 HOL_project_beethoven_state_idea1_desc:0 "O Projeto Beethoven é uma importante iniciativa do governo holandês, em colaboração com as autoridades regionais, para investir no fortalecimento do ambiente de negócios e da infraestrutura do setor de microchips na Brainport Eindhoven. O projeto pretende reforçar a competitividade global da região em tecnologia de semicondutores, atendendo a necessidades críticas como desenvolvimento de talentos, melhorias de infraestrutura e habitação. Esse investimento é visto como essencial para manter a posição dos Países Baixos como polo líder da indústria de alta tecnologia, com ênfase específica em reter no país atores-chave como a ASML."
 HOL_randstad_economy1: "Randstad Economie"
 HOL_randstad_economy1_desc:0 "A economia da Randstad refere-se à potência econômica dos Países Baixos, abrangendo a área altamente urbanizada e densamente povoada em torno das cidades de Amsterdã, Roterdã, Haia e Utrecht. Essa região é um dos polos econômicos mais importantes da Europa, contribuindo de forma significativa para a economia holandesa. A Randstad é caracterizada por uma base econômica diversificada, com setores-chave que incluem finanças, logística, tecnologia, indústrias criativas e comércio. Amsterdã é um importante centro financeiro, enquanto Roterdã abriga um dos maiores portos do mundo, crucial para o comércio internacional. A região também se beneficia de uma força de trabalho altamente qualificada, infraestrutura robusta e forte ênfase em inovação e sustentabilidade, tornando-se um motor crítico do crescimento econômico dos Países Baixos."
 HOL_zuidas_development_idea:0 "Desenvolvimento da Zuidas"
 HOL_zuidas_development_idea_desc:0 "O desenvolvimento da Zuidas é um projeto urbano de grande escala em Amsterdã, destinado a criar um distrito empresarial dinâmico e uma área de uso misto que funcione como polo internacional de comércio, finanças e serviços jurídicos. Frequentemente chamada de Milha Financeira dos Países Baixos, a Zuidas abriga inúmeras multinacionais, escritórios de advocacia e instituições financeiras. O projeto foi concebido para ser mais do que um centro de negócios, com extensas áreas residenciais, equipamentos culturais, espaços verdes e infraestrutura de alta qualidade, incluindo excelentes conexões de transporte público."
 HOL_international_peace_city_idea:0 "Haia, Cidade Internacional da Paz e da Justiça"
 HOL_international_peace_city_idea_desc:0 "Haia é reconhecida internacionalmente como a Cidade da Paz e da Justiça, título que reflete seu papel como centro global do direito internacional e da diplomacia. Sede de mais de 200 organizações internacionais, Haia abriga instituições-chave como a Corte Internacional de Justiça, o Tribunal Penal Internacional e a Corte Permanente de Arbitragem. Essas instituições desempenham papel crucial na resolução de disputas internacionais, no julgamento de crimes de guerra e no avanço dos direitos humanos em todo o mundo."
 HOL_regio_economy1: "Economie van de Provinciën"
 HOL_regio_economy1_desc:0 "O poder econômico dos Países Baixos é cada vez mais impulsionado pelas forças de suas regiões. No norte, províncias como Groningen se destacam em energia renovável, enquanto as províncias orientais, como Gelderland, são polos de manufatura avançada e logística. As províncias do sul, incluindo Brabante do Norte, lideram em indústrias de alta tecnologia como semicondutores e biotecnologia. Essa diversidade regional garante uma economia nacional equilibrada e resiliente, com cada área contribuindo de forma significativa para a prosperidade geral e a competitividade global do país."
 HOL_marine_moving:0 "Mudança dos Fuzileiros"
 HOL_marine_moving_desc:0 "O governo holandês decidiu transferir o Korps Mariniers de sua base atual em Doorn para uma nova instalação em Vlissingen. A mudança pretendia dar aos fuzileiros navais uma infraestrutura moderna e aprimorar suas capacidades operacionais. A escolha de Vlissingen, na província da Zelândia, também visava estimular o desenvolvimento econômico regional e oferecer aos fuzileiros uma localização estratégica perto do Mar do Norte. No entanto, o plano de transferência enfrentou resistência devido a preocupações com o impacto sobre o pessoal e suas famílias, além de desafios logísticos e financeiros."
 HOL_marine_moved:0 "Base Moderna dos Fuzileiros"
 HOL_marine_moved_desc:0 "A transferência do Korps Mariniers para sua nova base em Vlissingen foi concluída com sucesso. Os fuzileiros agora operam a partir de instalações de última geração, que aumentam significativamente sua prontidão operacional. A nova localização em Vlissingen oferece vantagens estratégicas, incluindo acesso rápido ao Mar do Norte para operações marítimas. A mudança também contribuiu para o crescimento econômico da Zelândia, gerando empregos e atraindo investimentos para a região. Apesar dos desafios e da resistência iniciais durante a fase de planejamento, a transição foi tranquila e os fuzileiros se adaptaram bem ao novo ambiente."
 HOL_marine_debate:0 "Transferência dos Fuzileiros em Debate"
 HOL_marine_debate_desc:0 "A transferência dos Fuzileiros está sendo debatida no Parlamento, atrasando o processo e gerando incerteza dentro das forças armadas."
 HOL_marine_public_support:0 "Apoio Público à Transferência dos Fuzileiros"
 HOL_marine_public_support_desc:0 "O governo e o público são favoráveis à transferência dos Fuzileiros para Vlissingen, elevando o moral e a eficiência da corporação."
 HOL_marine_relocation_cancelled:0 "Transferência dos Fuzileiros Cancelada"
 HOL_marine_relocation_cancelled_desc:0 "O plano de transferir os Fuzileiros para Vlissingen foi abandonado. A decisão restaura a estabilidade, mas reduz a capacidade operacional dos Fuzileiros."
 HOL_local_communities_support:0 "Apoio das Comunidades Locais à Transferência"
 HOL_local_communities_support_desc:0 "Os investimentos nas comunidades locais em torno de Vlissingen melhoraram o apoio público à transferência dos Fuzileiros, impulsionando o crescimento econômico local e a capacidade de produção."
 HOL_marine1: "Koninklijke Marine"
 HOL_marine1_desc:0 "A Koninklijke Marine, ou Marinha Real Holandesa, é o ramo naval das Forças Armadas Holandesas e uma das marinhas mais antigas do mundo, com origens que remontam ao século XV. Ela desempenha papel crucial na defesa dos Países Baixos, tanto no país quanto no exterior, e também participa de diversas missões internacionais, incluindo operações da OTAN, manutenção da paz e esforços humanitários. A Marinha Real Holandesa é conhecida por sua frota avançada e versátil, que inclui fragatas, submarinos, navios-patrulha e navios anfíbios. A marinha também opera uma série de aeronaves e helicópteros, principalmente para patrulha marítima, transporte e missões de busca e salvamento. O Korps Mariniers, o corpo de fuzileiros de elite dos Países Baixos, é parte integrante da marinha, especializado em operações anfíbias e missões de resposta rápida."
 HOL_submarine_modernization_idea:0 "Modernização dos Submarinos"
 HOL_submarine_modernization_idea_desc:0 "A modernização dos submarinos é uma iniciativa-chave da Marinha Real Holandesa, voltada para a atualização dos envelhecidos submarinos da classe Walrus. Essas melhorias incluem sistemas de sonar avançados, características furtivas aprimoradas e armamento reforçado, garantindo que os submarinos continuem eficazes nas operações navais modernas. A modernização pretende prolongar a vida útil dos submarinos e manter sua relevância estratégica nos esforços globais de segurança marítima."
 HOL_cmp_idea: "Commissariaat Militaire Productie"
 HOL_cmp_idea_desc:0 "O Commissariaat Militaire Productie (CMP), ou Comissariado para a Produção Militar, foi um órgão do governo holandês criado para supervisionar e coordenar a produção de equipamentos e suprimentos militares. Seu papel principal era garantir que as forças de defesa dos Países Baixos estivessem adequadamente equipadas, especialmente em tempos de conflito ou de maior prontidão militar. O CMP era responsável por gerir contratos com as indústrias nacionais, regular a produção de armas, munições, veículos e outras necessidades militares, e assegurar que fossem produzidos dentro dos padrões e prazos exigidos."
 HOL_army2: "Koninklijke Landmacht"
 HOL_army2_desc:0 "A Koninklijke Landmacht, ou Exército Real Holandês, é o ramo terrestre das Forças Armadas Holandesas, com raízes que remontam ao século XVI. Ele é responsável pela defesa do território holandês e contribui para missões internacionais, incluindo operações da OTAN e de manutenção da paz da ONU. O exército está equipado com veículos, artilharia e sistemas de comunicação modernos. O Exército Real Holandês é uma força versátil, pronta para enfrentar uma série de desafios de segurança, tanto no país quanto no exterior."
 HOL_defensienota_idea: "Defensienota 2022"
 HOL_defensienota_idea_desc:0 "A Defensienota 2022 é um documento de política estratégica que delineia a direção futura e as prioridades do Ministério da Defesa holandês. Ele aborda o cenário de segurança global em mudança, enfatizando a necessidade de uma força de defesa mais forte e adaptável. Entre os temas centrais estão o aumento dos gastos com defesa, a modernização das capacidades militares e a ampliação da cooperação internacional, especialmente no âmbito da OTAN e da União Europeia. O documento destaca investimentos em defesa cibernética, inteligência e tecnologia avançada, bem como a ampliação do efetivo e dos níveis de prontidão. A Defensienota 2022 pretende garantir que as Forças Armadas Holandesas estejam preparadas para enfrentar ameaças atuais e emergentes, contribuindo tanto para a segurança nacional quanto para a estabilidade global."
 HOL_air: "Koninklijke Luchtmacht"
 HOL_air_desc:0 "A Koninklijke Luchtmacht, ou Força Aérea Real Holandesa, é o ramo aéreo das Forças Armadas Holandesas, encarregado de defender o espaço aéreo holandês e apoiar operações militares nacionais e internacionais. Criada em 1953, a Força Aérea opera uma frota moderna que inclui caças, aeronaves de transporte, helicópteros e veículos aéreos não tripulados (VANTs). Ela desempenha papel crucial em missões da OTAN, policiamento aéreo e capacidades de desdobramento rápido. A Koninklijke Luchtmacht também participa de ajuda humanitária e resposta a desastres, e contribui para a segurança dos territórios ultramarinos holandeses. Com sua tecnologia avançada e pessoal altamente treinado, a Força Aérea Real Holandesa é um componente-chave da estratégia de defesa do país."
 HOL_dutch_army_doctrine1: "Nederlandse Defensievisie"
 HOL_dutch_army_doctrine1_desc:0 "A Nederlandse Defensievisie é um documento estratégico que delineia a visão e os objetivos de longo prazo do Ministério da Defesa holandês. Ela fornece um arcabouço para o desenvolvimento e a adaptação das Forças Armadas Holandesas diante dos desafios de segurança do futuro. A Defensievisie foca em aprimorar a flexibilidade, a resiliência e as capacidades tecnológicas das forças armadas em resposta a um ambiente de segurança global cada vez mais complexo e imprevisível."
 HOL_dutch_army_doctrine_change:0 "Transição da Nederlandse Defensievisie"
 HOL_dutch_army_doctrine_change_desc:0 "O espírito nacional da Transição da Nederlandse Defensievisie representa uma fase crucial de transformação das Forças Armadas Holandesas. Ele significa um período de modernização e adaptação, com foco no desenvolvimento de novas capacidades, no aprimoramento da defesa cibernética e no fortalecimento da cooperação internacional. Este Espírito Nacional destaca o impulso para aumentar a resiliência e a flexibilidade das forças armadas, preparando-as para os desafios do século XXI. Ele encarna o esforço coletivo para alinhar a defesa holandesa às necessidades de segurança global em evolução, equilibrando tradição e inovação."
 HOL_marechaussee1: "Koninklijke Marechaussee"
 HOL_marechaussee1_desc:0 "A Koninklijke Marechaussee, a Polícia Militar Real Holandesa, desempenha papel crucial na manutenção da segurança nacional e na aplicação da lei. Responsável pelo controle de fronteiras, pela segurança aeroportuária e pelo policiamento militar, a Marechaussee garante a segurança e a estabilidade dos Países Baixos, no país e no exterior. Sua expertise na gestão da segurança interna, da imigração e da ordem pública a torna uma força indispensável na estrutura de defesa holandesa. Como unidade bem treinada e altamente adaptável, ela apoia tanto operações civis quanto militares, contribuindo para a resiliência da nação em tempos de crise."
 HOL_paars1:0 "Fim do Reinado do Governo Roxo"
 HOL_paars1_desc:0 "O legado do gabinete 'Paars II' é de inovação, pragmatismo e governo equilibrado, refletindo o cenário político diverso dos Países Baixos e abrindo precedente para futuros governos de coalizão."
 HOL_dbb:0 "Serviço de Segurança e Proteção"
 HOL_dbb_desc:0 "O Serviço de Segurança e Proteção (Dienst Bewaken en Beveiligen, DBB) é a pedra angular da proteção das figuras mais proeminentes da nação e de seus ativos críticos. Encarregado da proteção de líderes políticos, membros da família real e locais sensíveis, o DBB opera com vigilância e profissionalismo incomparáveis."
 HOL_debt_reduction:0 "Redução da Dívida"
 HOL_debt_reduction_desc:0 "Sob a liderança de Gerrit Zalm, o VVD impulsiona a responsabilidade fiscal por meio de uma redução da dívida direcionada, fortalecendo a economia e garantindo a estabilidade financeira de longo prazo."
 HOL_liberal_society_modifier:0 "Sociedade Liberal"
 HOL_economy_education_research:0 "Reforma Educacional Orientada pelo Mercado"
 HOL_economy_education_research_desc:0 "O VVD se concentra em alinhar os programas educacionais às demandas do mercado para dotar os alunos de habilidades muito procuradas. Preenchendo a lacuna entre educação e mercado de trabalho, aumentamos a empregabilidade e impulsionamos o crescimento econômico, garantindo que as futuras gerações estejam bem preparadas para ter sucesso em um mercado de trabalho em constante evolução."
 HOL_ministry_of_family1:0 "Ministério da Família"
 HOL_ministry_of_family1_desc:0 "O Ministério da Família se dedica a apoiar o bem-estar das famílias em todos os Países Baixos. Ele desenvolve e implementa políticas relacionadas a cuidado infantil, licença parental e serviços de apoio à família, garantindo que as famílias tenham acesso aos recursos de que precisam para prosperar. O ministério trabalha para criar um ambiente acolhedor que favoreça o desenvolvimento saudável e fortaleça os laços familiares."
 HOL_weed_center1:0 "Política Holandesa de Cannabis"
 HOL_weed_center1_desc:0 "Os Países Baixos são conhecidos por sua abordagem singular da cannabis, na qual a posse e a venda em 'coffeeshops' licenciados são toleradas sob regras rígidas. Essa política pragmática visa separar os mercados de drogas leves e pesadas, reduzindo ao mesmo tempo a atividade criminosa. Embora tecnicamente ilegal, a cannabis é, na prática, descriminalizada para uso pessoal, refletindo uma abordagem equilibrada entre saúde pública, segurança e liberdade individual."
 HOL_unhcr1:0 "Supervisão do ACNUR sobre a Migração"
 HOL_unhcr1_desc:0 "O Alto Comissariado das Nações Unidas para Refugiados (ACNUR) agora supervisiona as políticas e os processos migratórios antes geridos pelos Países Baixos. Essa transição pretende garantir que os padrões internacionais de proteção e apoio a refugiados e migrantes sejam respeitados, proporcionando uma abordagem mais coordenada e humana dos desafios migratórios globais."
 HOL_balkenende_legend:0 "Legado de Balkenende"
 HOL_balkenende_legend_desc:0 "A gestão de Jan Peter Balkenende como primeiro-ministro é marcada por sua ênfase na coesão social, na responsabilidade e na estabilidade econômica. Sua visão de uma sociedade de 'normen en waarden' (normas e valores) visava reforçar os alicerces morais e éticos dos Países Baixos. O Legado de Balkenende continua a influenciar a política holandesa, promovendo uma abordagem equilibrada de governo que valoriza tanto a comunidade quanto a responsabilidade individual."
 HOL_green_socialism1:0 "Socialismo Verde"
 HOL_green_socialism1_desc:0 "O PvdA vislumbra um futuro em que justiça social e sustentabilidade ambiental caminham juntas. O Socialismo Verde defende uma sociedade justa e equitativa, que priorize o bem-estar tanto das pessoas quanto do planeta. Por meio de políticas climáticas ambiciosas, investimento em energia renovável e uma transição justa para os trabalhadores, o PvdA pretende criar uma economia sustentável que não deixe ninguém para trás."
 HOL_monarchy_law_blocking:0 "Retaliação do Monarca"
 HOL_monarchy_law_blocking_desc:0 "Indignada com a recusa do governo em aprovar o casamento real, a monarquia tomou a medida extraordinária de bloquear legislações importantes como forma de retaliação. Esse ato de desafio mergulhou o cenário político no caos, com a família real usando sua influência para contestar a autoridade do governo. À medida que as tensões aumentam, essa intervenção sem precedentes provocou um debate nacional sobre o papel e o poder da monarquia na governança moderna."
 HOL_monarch_public_campaign:0 "Onda de Apoio Popular"
 HOL_monarch_public_campaign_desc:0 "Em resposta à recusa do governo em aprovar o casamento real, surgiu uma enorme campanha de pressão pública. Cidadãos de todo o país se mobilizam em apoio ao casal real, organizando manifestações, assinando petições e exigindo que o governo reconsidere sua posição. Essa onda de apoio colocou imensa pressão sobre os líderes políticos, evidenciando a lealdade do povo à monarquia e seu desejo de que o direito de amar e se casar transcenda as fronteiras políticas."
 HOL_monarch_backlash:0 "Desilusão Pública"
 HOL_monarch_backlash_desc:0 "A decisão do casal real de seguir adiante com o casamento apesar da recusa do governo gerou uma onda de descontentamento público. Muitos veem isso como a monarquia extrapolando seus limites e ignorando os processos democráticos. A reação foi rápida, com cidadãos questionando a relevância da monarquia na sociedade moderna. Os pedidos de reforma e até de abolição ganham força à medida que a confiança na família real se desgasta."
 HOL_pro_gay_marriage:0 "Primeiro País a Aprovar o Casamento Gay"
 HOL_pro_gay_marriage_desc:0 "Os Países Baixos tornaram-se líderes globais em progresso social e direitos humanos ao legalizar o casamento entre pessoas do mesmo sexo. Essa medida reforçou a imagem do país como uma sociedade tolerante e inclusiva, impulsionando tanto a unidade nacional quanto o prestígio internacional."
 HOL_anti_gay_marriage:0 "Lei do Casamento Tradicional"
 HOL_anti_gay_marriage_desc:0 "A decisão de manter as leis tradicionais do casamento reflete um forte apego aos valores conservadores. Embora agrade a grupos religiosos e tradicionalistas, ela também provocou críticas de vozes mais progressistas e afetou a reputação do país como farol do liberalismo na Europa."
 HOL_labour_market_reforms_idea:0 "Reformas do Mercado de Trabalho"
 HOL_labour_market_reforms_idea_desc: ""
 HOL_strong_social_security:0 "Seguridade Social Forte"
 HOL_strong_social_security_desc: ""
 HOL_poverty_reduction_idea:0 "Iniciativa de Redução da Pobreza"
 HOL_poverty_reduction_idea_desc:0 "Os Países Baixos lançaram uma iniciativa abrangente para reduzir a pobreza. Por meio de maiores benefícios de assistência social, apoio direcionado às populações vulneráveis e auxílio econômico, o governo trabalha para elevar os membros mais desfavorecidos da sociedade. Este programa foi concebido para criar uma economia mais equitativa e inclusiva."
 HOL_poverty_reduced:0 "Pobreza Significativamente Reduzida"
 HOL_poverty_reduced_desc:0 "Com a implementação bem-sucedida de programas de assistência e reformas sociais, a pobreza nos Países Baixos foi significativamente reduzida. O foco do país na inclusão econômica e no apoio aos desfavorecidos resultou em maior estabilidade social, padrões de vida mais altos e uma economia mais forte e resiliente."
 HOL_digital_literacy_idea:0 "Campanha de Alfabetização Digital"
 HOL_digital_literacy_idea_desc:0 "Os Países Baixos lançaram uma campanha nacional para melhorar a alfabetização digital em todos os setores da sociedade. Ao fornecer aos cidadãos as habilidades necessárias para prosperar na era digital, o governo garante que a força de trabalho esteja preparada para lidar com os avanços tecnológicos, aumentando a produtividade e fomentando a inovação na economia."
 HOL_economic_resilience_idea:0 "Iniciativa de Resiliência Econômica"
 HOL_economic_resilience_idea_desc:0 "O governo holandês implementou políticas abrangentes para fortalecer a resiliência da economia diante de crises globais. Ao diversificar os setores econômicos, apoiar pequenas empresas e garantir uma rede de proteção social robusta, os Países Baixos estão mais bem preparados para enfrentar desafios futuros e manter a estabilidade econômica."
 HOL_financial_sector_idea:0 "Reforma do Setor Financeiro"
 HOL_financial_sector_idea_desc:0 "Reformas abrangentes no setor financeiro são essenciais para evitar crises futuras e promover transparência e responsabilização. Sob a liderança de Wouter Bos, regulamentaremos o setor financeiro de forma eficaz, garantindo estabilidade e confiança no mercado. Essas reformas criarão uma economia mais resiliente, capaz de resistir aos desafios globais e reduzir o risco de colapso econômico."
 HOL_afriforum1HOL:0 "Parceria e Proteção Africâner"
 HOL_afriforum1HOL_desc:0 "Os Países Baixos aprofundaram sua relação com a comunidade africâner da África do Sul, oferecendo apoio econômico e o compromisso de proteger o patrimônio cultural e linguístico africâner. Essa parceria garante acesso a recursos, ao mesmo tempo que simboliza um vínculo renovado, enraizado em uma história compartilhada e no respeito mútuo."
 HOL_afriforum1SAF:0 "Aliança Holandesa-Africâner"
 HOL_afriforum1SAF_desc:0 "A comunidade africâner fortaleceu sua aliança com os Países Baixos, promovendo a preservação cultural, a colaboração econômica e uma rede de apoio. Por meio da influência holandesa, os africâneres ganham um aliado em seus esforços para proteger sua identidade e autonomia econômica na África do Sul."
 HOL_fatherland_education_idea:0 "Educação para a Pátria"
 HOL_fatherland_education_idea_desc:0 "A Educação para a Pátria busca incutir em nossa juventude o senso de orgulho nacional, herança e responsabilidade. Ao enfatizar a história, os valores e a cultura holandeses no currículo, pretendemos fomentar uma cidadania forte e unida, preparada para preservar e defender nossas tradições e nossa identidade nacional."
 HOL_stadtholderate1:0 "Reinado do Stadtholder"
 HOL_stadtholderate1_desc:0 "O Stadtholder holandês lidera uma nova era de governança, equilibrando os princípios da monarquia com as tradições da democracia. Enfatizando o empoderamento local e a reforma constitucional, o Stadtholder busca unir os Países Baixos sob uma visão de liberdade, progresso e liderança forte."
 HOL_monarchy1:0 "Coroa e País Unidos"
 HOL_monarchy1_desc:0 "Os Países Baixos abraçaram sua herança real, com a monarquia como pilar da identidade nacional e da estabilidade. Sob o olhar atento da Coroa, a nação avança, fomentando o orgulho cultural e garantindo um governo forte e centralizado, dedicado à prosperidade de seu povo."
 HOL_voc_semiconductor_control_HOL:0 "Controlando a indústria de semicondutores em §Y[TAI.GetNameWithFlag]§!"
 HOL_voc_semiconductor_control_HOL_desc:0 "Por meio de investimentos estratégicos e parcerias, os Países Baixos obtiveram o controle da cobiçada indústria de semicondutores de Taiwan. Com a tecnologia de litografia de ponta da ASML no centro desse domínio, os holandeses agora detêm as rédeas da produção global de semicondutores, garantindo uma vantagem crítica na era tecnológica moderna."
 HOL_voc_semiconductor_control_TAI:0 "Controle [HOL.GetAdjective] sobre a Indústria de Semicondutores de Taiwan"
 HOL_voc_semiconductor_control_TAI_desc:0 "A indústria de semicondutores de Taiwan, a força vital de sua economia, caiu sob controle [HOL.GetAdjective]. Essa mudança de poder, liderada pela vantagem tecnológica da ASML e pela pressão econômica apoiada pela VOC, ameaça a autonomia de Taiwan sobre sua indústria mais crítica, colocando seu futuro em mãos estrangeiras."
 HOL_sri_dutch_agriculture_benefits:0 "Parceria Agrícola Holandesa"
 HOL_sri_dutch_agriculture_benefits_desc:0 "Por meio da colaboração com os Países Baixos, o Sri Lanka obteve acesso a técnicas e recursos agrícolas modernos, aumentando a produção de alimentos e o crescimento econômico em todo o país."
 HOL_sri_agriculture_collaboration:0 "Colaboração Agrícola com o Sri Lanka"
 HOL_sri_agriculture_collaboration_desc:0 "Ao compartilhar a expertise agrícola holandesa com o Sri Lanka, os Países Baixos garantiram um ponto de apoio vital na região, ampliando sua influência e restabelecendo uma conexão com esse território histórico."
 HOL_voc_indonesian_focus:0 "VOC: Foco na Indonésia"
 HOL_voc_indonesian_focus_desc:0 "A VOC restabelecida mirou a reconquista do domínio na Indonésia, o coração de seu império histórico. Com esforços concentrados na revitalização econômica, no controle estratégico e no fomento da influência local, esse foco visa reafirmar o poder holandês na região e garantir seus valiosos recursos."
 HOL_voc_penalty_operation_extension:0 "Penalidade de Extensão da Operação"
 HOL_voc_penalty_operation_extension_desc:0 "Ao estender nossas operações na Indonésia em vez de declarar guerra, adiamos uma ação decisiva, causando tensão política, redução da estabilidade e ineficiências em nossa indústria."
 HOL_voc_ambassy_expansion_ind:0 "Expandir a Embaixada Holandesa na Indonésia"
 HOL_voc_ambassy_expansion_ind_desc:0 "A expansão da embaixada holandesa na Indonésia é uma jogada estratégica para aprofundar os laços diplomáticos, exercer influência e facilitar operações encobertas. Ao reforçar nossa presença, poderemos nos posicionar melhor para futuros empreendimentos na região."
 HOL_d66_democratic_institutions_idea:0 "Instituições Democráticas Fortalecidas"
 HOL_d66_democratic_institutions_idea_desc:0 "Os esforços para reforçar os processos democráticos aumentaram a confiança pública na governança. Com maior transparência, responsabilização e participação cidadã, os Países Baixos são um modelo de democracia moderna e eficaz."
 HOL_gl_affordable_housing_plan_idea:0 "Iniciativa de Moradia Acessível"
 HOL_gl_affordable_housing_plan_idea_desc:0 "Com investimentos significativos em moradias sustentáveis e acessíveis, os Países Baixos enfrentam a crise habitacional de frente. Essa iniciativa garante que todo cidadão tenha acesso a um lar seguro, protegido e ecológico."
 HOL_gl_international_solidarity_idea:0 "Solidariedade Internacional"
 HOL_gl_international_solidarity_idea_desc:0 "O GroenLinks fomentou fortes parcerias internacionais para enfrentar desafios globais. Ao promover a paz, os direitos humanos e o desenvolvimento sustentável, os Países Baixos são um farol de cooperação e progresso no cenário mundial."
 HOL_gl_transparent_government_idea:0 "Governança Transparente"
 HOL_gl_transparent_government_idea_desc:0 "Com um compromisso inabalável com a responsabilização e a abertura, o GroenLinks garantiu que o governo opere com transparência, capacitando os cidadãos a confiar em seus líderes e a se engajar com eles."
 HOL_gl_diversify_workforce_idea:0 "Força de Trabalho Diversificada"
 HOL_gl_diversify_workforce_idea_desc:0 "Por meio de políticas inclusivas e programas de igualdade de oportunidades, o GroenLinks fomentou uma força de trabalho que reflete a diversidade e a força da sociedade holandesa, garantindo justiça e inovação em todos os setores."
 HOL_gl_fair_trade_idea:0 "Acordo de Coalizão pelo Comércio Justo"
 HOL_gl_fair_trade_idea_desc:0 "Como parte do acordo de coalizão negociado com o GroenLinks, o governo comprometeu-se com um novo marco para o comércio internacional. Impulsionada pela agenda progressista do GroenLinks, a política comercial agora enfatiza a responsabilidade ecológica, os direitos dos trabalhadores e a justiça social acima do mero lucro. Isso marca uma clara mudança dos modelos tradicionais orientados pelo mercado para uma visão econômica baseada em valores."
 HOL_d66_rule_of_law_idea:0 "Defendendo o Estado de Direito"
 HOL_d66_rule_of_law_idea_desc:0 "O D66 garantiu importantes reformas legais como parte do acordo de coalizão, reafirmando a independência do Judiciário, a transparência na governança e a estrita adesão às normas constitucionais. Em tempos de pressão populista e fragmentação política, essas medidas visam proteger as instituições democráticas e o Estado de Direito dentro e fora do país."
 HOL_asml1: "ASML"
 HOL_asml1_desc:0 "A liderança da ASML em litografia coloca os Países Baixos no centro da indústria global de microchips. Esse domínio acelera nossa pesquisa em computação e fabricação de chips, ao mesmo tempo que transforma as exportações de semicondutores em uma fonte constante de receita nacional."
 HOL_caribbean_naval_cooperation:0 "Cooperação Naval Conjunta no Caribe"
 HOL_caribbean_naval_cooperation_desc:0 "O Programa Naval Conjunto do Caribe fortalece nossa marinha, permitindo coordenar treinamento, patrulhas marítimas e estratégias de defesa junto à Marinha Real dos Países Baixos."
 HOL_asml_USA_tech_partnership:0 "Pacto de Integração Tecnológica ASML–EUA"
 HOL_asml_USA_tech_partnership_desc:0 "Os Países Baixos e os Estados Unidos firmaram uma parceria estratégica de alto nível centrada em inovação em semicondutores, defesa cibernética e manufatura de precisão. A empresa holandesa ASML está no centro dessa colaboração, concedendo-nos uma vantagem de ponta em pesquisa e produção industrial. No entanto, a integração mais profunda com a infraestrutura tecnológica americana aumentou nossa dependência da política de exportação dos EUA e prejudicou nossos laços comerciais com potências não alinhadas."
 HOL_shell_lng_deal:0 "Acordo Estratégico de Energia Shell-GNL"
 HOL_shell_lng_deal_desc:0 "Por meio de um pacto energético abrangente com parceiros internacionais, a Shell garantiu aos Países Baixos acesso à infraestrutura de GNL, à produção offshore de combustível e a corredores globais de energia. Isso impulsiona nossa estabilidade econômica e fortalece nossa rede de suprimentos. O investimento contínuo em combustíveis fósseis atrai críticas internas e limita nossa capacidade de inovação de alta tecnologia em outros setores."
 HOL_strengthening_eurozone_idea:0 "Fortalecendo a Zona do Euro"
 HOL_strengthening_eurozone_idea_desc: ""
 HOL_social_democratic_modifier:0 "Sociedade Social e Democrática"
 HOL_economy:0 "Economia Holandesa"
 HOL_economy_desc:0 "Dos guindastes de Roterdã às estufas do Westland e às salas limpas do Brainport, a economia holandesa prospera como uma das grandes encruzilhadas comerciais da Europa. Séculos de comércio, recuperação de terras e inovação incessante forjaram uma potência aberta e voltada à exportação, abrangendo agricultura, logística, energia, finanças e alta tecnologia, onde cada novo empreendimento soma à força do conjunto."
 HOL_cmp: "Commissariaat Militaire Productie"
 HOL_cmp_desc:0 "O Commissariaat Militaire Productie (CMP), ou Comissariado para a Produção Militar, foi um órgão do governo holandês criado para supervisionar e coordenar a produção de equipamentos e suprimentos militares. Sua função principal era garantir que as forças de defesa dos Países Baixos estivessem adequadamente equipadas, especialmente em tempos de conflito ou de maior prontidão militar. O CMP era responsável por gerenciar contratos com as indústrias nacionais, regular a produção de armas, munições, veículos e outras necessidades militares, e garantir que fossem produzidos conforme os padrões e prazos exigidos."
 HOL_noordzee_parken: "Noordzee Energiepark"
 HOL_army: "Koninklijke Landmacht"
 HOL_army_desc:0 "A Koninklijke Landmacht, ou Real Exército dos Países Baixos, é o ramo terrestre das Forças Armadas holandesas, com raízes que remontam ao século XVI. É responsável pela defesa do território holandês e contribui para missões internacionais, incluindo operações da OTAN e de manutenção da paz da ONU. O exército é equipado com veículos modernos, artilharia e sistemas de comunicação. O Real Exército dos Países Baixos é uma força versátil, pronta para enfrentar uma série de desafios de segurança, tanto internos quanto externos."
 HOL_navy: "Koninklijke Marine"
 HOL_navy_desc:0 "A Koninklijke Marine, ou Real Marinha dos Países Baixos, é o ramo naval das Forças Armadas holandesas. Ela protege os interesses marítimos holandeses, projeta poder no exterior e opera em estreita colaboração com frotas aliadas. Este modificador reflete a doutrina, o treinamento e as escolhas de aquisição acumulados ao longo da árvore de focos navais."
 HOL_economy.027.t:0 "O Novo Patrocinador de um Clube do Vilarejo"
 HOL_economy.027.d:0 "Um clube esportivo local apresenta um novo uniforme pago por um produtor de laticínios das redondezas, cujos biodigestores agora funcionam com os resíduos orgânicos da cidade. O município quer marcar a ocasião."
 HOL_economy.027.a:0 "Cofinanciar com recursos municipais"
 HOL_economy.027.b:0 "Manter a iniciativa comunitária"
 HOL_megaproject_category:0 "Megaprojetos Nacionais"
 HOL_megaproject_category_desc:0 "Empreendimentos nacionais de grande escala, da recuperação de terras à infraestrutura emblemática, desbloqueados conforme os Países Baixos perseguem sua grandiosa agenda de desenvolvimento."
 HOL_space_program_category:0 "Programa Espacial Holandês"
 HOL_space_program_category_desc:0 "O esforço espacial nacional, coordenando infraestrutura de lançamento, satélites e ambições tripuladas além da órbita terrestre."
 HOL_future_air_defender_program:0 "Programa Future Air Defender"
 HOL_future_air_defender_program_desc:0 "Um programa naval conjunto para construir a fragata de defesa aérea Future Air Defender. Cada membro conduz a construção como uma missão cronometrada; ao término, os navios concluídos entram diretamente em serviço. Se a Alemanha se retirar, os Países Baixos podem trazer marinhas nórdicas a bordo para compensar o número e recuperar o tempo perdido."
 HOL_FAD_invite_partner:0 "Convidar um Parceiro para o Programa"
 HOL_FAD_invite_partner_desc:0 "Convide uma marinha nórdica para o programa Future Air Defender. Cada parceiro que aderir recebe duas fragatas, acrescenta mais uma à encomenda holandesa e encurta o tempo restante de construção."
 HOL_military.089.a:0 "Autorizar o orçamento adicional."
 HOL_military.089.b:0 "Manter a alocação atual."
 HOL_mars_invested_budget_tt:0 "§GO investimento maior acelera a missão e abre um bônus de pesquisa de construção quando as primeiras amostras de solo forem analisadas.§!"
 HOL_military.090.a:0 "Financiar o patch completo do software."
 HOL_military.090.b:0 "Aceitar a solução alternativa e o atraso."
 HOL_military.091.a:0 "Ampliar o levantamento geológico."
 HOL_military.091.b:0 "Priorizar a montagem do habitat."
 HOL_mars_chromium_found_tt:0 "§GAs equipes de levantamento recuperam depósitos adicionais de cromo do subsolo de Isidis.§!"
 HOL_military.092.a:0 "Reparar a cúpula imediatamente."
 HOL_military.092.b:0 "Selar o segmento e seguir em frente."
 HOL_mars_software_bonus_tt:0 "§GO patch completo do software resolveu a sequência de acoplamento sem problemas. O aço estrutural recuperado será redirecionado para as fundações reforçadas da colônia.§!"
 HOL_military.088.a:0 "Chamá-la de Hollanderhaven."
 HOL_military.088.b:0 "Chamá-la de Brinkerdam."
 HOL_military.088.c:0 "Chamá-la de Brandaanstad."
 HOL_military.088.e:0 "Chamá-la de Brammertdelf."
 HOL_mars_mining_colony_tt:0 "§GOs primeiros poços de extração de Brammertdelf começam a ser escavados, rendendo de imediato um carregamento de matérias-primas da crosta marciana.§!"
 HOL_monarchy.40.t:0 "A Princesa de Orange se Alista"
 HOL_monarchy.40.d:0 "A Princesa Herdeira Catharina-Amalia tornou-se a primeira mulher da Casa de Orange a servir de uniforme, alistando-se como reservista e concluindo seu Treinamento Militar Geral. Seu exemplo provocou um aumento acentuado nas candidaturas às forças armadas."
 HOL_monarchy.40.a:0 "Um dia orgulhoso para a Casa de Orange."
 HOL_monarchy.41.t:0 "Rainha Máxima Junta-se à Reserva"
 HOL_monarchy.41.d:0 "A Rainha Máxima alistou-se como reservista na Real Academia Militar em Breda, seguindo a filha no serviço. Ela declarou que a segurança nacional não pode mais ser tomada como garantida e que deseja contribuir com ela como qualquer outro cidadão."
 HOL_monarchy.41.a:0 "A coroa está ao lado das forças armadas."
 HOL_politics.05.c:0 "Apoiar Rita Verdonk"
 HOL_politics.78.t:0 "Atrito no Gabinete"
 HOL_politics.78.d:0 "Geert Wilders está em choque com a liderança do VVD por causa da imigração. Ele exige uma linha muito mais dura do que seus colegas aceitam, e a briga está se tornando pública."
 HOL_politics.78.a:0 "Apoiar a postura linha-dura de Wilders"
 HOL_politics.78.b:0 "Manter o rumo moderado"
 HOL_politics.79.t:0 "A Turquia às Portas da Europa"
 HOL_politics.79.d:0 "A adesão da Turquia à União Europeia divide o partido. Wilders é ferozmente contrário e alerta que a abertura da liderança afastará os eleitores do VVD."
 HOL_politics.79.a:0 "Opor-se à adesão da Turquia"
 HOL_politics.79.b:0 "Apoiar o alargamento da UE"
 HOL_politics.80.t:0 "Uma Linha na Areia"
 HOL_politics.80.d:0 "Wilders confronta a liderança sobre a posição do partido em relação ao Islã e à integração, insistindo em uma postura intransigente. Sua paciência está visivelmente se esgotando."
 HOL_politics.80.a:0 "Adotar a linha intransigente"
 HOL_politics.80.b:0 "Buscar um tom conciliatório"
 HOL_politics.81.t:0 "Wilders Fica"
 HOL_politics.81.d:0 "Por ora, Geert Wilders permanece no VVD. A liderança fez o suficiente para manter dentro da tenda seu inquieto linha-dura, e uma divisão prejudicial foi evitada."
 HOL_politics.81.a:0 "Uma paz frágil se mantém"
 HOL_voc.1.t:0 "Uma proposta da Companhia Holandesa das Índias Orientais"
 HOL_voc.1.d:0 "Enquanto a Índia mergulha na guerra civil, o governo [HOL.GetAdjectiveCap] e a VOC revivida apresentaram uma oferta surpreendente. Eles propõem uma transferência pacífica de estados indianos para o controle [HOL.GetAdjectiveCap], citando seus laços históricos e promessas de estabilidade e prosperidade sob a administração holandesa. No entanto, alertam que a rejeição dessa oferta forçará os Países Baixos a intervir militarmente, o que pode levar a um conflito mais amplo e ao risco de perder ainda mais território no acordo de paz. A decisão está em suas mãos."
 HOL_voc.1.a:0 "Concordar com a transferência. A estabilidade é fundamental."
 HOL_voc.1.b:0 "Rejeitar a oferta. Preparar-se para a guerra contra os [HOL.GetAdjectiveCap]."
 HOL_voc.2.t:0 "Os [HOL.GetAdjectiveCap] tomam o Gujarat Oriental"
 HOL_voc.2.d:0 "Os [HOL.GetAdjectiveCap] exploraram a instabilidade no Gujarat Oriental e reivindicaram o controle do estado. Propõem cooperação, mas a alternativa é um confronto militar."
 HOL_voc.2.a:0 "Retaliar! Isto é um ato de guerra!"
 HOL_voc.2.b:0 "Recusar-se a agir por ora. Os [HOL.GetAdjectiveCap] podem se exceder."
 HOL_voc.3.t:0 "Os [HOL.GetAdjectiveCap] tomam Bengala Ocidental"
 HOL_voc.3.d:0 "Os [HOL.GetAdjectiveCap] tiraram proveito do caos em Bengala Ocidental e estabeleceram controle sobre o estado. Você aceitará as exigências deles ou se preparará para a guerra?"
 HOL_voc.3.a:0 "Retaliar! Isto é um ato de guerra!"
 HOL_voc.3.b:0 "Recusar-se a agir por ora. Os [HOL.GetAdjectiveCap] podem se exceder."
 HOL_voc.4.t:0 "Os [HOL.GetAdjectiveCap] assumem Querala"
 HOL_voc.4.d:0 "Em meio a uma crescente agitação, os [HOL.GetAdjectiveCap] reivindicaram Querala, citando sua influência histórica na região. A Índia deve decidir se negocia ou retalia."
 HOL_voc.4.a:0 "Retaliar! Isto é um ato de guerra!"
 HOL_voc.4.b:0 "Recusar-se a agir por ora. Os [HOL.GetAdjectiveCap] podem se exceder."
 HOL_voc.5.t:0 "Os [HOL.GetAdjectiveCap] controlam Tâmil Nadu"
 HOL_voc.5.d:0 "Os [HOL.GetAdjectiveCap] aproveitaram a instabilidade em Tâmil Nadu para estender seu controle. Como a Índia responderá a essa agressão descarada?"
 HOL_voc.5.a:0 "Retaliar! Isto é um ato de guerra!"
 HOL_voc.5.b:0 "Recusar-se a agir por ora. Os [HOL.GetAdjectiveCap] podem se exceder."
 HOL_voc.6.t:0 "Pedido holandês para suspender a garantia a Taiwan"
 HOL_voc.6.d:0 "Os Países Baixos nos procuraram com um pedido para suspender nossa garantia de segurança a Taiwan, citando a intenção de obter territórios da ilha. Concordaremos com as exigências deles?"
 HOL_voc.6.a:0 "Suspender a garantia."
 HOL_voc.6.b:0 "Recusar o pedido."
 HOL_voc.6.c:0 "Suspender, mas exigir compensação."
 HOL_voc.7.t:0 "EUA concordam em suspender a garantia a Taiwan"
 HOL_voc.7.d:0 "Os Estados Unidos concordaram em suspender sua garantia de segurança a Taiwan, abrindo caminho para a ação holandesa contra a ilha."
 HOL_voc.7.a:0 "Prosseguir com o ultimato."
 HOL_voc.8.t:0 "EUA se recusam a suspender a garantia a Taiwan"
 HOL_voc.8.d:0 "Os Estados Unidos se recusaram a suspender sua garantia de segurança a Taiwan, complicando os planos holandeses de pressionar a ilha."
 HOL_voc.8.a:0 "Reavaliaremos nossa estratégia."
 HOL_voc.9.t:0 "Ultimato holandês a Taiwan"
 HOL_voc.9.d:0 "Os Países Baixos emitiram um ultimato a Taiwan, exigindo a transferência de [599.GetName] e [1157.GetName]. Como responderemos?"
 HOL_voc.9.a:0 "Aceitar as exigências."
 HOL_voc.9.b:0 "Pedir apoio aos [USA.GetAdjectiveCap]."
 HOL_voc.9.c:0 "Ceder os territórios, mas pedir proteção [HOL.GetAdjective]"
 HOL_voc.10.t:0 "Territórios obtidos de Taiwan"
 HOL_voc.10.d:0 "O governo [TAI.GetAdjectiveCap] aceitou nosso ultimato e transferiu o controle dos territórios exigidos. Isso marca uma vitória significativa para a VOC e os Países Baixos, consolidando nossa influência na região e ampliando nosso alcance na Ásia."
 HOL_voc.10.a:0 "Excelente. O poder da VOC cresce."
 HOL_voc.11.t:0 "Taiwan busca apoio [USA.GetAdjectiveCap]"
 HOL_voc.11.d:0 "Taiwan pediu apoio [USA.GetAdjectiveCap] para resistir às exigências [HOL.GetAdjectiveCap]. Como responderemos?"
 HOL_voc.11.a:0 "Pressionar Taiwan a se submeter."
 HOL_voc.11.b:0 "Apoiar a soberania de Taiwan."
 HOL_voc.12.t:0 "EUA pressionam Taiwan a se submeter"
 HOL_voc.12.d:0 "Sob a pressão [USA.GetAdjectiveCap], Taiwan deve decidir se se submete às exigências holandesas ou resiste e arrisca a guerra."
 HOL_voc.12.a:0 "Submeter-se às exigências [HOL.GetAdjectiveCap]."
 HOL_voc.12.b:0 "Resistir à agressão [HOL.GetAdjectiveCap], sozinho."
 HOL_voc.13.t:0 "Taiwan rejeita nosso ultimato"
 HOL_voc.13.d:0 "Com o apoio dos Estados Unidos, Taiwan rejeitou categoricamente nosso ultimato. Esse desafio apresenta uma escolha crítica: podemos recuar para evitar nova escalada ou seguir em frente, arriscando um conflito aberto com Taiwan e seus aliados."
 HOL_voc.13.a:0 "Retirar o ultimato. Os riscos são altos demais."
 HOL_voc.13.b:0 "Prosseguir com o ultimato. A guerra é inevitável."
 HOL_voc.14.t:0 "Taiwan rejeita nosso ultimato"
 HOL_voc.14.d:0 "Taiwan rejeitou categoricamente nossas exigências, recusando-se a ceder os territórios pedidos. Esse ato de desafio não nos deixa escolha senão declarar guerra e afirmar a autoridade holandesa pela força."
 HOL_voc.14.a:0 "A guerra é a única resposta!"
 HOL_voc.15.t:0 "Taiwan concorda em ceder territórios com proteção"
 HOL_voc.15.d:0 "Numa reviravolta surpreendente, Taiwan concordou em transferir os territórios pedidos aos Países Baixos, mas somente sob a condição de que os holandeses garantam a proteção de Taiwan contra ameaças futuras. Esse arranjo fortalece a influência holandesa na Ásia, mas traz o custo de uma maior responsabilidade na região."
 HOL_voc.15.a:0 "Aceitamos os termos e garantimos Taiwan."
 HOL_voc.16.t:0 "Os Estados Unidos exigem compensação por Taiwan"
 HOL_voc.16.d:0 "Depois de nos permitir tomar o controle dos territórios de Taiwan, os Estados Unidos agora exigem compensação pela proteção suspensa. Argumentam que seus interesses geopolíticos na região foram prejudicados. Podemos concordar em pagar a compensação, garantindo relações estáveis, ou recusar e arriscar um conflito com os americanos."
 HOL_voc.16.a:0 "Pagar a compensação e preservar a estabilidade."
 HOL_voc.16.b:0 "Rejeitar a exigência e preparar-se para a guerra."
 HOL_voc.17.t:0 "Os holandeses oferecem colaboração agrícola"
 HOL_voc.17.d:0 "Os Países Baixos nos procuraram com uma oferta de colaboração para modernizar nosso setor agrícola. Propõem compartilhar conhecimento e recursos holandeses para melhorar a segurança alimentar e a produção econômica no Sri Lanka. No entanto, essa parceria pode vir com condições, aumentando potencialmente a influência holandesa na região."
 HOL_voc.17.a:0 "Aceitar a colaboração. Precisamos da experiência deles."
 HOL_voc.17.b:0 "Recusar. O Sri Lanka deve se manter por conta própria."
 HOL_voc.18.t:0 "Sri Lanka aceita a colaboração agrícola"
 HOL_voc.18.d:0 "O Sri Lanka aceitou nossa oferta de colaborar no desenvolvimento agrícola. Isso marca um novo capítulo nas relações entre holandeses e cingaleses, fortalecendo nossa influência e garantindo benefícios mútuos na região."
 HOL_voc.18.a:0 "Uma parceria promissora!"
 HOL_voc.19.t:0 "Sri Lanka recusa a colaboração agrícola"
 HOL_voc.19.d:0 "O Sri Lanka recusou nossa oferta de colaboração agrícola. A relutância em trabalhar com os Países Baixos pode retardar o desenvolvimento regional e reduzir nossa influência na região."
 HOL_voc.19.a:0 "Lamentável, mas precisamos seguir em frente."
 HOL_voc.20.t:0 "Os holandeses oferecem oportunidades de investimento"
 HOL_voc.20.d:0 "Os Países Baixos propuseram um programa de investimento agrícola para melhorar a economia e a produção de alimentos do Sri Lanka. O programa tem três níveis, pequeno, médio ou pesado, cada um oferecendo benefícios progressivamente maiores, mas exigindo maior comprometimento. Alternativamente, o Sri Lanka pode recusar a oferta por completo."
 HOL_voc.20.a:0 "Aceitar o Programa de Investimento Pequeno."
 HOL_voc.20.b:0 "Aceitar o Programa de Investimento Médio."
 HOL_voc.20.c:0 "Aceitar o Programa de Investimento Pesado."
 HOL_voc.20.e:0 "Recusar a oferta holandesa."
 HOL_voc.21.t:0 "Programa de Investimento Pequeno aceito"
 HOL_voc.21.d:0 "O Sri Lanka aceitou nosso Programa de Investimento Pequeno. Esse passo inicial estabelecerá a influência holandesa e fortalecerá gradualmente o setor agrícola do país."
 HOL_voc.21.a:0 "Um bom começo."
 HOL_voc.22.t:0 "Programa de Investimento Médio aceito"
 HOL_voc.22.d:0 "O Sri Lanka aceitou nosso Programa de Investimento Médio. Esse compromisso mais profundo aumentará significativamente a produção agrícola e ampliará a influência holandesa."
 HOL_voc.22.a:0 "Excelente progresso."
 HOL_voc.23.t:0 "Programa de Investimento Pesado aceito"
 HOL_voc.23.d:0 "O Sri Lanka abraçou nosso Programa de Investimento Pesado, comprometendo-se com uma reformulação transformadora de seu setor agrícola. Isso marca um marco na influência e na colaboração holandesas na região."
 HOL_voc.23.a:0 "Isso trará grandes recompensas."
 HOL_voc.24.t:0 "Sri Lanka recusa a oferta de investimento"
 HOL_voc.24.d:0 "O Sri Lanka recusou nossa oferta de investimento, perdendo a oportunidade de fortalecer seu setor agrícola. No entanto, ainda podemos buscar investimentos unilateralmente para estabelecer nossa influência."
 HOL_voc.24.a:0 "Lamentável, mas encontraremos outro caminho."
 HOL_voc.25.t:0 "Expansão holandesa do Porto de Colombo"
 HOL_voc.25.d:0 "Os Países Baixos fizeram investimentos significativos para expandir e modernizar o Porto de Colombo, além de reforçar sua infraestrutura de segurança. Espera-se que esse desenvolvimento aumente a capacidade econômica e as operações marítimas do Sri Lanka. No entanto, a presença holandesa cresceu consideravelmente, levantando preocupações sobre sua influência sobre um dos ativos mais estratégicos do Sri Lanka."
 HOL_voc.25.a:0 "Isso é ao mesmo tempo uma bênção e um desafio."
 HOL_voc.26.t:0 "Os holandeses exigem direitos exclusivos sobre o Sri Lanka"
 HOL_voc.26.d:0 "Os Países Baixos emitiram um ultimato severo: concedam-lhes direitos exclusivos para governar o Sri Lanka, entregando efetivamente a soberania nacional, ou enfrentem as consequências. Essa decisão moldará o futuro da independência do Sri Lanka."
 HOL_voc.26.a:0 "Não temos escolha senão nos submeter."
 HOL_voc.26.b:0 "Nos recusamos a ceder!"
 HOL_voc.27.t:0 "Sri Lanka recusa as exigências holandesas"
 HOL_voc.27.d:0 "O Sri Lanka rejeitou nosso ultimato, desafiando as exigências holandesas de direitos exclusivos sobre a nação. Isso não nos deixa escolha senão afirmar nosso domínio pela força."
 HOL_voc.27.a:0 "A guerra é inevitável."
 HOL_voc.28.t:0 "Sri Lanka aceita as exigências holandesas"
 HOL_voc.28.d:0 "O Sri Lanka capitulou diante do nosso ultimato, concedendo aos Países Baixos direitos exclusivos para governar a nação. Essa anexação pacífica fortalece a influência holandesa na região e marca uma vitória histórica para a VOC."
 HOL_voc.28.a:0 "O Sri Lanka agora faz parte do legado da VOC."
 HOL_voc.29.t:0 "Ajuda holandesa no combate ao HIV"
 HOL_voc.29.d:0 "Os Países Baixos se apresentaram para ajudar a África do Sul no combate à epidemia de HIV. Com sua avançada experiência e recursos em saúde, os holandeses trouxeram esperança e apoio muito necessários ao nosso povo. Esse gesto de boa vontade não apenas reforçou nossa luta contra a epidemia, como também rendeu ampla admiração pelos holandeses entre a nossa população."
 HOL_voc.29.a:0 "Essa parceria é uma bênção para o nosso povo, mas um risco para o governo"
 HOL_voc.30.t:0 "Os holandeses pedem uma base naval no Cabo"
 HOL_voc.30.d:0 "Os Países Baixos propuseram estabelecer uma base naval no Cabo, citando sua importância estratégica como ponto de reabastecimento para a Ásia. Em troca, os holandeses ofereceram investimentos significativos na infraestrutura portuária da África do Sul, ampliando as capacidades marítimas da nação. Devemos aceitar essa proposta?"
 HOL_voc.30.a:0 "Aceitar a proposta e construir uma parceria."
 HOL_voc.30.b:0 "Recusar a proposta e manter a soberania plena."
 HOL_voc.31.t:0 "África do Sul aceita a proposta de base naval"
 HOL_voc.31.d:0 "A África do Sul concordou em permitir que os Países Baixos estabeleçam uma base naval no Cabo. Esse acordo fortalece o acesso holandês a rotas comerciais críticas e marca um passo significativo na colaboração com a África do Sul."
 HOL_voc.31.a:0 "Uma conquista vital para a VOC!"
 HOL_voc.32.t:0 "África do Sul recusa a proposta de base naval"
 HOL_voc.32.d:0 "A África do Sul recusou nossa proposta de estabelecer uma base naval no Cabo, citando preocupações com soberania e autonomia estratégica. Isso é um revés para as ambições holandesas na região."
 HOL_voc.32.a:0 "Lamentável, mas precisamos persistir."
 HOL_voc.33.t:0 "Os holandeses exigem direitos exclusivos sobre a África do Sul"
 HOL_voc.33.d:0 "Os Países Baixos emitiram um ultimato severo: concedam-lhes direitos exclusivos para governar a África do Sul, entregando efetivamente a soberania nacional, ou enfrentem as consequências. Essa decisão moldará o futuro da independência da África do Sul."
 HOL_voc.33.a:0 "Não temos escolha senão nos submeter."
 HOL_voc.33.b:0 "Nos recusamos a ceder!"
 HOL_voc.34.t:0 "África do Sul recusa as exigências holandesas"
 HOL_voc.34.d:0 "A África do Sul rejeitou nosso ultimato, desafiando as exigências holandesas de direitos exclusivos sobre a nação. Isso não nos deixa escolha senão afirmar nosso domínio pela força."
 HOL_voc.34.a:0 "A guerra é inevitável."
 HOL_voc.35.t:0 "África do Sul aceita as exigências holandesas"
 HOL_voc.35.d:0 "A África do Sul capitulou diante do nosso ultimato, concedendo aos Países Baixos direitos exclusivos para governar a nação. Essa anexação pacífica fortalece a influência holandesa na região e marca uma vitória histórica para a VOC."
 HOL_voc.35.a:0 "A África do Sul agora faz parte do legado da VOC."
 HOL_voc.36.t:0 "O futuro da Indonésia"
 HOL_voc.36.d:0 "Chegou a hora de tomar uma decisão crítica sobre a Indonésia. Devemos declarar guerra e retomar à força nossa histórica Colônia da Coroa, ou estender nossas operações encobertas por mais um ano, aceitando penalidades temporárias porque não podemos usar o mesmo recurso novamente"
 HOL_voc.36.a:0 "Declarar guerra e retomar a Indonésia!"
 HOL_voc.36.b:0 "Adiar as operações por mais um ano."
 HOL_voc.39.t:0 "Países Baixos pedem acesso militar"
 HOL_voc.39.d:0 "Os Países Baixos pediram acesso militar ao território australiano, citando razões estratégicas e a importância da cooperação regional. Devemos aceitar o pedido?"
 HOL_voc.39.a:0 "Conceder acesso militar."
 HOL_voc.39.b:0 "Recusar o pedido."
 HOL_voc.40.t:0 "Acesso militar concedido pela Austrália"
 HOL_voc.40.d:0 "A Austrália concordou em nos conceder acesso militar, marcando um passo significativo para a cooperação regional e a eficiência operacional."
 HOL_voc.40.a:0 "Excelente. Preparar nossas forças."
 HOL_voc.41.t:0 "Acesso militar recusado pela Austrália"
 HOL_voc.41.d:0 "A Austrália recusou nosso pedido de acesso militar, citando preocupações com soberania e estabilidade regional."
 HOL_voc.41.a:0 "Lamentável. Adaptaremos nossa estratégia."
 HOL_voc.42.t:0 "Preparativos para a invasão de Java concluídos"
 HOL_voc.42.d:0 "Nossos preparativos encobertos para a invasão de Java estão concluídos. Aguardamos o resultado dos esforços de contrainteligência indonésios para determinar se nossas tropas continuam sem ser detectadas."
 HOL_voc.42.a:0 "Prosseguir."
 HOL_voc.42.b:0 "Prosseguir."
 HOL_voc.43.t:0 "Forças encobertas detectadas!"
 HOL_voc.43.d:0 "Nossas operações encobertas foram descobertas pelas forças indonésias, reduzindo pela metade a eficácia de nossas tropas e diminuindo sua capacidade operacional."
 HOL_voc.43.a:0 "Um grande revés."
 HOL_voc.44.t:0 "Forças encobertas não detectadas"
 HOL_voc.44.d:0 "Nossos preparativos encobertos passaram despercebidos, e nossas tropas permanecem com força total, prontas para estabelecer uma cabeça de ponte em Java."
 HOL_voc.44.a:0 "Excelente!"
 HOL_voc.45.t:0 "Pedido holandês para comprar a Austrália Ocidental"
 HOL_voc.45.d:0 "Os Países Baixos fizeram um pedido formal para comprar a Austrália Ocidental, citando sua importância estratégica para suas ambições globais. Em troca, oferecem compensação militar ou industrial à Austrália. Como devemos responder?"
 HOL_voc.45.a:0 "Aceitar com compensação militar."
 HOL_voc.45.b:0 "Aceitar com compensação industrial."
 HOL_voc.45.c:0 "Recusar a oferta."
 HOL_voc.46.t:0 "Austrália aceita a proposta"
 HOL_voc.46.d:0 "A Austrália concordou em vender a Austrália Ocidental aos Países Baixos. Dependendo da escolha deles, forneceremos a compensação prometida para manter laços diplomáticos fortes."
 HOL_voc.46.a:0 "Prosseguir com o acordo."
 HOL_voc.47.t:0 "Austrália recusa a proposta"
 HOL_voc.47.d:0 "A Austrália rejeitou nossa oferta de compra da Austrália Ocidental. Embora decepcionante, devemos ajustar nossa estratégia de acordo."
 HOL_voc.47.a:0 "Lamentável, mas seguiremos em frente."
 HOL_voc.51.t:0 "Ultimato holandês a Malaca"
 HOL_voc.51.d:0 "Os Países Baixos emitiram um ultimato, exigindo a rendição imediata de Malaca. Devemos aceitar os termos e evitar o conflito, ou recusar e nos preparar para a guerra?"
 HOL_voc.51.a:0 "Aceitar os termos."
 HOL_voc.51.b:0 "Recusar e manter nossa posição."
 HOL_voc.52.t:0 "Malaca aceita o ultimato holandês"
 HOL_voc.52.d:0 "Malaca capitulou diante de nossas exigências, entregando seu território aos Países Baixos sem resistência. Isso marca uma vitória significativa para as ambições holandesas na região."
 HOL_voc.52.a:0 "Integrar Malaca ao domínio holandês."
 HOL_voc.53.t:0 "Malaca recusa o ultimato holandês"
 HOL_voc.53.d:0 "Malaca rejeitou nosso ultimato, desafiando as exigências holandesas de rendição. Isso não nos deixa escolha senão nos preparar para a guerra e fazer valer nossas reivindicações."
 HOL_voc.53.a:0 "Tomaremos Malaca pela força."
 HOL_voc.54.t:0 "Ultimato holandês a §Y[SIN.GetNameWithFlag]§!"
 HOL_voc.54.d:0 "Os Países Baixos emitiram um ultimato, exigindo a rendição imediata de Singapura. Devemos aceitar os termos ou nos preparar para a guerra?"
 HOL_voc.54.a:0 "Aceitar os termos."
 HOL_voc.54.b:0 "Recusar e manter nossa posição."
 HOL_voc.55.t:0 "§Y[SIN.GetNameWithFlag]§! aceita o ultimato holandês"
 HOL_voc.55.d:0 "§Y[SIN.GetNameWithFlag]§! capitulou diante de nossas exigências, entregando seu território sem resistência. Isso marca uma vitória significativa para as ambições holandesas."
 HOL_voc.55.a:0 "Integrar §Y[SIN.GetNameWithFlag]§! ao nosso domínio."
 HOL_voc.56.t:0 "§Y[SIN.GetNameWithFlag]§! recusa o ultimato holandês"
 HOL_voc.56.d:0 "§Y[SIN.GetNameWithFlag]§! rejeitou nosso ultimato, desafiando as exigências holandesas. Isso não nos deixa escolha senão nos preparar para a guerra."
 HOL_voc.56.a:0 "Tomaremos Singapura pela força."
 HOL_voc.57.t:0 "Ultimato holandês a §Y[BRU.GetNameWithFlag]§!"
 HOL_voc.57.d:0 "§Y[HOL.GetNameWithFlag]§! emitiu um ultimato, exigindo a rendição imediata de Brunei. Devemos aceitar os termos ou nos preparar para a guerra?"
 HOL_voc.57.a:0 "Aceitar os termos."
 HOL_voc.57.b:0 "Recusar e manter nossa posição."
 HOL_voc.58.t:0 "§Y[BRU.GetNameWithFlag]§! aceita o ultimato holandês"
 HOL_voc.58.d:0 "§Y[BRU.GetNameWithFlag]§! capitulou diante de nossas exigências, entregando seu território sem resistência. Isso marca uma vitória significativa para as ambições holandesas."
 HOL_voc.58.a:0 "Integrar §Y[BRU.GetNameWithFlag]§! ao nosso domínio."
 HOL_voc.59.t:0 "§Y[BRU.GetNameWithFlag]§! recusa o ultimato holandês"
 HOL_voc.59.d:0 "§Y[BRU.GetNameWithFlag]§! rejeitou nosso ultimato, desafiando as exigências holandesas. Isso não nos deixa escolha senão nos preparar para a guerra."
 HOL_voc.59.a:0 "Tomaremos §Y[BRU.GetNameWithFlag]§! pela força."
 HOL_voc.60.t:0 "Preparativos holandeses para a guerra detectados"
 HOL_voc.60.d:0 "Relatórios de inteligência confirmam que os Países Baixos estão mobilizando suas forças para retomar territórios que consideram parte de seu legado histórico. Medidas imediatas devem ser tomadas para nos preparar contra a agressão deles."
 HOL_voc.60.a:0 "Preparar-se para a ameaça holandesa."
 HOL_voc.61.t:0 "Escalada dos preparativos defensivos"
 HOL_voc.61.d:0 "Os Países Baixos intensificaram seus preparativos militares, aumentando a probabilidade de uma invasão. Para enfrentar essa ameaça, devemos nos coordenar com outras nações em risco e formar acordos de defesa mútua. Isso nos permitirá convocar uns aos outros como aliados em caso de ataque holandês."
 HOL_voc.61.a:0 "Fortalecer nossas defesas e coordenar alianças."
 HOL_voc.62.t:0 "Pedir ajuda contra a agressão holandesa"
 HOL_voc.62.d:0 "Os Países Baixos lançaram um ataque contra nós, ameaçando nossa soberania. Podemos convocar nossos aliados a honrar seus compromissos e se juntar à luta para repelir a invasão holandesa."
 HOL_voc.62.a:0 "Convocar nossos aliados para ajudar."
 HOL_voc.62.b:0 "Enfrentaremos os holandeses sozinhos."
 HOL_voc.63.t:0 "[ROOT.GetNameWithFlag] pede assistência"
 HOL_voc.63.d:0 "§Y[ROOT.GetNameWithFlag]§! foi atacado pelos §R[HOL.GetNameWithFlag]§! e pede nossa ajuda para repelir a invasão. Honraremos nosso compromisso e nos juntaremos à luta?"
 HOL_voc.63.a:0 "Entrar na guerra e ajudar nosso aliado."
 HOL_voc.63.b:0 "Recusar-se a intervir."
 HOL_voc.64.t:0 "Proposta holandesa: Corredor Comercial Trans-Australiano"
 HOL_voc.64.d:0 "O governo holandês propôs formalmente a construção de um corredor comercial e de infraestrutura ligando a Austrália Ocidental sob administração holandesa às regiões orientais do continente australiano. O plano inclui o desenvolvimento de polos logísticos, redes ferroviárias e rodoviárias e o estabelecimento de zonas econômicas administradas pelos holandeses. Embora o corredor prometa benefícios econômicos de longo prazo, ele levanta questões sobre soberania, governança e o equilíbrio de influência em todo o continente."
 HOL_voc.64.a:0 "Aprovar o corredor: o desenvolvimento econômico vem primeiro"
 HOL_voc.64.b:0 "Rejeitar o plano: não podemos ceder terreno estratégico"
 HOL_voc.65.t:0 "Austrália aceita a proposta do corredor comercial"
 HOL_voc.65.d:0 "O governo australiano aprovou nossa proposta de construir um corredor comercial transcontinental ligando a Austrália Ocidental holandesa aos polos industriais e populacionais do leste. Em breve começarão as obras de infraestrutura compartilhada, zonas econômicas e polos logísticos. Isso marca um passo histórico rumo à integração econômica regional e à influência estratégica holandesa no Indo-Pacífico."
 HOL_voc.65.a:0 "Um corredor digno do legado da VOC."
 HOL_voc.66.t:0 "Austrália rejeita a proposta do corredor comercial"
 HOL_voc.66.d:0 "O governo australiano recusou nossa oferta de construir em conjunto um corredor comercial transcontinental através de seu território. Preocupações com soberania estratégica e influência estrangeira foram citadas como principais razões. Embora a proposta beneficiasse economicamente ambas as partes, as preocupações políticas internas prevaleceram, por ora."
 HOL_voc.66.a:0 "Um revés. Não o fim."
 HOL_voc.67.t:0 "Os Países Baixos apoiam a autonomia africâner"
 HOL_voc.67.d:0 "Numa medida que certamente provocará tensões internas, o governo holandês emitiu uma declaração formal apoiando a autonomia cultural e econômica da comunidade africâner na África do Sul. Instituições holandesas anunciaram laços mais estreitos com organizações civis africâneres, citando vínculos históricos e herança comum. Embora apresentada como apoio cultural, a medida causou alarme no governo sul-africano, com temores de interferência estrangeira e possível agitação."
 HOL_voc.67.a:0 "Isso é uma séria preocupação diplomática."
 HOL_voc.68.t:0 "Apoio holandês a partidos alinhados aos bôeres"
 HOL_voc.68.d:0 "Relatos confirmam que o governo holandês está oferecendo apoio extraoficial a movimentos políticos alinhados aos bôeres dentro da África do Sul. Canais financeiros, plataformas de ONGs e instituições culturais parecem estar canalizando influência para grupos que defendem maior autonomia para a comunidade africâner. Essa interferência pode ter sérias ramificações para a unidade nacional e a segurança interna."
 HOL_voc.68.a:0 "Essa interferência estrangeira é inaceitável."
 HOL_voc.69.t:0 "Investimento holandês em mineradoras africâneres"
 HOL_voc.69.d:0 "O governo holandês fez um investimento financeiro significativo em operações de mineração de propriedade africâner na África do Sul. A medida faz parte de uma campanha mais ampla para aprofundar os laços econômicos com a comunidade africâner, fornecendo capital e apoio logístico para aumentar a produção. Embora economicamente benéfico para alguns, isso levanta novas preocupações sobre a influência externa sobre os recursos naturais da África do Sul."
 HOL_voc.69.a:0 "Estão claramente escolhendo um lado."
 HOL_voc.70.t:0 "Investimento holandês na indústria de semicondutores"
 HOL_voc.70.d:0 "Os Países Baixos anunciaram um investimento estratégico no setor de semicondutores de Taiwan. Em parceria com importantes empresas de tecnologia holandesas, novos escritórios conjuntos e instalações de pesquisa serão construídos para apoiar o desenvolvimento de chips de próxima geração. O acordo aprofunda a cooperação bilateral e fortalece o papel de Taiwan como potência global de semicondutores."
 HOL_voc.70.a:0 "Isso consolida o lugar de Taiwan na era digital."
 HOL_voc.71.t:0 "Proposta holandesa: Aliança Tecnológica ASML–TSMC"
 HOL_voc.71.d:0 "Os Países Baixos propuseram formalmente a criação de um grupo conjunto de compartilhamento de tecnologia entre a ASML e a TSMC. Essa parceria aprofundaria a colaboração em P&D, coordenaria a inovação em litografia e chips e estabeleceria um bloco tecnológico-industrial semiformal. Taiwan apoiará a iniciativa?"
 HOL_voc.71.a:0 "Aprovar a aliança tecnológica: nosso futuro é digital"
 HOL_voc.71.b:0 "Rejeitar: devemos manter a independência tecnológica"
 HOL_voc.72.t:0 "Taiwan aceita a parceria ASML–TSMC"
 HOL_voc.72.d:0 "Taiwan aceitou a proposta holandesa de um grupo conjunto de compartilhamento de tecnologia. Com a ASML e a TSMC no centro, a aliança prepara o terreno para a inovação coordenada em semicondutores e a liderança em pesquisa na Europa e na Ásia."
 HOL_voc.72.a:0 "Uma aliança industrial para a próxima era."
 HOL_voc.73.t:0 "Taiwan rejeita a proposta de compartilhamento de tecnologia"
 HOL_voc.73.d:0 "Taiwan recusou a proposta de uma aliança tecnológica conjunta entre a ASML e a TSMC. Embora os canais diplomáticos continuem abertos, Taipé optou por manter total independência sobre sua estratégia de semicondutores, pelo menos por ora."
 HOL_voc.73.a:0 "Um resultado decepcionante."
 HOL_voc.74.t:0 "Países Baixos assumem o controle das exportações de semicondutores"
 HOL_voc.74.d:0 "Numa medida estratégica abrangente, o governo holandês promulgou novas leis que colocam a autoridade de controle de exportação sobre todas as tecnologias avançadas de semicondutores e sistemas de fotolitografia. Com a ASML como joia da coroa dessa decisão, os Países Baixos agora ocupam uma posição de comando na cadeia global de suprimento de chips, com o poder de aprovar, restringir ou bloquear exportações de tecnologia com base no interesse nacional e no alinhamento diplomático."
 HOL_voc.74.a:0 "Devemos preparar medidas contra os holandeses"
 HOL_voc.74.b:0 "Agora temos as chaves da tecnologia global."
 HOL_voc.75.t:0 "Expansão financeira holandesa na Índia"
 HOL_voc.75.d:0 "Os Países Baixos expandiram significativamente sua presença financeira na Índia, abrindo novos bancos e escritórios corporativos afiliados aos holandeses nas principais cidades. Respaldada por um esforço coordenado envolvendo instituições estatais e multinacionais holandesas, essa estratégia visa aprofundar o investimento bilateral, influenciar os mercados financeiros e aumentar a alavancagem econômica na economia indiana em rápido crescimento. Embora não seja uma manobra política explícita, ela altera sutilmente a dinâmica econômica na região."
 HOL_voc.75.a:0 "O capital estrangeiro sempre traz influência..."
 HOL_voc.76.t:0 "Investimento holandês na infraestrutura portuária de Gujarat"
 HOL_voc.76.d:0 "O governo holandês, por meio de uma combinação de empresas marítimas apoiadas pelo Estado e canais financeiros, investiu na modernização da infraestrutura portuária ao longo da costa de Gujarat. Embora formalmente apresentado como uma iniciativa de facilitação comercial, o estabelecimento de escritórios e instalações de doca holandeses gerou preocupações sobre a alavancagem estrangeira de longo prazo numa região crítica para o comércio nacional. A medida é diplomaticamente delicada, mas economicamente significativa."
 HOL_voc.76.a:0 "Monitoraremos de perto a influência deles."
 HOL_wic.01.t:0 "Traçando o caminho para a WIC"
 HOL_wic.01.d:0 "Ao nos prepararmos para retomar os territórios outrora controlados pela Companhia das Índias Ocidentais, devemos decidir nossa abordagem. Uma estratégia diplomática e econômica poderia levar à integração pacífica, fortalecendo nossa influência por meio do poder brando. Alternativamente, uma abordagem militar poderia oferecer resultados rápidos e decisivos, embora com o risco de resistência e conflito prolongado."
 HOL_wic.01.a:0 "Seguir um caminho diplomático e econômico"
 HOL_wic.01.b:0 "Adotar uma estratégia militar"
 HOL_wic.02.t:0 "Aquisição da dívida pelos holandeses"
 HOL_wic.02.d:0 "Os Países Baixos compraram uma parte significativa de nossa dívida nacional, colocando efetivamente nossa economia sob sua influência. Essa medida trouxe algum alívio imediato à nossa crise financeira, mas também significa que os holandeses agora têm considerável influência sobre nossas políticas e indústrias-chave."
 HOL_wic.02.a:0 "Não temos escolha senão nos submeter ao controle financeiro holandês."
 HOL_wic.03.t:0 "Ultimato holandês ao Senegal"
 HOL_wic.03.d:0 "Os Países Baixos emitiram um ultimato exigindo a transferência do estado de Senegal-Central, que inclui a histórica ilha de Goreia. O Senegal cumprirá a exigência, oferecerá uma alternativa ou recusará categoricamente?"
 HOL_wic.03.a:0 "Cumpriremos e transferiremos Senegal-Central."
 HOL_wic.03.b:0 "Oferecer Senegal-Norte em seu lugar."
 HOL_wic.03.c:0 "Nos recusamos a nos curvar à agressão holandesa."
 HOL_wic.04.t:0 "Território garantido"
 HOL_wic.04.d:0 "O Senegal aceitou nosso ultimato e transferiu o estado de Senegal-Central ao controle holandês. Isso marca mais um passo na recuperação do legado da Companhia das Índias Ocidentais."
 HOL_wic.04.a:0 "Uma vitória para os Países Baixos."
 HOL_wic.05.t:0 "Contraproposta do Senegal"
 HOL_wic.05.d:0 "O Senegal recusou-se a transferir o estado de Senegal-Central, mas ofereceu Senegal-Norte como alternativa. Devemos aceitar essa contraproposta ou insistir na exigência original?"
 HOL_wic.05.a:0 "Aceitar a contraproposta."
 HOL_wic.05.b:0 "Rejeitar a contraproposta e exigir o cumprimento."
 HOL_wic.06.t:0 "Ultimato rejeitado"
 HOL_wic.06.d:0 "O Senegal recusou-se a cumprir nosso ultimato. Agora devemos nos preparar para a guerra para retomar o que é nosso por direito."
 HOL_wic.06.a:0 "A guerra é inevitável."
 HOL_wic.07.t:0 "Ultimato final ao Senegal"
 HOL_wic.07.d:0 "O Senegal rejeitou nossa contraproposta. Estamos dando a eles uma última chance de entregar Senegal-Norte, ou responderemos com força militar."
 HOL_wic.07.a:0 "Entregar Senegal-Norte."
 HOL_wic.07.b:0 "Nos defenderemos da agressão holandesa."
 HOL_wic.08.t:0 "Ultimato holandês: transferir o território da Costa do Ouro"
 HOL_wic.08.d:0 "Os Países Baixos emitiram um ultimato exigindo a transferência do território da Costa do Ouro ao seu controle. Citam sua presença histórica na região sob a Companhia das Índias Ocidentais, incluindo a operação de entrepostos comerciais importantes como o Castelo de Elmina. Embora o cumprimento possa evitar o conflito, ele minaria a soberania de Gana e desestabilizaria a região."
 HOL_wic.08.a:0 "Cumpriremos e transferiremos a Costa do Ouro."
 HOL_wic.08.b:0 "Nos recusamos a nos curvar às exigências holandesas."
 HOL_wic.09.t:0 "Território da Costa do Ouro garantido"
 HOL_wic.09.d:0 "O governo ganês concordou em transferir o território da Costa do Ouro, incluindo o estratégico Castelo de Elmina, ao controle holandês. Isso marca um passo significativo na restauração do legado da Companhia das Índias Ocidentais e no fortalecimento de nossa presença na África Ocidental."
 HOL_wic.09.a:0 "Uma vitória para os Países Baixos e a WIC."
 HOL_wic.10.t:0 "Gana rejeita o ultimato holandês"
 HOL_wic.10.d:0 "O governo ganês recusou nosso ultimato de transferir o território da Costa do Ouro. O desafio não nos deixa escolha senão nos preparar para a ação militar para retomar o que consideramos nosso por direito, restaurando a influência holandesa na região."
 HOL_wic.10.a:0 "A guerra será a única resposta."
 HOL_wic.11.t:0 "Ultimato holandês: transferir a Província de Luanda"
 HOL_wic.11.d:0 "Os Países Baixos emitiram um ultimato exigindo a transferência da Província de Luanda ao controle holandês. Reivindicam esse território como parte de seu histórico império marítimo, citando o envolvimento da Companhia das Índias Ocidentais na região. Embora isso evitasse o conflito, poderia desestabilizar Angola política e economicamente."
 HOL_wic.11.a:0 "Cumpriremos e transferiremos a Província de Luanda ao controle holandês."
 HOL_wic.11.b:0 "Nos recusamos a nos submeter às exigências holandesas."
 HOL_wic.12.t:0 "Angola aceita o ultimato holandês"
 HOL_wic.12.d:0 "O governo angolano concordou em transferir a Província de Luanda ao controle holandês. Essa aquisição estratégica restaura uma parte fundamental do legado marítimo holandês no Atlântico e fortalece nossa posição na região."
 HOL_wic.12.a:0 "Mais um passo rumo à restauração da WIC."
 HOL_wic.13.t:0 "Angola rejeita o ultimato holandês"
 HOL_wic.13.d:0 "O governo angolano recusou nosso ultimato de transferir a Província de Luanda. O desafio não nos deixa escolha senão nos preparar para a ação militar para retomar o que consideramos nosso por direito."
 HOL_wic.13.a:0 "Devemos afirmar nosso domínio pela força."
 HOL_wic.14.t:0 "Ultimato holandês: transferir Santa Helena"
 HOL_wic.14.d:0 "Os Países Baixos emitiram um ultimato exigindo a transferência de Santa Helena ao seu controle. Os holandeses justificam essa reivindicação com base na ligação histórica da ilha com seu império marítimo e sua importância estratégica na rede de comércio atlântico. O cumprimento evitaria o conflito, mas poderia comprometer os interesses britânicos na região."
 HOL_wic.14.a:0 "Cumpriremos e transferiremos Santa Helena ao controle holandês."
 HOL_wic.14.b:0 "Nos recusamos a nos curvar às exigências holandesas."
 HOL_wic.15.t:0 "Santa Helena garantida"
 HOL_wic.15.d:0 "O governo britânico concordou em transferir Santa Helena ao controle holandês. Essa aquisição restaura uma parte vital do legado marítimo dos Países Baixos, reforçando nosso domínio sobre as rotas comerciais do Atlântico."
 HOL_wic.15.a:0 "Uma grande vitória para os Países Baixos e a WIC."
 HOL_wic.16.t:0 "Inglaterra rejeita o ultimato holandês"
 HOL_wic.16.d:0 "O governo britânico recusou nosso ultimato de transferir Santa Helena. A decisão não nos deixa escolha senão nos preparar para a ação militar para retomar essa ilha crucial."
 HOL_wic.16.a:0 "Devemos nos preparar para a guerra."
 HOL_wic.17.t:0 "Os holandeses exigem a devolução de San Juan Bautista"
 HOL_wic.17.d:0 "Numa medida inesperada, os Países Baixos emitiram um ultimato formal exigindo a transferência de Porto Rico, historicamente conhecido como San Juan Bautista. Reivindicam a ilha como passo necessário para restaurar o legado marítimo da Companhia das Índias Ocidentais e restabelecer seu domínio no Caribe. Embora os holandeses citem suas ambições do século XVII e a necessidade estratégica, o cumprimento seria uma grande concessão geopolítica para os Estados Unidos."
 HOL_wic.17.a:0 "Cederemos Porto Rico aos holandeses."
 HOL_wic.17.b:0 "Jamais entregaremos solo americano a potências estrangeiras."
 HOL_wic.18.t:0 "San Juan Bautista volta ao controle holandês"
 HOL_wic.18.d:0 "Os Estados Unidos concordaram em ceder Porto Rico ao controle holandês. Essa histórica retomada de San Juan Bautista restaura um elo vital no Caribe, consolidando nossas ambições marítimas e honrando o legado da Companhia das Índias Ocidentais."
 HOL_wic.18.a:0 "Um dia glorioso para a influência holandesa."
 HOL_wic.19.t:0 "Os americanos recusam o ultimato holandês"
 HOL_wic.19.d:0 "Os Estados Unidos recusaram categoricamente nosso ultimato de ceder Porto Rico. O desafio mina nossas legítimas reivindicações sobre o Caribe, e agora devemos nos preparar para a guerra para garantir San Juan Bautista pela força."
 HOL_wic.19.a:0 "Tomaremos pela força. O Caribe será nosso!"
 HOL_wic.20.t:0 "Os holandeses exigem as Antilhas Britânicas"
 HOL_wic.20.d:0 "Os Países Baixos emitiram um ultimato formal exigindo a transferência das Antilhas Britânicas. Alegam que as ilhas são parte integrante de suas ambições históricas sob a Companhia das Índias Ocidentais, citando seu valor estratégico no Caribe. Uma recusa poderia desencadear um conflito na região."
 HOL_wic.20.a:0 "Transferiremos as Antilhas Britânicas ao controle holandês."
 HOL_wic.20.b:0 "Nos recusamos a entregar territórios britânicos."
 HOL_wic.21.t:0 "Antilhas Britânicas transferidas"
 HOL_wic.21.d:0 "O governo britânico concordou com nossas exigências, cedendo as Antilhas Britânicas ao controle holandês. Esse sucesso marca mais um passo na restauração da influência da Companhia das Índias Ocidentais no Caribe."
 HOL_wic.21.a:0 "O Caribe volta a ser holandês."
 HOL_wic.22.t:0 "Os britânicos rejeitam o ultimato holandês"
 HOL_wic.22.d:0 "Os britânicos se recusaram a nos ceder as Antilhas Britânicas. Esse desafio não pode ficar sem resposta, e devemos nos preparar para tomar essas ilhas vitais pela força."
 HOL_wic.22.a:0 "Retomaremos o que é nosso por meio da guerra."
 HOL_wic.23.t:0 "Os holandeses exigem controle sobre Trinidad"
 HOL_wic.23.d:0 "Os Países Baixos emitiram um ultimato formal exigindo a transferência de Trinidad ao controle holandês. Os holandeses citam suas ambições históricas sob a Companhia das Índias Ocidentais, quando a ilha foi brevemente idealizada como 'Nova Walcheren' no início do século XVII. A localização estratégica da ilha no Mar do Caribe a torna inestimável para o domínio marítimo e as rotas comerciais."
 HOL_wic.23.a:0 "Cederemos Trinidad aos holandeses."
 HOL_wic.23.b:0 "Nos recusamos a ceder às exigências holandesas."
 HOL_wic.24.t:0 "Trinidad devolvida ao controle holandês"
 HOL_wic.24.d:0 "O governo trinitário aceitou nosso ultimato e transferiu o controle da ilha. Essa aquisição vital fortalece nossa influência no Caribe e restabelece o domínio holandês na região, realizando a visão de Nova Walcheren."
 HOL_wic.24.a:0 "Um passo crítico para a Companhia das Índias Ocidentais."
 HOL_wic.25.t:0 "Trinidad rejeita o ultimato holandês"
 HOL_wic.25.d:0 "O governo de Trinidad recusou-se a atender às nossas exigências pela ilha. Esse desafio não nos deixa escolha senão nos preparar para a guerra para retomar esse território estrategicamente vital."
 HOL_wic.25.a:0 "Preparar as forças para a guerra!"
 HOL_wic.26.t:0 "Os holandeses exigem a devolução do Suriname"
 HOL_wic.26.d:0 "Os Países Baixos emitiram um ultimato formal exigindo a devolução do Suriname ao seu controle. Outrora uma colônia vital sob domínio holandês, a posição estratégica e os abundantes recursos do Suriname são vistos como fundamentais para reviver a influência da Companhia das Índias Ocidentais. O cumprimento evitaria o conflito, mas representaria uma perda de soberania."
 HOL_wic.26.a:0 "Cederemos o Suriname aos holandeses."
 HOL_wic.26.b:0 "Nos recusamos a nos submeter às exigências holandesas."
 HOL_wic.27.t:0 "Suriname devolvido ao controle holandês"
 HOL_wic.27.d:0 "O governo surinamês aceitou nosso ultimato e transferiu o controle de seu território. Essa aquisição pacífica garante um elo vital na América do Sul, fornecendo recursos e posicionamento estratégico para impulsionar as ambições holandesas."
 HOL_wic.27.a:0 "Mais um triunfo da WIC!"
 HOL_wic.28.t:0 "Suriname rejeita o ultimato holandês"
 HOL_wic.28.d:0 "O governo surinamês recusou-se a atender às nossas exigências. Esse desafio não pode ficar sem resposta, e devemos nos preparar para assumir o controle do Suriname por meios militares."
 HOL_wic.28.a:0 "Preparar para a guerra!"
 HOL_wic.29.t:0 "Os holandeses exigem o controle da Guiana"
 HOL_wic.29.d:0 "Os Países Baixos emitiram um ultimato formal exigindo a transferência da Guiana ao controle holandês. Historicamente parte da Guiana Holandesa, o território possui ricos recursos e valor estratégico. Os holandeses argumentam que retomar a Guiana é essencial para reviver as ambições da Companhia das Índias Ocidentais e consolidar seu domínio na América do Sul."
 HOL_wic.29.a:0 "Transferiremos a Guiana aos holandeses."
 HOL_wic.29.b:0 "Nos recusamos a nos submeter às exigências holandesas."
 HOL_wic.30.t:0 "Guiana devolvida ao controle holandês"
 HOL_wic.30.d:0 "O governo da Guiana aceitou nossas exigências e transferiu o controle de seu território. Essa aquisição pacífica revive a influência holandesa na América do Sul e realiza as ambições da Companhia das Índias Ocidentais."
 HOL_wic.30.a:0 "Um triunfo da determinação holandesa!"
 HOL_wic.31.t:0 "Guiana rejeita o ultimato holandês"
 HOL_wic.31.d:0 "O governo da Guiana recusou-se a cumprir nosso ultimato. Esse desafio não pode ficar sem resposta, e devemos nos preparar para assumir o controle do território por meios militares."
 HOL_wic.31.a:0 "Tomaremos a Guiana pela força."
 HOL_wic.32.t:0 "Os holandeses exigem o controle da Guiana Francesa"
 HOL_wic.32.d:0 "Os Países Baixos emitiram um ultimato formal exigindo a transferência da Guiana Francesa ao controle holandês. Historicamente parte das ambições coloniais holandesas nas Américas, eles reivindicam esse território como passo necessário para restaurar o domínio da Companhia das Índias Ocidentais na região. O cumprimento evitará a guerra, mas arrisca minar o prestígio e a soberania da França."
 HOL_wic.32.a:0 "Cederemos a Guiana Francesa aos holandeses."
 HOL_wic.32.b:0 "Nos recusamos a nos submeter às exigências holandesas."
 HOL_wic.33.t:0 "Guiana Francesa transferida ao controle holandês"
 HOL_wic.33.d:0 "O governo francês aceitou nossas exigências e transferiu o controle da Guiana Francesa. Essa vitória devolve um território crítico ao controle holandês, consolidando nossa influência na América do Sul e realizando as ambições da Companhia das Índias Ocidentais."
 HOL_wic.33.a:0 "Um grande sucesso para as ambições holandesas!"
 HOL_wic.34.t:0 "França rejeita o ultimato holandês"
 HOL_wic.34.d:0 "O governo francês recusou categoricamente nosso ultimato de transferir a Guiana Francesa. Esse desafio não pode ficar sem resposta, e devemos nos preparar para a guerra para retomar esse território vital e afirmar nosso domínio nas Américas."
 HOL_wic.34.a:0 "Tomaremos pela força!"
 HOL_wic.35.t:0 "Os holandeses exigem controle sobre o Norte do Brasil"
 HOL_wic.35.d:0 "Os Países Baixos emitiram um ultimato formal exigindo a transferência de territórios no Norte do Brasil. Essas regiões estiveram sob controle holandês no século XVII, quando a Companhia das Índias Ocidentais estabeleceu uma colônia de curta duração em Pernambuco e arredores. Os holandeses agora argumentam que retomar essas terras é essencial para reviver sua influência na América do Sul e garantir recursos importantes."
 HOL_wic.35.a:0 "Transferiremos os territórios aos holandeses."
 HOL_wic.35.b:0 "Recusamos as exigências deles. O Brasil se manterá firme."
 HOL_wic.36.t:0 "Brasil transfere os territórios do Norte"
 HOL_wic.36.d:0 "O governo brasileiro aceitou nossas exigências e transferiu o controle dos territórios do norte. Essa aquisição significativa restaura uma parte do nosso legado colonial na América do Sul e fortalece a presença holandesa na região."
 HOL_wic.36.a:0 "Uma grande vitória para a Companhia das Índias Ocidentais!"
 HOL_wic.37.t:0 "Brasil rejeita o ultimato holandês"
 HOL_wic.37.d:0 "O governo brasileiro recusou nosso ultimato, rejeitando nossa reivindicação sobre os territórios do norte. Esse desafio não nos deixa escolha senão nos preparar para a ação militar para retomar essas regiões pela força."
 HOL_wic.37.a:0 "Não seremos negados! Preparar para a guerra!"
 HOL_wic.38.t:0 "Ultimato holandês: devolver os territórios holandeses-americanos"
 HOL_wic.38.d:0 "Os Países Baixos emitiram um ultimato extraordinário, exigindo a transferência de antigos territórios holandeses na Costa Leste, incluindo áreas que pertenceram à Nova Holanda. Reivindicam isso como parte de seu direito histórico, citando o legado de Nova Amsterdã e a influência holandesa na fundação dessas regiões. O cumprimento seria visto como uma grande concessão diplomática e pode abalar o orgulho e a soberania americanos."
 HOL_wic.38.a:0 "Negociaremos e transferiremos os territórios."
 HOL_wic.38.b:0 "Jamais entregaremos solo americano!"
 HOL_wic.39.t:0 "EUA transferem territórios holandeses-americanos"
 HOL_wic.39.d:0 "Numa reviravolta sem precedentes, os Estados Unidos concordaram em devolver aos Países Baixos o controle de territórios importantes. Essa vitória monumental restabelece a influência holandesa nas Américas e revive o espírito histórico de Nova Amsterdã."
 HOL_wic.39.a:0 "Um sucesso histórico para a diplomacia holandesa!"
 HOL_wic.40.t:0 "EUA rejeitam o ultimato holandês"
 HOL_wic.40.d:0 "Os Estados Unidos recusaram categoricamente nossas exigências de devolução dos territórios holandeses-americanos. O desafio não nos deixa escolha senão nos preparar para a guerra para retomar essas terras pela força. O orgulho de Nova Amsterdã deve ser restaurado!"
 HOL_wic.40.a:0 "Retomaremos o que é nosso pela guerra!"
 HOL_nvu.4.t:0 "Reforma educacional concluída"
 HOL_nvu.4.d:0 "Após um ano de transição, o novo sistema educacional está em plena operação. A próxima geração agora está sendo moldada pelos valores de lealdade, disciplina e orgulho, garantindo o futuro da nação."
 HOL_nvu.4.a:0 "As reformas são um sucesso retumbante!"
 HOL_nvu.5.t:0 "Ultimato holandês: unificação de Dietsland"
 HOL_nvu.5.d:0 "O governo holandês emitiu um ultimato à Bélgica, exigindo a transferência imediata de Flandres para unificar Dietsland. A Bélgica deve agora decidir se aceita essa exigência ou enfrenta as consequências da recusa."
 HOL_nvu.5.a:0 "Aceitar a exigência e transferir Flandres."
 HOL_nvu.5.b:0 "Recusar o ultimato."
 HOL_nvu.6.t:0 "Bélgica cede às exigências holandesas"
 HOL_nvu.6.d:0 "Sob a pressão do ultimato holandês, a Bélgica concordou em transferir Flandres aos Países Baixos. Isso marca um passo significativo rumo à unificação de Dietsland."
 HOL_nvu.6.a:0 "A unificação de Dietsland começa!"
 HOL_nvu.7.t:0 "Bélgica recusa o ultimato holandês"
 HOL_nvu.7.d:0 "A Bélgica recusou categoricamente o ultimato holandês de transferir Flandres, desafiando a visão de uma Dietsland unificada. Os Países Baixos devem agora se preparar para agir e fazer valer sua reivindicação pela força."
 HOL_nvu.7.a:0 "Reivindicaremos toda a Bélgica para Dietsland!"
 HOL_nvu.8.t:0 "Proposta holandesa: integração do exército flamengo"
 HOL_nvu.8.d:0 "O governo holandês pediu formalmente para absorver as unidades flamengas de nossas forças armadas em sua estrutura militar. Embora politicamente sensível, a proposta é apresentada como um passo rumo a uma maior cooperação regional."
 HOL_nvu.8.a:0 "Aceitar a transferência"
 HOL_nvu.8.b:0 "Rejeitar a oferta"
 HOL_nvu.9.t:0 "Bélgica aceita o acordo de integração"
 HOL_nvu.9.d:0 "O governo belga concordou em transferir suas unidades do exército flamengo para nossa estrutura militar. Os protocolos de integração começarão imediatamente."
 HOL_nvu.9.a:0 "Excelente"
 HOL_nvu.10.t:0 "Bélgica rejeita a proposta"
 HOL_nvu.10.d:0 "O governo belga rejeitou nossa proposta de integrar seus elementos do exército flamengo. A oferta foi considerada politicamente inaceitável por sua liderança."
 HOL_nvu.10.a:0 "Decepcionante"
 HOL_nvu.11.t:0 "Proposta dos Países Baixos"
 HOL_nvu.11.d:0 "Os Países Baixos propuseram formar uma 'Irmandade Germânica de Nações', um pacto de alinhamento militar e cultural entre nossas nações. Embora ideologicamente compatível, as implicações de longo prazo devem ser avaliadas com cuidado."
 HOL_nvu.11.a:0 "Aceitar a proposta"
 HOL_nvu.11.b:0 "Rejeitar a ideia"
 HOL_nvu.12.t:0 "Alemanha aceita a Irmandade"
 HOL_nvu.12.d:0 "A Alemanha concordou em formar uma Irmandade Germânica de Nações. Um novo eixo geopolítico surgiu na Europa."
 HOL_nvu.12.a:0 "O futuro é nosso"
 HOL_nvu.13.t:0 "Alemanha rejeita a Irmandade"
 HOL_nvu.13.d:0 "Berlim recusou nossa proposta de forjar uma Irmandade Germânica. A visão de unidade deve ser adiada, ou imposta."
 HOL_nvu.13.a:0 "Vergonhoso"
 HOL_nvu.14.t:0 "Nasce a Irmandade Germânica"
 HOL_nvu.14.d:0 "Após negociações bem-sucedidas com os Países Baixos, a Irmandade Germânica de Nações foi formalmente estabelecida. Esta nova aliança se baseia numa identidade cultural compartilhada, cooperação militar e unidade ideológica. A Alemanha agora está no coração de um novo eixo do norte."
 HOL_nvu.14.a: "Einigkeit macht stark"
 HOL_nvu.15.t:0 "Projeto de infraestrutura germânica"
 HOL_nvu.15.d:0 "Para aprofundar a integração e melhorar a mobilidade estratégica entre os membros da Irmandade Germânica, comprometemo-nos a investir em infraestrutura crítica que ligue nossas nações. Redes ferroviárias e rodoviárias modernas unirão o coração de nossa aliança do norte mais do que nunca."
 HOL_nvu.15.a:0 "Lançar as bases da unidade"
 HOL_nvu.16.t:0 "Investimento em recursos na Renânia"
 HOL_nvu.16.d:0 "Como parte de nossa crescente cooperação com a Alemanha, engenheiros e planejadores industriais holandeses lançaram uma nova iniciativa de desenvolvimento na Renânia. Focado em ampliar o acesso a aço e alumínio, esse projeto aumentará a produção industrial da região e garantirá materiais vitais para a causa germânica."
 HOL_nvu.16.a:0 "Força por meio da indústria"
 HOL_nvu.17.t:0 "Convite para se juntar à Irmandade Germânica"
 HOL_nvu.17.d:0 "Os Países Baixos convidaram formalmente a Áustria a se juntar à Irmandade Germânica de Nações. Essa aliança promete objetivos estratégicos compartilhados, unidade cultural e cooperação militar. Aceitaremos a visão deles de um futuro germânico unido?"
 HOL_nvu.17.a:0 "Aceitamos a oferta deles"
 HOL_nvu.17.b:0 "Devemos recusar"
 HOL_nvu.18.t:0 "Áustria aceita a Irmandade"
 HOL_nvu.18.d:0 "A Áustria aceitou nosso convite para se juntar à Irmandade Germânica. Outra orgulhosa nação germânica está conosco em unidade e força."
 HOL_nvu.18.a:0 "Bem-vinda, Áustria"
 HOL_nvu.19.t:0 "Áustria rejeita a Irmandade"
 HOL_nvu.19.d:0 "A Áustria rejeitou nosso convite para se juntar à Irmandade Germânica. A recusa deles será lembrada."
 HOL_nvu.19.a:0 "Eles vão se arrepender disso"
 HOL_nvu.20.t:0 "Apoio naval holandês"
 HOL_nvu.20.d:0 "Os Países Baixos estenderam a mão às nossas ambições navais enviando ajuda material e investimentos marítimos. Com a experiência deles, as bases de uma frota austríaca finalmente estão sendo lançadas."
 HOL_nvu.20.a:0 "O renascimento da marinha austríaca"
 HOL_nvu.21.t:0 "Fortalecendo a União Germânica"
 HOL_nvu.21.d:0 "Para garantir uma cooperação duradoura entre as nações germânicas, os Países Baixos iniciaram novas políticas de integração, oferecendo coordenação diplomática, planejamento militar conjunto e apoio econômico. A Irmandade está evoluindo para uma verdadeira União."
 HOL_nvu.21.a:0 "A união faz a força"
 HOL_nvu.22.t:0 "Proposta holandesa de unificação"
 HOL_nvu.22.d:0 "Os Países Baixos propuseram uma unificação completa dos povos germânicos sob um único Estado. Devemos agora decidir se abraçamos a unidade ou ficamos à parte."
 HOL_nvu.22.a:0 "Aceitamos a união"
 HOL_nvu.22.b:0 "Rejeitamos a oferta deles"
 HOL_nvu.23.t:0 "Unificação aceita"
 HOL_nvu.23.d:0 "Nossa oferta de unificação foi aceita. Um novo império germânico nasce sob a liderança holandesa."
 HOL_nvu.23.a:0 "O sonho realizado"
 HOL_nvu.24.t:0 "Unificação rejeitada"
 HOL_nvu.24.d:0 "Nossa proposta de unificação foi recusada. Devemos agora decidir se a Irmandade termina aqui ou continua pela força."
 HOL_nvu.24.a:0 "Então a tomaremos"
 HOL_nvu.25.t:0 "Investimento holandês em recursos austríacos"
 HOL_nvu.25.d:0 "Numa nova fase de integração econômica, o governo holandês propôs um investimento em larga escala nos setores austríacos de extração e refino de recursos. A medida deve modernizar a infraestrutura crítica e aumentar a produção de matérias-primas em toda a região."
 HOL_nvu.25.a:0 "Isso fortalecerá nossa base industrial."
 HOL_nvu.26.t:0 "Investimento holandês na infraestrutura ferroviária transalemã"
 HOL_nvu.26.d:0 "O governo holandês anunciou um grande programa de investimento destinado a modernizar e expandir a infraestrutura ferroviária nas regiões germânicas. Autoridades afirmam que o objetivo é melhorar a mobilidade, a integração econômica e a unidade cultural entre os povos alemães em sentido amplo. A medida se alinha à visão continental dos Países Baixos e às crescentes ambições de infraestrutura na Europa Central."
 HOL_nvu.26.a:0 "Uma estrada de ferro para um destino compartilhado."
 HOL_nvu.27.t:0 "Proposta holandesa de unificação"
 HOL_nvu.27.d:0 "Os Países Baixos propuseram uma unificação completa dos povos germânicos sob um único Estado. Devemos agora decidir se abraçamos a unidade ou ficamos à parte."
 HOL_nvu.27.a:0 "Aceitamos a união"
 HOL_nvu.27.b:0 "Rejeitamos a oferta deles"
 HOL_nvu.28.t:0 "Unificação aceita"
 HOL_nvu.28.d:0 "Nossa oferta de unificação foi aceita. Um novo império germânico nasce sob a liderança holandesa."
 HOL_nvu.28.a:0 "O sonho realizado"
 HOL_nvu.29.t:0 "Unificação rejeitada"
 HOL_nvu.29.d:0 "Nossa proposta de unificação foi recusada. Devemos agora decidir se a Irmandade termina aqui ou continua pela força."
 HOL_nvu.29.a:0 "Então a tomaremos"
 HOL_common_event.18.t:0 "Sabaton no Museu Militar Nacional"
 HOL_common_event.18.d:0 "O Museu Militar Nacional em Soesterberg sediou exibições do filme da Sabaton The War To End All Wars, com a presença do cofundador da banda, Pär Sundström. A visita leva a história da Grande Guerra a um novo e amplo público e chama nova atenção para nosso patrimônio militar."
 HOL_common_event.18.a:0 "Nossa história militar inspira uma nova geração."
 HOL_ing_group_strategy_category:0 "Estratégias do ING Group"
 HOL_ing_group_strategy_category_desc:0 "\n£ing_bank_category_picture \n\n\n\nÀ medida que os ciclos econômicos globais alternam entre períodos de crescimento e recessão, o ING Bank está pronto para tirar proveito dessas flutuações. Por meio de uma série de manobras financeiras calculadas, o ING pode estender sua influência sobre os mercados nacionais e internacionais, conduzindo tanto os esforços de recuperação quanto os booms de expansão. Essas decisões dão aos Países Baixos a capacidade de usar o peso financeiro do banco para estimular o crescimento, gerenciar riscos e maximizar os retornos de investimento. Ao ajustar estrategicamente as políticas de crédito, impulsionar o consumo e expandir as redes de comércio global, o ING não apenas fortalecerá sua posição de mercado, como também consolidará a posição dos Países Baixos como potência financeira."
 HOL_ing_group_strategies_expansion_GER: "Deutsche ING"
 HOL_ing_group_strategies_expansion_GER_desc:0 "§Y[GER.GetNameWithFlag]§! tem sido um mercado central para o ING, com investimentos significativos em banco de varejo e finanças corporativas. Expandir as operações do ING aqui consolidará ainda mais sua posição no setor bancário europeu."
 HOL_ing_group_strategies_expansion_POL: "ING Bank Śląski"
 HOL_ing_group_strategies_expansion_POL_desc:0 "O ING estabeleceu uma forte presença em §Y[POL.GetNameWithFlag]§! por meio do ING Bank Śląski. Expandir ainda mais neste mercado em rápido crescimento aumentará a influência do ING na Europa Central e Oriental."
 HOL_ing_group_strategies_expansion_AST:0 "ING Direct Austrália"
 HOL_ing_group_strategies_expansion_AST_desc:0 "A economia §Y[AST.GetAdjective]§! impulsionada pela inovação oferece ao ING a chance de liderar em banco digital e pesquisa. Expandir as operações na Austrália impulsionará o crescimento tecnológico do ING e consolidará sua posição como líder em fintech."
 HOL_ing_group_strategies_expansion_SPR: "ING España"
 HOL_ing_group_strategies_expansion_SPR_desc:0 "§Y[SPR.GetNameWithFlag]§! é um mercado dinâmico para banco digital e investimentos em infraestrutura. Ao aumentar sua presença na Espanha, o ING pode aproveitar o crescente desenvolvimento urbano e melhorar sua carteira de financiamento de construção."
 HOL_ing_group_strategies_expansion_ITA: "ING Italia"
 HOL_ing_group_strategies_expansion_ITA_desc:0 "§Y[ITA.GetNameWithFlag]§! oferece um mercado financeiro maduro com oportunidades de crescimento no banco corporativo. Expandir para a Itália ajudará o ING a estabelecer uma presença mais firme no Sul da Europa e a aumentar as taxas de crescimento econômico."
 HOL_ing_group_strategies_expansion_TUR:0 "ING Bank Turquia"
 HOL_ing_group_strategies_expansion_TUR_desc:0 "A posição estratégica §Y[TUR.GetAdjective]§! entre a Europa e a Ásia apresenta uma oportunidade única para o ING expandir sua influência comercial e financeira. Ao investir na Turquia, o ING pode aumentar significativamente suas operações financeiras ligadas ao comércio."
 HOL_ing_group_strategies_expansion_USA: "ING U.S. Investment Management"
 HOL_ing_group_strategies_expansion_USA_desc:0 "§Y[USA.GetNameWithFlag]§!, como maior economia do mundo, oferece imensas oportunidades ao ING, particularmente em gestão de investimentos. Expandir para os EUA garantirá o papel do ING como grande player global em gestão de ativos."
 HOL_ing_group_strategies_expansion_ROM:0 "ING Bank Romênia"
 HOL_ing_group_strategies_expansion_ROM_desc:0 "O mercado emergente §Y[ROM.GetAdjective]§! dá ao ING a oportunidade de apoiar a infraestrutura e o desenvolvimento econômico. Mais investimento na Romênia aumentará a influência do ING no crescente setor financeiro do Leste Europeu."
 HOL_ing_group_strategies_expansion_speciality1: "ING Digital First"
 HOL_ing_group_strategies_expansion_speciality1_desc:0 "Com o mundo caminhando cada vez mais para soluções digitais, o ING pode garantir sua posição de líder em banco digital por meio da estratégia Digital First. A especialização nessa área melhorará a segurança cibernética, reduzirá os custos de transação e aumentará a eficiência do banco digital."
 HOL_ing_group_strategies_expansion_speciality2:0 "Abordagem Terra do ING"
 HOL_ing_group_strategies_expansion_speciality2_desc:0 "Com o compromisso de alinhar seus investimentos às metas climáticas globais, a Abordagem Terra do ING se concentra em financiar projetos de energia verde e desenvolvimento sustentável. A especialização em finanças sustentáveis aumentará a produção de energia verde e atrairá investimentos ambientalmente conscientes."
 HOL_ing_group_strategies_expansion_speciality3: "ING Wholesale Banking"
 HOL_ing_group_strategies_expansion_speciality3_desc:0 "Os clientes corporativos são um foco central dos negócios do ING. Ao se especializar em banco de atacado, o ING aumentará sua capacidade de oferecer soluções financeiras personalizadas a grandes empresas, impulsionando o crescimento e a receita corporativos."
 HOL_ing_group_strategies_expansion_speciality4: "ING Wealth Services"
 HOL_ing_group_strategies_expansion_speciality4_desc:0 "A gestão de patrimônio oferece altos retornos e relacionamentos de longo prazo com clientes. Especializar-se em gestão de patrimônio permitirá ao ING atender indivíduos de alta renda, aumentando a tributação sobre a renda patrimonial e ampliando seus serviços de finanças pessoais."
 HOL_carrier_production:0 "Programa de Aquisição de Porta-Aviões"
 HOL_carrier_production_desc:0 "\n£hol_carrier_program_decision_category \n\n\n\nOs Países Baixos buscam ampliar suas capacidades navais adquirindo porta-aviões de outras nações. Essas decisões nos permitirão fortalecer nossa frota e projetar poder pelos mares por meio de parcerias estratégicas e aquisições militares."
 HOL_request_carrier_production_uk:0 "Pedir apoio britânico para a construção de porta-aviões"
 HOL_request_carrier_production_uk_desc:0 "A Marinha Real tem séculos de experiência marítima, e seus modernos porta-aviões da Classe Queen Elizabeth refletem um projeto naval de ponta. Uma parceria com o Reino Unido poderia nos permitir codesenvolver uma nova embarcação sob medida para operações expedicionárias holandesas e da OTAN."
 HOL_request_carrier_production_chn:0 "Pedir apoio chinês para a construção de porta-aviões"
 HOL_request_carrier_production_chn_desc:0 "A rápida expansão naval da China a posicionou como potência global na construção naval. Aproveitar sua escala industrial e seus projetos militares modernos poderia nos permitir operar um porta-aviões com capacidades únicas, embora tal alinhamento possa abalar as parcerias ocidentais."
 HOL_request_carrier_production_dutch:0 "Investir na construção nacional de porta-aviões"
 HOL_request_carrier_production_dutch_desc:0 "Os Países Baixos iniciarão a construção de um porta-aviões próprio usando estaleiros nacionais e a engenharia holandesa avançada. Embora mais lento e caro que a ajuda estrangeira, esse esforço reforça a soberania nacional e apoia nossa indústria naval."
 HOL_influence_flanders:0 "Proeminência em §Y[FLN.GetNameWithFlag]§!"
 HOL_influence_flanders_desc:0 "Com os profundos laços culturais e históricos entre §Y[HOL.GetNameWithFlag]§! e §Y[FLN.GetNameWithFlag]§!, surge uma oportunidade única de levar a região ao alinhamento com a governança holandesa. §Y[HOL.GetNameWithFlag]§! pretende aumentar gradualmente sua influência sobre §Y[FLN.GetNameWithFlag]§!, podendo levar à integração plena.\n\nÀ medida que a influência atinge níveis mais altos, §Y[FLN.GetNameWithFlag]§! pode se tornar mais independente de §Y[BEL.GetNameWithFlag]§!, com chances crescentes de integração aos Países Baixos. No entanto, §Y[BEL.GetNameWithFlag]§! tem o poder de resistir a essa influência, contrariando os esforços holandeses e reforçando os laços de §Y[FLN.GetNameWithFlag]§!' com seu governo atual."
 HOL_high_influence_belgium:0 "Alta proeminência §Y[HOL.GetAdjective]§! em §Y[BEL.GetNameWithFlag]§!"
 HOL_high_influence_belgium_desc:0 "Nossa proeminência em §Y[FLN.GetNameWithFlag]§! atingiu um nível notável, despertando apoio à integração com §Y[HOL.GetNameWithFlag]§!."
 HOL_voc_category:0 "O legado da VOC renascido"
 HOL_voc_category_desc:0 "\n£hol_voc_category_picture \n\n\n\nA Companhia Holandesa das Índias Orientais, ou Vereenigde Oostindische Compagnie (VOC), foi outrora o império comercial mais poderoso do mundo. Suas frotas dominavam os mares, seus mercadores controlavam o comércio global de especiarias e seus administradores forjaram um império colonial que se estendia por continentes. Agora, na era moderna, §Y[HOL.GetNameWithFlag]§! tem a oportunidade de reviver esse legado lendário. Aproveitando a experiência §Y[HOL.GetFlag][HOL.GetAdjective]§! em comércio, diplomacia e inovação, a VOC pode ressurgir, não como relíquia do passado, mas como força para moldar o futuro.\n\n §Y[IND.GetNameWithFlag]§! é nosso projeto especial. Se quisermos retomar nossa colônia da coroa, precisamos preparar uma invasão. Para montar uma invasão bem-sucedida, precisamos garantir uma cabeça de ponte o mais rápido possível. Podemos iniciar os preparativos, mas precisamos manter nossa §Rdetecção§! o mais baixa possível. Caso contrário, podemos ser descobertos e um desembarque será muito difícil.\n\n Nossa situação atual:\n §GForça§! em §Y[631.GetName]§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_strength|+]\n §RChance de detecção§! na §YIlha de Java§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|-] \n §GForça§! na §YIlha de Sumatra§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_strength|+]\n §RChance de detecção§! na §YIlha de Sumatra§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|-] \n §GForça§! em §YKalimantan§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_strength|+]\n §RChance de detecção§! em §YKalimantan§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|-]"
 HOL_voc_category_ind:0 "Perigo §Y[HOL.GetFlag][HOL.GetAdjective]§! para §Y[IND.GetNameWithFlag]§!"
 HOL_voc_category_ind_desc:0 "Os §Y[HOL.GetFlag][HOL.GetAdjective]§! anunciaram que farão o que for preciso para retomar seu império colonial. Precisamos nos preparar para esse perigo iminente, pois não seremos derrotados tão facilmente! Podemos aumentar nossas chances de detecção ampliando nossa inteligência sobre os §Y[HOL.GetFlag][HOL.GetAdjective]§! e investindo em nosso §YServiço de Segurança§!. \n\n Chance atual de detecção dos preparativos §Y[HOL.GetFlag][HOL.GetAdjective]§!: \n\n§GChance de detecção§! na §YIlha de Java§! §Y[IND.GetNameWithFlag]§!: [?HOL_java_detection_chance|+]\n§GChance de detecção§! na §YIlha de Sumatra§! §Y[IND.GetNameWithFlag]§!: [?HOL_sumatra_detection_chance|+]\n§GChance de detecção§! na §YIlha de Kalimantan§! §Y[IND.GetNameWithFlag]§!: [?HOL_kalimantan_detection_chance|+]"
 HOL_wic_category:0 "A fronteira ousada da WIC"
 HOL_wic_category_desc:0 "\n£hol_wic_category_picture \n\n\n\nA Companhia Holandesa das Índias Ocidentais (WIC) foi uma força de ambição e ousadia, navegando por águas desconhecidas para estabelecer a influência holandesa nas Américas e na África Ocidental. Das plantações de açúcar do Suriname aos entrepostos comerciais do Caribe e da Costa do Ouro africana, a WIC forjou um império colonial por meio do comércio, do conflito e da engenhosidade. Embora seus dias de glória tenham se apagado, seu legado permanece, um testemunho da resiliência e da visão holandesas."
 HOL_core_german_state_schleswig_holstein:0 "Integrar Schleswig-Holstein"
 HOL_core_german_state_schleswig_holstein_desc:0 "Este território é cultural e estrategicamente importante. A integração plena ao Estado holandês fortalecerá nossa influência no mundo germânico."
 HOL_core_german_state_niedersachsen:0 "Integrar Baixa Saxônia"
 HOL_core_german_state_niedersachsen_desc:0 "Esta região forma a espinha dorsal setentrional da Alemanha. Integrá-la consolidaria nosso controle sobre o coração do baixo-alemão."
 HOL_core_german_state_nordrhein_westfalen:0 "Integrar Renânia do Norte-Vestfália"
 HOL_core_german_state_nordrhein_westfalen_desc:0 "Uma das regiões mais industriais da Europa, sua integração aumentará nossa posição econômica e estratégica."
 HOL_core_german_state_rheinland_pfalz:0 "Integrar Renânia-Palatinado"
 HOL_core_german_state_rheinland_pfalz_desc:0 "Colocar esta região sob nosso controle amplia nossa presença histórica e cultural ao longo do Reno."
 HOL_core_german_state_hessen:0 "Integrar Hesse"
 HOL_core_german_state_hessen_desc:0 "A região de Hesse faz a ponte entre o oeste e o centro da Alemanha. Consolidá-la apoia a unidade nacional."
 HOL_core_german_state_baden_wurttemberg:0 "Integrar Baden-Württemberg"
 HOL_core_german_state_baden_wurttemberg_desc:0 "Uma região rica e poderosa, integrar Baden-Württemberg fortalece nossa pretensão à liderança do sul da Alemanha."
 HOL_core_german_state_bayern:0 "Integrar Baviera"
 HOL_core_german_state_bayern_desc:0 "Historicamente distinta, porém inegavelmente central para a Alemanha, a integração da Baviera expande nossa influência para os territórios do sul."
 HOL_core_german_state_sachsen:0 "Integrar Saxônia"
 HOL_core_german_state_sachsen_desc:0 "A Saxônia há muito é um centro da cultura e da indústria alemãs. Integrá-la aumenta tanto o patrimônio quanto a capacidade."
 HOL_core_german_state_berlin:0 "Integrar Berlim"
 HOL_core_german_state_berlin_desc:0 "Como antiga capital da Prússia e da Alemanha, a integração de Berlim é uma necessidade simbólica e estratégica."
 HOL_core_german_state_steiermark:0 "Integrar Estíria"
 HOL_core_german_state_steiermark_desc:0 "Historicamente ligada à Áustria, integrar a Estíria fortalece nossa presença no mundo germânico alpino."
 HOL_core_german_state_austria_proper:0 "Integrar a Áustria propriamente dita"
 HOL_core_german_state_austria_proper_desc:0 "No coração do legado dos Habsburgos está a própria Áustria. Sua integração afirma nossa liderança sobre o mundo germânico."
 HOL_core_german_state_tirol:0 "Integrar Tirol"
 HOL_core_german_state_tirol_desc:0 "As montanhas do Tirol são estrategicamente valiosas e culturalmente ligadas. Trazê-las para o nosso seio garante nossa fronteira alpina."
 HOL_core_german_state_mecklenburg:0 "Integrar Mecklemburgo"
 HOL_core_german_state_mecklenburg_desc:0 "Uma região marítima do norte essencial para controlar o acesso ao Báltico, sua integração estende o alcance naval holandês."
 HOL_core_german_state_thuringen:0 "Integrar Turíngia"
 HOL_core_german_state_thuringen_desc:0 "Localizada no centro e rica culturalmente, integrar a Turíngia reforça nossa posição no centro da Alemanha."
 HOL_core_german_state_franken:0 "Integrar Francônia"
 HOL_core_german_state_franken_desc:0 "Integrar esta região cultural fragmentada une a herança germânica sob uma única bandeira."
 HOL_core_german_state_koln_bonn:0 "Integrar Colônia-Bonn"
 HOL_core_german_state_koln_bonn_desc:0 "Esta potência econômica e cultural é uma pedra angular da influência no oeste da Alemanha, essencial de integrar."
 HOL_core_german_state_saarland:0 "Integrar Sarre"
 HOL_core_german_state_saarland_desc:0 "Uma região de fronteira com recursos estratégicos, a integração do Sarre garante o portal para a França."
 HOL_core_german_state_sachsen_anhalt:0 "Integrar Saxônia-Anhalt"
 HOL_core_german_state_sachsen_anhalt_desc:0 "Integrar a Saxônia-Anhalt reforça nosso controle sobre o centro da Alemanha e sua base industrial."
 HOL_core_german_state_brandenburg:0 "Integrar Brandemburgo"
 HOL_core_german_state_brandenburg_desc:0 "Antiga sede do poder prussiano, a integração de Brandemburgo é um passo vital para restaurar a liderança germânica."
 HOL_core_german_state_hamburg:0 "Integrar Hamburgo"
 HOL_core_german_state_hamburg_desc:0 "Como porto global e polo econômico, a integração de Hamburgo ancora nosso domínio comercial no norte da Europa."
