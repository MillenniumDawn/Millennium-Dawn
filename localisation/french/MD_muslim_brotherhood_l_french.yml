l_french:
 muslim_brotherhood_sponsor: "Réseau des Frères Musulmans"
 muslim_brotherhood_suppressor: "Contrer les Frères"
 MB_build_network_hub: "Bâtir l'organisation internationale"
 MB_build_network_hub_desc: "Les Frères musulmans sont un mouvement transfrontalier, ses affiliés dispersés dans la région sans centre unique. Que [Root.GetNameDef] devienne ce centre, coordonnant le réseau et nous donnant les moyens de soutenir nos frères à l'étranger."
 MB_fund_affiliates: "Financer les affiliés de la Fraternité"
 MB_fund_affiliates_desc: "Les Frères de [FROM.GetNameDef] sont volontaires mais pauvres. Argent, organisateurs et un flux régulier de soutien renforceront leur main contre un gouvernement qui préférerait les voir disparaître."
 MB_diplomatic_solidarity: "Appeler à la solidarité fraternelle"
 MB_diplomatic_solidarity_desc: "Les gouvernements alignés sur les Frères sont plus forts ensemble que séparés. Rassemblons-les autour d'une table, réaffirmons la cause commune, et que la chaleur entre nous se fasse sentir dans tout le bloc."
 MB_bankroll_crackdown: "Financer une répression étrangère"
 MB_bankroll_crackdown_desc: "[FROM.GetNameDef] voit les Frères grandir à l'intérieur de ses frontières sans les moyens d'agir. Offrons-leur fonds et renseignements pour frapper les premiers, avant que le mouvement ne soit assez fort pour menacer l'État."
 MB_designate_terrorist_organization: "Désigner les Frères organisation terroriste"
 MB_designate_terrorist_organization_desc: "Étiquetons les Frères musulmans pour ce que nous déclarons qu'ils sont : une organisation terroriste. La désignation coûte peu à l'intérieur et place [Root.GetNameDef] aux côtés de tous les gouvernements qui ont tiré la même ligne."
 MB_counter_sponsor_influence: "Dénoncer le financement de la Fraternité"
 MB_counter_sponsor_influence_desc: "Quelqu'un finance les Frères en [FROM.GetNameDef], et l'argent laisse une trace. Exposons-le, perturbions-le, et voyons le mouvement perdre de son élan tandis que ses bailleurs sont traînés en pleine lumière."
 MB_rescind_terrorist_designation: "Annuler la désignation de terroriste"
 MB_rescind_terrorist_designation_desc: "Laissons discrètement la désignation terroriste tomber. La posture contre les Frères a servi son but, et il y a peu à gagner à garder de vieux griefs au registre."
 MB_sponsored_network: "Parrainage de notre mouvement des Frères"
 MB_funding_subversion: "Financer la subversion des Frères musulmans à l’étranger"
 MB_solidarity: "Solidarité des Frères musulmans"
 MB_crackdown_patron: "A financé notre répression"
 MB_funding_repression: "Financement de la répression des Frères"
 MB_counter_bloc: "Position commune contre les Frères"
 MB_branded_terrorist: "A étiqueté les Frères groupe terroriste"
 brotherhood.6.c: "Coopter leurs modérés au gouvernement."
 brotherhood.11.t: "Une offre pour financer une répression"
 brotherhood.11.d: "[FROM.GetNameDef] nous a discrètement proposé argent et renseignements pour réprimer les Frères musulmans avant qu'ils ne se renforcent. Leurs émissaires attendent une réponse."
 brotherhood.11.a: "Accepter le financement et agir contre eux."
 brotherhood.11.b: "Décliner l'offre."