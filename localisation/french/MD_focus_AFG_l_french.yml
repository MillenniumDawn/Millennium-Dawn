 AFG_pomegranate_investment1_collect: "Collection de grenades"
 AFG_pomegranate_investment1_collect_desc: "Les agriculteurs sont prêts pour que nous récupérions un chargement de grenades."
 AFG_almond_investment1_collect: "Collection d'amandes"
 AFG_almond_investment1_collect_desc: "Les agriculteurs sont prêts pour que nous récupérions un chargement d'amandes."
 AFG_almond_investment1: "Investir dans la production d'amandes"
 AFG_almond_investment1_desc: "Les amandes sont une source majeure de revenus pour de nombreux Afghans. Le gouvernement peut investir dans la filière amandière en fournissant infrastructures, transport et accès au marché aux agriculteurs. Ce programme d'investissement est limité à 5 grandes initiatives, après quoi le marché atteint la saturation. Investissement : 5 % du PIB, retours : 6 % du PIB (marge de 20 %)."
 AFG_pomegranate_investment1: "Investir dans la production de grenades"
 AFG_pomegranate_investment1_desc: "Les grenades d'Afghanistan sont renommées dans le monde pour leur qualité. Le gouvernement peut investir dans des installations de production et des réseaux commerciaux pour tirer parti de cette ressource naturelle. Ce programme d'investissement est limité à 5 grandes initiatives, après quoi le marché atteint la saturation. Investissement : 5 % du PIB, retours : 6 % du PIB (marge de 20 %)."
 AFG_invite_nahzat_e_melli_ye_into_government: "Inviter le Hezb-e-Nuhzhat-e-Mili Afghanistan au gouvernement"
 AFG_domestic_decisions: "Objectifs nationaux"
 AFG_domestic_decisions_desc: "La nation se relevant, nous avons fixé des objectifs pour reconstruire l'État et forger un nouvel avenir."
 AFG_taloqan_siege_mission: "Tenir la ville"
 AFG_taloqan_siege_mission_desc: "Sécuriser la ville est crucial alors que notre territoire se réduit, et les vastes plaines du nord-ouest offrent une cible tentante pour une future offensive."
 AFG_headquarters_taloqan: "Quartier général de Taloqan"
 AFG_headquarters_taloqan_desc: "Taloqan s'imposa comme un bastion décisif pour Ahmad Shah Massoud lors de l'invasion soviétique. Elle est ensuite devenue le centre de commandement central de [AFG.GetFlag] [AFG.GetNameDefCap], point d'accès crucial vers le Tadjikistan après la chute de Mazar-e Charif aux talibans en 1997."
 taliban_insurgency_category: "L'insurrection talibane"
 taliban_insurgency_category_desc: "Bien que les forces £GFX_AFG_salafist_jihadism §Ytalibanes§! aient été vaincues par la coalition, elles n'ont pas été entièrement éliminées : les militants se sont fragmentés et ont lancé une §Rinsurrection§! dans tous les recoins de l'Afghanistan, multipliant les §Rattentats terroristes§! contre le nouveau gouvernement et les forces de la coalition. L'éradication de l'insurrection talibane devrait prendre des années, selon de nombreux facteurs.\n\nLa §Yforce talibane§! détermine la puissance des militants à l'intérieur du pays ; sa croissance comme notre efficacité à éradiquer l'insurrection dépendront de la §Yconfiance envers le gouvernement central (stabilité, corruption ou ingérence étrangère)§! et de la §Ysituation à la frontière afghano-pakistanaise§!. Si la §Yforce talibane§! est trop élevée, les £GFX_AFG_salafist_jihadism §Ytalibans§! pourront commettre des §Rattentats terroristes§!, et même les faire dégénérer en §Rnouvelle guerre civile§!, même si certaines méthodes peuvent être efficaces à court terme contre la menace talibane.\n\n§YForce talibane§! : [?AFG.taliban_strength] %"
 AFG_pashtunistan_decisions: "Unifier le Pachtounistan"
 AFG_pashtunistan_decisions_desc: "Près de 16 % de la population pakistanaise s'identifie comme pachtoune, le groupe ethnique dominant d'Afghanistan. La plupart des Pachtounes pakistanais vivent dans le nord-ouest du pays. En raison de la guerre civile au Pakistan, beaucoup souffrent désormais sous un régime terrifiant. Il est de notre devoir de les protéger."
 AFG_russian_airlift_is_active: "Dispose du pont aérien russe"
 AFG_donkey_logistics_tech: "Logistique des bêtes de somme"
 AFG_donkey_logistics_tech_desc: "Des convois de mulets et d'ânes acheminent le ravitaillement par des cols où aucun camion ne passe."
 AFG_donkey_logistics_tech2: "Logistique des animaux de bât II"
 AFG_donkey_logistics_tech2_desc: "Des caravanes plus importantes et des points de relais établis le long des routes du nord."
 AFG_donkey_logistics_tech3: "Logistique des animaux de bât III"
 AFG_donkey_logistics_tech3_desc: "Un corps de transport permanent bâti autour des convois de bât qui n'ont jamais cessé de circuler."
 AFG_legacy_of_the_mujahideen: "Héritage des moudjahidines"
 AFG_legacy_of_the_mujahideen_desc: "Les vétérans de la guerre soviétique transmettent leur savoir-faire de terrain à la milice."
 AFG_tech_the_farmer_and_their_rifle: "Le paysan et son fusil"
 AFG_tech_the_farmer_and_their_rifle_desc: "Des levées rurales qui se battent pour leurs propres vallées et en connaissent chaque approche."
 AFG_tech_training_of_local_police_officers: "Formation d'officiers de police locaux"
 AFG_tech_training_of_local_police_officers_desc: "Une milice formée à policer autant qu'à combattre, et à tenir le terrain une fois pris."
 AFG_tech_return_of_dostum: "Retour de Dostoum"
 AFG_tech_return_of_dostum_desc: "Dostoum est de retour dans le nord, et les milices ouzbekes se battent en conséquence."
 AFG_the_lion_of_panjshir: "Le Lion du Panchir"
 AFG_the_lion_of_panjshir_desc: "La doctrine de Massoud : tenir les hauteurs et frapper depuis elles."
 AFG_karzai_installed: "Gouvernement Karzaï installé"
 AFG_political_path_chosen: "Une voie politique a été choisie"
 AFG_border_wars.7.c: "Une affaire entre Afghans"
