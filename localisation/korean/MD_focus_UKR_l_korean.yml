 ukraine_parliament.23.t: "의회, 우리의 새 연금 예산 수락"
 ukraine_parliament.23.d: "의회가 연금 지출을 늘리자는 우리의 요청을 승인하였습니다. 이는 며칠 전 우리가 제출한 제안에 따른 것이며, 해당 발의가 많은 인기와 지지를 얻은 것으로 보입니다."
 ukraine_parliament.23.a: "좋아"
 ukraine_parliament.24.t: "의회, 우리의 새 연금 예산 부결"
 ukraine_parliament.24.d: "의회가 연금 지출을 늘리자는 우리의 요청을 거부하였습니다. 이는 며칠 전 우리가 제출한 제안에 따른 것이며, 해당 발의가 많은 인기와 지지를 얻지 못한 것으로 보입니다."
 ukraine_parliament.24.a: "유감이다"
 ukraine_parliament.24.b: "어쩌면 약간의 뇌물이 그들의 마음을 바꿀지도 모른다..."
 ukraine_parliament.25.t: "의회, 우리의 새 연금 예산 수락"
 ukraine_parliament.25.d: "의회가 연금 지출을 줄이자는 우리의 요청을 승인하였습니다. 이는 며칠 전 우리가 제출한 제안에 따른 것이며, 해당 발의가 많은 인기와 지지를 얻은 것으로 보입니다."
 ukraine_parliament.25.a: "좋아"
 ukraine_parliament.26.t: "의회, 우리의 새 연금 예산 부결"
 ukraine_parliament.26.d: "의회가 연금 지출을 줄이자는 우리의 요청을 거부하였습니다. 이는 며칠 전 우리가 제출한 제안에 따른 것이며, 해당 발의가 많은 인기와 지지를 얻지 못한 것으로 보입니다."
 ukraine_parliament.26.a: "유감이다"
 ukraine_parliament.26.b: "어쩌면 약간의 뇌물이 그들의 마음을 바꿀지도 모른다..."
 ukraine_parliament.30.t: "우리 정부에 등을 돌린 의회의 일부 의석!"
 ukraine_parliament.30.d: "일부 의원들이 우리 정부에 등을 돌려 의회 내 우리의 지지가 감소하였습니다."
 ukraine_parliament.30.a: "그럴 수도 있다"
 ukraine_parliament.30.b: "어쩌면 그들의 주머니가 조금 비었던 것일지도?"
 ukraine_parliament.31.t: "우리를 지지하기 시작한 의회의 일부 의석!"
 ukraine_parliament.31.d: "일부 의원들이 우리의 최근 성과를 칭찬하기 시작하여 의회 내 지지가 증가하였습니다."
 ukraine_parliament.31.a: "좋아"
 ukraine_parliament.32.t: "의회, 지역 주민에 대한 더 많은 지원 추진!"
 ukraine_parliament.32.d: "의회는 전국의 지역 주민들에게 지급할 대규모 예산을 배정했으며, 우리 행정부도 이 소식을 접했습니다. 일부 각료들은 이 자금을 다른 곳에 배정하면 더 유용하게 쓸 수 있다고 생각하고 있습니다."
 ukraine_parliament.32.a: "이 돈은 지역 주민들을 위한 것이다!"
 ukraine_parliament.32.b: "그렇다, 분명 다른 곳에 더 잘 쓸 수 있다"
 ukraine_parliament.33.t: "우리 행정부를 질책하는 의회"
 ukraine_parliament.33.d: "최근 의회 의원 여러 명이 우리 행정부가 \\"[ROOT.GetAdjective] 국민을 만족시키지 못하고 있다\\"고 공개적으로 비판했습니다. 정부 지지 의석과 야당 의석 사이에 내분이 심해졌으며, 이제는 우리가 개입하여 대응해야 할 지경에 이르렀습니다."
 ukraine_parliament.33.a: "마음대로 생각하게 두자"
 ukraine_parliament.33.b: "적절한 대응을 준비하라"
 ukraine_parliament.34.t: "의회, 의료 지출 증액 동의안 통과"
 ukraine_parliament.34.d: "의회는 최근 예산의 더 큰 부분을 의료 지출에 배정하는 동의안을 통과시켰습니다. 일부 각료들은 이것이 우리 경제와 정부에 재앙이 될 것이라고 생각하여 반대하고 있습니다."
 ukraine_parliament.34.a: "의회의 생각이 옳다"
 ukraine_parliament.34.b: "아니, 이 동의안을 통과시키지 않겠다"
 ukraine_parliament.35.t: "의회, 연금 증액 동의안 통과"
 ukraine_parliament.35.d: "의회는 최근 예산의 더 큰 부분을 복지 지출에 배정하는 동의안을 통과시켰습니다. 일부 각료들은 이것이 우리 경제와 정부에 재앙이 될 것이라고 생각하여 반대하고 있습니다."
 ukraine_parliament.35.a: "의회의 생각이 옳다"
 ukraine_parliament.35.b: "아니, 이 동의안을 통과시키지 않겠다"
 ukraine_parliament.36.t: "의회, 경찰 지출 증액 동의안 통과"
 ukraine_parliament.36.d: "의회는 최근 예산의 더 큰 부분을 경찰 지출에 배정하는 동의안을 통과시켰습니다. 일부 각료들은 이것이 우리 경제와 정부에 재앙이 될 것이라고 생각하여 반대하고 있습니다."
 ukraine_parliament.36.a: "의회의 생각이 옳다"
 ukraine_parliament.36.b: "아니, 이 동의안을 통과시키지 않겠다"
 ukraine_parliament.37.t: "의회, 교육 지출 증액 동의안 통과"
 ukraine_parliament.37.d: "의회는 최근 예산의 더 큰 부분을 교육 지출에 배정하는 동의안을 통과시켰습니다. 일부 각료들은 이것이 우리 경제와 정부에 재앙이 될 것이라고 생각하여 반대하고 있습니다."
 ukraine_parliament.37.a: "의회의 생각이 옳다"
 ukraine_parliament.37.b: "아니, 이 동의안을 통과시키지 않겠다"
 ukraine_parliament.38.t: "의회, 군사 지출 증액 동의안 통과"
 ukraine_parliament.38.d: "의회는 최근 예산의 더 큰 부분을 군사 지출에 배정하는 동의안을 통과시켰습니다. 일부 각료들은 이것이 우리 경제와 정부에 재앙이 될 것이라고 생각하여 반대하고 있습니다."
 ukraine_parliament.38.a: "의회의 생각이 옳다"
 ukraine_parliament.38.b: "아니, 이 동의안을 통과시키지 않겠다"
 ukr_sabotage.1.t: "우리 비축물자를 공격한 우크라이나"
 ukr_sabotage.1.d: "최근의 드론 공격으로 우크라이나가 낡은 중장비를 보관하던 창고를 타격했습니다."
 ukr_sabotage.1.a: "젠장"
 ukr_sabotage.2.t: "우리 비축물자를 공격한 우크라이나"
 ukr_sabotage.2.d: "최근의 드론 공격으로 우크라이나가 낡은 경장비를 보관하던 창고를 타격했습니다."
 ukr_sabotage.2.a: "젠장"
 ukr_sabotage.3.t: "우리 군수 생산시설을 공격한 우크라이나"
 ukr_sabotage.3.d: "최근의 드론 공격으로 우크라이나가 우리 제조업체 한 곳을 타격하여 일시적인 피해를 입었습니다."
 ukr_sabotage.3.a: "대가를 치르게 될 것이다."
 UKR_our_ukraine_start: "우리 우크라이나"
 UKR_our_ukraine_start_desc: "이제 나라의 질서를 바로잡고 자유주의 개혁을 시행할 때입니다. 우리에게는 국민이 최우선입니다!"
 UKR_our_ukraine_secretariat: "우크라이나 대통령 비서실"
 UKR_our_ukraine_secretariat_desc: "비서실은 대통령 활동과 관련된 행정 및 조직 기능의 관리에서 핵심적인 역할을 수행합니다. 우크라이나 대통령 비서실을 설치하는 주된 목적은 대통령의 헌법상 권한 준수와 직무의 효과적인 이행을 보장하는 것입니다."
 UKR_our_ukraine_secretariat_reduction: "비서실 인원 감축"
 UKR_our_ukraine_secretariat_reduction_desc: "정부 기관의 업무를 최적화하고 예산 비용을 줄이기 위해 비서실 인원을 감축해야 합니다."
 UKR_our_ukraine_decentralization: "지방 분권화"
 UKR_our_ukraine_decentralization_desc: "우리나라의 지방 자치를 강화해야 합니다."
 UKR_our_ukraine_wto: "WTO 가입 지원 요청"
 UKR_our_ukraine_wto_desc: "우리는 WTO 회원국이 될 준비가 되어 있으며, 이를 위한 지원이 필요합니다."
 UKR_our_ukraine_yanukovich_go_home: "야누코비치 해임"
 UKR_our_ukraine_yanukovich_go_home_desc: "야누코비치는 총리로서 형편없는 모습을 보였으므로, 그를 해임하고 새로운 총리를 임명할 것입니다."
 UKR_our_ukraine_timoha: "티모셴코 내각"
 UKR_our_ukraine_timoha_desc: "유명한 율리야 티모셴코가 우리 정부에 합류했습니다. 그녀가 우리나라에 무엇을 가져다줄지 지켜봅시다."
 UKR_our_ukraine_aviation_reform: "항공 산업 개혁"
 UKR_our_ukraine_aviation_reform_desc: "항공 산업은 우리나라에 매우 중요하며, 우리는 이를 되살리기 위해 노력할 것입니다."
 UKR_our_ukraine_help_western: "리비우의 지지 확보"
 UKR_our_ukraine_help_western_desc: "리비우의 온수와 냉수 공급을 복구하여 이 도시 주민들, 나아가 지역 전체의 지지를 확보할 것입니다."
 UKR_our_ukraine_cheap_gas_negotiate: "가스 가격 인하 협상"
 UKR_our_ukraine_cheap_gas_negotiate_desc: "모스크바와 에너지 가격 인하를 협상해 보겠습니다."
 UKR_our_ukraine_service_life: "복무 기간 단축"
 UKR_our_ukraine_service_life_desc: "우크라이나군은 현대화가 필요합니다. 이 분야의 첫 번째 개혁은 군 복무 기간을 2년에서 1년으로 줄이는 것입니다! 이로써 징집병들이 복무로 잃는 시간이 줄어들 것입니다."
 UKR_our_ukraine_nato_eu: "우크라이나의 NATO 및 EU 통합 지원"
 UKR_our_ukraine_nato_eu_desc: "NATO와 EU로의 보다 진보적인 통합을 시작합시다. 이는 위대한 우리나라의 군사적, 경제적 안보를 위해 필요합니다."
 UKR_our_ukraine_fire_corrupt: "부패 인사 해임"
 UKR_our_ukraine_fire_corrupt_desc: "우리 정부에는 부패한 자들이 있으며, 이들을 해임할 것입니다! 우리나라에 부패가 설 자리는 없습니다!!!"
 UKR_our_ukraine_form_new_government: "새 정부 구성"
 UKR_our_ukraine_form_new_government_desc: "나라의 재산을 훔쳐 온 자들을 모두 해임했으니, 이제 정직하고 공정한 새 정부를 구성할 수 있습니다."
 UKR_our_ukraine_fight_corruption: "부패 척결"
 UKR_our_ukraine_fight_corruption_desc: "부패는 우리나라의 가장 큰 적이며, 우리는 이에 강력히 맞서 싸울 것입니다!"
 UKR_our_ukraine_alternative_energy_sources: "대체 에너지원"
 UKR_our_ukraine_alternative_energy_sources_desc: "대체 에너지원을 개발하면 에너지 수입에 대한 의존도를 줄이는 데 도움이 될 것입니다. "
 UKR_our_ukraine_crush_oligarchs: "올리가르히 영향력 축소"
 UKR_our_ukraine_crush_oligarchs_desc: "과두 체제는 우리나라의 두 번째 적입니다. 그들은 법망을 피해 우리 정부에 영향력을 행사할 수 있습니다. 이를 막기 위해 그들의 영향력을 줄이고 나라 밖으로 몰아내도록 노력할 것입니다."
 UKR_our_ukraine_increase_media_freedom: "언론의 자유 확대"
 UKR_our_ukraine_increase_media_freedom_desc: "우리 언론은 매우 오랫동안 제약을 받아 왔으며, 이제 우리 집권기에는 그 어느 때보다 자유롭고 독립적이 될 것입니다!"
 UKR_our_ukraine_release_political_prisoners: "정치범 석방"
 UKR_our_ukraine_release_political_prisoners_desc: "이전 정부 아래에서 많은 야당 정치인이 투옥되었습니다. 그들에게 자유를 돌려줍시다!"
 UKR_our_ukraine_internet_freedom: "인터넷 자유"
 UKR_our_ukraine_internet_freedom_desc: "인터넷 자유란 시민이 정보에 자유롭게 접근할 권리, 표현의 자유, 온라인 통신에서의 사생활을 누릴 권리를 갖는다는 뜻입니다. 이러한 권리와 자유가 보호되도록 합시다."
 UKR_our_ukraine_provide_housing: "우크라이나 시민에게 주택 제공"
 UKR_our_ukraine_provide_housing_desc: "시민들에게 주거를 제공해야 하며, 이를 위해 적절한 개혁을 시행할 것입니다."
 UKR_our_ukraine_health_insurance_law: "건강보험법"
 UKR_our_ukraine_health_insurance_law_desc: "국민이 의료 기관을 적극적으로 이용하도록 장려하고 시민들의 건강 수준을 높일 건강보험법을 채택할 것입니다."
 UKR_our_ukraine_curriculum_modernization: "교육과정 현대화"
 UKR_our_ukraine_curriculum_modernization_desc: "젊은 세대의 교육을 개선하기 위해 학교의 교육 프로그램을 개혁할 것입니다."
 UKR_our_ukraine_diversification_of_gas_supply_sources: "가스 공급원 다변화"
 UKR_our_ukraine_diversification_of_gas_supply_sources_desc: "단일 공급자에게 의존하지 않도록 자원 자산을 적극적으로 다변화할 것입니다."
 UKR_our_ukraine_cost_reduction: "예산 지출 삭감"
 UKR_our_ukraine_cost_reduction_desc: "예산 상태를 개선하기 위해 예산을 삭감할 것입니다."
 UKR_our_ukraine_deregulation_of_business_environment: "기업 환경 규제 완화"
 UKR_our_ukraine_deregulation_of_business_environment_desc: "우리나라는 관료주의를 줄이고 기업가들이 마주하는 행정적 장벽을 낮춰야 합니다."
 UKR_our_ukraine_attracting_investments: "투자 유치"
 UKR_our_ukraine_attracting_investments_desc: "우리나라는 투자에 열려 있으며, 잠재적 투자자를 유치할 준비가 되어 있습니다."
 UKR_our_ukraine_beginning_decommunization_policy: "탈공산화 정책 개시"
 UKR_our_ukraine_beginning_decommunization_policy_desc: "1991년 우리는 소비에트의 압제로부터 독립을 얻었습니다. 이를 기념하여 전국에서 탈공산화 정책을 시작합시다! 공산주의의 영향력은 바로 지금 이곳에서 억제되어야 합니다."
 UKR_our_ukraine_economic_liberalism: "경제적 자유주의"
 UKR_our_ukraine_economic_liberalism_desc: "경제가 더욱 효율적으로 성장하려면 경제적 자유주의는 필수이며, 따라서 우리는 이를 받아들여야 합니다. "
 UKR_our_ukraine_parliamentary_republic: "의회 권한 강화"
 UKR_our_ukraine_parliamentary_republic_desc: "의회 권한을 강화하면 정부의 대표성을 높이는 데 도움이 됩니다. 의회는 국민이 선출한 기관이므로 의사 결정 과정에서 더 큰 영향력을 가져야 합니다. 이는 정치 과정에 시민의 의견과 이익을 더 폭넓게 반영하는 데 기여합니다."
 UKR_our_ukraine_president_republic: "대통령 권한 강화"
 UKR_our_ukraine_president_republic_desc: "대통령 권한 강화를 뒷받침하는 첫 번째 중요한 논거는 위기 상황에 보다 효과적이고 신속하게 대응할 수 있도록 하는 것입니다. 경제 위기, 대테러, 팬데믹 같은 세계적 도전으로 가득한 세계에서 대통령은 신속하고 단호하게 행동할 충분한 권한을 가져야 합니다.\n\n제한된 권한은 관료주의적 지연과 비효율적인 결정으로 이어질 수 있습니다."
 UKR_our_ukraine_democratic_constitution: "새 민주 헌법"
 UKR_our_ukraine_democratic_constitution_desc: "우리나라에 진정한 민주주의를 더 가까이 가져오기 위해 헌법을 개혁할 준비가 되어 있습니다."
 UKR_our_ukraine_recognition_holodomor: "홀로도모르 인정"
 UKR_our_ukraine_recognition_holodomor_desc: "소비에트 권력은 우리 우크라이나인에게 20세기 가장 끔찍한 범죄를 저질렀습니다. 이 끔찍한 기근, 홀로도모르는 농업 집단화와 소련 공산 정권이 자행한 국가 폭력 정책으로 인해 발생했습니다. "
 UKR_our_ukraine_ukrainian_institute: "우크라이나 국가기억연구소"
 UKR_our_ukraine_ukrainian_institute_desc: "우크라이나 국가기억연구소는 국가 기억의 복원과 보존 분야에서 국가 정책을 실현하는 중앙 행정 기관입니다. 이 기관은 우크라이나 민족의 올바른 역사를 되살리고 이 방향의 국가 정책을 수립하고 시행하기 위해 설립될 것입니다.\n\n또한 우리나라 영토에서 일어난 정치적 탄압과 기근 희생자들의 기억도 영원히 기릴 것입니다."
 UKR_our_ukraine_secretariat_of_president_reduction: "축소된 우크라이나 대통령 비서실"
 UKR_ukrainian_libertarianism: "우크라이나 자유지상주의"
 UKR_ukrainian_libertarianism_desc: "이제 우크라이나가 자유지상주의의 시대로 들어설 때입니다! 자본가와 공산주의자의 족쇄로부터 나라를 해방시킵시다."
 UKR_full_deregulation: "전면적 규제 철폐"
 UKR_full_deregulation_desc: "완전한 규제 철폐 절차를 시작할 것이며, 정부의 영향력은 줄어들 것입니다."
 UKR_decrease_role_of_government: "정부 권력 축소"
 UKR_decrease_role_of_government_desc: "국가는 우리의 아름다운 나라에서 최소한의 역할만 맡게 될 것입니다."
 UKR_free_the_common_folk: "진정으로 자유로운 국민"
 UKR_free_the_common_folk_desc: "우리 국민은 마침내 숨을 깊이 들이쉬며 자유를 느낄 것입니다!"
 UKR_offshore_country: "역외 회사의 나라"
 UKR_offshore_country_desc: "우리는 나라 안에 다수의 역외 구역이 만들어지는 것을 환영합니다."
 UKR_true_servant_of_people: "진정한 인민의 종"
 UKR_true_servant_of_people_desc: "마침내 우크라이나는 세계에서 가장 자유로운 나라가 되었습니다!"
 UKR_our_ukraine_freedom_of_social_media_idea: "소셜 미디어의 자유"
 UKR_our_ukraine_freedom_of_social_media_idea_desc: "미디어는 자유로워야 하며, 또한 그렇게 될 것입니다. 우리는 검열 금지를 지지할 것입니다."
 UKR_our_ukraine_secretariat_of_president: "우크라이나 대통령 비서실"
 UKR_our_ukraine_ukrainian_institute_of_national_memory: "우크라이나 국가기억연구소"
 UKR_our_ukraine_ukrainian_institute_of_national_memory_desc: "모든 우크라이나인은 자기 민족이 과거에 치른 희생을 기억해야 합니다. 국가기억연구소는 우크라이나인의 영웅적 행위를 기억할 세대를 길러내는 데 도움이 될 것입니다."
 UKR_our_ukraine_fight_with_corruption_idea: "부패 척결"
 UKR_our_ukraine_education_reform_idea: "교육 개혁의 여파"
 UKR_our_ukraine_health_reform_idea: "의료 개혁의 여파"
 UKR_our_ukraine_social_reform_idea: "주택 개혁의 여파"
 UKR_our_ukraine_air_industry_idea: "항공 산업 개혁"
 UKR_liberals_modifier: "우크라이나 자유주의"
 UKR_liberals_modifier_desc: "우크라이나는 마침내 자유주의의 길에 들어섰으며, 이제 우리는 권위주의 통치의 족쇄를 벗어던졌습니다."
 ukraine_our_ukraine.1.t: "우크라이나 대통령 비서실"
 ukraine_our_ukraine.1.d: "대통령 행정실은 유셴코 집권기 동안 형편없는 모습을 보였으므로, 더 큰 정치적 안정을 보장하기 위해 이를 우크라이나 대통령 비서실로 개편하고 있습니다."
 ukraine_our_ukraine.1.a: "변화의 때가 왔다."
 ukraine_our_ukraine.2.t: "우크라이나 국가기억연구소"
 ukraine_our_ukraine.2.d: "국가기억연구소가 활동을 시작했으며, 이제 우크라이나를 진정한 역사로 되돌릴 준비가 되었습니다!"
 ukraine_our_ukraine.2.a: "만세!"
 ukraine_our_ukraine.4.t: "우리나라에 투자를 제안하는 우크라이나"
 ukraine_our_ukraine.4.d: "우크라이나 정부는 외국인 투자자 유치 프로그램의 개시를 발표하고, 우리 정부에 자국 경제에 투자하라는 제안을 보내왔습니다."
 ukraine_our_ukraine.4.a: "투자하자!"
 ukraine_our_ukraine.4.b: "관심 없다."
 ukraine_our_ukraine.5.t: "우크라이나 투자."
 ukraine_our_ukraine.5.d: "그들이 우리나라에 투자하기로 동의했습니다."
 ukraine_our_ukraine.5.a: "좋아"
 ukraine_our_ukraine.6.t: "우크라이나 투자."
 ukraine_our_ukraine.6.d: "그들이 우리나라에 투자하라는 우리의 제안을 거절했습니다."
 ukraine_our_ukraine.6.a: "슬프군"
 ukraine_our_ukraine.7.t: "우크라이나와의 가스 계약."
 ukraine_our_ukraine.7.d: "우크라이나는 우리 가스 계약의 구매 가격을 인하하자고 제안했으며, 그 대가로 양국 사이의 중개자를 없애겠다고 합니다. 이렇게 되면 우리가 그들에게 더 큰 영향력을 갖게 될 것인데, 동의해야 할까요?"
 ukraine_our_ukraine.7.a: "서명하겠다"
 ukraine_our_ukraine.7.b: "관심 없다."
 ukraine_our_ukraine.8.t: "러시아와의 가스 계약."
 ukraine_our_ukraine.8.d: "그들이 우리 가스 계약의 조건을 변경하는 데 동의했으며, 이제 우리는 더 적게 지불하게 됩니다!"
 ukraine_our_ukraine.8.a: "좋아"
 ukraine_our_ukraine.9.t: "러시아, 수정된 가스 계약 거부"
 ukraine_our_ukraine.9.d: "러시아는 우리가 제안한 가스 가격 인하를 거부했습니다. 기존 계약과 가격이 그대로 유지됩니다."
 ukraine_our_ukraine.9.a: "Maintain the existing contract"
 UKR_zelensky_western: "서방으로 가는 길"
 UKR_zelensky_western_desc: "우리는 서방을 향한 열망을 품고 정치적 노선을 이어갈 것입니다."
 UKR_befriend_the_west: "서방과의 우호"
 UKR_befriend_the_west_desc: "우리는 서방 국가들과의 관계를 개선하는 정책을 계속 이어갈 것이며, 우리는 이들에게서 동반자와 동맹을 찾습니다."
 UKR_avakov_befriend: "아바코프와의 우호"
 UKR_avakov_befriend_desc: "아르센 아바코프는 우리가 지켜본 모든 장관 중에서 가장 끈질긴 인물로 드러났습니다. 그는 여러 정부를 거치며 살아남았을 뿐 아니라 아조우 대대를 재정적으로 지원하고 있습니다. 그와의 관계를 강화하면 아조우의 규모를 늘릴 수 있을 것입니다."
 UKR_land_reform_zelya: "토지 개혁"
 UKR_land_reform_zelya_desc: "오래전에 시작된 토지 개혁을 계속 추진할 것입니다."
 UKR_fasten_nato_join: "NATO 가입 열망"
 UKR_fasten_nato_join_desc: "NATO는 우리의 결승선이며, 우리가 처음부터 줄곧 추구해 온 목표입니다."
 UKR_peaceful_negotiation_don: "돈바스 문제의 평화적 해결"
 UKR_peaceful_negotiation_don_desc: "우리는 돈바스에 양보할 준비가 되어 있으며, 마침내 이 끝없는 분쟁을 끝내려 합니다."
 UKR_keep_status_quo: "현상 유지"
 UKR_keep_status_quo_desc: "우리는 이 문제를 평화적으로 해결할 준비가 되어 있지 않으며, 이전과 같은 길을 걸을 것입니다."
 UKR_next_azov_created_tt: "새로운 §Y아조우 여단§!이 창설됩니다"
 UKR_our_influence_helps_tt: "§C우리가 의회에 영향력을 행사하고 있으므로, 우리에게 유리한 의석이 더 적더라도 더 높은 성공 가능성으로 이 법안을 통과시킬 수 있습니다§!"
 UKR_lose_some_seats_TT: "§H의회§!에서 일부 의석을 §R잃게§! 됩니다"
 UKR_gain_some_seats_TT: "§H의회§!에서 일부 의석을 §G얻게§! 됩니다"
 UKR_is_pro_west_TT: "서방 성향의 정당입니다"
 UKR_is_pro_east_TT: "러시아 성향의 정당입니다"
 UKR_is_neutral_TT: "어떤 외국과도 연계되지 않은 정당입니다"
 UKR_influence_parliament_TT: "§H의회§!에 §p영향력§!을 행사하기 시작합니다"
 UKR_puppet_parliament_TT: "§H의회§!를 §O괴뢰화§!합니다\n\n§R법률 변경 시 의회를 거칠 필요가 없어집니다§!"
 UKR_dissolve_parliament_TT: "§H의회§!를 §R해산§!합니다\n\n§R법률 변경 시 의회를 거칠 필요가 없어집니다§!"
 UKR_zelenskiy_socialist_TT: "§Y젤렌스키§!의 §B이념 성향§!이 바뀝니다!"
 UKR_zelenskiy_formed_TT: "£ukr_servant_of_the_people §Y인민의 종§! 당이 창당됩니다!"
 UKR_zelenskiy_here_TT: "£ukr_servant_of_the_people §Y인민의 종§! 당이 창당되어야 합니다!"
 ukr_zelenskiy.2.t: "슬루하 나로두"
 ukr_zelenskiy.2.d: "예기치 못한 소식이 우크라이나 전역을 뒤흔들었습니다. 오늘 전당대회의 결과로, 인기 드라마의 이름을 딴 인민의 종 당이 창당되었습니다. 많은 사람들은 이 정당이 드라마를 위한 홍보 활동으로 만들어졌다고 믿는 반면, 다른 이들은 유명 코미디언 볼로디미르 젤렌스키를 대통령 후보로 내세우기 위해 만들어졌다고 주장합니다. 젤렌스키 본인은 관련성을 부인하고 있지만, 그의 얼버무리는 답변은 추가적인 추측의 근거가 될 수 있습니다."
 ukr_zelenskiy.2.a: "흥미롭군"
 UKR_reform_programm: "개혁 프로그램"
 UKR_reform_programm_desc: "우리 국가를 경제 성장으로 이끌고 소련 붕괴의 위기에서 벗어나게 할 일련의 개혁을 시작할 것입니다."
 UKR_reform_national_guard: "국가방위대 해체"
 UKR_reform_national_guard_desc: "개혁의 시간입니다. 국가방위대를 해체하고 보다 효과적인 조직인 내무군으로 개편할 때입니다."
 UKR_reform_vsu: "새로운 군사 교리"
 UKR_reform_vsu_desc: "우리 군은 변화하고 현대화되어야 합니다. 그렇지 않으면 적과의 전쟁에 대비할 수 없습니다. 새로운 교리는 NATO와의 협력도 강화합니다."
 UKR_check_and_balances: "견제와 균형 체제"
 UKR_check_and_balances_desc: "우리 국가는 현재 불안정한 정치 상황에 놓여 있으며, 파국을 막기 위해 정치 영역에서 균형을 찾아야 합니다."
 UKR_yushenko_cabinet: "유셴코 내각"
 UKR_yushenko_cabinet_desc: "빅토르 유셴코는 이미 관리 경험에서 좋은 모습을 보여 준 오랜 지인입니다. 그가 약속한 활동의 성과는 우리나라의 경제 부문 성장을 촉진할 것입니다."
 UKR_welfare_reform: "복지 개혁"
 UKR_welfare_reform_desc: "의료는 1990년대 이래 안타까운 상태에 놓여 있으며, 이를 개혁하기 시작해야 합니다."
 UKR_kosuik: "코슈크 제빵 공장"
 UKR_kosuik_desc: "국내 농업이 부흥을 시작하고 있으며, 민간 기업가들이 이 과정의 엔진이 될 것입니다. 그중 한 명인 유리 코슈크는 농산물 생산을 위한 자신의 공장을 세울 계획입니다."
 UKR_azovstal_private: "아조우스탈 민영화"
 UKR_azovstal_private_desc: "우리 스스로는 이처럼 거대한 기업을 재정적으로 지탱할 수 없으므로, 아조우스탈을 민간에 넘기는 작업을 계속 진행할 것입니다."
 UKR_land_reform: "토지 개혁"
 UKR_land_reform_desc: "토지 개혁은 오래전에 이루어졌어야 했지만 우리는 할 수 있는 한 미루었습니다. 이제 토지를 민간에 매각하기가 더 쉬워질 것입니다."
 UKR_land_trade: "토지 거래 간소화"
 UKR_land_trade_desc: "우리나라에서 민간 투자자가 토지를 취득하는 것을 계속 쉽게 만들 것입니다."
 UKR_bolster_privatization: "토지 민영화 강화"
 UKR_bolster_privatization_desc: "민영화가 가속화될 것이며, 우리나라는 새로운 시장 경제로 나아가야 합니다."
 UKR_ukrenergo_reform: "우크레네르고 개혁"
 UKR_ukrenergo_reform_desc: "우리의 에너지 구조는 끔찍한 상황에 놓여 있으며, 우크레네르고를 개혁해야 합니다."
 UKR_burshtyn_tes: "부르시틴 화력발전소 확장"
 UKR_burshtyn_tes_desc: "부르시틴 화력발전소의 재건과 개선을 진행할 것입니다."
 UKR_diversy_fuel: "연료 구매 다변화"
 UKR_diversy_fuel_desc: "우리가 해외에서 구입하는 에너지원을 능숙하게 다변화해야 하며, 단 하나의 판매자에게 의존할 수는 없습니다."
 UKR_short_terms: "단기 대출 폐지"
 UKR_short_terms_desc: "단기 대출과 같은 것들을 전면 폐지할 것입니다. 이는 경제에 해롭습니다."
 UKR_bank_lobbyst: "은행 로비스트 제거"
 UKR_bank_lobbyst_desc: "1990년대에 많은 은행 로비스트가 권력을 잡았으며, 이제 그들이 우리나라에 미치는 영향력을 제거할 때입니다."
 UKR_social_cut_down: "사회 지출 삭감"
 UKR_social_cut_down_desc: "재정 비축분을 안정시키기 위해 사회 지출을 일시적으로 줄일 수밖에 없습니다."
 UKR_struggle_power: "권력 투쟁"
 UKR_struggle_power_desc: "우리의 불안정한 상황은 강력한 정치적 경쟁자들의 등장으로 이어졌습니다. 우리는 그들로부터 스스로를 지키고 유권자들이 우리 곁에 남도록 설득해야 합니다."
 UKR_tax_agro: "농업 기업 감세"
 UKR_tax_agro_desc: "농업 산업의 생산 증가를 촉진하기 위해 이들에 대한 세금을 줄일 것입니다."
 UKR_stimulate: "경제 부양"
 UKR_stimulate_desc: "우리의 조치가 결실을 맺고 있으며, 경제가 성장하기 시작했습니다."
 UKR_negotiation_left: "좌파 야당과의 협상"
 UKR_negotiation_left_desc: "좌파 활동가들이 눈에 띄게 세력을 얻고 있으며, 이들과 타협점을 찾아야 합니다."
 UKR_radicalize_without_kuchma: "쿠치마 없는 우크라이나 운동 소탕"
 UKR_radicalize_without_kuchma_desc: "\\"쿠치마 없는 우크라이나\\" 운동이 위험한 기세를 얻고 있으며, 이들을 처리할 때입니다."
 UKR_slowdown_reform_land: "토지 개혁 속도 조절"
 UKR_slowdown_reform_land_desc: "토지 개혁이 사회에서 엇갈린 반응을 불러일으켰으므로 속도를 늦추기로 결정했습니다."
 UKR_re_approach_privatbank: "프리바트방크와의 관계 재정립"
 UKR_re_approach_privatbank_desc: "프리바트방크는 우리나라에서 가장 큰 은행입니다. 이들과 성공적으로 타협점을 찾아야 하며, 그러면 막대한 세수를 얻을 수 있을 것입니다."
 UKR_concessin_with_donbass: "돈바스 세력에 대한 양보"
 UKR_concessin_with_donbass_desc: "우리는 돈바스에 양보할 준비가 되어 있으며, 이로써 그들의 충성을 확보하려 합니다."
 UKR_invest_mining_companies: "광업 기업에 대한 투자"
 UKR_invest_mining_companies_desc: "돈바스 기업에 투자함으로써 현지 유권자들의 강력한 지지를 확보할 것입니다."
 UKR_donbass_infrastructure: "돈바스 인프라 프로그램"
 UKR_donbass_infrastructure_desc: "돈바스 인프라에 투자하면 새로운 유권자를 끌어들이고 이 지역의 소득도 늘릴 수 있습니다."
 UKR_impeachment: "탄핵 절차"
 UKR_impeachment_desc: "베르호우나 라다가 우리를 탄핵하려 움직이고 있습니다. 너무 늦기 전에 우리의 권위에 대한 이 위협에 대응해야 합니다."
 UKR_privatization_ukrenergo: "우크레네르고 확장"
 UKR_privatization_ukrenergo_desc: "우리는 우크레네르고를 확장하여 전력망의 일부를 유럽 동기 전력망에 연결하고 있습니다."
 UKR_reach_russian_oligarch: "러시아 올리가르히 접촉"
 UKR_reach_russian_oligarch_desc: "우리의 정치 활동을 지지하도록 러시아 올리가르히를 끌어들일 것입니다."
 UKR_rus_mobile_operators: "러시아 이동통신사 유치"
 UKR_rus_mobile_operators_desc: "러시아 통신 사업자에게 우리 시장에 대한 접근을 허용할 것입니다."
 UKR_free_economic_zones: "경제 자유구역"
 UKR_free_economic_zones_desc: "우리 영토에 여러 경제 구역을 만들 것이며, 그곳에서 러시아 투자자들을 최우선으로 기다릴 것입니다."
 UKR_yanuk_cabinet: "야누코비치 [Yanu_Status]"
 UKR_yanuk_cabinet_desc: "빅토르 야누코비치와 그의 앞으로의 정치 활동은 유셴코의 활동과 마찬가지로 경제에 자극 효과를 가져올 것입니다."
 UKR_block_land_trading: "토지 거래 차단"
 UKR_block_land_trading_desc: "토지 거래는 적극적으로 동결될 것입니다. 이는 우리 군산복합체의 독립성에 부정적인 영향을 줄 수 있기 때문입니다."
 UKR_soft_taxation: "온건한 세제 개혁"
 UKR_soft_taxation_desc: "기업과 개인 모두를 크게 분노하게 하지 않는 온건한 세제 개혁을 추진할 것입니다."
 UKR_floating_excange: "변동 환율제"
 UKR_floating_excange_desc: "우리는 변동 환율제를 시행할 것이지만, 이는 전혀 다른 경제적 효과를 가져올 수도 있습니다."
 UKR_small_favor: "소기업 우대"
 UKR_small_favor_desc: "경제 성장을 촉진하기 위해 소기업에 대한 혜택을 도입할 것입니다."
 UKR_doentskstal: "도네츠크스탈"
 UKR_doentskstal_desc: "이 지역에서의 활동을 최적화하기 위해 돈바스 영토에 새로운 기업을 설립하고 있습니다."
 UKR_gas_azvostal: "아조우스탈 가스관 건설"
 UKR_gas_azvostal_desc: "기업의 운영과 지역 주민들의 생활 여건을 개선하기 위해 아조우스탈에 가스관을 건설할 것입니다."
 UKR_dorohy_avto: "아프토모빌니 도로히 우크라이니"
 UKR_dorohy_avto_desc: "우리나라의 도로 상태를 끔찍하다고 하는 것조차 칭찬일 정도입니다. 도로의 95%가 그저 방치되어 있습니다. 이를 고치기 시작할 것입니다."
 UKR_roshen: "로셴"
 UKR_roshen_desc: "유명한 로셴 제과 공장이 사업을 확장하고 있으며, 우리는 그 소유주들을 면밀히 주시할 것입니다."
 UKR_luaz_reopen: "LuAZ 현대화"
 UKR_luaz_reopen_desc: "LuAZ는 낡은 차량을 생산하고 있습니다. 도로 개혁에 도움이 되도록 이를 현대화해야 합니다."
 UKR_ukraine_2000: "우크라이나 2000"
 UKR_ukraine_2000_desc: "새로운 천년은 우크라이나에 전면적인 헌법 개혁을 가져와야 하며, 우리는 이를 적극 추진할 것입니다."
 UKR_gain_rada_support: "라다의 지지 확보"
 UKR_gain_rada_support_desc: "우리 개혁을 이행하려면 베르호우나 라다의 전폭적인 지지가 필요합니다."
 UKR_deal_pro_socialist_media: "친사회주의 언론 대처"
 UKR_deal_pro_socialist_media_desc: "사회주의 정당들이 기세를 얻고 있으며, 그들의 언론을 억제해야 합니다."
 UKR_referendum_const: "헌법 국민투표"
 UKR_referendum_const_desc: "우리는 헌법 개정에 관한 전국 국민투표를 실시할 준비가 되어 있습니다."
 UKR_push_for_reforms: "개혁 추진"
 UKR_push_for_reforms_desc: "우리의 개혁 구상을 정부에 계속 추진할 것입니다. 우리 국가에는 이것이 필요합니다."
 UKR_arrest_timoshenko: "티모셴코 체포"
 UKR_arrest_timoshenko_desc: "티모셴코는 우리에게 너무나 위험한 정치적 경쟁자이므로, 그녀를 체포할 것입니다."
 UKR_prepare_protest: "시위 대비"
 UKR_prepare_protest_desc: "우리의 행동은 분명 일련의 시위를 불러일으킬 것이며, 이에 대비해야 합니다."
 UKR_reform_berkut: "베르쿠트 개혁"
 UKR_reform_berkut_desc: "베르쿠트 특수부대는 개혁되어야 하며, 그렇지 않으면 시위에 대한 통제력을 잃을 수 있습니다."
 UKR_deal_yushenko: "유셴코 처리"
 UKR_deal_yushenko_desc: "유셴코와 그의 정치적 야망을 처리할 것입니다."
 UKR_appoint_yanukovich: "야누코비치 임명"
 UKR_appoint_yanukovich_desc: "야누코비치를 정부 수반으로 임명할 것입니다. 어쩌면 그가 상황을 개선할 수 있을지도 모릅니다."
 UKR_seek_help_eastern_oligarch: "동부 올리가르히에게 도움 요청"
 UKR_seek_help_eastern_oligarch_desc: "우리의 자원으로는 시위 운동을 진압하기에 분명히 부족합니다. 어쩌면 동부 올리가르히들이 도와줄지도 모릅니다."
 UKR_aid_from_minign_companies: "광업 기업의 지원 확보"
 UKR_aid_from_minign_companies_desc: "광업 기업에 대한 우리의 투자가 결실을 맺을 것이며, 그 경영진은 우리에게 재정적 지원과 기타 지원을 제공할 준비가 될 것입니다."
 UKR_negotiate_orange_maidan: "오렌지 마이단과의 협상"
 UKR_negotiate_orange_maidan_desc: "이제 시위대와 협상에 들어가 이 문제를 단번에 해결할 때입니다."
 UKR_const_reform: "헌법 개혁"
 UKR_const_reform_desc: "우리는 시위 운동을 통해 마침내 우리의 개혁을 정부에 관철시킬 수 있었습니다."
 UKR_lyvochkin: "료보치킨 해법"
 UKR_lyvochkin_desc: "우리의 수석 고문은 시위대와 타협해야 한다고 분명히 말했습니다. 그렇지 않으면 우리나라는 혼란에 직면할 것입니다."
 UKR_stay_for_fair_election: "\\"공정한\\" 선거까지 버티기"
 UKR_stay_for_fair_election_desc: "우리는 권력을 그렇게 쉽게 내놓지 않을 것이며, 끝까지 버틸 것입니다."
 UKR_yusha_tt: "§Y이로 인해 유셴코 내각 갈래의 중점을 수행할 수 없게 됩니다§!"
 UKR_yana_tt: "§Y이로써 야누코비치 내각 중점을 완료할 수 있게 됩니다§!"
 UKR_political_situation_decision_category: "우크라이나의 정치적 긴장도"
 UKR_political_situation_decision_category_desc: "Political Tension measures the pressure on [UKR.GetFlag]§YUkraine§! from disputes over power, identity, corruption, and foreign alignment. It ranges from §Y0§! to §Y100§! and is currently §Y[?UKR.UKR_political_tension|0]§!.\n\nAfter Ukraine signs the EU association agreement, Political Tension above §Y60§! can trigger Euromaidan when the agreement is reconsidered. At §Y70§! or higher, Euromaidan becomes a severe crisis. Below §Y40§!, it can become a milder crisis in non-historical games."
 UKR_our_agricultrure: "국내 농업"
 UKR_our_agricultrure_desc: "우크라이나 농업은 세계 최고 수준 중 하나이며, 우리는 이 명성을 잃지 않도록 노력할 것입니다."
 UKR_azovsteel: "아조우스탈"
 UKR_unstable_government_idea: "마이단에 대한 불만"
 UKR_land_reform_idea: "토지 개혁"
 UKR_land_reform_idea_desc: "지난 세기에 시작된 토지 개혁은 전국의 토지 보유를 완전히 재분배하는 결과로 이어져야 합니다. 현재까지는 진행 중입니다."
 UKR_zaims: "대출 취소의 경제적 여파"
 UKR_banks_lobbyst_liquidate: "은행 로비스트 청산"
 UKR_mining_company_help: "광업 기업 세제 혜택"
 UKR_privatization_idea: "민영화"
 UKR_without_kuchma_idea: "쿠치마 없는 우크라이나"
 UKR_left_opposition_idea: "좌파 야당"
 UKR_luaz_idea: "LuAZ"
 UKR_anti_socialist_media: "반사회주의 언론"
 UKR_crisis_political: "정치 위기"
 UKR_crisis_political_desc: "우리나라는 정치 위기에 사로잡혀 있으며, 당국은 마비되었고 정치 세력들은 권력을 두고 서로 싸우고 있습니다."
 ukraine_kuchma.2.t: "시위 대비"
 ukraine_kuchma.2.d: "우리의 행동은 분명 시위로 이어질 것이며, 대비해야 합니다."
 ukraine_kuchma.2.a: "준비되어 있을 것이다"
 ukraine_kuchma.2.b: "모든 것은 저절로 해결될 것이다"
 ukraine_kuchma.12.t: "도네츠크 파벌과의 우호"
 ukraine_kuchma.12.d: "이른바 도네츠크 올리가르히 파벌을 우리 편으로 끌어들이려 합니다. 그들은 앞으로 야당과의 대결에서 우리에게 유용할 것입니다."
 ukraine_kuchma.12.a: "돈바스는 우리와 함께한다"
 ukraine_kuchma.12.b: "그들을 지원하지 않겠다"
 ukraine_kuchma.13.t: "대통령이 될 야누코비치"
 ukraine_kuchma.13.d: "우리는 대통령 선거 결선 투표 결과를 인정하지 않고 야누코비치를 우크라이나 대통령으로 임명할 것입니다."
 ukraine_kuchma.13.a: "그렇게 하자"
 UKR_spu_start: "우크라이나 사회당"
 UKR_spu_start_desc: "수년간의 분투 끝에 우리는 국민의 신뢰를 얻는 데 성공했습니다. 이제 위대한 개혁을 시작할 것입니다."
 UKR_spu_rada_position: "라다에서의 입장"
 UKR_spu_rada_position_desc: "통치의 열쇠는 입법부를 장악하는 것입니다. 우리 정책을 라다에서 통과시키기 위해 누구와 협력할지 결정해야 합니다."
 UKR_cpu_spu_coalition: "CPU/SPU 연립"
 UKR_cpu_spu_coalition_desc: "CPU와 SPU는 형제라고 할 수 있습니다. 두 당은 늘 단일 전선으로 선거에 참여해 왔습니다. 한쪽이 승리하면 두 당이 연립을 구성하리라는 것은 분명합니다."
 UKR_ditch_cpu: "CPU와의 거리 두기"
 UKR_ditch_cpu_desc: "CPU와 SPU는 형제라고 할 수 있습니다. 두 당은 늘 단일 전선으로 선거에 참여해 왔으나, CPU가 권력을 잡으면 공산주의 체제를 복원할 것이 분명합니다. 최대한 빨리 그들과 거리를 두어야 합니다."
 UKR_cpu_start: "우크라이나 공산당"
 UKR_cpu_start_desc: "우크라이나 공산당."
 UKR_cpu_rada_position: "라다에서의 입장"
 UKR_cpu_rada_position_desc: "통치의 열쇠는 입법부를 장악하는 것입니다. 우리 정책을 라다에서 통과시키기 위해 누구와 협력할지 결정해야 합니다."
 UKR_cpu_monocoalition: "단일 연립"
 UKR_cpu_monocoalition_desc: "단일 연립은 우크라이나 정치의 용어로, 한 정당만으로 구성된 정부를 가리킵니다. CPU 단일 연립을 구성하면 입법부와 행정부를 손쉽게 장악하고 소련 복원을 시작할 수 있습니다."
 UKR_back_to_soviet_tracks: "소련 시대로의 복귀"
 UKR_back_to_soviet_tracks_desc: "소련 붕괴 이후 우리나라는 이 위대한 국가의 유산으로 남은 모든 것을 잃고, 놓치고, 파괴하기만 했습니다. 우리는 이 흐름을 바꿀 것입니다."
 UKR_commie_russia_trade: "러시아와의 동반자 관계"
 UKR_commie_russia_trade_desc: "우리는 양국 간의 우호 관계를 강화할 생각입니다."
 UKR_commie_russia_rjd: "러시아 철도와의 동반자 관계"
 UKR_commie_russia_rjd_desc: "러시아 철도는 우리에게 훌륭한 동반자가 될 것이며, 그들의 도움으로 우리의 기반시설이 크게 개선될 것입니다."
 UKR_commie_russia_banks: "러시아 은행"
 UKR_commie_russia_banks_desc: "러시아 은행이 우리 영토에 진입하도록 허용할 준비가 되어 있습니다. 그들의 재정 역량은 우리의 발전에 도움이 될 것입니다."
 UKR_commie_russia_gas: "새로운 가스 계약"
 UKR_commie_russia_gas_desc: "우리는 러시아와 우리에게 유리한 조건으로 새로운 가스 계약을 체결할 준비가 되어 있습니다."
 UKR_commie_china_trade: "중국과의 동반자 관계"
 UKR_commie_china_trade_desc: "우리는 양국 간의 우호 관계를 강화할 생각입니다."
 UKR_commie_china_trains: "중국 열차 구매"
 UKR_commie_china_trains_desc: "보급을 개선하는 데 도움이 될 열차 여러 대를 중국에서 구매할 것입니다."
 UKR_comsomol: "콤소몰 부활"
 UKR_comsomol_desc: "콤소몰 운동은 새로운 세대의 의식 속에 우리 체제의 이념적 기둥으로서 부활되어야 합니다."
 UKR_commie_china_infra: "철도 현대화"
 UKR_commie_china_infra_desc: "우리의 중국 동료들이 우리나라 철도망의 현대화에 자금을 대기로 합의했습니다."
 UKR_commie_china_huawei: "화웨이와의 협력"
 UKR_commie_china_huawei_desc: "이 중국 기업과 긴밀한 협력 관계를 구축할 것입니다."
 UKR_commie_motor_sich: "모토르시치 확장"
 UKR_commie_motor_sich_desc: "우리의 핵심 기업인 모토르시치의 발전에 추가 자금을 투입할 것입니다."
 UKR_ukr_pioners: "피오네르 부활"
 UKR_ukr_pioners_desc: "피오네르가 부활되어야 합니다. 청년들은 도덕적 지침을 잃었으며 다시 사회주의의 길로 인도되어야 합니다."
 UKR_one_union_for_all: "단일 국가 노동조합"
 UKR_one_union_for_all_desc: "단일 노동조합을 창설하여 전국 노동자의 권리를 보호할 것입니다."
 UKR_remilitarization: "재무장"
 UKR_remilitarization_desc: "우리 국가는 강력한 군대를 갖추어야 하며, 따라서 즉각적인 재무장 절차를 시작할 것입니다."
 UKR_arms_zavods: "군 공장에 투자"
 UKR_arms_zavods_desc: "우리의 군수 산업은 소련 붕괴 이후 파괴되었으며, 이제 이를 되살릴 때입니다."
 UKR_sbu_kgb: "KGB 방식"
 UKR_sbu_kgb_desc: "옛 KGB 학교를 재건해야 하며, 이는 우리 요원들의 전문성을 분명히 높일 것입니다."
 UKR_arms_tanks: "전차 중시"
 UKR_arms_tanks_desc: "우리 군은 전차가 시급히 필요하며, 우리는 그 필요를 충족시킬 것입니다."
 UKR_revolut_in_blr: "벨라루스 사회주의 혁명"
 UKR_revolut_in_blr_desc: "형제 벨라루스 국민이 통치자들과 자본가들에게 억압받고 있습니다! 그들을 해방시킵시다!"
 UKR_revolution_in_russia: "러시아 사회주의 혁명"
 UKR_revolution_in_russia_desc: "형제 러시아 국민이 통치자들과 자본가들에게 억압받고 있습니다! 그들을 해방시킵시다!"
 UKR_befriend_russia_com: "러시아와의 우정"
 UKR_befriend_russia_com_desc: "우리는 러시아와 동반자 관계 및 우호 관계를 수립할 생각입니다."
 UKR_befriend_belarus_com: "벨라루스와의 우정"
 UKR_befriend_belarus_com_desc: "우리는 벨라루스와 동반자 관계 및 우호 관계를 수립할 생각입니다."
 UKR_central_asia_revolt: "중앙아시아의 혁명"
 UKR_central_asia_revolt_desc: "우리는 이 지역에도 혁명의 깃발을 올릴 생각입니다."
 UKR_caucasus_revolut: "캅카스의 혁명"
 UKR_caucasus_revolut_desc: "우리는 이 지역에도 혁명의 깃발을 올릴 생각입니다."
 UKR_baltic_revolut: "발트 국가들의 혁명"
 UKR_baltic_revolut_desc: "우리는 이 지역에도 혁명의 깃발을 올릴 생각입니다."
 UKR_revolut_in_mol: "몰도바 사회주의 혁명"
 UKR_revolut_in_mol_desc: "형제 몰도바 국민이 통치자들과 자본가들에게 억압받고 있습니다! 그들을 해방시킵시다!"
 UKR_csto_com_app: "CSTO 가입"
 UKR_csto_com_app_desc: "우리의 형제 민족들은 CSTO 회원국이며, 그들과 함께할 가치가 있을지도 모릅니다."
 UKR_integration_support: "구 공화국들의 통합"
 UKR_integration_support_desc: "구 공화국들의 통합 절차를 시작할 것입니다."
 UKR_declare_ussr: "소련 부활"
 UKR_declare_ussr_desc: "우리야말로 소련의 진정한 계승자입니다! 이 위대한 국가를 되살릴 때입니다!"
 UKR_nationalize_everything: "국유화 개시"
 UKR_nationalize_everything_desc: "자본가들에게 아무것도 내주지 않을 것입니다! 기업들은 국가의 품으로 돌아올 것입니다!"
 UKR_social_propaganda: "사회 개혁"
 UKR_social_propaganda_desc: "빈곤층의 마음을 얻을 수 있는 대규모 사회 개혁을 시작할 것입니다."
 UKR_christian_communism_desc: "종교를 금지한 것은 우리가 반복하지 않을 실수 중 하나였습니다. 기독교 공산주의가 우리의 미래입니다. 결국 예수 자신도 공산주의자였습니다!"
 UKR_criminalize_oligrachy: "올리가르히 범죄화"
 UKR_criminalize_oligrachy_desc: "올리가르히들은 수년간 우리나라의 피를 빨아 왔고, 우리 증조부들이 만든 재산을 팔아넘겨 왔습니다. 이제 그만하면 충분합니다!"
 UKR_land_to_people: "토지를 인민에게!"
 UKR_land_to_people_desc: "토지는 인민의 것이어야 합니다! 한 줌의 올리가르히와 도적들의 것이 아닙니다."
 UKR_revive_soviet_factories: "소련 공장 부활"
 UKR_revive_soviet_factories_desc: "소련의 유산으로 남아 있던 많은 기업이 약탈당하고 파괴되었으며, 우리는 이들을 다시 되살릴 것입니다."
 UKR_regions_ditch: "지역당과의 연립 포기"
 UKR_regions_ditch_desc: "우리는 이 정당과 연립을 구성하지 않을 것입니다. 그것은 우리에게 문제만 가져올 뿐입니다."
 UKR_regions_integr: "지역당과의 연립"
 UKR_regions_integr_desc: "우리는 이 정당과 연립을 구성할 것이며, 이는 우리의 정치적 역량을 강화할 것입니다."
 UKR_socialist_ukraine_effort: "사회주의 개혁"
 UKR_socialist_ukraine_effort_desc: "우리의 정치적 입지를 강화할 일련의 개혁을 시작할 것입니다."
 UKR_pensions_for_elders_incr: "연금 인상"
 UKR_pensions_for_elders_incr_desc: "시민들이 기꺼이 은퇴할 수 있도록 연금 지급액을 늘릴 것입니다."
 UKR_full_rabota: "노동 개혁"
 UKR_full_rabota_desc: "시민들의 근로 여건을 개선하기 위해 노동법에 대한 본격적인 개혁을 추진할 것입니다."
 UKR_socialist_democratic_policies: "사회민주주의 국가"
 UKR_socialist_democratic_policies_desc: "사회민주주의의 깃발 아래 새로운 미래가 우리나라를 기다리고 있습니다."
 UKR_start_to_support: "빈곤층 지원 시작"
 UKR_start_to_support_desc: "우리의 지지층은 우리의 개혁이 전임 정부가 끌고 들어간 경제적 나락에서 자신들을 건져 주기를 바라는 저소득 시민들입니다. 우리는 그들을 도울 것입니다."
 UKR_progressive_taxation: "누진 과세"
 UKR_progressive_taxation_desc: "We intend to introduce progressive taxation for greater economic equality of our citizens."
 UKR_social_conservative_prog: "사회 보수주의 프로그램"
 UKR_social_conservative_prog_desc: "우리나라 정치 분야의 사회 보수주의 대표자들에게서 영감을 받은 여러 개혁을 추진할 생각입니다."
 UKR_ukr_cossack_freedom: "코사크의 자유"
 UKR_ukr_cossack_freedom_desc: "우리 시민은 자유로운 코사크와 같아서, 더 이상 자본의 노예도, 그 누구의 노예도 아닙니다."
 UKR_nationalization_of_big_com: "대기업 국유화"
 UKR_nationalization_of_big_com_desc: "대기업에 대한 일련의 국유화를 시행할 것입니다."
 UKR_crusade_against_inequality: "불평등과의 싸움"
 UKR_crusade_against_inequality_desc: "우리 사회의 불평등이 갈수록 뚜렷해지고 있으며, 우리는 사회 계층 간의 경제적 경계를 완화하기 위한 경제적, 정치적 프로그램을 시작할 것입니다."
 UKR_reduce_cap_oligrach: "올리가르히 영향력 약화"
 UKR_reduce_cap_oligrach_desc: "올리가르히들은 우리나라에 너무 큰 영향력을 행사하고 있으며, 이제 이 문제를 처리할 때입니다."
 UKR_people_brotherhood: "형제적 단결"
 UKR_people_brotherhood_desc: "우리 국민, 우리나라에 사는 여러 민족은 외부의 위협에 맞서는 단합된 형제애를 이루어야 합니다."
 UKR_ask_russia_to_give_nukes: "러시아에 핵무기 요청"
 UKR_ask_russia_to_give_nukes_desc: "외부 위협으로부터 나라를 보호하기 위해 러시아에 핵무기 비축분 일부를 요청할 생각입니다."
 UKR_reduce_foreign_influence: "외국 영향력 축소"
 UKR_reduce_foreign_influence_desc: "우리나라에 대한 외국의 영향력을 약화시킬 것입니다. 독립은 우리의 토대입니다."
 UKR_labourr_unions: "노동조합 지원"
 UKR_labourr_unions_desc: "나라 안에 긍정적인 노동 환경을 만들기 위해 국내 노동조합을 적극 보호할 것입니다."
 UKR_immigartion_easing: "이민 완화"
 UKR_immigartion_easing_desc: "우리의 국경은 장벽으로 닫혀서는 안 되므로 이민 절차를 완화할 것입니다."
 UKR_uindependence_prop: "국내 투자자 보호"
 UKR_uindependence_prop_desc: "국내 투자자를 저버려서는 안 되며, 이것이 우리 경제의 성장을 강화하는 유일한 방법입니다."
 UKR_dont_touch_west_inv: "서방 투자자 우선"
 UKR_dont_touch_west_inv_desc: "서방 투자자를 보호하는 데 노력을 집중할 것입니다."
 UKR_pro_russian_approach: "친러시아 노선"
 UKR_pro_russian_approach_desc: "우리는 러시아를 기준점으로 삼을 것입니다. 역사적으로 우리는 그들과 같은 길 위에 있을 뿐입니다."
 UKR_pro_western_approach: "친서방 노선"
 UKR_pro_western_approach_desc: "우리는 우리의 길, 서방으로 가는 길을 택했습니다."
 UKR_request_protection_from_rus: "러시아의 보호 요청"
 UKR_request_protection_from_rus_desc: "러시아가 우리나라를 보호할 수 있도록 보호 및 방위에 관한 협정을 체결하려 시도할 것입니다."
 UKR_apply_economic_union: "러시아 경제 구역 가입"
 UKR_apply_economic_union_desc: "러시아와의 경제 협력은 우리에게 경제 성장과 수익성 있는 계약을 가져다줄 것입니다."
 UKR_donbas_peaceful: "분리주의 문제의 평화적 해결"
 UKR_donbas_peaceful_desc: "우리에게서 분리된 영토들과의 문제를 평화적으로 해결할 준비가 되어 있습니다."
 UKR_csto_apply: "CSTO 가입"
 UKR_csto_apply_desc: "우리는 CSTO의 일원이 될 생각입니다. 이 동맹의 회원국들만이 우리를 보호하는 데 진정으로 관심이 있다고 봅니다."
 UKR_western_socialists_coalition: "서방 정당들과의 연립"
 UKR_western_socialists_coalition_desc: "친서방 정당들과 연립을 구성할 생각입니다."
 UKR_harsh_separat_dealkill: "분리주의자 척결"
 UKR_harsh_separat_dealkill_desc: "우리는 우리 영토를 해방할 준비가 되어 있습니다."
 UKR_apply_eu_reforms: "친유럽 개혁 채택"
 UKR_apply_eu_reforms_desc: "우리는 유럽식 정치 노선을 따를 생각입니다."
 UKR_nato_commitment: "NATO 개혁"
 UKR_nato_commitment_desc: "장차 NATO에 가입하기 위해 NATO 표준에 맞는 군 개혁을 추진할 생각입니다."
 UKR_pmr_invite_union: "트란스니스트리아에 통합 국가 제안"
 UKR_pmr_invite_union_desc: "우리는 더 나아가 외부 세력의 영향을 받지 않는 새로운 국가를 유럽에 건설하고, 이 국가를 키울 적절한 후보를 확보할 생각입니다."
 UKR_belarus_invite: "벨라루스에 통합 국가 제안"
 UKR_belarus_invite_desc: "우리는 더 나아가 외부 세력의 영향을 받지 않는 새로운 국가를 유럽에 건설하고, 이 국가를 키울 적절한 후보를 확보할 생각입니다."
 UKR_hungary_invite: "헝가리에 통합 국가 제안"
 UKR_hungary_invite_desc: "우리는 더 나아가 외부 세력의 영향을 받지 않는 새로운 국가를 유럽에 건설하고, 이 국가를 키울 적절한 후보를 확보할 생각입니다."
 UKR_moldova_invite: "몰도바에 통합 국가 제안"
 UKR_moldova_invite_desc: "우리는 더 나아가 외부 세력의 영향을 받지 않는 새로운 국가를 유럽에 건설하고, 이 국가를 키울 적절한 후보를 확보할 생각입니다."
 ukraine_rada.2.t: "SPU와 연립?"
 ukraine_rada.2.d: "오랜 기간 사회주의자들은 우리의 차이에도 불구하고 우리의 동맹이었습니다. SPU 당원 다수는 한때 우리 당의 당원이었으며, 오랜 관계의 역사는 연립을 당연한 선택으로 만듭니다. 그러나 사회주의자들은 점차 우리에게서 멀어지며 훨씬 온건해지고 수정주의에 물들고 있어, 공동 정부 아래에서는 가장 급진적인 정책을 시행할 수 없을 것입니다."
 ukraine_rada.2.b: "SPU는 될 대로 되라지. 단일 연립을 선언한다!"
 ukraine_rada.2.a: "연립 협상을 시작하자"
 ukraine_rada.1.t: "CPU와 연립?"
 ukraine_rada.1.d: "오랜 기간 공산주의자들은 그들의 차이에도 불구하고 우리의 동맹이었습니다. 우리 당원 다수는 CPU의 당원이었으며, 오랜 관계의 역사는 연립을 필연으로 만듭니다. 그러나 공산주의자들은 퇴행적인 사상을 옹호하고 식인적인 구상을 지지하며 시대에 발맞추기를 거부하고 있고, 그들과의 연립은 CPU의 일부 급진파가 권력을 잡도록 허용할 수도 있습니다."
 ukraine_rada.1.b: "CPU는 될 대로 되라지!"
 ukraine_rada.1.a: "연립 협상을 시작하자"
 ukraine_kommi.1.t: "핵무기를 요청하는 우크라이나"
 ukraine_kommi.1.d: "우크라이나 정부로부터 예상치 못한 발표가 나왔습니다. 그들은 외부의 공격으로부터 스스로를 방어하기 위해 우리에게서 핵무기를 얻고자 합니다. 이처럼 위험한 결정은 장단점을 따져 볼 것을 요구합니다."
 ukraine_kommi.1.a: "핵무기를 제공하겠다"
 ukraine_kommi.1.b: "핵무기를 제공하지 않겠다"
 ukraine_kommi.2.t: "러시아의 핵무기"
 ukraine_kommi.2.d: "그들이 핵무기 일부를 우리에게 제공하기로 동의했습니다."
 ukraine_kommi.2.a: "좋아"
 ukraine_kommi.4.t: "새로운 공산주의 국가"
 ukraine_kommi.4.d: "우리의 혁명이 성공했습니다. 이곳의 구체제는 끝났지만, 우리는 아직 홀로 설 수 없습니다. 우크라이나가 우리가 자리를 잡는 동안 우리 정부를 후원하겠다고 제안했습니다."
 ukraine_kommi.4.a: "그들의 지원을 받아들인다"
 ukraine_kommi.5.t: "군사 협력을 제안하는 우크라이나"
 ukraine_kommi.5.d: "우크라이나 정부는 양국 간 군사·정치 협력에 관한 여러 문서에 서명할 준비가 되어 있다고 밝혔습니다."
 ukraine_kommi.5.a: "우리는 우크라이나와의 우정을 지지한다"
 ukraine_kommi.5.b: "아무것에도 서명하지 않겠다"
 ukraine_kommi.6.t: "러시아와의 군사 협력"
 ukraine_kommi.6.d: "그들이 우리와 군사·정치 협력에 관한 협정에 서명하기로 동의했습니다."
 ukraine_kommi.6.a: "니스"
 ukraine_kommi.7.t: "러시아와의 군사 협력"
 ukraine_kommi.7.d: "그들이 우리와 군사·정치 협력에 관한 협정에 서명하기를 거부했습니다."
 ukraine_kommi.7.a: "슬프군"
 ukraine_kommi.8.t: "통합 민주 국가"
 ukraine_kommi.8.d: "우크라이나 정부는 광활한 유럽 땅에 일종의 제3의 권력 중심이 될 단일 민주 국가를 건설하자고 제안했습니다. 제3세력이라는 꿈을 위해 독립을 잃는 데 동의해야 할까요?"
 ukraine_kommi.8.a: "독립은 허구다"
 ukraine_kommi.8.b: "절대 안된다"
 ukraine_kommi.9.t: "통합 민주 국가"
 ukraine_kommi.9.d: "그들이 우리의 제안을 거절했습니다! 예상된 일이지만 그들로서는 참으로 한심한 일입니다."
 ukraine_kommi.9.a: "그들은 이해하지 못한다"
 ukraine_kommi.10.t: "보호를 요청하는 우크라이나"
 ukraine_kommi.10.d: "우크라이나 정부는 자국의 독립을 지킬 수 있도록 보장을 제공해 달라고 우리에게 요청했습니다. 예상치 못한 요청이지만 한번 고려해 볼 만할지도 모릅니다."
 ukraine_kommi.10.a: "그들을 보호하겠다"
 ukraine_kommi.10.b: "절대 안된다"
 ukraine_kommi.11.t: "러시아의 보호 보장"
 ukraine_kommi.11.d: "러시아 정부가 우리에게 독립 보장을 제공하기로 동의했습니다!"
 ukraine_kommi.11.a: "좋아"
 ukraine_kommi.12.t: "러시아의 보호 보장"
 ukraine_kommi.12.d: "러시아 정부가 우리에게 독립 보장을 제공하기를 거부했습니다."
 ukraine_kommi.12.a: "젠장"
 ukraine_kommi.13.t: "우크라이나와의 가스 계약."
 ukraine_kommi.13.d: "우크라이나는 우리 가스 계약의 구매 가격을 인하하자고 제안했으며, 그 대가로 양국 사이의 중개자를 없애겠다고 합니다. 이렇게 되면 우리가 그들에게 더 큰 영향력을 갖게 될 것인데, 동의해야 할까요?"
 ukraine_kommi.13.a: "서명하겠다"
 ukraine_kommi.13.b: "관심 없다."
 ukraine_kommi.14.t: "러시아와의 가스 계약."
 ukraine_kommi.14.d: "그들이 우리 가스 계약의 조건을 변경하는 데 동의했으며, 이제 우리는 더 적게 지불하게 됩니다!"
 ukraine_kommi.14.a: "좋아"
 ukraine_kommi.15.t: "러시아와의 가스 계약."
 ukraine_kommi.15.d: "그들이 우리 가스 계약의 조건을 변경하는 데 동의했으며, 이제 우리는 더 적게 지불하게 됩니다!"
 ukraine_kommi.15.a: "좋아"
