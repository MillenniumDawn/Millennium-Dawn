 engine_prop_quad_1: "Ранняя четырёхдвигательная винтовая установка"
 engine_prop_quad_1_desc: "Винтовые двигатели времён Второй мировой войны все еще обеспечивали необходимую тягу, позволяющую самолётам вести боевые действия, особенно в условиях ограниченного бюджета.$ENGINE_INFO$"
