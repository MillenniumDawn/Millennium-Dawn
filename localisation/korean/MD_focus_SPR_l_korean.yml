 spain.14.d: "갈리시아의 시위가 극단주의 세력과 기회주의자들에 의해 대규모 폭동으로 변질되며 파괴적으로 번졌습니다. 도시의 혼란 속에서 우리는 통제를 완화하거나, 폭도를 해산시키기 위해 특수 진압 부대를 투입해야 합니다."
 spain.14.a: "그들의 체제에서 그들을 끌어내리자"
 spain.14.b: "기동대를 배치시켜라"
