 GER_infantry_weapons_1_desc: "Heckler & Koch G3 (Gewehr 3) — это автоматическая боевая винтовка калибра 7,62x51 мм НАТО, разработанная в Западной Германии в 1950-х годах немецким производителем вооружений Heckler & Koch (H&K) в сотрудничестве с испанским государственным конструкторским агентством CETME. G3 заменила FN FAL/G1 в качестве стандартной винтовки с 1959 года и использовалась до модернизации до улучшенной модели G3A1 в 1963 году."
