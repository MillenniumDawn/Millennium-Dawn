 TOG.liberalism: "£generic_liberalism_small (CPP) 泛非爱国联盟"
 TOG.liberalism_desc: "（泛非自由主义） - 泛非爱国联盟由埃德姆·科乔于1999年创立，由四个小党合并而成。该党由其领导人埃德姆·科乔一人主导，自身选举成绩平平，意识形态上倾向于较为温和的泛非主义。科乔本人自上世纪70年代末以来一直活跃于政坛，甚至曾担任非洲统一组织秘书长。"
 TOG.socialism: "£generic_socialism_small (UFC) 变革力量联盟"
 TOG.socialism_desc: "（右翼社会民主主义） - 变革力量联盟成立于1992年，由几个政党组成，最初主要作为其创始人吉尔克里斯特·奥林匹奥的政治工具。该党本身奉行标准的、温和的社会民主主义意识形态，并通过奥林匹奥试图保持其在多哥反对派中的主导地位。"
 TOG.anarchist_communism: "£generic_anarchist_communism_small (CST) 拯救多哥联盟"
 TOG.anarchist_communism_desc: "（左翼阵营） - “拯救多哥联盟”由多个左翼政党联合组成，它将内部各左翼政治力量团结在进步变革和民主改革的旗帜下。该组织一直积极开展反对国内腐败和专制统治的活动。"
 TOG.Neutral_Autocracy: "£generic_Neutral_Autocracy_small (RPT) 多哥人民集会"
 TOG.Neutral_Autocracy_desc: "（泛非民族主义） - 多哥人民集会成立于1969年，是格纳辛贝·埃亚德马的政治工具。从1979年到1991年，该党作为多哥唯一的合法政党执政。在多哥向民主过渡后，该党曾一度被取缔，但效忠于前政权的军队迫使新政府向多哥人民集会做出让步。该党在意识形态上以埃亚德马为中心，支持他的独裁泛非民粹主义意识形态和统治。"
 TOG.Neutral_Autocracy_2012: "£generic_Neutral_Autocracy_small (UNIR)共和联盟"
 TOG.Neutral_Autocracy_2012_desc: "（民族保守主义） - 成立于2012年的共和联盟是多哥人民集会的继承者，它试图摆脱前身政党盛行的个人崇拜。然而，在意识形态上，它仍然与多哥人民集会相似，具有专制倾向，并在社会和经济问题上严重偏向右翼。"
 TOG.Neutral_conservatism: "£generic_Neutral_conservatism_small (NET) 新多哥承诺"
 TOG.Neutral_conservatism_desc: "（大帐篷） - 作为左翼彩虹联盟的成员，新多哥承诺党本身也是该国较大的反对党之一。该党反对专制统治，倡导在多哥进行民主改革。"
 TOG.Neutral_green: "£generic_Neutral_green_small (ANC) 全国变革联盟"
 TOG.Neutral_green_desc: "（进步主义）- 从规模更大的变革力量联盟分裂出来的全国变革联盟，坚持进步纲领，致力于反对多哥的独裁统治。该党一直活跃于多哥反对派阵营，与其他政党合作，推行其改革纲领中的各项举措。"
 TOG.neutral_Social: "£generic_neutral_Social_small (CAR) 复兴行动委员会"
 TOG.neutral_Social_desc: "（进步主义） - 该党最初以“复兴协会联盟”的名义成立，主张民主，其现代形式于1991年出现。该党由人权律师兼民主倡导者亚沃维·阿格博伊博创立，即使在官方宣布一党制结束之后，该党仍然非常重视其反独裁立场。"
 TOG.neutral_Social_2012: "£generic_neutral_Social_small 彩虹联盟"
 TOG.neutral_Social_2012_desc: "（左翼阵营） - 彩虹联盟成立于2012年，是由多哥境内多个左翼、改革派和亲民主政党组成的联盟，其共同目标是建立一个自由民主的国家。该联盟致力于增强反对派的力量，并提出更加清晰连贯的纲领和愿景。"
 TOG.Nat_Autocracy: "£generic_Nat_Autocracy_small (FAT) 多哥武装力量"
