paved_urban_roads: "Paved Connector Roads"
paved_urban_roads_desc: "Roads only a few minutes outside of Darwin are made of pebble or dirt. To support the trucking needs of companies we'll need to amend that."
channel_island_power_plant: "Channel Island Gas Power Plant"
channel_island_power_plant_desc: "Expanding the facility to incorporate flexible General Electric and Rolls-Royce gas turbines will supplement our increased power needs."
uterne_solar_power_plant: "Uterne Solar Plant"
uterne_solar_power_plant_desc: "Planned to be built just outside of Alice Springs and first of its design, the plant is expected to triple the power capacity of the region."
expand_port_darwin: "Expand Port Darwin"
expand_port_darwin_desc: "If the north is going to become an export metropolis, the port needs to reflect that. Thousands of tons of produce is going to be shipping out of it, and the infrastructure needs to be ready."
nt_airport_upgrades: "NT Airport Upgrades"
nt_airport_upgrades_desc: "An upgrade plan for the airports in Darwin and Alice Springs, installing new storage and runway extensions."
pastoral_lease_framework: "Pastoral Lease Framework"
