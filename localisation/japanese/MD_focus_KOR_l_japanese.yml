 asian_nelson_mandela: "アジアのネルソン・マンデラ"
 KOR_idea_growth_by_innovation: "革新による成長"
 KOR_uneven_economy_2: "不均等な経済"
 KOR_uneven_economy_2_desc: "必然的に、両朝鮮間の経済発展レベルの大きな格差は再統一後に影響を与えている。新しい朝鮮国家が完全な経済的可能性を解き放つためには、この不均衡は是正されなければならない。"
 KOR_uneven_economy_3: "計画経済"
 KOR_uneven_economy_3_desc: "計画経済とは、投資、生産、資本財の配分が経済全体の経済計画および生産計画に従って行われる経済システムの一種である。計画経済は、中央集権的、分散的、参加型、またはソビエト型の経済計画形態を使用することができる。意思決定と参加における中央集権化または分散化のレベルは、採用される特定の計画メカニズムの種類に依存する。"
 KOR_uneven_economy_3_1: "計画経済"
 KOR_uneven_economy_3_1_desc: "計画経済とは、投資、生産、資本財の配分が経済全体の経済計画および生産計画に従って行われる経済システムの一種である。計画経済は、中央集権的、分散的、参加型、またはソビエト型の経済計画形態を使用することができる。意思決定と参加における中央集権化または分散化のレベルは、採用される特定の計画メカニズムの種類に依存する。"
 KOR_uneven_economy_3_2: "計画経済"
 KOR_uneven_economy_3_2_desc: "計画経済とは、投資、生産、資本財の配分が経済全体の経済計画および生産計画に従って行われる経済システムの一種である。計画経済は、中央集権的、分散的、参加型、またはソビエト型の経済計画形態を使用することができる。意思決定と参加における中央集権化または分散化のレベルは、採用される特定の計画メカニズムの種類に依存する。"
 KOR_uneven_economy_4: "市場の支援"
 KOR_uneven_economy_4_desc: "We will keep a hand under our economy. While not dictating the market, we will support business and do what we can to support the entirety of our economy"
 KOR_uneven_economy_4_1: "市場の支援"
 KOR_uneven_economy_4_1_desc: "我々は経済の下に手を差し伸べるだろう。なぜ市場を指示しないのか？我々はビジネスを支援し、経済全体を支援するためにできることをするだろう。"
 KOR_uneven_economy_4_2: "市場の支援"
 KOR_uneven_economy_4_2_desc: "我々は経済の下に手を差し伸べるだろう。なぜ市場を指示しないのか？我々はビジネスを支援し、経済全体を支援するためにできることをするだろう。"
 KOR_uneven_economy_5: "自由市場"
 KOR_uneven_economy_5_desc: "経済学において、自由市場とは、商品やサービスの価格が売り手と買い手によって表現される需要と供給によって決定される経済システムの理想化された認知モデルである。モデル化されたそのような市場は、政府や他のいかなる外部権力の介入なしに運営される。規範的理想としての自由市場の支持者は、政府が税金や規制などの様々な方法で需要と供給に介入する規制市場と対比する。理想化された自由市場経済では、商品やサービスの価格は参加者の入札と提示によってのみ設定される。"
 KOR_uneven_economy_5_1: "自由市場"
 KOR_uneven_economy_5_1_desc: "経済学において、自由市場とは、商品やサービスの価格が売り手と買い手によって表現される需要と供給によって決定される経済システムの理想化された認知モデルである。モデル化されたそのような市場は、政府や他のいかなる外部権力の介入なしに運営される。規範的理想としての自由市場の支持者は、政府が税金や規制などの様々な方法で需要と供給に介入する規制市場と対比する。理想化された自由市場経済では、商品やサービスの価格は参加者の入札と提示によってのみ設定される。"
 KOR_uneven_economy_5_2: "自由市場"
 KOR_uneven_economy_5_2_desc: "経済学において、自由市場とは、商品やサービスの価格が売り手と買い手によって表現される需要と供給によって決定される経済システムの理想化された認知モデルである。モデル化されたそのような市場は、政府や他のいかなる外部権力の介入なしに運営される。規範的理想としての自由市場の支持者は、政府が税金や規制などの様々な方法で需要と供給に介入する規制市場と対比する。理想化された自由市場経済では、商品やサービスの価格は参加者の入札と提示によってのみ設定される。"
 united_korea_modifiers: "統一朝鮮"
 korea_south_focus: "韓国 国家方針ツリー"
 KOR_CELLTRION: "セルトリオン製薬"
 KOR_CELLTRION_desc: "主要なバイオテクノロジー・製薬企業であるセルトリオンの役割を、国防と医療分野において拡大する。"
 KOR_establish_research_centers: "研究センターの設立"
 KOR_establish_research_centers_desc: "医学と科学における画期的な進展を支えるため、先進的な研究施設を整備しなければならない。"
 KOR_biotechnology_focus: "バイオテクノロジーへの注力"
 KOR_biotechnology_focus_desc: "バイオテクノロジーは、韓国の現代医療産業複合体の礎となる。"
 KOR_civilians_first: "民間人優先"
 KOR_civilians_first_desc: "強靭な医療部門を構築するにあたり、民間医療とパンデミック対応を最優先としなければならない。"
 KOR_perfect_soldier: "完璧な兵士"
 KOR_perfect_soldier_desc: "バイオテクノロジーで強化された兵士の研究は、戦争の未来を変えるかもしれない。"
 KOR_hospitals: "病院の近代化"
 KOR_hospitals_desc: "病院の設備更新は、民間医療の向上と戦闘即応性の確保につながる。"
 KOR_ultimate_protection: "究極の防護"
 KOR_ultimate_protection_desc: "バイオテクノロジーと軍事ドクトリンを組み合わせることで、我々の兵士を世界で最も強固に守られた存在にする。"
 KOR_army_support: "軍事支援契約"
 KOR_army_support_desc: "軍事契約は重要企業に資金を提供し、新技術の開発を促進する。"
 KOR_posco: "ポスコ製鉄拡張"
 KOR_posco_desc: "ポスコは海外市場、鉄鋼輸出、そして海外インフラ契約を拡大する。"
 KOR_posco_india: "ポスコインド構想"
 KOR_posco_india_desc: "インドは巨大な鉄鋼市場を提供する。ポスコの投資は我々の世界的存在感を強化する。"
 KOR_production_in_mexico: "ポスコのメキシコにおける生産"
 KOR_production_in_mexico_desc: "メキシコに拠点を設立することで、アメリカ市場および世界貿易圏へのアクセスを確保する。"
 KOR_gwangyang_galvanizing: "光陽亜鉛めっき施設"
 KOR_gwangyang_galvanizing_desc: "光陽の近代的な亜鉛めっき設備への改修は、国内の軍需および建設供給網を強化する。"
 KOR_develop_vietnam: "ベトナム事業の展開"
 KOR_develop_vietnam_desc: "ポスコのベトナム施設は東南アジア向け製造拠点となる。"
 KOR_argentina_facility: "ポスコアルゼンチン施設"
 KOR_argentina_facility_desc: "アルゼンチンはリチウムおよび重要鉱物を提供する。ポスコの拡張は資源供給の安全保障を確保する。"
 KOR_local_production: "国内鉄鋼生産"
 KOR_local_production_desc: "生産を国内へさらに移行することで、依存度を下げ、戦時の耐性を高める。"
 KOR_worlds_second: "世界第二の鉄鋼大手"
 KOR_worlds_second_desc: "世界的拡張を通じて、ポスコは世界第二位の鉄鋼生産企業となる。"
 KOR_samsung: "サムスン電子"
 KOR_samsung_desc: "サムスンは韓国の革新の象徴である。我々はその世界的な優位性をさらに推し進めなければならない。"
 KOR_samsung_galaxy_phones: "サムスンギャラクシー携帯電話開発"
 KOR_samsung_galaxy_phones_desc: "次世代スマートフォンへの研究開発は、世界の消費者向け電子機器分野における我々の地位を確固たるものにする。"
 KOR_samsung_thunder: "サムスンサンダー"
 KOR_samsung_thunder_desc: "K9サンダー自走砲を基盤とするサンダー計画は、高度な兵器輸出計画へと発展する。"
 KOR_samsung_thunder_tests: "サンダー野外試験"
 KOR_samsung_thunder_tests_desc: "K9サンダーの新型は、戦場での性能を確保するために厳格な野外試験を必要とする。"
 KOR_samsung_thunder_upgrade: "サンダーの改良"
 KOR_samsung_thunder_upgrade_desc: "自動化、装甲、精密性の強化により、K9の輸出競争力と火力はともに向上する。"
 KOR_samsung_thunder_production: "サンダーの量産"
 KOR_samsung_thunder_production_desc: "新型サンダー砲の本格的量産は、我々の軍需産業を世界水準へと引き上げる。"
 KOR_lg: "LG産業グループ"
 KOR_lg_desc: "化学から電子機器まで、LGは我々の最も多角的なコングロマリットの一つである。"
 KOR_lg_chem: "LG化学"
 KOR_lg_chem_desc: "LG化学は民間および軍事用途における電池と素材の革新を主導する。"
 KOR_lg_first: "LGファースト構想"
 KOR_lg_first_desc: "市場投入を最優先とする戦略に注力することで、LGは世界的競争において先行し続ける。"
 KOR_lg_cns: "LG CNS拡張"
 KOR_lg_cns_desc: "CNSはAI、IT、そしてスマート政府インフラシステムを担当する。"
 KOR_ochang_plant: "梧倉工場の拡張"
 KOR_ochang_plant_desc: "梧倉はより迅速かつ効率的なハイテク生産のために改修される。"
 KOR_sbl_plant: "SBL工場の建設"
 KOR_sbl_plant_desc: "この新しいLG施設は先進的なリチウム電池開発を担う。"
 KOR_cloud_computing: "LGクラウドコンピューティング"
 KOR_cloud_computing_desc: "政府および民間産業をクラウドファースト体制へ移行させる国家的取り組み。"
 KOR_ai_focus: "人工知能への重点"
 KOR_ai_focus_desc: "自動化、軍事研究開発、そしてサイバーセキュリティのために、AI開発は国家的優先事項でなければならない。"
 KOR_economics_improvement: "経済改善計画"
 KOR_economics_improvement_desc: "我々は国内企業を強化し、世界的影響力を確保するための幅広い取り組みを開始する。"
 KOR_naver: "ネイバー技術拡張"
 KOR_naver_desc: "ネイバーはメディア、技術、デジタルインフラにおいて中心的な役割を果たす。"
 KOR_webtoon: "世界的なウェブトゥーンの輸出"
 KOR_webtoon_desc: "韓国のウェブトゥーンは新たな文化的輸出分野である。これへの投資はソフトパワーを支える。"
 KOR_naver_news: "ネイバーニュースの優位性"
 KOR_naver_news_desc: "ニュースプラットフォームを掌握することは、国内での影響力と国際的な到達力を強化する。"
 KOR_hyundai: "現代重工業"
 KOR_hyundai_desc: "現代は大規模な産業用造船およびエネルギー採掘計画を担うことになる。"
 KOR_offshore_industry: "海洋産業の拡大"
 KOR_offshore_industry_desc: "経済成長とエネルギー安全保障のために、我々は海洋インフラを近代化し拡張する。"
 KOR_offshore_oil: "海洋石油計画"
 KOR_offshore_oil_desc: "新たな海底資源を対象とすることで、増大するエネルギー需要を確実に満たす。"
 KOR_offshore_natural_gas: "海洋天然ガス田"
 KOR_offshore_natural_gas_desc: "天然ガスの採掘は収益を増加させ、エネルギー依存を低減する。"
 KOR_offshore_barge: "艀およびプラットフォームの建設"
 KOR_offshore_barge_desc: "移動式および固定式プラットフォームの建設は、海洋事業の成功に不可欠である。"
 korea_confederation_Share_name: "統一朝鮮技術グループ"
 korea_confederation_Share_desc: "Korea is finally united and now it is time for them to share their technology and become great again"
