 the_great_australia_act: "§2大澳大利亚法案§!"
 the_great_australia_act_desc: "这或许是我国历史上规模最大的社会改革计划。这是一项旨在提升澳大利亚社会平等、帮助数百万人摆脱贫困的宏伟工程。该计划全面覆盖福利体系，改革福利资格和覆盖范围，提高补助金，并推出一系列项目，帮助弱势群体摆脱困境。"
