 EQ_MOD_CAT_plane_droneswarm_weapon_TITLE: "드론 군집"
 mothership_equipment_1: "1세대 아스널 버드"
 mothership_equipment: "아스널 버드"
 mothership_equipment_desc: "거의 또는 완전히 자율 운용되는 대형 원자력 항공기입니다. 대량의 드론 항공기와 미사일을 싣고 전 세계를 비행하며 적 목표를 타격하도록 설계되었습니다."
 mothership: "아스널 버드"
 spec_nuclear_consent_desc: "항공기가 핵 폭장을 투하할 수 있게 하는 핵 사용 승인 체계입니다.\n\n§G설계 힌트: 항공기가 핵 타격을 수행하는 데 필수적인 모듈입니다.§!"
 weap_droneswarm_fighter_1: "전투 드론 떼"
 weap_droneswarm_fighter_1_desc: "적 항공기와 교전하여 격파하도록 설계된 드론입니다. \n\n§G설계 힌트: 이 모듈은 아스널 버드가 공대공 임무를 수행하는 데 필요합니다. 주 드론 떼 슬롯에 장착하면 해당 항공기가 아스널 버드가 됩니다.§!"
 weap_droneswarm_bomber_1: "폭격 드론 떼"
 weap_droneswarm_bomber_1_desc: "적의 지상 건물을 공격하고 근접 항공 지원 및 대병참 작전을 제공하도록 설계된 드론입니다. \n\n§G설계 힌트: 이 모듈은 아스널 버드가 지상 공격 임무를 수행하는 데 필요합니다. 주 드론 떼 슬롯에 장착하면 해당 항공기가 타격형 아스널 버드가 됩니다.§!"
 weap_droneswarm_anti_ship_1: "대함 드론 떼"
 weap_droneswarm_anti_ship_1_desc: "해상과 항구의 적 해군 자산을 추적, 교전, 격파하도록 설계된 드론입니다. \n\n§G설계 힌트: 이 모듈은 아스널 버드가 대함 임무를 수행하는 데 필요합니다. 주 드론 떼 슬롯에 장착하면 해당 항공기가 해상형 아스널 버드가 됩니다.§!"
 weap_missile_bay_1: "폭장 격납고"
 weap_missile_bay_1_desc: "아스널 버드에 내장된 거대한 격납고로, 드론이 발견한 목표에 대규모 타격을 가하도록 설계되었습니다. \n\n§G설계 힌트: 드론 떼 격납고에만 장착할 수 있습니다. 항공기의 역할을 바꾸지 않고 모든 임무 유형에서 피해를 전반적으로 늘리는 데 사용됩니다.§!"
 fully_autonomous_computer_system_light: "완전 자율 전투기"
 fully_autonomous_computer_system_light_desc: "완전 자율 항공기 모듈로, 드론 체계가 더 이상 사람의 개입을 필요로 하지 않게 합니다"
 fully_autonomous_computer_system_heavy: "완전 자율 폭격기"
 fully_autonomous_computer_system_heavy_desc: "완전 자율 항공기 모듈로, 드론 체계가 더 이상 사람의 개입을 필요로 하지 않게 합니다"
 fully_autonomous_computer_system_arsenal: "아스널 버드 자율 체계"
 fully_autonomous_computer_system_arsenal_desc: "아스널 버드의 지휘통제 체계입니다. 항공기 조종뿐만 아니라 드론 떼 체계와 기타 요소의 통제도 담당합니다. 아스널 버드가 기능하려면 필요합니다."
 wing_delta_canard: "델타-카나드 날개형"
 wing_delta_canard_desc: "항공기의 기동성을 더욱 높이기 위한 델타 날개형의 변형입니다.\n\n§B설계 힌트: 날개형은 IC 비용을 대가로 항공기의 능력치를 조정합니다.§!\n\n§G이 날개형은 델타 날개의 개량형으로, 주로 대부분의 속도 영역에서의 기동성과 안정성이 향상됩니다. 일반 델타 날개보다 IC 비용이 더 듭니다§!"
 mpa_equipment_1: "3세대 다목적 전투기"
 mpa_equipment_2: "4세대 다목적 전투기"
 mpa_equipment_3: "5세대 다목적 전투기"
 mpa_equipment_4: "6세대 다목적 전투기"
