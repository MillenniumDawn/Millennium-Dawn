 KOR_uneven_economy1: "Économie inégale"
 KOR_uneven_economy1_desc: "Inévitablement, l'écart important de développement économique entre les deux Corées a des répercussions après la réunification. Pour que la nouvelle nation coréenne puisse exploiter pleinement son potentiel économique, ce déséquilibre doit être corrigé."
