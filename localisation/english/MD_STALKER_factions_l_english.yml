l_english:
 STALKER_faction_military: "the Military"
 STALKER.120.t: "War for the Zone"
 STALKER.120.d: "Fighting has broken out in [STALKER_zone_name] between [STALKER_zone_war_side_a] and [STALKER_zone_war_side_b]. Neither side can win quickly, and every month of fighting kills stalkers and wrecks perimeter posts."
 STALKER.120.a: "Back [STALKER_zone_war_side_a]."
 STALKER.120.a_tt: "Costs §R25§! political power. [STALKER_zone_war_side_a] gains §G10§! influence in the Zone. While the war lasts, the Zone loses §R3§! stalkers and §R3§! §Ycontainment§! each month."
 STALKER.120.b: "Back [STALKER_zone_war_side_b]."
 STALKER.120.b_tt: "Costs §R25§! political power. [STALKER_zone_war_side_b] gains §G10§! influence in the Zone. While the war lasts, the Zone loses §R3§! stalkers and §R3§! §Ycontainment§! each month."
 STALKER.120.c: "Let them fight it out."
 STALKER.120.c_tt: "While the war lasts, the Zone loses §R3§! stalkers and §R3§! §Ycontainment§! each month. The stronger side at the end wins §G15§! influence and the loser loses §R25§!."
 STALKER.121.t: "The War for the Zone Ends"
 STALKER.121.d_duty: "Duty has driven Freedom out of its strongholds in [STALKER_zone_name]. Its checkpoints now control the routes to the center."
 STALKER.121.d_freedom: "Freedom has broken Duty's hold on [STALKER_zone_name]. The routes to the center are open again, for anyone willing to take them."
 STALKER.121.d_military: "Army and security units have cleared the bandit gangs out of [STALKER_zone_name]. The survivors have scattered or gone north."
 STALKER.121.d_bandits: "The bandit gangs have fought the security forces to a standstill in [STALKER_zone_name], and now run the roads the soldiers abandoned."
 STALKER.121.a: "The Zone has a new order."
 STALKER_faction_ward: "the Ward"
 STALKER_faction_spark: "the Spark"
 STALKER.121.d_ward: "The Ward, SIRCAA's private army, has broken the Spark's hold on the approaches to the power plant in [STALKER_zone_name]. Its patrols now decide who reaches the center, and why."
 STALKER.121.d_spark: "Scar's Spark has driven the Ward back from the heart of [STALKER_zone_name]. Its followers say the Shining Zone is finally within reach."
 STALKER.122.t: "Clear Sky Falls"
 STALKER.122.d: "Clear Sky, the group that tried to understand the Zone from its base in the swamps of [STALKER_zone_name], has been wiped out. One survivor, a mercenary the others called Scar, was last seen heading north."
 STALKER.122.a: "The swamps belong to the Zone again."
 STALKER.123.t: "Noon"
 STALKER.123.d: "Monolith fighters taken after the last assault in [STALKER_zone_name] have woken from their conditioning. Led by a stalker called Strider, they call themselves Noon and have turned their guns on their former brothers."
 STALKER.123.a: "An enemy of the Monolith is useful to us."
 STALKER_faction_noon: "Noon"
 STALKER.121.d_noon: "Strider's Noon has driven the Monolith back from its outer positions in [STALKER_zone_name]. Some of the prisoners they take are already waking up."
 STALKER.121.d_monolith: "The Monolith has crushed Noon in [STALKER_zone_name]. The defectors who survived have scattered, and the Monolith's patrols are moving south again."

 # ---- MD_STALKER_faction_wars_l_english.yml (consolidated) ----
 STALKER_tearling_leader_stalkers: "the Free Stalkers"
 STALKER_tearling_leader_ecologists: "the Ecologists"
 STALKER_tearling_leader_bandits: "the bandits"
 STALKER.150.t: "Faction Wars"
 STALKER.150.d: "SIRCAA wants the Tearlings, the common crystals that stalkers in [STALKER_zone_name] long logged as worthless, and has asked every faction to bring them in for an exchange in three months. The Ward, Noon, the Spark and even the IPSF are recruiting every stalker they can find, and whoever delivers the most will have SIRCAA's thanks. We could quietly help one faction come out on top."
 STALKER.150.a: "Back the Free Stalkers."
 STALKER.150.b: "Back Duty."
 STALKER.150.c: "Back Freedom."
 STALKER.150.e: "Back the Ecologists."
 STALKER.150.f: "Leave it to SIRCAA."
 STALKER.150.back_tt: "Costs §R25§! political power. The faction we back gathers §G5§! more Tearlings each month for three months. If it delivers the most, SIRCAA pays us §G50§! political power.\nAt the exchange, the faction with the most Tearlings gains §G10§! influence, every faction that took part gains §G3§!, and the Ward gains §G5§!."
 STALKER.150.f_tt: "The Free Stalkers, Duty, Freedom, the Ecologists and the bandits compete for three months. At the exchange, the faction with the most Tearlings gains §G10§! influence, every faction that took part gains §G3§!, and the Ward gains §G5§!."
 STALKER.151.t: "The Tearling Exchange"
 STALKER.151.d: "SIRCAA has closed its exchange in [STALKER_zone_name]. The factions brought in §Y[?global.STALKER_tearlings_total|0]§! Tearlings, and [STALKER_tearling_leader] delivered the most, §Y[?global.STALKER_tearlings_best|0]§!. SIRCAA has thanked them publicly and paid every faction its share."
 STALKER.151.d_backed: "SIRCAA has closed its exchange in [STALKER_zone_name]. The factions brought in §Y[?global.STALKER_tearlings_total|0]§! Tearlings, and [STALKER_tearling_leader], the faction we backed, delivered the most, §Y[?global.STALKER_tearlings_best|0]§!. SIRCAA has paid every faction its share and paid us §G50§! political power for our help."
 STALKER.151.a: "Let SIRCAA study its crystals."
