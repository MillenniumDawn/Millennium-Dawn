l_korean:
 hez_focus: "헤즈볼라 중점 계통도"
 HEZ_Party_of_God: "Party of God"
 HEZ_Party_of_God_desc: "우리, 레반트의 투사들은, 레바논과 서아시아에서 자유를 향한 여정을 위해 그들 스스로를 희생하였고, 그들이 바로 신의 정당, '헤즈볼라' 입니다. 오늘, 우리의 반란은 매우 중요한 기로에 서 있습니다. 우리는 지금 레바논의, 아니 중동 전체의 미래를 바꿀 수 있는 상황에 놓여있으며... 이제 시간이 얼마 남지 않았습니다. '저항의 운명'이 우리를 기다리고 있습니다..."
 HEZ_Our_own_state: "우리의 땅에서"
 HEZ_Our_own_state_desc: "물론 레바논이나 이 지역의 다른 무슬림 국가를 방어하는 것이 우리의 최우선 과제이지만, 레바논을 포함한 이들 무슬림 국가 중 다수가 우리를 지지할 수 없거나 우리를 지지할 의사가 전혀 없다는 사실을 부인할 수 없습니다. . 그리고 그 사실 덕분에 우리 자신의 국가와 정부를 수립할 때가 왔습니다. 쉽지는 않겠지만 우리 형제들이 이를 통해 우리를 지지해 줄 것입니다."
 HEZ_Conquer_Lebanon: "레바논 정복"
 HEZ_Conquer_Lebanon_desc: "베이루트의 거짓 정부는 너무 오랫동안 머물렀습니다. 우리는 그들을 존경하고 도왔지만 우리의 관대함에 대한 그들의 대답은 시오니스트와 사우디와의 협력이었습니다. 더 이상은 없어! 우리는 군대를 동원하여 우리 형제들을 해방 전쟁, 즉 레바논 자체의 해방으로 불러들일 것입니다."
 HEZ_Recruiting_Soldiers: "군인모집"
 HEZ_Recruiting_Soldiers_desc: "Something that many can not understand is that our forces aren't just located in south Lebanon, but are present in all of Lebanon itself, and even other countries in west Asia, such as Iraq and Syria. Hence, we shall begin mobilizing our forces in Lebanon and the region. The victory lies ahead... "
 HEZ_Gathering_Equipment: "장비 확보"
 HEZ_Gathering_Equipment_desc: "이 지역의 인력과 마찬가지로 우리도 레바논과 서아시아 전역에 걸쳐 많은 비밀 장비 기지를 보유하고 있습니다. 우리는 레바논 남부에 장비를 보유하고 있으며 이라크와 시리아와의 접촉을 통해 더 많은 장비를 얻을 수 있습니다. 물론 테헤란에 있는 형제들의 도움을 잊지 맙시다."
 HEZ_Rightful_Clay: "정당한 영토"
 HEZ_Rightful_Clay_desc: "한때 레바논 내전과 그에서의 성공 이후 우리는 관용적인 정치 정부를 수립함으로써 서방과 시오니스트의 영향력이나 위협적인 공격으로부터 레바논의 안전을 보장할 수 있다고 생각했습니다. 서쪽이 늘어났습니다. 그리고 이제 정책을 일부 변경하여 레바논을 다시 되찾을 때입니다..."
 HEZ_Defectors_of_the_LAF: "레바논 정부군 (LAF)으로부터의 망명자"
 HEZ_Defectors_of_the_LAF_desc: "베이루트의 새로운 개혁에 레바논의 많은 군인들이 그다지 만족하지 않는 것 같으며, 따라서 많은 사람들이 레바논 군대를 버리고 가고 있습니다. 레바논에서의 우리 영향력의 지배력으로 우리는 레바논 해방을 위한 준비 과정을 훨씬 더 많이 얻을 수 있습니다. 물론, 우리는 나라를 지배하는 방법을 현명하게 선택해야 합니다..."
 HEZ_defector_resources_based_on_influence_TT: "§Y망명자§!들로부터의 추가 자원은 레바논 전체에 대한 우리의 영향력 수치에 따라 달라집니다:\n§Y5-10%§!: 1000 인력+ 1000 소화기\n§Y11-30%§!: 2000 인력 + 1000 소화기 + 1000 지휘 & 통제 장비\n§Y31-50%§!: 3000 인력 + 1000 소화기 + 1000 지휘 & 통제 장비 + 100 병력수송장갑차 + 100 다용도 차량\n§Y51-100%§!: 5000 인력 + 1000 소화기 + 1000 지휘 & 통제 장비 + 200 병력수송장갑차 + 300 다용도 차량 + 100 주력전차"
 HEZ_War_for_Lebanon: "레바논을 향한 전쟁"
 HEZ_War_for_Lebanon_desc: "모든 것이 준비되어 있고, 베이루트는 혼란에 빠져 있으며, 레바논 군대는 레바논 내전 이후 가장 무력한 상태에 있으며, 우리는 해방 전쟁을 위한 충분한 인력과 장비를 확보했습니다. 요컨대, 레바논 정부는 죽어가고 있으며, 우리는 저항군의 의지로 그 고통을 끝낼 것입니다. §R 쿠드스의 길은 베이루트에서 지나갑니다...§!"
 HEZ_Neutralizing_the_Threat: "이스라엘과의 전쟁"
 HEZ_Neutralizing_the_Threat_desc: "카슈미르 산맥에서부터 사하라의 사막까지, 모든 진정한 무슬림들이 오늘만을 기다려 왔고, 또 모든 진정한 아랍인들 또한 오늘을 기다려 왔으며, 모든 진실된 자유의 투사들이 이 날 만을 바래왔습니다... 6일 전쟁의 과오를 잊고, 욤 키푸르 (Yom Kippur) 전쟁의 실수 또한 사라지며, 팔레스타인의 모든 사람들이 해방되는 그날 말입니다... 맞습니다, 이 신성한 땅이 해방되는 그날이 마침내 찾아왔습니다. 마침내 이교도들과 폭군을 향한 마지막 십자군 원정을 끝낼 시간이 왔습니다. §G오늘은, '해방의 날'입니다...§!"
 HEZ_iranian_aid_changes_TT: "§Y이란인 원조§!로부터 §G추가 수입이 증가§!되며, 이는 더 이상 제거되지 §R않을§! 것입니다."
 HEZ_Co_existence: "공생"
 HEZ_Co_existence_desc: "레바논의 혼란과 파괴의 시대, 우리가 '레바논 내전'이라고 부르는 시대로부터 오랜 세월이 흘렀지만, 그 시대의 모든 것에는 민사적인 것이 하나도 없었습니다. 그 당시 우리는 살아남았고, 더러운 시오니스트 꼭두각시들로부터 레바논을 해방시키는 데 성공했습니다. 그리고 지금, 불행하게도 시리아 정부의 영향을 받는 단일주의적 관용 정부가 베이루트에 있으며, 그들은 최선의 기회를 찾으면 독립을 열망하고 있습니다. 우리는 이 목표를 달성하기 위해 그들을 돕고 협력할 것입니다. 독립 레바논을 위하여!"
 HEZ_Influence_Lebanese_politics: "레바논 정치에 영향"
 HEZ_Influence_Lebanese_politics_desc: "호의를 모으고 레바논 의회에 대한 우리의 지배력을 강화함으로써 우리는 레바논 통합을 위한 또 다른 중요한 조치를 취할 수 있으며, 확실히 레바논은 다른 누구도 아닌 레바논을 위한 것이 될 것입니다... 레바논은 역사상 그 어느 때보다 더 강력해질 것입니다. .."
 HEZ_Skirmish_Raids: "소규모 습격"
 HEZ_Skirmish_Raids_desc: "레바논 \"정부\"의 충성스러운 군대가 아닌 레바논 군대는 베이루트 \"정부\"의 급진적 자유주의 및 친서방 개혁으로 인해 매우 나쁜 상태에 있습니다. 그것은 \"중앙 정부\"의 지지자들과 반대자들에 의해 정치화되고 파벌화되고 있습니다. 우리는 이것을 국경 전쟁을 통해 레바논 군대를 최대한 약화시키는 이점으로 사용할 수 있습니다."
 HEZ_Turning_South: "남쪽을 바라보라"
 HEZ_Turning_South_desc: "레바논 해방과 함께 우리의 힘은 궁극적인 것이 되었습니다. 우리는 작은 지방을 통제하는 것이 아니라 자신과 동맹국에 대해 강하고 회복력이 있는 국가를 통제합니다. 그리고 Filistin의 억압자들을 죽일 때가 왔습니다. 이제 우리의 우선순위는 매우 분명해졌습니다. §RFilistin 해방을 위한 준비§!"
 HEZ_Increased_Iranian_Support: "이란인 원조 증가"
 HEZ_Increased_Iranian_Support_desc: "저항 축의 주요 파트너 중 하나인 이란 이슬람 공화국은 레바논, 레반트, 심지어 중동에서의 임무에서 우리를 도울 수 있습니다. 이란의 개입으로 우리는 여러 가지 방법으로 수입을 늘릴 수 있으며 이는 또한 레바논 독립을 위한 계획을 보다 효율적으로 실행할 수 있음을 의미합니다. 하지만 물론... 그 대가는 우리 정치 체제에 있어서도 높을 수 있습니다..."
 HEZ_lebanese_aid_income_based_on_influence_TT: "Additional Income from §YLebanese Aid§! will be based on Lebanese influence in Hezbollah:\n§Y1-20%§!: §G+0.25 Billion§! Weekly\n§Y21-50%§!: §G+1.00 Billion§! Weekly\n§Y51-100%§!: §G+1.00 Billion§! Weekly"
 HEZ_International_Hezbollah: "세계의 헤즈볼라"
 HEZ_International_Hezbollah_desc: "이슬람 세계 내부의 자유를 향한 투쟁이 없다면 헤즈볼라는 아무런 의미가 없습니다. 폭정에 맞써 저항하거나, 제국주의 침략자들에 대항하지 않는다면 이라크, 호세이니온, 아니면 다른 저항 추축국 국가들의 헤즈볼라는 도대체 왜 존재하는 것입니까? 우리는 전 세계의 우리 형제들을 도와야 합니다. 그럼, 이제 시작해볼까요..."
 HEZ_African_Hezbollah: "아프리카 작전"
 HEZ_African_Hezbollah_desc: "아프리카(특히 나이지리아)의 많은 무슬림들이 아야톨라 자크자키(Ayatollah Zakzaki) 덕분에 진리를 찾고 시교로 개종하기 시작했습니다. 이것은 Zakzaki의 임무를 돕고 새로 발견된 형제들에게 저항의 교리를 소개할 수 있는 아주 좋은 기회가 될 수 있습니다."
 HEZ_Latin_American_Hezbollah: "남아메리카 작전"
 HEZ_Latin_American_Hezbollah_desc: "우리는 라틴 아메리카에서 10년 동안 활동해 왔으며 이 지역에 대한 우리의 초점은 대부분 주요 시온주의 인물을 제거하고 아르헨티나와 같은 라틴 아메리카 국가에서 시온주의 영향력을 방해하는 것이었습니다. 하지만 이제 우리는 시오니스트들과만 싸울 필요는 없습니다. 이제 우리는 미제국주의자들에게 메시지를 보내야 합니다... 그리고 그들은 그들에게 무슨 일이 닥칠지 알지 못할 것입니다..."
 HEZ_North_American_Hezbollah: "북아메리카 작전"
 HEZ_North_American_Hezbollah_desc: "미국 DEA 세력에 침투하고 자본주의 돼지들에 대한 부패와 타락이 커지는 데 성공한 후, 이제 미국의 형제들을 불러 위대한 사탄에 대항하는 진실을 알 시간입니다..."
 HEZ_Hezbollah_in_the_Middle_east: "서남아시아 작전"
 HEZ_Hezbollah_in_the_Middle_east_desc: "서남아시아, 즉 서구에서 \"중동\"이라고 부르는 지역은 최근 지역 변화와 미군 동원으로 인해 전 세계에서 우리 작전의 주요 기지입니다. 우리는 준비해야 해요. 헤즈볼라가 미제국주의자들에 맞서 진정한 힘을 보여줄 때가 왔습니다."
 HEZ_An_Inevitable_failure: "불가피한 실패"
 HEZ_An_Inevitable_failure_desc: "Bashar Assad was never as capable as his brother, Basil, or even his father, Hafiz. And well, no wonder why a civil war started because of an Eye Doctor president... \nBut anyhow, the interests of the Resistance are endangered because of the presence of Wahhabi and Western forces in Syria. We have to act quickly because if we don't, the next civil war will happen in Lebanon and Iran..."
 HEZ_An_Inevitable_failure_TT: "§G-§! 다음의 디시전을 해금합니다: §Y시리아로 장비 전송§!, 시리아 내전 기간에 사용 가능한 §Y시리아를 향한 자원병§!."
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad: "사나와 바그다드의 우리 형제들"
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad_desc: "Many things are changing throughout the region, and our agents have reported massive American mobilization of the American Forces near the Iraqi borders, and also, we have heard the news of Saudi proxies persecuting the Shi'a population in Yemen and our Houthi brothers are getting ready for a new struggle... The world is changing, and so shall we. But for now, we only have to wait for the beginning of the end..."
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[IRQ.GetNameWithFlag]: 이라크인들을 위한 우리의 원조§!, §Y[IRQ.GetNameWithFlag]: 저항을 위한 무기§!\n"
 HEZ_Our_Brothers_in_Sanaa_and_Baghdad_TT2: "§G-§! 다음의 디시전을 해금합니다: §Y[YEM.GetNameWithFlag]: 예멘에서의 공습 조직§!, §Y[YEM.GetNameWithFlag]: 형제들을 위한 무기§!"
 HEZ_Badr_in_the_shadows_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[IRQ.GetNameWithFlag]: 바드르 선전 지원금§!"
 HEZ_volunteers_for_iraq_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[IRQ.GetNameWithFlag]: 이라크로의 자원병§!"
 HEZ_shia_advisors_for_iraq_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[IRQ.GetNameWithFlag]: 이라크의 시아파 조언가§!"
 HEZ_fund_houthi_propaganda_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[YEM.GetNameWithFlag]: 후티 선전 원조§!"
 HEZ_infrastructure_in_saadaa_TT: "§G-§! Unlocks the following decision: §Y[YEM.GetNameWithFlag]: Infrastructure in Saada§!"
 HEZ_fund_protests_against_wahabbis_in_sanaa_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[YEM.GetNameWithFlag]: 사나의 와하비파에 대항하기 위한 시위 원조§!"
 HEZ_sabotage_wahhabi_schools_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[YEM.GetNameWithFlag]: 와하비 학교와 모스크에 대한 사보타주§!"
 rushdie_decision_unlock_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[USA.GetNameWithFlag]: 살만 루슈디 암살§!"
 rushdie_dies_tooltip: "§R루슈디의 운명이 결정될 것입니다. 바로 지금.§!\n 우리가 미합중국에 대한 §Y민간 정보§!를 더 많이 보유하고 있을 경우, 우리의 성공 확률이 증가할 것입니다."
 rushdie_dies_tooltip_nodlc: "§R루슈디의 운명이 결정될 것입니다. 바로 지금.§!\n 우리가 미합중국에 대한 더 많은 §Y영향력§!을 보유하고 있을 경우, 우리의 성공 확률이 증가할 것입니다."
 rushdie_dies2_tooltip: "§Y잠적한 그가 마침내 그의 죄로 인한 결과로부터 해방될 겁니다...§!"
 rushdie_survives_tooltip: "§Y그 개자식은 살아남았지만, 그의 목숨은 앞으로 위태로울 것입니다...§!"
 HEZ_The_End: "The End"
 HEZ_The_End_desc: "서남아시아 전역에서 많은 희생과 투자 끝에 우리는 이제 사우디의 짐승에게 큰 상처를 입힐 수 있는 절호의 기회를 갖게 되었습니다. 이 와하비 기회주의자들은 우리가 존재할 때 그들의 돈은 아무 것도 아니라는 것을 알아야 합니다. 왜? 사우디 수도의 \"보안\"을 제거하면 누구도 헤즈볼라와 그 동맹국에 의해 매주 폭격을 받을 장소에 \"투자\"할 생각을 하지 않을 것이기 때문입니다. 지금 수십억 달러가 사라질 것입니다!"
 HEZ_and_Steal_the_Heathens: "Steal the Heathens"
 HEZ_and_Steal_the_Heathens_desc: "물론 Saudi Dogs의 자금 지원으로 Wahhabi 쓰레기가 예멘에서 성장하고 있습니다. 물론 우리의 감시하에 있지는 않습니다. 우리는 후티 형제들에게 예멘에서 사업을 좀 맡아 달라고 요청할 것입니다... 그리고 사우디아라비아에게는 매우 나쁜 결말이 될 것입니다..."
 HEZ_Steal_the_Bastards: "Steal the Bastards"
 HEZ_Steal_the_Bastards_desc: "미국인들이 이라크를 정복했다고 해서 그것이 그들이 영원히 자신들의 소유라는 뜻은 아닙니다. 따라서 우리는 이라크 전역에 있는 남녀노소를 불문하고 모든 미군 병사를 공격할 것입니다. 그리고 우리 공격의 시작은 미군 수비대를 혼란에 빠뜨릴 만큼 강력해야 합니다. 그들은 두려움을 알게 될 것이고, 우리는 그들에게 두려워하는 법을 가르칠 것입니다..."
 HEZ_Invest_in_Saada: "사다에 투자"
 HEZ_Invest_in_Saada_desc: "Sa'ada 지방이 안사랄라의 본부이므로, 우리는 이곳을 확장하고 투자하여 안사랄라와 헤즈볼라에 봉사하기에 충분하도록 만들 것입니다."
 HEZ_Houthi_brothers: "후티의 형제들"
 HEZ_Houthi_brothers_desc: "The Shabab al Momin, or Ansarallah of Yemen, is a political and some basis, an Armed organization that supports the ideas of the Axis of Resistance and also is very favored by Hezbollah. With the continuation of Shi'a minority persecution in Yemen and also the growth of the Wahhabi menace in Yemen, this organization is becoming more dissatisfied with the Yemeni government, and hence, it seems this rivalry between the organization and the central government can be a good opportunity for us to spread the ideas of the Resistance. And well, we shall begin."
 HEZ_Organize_Shii_Forces: "시아파 군 조직"
 HEZ_Organize_Shii_Forces_desc: "이제 사담 정부가 몰락하고 새로 창설된 이라크 정부가 혼란에 빠지면서 우리가 이라크에 좀 더... 물리적으로 개입해야 할 때가 왔습니다. 우리의 숙련된 조언자들을 바드르 군대와 다른 시아파 민병대에 파견함으로써 우리는 이라크의 미국 점령군을 공격하는 단계를 조율할 수 있습니다."
 requirement_hez: "§Y사관학교§! 또는 그 이상을 가지고 있음"
 HEZ_Badr_in_the_shadows: "그림자 속의 바드르"
 HEZ_Badr_in_the_shadows_desc: "The Badr Army, one of the oldest Shi'ite military and political organizations of Iraq, is now in dire need of help from us and our Iranian brothers. Now, with huge tensions between Saddam and the United States in Iraq, we actually can have a very good opportunity to bolster the influence of Shi'a parties, not just the Badr Army, throughout Iraq and beyond!"
 HEZ_For_Allah_Islam_and_Zeinabyah: "For Allah, Islam, and Zeinabyah!"
 HEZ_For_Allah_Islam_and_Zeinabyah_desc: "우리는 이맘 후세인의 깃발로 적을 공격할 것입니다! 적들에게 머리가 잘려도 자이납의 신전을 지키러 가야 한다... §R우리도 가야 한다... 아흘룰 베이트를 지키기 위해 우리 자신을 희생하기 위해서...§!"
 HEZ_Negotiations_for_Intervention: "개입을 위한 협상"
 HEZ_Negotiations_for_Intervention_desc: "우리는 와하비의 위협으로부터 어떤 위협도 용납할 수 없으며 앞으로도 허용하지 않을 것입니다! 우리는 와하비 짐승과 싸우기 위해 모든 힘을 동원할 것이다! 우리는 폭군 와하비스에게 어떤 자비도 베풀지 않을 것입니다! 우리는 거짓 이슬람 국가를 파괴하기 위해 모든 외교력과 군사력을 사용할 것입니다. 우리는 이 위협을 영원히 끝내겠습니다..."
 HEZ_call_to_arms: "무장하라"
 HEZ_call_to_arms_desc: "우리는 이란과의 관계를 개선하고 시리아 아랍 공화국에 조언가를 보내야만 합니다."
 HEZ_call_to_arms_TT: "§G-§! 다음의 디시전을 해금합니다: §Y[SYR.GetNameWithFlag]: 다마스쿠스의 우리 조언가§!, 시리아 내전 기간에 사용 가능한 §Y[PER.GetNameWithFlag]: 이란을 위한 무기§!."
 HEZ_Formalize_the_first_Shia_Institutions_in_Africa: "아프라카의 첫 시아파 기관 창설"
 HEZ_Formalize_the_first_Shia_Institutions_in_Africa_desc: "이제 저항의 축이 나이지리아와 아프리카의 정치적 운동장에 진입했으므로 나이지리아의 무슬림 인구를 유치하고 시아파 이슬람교와 이슬람 교리를 개종하고 홍보하는 데 막대한 투자를 해야 할 때입니다. 저항. 우리의 투자와 사랑하는 형제 Ayatollah Zakzaki의 유용성 덕분에 우리는 이제 우리의 계획을 실현할 수 있습니다."
 HEZ_Help_Zakzaki_and_his_companions: "자크자키와 그 친구들을 도와라"
 HEZ_Help_Zakzaki_and_his_companions_desc: "자크자키와 그의 당에 막대한 정치적 지원을 투자함으로써 이슬람 시아파의 이데올로기는 크게 강화될 것이며 확실히 우리의 이익에도 도움이 될 것입니다."
 HEZ_Establish_Secret_Bases_in_Nigeria: "나이지리아의 비밀 기지 창설"
 HEZ_Establish_Secret_Bases_in_Nigeria_desc: "이제 나이지리아의 시아파 문화 기관을 확보하고 영향을 미치면서 우리는 이 나라의 레지스탕스에 대한 막대한 지원을 모았습니다. 따라서 이러한 지원을 통해 우리는 나이지리아와 심지어 아프리카 전역에서 운영의 새로운 단계에 들어갈 것입니다..."
 HEZ_Ayatollah_ZakZaki: "아야톨라 자크자키"
 HEZ_Ayatollah_ZakZaki_desc: "매우 확고한 시아파 나이지리아 호메이니스트이자 나이지리아에서 매우 잠재적인 시아파 정당의 지도자인 아야톨라 자크자키(Ayatollah Zakzaki)는 부드럽고 감미로운 선전과 정치 계략의 힘을 사용하여 아프리카 대륙의 운동장에 들어갈 수 있는 최고의 기회가 될 수 있습니다. , 우리는 또한 아프리카의 가장 중요한 지역에서 우리의 지배력을 주장할 수 있습니다..."
 Zakzaki_tt: "§Y이브라힘 자크자키§!가 §Y나이지리아§!의 §G강경 시아파 혁명주의§!의 지도자가 될 것입니다."
 HEZ_A_Remembrance_to_an_old_friend: "옛 친구에 대한 추모"
 HEZ_A_Remembrance_to_an_old_friend_desc: "비록 우리가 아프리카에서 운영적인 방식으로 실제로 활동하지는 않지만, 우리는 많은 아프리카 국가에서 우리의 목적을 달성할 수 있고 실제로 우리의 이상과 일치하는 일부 기관을 알고 있습니다. 그 중 일부는 심지어 시아파 무슬림으로 간주되지도 않습니다. 하지만 나이지리아에서는 이것이 다른 것 같습니다. Ayatollah Zakzaki가 이끄는 나이지리아의 시아파 운동은 우리 운영자와 대리인을 단순한 선전 활동보다 파괴 활동에 더 많이 참여하게 만드는 매우 좋은 후보가 될 수 있습니다..."
 HEZ_From_Caracasto_Washington: "From Caracas to Washington!"
 HEZ_From_Caracasto_Washington_desc: "§R이 저주받은 땅에서 우리의 임무는 끝났습니다. 이제 자유의 수호자를 혼란의 보루로 만들 때가 왔습니다.§!"
 HEZ_Our_Gift_To_the_Great_Satan: "위대한 사탄의 선물"
 HEZ_Our_Gift_To_the_Great_Satan_desc: "§R미국은 무너져야 하고, 자신의 이익을 위해서라면 충분히 나빠져야 합니다...§!"
 HEZ_Our_Gift_To_the_Great_Satan_TT: "§G-§! Unlocks the following decision: §YDestabilize America§! under the Our Steps in latin America decisions."
 HEZ_American_Infiltration: "미국으로의 침투"
 HEZ_American_Infiltration_desc: "우리는 미국에 대해 조치를 취해야 합니다."
 HEZ_New_Contracts_with_Drug_Cartels: "마약 카르텔과의 새로운 계약"
 HEZ_New_Contracts_with_Drug_Cartels_desc: "Divide and conquer! It seems this saying works on the relations of the drug cartels and the governments of Latin America. By letting chaos prosper throughout Argentina and, later, Latin America, we can do as we please in the continent, and what we now get pleased to do is damaging the great Satan."
 HEZ_New_Contracts_with_Drug_Cartels_TT: "§G-§! 다음의 디시전을 해금합니다: §Y마약 카르텔과의 거래§!"
 HEZ_Our_Era: "우리의 시대"
 HEZ_Our_Era_desc: "Everything in Argentina is secured, and we now have a strong dominance over the country! Or at least strong enough to expand our base of operations other than just one country in the continent. The clock is ticking, §Rand we should prepare for our last strike against the United States...§!"
 HEZ_Memory_of_AMIA: "아르헨티나 유대인 공동체 (AMIA)에 대한 추억"
 HEZ_Memory_of_AMIA_desc: "AMIA, one of the Jewish community centers in Argentina that was sabotaged by our agents in Argentina, was one of our operations in regards to decreasing and also eliminating the Zionist influence in the Latin American countries. Now, with us willing to start a new phase in South America, it seems that we, again, need to fight the Zionist influence throughout the continent, and again, it starts with Argentina... "
 HEZ_Anti_Zionist_Parties: "반시온주의 정당"
 HEZ_Anti_Zionist_Parties_desc: "다른 대안으로도 시오니스트의 위협을 제거할 수 있지만, 가장 좋은 대안 중 하나는 실제로 아르헨티나 지역 주민(그리고 대륙 전체)으로부터 반시오니스트 지지를 모으는 것일 수 있습니다. 자, 이제 시오니스트에 맞서 부드럽고 달콤한 캠페인을 시작하겠습니다..."
 HEZ_Anti_Zionist_Parties_TT: "§G-§! 다음의 디시전을 해금합니다: §Y반시온주의자 정당에 대한 지원§!"
 HEZ_how_little_they_know: "How little they know..."
 HEZ_how_little_they_know_desc: "§R그리고 이제 제국주의자들은 우리를 기대하지도 않는 곳에서 우리를 두려워할 것입니다...§!"
 HEZ_Creating_opportunities: "기회를 만들어라"
 HEZ_Creating_opportunities_desc: "With us becoming something more than just a paramilitary organization, we have to improve the ways of trade and transporting in our newfound country because we have to live on, and we have to provide a good life for our population, don't we? A naval port would suit our need in trading and even make us a major \"country\" for having access to both the Mediterranean Sea and the region of the Levant. And an International Airport will suit our needs in, well, stockpiling our Fighters in it and also, some transportal and economic benefits."
 HEZ_International_recognization: "국제적 인정"
 HEZ_International_recognization_desc: "Though we always will be Loyal to Iran and any other Shi'a country, we now also want to enter the International stage; why should we fight and die when we can benefit many things from talking and negotiating? After all, some of our brothers in Tehran believe in this logic, too; why shouldn't we believe in it?"
 HEZ_Seeking_Allies: "동맹 탐색"
 HEZ_Seeking_Allies_desc: "이제 국제사회에서 우리의 입지를 확고히 한 우리는 아까 말했듯이 '협상'을 해야 합니다. 왜? 누구도 레반트에 대한 좋은 투자 기회를 부정하지 않습니다. 특히 레바논의 경우에는 더욱 그렇습니다. 우리는 이란 너머의 국가나 시아파 국가들에게 다가가야 합니다. 수십억의 사람들이 신의 새로운 땅에서 번성해야 합니다..."
 HEZ_Building_of_our_nation: "우리 국가의 건설"
 HEZ_Building_of_our_nation_desc: "우리는 세계 주요 경제대국의 국제 투자에 크게 의존하고 있지만 최소한 우리 자신을 위한 국내 산업이 있는지 확인해야 합니다. 결국 우리는 우리의 시아파 정책 전체를 파괴하지 않을 것입니다. 우리는 단지... 악에 맞서 싸우는 것 외에 다른 대안이 있다는 것을 이해하고 있을 뿐입니다..."
 HEZ_Improved_living: "개선된 생활 수준"
 HEZ_Improved_living_desc: "이제 우리는 세계에서 매우 새롭고 심지어 이상한 국가를 건설하려는 의지와 함께 그 뿌리를 강화해야 합니다. 우리나라의 인프라를 개선하고 통신 서비스를 확장함으로써 우리는 국민의 만족과 우리나라에서 투자 또는 건설 보너스를 받을 수 있는 매우 좋은 기회를 보장할 수 있습니다."
 HEZ_Recruiting_Loyalists: "충성파 모집"
 HEZ_Recruiting_Loyalists_desc: "국가에는 경제와 국제적 명성이 매우 중요하지만 국가 안보도 중요합니다. 그리고 심지어 그것은 우리에게 더 중요합니다. 우리가 자국에 비해 좋은 군사력을 갖고 있지만 그렇다고 마냥 기댈 수만은 없습니다. 군사적 목표를 달성하려면 갈 길이 멀다."
 HEZ_Land_of_God: "신의 영토"
 HEZ_Land_of_God_desc: "다 준비 됐어; 우리는 더 이상 누구에게도 의존하지 않습니다. 아니요! 우리는 이제 단지 \"하나님의 당\"이 아닙니다! 우리는 지금 하느님께 완전히 헌신하는 땅, 국가를 건설하고 있으며, §G하느님의 땅인 ​​\"밀크울라\"를 건설하고 있습니다.§!"
 HEZ_Hezbollah_and_the_LAF: "헤즈볼라와 레바논 정부군 (LAF)"
 HEZ_Hezbollah_and_the_LAF_desc: "헤즈볼라와 레바논 군대의 협력을 통해 우리는 베이루트 정부에 영향을 미치고 또한 이를 선호하는 데 큰 발걸음을 내딛을 수 있습니다. 우리는 남북 전쟁 중에 배운 전술을 공유할 것이며, 신의 뜻에 따라 그들은 해외에서 획득한 기술을 우리와 공유할 것입니다..."
 HEZ_Lebanese_Support: "레바논 지원"
 HEZ_Lebanese_Support_desc: "필요할 때 우리는 레바논 정치 운동장에서 많은 레바논 개인들을 선호했고, 따라서 우리는 그 호의를 사용할 것입니다. 물론 우리는 결국 레바논의 안보와 정치 모두에 매우 큰 영향력을 갖고 있다는 사실을 잊지 말아야 합니다."
 HEZ_iranian_aid_income_based_on_influence_TT: "Additional Income from §YIranian Aid§! will be based on Iranian influence in Hezbollah:\n§Y1-20%§!: §G+0.25 Billion§! Weekly\n§Y21-50%§!: §G+1.00 Billion§! Weekly\n§Y51-100%§!: §G+2.00 Billion§! Weekly"
 HEZ_Lobbying_Public_Support: "민간 지지 확보"
 HEZ_Lobbying_Public_Support_desc: "이제 우리가 레바논 전역에서 정치적 권위를 확보함에 따라 레바논 국민에 대한 우리의 권위도 확보해야 할 때가 왔습니다. 친애하는 시아파 지지자들과 기타 지지하는 소수 집단, 심지어 정당들에게 전화를 걸어 레바논에서 헤즈볼라의 인기와 명성을 보여줄 수 있습니다. 그렇게 하면 베이루트에 있는 서양 인형에 대한 경보가 울릴 것입니다. 그들에게 무슨 일이 일어날지 보여줄 수 있는 알람이며, §Y그들은 그들에게 무슨 일이 닥칠지 이해할 것입니다!§!"
 HEZ_Request_Election_funds: "선거 자금 요청"
 HEZ_Request_Election_funds_desc: "우리가 우리의 지위를 확보하기 위해 많은 일을 하고 있지만, 우리의 대의를 위해서는 여전히 한 명의 후원자가 필요하며, 늘 그렇듯이 그 후원자는 이란 이슬람 공화국입니다. 분명 그들은 우리를 도와줄 것이고, 레바논 통일을 위해 우리를 지지할 것입니다. 왜? 왜냐하면 레바논이 헤즈볼라의 깃발 아래 통합된다면, §YA 국가는 그 자체로 하나의 국가가 되기 때문입니다.§!"
 HEZ_Shias_Lebanon: "레바논인들을 위한 레바논!"
 HEZ_Shias_Lebanon_desc: "다 준비 됐어. 우리는 할 수 있는 모든 일을 다 했고, 이제 보상을 받을 시간입니다. 레바논은 단결하여 어떤 제국주의 세력의 손에서도 완전히 벗어날 것입니다. §Y레바논이 확보됨에 따라 저항군은 마지막 전쟁, 이교도에 대한 대재판, 억압받는 사람들의 해방을 위해 큰 발걸음을 내딛을 것입니다.§!"
 HEZ_maintain_status_quo: "현상 유지"
 HEZ_maintain_status_quo_desc: "우리의 초기 목표는 헤즈볼라의 깃발 아래 레바논을 통합하는 것이었지만 그런 것은 필요하지 않은 것 같습니다. 우리는 레바논 정치를 지배해왔으며, 말 그대로 레바논 전체를 스스로 장악할 필요는 없습니다. 대신 우리는 전국에서 일어나는 정치 활동을 감독할 것입니다. 이렇게 하면 레바논 정부에서 우리의 정치적 지배력이 확보되는 동안 우리 조직 내부에서 그렇게 많은 정치적 중상모략을 할 필요가 없고, '민주주의' 정부가 바로 옆에서 활동하게 함으로써 좋은 대외적 이미지까지 가질 수 있습니다. . 이러한 방식으로 우리는 또한 우리의 시아파 인구와 저항 축의 이익에 더 초점을 맞추고 있습니다. §Y그러나 그럼에도 불구하고 레바논에 대한 우리의 확고한 손길은 영원히 남아 있을 것입니다!§!"
 HEZ_Industry: "헤즈볼라와 산업"
 HEZ_Industry_desc: "산업 부문은 헤즈볼라의 지속 가능성에 가장 중요합니다."
 HEZ_Hezbollahs_independent_industry: "헤즈볼라의 독립 산업"
 HEZ_Hezbollahs_independent_industry_desc: "우리 나라가 다른 나라의 지배를 받도록 놔둘 수는 없습니다. 그러므로 우리는 스스로 새로운 경제학의 특별한 '교리'를 창조해야 한다."
 HEZ_New_Backers: "새로운 뒷배"
 HEZ_New_Backers_desc: "우리의 새로운 국가가 형성됨에 따라 일부 외국인 투자자들은 우리의 현재 경제 상황에 관심을 갖고 있습니다..."
 HEZ_Puppet_state_of_Iran: "이란의 괴뢰국"
 HEZ_Puppet_state_of_Iran_desc: "이란인들은 막대한 정치적 비용을 들여 우리 산업에 자금을 지원하기로 합의했습니다."
 HEZ_The_Lira: "'리라 (Lira)'"
 HEZ_The_Lira_desc: "우리는 우리 통화인 리라에 어떻게 접근해야 하는지 평가해야 합니다."
 HEZ_Free_from_USD: "리라를 달러로부터 해방하라"
 HEZ_Free_from_USD_desc: "리라화는 너무 불안정합니다. 우리는 그것을 미국 달러로 해방해야 합니다."
 HEZ_Keep_it_locked: "현재로 고정하자"
 HEZ_Keep_it_locked_desc: "리라 가치는 안정적이고, 해결할 것이 없습니다."
 HEZ_Preparing_Iranian_businesses: "이란계 사업의 진출 준비"
 HEZ_Preparing_Iranian_businesses_desc: "음... 결국엔 이걸 해야 하는데..."
 HEZ_Iranian_Offices: "이란계 사무소"
 HEZ_Iranian_Offices_desc: "우리는 오피스 부문을 위한 새로운 인프라를 구축해야 합니다."
 HEZ_Iranian_Construction_tools: "이란계 건설 기반"
 HEZ_Iranian_Construction_tools_desc: "상품을 생산하려면 새로운 공장을 건설해야 합니다."
 HEZ_Iranian_Roads: "이란의 도로"
 HEZ_Iranian_Roads_desc: "우리는 도로를 개선하여 상품을 더 빠른 속도로 생산할 수 있도록 해야 합니다."
 HEZ_iranian_business: "이란계 사업"
 HEZ_Iranian_Business_Stimulus: "이란계 사업 자극"
 HEZ_Iranian_Business_Stimulus_desc: "우리의 자율성을 희생시키면서 이란이 우리 사업에 부양책을 제공하도록 허용할 수 있습니다."
 HEZ_Iranian_Business_Stimulus_modifier_TT: "매주 §G+0.200$§! x10억을 제공하는 §Y이란계 사업§!."
 HEZ_Iranian_Business_Stimulus_autonomy_TT: "이란계 사업 자극"
 HEZ_Iranian_Supported_Education: "이란 지원의 교육"
 HEZ_Iranian_Supported_Education_desc: "이란인들은 우리의 자율성을 더욱 희생시키면서 우리 노동자들을 교육하겠다고 제안했습니다."
 HEZ_Iranian_Supported_Education_TT: "이란 지원의 교육"
 HEZ_peoples_support: "\nThis focus will Combine all of the national spirits of this Branch, Increasing the following:\n§G+5%§! §YWar Support§!\n§G+5%§! §YStability§!\n§G+0.10§! §YDaily Political Power Gain§!"
 HEZ_peoples_support_for_hezbollah_1: "헤즈볼라에 대한 시민의 지지"
 HEZ_al_manar: "알 마나르 (Al-Manar)"
 HEZ_blue_shirt_kids: "청색 옷의 아이들"
 HEZ_our_cartels_in_south_america: "남아메리카의 우리 카르텔"
 HEZ_unknown_cartel_operations: "알수 없는 카르텔 작전"
 HEZ_council_of_12: "12 위원회"
 HEZ_hezbollah_armed_forces: "헤즈볼라 국군"
 HEZ_iranian_missile_aid: "이란의 미사일 지원"
 HEZ_public_support: "민간 지원"
 HEZ_volunteers_of_all_beliefs: "모든 신념의 헌신자들"
 HEZ_lujnat_imdad_al_khomeini: "루야트 임다드 알 호메이니"
 HEZ_Vilayat-e-faqih: "율법학자"
 HEZ_Vilayat-e-faqih_desc: "벨라야테 파키흐 사상은 저항과 이슬람 혁명의 전임 지도자인 아야톨라 루홀라 호메이니가 장려한 것으로, 민주주의 사상과 이슬람 사상의 결합, 그리고 이슬람 정부의 수립에 관한 것입니다. 헤즈볼라는 이란과 함께 지역 어디서든, 심지어 세계 어디서든 이 사상을 장려하기 위해 존재하므로, 우리 지지자와 청년들에게도 이 사상을 장려하고 가르쳐야 합니다."
 HEZ_The_Blue_Shirt_Kids: "이맘 마흐디의 '청색 옷의 아이들'"
 HEZ_The_Blue_Shirt_Kids_desc: "푸른 셔츠 아이들, 즉 이맘 마흐디 스카우트 조직은 사실 이란의 \\"바시즈\\" 조직과 매우 비슷한 조직입니다. 청년 자원봉사자를 조직에 활용하면 어린 나이부터 구성원을 훈련시키는 데 도움이 될 수 있습니다. 청소년 훈련은 성인 병사 훈련만큼 혹독하지는 않지만, 조직 내 새로운 세대의 병사들을 준비시키는 데에는 여전히 유용할 수 있습니다."
 HEZ_Lujnat_Imdad_al-khomeini: "루야트 임다드 알 호메이니"
 HEZ_Lujnat_Imdad_al-khomeini_desc: "이맘 호메이니 구호위원회(아랍어로는 루즈나트 알임다드 알호메이니)는 사실 레바논을 포함한 서남아시아 전역에서 활동하는 다국적 자선 단체입니다. 이들의 도움을 요청하여 우리 주민들의 생활 여건을 개선하면 레바논 남부에서 막대한 지지를 얻을 수 있으며, 동시에 이 단체의 도움으로 사회의 여러 비용도 실제로 줄일 수 있습니다!"
 HEZ_Peoples_Support_For_Hezbollah: "People's Support for Hezbollah"
 HEZ_Peoples_Support_For_Hezbollah_desc: "우리는 레바논 전역에서 우리의 지지를 확보했다! 이제 우리 나라와 조직 내에서 저항의 교리에 대한 배신을 두려워하지 않을 것이노라! 알라후 아크바르(신은 위대하다)!"
 HEZ_Volunteers_Of_All_Beliefs: "모든 신념의 헌신자들"
 HEZ_Volunteers_Of_All_Beliefs_desc: "이제 우리가 저항의 진실을 퍼뜨리자 우리의 행동이 대의에 결실을 맺은 것으로 보입니다! 지역의 여러 이슬람 국가에서 온 자원병의 물결이 우리 조직에 가입하겠다고 요청해 왔습니다! 그들의 요청을 거절할 이유가 있겠습니까? 시온주의자들은 이것이 자신들에게 닥치리라고는 예상하지 못할 것입니다!"
 HEZ_Deputy_leader: "부지도자"
 HEZ_Deputy_leader_desc: "나임 카셈은 조직 부지도자로서의 입지를 굳힌다면 헤즈볼라에 매우 귀중한 자산이 됩니다. 그러니 그가 원하는 것을 얻도록 우리가 도울 것입니다!"
 HEZ_naim_qassim: "나임 카심 (Naim Qassim)"
 HEZ_Satellite_link_up: "위성으로의 연결"
 HEZ_Satellite_link_up_desc: "이제 알마나르 TV가 설립되었으므로, 이 방송 채널이 저항의 교리를 레바논뿐 아니라 레바논의 모든 이웃 국가들에까지 전파할 수 있도록 해야 합니다. 그리고 시온주의자들의 사기를 떨어뜨림으로써 그들의 정부에 작지만 중요한 타격을 줄 수 있을 것입니다..."
 HEZ_The_Council_of_12: "12 위원회"
 HEZ_The_Council_of_12_desc: "12인 위원회는 조직의 중요한 정치, 군사, 집행 구성원 12명으로 이루어져 있으며 조직의 매우 중요한 부분입니다. 이 위원회는 또한 조직의 군사 위원회와 집행 위원회를 합친 것입니다."
 HEZ_Al-Manar: "알 마나르 (Al-Manar)"
 HEZ_Al-Manar_desc: "저항의 말을 전파하기 위한 국제 텔레비전 방송국을 설립함으로써 우리는 지역과 전 세계에서 지지자를 얻을 수 있습니다! 알마나르 TV를 설립하면 우리는 서방과 시온주의 국가의 거짓말을 폭로할 것입니다..."
 HEZ_Politics_in_Focus: "정치 중심"
 HEZ_Politics_in_Focus_desc: "헤즈볼라는 너무 오랫동안 종교가 이 나라를 인도하도록 두었습니다. 이제 제대로 된 지도력이 필요한 때입니다."
 HEZ_Religion_in_Focus: "종교 중심"
 HEZ_Religion_in_Focus_desc: "우리는 아야톨라 호메이니의 인도에 따라 이슬람의 교리를 따르며, 헤즈볼라는 언제나 이슬람과 그 교리에 충성할 것입니다! 우리의 이념적 사상의 영향력을 조직 전반에, 나아가 레바논과 다른 나라들에까지 확장해야 합니다."
 HEZ_Armed_forces: "국군"
 HEZ_Armed_forces_desc: "우리의 군대는 조직의 가장 주요한 측면 중 하나입니다. 따라서 변화하는 이 시기에 우리는 군대를 어떻게 할지 결정해야 합니다. 개혁할 것인가? 아니면 게릴라전의 전통을 유지할 것인가?"
 HEZ_The_Army_We_Know: "우리가 아는 군대"
 HEZ_The_Army_We_Know_desc: "헤즈볼라 민병대와 특수 부대는 미국과 시온주의 정권의 위협적인 군대에 맞서 매우 효과적임을 입증했습니다. 규율과 환경에 대한 적응을 바탕으로 우리 군대는 레바논에서, 그리고 아마도 서남아시아 전 지역에서 막을 수 없는 존재가 될 것입니다."
 HEZ_Specialized_Equipment: "특수 장비"
 HEZ_Specialized_Equipment_desc: "군대 전반의 장비를 현대화하면 적과 싸울 때 우위를 점할 수 있습니다. 현대적 장비와 특화된 게릴라 전술을 결합하면 누구도 감히 어떤 방식으로든 우리를 공격하지 못할 것입니다... "
 HEZ_Taabia: "'타비아 (Taabia)' 사관학교"
 HEZ_Taabia_desc: "군사 학교 \\"타비아\\"를 새롭게 개혁하면 현대 장비에 대한 충분한 지식을 갖추고 전 세계에서 사용되는 여러 군사 전술을 분석할 수 있는 재능 있는 장교의 새로운 세대를 양성할 수 있습니다. 진정으로 새로운 개혁은 우리에게 큰 군사적 이점이 될 수 있습니다."
 HEZ_Iranian_Training_Camps: "이란계 훈련 캠프"
 HEZ_Iranian_Training_Camps_desc: "재능 있는 우리 장교들은 조직 창설 이래 이란에서 훈련을 받아 왔지만, 이제 일부 이란 훈련 캠프를 이란에서 레바논 남부로 옮길 때가 되었습니다. 그렇게 하면 장교뿐만 아니라 일반 병사와 민병대원들까지도 이란 고위 장교들로부터 특별한 정규 훈련을 받을 기회를 얻을 수 있습니다."
 HEZ_Support_for_our_Militia: "민병대 지원"
 HEZ_Support_for_our_Militia_desc: "우리 민병대 병사들은 대부분 소모전을 치를 준비가 되도록 훈련받지만, 그렇다고 총 한 자루를 쥐여주고 대의를 위해 죽으라고 해서는 안 됩니다. 아닙니다. 헤즈볼라의 모든 구성원은 조직 전체에 귀중한 자산입니다. 따라서 민병대원의 목숨 또한 소중합니다. 추가 포병 지원과 기타 지원 장비로 병사들의 사상자를 최소화하면, 제국주의 위협에 맞서 우리 군이 충분히 준비되고 숙련되는 데 큰 도움이 될 수 있습니다."
 HEZ_Al-Radwan: "알-라단 특수부대"
 HEZ_Al-Radwan_desc: "헤즈볼라에서 가장 전문화된 부대인 알라드완 부대는 새로운 개혁을 거쳐야 하며 장비 현대화의 새로운 단계도 거쳐야 합니다. 정예 중의 정예가 최신 장비를 갖추지 못했다면 우리 군대에 무슨 가치가 있겠습니까?"
 iranian_roads_autonomy_TT: "이란의 도로"
 iranian_construction_tools_autonomy_TT: "이란계 건설 기반"
 iranian_offices_autonomy_TT: "이란계 사무소"
 HEZ_wave_of_volunteers: "새로운 헌신자들의 물결"
 HEZ_wave_of_volunteers_desc: ""
 HEZ_secret_service: "헤즈볼라의 첩보 기관"
 HEZ_secret_service_desc: ""
 HEZ_secret_service_2: "헤즈볼라의 첩보 기관"
 HEZ_secret_service_2_desc: ""
 HEZ_Intervention_forces: "개입군"
 HEZ_Intervention_forces_desc: "이제 우리는 국가의 정치·행정 문제에서 완전히 중앙집권화되고 규율을 갖추었으므로, 저항의 이상을 전파하는 데 우리의 모든 힘과 자원을 사용할 때가 되었습니다. 이제 우리 군대의 모든 우선순위는 다음과 같습니다. §R제국주의자들에게 검은 태양이 되어라, 그 아래에는 희망이 없다.§!"
 HEZ_Increasing_our_presence_aboard: "해외에서 우리의 존재를 각인"
 HEZ_Increasing_our_presence_aboard_desc: "저항의 교리를 세계 모든 곳에 퍼뜨리려면 먼저 우리가 어디에나 있어야 합니다. 상하이의 해안에서 미국 동해안까지, 여러분은 우리를 보게 될 것이며, 우리가 보이지 않는다면 우리의 깃발을 보게 될 것입니다..."
 HEZ_Militarizing_our_society: "사회의 군사화"
 HEZ_Militarizing_our_society_desc: "새로 얻은 국가를 어떤 외세의 위협으로부터도 내부적으로 완전히 안전하게 만들려면 우리 국민을 극도로 군사화해야 합니다. 적이 우리를 침공하여 우리가 쓰러진다면, 적도 우리와 함께 가야 합니다."
 HEZ_Hezbollahs_International_recruitment: "헤즈볼라 국군"
 HEZ_Hezbollahs_International_recruitment_desc: "많은 사람들이 \\"헤즈볼라의 군대란 무엇인가?\\"라고 물을 수 있으며, 아마도 우리 조직 창설 이래 누구도 이 질문에 제대로 대답하지 못했을 것입니다. 하지만 이제 우리에게는 이 질문에 대한 매우 간단하고 짧은 대답이 있습니다. 헤즈볼라의 군대는 레바논 남부 전체이며 저항이 활동하는 모든 곳입니다. 레바논의 모든 집에서 AK-47을 찾을 수 있지만, 확실히 혼자서는 찾지 못할 것입니다..."
 HEZ_Specialized_Agents: "특수 요원"
 HEZ_Specialized_Agents_desc: "전 세계에 걸친 정보 지배력을 확대하려면 우리 스스로 특수 요원 훈련을 활용해야 합니다. 물론 헤즈볼라의 정보 훈련에는 테헤란 형제들의 경험을 활용할 수 있습니다. 1990년대 \\"VAJA\\"의 대규모 반대파 숙청은 복잡한 정보의 세계를 분석하는 훌륭한 방법이 될 수 있습니다..."
 HEZ_Expand_Hezbollahs_Secret_Service: "헤즈볼라 첩보 기관 확장"
 HEZ_Expand_Hezbollahs_Secret_Service_desc: "우리 정보기관에 경계란 없습니다. 우리는 어디에나 있으며 어디에나 있을 수 있습니다! 여러분이 소셜 미디어에 우리를 비판하는 글을 올리면 우리는 볼 수 있습니다. 가자 근처의 비밀 군사 기지에서 일하고 있다면 우리는 여러분을 볼 수 있습니다. 그리고 백악관에서 우리에게 반대하는 법안에 찬성표를 던진다면 우리는 그것을 볼 수 있습니다. 원하든 원하지 않든 우리는 여러분을 지켜보고 있습니다. 우리는 모든 것을 지켜보고 있습니다..."
 HEZ_Proper_use_of_recon: "정찰의 적절한 활용"
 HEZ_Proper_use_of_recon_desc: "시온주의 유대인 병사는 전우가 전시에 자신을 배신하고 등 뒤에서 칼을 꽂으리라고는 결코 예상하지 못합니다. 모두가 하나로 단결하여 연결되어 있다고 믿기 때문입니다. 배신이란 원래 그런 것입니다... 닥쳐올 줄 모른다는 것이죠... 어쨌든 우리의 정보 전술의 엄청난 발전과 이를 군에 올바르게 활용함으로써, 적이 알아차리지도 못하는 사이에 적이 가진 모든 것을 탐지하고 파괴할 수 있습니다. 앞서 말했듯이 그들은 닥쳐올 줄 모릅니다..."
 HEZ_last_effects_of_the_drugs: "마약이 미치는 마지막 변화"
 HEZ_last_effects_of_the_drugs_desc: "마약 중독으로 미국 사회를 해친다는 우리의 우선 과제는 끝났지만, 미국으로 보내는 우리의... 마지막 마약 선적분으로 여전히 미국을 해칠 수 있습니다. 그렇습니다. 우리의 마약 선적이 극도로 줄어든 것은 사실입니다. 하지만 누가 완전히 중단되었다고 했습니까?"
 HEZ_propaganda_for_north_america: "북아메리카 선전"
 HEZ_propaganda_for_north_america_desc: "이제 우리가 미국 사회 자체에 영향을 미칠 수 있게 되었으므로, 그 안에서도 우리의 이익을 실행에 옮길 때입니다. 북미 정치에 큰 타격을 주지는 못하겠지만, 북미 정부들이 작지만 폭력적인 시위를 처리하느라 주의를 빼앗기게 하는 좋은 방편이 될 수 있습니다..."
 HEZ_an_american_muslim_spring: "아메리카 무슬림의 봄?"
 HEZ_an_american_muslim_spring_desc: "계획을 개시할 준비를 해야 할 때가 왔습니다. 북미 전역에서 시위에 자금을 대고 이끌면, 우리가 감당할 수 있는 최선의 방식으로 최소한 북미의 타락한 국가들에 타격을 줄 수 있습니다..."
 HEZ_fund_muslim_institutes: "무슬림 기관 원조"
 HEZ_fund_muslim_institutes_desc: "북미 국가들에 가능한 최선의 방식으로 타격을 주려면 대중의 지지와... 무력의 지원이 모두 필요합니다... 이를 위해 우리는 이슬람 기관에 투자하고, 필요하다면 우리 성직자 일부를 불법적인... 방법으로 북미에 보낼 것입니다..."
 HEZ_muslim_militias: "무슬림 민병대?"
 HEZ_muslim_militias_desc: "이제 북미 전역으로 혼란이 퍼지기 시작하면서, 서방의 기준으로는 그다지 용납되지 않는... 방식으로 북미에 입히는 피해를 늘릴 좋은 기회가 생긴 듯합니다..."
 HEZ_first_wave_of_protests: "첫 대규모 시위"
 HEZ_first_wave_of_protests_desc: "우리는 \\"특정\\" 이슬람 기관들이 우리의 대의와 사상을 이해하고 받아들이도록 준비하고 자금을 대기에 충분할 만큼 북미에 영향을 미치고 투자해 왔습니다. 이제 계획을 개시해야 하며, 결국에는 대악마에게 최대한의 타격을 입혀야 합니다..."
 HEZ_the_muslim_spring: "The Muslim Spring"
 HEZ_the_muslim_spring_desc: "§R이걸 예상 못했다고... 진짜?§!"
 HEZ_iranian_missiles: "이란의 미사일"
 HEZ_iranian_missiles_desc: "시온주의자와 미국인을 두려움에 떨게 하는 단 하나... 하늘에서 오는 죽음입니다! 이란 미사일의 최신 세대를 들여와 우리 이익을 위해 새로운 미사일 장비를 사용하고 연구할 기회를 활용할 것입니다."
 HEZ_Defence_force: "방위군"
 HEZ_Defence_force_desc: "우리가 존재하는 지역의 전략적 위치 덕분에, 우리는 말 그대로 티레와 우리가 통제하는 레바논의 다른 지역들을 정복할 수 없는 요새로 만들 수 있습니다. 그러니 시작합시다."
 HEZ_Preparing_an_airforce: "Preparing an Air Force"
 HEZ_Preparing_an_airforce_desc: "이제 우리 군에 완전한 \\"현대적\\" 접근을 취하려 하는 만큼, 우리는 독자적인 공군 군단을 편성하고 가능한 한 많은 항공 기반시설을 건설해야 합니다. 우리가 적만큼 전문적이고 현대적이 되면 적을 교란하고 혼란에 빠뜨릴 것입니다."
 HEZ_Establish_a_Flight_School: "비행학교 설립"
 HEZ_Establish_a_Flight_School_desc: "이제 레바논 남부에 항공 기반시설이 충분하므로, 시리아와 이란 동맹국에 자국에서 새로운 세대의 항공 장교를 훈련시켜 달라고 요청할 수 있습니다. 이는 분명 저항에 큰 이익이 될 것입니다."
 HEZ_Defending_Our_Shores: "해안을 방어하라"
 HEZ_Defending_Our_Shores_desc: "시온주의자와 미국의 위협은 지상군에만 있는 것이 아닙니다. 따라서 이제 우리는 육지뿐만 아니라 해안도 요새화해야 합니다."
 HEZ_Getting_off_our_shores: "해안에서 더 멀리"
 HEZ_Getting_off_our_shores_desc: "우리의 적들에 대한 방어 능력을 강화하기 위해, 새로운 군함의 건설이 이제 필요합니다. 새로운 중공업 해군 건설 산업을 활용하여, 새로 조직된 우리의 해군은 지중해의 전장에서 그 존재를 드러낼 것입니다."
 HEZ_Producing_Equipment: "장비 생산"
 HEZ_Producing_Equipment_desc: "해외에서 장비를 받는 전통적인 방식을 결코 포기하지는 않겠지만, 그래도 우리 장비를 직접 생산하기 위한 독자적인 군사 복합체를 만들어야 합니다. 그럴 기회가 있는데 왜 활용하지 않겠습니까?"
 HEZ_Updating_our_Equipment: "장비 업그레이드"
 HEZ_Updating_our_Equipment_desc: "이제 군수 산업을 보유할 수 있게 되었으므로 우리가 생산하는 장비를 최적화하고 업그레이드할 수 있습니다. 독자적인 산업에 많은 자금을 투입한 뒤라면 분명 큰 이익이 될 것입니다."
 HEZ_Protecting_our_Borders: "국경 방어"
 HEZ_Protecting_our_Borders_desc: "그들이 우리에게 맞서 장벽을 세우려 했다고? 하! 우리는 그들에 맞서 요새를 세울 것이다!"
 HEZ_Independence: "독립"
 HEZ_Independence_desc: "우리는 이맘 호메이니와 하메네이의 사상에 충실할 것이지만, 더 이상 우리나라에 대한 어떤 종류의 외세의 영향도 용납하지 않을 것입니다! 이란은 우리의 친구이자 형제이자 동맹입니다. 이는 의심의 여지가 없습니다. 하지만 이란이 우리에게 영향을 미치고 우리를 조종하고 있다는 사실도 부인할 수 없습니다! 헤즈볼라와 이란의 관계는 대등한 힘 대 힘의 관계여야 하며, 종속국 대 영주의 관계여서는 안 됩니다!"
 HEZ_Politics_in_focus: "정치 중심"
 HEZ_Politics_in_focus_desc: ""
 HEZ_banks_in_beirut: "베이루트의 은행"
 HEZ_banks_in_beirut_desc: "베이루트에 우리와 연결된 새로운 민간 은행을 설립하면 새로운 방식으로 수입을 얻을 수 있습니다. 분명 투자자들이 베이루트와 레바논 남부에 있는 우리 은행을 찾아올 것입니다!"
 HEZ_negotiations_in_the_south: "남쪽과의 협상"
 HEZ_negotiations_in_the_south_desc: "우리의 중점은 더 이상 전 세계의 조직과 단체를 운영하고 무장시키는 데만 있지 않습니다. 외국 투자자들로부터... 막대한 돈을 얻을 수 있는데 굳이 그렇게 공격적일 필요가 있겠습니까?"
 HEZ_a_new_economy: "새로운 경제"
 HEZ_a_new_economy_desc: "새로운 기회에 다가서면 새로운 아이디어도 얻게 됩니다... 이번에는 이 \\"새로운\\" 아이디어가 우리 경제를 위한 것이며, 실행에 옮겨진다면 우리에게 큰 이익이 될 수 있는 것 같습니다!"
 HEZ_a_free_market: "자유 시장"
 HEZ_a_free_market_desc: "우리는 그저 조금... 자본주의적일 뿐입니다!"
 HEZ_a_free_industry: "그리고 자유로운 산업!"
 HEZ_a_free_industry_desc: "그저 우리 노동력을 최선의 방식으로 활용할 뿐입니다..."
 HEZ_friends_in_lebanon: "레바논의 친구들"
 HEZ_friends_in_lebanon_desc: "늘 그렇듯, 우리는 베이루트와 레바논의 다른 주요 지역에 있는 많은 무슬림 및 비무슬림 사업가들을 알고 있으며, 그들은 가능한 모든 방법으로 우리의 대의를 지원하고자 합니다... 그러니 그들의 지원 제안을 거절할 이유가 있겠습니까?"
 HEZ_friends_in_outside: "그리고 그 밖의 친구들"
 HEZ_friends_in_outside_desc: "레바논 내의 연줄이 도움이 될 수는 있지만 충분하지는 않습니다. 분명히, 우리의 후원자와 지지자들은 레바논에만 있는 것이 아니라 서남아시아 지역 전역과 심지어... 그 너머에도 있습니다..."
 HEZ_ready_for_construction: "건설 준비"
 HEZ_ready_for_construction_desc: "이제 다른 당사자들로부터 추가적인 경제적 지원을 받고 있으므로 레바논 남부에서 우리의 산업 계획을 실행할 준비가 되었으며, 분명 우리의 파트너들도 우리와 함께 일하고 협력할 것입니다."
 HEZ_collaboration_in_the_military_industry: "군수산업과 협력"
 HEZ_collaboration_in_the_military_industry_desc: "암시장에서 장비를 구할 방법이 많다고 해서 우리 스스로에게 의존하지 않고 우리 장비를 생산하거나 개발하지 않아도 된다는 뜻은 아닙니다... 따라서 이제 우리는 우리 자신의 군수 산업을 건설해야 합니다."
 HEZ_collaboration_in_the_civilian_industry: "민간 산업과 협력"
 HEZ_collaboration_in_the_civilian_industry_desc: "민간 복합단지가 우리의 이익에 그다지 유용하지는 않을 수 있지만, 그래도 산업 기반 구축에는 필요하며 기반시설 및 기타 산업 문제를 해소해 줄 수 있습니다."
 HEZ_al_bina: "지하드 알 비나"
 HEZ_al_bina_desc: "레바논 내전이 끝난 후 우리가 설립한 헤즈볼라의 건설 조직인 지하드 알비나는 이제 되살려져 헤즈볼라 내에서 새로운 지위로 격상될 수 있습니다. 또한 이 조직은 이슬람 혁명수비대의 \\"하탐 알안비아 건설 본부\\"와 매우 비슷하므로, 지하드 알비나를 이란의 모델과 매우 유사하게 만들 수 있습니다."
 HEZ_new_dubai: "새로운 두바이"
 HEZ_new_dubai_desc: "싱가포르의 새로운 경쟁자일 뿐입니다!"
 HEZ_industrial_investments: "산업 투자"
 HEZ_industrial_investments_desc: ""
 HEZ_liberization: "자유화"
 HEZ_liberization_desc: ""
 HEZ_foreign_economical_funds: "해외 경제 기금"
 HEZ_foreign_economical_funds_desc: ""
 HEZ_the_second_khatam_al_anbia_construction_camp: "지하드 알 비나 건설 캠프"
 HEZ_all_emerging_drift_to_shia: "All emerging popularity will be §Ytransferred§! to §GHardline Shia Revolutionary§! party."
 HEZ_defenders_of_the_shrine: "성지의 수호자"
