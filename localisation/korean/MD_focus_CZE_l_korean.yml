 CZE_the_family_reunited_idea: "재결합한 가문"
 CZE_HUN_foreign_support_to_democratics: "친서방 정당에 대한 외국의 지원"
 CZE_HUN_support_to_democratics: "친서방 정당 지원"
 CZE_HUN_spy_wars_fidesz: "우리 정치를 겨냥한 외국 첩자들"
 CZE_HUN_spy_wars_fidesz_desc: "다른 나라들이 우리 정치를 조종하려 하고 있으니, 나라를 지키기 위해 요원들을 준비시켜야 합니다."
