 PER_sasanid_lineage_TT: "£text_icon_kaldanger 이 인물은 아르테시와 거의 관련이 없으며, 사회민주주의 정당인 £PER_Neutral_conservatism  (NFI) 이란 민족전선의 일원입니다. 그를 마르즈반으로 지명하면 £PER_Neutral_conservatism  (NFI) 이란 민족전선과 연립이 구성됩니다. 이 인물은 이슬람 이전 이란의 사산 왕조에서 혈통을 이어받았다고 하는 이란 북부 바반드 왕조와의 관련성을 나타내는 바반드라는 성을 가지고 있습니다."
