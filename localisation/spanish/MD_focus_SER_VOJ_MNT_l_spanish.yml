 SER_serbian_armed_forces: "Las Fuerzas Armadas de Serbia"
 SER_serbian_armed_forces_desc: "El ejército es crucial para asegurar la independencia de Serbia. Demosles tanto poder como podamos para protegernos."
 SER_army_reform: "Reforma Militar"
 SER_army_reform_desc: "El ejército necesita urgentemente ser reparado si esperamos cualquier tipo de guerra. Tal como está ahora, no estará listo para defender a nadie."
 SER_army: "Las Fuerzas Armadas de Serbia"
 SER_army_desc: "Las Fuerzas Armadas de Serbia son el ejército de Serbia."
 SER_doctrine: "La Nueva Doctrina Militar"
 SER_doctrine_desc: "Ahora no necesitamos mantener un ejército enorme para defender nuestro país, cambiaremos nuestra doctrina militar."
 SER_oborona: "La Ley de Defensa"
 SER_oborona_desc: "Our country will focus on defending its territories, not attacking its neighbors."
 SER_slujba: "Transición a un Ejército Contratado"
 SER_slujba_desc: "Tenemos la intención de llevar nuestro ejército a una base contractual y alejarnos de la práctica del reclutamiento."
 SER_goz_granitca: "Transferir la Protección de la Frontera del Estado"
 SER_goz_granitca_desc: "A partir de ahora, los poderes para proteger la frontera serán transferidos al Ministerio del Interior."
 SER_univer: "Academia Militar"
 SER_univer_desc: "The Military Academy of the University of Defence is a college devoted to military education and career development located in Belgrade, Serbia. The academy forms part of the Serbian higher education system, offering accredited graduate and postgraduate curriculum. It contains an undergraduate military college as well as postgraduate studies."
 SER_avia: "Fuerza Aérea Obsoleta"
 SER_avia_desc: "The Serbian Air Force and Air Defence, is the air force of Serbia and service branch of the Serbian Armed Forces. Its mission is to guard and protect the sovereignty of Serbian airspace, and jointly with the Serbian Army, to protect territorial integrity of the country."
 SER_new_air_lines: "Formar Nuevas Alas Aéreas"
 SER_new_air_lines_desc: "We are optimizing the number of air wings in our fleet for better coordination and manageability."
 SER_pereosnash: "Reequipamiento"
 SER_pereosnash_desc: "Comenzaremos a reequipar nuestra flota aérea con nuevos modelos de repuestos y equipos."
 SER_vpk: "Industria de Defensa de Serbia"
 SER_vpk_desc: "The military-industrial complex of Serbia is a set of scientific research, testing organizations and manufacturing enterprises in Serbia that carry out the development, production and armament of military and special equipment, ammunition for both the Serbian army and for export."
 SER_zastava: "Zastava Arms"
 SER_zastava_desc: "Zastava Arms is a Serbian manufacturer of firearms and artillery, based in Kragujevac, Serbia. In 1853, it was founded, and cast its first cannon. It is the leading producer of firearms in Serbia and is a large contributor to the local defense industry. Zastava Arms produces and exports a wide variety of products to over forty countries, including the Zastava M70, a Kalashnikov rifle."
 SER_uniform: "Mile Dragic"
 SER_uniform_desc: "It produces uniforms, military equipment, helmets and bulletproof vests."
 SER_rszo: "EDePro"
 SER_rszo_desc: "EDePro es una empresa con sede en Belgrado, Serbia, que desarrolla soluciones para cohetes de combustible sólido, misiles propulsados por turborreactor y la producción de materiales energéticos."
 SER_avto: "Zastava TERVO"
 SER_avto_desc: "Zastava TERVO, abreviatura de \"Zastava Terenska Vozila\", es una empresa serbia del sector automovilístico y de defensa, especializada en la producción de vehículos todoterreno. Con sede en Kragujevac, se formó con todos los activos de Zastava Trucks, incluida la mayoría de sus empleados."
 SER_pvo: "PPT Namenska"
 SER_pvo_desc: "PPT Namenska is a Serbian manufacturer of arms, mortars, grenade launchers, unmanned ground vehicle, hydraulics and pneumatics, airplane parts and some complex weapons system including modernized M-77 Oganj, PASARS-16, and LRSVM Morava in various stages of production. There is also a production for civil and industrial users."
 SER_droni: "PR-DC"
 SER_droni_desc: "PR-DC, a privately-owned Serbian company specialised in drones, exhibited a full range of products including loitering munitions, one of them nearly ready for the market while many others are still in the development stage."
 SER_export: "Yugoimport SDPR"
 SER_export_desc: "Yugoimport SDPR es un fabricante de armas de propiedad estatal serbio, así como una empresa intermediaria para la importación y exportación de equipos relacionados con la defensa."
 SER_genshtab: "Estado Mayor de Serbia"
 SER_genshtab_desc: "The General Staff of the Serbian Armed Forces is the highest authority within the Serbian Armed Forces and a significant command entity with numerous organizational units under its direct command."
 SER_guard: "Guardia de las Fuerzas Armadas de Serbia"
 SER_guard_desc: "The Guard of the Serbian Armed Forces is an honour guard unit of the Serbian Armed Forces under the direct command of the General Staff. Besides ceremonial duties its main tasks include security and logistics missions."
 SER_kobra: "Los \"cobras\""
 SER_kobra_desc: "The Detachment of the Military Police for Special Operations \"Cobras\" is a military police unit of the Serbian Armed Forces directly subordinated to the General Staff. The unit is responsible for close protection, counter-terrorism and special operations."
 SER_training: "Mando de Entrenamiento"
 SER_training_desc: "Training Command is command responsible for training of the members of Serbian Armed Forces."
 SER_uchenia: "Ejercicios Militares Conjuntos"
 SER_uchenia_desc: "Nuestro ejército necesita ganar experiencia de estados más experimentados. Comenzaremos a realizar ejercicios abiertos con representantes de grandes potencias."
 SER_mvd: "Ministerio del Interior"
 SER_mvd_desc: "The Ministry of Internal Affairs of the Republic of Serbia or the Ministry of Interior, is a cabinet-level ministry in the Government of Serbia."
 SER_police: "Policía de Serbia"
 SER_police_desc: "The Police of Serbia , formally the Police of the Republic of Serbia , commonly abbreviated to Serbian Police , is the national civilian police force of Serbia. The Serbian Police is responsible for all local and national law enforcement. It is under the jurisdiction of the Ministry of Internal Affairs through its Police Directorate."
 SER_jandarmi: "Gendarmería"
 SER_jandarmi_desc: "La Gendarmería es la fuerza de gendarmería nacional de Serbia, encargada de tareas de cumplimiento de la ley de alto riesgo y especializadas. Está bajo la autoridad de la Dirección de Policía de la Policía de Serbia."
 SER_anti_terror: "Unidad Antiterrorista Especial"
 SER_anti_terror_desc: "La Unidad Antiterrorista Especial es una unidad táctica de élite de la Policía de Serbia."
 SER_kto: "Unidad Contraterrorista"
 SER_kto_desc: "La Unidad Contraterrorista fue una unidad táctica policial de la Policía de Serbia."
 SER_zakup: "Compra de Armas Extranjeras"
 SER_zakup_desc: "Compraremos armas para nuestras unidades policiales."
 SER_military: "Ejército Serbio Reformado"
 SER_defence_doctrine: "La Ley de Defensa"
 SER_usa_exer: "Ejercicios con los EE. UU."
 SER_sov_exer: "Exercises With Russia"
 SER_anti_rom_doc: "Doctrina Militar Anti-Rumana"
 SER_anti_bos_doc: "Doctrina Militar Anti-Bosnia"
 SER_anti_bul_doc: "Doctrina Militar Anti-Búlgara"
 SER_anti_cro_doc: "Doctrina Militar Anti-Croata"
 ser_exer_start: "Se están llevando a cabo §Yejercicios§!"
 prepare_change_doctrine: "Hay una oportunidad para §Ycambiar§! la doctrina"
 SER_korba_TT: "Se creará un batallón de policía militar - §Y'Cobra'§!"
 SER_guard_TT: "Se creará un batallón de la §YGuardia de Serbia§!"
 SER_kto_unit: "Ministerio del Interior Reformado"
 SER_exercises_category: "[SER.GetFlag]Ejercicios Militares"
 SER_exercises_category_desc: "\n\n\n\n\n\n£SER_desctext_export_exer \n\n\n\n\n\n\n\n\n§YNuestro ejército§! necesita un conjunto constante de experiencia, porque estamos lejos de §Rconflictos mundiales§!. Debemos decidir con qué país realizaremos ejercicios - [SOV.GetFlag]§YRusia§! o [USA.GetFlag]§YEstados Unidos§!"
 SER_uchenia_with_sov: "§YConduct§! exercises with [SOV.GetFlag]§YRussia§!"
 SER_uchenia_with_usa: "§YRealizar§! ejercicios con [USA.GetFlag]§YEstados Unidos§!"
 SER_doctrine_category: "[SER.GetFlag]Doctrina Militar de Serbia"
 SER_doctrine_category_desc: "\n\n\n\n\n\n£SER_desctext_export_doctrine \n\n\n\n\n\n\n\n\n§YLa doctrina militar§! es un reflejo de la §Ypolítica exterior§! de nuestro país [SER.GetFlag], quién consideramos nuestro §Renemigo§! y quién nuestro §Galiado§!. ¿Estamos listos para §Ratacar§! a alguien, o nos §Gdefenderemos§! de §Renemigos§! externos?"
 SER_de_fence_doctrines: "[SER.GetFlag]§YDoctrina de Defensa§!"
 SER_anti_rom_doctrines: "[ROM.GetFlag]§RDoctrina Militar Anti-Rumana§!"
 SER_anti_bos_doctrines: "[BOS.GetFlag]§RDoctrina Militar Anti-Bosnia§!"
 SER_anti_bul_doctrines: "[BUL.GetFlag]§RDoctrina Militar Anti-Búlgara§!"
 SER_anti_cro_doctrines: "[CRO.GetFlag]§RDoctrina Militar Anti-Croata§!"
 ser_export.1.t: "Serbia Nos Ofrece Comprar Sus Armas"
 ser_export.1.d: "The [SER.GetFlag]Serbian government, through its Yugoimport SDPR, makes an offer to us to purchase certain types of weapons that they produce. Will we agree?"
 ser_export.1.a: "Comprar SPART"
 ser_export.1.b: "Comprar Tanques"
 ser_export.1.c: "Comprar Rifles"
 ser_export.1.e: "No planeamos adquirir armas serbias."
 ser_export.2.t: "Exportación de Armas"
 ser_export.2.d: "[FROM.GetFlag]Compraron nuestro SPART"
 ser_export.2.a: "Bien"
 ser_export.3.t: "Exportación de Armas"
 ser_export.3.d: "[FROM.GetFlag]Compraron nuestros Tanques"
 ser_export.3.a: "Bien"
 ser_export.4.t: "Exportación de Armas"
 ser_export.4.d: "[FROM.GetFlag]Compraron nuestros Rifles"
 ser_export.4.a: "Bien"
 ser_export.5.t: "Exportación de Armas"
 ser_export.5.d: "[FROM.GetFlag]Se negaron a comprar nuestras armas"
 ser_export.5.a: "Triste"
 SER_the_kingdom_of_serbia: "Nueva Serbia Nacionalista"
 SER_the_kingdom_of_serbia_desc: "Es hora de poner fin a la era de humillación del pueblo serbio, lucharemos por el renacimiento nacional de nuestra nación."
 SER_ter_down_communist_narratives: "Derribar a los Comunistas"
 SER_ter_down_communist_narratives_desc: "Debemos detener la propagación de la enfermedad marxista y reforzar el patriotismo serbio!"
 SER_end_modern_decadence: "Revival of The National Spirit"
 SER_end_modern_decadence_desc: "We will begin the revival of the national spirit of the great Serbian people - now!"
 SER_cultural_reawakening: "Despertar Cultural"
 SER_cultural_reawakening_desc: "La cultura serbia es una de las más grandes del mundo! Debemos revivirla."
 SER_national_reforms: "Reforma Nacional"
 SER_national_reforms_desc: "Las primeras reformas estarán listas y se anunciarán al pueblo pronto. Abajo con la minimización de los serbios en su propio territorio."
 SER_loyal_military: "Un Ejército Leal"
 SER_loyal_military_desc: "Un estado fuerte debe tener un ejército fuerte y leal. Lucharemos por la lealtad del ejército de nuestro país."
 SER_traditional_family_values: "Valores Familiares Tradicionales"
 SER_traditional_family_values_desc: "La familia tradicional es el motor de la expansión del pueblo serbio, no necesitamos valores occidentales aquí."
 SER_reinforce_the_population: "Reforzar la Población"
 SER_reinforce_the_population_desc: "Cada serbio debe estar listo para defender el país con armas en sus manos, no podemos permitir que nuestra gente vea en silencio nuevamente cómo muere su país."
 SER_autarkal_transition: "Transición Autárquica"
 SER_autarkal_transition_desc: "We will strive for autarky, our people must become economically independent"
 SER_bread_and_mother_serbia: "Pan y Madre Serbia"
 SER_bread_and_mother_serbia_desc: "Alabaremos nuestra patria para que todos sepan cuánto amamos a Madre Serbia!"
 SER_rally_the_hope_of_the_people: "Reunir la Esperanza del Pueblo"
 SER_rally_the_hope_of_the_people_desc: "La esperanza es el motivador más fuerte del pueblo para trabajar milagros! Dejemos que el pueblo espere el regreso de la antigua grandeza de nuestra nación."
 SER_nationalize_motor_industries: "Nacionalizar Industrias de Motores"
 SER_nationalize_motor_industries_desc: "No daremos nada a los capitalistas occidentales, nuestra industria pertenecerá a nuestro país!"
 SER_reincorporation_of_resources: "Reincorporación de Recursos"
 SER_reincorporation_of_resources_desc: "Los recursos naturales de Serbia serán devueltos de las manos de los funcionarios occidentales."
 SER_luxury_parties_end: "El Fin de las Ideas Occidentales en Serbia"
 SER_luxury_parties_end_desc: "Los valores occidentales finalmente serán borrados de la esfera política serbia y exterminaremos activamente a los ideólogos de estas ideas."
 SER_kosovo_uprising: "Levantamiento en Kosovo"
 SER_kosovo_uprising_desc: "Recuperaremos Kosovo para nosotros, sin compromisos."
 SER_reinstate_the_church_in_macedonia: "Reinstaurar la Iglesia de Macedonia"
 SER_reinstate_the_church_in_macedonia_desc: "Traeremos de vuelta a este país la verdadera iglesia, la iglesia real."
 SER_reinstate_church_bulgaria: "Reinstaurar la Iglesia de Bulgaria"
 SER_reinstate_church_bulgaria_desc: "Traeremos de vuelta a este país la verdadera iglesia, la iglesia real."
 SER_independent_frontier: "Una Frontera Independiente"
 SER_independent_frontier_desc: "La frontera de nuestra república es como una gran muralla, la protegeremos con ahínco y sin esperanza de que el enemigo la pase."
 SER_nationalist_propaganda: "Propaganda Nacional"
 SER_nationalist_propaganda_desc: "Debemos asegurarnos de que nuestra población solo escuche la narrativa correcta de nuestro partido!"
 SER_serbian_revanchism: "Revanchismo Serbio"
 SER_serbian_revanchism_desc: "We will still take revenge on our enemies and abusers, revanchism in Serbian, what our enemies will be afraid of."
 SER_legacy_of_stefan_dusan: "El Legado de Dusan"
 SER_legacy_of_stefan_dusan_desc: "El gran pasado de Serbia motiva a muchos de nuestros ciudadanos a unirse al ejército, porque solo por la fuerza de las armas se puede restaurar la antigua grandeza de nuestro país."
 SER_autark_idea: "Autarquía Serbia"
 SER_inner_policy: "Política Interna"
 SER_nati_idea: "New National Spirit"
 SER_idea_loyal_military: "Ejército Leal"
 SER_democratic_ascendant: "El Ascenso Democrático"
 SER_democratic_ascendant_desc: "Nuestra historia como estado democrático comienza ahora, debemos ser un ejemplo para nuestras naciones balcánicas compañeras ya que la región es muy inestable, seremos un faro de luz."
 SER_Join_the_united_nations: "Unirse a las Naciones Unidas"
 SER_Join_the_united_nations_desc: "Aunque en el pasado era inalcanzable o simplemente una mala idea, ahora tenemos una buena razón para unirnos a la ONU."
 SER_increase_federalization: "Aumentar la Federalización"
 SER_increase_federalization_desc: "Federalicemos todo lo que podamos y, con suerte, erradiquemos las malas hierbas que persisten entre nosotros."
 SER_shift_towards_mixed_economy: "Cambio Hacia una Economía Mixta"
 SER_shift_towards_mixed_economy_desc: "Nuestra economía actual funciona, pero no prospera. Debemos cambiar nuestra forma de operar para llevarnos a una era de crecimiento económico."
 SER_protect_local_industries: "Proteger Industrias Locales"
 SER_protect_local_industries_desc: "The industries run by family businesses are our most critical. To remove them is to remove the core of Serbian people and their drive."
 SER_protect_landlords: "Proteger a los Propietarios"
 SER_protect_landlords_desc: "Los propietarios facilitan mucho el negocio inmobiliario para nosotros. Sin ellos, estaríamos severamente necesitados y en necesidad de ayuda."
 SER_common_worker: "El Trabajador Común"
 SER_common_worker_desc: "Serbia funciona con la base de las personas que la impulsan. DEBEMOS asegurarnos de tener sus mejores intereses en el corazón con cualquier operación."
 SER_external_weapons_dev: "Desarrollo Externo de Armas"
 SER_external_weapons_dev_desc: "Las armas que usamos son tan importantes como los soldados que comandamos. Aunque nuestra producción nacional no es grande, podemos comprarles el equipo adecuado del extranjero."
 SER_international_arms_contracts: "Contratos Internacionales de Armas"
 SER_international_arms_contracts_desc: "Queremos armas que maten. Podemos abastecernos de estas con fuentes externas, comprando y acumulando."
 SER_final_chapters_of_milosevic: "Los Capítulos Finales de Milošević"
 SER_final_chapters_of_milosevic_desc: "Going into the 21st century, we must realize as a nation that our government is outdated, true democracy is the way of the future. Milošević's dictatorship must end, we must forget all of the nonsense of our previous leaders and start a new chapter in our history, Gotov je!"
 SER_Serbian_Arms_Industry: "La Industria de Armas Serbia"
 SER_Serbian_Arms_Industry_desc: "Nuestras armas no son las mejores, todavía. Creemos una industria para producir armas y armar a nuestros soldados."
 SER_Factory_modernisation: "Modernización de Fábricas"
 SER_Factory_modernisation_desc: "Nuestras fábricas están anticuadas y luchan por hacer el trabajo, necesitamos ponerlas al día con maquinaria moderna para poder competir en la exigente economía internacional de hoy."
 SER_Defence_Contracts: "Contratos de Defensa"
 SER_Defence_Contracts_desc: "Firmaremos contratos y aseguraremos algunas armas. Tenemos algunas empresas en mente y las contactaremos para hacer tratos."
 SER_market_oriented_reforms: "Reformas Orientadas al Mercado"
 SER_market_oriented_reforms_desc: "During the rule of Milošević, we were estranged from the international community thus resulting in an autarkical economy. Now that we aren't confined to the rules of socialism or held back by the radical agenda of Slobodan Milošević, we may reform our market to fit the modern age."
 SER_Vojvodina_Agriculture: "Desarrollo Agrícola de Vojvodina"
 SER_Vojvodina_Agriculture_desc: "Vojvodina tiene más de la mitad de nuestras tierras agrícolas, dado que la agricultura es el sector más importante de la economía serbia, es importante que valoremos el desarrollo agrícola de esta región."
 SER_crop_field_production: "Producción de Campos de Cultivo"
 SER_crop_field_production_desc: "Our fields yield far less than they could. Investing in irrigation, machinery and better seed will raise crop output across the country."
 SER_bluechip_corporations: "Corporaciones Bluechip"
 SER_bluechip_corporations_desc: "Blue Chip Electronics, Inc., más tarde Blue Chip International, fue una empresa informática estadounidense fundada por John Rossi en 1982. Fundada para desarrollar periféricos para computadoras domésticas Commodore, la empresa en 1986 comenzó a vender compatibles IBM PC de bajo costo"
 SER_fiat_chrysier: "Fiat Chrysler"
 SER_fiat_chrysier_desc: "Fiat Chrysler Automobiles, es una corporación multinacional ítalo-estadounidense conocida principalmente como fabricante de automóviles, vehículos comerciales, piezas de automóviles y sistemas de producción."
 SER_volkswagen: "Volkswagen"
 SER_volkswagen_desc: "Volkswagen es un fabricante de automóviles alemán con sede en Wolfsburg, Baja Sajonia, Alemania."
 SER_smederevo_steel_mill: "Acería de Smederevo"
 SER_smederevo_steel_mill_desc: "El GRUPO HBIS Serbia Iron & Steel, comúnmente conocido como Hesteel Serbia, es un conglomerado siderúrgico serbio con sede en Belgrado."
 SER_novi_sad_railroad: "Ferrocarril de Novi Sad"
 SER_novi_sad_railroad_desc: "La estación de ferrocarril de Novi Sad es la principal estación de ferrocarril en Novi Sad, Serbia. La estación actual, ubicada en el Bulevar Jase Tomica, se abrió en 1964, después de cerrar la antigua estación de ferrocarril de 1883 ubicada anteriormente en lo que hoy es el mercado fresco de Liman. La estación sirve a dos trenes de alta velocidad diarios a Belgrado y es parte del proyecto ferroviario Budapest-Belgrado."
 SER_Nikola_Tesla_international: "Internacional Nikola Tesla"
 SER_Nikola_Tesla_international_desc: "El Aeropuerto Internacional Nikola Tesla de Belgrado es un aeropuerto internacional que sirve a Belgrado, Serbia. Es el aeropuerto más grande y concurrido de Serbia, situado al oeste del centro de Belgrado cerca del suburbio de Surcin, rodeado de tierras bajas fértiles. Es operado por el conglomerado francés Vinci Airports y lleva el nombre del inventor serbio-estadounidense Nikola Tesla"
 SER_war_mafia: "Guerra Contra la Mafia"
 SER_war_mafia_desc: "Ha llegado el momento de combatir plenamente a la mafia en nuestro país."
 SER_step_up_inevstigations: "Aumentar las Investigaciones"
 SER_step_up_inevstigations_desc: "To fully root out the criminal elements from our society, we must start new investigations and measure every our move."
 SER_legal_framework: "Marco Legal"
 SER_legal_framework_desc: "Crearemos el marco legal necesario para futuras reformas"
 SER_active_combatting: "Combate Activo"
 SER_active_combatting_desc: "Ha llegado el momento de asaltar los escondites de los bandidos y combatir activamente los elementos criminales."
 SER_national_assembly: "Asamblea Nacional"
 SER_national_assembly_desc: "La Asamblea Nacional de Serbia es el órgano legislativo unicameral responsable de representar a los ciudadanos y promulgar leyes en la República de Serbia."
 SER_independent_judiciary: "Un Poder Judicial Independiente"
 SER_independent_judiciary_desc: "La separación de las ramas del gobierno asegurará nuestro futuro desarrollo democrático."
 SER_support_serbian_bosniaks: "Support Bosnian Serbs"
 SER_support_serbian_bosniaks_desc: "Debemos apoyar a nuestros compatriotas en la confederación bosnia. Es nuestro más alto deber."
 SER_Redevelop_Ties_with_Bosnia: "Re-desarrollar Lazos Con Bosnia"
 SER_Redevelop_Ties_with_Bosnia_desc: "Para apoyar a nuestros hermanos en Srpska, debemos re-desarrollar nuestras relaciones con Bosnia y considerar invertir en su economía."
 SER_national_framework: "Marco Nacional"
 SER_national_framework_desc: "Debemos trabajar más en la prosperidad de nuestra nación, sin despreciar nuestros valores nacionales."
 SER_Propose_Open_Balkan_Initiative: "Proponer la Iniciativa Balcánica Abierta"
 SER_Propose_Open_Balkan_Initiative_desc: "Para aumentar la cooperación mutua entre los estados de la región de los Balcanes y asegurar una paz sostenible, debemos aumentar el comercio mutuo entre nuestros países."
 SER_european_investment: "Inversiones Europeas"
 SER_european_investment_desc: "Para aumentar nuestros lazos con los estados europeos, podríamos querer pedirles que inviertan en nosotros."
 SER_orthodox_values: "Apoyar los Valores Ortodoxos"
 SER_orthodox_values_desc: "Orthodox values are a pillar of society for us, and we will support them."
 SER_church_and_state: "Iglesia y Estado"
 SER_church_and_state_desc: "We must redevelop our relations with the Orthodox Church accordingly to the will of our people."
 SER_kosovo_question: "La Cuestión de Kosovo"
 SER_kosovo_question_desc: "En el año 2000, el problema de Kosovo sigue siendo una preocupación internacional apremiante. Tras años de tensiones étnicas entre la población mayoritariamente albanesa y las autoridades serbias, Kosovo ha declarado su independencia, lo que llevó a una intervención militar de la OTAN en 1999 destinada a detener la crisis humanitaria. Sin embargo, el estatus de la región sigue sin resolverse, con negociaciones en curso entre Kosovo y Serbia bajo mediación internacional. El futuro de la soberanía de Kosovo y su relación con Serbia sigue siendo una fuente de incertidumbre, con esfuerzos diplomáticos centrados en lograr una resolución duradera y pacífica del conflicto."
 SER_coperate_kosovo_separatists: "Cooperar Con los Separatistas de Kosovo"
 SER_coperate_kosovo_separatists_desc: "Enclaves de nuestra población serbia aún están en Kosovo. Debemos cooperar con ellos y asegurar su seguridad."
 SER_brussels_agreement: "El Acuerdo de Bruselas"
 SER_brussels_agreement_desc: "El Primer Acuerdo de Principios para la Normalización de Relaciones, conocido informalmente como el Acuerdo de Bruselas, es un acuerdo para normalizar las relaciones entre los gobiernos de Serbia y Kosovo."
 SER_domestic_automotive_industry: "Industria Automotriz Nacional"
 SER_domestic_automotive_industry_desc: "Nuestro legado en forma de nuestra propia industria automotriz no debe ser olvidado, estamos implementando activamente los éxitos de esta industria en nuestra economía"
 SER_free_elections: "Enmiendas en la Ley Electoral"
 SER_free_elections_desc: "Es hora de traer algunos cambios a nuestra ley electoral para hacer que nuestro sistema sea verdaderamente competitivo y democrático!"
 SER_free_elections_again: "Serbia Post-Milosevic"
 SER_free_elections_again_desc: "Milosevic dejó el cargo de presidente de nuestro país, a pesar de que pudo resistir la revolución que se dirigió contra él, tarde o temprano cualquier gobernante deja su puesto"
 SER_nova_democratica_stranka: "Nova Demokratska Stranka Srbije"
 SER_nova_democratica_stranka_desc: "La coalición liderada por el Nuevo Partido Democrático de Serbia ganó las elecciones! Somos a quienes los ciudadanos han confiado llevar a cabo una transformación democrática, teniendo en cuenta las características culturales de nuestra gente!"
 SER_national_conservatism: "Conservadurismo Nacional Serbio"
 SER_national_conservatism_desc: "En nuestra política, estamos obligados a guiarnos por ideas peculiares a nuestra nación. Tales ideas son valores tradicionales y nacionalismo moderado. Sin embargo, no podemos elevar estas ideas a absolutos, necesitamos un conservadurismo nacional moderado."
 SER_diplomatic_pragmatism: "Pragmatismo Diplomático Forzado"
 SER_diplomatic_pragmatism_desc: "Estamos en una posición en la que estamos rodeados de países que son aliados directos del oeste o reclaman ese estatus. Para mantener la estabilidad en la región y evitar la pérdida de nuestra soberanía, debemos jugar con las reglas del Oeste, pero al mismo tiempo, no debemos olvidar los otros vectores de nuestra política."
 SER_market_corporatism: "Corporativismo de Mercado"
 SER_market_corporatism_desc: "The free market is our preferred option, but the mechanisms of operation of that market are flawed. It is necessary to create a system that requires government intervention in the market economy, supporting the most successful large enterprises and ensuring a dialog between these enterprises and their employees. It is also important to create conditions that will help medium and small businesses to actively develop and expand."
 SER_anti_communist_stance: "Postura anticomunista"
 SER_anti_communist_stance_desc: "El comunismo es lo peor que le ha pasado al pueblo serbio. Aunque hemos conseguido derrocar este yugo comunista, las ideas del régimen anterior y de sus partidarios siguen siendo populares. Es necesario llevar a cabo una campaña a gran escala para limpiar las mentes de la gente de esta suciedad, y los principales agitadores deben ser detenidos por crímenes de guerra."
 SER_anticorruption_action: "Campaña contra la corrupción"
 SER_anticorruption_action_desc: "El régimen de Milosevic nos ha legado una enorme cantidad de corrupción. Está presente literalmente en todos los órganos de poder de nuestro país. ¡Es necesario poner en marcha un programa para erradicar la corrupción y eliminar a los elementos corruptos!"
 SER_burrecarcy_destroy: "Cruzada Contra la Burocracia!"
 SER_burrecarcy_destroy_desc: "Bureaucracy is the Achilles' heel of our system. A bloated state apparatus hits our budget hard and also causes corruption. We will audit the activities of each body and remove unnecessary and inefficient departments, thereby balancing the budget."
 SER_punish_war_criminals: "Castigar a los Criminales de Guerra"
 SER_punish_war_criminals_desc: "Después de las guerras yugoslavas, muchos criminales de guerra aún caminan libremente en nuestra tierra, debemos cambiar esto."
 SER_spirit_of_gaulism: "Espíritu del Gaullismo"
 SER_spirit_of_gaulism_desc: "Aunque apreciamos la historia de nuestra gente, el aprendizaje mutuo de la experiencia exitosa extranjera no debe sernos ajeno. Las ideas de Charles De Gaulle se pueden considerar como una idea cercana a nuestra gente. Las ideas de un estado fuerte, una sociedad tradicional, una democracia conservadora y una prosperidad social son ideales para nuestra sociedad!"
 SER_democratica_stranka: "Demokratska Stranka"
 SER_democratica_stranka_desc: "El Partido Democrático junto con sus aliados de la coalición pudieron ganar las elecciones! La gente de Serbia pudo darse cuenta de la necesidad del rumbo europeo para nuestro estado y apoyó nuestro programa de liberalismo e integración europea!"
 SER_western_approach: "Acercarse al Oeste"
 SER_western_approach_desc: "El verdadero aliado de Serbia siempre ha sido el oeste. Fue gracias al Oeste que pudimos deshacernos del régimen dictatorial de Milosevic y limpiarnos de los oponentes militares. Debemos continuar estableciendo relaciones económicas y diplomáticas con el Oeste."
 SER_free_market_capitalism: "Capitalismo de Mercado Libre"
 SER_free_market_capitalism_desc: "La inviolabilidad de la propiedad privada y una economía de mercado libre son uno de los valores más altos de cualquier sociedad liberal. Estamos obligados a crear todas las condiciones para el desarrollo de las relaciones de mercado con una mínima interferencia del gobierno."
 SER_eu_investments: "Investments from EU"
 SER_eu_investments_desc: "La Unión Europea está muy interesada en la región de los Balcanes, es decir, en su desarrollo. Estamos interesados en inversiones adicionales. ¿Por qué no ayudarnos mutuamente?"
 SER_radical_liberalism: "Liberalismo Radical"
 SER_radical_liberalism_desc: "Muchas personas llaman a nuestro programa liberal radical, diciendo que Serbia no está lista para tales cambios y que estamos haciendo una nueva revolución. Así es, pero como dijo Marx \"La revolución es la locomotora de la historia.\" Nuestras reformas se pueden llamar una revolución en cierta medida, así que nos llamaremos liberales radicales con orgullo!"
 SER_multiculturalism: "Educación Europea"
 SER_multiculturalism_desc: "La transición al estándar europeo de educación, como muestra la práctica, aumenta la eficiencia del sistema educativo, y la experiencia de adoptar el estándar europeo en los países balcánicos se puede aplicar en Serbia también."
 SER_antimilitarism: "Anti-Militarismo"
 SER_antimilitarism_desc: "El militarismo es una enfermedad de nuestra sociedad. El presupuesto militar inflado y la militarización de la vida pública se nos presentaron como una medida forzada de defensa contra los países enemigos, pero estábamos tratando de defendernos del progreso y la civilización. El anti-militarismo ganó en Serbia, ahora es el momento de recortar el presupuesto del ejército"
 SER_miracle_of_european_system: "El Milagro del Sistema Europeo"
 SER_miracle_of_european_system_desc: "Estamos en el camino de construir un modelo europeo ideal en Serbia, un modelo que una vez trajo prosperidad y progreso a los países occidentales y ahora traerá progreso a nuestro país, creando un verdadero milagro!"
 SER_progressivna_stranka: "Srpska Napredna Stranka"
 SER_progressivna_stranka_desc: "La coalición de fuerzas patrióticas serbias liderada por el Partido Progresista Serbio ganó las elecciones. El país ha estado plagado de inestabilidad e incertidumbre durante mucho tiempo, y es hora de devolver la estabilidad y el crecimiento económico al país. Serbia no debe detenerse!"
 SER_economic_stimulation: "Estimular la Economía Serbia"
 SER_economic_stimulation_desc: "No podemos quedarnos de brazos cruzados y ver caer nuestra economía. Necesitamos una política para estimular el crecimiento económico, solo utilizando las herramientas de regulación económica y una gestión económica adecuada podremos salir de la situación inestable."
 SER_eastern_investments: "Contactar al Este"
 SER_eastern_investments_desc: "La Serbia progresista necesita una política multivectorial progresista que implique el compromiso con todo el mundo. Al este de nosotros está Rusia, que es amigable con nosotros, y China, que está interesada en el desarrollo de los Balcanes. Entonces, ¿por qué no los invitamos a invertir en nuestra economía prometedora?"
 SER_western_investments: "Invitar a Inversores Occidentales"
 SER_western_investments_desc: "Nuestra política multivectorial también presupone una estrecha cooperación con los países occidentales. Podemos atraer a muchos inversores occidentales para el desarrollo de nuestra economía."
 SER_populism: "Populismo Serbio"
 SER_populism_desc: "A menudo nos llaman populistas, supuestamente solo podemos hablar, pero en la práctica no podemos tomar una decisión, pero entendemos el populismo a nuestra manera. Para nosotros el populismo es popularismo, estamos listos para servir a nuestra gente hasta el final, para escuchar la opinión del pueblo y tomar solo el lado del pueblo!"
 SER_anticor_mesuars: "Medidas Anti-Corrupción"
 SER_anticor_mesuars_desc: "Combatir la corrupción es la promesa con la que fuimos a las elecciones. Es hora de cumplir nuestra promesa! Movilizaremos todas las fuerzas del departamento anti-corrupción y limpiaremos el país de esta enfermedad!"
 SER_centralisation_police: "Centralizar las Fuerzas Policiales"
 SER_centralisation_police_desc: "Con la llegada de la democracia a nuestro país, los gobiernos liberales que nos precedieron gradualmente desmantelaron la fuerza policial, considerándola innecesaria por el momento. Es necesario devolver a la policía su financiación para fortalecer el orden social"
 SER_social_democracy: "Socijaldemokratska Unija"
 SER_social_democracy_desc: "La coalición liderada por la Unión Socialdemócrata ganó las elecciones! Nuestra gente ha elegido el camino del anti-militarismo y la socialdemocracia, dos ideas que pueden traer prosperidad al país"
 SER_social_security: "Seguridad Social"
 SER_social_security_desc: "Lo más importante para nosotros es proporcionar a nuestros ciudadanos un alto nivel de vida y darles una oportunidad para una buena vida. Necesitamos aumentar el gasto social!"
 SER_social_market: "Mercado Social"
 SER_social_market_desc: "Aunque la economía de mercado libre es el sistema económico preferido, la forma en que el mercado trata al hombre común es inaceptable. El estado debe crear un sistema que combine tanto medidas de protección social como el mercado libre."
 SER_social_dem: "Socialdemocracia Serbia"
 SER_social_dem_desc: "Nuestra ideología central es la socialdemocracia, es la razón por la que la sociedad occidental ha alcanzado su grandeza. Utilizaremos la experiencia de nuestros socios y haremos de la socialdemocracia una guía para nuestro gobierno."
 SER_antiauthoritarism: "Anti-Authoritarianism"
 SER_antiauthoritarism_desc: "El principal temor de nuestra sociedad es un regreso al abismo del autoritarismo y la dictadura, haremos todo lo posible para erradicar de nuestra sociedad a aquellos que nos empujan hacia atrás!"
 SER_support_unions: "Apoyar a los Sindicatos"
 SER_support_unions_desc: "Los sindicatos cumplen una función bastante importante en nuestra sociedad: la protección del trabajador común que es oprimido por el empresario. Tenemos el deber de apoyar a los sindicatos para asegurar la igualdad económica de los ciudadanos."
 SER_western_dominance: "Dominio Occidental"
 SER_western_dominance_desc: "El Oeste es nuestro principal aliado en el escenario mundial, y su ayuda difícilmente se puede subestimar. Por lo tanto, la dirección occidental debe ser dominante en nuestra política exterior."
 SER_balkan_social_democracy: "Socialdemocracia en los Balcanes"
 SER_balkan_social_democracy_desc: "No hubo un buen ejemplo de un verdadero estado socialdemócrata en los Balcanes... hasta ahora. Nos hemos convertido en un ejemplo de cómo crear una sociedad armoniosa e igualitaria!"
 SER_neutral_souverign: "Socialdemocracia en los Balcanes"
 SER_neutral_souverign_desc: "Estamos en un entorno donde el oeste y el este están tratando de tirar de la cuerda y doblarnos a su lado, pero no seremos el títere de nadie! Seguiremos nuestra propia política multivectorial y aseguraremos la estabilidad dentro de nuestro país!"
 SER_socialist_party: "Socijalisticka partija Srbije"
 SER_socialist_party_desc: "Formerly, a party centered around Milosevic, now tries to shape its new image and integrate into new democratic system. SPS was founded in 1990 as a merger of the League of Communists of Serbia and Socialist Alliance of Working People of Serbia with Slobodan Milošević as its first president."
 SER_popular_socialism: "Socialismo Popular"
 SER_popular_socialism_desc: "Nuestra nueva agenda socialista debe centrarse en nuestra gente común. Es nuestro deber cumplir sus expectativas!"
 SER_implement_economic_regulations: "Regulaciones Económicas"
 SER_implement_economic_regulations_desc: "No podemos permitir que el monstruo aterrador del mercado suprima a nuestra gente! Debemos regular el mercado para asegurar que los intereses de nuestra población estén protegidos."
 SER_green_initiatives: "Iniciativas Verdes"
 SER_green_initiatives_desc: "Debemos proponer soluciones económicas más saludables para nuestra economía. No podemos sacrificar nuestra naturaleza!"
 SER_hard_pragmatism: "Pragmatismo Duro"
 SER_hard_pragmatism_desc: "Alemania y Austria han mostrado su voluntad de invertir en nuestro país. Aunque nuestras relaciones pasadas fueron tensas, podemos intentar establecer buenas relaciones comerciales."
 SER_promote_traditions: "Promover Tradiciones"
 SER_promote_traditions_desc: "La Ortodoxia Serbia nos ha moldeado como pueblo y nación. Debemos apoyar nuestras tradiciones para preservar nuestra identidad. Algunos dicen que Dios es serbio después de todo..."
 SER_medicine_for_everyone: "Medicina para Todos"
 SER_medicine_for_everyone_desc: "Debemos asegurar que la atención médica se proporcione a todas las personas en nuestro país."
 SER_socialist_renewal: "Renovación Socialista"
 SER_socialist_renewal_desc: "Finalmente, nuestras políticas han alcanzado su punto máximo y todos nuestros planes están completados!"
 SER_support_border_closure: "Apoyar el Cierre de Fronteras"
 SER_support_border_closure_desc: "Debemos preparar nuestras fronteras con Kosovo para su ofensiva. Debemos estar preparados."
 SER_de_escalation: "Desescalada"
 SER_de_escalation_desc: "Debemos desescalar la situación de Kosovo para asegurar la paz y la prosperidad."
 SER_kosovo_is_serbia: "Kosovo es Serbia!"
 SER_kosovo_is_serbia_desc: "We cannot sacrifice our well-being to attack Kosovo. However, we can't recognize them either!"
 SER_recognize_kosovo: "Reconocer a Kosovo"
 SER_recognize_kosovo_desc: "Although the Albanian conquest of Kosovo was unfair, we must bury the hatchet once and for all."
 SER_further_belt_and_road_cooperation: "Cooperación Cinturón y Ruta"
 SER_further_belt_and_road_cooperation_desc: "China está muy interesada en invertir en nuestro país. Debemos usar esto para nuestro beneficio!"
 SER_jp_electric_power_industry_of_serbia: "Cooperación JPES"
 SER_jp_electric_power_industry_of_serbia_desc: "Elektroprivreda Srbije es una empresa eléctrica de servicios públicos de capital abierto propiedad total del Gobierno de Serbia, con sede en Belgrado, Serbia."
 SER_renewed_serbia: "Serbia Renovada!"
 SER_renewed_serbia_desc: "Serbia finalmente se ha renovado y ha dejado de ser la sombra de su antiguo yo!"
 SER_end_isolationism: "Poner Fin al Aislamiento"
 SER_end_isolationism_desc: "Debemos dejar de aislarnos y comenzar a interactuar con nuestros vecinos!"
 SER_crush_the_old_system: "Aplastar el Viejo Sistema"
 SER_crush_the_old_system_desc: "El viejo sistema de gobierno debe ser destruido y se debe establecer un nuevo sistema"
 SER_revive_cefta: "Acuerdo CEFTA"
 SER_revive_cefta_desc: "The Central European Free Trade Agreement is a free trade organization that is the successor to the Visegrad Agreement between countries that are not members of the European Union."
 SER_new_constitution: "Nueva Constitución"
 SER_new_constitution_desc: "Debemos cambiar nuestra constitución para asegurar plenamente que nuestro país siga el camino de la reforma!"
 SER_democratic_system: "Garantía de Derechos Humanos"
 SER_democratic_system_desc: "Nuestro país debe comenzar a respetar los derechos humanos para adaptarse adecuadamente al nuevo orden mundial y cooperar con otros países europeos!"
 SER_loosened_union: "Unión Relajada"
 SER_loosened_union_desc: "La unión con Montenegro podría colapsar en cualquier segundo. Es hora de reformar nuestra unión dando a Montenegro mayor autonomía y satisfacer sus deseos!"
 SER_economic_autonomy: "Autonomía Económica"
 SER_economic_autonomy_desc: "Debemos dar a nuestros hermanos algún tipo de autonomía económica y darles estímulo para un rápido crecimiento económico"
 SER_shared_currency: "Moneda Compartida"
 SER_shared_currency_desc: "To make Montenegro truly autonomous we must create new currency for them. This would create more equal conditions for development"
 SER_a_new_start: "Nuevo Comienzo"
 SER_a_new_start_desc: "The new era for our union has begun! Our reforms have brought stability to Montenegro region and we are ready to give them equal rights with Serbia."
 SER_involve_un: "Conversaciones con la ONU"
 SER_involve_un_desc: "This union with Montenegro is at the edge of collapse. To make it smooth and quick we will ask UN and International community to involve and help us in creating Sovereign Montenegro."
 SER_begin_the_recognition_process: "Comenzar el Proceso de Reconocimiento"
 SER_begin_the_recognition_process_desc: "We must start international campaign for recognition of the union's dissolution and the creation of Serbian and Montenegrin States"
 SER_remove_previous_kleptocrats: "Eliminar Kleptócratas Anteriores"
 SER_remove_previous_kleptocrats_desc: "Eliminaremos a esos kleptócratas del antiguo régimen que están causando más dolor a Serbia"
 SER_free_at_last: "Libres al fin!"
 SER_free_at_last_desc: "We have managed to dissolve this unholy union smooth and quick. It's new chapter of serbian history, long live new Serbian Republic!"
 SER_eu_integration: "Buscar Cooperación con la UE"
 SER_eu_integration_desc: "Estamos geográficamente rodeados en su mayoría por estados miembros de la Unión Europea. Debemos cooperar y tal vez incluso buscar la integración en la UE para impulsar nuestra economía y comercio."
 SER_national_conservatism_idea: "Conservadurismo Nacional"
 SER_liberal_corporatism_idea: "Corporativismo Liberal"
 SER_anticomm_idea: "Acción Anticomunista"
 SER_degaull_idea: "Espíritu de de Gaulle"
 SER_radical_liberalism_idea: "Liberalismo Radical"
 SER_free_market_idea: "Mercado Libre"
 SER_model_democracy_idea: "Democracia Europea"
 SER_populismus_idea: "Populismo Serbio"
 SER_anticorruption_measures_idea: "Medidas Anticorrupción"
 SER_econom_stim: "Estimulación Económica"
 SER_souverign_nat: "Neutral and Sovereign"
 SER_social_dem_idea: "Democracia Social"
 SER_antiauth_idea: "Represión del Autoritarismo"
 SER_unions_supp_idea: "Apoyo a los Sindicatos Laborales"
 SER_social_mark_idea: "Mercado Social"
 SER_balkan_soc_dem_idea: "Democracia Social Balcánica"
 SER_people_socialism_idea: "Socialismo Popular"
 SER_implement_econ_reg_idea: "Implementar Regulaciones Económicas"
 SER_traditions_enrolled_idea: "Tradiciones Enroladas"
 SER_socialist_renew_idea: "Renovación Socialista"
 SER_cefta_idea: "CEFTA"
 SER_cefta_idea_desc: "La Asociación de Libre Comercio de Europa Central es una organización de libre comercio que es la sucesora del Acuerdo de Visegrado entre países que no son miembros de la Unión Europea."
 SER_idea_rights: "Garantía de Derechos Humanos"
 SER_shared_currency_idea: "Moneda Compartida"
 SER_listened_un_idea: "Apoyo de la Comunidad Internacional"
 SER_ditched_subject_idea: "Libres de Montenegro"
 SER_ditched_subject_idea_desc: "Hay algunas cosas buenas en la disolución de la Unión. Una de ellas es que no necesitamos gastar dinero en Montenegro."
 SER_mixed_economy: "Economía Mixta"
 SER_mixed_economy_desc: "Serbia nunca sobreviviría en el siglo XXI si continuáramos con nuestro enfoque autárquico de la economía, nos hemos abierto al mundo y ahora el mundo se ha abierto a nosotros."
 SER_bluechip_corp: "Corporación Bluechip"
 SER_bluechip_corp_desc: "Blue Chip Electronics, Inc., más tarde Blue Chip International, fue una empresa de computadoras estadounidense fundada por John Rossi en 1982. Fundada para desarrollar periféricos para computadoras domésticas Commodore, la empresa en 1986 comenzó a vender compatibles con IBM PC de bajo costo"
 SER_disorganized_industrial_sector_desc: "Nuestra industria todavía está dispersa y confusa; con la transición gubernamental, los contratos de nuestra industria expiraron debido a la propiedad gubernamental de nuestra economía socialista y se repitió la situación en la industria de Bielorrusia después de que se produjo la independencia."
 ser_dem.1.t: "Serbia Quiere Inversiones!"
 ser_dem.1.d: "Representantes de Serbia nos han contactado solicitando inversión en la economía serbia. ¿Es esta una gran oportunidad que debemos aprovechar o optaremos por ignorar su solicitud?"
 ser_dem.1.a: "Los complejos industriales deberían ser suficientes."
 ser_dem.1.b: "Sería bueno que hubiera nuevas carreteras."
 ser_dem.1.c: "Lo que Serbia realmente quiere es una infraestructura de red."
 ser_dem.1.f: "En otra ocasión, quizás."
 ser_dem.2.t: "Estuvieron de acuerdo!"
 ser_dem.2.d: "Una potencia extranjera ha aceptado invertir en nosotros!"
 ser_dem.2.a: "¡Hurra!"
 ser_dem.3.t: "They disagreed!"
 ser_dem.3.d: "Foreign power has refused to invest in us!"
 ser_dem.3.a: "¡Qué vergüenza!"
 ser_dem.4.t: "Política Exterior"
 ser_dem.4.d: "We should carefully choose with whom we should cooperate. We could contact with western powers or we can try to get close to eastern sphere. Or we could cooperate with countries in our region."
 ser_dem.4.a: "East is our Choice"
 ser_dem.4.b: "...pero seguimos siendo una democracia occidental."
 ser_dem.4.c: "Los Balcanes deben ser pacíficos!"
 ser_dem.5.t: "Disputa en el Partido Radical Serbio!"
 ser_dem.5.d: "Ha habido un conflicto dentro del Partido Radical Serbio. Tomislav Nikolic, el líder de facto del partido, entró en conflicto con el consejo central del partido representado por Vojislav Šešelj, ahora Nikolic y Aleksandar Vucic junto con sus asociados están amenazando con dejar el partido para crear su propia nueva organización."
 ser_dem.5.a: "Nikolic y Vucic crearán un nuevo partido!"
 ser_dem.5.b: "La disputa será resuelta"
 SerbiaFocus.1.t: "La Iniciativa de los Balcanes Abiertos"
 SerbiaFocus.1.d: "[SER.GetName] ha propuesto que firmemos una nueva iniciativa llamada 'Iniciativa de los Balcanes Abiertos'. Tiene como objetivo aumentar el crecimiento económico y el comercio entre nuestras naciones, y también buscará mejorar la estabilidad regional."
 SerbiaFocus.1.a: "¿Dónde firmo?"
 SerbiaFocus.1.b: "Absolutamente no!"
 SerbiaFocus.2.t: "[FROM.GetName] ha firmado la iniciativa!"
 SerbiaFocus.2.d: "Parece que [FROM.GetName] ha decidido firmar la Iniciativa de los Balcanes Abiertos y cooperará para impulsar el crecimiento económico en la región!"
 SerbiaFocus.2.a: "¡Grandes noticias!"
 SerbiaFocus.3.t: "[FROM.GetName] se niega a firmar la iniciativa!"
 SerbiaFocus.3.d: "[FROM.GetName] wants nothing to do with us or our initiative. So we may have to forget about any possible expansion of the agreement."
 SerbiaFocus.3.a: "Triste"
 SerbiaFocus.4.t: "[FROM.GetName] Exige que Celebremos un Referéndum"
 SerbiaFocus.4.d: "[FROM.GetName] demands that we hold a referendum on the territory of the Republika Srpska and give it more autonomy. They are clearly plotting something, will we give autonomy to our region or ignore pressure from Belgrade?"
 SerbiaFocus.4.a: "Hagamos Concesiones"
 SerbiaFocus.4.b: "Ignorarlos"
 SerbiaFocus.5.t: "Destino de la Republika Srpska"
 SerbiaFocus.5.d: "[FROM.GetName] agreed to grant autonomy to the Republika Srpska under our pressure, as we wanted it to be."
 SerbiaFocus.5.a: "Bien"
 SerbiaFocus.6.t: "Destino de la Republika Srpska"
 SerbiaFocus.6.d: "[FROM.GetName] refused to grant autonomy to Republika Srpska, even under our pressure."
 SerbiaFocus.6.a: "Pagarán más"
 Serbia.20.t: "Serbia nos pide que seamos los mediadores!"
 Serbia.20.d: "El nuevo gobierno serbio nos pide que seamos los mediadores entre Kosovo y Serbia."
 Serbia.20.a: "Claro!"
 Serbia.20.b: "Heh, adiós."
 Serbia.21.t: "No estuvieron de acuerdo."
 Serbia.21.d: "No quieren establecer las negociaciones."
 Serbia.21.a: "Ugh"
 Serbia.22.t: "Reunión en Bruselas"
 Serbia.22.d: "Durante la reciente reunión en Bruselas, Serbia propuso un acuerdo de normalización de relaciones entre nosotros y ellos."
 Serbia.22.a: "Estamos de acuerdo"
 Serbia.22.b: "No"
 Serbia.23.t: "Kosovo agrees!"
 Serbia.23.d: "Firmaron el acuerdo."
 Serbia.23.a: "Muy bien!"
 Serbia.24.t: "Kosovo no estuvo de acuerdo."
 Serbia.24.d: "No quieren firmar el acuerdo."
 Serbia.24.a: "Muy Desafortunado."
 serbia_news.2.t: "Serbia Reconoce a Kosovo!"
 serbia_news.2.d: "En un desarrollo diplomático significativo, Serbia ha reconocido oficialmente a Kosovo como una nación independiente, marcando un cambio histórico en su prolongada disputa. La decisión llega después de intensas negociaciones y refleja una disposición a avanzar hacia relaciones normalizadas entre los dos vecinos balcánicos. Este movimiento histórico está preparado para abrir nuevas avenidas para la cooperación y la estabilidad en la región, posiblemente allanando el camino para una mayor integración económica y política. Aunque sin duda quedan desafíos, este gesto señala un paso prometedor hacia la reconciliación y la coexistencia pacífica en los Balcanes."
 serbia_news.2.o1: "Interesante"
 SerbiaFocus.21.t: "Serbia ofrece inversiones!"
 SerbiaFocus.21.d: "Recientemente, Serbia propuso invertir en nuestro país. Esto aumentará la opinión de los serbios bosnios y nos traerá beneficios económicos, sin embargo, podría disminuir la opinión bosnia y aumentar la influencia serbia sobre nosotros. ¿Deberíamos estar de acuerdo?"
 SerbiaFocus.21.a: "Estamos de acuerdo!"
 SerbiaFocus.21.b: "No"
 SerbiaFocus.22.t: "Bosnia está de acuerdo!"
 SerbiaFocus.22.d: "Gastamos 3.5 mil millones de dólares para cubrir parcialmente la construcción de la fábrica. Ganamos un 5% de influencia sobre ellos."
 SerbiaFocus.22.a: "Excelente"
 SerbiaFocus.23.t: "Bosnia no estuvo de acuerdo."
 SerbiaFocus.23.d: "No quieren nuestras inversiones."
 SerbiaFocus.23.a: "Muy Desafortunado."
 SerbiaFocus.14.t: "Serbia Pide Inversiones!"
 SerbiaFocus.14.d: "Serbia nos pide a nuestro país que invirtamos en ellos ¿deberíamos estar de acuerdo?"
 SerbiaFocus.14.a: "Claro!"
 SerbiaFocus.14.b: "Lo siento, no"
 SerbiaFocus.15.t: "[FROM.GetNameWithFlag] Accepts!"
 SerbiaFocus.15.d: "Invertirán en nuestro país."
 SerbiaFocus.15.a: "Excelente"
 SerbiaFocus.16.t: "[FROM.GetNameWithFlag] did not accept our offer."
 SerbiaFocus.16.d: "No quieren invertir en nuestro país."
 SerbiaFocus.16.a: "Ugh"
 SerbiaFocus.13.t: "Criminales de Guerra Serbios Arrestados en Serbia!"
 SerbiaFocus.13.d: "New government of Serbia, after many considerations, decided to arrest and bring to court many of its former politicians and military commanders. Many of them will be brought to court in The Hague."
 SerbiaFocus.13.a: "Interesante"
 Serbia.3.tt.a: "§YNo habrá nada que impida un intento contra la vida de Zoran Đinđić§!"
 Serbia.14.t: "El Movimiento de Independencia de [MNT.GetFlag] [MNT.GetAdjective] Gana Fuerza"
 Serbia.14.d: "The [MNT.GetFlag] [MNT.GetAdjective]s have been pushing for independence for some time now, and it seems more and more likely that they are willing to fight for this cause if we decide to push back on this."
 Serbia.14.a: "Veamos qué pasa"
 Serbia.15.t: "La Confederación de [MNT.GetFlag] [MNT.GetName]"
 Serbia.15.d: "In a grand referendum, [MNT.GetFlag] [MNT.GetName] has decided that it will break free from [SER.GetFlag] [SER.GetName] (us) and pursue its own interests in the world. It appears many nations have already begun recognizing their independence, and have started diplomatic talks on security and other matters."
 Serbia.15.a: "Fue su propia elección."
 Serbia.16.t: "El Movimiento de [MNT.GetFlag] [MNT.GetAdjective] se Vuelve Violento!"
 Serbia.16.d: "Parece que el movimiento de [MNT.GetFlag] [MNT.GetAdjective] se ha vuelto violento y ha comenzado una rebelión activa contra nuestros intentos de controlarlos. Tendremos que retroceder por completo de esta arriesgada apuesta política o duplicar nuestros esfuerzos para sofocar su movimiento de resistencia."
 Serbia.16.a: "No daremos marcha atrás!"
 Serbia.16.b: "¿Sabes qué? Ten tu independencia."
 Serbia.17.t: "El Movimiento de [MNT.GetFlag] [MNT.GetAdjective] se Apaga"
 Serbia.17.d: "The [MNT.GetFlag] [MNT.GetAdjective] resistance movement has thankfully been quelled by our skilled security forces and politicians. We no longer have to worry about fighting them on the streets, but now we must worry about fixing the damage done to the region."
 Serbia.17.a: "Como debería ser."
 SerbiaFocus.11.t: "Cambio Democrático en Serbia!"
 SerbiaFocus.11.d: "Serbia celebra el amanecer de la democracia tras la Revolución Bulldozer. Las persistentes protestas de los ciudadanos han derrocado al antiguo régimen, señalando una nueva era de transparencia y responsabilidad. El mundo observa mientras Serbia abraza el cambio, augurando esperanza para un futuro más brillante."
 SerbiaFocus.11.a: "¡Finalmente!"
 serbia_news.1.t: "[SER.GetName] se une a la ONU"
 serbia_news.1.d: "Originalmente, el gobierno de [SER.GetAdjective] se había negado a unirse a las Naciones Unidas después de la caída de Yugoslavia, lo que apuntaba a la continua dedicación del país a la restauración de las tierras nacionales de [SER.GetAdjective].\n\nAhora, después de un referéndum público sobre el asunto, el gobierno de [SER.GetAdjective] ha anunciado que el país avanzará para abandonar su puesto de espectador y ahora se unirá a la organización como miembro de pleno derecho."
 serbia_news.1.o1: "It's about time, [SER.GetName]!"
 SerbiaFocus.12.t: "Serbia busca garantías de paz"
 SerbiaFocus.12.d: "Tras la revolución democrática de Serbia, su nuevo gobierno ha buscado establecer una cooperación regional pacífica. Proponen garantías de paz mutua, acuerdos comerciales y la normalización diplomática. Esto podría anunciar una nueva era de estabilidad en los Balcanes. ¿Cómo debemos responder a sus propuestas?"
 SerbiaFocus.12.a: "Claro!"
 SerbiaFocus.12.b: "No"
 Serbia.19.t: "Milosevic Encerrado!"
 Serbia.19.d: "After the recent revolution in Serbia, Slobodan Milosevic has been imprisoned for his crimes and will soon be judged in The Hague."
 Serbia.19.a: "Suprimamos a los nacionalistas de sangre caliente..."
 Serbia.19.b: "Se necesita una reacción nacional a este crimen..."
 Serbia.1.d: "Željko Ražnatović, también conocido como Arkan, excomandante de la milicia de los Tigres de Arkan, oficial de los Crvene Beretke y hombre de negocios, recibió un intento de asesinato mientras bebía con amigos en el Hotel Continental de Belgrado. Su tirador, Dobrosav Gavrić, un miembro de la brigada móvil policial de 23 años, le disparó en el ojo izquierdo, así como a algunos de sus amigos y transeúntes. Gavrić fue abatido durante su escape y arrestado, los médicos están trabajando arduamente para mantenerlo con vida, ¿es un hombre muerto?"
 Serbia.1.a: "Enviamos nuestras condolencias"
 Serbia.1.b: "No podemos dejarlo morir"
 Serbia.1.tt: "§YArkan morirá!§!"
 Serbia.2.d: "Željko Ražnatović was buried at Novo Groblje on 20 January 2000, five days after the shooting at the Hotel Continental. Thousands attended, among them Red Star Belgrade ultras alongside figures from the paramilitary and criminal underworld he moved through. No one has ever been convicted for ordering the killing, and it is widely read as a settling of accounts rather than a random act of violence. How do we mark his passing?"
 Serbia.2.a: "Celebremos funerales por nuestros seres queridos perdidos"
 Serbia.2.b: "Outrageous! condemn this on the international stage!"
 Serbia.3.d: "It has come to our attention that the Serbian criminal underworld is not pleased with Zoran Đinđić, the Zemun Clan are using former JSO units to carry out a planned assassination on March 12 to take our opposition out of power. We can warn him and stop this from happening, however we are not necessarily obliged to do so."
 Serbia.3.a: "Advertirle sobre el ataque inmediatamente!"
 Serbia.3.b: "Veremos qué pasa, ¿eh?"
 Serbia.5.d: "A magnitude 5.5 earthquake has struck Kraljevo. We must decide whether to prioritize earthquake-resistant infrastructure for our people or protect industrial buildings."
 Serbia.5.a: "No podemos salvar nuestras fábricas, instalar infraestructura a prueba de terremotos para nuestra gente y prepararnos para las réplicas"
 Serbia.5.b: "Priorizar los edificios industriales, nuestra economía no puede soportar ese tipo de golpe"
 Serbia.5.tt: "§YEstaríamos mal preparados si un terremoto nos golpeara en el futuro.§!"
 Serbia.6.d: "Cyclone Tamara has caused severe flooding in our country, claiming lives and damaging infrastructure."
 Serbia.6.a: "Qué desafortunado"
 Serbia.7.d: "Flash floods have damaged agriculture. We must decide whether to prioritize assistance to farmers or our population centers."
 Serbia.7.a: "Los agricultores podrían necesitar más ayuda que nadie en este momento"
 Serbia.7.b: "No podemos ignorar a nuestras poblaciones más concentradas"
 Serbia.8.t: "Derrame de Cianuro en el Danubio"
 Serbia.8.d: "Un derrame de cianuro cerca de Baia Mare, Rumania, por la empresa minera de oro Aurul ha contaminado los ríos Someș, Tisza y Danubio. Este desastre está matando a un gran número de peces en Hungría, Serbia y Rumania, y ahora se le llama el peor desastre ambiental en Europa desde Chornobyl."
 Serbia.8.a: "Culpar a las empresas extranjeras extractoras de recursos"
 Serbia.8.b: "Cooperar en una limpieza con Rumania"
 Serbia.9.d: ""
 Serbia.9.a: "Lanzar una investigación nacional, la 'Operación Sable' estará en pleno efecto."
 Serbia.9.b: "Qué desafortunado, y otro muerde el polvo..."
 Serbia.10.d: ""
 Serbia.10.a: "Ese maldito DSS es el culpable, ¿qué pasó con las libertades políticas en Serbia?"
 Serbia.10.b: "Es algo bueno que esta actividad criminal haya sido detenida"
 Serbia.11.d: ""
 Serbia.11.a: "Fue un gran error salvar su vida, derrotemos a esta molestia política de una vez por todas."
 Serbia.11.b: "Que nos acusen, no hicimos nada malo, esto pasará."
 Serbia.12.d: ""
 Serbia.12.a: "El gobierno ayudará a mediar esta situación"
 Serbia.12.b: "Que discutan, no es nuestro problema de todos modos"
 SerbiaFocus.99.t: "La Hora de la Libertad de Vojvodina"
 SerbiaFocus.99.d: "Nuestro pueblo está dispuesto a iniciar finalmente una guerra de liberación contra Serbia, pero ¿estamos preparados para tomar esa decisión?"
 SerbiaFocus.99.a: "Por la Libertad de Vojvodina!"
 SerbiaFocus.99.b: "Absolutamente no!"
 SerbiaFocus.100.t: "La Hora de la Libertad de Vojvodina"
 SerbiaFocus.100.d: "El gobierno local en Vojvodina se ha levantado contra nosotros! La reacción de la sociedad y la gente es esperada de nosotros, ¿les permitiremos que se separen silenciosamente del país? ¿o los suprimiremos por la fuerza."
 SerbiaFocus.100.a: "Serbia Estará Unida!"
 SerbiaFocus.100.b: "Démosles Libertad"
 SerbiaFocus.101.t: "Vojvodina Pide Federalización"
 SerbiaFocus.101.d: "El Gobierno de Voivodina nos ha solicitado la creación de una Federación plena entre Serbia y ellos. ¿Estamos preparados para emprender una revisión tan global del sistema estatal de nuestro país?"
 SerbiaFocus.101.a: "Sí"
 SerbiaFocus.101.b: "Serbia Estará Unida!"
 SerbiaFocus.102.t: "Solicitud de Federalización"
 SerbiaFocus.102.d: "The Serbian government has agreed to federalize the country, finally we will be equal subjects!"
 SerbiaFocus.102.a: "Bien"
 SerbiaFocus.103.t: "Solicitud de Federalización"
 SerbiaFocus.103.d: "El gobierno serbio se negó a federalizar el país, aún aprenderán los resultados de rechazar nuestra propuesta."
 SerbiaFocus.103.a: "De acuerdo"
 SerbiaFocus.104.t: "Vojvodina Está Pidiendo Permiso para su Ejército!"
 SerbiaFocus.104.d: "El Gobierno de Voivodina nos ha pedido que les permitamos tener sus propias fuerzas armadas. Quizás esto nos beneficie en el futuro, pero también lo vemos como un peligro. ¿Deberíamos permitirlo?"
 SerbiaFocus.104.a: "Sí"
 SerbiaFocus.104.b: "No Necesitan su Propio Ejército."
 SerbiaFocus.105.t: "Solicitud de Ejército"
 SerbiaFocus.105.d: "El Gobierno Serbio nos ha permitido comenzar a construir nuestras propias fuerzas armadas."
 SerbiaFocus.105.a: "Bien"
 SerbiaFocus.106.t: "Solicitud de Ejército"
 SerbiaFocus.106.d: "The Serbian government refused to give us our own army, they will still learn the results of rejecting our proposal."
 SerbiaFocus.106.a: "De acuerdo"
 SerbiaFocus.107.t: "Solicitud de Aumento de Autonomía"
 SerbiaFocus.107.d: "El gobierno serbio nos ha permitido expandir nuestros derechos de autonomía, ahora tenemos más oportunidades."
 SerbiaFocus.107.a: "Bien"
 SerbiaFocus.108.t: "Solicitud de Aumento de Autonomía"
 SerbiaFocus.108.d: "The Serbian government has refused to extend the rights of our autonomy, they will regret it!"
 SerbiaFocus.108.a: "De acuerdo"
 SerbiaFocus.109.t: "Vojvodina Solicita una Extensión de Autonomía"
 SerbiaFocus.109.d: "El Gobierno de Voivodina solicita una ampliación de las competencias actuales de su autonomía, convenciéndonos de que esto también nos beneficiará. ¿Estamos de acuerdo con sus argumentos?"
 SerbiaFocus.109.a: "Sí"
 SerbiaFocus.109.b: "No Necesitan Más Autonomía."
 SerbiaFocus.9.t: "Estado Autónomo de Vojvodina"
 SerbiaFocus.9.d: "La agitación política que sacudió nuestro país ha despertado a las fuerzas políticas de Voivodina. Representantes de la región nos piden que ampliemos los derechos de autonomía de sus residentes. ¿Lo haremos?"
 SerbiaFocus.9.a: "Tendremos que darles algo de autonomía."
 SerbiaFocus.9.b: "¡Nunca!"
 SerbiaFocus.17.t: "La Federación Balcánica"
 SerbiaFocus.17.d: "[FROM.GetName] en una reunión con nuestro Gobierno, nos entregó una invitación oficial para unirnos a la Federación Balcánica. La membresía en tal federación nos impondrá muchas restricciones, pero en general, como convence el Gobierno Serbio, cada sujeto de la Federación tendrá derechos iguales."
 SerbiaFocus.17.a: "Aceptaremos unirnos a la Federación"
 SerbiaFocus.17.b: "No necesitamos una Federación."
 SerbiaFocus.20.t: "La Federación Balcánica"
 SerbiaFocus.20.d: "[FROM.GetName] ha rechazado nuestra oferta de unirse a la Federación Balcánica."
 SerbiaFocus.20.a: "Triste"
 Serbia.27.t: "La Federación Balcánica"
 Serbia.27.d: "Nos hemos convertido oficialmente en miembro de la Federación Balcánica"
 Serbia.27.a: "Bien"
 ser_reading.1.t: "Crisis Política Serbia"
 ser_reading.1.d: "After NATO bombings in 1999, which had a huge devastating effect on Serbian society Milošević's authority has been almost destroyed. Lots of opposition groups spread across Serbia, once a stable country faces a huge challenge of the upcoming millennium."
 ser_reading.1.a: "Solo la unidad salvará a los serbios..."
 serbia_news.3.t: "Formación de CEFTA"
 serbia_news.3.d: "Recently, many central european states have signed the CEFTA Agreement. The Central European Free Trade Agreement is a free trade organization that is the successor to the Visegrad Agreement between countries that are not members of the European Union. This national spirit will be removed if we join European Union."
 serbia_news.3.o1: "Interesante"
 SER_radical_create_tt: "Se Creará el Partido Progresista Serbio!"
 SER_jp_electric: "JP Electric"
 SER_coalition_TT: "§CAligned§! to us §Cparties§! will join our §Ccoalition§!."
 SER_radical_div_TT: "Se ha creado el partido progresista."
 ser_we_will_int_tt: "[FROM.GetNameWithFlag] builds 2 network infrastructures. It increases [FROM.GetNameWithFlag] influence on us by 5%!"
 bombed_us_in_the_nineties: "Nos Bombardearon en los 90's"
 oppress_the_muslim_population: "Oprimir a la Población Musulmana"
 oppress_the_serbian_population: "Oprimir a la Población Serbia"
 serbian_speaking: "Nación de Habla Serbia"
 kla_attacks: "Redadas del Ejército de Liberación de Kosovo en Nuestra Gente!"
 ethnic_cleansing: "Llevaron a Cabo la Limpieza Étnica en Nuestras Tierras!"
 nationalized_automobile_industry: "Industria Automotriz Nacionalizada"
 nationalized_automobile_industry_trade: "Industria Automotriz Nacionalizada"
 cooperated_to_clean_up_cyanide_spill: "Cooperó para Limpiar el Derrame de Cianuro"
 caused_cyanide_spill: "Causó que el Cianuro se Derramara en el Danubio"
 blame_us_for_cyanide_spill: "Nos Culpan por el Derrame de Cianuro en el Danubio"
 vojvodina_focus: "Árbol de Enfoque de Vojvodina"
 VOJ_economic: "Economía de Vojvodina"
 VOJ_economic_desc: "Our republic has great potential for economic development, it's not for nothing that Serbia is trying so hard to keep us in its composition, because we provide them with a large part of their income!"
 VOJ_selhoz: "Industria Agrícola"
 VOJ_selhoz_desc: "Nuestro país tiene una industria agrícola bien desarrollada, pero no nos detendremos ahí y continuaremos invirtiendo en su desarrollo."
 VOJ_construct: "Industria de la Construcción"
 VOJ_construct_desc: "We will expand investments in the construction industry, every kilometer of Vojvodina will be built up!"
 VOJ_oil: "Industria Petrolera"
 VOJ_oil_desc: "La industria petrolera es bastante fuerte en nuestra región y atractiva para algunos inversores extranjeros, lo que tiene un efecto positivo en nuestra economía."
 VOJ_chim: "Industria Química"
 VOJ_chim_desc: "La industria química en nuestro país aún está poco desarrollada, pero está comenzando a ganar impulso, invirtiendo más dinero en ella, seguramente obtendremos muchos más beneficios."
 VOJ_metal: "Industria Metalúrgica"
 VOJ_metal_desc: "La industria metalúrgica es necesaria para nosotros como el aire. Invertiremos más fondos en su desarrollo que el gobierno serbio."
 VOJ_it: "Sector TI"
 VOJ_it_desc: "The IT sector in our country is poorly developed, but we are ready to invest in it, because it is the future!"
 VOJ_regionalism: "Regionalismo"
 VOJ_regionalism_desc: "We actively advocate regionalism within the Serbian state! No infringement of the peoples!"
 VOJ_federalisation: "Federalización"
 VOJ_federalisation_desc: "La federalización de Serbia es lo que vemos como el futuro de nuestro estado común. Intentaremos activamente obtener tantos privilegios como sea posible."
 VOJ_vs: "Nuestras Fuerzas Armadas"
 VOJ_vs_desc: "We will propose to the Serbian government a bill to allow us to have our own armed forces."
 VOJ_autonomy: "Aumentar el Estatus de la Autonomía"
 VOJ_autonomy_desc: "Propondremos al gobierno serbio extender nuestros privilegios como una autonomía dentro del Estado."
 VOJ_true_fed: "Federación de Serbia y Voivodina"
 VOJ_true_fed_desc: "Presentaremos un proyecto de ley sobre la consideración de la creación de la Federación de Serbia y Voivodina al Gobierno Serbio."
 VOJ_separ: "Coalición por la Autonomía"
 VOJ_separ_desc: "Muchos partidos políticos de Voivodina se unieron en una coalición para luchar por la autonomía y posiblemente la independencia de Voivodina."
 VOJ_vojvodina_spirit: "El Espíritu de la Libertad"
 VOJ_vojvodina_spirit_desc: "Nuestro pueblo siempre ha aspirado a la autonomía e independencia, Serbia es un ocupante para nosotros y lucharemos contra ella."
 VOJ_europe_friend: "Asociación con la UE"
 VOJ_europe_friend_desc: "Vemos a la Unión Europea como un posible socio y a nosotros como su miembro."
 VOJ_brothers_nation: "Voz de las Minorías"
 VOJ_brothers_nation_desc: "Utilizamos a las minorías de nuestra república como excusa para atraer inversores de países vecinos como Hungría y Croacia."
 VOJ_kosovo: "Hermanos en la Adicción"
 VOJ_kosovo_desc: "Kosovo, como nosotros, ha estado durante mucho tiempo a la sombra de Serbia, y nuestro problema fraternal debería unirnos."
 VOJ_propaganda: "Propaganda del Patriotismo"
 VOJ_propaganda_desc: "Nuestro pueblo ha olvidado lo que significa amar y respetar sus raíces, su historia, los guiaremos por el camino correcto a través de la propaganda."
 VOJ_self_defence: "Autodefensa de Voivodina"
 VOJ_self_defence_desc: "Crearemos unidades de autodefensa para resistir la influencia de Serbia y estar preparados para defendernos si nuestra independencia es pisoteada."
 VOJ_buy_weapon: "Compra de Armas"
 VOJ_buy_weapon_desc: "Necesitamos armas para defendernos, afortunadamente algunos de nuestros vecinos están dispuestos a vendérnoslas."
 VOJ_anti_serb: "Propaganda Anti-Serbia"
 VOJ_anti_serb_desc: "We will actively develop the rhetoric that Serbia uses us like a colony, and we are its slaves."
 VOJ_war_freedom: "Viaje a Belgrado"
 VOJ_war_freedom_desc: "Estamos listos para ir a la guerra de liberación contra nuestro ocupante y enemigo."
 VOJ_madyar: "Nacionalismo Húngaro en Voivodina"
 VOJ_madyar_desc: "La minoría húngara ha tomado un papel dominante en la vida de Voivodina, ahora nos espera un futuro verdaderamente impredecible."
 VOJ_new_nation: "New National Spirit"
 VOJ_new_nation_desc: "The national spirit, which Vojvodina has not had for so long, will now appear. Hungarians will lead this beautiful land into a glorious future."
 VOJ_we_hungary: "Promoción de la Identidad Húngara"
 VOJ_we_hungary_desc: "La identidad de Voivodina es innecesaria y obsoleta. Los húngaros son los verdaderos herederos de Voivodina."
 VOJ_we_not_serb: "Rechazo de la Identidad Serbia"
 VOJ_we_not_serb_desc: "La identidad de Voivodina es innecesaria y obsoleta. Los húngaros son los verdaderos herederos de Voivodina."
 VOJ_propagandase: "Propaganda Pro-Húngara"
 VOJ_propagandase_desc: "Nuestros medios promoverán activamente a Hungría como el verdadero heredero de estas tierras y que cada habitante de esta región es húngaro."
 VOJ_defences: "Líneas Defensivas"
 VOJ_defences_desc: "Debemos crear líneas defensivas para que nuestro potencial enemigo no pueda rompernos tan fácilmente."
 VOJ_mobilisation: "Movilizar a la Población"
 VOJ_mobilisation_desc: "Anunciamos la movilización de la población, alentándolos a unirse a las filas de nuestras propias fuerzas armadas."
 VOJ_guard: "La Guardia Nacional"
 VOJ_guard_desc: "Crearemos nuestra propia unidad de Guardia Nacional que nos protegerá."
 VOJ_path: "En la Encrucijada"
 VOJ_path_desc: "Es hora de tomar una decisión crucial para nuestra región."
 VOJ_part_hungary: "Somos Parte de Hungría"
 VOJ_part_hungary_desc: "Anunciaremos nuestro deseo de unirnos a Hungría, esperamos que nuestros hermanos no nos rechacen."
 VOJ_nopart_hungary: "Somos la Verdadera Hungría"
 VOJ_nopart_hungary_desc: "El estado húngaro está podrido, han olvidado las gloriosas tradiciones de nuestro pueblo y han abandonado completamente su historia, nos convertiremos en el bastión de los húngaros en todo el mundo."
 VOJ_volunteer: "Voluntarios Húngaros"
 VOJ_volunteer_desc: "Voluntarios húngaros de todo el mundo comenzaron a venir a nosotros, viéndonos como los verdaderos herederos de Hungría, y no este gobierno corrupto en Budapest."
 VOJ_claims: "Reclamaciones Territoriales"
 VOJ_claims_desc: "Las tierras húngaras pertenecen al pueblo húngaro y tenemos todo el derecho sobre ellas."
 VOJ_war: "La Guerra por Hungría"
 VOJ_war_desc: "Hungary will be free!"
 VOJ_start_army: "Comienzo de la Reforma del Ejército"
 VOJ_start_army_desc: "Nuestras fuerzas armadas literalmente no existen, es necesario comenzar a crearlas para que nuestro país pueda defenderse en el futuro."
 VOJ_reforms_army: "Ejército Contratado"
 VOJ_reforms_army_desc: "Nuestro pequeño país no necesita un ejército enorme, nos centraremos en un pequeño ejército profesional."
 VOJ_weapon_zakup: "Compra de Armas"
 VOJ_weapon_zakup_desc: "Compraremos armas de diferentes países para abastecer a nuestro ejército."
 VOJ_new_officer: "Escuela de Oficiales"
 VOJ_new_officer_desc: "Comenzaremos la formación de los primeros oficiales de nuestro ejército."
 VOJ_inter_specialist: "Especialistas Extranjeros"
 VOJ_inter_specialist_desc: "We will invite foreign specialists to help us prepare our army competently."
 VOJ_finish_reform: "Completar las Reformas"
 VOJ_finish_reform_desc: "Hemos completado la creación de nuestras propias fuerzas armadas."
 VOJ_serbs: "Somos Serbios"
 VOJ_serbs_desc: "Nuestra región siempre irá junto con Serbia, somos un pueblo unido y un país unido."
 VOJ_anti_separ: "Represión contra los Separatistas"
 VOJ_anti_separ_desc: "Separatism can easily set our region on fire and lead to civil war - it is unacceptable!"
 VOJ_propagandais: "Propaganda Pro-Serbia"
 VOJ_propagandais_desc: "Los residentes de nuestra región deben saber que el separatismo es peligroso para nosotros y que la unidad con Serbia es la clave de la estabilidad."
 VOJ_serb_infra: "Inversión en Infraestructura"
 VOJ_serb_infra_desc: "El gobierno serbio ha invertido en el desarrollo de la infraestructura en nuestra región."
 VOJ_serb_people: "Pueblo Unido"
 VOJ_serb_people_desc: "Reconocemos la unidad de nuestro pueblo y un solo objetivo: una Serbia poderosa y grande."
 VOJ_serb_invest: "Inversión Industrial Serbia"
 VOJ_serb_invest_desc: "El gobierno serbio ha asignado fondos para la construcción de empresas en nuestro territorio."
 VOJ_serb_police: "Admitir a la Policía Serbia"
 VOJ_serb_police_desc: "Permitiremos el acceso de la Policía Serbia a nuestra región para garantizar la estabilidad."
 VOJ_serb_military: "Integración en la Industria Serbia"
 VOJ_serb_military_desc: "Permitiremos activamente que la industria serbia entre en nuestro territorio."
 VOJ_agro_selhoz1: "Vojvodina Agriculture"
 VOJ_agro_selhoz: "Agroindustria de Voivodina"
 VOJ_prom_idea: "Industria de Voivodina"
 VOJ_patriotism: "Patriotismo de Voivodina"
 VOJ_vojvodina_nation: "New National Spirit"
 VOJ_vojvodina_nation1: "La Verdadera Hungría"
 VOJ_no_army: "País Sin Ejército"
 VOJ_no_army1: "Reforma del Ejército"
 VOJ_no_nation: "País Sin Nación"
 VOJ_debuff_nation: "Deseo de Autonomía en Voivodina"
 VOJ_debuff_nation_desc: "Los eventos pasados han llevado a la activación de los partidarios de la Autonomía en Voivodina, ¿deberíamos resolver este problema?"
 ser_voj.1.t: "Voivodina Quiere Unirse a Nosotros"
 ser_voj.1.d: "Vojvodina ha anunciado un referéndum con el deseo de convertirse en parte de nuestro gran país, ¿estamos de acuerdo en aceptarlo?"
 ser_voj.1.a: "Sí"
 ser_voj.1.b: "No"
 ser_voj.2.t: "Voivodina Nos Ofrece una Garantía"
 ser_voj.2.d: "Voivodina nos ofrece garantías mutuas para protegernos mutuamente en caso de que Serbia y otros países nos ataquen. Quizás esto pueda templar el ardor de nuestros vecinos poco amistosos."
 ser_voj.2.a: "Sí"
 ser_voj.2.b: "No"
 ser_voj.3.t: "Kosovo Ha Aceptado Garantías Mutuas"
 ser_voj.3.d: "El gobierno de Kosovo ha aceptado garantías mutuas de independencia, ahora tenemos la oportunidad de que no nos ataquen."
 ser_voj.3.a: "Bien"
 SER_vojvodina_separatism_category: "Separatismo de Voivodina"
 SER_vojvodina_separatism_category_desc: "\n\n\n\n\n\n£SER_desctext_vojvodina \n\n\n\n\n\n\n\n\nLos acontecimientos posteriores al derrocamiento de Milosevic intensificaron los sentimientos republicanos y separatistas en Voivodina. Ahora Voivodina y Serbia deben decidir si seguirán juntos o sus caminos se separarán."
 VOJ_more_separ: "Aumentar los Sentimientos Separatistas"
 VOJ_more_autonomy: "Solicitar Más Autonomía"
 VOJ_more_army: "Solicitar Permiso para Tener Nuestro Propio Ejército"
 VOJ_more_federation: "Solicitar Permiso para la Federalización"
 VOJ_integrate: "Integrar Voivodina"
 VOJ_separ_debuff: "Reducir el Separatismo en Voivodina"
 VOJ_separ_debuff1: "Reducir el Separatismo en Voivodina"
 VOJ_ser_police: "Policía Serbia"
 VOJ_ser_avto: "Industria Serbia"
 SER_voj_separ_TT: "El separatismo en Voivodina aumentará en un §Y[?modify_voj_separ]%§! (Separatismo Actual: §Y[?VOJ.voj_separ]%§!)\n"
 SER_voj_integr_TT: "El deseo de integración aumentará en un §Y[?modify_voj_integr]%§! (Deseo Actual: §Y[?VOJ.voj_integr]%§!)\n"
 VOJ_support_for_union_more_60: "El Deseo de Integración está por encima del 60%"
 montenegro_focus: "Árbol de Enfoque de Montenegro"
 SER_The_Montenegro_Confederacy: "La Confederación de Montenegro"
 SER_The_Montenegro_Confederacy_desc: "\n\n\n\n\n\n£SER_desctext_montenegro \n\n\n\n\n\n\n\n\n[MNT.GetFlag] [MNT.GetName] has been vying for independence since the 1990's, and they have been becoming more and more successful as the days go by. We can try to stop them, but if we do, then they may cause more harm than good. Attempting to maintain [MNT.GetFlag] [MNT.GetName] may result in long-term consequences which could possibly take years to resolve.\n\nWe can maintain [MNT.GetFlag] [MNT.GetName] by pushing back on their independence agenda. If we continue to push back against their thirst for independence, then their movement will turn into a violent one, and will require us to use the military to quell the revolt.\n\nIf we opt to do nothing, [MNT.GetFlag] [MNT.GetName] will peacefully separate from our nation without any major consequences.\n\n[MNT.GetFlag] [MNT.GetAdjective] Separatism: §Y[?SER_Montenegro_separatism]%§!\n-------------------------------------------------------\n[MNT.GetFlag] [MNT.GetAdjective] Resistance Fighters: §R[?SER_Montenegro_combatants]§!\n[SER.GetFlag] [SER.GetAdjective] Security Forces Deployed: §R[?SER_Serbian_combatants]§!"
 SER_Montenegro_independence_referendum: "Referéndum de Independencia de Montenegro"
 SER_retainment_of_connections_Montenegro: "Rechacemos el separatismo [MNT.GetFlag] [MNT.GetAdjective]"
 SER_retainment_of_connections_Montenegro_desc: "Mantendremos nuestra posición y lucharemos contra el [MNT.GetFlag] [MNT.GetAdjective] separatismo."
 SER_attack_mnt_militias: "Atacar a los Militantes de [MNT.GetFlag] [MNT.GetAdjective]"
 SER_attack_mnt_militias_desc: "Lanzaremos un ataque contra los militantes de [MNT.GetFlag] [MNT.GetAdjective] en un intento de sofocar su resistencia."
 SER_deploy_more_troops: "Aumentar la Presencia de Seguridad"
 SER_deploy_more_troops_desc: "Aumentaremos nuestra presencia de seguridad en la región de [MNT.GetFlag] [MNT.GetName] para contrarrestar a los militantes."
 SER_Political_separatism: "[MNT.GetFlag] [MNT.GetAdjective] Separatismo"
 MNT_neoyug: "Neo-Yugoslavismo"
 MNT_neoyug_desc: "La llama de la nostalgia yugoslava aún no se ha apagado en Montenegro! El camino comunista siempre fue el mejor y seguramente lo sabemos."
 MNT_selfcoup: "No Más Democracia!"
 MNT_selfcoup_desc: "Bourgeoisie capitalist democracy is the source of all of the mess that we and our former yugo comrades are in nowadays. We must stop this petty practice and return to progressive dictatorship of the proletariat!"
 MNT_onepartystate: "Estado de Partido Único"
 MNT_onepartystate_desc: "Todos estos partidos tontos no pueden comprender completamente la comprensión dialéctica de la lógica y son idiotas retrógrados que quieren llevar nuestra sociedad a una de conflicto de clases. No debemos dejar que esto suceda!"
 MNT_eliminate_bourjuy: "Eliminar a la Burguesía"
 MNT_eliminate_bourjuy_desc: "Los tontos burgueses que plagan nuestro país como ratas deben ser eliminados y sus bienes deben ser compartidos entre la población."
 MNT_declare_autarky: "Declarar la Autarquía"
 MNT_declare_autarky_desc: "The dirty capitalist global market is holding its bloody hands near our neck all of the time! We shall not be subjugated by the global snake of imperialism and rely only on ourselves for now."
 MNT_nationalise_economy: "Nacionalización de la Economía"
 MNT_nationalise_economy_desc: "Toda la economía del estado debe pertenecer al pueblo del estado. Y como somos la dictadura del proletariado, lo mejor de la gente común, el gobierno debe gestionar todas las empresas."
 MNT_revolution_might: "Poder de la Revolución"
 MNT_revolution_might_desc: "En nombre del santo Marx, el poder de la revolución debe ser aparente para todos los países cercanos y lejanos. La amenaza capitalista debe temer y temblar cuando escuchen sobre nuestra fuerza!"
 MNT_titois_economic_practise: "Pragmatismo de Tito"
 MNT_titois_economic_practise_desc: "Josip Broz Tito fue el hombre más sabio de todos los Balcanes, aquellos que cuestionan esto son traidores o tontos. Debemos adaptar sus políticas económicas nuevamente en nuestra brillante Montenegro roja para ver prosperar a nuestro país."
 MNT_socialist_agenda_desc: "Todos en nuestro país deben estudiar y aprender el marxismo de memoria. Esta es nuestra nueva agenda, según la cual debemos adaptar más programas sociales para satisfacer las necesidades de la gente común."
 MNT_greate_reclaimation: "Gran Reclamación!"
 MNT_greate_reclaimation_desc: "Now, time has come to export the revolution and raise the red banner over all Balkan region!"
 MNT_montenegro_dem: "Demócratas Montenegrinos"
 MNT_montenegro_dem_desc: "Montenegro finalmente salió del terror del autoritarismo y no nos doblegaremos bajo él nuevamente. La democracia es el único camino a seguir!"
 MNT_european_agenda: "Agenda Europea"
 MNT_european_agenda_desc: "Montenegro siempre ha sido Europa y ningún pasado comunista o autoritario puede detenernos de unirnos a la familia europea y abrazar la cooperación."
 MNT_anti_oligarchism: "Anti-Oligarquía"
 MNT_anti_oligarchism_desc: "El anti-oligarquismo debe ser una de las principales prioridades de nuestra agenda política. Para que surja un verdadero mercado, debe abrirse un nuevo espacio."
 MNT_democratisation: "Democratización"
 MNT_democratisation_desc: "The years of oppression of people's voice have brought us to state of non-existing democratic culture of voting. We must fix this!"
 MNT_montenegro_nationalism: "Nacionalismo Montenegrino"
 MNT_montenegro_nationalism_desc: "No somos serbios! Todos deberían saber esto: no deberíamos estar bajo la sombra de nuestros supuestos hermanos. Somos independientes, soberanos y montenegrinos."
 MNT_multiparty_system: "Sistema Multipartidista"
 MNT_multiparty_system_desc: "Aunque contradiga nuestros deseos, no caeremos en la trampa de la represión, sino que estableceremos cooperación política con nuestros competidores y consolidaremos un verdadero sistema multipartidista."
 MNT_fight_organized: "Lucha contra el Crimen"
 MNT_fight_organized_desc: "El crimen debe ser castigado y el estado de derecho debe establecerse en nuestro estado."
 MNT_social_market: "Mercado Social"
 MNT_social_market_desc: "Para ver prosperar y ser felices a nuestro pueblo, debemos apoyarlos socialmente y establecer garantías para las necesidades necesarias."
 MNT_kill_serb_nats: "Represión contra los Nacionalistas Serbios"
 MNT_kill_serb_nats_desc: "Los tontos nacionalistas serbios aún buscan reunirnos con Serbia. Esto debe detenerse!"
 MNT_freetrade: "Comercio Libre"
 MNT_freetrade_desc: "Nuestro país debe ser libre para cualquier comercio exterior. Nuestro puerto es accesible para todos."
 MNT_secularism: "Establecer el Secularismo"
 MNT_secularism_desc: "No rechazamos la verdad probable de las religiones, sin embargo, debemos separar la religión del estado."
 MNT_dukanovic_rule: "Gobierno de Đukanović"
 MNT_dukanovic_rule_desc: "Milo Đukanović es un destacado político montenegrino que ha ocupado múltiples cargos en diferentes posiciones políticas, desempeñando un papel significativo en la política del país desde la década de 1990."
 MNT_family_comes_first: "La Familia es lo Primero"
 MNT_family_comes_first_desc: "Muchos socialdemócratas me dicen que asigne parte del presupuesto para apoyar a la familia. Estoy de acuerdo! Por eso, todos mis familiares ocuparán roles políticos significativos en el aparato gubernamental..."
 MNT_cement_power: "Cementar el Poder"
 MNT_cement_power_desc: "Debemos cementar el poder de nuestro partido de una vez por todas, manteniendo las instituciones democráticas."
 MNT_dominance_of_dps: "Dominio del DPS"
 MNT_dominance_of_dps_desc: "El DPS es y será el partido dominante en el parlamento! Aumentaremos nuestra popularidad utilizando propaganda y manipulaciones políticas."
 MNT_person_of_the_year: "Persona del Año en el Crimen Organizado"
 MNT_person_of_the_year_desc: "No es ningún secreto que Đukanović tiene muchos contactos con bandas criminales y la mafia. Para asegurarse de que la mafia no perjudique a Montenegro, Đukanović intentará integrarla en la estructura política. La oposición puede decir que nuestro presidente es una especie de Personaje del Año del Crimen Organizado, pero ¿qué van a saber de la gestión del país?"
 MNT_full_scale_privatisation: "Campaña de Privatización"
 MNT_full_scale_privatisation_desc: "Ha llegado el momento de que nuestra economía se prive completamente y se deshaga de las prácticas socialistas."
 MNT_formation_of_oligachs: "Aliados Oligarcas"
 MNT_formation_of_oligachs_desc: "Debemos aliarnos con la oligarquía para apoyar nuestro establecimiento político."
 MNT_bar_pirate_bay: "Bahía Pirata de Bar"
 MNT_bar_pirate_bay_desc: "Todo el mercado negro de nuestro puerto debe... legalizarse y los ingresos del mismo deben darse al estado."
 MNT_reconsiliation_with_monarchists: "Reconciliarse con los Monárquicos"
 MNT_reconsiliation_with_monarchists_desc: "Los monárquicos están ansiosos por encontrar apoyo y representación. Podemos usar esto para nuestro beneficio político."
 MNT_friend_in_the_west: "Amigos Occidentales"
 MNT_friend_in_the_west_desc: "EE.UU. y Europa son nuestros socios comerciales y debemos fomentar buenas relaciones con ellos."
 MNT_contacts_in_the_east: "Amigos Orientales"
 MNT_contacts_in_the_east_desc: "Rusia y China son nuestros socios comerciales y debemos fomentar buenas relaciones con ellos."
 MNT_castle_of_montenegro: "Castillo de Montenegro"
 MNT_castle_of_montenegro_desc: "Montenegro es el castillo de Đukanović y a todos nos gusta!"
 MNT_serb_democrats: "Demócratas Serbios"
 MNT_serb_democrats_desc: "Los partidos de la minoría serbia también están presentes en Montenegro. Y a veces también desean el liderazgo político."
 MNT_promote_serbian_culture: "Promoción de la Cultura Serbia"
 MNT_promote_serbian_culture_desc: "Los montenegrinos son obviamente serbios! La cultura serbia debe promoverse en todas partes."
 MNT_fight_corruption: "Lucha contra la Corrupción"
 MNT_fight_corruption_desc: "Luchar contra la corrupción es esencial para garantizar una distribución equitativa de los recursos, fomentar el desarrollo económico, hacer cumplir el estado de derecho y preservar la confianza pública en las instituciones."
 MNT_traditional_values: "Valores Tradicionales"
 MNT_traditional_values_desc: "Debemos apoyar los valores tradicionales de nuestra gente común y deshacernos de todas las tonterías progresistas."
 MNT_serbian_cooperation: "Cooperación con Serbia"
 MNT_serbian_cooperation_desc: "Para solidificar nuestra unidad con Serbia, debemos fomentar la cooperación con el estado serbio."
 MNT_fight_crime: "Lucha contra el Crimen"
 MNT_fight_crime_desc: "El crimen debe ser castigado y el estado de derecho debe establecerse en nuestro estado."
 MNT_cooperation_with_russia: "Cooperación con Rusia"
 MNT_cooperation_with_russia_desc: "Como decimos los serbios: Dios en el cielo, Rusia en la tierra."
 MNT_serbian_language_in_constitution: "Política Lingüística"
 MNT_serbian_language_in_constitution_desc: "Debemos eliminar las diferencias artificiales en el idioma y establecer el serbio como el idioma oficial del estado."
 MNT_economic_regulations: "Regulaciones Económicas"
 MNT_economic_regulations_desc: "Debemos regular nuestra economía para asegurar un desarrollo exitoso en la esfera económica."
 MNT_serbian_chucrh: "Iglesia Ortodoxa Serbia"
 MNT_serbian_chucrh_desc: "La Iglesia Ortodoxa Serbia es una prominente institución religiosa dentro de la tradición ortodoxa oriental, que representa la fe mayoritaria del pueblo serbio y desempeña un papel cultural e histórico significativo en los Balcanes."
 MNT_serbian_montenegro: "Montenegro Serbio"
 MNT_serbian_montenegro_desc: "Now, after finishing all preparations, we are finally ready to reunite with Serbia."
 MNT_monarchist_in_power: "Monárquicos en el Poder"
 MNT_monarchist_in_power_desc: "Time has come for our nation to go back to its ancient roots - restore the Monarchy!"
 MNT_monarchist_constitution: "Nueva Constitución"
 MNT_monarchist_constitution_desc: "Necesitamos reescribir nuestra tonta constitución democrática."
 MNT_royal_guard_desc: "Para proteger nuestra santa nación, debemos establecer una guardia real para nuestro Rey."
 MNT_traditional_vl_mon: "Tradicionalismo"
 MNT_traditional_vl_mon_desc: "Debemos apoyar los valores tradicionales de nuestra gente común y deshacernos de todas las tonterías progresistas."
 MNT_royal_nobility: "Reestablecer la Nobleza"
 MNT_royal_nobility_desc: "Muchas antiguas casas nobles de Montenegro y Serbia buscan que se restablezca su voluntad y poder. Podemos arreglar eso."
 MNT_state_religion: "Ortodoxia Estatal"
 MNT_state_religion_desc: "La ortodoxia es el aspecto fundamental de nuestra nación y debemos imponerla gubernamentalmente."
 MNT_centralisation: "Centralización del Estado"
 MNT_centralisation_desc: "Debemos centrar todo el poder del estado en nuestro monarca."
 MNT_russian_royal: "Vínculos con la Realeza Rusa"
 MNT_russian_royal_desc: "La realeza rusa ha apoyado durante mucho tiempo nuestra causa contra enemigos extranjeros. Debemos seguir siendo amigos de ellos."
 MNT_national_economy_desc: "La economía de nuestro país debe centrarse en los intereses de nuestra nación, no en la camarilla internacional."
 MNT_serbian_legacy: "Legado Serbio"
 MNT_serbian_legacy_desc: "Ahora, ha llegado el momento de decidir qué hacer con Serbia..."
 MNT_neutral_prin: "Principios de Neutralidad"
 MNT_neutral_prin_desc: "No apostaremos en el campo de la política. Más bien, mantendremos la neutralidad y seremos muy cautelosos."
 MNT_Economy_baby: "Ministerio de Economía"
 MNT_Economy_baby_desc: "Debemos establecer un Ministerio de Economía para lidiar con nuestra crisis."
 MNT_restore_port: "Restaurar el Puerto de Bar"
 MNT_restore_port_desc: "Port of Bar is the biggest port of our country and the biggest transport hub in Adriatic Sea. We must restore the work of our Port to gain profit out of it."
 MNT_join_wto: "Unirse a la OMC"
 MNT_join_wto_desc: "Para conectarnos con la comunidad comercial exterior, debemos unirnos a la Organización Mundial del Comercio!"
 MNT_agricul_dev: "Estrategia de Agricultura y Desarrollo Rural."
 MNT_agricul_dev_desc: "La Estrategia de Agricultura y Desarrollo Rural de Montenegro es un proyecto financiado por el Ministerio de Agricultura de Montenegro y la UE. El objetivo principal de este proyecto es revitalizar el Sector Agrícola de Montenegro."
 MNT_support_tourism: "Apoyo al Turismo"
 MNT_support_tourism_desc: "El turismo es el sector más prometedor de nuestra economía. Debemos tomar medidas para desarrollar nuestro sector turístico."
 MNT_tourist_mecca: "Meca del Turismo"
 MNT_tourist_mecca_desc: "Logramos crear una verdadera meca para los turistas de todo el mundo."
 MNT_revive_industry: "Restauración del Sector Industrial"
 MNT_revive_industry_desc: "La caída de nuestro sector industrial es una consecuencia de la mala gestión de la economía yugoslava. Debemos restaurar nuestra industria y arreglar la economía!"
 MNT_save_aluminium_plant: "Planta de Aluminio de Podgorica"
 MNT_save_aluminium_plant_desc: "Significance of Aluminium Plant Podgorica couldn't be described, this aluminium plant is creating the biggest part of our GDP. We must save our plant from collapsing!"
 MNT_expand_port: "Expandir el Puerto de Bar"
 MNT_expand_port_desc: "Debemos expandir el Puerto de Bar para aumentar la capacidad de bienes y turistas entrantes."
 MNT_wind_power: "Energía Eólica de Montenegro"
 MNT_wind_power_desc: "Our geographical location allows us to use wind power on full power!"
 MNT_foreign_production: "Producción Extranjera"
 MNT_foreign_production_desc: "Para mejorar nuestro PIB, podríamos invitar a inversores extranjeros a construir más complejos industriales."
 MNT_heaven_for_elits: "Paraíso para las Élites"
 MNT_heaven_for_elits_desc: "Imagine you are the richest person in the world and you need to keep your yacht somewhere. This place must be relatively cheap and should be surrounded by the beautiful nature, and the Republic of Montenegro fits this criteria!"
 MNT_support_tourist_bussiness: "Apoyar Negocios Turísticos"
 MNT_support_tourist_bussiness_desc: "Es obvio que el crecimiento de las pequeñas empresas está relacionado con el aumento del interés turístico en nuestro país. Debemos tomar todas las medidas posibles para estimular este crecimiento."
 MNT_revive_old_relics: "Trabajos Arqueológicos"
 MNT_revive_old_relics_desc: "La tierra de Montenegro tiene una rica historia. Las ruinas de antiguas ciudades de tribus eslavas y fortalezas de la República de Venecia están ubicadas en todo nuestro territorio. Debemos financiar trabajos arqueológicos para recuperar reliquias antiguas."
 MNT_highway_to_hell: "Expansión de las Autopistas M Principales"
 MNT_highway_to_hell_desc: "Para mejorar la infraestructura de Montenegro y facilitar el desplazamiento de nuestra población y turistas por nuestro país, debemos expandir nuestras autopistas principales M."
 MNT_support_holdings: "Apoyar Fincas Agrícolas"
 MNT_support_holdings_desc: "Agriculture holdings are the main agents in the agriculture market. We must support them with all the funds we have to not let them die."
 MNT_improve_logistick: "Improve Logistics"
 MNT_improve_logistick_desc: "To fix the supply chain in the agriculture market, we must improve our R's roads. We will involve the Ministry of Transport to fund all the regional road projects."
 MNT_export_agri: "Exportar Bienes Agrícolas"
 MNT_export_agri_desc: "After the fulfillment of agricultural goods on the internal market, we could create a profit from our goods and export them to external markets."
 MNT_agri_revival: "Agricultural Revival"
 MNT_agri_revival_desc: "Olives, fruits, tobacco: all of these beautiful goods are our gold that Mother Nature has granted our people. Thanks to our reforms, we managed to fulfill our internal market and become a serious competitor on the world market."
 MNT_ageconomic_prosperity: "Edad de Oro de Montenegro"
 MNT_ageconomic_prosperity_desc: "Lo logramos! Hemos salido de esta devastadora crisis que los años 90 y 2000 trajeron a nuestro pueblo. Podríamos decir que el siglo XXI podría convertirse en la era de nuestra prosperidad."
 MNT_aremd_forces: "Fuerzas Armadas de Montenegro"
 MNT_aremd_forces_desc: "Any country needs its armed forces to defend against external enemies. Revanchistic Serbs, Albanian nationalists, NATO eagles: all of them are only the start of the list of potential enemies."
 MNT_legacy_of_yugoslavia: "Legado de las Fuerzas Armadas Yugoslavas"
 MNT_legacy_of_yugoslavia_desc: "Nuestra ubicación geográfica nos obliga a usar una estrategia de defensa yugoslava para proteger Montenegro. No sería difícil implementarla, ya que todos nuestros generales ya estaban familiarizados con esta estrategia durante el servicio yugoslavo."
 MNT_montenegro_navy: "Armada de Montenegro"
 MNT_montenegro_navy_desc: "La línea costera de Montenegro es nuestro talón de Aquiles. Todas nuestras grandes ciudades y centros de transporte están ubicados cerca del mar. Debemos establecer nuestras propias fuerzas navales para proteger nuestras costas!"
 MNT_save_yug_boat: "Salvar Barcos Yugoslavos"
 MNT_save_yug_boat_desc: "Muchos viejos barcos yugoslavos aún quedan en nuestros viejos astilleros. Si logramos salvarlos, podríamos tener una buena flota costera."
 MNT_buy_transport: "Comprar Buques de Desembarco"
 MNT_buy_transport_desc: "En términos de nuestra estrategia militar, es necesario tener algunos buques de desembarco."
 MNT_anti_navy_defence: "Defensa Costera"
 MNT_anti_navy_defence_desc: "Para proteger nuestra larga línea costera, se debe construir una línea de complejos protectores a lo largo de nuestras costas."
 MNT_improve_navy_base: "Mejorar Bases Navales"
 MNT_improve_navy_base_desc: "Nuestro astillero debe mejorarse para garantizar nuestra seguridad."
 MNT_montenegro_ground_forces: "Fuerzas Terrestres de Montenegro"
 MNT_montenegro_ground_forces_desc: "Para proteger nuestra tierra y montañas, debemos crear fuerzas terrestres y equiparlas con las últimas tecnologías."
 MNT_ammunition_from_zastava: "Ammunition from Zastava"
 MNT_ammunition_from_zastava_desc: "Zastava Ammunition is a legacy of Yugoslavia that wasn't destroyed during times of trouble. Buying their ammunition would greatly help us in army creation."
 MNT_american_ammunition: "Ammunition from the US"
 MNT_american_ammunition_desc: "Los socios occidentales tienen las municiones más tecnológicas del mercado. Obtenerlas nos ayudaría a construir un ejército tecnológicamente avanzado."
 MNT_russian_ammunition: "Ammunition from Russia"
 MNT_russian_ammunition_desc: "Los socios de Rusia tienen las municiones más eficientes del mercado. Obtenerlas nos ayudaría a construir un ejército poderoso."
 MNT_russian_vehicles: "Vehículos Rusos"
 MNT_russian_vehicles_desc: "Los vehículos rusos son los más efectivos del mercado. Comprarlos haría que nuestro ejército fuera más organizado y poderoso."
 MNT_american_vehicles: "Vehículos Estadounidenses"
 MNT_american_vehicles_desc: "Los vehículos estadounidenses son los más avanzados del mercado. Comprarlos haría que nuestro ejército fuera más tecnológicamente avanzado y maniobrable."
 MNT_tara_arms: "Armas Tara"
 MNT_tara_arms_desc: "Tara Arms es una empresa basada en la antigua fábrica del 4 de noviembre. El propósito principal de la empresa es fabricar armas civiles para los ciudadanos y armas militares para las fuerzas armadas."
 MNT_montenegro_air: "Fuerza Aérea de Montenegro"
 MNT_montenegro_air_desc: "Para mantener nuestro espacio aéreo seguro, debemos crear fuerzas aéreas y equiparlas con todo el equipo necesario."
 MNT_save_yug_air: "Save Yugoslavian Aircraft"
 MNT_save_yug_air_desc: "Hemos heredado muchos cazas yugoslavos de los viejos aeródromos. Soplemos el polvo y estarán listos para ser utilizados."
 MNT_mlrs: "Defensa Antiaérea"
 MNT_mlrs_desc: "No podríamos estar seguros de que nuestros enemigos fueran intocables si no tuviéramos sistemas de defensa aérea. La restauración de los viejos sistemas de defensa antiaérea yugoslavos y la compra de los nuevos asegurarán nuestro espacio aéreo."
 MNT_foreign_helis: "Comprar Helicópteros Extranjeros"
 MNT_foreign_helis_desc: "Para reubicar a nuestras tropas en climas difíciles y condiciones geopolíticas complicadas, debemos adquirir nuevos helicópteros."
 MNT_improve_air_base: "Mejorar Bases Aéreas"
 MNT_improve_air_base_desc: "Debemos mejorar nuestras bases aéreas para aumentar su capacidad de almacenamiento de aeronaves."
 MNT_strong_and_ready: "Fuertes y Listos"
 MNT_strong_and_ready_desc: "Nuestras fuerzas han sido establecidas y están bien preparadas para emprender tareas militares. Nuestros soldados son los mejores hijos de Montenegro!"
 MNT_foreign_affairs: "Ministerio de Asuntos Exteriores"
 MNT_foreign_affairs_desc: "Para estar en contacto con el mundo exterior, debe establecerse el Ministerio de Asuntos Exteriores."
 MNT_eyes_on_west: "Ojos en Occidente"
 MNT_eyes_on_west_desc: "La cooperación con países ricos y desarrollados de Occidente es necesaria para construir fuertes raíces comerciales, a pesar de todas las cosas malas que la OTAN ha traído a nuestra tierra."
 MNT_american_inv: "Invitar a Inversores Estadounidenses"
 MNT_american_inv_desc: "La cooperación con inversores estadounidenses en el sector industrial podría ser beneficiosa para el crecimiento de nuestro PIB y la cooperación transcontinental."
 MNT_german_inv: "Invitar a Inversores Alemanes"
 MNT_german_inv_desc: "La cooperación con inversores alemanes en el sector industrial podría ser beneficiosa para el crecimiento de nuestro PIB y para nuestra posible integración futura en la UE."
 MNT_european_trade: "Acuerdo Comercial Europeo"
 MNT_european_trade_desc: "No se puede discutir que Montenegro es un país europeo, y no podemos ignorar el hecho de que comerciar con la UE es necesario para nosotros. Nuestra rica tierra podría proporcionar todo para los europeos comunes."
 MNT_eyes_on_east: "Ojos en Oriente"
 MNT_eyes_on_east_desc: "Rusia, Serbia y China. Todos ellos son nuestros aliados históricos. Estamos conectados a las raíces de la cooperación histórica y no podemos separarnos."
 MNT_seek_serb_trade: "Comercio con Serbia"
 MNT_seek_serb_trade_desc: "Serbia es el país más cercano a nosotros. Una vez unidos y ahora separados, debemos continuar el diálogo económico."
 MNT_seek_rus_trade: "Comercio con Rusia"
 MNT_seek_rus_trade_desc: "Rusia es nuestro aliado histórico. El Estado ruso siempre está aquí si necesitamos ayuda, como un hermano mayor. Es obvio que debemos continuar el diálogo económico."
 MNT_chinese_infra: "Autopista Belgrado - Bar"
 MNT_chinese_infra_desc: "To improve Balkan infrastructure and create a route that will connect us to the outer Balkans, a project was created that includes building a motorway from the Port of Bar to Belgrade. The main problem with the project is that we badly need financial support, and the government has decided to ask for investments from Chinese financial organizations."
 MNT_questio_of_direction: "Cuestión de Dirección"
 MNT_questio_of_direction_desc: "Estamos al borde de la decisión más grande, que influirá no solo en la dirección de nuestra política exterior, sino también en la situación en los Balcanes. Debemos decidir sabiamente."
 MNT_cave_to_serbia: "Fortalecer la Cooperación con Serbia"
 MNT_cave_to_serbia_desc: "Our warm relations with Serbia couldn't be broken by anyone, nor could our pro-eastern agenda."
 MNT_sco_observer: "Conexiones con la OCS"
 MNT_sco_observer_desc: "The Shanghai Cooperation Organisation is the best alternative to western imperialist alliances. We will observe the SCO closely and take part in all of its meetings."
 MNT_reunion_with_serbia: "Reunificación con Serbia"
 MNT_reunion_with_serbia_desc: "Se está volviendo obvio que la disolución del estado serbio-montenegrino fue un gran error que condujo a una mayor inestabilidad política en la región. Enviaremos una sugerencia oficial para la recreación de la unión serbio-montenegrina."
 MNT_union_with_russia: "Unirse a la OTSC"
 MNT_union_with_russia_desc: "No podemos ignorar nuestras cálidas relaciones con Rusia. Nuestro hermano no permitirá que nadie nos haga daño, pero para asegurarnos de que Rusia nos ayudará, enviaremos una petición oficial para unirnos a la OTSC."
 MNT_free_harbour: "Puerto Libre"
 MNT_free_harbour_desc: "Inclinarse hacia cualquier lado sería devastador para nuestra economía y nuestra independencia. Para asegurarnos de salvar nuestra soberanía, nos declararemos un puerto libre en el Mar Adriático."
 MNT_neutral_status: "Estado Neutral"
 MNT_neutral_status_desc: "Para mantener nuestro país como un estado independiente, debemos declararnos oficialmente un estado neutral con la ayuda de las principales potencias europeas."
 MNT_swiss_model: "Suiza de los Balcanes"
 MNT_swiss_model_desc: "Para mantener la paz en nuestro país, debemos negociar con los países fronterizos. Deberíamos implementar el modelo suizo de política exterior y convertirnos en la Suiza de los Balcanes."
 MNT_european_intragrate: "Agenda Proeuropea"
 MNT_european_intragrate_desc: "La agenda occidental debe ser dominante en nuestra política exterior para alejarnos de nuestro legado autoritario."
 MNT_nato_affairs: "Cooperación con la OTAN"
 MNT_nato_affairs_desc: "Si queremos salvar nuestra identidad y nuestro país de las fuerzas destructivas del autoritarismo, debemos cooperar con la OTAN."
 MNT_eu_model: "Implementar el Modelo Europeo"
 MNT_eu_model_desc: "To be welcomed into the EU, we must implement progressive reforms and adopt European standards of government structure. It will be a long process, but we believe in ourselves!"
 MNT_nato_aspiration: "Unirse a la OTAN"
 MNT_nato_aspiration_desc: "Para no temer a ninguna amenaza externa y asegurarnos de que nuestra democracia no sea dañada, debemos unirnos a la organización OTAN."
 MNT_independent_politics: "Política de Montenegro"
 MNT_independent_politics_desc: "Después de la larga ocupación por los comunistas yugoslavos, Montenegro volvió a ser independiente, por voluntad de nuestro pueblo! Ahora es el momento de hacer cambios políticos."
