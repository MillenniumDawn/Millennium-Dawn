 ALG_2014_elections_tt: "La §YLucha política argelina§! está por debajo del §Y40%§! hacia los reformistas."
 ALG_2019_elections_tt: "La §YLucha política argelina§! se ha desplazado más de un §Y60%§! hacia los reformistas o hacia el Estado profundo."
