 CHI_Normalise_the_Hermit: "은둔국의 정상화"
 CHI_Normalise_the_Hermit_desc: "개혁이 뿌리를 내림에 따라 우리는 북한의 지역 경제 및 외교 채널로의 공식 재편입을 후원하여, 수십 년간의 고립을 끝내고 우리 자신을 평양 개방의 설계자로 자리매김합니다."
 CHI_Nuclear_Insurance: "핵 보험"
 CHI_Nuclear_Insurance_desc: "우리는 북한의 핵무기를 부담이 아닌 억지력으로 사실상 인정합니다. 평양을 핵보유국으로 받아들임으로써 정권 붕괴에 대비한 보험을 제공하지만 국제적 비난을 받게 됩니다."
 CHI_operation_new_dawn_desc: "평양 지도부를 겨냥한 결정적인 특수 부대 작전을 개시합니다. 장(Jang) 및 태자당 조직망에 따라 이 작전이 깔끔한 쿠데타, 내전, 혹은 재앙 중 어느 것으로 끝날지가 결정됩니다."
 CHI_palm_and_fingers_doctrine: "손바닥과 손가락 독트린"
 CHI_palm_and_fingers_doctrine_desc: "티베트는 손바닥입니다. 라다크, 네팔, 시킴, 부탄, 아루나찰은 손가락입니다. 전략 독트린은 다섯 모두를 요구합니다."
 CHI_pla_divestiture_completion: "인민해방군 사업 정리 완료"
 CHI_pla_divestiture_completion_desc: "인민해방군은 오랫동안 호텔, 제약회사, 무역회사에 이르는 방대한 상업 제국을 정리하도록 요구받아 왔습니다. 이 과정을 완료하면 군의 본연의 임무에 대한 집중이 회복되고 장교 부패의 주요 원천이 제거됩니다. 호텔을 운영하는 군대는 전쟁을 생각하지 않습니다."
 CHI_Pyongyang_Pivot: "평양 피벗"
 CHI_Pyongyang_Pivot_desc: "중국은 정권을 경직시키는 대신, 덩샤오핑의 개혁을 본뜬 신중한 경제 개방을 장려합니다. 더 번영한 북한은 더 안정적인 이웃이자 다루기 쉬운 동반자가 될 것입니다."
 CHI_Rare_Earth_Leverage: "희토류 레버리지"
 CHI_Rare_Earth_Leverage_desc: "한국의 첨단 전자 및 반도체 산업은 중국의 희토류 수출에 크게 의존하고 있습니다. 이 의존성을 활용하면 경제적 유대를 심화하고 서울의 외교 정책 판단에 대한 우리의 영향력을 높일 수 있습니다."
 CHI_Rason_SEZ_Expansion: "라선 경제특구 확장"
 CHI_Rason_SEZ_Expansion_desc: "북한 북동 해안의 라선 경제특구는 경제 현대화의 시험 사례를 제공합니다. 중국의 투자는 항만 접근과 자원 흐름을 열어 주는 동시에 점진적 개혁의 실현 가능성을 보여 줄 수 있습니다."
 CHI_Sanctions_Evasion: "제재 회피"
 CHI_Sanctions_Evasion_desc: "공개적으로는 국제 제재를 지지하면서도 은밀히 국경 간 교역과 금융 흐름이 계속되도록 용인할 수 있습니다. 이는 시치미를 뗄 여지를 유지하면서 북한의 중국 의존을 심화하지만, 발각되면 서방과의 관계가 악화될 것입니다."
 CHI_sco_balance_display: "$CHI_sco_balance$: [?CHI_sco_balance]"
 CHI_sco_cohesion_display: "$CHI_sco_cohesion$: [?CHI_sco_cohesion]"
 CHI_scs_island_construction_campaign: "인공섬 건설 운동"
 CHI_scs_island_construction_campaign_desc: "스프래틀리 군도 전역에서 수년에 걸친 준설 및 건설 프로그램을 개시합니다. 수중 암초가 상설 시설을 수용할 수 있는 인공섬으로 솟아올라, 중국이 주장하는 영유권의 실효적 행정 범위를 수천 제곱킬로미터 넓힙니다."
 CHI_shanghai_clique_ascendant_desc: "와이탄의 불빛이 모든 부처에 닿습니다. 푸둥의 회계사들이 이제 국무원에 앉아 있습니다. 그 조직망은 독트린보다 더 멀리 뻗어 있습니다."
 CHI_shanghai_clique_leaning_desc: "와이탄의 조직망이 모든 부처에서 목소리를 냅니다. 지방 대표들은 푸둥 쪽으로 기울어 위험을 분산하고 있습니다."
 CHI_Six_Party_Talks: "6자 회담"
 CHI_Six_Party_Talks_desc: "6자 회담은 북핵 위기의 해결책을 협상하기 위해 중국, 미국, 러시아, 일본, 그리고 남북한을 한자리에 모읍니다. 이 회담을 주최함으로써 우리는 없어서는 안 될 중재자로 자리매김하고 모든 관련국과의 관계를 개선할 수 있습니다."
 CHI_technocratic_consolidation_desc: "국무원 연구실이 곧 국가입니다. 5개년 계획은 정치국 회의 이후가 아니라 이전에 작성됩니다."
 chi_the_one_china_policy: "하나의 중국 정책"
 CHI_water_pricing_reform: "산업용수 가격 개혁"
 CHI_water_pricing_reform_desc: "공급 측면의 공학에 의존하는 대신 가격을 통해 낭비를 줄입니다. 산업용수 요금이 대폭 인상되어 중공업이 재활용 기술을 도입하고 물 사정이 상대적으로 나은 지역으로 이전하도록 강제합니다. 농민들은 그에 따른 비용 증가에 반발합니다."
 CHI_Yalu_Defense_Pact: "압록강 방위 조약"
 CHI_Yalu_Defense_Pact_desc: "압록강을 따른 공식 방위 협정이 우리의 군사 계획을 북한과 묶어, 상호 방위를 서약하는 동시에 우리에게 보장된 접근권을 부여합니다."
 CHI_youth_league_leaning_desc: "공청단 출신들이 절반의 성에서 부직을 차지하고 있습니다. 인사 후원의 균형이 조용하고 꾸준하게 바뀌고 있습니다."
 CHI_youth_league_resurgent_desc: "쉰 살 미만의 모든 성 부직자는 공청단을 통해 올라왔습니다. 세대는 자리를 잡았습니다. 의제는 그 뒤를 따릅니다."
 paektu_doctrine_southern: "백두 독트린: 남부 경고"
 uighur_threat_display: "$uighur_threat$: [?uighur_threat]"
 CHI_back_princeling_network: "태자당 조직망 지원"
 CHI_back_princeling_network_desc: "혁명 원로의 자제들과 상하이 기득권층에 인사 후원을 집중시켜 권력 균형을 태자당 쪽으로 기울입니다."
 CHI_promote_youth_league: "공청단 간부 승진"
 CHI_promote_youth_league_desc: "공산주의청년단을 통해 성장한 관료들을 승진시켜 권력 균형을 퇀파이 쪽으로 기울입니다."
 CHI_SAR_one_china_framework: "하나의 중국 틀"
 CHI_SAR_one_china_framework_desc: "베이징은 모든 특별행정구와 영토에 대한 자국 권한의 헌법적 근거를 재확인합니다. 이 틀은 각 지역의 독자적 행정 체제를 인정하면서도 중앙의 통일된 정책 방향을 확립합니다."
 CHI_SAR_liaison_office_reform: "연락사무소 개혁"
 CHI_SAR_liaison_office_reform_desc: "국무원이 특별행정구 연락사무소를 보다 통합된 조정 네트워크로 개편합니다. 베이징과 특별행정구 간의 소통 경로가 간소화되어 정책을 더 빠르게 시행하고 행정 마찰을 줄입니다."
 CHI_SAR_national_security_framework: "국가 안보 체계"
 CHI_SAR_national_security_framework_desc: "통합된 국가 안보 기구가 모든 특별행정구 영토로 확대됩니다. 인민해방군 주둔군, 국가안전 당국, 지방 경찰 병력 간의 조율이 중앙의 감독 아래 공식화됩니다."
 CHI_SAR_two_systems_commitment: "양제 공약"
 CHI_SAR_two_systems_commitment_desc: "베이징은 자격을 갖춘 모든 특별행정구에 대해 \\"일국양제\\" 원칙을 공식적으로 재확인합니다. 헌법적 틀 안에서 고도의 자치가 보장되며, 이는 통합보다 포용을 선호한다는 신호입니다."
 CHI_SAR_research_sharing: "특별행정구 연구 협력"
 CHI_SAR_research_sharing_desc: "베이징은 본토 대학 및 국영 연구소와 특별행정구 기관을 연결하는 공동 연구 프로그램을 수립합니다. 이 구상은 학술적, 기술적 유대를 심화하는 동시에 중국의 전체 연구 역량을 확대합니다."
 CHI_SAR_military_corporation_sharing: "국방 산업 통합"
 CHI_SAR_military_corporation_sharing_desc: "특별행정구에 기반을 둔 방산 계약업체와 엔지니어링 기업이 본토의 조달망에 편입됩니다. 공유된 생산 표준과 공급망으로 인민해방군의 생산 능력이 증가합니다."
 CHI_SAR_military_corporation_sharing_mio_tt: "특별행정구가 중국의 군수 산업 조직을 이용할 수 있게 됩니다"
 CHI_SAR_one_system_declaration: "일제 선언"
 CHI_SAR_one_system_declaration_desc: "국무원은 특별행정구 통치를 본토 체제와 더욱 깊이 통합하는 방향으로 정책을 전환할 것임을 시사합니다. 별도의 법적, 행정적 틀은 앞으로 몇 년에 걸쳐 중화인민공화국의 체제와 점진적으로 일치하게 됩니다."
 CHI_SAR_han_superiority: "한족 우선 독트린"
 CHI_SAR_han_superiority_desc: "베이징은 다민족 국가 모델을 버리고 한족 다수를 중심으로 한 단일 국가 정체성을 택합니다. 후안강과 후롄허 같은 학자들이 내세운 \\"제2세대 민족 정책\\"을 반영하여, 민족에 기반한 자치는 축소되고 모든 지역에서 동화가 가속됩니다."
 CHI_HKG_greater_bay_area: "대만구 구상"
 CHI_HKG_greater_bay_area_desc: "베이징과 홍콩은 11개 도시를 하나의 혁신 및 금융 회랑으로 연결하는 광둥-홍콩-마카오 대만구 프로젝트를 공동으로 출범시킵니다. 이 계획은 선전 경제특구 이래 중국에서 가장 야심 찬 지역 통합 프로그램입니다."
 CHI_HKG_financial_integration: "금융 체계 통합"
 CHI_HKG_financial_integration_desc: "후강퉁과 채권통 제도에 따라 국경 간 자본 흐름 체계가 확대됩니다. 홍콩이 위안화 역외 거래의 중심지라는 역할이 공식화되어 본토 금융 시장과의 상호 의존이 깊어집니다."
 CHI_HKG_express_rail_link: "고속철도 연결"
 CHI_HKG_express_rail_link_desc: "광저우-선전-홍콩 고속철도 연결이 완공되어 홍콩이 중국 고속철도망에 직접 연결됩니다. 홍콩과 본토 주요 도시 간 이동 시간이 대폭 단축되어 사람과 상업의 이동이 가속됩니다."
 CHI_HKG_individual_visit_scheme: "개인 방문 제도"
 CHI_HKG_individual_visit_scheme_desc: "베이징은 개인 방문 제도를 확대하여 추가 도시의 본토 주민이 단체 관광 제한 없이 홍콩을 방문할 수 있게 합니다. 본토 관광객과 쇼핑객의 유입은 홍콩의 소매 및 서비스 부문에 상당한 활력을 불어넣습니다."
 CHI_HKG_shenzhen_hk_stock_connect: "선강퉁"
 CHI_HKG_shenzhen_hk_stock_connect_desc: "상호 시장 접근 프로그램이 홍콩과 선전 증권거래소를 연결하여 양쪽 투자자가 서로의 상장 주식을 거래할 수 있게 합니다. 이 제도는 국경 간 자본 흐름의 관문이라는 홍콩의 불가결한 역할을 더욱 굳힙니다."
 CHI_HKG_electoral_reform: "선거 제도 개혁"
 CHI_HKG_electoral_reform_desc: "베이징은 홍콩 입법회 선거 틀을 전면 개편하여 직선 의석을 줄이고, \\"애국자\\"만 출마하도록 보장하는 후보 심사 제도를 도입합니다. 이 개혁은 정치권력을 민주파 야당으로부터 결정적으로 멀어지게 합니다."
 CHI_HKG_media_freedom: "언론 자유 보장"
 CHI_HKG_media_freedom_desc: "시민 사회의 압력에 양보하여 베이징은 홍콩 내 편집권 독립에 대한 법적 보호에 동의합니다. 국제 언론 기관들은 이 보장을 \\"양제\\" 모델이 2047년까지 지켜질 것이라는 신호로 해석합니다."
 CHI_HKG_censorship: "인터넷 및 언론 검열"
 CHI_HKG_censorship_desc: "베이징은 홍콩 당국이 도시의 인터넷 및 방송 규정을 본토 기준에 맞추도록 지시합니다. 정치적으로 민감하다고 판단되는 콘텐츠를 호스팅하는 웹사이트는 차단되며, 주요 신문사 편집자들은 자기 검열 압박에 직면합니다."
 CHI_HKG_moral_national_education: "도덕 및 국민 교육"
 CHI_HKG_moral_national_education_desc: "홍콩 학교에 공산당에 대한 충성과 본토 중심의 중국사관을 강조하는 새로운 필수 국민 교육 과정이 도입됩니다. 이 정책은 상당한 대중의 반대를 불러일으키지만 중앙의 지시에 따라 추진됩니다."
 CHI_HKG_national_security_law: "제23조 국가안전법"
 CHI_HKG_national_security_law_desc: "홍콩은 기본법 제23조에 따라 요구되는 국가 안보 입법을 제정하여 분리, 전복, 테러, 외세와의 결탁을 범죄로 규정합니다. 이 법은 홍콩만의 독자적인 정치 문화가 사실상 끝났음을 의미합니다."
 CHI_HKG_lok_ma_chau_loop: "록마차우 루프 개발"
 CHI_HKG_lok_ma_chau_loop_desc: "선전 국경에 있는 공동 개발 예정지인 록마차우 루프에 전용 혁신 기술 구역이 조성됩니다. 이 단지는 홍콩과 본토 양쪽에 가까운 곳을 원하는 연구 기관과 기술 기업을 유치하는 것을 목표로 합니다."
 CHI_HKG_2030_study: "홍콩 2030+ 전략 연구"
 CHI_HKG_2030_study_desc: "홍콩 정부는 신규 개발 지역, 교통 회랑, 산업 용지의 부지를 확인한 장기 공간 계획 전략을 발표합니다. 이 연구는 홍콩의 물리적 성장을 대만구 통합의 맥락 속에 위치시킵니다."
 CHI_HKG_palace_museum: "홍콩 고궁 박물관"
 CHI_HKG_palace_museum_desc: "베이징 고궁박물원의 분관이 홍콩 서구룡문화지구에 설립되어 자금성 소장품에서 대여한 유물을 전시합니다. 이 프로젝트는 홍콩과 본토를 잇는 문화적 가교로 제시되며 상당한 국제적 관심을 끕니다."
 CHI_HKG_zhuhai_macau_bridge: "홍콩-주하이-마카오 대교"
 CHI_HKG_zhuhai_macau_bridge_desc: "세계에서 가장 긴 해상 교량-터널 체계가 완공되어 주강 하구를 가로질러 홍콩, 주하이, 마카오를 연결합니다. 이 구조물은 세 도시 간 육로 이동 시간을 대폭 단축하고 대만구 통합의 물리적 척추 역할을 합니다."
 CHI_HKG_lok_ma_chau_station: "록마차우 역 확장"
 CHI_HKG_lok_ma_chau_station_desc: "록마차우 국경 검문소가 여객 및 화물 시설을 확충하여 홍콩에서 가장 붐비는 육로 입구 중 하나의 혼잡이 줄어듭니다. 물류 처리량이 개선되어 국경 간 상업과 통근 흐름이 가속됩니다."
 CHI_SAR_integrate_HKG: "홍콩 완전 통합"
 CHI_SAR_integrate_HKG_desc: "홍콩의 정치 및 경제 체제가 본토와 완전히 일치함에 따라 베이징은 특별행정구의 별도 행정 지위를 공식적으로 해소합니다. 옛 식민지는 중화인민공화국의 직할시로 편입됩니다."
 CHI_MAC_pearl_river_delta: "주강 삼각주 통합"
 CHI_MAC_pearl_river_delta_desc: "마카오가 주강 삼각주 경제권에 공식 편입되며, 경제적 고립을 줄이는 데 초점을 맞춘 인프라 투자가 이루어집니다. 홍콩-주하이-마카오 대교는 새로운 국경 간 교통망의 중추가 됩니다."
 CHI_MAC_lotus_flower_economy: "연꽃 경제"
 CHI_MAC_lotus_flower_economy_desc: "마카오는 포르투갈-중국 특별행정구라는 이 땅 고유의 정체성에 기반한 경제 리브랜딩 구상을 시작합니다. 이 전략은 단일 부문을 겨냥하는 대신 마카오를 \\"세계 관광 레저 중심\\"으로 재정립하며, 이 브랜드는 이후 모든 다각화 노력의 틀이 되고 대만구에 대한 베이징의 구상과도 부합합니다."
 CHI_MAC_financial_services: "역외 금융 서비스 허브"
 CHI_MAC_financial_services_desc: "마카오의 규제 체계가 개정되어 역외 은행업, 채권 발행, 위안화 결제 업무를 유치합니다. 이 지역의 포르투갈 법률 유산은 본토 진출을 원하는 포르투갈어권 투자자들에게 이점으로 홍보됩니다."
 CHI_MAC_infrastructure_link: "국경 간 인프라 연결"
 CHI_MAC_infrastructure_link_desc: "새로운 국경 검문소와 경전철 연장선이 마카오의 코타이 개발 구역을 헝친 섬의 광둥-마카오 심층 협력구와 직접 연결합니다. 이 프로젝트는 마카오의 경제적 발자취를 본토와 물리적으로 통합합니다."
 CHI_MAC_guangdong_integration: "광둥 통합 협정"
 CHI_MAC_guangdong_integration_desc: "광둥성과의 포괄적 협력 협정으로 마카오의 계획, 법률, 금융 규정이 본토 기준에 맞춰집니다. 관계자들은 이 협정을 특별행정구와 본토 통치의 평화적 수렴을 보여 주는 모범이라고 설명합니다."
 CHI_SAR_integrate_MAC: "마카오 완전 통합"
 CHI_SAR_integrate_MAC_desc: "수십 년에 걸친 경제적, 법적 조화의 심화 끝에 마카오의 특별행정구 지위가 해소됩니다. 이 지역은 광둥성 행정 체계에 흡수되어 1999년 반환의 마지막 단계를 완성합니다."
 CHI_MAC_cultural_autonomy_push: "포르투갈 유산 운동"
 CHI_MAC_cultural_autonomy_push_desc: "시민 단체들이 가속화되는 본토 통합에 맞서 마카오 고유의 포르투갈-중국 문화 정체성을 보존하기 위한 운동을 벌입니다. 요구 사항에는 포르투갈어, 마카오 토착 공동체, 이 지역 특유의 법적 다원주의에 대한 법적 보호가 포함됩니다."
 CHI_MAC_lusophone_connections: "포르투갈어권 관문 전략"
 CHI_MAC_lusophone_connections_desc: "마카오는 경제무역협력포럼을 확대하여 중국과 포르투갈어권 세계를 잇는 불가결한 가교로 자리매김합니다. 이 독특한 역할에 대한 국제적 인정은 고도의 자치를 유지해야 한다는 정치적 논거가 됩니다."
 CHI_TIB_plateau_development: "고원 개발 기금"
 CHI_TIB_plateau_development_desc: "국무원은 시짱 자치구의 인프라, 주택, 공공 서비스를 대상으로 하는 대규모 투자 프로그램을 시작합니다. 이 프로그램은 서부 대개발 전략을 본뜬 것이지만 국내적으로는 빈곤 완화 구상으로 포장됩니다."
 CHI_TIB_railway_modernization: "칭짱 철도 연장"
 CHI_TIB_railway_modernization_desc: "칭짱 철도 2단계가 승인되어 노선이 시가체까지 연장되고 결국 인도 국경 인근의 린즈까지 이어집니다. 이 프로젝트는 티베트의 물류적 고립을 줄이고 한족 정착민과 보안 병력의 이동을 가속합니다."
 CHI_TIB_release_falun_gong: "파룬궁 사면"
 CHI_TIB_release_falun_gong_desc: "계산된 개방의 제스처로 베이징은 수감된 파룬궁 수련자들을 석방하고 시짱 자치구 내 이 운동의 종교 활동에 대한 제한을 완화합니다. 이 양보는 서방 정부들로부터 조심스러운 찬사를 받으며 종교적 반대 의견에 대한 보다 부드러운 접근을 시사합니다."
 CHI_TIB_return_dalai_lama: "달라이 라마의 귀환"
 CHI_TIB_return_dalai_lama_desc: "오랜 비공식 협상 끝에 베이징과 달라이 라마 측 대표들은 티베트 정신적 지도자가 의례적 자격으로 라싸에 돌아오는 것을 허용하는 합의에 도달합니다. 이 합의는 정치적 자치에는 못 미치지만 각국 수도에서 상당한 호의를 얻습니다."
 CHI_TIB_sinification: "애국 교육 운동"
 CHI_TIB_sinification_desc: "당은 티베트 사원과 학교에서 달라이 라마에 대한 규탄과 조국에 대한 충성 서약을 요구하는 체계적인 이념 재교육 프로그램을 시작합니다. 이 운동은 1990년대 \\"엄타\\" 운동을 본뜬 것이며 특별 파견된 공작조가 관리합니다."
 CHI_TIB_autonomy_preservation: "진정한 자치 틀"
 CHI_TIB_autonomy_preservation_desc: "국제적 압력과 거듭되는 소요에 대응하여 베이징은 문화적, 종교적 자치 확대에 관해 달라이 라마 측 대표들과 협상에 들어갑니다. 스트라스부르 제안과 중도 노선이 비공식 논의의 토대가 됩니다."
 CHI_TIB_cultural_integration: "통치의 중국화"
 CHI_TIB_cultural_integration_desc: "한족 관료가 티베트의 행정, 사법, 보안 기구 전반의 고위직에 임명됩니다. 정부 언어는 티베트어에서 표준 중국어로 대체되며 모든 국공립 학교의 교육 과정은 본토의 내용으로 통일됩니다."
 CHI_SAR_integrate_TIB: "티베트 완전 통합"
 CHI_SAR_integrate_TIB_desc: "종교적 권위가 무력화되고 행정 구조가 완전히 일치하며 인구 구성의 변화가 완료됨에 따라 시짱 자치구의 잔여 특별행정구 지위가 해소됩니다. 티베트는 중앙 정부의 직접 행정 아래 있는 일반 성으로 재편입됩니다."
 CHI_TIB_buddhist_cultural_zone: "불교 문화 보존 구역"
 CHI_TIB_buddhist_cultural_zone_desc: "포탈라 궁과 조캉 사원 주변에 지정 보존 구역이 설립되어 티베트 불교가 문화유산 기관으로서 제한적인 공식 인정을 받습니다. 비판자들은 이 양보가 실질적인 종교의 자유를 피하는 관광 위주의 타협이라고 평가합니다."
 CHI_TIB_silk_road_gateway: "히말라야 실크로드 관문"
 CHI_TIB_silk_road_gateway_desc: "일대일로 남아시아 회랑의 접점이라는 티베트의 지리적 위치를 활용하여 국경 인프라, 수력 발전, 무역 물류에 투자합니다. 이 구상은 티베트 경제를 네팔 및 남아시아 시장과 통합하는 동시에 본토에 대한 의존을 심화합니다."
 CHI_TIB_monastery_economy: "사원 경제"
 CHI_TIB_monastery_economy_desc: "역사적으로 지역 경제의 중추였던 티베트 승원 기관이 특별행정구 틀 안에서 상업 기업을 운영하도록 허용됩니다. 순례 관광, 전통 의약품 생산, 수공업이 수익을 창출하여 승원과 지역 공동체를 모두 뒷받침합니다."
 CHI_TIB_plateau_resources: "고원 광물 조사"
 CHI_TIB_plateau_resources_desc: "시짱 자치구는 티베트 고원의 상당한 리튬, 구리, 크롬철석 매장지를 확인하는 독자적인 조사를 실시합니다. 특별행정구 당국은 채굴 수익의 일부를 지역 예산에 남기는 수익 배분 협정을 협상합니다."
 CHI_ETK_corridor_investment: "일대일로 회랑 투자"
 CHI_ETK_corridor_investment_desc: "신장은 일대일로의 주요 육상 관문으로 지정되어 철도, 송유관, 고속도로 인프라에 막대한 국가 투자를 유치합니다. 중국-파키스탄 경제회랑의 북쪽 종점인 카슈가르가 이 지역의 경제 지리를 바꿔 놓습니다."
 CHI_ETK_resource_extraction: "에너지 및 광물 채굴"
 CHI_ETK_resource_extraction_desc: "타림 분지의 석유 및 가스 매장량이 송유관 건설과 정제 능력을 우선시하는 국가 개발 프로그램에 따라 확대됩니다. 신장이 국가 석유 생산에서 차지하는 비중이 크게 늘지만, 중앙으로의 수익 이전은 여전히 지속적인 불만으로 남습니다."
 CHI_ETK_silk_road_commerce: "실크로드 상업 구상"
 CHI_ETK_silk_road_commerce_desc: "신장의 전통적인 위구르 상인 네트워크가 지역 무역 정책에 공식 편입되어 중앙아시아 공화국들과의 국경 간 상거래에 우대 허가가 주어집니다. 이 정책은 당나라 시대로 거슬러 올라가는 위구르 중개 무역의 역사적 양상을 되살립니다."
 CHI_ETK_oilfield_development: "타림 분지 유전 개발"
 CHI_ETK_oilfield_development_desc: "신장 특별행정구 정부는 타림 분지 탐사를 위해 국가 에너지 기업들과 합작 투자 협정을 협상하여, 지역 인프라를 위한 전례 없는 채굴 로열티 몫을 확보합니다. 이 유전들은 중국 최대 규모에 속하며 지역의 재정적 독립을 뒷받침합니다."
 CHI_ETK_strike_hard_campaign: "엄타 운동"
 CHI_ETK_strike_hard_campaign_desc: "위구르 분리주의 조직망을 겨냥한 \\"엄타, 최대 압박\\" 운동이 전례 없는 규모로 재개되어 디지털 감시, 대규모 구금, 종교 활동에 대한 조직적 탄압을 동반합니다. 국제 인권 단체들은 광범위한 학대를 기록합니다."
 CHI_ETK_education_centres: "직업 기능 교육 센터"
 CHI_ETK_education_centres_desc: "공식적으로 \\"직업 기능 교육 훈련 센터\\"로 불리는 초법적 구금 시설망이 신장 전역에 설립됩니다. 안면 인식, DNA 데이터베이스, 스마트폰 감시를 아우르는 종합 디지털 감시망이 지역 전체에 배치됩니다."
 CHI_ETK_total_survaillance_infrastructure: "전면 감시 인프라"
 CHI_ETK_total_survaillance_infrastructure_desc: "안면 인식 카메라, 생체 인식 검문소, 의무 스마트폰 감시 소프트웨어를 통합한 지역 전체 감시망이 신장 전역에 구축됩니다. 이 체계는 당국에 주민 이동과 온라인 활동에 대한 거의 완전한 가시성을 부여합니다."
 CHI_SAR_integrate_ETK: "신장 완전 통합"
 CHI_SAR_integrate_ETK_desc: "분리주의 활동의 거의 완전한 진압과 전통적 위구르 사회 구조의 해체 이후, 신장의 특별행정구 행정 틀이 해소됩니다. 이 지역은 특별한 민족 자치 조항 없이 일반 성 행정 체계로 개편됩니다."
 CHI_ETK_autonomy_statute: "신장 자치 규약"
 CHI_ETK_autonomy_statute_desc: "새로운 지역 자치 규약은 신장의 무슬림 공동체에 종교 활동, 위구르어 교육, 개인 문제에서의 관습법에 대한 공식 권리를 부여합니다. 이 규약은 일부 국제 이슬람 기구의 지지를 받습니다."
 CHI_ETK_islamic_governance_framework: "이슬람 통치 틀"
 CHI_ETK_islamic_governance_framework_desc: "베이징은 신장에서 보다 유화적인 접근을 택하여 규제된 이슬람 종교 활동을 허용하고, 위구르어 교육을 확대하며, 더 많은 위구르인 관료를 지방 정부에 임명합니다. 이 정책은 2017년 이전 시기의 상대적 관대함을 반영합니다."
 CHI_ETK_BRI_hub: "카슈가르 경제특구"
 CHI_ETK_BRI_hub_desc: "카슈가르는 일대일로 환적 무역에 대한 세제 우대와 간소화된 통관 절차를 갖춘 경제특구로 지정됩니다. 이 구역은 신장을 중앙아시아, 남아시아, 중동을 잇는 상업 거점으로 자리매김하게 합니다."
 CHI_TAI_combat_the_traitors: "반역자 척결"
 CHI_TAI_combat_the_traitors_desc: "베이징은 대만에 대해 타협 없는 입장을 취하여 독립 지지 지도자들을 공식적으로 반역자로 규정하고 무력 통일이 여전히 유효한 선택지임을 시사합니다. 이 선언은 양안 긴장을 급격히 높이고 인민해방군을 고도의 경계 태세에 놓습니다."
 CHI_TAI_cut_us_support: "미국-대만 관계 단절"
 CHI_TAI_cut_us_support_desc: "베이징은 미국 정계와 재계를 겨냥한 지속적인 영향력 공작을 벌여, 무기 판매와 타이베이와의 공식 접촉에 반대하는 로비를 합니다. 이 작전은 대만 안보에 대한 미국의 공약의 신뢰성을 약화시키기 위해 고안되었습니다."
 CHI_TAI_outward_island_infrastructure: "외곽 도서 군사 기반시설"
 CHI_TAI_outward_island_infrastructure_desc: "대만을 장악한 이후 인민해방군은 외곽 도서에 요새화된 해군 및 공군 시설을 건설하기 시작합니다. 새로운 기지는 중국의 전력 투사 범위를 서태평양 깊숙이 확장하고 지역 군사 균형을 크게 바꿉니다."
 CHI_TAI_cross_strait_policy: "양안 정책 검토"
 CHI_TAI_cross_strait_policy_desc: "국무원은 통일을 위한 외교, 경제, 군사적 선택지를 검토하는 양안 정책 종합 검토를 의뢰합니다. 이 검토는 향후 10년간 중국의 대만 접근 방식의 정치적 의제를 설정합니다."
 CHI_TAI_economic_track: "양안 경제 트랙"
 CHI_TAI_economic_track_desc: "베이징은 무역 원활화, 산업 협력, 장기적 시장 접근에 초점을 맞춘 체계적인 경제 대화를 타이베이와 시작합니다. 정치 회담을 거부하기 어려울 만큼 충분한 상호 이익을 쌓는 것이 목표입니다."
 CHI_TAI_political_track: "양안 정치 트랙"
 CHI_TAI_political_track_desc: "경제적 관여와 병행하여 베이징은 대화 체계를 되살리고 긴장을 낮추며 양측이 수용할 수 있는 협상 타결의 토대를 마련하기 위한 전담 정치 트랙을 설립합니다."
 CHI_TAI_expand_cross_strait_trade: "양안 무역 확대"
 CHI_TAI_expand_cross_strait_trade_desc: "ECFA와 이후 서비스 무역 협상의 논리를 바탕으로 베이징은 본토에서 활동하는 대만 기업에 새로운 상업적 양보와 장벽 완화를 제안합니다. 이 정책은 경제 협력이 대만의 정치 및 재계 엘리트에게 눈에 띄게 수익이 되도록 설계되었습니다."
 CHI_TAI_mainland_market_access: "본토 시장 접근"
 CHI_TAI_mainland_market_access_desc: "중국은 대만 투자자와 수출업자에게 특히 첨단 제조업과 서비스 등 일부 본토 부문에 대한 우대 접근권을 부여합니다. 이 조치는 무력이 아닌 기회를 통해 대만을 본토 경제에 더 긴밀히 묶으려는 현실의 노력을 반영합니다."
 CHI_TAI_business_delegations: "양안 기업 대표단"
 CHI_TAI_business_delegations_desc: "반관반민 무역 단체, 상공회의소, 주요 산업 주체들이 정기적인 양안 방문을 재개합니다. 이 대표단은 안정적인 관계의 혜택을 보는 지지층을 대만에 형성하면서 실무 협력을 심화하는 정치적으로 더 안전한 방법을 만들어 냅니다."
 CHI_TAI_transport_links: "직항 교통 연결"
 CHI_TAI_transport_links_desc: "직항편, 해운 협정, 물류 조정이 확대되어 양측의 실질적 분리를 줄입니다. 더 빠른 상업 및 여객 이동은 지속적인 교류의 정치적 비용을 낮추고 양안 교류를 더욱 정상화합니다."
 CHI_TAI_semiconductor_coordination: "반도체 조율"
 CHI_TAI_semiconductor_coordination_desc: "타이베이는 첨단 기술 공급망, 특히 반도체와 정밀 제조에서 제한적인 전략적 조율에 동의합니다. 이 조치는 대만 반도체 부문과 본토 수요 사이의 실질적인 경제적 상호 의존을 반영하되, 노골적인 정치적 통합에는 이르지 않습니다."
 CHI_TAI_investment_safeguards: "투자 보호 장치"
 CHI_TAI_investment_safeguards_desc: "대만 협상단은 더 깊은 경제 통합에는 현지 기업과 기관을 보호하는 법적, 규제적 보장이 병행되어야 한다고 주장합니다. 이 접근은 양안 투자가 정치적 흡수의 수단이 되어서는 안 된다는 대만 내부의 현실적인 우려에 기반합니다."
 CHI_TAI_joint_industrial_planning: "공동 산업 기획"
 CHI_TAI_joint_industrial_planning_desc: "양측의 기획자들이 인프라, 산업 공급망, 기술 집약 부문을 조율하기 시작합니다. 이 과정은 흩어진 기업 간 연결을 관리되는 양안 개발 전략에 더 가까운 것으로 탈바꿈시킵니다."
 CHI_TAI_deep_economic_integration: "심층 경제 통합"
 CHI_TAI_deep_economic_integration_desc: "수년간 쌓인 협정 끝에 양안 상업은 투자, 물류, 산업적 상호 의존의 촘촘한 틀로 공식화됩니다. 이 단계에 이르면 경제적 분리는 양측, 특히 대만에게 점점 더 큰 비용이 됩니다."
 CHI_TAI_resume_party_contacts: "정당 접촉 재개"
 CHI_TAI_resume_party_contacts_desc: "베이징은 덜 대립적인 양안 관계를 논의할 의향이 있는 대만의 정당 및 단체와의 채널을 재가동합니다. 이 접근은 국가 간 외교를 주기적으로 대체해 온 중국공산당-국민당 대화 등 비공식 정치 접촉의 실제 양상에 뿌리를 두고 있습니다."
 CHI_TAI_pro_china_party_networks_mission: "친중 정당 조직망"
 CHI_TAI_pro_china_party_networks_mission_desc: "중국의 양안 기업 및 정치 조직망은 대만 내 통일 지지 정당에 대한 지지를 적극적으로 키웁니다. 우리의 영향력이 상당히 유지되는 한, 이러한 노력은 여론을 범남 연합 쪽으로 점차 이동시킵니다."
 CHI_TAI_offer_confidence_measures: "신뢰 구축 조치 제안"
 CHI_TAI_offer_confidence_measures_desc: "베이징은 정기적인 소통 채널과 공개적 신호 자제를 포함한 실질적인 긴장 완화 조치 패키지를 제안합니다. 의도는 대만의 온건파에게 관여가 주권 문제를 즉각 강요하지 않으면서도 위험을 줄일 수 있음을 설득하는 것입니다."
 CHI_TAI_legislative_exchange_forum: "입법 교류 포럼"
 CHI_TAI_legislative_exchange_forum_desc: "입법자, 자문역, 정책 전문가 대표단이 반관반민 채널을 통해 만나 무역, 교통, 행정 조율을 논의하기 시작합니다. 이러한 포럼은 양안 관여에 의회적, 절차적 얼굴을 부여하여 하향식 압박이라는 이미지를 누그러뜨립니다."
 CHI_TAI_local_government_dialogue: "지방 정부 대화"
 CHI_TAI_local_government_dialogue_desc: "시 행정부, 현 정부, 하위 관료들이 교통, 관광, 투자에 관한 실무 회담을 시작합니다. 이는 중앙 차원의 공식 관계가 긴장되어 있을 때도 도시 및 지방 간 연결이 종종 진전되었던 현실의 양상을 반영합니다."
 CHI_TAI_reaffirm_the_1992_consensus: "92 공식 재확인"
 CHI_TAI_reaffirm_the_1992_consensus_desc: "대만의 온건파는 하나의 중국이 있다는 틀로 명시적으로 복귀하되, 그 원칙에 대한 자신들의 해석은 유지하기로 합니다. 이 공식은 국내에서 논란이 되지만 진지한 양안 협상을 위한 가장 현실적인 토대로 남아 있습니다."
 CHI_TAI_suspend_independence_initiatives: "독립 추진 중단"
 CHI_TAI_suspend_independence_initiatives_desc: "타이베이는 법적 또는 외교적으로 섬을 공식 분리로 이끌 조치들을 조용히 중단합니다. 이것이 자치의 종식을 뜻하지는 않지만, 대만이 상황을 악화시키기보다 안정시킬 준비가 되어 있음을 시사합니다."
 CHI_TAI_back_channel_settlement: "비공식 채널 타결"
 CHI_TAI_back_channel_settlement_desc: "양측의 반관반민 기구들이 신뢰 구축에서 실질적인 정치적 흥정으로 넘어갑니다. 해협양안관계협회(ARATS)와 해협교류기금회(SEF) 방식의 접촉 모델을 바탕으로, 평화 통일이 질서 있고 점진적이며 물질적으로 이로운 것으로 보이도록 설계된 타결 틀을 작성합니다."
 CHI_TAI_peaceful_reunification_accord: "평화 통일 협정"
 CHI_TAI_peaceful_reunification_accord_desc: "수년간의 점진적인 외교적 진전 끝에 베이징과 타이베이는 대만이 특별행정구로서 중화인민공화국에 편입되는 것을 규정한 역사적 틀 협정에 서명합니다. 이 협정은 50년의 과도기 동안 대만의 기존 민주 제도와 법 체계를 보장합니다."
 CHI_TAI_military_buildup: "양안 군비 증강"
 CHI_TAI_military_buildup_desc: "인민해방군은 대만 해협 유사시에 맞춰 구성된 상륙 강습함, 상륙정, 장거리 정밀 미사일의 조달을 가속합니다. 합동 훈련은 외곽 도서 점령과 대만 방공망 제압을 모의합니다."
 CHI_TAI_amphibious_doctrine: "합동 도서 상륙 교리"
 CHI_TAI_amphibious_doctrine_desc: "인민해방군 해병대와 동부전구는 제병협동 상륙 강습을 위한 개정 합동 작전 교리를 발표합니다. 이 교리는 기밀이지만 외국 정보기관들은 대만 유사시를 위한 직접적인 청사진으로 폭넓게 분석하고 있습니다."
 CHI_TAI_blockade_declaration: "대만 해협 봉쇄"
 CHI_TAI_blockade_declaration_desc: "인민해방군 해군은 대만 주변에 해상 출입 금지 구역을 선포하여 상업 항로를 차단하고 연료와 원자재 수입을 끊습니다. 봉쇄는 확대된 공중 훈련과 탄도 미사일 시험을 동반하며 국제 위기를 촉발합니다."
 CHI_TAI_operation_storm: "폭풍 작전"
 CHI_TAI_operation_storm_desc: "인민해방군이 오랫동안 계획해 온 대만 상륙 작전을 개시합니다. 미사일 공격이 방공망과 지휘 기반시설을 무력화하는 동안 상륙 병력은 공중 및 해상 엄호 아래 해협을 건넙니다. 이 작전은 한국전쟁 이후 아시아에서 가장 중대한 군사 행동입니다."
 CHI_TAI_economic_miracle: "대만 경제 기적 통합"
 CHI_TAI_economic_miracle_desc: "대만의 첨단 반도체 산업, 금융 부문, 기술 생태계가 국가 경제 계획 체계에 공식 편입됩니다. 이 인수는 특히 칩 제조 분야에서 중국의 기술 역량에 변혁적인 이득을 가져옵니다."
 CHI_OMG_steppe_development: "네이멍구 개발 구상"
 CHI_OMG_steppe_development_desc: "국무원은 에너지 인프라, 물류 회랑, 산업 단지에 투자하는 내몽골 자치구 맞춤형 개발 프로그램을 시작합니다. 이 구상은 내몽골을 국가 경제망에 더 깊이 통합하는 동시에 만성적인 농촌 빈곤을 해소합니다."
 CHI_OMG_northern_corridor: "북부 회랑 인프라"
 CHI_OMG_northern_corridor_desc: "내몽골과 베이징-톈진-허베이 도시권을 잇는 새로운 고속도로 및 철도 화물 회랑이 승인되어 석탄, 희토류 광물, 농산물의 운송 시간이 단축됩니다. 이 회랑은 내몽골이 중국 북부의 에너지 배후지라는 역할을 뒷받침합니다."
 CHI_OMG_mandarin_education: "표준 중국어 교육 정책"
 CHI_OMG_mandarin_education_desc: "지역 정부는 모든 초중등학교에서 핵심 과목을 몽골어가 아닌 표준 중국어로 가르치도록 하는 단계적 전환을 발표합니다. 티베트와 신장의 유사한 조치를 본뜬 이 정책은 내몽골의 도시와 유목 공동체 전역에서 광범위한 시위를 촉발합니다."
 CHI_OMG_cultural_recognition: "몽골 문화 인정"
 CHI_OMG_cultural_recognition_desc: "베이징은 내몽골 특별행정구의 몽골 문화 및 언어 정체성을 공식 인정하여 몽골어 교육, 국영 방송, 공식 문자의 지위를 보장합니다. 이 정책은 티베트와 신장에 적용된 동화주의 접근과의 의도적인 결별을 나타냅니다."
 CHI_OMG_han_settlement_program: "한족 정착 프로그램"
 CHI_OMG_han_settlement_program_desc: "허베이, 산시, 간쑤에서의 국가 후원 이주가 내몽골의 인구 구성 변화를 가속합니다. 과거 유목지에 새로운 향·진이 세워지고 우대 고용 정책이 도시 지역에서 한족 다수 지위를 더욱 공고히 합니다."
 CHI_SAR_integrate_OMG: "내몽골 완전 통합"
 CHI_SAR_integrate_OMG_desc: "인구 및 문화의 변화 이후 내몽골의 특별행정구 지위가 해소되고 이 지역은 일반 성급 행정 구역으로 재편됩니다. 몽골 자치의 공식 인정은 중화인민공화국 전역에 적용되는 일반 소수민족 보호 조항으로 대체됩니다."
 CHI_OMG_greater_mongolia_vision: "범몽골 비전"
 CHI_OMG_greater_mongolia_vision_desc: "내몽골 문화 운동의 옹호자들은 공유된 역사, 언어, 유목 유산을 내세워 독립 몽골국과의 더 긴밀한 유대에 대한 비전을 밝힙니다. 베이징은 이러한 문화적 틀을 용인하되 정치적 함의에는 엄격한 한계를 둡니다."
 OMG_steppe_livestock_industry: "초원 축산업 현대화"
 OMG_steppe_livestock_industry_desc: "내몽골의 전통적인 캐시미어, 양고기, 유제품 산업이 유목민 가정을 전국 공급망에 연결하는 협동조합 모델로 재편됩니다. 이 프로그램은 유목 생활방식의 요소를 보존하면서 가구 소득을 향상시킵니다."
 CHI_OMG_steppe_mining_industry: "초원 광업"
 CHI_OMG_steppe_mining_industry_desc: "내몽골의 크롬 및 광물 매장지가 조율된 채굴 프로그램 아래 놓입니다. 국가가 후원하는 기업들이 가공 시설과 수출 회랑을 세워 지하 자원을 더 넓은 중국 경제를 위한 산업 역량으로 전환합니다."
 OMG_mongolian_mining_expansion: "희토류 및 석탄 확장"
 OMG_mongolian_mining_expansion_desc: "내몽골에는 세계 최대 규모의 희토류 원소 매장지와 중국 석탄 매장량의 3분의 1이 있습니다. 특별행정구 당국은 채굴 사업을 확대하고 광물 수익의 더 많은 몫을 지역 인프라와 교육에 돌리는 로열티 협정을 협상합니다."
 CHI_OMG_mongolian_mining_expansion: "희토류 및 석탄 확장"
 CHI_OMG_mongolian_mining_expansion_desc: "내몽골에는 세계 최대 규모의 희토류 원소 매장지와 중국 석탄 매장량의 3분의 1이 있습니다. 특별행정구 당국은 채굴 사업을 확대하고 광물 수익의 더 많은 몫을 지역 인프라와 교육에 돌리는 로열티 협정을 협상합니다."
 CHI_MON_diplomatic_outreach: "몽골 외교 접촉"
 CHI_MON_diplomatic_outreach_desc: "베이징은 경제적 유인책과 공유된 몽골 유산에 대한 문화적 호소를 결합하여 울란바토르에 대한 외교 구상을 시작합니다. 고위급 방문, 무역 우대 조건, 확대된 중국 문화 진출이 더 깊은 관여의 토대를 마련합니다."
 CHI_MON_economic_partnership: "초원 경제 동반자 관계"
 CHI_MON_economic_partnership_desc: "포괄적 경제 동반자 협정은 몽골에 중국 시장, 투자, 인프라 금융에 대한 우대 접근권을 부여합니다. 몽골의 광물 수출품인 구리, 석탄, 희토류는 중국이라는 주요 고객을 찾아 상당한 경제적 상호 의존을 낳습니다."
 CHI_MON_reunification_offer: "몽골 재통일 제안"
 CHI_MON_reunification_offer_desc: "중국은 몽골에 특별행정구로서 재통일하자는 공식 제안을 내놓으며, 고도의 자치, 몽골 정치 체제의 보존, 완전한 경제 통합을 약속합니다. 이 제안은 역사적 선례를 들고 중국을 몽골 번영의 자연스러운 동반자로 자리매김합니다."
 MON_CHI_economic_partnership_idea: "중-몽 경제 통합"
 MON_CHI_economic_partnership_idea_desc: "우대 무역 접근과 중국 시장 통합으로 몽골은 대중국 수출에 크게 의존하게 되었습니다. 광업 수익은 늘지만 중국 수요에 대한 구조적 의존도 함께 커집니다."
 MON_CHI_cultural_sphere_idea: "중국 문화권 내부"
 MON_CHI_cultural_sphere_idea_desc: "중국 국영 매체, 문화 프로그램, 해외 동포 네트워크가 몽골 내에서 상당한 소프트 파워 입지를 구축했습니다. 그 결과 중국의 추가적인 영향력에 대한 저항이 약해졌습니다."
 CHI_TAI_fleet_modernization: "함대 현대화 프로그램"
 CHI_TAI_fleet_modernization_desc: "인민해방군 해군은 대만 해협 작전에 맞춰 구성된 현대식 구축함, 호위함, 상륙 강습함의 조달을 가속합니다. 확대된 조선소 능력과 앞당겨진 취역 일정은 서태평양에서의 전력 투사로의 명확한 전환을 나타냅니다."
 CHI_TAI_dongfeng_program: "둥펑 미사일 프로그램"
 CHI_TAI_dongfeng_program_desc: "로켓군은 중거리 탄도 미사일 무기고를 확대하여 푸젠 해안을 따라 DF-21과 DF-26 포대를 추가 배치합니다. 이 프로그램은 베이징이 해군이나 공군 전력을 투입하지 않고도 본토에서 대만의 군사 기반시설을 위협 아래 둘 수 있게 합니다."
 CHI_TAI_air_superiority: "제공권 전략"
 CHI_TAI_air_superiority_desc: "인민해방군 공군은 대만 해협 중간선 상공에서 훈련 출격을 강화하고 푸젠의 전진 기지에 첨단 J-20 전투기를 배치합니다. 지속적인 공중 압박은 신뢰할 만한 방공망을 유지하려는 대만의 능력을 약화시킵니다."
 CHI_TAI_cyber_warfare: "사이버전 능력"
 CHI_TAI_cyber_warfare_desc: "전략지원군은 공세적 사이버 작전 부서를 확대하여 대만의 핵심 기반시설, 군 통신, 금융 체계를 교란할 능력을 개발합니다. 디지털 전선은 또 하나의 압박 축이 됩니다."
 CHI_TAI_blockade_capability: "봉쇄 준비 태세"
 CHI_TAI_blockade_capability_desc: "광범위한 모의 훈련 끝에 인민해방군 해군과 해경은 대만 주변 해상 출입 금지 구역에 대한 완전한 작전 준비 태세를 인증합니다. 잠수함 초계, 수상 경계선, 항공 감시를 단시간 내에 발동할 수 있습니다."
 CHI_TAI_one_china_enforcement: "하나의 중국 원칙 관철"
 CHI_TAI_one_china_enforcement_desc: "베이징은 대만의 남은 공식 수교국을 없애기 위한 체계적인 외교 공세를 개시합니다. 대사들은 원조 패키지와 인프라 계약을 들고 파견되며, 동맹을 바꾸기를 거부하는 국가들에는 경제적 압력이 가해집니다."
 CHI_TAI_intl_org_blockade: "국제기구 봉쇄"
 CHI_TAI_intl_org_blockade_desc: "중국은 국제연합 안전보장이사회 상임이사국 지위와 다자 기구에서 커지는 영향력을 활용하여 대만의 국제기구 참여를 막습니다. 옵서버 지위 신청은 거부권으로 막히고 비공식 참여 채널은 폐쇄됩니다."
 CHI_TAI_economic_leverage: "경제적 압박 운동"
 CHI_TAI_economic_leverage_desc: "베이징은 세계 최대 무역국이라는 지위를 무기화하여 대만을 지지하는 미국 산업과 정치적 지지층에 표적화된 경제적 압력을 가합니다. 이 운동은 상업적 의존을 이용해 미국 안보 보장 뒤에 있는 정치적 의지를 약화시킵니다."
 CHI_TAI_tourism_freeze: "관광 동결"
 CHI_TAI_tourism_freeze_desc: "베이징은 국가 계열 여행사에 대만행 모든 단체 및 개인 상품을 중단하도록 명령하여, 2008년 ECFA 시대의 개방 이후 크게 늘어난 방문객 흐름을 차단합니다. 이 조치는 본토 관광이 창출하던 외화 수입과 소비자 서비스 수익을 타이베이에서 빼앗으며, 양안 경제 통합을 강압의 수단으로 무기화합니다."
 CHI_TAI_lobby_network: "워싱턴 로비 조직망"
 CHI_TAI_lobby_network_desc: "중국과 연계된 기업 이익 집단, 싱크탱크, 정치 컨설턴트가 워싱턴에 상시적인 입지를 구축합니다. 이 조직망은 대만에 대한 의회 여론을 형성하고 무기 판매를 저지하며 베이징과의 관여를 장려하기 위해 활동합니다."
 CHI_TAI_proxy_strategy: "세계적 대리 전략"
 CHI_TAI_proxy_strategy_desc: "베이징은 미국의 군사적 관심과 정치적 자본을 대만 해협에서 멀리 돌리도록 설계된 대리 분쟁과 지역 화약고를 조장합니다. 미군을 다른 곳으로 끌어들이는 위기가 생길 때마다 워싱턴의 태평양 공약의 신뢰도가 떨어집니다."
 CHI_TAI_distract_america: "미국 주의 분산"
 CHI_TAI_distract_america_desc: "미국이 해외 군사 작전에 매여 있는 가운데 베이징은 워싱턴의 한계에 다다른 자원과 분산된 관심을 활용합니다. 미군의 해외 배치가 늘어날 때마다 대만 해협 유사시에 미국이 신속히 대응할 가능성이 줄어듭니다."
 CHI_sinicization_modifier: "£GFX_text_icon_chinese_icon 중국화 배율"
 CHI_sinicization_modifier_tt: "$CHI_sinicization_modifier$: $RIGHT|+=%1$"
 HKG_sinicization: "£GFX_text_icon_hong_kong_sar 홍콩 중국화: [?HKG_sinicization_var|Y1]"
 HKG_sinicization_var: "£GFX_text_icon_hong_kong_sar 홍콩 중국화"
 HKG_sinicization_tt: "$HKG_sinicization_var$: $RIGHT|Y1$"
 CHI_HKG_sinicization_modifier: "홍콩의 중국화"
 CHI_HKG_sinicization_modifier_desc: ""
 CHI_TIB_sinicization_modifier: "티베트의 중국화"
 CHI_TIB_sinicization_modifier_desc: "티베트의 중국화와, 그 수준이 오름에 따라 베이징이 이 지역에 부여하는 경제적 조건을 추적합니다. 중국화는 티베트 결정과 §Y$CHI_SAR_integrate_TIB$§! 갈래의 중점을 통해 증가합니다.\n§W--------------§!\n이 변동치는 §Y티베트 중국화§!가 최소 §Y95§!일 때 완료할 수 있는 §Y$CHI_SAR_integrate_TIB$§! 중점을 완료하면 §R제거§!됩니다."
 TIB_sinicization: "£GFX_text_icon_tibet_sar 티베트 중국화: [?TIB_sinicization_var|Y1]"
 TIB_sinicization_tt: "£GFX_text_icon_tibet_sar 티베트 중국화: $RIGHT|Y=1$"
 TIB_sar_development_modifier: "티베트 특별행정구 발전"
 TIB_sar_development_modifier_desc: "티베트 특별행정구의 누적 경제 발전을 추적하며, 순례 관광, 국경 간 무역, 자원 채굴 수익이 특별행정구로 유입되며 성장하는 것을 반영합니다."
 ETK_sinicization: "$ETK_sinicization_var$: [?ETK_sinicization_var|Y1]"
 ETK_sinicization_var: "£GFX_text_icon_xinjiang_sar 신장 중국화"
 ETK_sinicization_tt: "$ETK_sinicization_var$: $RIGHT|Y=1$"
 CHI_ETK_sinicization_modifier: "신장의 중국화"
 CHI_ETK_sinicization_modifier_desc: "신장의 중국화와, 그 수준이 오름에 따라 베이징이 이 지역에 부여하는 경제적 조건을 추적합니다. 중국화는 신장 결정과 §Y$CHI_SAR_integrate_ETK$§! 갈래의 중점을 통해 증가합니다.\n§W--------------§!\n이 변동치는 §Y신장 중국화§!가 최소 §Y95§!일 때 완료할 수 있는 §Y$CHI_SAR_integrate_ETK$§! 중점을 완료하면 §R제거§!됩니다."
 MAC_sinicization: "£GFX_text_icon_macau_sar 마카오 중국화: [?MAC_sinicization_var|Y1]"
 MAC_sinicization_var: "£GFX_text_icon_macau_sar 마카오 중국화"
 MAC_sinicization_tt: "$MAC_sinicization_var$: $RIGHT|Y=1$"
 CHI_MAC_sinicization_modifier: "마카오의 중국화"
 CHI_MAC_sinicization_modifier_desc: ""
 OMG_sinicization: "£GFX_text_icon_mongolia_sar 내몽골 중국화: [?OMG_sinicization_var|Y1]"
 OMG_sinicization_tt: "£GFX_text_icon_mongolia_sar 내몽골 중국화: $RIGHT|Y=1$"
 CHI_OMG_sinicization_modifier: "내몽골의 중국화"
 CHI_OMG_sinicization_modifier_desc: "내몽골의 중국화와, 그 수준이 오름에 따라 베이징이 이 지역에 부여하는 경제적 조건을 추적합니다. 중국화는 내몽골 결정과 §Y$CHI_SAR_integrate_OMG$§! 갈래의 중점을 통해 증가합니다.\n§W--------------§!\n이 변동치는 §Y내몽골 중국화§!가 최소 §Y90§!일 때 완료할 수 있는 §Y$CHI_SAR_integrate_OMG$§! 중점을 완료하면 §R제거§!됩니다."
 CHI_TAI_trust: "[CHI.GetFlag]§H[CHI.GetAdjectiveCap]-[TAI.GetAdjectiveCap] 신뢰§! [TAI.GetFlag]"
 CHI_TAI_trust_tt: "$CHI_TAI_trust$: $RIGHT|Y=1$"
 CHI_taiwan_us_support: "§Y[USA.GetFlag][USA.GetAdjectiveCap] 지원§! - §Y[TAI.GetNameWithFlag]§!"
 CHI_taiwan_us_support_tt: "$CHI_taiwan_us_support$: $RIGHT|-=0$"
 CHI_taiwan_strait_tension: "[TAI.GetNameWithFlag] 해협 긴장"
 CHI_taiwan_strait_tension_tt: "$CHI_taiwan_strait_tension$: $RIGHT|+=0$"
 CHI_taiwan_recognition_count: "[TAI.GetNameWithFlag] 수교국"
 CHI_taiwan_recognition_count_tt: "$CHI_taiwan_recognition_count$: $RIGHT|-=0$"
 CHI_SAR_MIO_share_tt: "모든 특별행정구 괴뢰국이 중국의 군수 산업 조직을 이용할 수 있게 됩니다."
 CHI_tai_pressure_economic_tt: "중국은 무역 의존 관계를 활용하여 워싱턴이 대만 지원을 줄이도록 압박합니다. 미국은 대응 방식을 결정해야 합니다."
 CHI_tai_pressure_diplomatic_tt: "중국은 워싱턴이 대만과 거리를 두도록 설득하기 위해 절제된 외교 채널을 엽니다."
 CHI_pressure_derecognize_TAI_tt: "중국은 경제적, 외교적 압력을 가합니다. 대상국이 기한 내에 대만 승인을 철회하지 않으면 중국은 무역 금수를 부과합니다."
 TAI_reduced_us_support: "약화된 미국의 군사 지원"
 TAI_reduced_us_support_desc: "중국이 워싱턴에 가한 압력에 따라 미국은 대만에 대한 무기 인도와 군사 협력을 축소했습니다. 미국 장비와 교리에 의존하는 부대의 준비 태세와 사기가 낮아졌습니다."
 TAI_isolated_from_us: "워싱턴에 버림받음"
 TAI_isolated_from_us_desc: "미국은 지속적인 중국의 압력 속에서 대만에 대한 군사적, 외교적 지원을 공식적으로 철회했습니다. 군은 주된 안보 보증자를 잃어 방위 능력과 민간의 신뢰가 심각하게 훼손되었습니다."
 CHI_TAI_shared_modifier: "양안 관계"
 CHI_TAI_shared_modifier_desc: "대만 해협을 사이에 둔 경제적, 정치적 상호 의존의 동적 지표입니다. 관계가 가까워지면 안정도와 민주주의 성향이 오르고 무역 관계, 공장 효율, 연구 속도, 건설 산출이 향상됩니다. 소원해지면 대신 공산주의 성향, 내부 정치적 압력, 해군 습격 능력이 커집니다."
 CHI_SAR_network_modifier: "하나의 중국 체제"
 CHI_SAR_network_modifier_desc: ""
 CHI_TAI_air_dominance: "해협 제공권"
 CHI_TAI_air_dominance_desc: "대만 해협 상공에서의 인민해방군 공군 작전은 대만의 방어망에 지속적인 공중 압박을 가하여 영공 통제권을 다툴 능력을 떨어뜨렸습니다."
 CHI_TAI_naval_modernization_idea: "해군 현대화"
 CHI_TAI_naval_modernization_idea_desc: "인민해방군 해군의 가속화된 조달 프로그램은 대만 해협에서 지속적인 작전을 수행할 수 있는 현대식 함대를 인도했습니다."
 TAI_blockade_economic_crisis: "봉쇄 경제 위기"
 TAI_blockade_economic_crisis_desc: "중국의 해상 봉쇄가 대만의 해상 무역로를 끊어 연료, 원자재, 소비재가 심각하게 부족해졌습니다. 산업 생산이 붕괴했습니다."
 TAI_self_sufficiency: "자급자족 조치"
 TAI_self_sufficiency_desc: "국내 생산 능력을 키우고 수입품 의존도를 줄이기 위한 비상 조치가 효과를 내기 시작하여 봉쇄의 영향을 부분적으로 상쇄하고 있습니다."
 TAI_cyber_sabotage: "사이버 파괴 공작"
 TAI_cyber_sabotage_desc: "중국의 조직적인 사이버 작전이 대만 전역의 핵심 기반시설, 군 통신, 금융 체계를 교란했습니다."
 TAI_blockade_partial: "해상 교란"
 TAI_blockade_partial_desc: "중국이 선포한 해상 안보 구역이 상업 해운을 교란하고 있으며, 대만 항구로 향하는 선박의 보험료를 끌어올리고 있습니다."
 TAI_emergency_situation: "비상사태"
 TAI_emergency_situation_desc: "대만은 중국의 봉쇄에 대응하여 비상사태를 선포했습니다. 징병이 확대되고 민방위 조치가 발동되었지만 경제적 타격은 심각합니다."
 CHI_TAI_tourism_ban: "양안 관광 동결"
 CHI_TAI_tourism_ban_desc: "중화인민공화국은 대만으로 가는 단체 및 개인 해외 관광을 중단하여, 2008년 양안 여행이 자유화된 이후 형성된 방문객 흐름을 차단했습니다. 2019년 베이징은 이 금지를 개인 방문 허가증까지 확대하여 연간 수십만 명의 여행객을 막았습니다. 이 조치는 대만의 숙박, 소매, 서비스 부문에 직접적인 타격을 입히는 동시에 경제적 상호 의존을 강압 수단으로 사용하겠다는 베이징의 의지를 드러냅니다."
 CHI_crossstrait_operations: "양안 작전 준비 태세"
 CHI_crossstrait_operations_desc: "인민해방군은 대만 해협을 가로지르는 상륙 및 공수 합동 작전을 위한 완전한 작전 준비 태세를 갖추었습니다."
 CHI_TAI_amphibious_mastery: "상륙 강습 교리"
 CHI_TAI_amphibious_mastery_desc: "인민해방군 해병대 부대는 대만 해협에서의 집중 훈련을 통해 제병협동 상륙 작전에서 높은 수준의 숙련도를 달성했습니다."
 CHI_TAI_military_buildup_idea: "양안 군비 증강"
 CHI_TAI_military_buildup_idea_desc: "인민해방군은 대만 해협 유사시에 대비하여 푸젠 해안을 따라 상당한 지상, 해상, 공중 전력을 집결시켰습니다."
 china_sar.027.t: "대만 문제: 첫 수"
 china_sar.027.d: "국무원은 대만에 대한 미국의 지지를 약화시키기 위한 지속적인 운동을 승인했습니다. 경제적 압박, 외교적 고립, 군사적 신호 모두 사용 가능한 수단입니다. 문제는 얼마나 강하게, 그리고 얼마나 빠르게 밀어붙일 것인가입니다."
 china_sar.027.a: "최대한의 경제적 압박을 가한다. 대만을 지원하는 비용을 감당할 수 없게 만들 것이다."
 china_sar.027.b: "절제된 외교적 접근으로 시작한다. 인내가 대결보다 더 나은 결과를 낳는다."
 china_sar.028.t: "선택지를 저울질하는 워싱턴"
 china_sar.028.d: "베이징의 압박 운동은 워싱턴에 곤란한 시기에 도달했습니다. 행정부는 서로 경쟁하는 파벌에 직면해 있습니다. 대만 공약의 확고한 재확인을 요구하는 강경파와, 중국을 적대시했을 때의 경제적 결과를 우려하는 실용주의자들입니다."
 china_sar.028.a: "대만에 대한 공약을 재확인한다. 중국의 압박은 우리의 결의를 더욱 굳힐 뿐이다."
 china_sar.028.b: "중국의 우려를 인정한다. 대만을 버리지 않으면서 긴장을 낮추는 방식을 찾을 수 있다."
 china_sar.029.t: "확전: 판돈을 올린 중국"
 china_sar.029.d: "워싱턴의 거부는 중난하이에서 좋지 않게 받아들여졌습니다. 지도부는 반항에는 대가가 따른다는 것을 보여 주어야 한다는 압박을 받고 있습니다. 미국의 대만 정책에 맞서는 외교 연합을 구축하거나, 해협에서의 훈련을 통해 군사적 결의를 내보이는 두 가지 선택지가 놓여 있습니다."
 china_sar.029.a: "국제 연합을 구축한다. 외교적 고립이 대결보다 더 지속 가능하다."
 china_sar.029.b: "대만 해협 훈련을 실시한다. 워싱턴은 우리 공약의 군사적 차원을 이해해야 한다."
 china_sar.030.t: "워싱턴의 부분적 양보 제안"
 china_sar.030.d: "내부 논의 끝에 행정부는 대만에 대한 무기 판매를 완전히 중단하지는 않되 줄일 의향이 있음을 시사했습니다. 이 제안은 안정을 위한 제스처로 포장되어 있습니다. 베이징은 부분적 성과를 받아들일지, 완전한 철수를 계속 요구할지 결정해야 합니다."
 china_sar.030.a: "양보를 받아들인다. 부분적 성과도 성과다."
 china_sar.030.b: "제안을 거부한다. 지원의 완전한 철회만이 유일하게 받아들일 수 있는 결과다."
 china_sar.031.t: "기로에 선 미국"
 china_sar.031.d: "중국의 지속적인 압박 운동은 워싱턴에 최종 결정을 강요했습니다. 정보 당국은 추가 양보가 인도-태평양 전역에서 베이징을 부추길 위험이 있다고 경고합니다. 그러나 대결의 경제적 비용 또한 현실입니다. 행정부는 선택해야 합니다."
 china_sar.031.a: "대만에 대한 공식 지원을 철회한다. 베이징과의 관계는 희생하기에는 너무나 중요하다."
 china_sar.031.b: "대만에 대한 공약을 전면 재확인한다. 우리는 협박에 굴복해 버리지 않을 것이다."
 china_sar.032.t: "대만에서 한 발 물러선 워싱턴"
 china_sar.032.d: "조용하지만 중대한 전환으로, 미국은 대만의 별도 지위에 대한 적극적인 군사적, 외교적 후원을 더 이상 제공하지 않겠다는 신호를 보냈습니다. 발표는 관료적 언어로 포장되어 있지만 그 전략적 의미는 분명합니다. 대만은 홀로 서 있습니다."
 china_sar.032.a: "역사적인 성과다. 통일로 가는 길이 이제 열렸다."
 china_sar.033.t: "공약을 재확인한 워싱턴"
 china_sar.033.d: "미국은 중국의 압박 운동을 거부하고 대만의 안보에 대한 공약을 공개적으로 재확인했습니다. 행정부는 타이베이에 대한 새로운 무기 패키지를 발표하고 일본 및 오스트레일리아와 긴급 협의를 소집했습니다. 베이징의 운동은 실패했으며 워싱턴 내 반대 여론을 오히려 굳혔습니다."
 china_sar.033.a: "차질이지만 패배는 아니다. 접근 방식을 재평가할 것이다."
 china_sar.001.t: "제안: 양안 서비스무역협정"
 china_sar.001.d: "베이징은 양측의 주요 서비스 부문을 더 자유로운 무역과 투자로 개방하는 양안 서비스무역협정을 제안했습니다. 이 제안은 본토 기업에 대만의 은행, 의료, 소매 부문에 대한 접근권을 부여할 것입니다. 지지자들은 경제 통합을 심화할 것이라고 주장하지만, 비판자들은 베이징에 대만 경제에 대한 구조적 영향력을 넘겨주는 것이라고 경고합니다."
 china_sar.001.a: "협정에 서명한다. 경제 통합은 우리의 장기적 이익에 부합한다."
 china_sar.001.b: "협정을 거부한다. 양보가 너무 크고 감독은 너무 약하다."
 china_sar.002.t: "양안 기업 네트워크"
 china_sar.002.d: "친베이징 기업 네트워크가 본토 자본의 지원과 불투명한 투자 협정들의 도움으로 대만의 금융 및 언론 부문으로 확장되었습니다. 정부는 상업과 정치의 경계를 흐리는 이 커져 가는 영향력에 어떻게 대응할지 결정해야 합니다."
 china_sar.002.a: "양안 교류를 환영한다. 경제적 유대는 안정의 토대다."
 china_sar.002.b: "네트워크를 감시하되 제한하지는 않는다. 과잉 대응은 정당한 무역에 해가 될 것이다."
 china_sar.002.c: "민감한 부문에서 본토와 연계된 투자에 제한을 부과한다."
 china_sar.003.t: "92 공식 문제"
 china_sar.003.d: "중국 본토는 양안 회담의 외교적 토대로 1992년 공식의 복원을 공식 제안했습니다. 이 공식은 의도적으로 모호합니다. 베이징은 이를 하나의 중국 아래 통일이라는 목표에 대한 약속으로 해석하는 반면, 국민당은 전통적으로 '하나의 중국, 각자 표현'이라는 공식으로 받아들였습니다. 민진당은 이를 오랫동안 정치적 함정이라며 거부해 왔습니다. 대만은 답해야 합니다."
 china_sar.003.a: "공식을 받아들인다. '하나의 중국, 각자 표현'은 우리의 입장을 지키면서 대화의 길을 연다."
 china_sar.003.b: "공식을 명시적으로 지지하지 않고 대화의 정신만 인정한다. 우리는 정치적 약속이 아니라 평화를 추구한다."
 china_sar.003.c: "공식을 거부한다. '하나의 중국'의 수용을 암시하는 어떤 공식도 우리의 주권적 지위를 훼손한다."
 china_sar.004.t: "대만에서 독립 지지 세력 승리"
 china_sar.004.d: "독립 지지 진영이 대만 선거에서 과반을 차지했습니다. 출범하는 정부는 92 공식을 받아들이지 않을 것이며 대만의 국제적 지위에 대해 보다 적극적인 노선을 추구할 의도임을 분명히 했습니다. 양안 관계는 냉각기에 접어듭니다."
 china_sar.004.a: "차질이다. 타이베이에 대한 접근 방식을 재평가할 것이다."
 china_sar.005.t: "베이징의 간섭 공작 폭로"
 china_sar.005.d: "대만 국가안전국은 대리인을 통한 언론 투자, 관여 지지 정치인에 대한 자금 지원, 정치적 메시지를 전달하는 데 사용되는 기업 네트워크 육성 등 국내 정치에 영향을 미치려는 중화인민공화국 연계 공작의 증거를 적발했습니다. 조사 결과는 언론에 유출되어 대중의 분노를 일으키고 있습니다."
 china_sar.005.a: "연루된 문화 담당관들을 추방하고 공식 항의한다. 우리는 외국의 민주주의 조작을 용납하지 않을 것이다."
 china_sar.006.t: "대만의 중국 관리 추방"
 china_sar.006.d: "타이베이는 베이징의 정치적 영향력 공작이 폭로된 후 여러 명의 문화 및 상무 담당관을 공식 추방했습니다. 이 조치는 대만의 민주주의 동맹국들의 박수를 받았고 베이징 외교부의 날 선 공개 비난을 불렀습니다."
 china_sar.006.a: "외교적 비용을 감수한다. 공작의 노출로 우리의 작업이 후퇴했지만 더 큰 전략은 여전히 건재하다."
 china_sar.035.t: "베이징의 문화적 접근"
 china_sar.035.d: "중국과 내몽골은 몽골 내에서 공유된 몽골 유산을 내세우면서 여론을 더 긴밀한 통합 쪽으로 이끄는 조율된 문화 영향력 운동을 시작했습니다. 베이징은 이를 문화 교류라고 규정하지만 그 함의는 분명히 정치적입니다."
 china_sar.035.a: "이를 인정하는 수밖에 없다."
 china_sar.036.t: "내몽골과의 연합?"
 china_sar.036.d: "베이징과 후허하오터의 공식 대표단이 울란바토르에 도착하여 공식 제안을 내놓았습니다. 몽골은 일국양제 틀 아래 특별행정구로서 중화인민공화국에 가입하도록 초청받았습니다. 이 제안에는 경제적 보장과 문화적 자치의 약속이 따르지만, 그 뒤에는 중국의 영향력이라는 막대한 무게도 함께 있습니다."
 china_sar.036.a: "제안을 받아들인다."
 china_sar.036.b: "몽골은 독립을 유지할 것이다."
 china_sar.037.t: "몽골의 재통일 거부"
 china_sar.037.d: "울란바토르는 재통일 제안을 공식 거부했습니다. 몽골 정부는 국가 주권과 대중의 반대를 이유로 들었지만 외교 채널은 열려 있습니다. 베이징은 이 결정을 인정하되 제안이 유효함을 분명히 합니다."
 china_sar.037.a: "다시 시도할 것이다."
 china_sar.007.t: "해협 상공의 위험한 접근"
 china_sar.007.d: "인민해방군 전투기 한 대가 타이완 해협 중간선 인근에서 활동하던 외국 군용기를 공격적으로 요격했습니다. 조종석 카메라에 포착된 이 장면에는 중국 조종사가 표적 항공기와 불과 몇 미터 거리를 두고 지나가는 모습이 담겨 있습니다. 국제 언론은 대응을 요구하고 있습니다."
 china_sar.007.a: "개입을 부인하고 긴장을 완화한다."
 china_sar.007.b: "공식적으로 침묵을 유지한다."
 china_sar.007.c: "합법적인 단속 행위라고 공개적으로 옹호한다."
 china_sar.008.t: "타이완 해협의 함정 충돌"
 china_sar.008.d: "인민해방군 해군 구축함과 외국 군함이 타이완 해협에서 근접 조우 중에 충돌했습니다. 양측 함정 모두 손상을 입었습니다. 이 사건은 국제적 비난을 불러일으켰으며 베이징을 곤란한 처지에 빠뜨렸습니다."
 china_sar.008.a: "무모한 항해를 한 상대측을 비난한다."
 china_sar.008.b: "성명을 내지 않고 이야기가 잊히도록 둔다."
 china_sar.008.c: "비공식 경로를 통해 사적으로 사과한다."
 china_sar.009.t: "로켓 시험: 지역의 침묵"
 china_sar.009.d: "인민해방군 로켓군이 타이완 해협 상공에서 실시한 탄도미사일 시험에 대해 국제사회는 조용한 반응을 보였습니다. 워싱턴은 형식적인 우려 성명을 발표했을 뿐 구체적인 조치는 취하지 않았습니다. 미국의 의미 있는 반응이 없다는 사실은 지역 전체에 강력한 신호를 보냅니다."
 china_sar.009.a: "우리의 결의는 그들의 침묵보다 더 크게 말한다."
 china_sar.010.t: "로켓 시험: 미국의 반격"
 china_sar.010.d: "인민해방군 로켓군의 타이완 인근 미사일 시험은 참담한 역효과를 낳았습니다. 워싱턴은 항모 타격단을 해협에 투입하도록 명령하고 타이베이를 위한 긴급 무기 지원 패키지를 발표했습니다. 국제 여론은 베이징에 맞서 결집했습니다."
 china_sar.010.a: "이 좌절이 우리를 단념시키지는 못할 것이다."
 china_sar.011.t: "고립된 타이완"
 china_sar.011.d: "타이완의 공식 수교국은 소수의 작은 나라들로 줄어들었습니다. 의미 있는 국제적 승인이 없으면 타이베이의 주권 주장은 점점 더 불안한 토대 위에 놓입니다. 이러한 고립은 상징적이면서도 실질적입니다."
 china_sar.011.a: "반란 지방에 대한 포위망이 조여든다."
 china_sar.012.t: "의회 무기 판매 표결"
 china_sar.012.d: "미국 의회는 타이완에 대한 대규모 무기 판매 패키지를 논의하고 있습니다. 워싱턴의 우리 로비 네트워크는 표결에 영향을 미칠 기회를 가지고 있으나, 우리의 개입이 노출될 경우 위험이 따릅니다."
 china_sar.012.a: "로비 네트워크를 가동하여 판매를 저지한다."
 china_sar.012.b: "외교 경로를 통해 경제적 위협을 가한다."
 china_sar.012.c: "간섭 없이 절차가 진행되도록 둔다."
 china_sar.013.t: "데탕트를 옹호하는 경제인 협의회"
 china_sar.013.d: "미중 기업 협의회는 워싱턴이 타이완 안보 공약보다 상업적 안정을 우선시해야 한다고 촉구하는 보고서를 발간했습니다. 우리의 경제 관여 노력이 반영된 이 보고서는 정책 결정 집단에서 호응을 얻고 있습니다."
 china_sar.013.a: "확인했다."
 china_sar.014.t: "선거 개입 폭로"
 china_sar.014.d: "미국 정보기관들은 정치 영향력 공작이 중국 국가 행위자의 소행이라고 공개적으로 지목했습니다. 이 스캔들은 의회의 초당적 분노와 일련의 징벌적 조치를 불러일으켰습니다. 워싱턴에 대한 우리의 전략적 입지는 심각한 타격을 입었습니다."
 china_sar.014.a: "값비싼 오판이었다."
 china_sar.015.t: "긴급 안보 회의"
 china_sar.015.d: "중국의 타이완 해협 봉쇄 모의 훈련은 국가안전보장회의의 긴급 소집을 불러왔습니다. 군 지휘관들과 각료들은 베이징의 고조되는 압박에 대한 적절한 대응을 논의하고 있습니다."
 china_sar.015.a: "해안을 따라 군사 대비 태세를 강화한다."
 china_sar.015.b: "국제사회에 지원을 호소한다."
 china_sar.016.t: "비상사태"
 china_sar.016.d: "부분 봉쇄가 두 달째 이어지면서 무역이 교란되고 연료와 핵심 물자가 부족해지고 있습니다. 정부는 공식 비상사태를 선포하고 군을 전면 경계 태세에 두라는 압박을 점점 더 크게 받고 있습니다."
 china_sar.016.a: "비상사태를 선포한다."
 china_sar.016.b: "베이징과 외교적 해결을 모색한다."
 china_sar.017.t: "항복의 문제"
 china_sar.017.d: "전면 해상 봉쇄는 우리 경제를 마비시키고 보급선을 끊어 놓았습니다. 미국의 지원이 사실상 철회된 가운데, 정부 내부에서는 베이징이 내세우는 조건으로 협상을 시작할 가능성이 조용히 제기되고 있습니다."
 china_sar.017.a: "우리는 결코 항복하지 않는다. 계속 싸운다."
 china_sar.017.b: "베이징과 협상을 시작한다."
 china_sar.018.t: "타이완의 협상 개시"
 china_sar.018.d: "타이베이는 통일 조건을 논의할 권한을 가진 대표단을 베이징에 파견했습니다. 봉쇄, 경제 붕괴, 미국 지원의 철회로 인해 이 섬에는 실행 가능한 대안이 남아 있지 않습니다. 역사적인 한 장이 막을 내리고 있습니다."
 china_sar.018.a: "조국의 통일을 받아들인다."
 china_sar.019.t: "타이완 해협 위기"
 china_sar.019.d: "타이완 해협의 긴장은 임계점에 도달했습니다. 양측 군대는 최고 대기 태세에 있으며 단 한 번의 오판이 전면적인 충돌을 촉발할 수 있습니다. 정치국 상무위원회는 다음 단계를 결정하기 위해 긴급 회의를 소집합니다."
 china_sar.019.a: "벼랑 끝에서 물러선다. 긴장을 완화한다."
 china_sar.019.b: "밀어붙인다. 공식 전쟁 목표를 선포한다."
 china_sar.020.t: "베이징의 최후통첩"
 china_sar.020.d: "베이징은 중화인민공화국 아래의 통일을 수락하라고 요구하는 공식 최후통첩을 전달했습니다. 불응할 경우 군사 행동이 뒤따를 것입니다. 정부는 저항할지 협상할지 결정해야 합니다."
 china_sar.020.a: "최후통첩을 거부한다. 전쟁을 준비한다."
 china_sar.020.b: "조건을 수락한다. 투쟁은 끝났다."
 china_sar.021.t: "타이완의 통일 거부"
 china_sar.021.d: "타이베이는 우리의 최후통첩을 공식적으로 거부했습니다. 타이완 정부는 강제 통일 시도에 저항하겠다는 의사를 선언하고 군대를 동원하고 있습니다. 평화적 해결의 길은 닫혔습니다."
 china_sar.021.a: "좋다. 전쟁을 준비한다."
 china_sar.022.t: "타이완의 통일 수락"
 china_sar.022.d: "타이베이는 통일 조건을 수락했습니다. 중화민국은 해체되고 그 영토는 중화인민공화국에 통합될 것입니다. 수십 년에 걸친 양안 분단이 끝나가고 있습니다."
 china_sar.022.a: "조국은 다시 하나가 되었다."
 china_sar.023.t: "중국의 외교적 압박"
 china_sar.023.d: "베이징은 우리에게 타이완에 대한 승인을 철회하라고 공식 요구했습니다. 중국은 응할 경우 경제적 혜택을 제시하고 거부할 경우 제재를 위협하고 있습니다. 타이베이에 대한 우리의 지속적인 승인은 비용이 큰 외교적 입장이 되었습니다."
 china_sar.023.a: "응한다. 타이완에 대한 승인을 철회한다."
 china_sar.023.b: "거부한다. 우리는 약속을 지킨다."
 china_sar.024.t: "해협에서의 상륙 훈련"
 china_sar.024.d: "인민해방군 해병대는 요새화된 해안선에 대한 해안 강습을 모의한 타이완 해협 최대 규모의 상륙 훈련을 실시했습니다. 국영 매체를 통해 방영된 이 훈련은 타이베이와 워싱턴 모두에 분명한 신호를 보냅니다."
 china_sar.024.a: "세계가 주목했다."
 china_sar.025.t: "항행의 자유 대치"
 china_sar.025.d: "미국 해군은 타이완 인근에 우리가 선포한 해상 안보 구역을 통과하도록 군함 한 척을 보냈습니다. 이 함정은 인민해방군 해군이 대응하도록 도발하며 공개적으로 자신의 존재를 알리고 있습니다. 우리 병력은 미국 함정을 추적하고 있습니다."
 china_sar.025.a: "통과를 허용한다. 직접적인 대치를 피한다."
 china_sar.025.b: "미국 함정을 미행하며 도전한다."
 china_sar.026.t: "미국 지도부의 변화"
 china_sar.026.d: "미국 대통령의 교체로 우리의 타이완 전략을 둘러싼 정치 지형이 바뀌었습니다. 양안 관계에 대한 새 행정부의 입장은 타이베이에 대한 미국의 지원 수준에 영향을 미칠 것입니다."
 china_sar.026.a: "그에 맞춰 우리 전략을 조정한다."
 USA_taiwan_defense_category: "타이완 방어"
 CHI_TAI_amphibious_exercise: "해협에서의 상륙 훈련"
 CHI_TAI_amphibious_exercise_desc: "군사 능력을 과시하고 타이베이를 압박하기 위해 타이완 해협에서 대규모 상륙 훈련을 명령합니다."
 CHI_TAI_adiz_incursion: "방공식별구역 침범"
 CHI_TAI_adiz_incursion_desc: "인민해방군 공군 전투기를 타이완의 방공식별구역에 진입시켜 대응 시간을 시험하고 타이베이의 자신감을 약화시킵니다."
 CHI_TAI_rocket_test: "탄도미사일 시험"
 CHI_TAI_rocket_test_desc: "타이완 해협 상공에서 탄도미사일 시험을 실시합니다. 그 반응은 타이완 방어에 대한 미국의 현재 공약 수준에 따라 달라집니다."
 CHI_TAI_grey_zone_ops: "회색지대 작전"
 CHI_TAI_grey_zone_ops_desc: "해안경비대 침범, 어선단 배치, 전자전 탐색 등 타이완 수역 인근에서 저강도 도발을 실시합니다."
 CHI_TAI_blockade_simulation: "봉쇄 모의 훈련"
 CHI_TAI_blockade_simulation_desc: "타이완 전면 봉쇄를 모의하는 대규모 해군 훈련을 실시하여 군수 지원을 시험하고 섬의 보급선을 차단할 능력을 과시합니다."
 CHI_TAI_cyberattack: "타이완에 대한 사이버 공격"
 CHI_TAI_cyberattack_desc: "타이완의 전력망, 금융 시스템, 군 통신망을 겨냥한 조직적인 사이버 작전을 개시합니다."
 CHI_TAI_shadow_carrier: "미국 항모 전단 미행"
 CHI_TAI_shadow_carrier_desc: "타이완 해협 인근에서 활동하는 미국 항모 타격단을 미행하도록 잠수함과 수상 전투함을 배치합니다."
 CHI_TAI_intercept_aircraft: "미국 정찰기 요격"
 CHI_TAI_intercept_aircraft_desc: "해협 인근에서 활동하는 미국 정찰기를 요격하고 공격적으로 근접 추적하도록 전투기를 긴급 발진시킵니다."
 CHI_TAI_un_protest: "무기 판매에 대한 UN 항의"
 CHI_TAI_un_protest_desc: "미국의 타이완 무기 판매에 대해 국제연합에 공식 항의를 제기하여 워싱턴에 국제적 압박을 가합니다."
 CHI_TAI_maritime_zone: "해상 안보 구역 선포"
 CHI_TAI_maritime_zone_desc: "타이완의 주요 접근로 주변에 해상 안보 구역을 선포하여 상선을 차단하고 검문할 법적 명분을 마련합니다."
 CHI_TAI_partial_blockade: "부분 해상 봉쇄"
 CHI_TAI_partial_blockade_desc: "해상 안보 구역을 부분 해상 봉쇄로 격상하여 타이완으로 향하는 연료와 원자재 수송을 제한합니다."
 CHI_TAI_full_blockade: "전면 해상 봉쇄"
 CHI_TAI_full_blockade_desc: "타이완 주변에 완전한 해상 봉쇄를 시행하여 섬으로 향하는 모든 해상 교역과 보급선을 차단합니다."
 CHI_TAI_influence_us_election: "미국 선거에 영향력 행사"
 CHI_TAI_influence_us_election_desc: "타이완에 대한 베이징의 입장에 우호적인 후보를 밀어주기 위해 미국에서 은밀한 정치 영향력 공작을 전개합니다."
 CHI_TAI_support_houthis: "후티 작전 지원"
 CHI_TAI_support_houthis_desc: "예멘의 후티 세력에 은밀한 물자를 지원하여 미군 자원을 태평양에서 분산시킬 안보 위기를 조성합니다."
 CHI_TAI_arm_iran: "이란에 대한 비밀 무기 공급"
 CHI_TAI_arm_iran_desc: "중개자를 통해 이란에 첨단 군사 기술을 유입시켜 중동의 미군에 대한 압박을 높입니다."
 CHI_TAI_scs_provocations: "남중국해 도발"
 CHI_TAI_scs_provocations_desc: "섬의 군사 기지화, 경쟁 영유권 주장국에 대한 해안경비대의 괴롭힘, 방공 구역 확대를 통해 남중국해 분쟁 지형물에 대한 중국의 주권을 주장합니다. 이러한 행동은 미국이 ASEAN(아세안) 파트너들을 안심시키기 위해 해군 전력을 돌리도록 강제합니다."
 CHI_TAI_nk_provocations: "북한의 도발 부추기기"
 CHI_TAI_nk_provocations_desc: "한반도에서의 미사일 시험과 군사적 도발이 용인될 것이라는 신호를 평양에 보내, 미국이 타이완 전역에서 병력을 재배치하도록 강제합니다."
 CHI_TAI_middleeast_diversion: "중동 전략적 관여"
 CHI_TAI_middleeast_diversion_desc: "중동 전역에서 군사 및 경제 협력 관계를 심화하여 베이징에 대한 지역의 의존도를 높이는 한편, 미국의 관심을 인도-태평양 전역에서 멀어지게 합니다."
 CHI_TAI_support_russia: "러시아 작전 지원"
 CHI_TAI_support_russia_desc: "러시아의 군사 작전에 경제 및 병참 지원을 제공하여 미국의 관심과 자원을 소모시키는 분쟁을 장기화합니다."
 CHI_TAI_strait_naval_exercise: "타이완 해협 해군 훈련"
 CHI_TAI_strait_naval_exercise_desc: "타이완 해협에서 상륙 강습 작전과 접근 거부 전투를 연습하는 대규모 해군 훈련을 실시합니다. 이 훈련은 해군 대비 태세를 향상시키지만 국제적 비난을 불러일으킬 것입니다."
 CHI_TAI_fund_us_opposition: "친중 성향 미국 옹호 활동 자금 지원"
 CHI_TAI_fund_us_opposition_desc: "타이완에 대한 베이징의 입장에 우호적인 미국의 정치 단체, 싱크탱크, 언론사를 지원하기 위해 중개자를 통해 자원을 투입합니다. 발각되면 심각한 반발을 부를 것입니다."
 CHI_TAI_exploit_us_commitments: "미국의 군사적 과잉 확장 이용"
 CHI_TAI_exploit_us_commitments_desc: "미국이 해외에서 군사 작전을 수행하는 동안 타이완에 대한 외교적, 군사적 압박을 강화합니다. 미군은 전력이 분산되어 태평양에 신뢰할 만한 증원을 할 수 없습니다."
 USA_TAI_send_carrier: "타이완 해협에 항모 파견"
 USA_TAI_send_carrier_desc: "무력 과시로서 항모 타격단이 타이완 해협을 통과하도록 명령하여 지역 안정에 대한 미국의 공약을 알립니다."
 USA_TAI_recon_flight: "해협 상공 정찰 비행"
 USA_TAI_recon_flight_desc: "중국의 방공식별구역 침범에 이어 타이완 해협의 인민해방군 활동을 감시하도록 감시 항공기를 파견합니다."
 USA_TAI_arm_taiwan: "타이완 긴급 무기 지원 패키지"
 USA_TAI_arm_taiwan_desc: "중국의 고조되는 봉쇄 준비에 대응하여 타이완 군을 위한 긴급 무기 판매 패키지를 승인합니다."
 USA_TAI_fon_operation: "항행의 자유 작전"
 USA_TAI_fon_operation_desc: "중국이 선포한 해상 안보 구역으로 군함을 통과시켜 항행의 자유를 주장하고 베이징의 주장에 도전합니다."
 USA_TAI_rimpac_exercise: "림팩 해군 훈련"
 USA_TAI_rimpac_exercise_desc: "세계 최대 규모의 국제 해상 전투 훈련인 연례 환태평양 해군 훈련에 타이완을 초청하여 지역 파트너에 대한 미국의 공약을 알립니다."
 CHI_SAR_decisions_category: "하나의 중국 전략"
 CHI_SAR_decisions_category_desc: "\n£GFX_CHI_commission_2\n\n\n\n§Y하나의 중국 전략§!은 영유권을 주장하는 모든 영토를 단일한 중국 국가 아래 통합하려는 베이징의 정책입니다. 정치적 압박, 경제 개발, 행정적 통제를 결합하여 각 지역이 점차 중앙정부와 보조를 맞추게 됩니다.\n\n이 과정은 서로 다른 경로를 따를 수 있습니다. §Y중국화§!가 심화되면 직접 통제와 통합이 강화되며, 자치 수준이 높은 방식은 중앙의 권한을 희생하는 대신 지역 안정과 경제적 잠재력을 우선시합니다.\n\n이러한 접근 사이의 균형이 국가의 장기적 통일을 좌우하며, §Y타이완§! 문제는 국제적 승인, 외국의 지원, 양안 긴장에 따라 계속 형성됩니다.\n\n§Y중국의 특별행정구§!\n$HKG_sinicization$\n$MAC_sinicization$\n$TIB_sinicization$\n$ETK_sinicization$\n$OMG_sinicization$\n\n$CHI_TAI_trust_display$\n$CHI_taiwan_us_support_display$\n$CHI_taiwan_strait_tension_display$\n$CHI_taiwan_recognition_count_display$\n$uighur_threat_display$"
 CHI_pressure_derecognize_TAI: "[From.GetName]에 타이완 승인 철회 압박"
 CHI_pressure_derecognize_TAI_desc: "베이징은 타이완에 대한 국제적 승인을 줄이기 위해 지속적인 외교 공세를 펼치고 있습니다. [From.GetName]은(는) 현재 타이베이와 공식 관계를 유지하고 있습니다. 경제적 혜택과 제재 위협을 결합하면 입장 변화를 이끌어내기에 충분할 수 있습니다."
 CHI_establish_education_centres: "신장에 직업기능교육센터 설립"
 CHI_establish_education_centres_desc: ""
 CHI_MON_reunification_retry: "통일 제안 재개"
 CHI_MON_reunification_retry_desc: "몽골은 우리의 이전 제안을 거절했습니다. 외교적 여건이 가라앉을 시간을 둔 뒤 울란바토르에 다시 접근할 수 있습니다."
 CHI_han_settlement_small: "소규모 한족 이주 계획"
 CHI_han_settlement_small_desc: "고용 장려책과 토지 배분 계획의 뒷받침 아래, 국가가 후원하는 소규모 계획에 따라 인구 밀집 내륙 성의 한족 가정들이 네이멍구의 새 마을로 이주합니다."
 CHI_han_settlement_medium: "중규모 한족 이주 계획"
 CHI_han_settlement_medium_desc: "더 큰 규모의 조직적 이주 사업으로 수만 명의 한족 노동자와 그 가족이 네이멍구로 이동합니다. 유입 인구를 수용하기 위해 새로운 산업 구역과 농지가 지정됩니다."
 CHI_han_settlement_large: "대규모 한족 이주 계획"
 CHI_han_settlement_large_desc: "대규모 인구 공학 운동으로 수십만 명의 한족 정착민이 한 차례의 조직적인 물결로 네이멍구에 이주합니다. 이 지역 민족 구성에 미치는 장기적 영향은 막대하지만, 단기적으로 현지의 저항이 급격히 커집니다."
 CHI_TAI_media_infiltration: "언론 네트워크 침투"
 CHI_TAI_media_infiltration_desc: "타이완 내에서 친베이징 언론 소유권과 편집 영향력 네트워크에 자금을 지원하고 확대합니다. 양안 교류에 더 우호적인 정보 환경을 조성합니다."
 CHI_TAI_business_council_funding: "양안 경제인 협의회 자금 지원"
 CHI_TAI_business_council_funding_desc: "국민당과 가까운 기업 단체와 양안 상공회의소에 재정적 후원을 제공합니다. 타이완 경제 엘리트 내에서 교류에 찬성하는 지지층을 강화합니다."
 CHI_TAI_cultural_exchange_program: "양안 문화 교류 프로그램"
 CHI_TAI_cultural_exchange_program_desc: "해협 양쪽의 학술 교류, 문화 축제, 청년 대화 프로그램을 후원합니다. 더 가까운 관계에 대한 정치적 저항을 누그러뜨리는 민간 차원의 유대를 구축합니다."
 CHI_TAI_cross_strait_infrastructure_investment: "양안 기반시설 투자"
 CHI_TAI_cross_strait_infrastructure_investment_desc: "본토 자본을 타이완의 기반시설 사업에 투입하여 중국 투자를 경제적 기회의 원천으로 자리매김하게 하고 두 경제 사이의 물질적 상호 의존을 심화시킵니다."
 CHI_45g_national_deployment_idea: "5G 국가 구축 구상"
 CHI_45g_national_deployment_idea_desc: "기지국, 핵심망 장비, 주파수 할당에 대한 자본 투자를 국가가 조율하여 전국에 5G 통신망 기반시설을 가속 구축합니다. 이 구상은 전략 산업과 핵심 기반시설의 통신 범위를 우선시합니다."
 CHI_avic_innovation_idea: "AVIC 항공기 개발"
 CHI_avic_innovation_idea_desc: "중국항공공업집단은 자체 항공기 설계 및 생산 능력을 이끌며, 외국 기술과 라이선스에 의존하지 않고 전투기와 수송기 계획을 진전시킵니다."
 CHI_big_fund_phase_1_idea: "국가 반도체 산업 기금"
 CHI_big_fund_phase_1_idea_desc: "반도체 자급에 대한 중국의 전략적 대응인 빅 펀드는 국가 자본을 동원하여 자체 제조 능력, 설계 능력, 장비 제조를 발전시킵니다. 이 구상은 외국 파운드리와 EDA 도구에 대한 의존도를 줄이는 데 중점을 둡니다."
 CHI_caic_innovation_idea: "CAIC 공격 헬리콥터 개발"
 CHI_caic_innovation_idea_desc: "중국의 항공우주 복합기업은 신속 배치와 지속 작전을 위해 설계된 자체 회전익기 플랫폼의 개발과 생산을 통해 공격 헬리콥터 기술을 발전시킵니다."
 CHI_casc_innovation_idea: "CASC 우주 및 위성 계획"
 CHI_casc_innovation_idea_desc: "중국항천과기집단은 우주 발사, 위성 통신, 지구 관측 능력을 확대하여, 외국의 접근 제한과 무관한 우주 강대국으로서 중국의 위상을 굳힙니다."
 CHI_casic_innovation_idea: "CASIC 미사일 및 대응 수단 개발"
 CHI_casic_innovation_idea_desc: "중국항천과공집단은 추진, 유도, 전자전 분야의 지속적인 연구개발을 통해 순항미사일, 탄도미사일, 대공 방어 체계를 발전시킵니다."
 CHI_cetc_innovation_idea: "CETC 컴퓨팅 및 AI 개발"
 CHI_cetc_innovation_idea_desc: "중국전자과기집단은 기술 의존도를 줄이고 핵심 기반 기술의 국내 혁신을 가속하기 위해 고성능 컴퓨팅, 반도체 설계, 인공지능 플랫폼에 투자합니다."
 CHI_crrc_innovation_idea: "CRRC 산업 제조"
 CHI_crrc_innovation_idea_desc: "중국의 철도 및 운송 제조업체는 야금, 정밀 제조, 시스템 통합 분야에서 수십 년간 쌓은 공급망 전문성을 활용하여 더 넓은 산업 부문으로 다각화합니다."
 CHI_csgc_innovation_idea: "CSGC 장갑차 개발"
 CHI_csgc_innovation_idea_desc: "중국의 국영 장갑차 제조업체는 첨단 장갑, 화력, 기동성을 통합하여 전차, 보병전투차, 지원 차량 분야의 차세대 플랫폼을 개발합니다."
 CHI_csic_innovation_idea: "CSIC 잠수함 개발"
 CHI_csic_innovation_idea_desc: "중국선박중공업집단은 장시간 수중 작전을 위한 선체 소재, 정숙성, 첨단 센서 체계에 중점을 두고 잠수함 설계와 생산을 발전시킵니다."
 CHI_cssc_innovation_idea: "CSSC 수상 전투함 개발"
 CHI_cssc_innovation_idea_desc: "중국의 주요 조선업체는 통합 전투 체계를 갖춘 첨단 구축함, 호위함, 초계함 설계에 집중하여 전략적 해상 교통로 전반으로 중국의 원해 능력을 확장합니다."
 CHI_failed_five_year_plan: "실패한 5개년 계획"
 CHI_failed_five_year_plan_desc: "최근 5개년 계획 주기의 실망스러운 결과로 우선순위와 자원 배분을 재검토할 수밖에 없게 되었습니다. 장기 발전 목표에 대한 대중의 신뢰가 훼손되어 즉각적인 정책 수정이 필요합니다."
 CHI_haig_innovation_idea: "하얼빈 항공기 공업 집단 개발"
 CHI_haig_innovation_idea_desc: "하얼빈의 항공 부문은 회전익기 능력을 확대하여, 외국 설계와 라이선스에 대한 의존도를 줄이는 수송 헬리콥터와 공격 플랫폼을 개발합니다."
 CHI_inner_mongolia_innovation_idea: "네이멍구 기갑 개발"
 CHI_inner_mongolia_innovation_idea_desc: "네이멍구의 통합 기갑 생산 기지는 수백 년간 축적된 야금 전문성과 현대적 제조 기법을 바탕으로 주력 전차와 장갑차 개발을 발전시킵니다."
 CHI_jap_strategic_isolation: "일본의 전략적 고립"
 CHI_jap_strategic_isolation_desc: "우리의 경제적 영향력과 지역 외교 입지는 동아시아에서 일본의 전략적 영향력을 갈수록 주변화시킵니다. 도쿄는 소비재 인플레이션, 수출 시장 축소, 전략적 무의미함이 주는 심리적 부담에 직면합니다."
 CHI_kor_g2_economic_platform: "중국-한국 G2 경제 틀"
 CHI_kor_g2_economic_platform_desc: "무역 정책, 투자 흐름, 기술 협력을 아우르는 중국과 한국 간의 양자 경제 조율 체계를 구축합니다. 이 협정은 두 나라를 동아시아 번영의 공동 관리자로 자리매김하게 합니다."
 CHI_kor_trilateral_opening: "한국 3자 개방"
 CHI_kor_trilateral_opening_desc: "고위급 협의와 제한적 경제 교류를 통해 북한과 외교적 문을 열며, 대화를 중재하고 통제된 개혁에 물질적 지원을 제공하려는 중국의 의지를 알립니다."
 CHI_made_in_china_2025_idea: "중국제조 2025"
 CHI_made_in_china_2025_idea_desc: "반도체, 첨단 복합재, 로봇공학, 철도 운송 분야의 첨단 제조업을 겨냥한 10년 단위 산업 정책 구상입니다. 이 계획은 중국을 세계의 공장에서 세계의 혁신가로 전환하는 것을 목표로 합니다."
 CHI_nko_final_transition: "북한의 최종 전환"
 CHI_nko_final_transition_desc: "북한 변모의 최종 단계는 중국 영향력과 정렬의 정점을 나타냅니다. 평양은 형식적 독립만을 남긴 채 기능적으로 중국 영향권에 통합됩니다."
 CHI_nko_managed_reform_pilot: "북한 관리형 개혁 시범"
 CHI_nko_managed_reform_pilot_desc: "중국은 경제특구와 통제된 시장 기제를 통해 북한의 제한적인 경제 자유화를 후원합니다. 이 시범은 평양이 정권 통제를 불안정하게 하지 않고 개혁할 수 있는지를 시험합니다."
 CHI_norinco_innovation_idea: "NORINCO 무기 개발"
 CHI_norinco_innovation_idea_desc: "중국북방공업공사는 보병 무기 현대화, 야포 체계, 경장갑 플랫폼을 가속합니다. NORINCO의 수출 품목은 서방 공급처 접근이 제한된 군대들로 확대됩니다."
 CHI_phi_abandonment_doctrine: "필리핀 방기 교리"
 CHI_phi_abandonment_doctrine_desc: "필리핀의 경제적 의존과 전통적 안보 파트너로부터의 외교적 소원을 의도적으로 조장하여, 마닐라를 고립시키고 중국의 압박에 취약하게 만듭니다."
 CHI_poly_innovation_idea: "폴리 테크놀로지스 군수 산업 개발"
 CHI_poly_innovation_idea_desc: "폴리텍의 다각화된 군수 산업 포트폴리오는 국가의 후원과 국방 기구 전반의 연구 기관에 대한 접근권을 활용하여 신흥 방위 부문으로 확장됩니다."
 CHI_sac_innovation_idea: "SAC 전투기 개발"
 CHI_sac_innovation_idea_desc: "선양 항공기 공사는 러시아산 엔진과 AESA 레이더 기술에 대한 의존도를 줄이는 자체 플랫폼을 개발하며 전투기 설계와 생산을 발전시킵니다."
 CHI_shadow_banking_cleanup_idea: "그림자 금융 부문 정비"
 CHI_shadow_banking_cleanup_idea_desc: "규제되지 않는 신탁 상품, P2P 대출, 부외 금융에 대한 규제 단속이 금융 시스템에서 체계적 위험을 제거합니다. 단기적인 신용 위축은 개선된 규제 신뢰로 상쇄됩니다."
 CHI_south_china_sea_dominance_window: "남중국해 장악 기회"
 CHI_south_china_sea_dominance_window_desc: "해군 주둔, 민간 어선단 확대, 매립한 섬의 군사 시설 건설을 통해 남중국해에 대한 통제를 공고히 할 전략적 기회가 열렸습니다. 지역 강국들이 중국의 팽창에 맞서도록 협력하면 이 기회는 닫힐 수 있습니다."
 CHI_ztz99_rollout_idea: "99식 주력 전차 배치"
 CHI_ztz99_rollout_idea_desc: "99식 주력 전차를 인민해방군 육군 전반에 본격 생산하고 배치하여, 이전 플랫폼보다 향상된 장갑, 화력, 기동성을 제공합니다."
 ETK_security_reinforcement_idea: "보안군 증강"
 ETK_security_reinforcement_idea_desc: "보안군을 확대하고 테러 공격에 대비해 기반시설을 강화합니다. 경제적 비용은 적은 편이나 시민 자유의 축소와 감시 강화로 상쇄됩니다."
 ETK_surveillance_state_idea: "감시 국가 조치"
 ETK_surveillance_state_idea_desc: "감시 체계, 검문소 망, 정보 수집을 사회 전반에 걸쳐 포괄적으로 확대합니다. 사회 통제 개선으로 얻는 경제적 효율성 이득은 혁신 저하와 시민 참여 감소로 상쇄됩니다."
 ETK_terrorism_aftermath: "테러의 여파"
 ETK_terrorism_aftermath_desc: "최근 테러 공격으로 인한 남은 안보 우려와 사회적 충격이 경제 활동과 대중의 신뢰를 계속 교란합니다. 회복에는 시간과 효과적인 치안 복구가 필요합니다."
 TAI_civil_defense_readiness: "민방위 대비 태세"
 TAI_civil_defense_readiness_desc: "대피, 부상자 치료, 피해 통제 훈련과 함께 방공 임무를 위해 주민을 동원합니다. 공중 위협에 대한 방어는 향상되지만 삶의 질 저하와 경제적 혼란이 따릅니다."
 CHI_bri_pacific_engagement_tt: "$CHI_bri_pacific_engagement$: $RIGHT|+=1$"
 CHI_Asset_Seizure_tt: "§Y압류 자산:§! 국고 §G+25§!, $CHI_bri_global_presence$ §G+3§!\n미상환 부채가 사업 비용 1건만큼 감소합니다"
 chi_bri.16.a: "그 결과는 우리가 감당하겠다"
 chi_bri.16.d: "재무부는 장부가 이미 보여 주던 사실을 확인했습니다. 우리는 이번 달 일대일로 채무 상환금을 낼 수 없습니다. 베이징에는 며칠 내로 통보될 것입니다. 체납금이 정산될 때까지 채권자는 조치를 취할 권리가 있으며, 그 선택지가 모두 온건한 것은 아닙니다."
 chi_bri.16.t: "일대일로 상환 불이행"
 chi_bri.17.a: "양허 계약에 서명한다"
 chi_bri.17.b: "매장지는 팔 수 없다"
 chi_bri.17.d: "중국 대표단이 사실상 제안이라 할 수 없는 제안을 들고 도착했습니다. 부도 처리된 우리의 일대일로 부채를 사업 비용 1건만큼 줄여 주는 대가로, 베이징은 우리 광물 매장지에 대한 장기 채굴 및 수출권을 원합니다. 부채의 일부는 장부에서 사라질 것입니다. 우리 발밑 땅에 대한 통제권도 상당 부분 그렇게 될 것입니다."
 chi_bri.17.t: "베이징의 자원권 요구"
 chi_bri.18.a: "다른 수단이 남아 있다"
 chi_bri.18.d: "[FROM.GetName]이(가) 우리의 자원 양허 조건을 단호히 거부했습니다. 그들의 부채와 채무 불이행은 그대로이며, 우리 대표단은 빈손으로 베이징에 돌아왔습니다. 이제 기다릴 것인지, 아니면 다른 수단으로 받을 몫을 거둬들일 것인지가 문제입니다."
 chi_bri.18.t: "[FROM.GetName]의 우리 조건 거부"
 chi_bri.19.a: "선택지를 검토한다"
 chi_bri.19.d: "[FROM.GetName]이(가) 일대일로 채무 상환을 불이행했습니다. 구상의 기준으로 보면 금액은 크지 않지만 선례가 중요합니다. 다른 모든 차입국이 베이징의 대응을 지켜보고 있습니다. 우리는 부채를 재조정하거나, 자원권을 요구하거나, 우리가 자금을 댄 것을 압류할 수 있습니다."
 chi_bri.19.t: "[FROM.GetName]의 일대일로 부채 불이행"
 chi_bri.23.a: "중요한 것은 건설이다"
 chi_bri.23.d: "우리 국고가 §Y[GetBRIProjectName]§! 중 우리 몫을 감당할 수 없어, 베이징이 그 차액을 메우기 위해 신용을 제공했습니다. 건설은 어느 쪽이든 진행됩니다. 이제 부채는 우리 장부에 올랐으며 이자가 붙고, 이를 상환하지 못하면 약정에 따라 중국에 상당한 재량이 주어집니다."
 chi_bri.23.t: "외상으로 자금을 조달한 일대일로 사업"
 CHI_BRI_automation_disable_tt: "일대일로 신청은 §Y개별 검토§!해야 합니다"
 CHI_BRI_automation_enable_tt: "일대일로 신청이 §G자동 승인§!됩니다"
 CHI_bri_buy_back_concession: "양허권 환매"
 CHI_bri_buy_back_concession_desc: "중국 기업에 넘긴 채굴 및 수출권에서 돈을 주고 벗어납니다. 비용이 많이 들고 베이징은 손실을 곱게 받아들이지 않겠지만, 매장지가 국가의 통제로 돌아옵니다."
 CHI_bri_can_host_energy: "전력을 공급할 산업 단지가 있는 주를 통제하고 있다"
 CHI_bri_can_host_mine: "가치 있는 광물 매장지가 있는 주를 통제하고 있다"
 CHI_bri_can_host_pipeline: "가치 있는 석유, 강철 또는 귀금속 매장지가 있는 주를 통제하고 있다"
 CHI_bri_can_host_port: "항만을 유치할 수 있는 해안 주를 통제하고 있다"
 CHI_bri_can_host_prestige: "자국 수도를 통제하고 있다"
 CHI_bri_can_host_rail: "철도를 유치할 수 있는 주를 통제하고 있다"
 CHI_bri_can_host_sez: "경제특구를 유치할 수 있는 해안 또는 교통이 좋은 주를 통제하고 있다"
 CHI_bri_can_host_telecom: "통신망을 유치할 수 있는 주를 통제하고 있다"
 CHI_bri_can_request: "중국이 일대일로 신청을 받고 있으며 여유 사업 슬롯이 있다"
 CHI_bri_clear_loan_tt: "그들의 미상환 일대일로 부채가 §G탕감§!됩니다"
 CHI_bri_has_reclaimable_structure: "우리가 회수할 수 있는 일대일로 사업을 보유하고 있다"
 CHI_bri_monthly_income_base: "BRI 기본 월간 출연금"
 CHI_bri_monthly_income_base_desc: "부서별 보너스 이전에, 국가 중점과 결정으로 매달 일대일로 기금에 약정된 국가 예산의 몫입니다."
 CHI_bri_monthly_income_total: "BRI 월간 출연금"
 CHI_bri_monthly_income_total_desc: "매달 일대일로 기금에 납입되는 총액으로, 약정된 기본액에 부서별 보너스를 더한 값입니다."
 CHI_bri_refuse_concession_tt: "우리는 §R부채를 유지§!하며 계속 채무 불이행 상태에 머뭅니다"
 CHI_bri_returns_multiplier_base: "BRI 수익 배율"
 CHI_bri_returns_multiplier_base_desc: "중국이 완공된 각 일대일로 사업에서 얻는 국제 투자 수익에 적용되는 보너스입니다."
 CHI_bri_unlock_tt: "§Y일대일로:§! 사업 슬롯 §G6§!개, 사업당 §G40§!, 월간 출연금 §G+8§!, 완공 사업당 국제 투자 §G+4§!"
 CHI_Write_Off_Debts_tt: "자격을 갖춘 모든 파트너의 일대일로 부채가 전액 §G탕감§!됩니다"
 CHI_bri_forum_surge: "일대일로 포럼 급증"
 CHI_bri_forum_surge_desc: "3년 주기 포럼에서 서명된 약속은 베이징이 향후 3년간 두 개의 프로젝트를 동시에 더 추진할 수 있게 해 줍니다. 슬롯이 늘어나면 더 많은 파트너 국가가 동시에 건설을 진행할 수 있습니다."
 CHI_bri_partner_1: "일대일로 참여국"
 CHI_bri_partner_1_desc: "첫 번째 일대일로 프로젝트가 착공되었습니다. 중국 건설 인력이 국내 건설 작업을 가속하고 정부의 개발 의제에 신뢰를 더해 줍니다."
 CHI_bri_partner_2: "일대일로 파트너"
 CHI_bri_partner_2_desc: "두 번째 일대일로 프로젝트가 완공되었습니다. 중국의 공학 기술과 기반시설 금융이 국가 개발 계획의 눈에 띄는 일부가 되어 가고 있습니다."
 CHI_bri_partner_3: "일대일로 전략적 파트너"
 CHI_bri_partner_3_desc: "이제 전국에서 여러 일대일로 프로젝트가 진행 중입니다. 중국의 시공사와 신용 한도, 정치적 후원이 국가 역량을 뒷받침하며, 베이징은 그 대가로 외교적 보조를 기대합니다."
 CHI_bri_partner_4: "일대일로 핵심 거점국"
 CHI_bri_partner_4_desc: "일대일로 투자가 국가 경제를 떠받치고 있습니다. 중국 자본이 건설과 소비재 공급에 자금을 대고 있으며, 이러한 의존 관계는 이제 심각한 혼란 없이는 풀기 어렵습니다."
 CHI_bri_partner_5: "일대일로 쐐기돌 파트너"
 CHI_bri_partner_5_desc: "이 나라는 일대일로의 기둥입니다. 중국의 표준과 시공사, 금융이 모든 주요 회랑에 뿌리내리고 있으며, 경제 정책은 베이징을 염두에 두고 수립됩니다."
 CHI_bri_presence_modifier: "일대일로 세계적 존재감"
 CHI_bri_presence_modifier_desc: "중국이 일대일로 네트워크에서 얻는 위상입니다. 파트너 국가의 수와 각국이 얼마나 깊이 편입되어 있는지에 따라 커집니다."
 CHI_bri_presence_modifier_tt: "§Y$CHI_bri_global_presence$§!에 비례합니다. 이는 모든 일대일로 파트너의 등급을 합산한 값입니다. 존재감 200에서 소비재 수요가 최대 §G7.5%§! 감소합니다."
 CHI_bri_claim_resource_rights: "자원 권리 요구"
 CHI_bri_claim_resource_rights_desc: "현물로 대금을 받습니다. 채무국은 장기 채굴 및 수출 권리를 넘겨 부채를 프로젝트 비용 한 건만큼 줄이는 대신 자국 자원 기반의 통제권을 양도합니다. 약탈적 대출 노선에서만 사용할 수 있습니다."
 CHI_bri_project_mission: "일대일로 건설"
 CHI_bri_project_mission_desc: "중국의 시공사와 금융이 §Y[GetBRIProjectName]§! 사업을 진행 중입니다. 완공되면 우리는 그 이점을 얻고, 파트너 등급이 상승하며, 베이징은 대가를 거둡니다."
 CHI_bri_raise_contribution: "일대일로 기금 증액"
 CHI_bri_raise_contribution_desc: "매월 국가 예산에서 일대일로 기금에 더 큰 비중을 할당합니다. 국고는 건설 비용을 선지급하며 프로젝트 수익으로 보충되지 않으므로, 이를 늘리는 것이 건설을 계속할 유일한 방법입니다."
 CHI_bri_raise_contribution_tt: "§Y$CHI_bri_monthly_income$§!: 매월 최대 §G+4§! (최대 §Y30§!)"
 CHI_bri_resource_concession_idea: "중국 자원 양허권"
 CHI_bri_resource_concession_idea_desc: "채무 불이행 상태에 빠진 일대일로 대출의 일부는 채굴 및 수출 권리를 넘기는 방식으로 정산되었습니다. 중국 기업들이 매장지를 개발하고, 수익은 과세되기도 전에 국외로 빠져나갑니다. 양허권은 되사들일 때까지 계속됩니다."
 CHI_BRI_project_missions: "일대일로 프로젝트"
 CHI_BRI_project_missions_desc: "현재 우리나라에서 중국 시공사가 자금을 대고 건설 중인 일대일로 프로젝트입니다."
 CHI_BRI_automation_disable: "일대일로 자동화 비활성화"
 CHI_BRI_automation_disable_desc: "접수되는 일대일로 프로젝트 신청에 대해 직접 심사하는 방식으로 되돌립니다. 각 신청은 중국이 개별적으로 검토하여 승인하거나 거절할 수 있도록 사건으로 도착합니다. 이미 심사 대기 중인 신청은 접수 당시의 절차를 유지합니다."
 CHI_BRI_automation_enable: "일대일로 자동화 활성화"
 CHI_BRI_automation_enable_desc: "접수되는 일대일로 신청을 하나하나 심사하는 대신 자동으로 승인합니다. 신청국은 신청 전에 이미 자격과 여유 프로젝트 슬롯 여부를 심사받으므로, 자동화는 단지 서류 절차를 생략할 뿐입니다. 이미 심사 대기 중인 신청은 접수 당시의 절차를 유지합니다."
 CHI_bri_committed_projects: "일대일로 확정 프로젝트"
 CHI_bri_committed_projects_desc: "진행 중인 일대일로 프로젝트와 심사 대기 중인 신청 건의 합계입니다. 대기 중인 신청 건마다 프로젝트 슬롯을 하나씩 점유합니다."
 CHI_MAC_gambling_diversification: "도박 산업 다각화"
 CHI_MAC_gambling_diversification_desc: "수십 년 동안 마카오의 번영은 단 하나의 기둥, 즉 카지노 영업장에 의존해 왔습니다. 디지털 서비스, 전자상거래, 기술 인프라로의 의도적 전환은 도박 테이블을 넘어 세원을 넓히고, 관광 수입의 등락으로부터 특별행정구를 완충하는 동시에 토종 인터넷 경제의 씨앗을 뿌립니다."
