 ukraine_reorganize_navy_repair_support_ships.4.a: "정부 조선소만 이용한다"
 ukraine_reorganize_navy_repair_support_ships.4.b: "민간 조선소에 비용을 지불한다"
 ukraine_reorganize_navy_repair_support_ships.5.name: "지원함 수리 - 3척 모두 수리 완료"
 ukraine_reorganize_navy_repair_support_ships.5.desc: "지원함 3척 모두의 수리를 완료하였으므로, 이제 현역 복무가 가능하며 우리 함대에 필요한 지원을 제공할 수 있습니다."
