 UKR_develop_t84u: "Research T-84U 'Oplot'"
 UKR_develop_t84u_desc: "T-84U 'Oplot' is a Ukrainian main battle tank of the third generation, developed by the Kharkiv Design Bureau named after O. O. Morozov on the basis of the T-84 tank.\nThe tank received a new welded-rolled turret with an all-stamped roof, made from electroslag remelting, due to which it has higher strength and survivability.\nTaking into account the simpler shape of the turret, it was possible to successfully place multi-layer armor in it. Its internal volume was also increased.\nA new Ukrainian-made 3rd generation dynamic protection 'Nizh' was placed in the frontal projection of the turret.\nEquipped with Ukrainian-made dynamic and active protection, foreign-made aiming devices, and enlarged side screens."
 UKR_develop_yatahan: "Research T-84-120 'Yatahan'"
 UKR_develop_yatahan_desc: "T-84-120 'Yatahan' is a version of the T-84U 'Oplot' tank that has a 120-mm gun adapted to NATO standards instead of the typical 125-mm gun, developed by the Kharkiv Design Bureau named after O. O. Morozov.\nThe tank has a 120-mm KBM2 cannon, which uses 120-mm caliber NATO ammunition.\nThe carousel autoloader (originally French, then Ukrainian-made) is located in the aft part of the turret.\nIt is possible to install the new 140-mm 'Bahira' gun.\nAssembled from components of Ukrainian production, although it is fully compatible with components of foreign production."
 UKR_develop_bahira: "Research T-84-140 'Bahira'"
 UKR_develop_bahira_desc: "T-84-140 'Bahira' is a proposed version of the T-84-120 'Yatahan' tank that would be equipped with a 140-mm gun 'Bahira', developed by the Kharkiv Design Bureau named after O. O. Morozov.\nThe carousel autoloader is located in the aft part of the turret.\nAssembled from components of Ukrainian production, although it is fully compatible with components of foreign production."
 UKR_develop_bm_oplot: "Research T-84 'BM Oplot'"
 UKR_develop_bm_oplot_desc: "T-84 'BM Oplot' he newest and most sophisticated version of T-84U 'Oplot' MBT, developed by the Kharkiv Design Bureau named after O. O. Morozov.\nIts distinct features, among others, are mounting more advanced armor, new electronic countermeasure systems, and others.\nOne visible feature is the new PNK-6 panoramic tank sight."
 UKR_develop_bastion: "Research T-84 'Bastion'"
 UKR_develop_bastion_desc: "T-84 'Bastion' is a reported modernization program, according to which the tank will get rid of Russian-made parts.\nThe T-84 'BM Oplot' version, adopted in 2009, had a certain number of components and materials of Russian origin: individual components of electrical equipment, components of blocks and systems.\nIt has been reported that there are relatively few of them, but they should all be completely replaced.\nIt was planned that the element base should not only get rid of Russian components, but also be significantly modernized."
 UKR_develop_t84u_flag: "Completed decision §YResearch T-84U 'Oplot'§!"
 UKR_develop_t84_yatahan_flag: "Completed decision §YResearch T-84-120 'Yatahan'§!"
 UKR_develop_bm_oplot_flag: "Completed decision §YResearch T-84 'BM Oplot'§!"
 UKR_develop_donets_spaa: "Develop 'Donets'"
 UKR_develop_donets_spaa_desc: "'Donets' is a self-propelled anti-aircraft missile and artillery complex developed by Malyshev Tank Factory in Kharkiv and intended mainly for export deliveries.\n'Donets' is a combination of a modernized turret from the Soviet ZSU-23-4 'Shilka' and a T-80UD/T-84 MBT chassis.\nOn the sides of the turret, on its sides, two paired transport-launch containers with missiles from the 'Strela-10M' air defense system are installed. \nThe missiles, which have an autonomous passive homing system, are capable of hitting aerial targets at a range of up to 4,500 m and at an altitude of 3,500 m."
