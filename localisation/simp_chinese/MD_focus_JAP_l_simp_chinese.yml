 JAP_japanese_navy_name: "日本海军"
 JAP_imperial_japanese_navy_name: "日本帝国海军"
 JAP_diplomacy.11.t: "美国请求重新解释宪法第九条"
 JAP_diplomacy.11.d: "美国政府已正式请求我们进一步重新解释宪法第九条。华盛顿方面辩称，区域安全环境已恶化到日本必须承担更多集体防御责任的程度。接受他们的请求将为更广泛的自我防卫理解和更紧密的军事合作敞开大门，但这在国内必将引发争议。"
 JAP_diplomacy.11.a: "接受美国的请求"
 JAP_diplomacy.11.b: "我们无法接受这一请求"
 JAP_diplomacy.12.t: "日本拒绝重新解释宪法第九条"
 JAP_diplomacy.12.d: "东京方面已告知我们，目前不准备对宪法第九条作进一步重新解释。出于对国内舆论、宪法限制以及政治稳定性的考量，日本政府拒绝了我们的请求。现在我们必须决定，是尊重他们的决定，还是施加更多外交与安全压力。"
 JAP_diplomacy.12.a: "我们将尊重他们的决定。"
 JAP_diplomacy.12.b: "加大对日本的施压力度"
 JAP_diplomacy.13.t: "日本同意重新解释宪法第九条"
 JAP_diplomacy.13.d: "东京方面已表示支持修改宪法第九条的解释，并将努力成为更积极的防卫伙伴。"
 JAP_diplomacy.13.a: "终于"
 JAP_diplomacy.14.t: "美国对日本宪法第九条施压"
 JAP_diplomacy.14.d: "在我们拒绝扩大对宪法第九条的解释后，美国已悄然开始对我国政府施加外交与安全压力。无论是同盟磋商、媒体吹风还是幕后传话，所有迹象都指向同一方向：华盛顿期待日本承担更多责任。我们可以选择坚守立场，也可以悄然调整姿态。"
 JAP_diplomacy.14.a: "我们将坚守立场"
 JAP_diplomacy.14.b: "悄悄进行让步"
 JAP_diplomacy.15.t: "日本迫于压力接受"
 JAP_diplomacy.15.d: "经过一段时期的外交与战略施压，东京方面已表示愿意在宪法第九条议题上向我方立场靠拢。尽管公开场合仍坚称日本和平主义原则不变，但政府现已拓宽对\"自卫权\"的解释范畴，其调整方向完全符合我方预期。"
 JAP_diplomacy.15.a: "好极了！"
 JAP_diplomacy.17.t: "美国对日本商品加征关税"
 JAP_diplomacy.17.d: "美国宣布对日本关键出口商品实施新一轮关税，声称此举旨在应对经济失衡和国内政治压力。美方称这些措施是为了\"创造公平竞争环境\"，但在东京看来，这被普遍视为具有政治动机的行动，将损害我国经济并影响更广泛的同盟关系。"
 JAP_diplomacy.17.a: "我们必须适应这个新现实。"
 JAP_diplomacy.18.t: "日本请求关税减免"
 JAP_diplomacy.18.d: "东京已正式请求我们取消对日本商品征收的关税。日方代表暗示，其政府可能愿意以深化安全合作、推进防务政策调整为交换条件。我们必须决定，是将这场经济争端转化为战略机遇，还是继续保持施压。"
 JAP_diplomacy.18.a: "以取消关税换取安全让步"
 JAP_diplomacy.18.b: "拒绝并维持关税政策"
 JAP_diplomacy.19.t: "关税取消，安全让步"
 JAP_diplomacy.19.d: "美国已同意取消对日本出口商品的关税，但这仅作为安全与防务领域更广泛共识的一部分。实际上，这意味着日本需进一步扩大对宪法第九条的解释范围，深化与华盛顿的军事合作，并在地区安全事务中承担更大责任。"
 JAP_diplomacy.19.a: "为了我们的经济和我们的联盟，我们将承担这一重任。"
 JAP_diplomacy.20.t: "美国拒绝取消关税"
 JAP_diplomacy.20.d: "我们关于解除美国关税的正式请求已被驳回。华盛顿方面坚持维持现行措施，理由是面临国内政治压力以及双方在安全政策上存在未解决的分歧。国内出口商和企业领袖的不满情绪日益加剧，同时战略专家警告称，这一争端可能使我们的同盟关系进一步复杂化。"
 JAP_diplomacy.20.a: "眼下我们只能暂时承受这份压力了。"
 JAP_diplomacy.21.t: "日本请求更新安全保障条约"
 JAP_diplomacy.21.d: "日本政府已正式向美国提出请求，要求更新或加强安全保障承诺。东京方面辩称，地区安全环境已经恶化，美国更明确的承诺将有助于稳定局势。日本官员私下承认，如果华盛顿方面准备作出明确承诺，对宪法第九条的解释可能还会有进一步修改的空间。"
 JAP_diplomacy.21.a: "恢复我们的安全保障，以换取更深入的承诺。"
 JAP_diplomacy.21.b: "拒绝延长保障"
 JAP_diplomacy.22.t: "安全保障已恢复"
 JAP_diplomacy.22.d: "美国已同意更新并明确其对日本的安全保障。作为回报，华盛顿期望东京在扩大对宪法第九条的解释及承担更多地区安全责任方面采取进一步措施。美日同盟关系因此得到加强，但国内关于和平主义原则的争论也将随之激化。"
 JAP_diplomacy.22.a: "为了我们的安全，我们将接受这项承诺。"
 JAP_diplomacy.23.t: "美国拒绝提供更强有力的保证"
 JAP_diplomacy.23.d: "我们关于更新或加强安全保障的请求已被拒绝。美国坚称现有安排已足够充分，且国内政治因素限制了其作出进一步承诺。在日本国内，这一拒绝将加剧对我国长期安全及同盟可靠性的担忧。"
 JAP_diplomacy.23.a: "那么我们必须重新审视自己的道路。"
 JAP_diplomacy.24.t: "日本请求结束美国海军施压"
 JAP_diplomacy.24.d: "东京已正式要求我们缩减或结束在关键航道和咽喉要道附近加强的海军存在及施压。日方官员辩称，当前态势可能引发局势升级，并削弱国内对同盟的支持。私下里，他们暗示如果我们缓和姿态，可能进一步调整对宪法第九条的解释。"
 JAP_diplomacy.24.a: "以安全让步换取结束海军施压"
 JAP_diplomacy.24.b: "维持对日本周边的海上压力"
 JAP_diplomacy.25.t: "海军压力缓解，安全承诺加深"
 JAP_diplomacy.25.d: "美国已同意降低其在我国海上航线周边增强的海军存在，以换取日本更深层次的安全承诺。实际上，这意味着在扩大对宪法第九条的解释、拓展我国在区域安全中角色的道路上又迈进了一步。同盟关系看似更加牢固，但国内关于和平主义立场的争论必将愈演愈烈。"
 JAP_diplomacy.25.a: "为了维持稳定，我们将遵守这项协议。"
 JAP_diplomacy.26.t: "美国拒绝停止海军施压"
 JAP_diplomacy.26.d: "我们要求减轻或结束美国在我们海上航线周边加强海军存在的请求已被拒绝。华盛顿方面坚称，鉴于地区威胁，当前姿态是必要的。在国内，这一拒绝将加剧对卷入更广泛冲突的担忧，并引发进一步强化日本自身防御的呼声。"
 JAP_diplomacy.26.a: "那么我们必须应对压力做出调整"
 JAP_diplomacy.28.t: "“辉夜”探月计划设计难题"
 JAP_diplomacy.28.d: "雄心勃勃的\"辉夜\"探月计划正面临严峻的设计挑战。从导航系统、能源管理到热防护等关键系统的复杂度远超预期。工程师们主张追加资金与时间以重新设计核心部件并提升整体可靠性，但由此产生的成本已在内阁中引发疑虑。"
 JAP_diplomacy.28.a: "投资重新设计以赶上时间安排"
 JAP_diplomacy.28.b: "控制成本并接受更长的工期"
 JAP_diplomacy.29.t: "“辉夜”通讯系统漏洞"
 JAP_diplomacy.29.d: "随着测试的持续进行，\"辉夜\"计划暴露出深空通信与数据链路的薄弱环节。信号完整性、带宽及抗干扰能力均未达到预期目标。专家建议采用新型天线、升级地面站并部署更稳健的加密系统，但这些改进措施需要追加政治与资金投入。"
 JAP_diplomacy.29.a: "升级通信架构"
 JAP_diplomacy.29.b: "沿用现有体系，祈祷不会出问题"
 JAP_diplomacy.30.t: "“辉夜”探月任务再度延期"
 JAP_diplomacy.30.d: "技术障碍、系统整合问题以及与发射基础设施的时间安排冲突，迫使\"辉夜\"探月任务再次推迟。尽管核心系统前景依然看好，但该项目正日益被视为进展缓慢且问题重重。科学家们坚称耐心终将获得回报，然而公众的注意力已开始转向其他领域。"
 JAP_diplomacy.30.a: "接受延期，继续向月球进发"
 JAP_diplomacy.31.t: "“辉夜”成功登陆月球表面"
 JAP_diplomacy.31.d: "经过多年的设计修改、通信升级以及艰难的延期，\"辉夜\"探月任务终于取得成功。日本制造的设备如今已在月球表面及周边运行，传回高分辨率图像与宝贵的科学数据。这项成就彰显了日本的高科技实力，为卫星研发、深空探索及战略太空应用开辟了新道路。"
 JAP_diplomacy.31.a: "庆祝“辉夜”这一日本科技的伟大胜利"
 jap_kaguya_satellite_invest_tt: "§G由于我们投资改进了飞船设计，因此获得了：§!"
 jap_kaguya_rocketry_invest_tt: "§G由于我们投资改善了与飞船的通信，我们获得了：§!"
 JAP_diplomacy.32.t: "导航软件异常"
 JAP_diplomacy.32.d: "火星任务工程师报告称，导航软件存在反复出现的异常。虽然问题尚不严重，但若不及时处理，可能会累积成严重的导航错误。彻底修复该问题将抽调其他项目的资源，并可能影响整体进度。"
 JAP_diplomacy.32.a: "倾斜资源并妥善解决此事"
 JAP_diplomacy.32.b: "接受延误并逐步修补"
 JAP_diplomacy.33.t: "命名火星殖民地"
 JAP_diplomacy.33.d: "日本已在火星上建立了永久据点。随着栖息地投入使用，首批长期驻留人员陆续定居，一项具有象征意义的决定即将出炉：该殖民地的正式名称和性质。"
 JAP_diplomacy.33.a: "‘天照’，象征团结的光辉"
 JAP_diplomacy.33.b: "‘迦具土’，耀眼的工业铸就"
 JAP_diplomacy.33.c: "‘月读’，黑暗中一座平静的天文台"
 JAP_diplomacy.33.e: "“须佐”，如风暴一般的武神"
 JAP_diplomacy.68.t: "日本索取桦太"
 JAP_diplomacy.68.d: "日本已正式要求归还桦太岛。接受这一要求可以缓解紧张局势，但会被视为一种屈辱的让步。"
 JAP_diplomacy.68.a: "接受要求"
 JAP_diplomacy.68.b: "断然拒绝"
 JAP_diplomacy.69.t: "桦太回归"
 JAP_diplomacy.69.d: "莫斯科已经接受了我们的要求。桦太现在处于日本的管辖之下。日本政府将以此作为帝国秩序回归的证据。"
 JAP_diplomacy.69.a: "历史的修正"
 JAP_diplomacy.70.t: "俄罗斯拒绝"
 JAP_diplomacy.70.d: "莫斯科拒绝了我们对桦太的要求。我们可以暂时忍受这种侮辱，以有限的边境冲突试探俄罗斯，或者全面开战。"
 JAP_diplomacy.70.a: "暂时让步"
 JAP_diplomacy.70.b: "发起边境战争"
 JAP_diplomacy.70.c: "宣布全面战争"
 JAP_diplomacy.71.t: "日本索取北千岛群岛"
 JAP_diplomacy.71.d: "日本已正式要求归还北千岛群岛。接受这一要求可以缓解紧张局势，但会被视为一种屈辱的让步。"
 JAP_diplomacy.71.a: "接受要求"
 JAP_diplomacy.71.b: "断然拒绝"
 JAP_diplomacy.72.t: "北千岛群岛回归"
 JAP_diplomacy.72.d: "莫斯科已接受我们的要求。北千岛群岛现已处于日本管辖之下。政府将以此作为帝国秩序回归的证据。"
 JAP_diplomacy.72.a: "历史的修正"
 JAP_diplomacy.73.t: "俄罗斯拒绝"
 JAP_diplomacy.73.d: "莫斯科拒绝了我们对北千岛群岛的要求。我们可以暂时忍受这种侮辱，以有限的边境冲突试探俄罗斯，或者全面开战。"
 JAP_diplomacy.73.a: "暂时让步"
 JAP_diplomacy.73.b: "发起边境战争"
 JAP_diplomacy.73.c: "宣布全面战争"
 JAP_diplomacy.74.t: "日本索取南千岛群岛"
 JAP_diplomacy.74.d: "日本已正式要求归还南千岛群岛。接受这一要求可以缓解紧张局势，但会被视为一种屈辱性的让步。"
 JAP_diplomacy.74.a: "接受要求"
 JAP_diplomacy.74.b: "断然拒绝"
 JAP_diplomacy.75.t: "南千岛群岛回归"
 JAP_diplomacy.75.d: "莫斯科已接受我们的要求。南千岛群岛现已处于日本管辖之下。政府将以此作为帝国秩序回归的证据。"
 JAP_diplomacy.75.a: "历史的修正"
 JAP_diplomacy.76.t: "俄罗斯拒绝"
 JAP_diplomacy.76.d: "莫斯科拒绝了我们对南千岛群岛的要求。我们可以暂时忍受这种侮辱，以有限的边境冲突试探俄罗斯，或者全面开战。"
 JAP_diplomacy.76.a: "暂时让步"
 JAP_diplomacy.76.b: "发起边境战争"
 JAP_diplomacy.76.c: "宣布全面战争"
 JAP_diplomacy.77.t: "东京提出和解方案"
 JAP_diplomacy.77.d: "随着千岛群岛和桦太落入日本之手，东京迅速采取行动，将战场上的胜利转化为正式的和平协议。日本外交官已向莫斯科提出结束冲突的方案，认为战争已经决定了局势，继续战斗只会延长不可避免的结局。\n他们的提议很简单：以俄罗斯正式承认日本对千岛群岛和桦太的控制权为条件，换取和平。东京方面认为，这是一项务实的安排，旨在稳定地区局势，防止战争进一步升级。现在，决定权在我们手中。接受新的现实，结束战争；还是拒绝这一提议，继续斗争？"
 JAP_diplomacy.77.a: "接受和解方案。"
 JAP_diplomacy.77.b: "拒绝它。战争将继续。"
 JAP_diplomacy.78.t: "和解方案已被接受"
 JAP_diplomacy.78.d: "提议被接受，枪声渐渐平息。脱离接触的命令下达，外交渠道重新开放，战争最终简化为一系列条款和坐标。\n\n北方岛屿作为和平的代价被割让，各方现在都必须向本国民众解释这一结果。战役结束了，但记忆却不会就此消逝。"
 JAP_diplomacy.78.a: "就这样吧。让墨水代替鲜血。"
 JAP_diplomacy.79.t: "和解方案被拒绝"
 JAP_diplomacy.79.d: "对方的回答斩钉截铁：不。不会有任何签署，不会有任何承认，也不会有任何喘息的机会。\n\n东京误判了我们的决心，冲突将持续下去，直到一方再也无法承受为止。如果和平要到来，那也只能是强加的。"
 JAP_diplomacy.79.a: "然后我们继续战斗。"
 JAP_diplomacy.80.t: "莫斯科寻求出路"
 JAP_diplomacy.80.d: "在日本于北方取得进展后，俄罗斯外交官释放出愿意在局势进一步恶化前结束战争的信号。其传递的信息务实：止损、冻结战线，并防止战争消耗超出任何一方承受能力的资源。\n\n这项提议是直接的和平方案，以立即停止敌对行动换取持续升级的冲突。我们必须决定是接受这项不完美的解决方案，还是进一步巩固我们的优势。"
 JAP_diplomacy.80.a: "接受和平"
 JAP_diplomacy.80.b: "不，我们继续打"
 JAP_diplomacy.81.t: "东京接受和平"
 JAP_diplomacy.81.d: "日本接受了这些条款，选择结束战争而不是扩大战局。这一决定在部分地区不受欢迎，国内也为此付出了沉重的代价，民众信心下降，开始质疑当初为何要发动战争。\n\n双方宣布停战，领土割让得到执行。战场归于平静，但政治创伤却将持续存在。"
 JAP_diplomacy.81.a: "我们会忍气吞声，默默承受。"
 JAP_diplomacy.82.t: "东京拒绝"
 JAP_diplomacy.82.d: "日本拒绝了这一提议，并表明不会接受一份出于软弱而达成的协议。战斗还将继续，而且随着时间的推移，局势愈发紧张。\n\n如果和平终将到来，那不是别人给予的，而是别人争取来的。"
 JAP_diplomacy.82.a: "就这样吧"
 JAP_unlock_sikhalin_raid_tt: "解锁针对§Y$STATE_691$§!的§Y特种部队突袭§!"
 JAP_diplomacy.83.t: "在南千岛群岛的胜利"
 JAP_diplomacy.83.d: "日军在南千岛群岛取得胜利，击退俄军并控制了争议地区。虽然从地图上看，此次战役的战果并不大，但其传递的信息却十分强烈：日本能够夺取其声称拥有的领土，并能通过施压将其牢牢控制。\n\n旗帜升起，守军构筑工事，东京准备采取下一步行动。莫斯科不会忘记这一幕。"
 JAP_diplomacy.83.a: "控制群岛"
 JAP_diplomacy.84.t: "在南千岛群岛的失败"
 JAP_diplomacy.84.d: "南千岛群岛的边境冲突对我们不利。俄军抵抗顽强，我军被迫在炮火下撤退，主权问题悬而未决，我军领导层也受到质疑。\n\n我们在此过程中吸取了惨痛的教训。下一次行动将计划得更周密，物资储备更充足，也更难阻止。"
 JAP_diplomacy.84.a: "从挫折中吸取教训。"
 JAP_diplomacy.85.t: "南千岛群岛遭遇挫折"
 JAP_diplomacy.85.d: "面对日军的猛烈攻势，俄军未能守住南千岛群岛。战术上的直接损失惨重，而政治信号则更为强烈：防线岌岌可危，对手不惜一切代价也要改变战局。\n\n莫斯科将不得不决定是升级事态，还是接受这一令人屈辱的新事实。"
 JAP_diplomacy.85.a: "苦涩的教训。"
 JAP_diplomacy.86.t: "南千岛群岛安全"
 JAP_diplomacy.86.d: "俄军赢得了边境冲突，控制了南千岛群岛，击退了日军部队，重新控制了沿线地区。此次行动展现了俄军的战备状态和迅速惩罚入侵的能力。\n\n东京或许会称之为暂时的挫折，但传递的信息很明确：这些岛屿绝不会轻易被夺取。"
 JAP_diplomacy.86.a: "坚守战线"
 JAP_diplomacy.87.t: "在北千岛群岛的胜利"
 JAP_diplomacy.87.d: "日本在北千岛群岛取得突破，迫使俄军撤退，并将这些岛屿置于我方控制之下。此次行动证明，只要计划、时机和决心到位，即使是偏远地区也能被夺取。\n\n占领行动立即展开。物资源源不断地运抵，防御工事不断加强，北方边境的格局在行动中被改写。"
 JAP_diplomacy.87.a: "掘壕固守"
 JAP_diplomacy.88.t: "在北千岛群岛的失败"
 JAP_diplomacy.88.d: "北千岛群岛顽强抵抗住了我们的进攻。战斗异常惨烈，环境更加恶劣，俄军成功遏制了我们的推进，迫使我们撤退。\n\n我们带着用鲜血和疲惫换来的经验归来。下次，我们绝不会毫无准备地出发。"
 JAP_diplomacy.88.a: "我们会适应的。"
 JAP_diplomacy.89.t: "在北千岛群岛的失败"
 JAP_diplomacy.89.d: "日军在北千岛群岛的军事行动取得成功后，俄军已被逐出该地区阵地。此次失败不仅是领土上的损失，更是心理上的打击，表明距离和天气不再是可靠的防御手段。\n\n对方势必会做出回应，但报复行为本身也存在风险。局势正在迅速恶化。"
 JAP_diplomacy.89.a: "是可忍孰不可忍"
 JAP_diplomacy.90.t: "北千岛群岛安全"
 JAP_diplomacy.90.d: "俄军击退了日军的入侵，守住了北千岛群岛，在极其艰难的条件下击退了日军部队，重新控制了该地区。此次防御战使俄军的作战理论更加完善，也提升了整个指挥系统的信心。\n\n如果日本想要这些岛屿，它需要付出的代价远不止是一场边境冲突。"
 JAP_diplomacy.90.a: "保持战备状态。"
 JAP_diplomacy.91.t: "俄罗斯就桦太问题作出回应"
 JAP_diplomacy.91.d: "日本在桦太的行动立即引发了莫斯科的回应。俄罗斯领导层将此举视为对主权的直接挑战，并表示不会容忍日本的进一步行动而不承担后果。\n\n危机如今走向两条道路：要么升级为公开战争，要么通过经济措施和海上限制施加胁迫压力。无论哪种方式，局势都已超出冷静外交的范畴。"
 JAP_diplomacy.91.a: "这将演变成一场战争。"
 JAP_diplomacy.91.b: "用禁运和封锁扼杀他们。"
 JAP_diplomacy.92.t: "俄罗斯回应桦太占领事件"
 JAP_diplomacy.92.d: "桦太岛易主，莫斯科现在必须决定如何回应这场近在咫尺的耻辱。战争代价高昂，但若不予回应，则只会招致更大的损失，并削弱国家权威。\n\n俄罗斯可以选择升级冲突，试图以武力扭转局面，也可以接受暂时的和平协议，结束战斗，但要求归还桦太岛作为停火的条件。这一决定将决定冲突的下一阶段走向。"
 JAP_diplomacy.92.a: "我们将用武力夺回它"
 JAP_diplomacy.92.b: "强制达成和解。桦太岛必须归还。"
 JAP_diplomacy.94.t: "东京要求设立保护国"
 JAP_diplomacy.94.d: "日本发来一份正式照会，措辞生硬，毫无外交辞令可言。照会向首尔提出一个看似稳定的选择：接受日本对外交和安全事务的监督，使各国机构与东京的方方面面保持一致，从而避免一场破坏性的对抗。\n\n信息很明确。日本不再请求合作，而是发号施令。拒绝将被视为挑衅，而挑衅必将招致后果。"
 JAP_diplomacy.94.a: "我们别无选择。"
 JAP_diplomacy.94.b: "拒绝。韩国绝不屈服。"
 JAP_diplomacy.95.t: "韩国屈膝称臣"
 JAP_diplomacy.95.d: "首尔接受了这些条件，选择了生存而非主权。在压力下签署了协议，顾问们陆续抵达，国家的对外姿态被纳入了日本的战略规划。\n\n战争结束了，但另一种斗争开始了。朝鲜半岛依然存在于地图上，但它的未来走向已不再由自己掌控。"
 JAP_diplomacy.95.a: "建立保护国。"
 JAP_diplomacy.96.t: "韩国无视东京"
 JAP_diplomacy.96.d: "首尔拒绝了最后通牒，并宣称其主权不容谈判。这一拒绝使危机从胁迫演变为对抗，东京现在完全有理由声称该问题只能通过武力解决。\n\n如果日本想要的是臣服，那它得到的却是挑战。"
 JAP_diplomacy.96.a: "然后我们将强行实现我们的意志。"
 JAP_diplomacy.97.t: "东京向平壤发出最后通牒"
 JAP_diplomacy.97.d: "日本向平壤发出最后通牒，要么接受日本的遏制和监督，要么承受轰炸带来的毁灭性后果。条件十分明确：朝鲜必须放弃对外政策和战略自主权，接受东京的指挥；必须接受受监控的安全安排；必须服从旨在防止朝鲜再次构成威胁的框架。\n\n对朝鲜政权而言，这是耻辱；对日本而言，这是风险管理。问题在于平壤会选择生存还是反抗。"
 JAP_diplomacy.97.a: "接受。不惜一切代价保住国家。"
 JAP_diplomacy.97.b: "拒绝。我们不会屈服。"
 JAP_diplomacy.98.t: "平壤屈服"
 JAP_diplomacy.98.d: "出乎所有人意料的是，朝鲜接受了这些条件。该政权保留了其象征符号，但其行动自由受到限制，日本的监督重塑了边界、安全和外交关系。\n\n战事结束，半岛北部成为受控缓冲区。威胁解除，东京获得了一个难以轻易放手的筹码。"
 JAP_diplomacy.98.a: "建立保护国。"
 JAP_diplomacy.99.t: "平壤无视东京"
 JAP_diplomacy.99.d: "平壤拒绝接受最后通牒，选择对抗，押注恐惧和局势升级能够保护政权。这一拒绝将危机演变为一场意志的较量，东京现在有了理由声称只有武力才能征服朝鲜。\n\n半岛严阵以待，准备迎接战争。下一个消息将不是通知，而是战火。"
 JAP_diplomacy.99.a: "然后我们将自行消除威胁。"
 JAP_diplomacy.101.t: "东京要求台湾屈服"
 JAP_diplomacy.101.d: "日本已向台北提出直接要求：要么接受保护国框架，将外交政策和防务协调置于东京的监督之下，要么面临孤立和武力镇压。这一提议被包装成安全与稳定，承诺保护台北免受外部威胁，以换取政治上的服从。\n\n正式的措辞背后隐藏着一个简单的信息：这座岛屿太过重要，不能让它独立，日本决心决定它的未来。"
 JAP_diplomacy.101.a: "接受条款，避免灾难发生。"
 JAP_diplomacy.101.b: "拒绝它们。台湾不会屈服。"
 JAP_diplomacy.102.t: "台北接受"
 JAP_diplomacy.102.d: "台湾接受了最后通牒，选择生存和延续而非公开冲突。新的协议使其对外姿态与日本紧密相连，顾问陆续抵达，战略决策权悄然转移到东京。\n\n战争结束了，但主权范围却被限制在保护国允许的范围内。岛屿依然存在，但它的发展方向已不再完全由自己掌控。"
 JAP_diplomacy.102.a: "建立保护国。"
 JAP_diplomacy.103.t: "台北拒绝"
 JAP_diplomacy.103.d: "台湾拒绝了日本的要求，不愿以自治换取保护的承诺。这一决定将外交压力转化为武力危机，东京现在有了正当理由声称，只有通过征服才能确保台湾的安全。\n\n海峡变成了断层线。下一步不是谈判，而是动员。"
 JAP_diplomacy.103.a: "那么我们就任取所需。"
 JAP_diplomacy.105.t: "东京要求菲律宾设立保护国"
 JAP_diplomacy.105.d: "日本向马尼拉提出的要求不容置疑：要么接受保护国框架，使外交政策和国防规划与东京保持一致，并允许日本监督关键安全安排，要么承担拒绝的后果。\n\n这项提议表面上是为了稳定和保护，但其真正目的是控制海上航道和连接各大洋的门户。菲律宾现在必须在屈服和对抗之间做出选择。"
 JAP_diplomacy.105.a: "接受。只有如此国家才能免遭毁灭。"
 JAP_diplomacy.105.b: "拒绝。我们不会接受东京的统治。"
 JAP_diplomacy.106.t: "马尼拉归降"
 JAP_diplomacy.106.d: "菲律宾政府接受了日本的条件。协议签署，顾问抵达，该国对外姿态被纳入日本的海洋战略之中。\n\n战事虽止，代价却是主权。群岛犹存，但其战略决策将在东京的严密注视下作出。"
 JAP_diplomacy.106.a: "建立保护国。"
 JAP_diplomacy.107.t: "马尼拉违逆东京"
 JAP_diplomacy.107.d: "菲律宾拒绝了最后通牒，不愿以独立换取保护承诺。这一拒绝使日本的胁迫演变为武力试探，东京如今有充分理由宣称必须通过武力确保群岛安全。\n\n海上航道收紧，舰队开始摆出阵势，该地区已为战争做好准备。下一步将不再是外交手段。"
 JAP_diplomacy.107.a: "那我们就碾过群岛。"
 JAP_diplomacy.109.t: "对海峡之国的最后通牒"
 JAP_diplomacy.109.d: "一份语气平静却透着必然的日本照会送达吉隆坡。文件提出建立保护国协议，要求将外交政策与安全协调置于东京的指挥之下，理由是在这个海路与咽喉要道决定存亡的地区，这是维持稳定必须付出的代价。\n\n这并非请求。日本意图掌控海峡，马来亚必须服从。接受则承诺庇护，拒绝将招致海上力量的全面施压。"
 JAP_diplomacy.109.a: "接受。我们无法逆流而动。"
 JAP_diplomacy.109.b: "拒绝。我们的主权不容交易。"
 JAP_diplomacy.110.t: "吉隆坡向旭日俯首"
 JAP_diplomacy.110.d: "马来西亚接受了条款，以战略独立换取眼前的生存。协议签署，联络使团抵达，东京获得了连接两大洋的走廊钥匙。\n\n战争结束了，但代价显而易见。马来亚虽保持完整，其对外姿态却已笼罩在日本的身影之下。"
 JAP_diplomacy.110.a: "建立保护国。"
 JAP_diplomacy.111.t: "马来亚拒绝屈服"
 JAP_diplomacy.111.d: "马来西亚拒绝最后通牒，绝不容许东京主宰其未来。这一决定使日本施加的压力演变为对这片区域最具价值海上通道的争夺。\n\n东京不会容忍在马六甲海峡遭遇的违抗。若马来亚不愿通过条约屈服，日本将诉诸武力迫其就范。"
 JAP_diplomacy.111.a: "那么我们将占领海峡。"
 JAP_diplomacy.113.t: "群岛敕裁"
 JAP_diplomacy.113.d: "东京已向雅加达提出一项触及印尼独立核心的要求。该提案提出建立保护国框架，将外交政策与战略安全置于日本监管之下，并辩称这是确保连接两大洋的岛链稳定的唯一途径。\n\n措辞虽不失礼节，意图却昭然若揭。日本想要的不是主权伙伴，而是将印尼群岛作为受控走廊。接受意味着阴影下的苟安，拒绝则意味着阴影将化作风暴。"
 JAP_diplomacy.113.a: "接受。我们无法忍受海上封锁。"
 JAP_diplomacy.113.b: "拒绝。印度尼西亚不会受人指使。"
 JAP_diplomacy.114.t: "雅加达接受敕裁"
 JAP_diplomacy.114.d: "印度尼西亚接受了条款，屈从于新的海上现实。日本特派团抵达以监督安全协调、基地使用权及对外结盟事务，将这片群岛转变为东京战略势力范围内的受控走廊。\n\n战争虽已结束，但独立自主的范围被压缩至许可范围之内。这些岛屿名义上仍属印尼，但其发展轨迹如今已受日本力量的制约。"
 JAP_diplomacy.114.a: "建立保护国。"
 JAP_diplomacy.115.t: "印度尼西亚无视敕裁"
 JAP_diplomacy.115.d: "雅加达拒绝了日本的要求，不愿以主权换取稳定的承诺。这一拒绝将压力转化为对抗，东京如今视印度尼西亚的独立为必须清除的障碍，而非值得尊重的事实。\n\n群岛周边的海域局势日趋紧张。若印尼不愿通过条约屈服，日本将试图以武力迫其就范。"
 JAP_diplomacy.115.a: "那么我们将夺取走廊。"
 JAP_diplomacy.117.t: "东京方案"
 JAP_diplomacy.117.d: "东京已向河内递交了一份旨在将越南纳入日本海上秩序的要求。这份提议实质上是一种保护国安排：越南需调整外交政策、接受日本的安全监督，并允许战略准入，从而使其海岸线成为日本势力范围的延伸。\n\n尽管该提议被包装成抵御更强大掠食者的保护伞，但它同时也是一条锁链。越南必须决定是接受受制于人的生存方式，还是选择抵抗并引发一场将在其海岸线上打响的战争。"
 JAP_diplomacy.117.a: "接受。我们暂且屈服。"
 JAP_diplomacy.117.b: "拒绝。越南不会受制于人。"
 JAP_diplomacy.118.t: "河内接受东京条款"
 JAP_diplomacy.118.d: "越南接受了最后通牒。协议签署，联络官抵达，日本获得了对越南外交路线与海岸防务的决定性影响力。\n\n战争虽已结束，独立却遭限缩。越南犹存，然其战略态势如今只能在东京书写的框架内游移。"
 JAP_diplomacy.118.a: "建立保护国。"
 JAP_diplomacy.119.t: "河内拒绝东京方案"
 JAP_diplomacy.119.d: "越南拒绝了日本的要求，拒绝以主权换取安全承诺。这一拒绝将胁迫升级为对抗，东京如今视越南为其区域布局中必须清除的障碍。\n\n海岸线变成了前线。如果越南不愿通过条约屈服，日本将寻求以武力迫使其就范。"
 JAP_diplomacy.119.a: "那么我们就拿下海岸。"
 JAP_diplomacy.121.t: "湄公河最后通牒"
 JAP_diplomacy.121.d: "一支日本代表团抵达，带来的提议读起来不似外交辞令，更似最终判决。柬埔寨被提议置于东京监管之下获得保护，其外交政策协调与安全安排将被纳入日本的区域框架之中。\n\n日方描绘的前景是稳定、投资与免受强邻威胁的安全保障。而现实则是附庸地位。金边必须抉择：是接受受制于人的未来，还是冒着沦为拒绝者的战场之险。"
 JAP_diplomacy.121.a: "接受。生存第一位。"
 JAP_diplomacy.121.b: "拒绝。柬埔寨绝不屈服。"
 JAP_diplomacy.122.t: "金边接受"
 JAP_diplomacy.122.d: "柬埔寨接受了条件，为避免一场无法取胜的战争而让渡了战略自主权。新协议将国家与日本的发展方向绑定，东京的顾问迅速进驻以掌控关键部门与战略节点。\n\n战火尚未燃起便已熄灭。柬埔寨名义上保持主权，但其发展道路已被日本力量所制约。"
 JAP_diplomacy.122.a: "建立保护国。"
 JAP_diplomacy.123.t: "柬埔寨拒绝湄公河最后通牒"
 JAP_diplomacy.123.d: "金边拒绝了日本的要求，拒绝将本国的未来交由外国监管。这一拒绝将压力升级为对抗，东京现在视柬埔寨为必须加以约束的薄弱环节。\n\n外交努力已然失败。如果柬埔寨不接受这一框架，日本将寻求通过武力强行实施。"
 JAP_diplomacy.123.a: "那么我们就诉诸武力。"
 JAP_diplomacy.125.t: "索要湄公河腹地"
 JAP_diplomacy.125.d: "日本已向万象提出要求，旨在确保海岸线后方的战略纵深。该提议以保护国框架将老挝纳入东京的战略轨道，使其外交政策与安全协调皆受日本监管。\n\n日方将此项提议包装为发展与保护。其意图昭然若揭：所有通道、河流与边境都将被纳入日本大东亚共荣圈的治理体系。老挝必须抉择——是接受这份指令，还是冒险抵抗。"
 JAP_diplomacy.125.a: "接受。我们独木难支。"
 JAP_diplomacy.125.b: "拒绝。老挝不会受人摆布。"
 JAP_diplomacy.126.t: "万象接受"
 JAP_diplomacy.126.d: "老挝接受了日本的条件，选择生存与稳定，而非一场无力承担的战争。协议签署，协调办公室成立，老挝作为受控腹地被纳入东京的区域框架。\n\n战火虽熄，自治却缩。老挝犹存，然其战略抉择如今只能在日本设定的界限内挪移。"
 JAP_diplomacy.126.a: "建立保护国。"
 JAP_diplomacy.127.t: "老挝拒绝接受指令"
 JAP_diplomacy.127.d: "万象拒绝了日本的要求，拒绝将其未来交由外部监督。这一拒绝将胁迫转变为对抗，东京现在将老挝视为控制走廊的障碍，而非需要拉拢的伙伴。\n\n如果老挝不愿通过条约接受这一框架，日本将试图以武力强加。"
 JAP_diplomacy.127.a: "那么我们就让他们称臣。"
 JAP_diplomacy.129.t: "南方之锚最后通牒"
 JAP_diplomacy.129.d: "东京已向堪培拉发出最后通牒，其内容并非将澳大利亚视为遥远大陆，而是作为南太平洋的拱心石。条款十分苛刻：接受保护国框架，使外交政策与国防规划与日本保持一致，并允许日军驻扎及通行——这将使整个南太平洋落入东京的掌控之中。\n\n这份提案被包装成稳定与安全保障。实则意味着战略屈服。澳大利亚必须抉择：是接受在日本阴影下生存，还是准备在这片海洋上奋起抗争。"
 JAP_diplomacy.129.a: "接受。我们无法赢得太平洋战争。"
 JAP_diplomacy.129.b: "拒绝。澳大利亚绝不屈服。"
 JAP_diplomacy.130.t: "堪培拉接受条款"
 JAP_diplomacy.130.d: "澳大利亚接受了日本的最后通牒，选择即刻生存而非冒险参与一场无法承受的大陆战争。协议签署，战略通道开放，日本获得了其谋求主宰更广阔海域所需的南方支点。\n\n枪声虽已沉寂，太平洋的力量平衡却在一夜之间改变。澳大利亚仍在地图上存在，但其战略决策如今只能在东京设定的框架内挪移。"
 JAP_diplomacy.130.a: "建立保护国。"
 JAP_diplomacy.131.t: "澳大利亚拒绝最后通牒"
 JAP_diplomacy.131.d: "堪培拉拒绝了日本的要求，拒绝将大陆的独立主权拱手让给外国托管。这一拒绝将东京的压力转化为直接挑战，日本现在将澳大利亚描绘成其掌控太平洋秩序的最后障碍。\n\n一场海洋争夺战已不可避免。如果澳大利亚不愿通过条约接受这一框架，日本将试图以武力强加于人。"
 JAP_diplomacy.131.a: "那么我们就兴兵南征。"
 JAP_diplomacy.133.t: "塔斯曼线要求"
 JAP_diplomacy.133.d: "东京已向惠灵顿递交最后通牒，意图关闭南太平洋最后一道开放侧翼。这份以保护国框架为名的提案，将新西兰的外交政策与国防态势捆绑于日本主导之下，并宣称这是武力重组太平洋秩序所必须付出的稳定代价。\n\n文本字面提及保护与伙伴关系，实质架构却充满控制意味。新西兰此刻面临抉择：是接受日本阴影下的受限和平，还是为跨海独立而战。"
 JAP_diplomacy.133.a: "接受。我们将忍耐，并生存下去。"
 JAP_diplomacy.133.b: "拒绝。我们不会被吞并。"
 JAP_diplomacy.134.t: "惠灵顿接受塔斯曼线"
 JAP_diplomacy.134.d: "新西兰接受了日本的条件，以战略自主权换取战事终结。协议签署，准入安排确立，东京由此获得稳固的南方前哨，得以掌控更广阔的海洋。\n\n战争虽已结束，独立却遭限缩。新西兰犹存，然其对外姿态从此只能在东京划定的边界内游移。"
 JAP_diplomacy.134.a: "建立保护国。"
 JAP_diplomacy.135.t: "惠灵顿拒绝要求"
 JAP_diplomacy.135.d: "新西兰拒绝了日本的最后通牒，拒绝将自身未来交予外国托管。这一拒绝将压力转化为对抗，东京现在视惠灵顿的独立为其南部防线的威胁。\n\n太平洋地区正固化为战线前沿。若新西兰不愿通过条约接受既定框架，日本将试图以武力强行实施。"
 JAP_diplomacy.135.a: "那么我们就进军南疆。"
 JAP_diplomacy.137.t: "伊洛瓦底门户最后通牒"
 JAP_diplomacy.137.d: "东京已向内比都发出要求，旨在将缅甸打造为连接两洋的陆桥。其条款实为保护国框架：外交政策与日本保持一致，接受日本安全监督，并开放从孟加拉湾进入东南亚的战略通道所需权限。\n\n日方将此提议包装为稳定与发展之策，实质却是战略攫取。缅甸必须抉择：是接受受控的和平，还是直面将使国门沦为战场的战争。"
 JAP_diplomacy.137.a: "接受。我们无法承受这样的压力。"
 JAP_diplomacy.137.b: "拒绝。我们绝不会沦为一个走廊。"
 JAP_diplomacy.138.t: "缅甸接受门户条款"
 JAP_diplomacy.138.d: "缅甸接受了日本的最后通牒，以战略自主权换取战事终结与秩序承诺。协议签署，联络团抵达，日本由此掌控了缅甸对外结盟与安全态势的决定性主导权。\n\n战火虽熄，代价却是主权。缅甸犹存，但其门户如今已服务于东京擘画的区域布局。"
 JAP_diplomacy.138.a: "建立保护国。"
 JAP_diplomacy.139.t: "缅甸拒绝最后通牒"
 JAP_diplomacy.139.d: "内比都拒绝了日本的要求，拒绝将其未来交由外部监督。这一拒绝将压力转化为对抗，东京如今将缅甸定性为必须纳入轨道的走廊控制障碍。\n\n如果缅甸不接受条约框架，日本将寻求以武力强加。无论如何，这条通道都将被牢牢掌控。"
 JAP_diplomacy.139.a: "那么我们就拿下门户。"
 JAP_diplomacy.141.t: "北部高地最后通牒"
 JAP_diplomacy.141.d: "日本已将目光投向克钦邦，这片崎岖的北部高地控制着山口、资源以及通往更广阔地区的通道。东京方面的要求被包装成保护与承认，但其本质是保护国架构：对外与日本结盟，接受安全监督，并允许战略通道的开放以巩固边境防线。\n\n对克钦邦而言，这无异于在名义上的自治与实际上的覆灭之间做选择。接受协议能获得庇护，拒绝则意味着战火将蔓延至群山与村落。"
 JAP_diplomacy.141.a: "接受。我们需要一位庇护者才能生存下去。"
 JAP_diplomacy.141.b: "拒绝。我们不会用一个主子去换另一个主子。"
 JAP_diplomacy.143.t: "克钦接受日本保护"
 JAP_diplomacy.143.d: "克钦接受了条件，选择生存与稳定，而非独自支撑一场无法持续的战争。协议签署，联络处设立，日本牢牢掌控了北部高地及其战略走廊。\n\n冲突虽已结束，但克钦的自由被压缩至许可范围之内。群山依旧，其未来却已与东京紧密相连。"
 JAP_diplomacy.143.a: "建立保护国。"
 JAP_diplomacy.144.t: "克钦拒绝最后通牒"
 JAP_diplomacy.144.d: "克钦拒绝了日本的要求，拒绝屈从于外部指令。这一拒绝将胁迫转变为对抗，东京如今将这片高地定性为必须通过武力解决的安全问题。\n\n如果克钦不愿接受条约保护，日本将以武力强加控制。这片山区将无法保持中立。"
 JAP_diplomacy.144.a: "那么我们就拿下高地。"
 JAP_diplomacy.145.t: "掸邦走廊要求"
 JAP_diplomacy.145.d: "日本已向佤邦当局提出条件，目标直指那些位于走私路线、山口要道及内陆动脉的边境地带。这份提议表面上被包装为承认与保护，实则是一份保护国协议：对外需与东京保持一致，接受日本的安全监管，并允许日方进入以确保走廊畅通。\n\n对佤邦而言，这是一个残酷的选择。要么屈服于新庇护伞下维持地方权力，要么拒绝并面临一场不会顾及山峦险阻或民兵抵抗的战争。"
 JAP_diplomacy.145.a: "接受。宁为盾牌，也不愿被彻底毁灭。"
 JAP_diplomacy.145.b: "拒绝。我们绝不会被吞并。"
 JAP_diplomacy.146.t: "佤邦接受保护"
 JAP_diplomacy.146.d: "佤邦接受了日本的条件，以战略独立换取生存，并在强大庇护者下获得正式承认。联络小组抵达，路线得以保障，边境地区被纳入日本的区域框架。\n\n战事虽已结束，自治空间却日益收窄。佤邦虽保留地方治理权，但其对外方针如今须听命于东京。"
 JAP_diplomacy.146.a: "建立保护国。"
 JAP_diplomacy.147.t: "佤邦拒绝要求"
 JAP_diplomacy.147.d: "佤邦拒绝了日本的最后通牒，拒绝将领土置于外国监管之下。这一拒绝将压力转化为对抗，东京现在视边境地区为其走廊战略中失控的缺口。\n\n如果佤邦不愿通过条约接受这一框架，日本将用武力强加控制。山区将成为争夺的战场。"
 JAP_diplomacy.147.a: "那么我们将夺取走廊。"
 JAP_diplomacy.148.t: "掸邦走廊最后通牒"
 JAP_diplomacy.148.d: "日本已向南掸邦当局提出要求，目标直指连接内陆与更广阔区域的高地通道。该提议以保护国框架为核心：对外事务需与东京协调一致，接受日本的安全监督，并允许对方战略性地使用其道路、关隘及补给走廊。\n\n此项提议承诺提供保护与承认，实则意味着掌控。南掸邦必须抉择：是接受在日本羽翼下受控的未来，还是冒着战火席卷其山川河谷的风险。"
 JAP_diplomacy.148.a: "接受。我们不能承受被歼灭的代价。"
 JAP_diplomacy.148.b: "拒绝。我们绝不会沦为一个走廊国家。"
 JAP_diplomacy.149.t: "南掸邦屈服"
 JAP_diplomacy.149.d: "南掸邦接受了日本的条件。联络处得以建立，路线获得保障，该地区被纳入东京的走廊战略，成为一个受控门户而非独立行动者。\n\n战斗虽已结束，自治却受到限制。地方当局得以保留，但战略方向如今需听从日本指挥。"
 JAP_diplomacy.149.a: "建立保护国。"
 JAP_diplomacy.150.t: "南掸邦拒绝最后通牒"
 JAP_diplomacy.150.d: "南掸邦拒绝了日本的要求，拒绝将其未来置于外国监督之下。这一拒绝将压力转化为对抗，东京现在视该地区为其战略防线上的危险缺口。\n\n如果南掸邦不接受条约框架，日本将动用武力强行实施。这扇大门必须被牢牢掌控。"
 JAP_diplomacy.150.a: "那么我们就拿下门户。"
 JAP_diplomacy.151.t: "萨尔温江托管区"
 JAP_diplomacy.151.d: "日本已将目光投向克伦邦，那里的河谷与边境通道掌控着南方路线的开合。东京方面以保护与承认为名提出要求，实则构建保护国框架：对外事务须与日本协调，接受安全监督，并开放萨尔温江走廊的通行权。\n\n这项提议承诺为权力破碎的地区带来稳定，代价是绝对的服从。克伦邦必须做出抉择：是接受日本庇护下的武装和平，还是迎接一场焚毁渡口与村镇的战争。"
 JAP_diplomacy.151.a: "接受。我们将活到明天。"
 JAP_diplomacy.151.b: "拒绝。我们不会受人统治。"
 JAP_diplomacy.152.t: "克伦邦归顺"
 JAP_diplomacy.152.d: "克伦邦接受了日本的条件，以战略自主权换取生存空间与即时压力的解除。联络使团抵达，交通线路被控制，这片区域作为受控走廊而非独立行为体被纳入东京的势力范围。\n\n冲突虽已结束，自由的边界却在收缩。克伦当局仍保有地方治理权，但战略方向从此听命于日本。"
 JAP_diplomacy.152.a: "建立保护国。"
 JAP_diplomacy.153.t: "克伦邦拒绝接受委任统治"
 JAP_diplomacy.153.d: "克伦邦拒绝了日本的要求，拒绝将其未来交由外国监管。这一拒绝将胁迫转变为对抗，东京现在将萨尔温江渡口视为需要通过武力解决的战略问题。\n\n如果克伦邦不接受条约框架，日本将通过武力强行实施。这条走廊必须得到保障。"
 JAP_diplomacy.153.a: "那么我们就夺取渡口。"
 JAP_diplomacy.154.t: "帕劳锚地要求"
 JAP_diplomacy.154.d: "东京已向帕劳发出最后通牒，这个坐拥广阔海域的小国面临抉择。条款以保障安全与繁荣为名，实则构建保护国体系：外交政策需与日本保持一致，接受安全监管，并授予驻军权——这将使帕劳成为帝国前进的锚地。\n\n提案承诺为其遮蔽政治与军事的风暴，代价则是国家主权。帕劳必须在旭日旗下的臣服与对抗海洋强权的不自量力之战间作出选择。"
 JAP_diplomacy.154.a: "接受。与其进坟墓，不如被附庸。"
 JAP_diplomacy.154.b: "拒绝。我们绝不会放弃独立。"
 JAP_diplomacy.155.t: "帕劳接受日本保护"
 JAP_diplomacy.155.d: "帕劳接受了日本的条件。协议签署，准入权被授予，这些岛屿成为东京港口与机场网络中一个纪律严明的节点。\n\n危机在没有战斗的情况下结束，但变化是真实的。帕劳名义上依然存在，但其外部导向如今已遵循日本的罗盘指引。"
 JAP_diplomacy.155.a: "建立保护国。"
 JAP_diplomacy.156.t: "帕劳拒绝要求"
 JAP_diplomacy.156.d: "帕劳拒绝了日本的最后通牒，拒绝以主权换取保护承诺。这一拒绝将东京的压力转化为武力问题，日本现在视这些岛屿为其海洋防线上一个未设防的缺口。\n\n如果帕劳不接受条约框架，日本将通过武力实施控制。锚地将被确保安全。"
 JAP_diplomacy.156.a: "那我们就夺取锚地。"
 JAP_diplomacy.157.t: "密克罗尼西亚岛链最后通牒"
 JAP_diplomacy.157.d: "日本已向密克罗尼西亚提出要求，视这些岛屿并非分散的社区，而是横跨太平洋中部的跳板链。提议被包装为保护与投资，实则构建保护国体系：外交政策需与东京保持一致，接受安全监管，并开放准入权限，使群岛成为日本舰队与航空力量的战略支点。\n\n讯息很明确：这片海域将被纳入单一管辖体系。密克罗尼西亚必须在日本庇护下的受控和平，与一场注定无法承受的对抗之间作出抉择。"
 JAP_diplomacy.157.a: "接受。我们无法逆流而动。"
 JAP_diplomacy.157.b: "拒绝。我们不会成为任何人的哨站。"
 JAP_diplomacy.158.t: "密克罗尼西亚接受协议"
 JAP_diplomacy.158.d: "密克罗尼西亚接受了日本的条件。协议签署，准入权被授予，这些岛屿成为东京海上防线内一个由港口、机场和监控节点组成的受控走廊。\n\n危机在没有爆发战斗的情况下结束，但主权范围收窄。密克罗尼西亚依然存在，然而其对外方向如今遵循日本的战略罗盘指引。"
 JAP_diplomacy.158.a: "建立保护国。"
 JAP_diplomacy.159.t: "密克罗尼西亚拒绝最后通牒"
 JAP_diplomacy.159.d: "密克罗尼西亚拒绝了日本的要求，拒绝将其未来交予外国监督。这一拒绝将压力转化为对抗，东京现在视该岛链为其太平洋网络中的缺口，必须予以填补。\n\n如果密克罗尼西亚不接受条约框架，日本将动用武力强行控制。这条岛链必须被掌控。"
 JAP_diplomacy.159.a: "那么我们就一步步将之踏平。"
 JAP_diplomacy.160.t: "索要瑙鲁"
 JAP_diplomacy.160.d: "东京已向瑙鲁提出要求，将其视为地图上的一枚图钉——仍可在此锚定监视力量、进行燃料补给，并跨越开阔水域延伸触角。这份提议被包装成保护与保障支持，实则建立保护国框架：外交政策需与日本保持一致，接受安全监督，并开放准入权，使瑙鲁转变为帝国的前哨站。\n\n对瑙鲁而言，选择残酷而鲜明。屈服于强权之下苟存，或是拒绝并冒险成为验证日本论点的战场。"
 JAP_diplomacy.160.a: "接受。我们独木难支。"
 JAP_diplomacy.160.b: "拒绝。我们绝不会沦为别人的中转站。"
 JAP_diplomacy.161.t: "瑙鲁接受日本保护"
 JAP_diplomacy.161.d: "瑙鲁接受了日本的条件。协议签署，准入许可，这座岛屿成为东京太平洋网络中虽小却至关重要的节点。\n\n危机未起战火便告平息，但主权范围收窄。瑙鲁依然存在，然而其对外方针如今遵循日本的战略路线。"
 JAP_diplomacy.161.a: "建立保护国。"
 JAP_diplomacy.162.t: "瑙鲁拒绝要求"
 JAP_diplomacy.162.d: "瑙鲁拒绝了日本的最后通牒，不愿以独立为代价换取保护承诺。这一拒绝将压力升级为对抗，东京如今视该岛为其海洋防线上的未设防缺口。\n\n若瑙鲁不接受条约框架，日本将以武力实施控制。这个前哨基地必须被掌控。"
 JAP_diplomacy.162.a: "那么我们就扫平此岛。"
 JAP_diplomacy.163.t: "赤道线最后通牒"
 JAP_diplomacy.163.d: "日本已向基里巴斯提出要求，这个如航海图标记般散落在赤道上的岛国。东京方面将提案包装成保护与发展计划，实则构建保护国框架：外交政策须与日本保持一致，接受安全监管，并开放准入权限——这将使基里巴斯化为监控网络与海军力量投射的岛链前哨。\n\n讯息很明确：在新太平洋秩序中不存在真空地带。基里巴斯必须在臣服于日本庇护伞下，或是与意图掌控航道的强权正面对抗之间作出抉择。"
 JAP_diplomacy.163.a: "接受。我们无法抗拒海洋的新主人。"
 JAP_diplomacy.163.b: "拒绝。我们绝不会被任何帝国吞并。"
 JAP_diplomacy.164.t: "基里巴斯接受赤道线"
 JAP_diplomacy.164.d: "基里巴斯接受了日本的条件。协议签署，准入权获得，这些分散的环礁成为东京太平洋网络中安静却宝贵的一环。\n\n危机未起战端便告终结，但主权范围已然收窄。基里巴斯依然存在，然而其对外航向如今已随日本的罗盘而定。"
 JAP_diplomacy.164.a: "建立保护国。"
 JAP_diplomacy.165.t: "基里巴斯拒绝最后通牒"
 JAP_diplomacy.165.d: "基里巴斯拒绝了日本的最后通牒，拒绝将其未来交由外国监管。这一拒绝将压力转化为对抗，东京现在视这条赤道岛链为其海上防线的缺口。\n\n如果基里巴斯不接受条约框架，日本将动用武力强行控制。这条防线必须被巩固。"
 JAP_diplomacy.165.a: "那么我们就夺取岛链。"
 JAP_diplomacy.166.t: "索要环礁堡垒"
 JAP_diplomacy.166.d: "东京已向马绍尔群岛提出要求，将环礁视为可部署机场、后勤设施及海上控制体系的天然堡垒。这份提议以提供保护与保障支持为名，实则构建保护国框架：要求其外交政策与日本保持一致，接受安全监管，并开放准入权限，使马绍尔群岛成为日本中太平洋防线的战略支点。\n\n信号清晰无误。这些岛屿不会继续作为海图上中立的点缀存在。马绍尔群岛必须在日本庇护下的受控和平，与围绕珊瑚礁和跑道的战争之间做出抉择。"
 JAP_diplomacy.166.a: "接受。我们无法在围困中生存。"
 JAP_diplomacy.166.b: "拒绝。我们绝不会成为其他强权的堡垒。"
 JAP_diplomacy.167.t: "马绍尔群岛陷落"
 JAP_diplomacy.167.d: "马绍尔群岛接受了日本的条件。协议签署，准入许可，环礁成为东京海洋网络中纪律严明的堡垒。\n\n危机未起战火便告结束，但主权范围收窄。马绍尔群岛犹在，然其对外航向如今遵循着日本的环海布局。"
 JAP_diplomacy.167.a: "建立保护国。"
 JAP_diplomacy.168.t: "马绍尔群岛拒绝要求"
 JAP_diplomacy.168.d: "马绍尔群岛拒绝了日本的最后通牒，拒绝将自身未来交予外国监管。这一拒绝将压力转化为对抗，东京现在视这些环礁为其中太平洋防线的未设防缺口。\n\n若马绍尔群岛不愿通过条约接受既定框架，日本将诉诸武力实施控制。这些堡垒必须得到巩固。"
 JAP_diplomacy.168.a: "那么我们就进占环礁。"
 JAP_diplomacy.169.t: "礁线最后通牒"
 JAP_diplomacy.169.d: "日本已向图瓦卢提出要求，这片由珊瑚礁构成的狭长岛链在衡量远洋辐射与补给节点的太平洋版图中仍具战略价值。东京方面承诺提供保护与支持，但协议框架实为保护国模式：图瓦卢需调整外交政策与日本保持一致，接受安全监管，并开放准入权限，使其成为日本南部防线的中转支点。\n\n这份声明以赤裸裸的简洁传递出残酷现实：在争端迭起的太平洋上，不存在中立岛屿。图瓦卢必须在日本的庇护伞下屈服，或是卷入足以淹没小国的大国战争对抗之中。"
 JAP_diplomacy.169.a: "接受。我们无法抵挡钢铁风暴的侵袭。"
 JAP_diplomacy.169.b: "拒绝。我们绝不会降下自己的旗帜。"
 JAP_diplomacy.170.t: "图瓦卢接受日本保护"
 JAP_diplomacy.170.d: "图瓦卢接受了日本的条件。协议签署，准入许可生效，这些岛屿成为东京海上网络中一个安静的节点。\n\n危机未起战端便告结束，但主权范围收窄。图瓦卢依然存在，但其外部走向如今遵循着日本的周边布局。"
 JAP_diplomacy.170.a: "建立保护国。"
 JAP_diplomacy.171.t: "图瓦卢拒绝最后通牒"
 JAP_diplomacy.171.d: "图瓦卢拒绝了日本的最后通牒，不愿以独立换取所谓的保护承诺。这一拒绝将压力升级为对抗，东京现在视这片礁岛链为其南部防线的未设防缺口。\n\n既然图瓦卢不愿通过条约接受既定框架，日本将诉诸武力实施控制。这条中转要道必须被掌控。"
 JAP_diplomacy.171.a: "那么我们就扫平诸岛。"
 JAP_diplomacy.172.t: "所罗门屏障最后通牒"
 JAP_diplomacy.172.d: "东京已向所罗门群岛提出要求，将其视为能够封锁西南太平洋的天然屏障。这项提议以保护与发展为名，实则建立保护国框架：外交政策需与日本保持一致，接受安全监督，并允许日本建立军事基地——这将使所罗门群岛成为日本海上防线的加固屏障。\n\n信号很明确：这些岛屿要么服从日本秩序，要么被视作敌方据点。所罗门群岛必须在旭日旗下的臣服与遍布丛林机场和狭窄海域的战争之间做出选择。"
 JAP_diplomacy.172.a: "接受。我们无法在围困中生存。"
 JAP_diplomacy.172.b: "拒绝。我们绝不会成为其他强权的堡垒。"
 JAP_diplomacy.173.t: "所罗门屈服"
 JAP_diplomacy.173.d: "所罗门群岛接受了日本的条件。双方签署协议，日本获得了军事通行权，这条群岛链在东京的指挥下，成为由港口、机场和巡逻区组成的纪律严明的屏障。\n\n危机以和平方式结束，但主权范围缩小。所罗门群岛依然存在，但其对外政策如今却遵循了日本的周边防线。"
 JAP_diplomacy.173.a: "建立保护国。"
 JAP_diplomacy.174.t: "所罗门拒绝最后通牒"
 JAP_diplomacy.174.d: "所罗门群岛拒绝日本的要求，不愿将自身未来拱手让给外国势力。这一拒绝使压力升级为对抗，东京如今将这条海峡视为其西南太平洋防线上的一个危险缺口。\n\n如果所罗门群岛不接受条约框架，日本将以武力控制该地区，确保屏障安全。"
 JAP_diplomacy.174.a: "那么我们就夺取岛链。"
 JAP_diplomacy.175.t: "新几内亚堡垒最后通牒"
 JAP_diplomacy.175.d: "日本已向巴布亚新几内亚提出要求，将该岛视为能够控制东南亚与太平洋之间通道的大陆堡垒。日本声称将提供保护和有保障的支持，但实际上却是一个保护国框架：巴布亚新几内亚必须使其外交政策与东京保持一致，接受安全监督，并允许日本使用军事基地，从而将新几内亚打造成一个集空中力量、后勤保障和前沿防御于一体的堡垒。\n\n这一信息传递得非常明确：日本意图将南部战区以此为中心。巴布亚新几内亚必须在臣服于日本的庇护之下，还是卷入一场将沿海和高地变成前线的战争之间做出选择。"
 JAP_diplomacy.175.a: "接受。我们不能成为战场。"
 JAP_diplomacy.175.b: "拒绝。我们绝不会成为其他强权的堡垒。"
 JAP_diplomacy.176.t: "莫尔兹比港接受"
 JAP_diplomacy.176.d: "巴布亚新几内亚接受了日本的条件。双方签署协议，日本获得军事通行权，该岛成为东京南部防线内一个纪律严明的堡垒，围绕着机场、港口和物流中心而建。\n\n危机在没有战争的情况下结束，但主权范围却缩小了。巴布亚新几内亚依然存在，但其战略方向如今却遵循着日本的要塞计划。"
 JAP_diplomacy.176.a: "建立保护国。"
 JAP_diplomacy.177.t: "巴布亚新几内亚拒绝最后通牒"
 JAP_diplomacy.177.d: "巴布亚新几内亚拒绝了日本的要求，拒绝将其未来交由外国监管。这一拒绝将压力转化为对抗，东京现在视该岛为确保南方战区安全的关键障碍。\n\n如果巴布亚新几内亚不接受条约框架，日本将通过武力强行控制。这座堡垒终将被攻占。"
 JAP_diplomacy.177.a: "那么我们就夺取堡垒。"
 JAP_diplomacy.178.t: "南太平洋岛链要求"
 JAP_diplomacy.178.d: "东京已向瓦努阿图提出要求，将其视为封锁西南太平洋的又一环。这份提议以保护和发展援助为名，实则建立保护国框架：外交政策需与日本保持一致，接受安全监督，并开放准入权，使瓦努阿图成为巡逻、加油和区域控制的战略支点。\n\n信号清晰无疑。日本正逐岛构建其防御圈。瓦努阿图必须在旭日旗下受控的和平，与一场注定无法持续的对抗之间做出抉择。"
 JAP_diplomacy.178.a: "接受。我们无法在海上与一个帝国抗衡。"
 JAP_diplomacy.178.b: "拒绝。我们不会被吞并。"
 JAP_diplomacy.179.t: "瓦努阿图接受日本保护"
 JAP_diplomacy.179.d: "瓦努阿图接受了日本的条件。协议签署，准入许可获批，这些岛屿成为东京南部防线中一个安静却有用的节点。\n\n危机未起战端便告终结，但主权范围已然收窄。瓦努阿图依然存在，只是其对外方针如今需遵循日本的战略路线。"
 JAP_diplomacy.179.a: "建立保护国。"
 JAP_diplomacy.180.t: "瓦努阿图拒绝要求"
 JAP_diplomacy.180.d: "瓦努阿图拒绝了日本的最后通牒，不愿以独立为代价换取所谓的保护承诺。这一拒绝将压力转化为对抗，东京如今视这些岛屿为其西南太平洋防线的未设防缺口。\n\n若瓦努阿图不愿通过条约接受既定框架，日本将以武力强行掌控。这条战略纽带必须被牢牢锁住。"
 JAP_diplomacy.180.a: "那么我们就扫平诸岛。"
 JAP_diplomacy.181.t: "南太基石最后通牒"
 JAP_diplomacy.181.d: "日本已向斐济提出要求，将这片群岛视为支撑其南太平洋广阔海域舰队后勤与空中作战的枢纽。这项提议以提供保护与保障支持为名，实则构建保护国框架：外交政策需与东京保持一致，接受安全监管，并提供基地使用权——这将使斐济成为日本南方防线的基石。\n\n信号清晰无误。日本并非在寻求友邦，而是在构建秩序。斐济必须做出选择：要么在日本羽翼下接受被掌控的和平，要么直面一场将由海上力量决定的对抗。"
 JAP_diplomacy.181.a: "接受。我们绝不能被拿来杀鸡儆猴。"
 JAP_diplomacy.181.b: "拒绝。斐济不会屈服。"
 JAP_diplomacy.182.t: "斐济接受基石协议条款"
 JAP_diplomacy.182.d: "斐济接受了日本的最后通牒。双方签署了协议，日本获得了军事通行权，这些岛屿成为东京在南太平洋建立的港口、机场和巡逻区网络中的中心节点。\n\n危机以和平方式结束，但主权范围却有所缩小。斐济依然存在，但其对外发展方向如今却要遵循日本的周边战略。"
 JAP_diplomacy.182.a: "建立保护国。"
 JAP_diplomacy.183.t: "斐济拒绝最后通牒"
 JAP_diplomacy.183.d: "斐济拒绝了日本的要求，不愿将自己的未来拱手让给外国势力。这一拒绝使压力演变为对抗，东京现在将这些岛屿视为其南部防线最后一道缺口，并计划将其彻底封锁。\n\n如果斐济不接受条约框架，日本将以武力控制斐济，确保其安全。"
 JAP_diplomacy.183.a: "那么我们就接管枢纽。"
 JAP_diplomacy.184.t: "萨摩亚线最后通牒"
 JAP_diplomacy.184.d: "东京向萨摩亚提出要求，将萨摩亚群岛视为连接中太平洋和南部海域的枢纽。东京声称提供保护和支持，但实际上这是一种保护国模式：萨摩亚必须使其外交政策与日本保持一致，接受安全监管，并允许日本进入其海域，从而成为日本不断扩张的海洋边界上的一个中转站。\n\n信息很明确。日本正在海上划定界限，而萨摩亚就位于其中一条线上。接受意味着在更强大的力量统治下获得安全感，拒绝则可能成为他人效仿的榜样。"
 JAP_diplomacy.184.a: "接受吧。即使必须屈服，我们也能生存下去。"
 JAP_diplomacy.184.b: "拒绝。萨摩亚绝不屈服。"
 JAP_diplomacy.185.t: "萨摩亚接受日本保护"
 JAP_diplomacy.185.d: "萨摩亚接受了日本的最后通牒。双方签署了协议，日本获得了军事通行权，这些岛屿成为了东京太平洋网络中一个低调但重要的节点。\n\n危机以和平方式结束，但主权范围却有所缩小。萨摩亚依然存在，但其对外方向如今却与日本的战略路线保持一致。"
 JAP_diplomacy.185.a: "建立保护国。"
 JAP_diplomacy.186.t: "萨摩亚拒绝最后通牒"
 JAP_diplomacy.186.d: "萨摩亚拒绝了日本的要求，不愿以独立换取保护承诺。这一拒绝使压力演变为对抗，东京现在将这些岛屿视为其海洋防线上的一个安全漏洞。\n\n如果萨摩亚不接受条约框架，日本将以武力控制该地区，确保其安全。"
 JAP_diplomacy.186.a: "那么我们就扫平诸岛。"
 JAP_diplomacy.187.t: "汤加王室的要求"
 JAP_diplomacy.187.d: "东京向汤加王国提出了要求，汤加的港口和航道位于太平洋南缘。东京声称要提供保护和伙伴关系，但实际上却是一个保护国框架：汤加必须与日本的外交政策保持一致，接受安全监管，并允许日本进入其不断扩张的海上安全区，使其成为日本海上安全区内的一个中转站。\n\n信息很明确：日本正在构建一个不容许任何独立行动的海洋秩序。汤加必须在两种选择中做出抉择：要么接受日本庇护下的和平，要么面对由舰队决定的对抗。"
 JAP_diplomacy.187.a: "接受吧。即便身处阴影之下，我们仍将保有王冠。"
 JAP_diplomacy.187.b: "拒绝。汤加不会屈服。"
 JAP_diplomacy.188.t: "汤加接受日本保护"
 JAP_diplomacy.188.d: "汤加接受了日本的条件。双方签署协议，日本获得了军事通行权，汤加王国成为东京南方网络中一个受约束的节点。\n\n危机和平结束，但主权范围缩小。汤加依然存在，但其对外方向如今已与日本的战略路线保持一致。"
 JAP_diplomacy.188.a: "建立保护国。"
 JAP_diplomacy.189.t: "汤加拒绝了这一要求"
 JAP_diplomacy.189.d: "汤加拒绝接受日本的最后通牒，拒绝将自身未来置于外国的掌控之下。这一拒绝使压力演变为对抗，东京如今将汤加王国视为其南部战略中的一个薄弱环节。\n\n如果汤加不接受条约框架，日本将以武力控制该区域。该航道点将得到保障。"
 JAP_diplomacy.189.a: "那么我们就扫平诸岛。"
 JAP_diplomacy.190.t: "致华盛顿的通知：太平洋撤军"
 JAP_diplomacy.190.d: "东京已向华盛顿正式提出要求，要求美国归还其在太平洋地区占据的关键岛屿。东京的表态十分明确：日本不再容忍外国势力在日本周边海域的存在，必须放弃这些前哨基地，以防止局势进一步升级。\n\n这一诉求被视为避免战争的机会，但同时也是对决心的考验。要么接受并让步，迈向权力巅峰；要么拒绝，否则太平洋将沦为巨人之间的战场。"
 JAP_diplomacy.190.a: "接受转交"
 JAP_diplomacy.190.b: "拒绝。太平洋不是他们能占有的。"
 JAP_diplomacy.191.t: "华盛顿放弃前哨站"
 JAP_diplomacy.191.d: "出乎意料的是，美国接受了这一要求。岛屿被移交，基地被撤离，日本的海上防线在一举之间扩大。\n\n危机最终以和平方式结束，但其意义却不言而喻。一个大国退守，太平洋的平衡向东京倾斜。"
 JAP_diplomacy.191.a: "控制群岛"
 JAP_diplomacy.192.t: "华盛顿拒绝"
 JAP_diplomacy.192.d: "美国拒绝了日本的要求，拒绝放弃其在太平洋的立足点。这一拒绝使东京的最后通牒演变为大国之间的直接对抗，日本现在既有理由也有动机以武力夺回这些前哨基地。\n\n太平洋战线日益收紧。如果这些岛屿不通过条约割让，它们将通过战争被夺取。"
 JAP_diplomacy.192.a: "然后我们用武力夺取它们。"
 JAP_diplomacy.193.t: "向巴黎发出最后通牒：太平洋必须清理干净"
 JAP_diplomacy.193.d: "东京已正式向巴黎提出要求，要求移交法国在太平洋的岛屿领地。措辞虽礼貌，但含义却十分明确：遥远的帝国将不再能在日本的海洋范围内拥有立足之地。\n\n日本提供了一条避免局势升级的狭窄路径。法国可以选择签署撤回文件，也可以拒绝撤回，并接受争端最终由舰队而非外交手段解决。"
 JAP_diplomacy.193.a: "接受转交"
 JAP_diplomacy.193.b: "拒绝。法国不会被赶出去。"
 JAP_diplomacy.194.t: "巴黎撤离太平洋"
 JAP_diplomacy.194.d: "法国接受了日本的要求。国旗被降下，驻军撤离，岛屿移交给东京控制。\n\n危机在没有战争的情况下结束，但其传递的信息却响彻全球。日本不是在谈判建立势力范围，而是在强制推行。"
 JAP_diplomacy.194.a: "控制群岛"
 JAP_diplomacy.195.t: "巴黎拒绝"
 JAP_diplomacy.195.d: "法国拒绝了日本的最后通牒，拒绝放弃其在太平洋的领地。这一拒绝使东京的要求演变为直接对抗，日本现在有了武力夺取这些岛屿的正当理由。\n\n大国冲突会使海洋变小。如果法国不通过条约撤军，日本将试图通过战争将其驱逐出去。"
 JAP_diplomacy.195.a: "那么我们就拿下它们。"
 JAP_diplomacy.196.t: "致伦敦：放弃太平洋控制权"
 JAP_diplomacy.196.d: "东京已正式向伦敦提出要求，要求英国移交其在太平洋的剩余岛屿。照会中提及地区稳定和停止远距离干涉，但其目的显而易见：日本意图清除其声称拥有管辖权的海域上的外国旗帜。\n\n英国面临两难选择：要么有序撤军，要么远赴他乡发动一场毫无必要的战争。接受，此事就此告一段落；拒绝，太平洋将沦为又一个帝国试探彼此意志的战场。"
 JAP_diplomacy.196.a: "接受转交"
 JAP_diplomacy.196.b: "拒绝。英国绝不会被驱逐。"
 JAP_diplomacy.197.t: "伦敦做出让步"
 JAP_diplomacy.197.d: "英国接受了日本的要求。领土移交，国旗降下，东京在其强制推行的海上防线中又增加了一块领土。\n\n危机最终以和平方式结束，但其象征意义却十分沉重。一个昔日的海上强国做出了让步，而日本对太平洋的主权声索随着每一次让步而愈发嚣张。"
 JAP_diplomacy.197.a: "控制领土"
 JAP_diplomacy.198.t: "伦敦拒绝了这一要求"
 JAP_diplomacy.198.d: "英国拒绝了日本的最后通牒，拒绝放弃其在太平洋的领土。这一拒绝使东京的要求变成了直接的挑战，日本现在既有了动机，也有了借口，可以武力夺取这片领土。\n\n外交手段已达极限。如果英国不通过条约撤军，日本将试图通过战争将其驱逐。"
 JAP_diplomacy.198.a: "那么我们就武力夺取。"
 JAP_diplomacy.199.t: "日本影响渗透平壤"
 JAP_diplomacy.199.d: "日本对北政策已进入新阶段。东京通过中间人、情报渠道和精心策划的施压，在我们政治环境中开辟了此前受限或封闭的渠道。\n\n这并不意味着信任，也不意味着结盟。这只是意味着日本现在有一个暂时的机会，可以从内部和外部影响决策、左右各派势力，并考验我们的决心。"
 JAP_diplomacy.199.a: "我们将密切关注这些触手。"
 JAP_diplomacy.200.t: "桦太和千岛群岛陷落"
 JAP_diplomacy.200.d: "俄军已完全重新控制萨哈林岛和千岛群岛，抹去了此前战役中取得的所有成果。军事行动已经失败，东京方面已无力继续维持。停火是唯一的选择。\n\n这次失败将会带来严重后果。公众对政府军事判断的信心已经动摇，而这次失误造成的政治代价将在未来数年持续显现。"
 JAP_diplomacy.200.a: "我们别无选择，只能接受。"
 JAP_failed_sakhalin_war: "桦太战争余波"
 JAP_failed_sakhalin_war_desc: "桦太岛和千岛群岛战役的失败给日本政治格局留下了深深的创伤。公众对政府战略能力的信任度下降，军人士气受挫，外交后果持续制约着东京的外交政策选择。"
 JAP_mars_colony1: "火星殖民地天照"
 JAP_mars_colony1_desc: "以照耀苍穹的太阳女神天照大神命名的火星殖民地“天照”号，是日本团结与领导力的光辉象征。它的存在鼓舞着国内民众的信心，也赢得了国际的尊重。"
 JAP_mars_colony2: "火星殖民地迦具土"
 JAP_mars_colony2_desc: "以火神迦具土命名的火星殖民地“迦具土”围绕着熔炉、精炼厂和重工业而建。其目的很明确：将火星矿石和能源转化为日本工厂所需的动力。"
 JAP_mars_colony3: "火星殖民地月读"
 JAP_mars_colony3_desc: "火星殖民地“月读”以月神和黑夜之神月读命名，是一个静谧的天文台和研究中心。其实验室和仪器收集的数据不断传回日本，加深着人们对火星的科学认知。"
 JAP_mars_colony4: "火星殖民地须佐"
 JAP_mars_colony4_desc: "以带来风暴的神明须佐命名的火星殖民地须佐被设计成一个崎岖的边境哨所。训练场和实验靶场使其成为日本武装部队和军事理论的熔炉。"
 JAP_american_pressure_article_nine: "在美国关税的压力下"
 JAP_JP_USA_SOFA_1: "美日军地位协定框架"
 JAP_JP_USA_SOFA_1_desc: "驻日美军依据驻军地位协定运作，该协定使大多数美军人员免受日本法院管辖和税务约束，并赋予美国对其军事基地广泛的控制权。地方警察、知事和居民必须遵守华盛顿和东京协商制定的规则，基地附近的任何犯罪、事故或噪音投诉都必须经过驻军地位协定的程序，日本才能采取行动。"
 JAP_maritime_heavy_industry_corridor: "海上重工业走廊"
 JAP_maritime_heavy_industry_corridor_desc: "日本沿主要沿海地区发展出一条由造船厂、钢铁厂和海洋工程公司组成的连续产业带。集中投资于这一区域，提高了建造和维护军舰、潜艇和支援舰艇的能力，从而增强了舰队的工业基础。"
 JAP_moon_base_completed: "辉夜月球基地建立"
 JAP_usa_article_nine_refused: "拒绝修改第九条解释"
 JAP_diplomacy_shortcut: "外交"
 JAP_political: "政治"
 JAP_economy: "经济"
 JAP_military: "军事"
 JAP_monarchism: "君主制"
 JAP_great_east_japan_earthquake_shortcut: "东日本大地震"
 JAP_article_nine_remove_flag: "第九条已被移除"
 JAP_usa_article_nine_accepted: "接受修改第九条解释"
 JAP_tokyo_startup_special_zone: "东京创业特区"
 JAP_tokyo_startup_special_zone_desc: "我们将集中精力在东京都市圈推行放松管制、风险投资支持和投资激励措施，以促进创业公司的创立和商业化。"
 JAP_tokyo_startup_special_zone_idea: "东京创业特区"
 JAP_tokyo_startup_special_zone_idea_desc: "东京已被指定为特别监管改革区，旨在扶持初创企业、风险投资和新企业成立。通过将放松管制、投资准入和商业化支持集中在首都圈，日本政府的目标是将有限的改革转化为切实可见的增长引擎。"
 JAP_kansai_medical_special_zone: "关西医疗创新区"
 JAP_kansai_medical_special_zone_desc: "我们将在关西地区打造一个医疗、护理和生命科学创新专区，加快私人投资和实际应用。"
 JAP_kansai_medical_special_zone_idea: "关西医疗创新区"
 JAP_kansai_medical_special_zone_idea_desc: "关西地区正通过灵活的监管和重点投资，发展成为医疗、护理和生命科学创新特区。"
 JAP_kyushu_logistics_special_zone: "九州物流港口特区"
 JAP_kyushu_logistics_special_zone_desc: "我们将简化九州地区的物流和港口手续，加强贸易流通，提高区域产业效率。"
 JAP_kyushu_logistics_special_zone_idea: "九州物流港口特区"
 JAP_kyushu_logistics_special_zone_idea_desc: "九州已被指定为物流和港口改革区，旨在提高贸易效率和区域互联互通。简化程序、优先发展基础设施和放宽监管旨在增强出口能力，使该地区成为更具吸引力的工商业基地。"
 JAP_expand_special_zones_nationwide: "扩大全国特区范围"
 JAP_expand_special_zones_nationwide_desc: "在选定的战略区域取得的成果将在全国范围内推广，使监管改革从有限的例外变成更广泛的增长框架。"
 JAP_tokyo_startup_special_zone_active: "§Y$JAP_tokyo_startup_special_zone$§!实施"
 JAP_kansai_medical_special_zone_active: "§Y$JAP_kansai_medical_special_zone$§!实施"
 JAP_kyushu_logistics_special_zone_active: "§Y$JAP_kyushu_logistics_special_zone$§!实施"
 JAP_expand_special_zones_nationwide_done: "§Y$JAP_expand_special_zones_nationwide$§!实施"
 JAP_japanese_economy_decisions: "根深蒂固的需求缺口"
 JAP_japanese_economy_decisions_desc: "二十年的物价下跌让日本家庭和企业学会了等待。工资停滞不前，企业囤积现金而非投资，每一日元的刺激资金都被储蓄起来而不是花掉。经济并没有崩溃，只是拒绝复苏。\n\n§Y你能做什么§!\n以下决议均为需求杠杆。宣布价格目标、降低消费税、向家庭发放现金、为公共投资提供资金以及促进耐用品购买，每一项都能提升§Y需求复苏进程§!。国策中需求分支进一步提高了这一点，同时§Y$JAP_improvement_private_investment_climate$§!直接作用于其中。\n\n§Y需求复苏进程§!：[?JAP_demand_recovery_progress|0] / 100\n\n§G阈值§!\n§G30§!：§Y$JAP_entrenched_demand_shortfall_idea_1$§!逐渐进入§Y$JAP_entrenched_demand_shortfall_idea_2$§!。\n§G60§!：它再次缓缓进入§Y$JAP_entrenched_demand_shortfall_idea_3$§!。\n§G85§!：该国家精神被移除，日本经济增长加速。\n\n§R警告§!：该进程从不衰退，但也没有任何因素能够使其自行提升。如果不采取任何行动，日本将无限期地陷入低迷。"
 JAP_entrenched_demand_shortfall_idea_2: "需求复苏乏力"
 JAP_entrenched_demand_shortfall_idea_2_desc: "更明确的物价目标和对家庭的支持使经济摆脱了最糟糕的阶段，但复苏依然脆弱。部分地区的消费和投资有所改善，但不足以提振全国经济。需求正在回升，但经济前景依然充满谨慎。\n-------------\n可通过使用§Y$JAP_japanese_economy_decisions$§!中决议以提升§Y需求复苏进展§!至§G60§!以§G缓解§!该国家精神的效果。"
 JAP_entrenched_demand_shortfall_idea_3: "剩余需求拖累"
 JAP_entrenched_demand_shortfall_idea_3_desc: "政府刺激消费的措施推动了经济发展，但多年停滞留下的谨慎情绪依然根深蒂固。家庭和企业的行动比以往更加活跃，但要实现可持续复苏，仍需最后一推。日本经济正处于摆脱停滞的临界点，但尚未完全摆脱困境。\n-------------\n可通过使用§Y$JAP_japanese_economy_decisions$§!中决议以提升§Y需求复苏进展§!至§G85§!以§G移除§!该国家精神。"
 JAP_declaration_price_target: "设定目标价格"
 JAP_declaration_price_target_desc: "拖累经济的不仅仅是需求疲软。人们普遍认为物价和工资永远不会上涨，这种观念使家庭和企业陷入了谨慎的泥潭。明确的物价目标表明政府不再接受经济停滞的现状，这是打破僵化预期的第一步。"
 Japan_economy.01.t: "目标价格已公布"
 Japan_economy.01.d: "政府终于明确表示，不再接受经济停滞作为永久状态。家庭和企业不能再指望物价和工资永远保持不变。尽管气氛依然沉重，但日本经济终于有了明确的方向。"
 Japan_economy.01.a: "先让预期有所转变。"
 Japan_economy.17.t: "价格目标已达成"
 Japan_economy.17.d: "曾经看似不可能的事情如今已开始发生。物价上涨的趋势已不容忽视。最重要的变化并非价格本身，而是人们日益增强的意识：停滞不会永远持续下去。这种意识正逐渐放松家庭和企业的谨慎。"
 Japan_economy.17.a: "变天了。"
 Japan_economy.18.t: "目标价未能达标"
 Japan_economy.18.d: "政府设定的目标未能转化为实际行动，人们对其扭转经济衰退的承诺开始产生怀疑。家庭再次变得谨慎起来，而面对疲软的需求，企业也纷纷采取观望态度。经济复苏的信心显然已经受损，日本经济再次笼罩在一片低迷的氛围中。"
 Japan_economy.18.a: "信心并非轻易就能恢复。"
 JAP_price_target_mission: "物价上涨的前景"
 JAP_price_target_mission_desc: "仅仅设定目标是不够的。我们必须在规定时间内展现物价上涨的明显迹象，并让全国人民相信变革已经真正开始。"
 JAP_cash_transfers_households: "直接家庭支持"
 JAP_cash_transfers_households_desc: "当人们对未来充满焦虑时，经济复苏不会自行启动。政府必须将购买力直接赋予家庭。针对中低收入群体的扶持措施尤其有可能转化为实际消费，从而迅速提振国内需求。"
 JAP_cash_transfers_households_decision: "向中低收入家庭支付款项"
 JAP_cash_transfers_households_decision_desc: "向最有可能消费的群体提供支持，直接推高需求。"
 Japan_economy.19.t: "支持性费用发放出现复苏迹象"
 Japan_economy.19.d: "直接发放给家庭的资金不再闲置，而是开始流入市场。中低收入群体的消费增长尤为明显，长期以来紧闭的钱包终于开始打开。"
 Japan_economy.19.a: "需求仍然可以被唤醒。"
 JAP_temporary_tax_cuts: "临时税收减免"
 JAP_temporary_tax_cuts_desc: "临时减税措施让家庭有理由现在就消费，促使他们提前进行之前推迟的购买，并在停滞的经济中给需求带来明显的动力。"
 JAP_temporary_consumption_tax_cut: "临时消费税减免"
 JAP_temporary_consumption_tax_cut_desc: "创造消费的理由，将延迟消费转化为经济复苏的动力。"
 Japan_economy.20.t: "税收减免政策呈现复苏迹象"
 Japan_economy.20.d: "临时减税政策促使家庭立即采取行动。此前被推迟的消费开始恢复，经济停滞的局面也开始出现转机。虽然这只是一项短期措施，但它确实展现出了刺激疲软需求的强大作用。"
 Japan_economy.20.a: "现在是时候行动了。"
 JAP_active_public_investment: "积极的公共投资"
 JAP_active_public_investment_desc: "如果私营企业依然谨慎，政府就必须主动创造需求，向地方经济注入资金，促进就业。公共投资能够重塑经济复苏的迹象。"
 JAP_active_public_investment_decision: "公共投资指令"
 JAP_active_public_investment_decision_desc: "通过政府行动创造需求，恢复资金流入地方经济和就业市场。"
 Japan_economy.21.t: "公共投资显现复苏迹象"
 Japan_economy.21.d: "国家主导的项目正逐渐产生远超数字本身所显示的积极影响。资金正流入地方经济，就业形势好转，曾经令人倍感熟悉的经济悲观情绪也开始消退。这个国家终于可以感受到，它已经迈出了不再等待的第一步。"
 Japan_economy.21.a: "国家可以主导经济发展。"
 JAP_improvement_private_investment_climate: "改善私人投资环境"
 JAP_improvement_private_investment_climate_desc: "单靠政府支出无法完成经济复苏。必须提振企业信心，鼓励其重新投资，并降低对未来的不确定性。要实现持久复苏，企业需要从防御型投资转向扩张型投资。"
 JAP_focus_improving_investment_climate: "重点改善投资环境"
 JAP_focus_improving_investment_climate_desc: "政府正优先营造更有利于商业投资的环境。政治资源被投入到协调、游说和体制改革中，这使得其他短期举措的空间相对有限。"
 Japan_economy.02.t: "私人投资环境改善"
 Japan_economy.02.d: "企业开始意识到，一味防御意味着错失良机。不确定性依然存在，但阻碍新投资的一些压力正在逐渐消退。经济复苏似乎不再完全由政府主导，这是前所未有的。"
 Japan_economy.02.a: "私营部门正在活跃起来。"
 JAP_stimulating_demand_durable_goods: "刺激耐用品需求"
 JAP_stimulating_demand_durable_goods_desc: "一旦需求开始回升，汽车、家电和住房相关商品等耐用品的消费就能带动整个行业的增长，其效果远超其他行业。但在经济停滞时期，这些商品往往最先被推迟购买。如果能够重振这些商品的消费，将为经济复苏注入强劲动力，并恢复久违的活力。"
 JAP_stimulating_demand_durable_goods_decision: "耐用品采购活动"
 JAP_stimulating_demand_durable_goods_decision_desc: "鼓励人们进行多年来一直被推迟的大宗采购，并为经济复苏注入明显的动力。"
 Japan_economy.22.t: "耐用品需求显现复苏迹象"
 Japan_economy.22.d: "多年来被推迟的大宗采购终于开始恢复。耐用品需求对相关行业产生广泛影响，也表明家庭对未来至少略有信心。复苏的迹象不仅体现在数据上，也体现在日常生活的氛围中。"
 Japan_economy.22.a: "让这股势头蔓延开来。"
 JAP_strict_audits_banks: "严格的银行检查"
 JAP_strict_audits_banks_desc: "多年的拖延使得银行体系的创伤更难被察觉，而金融焦虑却持续蔓延。第一步是将危险的不良贷款从阴影中揭露出来，迫使银行直面现实。这将会很痛苦，但没有痛苦就没有真正的复苏。"
 Japan_economy.23.t: "新生银行看跌期权"
 Japan_economy.23.d: "条款内容与报道完全一致。买方认定损失五分之一价值的每一笔贷款，都将按账面价格返还给存款保险公司，差额由国家承担。银行的行为并无违法之处。它比起草合同的官员们更仔细地阅读了合同，而那些官员们至今仍在职。"
 Japan_economy.23.a: "公布合同内容及签署人姓名。"
 Japan_economy.24.t: "崇光的崩溃"
 Japan_economy.24.d: "这条链条已经无法挽救，所有向部长出谋划策的人都心知肚明。唯一的问题是，这条链条最终会诉诸法庭，届时债权人和包庇他们的官员将被公之于众；还是会在私下进行重组，悄悄地免除公众承担的债务份额。"
 Japan_economy.24.a: "让它在法庭上公开失败。"
 JAP_injection_public_funds: "公共资本注入"
 JAP_injection_public_funds_desc: "要求实力受损的银行在缺乏支持的情况下既进行损失处置又恢复放贷是不现实的。如果要维护公众对金融体系的信心，国家必须作为最后的保障措施介入，阻止崩溃的连锁反应。这是一个政治上极其艰难的决定，但却别无选择。"
 Japan_economy.25.t: "麦卡尔"
 Japan_economy.25.d: "自泡沫经济破灭以来，该集团的主要银行每年都为其提供再融资，如今却告知经济产业省，将不再提供此类融资。此前从未与其他银行合作过的关西供应商，已经开始致电各自县政府部门。本周的任何决定都将被整个地区解读为对旧有安排是否仍然有效的明确表态。"
 Japan_economy.25.a: "让它破产，然后审计承销它的银行。"
 JAP_new_lenders: "邀请新的贷款方"
 JAP_new_lenders_desc: "如果现有银行继续固守防御性谨慎策略，信贷流动将持续疲软。必须鼓励新的贷款机构进入市场，打破金融体系本身的瓶颈。竞争和新的资本渠道能够恢复日本金融体系失去的部分灵活性。"
 JAP_new_lenders_idea: "新贷款机构的崛起"
 JAP_new_lenders_idea_desc: "除了传统银行之外，新的信贷来源正在涌现。金融领域的阻塞尚未完全消除，但新的路径正在为资本在经济中的流动开辟。"
 JAP_protection_deposits: "建立存款保障"
 JAP_protection_deposits_desc: "一旦储户开始怀疑存款安全，银行业危机便会真正爆发。因此，政府必须明确无误地表明存款将受到保护。仅靠这一点无法完全恢复信任，但它足以成为一道屏障，防止恐慌演变成崩溃。"
 Japan_economy.26.t: "里索那"
 Japan_economy.26.d: "剔除递延所得税资产后，资本充足率将大幅下降。审计师拒绝签字，这本身就是史无前例的，而政府只有几天时间，而不是几周。两万亿日元足以弥补银行的损失，并使国家成为其所有者。拒绝签字意味着该国自战以来首次允许出现重大银行倒闭，而且没有人能预料到这种情况会如何收场。"
 Japan_economy.26.a: "注资并撤换整个董事会"
 JAP_rehabilitation_small_medium_enterprises: "为小型企业提供信用安全网"
 JAP_rehabilitation_small_medium_enterprises_desc: "处置不良贷款可能会使中小企业和破产企业一样陷入融资困境。银行必须维持对有生存能力的中小企业的贷款，同时通过重组融资方案来监控信贷紧缩情况，从而防止地方经济崩溃。"
 JAP_rehabilitation_small_medium_enterprises_idea: "关注中小企业信贷稳定性"
 JAP_rehabilitation_small_medium_enterprises_idea_desc: "政治资源正集中用于监督、协调和重组支持，以防止不良贷款处置扼杀中小企业的信贷。这对于保护地方经济至关重要，但却减少了在其他领域采取行动的空间。"
 Japan_economy.27.t: "足利银行"
 Japan_economy.27.d: "该县政府、企业以及众多居民都只在这家银行开户。审查人员的结论明确无误：这家银行已经资不抵债，而且这种情况已经持续了一段时间。临时国有化保护了所有储户的权益，但也使所有股东的股份化为乌有，其中许多股东是当地企业，它们被要求持有该银行的股份作为其自身贷款的条件。"
 Japan_economy.27.a: "将其国有化，并将股东权益全部清零。"
 Japan_economy.28.t: "大荣"
 Japan_economy.28.d: "复兴公司准备接管这家公司，更换董事会，并出售所有能卖的东西。创始人从战后的废墟中重建了这家公司，他在党内还有一些朋友记得它。他们正在要求再进行一次融资，而且他们大声疾呼。"
 Japan_economy.28.a: "交给复兴公司"
 Japan_economy.29.t: "佳丽宝账目"
 Japan_economy.29.d: "两千亿日元的利润从未实现，却在五年间不断被申报，而且每次都由同一家会计师事务所签字确认。起诉这家公司并不难。但如果​​起诉其审计师，则会向日本所有会计师事务所发出明确的信号：签字并非只是形式，而是一种责任，而且许多其他声明也会因此而值得重新审视。"
 Japan_economy.29.a: "对该公司提起诉讼并暂停其审计师的职务。"
 Japan_economy.30.t: "联合会解散"
 Japan_economy.30.d: "压力已经减轻了。该联合会尚未撤回反对意见，但已停止发布反对调查的简报，而声音最大的成员也变得安静。这不是协议。这是一种判断，这场战斗不再值得他们付出代价。"
 Japan_economy.30.a: "我们要好好享受这难得的宁静。"
 Japan_economy.31.t: "联合会履行了承诺"
 Japan_economy.31.d: "各成员公司的资本支出计划均已推迟，且每家公司都表示面临不确定性。今天上午宣布的招聘冻结被包装成审慎之举。其传递的信息清晰明确，而且正是如此，没有任何法律可以强制公司进行投资。"
 Japan_economy.31.a: "他们已经表达了他们的观点。"
 Japan_economy.03.t: "经济衰退的第一个裂缝"
 Japan_economy.03.d: "政府的支持措施已开始生效，此前被冻结的支出终于开始出现复苏迹象。消费者信心依然疲软，但长期以来“反正一切都不会改变”的消极情绪，如今首次开始出现裂痕。"
 Japan_economy.03.a: "形势开始转变。"
 Japan_economy.04.t: "需求开始蔓延"
 Japan_economy.04.d: "最初谨慎的政策推动如今已惠及更广泛的经济领域。家庭支出有所增加，被推迟的消费正在恢复，企业再也不能忽视市场复苏的迹象。经济复苏尚未稳固，但已不再仅仅是一种希望。"
 Japan_economy.04.a: "让复苏的势头蔓延开来。"
 Japan_economy.05.t: "长期低迷结束"
 Japan_economy.05.d: "需求终于开始自主运转。家庭和企业的行为已进入相互促进的良性循环，日本经济正稳步走出长期停滞的困境。尽管仍面临诸多挑战，但由需求不足导致的长期衰退已不再是日本经济的核心负担。"
 Japan_economy.05.a: "终于，我们继续前进。"
 Japan_economy.06.t: "企业反击"
 Japan_economy.06.d: "一旦审计人员要求提供真实数据，游说活动就开始了。行业协会警告说，大规模破产和失业将不可避免，而那些友好的官僚则劝告大家保持耐心。银行宁愿按照自己的节奏报告损失，甚至根本不报告。我们可以强迫他们，也可以让他们随意提供，或者我们可以决定这一切根本不值得。"
 Japan_economy.06.a: "传唤这些账目"
 Japan_economy.07.t: "濒临破产的银行"
 Japan_economy.07.d: "审计揭露了一家深陷不良贷款泥潭的地区性贷款机构。如果强制公开全部资产负债表，恐慌情绪可能会蔓延；如果控制披露，腐败问题或许还能勉强掩盖，但市场依然保持平静。无论如何，调查仍在继续推进。"
 Japan_economy.07.a: "强制全面披露"
 Japan_economy.08.t: "披露结果已公布"
 Japan_economy.08.d: "报告即将付印。报告的内容完全取决于审计人员被允许发现什么：一份破产公司及其包庇官员的名单；一份经过删减、隐去最严重姓名的部分报告；或者一份长达数百页却未对任何人提出任何指控的文件。无论如何，公众都会阅读这份报告，那些曾被承诺拥有透明的西式市场的人们也会阅读。"
 Japan_economy.08.a: "全部公布，让公众评判。"
 Japan_economy.09.t: "部里泄露的消息"
 Japan_economy.09.d: "各公司都知道哪些审计员会来，以及具体是哪天早上。周末期间，文件柜被清空，两名董事突然因公出差，联系不上。是部里有人告诉他们的，在座各位都能猜到是谁，因为他是从他负责保护的那家银行调过来的，退休后还会被调回去。"
 Japan_economy.09.a: "接受失败，继续前进。"
 Japan_economy.10.t: "联合会发出最后通牒"
 Japan_economy.10.d: "企业联合会向国会提交了一份数据报告：投资推迟、招聘冻结、信心受损，所有这一切都归咎于调查。表面上的客套话背后，实则暗藏玄机：要么结束这场调查，要么联合会成员会发现，在这种不确定性持续期间，他们什么都无法做出承诺。"
 Japan_economy.10.a: "让他们公开陈述自己的观点。"
 Japan_economy.11.t: "检察官倒下了"
 Japan_economy.11.d: "失败的并非调查本身，而是首席检察官未申报的高尔夫球会员资格。这份会员资格是由他自己名下的一家公司赠送的，而一家报纸还刊登了他接受会员资格的照片。部长已辞职承担责任。调查目前暂停，等待审查，但人人都明白，所谓的审查不过是等待公众不再关注此事罢了。"
 Japan_economy.11.a: "我们失去了主动权。"
 JAP_expectation_of_being_rewarded: "对回报的预期"
 JAP_expectation_of_being_rewarded_desc: "经济复苏需要重建人们对努力终将获得工资增长和生活水平提高的信念。如果没有工资增长，刺激措施就只能是暂时的，只有这种预期才能使经济复苏成为可持续的。"
 JAP_wage_negotiations: "争取更高工资"
 JAP_wage_negotiations_decision: "恢复人们对工资增长的信心，防止需求复苏仅仅停留在暂时的刺激阶段。"
 Japan_economy.12.t: "与企业进行工资谈判"
 Japan_economy.12.d: "如果需求复苏要实现可持续，工资也必须上涨。然而，企业仍然对未来的风险和利润压力保持警惕。政府现在必须决定应该在多大力度地推动提高工资。"
 Japan_economy.12.a: "鼓励提高工资。"
 Japan_economy.12.b: "施加压力"
 Japan_economy.12.c: "交给私营部门吧。"
 Japan_economy.14.t: "工资增长达到目标"
 Japan_economy.14.d: "工资终于开始出现明显增长。重要的不仅是收入本身的增长，更是人们内心深处重新感受到努力终将得到回报。这种心态的转变正逐渐将疲软的消费转化为更强劲、更持久的消费。"
 Japan_economy.14.a: "复苏正在成为现实。"
 Japan_economy.15.t: "工资增长未达预期目标"
 Japan_economy.15.d: "工资增长并未达到预期目标，但努力并非徒劳。企业依然保持谨慎，但提高工资的必要性如今已比以往更加普遍。这一进步虽小，但对于打破以往停滞不前的局面仍然意义重大。"
 Japan_economy.15.a: "我们以此为基础。"
 JAP_price_target_mission_TT: "通货膨胀率至少达到2%。"
 Japan_economy.12_a_TT: "工资增长达到目标水平的可能性为§Y50-50§!"
 Japan_economy.12_b_TT: "工资增长达到目标水平的可能性为§G高§!"
 Japan_economy.12_c_TT: "工资增长达到目标水平的可能性为§R低§!"
 JAP_wage_negotiations_TT: "§Y需求复苏进展§!将增加，但具体数额取决于§Y工资谈判§!的结果。"
 JAP_improvement_private_investment_climate_TT: "获得$MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$相关国家精神：六个月之后§G+3%§!"
 JAP_glorious_decade_desc: "在不回避经济停滞根源的前提下，我们将同步重建金融、企业和需求。同时，我们将直面低生育率和“就业冰河期”一代的影响，以工作方式改革和人才投资为核心，在保障家庭安全的同时，增强经济增长潜力。"
 JAP_inflation_target_desc: "政府和央行将明确传达支持经济的政策立场及其维持条件。通过降低未来的不确定性，消除家庭和企业的“观望”态度，我们将促进消费和投资的复苏。"
 JAP_diplomacy.34.d: "为加强本地区的金融安全网，日本政府已提议通过“清迈倡议”扩大与我国的货币互换安排。在危机时期保障流动性有助于缓解市场焦虑，并促进经济稳定。\n\n我们是否应该接受这项提议，参与加强金融合作？"
 JAP_diplomacy.40.d: "日本政府提议在教育、人力资源开发和科研领域与我国开展“定向官方发展援助”合作，援助将与我国企业和机构协调开展。这项合作将加强技能培养和机构能力建设，促进产业升级和创新。接受该提议也将有助于提升日本在东盟的影响力。\n\n我们是否应该接受这项提议，加强人力资本和研发？"
 JAP_diplomacy.41.d: "[FROM.GetName] 已接受日本在教育、人力资源开发和科研领域提出的““定向官方发展援助”合作方案。随着与当地企业和机构的合作不断深入，对方的体制能力和技术基础将得到加强，从而促进可持续发展。该协议必将提升日本在东盟的影响力。"
 JAP_diplomacy.42.d: "[FROM.GetName] 已表示将拒绝在教育、人力资源开发和科研领域开展““定向官方发展援助”合作的提议。对方似乎更重视国内事务和体制准备，但这并不意味着它拒绝了该提议本身。日本应在保持对话渠道畅通的同时，充分考虑对方的实际情况。"
 JAP_diplomacy.49.d: "日本政府已提出建立“日台防灾知识平台”的提案，旨在基于两国共同面临的自然灾害风险，分享防灾方面的专业知识和经验教训。该平台将通过规范信息共享、开展联合培训和制定灾后恢复程序，加强应急响应能力，加快灾后重建。如果这项合作得以推进，有望减少灾害损失，加快灾后重建进程。"
 JAP_diplomacy.50.d: "日本政府提出了“日台高科技合作”计划，旨在联合日本和台湾的研究机构和私营企业，推进尖端民用技术的联合研究。通过共享研究资源、开展联合开发以及促进工程师交流，该计划旨在加速创新，提升产业生产力和竞争力。如果这项合作得以落实，将为两国民用技术领域的长期发展奠定基础。"
 JAP_diplomacy.56.t: "“中华文化圈”文化合作项目"
 JAP_diplomacy.56.d: "日本政府提出了一项日中文化合作项目，旨在加强“中华文化圈”内部的文化联系，该文化圈拥有共同的历史渊源。通过学术交流、文化活动以及媒体和教育领域的合作，该项目旨在使共同的价值观和历史联系更加清晰地展现出来，并使其成为抵御外部影响的文化缓冲。如果这一框架得以推进，预计还将增强软实力，从而有助于塑造更积极的国际形象。"
 JAP_diplomacy.59.d: "日本政府提出了“区域商业交流倡议”，旨在将地方层面的商业交流制度化，促进日韩两国区域企业间的合作。该倡议通过举办商业对接会、联合展览、供应链对接以及技术知识共享等活动，力求振兴区域经济，加速民用产业发展。如果这一框架得以落实，将拓展不过度依赖中央政府主导的务实合作，从而强化以私营部门为主导的产业网络。"
 JAP_historical.20010426.d: "森喜朗在担任首相仅一年后便宣布辞职。他的支持率持续下滑，而他与公众之间的隔阂也日益加深，这体现在他发表的“神之国”言论以及他对爱媛丸事件的处理方式上。\n\n在自民党总裁选举中，小泉纯一郎当选为他的继任者。他以“摧毁自民党”的豪言壮语吸引了全国的目光，并开展了一场引人注目、高调的竞选活动。公众对他寄予厚望，而他也在地方选举中以压倒性优势获胜。\n\n小泉的风格和舞台表现力与老自民党截然不同，他在就任首相时高举“改革”的大旗。\n然而，在他誓言要摧毁的废墟中，究竟会涌现出什么，目前还无人知晓。"
 JAP_historical.20060926.d: "执政五年多的首相小泉纯一郎宣布，他将在自民党总裁任期届满后卸任。尽​​管小泉已公开表示希望在任期结束后卸任，但他仍然拥有很高的民意支持率，党内也有许多人呼吁他连任。\n\n与此同时，在自民党内部，年轻有为、迅速晋升为内阁官房长官的安倍晋三，凭借其年轻、知名度、政治背景以及作为“后小泉时代”人物的象征意义，成为最受瞩目的接班人。他获得了党内各界的广泛支持。\n\n谁更适合带领国家前进，是经验丰富的现任领导人，还是准备将火炬传递给下一代的新一代领导人？现在是时候做出决定了。"
 JAP_historical.20070926.d: "首相安倍晋三突然宣布辞职，理由是执政难度日益增加。他上任仅一年，一系列内阁丑闻已严重动摇了其政府的根基。\n安倍辞职后，自民党内部一些人力推由前内阁官房长官福田康夫接任，认为“需要一张新面孔来重塑公众信任”。然而，许多人仍然强烈支持安倍继续执政。\n\n日本目前正处于政治动荡之中。现在是时候决定谁将执掌国家大权了。"
 JAP_historical.20080924.d: "首相福田康夫出人意料地在首相官邸召开记者会，宣布辞职。\n\n在会议上，他表示：“为了人民的日常生活，我希望新的团队能够贯彻执行各项政策”，表现出对领导层更迭的平静接受。然而，由于他并未明确解释辞职原因，这一声明令许多民众感到困惑和不安。\n对此，自民党迅速启动了领导层选举的筹备工作。干事长麻生太郎脱颖而出，成为领跑者，并迅速获得了党内各派系的支持。然而，党内仍有少数人呼吁福田留任。\n\n要打破政治停滞，国家需要的是变革吗？还是说，稳定对日本而言才是眼下最重要的事？现在是时候做出决定了。"
 JAP_focus_renewable_energy_decision_repeal: "废除对可再生能源的关注"
 JAP_focus_renewable_energy_decision_repeal_desc: "逆转对可再生能源的承诺，标志着政府政策从对太阳能和风能的投资转向其他能源优先事项。"
 JAP_focus_thermal_power_decision_repeal: "废除对化石燃料发电厂的关注"
 JAP_focus_thermal_power_decision_repeal_desc: "逆转对化石燃料发电厂扩张的趋势，标志着政府政策从煤炭、石油和天然气投资转向其他能源优先事项。"
 JAP_diplomacy.16.t: "日本僵局"
 JAP_diplomacy.16.d: "东京方面继续抵制扩大对宪法第九条的解释。华盛顿必须决定它愿意走多远，以及为此付出多大的代价。"
 JAP_diplomacy.16.a: "放弃这件事吧。我们在该地区的其他利益更为重要。"
 JAP_diplomacy.16.b: "撤销我们对日本的安全保障。"
 JAP_diplomacy.16.c: "对日本出口商品征收关税。"
 JAP_diplomacy.16.e: "对日本实施海上封锁。"
 JAP_historical.121006001.t: "2000年鸟取地震"
 JAP_historical.121006001.d: "日本坐落于漂浮在环太平洋火山带上的火山群岛之上。这意味着日本及其人民必须不断经历大规模地震。这一状况在过去千年未曾改变，未来千年亦将如此。\n\n2000年10月6日下午1时30分，一场震级7.3、烈度6+的地震袭击了岛根县西部。这场地震对许多道路和房屋造成严重破坏，震动甚至波及大阪、福冈等遥远地区。尤其值得注意的是，这是神户自1995年阪神淡路大地震以来首次遭遇强震。"
 JAP_historical.disaster_help: "现在就帮助他们！"
 JAP_historical.disaster_leave: "别管他们。他们会自己恢复的。"
 JAP_historical.130210001.t: "爱媛丸号事故"
 JAP_historical.130210001.d: "2001年2月9日，爱媛县立宇和岛水产高中的实习船“爱媛丸”被[USA.GetName]潜艇“格林维尔”号撞沉。船上搭载的35名日本师生中有9人不幸遇难。\n\n当两国政府官员正全力收集这起悲剧事故的详细信息时，首相[Root.GetLeader]却在度假打高尔夫。\n\n他们当然应该立即放弃休假返回东京，对吧？"
 JAP_historical.130210001.oA: "现在立刻返回东京！"
 JAP_historical.130210001.oB: "等等！再来一杆……"
 JAP_historical.130324001.t: "2001年芸予地震"
 JAP_historical.130324001.d: "2001年3月24日下午3时27分，一场6.7级、烈度6度的地震袭击了广岛县西部。造成2人死亡、288人受伤。距离震中最近的吴市受灾最为严重。另一方面，由于许多地方政府在1995年阪神淡路大地震及去年岛根地震后采取了防灾措施，其他地区受灾程度相对较轻。主要灾情包括供水管道破裂和山体表层滑坡。"
 JAP_historical.9130901001.t: "歌舞伎町大楼火灾"
 JAP_historical.9130901001.d: "2001年9月1日凌晨，位于东京都新宿区歌舞伎町的\"明星56大厦\"发生火灾，因一氧化碳中毒导致44名正在麻将馆和脱衣舞俱乐部的顾客遇难。据消防部门报告，火灾起初规模较小，但因一名发现火情的工作人员打开房门引发回燃现象导致火势爆发。报告补充说明，火灾报警器因被天花板遮挡或因故障被切断，导致错过了早期灭火时机。另有报告指出，大楼工作人员未引导顾客疏散。与此同时，警视厅与消防部门联合调查发现，一处燃气管道存在非自然破损。虽然火灾原因尚未明确是意外还是纵火，但可以确定的是，防火意识的缺失加剧了灾难的严重性。"
 JAP_historical.9130901001.oA: "希望再不会有比这更严重的建筑火灾了。"
 JAP_historical.131201001.t: "敬宫爱子内亲王殿下诞生"
 JAP_historical.131201001.d: "2001年12月1日，皇太子德仁与太子妃雅子的女儿在皇宫医院诞生。这位新千年首位诞生的内亲王被命名为\"爱子\"，其名源自中国儒家典籍《孟子》。爱子内亲王同时是当今天皇明仁的孙女。这是自1965年秋筱宫文仁亲王诞生以来时隔多年的皇室喜事，举国上下几乎都在欢庆。随后包括政要与各界名流在内的两万民众齐聚皇宫前高呼\"万岁\"。然而亦有人担忧这种情况可能导致现存皇室血脉断绝——太子妃雅子已属高龄产妇，生育二胎风险极高。若爱子内亲王成年后成为\"末代女系天皇\"，将因德仁与文仁两位亲王年龄差距悬殊而引发继承危机。但这显然违背《皇室典范》中\"皇位仅限父系继承\"的规定。最终，为确立女系天皇继承权，全民展开了修订《皇室典范》的讨论。"
 JAP_historical.131201001.oA: "板载！"
 JAP_historical.150526001.t: "2003年宫城县近海地震"
 JAP_historical.150526001.d: "2003年5月26日下午6时24分，一场7.1级、烈度6弱的地震发生在宫城县与岩手县交界近海区域并造成冲击。东北地区大面积遭受严重破坏，如新干线高架桥损毁及山体滑坡，但无人死亡。此次海啸极为轻微，仅如涟漪波动。尽管已有这些报告，从北海道到关东地区的许多民众仍感受到了震动。"
 JAP_historical.150726001.t: "2003年宫城连续地震"
 JAP_historical.150726001.d: "2003年7月26日——从凌晨0点至傍晚，宫城县北部在一天内竟连续遭遇多达四次地震！最强一次发生于上午7点13分，震级达6.4级，烈度6+；最弱一次也有5.1级，烈度5-。这些地震不仅造成数百栋房屋损毁，更波及航空自卫队松岛基地。这无疑是令人极度不安的一天，所幸最终无人遇难。"
 JAP_historical.150926001.t: "2003年北海道地震"
 JAP_historical.150926001.d: "2003年9月26日凌晨4点50分，北海道南部近海发生里氏8.0级、震度6弱的地震。最初仅有少数城镇感受到强烈震感，但人们很快意识到这场灾难的真正恐怖之处。地震导致沿海填海区发生土壤液化，并引发储油罐火灾。更严重的是，一场巨大海啸袭击了日本东部太平洋沿岸，已造成两人死亡。"
 JAP_historical.161023001.t: "2004年新潟县中越地震"
 JAP_historical.161023001.d: "2004年10月23日下午5时56分，新潟县发生里氏6.8级、震度7级的地震。这是自1995年阪神大地震修订震度标准以来，首次观测到震度7级的地震。山古志村所有道路因山体滑坡损毁，村民被困村中。上越新干线一列行驶中的列车因地震脱轨，所幸无人死亡。但此次地震最终仍导致68人遇难。"
 JAP_historical.170320001.t: "2005年福冈地震"
 JAP_historical.170320001.d: "2005年3月20日上午10时53分，福冈市近海发生矩震级7.0、震度6弱的地震。九州北部地区地震记录较少，此次是自1922年以来最强震。福冈市玄界岛约700名居民已撤离，十人决定留守负责灾情通报与巡逻。福冈市中心区多数窗户震碎，玻璃碎片坠落人行道致两名行人受伤。地震波及范围除对马岛外，朝鲜半岛与中国部分地区亦有震感。此次地震造成一人死亡。"
 JAP_historical.170425001.t: "福知山线脱轨事故"
 JAP_historical.170425001.d: "2005年4月25日上午9时18分，西日本旅客铁道福知山线（又称JR宝冢线）一列快速列车在兵库县尼崎市一处急弯脱轨，撞入附近公寓楼一层。\n该列车共七节车厢，但由于首节车厢完全嵌入建筑，初期报道误称仅有六节。调查显示，列车以约116公里/小时的速度进入限速70公里/小时的弯道，超速产生的离心力很可能导致脱轨。\n司机在事故中身亡，但后方车厢乘务员的证词表明，工作人员可能因试图弥补约90秒的延误而超速行驶。后续报道揭露该公司对轻微操作失误实施严厉内部惩戒措施，包括再教育课程、手抄公司规章等矫正手段，这些制度可追溯至中曾根内阁时期日本国有铁道民营化改革。\n所幸对向驶来的特急列车因轨道受阻紧急停车，避免了二次碰撞。但由于事故发生在早高峰时段，列车十分拥挤，最终造成107人死亡、562人受伤，成为战后日本最严重的铁路事故。部分医学专家指出，多名乘客并非在撞击中当场死亡，而是因长时间受压导致挤压综合征而丧生。"
 JAP_historical.180906001.t: "悠仁亲王殿下诞生"
 JAP_historical.180906001.d: "2006年9月6日，文仁亲王与王妃纪子的儿子在港区南麻布的私人医院诞生。作为新千年首位诞生的皇室亲王，他被命名为\"悠仁\"——\"悠\"取\"悠然自得\"之意，\"仁\"则沿袭平安时代以来的皇室命名传统。此次剖腹产手术在私立医院而非皇宫内进行，这两点均创下皇室历史先例。这位合法男性继承人的诞生不仅确保了皇位传承，也为皇室注入了新生力量。随着小皇子的降生，关于修改《皇室典范》的争议声浪已逐渐平息。"
 JAP_historical.180906001.oA: "板载！"
 JAP_historical.190216001.t: "“失去的养老金”"
 JAP_historical.190216001.d: "1997年，日本社会保险厅开始将个人养老金记录整合到单一的“基本养老金编号”系统下。然而，在2006年至2007年间，该机构发现约有5000万份养老金记录由于纸质文件转录成数字格式过程中的错误而无法关联或存在差异。\n部分缺失的记录影响了当前的养老金领取者，引发了人们对个人可能收到错误金额的担忧。此外，据报道，在尝试更新员工养老金数据的过程中，某些记录丢失或被误删。\n对此，[JAP.GetRulingParty]成立了特别工作组调查此事，并提出紧急立法以救济受影响者。然而，反对党对政府进行了严厉批评，公众不满情绪依然高涨。"
 JAP_historical.190216001.oA: "一场灾难！"
 JAP_historical.190325001.t: "2007年能登半岛地震"
 JAP_historical.190325001.d: "2007年3月25日上午9时41分，一场强烈的6.9级地震袭击北陆地区。日本气象厅测定石川县轮岛市震度达6强，这是自1922年有地震观测记录以来该地区遭遇的最强地震。震源位于尚未发现断层的地带，震动范围从北海道延伸至高知县，并引发20厘米（7.87英寸）海啸。地震导致1人被倒塌的石灯笼砸中身亡，356人受伤，超过3万栋建筑与房屋受损。"
 JAP_historical.190716001.t: "2007年新潟县中越近海地震"
 JAP_historical.190716001.d: "2007年7月16日上午10时13分，新潟县再次发生6.8级地震。日本气象厅测得多个城镇震度达6级以上，而在柏崎刈羽核电站，非官方测算震度达到7级。地震引发的海啸在柏崎市记录到1米（3.28英尺）浪高。此次地震直接及间接导致15人死亡，2346人受伤，超过34000栋建筑受损，其中1331栋房屋完全损毁。先前提及的柏崎刈羽核电站发生火灾，由于初期灭火阶段信息沟通失误，灭火延迟两小时，导致放射性物质泄漏，所幸未超出环境可忽略水平。距离能登半岛地震仅4个月、距2004年新潟中越地震仅3年，该地区再度遭遇强震。"
 JAP_historical.200614001.t: "2008年岩手·宫城内陆地震"
 JAP_historical.200614001.d: "2008年6月14日上午8点43分，一场强烈的7.2级地震发生在岩手县地下。日本气象厅测定宫城县栗原市与岩手县奥州市的震度达到6强。尽管这是一次内陆地震，但从北海道至关东地区均记录到震度3以上的晃动。此次地震造成罕见现象：建筑物损毁较少，但引发大量山体滑坡，最终导致17人死亡、70人重伤、356人轻伤，另有6人下落不明。据报道还出现了桥梁坍塌和文化财产受损等情况。"
 JAP_historical.210811001.t: "2009年骏河湾地震"
 JAP_historical.210811001.d: "2009年8月11日凌晨5点07分，骏河湾发生6.5级强震，造成1人死亡、319人受伤。地震引发40厘米（约1.31英尺）海啸。日本气象厅测定静冈县多地震度达6弱，8678栋房屋及多处历史建筑受损，但未有房屋完全倒塌。包含静冈县的东海地区是未来东海-东南海大地震及海啸的关键预估受灾带，当地居民通过疏散演习、家具固定及房屋加固等措施进行防灾准备，这使得本次地震伤亡与损失程度相对较低。尽管如此，工厂、茶园及东名高速公路仍报告遭受破坏。"
 JAP_asteroid_mining_network_established: "为[JAP.GetNameWithFlag]建立小行星采矿网络"
 JAP_asteroid_mining_operation_active: "目前正在进行小行星采矿作业"
 JAP_claiming_taiwan_tt: "这将一次性宣示日本对台湾所有岛屿的主权。一旦主权声索生效，即可完成战略部署，要求台湾臣服。"
 JAP_improvement_private_investment_climate_idea: "改善私人投资环境"
 JAP_improvement_private_investment_climate_idea_desc: "单靠政府支出无法完成经济复苏。必须提振企业信心，鼓励其重新投资，并降低对未来的不确定性。要实现持久复苏，企业需要从防御型投资转向扩张型投资。"
 JAP_demographic_crisis: "应对危机的空前措施"
 JAP_demographic_crisis_desc: "日本儿童家庭厅负责协调政府应对人口下降的各项举措，包括鼓励生育的激励措施、女性劳动力动员以及移民改革。而国会则只支持其中一项举措。每项举措的最终结果都各有不同：现金补贴、劳动力市场动荡或文化转型。"
 JAP_demographic_crisis_tt: "标志着日本开始应对人口下降问题。以下三种策略是互斥的。"
 JAP_immigration_backlash_opposition_tt: "§R移民反弹：§!反移民情绪高涨，民族主义反对派势力壮大。"
 JAP_immigration_backlash_stability_tt: "§R移民反弹：§!外国人涌入引发的愤怒会削弱社会稳定。"
 JAP_traditionalist_backlash_opposition_tt: "§R传统主义者反弹：§!保守派对传统家庭衰落的愤怒情绪日益高涨，民族主义反对派势力也随之壮大。"
 JAP_traditionalist_backlash_stability_tt: "§R传统主义者反弹：§!保守派对传统家庭衰落的愤怒削弱了社会稳定。"
 JAP_japan_belongs_to_the_japanese: "日本是日本人的日本"
 JAP_japan_belongs_to_the_japanese_desc: "日本将通过家庭津贴、鼓励生育的激励措施和文化复兴来提高生育率。无论生育率是否上升，国家都承诺持续投入福利支出。这条道路以经济衰退带来的财政不确定性为代价，换取了不可逆转的福利保障的确定性。"
 JAP_pronatalist_turn: "多生一子计划"
 JAP_pronatalist_turn_desc: "日本将发起一项全面的运动，鼓励生育成为公民的优先事项，其灵感源自2000年代初的“多生一子”战略。通过税收优惠、公共宣传以及对多子女家庭的文化认可，国家将转变社会对多子女家庭的态度，同时提供切实的支持，使生育更加经济实惠且更具吸引力。"
 JAP_national_revival_campaign: "区域振兴计划"
 JAP_national_revival_campaign_desc: "日本将把投资引向地方，振兴那些因年轻人涌向东京而衰落的乡村社区。通过创造就业机会、改善公共设施以及重塑人们对日本地方的信心，我们旨在让家庭在都市以外安家落户，减缓人口集中加剧农村衰落的趋势。强大的地区是家庭稳定和可持续生育率的基础。"
 JAP_three_generation_household: "三代同堂家庭"
 JAP_three_generation_household_desc: "日本将通过税收优惠和住房补贴来扶持三代同堂的家庭，恢复祖父母无偿提供儿童和老人照护的传统模式。国家将福利成本转嫁到家庭关系上，从而减少自身支出。居家照护无需国家支付费用。"
 JAP_homeland_production_drive: "家庭作坊"
 JAP_homeland_production_drive_desc: "日本将进一步加大对国内制造业的投入，投资自动化和工人培训，以最大限度地利用日益萎缩的劳动力。日本不将生产外包或雇用移民，而是秉承“物造”的传统，即精益求精的制造工艺。但这样做也带来了能源消耗和成本上升的问题。"
 JAP_incentivize_large_families: "扩大儿童津贴"
 JAP_incentivize_large_families_desc: "日本将扩大“自养育儿津贴”的覆盖范围，每增加一个孩子，津贴金额就会相应增加。通过降低养育子女的成本，国家取消了对家庭规模的限制。一旦写入法律，这项津贴将成为一项永久性福利，任何未来的政府都不敢削减。"
 JAP_state_family_mandate: "家庭作为国家发展的必然要求"
 JAP_state_family_mandate_desc: "日本将通过就业法、养老金激励措施和社会信息来强制家庭组建，迫使女性成为母亲，男性成为父母。这是廉价的答案：国家在征召公民生育的同时花费很少。代价是合法性和怨恨。"
 JAP_a_nation_reborn: "国家重生"
 JAP_a_nation_reborn_desc: "日本的出生率趋于稳定并开始上升，母性受到尊重，地方社区也焕发了活力。日本通过持续的鼓励生育投资扭转了人口下降的趋势。二十年来，政府提供的各项津贴、住房补贴和养老服务已成为未来任何政府都无法削减的既得利益。"
 JAP_womenomics: "女性经济学"
 JAP_womenomics_desc: "日本将通过消除障碍、提供托儿服务以及转变企业文化，动员各经济领域的女性。这既能释放生产能力，又能增加税收，而无需增加生育数量。国家必须建立并维护托儿体系，而保守的日本人会将此解读为对家庭的攻击。"
 JAP_eliminate_daycare_waitlists: "零候补名单儿童计划"
 JAP_eliminate_daycare_waitlists_desc: "日本将实施育儿安全计划，扩建托儿所、日托中心和课后托管机构，直至消除所有等候名单。对员工工资和设施建设的大力投入，将消除女性参与劳动力市场的根本障碍。这些机构必须长期配备人员并提供资金支持。"
 JAP_reform_spousal_tax_deduction: "拆除103万日元的围墙"
 JAP_reform_spousal_tax_deduction_desc: "日本将取消配偶所得税扣除上限103万日元，并调整其后的社会保险缴费门槛。此举将消除全职就业的“惩罚”，此前这一限制已使数百万女性只能从事兼职工作。打破这一壁垒将使大量经验丰富、受过良好教育的女性获得全职就业机会。"
 JAP_normalize_parental_leave: "育儿爸爸运动"
 JAP_normalize_parental_leave_desc: "日本将发起“育儿爸爸运动”，保障父母双方享有带薪育儿假，并敦促男性休育儿假。当父亲普遍承担起照顾孩子的责任时，女性将不再受困于母职，育儿负担也将得以分担。企业将承担产量损失的成本，而工薪阶层也不会默默妥协。"
 JAP_women_in_management: "2020-30倡议"
 JAP_women_in_management_desc: "日本将努力实现2020-30年的目标：十个领导职位中有三个由女性担任。《促进女性参与和晋升法》为企业和公共部门设定了具有约束力的目标，强制要求信息披露，并奖励引领变革的企业。女性将在所有董事会和公务员部门中拥有举足轻重的权力。"
 JAP_family_first_model: "工作方式改革：家庭之路"
 JAP_family_first_model_desc: "工作方式改革运动将家庭路径置于首位：灵活的工作时间安排、兼职职业道路以及扩大的儿童津贴将使女性能够在不牺牲生育能力的前提下继续工作。这条路径接受整体产出下降，以兼顾事业和生育，并认为社会稳定和适度的人口复苏比最大限度的经济增长更为重要。"
 JAP_career_first_model: "工作方式改革：职业发展路径"
 JAP_career_first_model_desc: "工作方式改革运动优先考虑职业发展路径：不设灵活性，不设兼职，但晋升和薪酬方面真正实现平等。女性在所有职位上都享有同等的竞争优势，从而最大限度地提高经济产出和女性收入。这使得为人母更加艰难，而且由于许多人选择追求事业而非家庭，生育率将进一步下降。"
 JAP_a_society_where_women_thrive: "一个女性蓬勃发展的社会"
 JAP_a_society_where_women_thrive_desc: "结构性障碍已被消除，女性在各级工作中享有真正的平等和选择权，这既扩大了劳动力市场，也扩大了税基。然而，改革未能解决儿童问题。日本的工作时间和收入都在增加，但人口仍在萎缩，这依赖于国家必须永久资助的托幼和教育体系。"
 JAP_open_japan: "开放的日本"
 JAP_open_japan_desc: "日本将通过移民协议、技能型移民和签证改革等方式，系统性地从海外引进劳动力，以填补劳动力缺口。这将在几年内而非几十年内解决劳动力短缺问题，从而确保充分就业和养老金偿付能力。然而，文化认同将面临挑战，社区变革的速度将超过预期，每一步举措都可能引发民族主义的反弹。"
 JAP_labor_migration_pact: "双边劳动力流动协议"
 JAP_labor_migration_pact_desc: "日本将与邻国正式确立双边劳务安排，扩大技术实习生培训计划，并建立新的互惠协议，为建筑、农业、护理和制造业引进劳动力。这些协议快速高效：数万名工人可在数月内入职，填补关键的劳动力缺口，并稳定那些原本可能萎缩甚至完全消失的行业的就业。"
 JAP_points_based_immigration: "高技能专业人员计划"
 JAP_points_based_immigration_desc: "日本将建立一套高技能专业人才积分制，根据资历、工作经验、语言能力和居住年限等因素进行评分。工程师、护士、研究人员和金融专业人士填补了高价值职位空缺，缓解了经济增长的瓶颈。高技能人才的到来往往伴随着家庭，并期望子女接受国际化教育，这笔费用由国家承担，但作为交换，国家获得了原本无法通过其他途径获得的科研能力。"
 JAP_integration_programs: "多元文化共存融合框架"
 JAP_integration_programs_desc: "日本将通过语言课程、社区中心以及为外来务工人员及其家属提供永久居留途径，积极促进融合和多元文化共存。新移民若能获得融入社会所需的资源，就能减少摩擦，并更充分地做出贡献。为外来务工人员家庭提供语言培训、教育和福利将成为一项固定预算支出，用于弥补因移民管理不善而造成的警务成本。"
 JAP_multicultural_society: "多元文化社会"
 JAP_multicultural_society_desc: "日本赋予移民及其子女法律地位、公民参与权和文化认同，使他们成为国家共同体的正式成员。这深刻打破了日本历史上的封闭性，将潜在的怨恨转化为归属感，并维护了社会稳定。数百万新日本人享有完整的公民权利和福利，这是代价高昂且永久性的权利，不会再从他们的教育和社会保障账户中扣除。"
 JAP_guest_worker_system: "特定技术工人签证扩容"
 JAP_guest_worker_system_desc: "日本将扩大特定技能工人签证（特技工签证）的适用范围，引进签订定期合同的工人从事建筑、农业、护理和制造业等行业。他们来日本工作，合同期满后即可返回原籍国，从而填补劳动力缺口，避免了永久移民带来的种种摩擦。然而，这种做法造成了人口流动频繁，这些工人缺乏保障，也与当地社区缺乏联系，而监管工作也成为一项持续性的企业成本。"
 JAP_an_open_nation: "开放的国家"
 JAP_an_open_nation_desc: "日本人口通过移民趋于稳定并增长，从一个单一民族国家转变为一个多元文化国家。经济稳定和养老金保障得以维持，但民族同质性已然瓦解，老一辈人正为民族的消亡而感到惋惜。由于人口涌入速度超过了制度建设速度，治安、教育和社会保障等方面的投入在未来一代人的时间里仍将居高不下。"
 JAP_economic_sectors: "日本经济部门"
 JAP_economic_sectors_desc: "从植根于本土的农业、林业和渔业，到制造业、服务业和先进技术，我们将充分发挥日本在整个产业领域的优势。在支持国内就业和供应能力的同时，我们将平衡出口竞争力与对新兴增长领域的投资，从而将我们的产业基础带入下一个时代。"
 JAP_agricultural_revitalization: "振兴第一产业"
 JAP_agricultural_revitalization_desc: "农业、林业和渔业部对《基本法》进行了25年来的首次修订，将这三个部门纳入统一的国家粮食安全战略。随着农民平均年龄接近70岁，农村地区农田荒芜，这一整合将成为农村复兴和后续所有改革的基础。"
 JAP_corporate_farm_consolidation: "农田银行与减反政策的终结"
 JAP_corporate_farm_consolidation_desc: "农地整合银行将零散的地块合并成更大的农场，而取消减反政策水稻配额则结束了长达半个世纪以来向农民支付休耕费的做法。机械化和市场纪律将提高生产力，但无法参与竞争的小农户将被挤出土地。"
 JAP_revitalize_rural_communities: "区域振兴战略"
 JAP_revitalize_rural_communities_desc: "在“地方创生”的旗帜下，政府通过直接支付维持偏远地区的农业，并通过家乡税将城市财富带回村庄，吸引年轻家庭在原本会回归荒野的土地上定居。这里的增长速度慢于企业整合，但它使乡村保持活力。"
 JAP_smart_rice_farming: "智慧农业与清酒酿造工艺"
 JAP_smart_rice_farming_desc: "日本将稻米传统与智慧农业相结合：卫星导航、无人机和传感器驱动的稻田管理，使日益萎缩且老龄化的劳动力能够以更少的人手耕种更多的土地。越光稻米等高端品牌以及全球对日本清酒的渴求，将丰收的稻米带到了国内外的餐桌上。"
 JAP_premium_wagyu_brand: "和牛出口品牌"
 JAP_premium_wagyu_brand_desc: "日本凭借受保护的地理标志和保护和牛基因免遭走私的法律，将和牛发展成为一种高端出口产品，其价格取决于产地和品质，而非产量。世界顶级餐厅都会供应日本牛肉。"
 JAP_sustainable_fisheries: "《渔业法》改革"
 JAP_sustainable_fisheries_desc: "2018年对《渔业法》的改革是七十年来首次全面修订，它规定了基于科学的捕捞配额，奖励负责任的捕捞方式，同时加大对水产养殖业的投资，涵盖从养殖蓝鳍金枪鱼到近海贝类等各个领域。可持续的海洋环境将保障沿海城镇的正常运转，并维持国家的食物供应。"
 JAP_forestry_revival: "森林环境税"
 JAP_forestry_revival_desc: "在森林环境税的资助下，日本对被忽视的雪松和柏树种植园进行间伐和重新种植，实现采伐机械化，并推广交叉层压木材，使国产木材回归建筑工地。林业的复兴，让山村重拾就业机会，把长期闲置的资源转化为国家力量。"
 JAP_pharmaceutical_powerhouse: "应对药物滞后"
 JAP_pharmaceutical_powerhouse_desc: "日本第三大药品市场由武田、安斯泰来、第一三共和中外制药四大巨头占据，然而，药品上市滞后现象日益严重，导致患者需要等待数年才能获得海外药品。政府简化了药品和医疗器械管理局的审批流程，并大力扶持生物技术和再生医学，力图将一个成熟的产业转型为高价值增长的引擎。"
 JAP_rural_revitalization: "第六次工业化"
 JAP_rural_revitalization_desc: "在第六次工业革命中，初级生产者不仅生产产品，还进行加工和销售。农家乐、品牌化的地方食品和直接面向消费者的销售模式，使曾经贫困的村庄摇身一变，成为旅游胜地，吸引着年轻家庭重返土地，将其视为抵御人口流失最可靠的途径。"
 JAP_agricultural_construction_drive: "农业建设驱动"
 JAP_agricultural_construction_drive_desc: "在政治意愿和补贴到位的情况下，全国上下齐心协力推动新农田和农村设施的建设，加快农村地区的建设步伐。"
 JAP_automotive_industry: "国家的车轮"
 JAP_automotive_industry_desc: "七家日本汽车制造商每年共组装八百万辆汽车，支撑着日本约十二分之一的就业岗位，其中包括零部件制造商、经销商和运输商。从爱知县的组装车间到横滨的出口码头，日本将捍卫其作为世界最大汽车出口国的地位。"
 JAP_lean_production_system: "丰田生产系统"
 JAP_lean_production_system_desc: "丰田生产方式通过准时交付、自动化和持续改进等方式，不断消除浪费，塑造了现代制造业，使日本工厂能够以更少的缺陷和更低的库存生产出比任何竞争对手都多的汽车。日本将精益生产理念推广到整个行业，培养一代人发现他人看不到的浪费。"
 JAP_keiretsu_supplier_network: "经连会供应网"
 JAP_keiretsu_supplier_network_desc: "每一辆成品车的背后，都凝聚着一个由数十年信任维系的供应商金字塔：电装、爱信、丰田产业株式会社，以及成千上万家凭借精湛的“物造”技艺而成为各自领域的佼佼者的小作坊。日本将深化这些企业集团的联系，保障二三级供应商的生存，使供应链韧性成为一项战略资产。"
 JAP_precision_machine_tools: "制造汽车的机器人"
 JAP_precision_machine_tools_desc: "发那科和安川电机主导着全球工业机器人市场，而山崎马扎克、森三井和大隈则在精密机床领域树立了标杆。随着劳动力老龄化和萎缩，日本将继续大力投资机器人和机电一体化技术，保持其作为全球工厂设备制造中心的地位。"
 JAP_domestic_champions: "雷克萨斯标准"
 JAP_domestic_champions_desc: "雷克萨斯证明日本可以在自己的领域挑战德国豪华品牌，这一教训此后在整个行业传播开来。日本将培养其工程的品牌价值并追逐高利润细分市场，在质量和声誉上竞争，而不仅仅是价格。"
 JAP_hybrid_powertrains: "混合动力革命"
 JAP_hybrid_powertrains_desc: "普锐斯证明了日本敢于在其他国家畏惧的地方冒险，将汽油发动机和电动机结合起来，而无需建设当时全球尚未普及的充电网络。日本将继续加大对混合动力技术的投入，将其打造成连接石油时代与未来时代的务实桥梁。"
 JAP_battery_electric_shift: "电池动力赌博"
 JAP_battery_electric_shift_desc: "日产聆风是日本首款面向大众市场的电动汽车，但此后日本却眼睁睁地看着竞争对手在纯电池动力领域遥遥领先。为了迎头赶上，日本政府承诺大力推进固态电池的研发，并兴建一系列国内超级工厂，以确保汽车中最关键的部件 - 电池 - 能够在国内生产。"
 JAP_hydrogen_society: "迈向氢能社会"
 JAP_hydrogen_society_desc: "未来燃料电池轿车和《基本氢能战略》描绘了一幅愿景：汽车、卡车、住宅和发电站都将以宇宙中最丰富的元素 - 氢为动力，排放物只有水。日本将建设加氢网络，并支持燃料电池制造商，将氢能视为日本应对内燃机时代终结的独特方案。"
 JAP_automotive_superpower: "机动性超级大国"
 JAP_automotive_superpower_desc: "日本不会被迫选择一条通往未来的单一道路。通过同时掌握混合动力、电池和燃料电池技术，并保持精益化工厂和制造这些工厂的供应商网络处于世界一流水平，日本将巩固其作为本世纪移动出行超级大国的地位。"
 JAP_automotive_retooling_drive: "装配线改造"
 JAP_automotive_retooling_drive_desc: "全国范围内大力推进汽车装配线的改造和现代化，在投资和政治意愿协调一致的情况下，重新规划工厂以生产下一代汽车。"
 JAP_battery_gigafactory_program: "电池超级工厂计划"
 JAP_battery_gigafactory_program_desc: "集中力量建立国内电池超级工厂，快速提高电池产能，使电动汽车的核心部件在国内生产而不是进口。"
 JAP_motorcycle_kingdom: "二轮王国"
 JAP_motorcycle_kingdom_desc: "本田、雅马哈、川崎和铃木生产了地球上绝大多数的动力两轮车，从东南亚数亿人通勤使用的低跨式摩托车，到主宰MotoGP和世界超级摩托车锦标赛赛场的公升级超级摩托车，无所不包。日本将继续投资两轮车工厂，捍卫其在工程技术上的领先优势，使竞争对手在追赶日本发动机时始终落后一代。"
 JAP_kei_car_mobility: "轻型车之国"
 JAP_kei_car_mobility_desc: "在日本，近五分之二的新车属于轻型汽车，这种微型车的排量上限为660cc，这是根据当时较为贫困的国家制定的税法规定的。随着城市以外地区人口老龄化，轻型汽车成为退休人员前往诊所或商店的最后便捷交通工具。日本将继续保持轻型汽车价格亲民且质量优良，以保障铁路停运地区居民的出行。"
 JAP_jdm_soft_power: "高性能跑车国度"
 JAP_jdm_soft_power_desc: "Skyline GT-R、Supra和RX-7等车型通过《头文字D》等动漫作品和《GT赛车》系列游戏，成为全球汽车文化的标志性车型，并让一代玩家爱上了日本国内市场特供品牌。日本将继续发展这一品牌形象，并将其与钢铁产业、改装店、山路文化以及赛车运动传统相结合，使日本高性能汽车成为全球车迷心中的挚爱。"
 JAP_export_wharves: "出口码头"
 JAP_export_wharves_desc: "日本组装的车辆中，约有一半在横滨、名古屋或神户装上运输船，运往世界各地的港口，使日本成为全球最大的汽车出口国。政府将扩建码头、集散地和运输船队，以确保汽车出口畅通无阻。"
 JAP_automotive_export_drive: "汽车出口驱动"
 JAP_automotive_export_drive_desc: "在出口订单已满的情况下，全国范围内限时推进扩大组装和出口工厂产能，增加汽车和零部件工厂的班次和厂房面积。"
 JAP_electronics_revitalization: "重振电子和半导体行业"
 JAP_electronics_revitalization_desc: "日本电子产业曾经主导的市场已被韩国、台湾和中国的竞争对手挤出。在经济产业省的半导体振兴战略下，日本政府正整合其在材料、工具和精密工程方面的优势，重建竞争力。如果现在加大投资，日本有望重拾芯片领域的昔日辉煌。"
 JAP_semiconductor_materials: "材料与设备大师"
 JAP_semiconductor_materials_desc: "日本从未失去对芯片供应链上游的控制：东京电子主导着沉积和蚀刻设备，信越化学和SUMCO供应着全球硅晶圆，JSR和东京应化则占据着光刻胶市场。政府不断加大对这一优势的投资，使得所有外国晶圆代工厂都依赖于日本的材料和设备。"
 JAP_rapidus_moonshot: "拉皮杜斯宏大计划"
 JAP_rapidus_moonshot_desc: "由丰田、索尼和日本政府支持的拉皮杜斯公司正与IBM和校际微电子中心合作，在北海道千岁市建设一座2纳米制程的晶圆厂。多年来，没有一家日本公司能够触及尖端技术，与台积电的差距高达数十亿美元。如果该项目成功，日本将一举重返行业前沿。"
 JAP_foundry_partnership: "熊本工厂合伙公司"
 JAP_foundry_partnership_desc: "拉皮杜斯押注于尖端技术，而位于熊本的日本先进半导体制造则与台积电和索尼合作，为汽车和传感器生产成熟的工艺节点。这比登月计划的目标要低，也为经济发展奠定了基础：在国内批量生产芯片，以满足那些不能承受芯片短缺的行业的需求。"
 JAP_semiconductor_sovereignty: "半导体主权"
 JAP_semiconductor_sovereignty_desc: "设计公司、工具制造商、材料供应商和晶圆厂构成了一个自给自足的国内生态系统。在出口管制和贸易壁垒日益增多的时代，日本不会再依赖外国的善意来获取其经济赖以运转的硅材料。"
 JAP_home_electronics: "加拉帕戈斯的幽灵"
 JAP_home_electronics_desc: "“加拉帕戈斯综合症”导致日本消费电子产品在国内市场表现出色，但在海外却难以销售，功能手机在智能手机问世的瞬间便被淘汰。夏普、索尼和松下等公司被迫退出它们曾经统治的市场。政府负责稳定剩余的产业，维持生产线和工艺的运转，同时帮助整个行业重新站稳脚跟。"
 JAP_gaming_powerhouse: "游戏巨头"
 JAP_gaming_powerhouse_desc: "任天堂的游戏机销量位居史上前列，索尼的PlayStation则支撑起一个全球游戏帝国，而卡普空、世嘉、史克威尔艾尼克斯和万代南梦宫则为这两家公司提供软件支持。政府加大对游戏工作室和硬件的投资，并拓宽人才培养渠道，使日本始终处于互动娱乐行业的中心地位。"
 JAP_rights_and_licensing_regime: "海外版权和许可"
 JAP_rights_and_licensing_regime_desc: "动漫、漫画、游戏和音乐比任何大使馆都能更有效地传播日本的形象，“酷日本”计划旨在将这种影响力转化为实际收益。政府投资于发行、翻译和版权管理，确保创意作品在海外盈利，而不是流失到国外。每一份授权协议都严格遵守外国合同法和广播标准，而整个行业也正是在一次又一次的交易中逐步学习和掌握这些规则。"
 JAP_broadband_nation: "光纤之上的国家"
 JAP_broadband_nation_desc: "当世界大部分地区还在使用铜缆时，NTT及其竞争对手就已开始铺设光纤到户，使日本拥有了世界上速度最快、价格最便宜的网络连接。政府正在将高容量光纤延伸到最后一些服务不足的山谷和岛屿，确保日本的每个角落都能接入数字经济。"
 JAP_beyond_5g: "迈向超越5G时代"
 JAP_beyond_5g_desc: "日本在智能手机大战中被排除在外，也不打算错过5G之后的时代。日本政府资助研究联盟和开放的网络架构，涵盖从无线接入网到光纤骨干网的各个层面，因此日本企业能够制定2030年代网络的规则，而不仅仅是购买现有网络。"
 JAP_electronics_superpower: "电子超级大国再度崛起"
 JAP_electronics_superpower_desc: "材料、北海道和九州的晶圆厂、游戏主机以及光纤基础设施，如今共同构成了完整的电子架构。硅时代的昔日霸主已重返前沿阵地。首尔、台北和上海必须正视日本的回归。"
 JAP_energy_resource_strategy: "战略能源计划"
 JAP_energy_resource_strategy_desc: "经济产业省负责协调涵盖发电、电网韧性和资源安全的基本能源计划，以抵御能源冲击。从核能到可再生能源再到战略储备，该部门指导国家所有机构，确保电力供应和冶炼厂正常运转。"
 JAP_renewable_energy_expansion: "上网电价革命"
 JAP_renewable_energy_expansion_desc: "上网电价补贴政策释放了九州各地太阳能发电和秋田附近海域风电场的潜力，而“顶级能效标准”则让每台电器和每条生产线都摆脱了能源浪费。京瓷和夏普纷纷进军太阳能领域。太阳能和风能永远不应被禁运。"
 JAP_power_grid_stabilization: "永不再陷入黑暗"
 JAP_power_grid_stabilization_desc: "新型变频器和互连装置将全国连接成一个单一且具有弹性的系统，弥合了曾经分割电网的东部50赫兹和西部60赫兹的频率鸿沟。电力公司被要求保留备用容量，并根据实际情况选择使用太阳能、热能或储能来应对每一次冲击。"
 JAP_resource_security_initiative: "保障产业命脉"
 JAP_resource_security_initiative_desc: "国家资源战略涵盖战略储备、海外矿业权益、资源回收利用和专属经济区，所有这些举措都旨在保护工业免受禁运影响。各部委将钢铁、石油和稀有金属直接输送到最需要的工厂，从而将进口依赖转变为可控的韧性。"
 JAP_hydroelectric_power: "利用山间河流"
 JAP_hydroelectric_power_desc: "日本陡峭的雨水河流驱动着可靠的涡轮机，而像神奈川这样的抽水蓄能电站则在夜间储存廉价电力，以满足晚间用电高峰的需求。改造后的水坝提高了日本现有基础设施的发电量。水流清洁、来自国内且稳定。"
 JAP_hydroelectric_power_TT: "在§Y[613.GetName]§!，§Y[615.GetName]§!和§Y[616.GetName]§!增加水力发电产出§G25%§!"
 JAP_geothermal_development: "岛屿之下的火焰"
 JAP_geothermal_development_desc: "日本金属能源安全机构不顾国家公园和温泉所有者的反对，资助了从八丈岛到安比高原的地热勘探项目。双循环发电厂利用环太平洋火山带的热能，昼夜不停地发电，不受天气影响，为电网供电。"
 JAP_geothermal_development_TT: "在§Y[609.GetName]§!，§Y[616.GetName]§!和§Y[617.GetName]§!增加地热发电产出§G25%§!"
 JAP_nuclear_restart: "重启反应堆"
 JAP_nuclear_restart_desc: "在绿色转型政策的指导下，日本政府正逐步恢复从九州仙台到日本海沿岸庞大的柏崎-刈羽核电站群的核电运营。监管机构态度严格，公众也心存疑虑，但能源安全的现实不容妥协。核能必须再次承担起基础负荷。\n-------------\n重新启动核电并启动§Y反应堆重启计划§!，该计划将逐个恢复各核电站的运行。仙台、伊方和福井核电站群可同时重启；随着监管和审批工作的完成，其他难度较大的核电站也将陆续恢复运行。"
 JAP_nuclear_regulatory_compliance: "符合新的安全标准"
 JAP_nuclear_regulatory_compliance_desc: "寻求重启的核电站必须通过核监管局制定的全球最严格的标准：包括抗震和抗海啸改造、强制性安全设施安装，以及严格审查，绝不仅凭信任就批准任何项目。这项工作进展缓慢且耗资巨大，但却是恢复核电站正常运行的唯一途径。通过审查的核电站运行性能将优于重启前。\n-------------\n消除了§Y加强核安全标准§!国家精神，并开启了玄海、女川、岛根的重启。"
 JAP_local_consent_accords: "赢得当地民众的支持"
 JAP_local_consent_accords_desc: "重启项目需要的不仅仅是监管机构的批准，因为都道府县知事和所在市町村实际上拥有否决权，而且地方法院此前也曾颁布过禁令。鹿儿岛县和爱媛县通过与所在社区协商达成协议，提供补助、就业机会，并增强当地居民的耐心和信心，最终使仙台和伊方得以重启。补贴制度成本高昂，也正是它使得最艰难的重启项目成为可能。\n-------------\n开启泊和柏崎刈羽两个核电厂重启，这两处全国最难应对的站点。"
 JAP_restart_flagship_fleet: "六所村燃料循环"
 JAP_restart_flagship_fleet_desc: "位于青森县六所町的后处理厂完成了燃料循环，从乏燃料中回收钚和铀，用于新建反应堆。日本拥有分离钚及其进一步浓缩的能力，北京、首尔和平壤对此从未忽视。\n-------------\n日本的邻国会对这种储存方式持§R负面态度§!。"
 JAP_decommissioning_authority: "漫长的拆除"
 JAP_decommissioning_authority_desc: "安全拆除这些反应堆需要数十年时间，需要一支日益萎缩的核工程师队伍，而且反应堆停止运行后还需要长期进行场地管理。公众可以松一口气，但财政状况却不容乐观。世界上所有老旧反应堆都面临着同样的清算，率先掌握这项技术的国家可以将相关专业知识出售给其他国家。\n-------------\n启动频率转换、北海道本州高压直流设施和神户氢能项目。"
 JAP_lng_bridge_supply: "化石之桥"
 JAP_lng_bridge_supply_desc: "液化天然气和煤炭填补了闲置反应堆留下的缺口，使日本成为世界上最大的液化天然气进口国。富津和仙北的燃气发电厂建设速度快、运行负荷大，但所有货物的货款都以外币支付。差价最终转嫁到家庭电费上。\n-------------\n一座桥梁，而且是一座§R代价高昂§!的桥梁。氨气混烧项目是日本最终摆脱困境的途径。"
 JAP_renewable_acceleration: "阳光、风和水"
 JAP_renewable_acceleration_desc: "秋田和千叶海域的海上风电拍卖、公用事业规模的太阳能发电以及修订后的并网规则，推动可再生能源占比增长速度超过了以往仅靠上网电价补贴所能达到的水平。然而，间歇性和电网限制依然存在，而最便宜的电价仍然是日本已经学会放弃使用的那种。"
 JAP_fusion_energy_program: "更广泛的方法"
 JAP_fusion_energy_program_desc: "日本放弃了主办ITER项目，转而采取了更广泛的方案：在六所村建设聚变材料加速器和国际研究中心，在中町建设JT-60SA托卡马克装置。超导线圈、回旋管以及在等离子体物理领域长期的实践经验，便是这一交易的回报。\n-------------\n无论反应堆重启还是关闭，聚变能源的优势依然存在。这是两种方案都§Y不会排除的唯一一种能源选择§!。"
 JAP_national_energy_security: "动力十足的国家"
 JAP_national_energy_security_desc: "稳定、有韧性的能源供应（恢复基荷或可再生能源和储能电网）建立在超越核裂变的研究基础之上。能源安全成为更广泛经济的基础。"
 JAP_monarchy_resource_anchor_tt: "§Y$JAP_rare_earth_resilience$§!的效果将提高"
 JAP_reactors_recommissioned_tt: "已关闭的反应堆已§G重新启用§!，并可能再次发电。"
 JAP_national_energy_security_tt1: "§Y8§!座反应堆有§Y6§!座已经恢复工作（当前§Y[?JAP_reactor_sites_online|0]§!）："
 JAP_national_energy_security_tt2: "§Y8§!座绿色转型项目有§Y6§!座已经实装（当前§Y[?JAP_gx_projects_completed|0]§!）："
 JAP_national_energy_security_tt3: "未达到任一标准："
 JAP_minamitori_deep_sea: "南鸟岛之泥"
 JAP_minamitori_deep_sea_desc: "日本专属经济区南鸟岛附近的海底蕴藏着地球上其他任何地方都找不到的稀土泥，其海水深度超过五千米。日本地质矿业企业局和东京大学正在资助立管和提升试验，以使开采成为可能。如果能够成功开采出这些泥浆，日本将不再依赖单一的外国供应商来获取其磁体和电机所需的金属。"
 JAP_national_petroleum_stockpile: "充实国家储备"
 JAP_national_petroleum_stockpile_desc: "日本金属能源安全机构扩建了位于志布志、喜入和苫小牧沿海油库的战略石油储备，新增了盐穴和地上筒仓。更大的储备量为日本提供了数月的保障，以应对霍尔木兹海峡关闭的风险。充足的储备意味着强大的无声力量。"
 JAP_grid_battery_storage: "未来电网"
 JAP_grid_battery_storage_desc: "锂离子电池时代的先驱企业杰士汤浅和松下，正将电池技术转向电网级储能，而政府补贴则为变电站旁拔地而起的储能电池项目提供资金支持。结合更智能的电网，储能可以平抑用电高峰，填补用电低谷。中午储存的电量，在黄昏时分照亮城市。"
 JAP_urban_mining: "挖掘城市"
 JAP_urban_mining_desc: "三菱材料公司位于直岛和尾滨的工厂从世界各地运来的电子废料中回收黄金、铜和稀有金属。东京奥运会的奖牌就是用回收金属铸造的。日本丢弃的废料，在这里被重新冶炼。"
 JAP_horizontal_recycling: "无尽金属"
 JAP_horizontal_recycling_desc: "水平回收利用将铝和钢恢复到原始等级，从而形成从废料场到轧钢厂的闭环。日铝全综和神户制钢共同建造的分类和精炼生产线，实现了从罐到罐、从零件到零件的工业化回收利用。每回收一吨，就意味着无需再次进口一吨。"
 JAP_nankai_methane_hydrate: "南海槽的火冰"
 JAP_nankai_methane_hydrate_desc: "日本金属能源安全机构正全力推进其研究船队，力求找到开采太平洋南海海槽甲烷水合物的商业方法。日本曾在此进行过世界首个海上甲烷水合物生产试验，但该技术的可行性尚未得到验证，经济效益也依然令人望而却步。如果南海海槽蕴藏着丰富的甲烷水合物，日本将不再需要为天然气而苦苦挣扎。"
 JAP_model_competition: "东亚电子竞赛"
 JAP_model_competition_desc: "日本电子产业正与邻国展开一场激烈的竞争。三星和SK海力士主导着存储器市场，台积电拥有领先的晶圆代工业务，而中国晶圆厂则在近乎无限的国家基金支持下，逐个节点地提升技术水平。竞争对手的每一次进步都意味着市场份额的流失、利润空间的压缩，以及一代工程师被海外人才吸引。只有持续的投资才能缓解压力；一旦放松投资，而竞争对手却步步紧逼，日本的根基终将崩塌。\n-------------\n提高§Y电子产品抵抗能力§!，使其超越竞争压力，就能缓解并最终消除此国家精神。查看§Y$JAP_technological_isolation_category$§!获得当前数据。"
 JAP_consumer_electronics_drive: "消费电子产品驱动"
 JAP_consumer_electronics_drive_desc: "这是一项限时举措，旨在保持国内消费电子产品生产线满负荷运转，维持工厂、供应商和组装这些产品的熟练工人的生计，帮助整个行业渡过难关。"
 JAP_foundry_localization: "工厂本地化计划"
 JAP_foundry_localization_desc: "集中力量实现晶圆代工供应链的本地化，围绕新晶圆厂建立工具、材料和训练有素的技术人员，以便国内芯片生产能够快速提升。"
 JAP_electronics_export_offensive: "电子出口攻势"
 JAP_electronics_export_offensive_desc: "发起一系列协调一致的补贴、贸易考察和联合营销活动，以从外国竞争对手手中夺回市场份额，并投入巨资巩固日本在全球电子贸易中的地位。"
 JAP_electronics_resilience_up_tt: "§Y电子产品抵御§!外国竞争的能力：$RIGHT|+=0$"
 JAP_CHI_chip_rivalry: "半导体对手"
 JAP_electronics.1.t: "亚洲挑战者逼近"
 JAP_electronics.1.d: "东京方面对季度财报感到担忧。三星和SK海力士在存储器领域的领先优势进一步扩大，台积电的订单爆满，中国晶圆代工厂正在赢得那些原本理所当然属于日本的合同。分析师们公开表示，日本电子行业正处于结构性衰退之中。川崎和大阪的董事们都明白这一点：竞争对手不再是追赶者，而是遥遥领先。"
 JAP_electronics.1.a: "我们绝不会不战而降，拱手让出市场。"
 JAP_electronics.2.t: "中国抵达前沿"
 JAP_electronics.2.d: "这条消息犹如晴天霹雳。在国家集成电路基金的支持下，中国晶圆厂无视西方多年的制裁，已在逻辑电路制造领域占据领先地位，而全球只有极少数企业能够企及这一水平。日本产业界最后一点自以为是的“大陆落后一代”的心态也随之破灭。技术前沿已经转移，日本必须做出抉择：是迎接挑战，还是被时代抛在身后。"
 JAP_electronics.2.a: "前沿阵地已经转移。我们必须做出回应。"
 JAP_electronics.3.t: "日本重夺硅谷霸主地位"
 JAP_electronics.3.d: "尽管困难重重，但形势已经逆转。日本的制造工厂出货量大幅增长，日本材料依然不可或缺，日本的设计和内容赢得了全世界的尊重。首尔、台北和上海的竞争对手并未消失，但近几十年来，他们第一次感到压力倍增。漫长的衰落已经结束；日本再次以强大的姿态参与竞争。"
 JAP_electronics.3.a: "日本再次站在了产业的顶峰。"
 JAP_electronics.4.t: "日本重返半导体前沿"
 JAP_electronics.4.d: "从北海道到九州，从研发实验室到游戏工作室，再到光纤网络，日本完成了几乎无人预料的复兴。十年前，这个曾被认为在电子时代日渐式微的国家，如今已重返科技前沿，并发出明确的信号：它将一直保持领先地位。东亚科技竞赛的格局已经改变，从首尔到华盛顿，每个国家的首都都在重新评估形势。"
 JAP_electronics.4.a: "一次惊人的复苏。"
 JAP_electronics.4.b: "老狗也有几颗牙。"
 JAP_demographic_pressure_modifier: "人口压力"
 JAP_demographic_pressure_modifier_desc: "日本是世界上老龄化程度最高、人口萎缩速度最快的国家之一，死亡人数超过出生人数，劳动年龄人口急剧减少。这场危机使支撑生产的劳动力捉襟见肘，福利和医疗保健预算捉襟见肘，财政稳定受到侵蚀，社会结构也面临考验。日本在人口、劳动力、稳定性、失业、医疗成本和社会成本这六个方面都面临着相互关联的压力。持续、多方面的改革，涵盖家庭、就业和移民政策，可以减轻这些负担，并使日本走上人口稳定或增长的道路。"
 JAP_economy_modifier: "日本经济"
 JAP_economy_modifier_desc: "日本经济复兴的共同引擎。随着历届政府面临人口下降和来自韩国、中国和台湾日益激烈的竞争，改革渗透到经济的各个支柱：养活国民的农田和渔业，支撑出口的汽车制造商和机床企业，力图摆脱停滞的半导体和电子巨头，为这个几乎没有自给自足的群岛国家保障能源和关键资源的努力，以及连接各岛屿的铁路干线。每一项进步都会产生累积效应，提高生产力、工厂效率和研发水平，同时也在重塑日本对其产业、资源和电网的需求。"
 JAP_political_modifier: "国会"
 JAP_political_modifier_desc: "为应对人口危机而进行的改革正在重塑国家政治，使该国向移民开放，同时也考验着一个不习惯变革的国家的社会凝聚力和稳定性。"
 JAP_f15_programe_desc: "三菱公司授权生产的F-15J机队正分阶段进行现代化改造：保留的机型将配备新型雷达、任务计算机和座舱显示器，其余机型则采用精简的供应链。战斗机和航空航天研究进展更快，轻型和中型飞机的生产成本也更低。"
 JAP_submarine_modernization_idea_desc: "柴电动力艇队逐步过渡到不依赖空气推进系统，之后又采用锂离子电池，从而在不依赖反应堆的情况下延长水下续航时间。川崎和三菱在神户轮流建造艇体，这样既保证了两个船厂的产能，又降低了单艇成本。"
 JAP_carrier_aviation_desc: "自1945年以来，日本海军首次重新拥有固定翼舰载航空兵。直升机驱逐舰被重新评估为航空舰艇，甲板涂层和升降机被研究用于短距起飞飞机，航母舰载航空大队的作战理论工作正式开始。"
 JAP_keen_sword_operation_idea_desc: "与美国每两年举行一次的联合演习，使海上自卫队得以进行大规模的联合舰队机动、两栖登陆和防空演练，这是其单独行动无法达到的规模。演习结束后，官兵们的技能更加精湛，所学到的经验教训也受益匪浅。"
 JAP_nuclear_power_program: "长期核计划"
 JAP_nuclear_power_program_desc: "52座反应堆供应着日本约三分之一的电力，原子能委员会的长期计划致力于在日本建立以六所村后处理厂为核心的闭式燃料循环系统。尽管运行性能优异，但公众支持率却大幅下降。东海村JCO核电站的临界事故造成两名工人死亡，并摧毁了公众对核工业及其监管机构的信任。2000年3月，政府对所有20座拟建核电站的建设方案进行了审查。由于牧町在全民公投中否决了核反应堆项目，因此无法指望任何都道府县会接受新的选址。"
 JAP_nuclear_local_consent: "地方同意协议"
 JAP_nuclear_local_consent_desc: "通过具有约束力的安全协议、收益分成以及重启前协商权，都道府县知事和所在市町村重新参与到核电建设过程中。曾阻碍日本核电建设长达一代人的否决权，如今已通过谈判而非被推翻而取消，电力公司可以再次规划新的核电产能。"
 JAP_consolidate_national_defense_framework_cancel_tt: "Ends once the §YArticle 9§! bonus to §Ystability§! has faded and the penalties to §Ywar support§! and §Yrecruitable population§! have been fully worked off"
 JAP_modernize_joint_command_cancel_tt: "Ends once the §YArticle 9§! penalties to §Yarmy, air and naval experience gain§!, §Ycommand power§! and §Yofficer costs§! have been fully worked off"
 JAP_normalize_defense_procurement_mission: "规范国防采购系统"
 JAP_normalize_defense_procurement_mission_desc: "国防责任的扩大给现有的采购和产业体系带来了巨大压力。日本正通过审慎的改革、长远的规划以及与产业界的更紧密合作，努力使国防采购正常化，并减少过渡期的低效现象。"
 JAP_normalize_defense_procurement_cancel_tt: "Ends once the §YArticle 9§! penalties to §Yarmy attack§! and §Yarmy defence§! have been fully worked off and the bonuses to §Ycore territory attack§! and §Ycore territory defence§! have faded"
 JAP_establish_asteroid_mining_network_mission: "建立小行星采矿网络"
 JAP_establish_asteroid_mining_network_mission_desc: "日本正在组建其首个小行星采矿网络，部署轨道平台和勘探设备，地外资源开采作业开始成形。"
 JAP_reactor_restart_category: "反应堆重启计划"
 JAP_reactor_restart_category_desc: "曾经有54座反应堆供应了日本三分之一的电力。2011年后，所有反应堆全部停止运行。重启这些反应堆并非一蹴而就，而是一场逐个电站、逐个都道府县展开的艰苦斗争。每一次重启都需要长达数年的监管审查、一位对忧心忡忡的选民负责的知事的批准，以及高达数千亿日元的抗震改造费用。而这一切的回报，将是日本有史以来最廉价的基础负荷电力。\n\n每次重启成功，都能§G永久性地提高§!日本的核能发电能力，并降低核电站的维护成本。"
 JAP_restart_sendai: "重启仙台"
 JAP_restart_sendai_desc: "九州电力公司位于鹿儿岛县萨摩仙台的两台压水式核电机组是日本首批通过新安全标准的机组。2015年8月，仙台1号机组成为近两年来首个恢复发电的日本核反应堆。伊藤知事的批准使这一切成为可能；防波堤、过滤式排气口和应急控制中心则确保了机组的安全。"
 JAP_restart_ikata: "重启伊方"
 JAP_restart_ikata_desc: "四国电力公司的电站位于爱媛县狭长的佐佐木屿半岛上，中央构造线从离岸几公里处穿过。3号机组于2016年恢复运行，但此后多次因邻近县法院的裁决而停运和复运。在日本，没有哪家电厂比这家更能说明，获得监管机构的许可仅仅是成功的一半。"
 JAP_restart_takahama_ohi: "重启福井集群"
 JAP_restart_takahama_ohi_desc: "福井县拥有日本最密集的核反应堆。关西电力公司位于高滨、大饭和美滨的机组曾为大阪和神户的工业供电数十年，其中一些机组如今已运行超过四十年，需要单独申请延期才能继续运行，而这一过程也曾引发争议。重启该核电站群将一举恢复福井县工业中心地带的电力供应。"
 JAP_restart_genkai: "重启玄海"
 JAP_restart_genkai_desc: "九州电力公司位于佐贺县的玄海核电站于2018年完成改造后重新投入运行，改造工程包括建造了首批符合新规的专用安全设施之一。源海核电站还承担着日本的超热核燃料项目，燃烧混合氧化物燃料，从而形成反应堆与六所村后处理厂之间的部分闭环。"
 JAP_restart_onagawa: "重启女川"
 JAP_restart_onagawa_desc: "宫城县女川市比福岛第一核电站更靠近2011年地震的震中，其14米高的海堤经受住了考验。该镇将疏散人员安置在核电站的体育馆内。2号机组计划于2024年恢复运行，这是与福岛第一核电站同类型的沸水反应堆首次重启，也是核工业界提出的最有力论据。"
 JAP_restart_shimane: "完成岛根单元3"
 JAP_restart_shimane_desc: "中国电力公司的核电站是日本唯一一座位于县府所在地、松江市郊的核电站。3号机组虽然已经建成，但从未投入使用，在漫长的停运期间一直处于闲置状态。此次重新启用并非重启，而是全新的开始，在此过程中积累的建设经验将不会再次流失。"
 JAP_restart_tomari: "重启泊"
 JAP_restart_tomari_desc: "北海道电力公司位于泊核电站的三台机组是北海道北部岛屿上唯一的核电站。它们的停运使北海道的电力供应依赖于一条狭窄的互联线路和老化的火力发电设施，2018年全岛大停电事件就充分暴露了这一点。该厂址的抗震性能评估工作持续了十多年。恢复泊核电站的运行是北海道电网恢复完整的关键。"
 JAP_restart_kashiwazaki_kariwa: "重启柏崎-刈羽"
 JAP_restart_kashiwazaki_kariwa_desc: "新潟海岸的七台机组使柏崎刈羽核电站成为有史以来建造的最大核电站。它也是东京电力公司的，这家公司曾遭受福岛核事故的重创，新潟县知事多年来一直不愿忘记这段历史。该电站的安全漏洞一度导致东京电力公司失去运营许可。如果柏崎刈羽核电站能够恢复运营，那么日本核电站的重建之路就指日可待了。"
 JAP_gx_transition_category: "绿色转型"
 JAP_gx_transition_category_desc: "一个没有核反应堆的日本必须另寻能源，而这个群岛除了风能、热能和工程师之外，什么都缺。绿色转型就是答案：在无法锚泊的深海中建造漂浮式涡轮机，利用北部山脉下的火山热能，最终建成跨越50赫兹和60赫兹频段鸿沟的电网，以及最重要的 - 日本人超乎想象的节能能力。\n\n每个已完成的项目都会§G永久性地提高§!日本的可再生能源产量或降低国家需求，并永久关闭其所在地区的反应堆。"
 JAP_gx_goto_floating_wind: "五岛漂浮式海上风电"
 JAP_gx_goto_floating_wind_desc: "日本近海海床坡度过陡，无法采用北海常用的固定式基础，因此日本的海上风电项目只能依靠系泊在深水区的浮式平台。位于长崎五岛列岛附近的风电场阵列是这项技术的试验场，而曾经建造油轮的造船厂自然而然地成为了建造这些平台船体的理想场所。"
 JAP_gx_tohoku_geothermal: "东北地热集群"
 JAP_gx_tohoku_geothermal_desc: "日本拥有世界第三大地热储量，却几乎未曾开发利用，原因在于国家公园的边界以及温泉业主担心钻探会抽取他们的水源。岩手县安比市的地热发电厂于2024年打破了这一僵局，成为数十年来日本首个大型地热发电厂。火山所在之处，能量亦在，无论在黑暗还是平静中，能量都源源不断地涌动。"
 JAP_gx_kanto_setsuden: "节电运动"
 JAP_gx_kanto_setsuden_desc: "灾后那个夏天，东京的用电量大幅减少。办公室调暗了灯光，人们不再系领带；工厂将工作时间调整到周末；首都顺利度过了用电高峰期，没有出现人们预想中的大停电。节电原本只是一项应急措施。但通过建筑规范、行业标准以及“领跑者”计划，它已成为一项永久性设施，其价值远超一座发电站，而成本却仅为发电站的一小部分。"
 JAP_gx_frequency_converter: "频率转换扩展"
 JAP_gx_frequency_converter_desc: "东京的电网频率为50赫兹，因为它在19世纪90年代购买了德国发电机；大阪的电网频率为60赫兹，因为它购买了美国发电机。一个世纪过去了，日本东西两部分仍然无法自由共享电力。2011年，西部地区只能向东部输送1吉瓦的电力，而东京却陷入一片黑暗。佐久间、新信浓和东清水换流站的扩建最终将两个国家电网合并为一个。"
 JAP_gx_hokkaido_hvdc: "北海道内部输电互联"
 JAP_gx_hokkaido_hvdc_desc: "北海道拥有日本最丰富的风能资源，但利用风能的人口却最少，这种矛盾导致北海道的风力涡轮机闲置，而本州则依赖进口天然气。一条沿日本海海岸延伸的高压直流输电线路可以将北海道的风能输送到用电需求地区，这条线路本可以在2018年全岛大停电期间保障电力供应。"
 JAP_gx_kobe_hydrogen: "神户氢气供应链"
 JAP_gx_kobe_hydrogen_desc: "2022年，全球首艘液氢运输船停靠在神户港，标志着从澳大利亚褐煤矿区到港岛码头的供应链正式完工。氢气燃烧不产生碳排放，可以储存涡轮机产生的、电网目前无法利用的氢气。川崎重工耗时十年建造了用于运输氢气的油轮、储罐和涡轮机。"
 JAP_gx_hekinan_ammonia: "氨气混烧"
 JAP_gx_hekinan_ammonia_desc: "位于爱知县碧南市的燃煤电厂是日本最大的燃煤电厂。捷热公司一直在向该电厂的锅炉中同时添加氨气和煤炭，最初的比例为五分之一，并逐步提高。氨气携带氢气，其形式是船舶和管道能够轻松处理的形式，这使得现有的火力发电厂能够在不拆除重建的情况下减少燃料消耗。"
 JAP_gx_shikoku_solar_storage: "四国太阳能和储能"
 JAP_gx_shikoku_solar_storage_desc: "四国拥有日本最强的日照，但电网规模较小，中午时分的太阳能发电量由于缺乏储存空间而不得不被限制。将公用事业规模的太阳能阵列与电网储能电池相结合，可以将中午的过剩电力转移到傍晚的用电高峰时段，从而弥补账面上可再生能源装机容量与实际使用可再生能源发电量之间的差距。"
 JAP_rubber_butadiene_branch_decision: "丁二烯橡胶支线"
 JAP_rubber_butadiene_branch_decision_desc: "天然橡胶可能被切断供应、实行配给制或价格暴跌，日本绝不能允许这种情况发生。我们将扩大丁二烯基合成橡胶的生产，以确保轮胎、密封件以及工业和军队的关键部件供应。"
 JAP_demand_south_kuril_reject_tt: "我们可能在§Y$STATE_1168$§!发起§Y边境冲突§!，或对§R[SOV.GetName]宣战§!以使用武力夺回北方领土。"
 JAP_demand_north_kuril_reject_tt: "我们可能在§Y$STATE_1168$§!发起§Y边境冲突§!，或对§R[SOV.GetName]宣战§!以使用武力夺回北方领土。"
 JAP_demand_sakhalin_reject_tt: "我们可以在§Y$STATE_691$§!解锁§Y特战部队突袭§!，或对§R[SOV.GetName]宣战§!以使用武力夺回北方领土。"
 JAP_claiming_philippines: "对菲律宾群岛提出主权要求"
 JAP_claiming_philippines_desc: "菲律宾群岛扼守着通往西太平洋的要道和支撑我国工业的海上航线。我们将正式提出主权声索，并明确表明这些岛屿属于日本的战略范围，无论其他国家是否同意。一旦宣布，该地区将明白，我国海军将决定谁能通过这片海域。"
 JAP_demographic_emergency_taskforce: "出生率下降紧急应对措施"
 JAP_demographic_emergency_taskforce_desc: "为应对人口骤减，政府成立了全政府紧急工作组，其架构仿照儿童及家庭事务厅，协调各相关部门的资源快速调配。政治高度重视，官僚机构的壁垒被打破，政策试验得以大量开展。然而，这种高度集中和动员的时期是暂时的；经过730天的持续努力，紧急状态逐渐消退，政策制定回归正常的体制模式，但改革本身却得以延续。"
 JAP_increase_birth_budget: "紧急儿童津贴翻倍"
 JAP_increase_birth_budget_desc: "日本将向儿童津贴体系注入紧急财政资金，使直接发放给有子女家庭的现金补贴翻倍。这项立竿见影、引人注目的支出将缓解年轻家庭的困境，并表明政府对生育的承诺，短期内有望提升生育率。从长远来看，此举成本巨大，将大幅增加永久性福利预算，但人口红利足以弥补这一支出，尤其是在生育率持续低迷的情况下。"
 JAP_child_care_subsidies: "普及免费幼儿早期教育和保育"
 JAP_child_care_subsidies_desc: "根据2019年10月出台的政策，日本将为所有家庭提供免费的幼儿教育和保育服务，免除托儿所和幼儿园的学费。这项补贴消除了父母就业的一大障碍，使照护者（主要是母亲）能够重返职场，并使收入有限的家庭能够生育更多子女。该计划虽然耗资巨大，但既能增加就业机会，又能适度提高生育率。"
 JAP_invest_in_robotics: "社会5.0自动化驱动"
 JAP_invest_in_robotics_desc: "日本将加快推进2015年提出的“新机器人战略”，通过补贴工业自动化、人工智能和机器人技术来弥补劳动力缺口。通过用机器取代建筑、制造和物流领域的人力，日本可以在劳动力规模较小的情况下维持产量。这项战略虽然资本密集，但效果显著。然而，低技能工人的流失可能会在初期推高失业率，直到运营和维护等新岗位出现。"
 JAP_fertility_ivf_program: "体外受精保险"
 JAP_fertility_ivf_program_desc: "日本将扩大体外受精和辅助生殖技术的保险覆盖范围，使所有符合条件的夫妇无论收入多少都能获得治疗。从2022年开始，保险补贴将消除不孕不育治疗的经济障碍，使原本无法生育的夫妇能够拥有自己的孩子。此举将显著提高出生率，但同时也将大幅增加医疗保健系统的成本负担，给公共财政带来压力。"
 JAP_family_housing_construction: "经济适用家庭住房计划"
 JAP_family_housing_construction_desc: "日本将资助大规模建设面向有子女家庭的经济适用型住宅。高昂的地价和房价是组建家庭的主要障碍；补贴建设降低了年轻夫妇结婚生子的经济门槛。该计划虽然需要大量资金投入，但它通过为年轻家庭提供可靠的购房途径来稳定社会，并表明国家对他们未来的承诺。"
 JAP_marriage_support_program: "新婚夫妇支持计划"
 JAP_marriage_support_program_desc: "日本将为新婚夫妇提供住房补助和婚介服务补贴，包括为婚姻狩猎计划和人工智能驱动的婚介平台提供资金。该州还将与地方政府合作组织社区层面的婚姻活动。通过减少婚姻形成方面的财务和社会摩擦，该计划以比单独生育激励措施更低的财政成本推动出生率上升，尽管效果不大。"
 JAP_raise_retirement_age: "老年人就业稳定法案"
 JAP_raise_retirement_age_desc: "日本将逐步提高法定退休年龄至70岁，同时延长强制性就业缴费期限并推迟领取养老金的年龄。根据2021年的立法，政府将鼓励雇主留住年长员工，并敦促他们提供超过传统65岁退休年龄的续约工作。此举在政治上会带来一些阻力，员工对延长工作年限感到不满，政府也需要耗费政治资本才能推动其实施，但劳动力规模将直接扩大，养老金负担也将减轻。"
 JAP_silver_employment_initiative: "银发人力资源中心"
 JAP_silver_employment_initiative_desc: "日本将在每个主要城市设立并资助“银发人力资源中心”，为65岁以上的健康老年人提供兼职工作安排、再培训和指导。这些中心将为需要灵活劳动力的雇主（例如清洁工、保安、育儿助理和行政人员）匹配经验丰富的退休人员。该计划成本低廉，维护老年人的尊严，并在不提高强制退休年龄的情况下增加生产力，从而以适度的成本缓解失业压力。"
 JAP_preventive_health_program: "健康预期寿命倡议"
 JAP_preventive_health_program_desc: "日本将投资于全民预防保健：包括补贴筛查、疫苗接种、生活方式指导以及慢性病早期干预。通过保持老年人口的健康状态和更长时间的功能独立性，国家可以减少老年人入住费用高昂的重症监护室和养老院的时间。该计划纯粹以预防为主（不治疗疾病，而是预防疾病的发生），由于老年人能够保持活力和自理能力直至八十多岁，因此可以显著降低医疗保健成本，从而带来丰厚的回报。"
 JAP_elderly_care_reform: "长期护理系统现代化"
 JAP_elderly_care_reform_desc: "日本将改革长期护理保险制度，从机构（养老院）护理转向以社区为基础的综合护理：以家庭护理员、日间照护中心、社区诊所和家庭支持为主，而非昂贵的养老院。通过减少对高成本机构的依赖并动员社区力量，国家可以削减医疗和社会保障预算。这一转型过程会带来一些不便，部分人群将失去他们偏好的机构护理，过渡期间行政管理也会面临压力，但从长远来看，节省的费用相当可观。"
 Japan.105.t: "帝国宣言"
 Japan.105.d: "公告草稿静静地躺在内阁的桌子上，旁边盖着印章，日期一栏留空。一切已恢复如初：王室成员安然无恙，礼仪照常进行，枢密院照常开会。唯一尚未定稿的，只有措辞。\n\n陆军大臣首先发言。衡量一个帝国的标准在于其领土范围，在于其征召的部队和占领的阵地，宣言也应体现这一点。海军大臣低声回应。日本是一个依靠海上航线生存的岛国，一面在舰队上空升起的旗帜，从符拉迪沃斯托克到新加坡，每个港口都能正确解读。两人沉默下来，目光转向王座。"
 Japan.105.a: "£JAP_EMPIRE_flag 帝国的实力在于其军队。"
 Japan.105.b: "£JAP_EMPIRE_NAVAL_flag 帝国的实力在于海洋。"
 JAP_american_pressure_article_nine_desc: "华盛顿已将贸易问题与国防问题捆绑在一起。美国正利用关税威胁和资源杠杆迫使东京承担更广泛的军事角色，在争端解决之前，日本在谈判桌上始终处于弱势地位。"
 JAP_jsw_tank_mio_trait_ladle_refining: "清洁钢包精炼"
 JAP_jsw_tank_mio_trait_muroran_arc_furnace: "室兰电弧炉"
 JAP_jsw_tank_mio_trait_high_tensile_plate: "高强度钢板轧制"
 JAP_jsw_tank_mio_trait_scrap_recycling: "废料回收生产线"
 JAP_jsw_steel_modifier: "日本制钢所"
 JAP_jsw_steel_modifier_desc: "每一笔向日本制钢所下的订单，实际上都是向室兰制钢所下的订单。用于浇铸炮管和装甲钢板的熔炉，也为造船厂、建筑业和汽车制造商提供钢材，每一份确保这些熔炉满负荷运转的合同，都让日本对进口钢坯的依赖程度降低。国防预算用于购买炮钢的金额，最终会转化为整个经济的吨位收益。"
 JAP_zombie_companies: "僵尸公司"
 JAP_zombie_companies_desc: "多年的宽容政策让那些亏损且负债累累的企业依靠廉价信贷苟延残喘，占用了更健康行业所需的资本、劳动力和管理资源。除非这些企业进行重组或清算，否则建筑业、生产力和企业税收都将受到影响。\n-------------\n§Y企业重组进程§!的加快会逐渐削弱该国家精神，直至其消失。查看§Y$JAP_corporate_reform_category$§!获得更多信息。"
 JAP_ykk_group: "YKK集团"
 JAP_ykk_group_desc: "吉田工业株式会社生产的拉链约占全球总产量的一半，年产量高达70亿条，其工厂遍布70多个国家。该公司自行加工黄铜、纺制聚酯纤维、调配染料，并制造组装成品拉链的机器，这种垂直整合模式确保了产品生产的各个环节都完全由其掌控。军用采购在其业务中所占份额虽小，但要求却十分严格，因为防弹背心、负重背心或迷彩服上的拉链往往是战场上最先失效的部件。日本的制服和防护装备项目倾向于选择能够自主改进织带、涂层或耐腐蚀合金的供应商，而不是依赖分包商。"
 JAP_karoshi_crisis: "过劳死危机"
 JAP_karoshi_crisis_desc: "长期过度劳累正在摧残日本的劳动力。过多的无偿加班，以及“服务型劳动”文化，导致工薪阶层中风、心力衰竭和自杀率上升，而疲惫不堪的家庭则推迟生育。社会稳定、生产力和科研都受到影响，医疗和社会支出不断攀升，人口数量逐年下降。\n-------------\n通过国策改革分支来提高§Y劳动者福祉§!，逐步削弱此国家精神。尽管日本的§Y僵尸企业§!问题仍未解决，但每个月的文化收益却下降了§R75%§!。查看§Y$JAP_corporate_reform_category$§!以获得更多信息。"
 JAP_karoshi: "过劳死"
 JAP_karoshi_desc: "政府将过劳死列为国家危机：工人因过度劳累、中风、心力衰竭而死于办公桌前，或在连续工作数百小时后自杀。电通员工高桥茉莉的死亡使这一问题再次成为国家关注的焦点，并导致该公司总裁丢掉了工作。现在，政府必须决定在多大程度上介入工作场所，以确保工作能够保障员工的生存。"
 JAP_corporate_laws: "改革劳动标准法"
 JAP_corporate_laws_desc: "政府选择立法途径，通过《工作方式改革法》堵住《宪法》第36条的漏洞，并以由强化后的劳动标准监察局强制执行的硬性上限取代第36条。要取得胜利，就意味着要在国会的每个委员会阶段都与雇主和弹性工时游说团体作斗争。这是三种解决方案中最全面的，但也是进展最慢的。"
 JAP_cultural_change: "直面过度劳累文化"
 JAP_cultural_change_desc: "政府的改革策略是着眼于文化而非法律：每月一次的“加班星期五”让员工提前下班，心理健康筛查进入工作场所，年度“过劳死白皮书”让雇主和招聘人员都能清楚地了解过劳死案例。然而，所有这些都无法触及一条不成文的规则：勤奋的员工只有在部门主管下班后才能离开。这条道路寄希望于日本人与工作的关系能够自下而上地改变，一次改变一个工作场所，一次改变一个家庭。"
 JAP_keiretsu_pact: "与经连会讨价还价"
 JAP_keiretsu_pact_desc: "国家直接与企业集团和经团联雇主联合会进行谈判：以有序改革换取稳定、终身雇佣制保障以及债务缠身的企业免受冲击。由于让步换取的是可预测性，因此没有通过任何立法，也没有公司被点名批评。这是最缓慢的改革之路，也是对日本企业界影响最小的改革。"
 JAP_overtime_cap: "第36条上限"
 JAP_overtime_cap_desc: "向劳动厅提交的第36条将法定每周四十小时工作制变成了建议，而《工作方式改革法》则填补了这一漏洞。每月加班45小时、每年加班360小时成为法律规定的上限，单月加班时间不得超过100小时，且加班时间超过上限将受到刑事处罚，而非行政指导。这些数字与厚生劳动省在判定中风或自杀是否由工作引起时所采用的过劳死线相一致。"
 JAP_mandatory_paid_leave: "必须实行五天工作制"
 JAP_mandatory_paid_leave_desc: "义务顺序颠倒了：雇主若批准员工休假十天或以上，现在必须确保至少五天实际休假，如果员工不愿指定休假日期，则雇主必须自行指定。日本员工并非缺乏假期，而是缺乏休假许可，而获批的假期实际休假率仅为一半左右。该修正案借鉴了欧洲的工作间隔制度，即轮班之间休息十一小时，但仅将其视为一项力所能及的义务。"
 JAP_labour_inspection_offices: "劳动标准监察局"
 JAP_labour_inspection_offices_desc: "政府资助劳动标准监察局的目的是为了强制执行而非提供建议：增加监察员人数，进行法务会计核查以查出伪造工时卡（将一百小时的加班时间虚报为二十小时），并提高起诉的决心。几千名监察员无法监管六千万工人，因此大多数违法行为只有在有人去世、家属聘请律师后才会浮出水面。劳动部已经公布了违法公司的名称，而电通公司本身也因高桥茉莉的去世而被定罪。"
 JAP_karoshi_prevention_act: "过劳死预防法"
 JAP_karoshi_prevention_act_desc: "国会通过了《防止过劳死措施促进法》，该法要求国家调查过劳死案例，发布年度白皮书，并设定可衡量的目标：每周工作60小时的员工比例低于5%，带薪休假实际休假率达到70%，所有企业都提供心理健康服务。公开这些数据至关重要，因为公众很容易忽略它们。该法案还包含一项针对高收入专业人士的豁免条款，允许他们不受工时规定的约束，工会预计这项豁免条款将会扩大。"
 JAP_end_of_karoshi: "一个工作不会致命的国家"
 JAP_end_of_karoshi_desc: "加班上限得以维持，是因为检查员会不定期突击检查，检察官也会随之介入；休假是法律规定的；你身边的合同工也和你一样拿同样的工资。那些只能靠无偿加班勉强维持生存的公司，如今都已倒闭，而不是靠着无限期的信贷勉强支撑，所以没有人再会以生存为由而辩解。日本依然会努力工作，但它不再把疲惫视为忠诚的证明。\n-------------\n需要§Y日本僵尸公司§!问题得到彻底解决。完成此国策以推进§Y劳动者福祉§!以彻底消除过劳死危机"
 JAP_karoshi_wellbeing_up_tt: "提升§Y劳动者福祉§!$RIGHT|+=0$，缓解过劳死危机"
 JAP_premium_friday: "周五特惠"
 JAP_premium_friday_desc: "经济产业省与经团联联合发起“周五特惠日”活动：每月最后一个周五，员工下午三点下班，晚上不待在办公室，而是去商店逛逛。这个活动的时机并不理想，因为月底是结算账目和完成指标的时候，很少有公司会积极响应。但这项活动留下的先例是，政府指定一个时间，让全国人民停止工作。"
 JAP_ikumen_project: "育儿爸爸计划"
 JAP_ikumen_project_desc: "日本厚生劳动省发起“育儿爸爸”运动，旨在让养育子女的父亲成为令人敬佩而非需要解释的对象。日本的陪产假在纸面上堪称世界最慷慨之一，长达一年的部分带薪假期，但几乎无人申请，因为申请者往往是同事会替他分担工作、上司也会记得他的人。修订后的法律规定，孩子出生后的八周内可享受四周陪产假，可分段休，只需提前通知即可，这一门槛足够低，足以让犹豫不决的父亲也愿意休。"
 JAP_stress_check_programme: "压力测试"
 JAP_stress_check_programme_desc: "修订后的《产业安全卫生法》要求所有员工人数在五十人以上的企业每年进行一次心理自评，这是日本政府首次强制企业询问员工的身心健康状况。得分较低的员工可以要求与医生面谈并调整工作内容，但结果属于员工个人所有，未经同意，管理人员无权查看。这既保护了个人，也削弱了评估工具的效力；而员工人数少于五十人的企业仅被要求尽力而为。"
 JAP_telework_normalization: "随时随地办公"
 JAP_telework_normalization_desc: "政府任命了首位数字化转型部长，并成立了数字署，取消了绝大多数行政程序中的印章要求。远程办公并非因为技术不足，而是因为合同需要刻印印章，表格仍然通过传真发送，所以必须有人在办公楼内持有印章。这些措施能否在疫情结束后继续实施尚属未知，因为一些公司已经召回了员工回到他们之前证明并不需要的办公桌前。"
 JAP_ending_service_zangyo: "服务业加班结束"
 JAP_ending_service_zangyo_desc: "“无工时”指的是那些工作但未被记录的时间，因为工作日的计算方式是员工自行申报，而员工也清楚部门主管期望的数字是多少，所以这些工时实际上是白白获得的。此次改革着眼于计算方式而非文化：雇主必须通过客观手段（例如刷卡或登录时间）来记录工时，而两者之间的差异就是证据。劳动部每年都会公布追回的未付工资，金额高达数百亿日元，而且所有涉事企业都是被查处的，而非个例。"
 JAP_ending_compulsory_nomikai: "可选的酒局"
 JAP_ending_compulsory_nomikai_desc: "酒局是自愿的，因为邀请是以提问的形式提出的，而两次拒绝参会的下属则暴露了自己的一些问题，这些问题是任何绩效考核都不会记录的。职场权力骚扰预防法从侧面介入，首次在日本法律中明确界定了职场权力骚扰，并强制所有公司设立投诉程序，保护投诉者的权益。然而，年轻一代的员工早已不再参加职场权力骚扰会议，而这项法律最终也约束了他们。"
 JAP_work_to_live: "为生活而工作"
 JAP_work_to_live_desc: "机器记录工时，与实际情况相符；休假无需任何成本；父亲们在孩子出生后的几周内请假，然后回到原来的办公桌，面对同样的前景。这一切并非仅仅依靠法律就能实现的，因为这从来就不是法律的问题：而是当没有任何人强制执行时，工作场所的期望是什么。日本依然勤奋工作，但它不再将勤奋与过度劳累混为一谈。\n-------------\n需要§Y日本僵尸公司§!问题彻底解决。"
 JAP_corporate_reform_category: "日本企业改革"
 JAP_corporate_reform_category_desc: "日本企业界存在两种相互关联的弊病。银行通过展期信贷维持那些亏损且负债累累的企业，从而占用了更健康产业所需的资金和劳动力。这些企业又通过无偿加班来收买员工，最终导致过劳死。只要其中一种弊病持续存在，就无法彻底根除。\n\n§Y僵尸公司§!\n§Y企业重组进展§!：[?JAP_corporate_restructuring_progress|0] / 100\n重组进程本身几乎不产生任何影响，§R每月仅增长0.25%§!。只有在调查结束并选择解决方案后，它才会正确推进：§Y$JAP_controlled_downsize$§!令公司每月清盘进度§G+3§!，同时§Y$JAP_forced_mergers$§!每月吸收§G+1.5§!。一份完整的报告会将这个数字乘以§G1.3§!，粉饰§R0.8§!。该银行重点关注以下恢复计划，并增加一次性款项。\n§G30§!与§G60§!：§Y$JAP_zombie_companies$§!简化一步。§G85§!：虽然它已经消失了，但§Y$JAP_forced_mergers$§!却留下了永久的痕迹。\n§R警告§!：§Y$JAP_keiretsu_pact$§!每月精确度为§R80%§!。\n\n§Y过劳死危机§!\n§Y文化改变进度§!：[?JAP_cultural_change_progress|0] / 100\n§Y劳动者福祉§!：[?JAP_karoshi_wellbeing|0] / 100\n以下工作方式活动提高了文化改变进度，每月可将其价值的§G2%§!转化为劳动者福祉。§Y$JAP_a_society_where_women_thrive$§!和§Y$JAP_a_nation_reborn$§!都将该转化率乘以§G1.5§!，前者还将每次活动的国库成本减半。改革重点直接放在提升劳动者福祉上。\n§G30§!与§G60§!：§Y$JAP_karoshi_crisis$§!简化一步。§G85§!：它被移除。§R警告§!：当§Y$JAP_zombie_companies$§!仍然存在，每月转化进度为§R75%§!。\n§R警告§!：在做出决议之前，每次运动的成果都会减半，文化改变进度每月§R-1§!。采取任何一种解决方案都能立即阻止衰减。\n\n§G提示§!：以下活动只会在§Y$JAP_cultural_change$§!路径出现。§Y$JAP_corporate_laws$§!和§Y$JAP_keiretsu_pact$§!通过各自国策提升劳动者福祉。"
 JAP_premium_friday_campaign: "推广“周五特惠”活动"
 JAP_premium_friday_campaign_desc: "为该部门新一轮的宣传活动及其配套的零售折扣提供资金，并敦促雇主联合会促使其成员企业提前关门。那些下午三点就关门的企业将被拍照留念。"
 JAP_ikumen_campaign: "发起育儿爸爸运动"
 JAP_ikumen_campaign_desc: "在海报、政府部门广告和电视节目中宣传父亲休育儿假，并逐公司公布休假使用率，使低使用率成为招聘难题。目的是让申请休假不再是需要勇气的事情，而是司空见惯的事情。"
 JAP_mental_health_campaign: "职场心理健康活动"
 JAP_mental_health_campaign_desc: "将年度压力测试的适用范围扩大到员工人数低于五十人的公司，为规模太小无法聘请职业医师的公司提供补贴，并确保咨询热线配备充足的人员。只有当有人接听电话时，筛查才能发挥作用。"
 JAP_no_overtime_day_campaign: "宣布无加班日"
 JAP_no_overtime_day_campaign_desc: "指定一个工作日，在指定时间关掉办公室的灯，并让各部门主管先下班回家，因为下级员工总会在上级之前离开。这种方法虽然简单粗暴，但却是唯一行之有效的。"
 JAP_cultural_change_progress_up_8_tt: "§Y文化改变进程§!增加§G8§!"
 JAP_cultural_change_progress_up_4_tt: "§Y文化改变进程§!增加§G4§!"
 JAP_karoshi_resolved: "日本过劳死危机已彻底解决"
 JAP_keidanren_charter: "工作与生活平衡宪章"
 JAP_keidanren_charter_desc: "政府、经团联和联合政府签署了《工作与生活平衡宪章》，并制定了具体措施：将每周工作60小时的员工人数减半，取消所有带薪休假，并将男性育儿假从个位数延长。该文件不具有法律效力，也没有惩罚措施，仅需每年在企业平等参与的委员会进行公开审查。日本的工作时长从未因法律诉讼而减少，但当企业必须相互解释相关数据时，工作时长确实会减少。"
 JAP_shunto_offensive: "春季攻势"
 JAP_shunto_offensive_desc: "内阁直接加入春季工资改革攻势，敦促经团联提高基本工资而非奖金，并以税收抵免支持符合要求的企业。批评人士称之为“官民改革”，即政府主导的谈判，并认为由首相办公室主导的工资谈判根本算不上集体谈判。在基本工资上涨之前，无论工资上限如何，工薪阶层都将继续加班以偿还房贷。"
 JAP_health_management_stocks: "健康与生产率管理"
 JAP_health_management_stocks_desc: "日本厚生劳动省和东京证券交易所开始推出“健康与生产力管理股票”，向投资者传达员工健康属于资本支出而非福利的理念。其背后的认证体系“白标500强”与黑名单公司截然相反，其依据是：疲惫的员工比休息充足的员工生产力更低，成本更高。企业需提交工时和健康状况数据以获得认证，而那些无法提供相关数据的企业则需向股东和新员工做出解释。"
 JAP_morning_shift_system: "早班"
 JAP_morning_shift_system_desc: "伊藤忠商事是旧财团的核心企业之一，这家综合商社禁止员工晚上十点后加班，而是为清晨时段支付更高的工资。其理由更多是出于商业考量而非人道主义：交易员从前一天早上九点就开始坐在办公桌前，容易出现定价错误，而晚上通常是一天中效率最低的时段。结果，晚间加班大幅减少，总工时下降，利润保持不变，公司员工的出生率却上升了，这让所有声称缩短工时成本过高的竞争对手都感到尴尬。"
 JAP_job_based_employment: "受雇于一份工作，而非一家公司"
 JAP_job_based_employment_desc: "日本的雇佣制度以会员制为基础：员工不是被雇佣到某个岗位，而是被雇佣到公司，轮岗由公司自行决定，没有固定的职责，这正是无休止工作日的开始。日立、富士通、KDDI和资生堂现在都公布了实际的岗位描述，薪酬也与岗位等级挂钩，经济团体联也承认终身雇佣制无法持续。政府投入万亿日元用于再培训，因此这种转变被视为机遇而非背叛。"
 JAP_the_bargain_kept: "信守承诺"
 JAP_the_bargain_kept_desc: "工时缩短是因为企业集团计算出工时成本高于收益，而且他们行动的速度比国会任何委员会都快。交叉持股结构得以维持，主要银行仍然是集团的核心，而缩短工时释放出的生产力则流入了实验室，而不是用于支付工资。国家承担了协议中未包含的部分：为那些已经破产的工人支付医疗保险费用，以及维持濒临破产企业生存的宽容政策。\n-------------\n需要§Y日本僵尸公司§!问题得到彻底解决。完成此国策以推进§Y劳动者福祉§!以彻底消除过劳死危机"
 JAP_demand_recovery_progress_tt: "§Y需求复苏进展§!：$RIGHT|+=0$"
 JAP_corporate_restructuring_progress_tt: "§Y企业重组进展§!：$RIGHT|+=0$"
 JAP_declaration_price_target_TT: "通货膨胀率低于§Y1%§!"
 Japan_economy.32.t: "地方法院叫停重启计划"
 Japan_economy.32.d: "一家地方法院发布禁令，阻止一座核反应堆重启，理由是该反应堆附近的地震安全性和疏散计划仍存在疑问。该裁决并非最终裁决，但在案件上诉期间，暂停了反应堆的恢复运行。当地居民和反核团体纷纷抓住这一决定大做文章，而电力公司则警告称，持续闲置产能将造成巨大损失。"
 Japan_economy.32.a: "通过上诉法院来争取胜诉。"
 Japan_economy.32.b: "深化本地安全保障。"
 JAP_zombie_firms_investigation: "调查僵尸企业"
 JAP_zombie_firms_investigation_desc: "银行向资不抵债的借款人展期贷款，交叉持股使得管理层可以互相掩护。审计人员现在查阅账簿，指出那些仅靠展期贷款勉强维持的公司，并迫使财务数据公之于众。"
 JAP_zombie_firms_investigation_TT: "展开调查。案件档案通过§Y$JAP_zombie_investigation_category$§!构建，而这些公司将会反击。"
 JAP_zombie_investigation_idea: "僵尸公司调查"
 JAP_zombie_investigation_idea_desc: "审计人员正在仔细审查破产公司的账簿。调查期间，这种不确定性令董事会动荡不安，也使公司运作陷入停滞。"
 Japan_economy.06.b: "让银行自行报告"
 Japan_economy.07.b: "控制余波"
 JAP_zombie_investigation_western_pop_TT: "公开这种克制态度损害了亲西方改革派阵营的声誉：§R自由党支持率下降§!"
 JAP_controlled_downsize: "可控裁员"
 JAP_controlled_downsize_desc: "金融振兴计划采用更严格的资产评估和折现现金流拨备，迫使公共资本注入那些无法独立运转的资产负债表。资不抵债的公司被清算，工厂被关闭，那些被困在“行尸走肉”中的工人重获新生。"
 JAP_complete_downsizing: "经济全面缩减"
 JAP_complete_downsizing_desc: "清算已经完成。信贷现在流向有能力偿还的公司，土地交易价格反映了其用途，管理层也不再以员工人数来衡量成功。这正是改革者承诺的经济体：账面规模缩小，但实际财务状况却强劲得多。"
 JAP_venture_capital_funds: "风险投资基金"
 JAP_venture_capital_funds_desc: "日本创新网络公司利用国家资金扶持私营初创企业，将风险与公共支持相匹配。日本家庭拥有巨额储蓄，但这些储蓄几乎从未流向创业者，而这正是促使这些资金流动起来的方式。"
 JAP_infrastructure_investments: "投资基础设施"
 JAP_infrastructure_investments_desc: "《国家韧性基本规划》要求国土、基础设施、交通和旅游部对高速发展时期修建的桥梁、隧道和海堤进行翻新，其中大部分设施的服役年限已超过五十年。公共工程若能妥善实施，便能成为工业化国家的命脉。"
 JAP_growth_tax_reform: "税收改革促进增长"
 JAP_growth_tax_reform_desc: "日本长期以来背负着发达国家中最沉重的企业税负之一。一系列改革将实际税率从大约37%降至20%左右，在扩大税基的同时降低了税率，并奖励那些提高工资和在国内投资的企业。一家能够有效利用利润的企业，比一家囤积利润的企业更有价值。"
 JAP_startup_education_programs: "新公司教育计划"
 JAP_startup_education_programs_desc: "EDGE和EDGE-NEXT项目将创业培训引入国立大学，而技术许可办公室则将实验室专利转化为公司。东大或东京工业大学的毕业生应该将创办公司视为一项事业，而不是需要向父母解释的耻辱。"
 JAP_retirement_reform: "退休改革"
 JAP_retirement_reform_desc: "修订后的《老年人就业稳定法》要求用人单位保障老年人70岁以下的就业机会。老年人身体健康、技能娴熟且积极主动，让他们继续工作既能减轻养老金负担，又能将他们数十年积累的技艺重新带回生产一线。"
 JAP_forced_mergers: "融合"
 JAP_forced_mergers_desc: "与其让弱势企业倒闭，政府部门不如将它们与强势企业联姻：政府部门划定界限，银行提供资金，谁也不必承认失败。那些“僵尸企业”从名录中消失，而那些郁郁不得志的工程师、重复建设的工厂以及被鄙视的新老板们却依然存在。"
 JAP_megabank_consolidation: "大型银行合并"
 JAP_megabank_consolidation_desc: "日本将旗下陷入困境的城市银行合并为三大巨型银行：瑞穗银行、三井住友银行和三菱日联银行。此次合并将过去十年积累的不良贷款掩盖在规模庞大、难以质疑的资产负债表之下，并催生出任何政府都无法承受其倒闭的银行。"
 JAP_industrial_revitalization_corp: "工业振兴公司"
 JAP_industrial_revitalization_corp_desc: "日本产业振兴公团收购不良债务并接管陷入困境的企业，大荣和佳丽宝等41家企业均在其重组计划之列。作为一家国有重组机构，它可以制定条款、重组债务，并以任何私人债权人都不敢尝试的方式悄悄稀释股东权益。"
 JAP_national_champion_mergers: "全国龙头合并"
 JAP_national_champion_mergers_desc: "经济产业省将竞争对手公司中亏损的部门合并，并称之为“龙头公司”：瑞萨电子由NEC、日立和三菱的芯片业务合并而成，日本显示器公司则由索尼、东芝和日立的面板业务合并而成。至于这三个举步维艰的部门能否合并成一家健康的公司，则被谨慎地避而不谈。"
 JAP_keiretsu_cross_shareholding: "经连会交叉持股"
 JAP_keiretsu_cross_shareholding_desc: "持股联盟是日本企业界的隐形架构，迄今为止的每一项改革都试图瓦解它。然而，政府非但没有解开这个网络，反而收紧了它，使这些企业集团免受激进投资者和恶意收购的威胁。工作岗位得以保全，所有平庸的高管也得以继续留任。"
 JAP_employment_preservation_pact: "就业保障协议"
 JAP_employment_preservation_pact_desc: "终身雇佣制并非法律规定，而是企业、工会和国家之间达成的协议，并由政府补贴维持。政府将其写入法律：任何工人都不会因企业合并而失业。国家以此换取社会稳定，而代价则是维持工厂永不关闭。"
 JAP_consolidated_japan_inc: "日本联合公司"
 JAP_consolidated_japan_inc_desc: "名册清澈见底，冠军企业如日中天，产业大臣们只需一张纸就能绘制出完整的产业地图。日本株式会社重获新生，外国竞争对手对它抱有应有的敬畏之心。而内部，那些复制的工厂依然运转，不满的工程师们依然在六点准时下班。"
 JAP_venture_capital_funds_decision: "创新基金"
 JAP_venture_capital_funds_decision_desc: "将公共资金与私人基金经理共同投入这些基金，条件是私人基金经理负责挑选最终的赢家。此举还将资助新成立的公司开展为期一年的集中研究工作。"
 JAP_infrastructure_investments_decision: "启动中部复兴工程"
 JAP_infrastructure_investments_decision_desc: "投入民用建设力量，对中部工业带的道路、桥梁和公用设施进行翻新。施工期间会占用工厂的运营时间，但完工后该地区的基建设施将得到显著改善。"
 JAP_growth_tax_reform_decision: "降低企业税率"
 JAP_growth_tax_reform_decision_desc: "将企业实际税率降低一年，让企业保留更多利润。随着企业将部分减税优惠传递给家庭，消费者价格也会随之下降。"
 JAP_startup_education_programs_decision: "资助大学创业之路"
 JAP_startup_education_programs_decision_desc: "在国立大学设立创业学院和技术许可办公室，将实验室研究成果转化为企业成果，加速产业研究。"
 JAP_retirement_reform_decision: "将就业保障范围扩大到70"
 JAP_retirement_reform_decision_desc: "为那些让技术工人超过传统退休年龄而继续工作的雇主提供补贴。数十年积累的技艺得以在工厂车间再干一年。"
 JAP_rail_modernization: "铁路现代化"
 JAP_rail_modernization_desc: "东海道新干线是世界上密度最高的铁路网的核心，其车辆、信号系统和车站都在逐条线路进行更新换代。铁路仍然是工业经济的支柱，任何故障都无法承受。"
 JAP_shinkansen_network_expansion: "新干线网络扩张"
 JAP_shinkansen_network_expansion_desc: "根据《全国新干线铁路开发法》，历届政府都致力于将高速干线从东海道核心区域向北陆、九州和北海道延伸。加快这些项目的建设将把偏远地区融入国民经济，并缩短日本本土各岛之间的物资运输路线。"
 JAP_chuo_shinkansen_maglev: "中央新干线磁悬浮"
 JAP_chuo_shinkansen_maglev_desc: "中央新干线是JR东海公司运营的连接东京、名古屋和大阪的超导磁悬浮线路，其L0系列列车保持着603公里/小时的世界铁路速度纪录。国家投入巨资完成了这条有史以来速度最快的商业铁路的原型设计和深层隧道挖掘工作。"
 JAP_freight_modal_shift: "货运方式转变"
 JAP_freight_modal_shift_desc: "日本货运铁路正引领货物运输方式从长途卡车转向铁路，并通过“生态铁路标志”和标准化的31英尺集装箱进行推广。更多地采用铁路运输可以减少排放、缓解司机短缺问题，并加强产业供应链。"
 JAP_station_city_model: "车站城市模型"
 JAP_station_city_model_desc: "JR东日本已将主要交通枢纽改造成独立的商业城市，开发了被称为“站中”的零售商业区以及围绕神奈川、涩谷和东京站的摩天大楼。将办公和零售业集中在交通枢纽，可以提升城市核心区域的土地价值和生产力。"
 JAP_regional_line_preservation: "区域线路保护"
 JAP_regional_line_preservation_desc: "随着农村人口减少导致客流量下降，JR西日本和第三产业铁路公司难以维持地方线路的运营。我们不会放弃农村地区，而是会补贴社区铁路，以保障干线铁路绕行地区的物资供应和交通出行。"
 JAP_port_rail_intermodal: "港口和铁路联运"
 JAP_port_rail_intermodal_desc: "国际战略枢纽港政策将集装箱运输集中到京滨港和阪神港集群。通过扩建码头铁路支线和内陆码头，将港口直接接入货运网络，实现集装箱从船舶到火车的直接转运，避免卡车闲置。"
 JAP_green_logistics_network: "绿色物流网络"
 JAP_green_logistics_network_desc: "以电气化铁路、电池和氢燃料机车以及集中配送中心为特征的绿色物流网络，正在为全国货物运输实现脱碳，以追求碳中和。"
 JAP_rail_technology_exports: "铁路技术出口"
 JAP_rail_technology_exports_desc: "日本高速铁路是其旗舰出口项目。E5型列车组是印度孟买至艾哈迈达巴德线路的基石，700T型列车组服务于台湾高铁，日本国际协力机构还为全球新干线技术提供融资方案。赢得这些合同有助于推广我们的标准和影响力。"
 JAP_global_rail_superpower: "全球铁路超级大国"
 JAP_global_rail_superpower_desc: "中央新干线直达大阪，出口产品遍布全球，日本在高速铁路领域稳居无定论的领先地位。磁悬浮时代始于本土，并向外辐射，成为日本工程技术的永恒象征。"
 JAP_chuo_shinkansen_program: "中央新干线项目"
 JAP_chuo_shinkansen_program_desc: "全国上下齐心协力研发超导磁悬浮原型机，加速推进我们的磁悬浮专项项目。"
 JAP_high_speed_line: "高速线路"
 JAP_high_speed_line_desc: "新的新干线走廊提高了区域生产力，加快了当地建设，并扩大了供应流通范围。"
 JAP_rail_category: "铁路部门"
 JAP_hokuriku_shinkansen_extension: "北陆新干线：金泽到敦贺"
 JAP_hokuriku_shinkansen_extension_desc: "将北陆新干线从金泽延伸至敦贺，该段于2024年开通，将日本海沿岸地区接入国家高速铁路网。"
 JAP_nishi_kyushu_shinkansen: "西九州新干线"
 JAP_nishi_kyushu_shinkansen_desc: "开通西九州至长崎的线路，该线路自2022年开通运营以来，将九州西部纳入新干线网络。"
 JAP_sanyo_shinkansen_upgrade: "山阳新干线升级"
 JAP_sanyo_shinkansen_upgrade_desc: "部署N700S型列车，对大阪至博多干线进行现代化改造，以提高速度和可靠性。"
 JAP_tohoku_shinkansen_upgrade: "东北新干线 320千米/小时"
 JAP_tohoku_shinkansen_upgrade_desc: "在东北干线上以320公里/小时的速度运行E5系列列车，缩短从东京到青森的旅程时间。"
 JAP_hokkaido_shinkansen_sapporo: "北海道新干线：札幌扩展"
 JAP_hokkaido_shinkansen_sapporo_desc: "开凿隧道并架设高架桥，使新干线能够从新函馆北斗站开往札幌。"
 JAP_shikoku_shinkansen: "四国新干线"
 JAP_shikoku_shinkansen_desc: "实现筹划已久的线路基本规划，首次将高速铁路引入四国岛。"
 JAP_plutonium_stockpile_concern: "分离的钚库存"
 JAP_galapagos_syndrome: "加拉帕戈斯综合症"
 JAP_galapagos_syndrome_desc: "日本在国内构建了一个完整的技术体系，却发现自己无法将其任何成果出口。当时，日本的移动网络采用的是PDC制式，而世界其他地区则普遍采用GSM制式，因此，日本国产手机无法销往国外，外国手机也无法在日本销售。上网是通过i-mode实现的，支付方式则是FeliCa，这两项技术都比海外领先数年，而且彼此之间又互不兼容。国内认证、JIS规范和企业集团采购最终导致国内市场充斥着专为一个在其他地方都不存在的客户群体而设计的产品。一亿两千万消费者足以支撑一个产业的生存，但又不足以将其推向国际市场。\n-------------\n该国家精神不会自行缓和。随着日本继续保持封闭状态，§R科研速度§!持续下降，临时措施虽然减缓了这一趋势，但从未扭转。只有通过§Y与世界融合§!路径，达到§G85§!的§Y开放度§!，才能将其移除。查看§Y$JAP_technological_isolation_category$§!已获得更多信息。"
 JAP_galapagos_modifier: "加拉帕戈斯转向"
 JAP_galapagos_modifier_desc: "该数值持续记录着日本与世界贸易体系渐行渐远的过程。如果日本继续坚持自身标准，研究成果就会逐月下滑；而与客户使用的标准差距越大，下滑速度就越快。临时措施可以减缓下滑趋势，但只有真正的融合才能阻止其继续恶化。"
 JAP_galapagos_resolved: "日本已经打破了其加拉帕戈斯隔绝状态"
 JAP_galapagos_syndrome_focus: "加拉帕戈斯问题"
 JAP_galapagos_syndrome_focus_desc: "日本的国内市场利润丰厚，但正在萎缩，受到将日本排除在其他地方之外的标准的保护。该部门争论答案是趋同，重写标准以适应世界，还是商业化，出售差异本身。部分措施减缓了研究的进展，但没有一项措施解决了潜在的选择问题。"
 JAP_galapagos_openness_up_tt: "提升§Y开放度§!$RIGHT|+=0$，将日本与自身以外的标准和市场联系起来"
 JAP_galapagos_openness_down_tt: "降低§Y开放度§!$RIGHT|+=0$，日本进一步远离外国标准和市场"
 JAP_galapagos_research_drift_recover_major_tt: "Recovers §G0.5%§! of the §YResearch Drift§! lost to isolation. It can never be pushed past §Y0§!"
 JAP_galapagos_research_drift_recover_minor_tt: "Recovers §G0.3%§! of the §YResearch Drift§! lost to isolation. It can never be pushed past §Y0§!"
 JAP_technological_isolation_category: "加拉帕戈斯与电子战争"
 JAP_technological_isolation_category_desc: "Japanese industry perfected products for Japan alone: superb handsets, standards and services that nobody outside the home market could use, while the rest of the world standardised around someone else. That same insularity now leaves Japan's semiconductor sector exposed as China climbs the technology ladder.\n\n§YGalapagos Syndrome§!\n§YOpenness§!: [?JAP_galapagos_openness|0] / 100\nEvery month Japan's research falls further behind in proportion to how closed it remains. At Openness §R0§! the penalty deepens by §R0.2%§! per month; at Openness §G100§! it stops deepening entirely, and it can never exceed §R-15%§!. The two campaigns below are §Yholding measures§!: they claw the drift back toward zero and add Openness, but they cannot cure the syndrome.\n§GRemoval§!: only the §Y$JAP_world_integration$§! path removes §Y$JAP_galapagos_syndrome$§!, and only once Openness passes §G85§!. The §Y$JAP_cool_japan_doctrine$§! path keeps the spirit on purpose and converts Japan's cultural reach into influence instead.\n§GOpenness§!: the integration focuses carry most of it, and three electronics focuses add the rest: §Y$JAP_beyond_5g$§! §G+8§!, §Y$JAP_rights_and_licensing_regime$§! §G+6§!, and §Y$JAP_foundry_partnership$§! §G+5§!. Its rival §Y$JAP_rapidus_moonshot$§! grants none, because a domestic frontier fab converges on nobody's standards but its own.\n\n§YThe Model Competition§!\n§YElectronics Resilience§!: [?JAP_electronics_resilience|0]\nCompetitive pressure starts at §R1§! and rises by §R+1§! for each semiconductor milestone China reaches, and by a further §R+1§! for as long as §YOpenness§! sits below §R25§!, to a maximum of §R3§!. Isolation is not only a research problem: an industry that cannot sell to the world cannot answer a rival that can. Resilience is subtracted from that pressure, and what remains decides which tier of §Y$JAP_model_competition$§! Japan suffers. Push Resilience past the pressure and the spirit disappears entirely; let China pull ahead unanswered and it returns.\n§GSources§!: each semiconductor focus grants §G+1§! Resilience, §Y$JAP_gaming_powerhouse$§! grants §G+1§! more, and the export offensive below grants §G+1§! until Resilience reaches §G4§!. That offensive needs §YOpenness§! above §G10§!, unless the §Y$JAP_cool_japan_doctrine$§! has been adopted and Japan has chosen to sell its difference rather than hide it."
 JAP_international_standards_adjustment: "国际标准调整"
 JAP_international_standards_adjustment_desc: "日本业界自行制定标准，例如移动通信的PDC标准和广播的ISDB标准，而这些标准都将国内市场与外部的GSM和DVB世界隔绝开来。政府派遣工程师参与ISO和IEC的工作组，虽然无法在一夜之间消除这种差异，但却能在草案上留下日本人的印记，而这些草案将在十年后被其他国家所阅读。最终，代价体现在国内，每次条款妥协，一致性测试都不得不重写。"
 JAP_english_business_environment: "英语商业环境"
 JAP_english_business_environment_desc: "日本经理人无法用合同所用语言为海外子公司配备员工。政府支持企业英语培训项目，并支持乐天公司将英语作为工作语言的实验 - 该实验在取得成果之前曾饱受嘲讽。然而，部门主管们需要学习用第二语言主持会议，这导致企业生产力损失多年，而且有些人可能永远也无法掌握。"
 JAP_international_standards_adjustment_campaign: "为标准代表团提供资金"
 JAP_international_standards_adjustment_campaign_desc: "支付另一轮工程师轮流进入ISO、IEC和ITU工作组的费用，并涵盖日本承认的每项条款后的国内一致性测试。代表团带着草案回家，行业在下一次修订之前有一年的时间进行调整。停止资助他们，席位就会被其他人夺走。"
 JAP_english_business_environment_campaign: "补贴企业英语课程"
 JAP_english_business_environment_campaign_desc: "为成员公司提供他们一直不愿自行承担的语言培训：包括内部教师、公司安排的托业考试，以及为所有通过考试的员工提供海外派遣机会。员工学习期间，产出会下降。坚持下来的公司最终不再需要现场翻译。"
 JAP_cool_japan_doctrine: "酷日本理论"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_wings_pilot_readiness: "飞机与飞行员准备"
 JAP_mitsubishi_aerospace_aircraft_manufacturer_header_air_defense_shield: "防空盾"
 JAP_kawasaki_aerospace_company_aircraft_manufacturer_header_rotary_wing_aircraft: "旋翼机"
 JAP_kawasaki_aerospace_company_aircraft_manufacturer_header_heavy_fixed_wing: "重型固定翼飞机"
 JAP_jsw_tank_manufacturer_header_mbt_mastery: "主战坦克专精"
 JAP_jsw_tank_manufacturer_header_self_propelled_excellence: "自行卓越"
 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_battle_recon_power: "战斗与侦察力量"
 JAP_mitsubishi_heavy_industries_tank_manufacturer_header_artillery_anti_air_systems: "火炮和防空系统"
 JAP_komatsu_tank_manufacturer_header_light_vehicle_systems: "轻型车辆系统"
 JAP_komatsu_tank_manufacturer_header_heavy_vehicle_systems: "重型车辆系统"
 JAP_subaru_tank_manufacturer_header_light_utility_performance: "轻型多用途性能"
 JAP_howa_machinery_materiel_manufacturer_header_service_rifle_evolution: "Service Rifle Evolution"
 JAP_howa_machinery_materiel_manufacturer_header_support_weapons_accessories: "Support Weapons & Accessories"
 JAP_nec_materiel_manufacturer_header_light_wings: "Light Wings"
 JAP_nec_materiel_manufacturer_header_air_defense_shield: "防空盾"
 JAP_toshiba_materiel_manufacturer_header_rail_systems: "Rail Systems"
 JAP_toshiba_materiel_manufacturer_header_air_defense_systems: "Air Defense Systems"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_patrol_convoy_vessels: "Patrol & Convoy Vessels"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_frigates_destroyers: "Frigates & Destroyers"
 JAP_mitsubishi_shipbuilding_naval_manufacturer_header_submarines: "Submarines"
 JAP_kawasaki_shipbuilding_naval_manufacturer_header_submarine_excellence: "Submarine Excellence"
 JAP_kawasaki_shipbuilding_naval_manufacturer_header_container_vessel_efficiency: "Container Vessel Efficiency"
 JAP_ihi_corporation_naval_manufacturer_header_flagship_core_systems: "Flagship Core Systems"
 JAP_ihi_corporation_naval_manufacturer_header_projecting_presence: "Projecting Presence"
 JAP_jmu_corporation_naval_manufacturer_header_escort_combatants: "Escort Combatants"
 JAP_jmu_corporation_naval_manufacturer_header_flight_ops_sea_control: "Flight Ops & Sea Control"
 JAP_jmu_corporation_naval_manufacturer_header_carrier_aviation: "Carrier Aviation"
 senbu_occupation_law_fake_idea: "Senbu Pacification Administration"
 senbu_occupation_law_fake_idea_desc: "Civil affairs officers run the occupied districts through local notables rather than garrison commanders, restoring markets, schools and rice distribution before demanding output. Compliance grows steadily and the garrison requirement stays low, but the light hand leaves organised resistance more room than a punitive regime would."
 JAP_sabotaged_russians: "Sabotaged Russian Facilities"
 JAP_usa_trade_pressure: "American Trade Pressure"
 JAP_article_nine_balance_of_power_category: "Article Nine"
 JAP_article_nine_balance_of_power_category_desc: "The renunciation of war in Article Nine of the constitution is not a settled question but a running argument between the cabinet, the courts, the American alliance and the public. Every reinterpretation shifts the balance between a strictly defensive posture and a normal military."
 JAP_cool_japan_doctrine_desc: "Japanese design is not strange because it failed to match a foreign standard. It is strange because it was made for Japanese customers by people who never once considered the alternative, and that is precisely what makes it worth buying. The ministry stops packaging culture as a shopfront for hardware and begins exporting the difference itself.\n\n§RThis path keeps §Y$JAP_galapagos_syndrome$§! permanently.§! Only §Y$JAP_world_integration$§! removes it, and the two are mutually exclusive: Japan either converges on the world's standards or sells the world its own."
 JAP_galapagos_sphere_modifier: "Cultural Sphere"
 JAP_galapagos_sphere_modifier_desc: "The ministry keeps a quarterly count of the countries where Japanese influence stands at twenty percent or higher and treats the total as an export figure in its own right. Every country on the list widens the audience that already buys Japanese design without being asked to understand it first, which is worth something to the trade delegations and something more to the firms that follow them in. The count is taken once each quarter and the yield moves with it. A sphere that stops growing stops paying."
 JAP_galapagos_sphere_tt: "§YCultural Sphere§!: [?JAP_galapagos_sphere_count|Y0] countries carrying §G20%§! Japanese influence or more, counted each quarter once the §YCool Japan Doctrine§! is adopted. The yield rises by half with §Y$JAP_electronics_superpower$§! and by a further quarter with §Y$JAP_home_electronics$§!."
 JAP_cool_japan_sphere_payout_tt: "Every quarter the ministry counts the countries where Japanese §Yinfluence§! stands at §G20%§! or higher and reports the total as the §YCultural Sphere§!. Each one adds §G+1%§! §Yforeign influence§! and §G+0.2%§! §Yreturn on investment§!, paid out through the §YCultural Sphere§! and growing as the sphere widens. §Y$JAP_electronics_superpower$§! raises the yield by half again, and §Y$JAP_home_electronics$§! raises it by a further quarter.\n-------------\nThis does not touch the §YResearch Drift§!. The doctrine buys reach abroad; it does not close the standards gap at home."
 JAP_creative_industries_office: "Creative Industries Promotion Office"
 JAP_creative_industries_office_desc: "The Ministry of Economy, Trade and Industry stands up the Creative Industries Promotion Office to treat animation, design, fashion, and food as export sectors rather than as culture. The Cool Japan Fund follows with fifty billion yen and a mandate to co-invest rather than subsidise, buying into overseas retail floors, Asian streaming platforms, and distribution ventures no Japanese board would have approved alone. Officials make poor venture capitalists and the Fund posts years of losses, but it takes the first loss on the projects private capital then follows into."
 JAP_visit_japan_campaign: "Visit Japan Campaign"
 JAP_visit_japan_campaign_desc: "The Visit Japan Campaign is relaunched behind a target no ministry believes: forty million foreign visitors a year. The government loosens the visa regime for Asian travellers, exempts cosmetics and medicine from consumption tax at the till, and markets the country on the parts of it that do not translate. Nothing about Japan is made less Japanese to sell it."
 JAP_content_export_offensive: "Content Export Offensive"
 JAP_content_export_offensive_desc: "The Basic Law on Intellectual Property and the Content Promotion Law put animation, games, and manga into statute as strategic assets, and the industry still treats its overseas audience as piracy to be tolerated while fan translators do the distribution. The government builds the legal channel instead: simultaneous release, professional subtitling, and rights holders who negotiate as a bloc rather than one studio at a time. The overseas market is already the larger half of anime revenue, and almost none of it is being collected."
 JAP_washoku_to_the_world: "Washoku to the World"
 JAP_washoku_to_the_world_desc: "With washoku inscribed on the UNESCO Intangible Cultural Heritage list, the government promotes not a dish but a practice: the seasonal ingredient, the arrangement, the New Year table. The ministry's earlier instinct was to police it, and the scheme to certify authentic Japanese restaurants overseas was abandoned once the foreign press christened it the sushi police. Californian rolls and Bangkok ramen sell more Japanese rice, soy, and sake than any inspectorate ever could, and the trillion-yen export target rests on that trade."
 JAP_japan_house_network: "The Japan House Network"
 JAP_japan_house_network_desc: "The JET Programme has sent thousands of young foreigners through Japanese schools and town halls and returned them home fluent, and they now sit in foreign ministries, law firms, and newsrooms. Japan House gives that network a front door: a gallery, a library, a shop, and a restaurant on an expensive street in Sao Paulo, Los Angeles, and London, run by the Foreign Ministry and deliberately empty of flags and policy statements. Applications for Japanese language courses tripled in each city after it opened."
 JAP_gross_national_cool: "Gross National Cool"
 JAP_gross_national_cool_desc: "The Galapagos Syndrome stays: the specifications remain Japanese and the research drift goes on. What the ministries have built instead is a country that earns abroad through what only it can make, the studios, the kitchens, the game houses, the design offices, and the millions who come each year simply to look. The isolation was never cured, only put to work."
 JAP_cool_japan_spirit_kept_tt: "§YGalapagos Syndrome§! §Rremains in place§!. Japan has chosen to sell its difference rather than cure it"
 JAP_electronics_anchor_bonus_tt: "§YElectronics Superpower§!: Japanese hardware carries Japanese content into every market, and the return grows with it"
 JAP_consumer_base_bonus_tt: "§YThe Ghost of the Galapagos§!: a hundred and twenty million customers who buy the domestic product without being persuaded, and the assembly lines that serve them"
 JAP_home_electronics_no_cure_tt: "This §Rdoes not§! cure the §YGalapagos Syndrome§! and §Rdoes not§! raise §YOpenness§!. Products engineered for a customer who exists nowhere else keep the §YResearch Drift§! running. Under the §Y$JAP_cool_japan_doctrine$§! that same home market widens the §YCultural Sphere§! by §G25%§!."
 JAP_world_integration: "Integration with the World"
 JAP_world_integration_desc: "Japan stops being an island. The standards are rewritten to somebody else's draft, the tariff schedules come down, the ministries stop asking whether a foreign bid is appropriate, and the capital that spent thirty years going around this country starts coming into it. What is surrendered is the protection itself, the captive market that made consumer goods cheap and the wall against foreign influence no rival ever climbed, and Japanese firms must now earn a market they used to own."
 JAP_structural_reform_zones: "Structural Reform Special Zones"
 JAP_structural_reform_zones_desc: "Rather than argue the regulatory code line by line against the ministries that wrote it, the government lets a prefecture or a town apply to be exempted from a rule and then prove that the sky does not fall. Farmers brew below the national minimum volume, joint stock companies run schools and lease farmland, and the National Strategic Special Zones point the same instrument at Tokyo for finance, Fukuoka for startup employment rules, and Kansai for medical trials. It is deregulation retail rather than wholesale, and it is the only method that has ever actually moved anything."
 JAP_corporate_governance_code: "The Corporate Governance Code"
 JAP_corporate_governance_code_desc: "The Ito Review puts a number on the failure: eight per cent return on equity is the minimum a Japanese company must clear to be worth the capital it consumes, and most of them are not clearing it. The Stewardship Code tells the pension funds and the insurers to vote their shares like owners rather than guests, and the Corporate Governance Code follows on comply-or-explain terms. Outside directors rise toward a third of the board and the cross-shareholdings begin to be sold, which does not make Japanese firms foreign so much as legible to anyone willing to buy a share."
 JAP_economic_partnership_agreements: "Economic Partnership Agreements"
 JAP_economic_partnership_agreements_desc: "Agriculture has held the veto over Japanese trade policy since the war, and exporters are now losing tenders to Korean firms on the tariff line alone. Japan closes the largest bilateral agreement either party has ever signed with the European Union, then takes the chair of the Trans-Pacific Partnership after Washington walks out, suspending the American clauses rather than deleting them. RCEP follows and places Japan, China, and South Korea inside a single trade framework for the first time, with the rice protected in every one of them."
 JAP_open_capital_markets: "Open the Capital Markets"
 JAP_open_capital_markets_desc: "Measured against the size of its economy, Japan carries less foreign capital than almost any developed country, held back by the cross-shareholdings, unreadable disclosure, and forty years of officials treating a foreign bid as a problem to be managed. The repairs are unglamorous and almost entirely administrative: Invest Japan desks at JETRO to walk a foreign firm through incorporation, results published in English on the day they appear in Japanese, and a points-based residence track for the people a foreign subsidiary must move here to open at all. The question of people in its full form belongs to §Y$JAP_an_open_nation$§!, and this is the narrower one of whether the capital can find the door."
 JAP_the_third_opening: "The Third Opening"
 JAP_the_third_opening_desc: "Japan abandons the last of the protections that made it an economy apart. The government opens the domestic market to foreign competition, rewrites its standards to international drafts, and lets foreign capital buy in on the same terms as Japanese capital. The captive market and the wall against outside influence are both surrendered for a country that trades as one signatory among many."
 JAP_galapagos_dissolution_tt: "Once §YOpenness§! reaches §G85§!, the §YGalapagos Syndrome§! lifts at the next monthly review. Japan §Rgives up§! the cheap consumer goods a captive market supplied and the high §Rdefence against foreign influence§! that isolation paid for, and §Gsheds§! the research drift, the investment penalties and the ceiling on its own influence abroad:"
 JAP_an_open_nation_bonus_tt: "§Y$JAP_an_open_nation$§!: a country that has already opened to the world's people has far less left to argue about when it opens to the world's capital"
