 recon_satellites: "정찰 위성"
 recon_satellites_desc: "정찰 위성"
 SPYSAT1: "첩보위성 1965"
 SPYSAT1_desc: "정보 수집부터 핵무기 탐지에 이르기까지 다양한 임무를 수행하도록 설계된 군사 또는 정보 위성입니다.\n\n정찰 위성 (첩보위성 1965):\n§Y$SPYSAT1$§! 위성은 §Y5m GSD§!의 이미지 해상도를 가진 정찰 위성입니다. §Y5m GSD§! 정찰 위성 체계에 필요합니다.\n§YGSD§! - §Y지상표본거리(Ground Sample Distance)§!: GSD는 지상에서 측정된 픽셀 중심 간의 거리입니다. 이 위성의 경우 인접한 픽셀의 지상 위치는 5m 떨어져 있습니다."
 SPYSAT2: "첩보위성 1975"
 SPYSAT2_desc: "정보 수집부터 핵무기 탐지에 이르기까지 다양한 임무를 수행하도록 설계된 군사 또는 정보 위성입니다.\n\n정찰 위성 (첩보위성 1975):\n§Y$SPYSAT2$§! 위성은 §Y2.5m GSD§!의 이미지 해상도를 가진 정찰 위성입니다. §Y2.5m GSD§! 정찰 위성 체계에 필요합니다.\n§YGSD§! - §Y지상표본거리(Ground Sample Distance)§!: GSD는 지상에서 측정된 픽셀 중심 간의 거리입니다. 이 위성의 경우 인접한 픽셀의 지상 위치는 2.5m 떨어져 있습니다."
