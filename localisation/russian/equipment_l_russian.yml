 CZE_CV_MR_Fighter5_desc: "Палубная версия Let-55 Straka."
 CZE_CV_MR_Fighter6: "Aero L-73N Racek"
 CZE_CV_MR_Fighter6_desc: "Палубная версия Let-73 Špaček."
 CZE_CV_MR_Fighter7: "Let-81N Rorýs"
 CZE_CV_MR_Fighter7_desc: "Палубная версия Let-81 Sup."
 CZE_CV_MR_Fighter8: "Let-83N Rákosník"
 CZE_CV_MR_Fighter8_desc: "Палубная версия Let-83 Slavík."
 CZE_AS_Fighter1: "МиГ-21Ф-13"
 CZE_AS_Fighter1_desc: "Чешский вариант МиГ-21 производства Aero с улучшенным вооружением и авионикой."
 CZE_AS_Fighter2: "Aero L-23ML"
 CZE_AS_Fighter2_desc: "Совместный проект чешских аэрокосмических компаний, результатом которого стал этот новый истребитель."
 CZE_AS_Fighter3: "Aero L-39J G/C"
 CZE_AS_Fighter4: "Aero L-41 Volavka"
 CZE_AS_Fighter4_desc: "Volavka — истребитель превосходства в воздухе со скоростью 2,5+ Маха и вооружением для боя за пределами прямой видимости."
 CZE_AS_Fighter5: "Let-47 Ořešník"
 CZE_AS_Fighter5_desc: "Let-47 — сверхманёвренный самолёт с управляемым вектором тяги и слиянием данных датчиков. Он создан, чтобы узнавать о противнике раньше, чем противник узнает о нём."
 CZE_AS_Fighter6: "Aero L-72 Vlaštovka"
 CZE_AS_Fighter6_desc: "Vlaštovka — это суперкруизный стелс-истребитель превосходства в воздухе с модульным программным обеспечением, состоящим из основного кода в сочетании с модульными частями кода от различных производителей оружия, позволяющими кодировать каждую часть системы вооружения специально для её единственной цели. Это также облегчает обновление программного обеспечения и почти не приводит к несовместимости."
 CZE_AS_Fighter7: "Let-80 Orel"
 CZE_AS_Fighter7_desc: "Orel — опционально пилотируемый истребитель превосходства в воздухе с оружием направленной энергии, способный изменять геометрию и форму, с пилотом на основе искусственного интеллекта."
 CZE_AS_Fighter8: "Let-82 Ostříž"
 CZE_AS_Fighter8_desc: ""
 CZE_Strike_fighter1: "Aero L-29R Delfín"
 CZE_L_Strike_fighter1: "Aero L-29 Delfín"
 CZE_CV_L_Strike_fighter1: "Aero L-299 Delfín"
 CZE_L_Strike_fighter1_desc: "В ответ на значительную потребность в едином реактивном учебном самолёте, который должен был быть принят на вооружение в различных странах Восточного блока, Aero решила приступить к собственному проекту с целью удовлетворить этот спрос. 5 апреля 1959 года первый прототип, обозначенный как XL-29, совершил свой первый полёт. L-29 был выбран в качестве стандартного учебного самолёта для военно-воздушных сил стран Варшавского договора, куда он поставлялся с 1960-х годов."
 CZE_CV_L_Strike_fighter1_desc: "Палубная версия L-29."
 CZE_Strike_fighter2: "Aero L-39C Albatros"
 CZE_cas1: "Aero L-39ZA Albatros"
 CZE_Strike_fighter2_desc: "Разработанный на базе L-39 Alca, этот самолёт получил новый, более мощный двигатель и усиленный планер, благодаря чему может взлетать и садиться практически где угодно, используя возможность укороченного взлёта и посадки (STOL)."
 CZE_cas1_desc: "Лёгкий манёвренный штурмовик, разработанный на основе базовой лёгкой ударной версии."
 CZE_Strike_fighter3: "Aero L-159A Alca"
 CZE_L_Strike_fighter2: "Aero L-39C Albatros"
 CZE_CV_L_Strike_fighter2: "Aero L-159E Alca"
 CZE_Strike_fighter3_desc: "Новая разработка на базе L-39 и L-59: этот самолёт получил двигатели нового типа, переработанный планер и модернизированную кабину, что сделало его почти полностью отличным от своих предшественников."
 CZE_L_Strike_fighter2_desc: "Бомбардировочный вариант L-159 с креплениями для вооружения использовался также в качестве учебного самолета."
 CZE_CV_L_Strike_fighter2_desc: "Версия L-159 для флота."
 CZE_cas2: "Aero L-39M Albatros"
 CZE_cas2_desc: "Лёгкий манёвренный штурмовик, разработанный на основе базовой лёгкой ударной версии, с новым модернизированным двигателем и кабиной с программным обеспечением."
 CZE_Strike_fighter4: "Aero L-39NG Albatros"
 CZE_L_Strike_fighter3: "Aero L-39NGT Albatros"
 CZE_CV_L_Strike_fighter3: "Aero L-39ZA Albatros"
 CZE_cas3: "Aero L-159B Alca"
 CZE_Strike_fighter4_desc: "Новое поколение (NG) Albatros имеет планер новой конструкции, новый двигатель и композитные материалы, благодаря которым этот самолёт с его высокой тяговооружённостью может переманеврировать любого противника. Он может нести различное вооружение на 6 пилонах, включая управляемые GBU-12 Paveway II или новейшие AIM-9. Самолёт также получил новое мощное оборудование обнаружения, датчики и радиолокационную аппаратуру."
 CZE_L_Strike_fighter3_desc: "Бомбардировочная версия L-39NG с креплениями для вооружения используется также в качестве учебного самолета."
 CZE_CV_L_Strike_fighter3_desc: "Палубная версия L-39NG."
 CZE_cas3_desc: "Лёгкий манёвренный штурмовик, разработанный на основе базовой лёгкой ударной версии."
 CZE_Strike_fighter5: "Aero L-51 Datel"
 CZE_L_Strike_fighter4: "Aero L-51T Datel"
 CZE_L_Strike_fighter4_short: "Aero L-51T"
 CZE_CV_L_Strike_fighter4: "Aero L-51N Datel"
 CZE_cas4: "Aero L-52 Drozd"
 CZE_Strike_fighter5_desc: "Легкий маневренный ударный самолет. Самолет также выступает как учебно-тренировочный благодаря своей сверхманевренности."
 CZE_L_Strike_fighter4_desc: "Учебная версия L-51."
 CZE_CV_L_Strike_fighter4_desc: "Палубная версия L-51."
 CZE_cas4_desc: "Лёгкий манёвренный штурмовик, разработанный на основе своего предшественника L-51. Самолёт получил новый усиленный планер, позволяющий брать в бой больше полезной нагрузки."
