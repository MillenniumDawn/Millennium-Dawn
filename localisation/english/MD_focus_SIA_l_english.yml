 SIA_coup_risk_decrease_tt: "§GCoup Risk [?coup_delta|0+]§! (now §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_below_70_tt: "Coup risk below §Y70§! (now §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_reset_tt: "The coup succeeds. Coup risk is reset to zero under military rule."
 SIA_army_patience_exhausted_tt: "The army's patience is exhausted: coup risk above 60, after 1 January 2010."
 SIA_ds_force_track_increase_tt: "Military progress toward a forced resolution increases."
 SIA_ds_peace_track_increase_tt: "Negotiation progress toward a peaceful settlement increases."
 SIA_reform_pressure_increase_tt: "§RReform Pressure [?reform_delta|0+]§! (now §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_reform_pressure_decrease_tt: "§GReform Pressure [?reform_delta|0+]§! (now §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_engage_reform_movement: "Engage the Reform Movement"
 SIA_engage_reform_movement_desc: "Invite the student unions and the reform caucus to the table, fund a youth jobs program, let the cameras see the handshake. The streets quiet down. Sitting the movement at the table also makes it respectable, and Move Forward gains from that."
 SIA_rural_development_package: "Rural Development Package"
 SIA_rural_development_package_desc: "Village funds, a rice price floor, farm-debt relief and a new road to the district town. One payment out of the treasury buys a year in which the countryside stops listening to the populist machine."
 SIA_rural_package_active: "Rural Development Package"
 SIA_rural_package_active_desc: "The village funds are disbursing, the price floor is holding and the district road crews are working. Consumer goods cost a little more while it runs, and for that year the countryside is the government's."
 SIA_palace_bargain: "Strike a Palace Bargain"
 SIA_palace_bargain_desc: "A coup settled by negotiation. Rather than wait for the tanks, hand the palace and its generals what they would take anyway. The royalist establishment enters government as the senior partner, our party keeps its seats and loses its primacy, and the Kingdom turns without a shot fired."
 SIA_face_the_court: "Face the Constitutional Court"
 SIA_face_the_court_desc: "Put the ruling party's fate to the judges, as Thailand has for two decades. Unlike a palace bargain this is a gamble, not a settlement: the bench decides. Submit to a dissolution and hand power to our rivals, or defy the verdict and pay in stability and the army's patience."
 SIA_pack_the_senate: "Pack the Senate"
 SIA_pack_the_senate_desc: "Stuff the upper house and the independent agencies with loyalists until nothing checks the government. Bills pass unopposed for half a year. To the generals this is a power grab in plain sight."
 SIA_populist_trunk_entry_tt: "§Y[neutral_Social_L]§! is the ruling party."
 SIA_royalist_trunk_entry_tt: "§Y[Nat_Autocracy_L]§! or §Y[Monarchist_L]§! is the ruling party."
 SIA_democrat_trunk_entry_tt: "§Y[conservatism_L]§! is the ruling party."
 SIA_telecom_excise_favor: "The Telecom Excise Switch"
 SIA_telecom_excise_favor_desc: "Convert the telecom concession fees into an excise tax, structured so the family-owned AIS keeps its lead and new entrants inherit the burden. The treasury and a grateful corporate base both reward you. The high command notes that the state is being run for one family's balance sheet. §RCoup risk rises.§!"
 SIA_exim_myanmar_loan: "EXIM Loan to Rangoon"
 SIA_exim_myanmar_loan_desc: "Extend a soft state loan to the Myanmar junta, earmarked, conveniently, to buy satellite and telecom services from the family's own Shin Satellite. A foreign-policy gesture that doubles as a tidy contract for the family firm. A textbook conflict of interest the generals do not miss. §RCoup risk rises.§!"
 SIA_state_lottery_scheme: "The Government Lottery"
 SIA_state_lottery_scheme_desc: "Fold the underground numbers game into a state scheme. Off-budget cash for patronage and pet projects, popular with the punters, and the kind of unaccountable fund every coup manifesto lists first."
 SIA_democrat_machine_category: "The Party Machine"
 SIA_democrat_machine_category_desc: "The Democrats' edge is organization, but Thaksin's machine is always one rural landslide from returning to power. Work the constituencies to hold the line.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. It climbs 1 a week, faster in a downturn or when stability slips, and a booming economy and a calm country only hold it level. Pushing it back down takes the decisions below, the Isaan beachhead, or a Rural Development Package. Above 35 it costs stability and growth. Above 70 it costs a great deal more."
 SIA_constituency_machine: "Work the Constituencies"
 SIA_constituency_machine_desc: "Send the members back to their districts to hold clinics, fix the drains, settle the disputes and remember the names. Dull work, and the only kind that holds a seat. §YDemocrat Party popularity rises§! and the populist tide eases."
 SIA_pt_pressure_increase_tt: "§RPopulist Tide [?pt_delta|0+]§! (now §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_pt_pressure_decrease_tt: "§GPopulist Tide [?pt_delta|0+]§! (now §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_match_the_populists: "Match the Populists"
 SIA_match_the_populists_desc: "If you cannot beat the village fund, build a better one. Cheap healthcare, debt relief and rural credit under a Democrat banner. It drains the treasury and it takes the issue away from Pheu Thai."
 SIA_expose_corruption: "Expose the Network"
 SIA_expose_corruption_desc: "Turn the anti-corruption agencies and the courts on the populist machine. Asset cases, vote-buying probes, and the long court fights that have already brought down more than one Thaksinite government."
 SIA_broaden_the_coalition: "Broaden the Coalition"
 SIA_broaden_the_coalition_desc: "Hand ministries to the small parties and provincial bosses in exchange for their seats. The price is a fractious, horse-trading cabinet (§Rthe coalition's demands§!), but it builds a parliamentary firewall no single populist landslide can breach. §GThe populist tide recedes sharply.§!"
 SIA_democrat_machine_active: "Democrat Party Machine Governing"
 SIA_counter_messaging: "Counter the Populist Message"
 SIA_counter_messaging_desc: "Answer the populist line where people actually hear it: the morning talk shows, the village broadcast towers, the union halls. A small push, repeatable, and it chips away at Pheu Thai's momentum."
 SIA_reconstruction_category: "Develop the Recovered Lands"
 SIA_reconstruction_category_desc: "Territory taken on the Western Frontier or the ASEAN hegemony campaigns is held but not yet integrated. Pacify the provinces, pour reconstruction money into them, and once they are quiet enough, claim them for the nation outright."
 SIA_reconstruction_pacify: "Pacify the Provinces"
 SIA_reconstruction_pacify_desc: "Flood the occupied provinces with administrators, informants, and amnesty programs. Compliance rises across every province we hold but have not yet integrated. Slow, patient work, but it is the ground everything else is built on."
 SIA_reconstruction_develop: "Fund Reconstruction Works"
 SIA_reconstruction_develop_desc: "Release reconstruction money for roads, power, and public works across the recovered lands. Infrastructure and building slots rise in every held province, binding them to the national economy and giving the population a stake in Thai rule."
 SIA_reconstruction_integrate: "Proclaim the Reunified Provinces"
 SIA_reconstruction_integrate_desc: "Where compliance is high enough, the occupation ends and the provinces become Thai soil. Every pacified province we hold is cored into the Kingdom, a permanent gain that no peace conference can undo."
 SIA_ghosts_5pct_tt: "§Y[Communist-State_L]§! has at least 5% popularity."
 SIA_reform_5pct_tt: "§Y[socialism_L]§! has at least 5% popularity."
 SIA_reform_trunk_entry_tt: "§Y[socialism_L]§! is the ruling party."
 SIA_communist_trunk_entry_tt: "§Y[Communist-State_L]§! is the ruling party."
 SIA_seize_power_gate_tt: "Win the general strike so the government capitulates, or commit to the armed struggle first."
 SIA_strike_momentum_tt: "§RStrike Momentum [?strike_delta|0+]§! (now §Y[?ROOT.SIA_strike_momentum|0]§!/100). At 100 the government capitulates."
 SIA_general_strike_category: "The General Strike"
 SIA_general_strike_category_desc: "The country is at a standstill and the movement is pressing for the government to fall. Drive strike momentum to 100 before the 180 days run out and the government capitulates on a peaceful road to power. Fall short and the army crushes the strike in a coup.\n\n§RStrike Momentum§!: [?ROOT.SIA_strike_momentum|0]/100"
 SIA_strike_mass_pickets: "Mass Pickets"
 SIA_strike_mass_pickets_desc: "Put tens of thousands on the picket lines and hold the squares day after day. Cheap and fast, the daily muscle that keeps the country shut and the pressure climbing."
 SIA_strike_paralyze_transport: "Paralyse the Ports and Rails"
 SIA_strike_paralyze_transport_desc: "Fund the dockers and railwaymen from the strike fund until nothing moves in or out of the country. The heaviest blow the movement can land, and the costliest to hold."
 SIA_strike_win_the_conscripts: "Win Over the Conscripts"
 SIA_strike_win_the_conscripts_desc: "Send organizers into the barracks. Every conscript who will not fire on his own people is one the generals cannot count on, and capitulation comes closer."
