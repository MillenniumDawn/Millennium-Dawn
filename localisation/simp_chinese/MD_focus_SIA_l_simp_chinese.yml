 SIA_asean_hegemony_government_tt: "既非§Y[conservatism_L]§!也非§Y[socialism_L]§!为执政党。"
 SIA_path_populist: "§Y[neutral_Social_L]§!是执政党。"
 SIA_path_royalist: "§Y[Nat_Autocracy_L]§!或§Y[Monarchist_L]§!是执政党。"
