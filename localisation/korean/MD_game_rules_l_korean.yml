 GEO_WILL_FOLLOW_OWN_WAY: "독자적 노선"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Nationalist Georgia follows its own path in the Caucasus and turns on both Armenia and Azerbaijan. Neither neighbour can count on Tbilisi as an ally."
 GEO_WILL_BE_PRO_ARMENIA: "친아르메니아"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "Nationalist Georgia sides with Armenia and helps it crush Azerbaijan. Yerevan gains a partner on its northern border while Baku faces two enemies."
 GEO_WILL_BE_PRO_AZERI: "Pro-Azerbaijani"
 GEO_WILL_BE_PRO_AZERI_DESC: "Nationalist Georgia sides with Azerbaijan and helps it crush Armenia. Baku gains a partner on its northern border while Yerevan faces two enemies."
 GEO_WILL_HELP: "@CHE 체첸을 지원함"
 GEO_WILL_HELP_DESC: "Georgia backs the Chechen fighters in their war with Russia. A surviving Chechnya can repay the favour later."
 GEO_WONT_HELP: "@CHE 체첸을 지원하지 않음"
 GEO_WONT_HELP_DESC: "Georgia stays out of the Chechen war with Russia. The Chechen fighters remember it and turn hostile to Tbilisi."
 GEO_ATTACK_RUS: "전쟁 준비"
 GEO_ATTACK_RUS_DESC: "Georgia arms for the August war with Russia and fights to win it. A stronger Georgian army makes the South Ossetia crisis a real contest."
 GEO_WEAKBOY: "러시아와의 타협"
 GEO_WEAKBOY_DESC: "Georgia seeks a compromise with Russia to avoid open fighting. Tbilisi trades its claim on the breakaway regions for peace."
 BLR_union_state_ai_behavior: "@BLR  연방 국가 행동"
 BLR_WONT_FOLLOW_UNION_STATE: "연맹국으로 가지 않기"
