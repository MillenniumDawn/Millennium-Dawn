 GER_infantry_weapons_2: "헤클러 운트 코흐 G3A3"
 GER_infantry_weapons_2_short: "G3A3"
 GER_infantry_weapons_2_desc: "G3A3는 G3 시리즈 중 가장 잘 알려진 버전입니다. 개선된 후방 드럼 조준기와 전방 조준기, 소염기/머즐 브레이크, 고정식 플라스틱 개머리판, 그리고 플로팅 배럴과 접촉하지 않는 플라스틱 핸드가드가 특징입니다. 핸드가드는 슬림형 통풍식과 와이드형 두 가지 버전으로 출시되었으며, 와이드형은 양각대 장착을 통해 안정성을 향상시킬 수 있습니다."
 GER_infantry_weapons_3: "헤클러 운트 코흐 G3A4"
 GER_infantry_weapons_3_short: "G3A4"
 GER_infantry_weapons_3_desc: "The G3A4 is a further improved version of the previous G3A3 model using drum sights and a newly designed single position, with some models including a new ambidextrous trigger group and brass deflector to accommodate Left hand Shooters. The G3A4 Entered service in 1974 for frontline infantry units and was in service until the late 1990's before being phased out and replaced."
 GER_infantry_weapons_4: "헤클러 운트 코흐 G36"
 GER_infantry_weapons_4_short: "G36"
 GER_infantry_weapons_4_desc: "헤클러앤코흐 G36(게베르 36)은 5.56x45mm 구경의 돌격소총으로, 1990년대 초 독일 무기 제조업체 헤클러앤코흐에서 더 무거운 7.62x51mm G3 모델을 대체하기 위해 개발되었습니다. 1990년대 중반 독일 연방군에 채택되어 G3를 대체했으며, 이후 수출용으로도 인기를 얻어 독일, 스페인, 영국 등 여러 국가의 군대와 경찰에서 실전에 투입되었습니다."
 GER_infantry_weapons_5: "헤클러 운트 코흐 G36A2"
 GER_infantry_weapons_5_short: "G36A2"
 GER_infantry_weapons_5_desc: "G36A2 모델은 G36 모델의 개량형입니다. G36A2는 기존의 듀얼 컴뱃 사이팅 시스템의 레드닷 조준경을 대체하는, 피카티니 레일에 장착된 탈착식 자이스 RSA 반사식 레드닷 조준경을 특징으로 합니다. G36A2 업그레이드 키트에는 더 짧은 G36C 개머리판, 옵션으로 4개의 피카티니 레일을 장착할 수 있는 알루미늄 재질의 새로운 핸드가드, 그리고 오를리콘 콘트라베스 LLM01 레이저 라이트 모듈 작동 스위치가 내장된 수직형 포어그립이 포함됩니다."
 GER_infantry_weapons_6: "헤클러 운트 코흐 G36A3"
 GER_infantry_weapons_6_short: "G36A3"
 GER_infantry_weapons_6_desc: "G36A3 소총은 G36 플랫폼을 더욱 현대화한 모델로, 더 커진 피카티니 레일, 4단계 조절식 개머리판, 그리고 통합형 자이스 RSA 반사식 레드닷 조준경/운반 손잡이가 헨솔트 조준경으로 교체된 것이 특징입니다."
 GER_infantry_weapons_7: "헤클러 & 코흐 G95K"
 GER_infantry_weapons_7_short: "G95K"
 GER_infantry_weapons_7_desc: "The Heckler & Koch HK416 is a gas-operated assault rifle chambered for the 5.56x45mm NATO cartridge. It is designed and manufactured by the German company Heckler & Koch. Although the design is based on the AR-15 class of firearm, it uses a proprietary short-stroke, gas piston system from Heckler & Koch's earlier G36 family of rifles. The HK416 is also equipped with a proprietary accessory rail forearm with rails on all four sides to accommodate multiple accessories."
 GER_infantry_weapons_8: "헤클러 & 코흐 433"
 GER_infantry_weapons_8_short: "HK 433"
 GER_infantry_weapons_8_desc: "헤클러앤코흐 433(HK433)은 5.56mm x 45 구경의 현대적이고 모듈식이며 소형화된 돌격소총으로, 기존 G36과 HK416 제식소총의 장점과 뛰어난 특징들을 결합한 제품입니다. HK433에는 정확도 향상을 위해 높이 조절이 가능한 뺨받침대가 있는 접이식 개머리판이 새롭게 장착되었습니다. 또한, 근접전 상황에서는 개머리판을 접은 상태로 사용할 수 있습니다."
