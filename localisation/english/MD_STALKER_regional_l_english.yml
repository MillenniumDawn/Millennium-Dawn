l_english:
 STALKER.41.t: "Lost in the Wilderness"
 STALKER.41.d: "A survey team has vanished inside the remote Zone at [event_target:STALKER_zone_display.GetName], and the nearest airstrip is hundreds of kilometres away. Their last radio call described a landscape that no longer matched their maps."
 STALKER.41.a: "Mount a rescue."
 STALKER.41.a_tt: "Costs §R25§! political power. Zone §Yexploitation§! rises by §G5§! as the rescuers chart new routes."
 STALKER.41.b: "Write them off."
 STALKER.41.b_tt: "The §Ystalker§! population falls by up to §Y5§!."
 STALKER.42.t: "Evacuation Crisis"
 STALKER.42.d: "Tens of thousands of people still live inside the new perimeter at [event_target:STALKER_zone_display.GetName], and many refuse to leave homes their families have held for generations. Local officials want to know whether the army will move them by force."
 STALKER.42.a: "Evacuate them by force."
 STALKER.42.a_tt: "Zone §Ycontainment§! rises by §G10§! and we lose §R2%§! stability."
 STALKER.42.b: "Let them stay."
 STALKER.42.b_tt: "The §Ystalker§! population rises by §Y10§! and §YBandit§! influence rises by §R5§!."
 STALKER.43.t: "The River Route"
 STALKER.43.d: "Smugglers are moving artifacts out of [event_target:STALKER_zone_display.GetName] by river at night, in canoes and barges our patrols cannot tell from ordinary traffic. The trade is making local gangs rich."
 STALKER.43.a: "Patrol the rivers."
 STALKER.43.a_tt: "Costs a small expenditure. Zone §YBandit§! influence falls by up to §G15§!."
 STALKER.43.b: "Tax the traffic quietly."
 STALKER.43.b_tt: "Adds §G3§! artifacts to the national stockpile. Zone §YBandit§! influence rises by §R5§!."
 STALKER.44.t: "The Laboratory Next Door"
 STALKER.44.d: "The Zone at [event_target:STALKER_zone_display.GetName] has swallowed ground right up to the fence of a sensitive state facility. Its scientists are asking for access to the anomalies; its security chiefs want the site sealed."
 STALKER.44.a: "Start a classified research programme."
 STALKER.44.a_tt: "Zone §Yexploitation§! rises by §G10§!, increasing our Zone research."
 STALKER.44.b: "Seal the facility off."
 STALKER.44.b_tt: "Zone §Ycontainment§! rises by §G10§!."
 STALKER.45.t: "Anomalous Pulse at the Coastal Complex"
 STALKER.45.d: "Severe gravitational and electromagnetic anomalies have manifested near the critical coastal reactors at [event_target:STALKER_zone_display.GetName]. Maritime traffic through nearby shipping lanes has been disrupted by compass failures, while technicians request specialized containment insulation."
 STALKER.45.a: "Establish naval exclusionary cordons and reinforce the grid."
 STALKER.45.a_tt: "Costs §R25§! political power and §R0.2%§! of GDP. Zone §Ycontainment§! rises by §G15§! and §Yactivity§! falls by §G5§!."
 STALKER.45.b: "Harness the anomalous radiation for atomic research."
 STALKER.45.b_tt: "Zone §Yexploitation§! rises by §G10§!, §Yactivity§! rises by §R5§!, and §Ycontainment§! falls by §R10§!. Adds §G1§! anomalous specimen to our national artifact stockpile."
 STALKER.46.t: "The Thawing Deep Zone"
 STALKER.46.d: "Deep underground anomalies have fractured the permafrost in [event_target:STALKER_zone_display.GetName]. Geothermal vents and crystalline artifact clusters are surfacing in remote tundra valleys, but winter supply routes are buckling under thermal shifts."
 STALKER.46.a: "Dispatch heavy icebreaker and engineering convoys."
 STALKER.46.a_tt: "Costs §R25§! political power and §R0.2%§! of GDP. Zone §Ycontainment§! rises by §G10§!, §YDuty§! influence rises by §G5§!, and mutant populations fall by up to §G10§!."
 STALKER.46.b: "Subsidize independent prospector expeditions."
 STALKER.46.b_tt: "Costs §R15§! political power. The §Ystalker§! population rises by §Y10§!, Zone §Yexploitation§! rises by §G10§!, and §Ycontainment§! falls by §R5§!. Adds §G2§! anomalous specimens to our national artifact stockpile."
 STALKER.47.t: "Black Market Artifacts in the Suburbs"
 STALKER.47.d: "In the densely populated fringe around [event_target:STALKER_zone_display.GetName], anomalous artifacts are being traded openly in city flea markets. Wealthy collectors and university researchers are competing with local street gangs for uncatalogued anomalies."
 STALKER.47.a: "Launch militarized domestic police sweeps."
 STALKER.47.a_tt: "Costs §R30§! political power and §R1%§! stability. Zone §YBandit§! influence falls by up to §G15§!, §Ycontainment§! rises by §G10§!, and the §Ystalker§! population falls by up to §R5§!."
 STALKER.47.b: "Set up state-supervised appraisal offices."
 STALKER.47.b_tt: "Costs §R0.2%§! of GDP. Zone §Yexploitation§! rises by §G10§!, the §Ystalker§! population rises by §G5§!, and §YFreedom§! influence rises by §G5§!. Adds §G2§! anomalous specimens to our national artifact stockpile."
 STALKER.48.t: "The Whispering Canopy"
 STALKER.48.d: "In the dense jungle terrain of [event_target:STALKER_zone_display.GetName], anomalous vegetation and fungal spores have overgrown frontier river checkpoints. Expedition scouts report anomalous bioluminescence and shifting paths through the canopy."
 STALKER.48.a: "Clear wide buffer firebreaks around the cordon."
 STALKER.48.a_tt: "Costs §R20§! political power and §R0.1%§! of GDP. Zone §Ycontainment§! rises by §G10§!, mutant populations fall by up to §G10§!, and §Yactivity§! falls by §G5§!."
 STALKER.48.b: "Harvest biological specimens from the growth."
 STALKER.48.b_tt: "Zone §Yexploitation§! rises by §G15§!, §Ycontainment§! falls by §R5§!, and mutant populations rise by up to §R5§!. Adds §G1§! anomalous specimen to our national artifact stockpile."
