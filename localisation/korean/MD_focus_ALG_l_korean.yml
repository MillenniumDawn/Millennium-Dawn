 alg.450.t: "내전으로 치닫는 알제리"
 alg.450.d: "쌓여가는 불만과 무너지는 안정도가 국가를 한계점 너머로 몰아넣었습니다. 국가가 분열되면서 무장 세력들이 일어나 알제리를 새로운 내부 분쟁의 시대로 몰아넣고 있습니다."
