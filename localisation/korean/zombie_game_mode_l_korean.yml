l_korean:
 RULE_ZOMBIE_DIFFICULTY: "좀비 게임 모드 난이도"
 RULE_ZOMBIE_DIFFICULTY_NORMAL: "보통"
 RULE_ZOMBIE_DIFFICULTY_NORMAL_DESC: "게임 시작 시 좀비 세력이 400만 좀비 병력을 보유합니다."
 RULE_ZOMBIE_DIFFICULTY_HARD: "어려움"
 RULE_ZOMBIE_DIFFICULTY_HARD_DESC: "게임 시작 시 좀비 세력이 900만 좀비 병력을 보유합니다."
 RULE_ZOMBIE_DIFFICULTY_EXTREME: "극한"
 RULE_ZOMBIE_DIFFICULTY_EXTREME_DESC: "게임 시작 시 좀비 세력이 1350만 좀비 병력을 보유합니다."
 RULE_ZOMBIE_DIFFICULTY_INSANE: "광기"
 RULE_ZOMBIE_DIFFICULTY_INSANE_DESC: "게임 시작 시 좀비 세력이 3700만 좀비 병력을 보유합니다."
 RULE_ZOMBIE_GAME_MODE: "좀비 게임 모드 활성화"
 RULE_ZOMBIE_GAME_MODE_NO_DESC: "좀비 게임 모드를 활성화하지 않습니다."
 RULE_ZOMBIE_GAME_MODE_YES_DESC: "The Zombie game will be enabled. All other Millennium Dawn content will still exist, so keep that in mind. If you want to play as the Zombies, start as India."
 zombie: "좀비 바이러스"
 zombie_desc: "이 바이러스는 무해한 인간을 괴물로 변모시킨다."
 zombie_0: "좀비 바이러스"
 zombie_0_desc: "이 바이러스는 무해한 인간을 괴물로 변모시킨다."
 Zombie: "좀비"
 Zombie_desc: "좀비의 유일한 목적은 사람을 잡아먹는 것이다."
 better_instincts: "기초적 본능"
 better_instincts_desc: "좀비들이 더 효율적인 살상 방법을 진화시켰습니다."
 shock_and_zombie_awe: "대규모 공황"
 shock_and_zombie_awe_desc: "민간인들 사이에 공황이 퍼지고 있습니다. 좀비와, 그들이 군 진지를 얼마나 빠르게 압도했는지에 대해 누구도 대비할 수 없었습니다. 생존에 대한 신뢰가 무너지면서 필사적인 방어선이 무너지고 있습니다."
 zombie.1.t: "영국으로 확산되는 바이러스"
 zombie.1.d: "해협은 끈질긴 역병에 아무런 장애물이 되지 못했습니다. 감염된 난민들이 도버의 흰 절벽을 따라 해안으로 밀려들고, 바이러스가 제국의 심장부를 휩쓸면서 런던의 북적이던 거리는 섬뜩하리만치 고요해졌습니다. 죽은 자들이 걷기 시작하면서 영국의 섬 요새는 감옥으로 변합니다."
 zombie.1.a: "발병을 인정한다"
 zombie.2.t: "아일랜드로 확산되는 바이러스"
 zombie.2.d: "아일랜드해는 언데드 역병에 장벽이 되지 못했습니다. 어선들은 어획물 이상의 것을 싣고 항구로 돌아오고, 해안 마을들은 하나둘 침묵에 잠깁니다. 감염은 더블린과 코크에서 내륙으로 퍼져, 비틀거리는 시체의 물결로 에메랄드 섬을 집어삼킵니다."
 zombie.2.a: "발병을 인정한다"
 zombie.3.t: "미국으로 확산되는 바이러스"
 zombie.3.d: "필사적인 격리 조치에도 불구하고, 유럽을 탈출한 감염된 난민들이 대서양을 건너 역병을 옮겨 왔습니다. 동부 해안의 주요 항구 도시들에서 발병이 보고되었으며, 감염은 끔찍한 속도로 서쪽으로 퍼지고 있습니다. 아메리칸 드림이 걸어 다니는 죽은 자들의 악몽으로 변합니다."
 zombie.3.a: "발병을 인정한다"
 zombie.4.t: "일본으로 확산되는 바이러스"
 zombie.4.d: "떠오르는 태양의 땅은 이제 명예도 자비도 모르는 군대와 맞서고 있습니다. 밀집된 도시들이 죽음의 함정으로 변하면서 도쿄, 오사카 등 인구 밀집 지역에서 보고가 쏟아져 들어옵니다. 오래된 사찰과 현대의 고층 빌딩 할 것 없이 끈질긴 감염자의 물결에 무너져 내립니다."
 zombie.4.a: "발병을 인정한다"
 zombie.5.t: "오스트레일리아로 확산되는 바이러스"
 zombie.5.d: "광활한 바다는 일시적인 유예만을 줄 뿐입니다. 감염된 승조원을 태운 화물선이 시드니와 멜버른에 도착하고, 발병은 대륙을 휩쓸었습니다. 인류 최후의 섬 요새가 무너지기 시작하면서, 척박한 아웃백조차 퍼지는 역병을 피할 은신처가 되지 못합니다."
 zombie.5.a: "발병을 인정한다"
 zombie.6.t: "뉴질랜드로 확산되는 바이러스"
 zombie.6.d: "가운데땅의 영감이 된 외딴 섬들이 이제 자신들만의 종말을 맞이하고 있습니다. 감염은 공중과 바다로 상륙하여 웰링턴과 오클랜드로 퍼집니다. 한때 가장 큰 방어책이었던 뉴질랜드의 고립은 이제 도망칠 곳이 어디에도 없다는 뜻이 되었습니다."
 zombie.6.a: "발병을 인정한다"
 zombie.7.t: "필리핀으로 확산되는 바이러스"
 zombie.7.d: "감염은 열대 폭풍처럼 필리핀 제도를 휩쓸고 있습니다. 섬에서 섬으로 건너다니는 생존자들이 루손에서 민다나오까지 역병을 옮기고, 한때 자연 장벽 구실을 하던 수천 개의 섬은 이제 탈출할 희망이 없는 공포의 고립 지대가 되었습니다."
 zombie.7.a: "발병을 인정한다"
 zombie.8.t: "좀비 무리"
 zombie.8.d: "죽은 자들이 지상을 걷고 있습니다. 좀비 무리가 인도 아대륙 전역에서 발생하여 감염과 직접적인 포식으로 우리 인구를 빠르게 집어삼키고 있습니다. 전문가들은 이 분쟁을 \\"대발병\\"이라 명명했지만, 인류의 생존을 건 전쟁은 이제 막 시작되었을 뿐입니다. 이미 절박해진 국가들이 국경을 걸어 잠그고 있습니다."
 zombie.8.a: "무리에 맞서 동원하라"
 zombie.8.b: "인류의 운명을 받아들이라"
 zombie.9.t: "[FROM.GetName]의 좀비 대응 지원 요청"
 zombie.9.d: "[FROM.GetName]이(가) 지원을 요청했으며, 발발을 저지하기 위해 모든 주요 국가의 참여를 호소하고 있습니다. 우리는 이 요청에 응하겠습니까, 아니면 우리 자신의 생존을 우선시하겠습니까?"
 zombie.9.a: "연합에 가입한다"
 zombie.9.b: "우리의 생존을 우선시한다"
 RULE_ZOMBIE_JOINING_FACTION_GAME_MODE: "대좀비 연합 세력 가입 설정"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL: "기본 세력 행동"
 RULE_ZOMBIE_JOINING_FACTION_NORMAL_DESC: "이 게임 모드의 기본 설정을 따릅니다."
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS: "열강 미가입"
 RULE_ZOMBIE_JOINING_FACTION_NO_MAJORS_DESC: "열강이 대좀비 연합에 가입하지 않습니다."
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS: "모든 강대국이 연합에 참여"
 RULE_ZOMBIE_JOINING_FACTION_ALL_MAJORS_DESC: "모든 열강이 대좀비 연합에 가입합니다."
 zombie.10.t: "발발!"
 zombie.10.d: "좀비 바이러스가 우리 영토에 퍼졌으며, 현재 [?var:random_outbreak_state.GetName] 전역으로 확산되고 있습니다. 발발의 심각성은 아직 알려지지 않았습니다."
 zombie.10.a: "군을 동원하라"
 zombie.11.t: "[FROM.GetName]에서의 발발"
 zombie.11.d: "[FROM.GetName]에서 발발이 일어났으며 급속히 악화되고 있습니다. 좀비 바이러스는 끔찍한 속도로 퍼지고 있으며, 이 상황은 종말의 시작일 수 있습니다."
 zombie.11.a: "상황을 주시한다"
 zombie.11.b: "최악의 사태에 대비한다"
 RULE_ZOMBIE_SPAWN_LOCATION: "좀비 발생 지점"
 RULE_ZOMBIE_SPAWN_INDIA: "인도(기본값)"
 RULE_ZOMBIE_SPAWN_INDIA_DESC: "좀비 무리가 평소와 같이 인도에서 발생합니다."
 RULE_ZOMBIE_SPAWN_AFRICA: "중앙아프리카"
 RULE_ZOMBIE_SPAWN_AFRICA_DESC: "좀비 무리가 중앙아프리카(콩고 지역)에서 발생하여, 유럽과 중동을 위협하는 새로운 전선이 더 일찍 열립니다."
 RULE_ZOMBIE_SPAWN_EAST_ASIA: "동아시아"
 RULE_ZOMBIE_SPAWN_EAST_ASIA_DESC: "좀비 무리가 한반도에서 발생하여 동아시아, 일본, 태평양을 즉각 위협합니다."
 RULE_ZOMBIE_SPAWN_MULTIPLE: "복수 지점"
 RULE_ZOMBIE_SPAWN_MULTIPLE_DESC: "좀비 무리가 인도, 중앙아프리카, 동아시아에서 동시에 발생하며, 각 지점의 초기 병력은 더 적습니다."
 RULE_ZOMBIE_COALITION_ENABLED: "좀비 대응 연합 세력"
 RULE_ZOMBIE_COALITION_ENABLED_YES: "활성화(기본값)"
 RULE_ZOMBIE_COALITION_ENABLED_YES_DESC: "좀비 대응 연합이 정상적으로 형성됩니다. 주요 강대국들이 좀비 무리에 맞선 싸움에 참여하도록 초청받습니다."
 RULE_ZOMBIE_COALITION_ENABLED_NO: "비활성화"
 RULE_ZOMBIE_COALITION_ENABLED_NO_DESC: "좀비 대응 연합이 형성되지 않습니다. 각국은 조직화된 연합 없이 스스로 발병 사태를 이겨 내야 합니다."
 RULE_ZOMBIE_COALITION_DELAY: "좀비 발생 지연"
 RULE_ZOMBIE_COALITION_DELAY_NONE: "지연 없음(기본값)"
 RULE_ZOMBIE_COALITION_DELAY_NONE_DESC: "좀비 무리가 게임 시작과 동시에 즉시 발생합니다."
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR: "1년"
 RULE_ZOMBIE_COALITION_DELAY_ONE_YEAR_DESC: "좀비 무리가 1년의 카운트다운 후에 발생하며, 발병이 시작되기 전에 각국이 준비할 시간을 줍니다."
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS: "2년"
 RULE_ZOMBIE_COALITION_DELAY_TWO_YEARS_DESC: "좀비 무리가 2년의 카운트다운 후에 발생하며, 각국이 경제와 군사력을 키울 상당한 시간을 줍니다."
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS: "3년"
 RULE_ZOMBIE_COALITION_DELAY_THREE_YEARS_DESC: "좀비 무리가 3년의 카운트다운 후에 발생하며, 발병이 시작되기 전에 각국에 충분한 준비 시간을 줍니다."
 zombie_runner: "러너 변종"
 zombie_runner_desc: "좀비 바이러스의 더 빠르고 공격적인 변이체입니다. 러너는 떼를 지어 이동하며 순전한 속도와 수로 방어선을 압도합니다.\n\n§G설계 힌트: 러너는 좁은 편제에서 높은 속도와 강력한 대인 공격력을 제공합니다. 빈틈을 파고들어 보병을 유린하는 데 사용하십시오. 다만 낮은 조직력, 약한 방어력, 사실상 없는 대장갑 능력 때문에 장기전에서는 손실이 큽니다.§!"
 zombie_runner_0: "러너 변종"
 zombie_runner_0_desc: "좀비 바이러스의 더 빠르고 공격적인 변이체입니다. 러너는 떼를 지어 이동하며 순전한 속도와 수로 방어선을 압도합니다."
 zombie_brute: "브루트 변종"
 zombie_brute_desc: "크고 더 끈질긴 좀비를 만들어 내는, 심하게 변이된 변종입니다. 브루트는 엄청난 타격을 견뎌 내며 방어선을 돌파합니다.\n\n§G설계 힌트: 브루트는 높은 방어력, 돌파력, 체력과 다른 좀비 변종보다 높은 대물 공격력을 제공합니다. 견고한 진지를 상대하는 느린 돌격 부대로 사용하십시오. 다만 낮은 속도, 넓은 전투 폭, 매우 큰 인력 요구량이 기동성과 수적 규모를 제한합니다.§!"
 zombie_brute_0: "브루트 변종"
 zombie_brute_0_desc: "크고 더 끈질긴 좀비를 만들어 내는, 심하게 변이된 변종입니다. 브루트는 엄청난 타격을 견뎌 내며 방어선을 돌파합니다."
 zombie.12.t: "나이지리아로 확산되는 바이러스"
 zombie.12.d: "역병이 대륙을 건너뛰었습니다. 기니만을 따라 늘어선 항구 도시들에서는 감염자들이 해안에서 내륙으로 몰려들며 대규모 사상자가 발생했다고 보고하고 있습니다. 나이지리아의 방대한 인구와 밀집된 도시 중심지는 이 공포가 번지기에 비옥한 토양입니다. 서아프리카는 결코 예전으로 돌아가지 못할 수도 있습니다."
 zombie.12.a: "위협을 인정한다"
 zombie.13.t: "브라질로 확산되는 바이러스"
 zombie.13.d: "아마존은 아무런 장벽이 되지 못합니다. 감염은 상파울루와 리우데자네이루에서 동시에 발생하여 남아메리카 최대의 도시들을 무서운 속도로 휩쓸고 있습니다. 공황에 빠진 수백만 명의 민간인이 내륙으로 향하는 고속도로를 메우고 있으며, 자신도 모르게 바이러스를 함께 실어 나르고 있습니다."
 zombie.13.a: "위협을 인정한다"
 zombie.14.t: "튀르키예로 확산되는 바이러스"
 zombie.14.d: "두 대륙에 걸쳐 있는 튀르키예는 동방의 감염과 유럽을 잇는 다리가 되었습니다. 이스탄불과 앙카라에서 발발이 일어났으며, 당국은 급속히 통제 불능이 되어 가는 사태를 억제하려 허둥대고 있습니다. 한때 연결의 상징이었던 보스포루스는 이제 죽음만을 실어 나릅니다."
 zombie.14.a: "위협을 인정한다"
 zombie.15.t: "진화하는 무리"
 zombie.15.d: "바이러스가 변이하고 있습니다. 정찰병들은 감염자들 사이에서 새로운 종류가 나타났다고 보고합니다. 무리를 지어 움직이는 더 빠르고 더 흉포한 변종, 그리고 소형 화기 사격을 가볍게 견뎌내는 더 크고 더 강인한 개체들입니다. 무리는 하루가 다르게 더욱 위험해지고 있습니다."
 zombie.15.a: "진화를 인정한다"
 ZOM_cure_developed: "좀비 치료제 시제품"
 ZOM_cure_developed_desc: "우리 과학자들이 좀비 바이러스에 대한 실험적 치료제를 개발했습니다. 연합의 보급망을 통해 배포되는 이 백신은 언데드와 싸우는 모든 부대에 뚜렷한 전투상의 이점을 부여합니다."
 ZOM_research_cure: "치료제 개발"
 ZOM_research_cure_desc: "인류가 직면한 가장 큰 위협에는 우리의 가장 큰 과학적 노력이 필요합니다. 자원과 전문 지식을 한데 모으면 이 전쟁의 흐름을 바꿀 치료제나 백신을 개발할 수 있을 것입니다. 완료되면 좀비 무리와 싸우는 모든 국가가 전투 보너스를 받습니다."
 ZOM_establish_safe_zones: "안전 지대 설치"
 ZOM_establish_safe_zones_desc: "비전투원을 보호하고 공공 질서를 유지하기 위해 민간인 안전 지대를 지정하고 요새화합니다. 조직된 대피 통로와 강화된 대피소가 시간을 벌어 주고 후방을 안정시킬 것입니다."
 ZOM_develop_a_cure: "치료제 개발"
 ZOM_develop_a_cure_desc: "치료제 개발 결정에 자금을 투입하여 완료합니다. 성공하면 좀비 무리와 싸우는 모든 국가가 언데드에 대한 전투 보너스를 받습니다."
 ZOM_protect_civilian_population: "민간인 보호"
 ZOM_protect_civilian_population_desc: "민간인의 안전과 사회적 결속을 위해 안정도를 60% 이상으로 유지하십시오."
 ZOM_global_mobilization: "전 세계 총동원"
 ZOM_global_mobilization_desc: "대좀비 연합의 회원국을 최소 8개국으로 늘리십시오."
 ZOM_defeat_the_zombie_horde: "좀비 무리 격퇴"
 ZOM_defeat_the_zombie_horde_desc: "좀비 무리를 섬멸하고 인류에 대한 위협을 끝내십시오."
 the_horde_spreads: "무리의 확산"
 zombie_capitulation.1.t: "무너지는 붉은 용"
 zombie_capitulation.1.d: "지구상에서 가장 인구가 많은 국가가 집어삼켜졌습니다. 중국의 방대한 군대도, 만리장성도, 10억 인구도 아무 소용이 없었습니다. 베이징은 며칠 만에, 상하이는 몇 시간 만에 함락되었습니다. 중국 도시들의 엄청난 인구 밀도는 도시를 도살장으로 바꾸어 놓았고, 이제 10억 구가 넘는 시체가 무리의 깃발 아래 행군하고 있습니다. 중국조차 버티지 못했다면 우리에게 남은 희망은 무엇입니까?"
 zombie_capitulation.1.a: "상실을 받아들인다"
 zombie_capitulation.1.b: "최악의 사태에 대비한다"
 zombie_capitulation.2.t: "무너지는 러시아"
 zombie_capitulation.2.d: "지구상에서 가장 큰 나라가 언데드 역병에 굴복했습니다. 한때 무리에 맞선 천연 요새로 여겨졌던 러시아의 끝없는 동토와 울창한 숲은 추위를 느끼지도, 지치지도, 멈추지도 않는 적 앞에서 무의미한 것으로 드러났습니다. 모스크바의 방어선은 붕괴했고 크렘린은 침묵 속에 서 있습니다. 이제 무리는 유럽에서 태평양에 이르는 영토를 지배하고 있습니다."
 zombie_capitulation.2.a: "상실을 받아들인다"
 zombie_capitulation.2.b: "최악의 사태에 대비한다"
 zombie_capitulation.3.t: "무너지는 미국"
 zombie_capitulation.3.d: "마지막 초강대국이 쓰러졌습니다. 막강한 군사력과 핵무기고, 그리고 대양이라는 거리도 미국은 이 파도를 막지 못했습니다. 동부 해안이 가장 먼저 유린당했고, 이어 중부 내륙이, 마지막으로 로키산맥의 잔존 세력마저 침묵했습니다. 성조기는 더 이상 워싱턴 위에서 휘날리지 않습니다. 많은 이에게 이는 우리가 알던 인류 문명의 진정한 종말을 의미합니다."
 zombie_capitulation.3.a: "상실을 받아들인다"
 zombie_capitulation.3.b: "최악의 사태에 대비한다"
 zombie_coalition_decision_category: "무리 관련 결정"
 zombie_coalition_decision_category_desc: ""
 zombie.8.d.africa: "죽은 자들이 지상을 걷고 있습니다. 좀비 무리가 중앙아프리카에서 발생하여 감염과 직접적인 포식으로 우리 인구를 빠르게 집어삼키고 있습니다. 전문가들은 이 분쟁을 \\"대발병\\"이라 명명했지만, 인류의 생존을 건 전쟁은 이제 막 시작되었을 뿐입니다. 이미 절박해진 국가들이 국경을 걸어 잠그고 있습니다."
 zombie.8.d.east_asia: "죽은 자들이 지상을 걷고 있습니다. 좀비 무리가 한반도에서 출현하여 감염과 직접적인 포식을 통해 우리 국민을 빠르게 집어삼키고 있습니다. 전문가들은 이 분쟁을 \\"발발\\"이라 명명했으나, 인류의 생존을 건 전쟁은 이제 막 시작되었을 뿐입니다. 이미 절박해진 국가들은 국경을 폐쇄하고 있습니다."
 zombie.8.d.multiple: "죽은 자들이 지상을 걷고 있습니다. 좀비 무리가 인도, 중앙아프리카, 한반도 등 두 개 대륙에서 동시에 폭발적으로 출현하여 감염과 직접적인 포식을 통해 우리 국민을 빠르게 집어삼키고 있습니다. 전문가들은 이 분쟁을 \\"발발\\"이라 명명했으나, 인류의 생존을 건 전쟁은 이제 막 시작되었을 뿐입니다. 이미 절박해진 국가들은 국경을 폐쇄하고 있습니다."
 zombie_capitulation.4.t: "발병 사태의 종식"
 zombie_capitulation.4.d: "모든 예상을 뒤엎고 인류가 승리했습니다. 좀비 무리는 무너졌습니다. 영토는 해방되었고, 떼는 파괴되었으며, 마지막 감염자도 안식에 들었습니다. 종말로 상처 입은 도시들은 기나긴 재건 작업을 시작합니다. 세상은 영원히 변했지만, 그럼에도 계속 이어지고 있습니다."
 zombie_capitulation.4.a: "인류는 계속된다"
 ZOM_hold_the_line: "전선 사수"
 ZOM_hold_the_line_desc: "좀비 무리가 진화할 때까지 수도를 계속 장악하십시오. 첫 번째 파도가 꺾인 뒤에도 정부 소재지가 건재하다면 희망은 이어집니다."
 ZOM_sanctuary: "성역"
 ZOM_sanctuary_desc: "생존자들을 보호할 안전 지대를 다섯 곳 설치하십시오. 성벽과 질서, 그리고 피할 수 있는 장소만이 살아 있는 자들에게 남은 유일한 피난처입니다."
 ZOM_sanctuary_completed_tt: "§Y안전 지대§! 5곳 설치"
 ZOM_reclaim_the_cradle: "요람 탈환"
 ZOM_reclaim_the_cradle_desc: "발발의 중심, 즉 좀비 무리의 수도를 점령하십시오. 역병이 태어난 둥지를 불태워 없애십시오."
 ZOM_total_eradication: "완전 박멸"
 ZOM_total_eradication_desc: "좀비 무리를 파괴하고 감염에 대한 치료제를 개발하십시오. 전염병이 여전히 혈관 속에서 퍼지는 한 전장에서의 승리는 큰 의미가 없습니다."
 ZOM_against_all_odds: "역경을 딛고"
 ZOM_against_all_odds_desc: "극한 또는 광기 난이도에서 좀비 무리를 격퇴하십시오. 압도적인 수에 맞서 인류는 쓰러지기를 거부했습니다."
 zombies: "좀비 무리"
 zombies_desc: "굶주림과 본능에 이끌려 나아가는 감염된 시체 떼입니다.\n\n§G설계 힌트: 좀비 무리는 강력한 회복력과 높은 대인 공격력을 갖춘 대규모 전선 편제를 빠르게 훈련시킬 수 있습니다. 물량으로 방어군을 압도하는 데 사용하십시오. 다만 낮은 조직력, 부실한 대장갑 능력, 막대한 인력 요구량 때문에 무리 하나하나가 다루기 힘듭니다.§!"