l_english:
 # Ideas
 SOL_idea_rampant_ethnic_violence: "Rampant Ethnic Violence"
 SOL_idea_rampant_ethnic_violence_desc: "Tensions between the Isatabu Freedom Movement and the Malaita Eagle Force have broken out across the country. Law and order has ceased to exist as the government has lost control completely. With no consequences, individual crimes are rampant."
 SOL_AST_idea_contained_ethnic_violence: "Contained Ethnic Violence"
 SOL_AST_idea_contained_ethnic_violence_desc: "Operation RAMSI is underway. With help from [?AST.GetName|Y], the battle for law and order is raging. The Isatabu Freedom Movement and the Malaita Eagle Force are aware that the well-equipped and professional forces that are flooding the country will retaliate to any violence."
 SOL_CHI_idea_contained_ethnic_violence: "Contained Ethnic Violence"
 SOL_CHI_idea_contained_ethnic_violence_desc: "Operation RAMSI is underway. With help from [?CHI.GetName|Y], the battle for law and order is raging. The Isatabu Freedom Movement and the Malaita Eagle Force are aware that the well-equipped and professional forces that are flooding the country will retaliate to any violence."
 SOL_idea_humanitarian_disaster: "Humanitarian Disaster"
 SOL_idea_humanitarian_disaster_desc: "The government is bankrupt and powerless to help the people. In conjunction with constant violence, social services have ceased to exist. The country is in a state of emergency and the international community has refused to help."
 SOL_idea_disarmed_population: "Disarmed Population"
 SOL_idea_disarmed_population_desc: "Whether by force, or by a gun buyback program initiated by intervention forces, a significant amount of this country's weapons have been destroyed."
 SOL_AST_idea_reformed_government: "Western Reformed Government"
 SOL_AST_idea_reformed_government_desc: "The government in [?SOL.GetName|Y] has been reformed in the image of [?AST.GetName|Y] after a major crisis."
 SOL_CHI_idea_reformed_government: "Emerging Reformed Government"
 SOL_CHI_idea_reformed_government_desc: "The government in [?SOL.GetName|Y] has been reformed in the image of [?CHI.GetName|Y] after a major crisis."
 SOL_AST_pacific_security_partner: "[?SOL.GetName|Y] Security Partnership"
 SOL_AST_pacific_security_partner_desc: "We have formalised a comprehensive security partnership with the [?SOL.GetName|Y]. Our intelligence services share signals and counter-intelligence with theirs, our maritime surveillance network extends across the South Pacific via radar and patrol cooperation, and our diplomats coordinate closely with their leadership. The partnership has tangible benefits for our position in the region."
 SOL_CHI_pacific_security_partner: "[?SOL.GetName|Y] Security Partnership"
 SOL_CHI_pacific_security_partner_desc: "We have formalised a comprehensive security partnership with the [?SOL.GetName|Y]. Our intelligence services cooperate with theirs, our maritime surveillance extends deep into the South Pacific, and our diplomats coordinate closely with their leadership. The partnership has tangible benefits for our position in the Pacific."

 # Country Flags
 SOL_AST_operation_RAMSI: "Operation RAMSI has started"
 SOL_AST_requested_industry_construction: "Requested help for industry construction"
 SOL_CHI_requested_industry_construction: "Requested help for industry construction"
 SOL_industry_construction_built: "Industry construction complete"
 SOL_AST_requested_connectivity_construction: "Requested help for connectivity construction"
 SOL_CHI_requested_connectivity_construction: "Requested help for connectivity construction"
 SOL_connectivity_construction_built: "Connectivity construction complete"
 SOL_AST_declined_RAMSI: "Australia declined to intervene"

 # Decisions
 SOL_developing_nation_category: "A Developing Nation"
 SOL_developing_nation_category_desc: "[?SOL.GetName|Y] is a small island nation with very little in the way of industry and essentially no economic power internationally. What we do have is a vote at the UN, and a few powerful neighbours that are very concerned with geopolitics. Our closest developed neighbour is [?AST.GetName|Y] and they've traditionally been a good friend to have. But [?CHI.GetName|Y] is a growing power with a gigantic economy, and great interest in gaining votes at the UN..."
 SOL_AST_request_industry_investment: "Ask [?AST.GetName|Y] about industry"
 SOL_AST_request_industry_investment_desc: "We will go to [?AST.GetName|Y] first and request help setting up some industry. Their expertise will help us setup our first §Ycivilian factory§.."
 SOL_CHI_request_industry_investment: "Ask [?CHI.GetName|Y] about industry"
 SOL_CHI_request_industry_investment_desc: "We will go to [?CHI.GetName|Y] first and request help setting up some industry. Who better to ask, than the world's factory for setting up our first §Ycivilian factory§??"
 SOL_AST_request_infrastructure_investment: "Ask [?AST.GetName|Y] about infrastructure"
 SOL_AST_request_infrastructure_investment_desc: "We will go to [?AST.GetName|Y] first and request help setting up some infrastructure. They certainly have the most advanced infrastructure in the Asia Pacific and will be perfect partners in our §Yinfrastructure project§.."
 SOL_CHI_request_infrastructure_investment: "Ask [?CHI.GetName|Y] about infrastructure"
 SOL_CHI_request_infrastructure_investment_desc: "We will go to [?CHI.GetName|Y] first and request help setting up some infrastructure. In recent years, they've been building out infrastructure at lightning speed. We will surely get good value if they help with our §Yinfrastructure project§.."
 SOL_AST_request_connectivity_investment: "Ask [?AST.GetName|Y] about connectivity"
 SOL_AST_request_connectivity_investment_desc: "We will approach [?AST.GetName|Y] first about laying undersea cable and building modern telecom in our islands. They are our nearest developed neighbour and have the technical capacity to deliver a §Yconnectivity project§. quickly."
 SOL_CHI_request_connectivity_investment: "Ask [?CHI.GetName|Y] about connectivity"
 SOL_CHI_request_connectivity_investment_desc: "We will approach [?CHI.GetName|Y] first about laying undersea cable and building modern telecom in our islands. They have been the world leader in rolling out fast, cheap network infrastructure across the developing world, and our §Yconnectivity project§. would benefit from their expertise."
 CHI_solomon_intervention_category: "Operation RAMSI"
 CHI_solomon_intervention_category_desc: "[?SOL.GetName|Y] has asked us to lead the international response to a humanitarian crisis on their islands. Our deployment will bring law and order, demilitarise the population, and rebuild civic institutions to our standards."
 CHI_solomon_intervention: "Commit to Operation RAMSI"
 CHI_solomon_intervention_desc: "We have indicated we are willing to help [?SOL.GetName|Y] with their crisis. It's time to commit our forces, deploy police and military personnel, and begin restoring order. This will be a long campaign with a meaningful cost in manpower and treasury, but a successful intervention would make [?SOL.GetName|Y] a lasting partner in the Pacific."

 # Events
 solomon_competition.1.t: "[?SOL.GetName|Y] Industry Investment"
 solomon_competition.1.d: "Having little industry of their own, the small island nation of the [?SOL.GetName|Y] has approached us with a request to help them setup some industry. Even a small gesture would make a big difference for the development of their nation. There's not much in it for us, and we would need to cover the full cost of the project."
 solomon_competition.1.o1: "We'll help out"
 solomon_competition.1.o2: "We're not interested"

 solomon_competition.2.t: "[?SOL.GetName|Y] Industry Investment"
 solomon_competition.2.d: "Having little industry of their own, the small island nation of the [?SOL.GetName|Y] has approached us with a request to help them setup some industry. Even a small gesture would make a big difference for the development of their nation. There's not much in it for us, and we would need to cover the full cost of the project. It seems they already approached [?FROM.GetName|Y] and were rejected."
 solomon_competition.2.o1: "We'll help out"
 solomon_competition.2.o2: "We're not interested"

 solomon_competition.3.t: "[?FROM.GetName|Y] Agrees To Help"
 solomon_competition.3.d: "After negotiations with [?AST.GetName|Y] and [?CHI.GetName|Y], [?FROM.GetName|Y] has agreed to foot the bill on a new industry project. This will be a major step forward for our tiny nation. We can finally get started on improving our industry."
 solomon_competition.3.o1: "Great news!"

 solomon_competition.4.t: "Nobody Wants To Help"
 solomon_competition.4.d: "After being rejected by [?AST.GetName|Y] and [?CHI.GetName|Y], we've been left to fend for ourselves. We have no industry to speak of, and no way to get started. It seems we're doomed to remain a backwater nation."
 solomon_competition.4.o1: "We've been abandoned."

 solomon_competition.5.t: "A Need For Infrastructure"
 solomon_competition.5.d: "Our population has grown steadily larger over the years. The lifestyle that has sustained us for so long is no longer sufficient to support our people. We need to take a step into the modern era and build some modern infrastructure. It will take a long time to achieve this kind of advancement on our own. We should approach our powerful neighbours for assistance."
 solomon_competition.5.o1: "Onwards to a better future!"

 solomon_competition.6.t: "[?SOL.GetName|Y] Infrastructure Investment"
 solomon_competition.6.d: "Having lived with little infrastructure in the past, the small island nation of the [?SOL.GetName|Y] has decided it's time to take a step forward. They have approached us with a request to help them improve their infrastructure. Even a small gesture would make a big difference for the development of their nation. There's not much in it for us, and we would need to cover the full cost of the project."
 solomon_competition.6.o1: "We'll help out"
 solomon_competition.6.o2: "We're not interested"

 solomon_competition.7.t: "[?SOL.GetName|Y] Infrastructure Investment"
 solomon_competition.7.d: "Having lived with little infrastructure in the past, the small island nation of the [?SOL.GetName|Y] has decided it's time to take a step forward. They have approached us with a request to help them improve their infrastructure. Even a small gesture would make a big difference for the development of their nation. There's not much in it for us, and we would need to cover the full cost of the project. It seems they already approached [?FROM.GetName|Y] and were rejected."
 solomon_competition.7.o1: "We'll help out"
 solomon_competition.7.o2: "We're not interested"

 solomon_competition.8.t: "[?FROM.GetName|Y] Agrees To Help"
 solomon_competition.8.d: "After negotiations with [?AST.GetName|Y] and [?CHI.GetName|Y], [?FROM.GetName|Y] has agreed to foot the bill on a new infrastructure project. This will be a major step forward for our tiny nation. We can finally get started on improving our infrastructure."
 solomon_competition.8.o1: "Great news!"

 solomon_competition.9.t: "Nobody Wants To Help"
 solomon_competition.9.d: "After being rejected by [?AST.GetName|Y] and [?CHI.GetName|Y], we've been left to fend for ourselves. This is a sad outcome, we thought we could rely on our friends."
 solomon_competition.9.o1: "We'll need to make our own way."

 solomon_competition.10.t: "The Information Age"
 solomon_competition.10.d: "It seems that the 21st century will bring with it a new world. The age of the internet is here and our people want a slice of it. It would be a great boon for education and business if we could get some network infrastructure of our own. Getting a small island setup with the internet is an expensive business though and we'll need assistance from our neighbours."
 solomon_competition.10.o1: "Let's get connected!"

 solomon_competition.25.t: "Growing Unrest"
 solomon_competition.25.d: "In recent years, the government has progressively lost control over a significant portion of the country. Our economy is declining and we've been unable to pay our public servants. Worse still, tensions between the Isatabu Freedom Movement (IFM) from Guadalcanal and Malaita Eagle Force (MEF) from their neighbours in Malaita are growing more severe. The lack of funds is making it impossible for our government to do anything."
 solomon_competition.25.o1: "Maybe things will improve?"

 solomon_competition.26.t: "Violence Erupts"
 solomon_competition.26.d: "Violent clashes between the IFM and MEF have broken out across the country. It's lead to a breakdown of law and order, paralysing public services and displacing thousands. This is becoming a serious humanitarian crisis."
 solomon_competition.26.o1: "We need international assistance"

 solomon_competition.27.t: "Operation RAMSI"
 solomon_competition.27.d1: "The [?SOL.GetName|Y] High Commission in [?AST.capital.GetName|Y] has contacted us with severe news. Ethnic tensions have flared across the country and a major humanitarian crisis is unfolding. Their government is essentially bankrupt and the situation is spiralling out of control. They've requested our assistance with restoring law and order to the region. This may become a major undertaking and will require a long term commitment. Instability in our region isn't a good look."
 solomon_competition.27.d2: "The [?SOL.GetName|Y] embassy in [?CHI.capital.GetName|Y] has contacted us with an interesting development. Ethnic tensions have flared across the country and a major humanitarian crisis is currently unfolding. They've requested our assistance with restoring law and order to the region. This may become a major undertaking and will require a long term commitment. This could be an excellent opportunity to build our influence in the Pacific."
 solomon_competition.27.d3: "The [?SOL.GetName|Y] has now approached us. Their major neighbour [?AST.GetName|Y] declined to intervene in the unfolding humanitarian crisis, and the [?SOL.GetName|Y] government is asking us to step in. This may become a major undertaking and will require a long term commitment, but [?AST.GetName|Y]'s refusal leaves a vacuum we can fill. Building lasting influence in the Pacific has rarely been so cheap."
 solomon_competition.27.o1: "Send our forces"
 solomon_competition.27.o2: "Let's see how this plays out."

 solomon_competition.28.t: "Operation RAMSI"
 solomon_competition.28.d: "[?FROM.GetName|Y] has agreed to send forces to the [?SOL.GetName|Y] to assist with restoring law and order. They're sending around 1500 military personnel, 300 police officers and 150 humanitarian workers and a number of political and economic advisors."
 solomon_competition.28.o1: "Thank goodness."

 solomon_competition.29.t: "Operation RAMSI"
 solomon_competition.29.d: "Our requests for international assistance have been rejected on all fronts! We're on our own in this crisis. How many poor innocents will suffer because of the heartlessness of the international community?"
 solomon_competition.29.o1: "We're on our own."

 solomon_competition.30.t: "Foreign Forces Arrive In [?SOL.GetName|Y]"
 solomon_competition.30.d: "Military and humanitarian resources are flowing into the country from [?SOL.RAMSI_supporter.GetName|Y]. The worst of the ethnic violence is already starting to subside as combatants become aware of the superiority of the foreign forces. The situation is still very tense and more work needs to be done to restore order."
 solomon_competition.30.o1: "A promising start"

 solomon_competition.31.t: "Disarming [?SOL.GetName|Y]"
 solomon_competition.31.d: "The government in [?SOL.RAMSI_supporter.GetName|Y] has initiated a gun buyback program in the [?SOL.GetName|Y]. There's simply no reason for such a small country to have so many weapons. The program has been a success and much of the country's population has been disarmed."
 solomon_competition.31.o1: "Destroy the guns"
 solomon_competition.31.o2: "This was a good idea"

 solomon_competition.32.t: "[?SOL.GetName|Y] Government Restored"
 solomon_competition.32.d1: "[?SOL.RAMSI_supporter.GetName|Y] has been working hard to restore the government in [?SOL.GetName|Y]. Local government buildings have been repaired and new modern technology and processes are being implemented. There is a strong focus on implementing checks and balances as exist in [?SOL.RAMSI_supporter.GetName|Y]."
 solomon_competition.32.d2: "[?SOL.RAMSI_supporter.GetName|Y] has been working hard to restore the government in [?SOL.GetName|Y]. Local government buildings have been repaired and new modern technology and processes are being implemented. The government has been remade in the eyes of [?SOL.RAMSI_supporter.GetName|Y], and politics in [?SOL.GetName|Y] may never be the same."
 solomon_competition.32.o1: "Almost there"
 solomon_competition.32.o2: "Good luck to them"
 solomon_competition.32.o3: "Uh oh."
 solomon_competition.32.o4: "Stability returns"

 solomon_competition.33.t: "[?SOL.GetName|Y] Are Saved!"
 solomon_competition.33.d: "The government in [?SOL.GetName|Y] has been restored and the violent conflict in the country has been mostly resolved, at least for now. It's time to withdraw and bring Operation RAMSI to a close."
 solomon_competition.33.o1: "Mission accomplished"

 solomon_competition.11.t: "[?SOL.GetName|Y] Connectivity Investment"
 solomon_competition.11.d: "The 21st century has brought the internet to the shores of the [?SOL.GetName|Y]. Their tiny government has approached us with a request to help lay undersea fibre-optic cable, build a small data exchange, and bring modern communications to their islands. The cost is meaningful and the return is mostly goodwill, but a connected partner in the Pacific is its own kind of asset."
 solomon_competition.11.o1: "We'll help out"
 solomon_competition.11.o2: "We're not interested"

 solomon_competition.12.t: "[?SOL.GetName|Y] Connectivity Investment"
 solomon_competition.12.d: "The [?SOL.GetName|Y] is asking us to help bring their telecom network into the 21st century. They've already been turned down by [?FROM.GetName|Y]. We have an opportunity to step in where our rival declined."
 solomon_competition.12.o1: "We'll help out"
 solomon_competition.12.o2: "We're not interested"

 solomon_competition.13.t: "[?FROM.GetName|Y] Agrees To Help"
 solomon_competition.13.d: "After negotiations, [?FROM.GetName|Y] has agreed to fund our connectivity project. Undersea cables and modern telecom infrastructure are on their way. The information age has arrived for our nation."
 solomon_competition.13.o1: "Great news!"

 solomon_competition.14.t: "Nobody Wants To Help"
 solomon_competition.14.d: "After being turned down by both [?AST.GetName|Y] and [?CHI.GetName|Y], we will have to find our own path into the digital era. It will be slower and harder, but our people will adapt."
 solomon_competition.14.o1: "We'll need to make our own way"

 solomon_competition.15.t: "The Pacific Looks Different Now"
 solomon_competition.15.d: "Three rounds of investment and intervention have reshaped the [?SOL.GetName|Y]. The competition between our regional neighbours has played out, and our future relationships with [?AST.GetName|Y] and [?CHI.GetName|Y] will be decided by what comes next."
 solomon_competition.15.o1: "The future is bright"

 solomon_competition.40.t: "Pacific Realignment"
 solomon_competition.40.d: "After two decades of competition between [?AST.GetName|Y] and [?CHI.GetName|Y] for influence in our islands, the time has come to declare a winner. One of these powers has invested more, intervened more, and earned more goodwill than the other. The [?SOL.GetName|Y] is about to enter a formal security partnership."
 solomon_competition.40.o1: "It is decided"

 solomon_competition.41.t: "A Pacific Partner"
 solomon_competition.41.d1: "After years of patient investment and the success of Operation RAMSI, the [?SOL.GetName|Y] has chosen us as its partner. A security agreement is being drafted that will see our forces deploy at their invitation, our intelligence services cooperate closely, and our radar and maritime surveillance networks extend across the South Pacific."
 solomon_competition.41.d2: "The [?SOL.GetName|Y] has formally aligned itself with [?AST.GetName|Y]. The Pacific competition has gone against us. Western intelligence and military assets will now operate freely from [?SOL.GetName|Y] territory, narrowing our reach in the region."
 solomon_competition.41.o1: "A partner secured"
 solomon_competition.41.o2: "A diplomatic loss"

 solomon_competition.42.t: "A Pacific Partner"
 solomon_competition.42.d1: "Years of investment, infrastructure projects, and the success of Operation RAMSI have paid off. The [?SOL.GetName|Y] has chosen us as its partner. A security agreement is being drafted that will see our advisors deploy at their invitation, intelligence cooperation deepen, and our maritime surveillance reach extend deep into the South Pacific."
 solomon_competition.42.d2: "The [?SOL.GetName|Y] has formally aligned itself with [?CHI.GetName|Y]. The Pacific competition has gone against us. A regional asset has slipped through our fingers, and Chinese intelligence and military assets will now operate close to our shores."
 solomon_competition.42.o1: "A partner secured"
 solomon_competition.42.o2: "A diplomatic loss"

 solomon_competition.43.t: "A Pacific Stalemate"
 solomon_competition.43.d: "Neither [?AST.GetName|Y] nor [?CHI.GetName|Y] has been able to convince the [?SOL.GetName|Y] to enter into a formal partnership. The competition concludes inconclusively. The [?SOL.GetName|Y] remains independent, suspicious of both major powers, and free to chart its own course in the Pacific."
 solomon_competition.43.o1: "The moment passed"

 SOL_finished_solomon_competition: "Competition resolved"

 # Competition - additional ideas
 SOL_idea_maritime_surveillance_programme: "Maritime Surveillance Programme"
 SOL_idea_maritime_surveillance_programme_desc: "A foreign-funded patrol fleet and a shore-based radar network now cover our exclusive economic zone. For the first time the [?SOL.GetName|Y] can see who is fishing in its waters and who is landing on its beaches, and can do something about both."
 SOL_USA_pacific_security_partner: "[?SOL.GetName|Y] Security Partnership"
 SOL_USA_pacific_security_partner_desc: "We have formalised a comprehensive security partnership with the [?SOL.GetName|Y]. Signals cooperation, a rotational presence, and a standing maritime surveillance arrangement give us a foothold in a part of the Pacific we had left to others for a generation."
 SOL_AST_pacific_partnership_accord: "[?SOL.GetName|Y] Partnership Accord"
 SOL_AST_pacific_partnership_accord_desc: "We won the argument in Honiara without ever needing to make the [?SOL.GetName|Y] a dependency. The accord is a partnership between sovereign neighbours: cooperation on policing and maritime surveillance, regular consultation, and a standing understanding that their security concerns are ours as well."
 SOL_CHI_pacific_partnership_accord: "[?SOL.GetName|Y] Partnership Accord"
 SOL_CHI_pacific_partnership_accord_desc: "We outlasted the other bidders in Honiara without having to buy the place outright. The accord is an arrangement between sovereign states: cooperation on policing and maritime surveillance, regular consultation at ministerial level, and the quiet understanding that our calls are answered first."
 SOL_USA_pacific_partnership_accord: "[?SOL.GetName|Y] Partnership Accord"
 SOL_USA_pacific_partnership_accord_desc: "We held the [?SOL.GetName|Y] against a Canberra that had changed sides, but the Compact itself was never signed. What we have instead is a working relationship: shiprider agreements, a rotational presence, and a capital that takes our calls. It is less than the instrument we wanted and considerably more than the gap we were staring at."
 SOL_AST_lost_the_near_region: "Displaced in Our Near Region"
 SOL_AST_lost_the_near_region_desc: "A rival power has signed the security arrangement we spent twenty years assuming would be ours by default. The loss is not merely the [?SOL.GetName|Y]; it is the message it sends to every other capital in the South Pacific, all of whom now understand that Canberra can be outbid."

 # Competition - additional country flags
 SOL_AST_requested_maritime_security: "Requested help with maritime security"
 SOL_CHI_requested_maritime_security: "Requested help with maritime security"
 SOL_USA_requested_maritime_security: "Requested help with maritime security"
 SOL_maritime_programme_built: "Maritime surveillance programme complete"
 SOL_comp_has_patron: "A patron was settled on in the Pacific contest"
 SOL_non_aligned_pacific_state: "Non-aligned in the Pacific contest"
 SOL_patron_test_pending: "Testing our patron's commitment"
 solomon_competition_USA_influence: "[?USA.GetName|Y] holds the most influence"
 SOL_scored_CHI_pivot_partner: "Chinese Pacific pivot partnership counted"
 SOL_scored_CHI_honiara_partner: "Chinese Honiara security pact counted"
 SOL_scored_CHI_basing_partner: "Chinese basing agreement counted"

 # Competition - additional decisions
 SOL_AST_request_maritime_security: "Ask [?AST.GetName|Y] about our waters"
 SOL_AST_request_maritime_security_desc: "Illegal fishing fleets strip our exclusive economic zone every season and we have no way of stopping them. [?AST.GetName|Y] has run patrol boat programmes across the Pacific for decades. We will ask them for a §Ymaritime surveillance programme§!."
 SOL_CHI_request_maritime_security: "Ask [?CHI.GetName|Y] about our waters"
 SOL_CHI_request_maritime_security_desc: "Illegal fishing fleets strip our exclusive economic zone every season and we have no way of stopping them. [?CHI.GetName|Y] builds patrol vessels faster and cheaper than anyone alive. We will ask them for a §Ymaritime surveillance programme§!."
 SOL_USA_request_maritime_security: "Ask [?USA.GetName|Y] about our waters"
 SOL_USA_request_maritime_security_desc: "Illegal fishing fleets strip our exclusive economic zone every season and we have no way of stopping them. [?AST.GetName|Y] no longer speaks for our region in Washington, and the Americans have taken to calling on us directly. Their coast guard has run shiprider agreements across the Pacific for years. We will ask them for a §Ymaritime surveillance programme§!."

 # Competition - shared tooltips
 solomon_competition_flip_tt: "The §YSolomon competition§! now runs [?AST.GetName|Y] and [?CHI.GetName|Y] against [?USA.GetName|Y]"
 SOL_competition_tier_preferred_tt: "The leading power in the [?SOL.GetName|Y] has reached at least §YPreferred Partner§! standing"
 SOL_competition_trailing_tt: "We are §Rnot§! currently leading the competition for the [?SOL.GetName|Y]"

 # Competition - maritime security stage
 solomon_competition.16.t: "A Request From Honiara"
 solomon_competition.16.d: "The [?SOL.GetName|Y] has asked us to fund a patrol fleet. Their exclusive economic zone covers a vast stretch of ocean that they cannot see, let alone police, and foreign trawlers work it with complete impunity. A handful of patrol boats, a shore radar station and the training to run both would change that, and would put our people inside their maritime security establishment for a generation."
 solomon_competition.16.o1: "Fund the patrol fleet"
 solomon_competition.16.o2: "We have other priorities"
 solomon_competition.17.t: "Honiara Asks Again"
 solomon_competition.17.d: "Turned down by their first choice, the [?SOL.GetName|Y] has come to us about their patrol fleet. Their position has not changed and neither has the opportunity: whoever pays for their maritime surveillance will be reading it too. That they were refused elsewhere first only makes the gratitude sweeter."
 solomon_competition.17.o1: "Fund the patrol fleet"
 solomon_competition.17.o2: "We have other priorities"
 solomon_competition.18.t: "Our Waters At Last"
 solomon_competition.18.d: "The first patrol boats have arrived in Honiara and the radar station on the northern coast came online this month. For the first time in our history we can see who is in our waters. The crews are ours, the training was theirs, and the feed goes both ways."
 solomon_competition.18.o1: "Our waters are ours again"
 solomon_competition.19.t: "No One Is Coming"
 solomon_competition.19.d: "Both of the powers that spend so much time telling us how important the Pacific is have declined to pay for a handful of patrol boats. The trawlers will be back next season, and the season after that, and we will watch them from the beach."
 solomon_competition.19.o1: "We patrol alone"
 solomon_competition.20.t: "A Suitor Pulls Ahead"
 solomon_competition.20.d: "The balance of influence in Honiara has shifted. One of the powers courting the [?SOL.GetName|Y] has built enough standing that the relationship is starting to look less like courtship and rather harder to reverse."
 solomon_competition.20.o1: "Noted in Honiara"

 # Competition - resolution, additional perspectives
 solomon_competition.41.d3: "[?AST.GetName|Y] has secured the [?SOL.GetName|Y]. Our Pacific strategy has always run through allies rather than around them, and on this occasion the arrangement worked exactly as intended: our money, their relationships, and a result that keeps the second island chain open."
 solomon_competition.41.o3: "Our partner held the line"
 solomon_competition.42.d3: "[?CHI.GetName|Y] has signed a security arrangement with the [?SOL.GetName|Y]. Our closest ally in the region was outbid in its own near neighbourhood, and there is now a gap in the second island chain that did not exist last year."
 solomon_competition.42.o3: "A gap in the second island chain"

 # Competition - the reversal
 solomon_competition.50.t: "The Pacific Contest Changes Shape"
 solomon_competition.50.d: "Our realignment towards [?CHI.GetName|Y] has consequences well beyond the bilateral relationship. In the [?SOL.GetName|Y], where we have spent years competing against Chinese money, we now find ourselves on the same side of the table as Beijing. The power that was our backer in Honiara is now the power we are competing against."
 solomon_competition.50.o1: "The contest has changed shape"
 solomon_competition.51.t: "Canberra Is No Longer Ours"
 solomon_competition.51.d: "[?AST.GetName|Y] has traded our guarantee for a Chinese one. Every assumption behind our Pacific posture rested on Australia holding the South Pacific on our behalf, and that assumption is now void. If we want the [?SOL.GetName|Y], we will have to go to Honiara ourselves, with our own money and our own compact."
 solomon_competition.51.o1: "We will contest it ourselves"
 solomon_competition.51.o2: "The Pacific is not worth the effort"
 solomon_competition.52.t: "An Unexpected Partner in the Pacific"
 solomon_competition.52.d: "[?AST.GetName|Y] has broken with Washington and the entire architecture of the South Pacific is in play. There is a choice to make in Honiara: work through Canberra, who know every minister in that government by name, or press our own advantage while the Americans are still recovering from the shock."
 solomon_competition.52.o1: "Work through Canberra"
 solomon_competition.52.o2: "Beijing prefers to deal directly"
 solomon_competition.53.t: "The Old Certainties Are Gone"
 solomon_competition.53.d: "For as long as anyone in this government can remember, the choice in front of the [?SOL.GetName|Y] was [?AST.GetName|Y] or [?CHI.GetName|Y], and everyone understood which one Washington preferred. That is no longer the shape of it. Australia and China are now speaking with something close to one voice, and it is the Americans arriving with an offer."
 solomon_competition.53.o1: "The old certainties are gone"
 solomon_competition.54.t: "The Pacific Realigned"
 solomon_competition.54.d1: "The [?SOL.GetName|Y] has chosen us, and with Beijing's blessing rather than against its resistance. The arrangement would have been unthinkable a decade ago: an Australian security partnership in the South Pacific that Washington opposed and China underwrote."
 solomon_competition.54.d2: "The [?SOL.GetName|Y] has entered a security partnership with [?AST.GetName|Y], and we helped arrange it. The second island chain has closed without a single Chinese vessel needing to be stationed there, because the power that used to hold it for the Americans now holds it with us."
 solomon_competition.54.d3: "The [?SOL.GetName|Y] has signed with [?AST.GetName|Y], and Australia is no longer ours. We have been shut out of the South Pacific by the ally we built the entire regional posture around. There is no obvious way back."
 solomon_competition.54.o1: "The Pacific on our own terms"
 solomon_competition.54.o2: "The chain is closed without a shot"
 solomon_competition.54.o3: "We have been shut out of the Pacific"
 solomon_competition.55.t: "Washington Holds Honiara"
 solomon_competition.55.d1: "The compact is signed. We went to the [?SOL.GetName|Y] directly, without an ally to front for us, and we won the argument. It cost more than it should have and it took longer than it should have, but the second island chain holds."
 solomon_competition.55.d2: "The [?SOL.GetName|Y] has signed with [?USA.GetName|Y]. We have been beaten in our own near region by the power we spent a century treating as our security guarantor and then walked away from. Every capital in the South Pacific watched it happen."
 solomon_competition.55.d3: "[?USA.GetName|Y] has secured the [?SOL.GetName|Y]. Our Australian partner could not deliver the one thing we needed from the relationship, and the Americans have re-established themselves in the South Pacific as a result."
 solomon_competition.55.o1: "The compact holds"
 solomon_competition.55.o2: "Locked out of our own near region"
 solomon_competition.55.o3: "Our partner could not deliver"

 # Competition - after the settlement
 solomon_competition.60.t: "The Relationship Is Tested"
 solomon_competition.60.d: "A dispute over logging concessions has turned into riots in the capital, and the police cannot hold the streets. The government has to decide whether to call on the partner it signed with, and find out what that signature is actually worth, or ride it out alone and keep its hands free."
 solomon_competition.60.o1: "Ask our patron for help"
 solomon_competition.60.o2: "Handle it ourselves"
 solomon_competition.61.t: "Honiara Calls In the Relationship"
 solomon_competition.61.d: "The [?SOL.GetName|Y] government has invoked our security arrangement. They want police, they want money, and they want both this month. Nobody in the region will fail to notice whether we answer, and the arrangement we spent so long securing is worth exactly as much as our response to this request."
 solomon_competition.61.o1: "Stand by our partner"
 solomon_competition.61.o2: "We have other priorities"
# END