 agriculture_1: "GPS Agriculture Applications"
 agriculture_1_desc: "The invention of GPS revolutionized travel, but we have devised a clever new way we can utilize it for our crops. We can use this new technology to help us in precision farming such as mapping field boundaries, roads, irrigation systems and problem areas. The precise mapping allows farmers to have extensive knowledge of their farm in relation to others as well as helping identifying problem areas based on GPS data."
 agriculture_2: "Automated Irrigation Systems"
 agriculture_2_desc: "Automating irrigation systems will allow less work for our agricultural workers freeing them for more prominent tasks such as maintenance, devising improvements to their crops and much much more."
 agriculture_3: "Farming Data Analytic Softwares"
 agriculture_3_desc: "Invention of new data analytic software to help analyze crop success and failure rates, rate of problems with certain pesticides and more will help boon a large amount of productivity towards our agricultural sector."
 agriculture_4: "Limited Automated Harvesting Technologies"
 agriculture_4_desc: "Installing limited automated harvesting and tending capacity will allow us to begin reducing the agricultural workforce to more heavier and more specific tasks while the mundane tasks are left to automated robots and drones that can do the light work."
 agriculture_5: "Satellite-Based Agricultural Planning"
 agriculture_5_desc: "Expanding on our GPS applications we can use satellites imaging, and other data from satellites to expand our reach and diligently plan our crop fields to ensure the most productive fields."
 agriculture_6: "Programmable Harvesters"
 agriculture_6_desc: "Installion of new software into some of our heavy farming equipment such as our combines and harvesters allowing us to program and automate their directives while the driver maintains the machine from the driver's seat will allow for additional productivity and eliminate additional maargin of error."
 agriculture_7: "Improved Harvesting Automation"
 agriculture_7_desc: "Expanding further on our limited automated harvesting machinery and installing additional capacity for automated harvesting and tending will free up even more time for our farmers and agrarian workers."
 agriculture_8: "Robotic Harvesters"
 agriculture_8_desc: "Developing and deploying robotic agrarian workers will not only help boon productivity but free up a large amount of our agriculture workforce from working in the fields and in the barns to allow them to shift to other critical industries."
 agriculture_9: "AGI Maintained Agricultural Developments"
 agriculture_9_desc: "Due to the onset and development of artificial general intelligence (AGI) we will be able to continue to automate and deploy more workers practically eliminating the need for extensive agriculture workers in our industry while continuing to maintain a massive level of food production."
 internet_1: "1G"
 internet_1_desc: "1G is the first generation of wireless mobile telecommunications. The radio signals which are transmitted in 1G networks are analog."
 internet_2: "2G"
 internet_2_desc: "2G or second generation cellular networking was commercially launched in 1991. 2G saw great improvements in encryption, more efficient use of broadband, and data services for mobile starting with the advent of SMS text messages."
 internet_3: "3G"
 internet_3_desc: "3G or the third generation of cellular networking set new standards for mobile devices and mobile telecommunications. The new generation of cellular networking supported a larger kbit/s as well as finding more applications within wireless voice telephony, mobile Internet access and mobile TV."
 internet_4: "4G"
 internet_4_desc: "4G or the fourth generation of cellular networking took the form of modern-day mobile internet access. It sees current application with mobile web access, IP telephony, gaming services and many other services on the digital accessibility. 4G has all but done away with the analogous systems from the previous generations."
 internet_5: "5G"
 internet_5_desc: "5G, the most contemporary format of cellular broadband networking, is set to begin deployment in 2019. It offers greater bandwidth, giving way to higher download speeds, eventually 10 Gbit/s. The increased bandwidth is thought to also open the possibility for general internet service providers to use it to compete with cable internet."
 internet_6: "6G"
 internet_6_desc: "6G is the future standard for broadband networking that would see the bandwidth increase to 20 Gbit/s. It would make the broadband even more applicable for major data transfer."
 internet_7: "7G"
 internet_7_desc: "7G is the future standard for broadband networking that would see the bandwidth increase to 120 Gbit/s. It would make the broadband even more applicable for major data transfer."
 internet_8: "8G"
 internet_8_desc: "8G is the future standard for broadband networking that would see the bandwidth increase to 240 Gbit/s. It would make the broadband even more applicable for major data transfer."
 internet_9: "9G"
 internet_9_desc: "9G is the future standard for broadband networking that would see the bandwidth increase to 480 Gbit/s. It would make the broadband even more applicable for major data transfer."
 internet_10: "10G"
 internet_10_desc: "10G is the future standard for broadband networking that would see the bandwidth increase to 1480 Gbit/s. It would make the broadband even more applicable for major data transfer."
 internet_11: "11G"
 internet_11_desc: "11G is the future standard for broadband networking that would see the bandwidth increase to 10240 Gbit/s. It would make the broadband even more applicable for major data transfer."
 internet_access_1: "Wi-Fi"
 internet_access_1_desc: "Wi-Fi is a family of wireless network protocols based on the IEEE 802.11 family of standards, which are commonly used for local area networking of devices and Internet access. The term 'Wi-Fi' is a trademark and is regulated by the Wi-Fi Alliance. Wi-Fi is designed to work seamlessly with its wired sibling Ethernet."
 internet_access_2: "Li-Fi"
 internet_access_2_desc: "Light fidelity (Li-Fi) is similar in function to Wi-Fi. The advantage of Li-Fi over Wi-Fi is that it can transmit data up to 100 Gbit/s and is developed by several organizations across the globe."
 internet_access_3: "Modern Satellite Internet Access"
 internet_access_3_desc: "With satellites becoming more and more prevalent in communications and other form of data transfers, the Internet is one such service that has capitalized on satellite access, which opens up the possibility for more and more people to be connected to the Internet."
