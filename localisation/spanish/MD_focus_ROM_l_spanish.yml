 ROM_romanianization_category: "Romanianization"
 ROM_romanianization_category_desc: "The lands we have taken are not yet ours in anything but name. Only once a province has come to accept Bucharest can it be made Romanian soil."
 ROM_998_return: "Romanianization of Western Banat"
 ROM_998_return_desc: "The Banat has been divided for a century. With the population reconciled to our rule, we can finish the work."
 ROM_996_return: "Romanianization of Southern Dobruja"
 ROM_996_return_desc: "Southern Dobruja was signed away at Craiova. A compliant population lets us undo that signature."
 ROM_122_return: "Romanianization of the Partium"
 ROM_122_return_desc: "The Hungarian plain will take the longest to win over, and the effort will cost us at home. It can still be done."
 romania_politics.25.t: "The Hand Against Corruption"
 romania_politics.25.d: "The task force assembled to look into graft in state contracts is ready to move. Prosecutors want a decision before the first warrants go out: strike now, or build a case that survives the appeal."
 romania_politics.25.a: "Raid without warning"
 romania_politics.25.b: "Build the case first"
 romania_politics.63.t: "Unionists March in Chisinau"
 romania_politics.63.d: "Unionist crowds fill the streets of Chisinau, urged on by Bucharest and emboldened by years of Romanian support. The government must decide whether to embrace union with Romania or to defend Moldovan statehood. Gagauzia has already made clear it will not follow Chisinau into Bucharest's arms."
 romania_politics.63.a: "Union with Romania!"
 romania_politics.63.b: "Moldova stands alone"
 romania_politics.64.t: "Moldova Rejects the Union"
 romania_politics.64.d: "Chisinau has turned back the unionist tide. Our supporters have been driven from the streets, and the Moldovan government now regards our involvement with open hostility."
 romania_politics.64.a: "A bitter setback"
 ROM_moldovan_revolution_fail_tt: "§ROur influence in Chisinau will be damaged and the Moldovan government will resent our interference§!"
