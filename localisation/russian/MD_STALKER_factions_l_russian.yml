l_russian:
 STALKER_faction_military: "военные"
 STALKER.120.t: "Война за Зону"
 STALKER.120.d: "В [STALKER_zone_name] вспыхнули бои. Стороны: [STALKER_zone_war_side_a] и [STALKER_zone_war_side_b]. Ни одна из них не может быстро победить, а каждый месяц боёв убивает сталкеров и разрушает посты периметра."
 STALKER.120.a: "Поддержать: [STALKER_zone_war_side_a]."
 STALKER.120.a_tt: "Стоит §R25§! политической власти. Влияние в Зоне: [STALKER_zone_war_side_a] §G+10§!. Пока идёт война, Зона каждый месяц теряет §R3§! сталкеров и §R3§! §Yсдерживания§!."
 STALKER.120.b: "Поддержать: [STALKER_zone_war_side_b]."
 STALKER.120.b_tt: "Стоит §R25§! политической власти. Влияние в Зоне: [STALKER_zone_war_side_b] §G+10§!. Пока идёт война, Зона каждый месяц теряет §R3§! сталкеров и §R3§! §Yсдерживания§!."
 STALKER.120.c: "Пусть сами разберутся."
 STALKER.120.c_tt: "Пока идёт война, Зона каждый месяц теряет §R3§! сталкеров и §R3§! §Yсдерживания§!. Сильнейшая к концу сторона получает §G15§! влияния, а проигравшая теряет §R25§!."
 STALKER.121.t: "Война за Зону окончена"
 STALKER.121.d_duty: "«Долг» выбил «Свободу» из её опорных пунктов в [STALKER_zone_name]. Теперь его блокпосты контролируют пути к центру."
 STALKER.121.d_freedom: "«Свобода» сломила хватку «Долга» в [STALKER_zone_name]. Пути к центру снова открыты — для всех, кто решится по ним пойти."
 STALKER.121.d_military: "Армия и силовики вычистили бандитские шайки в [STALKER_zone_name]. Выжившие разбежались или ушли на север."
 STALKER.121.d_bandits: "Бандитские шайки остановили силовиков в [STALKER_zone_name] и теперь хозяйничают на дорогах, брошенных солдатами."
 STALKER.121.a: "В Зоне новый порядок."
 STALKER_faction_ward: "«Варта»"
 STALKER_faction_spark: "«Искра»"
 STALKER.121.d_ward: "«Варта», частная армия НИИЧАЗ, сломила хватку «Искры» на подступах к станции в [STALKER_zone_name]. Теперь её патрули решают, кто дойдёт до центра и зачем."
 STALKER.121.d_spark: "«Искра» Шрама отбросила «Варту» от сердца Зоны в [STALKER_zone_name]. Её последователи говорят, что Сияющая Зона наконец близко."
 STALKER.122.t: "Падение «Чистого Неба»"
 STALKER.122.d: "«Чистое Небо», группировка, пытавшаяся понять Зону со своей базы на болотах в [STALKER_zone_name], уничтожена. Единственного выжившего, наёмника, которого остальные звали Шрамом, в последний раз видели идущим на север."
 STALKER.122.a: "Болота снова принадлежат Зоне."
 STALKER.123.t: "«Полдень»"
 STALKER.123.d: "Бойцы «Монолита», захваченные после последнего штурма в [STALKER_zone_name], очнулись от внушения. Под руководством сталкера по прозвищу Стрелец они называют себя «Полднем» и повернули оружие против бывших братьев."
 STALKER.123.a: "Враг «Монолита» нам полезен."
 STALKER_faction_noon: "«Полдень»"
 STALKER.121.d_noon: "«Полдень» Стрельца отбросил «Монолит» с его внешних позиций в [STALKER_zone_name]. Некоторые из захваченных пленных уже приходят в себя."
 STALKER.121.d_monolith: "«Монолит» разгромил «Полдень» в [STALKER_zone_name]. Выжившие перебежчики разбежались, а патрули «Монолита» снова движутся на юг."
 STALKER_tearling_leader_stalkers: "вольные сталкеры"
 STALKER_tearling_leader_ecologists: "экологи"
 STALKER_tearling_leader_bandits: "бандиты"
 STALKER.150.t: "Войны группировок"
 STALKER.150.d: "НИИЧАЗ нужны тирлинги — обычные кристаллы, которые сталкеры в [STALKER_zone_name] давно считали ничего не стоящими, — и он попросил все группировки принести их на обмен через три месяца. «Варта», «Полдень», «Искра» и даже МСОП вербуют всех сталкеров, каких только найдут, а тот, кто сдаст больше всех, получит благодарность НИИЧАЗ. Мы могли бы тайно помочь одной из группировок выйти вперёд."
 STALKER.150.a: "Поддержать вольных сталкеров."
 STALKER.150.b: "Поддержать «Долг»."
 STALKER.150.c: "Поддержать «Свободу»."
 STALKER.150.e: "Поддержать экологов."
 STALKER.150.f: "Предоставить это НИИЧАЗ."
 STALKER.150.back_tt: "Стоит §R25§! политической власти. Поддержанная нами группировка три месяца собирает на §G5§! тирлингов в месяц больше. Если она сдаст больше всех, НИИЧАЗ заплатит нам §G50§! политической власти.\nПри обмене группировка с наибольшим числом тирлингов получает §G10§! влияния, каждая участвовавшая группировка — §G3§!, а «Варта» — §G5§!."
 STALKER.150.f_tt: "Вольные сталкеры, «Долг», «Свобода», экологи и бандиты соревнуются три месяца. При обмене группировка с наибольшим числом тирлингов получает §G10§! влияния, каждая участвовавшая группировка — §G3§!, а «Варта» — §G5§!."
 STALKER.151.t: "Обмен тирлингов"
 STALKER.151.d: "НИИЧАЗ закрыл пункт обмена в [STALKER_zone_name]. Группировки сдали §Y[?global.STALKER_tearlings_total|0]§! тирлингов, больше всех — [STALKER_tearling_leader], §Y[?global.STALKER_tearlings_best|0]§!. НИИЧАЗ публично поблагодарил их и выплатил каждой группировке её долю."
 STALKER.151.d_backed: "НИИЧАЗ закрыл пункт обмена в [STALKER_zone_name]. Группировки сдали §Y[?global.STALKER_tearlings_total|0]§! тирлингов, больше всех — [STALKER_tearling_leader], поддержанная нами группировка, §Y[?global.STALKER_tearlings_best|0]§!. НИИЧАЗ выплатил каждой группировке её долю, а нам — §G50§! политической власти за помощь."
 STALKER.151.a: "Пусть НИИЧАЗ изучает свои кристаллы."