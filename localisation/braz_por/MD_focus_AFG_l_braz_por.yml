 AFG_support_afghan_counter_insurgency_tt: "§YDesbloqueia decisões de insurgência do Talibã§!\n§YTaliban§! Será ambientado em uma §YGuerra Estática§!"
 isaf_raid_taliban_success_tt: "\nAs §Ychances de sucesso§! são §Rinfluenciadas§! pela §Yconfiança pública no governo afegão§! já que não podemos executar esta missão sem coordenação com o §YGoverno Afegão§! e §Yseu exército§!."
