 MD_sftc_exercise_ranger: "레인저 평가 훈련"
 MD_sftc_exercise_ranger_desc: "레인저들이 장거리 정찰, 항법, 누적된 피로 속의 소부대 전술을 중심으로 짜인 선발 및 평가 과정을 거칩니다."
 MD_sftc_ex_ranger_short: "90일간 특수 레인저 연대 숙련도."
 MD_sftc_exercise_marine: "상륙 습격 훈련"
 MD_sftc_exercise_marine_desc: "특수 해병 분견대가 수상정과 소형 보트를 사용해 방어가 갖춰진 해안선을 향한 해상 습격을 예행 연습합니다."
 MD_sftc_ex_marine_short: "90일간 특수 해병 부대 숙련도."
 MD_sftc_exercise_airborne: "공수 침투 훈련"
 MD_sftc_exercise_airborne_desc: "공수 중대가 낙하산과 수송기를 이용한 야간 침투를 연습한 뒤 집결하여 목표 지점으로 이동합니다."
 MD_sftc_ex_airborne_short: "90일간 공수 중대 숙련도."
 MD_sftc_exercise_joint: "합동 특수 작전 훈련"
 MD_sftc_exercise_joint_desc: "레인저, 해병, 공수 분견대가 하나의 특수 작전 사령부 아래에서 훈련하며 육해공을 넘나드는 통합 시나리오로 싸웁니다."
 MD_sftc_ex_joint_short: "90일간 특수 작전 숙련도."
 MD_sftc_exercise_air_assault: "공중 강습 습격"
 MD_sftc_exercise_air_assault_desc: "레인저가 헬리콥터와 수송기로 전개해 전선 후방의 목표를 점령하고 확보한 뒤 공중 엄호 아래 철수합니다."
 MD_sftc_ex_air_assault_short: "90일간 보조 특수 부대 숙련도."
 MD_sftc_exercise_littoral: "연안 레인저 훈련"
 MD_sftc_exercise_littoral_desc: "레인저가 보트와 함포 지원을 활용해 해안 접근로, 하천, 섬에서 바다로부터 작전하며 내륙 표적에 도달하는 훈련을 합니다."
 MD_sftc_ex_littoral_short: "90일간 보조 특수 부대 숙련도."
 MD_sftc_exercise_envelopment: "수직 포위 훈련"
 MD_sftc_exercise_envelopment_desc: "해병과 공수 중대가 바다와 하늘에서 동시에 같은 목표를 타격하여 방어군의 예비대를 분산시킵니다."
 MD_sftc_ex_envelopment_short: "90일간 보조 특수 부대 숙련도."
 MD_sftc_school_name: "특수 작전 훈련 프로그램"
 MD_sftc_school_short: "특수 작전 학교를 해금하고 훈련 효과를 강화합니다."
 MD_sftc_school_level_text: "레벨 [?ROOT.MD_sftc_school_level|0]/3"
 MD_sftc_insertion_name: "원정 침투 프로그램"
 MD_sftc_insertion_short: "침투 준비 태세를 해금합니다."
 MD_sftc_insertion_level_text: "레벨 [?ROOT.MD_sftc_insertion_level|0]/3"
 MD_sftc_command_name: "특수 작전 사령부 프로그램"
 MD_sftc_command_short: "특수 작전 사령부를 해금합니다."
 MD_sftc_command_level_text: "레벨 [?ROOT.MD_sftc_command_level|0]/3"
 MD_sftc_qualification_name: "특수 부대 자격 과정"
 MD_sftc_qualification_short: "육군 지휘관 한 명이 특수 부대 특성을 얻을 수 있습니다."
 MD_sftc_qualification_cooldown: "특수 부대 자격 과정 진행 중"
 MD_sftc_qualification_cooldown_desc: "선발된 장교들이 특수 부대 자격 과정을 이수하고 있습니다. 이번 과정이 수료되면 다음 과정이 시작됩니다."
 MD_sftc_joint_course_name: "합동 특수 작전 과정"
 MD_sftc_joint_course_short: "모든 특수 부대 지휘관이 경험치를 얻습니다."
 MD_sftc_joint_course_cooldown: "합동 특수 작전 과정 진행 중"
 MD_sftc_joint_course_cooldown_desc: "모든 군 소속 특수 부대 장교들이 합동 특수 작전 과정에서 함께 훈련하고 있습니다. 이번 기수가 수료하면 새 과정을 시작할 수 있습니다."
 MD_sftc_school_1: "특수 작전 학교 I"
 MD_sftc_school_1_desc: "상설 특수 작전 학교가 후보자를 선발·훈련하고 전술을 표준화하여 새 특수 부대를 편성하는 데 필요한 시간을 단축합니다."
 MD_sftc_school_2: "특수 작전 학교 II"
 MD_sftc_school_2_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_school_3: "특수 작전 학교 III"
 MD_sftc_school_3_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_insertion_1: "침투 준비 태세 I"
 MD_sftc_insertion_1_desc: "상시 절차와 전용 수송 자산 덕분에 특수 부대는 단시간 내에 해상과 공중으로 전개할 준비를 갖추고 있습니다."
 MD_sftc_insertion_2: "침투 준비 태세 II"
 MD_sftc_insertion_2_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_insertion_3: "침투 준비 태세 III"
 MD_sftc_insertion_3_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_command_1: "특수 작전 사령부 I"
 MD_sftc_command_1_desc: "통합 특수 작전 사령부가 군 전체에 걸친 임무를 계획·통제하고 전방 부대에 확실한 지원과 명확한 권한을 부여합니다."
 MD_sftc_command_2: "특수 작전 사령부 II"
 MD_sftc_command_2_desc: "$MD_sftc_command_1_desc$"
 MD_sftc_command_3: "특수 작전 사령부 III"
