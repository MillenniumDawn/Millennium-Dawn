 AA_upgrade_8: "Chercheurs adaptatifs assistés par l'IA"
 AA_upgrade_8_desc: "Les autodirecteurs adaptatifs assistés par IA utilisent une fusion de capteurs avancée et une discrimination de cibles en temps réel pour maintenir le verrouillage contre des menaces aériennes plus furtives, plus froides et plus rapides dans un espace aérien fortement contesté."
 nsb_AA_upgrade_8: "Chercheurs adaptatifs assistés par l'IA"
 nsb_AA_upgrade_8_desc: "Les autodirecteurs adaptatifs assistés par IA utilisent une fusion de capteurs avancée et une discrimination de cibles en temps réel pour maintenir le verrouillage contre des menaces aériennes plus furtives, plus froides et plus rapides dans un espace aérien fortement contesté."
 AT_upgrade_8: "Munitions antiblindées adaptatives"
 AT_upgrade_8_desc: "Les munitions anti-blindage adaptatives utilisent reconnaissance de cible assistée par IA, fusion de capteurs, logique de salve coordonnée et ogives programmables pour vaincre des véhicules lourdement protégés sur des champs de bataille saturés de capteurs."
 augmented_vision_3: "Prise en charge de la vision IA"
 augmented_vision_3_desc: "La vision augmentée de troisième génération intègre des superpositions thermiques et infrarouges en temps réel directement dans le viseur tête haute du soldat, améliorant nettement la détection des menaces en faible visibilité."
 augmented_vision_4: "Analyse de vision lointaine avancée"
 augmented_vision_4_desc: "La reconnaissance d'objets assistée par IA permet à la visière de classer automatiquement cibles, alliés et dangers. Le partage de données au niveau de l'escouade fait que chaque soldat bénéficie de ce que voit n'importe quel membre de l'équipe."
 augmented_vision_5: "Profondeur multispectrale"
 augmented_vision_5_desc: "La réalité augmentée pleinement en réseau superpose données de terrain, flux de drones et modélisation prédictive des menaces au champ de vision de chaque soldat, transformant la conscience individuelle en tableau opérationnel partagé."
 augmented_vision_6: "Vision neuro-liée"
 augmented_vision_6_desc: "Les systèmes de vision liés au neural contournent entièrement l'optique traditionnelle, projetant les données capteurs directement vers le cortex visuel de l'opérateur. Le résultat est une conscience situationnelle quasi instantanée sur tout le spectre électromagnétique."
 afs_drone_2: "Drone d'appui-feu autonome II"
 afs_drone_2_desc: "Les drones d'appui-feu améliorés opèrent en équipes en réseau, partageant les données capteurs avec infanterie, blindés et artillerie pour identifier les menaces, supprimer les positions ennemies et soutenir les avancées en terrain contesté."
 afs_drone_3: "Drone d'appui-feu autonome III"
 afs_drone_3_desc: "Les drones d'appui-feu avancés utilisent communications résilientes, reconnaissance de cibles embarquée et coordination d'essaim limitée pour maintenir la surveillance, relayer les données du champ de bataille et délivrer un appui-feu rapide sous commandement humain."
 afs_drone_4: "Drone d'appui-feu autonome IV"
 afs_drone_4_desc: "Les systèmes d'appui drones intégrés combinent plateformes robotiques aériennes et terrestres en équipes de feu coordonnées, permettant aux unités de manœuvre de couvrir les flancs, exposer les embuscades et frapper des cibles durcies avec moins d'exposition des troupes."
 afs_drone_5: "Drone d'appui-feu autonome V"
 afs_drone_5_desc: "Les réseaux d'appui-feu autonomes futurs utilisent essaims dirigés par IA, ciblage coopératif et routage adaptatif du champ de bataille pour fournir reconnaissance persistante, suppression et feux de précision à travers les formations terrestres régulières."
 special_forces_tech_7: "Futures forces spéciales II"
 special_forces_tech_7_desc: "Les forces spéciales futures améliorées utilisent le teaming homme-machine, des systèmes de reconnaissance autonomes et une planification de mission assistée par IA pour accroître la conscience, réduire l'exposition et coordonner des raids complexes sur plusieurs domaines."
 special_forces_tech_8: "Forces spéciales hyper-avancées"
 special_forces_tech_8_desc: "Les forces spéciales hyperavancées combinent camouflage adaptatif, plateformes d'appui robotiques, réseaux de champ de bataille résilients et équipement d'opérateur amélioré pour mener des opérations profondes contre des adversaires technologiquement avancés."
 special_forces_tech_9: "Forces spéciales II hyper-avancées"
 special_forces_tech_9_desc: "De nouvelles avancées en opérations spéciales mettent l'accent sur équipes distribuées, essaims de drones, appui de guerre électronique et fusion de capteurs en temps réel, permettant aux opérateurs de frapper, d'échapper et de survivre dans des espaces de bataille fortement surveillés."
 special_forces_tech_10: "Forces spéciales ultra-avancées"
 special_forces_tech_10_desc: "Les forces spéciales ultra-avancées utilisent des systèmes d'appui coordonnés par IA, une logistique autonome, des outils de commandement en réalité augmentée et un suivi médical avancé pour soutenir des opérations d'élite bien au-delà des réseaux d'appui traditionnels."
 special_forces_tech_11: "Forces spéciales II ultra-avancées"
 special_forces_tech_11_desc: "Les forces spéciales les plus avancées opèrent comme des équipes homme-machine en réseau, combinant entraînement d'élite, systèmes autonomes, effets cyber et renseignement prédictif pour mener des opérations précises dans des environnements hostiles saturés de capteurs."
 body_armor_5: "Combinaison d'assaut tactique renforcée"
 body_armor_5_desc: "Les avancées en composites de nanomatériaux produisent des plaques nettement plus légères et plus dures que les solutions céramiques précédentes. Des systèmes modulaires à couverture complète protègent désormais les extrémités sans réduire vraiment la mobilité."
 body_armor_6: "Combinaison d'assaut de pointe"
 body_armor_6_desc: "L'armure intelligente tisse capteurs d'impact et couches réactives dans le tissu du gilet, permettant aux sections de se raidir au contact et de mieux répartir l'énergie cinétique. Un suivi biométrique intégré alerte les médecins des blessés en temps réel."
 body_armor_7: "Intégration de la combinaison IA"
 body_armor_7_desc: "Le placage renforcé au graphène offre des rapports dureté/poids inédits, arrêtant des munitions perforantes à haute vitesse qui auraient pénétré les générations antérieures. Des systèmes de refroidissement actifs embarqués dans la combinaison gardent les opérateurs efficaces sous climats extrêmes."
 body_armor_8: "Combinaison hyper avancée"
 body_armor_8_desc: "L'armure réactive motorisée utilise des micro-actionneurs embarqués pour dévier activement les projectiles à l'impact. Combinée à des couches traumatiques auto-obturantes, la survie face aux menaces du champ de bataille atteint des niveaux autrefois réservés aux véhicules légers."
 body_armor_9: "Combinaison ultra avancée"
 body_armor_9_desc: "L'armure adaptative intégrale intègre durcissement électromagnétique, composites balistiques et filtration chimique-biologique en un seul système étanche. Le soldat est effectivement enfermé dans un véhicule de combat personnel."
 exoskeleton_3: "Combinaison d'opérations améliorées"
 exoskeleton_3_desc: "Les exosquelettes de troisième génération sont assez légers pour un usage prolongé sur le terrain par l'infanterie standard. Actionneurs améliorés et endurance des batteries permettent aux soldats de porter armes lourdes et armure supplémentaire sans pénalité de fatigue."
 exoskeleton_4: "Exosquelette hyper avancé"
 exoskeleton_4_desc: "La prédiction de mouvement pilotée par IA fait que la combinaison se sent comme une extension naturelle du corps de l'opérateur, permettant sprint, escalade et combat rapproché à des vitesses qu'aucun soldat non augmenté ne peut égaler. Des cellules d'énergie intégrées soutiennent des opérations de plusieurs jours sans recharge."
 exoskeleton_5: "Exosquelette ultra avancé"
 exoskeleton_5_desc: "L'évolution finale des exosquelettes motorisés brouille la ligne entre infanterie et véhicule blindé. Contrôle par interface neurale, composites structurels auto-réparants et supports d'armes embarqués produisent une plateforme à un opérateur capable d'engager des menaces autrefois réservées aux unités de blindés dédiées."
 camouflage_6: "Camouflage thermique actif"
 camouflage_6_desc: "Le camouflage thermique actif utilise des matériaux de surface contrôlables et des couches de gestion de la chaleur pour modifier les émissions infrarouges, permettant aux véhicules blindés et à l'infanterie équipée de mieux se fondre dans leur environnement thermique."
 camouflage_7: "Camouflage de tromperie par capteur"
 camouflage_7_desc: "Le camouflage de déception capteurs combine matériaux multispectraux, rupture de forme et contrôle de signature électronique pour tromper drones, optiques de visée, capteurs assistés radar et systèmes de reconnaissance automatisés."
 camouflage_8: "Camouflage adaptatif intégré"
 camouflage_8_desc: "Le camouflage adaptatif intégré relie matériaux intelligents, régulation thermique, contrôle de motif visuel et données capteurs du champ de bataille pour réduire en continu la signature détectable de l'infanterie, des véhicules et de l'équipement sur plusieurs types de capteurs."
 mbt_tech_5: "Châssis blindé hyper-avancé"
 mbt_tech_5_desc: "Châssis de véhicules blindés hyper-avancés."
 mbt_tech_6: "Châssis blindé ultra-avancé"
 mbt_tech_6_desc: "Châssis de véhicules blindés ultra-avancés."
 tank_components_tech_6: "Systèmes informatiques embarqués hyper-avancés"
 tank_components_tech_6_desc: "Visualisation 3D, champ de bataille virtuel, technologies et systèmes de communication de pointe et algorithmes de détection améliorés nous permettront d'améliorer notre technologie de destruction dure."
 tank_components_tech_7: "Systèmes informatiques embarqués ultra-avancés"
 tank_components_tech_7_desc: "Visualisation 3D, champ de bataille virtuel, technologies et systèmes de communication de pointe et algorithmes de détection améliorés nous permettront d'améliorer notre technologie de destruction dure."
 era_tech_5: "ERA de 5e génération"
 era_tech_5_desc: "Forme très avancée d'ERA, capable d'opérer dans diverses conditions environnementales et de réduire l'efficacité de la plupart des tirs entrants."
 era_tech_6: "ERA de 6e génération"
 era_tech_6_desc: "Forme la plus avancée d'ERA, capable d'opérer dans diverses conditions environnementales et de réduire l'efficacité de la plupart des tirs entrants."
 armor_tech_5: "Armure hyper avancée"
 armor_tech_5_desc: "Améliorations d'armure très sophistiquées."
 armor_tech_6: "Armure ultra avancée"
 armor_tech_6_desc: "Améliorations d'armure très sophistiquées."
 nera_armor_tech_4: "NERA de 4e génération"
 nera_armor_tech_4_desc: "Blindage réactif non explosif (NERA) avancé utilisant des matériaux de pointe et des configurations innovantes, offrant une défense supérieure contre un large éventail de menaces."
 nera_armor_tech_5: "NERA de 5ème génération"
 nera_armor_tech_5_desc: "Blindage réactif non explosif (NERA) avancé utilisant des matériaux de pointe et des configurations innovantes, offrant une défense supérieure contre un large éventail de menaces."
 diesel_engine_tech_8: "Moteur diesel hyper-avancé"
 diesel_engine_tech_8_desc: "Avec les progrès de l'efficacité énergétique, du contrôle moteur informatisé et des matériaux avancés, les moteurs futurs peuvent être à la fois puissants et légers."
 diesel_engine_tech_9: "Moteur diesel ultra-avancé"
 diesel_engine_tech_9_desc: "Avec les progrès de l'efficacité énergétique, du contrôle moteur informatisé et des matériaux avancés, les moteurs futurs peuvent être à la fois puissants et légers."
 tech_tank_nuclear_engine_3: "Moteur de réservoir nucléaire IV"
 tech_tank_nuclear_engine_3_desc: "Les conceptions de réacteurs modulaires compacts réduisent drastiquement le poids du blindage tout en améliorant l'efficacité thermique, rendant les véhicules nucléaires viables pour un plus large éventail de châssis. Des systèmes de sécurité automatisés et des modules de combustible interchangeables sur le terrain simplifient l'entretien en zone avancée."
 tech_tank_nuclear_engine_4: "Moteur de réservoir nucléaire V"
 tech_tank_nuclear_engine_4_desc: "Les microréacteurs de quatrième génération atteignent des intervalles d'entretien quasi nuls et génèrent assez de puissance excédentaire pour alimenter simultanément armes à énergie dirigée et systèmes de défense active. Les formations blindées ainsi équipées opèrent indéfiniment sans lignes de ravitaillement, remodelant fondamentalement la planification opérationnelle."
 turbine_engine_tech_7: "Moteur exosquelettique avancé"
 turbine_engine_tech_7_desc: "Avec des matériaux avancés, le frottement dans la turbine à gaz peut être réduit, permettant une meilleure puissance et une meilleure efficacité énergétique."
 turbine_engine_tech_8: "Moteur exosquelettique de pointe"
 turbine_engine_tech_8_desc: "Avec des matériaux avancés, le frottement dans la turbine à gaz peut être réduit, permettant une meilleure puissance et une meilleure efficacité énergétique."
 electric_engine_tech_5: "Moteur électrique avancé"
 electric_engine_tech_5_desc: "Version améliorée du moteur électrique, avec une meilleure fiabilité."
 electric_engine_tech_6: "Moteur électrique de pointe"
 electric_engine_tech_6_desc: "Version améliorée du moteur électrique, avec une meilleure fiabilité."
 defensive_systems_6: "Systèmes défensifs avancés"
 defensive_systems_6_desc: "La prochaine génération de technologies défensives, axée sur l'amélioration de la survivabilité de nos véhicules par des mesures défensives avancées."
 defensive_systems_7: "Systèmes défensifs de pointe"
 defensive_systems_7_desc: "La prochaine génération de technologies défensives, axée sur l'amélioration de la survivabilité de nos véhicules par des mesures défensives avancées."
 tank_ammo_1: "Munitions du début de la guerre froide"
 tank_ammo_1_desc: "Munitions développées au début de la guerre froide, conçues pour engager efficacement diverses cibles sur le champ de bataille. Ces obus offrent un équilibre entre pénétration et fragmentation, adaptées aux scénarios de combat de l'époque."
 tank_ammo_2: "Munitions de la guerre froide"
 tank_ammo_2_desc: "Munitions conçues pendant la guerre froide pour contrer un large éventail de menaces. Ces obus offrent une pénétration et une fragmentation améliorées, leur permettant d'engager efficacement infanterie et cibles blindées dans les scénarios de l'époque."
 tank_ammo_3: "Munitions modernes"
 tank_ammo_3_desc: "Munitions de pointe développées pour la guerre moderne. Ces obus intègrent des technologies avancées pour une pénétration, une fragmentation et un effet de zone renforcés, assurant une efficacité maximale contre diverses cibles."
 tank_ammo_4: "Munitions améliorées"
 tank_ammo_4_desc: "Munitions innovantes conçues pour le proche avenir. Ces obus utilisent des technologies de pointe pour une pénétration, une fragmentation et un effet de zone supérieurs, assurant des performances optimales contre des menaces évolutives."
 tank_ammo_5: "Munitions avancées"
 tank_ammo_5_desc: "Munitions révolutionnaires conçues pour un avenir lointain. Ces obus intègrent des technologies inédites pour une pénétration, une fragmentation et un effet de zone sans égal, assurant un impact dévastateur même contre les cibles les plus avancées du champ de bataille futur."
 tank_ammo_6: "Munitions très avancées"
 tank_ammo_6_desc: "Munitions révolutionnaires conçues pour un avenir lointain. Ces obus intègrent des technologies inédites pour une pénétration, une fragmentation et un effet de zone sans égal, assurant un impact dévastateur même contre les cibles les plus avancées du champ de bataille futur."
 tank_ammo_7: "Munitions de pointe"
