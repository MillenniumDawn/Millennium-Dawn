 PER_ahmadinejad_name: "마무드 아마디네자드"
 PER_ahmadinejad_modifiers: "§Y카리스마:§!\n 전쟁 지지도: §G+2.00%§!\n 건설 속도: §G+10.00%§!\n§Y강경파:§!\n  친서방 외교의 수용: §R-30§!\n  일간 신흥국 지지: §G0.20§!\n§Y원칙주의자 정당의 후원:§!\n  정치력 획득: §G+5%§!"
 PER_ahmadinejad_bio: "Born 28 October 1956 near Garmsar in the Semnan province is an Iranian principalist and Nationalist politician. His father changed the family name from Saborjhian to Ahmadinejad in 1960 to avoid discrimination. In 1976, Ahmadinejad took Iran´s national university entrance examination, and according to his autobiography, he ranked 132 out of 400.000 participants in that year. He enrolled in IUST, located in Tehran, to study Civil Engineering. He was serving as the governor of the Ardabil Province, but he lost the position in the same year due to the policies of Mohammad Khatami."
 PER_hemmati_name: "압돌나세르 헴마티"
 PER_hemmati_modifiers: "§Y개혁주의자의 후원:§!\n 정치력 획득: §G+5%§!\n§Y친서방:§!\n  일간 친서방 지지: §R+0.20§!\n 친서방 외교의 수용: §G+20§!\n§Y경제적 자유:§!\n  법인세 세입 변동치: §G+5.00%§!\n  사무지구 건설 속도: §G15.00%§!"
 PER_hemmati_bio: "Born 9 April 1956 in Kabudarahang, province of Hamadan is a Politician and Economist. In 1978, Hemmati received a bachelor's degree in economics in the University of Tehran, he also obtained a Master's in the same university. He completed an advanced audit course in the Coopers and Lybrand Institute, also studying Economy in London. He finished his studies with a PhD in the University of Tehran. He was in charge of the news and the organization of television of Iran, turning himself into a politician in the process. He was in charge of all the war propaganda during the Iran-Iraq war."
 PER_khatami_name: "모하메드 카타미"
 PER_khatami_modifiers: "§Y문화적 자유:§!\n  일간 친서방 지지: §R+0.10§!\n  안정도: §R-5.00%§!\n§Y라프산자니의 후원:§!\n  정치력 획득: §G+10%§!\n§Y경제적 자유l:§!\n  경기 순환 업그레이드 비용 변동치: §G-15.00%§!\n  세입 변동치: §G+10.00%§!"
 PER_khatami_bio: "모하마드 하타미는 1943년 10월 14일 야즈드 주 아르다칸에서 태어났습니다. 그는 사이이드의 칭호를 가지고 있습니다. 이란의 개혁주의 정치인입니다. 모하마드 하타미는 이스파한 대학교에서 서양 철학 학사 학위를 받았으나, 테헤란 대학교에서 교육학 석사 과정을 밟던 중 학계를 떠나 이전에 하던 이슬람 학문 공부를 마치기 위해 곰으로 갔습니다. 그곳에서 7년간 공부하며 이즈티하드라는 최고 단계의 과정을 마쳤습니다. 그 후 그는 1978년부터 1980년까지 함부르크의 이슬람 센터 소장을 맡기 위해 잠시 독일에 정착하였습니다."
 PER_rafsanjani_name: "악바르 하셰미 라프산자니"
 PER_rafsanjani_modifiers: "§Y실세:§!\n  일간 정치력 획득: §G+0.1§!\n§Y개혁주의자의 상징:§!\n  정치력 획득: §G+5%§!\n  일간 친서방 지지: §R+0.10§!\n§Y경제적 자유:§!\n  사무지구 건설 속도: §G10.00%§!\n  조세 비용: §G-2.00§!\n"
 PER_rafsanjani_bio: "아크바르 하셰미 라프산자니는 1934년 8월 25일 케르만 주 라프산잔 시 인근의 바흐레만에서 태어난 정치인이자 작가이며 이슬람 공화국의 건국 아버지 중 한 명입니다. 그는 14세에 신학을 공부하기 위해 집을 떠나 곰으로 갔고, 훗날 이슬람 공화국의 창건자가 될 아야톨라 루홀라 호메이니의 사상을 접하게 되었습니다."
 PER_raisi_name: "에브라힘 라이시"
 PER_raisi_modifiers: "§Y사법부의 수장:§!\n  안정도: §G+2.00%§!\n  행정 비용 변동치: §G-10.00%§!\n  이념 변화 방어: §G10.0%§!\n§Y원칙주의자들의 후원:§!\n  정치력 획득: §G+5%§!\n§Y주택 개발:§!\n  민간 공장 건설 속도: §G+15.00%§!\n  건설 속도: §R-5.00%§!\n  개인세 수입 변동치: §R-5.00%§!\n"
 PER_raisi_bio: "1960년 12월 14일 마슈하드의 노간 구에서 태어나 성직자 집안에서 자랐으며 테헤란의 한 학교에서 공부를 시작하였습니다. 이후 하우자에서 공부를 시작했고, 1975년 15세의 나이에 곰 신학교에서 교육을 이어가기 위해 아야톨라 보루제르디 학교에서 학업을 시작하여 모타하리 대학교에서 사법 박사 학위를 취득하였습니다."
 PER_rouhani_name: "하산 로우하니"
 PER_rouhani_modifiers: "§Y친서방:§!\n  친서방 외교의 수용: §G+30§!\n  일간 친서방 지지: §R+0.10%§!\n§Y개혁주의자들의 후원:§!\n  정치력 획득: §G+10%§!\n§Y경제 개혁주의자:§!\n  안정도: §R-2.00%§!\n  사무지구 건설 속도: §G20.00%§!\n  민간 공장 건설 속도: §G15.00%§!\n  경제 순환에 드는 비용 변동치: §R+10.00%§!\n§Y이슬람 혁명 수비대에 대항:§!\n  전쟁 지지도t: §R-7.00%§!"
 PER_rouhani_bio: "1948년 11월 12일 셈난 주 소르헤의 독실한 페르시아인 가정에서 태어났습니다. 그는 작은 마을에서 자랐으며, 그곳에서 특히 샤에 반대하는 정치 활동을 한 것으로 처음 보고되었습니다. 그는 1979년 혁명 이전에 스무 번가량 체포되었습니다. 그는 1960년에 종교 공부를 시작하였습니다. 1969년 테헤란 대학교에 입학하여 1972년 사법 학사 학위를 받았습니다. 이후 그는 이란-이라크 전쟁에 복무하였습니다. 복무를 마친 후 로하니는 스코틀랜드의 글래스고 칼레도니안 대학교에서 학업을 이어갔습니다."
 PER_tavakoli_name: "아마드 타와콜리"
 PER_tavakoli_modifiers: "§Y국회의원:§!\n  정치력 획득: §G+5%§!\n§Y전 사회노동부 장관:§!\n  세입 변동치: §G+10.00%§!\n§Y전 정부 대변인:§!\n  매일 정치력: §G+0.1§!\n§Y기타 원칙주의 정당과의 독립:§!\n  이념 변화 방어: §R-20.0%§!"
 PER_tavakoli_bio: "아마드 타와클리는 1952년 베흐샤르에서 태어났으며, 차르 통치 말기 코카서스 및 러시아와 무역 관계를 맺고 있던 상인의 아들입니다. 1970년 그는 전기공학을 공부했으나 파업으로 인해 졸업하기 전에 퇴학당하였습니다. 학부 과정을 마친 후 그는 1997년 영국 노팅엄 대학교에서 \\"이란 경제의 인플레이션 원인, 1972-1990\\"이라는 제목의 논문으로 경제학 박사 학위를 받았습니다. 1998년 이란으로 돌아온 후 그는 파르다 신문을 창간하였습니다."
 PER_mousavi_name: "미르호세인 무사비"
 PER_mousavi_modifiers: "§Y라프산자니의 꼭두각시:§!\n  안정도: §R-2.00%§!\n  정치력 획득: §R-5%§!\n§Y건축가:§!\n  민간 공장 건설 속도: §G15.00%§!\n  프로젝트 비용 변동치: §G-5.00%§!\n§Y자유주의:§!\n  일간 친서방 지지: §G+0.10§!"
 PER_mousavi_bio: "1942년 3월 2일 동아제르바이잔의 하메네에서 태어났습니다. 무사비는 1969년 테헤란 대학교에서 건축학 학사 학위를 받았습니다. 대학생 시절 그는 좌익 이슬람 학생 협회에서 활발하게 활동했으며 이란 자유 운동과 긴밀한 관계를 맺고 있었습니다. 무사비는 이란 혁명에서 큰 역할을 하였습니다. 그는 무장 운동에도 적극 참여하였습니다. 샤 정권이 무너지자 무사비는 모하마드 베헤슈티가 1979년 이슬람 공화당을 창당하는 것을 도와 이란의 이슬람 공화국 수립에 기여하였습니다."
 PER_ghalibaf_name: "모하메드 바게르 갈리바프"
 PER_ghalibaf_modifiers: "§YMilitary:§!\n  Production Efficiency Cap: §G+5.00%§!\n  Production Efficiency growth: §G+5.00%§!\n§YApproved by Principalists:§!\n  Political Power Gain: §G+5%§!\n§YFormer police chief:§!\n  Police Cost Multiplier: §G-7.00%§!"
 PER_ghalibaf_bio: "모하마드 바게르 갈리바프는 이란의 보수주의 정치인이자 전직 군 장교입니다. 그는 1961년 8월 23일 마슈하드 인근 토르가베에서 페르시아인 어머니와 쿠르드인 아버지 사이에서 태어났습니다. 갈리바프는 테헤란 대학교에서 인문지리학 학사 학위를, 이슬람 아자드 대학교에서 인문지리학 석사 학위를, 타르비아트 모다레스 대학교에서 정치지리학 박사 학위를 받았습니다. 19세에 그는 이란-이라크 전쟁에서 지휘관이었습니다. 전쟁이 끝난 후 그는 지정학 석사 학위를 취득한 뒤 소장 학위를 받았습니다."
 PER_rezaee_name: "모셴 레자이"
 PER_rezaee_modifiers: "§Y경제학자:§!\n  건설 속도: §G+5.00%§!\n  경제 순환에 드는 비용 변동치: §G-5.00%§!\n  세입 변동치: §G+5.00§!\n§Y이슬람 혁명 수비대와의 유착 관계:§!\n  민간 공장 건설 속도: §G10.00%§!\n  기본 생산 효율: §R-15.00§!\n§Y강경파:§!\n  매일 신흥국 지지: §G+0.20§!\n§Y당내 반대파:§!\n  정치력 획득: §R-10%§!"
 PER_rezaee_bio: "1954년 9월 9일 마스제드 솔레이만에서 독실한 가정에 태어났습니다. 1969년 그는 NIOC 소유의 학교에서 공부를 시작할 예정이었으나 아흐바즈 시로 이주하여 샤 정권에 맞선 투쟁을 시작하였습니다. 17세에 투옥되었고, 마침내 25세에 이란 대학교에서 기계공학을 공부하기 시작하였습니다. 그는 IRGC에 가입하여 정보 부문의 책임자로 임명되었고, 결국 IRGC 총사령관의 자리까지 올랐습니다. 전쟁이 끝난 후 그는 테헤란 대학교에서 경제학 공부로 전향하였습니다."
