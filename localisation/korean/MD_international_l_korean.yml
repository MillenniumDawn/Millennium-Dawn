 is_ct_exploit_intel_tt: "수집한 정보를 활용하여 짧은 기간 동안 §Y[name_of_org_disp]§!에 대한 §Y정보 정확도§!를 더 크게 높여 주며, 작전상 쓸모가 없어질 때까지 매월 감소합니다."
 is_ct_infil_agent_tt: "§Y[name_of_org_disp]§!에 요원을 침투시키려 시도합니다. 성공하면 우리의 §Y정보 정확도§!가 영구적으로 상승합니다. 침투에 실패하면 짧은 기간 동안 우리의 §Y정보 정확도§!가 저하되고 §Y[name_of_org_disp]§!의 §R테러 위협 수준§!이 상승합니다.\n\n침투 시도의 성공 확률은 우리의 §Y정보 정확도§!와 전반적인 §Y정보기관§! 요원 훈련에 따라 달라집니다."
 is_ct_asset_seizure_tt: "자산을 압류하면 §Y[name_of_org_disp]§!의 §R테러 위협 수준§!이 낮아지지만, 짧은 기간 동안 §Y[name_of_org_disp]§!에 대한 §Y정보 정확도§!를 얻기가 더 어려워집니다."
 is_ct_arrest_sympathizers_tt: "동조자를 체포하면 §Y[name_of_org_disp]§!의 §R테러 위협 수준§!이 낮아지고 §Y[name_of_org_disp]§!에 대한 §Y정보 정확도§!도 높아집니다. 그러나 무고한 사람들이 체포에 휘말릴 수 있으며, 그럴 경우 정치적 반발에 직면할 수 있습니다.\n\n체포의 효과는 우리의 §Y정보 정확도§!와 §Y정보기관§!의 방첩 및 대테러 업그레이드에 따라 달라집니다.\n"
