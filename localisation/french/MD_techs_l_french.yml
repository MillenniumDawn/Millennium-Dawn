 module_sub_esm_2_desc: "Les Mesures de Soutien Électronique (MES en abrégé) comprennent les actions de détection, d'interception, d'identification, d'enregistrement, de localisation et/ou d'analyse des sources d'énergie électromagnétique rayonnée pour la reconnaissance des menaces."
