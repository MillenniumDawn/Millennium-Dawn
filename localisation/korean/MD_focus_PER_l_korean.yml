 PER_vezarate_keshavarzi_name: "베자라테 케샤바르지"
 PER_vezarate_keshavarzi_name_desc: "농업부는 이란의 농업 감독을 담당하는 이란 정부 기관입니다."
 PER_vezarate_jahade_keshavarzi_name: "베자라테 자하데 케샤바르지"
 PER_vezarate_jahade_keshavarzi_name_desc: "농업 지하드부는 이란의 농업 감독을 담당하는 이란 정부 기관입니다. 이 부처는 건설 지하드로 불리기도 했으나 2001년 농업부와 합쳐져 농업 지하드부가 되었습니다."
 PER_appoint_jamshid_amouzegar: "잠시드 아무제가르 임명"
 PER_freedom_of_information: "정보의 자유"
 PER_freedom_of_information_desc: "이란 국민은 정보에 접근하고 자유롭게 말할 자유를 누릴 자격이 있습니다. 우리는 언론의 자유, 표현의 자유, 제한 없는 정보 흐름을 증진하여 국민이 미래에 대해 충분한 정보를 바탕으로 결정을 내릴 수 있도록 할 것입니다."
 PER_lift_state_owned_monopoly: "국영 독점 해제"
 PER_lift_state_owned_monopoly_desc: "언론은 국가의 통제로부터 자유로워야 합니다. 우리는 언론에 대한 국영 독점을 해제하고 독립 언론 매체의 성장을 장려하여 국민이 폭넓은 의견과 정보에 접근할 수 있도록 할 것입니다."
 PER_governmental_transparency: "정부의 투명성"
 PER_governmental_transparency_desc: "정부는 업무 처리에서 투명해야 합니다. 우리는 국가와 국민 사이의 열린 소통을 추진하여 모든 정부 활동이 명확하고 대중에게 책임을 지도록 할 것입니다."
 PER_ministry_of_economic_affairs: "경제부"
 PER_ministry_of_economic_affairs_desc: "이란의 경제적 미래를 번영으로 이끌기 위해 전담 경제부를 설립할 것입니다. 이 부처는 국가 경제 정책을 조율하고 산업의 지속 가능한 발전을 보장하며 이란의 경제적 이익을 보호할 것입니다."
 PER_protection_for_bahais: "바하이 보호"
 PER_protection_for_bahais_desc: "몬타제리의 지도 아래 이란은 바하이 시민들의 권리를 보호하여 더 이상 억압받거나 소외되지 않도록 할 것입니다. 몬타제리는 모든 이란인의 평등을 믿기에, 신념과 관계없이 모두에게 종교의 자유가 지켜질 것입니다."
 PER_repeal_discriminatory_policies: "차별 정책 폐지"
 PER_repeal_discriminatory_policies_desc: "우리나라의 정책은 모든 시민의 평등에 기반해야 합니다. 우리는 모든 차별적 법률을 폐지하고, 성별, 민족, 종교에 관계없이 모든 이란인이 법 앞에서 평등하게 대우받도록 노력할 것입니다."
 PER_reaffirm_isolationism: "고립주의 재확인"
 PER_reaffirm_isolationism_desc: "동맹이 바뀌고 이해관계가 충돌하는 세상에서는 고립주의 입장을 재확인하는 것이 현명할 수 있습니다. 자급자족을 우선시하고 대외적 얽힘을 최소화함으로써 이란의 주권을 지키고 내부 성장에 집중할 수 있습니다."
 PER_front_against_oppression: "억압에 맞선 전선"
 PER_front_against_oppression_desc: "우리는 국내외를 막론하고 모든 형태의 억압에 맞서 단결할 것입니다. 우리 운동은 모든 이란인의 권리와 자유를 위해 싸우는 데 헌신하며, 누구도 법 위에 있지 않고 어떤 목소리도 침묵당하지 않도록 할 것입니다."
 PER_syrian_brothers: "시리아의 형제들"
 PER_syrian_brothers_desc: "The Assad regime, once an ally, is now a reminder of past mistakes. Supporting democratic resistance will help reverse Iran's reputation."
 PER_fortress_tehran: "요새 테헤란"
 PER_fortress_tehran_desc: "수도를 내외부의 위협으로부터 보호하기 위해 테헤란을 요새화해야 합니다. 우리는 테헤란의 방어에 투자하여 어떤 공격도 견딜 수 있는 현대적 요새로 탈바꿈시킬 것입니다."
 PER_new_renewable_hotspot_soon: "§H카비르§!와 §H발루치스탄§!을 §H재생 에너지 거점§!으로 전환합니다"
 PER_fortress_tehran_TT: "§H테헤란:§!\n§H테헤란§! 시와 그 주변에 요새를 건설합니다"
 PER_100_productivity_in_each_state: "각 §H중핵 주§!의 §H생산성§!이 §H100§! 증가합니다"
 PER_chahbahar_port: "대 차바하르 항 프로젝트"
 PER_chahbahar_port_desc: "차바하르 항 프로젝트는 발루치스탄의 상태를 크게 개선하였으며, 이 주에서 물자의 효율적인 보급과 수송을 가능하게 합니다."
 PER_influence_neighbors2: "모든 §H이웃 국가§!에 대한 §H영향력§!이 §H2%§! 증가합니다"
 PER_rural_industrialization: "농촌 산업화"
 PER_seagulls_screech_idea: "갈매기의 울음"
 PER_revolutionary_decay: "혁명의 쇠퇴"
 PER_revolutionary_decay_desc: "IRGC는 우리 혁명이 모든 가능한 분야에서 실패하도록 만들고 있으며, 국가의 서비스 비용 지불 능력을 해치는 방식으로 이를 수행하고 있습니다.\n§W--------------§!\n이 국가 정신은 §H혁명 후 복구 계획§! 중점을 완료하면 §R제거§!될 수 있습니다.\n§W--------------§!\n이 국가 정신은 §H하메네이의 사임을 요구§!할 때까지 계속 §R악화§!됩니다."
