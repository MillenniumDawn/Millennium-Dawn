 ukraine_modernize_sov_equipment_btr_60_modernization.10.name: "Украинская просьба о §YБТР-60ПБ§!"
 ukraine_modernize_sov_equipment_btr_60_modernization.10.desc: "§Y[From.GetNameWithFlag]§! просит у нас §Y[?FROM.ukraine_bul_btr60_offer_amount|0]§! старых §YБТР-60ПБ§! с наших складов в качестве военной помощи в своей войне. Обратно мы их не получим."
 ukraine_modernize_sov_equipment_btr_60_modernization.10.a: "Передать их"
 ukraine_modernize_sov_equipment_btr_60_modernization.10.b: "Отклонить просьбу"
