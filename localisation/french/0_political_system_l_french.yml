 generic.Western_Autocracy: "£generic_Western_Autocracy_small L'autocratie pro-occidentale"
 generic.Western_Autocracy_desc: "L'autocratie pro-occidentale désigne un large spectre d'idéologies autoritaires et non démocratiques qui s'alignent sur les intérêts géopolitiques de l'hémisphère occidental."
 generic.Western_Autocracy_icon: "£generic_Western_Autocracy_small"
 generic.conservatism: "£generic_conservatism_small Conservateurs"
 generic.conservatism_desc: "Le conservatisme désigne un large éventail d'idéologies de droite modérées qui prônent l'importance de la culture traditionnelle, de l'unité et d'un mode de vie stable. Les conservateurs ont tendance à s'opposer à l'intervention de l'État dans les affaires sociales et économiques, et estiment souvent qu'une réglementation moins stricte se traduira par une plus grande mobilité sociale pour la population."
 generic.conservatism_icon: "£generic_conservatism_small"
 generic.liberalism: "£generic_liberalism_small Libéraux"
 generic.liberalism_desc: "Le libéralisme est une idéologie centriste qui promeut les droits de l'individu et privilégie la liberté face à l'extension du pouvoir de l'État. Les libéraux ont tendance à soutenir des politiques sociales progressistes dans le cadre d'un marché libre et ouvert au commerce mondial."
 generic.liberalism_icon: "£generic_liberalism_small"
 generic.socialism: "£generic_socialism_small Sociaux-démocrates"
 generic.socialism_desc: "La social-démocratie désigne un large spectre d'idéologies de gauche prônant la justice économique et sociale à un degré supérieur à la plupart des branches du libéralisme. Les sociaux-démocrates cherchent à humaniser le capitalisme pour endiguer les inégalités et l'oppression, et pour favoriser la démocratie."
 generic.socialism_icon: "£generic_socialism_small"
 generic.anarchist_communism: "£generic_anarchist_communism_small Radicaux de gauche"
 generic.anarchist_communism_desc: "Le radicalisme de gauche désigne un large spectre d'idéologies d'extrême gauche qui prônent généralement la fin du capitalisme et de la mondialisation. Bien que certains puissent soutenir la résistance armée, beaucoup se considèrent simplement comme « plus à gauche » que les sociaux-démocrates et acceptent la démocratie libérale."
 generic.anarchist_communism_icon: "£generic_anarchist_communism_small"
 generic.Conservative: "£generic_Conservative_small Réactionnaires"
 generic.Conservative_desc: "Les réactionnaires désignent un large spectre d'idéologies d'extrême droite dont les objectifs vont au-delà de ceux des conservateurs modérés. Les réactionnaires croient généralement en une version idéalisée du passé et cherchent à restaurer l'ancienne gloire de la nation à travers une idéologie revancharde et irrédentiste, ainsi qu'une politique militaire agressive."
 generic.Conservative_icon: "£generic_Conservative_small"
 generic.Autocracy: "£generic_Autocracy_small Autocrates"
 generic.Autocracy_desc: "L'autocratie désigne un large spectre de systèmes politiques non démocratiques et autoritaires où un dirigeant unique ou un groupe d'élites privilégiées détient l'ensemble du pouvoir politique."
 generic.Autocracy_icon: "£generic_Autocracy_small"
 generic.Mod_Vilayat_e_Faqih: "£generic_Mod_Vilayat_e_Faqih_small Révolutionnaires chiites modérés"
 generic.Mod_Vilayat_e_Faqih_desc: "Les révolutionnaires chiites modérés désignent un spectre d'adeptes chiites de droite qui soutiennent une interprétation stricte de l'islam chiite, tout en favorisant une plus grande pluralité politique que leurs homologues les plus radicaux. Malgré cela, ils soutiennent globalement la poursuite de la théocratie."
 generic.Mod_Vilayat_e_Faqih_icon: "£generic_Mod_Vilayat_e_Faqih_small"
 generic.Vilayat_e_Faqih: "£generic_Vilayat_e_Faqih_small Révolutionnaires chiites radicaux"
 generic.Vilayat_e_Faqih_desc: "Les révolutionnaires chiites radicaux désignent un spectre d'adeptes chiites d'extrême droite et militaristes qui prônent une interprétation stricte de l'islam chiite. Ils ont des vues largement négatives envers les sunnites et cherchent à assurer la pérennité de l'islam chiite au sein d'un État théocratique."
 generic.Vilayat_e_Faqih_icon: "£generic_Vilayat_e_Faqih_small"
 generic.Kingdom: "£generic_Kingdom_small Salafistes pro-institutionnels"
 generic.Kingdom_icon: "£generic_Kingdom_small"
 generic.Kingdom_desc: "Certains courants de la pensée salafiste, tels que le wahhabisme et le madkhalism, prônent la préservation du statu quo plutôt que la révolution radicale et le jihad armé. Ces salafistes partagent les vues fondamentalistes et intolérantes des jihadistes qutbistes, mais rejettent généralement la violence et soutiennent les gouvernements en place. Leur conformisme les rend populaires auprès des États arabes autoritaires, craintifs face à la menace que les courants plus politiques de l'islamisme font peser sur leur pouvoir."
 generic.Caliphate: "£generic_Caliphate_small Djihadisme salafiste"
 generic.Caliphate_icon: "£generic_Caliphate_small"
 generic.Caliphate_desc: "Le jihadisme salafiste désigne une branche extrémiste, ultraconservatrice et fondamentaliste de l'idéologie politique islamique, inspirée par les enseignements de Sayyid Qutb. Ses partisans cherchent à conquérir toutes les terres islamiques et à les gouverner selon leur interprétation rigoureuse de la loi islamique. Ils ne reconnaissent ni les autres formes d'islam ni les religions minoritaires, et ne reculeront devant rien pour atteindre leurs objectifs."
 generic.Neutral_Muslim_Brotherhood: "£muslim_brotherhood_small Islamistes modérés"
 generic.Neutral_Muslim_Brotherhood_icon: "£muslim_brotherhood_small"
 generic.Neutral_Muslim_Brotherhood_desc: "L'islamisme modéré désigne un large spectre de mouvements politiques islamiques qui cherchent à établir un État démocratique dans le cadre de la loi islamique."
 generic.Neutral_Autocracy: "£generic_Neutral_Autocracy_small Autocrates non-alignés"
 generic.Neutral_Autocracy_icon: "£generic_Neutral_Autocracy_small"
 generic.Neutral_Autocracy_desc: "L'autocratie désigne un large spectre d'idéologies non démocratiques et autoritaires où tout le pouvoir est concentré entre les mains d'un dirigeant unique."
 generic.Neutral_conservatism: "£generic_Neutral_conservatism_small Conservateurs"
 generic.Neutral_conservatism_icon: "£generic_Neutral_conservatism_small"
 generic.Neutral_conservatism_desc: "Le conservatisme désigne un large éventail d'idéologies de droite modérées qui prônent l'importance de la culture traditionnelle, de l'unité et d'un mode de vie stable. Les conservateurs ont tendance à s'opposer à l'intervention de l'État dans les affaires sociales et économiques, et estiment souvent qu'une réglementation moins stricte se traduira par une plus grande mobilité sociale pour la population."
 generic.oligarchism: "£generic_oligarchism_small Oligarques"
 generic.oligarchism_icon: "£generic_oligarchism_small"
 generic.oligarchism_desc: "L'oligarchie désigne une structure de pouvoir dans laquelle le contrôle est exercé par un groupe restreint d'élites politiques et économiques. Les oligarchies sont généralement de nature non démocratique et autoritaire."
 generic.Neutral_Libertarian: "£generic_Neutral_Libertarian_small Libertaires"
 generic.Neutral_Libertarian_icon: "£generic_Neutral_Libertarian_small"
 generic.Neutral_Libertarian_desc: "Le libertarisme désigne un large éventail d'idéologies et de mouvements politiques qui font de la liberté leur principe fondamental. Les libertariens préconisent généralement une intervention étatique limitée dans tous les aspects de la vie sociale, politique et économique, et ce à un degré bien plus élevé que les conservateurs."
 generic.Neutral_green: "£generic_Neutral_green_small Écologistes"
 generic.Neutral_green_icon: "£generic_Neutral_green_small"
 generic.Neutral_green_desc: "L'écologie politique désigne un large spectre de mouvements de gauche prônant la non-violence, la justice sociale, la démocratie directe et l'environnementalisme."
 generic.neutral_Social: "£generic_neutral_Social_small Démocrates socialistes"
 generic.neutral_Social_icon: "£generic_neutral_Social_small"
 generic.neutral_Social_desc: "L'idéologie démocrate socialiste désigne des idéologies de gauche prônant la justice économique et sociale. Tout en évoluant dans le cadre du capitalisme, elles recherchent une redistribution importante des richesses afin de réduire les inégalités, promeuvent l'État-providence et visent à imposer une plus forte régulation aux entreprises privées."
 generic.Neutral_Communism: "£generic_Neutral_Communism_small Communistes"
 generic.Neutral_Communism_icon: "£generic_Neutral_Communism_small"
 generic.Neutral_Communism_desc: "Le communisme désigne de manière générale une idéologie prônant la fin du système capitaliste pour créer un paradis des travailleurs communautaire. En réalité, les nations communistes conservent des systèmes économiques capitalistes et sont souvent de nature non démocratique."
 generic.Nat_Populism: "£generic_Nat_Populism_small Populistes de droite"
 generic.Nat_Populism_icon: "£generic_Nat_Populism_small"
 generic.Nat_Populism_desc: "Le populisme de droite désigne une branche spécifique de l'idéologie populiste qui vise à redonner le pouvoir au peuple face aux élites prétendument aux commandes de la société. Les populistes de droite soutiennent généralement l'altermondialisme ou l'anti-mondialisme, le protectionnisme, le nativisme, le nationalisme et l'opposition à l'immigration."
 generic.Nat_Fascism: "£generic_Nat_Fascism_small Fascistes"
 generic.Nat_Fascism_icon: "£generic_Nat_Fascism_small"
 generic.Nat_Fascism_desc: "Le fascisme est une forme d'ultranationalisme autoritaire aux accents militaristes. Il cherche à établir un État à parti unique dirigé par un dirigeant suprême exerçant une autorité absolue, et soutient la violence ainsi que l'expansionnisme agressif pour favoriser la régénération nationale."
 generic.Nat_Autocracy: "£generic_Nat_Autocracy_small Junte militaire"
 generic.Nat_Autocracy_icon: "£generic_Nat_Autocracy_small"
 generic.Nat_Autocracy_desc: "Les juntes militaires désignent des gouvernements dirigés par un comité de chefs militaires. Les juntes militaires sont souvent de nature non démocratique et autoritaire, et peuvent, dans un sens très large, être considérées comme une forme de dictature militaire ou de stratocratie."
 generic.Monarchist: "£generic_Monarchist_small Monarchistes"
 generic.Monarchist_icon: "£generic_Monarchist_small"
 generic.Monarchist_desc: "L'idéologie monarchiste désigne les monarchies absolues."
