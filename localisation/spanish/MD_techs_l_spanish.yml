 module_naval_radar_jammer_1: "Inhibidor de radar naval I"
 module_naval_radar_jammer_1_desc: "Los inhibidores de radar navales degradan la capacidad del enemigo para detectar, rastrear y atacar al inyectar ruido, engaño y falsos ecos en los sensores hostiles.\n\n§GConsejo de diseño: Los inhibidores de radar reducen la visibilidad de superficie al tiempo que mejoran la detección, los puntos de vida, los misiles antibuque y el ataque de torpedos. Son útiles en combatientes valiosos que necesitan supervivencia, pero requieren microchips.§!"
