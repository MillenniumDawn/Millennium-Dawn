 ###########Other Activities###########
 sov_reunification_category: "Unification of Russia"
 sov_reunification_category_desc: "The outcome of the war left Russia fragmented. With the dust settled, we must endure the hardships of reunification.\n\nWe can bring a breakaway region home through §Ytalks§!, which come with regional demands, or by §Yforce§!, which costs Stability and War Support. A region held by a foreign overlord must first be released through negotiation. Once every region has returned, §GRussia Reunited§! will speed our recovery.\n\nCurrent unification progress: [?THIS.reunification_progress]."
 SOV_start_reunification_talks: "Open Unification Talks with [FROM.GetNameWithFlag]"
 SOV_start_reunification_talks_desc: "We can sit down with the leadership of [FROM.GetNameWithFlag] and negotiate its return to Russia. Their delegation will table demands that we must honor once the talks conclude."
 SOV_start_reunification_talks_tt: "§YHow unification talks work:§!\n1. Talks open with a demand from [FROM.GetNameWithFlag]. We can accept it, push back once for a different demand, or walk away. Walking away blocks new talks with them for §Y365§! days.\n2. Progress grows every month, as the §YUnification roundtable talks§! mission shows. Now and then an event asks for Political Power, money, or a factory, or the delegation adds another demand.\n3. Talks pause while either side is at war, and collapse if [FROM.GetName] ceases to exist or becomes a subject.\n4. At §Y100§! progress, we annex [FROM.GetNameWithFlag]. We suffer §RReunification Strains§! for §Y1§! year, and every demand we accepted applies for §Y3§! years."
 SOV_reunification_cooldown: "Recently Walked Away from Unification Talks"
 SOV_negotiate_shard_release: "Negotiate the Release of [FROM.GetNameWithFlag]"
 SOV_negotiate_shard_release_desc: "[FROM.GetNameWithFlag] answers to a foreign overlord. We can ask its patron to grant it full independence, which opens the way to unification talks."
 SOV_prepare_reconquest: "Prepare to Retake [FROM.GetNameWithFlag] by Force"
 SOV_prepare_reconquest_desc: "If [FROM.GetNameWithFlag] will not return through talks, the army can bring it back. Turning our guns on our own people will cost us dearly at home."
 SOV_prepare_reconquest_tt: "In §Y60§! days, we may claim a §YWar Goal§! against [FROM.GetNameWithFlag]. Pressing it costs §R15%§! Stability and §R15%§! War Support."
 SOV_reunification_mission: "Unification roundtable talks"
 reunification_talks_in_progress: "A Reunification Effort Is in Progress"
 sov_dissolution.1.t: "Regionalism on the Rise"
 sov_dissolution.1.d: "With the recent war taking a turn for the worse, more state actors are beginning to assert their independence. It is only a matter of time before this situation spirals out of control and leads to widespread instability."
 sov_dissolution.1.a: "Impossible"
 sov_dissolution.2.t: "Part of Russia Reintegrated"
 sov_dissolution.2.d: "After lengthy negotiations, another region of the homeland has returned under its true flag. This marks a significant step toward reunification and national stability."
 sov_dissolution.2.a: "One Step Closer"
 sov_dissolution.3.t: "Russia Asks to Release a Puppet"
 sov_dissolution.3.d: "The Russian government has reached out in hopes of negotiating the full independence of one of its former territories. This move could reshape the balance of power in the region."
 sov_dissolution.3.a: "Money investment could be helpful"
 sov_dissolution.3.b: "We could buy their state assets"
 sov_dissolution.3.c: "Out of the question"
 sov_dissolution.4.t: "[FROM.GetName] Asks for Monetary Compensation"
 sov_dissolution.4.d: "Following talks with [FROM.GetNameWithFlag] regarding the possible release of parts of their country, they have proposed monetary compensation in exchange for this concession. Such demands complicate the negotiation process."
 sov_dissolution.4.a: "Small price to pay"
 sov_dissolution.4.b: "Not possible"
 sov_dissolution.5.t: "[FROM.GetName] Asks for State Asset Transfer"
 sov_dissolution.5.d: "In discussions about releasing certain regions, [FROM.GetNameWithFlag] has requested the transfer of state assets as compensation. This demand will require careful consideration before proceeding."
 sov_dissolution.5.a: "Small price to pay"
 sov_dissolution.5.b: "Not possible"
 sov_dissolution.6.t: "[FROM.GetName] Denies Possible Negotiations"
 sov_dissolution.6.d: "Despite outreach efforts, [FROM.GetNameWithFlag] has outright rejected all proposals for releasing parts of their territory. The situation remains tense and unstable, with little hope for immediate resolution."
 sov_dissolution.6.a: "Arrogant fools!"
 sov_dissolution.7.t: "[SOV.GetName] Agrees to Our Terms"
 sov_dissolution.7.d: "[SOV.GetName] has accepted our reasonable compensation demands to release our affiliated state. This agreement brings us closer to reunification and peace."
 sov_dissolution.7.a: "Just business"
 sov_dissolution.8.t: "[SOV.GetName] Rejects Our Terms"
 sov_dissolution.8.d: "[SOV.GetName] has refused to consider our reasonable compensation demands for the release of our affiliated state. This rejection could delay progress and increase tensions."
 sov_dissolution.8.a: "Their loss"
 sov_dissolution.10.t: "Political Turmoil During Negotiations"
 sov_dissolution.10.d: "During talks over possible reintegration with Russia, several sensitive issues surfaced that effectively stalled the negotiation process. The political climate remains uncertain and fragile."
 sov_dissolution.10.a: "Let's leverage some tools at our disposal"
 sov_dissolution.10.b: "We have to sit this one out"
 sov_dissolution.11.t: "Lack of Funds for Negotiations"
 sov_dissolution.11.d: "Monetary compensation was proposed during talks on reintegration to cover administrative costs related to state transfer. However, funding shortages threaten to halt progress and require careful budgeting."
 sov_dissolution.11.a: "Part of the process"
 sov_dissolution.11.b: "There is no money, but you hang in there!"
 sov_dissolution.12.t: "Incompatible State Assets"
 sov_dissolution.12.d: "It has become clear that some state assets would face bankruptcy during reintegration negotiations. We must take decisive action to resolve these issues and move the talks forward."
 sov_dissolution.12.a: "Sell it now."
 sov_dissolution.12.b: "We need those assets"
 SOV_reunification_plus_10: "§GThis will increase unification progress by 10§!"
 SOV_reunification_plus_15: "§GThis will increase unification progress by 15§!"
 SOV_reunification_plus_20: "§GThis will increase unification progress by 20§!"
 SOV_reunification_minus_10: "§RThis will decrease unification progress by 10§!"
 SOV_reunification_minus_15: "§RThis will decrease unification progress by 15§!"
 SOV_breakaway_defense_category: "Defense of the Republic"
 SOV_breakaway_defense_category_desc: "Our independence from Moscow is only as secure as the army that guards it. Former Russian depots on our soil can equip a force of our own."
 SOV_breakaway_raise_army: "Raise a National Army"
 SOV_breakaway_raise_army_desc: "We can arm local volunteers and former Russian servicemen from the depots on our territory. This forms §Y10§! infantry brigades and §Y5§! armored infantry brigades in our capital."
 SOV_reunification_mission_desc: "Talks advance every month. Occasional setbacks may call for concessions, and the regional delegation may add new demands. Talks pause while we or our counterpart are at war, and collapse if the other side ceases to exist or falls under a foreign power."
 SOV_reunification_mission_tt: "Unification progress grows by §G10§! each month, §G5§! more if their opinion of us is at least §Y50§!, and §R5§! less while our Stability is below §Y40%§!. At §Y100§!, the region is annexed."
 SOV_reconquest_mission: "Preparing the Reconquest"
 SOV_reconquest_mission_desc: "Our generals are drawing up plans to retake a breakaway region. The operation will be ready when the timer runs out."
 SOV_reunification_demand_offered_tt: "When the talks conclude, we must honor this demand for §Y3§! years:"
 SOV_reunification_reroll_tt: "Their delegation will table a different demand. We can push back only once per round of talks."
 SOV_reunification_cooldown_tt: "We cannot reopen talks with this region for §R365§! days."
 SOV_russia_reunited_legacy_tt: "When it expires, §YRussia Reunited§! becomes the permanent §YLegacy of Reunification§!."
 sov_dissolution.13.t: "The Regions State Their Terms"
 sov_dissolution.13.d: "Delegations have arrived in Moscow to open talks on reintegration. Before any agreement is signed, the regional leadership insists on guarantees of its own."
 sov_dissolution.13.a: "Accept their terms"
 sov_dissolution.13.b: "Push for different terms"
 sov_dissolution.13.c: "Walk away from the table"
 sov_dissolution.14.t: "New Terms on the Table"
 sov_dissolution.14.d: "Midway through the talks, the regional delegation has added another condition. They claim their constituents will not accept reintegration without it."
 sov_dissolution.14.a: "Agree to the new terms"
 sov_dissolution.14.b: "Refuse and stall the talks"
 sov_dissolution.15.t: "Reunification Effort Collapses"
 sov_dissolution.15.d: "The region we sought to bring home has either ceased to exist or fallen under a foreign power. No one is left to sign an agreement, and our effort has come to nothing."
 sov_dissolution.15.a: "A bitter setback"
 sov_dissolution.16.t: "The Army Stands Ready"
 sov_dissolution.16.d: "Our generals report that plans to retake the breakaway region are complete. Ordering the advance means Russians fighting Russians, and the public will not forget it."
 sov_dissolution.16.a: "Order the advance"
 sov_dissolution.16.b: "Stand down"
 sov_dissolution.17.t: "Russia Is Whole Again"
 sov_dissolution.17.d: "The last of the breakaway regions has returned. For the first time since the collapse, Moscow governs every corner of the federation. Now the work of rebuilding begins."
 sov_dissolution.17.a: "Rebuild the nation"
 sov_dissolution.18.t: "The Government Falls"
 sov_dissolution.18.d: "Defeat has shattered the authority of those who led us into war. With the army humiliated and the regions breaking away, the old leadership has been forced from office. Rival factions now compete to fill the vacuum in Moscow."
 sov_dissolution.18.a: "Liberal reformers take charge"
 sov_dissolution.18.b: "The Communists return to power"
 sov_dissolution.18.c: "Conservatives form a government of national unity"
 sov_dissolution.18.e: "The generals seize control"
 SOV_post_defeat_regime_tt: "The leader who lost the war is §Rremoved from power§!, and the party that led us into defeat loses popularity."
 news.93.t: "Russia Reunified"
 news.93.d: "Years after defeat tore the federation apart, Russia has restored its authority over every breakaway region. Analysts warn that a reunified Russia, eager to rebuild, will soon reassert itself on the world stage."
 news.93.a: "Our nation is whole once more"
 news.93.b: "The bear has gathered its strength"
 SOV_reunification_demand_western_elites_idea: "Pro-Western Regional Elites"
 SOV_reunification_demand_western_elites_idea_desc: "Regional leaders brought their ties with Western partners into the federation, and their influence now reaches Moscow."
 SOV_reunification_demand_tax_autonomy_idea: "Regional Tax Autonomy"
 SOV_reunification_demand_tax_autonomy_idea_desc: "Reintegrated regions keep a larger share of the taxes they collect, leaving less for the federal budget."
 SOV_reunification_demand_resource_rights_idea: "Regional Resource Rights"
 SOV_reunification_demand_resource_rights_idea_desc: "Local authorities kept control over the mineral wealth beneath their land, which limits federal access to it."
 SOV_reunification_demand_cossack_self_rule_idea: "Cossack Self-Rule"
 SOV_reunification_demand_cossack_self_rule_idea_desc: "Cossack hosts kept their traditional self-government and their exemptions from federal conscription."
 SOV_reunification_demand_federal_subsidies_idea: "Federal Subsidy Pledge"
 SOV_reunification_demand_federal_subsidies_idea_desc: "Moscow promised to fund regional welfare and infrastructure, which ties up factories in consumer production."
 SOV_reunification_demand_separatist_amnesty_idea: "Separatist Amnesty"
 SOV_reunification_demand_separatist_amnesty_idea_desc: "Former separatist leaders were pardoned and given posts in the federal government, where they obstruct our agenda."
 SOV_reunification_demand_garrison_retention_idea: "Regional Garrisons Retained"
 SOV_reunification_demand_garrison_retention_idea_desc: "Local militias joined the armed forces with their officers and pay scales intact, which inflates military wages."
 SOV_reunification_demand_regional_parliament_idea: "Empowered Regional Assemblies"
 SOV_reunification_demand_regional_parliament_idea_desc: "Regional assemblies won the right to challenge federal laws, and every reform now faces a fight in the provinces."
 SOV_russia_reunited_idea: "Russia Reunited"
 SOV_russia_reunited_idea_desc: "With the federation whole again, the nation has thrown itself into rebuilding what the war destroyed."
 SOV_russia_reunited_legacy_idea: "Legacy of Reunification"
 SOV_russia_reunited_legacy_idea_desc: "The memory of a nation torn apart and made whole again binds Russians to their government."
 russia.118.t: "The Fate of the 'Baku' Cruiser"
 russia.118.d: "The fate of the cruiser Baku has been uncertain for years. Since the 90s, India has expressed interest in purchasing it. Now, we must decide whether to keep and modernize the cruiser for our navy or sell it to India to gain funds."
 russia.118.a: "Upgrade it"
 russia.118.b: "Sell it"
 russia.119.t: "Canonization of the Romanov Family"
 russia.119.d: "The Russian Orthodox Church has canonized the Romanov family this morning. The process was not without controversy, drawing strife from various quarters, including voices from within the church itself. Many believe the canonization does not properly uphold the sanctity of the term, yet the church has proceeded."
 russia.119.a: "Remind the commies of their deeds!"
 russia.119.b: "Honoring the Dead..."
 russia.120.t: "Failed Test Flight of the Su-37"
 russia.120.d: "A test flight was conducted near Shatura today, but the aircraft suffered a major malfunction. The port tailplane broke off during a high-g maneuver, leading to its crash and total loss. The structural failure was caused by repeatedly exceeding the design load during six years of testing."
 russia.120.a: "Unfortunate..."

 NOV_limonka: "Novorossiya"

 georgia_broken_relations: "Ruined relations with Georgia"

 # Events Buran
 russia.200.t: "Good news from Baikonur"
 russia.200.d: "The Buran repair team has confirmed today that the shuttle was successfully moved out of the aging hangar, marking the beginning of its dismantling process. A team of skilled engineers has been assembled to oversee the deconstruction of the frame."
 russia.200.a: "As intended"

 russia.300.t: "Buran Funds Embezzled"
 russia.300.d: "Funds allocated to the Buran restoration program were reportedly embezzled, redirecting critical resources away from the project. Efforts to identify the culprit have so far been unsuccessful. The disappearance of financial records and high-level corruption have hindered the investigation."
 russia.300.a: "Dammit!"

 russia.301.t: "International Community Abuzz with Admiration"
 russia.301.d: "Thanks to our draconian, yet successful, efforts repairing the Buran shuttle, the international community has been captivated by our achievements. We can seize this moment of global recognition and maximize its impact while the spotlight remains on us."
 russia.301.a: "Credit the Engineers!"
 russia.301.b: "Credit [SOV.GetLeader]!"

 russia.302.t: "Buran Shuttle Repaired"
 russia.302.d: "After months of meticulous work, the Buran shuttle has been fully restored and stands poised for a new chapter in space exploration. Every screw, every part has been double-checked, and a successful test flight has proven its readiness. Now prepared for future missions, this is a triumphant moment for Russia, the revival of a legendary craft once thought lost to time."
 russia.302.a: "A step forward for space exploration!"
 russia.3022.t: "Buran Shuttle Repaired by Russia"
 russia.3022.d: "After months of meticulous work, the Buran shuttle has been fully restored and stands poised for a new chapter in space exploration. Every screw, every part has been double-checked, and a successful test flight has proven its readiness. Now prepared for future missions, this is a triumphant moment for Russia, the revival of a legendary craft once thought lost to time."
 russia.3022.a: "A step forward for space exploration!"

 russia.303.t: "Buran Under Repair Destroyed in a Hangar Fire"
 russia.303.d: "On June 16, 2003, disaster struck as a fire engulfed the temporary hangar where the Buran shuttle was being repaired, destroying it completely. After all the efforts to restore and prepare it for future missions, the shuttle's legacy was reduced to ashes. The loss was devastating, a tragic end to what could have been the shuttle's triumphant return to the skies."
 russia.303.a: "Dreams that will never be"
 russia.3033.t: "Buran Under Repair Destroyed in a Hangar Fire"
 russia.3033.d: "On June 16, 2003, disaster struck as a fire engulfed the temporary hangar where the Buran shuttle was being repaired, destroying it completely. After all the efforts to restore and prepare it for future missions, the shuttle's legacy was reduced to ashes. The loss was devastating, a tragic end to what could have been the shuttle's triumphant return to the skies."
 russia.3033.a: "Dreams that will never be"

 russia.304.t: "Buran Destroyed in Hangar Collapse"
 russia.304.d: "On May 12, 2002, tragedy struck as the Buran shuttle was lost in a devastating hangar collapse, ending its story in a pile of debris and causing multiple fatalities. This once-proud symbol of space exploration was reduced to ruin, never to soar again. It was a heartbreaking end for a craft that had represented so much hope and ambition."
 russia.304.a: "Dreams that will never be"
 russia.3044.t: "Buran Destroyed in Hangar Collapse"
 russia.3044.d: "On May 12, 2002, tragedy struck as the Buran shuttle was lost in a devastating hangar collapse, ending its story in a pile of debris and causing multiple fatalities. This once-proud symbol of space exploration was reduced to ruin, never to soar again. It was a heartbreaking end for a craft that had represented so much hope and ambition."
 russia.3044.a: "Dreams that will never be"
