 UKR_storage_item_btr50_tt: "§YБТР-50§!\n\n\n£SOV_LAND_BTR_50\n\n\n\nНа хранении: §Y[?ukraine_has_btr50_stockpile|0]§!\nПоколение: первое послевоенное поколение гусеничных БТР, на вооружении с 1954 года.\nТип техники: §YКорпус БТР 1-го поколения§!\n\nСемейство вариантов:\n• БТР-50П\n• БТР-50ПА\n• БТР-50ПК\n• БТР-50ПУ (командирский)\n\nГусеничный плавающий бронетранспортёр на базе корпуса §YПТ-76§!. Перевозит до 20 бойцов."
