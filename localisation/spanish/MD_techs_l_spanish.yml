 nsb_atgm_tech_1: "ATGM de 1ª Generación"
 nsb_atgm_tech_1_desc: "Anti-Tank Guided Missile (ATGM) pods are external systems mounted on helicopters, enabling the deployment of guided missiles designed to engage and destroy armored vehicles, fortifications, and other ground targets with high precision. These pods significantly enhance a helicopter's offensive capabilities, allowing for effective engagement in various combat scenarios."
