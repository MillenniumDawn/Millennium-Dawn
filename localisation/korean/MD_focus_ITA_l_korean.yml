 italy_focus: "이탈리아 중점 계통도"
 integration_caucasus: "캅카스 로마화"
 integration_caucasus_desc: "충성도가 제각각인 속국 왕국들이 종종 통제하던 캅카스 지역은 로마와 페르시아 사이의 수많은 분쟁의 무대였습니다. 마침내 이곳을 로마를 위해 영원히 확보할 때입니다."
 restore_Heliopolis: "헬리오폴리스 복원"
 restore_Heliopolis_desc: "지금은 바알베크로 알려진 헬리오폴리스에는 로마 세계에서 가장 인상적인 신전 중 하나가 있었습니다. 이를 옛 영광으로 복원할 것입니다."
 restore_Thysdrus: "티스드루스 복원"
 restore_Thysdrus_desc: "지금은 엘젬으로 알려진 티스드루스에는 로마 세계에서 가장 큰 원형극장 중 하나가 있었습니다. 이를 옛 영광으로 복원할 것입니다."
 restore_diocletians_palace: "디오클레티아누스 궁전 복원"
 restore_diocletians_palace_desc: "달마티아 해안에 위치한 디오클레티아누스 궁전은 세계에서 가장 크고 보존 상태가 좋은 로마 궁전의 사례 중 하나입니다."
 restore_Palmyra: "팔미라 재건"
 restore_Palmyra_desc: "팔미라는 동로마 제국에서 가장 부유하고 상징적인 도시 중 하나였으며, 우리는 이를 옛 영광으로 복원할 것입니다."
 restore_Arles_Nimes: "아를과 님 원형경기장 복원"
 restore_Arles_Nimes_desc: "프랑스 남부의 아를과 님에는 가장 보존 상태가 좋은 로마 원형경기장 두 곳이 있으며, 우리는 이를 온전한 영광으로 복원할 것입니다."
 restore_Alexandria_lighthouse: "알렉산드리아 등대 재건"
 restore_Alexandria_lighthouse_desc: "알렉산드리아 등대는 고대 세계 7대 불가사의 중 하나였으며, 우리는 이 새로운 빛나는 황금기의 등불로서 이를 재건할 것입니다."
 restore_Athens_acropolis: "아테네 아크로폴리스 복원"
 restore_Athens_acropolis_desc: "아테네는 고대의 가장 중요한 도시 중 하나였으며 그 문화는 로마 세계에 큰 영감을 주었습니다. 우리는 이를 옛 영광으로 복원할 것입니다."
 restore_Troy: "트로이 재건"
 restore_Troy_desc: "전설의 도시 트로이는 아이네이아스의 고향이었으며, 그의 후손들은 훗날 로마 자체의 건국자가 되었습니다. 우리는 이 영광스러운 과거의 증거로서 이 신화 속 도시를 재건할 것입니다."
 restore_rhodes_colossus: "로도스의 거상 재건"
 restore_rhodes_colossus_desc: "로도스의 거상은 고대 세계 7대 불가사의 중 하나였습니다."
 restore_leptis_magna: "렙티스 마그나 원형경기장 복원"
 restore_leptis_magna_desc: "렙티스 마그나의 원형극장은 북아프리카에서 가장 큰 극장 중 하나였습니다."
 restore_marciana_traiana: "마르키아나 트라이아나 재건"
 restore_marciana_traiana_desc: "마르키아나 트라이아나 타무가디는 트라야누스 황제가 오늘날의 알제리에 세운 로마 식민시였습니다."
 restore_augusta_emerita: "아우구스타 에메리타 재건"
 restore_augusta_emerita_desc: "지금은 메리다로 알려진 아우구스타 에메리타는 오늘날의 스페인에 해당하는 루시타니아의 로마 식민시였습니다."
 ITA_increase_asteroid_mining_precious: "귀금속 소행성 채굴 속도 증가"
 ITA_increase_asteroid_mining_precious_2: "귀금속 소행성 채굴 속도 증가"
 ITA_increase_asteroid_mining_precious_3: "귀금속 소행성 채굴 속도 증가"
 ITA_reduce_asteroid_mining_precious: "귀금속 소행성 채굴 속도 감소"
 ITA_relations_with_the_church: "교회와의 관계"
 ITA_relations_with_the_church_desc: "이탈리아 인구의 상당수는 여전히 독실한 가톨릭 신자로 이루어져 있으며, 교회가 이 나라에서 막강한 영향력을 지니는 것은 놀라운 일이 아닙니다."
 ITA_a_secular_state: "세속 국가"
 ITA_a_secular_state_desc: "가톨릭 교회는 우리 정치에 충분히 오랫동안 간섭해 왔습니다. 이제 물러나야 할 때이며, 종교를 정치에서 확실히 분리해야 합니다."
 ITA_limit_8xmille: "8x1000 제한"
 ITA_limit_8xmille_desc: "이탈리아인 소득세 수입의 0,8%는 종교 단체 지원에 배정되며, 그 대부분이 가톨릭 교회의 금고로 들어갑니다."
 ITA_tax_church_property: "교회 재산 과세"
 ITA_tax_church_property_desc: "이탈리아 가톨릭 교회는 전국에 걸쳐 극히 방대한 부동산을 소유하고 있습니다. 그중 상당 부분은 작은 예배 공간이라도 있다는 이유로 재산세를 면제받고 있습니다."
 ITA_abolish_school_religion_teaching: "학교 종교 교육 폐지"
 ITA_abolish_school_religion_teaching_desc: "초등학교부터 고등학교까지 이탈리아의 모든 학교는 종교 수업을 들을 수 있는 선택권을 제공하며, 이는 이미 한정된 학생들의 시간을 낭비하고 때로는 반동적이고 보수적인 이념을 적극적으로 퍼뜨리기도 합니다."
 ITA_constitutionalise_secularism: "세속주의 헌법화"
 ITA_constitutionalise_secularism_desc: "이미 세속 국가임에도 불구하고, 라테라노 조약과 그 이후의 개정을 수용함으로써 이탈리아 헌법은 가톨릭 교회에 특혜를 주고 있습니다. 이러한 상황을 끝내고 모든 종교가 국가 앞에 평등하도록 보장해야 할 때입니다."
 ITA_a_devout_state: "신앙 국가"
 ITA_a_devout_state_desc: "이탈리아의 뿌리는 가톨릭 전통에 깊이 내려 있습니다. 전통을 받아들여 근대화의 길을 안내받는 것이 마땅합니다."
 ITA_economic_support_for_the_church: "교회 경제 지원"
 ITA_economic_support_for_the_church_desc: "교회의 지지는 우리나라의 기둥이지만, 그 경건한 잠재력을 온전히 실현하려면 더 많은 자금이 필요합니다."
 ITA_adriatic_gas_fields: "아드리아해 가스전"
 ITA_adriatic_gas_fields_desc: "아드리아해에는 우리가 제대로 활용하지 못하고 있는 상당한 규모의 천연가스 매장량이 있습니다. 외국 에너지원에 대한 의존을 줄이려면 채굴 역량을 개발해야 합니다."
 ITA_seize_power: "권력 장악"
 ITA_seize_power_desc: "이 부패한 노예들이 우리나라를 운영하는 것을 더는 용납할 수 없습니다. 필요하다면 무력으로 그들을 권력에서 끌어내릴 것입니다."
 italy_md.26.o3: "핀메카니카"
 italy_md.26.o4: "콜디레티"
 italy_md.40.t: "북부동맹을 장악한 살비니"
 italy_md.40.d: "북부동맹 소속 유럽 의회 의원인 마테오 살비니는 당내에서 보시를 몰아내고 지도부를 장악할 만큼 충분한 지지를 모았습니다. 살비니는 정치 및 경제 연합 모두에 비판적인 강경 유럽회의주의 정치인입니다. 그는 러시아와 강한 유대를 가지고 있으며 세계화, 이민, 자유 시장에 맞서는 신민족주의 운동을 지지합니다. 그의 지도력 아래 북부동맹은 북부 지역과 연방주의 요구에 집중하는 정당에서, 외국인, 이주민, 은행, 이웃 나라 등 적절히 조작된 다양한 외부의 적을 이용해 국가 정체성을 구축하려는 전국 정당으로 탈바꿈할 것입니다."
 italy_md.40.o1: "일 카피타노"
 italy_md.41.t: "새 정당을 창당한 베페 그릴로"
 italy_md.41.d: "저명한 이탈리아 코미디언 베페 그릴로는 잔로베르토 카살레조의 조언에 따라 여러 시민 명부와 지지자 조직들을 오성운동이라는 실제 정당으로 조직했습니다. 이 운동은 점점 더 멀고 부패하게 인식되는 정치에 실망한 모든 사람들을 위한 플랫폼을 만들기 위해 결성되었습니다. 이 운동은 인터넷이 제공하는 도구를 이용한 직접 민주주의를 강력히 옹호하며, 직책 선거와 기타 결정은 카살레조가 소유한 비공개 인터넷 플랫폼에서 이루어집니다. 그럼에도 실질적인 권력은 지도부의 손에 남아 있으며, 지도부는 여러 사안에 대해 우익과 좌익의 입장을 자유롭게 오가며 정당을 매우 적극적으로 빚어낼 수 있습니다. 이념적 유연성에도 불구하고, 이 정당의 핵심은 님비 중심의 환경주의 접근과 경제 문제에 대한 강한 반세계화 입장을 가진 녹색당으로 대부분 설명할 수 있습니다. 우익 포퓰리즘 정당들과 달리 오성운동은 러시아보다 중국과의 유대를 더 중시합니다."
 italy_md.41.o1: "꺼져!"
 italy_md.42.t: "나폴리의 도시 폐기물 위기!"
 italy_md.42.d: "부실한 계획, 수년간의 기반시설 방치, 님비주의, 마피아 활동, 정치 부패가 겹쳐 나폴리의 폐기물 수거 및 관리 체계가 붕괴했습니다. 한때 아름다웠던 도시의 모든 모퉁이에 쓰레기 더미가 쌓여 있지만, 이를 치울 능력은 거의 없고 모든 일반 및 비상 매립지가 가득 차 쓰레기를 어디에 둘지에 대한 아이디어는 더욱 부족합니다."
 italy_md.42.o1: "님비를 단속하고 소각장을 건설한다"
 italy_md.42.o2: "폐기물을 독일과 오스트리아로 보낸다"
 italy_md.42.o3: "도움이 될 만한 사람들을 알고 있는데..."
 monthly_clan_drift_increase_events_TT: "이 지역에서 이 가문의 입지가 영구적으로 강화될 수 있습니다."
