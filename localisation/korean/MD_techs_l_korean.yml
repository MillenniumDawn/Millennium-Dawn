 nsb_atgm_tech_1: "1세대 대전차 유도 미사일 (ATGM)"
 nsb_atgm_tech_1_desc: "대전차 유도 미사일(ATGM) 포드는 헬리콥터에 장착되는 외부 체계로, 장갑 차량, 방어 시설, 기타 지상 표적을 고도의 정밀도로 교전하고 파괴하도록 설계된 유도 미사일을 운용할 수 있게 합니다. 이 포드는 헬리콥터의 공격 능력을 크게 높여, 다양한 전투 상황에서 효과적인 교전을 가능하게 합니다."
