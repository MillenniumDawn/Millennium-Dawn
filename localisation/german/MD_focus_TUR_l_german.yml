 TurkicConfederation.11.d: "Die aserbaidschanische Regierung hat unser Angebot angenommen, der Türkischen Konföderation beizutreten. Wir werden endlich mit unseren Brüdern in Aserbaidschan vereinigt sein!"
 TurkicConfederation.11.a: "Gute Nachrichten für die Türkische Konföderation"
 TurkicConfederation.21.t: "Kasachstan tritt bei!"
 TurkicConfederation.21.d: "Die kasachische Regierung hat unser Angebot angenommen, der Türkischen Konföderation beizutreten. Wir werden endlich mit unseren Brüdern in Kasachstan vereint sein!"
