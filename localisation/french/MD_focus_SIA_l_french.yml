 SIA_outlook_nationalist_tt: "£nationalist_outlook_campaign_cost_modifier_texticon §YOrientation nationaliste§! popularité : [?temp_outlook_increase|%+]\n"
 SIA_coup_risk_increase_tt: "§RRisque de coup d'État [?coup_delta|0+]§! (désormais §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_decrease_tt: "§GRisque de coup d'État [?coup_delta|0+]§! (actuellement §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_coup_risk_reset_tt: "Le coup réussit. Le risque de coup est remis à zéro sous le régime militaire."
 SIA_army_patience_exhausted_tt: "La patience de l'armée est épuisée : risque de coup au-dessus de 60, après le 1er janvier 2010."
 SIA_ds_force_track_increase_tt: "Progress toward a forced resolution: §Y[?ROOT.SIA_ds_force_track|0]§!/4. Ending it that way also needs intensity and grievance below §Y30§!."
 SIA_ds_peace_track_increase_tt: "Progress toward a negotiated settlement: §Y[?ROOT.SIA_ds_peace_track|0]§!/2, which opens the §YOpen Peace Dialogue§! decision."
 SIA_reform_pressure_increase_tt: "§RPression de réforme [?reform_delta|0+]§! (désormais §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_reform_pressure_decrease_tt: "§GPression réformiste [?reform_delta|0+]§! (actuellement §Y[?ROOT.SIA_reform_pressure|0]§!/100)"
 SIA_engage_reform_movement: "Engager le mouvement réformateur"
 SIA_engage_reform_movement_desc: "Inviter les syndicats étudiants et le caucus réformateur à la table, financer un programme d'emplois pour la jeunesse, laisser les caméras voir la poignée de main. Les rues s'apaisent. Faire asseoir le mouvement à la table le rend aussi respectable, et Move Forward y gagne."
 SIA_rural_development_package: "Plan de développement rural"
 SIA_rural_development_package_desc: "Fonds villageois, un plancher de prix du riz, un allègement de la dette agricole et une nouvelle route vers le chef-lieu. Un paiement du Trésor achète une année où la campagne cesse d'écouter la machine populiste."
 SIA_rural_package_active: "Plan de développement rural"
 SIA_rural_package_active_desc: "Les fonds villageois se déboursent, le plancher de prix tient et les équipes routières de district travaillent. Les biens de consommation coûtent un peu plus tant que cela dure, et pour cette année la campagne est au gouvernement."
 SIA_palace_bargain: "Faites une bonne affaire avec le palais"
 SIA_palace_bargain_desc: "Un coup réglé par négociation. Plutôt que d'attendre les chars, donnez au palais et à ses généraux ce qu'ils prendraient de toute façon. L'establishment royaliste entre au gouvernement comme partenaire senior, notre parti garde ses sièges et perd sa primauté, et le Royaume tourne sans un coup de feu."
 SIA_face_the_court: "Affronter la Cour constitutionnelle"
 SIA_face_the_court_desc: "Remettre le sort du parti au pouvoir aux juges, comme la Thaïlande le fait depuis deux décennies. Contrairement à un marché de palais, c'est un pari, pas un règlement : le banc décide. Se soumettre à une dissolution et céder le pouvoir à nos rivaux, ou défier le verdict et payer en stabilité et en patience de l'armée."
 SIA_pack_the_senate: "Saturer le Sénat"
 SIA_pack_the_senate_desc: "Remplir la chambre haute et les agences indépendantes de loyalistes jusqu'à ce que plus rien ne contrôle le gouvernement. Les projets de loi passent sans opposition pendant six mois. Pour les généraux, c'est une prise de pouvoir au grand jour."
 SIA_populist_trunk_entry_tt: "§Y[neutral_Social_L]§! est le parti au pouvoir."
 SIA_democrat_trunk_entry_tt: "§Y[conservatism_L]§! est le parti au pouvoir."
 SIA_telecom_excise_favor: "Le basculement de l'accise télécoms"
 SIA_telecom_excise_favor_desc: "Convertir les redevances de concession télécoms en une taxe d'accise, structurée pour qu'AIS, propriété de la famille, garde son avance et que les nouveaux entrants héritent de la charge. Le Trésor et une base d'entreprises reconnaissante vous récompensent tous deux. Le haut commandement note que l'État est géré pour le bilan d'une seule famille. §RLe risque de coup monte.§!"
 SIA_exim_myanmar_loan: "Prêt EXIM à Rangoun"
 SIA_exim_myanmar_loan_desc: "Étendre un prêt d'État souple à la junte du Myanmar, affecté, commodément, à l'achat de services satellites et télécoms auprès de Shin Satellite de la famille. Un geste de politique étrangère qui fait aussi office de contrat soigné pour la firme familiale. Un conflit d'intérêts de manuel que les généraux ne manquent pas. §RLe risque de coup monte.§!"
 SIA_state_lottery_scheme: "La loterie d'État"
 SIA_state_lottery_scheme_desc: "Replier le jeu de numéros clandestin dans un schéma d'État. Du cash hors budget pour le patronage et les projets de prédilection, populaire auprès des parieurs, et le genre de fonds non accountable que chaque manifeste de coup liste en premier."
 SIA_democrat_machine_category: "La machine du parti"
 SIA_democrat_machine_category_desc: "The Democrats' edge is organization, but Thaksin's machine is always one rural landslide from returning to power. Work the constituencies to hold the line.\n\n§YPopulist Tide§!: [?ROOT.SIA_pheu_thai_pressure|0]/100. It climbs 1 a week, faster in a downturn or when stability slips, and a booming economy with a calm country still leaves it drifting up. Pushing it back down takes the decisions below, the Isaan beachhead, or a Rural Development Package. Above 35 it costs stability and growth. Above 70 it costs a great deal more."
 SIA_constituency_machine: "Travailler les circonscriptions"
 SIA_constituency_machine_desc: "Renvoyer les élus dans leurs districts pour tenir des permanences, réparer les égouts, régler les litiges et se souvenir des noms. Travail terne, et le seul qui tienne un siège. §YLa popularité du Parti démocrate monte§! et la marée populiste s'apaise."
 SIA_pt_pressure_increase_tt: "§RPMarée populiste [?pt_delta|0+]§! (maintenant §Y[?ROOT.SIA_pheu_thai_pression|0]§!/100)"
 SIA_pt_pressure_decrease_tt: "§GVague populiste [?pt_delta|0+]§! (actuellement §Y[?ROOT.SIA_pheu_thai_pressure|0]§!/100)"
 SIA_match_the_populists: "Égaler les populistes"
 SIA_match_the_populists_desc: "Si vous ne pouvez battre le fonds villageois, construisez-en un meilleur. Soins bon marché, allègement de la dette et crédit rural sous bannière démocrate. Cela draine le Trésor et enlève le sujet à Pheu Thai."
 SIA_expose_corruption: "Exposer le réseau"
 SIA_expose_corruption_desc: "Tourner les agences anticorruption et les cours contre la machine populiste. Affaires d'actifs, enquêtes d'achat de voix, et les longs combats judiciaires qui ont déjà fait tomber plus d'un gouvernement thaksiniste."
 SIA_broaden_the_coalition: "Élargir la coalition"
 SIA_broaden_the_coalition_desc: "Remettre des ministères aux petits partis et aux chefs provinciaux en échange de leurs sièges. Le prix est un cabinet fractieux et marchandeur (§Rles exigences de la coalition§!), mais cela bâtit un pare-feu parlementaire qu'aucun raz-de-marée populiste unique ne peut briser. §GLa marée populiste recule nettement.§!"
 SIA_counter_messaging: "Contrer le message populiste"
 SIA_counter_messaging_desc: "Répondre à la ligne populiste là où les gens l'entendent vraiment : les talk-shows du matin, les tours de diffusion villageoises, les salles syndicales. Une petite poussée, répétable, et elle entame l'élan de Pheu Thai."
 SIA_reconstruction_category: "Développer les terres recouvrées"
 SIA_reconstruction_category_desc: "Le territoire pris sur la frontière occidentale ou dans les campagnes d'hégémonie de l'ASEAN est tenu mais pas encore intégré. Pacifiez les provinces, versez-y de l'argent de reconstruction, et une fois assez calmes, réclamez-les pour la nation sans détour."
 SIA_reconstruction_pacify: "Pacifier les provinces"
 SIA_reconstruction_pacify_desc: "Inonder les provinces occupées d'administrateurs, d'informateurs et de programmes d'amnistie. La conformité monte dans chaque province que nous tenons mais n'avons pas encore intégrée. Travail lent et patient, mais c'est le sol sur lequel tout le reste se bâtit."
 SIA_reconstruction_develop: "Fonds pour les travaux de reconstruction"
 SIA_reconstruction_develop_desc: "Libérer de l'argent de reconstruction pour les routes, l'électricité et les travaux publics à travers les terres recouvrées. Les créneaux d'infrastructure et de construction montent dans chaque province tenue, les liant à l'économie nationale et donnant à la population un enjeu dans la règle thaïlandaise."
 SIA_reconstruction_integrate: "Proclamer les provinces réunifiées"
 SIA_reconstruction_integrate_desc: "Là où la conformité est assez haute, l'occupation s'achève et les provinces deviennent sol thaïlandais. Chaque province pacifiée que nous tenons est cored dans le Royaume, un gain permanent qu'aucune conférence de paix ne peut défaire."
 SIA_ghosts_5pct_tt: "§Y[communist_state_L]§! has at least 5% popularity."
 SIA_reform_5pct_tt: "§Y[socialism_L]§! a au moins 5 % de popularité."
 SIA_reform_trunk_entry_tt: "§Y[socialism_L]§! est le parti au pouvoir."
 SIA_communist_trunk_entry_tt: "§Y[communist_state_L]§! is the ruling party."
 SIA_seize_power_gate_tt: "§YGeneral strikes§! has capitulated the government, or §Ythe civil war§! is won."
 SIA_strike_momentum_tt: "§RÉlan de grève [?strike_delta|0+]§! (actuellement §Y[?ROOT.SIA_strike_momentum|0]§!/100). À 100 le gouvernement capitule."
 SIA_strike_mass_pickets: "Piquets de masse"
 SIA_strike_mass_pickets_desc: "Tens of thousands of strikers occupy the picket lines outside their workplaces and hold the city intersections for days at a time. Mass picketing is the instrument the strike committee can repeat most often, and it keeps workplaces closed for as long as the lines hold.\n\nRuns for §Y7 days§!, then repeatable §Y20 days§! after it ends. Closes shop floors and retail takings for 30 days."
 SIA_strike_paralyze_transport: "Paralyze the Ports and Rails"
 SIA_strike_paralyze_transport_desc: "The strike fund pays dockers and railway workers to stop working, which stops freight from passing through the ports and along the supply chain. This is the most damaging action available to the movement and also the most expensive to sustain, since the fund covers the strikers' wages for as long as the stoppage lasts.\n\nRuns for §Y7 days§!, then repeatable §Y30 days§! after it ends. Destroys a level of infrastructure and halts resource output for 30 days."
 SIA_strike_win_the_conscripts: "Gagner les conscrits"
 SIA_strike_win_the_conscripts_desc: "Organizers enter the conscript barracks to argue against the use of the army on demonstrators. The Royal Thai Army fills its ranks by annual lottery, drawing heavily on the rural Northeast that the party has spent years organizing, which leaves the conscripts more receptive than their officers. Every unit whose reliability becomes doubtful narrows the government's options.\n\nRuns for §Y7 days§!, then repeatable §Y30 days§! after it ends. Diverting organizers to the barracks costs §Rpolitical power gain§! for 90 days."
