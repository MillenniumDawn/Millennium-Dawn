 pak_raj_border_claim.1.a:0 "Ceder o estado disputado"
 pak_raj_border_claim.1.b:0 "Rejeitar a reivindicação"
 pak_raj_border_crisis.1.t:0 "Eclode uma Crise de Fronteira"
 pak_raj_border_crisis.1.d:0 "Nossa reivindicação territorial rejeitada endureceu e virou uma crise diplomática e militar. A mobilização pode forçar concessões, mas também estreita o caminho de volta."
 pak_raj_border_crisis.1.a:0 "Mobilizar a fronteira"
 pak_raj_border_crisis.1.b:0 "Recuar discretamente"
 pak_raj_border_crisis.2.t:0 "O Rival se Mobiliza"
 pak_raj_border_crisis.2.d:0 "Forças rivais estão se deslocando para a fronteira. Podemos contramobilizar ou buscar negociações antes que a crise se torne mais difícil de conter."
 pak_raj_border_crisis.2.a:0 "Contramobilizar"
 pak_raj_border_crisis.2.b:0 "Buscar negociações imediatas"
 pak_raj_border_crisis.3.t:0 "Um Ultimato Territorial"
 pak_raj_border_crisis.3.d_420:0 "[FROM.GetNameDefCap] exige Azad Caxemira e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.d_427:0 "[FROM.GetNameDefCap] exige Jammu e Caxemira e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.d_429:0 "[FROM.GetNameDefCap] exige o Punjab Oriental e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.d_563:0 "[FROM.GetNameDefCap] exige o Punjab Central e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.d_573:0 "[FROM.GetNameDefCap] exige o Punjab Meridional e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.d_426:0 "[FROM.GetNameDefCap] exige Sindh e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.d_987:0 "[FROM.GetNameDefCap] exige Guzerate Ocidental e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.d_984:0 "[FROM.GetNameDefCap] exige o Rajastão Ocidental e ameaça uma guerra limitada se recusarmos."
 pak_raj_border_crisis.3.a:0 "Aceitar e retirar-se"
 pak_raj_border_crisis.3.b:0 "Rejeitar o ultimato"
 pak_raj_border_crisis.4.t:0 "Ultimato Rejeitado"
 pak_raj_border_crisis.4.d:0 "O rival recusou nossa exigência. Devemos impor a reivindicação contra o estado disputado ou absorver o custo político de recuar."
 pak_raj_border_crisis.4.a:0 "Forçar a questão"
 pak_raj_border_crisis.4.b:0 "Recuar"
 pak_raj_border_crisis.5.t:0 "Um Sinal Nuclear"
 pak_raj_border_crisis.5.d:0 "Os planejadores militares propõem uma mudança visível na prontidão nuclear para demonstrar determinação. A contenção reduziria as tensões, mas poderia ser lida como fraqueza."
 pak_raj_border_crisis.5.a:0 "Elevar a prontidão nuclear"
 pak_raj_border_crisis.5.b:0 "Manter a contenção"
 pak_raj_border_crisis.6.t:0 "O Rival Sinaliza Prontidão"
 pak_raj_border_crisis.6.d:0 "O rival elevou visivelmente sua prontidão nuclear. Igualar a postura criaria um impasse nuclear, enquanto a contenção reduziria a tensão imediata."
 pak_raj_border_crisis.6.a:0 "Responder na mesma moeda"
 pak_raj_border_crisis.6.b:0 "Desescalar unilateralmente"
 pak_raj_border_crisis.7.t:0 "Um Pedido de Mediação"
 pak_raj_border_crisis.7.d:0 "A crise indo-paquistanesa ameaça a estabilidade regional. Diplomatas americanos podem oferecer um canal para um recuo negociado."
 pak_raj_border_crisis.7.a:0 "Oferecer mediação"
 pak_raj_border_crisis.7.b:0 "Ficar de fora"
 pak_raj_border_crisis.8.t:0 "Mediação Americana"
 pak_raj_border_crisis.8.d:0 "Os Estados Unidos se ofereceram para intermediar um recuo mútuo. A aceitação encerraria a crise e reduziria a tensão bilateral."
 pak_raj_border_crisis.8.a:0 "Aceitar a mediação"
 pak_raj_border_crisis.8.b:0 "Rejeitar interferência externa"
 pak_raj_border_crisis.9.t:0 "A Crise Passa"
 pak_raj_border_crisis.9.d:0 "O confronto imediato terminou sem guerra aberta. As forças ao longo da fronteira estão voltando à prontidão de rotina."
 pak_raj_border_crisis.9.a:0 "Entendido"
 pak_raj_border_crisis.10.t:0 "Uma Vitória Diplomática"
 pak_raj_border_crisis.10.d:0 "O rival cedeu o estado disputado. O confronto terminou nos nossos termos."
 pak_raj_border_crisis.10.a:0 "Consolidar a vitória"
 pak_raj_border_crisis.11.t:0 "A Reivindicação Caducou"
 pak_raj_border_crisis.11.d:0 "O controle do estado disputado mudou antes que a crise pudesse ser resolvida. A exigência territorial não é mais válida."
 pak_raj_border_crisis.11.a:0 "Encerrar o assunto"
 raj_chi_border_crisis.2.t:0 "Uma Exigência Territorial"
 raj_chi_border_crisis.2.d_475:0 "[FROM.GetNameDefCap] usou repetidas vitórias locais para exigir Arunachal Pradesh. A concessão transferiria o estado e acalmaria a fronteira, enquanto a recusa arrisca uma guerra limitada."
 raj_chi_border_crisis.2.d_982:0 "[FROM.GetNameDefCap] usou repetidas vitórias locais para exigir Sikkim. A concessão transferiria o estado e acalmaria a fronteira, enquanto a recusa arrisca uma guerra limitada."
