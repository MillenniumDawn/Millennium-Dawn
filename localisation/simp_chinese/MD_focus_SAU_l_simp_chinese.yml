 SAU_events.350.t: "沙特阿拉伯请求购买德国坦克"
 SAU_events.351.a: "批准销售"
 SAU_events.351.b: "拒绝请求"
 SAU_events.351.desc: "沙特阿拉伯已向美国造船厂提出建造一艘现代化护卫舰的请求，该舰将为沙特皇家海军服役。这份合同将深化与利雅得的海军合作。"
 SAU_events.351.t: "沙特阿拉伯请求购买美国护卫舰"
 SAU_events.352.a: "批准销售"
 SAU_events.352.b: "拒绝请求"
 SAU_events.352.desc: "沙特阿拉伯已向俄罗斯造船厂提出建造一艘现代化护卫舰的需求，该舰将为沙特皇家海军服务。这份合同将为俄罗斯军舰开拓海湾地区的新市场。"
 SAU_events.352.t: "沙特阿拉伯请求购买俄罗斯护卫舰"
 SAU_events.353.a: "批准销售"
 SAU_events.353.b: "拒绝请求"
 SAU_events.353.desc: "沙特阿拉伯已向法国造船厂提出建造一艘现代化护卫舰的请求，该舰将用于沙特皇家海军。这份合同将延续沙特与利雅得之间长期的防务合作关系。"
 SAU_events.353.t: "沙特阿拉伯请求购买法国护卫舰"
