 CRO_political.1.t: "Гаага предъявила обвинение Готовине"
 CRO_political.1.d: "Международный трибунал по бывшей Югославии обнародовал обвинительное заключение против генерала Анте Готовины по преступлениям, совершенным во время операции «Буря». Он исчез до того, как его удалось арестовать. Ассоциации ветеранов проводят акции протеста, а Брюссель ясно дал понять, что сотрудничество с трибуналом является условием европейской интеграции."
 CRO_political.1.a: "Мы должны сотрудничать с трибуналом."
 CRO_political.1.b: "Хорватия не выдаёт своих героев."
 CRO_political.2.t: "Готовина арестован на Тенерифе"
 CRO_political.2.d: "Испанская полиция арестовала Анте Готовину в ресторанчике отеля на Канарских островах после четырёх лет в бегах. Информация, предоставленная Загребом, помогла выследить его. Ветераны зажигают свечи на главной площади, но последнее препятствие на пути в Европу устранено."
 CRO_political.2.a: "Болезненный, но необходимый шаг"
 CRO_political.3.t: "Заявка на членство в Европейском Союзе"
 CRO_political.3.d: "Премьер-министр Ивица Рачан официально подал в Афинах заявку Хорватии на членство в Европейском союзе. Правительство надеется догнать волну расширения ЕС, уже охватившую северных соседей, и окончательно оставить позади войны прошлого десятилетия."
 CRO_political.3.a: "Наше место — в Европе."
 CRO_political.4.t: "Переговоры о вступлении в ЕС открыты."
 CRO_political.4.d: "После того как главный прокурор подтвердил полное сотрудничество Хорватии с трибуналом, Европейский союз начал переговоры о вступлении. Проверка хорватского законодательства на соответствие acquis communautaire начинается немедленно, и иностранные инвесторы обращают на это внимание."
 CRO_political.4.a: "Начинается проверка"
 CRO_political.5.t: "Приглашение на Бухарестском саммите"
 CRO_political.5.d: "На саммите НАТО в Бухаресте Хорватии и Албании было направлено официальное приглашение. Протоколы о вступлении должны быть подписаны в течение года. Приглашение является наградой за десятилетие реформ в сфере обороны и укрепляет позиции Хорватии в западном альянсе."
 CRO_political.5.a: "Место за столом"
 CRO_political.6.t: "Дело Ina-MOL"
 CRO_political.6.d: "Бывший премьер-министр Иво Санадер был арестован в Австрии после того, как скрылся от правосудия. Следователи утверждают, что он получил взятку от венгерской нефтяной компании MOL за передачу прав управления национальной нефтяной компанией Ina. Дело затрагивает высшие эшелоны правящей партии."
 CRO_political.6.a: "Никто не стоит выше закона."
 CRO_political.6.b: "Сдержать распространение ущерба"
 CRO_political.7.t: "Готовина оправдан по апелляции"
 CRO_political.7.d: "Апелляционная палата МТБЮ отменила обвинительные приговоры в отношении генералов Анте Готовины и Младена Маркача и распорядилась об их немедленном освобождении. Главная площадь Загреба заполнилась толпами, приветствующими их возвращение домой. В Белграде и Баня-Луке это решение вызвало волну возмущения."
 CRO_political.7.a: "Генералы возвращаются домой"
 CRO_political.8.t: "Добро пожаловать в Европейский Союз!"
 CRO_political.8.d: "В полночь Хорватия стала 28-м государством-членом Европейского союза, завершив двенадцатилетний процесс вступления, который длился при шести правительствах. Таможенные посты на словенской и венгерской границах демонтируются."
 CRO_political.8.a: "Европейское будущее"
 CRO_political.9.t: "Шенгенская зона и евро"
 CRO_political.9.d: "Хорватия в один и тот же день приняла евро и вошла в Шенгенскую зону, став первым государством-членом, выполнившим оба шага одновременно. Пограничный контроль с остальными странами блока отменён, и куна уходит в историю. Туристическая индустрия ожидает рекордного сезона."
 CRO_political.9.a: "Наконец-то полная интеграция!"
 CRO_political.10.t: "Герцег-Босния провозглашает независимость"
 CRO_political.10.d: "Хорватские кантоны Герцеговины провозгласили самоуправляющуюся Герцег-Боснию и разорвали связи с Сараево. Загребу предстоит решить, насколько далеко он готов зайти в поддержке отколовшегося государства."
 CRO_political.10.a: "Признать Герцег-Боснию"
 CRO_political.10.b: "Оказать негласную поддержку"
