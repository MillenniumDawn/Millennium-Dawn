 gaddafi_family_lose_master_maneuverer_tt: "traci cechę §YMmistrz manewru§!"
 gaddafi_family_lose_vain_football_star_tt: "traci cechę §YVain Football Star§!"
 gaddafi_family_lose_substance_abuser_tt: "traci cechę §YNałogowiec§!"
 gaddafi_family_lose_suspected_revolutionary_tt: "traci cechę §YPodejrzewa się o rewolucjonistę§!"
 gaddafi_family_lose_77th_tank_battalion_tt: "traci cechę §Y77. batalion czołgów§!"
