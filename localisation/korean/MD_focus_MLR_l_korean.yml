l_korean:
 malorossiya_focus: "말로로시야 중점"
 MLR_ukr_modifier: "말로로시야 정치"
 MLR_ukr_modifier_desc: "말로로시야는 비교적 최근에 만들어진 국가로, 내정과 외교가 완전히 모스크바에 종속되어 있지만 그럼에도 국내외 정책에서 큰 자율성을 가지고 있습니다."
 MLR_start: "도래할 말로로시야"
 MLR_start_desc: "마침내 이 땅의 참된 상속자인 말로로시야가 스스로 권력을 손에 쥘 것입니다"
 MLR_fsb: "FSB와의 협력"
 MLR_fsb_desc: "유감스럽게도 아직 우리 자체의 특수 기관을 만들 여건이 되지 않으므로, 러시아 FSB와의 협력에 의존할 것입니다"
 MLR_mvd: "지역 내무부 예속"
 MLR_mvd_desc: "우크라이나 정권 아래 있던 지역 내무부 기관들을 우리 휘하에 예속시킬 것입니다"
 MLR_ter_defence: "영토 방위대"
 MLR_ter_defence_desc: "지역 민병대를 토대로 영토 방위대를 창설할 것입니다"
 MLR_contract_army: "계약 군 제도"
 MLR_contract_army_desc: "우리 군대는 계약제에 따라 창설될 것입니다"
 MLR_defence_doctrine: "방어 교리"
 MLR_defence_doctrine_desc: "우리는 누구도 공격하지 않으며, 우리의 임무는 국경을 방어하는 것입니다. 우리 군은 방어 전술 교리를 채택할 것입니다"
 MLR_nat_guard: "말로로시야 국가방위군"
 MLR_nat_guard_desc: "한때 우크라이나는 90년대에 국가방위군을 보유했습니다. 우리는 이 부대를 다시 창설하되 우리의 지휘 아래 둘 것입니다"
 MLR_defence_prom: "군수 산업"
 MLR_defence_prom_desc: "우리는 영토 내 군수 산업 복구에 막대한 자금을 투자할 것입니다. 우리에게는 강한 군대가 필요합니다"
 MLR_rebuild_war_academy: "군사 학교"
 MLR_rebuild_war_academy_desc: "우리 전사들은 조국을 지키기 위해 최고의 훈련을 받아야 합니다. 따라서 우리 영토에 사관학교를 부활시킬 것입니다"
 MLR_no_corrupt_military: "군 내 부패 대폭 감소"
 MLR_no_corrupt_military_desc: "우리 군은 아직 젊기 때문에 그 안의 부패를 없애기가 훨씬 쉽습니다"
 MLR_nation_quest: "민족 문제"
 MLR_nation_quest_desc: "말로로시야는 러시아의 일부였고 앞으로도 그러할 것입니다. 이것이 민족 문제에 대한 우리의 답입니다"
 MLR_referendum: "말로로시야의 운명에 관한 국민투표"
 MLR_referendum_desc: "우리 나라가 어느 길로 갈지 결정해야 하는 운명의 순간이 왔습니다. 공화국의 형태로 러시아의 온전한 일부가 될 것인지, 아니면 연방 국가의 길을 택할 것인지"
 MLR_ruble: "국가 통화로서의 루블"
 MLR_ruble_desc: "루블이 우리의 국가 통화가 될 것이며, 이를 의심한 이는 아무도 없었습니다"
 MLR_corruption: "부패와의 전쟁"
 MLR_corruption_desc: "우리 국가는 아직 젊지만 부패한 관리들이 벌써 생겨났습니다. 이를 처리해야 합니다"
 MLR_rus_invest: "러시아의 투자"
 MLR_rus_invest_desc: "러시아가 투자로 우리를 지원합니다"
 MLR_build_zavods: "공장 건설"
 MLR_build_zavods_desc: "나라에는 공장, 또 공장이 필요하며, 우리는 국민에게 필요한 모든 것을 제공할 것입니다"
 MLR_social_invest: "사회 분야 투자"
 MLR_social_invest_desc: "우리 시민은 최고 수준의 의료 시설을 이용할 수 있어야 하며 모든 사회적 보장을 누려야 합니다"
 MLR_infrastructure: "인프라 투자"
 MLR_infrastructure_desc: "도로는 우리 국가의 혈관입니다"
 MLR_fight_oligarch: "올리가르히와의 전쟁"
 MLR_fight_oligarch_desc: "우리의 젊은 국가에서도 전쟁 중에 막대한 돈을 번 부패한 과두 재벌들이 이미 나타나기 시작했습니다. 이들을 처리합시다."
 MLR_it_invest: "IT 투자"
 MLR_it_invest_desc: "우리나라의 성공적인 발전을 위해 IT 기술에 투자할 것입니다"
 MLR_maloross_economy: "말로로시야 경제"
 MLR_maloross_economy_desc: "우리의 경제 조치는 경제 성장으로 이어졌습니다"
 MLR_union_state: "연방 국가"
 MLR_union_state_desc: "우리는 연방 국가의 길을 택했습니다"
 MLR_union_group_army: "연합 군 집단"
 MLR_union_group_army_desc: "우리 병사들은 연방 국가 연합 군 집단의 일원이 될 것입니다"
 MLR_union_group_economic: "연방 국가의 투자"
 MLR_union_group_economic_desc: "연방 국가 회원 자격은 우리 경제에 긍정적인 영향을 미쳤습니다"
 MLR_union_health_social: "사회 및 의료 분야 협력"
 MLR_union_health_social_desc: "연방 국가 구성원들은 사회 및 의료 분야에서 적극적으로 협력합니다"
 MLR_republic_rf: "우리는 러시아의 일부다"
 MLR_republic_rf_desc: "우리는 러시아의 공화국이 되었으며, 이제 우리의 운명은 러시아와 이어져 있습니다"
 MLR_rus_regions: "러시아 지방과의 협력"
 MLR_rus_regions_desc: "우리는 러시아의 다른 지방과 적극적으로 협력할 것입니다"
 MLR_rus_companies: "러시아 기업과의 협력"
 MLR_rus_companies_desc: "러시아 기업이 우리의 주요 파트너가 될 것입니다"
 MLR_integrate_army: "러시아군에 통합"
 MLR_integrate_army_desc: "우리 군을 러시아군의 기준에 맞출 것입니다"
 MLR_ter_oborona_tt: "말로로시야의 §Y영토 방위대§!가 창설됩니다"
 MLR_nat_gurad_tt: "말로로시야의 §Y국가방위군§!이 창설됩니다"
 MLR_manifest_decisions: "말로로시야 선언문"
 MLR_manifest_decisions_desc: "\n\n\n\n\n\n£SOV_desctext_moa\n\n\n\n\n\n\n\n\n이 땅은 한때 말로로시야에 속해 있었으며, 우리는 이를 우리의 것이라 선언하고 조국으로 돌려놓기 위해 싸울 것입니다"
 MLR_kirov_core: "키로보그라드 영유권"
 MLR_kiev_core: "키이우 영유권"
 MLR_poltava_core: "폴타바 영유권"
 MLR_constitution: "말로로시야 헌법"
 MLR_constitution_desc: "우리는 국가의 입법 체계를 공식화해야 합니다. 이를 위해 우리 자체의 헌법을 채택할 것입니다."