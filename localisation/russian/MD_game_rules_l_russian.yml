 MD_AI_RULES: "Настройки ИИ "
 MD_PEACE_DEALS: "Мирные конференции"
 MD_FOCUS_TREE_RULES: "Настройки деревьев фокусов"
 MD_FORMABLE_RULES: "Флаги и формируемые страны"
 MD_ORGANISATION_RULES: "Настройки организаций"
 MD_INFLUENCE_RULES: "Настройки системы влияния"
 MD_OPTIMISATION_RULES: "Оптимизация и производительность"
 MD_NUCLEAR_RULES: "Ядерные правила"
 MD_RULES: "Прочие правила"
 MD_CHEAT_RULES: "Настройки читов"
 MD_RANDOM_RULES: "Рандомайзер игровых правил"
 RULE_HARD_AI_ECONOMIC: "Экономический ИИ"
 RULE_DISABLE_HARD_AI_ECONOMIC: "Стандартное ограничение"
 RULE_DISABLE_HARD_AI_ECONOMIC_DESC: "Стандартное ограничение для ИИ, не позволяющее ему усиливать свою экономику. Для историчной игры"
 RULE_ENABLE_HARD_AI_ECONOMIC: "Без ограничений"
 RULE_ENABLE_HARD_AI_ECONOMIC_DESC: "Если тебе наскучило, что каждую игру ИИ не выходит из экономического кризиса - это для тебя. ИИ больше не ограничен в принятии решений о своей экономике. Будь готов, что многие страны станут богаче твоей. Только для тех, кто не боится сложностей. Привет от разработчика Battle AI ;)"
 RULE_DISABLE_AI_DEBT_WAR_TITLE: "Долговые войны для ИИ"
 RULE_DISABLE_AI_DEBT_WAR: "Выключено"
 RULE_DISABLE_AI_DEBT_WAR_DESC: "Это отключает функцию долговой войны для ИИ. ИИ больше не будет принимать решение о вторжении в страну, которая не выполняет свои долговые обязательства."
 RULE_ENABLE_AI_DEBT_WAR: "Включено"
 RULE_ENABLE_AI_DEBT_WAR_DESC: "Такая установка сделает ИИ более склонным к объявлению долговых войн."
 RULE_ENABLE_AI_FIGHTING_AUTONOMY_FOCUS: "ИИ использует §Tфокус на повышение автономии§!"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS: "Включено"
 RULE_ENABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "ИИ будет бороться с вашей автономностью, используя постоянный фокус §Yувеличение автономии§!."
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS: "Отключено"
 RULE_DISABLE_FIGHTING_AUTONOMY_FOCUS_DESC: "ИИ больше не будет бороться с вашей автономностью, используя постоянный фокус §Yувеличение автономии§!."
 RULE_ALLOW_CHAOTIC_PEACE_CONFERENCE: "Включить хаотичные мирные конфиренции"
 RULE_OPTION_CHAOTIC_PC_NO: "Нет"
 RULE_OPTION_CHAOTIC_PC_NO_DESC: "Эта опция, надеюсь, остановит всех от захвата земель в мирных конференциях ИИ.\nЭта опция ограничивает тех, кто может претендовать на государства, мажорами и лидерами фракций. (Это повлияет только на ИИ, а не на игрока)."
 RULE_OPTION_CHAOTIC_PC_YES: "Да"
 RULE_OPTION_CHAOTIC_PC_YES_DESC: "Для тех, кто действительно наслаждается проклятыми мирными конференциями, зачем ограничивать мир 1 §YРоссией§! когда можно провести 12 §YРоссий§!.\n(Я не несу ответственности за результаты, которые могут произойти от этого варианта!)"
 RULE_ALLOW_PLAYER_LED_PEACE_CONFERENCE: "Включить мирные конференции под руководством игроков"
 RULE_OPTION_PLAYER_LED_PC_NO: "Нет"
 RULE_OPTION_PLAYER_LED_PC_NO_DESC: "Эта опция позволит ИИ делать свой собственный выбор, каким бы глупым он ни был."
 RULE_OPTION_PLAYER_LED_PC_YES: "Да"
 RULE_OPTION_PLAYER_LED_PC_YES_DESC: "Для тех, кто не доверяет ИИ вставлять круглый колышек в круглое отверстие, это позволит только игрокам делать заявления во время мирных конференций."
 RULE_SALAFIST_BRANCH: "Активировать подразделение салафитов"
 RULE_YES_SALAFIST_BRANCH_DESC: "Включает ветку салафитов в общем дереве для всех стран, независимо от начальной религии."
 RULE_NO_SALAFIST_BRANCH_DESC: "Включает ветку салифотов в общем дереве для стран, следующих любой разновидности ислама."
 CUB_AI_BEHAVIOR: "@CUB Куба"
 RULE_OPTION_DEMOCRAT: "Склонность к демократам"
 RULE_OPTION_DEMOCRAT_AI_DESC: "Он §8Демократическая партия§! Вашингтон контролирует Белый дом и Конгресс и управляет страной из левоцентристской позиции на протяжении целого поколения. Вашингтон тратит деньги внутри страны и руководит за рубежом посредством институтов, а не силой."
 RULE_OPTION_REPUBLICAN: "Склонность к республиканцам"
 RULE_OPTION_REPUBLICAN_AI_DESC: "Он §8Республиканская партия§! Вашингтон контролирует Белый дом и Конгресс и управляет страной из правоцентристского лагеря на протяжении целого поколения. Вашингтон сокращает расходы внутри страны и поддерживает мировой порядок с помощью вооружений."
 RULE_OPTION_REFORMED_REPUBLIC: "Реформированная республика"
 RULE_OPTION_REFORMED_REPUBLIC_AI_DESC: "Давление общественности приводит к проведению политической и избирательной реформы, которая предоставляет третьим партиям реальный доступ к избирательным бюллетеням и реальное представительство. Двухпартийная система разрушается, и американское правительство впервые становится проблемой коалиционного устройства."
 RULE_OPTION_POST_UNITED: "Пост Юнайтед Эра"
 RULE_OPTION_POST_UNITED_AI_DESC: "Федеральное правительство теряет контроль, и Соединенные Штаты распадаются на республики-преемницы, унаследовавшие их территорию. Северная Америка превращается в континент соперничающих американских штатов. §Rи этот путь нельзя совмещать с историческим правилом ИИ.§!."
 FIJ_AI_BEHAVIOR: "@FIJ Фиджи"
 NIG_AI_BEHAVIOR: "@NIG Нигерия"
 RULE_OPTION_FRA_HISTORICAL: "Исторический"
 RULE_OPTION_FRA_HISTORICAL_DESC: "Пятая республика продолжает свой курс, поскольку президентство переходит от Ширака к Саркози, затем к Олланду и Макрону. §8республиканцы§! и торговое представительство между ними. Франция является опорой европейской интеграции и сохраняет связь со сферой влияния Франции и Африки."
 BRM_AI_BEHAVIOR: "@BRM Мьянма"
 RULE_OPTION_NORTHERN_AMBITION: "Северные амбиции"
 RULE_OPTION_NORTHERN_AMBITION_AI_DESC: "Шведские националистические правые силы набирают силу и превращают северные настроения в программу объединения. Стокгольм стремится объединить Скандинавию и Прибалтику под властью восстановленной шведской империи, используя договоры там, где это возможно, и силу там, где это необходимо."
 SYR_AI_BEHAVIOR: "@SYR Сирия"
 RULE_OPTION_SYR_HISTORICAL: "Исторический ИИ"
 RULE_OPTION_SYR_HISTORICAL_DESC: "Хафез аль-Ассад сменит на этом посту его старший сын Башар аль-Ассад. Башар сохранит Сирию, как страну, связанную с Россией, со сбалансированным фокусом на дипломатию, военную и экономическую деятельность."
 RULE_OPTION_SYR_IRON_LADY: "Железная леди Сирии"
 RULE_OPTION_SYR_IRON_LADY_DESC: "Хафез аль-Ассад сменит на этом посту его дочь Бушра аль-Ассад. Бушра будет придерживаться более нейтрального подхода между великими державами с упором на дипломатию и экономику."
 RULE_OPTION_SYR_SYRIAN_SAVAGE: "Сирийский дикарь"
 RULE_OPTION_SYR_SYRIAN_SAVAGE_DESC: "Хафеза Асада сменяет его младший сын Махер, а не Башар, и армия полностью переходит под управление государства. Сирия перевооружается для создания Великой Сирии, и Левант получает агрессивную державу там, где раньше была осторожная."
 RULE_OPTION_SYR_NEW_ASSAD: "Новый Аль-Асад"
 RULE_OPTION_SYR_NEW_ASSAD_DESC: "Хафез аль-Ассад сменит на этом посту своего брата Рифаата аль-Ассада после Дамасской весны. Рифаат сосредоточится на просаудовской политике с упором на дипломатию и экономику."
 RULE_OPTION_SYR_DAMASCUS_SPRING: "Дамасская весна"
 RULE_OPTION_SYR_DAMASCUS_SPRING_DESC: "Он §8Дамасская весна§! Салоны никогда не закрываются, и реформаторы превращают период дебатов в смену правительства. Сирия становится функционирующей демократией, а баасистский режим теряет свою вторую столицу."
 BHR_AI_BEHAVIOR: "@BHR Бахрейн"
 SAU_AI_BEHAVIOR: "@SAU Саудовская Аравия"
 RULE_OPTION_RULE_BRITANNIA: "Правь, Британия!"
 RULE_OPTION_RULE_BRITANNIA_AI_DESC: "Сторонники короны разрушают двухпартийную систему, создают своё движение на фоне упадка страны и захватывают власть единолично. Империя восстанавливается силой, и Великобритания перестаёт быть младшим партнёром Вашингтона."
 BOT_AI_BEHAVIOR: "@BOT Ботсвана"
 NKO_AI_BEHAVIOR: "@NKO Северная Корея"
 SIN_AI_BEHAVIOR: "@SIN Сингапур"
 SER_AI_BEHAVIOR: "@SER Югославия"
 RULE_OPTION_MILOCEVIC_COMMI: "Милошевич - коммунист"
 RULE_OPTION_MILOCEVIC_COMMI_AI_DESC: "Слободан Милошевич выдерживает вызов своему правлению и возвращает страну к социализму, вместо того чтобы защищать остатки республики. Югославия восстанавливается как социалистическая федерация, и на Балканах вновь появляется марксистская сила."
 RULE_OPTION_MILOCEVIC_NATI: "Великая Сербия Милошевича"
 RULE_OPTION_MILOCEVIC_NATI_AI_DESC: "Слободан Милошевич выживает и превращает государство в центр проекта «Великая Сербия», претендуя на каждый район, где проживают сербы. Югославские войны возобновляются, а не улаживаются, и каждый сосед с сербским меньшинством становится мишенью."
 RULE_OPTION_MILOCEVIC_FEDERATION: "Балканская федерация Милошевича"
 RULE_OPTION_MILOCEVIC_FEDERATION_AI_DESC: "Слободан Милошевич выживает и возрождает §8Балканская Федерация§!Союз, который социалистам региона так и не удалось создать. Белград предлагает своим соседям членство, а не завоевание, и весь полуостров оказывается под одной крышей."
 RULE_OPTION_SERBIAN_KINGDOM: "Королевство Сербия"
 RULE_OPTION_SERBIAN_KINGDOM_AI_DESC: "Милошевич свергнут, и на его место приходят националисты и монархисты, устанавливая свою власть. §8Караджорджевич§! Династия вернулась в Белград. Сербия управляет страной посредством короны и церкви и отстаивает старые претензии более респектабельными средствами."
 RULE_OPTION_SERBIAN_LIBERALS: "Либеральная Сербия"
 RULE_OPTION_SERBIAN_LIBERALS_AI_DESC: "Реформаторы, свергнувшие Милошевича, сохранили страну и восстановили её как либеральную демократию. Сербия взяла курс на Европейский союз и уладила свои разногласия с соседями, вместо того чтобы затягивать их."
 UKR_AI_BEHAVIOR: "@UKR Украина"
 SPR_CONSERVATIVE_LEANINGS: "Консервативные взгляды"
 SPR_CONSERVATIVE_LEANINGS_DESC: "Он §8Народная партия§! А испанские правые силы в целом удерживают Кортес и управляют страной, придерживаясь рыночно-либеральной, атлантистской линии. Испания остается твердым членом НАТО и не склонным к авантюрам партнером в Брюсселе."
 SPR_RENACIMIENTO_NACIONALISTA: "Националистическое возрождение"
 SPR_RENACIMIENTO_NACIONALISTA_DESC: "§8Vox§! и националистические правые вырываются из маргинальных кругов и захватывают власть. Испания выступает против автономных сообществ и миграции, и оказывается вынужденной спорить с Брюсселем, а не следовать его указаниям."
 SPR_NACION_UNIDAD_IMPERIO: "Империя национального единства"
 SPR_NACION_UNIDAD_IMPERIO_DESC: "§8La Falange§! возвращается из политического забвения и восстанавливает испанское государство по национал-синдикалистской модели. Кортес уступает место вертикальным синдикатам, и Испания обращается к своей старой империи, а не к Европе."
 SPR_SOCIALISM_RISING: "Восход социализма"
 SPR_SOCIALISM_RISING_DESC: "Он §8Испанская социалистическая рабочая партия§! А левые силы в более широком контексте удерживают власть на протяжении целого поколения и продвигают государство всеобщего благосостояния дальше, чем любое правительство до них. Испания становится центром социал-демократической борьбы в Европе и увлекает за собой Средиземноморье."
 SPR_COMMUNIST_REVISIONISM: "Коммунистический ревизионизм"
 SPR_COMMUNIST_REVISIONISM_DESC: "Он §8Коммунистическая партия Испании§! Захватывает государство, которое социалисты не хотели брать, и республика восстанавливается по марксистским принципам. Испания покидает западный лагерь, и НАТО теряет свой южный фланг."
 SPR_THE_OLD_WAYS: "Старые пути"
 SPR_THE_OLD_WAYS_DESC: "Корона и церковь вновь оказываются в центре государства, и Испания приступает к восстановлению утраченной империи. Гибралтар, Магриб и старые вице-королевства рассматриваются скорее как незавершенные дела, чем как часть истории."
 GEO_AI_BEHAVIOR: "@GEO Грузия"
 GEO_NATIONALIST_behavior: "@GEO Националистическое поведение"
 GEO_help_CHE_behavior: "@GEO Помощь чеченцам"
 GEO_2008_war_behavior: "@GEO Поведение в войне 2008 года"
 GEO_WILL_FOLLOW_OWN_WAY: "Собственный путь"
 GEO_WILL_FOLLOW_OWN_WAY_DESC: "Националистическая Грузия пойдёт своим путём и сокрушит Армению и Азербайджан."
 GEO_WILL_BE_PRO_ARMENIA: "Проармянская позиция"
 GEO_WILL_BE_PRO_ARMENIA_DESC: "Националистическая Грузия поможет Армении сокрушить Азербайджан"
 GEO_WILL_BE_PRO_AZERI: "Проазербайджанская позиция"
 GEO_WILL_BE_PRO_AZERI_DESC: "Националистическая Грузия поможет Азербайджану сокрушить Армению"
 GEO_WILL_HELP: "Помочь @CHE чеченцам"
 GEO_WILL_HELP_DESC: "Грузия поможет чеченцам в войне с Россией. Они могут помочь Грузии в будущем."
 GEO_WONT_HELP: "Не помогать @CHE чеченцам"
 GEO_WONT_HELP_DESC: "Грузия не будет помогать чеченцам в войне с Россией. Они будут враждебно относиться к Грузии."
 GEO_ATTACK_RUS: "Подготовка к войне"
 GEO_ATTACK_RUS_DESC: "Грузия будет готова к войне 2008 года и постарается победить в ней."
 GEO_WEAKBOY: "Компромисс с Россией"
 GEO_WEAKBOY_DESC: "Грузия будет искать компромисс с Россией, чтобы избежать боевых действий."
 BLR_union_state_ai_behavior: "@BLR Поведение Союзного государства"
 BLR_WONT_FOLLOW_UNION_STATE: "Не следовать за Союзным государством"
 BLR_WONT_FOLLOW_UNION_STATE_DESC: "Беларусь не будет образовывать Союзное государство и не станет российской марионеткой."
 BLR_WILL_FOLLOW_UNION_STATE: "Образовать Союзное государство"
 BLR_WILL_FOLLOW_UNION_STATE_DESC: "Беларусь попытается создать Союзное государство. Сначала они станут российской марионеткой, но позже..."
 PMR_sub_behavior: "@PMR Подповедение Приднестровья"
 PMR_PASSIVE_DEFAULT: "Экономический приоритет"
 PMR_PASSIVE_DEFAULT_DESC: "Приднестровье сосредоточит своё внимание на экономической ветке."
 PMR_SHERIFF: "Республика шерифов"
 PMR_SHERIFF_DESC: "Тирасполь позволяет холдингу §8Sheriff§! поглотить государство, на территории которого он был построен, до тех пор, пока собственное подразделение безопасности компании не начнет отчитываться перед республикой. В итоге Приднестровьем управляет его крупнейший бизнес, а не парламент."
 RULE_OPTION_GER_GREEN: "Зелёная канцелярия"
 RULE_OPTION_GER_GREEN_DESC: "Он §8Зелень§! Германия захватывает канцелярию и тратит её на поэтапный отказ от ядерного оружия, европейскую «зелёную сделку» и прогрессивное налогообложение. Германия продвигает альянс на восток и дистанцируется как от Москвы, так и от Пекина."
 RULE_OPTION_GER_NATIONALIST: "Правление национал-демократов"
 RULE_OPTION_GER_NATIONALIST_DESC: "Конституционный порядок рушится, перерастая в гражданскую войну, и §8Национальная демократическая партия§! Германия захватывает руины, создавая однопартийное полицейское государство на крови, земле и изгнании. Германия открыто становится ирредентистской, и каждая граница вокруг неё превращается в претензию."
 RULE_OPTION_GER_SOCIALIST: "Левый восходящий"
 RULE_OPTION_GER_SOCIALIST_DESC: "§8Die Linke§! извлекает власть из руин Федеративной Республики, вытесняет американцев с их баз и разоружает страну. Затем Германия силой принуждает Францию, Польшу и Швецию к созданию рабочего профсоюза, если они откажутся."
 RULE_OPTION_GER_MONARCHIST: "Возвращение Кайзера"
 RULE_OPTION_GER_MONARCHIST_DESC: "Республика рушится, и §8Kaiser§! вновь коронуется над восстановленной империей. Германия возвращает монархов на швейцарский, австрийский, бельгийский, османский и итальянский престолы и объединяет их в имперский блок."
 RULE_DISABLE_FORMABLE_NATIONS: "Отключить формируемые страны"
 RULE_YES_FORMABLE_NATIONS_DESC: "Отключит решения по формированию стран."
 RULE_NO_FORMABLE_NATIONS_DESC: "Формируемые страны будут включены."
 RULE_ALLOW_EDGY_FLAGS: "Разрешить непристойные флаги"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Предотвращает появление некоторых наиболее спорных вариантов флага."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Позволяет использовать более спорные варианты флагов, которые обычно подвергаются цензуре."
 RULE_DISABLE_EU: "Отключить ЕС"
