l_polish:
 Commonwealth_member_modifier: "Członek Wspólnoty Narodów"
 CMW_Leaving.1.t: "[FROM.GetName] opuszcza Wspólnotę Narodów"
 CMW_Leaving.1.d: "[FROM.GetName] oficjalnie ogłosił swoje wystąpienie ze Wspólnoty Narodów. Decyzja ta stanowi istotną zmianę w polityce zagranicznej, odzwierciedlającą dążenie do większej autonomii i nawiązania nowych sojuszy międzynarodowych. Wystąpienie to może wpłynąć na relacje dyplomatyczne oraz powiązania gospodarcze w obrębie Wspólnoty, stwarzając nowe wyzwania i możliwości zarówno dla kraju opuszczającego organizację, jak i dla pozostałych państw członkowskich."
 CMW_Leaving.1.a: "Powodzenia"
 Commonwealth_member_modifier_desc: "Jako członek Wspólnoty Narodów nasz kraj czerpie korzyści z silnych więzi dyplomatycznych oraz współpracy gospodarczej z pozostałymi państwami członkowskimi. To historyczne stowarzyszenie zapewnia nam sieć wzajemnego wsparcia i wspólnych wartości, wzmacniając naszą pozycję na arenie międzynarodowej oraz możliwości handlowe. Jednak godzenie suwerenności z interesami całej Wspólnoty może niekiedy wiązać się z wyzwaniami natury dyplomatycznej i politycznej."
 CMW_member_eng_influence_tt: "[ENG.GetNameWithFlag] $foreign_influence_modifier$: §G+10%§!"