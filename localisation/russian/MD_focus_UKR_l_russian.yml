 ukr_modernize_sov_equipment_storage_sale.8.desc: "Москва напомнила стране §Y[ukr_storage_buyer.GetNameWithFlag]§!, кто поставляет оружие её армии и газ. Правительство §Rвышло§! из сделки по §Y2К11 «Круг»§!. Мы ещё можем предложить комплексы другим республикам."
