 RAJ_BRMnmar_what: "Мьянма - что?"
 RAJ_BRMnmar_what_desc: "Бирма является стратегическим плацдармом как для Индии, так и для нашего противника - Китая. Мы должны захватить контроль над этой территорией до того, как это сделает весь остальной мир."
