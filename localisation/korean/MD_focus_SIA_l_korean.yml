 SIA_all_laos_claimed: "극대주의적 라오 영유권 주장 제기"
 SIA_full_1909_demand: "1909년 조약 영토 전체 요구"
 SIA_112_amended: "112조 개정됨"
 SIA_kra_phase_1_funding_tt: "타당성 조사의 재사용 대기시간이 만료되어 있어야 하며, 국고가 유지비(현재 §Y$[?ROOT.SIA_kra_upkeep|0]§!십억)와 1단계 지급액 §Y$20§!십억을 모두 초과해야 합니다."
 SIA_kra_phase_2_funding_tt: "이전 단계의 재사용 대기시간이 만료되어 있어야 하며, 국고가 유지비(현재 §Y$[?ROOT.SIA_kra_upkeep|0]§!십억)와 2단계 지급액 §Y$30§!십억을 모두 초과해야 합니다."
 SIA_kra_phase_3_funding_tt: "이전 단계의 재사용 대기시간이 만료되어 있어야 하며, 국고가 유지비(현재 §Y$[?ROOT.SIA_kra_upkeep|0]§!십억)와 3단계 지급액 §Y$40§!십억을 모두 초과해야 합니다."
 SIA_ds_resolved_peace: "남부 심층 지역 반란이 평화 회담으로 해결되었습니다"
 SIA_ds_intensity_below_60_tt: "남부 심층 지역 반란 강도가 §Y60§! 미만 (현재 §Y[?SIA_insurgency_intensity|0]§!)"
 SIA_coup_risk_below_70_tt: "쿠데타 위험이 §Y70§! 미만 (현재 §Y[?ROOT.SIA_coup_risk|0]§!/100)"
 SIA_democrat_machine_active: "민주당 기구 통치 중"
 SIA_seato_invite_accept_tt: " - 이 나라가 §YSEATO§!에 가입하며 조약에 대한 결속을 유지하는 국가 정신을 얻습니다"
 SIA_dti_trait: "국가 연구개발 재단"
 SIA_chaiseri_trait: "국산 AFV 주조 공장"
 SIA_panus_trait: "차륜형 차량 조립"
 SIA_bdock_trait: "해군 건선거 재단"
 SIA_marsun_trait: "보트 조선소 재단"
 SIA_tai_trait: "항공우주 MRO 재단"
 SIA_did_trait: "국영 병기창 재단"
 SIA_rvconnex_trait: "무인 체계 기반"
 thailand.51.d_lapsed: "대기성 차관은 전체 기간을 다 채우고, 마지막 채무는 앞당기지 못한 채 기금의 일정대로 정산됩니다. 텔레비전 담화도, 경제적 독립 회복이라는 헤드라인도 없지만, 조건은 어쨌든 효력을 잃습니다."
 thailand.427.t: "방콕 상공의 붉은 깃발"
 thailand.427.d: "태국 공산당이 정부를 장악했습니다. 산에서도, 피켓 라인에서도 아닌, 기득권층이 통제하고 있다고 확신했던 투표함에서 말입니다. 구 정당들은 부처에서 쫓겨났고, 그들의 후원 체제와 정신도 함께 사라집니다. 당 내부에서는 누구도 이것을 끝이라 여기지 않습니다. 구 헌법 아래에서 얻은 과반수는 같은 헌법 아래에서 똑같이 쉽게 빼앗길 수 있으며, 그 헌법을 쓴 자들은 여전히 병영에 있습니다. 승리를 영구적으로 만드는 작업이 즉시 시작됩니다."
 thailand.427.a: "투표함은 쉬운 부분이었다."
 SIA_quiet_word_pressure: "궁정의 압박"
 SIA_quiet_word_pressure_desc: "전차도, 포고문도 없습니다. 정부보다 오래 남는 기관들의 꾸준한 압력이 이어질수록 나라는 하루하루 궁정 쪽으로 조금씩 더 기울어 갑니다."
 SIA_cadre_mobilisation: "간부 동원"
 SIA_cadre_mobilisation_desc: "당의 최고 조직가들은 자신의 직장이 아니라 마을과 일터에 나가 있고, 교실은 정치 교육에 내어 주었습니다. 운동은 성장하지만, 그 외의 것은 아무것도 성장하지 않습니다."
 SIA_strike_campus_walkout: "캠퍼스 집단 이탈"
 SIA_strike_campus_walkout_desc: "대학들은 기간 동안 수업을 중단했습니다. 학생들이 거리를 지키는 동안 강의실, 도서관, 실험실은 텅 비었고, 그에 의존하는 연구 계획은 정지 상태입니다."
 SIA_strike_shutdown: "전면 가동 중단"
 SIA_strike_shutdown_desc: "작업장은 비어 있고 금전 출납기도 비어 있습니다. 아무것도 만들어지지 않고 아무것도 징수되지 않습니다."
 SIA_strike_supply_freeze: "보급 동결"
 SIA_strike_supply_freeze_desc: "광산은 항구와 끊어졌고 항구는 바다와 끊어졌습니다. 나라가 캐낸 것은 무엇이든 캐낸 자리에 그대로 쌓여 있습니다."
 SIA_strike_world_watching: "세계가 지켜보고 있다"
 SIA_strike_world_watching_desc: "방콕의 모든 외신 데스크가 인력을 총동원하여 취재원을 찾고 있습니다. 정부는 파업에 조용히 대응할 수 없으며, 다른 누구도 자신의 일에 끼어드는 것을 막을 수 없습니다."
 SIA_strike_barracks_agitation: "병영 선동"
 SIA_strike_barracks_agitation_desc: "운동의 조직가들은 부처가 아닌 징집병 병영을 공략하고 있습니다. 병사들을 장교에게 맞서게 만드는 데 쓰는 매주는 아무도 정부 기구를 돌보지 않는 한 주입니다."
