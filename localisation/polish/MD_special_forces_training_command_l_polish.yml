 MD_sftc_fully_upgraded: "W pełni zmodernizowany"
 MD_sftc_exercise_ranger: "Ćwiczenie sprawdzające kandydatów na Rangersów"
 MD_sftc_exercise_ranger_desc: "Rangersi przechodzą kurs selekcyjny i sprawdzający, oparty na realizacji patroli dalekiego zasięgu, nawigacji oraz taktyce małych pododdziałów w warunkach długotrwałego wyczerpania."
 MD_sftc_ex_ranger_short: "Mistrzostwo specjalnego pułku Komandosów na 90 dni."
 MD_sftc_exercise_marine: "Ćwiczenie desantowe"
 MD_sftc_exercise_marine_desc: "Specjalne oddziały morskie ćwiczą przeprowadzanie ataków od strony morza na bronione wybrzeże, wykorzystując jednostki nawodne i małe łodzie."
 MD_sftc_ex_marine_short: "Mistrzostwo Sił Specjalnych Piechoty Morskiej na 90 dni."
 MD_sftc_exercise_airborne: "Ćwiczenie desantowania powietrznego"
 MD_sftc_exercise_airborne_desc: "Kompanie powietrznodesantowe ćwiczą nocne desanty za pomocą samolotów spadochronowych i transportowych, po czym gromadzą się i przemieszczają do wyznaczonych celów."
 MD_sftc_ex_airborne_short: "Mistrzostwo w zakresie jednostek powietrznodesantowych na 90 dni."
 MD_sftc_exercise_joint: "Wspólne ćwiczenie sił specjalnych"
 MD_sftc_exercise_joint_desc: "Oddziały Komandosów, piechoty morskiej i wojsk powietrznodesantowych szkolą się pod wspólnym dowództwem sił specjalnych i prowadzą działania w ramach połączonego scenariusza obejmującego walkę na lądzie, morzu i w powietrzu."
 MD_sftc_ex_joint_short: "Mistrzostwo w operacjach specjalnych przez 90 dni."
 MD_sftc_exercise_air_assault: "Rajd powietrzno-szturmowy"
 MD_sftc_exercise_air_assault_desc: "Komandosi desantują się z wykorzystaniem śmigłowców i samolotów transportowych, aby opanować cel na tyłach frontu, utrzymać go, a następnie wycofać się pod osłoną powietrzną."
 MD_sftc_ex_air_assault_short: "Dodatkowe szkolenie mistrzowskie sił specjalnych na okres 90 dni."
 MD_sftc_exercise_littoral: "Ćwiczenia straży przybrzeżnej"
 MD_sftc_exercise_littoral_desc: "Komandosi szkolą się do prowadzenia działań od strony morza – w rejonach przybrzeżnych, na rzekach i wyspach – wykorzystując łodzie oraz wsparcie ogniowe marynarki wojennej w celu dotarcia do celów położonych w głębi lądu."
 MD_sftc_ex_littoral_short: "Dodatkowe szkolenie mistrzowskie sił specjalnych na okres 90 dni."
 MD_sftc_exercise_envelopment: "Ćwiczenie z zakresu oskrzydlenia pionowego"
 MD_sftc_exercise_envelopment_desc: "Pododdziały piechoty morskiej i wojsk powietrznodesantowych uderzają jednocześnie na ten sam cel od strony morza i z powietrza, aby rozproszyć siły odwodowe obrońcy."
 MD_sftc_ex_envelopment_short: "Dodatkowe szkolenie mistrzowskie sił specjalnych na okres 90 dni."
 MD_sftc_school_name: "Program szkolenia w zakresie operacji specjalnych"
 MD_sftc_school_short: "Odblokowuje Szkołę Operacji Specjalnych, usprawnia ćwiczenia."
 MD_sftc_school_level_text: "Poziom [?ROOT.MD_sftc_school_level|0]/3"
 MD_sftc_insertion_name: "Program wprowadzania sił ekspedycyjnych"
 MD_sftc_insertion_short: "Umożliwia gotowość do wprowadzenia."
 MD_sftc_insertion_level_text: "Poziom [?ROOT.MD_sftc_insertion_level|0]/3"
 MD_sftc_command_name: "Program Dowództwa Operacji Specjalnych"
 MD_sftc_command_short: "Odblokowuje Dowództwo Operacji Specjalnych."
 MD_sftc_command_level_text: "Poziom [?ROOT.MD_sftc_command_level|0]/3"
 MD_sftc_qualification_name: "Kurs kwalifikacyjny sił specjalnych"
 MD_sftc_qualification_short: "Jeden dowódca armii może zyskać cechę sił specjalnych."
 MD_sftc_qualification_cooldown: "Trwa kurs kwalifikacyjny sił specjalnych"
 MD_sftc_qualification_cooldown_desc: "Wyselekcjonowani funkcjonariusze kończą szkolenie kwalifikacyjne do sił specjalnych. Kolejny kurs rozpocznie się po zakończeniu obecnego."
 MD_sftc_joint_course_name: "Wspólny kurs operacji specjalnych"
 MD_sftc_joint_course_short: "Każdy dowódca sił specjalnych zdobywa doświadczenie."
 MD_sftc_joint_course_cooldown: "Trwa wspólny kurs operacji specjalnych"
 MD_sftc_joint_course_cooldown_desc: "Żołnierze sił specjalnych ze wszystkich rodzajów sił zbrojnych szkolą się wspólnie w ramach kursu operacji specjalnych. Nowy kurs będzie mógł się rozpocząć po zakończeniu obecnego szkolenia."
 MD_sftc_school_1: "Szkoła Operacji Specjalnych I"
 MD_sftc_school_1_desc: "Stały ośrodek szkolenia sił specjalnych dokonuje selekcji i szkolenia kandydatów, ujednolica taktykę oraz skraca czas potrzebny na formowanie nowych jednostek sił specjalnych."
 MD_sftc_school_2: "Szkoła Operacji Specjalnych II"
 MD_sftc_school_2_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_school_3: "Szkoła Operacji Specjalnych III"
 MD_sftc_school_3_desc: "$MD_sftc_school_1_desc$"
 MD_sftc_insertion_1: "Gotowość do wprowadzenia I"
 MD_sftc_insertion_1_desc: "Stałe procedury oraz dedykowane środki transportu zapewniają siłom specjalnym gotowość do szybkiego przerzutu drogą morską i powietrzną."
 MD_sftc_insertion_2: "Gotowość do wprowadzenia II"
 MD_sftc_insertion_2_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_insertion_3: "Gotowość do wprowadzenia III"
 MD_sftc_insertion_3_desc: "$MD_sftc_insertion_1_desc$"
 MD_sftc_command_1: "Dowództwo Operacji Specjalnych I"
 MD_sftc_command_1_desc: "Zintegrowane dowództwo operacji specjalnych planuje i kieruje misjami z udziałem różnych rodzajów sił zbrojnych oraz zapewnia jednostkom wysuniętym zdecydowane wsparcie i jasne uprawnienia decyzyjne."
 MD_sftc_command_2: "Dowództwo Operacji Specjalnych II"
 MD_sftc_command_2_desc: "$MD_sftc_command_1_desc$"
