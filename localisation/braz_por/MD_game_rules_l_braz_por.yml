 RULE_NO_FORMABLE_NATIONS_DESC: "As nações formáveis estarão habilitadas."
 RULE_ALLOW_EDGY_FLAGS: "Permitir Bandeiras Polêmicas"
 RULE_ALLOW_EDGY_FLAGS_BLOCKED_DESC: "Mantém algumas das opções de bandeiras mais controversas de aparecer."
 RULE_ALLOW_EDGY_FLAGS_ALLOWED_DESC: "Permite opções de bandeiras mais controversas que normalmente seriam censuradas."
