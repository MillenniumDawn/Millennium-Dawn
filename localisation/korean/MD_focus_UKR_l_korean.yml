 UKR_develop_bmp64: "§YBMP-64§! 개발"
 UKR_develop_bmp64_flag: "결정 §YBMP-64 개발§! 완료"
 UKR_develop_bmp64_desc: "§W§YBMP-64§!, an experimental heavy infantry fighting vehicle developed by Kharkiv-based designers on the chassis of the §YT-64§!. The conversion removes the original tank turret and rearranges the hull to provide a protected troop compartment, while retaining much of the tank's heavy chassis and protection. The first prototype was fitted with a remotely operated combat module and rear access doors, establishing the basic concept of a heavy [UKR.GetFlag] Ukrainian infantry fighting vehicle.§!"
 UKR_develop_bmp64d: "§YBMP-64D§! 개발"
 UKR_develop_bmp64d_desc: "§W§YBMP-64D§!, an evolution of the original §YBMP-64§! concept. The vehicle receives an expanded combat module with additional anti-armour and air-defence capabilities, together with improved protection and equipment. The project represents an attempt to turn the §YT-64§! chassis into a versatile heavy infantry platform capable of supporting troops while retaining the survivability of its tank-derived hull.§!"
 UKR_develop_bmpt64: "§YBMPT-64§! 개발"
 UKR_develop_bmpt64_desc: "§W§YBMPT-64§!, a further evolution of the [UKR.GetFlag] Ukrainian §YT-64§!-based heavy infantry fighting vehicle. Its redesigned hull and unmanned turret improve the internal layout, while a rear ramp provides more convenient access to the troop compartment. The vehicle incorporates technologies developed for other [UKR.GetFlag] Ukrainian §YT-64§! modernization programs, including improved protection and combat equipment. The §YBMPT-64§! became one of the most advanced concepts of the §YUMR-64§! family.§!"
 UKR_develop_bmpk64: "§YBMP-K-64§! 개발"
 UKR_develop_bmpk64_desc: "§W§YBMP-K-64§!, an unusual wheeled derivative of the §YT-64§!-based infantry vehicle family. The original tracked chassis is extensively redesigned into an 8x8 platform, with the engine and transmission adapted to drive the wheels. The resulting vehicle is considerably lighter and faster than its tracked counterparts, while retaining substantial protection derived from the original tank chassis. The prototype demonstrated [UKR.GetFlag] Ukraine's efforts to reuse ageing §YT-64§! hulls as the basis for new armoured vehicles.§!"
 UKR_develop_t72ag: "§YT-72AG§! 개발"
 UKR_develop_t72ag_desc: "§W§YT-72AG§!, a [UKR.GetFlag] Ukrainian export modernization of the §YT-72§! incorporating technologies developed for the §YT-80UD§! and §YT-84§!. The modernization substantially upgrades the powerplant, fire-control equipment, protection and other systems while retaining the original §YT-72§! hull and turret. The project represents one of the early [UKR.GetFlag] Ukrainian attempts to combine §RSoviet-era§! tank platforms with domestic §Rpost-Soviet§! technology.§!"
 UKR_develop_t72_120: "§YT-72-120§! 개발"
 UKR_develop_t72_120_desc: "§W§YT-72-120§!, a [UKR.GetFlag] Ukrainian export-oriented modernization intended to bring the §YT-72§! platform closer to Western operating standards. The most distinctive feature is a redesigned turret rear incorporating an automatic loading system and a separated ammunition compartment. Together with modernized fire-control and support systems, the project demonstrates an ambitious attempt to adapt the §RSoviet§! §YT-72§! design for international customers.§!"
 UKR_develop_t72ua1: "§YT-72UA1§! 개발"
 UKR_develop_t72ua1_desc: "§W§YT-72UA1§!, an economical [UKR.GetFlag] Ukrainian modernization of the §YT-72§! developed primarily for export customers. The program focuses on improving mobility, protection, observation and fire-control equipment while keeping the basic §YT-72§! architecture. Its approach emphasizes the practical refurbishment and modernization of existing vehicles rather than developing an entirely new tank.§!"
 UKR_develop_t80_2019: "§YT-80BV zr. 2019§! 개발"
 UKR_develop_t80_2019_desc: "§W§YT-80BV zr. 2019§!, a modernization of the §YT-80BV§! carried out for [UKR.GetFlag] Ukrainian airborne and naval infantry formations with the experience from §YT-64BV§! year 2017 modernization. The program introduces modern thermal imaging equipment, upgraded communications and navigation systems, as well as improved protection and other updated components. It combines the mobility of the §YT-80§! with equipment derived from [UKR.GetFlag] Ukraine's broader experience in modernizing its armoured fleet.§!"
 UKR_develop_skif: "§YSkif§! APC 개발"
 UKR_develop_skif_desc: "§W§YSkif§!, a new [UKR.GetFlag] Ukrainian tracked armoured personnel carrier designed by §LUkrArmoTech§! on the basis of §YM113§! APC. The vehicle is built around a front-mounted engine compartment and a rear troop compartment with a ramp, while its modular chassis is intended to support a wider family of vehicles. The prototype uses an aluminium armoured hull and incorporates modern [UKR.GetFlag] Ukrainian communications, navigation and electronic systems. Factory testing began in 2026 as the company evaluated the platform's mobility and overall design.§!"
 UKR_develop_kevlar_e: "§YKevlar-E§! 개발"
 UKR_develop_kevlar_e_desc: "§W§YKevlar-E§!, a [UKR.GetFlag] Ukrainian infantry fighting vehicle created by adapting the chassis of the §Y2S1§! self-propelled gun. The redesign moves the powerplant to the front and creates a larger protected troop compartment at the rear. Spaced armour, additional internal protection and a remotely operated turret transform the artillery chassis into a modern infantry platform. The project demonstrates how ageing §RSoviet§! vehicles can be repurposed into new armoured platforms.§!"
