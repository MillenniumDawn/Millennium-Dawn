 SOV_MoexStatus_loc1: "£text_icon_sov_ruble §YBOLSA DE MOSCÚ§!: §RERRADA§!\nLas empresas cotizadas han sido §Rnacionalizadas§!. La capitalización está congelada y el mercado ya no contribuye a nuestra economía.\n"
 SOV_MoexStatus_loc2: "£text_icon_sov_ruble §YBOLSA DE MOSCÚ§!: §RSUSPENDIDA§!\nLas operaciones se han detenido. La capitalización no cambiará hasta que se reanuden las negociaciones.\n"
 SOV_MoexStatus_loc3: "£text_icon_sov_ruble §YBOLSA DE MOSCÚ§!: §RSUSPENDIDA§!\nComo sujeto subordinado, no gestionamos nuestra propia bolsa. La capitalización está congelada.\n"
 SOV_MoexStatus_loc4: "£text_icon_sov_ruble §YBOLSA DE MOSCÚ§!: §GABIERTA§!\nLa capitalización se revaloriza cada mes. Cuanto mayor sea el valor de una empresa, mayor será la bonificación que pague.\n"
 SOV_CapGazprom_loc1: "\n£text_icon_sov_gazprom §gGAZPROM§!\n§YCapitalización§!: $§G[?SOV.SOV_capitalisation_gazprom|1]§! mil millones (§Y[?SOV.SOV_cap_delta_gazprom|2]§! el mes pasado)\n§YPrima de mercado§!: §G[?SOV.SOV_cap_ramp_gazprom|%0]§! del máximo, alcanzado a los $ 25 mil millones\nGeneración de §YPIB del sector de recursos§!: hasta §G+3.00%§!\n£resource_export_multiplier_modifier_texticon Multiplicador de §YIngresos por exportación de combustibles fósiles§!: hasta §G+3.00%§!\n£corporate_tax_income_multiplier_modifier_texticon Multiplicador de §YIngresos por impuestos de sociedades§!: hasta §G+3.00%§!\n"
 SOV_CapRosneft_loc1: "\n£text_icon_sov_rosneft §gROSNEFT§!\n§YCapitalization§!: $§G[?SOV.SOV_capitalisation_rosneft|1]§! mil millones (§Y[?SOV.SOV_cap_delta_rosneft|2]§! el mes pasado)\n§YPrima de mercado§!: §G[?SOV.SOV_cap_ramp_rosneft|%0]§! del máximo, alcanzado a los $ 25 mil millones\nGeneración de §YPIB del sector de recursos§!: hasta §G+2.00%§!\n£resource_export_multiplier_modifier_texticon Multiplicador de §YIngresos por exportación de combustibles fósiles§!: hasta §G+4.00%§!\n£corporate_tax_income_multiplier_modifier_texticon Multiplicador de §YIngresos por impuestos de sociedades§!: hasta §G+3.00%§!\n"
 SOV_CapRosneft_loc2: "\n£text_icon_sov_rosneft §gROSNEFT§!\nLa empresa cotiza en bolsa pero §Rno posee activos negociables§!. Su capitalización solo empezará a moverse una vez que se absorban las participaciones de §YYukos§!.\n"
 SOV_CapSberbank_loc1: "\n£text_icon_sov_sberbank §gSBER§!\n§YCapitalización§!: $§G[?SOV.SOV_capitalisation_sberbank|1]§! mil millones (§Y[?SOV.SOV_cap_delta_sberbank|2]§! el mes pasado)\n§YPrima de mercado§!: §G[?SOV.SOV_cap_ramp_sberbank|%0]§! del máximo, alcanzado a los $ 25 mil millones\n£research_speed_texticon Velocidad de investigación: hasta §G+3.00%§!\n£corporate_tax_income_multiplier_modifier_texticon Multiplicador de §YIngresos por impuestos de sociedades§!: hasta §G+3.00%§!\n£economic_cycles_cost_factor_texticon Coste para cambiar ciclos económicos: hasta §G-3.00%§!\n£education_cost_multiplier_modifier_texticon Multiplicador de §YCoste de educación§!: hasta §R+5.00%§!\n"
 SOV_CapSberbank_loc2: "\n£text_icon_sov_sberbank §gSBERBANK§!\nSigue siendo un §Rbanco de ahorros estatal§!. El mercado no lo valorará en bolsa hasta que sea reestructurado como una entidad de crédito comercial.\n"
 SOV_CapVtb_loc1: "\n£text_icon_sov_vtb §gVTB-BANK§!\n§YCapitalización§!: $§G[?SOV.SOV_capitalisation_vtb|1]§! mil millones (§Y[?SOV.SOV_cap_delta_vtb|2]§! el mes pasado)\n§YPrima de mercado§!: §G[?SOV.SOV_cap_ramp_vtb|%0]§! del máximo, alcanzado a los $ 25 mil millones\n£corporate_tax_income_multiplier_modifier_texticon Multiplicador de §YIngresos por impuestos de sociedades§!: hasta §G+3.00%§!\n£economic_cycles_cost_factor_texticon Coste para cambiar ciclos económicos: hasta §G-3.00%§!\n"
 SOV_CapVtb_loc2: "\n£text_icon_sov_vtb §gVTB-BANK§!\n§RNo ha salido a bolsa todavía§!. El banco no paga prima de mercado hasta que sus acciones se ofrezcan al público público.\n"
 SOV_CapMts_loc1: "\n£text_icon_sov_mts §gMTS§!\n§YCapitalización§!: $§G[?SOV.SOV_capitalisation_mts|1]§! mil millones (§Y[?SOV.SOV_cap_delta_mts|2]§! el mes pasado)\n§YPrima de mercado§!: §G[?SOV.SOV_cap_ramp_mts|%0]§! del máximo, alcanzado a los $ 25 mil millones\n£corporate_tax_income_multiplier_modifier_texticon Multiplicador de §YIngresos por impuestos de sociedades§!: hasta §G+3.00%§!\nVelocidad de construcción de §Y$internet_station$§!: hasta §G+3.00%§!\n"
 SOV_CapAlrosa_loc1: "\n£text_icon_sov_alrosa §gALROSA§!\n§YCapitalización§!: $§G[?SOV.SOV_capitalisation_alrosa|1]§! mil millones (§Y[?SOV.SOV_cap_delta_alrosa|2]§! el mes pasado)\n§YPrima de mercado§!: §G[?SOV.SOV_cap_ramp_alrosa|%0]§! del máximo, abarcando desde los $ 10 mil millones hasta los $ 25 mil millones\n£resource_export_multiplier_modifier_texticon Multiplicador de §YIngresos por exportación de metales preciosos§!: hasta §G+2.00%§!\n£corporate_tax_income_multiplier_modifier_texticon Multiplicador de §YIngresos por impuestos de sociedades§!: hasta §G+2.00%§!\n"
