 POL_AUTH_S_nationalist: "Reino da Polônia"
 ARM_AUTH_STWO_nationalist: "Santo Reino da Armênia"
 ARM_italy_armenian_union: "Proporemos à Itália §Rsubmeter-se à nossa vontade§!"
 ARM_shiza_kavkaz_tt: "O §RSeparatismo§! nas Repúblicas: §Y[SOO.GetNameWithFlag]§!, §Y[ADY.GetNameWithFlag]§!, §Y[CHE.GetNameWithFlag]§!, §Y[KBK.GetNameWithFlag]§! e §Y[DAG.GetNameWithFlag]§! será §Gaumentado§!"
 ARM_Petrosyan: "Rei da Colina"
 ARM_Petrosyan_desc: "Levon Hakobi Ter-Petrosyan, também conhecido por suas iniciais LTP, é um político armênio que serviu como o primeiro presidente da Armênia. Liderou o movimento de Karabakh pela unificação de Nagorno-Karabakh, de população armênia, com a Armênia em 1988. Conduziu o país durante a Primeira Guerra de Nagorno-Karabakh contra o vizinho Azerbaijão."
 ARM_deideologization_of_democracy: "Desideologização da Democracia"
 ARM_deideologization_of_democracy_desc: "A Armênia é um dos poucos países pós-soviéticos onde a liberdade de expressão, o livre mercado e os direitos humanos são verdadeiramente valorizados. Nosso pequeno país montanhoso deve se tornar um bastião da democracia na região."
 ARM_crossroad_diplomacy: "Diplomacia de Encruzilhada"
 ARM_crossroad_diplomacy_desc: "Precisamos usar todas as nossas capacidades diplomáticas regionais para expandir nossa esfera de influência e estabelecer relações normais com todos os países da região."
 ARM_wipe_out_koch: "Deter Kocharyan"
 ARM_wipe_out_koch_desc: "Os funcionários corruptos de Kocharyan devem ser varridos das estruturas governamentais."
 ARM_desovietize_armenia: "Dessovietização da Armênia"
 ARM_desovietize_armenia_desc: "Precisamos nos livrar do legado soviético na Armênia. O regime comunista não deu à nossa nação nada além de lágrimas, medo, morte, dor e a perda de nossas terras nacionais. É hora de agir."
 ARM_learn_from_cilicia: "Aprender com o Exemplo da Cilícia"
 ARM_learn_from_cilicia_desc: "Devemos tirar lições de nossa história, especialmente da Cilícia, que foi saqueada devido às aspirações irracionais de mudanças radicais no rumo da política externa. Não devemos repetir os mesmos erros."
 ARM_privatize_land: "Privatizar a Terra"
 ARM_privatize_land_desc: "Devemos iniciar nossas reformas econômicas tomando a terra confiscada ilegalmente pela máfia, por oligarcas e oportunistas e privatizando-a adequadamente."
 ARM_press_oligs: "Pressionar os Oligarcas"
 ARM_press_oligs_desc: "Devemos garantir que os oligarcas não tenham mais influência, pelo menos no nível municipal do nosso governo."
 ARM_crush_mafia: "Esmagar a Máfia"
 ARM_crush_mafia_desc: "Devemos esmagar qualquer forma de atividade criminosa na Armênia e punir todos os criminosos."
 ARM_utilize_wifes_connections: "Usar as Conexões"
 ARM_utilize_wifes_connections_desc: "Devemos usar as conexões familiares para tentar normalizar as relações com Israel."
 ARM_liberalize_economy: "Liberalizar a Economia"
 ARM_liberalize_economy_desc: "Devemos liberalizar a economia para promover um rápido crescimento econômico."
 ARM_socdem_principles: "Princípios Sociais"
 ARM_syria_israel_mediation: "Mediação Síria-Israel"
 ARM_syria_israel_mediation_desc: "Podemos tentar estabelecer um processo de paz entre Israel e a Síria para aumentar nossa esfera de influência."
 ARM_it_sector: "Desenvolvimento do Setor de TI"
 ARM_it_sector_desc: "Devemos desenvolver o setor de TI, pois é a indústria que mais cresce em nosso país."
 ARM_levon_build_roads: "Construir as Estradas"
 ARM_levon_build_roads_desc: "A infraestrutura da Armênia está em condições terríveis; devemos reparar as estradas antigas e construir novas para melhorar a situação."
 ARM_future_looking_strategy: "Estratégia Voltada ao Futuro"
 ARM_future_looking_strategy_desc: "Devemos seguir uma estratégia de política externa voltada para a estabilidade de longo prazo na região."
 ARM_defence_levon_invest: "Investimentos em Defesa"
 ARM_defence_levon_invest_desc: "Devemos investir em defesa, apesar de nossa estratégia de política externa de buscar a paz na região."
 arm_levon.1.t: "A Armênia Oferece um Acordo"
 arm_levon.1.d: "Se aceitarmos o novo status neutro da Armênia, poderemos nos beneficiar disso até certo ponto, obtendo um polo direto no Cáucaso e alguns benefícios financeiros."
 arm_levon.1.a: "Claro."
 arm_levon.1.b: "Não, não gostamos da Armênia."
 arm_levon.2.t: "[FROM.GetNameWithFlag] Aceitou"
 arm_levon.2.d: "[FROM.GetNameWithFlag] concorda em reconhecer nosso novo status neutro."
 arm_levon.2.a: "Bom!"
 arm_levon.3.t: "[FROM.GetNameWithFlag] Aceitou"
 arm_levon.3.d: "[FROM.GetNameWithFlag] concorda em reconhecer nosso novo status neutro."
