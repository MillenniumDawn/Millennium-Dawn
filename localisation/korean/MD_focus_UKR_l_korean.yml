 ukr_light_transport_tender: "새 §Y경수송 차량§!\n입찰 실시"
 ukr_light_transport_tender_desc: "\n\n\n\n\n\n\n£UKR_desctext_for_tooltip_utility_vehicle_tender_dozor_a\n\n\n\n\n\n\n\n\n§WThe [UKR.GetFlag] Ukrainian Armed Forces require a new generation of light transport vehicles to replace aging §RSoviet-era§! utility vehicles. Several domestic manufacturers have presented proposals for a new vehicle intended to serve as a general-purpose transport platform for the armed forces and other state institutions.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers: "§YBRDM-2§! 현대화 제안 수렴"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_for_tooltip\n\n\n\n\n\n\n\n\n§WOur army still relies on hundreds of §RSoviet§! §YBRDM-2§! scout cars. The Ministry of Defence can ask our defense industry how to bring them up to date.\n\nWhen the offers are in, we choose one contractor for the program or close it for good.\n------------------\nThis Decision is a §Rprerequisite§! for all other §YBRDM-2§! modernization decisions. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete them.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission: "기한: §YBRDM-2§! 현대화 제안"
 ukraine_modernize_sov_equipment_brdm_2_modernization_offers_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_offers_desc$\n\n§R타이머가 끝나면 어차피 제안이 도착하며, 우리는 선택해야 합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers: "다른 제조사를 §YBRDM-2§! 계획에 초청"
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_manufacturers_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_other_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §YBRDM-2§! work in Mykolayiv has caught the attention of other companies. §LNVK Techimpex§!, the §LMayak§! plant in Kyiv, the §LVEPR§! company in Kremenchuk and the §L45th Experimental Mechanical Plant§! in Vinnytsia want to join the program, but they need spare §YBRDM-2§! hulls from our stockpile to start.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late: "남은 §YBRDM-2§!의 업그레이드 방안 결정"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2l1_for_tooltip\n\n\n\n\n\n\n\n\n§WMore than a hundred old §YBRDM-2§! still wait in our stockpile. The §LMykolayiv Tank Repair Plant§! offers two answers: the §YBRDM-2L1§!, a cheap upgrade it can roll out quickly, or the §YBRM Manhust§!, a reconnaissance vehicle rebuilt almost from scratch.\n\nThe offer stays open until the end of §Y2018§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission: "마지막 기회: 남은 §YBRDM-2§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_late_desc$\n\n§R타이머가 끝나면 공장이 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t: "Order the §YBRDM-2T§! prototype from §LTechimpex§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_2012_for_tooltip\n\n\n\n\n\n\n\n\n§W§LNVK Techimpex§! from Kyiv is ready to rebuild the §YBRDM-2§!. A §YD-245§! diesel replaces the fire-prone §YGAZ-41§! gasoline engine, and the whole vehicle goes through a major overhaul. The prototype takes about two years.\n\nThe offer stays open until the end of §Y2011§!.\n------------------\nThis Decision is a §Rprerequisite§! for the §YYanhol§! protection kit decision. If you §Rskip§! this decision, you will §Rlose§! the opportunity to complete it.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission: "마지막 기회: §YBRDM-2T§! 시제품"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_mission_desc: "$ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_brdm_2t_desc$\n\n§R타이머가 끝나면 테크임펙스가 제안을 철회합니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol: "§Y얀홀§! 방호 키트 개발"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_yanhol_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2t_yanhol_for_tooltip\n\n\n\n\n\n\n\n\n§WOur crews want better protection for the §YBRDM-2T§!. §LNVK Techimpex§! can add spaced steel armor plates to the variant we already build and turn it into the §YBRDM-2T Yanhol§!.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp: "Order the §YBRDM-2DP§! from §LMayak§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mayak_brdm_2dp_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2dp_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §LMayak§! plant in Kyiv offers the §YBRDM-2DP§!, a lightened §YBRDM-2§! with a diesel engine. It carries a 12.7 mm §YDShKM§! and two §YSGMB§! machine guns, side doors for the troops and removable anti-cumulative screens.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr: "Order the §YBRDM-2 'Vepr'§! from §LVEPR§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_brdm_2_vepr_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2_vepr_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §LVEPR§! company in Kremenchuk offers the §YBRDM-2 'Vepr'§!. The cockpit gets armored glass for better visibility and the bottom is armored. The belly wheels give way to full-size side doors for the troops, a stern machine gun replaces the water-jet, and the bow can take an automatic grenade launcher.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i: "빈니차에 §YBRDM-2I§! 주문"
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_brdm_2i_desc: "\n\n\n\n\n\n£UKR_desctext_modernize_sov_brdm2i_for_tooltip\n\n\n\n\n\n\n\n\n§WThe §L45th Experimental Mechanical Plant§! in Vinnytsia offers the §YBRDM-2I§!. A quiet 156 hp §LISUZU§! diesel replaces the gasoline engine, a central tire inflation system is added, and the armament grows to a 14.5 mm §YKPVT§!, an §YAGS-17§! grenade launcher and the §YBaryer§! anti-tank missile.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.d: "VEPR 기업을 끌어들인다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.4.e: "미콜라이우만으로 충분하다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.10.c: "zr. 2012로 충분하다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.name: "BRDM-2를 재제작하는 아레이"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.desc: "육군과 국가방위군 지원병으로 이루어진 엔지니어링 그룹 §Y아레이§!가 자체 판단으로 BRDM-2 재제작에 착수했습니다. 이들의 §YBKM 헤콘§!은 강력한 디젤 엔진과 측면 문을 갖추고 아홉 명이 탈 수 있는 공간을 확보했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.a: "그대로 작업하게 둔다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.14.b: "자금을 지원한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.name: "BKM 헤콘 공개"
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.desc: "아레이가 §YBKM 헤콘§!을 공개했습니다. 유압식 구동 장치를 갖춘 제너럴 모터스 디젤 엔진, 사격 구멍, 측면 문, 더 두꺼워진 장갑이 낡은 BRDM-2를 전선이 요구한 차량으로 탈바꿈시켰습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.15.a: "§YBKM 헤콘§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.name: "BRDM-2T 얀홀 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.desc: "§YNVK 테크임펙스§!가 우리 §YBRDM-2T§!에 이격 강철 장갑판을 장착했습니다. §YBRDM-2T 얀홀§!은 승무원을 소화기 사격과 포탄 파편으로부터 훨씬 안전하게 지켜 줍니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.16.a: "§YBRDM-2T 얀홀§!을 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.name: "BRDM-2DP 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.desc: "§Y마야크§! 공장이 우리 군을 위한 §YBRDM-2DP§!를 완성했습니다. 디젤 엔진, 측면 문, 탈착식 대성형작약 방호망을 갖춘 경량형 BRDM-2입니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.17.a: "§YBRDM-2DP§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.name: "BRDM-2I 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.desc: "빈니차의 §Y제45 시험 기계공장§!이 저소음 ISUZU 디젤 엔진, 중앙 타이어 공기압 조절 장치, 더 강력한 무장을 갖춘 §YBRDM-2I§!를 인도했습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.18.a: "§YBRDM-2I§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.name: "BRDM-2 베프르 준비 완료"
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.desc: "크레멘추크의 §YVEPR§! 기업이 우리 군을 위한 §YBRDM-2 '베프르'§!를 완성했습니다. 조종석 방탄유리, 장갑을 덧댄 하부, 병력용 측면 문, 선미 기관총 진지를 갖추었습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization.19.a: "§YBRDM-2 '베프르'§!를 채택한다"
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_plan_tt: "§Y미콜라이우 전차 수리 공장§!은 단계별로 개량을 제안합니다. §Y2000-2001년§!에는 초기 개량형, §Y2004-2005년§!에는 §YBRDM-2DI 하자르§!, §Y2010-2012년§!에는 다른 제조사 초청, §Y2015-2018년§!에는 남은 BRDM-2의 최종 개량입니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_plan_tt: "§YNVK 테크임펙스§!는 §Y2010년§!에 §YBRDM-2T§!를 시작합니다. 개량은 단계적으로 진행됩니다. 먼저 시제품, 이어서 경량형 또는 개량형, 그다음 §Y얀홀§! 방호 키트입니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_other_plan_tt: "§Y마야크§!는 §Y2007-2009년§!에 §YBRDM-2DP§!를 제안합니다. §Y제45 시험 기계공장§!은 §Y2014년 중반§!부터 §YBRDM-2I§!를 제안합니다. §YVEPR§! 기업은 §Y2015-2016년§!에 §YBRDM-2 '베프르'§!를 제안합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vepr_plan_tt: "크레멘추크의 §YVEPR§! 기업은 §Y2014-2016년§!에 §YBRDM-2 '베프르'§!를 제안합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_vinnytsia_plan_tt: "§Y제45 시험 기계공장§!은 §Y2014년 중반§!부터 §YBRDM-2I§!를 제안합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_cancel_tt: "§RBRDM-2 현대화 계획이 영구히 종료됩니다.§! 우리의 BRDM-2는 현 상태 그대로 복무합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_wait_tt: "§Y미콜라이우 전차 수리 공장§!이 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_mykolayiv_experience_tt: "§G초기 개량형 작업 경험으로 소요 시간이 절반으로 줄어듭니다.§!"
 ukraine_modernize_sov_equipment_brdm_2_modernization_techimpex_wait_tt: "§YNVK 테크임펙스§!가 약 §Y$DAYS$§!일 뒤 결과물을 공개합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_manhust_wait_tt: "§YBRM 만후스트§! 시제품이 약 §Y$DAYS$§!일 뒤 완성됩니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_arey_wait_tt: "§Y아레이§!가 약 §Y$DAYS$§!일 뒤 §YBKM 헤콘§!을 공개합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_both_wait_tt: "두 시제품이 약 §Y$DAYS$§!일 뒤 공개됩니다. 그 후 둘 중 하나를 채택합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_arey_rival_tt: "육군과 국가방위군 지원병으로 이루어진 설계팀 §Y아레이§!가 비슷한 차량을 제작하고 있습니다. 어느 쪽을 지원할지 우리가 결정합니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_convert_tt: "이제 생산 라인에서 우리 §YBRDM-2§!를 이 형식으로 §G전환§!할 수 있습니다."
 ukraine_modernize_sov_equipment_brdm_2_modernization_stockpile_40_tt: "비축분에 §YBRDM-2§! 세대 경정찰 차량을 최소 §Y40§!대 보유 (현재: §Y[?num_equipment@medium_tank_destroyer_chassis_0|0]§!)"
