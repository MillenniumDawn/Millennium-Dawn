 CPD_demanding_annexation_of_state_TT: "Annexion dieser Provinz ist eine §GForderung§! von [ROOT.GetNameWithFlag]. Wenn der Frieden angenommen wird, wird dieser Staat in unsere Nation eingegliedert werden und wir werden der neue Besitzer sein."
