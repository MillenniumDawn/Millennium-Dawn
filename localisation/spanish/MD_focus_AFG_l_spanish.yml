 AFG_ai_Weight_effect_Airlift: "¡Su disposición a aceptar es §GFuerte§! por defecto\n\n Es más probable que acepten si\n §G-[USA.GetLeader] ha anunciado la Operación Libertad Duradera §!\n\n Es menos probable que acepten si\n §R-Si no seguimos la misma perspectiva\n -¡Si tienen mala opinión de nosotros§!"
 AFG_ai_Weight_effect_Iran: "¡Su disposición a aceptar es §GFuerte§! por defecto\n\n Es menos probable que acepten si\n §R-Si no seguimos la misma perspectiva\n -Si tienen mala opinión de nosotros\n -¡Somos sunitas!§!"
