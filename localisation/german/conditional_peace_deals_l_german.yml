 CPD_country_action_full_puppet: "§Y Vollständige Marionette §!"
 CPD_country_action_ceasefire_TT: "Ein §YWaffenstillstand§! beendet den Krieg, wobei die aktuelle Frontlinie zur neuen Grenze wird. Anschließend gilt ein §Y720-tägiger§! Waffenstillstand.\n\nKlicken, um aus dem Abkommen zu entfernen."
 CPD_country_action_war_reparations_TT: "§YKriegsreparationen§! zwingen den Verlierer, ein Jahr lang wöchentlich einen Teil seines BIP an den Empfänger zu zahlen.\n\nKlicken, um aus dem Abkommen zu entfernen."
 CPD_country_action_forced_neutrality_TT: "§YErzwungene Neutralität§! entfernt das Ziel aus seiner Fraktion und verbietet ihm, für fünf Jahre einer anderen beizutreten.\n\nKlicken, um aus dem Abkommen zu entfernen."
 CPD_country_action_regime_change_TT: "§YRegimewechsel§! setzt unsere Regierungspartei in der Regierung des Ziels ein. Anhaltende politische Instabilität ist zu erwarten.\n\nKlicken, um aus dem Abkommen zu entfernen."
 CPD_country_action_military_basing_TT: "§YMilitärstützpunkte§! gewähren der empfangenden Partei freien Durchgang und Stationierungsrechte im Territorium der anderen Partei.\n\nKlicken, um aus dem Abkommen zu entfernen."
 CPD_country_action_full_puppet_TT: "§YVollständige Marionette§! macht das gesamte Ziel zu einem Vasallenstaat.\n\nKlicken, um aus dem Abkommen zu entfernen."
