 AFG_atta_muhammad_nur_tt: "§Y아타 무함마드 누르§!, 부여 효과:\n육군 경험치 획득량: 매일 §G+0.05§!\n민병 사단 공격 §G+0.04§!\n민병 사단 방어 §G+0.04§!\n차량화 민병 공격 §G+0.04§!\n차량화 민병 방어 §G+0.04§!"
 AFG_mohammed_fahim_tt: "§Y모하마드 카심 파힘§!, 부여 효과:\n육군 경험치 획득량: 매일 §G+0.05§!\n보병 사단 공격 §G+0.04§!\n보병 사단 방어 §G+0.04§!\n차량화 공격 §G+0.04§!\n차량화 방어 §G+0.04§!"
