 SOV_red_army: "신 붉은 군대"
 SOV_red_army_desc: "붉은 군대의 부활은 힘과 규율의 회복을 상징하며, 현대의 위협에 맞설 수 있는 군대를 구축합니다."
 SOV_pogran: "옛 군사 사업 부활"
 SOV_pogran_desc: "우리는 오랫동안 잊혔던 여러 군사 사업을 되살려 방위 능력을 강화할 것입니다."
 SOV_til_vs: "군 후방 부활"
 SOV_til_vs_desc: "우리의 병참 및 지원 부대는 군의 근간입니다. 후방을 되살리면 지속적인 작전이 보장될 것입니다."
 SOV_kafedra_return: "군사 학과 복원"
 SOV_kafedra_return_desc: "미래의 장교와 전문 인력을 양성하기 위해 교육 기관 내 군사 학과가 복원될 것입니다."
 SOV_fleet: "영광스러운 소련 해군"
 SOV_fleet_desc: "우리는 소련 해군의 자랑스러운 전통과 위용을 되살려 바다 전역에 힘을 투사하는 것을 목표로 합니다."
 SOV_rocketi: "전략로켓군 강화"
 SOV_rocketi_desc: "우리의 전략로켓군은 억지력의 초석이며, 이를 강화하는 것은 국가 안보에 필수적입니다."
 SOV_aviatcia: "공군 강화"
 SOV_aviatcia_desc: "우리는 공군의 능력을 강화하여 하늘에서의 우위를 확보할 것입니다."
 SOV_academy: "군사 학교 복원"
 SOV_academy_desc: "차세대 지휘관과 전문 인력을 양성하기 위해 군사 학교가 되살아날 것입니다."
 SOV_kirov: "군대는 진보의 엔진이다"
 SOV_kirov_desc: "강력한 군대는 국가의 진보와 안정을 이끕니다. 우리는 우리 군이 선두에 서도록 보장할 것입니다."
