 UKR_arms_rebuild: "Военная промышленность"
 UKR_arms_rebuild_desc: "Наша страна должна защищать себя, и только сильная военная промышленность поможет в этом."
 UKR_arms_build: "Инвестировать в военное производство"
 UKR_arms_build_desc: "Мы готовы финансировать инвестиции в расширение военного производства некоторых наших именных заводов."
 UKR_polish_ukr_brotherhood: "Польско-украинское братство"
 UKR_polish_ukr_brotherhood_desc: "Только вместе Украина и Польша смогут победить любого врага."
 UKR_belarus_brothers: "Белорусские братья"
 UKR_belarus_brothers_desc: "Белорусский народ - наши братья, которые также находятся в лапах двух крупных политических сил. Мы вытащим их из этих лап."
 UKR_befriend_azerbaijan: "Дружба с Азербайджаном"
 UKR_befriend_azerbaijan_desc: "Азербайджан будет ценным союзником для продвижения нашей политики на Кавказе, где мы сможем активно противостоять влиянию России."
 UKR_befriend_georgia: "Союз с Грузией"
 UKR_befriend_georgia_desc: "Грузия является важным партнером и имеет стратегическую позицию в регионе Кавказа. Наличие такого союзника в альянсе будет очень полезно для нас."
 UKR_caucasus_volunteers: "Волонтеры с Кавказа"
 UKR_caucasus_volunteers_desc: "Мы пригласим много добровольцев с Кавказа для формирования батальонов ГУР."
 UKR_dagestan_reb_prepare: "Подготовить восстание в Дагестане"
 UKR_dagestan_reb_prepare_desc: "Мы начнем подготовку к специальной ограниченной операции в Дагестане."
 UKR_befriend_chechens: "Дружба с Ичкерией"
 UKR_befriend_chechens_desc: "Ичкерия, государство, которое было уничтожено Россией в начале этого века. Мы соберем ее истинных патриотов и попытаемся ее возродить."
 UKR_reconcista: "Украинская реконкиста"
 UKR_reconcista_desc: "Европейские государства погрязли в хаосе, эмигрантском кризисе. Народы Европы полностью под контролем глобалистов, которые в будущем обязательно приведут Европу к краху. Мы изменим это."
 UKR_no_russian_language: "Запрет русского языка"
 UKR_no_russian_language_desc: "Пришло время полностью разобраться с русским языком."
 UKR_kuban_ukrainization: "Украинизация Кубани"
 UKR_kuban_ukrainization_desc: "Кубань станет украинской. Мы об этом позаботимся."
 UKR_trizub: "Тризуб"
 UKR_trizub_desc: "На «Тризуб» возложены функции специфического характера, которые не получили другие крылья Националистического конгресса."
 UKR_christos_nash: "Христианский национализм"
 UKR_christos_nash_desc: "Христианство и национализм - это то, что должно быть объединено в нашем украинском государстве."
 UKR_nationalists_congress: "Политика Конгресса националистов"
 UKR_nationalists_congress_desc: "Настоящие патриоты Украины сейчас управляют страной. Какой бы жесткой ни была политика, она сделает нашу страну великой."
 UKR_nationalists_right_sector: "Правый сектор"
 UKR_nationalists_una_unso: "УНА УНСО"
 UKR_nationalists_upa: "УПА"
 UKR_nationalists_people_leave: "Миграция из Украины"
 UKR_nationalists_people_leave_desc: "Наша политика привела к массовой миграции из страны, но мы только рады, что все предатели наконец-то уедут отсюда!"
 UKR_nationalists_cleane_ukraine: "Настоящая Украина"
 UKR_nationalists_great_ukraine: "Великая Украина"
 UKR_nationalists_great_ukraine_desc: "Великая Украина начинается здесь!"
 UKR_nationalists_trizub: "Тризуб"
 UKR_nationalists_reconcista: "Возрожденная Реконкиста"
 UKR_nationalists_reconcista_desc: "Украина станет маяком возрождения христианства в Европе! Священный марш из Киева начинается."
 did_not_support_the_baltic_black_sea_union: "§YНе поддерживают инициативу Черноморско-Балтийского союза§!"
 ukraine_congress.2.t: "Украина берет Севастополь"
 ukraine_congress.2.d: "Украинское правительство расторгает с нами договор аренды и начинает изгнание нашего флота из Севастополя."
 ukraine_congress.2.a: "Это наше поражение"
 ukraine_congress.10.t: "Украина предлагает идеи Балто-Черноморья"
 ukraine_congress.10.d: "Балто-Черноморский союз - это концепция, похожая на концепцию Интермариума, давно выдвинутую Польшей. В ней говорится об оборонительном союзе стран, расположенных между Балтийским и Черным морями. Страны будут сотрудничать и объединяться в силовой блок, который будет поддерживать друг друга. Как говорится, сила в количестве.\n\n§YЭто позволяет обеспечить взаимные гарантии через украинское древо§!"
 ukraine_congress.10.a: "Мы должны продолжать изучать этот вопрос."
 ukraine_congress.10.b: "Глупая идея"
 ukraine_congress.11.t: "Балто-Черноморский союз"
 ukraine_congress.11.d: "Разработаны законы и договоры. Народы стран, поддерживающих эту идею, наконец-то объединились. Настало время воплотить амбиции в жизнь. Пришло время заключить союз с теми, кто нас поддерживал. Украина прислала нам последний договор, который мы должны подписать, чтобы закрепить союз. Отступим ли мы сейчас или останемся на прежнем уровне и поддержим наших новообретенных союзников?"
 ukraine_congress.11.a: "Подписать договор"
 ukraine_congress.11.b: "Отступить. Разорвать договор"
 UKR_poroshenko_start: "Президентство Порошенко"
 UKR_poroshenko_start_desc: "Украинское государство возглавил олигарх. История Украины явно не ожидала такого поворота, но, возможно, он приведет Украину к успеху?"
 UKR_poroshenko_decentr: "Децентрализация"
 UKR_poroshenko_decentr_desc: "Одним из главных политических пунктов программы Порошенко была и будет децентрализация. Мы должны реформировать украинское государство."
 UKR_poroshenko_deccomunism: "Декоммунизация"
 UKR_poroshenko_deccomunism_desc: "Коммунистическое прошлое было тяжелым и страшным для нашей страны. Наш народ был почти уничтожен голодомором, и мы не допустим, чтобы по всей стране стояли памятники нашим убийцам."
 UKR_poroshenko_anti_corruption: "Антикоррупционные реформы"
 UKR_poroshenko_anti_corruption_desc: "Коррупция была и будет больной темой в нашей стране. Мы проведем ряд антикоррупционных реформ."
 UKR_poroshenko_nabu: "Создать НАБУ"
 UKR_poroshenko_nabu_desc: "НАБУ - центральный орган исполнительной власти со специальным статусом, на который возложены функции по предупреждению, выявлению, пресечению, расследованию и раскрытию коррупционных и других уголовных правонарушений, отнесенных к его компетенции, а также предупреждению новых."
 UKR_poroshenko_no_russian_military: "Избавиться от влияния российских ВС"
 UKR_poroshenko_no_russian_military_desc: "Мы должны перестать зависеть от российской армии. Только независимая украинская армия защитит страну."
 UKR_poroshenko_anti_rus_doctrine: "Антироссийская доктрина"
 UKR_poroshenko_anti_rus_doctrine_desc: "Россия была и будет агрессором по отношению к нам. Мы должны четко отразить это в нашей военной доктрине."
 UKR_poroshenko_smi_free: "Свобода СМИ"
 UKR_poroshenko_smi_free_desc: "Средства массовой информации должны быть свободны и не должны ограничиваться диктаторскими привычками нескольких человек."
 UKR_poroshenko_kefalia: "Автокефалия украинской церкви"
 UKR_poroshenko_kefalia_desc: "Пришло время избавиться от влияния Московской православной церкви."
 UKR_poroshenko_ukrainisation: "Украинизация"
 UKR_poroshenko_ukrainisation_desc: "Мы начнем политику украинизации, и постепенно искореним русский язык из различных социальных сред."
 UKR_poroshenko_upa: "Чествовать героев УПА"
 UKR_poroshenko_upa_desc: "УПА были защитниками Украины. Мы будем их чтить."
 UKR_poroshenko_es: "Сотрудничество с ЕС"
 UKR_poroshenko_es_desc: "Европейский Союз будет нашим основным экономическим партнером, и мы будем стремиться поддерживать с ним торговые отношения и в дальнейшем."
 UKR_poroshenko_canada: "Партнерство с Канадой"
 UKR_poroshenko_canada_desc: "Мы готовы заключить несколько соглашений с Канадой для улучшения торговых отношений."
 UKR_us_friendship: "Партнерство с США"
 UKR_us_friendship_desc: "Мы готовы заключить несколько соглашений с США для улучшения торговых отношений."
 UKR_visegrad_coop: "Партнерство с Вишеградской группой"
 UKR_visegrad_coop_desc: "Мы готовы заключить несколько соглашений с Вишеградской группой для улучшения торговых отношений."
 UKR_turkey_invest_req: "Инвестиции из Турции"
 UKR_turkey_invest_req_desc: "Мы будем привлекать турецких инвесторов на нашу территорию. Их инвестиции помогут нашей экономике."
 UKR_kazakh_improve_rel: "Улучшить отношения с Казахстаном"
 UKR_kazakh_improve_rel_desc: "Казахстанские партнеры станут отличным дополнением к нашей внешнеэкономической деятельности."
 UKR_reorient_market: "Переориентация на западный рынок"
 UKR_reorient_market_desc: "Восток для нас закрыт. Мы будем переориентировать наши рынки на запад."
 UKR_ukroboronprom_revival: "Инвестиции в оборонную промышленность"
 UKR_ukroboronprom_revival_desc: "Наша оборонная промышленность нуждается в инвестициях. Мы их дадим."
 UKR_smuggle_parts_through_russia: "Закупать запчасти в России окольными путями"
 UKR_smuggle_parts_through_russia_desc: "Несмотря на нашу антироссийскую доктрину, мы вынуждены закупать запчасти на российских заводах, пусть и окольными путями."
 UKR_reverse_engineering: "Обратная разработка"
 UKR_reverse_engineering_desc: "Мы будем стремиться к созданию собственного инжиниринга в области бронетехники."
 UKR_western_assistance: "Западная поддержка"
 UKR_western_assistance_desc: "Западные инвесторы также активно вкладывают средства в нашу оборонную промышленность."
 UKR_poroshenko_nato: "Сотрудничество с НАТО"
 UKR_poroshenko_nato_desc: "НАТО — наш главный военный партнёр, и с его помощью мы реформируем наши вооружённые силы."
 UKR_belarus_proposal_non_attack: "Пакт о ненападении с Беларусью"
 UKR_belarus_proposal_non_attack_desc: "Беларусь, наш северный сосед, может быть использована врагами для нападения на нас с двух сторон. Мы должны предотвратить это."
 UKR_language_policies: "Языковая политика"
 UKR_language_policies_desc: "Мы будем продолжать расширять долю украинского языка в общении и в других сферах жизни граждан."
 UKR_support_patriotism: "Поддержка патриотизма"
 UKR_support_patriotism_desc: "Патриотизм будет поощряться государством как никогда раньше."
 UKR_donbass_okopi: "Проект «Стена»"
 UKR_donbass_okopi_desc: "Нам срочно нужно построить оборонительную линию вдоль границы нашего врага."
 UKR_transnistria_defences: "Укрепить границу с Приднестровьем"
 UKR_transnistria_defences_desc: "Приднестровье может стать плацдармом для нападения на нас в будущем, мы будем укреплять границу с ними."
 UKR_deoligarchisation: "Деолигархизация"
 UKR_deoligarchisation_desc: "Олигархи имеют слишком много власти в нашей стране. Мы это исправим."
 UKR_rochen_expansion: "Расширить производство Roshen"
 UKR_rochen_expansion_desc: "Теперь фабрика Roshen сможет расширить свои производственные возможности с помощью государственных инвестиций."
 UKR_support_medium_businesses: "Поддержка малого бизнеса"
 UKR_support_medium_businesses_desc: "Малые предприятия получат необходимую поддержку."
 UKR_kolomoyski_deal: "Убрать Коломойского"
 UKR_kolomoyski_deal_desc: "Коломойский долгое время был одной из главных проблем нашей страны. Его влияние было слишком велико, и пришло время с ним разобраться."
 UKR_purge_church_from_rus: "Ликвидировать влияние РПЦ"
 UKR_purge_church_from_rus_desc: "Русская православная церковь больше не будет влиять на нас."
 UKR_greece_letter: "Обращение к Вселенскому Патриарху"
 UKR_greece_letter_desc: "Мы обратимся к Вселенскому Патриарху с просьбой признать нашу церковь независимой."
 UKR_upc_create: "Создать Украинскую православную церковь"
 UKR_upc_create_desc: "Украинская православная церковь будет создана! Теперь мы еще и духовно свободная страна."
 UKR_poroshenko_army_reform: "Реформа армии"
 UKR_poroshenko_army_reform_desc: "Наша армия нуждается в серьезных реформах - мы начнем их проводить уже сейчас."
 UKR_pmc_instructors: "Инструкторы из западных ЧВК"
 UKR_pmc_instructors_desc: "Инструкторы западных ЧВК готовы поддержать нашу армию."
 UKR_rally_nationalist_support: "Поддержка ветеранов"
 UKR_rally_nationalist_support_desc: "Ветераны боевых действий будут главной опорой нашей будущей избирательной кампании."
 UKR_welfare_conseccions: "Увеличить социальную поддержку"
 UKR_welfare_conseccions_desc: "В будущем мы сосредоточим нашу избирательную кампанию на повышении социальных гарантий."
 UKR_anti_russia_propaganda: "Антироссийская пропаганда"
 UKR_anti_russia_propaganda_desc: "Наш гражданин должен понимать, кто его истинный враг, который стремится поглотить нашу страну. Конечно же это Россия."
 UKR_saakashvili_odessa: "Пригласить Саакашвили на пост губернатора Одессы"
 UKR_saakashvili_odessa_desc: "Мы пригласим Саакашвили на должность губернатора Одесской области, возможно, он покажет себя с лучшей стороны."
 UKR_support_minsk_agreements: "Поддерживать Минские соглашения"
 UKR_support_minsk_agreements_desc: "Мы будем поддерживать Минские соглашения и постараемся решить все мирным путем."
 UKR_continue_shelling: "Покончить с сепаратистами"
 UKR_continue_shelling_desc: "Нет сепаратистам! Мы освободим наши земли."
 UKR_business_with_rf: "Бизнес с Россией"
 UKR_business_with_rf_desc: "Мы будем продолжать вести бизнес с Россией."
 UKR_full_rus_embargo_por: "Ввести эмбарго против России"
 UKR_full_rus_embargo_por_desc: "Мы введем эмбарго на экономическое сотрудничество с Россией."
 UKR_osce_watchers: "Наблюдатели ОБСЕ"
 UKR_osce_watchers_desc: "Наблюдатели ОБСЕ будут приглашены в Донбасс."
 UKR_suppress_easterner: "Подавлять восточников"
 UKR_suppress_easterner_desc: "Сторонников интеграции с Россией нужно подавлять, в том числе через СМИ."
 UKR_anti_emerg_1plus1: "Усилить антивосточную пропаганду"
 UKR_anti_emerg_1plus1_desc: "Мы усилим пропаганду, направленную против тех, кто поддерживает Россию."
 UKR_eu_compliant_reforms: "Реформы по соблюдению требований ЕС"
 UKR_eu_compliant_reforms_desc: "Мы продолжим реформы соответствия для интеграции в Европейский Союз."
 UKR_european_education_connections: "Сотрудничество с европейскими образовательными учреждениями"
 UKR_european_education_connections_desc: "Европейское образование даст нам гораздо больше, чем старое, советское и тоталитарное."
 UKR_european_defence_program: "Европейская программа защиты"
 UKR_european_defence_program_desc: "Мы присоединимся к Европейской программе обороны, чтобы укрепить наши вооруженные силы."
 UKR_nato_application_por: "Программа сотрудничества с НАТО"
 UKR_nato_application_por_desc: "Партнерство НАТО в области вооруженных сил также позволит нам провести реформы нашей армии."
 UKR_ukraine_anew: "Новая Украина"
 UKR_ukraine_anew_desc: "Наша страна прошла долгий путь, многие реформы, но теперь она переродилась и с оптимизмом смотрит в будущее."
 UKR_apply_to_eu_por: "Программа сотрудничества с ЕС"
 UKR_apply_to_eu_por_desc: "Сотрудничество с Европейским Союзом останется нашим приоритетом."
 UKR_anti_rus_doctrine: "Антироссийская доктрина"
 UKR_anti_rus_doctrine_desc: "Нашим политическим и идеологическим врагом была и остается Россия. Мы должны принять это и быть готовыми к войне."
 UKR_foreign_advisors_desc: "Иностранные инструкторы из различных ЧВК готовы обучать наших солдат."
 UKR_west_investors: "Западные инвесторы"
 UKR_operation_wall: "Проект «Стена»"
 UKR_smuggle_parts_from_rus: "Закупка запчастей из России"
 UKR_smuggle_parts_from_rus_desc: "Мы продолжаем закупать запчасти в России, хотя и тайно."
 UKR_reverse_engineering_start: "Обратный инжиниринг"
 UKR_reverse_engineering_start_desc: "Мы стремимся создать собственное производство."
 UKR_ato_supports: "Поддержка ветеранов"
 UKR_health_supports: "Поддержка здравоохранения"
 UKR_poroh_prepare_donbass: "Готовиться к реваншу в Донбассе"
 UKR_poroh_prepare_donbass_desc: "Мы готовы взять реванш у сепаратистов и навсегда решить проблему с народными республиками."
 UKR_poroh_osce_ukr: "Наблюдатели ОБСЕ"
 UKR_poroh_osce_ukr_desc: "В зону конфликта направлены наблюдатели ОБСЕ для стабилизации ситуации на линии фронта с непризнанными республиками."
 ukraine_poroh.1.t: "Украина предлагает пакт о ненападении"
 ukraine_poroh.1.d: "Украинское правительство предлагает нам заключить с ними пакт о ненападении, видимо, они видят в нас потенциальных агрессоров против себя."
 ukraine_poroh.1.a: "Мы подпишем пакт"
 ukraine_poroh.1.b: "В этом нет необходимости"
 ukraine_poroh.2.t: "Пакт о ненападении с Беларусью"
 ukraine_poroh.2.d: "Белорусское правительство согласилось подписать с нами пакт о ненападении, мы рады, что они на нашей стороне."
 ukraine_poroh.2.a: "Хорошо"
 ukraine_poroh.3.t: "Договор о ненападении с Беларусью"
 ukraine_poroh.3.d: "Белорусское правительство отказалось подписать с нами пакт о ненападении, что вызывает у нас беспокойство."
 ukraine_poroh.3.a: "Печально"
 ukraine_poroh.4.t: "Автокефалия Украинской Церкви"
 ukraine_poroh.4.d: "Украинская церковь обратилась к нашему Вселенскому патриарху за разрешением на автокефалию ее церкви. Разрешит ли это наш патриарх?"
 ukraine_poroh.4.a: "Да"
 ukraine_poroh.4.b: "Нет"
 ukraine_poroh.5.t: "Автокефалия Украинской Церкви"
 ukraine_poroh.5.d: "Вселенский Патриарх утвердил автокефалию нашей Церкви."
 ukraine_poroh.5.a: "Хорошо"
 ukraine_poroh.6.t: "Автокефалия Украинской Церкви"
 ukraine_poroh.6.d: "Вселенский патриарх не утвердил автокефалию нашей церкви."
 ukraine_poroh.6.a: "Печально"
 ukraine_poroh.7.t: "Украина хочет сотрудничества с Вышеградской четверкой"
 ukraine_poroh.7.d: "Украинское правительство четко изложило свои планы по сотрудничеству со странами Вышеградской четверки. Как представитель этой четверки, мы решаем, согласны ли мы на это сотрудничество?"
 ukraine_poroh.7.a: "Да"
 ukraine_poroh.7.b: "Нет"
 ukraine_poroh.8.t: "Сотрудничество с Вышеградскими странами"
 ukraine_poroh.8.d: "Они согласились сотрудничать."
 ukraine_poroh.8.a: "Хорошо"
 ukraine_poroh.9.t: "Сотрудничество с Вышеградскими странами"
 ukraine_poroh.9.d: "Они отказались сотрудничать с нами."
 ukraine_poroh.9.a: "Грустно"
 UKR_kefalia_agree: "Разрешение Вселенского Патриарха"
 UKR_odessa_ssaka: "Последствия губернаторства Саакашвили"
 UKR_odessa_ssak: "Последствия губернаторства Саакашвили"
 ukr_industry_points_cost_35: "35 очков промышленности"
 ukr_industry_points_cost_50: "50 очков промышленности"
 ukr_industry_points_cost_75: "75 очков промышленности"
 UKR_opfl_political_reforms: "Политические реформы"
 UKR_opfl_political_reforms_desc: "После последних событий наша страна нуждается в политических реформах. Без них Украина не сможет развиваться дальше."
 UKR_opfl_lustration_fight: "Борьба с люстрацией"
 UKR_opfl_lustration_fight_desc: "Люстрация - это ограничение доступа к государственным услугам для тех, кто занимал высокие должности при предыдущих политических режимах. После недавних событий эта политика проводится и в Украине. Это безобразие должно быть остановлено."
 UKR_opfl_radicalism: "Борьба с радикализмом"
 UKR_opfl_radicalism_desc: "За несколько лет политического хаоса радикализм распространился по всей Украине. Для мирного существования нашей страны необходимо бороться с любыми проявлениями радикализма в нашей стране."
 UKR_opfl_ukrainisation_policy: "Осуждение украинизации"
 UKR_opfl_ukrainisation_policy_desc: "Политика украинизации напрямую препятствует развитию хороших отношений с нашим большим соседом — Россией. Необходимо осудить и прекратить пропаганду украинизации, иначе ничего хорошего из этого не выйдет."
 UKR_opfl_national_ref: "Проведение общенационального референдума"
 UKR_opfl_national_ref_desc: "Национальный референдум поможет народу нашей страны определить свое будущее. Нам нужно сделать это как можно скорее!"
 UKR_opfl_independence_rep: "Признать независимость республик"
 UKR_opfl_independence_rep_desc: "Что ж, народ республик сделал свой выбор, и мы должны его уважать. Самое время инвестировать и налаживать связи с новыми государствами."
 UKR_opfl_take_republic: "Вернуть силой"
 UKR_opfl_take_republic_desc: "Референдум был всего лишь дымовой завесой. Наша настоящая цель — выявить сепаратистов на нашей территории, и пришло время вернуть наши территории домой! Сепаратисты не будут ходить по украинской земле!"
 UKR_opfl_federalisation_project: "Проект федерализации"
 UKR_opfl_federalisation_project_desc: "Теперь, когда все территориальные споры решены, мы можем смотреть в светлое будущее. Пришло время для Украинской Федерации!"
 UKR_opfl_economic_policy: "Новая экономическая политика"
 UKR_opfl_economic_policy_desc: "Новая экономическая политика поможет оживить нашу экономику и впоследствии восстановить ее."
 UKR_opfl_rural_land: "Сохранение сельских земель"
 UKR_opfl_rural_land_desc: "Сельская деятельность является большой частью нашей экономики. Поэтому необходимо обезопасить их законно приобретенные земли. Так мы дадим им уверенность в том, что их землю не отберут на следующий день."
 UKR_opfl_tarif_genocide: "Нет! Тарифный геноцид"
 UKR_opfl_tarif_genocide_desc: "Тарифный геноцид - это кошмар для наших граждан. Большая часть их денег уходит на уплату многочисленных и бессмысленных налогов. Мы должны сказать «НЕТ» этому беззаконию!"
 UKR_opfl_deindustry: "Остановить деиндустриализацию Украины"
 UKR_opfl_deindustry_desc: "После обретения Украиной независимости старое правительство раздало все промышленные богатства нашей страны кому попало и за бесценок. В результате мы оказались в промышленной яме. Нам нужно возобновить строительство фабрик, заводов и других предприятий."
 UKR_federaliz_tt: "Мы §Yфедерализируем§! Украину"
 UKR_rosava: "ЗАО «Росава»"
 UKR_rosava_desc: "ЗАО «Росава» - крупнейший производитель шин в Украине. Производственные площадки расположены на двух шинных заводах: Росава и по производству крупногабаритных шин. Мощность достигает около 6 млн. шт. шин в год."
 UKR_land_land: "Продолжить земельную реформу"
 UKR_land_land_desc: "Мы готовы продолжить земельную реформу, начатую в прошлом веке, и двигать ее вперед."
 UKR_motor_sich: "Мотор Сич"
 UKR_motor_sich_desc: "Акционерное общество «Мотор Сич» — украинский производитель авиадвигателей со штаб-квартирой в Запорожье. Компания производит двигатели для самолетов и вертолетов, а также промышленные морские газовые турбины и установки."
 UKR_armor_kyv: "Киевский бронетанковый завод"
 UKR_armor_kyv_desc: "Киевский бронетанковый завод - государственное предприятие бронетанковой промышленности Украины, осуществляющее диагностику, ремонт, техническое обслуживание, переоборудование и модернизацию бронетанковой техники советского производства."
 UKR_pivdenmash_idea: "ПО Пивденмаш"
 UKR_kyvarmor_idea: "Киевский бронетанковый завод"
 UKR_zaz_idea: "ЗАЗ"
 UKR_kraz_idea: "КрАЗ"
 UKR_motorsich_idea: "Мотор Сич"
 UKR_start_war_against_poland: "Польско-украинская война"
 UKR_start_war_against_poland_desc: "Наступил решающий момент нашего государства. Мы дадим отпор врагу или исчезнем из мировой истории."
 UKR_hur_expandeds: "Расширить влияние ГУР"
 UKR_hur_expandeds_desc: "Мы будем расширять полномочия ГУР. Этого требует ситуация, этого требует война!"
 UKR_unite_with_russian_genshtab: "Заручиться помощью российского генштаба"
 UKR_unite_with_russian_genshtab_desc: "Мы готовы заручиться помощью российского Генштаба для войны с польской армией."
 UKR_observer_joint_shtab_kiev: "Создать объединенный штаб"
 UKR_observer_joint_shtab_kiev_desc: "Вооруженные силы России и Украины создадут в Киеве совместный генеральный штаб."
 UKR_professional_shturm_groups: "Штурмовые бригады"
 UKR_professional_shturm_groups_desc: "Мы начнем набирать людей в штурмовые бригады, чтобы более эффективно противостоять нашим врагам"
 UKR_pmc_zaporozhets: "ЧВК «Запорожец»"
 UKR_pmc_zaporozhets_desc: "Некоторые ветераны войны создали свою частную военную компанию под названием «Запорожец»."
 UKR_start_the_kashubian_uprising: "Подготовить восстание в Кашубии"
 UKR_start_the_kashubian_uprising_desc: "Мы подготовим восстание в этом регионе, чтобы подорвать оборону Польши."
 UKR_silesian_rebellion: "Подготовить восстание в Силезии"
 UKR_silesian_rebellion_desc: "Мы подготовим восстание в этом регионе, чтобы подорвать оборону Польши."
 UKR_vilnoe_pospolitoe_rushenie: "Батальон «Посполитая Русь»"
 UKR_vilnoe_pospolitoe_rushenie_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на территории противника."
 UKR_belarus_volunteers: "Батальон Рокоссовского"
 UKR_belarus_volunteers_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на территории противника."
 UKR_legion_free_poland: "Легион Свободы Польши"
 UKR_legion_free_poland_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на территории противника."
 UKR_polish_hetmanate_army: "Батальон Польского Гетманата"
 UKR_polish_hetmanate_army_desc: "Будет создан новый оперативный батальон ГУР для проведения специальных ограниченных операций на территории противника."
 UKR_air_dominance_tactics: "Тактика авиационного господства"
 UKR_air_dominance_tactics_desc: "Нам нужно подавить польскую авиацию, поэтому мы будем применять новую доктрину."
 UKR_tro_expandeds: "Укреплять территориальную оборону"
 UKR_tro_expandeds_desc: "Мы расширим набор на территориальную оборону. Нам срочно нужны бойцы!"
 UKR_start_war_against_russia: "Русско-украинская война"
 UKR_start_war_against_russia_desc: "Наступил решающий момент нашего государства. Мы дадим отпор врагу или исчезнем из мировой истории."
 UKR_hur_expanded: "Расширить влияние ГУР"
 UKR_hur_expanded_desc: "Мы будем расширять полномочия ГУР. Этого требует ситуация, этого требует война!"
 UKR_tro_expanded: "Укреплять территориальную оборону"
 UKR_tro_expanded_desc: "Мы расширим набор в территориальную оборону. Нам срочно нужны бойцы!"
 UKR_tck: "Массовая мобилизация"
 UKR_tck_desc: "Мы должны будем начать массовую мобилизацию, потому что это буквально война за существование нашего государства."
 UKR_other_battaions_hur: "Новые батальоны ГУР"
 UKR_other_battaions_hur_desc: "ГУР активно набирает бойцов в свои батальоны. Некоторые из них уже готовы вступить в бой."
 UKR_free_russia_legion: "Легион «Свобода России»"
 UKR_free_russia_legion_desc: "Настоящие русские патриоты готовы сражаться за нас и свергнуть тиранию, нависшую над Россией."
 UKR_rdk: "Русский добровольческий корпус"
 UKR_rdk_desc: "Российские националисты, не согласные с политикой России, самоорганизовались под нашим командованием в Российский добровольческий корпус."
 UKR_republican_army: "Национальная республиканская армия"
 UKR_republican_army_desc: "Беглые депутаты из России создали национальную республиканскую армию, которая будет вести активную партизанскую деятельность против режима."
 UKR_separatist_battalions: "Привлечь сепаратистские батальоны"
 UKR_separatist_battalions_desc: "Не только русские, но и другие народы готовы бороться за свободу от российского империализма."
 UKR_drone_army: "Армия дронов"
 UKR_drone_army_desc: "Мы начнем массовое производство беспилотников. Стране нужны тысячи беспилотников."
 UKR_tck_mobka: "Тотальная мобилизация"
 UKR_tck_mobka_desc: "Мы вынуждены провести несколько волн мобилизации, чтобы пополнить наши вооруженные силы."
 UKR_attack_guardia: "Наступательная гвардия"
 UKR_attack_guardia_desc: "Мы готовы перейти от обороны к наступлению! Атакуйте, чтобы победить врага!"
 UKR_inter_legion_idea: "Международный легион"
 UKR_inter_legion_idea_desc: "Многие иностранцы со всего мира готовы поддержать нас в борьбе за независимость."
 UKR_air_superior_idea: "Тактика воздушного господства"
 UKR_air_superior_idea_desc: "Мы стремимся к завоеванию превосходства в воздухе."
 UKR_hur_other_battalions_created_tt: "§YНовые батальоны ГУР§! будут созданы"
 UKR_free_russia_created_tt: "§YЛегион Свободы России§! будет доступен для специальных ограниченных операций"
 UKR_rdk_created_tt: "§YРусский добровольческий корпус§! будет доступен для специальных ограниченных операций"
 UKR_republican_army_created_tt: "§YРегиональные сепаратистские батальоны§! станут доступны для специальных операций"
 UKR_free_poland_created_tt: "§YЛегион Свободы Польши§! будет доступен для специальных ограниченных операций"
 UKR_rushenie_created_tt: "§YБатальон «Посполитое рушение»§! будет доступен для специальных ограниченных операций"
 UKR_rokossovski_created_tt: "§YБатальон Рокоссовского§! будет доступен для специальных ограниченных операций"
 UKR_hetmanat_created_tt: "§YБатальон Польского Гетманата§! будет доступен для специальных ограниченных операций"
 UKR_polish_army_created_tt: "§YПольская освободительная армия§! будет доступна для специальных ограниченных операций"
 ukraine_kolom.1.t: "Коломойский объявил о создании республики"
 ukraine_kolom.1.d: "Игорь Коломойский, один из самых богатых олигархов Украины, объявил о создании Днепропетровской республики как автономии в составе Украины.  Это вызвало шок у нашего правительства, и теперь нам предстоит решить, что с этим делать."
 ukraine_kolom.1.a: "Нет автономии"
 ukraine_kolom.1.b: "Возможно, это будет полезно для нас"
 ukraine_kolom.2.t: "Наша армия"
 ukraine_kolom.2.d: "Те подразделения, которые мы финансировали собственными средствами, встали на нашу сторону, и теперь они являются нашей основной ударной силой."
 ukraine_kolom.2.a: "За свободу Днепра!"
 UKR_recruit_arestovich: "Завербовать Арестовича"
 UKR_recruit_arestovich_desc: "Арестович станет отличным агентом наших спецслужб. Его выдающиеся способности пригодятся нам."
 UKR_korchinsky_strategy: "Стратегия Корчинского"
 UKR_korchinsky_strategy_desc: "Стратегия Корчинского предполагает борьбу и с западными элементами... Борьбу с внешним врагом, который реально угрожает суверенитету Украины."
 UKR_psiop_operations: "Псиоп-операции"
 UKR_psiop_operations_desc: "Мы освоили технику психологических операций и готовы применять её против наших врагов."
 UKR_bratstvo_psiop_idea: "Псиоп-операции"
 UKR_bratstvo_psiop_idea_desc: "Враг должен быть сломлен и психически. Для этого мы будем проводить псиоп-операции."
 UKR_vitrenko_party: "Новый социализм"
 UKR_vitrenko_party_desc: "Украина уже давно находится в плену националистических и прозападных настроений, которые разрывают страну пополам. Мы же дадим нашим гражданам то, что они ищут - стабильность и процветание. Наш социализм сделает их счастливыми."
 UKR_economic_orthodoxy: "Экономическое православие"
 UKR_economic_orthodoxy_desc: "Наша страна должна быть сильной не только экономически, но и духовно. Почему бы не объединить эти два аспекта?"
 UKR_install_christian_socialism: "Христианский социализм"
 UKR_install_christian_socialism_desc: "Мы не откажемся от наших социалистических идей, потому что продолжаем верить в Бога. Идеологи социализма привели его к краху, потому что отдалились от Бога. Мы не повторим их ошибок."
 UKR_iron_woman: "Стальная женщина"
 UKR_iron_woman_desc: "Наталья Витренко, как сталь, защищает те идеи, которые считает единственно правильными для Украины, и не собирается ни перед кем прогибаться."
 UKR_resovetization: "Ресоветизация"
 UKR_resovetization_desc: "Советская эпоха дала нашей стране такое развитие, какого она не видела ни при одном правительстве, ни при царе, ни при поляках, ни при независимости. Мы принимаем этот факт и будем продвигать культ социализма."
 UKR_rally_out_the_coalition: "Национальная коалиция"
 UKR_rally_out_the_coalition_desc: "Сторонники совершенно разных идей, национал-большевики, сторонники Российской империи, социализма и русофилы объединились под знаменами нашей партии. Все вместе мы превратим нашу страну в лучшее государство в истории."
 UKR_praymaya_electro_demokratia: "Прямая электро-демократия"
 UKR_praymaya_electro_demokratia_desc: "Мы устали от диктатуры и тоталитаризма, наш народ заслуживает демократии в лучшем ее проявлении."
 UKR_storm_sturm_at_parliament: "Штурм парламента"
 UKR_storm_sturm_at_parliament_desc: "Мы избавимся от тех, кто саботирует нашу деятельность в наших государственных органах."
 UKR_befriend_russia_vit: "Партнерство с Россией"
 UKR_befriend_russia_vit_desc: "Исторически мы связаны с Россией и всегда будем связаны с ней. Наше партнерство с Россией - это то, что должно быть очевидно, как восход солнца."
 UKR_apply_to_union_state: "Присоединиться к Союзному государству"
 UKR_apply_to_union_state_desc: "Союзное государство – один из первых и важнейших этапов единения нашего единого народа, мы намерены стать частью этого проекта."
 UKR_honor_russian_empire: "Уважать наследие Российской империи"
 UKR_honor_russian_empire_desc: "Российская империя была великой державой, и было бы глупо и несправедливо отрицать ее достижения. Мы помним о величии Романовых."
 UKR_free_healthcare: "Бесплатное здравоохранение"
 UKR_free_healthcare_desc: "Мы вернем советскую практику бесплатного здравоохранения. Граждане должны быть здоровы!"
 UKR_national_bolshevist_rhetoric: "Национал-большевистская риторика"
 UKR_national_bolshevist_rhetoric_desc: "Наша партия также многое заимствует из программы национал-большевиков, с которой мы единодушно согласны."
 UKR_russo_ukrainian_nationalism: "Русско-украинский национализм"
 UKR_russo_ukrainian_nationalism_desc: "Наши народы всегда должны подниматься и помнить их величие, мы будем активно поддерживать националистические движения наших стран."
 UKR_naz_pioners: "Национальные пионеры"
 UKR_naz_pioners_desc: "Пионерия была отличной идеей советского руководства, мы её возродим, но с нашими особыми особенностями."
 UKR_calm_ruthenia: "Объявить себя наследниками Рутении"
 UKR_calm_ruthenia_desc: "Мы считаем, что наследие Древней Руси тоже не должно быть забыто! Мы напомним всем, что Русь существовала на этих землях."
 UKR_proclaim_rus_ukraine: "Объявить о возрождении Рутении"
 UKR_proclaim_rus_ukraine_desc: "Рутения возрождается! Именно сегодня, здесь, на землях Украины!"
 UKR_federalize_galicia_and_zakarpat: "Федерализация Галиции"
 UKR_federalize_galicia_and_zakarpat_desc: "Пришло время решить сепаратистский вопрос в Галичине. Только федерализация спасет нас."
 UKR_lnr_dnr_peace_integrate: "Федерализация Восточной Украины"
 UKR_lnr_dnr_peace_integrate_desc: "Ошибки, совершенные предыдущим правительством, теперь мы должны решить. Мы готовы к федерализации проекта, чтобы положить конец разделению нашей страны."
 UKR_suppress_western_and_bander: "Подавить западное влияние"
 UKR_suppress_western_and_bander_desc: "Влияние Запада должно быть целенаправленно ослаблено в нашей стране."
 UKR_restore_russian_church: "Вернуться к русской церкви"
 UKR_restore_russian_church_desc: "Автокефалия была ошибкой. Мы духовно отдалились от наших братьев и больше не намерены повторять такую ошибку."
 UKR_no_to_upc: "Распустить Украинскую православную церковь"
 UKR_no_to_upc_desc: "Еретики должны быть разогнаны."
 UKR_clear_out_pcu: "Очистить церковь"
 UKR_clear_out_pcu_desc: "Сторонников автокефалии и всех их сочувствующих необходимо взять под наш контроль."
 UKR_restore_apostolacy: "Возвращение РПЦ"
 UKR_restore_apostolacy_desc: "Русская Православная Церковь снова господствует на нашей земле!"
 UKR_full_socialism: "Упор на социализм"
 UKR_full_socialism_desc: "Мы еще глубже погрузимся в доктрины социализма и продолжим внедрять их в нашей стране."
 UKR_install_true_soviet_folk: "Народный социализм"
 UKR_install_true_soviet_folk_desc: "Мы сделаем все, чтобы наш гражданин чувствовал себя счастливым."
 UKR_appease_pro_russian_oligarchs: "Сотрудничать с пророссийскими олигархами"
 UKR_appease_pro_russian_oligarchs_desc: "Мы готовы наладить сотрудничество с пророссийской олигархией, потому что их инвестиции укрепят нашу экономику."
 UKR_loyalist_oligarchy_ens: "Принять лояльных олигархов"
 UKR_loyalist_oligarchy_ens_desc: "Лояльные олигархи также будут на нашей стороне, тем самым обеспечивая свои финансы внутри страны."
 UKR_industrial_revival: "Промышленное возрождение"
 UKR_industrial_revival_desc: "Наша страна осталась без своей промышленной мощи после распада СССР, пришло время возродить её."
 UKR_national_feminism: "Национальный феминизм"
 UKR_national_feminism_desc: "Женщины также должны стать двигателем роста нашей страны, и мы будем поощрять их участие во всех отраслях."
 UKR_foreign_policy_det: "Наш внешнеполитический курс"
 UKR_foreign_policy_det_desc: "Наша страна должна сама решить, какой путь она выберет в внешней политике."
 UKR_fully_antagonize_the_west: "Антагонизм к Западу"
 UKR_fully_antagonize_the_west_desc: "Мы не намерены дружить с Западом, потому что знаем, что у Запада нет друзей - только рабы и слуги."
 UKR_ukr_sov_mil_coop: "Военное сотрудничество с Россией"
 UKR_ukr_sov_mil_coop_desc: "Мы проведем серию военных учений с российской армией."
 UKR_euroscepticism_campaign: "Мощный евроскептицизм"
 UKR_euroscepticism_campaign_desc: "Мы были и останемся евроскептиками."
 UKR_join_csto: "Вступить в ОДКБ"
 UKR_join_csto_desc: "Мы готовы подписать документ о вступлении в ОДКБ. Только Россия может дать нам гарантии безопасности."
 UKR_reconcile_with_west: "Улучшить взаимодействие с Западом"
 UKR_reconcile_with_west_desc: "Мы намерены улучшить взаимодействие с западными странами."
 UKR_nato_ukr_train: "Учения со странами НАТО"
 UKR_nato_ukr_train_desc: "Мы будем частично продвигать доктрину НАТО в наших вооруженных силах, а также проведем с ними ряд учений."
 UKR_join_nato_with_russia: "Вступление в НАТО вместе с Россией"
 UKR_join_nato_with_russia_desc: "Мы намерены вступить в НАТО, но только вместе с Россией, и предложим эту идею российскому правительству."
 UKR_full_nazbol_transition: "Нац-большевистское возрождение"
 UKR_full_nazbol_transition_desc: "Пришло время очередного этапа развития нашей страны и всей славянской семьи в принципе. Мы вступаем на путь единения славян."
 UKR_serbia_unify: "Национал-большевистская революция: [SER.GetName]"
 UKR_serbia_unify_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_bulgaria_unification: "Национал-большевистская революция: [BUL.GetName]"
 UKR_bulgaria_unification_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_unification_with_belarus: "Национал-большевистская революция: [BLR.GetName]"
 UKR_unification_with_belarus_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_poland_unification: "Национал-большевистская революция: [POL.GetName]"
 UKR_poland_unification_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_demand_bosnia: "Национал-большевистская революция: [BOS.GetName]"
 UKR_demand_bosnia_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_czech_unification: "Национал-большевистская революция: [CZE.GetName]"
 UKR_czech_unification_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_demand_croatia_slovenia: "Национал-большевистская революция: [CRO.GetName]"
 UKR_demand_croatia_slovenia_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_slovakia_unify: "Национал-большевистская революция: [SLO.GetName]"
 UKR_slovakia_unify_desc: "Наши братья наконец-то освободятся от правительства, которое угнетало их как славянский народ!"
 UKR_propose_full_union_state: "Настоящее союзное государство"
 UKR_propose_full_union_state_desc: "Пришло время нам с Россией стать настоящим Союзным государством!"
 UKR_pan_slavic_ssr: "Союз славянских республик"
 UKR_pan_slavic_ssr_desc: "Наконец-то все славяне станут едины!"
 UKR_vetrenko_surrort_nationalism: "Русско-украинский национализм"
 UKR_vetrenko_inner_idea: "Внутренняя политика"
 UKR_vetrenko_inner_idea_desc: "Мы готовы проводить политику независимости от Запада и укрепления Украины — мы сыты по горло диктатурой западного капитала."
 UKR_vetrenko_christian_socialism: "Христианский социализм"
 UKR_vetrenko_christian_socialism_desc: "В Украине Бог и социализм идут рука об руку."
 UKR_vetrenko_west_idea: "Антизападная доктрина"
 UKR_vetrenko_west_idea_desc: "Мы не скрываем, что Запад является нашим идеологическим и прямым врагом."
 UKR_vetrenko_pioneria: "Национальная пионерия"
 UKR_vetrenko_women_idea: "Национальный феминизм"
 UKR_vetrenko_women_idea_desc: "Женщины Украины рука об руку с мужчинами построят великое государство."
 UKR_vetrenko_iron_woman: "Украинская железная женщина"
 UKR_vetrenko_iron_woman_desc: "Витренко стал для нас тем же, кем была Маргарет Тэтчер."
 UKR_vetrenko_health_free_idea: "Бесплатное здравоохранение"
 ukraine_nazbol.1.t: "Начать вторжение в [FROM.GetName]?"
 ukraine_nazbol.1.d: "Нам удалось поднять восстание в этой стране, но теперь нам нужно решить, готовы ли мы положить ему конец и признать, что эта революция — наше дело."
 ukraine_nazbol.1.a: "Да"
 ukraine_nazbol.1.b: "Нет"
 ukraine_nazbol.2.t: ""
 ukraine_nazbol.2.d: ""
 ukraine_nazbol.2.a: ""
 ukraine_nazbol.3.t: "Национал-большевистская революция!"
 ukraine_nazbol.3.d: "Неожиданно для нас в нашей стране произошла революция под лозунгами национал-большевиков! Мы в срочном порядке мобилизовали армию и все вооружённые силы для борьбы с сепаратистами. Мы знаем, что ими руководит [UKR.GetName], и намерены разобраться с этим в будущем."
 ukraine_nazbol.3.a: "Неожиданно..."
 ukraine_nazbol.4.t: "[FROM.GetName] восхваляет наследие Российской империи"
 ukraine_nazbol.4.d: "Правительство Украины прямо на государственном уровне заявляет о прославлении прошлого и наследия Российской империи, и мы должны как-то отреагировать на этот шаг."
 ukraine_nazbol.4.a: "Мы тоже гордимся"
 ukraine_nazbol.4.b: "Мы осуждаем это"
 ukraine_nazbol.5.t: "[FROM.GetName] солидарен с нами"
 ukraine_nazbol.5.d: "[FROM.GetName] солидарен с нами в вопросе наследия Российской империи и готов оказать нам поддержку на дипломатическом уровне по данному вопросу."
 ukraine_nazbol.5.a: "Это здорово!"
 ukraine_nazbol.6.t: "[FROM.GetName] осуждает нас"
 ukraine_nazbol.6.d: "[FROM.GetName] осуждает тот факт, что мы не осуждаем имперские амбиции; «Новая Россия» никогда не станет недемократическим государством и всегда будет отстаивать идеалы мирного сотрудничества, а не экспансии."
 ukraine_nazbol.6.a: "Трусы"
