 BSH_infantry_weapons_2: "AK-74"
 BSH_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 BSH_infantry_weapons_3: "AK-74N"
 BSH_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 BSH_infantry_weapons_4: "AK-74M"
 BSH_infantry_weapons_4_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
 BSH_infantry_weapons_5: "AK-103"
 BSH_infantry_weapons_5_desc: "AK-103 돌격소총은 7.62x39mm M43 탄약을 사용하는 AK-74M의 파생형입니다. 구형 AKM과 마찬가지로 AK-103은 야간 투시경과 망원 조준경을 포함한 다양한 조준기를 사용할 수 있으며, 총검이나 유탄 발사기도 장착할 수 있습니다. 대부분의 AK 소총과의 차이점은 AK-103이 플라스틱 및 저렴한 재료를 사용한다는 점입니다."
 BSH_infantry_weapons_6: "AK-12"
 BSH_infantry_weapons_6_desc: "AK-12는 러시아의 신형 돌격소총입니다. 라트니크 미래 보병 훈련 프로그램의 일환으로 개발되었으며, 특수부대용으로 제작되어 AK-103의 생산을 대체할 예정입니다. AK-12는 균형감각과 인체공학적 설계가 개선되어 현재까지 러시아에서 가장 정예화된 돌격소총으로 평가받고 있습니다."
 BSH_infantry_weapons_7: "AK-12M1"
 BSH_infantry_weapons_8: "AK-31"
 CRM_infantry_weapons_2: "AK-74"
 CRM_infantry_weapons_2_desc: "The AK-74 is developed from the AKM, and features significant upgrades over its predecessor. Notably, it uses 5.45mm cartridges instead of the then standard Warsaw Pact 7.62mm."
 CRM_infantry_weapons_3: "AK-74N"
 CRM_infantry_weapons_3_desc: "AK-74N은 내부 구조가 AK-74와 유사하지만, 광학 장비 장착을 위한 도브테일 마운트가 장착되어 있습니다."
 CRM_infantry_weapons_4: "AK-74M"
 CRM_infantry_weapons_4_desc: "In 1991 the Izhmash factory in the city of Izhevsk began full-scale production of a modernized variant of the AK-74, the AK-74M. Fitted with a lightened bolt and carrier assembly as well as a glass-filled polyamide stock."
 CRM_infantry_weapons_5: "AK-103"
 CRM_infantry_weapons_5_desc: "AK-103 돌격소총은 7.62x39mm M43 탄약을 사용하는 AK-74M의 파생형입니다. 구형 AKM과 마찬가지로 AK-103은 야간 투시경과 망원 조준경을 포함한 다양한 조준기를 사용할 수 있으며, 총검이나 유탄 발사기도 장착할 수 있습니다. 대부분의 AK 소총과의 차이점은 AK-103이 플라스틱 및 저렴한 재료를 사용한다는 점입니다."
 CRM_infantry_weapons_6: "AK-12"
 CRM_infantry_weapons_6_desc: "AK-12는 러시아의 신형 돌격소총입니다. 라트니크 미래 보병 훈련 프로그램의 일환으로 개발되었으며, 특수부대용으로 제작되어 AK-103의 생산을 대체할 예정입니다. AK-12는 균형감각과 인체공학적 설계가 개선되어 현재까지 러시아에서 가장 정예화된 돌격소총으로 평가받고 있습니다."
 CRM_infantry_weapons_7: "AK-12M1"
 CRM_infantry_weapons_8: "AK-31"
 CRM_util_vehicle_8: "VMCTS 드로즈드-B"
 CRM_util_vehicle_8_desc: "Army-2020 박람회에서 성공적으로 공개된 후, 수륙양용 차량 드로즈드의 시제기는 시험에 들어갔으나 이 차량의 방호력이 낮다는 점이 드러났습니다. 그 결과 드로즈드-B 개량형이 등장했습니다. 이 최신 장갑차는 하천 장애물과 험지를 극복할 수 있으며 열 신호도 낮습니다. 복합 장갑으로 만든 하부 바닥의 합리적인 V자 형상은 향상된 대지뢰 방호력을 제공합니다."
