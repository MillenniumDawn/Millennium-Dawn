l_korean:
 STALKER.30.t: "구역을 둘러싼 전투"
 STALKER.30.d: "새로운 방출 폭풍이 [STALKER_zone_name] 중심부로 가는 길을 열어젖혔고, 모든 세력이 중심을 향해 앞다투어 달려가고 있습니다. 와드, 스파크, 되살아난 모놀리스, 그리고 다른 이들이 스키프라 부르는 외톨이 스토커입니다. 이들이 싸우는 동안 우리 경계선은 무너지고 있습니다."
 STALKER.30.a: "군대를 투입한다."
 STALKER.30.a_tt: "§R50§! 정치력이 들며, 군 영향력이 §Y40§! 이상이면 §R25§!이 든다. 구역 §Y봉쇄도§!가 §G20§! 오르고 §Y스토커§! 인구가 최대 §Y10§! 줄어든다. 군이 여덟 번째 포드를 봉인하고, 활동도와 스토커 인구를 회복시키며, 전 세계로의 확산을 막는다."
 STALKER.30.b: "와드를 지지한다."
 STALKER.30.b_tt: "구역 §Y봉쇄도§!와 §Y개발도§!가 각각 §G10§! 오르고, §Y프리덤§! 영향력이 최대 §Y10§! 줄어든다. 와드의 방식이 우세하면 스키프의 여덟 번째 포드 선택은 처음부터 더 봉쇄되고 덜 활동적인 전 세계 구역들로 이어진다. §Y와드§!는 영향력 §G15§!를 얻는다."
 STALKER.30.c: "스토커들이 알아서 결판 짓게 둔다."
 STALKER.30.c_tt: "§Y스토커§! 인구가 §Y10§! 늘고 §Y밴디트§! 영향력이 §R10§! 오른다. 경계선이 무너지고 스키프가 여덟 번째 포드에 들어가면 전 세계 구역들은 더 활동적이고 덜 봉쇄된 채 시작한다. §Y스파크§!는 영향력 §Y10§!을 얻는다."
 STALKER.30.a_tt_contained: "§R50§! 정치력이 들며, 군 영향력이 §Y40§! 이상이면 §R25§!이 든다. 구역 §Y봉쇄도§!가 §G20§! 오르고 §Y스토커§! 인구가 최대 §Y10§! 줄어든다. 군의 봉인으로 여덟 번째 포드가 닫혀 구역이 우크라이나 안에 머문다."
 STALKER.30.e: "스트렐록를 지지한다."
 STALKER.30.e_tt: "스트렐록가 2012년에 C-의식을 정지시키고 살아남았기에 선택할 수 있다. 그가 스키프의 여덟 번째 포드 진입을 막는다. 원래 구역의 활동도는 붕괴하고, 해외에는 새 구역이 생기지 않는다."
 STALKER.30.b_tt_contained: "구역 §Y봉쇄도§!와 §Y개발도§!가 각각 §G10§! 오르고, §Y프리덤§! 영향력이 최대 §Y10§! 줄어든다. 전 세계 구역이 비활성화된 상태에서 와드의 방식이 우세하면 스키프의 선택은 위기를 우크라이나 안에 가둔다. §Y와드§!는 영향력 §G15§!를 얻는다."
 STALKER.30.c_tt_contained: "§Y스토커§! 인구가 §Y10§! 늘고 §Y밴디트§! 영향력이 §R10§! 오른다. 전 세계 구역이 비활성화된 상태에서 경계선이 무너지고 스키프가 여덟 번째 포드에 들어가면 해외에는 새 구역이 생기지 않는다. §Y스파크§!는 영향력 §Y10§!을 얻는다."
 STALKER.31.t: "스키프의 여덟 번째 포드 진입"
 STALKER.31.d: "구역의 심장부에서 스키프라는 스토커가 스트렐록에게 맞서고, 닥터라 불리는 카이마노프 박사를 살려 둔 채 C-의식의 여덟 번째 포드에 들어갔습니다. 그는 구역에 의지를 부여했습니다. 한 시간 안에 전 세계 과학자들이 같은 수치를 보고합니다. 구역은 더 이상 체르노빌에 묶여 있지 않습니다."
 STALKER.31.a: "이제 어떻게 되는 거지?"
 STALKER.32.t: "전 세계에서 이상 현상 보고"
 STALKER.32.d: "모든 대륙의 정부가 이상 활동을 보고하고 있습니다. 원을 그리며 죽은 새들, 빙빙 도는 나침반, 무선 연락이 끊긴 마을들이 있습니다. 유엔 안전보장이사회가 긴급 회의를 소집했지만, 어느 대표단도 아직 무엇을 요구해야 할지 모릅니다."
 STALKER.32.d_ward: "모든 대륙의 정부가 이상 활동을 보고하고 있습니다. 와드는 각국 과학자들이 대응을 조율하는 동안 새로 생긴 구역의 관리 당국에 봉쇄와 출입에 관해 조언하고 있습니다."
 STALKER.32.d_stalkers: "모든 대륙의 정부가 이상 활동을 보고하고 있습니다. 공동의 봉쇄 계획이 없어 스토커 조직과 지방 당국이 임기응변으로 버티고 있고, 밀수꾼들은 새 지역으로 몰려들고 있습니다."
 STALKER.32.a: "이제 구역은 어디에나 있다."
 STALKER.33.t: "여덟 번째 포드 이후"
 STALKER.33.d: "스키프가 구역의 심장부에서 무슨 짓을 했든, [STALKER_zone_name]은(는) 그 어느 때보다 폭력적입니다. 장성들은 새 경계선을 원하고, 과학자들은 구역 안에서 얻는 지식이 세계에 필요할 것이라고 말합니다."
 STALKER.33.a: "경계선을 재건한다."
 STALKER.33.a_tt: "§R50§! 정치력이 든다. 구역 §Y봉쇄도§!가 §G20§! 오른다."
 STALKER.33.b: "구역을 세계의 과학자들에게 개방한다."
 STALKER.33.b_tt: "구역 §Y개발도§!가 §G15§! 올라 우리의 구역 연구가 늘어난다."
 STALKER.31.d_contained: "구역의 심장부에서 스키프라는 스토커가 스트렐록에게 맞서고, 닥터라 불리는 카이마노프 박사를 살려 둔 채 C-의식의 여덟 번째 포드에 들어갔습니다. 구역은 우크라이나 북부 전역으로 날뛰었지만, 해외의 계측기에는 이상이 전혀 잡히지 않습니다."
 STALKER.33.d_known: "엑스 프로젝트 문서에는 여덟 번째 포드와 정신권 사이의 연결이 기술되어 있었습니다. 스키프는 카이마노프 박사를 살려 두고 포드에 들어갔으며, [STALKER_zone_name] 주변의 계측기는 이제 우리 조사관들이 우려하던 양상을 보여 줍니다. 남아 있는 문서가 이곳의 피해를 줄이는 데 도움이 될지도 모릅니다."
 STALKER.33.c: "엑스 프로젝트 봉쇄 문서를 적용한다."
 STALKER.33.c_tt: "구역 봉쇄도가 최대 §G15§!, 개발도가 최대 §G10§! 오르고 활동도가 최대 §G10§! 내려간다. X-연구소 조사를 완료했기에 선택할 수 있다."
 STALKER.36.t: "여덟 번째 포드 봉인"
 STALKER.36.d: "군이 여덟 번째 포드로 가는 길을 막았고, 구역 주변의 봉쇄가 안정되고 있습니다. 우크라이나의 계측기는 여전히 이상 활동을 기록하지만, 해외 관측소는 새 구역이 없다고 보고합니다."
 STALKER.36.a: "경계선은 버티고 있다."
 STALKER.39.t: "스트렐록가 끝낸 구역"
 STALKER.39.d: "스트렐록가 스키프보다 먼저 여덟 번째 포드에 도달해 이를 파괴했습니다. 원래의 구역은 여전히 남아 있지만 활동도는 붕괴했고, 해외 관측소는 새 구역이 없다고 보고합니다."
 STALKER.39.a: "군대가 못 한 일을 그가 해냈다."
 STALKER.38.t: "구역 1주년"
 STALKER.38.d_military: "구역을 봉인한 지 1년이 지난 지금도 [STALKER_zone_name] 주변의 방벽은 버티고 있습니다. 이상 지대를 군 통제하에 계속 둘 수도 있고, 경계선 안에서 허가받은 연구를 허용할 수도 있습니다."
 STALKER.38.d_ward: "2022년 와드의 개입으로 구역의 영향력이 우크라이나 밖까지 뻗었고, 와드의 연구 컨소시엄은 이제 장기적인 권한을 원합니다. 이 연구를 공통 봉쇄 규칙에 묶을지, 구역 출입을 넓힐지 선택해야 합니다."
 STALKER.38.d_ward_contained: "체르노빌 구역은 여전히 알려진 유일한 이상 지대이며, 사병 조직이 와드인 SIRCAA는 장기적인 연구 권한을 원합니다. 이 연구를 봉쇄 규칙에 묶을지, 구역 출입을 넓힐지 선택해야 합니다."
 STALKER.38.d_stalkers: "2022년 전투 이후 각국 정부는 새 구역들을 봉쇄하느라 애를 먹었고, 스토커와 지역 세력은 그곳에서 살아남는 법을 익혔습니다. 이들과 협상할 수도, 다음 방출 전에 비상 권한을 복원할 수도 있습니다."
 STALKER.38.d_stalkers_contained: "체르노빌 구역은 여전히 알려진 유일한 이상 지대이지만, 약해진 경계선 탓에 지역 스토커들에게 길이 열렸습니다. 이들과 협상할 수도, 다음 방출 전에 비상 권한을 복원할 수도 있습니다."
 STALKER.38.d_default: "구역을 둘러싼 전투가 끝난 지 1년이 지났지만, 원래의 구역은 여전히 불안정합니다. 국가가 어느 정도의 권한을 유지할지, 연구를 어디까지 허용할지 정해야 합니다."
 STALKER.38.a: "군 방벽을 유지한다."
 STALKER.38.a_tt: "봉쇄도가 최대 §G10§!, 듀티 영향력이 최대 §G5§! 오른다. 활동도와 밴디트 영향력은 각각 최대 §G10§! 내려간다."
 STALKER.38.b: "감독하의 연구를 허가한다."
 STALKER.38.b_tt: "개발도가 최대 §G10§!, 스토커 인구가 최대 §G5§!, 프리덤 영향력이 최대 §G5§! 오르고, 듀티 영향력은 최대 §G5§! 내려간다."
 STALKER.38.c: "와드의 봉쇄 지침을 채택한다."
 STALKER.38.c_tt: "듀티 영향력과 봉쇄도가 각각 최대 §G10§! 오른다. 밴디트 영향력은 최대 §G10§!, 개발도는 최대 §G5§! 내려간다."
 STALKER.38.d: "국제 연구 권한을 확대한다."
 STALKER.38.d_tt: "개발도가 최대 §G10§!, 스토커 인구가 최대 §G5§!, 프리덤 영향력이 최대 §G5§!, 활동도가 최대 §R5§! 오르고 봉쇄도는 최대 §R5§! 내려간다."
 STALKER.38.e: "스토커 집단과 직접 협상한다."
 STALKER.38.e_tt: "프리덤 영향력, 스토커 인구, 개발도가 각각 최대 §G10§! 오르고, 봉쇄도는 최대 §R10§! 내려간다."
 STALKER.38.f: "비상 권한을 복원한다."
 STALKER.38.f_tt: "듀티 영향력이 최대 §G10§!, 봉쇄도가 최대 §G15§! 오른다. 활동도는 최대 §G10§!, 스토커 인구는 최대 §G5§! 내려간다."
 STALKER.38.g: "현재의 균형을 지킨다."
 STALKER.38.g_tt: "봉쇄도가 최대 §G5§! 오르고 활동도가 최대 §G5§! 내려간다."
 STALKER.38.d_strelok: "스트렐록가 여덟 번째 포드를 파괴한 지 1년, [STALKER_zone_name]은(는) 폭풍이 아니라 흉터가 되었습니다. 그래도 남은 것은 여전히 지켜내야 합니다."
 STALKER.38.h: "남은 것을 지킨다."
 STALKER.38.h_tt: "봉쇄도가 최대 §G10§! 오르고 활동도가 최대 §G5§! 내려간다."