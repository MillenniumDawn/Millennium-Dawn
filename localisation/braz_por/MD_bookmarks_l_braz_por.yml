l_braz_por:
 MODERN_DAY_NAME: "O mundo hoje (DESATUALIZADO)"
 MODERN_DAY_DESC: "Nunca a fome foi tão baixa. Nunca os rendimentos foram tão altos. No entanto, o mundo é marcado pelo medo diante da rápida mudança social e tecnológica. A reação à globalização é sentida quando o Oriente Médio entra em colapso em uma guerra híbrida e uma onda de o populismo nacionalista avança sobre o Ocidente. A gravidade do mundo está se deslocando para a Ásia, mas as potências emergentes do mundo ainda precisam encontrar uma alternativa atraente para a ordem mundial ocidental prevalecente."
 USA_MODERN_DAY_DESC: "The United States, the world's sole superpower, faces a gradual decline in international power. Bogged down in Middle Eastern wars, government debt and the economic rise of China and other BRICS nations, American hegemony is not what it once was. However, due to its unique geographic position offering it total safety with no natural enemies, it can remain engaged overseas in force to defend both the US and its allies' vital interests. At home, a wave of nationalist sentiment against both elitism and globalization has left it with its most unlikely president ever - Donald Trump.\nWith European and Asian allies fearing both American unilateralism and a withdrawal from Western liberal institutions, can the US strike a balance that will make the Western world order prevail?"
 ENG_MODERN_DAY_DESC: "The United Kingdom sits in a position that no country has ever been in before. The 2016 Brexit referendum passed with a nearly fifty-two percent majority and it has become the first and only country to invoke Article 50 of the European Union. It will stand in the history books as either the greatest decision for the British people or the worst possible choice.\nDeal or no deal is the greatest question."
 FRA_MODERN_DAY_DESC: "Um centro global de arte, cultura e diplomacia, a França olha brilhantemente para um novo século repleto de esperança e oportunidade. A tirania das antigas monarquias e a destruição das guerras mundiais empurraram a França para a União Europeia, da qual é um membro fundador. \n\nSó o tempo dirá como os franceses enfrentarão o próximo século."
 GER_MODERN_DAY_DESC: "Através de austeridade e reformas, a economia alemã permaneceu ilesa dos choques duplos da crise financeira de 2008 e da crise da dívida europeia. Como de longe a economia europeia mais forte, caiu sobre a outrora cautelosa e relutante Alemanha para liderar a Europa União avança diante do Brexit e crescentes apelos por soberania nacional. Para a Alemanha, a existência da zona do euro e da União Europeia não é uma escolha, mas uma necessidade. A integração europeia produziu um mercado combinado grande o suficiente para seus produtos, como o forte O setor industrial alemão há muito superou suas demandas internas. Além disso, com uma tendência demográfica descendente, a Alemanha deve contar com o aumento da imigração para preencher o vácuo - uma escolha que certamente será controversa com o nacionalismo em ascensão."
 JAP_MODERN_DAY_DESC: "Japan is one of the world's largest economies. It continues to outproduce many countries in Europe, and it also maintains one of the world's most unique cultures. However, this large economy is plagued by incredible amounts of debt. The government debt of Japan is trending to around two hundred and forty-nine percent of its GDP. Furthermore, it is also one of few countries that is affected by an inverted population pyramid where the majority of its population is well over their forties.\nWill Japan collapse under its financial debt and population crisis or will it stand the test of time and become one of the strongest countries in the world?"
 SOV_MODERN_DAY_DESC: "The fall of the Soviet Union reversed 300 years of Russian expansionism and left the new federation with its 17th Century borders. The expansion of NATO into Eastern Europe and post-Soviet states has left it vulnerable, as its heartland lies on the European plain - which is indefensible. Thus, gaining indirect control over post-Soviet states such as Ukraine, Georgia and the Baltics via initiatives such as the Eurasian Union is paramount if Russia is to ever again amount to anything more than a regional power with a decent military. Economically, she must overcome the dual shocks of low oil prices and western sanctions, and somehow tackle the rampant corruption in Russia's highly centralized bureaucracy."
 CHI_MODERN_DAY_DESC: "China's geography - surrounded by mountains and jungles - protects it, but also isolates it from the rest of the world. As a multi-ethnic empire with large minorities, just maintaining its territorial integrity takes considerable effort, as it needs to provide massive investments in its hinterlands and disputed territories in order to maintain control. Perhaps its largest vulnerability, however, is its dependence on exports and trade on the open ocean - which is controlled by the United States and its Asian-Pacific allies. For China to become a true superpower, it needs to compete with the US Navy in size and quality and to turn current Asian rivals into allies. China's diplomacy is hampered by its lack of an attractive political model. However, it is boosted by its massive foreign reserves and its willingness to use them to invest abroad."
 BRA_MODERN_DAY_DESC: "Brazil is slowly on the rise at the turn of the century. The country has the potential for greatness. It is one of the world's largest emerging economies and its growth has continued to accelerate. However, in recent years Brazil's economic current is reeling back from a harsh recession due to the Asian Financial Crisis of 1997 and a crippled currency. Now a new party contender has arrived on the scene. The PT has swapped in and is quickly gaining traction.\n\nWill you be able to kickstart the country's once great economy or will the PT and its socialist policies seize hold?"
 UKR_MODERN_DAY_DESC: "O ano de 2014 tornou a Ucrânia o epicentro de eventos que poderiam, a qualquer momento, levar a consequências irreversíveis. A Revolução da Dignidade derrubou o poder autoritário de Viktor Yanukovych e instaurou um novo governo pró-Ocidente liderado por Petro Poroshenko. Apesar das inúmeras promessas de campanha, o recém-eleito garantidor do governo levou o país a uma armadilha da dívida ainda maior e se aproveitou da situação. A paciência do povo está se esgotando. A península da Crimeia foi anexada por nossos antigos aliados, e as regiões orientais de Donbas estão sendo devastadas pelas chamas da guerra. Restam apenas alguns anos para as novas eleições, mas será que o povo resistirá até o fim do mandato presidencial?"
 TUR_MODERN_DAY_DESC: "Recent years haven't been forgiving. Although PKK threat has been nearly eliminated, we couldn't come up with a solution to end it fully. It has been mere months since the coup attempt has been repelled and although some people are even starting to forget it, some perpetrators are still at large, few of them still inside our country, some have been hiding abroad or being sheltered by our enemies, including, the head of the snake, Fethullah Gülen. And all the while some circles have been circulating rumors that Erdogan himself orchestrated the coup and made it fail on purpose to get rid of opposition and seize more power. Nonetheless, a portion of people that got purged have turned out to be innocent and these mistaken convictions are proven."
 ISR_MODERN_DAY_DESC: "Once the land from which Isaiah prophesized of the day mankind would 'Beat their swords into plowshares, and spears into pruning hooks', the Land of Israel has seen too much blood shed upon it ever since the Jewish People reestablished independence for the first time in two thousand years. The optimism of the 1990s Oslo Accords process has died with the Assassination of Prime Minister Rabin in November 1995, and despite Prime Minister Barak's optimism - a Second Intifada is inevitable. But what Israel would rise from it - A shell of its former self or a rising regional power, capable of negotiating on its own terms? And how will it address the delicate balance between Jewish and Democratic aspects of its existence that has so thoroughly been avoided until now?"
 SYR_MODERN_DAY_DESC: "With divided loyalties in the Syrian Armed Forces and staggering losses from 6 years of fighting a brutal civil war, the regular Army is a spent force. Its place on the Syrian battlefield has been taken by a wide array of militias, private military companies, Hezbollah and the Iranian Revolutionary Guard, who together have begun to reverse Assad's losses. However, with its economy destroyed, and most of Syria's territory under the control of terrorists, rebels and Kurds, the prospect of a united Syria looks certain to be a long struggle ahead."
 PER_MILLENNIUM_DAWN_DESC: "Após a Revolução Islâmica de 1979, o Irã passou de uma monarquia pró-ocidental para uma teocracia xiita antiocidental. De leste a oeste, o Irã tem sido pressionado por forças externas, sem ninguém em quem confiar além de si mesmo. Com hostilidade presente em todos os cantos, o Irã se consolidou como o centro da influência xiita no mundo muçulmano, com um forte controle sobre organizações extremistas como o Hezbollah, que dependem fortemente do apoio financeiro iraniano para sua sobrevivência. Com a crescente resistência dos movimentos reformistas e estudantis, o futuro do regime de Khamenei é incerto. Em última análise, para que o Irã sobreviva, terá que cooperar na frente global ao lado de seus vizinhos ou esmagar todos os seus oponentes. Não há meio-termo."
 PER_MODERN_DAY_DESC: "Depois de continuar o projecto AMAD no meio de retaliações globais, o Irão enfrentou duras sanções económicas que debilitaram, mas não pararam, a sua marcha para a aquisição de armas nucleares. Durante este período de dificuldades, o Irão também começou a flexibilizar o seu poder no Médio Oriente com o uso da sua Força Quds. Começando agora a recuperar, o Irão posicionou-se como uma nação disposta a enfrentar a ordem global e os Estados Unidos. Para onde irá a partir daqui?"
 FSA_MODERN_DAY_DESC: "Initially the Free Syrian Army was an umbrella organization of anti-Assad rebel groups and a true government in parallel. However, radicalization of Syrian militants led to mass defections to both Al-Qaeda ally Al-Nusra and ISIS, contributing to the eradication of the FSA in the north of Syria. As a result, the Free Syrian Army was dismantled as an organization. However, a wide array of Muslim Brotherhood linked rebel groups together with smatterings of Salafists and secular groups still retain the label. In the South of Syria, FSA-affiliated groups have been successful in desert warfare against ISIS, and still defend most of Dara'a from Assad's forces. In the north, the Turkish Army intervention has been successful in creating a wedge between the two Kurdish cantons."
 NUS_MODERN_DAY_DESC: "Em janeiro de 2017, várias facções Mujahideen se uniram sob o apelo de uma Jihad unificada contra o tirano Al-Assad. Conhecida como Hayat Tahrir al-Sham, ou Comitê de Libertação do Levante, esta formidável organização foi formada no derramamento de sangue do Sírio guerra civil. O grupo é classificado pelos EUA como uma organização terrorista e uma organização afiliada à Al-Qaeda."
 ROJ_MODERN_DAY_DESC: "As the Syrian Civil War began, Assad's forces withdrew from the Kurdish areas to defend its heartland. This allowed the long repressed Kurdish people, through the left-wing Democratic Union Party and its militia, the YPG, to take control and establish Rojava, based on democratic socialism and gender equality. As ISIS entered the Syrian battlefield, they targeted the Kurds with force, taking over large swaths of Rojava, culminating in the failed assault on Kobane. With reinforcements from the Peshmerga, the Turkish PKK and US air support, the Kurds were able to turn the tide and send ISIS on the run. Since then, it has incorporated parts of the old FSA under the banner of the \"SDF\". However, its future challenges remain numerous, with Turkey repeatedly threatening war and fears looming that the tacit alliance with Assad might break down into conflict."
 OTHER_MODERN_DAY_DESC: "As nações do mundo, grandes e pequenas, não estão satisfeitas em prender a respiração esperando a eclosão de outro conflito global. Das grandes potências à beira da guerra civil às muitas nações formadas e transformadas pela Grande Guerra, todos terão que tomar decisões difíceis e equilibrar ideais com pragmatismo para impactar o futuro do mundo."
 DEN_MODERN_DAY_DESC: "A Dinamarca é uma nação segura e protegida, sendo membro da UE e da OTAN. No entanto, uma crise econômica interna e desaceleração começaram recentemente a desafiar o estado dinamarquês. Se a Dinamarca pode continuar imune à turbulência do mercado mais amplo mundo está longe de ser certo."
 ETH_MODERN_DAY_DESC: "A monarquia da Etiópia foi derrubada em 1974 e sua subseqüente ditadura comunista em 1991. A constituição de 1995 proporcionou uma democracia um tanto estável, mas falhou em resolver os problemas de fome, crise política e corrupção."
 FIN_MODERN_DAY_DESC: "Sempre preocupada em preservar sua neutralidade, a Finlândia acompanhou atentamente o colapso da União Soviética e a subsequente expansão política do projeto integracionista da Europa Ocidental. Os finlandeses aderiram à UE em 1995 e também adotaram o Euro como moeda nacional. Can peace último? Os russos estão realmente pacificados?"
 ITA_MODERN_DAY_DESC: "A Itália tem estado ligeiramente atrás das outras grandes potências desde o início do século XX. Após a derrota na Segunda Guerra Mundial, os fortes laços da Itália com seus antigos inimigos e com a Alemanha, sua antiga aliada, a elevaram de volta ao status de um país altamente desenvolvido e próspero. Mas o que o futuro reserva? Grandeza nacional ou desastre econômico?"
 GRE_MODERN_DAY_DESC: "A Grécia está em crise após a recessão de 2008, que enfraqueceu ainda mais sua já frágil economia. relações azedas, o que significa que qualquer incidente menor poderia levar os dois países à guerra.\n\nA Grécia se encontra à beira do colapso, com até mesmo a menor decisão potencialmente fazendo ou quebrando o país. Esperemos que você faça as escolhas certas ."
 SWE_MODERN_DAY_DESC: "A Suécia estava em uma profunda crise econômica no início dos anos 1990, com a adesão do país à UE em 1995 fazendo pouco para aliviar seus problemas. A nação sueca, que permanece militarmente neutra como é tradição sueca, tem que encontrar respostas econômicas para suas problemas atuais"
 POL_MODERN_DAY_DESC: "A Polônia cresceu enormemente desde sua chegada à União Européia em 2004. Agora é uma potência regional e uma das economias de mais rápido crescimento na Europa. Está a caminho de se tornar uma das potências mais importantes da Europa. A atual A situação política é interessante, pois o PiS chegou ao poder e as relações com a UE esquentaram. Um país firmemente anti-russo, a Polônia fez um grande esforço para fortalecer suas relações com os Estados Unidos."
 SWI_MODERN_DAY_DESC: "Neutra desde tempos imemoriais, a Suíça decidiu ficar fora da OTAN e da União Europeia. A comunidade internacional ainda pode confiar na Suíça para ser o juiz silencioso e o terreno neutro que sempre foi? Ou o povo suíço verá seu governo assume um papel mais ativo no exterior para preservar a paz e fazer valer os interesses nacionais suíços?"
 BRM_MODERN_DAY_DESC: "Aung San Suu Kyi, once the darling of the international community, has seen a dramatic reversal of fortunes in terms of international public opinion. No longer the charismatic and eloquent human rights campaigner, the Rohingya Crisis has transformed Myanmar's de facto leader into a vilified war criminal in the eyes of many. Within the country's territorial boundaries, rebel groups and still powerful military generals watch for signs of weakness. These twin dilemmas, international and domestic, present the government of Myanmar with important choices. Permit or halt the violence against the Muslims of Rakhine. Attempt to restore relations with the West, or fall back on the military junta's old ally, China. The answer is far from clear."
 NIG_MODERN_DAY_DESC: "Nigeria's last ten years have shown the true colors of the Islamic State as it supports the major uprising of Boko Haram and the Salafist rebels in the North East of Nigeria. The military of Nigeria proved incredibly ineffective at fighting in the new kind of guerilla warfare. It has slowly grown into a major regional conflict as the Nigerian government is slowly losing more and more control over the state of Borno.\n Will you end the insurgency or join the global jihad?"
 BHR_MODERN_DAY_DESC: "Bahrein é uma nação que não escapou da onda de protestos que se espalhou por todo o Oriente Médio como parte da chamada \"Primavera Árabe\". O Dia da Fúria viu a maioria xiita expressar sua frustração contra um monarquia que é percebida não apenas como discriminatória em relação aos xiitas, mas também como um ocupante estrangeiro e um opressor do verdadeiro povo indígena do Bahrein. Sem a intervenção do Peninsula Shield, a monarquia pode ter entrado em colapso em 2011.\n\nA A prioridade da dinastia Khalifa é, portanto, a preservação de seu domínio diante da hostilidade xiita. Embora historicamente a oposição sunita representasse uma ameaça maior, o espectro da influência iraniana e a liberalização política limitada significam que essa ameaça foi subjugada, pelo menos por enquanto ."
 KUW_MODERN_DAY_DESC: "O Kuwait desfruta de uma posição relativamente confortável internacionalmente. A maior ameaça à sua soberania, o Iraque de Saddam Hussein, foi eliminado pela invasão americana de 2003, e o Kuwait conseguiu manter boas relações com todos os atores regionais do Oriente Médio.\n \nO maior desafio do Kuwait, embora não seja urgente, é de natureza interna. O sistema de governo semi-democrático do país reforçou a legitimidade do governo, mas impediu as reformas necessárias para diversificar a economia dependente do petróleo do Kuwait. Além disso, as reformas do Kuwait não foram completamente acalmou a oposição, que continua a se opor à censura do governo e à repressão ocasional de ativistas políticos."
 OMA_MODERN_DAY_DESC: "Omã conquistou a reputação de farol de paz e estabilidade em uma região inquieta e propensa a conflitos. Qaboos bin Said al Said tem seguido uma política externa bem-sucedida desde que assumiu o poder em 1970, liderando um país que ninguém odeia e admirado por todos. Mas Omã tem seus desafios. O sultão foi criticado por sua abordagem dura em relação à dissidência interna, aumentando a incerteza sobre a sustentabilidade da monarquia absoluta. Além disso, a guerra no Iêmen abriu uma nova ameaça Omã tem considerado historicamente a província iemenita de al-Mahra como parte de sua esfera de influência, dados os estreitos laços culturais da região com Dhofar em Omã. Mas a presença de tropas sauditas ameaça a fronteira de Omã e não será tolerada pelo estado de Omã, mesmo se isso significa minar secretamente o esforço de guerra saudita."
 QAT_MODERN_DAY_DESC: "Since 1996 Qatar has charted an independent course within the Gulf Cooperation Council. The country's natural gas reserves have allowed Qatar to operate outside of the Saudi-dominated oil market, and for decades the emirs of Qatar have enjoyed a close relationship to the populist Muslim Brotherhood, an organization that the Saudis and Emiratis have increasingly come to see as a threat to their authority. As the home of Al-Jazeera, Qatar is partially blamed by the other Arab autocracies for the spread of the Arab uprisings collectively known as the Arab Spring. Worst of all in the eyes of the Saudis and their Emirati allies is Qatar's close relationship with Iran, a state that they view as an existential threat. It is only a matter of time before the hostility of Qatar's neighbors to its unique foreign policy reaches boiling point."
 SAU_MODERN_DAY_DESC: "Os sauditas observaram como o Oriente Médio foi irrevogavelmente transformado por uma série de eventos importantes. Primeiro, os eventos de 2003 eliminaram um jogador importante na luta pelo poder entre Arábia Saudita, Iraque e Irã e inflamaram as tensões sectárias entre sunitas e xiitas. como resultado da subsequente guerra civil. Em seguida, os sauditas observaram com horror como regimes amigos em todo o mundo árabe foram derrubados pelo fenômeno conhecido como Primavera Árabe. E, finalmente, os sauditas observaram ansiosamente a retirada gradual da América da região e sua reaproximação com o Irã sob Obama. Tudo isso convenceu os sauditas da necessidade de uma política externa mais proativa, que levou a monarquia a combater agressivamente a influência iraniana no Oriente Médio. Do Líbano ao Iêmen, da Síria ao Iraque, as linhas de batalha são sendo desenhado."
 SIN_MODERN_DAY_DESC: "O setor financeiro em Cingapura explodiu nos últimos anos. O país absorveu lentamente os holofotes do Sudeste Asiático como modelo para outras nações da região. Sua legislatura pró-negócios permitiu que ela mantivesse um crescimento incrível e se tornasse uma das nações mais ricas do planeta por PIB/C. A Cidade do Leão continua a explodir e se expandir, mas a China tornou esta cidade pequena e continua sendo uma ameaça sempre presente no horizonte."
 PHI_MODERN_DAY_DESC: "Economicamente falando, as Filipinas foram apelidadas de uma das nações recém-industrializadas, pois continuam a manter taxas de crescimento de pelo menos 5%. Sendo uma das Tiger Cub Economies, conseguiu manter uma presença na lista de importantes mercados emergentes. Recentemente, com a eleição de 2016, Rodrigo Duterte assumiu o poder e com muitas promessas de continuar uma guerra agressiva contra os cartéis e uma postura mais branda contra a Frente Moro de Libertação Islâmica afirmando que os Moros foram tratados injustamente e buscam expandir sua representação.\n"
 UAE_MODERN_DAY_DESC: "Carinhosamente apelidado pelas autoridades americanas de \"Pequena Esparta\", os Emirados Árabes Unidos têm sido um aliado próximo dos Estados Unidos e da Arábia Saudita e um participante ávido em operações militares multilaterais. força aérea e sua Guarda Presidencial de elite, serviu no Afeganistão, Líbia, Kosovo, Somália e agora no Iêmen. Mas os Emirados Árabes Unidos não se contentam em simplesmente jogar o segundo violino para os EUA ou a Arábia Saudita. de influência estrangeira, às vezes competindo com seus antigos aliados, por exemplo, jogando seu peso atrás de separatistas no Iêmen temporariamente aliados ao governo de Hadi apoiado pela Arábia Saudita. Além disso, os Emirados Árabes Unidos abrigam o único caso bem-sucedido de diversificação econômica, tendo Dubai reputação como uma cidade global e um centro financeiro."
 CAN_MODERN_DAY_DESC: "Tendo conquistado total independência do Reino Unido em 1982, o Canadá é o 4º maior exportador de petróleo do mundo e provou ser um dos países líderes em operações antiterroristas. Com a segunda maior massa terrestre do mundo, o Canadá é composto principalmente de planícies de gelo e montanhas, com a maioria da população residindo no sul do país. Com uma vasta quantidade de recursos à sua disposição, o Canadá é um país com infinitas possibilidades e potencial."
 KOR_MODERN_DAY_DESC: "A Coreia está no meio de um dos escândalos presidenciais mais dramáticos da sua história. Após manifestações massivas, a presidente conservadora Park Geun-hye acaba de sofrer impeachment pela Assembleia Nacional devido à influência obscura do seu conselheiro ao estilo Rasputin, Choi Soon-sil. Com o partido no poder no caos e novas eleições provavelmente a serem convocadas dentro de alguns meses, o cenário parece preparado para o regresso do Partido Democrata, de esquerda, ao poder.\n\nSe o candidato presidencial Moon Jae-in chegar à Casa Azul, terá de restaurar a fé no sistema político coreano, alcançar uma agenda económica ambiciosa e gerir o que provavelmente serão relações tensas entre os EUA e a Coreia do Norte após os EUA. eleição presidencial."
 NKO_MODERN_DAY_DESC: "Muitos subestimaram o jovem e corpulento Kim Jong-un quando chegou a hora de ele assumir a posição de seu pai como Líder Supremo da República Popular Democrática. Desde então, tornou-se claro que esta figura com formação suíça e pouco compreendida era uma força a ter em conta. A sua consolidação brutal do poder incluiu a execução do tio de Kim e de uma série de outros funcionários, incluindo, a acreditar nos relatórios, uma execução por canhão antiaéreo. Mas a posição do jovem Kim não é totalmente segura. A dissidência dentro das fileiras do establishment permanece e a sua ambiciosa agenda de reformas económicas ainda está a ganhar força. Será que a última iteração da Dinastia Kim do Norte sustentará o estado como o seu pai e o seu avô fizeram? Ou ele testemunhará o colapso do seu reino?"
 BOT_MODERN_DAY_DESC: "Botswana is one of the most highly developed countries in Africa with a stable democracy, high human development index and low corruption. Botswana gained its wealth after large amounts of diamonds were found, which led to one of the highest GDP per capita in Africa. However, it is not without its problems; the politics are dominated by the BDP party, whom many see as autocratic and exclusive. In addition, poaching is rampant in the country's many game reserves. Diamonds are also not going to last forever, and a solution needs to be found to find alternatives for the economy."
 AFG_MODERN_DAY_DESC: "With the help of coalition forces, the Northern Alliance successfully toppled the Taliban regime. Instead of being annihilated, the Taliban have since fragmented and begun waging an insurgency in various parts of Afghanistan, they still pose a significant threat to coalition and government forces. While some actions of the coalition forces are reasons for the Taliban's growth, the inefficiency and corruption of the central government and Afghanistan's unique pre-modern tribal culture are the main reasons why the Taliban are difficult to annihilate, not to mention the fact that Taliban militants can hide and regroup in parts of Pakistan and return to the fight in Afghanistan. Will government forces end the Taliban insurgency? Or will there be a peace deal to convince the Taliban to peacefully lay down their arms and join the government?"
 LIC_MODERN_DAY_DESC: "Liechtenstein is a small and unassuming but well developed nation in the heart of Europe. With a population of only about thirty-eight thousand and one of the only two double-landlocked nations in the world, it's safe to say that nobody expects much from Liechtenstein. Heavily dependant on its neighbors in the alps for both its economy and security, Liechtenstein has many difficult choices ahead of it. Should it be a bastion of international cooperation, or a haven for ill-intentioned international corporations? Should it accept refugees from around the world in an attempt to become a real military power, or close its borders and focus only on itself. Only time will tell."
 MILLENNIUM_DAWN: "Millennium Dawn"
 MILLENNIUM_DAWN_DESC: "O mundo mudou. Globalmente falando, uma atmosfera de paz e prosperidade governou por cerca de meio século. Mas com o recente fim da Guerra Fria e a ascensão da República Popular da China, como este mundo se verá ? Como ela se moldará? Os Estados Unidos continuarão seu domínio? A nova Federação Russa encontrará seu caminho para o centro das atenções? Que papéis desempenharão os antigos grandes impérios europeus da Grã-Bretanha, França e Alemanha? E que papel a sombra de terrorismo tem? O mundo mudou. O mundo está mudando."
 CHI_MILLENNIUM_DAWN_DESC: "O remanso de ontem. A superpotência de amanhã. Depois de décadas de intimidação europeia e ainda mais décadas de guerra civil, conflito e invasão japonesa, a China procura se reconstruir como a principal potência da Ásia e, eventualmente, do mundo. \n\nSob a liderança do Partido Comunista, grandes avanços foram feitos na construção de uma nova China. Mas esta nova China é volátil. Se a China se reformar muito lentamente, pode ser destruída. Se se reformar muito rapidamente, pode destruir a si mesmo."
 FRA_MILLENNIUM_DAWN_DESC: "Um centro global de arte, cultura e diplomacia, a França olha para um novo século cheio de esperança e oportunidade. A tirania das antigas monarquias e a destruição das guerras mundiais empurraram a França para a União Europeia, da qual é um membro fundador. \n\nSó o tempo dirá como os franceses enfrentarão o próximo século."
 GER_MILLENNIUM_DAWN_DESC: "A retirada dos soviéticos e a reunificação da Alemanha Oriental e Ocidental trouxeram novas esperanças para a nação. O passado traumático da Alemanha e os horrores do fascismo não foram esquecidos pela população em geral. Hoje, a Alemanha se destaca como uma das nações mais democráticas da Europa, com um sólido sistema de bem-estar social e uma das economias mais fortes do continente.\n\nMembro fundador da União Europeia, a Alemanha pretende expandir o bloco para incluir os antigos estados soviéticos da Europa Oriental contra um possível ressurgimento russo."
 JAP_MILLENNIUM_DAWN_DESC: "Um território com aproximadamente 6.852 ilhas, o povo marítimo do Japão percorreu um longo caminho desde a Segunda Guerra Mundial e os bombardeios atômicos de Hiroshima e Nagasaki. Hoje, o Japão se destaca como a segunda maior economia do mundo, renomado por sua inovação tecnológica e produtos de qualidade exportados para todo o mundo.\n\nApoiados por seus aliados americanos e europeus, o Japão olha cautelosamente para seu antigo rival, a China, com uma nova confiança e um novo potencial para conflito."
 SOV_MILLENNIUM_DAWN_DESC: "O golpe de agosto e o subsequente colapso da União Soviética em 1991 deixaram a economia russa em frangalhos, seu orgulho abalado e seu futuro sombrio. Oligarcas e funcionários corruptos preencheram o vácuo de poder na ausência de uma autoridade central forte.\n\nA recente ascensão de Vladimir Putin tem levado muitos a questionar como esse ex-oficial da KGB tentará restaurar o legado da Rússia e conduzi-la a uma nova era."
 ENG_MILLENNIUM_DAWN_DESC: "With Hong Kong handed over to China in 1997, the United Kingdom has bid farewell to its last great colonial possession. The once mightiest nation on Earth is desperately trying to redefine itself and find a new path to greatness and glory. A two party system divides the political sphere into two, Tory or Labour. With growing disagreements over how the country shall be run from the National Health Service to the policies of the military.\n\nWill that path lie in continued cooperation with the United States? Should Britain draw closer to its European brethren? Or shall Britannia, on her own, rule the waves once more?"
 USA_MILLENNIUM_DAWN_DESC: "O colapso da União Soviética levou ao primeiro momento unipolar do mundo. Os Estados Unidos estão na vanguarda de todas as forças tecnológicas, militares e culturais em atuação no planeta. Seu alcance nunca foi tão grande e seu futuro nunca pareceu tão promissor.\n\nAs próximas eleições serão um momento crucial para determinar o futuro dos Estados Unidos; e, para o bem ou para o mal, do mundo."
 TUR_MILLENNIUM_DAWN_DESC: "Desde o colapso do Império Otomano no final da Primeira Guerra Mundial, a Turquia permaneceu em grande parte à margem dos assuntos geopolíticos. Agora, a posição da Turquia a coloca novamente em destaque, à medida que ideologias concorrentes tentam influenciar os rumos do país.\n\nDeverá a República dar continuidade às reformas de Atatürk e buscar o reconhecimento junto à UE, ou permanecer fiel à sua herança islâmica? A saúde debilitada do primeiro-ministro Bülent Ecevit sinaliza tempos incertos pela frente."
 UKR_MILLENNIUM_DAWN_DESC: "As eleições de 1999 deveriam trazer uma vitória incondicional ao líder liberal do Movimento Nacional - Viacheslav Chornovil. Mas logo, ele morreu em um acidente de carro em circunstâncias misteriosas. O atual presidente, Leonid Kuchma, venceu a eleição na esteira de slogans verdadeiros e falta de promessas populistas. Mas o que sua cadência trará ainda é questionável.\n\nDepois de ser privada de seu status nuclear em 1996 e assinar o Memorando de Budapeste, a Ucrânia recebeu garantias de proteção dos estados mais fortes e um ingresso para o teatro mundial. Mas quem será o jovem país na futura apresentação? Um participante direto ou apenas um observador nas últimas filas?"
 BRA_MILLENNIUM_DAWN_DESC: "O Brasil está lentamente em ascensão no virar do século. O país tem potencial para a grandeza. É uma das maiores economias emergentes do mundo e seu crescimento continua a acelerar. No entanto, nos últimos anos, a corrente econômica do Brasil está recuando de uma forte recessão devido à Crise Financeira Asiática de 1995 e a uma moeda debilitada. Agora um novo concorrente do partido chegou à cena. O PT entrou em ação e está ganhando rapidamente tração.\n\nVocê será capaz de reiniciar a outrora grande economia do país ou o PT e suas políticas socialistas tomarão o controle?"
 CAN_MILLENNIUM_DAWN_DESC: ""
 SMA_MILLENNIUM_DAWN_DESC: "San Marino é um país extremamente pequeno e, de fato, totalmente dependente da Itália. Sendo sem litoral e sem aeroportos, depende muito de turistas, já que eles representam uma grande parte do PIB. Vale a pena depender da Itália, permanecendo de fato seu território, ou é necessário seguir nosso próprio caminho? Tudo isso no momento é decidido por dois capitães-regentes, que são nomeados pelo Grande Conselho Geral por um período de 6 meses. Existem 60 membros do Grande Conselho Geral. Mas também existe o Arengo, a Assembleia dos Chefes de Famílias, que era o órgão supremo nos tempos antigos, mas agora perdeu quase totalmente seu poder, mas manteve o direito de petição. Os Capitães-Regentes recebem inúmeras petições apresentadas pelos cidadãos no primeiro domingo após 1º de abril e após 1º de outubro. As petições apresentadas devem ser consideradas dentro de 6 meses."
 DEN_MILLENNIUM_DAWN_DESC: "A Dinamarca é uma nação segura e protegida, sendo membro da UE e da OTAN. No entanto, uma crise econômica interna e desaceleração começaram recentemente a desafiar o estado dinamarquês. Se a Dinamarca pode continuar imune à turbulência do mercado mais amplo mundo está longe de ser certo."
 ETH_MILLENNIUM_DAWN_DESC: "A monarquia da Etiópia foi derrubada em 1974 e sua subsequente ditadura comunista em 1991. A constituição de 1995 forneceu uma democracia um tanto estável, mas falhou em resolver os problemas de fome, crise política e corrupção. Também não resolveu os problemas da Etiópia conflito em curso com a Eritreia."
 FIN_MILLENNIUM_DAWN_DESC: "Sempre preocupada em preservar sua neutralidade, a Finlândia observou atentamente o colapso da União Soviética e a subsequente expansão política das forças da Europa Ocidental. Os finlandeses aderiram à UE em 1995 e estão prestes a adotar o euro como moeda nacional. Can peace último? Os russos estão realmente pacificados?"
 GRE_MILLENNIUM_DAWN_DESC: "À medida que o século 21 desponta na Grécia, o país parece satisfeito. No entanto, sob a superfície, há preocupações crescentes com a crise da dívida e a ascensão de paridades políticas radicais em ambos os lados do espectro. O futuro da República Helênica é incerto , e a menos que seja devidamente guiado, pode seguir um caminho sombrio."
 ICE_MILLENNIUM_DAWN_DESC: "Em um canto escondido da Europa, a Islândia manteve com sucesso um perfil discreto desde a independência em 1944. Os conflitos políticos com os britânicos sobre os direitos de pesca foram talvez o momento mais emocionante da história da Islândia. A Islândia deveria assumir uma posição mais central?"
 ITA_MILLENNIUM_DAWN_DESC: "A Itália tem estado ligeiramente atrás das outras grandes potências desde o início do século XX. Após a derrota na Segunda Guerra Mundial, os fortes laços da Itália com seus antigos inimigos e com a Alemanha, sua antiga aliada, a elevaram de volta ao status de um país altamente desenvolvido e próspero. Mas o que o futuro reserva? Grandeza nacional ou desastre econômico?"
 IRQ_MILLENNIUM_DAWN_DESC: "Iraq is no stranger to hardships, having recently just fought an 8 year war with the Iranians, Iraq gained nothing but debt and economic hardship. Being unable to pay back the debts owed to the Gulf states, Saddam Hussein launched an invasion of Kuwait in 1990. Enduring a humiliating defeat at the hands of the coalition forces shortly after the war began, Iraq is still struggling to recover and rebuild. With sanctions crippling the Iraqi economy, and an ever more authoritarian stance taken by Saddam Hussein and the Ba'athist regime, large portions of Iraqi society find themselves at odds with the current ruling order. Only time will tell if Iraq will fall into turmoil, or bring about the millennia long golden age."
 RAJ_MILLENNIUM_DAWN_DESC: "Onde a China é a superpotência de amanhã, a Índia é a superpotência da próxima semana. Uma vez uma colônia britânica, agora uma potência independente em ascensão, está em desacordo com seu vizinho do norte e oeste. O conflito em Caxemira construiu todo o paradigma geopolítico da Índia nos próximos anos. Agora, à medida que a Índia entra em um novo século, ela deve finalmente se levantar de joelhos e mostrar todo o poder do Tigre Asiático. A Índia pode se tornar uma superpotência ou cair em um longo declínio? E o que o próximo milênio reserva para ela?"
 SPR_MILLENNIUM_DAWN_DESC: "Desde a morte de Franco em 1975, a Espanha tem seguido um longo caminho de recuperação. Através de dificuldades econômicas e sociais, o país conseguiu trabalhar parcialmente nas questões que décadas de fascismo haviam causado. A Espanha ingressou na OTAN (1982) e na UE (1986) e tem trabalhado incansavelmente e com grande esforço para alcançar os países mais poderosos e ricos da Europa; Alemanha, França, Grã-Bretanha e Itália.\nEm tempos como esses, a Espanha requer liderança forte e mão estável. O Primeiro-Ministro Aznar pode entregar? Ou seu Partido Popular abrirá espaço para uma liderança mais digna?"
 SWE_MILLENNIUM_DAWN_DESC: "A Suécia estava em uma profunda crise econômica no início dos anos 1990, com a adesão do país à UE em 1995 fazendo pouco para aliviar seus problemas. A nação sueca, que permanece militarmente neutra como é a tradição sueca, precisa encontrar respostas econômicas para seus problemas atuais."
 SWI_MILLENNIUM_DAWN_DESC: "Neutra desde tempos imemoriais, a Suíça decidiu ficar fora não apenas da OTAN e da União Europeia, mas também das Nações Unidas. A comunidade internacional ainda pode contar com a Suíça para ser o juiz silencioso e o terreno neutro que sempre foi? Ou o povo suíço verá seu governo assumir um papel mais ativo no exterior para preservar a paz e impor os interesses nacionais suíços?"
 BRM_MILLENNIUM_DAWN_DESC: "Mianmar está em uma encruzilhada no início do século XXI. A junta militar percebeu que seu controle sobre o poder está diminuindo constantemente, à medida que a pressão tanto interna quanto externa para democratizar cresce cada vez mais forte. No entanto, a democratização ou a falta dela não é o único problema diante do governo de Mianmar. A integridade territorial desta nação do Sudeste Asiático tem sido instável desde a independência, com grupos rebeldes lutando por maior autonomia assolando as regiões fronteiriças de Mianmar. As soluções para esses dilemas gêmeos permanecem incertas. Violência ou diplomacia? Democracia ou autoritarismo? Compromisso ou revolução? Apenas o tempo dirá."
 LIC_MILLENNIUM_DAWN_DESC: "Liechtenstein é uma nação pequena e discreta, mas bem desenvolvida, no coração da Europa. Com uma população de apenas seis mil habitantes e um dos únicos dois países do mundo duplamente sem litoral, é seguro dizer que ninguém espera muito de Liechtenstein. Altamente dependente de seus vizinhos nos Alpes tanto para sua economia quanto para sua segurança, Liechtenstein tem muitas escolhas difíceis pela frente. Deveria ser um bastião de cooperação internacional ou um refúgio para corporações internacionais mal-intencionadas? Deveria aceitar refugiados de todo o mundo na tentativa de se tornar uma verdadeira potência militar, ou fechar suas fronteiras e se concentrar apenas em si mesma? Apenas o tempo dirá."
 POL_MILLENNIUM_DAWN_DESC: "A Polônia se libertou recentemente do bloco comunista da União Soviética. A situação atual no país está longe de ser perfeita. Apesar do crescimento da economia polonesa desde a queda do comunismo, o povo polonês continua a lutar. Apesar dessas dificuldades, a nação em si tem muito potencial para se tornar uma potência econômica significativa. Aproveitando o caos, dois partidos rivais entraram na arena política: o eurocético PiS e o PO, fiel à União Europeia. As diferentes visões desses partidos podem fazer da Polônia uma potência econômica da Europa Central, ou alienar seus vizinhos e reentrar no caminho da conquista. Além disso, houve uma oportunidade de unir o famoso Grupo de Visegrad, onde a Polônia, como o mais forte desses 4 países, pode decidir sobre a conexão final da Polônia, República Tcheca, Eslováquia e Hungria sob uma bandeira. Mas quando os dois maiores partidos políticos lutam entre si, alguns estão apenas esperando para sair das sombras. O partido nacionalista UPR, liderado por Janusz Korwin-Mikke, pode provar ser o vencedor neste duelo, que trará grandes mudanças para a Polônia. No entanto, um nacionalista não assumirá o trono tão facilmente. Lech Wałęsa, ex-líder do anticomunista Solidariedade, que derrubou o comunismo na Polônia, agora ainda está presente na política com seu partido ChDRP e fará todos os esforços para garantir que Korwin não mergulhe o país no caos."
 NIG_MILLENNIUM_DAWN_DESC: "Nigéria, a nação mais populosa da África, tem ascendido constantemente à proeminência regional desde a virada do século, alavancando sua vantagem demográfica de mais de 200 milhões de cidadãos e expandindo o setor financeiro para fortalecer sua posição nos mercados internacionais. A transição do país para um governo civil em 1999 estabeleceu um sistema democrático frágil, mas promissor, que conquistou apoio tanto internamente quanto externamente, permitindo maior influência diplomática em toda a África Ocidental. No entanto, esse experimento democrático agora enfrenta um desafio crítico, já que doze estados do norte implementaram graus variados da lei Sharia desde 2000, criando uma divisão gritante em termos religiosos. O sul, de maioria cristã, respondeu com manifestações generalizadas e agitação civil, enquanto a violência sectária irrompeu em áreas de fé mista, como os estados de Kaduna e Plateau. À medida que as tensões religiosas aumentam e milícias armadas se formam em ambos os lados, a questão paira: a polarização religiosa da Nigéria entre um norte predominantemente muçulmano e um sul cristão acabará levando a uma guerra civil?"
 BHR_MILLENNIUM_DAWN_DESC: "O recém-corado emir do Bahrein, Hamad bin Isa Al Khalifa, herda uma posição precária. A maioria xiita do Bahrein abriga uma grande frustração em relação a uma monarquia percebida não apenas como discriminatória em relação aos xiitas, mas também como uma ocupante estrangeira e opressora do verdadeiro povo indígena do Bahrein. A oposição sunita, por razões diferentes, ressente-se da natureza autocrática do governo do Bahrein e se alinhou a grupos xiitas contrários à continuação da monarquia absoluta. Alguns dos conselheiros do emir defenderam a liberalização política como uma forma de reduzir a pressão sobre o regime, enquanto outros defenderam o fortalecimento do governo autocrático. Caberá ao novo governante do Bahrein traçar um curso para o país."
 KUW_MILLENNIUM_DAWN_DESC: "Não faz muito tempo que o Kuwait era um país sob ocupação. Sua monarquia estava no exílio fazendo campanha pela restauração da soberania kuwaitiana, enquanto o povo do Kuwait, tanto sunitas quanto xiitas, estava unido contra o opressor iraquiano. Agora que a Guerra do Golfo restaurou a independência do Kuwait, a monarquia deve retomar o equilíbrio político que é governar a nação do Kuwait. O parlamento do Kuwait, um dos mais poderosos do Oriente Médio, impõe um forte controle sobre a autoridade do monarca, ao mesmo tempo em que pressiona continuamente por uma maior liberalização política. A influente classe mercantil do país continua a pressionar por um maior investimento no setor privado, algo que os cidadãos kuwaitianos empregados no setor público relutam em ver acontecer às custas de seu próprio bem-estar."
 OMA_MILLENNIUM_DAWN_DESC: "Omã conquistou uma reputação como um farol de paz e estabilidade em uma região agitada e propensa a conflitos. Qaboos bin Said al Said seguiu uma política externa bem-sucedida desde que assumiu o poder em 1970, liderando um país que não é odiado por ninguém e é admirado por todos. Mas Omã não está isento de desafios. O Sultão tem sido criticado por sua abordagem autoritária em relação ao descontentamento interno, aumentando a incerteza sobre a sustentabilidade da monarquia absoluta."
 QAT_MILLENNIUM_DAWN_DESC: "Since 1996 Qatar has charted an independent course within the Gulf Cooperation Council. The country's natural gas reserves have allowed Qatar to operate outside of the Saudi-dominated oil market, and for decades the emirs of Qatar have enjoyed a close relationship to the populist Muslim Brotherhood, an organization that the Saudis and Emiratis have increasingly come to see as a threat to their authority. Worst of all in the eyes of the Saudis and their Emirati allies is Qatar's close relationship with Iran, a state that they view as an existential threat. It is only a matter of time before the hostility of Qatar's neighbors to its unique foreign policy reaches boiling point."
 SAU_MILLENNIUM_DAWN_DESC: "A Arábia Saudita historicamente desfrutou de uma posição confortável como uma das principais potências do Oriente Médio. Como guardiã dos locais sagrados de Meca e Medina, o Reino desfruta de legitimidade religiosa inigualável. No entanto, a Revolução Iraniana de 1979 transformou a suspeita mútua saudita-iraniana em hostilidade total, pois a recém-formada República Islâmica do Irã buscou reivindicar o manto de líder do mundo islâmico. Internamente, o Reino também enfrenta desafiantes pelo título de líder do mundo islâmico. Desde que os sauditas permitiram a entrada de tropas americanas no país em 1991, a liderança da Al-Qaeda jurou destruir a monarquia saudita e sua falsa piedade e substituí-la por um governo verdadeiramente islâmico."
 SIN_MILLENNIUM_DAWN_DESC: "Singapore at the turn of the century held at most regional authority amongst the nations of Asia and abroad. The Asian financial crisis also did no favors to the small nation at the mouth of the Malay peninsula. Outside of the financial crisis and its small stature it has shown its strength in the entrepot, banking and foreign investment. The Singaporean people and her government have shown truly what it is like to be dubbed \"The Lion City\"\n"
 PHI_MILLENNIUM_DAWN_DESC: "The recent election of 1998, has seen a massive change in rhetoric within the Filipino political spectrum. Estrada and his coalition, Laban ng Makabayang Masang Pilipino (Struggle of the Patriotic Filipino Masses), saw resounding success against his opposition. Underneath Estrada the Philippines saw a resounding growth rate of 3.4% and is set on track to maintain the quick-paced growth. Furthermore, Estrada has begun mobilizing the AFP to prepare a declaration of all-out-war on the Moro Islamic Liberation Front. Hidden amongst this almost picturesque presidency lurks the monster of corruption and a subsequent trial."
 UAE_MILLENNIUM_DAWN_DESC: "Carinhosamente apelidados por oficiais americanos como \"Pequena Esparta\", os Emirados Árabes Unidos têm sido um aliado próximo tanto dos Estados Unidos quanto da Arábia Saudita e um participante ávido em operações militares multilaterais. As forças armadas dos Emirados, particularmente sua força aérea respeitável e sua elite Guarda Presidencial, participaram da Guerra do Golfo, acumulando valiosa experiência militar. \n\nMas os Emirados Árabes Unidos não estão satisfeitos em simplesmente desempenhar um papel secundário em relação aos EUA ou à Arábia Saudita. Os emiradenses têm se destacado em termos de influência externa, às vezes competindo com seus antigos aliados. Além disso, os Emirados Árabes Unidos são o lar do único caso bem-sucedido de diversificação econômica, com Dubai ganhando reputação como uma cidade global e um centro financeiro."
 KOR_MILLENNIUM_DAWN_DESC: "A República da Coreia superou com sucesso a guerra, a pobreza e a ditadura para se tornar um dos países mais desenvolvidos e estáveis do mundo. O presidente Kim Dae-jung é amplamente respeitado por seu papel em trazer democracia para a Coreia e muitos têm esperança em seus esforços para fazer as pazes com o Norte. \n\nNo entanto, seu governo foi manchado por escândalos e a política coreana permanece extremamente polarizada. O partidarismo político, a corrupção governamental e a incerteza em torno dos esforços do presidente para se reconciliar com o Norte definirão o futuro da Coreia neste novo milênio."
 NKO_MILLENNIUM_DAWN_DESC: "A chamada \"Hermit Kingdom\" é um lugar que o mundo exterior percebe como misterioso e ameaçador na mesma medida. Rumores de um programa nuclear secreto no país estão se proliferando e seu vizinho do sul permanece suspeito das intenções do Norte. Mas rachaduras começaram a aparecer na imagem impenetrável do Reino Ermitão. Ainda em processo de recuperação de uma devastadora fome conhecida como a Marcha Árdua, a RPDC teve que contar com assistência externa para ajudar a enfrentar a tempestade. As fraquezas do sistema de governança do Norte são evidentemente claras. Kim Jong-il abordará essas deficiências e adotará uma abordagem diplomática com o mundo exterior para facilitar o desenvolvimento? Ou ele decidirá que a belicosidade do exército e o fervor ideológico do partido devem ser sustentados pela guerra?"
 BOT_MILLENNIUM_DAWN_DESC: "Botsuana é um dos países mais desenvolvidos da África, com uma democracia estável, alto índice de desenvolvimento humano e baixa corrupção. Botsuana ganhou sua riqueza após a descoberta de grandes quantidades de diamantes, o que levou a um dos mais altos PIB per capita da África. No entanto, não está isento de problemas; a política é dominada pelo partido BDP, que muitos veem como autocrático e exclusivo. Além disso, a caça ilegal é desenfreada nas muitas reservas de caça do país. Os diamantes também não durarão para sempre, e uma solução precisa ser encontrada para encontrar alternativas para a economia."
 AFG_MILLENNIUM_DAWN_DESC: "Desde que os comunistas assumiram o poder em 1978, o Afeganistão esteve em um ciclo de guerra civil e intervenção externa. A retirada da União Soviética em 1989 e a queda subsequente do regime em 1992 não trouxeram paz. Pelo contrário, o conflito de interesses entre as facções mujahideen levou a contínuos combates até 1996, quando o Talibã apoiado pelo Paquistão aproveitou a guerra civil para assumir grandes partes do Afeganistão. Seu objetivo era eliminar todas as outras facções, forçando os ex-guerrilheiros a formarem a Aliança do Norte contra o Talibã sob a mediação do General Massoud. O que o futuro reserva para este país devastado pela guerra?"
 ARM_MILLENNIUM_DAWN_DESC: "A independência da Armênia, que ela recebeu uma das primeiras após o colapso da URSS, não lhe trouxe prosperidade ou grandeza. A guerra em Nagorno-Karabakh, desencadeada pelos nacionalistas, esgotou a república. Ao mesmo tempo, não tanto os combates em si, mas o bloqueio da Armênia pelo Azerbaijão. À frente da Armênia está um político controverso que tem grande influência tanto na própria Armênia quanto no disputado Artsakh. A Armênia conseguirá ganhar glória sob seu governo, ou cairá em um abismo de longo prazo?"
 BLR_MILLENNIUM_DAWN_DESC: "O colapso da União Soviética trouxe à Bielorrússia a tão esperada independência. Mas valeu a pena? A economia é completamente dependente da Rússia, o exército não está pronto para o combate, e o Ocidente ainda está procurando como transformar a Bielorrússia em uma fortaleza de sentimentos anti-russos. Lukashenko ou qualquer outra pessoa será capaz de escolher o caminho certo para a Bielorrússia?"
 GEO_MILLENNIUM_DAWN_DESC: "A Geórgia, deixada à margem do Cáucaso após o colapso da URSS, caiu em uma guerra civil quase simultaneamente com a guerra na Abkházia e na Ossétia. A derrubada do presidente Gamsakhurdia levou à instabilidade política, destruiu as esperanças de uma Geórgia unida e deixou uma grande marca no povo. A Geórgia será capaz de se tornar uma potência regional ou continuará a se mover em direção ao caos político?"
 AZE_MILLENNIUM_DAWN_DESC: "Azerbaijan, now headed by the authoritarian former communist Heydar Aliyev, is at a crossroads. The lost war in Artsakh, an unstable society and the growing ambitions of the people, put the government of Azerbaijan in front of an uncertain future. Will it be able to become the pearl of the Caucasus, or will it slide into political instability?"
 COM_MILLENNIUM_DAWN_DESC: "The Comoros island chain has an idyllic countryside. Jungles cover the mountains and the volcano Karthala. It's on the coast where most people live simple lives as fishermen, the country's single greatest revenue. Not always is it peaceful on these islands. Coups are a common occurrence and unruly governors try their best for more autonomy. Comoros does share a lot with its cultural neighbour Tanzania, except it's majority Muslim and all exclusively speak a dialect of Kiswahili.\n\nThe country has an interesting view on the french overseas department of Mayotte. Irredentists claim it as part of the nation though the people in Mayotte don't seem to share that view."
 COM_MODERN_DAY_DESC: "Comoros has seen its fair share of action. In 2008 the invasion to take back control of Anjouan was a success. Many citizens regrettably live poor lives with many fleeing to Mayotte in search for a better life. There's some good prospects for a membership in the East African Community. This can greatly improve investment opportunities to come to Comoros and raise the living standards for thousands. Most likely this country will live life with business as usual."
 ABK_MILLENNIUM_DAWN_DESC: "Abecásia é um pequeno país que luta por sua independência há muito tempo. Lá em 1993, este país ganhou seu direito à independência, embora ninguém, exceto a Rússia, reconhecesse seus direitos. Talvez em breve o mundo inteiro ouça falar da Abecásia"
 EST_MILLENNIUM_DAWN_DESC: "Estônia, oficialmente conhecida como República da Estônia, comemora seu nono ano de independência da União Soviética; no entanto, isso não significa que a influência russa continue a crescer. O pequeno país báltico agora está preso entre o crescente puxão do Oriente e do Ocidente. Agora tem que lidar com ameaças à sua independência, o surgimento do pensamento de extrema direita e a burocracia governamental ineficaz causando problemas dentro do país."
 FIJ_MILLENNIUM_DAWN_DESC: "Fiji, also known as the Republic of Fiji, is a Pacific island nation which has had a strikingly volatile history. Gaining independence in the 1970s, Fiji has had 2 coups and several changes of both government and constitutions which have only been enhanced through the growing ethnic divide between the Ethnic Fijians and the Ethnic Indo-Fijian peoples. But with the new millennium come new problems, only time will tell if Fiji can truly become the island paradise that she sells herself as."
 KAZ_MILLENNIUM_DAWN_DESC: "Cazaquistão, a última nação que emergiu da sombra da União Soviética, marcada por um crescente declínio econômico impulsionado por seu estado falido. À medida que o novo milênio começava, questões sobre sua trajetória política e econômica persistiam. Que futuro aguardava o Cazaquistão no século XXI, e como equilibraria suas aspirações de modernização com a preservação de sua identidade cultural única?"
 KYR_MILLENNIUM_DAWN_DESC: "Quirguistão é uma nação jovem e politicamente instável na Ásia Central, marcada por uma série de convulsões políticas. Outro novo autocrata conseguiu tomar o poder em suas próprias mãos. Ele será capaz de manter o poder em meio ao conflito crescente com o Tajiquistão e o Uzbequistão? Que papel a Rússia e a China desempenharão nisso? Tudo isso aguarda o Quirguistão no novo milênio."
 UZB_MILLENNIUM_DAWN_DESC: "No ano 2000, o Uzbequistão é uma ex-república soviética caracterizada por um governo centralizado e autoritário. Sua economia era principalmente baseada na agricultura e produção de algodão. À medida que o novo milênio começava, podia-se ponderar: Que futuro o Uzbequistão abraçaria no século XXI? Ele evoluiria politicamente, economicamente e socialmente, e como navegará seu papel em uma paisagem centro-asiática em mudança?"
 SER_MILLENNIUM_DAWN_DESC: "O terrível bombardeio da OTAN deixou cicatrizes nos corações de todos os habitantes da Iugoslávia. Agora, o país terá que escolher para onde se mover no novo milênio, talvez seja hora de se livrar dos líderes anteriores? ou tentar recuperar o antigo estado?"
 KOS_MILLENNIUM_DAWN_DESC: "Nossa nação finalmente está se aproximando do momento em que finalmente poderemos obter total independência. Nossa luta contra a influência da Sérvia está se aproximando da etapa final, vamos terminar o que começamos, ou desistiremos e nos tornaremos apenas parte de outro país novamente?"
 VEN_MILLENNIUM_DAWN_DESC: "No início do novo milênio, a Venezuela estava em uma encruzilhada, moldada por uma história rica e intricada que carregava uma mistura de promessas e incertezas. O ano 2000 marcou um momento significativo na evolução do país, após uma série de mudanças políticas e sociais importantes. Em 1999, Hugo Chávez, um carismático líder militar, ascendeu à presidência da Venezuela. Sua eleição representou um ponto de virada profundo na narrativa da nação. A ascensão de Chávez foi impulsionada por um compromisso em confrontar desafios persistentes de desigualdade social, pobreza e corrupção política. Sob a bandeira do chavismo, seu movimento político, ele defendeu uma visão de distribuição mais justa e equitativa da riqueza petrolífera abundante da Venezuela. No entanto, à medida que o novo milênio se desdobrava, a nação se viu em um momento crucial, com a direção futura da Venezuela pendendo na balança. Havia debates crescentes e perspectivas divergentes sobre continuar sob a liderança de Chávez ou explorar um caminho alternativo. Alguns advogavam por uma extensão do mandato de Chávez, enfatizando sua missão de abordar as desigualdades sociais, enquanto outros defendiam um curso diferente, buscando abordagens novas para a governança e estabilidade econômica. Veremos uma mudança de governo no futuro da Venezuela? Ou veremos a continuação da Quinta República?"
 HEZ_MILLENNIUM_DAWN_DESC: "Since the start of the Lebanese Civil War and the occurrence of the Islamic Revolution in Iran, an orthodox organization which was originally a part of the Islamic Amal movement of Lebanon, and its ideals was and is based on the doctrine of the \"Islamic Resistance\", was formed. The Hezbollah, the most powerful political and military entity in Lebanon, was formed. From those times, Hezbollah adjusted itself to be a leverage against the state of Israel and its allies in the Levant region. Although at the same time, it tries to have a dominance over the state of Lebanon itself. With  tensions in the middle east growing up since the Persian Gulf War, Hezbollah has tried to increase its base of operations beyond the Middle East. And now, with  the rise of tensions on the region once again, Hezbollah has to adjust its new plans, would the doctrine of the Resistance, and the political dominance of Hezbollah in Lebanon succeed? Only time and the changes of the world would tell... "
 SOO_MILLENNIUM_DAWN_DESC: "Uma vez parte da RSS da Geórgia, a Ossétia do Sul separou-se da Geórgia e declarou sua independência. Após a guerra sangrenta, Ossetia defendeu sua independência e começou a lutar pela integração com a Rússia, mas no início do século XXI, o estado do país permanece incerto. De um lado - a Geórgia hostil, do outro - a Rússia, que relutantemente busca levar para casa uma pequena, mas orgulhosa Ossetia"
 BUL_MILLENNIUM_DAWN_DESC: "Bulgária, que passou pela Segunda Guerra Mundial e se tornou uma república socialista, só recentemente foi transformada em um estado democrático. O novo milênio brilha para a Bulgária com novos desafios enfrentando uma nova democracia em crescimento nos Balcãs... Apenas o tempo mostrará o que a Bulgária alcançará no novo e talvez mais brilhante século."
 BOS_MILLENNIUM_DAWN_DESC: "A Bósnia, terra rica em história e cultura, foi moldada pelas mãos de impérios estrangeiros, desde o poder do Império Romano até o colapso da República Federal da Iugoslávia. Apesar das cicatrizes deixadas por sua violenta luta pela independência, o povo da Bósnia permanece firme em sua jornada rumo a um futuro melhor.\n\nEmbora as divisões étnicas e religiosas persistam, elas não diminuem a esperança e a resiliência de uma nação determinada a superar seu passado. O futuro da Bósnia pode ser incerto, mas o espírito inabalável de seu povo é um farol que brilha intensamente em direção a um amanhã mais promissor."
 EGY_MILLENNIUM_DAWN_DESC: "No ano 2000, a política egípcia era dominada pelo governo arraigado do presidente Hosni Mubarak, caracterizado pelo controle autoritário, liberdades políticas limitadas e tentativas esporádicas de reforma. Apesar de algum crescimento econômico, o país lidava com pobreza generalizada, corrupção e desigualdade social. A dissidência foi recebida com dura repressão, mas sinais de oposição e pedidos de mudança persistiam, especialmente entre os jovens e grupos da sociedade civil. No entanto, o futuro da política egípcia permaneceu incerto, com questões sobre sucessão, queixas socioeconômicas e o impacto potencial das tecnologias avançadas adicionando camadas de complexidade à paisagem política do país."
 IND_MILLENNIUM_DAWN_DESC: "Indonesia is the center of Southeast Asian affairs despite being rocked by economic troubles. The 1997 Asian financial crisis has crippled Indonesia's currency, the Rupiah which has brought much instability to the archipelago nation, further flamed by the fires raging in Aceh. Rising inflation, radicalization and disunity amongst the nation has been causing it to fall behind its neighbors and the rest of the world, and it has left its leaders scratching their heads on what to do in order to survive the 21st century"
 PMR_MILLENNIUM_DAWN_DESC: "No ano 2000, a Transnístria, uma região separatista da Moldávia, estava entrincheirada em um impasse político prolongado. Tendo declarado independência em 1990, a região operava como uma república autoproclamada, embora sua soberania permanecesse não reconhecida internacionalmente. Liderada pelo Presidente Igor Smirnov, a Transnístria manteve suas próprias instituições e forças de segurança, fomentando uma autonomia de fato. No entanto, as tensões persistiram com a Moldávia, e esforços de reconciliação foram dificultados por sanções econômicas, contrabando e falta de consenso sobre o status da região. Negociações mediadas por organizações internacionais buscaram uma resolução pacífica, mas a situação política da Transnístria permaneceu complexa e não resolvida, marcada por um equilíbrio frágil entre aspirações de independência e realidades geopolíticas."
 CUB_MILLENNIUM_DAWN_DESC: "Na bela ilha de Cuba, onde o sol aquece as palmeiras e a brisa do mar abraça suavemente as margens, o ano 2000 viu uma atmosfera de mudança. No coração do Caribe, neste oásis de calor e beleza, vivia uma história rica em tradição e herança cultural. No entanto, nas sombras dessa rica beleza, a luta acalorada de forças políticas continuava seus movimentos agitados. A situação política do país era tensa, refletindo lutas de poder e ideológicas perpétuas. Apesar disso, o espírito do povo de Cuba permanecia indestrutível, seus corações cheios de esperança por um futuro brilhante e fé na justiça."
 OTHER_MILLENNIUM_DAWN_DESC: "Primeira Guerra Mundial, Segunda Guerra Mundial, Coreia, Vietnã, Afeganistão. As guerras do passado deixaram as nações do presente temendo pelo futuro. No entanto, há uma grande esperança de que a humanidade possa ter passado por 20 séculos de derramamento de sangue para completar sua transição para um período de paz e estabilidade."
 LBA_MILLENNIUM_DAWN_DESC: "Muammar Gaddafi governou a Líbia durante 31 anos, desesperado por alcançar os seus ideais e aspirações. A Líbia está relativamente estável neste momento, com membros da própria família de Gaddafi tentando cair nas boas graças do excêntrico líder, mas as coisas podem mudar a qualquer momento.\n\nPoderá a Líbia alcançar o poder e a prosperidade no século XXI, ou acabará na incontável lista dos Estados falidos? Será Muammar capaz de manter o seu poder antes da nova vaga do novo milénio? Só o tempo irá dizer..."
 ROM_MILLENNIUM_DAWN_DESC: "No alvorecer do novo milênio, a Romênia está em uma encruzilhada. Tendo emergido de décadas de governo comunista, a frágil democracia que havia estabelecido até agora trouxe mais caos do que estabilidade.\n\nDa Golaniada à Sexta Mineríade, o futuro parece frágil, pois governo após governo falha em solidificar instituições democráticas e consertar dificuldades econômicas. À medida que a pobreza aumenta, demagogos como Corneliu Vadim Tudor conseguem ganhar seguidores massivos entre as massas desiludidas, enquanto os partidos democráticos vacilam e caem, incapazes de fornecer soluções viáveis.\n\nE com o retorno do ex-presidente Ion Iliescu à política, a população aparentemente tem que escolher entre o menor dos dois males. Mas quem realmente sabe o que o futuro reserva para a Romênia?"
 CZE_MILLENNIUM_DAWN_DESC: "Um país posicionado no centro da Europa, a República Tcheca entra no Novo Milênio em uma situação não tão brilhante. O regime comunista acabou há muito tempo, mas a Tchecoslováquia também. A economia ainda não se recuperou totalmente, mas o processo de privatização está prestes a terminar e as reparações estão em linha reta para serem concluídas.\n\nA esfera política parece estável, mas caótica. Enquanto os dois maiores rivais, o conservador ODS e o social-democrata ČSSD, dominam o parlamento, outros partidos ainda estão procurando novas coalizões. Enquanto o ODS mantém relações com o KDU-ČSL e os verdes, o ČSSD aprofunda a cooperação com o último partido comunista, o KSČM.\n\nIndependentemente das ações políticas, empresas independentes estão tentando alcançar o mercado estrangeiro. As empresas automotivas, Škoda e Tatra, estão desenvolvendo novas maneiras de atualizar os veículos tchecos, enquanto a VOP CZ busca mais caminhos para melhorar o setor militar. As empresas trabalham de forma independente, mas com relações comuns. Uma pequena reviravolta pode eventualmente uni-las em um grande monopólio.\n\nMas ainda há mais a dizer. O general militar, Petr Pavel, está prestes a melhorar muito sua carreira na OTAN e na República Tcheca. Graças à sua experiência e treinamento, ele terá que liderar os países para se prepararem para uma ameaça iminente à soberania da República Tcheca. Mas ele vai ficar na OTAN e continuar sua carreira, tendo os EUA como aliados? Ou talvez os Estados Unidos sejam os únicos a se ter medo?"
 TAJ_MILLENNIUM_DAWN_DESC: "Desde que ganhou a independência da União Soviética em 1991, o Tajiquistão tem estado em um estado de constante instabilidade e conflito. A nação rapidamente caiu em uma guerra civil brutal, colocando o governo contra uma coalizão de grupos de oposição, incluindo forças islâmicas e democráticas. Em 1997, uma paz frágil foi negociada, mas as tensões permaneceram altas enquanto o governo de Emomali Rahmon consolidava o poder, afastando muitas das facções da oposição. Corrupção, pobreza e divisões estão surgindo na sociedade tajique, com o tempo sendo a única testemunha do que está por vir..."
 HOL_MILLENNIUM_DAWN_DESC: "Outrora o coração de um império marítimo global, os Países Baixos emergiram no século XXI como uma democracia liberal estável e um pilar da diplomacia e do comércio internacionais. Como membro fundador da União Europeia e da OTAN, há muito defendem o multilateralismo e os direitos humanos. Mas, por trás de sua prosperidade moderna, encontram-se crescentes tensões sociais, debates sobre identidade nacional e o legado do colonialismo começou a remodelar seu discurso público. Com a crescente instabilidade geopolítica, as mudanças econômicas e os desafios globais no horizonte, os holandeses enfrentam uma questão decisiva: continuarão como uma voz pragmática de moderação ou trilharão um novo caminho em um mundo incerto?"
 BOL_MILLENNIUM_DAWN_DESC: "High in the lungs of the Andes, Bolivia rises: a nation forged from silver mines, revolutions, and forgotten empires. Though stripped of its coast and scarred by coups, its heart still beats with the thunder of ancient drums and the dreams of its people. The 20th century left behind scars: lost wars, broken treaties, and an uneasy dance with foreign capital. Yet as the new millennium dawns, something stirs beneath the surface: a growing fire of indigenous awakening, resource nationalism, and a demand to rewrite the social contract. With lithium under its soil and unrest in its streets, Bolivia may yet become more than just a pawn in great power games. It may become the storm."
 ISR_MILLENNIUM_DAWN_DESC: "Em alguns aspectos, Israel nunca esteve em uma posição melhor. A ameaça existencial que os vizinhos árabes de Israel representavam outrora desapareceu em grande parte graças à normalização das relações com o Egito e a Jordânia. Grandes avanços foram feitos rumo à resolução da questão palestina por meio dos Acordos de Oslo de 1993.\n\nApesar disso, Israel permanece apreensivo. O terrorismo e os estados pária justificam a crescente securitização do país, enquanto as questões sobre a trajetória futura do Estado judeu continuam a dominar a política israelense. Permanece incerto como Israel responderá às crescentes e frequentemente incompatíveis pressões da comunidade internacional, dos palestinos e de seu próprio povo."
 SYR_MILLENNIUM_DAWN_DESC: "A nation born out of colonial interests with a history mired with coups and instabilities, Syria has been struggling a lot ever since its inception. After the baathist takeover and since 1971 the country has seemingly united under the stable yet authoritarian rule of Hafez Al Assad. As the longest reigning president his tenure was known for overseeing a period of profound stability yet equally notorious political violence. Hafez al-Assad's health is currently failing, and soon a new successor will rise. However many people have started to question this state of affairs as well as the status quo, and many seek to change it. Will Syrians overcome their divides and differences and unite for a bright future? Or will the state crumble under the test of time by the divides of its people and failures of its institutions?"
 ALG_MILLENNIUM_DAWN_DESC: "Após uma década de brutal guerra civil, a Argélia de 2000 encontra-se numa encruzilhada frágil. O presidente Abdelaziz Bouteflika, eleito em 1999 com o apoio do establishment militar, prometeu reconciliação nacional, recuperação econômica e o retorno à estabilidade. Contudo, as cicatrizes da Década Negra permanecem profundas. Insurgentes islamitas ainda persistem nas montanhas, tensões étnicas fervilham na região da Cabília e a confiança no Estado é baixa.\n\nAs vastas reservas de petróleo e gás do país continuam sendo seu principal pilar econômico, mas o desemprego é alto, a corrupção é desenfreada e as promessas de reforma muitas vezes soam vazias. Investidores estrangeiros vislumbram o potencial inexplorado da Argélia, enquanto a população exige justiça social, desenvolvimento e paz.\n\nSerá que a Argélia conseguirá construir um Estado moderno e estável, preservando ao mesmo tempo a sua independência e identidade? Ou as tensões internas e as lutas pelo poder continuarão a assombrar o seu futuro?"
 GRN_MILLENNIUM_DAWN_DESC: "A Groenlândia, a maior ilha da Terra, permanece um território autônomo dentro do Reino da Dinamarca, tendo conquistado a autonomia em 1979. Sua pequena população, dispersa ao longo de uma costa livre de gelo, depende fortemente da indústria pesqueira e de uma verba anual proveniente de Copenhague.\n\nSob o gelo jazem vastas reservas inexploradas de minerais e petróleo, e o aquecimento global poderá um dia torná-las acessíveis. À medida que os apelos por maior autonomia se intensificam, a Groenlândia enfrenta uma questão crucial: conseguirá trilhar um caminho rumo à verdadeira independência, ou o custo da autossuficiência a manterá atrelada à coroa dinamarquesa?"
 NRY_MODERN_DAY_DESC: "Norway voted against joining the European Union in 1994 and has subsequently stayed distant from Europe to a certain extent. Nonetheless, the country remains a NATO member and shares a short but critical border with the Russian Federation, a powerful neighbor that it must necessarily be wary of."
 NRY_MILLENNIUM_DAWN_DESC: "A Noruega votou contra a adesão à União Europeia em 1995 e, desde então, tem se mantido distante da Europa até certo ponto. Ainda assim, o país permanece membro da OTAN e compartilha uma fronteira curta, porém crucial, com a Federação Russa, um vizinho poderoso do qual precisa necessariamente se manter cautelosa."
 SIA_MILLENNIUM_DAWN_DESC: "Três anos após o colapso do baht ter abalado as economias do Sudeste Asiático, a Tailândia está se recuperando do pacote de resgate do FMI sob a liderança tecnocrata dos Democratas de Chuan Leekpai. A austeridade estabilizou a moeda, mas não o interior do país, onde o bilionário das telecomunicações Thaksin Shinawatra e seu novo partido, o Thai Rak Thai, estão construindo uma máquina política que nenhum governo atual conseguiu enfrentar.\n\nUma jovem democracia está encontrando seu caminho sob a constituição reformista de 1997, e as instituições mais antigas observam atentamente seus passos. As escolhas da próxima década decidirão se a recuperação se manterá e quem falará em nome da Tailândia quando isso acontecer."