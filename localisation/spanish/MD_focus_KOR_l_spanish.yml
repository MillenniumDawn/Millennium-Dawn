 KOR_naturalized_citizens_serve: "Requisito de Servicio para Ciudadanos Naturalizados"
 KOR_naturalized_citizens_serve_desc: "A partir de ahora, los ciudadanos coreanos naturalizados nacidos en el extranjero deberán servir en el ejército. Si bien esto ha ayudado a contrarrestar la reducción de reclutas debido a la disminución de la población de Corea, ha disuadido a los extranjeros de adquirir la ciudadanía coreana."
