 TT_ALG_US_PROTECTION_REQ: "[Western_Autocracy_L] debe ser el partido gobernante"
 TT_ALG_DIRECT_DEM_REQ: "Deberíamos haber concedido la ciudadanía a los kurdos para que propaguen los ideales de la democracia directa en la región"
 TT_ALG_KICKING_ASSADS_EFFECT: "Inclusión política alauita: §R-40%§!"
 TT_ALG_REPUBLICANISM_FOCUS_EFFECT: "Para cada comunidad étnica y religiosa importante en Argelia elegiremos entre reservar escaños en el parlamento para políticos que representen a dichas comunidades (lo que aumenta la inclusión de las minorías a cambio de un mayor coste de corrupción) o no hacerlo (lo que provocará disturbios y daños a la propiedad en sus regiones cada vez que su inclusión política caiga por debajo del §Y50%§!)."
 TT_ALG_FEDERALISM_FOCUS_EFFECT: "Para cada comunidad étnica y religiosa importante en Argelia elegiremos entre otorgarles una semiautonomía (aumentando su inclusión política a cambio de una reducción en la extracción de recursos, la velocidad de construcción y las casillas de construcción, además de aumentar el coste para cambiar las leyes gubernamentales de forma inversamente proporcional a la inclusión política de la comunidad) o liberar la región por completo como un estado autónomo."
 TT_ALG_DIRECT_DEMOCRACY_REQ: "Para que nuestra democracia directa funcione, el Estado debe ser laico y la amenaza terrorista debe dejar de existir, además de pacificar a la sociedad de los ideales salafistas radicales."
 TT_ALG_SECULARIZE_CONSTITUTION: "Dependiendo de las reformas y políticas adoptadas, nos convertiremos en una democracia liberal o en una democracia iliberal."
 TT_ALG_ALLY_FARMERS: "Los agricultores se unirán a nosotros como una facción interna en nuestra lucha."
 TT_ALG_ALLY_INDUSTRIALISTS: "Los conglomerados industriales se unirán a nosotros como una facción interna en nuestra lucha."
 TT_ALG_ALLY_ULEMA: "Los ulemas se unirán a nosotros como una facción interna en nuestra lucha."
 TT_ALG_ALLY_INTL_BANKERS: "Los banqueros internacionales se unirán a nosotros como una facción interna en nuestra lucha."
 TT_ALG_AGRICULTURAL_INVESTMENT_EFFECT: "Invertir en agricultura varias veces permitirá que surjan nuevos mercados y empresas para vender los productos. Sin embargo, el número de inversiones necesarias para que broten estos nuevos negocios está influenciado por el nivel de corrupción."
 ALG_GOVERNMENT_EXPANSION_FOCUS_EFFECT: "§YWe will invite a party to coalition. The party will greatly benefit us in partaking in its respective cause whether it's Centralization or Decentralization during the statebuilding balance of power process§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_REP_EFFECT: "§CTener a este partido en la coalición nos beneficiará enormemente en la centralización durante el proceso de equilibrio de poder en la construcción del Estado.§!"
 ALG_GOVERNMENT_EXPANSION_EVENT_FED_EFFECT: "§GTener a este partido en la coalición nos beneficiará enormemente en la descentralización durante el proceso de equilibrio de poder en la construcción del Estado.§!"
 ALG_FINDING_PROMISING_BUREAUCRACY_EFFECTS: "Si tiene éxito, ganaremos §G75§! de poder político y la idea §YBurócratas prometedores§!, que otorga §G+0.5§! de §Yganancia diaria de poder político§! y §G+0.2§! de §Yvelocidad de construcción§! durante §Y100§! días."
 ALG_STATE_DECISION_MAKING_SUCCESS_EFFECTS: "Si tiene éxito, ganaremos §G5%§! de estabilidad."
 ALG_LOCAL_ACCOUNTABILITY_SUCCESS_EFFECTS: "Si tiene éxito, ganaremos §G10%§! de popularidad de partido y reduciremos la corrupción."
 ALG_FUND_VOLUNTARY_ORGANIZATIONS_SUCCESS_EFFECTS: "Si tiene éxito, reduciremos la corrupción y ganaremos §YAuge de organizaciones voluntarias§!, lo que otorga §G0.2§! de ganancia diaria de poder político y §G+30%§! de velocidad de construcción durante §Y100§! días."
 ALG_ENCOURAGE_ECONOMIC_SELF_RELIANCE: "Si tiene éxito, aumentaremos nuestro ciclo de crecimiento económico."
 TT_ALG_KURDS_WITHOUT_CITIZENSHIPS_PARTY_FORMATION: "§GUna vez eliminados al otorgar la ciudadanía a los kurdos tras expulsar a los Asad, formarán un partido político que buscará transformar a Argelia en una federación.§!"
 ALG_ECONOMIC_DECISIONS_ONE_FREE_FACTORIES_EXPLANATION: "§RDebe haber al menos un complejo industrial disponible pero no asignado a la construcción. Cancela cualquier construcción que hayas asignado o espera a que termine y quede disponible.§!"
 ALG_ECONOMIC_DECISIONS_TWO_FREE_FACTORIES_EXPLANATION: "§RDebe haber al menos dos complejos industriales disponibles pero no asignado a la construcción. Cancela cualquier construcción que hayas asignado o espera a que termine y quede disponible.§!"
 ALG_ECONOMIC_DECISIONS_THREE_FREE_FACTORIES_EXPLANATION: "§RDebe haber al menos tres complejos industriales disponibles pero no asignado a la construcción. Cancela cualquier construcción que hayas asignado o espera a que termine y quede disponible.§!"
 ALG_FEDERAL_FORMATION_TOOLTIP: "Si todos los valores de inclusión de minorías están al §Y50%§! o más, se formará la §GFederación Argelina§!."
 ALG_UNITARY_FORMATION_TOOLTIP: "Si todos los valores de inclusión de minorías están al §Y50%§! o más, se formará la §CRepública Argelina§!."
 ALG_tech_name: "Bonificación tecnológica"
 TT_ALG_CORRUPTION_COSTS: "Cuanto más corruptas sean nuestras instituciones, más costosas serán nuestras inversiones."
 ALG_algeria_invite_ciw: "§C¡Invitaremos a todas las naciones islámicas a la CIW!§!"
 dyn_ALG_tt: "¡El efecto de este enfoque depende de la perspectiva del gobierno argelino!"
 ALG_islamist_opposition_victory: "Gobierno de la oposición islamista"
 ALG_islamist_opposition_victory_desc: "The islamist opposition coalition has won the elections and will be tasked with leading Algeria into becoming a conservative islamic republic"
 ALG_islamist_renaissance: "Renacimiento islamista"
 ALG_islamist_renaissance_desc: "Nuestra victoria ha envalentonado nuestro apoyo entre las masas. Ha evolucionado una nueva cultura y estamos totalmente a favor de respaldarla."
 ALG_empower_sharia_courts: "Empoderar a los tribunales de la Sharía"
 ALG_empower_sharia_courts_desc: "It's time to empower the islamic judiciary and expand its influence"
 ALG_turkish_inspired_islamism: "Islamismo de inspiración turca"
 ALG_turkish_inspired_islamism_desc: "We will draw inspiration from the islamist movements that took place in Turkey after the establishment of their republic. This will paint our movement in a more favorable light for now and may attract turkish conservative businessmen into investing in our country."
 ALG_deregulate_economy: "Economía desregulada"
 ALG_deregulate_economy_desc: "Para empoderar a las clases medias y a los comerciantes de los que obtenemos gran parte de nuestro apoyo, reduciremos las restricciones sobre ellos y les proporcionaremos el espacio necesario para su crecimiento."
 ALG_moderate_conservatism: "Conservadurismo moderado"
 ALG_moderate_conservatism_desc: "Eliminaremos a los elementos extremistas de nuestras filas y remodelaremos nuestra imagen como una fuerza de conservadurismo que no tiene nada que ver con el fanatismo religioso."
 ALG_religious_values: "Nuestros valores inquebrantables"
 ALG_religious_values_desc: "It might be that our previous policies to appease the populace and soften our image has allowed us to stray from the true values our ideals are built upon. We care less for what others view us and our only goal is to establish sharia in our lands no matter how unpopular that may be"
 ALG_religious_economic_charity: "Donaciones religiosas"
 ALG_religious_economic_charity_desc: "Nuestros movimientos siempre han estado asociados con organizaciones benéficas y fundaciones que han sido beneficiosas para nuestras comunidades. Ahora que tenemos una posición más destacada, las institucionalizaremos aún más para aliviar nuestras cargas económicas."
 ALG_qatari_support: "Apoyo qatarí"
 ALG_qatari_support_desc: "Hemos atraído el interés de varios inversores qataríes."
 ALG_flourishment_of_central_economy: "Desarrollar centros urbanos"
 ALG_flourishment_of_central_economy_desc: "Nuestra base de apoyo proviene principalmente de varias regiones urbanas y deberíamos empezar a desarrollarlas para consolidar el apoyo de su población."
 ALG_turkish_investments: "Inversiones turcas"
 ALG_turkish_investments_desc: "Hemos atraído a una gran cantidad de inversores turcos gracias a nuestras políticas de desregulación, así como a nuestras similitudes ideológicas con ellos."
 ALG_reverse_secularization: "Revertir la laicización"
 ALG_arm_palestinians_to_fight: "Armar a los palestinos"
 ALG_arm_palestinians_to_fight_desc: "Jordania alberga a una gran población de refugiados palestinos. Podemos convertir a estos refugiados en combatientes e incitarlos a causar estragos en Palestina e Israel. Dado que son combatientes por delegación (proxies), podemos utilizarlos para provocar la represalia de Israel, haciendo que parezcan los malos del conflicto."
 ALG_zionist_threat: "La amenaza sionista"
 ALG_zionist_threat_desc: "Israel es la mayor afrenta para todos los musulmanes y un estado falso abominable en el corazón del Islam. Deben ser borrados de la faz de la tierra."
 ALG_help_sahara: "Nuestros amigos saharianos"
 ALG_help_sahara_desc: "We are in contact with many movements that support our pan-Arabist cause, one such movement is the Polisario Front, which seeks to liberate the people of Northern Sahara. For the past century the Polisario fought colonial and then Moroccan oppression and now the Front controls only a small area of the Western Sahara. For the moment the conflict is frozen, but we can change that by sending our friends military aid and equipping the Sahrawi with everything they need to continue their struggle."
 algeria.42.t: "¡Apoyo de armamento de [FROM.GetName]!"
 algeria.42.d: "¡Nos han enviado armas!"
 algeria.42.a: "Excelente"
 algeria.43.t: "¡Argelia presenta una protesta diplomática!"
 algeria.43.d: "El presidente argelino, Abderrazak Makri, ha emitido una protesta diplomática contra nuestro gobierno. Afirma que somos terroristas y que la comunidad internacional debe iniciar una operación especial para liquidar nuestro régimen."
 algeria.43.a: "Que te jod**, Makri"
 ALG_support_fsa: "Apoyar al ELS"
 ALG_support_fsa_desc: "Nuestras relaciones con Siria tienen una larga historia. Ahora, las relaciones deben definirse por su vínculo con la ideología de los Hermanos Musulmanes."
 ALG_brotherhood_diplo: "Diplomacia de la Hermandad"
 ALG_brotherhood_diplo_desc: "Debemos reformar nuestra diplomacia de acuerdo con nuestro nuevo gobierno."
 ALG_hamas_under_wing: "Hamás bajo nuestra ala"
 ALG_hamas_under_wing_desc: "Hamas is a group of freedom fighters located in the Gaza strip that are associated with Muslim Brotherhood. Helping them is our duty!"
 algeria.44.t: "Hamás toma el control de Gaza"
 algeria.44.d: "Hamas, with support from Algeria, has taken control of the Gaza strip. Their armed militias took control of government buildings, and their spokesperson [HAM.GetLeader] has stated that the group is getting ready to march to liberate the Al-Aqsa Mosque"
 algeria.44.a: "Maldición"
 ALG_letter_isr: "Manipulación israelí"
 ALG_letter_isr_desc: "Oh, Israel! Time has come to decide what to do with you."
 MSP_letter_isr: "Manipulación israelí"
 MSP_letter_isr_desc: "¡Oh, Israel! Ha llegado el momento de decidir qué hacer contigo."
 ALG_und_supp_hamas: "Apoyo encubierto a Hamás"
 ALG_und_supp_hamas_desc: "Para que la causa de Hamás tenga éxito, debemos apoyarlos materialmente."
 ALG_org_of_isl_coop: "Organización de Cooperación Islámica"
 ALG_org_of_isl_coop_desc: "La Organización de Cooperación Islámica, anteriormente Organización de la Conferencia Islámica, es una organización intergubernamental fundada en 1969 que consta de 57 estados miembros, siendo 48 de ellos países de mayoría musulmana."
 MSP_und_supp_hamas: "Apoyo encubierto a Hamás"
 MSP_und_supp_hamas_desc: "Para que la causa de Hamás tenga éxito, debemos apoyarlos materialmente."
 MSP_org_of_isl_coop: "Organización de Cooperación Islámica"
 MSP_org_of_isl_coop_desc: "La Organización de Cooperación Islámica, anteriormente Organización de la Conferencia Islámica, es una organización intergubernamental fundada en 1969 que consta de 57 estados miembros, siendo 48 de ellos países de mayoría musulmana."
 algeria.49.t: "Argelia pide la liberación de Omar Abdel-Rahman"
 algeria.49.d: "In su carta, Makri mencionó brevemente que nos pide liberar a Omar Abdel-Rahman, condenado por el atentado de 1993 contra el World Trade Center en la ciudad de Nueva York, junto con los numerosos egipcios que fueron arrestados durante la revolución. Un portavoz de los Hermanos Musulmanes dijo más tarde que la extradición se propone por razones humanitarias y que Makri no tenía la intención de revocar las condenas penales de Abdel-Rahman."
 algeria.49.a: "¿Acaso Makri está loco?"
 algeria.49.b: "Uf... ¿de acuerdo?"
 ALG_supp_plo: "Apoyar a la OLP"
 ALG_supp_plo_desc: "La Organización para la Liberación de Palestina (OLP) ha sido durante mucho tiempo un actor clave en la lucha por la autodeterminación palestina. Apoyar a la OLP podría reforzar nuestra posición ante los aliados internacionales y promover una resolución pacífica al conflicto."
 ALG_the_pal_issue: "La causa palestina"
 ALG_the_pal_issue_desc: "La cuestión de Palestina sigue siendo un asunto fundamental en nuestra política exterior. Nuestra postura sobre la lucha palestina definirá nuestras alianzas internacionales e influencia en la región. Debemos decidir cómo abordar este conflicto en curso."
 ALG_supp_hamas: "Apoyar a Hamás"
 ALG_supp_hamas_desc: "Hamás representa una facción significativa dentro de la resistencia palestina. Al proporcionarles apoyo, podemos fortalecer nuestros lazos con este grupo, mejorando nuestra influencia en la región y alineándonos con su lucha."
 ALG_Get_rid_of_military_corrupt: "Purgar a los corruptos del ejército"
 ALG_Get_rid_of_military_corrupt_desc: "El ejército está atrincherado en nuestras instituciones y representa una clara amenaza para el futuro de nuestro país. Los arrestaremos bajo cargos de corrupción y confiscaremos las propiedades que podamos asegurar."
 idea_algerian_oligarchy_arrests: "Purga militar"
 ALG_the_coalition: "La coalición"
 ALG_the_coalition_desc: "Tras restablecer los partidos políticos, han surgido dos fuerzas notables. Una aboga por federalizar el Estado y otorgar más poder a las provincias, mientras que la otra aboga por afianzar la autoridad centralizada y mantener una república centralizada y unida. Tendremos que elegir con cuidado con quién alinearnos."
 ALG_dismantle_the_military: "Desmantelar el presupuesto militar"
 ALG_dismantle_the_military_desc: "Gran parte del PIB de defensa ha sido malversado y dirigido hacia proyectos inútiles debido a la corrupción arraigada dentro de las instituciones de nuestras fuerzas armadas. Reutilizaremos y venderemos mucho de lo que podamos asegurar y, aunque esto pueda debilitar a nuestro ejército y hacernos propensos a las amenazas, es un paso necesario hacia la recuperación económica y la erradicación de la corrupción."
 ALG_empower_institutions: "Empoderar las instituciones"
 ALG_empower_institutions_desc: "Nuestras instituciones son muy débiles y están marginadas. Esto se debe a que el poder se concentra en el presidente y se le otorga poco poder al parlamento, además de unos medios estatales controlados que fomentan una atmósfera que restringe las libertades personales. Redactar una nueva constitución que garantice la distribución del poder y la liberalización es un paso crucial hacia el futuro."
 ALG_western_supported_economic_relief: "Ayuda occidental"
 ALG_western_supported_economic_relief_desc: "Nuestros ideales se alinean con los de Occidente e incluso nos han permitido establecer nuestros partidos en sus países. Entablaremos lazos con ellos y solicitaremos ayuda a cambio de ventajas económicas."
 ALG_liberalize_society: "Liberalizar la sociedad"
 ALG_liberalize_society_desc: "La población es ajena a los valores de la libertad y la igualdad. Deberíamos trabajar para animarles a valorar sus libertades."
 ALG_scientific_ventures: "Proyectos científicos"
 ALG_scientific_ventures_desc: "Al apoyar becas y actualizar nuestros planes de estudio escolares obsoletos, seremos capaces de hacer avanzar el sector científico del país."
 Algeria_student_exchanges: "Intercambios de estudiantes"
 ALG_banish_authoritarian_influence: "Desterrar la influencia autoritaria"
 ALG_banish_authoritarian_influence_desc: "Muchos estados autoritarios como Irán y Rusia han tenido una gran presencia aquí. Ahora que somos un estado libre, es hora de poner fin a su influencia en nuestras instituciones y economía."
 ALG_democratic_socialism: "Socialismo democrático"
 ALG_democratic_socialism_desc: "El ruinoso estado económico de nuestro país ha dejado a nuestra población bastante pobre y subdesarrollada. Reducir las restricciones a las empresas introducirá la explotación y la competencia desleal, ya que la desigualdad económica sigue estando muy extendida en nuestra nación. Lo que necesitamos es centrarnos en fomentar nuevas empresas en el país y concederles subvenciones para permitir un amplio desarrollo económico del que puedan disfrutar todas las clases de ciudadanos."
 ALG_unleash_economic_potential: "Desatar el potencial económico"
 ALG_unleash_economic_potential_desc: "Tenemos un gran potencial para convertirnos en una potencia económica. Podemos animar a los inversores y empresas extranjeras a establecer sociedades aquí y, aunque esto someta a nuestra población a convertirse en mano de obra barata, será nuestro gran salto hacia el desarrollo económico."
 ALG_domestic_investments: "Inversiones nacionales"
 ALG_domestic_investments_desc: "Se están creando muchas empresas nacionales jóvenes. Invertiremos en ellas para apoyar su camino hacia la prosperidad económica."
 ALG_subsidize_local_firms: "Empresas locales"
 ALG_subsidize_local_firms_desc: "Gracias a nuestras políticas, las empresas locales están siendo reconocidas por su éxito. Es hora de invertir en ellas."
 ALG_economic_democracy: "Igualdad económica"
 ALG_economic_democracy_desc: "Nuestro desarrollo económico ha llegado a personas de todos los ámbitos económicos al abordar la desigualdad financiera e incluso ha dado lugar a exitosas empresas nacionales. Esto es algo de lo que deberíamos estar orgullosos."
 ALG_federalisation: "Federalización"
 ALG_federalisation_desc: "La solución es dar más poder a las provincias. Esto fomentará enormemente la representación local y la inclusión, y remediará en gran medida los temores y las tensiones sectarias. Sin embargo, esta autonomía debilitará nuestro control sobre los territorios, especialmente allí donde las minorías estén presentes."
 ALG_algerian_investments: "Inversiones de la diáspora"
 ALG_algerian_investments_desc: "Gracias a nuestras políticas favorables a la economía, hemos atraído inversiones de la diáspora argelina que vive en el extranjero."
 ALG_invite_US_business_giants: "Invitar a gigantes empresariales"
 ALG_invite_US_business_giants_desc: "Aunque hemos permitido que nuestra economía prospere, esto no es suficiente. Invitaremos a corporaciones gigantes de los EE. UU. a establecer franquicias en el país para fomentar el consumismo."
 ALG_republicanism: "Republicanismo"
 ALG_republicanism_desc: "Argelia se gobierna mejor como un Estado fuerte con una autoridad centralizada. Esto reforzará el dominio de nuestro gobierno, pero causará alienación y enojo entre las minorías que se sienten marginadas."
 ALG_address_ethnic_divides: "Resolver divisiones étnicas"
 ALG_address_ethnic_divides_desc: "Nuestro país siempre ha estado dividido y plagado de sectarismo. Deberíamos decidir cómo abordar estos problemas."
 ALG_EU_investments: "Inversiones de la UE"
 ALG_EU_investments_desc: "Varios países europeos buscan invertir en nuestro país."
 ALG_student_exchanges: "Intercambios de estudiantes"
 ALG_student_exchanges_desc: "Fomentaremos la concesión de becas en países extranjeros para mejorar nuestra educación y mantenerla a la par de los estándares globales."
 ALG_democratic_victory: "Victoria democrática"
 ALG_democratic_victory_desc: ""
 ALG_new_era: "Una nueva era"
 ALG_new_era_desc: "Se iniciará una nueva era para la región. Una era de paz y estabilidad, libre de opresión e injusticia."
 ALG_islamic_nato: "OTAN Islámica"
 ALG_islamic_nato_desc: "Aunque la OTAN nos proporciona seguridad, sus miembros han demostrado un desprecio absoluto por Oriente Medio. Si ellos no pueden proporcionar estabilidad y prosperidad, nosotros debemos asumir el mando. Formaremos nuestra propia alianza militar: la Organización del Tratado del Mediterráneo u OTM."
 ALG_invite_iraq: "Invitar a Irak"
 ALG_invite_iraq_desc: "Necesitamos invitar a Irak a nuestra alianza, ya que poco a poco están empezando a organizarse, y nos beneficiaríamos seriamente de la cooperación mutua."
 ALG_invite_syria: "Invitar a Siria"
 ALG_invite_syria_desc: "Tener a Siria justo al sur de nuestra nación significa que somos muy vulnerables. Invitar a Siria a nuestra facción sería una excelente manera de garantizar nuestra seguridad y protección."
 ALG_invite_algeria: "Invitar a Egipto"
 ALG_invite_algeria_desc: "Egipto es una potencia en auge y, con una población de su tamaño, nuestra alianza será capaz de lograr prácticamente cualquier cosa."
 ALG_assistance_to_bulgaria: "Asistencia a Bulgaria"
 ALG_assistance_to_bulgaria_desc: "Deberíamos ayudar a Bulgaria a desarrollar su infraestructura para que podamos realizar más inversiones más allá de sus fronteras con facilidad."
 ALG_islamic_economic_cooperation: "Cooperación económica islámica"
 ALG_islamic_economic_cooperation_desc: "Muchos países musulmanes nadan en dinero y lo utilizan para cosas sin sentido. Deberíamos formar una alianza económica para agrupar nuestros recursos en proyectos económicos comunes."
 ALG_msp_win: "§RNOTA§!: ¡§GESTE ENFOQUE DESBLOQUEARÁ EL ÁRBOL DE ENFOQUES DEL MSP! ESTE ÁRBOL SERÁ SOBREESCRITO§!"
 algeria_news.1.t: "Military Coup in Algeria!"
 algeria_news.1.d: "In a swift and unexpected turn of events, Algeria finds itself plunged into uncertainty as a military coup d'état unfolds, toppling the government of [ALG.GetLeader]. Amid escalating tensions between the ruling party and opposition factions, the Algerian military, led by General Ahmed Gaid Salah, seizes control of the state apparatus, suspending the constitution and detaining key political figures. The streets of Algiers erupt into scenes of jubilation and apprehension, reflecting the deep divisions within the nation over the military's intervention. The international community watches closely as Algeria's future hangs in the balance, with concerns mounting over the implications for democracy and stability in the region."
 algeria_news.1.a: "Interesante"
 algeria_news.2.t: "Argelia ante una encrucijada"
 algeria_news.2.d: "Tras casi una década de derramamiento de sangre e inestabilidad, Argelia se encuentra en una posición frágil e incierta. Las armas se han silenciado en muchas zonas, pero la paz está lejos de estar garantizada. La nación se encuentra ahora en una coyuntura crítica: ¿elegirá la reconciliación y la reforma, continuará bajo el estado de emergencia dirigido por el ejército o se colapsará una vez más en un nuevo conflicto? Los ojos del pueblo argelino y del mundo entero están fijos en lo que vendrá después."
 algeria_news.2.a: "Comienza la lucha por el futuro de Argelia"
 algeria_news.3.t: "Bouteflika asume la presidencia"
 algeria_news.3.d: "En abril de 1999, Abdelaziz Bouteflika fue elegido presidente de Argelia, devolviendo al país a un liderazgo civil formal tras años de crisis política. Aunque la guerra aún no ha terminado por completo, Bouteflika asume el cargo decidido a restaurar la estabilidad, reconstruir el Estado y guiar a Argelia hacia el nuevo milenio. Su programa de reconciliación y diálogo ha despertado esperanzas entre muchos argelinos, aunque persisten las dudas de si su presidencia podrá sanar verdaderamente las heridas de la Década Negra."
 algeria_news.3.a: "Comienza una nueva era bajo el mandato de Bouteflika"
 algeria_news.4.t: "Vence el plazo de la Concordia Civil"
 algeria_news.4.d: "El plazo de amnistía abierto por la Concordia Civil del presidente Bouteflika se ha cerrado. Miles de insurgentes han bajado de las montañas y han regresado a la vida civil, y el Ejército Islámico de Salvación se ha disuelto formalmente en lugar de seguir luchando. Los partidarios de la línea dura del Grupo Islámico Armado y el recién formado Grupo Salafista para la Predicación y el Combate rechazaron todas las ofertas y permanecen en el terreno. Quienes lo apoyan califican la Concordia como la mejor oportunidad para poner fin al derramamiento de sangre; los críticos responden que perdona a los perpetradores de las masacres sin ofrecer un ápice de justicia a sus víctimas."
 algeria_news.4.a: "Una oportunidad para pasar página a la Década Negra"
 algeria_news.5.t: "El FLN revive su legado revolucionario"
 algeria_news.5.d: "El presidente Bouteflika y el FLN han lanzado una campaña nacional para reforzar su legitimidad a través de la memoria de la Guerra de la Independencia. Los medios estatales y las escuelas glorifican ahora los sacrificios de los mártires, presentando al FLN como el guardián eterno de la soberanía de Argelia. Al mismo tiempo, el gobierno ha asegurado alianzas con otros partidos importantes, formando una coalición política para consolidar la autoridad y presentar un frente unido. Los críticos denuncian la campaña como propaganda oportunista, mientras que los partidarios la ven como el renacimiento del espíritu revolucionario de Argelia."
 algeria_news.5.a: "La revolución continúa a través de la unidad"
 algeria_news.5.b: "Ningún FLN debería gobernar en solitario"
 algeria_news.6.t: "Formación de la Alianza Presidencial"
 algeria_news.6.d: "Aprovechando su campaña del legado revolucionario, el FLN ha asegurado una coalición de gobierno conocida como la 'Alianza Presidencial'. El Frente de Liberación Nacional (FLN), la Agrupación Nacional para la Democracia (RND) y el Movimiento de la Sociedad por la Paz (MSP) han acordado coordinar políticas en apoyo al presidente Bouteflika. La alianza refuerza el control del bloque gobernante sobre el sistema político de Argelia, presentando un frente unido al público. Mientras que los partidarios aclaman esta coalición como un símbolo de estabilidad, las voces de la oposición advierten que Argelia corre el riesgo de deslizarse aún más hacia el dominio de un solo partido bajo una nueva apariencia."
 algeria_news.6.a: "Juntos salvaguardamos el futuro de Argelia"
 ALG_presidential_alliance: "§YEl FLN, el RND y el MSP han formado la Alianza Presidencial.§!\nEsta coalición aumenta la estabilidad del gobierno, pero consolida el dominio político bajo el bloque gobernante."
 algeria_news.7.t: "La crisis se reactiva"
 algeria_news.7.d: "Las promesas de reconciliación y reforma se han derrumbado en mentiras. El FLN y sus supuestos aliados en el RND y otros partidos democráticos no han logrado ofrecer la justicia y los derechos exigidos por el pueblo. Desilusionados con las promesas vacías, muchos se vuelven ahora hacia el Grupo Salafista para la Predicación y el Combate (GSPC), creyendo que solo la ley de Alá puede traer la verdadera justicia a Argelia. For ellos, la Sharía representa una ley superior, no corrompida por la codicia de los políticos, la traición de los Harkis o la influencia de las potencias extranjeras. Esta no es una guerra contra el pueblo argelino, sino contra los funcionarios corruptos y las élites respaldadas por el extranjero que les han robado su futuro. Se vislumbra una nueva guerra civil, una que decidirá el destino de Argelia de una vez por todas."
 algeria_news.7.a: "La ley de Alá guiará el futuro de Argelia"
 ALG_army_alliance: "Le Pouvoir se fortalece"
 ALG_strengthen_le_pouvoir: "Fortalecer Le Pouvoir"
 ALG_strengthen_le_pouvoir_desc: "La élite gobernante y el ejército consolidan el poder a expensas de las libertades políticas."
 ALG_resistance_challenges_new: "Las demandas del pueblo"
 ALG_resistance_challenges_new_desc: "El pueblo exige reformas en la sanidad, la educación y el empleo. Si no se abordan estas necesidades, aumentarán los agravios y Argelia se acercará más a la guerra civil."
 ALG_healthcare_reform: "Reformar el sistema sanitario"
 ALG_healthcare_reform_desc: "Los hospitales están masificados, los médicos mal pagados y la escasez de material médico es generalizada. Debemos actuar con rapidez."
 alg.310.t: "La reforma sanitaria tiene éxito"
 alg.310.d: "La inversión en hospitales y médicos ha devuelto cierta fe en el gobierno."
 alg.310.a: "Una pequeña victoria."
 alg.311.t: "Colapso sanitario"
 alg.311.d: "Los hospitales están desbordados, se rechaza a los pacientes y la corrupción corroe el sistema. La indignación estalla."
 alg.311.a: "Esto nos costará muy caro."
 ALG_education_reform: "Reformar el sistema educativo"
 ALG_education_reform_desc: "Nuestras escuelas y universidades están desactualizadas, y los graduados se enfrentan a un futuro sin empleo."
 alg.320.t: "La reforma educativa tiene éxito"
 alg.320.d: "La inversión en escuelas y universidades ha devuelto la esperanza a los estudiantes."
 alg.320.a: "Un futuro más brillante."
 alg.321.t: "Colapso de la educación"
 alg.321.d: "Las aulas masificadas, las universidades deficientes y la falta de oportunidades alimentan el descontento."
 alg.321.a: "La juventud se vuelve en nuestra contra."
 ALG_unemployment_reform: "Abordar la crisis del desempleo"
 ALG_unemployment_reform_desc: "La juventud de Argelia no tiene trabajo y está inquieta. Debemos invertir en industrias y en la creación de empleo o enfrentarnos a disturbios."
 alg.330.t: "El programa de empleo tiene éxito"
 alg.330.d: "Los nuevos empleos y las pequeñas industrias ofrecen esperanza a miles de jóvenes argelinos."
 alg.330.a: "Un paso adelante."
 alg.331.t: "La crisis del desempleo se profundiza"
 alg.331.d: "Las fábricas siguen paradas, los graduados vagan por las calles y las protestas se vuelven violentas."
 alg.331.a: "Esto no puede durar."
 alg.400.t: "El ejército acepta la derrota"
 alg.400.d: "El Ejército Nacional Popular ha perdido su control sobre la política. Con la presión pública en aumento y los oficiales poco dispuestos a arriesgarse a otra guerra sangrienta, los generales aceptan dar un paso a un lado en favor de un liderazgo civil."
 alg.400.a: "¡Gobierno civil por fin!"
 alg.401.t: "El ejército contraataca"
 alg.401.d: "Aunque las reformas comenzaron, el ejército sigue ostentando el poder real. Los altos generales interfieren en la política, desvían fondos y sabotean los intentos de transparencia. Argelia se desliza de nuevo hacia un gobierno en la sombra."
 alg.401.a: "Los generales corruptos permanecen en el poder."
 alg.402.t: "El pueblo se levanta en armas"
 alg.402.d: "Los agravios del pueblo argelino han llegado al límite. Sin estabilidad y con la confianza en las instituciones destruida, las protestas se convierten en una rebelión abierta. Argelia se enfrenta a otra guerra civil."
 alg.402.a: "La nación está desgarrada."
 ALG_resist_le_pouvoir: "Resistir a Le Pouvoir"
 ALG_resist_le_pouvoir_desc: "Durante décadas, la élite corrupta conocida como *Le Pouvoir* ha gobernado Argelia desde las sombras, utilizando al ejército como su puño de hierro. El pueblo está inquieto y, a menos que se aborden sus demandas, Argelia podría enfrentarse a otra tormenta. Elegir este camino abrirá la vía para la reforma o para el derramamiento de sangre."
 ALG_popular_salvation: "Movimiento de Salvación Popular"
 ALG_popular_salvation_desc: "De las cenizas de la desesperación surge un nuevo movimiento. Estudiantes, trabajadores y soldados desilusionados se unen para exigir un cambio. Que este movimiento pueda derrocar pacíficamente al antiguo orden o encender una guerra civil dependerá de cómo gestionemos las demandas del pueblo."
 ALG_popular_salvation_tt: "§YEste enfoque fortalece al movimiento de oposición, pero no garantiza una guerra civil. El resultado depende de cómo se gestionen las demandas del pueblo y la influencia del ejército.§!"
 ALG_restore_hope: "Restaurar la esperanza"
 ALG_restore_hope_desc: "En 1999, Abdelaziz Bouteflika llegó al poder prometiendo estabilidad y reconciliación tras la Década Negra. El pueblo lo ve como un símbolo de esperanza."
 ALG_charter_for_peace: "La Concordia Civil"
 ALG_charter_for_peace_desc: "Aprobada mediante referéndum en septiembre de 1999, la Concordia Civil ofrece la amnistía a cualquier insurgente que se rinda antes de que venza el plazo. El Ejército Islámico de Salvación ya ha respetado su alto el fuego; la cuestión es cuántos de los combatientes restantes lo seguirán bajando de las montañas."
 ALG_no_pres_alliance: "El FLN gobierna en solitario"
 ALG_no_pres_alliance_desc: "Bouteflika y el FLN rechazan las alianzas con otros partidos, imponiendo un dominio total sobre el sistema político de Argelia."
 ALG_le_pouvoir_in_the_shadows: "Le Pouvoir en las sombras"
 ALG_le_pouvoir_in_the_shadows_desc: "Aunque se celebran elecciones, el poder real lo ostenta la élite atrincherada. La corrupción se profundiza mientras los ciudadanos se muestran cada vez más inquietos."
 ALG_peace_charter: "La Concordia Civil"
 ALG_peace_charter_desc: "La amnistía de Bouteflika para los insurgentes que dejen las armas, destinada a mermar las filas de combatientes de la Década Negra en lugar de derrotarlos en el campo de batalla."
 ALG_fln_dominance: "Dominio del FLN"
 ALG_fln_dominance_desc: "El Front de Libération Nationale (FLN) continúa dominando el sistema político de Argelia. Su hegemonía limita el pluralismo político y fomenta el resentimiento entre los grupos de la oposición, aunque proporciona continuidad y control al régimen."
 ALG_only_FLN: "Sin alianza"
 ALG_only_FLN_desc: "El FLN gobernará en solitario, rechazando alianzas o coaliciones. Aunque esto consolida el poder, aísla aún más a las fuerzas de la oposición y arriesga un aumento del descontento público."
 ALG_pres_coa: "Alianza Presidencial"
 ALG_pres_coa_desc: "Para mantener la estabilidad, el FLN puede formar una coalición presidencial más amplia. Al incluir a partidos leales e independientes, el gobierno gana legitimidad sin renunciar a su dominio."
 ALG_nationalize_privatized_industries: "Nacionalizar industrias privatizadas"
 ALG_nationalize_privatized_industries_desc: "Las privatizaciones neoliberales de la década de 1990 debilitaron la soberanía de Argelia. Al renacionalizar industrias clave, el Estado puede recuperar el control sobre los sectores estratégicos."
 ALG_sonatrach_expansion: "Expansión de Sonatrach"
 ALG_sonatrach_expansion_desc: "Sonatrach, la empresa energética estatal de Argelia, es la columna vertebral de nuestra economía. Ampliar su capacidad y alcance reforzará los ingresos del Estado y la influencia de Argelia en los mercados energéticos mundiales."
 ALG_the_cult_of_bouteflika: "El culto a Bouteflika"
 ALG_the_cult_of_bouteflika_desc: "Los partidarios del presidente Bouteflika están construyendo un culto a la personalidad en torno a su liderazgo. A través de redes leales y propaganda, su entorno consolida su dominio sobre la política argelina, incluso mientras la corrupción y el clientelismo se profundizan."
 ALG_cult_of_bouteflika: "El entorno de Bouteflika"
 ALG_cult_of_bouteflika_desc: "Rodeado de un entorno leal pero profundamente corrupto, el círculo íntimo de Bouteflika controla los resortes del poder. Su influencia garantiza la estabilidad del régimen, pero afianza el nepotismo y reduce la transparencia en la gobernanza."
 ALG_oppose_ffs_and_rcd: "Prohibir el FFS y el RCD"
 ALG_oppose_ffs_and_rcd_desc: "El Frente de Fuerzas Socialistas (FFS) y la Agrupación por la Cultura y la Democracia (RCD) desafían la hegemonía del FLN. Al prohibirlos, el régimen elimina las voces de la oposición, pero arriesga exacerbar la disidencia, particularmente en Cabilia."
 ALG_smaller_state: "Estado más reducido"
 ALG_smaller_state_desc: "El hipertrofiado Estado argelino es ineficiente y costoso. Reducir su tamaño y descentralizar la autoridad podría mejorar la eficiencia, aunque las élites atrincheradas se resistirán a tales reformas."
 ALG_fight_bloated_bureaucracy: "Combatir la burocracia desmesurada"
 ALG_fight_bloated_bureaucracy_desc: "Las capas de burocracia asfixian la gobernanza argelina. Una campaña para optimizar la administración pública reducirá la corrupción y acercará los servicios a los ciudadanos."
 FLN_parties_corruptions: "Corrupción en nuestros partidos"
 FLN_parties_corruptions_desc: "La corrupción se ha filtrado en el FLN y sus partidos aliados. Denunciar y abordar esta corrupción es vital si el régimen espera recuperar la credibilidad."
 ALG_elite_control: "Control de la élite"
 ALG_elite_control_desc: "Una red de magnates empresariales, líderes de partidos y oficiales militares conocida como 'Le Pouvoir' gobierna Argelia desde las sombras."
 ALG_military_coup: "Golpe militar"
 ALG_military_coup_desc: "El ejército ha decidido poner fin al liderazgo civil y hacerse con el poder directamente, prometiendo orden pero trayendo miedo."
 ALG_suspend_democracy: "Suspender la democracia"
 ALG_suspend_democracy_desc: "Se disuelve el parlamento, se cancelan las elecciones y los generales gobiernan Argelia."
 ALG_repression_campaign: "Campaña de represión"
 ALG_repression_campaign_desc: "El ENP utiliza métodos brutales de la Década Negra para aplastar la disidencia, a costa de la indignación internacional."
 ALG_black_market_rises: "El mercado negro florece"
 ALG_black_market_rises_desc: "La corrupción y la escasez crean un floreciente mercado negro que socava la economía oficial."
 ALG_expand_the_pna: "Expandir el ENP"
 ALG_expand_the_pna_desc: "El ejército se amplía, se moderniza y se fortalece para garantizar la supervivencia del régimen."
 ALG_africas_strongest_army: "El ejército más fuerte de África"
 ALG_africas_strongest_army_desc: "Argelia posee ahora las fuerzas armadas más fuertes del continente, una fuerza a tener en cuenta."
 ALG_global_power_projection: "El HCS resurge"
 ALG_global_power_projection_desc: "Con los militares ostentando de nuevo el poder indiscutible, Argelia se reafirma tanto en casa como en el extranjero. Evocando el dominio de la era del HCS de la década de 1990, nuestra nación se mantiene firme, inquebrantable y lista para proyectar su influencia mucho más allá de sus fronteras. El mundo recordará la fuerza de la determinación argelina."
 ALG_army_reform: "Reforma del ejército"
 ALG_army_reform_specops: "Reforma del ejército"
 ALG_army_reform_specops2: "Reforma del ejército"
 ALG_army_reform_specops3: "Reforma del ejército"
 ALG_army_reform_specops4: "Reforma del ejército"
 ALG_military_quality_initiative: "Iniciativa de calidad militar"
 ALG_military_quality_initiative2: "Iniciativa de calidad militar"
 ALG_army_reform_mass_army: "Reforma del ejército"
 ALG_army_reform_mass_army2: "Reforma del ejército"
 ALG_army_reform_mass_army3: "Reforma del ejército"
 ALG_army_reform_mass_army4: "Reforma del ejército"
 ALG_military_expansion: "Expansión militar"
 ALG_military_expansion2: "Expansión militar"
 ALG_foreign_arms_companies: "Empresas de armas extranjeras"
 ALG_future_army: "El ejército del futuro"
 ALG_air_reform: "Reforma aérea"
 ALG_air_reform2: "Reforma aérea"
 ALG_air_reform3: "Reforma aérea"
 ALG_air_reform4: "Reforma aérea"
 ALG_naval_reform: "Reforma naval"
 ALG_naval_reform2: "Reforma naval"
 ALG_naval_reform3: "Reforma naval"
 ALG_naval_reform4: "Reforma naval"
 ALG_shipbuilding: "Construcción naval argelina"
 ALG_shipbuilding2: "Construcción naval argelina"
 ALG_resist_le_pouvoir_system_tt: "§YNuevo sistema desbloqueado: Demandas del pueblo e Influencia del ejército§!\n\n- Las §ODemandas del pueblo§! miden el descontento popular. Aumentarán si se descuidan el empleo, la educación o la sanidad.\n- Si las demandas crecen demasiado, pueden estallar protestas masivas o una guerra civil.\n\n- La §OInfluencia del ejército§! registra el papel de los militares en la política. Debilitarla mediante reformas puede permitir una transición pacífica, pero si su influencia crece, el ejército puede suprimir la democracia y endurecer su control.\n\nDebes equilibrar la reforma, la estabilidad y el poder de los militares para sobrevivir en este camino."
 ALG_reactioners: "Economía de clústeres"
 ALG_reactioners1: "Economía de clústeres"
 ALG_reactioners2: "Economía de clústeres"
 ALG_reactioners3: "Economía de clústeres"
 ALG_reactioners4: "Economía de clústeres"
 ALG_reactioners5: "Economía de clústeres"
 ALG_reactioners6: "Economía de clústeres"
 ALG_reactioners7: "Economía de clústeres"
 ALG_automobile_industry: "Desarrollar la industria automotriz"
 ALG_automobile_industry_desc: "Argelia ha dependido durante mucho tiempo de las importaciones para satisfacer sus necesidades de automoción. Al desarrollar una industria automotriz nacional, podemos crear puestos de trabajo, reducir las importaciones y establecer a Argelia como un centro de fabricación regional."
 ALG_peugeot_deal: "Inversión de Peugeot"
 ALG_peugeot_deal_desc: "Peugeot ha expresado interés en abrir una planta en Argelia. Esta asociación podría proporcionarnos una capacidad industrial muy necesaria."
 ALG_renault_oran: "Renault en Orán"
 ALG_renault_oran_desc: "Renault está dispuesta a establecer su producción en Orán, proporcionando un flujo constante de vehículos e impulsando nuestra economía."
 ALG_hyundai_tiaret: "Hyundai en Tiaret"
 ALG_hyundai_tiaret_desc: "La surcoreana Hyundai está lista para establecer una asociación en Tiaret, creando empleos y reduciendo nuestra dependencia de los fabricantes europeos."
 ALG_volkswagen_relizane: "Volkswagen en Relizane"
 ALG_volkswagen_relizane_desc: "Volkswagen y sus marcas asociadas (Skoda, Audi, Seat) están preparadas para abrir una planta en Relizane, diversificando aún más nuestra base industrial."
 ALG_bmw_deal: "Asociación con BMW"
 ALG_bmw_deal_desc: "La alemana BMW ha mostrado interés en ensamblar vehículos de lujo y gama alta en Argelia, elevando nuestra industria automotriz a los estándares internacionales."
 ALG_mercedes_trucks: "Camiones Mercedes"
 ALG_mercedes_trucks_desc: "Al trabajar con Daimler, podemos ensamblar camiones militares y vehículos pesados de Mercedes en Argelia, apoyando directamente a nuestras fuerzas armadas."
 ALG_auto_scandal: "Escándalo de corrupción automotriz"
 ALG_auto_scandal_desc: "Las revelaciones han dejado al descubierto que la industria de ensamblaje de automóviles de Argelia es una farsa plagada de corrupción, donde se malversan los subsidios y las fábricas apenas hacen algo más que volver a ensamblar kits importados. El escándalo tendrá graves repercusiones políticas y económicas."
 ALG_import_ban: "Prohibir la importación de automóviles"
 ALG_import_ban_desc: "En un esfuerzo por proteger nuestra industria nacional, prohibiremos la importación de la mayoría de los coches extranjeros. Esta medida es controvertida y creará tensiones económicas a corto plazo."
 ALG_fiat_deal: "Acuerdo de inversión con Fiat"
 ALG_fiat_deal_desc: "Fiat ha ofrecido regresar a Argelia con un complejo industrial moderno, prometiendo reiniciar la producción y restaurar la confianza pública en nuestro sector automotriz."
 ALG_indigenous_brand: "Crear una marca nacional"
 ALG_indigenous_brand_desc: "En lugar de depender de empresas extranjeras, Argelia debería crear su propio fabricante de automóviles nacional, diseñado y construido localmente por argelinos."
 ALG_auto_exports: "Exportar automóviles argelinos"
 ALG_auto_exports_desc: "Con una industria automotriz nacional estable, ahora podemos mirar hacia afuera y comenzar a exportar vehículos de fabricación argelina a los mercados africanos y mediterráneos."
 alg.1000.t: "Escándalo de corrupción en la industria automotriz"
 alg.1000.d: "Un escándalo masivo de corrupción ha sacudido al sector automotriz de Argelia. Las investigaciones revelaron que muchas de las llamadas 'fábricas' eran meras plantas de reensamblaje que abusaban de los subsidios estatales e inflaban los costes. La confianza pública se está desmoronando y la industria se enfrenta a la parálisis."
 alg.1000.a: "Una humillación nacional."
 ALG_tebboune_tt: "Abdelmadjid Tebboune se convierte en presidente de Argelia tras las protestas del Hirak en 2019. La conocida «Banda» de políticos corruptos, incluidos Ahmed Ouyahia, Abdelmalek Sellal, Ali Haddad y Mahieddine Tahkout, son arrestados y se enfrentan a la justicia. Esto marca el comienzo de una nueva era, aunque muchos dudan de la profundidad real de las reformas."
 ALG_corruption_network: "El entorno de Bouteflika"
 ALG_corruption_network_desc: "Una red corrupta de políticos y empresarios, incluidos Ouyahia, Sellal y Tahkout, domina la política argelina. Su influencia debilita al Estado y aviva la indignación pública."
 ALG_cleaning_the_state: "Saneamiento del Estado"
 ALG_clean_government: "Gobierno limpio"
 ALG_political_repression: "Represión política"
 ALG_military_junta: "Junta militar"
 ALG_cleaning_the_state_desc: "Con la caída del entorno, Argelia está dando por fin los pasos necesarios para purgar la corrupción de sus instituciones y restaurar la confianza del pueblo."
 algeria_reforms.1.t: "Reformas bajo el mandato de Tebboune"
 algeria_reforms.1.d: "Tras la dimisión de Abdelaziz Bouteflika y la elección de Abdelmadjid Tebboune, Argelia entra en un nuevo capítulo político. Tebboune ha prometido reformas, una nueva constitución y el desmantelamiento de la notoria red de corrupción conocida como la «Isabah» (la banda), que incluía a los antiguos primeros ministros Ahmed Ouyahia, Abdelmalek Sellal y a magnates empresariales como Ali Haddad y Mahieddine Tahkout. \n\nEl movimiento Hirak, sin embargo, sigue mostrándose escéptico ante sus promesas. ¿Conducirán estas reformas a una verdadera democratización o son simplemente una forma de preservar el régimen bajo un nuevo liderazgo?"
 algeria_reforms.1.a: "Apoyar las reformas de Tebboune"
 algeria_reforms.1.b: "¡El pueblo exige más!"
 ALG_arrest_the_gang: "Arrestar al entorno"
 ALG_arrest_the_gang_desc: "El pueblo argelino exige justicia. Tebboune continuará los procesamientos contra Ouyahia, Sellal, Haddad, Tahkout y otras figuras corruptas que saquearon la riqueza de la nación."
 ALG_at_a_crossroads: "La nación ante una encrucijada"
 ALG_at_a_crossroads_desc: "Mientras nuestra nación se enfrenta a desafíos sin precedentes, nos encontramos en un momento crucial de nuestra historia. Las decisiones que tomemos ahora darán forma a nuestro futuro y determinarán el rumbo de nuestra sociedad. ¿Abrazaremos el cambio y la reforma, o nos aferraremos al pasado? El camino que elijamos definirá nuestro legado."
 ALG_promises_of_reform: "Promesas de reforma"
 ALG_promises_of_reform_desc: "Una nueva Argelia requiere una nueva constitución. Tebboune promete reformas para limitar los mandatos presidenciales, fortalecer el parlamento y garantizar más libertades."
 ALG_suppressed_opposition: "Oposición suprimida"
 ALG_black_decade_methods: "Métodos de la Década Negra"
 ALG_black_market: "Mercado negro"
 ALG_pna_expansion: "Expansión del ENP"
 ALG_global_power: "Potencia global"
 ALG_crackdown_on_dissent: "Represión contra el Hirak"
 ALG_crackdown_on_dissent_desc: "Las protestas no han cesado. En lugar del diálogo, Tebboune ha optado por la represión, con la esperanza de silenciar la disidencia y preservar al Estado."
 ALG_rebuild_trust_investors: "Restaurar la confianza de los inversores"
 ALG_rebuild_trust_investors_desc: "Tras años de corrupción e inestabilidad, debemos recuperar la confianza de los inversores nacionales y extranjeros en nuestra economía."
 ALG_diversify_economy: "Diversificar la economía"
 ALG_diversify_economy_desc: "Argelia no puede depender únicamente del petróleo y el gas. Las energías renovables, la agricultura y la industria manufacturera serán los pilares de nuestro futuro."
 ALG_social_subsidies: "Proteger los subsidios sociales"
 ALG_social_subsidies_desc: "El pueblo depende de los subsidios para el combustible, el pan y la vivienda. Tebboune promete mantener estas protecciones a pesar de los desafíos económicos."
 ALG_balance_regional_powers: "Equilibrar las potencias regionales"
 ALG_balance_regional_powers_desc: "Argelia se encuentra entre Europa, África y el mundo árabe. Debemos mantener una política exterior equilibrada que sirva a nuestros intereses."
 ALG_strengthen_russia_ties: "Fortalecer los lazos con Rusia"
 ALG_strengthen_russia_ties_desc: "Nuestra histórica amistad con Moscú puede profundizarse mediante la cooperación en materia de defensa y los acuerdos energéticos."
 ALG_china_investments: "Inversiones chinas"
 ALG_china_investments_desc: "La Iniciativa de la Franja y la Ruta ofrece a Argelia la oportunidad de modernizar sus infraestructuras y atraer importantes proyectos de inversión chinos."
 ALG_north_south_highway: "Proyecto de la autopista Norte-Sur"
 ALG_automobile_factories: "Industria automotriz"
 ALG_automobile_factories_desc: "Para dar empleo a nuestra población y obtener una mayor capacidad económica, es posible que necesitemos invitar a productores de automóviles extranjeros a nuestro país."
 algeria_policy.1.t: "Denunciar a los regímenes colonialistas"
 algeria_policy.1.d: "El FLN ha emitido una enérgica condena a los antiguos regímenes colonialistas, denunciando los crímenes cometidos durante la ocupación de Argelia. La declaración ha despertado el orgullo nacional en el país, pero ha provocado indignación en París, deteriorando las relaciones argelino-francesas."
 algeria_policy.1.a: "¡Exponer los crímenes del colonialismo!"
 algeria_disaster.1.t: "El terremoto de Boumerdès"
 algeria_disaster.1.d: "Un devastador terremoto ha sacudido el norte de Argelia, con epicentro cerca de la ciudad de Boumerdès. Miles de personas han perdido la vida, decenas de miles más están heridas y extensas zonas de Argel y de la región costera han quedado reducidas a escombros. La nación se encuentra conmocionada mientras las operaciones de rescate luchan por hacer frente a la magnitud de la catástrofe. Se requiere una acción inmediata para restaurar el orden y proporcionar socorro a la población afectada."
 algeria_disaster.1.a: "Movilizar a los equipos de respuesta de emergencia y comenzar las tareas de reconstrucción"
 ALG_earthquake_recovery_tt: "Comienzan las operaciones de rescate. El gobierno decidirá pronto cómo financiar la reconstrucción."
 algeria_disaster.2.t: "Reconstruction and Recovery Efforts"
 algeria_disaster.2.d: "The aftermath of the earthquake has left Algeria facing one of the worst humanitarian crises in its modern history. Thousands remain without shelter, and vital infrastructure lies in ruins. The government must decide how to fund the reconstruction, either by creating a national aid fund using state resources, or by seeking foreign assistance, which may come with political strings attached."
 algeria_disaster.2.a: "Establish a State Aid Fund"
 ALG_state_aid_fund_tt: "Asignar recursos estatales para reconstruir las regiones afectadas. Esto supondrá una carga para la tesorería, pero reforzará la confianza interna en el gobierno."
 algeria_disaster.2.b: "Buscar ayuda exterior"
 ALG_foreign_aid_dependence_tt: "Solicitar ayuda a los socios internacionales. Esto aliviará la presión financiera, pero aumentará la influencia extranjera sobre los asuntos internos de Argelia."
 ALG_french_influence: "La influencia francesa en las sombras"
 ALG_french_influence_desc: "Aunque independiente sobre el papel, la política de Argelia sigue estando bajo la sombra de la influencia francesa. Generales corruptos y políticos vinculados a París condicionan la toma de decisiones, limitando la verdadera soberanía."
 ALG_shadow_state: "Le Pouvoir en las sombras"
 ALG_shadow_state_desc: "La red oculta de generales, oficiales de inteligencia y empresarios, a menudo llamada 'Le Pouvoir', domina Argelia. La corrupción debilita al Estado, pero este sistema en la sombra garantiza la estabilidad política y refuerza el control del régimen sobre el poder."
 algeria_emerging_youth: "Organizaciones juveniles"
 algeria_nationalist_youth: "Organizaciones juveniles"
 algeria_nationalist_rise: "Renacimiento nacionalista"
 algeria_nationalist_rise_desc: "Nationalism in Algeria is becoming more popular than ever, due to the government's clear opposition to foreign interference in the state, and its staunch support for the sovereignty and independence of the state"
 algeria_cultural_rebirth: "Renacimiento cultural"
 ALG_PNA_victory: "Gobierno militar"
 ALG_PNA_victory_desc: "Armée nationale populaire (People's National Army) is the military of Algeria. Ever since Algeria's independence in 1962, it had a big role in politics. It practically controlled the government until 1988, when a multi-party system was established. It remains to have influence over Algeria's politics though, with the most recent example being president Abdelaziz Bouteflika abdicating in 2019 after protests led to a loss of support by the military."
 ALG_kick_out_morocco: "Expulsar a Marruecos"
 ALG_kick_out_morocco_desc: "Marruecos siempre nos ha sometido bajo su control y no hay razón para que mantengamos nuestros lazos con ellos. ¡Es el momento adecuado para expulsar a estos enemigos ideológicos de Argelia!"
 ALG_statist_rise: "Auge del estatismo"
 ALG_statist_rise_desc: "La economía liberal permite la explotación de nuestro pueblo y compromete nuestra independencia y control nacionales. Lo mejor para Argelia es conectar cada aspecto de la economía con el Estado."
 ALG_maintain_military_role: "Mantener la influencia del ejército"
 ALG_maintain_military_role_desc: "El mundo está entrando en tiempos oscuros e incómodos, por lo que tenemos que proteger a nuestra nación, cueste lo que cueste."
 ALG_kick_out_iran: "Expulsar a Irán"
 ALG_kick_out_iran_desc: "Irán siempre nos ha sometido bajo su control y no hay razón para que mantengamos nuestros lazos con ellos. ¡Es el momento adecuado para expulsar a estos enemigos ideológicos de Argelia!"
 ALG_nationalize_oligarchic_holdings: "Nacionalizar participaciones"
 ALG_nationalize_oligarchic_holdings_desc: "Nacionalizaremos las participaciones y propiedades de varios oligarcas rebeldes para fortalecer nuestro control sobre la economía."
 ALG_subsidise_police: "Subvencionar a la policía"
 ALG_subsidise_police_desc: "Police is one of the most important things to make our people feel safe and guarantee our rule in Algeria and it has been very underfunded. This has to change."
 ALG_maintain_socialistic_policies: "Mantener las leyes socialistas"
 ALG_maintain_socialistic_policies_desc: "Una cosa que el gobierno anterior hizo bien, y que es la razón fundamental por la que eran relativamente más populares, son sus políticas socialistas que apoyaban a las clases bajas. Continuaremos con las políticas implementadas por el expresidente Hafez al-Assad y nos presentaremos como los verdaderos defensores de los oprimidos."
 ALG_government_planned_economic_projects: "Proyectos gubernamentales"
 ALG_government_planned_economic_projects_desc: "Deberíamos iniciar proyectos públicos para mejorar nuestra imagen como un gobierno responsable y para recabar el apoyo de la gente común."
 ALG_patriotic_propaganda: "Propaganda patriótica"
 ALG_patriotic_propaganda_desc: "Fortaleceremos nuestras posiciones informativas enfatizando la importancia del orgullo nacional y la lealtad al Estado."
 ALG_gather_support_from_peasantry: "Apoyo del campesinado"
 ALG_gather_support_from_peasantry_desc: "Los campesinos son la columna vertebral de nuestra nación y tenemos que asegurarnos de que nos apoyen."
 ALG_strong_government: "Gobierno fuerte"
 ALG_strong_government_desc: "Tendremos que demostrarle a nuestro pueblo que nuestro gobierno es lo suficientemente estable y capaz de gobernar. Esto nos permitirá ganarnos su confianza."
 ALG_expand_youth_organizations: "Expandir las organizaciones juveniles"
 ALG_expand_youth_organizations_desc: "Nuestros partidos han dependido notablemente de las organizaciones juveniles y, ahora que estamos en una posición de poder, es hora de animar a la juventud a apoyar nuestras causas ideológicas ganándonos sus corazones y mentes."
 ALG_illiberal_democracy: "Democracia iliberal"
 ALG_illiberal_democracy_desc: "El liberalismo es un virus que infecta y explota a las naciones pobres. Lo que el pueblo necesita es una verdadera democracia que lo represente genuinamente y que, al mismo tiempo, lo una bajo una sola bandera. Somos una democracia, pase lo que pase."
 ALG_reestablish_intelligence_committee: "Restablecer agencias de inteligencia"
 ALG_reestablish_intelligence_committee_desc: "Las guerras del futuro no se libran con armas y tanques, sino con información. Es nuestra responsabilidad crear una agencia de inteligencia plenamente operativa."
 ALG_national_security_act: "Ley de Seguridad Nacional"
 ALG_national_security_act_desc: "The extremist groups are killing our nation slowly and pose a threat to our people. Their attacks are a clear threat to our nation and if anything we have to stop them immediately no matter what the cost, no matter what happens. TERRORISM SHALL STOP."
 ALG_pan_algerian_nationalism: "Panargelanismo"
 ALG_pan_algerian_nationalism_desc: "Algeria is the country that should brighten all over North Africa with its unique identity. Our rich history and culture makes it clear that it's our duty to show our true potential and identity to the world."
 ALG_cultural_rebirth: "Renacimiento cultural"
 ALG_cultural_rebirth_desc: "Our nation is slowly but surely recognizing its identity. Petty divides should not stand in the way of realizing the beauty of our people. Our people should acknowledge that no matter what, we're still Algerians after all."
 ALG_deal_with_the_trade_unions: "Un acuerdo con los sindicatos"
 ALG_deal_with_the_trade_unions_desc: "The key of a strong country is its production and economy so we have to make sure that all workers of Algeria are supporting us."
 ALG_reassert_russian_ties: "Lazos rusos"
 ALG_reassert_russian_ties_desc: "Rusia es el único y verdadero aliado que nos ayuda a convertirnos en una nación moderna, segura y próspera."
 ALG_russian_oil_excavation: "Acuerdos petroleros rusos"
 ALG_russian_oil_excavation_desc: "Hay un gran tesoro en nuestra nación y nuestro aliado, Rusia, nos ayudará a alcanzar estos recursos."
 ALG_russian_algiers_base_expansion: "Ampliación de la presencia naval rusa"
 ALG_russian_algiers_base_expansion_desc: "No podemos crear una armada fuerte de inmediato, pero nuestros amigos rusos nos ayudarán a mantener nuestras costas seguras colaborando en la expansión de las capacidades del puerto."
 ALG_houarist_rise: "Auge del huarismo"
 ALG_houarist_rise_desc: "Houarism is rising again and ready to make Algeria great again."
 ALG_islamic_socialism: "Socialismo islámico"
 ALG_islamic_socialism_desc: "La gente parece olvidar que el islam aboga por muchas prácticas atribuidas al socialismo, como el zakat y la sadaka. Deberíamos enfatizar esta relación basando nuestros ideales en ella, ya que esto también recabará el apoyo de los islamistas que siempre se opusieron a nuestros ideales. El socialismo islámico es el verdadero camino para hacer de nuestra nación una república moderna, fuerte y virtuosa."
 ALG_Get_rid_of_oligarchs: "Purgar a los oligarcas"
 ALG_news.1.t: "Argelia ante una encrucijada"
 ALG_news.1.d: "Tras casi una década de violencia brutal, desintegración económica y estancamiento político, Argelia se encuentra en el año 2000 en un momento decisivo. La guerra civil, conocida por muchos como la «Década Negra», ha dejado decenas de miles de muertos y muchos más desplazados. Aunque la intensidad de los combates ha disminuido, las tensiones siguen siendo altas y las heridas están lejos de cerrarse.\n\nCon el futuro de la nación sumido en la incertidumbre, fuerzas competidoras empujan ahora en diferentes direcciones. Un camino busca la reconciliación nacional y reformas democráticas para unificar el país. Otro se inclina por prolongar el estado de emergencia, manteniendo el control del régimen actual sobre el poder. Sin embargo, un tercero susurra sobre la continuidad de la guerra, de batallas inconclusas, promesas radicales y de aquellos que se niegan a deponer las armas.\n\nEl camino que Argelia elija a continuación podría moldear su destino durante generaciones."
 ALG_news.1.a: "Todos los ojos están puestos en Argel."
 Arab_Defense_Bloc: "Bloque de Defensa Árabe"
 The_Maghreb_Joint_Defense: "La Defensa Conjunta del Magreb"
 ALG_bouteflika.3.t: "Crisis de salud de Bouteflika"
 ALG_bouteflika.3.d: "In 2013, Bouteflika had a debilitating stroke. A journalist, Hichem Aboud, was pursued for threatening national security, territorial integrity, and normal management of the Republic's institutions and the newspapers for which he wrote were censored, because he wrote that the President had returned from Val-de-Grâce in a comatose state and had characterized Saïd Bouteflika as the puppet-master running the administration."
 ALG_bouteflika.3.a: "What Will Happen?"
 ALG_boteflika_tt: "Esto desbloqueará el enfoque de la crisis de salud del presidente de Argelia."
 ALG_bouteflika: "Noticias de la crisis de salud de Bouteflika"
 ALG_bouteflika.2.t: "Elecciones presidenciales de Argelia de 2014"
 ALG_bouteflika.2.d: "Presidential elections were held in Algeria on 17 April 2014. Incumbent President Abdelaziz Bouteflika was re-elected with 82% of the vote. Issues in the campaign included a desire for domestic stability after the bloody civil war of the 1990s"
 ALG_bouteflika.2.a: "Bouteflika gana"
 ALG_bouteflika_health_crisis: "La crisis de salud de Bouteflika"
 ALG_bouteflika_health_crisis_desc: "El deterioro de la salud del presidente amenaza con desestabilizar Argelia. ¿Lo mantendremos en el poder o nos prepararemos para una transición?"
 ALG_2014_elections: "Elecciones presidenciales de 2014"
 ALG_2014_elections_desc: "A pesar de su enfermedad, Bouteflika se postula para un cuarto mandato. La oposición es silenciada y los resultados son una conclusión previsible."
 ALG_2014_oil_crash: "Colapso del precio del petróleo"
 ALG_2014_oil_crash_desc: "La estrepitosa caída de los precios del petróleo devasta la economía de Argelia. El pueblo culpa a la corrupción y exige un cambio."
 ALG_silence_hirak: "Aplastar las protestas del Hirak"
 ALG_silence_hirak_desc: "El ejército y la policía suprimirán la disidencia. Las calles se teñirán de rojo, pero el régimen sobrevivirá."
 ALG_listen_to_hirak: "Conceder ante las demandas reformistas"
 ALG_listen_to_hirak_desc: "Prometer reformas políticas para apaciguar a los manifestantes. La vieja guardia se resistirá, pero la indignación del pueblo podría calmarse."
 ALG_2019_elections: "Crisis política de 2019"
 ALG_2019_elections_desc: "El intento de Bouteflika de postularse para un quinto mandato desata la furia en todo el país. ¿Estallará Argelia en una revolución o se someterá a la tiranía?"
 ALG_new_president: "Nombrar a un nuevo presidente"
 ALG_new_president_desc: "El movimiento Hirak ha ganado. Un gobierno de transición celebrará elecciones libres, poniendo fin a décadas de gobierno autoritario."
 ALG_release_political_prisoners: "Liberar a los presos políticos"
 ALG_release_political_prisoners_desc: "Miles de activistas, periodistas y figuras de la oposición languidecen en prisión por su papel en las protestas del Hirak. Liberarlos supondría una verdadera ruptura con el antiguo régimen y reforzaría la legitimidad democrática."
 ALG_corrupt_successor: "Instalar a un sucesor leal"
 ALG_corrupt_successor_desc: "El ejército se asegura de que un títere tome el poder. El legado de corrupción de Bouteflika sigue vivo."
 alg_oil_crash_title: "Colapso de los precios del petróleo"
 alg_oil_crash_desc: "Los precios del petróleo se desploman, ¿sobrevivirá nuestra nación?"
 alg_oil_crash_option: "¡Esto es preocupante!"
 alg_hirak_victory_title: "El pueblo gana"
 alg_hirak_victory_desc: "Tras años de protestas, Bouteflika deja el cargo. Comienza una nueva era, pero ¿podrá durar?"
 alg_military_rule_title: "Los generales deciden"
 alg_military_rule_desc: "El ejército instala a un líder títere. El Hirak queda aplastado por ahora."
 algeria_tebboune.1.t: "Las elecciones presidenciales de 2019"
 algeria_tebboune.1.d: "Tras meses de protestas y la dimisión de Abdelaziz Bouteflika, los argelinos acuden a las urnas en las elecciones más polémicas de las últimas décadas. Muchos consideran que el proceso está dominado por la vieja guardia, mientras que otros se aferran a la esperanza de una reforma o incluso de un resurgimiento islamista. Tres candidatos principales han emergido como favoritos: Abdelmadjid Tebboune, el candidato continuista vinculado al sistema; Ali Benflis, un reformista liberal con su propio movimiento; y Abdelkader Bengrina, un líder islamista con lazos con el Movimiento de la Sociedad por la Paz. La elección determinará el camino futuro de Argelia."
 algeria_tebboune.1.a: "Elegir a Abdelmadjid Tebboune"
 algeria_tebboune.1.b: "Elegir a Ali Benflis"
 algeria_tebboune.1.c: "Elegir a Abdelkader Bengrina"
 ALG_benflis_tt: "§YAli Benflis§! se convierte en presidente de Argelia, liderando a los reformistas liberales."
 ALG_bengrina_tt: "§YAbdelkader Bengrina§! se convierte en presidente de Argelia, representando a la oposición islamista."
 kabyle_resistance_info: "La región de Cabilia está experimentando disturbios. Nivel de resistencia: [?state_resistance@438|%Y]"
 kabyle_resistance_effects: "Vigilar Cabilia ante el aumento del apoyo separatista. Resistencia actual: [?state_resistance@385|%Y]"
 ALG_kabyle_resistance_tooltip: "Nivel de resistencia en Cabilia:"
 ALG_suppress_kabyle: "Suprimir el movimiento cabila"
 ALG_suppress_kabyle_desc: "Los disturbios cabilas representan una amenaza para la soberanía nacional. No podemos permitir que florezca la retórica secesionista. Una fuerte represión puede ser la única manera de reafirmar el control, incluso si eso significa enfrentarse a una feroz resistencia."
 ALG_recognize_kabyle: "Reconocer la independencia de Cabilia"
 ALG_recognize_kabyle_desc: "Décadas de tensión, protestas y disturbios nos han llevado a este momento. Puede que sea hora de reconocer las aspiraciones de independencia de los cabilas. Hacerlo pondría fin a los disturbios inmediatos, pero a costa de la integridad territorial."
 ALG_recognize_tamazight: "Reconocer el tamazight"
 ALG_recognize_tamazight_desc: "Reconocer el tamazight como idioma oficial es una demanda clave de la población cabila. Hacerlo puede legitimar su identidad cultural al tiempo que preserva la unidad nacional."
 ALG_kabyle_cultural_reforms: "Reformas culturales cabilas"
 ALG_kabyle_cultural_reforms_desc: "Debemos apoyar la educación, las instituciones locales y los derechos culturales en la región de Cabilia para fomentar la integración y el respeto mutuo."
 ALG_internal_troops_kabyle: "Desplegar tropas internas"
 ALG_internal_troops_kabyle_desc: "La situación en Cabilia exige una fuerte presencia de seguridad. Desplegaremos tropas internas para asegurar la región y suprimir los disturbios."
 ALG_disrupt_kabyle_networks: "Desarticular las redes políticas cabilas"
 ALG_disrupt_kabyle_networks_desc: "La actividad separatista se coordina a través de redes políticas clandestinas. La desarticulación mediante vigilancia y arrestos es necesaria para preservar la seguridad nacional."
 KBY_build_a_new_state: "Construir un nuevo Estado"
 KBY_build_a_new_state_desc: "Ahora que somos independientes, debemos sentar las bases de una república funcional. Una constitución, la gobernanza y los servicios sociales son las máximas prioridades."
 KBY_secure_our_borders: "Asegurar nuestras fronteras"
 KBY_secure_our_borders_desc: "Con nuestra soberanía declarada, debemos fortificar nuestras vulnerables fronteras y garantizar nuestra supervivencia en un entorno hostil."
 idea_ALG_neutrality: "Neutralidad de Argelia"
 idea_ALG_neutrality_desc: "Argelia ya no puede permitirse la guerra, la neutralidad es nuestra mejor opción."
 idea_ALG_neutrality_2: "Neutralidad de Argelia"
 idea_ALG_neutrality_2_desc: ""
 ALG_a_globalized_algeria: "Una Argelia globalizada"
 ALG_a_globalized_algeria_desc: "Today estamos en una era de globalización en la que Argelia debe participar."
 ALG_international_investments: "Inversiones internacionales"
 ALG_international_investments_desc: ""
 ALG_export_driven_growth: "Crecimiento impulsado por las exportaciones"
 ALG_export_driven_growth_desc: ""
 ALG_promote_sovereignty: "Promover la soberanía"
 ALG_promote_sovereignty_desc: ""
 ALG_promote_human_rights: "Promover los derechos humanos"
 ALG_promote_human_rights_desc: "Los derechos humanos ante todo, incluso por encima de la soberanía nacional."
 ALG_extract_favorable_terms: "Extraer condiciones favorables"
 ALG_extract_favorable_terms_desc: ""
 ALG_a_norm_entrepreneur: "Un promotor de normas"
 ALG_a_norm_entrepreneur_desc: ""
 ALG_Algeria_resplendent: "Argelia resplandeciente"
 ALG_Algeria_resplendent_desc: ""
 ALG_national_strength: "Fuerza nacional"
 ALG_national_strength_desc: ""
 ALG_terror_2003_hostage_title: "Crisis de rehenes del Sáhara"
 ALG_terror_2003_hostage_desc: "Un grupo de turistas europeos fue tomado como rehén en el desierto argelino por militantes islamistas. Aunque no se registraron víctimas mortales, esto marca el inicio de un preocupante aumento de la actividad yihadista organizada."
 ALG_terror_2003_hostage_option: "Un signo preocupante de lo que está por venir"
 ALG_terror_monitor: "Monitorear la amenaza terrorista"
 ALG_conduct_security_raids: "Llevar a cabo redadas de seguridad"
 ALG_terror_threat_category: "Monitor de amenazas de terrorismo"
 ALG_terror_2007_algiers_title: "Atentados de Argel"
 ALG_terror_2007_algiers_desc: "Un atentado suicida masivo ha sacudido el Palacio de Gobierno en Argel. Más de 30 civiles y miembros del personal gubernamental han muerto en uno de los ataques más mortíferos de los últimos años."
 ALG_terror_2007_batna_title: "Atentado de Batna"
 ALG_terror_2007_batna_desc: "Un terrorista suicida ha detonado un artefacto cerca de una multitud que esperaba para ver al presidente en Batna. El ataque ha dejado más de 20 muertos."
 ALG_terror_2008_issers_title: "Atentado de la academia de policía de Issers"
 ALG_terror_2008_issers_desc: "Un atentado suicida con coche bomba ha tenido como objetivo a reclutas de la policía en la academia de Issers, matando a 43 personas e hiriendo a decenas."
 ALG_terror_generic_option: "Noticias trágicas."
 ALG_terror_2000_bus_ambush_title: "Emboscada a un autobús cerca de Médéa"
 ALG_terror_2000_bus_ambush_desc: "Militantes armados han llevado a cabo una cruenta emboscada a un autobús de pasajeros cerca de Médéa. Diecinueve civiles han perdido la vida. Este ataque es una señal de la continua inestabilidad en el periodo posterior a la guerra civil."
 ALG_terror_2002_tazmalt_title: "Atentado de Tazmalt"
 ALG_terror_2002_tazmalt_desc: "Una bomba ha explotado en Tazmalt, matando e hiriendo a varios civiles. Las fuerzas de seguridad sospechan de remanentes del GSPC."
 ALG_terror_2002_miliana_title: "Atentado de Miliana"
 ALG_terror_2002_miliana_desc: "Un artefacto explosivo improvisado (IED) en una carretera ha detonado cerca de Miliana, hiriendo a varios soldados."
 ALG_terror_2002_hammam_title: "Atentado de Hammam Righa"
 ALG_terror_2002_hammam_desc: "Un artefacto explosivo de fabricación casera ha detonado en Hammam Righa, teniendo como objetivo a un convoy militar."
 ALG_terror_2002_larbaa_title: "Atentado de Larbaa"
 ALG_terror_2002_larbaa_desc: "Los militantes han detonado una bomba en Larbaa, continuando su campaña contra las autoridades estatales."
 ALG_terror_2002_msila_title: "Atentado de M'Sila"
 ALG_terror_2002_msila_desc: "Un IED ha explotado en M'Sila, evidenciando aún más la persistencia de las redes terroristas en la región."
 ALG_terror_2003_tizi_title: "Atentado de Tizi Ouzou"
 ALG_terror_2003_tizi_desc: "Se ha producido una explosión mortal en Tizi Ouzou. Varios civiles se encuentran entre los fallecidos y las fuerzas de seguridad sospechan de la implicación del GSPC."
 ALG_terror_2004_tebessa_title: "Atentado de Tebessa"
 ALG_terror_2004_tebessa_desc: "Un atentado coordinado con bombas en Tebessa ha matado a 7 personas. La creciente escala de los ataques es alarmante."
 ALG_idea_arab_diplomacy: "Diplomacia árabe"
 ALG_terror_2005_tidjelabine_title: "Atentado de Tidjelabine"
 ALG_terror_2005_tidjelabine_desc: "Dos gendarmes han muerto en Tidjelabine después de que un coche bomba alcanzara su patrulla."
 ALG_relying_on_our_own_strength_spirit: "Confiar en nuestras propias fuerzas"
 ALG_relying_on_our_own_strength_spirit_desc: "Argelia solo necesita a los argelinos para prosperar, a nadie más."
 ALG_hydroelectric_power_plants_upgraded_idea: "§RSonatrach§! - Centrales hidroeléctricas modernizadas"
 FLN_nationalize_resources: "Nacionalizar los recursos"
 FLN_nationalize_resources_desc: "Los recursos naturales de Argelia son la clave de su soberanía y prosperidad. Al nacionalizar nuestros recursos, podemos garantizar que la riqueza generada por el petróleo, el gas y los minerales beneficie directamente al pueblo de Argelia, sentando las bases para una independencia económica a largo plazo."
 ALG_revivify_non_aligned_movement: "Revitalizar el Movimiento de Países No Alineados"
 ALG_revivify_non_aligned_movement_desc: "Como orgulloso miembro del Movimiento de Países No Alineados, Argelia debe revigorizar este bloque de naciones independientes. Al fortalecer los lazos con otros Estados neutrales, podemos resistir el dominio de las superpotencias y forjar un camino de verdadera soberanía en un mundo dividido."
 ALG_reach_out_ASEAN: "Acercamiento a la ASEAN"
 ALG_reach_out_ASEAN_desc: "Las naciones del sudeste asiático comparten nuestro deseo de un desarrollo libre de interferencias extranjeras. Establecer una cooperación más estrecha con la ASEAN abrirá nuevas oportunidades económicas al tiempo que reforzará un orden mundial multipolar."
 ALG_support_developing_world: "Apoyar al mundo en desarrollo"
 ALG_support_developing_world_desc: "Argelia se solidariza con las naciones oprimidas y empobrecidas. A través de la ayuda económica, los intercambios técnicos y la defensa diplomática, podemos ayudar a elevar al Sur Global y desafiar la explotación neocolonial."
 ALG_between_east_and_west: "Entre el Este y el Oeste"
 ALG_between_east_and_west_desc: "Atrapada entre bloques rivales, Argelia debe maniobrar con cuidado. Al mantener relaciones equilibradas tanto con las potencias capitalistas como con las socialistas, podemos asegurar inversiones vitales sin entregar nuestra independencia a ninguno de los dos bandos."
 ALG_mediate_great_power_conflict: "Mediar en el conflicto de las grandes potencias"
 ALG_mediate_great_power_conflict_desc: "A medida que aumentan las tensiones entre las superpotencias, Argelia puede actuar como un mediador honesto. Nuestra neutralidad y autoridad moral nos posicionan para desescalar crisis y promover la coexistencia pacífica en un mundo cada vez más inestable."
 ALG_promote_reconciliation: "Promover la reconciliación"
 ALG_promote_reconciliation_desc: "Desde África hasta Oriente Medio, los conflictos causan estragos entre hermanos. Argelia, con su herencia revolucionaria y experiencia diplomática, debe fomentar el diálogo y la unidad entre las naciones divididas."
 ALG_secure_balance: "Asegurar el equilibrio"
 ALG_secure_balance_desc: "In un mundo de hegemonías en competencia, el equilibrio es nuestra salvaguarda. Al calibrar cuidadosamente nuestra política exterior, podemos evitar la dominación de cualquier potencia individual mientras extraemos los máximos beneficios de todas."
 ALG_joining_brics: "Unirse a los BRICS"
 ALG_joining_brics_desc: "Argelia busca fortalecer su influencia global uniéndose al grupo BRICS de economías emergentes, potenciando tanto el crecimiento económico como la cooperación política."
 ALG_align_with_brazil: "Fortalecer lazos con Brasil"
 ALG_align_with_brazil_desc: "Brasil, al igual que Argelia, busca un camino independiente en los asuntos mundiales. Al profundizar nuestra asociación con este gigante sudamericano, podemos mejorar el comercio en agricultura y tecnología, al tiempo que presentamos un frente unido contra las presiones neocoloniales en los foros globales."
 ALG_align_with_india: "Forjar una asociación estratégica con la India"
 ALG_align_with_india_desc: "La postura no alineada de la India y su creciente poder industrial la convierten en un aliado natural. Colaborar en proyectos energéticos, intercambios militares y diplomacia en la ONU fortalecerá a ambas naciones contra el dominio de las superpotencias, al tiempo que fomentará la cooperación Sur-Sur."
 ALG_islamic_monarchy_idea: "Monarquía islámica"
 ALG_islamic_monarchy_idea_desc: "Argelia ha restaurado una monarquía divina arraigada en los principios islámicos y la tradición nacional."
 ALG_caliph_crowned: "Califa coronado"
 ALG_caliph_crowned_desc: "El califa gobierna no solo por la ley, sino por la voluntad del pueblo y el legado de la fe."
 ALG_amir_al_muminin_idea: "Amir al-Mu'minin"
 ALG_amir_al_muminin_idea_desc: "Príncipe de los creyentes, un título con peso espiritual y político en todo el mundo islámico."
 ALG_maghreb_alliance_idea: "Pilares del Magreb"
 ALG_maghreb_alliance_idea_desc: "Argelia lidera un esfuerzo para unificar el mundo islámico occidental bajo un nuevo orden religioso y político."
 ALG_restore_caliphate_in_algiers: "Restaurar el califato en Argel"
 ALG_restore_caliphate_in_algiers_desc: "La república ha fracasado. Ha llegado el momento de restaurar una monarquía divina, arraigada en la fe y la historia. Desde Argel, se alzará un nuevo Califato."
 ALG_crown_the_caliph: "Coronar al califa"
 ALG_crown_the_caliph_desc: "Se ha elegido a un heredero legítimo para el califato. Con una ceremonia en Argel, se restaurará la corona y el mundo reconocerá al nuevo Amir al-Mu'minin."
 ALG_amir_al_muminin: "El Amir al-Mu'minin"
 ALG_amir_al_muminin_desc: "Declaramos al califa como Amir al-Mu'minin, el Príncipe de los creyentes (Emir de los creyentes). Este título le otorga legitimidad espiritual y política en todo el mundo islámico."
 ALG_umayyad_legacy: "Declarar el legado omeya"
 ALG_umayyad_legacy_desc: "Argelia invoca la memoria de los omeyas, cuya gloria se extendió una vez a través de continentes. Nos posicionamos como los herederos de su legado."
 ALG_reclaim_al_andalus: "Reclamar al-Ándalus"
 ALG_reclaim_al_andalus_desc: "Las tierras de al-Ándalus fueron una vez la joya del mundo islámico. Ha llegado el momento de reclamarlas y revivir nuestra antigua civilización en Iberia."
 ALG_reclaim_the_crown: "Reclamar la corona"
 ALG_reclaim_the_crown_desc: "Ha llegado el momento de restaurar una monarquía legítima y guiada por la divinidad, arraigada en la legitimidad islámica. En las cenizas del fracaso republicano y de la guerra civil, resucitaremos la corona histórica, uniendo a la nación bajo un estandarte real de fe, orden y herencia. Ya sea un sucesor abasí, una dinastía bereber revivida o un símbolo de una nueva unidad islámica, la corona brillará una vez más sobre Argelia."
 ALG_pillars_of_the_maghreb: "Los pilares del Magreb"
 ALG_pillars_of_the_maghreb_desc: "Argelia busca la unidad con sus hermanos occidentales, Marruecos y Túnez, para formar la base de un bloque islámico unido en el norte de África."
 ALG_monarchy_tt: "§OComo nuevo monarca de Argelia, recaudamos la Jizya y el Zakat de los fieles. Bajo la guía de Alá, continuaremos nuestro mandato.§!"
 ALG_recovering_from_the_civil_war: "La décennie noire"
 ALG_recovering_from_the_civil_war_desc: "La guerra civil argelina dejó profundas cicatrices en la nación. Aunque el conflicto ha terminado, sus efectos perduran, influyendo en el panorama político y en la psique nacional. Años después de la guerra civil, Argelia sigue lidiando con sus sombras. Las heridas del conflicto aún no se han curado por completo, pero la nación mantiene su determinación de reconstruirse."
 MSP_non_aligned_revival: "Revivir la política exterior de No Alineación"
 MSP_non_aligned_revival_desc: "Reviviremos el espíritu de neutralidad y solidaridad del sur, tal como en la década de 1960."
 MSP_global_south_solidarity: "Solidaridad con el Sur Global"
 MSP_global_south_solidarity_desc: "Argelia reforzará los lazos con las naciones poscoloniales a través del comercio, la diplomacia y la ayuda."
 MSP_north_africa_first: "El norte de África primero"
 MSP_north_africa_first_desc: "Nos centraremos en liderar la diplomacia y el desarrollo en nuestra región inmediata."
 MSP_western_sahara_position: "Apoyar al Sáhara Occidental"
 MSP_western_sahara_position_desc: "Reafirmamos nuestro apoyo a la independencia saharaui frente a las reivindicaciones marroquíes."
 MSP_african_union_engagement: "Unirse a la Unión Africana"
 MSP_african_union_engagement_desc: "Argelia debe volver a unirse y asumir un papel de liderazgo en la diplomacia continental."
 MSP_sahel_initiatives: "Expandirse hacia el Sahel"
 MSP_sahel_initiatives_desc: "Combatiremos la inestabilidad y el terrorismo en el Sahel mediante el poder blando y la defensa."
 MSP_arab_world_outreach: "Profundizar los lazos diplomáticos árabes"
 MSP_arab_world_outreach_desc: "Para fortalecer la influencia de Argelia en el mundo árabe, debemos revitalizar nuestros esfuerzos de coordinación y alcance diplomático. A través de visitas bilaterales, cumbres e iniciativas comerciales, Argelia puede consolidarse como una fuerza unificadora en la región."
 MSP_join_arab_league: "Reforzar el compromiso con la Liga Árabe"
 MSP_join_arab_league_desc: "Como miembro actual de la Liga Árabe, Argelia puede ir más allá de la mera participación y asumir un papel diplomático líder. Promover la coordinación económica, las consultas de defensa y la solidaridad cultural mejorará nuestra posición en el mundo árabe."
 MSP_support_palestine: "Apoyar la causa palestina"
 MSP_support_palestine_desc: "Argelia ha estado durante mucho tiempo al lado de la lucha palestina por la autodeterminación. Un respaldo diplomático renovado, la ayuda humanitaria y la defensa internacional reafirmarán nuestra postura de principios en defensa de los derechos palestinos."
 MSP_algeria_algiers_axis: "Forjar el Eje Egipto-Argel"
 MSP_algeria_algiers_axis_desc: "Al alinearse más estrechamente con Egipto, Argelia puede ayudar a formar un poderoso bloque regional capaz de guiar la unidad árabe, asegurar la estabilidad del norte de África y contrarrestar la influencia extranjera."
 MSP_condemn_israel: "Condenar las acciones israelíes"
 MSP_condemn_israel_desc: "Ante la continua agresión y las violaciones de los derechos humanos, Argelia condenará formalmente las acciones israelíes en la escena internacional, movilizando el apoyo a una paz justa y oponiéndose a la normalización sin una resolución previa."
 MSP_palestinian_aid_package: "Paquete de ayuda palestino"
 MSP_palestinian_aid_package_desc: "Asignaremos recursos para proporcionar asistencia humanitaria, económica y técnica a los territorios palestinos, asegurando que el compromiso de Argelia se extienda más allá de las palabras hacia una ayuda real e impactante."
 MSP_pan_african_defense_initiative: "Iniciativa de defensa panafricana"
 MSP_pan_african_defense_initiative_desc: "Para proteger la soberanía africana y mejorar la estabilidad continental, Argelia propondrá una iniciativa de defensa africana coordinada que construya una preparación militar colectiva frente a las amenazas compartidas."
 MSP_send_troops_to_sahel: "Desplegar fuerzas en el Sahel"
 MSP_send_troops_to_sahel_desc: "En respuesta a la creciente inestabilidad en el Sahel, Argelia enviar tropas para apoyar las operaciones de mantenimiento de la paz, la protección de fronteras y las campañas antiterroristas en colaboración con los gobiernos regionales."
 MSP_sahel_stabilization_force: "Fuerza de Estabilización del Sahel"
 MSP_sahel_stabilization_force_desc: "Argelia asumirá el liderazgo en el establecimiento de una Fuerza de Estabilización del Sahel permanente, un marco de seguridad liderado por África para contrarrestar las insurgencias y las redes criminales en la región."
 MSP_exploit_sahel_resources: "Explotar los recursos del Sahel"
 MSP_exploit_sahel_resources_desc: "La influencia argelina en el Sahel ofrece acceso a recursos naturales sin explotar. Mediante la negociación de contratos mineros y de infraestructura, podemos asegurar beneficios económicos y asociaciones estratégicas en la región."
 MSP_propose_maghreb_union: "Proponer la Unión del Magreb"
 MSP_propose_maghreb_union_desc: "Es hora de revivir la visión de un Magreb unido. Argelia asumirá la iniciativa de proponer renovados esfuerzos de integración, centrándose en la cooperación económica, la infraestructura conjunta y la alineación diplomática."
 MSP_economic_integration_initiative: "Integración económica del Magreb"
 MSP_economic_integration_initiative_desc: "A través de la reducción de aranceles, la inversión en infraestructura y debates sincronizados sobre política monetaria, Argelia impulsará los esfuerzos para crear una zona económica común en el Magreb que beneficie a todos los Estados miembros."
 MSP_maghreb_joint_defense_pact: "Pacto de Defensa Conjunta del Magreb"
 MSP_maghreb_joint_defense_pact_desc: "Un Magreb seguro requiere una defensa colectiva. Propondremos un pacto militar regional centrado en la protección de fronteras, el intercambio de inteligencia y la realización de ejercicios militares conjuntos."
 MSP_mediterranean_dialogue: "El Diálogo Mediterráneo"
 MSP_invite_iraq: "Invitar a Irak"
 MSP_invite_iraq_desc: "Necesitamos invitar a Irak a nuestra alianza, ya que poco a poco están empezando a organizarse, y nos beneficiaríamos seriamente de la cooperación mutua."
 MSP_invite_syria: "Invitar a Siria"
 MSP_invite_syria_desc: "Tener a Siria justo al sur de nuestra nación significa que somos muy vulnerables. Invitar a Siria a nuestra facción sería una excelente manera de garantizar nuestra seguridad y protección."
 MSP_invite_algeria: "Invitar a Egipto"
 MSP_invite_algeria_desc: "Egipto es una potencia en auge y, con una población de su tamaño, nuestra alianza será capaz de lograr prácticamente cualquier cosa."
 MSP_assistance_to_bulgaria: "Asistencia a Bulgaria"
 MSP_assistance_to_bulgaria_desc: "Deberíamos ayudar a Bulgaria a desarrollar su infraestructura para que podamos realizar más inversiones más allá de sus fronteras con facilidad."
 MSP_supp_plo: "Apoyar a la OLP"
 MSP_supp_plo_desc: "La Organización para la Liberación de Palestina (OLP) ha sido durante mucho tiempo un actor clave en la lucha por la autodeterminación palestina. Apoyar a la OLP podría reforzar nuestra posición ante los aliados internacionales y promover una resolución pacífica al conflicto."
 MSP_the_pal_issue: "La causa palestina"
 MSP_the_pal_issue_desc: "La cuestión de Palestina sigue siendo un asunto fundamental en nuestra política exterior. Nuestra postura sobre la lucha palestina definirá nuestras alianzas internacionales e influencia en la región. Debemos decidir cómo abordar este conflicto en curso."
 MSP_supp_hamas: "Apoyar a Hamás"
 MSP_supp_hamas_desc: "Hamás representa una facción significativa dentro de la resistencia palestina. Al proporcionarles apoyo, podemos fortalecer nuestros lazos con este grupo, mejorando nuestra influencia en la región y alineándonos con su lucha."
 MSP_Get_rid_of_military_corrupt: "Purgar a los corruptos del ejército"
 MSP_Get_rid_of_military_corrupt_desc: "El ejército está atrincherado en nuestras instituciones y representa una clara amenaza para el futuro de nuestro país. Los arrestaremos bajo cargos de corrupción y confiscaremos las propiedades que podamos asegurar."
 MSP_reverse_secularization: "Revertir la laicización"
 MSP_arm_palestinians_to_fight: "Armar a los palestinos"
 MSP_arm_palestinians_to_fight_desc: "Jordania alberga a una gran población de refugiados palestinos. Podemos convertir a estos refugiados en combatientes e incitarlos a causar estragos en Palestina e Israel. Dado que son combatientes por delegación (proxies), podemos utilizarlos para provocar la represalia de Israel, haciendo que parezcan los malos del conflicto."
 MSP_zionist_threat: "La amenaza sionista"
 MSP_zionist_threat_desc: "Israel es la mayor afrenta para todos los musulmanes y un estado falso abominable en el corazón del Islam. Deben ser borrados de la faz de la tierra."
 ALG_kabyle_issue: "El asunto de Cabilia"
 ALG_kabyle_issue_map: "¡Satisfacción del pueblo amazigh de [KBY.GetFlag] con nuestro gobierno!"
 ALG_2014_oil_crash_idea: "Colapso del petróleo"
 ALG_algeria_resplendent: "Argelia resplandeciente"
 ALG_algeria_resplendent_desc: ""
 KBY_new_state_born: "Nace un nuevo Estado"
 KBY_new_state_born_desc: "Cabilia ha renacido como una nación soberana. Los primeros días de nuestra independencia deben estar marcados por la consolidación, la celebración y la cautela."
 KBY_border_readiness: "Preparación fronteriza"
 KBY_border_readiness_desc: "Debemos asegurar el perímetro de nuestra patria para evitar infiltraciones, contrabando o incursiones."
 KBY_new_institutions: "Nuevas instituciones"
 KBY_new_institutions_desc: "Un Estado funcional debe erigirse sobre la base de instituciones estables y de confianza."
 KBY_state_economy_plan: "Plan económico estatal"
 KBY_state_economy_plan_desc: "Debemos trazar la estructura de nuestra economía, ya sea centralizada, de mercado o mixta."
 KBY_african_diplomacy: "Diplomacia africana"
 KBY_african_diplomacy_desc: "Buscar la legitimidad regional entre los vecinos africanos reforzará nuestra posición y nuestras oportunidades económicas."
 KBY_international_recognition_campaign: "Campaña de reconocimiento internacional"
 KBY_international_recognition_campaign_desc: "Nuestra supervivencia depende de la legitimidad ante los ojos de otras naciones. Lanzaremos una ofensiva diplomática estratégica."
 KBY_international_recognition_campaign_completion: "Canales diplomáticos abiertos; ahora comienza la ardua tarea de persuasión."
 KBY_establish_governance_structures: "Establecer estructuras de gobernanza"
 KBY_establish_governance_structures_desc: "Se deben crear instituciones para garantizar que nuestros principios de gobierno perduren."
 KBY_establish_governance_structures_completion: "Las instituciones gubernamentales ya están operativas, listas para servir a nuestros ciudadanos."
 KBY_plan_the_economy: "Planificar la economía"
 KBY_plan_the_economy_desc: "Decide nuestro futuro económico: dirigido por el Estado, liberal o mixto. Cada camino ofrece ventajas y desventajas únicas."
 KBY_plan_the_economy_completion: "Planificación económica en marcha; elige sabiamente para una prosperidad a largo plazo."
 KBY_seek_regional_support: "Buscar apoyo regional"
 KBY_seek_regional_support_desc: "El apoyo de nuestros vecinos y de la comunidad africana reforzará nuestra legitimidad."
 KBY_seek_regional_support_completion: "Esfuerzos de acercamiento regional desplegados; ahora se aguardan respuestas."
 KBY_secure_internal_stability: "Asegurar la estabilidad interna"
 KBY_secure_internal_stability_desc: "Con las amenazas externas bajo control, debemos abordar la disidencia interna y la resistencia."
 KBY_secure_internal_stability_completion: "Protocolos de seguridad activados; el orden público ha mejorado."
 KBY.10.t: "Establecer relaciones internacionales"
 KBY.10.d: "Con nuestra independencia ya reconocida por la comunidad internacional, es hora de que Cabilia establezca relaciones diplomáticas formales con otras naciones. Nuestros diplomáticos están preparados para ponerse en contacto con socios potenciales, empezando por Francia, dados nuestros lazos históricos, y Turquía, que ha mostrado interés en la causa amazigh.\n\nEsta ofensiva diplomática ayudará a legitimar a nuestra joven nación y abrirá las puertas a una futura cooperación."
 KBY.10.a: "¡Nos acercaremos a todas las naciones!"
 KBY.15.t: "Buscar la unidad africana"
 KBY.15.d: "Nuestra iniciativa de diplomacia africana ha sentado las bases para una integración más profunda con el continente. La Unión Africana representa un foro importante para nuestra nación; la membresía proporcionaría legitimidad, oportunidades económicas y una plataforma para abogar por los derechos amazigh en todo el norte de África.\n\nNíger, con su importante población tuareg, ha expresado su apoyo a nuestra solicitud."
 KBY.15.a: "Solicitar el ingreso en la Unión Africana"
 KBY_diplomatic_move: "Ofensiva diplomática cabila"
 KBY_au_membership_attempt: "Intento de ingreso cabila en la UA"
 KBY_state_economy_model_statist: "Economía dirigida por el Estado"
 KBY_state_economy_model_liberal: "Economía de libre mercado"
 KBY_state_economy_model_mixed: "Modelo económico mixto"
 ALG_recover_from_the_war: "Recuperación de la guerra civil"
 ALG_restoring_order: "Restaurar el orden"
 ALG_restoring_order_desc: "La prioridad inmediata es restablecer la autoridad del Estado y detener el caos que persiste en algunas regiones. La población anhela paz y estructura tras años de devastación."
 ALG_secure_weapons_shipments: "Asegurar cargamentos de armas"
 ALG_secure_weapons_shipments_desc: "Garantizar que nuestro ejército esté bien abastecido nos permitirá mantener el orden interno y prevenir una nueva insurgencia."
 ALG_recover_from_the_war_desc: "Debemos comenzar ahora el largo proceso de reconstrucción de nuestra nación. La Década Negra ha dejado cicatrices en Argelia, pero con determinación, podemos resurgir de las cenizas."
 ALG_restoring_the_broken_economy: "Reactivar la economía nacional"
 ALG_restoring_the_broken_economy_desc: "La guerra civil ha paralizado nuestras instituciones financieras. Debemos implementar medidas de emergencia para estabilizar la economía."
 ALG_arresting_extremists: "Neutralizar amenazas armadas"
 ALG_arresting_extremists_desc: "Los grupos extremistas siguen operando en zonas remotas. Una renovada campaña de seguridad restaurará el control nacional absoluto."
 ALG_economic_recovery: "Recuperación económica"
 ALG_economic_recovery_desc: "Nuestras políticas empiezan a dar resultados. Entramos ahora en una fase de recuperación gradual y de reconstrucción de la confianza."
 ALG_regain_banks: "Restaurar la confianza en el sector bancario"
 ALG_regain_banks_desc: "Reactivar el sector bancario es crucial para restaurar la confianza de los inversores y reiniciar el crédito nacional."
 ALG_financial_reform: "Reformar el sistema financiero"
 ALG_financial_reform_desc: "Modernizar el sistema financiero de Argelia fomentará un crecimiento sostenible y nos permitirá evitar futuras crisis."
 ALG_begin_full_recovery: "Iniciar la restauración económica total"
 ALG_begin_full_recovery_desc: "Con la seguridad garantizada y la economía estabilizada, podemos comenzar ahora un pleno resurgimiento económico a escala nacional."
 ALG_repairing_the_roads: "Reparar la infraestructura"
 ALG_repairing_the_roads_desc: "Las carreteras, puentes y líneas de comunicación han colapsado. Reconstruir nuestra red logística es esencial para la cohesión nacional."
 ALG_rebuild_north: "Reconstruir Cabilia y Argel"
 ALG_rebuild_north_desc: "Estos centros urbanos estuvieron entre los más afectados. Se debe dar prioridad a la restauración de los servicios básicos en Cabilia y Argel."
 ALG_rebuild_centre: "Reconstruir las tierras altas"
 ALG_rebuild_centre_desc: "Las tierras altas centrales fueron tanto un campo de batalla como una crisis humanitaria. Necesitan una reconstrucción focalizada."
 ALG_rebuild_west: "Reconstruir el Oeste"
 ALG_rebuild_west_desc: "La infraestructura en el Oeste estaba descuidada incluso antes de la guerra. Es hora de integrar estas regiones remotas."
 ALG_rebuild_algeria: "Reconstruir Argelia"
 ALG_rebuild_algeria_desc: "It's time to rebuild our nation and become the great power again, this civil war caused too many wounds; now it's time to heal"
 ALG_rebuild_south: "Reconstruir el Sur"
 ALG_rebuild_south_desc: "La infraestructura en el sur estaba descuidada incluso antes de la guerra. Es hora de integrar estas regiones remotas."
 ALG_order_restored_in_algeria: "Orden restaurado en Argelia"
 ALG_order_restored_in_algeria_desc: "Por primera vez en décadas, Argelia está estable y unida. El camino por delante es largo, pero la paz ha regresado."
 ALG_state_and_imf_funding: "Financiación del Estado y del FMI"
 ALG_state_and_imf_funding_desc: "A través de préstamos y ayuda extranjera, especialmente del FMI, podemos infundir vida a nuestra estancada economía."
 ALG_restocking_factories: "Reabastecer las fábricas"
 ALG_restocking_factories_desc: "Muchas fábricas resultaron dañadas o vaciadas. Con nuevos suministros, podemos reiniciar la producción."
 ALG_rebuilding_factories: "Reconstruir zonas industriales"
 ALG_rebuilding_factories_desc: "Varias zonas industriales han quedado en ruinas. Reconstruirlas proporcionará empleos y producirá los materiales necesarios para la recuperación."
 ALG_export_controls: "Controles de exportación y ayuda de la federación"
 ALG_export_controls_desc: "Para proteger los bienes estratégicos y asegurar el desarrollo interno, impondremos restricciones temporales a la exportación, equilibradas con apoyo externo."
 ALG_post_war_recovery: "Recuperación de posguerra"
 ALG_post_war_recovery_desc: "Argelia sigue marcada por el cruento conflicto civil de la década de 1990. Aunque se ha restablecido la paz, la nación aún sufre de inestabilidad, fábricas subutilizadas, una infraestructura sobrecargada y un sistema político frágil."
 ALG_imf_funding_idea: "Financiación de emergencia del FMI"
 ALG_imf_funding_idea_desc: "El Fondo Monetario Internacional ha intervenido para proporcionar una liquidez y un alivio presupuestario muy necesarios. Aunque estos fondos ayudan a estabilizar la economía, conllevan condiciones estrictas."
 ALG_export_controls_idea: "Controles de exportación"
 ALG_export_controls_idea_desc: "Con el fin de priorizar la recuperación nacional, el gobierno ha impuesto restricciones a la exportación de materiales clave. Esta política estabiliza los mercados internos, pero puede dañar las relaciones comerciales internacionales."
 ALG_anti_terror_sweeps: "Operaciones antiterroristas"
 ALG_anti_terror_sweeps_desc: "Las fuerzas de seguridad están llevando a cabo operaciones agresivas para eliminar los elementos extremistas restantes. Aunque esto mejora la seguridad nacional, debe equilibrarse para evitar la supresión de las libertades civiles."
 ALG_banking_confidence_restored: "Confianza restaurada en el sector bancario"
 ALG_banking_confidence_restored_desc: "Tras un periodo de profunda desconfianza y estancamiento, el sector bancario ha recuperado cierta estabilidad, lo que permite tanto a los ciudadanos como a los inversores volver a interactuar con el sistema financiero de Argelia."
 ALG_structural_reform: "Reformas económicas estructurales"
 ALG_structural_reform_desc: "Se están llevando a cabo reformas integrales para modernizar la economía de Argelia. Estos cambios tienen como objetivo reducir la inflación, optimizar las instituciones y promover el crecimiento a largo plazo."
 ALG_national_recovery_completed: "Recuperación nacional completada"
 ALG_national_recovery_completed_desc: "Con la infraestructura reconstruida, la seguridad garantizada y la economía reactivada, Argelia ha emergido por fin de su capítulo más oscuro. Comienza una nueva era de esperanza y progreso."
 ALG_mastering_atom: "Dominar el átomo"
 ALG_missile_chi_TT: "Argelia modernizará su tecnología de §HReactores nucleares§!"
 CHI_rejected_ALG: "Oferta rechazada por China"
 ALG_technological_ties: "Lazos tecnológicos"
 ALG_continue_1991_program: "Continuar el programa nuclear de 1991"
 ALG_continue_1991_program_desc: "Aunque nuestro programa nuclear fue suspendido en la década de 1990, sus cimientos permanecen. Al revivir los antiguos proyectos, podemos buscar tanto la seguridad energética como una mayor independencia, aunque es probable que le sigan sanciones internacionales."
 ALG_seek_china_help: "Buscar asistencia china"
 ALG_seek_china_help_desc: "China lleva mucho tiempo dispuesta a cooperar con Argelia en materia de tecnología nuclear. Una asociación renovada nos proporcionará equipamiento, experiencia y capacitación que eludirá las restricciones occidentales."
 ALG_1983_deal: "Revivir el acuerdo de misiles de 1983"
 ALG_1983_deal_desc: "Nuestra cooperación anterior con China en 1983 nos proporcionó tecnología de misiles y asistencia nuclear limitada. Revivir este acuerdo acelerará nuestras ambiciones nucleares tanto civiles como militares."
 ALG_missile_cooperation: "Ampliar la cooperación en misiles"
 ALG_missile_cooperation_desc: "Más allá de los reactores y el combustible, China también puede proporcionarnos sistemas de misiles capaces de transportar cargas nucleares. Sin embargo, este paso atraerá una seria atención de Occidente."
 ALG_hoggar_nuclear_facility: "Construir la instalación de Hoggar"
 ALG_hoggar_nuclear_facility_desc: "En lo profundo de las montañas de Hoggar, se puede construir una instalación nuclear segura, protegida de la interferencia exterior. Esto servirá como la pieza central del programa nuclear de Argelia."
 ALG_the_search_for_uranium: "La búsqueda de uranio"
 ALG_the_search_for_uranium_desc: "Nuestros científicos están convencidos de que el vasto desierto de Argelia esconde grandes reservas de uranio. Localizar y extraer estos depósitos proporcionará la columna vertebral de cualquier proyecto nuclear independiente."
 ALG_dig_in_tamanrasset: "Excavar en Tamanrasset"
 ALG_dig_in_tamanrasset_desc: "Las llanuras desérticas de Tamanrasset ocultan importantes depósitos de uranio. Al invertir aquí en infraestructura minera, Argelia puede liberarse de la dependencia de proveedores extranjeros."
 ALG_withdrawal_from_npt: "Retirarse del TNP"
 ALG_withdrawal_from_npt_desc: "Argelia ya no puede permitir que su soberanía esté sujeta a tratados extranjeros. Al retirarnos del Tratado de No Proliferación Nuclear, declaramos nuestra intención de desarrollar armas nucleares abiertamente."
 ALG_wmds: "Armas de destrucción masiva"
 ALG_wmds_desc: "Con las instalaciones de enriquecimiento completadas y los misiles listos, ha llegado el momento de finalizar la disuasión nuclear de Argelia. El mundo se dará cuenta y nuestros enemigos se lo pensarán dos veces antes de amenarnos."
 ALG_algiers_agreement: "El Acuerdo de Argel"
 ALG_algiers_agreement_desc: "En lugar de buscar el armamento nuclear, Argelia puede presentarse como un defensor de la paz. El Acuerdo de Argel servirá como una promesa de moderación, abriendo la puerta a la inversión extranjera y a la legitimidad internacional."
 ALG_sign_BWC: "Firmar la Convención sobre Armas Biológicas"
 ALG_sign_BWC_desc: "Al adherirnos a los acuerdos internacionales contra las armas de destrucción masiva, demostramos el compromiso de Argelia con la paz. Esto tranquilizará a los inversores extranjeros y reducirá las sospechas sobre nuestras actividades nucleares."
 ALG_build_nuclear_reactor: "Construir un reactor nuclear"
 ALG_build_nuclear_reactor_desc: "Nuestro programa nuclear está listo para dar el siguiente paso. Al construir un reactor a gran escala, Argelia adquirirá tanto una poderosa fuente de energía como una tapadera para posteriores actividades de enriquecimiento. Aunque el mundo pueda ver intenciones pacíficas, la realidad puede ser mucho más compleja."
 ALG_IAEA_safeguards_leave: "Salvaguardias del OIEA completadas"
 ALG_IAEA_safeguards_leave_desc: "Tras años de supervisión y cumplimiento, Argelia ha implementado plenamente sus compromisos en virtud del Acuerdo de Argel y la Convención sobre Armas Biológicas. Con la salida de los últimos inspectores del OIEA de nuestro territorio, se levantan las sanciones y nuestra nación es reconocida como una potencia regional responsable."
 sanctioned_algeria: "Sanciones"
 ALG_hoggar_nuclear_facility_idea: "Instalación nuclear de Hoggar"
 ALG_algeria_behave_TT: "[USA.GetFlag] Es probable que §HLos Estados Unidos§! §Glevanten§! las sanciones económicas"
 nuclear_algeria.1.t: "¿Un proveedor potencial?"
 nuclear_algeria.1.d: "In our bid to acquire nuclear technology, we must come to terms with the fact that we simply do not meet the level of sophistication required to produce adequate weapons or facilities. Thus, we must look outwards into the world and see who is willing to help us, and our sources are telling us that we can ask 1 particular nation for help."
 nuclear_algeria.1.a: "Contactar a los chinos"
 nuclear_algeria.2.t: "Argelia solicita asistencia"
 nuclear_algeria.2.d: "Científicos y diplomáticos argelinos se reunieron recientemente con los nuestros para solicitar asistencia con su programa nuclear. Declararon que estarían dispuestos a aceptar cualquier cosa que les proporcionemos, siempre y cuando les ayude a desarrollar su programa nuclear."
 nuclear_algeria.2.a: "De acuerdo"
 nuclear_algeria.2.b: "No podemos compartir nuestros secretos"
 nuclear_algeria.3.t: "China comparte tecnología de misiles"
 nuclear_algeria.3.d: "Científicos chinos se reunieron recientemente con los nuestros en [ALG.capital.GetCapitalVictoryPointName] y nos proporcionaron planos de misiles ICBM avanzados que actualmente no poseemos."
 nuclear_algeria.3.a: "¡Excelente!"
 nuclear_algeria.4.t: "China proporciona tecnología nuclear"
 nuclear_algeria.4.d: "Científicos chinos se reunieron recientemente con los nuestros en [ALG.capital.GetCapitalVictoryPointName] y nos proporcionaron planos de reactores avanzados que actualmente no poseemos."
 nuclear_algeria.4.a: "¡Excelente!"
 nuclear_algeria.5.t: "¡[FROM.GetName] se niega a prestar asistencia!"
 nuclear_algeria.5.d: "We made a major miscalculation in contacting [FROM.GetName] for assistance in our nuclear program, as they have denied our requests and have threatened to take our request to international courts, potentially exposing our secret."
 nuclear_algeria.5.a: "Una oportunidad perdida."
 nuclear_algeria.6.t: "Argelia quiere comprar misiles"
 nuclear_algeria.6.d: "El gobierno argelino nos ha pedido que le vendamos una serie de misiles balísticos. Ha declarado que utilizará los misiles para proteger sus fronteras nacionales y que no los empleará en ninguna forma de guerra ofensiva."
 nuclear_algeria.6.a: "De acuerdo, finalizar la venta"
 nuclear_algeria.6.b: "No"
 nuclear_algeria.7.t: "China vende sus misiles"
 nuclear_algeria.7.d: "China nos ha vendido cerca de 400 misiles balísticos. Aunque algunos de ellos puedan estar desactualizados, todavía funcionan, que es lo único que importa."
 nuclear_algeria.7.a: "Excelente"
 nuclear_algeria.8.t: "China se niega a vender misiles"
 nuclear_algeria.8.d: "El gobierno chino ha denegado nuestra solicitud de compra de misiles, alegando que los necesitan para sus propias operaciones militares."
 nuclear_algeria.8.a: "De acuerdo"
 nuclear_algeria.19.t: "Sanciones internacionales"
 nuclear_algeria.19.d: "Parece que el mundo ha decidido volverse en nuestra contra y ha impuesto sanciones a nuestra economía que inevitablemente la paralizarán. Tendremos que evaluar nuestras políticas."
 nuclear_algeria.19.a: "¿Qué esperábamos de un mundo de traidores?"
 nuclear_algeria.25.t: "Estados Unidos aumenta la presión económica"
 nuclear_algeria.25.d: "Los Estados Unidos han decidido ejercer su visión imperialista aumentando las sanciones económicas contra nuestro pueblo."
 nuclear_algeria.25.a: "¡Resistiremos!"
 nuclear_algeria.26.t: "Estados Unidos reduce la presión económica"
 nuclear_algeria.26.d: "Los Estados Unidos han optado por reducir la cantidad de sanciones que han impuesto a nuestro pueblo. Tendremos que esperar y ver si mantienen esta postura."
 nuclear_algeria.26.a: "Bien"
 nuclear_algeria.28.t: "Argelia entra por el aro"
 nuclear_algeria.28.d: "Dando un giro de 180 grados respecto a la política habitual argelina, parecen avanzar hacia un rumbo más pacífico y controlado."
 nuclear_algeria.28.a: "Bien, tal vez podamos aliviar las sanciones ahora"
 algerian_focus.171.t: "Central nuclear de Es-Salam"
 algerian_focus.171.d: "Left unfinished by the Americans, what was built of Es-Salam nuclear plant has been sitting idle for decades now. With the arrival of several Chinese scientists, an offer has been made by a Chinese company to finish what was left of the powerplant."
 algerian_focus.171.a: "Aceptar la propuesta"
 algerian_focus.171.b: "No, gracias"
 ALG_sanctioned: "Sancionado"
 ALG_nuclear_known: "Programa nuclear expuesto"
 ALG_emergency_budget: "Presupuesto de emergencia"
 support_brics: "Support BRICS"
 algeria_msp: "Enfoque del MSP"
 algeria_democratic: "Enfoque del RND"
 algeria_nationalist: "Enfoque del ENP"
 monitor_kabyle_unrest: "Monitor the [KBY.GetFlag] Kabyle Unrest"
 ALG_us_sanctions: "Sanciones de EE. UU."
 ALG_us_sanctions_desc: "The United States has placed several sanctions that limit our ability to interact with the outside world. Though not crippling, it does prevent our ability to achieve economic success to an extent.\n§W--------------§!\nThe United States possesses the ability to increase or decrease sanctions on our government based off of our actions.\n§W--------------§!\nThis national spirit will be §RRemoved§! if the United States believes we are no longer pursuing nuclear weapons."
 ALG_imf_loan_taken: "Tomó los préstamos del FMI"
 ALG_repression_modifier: "Represión"
 ALG_surveillance_state_modifier: "Estado de vigilancia"
 ALG_national_dialogue_modifier: "Diálogo nacional"
 ALG_boteflika: "Crisis de salud del presidente de Argelia"
 idea_alg_empowered_parliament: "Parlamento empoderado"
 algeria_sahar.1.t: "Ayuda desde Argelia"
 algeria_sahar.1.d: "Hemos recibido una oferta de Argelia: están dispuestos a proporcionarnos asistencia militar y ayudarnos a prepararnos para la reanudación de las hostilidades a cambio de nuestra participación en el proceso de establecimiento de la RAU (República Árabe Unificada). ¿Deberíamos aceptar el apoyo de Argelia?"
 algeria_sahar.1.a: "¡Debemos aceptar!"
 algeria_sahar.1.b: "¡De ninguna manera nos convertiremos en sus títeres!"
 algeria_sahar.2.t: "Acuerdo de paz"
 algeria_sahar.2.d: "No pudimos contener a los rebeldes y se han apoderado de todo el Sáhara Occidental. ¿Deberíamos ofrecer a los rebeldes un tratado de paz y entregar el territorio?"
 algeria_sahar.2.a: "Enviarles la oferta"
 algeria_sahar.2.b: "¡Debemos aplastarlos!"
 algeria_sahar.3.t: "Oferta de Marruecos"
 algeria_sahar.3.d: "¡Marruecos nos ha enviado una propuesta de tratado de paz, una declaración que bien puede considerarse un acto de rendición incondicional! ¡Podemos aceptar la capitulación o podemos marchar en un frente amplio para liberar a los pueblos del norte del Magreb!"
 algeria_sahar.3.a: "¡Ganamos!"
 algeria_sahar.3.b: "Onward to People's Federation!"
 algeria_sahar.4.t: "La guerra ha sido ganada"
 algeria_sahar.4.d: "Nuestras fuerzas han prevalecido. El conflicto del Sáhara Occidental ha terminado y somos libres de remodelar el orden político de la región como mejor nos parezca."
 algeria_sahar.4.a: "Establecer la Federación Saharaui."
 algeria_sahar.5.t: "Paz al fin."
 algeria_sahar.5.d: "We signed a peace treaty with Sahrawi and the war is over."
 algeria_sahar.5.a: "Our darkest times."
 algeria_sahar.6.t: "¡Rechazaron la oferta!"
 algeria_sahar.6.d: "Sahrawi has rejected our peace treaty! The war continues!"
 algeria_sahar.6.a: "Entendido."
 algeria_sahar.7.t: "Sahrawi accepts!"
 algeria_sahar.7.d: "Sahrawi accepts our offer."
 algeria_sahar.7.a: "¡Adelante hacia la RAU!"
 algeria_sahar.8.t: "¡Rechazaron la oferta!"
 algeria_sahar.8.d: "Sahrawi has rejected our offer."
 algeria_sahar.8.a: "Qué lástima."
 TT_ALG_DEAL_WITH_TRADE_UNIONS: "Aumentaremos la opinión de los sindicatos cuando los tengamos como facción interna."
 ALG_oil_price_collapse: "Colapso del precio del petróleo"
 ALG_oil_price_collapse_desc: "Una fuerte caída en los precios mundiales del petróleo ha afectado gravemente los ingresos del Estado argelino. Dado que los hidrocarburos siguen siendo la columna vertebral de la economía nacional, este colapso amenaza la estabilidad presupuestaria, las reservas de divisas y el gasto social.\n\n§R- ¡Los ingresos de la tesorería se desploman!§!"
 alg_hirak_victory_option: "El movimiento Hirak prevalece"
 alg_hirak_victory_option_desc: "Tras años de protestas, movilizaciones y resistencia popular, el movimiento Hirak finalmente ha prevalecido. Las reformas democráticas están ahora en marcha, pero el Estado sigue siendo frágil y la transición es incierta.\n\n§G+ Legitimidad reformista§!\n§Y- Influencia del Estado profundo§!"
 alg_hirak_reforms_title: "Reformas impulsadas por el Hirak"
 alg_hirak_reforms_desc: "Ante la inmensa presión de la calle, el gobierno se ve obligado a implementar reformas simbólicas."
 alg_hirak_reforms_option: "Anunciar reformas políticas"
 alg_hirak_gains_influence_tt: "El §YHirak§! gana más influencia en el equilibrio político."
 alg_hirak_crackdown_title: "Represión de las protestas del Hirak"
 alg_hirak_crackdown_desc: "El régimen ha optado por la represión en lugar de la reforma, desatando a las fuerzas de seguridad contra los manifestantes."
 alg_hirak_crackdown_option: "Usar la fuerza para restaurar el orden"
 alg_pouvoir_crackdown_tt: "§YLe Pouvoir§! consolida su poder a costa de la estabilidad."
 alg_health_crisis_title: "Crisis de salud presidencial"
 alg_health_crisis_desc: "El presidente Bouteflika ha sufrido un grave incidente de salud, reactivando las preocupaciones sobre el envejecimiento del liderazgo y la falta de transparencia en la política argelina. Aunque su círculo cercano insiste en que seguirá gobernando, muchos entre la población y los círculos de élite comienzan a cuestionar la legitimidad de la continuidad de su mandato."
 alg_health_crisis_option_continue: "Reafirmar el liderazgo de Bouteflika"
 alg_le_pouvoir_strengthens_tt: "§YLe Pouvoir§! consolida más poder a medida que el círculo íntimo del presidente lo protege del escrutinio público."
 maghreb_union_member: "§YAceptó nuestra propuesta de formar la Unión del Magreb§!"
 has_power_balance_algeria: "Completó las elecciones de Argelia de 2014"
 supports_brics: "Apoyar a los BRICS"
 ALG_eu_trade_agreements_desc: "Firmar un acuerdo comercial con la UE para fortalecer nuestros lazos con Occidente y desarrollar nuestra economía."
 ALG_join_nato_partnership_desc: "Unirse a la asociación de la OTAN para que podamos dominar la región africana y convertir a Argelia en un país del primer mundo."
 ALG_al_quwwat_al_jawwiya_al_jazaeriya: "Al-Quwwat al-Jawwiya al-Jazaeriya"
 ALG_al_quwwat_al_jawwiya_al_jazaeriya_desc: "La Fuerza Aérea Argelina ha sido uno de los pilares de nuestro poder militar desde la independencia. Fortalecer nuestras capacidades aéreas mediante la modernización y adquisiciones garantizará el dominio en los cielos del norte de África."
 ALG_al_jaysh_al_watani_al_shaabi: "Al-Jaysh al-Watani al-Shaabi"
 ALG_al_jaysh_al_watani_al_shaabi_desc: "El Ejército Nacional Popular es la columna vertebral de la defensa de Argelia. Reformar y equipar a las fuerzas terrestres asegurará nuestro territorio y mantendrá la estabilidad frente a las amenazas."
 ALG_al_quwwat_al_bahriya_al_jazaeriya: "Al-Quwwat al-Bahriya al-Jazaeriya"
 ALG_al_quwwat_al_bahriya_al_jazaeriya_desc: "Las Fuerzas Navales Argelinas salvaguardan nuestra costa mediterránea y nuestros intereses marítimos. Expandir nuestra flota e infraestructura permitirá a Argelia proyectar poder y proteger rutas marítimas vitales."
 ALG_al_quwwat_al_musallaha_al_jazaeriya: "Al-Quwwat al-Musallaha al-Jazaeriya"
 ALG_al_quwwat_al_musallaha_al_jazaeriya_desc: "Las Fuerzas Armadas Argelinas representan la fuerza combinada de nuestro ejército, fuerza aérea y armada. Como garantes de la soberanía nacional, deben ser reestructuradas y modernizadas para afrontar los desafíos del nuevo siglo."
 ALG_expand_the_EFCIP: "Expandir la EFCIP"
 ALG_expand_the_EFCIP_desc: "La Escuela de Formación de Comandos e Iniciación al Paracaidismo (EFCIP) en Boghar ha sido la piedra angular del entrenamiento de las fuerzas especiales de Argelia desde 1963. Al ampliar sus instalaciones, modernizar su infraestructura e introducir programas de combate avanzados, mejoraremos aún más las capacidades de nuestros comandos y paracaidistas. Esta inversión garantizará que Argelia mantenga uno de los cuerpos de fuerzas especiales más formidables del norte de África."
 ALG_expand_conscription: "Ampliar el servicio militar obligatorio"
 ALG_expand_conscription_desc: "Ampliar el servicio militar obligatorio (conscripción) aumenta nuestra reserva de soldados entrenados. Esto garantiza el personal suficiente para defender a la nación y responder a las amenazas."
 ALG_expand_military_infrastructure: "Expandir la infraestructura militar"
 ALG_expand_military_infrastructure_desc: "La construcción de nuevas bases, centros de entrenamiento y núcleos logísticos fortalece nuestra capacidad militar. Las mejoras en la infraestructura respaldan la eficiencia operativa."
 ALG_focus_on_military_morale: "Centrarse en la moral militar"
 ALG_focus_on_military_morale_desc: "Una moral alta es fundamental para la eficacia en combate. Invertir en el bienestar de los soldados, el liderazgo y el espíritu de cuerpo eleva el espíritu de lucha."
 ALG_expand_artillery_units: "Expandir las unidades de artillería"
 ALG_expand_artillery_units_desc: "La artillería proporciona un fuego de apoyo vital en el campo de batalla. El aumento de las unidades de artillería mejora las capacidades ofensivas y defensivas de nuestro ejército."
 ALG_an_army_of_the_masses: "Un ejército de masas"
 ALG_an_army_of_the_masses_desc: "Un ejército grande y bien entrenado puede disuadir agresiones y proteger la soberanía. Construir un ejército de masas requiere un firme compromiso de recursos y entrenamiento."
 ALG_expand_the_escuela_de_condores: "Expandir la Escuela de Cóndores"
 ALG_expand_the_escuela_de_condores_desc: "La Escuela de Cóndores entrena a los soldados de élite de Argelia. Su expansión permitirá desarrollar más fuerzas especiales para afrontar los complejos desafíos de seguridad."
 ALG_form_specops_brigades: "Formar brigadas de fuerzas especiales"
 ALG_form_specops_brigades_desc: "Las brigadas de fuerzas especiales llevan a cabo misiones de alto riesgo que requieren habilidades avanzadas. La formación de estas unidades mejora la flexibilidad táctica de Argelia."
 ALG_military_mechanization: "Mecanización militar"
 ALG_military_mechanization_desc: "La mecanización de la infantería mejora la movilidad y el poder de fuego. Esta transición moderniza el ejército e incrementa su eficacia en el campo de batalla."
 ALG_abolish_conscription: "Abolir el servicio militar obligatorio"
 ALG_abolish_conscription_desc: "Poner fin a la conscripción convierte a las fuerzas armadas en una fuerza voluntaria profesional. Esto puede mejorar la calidad de las tropas, pero reduce la disponibilidad de mano de obra."
 ALG_quality_over_quantity: "Calidad por encima de cantidad"
 ALG_quality_over_quantity_desc: "Centrarse en una fuerza más pequeña pero mejor equipada mejora la eficacia en combate. Se prioriza el entrenamiento y el equipamiento moderno por encima del mero número de tropas."
 ALG_a_cost_effective_army: "Un ejército rentable"
 ALG_a_cost_effective_army_desc: "Mantener unas fuerzas armadas austeras y eficientes garantiza la responsabilidad fiscal. Un presupuesto inteligente nos permite equilibrar las necesidades de defensa con las realidades económicas."
 ALG_modernizing_our_equipment: "Modernizar nuestro equipamiento"
 ALG_modernizing_our_equipment_desc: "Actualizar las armas y el equipo mantiene competitivas a nuestras fuerzas. El equipamiento moderno mejora la supervivencia y el poder de combate."
 ALG_develop_algerian_military_industry: "Desarrollar la industria militar argelina"
 ALG_develop_algerian_military_industry_desc: "El establecimiento de una industria armamentística nacional reduce la dependencia de las importaciones. Esto fortalece la soberanía y crea puestos de trabajo."
 ALG_cooperate_with_foreign_arms_companies: "Cooperar con empresas de armas extranjeras"
 ALG_cooperate_with_foreign_arms_companies_desc: "Asociarse con firmas armamentísticas internacionales acelera la transferencia de tecnología. Estas colaboraciones mejoran nuestras capacidades militares."
 ALG_tackle_military_corruption: "Combatir la corrupción militar"
 ALG_tackle_military_corruption_desc: "La corrupción socava la moral y la eficacia militar. Las reformas contundentes y la supervisión restauran la confianza y la disciplina."
 ALG_elite_officer_training: "Entrenamiento de oficiales de élite"
 ALG_elite_officer_training_desc: "Contar con oficiales altamente cualificados es clave para el éxito en el campo de batalla. Los programas de entrenamiento especializado construyen el liderazgo y la experiencia estratégica."
 ALG_an_army_for_the_future: "Un ejército para el futuro"
 ALG_an_army_for_the_future_desc: "Debemos preparar a los militares para afrontar las amenazas y tecnologías del futuro. La innovación y la adaptabilidad son fundamentales para esta visión."
 ALG_purchase_american_aircraft: "Adquirir aeronaves estadounidenses"
 ALG_purchase_american_aircraft_desc: "La adquisición de aviones de los Estados Unidos proporciona tecnología avanzada y una fiabilidad probada. Esto fortalece nuestras capacidades aéreas."
 ALG_purchase_chinese_aircraft: "Adquirir aeronaves chinas"
 ALG_purchase_chinese_aircraft_desc: "Los aviones chinos ofrecen opciones rentables y una sofisticación tecnológica creciente. Diversificar los proveedores amplía nuestras asociaciones estratégicas."
 ALG_purchase_russian_aircraft: "Adquirir aeronaves rusas"
 ALG_purchase_russian_aircraft_desc: "Los aviones rusos aportan diseños robustos y un sólido rendimiento. La cooperación mejora la versatilidad de nuestra fuerza aérea."
 ALG_improve_air_defense_infrastructure: "Mejorar la infraestructura de defensa aérea"
 ALG_improve_air_defense_infrastructure_desc: "El fortalecimiento de los sistemas de defensa aérea protege los activos críticos y los centros de población. Las actualizaciones reducen la vulnerabilidad ante amenazas aéreas."
 ALG_close_air_support: "Apoyo aéreo cercano"
 ALG_close_air_support_desc: "El apoyo aéreo cercano impulsa la eficacia de las fuerzas terrestres durante el combate. Integrar las operaciones aéreas y terrestres es vital para el éxito en el campo de batalla."
 ALG_a_new_world_class_academy: "Una nueva academia de clase mundial"
 ALG_a_new_world_class_academy_desc: "El establecimiento de una academia militar de clase mundial formará a los futuros líderes. Esta institución establecerá los estándares de excelencia."
 ALG_dominate_the_skies: "Dominar los cielos"
 ALG_dominate_the_skies_desc: "Lograr la superioridad aérea es esencial en la guerra moderna. Invertiremos para controlar nuestro espacio aéreo y apoyar todas las operaciones militares."
 ALG_might_of_the_sky: "El poder del cielo"
 ALG_might_of_the_sky_desc: "Nuestro poder aéreo simboliza la fuerza nacional y el progreso tecnológico. Mantener una fuerza aérea poderosa disuade las agresiones."
 ALG_naval_military_police: "Policía militar naval"
 ALG_naval_military_police_desc: "La policía militar naval mantiene la disciplina y la seguridad a bordo de los buques y en las bases. Garantizan el orden y la eficacia de las operaciones."
 ALG_expand_the_naval_academy: "Expandir la Academia Naval"
 ALG_expand_the_naval_academy_desc: "Una academia naval ampliada entrena a más oficiales y marineros. Esta inversión construye fuerzas marítimas profesionales y capaces."
 ALG_return_to_the_sea: "Nuestro regreso al mar"
 ALG_return_to_the_sea_desc: "Recuperar el acceso al océano Pacífico es un objetivo histórico para Argelia. Desarrollar una presencia naval es crucial para esta ambición."
 ALG_algerian_marine_forces: "Fuerzas de la Infantería de Marina argelina"
 ALG_algerian_marine_forces_desc: "Las fuerzas de infantería de marina proporcionan capacidades de respuesta rápida y experiencia anfibia. Su expansión incrementa el alcance operativo de Argelia."
 ALG_quick_strikes: "Ataques rápidos"
 ALG_quick_strikes_desc: "Los ataques rápidos y decisivos pueden abrumar a los adversarios. El desarrollo de tales fuerzas incrementa la flexibilidad táctica."
 ALG_invest_into_shipbuilding: "Invertir en la construcción naval"
 ALG_invest_into_shipbuilding_desc: "Construir una industria de construcción naval nacional respalda la expansión naval y el crecimiento económico. Este sector es estratégico para la defensa a largo plazo."
 ALG_djebel_chenoua: "Djebel Chenoua"
 ALG_djebel_chenoua_desc: "Creating a powerful fleet projects strength and protects national interests. Djebel Chenoua is a symbol of maritime sovereignty."
 ALG_masters_of_the_mediterranean: "Señores del Mediterráneo"
 ALG_masters_of_the_mediterranean_desc: "Dominar las aguas del Mediterráneo asegura las rutas comerciales y las ventajas estratégicas. Argelia debe aspirar a ser un actor clave en esta región."
 ALG_focus_on_mass_assault_tactics: "Centrarse en tácticas de asalto masivo"
 ALG_focus_on_mass_assault_tactics_desc: "Las tácticas de asalto masivo enfatizan abrumar a las fuerzas enemigas con grandes concentraciones de tropas. Esta estrategia depende de la cantidad de hombres y de la coordinación para lograr la victoria."
 ALG_licence_mir: "Purchasing a license for the Mirage"
 ALG_licence_mir_desc: "Tenemos todos los medios para producir aviones franceses, por lo que debemos solicitar una licencia para su fabricación."
 ALG_purchase_russian_su30: "Adquirir cazas rusos Su-30"
 ALG_purchase_russian_su30_desc: "Como potencia regional, salvaguardar nuestras vastas fronteras y proyectar influencia a lo largo del Magreb y el Sahel es primordial. Nuestro alto mando militar ha identificado al legendario Su-30 de Rusia como la plataforma ideal para mejorar significativamente nuestra superioridad aérea. Esta adquisición no solo impulsará la fuerza de nuestra flota y estandarizará la logística, sino que también proporcionará una ventaja decisiva e inmediata, aunque sin duda atraerá un escrutinio internacional significativo."
 alg_politics.50.t: "Muerte del general Smaïn Lamari"
 alg_politics.50.d: "El general Smaïn Lamari, jefe de la temida rama de contrainteligencia del DRS, ha fallecido. Su repentina muerte deja un vacío de poder en el Estado profundo de Argelia, mientras los rivales maniobran para reclamar su antigua influencia."
 alg_politics.50.a: "Desaparece una sombra del antiguo régimen."
 ALG_black_decade_threat: "Resurgimiento de los métodos de la Década Negra"
 ALG_2001_title: "Ascenso de Fatima Boudouani"
 ALG_2001_desc: "Como parte de la renovación reformista del presidente Bouteflika, Fatima Boudouani se convierte en la primera mujer general de Argelia. Su ascenso marca una nueva era para las mujeres en las fuerzas armadas, elevando la moral y señalando la modernización."
 ALG_2001_a: "Un paso histórico para el ejército."
 ALG_2002_title: "Ascenso de Fatima Zohra Ardjoune"
 ALG_2002_desc: "Tras el ascenso pionero de Fatima Boudouani, Fatima Zohra Ardjoune es promovida ahora al rango de general. Al ser la primera mujer general en el cuerpo médico argelino, su nombramiento refleja los cautelosos pasos de Argelia hacia la inclusión de género en su ejército."
 ALG_2002_a: "Otra barrera rota."
 alg_reform.1.t: "Una oportunidad para una verdadera reforma"
 alg_reform.1.d: "Tras la iniciativa 'Por el pueblo, para el pueblo', Argelia tiene una oportunidad única de elegir a un líder comprometido con una reforma genuina. Han surgido tres candidatos, cada uno prometiendo un camino diferente para estabilizar y modernizar el país. La elección recae ahora en el pueblo."
 alg_reform.1.a: "Ahmed Benbitour – El reformador tecnócrata"
 alg_benbitour_desc: "Ahmed Benbitour es un tecnócrata centrado en la eficiencia administrativa y la modernización económica. Su enfoque firme está orientado a construir la estabilidad a largo plazo y reformar las instituciones del Estado."
 alg_reform.1.b: "Soufiane Djilali – El reformador carismático"
 alg_djilali_desc: "Soufiane Djilali es un líder de la oposición reformista que hace hincapié en las reformas sociales y políticas. Carismático y decidido, busca fortalecer las instituciones democráticas y la participación pública."
 alg_reform.1.c: "Rachid Nekkaz – El activista populista"
 alg_nekkaz_desc: "Rachid Nekkaz es un activista populista que apela directamente al pueblo. Aunque su popularidad es alta, su estilo confrontativo podría generar inestabilidad en un entorno político delicado."
 ALG_citizens_constitution: "Constitución de los ciudadanos"
 ALG_justice_for_the_people: "Justicia para el pueblo"
 ALG_free_press_free_people: "Prensa libre, pueblo libre"
 ALG_economic_transparency: "Transparencia económica"
 ALG_citizens_constitution_desc: "Redactar una nueva constitución que garantice los derechos fundamentales y fortalezca las instituciones democráticas."
 ALG_justice_for_the_people_desc: "Reformar el poder judicial para garantizar que sea independiente, justo y protegido de la interferencia política."
 ALG_free_press_free_people_desc: "Garantizar la libertad de prensa, permitiendo a los medios de comunicación exigir responsabilidades al poder e informar a los ciudadanos."
 ALG_economic_transparency_desc: "Implementar presupuestos y políticas fiscales transparentes para combatir la corrupción e incrementar la confianza pública."
 ALG_true_reformist_path_tt: "Este camino permite a Argelia elegir a un verdadero líder reformista, aumentar la popularidad democrática y la estabilidad, y poner en marcha reformas políticas y económicas para el pueblo."
 algeria_news.3_tt: "El programa de paz de Bouteflika infunde un sentido de esperanza en Argelia, mejorando la estabilidad y el apoyo democrático."
 algeria_news.7_tt: "La resistencia contra «le pouvoir» gana apoyo popular, impulsando la influencia democrática y el capital político."
 algeria_news.1_tt: "El ejército reafirma el control tras las medidas de emergencia. La estabilidad cae ligeramente, pero el apoyo a la guerra y el poder político aumentan."
 algeria_news.4_tt: "El esfuerzo de reconciliación de Bouteflika impulsa la estabilidad nacional y el apoyo democrático."
 algeria_news.8.t: "Las víctimas de la Década Negra"
 algeria_news.8.d: "La guerra civil de la década de 1990 dejó cientos de miles de víctimas: los desaparecidos, las viudas, los huérfanos y aquellos que sufrieron torturas y terror. Mientras Argelia busca la reconciliación, surge la pregunta: ¿cómo debe responder el Estado a las demandas de justicia y reconocimiento?"
 algeria_news.8.a: "Compensar a las familias y a las víctimas"
 algeria_news.8.b: "Ofrecer únicamente un reconocimiento simbólico"
 algeria_news.8.c: "No podemos estancarnos en el pasado"
 algeria_news.8_a_tt: "Los §Yprogramas de compensación costosos§! mejorarán la estabilidad y fortalecerán la legitimidad de Argelia, pero supondría una carga para la tesorería."
 algeria_news.8_b_tt: "El §Yreconocimiento simbólico§! mejora la estabilidad a un enorme coste político, pero deja algunas demandas insatisfechas."
 algeria_news.8_c_tt: "§YIgnorar las demandas de las víctimas§! ahorra recursos ahora, pero reduce la estabilidad y alimenta el descontento."
 algeria_news.10.t: "El camino hacia la recuperación"
 algeria_news.10.d: "Con el fin del conflicto civil, Argelia se enfrenta al monumental desafío de reconstruir su destrozada economía. Las fábricas están paradas, la infraestructura dañada y el desempleo sigue siendo peligrosamente alto. Sin embargo, por primera vez en años, hay esperanza de que la reconstrucción y la reforma puedan restaurar la prosperidad y la estabilidad."
 algeria_news.10.a: "¡Comienza la recuperación!"
 algeria_news.10_a_tt: "§YSe dan los primeros pasos para reactivar la economía de Argelia.§! Esto abre el camino a reformas más profundas en infraestructura, industria y finanzas."
 algeria_news.11.t: "Misión de Ayuda de las Naciones Unidas"
 algeria_news.11.d: "Representantes de las Naciones Unidas han llegado a Argel con una oferta de ayuda económica y asistencia para la reconstrucción. Sus programas podrían aportar fondos valiosos, experiencia y ayuda humanitaria, pero muchos dentro del gobierno advierten que aceptar dicha ayuda puede propiciar la interferencia extranjera en los asuntos internos de Argelia."
 algeria_news.11.a: "Aceptar la misión de la ONU"
 algeria_news.11_a_tt: "§GWe will receive international aid funds and technical support.§! \n§RHowever, this will increase American, French and UK influence in Algeria.§!"
 algeria_news.11.b: "Rechazar la interferencia extranjera"
 algeria_news.11_b_tt: "§RNos negamos a la supervisión de la ONU y nos recuperaremos por nuestra cuenta.§! \n§YEsto preserva nuestra soberanía, pero ralentiza el crecimiento económico.§!"
 algeria_news.20.t: "Revisión de la política exterior de Argelia"
 algeria_news.20.d: "Con el fin del conflicto civil y la frágil recuperación de Argelia en marcha, el liderazgo en Argel ha lanzado una revisión integral de la política exterior de la nación. Las decisiones que se tomen en los próximos años determinarán si fortalecemos los lazos con los viejos aliados, buscamos nuevas asociaciones o mantenemos nuestra independencia en un mundo cada vez más polarizado. El debate ha comenzado y pronto Argelia tendrá que elegir su rumbo."
 algeria_news.20.a: "El futuro de Argelia aguarda."
 algeria_news.20_tt: "§YEsto marca el comienzo de la rama de política exterior de Argelia.§!"
 ALG_between_east_and_west_tt: "Argelia busca equilibrar las relaciones entre el Este y el Oeste al tiempo que reafirma una política exterior de No Alineación."
 ALG_mediate_great_power_conflict_tt: "Argelia media activamente entre las potencias mundiales, consolidando su reputación como un pacificador neutral."
 ALG_secure_balance_tt: "Argelia refuerza su posición de No Alineación, asegurando un equilibrio estable entre las principales potencias globales."
 alg_news_non_aligned.1.t: "Equilibrio entre el Este y el Oeste"
 alg_news_non_aligned.1.d: "Argelia ha comenzado a trazar un rumbo cuidadoso entre las principales potencias mundiales, buscando mantener su independencia al tiempo que se relaciona diplomáticamente tanto con el Este como con el Oeste."
 alg_news_non_aligned.1.a: "Argelia busca el equilibrio"
 alg_news_non_aligned.2.t: "Mediación en las tensiones globales"
 alg_news_non_aligned.2.d: "Argelia ha dado un paso al frente para mediar en las tensiones entre las grandes potencias, con el objetivo de mejorar su posición internacional como un pacificador neutral."
 alg_news_non_aligned.2.a: "Mediación en marcha"
 alg_news_non_aligned.3.t: "Promover la reconciliación regional"
 alg_news_non_aligned.3.d: "Argelia ha lanzado una serie de iniciativas diplomáticas para conciliar las diferencias entre las potencias regionales, buscando la estabilidad y asociaciones cooperativas."
 alg_news_non_aligned.3.a: "Esfuerzos de reconciliación"
 alg_news_non_aligned.4.t: "Asegurar el equilibrio de No Alineación"
 alg_news_non_aligned.4.d: "Argelia ha consolidado su postura de No Alineación, manteniendo cuidadosamente las relaciones con las grandes potencias sin comprometerse plenamente con ningún bloque."
 alg_news_non_aligned.4.a: "Equilibrio asegurado"
 alg_news_non_aligned.5.t: "Revitalizar el Movimiento de Países No Alineados"
 alg_news_non_aligned.5.d: "Argelia ha tomado medidas para revitalizar su participación en el Movimiento de Países No Alineados, reafirmando su liderazgo e influencia diplomática entre las naciones neutrales."
 alg_news_non_aligned.5.a: "Influencia del MPNA restaurada"
 alg_news_non_aligned.6.t: "Apoyar al mundo en desarrollo"
 alg_news_non_aligned.6.d: "Argelia ha comenzado un extenso alcance diplomático y económico con las naciones en desarrollo, promoviendo la estabilidad y la cooperación al tiempo que aumenta su influencia en el continente."
 alg_news_non_aligned.6.a: "Alcance iniciado"
 algeria_news.9.t: "El legado de la Década Negra"
 algeria_news.9.d: "La guerra civil dejó profundas cicatrices en Argelia. El gobierno debe decidir cómo enfocar el pasado, asignar responsabilidades y guiar el futuro de la nación."
 algeria_news.9.a: "Respaldar al régimen militar"
 algeria_news.9.b: "Ponerse del lado de las víctimas y de los pobres"
 algeria_news.9.c: "Culpar a los actores externos"
 algeria_news.9.dd: "Borrar oficialmente y suprimir el debate"
 ALG_promote_reconciliation_tt: "§GPromote Reconciliation:§!\n• Mejorar las relaciones con los vecinos\n• Reducir las tensiones regionales\n• Abrir canales diplomáticos"
 alg_mufti.2.t: "¿Qué camino tomará el Estado Islámico?"
 alg_mufti.2.d: "Ahora que el Islam ha sido declarado el principio rector de la nación, debemos decidir qué corriente definirá nuestro camino. El Movimiento del Renacimiento Islámico (Nahda), liderado por Abdallah Djaballah, aboga por una visión islamista moderada y estructurada a través de las urnas. Pero otros miran hacia los ulemas y a predicadores carismáticos que prometen una forma de autoridad islámica más directa e inquebrantable."
 alg_mufti.2.a: "Empoderar al Movimiento del Renacimiento Islámico (Nahda)"
 alg_mufti.2.a.tt: "El Nahda de Djaballah se convierte en la fuerza líder de la política islámica."
 alg_mufti.2.b: "Poner la autoridad en manos de los ulemas"
 alg_mufti.2.b.tt: "Más tarde elegiremos si seguir a un predicador controvertido o a un muftí aprobado por el gobierno."
 alg_mufti.3.t: "El rostro de los ulemas"
 alg_mufti.3.d: "Con la autoridad de los ulemas confirmada, el gobierno debe decidir ahora quién representará a esta corriente en el liderazgo. El jeque Bouamrane es un moderado, aceptable para el Estado y el ejército, mientras que Ali Belhadj sigue siendo una voz radical e incendiaria que inspira el apoyo popular pero arriesga una confrontación con las autoridades."
 alg_mufti.3.a: "Apoyar a Belhadj"
 alg_mufti.3.a.tt: "Ali Belhadj se convertirá en el líder, representando una corriente salafista de línea dura."
 alg_mufti.3.b: "Apoyar a Bouamrane"
 alg_mufti.3.b.tt: "El jeque Bouamrane se convertirá en el líder, representando una corriente de ulemas moderados y alineados con el Estado.\n§RNo disponible después de mayo de 2016.§!"
 ALG_ennahda: "Apoyar a Ennahda"
 ALG_ennahda_desc: "Apoyaremos a Abdallah Djaballah y al Movimiento del Renacimiento Islámico, integrando la política islamista en el seno de nuestras instituciones estatales."
 ALG_independent: "Ulemas independientes"
 ALG_independent_desc: "Fortaleceremos la independencia de los ulemas, otorgando a los eruditos religiosos autoridad sobre los asuntos espirituales y, potencialmente, sobre el liderazgo del Estado."
 ALG_grand_mufti_rule: "El Gran Muftí gobierna"
 ALG_grand_mufti_rule_desc: "Los ulemas, o un movimiento político islamista, proporcionarán la autoridad rectora del Estado argelino. El camino que hayamos elegido determinará quién emerge como el rostro de la autoridad islámica."
 ALG_nahda_path: "Eligió el camino de Nahda"
 ALG_ulema_path: "Eligió el camino de los ulemas"
 ALG_belhadj_leader: "Ali Belhadj es el líder"
 ALG_bouamrane_leader: "El jeque Bouamrane es el líder"
 ALG_constitution_1996: "Constitución de 1996"
 ALG_constitution_1996_desc: "La Constitución revisada de 1996 tenía como objetivo estabilizar a Argelia tras la agitación de la Década Negra. Sin embargo, muchas de sus disposiciones se diseñaron pensando en la supervivencia del régimen más que en una democratización genuina. Su rígido marco laico fue considerado por gran parte del movimiento islamista como ilegítimo y «antiislámico». Aunque consolida el control estatal y fortalece la presidencia, también restringe la participación política, reduce la confianza entre el gobierno y la sociedad, y obstaculiza las reformas a largo plazo. El legado de esta constitución sigue pesando gravemente sobre la estabilidad y la legitimidad de Argelia."
 ALG_enahda_media_network_idea: "Red de medios de Ennahda"
 ALG_enahda_media_network_idea_desc: "El movimiento Ennahda ha establecido sus propios canales de comunicación para difundir su mensaje y movilizar el apoyo público. Estos medios promueven valores de inspiración religiosa al tiempo que critican los fracasos del régimen.\n\n§YEste espíritu nacional se eliminará si no estamos alineados con Ennahda§!"
 ALG_supreme_islamic_council_idea: "Consejo Islámico Supremo"
 ALG_supreme_islamic_council_idea_desc: "Se ha establecido un consejo asesor compuesto por altos ulemas y eruditos islámicos para orientar la política estatal de acuerdo con las directrices religiosas. Aunque no ostenta el poder directo, su influencia en la legislación y en la vida pública es significativa.\n\n§YEste espíritu nacional se eliminará si no somos salafistas o islamistas§!"
 alg_constitution.1.t: "La Constitución es reformada"
 alg_constitution.1.d: "Tras años de controversia, la Constitución de 1996 ha sido revisada. El nuevo marco elimina algunas de las disposiciones más autoritarias, introduce controles al poder ejecutivo y busca crear un mejor equilibrio entre las corrientes islámicas y laicas de Argelia. Muchos consideran esto como un paso necesario hacia la reconciliación, mientras que otros dudan de si las reformas cambiarán verdaderamente el sistema atrincherado de le pouvoir."
 alg_constitution.1.a: "Adoptar la nueva Constitución"
 alg_constitution.1.a.tt: "Reemplaza la §YConstitución de 1996§! por una §YConstitución reformada§!, proporcionando bonificaciones a la estabilidad, al poder político y al crecimiento económico."
 ALG_ali_belhadj_desc: "Ali Belhadj, cofundador del Frente Islámico de Salvación (FIS), fue uno de los líderes islamistas más carismáticos y radicales de la turbulenta década de 1990 en Argelia. Conocido por sus sermones incendiarios, su retórica inflexible y su rechazo a la política laica, se convirtió en un símbolo de resistencia al régimen del FLN. Encarcelado durante gran parte de la guerra civil y vetado de la política formal bajo la Constitución de 1996, Belhadj sigue siendo una figura polarizadora: para algunos, la personificación del agravio islamista; para otros, un peligroso recordatorio de la Década Negra. Su posible regreso a la escena política despierta tanto esperanzas de reconciliación como temores de un rebrote del extremismo."
 ALG_bouamrane_desc: "Mohamed Bouamrane emergió en la década de 1990 como un intelectual y actor político islamista más moderado. Abogando por el diálogo en lugar de la confrontación, se posicionó entre los islamistas de línea dura como Ali Belhadj y la atrincherada élite del FLN. Aunque nunca alcanzó el mismo atractivo de masas que el liderazgo del FIS, Bouamrane se convirtió en una figura respetada en los debates de posguerra sobre la reconciliación y la reforma constitucional. Su visión enfatizaba una Argelia donde los valores islámicos pudieran coexistir con las instituciones democráticas, convirtiéndolo en una figura puente en el tenso equilibrio entre la política laica y la religiosa."
 algeria_elections.2024.t: "Las elecciones presidenciales de 2024"
 algeria_elections.2024.d: "Algeria enters another critical election. The three leading figures embody diverging paths: Abdelmadjid Tebboune, promising continuity under the FLN; Youcef Aouchiche, advocating for democratic reform and liberal modernization; and Abdelali Hassani, backed by Islamist currents seeking a greater role for religion in politics. The results reflect the balance of power among the factions."
 algeria_elections.2024.a: "Abdelmadjid Tebboune asegura su reelección."
 algeria_elections.2024.b: "Youcef Aouchiche gana la presidencia."
 algeria_elections.2024.c: "Abdelali Hassani asciende con el respaldo islamista."
 ALG_tebboune_2024_tt: "§YAbdelmadjid Tebboune§! se mantiene como presidente con el dominio del FLN."
 ALG_aouchiche_2024_tt: "§YYoucef Aouchiche§! se convierte en presidente, liderando a los liberales reformistas."
 ALG_hassani_2024_tt: "§YAbdelali Hassani§! se convierte en presidente, respaldado por los movimientos islamistas."
 algeria_gspc.1.t: "Nabil Sahraoui se hace cargo del GSPC"
 algeria_gspc.1.d: "El descontento ha crecido en el seno del Grupo Salafista para la Predicación y el Combate (GSPC). Muchos comandantes han acusado a Hassan Hattab de debilidad, criticando su vacilación a la hora de emprender una yihad a gran escala. A mediados de 2003, Hattab fue marginado por sus propios hombres, y Nabil Sahraoui, una figura mucho más radical, se ha declarado el nuevo emir del GSPC."
 algeria_gspc.1.a: "La insurgencia se radicaliza aún más."
 ALG_sahraoui_rise_tt: "§YNabil Sahraoui§! reemplaza a Hassan Hattab como el nuevo líder del GSPC."
 algeria_gspc.2.t: "Sahraoui abatido, emerge Droukdel"
 algeria_gspc.2.d: "En junio de 2004, las fuerzas de seguridad argelinas abatieron a Nabil Sahraoui en un enfrentamiento. Sin embargo, su muerte no ha debilitado a la insurgencia; por el contrario, el liderazgo ha pasado a manos de Abdelmalek Droukdel, un ambicioso estratega con vínculos con la red global de Al Qaeda. Bajo su mando, es probable que el GSPC expanda e internacionalice su yihad."
 algeria_gspc.2.a: "Comienza una era más letal."
 ALG_droukdel_rise_tt: "§YAbdelmalek Droukdel§! se convierte en el líder del GSPC."
 algeria_gspc.3.t: "Hassan Hattab se rinde"
 algeria_gspc.3.d: "Tras años prófugo, el fundador del GSPC, Hassan Hattab, se ha rendido a las autoridades argelinas. Desilusionado con el rumbo del movimiento que un día creó, Hattab aceptó el programa de amnistía del gobierno. Aunque su influencia había disminuido, su rendición representa una victoria simbólica para el Estado argelino."
 algeria_gspc.3.a: "Un símbolo de derrota para la insurgencia."
 ALG_hattab_surrender_tt: "§YHassan Hattab§! se rinde, reduciendo la actividad de la insurgencia."
 alg_generals.1.t: "Abdelkader Lounès es nombrado comandante de la Fuerza Aérea"
 alg_generals.1.d: "El general de división Abdelkader Lounès ha sido nombrado comandante de la Fuerza Aérea Argelina. Conocido por su enfoque en la modernización, supervisará el desarrollo del poder aéreo de Argelia durante la próxima década."
 alg_generals.1.a: "Nuestros cielos están en buenas manos."
 alg_generals.2.t: "Amar Amrani asume el mando de la defensa aérea"
 alg_generals.2.d: "El general de división Amar Amrani ha sido puesto a cargo de las Fuerzas de Defensa de Tierra-Aire de Argelia. Su liderazgo fortalecerá la capacidad de Argelia para defender su espacio aéreo frente a amenazas extranjeras."
 alg_generals.2.a: "Nuestra defensa aérea se fortalece."
 alg_generals.3.t: "Menad Nouba se convierte en comandante de la Gendarmería"
 alg_generals.3.d: "El general Menad Nouba ha sido nombrado comandante de la Gendarmería Nacional de Argelia. Con la tarea de la seguridad interna y la contrainsurgencia, su liderazgo será crucial para mantener el orden doméstico."
 alg_generals.3.a: "Una mano firme para la seguridad de Argelia."
 ALG_ouyahia_pm: "Ahmed Ouyahia como primer ministro"
 ALG_belkhadem_pm: "Abdelaziz Belkhadem como primer ministro"
 ALG_interim_president.1.t: "Se declara la presidencia interina"
 ALG_interim_president.1.d: "Tras la dimisión de Bouteflika, Argelia se enfrenta a un vacío de poder. Por mandato constitucional, Abdelkader Bensalah, presidente de la cámara alta, es investido como presidente interino por 90 días. El Hirak rechaza este nombramiento, viéndolo como parte del mismo sistema corrupto."
 ALG_interim_president.1.a: "Nombrar a Abdelkader Bensalah"
 ALG_bouteflika_resigns.1.t: "Bouteflika dimite"
 ALG_bouteflika_resigns.1.d: "Bajo una inmensa presión por semanas de protestas del Hirak y la retirada de apoyo del estamento militar, el presidente Abdelaziz Bouteflika ha dimitido formalmente. Su presidencia de dos décadas ha terminado, dejando el futuro de Argelia en la incertidumbre."
 ALG_bouteflika_resigns.1.a: "La era de Bouteflika ha terminado."
 ALG_hirak.100.t: "La voz del Hirak"
 ALG_hirak.100.d: "Desde Argel hasta Orán, desde Constantina hasta Tamanrasset, millones de personas han marchado cada viernes exigiendo «Yetnahaw Ga3» (Tienen que irse todos). El antiguo régimen se ha desmoronado. Ahora, el Hirak debe elegir: ¿quién llevará el espíritu del 22 de febrero al palacio presidencial de El Mouradia?"
 ALG_hirak.100.a: "Zoubida Assoul – La voz constitucional"
 ALG_hirak.100.b: "Karim Tabbou – El campeón de la calle"
 ALG_hirak.100.c: "Hakim Addad – La generación de RAJ"
 ALG_hirak.100.e: "Amira Bouraoui – La feroz hija de Barakat"
 ALG_african_trade_links: "Vínculos comerciales africanos"
 ALG_african_trade_links_desc: "A través de iniciativas económicas y diplomáticas reforzadas en toda África, Argelia está expandiendo su red de acuerdos comerciales, reduciendo la dependencia de mercados externos y asegurando la prosperidad mutua con nuestros socios continentales."
 ALG_african_mediation_role: "Papel de mediación africana"
 ALG_african_mediation_role_desc: "Argelia se ha posicionado desde hace tiempo como un mediador de confianza en las disputas africanas. Al participar activamente en la resolución de conflictos, podemos fortalecer nuestra legitimidad en el continente y expandir nuestra influencia diplomática."
 ALG_african_union_reforms: "Impulsar reformas en la Unión Africana"
 ALG_african_union_reforms_desc: "La Unión Africana sigue teniendo una eficacia limitada. Al presionar para que se realicen reformas, fortalecer sus instituciones, promover la rendición de cuentas y construir consensos, podemos asegurar que Argelia se convierta en un líder respetado dentro del marco continental de África."
 ALG_african_economic_integration: "Integración económica africana"
 ALG_african_economic_integration_desc: "La integración económica continental es clave para la prosperidad de Argelia. Al reducir las barreras comerciales y mejorar los vínculos con los socios africanos, reduciremos la dependencia de los mercados extranjeros y fomentaremos un crecimiento sostenible dentro de África."
 ALG_expand_african_investments: "Expandir las inversiones africanas"
 ALG_expand_african_investments_desc: "A través de empresas respaldadas por el Estado y la cooperación con socios africanos, Argelia puede expandir las inversiones en infraestructura, energía y comercio. Estas inversiones impulsarán nuestra economía al tiempo que fortalecerán los lazos en todo el continente."
 ALG_PT: "PT (Workers' Party)"
 ALG_PT_desc: "PT (Parti des travailleurs) is a Trotskyist political party in Algeria, closely linked with the Independent Workers' Party of France. The party is led by Louisa Hanoune. The Workers' Party, which uses the abbreviation \"PT\", advocates for the protection and promotion of trade union movements in Algeria, and promotes an egalitarian doctrine calling for a better distribution of wealth among the people. The creation of this party dates back to 1990, one year after the constitutional reform which introduced a multiparty system. Its Secretary General is Louisa Hanoune, who in 2004 was the first woman in the Arab world to stand as a candidate for a presidential election."
 ALG_communist_education: "Educación comunista"
 ALG_communist_education_desc: "Las mentes jóvenes son las más influenciables. Inculcar los valores básicos del comunismo en las generaciones más jóvenes mientras se enseña a los estudiantes universitarios la gloria de la igualdad podría hacer avanzar enormemente nuestra causa."
 ALG_labour_focus_unions: "Contactar con los sindicatos"
 ALG_labour_focus_unions_desc: "Los sindicatos estarán muy contentos de tener un gobierno dispuesto no solo a cooperar, sino a ceder a sus demandas. Nos aseguraremos de que su influencia no se extienda más allá de nuestra llegada al poder para evitar §Rconflictos de intereses.§!"
 ALG_failures_capitalism: "Fracasos del capitalismo"
 ALG_failures_capitalism_desc: "El capitalismo ya no nos bendice con la riqueza infinita que prometió. ¡Es hora de que sigamos nuestro propio camino para asegurar que una crisis así nunca pueda volver a suceder! §REl efecto de este enfoque escala según la magnitud de la crisis de la deuda.§!"
 ALG_working_class: "La clase obrera"
 ALG_working_class_desc: "La clase obrera: donde los sueños nacen y mueren. Podemos prometerles que serán tratados bien y recibirán el crédito que merecen por ser el fundamento del nuevo Estado comunista."
 ALG_communist_propaganda: "Máquina de propaganda"
 ALG_communist_propaganda_desc: "Debido a nuestra creciente influencia, podemos permitirnos desatar la máquina de propaganda sobre Argelia. Aunque el mantenimiento monetario es alto, esta propaganda no es algo que deba ignorarse; será extremadamente eficaz para convertir a la población argelina."
 ALG_prepare_government: "Preparar un gobierno"
 ALG_prepare_government_desc: "Al establecer un gobierno dentro de nuestro partido político, aseguramos una transición eficaz que nos permite actuar de acuerdo con nuestros objetivos más rápido de lo que nuestros rivales pueden reorganizarse. Esto será costoso, pero considerando nuestras probabilidades de ganar, es una apuesta bien colocada."
 ALG_damn_market: "Maldito mercado libre"
 ALG_damn_market_desc: "Estamos en posición de dar el golpe final a los capitalistas. ¡Con el poder de la propaganda de nuestro lado, podemos asestar el golpe mortal a la economía de libre mercado y, en el proceso, usurpar el trono del exceso en el que se sientan los capitalistas!"
 ALG_election_com: "Exigir elecciones inmediatas"
 ALG_election_com_desc: "¡Camaradas, el momento es ahora! ¡Todo nuestro avance hacia un nuevo Estado libre ha llevado a este momento! \n\n§R¡Nos aseguraremos de que el gobierno del pueblo gobierne por otros 1000 años!§!"
 PT_flag: "PT"
 ALG_failures_capitalism_TT: "§REl efecto de este enfoque escala según la magnitud de la crisis de la deuda.§!"
 ALG_communist_takeover_TT: "§G¡El pueblo argelino exige elecciones!§!\n\nAsegúrate de tener suficiente poder político guardado para esto. Si §Rfracasas§! al elegir y formar un gobierno, §Rnecesitarás celebrar otras elecciones extraordinarias§! para empoderar a §Y[Communist-State_L]§!"
 ALG_increase_drift_TT: "§G¡Aumenta la deriva política hacia este partido!§!"
 ALG_wild_unions: "Sindicatos descontrolados"
 ALG_wild_unions_desc: "Les dimos poder a los sindicatos y lo están usando; no vemos ningún problema con ello."
 ALG_wild_unions_2: "Sindicatos descontrolados"
 ALG_wild_unions_2_desc: "Se otorgó una gran libertad a los sindicatos durante nuestro ascenso al poder. Ahora que somos victoriosos, apelamos a ellos únicamente para asegurarnos el corazón del pueblo antes de consolidar por completo nuestra de base de poder."
 ALG_wild_unions_3: "Sindicatos descontrolados"
 ALG_wild_unions_3_desc: "¡Los sindicatos son simplemente insoportables, ya no podemos aguantarlos más! Comenzaron como una molestia, pero se han convertido en una obstrucción para la voluntad del Estado. ¡Deben ser pacificados o destruidos!"
 ALG_press_opposition: "Oposición mediática"
 ALG_press_opposition_desc: "Los medios de comunicación no nos han retratado de la mejor manera desde que restauramos el orden en el gobierno, pero es lógico que los débiles teman a los fuertes."
 ALG_one_party: "Estado de partido único"
 ALG_one_party_desc: "Tras declarar que el PT es el único partido político permitido en Argelia, tenemos el poder de hacer lo que queramos, pero a costa de la sangre que habrá que derramar para asegurar que nuestro pueblo sea sumiso."
 ALG_reorganize_army_idea: "Reorganizando el ejército"
 ALG_reorganize_army_idea_desc: "No podemos simplemente desfinanciar al ejército hasta el punto de la disfunción. Puede llegar el momento en que necesitemos unas fuerzas armadas poderosas y, ante esta eventualidad, nos aseguraremos de que nuestro ejército sea leal y esté preparado."
 ALG_new_army_idea: "Un nuevo ejército"
 ALG_new_army_idea_desc: "Hemos visto un gran éxito en la policía asumiendo el papel de fuerza de defensa principal. Sin embargo, sabemos que no están lo suficientemente equipados como para repeler una invasión extranjera. Construiremos un nuevo ejército enfocado únicamente en la defensa de Argelia para garantizar la seguridad de nuestro pueblo."
 ALG_red_army_idea: "Un ejército rojo"
 ALG_red_army_idea_desc: "Hemos infundido un fanatismo ideológico profundo no solo en las filas de nuestro ejército, sino también en la población civil, asegurando que tendremos la mano de obra y la lealtad necesarias para desplegar un ejército formidable."
 ALG_cracked_foundation: "Cimientos agrietados"
 ALG_cracked_foundation_desc: "Los cimientos del Estado se han contradicho tantas veces a estas alturas que si continuamos por nuestro camino actual podríamos enfrentarnos a una terrible nueva revolución. \n\n§R¡Si nuestra estabilidad cae por debajo del 30%, nos enfrentaremos a una revolución en Argelia!§!"
 ALG_militarist_education_idea: "Educación militarista"
 ALG_militarist_education_idea_desc: "El sistema educativo ha integrado los valores de las fuerzas armadas en su plan de estudios, lo que permite un mayor estado de preparación en caso de ataques repentinos."
 ALG_elam: "Resurgimiento del Frente Popular Nacional"
 ALG_elam_desc: "El Frente Popular Nacional ha expandido enormemente sus esfuerzos en todos los ámbitos para influir en la mente del votante medio. Sospechamos que Argelia es la causa de esta «disrupción»."
 algeria.5.t: "El PT convoca elecciones en Argelia"
 algeria.5.d: "Tras ganarse el apoyo mayoritario de la clase obrera de Argelia y de varias figuras políticas, el Parti des Travailleurs (PT) ha pedido al gobierno la celebración de elecciones libres. El PT ha atraído un apoyo masivo y las autoridades se encuentran bajo presión desde múltiples bandos para ceder. Muchos esperan que el PT gane de forma decisiva, ya que su base entre los trabajadores y los sindicatos se fortalece día a día. Un portavoz advirtió que si se niegan las elecciones, los trabajadores iniciarán un levantamiento para derrocar al gobierno."
 algeria.5.a: "¡Trabajadores de Argelia, levantaos!"
 algeria.5.b: "Interesante"
 algeria.7.t: "Argelia se desplaza hacia la izquierda"
 algeria.7.d: "Con el aumento del desempleo y el empeoramiento de la desigualdad económica, la clase obrera de Argelia se ha unido detrás del partido de extrema izquierda Parti des Travailleurs (PT). El PT denuncia las políticas neoliberales y las violaciones de los derechos de los trabajadores, al tiempo que respalda posturas antioccidentales y organiza protestas para presionar al gobierno. Su influencia crece rápidamente, marcando un giro decisivo hacia la izquierda en la política argelina."
 algeria.7.a: "Trabajadores de Argelia, vuestra liberación se acerca"
 algeria.7.b: "Interesante"
 ALG_family_centric: "Centrado en la familia"
 ALG_family_centric_desc: "Estamos fomentando a las familias como el bloque de construcción principal de la sociedad argelina."
 ALG_religion_in_schools: "Educación religiosa"
 ALG_religion_in_schools_desc: "Nuestro sistema educativo incorpora la religión estrechamente en el plan de estudios, asegurando que las generaciones más jóvenes se críen con sólidos valores islámicos."
 ALG_grand_mufti_appointed: "Gran Muftí de Argelia"
 ALG_grand_mufti_appointed_desc: "Se ha nombrado a un Gran Muftí para interpretar la ley islámica en Argelia, reforzando la legitimidad religiosa del Estado."
 ALG_islam_above_the_nation: "El Islam por encima de la nación"
 ALG_islam_above_the_nation_desc: "Durante el turbulento pasado de Argelia, tanto el nacionalismo como el Islam compitieron por el dominio a la hora de dar forma al Estado. Para nuestro futuro, el Islam debe servir como el principio rector de la gobernanza, por encima de todo lo demás."
 ALG_family_is_a_central_unit: "La familia por encima de todo"
 ALG_family_is_a_central_unit_desc: "El núcleo de la sociedad es la familia. Un hombre, una mujer y sus hijos constituyen los cimientos de la nación. Las familias fuertes asegurarán la prosperidad y el éxito de Argelia en los años venideros."
 ALG_follow_religious_law: "Seguir la ley religiosa"
 ALG_follow_religious_law_desc: "La ley islámica es la mejor base para gobernar un país. Adoptarla como nuestro fundamento garantizará la justicia y la equidad para todos los argelinos."
 ALG_traditional_role_for_women: "Rol tradicional para las mujeres"
 ALG_traditional_role_for_women_desc: "Las mujeres ostentan el mayor honor al criar a los hijos y cuidar de sus familias. Mientras los hombres trabajan fuera, las mujeres deben salvaguardar las tradiciones de la nación en el hogar."
 ALG_religious_education: "Educación religiosa"
 ALG_religious_education_desc: "Nuestras escuelas deben incorporar estrechamente los estudios religiosos en sus planes de estudio. Desde la infancia, los argelinos deben aprender el Corán y las prácticas islámicas."
 ALG_appoint_grand_mufti: "Nombrar a un Gran Muftí"
 ALG_appoint_grand_mufti_desc: "Argelia requiere un Gran Muftí para interpretar la ley islámica. Deberíamos nominar a un erudito respetado para que proporcione orientación religiosa al Estado."
 ALG_abrogate_secular_constitution: "Derogar la Constitución laica"
 ALG_abrogate_secular_constitution_desc: "La constitución actual mantiene un marco laico heredado desde la independencia. La única ley que debemos seguir es el Corán, no los textos redactados por el hombre."
 ALG_enahda_media_network: "Red de medios de Ennahda"
 ALG_enahda_media_network_desc: "Deberíamos establecer una red de televisión nacional para transmitir el mensaje del Gran Muftí y promover los valores islámicos en toda Argelia."
 ALG_supreme_islamic_council: "Consejo Islámico Supremo"
 ALG_supreme_islamic_council_desc: "Para salvaguardar el nuevo Estado, debemos crear un Consejo Islámico Supremo, un órgano asesor que apoye al Gran Muftí y garantice que Argelia permanezca firmemente en el camino de la fe."
 ALG_edu_and_social_policy: "Educación y política social"
 ALG_edu_and_social_policy_desc: "La prosperidad a largo plazo de Argelia depende de algo más que de los recursos naturales: descansa sobre los cimientos de la educación, la sanidad y la protección social. Al reformar estos sectores, podemos forjar un nuevo contrato social para el siglo XXI."
 ALG_expand_primary_education: "Expandir la educación primaria"
 ALG_expand_primary_education_desc: "Ampliar el acceso a las escuelas primarias tanto en las zonas rurales como urbanas reducirá el analfabetismo y sentará las bases para el desarrollo nacional."
 ALG_reform_secondary_curriculum: "Reformar el plan de estudios de secundaria"
 ALG_reform_secondary_curriculum_desc: "Nuestras escuelas secundarias deben ser reformadas para satisfacer las demandas de una economía moderna, preservando al mismo tiempo la identidad argelina."
 ALG_western_curriculum: "Adoptar el plan de estudios occidental"
 ALG_western_curriculum_desc: "Al integrar planes de estudio de orientación occidental, podemos exponer a nuestra juventud a las ciencias modernas y a los estándares globales, mejorando la competitividad de Argelia."
 ALG_national_curriculum: "Fortalecer el plan de estudios nacional"
 ALG_national_curriculum_desc: "En lugar de copiar modelos extranjeros, deberíamos centrarnos en la arabización y en los valores culturales argelinos en nuestras escuelas para preservar la soberanía en la educación."
 ALG_university_reform: "Reforma universitaria"
 ALG_university_reform_desc: "Nuestras universidades deben ser ampliadas y modernizadas para formar a los profesionales, investigadores e innovadores que puedan liderar el futuro de Argelia."
 ALG_basic_healthcare_access: "Acceso a la sanidad básica"
 ALG_basic_healthcare_access_desc: "Cada argelino merece tener acceso a servicios sanitarios básicos. Ampliar la cobertura es el primer paso hacia una nación más saludable."
 ALG_state_hospitals: "Expandir los hospitales estatales"
 ALG_state_hospitals_desc: "Al invertir en un sistema hospitalario dirigido por el Estado, podemos garantizar una atención médica gratuita y accesible para todos los argelinos, aunque a un coste significativo para la tesorería."
 ALG_modernize_state_hospitals: "Modernizar los hospitales estatales"
 ALG_modernize_state_hospitals_desc: "Actualizar el equipamiento, capacitar a los médicos y mejorar la infraestructura fortalecerá la red de salud del Estado."
 ALG_universal_healthcare: "Sanidad universal"
 ALG_universal_healthcare_desc: "La atención médica es un derecho, no un privilegio. Argelia se comprometerá a construir un sistema de salud plenamente universal."
 ALG_private_healthcare: "Fomentar la sanidad privada"
 ALG_private_healthcare_desc: "Al promover los hospitales y clínicas privadas, podemos reducir la carga sobre el Estado e introducir la competencia de mercado en la atención médica."
 ALG_expand_private_clinics: "Expandir las clínicas privadas"
 ALG_expand_private_clinics_desc: "Las clínicas privadas pueden complementar al sistema público ofreciendo servicios más especializados, especialmente en las zonas urbanas."
 ALG_national_insurance: "Sistema de seguro nacional"
 ALG_national_insurance_desc: "Un plan nacional de seguro de salud unificará tanto la atención médica pública como la privada bajo una única red de seguridad para los ciudadanos argelinos."
 ALG_minimum_income_guarantee: "Garantía de ingresos mínimos"
 ALG_minimum_income_guarantee_desc: "El Estado garantizará un nivel mínimo de ingresos para los más vulnerables, protegiendo a los argelinos de la pobreza absoluta."
 ALG_housing_support: "Ayuda a la vivienda"
 ALG_housing_support_desc: "Los programas de vivienda subsidiada proporcionarán hogares asequibles para las familias trabajadoras y reducirán el hacinamiento urbano."
 ALG_childcare_support: "Apoyo al cuidado infantil"
 ALG_childcare_support_desc: "Apoyar a los centros de cuidado infantil y las asignaciones familiares ayudará a las familias jóvenes a criar a sus hijos sin dificultades financieras."
 ALG_fuel_subsidies: "Subsidios al combustible"
 ALG_fuel_subsidies_desc: "Al subsidiar los precios del combustible, podemos hacer que el transporte y la calefacción sean asequibles para los argelinos de a pie, incluso si eso sobrecarga la tesorería."
 ALG_food_subsidies: "Subsidios a los alimentos"
 ALG_food_subsidies_desc: "Proteger el precio del pan y de los alimentos esenciales garantizará que ninguna familia argelina pase hambre."
 ALG_welfare_consolidation: "Consolidar el Estado del bienestar"
 ALG_welfare_consolidation_desc: "Al fusionar nuestros programas sociales en un sistema de bienestar integral, Argelia establecerá una red de seguridad social moderna."
 ALG_civil_rights_protections: "Protección de los derechos civiles"
 ALG_civil_rights_protections_desc: "Garantizar los derechos y libertades fundamentales fortalecerá la estabilidad nacional y reducirá los agravios."
 ALG_gender_equality: "Promover la igualdad de género"
 ALG_gender_equality_desc: "Empoderar a las mujeres argelinas a través de la igualdad de derechos y oportunidades es clave para construir una sociedad justa y próspera."
 ALG_freedom_of_press: "Garantizar la libertad de prensa"
 ALG_freedom_of_press_desc: "Una prensa libre es esencial para la democracia y la rendición de cuentas. Apoyar a los medios de comunicación independientes dará a los argelinos una voz más fuerte."
 ALG_judicial_reform: "Reforma judicial"
 ALG_judicial_reform_desc: "Un poder judicial moderno e independiente garantizará juicios justos, reducirá la corrupción y fortalecerá el estado de derecho."
 ALG_civil_society_empowerment: "Empoderar a la sociedad civil"
 ALG_civil_society_empowerment_desc: "Apoyar a las ONG, a los sindicatos y a las organizaciones de base creará una sociedad más participativa y resiliente."
 ALG_digital_government: "Gobierno digital"
 ALG_digital_government_desc: "La digitalización reducirá la burocracia, mejorará la transparencia y acercará los servicios gubernamentales a la gente."
 ALG_public_service_efficiency: "Eficiencia del servicio público"
 ALG_public_service_efficiency_desc: "Al modernizar el sector público, podemos eliminar las ineficiencias y mejorar la prestación de los servicios."
 ALG_anti_corruption_campaign: "Campaña contra la corrupción"
 ALG_anti_corruption_campaign_desc: "La corrupción socava al Estado. Una campaña integral contra ella restaurará la confianza en las instituciones de Argelia."
 ALG_e_governance_portal: "Portal de administración electrónica"
 ALG_e_governance_portal_desc: "La creación de una plataforma integrada de administración electrónica proporcionará a los ciudadanos unos servicios públicos transparentes, rápidos y accesibles."
 ALG_streamlined_bureaucracy: "Optimizar la burocracia"
 ALG_streamlined_bureaucracy_desc: "Al reducir los trámites burocráticos y modernizar las estructuras administrativas, Argelia se volverá más eficiente y competitiva."
 ALG_social_contract_21st_century: "Un contrato social para el siglo XXI"
 ALG_social_contract_21st_century_desc: "A través de reformas educativas, sanitarias, de bienestar, de derechos civiles y administrativas, Argelia forjará un nuevo contrato social que garantizará la estabilidad, la justicia y la prosperidad para las generaciones venideras."
 ALG_corrupt_mil_idea: "Ejército corrupto"
 ALG_corrupt_mil_idea_desc: "El ejército argelino, aunque es poderoso y está profundamente arraigado en la política, sufre una corrupción generalizada. Los recursos destinados a la modernización y la eficiencia son desviados por los generales y las redes de clientelismo. Esto socava la capacidad operativa y erosiona la confianza pública, dificultando las reformas al tiempo que afianza el papel del ejército como guardián y obstáculo para el progreso."
 ALG_military_oversight: "Supervisión militar"
 ALG_military_oversight_desc: "El ejército ha establecido una estricta supervisión sobre la política y las instituciones civiles. Aunque esto garantiza la estabilidad y evita el caos, también reduce la transparencia, restringe las reformas y refuerza el dominio de las fuerzas armadas en la vida pública."
 ALG_gas_pipeline_leverage: "Influencia de los gasoductos"
 ALG_gas_pipeline_leverage_desc: "La extensa red de gasoductos de Argelia hacia Europa proporciona una poderosa herramienta de negociación en la política exterior. La dependencia energética hace que los socios se muestren cautelosos, pero también crea una excesiva dependencia de las exportaciones de hidrocarburos para mantener la influencia política."
 ALG_resource_curse: "La maldición de los recursos"
 ALG_resource_curse_desc: "A pesar de sus inmensas reservas de petróleo y gas, Argelia lucha contra la «maldición de los recursos». La dependencia de los hidrocarburos alimenta la corrupción, desalienta la diversificación y expone la economía a la volatilidad de los mercados energéticos mundiales."
 ALG_PM_Elections: "Nombrar a un primer ministro"
 ALG_PM_Elections_desc: "\n£MAIN_desctext_elections\n\n\n\nEl presidente debe decidir sobre el nombramiento de un primer ministro para encabezar el gobierno. Esta elección no es meramente administrativa; los diferentes candidatos representan visiones opuestas para el futuro de Argelia, desde tecnócratas leales hasta reformistas de la oposición."
 ALG_authority_more_70: "Los §YReformistas§! poseen al menos un §Y70%§! de £generic_anarchist_communism influencia dentro del gobierno argelino de [ROOT.GetFlag]"
 ALG_PNA_victory_tt: "§YLe Pouvoir§! hold more than §Y45%§! of the Influence within the Balance of Power."
 ALG_prime_minister_name_loc: "Primer ministro"
 ALG_minister_bio_loc: "Titular de la autoridad ejecutiva bajo el mandato del presidente."
 algeria_morocco.1.t: "La cuestión de Marruecos"
 algeria_morocco.1.d: "Las relaciones de Argelia con Marruecos han estado ensombrecidas durante mucho tiempo por el amargo legado de la Guerra de las Arenas, el conflicto del Sáhara Occidental y décadas de fronteras cerradas. Con las tensiones aún latentes, la cuestión de cómo abordar la relación con Marruecos cobra gran importancia. ¿Debería Argelia redoblar su histórica rivalidad o intentar trazar un nuevo rumbo de diálogo y cooperación?"
 algeria_morocco.1.a: "El futuro del Magreb está en juego."
 ALG_morocco_question: "La cuestión marroquí"
 ALG_morocco_question_desc: "Nuestra rivalidad con Marruecos por el Sáhara Occidental, la Guerra de las Arenas y el cierre de la frontera durante décadas han dejado a Argelia debilitada. Debemos decidir: ¿nos enfrentaremos a Marruecos o buscaremos la reconciliación?\n\n§YEste enfoque da inicio a la rama de la cuestión marroquí.§!"
 ALG_sand_war_legacy: "El legado de la Guerra de las Arenas"
 ALG_sand_war_legacy_desc: "Las heridas de la Guerra de las Arenas de 1963 aún perduran. Los argelinos recuerdan las ambiciones marroquíes sobre nuestro territorio, y muchos piden una renovada vigilancia."
 ALG_close_the_border: "Cerrar la frontera"
 ALG_close_the_border_desc: "La frontera con Marruecos sigue siendo una fuente de contrabando, disturbios y espionaje. Cerrarla enviará un fuerte mensaje de desafío."
 ALG_border_security_investments: "Inversiones en seguridad fronteriza"
 ALG_border_security_investments_desc: "Debemos reforzar la frontera occidental con puestos militares permanentes, vigilancia moderna y unidades de la gendarmería para mantener a raya la influencia marroquí."
 ALG_counter_moroccan_influence: "Contrarrestar la influencia marroquí"
 ALG_counter_moroccan_influence_desc: "Marruecos busca activamente aliados en el extranjero. Argelia debe contrarrestar esta ofensiva diplomática, mermando su influencia en África y más allá."
 ALG_support_polisario_struggle: "Apoyar la lucha del Polisario"
 ALG_support_polisario_struggle_desc: "El pueblo saharaui merece la independencia. Al apoyar al Frente Polisario, Argelia refuerza su papel como defensor de la lucha anticolonial en el Magreb."
 ALG_internationalize_conflict: "Internacionalizar el conflicto"
 ALG_internationalize_conflict_desc: "La cuestión del Sáhara Occidental debe elevarse a la ONU, la UA y a todos los foros posibles para presionar diplomáticamente a Marruecos."
 ALG_african_union_pressure: "Movilizar a la Unión Africana"
 ALG_african_union_pressure_desc: "A través de la Unión Africana, Argelia construirá una coalición de estados que presionen a Marruecos para que acepte la autodeterminación saharaui."
 ALG_seek_dialogue_morocco: "Buscar el diálogo con Marruecos"
 ALG_seek_dialogue_morocco_desc: "Argelia debe explorar las vías diplomáticas con Marruecos. Aunque las guerras y rivalidades del pasado nos dividen, el diálogo puede conducir a la estabilidad regional."
 ALG_confidence_building: "Medidas de fomento de la confianza"
 ALG_confidence_building_desc: "Pequeños pasos como la creación de comités conjuntos y la reducción de las restricciones de visados pueden sentar las bases para una confianza duradera con Marruecos."
 ALG_reopen_borders: "Reabrir las fronteras"
 ALG_reopen_borders_desc: "Tras años de cierre, la reapertura de la frontera al libre movimiento de personas y mercancías supondría un punto de inflexión histórico en nuestras relaciones."
 ALG_economic_cooperation: "Cooperación económica"
 ALG_economic_cooperation_desc: "La interdependencia económica con Marruecos traerá prosperidad, reducirá las tensiones y fortalecerá el papel regional de Argelia."
 ALG_security_cooperation: "Cooperación en seguridad"
 ALG_security_cooperation_desc: "Las amenazas compartidas como el terrorismo y el contrabando requieren patrullas conjuntas e intercambio de información. La cooperación es más eficiente que la rivalidad."
 ALG_towards_maghreb_union: "Hacia una Unión del Magreb"
 ALG_towards_maghreb_union_desc: "Junto con Marruecos, Argelia puede sentar las bases de una fuerte Unión del Magreb, evocando los sueños de nuestros antepasados de lograr la unidad del norte de África."
 ALG_morocco.1.t: "Debate de la ONU sobre el Sáhara Occidental"
 ALG_morocco.1.d: "Argelia ha llevado la cuestión del Sáhara Occidental ante las Naciones Unidas, condenando el control de Marruecos sobre el territorio. Los delegados debaten si Marruecos debería retirarse o si Argelia se está extralimitando en sus funciones."
 ALG_morocco.1.a: "Condenar duramente a Marruecos"
 ALG_morocco.1.b: "Impulsar resoluciones y sanciones moderadas"
 ALG_moroccan_rivalry_start: "Tensiones fronterizas con Marruecos"
 ALG_moroccan_rivalry_start_desc: "Décadas de hostilidad con Marruecos, alimentadas por la Guerra de las Arenas, el Sáhara Occidental y el cierre de fronteras de 1994, pesan gravemente sobre Argelia. Estas tensiones perjudican nuestra economía, estabilidad y preparación militar.\n§REste espíritu nacional no se puede eliminar de forma normal.§!\nSolo se reducirá, reemplazará o eliminará progresando a través del árbol de enfoques de la §YCuestión marroquí§!."
 ALG_moroccan_rivalry_A1: "Contrarrestar la influencia marroquí"
 ALG_moroccan_rivalry_A1_desc: "Argelia ha tomado medidas para mitigar la influencia marroquí en la región. La rivalidad persiste, pero los efectos se gestionan de manera más eficaz."
 ALG_moroccan_rivalry_A2: "Rivalidad intensificada"
 ALG_moroccan_rivalry_A2_desc: "Las tensiones con Marruecos siguen mermando los recursos del Estado, pero nuestra determinación y las reformas han limitado su impacto."
 ALG_moroccan_rivalry_A_final: "Preparación militar contra Marruecos"
 ALG_moroccan_rivalry_A_final_desc: "A través de años de confrontación, Argelia ha forjado un ejército curtido y capaz, listo para el conflicto. La rivalidad ha extraído fuerza de la adversidad."
 ALG_moroccan_reconciliation_B1: "Iniciativas diplomáticas"
 ALG_moroccan_reconciliation_B1_desc: "Argelia ha dado pasos tentativos hacia el diálogo con Marruecos, creando oportunidades para una cooperación limitada y el fomento de la confianza."
 ALG_moroccan_reconciliation_B2: "Apertura de fronteras"
 ALG_moroccan_reconciliation_B2_desc: "Con la profundización de los lazos diplomáticos, Argelia ha reabierto sus fronteras con Marruecos, reduciendo la presión económica y fomentando el comercio regional."
 ALG_moroccan_reconciliation_B_final: "Cooperación en el Magreb"
 ALG_moroccan_reconciliation_B_final_desc: "Argelia y Marruecos han abrazado la cooperación, permitiendo el comercio, el desarrollo y el liderazgo regional. La rivalidad finalmente ha quedado atrás."
 ALG_morocco_question_tt: "§YEste enfoque da inicio a la rama de la Cuestión marroquí.§!\n\n- §RCamino A:§! Seguir la confrontación con Marruecos - Debilita gradualmente la penalización del espíritu nacional, terminando con un §GEjército más fuerte§!.\n- §GCamino B:§! Buscar la reconciliación con Marruecos - Cambia el espíritu nacional negativo por la mejora de §GBonificaciones positivas§!, terminando con una §YEconomía y Diplomacia§! más fuertes."
 alg_general.1.t: "El regreso de Khaled Nezzar"
 alg_general.1.d: "Con la decisión de revivir los métodos de la Década Negra, se recurre una vez más al controvertido exministro de Defensa, Khaled Nezzar. Su enfoque de puño de hierro puede estabilizar al ejército, pero arriesga alienar a la población y atraer críticas internacionales."
 alg_general.1.a: "El pasado regresa para guiar al presente."
