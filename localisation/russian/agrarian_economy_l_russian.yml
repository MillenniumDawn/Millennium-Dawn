l_russian:
 agrarian_economy: "Аграрная экономика"
 agrarian_economy_desc: "[FROM.GetName] — крайне бедная страна, экономика которой держится в основном на сельском хозяйстве. Пока страна модернизируется и входит в новое тысячелетие, народ будет трудиться в полях, помогая экономике.\n\n§Y$agrarian_economy$§! приносит §Y[ROOT.GetName]§! §Y$$§![?additional_income_agrarian_economy|+3] §Yмлрд§! в неделю.\n\n§RПри ВВП/чел. в $$20 000 мы будем считаться индустриальной страной и утратим бонус к сельскому хозяйству!§!"
 agri_farmer_opinion_TT: "Мнение §Y$farmers$§! повышено на §G10§!, пока действует этот национальный дух"
 AGRI_standard_drought_ongoing: "Локальная засуха"
 AGRI_standard_drought_ongoing_desc: "[ROOT.GetName] в настоящее время страдает от локальной засухи, вызванной нехваткой воды в отдельных районах страны. Скорее всего, она пройдёт без ухудшения ситуации для [ROOT.GetName] или её соседей."
 AGRI_harsh_drought_ongoing: "Региональная засуха"
 AGRI_harsh_drought_ongoing_desc: "[ROOT.GetName] страдает от региональной засухи: вода не поступает в целые регионы страны. Вероятно, от этой засухи пострадают и соседи [ROOT.GetName]."
 AGRI_extreme_drought_ongoing: "Широкомасштабная засуха"
 AGRI_extreme_drought_ongoing_desc: "В настоящее время [ROOT.GetName] страдает от широкомасштабной засухи, вызванной нехваткой воды на обширных территориях страны, и почти наверняка [ROOT.GetName] будет страдать от неё в течение длительного времени, с большой вероятностью соседи [ROOT.GetName] испытают на себе её последствия."
 agrarian_economy_additional_income_TT: "$$[?additional_income_agrarian_economy|+3] от §Y$agrarian_economy$§!\n"
