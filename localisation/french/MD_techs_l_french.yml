 GNSS9: "GNSS2045"
 GNSS9_desc: "Satellite conçu pour faire partie d'une constellation fournissant des services mondiaux de positionnement, de navigation et de temps. Extrêmement utile à des fins civiles comme militaires.\n\nSatellite de navigation mondiale (GNSS 2045) :\nLe satellite §Y$GNSS9$§! est un satellite GNSS d'une précision de §Y0,007 m§!. Ils sont requis pour un §Ysystème satellitaire GNSS 0,007 m§!."
