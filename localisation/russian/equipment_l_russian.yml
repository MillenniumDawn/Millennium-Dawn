 UKR_SP_R_arty_0: "БМ-21 «Град»"
 UKR_SP_R_arty_0_desc: "Редко применяемая в современных операциях, эта «прародительница» SAMS и РСЗО использовалась в основном во Второй мировой войне и в Афганистане. Эффективна на дальности до 20 км."
 UKR_SP_R_arty_1: "БМ-30 «Смерч»"
 UKR_SP_R_arty_1_desc: "Эта машина представляет собой более современную версию «Града», способную действовать в любой точке мира — в снегах, во льдах или в пустыне. Эффективная дальность стрельбы — 35 км."
 UKR_SP_R_arty_2: "Вильха"
 UKR_SP_R_arty_2_desc: "Чрезвычайно тяжёлая артиллерийская батарея, которая, если её не остановить, способна уничтожить целые города. Максимальная дальность — до 90 км."
 UKR_SP_arty_0: "2С1 «Гвоздика»"
