 korea.140.t: "The Millennium Democratic Party Is Founded"
 korea.140.d: "President Kim Dae-jung's National Congress for New Politics has dissolved into a new governing party, the Millennium Democratic Party. The party brings in fresh reformist recruits from business, academia and civic groups to broaden the government's base beyond its Honam heartland."
 korea.140.a: "A new party for a new millennium."
 korea.141.t: "The Uri Party Is Founded"
 korea.141.d: "Lawmakers loyal to President Roh Moo-hyun have broken away from the Millennium Democratic Party to found the Uri Party. The new party promises to end regional politics and pursue sweeping reform, and it now carries the banner of the governing camp."
 korea.141.a: "The governing camp splits."
 korea.142.t: "The Anti-Imperialist National Democratic Front"
 korea.142.d: "The National Democratic Front of South Korea, the underground front run from Pyongyang, has renamed itself the Anti-Imperialist National Democratic Front. Its program of revolution in the South and the expulsion of American forces remains unchanged."
 korea.142.a: "A new name for an old front."
 korea.143.t: "The United Liberal Democrats Join the Grand National Party"
 korea.143.d: "The United Liberal Democrats have voted to dissolve, and the Grand National Party has absorbed the remnants of the conservative party from the Chungcheong region. Its voters and local organization now pass to the main conservative opposition."
 korea.143.a: "The conservatives consolidate."
 korea.144.t: "The Uri Party Joins the Grand Unified Democratic New Party"
 korea.144.d: "With the presidential election approaching, the Uri Party has merged into the Grand Unified Democratic New Party. The new party unites the governing camp with defectors and civic groups in a single liberal front against the conservatives."
 korea.144.a: "The liberals regroup."
 korea.145.t: "The Liberty Forward Party Absorbs the People First Party"
 korea.145.d: "The Liberty Forward Party, founded by Lee Hoi-chang, has merged with the People First Party to form a conservative force rooted in the Chungcheong region. It stands to the right of the Grand National Party on security and national identity."
 korea.145.a: "A third conservative force."
 korea.146.t: "The United Democratic Party Is Formed"
 korea.146.d: "The Grand Unified Democratic New Party and the Democratic Party have merged into the United Democratic Party. Liberal politicians hope that one party can rebuild an effective opposition to the new conservative government."
 korea.146.a: "The opposition unites."
 korea.147.t: "The United Democratic Party Becomes the Democratic Party"
 korea.147.d: "The United Democratic Party has shortened its name to the Democratic Party. The main liberal opposition now campaigns against the conservative government's deregulation and its plans for large public works."
 korea.147.a: "A simpler name."
 korea.148.t: "The Unified Progressive Party Is Formed"
 korea.148.d: "The Democratic Labor Party has merged with other progressive groups to form the Unified Progressive Party. The merger reunites much of the organized left ahead of the coming elections, with the Korean Confederation of Trade Unions behind it."
 korea.148.a: "The left reunites."
 korea.149.t: "The Democratic United Party Is Formed"
 korea.149.d: "The Democratic Party has merged with civic activists and the Citizens Unity Party to form the Democratic United Party, with the Federation of Korean Trade Unions taking part. The new party campaigns for economic democratization and universal welfare."
 korea.149.a: "A broader liberal front."
 korea.150.t: "The Grand National Party Becomes Saenuri"
 korea.150.d: "The Grand National Party has renamed itself the Saenuri Party, meaning \"New World\", as part of a sweeping rebrand. The party places economic democratization and welfare at the center of its program."
 korea.150.a: "A new world for the conservatives."
 korea.151.t: "The Advancement Unification Party"
 korea.151.d: "The Liberty Forward Party has renamed itself the Advancement Unification Party. The Chungcheong-based conservatives hope the new name will help them rebuild a third force between the two main parties."
 korea.151.a: "A new name in the center."
 korea.152.t: "The Advancement Unification Party Joins Saenuri"
 korea.152.d: "The Advancement Unification Party has merged into the Saenuri Party ahead of the presidential election. The merger unites the conservative camp, bringing its Chungcheong base into the main conservative party."
 korea.152.a: "The right closes ranks."
 korea.153.t: "The Democratic United Party Becomes the Democratic Party"
 korea.153.d: "The Democratic United Party has renamed itself the Democratic Party. The main liberal opposition is repositioning itself toward the center, with a focus on the middle class and small business."
 korea.153.a: "Back to the Democratic Party."
 korea.154.t: "The Justice Party"
 korea.154.d: "The Progressive Justice Party has shortened its name to the Justice Party. The social democrats continue to campaign for chaebol reform, a universal welfare state and the rights of irregular workers."
 korea.154.a: "Justice, plainly put."
 korea.155.t: "The Labor Party"
 korea.155.d: "The New Progressive Party has merged with the Socialist Party and taken the name Labor Party. Its new platform names overcoming capitalism as its ultimate goal."
 korea.155.a: "The socialists regroup."
 korea.156.t: "The New Politics Alliance for Democracy Is Formed"
 korea.156.d: "The Democratic Party has merged with Ahn Cheol-soo's centrist movement to form the New Politics Alliance for Democracy. The party promises a cleaner \"new politics\" alongside its liberal economic program."
 korea.156.a: "A new politics?"
 korea.157.t: "The Unified Progressive Party Is Dissolved"
 korea.157.d: "The Constitutional Court has ordered the dissolution of the Unified Progressive Party, ruling that its activities violated the basic democratic order. The party's lawmakers lose their seats and its organization is banned."
 korea.157.a: "The court has spoken."
 korea.158.t: "The Minjoo Party of Korea"
 korea.158.d: "The New Politics Alliance for Democracy has renamed itself the Minjoo Party of Korea, known in English as the Democratic Party of Korea. The rename follows the departure of Ahn Cheol-soo and his allies."
 korea.158.a: "The Minjoo Party it is."
 korea.159.t: "The Bareun Party Is Founded"
 korea.159.d: "Saenuri lawmakers who broke with the party over the presidential impeachment crisis have founded the Bareun Party. The new party promises a clean, reformist conservatism free of influence-peddling."
 korea.159.a: "The conservatives split."
 korea.160.t: "Saenuri Becomes the Liberty Korea Party"
 korea.160.d: "Battered by the impeachment crisis, the Saenuri Party has renamed itself the Liberty Korea Party. The party presents itself as the defender of liberal democracy and the market economy against the left."
 korea.160.a: "A new name in a crisis."
 korea.161.t: "The Minjung Party Is Formed"
 korea.161.d: "Two parties rooted in the banned Unified Progressive Party have merged to form the Minjung Party. The new party champions workers, farmers and the urban poor, and demands the withdrawal of American forces."
 korea.161.a: "The radical left returns."
 korea.162.t: "The Bareunmirae Party Is Formed"
 korea.162.d: "The centrist People's Party and the reformist conservative Bareun Party have merged into the Bareunmirae Party. The new party hopes to build a lasting third force between the two main camps."
 korea.162.a: "A third force takes shape."
 korea.163.t: "The United Future Party Is Formed"
 korea.163.d: "The Liberty Korea Party has merged with smaller conservative groups to form the United Future Party. The merger unites the right in a single party ahead of the legislative elections."
 korea.163.a: "The right unites."
 korea.164.t: "Ahn Cheol-soo Founds the People Party"
 korea.164.d: "Ahn Cheol-soo has left the Bareunmirae Party and founded the People Party. The new centrist party promises pragmatic government focused on innovation, fiscal discipline and political reform."
 korea.164.a: "The center tries again."
 korea.165.t: "The Christian Liberty Unification Party"
 korea.165.d: "The Christian Liberty Party has renamed itself the Christian Liberty Unification Party. Associated with Pastor Jeon Kwang-hoon, it campaigns against same-sex marriage and accuses the government of steering the country toward socialism."
 korea.165.a: "The far right rebrands."
 korea.166.t: "The Minjung Party Becomes the Progressive Party"
 korea.166.d: "Members of the Minjung Party have voted to rename it the Progressive Party. The party keeps its close ties to the Korean Confederation of Trade Unions and its call for American troops to leave."
 korea.166.a: "A new name for the left."
 korea.167.t: "The People Power Party"
 korea.167.d: "The United Future Party has renamed itself the People Power Party in an effort to broaden its appeal. Its new platform lists basic income among its policies."
 korea.167.a: "Power to the people."
 korea.168.t: "The National Revolutionary Party Is Formed"
 korea.168.d: "The Christian Liberty Unification Party and allied groups around Pastor Jeon Kwang-hoon have formed the National Revolutionary Party. It presents itself as a movement to overturn the government's slide toward socialism."
 korea.168.a: "The street movement organizes."
 korea.169.t: "The Liberty Unification Party"
 korea.169.d: "The National Revolutionary Party has renamed itself the Liberty Unification Party. It continues to mobilize conservative churches and street rallies, and presses the main conservative party from the right."
 korea.169.a: "Another new name."
 korea.170.t: "The People Party Joins the People Power Party"
 korea.170.d: "The People Party has merged into the People Power Party, bringing Ahn Cheol-soo's centrists into the main conservative party."
 korea.170.a: "The center folds into the right."
 korea.171.t: "The Reform Party Is Founded"
 korea.171.d: "Lee Jun-seok, who has left the People Power Party, has founded the Reform Party. It presents itself as a third-way conservative alternative that opposes authoritarianism and statism."
 korea.171.a: "A new challenger on the right."