 BOS_ac_unity_mio_trait_weapon_overhaul:0 "Linha de Revisão de Armas"
 BOS_focus:0 "Árvore de Foco da Bósnia"
 BOS_army_of_the_federation_bosnia_herzegovina:0 "Exército da Federação"
 BOS_army_of_the_federation_bosnia_herzegovina_desc:0 "As formações bósnias e croatas da Federação devem entrar na estrutura de comando nacional sem perder a prontidão operacional."
 BOS_army_of_republic_of_srpska:0 "Exército da República Sérvia"
 BOS_army_of_republic_of_srpska_desc:0 "As formações da República Sérvia devem estar representadas nas novas forças armadas para que a unificação militar perdure."
 BOS_air_doctrine:0 "Revisar a Doutrina Aérea"
 BOS_air_doctrine_desc:0 "O pequeno braço aéreo da Bósnia precisa de uma doutrina adequada à defesa territorial, ao transporte e ao apoio às forças terrestres."
 BOS_air_defence_initiative:0 "Iniciativa de Defesa Aérea"
 BOS_air_defence_initiative_desc:0 "Uma rede de defesa aérea em camadas oferece à Bósnia uma resposta prática a aeronaves hostis sem exigir uma grande frota de caças."
 BOS_apc_armament:0 "Veículos Blindados de Transporte de Pessoal"
 BOS_apc_armament_desc:0 "Equipar as unidades com veículos blindados de transporte de pessoal protegerá a infantaria e dará às formações mecanizadas maior poder de fogo."
 BOS_re_enlist_ratko_mladic:0 "Realistar Ratko Mladić"
 BOS_re_enlist_ratko_mladic_desc:0 "Devolver o comando a Ratko Mladić traria experiência ao custo da reconciliação e da legitimidade internacional."
 BOS_detain_ratko_mladic:0 "Deter Ratko Mladić"
 BOS_detain_ratko_mladic_desc:0 "A cooperação com a justiça internacional afastará Ratko Mladić dos assuntos militares, mas irritará muitos sérvios bósnios."
 BOS_sam_systems:0 "Implantar Sistemas SAM"
 BOS_sam_systems_desc:0 "Locais fixos de mísseis superfície-ar protegerão Sarajevo e a principal infraestrutura militar contra ataques aéreos."
 BOS_aa_personnel_equipment:0 "Equipar as Unidades de Defesa Aérea"
 BOS_aa_personnel_equipment_desc:0 "As equipes móveis de defesa aérea precisam de lançadores, sensores e treinamento modernos para acompanhar as formações terrestres."
 BOS_helicopter_transportation:0 "Expandir o Transporte por Helicópteros"
 BOS_helicopter_transportation_desc:0 "Uma frota maior de helicópteros de transporte apoiará o desdobramento rápido, a evacuação e o socorro em desastres."
 BOS_radar_detection_advancement:0 "Avançar a Detecção por Radar"
 BOS_radar_detection_advancement_desc:0 "Uma estação de radar moderna conectará as unidades de defesa aérea da Bósnia e fornecerá alerta antecipado de aeronaves em aproximação."
 BOS_domestic_production:0 "Produção Nacional de Aeronaves"
 BOS_domestic_production_desc:0 "Uma fábrica militar nacional sustentará o equipamento da força aérea e reduzirá a dependência de fornecedores estrangeiros incertos."
 BOS_national_air_force_scheme:0 "Programa Nacional da Força Aérea"
 BOS_national_air_force_scheme_desc:0 "Um programa nacional da força aérea combinará investimentos em caças, apoio e bases em um único plano de aquisições."
 BOS_house_of_representatives:0 "Fortalecer a Câmara dos Representantes"
 BOS_house_of_representatives_desc:0 "Uma Câmara dos Representantes mais forte dará à legislação nacional um mandato democrático claro, preservando a representação constitucional de cada povo constituinte."
 BOS_bosnian_elections_crisis_gate_tt:0 "Disponível apenas enquanto o país estiver em condições de crise financeira."
 BOS_the_federation:0 "Renovar o Pacto Federal"
 BOS_the_federation_desc:0 "Renovar o pacto federal esclarecerá os poderes das entidades e reduzirá a influência estrangeira, embora cada liderança constituinte tenha de abrir mão de parte de sua liberdade de ação."
 BOS_elections_political:0 "Reformar o Sistema Eleitoral"
 BOS_elections_political_desc:0 "A reforma eleitoral estabelecerá um mandato duradouro para a presidência rotativa e determinará qual coalizão nacional controlará o programa de modernização."
 BOS_balkan_backyard:0 "Quintal dos Bálcãs"
 BOS_balkan_backyard_desc:0 "A memória compartilhada da prosperidade iugoslava pode sustentar um projeto regional voluntário, mas os governos vizinhos devem ser persuadidos, e não pressionados ou coagidos."
 BOS_fight_or_perish:0 "Lutar ou Perecer"
 BOS_fight_or_perish_desc:0 "O estado recorrerá à mão de obra que lhe resta e aceitará o desgaste necessário para sobreviver à guerra civil."
 BOS_unified_armed_forces:0 "Forças Armadas Unificadas"
 BOS_unified_armed_forces_desc:0 "Uma força unificada aceitável para todos os povos constituintes concluirá o programa de recuperação cooperativa e encerrará as medidas financeiras de emergência."
 BOS_anti_federation_propaganda:0 "Desafiar a Federação"
 BOS_anti_federation_propaganda_desc:0 "Desafie a autoridade federal, direcione novas indústrias para a República Sérvia e aprofunde os laços com a Sérvia ao custo da estabilidade nacional."
 BOS_alija_izetbegovic_legacy:0 "Legado de Alija Izetbegović"
 BOS_alija_izetbegovic_legacy_desc:0 "O legado de Alija Izetbegović liga o estado bósnio tanto às instituições democráticas quanto à mobilização de guerra. Seus sucessores devem decidir qual parte dessa herança guiará a Bósnia."
 BOS_european_relations:0 "Reviver o Legado Iugoslavo"
 BOS_european_relations_desc:0 "A aproximação cultural e política em toda a antiga Iugoslávia transformará a nostalgia em apoio à cooperação regional."
 BOS_revive_relation_with_serbia_yugoslavia:0 "Reviver as Relações com [SER.GetName]"
 BOS_revive_relation_with_serbia_yugoslavia_desc:0 "Restaurar os laços oficiais com a Sérvia fortalecerá o governo liderado pela Srpska, ao mesmo tempo que alarmará os líderes bósnios e croatas."
 BOS_eu_loans:0 "Empréstimos de Desenvolvimento da UE"
 BOS_eu_loans_desc:0 "O crédito de desenvolvimento europeu fornecerá liquidez imediata para a reconstrução, ao mesmo tempo que acrescenta uma obrigação de dívida moderada."
 BOS_bosnian_revanchism:0 "Revanchismo Bósnio"
 BOS_bosnian_revanchism_desc:0 "Os líderes revanchistas colocarão as reivindicações de guerra bósnias acima do compromisso de Dayton, fortalecendo interesses militares e arriscando um novo conflito comunitário."
 BOS_western_objectives:0 "Alinhamento Ocidental"
 BOS_western_objectives_desc:0 "Um firme alinhamento ocidental abrirá as instituições euro-atlânticas e a assistência de segurança, fechando a alternativa oriental."
 BOS_eastern_frontier:0 "Alinhamento Oriental"
 BOS_eastern_frontier_desc:0 "A Bósnia buscará parcerias com a Rússia e a Sérvia como contrapeso oriental à supervisão ocidental."
 BOS_a_new_struggle:0 "Uma Nova Luta"
 BOS_a_new_struggle_desc:0 "Organizadores revanchistas mobilizarão redes nacionalistas e enfraquecerão o acordo político do pós-guerra."
 BOS_us_assistance:0 "Assistência Americana"
 BOS_us_assistance_desc:0 "Laços comerciais mais estreitos com os Estados Unidos substituirão as amplas ligações comerciais com a OTAN por uma parceria bilateral focada."
 BOS_bosnian_euro_defence_clause:0 "Garantias de Defesa Europeias"
 BOS_bosnian_euro_defence_clause_desc:0 "Estados europeus importantes decidirão individualmente se garantem a Bósnia à medida que a EUFOR transfere a responsabilidade às instituições nacionais."
 BOS_russo_bosnian_alignment:0 "Parceria Russa"
 BOS_russo_bosnian_alignment_desc:0 "Uma parceria formal com a Rússia aprofundará o comércio oriental e o apoio político sem apagar a soberania da Bósnia."
 BOS_serbian_bosnian_arms_treaty:0 "Tratado de Armamentos [SER.GetAdjective]-Bósnio"
 BOS_serbian_bosnian_arms_treaty_desc:0 "As licenças de produção sérvias acelerarão o rearmamento, ao mesmo tempo que aumentarão a influência de Belgrado sobre a política de defesa bósnia."
 BOS_srpska_supremacy:0 "Supremacia da Srpska"
 BOS_srpska_supremacy_desc:0 "Um programa supremacista desmantelará a divisão de poder e colocará o estado sob as instituições da Srpska, provocando os demais povos constituintes."
 BOS_national_awakening:0 "Despertar Nacional"
 BOS_national_awakening_desc:0 "O movimento revanchista romperá com a supervisão internacional e preparará uma tomada islamista do poder estatal."
 BOS_relax_conscription_laws:0 "Flexibilizar as Leis de Conscrição"
 BOS_relax_conscription_laws_desc:0 "Reduzir o serviço obrigatório aliviará o peso sobre as famílias, à medida que as forças das entidades voltam ao controle civil nacional."
 BOS_cooperation_alignment:0 "Alinhamento Cooperativo"
 BOS_cooperation_alignment_desc:0 "Uma administração conjunta e medidas anticorrupção alinharão as entidades a Sarajevo sem abolir sua autonomia."
 BOS_bosnian_trade_alliance:0 "Parceria de Armas com o Ocidente"
 BOS_bosnian_trade_alliance_desc:0 "Licenças americanas de aeronaves e armas de infantaria sustentarão uma parceria de armas com o Ocidente."
 BOS_beograd_conference:0 "Conferência de Belgrado"
 BOS_beograd_conference_desc:0 "Uma conferência em Belgrado resolverá disputas econômicas e de segurança antes que a Bósnia busque uma aliança oriental mais ampla."
 BOS_muslim_strong_arm:0 "Vanguarda Islamista"
 BOS_muslim_strong_arm_desc:0 "Uma vanguarda islamista consolidará o novo regime e buscará apoio de governos simpatizantes no exterior."
 BOS_muslim_nationalism:0 "Nacionalismo Muçulmano"
 BOS_muslim_nationalism_desc:0 "O nacionalismo muçulmano combinará autoridade religiosa, mobilização e uma política externa intervencionista."
 BOS_demote_serbian_irrational_nationalism_new:0 "Conter os Linha-Dura Sérvios"
 BOS_demote_serbian_irrational_nationalism_new_desc:0 "Os partidos federais isolarão as facções sérvias de linha dura, trocando tensão de curto prazo por um Estado cívico mais forte."
 BOS_accommodate_serbian_pride_new:0 "Acomodar a Autonomia Sérvia"
 BOS_accommodate_serbian_pride_new_desc:0 "Concessões constitucionais reconhecerão a autonomia sérvia e atrairão partidos moderados da Srpska para o governo."
 BOS_nato_status:0 "Buscar Adesão à OTAN"
 BOS_nato_status_desc:0 "A Bósnia buscará a adesão à OTAN somente após a reconciliação interna e o fim da supervisão estrangeira de emergência."
 BOS_union_with_serbia:0 "União com a Sérvia"
 BOS_union_with_serbia_desc:0 "A Sérvia receberá uma proposta negociada de união política e poderá aceitar ou rejeitar a incorporação da Bósnia."
 BOS_mosque_construction:0 "Programa de Construção de Mesquitas"
 BOS_mosque_construction_desc:0 "O apoio estatal a mesquitas e instituições religiosas aprofundará a identidade islâmica do regime."
 BOS_milorad_dodik_new:0 "Marginalizar Milorad Dodik"
 BOS_milorad_dodik_new_desc:0 "Remover a rede de clientelismo de Milorad Dodik reduzirá a corrupção, mas alienará parte do eleitorado da Srpska."
 BOS_european_affairs:0 "Assuntos Europeus"
 BOS_european_affairs_desc:0 "O comércio europeu e as instituições democráticas se tornarão a base da política externa pacífica da Bósnia."
 BOS_pathway_towards_eu_membership:0 "Caminho para a Adesão à UE"
 BOS_pathway_towards_eu_membership_desc:0 "A Bósnia cumprirá os requisitos europeus de infraestrutura e governança enquanto os membros da UE decidem se investem."
 BOS_formation_of_bonds_with_the_eu:0 "Construir Laços Econômicos com a UE"
 BOS_formation_of_bonds_with_the_eu_desc:0 "Laços comerciais ampliados com a União Europeia aprofundarão o acesso a mercados e reduzirão os custos de financiamento."
 BOS_yugoslav_cultural_revival:0 "Renascimento Cultural Iugoslavo"
 BOS_yugoslav_cultural_revival_desc:0 "Filmes, músicas e memoriais de guerra compartilhados, financiados pelo Estado, apresentarão as décadas iugoslavas como uma herança comum, e não como um experimento fracassado."
 BOS_common_market_proposal:0 "Proposta de Mercado Comum"
 BOS_common_market_proposal_desc:0 "Uma oferta de comércio sem tarifas entre os Estados sucessores reconstruirá os laços comerciais rompidos na década de 1990."
 BOS_federal_charter:0 "Redigir uma Carta Federal"
 BOS_federal_charter_desc:0 "Um projeto de constituição publicado para uma federação voluntária dará ao movimento de reunificação um programa político concreto."
 BOS_reconciliation_commission:0 "Comissão de Reconciliação"
 BOS_reconciliation_commission_desc:0 "Uma comissão conjunta sobre as queixas da guerra ouvirá testemunhos dos três povos constituintes e reduzirá o custo interno do projeto iugoslavo."
 BOS_convene_the_federation:0 "Convocar a Federação"
 BOS_convene_the_federation_desc:0 "Sarajevo convocará os governos sucessores para negociar uma federação restaurada assim que o apoio popular permitir."
 BOS_greater_srpska_state:0 "Um Estado da Grande Srpska"
 BOS_greater_srpska_state_desc:0 "O Estado centralizado será reconstruído em torno das instituições da Srpska, substituindo o projeto de união pela supremacia da entidade no país."
 BOS_purge_the_federation:0 "Expurgar a Federação"
 BOS_purge_the_federation_desc:0 "Funcionários bósnios e croatas serão removidos de ministérios, tribunais e comandos policiais, encerrando a resistência organizada ao governo da Srpska."
 BOS_srpska_command_primacy:0 "Primazia de Comando da Srpska"
 BOS_srpska_command_primacy_desc:0 "Oficiais da Srpska ocuparão todos os postos superiores das forças armadas, ligando os militares à liderança da entidade."
 BOS_dominant_entity:0 "A Entidade Dominante"
 BOS_dominant_entity_desc:0 "A Srpska agora governa a Bósnia de fato e de direito. As instituições federais restantes existem para servir à entidade."
 BOS_council_democracy:0 "Democracia de Conselhos"
 BOS_council_democracy_desc:0 "Conselhos de local de trabalho elegerão delegados para os órgãos nacionais, dando ao trabalho organizado um papel constitucional permanente."
 BOS_nationalize_heavy_industry:0 "Nacionalizar a Indústria Pesada"
 BOS_nationalize_heavy_industry_desc:0 "O Estado assumirá participações majoritárias em usinas, minas e fábricas de máquinas e as colocará sob gestão dos conselhos."
 BOS_workers_republic:0 "Proclamar a República dos Trabalhadores"
 BOS_workers_republic_desc:0 "O movimento trabalhista substituirá a ordem pós-Dayton por uma república socialista governada por seus conselhos."
 BOS_business_sector_management:0 "Desenvolver o Setor Empresarial"
 BOS_business_sector_management_desc:0 "Um projeto de escritórios com custo definido em Sarajevo formalizará a economia de serviços, desde que haja trabalhadores suficientes para ocupá-lo."
 BOS_lumber_harvesting:0 "Desenvolver o Setor Florestal"
 BOS_lumber_harvesting_desc:0 "Padrões sustentáveis de manejo florestal e processamento ampliarão as exportações rurais sem depender de outro programa permanente de subsídios."
 BOS_land_mines_desc:0 "Os campos minados da guerra continuam matando civis, restringindo o povoamento e retirando terras produtivas de uso."
 BOS_prep_for_civil_war_map:0 "Preparativos para a Guerra Civil"
 BOS_prep_for_civil_war:0 "Operações de Preparação para a Guerra Civil"
 BOS_prep_for_civil_war_desc:0 "A República Srpska está se rearmando enquanto a Bósnia se aproxima de um novo conflito civil. Operações preparatórias podem garantir armas e melhorar a prontidão do governo antes do início dos combates."
 BOS_bosnian_faction_management:0 "Gestão dos Grupos Constituintes"
 BOS_internal_factions:0 "Os Povos da Bósnia"
 BOS_internal_factions_desc:0 "O acordo de Dayton divide a autoridade entre as instituições nacionais, a Federação da Bósnia e Herzegovina e a República Srpska. A política do governo altera a Confiança, a Estabilidade e a disposição de cada grupo constituinte de fornecer Mão de Obra."
 BOS_return_of_entitled_lands:0 "Integrar Terras Controladas"
 BOS_return_of_entitled_lands_desc:0 "Integre um Estado vizinho controlado depois que ele atingir pelo menos 80% de Conformidade e cair abaixo de 10% de Resistência."
 BOS_islamic_uprising:0 "Destino da Guerra Civil Bósnia"
 BOS_islamic_uprising_desc:0 "Os combatentes do El Mudžahid podem se voltar contra Sarajevo e a República Srpska se a guerra civil durar mais que sua paciência."
 BOS_declare_islamic_takeover:0 "Revolta do El Mudžahid"
 BOS_declare_islamic_takeover_desc:0 "Combatentes islamistas estrangeiros estão se preparando para romper com o governo e estabelecer seu próprio Estado enquanto a guerra civil continua."
 BOS_core_states_2:0 "Integrar [FROM.GetName]"
 BOS_core_states_2_desc:0 "Empenhe recursos políticos e industriais para integrar este Estado vizinho conforme."
 BOS_raid_weapon_stockpiles:0 "Saquear Estoques de Armas"
 BOS_raid_weapon_stockpiles_desc:0 "Apreenda armas de infantaria de depósitos de guerra desprotegidos antes que um novo conflito civil comece."
 BOS_civil_war:0 "A Tempestade Iminente"
 BOS_civil_war_desc:0 "A República Srpska está se preparando para se separar. Se a crise não for resolvida, a guerra civil começará quando esta missão expirar."
 BOS_croats_declare_independence:0 "Croatas Declaram Independência"
 BOS_croats_declare_independence_desc:0 "Comunidades croatas hostis podem apoiar uma secessão da Herzegovina se a Estabilidade nacional continuar baixa."
 BOS_srpska_declares_independence:0 "República Srpska Declara Independência"
 BOS_srpska_declares_independence_desc:0 "Comunidades sérvias hostis podem apoiar a secessão se a Estabilidade nacional continuar baixa."
 BOS_quell_serbians:0 "Reprimir a Oposição Sérvia"
 BOS_quell_serbians_desc:0 "Use medidas coercitivas contra organizações sérvias hostis, reduzindo sua Confiança e Estabilidade e deslocando o apoio partidário."
 BOS_gain_srpska_popular_support:0 "Ganhar o Apoio Popular Sérvio"
 BOS_gain_srpska_popular_support_desc:0 "Financie ações de aproximação e programas locais para melhorar a Confiança e a Estabilidade dos sérvios."
 BOS_fund_bosniak_community_programs:0 "Financiar Programas da Comunidade Bósnia"
 BOS_fund_bosniak_community_programs_desc:0 "Pague, com o tesouro, escolas, clínicas e serviços locais em áreas bósnias. Isso reconstrói a Confiança bósnia como uma campanha política faria, mas com dinheiro em vez de Poder Político."
 BOS_fund_croat_community_programs:0 "Financiar Programas da Comunidade Croata"
 BOS_fund_croat_community_programs_desc:0 "Pague, com o tesouro, escolas, clínicas e serviços locais em áreas croatas. Isso reconstrói a Confiança croata como uma campanha política faria, mas com dinheiro em vez de Poder Político."
 BOS_fund_srpska_community_programs:0 "Financiar Programas da Comunidade Sérvia"
 BOS_fund_srpska_community_programs_desc:0 "Pague, com o tesouro, escolas, clínicas e serviços locais em áreas sérvias. Isso reconstrói a Confiança sérvia como uma campanha política faria, mas com dinheiro em vez de Poder Político."
 BOS_collaboration_with_serbians:0 "Cooperar com Líderes Sérvios"
 BOS_collaboration_with_serbians_desc:0 "Transforme líderes sérvios amistosos em parceiros leais por meio de cooperação política sustentada."
 BOS_quell_bosniaks:0 "Reprimir a Oposição Bósnia"
 BOS_quell_bosniaks_desc:0 "Use medidas coercitivas contra organizações bósnias hostis, aceitando instabilidade imediata para remodelar o apoio partidário."
 BOS_collaboration_with_bosniaks:0 "Cooperar com Líderes Bósnios"
 BOS_collaboration_with_bosniaks_desc:0 "Transforme líderes bósnios amistosos em parceiros leais por meio de cooperação política sustentada."
 BOS_quell_croats:0 "Reprimir a Oposição Croata"
 BOS_quell_croats_desc:0 "Use medidas coercitivas contra organizações croatas hostis, aceitando instabilidade imediata para remodelar o apoio partidário."
 BOS_gain_bosniak_popular_support:0 "Ganhar o Apoio Popular Bósnio"
 BOS_gain_bosniak_popular_support_desc:0 "Financie ações de aproximação e programas locais para melhorar a Confiança e a Estabilidade dos bósnios."
 BOS_collaboration_with_croats:0 "Cooperar com Líderes Croatas"
 BOS_collaboration_with_croats_desc:0 "Transforme líderes croatas amistosos em parceiros leais por meio de cooperação política sustentada."
 BOS_gain_croat_popular_support_desc:0 "Financie ações de aproximação e programas locais para melhorar a Confiança e a Estabilidade dos croatas."
 BOS_destabilize_the_government_desc:0 "Destrua deliberadamente a confiança pública e a prontidão para a guerra. Com a estabilidade e o apoio à guerra tão baixos, entidades sérvias ou croatas hostis podem declarar independência."
 BOS_srpska_faction:0 "Sérvios"
 BOS_bosniak_faction:0 "Bósnios"
 BOS_croat_faction:0 "Croatas"
 srpska_attitude_friendly:0 "§GAmistoso§!"
 BOS_all_factions_at_least_friendly_trigger:0 "Todos os três grupos constituintes estão pelo menos §GAmistosos§!"
 bosniak_attitude_friendly:0 "§GAmistoso§!"
 croat_attitude_friendly:0 "§GAmistoso§!"
 BOS_anti_government_demonstrations_desc:0 "Muitos foram às ruas por causa de nossas ações. A agitação diminuirá quando a Confiança e a Estabilidade do povo afetado se recuperarem."
 BOS_internal_faction_balance:0 "Os Povos da Bósnia"
 BOS_internal_faction_balance_desc:0 "O equilíbrio dos interesses bósnios, croatas e sérvios no aparato estatal determina a estabilidade e o recrutamento."
 BOS_landmine_contamination:0 "Contaminação por Minas Terrestres"
 BOS_landmine_contamination_desc:0 "Campos minados da guerra ainda não limpos nesta região matam civis, restringem o povoamento e mantêm terras produtivas fora de uso."
 BOS_cooperator:0 "Cooperador Bósnio"
 BOS_political_reformer:0 "Reformador Político"
 BOS_presidency_rotation_cooldown:0 "Rodízio Pendente"
 BOS_rotation_of_leaders:0 "Realizar um Rodízio Presidencial"
 BOS_rotation_of_leaders_desc:0 "Transfira a presidência coletiva ao próximo representante constituinte quando o período de rodízio atual terminar."
 BOS_rotation_branch_available_tt:0 "Um dos representantes dos povos constituintes preside atualmente a Presidência"
 BOS_s_bridge_builder:0 "O Construtor de Pontes da Bósnia"
 bos_croat_war_info_tool_tip:0 "§RNOTA§!\nA Herzeg-Bósnia se separará e declarará guerra a nós e à República Srpska.\nAlguns focos ficarão bloqueados até o fim da guerra civil.\nQuando a guerra terminar, um evento os desbloqueará novamente."
 bos_dodik_gains_power_2010_tt:0 "Milorad Dodik chega ao poder por volta de 2010-2011"
 bos_this_will_lock_certain_paths_within_the_focus_tree:0 "§RIsto bloqueará caminhos em algumas partes da árvore de focos§!"
 BOS_united_nations_aid:0 "Ajuda de parceiros internacionais"
 BOS_croats_declare_independence_hidden:0 "Restaurar as Zonas Desmilitarizadas do Pós-Guerra"
 BOS_croats_declare_independence_hidden_desc:0 "Restaure as zonas desmilitarizadas das entidades quando a crise de secessão não tiver evoluído para guerra civil."
 bos_srpska_builds_up:0 "A §YRepública Srpska§! viu nossos atos e iniciou o §Rrearmamento§! de todos os antigos membros do serviço ativo!"
 bos_remove_idea_tooltips:0 "O jogador agora pode justificar objetivos de guerra \nO colapso por guerra civil será removido"
 BOS_financial_crisis_desc:0 "A queda das exportações, a escassez de crédito e o desemprego crescente estão enfraquecendo as finanças públicas da Bósnia. Um programa coerente de recuperação pode encurtar a crise."
 BOS_treasury_higher_than_3_5_tt:0 "Requer mais de §Y$3,5 bilhões§! no tesouro."
 BOS_treasury_higher_than_4_5_tt:0 "Requer mais de §Y$4,5 bilhões§! no tesouro."
 BOS_treasury_higher_than_8_5_tt:0 "Requer mais de §Y$8,5 bilhões§! no tesouro."
 BOS_treasury_higher_than_4_3_tt:0 "Requer mais de §Y$4,3 bilhões§! no tesouro."
 BOS_treasury_higher_than_12_6_tt:0 "Requer mais de §Y$12,6 bilhões§! no tesouro."
 BOS_convene_the_federation_tt:0 "£decision_icon_small A decisão §YConvocar a Federação§! conclui a reunificação quando todos os Estados sucessores atingirem §Y75%§! de Iugonostalgia e nós liderarmos o renascimento"
 BOS_purge_quell_decisions_tt:0 "£decision_icon_small As decisões §YReprimir a Oposição Bósnia§! e §YReprimir a Oposição Croata§! continuam disponíveis"
 BOS_faction_attitude_header:0 "Confiança"
 BOS_faction_stability_header:0 "Efeito Líquido"
 BOS_faction_manpower_header:0 "Mão de Obra"
 BOS_faction_value_unavailable:0 "§gIndisponível§!"
 BOS_STABILITY_TOOLTIP:0 "O §YEfeito Líquido§! mostra os modificadores nacionais combinados que os grupos constituintes produzem atualmente: a mudança na Estabilidade vinda de sua Confiança e a mudança na População Recrutável vinda de sua Mão de Obra."
 BOS_net_stability_factor_display:0 "§YEstabilidade§!: [?ROOT.BOS_internal_faction_stability_factor|%0]"
 BOS_net_manpower_factor_display:0 "§YRecrutas§!: [?ROOT.BOS_internal_faction_manpower_factor|%0]"
 BOS_MANPOWER_TOOLTIP:0 "A §YMão de Obra§! mede os recrutas que cada grupo constituinte fornecerá. Os valores combinados modificam a População Recrutável."
 bos_no_wars_tt:0 "§RNão podemos declarar guerras.§!\nSe a estabilidade cair abaixo de 30% e as facções constituintes não forem leais, o risco de guerra civil aumenta drasticamente."
 bos_serbian_attitude_not_loyal_tt:0 "Requer que os £text_icon_bos_srpska §YSérvios§! estejam abaixo de Confiança §GLeal§!."
 bos_croat_attitude_not_loyal_tt:0 "Requer que os £text_icon_bos_croat §YCroatas§! estejam abaixo de Confiança §GLeal§!."
 bos_srpska_manpower_will_rise_tt:0 "£text_icon_bos_srpska §YSérvios:§! Mão de Obra: [?temp_manpower_change|0+] (Atual: [?THIS.BOS_srpska_manpower|Y0])"
 bos_bosniak_manpower_will_rise_tt:0 "£text_icon_bos_bosniak §YBósnios:§! Mão de Obra: [?temp_manpower_change|0+] (Atual: [?THIS.BOS_bosniak_manpower|Y0])"
 bos_croat_manpower_will_rise_tt:0 "£text_icon_bos_croat §YCroatas:§! Mão de Obra: [?temp_manpower_change|0+] (Atual: [?THIS.BOS_croat_manpower|Y0])"
 bos_bosniak_trust_change_tt:0 "£text_icon_bos_bosniak §YBósnios:§! Confiança no governo: [?temp_trust_change|0+] (Atual: [?THIS.BOS_bosniak_trust|Y0])"
 bos_croat_trust_change_tt:0 "£text_icon_bos_croat §YCroatas:§! Confiança no governo: [?temp_trust_change|0+] (Atual: [?THIS.BOS_croat_trust|Y0])"
 bos_srpska_trust_change_tt:0 "£text_icon_bos_srpska §YSérvios:§! Confiança no governo: [?temp_trust_change|0+] (Atual: [?THIS.BOS_srpska_trust|Y0])"
 bos_bosniak_manpower_change_tt:0 "£text_icon_bos_bosniak §YBósnios:§! Mão de Obra: [?temp_manpower_change|0+] (Atual: [?THIS.BOS_bosniak_manpower|Y0])"
 bos_croat_manpower_change_tt:0 "£text_icon_bos_croat §YCroatas:§! Mão de Obra: [?temp_manpower_change|0+] (Atual: [?THIS.BOS_croat_manpower|Y0])"
 bos_srpska_manpower_change_tt:0 "£text_icon_bos_srpska §YSérvios:§! Mão de Obra: [?temp_manpower_change|0+] (Atual: [?THIS.BOS_srpska_manpower|Y0])"
 BOS_motor_influence_tt:0 "Um fabricante estrangeiro ganhará §Rinfluência§! sobre a Bósnia em troca do investimento."
 BOS_union_serbia_accept_tt:0 "A Sérvia incorpora a Bósnia e assume o controle de suas forças armadas."
 BOS_union_serbia_reject_tt:0 "A Bósnia permanece independente e as relações com a Sérvia se deterioram."
 BOS_military_supplies_accept_tt:0 "Um país que responder envia armas de infantaria à Bósnia."
 BOS_military_supplies_reject_tt:0 "Um país que responder pode preservar seu estoque, piorando as relações com a Bósnia."
 BOS_turkish_supplies_accept_tt:0 "A Turquia envia 2.500 armas de infantaria de seu estoque à Bósnia."
 BOS_albanian_supplies_accept_tt:0 "A Albânia envia 750 armas de infantaria de seu estoque à Bósnia."
 BOS_military_supplies_decline_tt:0 "A Bósnia não recebe equipamento de nós e verá a recusa de forma negativa."
 BOS_civil_war_over:0 "A Guerra Civil Bósnia terminou"
 civil_war_focus:0 "Em Guerra Civil"
 BOS_air_chief:0 "Estado-Maior da Força Aérea Bósnia"
 BOS_air_chief_desc:0 "Um estado-maior aéreo conjunto coordena a limitada aviação de combate da Bósnia, os helicópteros de transporte e as necessidades de apoio terrestre."
 novica_simic: "Novica Simić"
 novica_simic_desc:0 "Um alto comandante sérvio-bósnio voltado à defesa territorial e à preservação da prontidão de combate."
 cvjetko_savic: "Cvjetko Savić"
 cvjetko_savic_desc:0 "Um oficial reformista voltado à reconstrução da estrutura de comando da Bósnia no pós-guerra."
 novak_dukic: "Novak Đukić"
 novak_dukic_desc:0 "Um experiente comandante de campo, adequado a operações especiais e terrenos difíceis."
 miladin_milojcic: "Miladin Milojčić"
 miladin_milojcic_desc:0 "Um oficial de estado-maior voltado à manobra, à mobilidade e ao planejamento operacional."
 anto_jelec: "Anto Jeleč"
 anto_jelec_desc:0 "Um comandante croata-bósnio experiente em operações defensivas e organização de forças."
 senad_masovic: "Senad Mašović"
 senad_masovic_desc:0 "Um oficial profissional voltado aos padrões de treinamento e à integração militar."
 BOS_operation_althea:0 "Operação Althea"
 BOS_operation_althea_desc:0 "A Operação Althea é a missão da União Europeia que sucedeu a SFOR em 2004. Ela apoia o acordo de Dayton e transfere a responsabilidade pela segurança às instituições bósnias."
 BOS_draft_EUFOR:0 "Elaborar a EUFOR"
 BOS_draft_EUFOR_desc:0 "Substitua o mandato da SFOR, liderada pela OTAN e prestes a expirar, por uma missão de paz liderada pela UE."
 BOS_demand_eufor_withdrawal:0 "Exigir a Retirada da EUFOR"
 BOS_demand_eufor_withdrawal_desc:0 "Reduza a presença militar internacional e teste se a Bósnia consegue sustentar uma segurança interna independente."
 BOS_SFOR_title:0 "A Força de Estabilização na Bósnia e Herzegovina"
 BOS_SFOR_title_desc:0 "A Força de Estabilização liderada pela OTAN faz cumprir as disposições militares do Acordo de Dayton e apoia a segurança pós-guerra da Bósnia. Seu mandato pode ser estendido durante uma crise ou encurtado à medida que as instituições nacionais se recuperam."
 BOS_peacekeeper_oversight:0 "Supervisão das Forças de Paz"
 BOS_peacekeeper_oversight_desc:0 "As missões europeias permanecem na Bósnia enquanto as reformas ficam atrás das necessidades de segurança interna."
 BOS_civil_war_operations:0 "Operações da Guerra Civil"
 BOS_civil_war_operations_desc:0 "Coordene ações emergenciais de guerra nas zonas de conflito enquanto a Bósnia permanecer em guerra civil."
 BOS_rotating_presidency:0 "Presidência Rotativa"
 BOS_rotating_presidency_desc:0 "A presidência da Bósnia alterna entre representantes bósnios, croatas e sérvios. O arranjo limita o domínio de um único grupo constituinte, mas as frequentes transferências de autoridade podem interromper a legislação.\n\nAtitude Sérvia: [ROOT.BOS_srpska_attitude]\nAtitude Bósnia: [ROOT.BOS_bosniak_attitude]\nAtitude Croata: [ROOT.BOS_croat_attitude]"
 BOS_more_sfor:0 "Solicitar Extensão do Prazo da SFOR"
 BOS_more_sfor_desc:0 "Peça à OTAN que estenda o mandato da SFOR enquanto a Bósnia permanecer instável política ou economicamente."
 BOS_lower_sfor:0 "Solicitar Redução do Prazo da SFOR"
 BOS_lower_sfor_desc:0 "Encurte o mandato da SFOR enquanto as instituições da Bósnia se preparam para assumir toda a responsabilidade pela segurança."
 BOS_attack_upon_nato_desc:0 "As forças da Bósnia estão em grave desvantagem operacional contra membros da OTAN."
 BOS_sfor_vol_troops:0 "Compromisso de Voluntários da SFOR"
 BOS_sfor_vol_troops_desc:0 "Os participantes da missão de paz podem enviar voluntários rapidamente se a Bósnia voltar à guerra civil."
 BOS_SER_vol_troops:0 "Compromisso de Voluntários Sérvios"
 BOS_SER_vol_troops_desc:0 "A Sérvia pode enviar voluntários rapidamente para apoiar a República Srpska em um novo conflito bósnio."
 BOS_idea_muslim_nationalism:0 "Nacionalismo Muçulmano Mobilizado"
 BOS_idea_muslim_nationalism_desc:0 "O nacionalismo religioso sustenta a mobilização e a intervenção estrangeira, ao mesmo tempo que endurece o regime contra mudanças políticas."
 BOS_idea_srpska_supremacy:0 "Supremacia da Srpska"
 BOS_idea_srpska_supremacy_desc:0 "As instituições da Srpska dominam o Estado e direcionam sua política de recursos, mas a divisão de poder efetivamente acabou."
 BOS_dominant_entity_idea:0 "Entidade Dominante"
 BOS_dominant_entity_idea_desc:0 "O controle do Estado central pela Srpska estabiliza o governo e o endurece contra a influência política estrangeira."
 BOS_workers_front_idea:0 "Frente dos Trabalhadores"
 BOS_workers_front_idea_desc:0 "O trabalho organizado tornou-se uma força política independente. Sua mobilização fortalece o governo, mas abala as instituições existentes."
 BOS_workers_compact:0 "Pacto da União Nacional"
 BOS_workers_compact_desc:0 "O Estado garantiu direitos no local de trabalho e gastos sociais em troca de paz trabalhista e custos operacionais mais altos."
 BOS_worker_managed_economy:0 "Economia Autogerida pelos Trabalhadores"
 BOS_worker_managed_economy_desc:0 "Conselhos de trabalhadores dividem a autoridade com os gerentes das empresas. O sistema eleva a arrecadação de impostos, mas inicialmente perturba a produção industrial."
 BOS_mechanical_modernization:0 "Modernização Mecânica"
 BOS_mechanical_modernization_desc:0 "Maquinário moderno e treinamento técnico converteram a gestão pelos trabalhadores em um modelo industrial mais produtivo."
 BOS_workers_republic_idea:0 "República dos Trabalhadores"
 BOS_workers_republic_idea_desc:0 "Delegados dos conselhos dirigem o Estado e sua indústria. A ordem socialista consolidada acelera a construção e a administração pública."
 BOS_idea_prepping_an_offensive:0 "Ofensiva Preparada"
 BOS_idea_prepping_an_offensive_desc:0 "Suprimentos estocados e planos detalhados de estado-maior melhoram temporariamente a preparação operacional."
 BOS_idea_commence_the_offensives:0 "Impulso Ofensivo"
 BOS_idea_commence_the_offensives_desc:0 "As forças armadas estão empenhadas em uma ofensiva coordenada por toda a frente da guerra civil."
 BOS_idea_rally_the_troops:0 "Tropas Mobilizadas"
 BOS_idea_rally_the_troops_desc:0 "Formações de reserva e recrutas locais estão sustentando o apoio público ao esforço de guerra."
 BOS_idea_mobilize_the_nation:0 "Mobilização Nacional"
 BOS_idea_mobilize_the_nation_desc:0 "A mobilização de emergência acelera as operações militares e a produção licenciada de equipamento de infantaria."
 BOS_idea_dig_in:0 "Defesas Preparadas"
 BOS_idea_dig_in_desc:0 "Engenheiros e unidades de campo estão preparando rapidamente posições defensivas."
 BOS_idea_fight_or_perish:0 "Lutar ou Perecer"
 BOS_idea_fight_or_perish_desc:0 "O governo está recorrendo a Mão de Obra adicional para evitar a derrota na guerra civil."
 BOS_idea_national_sentiment:0 "Sentimento Nacional em Tempo de Guerra"
 BOS_idea_national_sentiment_desc:0 "A propaganda estatal sustenta a mobilização nacionalista durante todo o conflito."
 BOS_religious_identity_idea:0 "Identidade Religiosa"
 BOS_religious_identity_idea_desc:0 "O governo define o Estado por meio de instituições islâmicas e de um programa nacionalista religioso."
 BOS_low_police_budget:0 "Orçamento Policial Baixo"
 BOS_low_police_budget_desc:0 "O financiamento policial reduzido diminui a despesa rotineira, mas enfraquece a resposta do Estado ao crime organizado."
 BOS_bosniak_balkan_aspiration_desc:0 "As forças bósnias estão mobilizadas para preservar o Estado e derrotar os exércitos separatistas sérvio e croata."
 BOS_srpska_balkan_aspiration_desc:0 "A República Srpska está mobilizada para derrotar o governo central da Bósnia e as forças croatas rivais."
 BOS_croat_balkan_aspiration_desc:0 "As forças croatas da Bósnia estão mobilizadas para garantir seu território contra os exércitos bósnio e sérvio."
 BOS_police_high_desc:0 "O financiamento policial ampliado melhora a aplicação da lei e o controle político a um custo fiscal substancial."
 BOS_air_doctrine_review:0 "Revisão da Doutrina Aérea"
 BOS_air_doctrine_review_desc:0 "Estudos e exercícios temporários de estado-maior estão acelerando a adoção de uma doutrina aérea prática."
 BOS_internal_investment_desc:0 "Incentivos ao investimento interno apoiam a indústria civil e reduzem a parcela da produção desviada do uso produtivo."
 BOS_crime_increase_desc:0 "A fiscalização fraca permitiu a expansão do crime organizado, elevando os custos administrativos e para o consumidor."
 BOS_idea_mechanization_of_the_army:0 "Exército Mecanizado"
 BOS_idea_mechanization_of_the_army_desc:0 "Veículos blindados e planejamento móvel dão ao pequeno exército da Bósnia maior alcance operacional a um custo de pessoal administrável."
 BOS_idea_transportation_methods:0 "Transporte Moderno do Exército"
 BOS_idea_transportation_methods_desc:0 "Veículos utilitários padronizados e helicópteros de transporte reduzem o custo e a complexidade da logística militar."
 BOS_idea_the_land_fleet:0 "Frota Mecanizada Integrada"
 BOS_idea_the_land_fleet_desc:0 "Famílias de veículos comuns sustentam uma força equilibrada de transportes e carros blindados sem custos excessivos de aquisição."
 BOS_idea_aerial_dominance:0 "Domínio Aéreo"
 BOS_idea_aerial_dominance_desc:0 "A Bósnia está investindo na prontidão de caças, na qualidade dos pilotos e na coordenação estreita com as forças terrestres."
 BOS_idea_air_defence_initiative:0 "Iniciativa de Defesa Aérea"
 BOS_idea_air_defence_initiative_desc:0 "Defesas antiaéreas terrestres e vigilância oferecem um escudo crível para cidades, bases e formações em campo."
 BOS_idea_apc_armament:0 "Veículos Blindados de Transporte de Pessoal"
 BOS_idea_apc_armament_desc:0 "Transportes blindados padronizados melhoram a proteção da infantaria e a mobilidade de armas combinadas."
 BOS_idea_main_battle_line:0 "Doutrina Antiblindagem Moderna"
 BOS_idea_main_battle_line_desc:0 "Forças móveis antiblindagem permitem à Bósnia enfrentar formações mais pesadas sem manter uma frota cara de tanques."
 BOS_idea_boots_on_the_ground:0 "Exército Centrado na Infantaria"
 BOS_idea_boots_on_the_ground_desc:0 "Infantaria preparada e reservas treinadas formam o núcleo de uma força defensiva adequada ao terreno e ao orçamento da Bósnia."
 BOS_eu_development_loans:0 "Empréstimos de Desenvolvimento da UE"
 BOS_eu_development_loans_desc:0 "O crédito europeu está financiando a reconstrução e aliviando a economia de consumo, mas as condições de pagamento trazem um fardo de juros maior e deixam a Bósnia mais exposta à pressão estrangeira."
 BOS_election_stimulus:0 "Gastos de Ano Eleitoral"
 BOS_election_stimulus_desc:0 "Gastos emergenciais antes da votação estão estabilizando os orçamentos familiares e elevando a confiança pública no governo."
 BOS_reconstruction_drive:0 "Esforço Nacional de Reconstrução"
 BOS_reconstruction_drive_desc:0 "Um programa coordenado de reconstrução está acelerando as obras em todo o país e restaurando aos poucos a confiança pública no Estado."
 BOS_national_mobilization:0 "Estrutura de Mobilização Nacional"
 BOS_national_mobilization_desc:0 "Obrigações claras de reserva ampliam o contingente de mão de obra treinada, e planos defensivos preparados fazem com que qualquer território bósnio ocupado resista a um ocupante com muito mais ferocidade."
 BOS_idea_detain_ratko_mladic:0 "Ratko Mladić Detido"
 BOS_idea_detain_ratko_mladic_desc:0 "A cooperação com a justiça internacional melhorou a confiança ocidental nas instituições da Bósnia."
 BOS_idea_civilian_training:0 "Treinamento de Reservistas Ampliado"
 BOS_idea_civilian_training_desc:0 "Um programa nacional temporário de treinamento está preparando reservistas para a mobilização e a defesa territorial."
 BOS_idea_post_war_clean_up:0 "Programa de Limpeza do Pós-Guerra"
 BOS_idea_post_war_clean_up_desc:0 "A limpeza e a reconstrução coordenadas estão acelerando temporariamente o investimento em comunidades danificadas."
 BOS_pro_bosnia:0 "Formação de um Governo Apoiado pelos Bósnios"
 BOS_pro_bosnia_desc:0 "Um governo apoiado pelos bósnios dirige as instituições do Estado e reduz o custo da administração nacional."
 BOS_pro_srpska:0 "Formação de um Governo Apoiado pelos Sérvios"
 BOS_pro_srpska_desc:0 "Um governo apoiado pelos sérvios dirige as instituições do Estado e prioriza a cooperação de segurança com a República Srpska."
 BOS_civil_war_recovery:0 "Recuperação da Guerra Civil"
 BOS_civil_war_recovery_desc:0 "A nova guerra civil prejudicou a produção, a confiança pública e a capacidade da Bósnia de atrair parceiros."
 BOS_post_war_efforts:0 "Esforço de Recuperação do Pós-Guerra"
 BOS_post_war_efforts_desc:0 "A arrecadação de impostos e os incentivos à reconstrução estão sustentando um aumento temporário do investimento no pós-guerra."
 BOS_milorad_dodik_idea: "Milorad Dodik"
 BOS_milorad_dodik_idea_desc:0 "A rede política de Milorad Dodik obstrui as instituições centrais e fortalece a autonomia da República Srpska."
 BOS_farming_improvements:0 "Melhorias Agrícolas"
 BOS_farming_improvements_desc:0 "Equipamentos modernos e terras mais seguras estão melhorando a produção agrícola e a estabilidade rural."
 BOS_farming_powerhouse:0 "Potência Agrícola"
 BOS_farming_powerhouse_desc:0 "Um setor agrícola produtivo agora sustenta a renda rural, o crescimento populacional e a base tributária."
 BOS_mining_development:0 "Desenvolvimento da Mineração"
 BOS_mining_development_desc:0 "Minas modernizadas estão aumentando a extração de recursos e a atividade local tributável."
 BOS_mining_industry:0 "Indústria de Mineração"
 BOS_mining_industry_desc:0 "O investimento consolidado criou um setor de mineração maior e mais eficiente."
 BOS_lumber_harvesting_idea:0 "Extração de Madeira"
 BOS_lumber_harvesting_idea_desc:0 "Investimentos em silvicultura e processamento estão ampliando a produção de recursos rurais e a atividade tributável."
 BOS_dayton_accords_desc:0 "O acordo de Dayton restringe a expansão e limita o confronto militar com a Sérvia e a Croácia enquanto a Bósnia permanecer em paz."
 BOS_land_mine_removal_efforts_desc:0 "Equipes de desminagem estão reduzindo o fardo sanitário e econômico das terras contaminadas, mas o programa exige financiamento contínuo."
 BOS_trade_deal_with_russia:0 "Acordo Comercial Sarajevo-Moscou I"
 BOS_trade_deal_with_russia_desc:0 "Um acordo limitado com a Rússia apoia o investimento e reduz os custos ao consumidor, ao mesmo tempo que aumenta a influência política oriental."
 BOS_trade_deal_with_russia_expanded:0 "Acordo Comercial Sarajevo-Moscou II"
 BOS_trade_deal_with_russia_expanded_desc:0 "O comércio e o crédito russos ampliados aprofundam a cooperação econômica e o alinhamento político oriental da Bósnia."
 BOS_trade_deal_with_eu:0 "Acordo Comercial com a UE I"
 BOS_trade_deal_with_eu_desc:0 "Um acordo limitado com a União Europeia reduz os custos ao consumidor e apoia a integração democrática e financeira."
 BOS_trade_deal_with_eu_expanded:0 "Acordo Comercial com a UE II"
 BOS_trade_deal_with_eu_expanded_desc:0 "O acesso ampliado aos mercados e ao crédito europeus fortalece o alinhamento econômico ocidental da Bósnia."
 BOS_trade_with_nato:0 "Pacote de Ajuda da OTAN"
 BOS_trade_with_nato_desc:0 "Parceiros da OTAN oferecem assistência econômica que reduz os custos imediatos e incentiva o alinhamento político ocidental."
 BOS_trade_with_usa:0 "Tratado Comercial Conjunto EUA-Bósnia"
 BOS_trade_with_usa_desc:0 "Um acordo bilateral com os Estados Unidos apoia a produção de energia, o acesso do consumidor e o alinhamento político ocidental."
 BOS_gov_old_name:0 "Assembleia Parlamentar da Bósnia"
 BOS_islamic_revolt:0 "Revolta dos Mujahidin Bósnios"
 BOS_islamic_upper:0 "Califado Bósnio"
 bos_workers_republic:0 "República dos Trabalhadores da Bósnia e Herzegovina"
 BOS_events.1.t:0 "Guerra Civil Bósnia"
 BOS_events.1.d:0 "A República Srpska declarou independência e a Bósnia voltou à guerra civil. O governo central deve derrotar as forças separatistas ou arriscar a partição permanente do país."
 BOS_events.1.a:0 "Defender a Bósnia e Herzegovina"
 BOS_events.1.b:0 "Ficar ao lado da República Srpska"
 BOS_events.2.t:0 "Croatas Declaram Independência"
 BOS_events.2.d:0 "Líderes croatas da Bósnia na Herzegovina declararam independência enquanto o país já está dividido pela guerra. O governo central deve restaurar o controle no sul sem abandonar a frente contra a República Srpska."
 BOS_events.2.a:0 "Restaurar a integridade territorial do país"
 BOS_events.2.b:0 "Apoiar os secessionistas croatas"
 BOS_events.4.t:0 "O Fim da Guerra"
 BOS_events.4.d:0 "O governo restaurou o controle sobre a Bósnia e Herzegovina, encerrando a nova guerra civil. A desmobilização, a reconstrução e a reconciliação política podem começar agora."
 BOS_events.4.a:0 "Reintegração total"
 BOS_events.4.b:0 "Autonomia negociada"
 BOS_events.4.c:0 "Entregar a supervisão à administração internacional"
 BOS_events.59.t:0 "O Impasse Descamba para a Guerra"
 BOS_events.59.d:0 "A crise de secessão seguiu seu curso sem um acordo. A República Srpska declarou independência abertamente e o país está em guerra novamente."
 BOS_events.59.a:0 "Manter o país unido pela força"
 BOS_events.60.t:0 "A Herzegovina se Separa"
 BOS_events.60.d:0 "Sem nenhum acordo alcançado, líderes croatas da Herzegovina declararam independência e pegaram em armas contra Sarajevo."
 BOS_events.60.a:0 "Restaurar o controle no sul"
 BOS_events.11.t:0 "Chegam Armas Estrangeiras"
 BOS_events.11.d:0 "Um parceiro regional entregou armas de infantaria para nossas forças. A remessa reforçará a frente e fortalecerá a relação que a sustenta."
 BOS_events.11.a:0 "Distribuir as armas"
 BOS_events.12.t:0 "Greve dos Agricultores"
 BOS_events.12.d:0 "Agricultores diante de preços baixos, terras inseguras e fraco apoio estatal iniciaram uma greve nacional. Seus organizadores exigem investimento agrícola e uma mudança na política econômica."
 BOS_events.12.a:0 "Aceitar uma mudança de governo"
 BOS_events.12.b:0 "Negociar com os agricultores"
 BOS_events.13.t:0 "Acordo com os Grevistas"
 BOS_events.13.d:0 "O governo e os líderes da greve aceitaram um acordo que abrange salários, proteções no local de trabalho e negociações futuras. O acordo encerra os protestos imediatos, mas compromete o Estado com novas obrigações."
 BOS_events.13.a:0 "Honrar o acordo"
 BOS_events.14.t:0 "Greve dos Mineiros"
 BOS_events.14.d:0 "Os mineiros pararam a produção para exigir condições mais seguras, salários confiáveis e turnos mais curtos. A greve está se espalhando pelas comunidades que dependem da indústria."
 BOS_events.14.a:0 "Aceitar uma mudança de governo"
 BOS_events.14.b:0 "Negociar com os mineiros"
 BOS_events.9.t:0 "A Bósnia Pede Armas"
 BOS_events.9.d:0 "[FROM.GetName] pediu armas de infantaria para sua guerra civil. A ajuda ampliaria nossa influência nos Bálcãs, mas o equipamento teria de sair de nossas próprias reservas."
 BOS_events.9.a:0 "Enviar as armas"
 BOS_events.9.b:0 "Preservar nossos estoques"
 BOS_events.34.t:0 "A Bósnia Busca Adesão à OTSC"
 BOS_events.34.d:0 "[FROM.GetName] pediu entrada na OTSC. A adesão estenderia a aliança aos Bálcãs ocidentais, mas também poderia importar as disputas não resolvidas da Bósnia."
 BOS_events.34.a:0 "Admitir a Bósnia"
 BOS_events.34.b:0 "Rejeitar o pedido"
 BOS_events.35.t:0 "Adesão à OTSC Aprovada"
 BOS_events.35.d:0 "A Rússia aprovou nosso pedido. A Bósnia agora compartilha as obrigações de defesa coletiva da OTSC."
 BOS_events.35.a:0 "Aceitar as obrigações"
 BOS_events.36.t:0 "Adesão à OTSC Rejeitada"
 BOS_events.36.d:0 "A Rússia rejeitou nosso pedido e se recusou a estender a aliança aos Bálcãs."
 BOS_events.36.a:0 "Reconsiderar nossa política oriental"
 BOS_events.15.t:0 "Oferta de Cooperação de Armas da Bósnia"
 BOS_events.15.d:0 "[FROM.GetName] propôs um acordo industrial de defesa, pedindo licenças de produção de aeronaves e fuzis sérvios. Laços militares mais estreitos prenderiam Sarajevo a Belgrado, embora alguns na Bósnia vejam a dependência com ressentimento."
 BOS_events.15.a:0 "Conceder as licenças de produção"
 BOS_events.15.b:0 "Recusar o pedido"
 BOS_events.16.t:0 "Belgrado Concede Licenças de Armas"
 BOS_events.16.d:0 "A Sérvia aprovou a transferência de licenças de produção. As fábricas bósnias agora podem construir projetos sérvios, embora o sentimento pró-sérvio entre as comunidades bósnias muçulmanas tenha provocado agitação."
 BOS_events.16.a:0 "Iniciar a produção licenciada"
 BOS_events.17.t:0 "Belgrado Recusa"
 BOS_events.17.d:0 "A Sérvia rejeitou a oferta de cooperação em armamentos, sem querer compartilhar sua indústria de defesa nesses termos."
 BOS_events.17.a:0 "Procurar em outro lugar"
 BOS_events.18.t:0 "Convite de Investimento na Bósnia"
 BOS_events.18.d:0 "[FROM.GetName] está convidando montadoras estrangeiras a instalar produção no país. Construir uma fábrica abriria um novo mercado e ampliaria nossa influência comercial sobre a economia bósnia."
 BOS_events.18.a:0 "Construir uma fábrica na Bósnia"
 BOS_events.18.b:0 "Recusar o convite"
 BOS_events.19.t:0 "Montadora Estrangeira Investe"
 BOS_events.19.d:0 "[FROM.GetName] concordou em construir uma fábrica na Bósnia. O investimento traz empregos e capital, embora o governo do país de origem da fabricante ganhe uma posição em nossa política industrial."
 BOS_events.19.a:0 "Acolher o investimento"
 BOS_events.20.t:0 "Investimento Recusado"
 BOS_events.20.d:0 "[FROM.GetName] recusou, por ora, investir na indústria automotiva da Bósnia."
 BOS_events.20.a:0 "Procurar outra fabricante"
 BOS_events.21.t:0 "Bósnia Quer Comprar Fuzis"
 BOS_events.21.d:0 "[FROM.GetName] deseja comprar um carregamento de armas de infantaria alemãs modernas. A venda renderia divisas e boa vontade em Sarajevo."
 BOS_events.21.a:0 "Aprovar a venda"
 BOS_events.21.b:0 "Recusar a venda"
 BOS_events.22.t:0 "Fuzis Alemães Entregues"
 BOS_events.22.d:0 "A Alemanha aprovou a venda. Um carregamento de armas de infantaria modernas está a caminho de nossos depósitos."
 BOS_events.22.a:0 "Distribuir as armas"
 BOS_events.23.t:0 "Alemanha Recusa a Venda"
 BOS_events.23.d:0 "Berlim recusou vender armas de infantaria à Bósnia neste momento."
 BOS_events.23.a:0 "Buscar outro fornecedor"
 BOS_events.24.t:0 "Bósnia Quer Fuzis Russos"
 BOS_events.24.d:0 "[FROM.GetName] deseja comprar um grande estoque de armas de infantaria russas. O pedido seria uma venda bem-vinda para a indústria russa."
 BOS_events.24.a:0 "Aprovar a venda"
 BOS_events.24.b:0 "Recusar a venda"
 BOS_events.25.t:0 "Fuzis Russos Entregues"
 BOS_events.25.d:0 "A Rússia aprovou a venda. Uma grande remessa de armas de infantaria está a caminho de nossos estoques."
 BOS_events.25.a:0 "Distribuir as armas"
 BOS_events.26.t:0 "Rússia Recusa a Venda"
 BOS_events.26.d:0 "Moscou recusou vender armas de infantaria à Bósnia neste momento."
 BOS_events.26.a:0 "Buscar outro fornecedor"
 BOS_political.4.t:0 "Eleição Pós-Guerra da Bósnia"
 BOS_political.4.d:0 "A primeira eleição nacional do novo século na Bósnia e Herzegovina determinará qual coalizão dirigirá as frágeis instituições pós-guerra do país."
 BOS_political.4.a:0 "Manter o governo liderado pelos bósnios muçulmanos"
 BOS_political.4.a_tt:0 "O §YPartido da Ação Democrática§! liderará o governo. A próxima rotação da presidência passará a um representante sérvio."
 BOS_political.4.b:0 "Apoiar uma coalizão liderada pelos sérvios"
 BOS_political.4.b_tt:0 "A §YAliança dos Sociais-Democratas Independentes§! liderará uma coalizão com o §YPartido Democrático Sérvio§!. A próxima rotação da presidência passará a um representante croata."
 BOS_political.20.t:0 "Acordo Após a Guerra Civil"
 BOS_political.20.d:0 "A guerra acabou. A Bósnia e Herzegovina foi reunida sob uma única autoridade, e a tarefa imediata é estabilizar o Estado enquanto as antigas facções são desmanteladas."
 BOS_political.20.a:0 "Estabelecer a Grande Srpska"
 BOS_political.20.b:0 "Estabelecer um Governo Liderado pelos Croatas"
 BOS_political.20.c:0 "Reunificar a Bósnia Sob o Controle de Sarajevo"
 BOS_political.1.t:0 "O Estado Pós-Guerra"
 BOS_political.1.d:0 "A Bósnia e Herzegovina entra no novo século com instituições danificadas, autoridade dividida e uma recuperação inacabada. O governo deve decidir quanto poder deve permanecer com as entidades."
 BOS_political.1.a:0 "Definir o novo Estado"
 BOS_political.2.t:0 "Autonomia Ampliada das Entidades"
 BOS_political.2.d:0 "O governo transferiu mais autoridade interna à Herzegovina e à República Srpska, mantendo uma política externa e de defesa comum. A Bósnia agora funciona como uma federação mais frouxa."
 BOS_political.2.a:0 "Implementar o acordo"
 BOS_political.3.t:0 "Reunificação Federal"
 BOS_political.3.d:0 "A autonomia ampliada criou jurisdições sobrepostas em comunidades mistas e enfraqueceu os serviços comuns. Os líderes das entidades aceitaram a reunificação sob um acordo federal que preserva a representação local."
 BOS_political.3.a:0 "Reunificar a federação"
 BOS_political.5.t:0 "A Crise Financeira"
 BOS_political.5.d:0 "A crise financeira global reduziu as exportações, restringiu o crédito e levou os empregadores bósnios a demissões. A recuperação exigirá uma política fiscal e industrial coordenada."
 BOS_political.5.a:0 "Preparar um programa de recuperação"
 BOS_political.6.t: "Milorad Dodik"
 BOS_political.6.d:0 "Milorad Dodik consolidou sua liderança na República Srpska e fez da autonomia da entidade o centro de seu programa político. Sua rede crescente complicará toda tentativa de fortalecer as instituições nacionais."
 BOS_political.6.a:0 "Sarajevo deve reagir"
 BOS_political.8.t:0 "Disputa sobre Segregação Vira Violência"
 BOS_political.8.d:0 "Uma disputa sobre a integração de alunos sérvios e bósnios muçulmanos escalou para uma marcha sobre a assembleia municipal. Vandalismo e ataques a negócios de repatriados forçaram a polícia de choque a intervir."
 BOS_political.8.a:0 "As divisões permanecem profundas"
 BOS_political.9.t:0 "Forças de Paz Planejam Redução de Efetivo"
 BOS_political.9.d:0 "A OTAN anunciou uma redução de sua presença de manutenção da paz na Bósnia à medida que a situação de segurança melhora. Os líderes locais divergem sobre se as forças nacionais estão prontas para assumir a missão."
 BOS_political.9.a:0 "Avaliar nossa prontidão"
 BOS_political.10.t:0 "Relatório Documenta Ataques à Imprensa"
 BOS_political.10.d:0 "Um novo relatório registra um aumento de ameaças e agressões contra jornalistas bósnios durante 2002. Organizações nacionalistas e padrinhos políticos locais são responsabilizados por grande parte da intimidação."
 BOS_political.10.a:0 "Proteger a imprensa independente"
 BOS_political.11.t:0 "Nikolić Condenado a 23 Anos"
 BOS_political.11.d:0 "Um tribunal condenou o oficial sérvio-bósnio Dragan Nikolić a 23 anos de prisão por crimes cometidos no campo de detenção de Sušica. A sentença reabriu disputas políticas sobre a responsabilização por crimes de guerra."
 BOS_political.11.a:0 "A justiça deve ser cumprida"
 BOS_political.13.t:0 "Retorno de Refugiados Atinge Novo Recorde"
 BOS_political.13.d:0 "Mais cidadãos deslocados estão voltando à medida que a segurança melhora e as casas são reconstruídas. As autoridades locais devem prover serviços e proteger os repatriados em comunidades onde persistem tensões da guerra."
 BOS_political.13.a:0 "Apoiar o retorno deles"
 BOS_political.14.t:0 "Frio Severo Atinge Refugiados e Repatriados"
 BOS_political.14.d:0 "Um frio severo atingiu comunidades de refugiados e repatriados em toda a Bósnia e Herzegovina. Órgãos nacionais e as Nações Unidas lutam para entregar combustível de aquecimento, abrigo e comida."
 BOS_political.14.a:0 "Mobilizar socorro de emergência"
 BOS_political.15.t:0 "Explosão Danifica o Túmulo de Alija Izetbegović"
 BOS_political.15.d:0 "Um artefato explosivo danificou o túmulo do ex-presidente Alija Izetbegović em Sarajevo. O ataque provocou indignação pública e renovou o temor de violência politicamente motivada."
 BOS_political.15.a:0 "Investigar o ataque"
 BOS_political.17.t:0 "Enchentes no Sudeste da Europa"
 BOS_political.17.d:0 "Chuvas recordes inundaram cidades, danificaram a infraestrutura e provocaram deslizamentos de terra pela Bósnia e Estados vizinhos. Os serviços de emergência enfrentam um longo esforço de socorro e reconstrução."
 BOS_political.17.a:0 "Coordenar o socorro às vítimas"
 BOS_events.55.t:0 "Alija Izetbegović Morre"
 BOS_events.55.d:0 "O ex-presidente Alija Izetbegović morreu de complicações de uma doença cardíaca. Sua morte encerra um capítulo decisivo da política bósnia muçulmana e da luta da Bósnia e Herzegovina pela independência."
 BOS_events.55.a:0 "Honrar seu legado"
 BOS_events.55.b:0 "O Estado deve seguir em frente"
 BOS_political.21.t:0 "Bósnia Pede uma Garantia"
 BOS_political.21.d:0 "[FROM.GetName] nos pediu que garantamos sua independência enquanto a EUFOR transfere a responsabilidade pela segurança às instituições bósnias."
 BOS_political.21.a:0 "Garantir a Bósnia"
 BOS_political.21.b:0 "Recusar o compromisso"
 BOS_political.22.t:0 "Bósnia Propõe União"
 BOS_political.22.d:0 "O governo liderado pela Srpska em [FROM.GetName] propôs a incorporação à Sérvia. A aceitação transferiria o território e as forças armadas da Bósnia para o nosso Estado."
 BOS_political.22.a:0 "Aprovar a união"
 BOS_political.22.b:0 "Preservar os Estados separados"
 BOS_zivko_radisic: "Živko Radišić"
 BOS_ante_jelavic: "Ante Jelavić"
 BOS_halid_genjac: "Halid Genjac"
 BOS_sulejman_tihic: "Sulejman Tihić"
 BOS_mirko_sarovic: "Mirko Šarović"
 BOS_dragan_covic: "Dragan Čović"
 BOS_haris_silajdzic: "Haris Silajdžić"
 BOS_nebojsa_radmanovic: "Nebojša Radmanović"
 BOS_zeljko_komsic: "Željko Komšić"
 BOS_bosnia_random:0 "Um novo representante bósnio muçulmano assumirá a presidência rotativa."
 BOS_serb_random:0 "Um novo representante sérvio assumirá a presidência rotativa."
 BOS_croat_random:0 "Um novo representante croata assumirá a presidência rotativa."
 BOS_events.45.a:0 "Abrir negociações"
 BOS_events.45.d:0 "Funcionários públicos aderiram à agitação trabalhista e exigem salários confiáveis, negociação coletiva e o fim das nomeações por clientelismo."
 BOS_events.45.t:0 "Paralisação do Setor Público"
 BOS_events.46.a:0 "O movimento está se espalhando"
 BOS_events.46.d:0 "As manifestações se expandiram dos locais de trabalho para os centros das cidades enquanto os sindicatos coordenam as demandas além das linhas das entidades."
 BOS_events.46.t:0 "Protestos Trabalhistas em Todo o País"
 BOS_events.47.a:0 "Proteger as instituições públicas"
 BOS_events.47.d:0 "Um confronto diante de um prédio do governo tornou-se violento. Líderes sindicais culpam provocadores, enquanto autoridades de segurança exigem poderes de emergência."
 BOS_events.47.t:0 "Protestos Viram Violência"
 BOS_events.48.a:0 "Reconhecer o novo governo"
 BOS_events.48.d:0 "A antiga coalizão perdeu o controle do parlamento. Um gabinete apoiado pelos trabalhadores agora reivindica a autoridade para reorganizar o Estado e a economia."
 BOS_events.48.t:0 "Trabalhadores Chegam ao Governo"
 BOS_eu_accession:0 "Adesão à União Europeia"
 BOS_eu_accession_desc:0 "A adesão exige o encerramento dos capítulos de negociação um a um. Cada etapa precisa do acordo dos três grupos constituintes, e a República Srpska pode travar o processo sempre que sua liderança se tornar hostil."
 BOS_eu_judicial_reform:0 "Encerrar o Capítulo do Judiciário"
 BOS_eu_judicial_reform_desc:0 "Alinhar o procedimento judicial, a revisão em segunda instância e a independência do Ministério Público aos critérios de adesão à UE."
 BOS_eu_anti_corruption_commitments:0 "Adotar Compromissos Anticorrupção"
 BOS_eu_anti_corruption_commitments_desc:0 "Comprometer-se com metas anticorrupção monitoradas pela UE. Bruxelas não abrirá este capítulo enquanto a captura do Estado for grave."
 BOS_eu_market_alignment:0 "Alinhar-se ao Mercado Único"
 BOS_eu_market_alignment_desc:0 "Adotar os padrões de produtos, procedimentos aduaneiros e regras de concorrência da UE. A conformidade é cara, mas libera fundos de pré-adesão."
 BOS_eu_candidate_status:0 "Garantir o Status de Candidata"
 BOS_eu_candidate_status_desc:0 "Solicitar ao Conselho Europeu que reconheça a Bósnia e Herzegovina como candidata oficial à adesão."
 BOS_eu_open_negotiations:0 "Abrir Negociações de Adesão"
 BOS_eu_open_negotiations_desc:0 "Iniciar negociações formais de adesão com a Comissão Europeia. Espere resistência de Banja Luka à medida que as obrigações em nível estatal aumentam."
 BOS_eu_sign_accession_treaty:0 "Assinar o Tratado de Adesão"
 BOS_eu_sign_accession_treaty_desc:0 "Concluir as negociações e assinar o tratado de adesão. A adesão em si ainda exige um pedido formal à União Europeia."
 BOS_treasury_5_tt:0 "O tesouro possui pelo menos £treasury 5.0"
 BOS_treasury_2_tt:0 "O tesouro possui pelo menos £treasury 2.0"
 BOS_judiciary_meets_eu_standards_tt:0 "O judiciário atende aos critérios de adesão à UE"
 BOS_anti_corruption_framework_tt:0 "Há um marco anticorrupção monitorado pela UE em vigor"
 BOS_market_aligned_with_eu_tt:0 "A regulação interna está alinhada ao mercado único"
 BOS_recognized_eu_candidate_tt:0 "A Bósnia e Herzegovina torna-se candidata reconhecida à adesão à UE"
 BOS_eu_application_open_tt:0 "A Bósnia e Herzegovina agora pode solicitar adesão à União Europeia"
 BOS_economic_development:0 "Desenvolvimento Econômico"
 BOS_economic_development_desc:0 "Programas de investimento com financiamento estrangeiro, privatização e reconstrução para a economia pós-guerra.\n Redes de clientelismo no nível das entidades controlam nomeações, contratos e boa parte da economia. Desmantelá-las é lento e irrita os grupos que lucram com elas."
 BOS_court_turkish_investment:0 "Cortejar Investimento Turco"
 BOS_court_turkish_investment_desc:0 "Abrir as portas a construtoras e bancos turcos. O dinheiro de Ancara entra, e com ele a influência turca sobre Sarajevo."
 BOS_court_gulf_investment:0 "Cortejar Investimento do Golfo"
 BOS_court_gulf_investment_desc:0 "Convidar fundos do Golfo para imóveis, turismo e finanças. O capital eleva o tesouro e estabiliza o humor, e o prestígio de Riad na Bósnia cresce."
 BOS_rapid_privatization:0 "Privatização Rápida"
 BOS_rapid_privatization_desc:0 "Vender rapidamente as empresas estatais a quem quiser comprar. As vendas enchem o tesouro e elevam a produção, mas as pechinchas alimentam a corrupção e inquietam os trabalhadores."
 BOS_transparent_privatization:0 "Privatização Transparente"
 BOS_transparent_privatization_desc:0 "Vender as empresas estatais por meio de licitações abertas e auditadas. A arrecadação é menor e o processo mais lento, mas a corrupção cai e a confiança pública se mantém."
 BOS_thermal_plant_chinese_financing:0 "Usina Térmica Financiada pela China"
 BOS_thermal_plant_chinese_financing_desc:0 "Tomar um empréstimo chinês para expandir uma usina de linhito. A produção sobe de imediato, mas a dívida e a influência de Pequim vêm junto."
 BOS_hydro_refurbishment:0 "Reformar as Usinas Hidrelétricas"
 BOS_hydro_refurbishment_desc:0 "Revisar as barragens e turbinas envelhecidas no Neretva e no Drina. A conta inicial é pesada, mas energia confiável estabiliza a indústria."
 BOS_end_brcko_supervision:0 "Encerrar a Supervisão de Brcko"
 BOS_end_brcko_supervision_desc:0 "Encerrar o regime de supervisão internacional sobre o Distrito de Brcko e entregá-lo por completo às instituições locais. A República Srpska testará o novo arranjo imediatamente."
 BOS_police_restructuring:0 "Reestruturar a Polícia"
 BOS_police_restructuring_desc:0 "Consolidar as polícias fragmentadas das entidades sob um marco estatal, pré-condição da UE para laços mais estreitos. A República Srpska ressente a perda de controle."
 BOS_anti_corruption_investigations:0 "Investigações Anticorrupção"
 BOS_anti_corruption_investigations_desc:0 "Direcionar os promotores estatais contra redes de clientelismo arraigadas. A corrupção cairá, mas o grupo constituinte cujos funcionários forem indiciados ficará inquieto."
 BOS_judicial_appointments:0 "Despolitizar as Nomeações Judiciais"
 BOS_judicial_appointments_desc:0 "Transferir o controle das nomeações judiciais das lideranças partidárias para um conselho independente."
 BOS_depoliticized_judiciary_tt:0 "As nomeações judiciais estão blindadas do controle partidário"
 BOS_public_procurement_reform:0 "Reforma das Compras Públicas"
 BOS_public_procurement_reform_desc:0 "Introduzir licitação aberta para contratos estatais. Publicar as contas custa dinheiro de início e acaba com vários arranjos confortáveis."
 BOS_transparent_procurement_tt:0 "Os contratos estatais são concedidos por licitação aberta"
 BOS_diaspora_investment_drive:0 "Campanha de Investimento da Diáspora"
 BOS_diaspora_investment_drive_desc:0 "Convidar associações empresariais da diáspora a cofinanciar projetos públicos e lançar uma emissão única de títulos para poupadores emigrados."
 BOS_dual_citizenship_outreach:0 "Campanha de Dupla Cidadania"
 BOS_dual_citizenship_outreach_desc:0 "Simplificar os procedimentos de dupla cidadania e o registro consular para que os emigrantes mantenham laços formais com o país. Uma diáspora registrada maior envia mais dinheiro para casa."
 BOS_expanded_dual_citizenship_tt:0 "A renda de remessas da diáspora aumenta em 20%"
 BOS_diaspora_return_program:0 "Programa de Retorno da Diáspora"
 BOS_diaspora_return_program_desc:0 "Financiar auxílios de reassentamento e colocação profissional para famílias que retornam do exterior. Caro, mas o país precisa mais de pessoas do que de dinheiro."
 BOS_treasury_1_tt:0 "O tesouro possui pelo menos £treasury 1.0"
 BOS_dayton_pressure:0 "Dayton Sob Pressão"
 BOS_dayton_pressure_desc:0 "A República Srpska desafia as instituições estatais e ameaça a secessão. Sarajevo pode ceder autonomia, pedir ao Alto Representante que imponha um acordo ou buscar arbitragem internacional."
 BOS_concede_to_srpska_demands:0 "Ceder às Demandas da Entidade"
 BOS_concede_to_srpska_demands_desc:0 "Devolver competências contestadas à República Srpska. A crise termina, ao preço da autoridade central."
 BOS_invoke_bonn_powers:0 "Invocar os Poderes de Bonn"
 BOS_invoke_bonn_powers_desc:0 "Pedir ao Alto Representante que imponha a legislação disputada e afaste funcionários obstrutivos. Eficaz, e profundamente ressentido em Banja Luka."
 BOS_request_international_arbitration:0 "Solicitar Arbitragem Internacional"
 BOS_request_international_arbitration_desc:0 "Encaminhar a disputa à arbitragem internacional. Lenta e custosa, mas encerra o impasse sem recompensar nenhum dos lados."
 BOS_phase_out_ohr_supervision:0 "Encerrar Gradualmente a Supervisão do OHR"
 BOS_phase_out_ohr_supervision_desc:0 "Com as relações entre as entidades estáveis, negociar a transferência dos poderes restantes do Alto Representante às instituições nacionais."
 BOS_dayton_pressure_decisions_available_tt:0 "Respostas à crise estão disponíveis nas decisões de Dayton Sob Pressão"
 BOS_eu_candidate:0 "Candidata à Adesão à UE"
 BOS_eu_candidate_desc:0 "O status de candidata dá à Bósnia e Herzegovina um caminho formal para a adesão, relatórios regulares de progresso e relações mais fáceis com os Estados-membros."
 BOS_eu_negotiations:0 "Negociações de Adesão à UE"
 BOS_eu_negotiations_desc:0 "Os capítulos de adesão estão abertos e a assistência técnica da UE flui para as instituições estatais, acelerando o trabalho administrativo e de infraestrutura."
 BOS_eu_accession_treaty:0 "Tratado de Adesão à UE Assinado"
 BOS_eu_accession_treaty_desc:0 "O tratado de adesão está assinado e a ratificação está em andamento. Os mercados tratam a adesão como certa, e o aparato estatal trabalha com direção clara."
 BOS_eu_accession_funds:0 "Assistência de Pré-Adesão"
 BOS_eu_accession_funds_desc:0 "Os fundos do Instrumento de Assistência de Pré-Adesão financiam infraestrutura, capacidade administrativa e empréstimos estatais mais baratos."
 BOS_republika_srpska_secession_crisis:0 "Crise de Secessão"
 BOS_republika_srpska_secession_crisis_desc:0 "A República Srpska boicota as instituições estatais e prepara a legislação de um referendo. Patronos estrangeiros aguardam uma brecha enquanto o impasse continua."
 BOS_ohr_supervision:0 "Supervisão do OHR"
 BOS_ohr_supervision_desc:0 "O Alto Representante exerce diretamente os poderes de Bonn. Decisões impostas mantêm o Estado funcionando, mas deixam de lado as instituições eleitas."
 BOS_national_reconciliation:0 "Reconciliação Nacional"
 BOS_national_reconciliation_desc:0 "Os três grupos constituintes apoiam o governo do Estado. A cooperação entre entidades é rotina, e não exceção."
 BOS_political.24.t:0 "Status de Candidata Concedido"
 BOS_political.24.d:0 "O Conselho Europeu reconheceu formalmente a Bósnia e Herzegovina como candidata à adesão. A decisão recompensa anos de reformas e obriga Bruxelas a relatar nosso progresso a cada ano."
 BOS_political.24.a:0 "Um futuro europeu"
 BOS_political.25.t:0 "Banja Luka Bloqueia as Negociações"
 BOS_political.25.d:0 "Delegados da República Srpska abandonaram o parlamento estatal, recusando-se a ratificar o marco de negociação a menos que as competências das entidades sejam garantidas por escrito."
 BOS_political.25.a:0 "Negociar o retorno deles"
 BOS_political.25.b:0 "Ratificar sem eles"
 BOS_political.26.t:0 "Estoura Escândalo de Compras Públicas"
 BOS_political.26.d:0 "Jornalistas publicaram contratos que ligam altos funcionários das entidades a licitações públicas fraudadas. A rede alcança ministérios, empresas estatais e pelo menos um partido do governo."
 BOS_political.26.a:0 "Processar a rede"
 BOS_political.26.b:0 "Enterrar a história"
 BOS_political.27.t:0 "República Srpska Ameaça Secessão"
 BOS_political.27.d:0 "A assembleia da entidade em Banja Luka marcou uma votação sobre a saída das instituições estatais, e sua liderança discute abertamente um referendo pela independência."
 BOS_political.27.a:0 "O Estado deve reagir"
 BOS_political.28.t:0 "O Impasse Se Endurece"
 BOS_political.28.d:0 "Meses de boicote se passaram sem acordo. As instituições das entidades agora operam como se a autoridade do Estado fosse opcional, e os moderados de todos os lados perderam terreno."
 BOS_political.28.a:0 "Um precedente perigoso"
 BOS_diaspora_remittances:0 "Remessas da Diáspora"
 BOS_diaspora_remittances_desc:0 "O dinheiro enviado para casa por bósnios que trabalham no exterior equivale a cerca de um décimo do PIB. Chega a lares de todas as partes do país, inclusive àqueles que o orçamento estatal nunca alcança."
 BOS_diaspora_returnees:0 "Diáspora em Retorno"
 BOS_diaspora_returnees_desc:0 "Auxílios de reassentamento trazem famílias de volta da Alemanha, da Áustria e da Escandinávia. Elas chegam com economias, habilidades e filhos."
 BOS_nato_interoperability:0 "Interoperabilidade com a OTAN"
 BOS_nato_interoperability_desc:0 "Exercícios conjuntos, padrões da aliança e programas da Parceria para a Paz estão reconstruindo as forças armadas nos moldes ocidentais."
 BOS_political.29.t:0 "Dinheiro da Diáspora Volta para Casa"
 BOS_political.29.d:0 "A campanha de investimento terminou com compromissos de empresários da diáspora na Europa e na América do Norte. As somas são modestas para padrões internacionais, mas chegam a municípios que investidores estrangeiros ignoram."
 BOS_political.29.a:0 "Boas notícias"
 BOS_political.30.t:0 "Karadžić Está sob Custódia"
 BOS_political.30.d:0 "A notícia vinda de Belgrado se espalhou por Sarajevo em menos de uma hora. Radovan Karadžić, líder dos sérvios da Bósnia durante a guerra, foi preso e será transferido para Haia. Associações de sobreviventes e famílias de vítimas se reúnem em vigílias silenciosas de Sarajevo a Srebrenica. Em Banja Luka, o clima é mais sombrio."
 BOS_political.30.a:0 "Treze anos tarde demais"
 BOS_political.31.t:0 "Mladić Está sob Custódia"
 BOS_political.31.d:0 "Ratko Mladić, comandante do exército que executou o massacre de Srebrenica, foi preso em uma casa de fazenda no norte da Sérvia. Para as mães de Srebrenica, a prisão encerra dezesseis anos de espera. Do outro lado da Linha de Fronteira Interentidades, alguns ainda falam dele como um defensor."
 BOS_political.31.a:0 "A justiça chega a Lazarevo"
 BOS_political.32.t:0 "A Decisão Sejdić-Finci"
 BOS_political.32.d:0 "O Tribunal Europeu de Direitos Humanos decidiu que as regras constitucionais de elegibilidade étnica violam a Convenção Europeia. Dervo Sejdić e Jakob Finci, um ativista romani e um líder da comunidade judaica, não podem concorrer à presidência por não pertencerem a nenhum dos três povos constituintes. Partidos croatas acrescentam que o arranjo atual permite que outros elejam por eles seu membro da presidência. Implementar a decisão exige uma mudança constitucional que ninguém tem pressa em negociar."
 BOS_political.32.a:0 "Emendar Dayton é mais fácil de dizer do que de fazer"
 BOS_sejdic_finci_ruling_tt:0 "§YEstrasburgo decidiu contra as regras constitucionais de elegibilidade étnica. Uma reforma judicial que trate da decisão terá peso extra em Bruxelas.§!"
 BOS_sejdic_finci_addressed_tt:0 "§GA reforma trata da decisão Sejdić-Finci, encerrando uma exigência antiga de Bruxelas.§!"
 BOS_serbia_reaction_tt:0 "A Sérvia decidirá se apoia a República Srpska."
 BOS_croatia_reaction_tt:0 "A Croácia decidirá se apoia a Herzeg-Bósnia."
 BOS_political.33.t:0 "A EUFOR Assume o Comando"
 BOS_political.33.d:0 "Em uma cerimônia no Camp Butmir, a Força de Estabilização liderada pela OTAN entregou formalmente sua missão à União Europeia. A Operação Althea herda as tropas, bases e o mandato da SFOR sob os acordos Berlim Plus. Para a maioria dos bósnios, a única mudança visível é a bandeira na manga."
 BOS_political.33.a:0 "As bandeiras mudam em Butmir"
 BOS_political.34.t:0 "O Primeiro Censo Desde a Guerra"
 BOS_political.34.d:0 "Recenseadores iniciaram a primeira contagem populacional desde 1991. Toda questão de etnia, idioma e fé é terreno disputado, e a República Srpska já anunciou que não aceitará a metodologia de contagem dos cidadãos que vivem no exterior. Por trás dos formulários está a pergunta que ninguém faz em voz alta: quem ainda está aqui."
 BOS_political.34.a:0 "Contar o que resta"
 BOS_political.35.t:0 "Tuzla Está em Chamas"
 BOS_political.35.d:0 "Protestos que começaram diante das fábricas falidas de Tuzla se espalharam para Sarajevo, Zenica e Mostar. Prédios do governo estão em chamas, e as multidões não entoam slogans étnicos, mas exigem empregos e o julgamento das fraudes de privatização. Plenárias de cidadãos se formam para levar suas demandas diretamente aos governos dos cantões."
 BOS_political.35.a:0 "Atender às demandas das plenárias"
 BOS_political.35.b:0 "Restaurar a ordem primeiro"
 BOS_political.36.t:0 "Pedido de Adesão Entregue em Bruxelas"
 BOS_political.36.d:0 "O presidente da Presidência entregou o pedido de adesão da Bósnia à União Europeia à presidência holandesa do Conselho. Anos de adaptação virão antes que o status de candidata esteja ao alcance, mas o pedido compromete todos os níveis de governo, ao menos no papel, com a mesma direção."
 BOS_political.36.a:0 "O caminho será longo"
 BOS_political.37.t:0 "Alto Representante Proíbe a Negação do Genocídio"
 BOS_political.37.d:0 "Em um de seus últimos atos no cargo, o Alto Representante que se despede impôs penas criminais para a negação do genocídio de Srebrenica e a glorificação de criminosos de guerra. Banja Luka explodiu. Líderes da entidade declaram a decisão nula, anunciam um boicote às instituições estatais e falam abertamente em retomar o que Dayton entregou."
 BOS_political.37.a:0 "A lei vale para todos"
 BOS_political.37.b:0 "Manter o Estado fora disso"
 BOS_political.38.t:0 "Banja Luka Vota pela Retirada"
 BOS_political.38.d:0 "A assembleia da entidade instruiu seu governo a retirar a República Srpska do exército estatal, da autoridade tributária e do judiciário em seis meses. As conclusões são apenas declaratórias por ora, mas traçam o caminho para a dissolução em linguagem clara. Embaixadas redigem comunicados, e os fiadores de Dayton são questionados sobre o que o acordo ainda vale."
 BOS_political.38.a:0 "Levar o caso aos fiadores"
 BOS_political.38.b:0 "Esperar Banja Luka piscar"
 BOS_political.40.t:0 "Kosovo Declara Independência"
 BOS_political.40.d:0 "Pristina proclamou a independência da Sérvia. A declaração divide a Bósnia: líderes bósnios muçulmanos e croatas tendem ao reconhecimento, enquanto a República Srpska alerta que é um precedente para sua própria separação."
 BOS_political.40.a:0 "Manifestar apoio à autodeterminação"
 BOS_political.40.b:0 "Rejeitar a declaração unilateral"
 BOS_political.40.c:0 "Manter a neutralidade para preservar a união do Estado"
 BOS_political.41.t:0 "Migrantes se Aglomeram em Una-Sana"
 BOS_political.41.d:0 "Milhares de pessoas que seguem a rota dos Bálcãs Ocidentais estão retidas perto da fronteira croata. As autoridades do Cantão de Una-Sana dizem que os campos estão superlotados e que não conseguem lidar com a situação sozinhas."
 BOS_political.41.a:0 "Solicitar assistência da União Europeia"
 BOS_political.41.b:0 "Reforçar a fronteira e esvaziar os campos"
 BOS_political.42.t:0 "Acordo de Associação com a Europa"
 BOS_political.42.d:0 "A Bósnia e Herzegovina assinou o Acordo de Estabilização e Associação com a União Europeia. É o primeiro passo contratual no longo caminho até a adesão."
 BOS_political.42.a:0 "Um marco rumo à Europa"
 BOS_political.43.t:0 "Um Imposto Estatal sobre Valor Agregado"
 BOS_political.43.d:0 "Um único IVA em nível estatal substitui a antiga colcha de retalhos de impostos de venda das entidades. A arrecadação é centralizada e a receita é repartida por uma conta nacional única."
 BOS_political.43.a:0 "Implementar o imposto unificado"
 BOS_political.43.b:0 "Deixar as entidades manterem suas próprias alíquotas"
 BOS_political.44.t:0 "O Pacote de Abril"
 BOS_political.44.d:0 "Um conjunto negociado de emendas constitucionais fortaleceria o Estado central e simplificaria a presidência. Faltam dois votos na Câmara dos Representantes."
 BOS_political.44.a:0 "Gastar capital para aprovar as reformas"
 BOS_political.44.b:0 "Deixar o pacote fracassar"
 BOS_political.45.t:0 "As Negociações de Butmir"
 BOS_political.45.d:0 "Mediadores americanos e europeus reuniram os líderes partidários em uma base perto de Sarajevo para romper o impasse constitucional. As propostas pedem que as entidades cedam poderes ao Estado."
 BOS_political.45.a:0 "Dialogar com os mediadores"
 BOS_political.45.b:0 "Defender as prerrogativas das entidades"
 BOS_political.46.t:0 "O Distrito de Brcko em Questão"
 BOS_political.46.d:0 "A República Srpska ameaça retirar seus funcionários das instituições compartilhadas do Distrito de Brcko, o corredor autogovernado colocado sob supervisão internacional após a guerra."
 BOS_political.46.a:0 "Defender o status compartilhado do distrito"
 BOS_political.46.b:0 "Ceder terreno para manter a paz"
 BOS_political.47.t:0 "Mostar Sem Governo"
 BOS_political.47.d:0 "Partidos croatas e bósnios muçulmanos não chegam a acordo sobre um estatuto municipal, e Mostar está há anos sem eleições locais válidas. A cidade dividida fica à deriva sem um conselho."
 BOS_political.47.a:0 "Impor um estatuto municipal unificado"
 BOS_political.47.b:0 "Deixar os partidos em seu impasse"
 BOS_political.48.t:0 "O Êxodo se Acelera"
 BOS_political.48.d:0 "Ônibus e voos baratos saindo de Sarajevo, Tuzla e Banja Luka seguem lotados em um só sentido. Jovens formados, artesãos e famílias inteiras partem para Alemanha, Áustria e Croácia mais rápido do que o Estado consegue repor."
 BOS_political.48.a:0 "Encomendar um relatório sobre as causas"
 BOS_political.48.b:0 "Dispensar como mobilidade comum da era da UE"
 BOS_political.49.t:0 "Komšić Vence a Vaga Croata"
 BOS_political.49.d:0 "Željko Komšić venceu a vaga croata da presidência com votos de maioria bósnia muçulmana, derrotando Dragan Čović, da HDZ. Cidades de maioria croata o declaram indesejado, e Zagreb protesta contra um resultado que sua própria comunidade rejeita."
 BOS_political.49.a:0 "Um mandato multiétnico, conquistado limpamente"
 BOS_political.49.b:0 "Os eleitores croatas foram derrotados, não representados"
 BOS_political.50.t:0 "O Impasse do Programa da OTAN"
 BOS_political.50.d:0 "Ministros do SNSD se recusam a deixar o Estado apresentar um Programa Nacional Anual à OTAN, e sem ele o Conselho de Ministros não pode ser formado. Meses se passam sem governo algum."
 BOS_political.50.a:0 "Apresentar o programa mesmo assim"
 BOS_political.50.b:0 "Oferecer em seu lugar um Programa de Reformas rebatizado"
 BOS_political.51.t:0 "Um Governo, Enfim"
 BOS_political.51.d:0 "Catorze meses após a eleição, o Conselho de Ministros tomou posse. Sarajevo tem governo de novo, comprado com um compromisso para salvar as aparências com o qual ninguém está plenamente satisfeito."
 BOS_political.51.a:0 "De volta ao trabalho"
 BOS_political.52.t:0 "Um Alto Representante Sem Mandato"
 BOS_political.52.d:0 "Christian Schmidt assumiu o cargo de Alto Representante, mas o Conselho de Segurança da ONU nunca endossou sua nomeação. Rússia, China e a liderança da República Srpska se agarraram a essa lacuna para chamar sua autoridade de ilegítima."
 BOS_political.52.a:0 "Tudo como de costume em Sarajevo"
 BOS_political.53.t:0 "Reformas Impostas nas Urnas"
 BOS_political.53.d:0 "Com o fechamento das urnas, o Alto Representante usou seus poderes de Bonn para impor emendas à constituição da Federação e à lei eleitoral, ampliando a Câmara dos Povos e fixando prazos para a formação de governos. Críticos chamam isso de constituição imposta; a HDZ diz que já era tempo."
 BOS_political.53.a:0 "Uma solução pragmática, seja como tenha chegado"
 BOS_political.53.b:0 "Um excesso iliberal"
 BOS_political.53.c:0 "Ficar fora da discussão"
 BOS_political.54.t:0 "Banja Luka Anula o Tribunal"
 BOS_political.54.d:0 "A assembleia da entidade aprovou leis que declaram que as decisões do Tribunal Constitucional estatal não se aplicam na República Srpska e proíbem a publicação das decisões do Alto Representante no diário oficial da entidade. A autoridade de Sarajevo agora termina na Linha de Fronteira Interentidades."
 BOS_political.54.a:0 "Contestar por todos os canais disponíveis"
 BOS_political.54.b:0 "Deixar o momento passar"
 BOS_hr_legitimacy_disputed_tt:0 "§RA República Srpska trata as decisões do Alto Representante como nulas, aprofundando a crise§!"
 BOS_political.55.t:0 "Bruxelas Abre as Negociações"
 BOS_political.55.d:0 "Oito anos depois do pedido da Bósnia, o Conselho Europeu concordou em abrir as negociações de adesão. O caminho para a adesão ainda é longo, mas pela primeira vez passa por Bruxelas, e não ao redor dela."
 BOS_political.55.a:0 "Celebrar o marco"
 BOS_political.55.b:0 "Moderar as comemorações"
 BOS_political.57.t:0 "Dodik Condenado e Impedido"
 BOS_political.57.d:0 "O Tribunal da Bósnia e Herzegovina condenou Milorad Dodik por desafiar as decisões do Alto Representante e o impediu de ocupar cargos. As instituições da República Srpska devem decidir se aceitam a sentença ou a desafiam."
 BOS_political.57.a:0 "A sentença permanece"
 BOS_political.57.b:0 "A República Srpska não aceitará que lhe digam quem a lidera"
 BOS_reject_third_entity_demand:0 "Rejeitar a Demanda por uma Terceira Entidade"
 BOS_reject_third_entity_demand_desc:0 "Descartar a reestruturação da Federação em uma entidade separada de maioria croata. Os partidos bósnios muçulmanos ficam aliviados; os croatas dizem que é prova de que Sarajevo nunca os ouvirá."
 BOS_concede_partial_croat_autonomy:0 "Conceder Autonomia Croata Parcial"
 BOS_concede_partial_croat_autonomy_desc:0 "Conceder aos cantões de maioria croata um autogoverno ampliado, aquém de uma terceira entidade completa. Responde à queixa central da HNS, ao custo de mais uma camada de governo a coordenar."
 BOS_register_defence_property:0 "Registrar a Propriedade de Defesa como Estatal"
 BOS_register_defence_property_desc:0 "Transferir para os registros do Estado os sítios militares ainda reivindicados pelas entidades, a condição que a OTAN estabeleceu para ativar um Plano de Ação para a Adesão."
 BOS_request_nato_waiver:0 "Solicitar uma Dispensa da OTAN"
 BOS_request_nato_waiver_desc:0 "Pedir à OTAN que dispense de vez a condição da propriedade de defesa, em vez de esperar o consentimento da República Srpska. Funciona, e Banja Luka não esquece quem pediu."
 BOS_activate_map:0 "Ativar o Plano de Ação para a Adesão"
 BOS_activate_map_desc:0 "Com a questão da propriedade resolvida, adotar o Plano de Ação para a Adesão da OTAN e iniciar o caminho formal rumo à adesão."
 BOS_expand_arms_exports:0 "Expandir as Exportações de Munição e Armas"
 BOS_expand_arms_exports_desc:0 "Apoiar as fábricas de armas ligadas ao Estado enquanto ampliam as exportações para compradores na Europa e além. As carteiras de pedidos estão cheias, e a discussão sobre o destino dos carregamentos também."
 BOS_gulf_investment_delivered_tt:0 "§GBuroj Ozone inicia as obras no prazo§!"
 BOS_gulf_investment_stalled_tt:0 "§RBuroj Ozone emperra muito aquém do prometido§!"
 BOS_host_sarajevo_film_festival:0 "Sediar o Festival de Cinema de Sarajevo"
 BOS_host_sarajevo_film_festival_desc:0 "Apoiar com verbas e logística estatais o maior festival de cinema do Sudeste da Europa. Ele atrai turistas e imprensa a Sarajevo todo verão e mantém o perfil cultural da cidade bem à frente dos vizinhos."
 BOS_federation_development_grant:0 "Subsídio de Desenvolvimento da Federação"
 BOS_federation_development_grant_desc:0 "Direcionar fundos do tesouro para infraestrutura nos cantões da Federação de maioria bósnia muçulmana. A comunidade bósnia muçulmana recebe bem o investimento, embora a República Srpska o veja como favoritismo."
 BOS_herzegovina_development_grant:0 "Subsídio de Desenvolvimento da Herzegovina"
 BOS_herzegovina_development_grant_desc:0 "Financiar estradas e serviços públicos na Herzegovina de maioria croata. Os líderes croatas veem isso como reconhecimento, enquanto os bósnios muçulmanos ressentem o dinheiro que vai para os redutos nacionalistas."
 BOS_srpska_development_grant:0 "Subsídio de Desenvolvimento da República Srpska"
 BOS_srpska_development_grant_desc:0 "Direcionar fundos do tesouro para infraestrutura na República Srpska. O gesto compra a boa vontade sérvia, mas os bósnios muçulmanos se irritam por recompensar a entidade que não para de ameaçar sair."
 BOS_croat_grievance:0 "Queixa Política Croata"
 BOS_croat_grievance_desc:0 "Os partidos croatas dizem que a vaga croata da presidência foi decidida por votos bósnios muçulmanos, e não croatas, e exigem um sistema eleitoral que não possa ser derrotado por fora da comunidade."
 BOS_third_entity_demand:0 "Reestruturação Federal"
 BOS_third_entity_demand_desc:0 "Os cantões de maioria croata têm autogoverno ampliado, conquistado ao custo de um aparato estatal mais complicado de administrar em uma camada."
 BOS_contested_high_representative:0 "Mandato Contestado do Alto Representante"
 BOS_contested_high_representative_desc:0 "O Alto Representante assumiu o cargo sem o endosso do Conselho de Segurança da ONU. A República Srpska trata a lacuna como licença para ignorar suas decisões, e cada uso dos poderes de Bonn agora convida a uma disputa de legitimidade além da disputa política."
 BOS_map_participant:0 "Plano de Ação para a Adesão à OTAN"
 BOS_map_participant_desc:0 "Oficiais bósnios treinam e planejam ao lado de homólogos da OTAN sob o Plano de Ação para a Adesão, a via formal rumo a uma eventual adesão."
 BOS_arms_export_boom:0 "Boom das Exportações de Armas"
 BOS_arms_export_boom_desc:0 "As fábricas de armas ligadas ao Estado operam em plena capacidade para atender a pedidos de calibre OTAN e de calibre Pacto de Varsóvia. O tesouro se beneficia, assim como a discussão sobre quem os carregamentos realmente alcançam."
 BOS_brain_drain_1:0 "Emigração em Massa"
 BOS_brain_drain_1_desc:0 "Centenas de milhares partiram desde o início da era de viagens sem visto, e os instruídos e os jovens estão sobrerrepresentados entre eles. Salas de aula, clínicas e chãos de fábrica sentem a falta."
 BOS_brain_drain_eased_tt:0 "§GFamílias que retornam estão aliviando o problema da emigração em massa§!"
 BOS_economic_reconstruction:0 "Reconstruir a Economia"
 BOS_economic_reconstruction_desc:0 "A Bósnia pós-guerra nunca terminou de se reconstruir. Uma geração depois, o Estado ainda precisa de um programa econômico coerente em vez de privatizações improvisadas e empréstimos estrangeiros tomados um a um."
 BOS_reform_agenda_adoption:0 "Adotar a Agenda de Reformas"
 BOS_reform_agenda_adoption_desc:0 "Comprometer-se com o programa de reformas socioeconômicas que a UE fixou como preço para reativar a via de adesão. As reformas judiciais e de mercado avançam mais rápido quando Bruxelas pode apontar para um plano formal."
 BOS_growth_plan_negotiations:0 "Negociar o Plano de Crescimento"
 BOS_growth_plan_negotiations_desc:0 "Abrir conversas sobre o acesso ao Mecanismo de Reforma e Crescimento da UE. O dinheiro é real, assim como as condições a ele atreladas."
 BOS_corridor_vc_northern_construction:0 "Construir o Corredor Norte"
 BOS_corridor_vc_northern_construction_desc:0 "Impulsionar a construção do Corredor Vc por Doboj, Zenica e Sarajevo. É o maior projeto de infraestrutura do país desde a guerra, financiado principalmente por Bruxelas."
 BOS_corridor_vc_southern_construction:0 "Estender o Corredor Sul"
 BOS_corridor_vc_southern_construction_desc:0 "Levar a autoestrada adiante até Mostar, fechando a lacuna entre o norte industrial da Federação e seu sul voltado para o Adriático."
 BOS_corridor_vc_opening:0 "Inaugurar o Corredor Vc"
 BOS_corridor_vc_opening_desc:0 "Cortar a fita da rota concluída da fronteira húngara ao porto de Ploče. É a entrega mais clara de duas décadas de desenvolvimento financiado pela UE."
 BOS_east_energy_partnership:0 "Cortejar Financiamento Energético Chinês"
 BOS_east_energy_partnership_desc:0 "Apoiar-se em empréstimos estatais e empreiteiras chinesas para manter e expandir as usinas a carvão do país, custe o que custar ao processo de adesão à UE."
 BOS_west_energy_partnership:0 "Alinhar a Política Energética à UE"
 BOS_west_energy_partnership_desc:0 "Direcionar investimentos para a energia hidrelétrica e a modernização da rede financiada pela UE, em vez de nova capacidade a carvão, mantendo o setor energético dentro das regras europeias de auxílio estatal."
 BOS_defense_industry_revival:0 "Reviver as Fábricas de Defesa"
 BOS_defense_industry_revival_desc:0 "Dar respaldo estatal à Igman Konjic e à Unis Ginex, as fábricas de munição que já abasteceram metade da Iugoslávia e hoje operam bem abaixo da capacidade."
 BOS_arms_industry_capacity_expansion:0 "Expandir a Capacidade de Produção"
 BOS_arms_industry_capacity_expansion_desc:0 "Reequipar as fábricas de armas para operar ao mesmo tempo linhas de produção de calibre OTAN e de calibre Pacto de Varsóvia, a combinação que torna a munição bósnia vendável em quase qualquer lugar."
 BOS_defense_export_drive:0 "Perseguir o Boom das Exportações"
 BOS_defense_export_drive_desc:0 "Apoiar as fábricas enquanto ampliam a produção para os mercados de exportação abertos pela demanda renovada no exterior. As carteiras de pedidos estão cheias e ficando mais cheias."
 BOS_national_jobs_program:0 "Lançar um Programa Nacional de Empregos"
 BOS_national_jobs_program_desc:0 "Financiar a criação de empregos e a capacitação no país para dar às centenas de milhares que partiram desde o início da era sem visto um motivo para considerar ficar, ou voltar."
 BOS_youth_retention_initiative:0 "Investir na Retenção de Jovens"
 BOS_youth_retention_initiative_desc:0 "Ampliar o programa de empregos com subsídios e apoio à moradia voltados diretamente aos jovens formados e artesãos que compõem a maior parte da saída."
 BOS_brain_drain_reversed_tt:0 "§GO problema da emigração em massa foi resolvido§!"
 BOS_corridor_vc_trade_boost:0 "Corredor Vc Aberto"
 BOS_corridor_vc_trade_boost_desc:0 "A ligação rodoviária concluída reduz o tempo de transporte de carga pelo país e até o Adriático, facilitando o comércio com o resto da Europa."
 BOS_defense_industrial_base:0 "Base Industrial de Defesa Revivida"
 BOS_defense_industrial_base_desc:0 "A Igman Konjic e a Unis Ginex operam mais perto de sua antiga capacidade, embora a produção extra ainda dispute com os bens civis as mesmas fábricas."
 BOS_jobs_program_idea:0 "Programa Nacional de Empregos"
 BOS_jobs_program_idea_desc:0 "A criação de empregos financiada pelo Estado dá aos trabalhadores um motivo para ficar, em vez de entrar na fila do ônibus rumo à Alemanha."
 BOS_youth_retention_idea:0 "Subsídios de Retenção de Jovens"
 BOS_youth_retention_idea_desc:0 "Subsídios de moradia e carreira voltados a jovens formados estão mantendo alguns deles no país tempo suficiente para constituir família e carreira aqui."
 BOS_mostar_industrial_decline:0 "Fechamento da Siderúrgica de Mostar"
 BOS_mostar_industrial_decline_desc:0 "A fábrica de alumínio, que já foi a maior consumidora individual de energia da Federação, está às escuras, e a economia de Mostar perdeu vários milhares de empregos que não foram repostos."
 BOS_mostar_industrial_revival:0 "Mostar Sob Nova Gestão"
 BOS_mostar_industrial_revival_desc:0 "Um investidor estratégico assumiu as operações da fundição de Mostar, retomando a produção em capacidade reduzida, mas viável."
 BOS_zenica_industrial_decline:0 "Desativação da Siderúrgica de Zenica"
 BOS_zenica_industrial_decline_desc:0 "O alto-forno que sustentou a economia de Zenica por mais de um século esfriou, e a região absorve a perda de milhares de empregos."
 BOS_zenica_industrial_revival:0 "Zenica Sob Novo Dono"
 BOS_zenica_industrial_revival_desc:0 "Um comprador assumiu a siderúrgica de Zenica, mantendo parte da antiga força de trabalho empregada sob nova gestão."
 BOS_eu_growth_plan_tranche:0 "Sacar uma Parcela do Plano de Crescimento da UE"
 BOS_eu_growth_plan_tranche_desc:0 "Solicitar o próximo desembolso do Mecanismo de Reforma e Crescimento da UE. Corrupção acima do limite ou um governo instável demais para negociar fará perder a parcela."
 BOS_political.58.t:0 "A Fundição de Mostar Apaga"
 BOS_political.58.d:0 "A Aluminij Mostar, maior consumidora individual de energia da Federação, foi desligada por centenas de milhões em dívidas não pagas com a companhia elétrica. A Glencore desistiu de uma aquisição meses atrás, e reiniciar uma fundição desse porte após um desligamento total pode nem ser possível."
 BOS_political.58.a:0 "Deixar a fábrica fechar"
 BOS_political.58.b:0 "Cortejar um investidor estratégico"
 BOS_political.59.t:0 "O Alto-Forno de Zenica Esfria"
 BOS_political.59.d:0 "A ArcelorMittal paralisou o alto-forno de sua siderúrgica em Zenica, uma fábrica que sustentou a economia da cidade por mais de um século. A fraca demanda europeia e os altos custos de energia tornaram a linha inviável."
 BOS_political.59.a:0 "Deixar o forno frio"
 BOS_political.59.b:0 "Encontrar um novo dono"
 BOS_political.60.t:0 "O Bloco 7 de Tuzla Naufraga"
 BOS_political.60.d:0 "A unidade de linhito financiada pela China em Tuzla está oficialmente morta. A garantia estatal por trás do empréstimo violou as regras de auxílio estatal da UE anos atrás, e o governo finalmente confirmou o que Bruxelas já dizia. A China Gezhouba quer que seu contrato seja honrado de qualquer forma."
 BOS_political.60.a:0 "Aceitar o cancelamento"
 BOS_political.60.b:0 "Contestar a rescisão"
 BOS_political.61.t:0 "Viagem Livre para a Europa"
 BOS_political.61.d:0 "A UE aboliu os vistos Schengen de curta duração para portadores de passaporte biométrico bósnio. Pela primeira vez desde a guerra, entrar na UE significa apenas mostrar um passaporte na fronteira."
 BOS_political.61.a:0 "Celebrar o marco"
 BOS_political.61.b:0 "Alertar aonde esse caminho leva"
 BOS_visa_era_emigration_tt:0 "§YA viagem sem visto para a UE tornou a partida mais fácil do que nunca§!"
 BOS_political.62.t:0 "O Momento Cívico da Eleição de 2010"
 BOS_political.62.d:0 "O SDP multiétnico de Zlatko Lagumdžija liderou a votação da Federação pela primeira vez desde a guerra, enquanto o SNSD de Milorad Dodik varre a República Srpska. Seis partidos agora precisam formar um governo que nenhum dos lados possa dominar."
 BOS_political.62.a:0 "Construir sobre o avanço cívico"
 BOS_political.62.b:0 "Deixar as entidades manterem sua posição"
 BOS_political.63.t:0 "Uma Coalizão, Dezesseis Meses Atrasada"
 BOS_political.63.d:0 "Dezesseis meses após o fechamento das urnas, uma coalizão de seis partidos finalmente formou um Conselho de Ministros. Foi preciso quase todo esse tempo só para decidir quem o presidiria."
 BOS_political.63.a:0 "De volta a governar"
 BOS_paralysis_lifted_tt:0 "§GA paralisia na formação do governo foi resolvida§!"
 BOS_political.64.t:0 "O Retorno dos Nacionalistas"
 BOS_political.64.d:0 "O SDA reconquistou o título de maior partido da Federação, Dragan Čović ocupa a vaga croata na presidência, e Dodik manteve por pouco a República Srpska. O experimento multiétnico de 2010 praticamente ruiu."
 BOS_political.64.a:0 "Os velhos blocos voltaram por uma razão"
 BOS_political.64.b:0 "Tentar o caminho cívico de novo"
 BOS_political.65.t:0 "Mostar Vota de Novo"
 BOS_political.65.d:0 "Depois que uma decisão de um tribunal europeu forçou a mão de Sarajevo e Izetbegović e Čović fecharam um novo estatuto municipal, Mostar realizou eleições locais pela primeira vez em doze anos. A cidade dividida finalmente tem um conselho eleito."
 BOS_political.65.a:0 "Um novo mandato para a cidade"
 BOS_political.65.b:0 "Uma trégua frágil, nada mais"
 BOS_political.66.t:0 "Lei dos Agentes Estrangeiros da República Srpska"
 BOS_political.66.d:0 "Dias após a condenação de Dodik, a assembleia da entidade aprovou às pressas uma lei que obriga ONGs financiadas do exterior e a mídia independente a se registrarem como agentes estrangeiros e a declarar cada doação. A OSCE e a Comissão de Veneza chamam isso de retrocesso para a sociedade civil."
 BOS_political.66.a:0 "Condenar a repressão"
 BOS_political.66.b:0 "A República Srpska responde apenas a si mesma"
 BOS_political.67.t:0 "Um Mandado que Ninguém Cumprirá"
 BOS_political.67.d:0 "Dodik ignorou um mandado de prisão nacional e da Interpol, viajando por Belgrado e Israel até Moscou. Quando a agência estatal de segurança tentou prendê-lo dentro da República Srpska, a polícia da entidade barrou o caminho."
 BOS_political.67.a:0 "Insistir na prisão"
 BOS_political.67.b:0 "Deixar o confronto esfriar"
 BOS_rs_police_standoff_tt:0 "§RA polícia da República Srpska protege Dodik da prisão, aprofundando a crise§!"
 BOS_political.68.t:0 "Eleição Antecipada para a Cadeira de Dodik"
 BOS_political.68.d:0 "Com Dodik destituído da presidência pela comissão eleitoral, a República Srpska realizou uma eleição presidencial antecipada. O leal ao SNSD Siniša Karan e o candidato do SDS Branko Blanuša terminam a menos de três pontos um do outro."
 BOS_political.68.a:0 "A máquina do SNSD resiste"
 BOS_political.68.b:0 "A oposição avança"
 BOS_political.69.t:0 "A Decisão Ljubić"
 BOS_political.69.d:0 "O Tribunal Constitucional derrubou a garantia de pelo menos um delegado por grupo étnico por cantão na Câmara dos Povos da Federação. O parlamento não tem maioria para escrever um substituto, então a lei eleitoral continua congelada."
 BOS_political.69.a:0 "Alertar que isso voltará para assombrar"
 BOS_political.69.b:0 "Tomar nota e seguir em frente"
 BOS_political.49.d_ljubic:0 "Željko Komšić venceu a vaga croata da presidência com votos de maioria bósnia muçulmana, derrotando Dragan Čović, da HDZ. A mesma lacuna na lei eleitoral que o Tribunal Constitucional deixou aberta na decisão Ljubić, dois anos atrás, é agora o centro do argumento da HDZ de que os eleitores croatas sempre podem ser derrotados. Cidades de maioria croata o declaram indesejado, e Zagreb protesta contra um resultado que sua própria comunidade rejeita."
 BOS_political.70.t:0 "O Atentado à Delegacia de Bugojno"
 BOS_political.70.d:0 "Uma bomba caseira devastou a delegacia de polícia de Bugojno, matando um policial e ferindo seis. A célula salafista por trás do ataque é a primeira grande rede jihadista nascida no país que ele enfrenta desde a guerra."
 BOS_political.70.a:0 "Tratar como uma célula isolada"
 BOS_political.70.b:0 "Soar o alarme sobre a radicalização"
 BOS_counter_radicalization_available_tt:0 "§YUma decisão de contrarradicalização agora está disponível§!"
 BOS_political.71.t:0 "Tiros na Embaixada dos EUA"
 BOS_political.71.d:0 "Um atirador do enclave wahhabita de Gornja Maoča disparou mais de cem tiros contra a embaixada americana em Sarajevo antes que um atirador de elite da polícia o abatesse. O problema da radicalização do país deixou de ser uma questão interna."
 BOS_political.71.a:0 "Absorver as consequências diplomáticas"
 BOS_political.71.b:0 "Exigir respostas sobre os enclaves"
 BOS_salafi_enclave_decision_available_tt:0 "§YUma decisão de monitorar os enclaves salafistas agora está disponível§!"
 BOS_political.72.t:0 "Ataque à Delegacia de Zvornik"
 BOS_political.72.d:0 "Um atirador matou um policial na delegacia de Zvornik, na República Srpska, antes de ser morto a tiros, o primeiro ataque islamista dentro da entidade sérvia. Alguns de seus conhecidos lutaram na Síria."
 BOS_political.72.a:0 "A ameaça não respeita fronteiras entre entidades"
 BOS_political.73.t:0 "Washington Sanciona a Rede de Dodik"
 BOS_political.73.d:0 "O Tesouro dos EUA sancionou Milorad Dodik e ampliou o cerco à sua família e rede de clientelismo, citando corrupção e a obstrução deliberada de Dayton. É a ferramenta coercitiva ocidental mais dura já dirigida contra a República Srpska."
 BOS_political.73.a:0 "Responsabilização atrasada"
 BOS_political.73.b:0 "Um ataque à própria República Srpska"
 BOS_sanctions_deepen_crisis_tt:0 "§RAs sanções agravam a crise de secessão em curso da República Srpska§!"
 BOS_political.74.t:0 "A Babylution"
 BOS_political.74.d:0 "O parlamento deixou a lei de documento de identidade do cidadão caducar no impasse, e os recém-nascidos ficaram meses sem número de identidade, passaporte ou cartão de saúde. Depois que um bebê gravemente doente morreu à espera de tratamento no exterior, dez mil pessoas marcharam em Sarajevo, o maior protesto cívico desde a guerra."
 BOS_political.74.a:0 "Prometer uma solução rápida"
 BOS_political.74.b:0 "Deixar o parlamento resolver"
 BOS_political.75.t:0 "Bósnia Se Classifica para a Copa do Mundo"
 BOS_political.75.d:0 "Uma vitória por 1 a 0 na Lituânia levou a Bósnia e Herzegovina à sua primeira Copa do Mundo como nação independente. Por algumas semanas, a seleção de Edin Džeko faz o país inteiro torcer pela mesma coisa."
 BOS_political.75.a:0 "Um país unido, ainda que brevemente"
 BOS_political.81.t:0 "O ASA Finalmente Entra em Vigor"
 BOS_political.81.d:0 "Sete anos após a assinatura, o Acordo de Estabilização e Associação entrou em vigor. Ele reinicia um caminho europeu que estava parado há anos e prepara a Agenda de Reformas que agora toma forma no Conselho de Ministros."
 BOS_political.81.a:0 "Um novo começo com Bruxelas"
 BOS_political.77.t:0 "B&H Airlines Parada de Vez"
 BOS_political.77.d:0 "O governo da Federação liquidou a companhia de bandeira B&H Airlines, com dívidas que nunca poderia pagar. Pela primeira vez desde a independência, o país não tem companhia aérea nacional."
 BOS_political.77.a:0 "Deixar ir"
 BOS_political.77.b:0 "Socorrer a empresa"
 BOS_political.78.t:0 "Buroj Ozone Anunciada"
 BOS_political.78.d:0 "A Buroj Property Development, de Dubai, revelou planos para uma cidade-resort de 4,3 bilhões de euros em Trnovo, nos arredores de Sarajevo, prometendo milhares de empregos. O capital do Golfo observa os setores imobiliário e turístico da Bósnia como nunca antes."
 BOS_political.78.a:0 "Acolher o anúncio"
 BOS_political.76.t:0 "EFT Stanari Entra em Operação"
 BOS_political.76.d:0 "A usina de linhito de Stanari, de 300 megawatts, perto de Banja Luka, entrou em operação comercial, a primeira nova usina térmica construída em qualquer lugar da Bósnia desde a guerra. A República Srpska agora tem sua própria fonte estável de energia, financiada e construída com dinheiro chinês."
 BOS_political.76.a:0 "Um motivo de orgulho da República Srpska"
 BOS_political.80.t:0 "A Primeira Parada do Orgulho de Sarajevo"
 BOS_political.80.d:0 "Cerca de duas mil pessoas marcharam por Sarajevo na primeira Parada do Orgulho do país, a última capital da antiga Iugoslávia a realizar uma. Um pequeno contraprotesto se reuniu sob uma faixa de \"valores tradicionais\", mas a marcha transcorreu sem violência."
 BOS_political.80.a:0 "Garantir proteção aos manifestantes"
 BOS_political.80.b:0 "Manter o Estado à distância"
 BOS_political.79.t:0 "Enchentes e Deslizamentos Soterram Jablanica"
 BOS_political.79.d:0 "Enxurradas e deslizamentos devastaram o centro e o sul da Bósnia, o pior desastre que o país viu em uma década. Donja Jablanica foi a mais atingida, com um fluxo de detritos soterrando casas e matando dezenas."
 BOS_political.79.a:0 "Apelar à ajuda solidária da UE"
 BOS_political.79.b:0 "Reconstruir por conta própria"
 BOS_pass_jmbg_law:0 "Aprovar a Lei JMBG"
 BOS_pass_jmbg_law_desc:0 "Aprovar no parlamento uma nova lei de documento de identidade do cidadão, encerrando a lacuna de registro que deixou recém-nascidos sem documentos de identidade."
 BOS_jmbg_law_passed_tt:0 "§GA lei de documento de identidade foi substituída, e os protestos diminuíram§!"
 BOS_counter_radicalization_program:0 "Lançar um Programa de Contrarradicalização"
 BOS_counter_radicalization_program_desc:0 "Financiar ações de aproximação e monitoramento voltadas às redes salafistas por trás do atentado recente, revertendo parte do dano à segurança interna."
 BOS_monitor_salafi_enclaves:0 "Monitorar os Enclaves Salafistas"
 BOS_monitor_salafi_enclaves_desc:0 "Submeter vilarejos como Gornja Maoča a vigilância contínua. Melhora a detecção e diz às comunidades bósnias muçulmanas que vivem lá exatamente como o Estado as enxerga."
 BOS_repatriate_foreign_fighters:0 "Repatriar e Processar Combatentes Estrangeiros"
 BOS_repatriate_foreign_fighters_desc:0 "Trazer para casa os cidadãos que lutaram pelo ISIS na Síria e no Iraque e julgá-los pela lei antiterrorismo de 2014. A reintegração é cara, e nem todo caso termina bem."
 BOS_reintegration_success_tt:0 "§GOs repatriados foram reintegrados com sucesso§!"
 BOS_reintegration_relapse_tt:0 "§RAlguns repatriados voltaram a se aproximar de redes radicais§!"
 BOS_government_formation_paralysis:0 "Paralisia na Formação do Governo"
 BOS_government_formation_paralysis_desc:0 "Nenhuma coalizão tem assentos suficientes para formar um Conselho de Ministros. Os ministérios funcionam com orçamentos provisórios enquanto os partidos negociam."
 BOS_civil_society_crackdown:0 "Repressão à Sociedade Civil"
 BOS_civil_society_crackdown_desc:0 "A lei dos agentes estrangeiros da República Srpska obriga ONGs e a mídia independente a se registrar, declarar seu financiamento e rotular sua própria produção. Fiscalizadores e doadores estão se afastando da entidade."
 BOS_domestic_terror_threat_1:0 "Ameaça Terrorista Interna"
 BOS_domestic_terror_threat_1_desc:0 "Uma rede salafista pequena, mas ativa, opera em grande parte fora da vista do Estado, recrutando em um punhado de comunidades isoladas."
 BOS_counter_radicalization_measures:0 "Medidas de Contrarradicalização"
 BOS_counter_radicalization_measures_desc:0 "Programas de aproximação e monitoramento ampliado estão corroendo as redes que produziram o atentado de Bugojno."
 BOS_salafi_enclave_monitoring:0 "Monitoramento dos Enclaves Salafistas"
 BOS_salafi_enclave_monitoring_desc:0 "Os serviços de segurança mantêm vigilância permanente sobre Gornja Maoča e comunidades semelhantes. Isso detecta mais complôs que antes, ao custo da confiança nos bairros vigiados."
 BOS_foreign_fighter_reintegration:0 "Reintegração de Combatentes Estrangeiros"
 BOS_foreign_fighter_reintegration_desc:0 "Os repatriados condenados e libertados sob o programa de repatriação estão sendo encaminhados ao trabalho e afastados das redes que os recrutaram da primeira vez."
 BOS_eufor_deterrence:0 "Reforço da EUFOR"
 BOS_eufor_deterrence_desc:0 "Uma guarnição maior da EUFOR Althea é um lembrete visível de que a paz da Bósnia tem fiadores externos, fato que pesa sobre qualquer um em Banja Luka que pense em secessão."
 BOS_eufor_deterrence_tt:0 "§YA presença reforçada da EUFOR reduz o risco de uma tentativa de secessão da República Srpska§!"
 BOS_jmbg_crisis:0 "A Crise do JMBG"
 BOS_jmbg_crisis_desc:0 "Recém-nascidos estão sem documentos de identidade enquanto o parlamento não consegue acordo sobre uma nova lei de identidade do cidadão. Quanto mais isso se arrasta, maiores ficam os protestos."
 BOS_world_cup_unity:0 "Febre da Copa do Mundo"
 BOS_world_cup_unity_desc:0 "A campanha da seleção nacional rumo à sua primeira Copa do Mundo deu a bósnios muçulmanos, croatas e sérvios algo para torcer ao mesmo tempo."
 BOS_stanari_plant_online:0 "Usina de Stanari em Operação"
 BOS_stanari_plant_online_desc:0 "A usina de linhito de Stanari, construída pelos chineses, alimenta a rede da República Srpska com energia estável, a primeira nova capacidade térmica construída no país desde a guerra."
 BOS_national_carrier_pride:0 "Orgulho da Companhia Nacional"
 BOS_national_carrier_pride_desc:0 "A companhia de bandeira subsidiada pelo Estado ainda voa, um pequeno motivo de orgulho num país que, de resto, ficou sem uma desde 2015."
