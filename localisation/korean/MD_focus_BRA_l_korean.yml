l_korean:
 BRA_lula: "룰라"
 BRA_lula_desc: "Luiz Lula da Silva became the second most voted-for candidate in history after Ronald Reagan. Can you make the Brazilian people proud as the Workers' Party?"
 BRA_nossa_economia: "경제 정책"
 BRA_nossa_economia_desc: "The 1997 Asian financial crisis sent ripples throughout global markets. Brazil's profits from its massive export industry shrank and Cardoso's policies failed to address the damage quickly. Let us encourage growth to finally reverse the effects of this most unfortunate economic downturn!"
 BRA_the_internal: "사회주의로"
 BRA_the_internal_desc: "자국에는 문제덩어리들이 넘쳐납니다. 어떻게 이 문제들을 해결할 수 있을까요? 사회주의가 그 답이 될까요?"
 BRA_nosso_povo: "브라질 인민"
 BRA_nosso_povo_desc: "자국 또는 브라질의 인민은 가난에 쩌들어 살고 이습니다. 강대국이 될려면 인민들에게 모든 사안들을 집중시켜야 합니다."
 BRA_pay_back_the_imf: "IMF 반재"
 BRA_pay_back_the_imf_desc: "The loan that was signed must be paid back in full. Brazil must unbind itself from foreign institutions."
 BRA_brazilian_exports: "브라질 수출품"
 BRA_brazilian_exports_desc: "브라질은 원자재를 통해 만들어진 경제가 지탱되어지고 있는 나라입니다. 이제, 자국은 이 원자재들을 이용해 수익을 낼 수 있는 충분한 능력을 가지고 있습니다."
 BRA_foreign_companies: "외국 회사"
 BRA_foreign_companies_desc: "경제 발전을 위한 첫번째 단계는 외국 회사가 자국에 투자를 가능캐하는 것입니다."
 BRA_discuss_the_party: "정당 의논"
 BRA_discuss_the_party_desc: "The party needs to develop its agenda now. Our campaign has won us the presidency. Do we keep our promises?"
 BRA_finalize_the_agenda: "공약 이행"
 BRA_finalize_the_agenda_desc: "어떤 대가를 치뤄서라도 공약은 이행되어야만 합니다."
 BRA_root_out_corrpution: "부폐 근절"
 BRA_root_out_corrpution_desc: "부폐는 자국의 만연한 문제입니다. 공무원들은 국고를 횡령하고 있으며, 정치인들은 계속해서 봉투를 주고받고 있습니다. 국민들의 정부에 대한 믿음을 하나부터 다시 일으켜 세워야 합니다!"
 BRA_bolsa_familia: "보우사 파밀리아"
 BRA_bolsa_familia_desc: "보우사 파밀리아는 포미제로(Fome Zero) 사회 복지 프로그램의 일환입니다. 이 프로그램은 빈곤과 아동의 학교 미취학 문제를 해결하는 것이 주 목적입니다. 다행이도 몇 년안에 그 노력이 결실을 맺을 것입니다."
 BRA_socialism_in_concept: "다음 사회주의 정책"
 BRA_socialism_in_concept_desc: "사회주의가 우리의 주요 이념이 될 수 없다고 주장하고 있지만, 아직까지도 관련된 정책을 실행할 수 있습니다. 그 중 하나가 더 나은 보건입니다. 보건정책 제정이 다음 최우선 목표입니다."
 BRA_fome_zero: "포미제로(Fome Zero)"
 BRA_fome_zero_desc: "포미제로(Fome Zero)는 빈곤에 빠진 브라질을 부흥시키기 위한 사회 복지 프로그램을 한데 묶어서 부르는 명칭입니다. 기아를 근절하고 국민 스스로, 더 나아가서는 모든 이들과 가족을 위해 교육을 장려하는 정책을 담고 있습니다."
 BRA_our_own_industry: "우리 스스로의 산업"
 BRA_our_own_industry_desc: "우리는 안정적인 경제를 보장함으로써 브라질 투자자들이 우리 경제에 재투자하도록 장려할 수 있습니다."
 BRA_new_wave_ideas: "새로운 이념의 물결"
 BRA_new_wave_ideas_desc: "이제 자국의 성장이 궤도에 오르고 강대국의 면모를 보이게 되었고, 이는 우리 영향력을 해외로 퍼뜨려나가야 됨을 의미합니다."
 BRA_global_diplomacy: "세계 외교"
 BRA_global_diplomacy_desc: "미국, 유럽, 중국, 러시아, 일본 등 세계 주요 국가들이 모두 우리의 관심과 호감을 얻기 위해 경쟁하고 있습니다. 그런데 우리는 누구와 친하게 지낼 것인가?"
 BRA_align_to_nato: "US-NATO Alignment"
 BRA_align_to_nato_desc: "Brazil has long maintained close ties with the United States and the NATO alliance. Deepening that partnership opens the door to American security guarantees and the status of a Major Non-NATO Ally."
 BRA_non_aligned: "비동맹"
 BRA_non_aligned_desc: "오래 전부터 식민지 개척자들은 유럽 열강의 정치에서 벗어나 새로운 삶을 찾아 이곳에 왔습니다. 우리는 비동맹을 유지하고 다가올 분쟁에서 중립을 유지함으로써 그들과 그들의 유산을 존중해야 합니다."
 BRA_eastern_alignment: "동쪽과 함께"
 BRA_eastern_alignment_desc: "Brazil has worked closely with China and the BRICS in these past years, creating close bonds. Why not align ourselves with them again?"
 BRA_growth_through_freedom: "자유를 통한 성장"
 BRA_growth_through_freedom_desc: "지속되는 경제 성장 속에서 자국 기업의 성장은 더 나은 경제 성장의 기반이 되어줄 것입니다."
 BRA_build_fortaleza: "포르탈레자 개발"
 BRA_build_fortaleza_desc: "포르탈레자는 더 나은 미래를 예상되는 투자가 행해질 수 있는 중요한 도시입니다."
 BRA_brazilian_research_and_development: "브라질 연구 및 개발"
 BRA_brazilian_research_and_development_desc: "군사 부분의 R&D는 경제 부분에 있어서도 중요하고 필수적인 항목입니다."
 BRA_develop_recife: "헤시피 개발"
 BRA_develop_recife_desc: "레시페는 성장시켜야하는 중요한 도시입니다. 이 도시의 역량은 해외 생산품들을 손쉽게 수입하는데 있으며, 이는 개발시켜야하는 이유가 됩니다."
 BRA_northeastern_stimulus: "북동부 지역 개발"
 BRA_northeastern_stimulus_desc: "해안가를 따라 있는 북동부지역을 개발할 필요가 있습니다."
 BRA_rio_employment_projects: "리오 지역 고용 계획"
 BRA_rio_employment_projects_desc: "새로운 정부의 정책에 따라서, 리오 지역에는 더 많은 돈들이 시장에서 순환되고 있습니다. 향후 이곳은 엄청난 발전을 이루게될 것 같습니다!"
 BRA_foreign_research_methods: "해외 연구 체계"
 BRA_foreign_research_methods_desc: "해외의 과학자들은 자국의 연구 부서에서 우리를 도와줄지도 모릅니다."
 BRA_energy_mining_ministry: "에너지 & 광산업 부서"
 BRA_energy_mining_ministry_desc: "광산에너지부 - MME는 에너지 및 광물자원의 지속가능한 관리를 위한 공공 정책을 수립하고 실행을 보장하여 국가의 사회경제적 발전에 기여하는 제도적 사명을 갖고 있습니다."
 BRA_amazonian_el_dorado: "아마존의 엘 도라도"
 BRA_amazonian_el_dorado_desc: "Manaus is a hidden jewel of the Amazon. The beauty and potential tourism there could provide beneficial jobs for the local economy."
 BRA_develop_the_interior_and_amazon: "아마존 및 내부 지역 개발"
 BRA_develop_the_interior_and_amazon_desc: "우리는 아마존과 브라질 내륙에 사는 사람들에게 더 나은 생활 조건을 제공하기 위해 토지를 개발해야 합니다."
 BRA_develop_sp_mg_and_the_south: "남동부 및 남부 개발"
 BRA_develop_sp_mg_and_the_south_desc: "상파울루나 쿠리티바 같은 대도시는 잘 발달되어 있습니다. 우리는 나라의 남동쪽과 남쪽에 더 많은 도시를 개발해야 합니다!"
 BRA_santos_oilfields: "Develop Santos Basin Off-Shore Oilfields"
 BRA_major_development_projects: "주요 개발 프로젝트"
 BRA_major_development_projects_desc: "브라질 경제와 산업 발전을 위해 교통부와 공공사업부를 통해 국가 산업 분야에 투자하겠습니다."
 BRA_expanded_brazilian_economy: "브라질 경제 확장"
 BRA_expanded_brazilian_economy_desc: "국내의 주요 프로젝트는 우리 경제를 개선하는 데 도움이 되었습니다!"
 BRA_santos_oilfields_desc: "산투스 분지는 석유가 매우 풍부한 지역입니다. 이 지역을 개발하면 경제를 성장시킬 수 있습니다!"
 BRA_petrobras_tech: "페트로브라스 기술"
 BRA_petrobras_tech_desc: "브라질 석유 공사(페트로브라스)는 상장 기업으로, 최대 주주가 브라질 정부이므로 국영 혼합경제 기업입니다. 이 기업의 우선순위는 석유 및 정유 부문입니다. 이들의 기술로 석유 매장량과 정유소를 개선할 수 있습니다!"
 BRA_canadian_vale_incorporation: "베일 광산업 회사 캐나다 지부 법인 설립"
 BRA_canadian_vale_incorporation_desc: "발리는 브라질의 다국적 광업 기업이며 나라에서 가장 큰 물류 운영업체 중 하나입니다. 또한 세계 최대 광업 기업 중 하나이며 철광석, 펠릿, 니켈의 최대 생산업체입니다. 이 기업은 캐나다에서도 일부 사업을 운영합니다. 캐나다 발리를 모기업과 더 긴밀하게 통합하는 조치를 취하면, 캐나다와의 우호 관계를 유지하면서 자원을 얻을 수 있습니다!"
 BRA_fossil_fuel_industry: "화석 연료 산업"
 BRA_fossil_fuel_industry_desc: "\\"지속 가능한 개발\\"과 환경 보호에 대해 말해지는 모든 것은 큰 거짓말입니다. 환경에서 자원을 뽑아냅시다!"
 BRA_clean_energy_path: "청정 에너지 계획"
 BRA_clean_energy_path_desc: "우리는 아마존 열대우림 대부분의 주인이며, 이를 염두에 두고 미래 세대를 위해 환경을 보호해야 합니다."
 BRA_comperj: "리우데자네이루 복합 석유 산업 단지 (COMPERJ)"
 BRA_comperj_desc: "COMPERJ는 리우에 제안된 석유화학 단지입니다. 여기에 투자해야 합니다!"
 BRA_develop_angra3: "ANGRA3 원자로 프로젝트 개발"
 BRA_develop_angra3_desc: "ANGRA3는 앙그라두스헤이스에 제안된 원자력 발전소입니다. 여기에 투자해야 합니다!"
 BRA_presal_dev: "암염하층 (pre-salt layer) 개발"
 BRA_presal_dev_desc: "프리솔트(PRÉ-SAL)는 해저 암염층 아래의 암석층에 위치한 최근 발견된 심해 유전 매장지입니다. 브라질 해안을 따라 발견된 프리솔트 매장지는 세계에서 가장 깊은 매장지이며 수십억 배럴의 경질유가 매장되어 있을 가능성이 있습니다."
 BRA_solar_power_sertao: "Solar Power Expansion in Sertão"
 BRA_solar_power_sertao_desc: "세르탕은 매우 건조하고 더운 지역입니다. 이 지역의 태양광 발전에 투자하기에 완벽합니다!"
 BRA_help_the_farmers: "농부 지원"
 BRA_help_the_farmers_desc: "The farmers are a crucial part of our economy. We should focus on helping our farmers to not only remain in business but use them to underpin our self-sufficiency."
 BRA_agrotech: "농업기술에 투자"
 BRA_agrotech_desc: "농장을 개선하려면 농업 기술에 투자해야 합니다!"
 BRA_agricultural_protectionism: "농업보호주의"
 BRA_agricultural_protectionism_desc: "식량 자급자족의 기반인 우리 농업은 외국의 이익으로부터 보호되어야 합니다!"
 BRA_free_trade_agro_producs: "농업 상품에 대한 자유 무역"
 BRA_free_trade_agro_producs_desc: "외국은 우리의 농산물에 관심이 있습니다. 경제를 개선하기 위해 농산물 시장을 자유화해야 합니다!"
 BRA_support_the_unions: "조합 지원"
 BRA_support_the_unions_desc: "자국의 조합은 성공을 위해서는 필수적입니다. 이러한 체계를 공식화합시다."
 BRA_pro_union: "노동조합주의"
 BRA_pro_union_desc: "한 지지자에게 간단하게 말하면, 조합은 모든 이를 위한 것입니다. 한 명을 위한 것이 아닙니다."
 BRA_agrarian_economy: "농업 경제"
 BRA_agrarian_economy_desc: "Our country was founded on sugar fields. Let us return to a time when farm goods were our major export."
 BRA_support_international_bankers: "국제 은행가의 지지 획득"
 BRA_support_international_bankers_desc: "경제를 개선하려면 국제 은행가들의 지지를 모아야 합니다."
 BRA_help_business_owners: "Assist the Business Owners"
 BRA_help_business_owners_desc: "경제의 큰 부분을 책임지는 사업주들을 도와야 합니다."
 BRA_support_industries: "복합 기업 지지"
 BRA_support_industries_desc: "브라질은 큰 나라일지 모르지만 그다지 산업화된 나라는 아닙니다. 산업화의 불꽃을 다시 지필 때입니다!"
 BRA_further_industrialization: "추가적인 산업화"
 BRA_further_industrialization_desc: "브라질 전역의 산업 프로젝트가 우리 경제를 개선하고 있습니다. 이러한 프로젝트를 계속 이어 갑시다!"
 BRA_neighborly_development: "인접국 개발"
 BRA_neighborly_development_desc: "인접국은 우리의 도움을 필요로 합니다. 남아메리카는 수확될 때가 된 익은 사과와도 같습니다. 이 손때 타지 않은 과육을 어서 수확합시다."
 BRA_the_guays: "파라과이와 우루과이"
 BRA_the_guays_desc: "파라과이와 우루과이는 중요한 인접국입니다. 두 나라 사이에서 우리는 시간을 들여서 우리가 저들을 도울 수 있다는 사실을 인지시켜야 합니다."
 BRA_argentina: "아르헨티나"
 BRA_argentina_desc: "Argentina has always been a longstanding rival of ours. This is due to our historically oppositional overlords, not a choice of our own. As the two most militarily capable nations on the continent, cooperation between us is imperative for our shared economic growth."
 BRA_bolivia: "볼리비아"
 BRA_bolivia_desc: "Bolivia is a nation handicapped by past wars that may be willing to cooperate with us economically, for our benefit and their own."
 BRA_northerners: "북부의 나라"
 BRA_northerners_desc: "The countries to our north are historically unstable, reversing this not only ensures our borders but mutual economic growth."
 BRA_western_coastal_countries: "서부 해안국"
 BRA_western_coastal_countries_desc: "Chile, Peru and Ecuador are nations that lost out on many of the benefits of the modern age. By helping them to improve their situations, we can further our own economic interests."
 BRA_the_way_we_judge: "우리가 판단하는 방법"
 BRA_the_way_we_judge_desc: "The first step to deciding who we are is to decide who and how we judge."
 BRA_isolationism: "고립주의"
 BRA_isolationism_desc: "세계는 무섭고 위험한 곳입니다. 고립주의를 다시 실시합시다."
 BRA_the_country_of_brotherly_love: "형재애가 넘치는 나라"
 BRA_the_country_of_brotherly_love_desc: "브라질은 희망의 등대이자 형재애의 상징국이 될 것입니다."
 BRA_restrict_travelers: "관광객 규제"
 BRA_restrict_travelers_desc: "The plague of people from other countries coming into our great country has become a major problem. These travelers have become a plague to our part of the world. Tourism must be vetted and curbed and these tourists and travelers must be restricted from entering the country."
 BRA_shut_down_the_borders: "국경 폐쇄"
 BRA_shut_down_the_borders_desc: "Another way to restrict the flow of people throughout the country is to shut down our borders and up the military presence along them."
 BRA_brazil_first: "브라질 제일주의"
 BRA_brazil_first_desc: "브라질은 누구보다 위에 있으며, 앞서 있습니다."
 BRA_gunboat_diplomacy: "무력 외교"
 BRA_gunboat_diplomacy_desc: "인접국은 자국을 확장하는데 있어서 주요 목표입니다. 우리의 영향력 안에 저들을 두도록 합시다. 소국들은 우리같은 대국에게 합병되는 것이 나을 것입니다. 힘으로 말이죠."
 BRA_brazil_above_all: "정상에 선 브라질"
 BRA_brazil_above_all_desc: "브라질을 원조가 필요하기 않고 모두가 부러워하는 나라로 만들 겁니다."
 BRA_the_international_mediator: "국제 중재자"
 BRA_the_international_mediator_desc: "The great Federative Republic of Brazil sits in one of the most unique positions in the world. It remains as one of the largest countries who is not particularly biased in one way or another. Furthermore, our position between East and West allows for us to understand both parties."
 BRA_strength_in_cooperation: "협력 중점"
 BRA_strength_in_cooperation_desc: "The greatest strength we can have here in this world is the friends we choose."
 BRA_visit_every_country: "모든 나라와 수교"
 BRA_visit_every_country_desc: "세계상의 195개국에 사절을 보내 수교를 맺어야합니다."
 BRA_support_the_little_guys: "소국 지원"
 BRA_support_the_little_guys_desc: "첫번째 행보는 소국과 친교를 맺는 것입니다. 구아나와 수리남은 우리의 아낌없는 지원을 계속 받을겁니다."
 BRA_a_global_power: "강대국"
 BRA_a_global_power_desc: "브라질은 새로운 강대국이 될 것입니다."
 BRA_nosso_exercito: "브라질 육군"
 BRA_nosso_exercito_desc: "Our army has many issues. We should begin to address these shortcomings."
 BRA_marinha_do_brasil: "브라질 해군"
 BRA_marinha_do_brasil_desc: "Brazil has a large coast and our navy does not adequately cover our air, rivers, or waters."
 BRA_imbel: "IMBEL"
 BRA_imbel_desc: "Investing in IMBEL will see us continue to grow the Brazilian defence industry. IMBEL is the Brazilian military's primary quango. Encouraging IMBEL to produce and meet the continued demand of the military will forever be a net benefit to our army at large."
 BRA_modern_artillery: "현대식 포"
 BRA_modern_artillery_desc: "We can not abandon the old doctrines of effective use of artillery. Brazil needs to be self-sufficient and build its own modern-day haymakers."
 BRA_strength_on_land: "육군 중점"
 BRA_strength_on_land_desc: "육군에 그 중점을 맞추어야합니다. 브라질은 강성한 육군을 가져야만 합니다."
 BRA_homemade_rifles: "가정에서 만든 소총"
 BRA_homemade_rifles_desc: "필요만 하다면 소총은 집에서도 손쉽게 조립할 수 있습니다.Rifles can easily be assembled at home in case we are ever in need."
 BRA_western_military_factories: "서양식 군수 공장"
 BRA_western_military_factories_desc: "The West is perfect for our expanded military industries."
 BRA_northeastern_military_factories: "북동부 군수 공장"
 BRA_northeastern_military_factories_desc: "포르탈레자와 레시페는 북동부 해안에서 중요한 지역입니다. 이곳에 무기 공장을 지어서 육군 확장에 도움을 받을지도 모릅니다."
 BRA_national_drydocks: "국가 조선소"
 BRA_national_drydocks_desc: "해군은 추가적인 조선소를 필요로 하고 있습니다. 자국의 연안군은 반드시 확충되어야만 합니다."
 BRA_sao_paulo_naval_industries: "상파울루 조선소 산업"
 BRA_sao_paulo_naval_industries_desc: "계속되는 조선소 건설로, 새롭고 현대적인 선박을 만드는 역량이 향상되어가고 있습니다."
 BRA_rio_drydocks: "해군 조병창 확장"
 BRA_rio_drydocks_desc: "The Arsenal de Marinha is a military organization of the Brazilian navy located in Guanabara Bay in the city of Rio de Janeiro. The Arsenal is the main ship construction and maintenance yard for the Brazilian navy and other friendly nations. Expanding the facilities at the Arsenal for additional ship construction will become a massive boon for our navy and our allies, ensuring our naval dominance in the South Atlantic."
 BRA_behind_the_times: "시대의 뒤떨어짐"
 BRA_behind_the_times_desc: "대서양에서 막강한 해군력을 발휘하기 위해서 해군은 추가적인 작업을 필요로 합니다."
 BRA_underwater_flotilla: "잠수함 전단"
 BRA_reform_the_navy: "해군 개혁"
 BRA_reform_the_navy_desc: "과거의 실책과 다른 나라로부터 배운 교운으로, 더 강력하고 효과적인 해군을 만들 수 있습니다."
 BRA_ee_11: "EE 11"
 BRA_ee_11_desc: "자국의 APC는 낡아빠졌습니다. 새로운 EE 시리즈의 APC를 개발해야합니다."
 BRA_acquire_new_equipment: "신 장비 확충"
 BRA_acquire_new_equipment_desc: "지역 무전 및 지휘 장비는 개선할 여지가 있습니다. 봉화로 신호를 보내는 시대는 저물었습니다. 군사 정부는 실패했습니다."
 BRA_update_the_ifvs: "IFV 개량"
 BRA_update_the_ifvs_desc: "IFV는 전차와 같은 중장비를 최소화 할 수 있는 현대장비입니다. 또한 보병에게 가벼운 지원을 해주기도 합니다. 새 시대에 맞게, 더 넘어서게 이 장비들을 개량할 필요가 있습니다."
 BRA_decentralized_warfare: "분산화 전쟁"
 BRA_decentralized_warfare_desc: "Unlike some other countries, we should take note of the Russians and Iranians. Their command structure is lean and uncomplicated. Our army can model itself after this and respond more quickly and efficiently to combat our foes."
 BRA_modern_armor: "현대 전차"
 BRA_modern_armor_desc: "자국의 전차는 몇년은 뒤쳐진 년식을 가지고 있습니다. 더 새로운 전차로, 독일제로 개량해야 합니다."
 BRA_larger_artillery: "대구경 야포"
 BRA_larger_artillery_desc: "Artillery has become less of a priority as SPGs have taken precedence. We should not, however, underestimate the effectiveness of a static gun."
 BRA_braco_forte_mao_amiga: "Braço Forte Mão Amiga"
 BRA_braco_forte_mao_amiga_desc: "The Brazilian army is a force that needs to be projected. We do not back down. We do not bully. With a strong arm and a friendly hand, we will show our strength."
 BRA_french_naval_studies: "프랑스 해군 연구"
 BRA_french_naval_studies_desc: "프랑스 해군은 여전히 세계에서 강성한 힘을 발휘하고 있습니다. 이들은 과거 자국을 도운 전적이 있습니다. 자국 해군을 양성하기 위해 과거 받았던 가르침을 이용할 수 있습니다."
 BRA_lets_go_nuclear: "원자력 에너지 개발"
 BRA_lets_go_nuclear_desc: "원자력 에너지가 브라질의 미래입니다!"
 BRA_assault_carriers: "항공모함"
 BRA_assault_carriers_desc: "항공모함의 개발은 해군의 전투력을 더 향상시키도록 해줄 것입니다."
 BRA_usn_carriers: "미국 항공모함"
 BRA_usn_carriers_desc: "미국으로부터 항공모함을 구입하는 일은 공해상에서 더 막강한 전투력을 발휘하도록 해줄 것입니다."
 BRA_juruena_class: "주루에나급"
 BRA_juruena_class_desc: "The Juruena class of destroyers were UK-made vessels from the 1930s and 1940s. These were capable all-purpose destroyers. Let us remodel them and produce a new Juruena class."
 BRA_protegendo_nossas_riquezas: "영토 방위(Protegendo Nossas Riquezas)"
 BRA_protegendo_nossas_riquezas_desc: "새로운 무기로 전 세계가 브라질 해군을 부러워할 것입니다!"
 BRA_air_force_expansion: "공군 확충"
 BRA_air_force_expansion_desc: "A strong navy and army require an even stronger air force."
 BRA_invest_in_heli: "헬리콥터에 투자"
 BRA_invest_in_heli_desc: "공중 강습 부대와 장비를 수송하는데 있어서 헬리콥터는 대단한 성능을 발휘할지도 모릅니다."
 BRA_carrier_planes: "Plane for Aircraft Carriers"
 BRA_carrier_planes_desc: "Our carriers remain under-equipped for modern naval engagements. Let us focus on improving our air force in order to better protect our lands, our waters, and our airspace."
 BRA_cas_research: "근접항공지원기 연구"
 BRA_cas_research_desc: "근접항공지원기를 저평가해서는 안됩니다."
 BRA_maritime_routine: "해상 초계기"
 BRA_maritime_routine_desc: "해상 초계기를 개발하는 것은 최고의 투자가 될겁니다."
 BRA_mr_fighters: "다목적 전투기"
 BRA_mr_fighters_desc: "Multirole fighters are effective implements of war as they represent a jack-of-all-trades. Although they are not particularly good at one thing, they are still valuable tools for our armed forces."
 BRA_light_fighters: "경전투기"
 BRA_light_fighters_desc: "경전투기는 자국에 있어서 뛰어난 성능을 자랑하고 있습니다. 이 전투기는 정찰 및 군에는 가벼운 폭격 임무를 수행할 수 있습니다. 더해서 이들은 폭격기 요격 임무도 수행할 수 있습니다."
 BRA_brazilian_space_program: "브라질 우주 항공 프로그램"
 BRA_brazilian_space_program_desc: "브라질 우주 프로그램(PEB)은 브라질의 발사체 기술 연구 개발, 위성 생산, 우주 탐사 전반을 아우르는 총칭입니다. 1994년부터 브라질 우주국(AEB)이 국가 우주 프로그램을 조율해 왔습니다."
 BRA_cooperate_with_nasa: "나사와의 협력"
 BRA_cooperate_with_nasa_desc: "NASA는 달 착륙을 가능하게 했습니다. 그들과 협력하면 많은 혜택을 얻을 것입니다!"
 BRA_create_launchpads: "새로운 발사대 설립"
 BRA_create_launchpads_desc: "적도에서 로켓을 발사하는 것은 플로리다에서 발사하는 것보다 훨씬 낫습니다. 지구 자전의 추가 관성을 이용해 궤도에 진입하기가 훨씬 쉬워지며, 우리는 훌륭한 발사대를 건설하기에 완벽한 위치에 있습니다!"
 BRA_first_time_in_the_moon: "달에서의 첫걸음"
 BRA_first_time_in_the_moon_desc: "미국인들이 그랬듯, 브라질인들이 영광을 얻고 달에 착륙할 때입니다."
 BRA_a_mission_to_mars: "화성 탐사 임무"
 BRA_a_mission_to_mars_desc: "이전에는 누구도 화성에 가본 적이 없으며, 적어도 그곳에 인간을 착륙시킨 사람은 없습니다. 최초의 유인 우주선을 화성으로 보내는 임무를 맡게 됩니다!"
 BRA_brazilian_space: "브라질의 우주 영향력"
 BRA_brazilian_space_desc: "우리의 우주 패권은 국제적인 인정과 위신을 안겨 주고 있습니다. 지속적인 우주 임무를 통해 여러 연구 분야도 발전시키고 있습니다."
 BRA_mining_in_space: "우주 광산"
 BRA_mining_in_space_desc: "브라질은 이미 막대한 자원을 보유하고 있지만, 우주 채굴로 더 많은 자원을 얻을 수 있습니다!"
 BRA_cardosos_last_years: "Cardoso's Final Economic Policies"
 BRA_cardosos_last_years_desc: "Cardoso has a series of final socio-economic policies he is looking to implement before he ends his term. His presidency has been riddled with a variety of issues inherited from his predecessors and an unstable global economy. He will bring us forward into the new millennium."
 BRA_amazonian_development_project: "아마존 개발 계획"
 BRA_amazonian_development_project_desc: "A number of businesses from all across Brazil are looking to present what is known as the 'Amazonian Development Project' which aims to develop the Amazon Rainforest. The development projects can mean anything from some light rail clearing or heavy industrial mining. At the very least we should consider what they are offering."
 BRA_project_devastate_the_amazon: "아마존 개간 프로젝트"
 BRA_project_devastate_the_amazon_desc: "There is another project that is circling about the halls of government that will devastate the Amazonia, but also improve our economy. What are we to do about it?"
 BRA_march_of_the_excluded: "축출의 행진"
 BRA_march_of_the_excluded_desc: "The 500th anniversary of Brazil has been marred by the indigenous people protesting and reminding us of the past. They have taken to the streets to slam the establishment for its inability to support those who were here first."
 BRA_native_protests: "토착민 항의"
 BRA_native_protests_desc: "토착민들의 항의는 식민지 정부 이전으로 돌아가려는 목적을 가지고 계속되었습니다. 이를 경찰병력을 재건하는 새로운 기회로 이용해야 합니다."
 BRA_angry_natives: "화난 토착민"
 BRA_angry_natives_desc: "카르도주의 경계선을 아무렇지도 않게 왔다갔다 하는 정책으로 토착민들은 현 정부를 마음에 들어하지 않습니다."
 BRA_reinstating_imf_debts: "IMF 채무 발행"
 BRA_reinstating_imf_debts_desc: "The global economy has started taking a turn for the worse. We have begun to run out of options, and public debt is on the rise. The IMF debts that were incurred now need to be addressed. The IMF rescue package was signed just months before Lula's election."
 BRA_a_modern_recession: "세계 불황"
 BRA_a_modern_recession_desc: "At the turn of the century the Brazilian economy has certainly suffered. The Asian crisis, public debt, and other factors have caused the country to struggle recently. Targeted economic adjustments and political conversations with our various constituents can help stabilize the situation."
 BRA_foreign_assist: "대외 원조 요청"
 BRA_foreign_assist_desc: "쌓여 가는 부채를 덜기 위해 미국에 접근할 수 있습니다. 미국의 민간 투자자들은 현재 채권 및 기타 국채 형태로 우리 공공 부채의 상당 부분을 보유하고 있습니다. 상호 교환이나 선의의 행위를 통해 미국 정부가 우리의 채무를 면제해 줄 수도 있으며, 그러면 IMF 부채 패키지에 더 얽매이지 않게 됩니다."
 BRA_deficit_spending: "적자 지출"
 BRA_deficit_spending_desc: "이 정도 규모의 불황에서 벗어나는 유일한 진정한 방법은 미래를 위해 우리 자신을 지탱하도록 막대한 돈을 쓰는 것입니다. 국민에게 추가 채권을 발행하여 불황에서 벗어나는 방안을 모색할 수 있습니다."
 BRA_crippled_currency: "Reevaluate Our Crippled Currency"
 BRA_crippled_currency_desc: "The policies we have put in place and in practice have slowly seen the alleviation of the financial crisis with regards to our crippled currency. We should continue our course and try to resolve this before we start to see more issues spur from our ineffective currency."
 BRA_logging_reform: "벌목 시스템 개혁"
 BRA_logging_reform_desc: "이제 우리나라의 벌목 산업에 대한 더 강력한 규제를 시행하기 시작해야 할 때입니다. 현재의 면적 손실이 열대우림의 장기적 존속에 지속 가능한 수준을 훨씬 넘어서고 있어 아마존은 보호가 절실합니다."
 BRA_preserve_amazon: "아마존 보호 작업"
 BRA_preserve_amazon_desc: "아마존이 더 이상 황폐화되지 않도록 아마존 지역에 규제 보호 장치, 더 엄격한 처벌, 더 강력한 치안 활동을 마련해야 합니다!"
 BRA_protect_amazon: "아마존을 보호하라"
 BRA_protect_amazon_desc: "육해공 세 군의 도움으로 아마존의 하천, 열대우림, 영공을 보호할 수 있습니다."
 BRA_find_the_dealers: "거래상 처벌"
 BRA_find_the_dealers_desc: "카르텔과 맞서는 첫걸음은 그 판매상들을 처벌하는 것입니다. 마약을 유통하는 자들을 단속하여 거리에서 몰아내야 합니다."
 BRA_crack_down_on_suppliers: "마약을 불태워라"
 BRA_crack_down_on_suppliers_desc: "공급을 박멸하면 두목들의 수입을 박멸하게 될 것입니다."
 BRA_seize_and_arrest: "압수 및 체포"
 BRA_seize_and_arrest_desc: "공급책을 단속하고 협조를 거부하는 자들을 체포해야 합니다. 범죄와 싸우는 데 도움을 주지 않겠다면, 우리의 감옥을 채우는 데 도움이 될 것입니다."
 BRA_take_out_kingpins: "중심인물 제거"
 BRA_take_out_kingpins_desc: "카르텔 지도부를 제거함으로써 그들 내부에 혼란을 일으키고, 오랫동안 우리나라를 감염시켜 온 재앙을 마침내 끝내는 데 한 걸음 더 다가갈 것입니다."
 BRA_help_the_youth: "청소년 지원"
 BRA_help_the_youth_desc: "우리 청년들은 카르텔의 지배 아래 고통받았습니다. 이들이 옛 방식으로 되돌아가지 않도록 새로운 경제적 기회를 제공해야 합니다."
 BRA_end_the_cartels: "마약 전쟁의 끝"
 BRA_end_the_cartels_desc: "오랜 시간 끝에, 카르텔에 대한 전쟁이 막을 내렸다."
 BRA_new_coalition: "새로운 정치 연합"
 BRA_new_coalition_desc: "브라질 좌파는 민족주의자들에 비해 한 가지 이점이 있습니다. 더 단합되어 있다는 점입니다. 이를 더욱 활용하려면 연립을 구성해야 합니다!"
 BRA_parties_of_the_people: "국민의 정당"
 BRA_parties_of_the_people_desc: "많은 반대를 받으며 자립하는 정부는 없습니다. 이에 대한 좋은 예는 지지율이 매우 낮고 탄핵으로 끝난 이전 정부였습니다."
 BRA_strenghten_coalition: "연정 강화"
 BRA_strenghten_coalition_desc: "우리의 정당과 이념만이 지배적이 되도록 해야 합니다."
 BRA_new_brazil: "신 브라질"
 BRA_new_brazil_desc: "브라질은 이제 위대한 좌파 정부가 통치하는 새로운 나라입니다."
 BRA_mst: "MST"
 BRA_mst_desc: "The \"Movimento dos Sem Terra\" is a movement that aims for Agrarian Reform, since much of Brazil's arable land is abandoned or not in use."
 BRA_absorb_left_wing: "좌익 정당 흡수"
 BRA_absorb_left_wing_desc: "PSOL과 PCdoB 같은 모든 좌익 정당을 흡수하면 우리의 인기와 브라질 통치가 보장될 것입니다."
 BRA_lulismo: "룰라주의 (Lulismo)"
 BRA_lulismo_desc: "룰라주의는 사회 운동과 노동자당에 적대적이었던 브라질 사회의 일부 계층이 2006년에 루이스 이나시우 룰라 다 시우바 대통령이 이끄는 정치 세력 뒤로 결집한 것을 설명하는 정치 이념입니다. 통제된 개혁주의와 사회의 가장 가난한 계층에 초점을 맞춘 제한적인 구조 변화를 특징으로 합니다."
 BRA_the_pheonix_reborn: "불사조의 환생"
 BRA_the_pheonix_reborn_desc: "노동자당이 브라질의 미래를 위한 새로운 이해관계와 목표를 가지고 개편되었습니다."
 BRA_pro_workers: "인민들을 위해"
 BRA_pro_workers_desc: "노동자는 공산주의의 주된 정신이므로 그들의 이익을 충족시켜야 합니다."
 BRA_popular_government: "인기 있는 정부"
 BRA_popular_government_desc: "인민 정부는 우리가 내리는 모든 행동과 결정을 국민이 지지하기 때문에 원하는 모든 것을 할 수 있습니다."
 BRA_crush_psdb: "브라질 사회민주당 (PSDB)을 붕괴시켜라"
 BRA_crush_psdb_desc: "PSDB는 재민주화 이후 우리의 주된 경쟁자였습니다. 이 경쟁을 영원히 끝낼 때입니다!"
 BRA_bring_back_dilma: "대통령 지우마를 복귀시켜라"
 BRA_bring_back_dilma_desc: "지우마 바나 호세프는 브라질의 경제학자이자 정치인으로, 노동자당 소속이며 브라질의 제36대 대통령으로 2011년부터 2016년 탄핵으로 면직될 때까지 재직했습니다."
 BRA_appease_south_american_socialists: "남미 사회주의자들에 대한 유화 정책"
 BRA_appease_south_american_socialists_desc: "베네수엘라는 남미 사회주의의 주된 보루이므로, 서로의 성공을 보장하기 위해 그들과 연대해야 합니다."
 BRA_industrialization_help_from_china: "중국의 산업화 지원"
 BRA_industrialization_help_from_china_desc: "중국은 거대한 산업과 경제를 가지고 있습니다. 그들로부터 어느 정도 지원을 받으면 더 나은 경제를 가질 수 있습니다."
 BRA_five_year_plan: "5개년 계획"
 BRA_five_year_plan_desc: "서방 국가들의 자유 경제 모델은 사회주의 국가의 미래가 아닙니다. 가급적 고전적인 소련식 5개년 계획의 형태로 계획 경제로 복귀하면, 정부는 이전에는 통제되지 않았던 경제에 대한 막강한 영향력을 얻게 될 것입니다."
 BRA_the_corruption_question: "부패 척결"
 BRA_the_corruption_question_desc: "룰라 같은 과거의 주요 사회주의 지도자들은 매우 부패했습니다. 같은 실수를 되풀이해서는 안 됩니다."
 BRA_empower_the_government: "정부 역량 강화"
 BRA_empower_the_government_desc: "부패와 싸우는 것은 좋은 일이지만, 이를 이용해서 얻는 이득도 있어야 합니다."
 BRA_better_sus: "통합 의료 시스템 (SUS) 개선"
 BRA_better_sus_desc: "SUS(통합 보건 의료 체계)는 관리가 매우 부실한 보건 체계입니다. 이를 개선하면 국민의 건강 결과도 개선될 것입니다."
 BRA_align_unions: "연방 지원"
 BRA_align_unions_desc: "단순히 노조를 지지한다고 말하는 것과, 자신의 명성을 희생해 가며 적극적으로 지지하는 것은 별개의 문제입니다."
 BRA_aid_the_poor: "빈민 구제"
 BRA_aid_the_poor_desc: "빈곤은 독립 이래 브라질의 큰 문제였습니다. 이제 이를 진정으로 해결할 때입니다. 빈곤층을 지원함으로써 더 많은 지지도 모을 수 있습니다."
 BRA_left_wing_education: "좌파 교육"
 BRA_left_wing_education_desc: "By influencing our students, we can gather support over time, and ensure our rule over Brazil without a revolt risk."
 BRA_ban_nationalists: "국가주의 금지"
 BRA_ban_nationalists_desc: "민족주의자들은 이제 그만! 이들은 브라질이 가졌던 것 중 최악입니다!"
 BRA_socialist_market: "사회주의 시장"
 BRA_socialist_market_desc: "계획 시장은 우리에게 어느 정도 이익을 줄 것입니다."
 BRA_state_industries: "국가 산업"
 BRA_state_industries_desc: "외국인이 소유한 산업 시설은 언제나 보안 위험입니다. 외국이 경제 제재로 우리를 위협하는 상황에서, 산업 소유주가 하룻밤 사이에 떠나면서 시설의 핵심 부품을 가져가 버릴 가능성이 항상 있습니다. 이를 막으려면 외국의 심기를 거스르더라도 이러한 산업을 국유화해야 합니다."
 BRA_break_banks: "은행 폐쇄"
 BRA_break_banks_desc: "브라데스쿠? 방코 도 브라질? 산탄데르? 이타우? 이 기생충 같은 은행들에게 노동자들이 겪는 고통을 똑같이 느껴보게 합시다. 우리는 그들의 끔찍한 영향력을 뿌리 뽑을 것입니다."
 BRA_foro_de_sp: "상파울루 포럼 (Foro de São Paulo)"
 BRA_foro_de_sp_desc: "상파울루 포럼(Foro de São Paulo)은 라틴 아메리카와 카리브해의 좌익 정당 및 조직들의 회의체입니다. 브라질 노동자당이 국제 정세와 신자유주의 정책 시행의 결과를 논의할 목적으로 라틴 아메리카와 카리브해의 다른 정당 및 운동에 접근하면서 구성되었습니다."
 BRA_influence_our_neighbors: "우리 주변국에 영향"
 BRA_influence_our_neighbors_desc: "It is time to boost socialism in South America."
 BRA_op_car_wash: "세차 작전 (Operation Car Wash)"
 BRA_op_car_wash_desc: "원래의 수사가 역설적으로 세차장 위층에서 이루어지던 자금 세탁 작전에 관한 것이어서 '세차'라고 불린 라바 자투 작전은, 정치적으로 심각한 파장을 가진 이 자금 세탁 계획의 규모를 파악하기 위해 연방 경찰 쿠리치바 지부가 벌인 작전의 명칭입니다."
 BRA_odebrecht_corruption: "오데브레히트 (Odebrecht) 부패"
 BRA_odebrecht_corruption_desc: "건설 회사 오데브레시트의 CEO 마르셀루 오데브레시트는 브라질 건설 회사들 사이의 카르텔 수장입니다. 어쩌면 감형 협상을 대가로 증언할 의향이 있을지도 모릅니다."
 BRA_petrobras_indictment: "페트로브라스 정유 회사 기소"
 BRA_petrobras_indictment_desc: "암시장 환전상 알베르투 유세프는 페트로브라스 이사 파울루 로베르투 코스타에게 정치 인사들과의 접촉을 주선해 준 대가로 신형 랜드로버를 선물했습니다. 더 조사해야 합니다."
 BRA_searchandseizure: "수색 및 압수"
 BRA_searchandseizure_desc: "수색 및 압수 영장은 이 사건의 중요한 증거를 압수할 수 있게 해 줄 것입니다. 많은 기업과 사람이 연루되어 있어 체포 규모가 대중을 놀라게 할 수도 있습니다."
 BRA_anti_corruption_measures: "부패 척결 대책"
 BRA_anti_corruption_measures_desc: "MPF(연방 검찰청)는 의회가 부패 방지 10대 조치를 통과시키도록 결집하는 운동을 제안했습니다. 이는 우리나라의 부패를 크게 줄이는 데 도움이 될 수 있습니다."
 BRA_parties_of_the_left: "좌파의 정당"
 BRA_parties_of_the_left_desc: "좌파 정부를 계속 유지해야 합니다. 우리는 이전 정부들에서 많은 좋은 일을 했습니다."
 BRA_psl_growth: "브라질 사회자유당 (PSL)의 대두"
 BRA_psl_growth_desc: "보우소나루의 인기가 점점 높아지면서 그의 정당 PSL도 매우 빠르게 성장하고 있으며, 선거를 앞두고는 더욱 그렇습니다."
 BRA_acquit_pmdb: "Acquit MDB"
 BRA_acquit_pmdb_desc: "The Brazilian Democratic Movement (MDB), formerly the Party of the Brazilian Democratic Movement (PMDB), is a centrist Brazilian political party. The PMDB is the biggest party in Brazil and has a huge influence in Congress, the Senate, the Supreme Court, and many other political agencies. If we align with them we might gain some benefits."
 BRA_acquit_workers_party: "Acquit Workers' Party"
 BRA_acquit_workers_party_desc: "노동자당(PT)은 브라질의 좌익 정당입니다. PT는 센트랑(Centrão)의 지지는 그다지 많지 않지만, 전국적으로 폭넓은 대중적 지지를 받고 있습니다."
 BRA_the_new_elections: "새로운 선거"
 BRA_the_new_elections_desc: "선거입니다. 브라질은 긴장된 시기를 맞고 있습니다. 국민들은 극심하게 분열되어 있습니다. PSL, PT, PSDB가 맞붙는 이번 선거는 브라질 역사상 가장 긴장된 선거일지도 모릅니다!"
 BRA_rw_populist: "우익 포퓰리즘"
 BRA_rw_populist_desc: "브라질 좌파의 체포 사태와 실책 이후, 국민들은 반대편 진영과 PSL 같은 정당으로 눈을 돌리고 있습니다."
 BRA_pt_pmdb_coop: "인민당-민주운동 협력"
 BRA_pt_pmdb_coop_desc: "The MDB is a centrist party, which has a huge influence in the Centrão. For now, we are in bad relations with Centrão, but we can change that by seeking support from MDB."
 BRA_pt_hegemony: "인민당의 패권"
 BRA_pt_hegemony_desc: "Our party is already very popular in Brazil. We must make our influence absolute in our country!"
 BRA_rise_electoral_media: "선거 미디어의 등장"
 BRA_rise_electoral_media_desc: "보우소나루는 소셜 미디어, 특히 트위터에서 막대한 지지를 받고 있습니다. 대통령을 지지하는 해시태그나 사람들을 보는 것은 흔한 일입니다."
 BRA_populist_wave: "국가주의 열풍"
 BRA_populist_wave_desc: "보우소나루가 브라질에서 승리하면서 거대한 포퓰리즘 물결이 시작되었습니다. 아크리주에서 히우그란지두술주에 이르기까지, 보우소나루는 전국에서 막대한 지지를 받고 있습니다."
 BRA_christian_democracy: "기독교 민주주의"
 BRA_christian_democracy_desc: "브라질 국민은 기독교적 가치 같은 전통적 가치를 지키기를 원합니다. 이를 위해 더욱 기독교적인 민주주의를 확립해야 합니다."
 BRA_restoration_image: "비전 복원"
 BRA_restoration_image_desc: "카르도주가 물러난 이후, 그의 후계자들이 PSDB가 나아갈 모습을 재건하고 새롭게 구상해야 할 때입니다."
 BRA_underdog: "약자로써의 효과"
 BRA_underdog_desc: "약자라는 위치는 이길지 알 수 없어도 싸울 만한 가치가 있는 무언가를 믿고 싸운다는 점에서 많은 이들에게 호소력이 있습니다. 궁지에 몰린 여우처럼, 우리는 계속 나아갈 것입니다."
 BRA_social_democracy: "브라질 사회민주주의"
 BRA_social_democracy_desc: "사회민주주의는 대부분의 자유주의 계열보다 더 큰 폭으로 경제적·사회적 정의를 옹호하는 폭넓은 좌익 이념들을 가리킵니다. 사회민주주의자들은 자본주의를 인간화하여 불평등과 억압을 억제하고 민주주의를 육성하고자 합니다. 우리 국민은 사회민주주의 체제를 사랑합니다. 이를 채택합시다."
 BRA_liberal_resurgence: "자유주의의 부활"
 BRA_liberal_resurgence_desc: "자유주의는 개인의 권리를 증진하고 국가 권력의 확대보다 자유를 중시하는 중도 이념입니다. 자유주의자들은 자유 시장과 전 세계와의 자유 무역이라는 틀 안에서 진보적 사회 정책을 지지하는 경향이 있습니다. 브라질 국민은 점점 더 자유주의적으로 변하고 있습니다. 우리는 국민을 위한 자유주의 정부가 될 것입니다."
 BRA_reduce_debts: "부채를 줄여라"
 BRA_reduce_debts_desc: "당의 인기를 높이고 브라질 경제를 개선하려면 대외 부채를 줄여야 합니다."
 BRA_foreign_buyouts: "해외 구제 금융 모색"
 BRA_foreign_buyouts_desc: "소액의 자금을 투입하여 지지를 모으고 경제를 개선할 수 있습니다."
 BRA_ciro_gomes: "시루 고메스는 우리를 지지한다"
 BRA_ciro_gomes_desc: "흔히 간단히 시루(Ciro)로 알려진 시루 페헤이라 고메스는 브라질 북동부 세아라주 출신의 중도좌파 정치인이자 변호사, 학자입니다. 경력 동안 시루는 1998년, 2002년, 그리고 가장 최근인 2018년까지 세 차례 대통령 선거에 출마했습니다. 현재 사회민주주의 성향의 민주노동당(PDT) 소속인 시루는 이제 우리에게 지지를 보내고 있습니다."
 BRA_agrarian_reform: "농업 개혁"
 BRA_agrarian_reform_desc: "농지 개혁은 브라질의 오랜 문제, 즉 매우 많은 토지가 극소수의 손에 집중되어 있는 문제에 대한 해법입니다. 이제 이를 끝낼 때입니다."
 BRA_social_programs: "사회 계획"
 BRA_social_programs_desc: "Social Programs are the key to aiding our people."
 BRA_cardoso_legacy: "카르도주의 유산"
 BRA_cardoso_legacy_desc: "가장 위대한 나라가 되려면 브라질은 전 대통령 페르난두 엔히키 카르도주, 즉 FHC의 유산을 따라야 합니다."
 BRA_psdb_pdt_coalition: "사회민주당 - 민주노동당 연합"
 BRA_psdb_pdt_coalition_desc: "PSDB는 최근 몇 년간 상당히 사회민주주의적인 정당이 되었습니다. PDT 같은 다른 정당들과 손을 잡으면 우리의 모든 이해관계를 충족할 수 있습니다."
 BRA_rise_of_moderates: "온건파의 대두"
 BRA_rise_of_moderates_desc: "온건 성향 정치인들이 이제 우리 당을 지지할 것입니다."
 BRA_align_with_other_parties: "새로운 연립 정부 조직"
 BRA_align_with_other_parties_desc: "우리는 브라질을 홀로 통치할 수 없습니다. 다른 정당들, 특히 우리의 이해관계를 충족해 주는 정당들과 함께 통치해야 합니다. 그렇다면 어느 정당을 택할 것입니까?"
 BRA_business_deregulation: "친기업 규제 완화"
 BRA_business_deregulation_desc: "친기업 규제 완화는 국제 투자와 기업가들에게 최선의 선택입니다. 이는 더 많은 일자리를 창출할 것입니다."
 BRA_fight_corruption: "당내 부패 척결"
 BRA_fight_corruption_desc: "PSDB는 부패한 정치인이 가득한 정당으로 잘 알려져 있습니다. 나라를 위해 부패와 맞서 싸워야 합니다."
 BRA_seek_young_vote: "청소년 유권자 확보"
 BRA_seek_young_vote_desc: "젊은 세대의 청년들은 국가의 미래입니다. 만약 우리가 그들의 지지를 얻을 수 있다면, 우린 브라질을 더 오랫동안 통치할 수 있을 겁니다."
 BRA_industrial_congolmerates: "산업 복합 기업"
 BRA_industrial_congolmerates_desc: "브라질은 큰 나라이지만 산업화된 나라는 아닙니다. 산업화의 불꽃을 다시 지필 때입니다!"
 BRA_revitalize_economy: "경제 활성화"
 BRA_revitalize_economy_desc: "경제적 자유주의와 민영화가 우리 경제를 개선하는 길입니다!"
 BRA_healthcare_reforms: "의료 개혁"
 BRA_healthcare_reforms_desc: "SUS(통합보건체계)는 매우 열악하고 불안정한 보건 체계입니다. 이를 개선하면 국민의 건강이 나아질 것입니다."
 BRA_support_from_the_us: "미국으로부터의 지원"
 BRA_support_from_the_us_desc: "미국이 우리 편에 선다면 더 나은 무기를 확보할 수 있고, 국제적으로 강력한 동맹도 얻게 될 것입니다."
 BRA_embrace_free_market: "자유 시장 체계 수용"
 BRA_embrace_free_market_desc: "미국 등 다른 나라들이 기업과 산업을 민영화한 사례를 따르면 우리 경제를 개선할 수 있습니다."
 BRA_bastion_of_liberty: "자유의 보루"
 BRA_bastion_of_liberty_desc: "브라질은 마땅히 되어야 할 세계적 초강대국이 될 것입니다. 우리는 민주주의의 주된 보루가 될 것입니다."
 BRA_education_reforms: "교육 개혁"
 BRA_education_reforms_desc: "브라질의 교육 수준은 매우 낮습니다. 이를 개선하면 지지를 모을 수 있습니다."
 BRA_pre_campaigning: "사전 캠페인"
 BRA_pre_campaigning_desc: "사전 선거 운동은 시간이 지남에 따라 우리의 인기도를 높일 수 있습니다."
 BRA_alliances_with_unions: "노조와의 동맹"
 BRA_alliances_with_unions_desc: "자국의 조합은 성공을 위해서는 필수적입니다. 이러한 체계를 공식화합시다."
 BRA_presal: "리우 개발"
 BRA_presal_desc: "리우데자네이루는 실업 인구가 많은 매우 붐비는 도시입니다. 이들을 새 공장에서 일하게 하여 경제 성장을 이끌지 않을 이유가 있겠습니까?"
 BRA_rise_of_bolsonaro: "볼소나로의 시대"
 BRA_rise_of_bolsonaro_desc: "한때 논란이 되는 의견을 거리낌 없이 쏟아내던 평범한 하원의원에 불과했던 자이르 보우소나루가 이제 브라질의 대통령입니다."
 BRA_brazilian_diplomacy: "브라질 외교"
 BRA_brazilian_diplomacy_desc: "브라질은 강력한 다자 외교를 펼치고 있지만, 대부분의 사람들은 브라질을 국제 무대에서 아무런 발언권이 없는 '외교의 난쟁이'로 여깁니다. 보우소나루는 에르네스투 아라우주를 외무부 수장에 앉힘으로써 브라질 외교 정책을 다른 길로 이끌고자 합니다."
 BRA_ensure_military_support: "군사 지원 보장"
 BRA_ensure_military_support_desc: "예비역 육군 대위 출신인 보우소나루 대통령은 군에 탄탄한 지지 기반을 가지고 있습니다. 이 지지를 활용하는 것은 우리의 정치적 기반을 유지하는 데 필수적입니다."
 BRA_allow_access_to_guns: "총기 사용 허가"
 BRA_allow_access_to_guns_desc: "보우소나루의 주요 공약 중 하나는 미합중국처럼 총기 소지를 다시 허용하는 것이었습니다. 이는 2003년 전 대통령 룰라 시절에 박탈된 권리였기 때문입니다."
 BRA_fight_foreign_influence: "해외 영향력에 대응"
 BRA_fight_foreign_influence_desc: "허약한 국가 때문에 브라질은 외국의 영향을 끊임없이 받고 있습니다. 이를 막기 위해 구체적인 조치를 취해야 합니다."
 BRA_no_ideology: "'이념 없는' 외교 정책"
 BRA_no_ideology_desc: "우리의 외교 정책이 이전 정부의 좌익 이념에 좌우되는 것은 이제 끝입니다. 우리는 이에서 벗어나 우리만의 길을 찾을 것입니다."
 BRA_improve_mil_conditions: "군 복무 환경 개선"
 BRA_improve_mil_conditions_desc: "전쟁이 나면 브라질은 두 시간 분량의 전투 탄약밖에 없다는 속설이 자주 회자됩니다. 외부에서는 우리 군의 여건이 허술하다고 봅니다. 군의 역량에 대한 신뢰를 높이기 위한 조치를 취해야 합니다."
 BRA_increase_mil_budget: "군사 예산 증액"
 BRA_increase_mil_budget_desc: "국가 예산 중 군에 할당되는 비율을 높이면 국방부가 우리 군의 모습을 근본적으로 바꿀 수 있을 것입니다."
 BRA_court_evangelicals: "복음주의 교회 구애"
 BRA_court_evangelicals_desc: "복음주의 교회는 의회에 여러 의원을 두고 있으며 브라질에서 빠르게 영향력을 키우고 있습니다. 이들에게 구애함으로써 강력한 종교적 기반을 확보할 것입니다."
 BRA_call_paulo_guedes: "파울루 게지스 영입"
 BRA_call_paulo_guedes_desc: "파울루 게지스는 시카고학파 출신의 경제학자로, 긴축 예산과 민영화를 내세우는 강경한 통화주의 노선을 가지고 있습니다. 그는 보우소나루의 열렬한 지지자이기도 하며, 일부에서는 그를 보우소나루의 경제학자 버전에 불과하다고 말합니다."
 BRA_insult_usa: "미국을 모욕"
 BRA_insult_usa_desc: "미국인들은 1964년 쿠데타를 도왔고 우리 내정에 끊임없이 간섭하려 하며 세계주의 의제를 조장합니다. 이제 그만하십시오!"
 BRA_insult_china: "중국 기업 국유화"
 BRA_insult_china_desc: "중국인들은 우리 에너지 부문의 주식을 사들이고 이곳에 기업을 세우며 나라를 잠식하려 하고 있습니다. 법의 힘으로 그들의 주식을 되사고 이 빨갱이들을 쫓아내야 합니다!"
 BRA_insult_europe: "트위터에서 유럽 지도자 모욕"
 BRA_insult_europe_desc: "보우소나루의 트위터 사용은 매우 거침없기로 유명합니다. 2019년 한 해에만 프랑스인, 독일인, 스웨덴인 등을 모욕했습니다."
 BRA_crackdown_south_american_socialists: "남미 사회주의자 탄압"
 BRA_crackdown_south_american_socialists_desc: "베네수엘라와 볼리비아 같은 남미 사회주의자들은 언제나 브라질과 자국민에게 골칫거리였습니다. 남미 사람들을 공산주의로부터 \\"해방\\"시킬 때입니다!"
 BRA_the_caribbean_menace: "카리브의 위협"
 BRA_the_caribbean_menace_desc: "쿠바는 혁명 이래로 아메리카 대륙의 위협이었으며, 브라질뿐 아니라 남미의 다른 나라들에도 영향을 미쳤습니다! 쿠바 국민을 구할 때입니다!"
 BRA_new_domestic_identity: "새로운 국내 정체성"
 BRA_new_domestic_identity_desc: "외세의 영향을 막아냈으니, 이제 세계주의에서 자유로운 새로운 브라질의 정체성을 세울 수 있습니다!"
 BRA_court_usa: "미국의 지원을 보장"
 BRA_court_usa_desc: "미국이 우리 편에 선다면 더 나은 무기를 확보할 수 있고, 국제적으로 강력한 동맹도 얻게 될 것입니다."
 BRA_court_israel: "이스라엘의 환심사기"
 BRA_court_israel_desc: "이전의 좌파 정부들은 중동과 관련된 모든 문제에서 아랍 국가들과 이란의 편을 자주 들었습니다. 대사관을 예루살렘으로 옮김으로써 이스라엘의 입장을 지지한다는 강력한 메시지를 보낼 것입니다."
 BRA_talks_with_china: "BRICS와의 협력 강화"
 BRA_talks_with_china_desc: "중국은 브라질에서 상당한 상업적 영향력을 가지고 있습니다. 또한 브라질은 지난 수년간 BRICS와 긴밀히 협력하며 유대를 쌓아 왔습니다. 다시 이들과 손을 잡지 않을 이유가 있겠습니까?"
 BRA_our_south_american_allies: "우리의 남미 동맹국"
 BRA_our_south_american_allies_desc: "남미에는 공산주의 국가가 많지만, 아르헨티나와 파라과이처럼 보수주의 및 자유주의 국가도 있습니다. 이들과의 협력을 강화합시다."
 BRA_be_friend_european_conservatives: "유럽 보수 세력과의 협력 강화"
 BRA_be_friend_european_conservatives_desc: "폴란드와 독일 등 유럽의 많은 나라들은 보수 성향입니다. 이들 나라와 새로운 우호 관계를 맺을 것입니다!"
 BRA_invite_nationalists: "극우 지도자들을 브라질로 초청"
 BRA_invite_nationalists_desc: "강경 우파 지도자들을 정상회의에 초청하여, 세계주의 자유주의자들과 공산주의자들에 맞서기 위해 우리의 목표를 어떻게 일치시킬지 논의해야 합니다!"
 BRA_modernization_equipment: "장비 현대화"
 BRA_modernization_equipment_desc: "브라질 육군, 해군, 공군은 장비를 현대화해야 합니다. 국산 군사 기술에 투자하고 새로운 항공기와 무기를 수입해야 합니다."
 BRA_harsher_conscription: "강화된 징병제"
 BRA_harsher_conscription_desc: "18세가 된 모든 이는 1년간 의무적으로 군에 입대해야 합니다. 그러나 입대자 중 계약 기간을 넘겨 실제로 복무하는 비율은 극히 일부입니다. 모두가 하루 종일 풀밭을 갈퀴질만 하게 되더라도 복무 지속률을 높일 방안을 찾아야 합니다!"
 BRA_volunteer_reformation: "지원병제 개편"
 BRA_volunteer_reformation_desc: "더욱 전문적인 군대를 장려하고, 선전과 더 나은 임금, 경력 전망, 특혜를 통해 지원병 비율을 높여야 합니다."
 BRA_abundant_force: "풍부한 병력"
 BRA_abundant_force_desc: "브라질의 군사력은 다른 남미 국가들을 모두 합친 것에 필적해야 합니다. 우리 군의 압도적인 힘이 모든 외국의 침공에 대한 억지력이 되어야 합니다!"
 BRA_dealing_with_congress: "의회 대응"
 BRA_dealing_with_congress_desc: "브라질 의회는 무능하고 부패했습니다. 의회를 우리에게 유리하게 이용하든 파괴하든, 구체적인 조치를 취해야 합니다."
 BRA_negotiate_centrao: "'센트랑'과 협상"
 BRA_negotiate_centrao_desc: "PMDB, DEM 및 기타 정당은 '빅 센터'라고 불리는 정치적 중도주의자 블록의 일부입니다. 그들의 발언 없이는 법안이 통과되지 않으므로, 우리는 그들의 지원을 위해 그들과 '협상'해야 합니다."
 BRA_make_friends_congress: "의회 내 우군 확보"
 BRA_make_friends_congress_desc: "모든 주요 정당에 핵심 우군을 확보하면 영향력만으로 의회를 통제할 수 있을지도 모릅니다."
 BRA_bolsokids_position: "보우소나루의 아들들을 고위직에 앉히기"
 BRA_bolsokids_position_desc: "에두아르두와 카를루스 보우소나루는 리우의 두 의원이자 자이르 보우소나루의 아들들입니다. 이들을 주요 직책에 앉히면 의회와 내각에 대한 통제력을 확보할 수 있습니다."
 BRA_eduardobolsonaro: "에두아르두 보우소나루, 미국 주재 외교관으로"
 BRA_eduardobolsonaro_desc: "에두아르두는 여행으로 미국을 자주 방문하며 수년간 그곳에서 살기도 했습니다. 그를 미국 주재 외교관으로 두면 국제적 입지를 확보할 수 있습니다."
 BRA_bolsonaro_political_family: "보우소나루 정치 가문"
 BRA_bolsonaro_political_family_desc: "브라질 정치 전반에 폭넓게 퍼진 영향력으로, 보우소나루 정치 가문은 이제 정치의 모든 분야에서 발언권을 가진 브라질 최강의 가문이 되었습니다. 하지만 자이르가 세상을 떠난 뒤에는 누가 뒤를 이을까요?"
 BRA_rally_far_right: "극우를 결집하라!"
 BRA_rally_far_right_desc: "의회의 부패한 '중도파'는 이제 그만! 극우 성향의 모든 의원을 하나의 블록으로 초청하고 '센트랑'을 몰아내야 합니다!"
 BRA_assign_military_cabinet: "군인을 내각에 임명"
 BRA_assign_military_cabinet_desc: "내각에 민간 의원과 '전문가'를 두는 것은 이제 그만두어야 합니다. 강인하고 현명한 군인들을 초청하여 철권으로 나라를 이끌게 해야 합니다."
 BRA_attack_press: "언론의 자유 공격"
 BRA_attack_press_desc: "글로부 네트워크는 이 나라 최대의 뉴스 및 방송 기관이자 보우소나루의 가장 큰 비판자 중 하나입니다. 글로부의 TV 및 라디오 면허를 박탈함으로써 충성이 무엇인지 가르쳐 줄 것입니다."
 BRA_rally_military: "군을 결집하라!"
 BRA_rally_military_desc: "의회는 부패하고 무능합니다! 오직 군만이 이 나라의 문제를 진정으로 해결할 수 있습니다!"
 BRA_auto_coup: "자체 쿠데타"
 BRA_auto_coup_desc: "오늘부로 보우소나루 대통령은 자신의 의회를 상대로 쿠데타를 단행하여 사실상 포고령으로 통치합니다. 군 인사들로 새로운 의회가 구성되며, '납의 시대' 때와 유사한 양당제가 도입됩니다."
 BRA_defund_progressive_policies: "진보 정책 예산 삭감"
 BRA_defund_progressive_policies_desc: "소수자와 성소수자에 관한 진보적 사회 정책은 복음주의 인구 사이에서 극히 인기가 없으며, 이들은 이를 브라질 가정에 대한 공격으로 여깁니다. 복음주의 성직자들에게 더욱 구애하기 위해 이전 정부들이 시행한 모든 사회 정책을 철폐해야 합니다!"
 BRA_assign_evangelical_judge: "연방대법원에 복음주의 판사 임명"
 BRA_assign_evangelical_judge_desc: "정부의 친복음주의 정책을 확고히 하기 위해, 보우소나루는 '지독히 복음주의적인' 대법관을 임명하여 성직자들의 이익을 억제하려는 대법원의 판결에 대응할 것입니다."
 BRA_socialsecurity_reform: "사회보장 개혁"
 BRA_socialsecurity_reform_desc: "브라질의 연금 제도가 파탄에 이르렀다는 것은 잘 알려진 경제 문제입니다. 현 상태가 계속되면 사회보장 지출과 기타 의무 지출이 국가 예산의 60% 이상을 차지하게 되어, 교육과 보건 같은 다른 국가 투자를 위한 여력이 사라질 것입니다. 파울루 게지스는 인기는 없지만 연금 제도의 구조적 문제를 해결할 개혁안을 제안했습니다."
 BRA_tax_reform: "세제 개혁"
 BRA_tax_reform_desc: "브라질의 세금 제도는 극도로 난해합니다. 경제 부문별로 네 가지의 서로 다른 부가가치세율이 있으며(주 단위 부가가치세는 제외), 세법이 너무 복잡하여 전부 책으로 인쇄하면 가족용 승용차만 한 크기가 될 정도입니다. 성장을 촉진하고 외국인 투자를 유치하려면 세법을 완전히 단순화해야 합니다!"
 BRA_privatize_national_companies: "국유 기업 민영화"
 BRA_privatize_national_companies_desc: "브라질은 대체로 시장 경제이지만, 산업의 대부분, 특히 에너지 부문은 여전히 국유화되어 있습니다. 새로운 민영화 협상을 시작하고 브라질 시장을 신규 진입자들에게 개방해야 합니다."
 BRA_mining_amazon: "아마존 채굴"
 BRA_mining_amazon_desc: "아마존의 자연 보호구역에는 손대지 않은 방대한 광물과 석유 매장량이 있습니다. 이 지역의 경제적 개발을 허용하는 법안을 통과시켜야 합니다."
 BRA_glorify_1964_coup: "1964년 쿠데타 찬미"
 BRA_glorify_1964_coup_desc: "브라질 군사 독재, 즉 제5공화국은 1964년 4월 1일에 수립되어 1985년 3월 15일까지 이어진 체제로, 군부 정권들이 연이어 집권했습니다. 권위주의적이고 민족주의적인 성격을 띤 이 체제는 주앙 굴라르 정부를 전복한 군사 쿠데타로 시작되었습니다."
 BRA_brazilian_hypernationalism: "브라질 초민족주의"
 BRA_brazilian_hypernationalism_desc: "우파 세력의 동원은 이미 순조롭게 진행되고 있습니다. 이제 진정한 브라질 초민족주의를 불러일으킬 때입니다."
 BRA_absorb_right_wing: "우익 정당 흡수"
 BRA_absorb_right_wing_desc: "스펙트럼 전반의 우익 정당들은 여전히 조직화되지 못하고 있습니다. 이제 이들을 우리 품으로 끌어들여 흡수할 때입니다."
 BRA_appease_centrao: "센트랑 회유"
 BRA_appease_centrao_desc: "PMDB, DEM 및 기타 정당은 '대중도'라고 불리는 정치 중도주의자 블록의 일부입니다. 그들의 발언 없이는 법안이 통과되지 않으므로, 우리는 그들의 지원을 위해 그들과 '협상'해야 합니다."
 BRA_olavist_policies: "올라부 노선 정책"
 BRA_olavist_policies_desc: "올라부 루이스 피멘텔 지 카르발류는 기자와 점성술사였던 브라질의 수필가이자 디지털 인플루언서, 이데올로그입니다. 스스로 철학자를 자처하는 그는 브라질 보수주의의 대표적 인물입니다."
 BRA_try_to_coup_psl: "새 정당 창당"
 BRA_try_to_coup_psl_desc: "보우소나루는 PSL과 내부 문제를 겪고 있으며 결국 당을 떠날 것입니다. 그러나 새로운 정당이 필요합니다. 그 정당은 \\"동맹당(Aliança)\\"이며 보수 정당이 될 것입니다."
 BRA_bolsonarismo: "보우소나루주의"
 BRA_bolsonarismo_desc: "보우소나루주의는 당선인 자이르 보우소나루를 중심으로 브라질에서 일어난 정치 현상입니다. 2014년 대선 운동 이후 형태를 갖추었으며, 우파의 이상에 대한 새로운 구상을 대표합니다. 이후 이 하원의원의 유권자들의 지지를 받으며 브라질에서 좌파의 힘을 약화시키기 위한 변혁을 추구하고 있고, 대처주의, 트럼프주의, 레이건주의에 비견됩니다."
 BRA_make_alliances_with_centrao: "센트랑과 동맹 체결"
 BRA_make_alliances_with_centrao_desc: "모든 주요 정당에 핵심 우군을 확보하면 영향력만으로 의회를 통제할 수 있을지도 모릅니다."
 BRA_new_ministries: "신규 부처 신설"
 BRA_new_ministries_desc: "우리 정부 아래 나라를 통합하는 데 도움이 될 일련의 신규 부처를 신설할 때입니다. 이 신규 부처들에는 스펙트럼 전반의 다양한 정치인들이 참여하게 됩니다. 이는 안정도를 높일 뿐 아니라 정부 수반으로서 우리의 입지를 더욱 공고히 하는 데에도 도움이 될 것입니다."
 BRA_push_for_economic_liberalisation: "경제 자유화 추진"
 BRA_push_for_economic_liberalisation_desc: "경제적 자유주의와 민영화가 우리 경제를 개선하는 길입니다!"
 BRA_the_brazilian_dream: "브라질의 꿈"
 BRA_the_brazilian_dream_desc: "All across our nation our people cry with pride of the great nation we've become! The world shall now know us as a republic truly worthy of international respect."
 BRA_a_new_way: "새로운 길"
 BRA_a_new_way_desc: "브라질 공화국은 쿠데타로 탄생했으며, 이전의 많은 지도자들도 이미 브라질 공화국이 실패였다고 말한 바 있습니다. 우리는 정치 체제를 바꾸어 옛 방식으로 돌아가야 합니다."
 BRA_old_values: "옛 가치"
 BRA_old_values_desc: "우리에게는 옛 가치를 지키는 보수주의 정부가 필요합니다."
 BRA_side_with_psl: "PSL과 연대"
 BRA_side_with_psl_desc: "PSL은 이념 면에서 우리와 가장 가까운 정당입니다. 그들과 손을 잡지 않을 이유가 있겠습니까?"
 BRA_monarchy_model: "군주제 모델"
 BRA_monarchy_model_desc: "과거 브라질 제국은 입헌 군주제였지만, 많은 이들은 강력한 군주제가 필요하다고 생각합니다. 우리의 군주제는 어떤 모습이 될 것입니까?"
 BRA_modern_monarchies: "현대 군주국"
 BRA_modern_monarchies_desc: "영국과 스페인 같은 현대 군주국들에서 영감을 얻어야 합니다."
 BRA_learnings_from_past: "과거로부터의 교훈"
 BRA_learnings_from_past_desc: "우리는 제국이었던 과거에 많은 실수를 저질렀습니다. 새로운 제국에서는 실수를 반복하지 말아야 합니다."
 BRA_unite_the_people: "Unite the People"
 BRA_unite_the_people_desc: "우리 국민은 정치적으로 매우 분열되어 있습니다. 이들을 하나로 통합해야 합니다!"
 BRA_monarchist_propaganda: "군주주의 선전"
 BRA_monarchist_propaganda_desc: "To restore our Great Empire, our people must know more about the monarchy system."
 BRA_restauration: "복고"
 BRA_restauration_desc: "국가 쇄신으로 힘을 얻은 모든 브라질 국민이 제3 브라질 제국의 탄생을 공고히 할 것입니다! 이제부터 우리는 세계 무대의 강대국으로 떠오를 것입니다!"
 BRA_acabar_isso: "이건 끝내야 한다!"
 BRA_acabar_isso_desc: "좌파는 나라의 경제와 도덕을 망쳐 놓았으며 브라질 가정에 자신들의 이념을 끊임없이 강요하려 합니다. 이것은 끝내야 합니다!"
 BRA_ending_mamata: "'마마타' 종식"
 BRA_ending_mamata_desc: "브라질의 정치인과 입법자들은 모두 국가의 아량에서 한몫을 챙기려 끊임없이 노리는 부패한 자들입니다. 대중이 이 정부를 정치 부패를 끝낼 정부로 인식하도록 만들어야 합니다."
 BRA_new_imperial_university: "새 제국 대학"
 BRA_new_imperial_university_desc: "브라질 최고의 지도자 중 한 명, 어쩌면 최고의 지도자였던 페드루 2세는 교육에 크게 투자했습니다. 페드루의 유산을 따라 우리의 대학과 교육 체계를 개선해야 합니다."
 BRA_government_reform: "정부 개혁"
 BRA_government_reform_desc: "공화국의 오류를 바로잡고 실수를 피하여 세계에서 가장 위대한 군주국이 되어야 합니다!"
 BRA_brazilian_traditional_values: "브라질 전통 가치"
 BRA_brazilian_traditional_values_desc: "대체로 브라질 국민은 보수적이고 기독교적이므로, 전통적 가치를 지키는 것은 우리의 지지를 높일 것입니다."
 BRA_fight_crime: "범죄와의 전쟁"
 BRA_fight_crime_desc: "범죄는 브라질의 거대한 문제입니다. 경찰 예산을 늘리면 브라질의 범죄율을 낮추는 데 도움이 될 것입니다."
 BRA_the_cisplatina: "시스플라티나 문제"
 BRA_the_cisplatina_desc: "1828년 브라질은 남부 시스플라티나 지방에 대한 통제권을 포기해야 했습니다. 오늘날 시스플라티나는 우루과이라 불립니다. 외교든 무력이든 이를 되찾아야 합니다."
 BRA_empire_proud: "제국의 영광"
 BRA_empire_proud_desc: "우리 황제의 치세는 브라질을 재통합하고 안정시켜 번영과 영광으로 이끌었습니다. 또한 우리는 페드루 2세의 유산을 완수했습니다. 영광이여! 제국이여!"
 BRA_appease_military: "군 회유"
 BRA_appease_military_desc: "The Military are our greatest supporters. In the previous governments, they were abandoned. Let's fulfil their needs and avoid the mistakes the previous governments made."
 BRA_pro_bolsonaro_parties: "친보우소나루 정당"
 BRA_pro_bolsonaro_parties_desc: "보우소나루가 계속 집권하도록 하려면 몇몇 정당의 지지를 모아야 합니다."
 BRA_empower_militaries: "군 권한 강화"
 BRA_empower_militaries_desc: "브라질의 권력은 군이 쥐어야 합니다!"
 BRA_eneas_legacy: "에나스의 유산"
 BRA_eneas_legacy_desc: "에네아스 페헤이라 카르네이루는 브라질의 정치인이었습니다. 그는 세 차례 대통령 선거에 출마했습니다. 그는 민족주의·보수주의 정당인 국가질서재건당(PRONA)의 창립자이자 지도자였으며, 이 정당은 보통 극우로 간주되었습니다. 그는 또한 일부 산업의 국유화를 지지했습니다."
 BRA_ending_communism: "공산주의 종식"
 BRA_ending_communism_desc: "공산주의는 브라질의 거대한 재앙이며, 이곳 사람들에게 숱한 고난만을 보여 주었고 그들의 투쟁에 비참함만을 더했습니다."
 BRA_intervention_in_south_america: "남아메리카 개입"
 BRA_intervention_in_south_america_desc: "이 남미 사회주의자들은 이제 그만! 이번에야말로 대륙을 확실히 지배할 때입니다!"
 BRA_pax_brasilis: "팍스 브라질리스"
 BRA_pax_brasilis_desc: "실제 상황을 공식화할 때입니다. 브라질은 라틴 아메리카의 도전받지 않는 지배자입니다. 우리가 진정 무엇을 할 수 있는지 세계에 보여 줄 때입니다."
 BRA_privatize_petrobras: "페트로브라스 민영화"
 BRA_privatize_petrobras_desc: "페트로브라스는 석유 및 정제 부문에서 우위를 가진 국영 기업입니다. 또한 몇몇 부패 스캔들에도 연루되어 있습니다. 브라질 민간 시장을 더욱 확대하려면 페트로브라스를 민영화해야 합니다!"
 BRA_federal_pact: "연방 협약"
 BRA_federal_pact_desc: "연방 협약, 현재 명칭으로는 재정 연방주의는 브라질 연방공화국 헌법(제145조~제162조)에 규정되어 있으며, 그 가운데에서도 특히 연방 구성 단위의 과세 권한과 이들이 담당하는 부과금 또는 공공 서비스가 정의되어 있습니다."
 amazonian_development_project: "§YAmazonian Development Project§! Has Begun"
 denied_amazonian_development_project: "아마존 개발 권리의 거부"
 BRA_idea_growth_through_freedom: "자유를 통한 성장"
 BRA_idea_growth_through_freedom_desc: "시장 내 자유는 자국 경제에 있어서 추가 사업을 촉진하고 양성하기 위해 필수적인 것입니다."
 BRA_idea_foreign_research_and_development: "외국 연구 및 개발"
 BRA_idea_foreign_research_and_development_desc: "외국 연구 및 개발 기간 동안 많은 것들을 배울 수 있었습니다."
 BRA_idea_nossa_economia: "경제 정책"
 BRA_idea_nossa_economia_desc: "자국의 경제는 유연성을 필요로 합니다."
 BRA_idea_imf_debts: "IMF 채무"
 BRA_idea_imf_debts_desc: "The debts we owe the IMF continue to loom over our heads. It deters foreign investors, keeping our great country from international investments and stagnating economic growth. If we do not remove these debts, we will continue to suffer the consequences of past economic despair."
 BRA_idea_amazonian_development_project: "아마존 개발 계획"
 BRA_idea_brazilian_exports: "브라질 수출품"
 BRA_idea_pro_unions: "노동조합주의"
 BRA_idea_pro_farmers: "농부 지원"
 BRA_idea_pro_industries: "우호적인 산업체"
 BRA_idea_crippled_currency: "위태로운 화폐가치"
 BRA_idea_crippled_currency_desc: "과거에 발생한 경제 문제로, 자국의 화폐 국제 가치가 위태롭습니다. 하지만 이는 자국의 통화를 금융 안정화를 위해 사용하여 괄목할만한 성장을 할 수 있다는 말이기도 합니다."
 BRA_idea_brazilian_knack: "브라질식 편법(Jeitinho)"
 BRA_idea_brazilian_knack_desc: "Jeitinho or \"knack\" is more than finding a way to accomplish something by circumventing rules or social conventions. Some people see it as a typically Brazilian method of social navigation where an individual can use emotional resources, blackmail, family ties, promises, rewards or money to obtain favors or to get an advantage. But people forget to mention that this expression also comes from the necessity associated with a lack of resources and help. Most Brazilians have to be creative and invent new more straightforward ways to do things they need. The word \"jeitinho\" comes from the expression dar um jeito, literally \"to find a way\". It implies the use of resources at hand, as well as personal connections, and creativity."
 BRA_idea_angry_natives: "화난 토착민"
 BRA_idea_angry_natives_desc: "The native peoples of Brazil are currently unhappy with the government. They continue to cite a variety of issues including disproportionate pay, poor treatment of workers, and other grievances despite continued improvements in laws."
 BRA_idea_new_wave_ideas: "새로운 이념의 물결"
 BRA_idea_restricted_travelers: "관광객 규제"
 BRA_idea_extensive_border_control: "확장된 국경 통제"
 BRA_idea_diplomatic_powerhouse: "외교국"
 BRA_idea_the_international_mediator: "국제 중재자"
 BRA_idea_a_global_power: "브라질은 강대국이 될 수 있습니다. 우리의 힘을 전세계로 퍼뜨립시다!"
 BRA_idea_a_global_power_desc: "Our country is world-renowned and recognized as one of the great powers of the globe. Our rich and vibrant history and our tumultuous moments of the past put us on par with many other nations of our calibre. It is time we take our place in the world and establish ourselves as a new global power."
