 CAN_IFV_3_desc: "LAV III — третье поколение семейства бронетранспортёров Light Armoured Vehicle (LAV), выпускаемое компанией General Dynamics Land Systems — Canada (GDLS-C), дочерней компанией General Dynamics, базирующейся в Лондоне (провинция Онтарио). Впервые он поступил на вооружение в 1999 году и является основной машиной механизированной пехоты как канадской, так и новозеландской армии."
