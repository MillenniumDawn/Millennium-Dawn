 MER_CHL_tariff_alignment: "Согласование тарифов для Чили"
 MER_CHL_tariff_alignment_desc: "Необходимо профинансировать пересмотр тарифов и административную координацию, необходимые для более тесного приведения таможенного режима Чили в соответствие с таможенным режимом блока.$MER_full_membership_step_one_desc$"
 MER_CHL_customs_system_modernization: "Модернизация таможенной системы Чили"
 MER_CHL_customs_system_modernization_desc: "Предоставить финансирование и техническую поддержку, необходимые для модернизации таможенной службы Чили в целях полного вступления в МЕРКОСУР.$MER_full_membership_step_two_desc$"
 MER_CHL_common_standards: "Поддержите принятие общих стандартов в Чили."
 MER_CHL_common_standards_desc: "Оказать поддержку в завершении нормативно-технической работы, необходимой для принятия Чили общих стандартов МЕРКОСУР.$MER_full_membership_step_three_desc$"
 MER_COL_tariff_alignment: "Согласование тарифов для Колумбии"
 MER_COL_tariff_alignment_desc: "Необходимо профинансировать пересмотр тарифов и административную координацию, необходимые для более тесного приведения таможенного режима Колумбии в соответствие с таможенным режимом блока.$MER_full_membership_step_one_desc$"
 MER_COL_customs_system_modernization: "Модернизация таможенной системы Колумбии"
 MER_COL_customs_system_modernization_desc: "Предоставить финансирование и техническую поддержку, необходимые для модернизации таможенной администрации Колумбии в целях полного вступления в МЕРКОСУР.$MER_full_membership_step_two_desc$"
 MER_COL_common_standards: "Поддержите принятие общих стандартов в Колумбии."
 MER_COL_common_standards_desc: "Оказать поддержку в завершении нормативно-технической работы, необходимой для принятия Колумбией общих стандартов МЕРКОСУР.$MER_full_membership_step_three_desc$"
 MER_VEN_tariff_alignment: "Согласование тарифов для Венесуэлы"
 MER_VEN_tariff_alignment_desc: "Необходимо профинансировать пересмотр тарифов и административную координацию, необходимые для более тесного приведения таможенного режима Венесуэлы в соответствие с таможенным режимом блока.$MER_full_membership_step_one_desc$"
 MER_VEN_customs_system_modernization: "Модернизация таможенной системы Венесуэлы"
 MER_VEN_customs_system_modernization_desc: "Предоставить финансирование и техническую поддержку, необходимые для модернизации таможенной службы Венесуэлы с целью ее полного вступления в МЕРКОСУР.$MER_full_membership_step_two_desc$"
 MER_VEN_common_standards: "Поддержите принятие общих стандартов в Венесуэле."
 MER_VEN_common_standards_desc: "Оказать поддержку в завершении нормативно-технической работы, необходимой для принятия Венесуэлой общих стандартов МЕРКОСУР.$MER_full_membership_step_three_desc$"
 MER_PRU_logistics_corridor: "Разработать логистический коридор для Перу"
 MER_PRU_logistics_corridor_desc: "Профинансировать первый этап создания логистического коридора в столице Перу, чтобы подготовить страну к более глубокой интеграции с МЕРКОСУР.$MER_full_membership_step_one_desc$"
 MER_PRU_cross_border_transport: "Улучшение трансграничных перевозок с Перу"
 MER_PRU_cross_border_transport_desc: "Расширить наземные транспортные связи с Перу и укрепить инфраструктуру, необходимую для присоединения.$MER_full_membership_step_two_desc$"
 MER_PRU_port_connectivity: "Укрепление портовой инфраструктуры для Перу"
 MER_PRU_port_connectivity_desc: "Инвестируйте в цифровые и логистические связи столицы Перу, чтобы поддержать более интегрированный региональный рынок.$MER_full_membership_step_three_desc$"
 MER_BOL_logistics_corridor: "Разработать логистический коридор для Боливии"
 MER_BOL_logistics_corridor_desc: "Профинансировать первый этап создания логистического коридора в столице Боливии, чтобы подготовить страну к более глубокой интеграции с МЕРКОСУР.$MER_full_membership_step_one_desc$"
 MER_BOL_overland_transport: "Расширение сети наземного транспорта в Боливии"
 MER_BOL_overland_transport_desc: "Поддержите модернизацию наземного транспорта в столице Боливии, чтобы сделать присоединение к ЕС ощутимым на материальном уровне.$MER_full_membership_step_two_desc$"
 MER_BOL_border_connectivity: "Улучшение пограничной связи для Боливии"
 MER_BOL_border_connectivity_desc: "В рамках пакета мер по вступлению Боливии в ЕС необходимо инвестировать в цифровые и логистические системы пограничного контроля.$MER_full_membership_step_three_desc$"
 MER_PAN_logistics_corridor: "Разработать логистический коридор для Панамы"
 MER_PAN_logistics_corridor_desc: "Необходимо профинансировать подготовительные работы для создания логистического коридора в столице Панамы, чтобы присоединение к ЕС принесло немедленные выгоды в транспортной сфере.$MER_full_membership_step_one_desc$"
 MER_PAN_port_transport: "Укрепление портового транспорта для Панамы"
 MER_PAN_port_transport_desc: "Окажите поддержку модернизации транспортной инфраструктуры в портах Панамы для улучшения перемещения товаров между рынками МЕРКОСУР.$MER_full_membership_step_two_desc$"
 MER_PAN_trade_connectivity: "Улучшение торговых связей для Панамы"
 MER_PAN_trade_connectivity_desc: "Инвестиции в коммерческую и цифровую связь в Панаме станут заключительным этапом пакета мер по ее вступлению в ЕС.$MER_full_membership_step_three_desc$"
 MER_ECU_development_funds: "Внесите свой вклад в фонды развития Эквадора."
 MER_ECU_development_funds_desc: "Выпустить пакет мер по развитию, финансируемый государством, для Эквадора, чтобы продемонстрировать экономическую ценность полноправного присоединения.$MER_full_membership_step_one_desc$"
 MER_ECU_civilian_industry: "Инвестиции в гражданскую промышленность Эквадора"
 MER_ECU_civilian_industry_desc: "Окажите спонсорскую поддержку новому гражданскому инвестиционному проекту в столице Эквадора в рамках его пути к полноправному членству.$MER_full_membership_step_two_desc$"
 MER_ECU_infrastructure_development: "Поддержка развития инфраструктуры в Эквадоре"
 MER_ECU_infrastructure_development_desc: "Поддержите целенаправленное улучшение инфраструктуры в столице Эквадора для укрепления его готовности к вступлению в ЕС.$MER_full_membership_step_three_desc$"
 MER_GUY_development_funds: "Внесите свой вклад в развитие Гайаны."
 MER_GUY_development_funds_desc: "Выпустить пакет мер по развитию Гайаны, финансируемый государством, чтобы продемонстрировать экономическую ценность полноправного присоединения.$MER_full_membership_step_one_desc$"
 MER_GUY_civilian_industry: "Инвестиции в гражданскую промышленность Гайаны"
 MER_GUY_civilian_industry_desc: "Окажите спонсорскую поддержку новому гражданскому инвестиционному проекту в столице Гайаны в рамках ее пути к полноправному членству.$MER_full_membership_step_two_desc$"
 MER_GUY_infrastructure_development: "Поддержка развития инфраструктуры в Гайане"
 MER_GUY_infrastructure_development_desc: "Поддержите целенаправленное улучшение инфраструктуры в столице Гайаны для укрепления ее готовности к вступлению в ЕС.$MER_full_membership_step_three_desc$"
 MER_SUR_development_funds: "Внесите свой вклад в развитие Суринама."
 MER_SUR_development_funds_desc: "Выпустить пакет мер по развитию Суринама, финансируемый из бюджета, чтобы продемонстрировать экономическую ценность полноправного присоединения.$MER_full_membership_step_one_desc$"
 MER_SUR_civilian_industry: "Инвестиции в гражданскую промышленность Суринама"
 MER_SUR_civilian_industry_desc: "Окажите спонсорскую поддержку новому гражданскому инвестиционному проекту в столице Суринама в рамках его пути к полноправному членству.$MER_full_membership_step_two_desc$"
 MER_SUR_commercial_infrastructure: "Развитие коммерческой инфраструктуры в Суринаме"
 MER_SUR_commercial_infrastructure_desc: "Расширить коммерческую инфраструктуру в столице Суринама, чтобы присоединение принесло ощутимые экономические выгоды.$MER_full_membership_step_three_desc$"
 MER_MEX_industrial_investment_agreement: "Соглашение об промышленных инвестициях с Мексикой"
 MER_MEX_industrial_investment_agreement_desc: "Финансирование промышленной составляющей пакета мер по вступлению Мексики в ЕС посредством крупного инвестиционного соглашения, ориентированного на столицу страны.$MER_full_membership_step_one_desc$"
 MER_MEX_commercial_investment_framework: "Рамочное соглашение о коммерческих инвестициях с Мексикой"
 MER_MEX_commercial_investment_framework_desc: "Создать более широкую структуру для коммерческих инвестиций с Мексикой, укрепив институциональную и экономическую базу для полноправного членства.$MER_full_membership_step_two_desc$"
 MER_MEX_financial_cooperation_package: "Пакет финансового сотрудничества для Мексики"
 MER_MEX_financial_cooperation_package_desc: "Представить окончательный пакет финансового сотрудничества для Мексики, объединяющий коммерческие и цифровые инвестиции, до завершения процесса вступления в ЕС.$MER_full_membership_step_three_desc$"
 MER_launch_corridor_investment_round: "Запуск инвестиционного раунда по коридору МЕРКОСУР"
 MER_launch_corridor_investment_round_desc: "Более сильный блок не может существовать только на бумаге. Выделив новый раунд финансирования коридоров, обеспеченного казначейством, мы сможем ускорить интеграцию инфраструктуры и сетей среди нынешних полноправных членов МЕРКОСУР, улучшив физическую основу блока."
 MER_release_development_fund_round: "Опубликовать раунд финансирования из Фонда развития МЕРКОСУР"
 MER_release_development_fund_round_desc: "Обещания интеграции звучат убедительнее, когда подкреплены видимыми инвестициями. Выделив новый транш из Фонда развития МЕРКОСУР, мы сможем ускорить гражданское строительство и расширение офисной инфраструктуры по всему блоку, укрепив экономические основы его полноправных членов."
