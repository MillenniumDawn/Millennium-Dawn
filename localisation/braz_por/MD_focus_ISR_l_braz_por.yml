 kirya_glilot_tensions: "Tensões Kirya-Glilot"
 kirya_glilot_tensions_desc: "Israel é talvez um dos únicos países do mundo em que as principais organizações de coleta de inteligência estão, de fato, incorporadas às forças armadas. Embora a Inteligência de Defesa de Israel seja uma das mais bem-sucedidas do mundo, as duas unidades mais responsáveis por avaliar a grande quantidade de inteligência coletada vivem em constante rivalidade: o Departamento de Pesquisa, encarregado de analisar informações e enviá-las ao governo, e a Unidade 8200, encarregada de entregar tais informações. O conflito entre as duas muitas vezes atinge tons ásperos, o que dificulta o trabalho conjunto.\n§W--------------§!\nEste espírito nacional será §RRemovido§! e substituído por uma hierarquia de inteligência estabelecida se concluirmos o foco §Y$ISR_research_department_focus$§!, §Y$ISR_aman_info_focus$§! ou §Y$ISR_balance_hatam_aman_focus$§!."
 state_of_tel_aviv: "Estado de Tel Aviv"
 state_of_tel_aviv_desc: "Embora a maioria dos centros urbanos seja um microcosmo de seu país, Tel Aviv é verdadeiramente uma exceção em relação a Israel como um todo. É talvez o terceiro maior centro mundial de startups e inovação, depois do Vale do Silício e do Delta do Rio das Pérolas, atraindo bilhões em investimentos estrangeiros. É também um epicentro do pensamento liberal: a cidade com mais LGBT per capita do planeta e a cidade mais vegana e vegetariana da Terra fora da Índia. Para muitos árabes e israelenses de áreas rurais, a cidade quase parece uma bolha política, a ponto de levar analistas a se referirem a uma 'Solução de Dois Estados' de outra maneira: o Estado de Israel e o Estado de Tel Aviv."
 unintegrated_ultraorthodox_community_1: "Comunidade Ortodoxa §tIsolacionista§!"
 unintegrated_ultraorthodox_community_1_desc: "A Comunidade Ultraortodoxa, comumente conhecida como judeus haredi, é uma comunidade especialmente religiosa dentro da Ortodoxia Judaica. Apesar de seu pequeno número após o Holocausto, David Ben-Gurion aceitou conceder-lhes inúmeras concessões na forma dos 'Quatro Pontos'. Estes, principalmente, permitiam que estudantes de Yeshiva estudassem a Torá sem precisar se preocupar com matérias não relacionadas à Torá em sala de aula, com o serviço militar ou com ingressar na força de trabalho, com o governo subsidiando suas necessidades de vida. Com sua população prevista para crescer de forma excepcionalmente acentuada nas próximas décadas devido à alta taxa de natalidade, a ideia de que uma população desempregada tão grande seja sustentada por dinheiro do governo é impensável. Algo tem que mudar.\n§W--------------§!\nEste espírito nacional §GMelhorará§! se concluirmos focos que atraiam a comunidade haredi para a força de trabalho e para o exército, como §Y$ISR_stop_yeshiva_money$§!, §Y$ISR_redraft_conscription_law$§! ou §Y$ISR_tal_law$§!, e §RPiorará§! se concluirmos focos como §Y$ISR_reform_conversions$§! ou §Y$ISR_spread_out_land$§!. Nunca será §RRemovido§!, mas seus estágios finais se transformam em um bônus."
