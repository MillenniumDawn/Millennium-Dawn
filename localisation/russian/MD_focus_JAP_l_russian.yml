 JAP_seek_permanent_unsc_seat: "Подать заявку на постоянное членство в Совете Безопасности ООН"
 JAP_seek_permanent_unsc_seat_desc: "Экономическое влияние Японии и ее вклад в Организацию Объединенных Наций оправдывают ее постоянную роль в международной безопасности. Для ее обеспечения потребуется постоянное лоббирование и одобрение обеих палат системы Организации Объединенных Наций."
 JAP_zombie_probe_abandoned: "Расследование деятельности фирмы-зомби было прекращено."
 JAP_electronics.300.t: "Компания Sony Ericsson создана"
 JAP_electronics.300.d_agreed: "Компания Ericsson согласилась объединить свой бизнес по производству мобильных телефонов с бизнесом Sony. Ни одна из компаний не продает достаточно телефонов самостоятельно, чтобы составить конкуренцию Nokia и Motorola, а вместе они объединят шведские разработки в области радиотехники и японский дизайн потребительской электроники в одном предприятии. Sony может либо взять на себя обязательства по этому проекту, либо оставить мобильный бизнес в составе группы и продолжать работать самостоятельно."
 JAP_electronics.300.d_alone: "Шведская компания Sony, занимающаяся производством мобильных телефонов, на которую надеялась наладить партнерство, выбрала другой путь. Sony по-прежнему может создать мобильное подразделение на доступных условиях или оставить телефоны в составе группы и согласиться на меньшую долю рынка, на котором она не является лидером."
 JAP_electronics.300.a: "Примите участие в создании совместного предприятия в сфере мобильных технологий."
 JAP_electronics.300.b: "Поддерживайте мобильность внутри группы."
 JAP_electronics.301.t: "Дилемма цифровой музыки"
 JAP_electronics.301.d: "Sony владеет как оборудованием для воспроизведения музыки, так и каталогом, который его наполняет, и обе стороны преследуют противоположные цели. Защита каталога означает, что плееры отказываются принимать форматы, которые уже используются слушателями. Открытие плееров означает, что звукозаписывающее подразделение будет следить за тем, чтобы на его собственных устройствах хранились файлы других пользователей."
 JAP_electronics.301.a: "Защитите каталог с помощью наших собственных форматов."
 JAP_electronics.301.b: "Предоставить игрокам доступ к тому, что у них уже есть."
 JAP_electronics.302.t: "Авантюра PlayStation 3"
 JAP_electronics.302.d: "PlayStation 3 можно построить на базе процессора Cell, разработанного Sony с нуля совместно с IBM и Toshiba. Этот процессор сложен в программировании и не имеет аналогов в отрасли. В таком случае консоль будет продаваться ниже себестоимости в течение многих лет в надежде на то, что программное обеспечение догонит конкурентов. Или же её можно построить по образцу Xbox 360 от Microsoft, и тогда она будет выпущена раньше и по более низкой цене."
 JAP_electronics.302.a: "Создайте машину на основе новой архитектуры."
 JAP_electronics.302.b: "Создайте обычную консоль и выпустите её в продажу как можно скорее."
 JAP_electronics.303.t: "Один Sony"
 JAP_electronics.303.d: "Подразделения Sony десятилетиями работали самостоятельно, и это отражается на продуктах, которые не взаимодействуют друг с другом, и на том, что одни и те же инженерные решения повторяются четыре раза. Объединение их под одной стратегией означает игнорирование мнений тех, кто до этого был прав. Оставив их в покое, мы сохраним то, что было создано благодаря независимости."
 JAP_electronics.303.a: "Объединить подразделения в рамках одной стратегии"
 JAP_electronics.303.b: "Оставьте разделениям их независимость."
 JAP_electronics.304.t: "Поворотный механизм датчика изображения"
 JAP_electronics.304.d: "Датчики изображения Sony устанавливаются в телефоны компаний, с которыми Sony конкурирует, и спрос на них растет быстрее, чем заводы могут их удовлетворить. Сделать датчики центральным элементом компании означает необходимость привлечения капитала, обещанного подразделениям, занимающимся потребительскими товарами. Не производить их означает продать лидерство тому, кто первым создаст необходимые мощности."
 JAP_electronics.304.a: "Сделайте датчики изображения центральным элементом компании."
 JAP_electronics.304.b: "Вкладывайте капитал в потребительские товары."
 JAP_electronics.305.t: "Во что превратилась компания Sony"
 JAP_electronics.305.d: "Четверть века экспериментов, форматов, архитектур и реструктуризаций определили, что представляет собой Sony и для чего нужна японская потребительская электроника. Компания, которая когда-то продавала продукцию Sony, теперь поставляет комплектующие для всех остальных производителей."
 JAP_electronics.305.a: "Одна компания, охватывающая аппаратное обеспечение, контент и услуги."
 JAP_electronics.305.b: "Федерация предприятий, занимающихся производством и продажей оборудования."
 JAP_electronics.305.c: "суверенная вычислительная архитектура"
 JAP_electronics.305.e: "Открытое цифровое содружество"
 JAP_sony_one_sony_ecosystem: "Один Sony"
 JAP_sony_one_sony_ecosystem_desc: "Подразделения работают в соответствии с единой стратегией, и датчики, каталог, консоль и сервисы были созданы для взаимного усиления, а не для конкуренции за один и тот же бюджет. Координация обходится дорого в плане скорости, но в итоге все компоненты отгружаются как единое целое."
 JAP_sony_hardware_federation: "Федерация аппаратного обеспечения"
 JAP_sony_hardware_federation_desc: "Подразделения сохранили свою независимость, и каждое из них стало грозным игроком в своей области. Ничто из того, что производит Sony, не разрабатывается с учетом потребностей всей компании, и каждая деталь в этом продукте очень хороша."
 JAP_sony_cell_sovereign_compute: "Архитектура суверенных вычислений"
 JAP_sony_cell_sovereign_compute_desc: "Япония разработала собственную процессорную архитектуру и окупила её стоимость за счёт поколения игровых консолей. Опыт, полученный в процессе программирования, пережил саму машину, на которой он работал."
 JAP_sony_open_digital_commonwealth: "Открытое цифровое содружество"
 JAP_sony_open_digital_commonwealth_desc: "Форматы стали доступнее, каталог распространился, а аппаратное обеспечение перестало конкурировать с тем, что уже было у людей. Sony зарабатывает меньше с каждого устройства, и её продукция находится в гораздо большем количестве рук."
 JAP_electronics.310.t: "Два экрана, две машины"
 JAP_electronics.310.d: "У Nintendo Game Boy Advance и GameCube отдельные команды разработчиков, отдельные архитектуры и отдельные библиотеки игр, и каждая игра должна разрабатываться либо для одной, либо для другой платформы. Сохранение обеих платформ означает финансирование двух платформ одной компанией. Объединение их в единую компанию положило бы конец бизнесу по производству портативных устройств, который покрывает все остальные расходы."
 JAP_electronics.310.a: "Профинансируйте как портативную, так и консольную версию."
 JAP_electronics.310.b: "Сосредоточьте все на одной платформе."
 JAP_electronics.311.t: "Wii и более широкая аудитория"
 JAP_electronics.311.d: "Следующая консоль Nintendo может привлечь тех, кто не покупает консоли, более дешевым оборудованием, схемой управления, которой еще никто не пользовался, и отсутствием той графической мощности, которую оценивают в прессе. Или же она может пойти навстречу Sony и Microsoft на условиях, уже согласованных индустрией, и оцениваться ими."
 JAP_electronics.311.a: "Создавайте продукты для тех, кто не покупает консоли."
 JAP_electronics.311.b: "Соревнуйтесь на основе результатов."
 JAP_electronics.312.t: "Wii U не поддается объяснению."
 JAP_electronics.312.d: "Продажи новой консоли оказались настолько низкими, что возник вопрос, который никто не хочет задавать: стоит ли Nintendo вообще выпускать аппаратное обеспечение? Ее программное обеспечение продавалось бы на любой консоли, и убытки прекратились бы. Оставаться на рынке аппаратного обеспечения означает финансировать следующее поколение за счет провала предыдущего."
 JAP_electronics.312.a: "Оставайтесь в сфере аппаратного обеспечения и финансируйте следующее поколение."
 JAP_electronics.312.b: "Оставьте оборудование и разместите игры где угодно."
 JAP_electronics.313.t: "Nintendo и телефон"
 JAP_electronics.313.d: "Персонажи Nintendo стоят больше, чем её оборудование, и их можно было бы использовать на любом телефоне в мире. Лицензирование позволяет получать доход от аудитории, до которой консоли никогда не доберутся. Отказ от лицензирования оставляет их эксклюзивными для устройств, контролируемых Nintendo, а именно поэтому эти устройства и покупают."
 JAP_electronics.313.a: "Лицензируйте персонажей для мобильных устройств."
 JAP_electronics.313.b: "Пусть они будут эксклюзивными для нашего оборудования."
 JAP_electronics.314.t: "Переключатель"
 JAP_electronics.314.d: "Одна консоль, которая одновременно является и портативным устройством, и игровой приставкой, положила бы конец расколу, разделявшему инженерный отдел компании на протяжении двух десятилетий, и это означало бы одну библиотеку, одну команду и один провал, если бы это не сработало. Разделение направлений — это то, что Nintendo умеет делать."
 JAP_electronics.314.a: "Создайте одну машину, которая будет одновременно и тем, и другим."
 JAP_electronics.314.b: "Храните портативное устройство и игровую консоль отдельно."
 JAP_electronics.315.t: "Во что превратилась Nintendo"
 JAP_electronics.315.d: "Четверть века существования оборудования, которое никто другой не смог бы создать, определили, что представляет собой Nintendo и насколько тесно она связана с японской индустрией развлечений. Персонажи пережили все консоли, на которых они были установлены."
 JAP_electronics.315.a: "Дисциплинированная гибридная платформа"
 JAP_electronics.315.b: "Интегрированная развлекательная экосистема"
 JAP_electronics.315.c: "Глобальный лицензиар персонажей"
 JAP_electronics.315.e: "Содружество открытых разработчиков"
 JAP_nintendo_disciplined_hybrid_platform: "Дисциплинированная гибридная платформа"
 JAP_nintendo_disciplined_hybrid_platform_desc: "За всем этим стояли одна машина, одна библиотека и одна инженерная организация. Nintendo перестала конкурировать по рекламируемым характеристикам и начала поставлять оборудование, стоимость производства которого ниже, чем его цена."
 JAP_nintendo_integrated_entertainment_ecosystem: "Интегрированная развлекательная экосистема"
 JAP_nintendo_integrated_entertainment_ecosystem_desc: "Персонажи перемещаются по паркам развлечений, фильмам и товарам так же активно, как и по торговым автоматам, и каждая часть этого продает другие. Экспорт японских развлекательных товаров основан на активах, которыми до сих пор владеет одна компания."
 JAP_nintendo_global_ip_licensor: "Глобальный лицензиар"
 JAP_nintendo_global_ip_licensor_desc: "Аппаратное обеспечение стало одним из многих каналов распространения. Nintendo зарабатывает на персонажах, появляющихся на консолях, которые она не производит, на рынках, куда её консоли никогда не доходили."
 JAP_nintendo_open_developer_commonwealth: "Содружество открытых разработчиков"
 JAP_nintendo_open_developer_commonwealth_desc: "Платформа открылась для разработчиков на условиях, не требующих предварительного разрешения. Nintendo получает меньшую долю из гораздо большего каталога, а на этих машинах размещаются работы, которые компания никогда бы не заказала сама."
