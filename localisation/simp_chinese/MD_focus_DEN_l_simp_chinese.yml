l_simp_chinese:
 denmark_focus: "丹麦国策树"
 DEN_army: "军队"
 DEN_army_desc: "丹麦皇家陆军是我国的陆基军事力量，是我军整体的重要组成部分。我们应该研究如何扩大自己的能力。"
 DEN_expand_barracks: "扩建兵营"
 DEN_expand_barracks_desc: "我们目前兵营的容量严重不足，必须扩大以适应不断扩大的新兵队伍。"
 DEN_develop_artillery_models: "发展火炮"
 DEN_develop_artillery_models_desc: "炮兵历史上一直是丹麦军队的重要组成部分，不管我们是否扩大了机械化的主力军，我们的炮兵将永远在那里进行毁灭性的掩护火力。因为这个原因，我们应该考虑扩大和现代化它们。"
 DEN_infantry_equipment_models_1: "新步兵装备模型"
 DEN_infantry_equipment_models_1_desc: "我军几十年来一直缺乏资金，大量资金被老旧装备所占用。我们需要立即纠正这个悲哀的事实！"
 DEN_land_doctrine_1_desc: "作为一个小国，我们的战术总是围绕着比我们的对手更聪明，如果不能比他们更强大的话。军事理论对于我们的军队是非常重要的。"
 DEN_foreign_advisors: "外国顾问"
 DEN_foreign_advisors_desc: "战争艺术日新月异，我们必须随之改变。"
 DEN_revise_the_doctrine: "修改丹麦学说"
 DEN_revise_the_doctrine_desc: "丹麦不需要对其他国家发动战争，除非绝对必要。"
 DEN_joint_material_command: "建立联合物资指挥部"
 DEN_joint_material_command_desc: "作为我们不断进行的军队现代化工作的一部分，我们的几位将军建议我们建立一个新的部门，以协调购买新的军事装备。 新的联合物资司令部将确保更有效的军事开支。"
 DEN_hacker_recruitment_drive: "黑客招募活动"
 DEN_hacker_recruitment_drive_desc: "为应对不断升级的网络威胁，丹麦政府启动一项全面的黑客招募行动，以吸引网络安全和黑客领域的顶级人才。通过有针对性的外联计划、培训计划和激励措施，丹麦政府寻求招募技术娴熟的黑客和网络安全专家，以增强丹麦的网络防御能力。这些新招募的人员将与PET、FE 和其他机构合作，执行检测、减轻和应对针对丹麦利益、关键基础设施和国家安全机构的网络威胁的任务。"
 DEN_refurbish_FAK: "重建FAK"
 DEN_refurbish_FAK_desc: "位于丹麦被称作“福斯瓦萨卡德米特”或“FAK”的国防学院是军队中的独立机构，为我军提供教育、咨询和研究。 不幸的是，随着时间的流逝，它已经发展成一片狼藉。彻底整顿它的结构，强调它的战略重要性，可以产生巨大的效益。"
 DEN_streamline_infantry_production: "优化步兵装备生产流程"
 DEN_streamline_infantry_production_desc: "为了加快采购流程并减轻后勤负担，丹麦政府通过集中制造设施和优化供应链管理来简化步兵装备生产。通过整合生产线和实施精益制造原则，政府旨在提高装备丹麦步兵部队的效率和成本效益。"
 DEN_FAUK: "FAUK"
 DEN_FAUK_desc: "在丹麦语中称为\"Forsvarets Auditørkorps'或FAUK的军事检察院是丹麦军队的法律部门，负责进行任何涉及军队的法律调查。如果我们扩大他们的管辖范围，我们就可以更好地确保我们军队所到之处的法律和秩序。"
 DEN_liquidate_old_stockpiles: "清理旧库存"
 DEN_liquidate_old_stockpiles_desc: "由于我们基地现在每天都有新的步枪到达，后勤官员要求帮助处理旧的库存。近东和非洲对小型武器的永无止境的需求似乎是出售它们的完美地点。"
 DEN_royal_navy: "丹麦皇家海军"
 DEN_royal_navy_desc: "我们位于波罗的海和北海之间的重要战略位置，丹麦皇家海军一直是在该地区行使控制权的关键。 它是迄今为止我们军队中最古老的军种，可以一直追溯到1510年，直到今天仍旧很重要。"
 DEN_refurbish_royal_naval_academy: "重组皇家海军学院"
 DEN_refurbish_royal_naval_academy_desc: "拥有300多年历史的丹麦皇家海军学院有幸成为世界上现存最古老的军官学院。不幸的是，即使对于机构来说，随着年龄的增长，也会悄悄地衰老，海军学院真的可能需要一些重组。"
 DEN_establish_OPLOG_KOR: "建设科瑟海军作战后勤中心"
 DEN_establish_OPLOG_KOR_desc: "OPLOG KOR即是科瑟海军作战后勤中心的简称。科瑟海军基地是我们海军在科瑟当地设立的基础后勤支援基地。该海军基地聚集着我们很大一部分海军力量，随着我们海军的扩张，这一基础后勤支援基地将不可避免地承受更大的压力。因此我们应该把建设科瑟海军作战后勤中心列为优先事项！"
 DEN_establish_OPLOG_FRH: "建设腓特烈海军作战后勤中心"
 DEN_establish_OPLOG_FRH_desc: "科瑟海军作战后勤中心已经扩张，现在是时候扩大在弗雷德里克港其他大型海军基地的基础设施了。"
 DEN_maersk: "马士基"
 DEN_maersk_desc: "马士基是一家1904年成立于丹麦的大型航运公司，我们将为海军征用他们的船坞和工厂"
 DEN_coastal_forts: "丹麦要塞"
 DEN_coastal_forts_desc: "由于世界紧张局势的加剧，我们认为有必要建造掩体和保护性设施，以保护我们的港口，以防海军入侵。"
 DEN_streamline_naval_production: "海军军备流水线生产"
 DEN_streamline_naval_production_desc: "丹麦是旧牌航海国，因此造船业深入到了我国的灵魂深处。而且我们已经弄清了改进和创新的诀窍，所以毫无疑问能在节省海军花费的同时避免在设备上偷工减料。"
 DEN_ark_project: "方舟计划"
 DEN_ark_project_desc: "方舟计划最初是丹麦为了满足北约组织为其成员国设置的海上运输能力要求而设想出的军事计划。专心投入到这个计划可以让我们优先获得性能优良的新式运输船，同时也能深入了解海军护航学说"
 DEN_new_ship_models: "新舰船模型"
 DEN_new_ship_models_desc: "我们不能永远依靠外国海军技术。也许我们应该增加研发部门的资金，看看它们是否可以在竞争中脱颖而出。"
 DEN_naval_doctrine_1: "重视海军学说"
 DEN_naval_doctrine_1_desc: "既然海军是我们最重要的军种，那我们必须全神贯注地重视其学说的改良和提高。"
 DEN_naval_doctrine_2: "海军学说 II"
 DEN_naval_doctrine_2_desc: "我们海战作战理论的改良上进展迅速，但还有发展的空间。"
 DEN_establish_VFK: "建立联合防卫司令部"
 DEN_establish_VFK_desc: "联合防卫司令部，即“Værnsfælles Forsvarskommando”，将会成为丹麦国防部的最高权力机构，管理丹麦武装部队的三大军种。此机构直接隶属于国防部之下，它的建立无疑能够让武装部队与指挥链的配合变得更加紧密协调。"
 DEN_air_force: "空军"
 DEN_air_force_desc: "丹麦皇家空军是三大军种中最年轻的，二战结束后才建立。不管怎样，领空边境在现代战争中的重要性达到了从未有过的地步，我们在空中决不能落后于他国！"
 DEN_early_fighter_models: "早期战斗机型号"
 DEN_early_fighter_models_desc: "丹麦航空历史并不悠久，科研部门在这一方面缺乏研究。如果我们要重启整个航空业，就需要从研发一些能飞的飞机开始。"
 DEN_refurbish_air_force_officers_school: "重组皇家空军军校"
 DEN_refurbish_air_force_officers_school_desc: "丹麦皇家空军军官学校是我们最年轻的一所优秀军事学院，但仍然远远落后于其他国家的空军。让我们抛开经济问题，让该学院重新跟上世界其他空军的步伐。"
 DEN_advanced_bomber_models: "先进轰炸机型号"
 DEN_advanced_bomber_models_desc: "我们早先在国产军用飞机研发方面的尝试是成功的，几位顾问建议我们扩大该项目，使其包括轰炸机项目的研发。"
 DEN_air_doctrine_1: "空军学说 I"
 DEN_air_doctrine_1_desc: "如果飞行员不知道该怎么做，即使是世界上最好的飞机也没用。我们空军的战略需要写进实际的军事理论，以便更好地教育有关的军事人员。"
 DEN_air_doctrine_2: "空军学说 II"
 DEN_air_doctrine_2_desc: "现在，我们的空中条令行动正在顺利进行，我们可以转移一些我们伟大的军事革新家，以支持发展创新的新方式来统治天空。"
 DEN_streamline_aircraft_production: "飞机流水线生产"
 DEN_streamline_aircraft_production_desc: "我们的几位顾问建议我们把为空军生产的飞机带回国。这不仅会带来就业机会，更重要的是，让我们能够剔除中间人，精简基础设施，以确保我们很快就能覆盖红白相间的天空！"
 DEN_renew_foreign_contracts: "更新外国合同"
 DEN_renew_foreign_contracts_desc: "我们自己的工业太小，无法生产我们所需要的一切，因此，我们要依赖外国供应商。"
 DEN_karup_air_base: "扩建卡尔普空军基地"
 DEN_karup_air_base_desc: "卡鲁普空军基地已经是丹麦最大的军用空军基地，但我们需要扩建，而且我们不能再依赖外国飞机，必须自主研发。"
 DEN_mobilize_SSR: "动员陆战总指"
 DEN_mobilize_SSR_desc: "特种支援与侦察部队，又称陆军作战指挥部，是一个专门从事远程和地面侦察的单位。动员他们将有助于推动总体的侦查水平。"
 DEN_SOF: "丹麦特种部队"
 DEN_SOF_desc: "丹麦特种部队由“猎兵军团”、“蛙人部队”以及天狼星雪橇巡逻队组成。尽管规模精悍，他们却活跃于全球各地。如今我们必须确保这支精锐部队获得执行任务所需的装备。"
 DEN_mobilize_hunter_corps: "动员猎兵"
 DEN_mobilize_hunter_corps_desc: "猎兵（丹麦语：Jægerkorpset）是我国主力特种作战部队。其座右铭“Plus esse, quam simultatur”（“实为胜于表”）彰显了他们低调谦逊的作风。在丹麦公众眼中，关于猎兵军团及其成员几乎一无所知，这使得国家的敌人始终无法揣测其真实实力。"
 DEN_natural_gas_deposits: "天然气储量"
 DEN_natural_gas_deposits_desc: "北海是自然资源的聚宝盆。其中储量最大的资源就是天然气 - 如果我们能翻新连接天然气的高压传输管，就能减轻我们其他能源的一些压力。"
 DEN_north_sea_oil: "北海油田"
 DEN_north_sea_oil_desc: "一个跨国财团目前正在领导我们在北海的巨大矿藏的石油生产，而丹麦只得到了低得可笑的分红。好吧，既然他们在我们的领土上，就由我们来制定规则！让我们把螺丝钉钉在他们身上，以确保更大的利润。让我们给他们施加压力，以确保更多的原油利润分红到我们的国家。"
 DEN_urban_improvement_fund: "城市发展基金"
 DEN_urban_improvement_fund_desc: "如今，我们大部分人口居住在大城市，仅哥本哈根就占了总人口的 20% 以上。当然，改善城市必须是我们的首要任务！为此，我们将设立一项基金，以确保大城市的不断扩张和现代化。"
 DEN_windmill_parks: "风车公园"
 DEN_windmill_parks_desc: "维斯塔斯风力系统公司是世界领先的风力发电机生产商，其大型风力发电场是我们可再生能源计划的骄傲和喜悦 - 再建几个风力发电场将确保为我们的市民提供更多清洁能源，同时也将为我们在有气候意识的世界中赢得良好的公关形象。"
 DEN_jutlandic_traffic_mafia: "日德兰交通黑手党"
 DEN_jutlandic_traffic_mafia_desc: "“日德兰交通黑手党”是对一个多党派丹麦议员团体的讽刺绰号，自上世纪80年代以来，他们偶尔胁迫议会的其他成员批准在日德兰建设复杂的高速公路。"
 DEN_energy_exports: "能源出口"
 DEN_energy_exports_desc: "我国富含自然能源，它们可以提高我们的预算。"
 DEN_intensify_flexicurity_model: "加强弹性保障"
 DEN_intensify_flexicurity_model_desc: "我们必须加强与劳动者的联系，增加我国的福利；我们可以通过加强灵活性安全性来确保这两点。"
 DEN_more_refineries: "建造更多精炼厂"
 DEN_develop_fyn: "发展菲英"
 DEN_industrialize_greenland: "格陵兰工业化"
 DEN_industrialize_greenland_desc: "格陵兰岛仍然全部是农业用地，我们可以使用他们的一些土地作为工业用地。"
 DEN_develop_aalborg: "发展奥尔堡"
 DEN_develop_aalborg_desc: "奥尔堡是第四大城市，也是依兰省第二大城市，我们需要进一步发展它，以容纳我们的工业。"
 DEN_refugees_welcome: "欢迎难民！"
 DEN_refugees_welcome_desc: "鉴于全球局势日益紧张，中东战火不断，我们有必要帮助那些逃离战争和恐怖主义的人们。短期内，他们或许会引发政治动荡，但从长远来看，他们或许能够对我们的经济产生显著的积极影响。"
 DEN_the_retirement_reform: "退休改革"
 DEN_the_retirement_reform_desc: "老年人应该得到极大的尊重，而且不必为财务状况担心。"
 DEN_restrict_immigration: "限制移民"
 DEN_restrict_immigration_desc: "保护丹麦文化的第一步是限制外来影响，而最有效的方法是限制移民。这可能会给我们的人口分布带来潜在问题，但为了保护我们熟悉和喜爱的丹麦，这肯定是值得的。"
 DEN_outlaw_hijab: "禁止穆斯林佩戴头巾"
 DEN_outlaw_hijab_desc: "一段时间以来，一些爱国人士表达了他们的担忧，认为一些女性 - 主要是移民 - 公开佩戴在我们的社会中被广泛视为宗教压迫象征的服饰。她们声称这是“她们自己的选择”，但这难道不正是那些被迫佩戴这种服饰的人会说的话吗？无论如何，这显然与丹麦文化相去甚远。我们或许应该在它蔓延之前禁止它。"
 DEN_antagonize_scandinavians: "对抗斯堪的纳维亚"
 DEN_antagonize_scandinavians_desc: "丹麦一直是斯堪的纳维亚半岛最强大的国家。我们根本不关心挪威那些散居各地的山地猴子，也不关心瑞典那些政治正确的太监 - 事实上，我们乐于嘲笑他们，拿他们开玩笑。"
 DEN_conservative_legislation: "保守立法"
 DEN_conservative_legislation_desc: "我们的文化和习俗必须得到保护和传承，我们必须保护自己免受外来影响。"
 DEN_fund_national_church: "投资国家教会"
 DEN_fund_national_church_desc: "福音派路德宗是丹麦的国教，但不幸的是，每年信仰的人数都在减少。除此之外，我们还发现布道的牧师变得越来越少。我们需要立刻改变这一现状 - 精心筹划的宣传活动将会使它焕发生机！"
 DEN_revive_folk_high_school_movement: "复兴民间高等学校运动"
 DEN_revive_folk_high_school_movement_desc: "民间学校运动的初衷是将丹麦文化的价值观带给每一位愿意就读的男女 - 这是一个真正崇高的目标，不仅应该保留，还应该进一步发展！扩大民间高中体系将使人们能够团结起来，弘扬真正的丹麦文化。"
 DEN_venerate_country: "丹麦人民党"
 DEN_venerate_country_desc: "现在是时候回归丹麦文化的真正基石 - 我们的国家了。过去几十年里，国际主义者和全球主义者如雨后春笋般涌现，他们攻击“国家依靠自身力量最强大”的理念，但这些新奇的意识形态却丝毫没有意识到，在它们出现之前，丹麦和丹麦人民就已经发展得很好了。让我们团结起来，回归我们的祖国丹麦！"
 DEN_venerate_values: "保守人民党"
 DEN_venerate_values_desc: "现在是时候回归丹麦文化的真正基石 - 价值观了。无论身处世界何处，丹麦人始终是丹麦人。他肩负着这些价值观，即使身处异乡，也无法摆脱它们的影响。让我们共同守护这些价值观，因为它们是真正意义上的丹麦人的核心理念！"
 DEN_venerate_queen: "女王"
 DEN_venerate_queen_desc: "现在是时候团结在丹麦文化的真正基石 - 女王 - 的怀抱了。我们的王室不仅可以追溯到欧洲最早的国王，女王本人也散发着优雅高贵的气质。她鲜少受到批评，却深受所有人爱戴，她是丹麦文化的活生生的化身，理应受到如此尊崇。"
 DEN_border_control: "推行边境政策"
 DEN_border_control_desc: "我们党内成员长期以来一直呼吁政府将非法移民视为当今社会面临的首要威胁。鉴于我们近期获得了越来越多的支持，或许现在政治机器能够为我们服务了。我们甚至可以考虑加强边境军事管制以达到目的 - 毕竟，我们的支持者们都喜欢看到武力展示。"
 DEN_expand_police_force: "扩编警力"
 DEN_expand_police_force_desc: "世界气候变暖之际，我们却不得不同时应对国内的犯罪问题 - 无论是组织犯罪还是受跨境盗窃团伙纵容的犯罪 - 这简直令人无法容忍。我们必须立即让警察局长们明白，无论他们需要什么，我们都愿意提供。我们的人民必须能够安心入睡！"
 DEN_abolish_section_19: "废除宪法十九条"
 DEN_abolish_section_19_desc: "丹麦宪法第19条规定，未经议会同意，国王（或王后）不能采取任何有潜在政治影响的行动或“大范围”的行动。这个愚蠢的限制将不再妨碍我们的女王与来自世界各地的国家元首的日常会晤。不要再把她当做一个需要监督的孩子，而是相信她能做好。"
 DEN_restrict_greenlandic_autonomy: "限制格陵兰岛自治"
 DEN_restrict_greenlandic_autonomy_desc: "格陵兰人一次又一次地表明，他们的无能根本不允许他们进行任何程度的自治。相反，我们需要限制他们的自治权，并征召他们中的大部分酒鬼在丹麦军队中生活。毕竟，我们这样做是为了他们自己好。"
 DEN_encourage_family_values: "鼓励家庭价值观"
 DEN_encourage_family_values_desc: "家庭，幽默，开放的心态，信任，当然还有我们著名的“舒适的环境”。这些是我们在面对一个不断变化的世界时必须共同保护的价值观。我们将促进“家庭第一 ”的文化，鼓励我们的年轻人安定下来，生儿育女，而不是被现代社会的任何诱惑所腐蚀。"
 DEN_improve_danish_roads: "改善丹麦的乡村环境"
 DEN_improve_danish_roads_desc: "我们选择了丹麦，因此我们必须履行对丹麦人民的承诺，投资于丹麦人民。通过扩建公路网，许多人的日常生活出行将更加便捷。"
 DEN_danish_military: "丹麦国防"
 DEN_danish_military_desc: "“丹麦国防部”一直以来都得到丹麦人民党和保守派人民党的大力支持。现在是我们兑现对士兵的承诺，确保他们获得所需一切的时候了。"
 DEN_danish_civilian_industry: "丹麦民用工业"
 DEN_danish_civilian_industry_desc: "我们需要确保丹麦人民有工作机会，我们将通过提高外国产品在丹麦的税收来做到这一点，这样我们将使丹麦公司更具有可持续性，并能更好地与外国竞争。"
 DEN_draft_new_constitution: "起草新宪法"
 DEN_draft_new_constitution_desc: "除了优雅高贵的气质，女王还展现出精明睿智的政治头脑。她已经明确表示，她完全有能力统治这个与生俱来的国家，现在许多人呼吁正式确认这一点。然而，这需要对宪法进行大刀阔斧的修改 - 或许重新起草一部新宪法会更容易些。"
 DEN_broken_system: "体制崩溃"
 DEN_broken_system_desc: "我们今天面临的最大挑战是我们自己。掌权者早就证明，他们除了自己的利益，什么都不在乎。如果我们要创造一个更好的丹麦，我们必须准备好拆掉目前以它为名的国家的外壳。"
 DEN_fight_nationalists: "打击民族主义！"
 DEN_fight_nationalists_desc: "国家崩溃，革命一触即发！只有反革命的极端民族主义者阻挡我们通向全新的未来！"
 DEN_state_atheism: "国家无神论"
 DEN_state_atheism_desc: "民族主义者已被驱逐出境，女王已被流放，丹麦教会已被解散 - 我们必须确保“上帝、女王和国家”这三个陈旧观念永远不会以任何形式卷土重来。我们将创造的未来是无神论、平等主义和国际主义的未来！"
 DEN_communist_propaganda: "共产主义宣传"
 DEN_communist_propaganda_desc: "我们需要让人民知道共产主义到底有多伟大！"
 DEN_path_of_true_equality: "真正的平等之路"
 DEN_abolish_monarchy: "废黜王室"
 DEN_abolish_monarchy_desc: "女王和她所代表的机构都是逝去时代的遗物。我们团结一致，共同开创一个没有国王和王后的未来，人人生来平等。女王必须退位并被流放，不惜一切代价！"
 DEN_peaceful_revolution: "和平革命"
 DEN_peaceful_revolution_desc: "我们的革命不必是流血的 - 通过强调社会主义的民主层面，我们可以鼓励支持者积极投票，而不是诉诸武力来实现革命。让我们共同缔造一场和平的革命。"
 DEN_raise_unemployment_benefits: "提高失业救济金"
 DEN_raise_unemployment_benefits_desc: "每当经济衰退需要有人承担责任时，弱势群体和失业者往往成为众矢之的。然而，我们认为，失业并不意味着你比你的邻居低人一等。"
 DEN_seize_state_power: "控制国家！"
 DEN_seize_state_power_desc: "时机已到！发出信息：所有支持工人国家的人都要武装自己！我们向权力中心进军，我们不接受任何除开政府完全投降的做法！"
 DEN_new_foreign_policy: "新外交政策"
 DEN_new_foreign_policy_desc: "丹麦经常被视为国际社会的初级成员。不过，事情并不总是这样。“丹麦”曾经是一个被尊重的名字，丹麦人曾经是一个自豪的民族，不畏惧探索新的疆域，扩大丹麦王国的范围。我们可以再次成为这样的人，我们将再次成为这样的人。"
 DEN_world_revolution: "世界革命"
 DEN_world_revolution_desc: "全世界工人团结起来！马克思和恩格斯在其所著的《共产党宣言》中清楚地写道革命只有在世界范围内进行才会成功。我们将使工人摆脱国家主义的束缚，即使这可能要花点时间去...说服他们。"
 DEN_international_diplomacy: "国际外交"
 DEN_international_diplomacy_desc: "我们必须开始投资于全球的外交努力。"
 DEN_import_leopards: "进口豹子"
 DEN_import_leopards_desc: "通常情况下，进口豹子是违反动物保护法的。但对于这些野猫，我们将破例。"
 DEN_befriend_germany: "对德友好"
 DEN_befriend_germany_desc: "我们南部邻国，德国认为我国不值一提，让我们告诉他们我国有着举足轻重的地位吧。"
 DEN_reaffirm_nato: "肯定北约"
 DEN_reaffirm_nato_desc: "如果没有北约的保护，我们很可能已经被苏联人从全球抹除了。"
 DEN_leave_nato: "脱离北约"
 DEN_leave_nato_desc: "为了确保丹麦在世界政治上的位置，我们必须离开北约。"
 DEN_western_values: "传播民主"
 DEN_western_values_desc: "虽然北约是一个防御性联盟，但北约内部的国家一直以试图在世界各地传播民主而闻名。"
 DEN_befriend_sweden: "对瑞典友好"
 DEN_befriend_sweden_desc: "瑞典是我们北方的朋友，非常喜欢肉丸子，让我们和他们交朋友吧。"
 DEN_befriend_norway: "对挪友好"
 DEN_befriend_norway_desc: "凶残的北欧维京已经不复存在，现在只剩下了友好的挪威人民，我们有很多机会建立彼此的友谊。"
 DEN_befriend_the_baltic_states: "对波罗的海国家友好"
 DEN_befriend_the_baltic_states_desc: "爱沙尼亚、拉脱维亚和立陶宛对我们贸易至关重要，让我们与他们交朋友吧！"
 DEN_scandinavian_focus: "斯堪的纳维亚国策"
 DEN_scandinavian_focus_desc: "专注北欧国家"
 DEN_embrace_nordic_cooperation: "接受北欧国家之间的合作"
 DEN_embrace_nordic_cooperation_desc: "接受北欧国家之间的合作"
 DEN_terminate_nordic_cooperation: "离开北欧理事会"
 DEN_terminate_nordic_cooperation_desc: "目前的情况使得与斯堪的纳维亚国家的任何更紧密的合作都是不可能的。"
 DEN_remember_history: "回归荣耀"
 DEN_remember_history_desc: "我们曾经领导过卡尔马联盟，我们将再次这样做，即使我们不得不强迫它。"
 DEN_slesvig_holstein: "石勒苏益格-荷尔斯泰因"
 DEN_slesvig_holstein_desc: "石勒苏益格-荷尔斯泰因的人民可能投票赞成留在德意志共和国境内，但我们确信那次选举是被操纵的，现在是时候让他们回归丹麦的根源了。"
 DEN_ancient_history: "1219"
 DEN_ancient_history_desc: "我们曾经以在波罗的海的爱沙尼亚有一个立足点，但是1219年丹内布罗格在爱沙尼亚被打倒，过去的爱沙尼亚的边界已经改变。"
 DEN_finlands_history: "瑞典？芬兰？丹麦？"
 DEN_finlands_history_desc: "当瑞典还是卡马尔联盟的一部分时，他们也拥有芬兰的领土，当时芬兰的领土延伸到了今天俄罗斯认为属于他们的一些地方"
 DEN_viking_age: "维京时代"
 DEN_viking_age_desc: "（占位符效应）在维京时代，我们在英格兰北部拥有立足之地，包括设得兰群岛、奥克尼群岛和海峡群岛，它们被用作我们劫掠的集结地，它们可以再次成为那样的地方。"
 DEN_danelaw: "丹麦法区"
 DEN_danelaw_desc: "丹麦法区是英格兰在挪威人控制下的地区，我们曾经拥有这些土地，我们将再次拥有它们。"
 DEN_leave_schengen: "离开申根协定"
 DEN_leave_schengen_desc: "每个国家都应该收回自己的权利，在没有严格控制的情况下，不允许任何人进入。"
 DEN_private_industry: "丹麦私营工业"
 DEN_private_industry_desc: "随着丹麦在该地区的地位不断提升，我们应该确保在丹麦开展业务具有吸引力。"
 DEN_nordic_films: "北欧电影公司"
 DEN_nordic_films_desc: "北欧电影公司于1906年11月6日在哥本哈根的瓦尔比地区成立。今天，他们不仅制作电影，而且还经营着丹麦的许多电影院。"
 DEN_DISA: "迪砂"
 DEN_DISA_desc: "该公司最初名为丹麦雷克尔步枪复合体 A/S，后更名为丹麦工业复合体 A/S (DISA)。自二战以来，该公司生产的武器被世界各地广泛使用。但与舒尔茨&拉森公司一样，二战后其业务也开始下滑。现在是时候激励该公司扩大规模，恢复武器生产，从而确保丹麦军队能够获得丹麦制造的武器装备。"
 DEN_novo_nordisk: "诺和诺德"
 DEN_novo_nordisk_desc: "诺和诺德是一家丹麦制药公司，生产胰岛素、血友病药物、生长激素和性激素，除此之外，它是丹麦最大的公司，几乎是马士基的两倍"
 DEN_vestas: "维斯塔斯风力系统"
 DEN_vestas_desc: "维斯塔斯是丹麦第四大公司，成立于1898年，最初是一家铁匠铺，直到20世纪70年代的石油危机才发展成为如今的全球风力发电机制造商。"
 DEN_skandinavisk_aero_industri: "斯堪的纳维亚航空工业"
 DEN_skandinavisk_aero_industri_desc: "斯堪的纳维亚航空工业公司是一家昙花一现的丹麦企业，专注于飞机制造（1937-1954）。在我们成为区域强国之后，是时候找到生产我们自己的飞机的方法，并重振这个行业了。"
 denmark.1.a: "飞吧，宝贝，飞吧！"
 denmark.2.t: "预测[DEN.GetAdjective]保守派将取得重大胜利"
 denmark.2.d: "[DEN.GetAdjective]保守派在自90年代初以来一直处于衰落状态之后，似乎已经卷土重来。当被问及这一转折的原因时，一位政治评论家说，新千年的国际文化交流似乎让许多丹麦人漂泊不定，没有归属感，并使丹麦的价值观成为政治讨论的中心点。保守派领导层已经开始准备利用这种新发现的支持，他们在演讲中强调坚定不移地捍卫“使我们作为[DEN.GetAdjective]的一切”。"
 denmark.2.a: "回到八十年代"
 denmark.3.t: "在[DEN.GetName]中令人惊讶的君主主义发展情况"
 denmark.3.d: "自1849年以来，[DEN.GetName]一直是一个君主立宪制国家，从那时起，君主的作用主要是礼仪性的。然而，一场要求[DEN.GetAdjective]君主有更大程度的政治自主权的新的君主主义运动正在迅速获得公众的支持。到目前为止，女王本人还没有就此事发表任何公开评论，但政治评论家指出，以她的教育背景，在索邦大学和伦敦经济学院学习过政治学和各种学术领域，理论上她会是政治舞台上的一个合格演员。"
 denmark.3.a: "天哪！"
 denmark.18.t: "王储领导"
 denmark.18.d: "弗雷德里克预计将在未来几天内接管军队，凭借他此前接受的广泛军事训练，他有望成为丹麦近年来最优秀的将领之一。弗雷德里克的弟弟约阿希姆也曾是一名军官，预计他也会再次加入军队。"
 denmark.18.a: "引领我们走向伟大"
 denmark.19.t: "提议购买"
 denmark.19.d: "丹麦已向英国提出购买设得兰群岛、奥克尼群岛以及海峡群岛的提议，因为这些岛屿曾是丹麦王国的领土。"
 denmark.19.a: "当然，反正我们也不喜欢这些岛"
 denmark.19.b: "这是不可能的"
 denmark.20.t: "弗雷德里克十世"
 denmark.20.d: "今天，女王玛格丽特二世宣布辞去丹麦女王的职务，她将把国家的控制权交给她的大儿子弗雷德里克十世国王。"
 denmark.20.a: "愿他统治长久"
 denmark.21.t: "一个崭新的卡尔马联盟"
 denmark.21.d: "今天，丹麦试图通过改革原有的卡尔马联盟来加强北欧和波罗的海国家之间的合作，但这一次，由于波罗的海国家与丹麦之间已经建立了密切的合作关系，丹麦向波罗的海国家发出了邀请。"
 denmark.21.a: "我们接受"
 denmark.21.b: "这不可能"
 denmark.21.c: "这不是我们能决定的…"
 denmark.39.t: "邀请冰岛加入联盟"
 denmark.39.d: "丹麦发出了加入斯堪的纳维亚联盟的邀请，接受邀请我们将成为斯堪的纳维亚的共产主义集团的一部分。"
 denmark.39.a: "听起来很不错！"
 denmark.39.b: "没门！"
 denmark.40.t: "邀请瑞典加入联盟"
 denmark.40.d: "丹麦发出了加入斯堪的纳维亚联盟的邀请，接受邀请我们将成为斯堪的纳维亚的共产主义集团的一部分。"
 denmark.40.a: "听起来很不错！"
 denmark.40.b: "没门！"
 denmark.41.t: "邀请挪威加入联盟"
 denmark.41.d: "丹麦发出了加入斯堪的纳维亚联盟的邀请，接受邀请我们将成为斯堪的纳维亚的共产主义集团的一部分。"
 denmark.41.a: "听起来很不错！"
 denmark.41.b: "没门！"
 denmark.42.t: "邀请芬兰加入联盟"
 denmark.42.d: "丹麦发出了加入斯堪的纳维亚联盟的邀请，接受邀请我们将成为斯堪的纳维亚的共产主义集团的一部分。"
 denmark.42.a: "听起来很不错！"
 denmark.42.b: "没门！"
 denmark.4001.t: "丹麦需要一些战斗机！"
 denmark.4001.d1: "作为北约的一部分，丹麦要求我们分享一些战斗机以帮助保护天空，这样做肯定会维护组织的团结，并会提升和[DEN.GetLeader]的关系。"
 denmark.4001.d2: "作为阵营的一部分，丹麦要求我们分享一些战斗机以帮助保护天空，这样做肯定会维护组织的团结，并会提升和[DEN.GetLeader]的关系。"
 denmark.4001.o1: "当然"
 denmark.4001.o2: "做梦呢！"
 denmark.4002.t: "我们的盟友来帮助我们了"
 denmark.4002.d1: "[USA.GetLeader]已经完成了为我们勇敢的空军交付一批崭新战斗机的手续！[DEN.GetLeader]据说对[USA.GetAdjective]政府提供的援助感到欣喜若狂，并将亲自监督这些战斗机的交付。"
 denmark.4002.d2: "[SOV.GetLeader]已经完成了为我们勇敢的空军交付一批崭新战斗机的手续！[DEN.GetLeader]据说对[SOV.GetAdjective]政府提供的援助感到欣喜若狂，并将亲自监督这些战斗机的交付。"
 denmark.4002.o1: "聪明的行为！"
 denmark.4003.t: "我们的盟友拒绝向我们提供援助！"
 denmark.4003.d1: "[USA.GetLeader]拒绝签署为我们勇敢的空军提供一些闪亮的新型战斗机！据说[DEN.GetLeader]对[USA.GetAdjective]政府的表现感到愤怒，并一直试图得到华盛顿的回应，但无济于事。"
 denmark.4003.d2: "[SOV.GetLeader]拒绝签署为我们勇敢的空军提供一些闪亮的新型战斗机！据说[DEN.GetLeader]对[SOV.GetAdjective]政府的表现感到愤怒，并一直试图得到莫斯科的回应，但无济于事。"
 denmark.4003.o1: "混账东西！"
 denmark.22.t: "厄勒海峡大桥"
 denmark.22.d: "1995年开始建造连接斯亚兰岛和斯科讷岛的工程，目的是使欧洲其他地区和北方的贸易更加便利。丹麦和瑞典都签署了《申根协议》，取消了我们之间的边境和护照管制。"
 denmark.22.a: "斯科讷是丹麦的！"
 denmark.23.t: "图勒空军基地"
 denmark.23.d: "丹麦和美国签署了一项协议，对位于格陵兰岛的图勒空军基地进行现代化改造。二战期间，德国占领丹麦时，丹麦驻美国大使与美国达成协议，允许丹麦保卫其在格陵兰岛的殖民地免受德国的任何攻击，这促成了图勒空军基地的建设。此后，该基地一直由美国控制并运作至今。"
 denmark.23.a: "希望他们永远不要试图购买格陵兰岛"
 denmark.24.t: "汉斯岛"
 denmark.24.d: "汉斯岛是北极圈内一块无人居住的荒芜岩礁，丹麦和加拿大一直就其归属问题存在争议。这场争端自1933年以来就一直持续至今。1984年，一位丹麦部长在岛上插上了丹麦国旗，并留下了一瓶烈酒。此后，由“征服者”在岛上留下国旗和一瓶酒便成了惯例。"
 denmark.24.a: "欧洲的加拿大"
 denmark.25.t: "穆罕默德漫画"
 denmark.25.d: "丹麦报纸《日德兰邮报》近日刊登了一幅由库尔特·韦斯特加德创作的漫画，漫画中先知穆罕默德的头巾里藏着一枚炸弹。这幅漫画引发了整个伊斯兰世界的强烈愤慨，多个国家禁止进口丹麦产品。"
 denmark.25.a: "可...言论自由？"
 denmark.26.t: "撤离伊拉克"
 denmark.26.d: "丹麦政府宣布将从伊拉克撤军。丹麦是最早参加2003年入侵的联军国家之一。"
 denmark.26.a: "我们为什么要选择战斗？"
 denmark.27.t: "谋杀库尔特·韦斯特加德的阴谋"
 denmark.27.d: "丹麦警方破获了杀害先知穆罕默德素描原漫画家库尔特·韦斯特加德的阴谋，导致另一家报纸转载穆罕默德漫画，再次引发抗议。"
 denmark.27.a: "让我们再来一次吧"
 denmark.28.t: "北极军事指挥部"
 denmark.28.d: "由于冰盖的融化，格陵兰岛及其周围的水域已经成为一个新开辟的”战场“，因此丹麦已经成立了一个特别工作组来应对未来的时代。"
 denmark.28.a: "希望不会有太多的冰块融化"
 denmark.29.t: "哥本哈根峰会"
 denmark.29.d: "2009年，哥本哈根举行了气候会议，虽然没有达成任何明确的结论，但整个峰会使丹麦经济受益，并让我们再次成为国际社会关注的焦点。"
 denmark.29.a: "人们注意到了我们！"
 denmark.30.t: "袭击库尔特·韦斯特加德"
 denmark.30.d: "周五深夜，一名28岁的索马里男子试图闯入库尔特·韦斯特加德的家中，用斧头将其杀害。现年74岁的库尔特·韦斯特加德躲在自家浴室里，保护着他的孙女。在悲剧发生之前，警方赶到现场，并在袭击者拒捕时开枪击中了他的膝盖和手部，将其制服。"
 denmark.30.a: "世界会变成什么样子？"
 denmark.31.t: "挫败对日德兰邮报总部的袭击"
 denmark.31.d: "警方发现并制止了一场本应发生在日德兰邮报总部的袭击事件，原因可能是印刷了穆罕默德的图画。"
 denmark.31.a: "零支出的高效警察"
 denmark.32.t: "重新实施边境管制"
 denmark.32.d: "为了更好地打击非法移民，丹麦重新实施了边境管制。由于1995年《申根协议》废除了西欧大部分地区的内部边界，许多国家对此的合法性提出质疑。"
 denmark.32.a: "该死的丹麦人，他们毁了丹麦"
 denmark.33.t: "同性婚姻"
 denmark.33.d: "2012年6月，丹麦决定将同性婚姻合法化，得到了民众的大力支持。然而，一些保守派神父公开反对，声称它违背了“教会价值观的基本原则”。"
 denmark.33.a: "兄弟之前...."
 denmark.34.t: "教师工会"
 denmark.34.d: "由于学年安排存在争议，丹麦教师工会决定关闭学校，因为早前的事实证明，教师实际上只用了40%的工作时间来教学生，其余时间都花在了准备上。"
 denmark.34.a: "但我不想让我的孩子在家里？"
 denmark.35.t: "丹麦的恐怖活动"
 denmark.35.d: "2015年2月初，哥本哈根发生了三起不同的枪击事件。\n\n第一起枪击事件发生在当时正在举办言论自由活动的克鲁登咖啡馆，导致电影导演芬恩·诺尔加德身亡。\n\n第二起枪击事件发生在犹太教堂，志愿警卫丹·乌赞被杀。\n\n第三起枪击事件发生在一栋公寓楼内，丹麦警方辨认出肇事者并与他发生枪战，将其击毙。\n\n整个袭击造成3人死亡，5名警察受伤。行凶者是巴勒斯坦裔男子奥马尔·阿卜杜勒·哈米德·侯赛因，他一生都在触犯法律，据称他在袭击发生前就宣布效忠极端主义组织“伊斯兰国”。"
 denmark.35.a: "这样的事情怎么会发生在丹麦？"
 denmark.36.t: "夺走寻求庇护者的贵重物品"
 denmark.36.d: "由于寻求庇护者数量的增加，紧张局势正在加剧。整个考验使我们的政府陷入两难境地：我们是否应该扣留这些寻求庇护者中的一些贵重物品，作为他们逗留费用的一种方式？"
 denmark.36.a: "高举双手，把你所有的钱都拿出来！"
 denmark.36.b: "疯了吧！"
 denmark.37.t: "禁止仇恨言论"
 denmark.37.d: "丹麦决定禁止一名基督徒和多名穆斯林外国传教士，因为政府认为他们正在“宣扬仇恨言论”。"
 denmark.37.a: "这不“舒适”！"
 denmark.38.t: "古代亵渎法"
 denmark.38.d: "丹麦议会决定废除一项古老的亵渎法，该法禁止公开侮辱一个人的宗教信仰或崇拜。"
 denmark.38.a: "言论自由占上风！"
 denmark.4.t: "战斗机库存"
 denmark.4.d: "我们的战斗机库存相当少。我们没有军事工业来支持适当数目的先进战斗机。联系我们的阵营领导人，并尝试协商额外的战斗机批量采购，这可能符合我们的最佳利益。"
 denmark.4.o1: "请求美国战斗机"
 denmark.4.o2: "请求俄罗斯战斗机"
 denmark.4.o3: "其实我们现在买不起"
 denmark.5.t: "[DEN.GetAdjective]自由主义者批评福利国家"
 denmark.5.d: "本周早些时候，[DEN.GetAdjective]社会震惊地听到自由党公开呼吁废除[DEN.GetAdjective]福利国家，支持“极简国家”。自由党似乎准备带头成为最大的右翼政党，如果不是整体的话，虽然在现实中这很可能只是意味着削减福利国家的资金，而不是彻底的解体，但它被看作是一个无政府主义者对北欧模式的宣战。"
 denmark.5.o1: "让不能站立的东西倒下"
 denmark.6.t: "[DEN.GetAdjective]人民党在民意调查中取得进展"
 denmark.6.d: "最近的政治发展看到人们更加关注保护[DEN.GetAdjective]文化不受外来影响。至于这构成了什么，许多丹麦人似乎认为，[DEN.GetAdjective]文化首先涉及对[DEN.GetName]历史的自豪感，并呼吁停止无情的进步主义、文化相对主义和全球主义，以支持更反动的回归“丹麦第一”。这一发展对[DEN.GetAdjective]人民党来说是个好消息，许多人认为他们是[DEN.GetName]传统主义和民族自豪感的保护者。"
 denmark.6.o1: "把丹麦还给我们"
 denmark.7.t: "预测[DEN.GetAdjective]保守派将取得重大胜利"
 denmark.7.d: "[DEN.GetAdjective]保守派在自90年代初以来一直处于衰落状态之后，似乎已经卷土重来。当被问及这一转折的原因时，一位政治评论家说，新千年的国际文化交流似乎让许多丹麦人漂泊不定，没有归属感，并使丹麦的价值观成为政治讨论的中心点。保守派领导层已经开始准备利用这种新发现的支持，他们在演讲中强调坚定不移地捍卫“使我们作为[DEN.GetAdjective]的一切”。"
 denmark.7.o1: "回到八十年代"
 denmark.8.t: "[DEN.GetName]王位继承人弗雷德里克王储的婚礼"
 denmark.8.d: "王储弗雷德里克正值适婚年龄。他的真爱是一位澳大利亚平民女子，然而我们可以利用这桩婚姻来扩大我们在其他北欧君主制家族中的影响力。"
 denmark.9.t: "在[DEN.GetName]宣布戒严令！"
 denmark.9.d: "在最近发生了一些要求彻底改变[DEN.GetAdjective]政治的大规模示威之后，现在情况已经发展到全国范围内的全面暴乱，迫使[DEN.GetLeader]宣布戒严，以扩大警察和军队的能力来维持秩序。\n\n大多数欧洲国家都难以置信地看着他们的北方小邻居被吞噬在全国范围内的暴乱中，并想知道谁会胜出。无论谁胜出，大规模的变化在此时是肯定的。"
 denmark.9.o1: "派出军队！"
 denmark.11.t: "极端[DEN.GetAdjective]民族主义者寻求影响"
 denmark.11.d: "似乎极右翼的爱国团体已经能够把他们的意识形态分歧放在一边，形成了一个[DEN.GetAdjective]民族主义者的统一战线。这些通常互不相干的团体已经团结起来，共同相信[DEN.GetName]国家优于世界上所有其他国家，并坚信新的[DEN.GetName]应该纠正世界在[DEN.GetAdjective]历史上对这个国家造成的许多错误。\n\n这些团体的言论已经引起了[DEN.GetName]几个邻国的关注，从历史上看，[DEN.GetAdjective]有很多理由对他们心怀怨恨。"
 denmark.11.o1: "地球的这个角落比任何其他地方都对我微笑"
 denmark.13.t: "[DEN.GetAdjective]政府官员受到极端国际主义者的攻击！"
 denmark.13.d: "最近宣布的戒严令似乎只激发了寻求推翻[DEN.GetName]腐败政府的国际主义压力。据报道，在整个冲突过程中，革命的国际主义者势力和各种自封的反革命爱国者之间发生了多次冲突。今天，国际主义者是毫无争议的胜利者，现任[DEN.GetLeader]政府已经宣布，在胜利者提出要求之前，它只会作为临时过渡政府继续存在。"
 denmark.13.o1: "想象一下没有国家 - 如果你试一试，就会发现很容易。"
 denmark.17.t: "[DEN.GetName]革命！"
 denmark.17.d: "近期在[DEN.GetName]开展的大量革命行动已给该国带来了巨大变化，但由于革命委员会成员在革命手段上产生分歧，革命活动近期陷入停滞。如今，强硬派呼吁武装起义的立场已然占据上风，哥本哈根已传出银行家和政客遭到暴力袭击的消息。与此同时，革命委员会中的温和派成员却下落不明，据传他们要么已经死亡，要么已经躲藏起来。一位政治评论员愤慨地表示，这场革命注定是一场血腥的战争，最终是否值得，只有时间才能给出答案。"
 denmark.17.o1: "全世界的工人们，团结起来！"
 denmark_news.1.t: "玛格丽特二世的退位"
 denmark_news.1.d: "来自丹麦的消息称，[DEN.GetAdjective]女王迫于丹麦日益高涨的左翼极端主义压力，选择退位。丹麦共产党的支持者们欣喜若狂地走上街头，因为旧秩序的最后堡垒之一终于被摧毁了。这位前女王已前往英国温莎王室寻求庇护。\n"
 denmark_news.1.o1: "为我们的王冠担忧"
 denmark_news.1.o2: "谢天谢地！"
 denmark_news.1.o3: "有趣的进展"
 DEN_idea_joint_material_command: "联合物资指挥部"
 DEN_idea_joint_material_command_desc: "新成立的联合物资司令部简化了我国的流程，以便更有效地进行武器采购。"
 DEN_idea_streamline_infantry_production: "简化步兵装备生产"
 DEN_idea_streamline_infantry_production_desc: "精简步兵装备将使我们能够更好地为未来可能参与的冲突做好准备。"
 DEN_idea_streamline_naval_production: "简化海军生产"
 DEN_idea_streamline_naval_production_desc: "丹麦实施改革，精简海军生产，提高海军舰艇建造效率并降低成本，增强海上防御能力。"
 DEN_immigrants_must_work_idea: "改革移民工作"
 DEN_immigrants_must_work_idea_desc: "丹麦通过旨在提供培训和支持、增加就业机会的改革，促进移民融入劳动力队伍。"
 DEN_the_retirement_reform_idea: "退休改革"
 DEN_the_retirement_reform_idea_desc: "丹麦调整养老金资格和退休年龄标准，以应对人口挑战，确保退休福利的长期可持续性。"
 DEN_idea_greenlandic_conscripts: "格陵兰应征入伍者"
 DEN_idea_greenlandic_conscripts_desc: "格陵兰岛因其气候恶劣而闻名。"
 DEN_idea_margrethe: "玛格丽特二世女王"
 DEN_idea_margrethe_desc: "女王玛格丽特二世作为国家元首继续象征着丹麦的君主立宪制和文化遗产。\n§W--------------§!\n如果我们完成§Y$DEN_abolish_monarchy$§!国策，该国家精神将被§R移除§!。"
 DEN_idea_state_atheism: "国家无神论"
 DEN_idea_state_atheism_desc: "丹麦奉行国家无神论，将宗教与政府事务分开，并在公共机构中推行世俗主义。"
 DEN_idea_neutrality_drift: "丹麦孤立主义"
 DEN_idea_neutrality_drift_desc: "丹麦保持中立，不卷入国际冲突和联盟，优先考虑外交与和平解决。"
 DEN_for_faedre_landet: "为了这片土地上的父老乡亲！"
 DEN_for_faedre_landet_desc: "爱国热情席卷丹麦，公民在“为了祖国！”的旗帜下集会，在面对国内和国际挑战时促进国家统一和团结。"
 DEN_public_service_investment: "拯救银行"
 DEN_public_service_investment_desc: "丹麦采取果断行动稳定金融业，采取措施救助陷入困境的银行并维护经济稳定。"
 DEN_idea_monarchy_drift: "君主制的权力"
 DEN_idea_monarchy_drift_desc: "丹麦君主制行使宪法权力，在国家事务中发挥着关键作用，并成为丹麦身份和传统的统一象征。"
 DEN_idea_militarization: "军队支持君主制"
 DEN_idea_militarization_desc: "丹麦军队宣誓效忠君主制，强化其作为国家主权和稳定守护者的作用。"
 DEN_military_build_up: "丹麦战争机器"
 DEN_military_build_up_desc: "丹麦加强其军事能力，投资于现代化和扩张，建立强大的国防机构，确保国家的安全和防务准备。"
 DEN_communist_gains: "共产主义的收获"
 DEN_communist_gains_desc: "随着左翼运动获得动力和影响力，共产主义意识形态在丹麦受到关注，引发辩论并重塑政治话语。"
 DEN_idea_refugees_welcome: "难民的涌入"
 DEN_idea_refugees_welcome_desc: "丹麦经历了大量难民涌入，为融合和社会凝聚力带来了挑战和机遇。"
 DEN_idea_nordisk_film: "北欧电影公司"
 DEN_idea_nordisk_film_desc: "通过对丹麦电影和影院的额外支持，我们能够从丹麦民众那里获得额外的支持。"
 DEN_idea_equality: "人人平等"
 DEN_idea_equality_desc: "丹麦致力于实现真正的平等，实施政策和举措，促进所有公民的平等机会和权利，无论性别、种族或背景。"
 DEN_idea_schultz_larsen: "舒尔茨 & 拉森"
 DEN_idea_schultz_larsen_desc: "舒尔茨·拉森公司以其枪械和步枪而闻名，仍然是丹麦制造业的基石，在国内和国际上提供优质产品。"
 DEN_idea_DISA: "迪砂"
 DEN_idea_DISA_desc: "迪砂是丹麦领先的IT服务提供商，在实现国家数字基础设施现代化和确保网络安全措施稳健有效方面发挥着至关重要的作用。"
 DEN_idea_conservative: "保守社会"
 DEN_idea_conservative_desc: "丹麦保持其保守社会的地位，重视传统、家庭和稳定，同时谨慎地应对社会和文化变革。"
 DEN_idea_strict_immigration_law: "严格的移民法"
 DEN_idea_strict_immigration_law_desc: "执行严格的移民法将确保我们的国家坚定地保持丹麦的地位。"
 DEN_idea_strict_immigration_law2: "反穆斯林法"
 DEN_idea_strict_immigration_law2_desc: "除了严格的移民法之外，制定阻止穆斯林进入我国的标准法律将有助于我们前进。"
 DEN_communist_gains2: "传播共产主义"
 DEN_communist_gains2_desc: "随着左翼运动倡导社会和经济改革，共产主义意识形态在丹麦受到关注，引发了辩论并重塑了政治话语。"
 DEN_idea_unemployment_benefits: "失业救济"
 DEN_idea_unemployment_benefits_desc: "丹麦维持慷慨的失业救济金，为有需要的人提供财政支持，同时促进重返工作岗位和技能发展计划。"
 DEN_idea_intervention_forces: "丹麦干涉部队"
 DEN_idea_intervention_forces_desc: "丹麦加强干预力量，提高有效应对全球安全挑战和危机的军事能力和准备能力。"
 develop_infrastructure_greenland: "发展格陵兰岛基础设施"
 develop_infrastructure_greenland_desc: "格陵兰岛基本上没有任何基础设施，如果我们要适当地利用这块巨大的土地，我们首先需要驯服野生动物，并使交通便利。"
 develop_infrastructure_faeroerne: "发展法罗群岛基础设施"
 develop_infrastructure_faeroerne_desc: "由于人口较少，岛屿上的基础设施是人们所期望的，如果我们要开始大规模的采矿业，我们需要发展道路以满足我们的需要"
 develop_oil_greenland: "格陵兰岛及其周边地区的石油"
 develop_oil_greenland_desc: "全球变暖使得石油在格陵兰岛及其周边地区显露出来，现在是我们尝试利用这一资源造福自身的时候了。"
 develop_resources_faeroerne: "法罗群岛采矿业"
 develop_resources_faeroerne_desc: "法罗群岛从来没有引起过我们丹麦人的兴趣，但现在是时候让我们尝试挖掘一下那里的土地，看看那里是否隐藏着什么宝藏了。"
 develop_resources_greenland: "格陵兰采矿业"
 develop_resources_greenland_desc: "全球变暖使得格陵兰岛及其周边地区一些此前未知的资源得以显露，现在是时候开始挖掘，看看地下究竟蕴藏着什么了。"
 spread_communism_sweden: "瑞典共产主义"
 spread_communism_sweden_desc: "在丹麦的历史上，瑞典一直是我们最大的竞争对手。尽管2000年代两国合作良好，但我们需要瑞典掌权者的支持。"
 spread_communism_norway: "挪威共产主义"
 spread_communism_norway_desc: "挪威长期以来一直是丹麦王国的一部分，如果丹麦人民能够领导国家，他们当然也能掌权并领导挪威国家。"
 spread_communism_finland: "芬兰共产主义"
 spread_communism_finland_desc: "芬兰在历史上有一个以苏联为形式的大型共产主义敌人，在这里的传播将更加困难，但这并不妨碍我们让人民掌权。"
 spread_communism_iceland: "冰岛共产主义"
 spread_communism_iceland_desc: "冰岛直到二战期间才脱离丹麦。我们的观点在很多方面都很一致，他们很容易被我们说服。"
 DEN_the_governance_of_denmark: "丹麦的治理"
 DEN_the_governance_of_denmark_desc: "丹麦虽然很小，但却是一个存在相当多各种问题的国家。这个国家有殖民地、小规模的腐败、能源问题以及如何创建可持续的经济增长模式。现在是准备治理我们这个新兴国家并尽我们所能改善一切的时候了。"
 DEN_the_status_of_the_amts: "郡的现状"
 DEN_the_status_of_the_amts_desc: "我们的行政管理制度是我们的政府自古以来就一直坚持的一种古老的管理制度。重要的是要决定我们未来要做什么，以及我们是否要赋予我们的地区或城市权力。"
 DEN_empower_the_regions: "赋予地区当局权力"
 DEN_empower_the_regions_desc: "这些地区由许多小型地方政府组成，我们可以集中政府权力，希望能够更有效地处理各种问题。"
 DEN_empower_the_municipalities: "赋予市政当局权力"
 DEN_empower_the_municipalities_desc: "如果我们赋予当地地方权力，他们将能够更有效地处理当地出现的情况，从而实现个案处理的政府风格。"
 DEN_the_status_of_ertholmene: "市镇的现状"
 DEN_the_status_of_ertholmene_desc: "厄特霍尔莫讷群岛是博恩霍尔姆海岸附近的一个小群岛。目前它不属于任何地区或市的管辖范围，因此其居民不缴纳市政税，也不缴纳与丹麦政府系统相关的任何形式的税收。现在是我们决定如何处理这个小区域的时候了。"
 DEN_regional_taxation: "大区税收"
 DEN_regional_taxation_desc: "各地方政府应有权为本地区征税。"
 DEN_shift_the_education_responsibility: "转移教育责任"
 DEN_shift_the_education_responsibility_desc: "教育应该由地区政府而不是地方政府来监管和处理。"
 DEN_decentralized_education: "分散教育"
 DEN_decentralized_education_desc: "教育掌握在当地人手中。他们应该决定并处理一切应该如何处理。"
 DEN_regional_investments: "大区投资"
 DEN_restructure_the_healthcare_system: "重组医疗保健系统"
 DEN_bornholm_regional_redistricting: "博恩霍姆大区选区重划"
 DEN_the_health_contribution_tax: "健康贡献税"
 DEN_public_transportation_reforms: "公共交通改革"
 DEN_regional_welfare_systems: "地方福利制度"
 DEN_regional_welfare_systems_desc: "如果我们将我们的福利体系转向该地区，我们就可以消除政府下层的一些官僚主义冗政。"
 DEN_municipal_growth: "市政发展"
 DEN_local_autonomy: "地方自治"
 DEN_local_autonomy_desc: "每个区域都应该能够就其区域做出决定。他们是最有资格处理这件事的人！"
 DEN_status_of_the_colonies: "殖民地的现状"
 DEN_release_the_holdings: "释放领地"
 DEN_reign_in_the_colonies: "遏制殖民地"
 DEN_greenlandic_referendum: "格陵兰公投"
 DEN_the_faroes_referendum: "法罗群岛公投"
 DEN_autonomous_administration: "自治管理"
 DEN_stamp_out_separatism: "消灭分裂主义"
 DEN_special_municipal_districts: "特别市辖区"
 DEN_special_municipal_districts_desc: "建立特别行政区来管理殖民地可能非常有益。"
 DEN_direct_governance: "直接治理"
 DEN_direct_governance_desc: "现在是我们建立对殖民地的控制并直接领导的时候了。他们的政府应该解散，而丹麦政府现在却维持着它们。"
 DEN_colonial_investments: "殖民地投资"
 DEN_colonial_investments_desc: "丹麦的殖民地需要一些经济复苏。我们必须为这些省份带来一些经济发展，以适当地养活他们的人民。"
 DEN_exploit_greenlandic_oil_reserves: "开发格陵兰石油"
 DEN_exploit_greenlandic_oil_reserves_desc: "格陵兰岛有很多石油，但我们现在不开采。"
 DEN_faroese_naval_infrastructure: "改善法罗群岛的基础设施"
 DEN_faroese_naval_infrastructure_desc: "苏格兰北部的法罗群岛是北欧贸易的重要地区；投资其基础设施意味着提高我们的贸易能力。"
 DEN_faroese_oil_expansion: "法罗群岛北海石油勘探"
 DEN_faroese_oil_expansion_desc: "北海石油勘探的时机已经成熟。我们的责任是从法罗群岛出发，看看海浪下面埋藏着多少石油。"
 DEN_centralized_government_empowerment: "赋权中央政府"
 DEN_centralized_government_empowerment_desc: "政府迫切需要赋权。如果我们努力赋予中央政府权力，它将能够采取有针对性的行动，缓解各市和大区的问题。"
 DEN_the_industrial_base_of_denmark: "丹麦的工业基地"
 DEN_banking_reforms: "银行改革"
 DEN_energy_initiatives: "能源倡议"
 DEN_energy_initiatives_desc: "当我们推动可再生能源发展时，能源问题是我们面临的最大问题之一。"
 DEN_solar_initiatives: "太阳能倡议"
 DEN_biomass_production: "生物质生产"
 DEN_anticorruption_offices: "反腐败办公室"
 DEN_anticorruption_offices_desc: "设立反腐败机构和办公室将使我们能够更有效地打击丹麦境内的腐败行为。虽然我们这个伟大的国家资源有限，但尽可能地精简机构和部门至关重要。"
 DEN_fiere_at_work: "更多工作"
 DEN_fiere_at_work_desc: "'更多工作'这是23年达成的一项多党政治协议，旨在调整国家就业政策，更加注重积极寻找工作，而不是失业救济。"
 DEN_the_ironworking_industries: "炼铁工业"
 DEN_danish_pharmaceuticals: "丹麦制药公司"
 DEN_intermeditary_manufacturing: "中间制造商"
 DEN_agroindustrial_investments: "农业产业投资"
 DEN_develop_kobenhavn: "发展哥本哈根"
 DEN_develop_kobenhavn_desc: "哥本哈根是丹麦的首都，也是丹麦唯一一个人口超过百万的城市；发展我们的首都将是我们发展项目的良好开端。"
 DEN_develop_aarhus: "发展奥胡斯"
 DEN_develop_aarhus_desc: "奥胡斯作为丹麦第二大城市，我们可以增加和改善它的港口，为此我们首先需要发展城市。"
 DEN_develop_roskilde: "发展罗斯基勒"
 DEN_develop_roskilde_desc: "罗斯基勒是我们首都附近的一个城市，我们可以开发它以进一步增加我们首都的繁荣。"
 denmark.43.t: "古德伦气旋"
 denmark.43.d: "古德伦飓风席卷了我国、英国和瑞典，造成22人死亡，其中4人来自丹麦。这场风暴也给瑞典造成了巨大的经济损失，该国的林业因树木受损而遭受重创。"
 denmark.43.a: "奉上我们的哀悼.."
 denmark.44.t: "格陵兰公投"
 denmark.44.d: "格陵兰自1979年以来一直是丹麦的自治领土，现已决定举行自治公投，结果多数人投票支持自治。"
 denmark.44.a: "太棒了"
 denmark.45.t: "法罗公投"
 denmark.45.d: "法罗群岛人民正在举行全民投票，并寻求从我国独立。他们有权成为我们内部的自主主体，我们不会阻止他们。允许他们自治。"
 denmark.45.a: "有趣"
 denmark.100.t: "市镇的现状"
 denmark.100.d: "厄特霍尔莫讷群岛是博恩霍姆海岸附近的一个小群岛。目前它不属于任何地区或市的管辖范围，因此其居民不缴纳市政税，也不缴纳与丹麦政府系统相关的任何形式的税收。我们应该对他们做什么？我们应该把他们带入博恩霍姆地区吗？"
 denmark.100.a: "继续自治"
 denmark.100.b: "遏制厄特霍尔莫讷群岛"
 DEN_intensify_the_flexicurity_idea: "加强灵活性保障"
 DEN_intensify_the_flexicurity_idea_desc: "丹麦强化其弹性保障模式，将劳动力市场灵活性与社会保障措施相结合，以促进就业稳定性和经济弹性。"
 DEN_a_green_leap_forward: "绿色飞跃"
 DEN_a_green_leap_forward_desc: "丹麦通过雄心勃勃的环境政策和投资、应对气候变化和推广可再生能源，加速向可持续经济转型。"
 DEN_idea_clean_energy_initiatives: "清洁能源倡议"
 DEN_idea_clean_energy_initiatives_desc: "丹麦推出了雄心勃勃的清洁能源计划，投资风能和太阳能等可再生资源，以减少碳排放并应对气候变化。"
 DEN_local_construction_renewable_initiatives_modifier: "可再生能源建设举措"
 DEN_local_construction_renewable_initiatives_modifier_desc: "§Y城市发展基金Y§!§g已拨出部分资金用于该省份的区域可再生能源投资。§!"
 DEN_local_construction_initiatives_modifier: "地方建设举措"
 DEN_local_construction_initiatives_modifier_desc: "§Y城市发展基金§!§g已分配一些资金用于该省份的区域投资。§!"
 DEN_last_bastions_of_corruption: "腐败的最后堡垒"
 DEN_last_bastions_of_corruption_desc: "丹麦境内有一些地方仍然存在腐败现象。必须铲除腐败的最后堡垒，我们的人民才能前进。\n§W--------------§!\n如果我们完成§Y$DEN_centralized_government_empowerment$§!国策，该国家精神将得到§G改善§!，同时如果我们完成§Y$DEN_anticorruption_offices$§!国策，该国家精神将被§R移除§!。"
 DEN_greenlandic_separatism_modifier: "格陵兰分离主义"
 DEN_greenlandic_separatism_modifier_desc: "随着有关该领土自治和主权的讨论日益突出，围绕格陵兰分离主义的争论愈演愈烈。"
 DEN_faroese_separatism_modifier: "法罗分离主义"
 DEN_faroese_separatism_modifier_desc: "法罗群岛也出现了类似的关于自治和分离主义的讨论，反映了关于自决和独立的持续辩论。"
 DEN_energy_exports_idea: "能源出口"
 DEN_energy_exports_idea_desc: "丹麦利用其能源资源，包括石油、天然气和可再生能源，成为能源净出口国，为经济繁荣和能源安全做出贡献。"
 DEN_in_need_of_banking_reforms_idea: "迫切需要银行业改革"
 DEN_in_need_of_banking_reforms_idea_desc: "丹麦面临着银行业改革的呼声，以解决金融部门内的透明度、问责制和稳定性问题。\n§W--------------§!\n如果我们完成§Y$DEN_banking_reforms$§!国策，该国家精神将被§R移除§!。"
 DEN_danish_pharmaceuticals_idea: "丹麦制药公司"
 DEN_danish_pharmaceuticals_idea_desc: "丹麦的制药业蓬勃发展，生产高质量的药品和保健产品，为全球健康和福祉做出贡献。"
 DEN_colonial_holding_modifier: "皇冠投资"
 DEN_special_municipal_districts_idea: "特别市辖区"
 DEN_special_municipal_districts_idea_desc: "设立特别市政区是为了满足当地独特的需求和优先事项，从而在社区层面提供量身定制的治理和服务。"
 DEN_direct_governance_idea: "直接治理"
 DEN_direct_governance_idea_desc: "丹麦探索直接治理模式，使公民能够更积极地参与决策过程和地方治理。"
 DEN_autonomous_administration_idea: "自治管理"
 DEN_autonomous_administration_idea_desc: "部分地区实行自治管理模式，赋予地方更大自治权和决策权。"
 DEN_regional_investments_idea_loc: "大区投资"
 DEN_regional_investments_idea_loc_desc: "丹麦投资区域发展项目和基础设施，促进该国不同地区的经济增长和繁荣。"
 DEN_social_spending_reforms_centralization_idea: "大区社会支出改革"
 DEN_social_spending_reforms_centralization_idea_desc: "区域社会支出改革旨在解决服务欠缺地区的差距并改善社会福利成果。"
 DEN_social_spending_reforms_decentralization_idea: "市政社会支出改革"
 DEN_social_spending_reforms_decentralization_idea_desc: "各市政府实施社会支出改革，加强对弱势群体的社会服务和支持体系。"
 DEN_local_municipalities_idea: "市镇投资"
 DEN_local_municipalities_idea_desc: "各市政府优先投资基础设施、教育和医疗保健，以提高生活质量并促进社区发展。"
 DEN_colonial_separatism_category: "丹麦皇冠领地"
 DEN_colonial_separatism_category_desc: "丹麦的殖民地"
 DEN_urban_development_fund_category: "城市发展基金"
 DEN_urban_development_fund_category_desc: "城市发展基金是丹麦政府的一项有针对性的举措，旨在改善丹麦的城市并均匀分配首都哥本哈根的人口和经济机会。我们可以利用该基金投资的资金来发展某些地区，为这些地区提供有针对性的发展、社会和其他举措，将更多的人从国外和首都带到经济停滞的地区。\n\n§Y城市发展基金池：§! $$[?DEN_urban_development_fund_value|+]B"
 DEN_expand_resources_of_the_fund: "扩大基金资源"
 DEN_expand_resources_of_the_fund_desc: "我们可以将纳税人的额外资源投入到该基金中，以倡导更多的发展机会。"
 DEN_population_initiatives_decision: "人口增长举措"
 DEN_population_initiatives_decision_desc: "鼓励来自世界各国和我国首都的移民，应该有助于促进我国人口和各地区的增长。"
 DEN_local_construction_initiatives_decision: "在§Y[FROM.GetName]§!的地方建设举措"
 DEN_local_construction_initiatives_decision_desc: "[FROM.GetName]迫切需要当地在建设和其他方面的投资。是时候投入一些资金了！"
 DEN_local_renewable_investment_decision: "在§Y[FROM.GetName]§!的可再生能源建设举措"
 DEN_local_renewable_investment_decision_desc: "[FROM.GetName]已表示有兴趣安置一些当地的可再生能源。该地区人民不同意政府将其安置在那里的决定。该基金可以拨出资金到该地区进行建设，但这会不受中央政府的欢迎。"
 DEN_generic_danish_political_decisions_category: "丹麦的治理"
 DEN_generic_danish_political_decisions_category_desc: "丹麦的政策多种多样，因此有些政策可以随意更改。"
 DEN_rollback_flexicurity_model_improvements_decision: "回滚弹性保障模型扩展"
 DEN_rollback_flexicurity_model_improvements_decision_desc: "我们的未来不需要灵活保障模型。现在是我们将其回滚并删除它的时候了。"
 DEN_colonial_investment_modifier: "殖民地投资"
 DEN_colonial_investment_modifier_desc: "投资我们的殖民地不仅对我们有利，而且对当地经济也有利。我们必须对我们的殖民地保持可持续的投资。"
 DEN_urban_improvement_funds_pool_tt: "§Y城市发展基金§!发生$$[?temp_change|+]B变动(当前值：[?DEN_urban_development_fund_value|+3])"
 DEN_intensify_the_flexicurity_idea_trigger_tt: "当§Y$DEN_intensify_the_flexicurity_idea$§!就位时，§Y[DEN.GetNameWithFlag]§!无法使§Y$social_budget$§!低于§Y$social_01$§!。\n"
 DEN_invested_in_our_resources: "投资我们的资源"
 DEN_invested_in_our_infrastructure: "投资我们的基础设施"
 DEN_regional_investments_desc: "区域层面的投资应该让我们的公民受益。"
 DEN_restructure_the_healthcare_system_desc: "目前，我们的医疗保健系统主要集中在当地。现在是我们对其进行重组，使其更具区域性而非地方性的时候了。"
 DEN_bornholm_regional_redistricting_desc: "是时候决定我们要对博恩霍尔姆岛做什么了。我们是否将其整合到另一个区域或赋予它自己的区域？"
 DEN_the_health_contribution_tax_desc: "健康贡献税是在地方征收的一种税，旨在帮助投资当地医疗保健系统。"
 DEN_public_transportation_reforms_desc: "我们迫切需要更多的地方交通。是时候扩建我们的道路并减轻我们市政当局的负担了。"
 DEN_municipal_growth_desc: "是时候刺激市辖区的发展了！"
 DEN_status_of_the_colonies_desc: "必须以某种方式处理殖民地。"
 DEN_release_the_holdings_desc: "是时候释放我们所持有的资产了。重要的是允许这种转变并最终允许他们开始向自治过渡。"
 DEN_reign_in_the_colonies_desc: "我们国家境内的那些傲慢的殖民地必须加以约束。格陵兰人和法罗群岛人民必须明白，他们是丹麦人。"
 DEN_greenlandic_referendum_desc: "格陵兰岛几个世纪以来一直掌握在我们手中。他们慢慢地想要远离我们，转向自治。"
 DEN_the_faroes_referendum_desc: "法罗群岛正在寻求自由。"
 DEN_autonomous_administration_desc: "如果我们让他们自我管理，就会减轻治理的负担。"
 DEN_stamp_out_separatism_desc: "他们是丹麦人，并且他们会喜欢做丹麦人！"
 DEN_the_industrial_base_of_denmark_desc: "现在是投资我们的工业基地的时候了。我们必须这样做；否则我们就会停滞不前。"
 DEN_banking_reforms_desc: "尽管我们的银行体系相当强大，但仍存在一些差距，例如缺乏民事保护。现在是改革这些法律并确保我们的人民永远放在第一位的时候了。"
 DEN_solar_initiatives_desc: "我们有很多地方可以利用太阳能。让我们投资太阳能，让我们的国家走上正轨！"
 DEN_the_ironworking_industries_desc: "钢铁是一个国家发展的重要组成部分。它被用于摩天大楼、汽车、工业产品等各个领域。现在是我们投资钢铁工业并将钢铁带回丹麦的时候了。"
 DEN_danish_pharmaceuticals_desc: "投资我们的制药公司将继续看到我们的经济增长扩大和爆炸。"
 DEN_intermeditary_manufacturing_desc: "我国的中间产业可以进行一些扩张。"
 DEN_agroindustrial_investments_desc: "投资我国境内的农业、工业综合体将使我们的经济继续繁荣。"
 DEN_urban_development_funds_greater_than_TT: "当前发展基金> $$5B (当前：[?DEN_urban_development_fund_value|+]B)"
 DEN_army_dynamic_modifier: "丹麦国防军"
 DEN_danish_militarism: "丹麦军国主义"
 DEN_danish_militarism_desc: "随着地缘政治的变化和民族认同的复兴，丹麦发现自己的军事野心越来越自信。在丹麦军国主义的旗帜下，该国准备加强其武装部队，投资于现代化和扩张计划。"
 DEN_the_socialist_agenda_desc: "社会主义议程强调了丹麦对社会福利、平等和团结的承诺。该议程以社会民主主义原则为基础，优先考虑旨在减少不平等、确保全民享有医疗保健和教育以及为所有公民营造公平包容社会的政策。"
 DEN_reassure_worker_rights: "确保工人权利"
 DEN_reassure_worker_rights_desc: "通过赋予工人权力并促进工会之间的团结，丹麦旨在促进财富和权力的更公平分配，最终建立一个每个人都受到重视、尊重并有机会成长的社会。"
 DEN_mandatory_worker_councils: "强制性工人委员会"
 DEN_mandatory_worker_councils_desc: "丹麦设立了强制性工人委员会，确保员工在工作场所的决策过程中拥有直接发言权。"
 DEN_party_first: "社会主义人民党优先"
 DEN_party_first_desc: "政府寻求扩大政党的集体谈判能力，确保他们在制定劳工政策和倡导工人权利（而不是工会）方面拥有统一的声音。"
 DEN_integrate_the_unions: "整合工会"
 DEN_integrate_the_unions_desc: "通过在政党和工会之间建立更紧密的联系，政府旨在扩大工人在政治舞台上的集体声音，推进优先考虑劳工权利和社会正义的政策。"
 DEN_union_first: "工会优先"
 DEN_union_first_desc: "政府力求增强工会的集体谈判能力，确保工会在制定劳工政策和维护工人权益方面拥有统一的声音，而不是由社会党来发声。"
 DEN_national_congress: "国民大会"
 DEN_national_congress_desc: "丹麦召开全国劳工代表大会，汇集了来自各个工会和组织的代表。"
 DEN_organizing: "组织"
 DEN_organizing_desc: "通过提供资源、培训和法律保护，政府旨在促进草根激进主义的复苏，扩大工人的声音并推动积极的变革。"
 DEN_provide_political_capital: "提供政治资本"
 DEN_provide_political_capital_desc: "丹麦承诺为工会提供政治资本，赋予其在政治领域更大的影响力和参与权。"
 DEN_council_run_corporations: "理事会运行的公司"
 DEN_council_run_corporations_desc: "丹麦采用理事会运行的公司模式，工人在公司实体的管理和决策过程中发挥直接作用。"
 DEN_world_forum: "世界论坛"
 DEN_world_forum_desc: "丹麦主张建立世界劳工论坛，全球各地工会和工人组织的代表可以齐聚一堂，应对共同挑战、分享最佳实践并协调国际团结努力。"
 DEN_join_the_ITUC: "加入国际工会联合会"
 DEN_join_the_ITUC_desc: "丹麦寻求通过加入国际工会联合会来加强其在国际舞台上的参与。通过成为这个全球工会联合会的成员，丹麦旨在扩大其在倡导工人权利、促进社会正义和促进跨国工人之间的国际团结方面的声音。"
 DEN_international_stage: "国际舞台"
 DEN_international_stage_desc: "由于丹麦是工人天堂，我们需要宣称自己是世界工人天堂的国际角色。"
 DEN_organized_unorganized: "有组织的无组织"
 DEN_organized_unorganized_desc: "通过向非正规经济中的工人提供资源、支持和法律保护，政府旨在改善他们的工作条件，增强他们的议价能力，并促进社会包容。"
 DEN_strike_policy: "罢工政策"
 DEN_strike_policy_desc: "丹麦实施进步的罢工政策，承认工人有权采取集体行动来维护自己的权利和利益。"
 DEN_the_art_of_a_riot: "暴乱的艺术"
 DEN_the_art_of_a_riot_desc: "通过保护抗议者权利、确保警察问责和促进非暴力抵抗的政策，政府寻求为异议和公民不服从创造空间，作为政治表达的合法形式。"
 DEN_normalise_the_strike: "罢工正常化"
 DEN_normalise_the_strike_desc: "丹麦将寻求罢工正常化，使其成为工人维护自身权利和谈判公平劳动条件的合法有效工具。"
 DEN_structurised_support: "结构化支持"
 DEN_structurised_support_desc: "丹麦实施结构化支持计划，为包括低收入家庭、残疾人和边缘化社区的弱势群体提供全面的资源和帮助。"
 DEN_the_true_wellfare_state: "真正的福利国家"
 DEN_the_true_wellfare_state_desc: "通过投资于教育、医疗保健、住房和社会服务，政府旨在创造一个人人都有机会过上充实而有尊严的生活的社会。"
 DEN_export_the_protest: "输出抗议之声"
 DEN_export_the_protest_desc: "通过知识分享、声援和资源馈赠，丹麦旨在扩大边缘化社区的声音，在国际范围内推动进步事业。"
 DEN_true_equality: "真正平等"
 DEN_true_equality_desc: "丹麦致力于消除制度弊病，解决基于种族、性和性别认同以及其他身份的交叉歧视，从而实现真正的平等。"
 DEN_solidifying_our_rule: "巩固丹麦共产党统治"
 DEN_solidifying_our_rule_desc: "通过努力集中控制、压制异议和加强党纪，我们的政府寻求保持稳定并维护其在政治、经济和社会领域的主导地位。"
 DEN_end_the_protest: "终结异议"
 DEN_end_the_protest_desc: "通过宣传、审查和镇压，我们的政府压制抗议、罢工和其他形式的异议，巩固其对公共言论和政治反对派的控制。"
 DEN_friends_in_the_east: "东方的盟友"
 DEN_friends_in_the_east_desc: "丹麦寻求加强与东欧集团社会主义政权的联系。通过促进联盟、资源共享和促进意识形态团结，旨在加强其地缘政治地位，应对西方资本主义列强的威胁。"
 DEN_southamerican_friends: "南美的朋友"
 DEN_southamerican_friends_desc: "丹麦扩大与南美左翼政府的外交接触，寻求在该地区建立联盟和伙伴关系。"
 DEN_innovation_and_technology: "创新与技术"
 DEN_innovation_and_technology_desc: "通过投资研发、支持科技初创企业和激励创新，政府可以预期在快速发展的全球市场中提高生产力、竞争力和经济增长能力。"
 DEN_zero_co2_economy: "零碳经济"
 DEN_zero_co2_economy_desc: "通过对清洁能源、碳捕获技术和能效措施的投资，政府将目标放在引领应对气候变化和建设可持续未来方面上。"
 DEN_no_industrial_nonsense: "为工业亮绿灯"
 DEN_no_industrial_nonsense_desc: "通过精简法规、减少繁文缛节、最大限度地减少政府干预，丹麦政府力求激励创新、刺激经济增长，并提高丹麦产业在全球舞台上的竞争力。"
 DEN_heavy_industry_focus: "专注重工业"
 DEN_heavy_industry_focus_desc: "丹麦将重视发展重工业部门，以推动经济增长并创造就业机会。"
 DEN_hightech_from_DEN: "丹麦高科技"
 DEN_hightech_from_DEN_desc: "支持高科技产业如生物技术、信息技术和先进制造业，政府旨在提高丹麦作为尖端创新和创业中心的地位。"
 DEN_new_political_culture: "新政治文化"
 DEN_new_political_culture_desc: "基于“另类选择”的价值观和愿景，丹麦致力于培育一种以透明度、基层参与和整体决策为特征的新政治文化。通过挑战传统权力结构和促进自下而上的举措，丹麦旨在培育一个更具包容性、协作性和前瞻性的政治格局，赋予公民权力并促进集体行动以实现积极变革。"
 DEN_serious_fight_climate_change: "严肃应对气候变化"
 DEN_serious_fight_climate_change_desc: "通过实施大胆的政策、投资可再生能源和推广碳中和做法，政府可以以身作则，减少温室气体排放，减轻全球变暖的影响。"
 DEN_entrepreneurship: "创业"
 DEN_entrepreneurship_desc: "丹麦通过有针对性的倡议和激励措施支持创业和小企业发展。通过提供资金、指导和支持服务，培育一个充满活力的创业生态系统，推动创新和经济增长。"
 DEN_expand_the_workforce: "扩大工人阶层"
 DEN_expand_the_workforce_desc: "通过投资教育、职业培训和创造就业机会，政府寻求解决劳动力短缺问题，推动经济增长，确保国家的长期繁荣。"
 DEN_refugee_welfare: "难民福利"
 DEN_refugee_welfare_desc: "丹麦通过为寻求庇护者和难民提供基本服务、支持网络和融合计划来确保难民福利，从而体现了其对人道主义价值观的承诺。"
 DEN_direct_democracy: "直接民主"
 DEN_direct_democracy_desc: "丹麦执行直接民主政策，赋予公民直接参与决策进程的权力，推广公民大会、全民投票和在线咨询等举措。"
 DEN_future_of_welfare: "未来福利"
 DEN_future_of_welfare_desc: "丹麦提出未来福利愿景，探索创新方法，确保社会安全网在面对不断变化的经济和人口挑战时保持稳健和可持续发展。"
 DEN_minimal_welfare: "最低福利"
 DEN_minimal_welfare_desc: "丹麦采取最低福利政策，旨在精简社会援助计划，减少对国家支持的依赖。"
 DEN_reduce_taxation: "减税"
 DEN_reduce_taxation_desc: "保证减税，将其作为刺激经济增长、鼓励投资和提高生产力的一种手段。"
 DEN_basic_welfare: "基础福利"
 DEN_basic_welfare_desc: "确保所有公民都能享受基本福利，保证医疗、教育和住房等基本服务等公民基本权利。"
 DEN_reform_taxation: "改革税制"
 DEN_reform_taxation_desc: "开展全面的税收改革工作，以在二十一世纪实现税收制度的优化和现代化。通过简化税法、堵塞漏洞、确保公平性和累进性，政府旨在增加税收，同时最大限度地减少经济中的扭曲和低效现象。"
 DEN_keep_welfare: "长期福利"
 DEN_keep_welfare_desc: "重申将 \"保持福利 \"作为社会契约基石的承诺，确保所有公民终生都能获得基本服务和支持。"
 DEN_increase_taxes: "加税"
 DEN_increase_taxes_desc: "需要认识到，增加收入才能维持和扩大福利计划，因此必须实施增加税收的措施。通过对财富和收入征收累进税，丹麦政府将确保福利国家的财政负担得到公平分配，并有足够的资源满足所有公民的需求。"
 DEN_fight_radicals: "打击激进分子"
 DEN_fight_radicals_desc: "丹麦采取行动打击那些试图通过极端主义意识形态和暴力破坏福利国家和民主制度的激进分子。通过促进宽容、多元化和社会凝聚力，政府旨在打击激进化并保护民主、人权和平等的价值观。"
 DEN_economic_liberalism: "经济自由主义"
 DEN_economic_liberalism_desc: "丹麦信奉经济自由主义，强调自由市场、竞争和个人自由是繁荣和福利的驱动力。通过减少政府干预、促进创业和营造有利于营商的环境，政府旨在充分释放经济潜力，为所有公民创造蓬勃发展的机会。"
 DEN_no_welfare_without_grow: "没有成长就没有福利"
 DEN_no_welfare_without_grow_desc: "丹麦主张，没有增长就没有福利，强调经济繁荣作为社会福祉基础的重要性。通过推行刺激投资、创新和生产力的政策，政府旨在实现可持续增长并确保福利计划的财务可行性。"
 DEN_sharpen_profil: "锐化形象"
 DEN_sharpen_profil_desc: "丹麦旨在提升其作为福利创新和社会政策全球领导者的形象。通过展示最佳实践、分享知识和促进国际合作，政府旨在加强丹麦作为有效和公平福利提供典范的声誉，激发世界各地的积极变革。"
 DEN_explore_digital_possibilitys: "探索数字化的可能性"
 DEN_explore_digital_possibilitys_desc: "丹麦踏上了探索数字可能性的旅程，寻求创新方法来利用技术造福公民和企业。通过促进合作、实验和知识共享，政府旨在充分发挥数字解决方案的潜力，以应对社会挑战和改善公共服务。"
 DEN_life_long_learning: "终身学习"
 DEN_life_long_learning_desc: "丹麦投资终身学习计划，为公民提供在快速发展的数字经济中蓬勃发展所需的数字技能和能力。通过扩大数字素养计划、职业培训和终身教育机会，政府旨在增强个人适应技术变革的能力，并抓住个人和职业发展的新机遇。"
 DEN_digital_gouverment_act: "数字政府法案"
 DEN_digital_gouverment_act_desc: "丹麦颁布数字政府法案，旨在通过数字化转型实现政府服务的现代化和精简。通过制定标准、建立框架和促进互操作性，政府致力于提升公共服务水平、增强公民参与度，并确保数字数据的安全性和隐私性。"
 DEN_mobile_broadband: "移动宽带"
 DEN_mobile_broadband_desc: "丹麦投资移动宽带基础设施，以扩大全国范围内的高速互联网连接。通过部署5G网络、提高农村地区的覆盖率以及促进服务提供商之间的竞争，政府旨在弥合数字鸿沟，使所有公民能够无缝获取在线服务和信息。"
 DEN_more_exports: "增加出口能力"
 DEN_more_exports_desc: "哥本哈根 - 马尔默港的成功让我们充满信心，进一步扩大进口能力将是有益的一步。"
 DEN_copenhagen_opera_house: "哥本哈根歌剧院"
 DEN_copenhagen_opera_house_desc: "丹麦通过建造哥本哈根歌剧院来庆祝其文化遗产和卓越的艺术，哥本哈根歌剧院是世界一流的歌剧、芭蕾舞和古典音乐表演场所。通过提供最先进的设施、促进艺术创新、促进文化交流，政府旨在丰富哥本哈根的文化景观并吸引来自世界各地的观众。"
 DEN_fehmarn_belt_fixed_link: "马恩海峡固定连接线"
 DEN_fehmarn_belt_fixed_link_desc: "丹麦开始建设费马恩海峡固定连接线，这是一项重大基础设施项目，将在丹麦和德国之间建立固定的铁路和公路连接。通过在费马恩海峡下修建隧道，政府旨在改善交通联系，促进贸易和旅游业，加强波罗的海地区的经济一体化，促进邻国之间的繁荣与合作。"
 DEN_the_politics_of_denmark_desc: "丹麦政治体现了该国的民主原则，提倡开放对话、政治多元化和公民参与。丹麦政治植根于建立共识和社会责任的传统，体现了对代议制治理和维护个人自由与权利的承诺。"
 DEN_the_queens_truth: "女王的真相"
 DEN_the_queens_truth_desc: "女王玛格丽特二世发起了一场诚实和透明的运动，寻求与丹麦人民建立信任并为君主制的野心赢得支持。"
 DEN_increase_royal_influence: "增加皇室影响力"
 DEN_increase_royal_influence_desc: "王室开始齐心协力扩大其在丹麦社会的影响范围，利用其历史威望和文化意义来影响公众舆论。"
 DEN_office_of_international_relations: "国际关系办公室"
 DEN_office_of_international_relations_desc: "认识到全球联盟的重要性，英国王室设立了国际关系办公室，以建立外交关系并获得同情君主制事业的外国势力的支持。"
 DEN_establish_the_royal_nordic_institute: "建立皇家北欧研究所"
 DEN_establish_the_royal_nordic_institute_desc: "为了促进北欧团结与合作，王室成立了皇家北欧研究所，这是一个致力于促进北欧国家之间文化交流与合作的著名机构。"
 DEN_royal_branding: "皇家品牌"
 DEN_royal_branding_desc: "王室发起了全面的品牌宣传活动，以提升其公众形象，将自己展示为一个符合丹麦人民愿望的现代化、进步的机构。"
 DEN_spread_the_word: "传颂圣言"
 DEN_spread_the_word_desc: "通过战略信息和媒体宣传，王室传播其振兴君主制的愿景，团结支持者，并播下对议会民主有效性的怀疑种子。"
 DEN_the_wedding_of_crone_prince_frederik: "弗雷德里克王储皇家婚礼"
 DEN_the_wedding_of_crone_prince_frederik_desc: "王室精心策划了弗雷德里克王储的婚礼，展现了盛大的王室辉煌，俘获了丹麦人民的心，并加强了君主制在当代社会的影响力。"
 DEN_question_democratic_values: "质疑民主价值观"
 DEN_question_democratic_values_desc: "王室质疑民主治理的有效性，强调其明显的缺陷，并主张在君主制的支持下建立更加稳定和权威的统治体系。"
 DEN_democracys_weakness: "弱化民主"
 DEN_democracys_weakness_desc: "通过学术研究和公共讨论，王室揭露了民主制度的脆弱性，将其描绘成容易陷入僵局、效率低下和不稳定的国家。"
 DEN_start_the_transission: "开始过渡期"
 DEN_start_the_transission_desc: "随着准备工作的进行，王室为权力从议会政府逐步过渡到君主制奠定了基础，将自己定位为民主秩序的自然继承者。"
 DEN_prepare_for_violence: "为暴力做好准备"
 DEN_prepare_for_violence_desc: "由于预料到来自根深蒂固的政治势力的抵抗，王室谨慎地为潜在的骚乱和动乱做好准备，确保君主制及其支持者的安全。"
 DEN_contact_the_army: "联系军方"
 DEN_contact_the_army_desc: "王室闭门与主要军事领导人接触，寻求他们在与议会政府发生对抗时的忠诚和支持的保证。"
 DEN_a_peaceful_change: "和平的转变"
 DEN_a_peaceful_change_desc: "尽管存在冲突的阴影，王室仍然致力于权力的和平过渡，强调对话和谈判作为实现其目标的首选手段。"
 DEN_force_parliament_into_submission: "迫使议会屈服"
 DEN_force_parliament_into_submission_desc: "随着压力的增加和公众情绪的转变，王室采取了更加自信的立场，要求议会政府做出让步，并迫使其承认君主制的权威。"
 DEN_overthrow_with_force: "以武力推翻"
 DEN_overthrow_with_force_desc: "随着紧张局势达到沸点，王室授权使用武力推翻议会政府并维护其至高无上的地位，使丹麦陷入危机和不确定的状态。"
 DEN_the_king_of_denmark: "丹麦之王"
 DEN_the_king_of_denmark_desc: "剧变结束后，王储弗雷德里克十世追随前任国王的脚步，登上王位，成为新的丹麦国王。随着君主制牢固确立为统治权威，弗雷德里克十世国王承诺以智慧、同情心和对丹麦人民福祉的坚定承诺来领导国家。"
 DEN_secure_the_dynasty: "确保王朝安全"
 DEN_secure_the_dynasty_desc: "随着君主制的恢复，弗雷德里克十世国王优先考虑通过确保王室血统的稳定、继承和连续性来确保王朝的未来。"
 DEN_house_hohenzollern: "霍亨索伦王室"
 DEN_house_hohenzollern_desc: "弗雷德里克十世国王拥抱德国丰富的王室遗产，与霍亨索伦家族建立外交联盟，促进欧洲君主国之间的相互合作与团结。"
 DEN_belgium_houses: "萨克森-科堡-比利时王室"
 DEN_belgium_houses_desc: "为了表达对比利时的声援，弗雷德里克十世国王重申了丹麦与萨克森-科堡-比利时王室之间的历史联系，促进了两个王室之间的友谊与合作。"
 DEN_houses_of_the_netherlands: "奥兰治-拿骚王室"
 DEN_houses_of_the_netherlands_desc: "为了加强与邻国荷兰的联系，弗雷德里克十世国王与奥兰治-拿骚王室建立了密切的伙伴关系，加强了丹麦和荷兰君主国之间的文化交流与合作。"
 DEN_proclaim_an_empire: "宣告帝国"
 DEN_proclaim_an_empire_desc: "随着丹麦进入王室统治的新时代，弗雷德里克十世国王宣布建立丹麦帝国，象征着丹麦作为全球强国的复兴，并重申了其历史遗产。"
 DEN_the_fate_of_the_monarchy: "君主的命运"
 DEN_the_fate_of_the_monarchy_desc: "在猜测和不确定性中，弗雷德里克十世国王向全国发表讲话，重申他对君主制的承诺，并概述了他在王室领导下实现繁荣和统一的丹麦的愿景。"
 DEN_traditional_monarchy: "传统君主制"
 DEN_traditional_monarchy_desc: "弗雷德里克十世国王拥护丹麦君主制的传统和习俗，维护其礼仪职责、文化遗产和作为国家统一力量的象征意义。"
 DEN_adopt_new_traditions: "采纳新传统"
 DEN_adopt_new_traditions_desc: "在尊重传统的同时，弗雷德里克十世国王还寻求调整和发展君主制，以满足现代丹麦社会不断变化的需求和期望，引入与当代价值观和愿望产生共鸣的新习俗和仪式。"
 DEN_a_new_way: "崭新的道路"
 DEN_a_new_way_desc: "弗雷德里克十世国王以前瞻性的方式为君主制制定了新的路线，强调创新、包容性以及对21世纪丹麦人民需求的响应。"
 DEN_international_recognition: "国际认可"
 DEN_international_recognition_desc: "为了提高丹麦在世界舞台上的地位，弗雷德里克十世国王发起了外交魅力攻势，为丹麦作为丹麦统一和身份象征的君主制角色赢得了国际认可和尊重。"
 DEN_strengthen_the_regency: "加强摄政"
 DEN_strengthen_the_regency_desc: "弗雷德里克十世国王认识到一个有能力且忠诚的摄政王的重要性，因此任命值得信赖的顾问和心腹担任宫廷内的关键职位，以确保对君主政体的有效治理和管理。"
 DEN_build_up_advisors: "建立顾问团"
 DEN_build_up_advisors_desc: "弗雷德里克十世国王组建了一支由来自各个领域的经验丰富的顾问和专家组成的团队，为治国方略、治理和政策制定等问题提供咨询和指导，提高君主制的明智决策和战略规划的能力。"
 DEN_create_a_protocol: "创建协议"
 DEN_create_a_protocol_desc: "为了维护君主制的尊严和礼仪，弗雷德里克十世国王为皇家仪式、活动和订婚制定了正式的礼节，保留了几个世纪以来丹麦皇室的传统和礼节。"
 DEN_establish_the_court: "建立宫廷"
 DEN_establish_the_court_desc: "作为王室行政管理的核心，弗雷德里克十世国王建立了一个法庭，作为王室活动、治理和礼仪事务的中心，在王室成员之间培养社区意识和友情。"
 DEN_implement_the_new_dkr: "发行新丹麦克朗"
 DEN_implement_the_new_dkr_desc: "随着君主制作为统治权威的牢固确立，弗雷德里克十世国王推出了新丹麦克朗，这是一种经过修改的货币，象征着该国对王室领导和经济繁荣的新承诺。"
 DEN_ties_to_GB: "与英国的关系"
 DEN_ties_to_GB_desc: "基于历史联系和共同价值观，丹麦努力加强与英国的外交关系。通过参与对话、贸易协定和联合倡议，丹麦旨在深化与英国的双边伙伴关系，促进贸易、国防、研究和创新等领域的合作，同时应对英国退欧的复杂性，并确保加入欧盟后的持续合作。"
 DEN_ties_USA: "与美国的关系"
 DEN_ties_USA_desc: "丹麦承认美国是重要的战略盟友和伙伴，寻求加强与美国的双边关系。通过外交接触、贸易协定和联合倡议，丹麦旨在深化与美国在国防、能源、创新和文化交流等广泛领域的合作，同时重申两国之间牢固的友谊和共同的价值观。"
 DEN_a_modern_military: "现代军队"
 DEN_a_modern_military_desc: "丹麦政府认识到不断变化的安全形势和国防的必要性，开始采取全面举措，培养一支能够捍卫丹麦主权并在全球舞台上投射力量的现代化军队。"
 DEN_modular_focus: "关注模块化"
 DEN_modular_focus_desc: "丹麦政府采用模块化战舰建造方法，优先考虑其海军平台和系统的灵活性和适应性。通过与蒂森克虏伯船舶系统公司合作，丹麦委托为其船队设计和建造灵活的标准弹性模块，从而实现快速重新配置和任务专业化，以满足不断变化的运营要求。"
 DEN_corvettes: "轻型护卫舰"
 DEN_corvettes_desc: "为了补充其护卫舰舰队，丹麦政府寻求采购针对海岸防御和反潜战进行优化的多功能护卫舰。与萨博考库姆公司的合作并采购了克努德维京级轻型护卫舰，该轻型护卫舰配备了隐形技术和先进的声纳系统，以增强态势感知和威慑能力。"
 DEN_attack_submarines: "攻击型潜艇"
 DEN_attack_submarines_desc: "丹麦政府重点关注力量投射和海上拒止能力，投资采购能够对敌方水面舰艇和潜艇实施进攻行动的攻击潜艇。蒂森克虏伯海洋系统公司获得建造哈曼登级攻击潜艇的合同，该潜艇配备先进的鱼雷和巡航导弹，可对高价值目标进行精确打击。"
 DEN_ATGM: "反坦克导弹"
 DEN_ATGM_desc: "认识到现代威胁不断变化的性质，丹麦政府优先考虑采购反坦克导弹系统，以有效对抗装甲对手。获得了采购最先进的反坦克导弹系统的合同，为丹麦陆军提供精确制导火力，以消除敌方装甲威胁。"
 DEN_SAM: "防空导弹"
 DEN_SAM_desc: "为了保护丹麦领空并防御空中威胁，丹麦政府投资地对空导弹系统以增强防空能力。与盟国的伙伴关系促进先进地对空导弹系统的采购，确保全面防御空中威胁。"
 DEN_CAESAR: "恺撒"
 DEN_CAESAR_desc: "借鉴盟军的经验教训，丹麦政府探索采购凯撒自行火炮系统。与下一代系统就采购凯撒榴弹炮的合同进行谈判，为丹麦陆军提供高度机动和多功能的火炮平台。"
 DEN_SPA: "自行火炮"
 DEN_SPA_desc: "为了增强建制火力支援能力，丹麦政府探索了购买丹麦自行火炮系统的方案。与当地国防承包商合作开发了针对机动性、火力和战场效率进行优化的自行火炮平台。"
 DEN_small_arms: "轻武器"
 DEN_small_arms_desc: "为了确保丹麦步兵配备最可靠、最有效的枪支，丹麦政府投资采购最先进的小型武器。获得了购买现代突击步枪、卡宾枪和手枪的合同，为丹麦士兵在战场上提供了卓越的火力和准确性。"
 DEN_G36: "G36"
 DEN_G36_desc: "根据北约标准和互操作性要求，丹麦政府选择赫克勒&科赫G36步枪作为丹麦步兵部队的标准配发武器。与赫克勒&科赫就G36步枪的生产和交付签订了合同，使丹麦士兵能够在不同的作战环境中自信、精确地作战。"
 DEN_C7: "C7"
 DEN_C7_desc: "基于与加拿大长期合作关系的成功，丹麦政府继续为其步兵部队采购柯尔特加拿大C7步枪。续签了C7步枪的生产和交付合同，确保与加拿大和其他盟军的互操作性，同时保持可靠性和性能的高标准。"
 DEN_NEW_small_arms: "新型轻武器"
 DEN_NEW_small_arms_desc: "为了使丹麦步兵部队的小型武器选择多样化，丹麦政府探索从一系列国际供应商处采购新枪支。在各种平台上进行评估，包括 FN SCAR、斯太尔AUG和西格&绍尔MCX，以确定最适合丹麦士兵的武器。"
 DEN_NEW_APC: "新型装甲输送车"
 DEN_NEW_APC_desc: "为了实现部队运输能力现代化，丹麦政府探索购买新型装甲输送车的选择。在各种平台上进行评估，包括帕特里亚AMV、拳师和 美洲狮，以确定最适合丹麦陆军需求的装甲输送车。"
 DEN_NEW_IFV: "新型步兵战车"
 DEN_NEW_IFV_desc: "认识到步兵支援和火力的重要性，丹麦政府寻求采购新一代步兵战车。与领先的国防制造商签订合同，购买配备先进武器系统和防护功能的步兵战车平台。"
 DEN_JFST: "联合火力支援小组"
 DEN_JFST_desc: "丹麦政府认识到综合火力支援在现代战争中的关键作用，成立联合火力支援小组，以协调和同步整个联合行动中的火炮、空中支援和其他火力能力。联合火力支援小组由来自各军种的专家组成，可增强丹麦陆军提供精确、迅速火力支援地面部队的能力。"
 DEN_reformed_army: "改革后的军队"
 DEN_reformed_army_desc: "为了适应不断变化的威胁和行动要求，丹麦政府对军队的组织结构和条令进行了全面改革。通过重组、现代化和训练举措，军队进行了改革，以提高其敏捷性、互操作性和应对未来挑战的能力。"
 DEN_secret_service: "安全和情报局"
 DEN_secret_service_desc: "为了增强安全和情报局的资源和能力，政府授权国内情报机构加强丹麦境内的监视、情报收集和反恐工作。安全和情报局加强重点打击国内威胁，包括极端主义、恐怖主义和有组织犯罪，以保护国家及其公民。"
 DEN_expand_forsvarets_efterretningstjeneste: "扩大国防情报局"
 DEN_expand_forsvarets_efterretningstjeneste_desc: "认识到在全球舞台上主动收集情报的必要性，政府向国防情报局分配了额外的资金和人员。赋予的任务是收集外国情报和开展网络行动，扩大其范围以监控新出现的威胁、地缘政治发展和网络对手，从而增强丹麦在国际战线上的战略态势和态势感知。"
 denmark.46.t: "欧元公投"
 denmark.46.d: "为了引入欧元，我们需要进行全民公投，并给我们的人民投票的机会。"
 denmark.46.a: "让我们开始投票吧"
 denmark.47.t: "我们的人民想要欧元"
 denmark.47.d: "结果显示，我们大多数人希望加入欧元区并采用欧元。"
 denmark.47.a: "好消息，让我们致电布鲁塞尔吧。"
 denmark.47.b: "不幸的是，结果已丢失在碎纸机中。"
 denmark.48.t: "我们的人民不想要欧元"
 denmark.48.d: "结果显示，我们人民中的大多数人希望保留我们自己的货币。"
 denmark.48.a: "向欧洲中央银行发送这个狗日的结果。"
 denmark.48.b: "对于选民来说不幸的是，我们仍将引入欧元。"
 denmark.8.a: "真爱无敌！"
 denmark.8.b: "瑞典王储维多利亚公主"
 denmark.8.c: "挪威玛莎·路易丝公主"
 denmark.300.t: "红发编年史开始"
 denmark.300.d: "一个来自丹麦的随机小伙子拍摄自己玩游戏并在千禧黎明社区出名，决定在丹麦内陆购买一个农场。"
 denmark.300.a: "生姜头也能当地主？这个国家算是完球了！"
 denmark.300.b: "他在onlyFans上有账号吗？"
 denmark.300.c: "整个丹麦实际上都是内陆地区"
 DEN_idea_feal_well: "真正的福利国家"
 DEN_idea_feal_well_desc: "丹麦重申致力于成为一个真正的福利国家，优先考虑社会福利计划、医疗保健可及性和教育，以确保所有公民的福祉。"
 DEN_euro_question_idea: "欧元问题"
 DEN_euro_question_idea_desc: "丹麦正在努力解决欧元问题，就采用欧元作为其官方货币的潜在利弊进行辩论和讨论。"
 DEN_idea_new_way: "君主制的新路"
 DEN_idea_new_way_desc: "君主制探索与丹麦人民接触并适应现代挑战的新方式，重新定义其在社会中的作用和相关性。"
 DEN_courtly: "宫廷"
 DEN_courtly_desc: "丹麦保留其宫廷传统，坚持反映该国丰富文化遗产和皇室历史的礼仪、礼节和礼仪实践。"
 DEN_idea_new_dkr: "新丹麦克朗"
 DEN_idea_new_dkr_desc: "丹麦推出新货币新丹麦克朗，作为旨在增强经济稳定性和竞争力的货币改革的一部分。"
 DEN_marxist_reeducation_idea: "马克思主义改造"
 DEN_marxist_reeducation_idea_desc: "马克思主义再教育是一项旨在重塑社会价值观和经济原则的再教育计划。该倡议的重点是推广马克思主义理论的信条，包括集体所有制、社会平等和拆除资本主义结构。通过教育改革和公共活动，我们寻求加深对马克思主义理想的理解，并培育一个植根于团结和公平的社会。"
 DEN_inspire_revolutions: "抗议出口"
 DEN_inspire_revolutions_desc: "抗议出口是一项富有远见的战略，旨在促进全球变革运动。通过外交渠道、文化交流和直接支持，丹麦寻求点燃全世界的抗议和革命精神。"
 DEN_council_run_corporations_idea: "理事会运行的公司"
 DEN_council_run_corporations_idea_desc: "理事会运行的公司其目标是彻底改变公司治理。根据这一倡议，公司将由由工人、股东和社区代表组成的民主委员会管理。"
 DEN_euro_question_decisions_category: "欧元问题"
 DEN_euro_referendum_decision: "欧元公投"
 DEN_euro_referendum_decision_desc: "欧元公投标志着丹麦经济政策的关键时刻，为公民提供了表达对采用欧元货币立场的机会。在丹麦权衡欧元区一体化的好处和挑战之际，这次公投反映了该国对民主决策及其在欧盟内的地位的承诺。"
