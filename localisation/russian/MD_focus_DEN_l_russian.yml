 DEN_odense_staalskibsvaerft: "Odense Staalskibsvaerft"
 DEN_svendborg_skibsvaerft: "Svendborg Skibsvaerft"
 DEN_terma_AS_aircraft_manufacturer: "Terma AS"
 DEN_idea_welfare_state: "Государство всеобщего благосостояния"
 DEN_idea_welfare_state_desc: "Государство всеобщего благосостояния — важнейшая часть датского общества, призванная сохранять большинство граждан в среднем классе.\n§W--------------§!\nЭтот национальный дух будет §Rудалён§! и заменён на §Y$DEN_idea_welfare_state1$§!, если мы выполним фокус §Y$DEN_form_minimal_state$§!, или на §Y$DEN_idea_welfare_state2$§!, если мы выполним фокус §Y$DEN_schroder_blair_paper$§!."
 DEN_idea_welfare_state1: "Датское минимальное государство"
 DEN_idea_welfare_state1_desc: "Датская модель минимального государства уникальна: она стремится максимально сократить расходы, сохраняя при этом общественную поддержку."
 DEN_idea_welfare_state2: "Реформированное государство всеобщего благосостояния"
 DEN_idea_welfare_state2_desc: "Государство всеобщего благосостояния — важнейшая часть датского общества, призванная сохранять большинство граждан в среднем классе. Однако для сохранения его эффективности и устойчивости потребовались реформы."
 DEN_agriculture_subvention_TT: "Поддерживая сельское хозяйство, мы повышаем стабильность и независимость нашей страны."
 DEN_decision_agriculture: "Сельскохозяйственные субсидии"
 DEN_decision_agriculture_desc: "Сельскохозяйственные субсидии — финансовая помощь, которую государство оказывает фермерам и агробизнесу. Субсидии призваны стабилизировать цены на продовольствие, обеспечить стабильные поставки продовольствия, повысить продуктивность сельского хозяйства и защитить доходы фермеров.\n\n§YНедовольство фермеров§!: [?ROOT.DEN_farmer_anger|0]/100\n§YНедовольство экологов§!: [?ROOT.DEN_environmentalist_anger|0]/100\n\nПосле завершения «Современного сельского хозяйства» каждая группа может протестовать каждый месяц. Чем выше недовольство, тем чаще и жёстче протесты. При значении 1 и отсутствии активной политики группа сохраняет спокойствие. Недовольство снижается примерно на 1 пункт в квартал."
 DEN_subventions_for_grain_decision: "Субсидии на зерно"
 DEN_subventions_for_pigs_decision: "Субсидии животноводству"
 DEN_subventions_for_beef_decision: "Субсидии аквакультуре"
 DEN_subventions_for_fishing_decision: "Субсидии рыболовству"
 DEN_EU_request_whine_grow_by_decision: "Выращивать собственное вино"
 DEN_subventions_modernization_decision: "Субсидировать переход на более экологичное оборудование"
 DEN_idea_agriculture: "Современное сельское хозяйство"
 DEN_idea_agriculture_desc: "Современное сельское хозяйство сочетает передовые технологии, устойчивые практики и новаторские методы, повышая продуктивность, эффективность и бережное отношение к природе. Такой подход призван удовлетворить потребность растущего населения планеты в продовольствии, минимизируя ущерб для экологии."
 DEN_idea_agriculture_II: "Сельскохозяйственные субсидии"
 DEN_idea_agriculture_II_desc: "Сельскохозяйственные субсидии — механизмы государственной финансовой поддержки аграрного сектора, призванные стабилизировать цены на продовольствие, обеспечить стабильные поставки продовольствия и поддержать доходы фермеров. Субсидии могут принимать разные формы и служить разным целям, решая как экономические, так и социальные задачи."
 DEN_agriculture: "Современное сельское хозяйство"
 DEN_agriculture_desc: "Современное сельское хозяйство сочетает передовые технологии, устойчивые практики и новаторские методы, повышая продуктивность, эффективность и бережное отношение к природе. Такой подход призван удовлетворить потребность растущего населения планеты в продовольствии, минимизируя ущерб для экологии."
 DEN_modify_farmer_anger_tt: "§YНедовольство фермеров§! изменяется на [?modify_farmer_anger|-0] (сейчас: [?DEN.DEN_farmer_anger|Y0])\n"
 DEN_modify_envirementalist_anger_tt: "§YНедовольство экологов§! изменяется на [?modify_environmentalist_anger|-0] (сейчас: [?DEN.DEN_environmentalist_anger|Y0])\n"
 DEN_envirement_subvention_TT: "Экологическое замещение — часть более широкой стратегии достижения устойчивости и борьбы с ухудшением состояния окружающей среды. Оно требует инноваций, осведомлённости и решимости граждан, бизнеса и государства, чтобы находить и внедрять более экологичные альтернативы."
