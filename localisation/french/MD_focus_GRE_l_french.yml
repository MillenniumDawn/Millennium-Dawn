 GRE_rheinmetall_lethality_platform: "Intégration de la tourelle Lance 2.0"
 GRE_rheinmetall_rws_baseline: "Base de référence du poste d'armes à distance"
 GRE_rheinmetall_rws_30mm_upgrade: "Mise à niveau du canon Mk 30-2/ABM"
 GRE_rheinmetall_rws_dual_weapon: "Système d'engagement à double arme"
 GRE_rheinmetall_fire_control: "Contrôle de tir électro-optique"
 GRE_rheinmetall_hunter_killer: "Mode engagement chasseur-tueur"
 GRE_rheinmetall_ammo_logistics: "Logistique standardisée des munitions"
 GRE_rheinmetall_battlefield_networking: "Intégration de la gestion du champ de bataille"
 GRE_rheinmetall_lethality_export_package: "Ensemble d'armes à l'export"
 GRE_rheinmetall_hellenic_lynx_doctrine: "Doctrine de combat Lynx hellénique"
 GRE_vision_2030: "Vision militaire"
 GRE_vision_2030_desc: "Nos forces armées ont pris du retard après des années d'austérité et une pensée de guerre froide dépassée. Équipement vieillissant, structures pléthoriques, une armée qui ne reflète pas les menaces. Ce plan est la réforme de défense la plus ambitieuse de l'histoire grecque moderne."
 GRE_armored_transition: "Transition blindée"
 GRE_armored_transition_desc: "Le BMP-1 et le M48 Patton ont fait leur temps. Retirer notre blindage de guerre froide et passer au Leopard 2 dans sa variante hellénique donnera à nos brigades blindées une force de chars capable d'égaler quiconque dans la région."
 GRE_pzh_2000: "Obusiers PzH 2000"
 GRE_pzh_2000_desc: "Notre artillerie doit suivre la guerre blindée moderne. L'obusier automoteur PzH 2000 donnerait à nos forces un tir de précision à distance et assurerait à nos commandants terrestres un appui-feu indirect efficace."
 GRE_m270_mlrs: "M270 MLRS"
 GRE_m270_mlrs_desc: "Couvrir les débarquements insulaires et frapper des cibles côtières à travers l'Égée exige une puissance de feu au-delà de la ligne de front. Le système de roquettes multiples M270 donnerait à notre armée cette portée."
 GRE_puls_rocket: "Système de fusée PULS"
 GRE_puls_rocket_desc: "Par le programme conjoint EURO-PULS avec Israël et nos partenaires européens, nous pouvons déployer un système d'artillerie-roquettes de précision capable de frapper à portée étendue. Cela ferait réfléchir deux fois tout adversaire en Égée."
 GRE_special_warfare_command: "Commandement de guerre spéciale"
 GRE_special_warfare_command_desc: "Unifier nos unités EKAM, brigades de raiders, plongeurs de combat et parachutistes sous un seul commandement des opérations spéciales nous donnerait une force d'élite capable d'opérer sur nos îles et au-delà. Dans la guerre moderne, de petites unités létales peuvent décider ce que des divisions entières ne peuvent pas."
 GRE_archipelagos_strategy: "Stratégie des Archipels"
 GRE_archipelagos_strategy_desc: "Nos milliers d'îles ne sont pas un fardeau. Avec une défense adaptée et une doctrine cohérente, elles deviennent une barrière en couches qu'aucune flotte ennemie ne peut franchir sans de lourdes pertes. Utilisons la géographie de l'Égée à notre avantage."
 GRE_f16_modernisation: "Modernisation des F-16"
 GRE_f16_modernisation_desc: "Moderniser 83 de nos F-16 au standard Block 70/72 Viper via l'industrie aérospatiale hellénique garderait notre flotte de chasse en forme tout en bâtissant l'expertise intérieure nécessaire à la maintenance future des F-35."
 GRE_intl_flight_training: "Centre international de formation au pilotage"
 GRE_intl_flight_training_desc: "Ouvrir nos installations d'entraînement aérien aux nations alliées construirait la bienveillance, approfondirait les liens militaires et donnerait à nos pilotes l'expérience d'entraîner aux standards internationaux."
 GRE_new_transport_helicopters: "Nouveaux hélicoptères de transport"
 GRE_new_transport_helicopters_desc: "Un transport rapide entre nos îles est essentiel à la défense insulaire. Déployer 35 UH-60M Black Hawk aux côtés de nos MH-60R Seahawk nous donnerait la capacité de lift pour renforcer toute position menacée avant que l'ennemi ne s'y installe."
 GRE_f35_program: "Collaboration au programme F-35"
 GRE_f35_program_desc: "Rejoindre le programme F-35 nous donne un chasseur furtif de cinquième génération que personne dans la région ne peut égaler. Le contrat signé en juillet 2024 est une étape majeure pour l'armée de l'air hellénique et place nos pilotes devant quiconque en Égée."
 GRE_patriot_air_defense: "Systèmes de défense aérienne Patriot"
 GRE_patriot_air_defense_desc: "Nos batteries Nike Hercules sont trop vieilles face aux menaces modernes. Passer au Patriot PAC-3 avec intercepteurs MSE donnerait enfin à la Grèce une vraie défense antimissile balistique et protégerait nos infrastructures critiques."
 GRE_centauros_anti_drone: "Système anti-drone Centauros"
 GRE_centauros_anti_drone_desc: "Le système C-UAS Centauros a été développé par l'industrie aérospatiale hellénique et éprouvé en mer Rouge. Le déployer sur nos îles, bases navales et aérodromes est une priorité. Les drones sont la plus grande menace de la guerre moderne et nous devons pouvoir les contrer."
 GRE_achilles_shield: "Bouclier d'Achille"
 GRE_achilles_shield_desc: "Intégrer nos batteries Patriot, défenses drones Centauros et missiles côtiers en un réseau unifié couvrant toute l'Égée créerait une zone d'anti-accès rendant toute attaque du territoire grec extrêmement coûteuse."
 GRE_kimon_class_frigate: "Frégate de classe Kimon"
 GRE_kimon_class_frigate_desc: "Après des années de programmes annulés, nous avons enfin signé avec Naval Group pour trois frégates FDI HN avec option d'une quatrième. La classe Kimon donnera à la marine hellénique un vrai combattant de surface capable de tenir tête à n'importe quelle flotte de la région."
 GRE_hydra_class_upgrade: "Modernisation de la classe Hydra"
 GRE_hydra_class_upgrade_desc: "Les frégates de classe Hydra sont des MEKO 200HN construites à Skaramangas dans les années 1990 et forment l'épine dorsale de notre force de surface. Une modernisation à mi-vie de leurs radars, suites de guerre électronique et missiles antinavires les garderait efficaces au combat pour des décennies."
 GRE_elli_class: "Programme de remplacement de la classe Elli"
 GRE_elli_class_desc: "Les frégates de classe Elli sont d'anciens Van Speijk néerlandais transférés dans les années 1980 et ont depuis longtemps dépassé leur durée de vie. Il nous faut des coques de remplacement, construites au pays à Skaramangas ou acquises à l'étranger, pour restaurer notre force de frégates."
 GRE_roussen_attack_craft: "Vaisseau d'attaque rapide de classe Roussen"
 GRE_roussen_attack_craft_desc: "L'Égée n'est pas un océan ouvert, ce sont des eaux étroites parfaites pour les vedettes d'attaque rapide. La classe Roussen est faite pour cela : rapide, armée de missiles, létale à courte portée. Une nouvelle génération de ces vedettes pourrait refuser à toute flotte hostile l'accès aux eaux grecques."
 GRE_fremm_frigate: "Frégates polyvalentes FREMM"
 GRE_fremm_frigate_desc: "Notre flotte a besoin de plus de navires. Nous pouvons acquérir rapidement des FREMM italiennes éprouvées ou investir dans une cinquième FDI de Naval Group. Chaque option a des avantages différents en vitesse, capacité et relations d'alliance."
 GRE_submarine_expansion: "Programme d'acquisition Type 214"
 GRE_submarine_expansion_desc: "La classe Papanikolis représente le meilleur de la guerre sous-marine conventionnelle. La propulsion anaérobie permet à nos bateaux de rester immergés des semaines. Étendre et soutenir ce programme renforcerait notre contrôle du domaine sous-marin de l'Égée."
 GRE_bluewhale_submarines: "Sous-marins BlueWhale"
 GRE_bluewhale_submarines_desc: "Des sous-marins autonomes sans équipage d'Israeli Aerospace ajouteraient une capacité que personne dans la région ne peut égaler. Ces systèmes opèrent sans équipage et sans risque, donnant à notre marine une présence sous-marine persistante."
 GRE_defense_manufacturing: "Mandat de fabrication locale"
 GRE_defense_manufacturing_desc: "Une exigence de 25 % de contenu local pour tous les grands programmes de défense garantirait que notre industrie intérieure bénéficie de chaque contrat. EAS, HAI et nos chantiers se renforceraient et nous réduirions notre dépendance aux fournisseurs étrangers."
 GRE_research_hubs: "Pôles de recherche"
 GRE_research_hubs_desc: "Une collaboration formelle entre nos universités, l'industrie aérospatiale hellénique et le ministère de la Défense créerait un pipeline d'innovation pour les forces armées."
 GRE_defense_innovation_center: "Centre d'innovation de défense hellénique"
 GRE_defense_innovation_center_desc: "Un centre d'innovation dédié reliant startups, universités et partenaires de l'industrie de défense aiderait à accélérer le développement de technologies militaires de nouvelle génération en Grèce."
 GRE_communication_satellites: "Satellites de communication"
 GRE_communication_satellites_desc: "Des satellites de communications militaires dédiés nous donneraient une couverture persistante de l'Égée et une ossature de communications sécurisée pour toutes les branches des forces armées."
 GRE_theon_international: "Expansion internationale de Theon"
 GRE_theon_international_desc: "Theon International a une forte réputation mondiale pour la vision nocturne et les systèmes optiques. Soutenir leur expansion vers de nouveaux marchés d'export générerait des recettes et des relations de défense tout en montrant que l'industrie grecque peut concourir au plus haut niveau."
 GRE_industrial_synergy: "Synergie industrielle"
 GRE_industrial_synergy_desc: "Nos programmes de défense fonctionnent mieux lorsque nos industries coopèrent. Une coordination formelle entre HAI, nos chantiers, EAS et nos institutions de recherche rendrait chaque programme plus rapide, moins cher et plus capable."
 GRE_irix_loitering: "Munitions de flânerie IRIX"
 GRE_irix_loitering_desc: "Hellenic Defence Systems s'est associée à Paramount Industries pour produire l'IRIX, la première munition rodeuse faite en Grèce. Avec une portée jusqu'à 100 kilomètres, elle donne à nos forces une frappe de précision pouvant atteindre profondément le territoire ennemi sans dépendre de fournisseurs étrangers."
 GRE_lora_ballistic: "Système de missile balistique LORA"
 GRE_lora_ballistic_desc: "Le système de missile balistique LORA d'Israel Aerospace Industries nous donnerait une frappe de précision à longue portée de 400 kilomètres. Cette portée change nettement l'équilibre en Égée et donne à tout adversaire potentiel de quoi réfléchir."
 GRE_iniochos: "Programme d'exercice Iniochos"
 GRE_iniochos_desc: "L'exercice annuel Iniochos à Andravida est devenu l'un des principaux événements d'entraînement aérien multinational d'Europe. Étendre la participation et complexifier les scénarios aiguisera nos pilotes et renforcera nos relations militaires avec les nations alliées."
 GRE_grypas_ucav: "Programme UCAV Grypas"
 GRE_grypas_ucav_desc: "L'industrie aérospatiale hellénique a développé le Grypas, notre premier drone de combat conçu au pays. Investir dans ce programme nous donne une capacité de frappe sans pilote non soumise aux restrictions d'export étrangères ou aux conditions politiques."
 GRE_integrated_air_defense: "Réseau de défense aérienne intégré"
 GRE_integrated_air_defense_desc: "Relier les batteries Patriot, le bouclier antimissile Achille, les systèmes anti-drones et notre couverture radar en un seul réseau en couches donne à la Grèce un ciel qu'aucun aéronef ou drone hostile ne peut franchir sans réponse. Chaque capteur et chaque intercepteur combattent désormais comme un seul système."
 GRE_strategic_transport_fleet: "Flotte de transport stratégique"
 GRE_strategic_transport_fleet_desc: "Notre défense insulaire n'est aussi bonne que notre capacité à la réapprovisionner et la renforcer. Moderniser notre flotte de C-27J et acquérir des C-130H supplémentaires garantirait qu'aucune garnison ne reste sans soutien et qu'aucune île ne soit isolée en crise."
 GRE_constellation_co_production: "Coproduction de classe Constellation"
 GRE_constellation_co_production_desc: "Avec les États-Unis, nous avons commencé à planifier la coproduction de la frégate classe FFG-62 Constellation. Ce partenariat ajoute des navires de guerre de classe mondiale à notre flotte et développe l'expertise et la capacité de nos chantiers de Skaramangas et Elefsina."
 GRE_eyes_of_poseidon: "Les yeux de Poséidon"
 GRE_eyes_of_poseidon_desc: "On ne défend pas ce qu'on ne voit pas. Intégrer patrouilleurs maritimes, stations radar côtières et imagerie satellitaire en un réseau de surveillance unifié nous donnerait une conscience totale des mers Égée et Ionienne."
 GRE_souda_bay_expansion: "Agrandissement de la base navale de la baie de Souda"
 GRE_souda_bay_expansion_desc: "La baie de Souda est l'un des ports les plus stratégiques de Méditerranée. Étendre notre coopération avec les États-Unis et l'OTAN sur ce site renforcerait nos alliances et cimenterait le rôle de la Grèce comme ancre clé du flanc sud de l'OTAN."
 GRE_alexandroupolis_strategic_hub: "Hub stratégique d'Alexandroupoli"
 GRE_alexandroupolis_strategic_hub_desc: "Le port d'Alexandroupolis est devenu un corridor logistique OTAN vital vers l'Europe de l'Est, contournant entièrement le Bosphore. Investir dans ses infrastructures et travailler plus étroitement avec la Bulgarie et la Roumanie en ferait un atout stratégique permanent."
 GRE_spike_atgm_integration: "Intégration Spike ATGM"
 GRE_spike_atgm_integration_desc: "Notre infanterie et nos véhicules blindés ont besoin d'un missile antichar guidé moderne pouvant frapper au-delà de la ligne de vue. Intégrer la famille Spike à nos forces terrestres et patrouilleurs navals donnerait à chaque commandant une option de frappe de précision."
 GRE_stinger_manpads: "Modernisation des MANPADS"
 GRE_stinger_manpads_desc: "Nos garnisons insulaires et unités avancées font face à des menaces aériennes que les grandes batteries de défense aérienne ne peuvent couvrir de façon rentable. Moderniser et étendre notre inventaire de MANPADS Stinger donnerait à chaque unité d'infanterie et patrouilleur une défense aérienne organique."
 GRE_infantry_digitisation: "Programme de numérisation de l'infanterie"
 GRE_infantry_digitisation_desc: "Le soldat moderne doit partager la même image opérationnelle que le pilote au-dessus et la frégate au large. Équiper notre infanterie de systèmes de gestion du champ de bataille, de communications chiffrées et d'équipements de ciblage numériques les connecterait au réseau plus large au lieu de les laisser opérer isolés."
 GRE_sovereign_waters: "Eaux souveraines"
 GRE_sovereign_waters_desc: "Pendant des décennies d'autres ont contesté nos droits souverains en Égée et Méditerranée orientale et nous n'avions pas la marine pour y faire grand-chose. Avec une flotte modernisée et une défense insulaire adaptée, nous pouvons désormais affirmer ce que le droit international nous a toujours accordé. Notre zone économique exclusive est nôtre."
 GRE_rheinmetall_greece: "Rheinmetall en Grèce"
 GRE_rheinmetall_greece_desc: "Rheinmetall veut établir un assemblage et une maintenance locaux en Grèce dans le cadre de futurs marchés. Formaliser ce partenariat et intégrer leur production à notre industrie de défense intérieure renforcerait la modernisation de nos forces terrestres et ferait de la Grèce un pôle de fabrication de défense en Europe du Sud-Est."
 GRE_joint_operations_reform: "Réforme des opérations interarmées"
 GRE_joint_operations_reform_desc: "Nos trois branches ont passé des décennies à opérer séparément, avec leurs propres doctrines et cultures de commandement. Un cadre d'opérations interarmées unifié qui fasse planifier, s'entraîner et combattre ensemble l'armée, la marine et l'armée de l'air est essentiel. Tout le reste que nous voulons faire en dépend."
 GRE_new_army_doctrine: "De la masse à la manœuvre"
 GRE_new_army_doctrine_desc: "L'armée hellénique a été bâtie pour tenir une ligne en Thrace avec le plus d'hommes possible. Cette guerre n'est jamais venue. Il faut restructurer autour de groupes de brigades plus petits et plus rapides, déployables à travers l'Égée et capables de répondre aux menaces avant qu'elles ne deviennent des crises."
 GRE_nco_reform: "L'épine dorsale de l'armée"
 GRE_nco_reform_desc: "Les officiers grecs ont toujours dû prendre chaque décision jusqu'au niveau peloton parce que les sous-officiers n'ont jamais eu l'autorité ni la formation pour agir seuls. Bâtir un corps de sous-officiers professionnels capables de diriger et s'adapter sans attendre les ordres d'en haut rendrait l'armée bien plus efficace."
 GRE_thrace_to_aegean: "Réorienter l'armée"
 GRE_thrace_to_aegean_desc: "Pendant quarante ans nos forces terrestres ont fait face au nord-est, vers l'Evros. Cette menace n'a pas disparu, mais ce n'est plus notre seule préoccupation. Nous devrions réorienter notre déploiement principal vers les îles et côtes de l'Égée, où la souveraineté est mise à l'épreuve chaque jour."
 GRE_joint_fires_doctrine: "École interarmes"
 GRE_joint_fires_doctrine_desc: "Artillerie, blindés, infanterie et appui aérien rapproché ont trop longtemps opéré en silos. La guerre interarmes doit devenir la norme, chaque unité s'entraînant ensemble. Nos soldats doivent savoir travailler avec l'appui aérien, pas seulement en lire."
 GRE_sead_doctrine: "Suppression des défenses ennemies"
 GRE_sead_doctrine_desc: "Nos pilotes sont parmi les plus expérimentés de l'OTAN pour la contre-air défensive au-dessus de l'Égée, mais les frappes offensives contre des cibles défendues restent sous-développées. Il nous faut une doctrine SEAD dédiée utilisant le SCALP et le Meteor du Rafale pour éliminer les défenses aériennes ennemies avant l'entrée des paquets de frappe."
 GRE_iniochos_as_doctrine: "Les leçons d'Iniochos"
 GRE_iniochos_as_doctrine_desc: "Chaque année Iniochos réunit des pilotes de vingt nations pour apprendre ce qui marche dans un espace aérien contesté. Nous menons cet exercice depuis des années sans pleinement traduire les leçons en doctrine. Les enseignements de chaque cycle devraient être formalisés en tactiques et procédures mises à jour et adoptés dans toute l'armée de l'air hellénique."
 GRE_cas_doctrine: "Intégration de l'appui aérien rapproché"
 GRE_cas_doctrine_desc: "L'armée de l'air hellénique et l'armée de Terre se sont rarement entraînées ensemble au niveau nécessaire pour un appui aérien rapproché efficace. Un pipeline d'entraînement interarmées permanent et des protocoles de communication standardisés sont nécessaires pour que commandants terrestres et pilotes de chasse puissent vraiment travailler ensemble le moment venu."
 GRE_aegean_fortress_doctrine: "L'Égée comme notre mer"
 GRE_aegean_fortress_doctrine_desc: "L'Égée n'est pas un océan ouvert. C'est un labyrinthe de six mille îles, détroits étroits, bancs peu profonds et goulets. Un défenseur bien préparé peut rendre cette géographie extrêmement dangereuse pour toute flotte attaquante. Il nous faut une marine qui fasse de chaque approche du territoire grec un risque que personne ne voudrait prendre."
 GRE_aegean_fortress_doctrine_tt: "[Effet de défense GREAdmirald]"
 GRE_aegean_fortress_doctrine_effect: "Amiraux : §G30% de chances§! de gagner §Y+1 Défense§! à la montée de niveau"
 GRE_submarine_wolf_packs: "Doctrine de guerre sous-marine"
 GRE_submarine_wolf_packs_desc: "Les sous-marins sont l'arme la plus dangereuse en Égée. L'eau est trop peu profonde pour qu'un ennemi se cache, mais assez profonde aux bons endroits pour les nôtres. Entraîner nos équipages à opérer en groupes coordonnés, partageant les données de ciblage et couvrant les zones de patrouille les uns des autres, signifierait qu'aucune flotte de surface ne peut traverser l'Égée sans être pistée d'en bas."
 GRE_missile_corvette_network: "Le réseau Roussen"
 GRE_missile_corvette_network_desc: "Nos corvettes lance-missiles de classe Roussen sont rapides et létales, parfaites pour l'Égée, mais n'ont jamais opéré comme un réseau coordonné. Les intégrer au radar côtier, aux capteurs insulaires et aux comptes rendus sous-marins en une seule image de ciblage permettrait à n'importe quelle corvette d'engager n'importe quelle menace de surface en quelques minutes."
 GRE_aegean_minefield_doctrine: "Les détroits minés"
 GRE_aegean_minefield_doctrine_desc: "La Grèce a une capacité de minage naval depuis la Seconde Guerre mondiale, mais elle n'a jamais été pleinement intégrée à la doctrine. Des champs de mines prévus pour chaque approche majeure de l'Égée, prêts à être activés en quelques heures, transformeraient les détroits en barrières qu'une flotte supérieure ne peut franchir en sécurité."
 GRE_sea_denial_complete: "Forteresse Égée"
 GRE_sea_denial_complete_desc: "La mer Égée est désormais pleinement un domaine opérationnel grec. Chaque couche de notre défense maritime — sous-marins, corvettes, frégates, mines et missiles côtiers — a été intégrée en une seule doctrine de déni d'accès. Nous n'avons peut-être pas la plus grande marine de Méditerranée, mais nous avons la plus dangereuse pour quiconque tente de pousser dans nos eaux."
 GRE_eastern_med_doctrine: "Au-delà de l'Égée"
 GRE_eastern_med_doctrine_desc: "Les intérêts grecs ne s'arrêtent pas au Dodécanèse. Nos droits de ZEE au sud de la Crète, notre engagement envers Chypre et nos partenariats énergétiques avec Israël et l'Égypte exigent une marine capable d'opérer loin de chez elle pendant des périodes prolongées. Il nous faut une flotte crédible dans toute la Méditerranée orientale, pas seulement en Égée."
 GRE_asw_training: "Sous-marins de chasse"
 GRE_asw_training_desc: "La lutte anti-sous-marine est la compétence la plus exigeante et la plus négligée de la marine hellénique. Nos nouvelles frégates ont d'excellents capteurs ASM et torpilles mais les équipages ont besoin d'un entraînement dédié. Un programme ASM permanent s'appuyant sur notre propre force sous-marine enseignerait aux équipages de surface comment les sous-marins ennemis opèrent vraiment."
 GRE_fleet_coordination: "Commandement naval unique"
 GRE_fleet_coordination_desc: "Opérer à travers la Méditerranée orientale exige une coordination que des commandements d'escadre fragmentés ne peuvent fournir. Restructurer la marine hellénique sous un seul commandement opérationnel avec une conscience en temps réel de chaque navire, sous-marin et patrouilleur aérien rendrait la flotte bien plus efficace dans son ensemble."
 GRE_eastern_med_taskforce: "Maîtrise opérationnelle méditerranéenne"
 GRE_eastern_med_taskforce_desc: "L'Égée sécurisée, il faut étendre notre portée à travers la Méditerranée. Restructurer le pipeline d'entraînement, réformer les rotations de flotte et mener des déploiements prolongés bâtira la capacité de pister et d'engager toute flotte hostile sur toute la longueur de la Méditerranée."
 GRE_eastern_med_supremacy: "Suprématie de la Méditerranée orientale"
 GRE_eastern_med_supremacy_desc: "Une force expéditionnaire permanente, soutenue par des cales sèches modernes et allant de l'Ionienne au bassin levantin, fait de la marine hellénique la puissance maritime décisive de la Méditerranée orientale. Une projection de puissance de cette échelle répond à tout défi avant qu'il n'atteigne les eaux grecques."
 GRE_landforces_modifier: "Armée hellénique"
 GRE_landforces_modifier_desc: "La Grèce aligne une force terrestre aguerie, façonnée par des décennies de tension en Égée. Notre armée est entraînée, équipée et positionnée pour défendre chaque mètre de sol grec."
 GRE_airforce_modifier: "Armée de l'air hellénique"
 GRE_airforce_modifier_desc: "L'armée de l'air hellénique contrôle le ciel au-dessus de l'Égée. Nos pilotes sont parmi les plus expérimentés de l'OTAN, forgés par des interceptions quotidiennes et un espace aérien contesté."
 GRE_navy_modifier: "Marine hellénique"
 GRE_navy_modifier_desc: "La Grèce est une nation maritime. Notre flotte de frégates, sous-marins et vedettes d'attaque rapide patrouille des eaux grecques depuis l'Antiquité."
 GRE_cold_war_giant_1: "Armée de la guerre froide"
 GRE_cold_war_giant_1_desc: "Notre armée a été bâtie pour arrêter une poussée soviétique à travers les Balkans. Cette guerre n'est jamais venue. Nous avons désormais des formations surdimensionnées, coûteuses à doter, lentes à mouvoir, entraînées pour un champ de bataille qui n'existe plus."
 GRE_aircraft_bad_1: "Armée de l'air de la guerre froide"
 GRE_aircraft_bad_1_desc: "Notre flotte aérienne est un patchwork d'appareils de l'ère de la guerre froide. Les gros cellules sont chères à entretenir et nos pilotes manquent de doctrine pour projeter la puissance au-delà de l'Égée. L'aviation stratégique et la surveillance sont des lacunes majeures."
 GRE_navy_bad_1: "Marine de la guerre froide"
 GRE_navy_bad_1_desc: "Notre flotte paraît grande sur le papier mais c'est un chaos en pratique. Des coques d'occasion de trois marines différentes signifient trois chaînes logistiques. Les coûts de carburant sont trop élevés, la couverture antiaérienne a des trous, et nos officiers sont formés à la patrouille côtière plutôt qu'aux opérations de flotte."
 GRE_defense_industry: "Arsenal de l'Égée"
 GRE_defense_industry_modifier: "Arsenal de l'Égée"
 GRE_defense_industry_modifier_desc: "Des chantiers de Skaramangas aux usines d'armes autour du Pirée, l'industrie grecque approvisionne les forces armées depuis des générations. Nous avons notre propre industrie de défense et nous devons l'utiliser."
 GRE_research_hubs_idea_tt: "[GREresearchhubidea]"
 GRE_archipelagos_defense_plan: "Bouclier de l'Égée"
 GRE_archipelagos_defense_plan_desc: "Une architecture de défense en couches qui traite la chaîne d'îles de l'Égée comme un réseau de forteresses intégré. Réparation rapide, batteries côtières, déni logistique et couverture missile se combinent pour rendre toute approche des eaux grecques coûteuse."
 GRE_archipelagos_defense_plan_country: "Bouclier de l'Égée"
 GRE_archipelagos_defense_plan_country_desc: "Une architecture de défense en couches qui traite la chaîne d'îles de l'Égée comme un réseau de forteresses intégré. Réparation rapide, batteries côtières, déni logistique et couverture missile se combinent pour rendre toute approche des eaux grecques coûteuse."
 GRE_defense_innovation_research_mission: "Cycle de recherche d'innovation de défense"
 GRE_defense_innovation_research_mission_desc: "Le Centre hellénique d'innovation de défense pilote une recherche continue dans toutes les branches des forces armées. Tous les 100 jours, une percée peut émerger en blindage, artillerie, systèmes d'infanterie, aviation ou technologie navale."
 GRE_aegean_survey: "Enquête sur les fonds marins de la mer Égée"
 GRE_aegean_survey_desc: "Nous cartographions ce qui est nôtre. Une enquête géologique complète du fond de l'Égée établira l'étendue de nos réserves d'hydrocarbures et posera les bases de l'extraction."
 GRE_aegean_surveyed: "Cartographie des eaux égéennes"
 GRE_aegean_extraction: "Extraction de pétrole égéen"
 GRE_aegean_extraction_desc: "Les enquêtes sont achevées. Nous commençons l'extraction des champs de l'Égée. Du pétrole grec des eaux grecques pour l'économie grecque."
 GRE_aegean_extracting: "Huile égéenne extraite"
 GRE_aegean_offshore_industry: "Industrie offshore égéenne"
 GRE_aegean_offshore_industry_desc: "L'extraction génère de l'industrie. Nous construisons l'infrastructure de soutien pour traiter et distribuer ce que nous tirons du fond de l'Égée."
 GRE_crete_survey: "Enquête sur les fonds marins du sud de la Crète"
 GRE_crete_survey_desc: "Les eaux au sud de la Crète recèlent un potentiel inexploité important. Nous étendons nos opérations d'enquête aux bassins ionien et levantin."
 GRE_crete_surveyed: "Cartographie des eaux crétoises"
 GRE_crete_extraction: "Extraction de pétrole du sud de la Crète"
 GRE_crete_extraction_desc: "Les eaux grecques les plus profondes livrent les plus grandes réserves. Nous commençons l'extraction au sud de la Crète et assurons l'avenir économique de la nation."
 GRE_crete_extracting: "Huile crétoise extraite"
 GRE_crete_offshore_industry: "Industrie offshore du sud de la Crète"
 GRE_crete_offshore_industry_desc: "Les champs du sud produisent. Nous bâtissons la capacité industrielle pour transformer l'extraction brute en production économique durable."
 TUR_naval_expansion_response: "Programme d'expansion navale"
 TUR_naval_expansion_response_desc: "En réponse à l'assertivité maritime grecque, la Turquie accélère son programme de construction navale. Les chantiers tournent à capacité accrue pour combler l'écart en Méditerranée orientale."
 GRE_creditor_management_category: "Gestion de la dette grecque"
 GRE_creditor_management_category_desc: "En tant que détenteur de dette souveraine grecque, nous pouvons en appeler une partie ou la pardonner entièrement. Nos avoirs actuels génèrent des intérêts réguliers versés par Athènes."
 GRE_propose_debt_deal: "Proposer un accord sur la dette"
 GRE_propose_debt_deal_desc: "Proposer qu'une nation étrangère prenne une portion de notre dette nationale en échange de paiements d'intérêts réguliers. Nous transférerons 10 % de notre dette actuelle au créancier choisi, montant à 25 % une fois notre dette passée 90 % du PIB."
 GRE_repay_creditor: "Rembourser le créancier"
 GRE_repay_creditor_desc: "Effectuer un paiement forfaitaire pour réduire de 10 % notre dette envers ce créancier."
 GRE_creditor_call_in_debt: "Appel à la dette grecque"
 GRE_creditor_call_in_debt_desc: "Exiger que la Grèce rembourse immédiatement 20 % de la dette qu'elle nous doit. C'est une action diplomatique sévère qui peut détériorer les relations."
 GRE_creditor_forgive_debt: "Pardonnez la dette grecque"
 GRE_creditor_forgive_debt_desc: "Annuler 25 % de la dette que la Grèce nous doit en geste de bonne volonté. Cela améliorera nettement les relations avec Athènes."
 greece_debt.10.t: "Proposition de dette grecque"
 greece_debt.10.d: "[FROM.GetName] nous a approchés avec une proposition de prendre une portion de leur dette nationale. En échange, nous recevrions des intérêts réguliers sur le montant détenu. La somme proposée est modeste mais représente un flux de recettes fiable."
 greece_debt.10.a: "Accepter les termes"
 greece_debt.10.b: "Nous ne sommes pas intéressés"
 greece_debt.10.c: "Seulement à un taux plus élevé"
 greece_debt.12.t: "Accord de dette accepté"
 greece_debt.12.d: "[FROM.GetName] a accepté de prendre une portion de notre dette nationale. Nous leur verserons des intérêts réguliers, mais notre fardeau de dette global a été restructuré."
 greece_debt.12.a: "Un aménagement nécessaire"
 greece_debt.13.t: "Accord sur la dette rejeté"
 greece_debt.13.d: "[FROM.GetName] a décliné notre proposition de détenir une portion de notre dette. Nous devons chercher ailleurs un soulagement ou d'autres moyens d'aborder notre situation financière."
 greece_debt.13.a: "Nous trouverons une autre voie"
 greece_debt.14.t: "Contre-offre reçue"
 greece_debt.14.d: "[FROM.GetName] est prêt à détenir notre dette, mais seulement à un taux d'intérêt plus élevé que celui que nous avions proposé. Le coût accru du service de cette dette doit être pesé contre le soulagement immédiat qu'elle apporte."
 greece_debt.14.a: "Accepter le taux plus élevé"
 greece_debt.14.b: "Les termes sont inacceptables"
 greece_debt.16.t: "Dette appelée"
 greece_debt.16.d: "[FROM.GetName] exige le remboursement immédiat d'une portion de la dette que nous leur devons. Ne pas s'y conformer endommagera notre relation et notre crédibilité internationale."
 greece_debt.16.a: "Payer ce qu'ils exigent"
 greece_debt.16.b: "Nous ne pouvons pas nous le permettre"
 greece_debt.17.t: "Dette remise"
 greece_debt.17.d: "[FROM.GetName] a généreusement annulé une portion de la dette que nous leur devons. Ce soulagement inattendu allège considérablement notre fardeau financier."
 greece_debt.17.a: "Un soulagement bienvenu"
 greece_debt.18.t: "La dette grecque entièrement remboursée"
 greece_debt.18.d: "[FROM.GetName] a entièrement remboursé toute la dette restante qui nous était due. Nous perdons une source d'intérêts, mais le remboursement démontre une responsabilité fiscale."
 greece_debt.18.a: "Le compte est soldé"
 greece_debt.2.t: "Proposition d'échange de dettes"
 greece_debt.2.d: "[FROM.GetName] nous demande d'envisager de prendre une portion de leur dette nationale par un arrangement de swap."
 GRE_eligible_creditor_tt: "Ne doit pas être en guerre avec la Grèce, être indépendant, ne pas déjà être créancier, et avoir une opinion supérieure à -50"
 GRE_debt_ratio_above_50_tt: "Le ratio dette/PIB doit être supérieur à 50 %"
 GRE_debt_ratio_above_90_tt: "Le ratio dette/PIB doit être supérieur à 90 %"
 GRE_propose_debt_deal_accept_tt: "Le créancier prend une part de notre dette, réduisant notre dette nationale en échange de paiements d'intérêts continus."
 GRE_creditor_call_in_debt_accept_tt: "La Grèce rembourse la portion appelée de la dette qu'elle nous doit."
 GRE_creditor_call_in_debt_reject_tt: "La Grèce refuse de payer, aigrissant les relations entre nos nations."
 GRE_retry_outreach_accept_tt: "Ils acceptent notre ouverture, améliorant les relations et avançant notre alignement."
 GRE_repay_10pct_tt: "Rembourser 10 % de la dette due à ce créancier."
 GRE_call_in_20pct_tt: "Exiger le remboursement de 20 % de la dette grecque que nous détenons."
 GRE_forgive_25pct_tt: "Pardonner 25 % de la dette que la Grèce nous doit."
 GRE_eastmed_jor_accept_tt: "La Jordanie rejoint le forum, améliorant les relations et ouvrant un accord commercial avec nous."
 GRE_eastmed_jor_reject_tt: "La Jordanie décline, ce qui nous coûte du capital politique."
 GRE_interest_rate_below_cap_tt: "Le taux d'intérêt doit être inférieur à 8 %"
 GRE_interest_rate_above_min_tt: "Le taux d'intérêt doit être supérieur à 0,5 %"
 GRE_creditor_holds_significant_debt_tt: "Nous détenons plus de §Y10 milliards§! de §Ydette grecque§! (Actuel §Y[?GRE_debt_held_by_us|1] milliards§!)"
 GRE_deferred_to_creditors_tt: "Coûts différés répartis proportionnellement entre les nations créancières"
 GRE_prospecting_category: "Prospection des ressources grecques"
 GRE_prospecting_category_desc: "Nos enquêtes géologiques ont identifié des gisements minéraux prometteurs à travers le continent et les îles grecques. Avec la bonne technologie d'excavation et l'infrastructure, nous pouvons en faire des mines productives."
 GRE_prospecting_unlocked_tt: "Débloque les décisions de prospection de ressources"
 GRE_halkidiki_prospecting: "Expansion minière de Halkidiki"
 GRE_halkidiki_prospecting_desc: "La péninsule de Chalcidique, dans le nord de la Grèce, recèle d'importants gisements de chrome et d'or. Les districts miniers de Skouries et Stratoni peuvent être étendus avec des techniques d'excavation modernes."
 GRE_peloponnese_bauxite: "Extraction de bauxite du Péloponnèse"
 GRE_peloponnese_bauxite_desc: "Les mines de Distomon et le district de Fokis contiennent d'importantes réserves de bauxite. Une extraction progressive peut alimenter notre industrie de l'aluminium pendant des décennies."
 GRE_thessaly_mining: "Extraction de nickel en Thessalie"
 GRE_thessaly_mining_desc: "Les gisements de latérite de nickel de Larymna en Thessalie représentent l'une des plus grandes réserves de nickel d'Europe. Une extraction systématique livrera de l'acier et des sous-produits de chrome."
 GRE_aegean_mining: "Extraction minérale des îles de la mer Égée"
 GRE_aegean_mining_desc: "Les îles volcaniques de l'Égée, en particulier Milos et Naxos, contiennent des gisements de bentonite, perlite et émeri commercialement exploitables."
 GRE_pipeline_infrastructure: "Infrastructures de gazoducs"
 GRE_pipeline_infrastructure_desc: "Un réseau de pipelines reliant les sites de prospection aux raffineries et consommateurs industriels existants rend l'extraction commercialement viable et rattache le secteur des ressources au réseau énergétique grec plus large."
 greece.28.t: "Proposition d'investissement industriel chinois"
 greece.28.d: "[FROM.GetName] nous a approchés pour investir dans leur base industrielle. Ils proposent que nous financions la construction d'une usine en Thessalie en échange d'une influence commerciale sur leur économie en croissance."
 greece.28.a: "Un investissement judicieux"
 greece.28.b: "Nous n'avons aucun intérêt pour l'industrie grecque"
 greece.29.t: "Investissement chinois accepté"
 greece.29.d: "La Chine a accepté de financer notre expansion industrielle en Thessalie. Une nouvelle usine sera construite avec des capitaux chinois, approfondissant nos liens économiques avec Pékin."
 greece.29.a: "Excellente nouvelle"
 greece.30.t: "Investissement chinois refusé"
 greece.30.d: "La Chine a décliné notre proposition d'investissement industriel. Nous pouvons encore procéder à la construction nous-mêmes, bien que ce soit à nos frais."
 greece.30.a: "Nous le financerons nous-mêmes"
 greece.30.b: "Le projet n'est pas viable sans capitaux étrangers"
 greece.31.t: "Proposition d'investissement au port du Pirée"
 greece.31.d: "[FROM.GetName] propose un investissement chinois dans le port du Pirée. COSCO Shipping acquerrait une participation de contrôle dans l'autorité portuaire, finançant d'importantes modernisations d'infrastructure en échange du contrôle commercial de l'un des ports les plus fréquentés de Méditerranée."
 greece.31.a: "Le Pirée est un atout stratégique qui mérite d'être investi"
 greece.31.b: "Nous n'investirons pas dans les ports grecs"
 greece.32.t: "COSCO acquiert la participation du Pirée"
 greece.32.d: "La Chine a accepté d'investir au Pirée. COSCO Shipping financera l'expansion du port, ajoutant de la capacité de chantier et des infrastructures. L'influence chinoise dans notre économie croît, mais aussi notre capacité portuaire."
 greece.32.a: "Le port prospérera"
 greece.33.t: "La Chine refuse d'investir au Pirée"
 greece.33.d: "La Chine a refusé d'investir au Pirée. Nous pouvons encore moderniser le port nous-mêmes, mais sans capitaux chinois le coût retombe entièrement sur notre Trésor."
 greece.33.a: "Nous moderniserons le Pirée nous-mêmes"
 greece.33.b: "Le port peut attendre"
 greece.34.t: "Proposition de développement immobilier grec"
 greece.34.d: "[FROM.GetName] nous a approchés pour développer l'immobilier commercial en Attique. Des promoteurs chinois financeraient la construction de centres commerciaux, hôtels et immeubles de bureaux en échange de baux de long terme et d'une présence commerciale."
 greece.34.a: "L'immobilier grec est un investissement attractif"
 greece.34.b: "Nous ne sommes pas intéressés par l'immobilier grec"
 greece.35.t: "Investissement immobilier chinois accepté"
 greece.35.d: "Des promoteurs chinois financeront d'importants projets de construction à travers l'Attique. Une nouvelle capacité commerciale et résidentielle transformera la région, bien que la présence commerciale chinoise croisse nettement."
 greece.35.a: "Début des travaux"
 greece.36.t: "La Chine refuse l'investissement immobilier"
 greece.36.d: "La Chine a refusé d'investir dans notre secteur immobilier. Nous pouvons encore procéder au développement avec des capitaux intérieurs."
 greece.36.a: "Nous le développerons nous-mêmes"
 greece.36.b: "Le développement peut attendre"
 greece.37.t: "Proposition d'investissement d'infrastructures à l'échelle nationale"
 greece.37.d: "[FROM.GetName] propose un programme d'infrastructure complet à travers la Grèce. Des entreprises d'État chinoises financeraient aéroports, usines et construction de bureaux à l'échelle nationale en échange d'une influence commerciale substantielle."
 greece.37.a: "La Grèce est mûre pour le développement"
 greece.37.b: "La portée de cette proposition nous inquiète"
 greece.38.t: "Investissement chinois à l'échelle nationale accepté"
 greece.38.d: "La Chine s'est engagée dans un programme d'infrastructure national. De nouveaux aéroports, usines et immeubles commerciaux seront construits à travers la Grèce aux frais de la Chine."
 greece.38.a: "Un partenariat transformateur"
 greece.39.t: "La Chine refuse l'investissement à l'échelle nationale"
 greece.39.d: "La Chine a décliné notre proposition d'investissement national. Nous pouvons encore construire l'infrastructure nous-mêmes, bien que le coût soit considérable."
 greece.39.a: "Nous le construirons nous-mêmes"
 greece.39.b: "Trop coûteux sans soutien étranger"
 greece.40.t: "Proposition de développement d'Elliniko"
 greece.40.d: "[FROM.GetName] propose un investissement chinois sur le site de l'ancien aéroport international d'Elliniko. L'énorme projet de développement côtier transformerait des pistes abandonnées en un quartier urbain moderne, avec des améliorations d'infrastructure à travers l'Attique et le Péloponnèse."
 greece.40.a: "Le projet Elliniko a un grand potentiel"
 greece.40.b: "Nous n'investirons pas dans ce projet"
 greece.41.t: "Investissement chinois à Elliniko accepté"
 greece.41.d: "La Chine a accepté de financer le projet de réaménagement d'Elliniko. Les améliorations d'infrastructure s'étendront à l'Attique et au Péloponnèse."
 greece.41.a: "Un projet historique démarre"
 greece.42.t: "La Chine refuse l'investissement à Elliniko"
 greece.42.d: "La Chine a refusé d'investir dans le réaménagement d'Elliniko. Nous pouvons encore procéder avec nos propres fonds, ou mettre les plans de côté."
 greece.42.a: "Nous le financerons nous-mêmes"
 greece.42.b: "Mettre le projet de côté pour l'instant"
 greece.46.t: "Demande de prêt ICBC"
 greece.46.d: "[FROM.GetName] s'est adressé à la Banque industrielle et commerciale de Chine pour un prêt substantiel. Ils proposent que l'ICBC accorde un crédit égal à 10 % de leur PIB, approfondissant nos liens financiers avec Athènes et étendant la présence bancaire chinoise en Méditerranée."
 greece.46.a: "Accorder le prêt"
 greece.46.b: "Le risque est trop grand"
 greece.47.t: "Prêt ICBC approuvé"
 greece.47.d: "La Banque industrielle et commerciale de Chine a approuvé notre demande de prêt. Les capitaux chinois affluent dans notre Trésor, fournissant une injection importante de fonds. Notre dépendance financière à Pékin s'approfondit, mais le soulagement immédiat est bienvenu."
 greece.47.a: "Les fonds sont assurés"
 greece.48.t: "Prêt ICBC refusé"
 greece.48.d: "La Chine a refusé d'accorder un prêt ICBC. Sans le soutien bancaire chinois, nous devons chercher d'autres sources de capital ou nous gérer avec nos moyens existants."
 greece.48.a: "Nous nous en sortirons"
 GRE_drydock_modernization: "Modernisation des cales sèches"
 GRE_drydock_modernization_desc: "L'investissement dans des cales sèches modernes a étendu la capacité de réparation et de construction navales, permettant à la marine hellénique de moderniser sa flotte plus efficacement."
 GRE_strategic_autonomy_idea: "Autonomie stratégique"
 GRE_strategic_autonomy_idea_desc: "Redevable à aucun bloc unique, la Grèce commerce et négocie avec tous. La liberté de jouer chaque camp livre de meilleurs termes et une certaine isolation face à la pression des grandes puissances."
 GRE_euro_adopted: "Adoption de l'euro"
 GRE_euro_adopted_desc: "L'adoption de l'euro a intégré l'économie grecque à la zone euro plus large, réduisant les coûts d'emprunt et facilitant le commerce au prix d'une politique monétaire indépendante."
 GRE_manpads_expansion_idea: "Extension des MANPADS"
 GRE_manpads_expansion_idea_desc: "Un programme élargi de systèmes de défense aérienne portables a amélioré la capacité antiaérienne et réduit les coûts de production grâce à la recherche et fabrication intérieures."
 GRE_port_modernization: "Modernisation portuaire"
 GRE_port_modernization_desc: "Des infrastructures portuaires modernisées ont étendu la capacité des chantiers et amélioré l'efficacité de la construction navale dans les chantiers grecs."
 GRE_research_hubs_idea: "Pôles de recherche militaire"
 GRE_research_hubs_idea_desc: "Des centres de recherche militaire dédiés ont été établis pour accélérer le développement de technologies de défense et l'innovation des systèmes d'armes."
 GRE_research_hubs_idea_2: "Pôles de recherche avancés"
 GRE_research_hubs_idea_2_desc: "L'expansion du programme de pôles de recherche englobe désormais la technologie spatiale aux côtés des applications militaires, élargissant la frontière technologique de la Grèce."
 GRE_greater_state_control_authoritarian: "Contrôle étatique autoritaire"
 GRE_greater_state_control_authoritarian_desc: "L'État a pris le contrôle direct de secteurs économiques clés, accélérant la construction au prix de la liberté politique et de la flexibilité bureaucratique."
 GRE_com_liberators: "Libérateurs du peuple"
 GRE_com_liberators_desc: "La ferveur révolutionnaire parcourt les rangs. Les soldats qui combattent sur le sol natal sont enhardis par la cause, frappant plus fort et tenant plus ferme pour défendre la révolution."
 GRE_western_outreach: "Sensibilisation à l'Ouest"
 GRE_western_outreach_desc: "La diplomatie grecque mène une campagne ciblée d'ouvertures bilatérales et multilatérales à travers l'OTAN et l'Union européenne. Engagement occidental : [?GRE_western_commitment|0]"
 GRE_franco_hellenic_strategic_partnership: "Partenariat stratégique franco-hellénique"
 GRE_franco_hellenic_strategic_partnership_desc: "Le partenariat stratégique de 2021 a débloqué une coopération militaro-industrielle profonde avec la France. Les usines d'armes grecques tournent selon des standards partagés, des bonus de recherche français affluent dans nos programmes militaires, et la coordination politique s'est resserrée."
 GRE_franco_greek_mutual_defense: "Clause de défense mutuelle franco-grecque"
 GRE_franco_greek_mutual_defense_desc: "L'article 2 du partenariat rehaussé engage la France à la défense du territoire grec. La clause souscrit la sécurité grecque en termes continentaux et lie deux des plus grandes armées de Méditerranée en une seule unité stratégique."
 GRE_eastmed_trilateral_idea: "Trilatéral GRE-ISR-CYP"
 GRE_eastmed_trilateral_idea_desc: "Déclarations conjointes, exercices conjoints et renseignement mis en commun ont soudé les trois marines et armées de l'air en un seul espace opérationnel à travers le bassin de Méditerranée orientale."
 GRE_eastmed_gas_forum_idea: "Membre du Forum sur le gaz EastMed"
 GRE_eastmed_gas_forum_idea_desc: "Le shipping grec transite par des couloirs préférentiels, les flux gaziers régionaux enrichissent raffineries et chantiers grecs, et Athènes garde un siège permanent à la table énergétique East-Med."
 GRE_3plus1_pact: "Dialogue stratégique 3+1"
 GRE_3plus1_pact_desc: "L'engagement américain couronne le trilatéral East-Med. Exercices conjoints, échange de renseignement et dialogue stratégique structuré relèvent la capacité opérationnelle des forces armées grecques dans les domaines maritime et aérien."
 GRE_eu_political_anchor_idea: "Membre fondateur de l’UE"
 GRE_eu_political_anchor_idea_desc: "La Grèce exerce le poids politique d'un membre fondateur de l'UE, tirant bénéfice du commerce intra-bloc et façonnant l'agenda de Bruxelles depuis une position d'ancienneté."
 GRE_eu_strategic_compass_idea: "Promoteur de la boussole stratégique de l'UE"
 GRE_eu_strategic_compass_idea_desc: "La diplomatie grecque fait avancer la Boussole stratégique européenne, appelant à l'autonomie face à l'aventurisme des grandes puissances extérieures tout en liant toujours plus étroitement la base militaro-industrielle de l'UE."
 greece.556.t: "La réaffirmation occidentale"
 greece.556.d: "La Grèce annonce une réaffirmation complète de son alignement occidental, ouvrant une campagne soutenue d'ouvertures bilatérales et multilatérales à travers l'OTAN et l'Union européenne. Athènes signale, aux alliés comme aux rivaux, que son avenir stratégique est fermement ancré à l'Occident."
 greece.556.a: "Une reformulation bienvenue"
 greece.556.b: "La Grèce tient la ligne"
 greece.556.c: "Prendre note"
 greece.557.t: "Proposition grecque : partenariat stratégique"
 greece.557.d: "Athènes propose un partenariat stratégique complet couvrant la coopération militaro-industrielle, l'alignement de politique étrangère et la sécurité en Méditerranée orientale. Le gouvernement grec est prêt à engager un capital politique substantiel pour en faire un fleuron de la politique méditerranéenne française."
 greece.557.a: "Signer le partenariat"
 greece.557.b: "Décliner la proposition"
 greece.558.t: "La France accepte le partenariat"
 greece.558.d: "Paris accepte le partenariat stratégique. Des groupes de travail conjoints se mettent immédiatement en place sur la coopération militaro-industrielle, l'expertise française affluent dans les usines d'armes et programmes de recherche grecs. Le partenariat est présenté comme un modèle de coopération bilatérale européenne."
 greece.558.a: "Un accord historique"
 greece.559.t: "[FROM.GetName] décline le partenariat"
 greece.559.d: "[FROM.GetName] informe Athènes, avec discrétion diplomatique, que le partenariat ne peut aller de l'avant. Le coût politique reste réel."
 greece.559.a: "Un revers regrettable"
 greece.560.t: "Proposition grecque : Trilatérale de la Méditerranée orientale"
 greece.560.d: "Athènes propose un cadre trilatéral formel avec Israël et Chypre : exercices conjoints, renseignement mis en commun et positions diplomatiques coordonnées. L'arrangement convertirait une coopération de longue date en une forme institutionnelle contraignante."
 greece.560.a: "Signer le trilatéral"
 greece.560.b: "Décliner la proposition"
 greece.561.t: "Israël rejoint le trilatéral"
 greece.561.d: "Israël signe le cadre trilatéral. Des cellules de planification conjointes se mettent en place au niveau opérationnel, et les arrangements de partage du renseignement israélien sont étendus aux homologues grecs."
 greece.561.a: "Accueillir nos partenaires"
 greece.563.t: "Proposition grecque : Trilatérale de la Méditerranée orientale"
 greece.563.d: "Athènes propose le cadre trilatéral formel avec Chypre et Israël. Pour Nicosie l'offre est essentiellement automatique, mais la signature formelle doit encore venir."
 greece.563.a: "Bien sûr que nous signons"
 greece.563.b: "Retenir pour examen complémentaire"
 greece.564.t: "Chypre rejoint le trilatéral"
 greece.564.d: "Nicosie signe le cadre trilatéral avec Athènes et Jérusalem. Les trois gouvernements opèrent désormais sous un parapluie diplomatique et opérationnel unifié à travers la Méditerranée orientale."
 greece.564.a: "Une Méditerranée orientale unifiée"
 greece.566.t: "Proposition grecque : clause de défense mutuelle de l'article 2"
 greece.566.d: "Athènes propose la conclusion naturelle du partenariat stratégique : une clause de défense mutuelle contraignante calquée sur l'article 5, inscrite directement dans le traité bilatéral. L'intégrité territoriale grecque serait pour la première fois garantie par une grande puissance européenne en termes de traité."
 greece.566.a: "Signer la clause de défense mutuelle"
 greece.566.b: "Refuser. Trop loin, trop vite."
 greece.567.t: "La France signe la clause de défense mutuelle"
 greece.567.d: "Paris signe. L'article 2 du traité rehaussé engage la France à la défense du territoire grec. L'onde de choc diplomatique dépasse largement la Méditerranée."
 greece.567.a: "Une nouvelle ère de sécurité européenne"
 greece.568.t: "La France refuse la clause de défense mutuelle"
 greece.568.d: "Paris refuse la clause de défense mutuelle comme un pas trop loin pour la doctrine stratégique française actuelle. Le partenariat existant demeure, mais la garantie de sécurité contraignante ne se matérialisera pas."
 greece.568.a: "Un sérieux revers"
 greece.569.t: "Proposition grecque : dialogue stratégique 3+1"
 greece.569.d: "Athènes, Nicosie et Jérusalem proposent conjointement de formaliser le dialogue stratégique 3+1 avec les États-Unis, un cadre adossé au Département d'État couvrant sécurité énergétique, coopération maritime et contre-terrorisme en Méditerranée orientale."
 greece.569.a: "S'engager dans le dialogue"
 greece.569.b: "Différer les fiançailles"
 greece.570.t: "Les États-Unis s'engagent dans le 3+1"
 greece.570.d: "Washington s'engage formellement dans le dialogue stratégique 3+1. Les engagements américains d'entraînement et d'exercices s'étendent à travers la Méditerranée orientale, et les forces armées grecques accèdent à un nouveau palier d'expérience opérationnelle conjointe."
 greece.570.a: "Un partenariat indispensable"
 greece.571.t: "Les États-Unis reportent leur engagement"
 greece.571.d: "Le Département d'État signale que des priorités stratégiques plus larges absorbent l'attention américaine. Le cadre 3+1 n'est pas abandonné, mais la montée en grade formelle n'aura pas lieu dans le cycle actuel."
 greece.571.a: "Nous y reviendrons plus tard"
 greece.572.t: "Grèce : pilier de l'Occident"
 greece.572.d: "Traités, déclarations et partenariats successifs ont transformé la Grèce d'un membre périphérique de l'OTAN en une colonne porteuse de la diplomatie occidentale en Méditerranée orientale. Athènes parle désormais d'une position de poids structurel à Bruxelles comme à Washington."
 greece.572.a: "Pilier de l'Occident"
 greece.572.b: "Un allié restauré"
 greece.572.c: "Une nouvelle géométrie stratégique"
 greece.575.t: "Le FSRU d'Alexandroupolis est mis en ligne"
 greece.575.d: "L'unité flottante de stockage et de regazéification amarrée à Alexandroupolis a commencé son exploitation commerciale, ancrant le pivot de l'Europe du Sud-Est hors du gazoduc russe. Le sol grec est désormais un point d'entrée de l'approvisionnement énergétique du continent."
 greece.575.a: "Athènes allume la lampe"
 greece.575.b: "Un nouveau nœud utile"
 greece.577.t: "Le Pirée ancre le corridor IMEC"
 greece.577.d: "Des chefs d'État à Delhi, Riyad et Bruxelles ont confirmé le Pirée comme terminus européen du corridor économique Inde-Moyen-Orient-Europe. Les volumes de transbordement via l'Attique devraient tripler sur la décennie."
 greece.577.a: "De l'Égée à l'océan Indien"
 greece.577.b: "Une étape logistique"
 greece.580.t: "Proposition grecque : feuille de route de coopération de Prespa"
 greece.580.d: "Athènes propose une feuille de route structurée pour étendre l'accord de Prespa : groupes de travail sectoriels, un arrangement de libre-échange et une planification d'infrastructure conjointe. Le paquet lierait nos économies pour une génération."
 greece.580.a: "Skopje est prête à s'appuyer sur Prespa"
 greece.580.b: "Nous n'irons pas au-delà du cadre existant"
 greece.581.t: "La Macédoine du Nord entérine la feuille de route"
 greece.581.d: "Skopje a signé la feuille de route de coopération de Prespa. Les groupes de travail se réuniront à Thessalonique dans les semaines, et un arrangement de libre-échange est désormais à portée."
 greece.581.a: "Excellente nouvelle"
 greece.582.t: "Proposition grecque : cadre des droits des minorités"
 greece.582.d: "Athènes propose un cadre formel sur les droits de la communauté hellénophone du sud de l'Albanie : écoles de langue, restitution des biens et coopération culturelle transfrontalière, en échange de liens bilatéraux plus chauds."
 greece.582.a: "Tirana accepte le cadre"
 greece.582.b: "Nous ne pouvons pas accepter ces termes"
 greece.583.t: "L'Albanie signe le cadre des minorités"
 greece.583.d: "L'accord est signé à Tirana. Les communautés hellénophones du sud de l'Albanie reçoivent des protections concrètes, et les canaux ministériels avec Athènes s'approfondissent en conséquence."
 greece.583.a: "Un gain diplomatique"
 greece.584.t: "Proposition grecque : Accord sur la ZEE de la Méditerranée orientale"
 greece.584.d: "Athènes propose une délimitation bilatérale de zone économique exclusive avec Le Caire. L'accord réglerait les revendications maritimes qui se chevauchent et exclurait des acteurs rivaux du développement conjoint des ressources du fond marin."
 greece.584.a: "Le Caire signe l'accord"
 greece.584.b: "Le Caire décline pour l'instant"
 greece.585.t: "L'Égypte ratifie l'accord de ZEE"
 greece.585.d: "L'Égypte a ratifié la délimitation maritime. Des enquêtes conjointes de la zone délimitée commencent dans le mois, et des clauses commerciales liées à l'accord entrent en vigueur."
 greece.585.a: "Un accord fondateur"
 greece.586.t: "Proposition grecque : axe méditerranéen italo-hellénique"
 greece.586.d: "Athènes propose un partenariat complet avec Rome : politique industrielle coordonnée, programmes de chantiers partagés et positions alignées sur la sécurité méditerranéenne. Les deux péninsules agiraient comme une seule à Bruxelles."
 greece.586.a: "Rome accepte le partenariat"
 greece.586.b: "Rome refuse poliment"
 greece.587.t: "L'Italie rejoint l'axe méditerranéen"
 greece.587.d: "L'Italie a signé le document de partenariat. Des comités industriels conjoints et un cadre de coproduction navale se réunissent à Athènes dans le trimestre."
 greece.587.a: "Un axe est né"
 greece.588.t: "Proposition grecque : extension du pipeline IGB"
 greece.588.d: "Athènes propose une expansion par phases de l'interconnexion Grèce-Bulgarie et du terminal d'Alexandroupolis lié. Sofia gagnerait un approvisionnement gazier diversifié ; Athènes capturerait des recettes de transit à travers les Balkans."
 greece.588.a: "Sofia signe le plan d'expansion"
 greece.588.b: "Sofia rejette la proposition"
 greece.589.t: "La Bulgarie donne le feu vert à l'expansion du gazoduc"
 greece.589.d: "Sofia a approuvé l'expansion. La construction doit commencer dans la saison ; les flux de gaz vers le nord en Bulgarie et vers le sud via les terminaux grecs devraient doubler."
 greece.589.a: "Un corridor stratégique"
 greece.590.t: "Proposition grecque : conseil stratégique helléno-saoudien"
 greece.590.d: "Athènes propose un Conseil suprême de coopération stratégique avec Riyad : coopération militaro-industrielle, co-investissement de fonds souverains et dialogue ministériel régulier. Le Royaume gagnerait un partenaire méditerranéen ; la Grèce gagnerait des capitaux."
 greece.590.a: "Riyad accepte"
 greece.590.b: "Riyad décline"
 greece.591.t: "L'Arabie saoudite convoque le Conseil"
 greece.591.d: "Le Conseil suprême de coopération stratégique tient sa réunion inaugurale à Athènes. Les fonds souverains saoudiens annoncent une première tranche d'investissement dans l'industrie grecque."
 greece.591.a: "Un partenariat historique"
 greece.592.t: "Proposition grecque : pacte d'investissement helléno-émirati"
 greece.592.d: "Athènes propose un pacte d'investissement structuré avec Abou Dabi : traitement fiscal des fonds émiratis, accès aux zones franches en Attique, et investissement grec réciproque dans le réseau logistique du Golfe."
 greece.592.a: "Abou Dhabi accepte"
 greece.592.b: "Abou Dhabi décline"
 greece.593.t: "Les Émirats arabes unis signent le pacte"
 greece.593.d: "Abou Dabi a signé le pacte. Les capitaux émiratis commencent à affluer dans la logistique et l'industrie grecques, et les entreprises grecques gagnent un accès préférentiel aux infrastructures de hub du Golfe."
 greece.593.a: "Excellent"
 greece.594.t: "Proposition grecque : adhésion au Forum gazier EastMed"
 greece.594.d: "Athènes propose qu'Amman rejoigne le Forum gazier de Méditerranée orientale, la Grèce parrainant son adhésion. Une architecture énergétique régionale s'étendant du Levant à l'Égée émergerait."
 greece.594.a: "Amman accepte l'invitation"
 greece.594.b: "Amman refuse"
 greece.595.t: "La Jordanie rejoint le Forum gazier EastMed"
 greece.595.d: "La Jordanie a officialisé son adhésion au Forum gazier EastMed. La portée géographique et politique de l'institution s'étend désormais de façon décisive à travers le bassin de Méditerranée orientale."
 greece.595.a: "Une victoire diplomatique"
 GRE_lobby_eu_partners: "Faire pression sur les partenaires de l’UE"
 GRE_lobby_eu_partners_desc: "Dépenser du capital politique dans une campagne de lobbying soutenue au sein de l'Union européenne : visites bilatérales, notes de position et échanges de concessions, pour faire avancer les priorités diplomatiques grecques et accumuler de l'engagement occidental."
 GRE_eastern_alignment_score: "Alignement oriental grec"
 GRE_eastern_alignment_score_tt: "$GRE_eastern_alignment_score$ : $RIGHT|+=0Y$"
 GRE_aegean_tension: "Tension égéenne"
 GRE_aegean_tension_tt: "§HTension de la mer Égée§! : §Y[?GRE_aegean_tension|+=0]§!/100"
 GRE_cyprus_momentum: "L’élan de Chypre"
 GRE_cyprus_momentum_tt: "§HÉlan chypriote§! : §Y[?GRE_cyprus_momentum|+=0]§!/100"
 GRE_tension_change: "§Y[GRE.GetFlag][CYP.GetFlag]Tension égéenne[TUR.GetFlag][NCY.GetFlag]§!"
 GRE_tension_change_tt: "$GRE_tension_change$ : $RIGHT|-=0$"
 GRE_momentum_change: "§Y[GRE.GetFlag][CYP.GetFlag]Élan chypriote[TUR.GetFlag][NCY.GetFlag]§!"
 GRE_momentum_change_tt: "$GRE_momentum_change$ : $RIGHT|+=0$"
 GRE_confederation_all_done_TT: "§BLes trois décisions de confédération sont tranchées§!"
 GRE_cyprus_momentum_high_TT: "§BÉlan de Chypre supérieur à §H+70§!§!"
 GRE_cyprus_momentum_mid_TT: "§BÉlan de Chypre supérieur à §H+40§!§!"
 GRE_aegean_tension_low_TT: "§BTension en mer Égée inférieure à §H40§!§!"
 GRE_eastern_vars_initialized: "Piste de la Fraternité de l'Est initialisée"
 GRE_migration_deal_active: "La coopération migratoire avec la Turquie est active"
 GRE_assertive_patrols: "Le régime de patrouilles affirmées en mer Égée est actif"
 GRE_lost_continental_shelf_claims: "A cédé à la Turquie ses revendications sur le plateau continental"
 GRE_aegean_de_escalation: "A reculé devant l'ultimatum turc"
 GRE_confederation_active: "La chaîne de décisions de confédération est active"
 GRE_confederation_autonomy_done: "Accord sur la structure d'autonomie de la Confédération"
 GRE_confederation_economy_done: "Répartition économique de la confédération convenue"
 GRE_confederation_security_done: "Cadre de sécurité de la confédération convenu"
 GRE_defending_sovereignty: "Défendre la souveraineté grecque"
 GRE_defending_sovereignty_desc: "Une posture de préparation militaire soutenue, axée sur la dissuasion de l'empiètement turc en Égée et sur Chypre. La marine et l'armée de l'air helléniques maintiennent une vigilance accrue, et les dépenses de défense consomment des ressources qui iraient autrement aux biens de consommation. Cette dissuasion ciblée renforce la détermination grecque mais impose un coût économique."
 GRE_aegean_naval_supremacy: "Suprématie navale égéenne"
 GRE_aegean_naval_supremacy_desc: "Des patrouilles déployées en avant et une présence de surface permanente donnent à la marine hellénique l'avantage dans les eaux contestées de l'Égée."
 GRE_migration_cooperation_idea: "Pacte migratoire UE-Turquie"
 GRE_migration_cooperation_idea_desc: "La Turquie traite les flux migratoires sur son propre territoire en échange de concessions grecques et européennes, allégeant la pression sur les îles de l'Égée."
 GRE_migration_crisis_idea: "Crise migratoire"
 GRE_migration_crisis_idea_desc: "La Turquie s'est retirée du pacte migratoire, envoyant de nouvelles vagues d'arrivées à travers l'Égée et submergeant les structures d'accueil grecques."
 GRE_confederation_category: "Confédération de Chypre"
 GRE_confederation_category_desc: "Trancher les questions structurelles de la confédération chypriote proposée : autonomie, répartition économique et sécurité."
 GRE_eastern_missions_category: "Missions de la Fraternité de l'Est"
 GRE_eastern_missions_category_desc: "Défis de politique récurrents nés des pistes égéenne et chypriote."
 GRE_decide_autonomy_level: "Décider de l’autonomie de la Confédération"
 GRE_decide_autonomy_level_desc: "Décider si le nouvel État adoptera un modèle fédéral à institutions centrales fortes, ou une confédération plus lâche accordant à chaque communauté une large autonomie."
 GRE_decide_economic_distribution: "Décider de la répartition économique"
 GRE_decide_economic_distribution_desc: "Décider si le budget fédéral sera réparti à parité entre les deux communautés, ou pondéré par la contribution au PIB."
 GRE_decide_security_guarantees: "Décider des garanties de sécurité"
 GRE_decide_security_guarantees_desc: "Décider si l'État réunifié relèvera du parapluie de sécurité de l'OTAN, ou poursuivra une posture de défense neutre."
 GRE_aegean_dialogue_mission: "Dialogue égéen"
 GRE_aegean_dialogue_mission_desc: "Tous les six mois, les négociateurs grecs et turcs doivent décider jusqu'où pousser leurs revendications respectives. La mission s'achève si le dialogue bascule en confrontation ouverte ou en guerre."
 greece.700.t: "Dialogue égéen : Bilan semestriel"
 greece.700.d: "Le dernier round de négociations a atteint une fourche familière. Les homologues turcs poussent à des concessions grecques partielles sur le plateau continental en échange d'une désescalade supplémentaire. Tenir ferme préserve nos revendications, mais les esprits s'échaufferont."
 greece.700.a: "Offrir des concessions mesurées"
 greece.700.b: "Tenir la ligne"
 greece.701.t: "Ankara quitte le pacte migratoire"
 greece.701.d: "Citant la posture diplomatique grecque, les autorités turques ont suspendu la coopération sur les retours et le traitement des migrants. De nouvelles arrivées sont déjà signalées sur les îles de l'Égée ; les centres d'accueil font face à une crise en quelques semaines."
 greece.701.a: "Se préparer à l'afflux"
 greece.702.t: "Incident égéen"
 greece.702.d: "Une patrouille turque a pénétré l'espace aérien revendiqué par la Grèce cette nuit. Des intercepteurs helléniques sont intervenus. Aucun coup de feu n'a été tiré, mais les distances de rapprochement étaient dangereusement courtes. Il faut maintenant décider si l'on désamorce ou si l'on pousse plus fort."
 greece.702.a: "Désamorcer"
 greece.702.b: "Faire monter la réponse"
 greece.703.t: "Ankara renforce Chypre du Nord"
 greece.703.d: "Les médias d'État turcs ont confirmé un soutien élargi à l'administration de Chypre du Nord. Le geste paraît calibré plutôt que provocateur, un signal qu'Athènes ne peut poursuivre Chypre selon ses propres termes."
 greece.703.a: "Noter pour le dossier"
 greece.704.t: "Crise gazière en Méditerranée orientale"
 greece.704.d: "Des navires de forage turcs sont entrés dans des eaux que la Grèce et Chypre considèrent comme zone économique exclusive. Athènes doit décider si elle désamorce la confrontation ou tient le terrain au risque d'une confrontation plus large."
 greece.704.a: "Céder du terrain pour l'instant"
 greece.704.b: "Tenir le terrain"
 greece.705.t: "Ultimatum turc"
 greece.705.d: "Ankara a lancé un avertissement sévère : toute action grecque continue sur Chypre sera rencontrée par des conséquences non spécifiées mais tangibles. Le ministère des Affaires étrangères doit répondre."
 greece.705.a: "Reculer du bord"
 greece.705.b: "Refuser de se laisser intimider"
 greece.706.t: "Incident de routine dans l’espace aérien"
 greece.706.d: "Un autre survol turc a été enregistré et protesté par les canaux habituels. Le schéma continue, ni l'un ni l'autre ne souhaitant l'escalade, ni l'un ni l'autre n'étant prêt à reculer."
 greece.706.a: "Déposer la protestation"
 greece.710.t: "Confédération : question d'autonomie"
 greece.710.d: "Les négociateurs ont posé deux modèles sur la table : un arrangement fédéral à institutions centrales fortes, ou une confédération qui délègue la plupart des pouvoirs aux communautés. Le choix définira le caractère du nouvel État."
 greece.710.a: "Modèle fédéral"
 greece.710.b: "Modèle confédéral"
 greece.711.t: "Confédération : répartition économique"
 greece.711.d: "Comment les recettes fédérales seront-elles partagées ? Une stricte parité rassure la plus petite communauté, mais une formule pondérée par le PIB reflète la réalité économique et serait plus facile à défendre au pays."
 greece.711.a: "Répartition paritaire"
 greece.711.b: "Répartition pondérée par le PIB"
 greece.712.t: "Confédération : cadre de sécurité"
 greece.712.d: "L'État réunifié relèvera-t-il du parapluie de l'OTAN, ou adoptera-t-il une posture de défense neutre ? Chaque voie a ses partisans à Athènes et à Nicosie."
 greece.712.a: "Parapluie de sécurité de l'OTAN"
 greece.712.b: "Posture de défense neutre"
 greece.720.t: "Revendications d'union chypriote"
 greece.720.d: "Après des mois de manœuvres diplomatiques et de pression sur la Turquie, Athènes est prête à formuler des exigences formelles pour l'union de Chypre et de Chypre du Nord avec la Grèce. La Grèce a cultivé un soutien suffisant parmi la population chypriote grecque et, si la Turquie a reculé sous la pression internationale, la direction chypriote du Nord pourrait aussi être persuadée. L'heure de vérité est arrivée."
 greece.720.a: "Formuler les exigences"
 greece.721.t: "La guerre revient à Chypre"
 greece.721.d: "Un ou les deux gouvernements chypriotes ont refusé les exigences grecques d'union, et un conflit militaire est imminent. Ankara a lancé des condamnations et avertissements furieux. L'armée turque maintient une posture de préparation mais ne s'est pas engagée directement. La communauté internationale observe tendue pour voir si Athènes engagera ses propres forces armées ou poursuivra un soutien clandestin."
 greece.721.a: "Noter la réaction"
 greece.722.t: "Jusqu'où ira Athènes ? (Chypre)"
 greece.722.d: "La République de Chypre a rejeté l'exigence d'union et un conflit militaire est imminent. Nous pouvons armer et ravitailler les forces chypriotes grecques pro-union dans l'ombre avec des volontaires et du matériel, ou engager ouvertement les forces armées helléniques pour imposer l'annexion. La première option garde la Grèce dans les bonnes grâces de l'OTAN. La seconde met des soldats grecs au combat, exige de quitter l'alliance, et peut déclencher une intervention turque directe. Mais elle garantit aussi une conquête rapide et l'intégration du sud de l'île."
 greece.722.a: "Volontaires et matériel seulement"
 greece.722.b: "Engager les forces armées helléniques ; déclarer la guerre à Chypre"
 greece.730.t: "Pression de l'OTAN sur la Turquie"
 greece.730.d: "Athènes s'approche d'un allié de l'OTAN, demandant qu'il utilise les canaux diplomatiques pour persuader la Turquie de modérer sa posture agressive en Égée. Une telle pression d'une puissance occidentale pourrait persuader Ankara de reconsidérer sa position."
 greece.730.a: "Se tenir aux côtés d'Athènes"
 greece.730.b: "Ce n'est pas notre querelle"
 greece.731.t: "Soutien allié assuré"
 greece.731.d: "Notre partenaire de l'OTAN a accepté d'engager Ankara sur la question des tensions en Égée. Le soutien diplomatique de l'Occident devrait aider à apaiser la confrontation et à justifier notre posture assertive."
 greece.731.a: "Une victoire diplomatique"
 greece.732.t: "Notre demande déclinée"
 greece.732.d: "L'allié de l'OTAN a poliment refusé d'entrer en pourparlers directs avec la Turquie sur les litiges égéens. Ils préfèrent rester neutres sur les questions maritimes bilatérales."
 greece.732.a: "Nous restons résolus"
 greece.733.t: "Intégration économique chypriote proposée"
 greece.733.d: "Athènes propose une intégration économique profonde avec la République de Chypre, y compris une union douanière, une harmonisation bancaire et une politique énergétique coordonnée. De tels liens lieraient étroitement l'île à l'économie grecque tout en relevant le niveau de vie à Nicosie."
 greece.733.a: "S'intégrer à la Grèce"
 greece.733.b: "Préserver notre autonomie"
 greece.734.t: "Chypre accepte l'intégration"
 greece.734.d: "Nicosie a embrassé la proposition. Entreprises grecques et chypriotes harmonisent désormais les réglementations, les systèmes bancaires se consolident, et l'investissement partagé circule à travers l'Égée. L'union économique renforce la main d'Athènes dans tout futur règlement politique."
 greece.734.a: "L’unité génère la prospérité"
 greece.735.t: "Chypre refuse une intégration profonde"
 greece.735.d: "Nicosie a respectueusement décliné l'offre d'intégration économique profonde. La République de Chypre préfère maintenir son indépendance en matière économique pour l'instant, même au prix d'une croissance plus lente."
 greece.735.a: "Nous restons engagés"
 greece.736.t: "Développement gazier de Méditerranée orientale proposé"
 greece.736.d: "Athènes propose le développement conjoint de champs de gaz naturel offshore dans les eaux au sud de Chypre et à l'est de la Crète. Un programme d'extraction partagé boosterait les deux économies et générerait des recettes énergétiques de long terme."
 greece.736.a: "Développer les champs ensemble"
 greece.736.b: "Trop provocateur pour l'instant"
 greece.737.t: "Les champs de gaz de Chypre commencent leurs opérations"
 greece.737.d: "Des plates-formes de forage grecques et chypriotes ont commencé à extraire du gaz naturel des champs conjoints. Une nouvelle capacité de raffinage entre en service et les deux économies bénéficient de recettes énergétiques durables. Le geste envoie un signal à Ankara : les Grecs sont prêts à développer leur zone économique exclusive malgré les objections turques."
 greece.737.a: "Les ressources assurent notre avenir"
 greece.738.t: "Chypre rejette le projet gazier"
 greece.738.d: "La République de Chypre a refusé de participer au développement gazier conjoint, craignant le contrecoup diplomatique de la Turquie. Athènes ne forcera pas la question."
 greece.738.a: "Une occasion manquée"
 greece.739.t: "Ouverture vers les Chypriotes turcs"
 greece.739.d: "Athènes tend une main économique et culturelle à la communauté chypriote turque du nord. Athènes offre investissement, privilèges commerciaux et programmes d'échange culturel, démontrant que la réunification sous égide grecque sert les intérêts du nord autant que le camp chypriote grec."
 greece.739.a: "Accepter l'investissement grec"
 greece.739.b: "Nous restons méfiants"
 greece.740.t: "Chypre du Nord accueille l'investissement"
 greece.740.d: "La direction chypriote turque a accepté l'investissement grec et des liens économiques plus étroits. L'argent afflue vers le nord, des partenariats d'affaires se forment, et l'influence bascule progressivement en faveur d'Athènes. Les bases d'une réunification éventuelle se raffermissent de mois en mois."
 greece.740.a: "Les germes de l'unité sont semés"
 greece.741.t: "Chypre du Nord rejette l'ouverture"
 greece.741.d: "La communauté chypriote turque, méfiante des intentions grecques, a décliné le paquet d'investissement. Le soutien d'Ankara reste leur bouclier, et les ouvertures d'Athènes ne les ont pas persuadés du contraire."
 greece.741.a: "Un autre revers"
 greece.742.t: "Proposition d’accord sur les bases souveraines"
 greece.742.d: "Athènes demande au Royaume-Uni de transférer le contrôle des zones de bases souveraines d'Akrotiri et Dhekelia. En échange, la Grèce offre une compensation, un accès OTAN continu et des garanties de préserver les installations militaires britanniques. Le transfert de ces bases remodelerait l'équilibre stratégique à Chypre."
 greece.742.a: "Céder les bases à la Grèce"
 greece.742.b: "Les bases restent britanniques"
 greece.743.t: "Le Royaume-Uni accepte le transfert"
 greece.743.d: "Londres a décidé que transférer les bases sert les intérêts de long terme des deux nations. Les forces grecques occupent désormais Akrotiri et Dhekelia, et Athènes gagne une profondeur stratégique et le contrôle d'aérodromes et de ports clés. Le basculement penche décisivement l'équilibre militaire en faveur de l'Enosis."
 greece.743.a: "Une acquisition historique"
 greece.744.t: "Le Royaume-Uni refuse le transfert"
 greece.744.d: "Le gouvernement britannique a refusé de relâcher les zones de bases souveraines. Elles restent territoire britannique et installations militaires britanniques, comme depuis 1960."
 greece.744.a: "Nos mains sont liées"
 GRE_western_commitment: "Alignement grec occidental"
 GRE_western_commitment_tt: "$GRE_western_commitment$ : $RIGHT|+=0Y$"
 greece.745.t: "La campagne de pression s'achève"
 greece.745.d: "La campagne pour faire pression sur la Turquie au sujet de Chypre s'est achevée. Plusieurs grandes puissances ont exprimé leur soutien à la position grecque, citant le besoin de stabilité en Méditerranée orientale et les droits du peuple chypriote. Athènes détient désormais un levier diplomatique important. Selon le nombre de voix alliées, Ankara a [GRE_GetTurkeyConcessionChance] de chances de reculer et d'accepter une influence réduite sur Chypre. Si la Turquie refuse, les tensions monteront à travers l'Égée."
 greece.745.a: "Découvrez comment Ankara réagit"
 greece.724.t: "Athènes réclame l’union"
 greece.724.d: "Le gouvernement grec a formellement exigé que la République de Chypre se soumette à l'union avec la Grèce. L'offre est claire : rejoindre volontairement, et la transition sera fluide et prospère. Selon le sentiment chypriote grec et l'influence turque, les chances d'acceptation s'élèvent à [GRE_GetCyprusAcceptanceChance]. Le gouvernement de Nicosie fait face à un choix historique."
 greece.724.a: "Accepter l'union avec la Grèce"
 greece.724.b: "Refuser l'exigence"
 greece.725.t: "Athènes exige que le Nord se soumette"
 greece.725.d: "La Grèce a désormais tourné son attention vers Chypre du Nord, exigeant que la direction chypriote turque accepte aussi l'union avec Athènes. La position chypriote turque est plus complexe : le nord s'est longtemps appuyé sur la protection militaire turque et les liens culturels. Les chances d'acceptation s'élèvent à [GRE_GetNorthernCyprusAcceptanceChance], modulées par le recul ou non de la Turquie sous pression de l'OTAN et par la profondeur de la dynamique chypriote grecque. Si Chypre du Nord refuse, l'île reste divisée et un conflit armé devient probable."
 greece.725.a: "Accepter l'union avec la Grèce"
 greece.725.b: "Chercher la protection turque ; refuser l'exigence"
 greece.726.t: "Jusqu'où ira Athènes ?"
 greece.726.d: "Chypre du Nord refuse de se soumettre volontairement, et le gouvernement chypriote turc signale qu'il cherchera le soutien militaire turc pour résister à l'absorption. La Grèce fait face à un choix : poursuivre l'aide clandestine aux forces pro-union et espérer une résolution pacifique, ou engager directement les forces armées helléniques pour annexer le nord par la force. Une action militaire directe signifie quitter l'OTAN, puisque l'alliance ne soutiendra pas une guerre offensive pour prendre un territoire dans la sphère d'influence d'un membre de l'OTAN."
 greece.726.a: "Volontaires et matériel seulement"
 greece.726.b: "Engager les forces armées helléniques ; déclarer la guerre à Chypre du Nord"
 greece.723.t: "Chypre réunifiée"
 greece.723.d: "Les deux États chypriotes ont été unifiés sous le drapeau grec. Les territoires du sud et du nord sont désormais pleinement incorporés à la Grèce comme États cœurs. Pour la première fois depuis 1974, l'île est entière sous une seule autorité. C'est l'aboutissement de décennies de nationalisme chypriote et d'ambitions irrédentistes grecques : l'enosis enfin réalisée."
 greece.723.a: "Un jour historique pour l'hellénisme"
