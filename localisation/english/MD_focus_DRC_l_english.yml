 MDRC_reform_civic_administration: "Congolese Administrative Accountability"
 MDRC_reform_civic_administration_desc: "Dialogue, transition and professional recruitment develop one public institution. Professional staffing supports reliable policy implementation. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_western_accountability: "Congolese Constitutional Accountability"
 MDRC_reform_western_accountability_desc: "Electoral institutions, scrutiny and parliamentary oversight strengthen a constitutional framework. Courts and regulators require a larger administrative budget. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_emerging_planning: "Congolese Developmental Planning"
 MDRC_reform_emerging_planning_desc: "Planning, producer councils and public guarantees coordinate production. Administrative costs and reorganization accompany industrial gains. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_provincial_compact: "The Congolese Provincial Compact"
 MDRC_reform_provincial_compact_desc: "Autonomy and national service standards improve infrastructure delivery and confidence, but require parallel administrative capacity. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_national_resilience: "Congolese National Resilience"
 MDRC_reform_national_resilience_desc: "Administrative, industrial and military preparedness develop together. Readiness requires defence expenditure and initially diverts civilian capacity. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_religious_covenant: "The Congolese Public-Service Covenant"
 MDRC_reform_religious_covenant_desc: "Religious institutions earn legitimacy through accounting, consultation and predictable services. Formal commitments cost money and initially disrupt established production. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_populist_legitimacy: "A National Popular Mandate"
 MDRC_reform_populist_legitimacy_desc: "Constituency service and consultation give the populist government legitimacy. Delivering its promises requires expanded administration. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_front_direction: "Corporatist Industrial Direction"
 MDRC_reform_front_direction_desc: "Syndicates direct resources toward strategic priorities. Military production improves at the expense of civilian flexibility and defence expenditure. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_junta_administration: "Military Administrative Command"
 MDRC_reform_junta_administration_desc: "A command administration develops a defined reconstruction mandate. Readiness gains require military expenditure and divert civilian capacity. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_royal_legitimacy: "The Kilukeni Royal Settlement"
 MDRC_reform_royal_legitimacy_desc: "Dynastic authority develops through a council of the crown and professional royal administration. Legitimacy and diplomatic standing come with an expensive institutional household. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_army_readiness: "FARDC Sustainment Service"
 MDRC_reform_army_readiness_desc: "Personnel records, depots and staff training create dependable readiness, supported by a larger regular defence budget. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_air_logistics: "Congolese Air Service Support"
 MDRC_reform_air_logistics_desc: "Ground crews, fuel handling and maintenance records improve training and safety while adding regular military expenditure. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_river_customs: "Congo Basin Navigation Service"
 MDRC_reform_river_customs_desc: "Training, maintenance and customs liaison support small-craft production and practical experience at a recurring administrative cost. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_diplomatic_network: "Kinshasa Regional Cooperation Secretariat"
 MDRC_reform_diplomatic_network_desc: "Permanent missions and technical exchanges improve relations and trade but require a funded civil service. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_regional_reconciliation: "Great Lakes Civilian Recovery Authority"
 MDRC_reform_regional_reconciliation_desc: "Negotiation, return programmes and traceable trade restore confidence and productive activity while maintaining an administrative budget. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_frontier_readiness: "Eastern Frontier Command System"
 MDRC_reform_frontier_readiness_desc: "Operational planning improves defensive coordination but increases military costs and draws capacity away from civilian production. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_civil_accounts: "Congolese Public Accounts"
 MDRC_reform_civil_accounts_desc: "Audited accounts improve administrative productivity and reduce bureaucracy costs. Inspectors and secure records require a bureaucracy budget. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_civil_industry: "Congolese Industrial Value Chains"
 MDRC_reform_civil_industry_desc: "Surveys, domestic suppliers and processing plants improve civilian productivity and investment returns. Certification and contract enforcement require continuing administration. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_civil_utilities: "Congo Basin Utilities"
 MDRC_reform_civil_utilities_desc: "River transport, freight workshops, electricity and communications form one utilities programme. Stronger productive links need funded maintenance offices. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_civil_services: "Provincial Livelihood Services"
 MDRC_reform_civil_services_desc: "Extension services, school meals, clinics and markets improve rural productivity and confidence. Staff and distribution offices carry a continuing administrative cost. Each completed reform immediately changes the modifiers listed here."
 MDRC_reform_civil_skills: "Congolese Teaching and Technical Standards"
 MDRC_reform_civil_skills_desc: "Teacher training and certification turn literacy into a productive workforce. Research and productivity benefits require a permanent professional administration. Each completed reform immediately changes the modifiers listed here."
