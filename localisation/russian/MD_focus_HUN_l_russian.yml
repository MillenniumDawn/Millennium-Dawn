l_russian:
 HUN_karpatalja_question_category: "Карпатский вопрос"
 HUN_annex_karpatalja: "Ответьте на звонок из Карпаталии"
 HUN_annex_karpatalja_desc: "Власть Украины в Закарпатье рухнула. Местные венгерские советы просят Будапешт признать объединение, и в Киеве не осталось никого, кто мог бы сказать \"нет\"."
 HUN_karpatalja_ultimatum: "Ультиматум Киеву"
 HUN_karpatalja_ultimatum_desc: "Венгерское меньшинство Карпат целый век ждало воссоединения с родиной. Киев должен передать его тихо или потерять силой."
 HUN_karpatalja_integration_category: "Администрация Карпаталии"
 HUN_701_return: "Возвращение Карпаталии"
 HUN_701_return_desc: "Карпаталья погиб в Трианоне. Обеспечив соблюдение требований провинции, мы можем сделать воссоединение постоянным."
 HUN_karpatalja_autonomy: "Администрация Карпаталии"
 HUN_karpatalja_autonomy_desc: "Управление Карпатчиной через местные советы покупает добрую волю и ускоряет ее интеграцию ценой более медленного управления кошельками и общественного терпения в отношении договоренностей."
 HUN_ukr_cede_tt: "§YУкраина передаст Карпаты§!"
 HUN_ukr_refuse_tt: "§RМы добьемся военной цели — захватим Карпаталию силой§!"
 hungary_karpatalja.1.t: "Советы Карпаталии"
 hungary_karpatalja.1.d: "Поскольку Киев не может демонстрировать свою власть так далеко от столицы, местные собрания в Закарпатье проголосовали за объединение с Венгрией. Будапешт только рад услужить."
 hungary_karpatalja.1.a: "Поприветствуйте их дома"
 hungary_karpatalja.2.t: "Правление Карпаталией"
 hungary_karpatalja.2.d: "Карпаталья на карте - это Венгрия. Превратить это в функционирующую администрацию - другой вопрос, и правительство должно решить, насколько тяжелую руку использовать."
 hungary_karpatalja.2.a: "Правление через местные советы"
 hungary_karpatalja.2.b: "Прямое правление из Будапешта"
 hungary_karpatalja.10.t: "Будапешт требует Карпаталью"
 hungary_karpatalja.10.d: "Венгрия поставила ультиматум: сдайте Закарпатье или столкнетесь с последствиями. Правительство должно решить, как реагировать."
 hungary_karpatalja.10.a: "Уступить провинцию"
 hungary_karpatalja.10.b: "Отклонить ультиматум"
 hungary_karpatalja.11.t: "Киев отказывается"
 hungary_karpatalja.11.d: "Украина отклонила наши требования по поводу Карпат. Если мы хотим заполучить провинцию, нам придется захватить ее самим."
 hungary_karpatalja.11.a: "Готовьтесь к войне"