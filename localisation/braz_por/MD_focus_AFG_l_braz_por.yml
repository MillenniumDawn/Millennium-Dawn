 AFG_fence_along_southern_afghanistan_border_tt: "Constrói §G1§! fortificação de fronteira em cada região de fronteira com [PAK.GetNameWithFlag] no Afeganistão §Ysul§!"
 AFG_fence_along_northern_afghanistan_border_tt: "Constrói §G1§! fortificação de fronteira em cada região de fronteira com [PAK.GetNameWithFlag] no Afeganistão §Ynorte§!"
 AFG_secure_border_with_pakistan_tt: "\nAo construir fortificações de segurança ao longo da fronteira Afegã-Paquistanesa, isso §Gdiminuirá§! a eficácia da infiltração do £GFX_AFG_salafist_jihadism §RTalibã§! em nosso país. A construção começará pelo Afeganistão §Ycentral§! devido à sua importância política, depois continuará do Afeganistão §Ysul§! ao Afeganistão §Ynorte§!\n"
 afghan_unity_propaganda_success_tt: "\nAs §Ychances de sucesso§! são §Rinfluenciadas§! pela §Yconfiança pública em nosso governo§! e §Ysituação econômica§!."
