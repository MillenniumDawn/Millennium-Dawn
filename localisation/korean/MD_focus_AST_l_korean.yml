 influx_of_vietnamese_goods_ast: "§4베트남 상품 유입§!"
 mutual_assistance_and_trade_agreement: "§4상호 원조 및 무역 협약§!"
 election_outcomes_ast.13.t: "하워드 정부의 깜짝 승리"
 election_outcomes_ast.13.d: "연료 가격 상승과 존 하워드의 여러 정책에 대한 강한 반발도 그가 세 번째 임기를 따내는 것을 막기에는 충분하지 않았습니다. 하원에서 82석을 얻으며 경선을 마친 자유당은 아마도 이 나라 역사상 가장 빠른 정치적 운세 반전을 겪었습니다. \n\n한편 킴 비즐리가 이끈 노동당은 1934년 이래 최저 1차 득표율을 기록했으며, 노동당 내부 소식통들은 야당 대표가 사임할 것으로 예상된다고 주장합니다. 하워드는 시드니 웬트워스 호텔에서 승리 연설을 하며 선거 승리에 대해 지지자들, 특히 소규모 사업자들에게 감사를 표하고 추가 개혁 계획을 설명했습니다."
 election_outcomes_ast.13.a: "이렇게 쉬울 줄이야!"
 election_outcomes_ast.14.t: "또 한 번의 임기를 따낸 하워드 정부"
 election_outcomes_ast.14.d: "마크 레이텀이 신임 노동당 대표로서 입지를 넓히는 데 어려움을 겪는 동안, [AST.GetLeader]은(는) 약진하여 연합에 또 한 번의 임기를 안기고 과반수를 확보했습니다. 자유당은 발리 폭탄 테러의 비극 이후 지지율이 편안하게 상승했으며, 이는 신중하고 안정적인 통치에 대한 선호를 나타냅니다. \n\n밀레니엄 가뭄에 대처하기 위해 도입된 국민당의 농촌 물 관리 정책의 성공 또한 연합의 승리에 기여했음이 틀림없습니다. 이번 승리는 이 당이 두 번째로 길게 집권을 이어 간 기록입니다. \n\n노동당도 녹색당으로부터 한 석, 국민당으로부터 몇 석을 되찾으며 일부 성과를 거두었습니다. 다만 이는 당 내 또 다른 격변으로 이어질 가능성이 높습니다."
 election_outcomes_ast.14.a: "3년 더!"
 election_outcomes_ast.10.t: "승리를 낚아챈 노동당"
 election_outcomes_ast.10.d: "다시 정권을 잡은 지 불과 몇 년 만에 연립의 장기 집권은 재기에 나선 비즐리의 선거 운동에 가로막혔습니다. \n\n정치 평론가들의 예측대로, 계속되는 생활비 위기와 존 하워드의 여러 정책에 대한 반발이 커진 데 힘입어 노동당이 돌아왔습니다. 하원과 상원에서 안정적인 과반을 확보했는데, 이는 1998년 연립의 승리에나 견줄 수 있을 만한 결과입니다. 킴 비즐리의 보건 개혁 정책이 유권자들의 공감을 얻은 것이 분명하며, 유권자들은 새 총리가 광범위한 선거 공약을 지킬 수 있을지 지켜보고 싶어 할 것입니다."
 election_outcomes_ast.10.a: "이제 공평한 기회가 올 때다!"
 election_outcomes_ast.11.t: "스포트라이트를 빼앗은 레이섬"
 election_outcomes_ast.11.d: "노동당의 새 대표 마크 레이섬이 무대를 독차지하면서 오늘 밤 연립의 8년 연속 집권이 끝났습니다. 레이섬은 뉴사우스웨일스와 빅토리아 전역에서 자유당의 의석을 여럿 빼앗아 과반에 조금 못 미치는 의석으로 정부를 구성하게 되었습니다. \n\n비교적 신인인 그는 현직 하워드와 대비되는 뚜렷하게 공격적인 스타일로 선거전에 뛰어들었고, 이것이 환멸을 느낀 유권자들에게 먹혀든 것이 분명합니다. 이미 여론조사에서 높은 지지율을 누리고 있는 새 총리는 낡은 자리에 새로운 통치를 불어넣겠다고 공언했습니다. 이러한 스타일은 부대표 제니 맥클린의 취임으로도 이어지는데, 여성이 이 나라의 두 번째로 높은 공직을 맡는 것은 처음입니다."
 election_outcomes_ast.11.a: "국민이 말했다."
 election_outcomes_ast.12.t: "다시 조명받는 연립"
 election_outcomes_ast.12.d: "피터 코스텔로의 그다지 활기차지 않은 선거 운동이 자유당과 국민당에 대한 기록적인 농촌 지역 투표율에 힘입어 나라의 지도권을 되찾아 왔습니다. 현 정부의 대중적 인기가 시들해지자 전 부대표에게 도약대가 마련되었고, 그는 이제 경제 개혁을 내세운 강령으로 당을 이끌고 있습니다. \n\n\\"이번 선거에서 모든 여론조사가 연립이 뒤처져 있다고 했습니다. 연속 50번의 조사에서요... 그런데 지금 우리가 여기 있습니다. 우리가 돌아왔습니다!\\" \n\n새 총리는 하워드 정부의 각료 다수를 포함한 내각 발표에 이어 곧 취임 선서를 할 예정입니다."
 election_outcomes_ast.12.a: "좋은 시절이 온다."
 investing_in_the_nation_ast: "국가에 대한 투자"
 national_development_authority_ast: "국가개발청"
 national_development_authority_ast_desc: "NDA는 기업들과 협력하여 필요할 때 지원과 경제 자문을 제공합니다. 또한 직장 관련 법령이 표준 요건을 충족하는지 감독합니다."
 AST_johnson_dispute.1.t: "존슨 타일즈 분쟁"
 AST_johnson_dispute.1.d: "오스트레일리아 제조업 노동자 노조 소속의 거친 노동자들이 노사 분쟁 끝에 빅토리아주에 있는 존슨 타일즈 사무실을 휩쓸며 난장판으로 만든 것으로 보입니다. \n\n노조 측에 따르면, 회사가 예고도 없이 장기 근속자 29명을 갑작스럽게 해고하고 그 자리를 모두 비노조 인력으로 채운 것이 이번 사건의 원인이라고 합니다. \n\n생계가 위태로워진 노동자들이 분노를 터뜨린 것은 놀랄 일이 아니며, 이들은 건물을 휘젓고 다니며 조명 등을 부수었습니다. 존슨 타일즈는 이들을 기소하겠다는 입장이 매우 완강하며, 일종의 보복 조치로 비노조 인력을 더 쉽게 고용할 수 있도록 하는 법안을 지지하라고 우리에게 압력을 넣고 있습니다. \n\n한편 몇몇 다른 노조 단체들은 노동자들을 지지하고 나섰으며, 이와 같은 해고가 다시는 일어나지 않도록 막는 자체 법안을 제안했습니다. 노동자들의 운명은 배심원단에 달려 있지만, 우리가 내리는 결정은 앞으로 업계의 선례가 될 것입니다."
 AST_johnson_dispute.1.a: "노동자들을 지지한다."
 AST_johnson_dispute.1.b: "회사를 보호한다."
 AST_vegemite_and_stick_approach_tt: "§Y오세아니아 국가들에 우리의 영향력이 미칩니다.§!"
 solar_rollout_scheme_ast: "태양광 보급 계획"
 AST_solar_panels_at_home.1.t: "태양광 패널의 문제"
 AST_solar_panels_at_home.1.d: "태양광 계획은 물량 면에서는 성공적으로 보급되었지만, 그에 못지않게 많은 불만이 쏟아져 들어오고 있습니다. 알고 보니 일부 시공업체가 설치 기한을 맞추려고 부실 공사를 한 것이 드러났고, 그 결과 수백 장의 패널이 파손되었습니다. \n\n설상가상으로 허술한 시스템 때문에 이미 일부 설치 기사들이 부상을 입었습니다. 오스트레일리아 경쟁소비자위원회(ACCC)는 벌써부터 책임자 몇 명의 이름을 내놓으라며 우리를 다그치고 있습니다. 패널의 약 34%를 리콜해 다시 보급해야 하며, 대중과의 관계를 수습하려면 성명도 발표해야 합니다."
 AST_solar_panels_at_home.1.a: "착한 일은 벌 받기 마련이군."
