 central_asian_narcotraffic: "중앙아시아 마약 밀매"
 central_asian_narcotraffic_desc: "중앙아시아의 마약 문제는 마약류의 경유와 생산에 관련되어 있습니다. 이 지역은 아프가니스탄에서 러시아와 유럽으로 마약을 밀수하는 핵심 경유로입니다. 게다가 일부 중앙아시아 국가에서는 양귀비 재배를 포함한 마약 생산이 늘어났습니다. 이 문제는 공중 보건, 사회 안정, 지역 경제 발전을 위협하며 이에 맞서기 위한 공동의 노력이 요구됩니다."
