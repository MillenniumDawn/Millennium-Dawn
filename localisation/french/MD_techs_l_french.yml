 SOV_module_helipads_2: "Ka-27"
 production_line_improvements_2: "Lignes de production améliorées II"
 production_line_improvements_2_desc: "L'usage élargi de composants standardisés et d'assemblage semi-automatisé permet aux usines d'augmenter plus fiablement la production tout en réduisant les goulets d'étranglement de main-d'œuvre."
 production_line_improvements_3: "Lignes de production améliorées III"
 production_line_improvements_3_desc: "La coordination logistique avancée et les systèmes de manutention optimisés améliorent nettement le débit et réduisent le gaspillage dans les installations industrielles."
 production_line_improvements_4: "Lignes de production améliorées IV"
 production_line_improvements_4_desc: "L'adoption généralisée de la robotique industrielle et de l'outillage de précision accroît la vitesse de production, le contrôle qualité et l'adaptabilité aux nouveaux modèles."
 production_line_improvements_5: "Lignes de production améliorées V"
 production_line_improvements_5_desc: "Les systèmes de gestion de production intégrés numériquement permettent le suivi en temps réel et l'ajustement rapide des procédés, accroissant l'efficacité globale."
 production_line_improvements_6: "Lignes de production améliorées VI"
 production_line_improvements_6_desc: "Une automatisation de haut niveau et la maintenance prédictive réduisent les pannes d'équipement, permettant aux usines de fonctionner à une efficacité de pointe soutenue."
 production_line_improvements_7: "Lignes de production améliorées VII"
 production_line_improvements_7_desc: "Les techniques de fabrication intelligente combinent l'analyse de données et la décision automatisée, optimisant les flux de production sur des réseaux industriels entiers."
 production_line_improvements_8: "Lignes de production améliorées VIII"
 production_line_improvements_8_desc: "Des chaînes de production hautement modulaires permettent une reconfiguration rapide pour de nouveaux équipements et modèles, améliorant fortement la flexibilité industrielle."
 production_line_improvements_9: "Lignes de production améliorées IX"
 production_line_improvements_9_desc: "Les usines quasi autonomes utilisent l'apprentissage automatique pour optimiser production, ressources et allocation de main-d'œuvre avec une intervention humaine minimale."
 production_line_improvements_10: "Lignes de production améliorées X"
 production_line_improvements_10_desc: "Des écosystèmes industriels pleinement intégrés synchronisent fournisseurs, fabricants et logistique en temps réel, poussant l'efficacité de production à des niveaux inédits."
 improved_building_constructions_2: "Focus sur la construction d’usines II"
 improved_building_constructions_2_desc: "Les composants préfabriqués et une logistique de chantier améliorée réduisent les délais tout en préservant l'intégrité structurelle."
 improved_building_constructions_3: "Priorité à la construction d'usines III"
 improved_building_constructions_3_desc: "Des pratiques d'ingénierie renforcées et un matériel de construction moderne permettent de bâtir des usines plus vite et avec plus de fiabilité."
 improved_building_constructions_4: "Construction d'usine Focus IV"
 improved_building_constructions_4_desc: "L'automatisation des procédés de construction et une meilleure coordination de la main-d'œuvre accélèrent nettement le développement industriel."
 improved_building_constructions_5: "Construction d'usine Focus V"
 improved_building_constructions_5_desc: "La planification assistée numériquement et les techniques de construction de précision minimisent les retards et réduisent la consommation de ressources."
 improved_building_constructions_6: "Focus sur la construction d’usines VI"
 improved_building_constructions_6_desc: "Matériaux avancés et méthodes modulaires permettent l'expansion et la modernisation rapides des infrastructures industrielles."
 improved_building_constructions_7: "Priorité à la construction d'usines VII"
 improved_building_constructions_7_desc: "Des chaînes de construction hautement optimisées intègrent fournisseurs, constructeurs et planificateurs, fluidifiant tout le processus de bâtissage industriel."
 improved_building_constructions_8: "Priorité à la construction d'usines VIII"
 improved_building_constructions_8_desc: "Les systèmes de construction intelligents s'appuient sur l'automatisation et les données en temps réel pour une efficacité maximale et un gaspillage minimal."
 improved_building_constructions_9: "Construction d'usine Focus IX"
 improved_building_constructions_9_desc: "Les grands projets industriels bénéficient d'une planification assistée par IA, permettant un achèvement plus rapide et de meilleures performances à long terme."
 improved_building_constructions_10: "Construction d'usine Focus X"
 improved_building_constructions_10_desc: "Les techniques de construction quasi autonomes réduisent considérablement les délais de construction, permettant une mobilisation industrielle rapide."
 CAT_microchips: "Microchips"
 CAT_helicopter_operators: "Opérateurs d'hélicoptères"
 microchip_production_1: "Première production de copeaux"
 microchip_production_1_desc: "Les premiers procédés de fabrication de puces permettent de graver des circuits intégrés simples à grande échelle, posant les bases de l'électronique moderne civile et militaire."
 microchip_production_2: "DRAM 1 Kbit"
 microchip_production_2_desc: "La mémoire vive dynamique précoce permet aux systèmes électroniques de stocker et d'accéder temporairement aux données à des vitesses bien plus élevées. Bien que limitée en capacité, cette mémoire rend les ordinateurs plus réactifs, soutenant les premiers systèmes de contrôle numérique et le traitement des données."
 microchip_production_3: "64 Kbits de Dram"
 microchip_production_3_desc: "Les améliorations des procédés de fabrication augmentent nettement la densité mémoire et les rendements. La DRAM 64 kilobits prend en charge des logiciels plus complexes et un fonctionnement plus rapide, pour des applications de calcul plus avancées en communications, renseignement et contrôle d'armes."
 microchip_production_4: "1 Gbit de dram"
 microchip_production_4_desc: "Les modules mémoire gigabit haute densité marquent une avancée majeure en semi-conducteurs. Ces puces permettent le traitement de données à grande échelle, les simulations avancées et les systèmes de commandement en réseau modernes, composant critique des infrastructures de calcul militaires et civiles contemporaines."
 microchip_production_5: "Production future de puces"
 microchip_production_5_desc: "La production avancée de puces utilise la lithographie EUV, les transistors nanosheet et des lignes de fabrication hautement automatisées pour produire des semi-conducteurs plus petits, plus rapides et plus économes pour l'électronique civile et militaire."
 composite_production_1: "Première production composite"
 composite_production_1_desc: "Le développement initial des matériaux composites combine métaux traditionnels et polymères ou fibres pour améliorer le rapport résistance/poids. La production composite précoce renforce les structures de véhicules, aéronefs et infrastructures tout en réduisant coût et poids."
 composite_production_2: "Matériaux composites de 2e génération"
 composite_production_2_desc: "Les raffinements de science des matériaux et de fabrication donnent des composites plus constants et durables. Ces composites de seconde génération offrent une meilleure résistance à la chaleur et une fiabilité structurelle accrue, les rendant adaptés à un plus large usage militaire et industriel."
 composite_production_3: "Composites quasi modernes"
 composite_production_3_desc: "Les avancées en fibres et chimie des résines permettent des composites haute performance proches des normes modernes. Ces matériaux améliorent nettement durabilité, allègement et résistance à la fatigue, soutenant aéronefs, véhicules blindés et systèmes navals avancés."
 composite_production_4: "Production composite moderne"
 composite_production_4_desc: "Des procédés de fabrication composites matures permettent la production à grande échelle de matériaux avancés aux tolérances précises et à la qualité constante. Les composites modernes sont essentiels aux plateformes militaires contemporaines, offrant protection, mobilité et efficacité accrues sur terre, mer et air."
 composite_production_5: "Production de composites avancés"
 composite_production_5_desc: "La production composite avancée utilise le placement automatique de fibres, le moulage par transfert de résine et des méthodes de cuisson améliorées pour fabriquer des structures plus légères et plus résistantes pour aéronefs, véhicules blindés, missiles et systèmes de protection."
 NAVAL_TITLE_PATROLBOATS: "BATEAUX DE PATROUILLE"
 NAVAL_TITLE_PATROLBOATS_DESC: ""
 NAVAL_TITLE_HEAVY_FRIGATES: "FRÉGATES LOURDES"
 NAVAL_TITLE_HEAVY_FRIGATES_DESC: ""
 NAVAL_TITLE_DIESEL_ENGINES: "MOTEURS DIESEL POUR NAVIRE"
 NAVAL_TITLE_DIESEL_ENGINES_DESC: ""
 NAVAL_TITLE_TURBINE_ENGINES: "MOTEURS À TURBINES"
 NAVAL_TITLE_TURBINE_ENGINES_DESC: "Les navires fonctionnent généralement au moyen de moteurs diesel massifs ou de turbines, ou d'une combinaison des deux."
 NAVAL_TITLE_FUSION_ENGINES: "MOTEURS À FUSION"
 NAVAL_TITLE_FUSION_ENGINES_DESC: "Les moteurs nucléaires ont essentiellement un carburant illimité, permettant à nos navires d'opérer en mer aussi longtemps qu'il y a des vivres pour les marins à bord."
 NAVAL_TITLE_RADAR_DRONE: "DRONES RADAR"
 NAVAL_TITLE_RADAR_DRONE_DESC: "Les drones radar étendent la portée capteurs d'un navire au-delà de l'horizon en emportant des radars maritimes légers dans les airs, améliorant la détection de navires, aéronefs, missiles et menaces volant bas avant qu'ils n'atteignent la flotte."
 NAVAL_TITLE_RADAR_JAM: "Brouilleurs de radar"
 NAVAL_TITLE_RADAR_JAM_DESC: "Les modules brouilleurs radar montent des réseaux d'attaque électronique dédiés sur les bâtiments de guerre, leur permettant de perturber radars de recherche, capteurs de visée et autodirecteurs de missiles guidés radar pendant le combat."
 NAVAL_TITLE_RAILGUNS_BATTERY: "BATTERIES DE FUSIL"
 NAVAL_TITLE_RAILGUNS_BATTERY_DESC: "Les canons électriques utilisent des munitions cinétiques accélérées à haute vitesse par ondes électromagnétiques. Le projectile atteint des vitesses extraordinaires, lui donnant de bonnes caractéristiques de pénétration et de précision."
 NAVAL_TITLE_ANTI_DRONE_LASER: "LASERS DE DÉFENSE POINTE"
 NAVAL_TITLE_ANTI_DRONE_LASER_DESC: ""
 NAVAL_TITLE_VLS_DRONE: "SYSTÈMES DE LANCEMENT VERTICAL DE DRONE"
 NAVAL_TITLE_VLS_DRONE_DESC: ""
 NAVAL_TITLE_DRONE_TORPEDO: "TORPILLES DE DRONE"
 NAVAL_TITLE_DRONE_TORPEDO_DESC: ""
 NAVAL_TITLE_NUCLEAR_TORPEDO: "TORPILLES NUCLÉAIRES"
 NAVAL_TITLE_NUCLEAR_TORPEDO_DESC: ""
 NAVAL_TITLE_ANTI_TORPEDOES: "TORPILLES ANTI-TORPILLES"
 NAVAL_TITLE_ANTI_TORPEDOES_DESC: ""
 TITLE_MICROCHIP_SUBTITLE: "MICROPUCES"
 CIVILIAN_TITLE_COMPOSITES: "FABRICATION DE COMPOSITES"
 CIVILIAN_TITLE_COMPOSITES_DESC: "Améliorer notre production de composites nous permettra de bâtir une armée plus qualitative et de haute technologie"
 afs_drone_1: "Drone d'appui-feu autonome"
 afs_drone_1_desc: "Les drones d'appui-feu autonomes utilisent navigation assistée par IA, désignation de cibles et engagement supervisé par un opérateur pour accompagner les unités terrestres régulières, offrant reconnaissance mobile et appui-feu de précision pendant les offensives."
 special_forces_tech_2: "Armes de défense personnelle"
 special_forces_tech_2_desc: "Les PDW sont largement utilisées par nos forces spéciales pour un temps de réaction plus rapide en combat rapproché, tout en étant une attribution spéciale pour ces unités."
 special_forces_tech_3: "Forces spéciales modernes"
 special_forces_tech_3_desc: "Un entraînement supplémentaire permet à nos forces spéciales de prendre l'avantage sur nos adversaires."
 special_forces_tech_4: "Armes dédiées des forces spéciales"
 special_forces_tech_4_desc: "Désigner des armes spécifiques aux forces spéciales peut montrer des plateformes adaptées aux besoins exacts de nos forces spéciales."
 special_forces_tech_5: "Cyberforces spéciales"
 special_forces_tech_5_desc: "Lancer un entraînement cyber pour nos forces spéciales peut leur permettre d'obtenir un meilleur renseignement contre nos adversaires."
 special_forces_tech_6: "Futures forces spéciales"
 special_forces_tech_6_desc: "Les forces spéciales futures intègrent opérations cyber, drones compacts, capteurs avancés et communications sécurisées aux tactiques de petite unité, permettant aux équipes d'élite d'opérer avec un meilleur renseignement, une meilleure coordination et une meilleure survie en environnement contesté."
 body_armor_1: "Gilet Kevlar"
 body_armor_1_desc: "Les premières armures corporelles modernes avant les célèbres gilets en Kevlar étaient surtout en nylon. Le Kevlar fut introduit en 1975, et les premiers gilets furent adoptés par l'armée américaine dans les années 1980.\n\nLes premiers gilets n'offraient de protection qu'au torse supérieur, et seulement contre les éclats et les projectiles de pistolet."
 body_armor_2: "Gilet renforcé de plaques"
 body_armor_2_desc: "Bien que les céramiques aient longtemps servi à la protection personnelle, les premières plaques balistiques modernes sont apparues à la fin des années 1990 et au début des années 2000. Les plaques de ces nouveaux gilets protégeaient des munitions de fusil, et la protection contre les éclats s'étendait à l'aine et au cou, pas seulement au torse."
 body_armor_3: "Gilet tactique amélioré"
 body_armor_3_desc: "Tout en offrant une grande protection, les gilets renforcés de plaques peuvent être encombrants. Cela a poussé plusieurs fabricants à chercher des conceptions plus légères et tactiques. Tout en protégeant, l'armure ne doit pas limiter la capacité d'un soldat à opérer. Les armures modernes offrent des solutions intégrées où les gilets tactiques permettent une personnalisation par l'utilisateur, rendant le même gilet utilisable presque partout. Les capacités protectrices sont aussi améliorées, l'armure moderne pouvant même arrêter des balles perforantes."
 body_armor_4: "Combinaison d'assaut tactique"
 body_armor_4_desc: "Il n'est plus nécessaire de protéger les soldats seulement des balles et des éclats. L'armure doit aussi fournir une protection environnementale. De plus, au lieu de lourdes plaques céramiques, la technologie protectrice devrait tirer parti des propriétés de durcissement des fluides non newtoniens."
 camouflage_1: "Camouflage précoce"
 camouflage_2: "Camouflage à plusieurs échelles"
 camouflage_2_desc: "Le camouflage multi-échelle améliore le camouflage de base en appliquant une gamme d'échelles aux motifs de couleur de l'uniforme. Cela mélange de plus petites zones colorées sur une couleur de fond en un motif de type fractal. Cela imite les schémas de la nature, rendant le camouflage plus efficace dans plusieurs environnements et à des distances variées."
 camouflage_3: "Camouflage numérique"
 camouflage_3_desc: "Le camouflage numérique améliore le multi-échelle car le motif est calculé par ordinateur. Bien que le camouflage numérique désigne souvent une forme pixellisée, il n'équivaut pas nécessairement à un motif fait de carrés."
 camouflage_4: "Camouflage multispectral personnel"
 camouflage_4_desc: "Le camouflage multispectral désigne des techniques pour cacher des objets à la détection infrarouge ou radar. Pour le soldat individuel, cela a surtout pris la forme de combinaisons ghillie, peu pratiques dans la plupart des situations de combat. Avec des matériaux modernes, des revêtements et matériaux de blindage infrarouge efficaces peuvent être appliqués à la tenue de combat de chaque soldat."
 camouflage_5: "Camouflage signature adaptatif"
 camouflage_5_desc: "Le camouflage de signature adaptatif utilise tissus avancés, revêtements et couvertures modulaires pour réduire les signatures visuelle, infrarouge et thermique des soldats, armes, véhicules et équipement emporté dans des conditions de champ de bataille changeantes."
 tech_diesel_power_systems_1: "Moteurs diesel"
 tech_diesel_power_systems_1_desc: "Les moteurs diesel navals fournissent une propulsion fiable et économe pour patrouilleurs, auxiliaires, sous-marins et petits combattants, offrant une grande endurance et un entretien plus simple que les systèmes à vapeur ou à turbine."
 tech_diesel_power_systems_2: "Moteurs diesel modernes"
 tech_diesel_power_systems_2_desc: "Les moteurs diesel navals modernes utilisent turbo suralimenté amélioré, commandes électroniques et injection plus précise pour augmenter la puissance, réduire la consommation et améliorer la fiabilité lors de longs déploiements."
 tech_diesel_power_systems_3: "Moteurs diesel avancés"
 tech_diesel_power_systems_3_desc: "Les systèmes diesel avancés intègrent injection common-rail, suivi numérique et options diesel-électrique, permettant aux navires d'opérer plus silencieusement, efficacement et souplement à différentes vitesses."
 tech_diesel_power_systems_4: "Moteurs diesel futuristes"
 tech_diesel_power_systems_4_desc: "Les moteurs diesel futuristes combinent propulsion hybride-électrique, stockage d'énergie et gestion intelligente de la puissance, réduisant la consommation tout en soutenant la demande électrique croissante des capteurs, armes et systèmes de bord."
 tech_power_systems_4: "Moteurs à turbine à réaction modernes"
 tech_power_systems_4_desc: "Les systèmes de turbines navals modernes intègrent commandes numériques, matériaux améliorés et gestion hybride-électrique, offrant de fortes performances de sprint tout en soutenant la demande électrique croissante des radars, capteurs et systèmes de combat."
 tech_nuclear_power_systems_4: "Réacteurs nucléaires de surface futuristes"
 tech_nuclear_power_systems_4_desc: "Les réacteurs nucléaires de surface futuristes utilisent des cœurs à plus longue durée de vie, une automatisation améliorée et des contrôles plus sûrs pour fournir aux bâtiments une propulsion soutenue et de grandes réserves électriques pour capteurs, armes et systèmes de navire."
 tech_fire_control_4: "Futur contrôle radar de missiles augmentés"
 tech_fire_control_4_desc: "La conduite de tir radar missiles augmentée future utilise des systèmes d'information de combat assistés par IA pour améliorer détection, pistage et coordination d'engagement contre les menaces missiles subsoniques, supersoniques et hypersoniques."
 tech_combat_radar_6: "Radar VII"
 tech_combat_radar_6_desc: "Les réseaux radar de nouvelle génération utilisent émetteurs haute puissance, détection multi-bandes et protection électronique intégrée pour améliorer les performances contre aéronefs plus furtifs, armes hypersoniques et attaques par saturation."
 tech_radar_jammer_1: "Brouillage radar I"
 tech_radar_jammer_1_desc: "Les brouilleurs électroniques de base perturbent le radar ennemi en inondant les récepteurs de bruit et de faux retours. Même des systèmes limités peuvent dégrader la qualité du pistage et compliquer l'interception, gagnant des secondes critiques."
 tech_radar_jammer_2: "Brouillage radar II"
 tech_radar_jammer_2_desc: "Une meilleure gestion de la puissance et un façonnage de signal plus intelligent permettent un brouillage plus efficace contre les radars de recherche et de conduite de tir modernes. Le but n'est pas l'invisibilité, mais l'incertitude, forçant l'ennemi à travailler plus dur pour chaque verrouillage."
 tech_radar_jammer_3: "Brouillage radar III"
 tech_radar_jammer_3_desc: "Les techniques numériques permettent un brouillage déceptif qui manipule ce que le radar croit voir, créant des cibles fantômes et décalant portées et gisements. Combinés à de meilleures bibliothèques de menaces, ces systèmes s'adaptent vite aux nouvelles formes d'onde et contre-mesures."
 tech_radar_jammer_4: "Brouillage radar IV"
 tech_radar_jammer_4_desc: "Les suites d'attaque électronique de nouvelle génération intègrent capteurs en réseau, analyse en temps réel et émetteurs agiles pour contester le spectre à grande échelle. Elles peuvent supprimer, tromper et submerger plusieurs radars tout en survivant à une guerre électronique intense et à des changements de fréquence rapides."
 tech_combat_sonar_6: "Sonar VII"
 tech_combat_sonar_6_desc: "Les réseaux sonar de nouvelle génération combinent réseaux de bord, véhicules sous-marins sans pilote, capteurs de fonds marins et données acoustiques externes pour étendre la détection anti-sous-marine au-delà de la portée capteurs d'un seul navire."
 tech_naval_recon_drones_1: "Drones de reconnaissance navale I"
 tech_naval_recon_drones_1_desc: "Les drones de reconnaissance lancés depuis un navire étendent les yeux d'une flotte au-delà de l'horizon, offrant recherche de surface en temps réel et désignation de cibles basique. Même de petites plateformes peuvent pister des contacts, cartographier les approches et réduire le risque de surprise en eaux contestées."
 tech_naval_recon_drones_2: "Drones de reconnaissance navale II"
 tech_naval_recon_drones_2_desc: "Capteurs et liaisons de données améliorés transforment les drones navals en éclaireurs persistants, nourrissant les commandants d'un tableau maritime plus clair avec identification et pistage plus rapides. Meilleure endurance et stabilisation les rendent fiables par gros temps et sur de longs cycles de patrouille."
 tech_naval_recon_drones_3: "Drones de reconnaissance navale III"
 tech_naval_recon_drones_3_desc: "Les drones maritimes en réseau peuvent coordonner des schémas de recherche, désigner les armes de bord et transférer les données de ciblage à travers la force opérationnelle. Avec un appui électronique et un traitement de signal renforcés, ils aident à exposer des menaces qui resteraient autrement cachées dans le fouillis et les émissions."
 tech_naval_recon_drones_4: "Drones de reconnaissance navale IV"
 tech_naval_recon_drones_4_desc: "Les drones de reconnaissance navals avancés fournissent surveillance persistante à vaste zone, désignation de cibles et relais capteurs pour missions de frappe et d'interception. Communications durcies et navigation autonome leur permettent d'opérer sous brouillage, liaisons dégradées et guerre électronique intense."
 tech_rail_guns_4: "Railguns 2045"
 tech_rail_guns_4_desc: "Les canons électriques avancés utilisent des projectiles hypervéloces guidés, des liaisons de conduite de tir de précision et des composants de lanceur plus résistants pour frapper navires, aéronefs, missiles et cibles terrestres avec plus de précision et une capacité de tir soutenu."
 tech_rail_battery_1: "Batterie de canons à rail I"
 tech_rail_battery_1_desc: "Plutôt que de monter un seul canon électromagnétique, une batterie groupe plusieurs tubes dans un système de conduite de tir unifié, reprenant la logique des tourelles de cuirassé. Des salves coordonnées offrent une puissance de frappe plus lourde, une dispersion plus serrée et un tir de relance plus rapide, au prix d'une demande énergétique accrue et d'une intégration plus complexe."
 tech_rail_battery_2: "Batterie de canons à rail II"
 tech_rail_battery_2_desc: "Les batteries de canons électromagnétiques de seconde génération affinent la durée de vie des tubes, la gestion thermique et l'automatisation des soutes, permettant un tir de salve soutenu à cadence élevée sans usure paralysante. Avec une distribution d'énergie plus intelligente et une visée avancée, ces affûts à triple rail peuvent dominer les engagements de surface et fournir un appui-feu de précision à longue portée bien au-delà de l'artillerie navale conventionnelle."
 tech_point_defense_chain_gun: "Systèmes de défense ponctuelle"
 tech_point_defense_chain_gun_desc: "Les systèmes de défense ponctuelle recouvrent tout ce qui peut tirer sur les missiles arrivants."
 tech_anti_drone_laser_1: "Lasers de défense ponctuelle embarqués I"
 tech_anti_drone_laser_1_desc: "Les premiers lasers embarqués offrent une défense à magasin profond contre les drones et munitions entrantes en brûlant capteurs, gouvernes et ogives à la vitesse de la lumière. Ils réduisent la dépendance aux missiles intercepteurs et aux canons de défense rapprochée, mais exigent une alimentation stable et un suivi précis pour rester efficaces par mauvais temps et sous embruns."
 tech_anti_drone_laser_2: "Lasers de défense ponctuelle embarqués II"
 tech_anti_drone_laser_2_desc: "Une meilleure qualité de faisceau, une gestion thermique et une conduite de tir intégrée permettent des engagements soutenus contre des menaces plus rapides et plus petites, y compris les essaims de drones par saturation et les missiles rasants. Avec un meilleur tampon d'énergie et un guidage automatisé depuis les capteurs du navire, les lasers deviennent une couche fiable de la défense rapprochée plutôt qu'un ajout expérimental."
 tech_turret_missiles_surface_6: "Missiles anti-navires 2045"
 tech_turret_missiles_surface_6_desc: "Les systèmes de missiles antinavires hyperavancés coordonnent les attaques en salve, partagent les mises à jour de visée et ajustent les profils d'approche en vol, améliorant à la fois les missiles de frappe de surface et les armes ASM de standoff."
 tech_turret_missiles_drone_1: "Modules d'essaim naval I"
 tech_turret_missiles_drone_1_desc: "Les modules d'essaim remplacent les missiles traditionnels par des cellules de lancement optimisées pour des drones d'attaque à sens unique. Au lieu d'un unique projectile coûteux, un navire peut inonder une zone défendue de multiples petites menaces, forçant capteurs et intercepteurs ennemis à choisir ce qu'il faut arrêter."
 tech_turret_missiles_drone_2: "Modules d'essaim naval II"
 tech_turret_missiles_drone_2_desc: "Des liaisons de données améliorées et un guidage embarqué permettent aux salves de drones de coordonner leur approche, de se diviser sur plusieurs axes et de recibler en vol selon la situation. Chaque lancement devient un problème de décision pour le défenseur, où la certitude est rare et le temps de réaction court."
 tech_turret_missiles_drone_3: "Modules d'essaim naval III"
 tech_turret_missiles_drone_3_desc: "Le contrôle d'essaim avancé permet des attaques massées semi-autonomes conçues pour saturer la défense aérienne en couches, brouiller le suivi et exploiter les brèches avec une efficacité impitoyable. Avec des charges utiles modulaires et une navigation plus intelligente, les drones kamikazes deviennent une option de frappe navale flexible qui échange la puissance d'un unique tir contre une saturation implacable."
 tech_turret_missiles_aa_6: "Missiles à cellule roulante 2045"
 tech_turret_missiles_aa_6_desc: "Les systèmes RAM très avancés utilisent des autodirecteurs multimodes, une visée coopérative et une gestion rapide des salves pour intercepter drones, aéronefs, missiles de croisière et attaques par saturation."
 tech_vls_surface_6: "Missiles d'attaque de surface VLS 2045"
 tech_vls_surface_6_desc: "Les missiles VLS d'attaque de surface hyperavancés utilisent un routage coopératif, des mises à jour de visée en réseau et des autodirecteurs multimodes pour coordonner des frappes massées contre des zones côtières défendues et des infrastructures militaires dispersées."
 tech_vls_aa_6: "Missiles surface-air à lancement vertical 2045"
 tech_vls_aa_6_desc: "Les missiles VLS surface-air hyperavancés utilisent une fusion capteurs en réseau, un guidage résistant aux contre-mesures et une coordination rapide des salves pour défendre les flottes contre les raids de missiles massés, les essaims de drones et les armes hypersoniques."
 tech_torpedoes_6: "Torpille 2045"
 tech_torpedoes_6_desc: "Les torpilles hyperavancées utilisent des données de visée en réseau, une propulsion à faible bruit et des schémas de recherche autonomes pour se coordonner avec sous-marins, aéronefs, navires de surface et plates-formes sans équipage lors des opérations ASM."
 tech_drone_torpedoes_1: "Torpilles de drones II"
 tech_drone_torpedoes_1_desc: "Les premières torpilles-drones ajoutent guidage et autonomie limitée aux armes sous-marines traditionnelles, améliorant l'acquisition de cibles et réduisant les tirs gaspillés. Avec de meilleurs capteurs et une correction de trajectoire, elles peuvent suivre plus fiablement navires et sous-marins évasifs dans les eaux littorales encombrées."
 tech_drone_torpedoes_2: "Torpilles de drones III"
 tech_drone_torpedoes_2_desc: "Un traitement sonar amélioré et des liaisons de données sécurisées permettent aux torpilles-drones de mettre à jour les cibles en course et de s'adapter aux contre-mesures. Une propulsion et une gestion d'énergie améliorées augmentent portée et endurance, élargissant l'enveloppe d'engagement sans sacrifier la vitesse terminale."
 tech_drone_torpedoes_3: "Torpilles de drones IV"
 tech_drone_torpedoes_3_desc: "L'autonomie avancée transforme les torpilles-drones en chasseurs sous-marins coordonnés, capables de recherche coopérative, d'une logique de réattaque plus intelligente et d'une résistance aux leurres. Avec un suivi de sillage affiné et des autodirecteurs multimodes, elles peuvent percer les défenses modernes et maintenir la pression jusqu'à l'élimination de la cible."
 tech_anti_torpedoes_1: "Défense anti-torpille I"
 tech_anti_torpedoes_1_desc: "Les premières défenses anti-torpilles combinent une alerte sonar améliorée et des contre-mesures basiques pour réduire la chance d'un coup franc. Une meilleure détection et une réaction plus rapide gagnent du temps pour manœuvres d'évasion, déploiement de leurres et écran défensif."
 tech_anti_torpedoes_2: "Défense anti-torpille II"
 tech_anti_torpedoes_2_desc: "Les systèmes d'alerte torpille renforcés intègrent capteurs, affichages tactiques et logique de réponse automatisée pour raccourcir la chaîne de destruction contre les menaces entrantes. Des leurres plus efficaces et une doctrine de manœuvre améliorée augmentent la survivabilité en haute mer comme en littoral."
 tech_anti_torpedoes_3: "Défense anti-torpille III"
 tech_anti_torpedoes_3_desc: "Les suites anti-torpilles avancées associent un suivi haute fidélité à des contre-mesures actives, y compris des intercepteurs à destruction dure conçus pour détruire les torpilles avant l'impact. Capteurs en réseau et systèmes défensifs à tir rapide rendent les attaques sous-marines bien moins décisives, forçant les sous-marins à engager plus d'armes pour moins de résultats."
 tech_nuclear_torpedoes_1: "Torpilles nucléaires II"
 tech_nuclear_torpedoes_1_desc: "Intégrer des ogives nucléaires aux torpilles lourdes transforme la guerre sous-marine en outil de dissuasion catastrophique. La seule possibilité d'une telle frappe force les flottes ennemies à se disperser, à revoir les goulets et à traiter les contacts sous-marins comme des alarmes existentielles. C'est une arme destinée à clore les combats en menaçant de faire sauter les limites."
 tech_nuclear_torpedoes_2: "Torpilles nucléaires III"
 tech_nuclear_torpedoes_2_desc: "Des sauvegardes de commandement améliorées et une doctrine de déploiement plus fiable font des torpilles nucléaires une option de seconde frappe crédible, bien que terrifiante, en mer. Leur présence remodeler la planification navale en relevant le coût des formations massées et des zones de rassemblement côtières. Chaque engagement est ombré par le risque d'escalade."
 tech_nuclear_torpedoes_3: "Torpilles nucléaires IV"
 tech_nuclear_torpedoes_3_desc: "Les concepts avancés de torpilles nucléaires visent à rendre la menace survivable, contrôlable et politiquement utilisable sans en réduire l'horreur. Avec une intégration plus serrée au commandement stratégique et des règles de déclenchement plus claires, l'arme devient un pilier formel de la dissuasion maritime. Une fois déployée, elle contraint l'adversaire à négocier par la peur, non par la confiance."
 tech_landing_craft_1: "Péniche de débarquement"
 tech_landing_craft_1_desc: "Un chaland de débarquement est un petit navire qui transporte des troupes du large vers la côte pour les opérations amphibies."
 tech_landing_craft_2: "Navire d'assaut amphibie"
 tech_landing_craft_2_desc: "Un navire d'assaut amphibie est un bâtiment de guerre utilisé pour fournir un appui aérien et de surface derrière la ligne de front lors d'opérations amphibies sur des côtes ennemies."
 tech_landing_craft_3: "Péniche de débarquement sur coussin d'air"
 tech_landing_craft_3_desc: "Dans les opérations amphibies, les chalands de type navire traditionnels ne peuvent aborder qu'environ 15 % des côtes mondiales, tandis que l'aéroglisseur développé après les années 1960 peut en atteindre 70 %. Son adaptabilité s'en trouve donc grandement améliorée. En même temps, sa vitesse dépasse celle des chalands traditionnels, et il peut emporter des chars de bataille et couvrir le débarquement des marines. L'aéroglisseur a complètement changé les règles du jeu des débarquements amphibies."
 tech_landing_craft_4: "Péniche de débarquement moderne"
 tech_landing_craft_4_desc: "L'introduction de technologies modernes a permis des progrès significatifs des performances des chalands de débarquement, améliorant grandement l'efficacité des débarquements amphibies."
 tech_landing_craft_5: "Équipement de protection spécialisé"
 tech_landing_craft_5_desc: "Un équipement de protection spécial peut grandement améliorer la survivabilité des chalands de débarquement."
 tech_landing_craft_6: "Systèmes d'IA pour péniches de débarquement"
 tech_landing_craft_6_desc: "L'introduction de l'intelligence artificielle permet aux chalands de débarquement de réagir à temps et correctement aux urgences."
 tech_landing_craft_7: "Péniche de débarquement intelligente"
 tech_landing_craft_7_desc: "Le chaland de débarquement intelligent est l'application des technologies futures aux opérations amphibies."
 tech_submarine_engineering_5: "Moteur sous-marin futuriste"
 tech_submarine_engineering_5_desc: "L'introduction de nouvelles technologies peut permettre aux sous-marins d'opérer sous l'eau à plus grande distance, à plus haute vitesse et à plus faible bruit."
 patrol_boat_hull_1_tech: "Bateau de patrouille de 1985"
 patrol_boat_hull_1_tech_desc: "Les patrouilleurs sont des bâtiments légers destinés à la couverture côtière. Ils sont plus petits que leur homologue la corvette et sont également capables d'opérations fluviales."
