 the_new_labor: "Le nouveau Labor"
 australian_jobs_act: "§2La loi australienne sur l'emploi§!"
 julia_gilard_desc: "Militante née au pays de Galles et associée en droit, Gillard a gravi les échelons du gouvernement australien et est devenue la première femme à diriger le pays. \n \nD'abord socialiste de la faction de gauche de l'ALP victorien, Gillard s'est imposée en s'appuyant sur ses liens avec le monde des affaires, un atout forgé par des années comme avocate du travail. S'élevant dans un milieu traditionnellement masculin, et défiant les pronostics tout en restant célibataire et sans croyance religieuse, Gillard a officiellement brisé le statu quo du Parlement. \n\nQuelle que soit la direction qu'elle prenne, le parti la suit avec une inquiétude prudente, s'éloignant des certitudes traditionnelles. Le moindre faux pas pourrait briser la stabilité nouvellement acquise du parti et faire chuter Gillard avant même que son leadership n'ait commencé."
