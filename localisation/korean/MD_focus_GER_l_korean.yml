 GER_mio_trait_ffg_full_width_mine_plough: "전폭 지뢰 제거 쟁기"
 GER_mio_trait_ffg_engineer_excavator_arm: "공병 굴착 암"
 GER_mio_trait_ffg_bergeboxer: "베르게복서"
