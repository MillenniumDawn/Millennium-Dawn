 UKR_storage_item_tu22_tt: "§YТу-22§!\n\n\n£SOV_AIR_Tu_22KD\n\n\n\nНа хранении: §Y[?UKR_storage_tu22_total|0]§!\nПоколение: первый §Rсоветский§! сверхзвуковой бомбардировщик, на вооружении с 1962 года.\nТип техники: §YСтратегический бомбардировщик 3-го поколения§!\n\nВарианты на хранении:\n• Ту-22КД: §Y[?ukraine_has_tu22kd_stockpile|0]§!\n• Ту-22РД: §Y[?ukraine_has_tu22rd_stockpile|0]§!\n\nОба варианта оснащены системой дозаправки в воздухе. §YТу-22КД§! несёт противокорабельную ракету §YХ-22§!, §YТу-22РД§! — дальний разведчик."
