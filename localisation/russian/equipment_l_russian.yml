 MEX_infantry_weapons_1_desc: "Heckler & Koch G3 (Gewehr 3) — это автоматическая боевая винтовка калибра 7,62x51 мм НАТО, разработанная в Западной Германии в 1950-х годах немецким производителем вооружений Heckler & Koch (H&K) в сотрудничестве с испанским государственным конструкторским агентством CETME. G3 заменила FN FAL/G1 в качестве стандартной винтовки с 1959 года и использовалась до модернизации до улучшенной модели G3A1 в 1963 году."
 MEX_infantry_weapons_2_desc: "G3A3 — самая известная модификация винтовки G3. Она оснащена новыми усовершенствованными задними барабанными прицелами с улучшенной мушкой, пламегасителем/дульным тормозом, фиксированным прикладом из цельного пластика и пластиковым цевьём, не соприкасающимся со свободно вывешенным стволом. Цевьё выпускалось в узком вентилируемом и в широком исполнении. Последнее позволяет устанавливать сошки для повышения устойчивости."
 MEX_infantry_weapons_3_desc: "G3A4 — дальнейшее развитие предыдущей модели G3A3 с барабанными прицелами и новым однопозиционным прикладом; некоторые модели получили новую двустороннюю спусковую группу и латунный отражатель гильз для стрелков-левшей. G3A4 поступила на вооружение фронтовых пехотных частей в 1974 году и состояла на вооружении до конца 1990-х годов, после чего была снята с вооружения и заменена."
 JAM_infantry_weapons_3_desc: "Разработка винтовки M16A2 была первоначально запрошена Корпусом морской пехоты США по итогам боевого опыта во Вьетнаме с XM16E1 и M16A1. Она была официально принята на вооружение Министерством обороны под обозначением «Винтовка США калибра 5,56 мм, M16A2» в 1982 году. Морская пехота стала первым видом Вооружённых сил США, принявшим её на вооружение, в начале/середине 1980-х годов, а Армия США последовала её примеру в конце 1980-х."
