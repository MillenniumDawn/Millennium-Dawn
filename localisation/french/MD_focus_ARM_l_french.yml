 POL_AUTH_S_nationalist: "Royaume de Pologne"
 ARM_AUTH_STWO_nationalist: "Saint Royaume d'Arménie"
 ARM_italy_armenian_union: "Nous proposerons à l'Italie de §Rsoumettre à notre volonté§!"
 ARM_shiza_kavkaz_tt: "Le §Rséparatisme§! dans les républiques : §Y[SOO.GetNameWithFlag]§!, §Y[ADY.GetNameWithFlag]§!, §Y[CHE.GetNameWithFlag]§!, §Y[KBK.GetNameWithFlag]§! et §Y[DAG.GetNameWithFlag]§! sera §Gaugmenté§!"
 ARM_Petrosyan: "§4Roi de la colline§!"
 ARM_Petrosyan_desc: "Levon Hakobi Ter-Petrosyan, également connu sous ses initiales LTP, est un homme politique arménien qui a été le premier président de l'Arménie. Il a dirigé le mouvement du Karabakh pour l'unification du Haut-Karabakh, peuplé d'Arméniens, avec l'Arménie en 1988. Il a conduit le pays à travers la première guerre du Haut-Karabakh avec le pays voisin, l'Azerbaïdjan."
 ARM_deideologization_of_democracy: "Désidéologisation de la démocratie"
 ARM_deideologization_of_democracy_desc: "L'Arménie est l'un des rares pays post-soviétiques où la liberté d'expression, le libre marché et les droits de l'homme sont réellement valorisés. Notre petit pays montagneux doit devenir un bastion de la démocratie dans la région."
 ARM_crossroad_diplomacy: "Diplomatie des carrefours"
 ARM_crossroad_diplomacy_desc: "Nous devons utiliser toutes nos capacités diplomatiques régionales pour étendre notre sphère d'influence et établir des relations normales avec tous les pays de la région."
 ARM_wipe_out_koch: "Stopper Kocharian"
 ARM_wipe_out_koch_desc: "Les fonctionnaires corrompus de Kocharyan doivent être éliminés des structures gouvernementales."
 ARM_desovietize_armenia: "Dé-soviétisation de l'Arménie"
 ARM_desovietize_armenia_desc: "Il est impératif de se débarrasser de l'héritage soviétique en Arménie. Le régime communiste n'a apporté à notre nation que larmes, peur, mort, souffrance et la perte de nos terres nationales. Il est temps d'agir."
 ARM_learn_from_cilicia: "Tirer les leçons de l'exemple cilicien"
 ARM_learn_from_cilicia_desc: "Nous devons tirer les leçons de notre histoire, en particulier de la Cilicie, qui a été saccagée en raison d'aspirations irrationnelles de changement radical de politique étrangère. Nous ne devons pas répéter les mêmes erreurs."
 ARM_privatize_land: "Privatisation de la terre"
 ARM_privatize_land_desc: "Nous devons entamer nos réformes économiques en reprenant les terres illégalement accaparées par la mafia, les oligarques et les opportunistes et en les privatisant correctement."
 ARM_press_oligs: "Mise sous pression des oligarques"
 ARM_press_oligs_desc: "Nous devons nous assurer que les oligarques n'auront plus d'influence, au moins au niveau municipal de notre gouvernement."
 ARM_crush_mafia: "Écrasement de la mafia"
 ARM_crush_mafia_desc: "Nous devons écraser toute forme d'activité criminelle en Arménie et punir tous les criminels."
 ARM_utilize_wifes_connections: "Utilisation des relations"
 ARM_utilize_wifes_connections_desc: "Nous devons utiliser les relations familiales pour essayer de normaliser les relations avec Israël."
 ARM_liberalize_economy: "Libéralisation de l'économie"
 ARM_liberalize_economy_desc: "Nous devons libéraliser l'économie pour favoriser une croissance économique rapide."
 ARM_socdem_principles: "Principes sociaux"
 ARM_syria_israel_mediation: "Médiation entre la Syrie et Israël"
 ARM_syria_israel_mediation_desc: "Nous pouvons essayer d'établir un processus de paix entre Israël et la Syrie pour accroître notre sphère d'influence."
 ARM_it_sector: "Développement du secteur des TI"
 ARM_it_sector_desc: "Nous devons développer le secteur informatique, car il s'agit du secteur industriel qui connaît la plus forte croissance dans notre pays."
 ARM_levon_build_roads: "Construction de routes"
 ARM_levon_build_roads_desc: "L'infrastructure en Arménie est dans un état horrible. Nous devons réparer les anciennes routes et en construire de nouvelles pour améliorer la situation."
 ARM_future_looking_strategy: "Stratégie tournée vers l'avenir"
 ARM_future_looking_strategy_desc: "Nous devons poursuivre une stratégie de politique étrangère visant à assurer la stabilité à long terme de la région."
 ARM_defence_levon_invest: "Investissements de défense"
 ARM_defence_levon_invest_desc: "Nous devons investir dans la défense, malgré notre stratégie de politique étrangère visant à la paix dans la région."
 arm_levon.1.t: "L’Arménie propose un accord"
 arm_levon.1.d: "If we accept the new neutral status of Armenia, we can benefit from it to some extent by getting a direct hub in the Caucasus and some financial benefits."
 arm_levon.1.a: "Bien sûr."
 arm_levon.1.b: "Non, nous n'aimons pas l'Arménie."
 arm_levon.2.t: "[FROM.GetNameWithFlag] Accepted"
 arm_levon.2.d: "[FROM.GetNameWithFlag] agree to recognize our new neutral status."
 arm_levon.2.a: "Bien!"
 arm_levon.3.t: "[FROM.GetNameWithFlag] Accepted"
 arm_levon.3.d: "[FROM.GetNameWithFlag] agree to recognize our new neutral status."
 arm_levon.3.a: "Bien!"
 arm_levon.4.t: "[FROM.GetNameWithFlag] Accepted"
 arm_levon.4.d: "[FROM.GetNameWithFlag] agree to recognize our new neutral status."
 arm_levon.4.a: "Bien!"
 arm_levon.5.t: "[FROM.GetNameWithFlag] Accepted"
 arm_levon.5.d: "[FROM.GetNameWithFlag] agree to recognize our new neutral status."
 arm_levon.5.a: "Bien!"
 arm_levon.6.t: "[FROM.GetNameWithFlag] Accepted"
 arm_levon.6.d: "[FROM.GetNameWithFlag] agree to recognize our new neutral status."
 arm_levon.6.a: "Bien!"
 arm_levon.7.t: "[FROM.GetNameWithFlag] Accepted"
 arm_levon.7.d: "[FROM.GetNameWithFlag] agree to recognize our new neutral status."
 arm_levon.7.a: "Bien!"
 arm_levon.8.t: "Échec de la mission"
 arm_levon.8.d: "Unfortunately [FROM.GetNameWithFlag] refused to recognize our neutral status."
 arm_levon.8.a: "Bof."
 arm_levon.9.t: "L’Arménie propose une coopération"
 arm_levon.9.d: "L’Arménie affirme que la coopération avec elle sera plus avantageuse qu’avec l’Azerbaïdjan."
 arm_levon.9.a: "J'ai toujours voulu goûter aux kebabs arméniens."
 arm_levon.9.b: "Non."
 arm_levon.10.t: "Israël change sa stratégie dans le Caucase"
 arm_levon.10.d: "Nous avons réussi à persuader Israël de commencer à coopérer avec nous."
 arm_levon.10.a: "Bien!"
 arm_levon.11.t: "Israël ignore notre offre"
 arm_levon.11.d: "Malheureusement, le pétrole de Bakou sent meilleur que le pain pita arménien."
 arm_levon.11.a: "Bof."
 arm_levon.12.t: "[FROM.GetNameWithFlag] Proposes Peaceful Settlement of Relations"
 arm_levon.12.d: "[FROM.GetNameWithFlag] proposes the creation of a unified security network between our countries to prevent future conflicts."
 arm_levon.12.a: "Nous acceptons."
 arm_levon.12.b: "Non."
 arm_levon.13.t: "Négociations réussies"
 arm_levon.13.d: "Nous avons pu parvenir à une décision commune lors de la récente réunion, une nouvelle ceinture de sécurité sera donc créée."
 arm_levon.13.a: "Bien!"
 arm_levon.14.t: "Négociations réussies"
 arm_levon.14.d: "Nous avons pu parvenir à une décision commune lors de la récente réunion, une nouvelle ceinture de sécurité sera donc créée."
 arm_levon.14.a: "Bien!"
 arm_levon.15.t: "Négociations réussies"
 arm_levon.15.d: "Nous avons pu parvenir à une décision commune lors de la récente réunion, une nouvelle ceinture de sécurité sera donc créée."
 arm_levon.15.a: "Bien!"
 arm_levon.16.t: "Échec des négociations"
 arm_levon.16.d: "Malheureusement, nous n'avons pas réussi à convaincre Israël et la Syrie d'établir un réseau de sécurité commun, nous ne pouvons donc qu'espérer que la prochaine guerre entre eux ne surviendra pas de sitôt."
 arm_levon.16.a: "Mauvais!"
