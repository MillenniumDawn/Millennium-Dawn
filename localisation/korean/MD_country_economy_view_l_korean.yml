 total_civilian_factories_amount_tt: "이 수치는 국가 내의 총 §Y민간 산업§! 시설 수를 나타냅니다."
 total_civilian_factories_amount_tt_delayed: "이 건물은 민수품을 생산하거나 새로운 건물을 건설하기 위한 산업 역량을 주에 제공합니다. 필요한 경우 군수 산업으로 전환할 수 있습니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y206K§!\n§Y민간 산업§!당 기본 GDP 산출량: $§Y17.5 ×십억§!\n기본 에너지 소비량: §R-0.5§! GW\n\n§Y노동력§!에 대한 1인당 GDP 영향: [?worker_requirement_gdp_multiplier_display|-%1]\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y민간 산업 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@civ_facs_worker_requirement_modifier|-%0]\n합산 감소폭은 최대 §Y90%§!로 제한됩니다.\n\n§Y민간 산업§!당 필요 노동자: [?workers_per_civ_fac_display|2]K\n"
 total_military_factories_amount_tt: "이 수치는 국가 내의 총 §Y군수 산업§! 시설 수를 나타냅니다."
 total_military_factories_amount_tt_delayed: "이 건물은 새로운 군사 장비를 생산하기 위한 산업 역량을 주에 제공합니다. 필요한 경우 민간 산업으로 전환할 수 있습니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y18.8K§!\n§Y군수 산업§!당 기본 GDP 산출량: $§Y1.5 ×십억§!\n기본 에너지 소비량: §R-0.5§! GW\n\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y군수 공장 및 조선소 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@mil_facs_worker_requirement_modifier|-%0]\n합산 감소폭은 최대 §Y90%§!로 제한됩니다.\n\n§Y군수 산업§!당 필요 노동자: [?workers_per_mil_fac_display|2]K\n"
 total_naval_yard_amount_tt: "This value represents the total number of §YNaval Yards§! in our nation."
 total_naval_yard_amount_tt_delayed: "§Y해군 조선소§!는 §Y경비정§!, §Y수송선§!, §Y구축함§!, §Y항공모함§! 등 모든 종류의 군용 함선을 생산하는 주의 능력을 나타냅니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y18.8K§!\n§Y해군 조선소§!당 기본 GDP 산출량: $§Y1.5 ×십억§!\n기본 에너지 소비량: §R-0.5§! GW\n\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y군수 공장 및 조선소 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@mil_facs_worker_requirement_modifier|-%0]\n합산 감소폭은 최대 §Y90%§!로 제한됩니다.\n\n§Y해군 조선소§!당 필요 노동자: [?workers_per_dockyard_display|2]K\n"
 total_offices_amount_tt: "이 수치는 국가 내의 총 §Y사무 단지§! 수를 나타냅니다."
 total_offices_amount_tt_delayed: "§Y사무 단지§!는 자원 추출 및 중공업 이외의 경제에 속한 다른 모든 산업을 나타냅니다. 여기에는 금융, 고객 지원, 정보 기술, 소매 서비스 등이 포함됩니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y473K§!\n§Y사무 단지§!당 기본 GDP 산출량: $§Y50 ×십억§!\n기본 에너지 소비량: §R-0.25§! GW\n\n§Y노동력§!에 대한 1인당 GDP 영향: [?worker_requirement_gdp_multiplier_display|-%1]\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y사무 단지 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@offices_worker_requirement_modifier|-%0]\n복합 감소 효과는 최대 §Y90%§!로 제한됩니다.\n\n§Y사무 단지§!당 필요 노동자: [?workers_per_office_display|2]K\n"
 total_agriculture_district_amount_tt: "이 수치는 국가 내의 총 §Y상업화 농업 지구§! 수를 나타냅니다."
 total_agriculture_district_amount_tt_delayed: "§Y상업화 농업 지구§!는 국가 내의 자급자족 농업을 제외한 모든 농업을 포괄적으로 나타냅니다. 농산업, 경작지, 곡물 저장소, 도축장 등이 포함됩니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y188K§!\n§Y상업화 농업 지구§!당 기본 GDP 산출량: $§Y25 ×십억§!\n기본 에너지 소비량: §R-0.10§! GW\n주로부터의 §Y연료 획득§!: 8\n§Y지역 보급품§!: 1.5%\n\n§Y노동력§!에 대한 1인당 GDP 영향: [?worker_requirement_gdp_multiplier_display|-%1]\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y상업화 농업 지구 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@agriculture_district_worker_requirement_modifier|-%0]\n합산 감소폭은 최대 §Y90%§!로 제한됩니다.\n\n§Y상업화 농업 지구§!당 필요 노동자: [?workers_per_agriculture_district_display|2]K\n"
 total_microchips_factories_amount_tt: "이 수치는 국가 내의 총 §Y마이크로칩 공장§! 수를 나타냅니다."
 total_microchips_factories_amount_tt_delayed: "§Y마이크로칩 공장§!은 국가의 반도체 및 소형 전자제품 생산을 나타냅니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y37.5K§!\n§Y마이크로칩 공장§!당 기본 GDP 산출량: $§Y32 ×십억§!\n기본 에너지 소비량: §R-0.75§! GW\n\n§Y노동력§!에 대한 1인당 GDP 영향: [?worker_requirement_gdp_multiplier_display|-%1]\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y마이크로칩 공장 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@microchip_plant_worker_requirement_modifier|-%0]\n합산 감소폭은 최대 §Y90%§!로 제한됩니다.\n\n§Y마이크로칩 공장§!당 필요 노동자: [?workers_per_microchip_plant_display|2]K\n"
 total_composites_factories_amount_tt: "이 수치는 국가 내의 총 §Y첨단 복합재 공장§! 수를 나타냅니다."
 total_composites_factories_amount_tt_delayed: "§Y첨단 복합재 공장§!은 세라믹 장갑, 강화 폴리머 및 고성능 구조 재료를 포함한 첨단 소재 생산 시설을 나타냅니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y37.5K§!\n§Y첨단 복합재 공장§!당 기본 GDP 산출량: $§Y28 ×십억§!\n기본 에너지 소비량: §R-0.8§! GW\n\n§Y노동력§!에 대한 1인당 GDP 영향: [?worker_requirement_gdp_multiplier_display|-%1]\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y첨단 복합재 공장 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@composite_plant_worker_requirement_modifier|-%0]\n합산 감소폭은 최대 §Y90%§!로 제한됩니다.\n\n§Y첨단 복합재 공장§!당 필요 노동자: [?workers_per_composite_plant_display|2]K\n"
 total_refineries_amount_tt: "이 수치는 국가 내의 총 §Y합성 정제소§! 수를 나타냅니다."
 total_refineries_amount_tt_delayed: "§Y합성 정제소§!는 산업 및 물류에 필수적인 합성 고무 및 관련 화학 물질을 생산하는 산업 시설을 나타냅니다.\n\n주에 다음을 제공합니다:\n기본 필요 노동자 수: §Y184K§!\n§Y합성 정제소§!당 기본 GDP 산출량: $§Y10 ×십억§!\n기본 에너지 소비량: §R-0.2§! GW\n\n§Y노동력§!에 대한 1인당 GDP의 영향: [?worker_requirement_gdp_multiplier_display|-%1]\n§Y모든 건물 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@buildings_worker_requirement_modifier|-%0]\n§Y합성 정제소 노동력§!에 대한 법률, 국가 정신, 기술의 영향: [?modifier@synthetic_refinery_worker_requirement_modifier|-%0]\n합산 감소폭은 최대 §Y90%§!로 제한됩니다.\n\n§Y합성 정제소§!당 필요 노동자: [?workers_per_synthetic_refinery_display|2]K\n"
 increases_population_tax_tooltip: "이 버튼은 국가의 §Y인구세율§!을 인상합니다.\n대중은 최대 §Y[?expected_population_tax_rate|0]%§!까지 기대합니다. 이 수준과 최근 우리가 인하한 더 높은 세율을 모두 넘겨 인상하면, 한동안 포인트당 §R2%§!의 §Y안정도§!가 소모됩니다 (§Y정책 전환 비용§! 참조).\n\n§Y전제 조건:§!\n[tax_button_req]\n\n[allowed_to_adjust_personal_tax_laws]"
 increases_population_tax_delayed_tooltip: "£click_left §Y좌클릭§!하여 §Y인구세율§!을 1% 인상합니다.\n£key_shift + £click_left §YShift+좌클릭§!하여 §Y인구세율§!을 5% 인상합니다. (£pol_power_icon [?tax_rate_change_5])\n"
 decreases_population_tax_tooltip: "이 버튼은 국가의 §Y인구세율§!을 인하합니다.\n인구세율을 예상치 §Y[?expected_population_tax_rate|0]%§!와 최근 인상하기 전의 더 낮은 세율 모두보다 낮추면, 한동안 포인트당 §Y안정도§!가 §G0.5%§! 증가하며, 다시 인상하면 이 효과가 사라집니다 (§Y정책 전환 비용§! 참고).\n\n§Y전제 조건:§!\n[tax_button_req]\n\n[allowed_to_adjust_personal_tax_laws]"
 decreases_population_tax_delayed_tooltip: "£click_left §Y좌클릭§!하여 §Y인구세율§!을 1% 인하합니다.\n£key_shift + £click_left §YShift+좌클릭§!하여 §Y인구세율§!을 5% 인하합니다. (£pol_power_icon [?tax_rate_change_5])\n"
 increases_corporate_tax_tooltip: "이 버튼은 국가의 §Y법인세율§!을 인상합니다.\n기업은 우리의 부와 경기 순환에 따라 최대 §Y[?expected_corporate_tax_rate|0]%§!까지 기대합니다. 이 수준과 최근 우리가 인하한 더 높은 세율을 모두 넘겨 인상하면, 한동안 포인트당 §R1.2%§!의 §Y안정도§!가 소모됩니다 (§Y정책 전환 비용§! 참조).\n\n§Y전제 조건:§!\n[tax_button_req]\n\n[allowed_to_adjust_corporate_tax_laws]"
 increases_corporate_tax_delayed_tooltip: "£click_left §Y좌클릭§!하여 §Y법인세율§!을 1% 인상합니다.\n£key_shift + £click_left §YShift+좌클릭§!하여 §Y법인세율§!을 5% 인상합니다. (£pol_power_icon [?tax_rate_change_5])\n"
 decreases_corporate_tax_tooltip: "이 버튼은 국가의 §Y법인세율§!을 인하합니다.\n법인세율을 예상치 §Y[?expected_corporate_tax_rate|0]%§!와 최근 인상하기 전의 더 낮은 세율 모두보다 낮추면, 한동안 §Y월간 생산성 성장§!이 §G0.01§! 증가하고 우리나라에 대한 §Y해외 투자§!가 포인트당 §G2%§! 저렴해지며, 다시 인상하면 이 효과가 사라집니다 (§Y정책 전환 비용§! 참고).\n\n§Y전제 조건:§!\n[tax_button_req]\n\n[allowed_to_adjust_corporate_tax_laws]"
 decreases_corporate_tax_delayed_tooltip: "£click_left §Y좌클릭§!하여 §Y법인세율§!을 1% 인하합니다.\n£key_shift + £click_left §YShift+좌클릭§!하여 §Y법인세율§!을 5% 인하합니다. (£pol_power_icon [?tax_rate_change_5])\n"
 increases_cb_rate_tooltip: "§Y정책 금리§!를 1pp 인상하여 통화 조건을 긴축합니다.\n\n§Y효과:§!\n분기당 인플레이션을 최대 §G0.2%§! 추가로 억제합니다.\n금리를 0% 초과로 인상할 때 인플레이션 이월분이 §G2.5pp§! 감소하며, 예산 적자가 과도한 경우 감소폭은 §G1.25pp§!에 그칩니다. 금리가 0% 이하인 동안에는 이월분이 변하지 않습니다.\n정책 금리가 국채 이자율에 미치는 영향이 최저 하한과 최대 상한이 적용되기 전 기준으로 §R0.33pp§! 증가합니다.\n월간 §Y통화 강세§! 압력이 §G0.001§! 상승하며, 인플레이션이 금리를 크게 웃도는 동안에는 §G0.00025§! 상승합니다 (금리가 인플레이션보다 6pp 높아지면 변화 없음).\n\n§Y전제 조건:§!\n£pol_power_icon §Y25§! 정치력\n정책 금리가 30% 미만\n최근 30일 이내에 금리 변경 없음"
 decreases_cb_rate_tooltip: "§Y정책 금리§!를 1pp 인하하여 통화 조건을 완화합니다.\n\n§Y효과:§!\n분기당 인플레이션 억제가 최대 §R0.2%§! 감소합니다.\n인플레이션 이월 삭감폭이 §R2.5pp§! 감소합니다. 예산 적자가 초과된 경우에는 최소 §R1.25pp§!까지만 감소하며, 이는 양(+)의 금리를 인하할 때에 해당합니다. 금리가 0% 이하이면 이월분에는 변화가 없습니다.\n국채 이자율에서 정책 금리가 차지하는 몫이 최소 하한과 최대 상한이 적용되기 전 기준으로 §G0.33pp§! 감소합니다.\n월간 §Y통화 강세§! 압력이 §R0.001§! 낮아지며, 인플레이션이 금리를 크게 웃도는 동안에는 §R0.00025§! 낮아집니다. (금리가 인플레이션을 6pp 웃도는 동안에는 변화 없음)\n\n§Y전제 조건:§!\n£pol_power_icon §Y25§! 정치력\n정책 금리가 -10% 초과\n최근 30일 이내에 금리 변경 없음"
