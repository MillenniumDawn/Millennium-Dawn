l_japanese:
 SHA_cross_the_sand_wall: "砂の壁を越える"
 SHA_cross_the_sand_wall_desc: "砂の壁は、モロッコが占領する西サハラと自由地帯との国境に沿って延びる、全長2,700キロメートルの防壁である。この壁は、ポリサリオ戦線の浸透を阻止することを目的とした一連の要塞化事業の一環として、1987年に完成した。こうした大規模な防衛措置にもかかわらず、それは我々の活動を阻止するには不十分であり、我々は今後も運動を続けていく。"
 SHA_the_fifth_column: "第五列"
 SHA_the_fifth_column_desc: "ポリサリオ戦線はティンドゥフ周辺の支配権を独占しているが、それにもかかわらず、アルカイダとつながりのある過激派グループの浸透は止まらない。これらのグループは、ハッシュ（麻薬）や密輸品、その他の違法物品を輸送するために、アルジェリアを経由してマリへと移動している。"
 SHA_the_unthinkable_alliance: "想像を絶する同盟"
 SHA_the_unthinkable_alliance_desc: "我々はラヒブ・アユーブの先例に倣い、活動参加者を増やすために海外の過激派組織との連携を公然と行うべきだ。この開放的な方針は、世界的なジハードへの呼びかけを後押しし、占領者たちに対して聖戦を宣言する一助となるだろう。"
 SHA_quash_the_bandits: "盗賊を撃退せよ"
 SHA_quash_the_bandits_desc: "ポリサリオ戦線はティンドゥフ周辺の支配権を独占しているが、それにもかかわらず、アルカイダとつながりのある過激派グループの浸透は止まらない。これらのグループは、ハッシュ（麻薬）や密輸品、その他の違法物品を輸送するために、アルジェリアを経由してマリへと移動している。"
 SHA_establish_cross_border_bases: "国境を越えた拠点の設立"
 SHA_establish_cross_border_bases_desc: "我が軍は、フリーゾーンの特定の地域に進入するため、モーリタニアを経由して定期的に潜入作戦を行っている。安全な通行を確保し、モロッコ軍の攻撃範囲外に軍事拠点を設置するためには、モーリタニア政府と協力しなければならない。"
 SHA_mauritanian_sponsorship: "モーリタニアのスポンサーシップ"
 SHA_mauritanian_sponsorship_desc: "モーリタニアはモロッコを拡張主義的な脅威と見なしており、モロッコの覇権に立ち向かい、我々の独立運動を支援するために、我々と同盟を結ぶ用意がある。"
 SHA_invade_mauritania: "モーリタニアへの侵攻"
 SHA_invade_mauritania_desc: "モーリタニアが西サハラに対する領有権主張を放棄した後も、彼らは依然として我々の大義を妨害し続けている。だからこそ、我々はモーリタニアの反体制派と同盟を結び、モーリタニアの封建国家を打倒すべきである。"
 SHA_our_sahara_is_homeland: "我らが故郷、サハラ"
 SHA_our_sahara_is_homeland_desc: "我らのサハラ、我らの祖国。我らの土地はついに自由を取り戻した。30年以上前にエル・オウアリ・ムスタファ・サイードが始めた運動は実を結び、我々は国家建設に着手し、ティンドゥフから同胞を帰還させることができるようになった。"
 SHA_show_its_hand: "手の内を明かす"
 SHA_show_its_hand_desc: "偽りの仮面が剥がれ落ち、ポリサリオ戦線の上層部は主導権を失った。ラヒブ・アユーブが、盟友モクタール・ベルモクタールの支援を得てクーデターを企てているからだ。"
 SHA_incorporate_the_teknad: "テクナを組み込む"
 SHA_incorporate_the_teknad_desc: "テクナ族は、我々の北部に位置するサハラウィの民族である。歴史的に見て、この地域はかつてスペイン領サハラの一部であり、我が国の領土として不可分のものであるべきである。"
 SHA_uphold_the_oil_contracts: "石油契約を遵守せよ"
 SHA_uphold_the_oil_contracts_desc: "ポリサリオ戦線は、自らが支配する土地がいつの日か自由になった際、これらの石油契約が履行されることを期待して、契約に署名した。その時が今や到来したのだから、我々は約束を果たすべきである。"
 SHA_the_maghreb_insurgency: "マグレブ地域の反乱 "
 SHA_the_maghreb_insurgency_desc: "マグレブ全域で反乱を起こす時が来た。"
 SHA_pledge_allegiance_to_alqaeda: "アルカイダへの忠誠を誓う"
 SHA_pledge_allegiance_to_alqaeda_desc: "アルカイダは長年の同盟者であり、我々は間違いなくこの運動への忠誠を尽くすべきだ。"
 SHA_align_with_bandits: "盗賊との提携"
 SHA_reclaim_the_sahara_TT: "§Yサハラウィが西サハラ全土を掌握すれば、[SHA.GetNameWithFlag]と[MOR.GetNameWithFlag]は交渉を余儀なくされるかもしれない。§!"
 SHA_aligns_the_banditsTT: "§Y我々は盗賊と連携する§!"
 SHA_flip_to_salafist_TT: "§Y政府のイデオロギー§!は、§Hサラフィー・ジハード主義§!へと移行するだろう\n\n"
 SHA_auto_complete_focus_TT: "§G国家方針の自動達成: §!我々は§Y西サハラ§!に対する完全な支配権を確保した。"
 SHA_effect_from_evemt_TT: "§Yイベントによる影響:§!"
 SHA_Cleaner_tooltip_for_MAU_investment_TT: "§Y投資候補先§!\n§g-§! [SHA.GetFlag][SHA.GetNameDefCap]と[MAU.GetFlag][MAU.GetNameDefCap]は今後、互いに§Y投資対象§!となる。"
 SHA_sahara_offensive: "サハラ攻勢"
 SHA_sahara_offensive_desc: "エル・オウアリ・ムスタファ・サイードの名のもとに、我々は勝利を収めるだろう！"
 SHA_cross_border_bases: "国境を越えた拠点"
 SHA_reclaim_the_sahara: "サハラの奪還"
 SHA_reclaim_the_sahara_desc: "「[SHA.GetLeader]の指揮の下、サギア・エル・ハムラとリオ・デ・オロの解放が始まる。」"
 SHA_cross_the_sand_wall_TT: "£decision_icon_small ディシジョン§Yサハラの奪還§!を有効にする"
 SHA_cross_the_sand_line_decision_cat: "砂の境界線を越えて"
 SHA_cross_the_sand_line_decision_cat_desc: "砂と石で築かれた全長2,700kmにも及ぶ巨大な障壁。この「砂の壁」が前線を画している。我々はそこに潜入し、突破して、祖国を奪還しなければならない。"
 SHA_AUTH_SS_fascism: "アル・ムラビトゥーン"
 Sahrawi.1.t: "ラヒブ・アユーブが離反"
 Sahrawi.1.d: "ラヒブ・アユーブは、アルジェリアへの依存、軍事的なエスカレーションの欠如、そしてサハラウィ運動の方向性に関する意見の相違から、モハメド・アブデルアジズ大統領と決別した。離脱後、アユーブはマリへ渡り、ソ連・アフガニスタン戦争のベテランであり、サヘル地域の武装組織の指揮官であるモクタール・ベルモクタールに合流した。アユーブは、ポリサリオ戦線指導部のアルジェリアに対する姿勢が変われば、復帰する可能性もあると示唆している。"
 Sahrawi.1.a: "膿をを切り取るだけだ"
 Sahrawi.1.b: "モクタール・ベルモクタールとの機会を探るべきだ"
 Sahrawi.2.t: "アル＝サハラウィの幻滅"
 Sahrawi.2.d: "ラユーンの裕福な商人の家に生まれた彼は、青年期をアルジェリアの難民キャンプで過ごし、国連が後押しした停戦が成立するまで我が国の軍隊に所属していた。しかし、約束されていた住民投票が実現しなかったことに加え、健康問題やうつ病といった個人的な苦悩も重なり、彼は社会活動から距離を置くようになった。ヌアクショットのイブン・アッバース学院の神学学生たちと交流したことをきっかけに、彼は厳格なイスラム教の道へと転向した。"
 Sahrawi.2.a: "なんと"
 Sahrawi.3.t: "モーリタニアの亡命者"
 Sahrawi.3.d: "ラユーンの裕福な商人の家に生まれた彼は、青年期をアルジェリアの難民キャンプで過ごし、国連が後押しした停戦が成立するまで我が国の軍隊に所属していた。しかし、約束されていた住民投票が実現しなかったことに加え、健康問題やうつ病といった個人的な苦悩も重なり、彼は社会活動から距離を置くようになった。ヌアクショットのイブン・アッバース学院の神学学生たちと交流したことをきっかけに、彼は厳格なイスラム教の道へと転向した。"
 Sahrawi.3.a: "マアウヤ・ウルド・シダ・アフメド・タヤを打倒せよ"
 Sahrawi.4.t: "ティリスの訴え"
 Sahrawi.4.d: "ポリサリオの指導部は南に目を向けている。小火器、対戦車弾薬、および燃料の密かな供給を要請するため、高官からなる代表団がヌアクショットに派遣された。彼らは、より強力なポリサリオこそが、モロッコの拡張主義に対する緩衝材として機能し、モーリタニアの国益に寄与すると主張している。"
 Sahrawi.4.a: "同意する"
 Sahrawi.4.b: "拒否する"
 Sahrawi.5.t: "[MAU.GetLeader]が要請を受諾"
 Sahrawi.5.d: "[MAU.GetLeader]は、余剰の軍事装備をポリサリオ戦線へ密かに移送することを承認した。新しい装備が南の国境を越えて運ばれてくれば、我々はそれを自軍に組み込むことができる。"
 Sahrawi.5.a: "なんと"
 Sahrawi.6.t: "[MAU.GetNameWithFlag] が要請を拒否"
 Sahrawi.6.d: "[MAU.GetLeader]大統領は、サハラウィ側からの軍事装備の提供要請を正式に拒否した。同大統領は、モロッコによる厳しい外交的・経済的報復措置のリスクを理由に挙げ、モーリタニアは1979年の平和条約を今後も遵守していく姿勢を堅持している。"
 Sahrawi.7.t: "ここで切り上げるか？"
 Sahrawi.7.d: "我々は打ちのめされてしまった。そこで問われるのは、戦い続けるか、それとも武器を差し出してここで終わりにするか、ということだ。"
 Sahrawi.7.a: "要請を送れ"
 Sahrawi.7.b: "いや、我々は戦い続けなければならない"
 Sahrawi.8.t: "[MOR.GetNameWithFlag]が和平案を提示"
 Sahrawi.8.d: "あらゆる困難を乗り越え、サハラウィ人民解放軍は、我々の歴史的な居住地を解放するという、不可能と思われた偉業を成し遂げた。モロッコ軍が混乱の中で国境を越えて撤退する中、ラバトから外交的な提案を送られてきた。彼らは、即時停戦と引き換えに、正式な敵対行為の停止と、西サハラに対する我々の主権の承認を提示している。"
 Sahrawi.8.a: "やるべきことはすべて済ませた"
 Sahrawi.8.b: "いや、我々はラバトまで突き進む"
 Sahrawi_news.1.t: "サハラウィ解放戦争が勝利のうちに終結"
 Sahrawi_news.1.d: "数十年にわたる占領の構図を一変させる形で、サハラウィ人民解放軍は、モロッコ王国に対する完全な勝利を公式に宣言した。モロッコの砂の壁の崩壊と、王立軍が1975年以前の国境線まで撤退したことを受け、サハラウィ・アラブ民主共和国は自国の領土を完全に掌握した。ラユーンからダクラに至るまで、サハラウィの旗が誰の妨げもなく翻っている。"
 Sahrawi_news.1.a: "サハラ砂漠でまた一つの戦争が終結した..."
 Sahrawi_news.2.t: "サハラ上空の黒い旗"
 Sahrawi_news.2.d: "過激派組織「アル・ムラビトゥーン」が、ポリサリオ戦線の指導部に対し、夜明けに一斉襲撃を仕掛けた。同組織は、世俗的社会主義の失敗を理由に挙げている。ポリサリオのキャンプ付近では激しい銃撃戦が報告されており、前指導部の安否は依然として不明である。"
 Sahrawi_news.2.a: "サハラ砂漠に影が舞い渡る"
 Sahrawi.6.a: "いい知らせだ"
 SHA_unit_leader_trait_polisario: "ポリサリオ戦線のメンバー"
 SHA_unit_leader_trait_polisario_desc: ""