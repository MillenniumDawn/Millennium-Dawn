 SAU_scp_doctrine_tt:0 "§YOrthodox Marxism-Leninism (Saudi Communist Party only):§!\n§G+10% Factory Efficiency, +10% Construction Speed, +5% Stability§!"
 SAU_nlf_doctrine_tt:0 "§YArab Road to Socialism (National Liberation Front only):§!\n§G+15% Political Power Gain, +10% War Support§!"
 SAU_com_scp_only_tt:0 "The National Liberation Front cannot take the Moscow-aligned road"
 SAU_com_nlf_only_tt:0 "The Saudi Communist Party cannot take the non-aligned road"
 SAU_com_peoples_republic_tt:0 "§YThe Workers' State grows:§!\n§G+5% Political Power Gain, +3% Stability, +2% War Support§!"
 SAU_com_arabian_comintern_tt:0 "§YThe Workers' State grows:§!\n§G+3% War Support, +2% Political Power Gain§!"
 SAU_com_permanent_revolution_tt:0 "§YThe Workers' State grows:§!\n§G+3% Conscription Factor, +2% War Support§!"
 SAU_transitional_council_desc:0 "A caretaker body of officers, jurists, and notables that assumed power after the fall of the monarchy. It rules only until the Republic of Arabia can choose its own course."
 SAU_Military_Council:0 "The Military Council"
 SAU_Military_Council_desc:0 "The generals of the army and the National Guard have seized power, ruling in the name of the people until elections can be held. They promise to keep the peace and to defend the revolution against its enemies."
 SAU_events.104.t:0 "The House of Saud Falls"
 SAU_events.104.d:0 "Decades of absolute monarchy have ended. As crowds fill the streets of Riyadh, a Transitional National Council has seized the reins of state, vowing to govern only until Arabia can choose its own path at the ballot box."
 SAU_events.104.a:0 "A new chapter for Arabia"
 SAU_rep_shia_civil_rights:0 "Shia Civil Rights"
 SAU_rep_shia_civil_rights_desc:0 "Guarantee the Shia community equal standing before the law, ending decades of official discrimination."
 SAU_rep_shia_end_discrimination:0 "End Sectarian Discrimination"
 SAU_rep_shia_end_discrimination_desc:0 "Strike down the sectarian barriers in employment, the courts, and the seminaries."
 SAU_rep_shia_holy_sites:0 "Guardians of the Holy Sites"
 SAU_rep_shia_holy_sites_desc:0 "Assume joint stewardship of the holy cities, governing the pilgrimage for all Muslims."
 SAU_rep_shia_national_dialogue:0 "National Dialogue"
 SAU_rep_shia_national_dialogue_desc:0 "Seek redress for the Shia through negotiation and the ballot box rather than confrontation."
 SAU_rep_shia_reconciliation:0 "Reconcile with the Republic"
 SAU_rep_shia_reconciliation_desc:0 "Bury old grievances and accept a place within the national framework, trading revolution for representation."
 SAU_rep_shia_eastern_province:0 "Develop the Eastern Province"
 SAU_rep_shia_eastern_province_desc:0 "Channel the republic's oil wealth into the long-neglected Shia heartland of the east."
 SAU_rep_shia_parliament:0 "The Parliamentary Path"
 SAU_rep_shia_parliament_desc:0 "Commit the movement to an elected assembly, contesting power openly as a loyal opposition."
 SAU_rep_shia_religious_freedom:0 "Guarantee Religious Freedom"
 SAU_rep_shia_religious_freedom_desc:0 "Protect the rites and seminaries of every community under a tolerant, secular republic."
 SAU_rep_shia_coexistence:0 "Sectarian Coexistence"
 SAU_rep_shia_coexistence_desc:0 "Forge a national compact between Sunni and Shia, founded on shared citizenship."
 SAU_rep_shia_federal_autonomy:0 "Federal Autonomy"
 SAU_rep_shia_federal_autonomy_desc:0 "Devolve real power to the Shia provinces within a federal, pluralist union."
 SAU_rep_shia_const_republic:0 "The Constitutional Shia Republic"
 SAU_rep_shia_const_republic_desc:0 "Crown the moderate path with a constitutional republic securing Shia rights within a pluralist order."
 SAU_rep_shia_resistance:0 "The Resistance"
 SAU_rep_shia_resistance_desc:0 "Rally the faithful to armed struggle, in the spirit of the Hejaz Hezbollah."
 SAU_rep_shia_wilayat_faqih:0 "Wilayat al-Faqih"
 SAU_rep_shia_wilayat_faqih_desc:0 "Enshrine the guardianship of the jurist, vesting ultimate authority in the supreme religious leader."
 SAU_rep_shia_iran_alignment:0 "Alliance with Iran"
 SAU_rep_shia_iran_alignment_desc:0 "Bind the new state to Tehran, patron of the Shia revolution across the region."
 SAU_rep_shia_arm_faithful:0 "Arm the Faithful"
 SAU_rep_shia_arm_faithful_desc:0 "Distribute weapons and training to the militias of the revolution."
 SAU_rep_shia_brigades:0 "Hezbollah Brigades"
 SAU_rep_shia_brigades_desc:0 "Forge the militias into disciplined brigades modelled on the Lebanese resistance."
 SAU_rep_shia_export_revolution:0 "Export the Revolution"
 SAU_rep_shia_export_revolution_desc:0 "Carry the revolution beyond Arabia's borders to the Shia of the Gulf."
 SAU_rep_shia_vanguard:0 "The Revolutionary Vanguard"
 SAU_rep_shia_vanguard_desc:0 "Place the armed clergy at the head of the state, above party and parliament."
 SAU_rep_shia_islamic_republic:0 "The Islamic Republic of Arabia"
 SAU_rep_shia_islamic_republic_desc:0 "Proclaim the Islamic Republic under the guardianship of the jurist, aligned with the axis of resistance."
 SAU_rep_shia_moderate_doctrine_tt:0 "The Reform Movement governs through reconciliation, welfare, and the ballot box."
 SAU_rep_shia_hardline_doctrine_tt:0 "Hezbollah Al-Hejaz rules in the name of the jurist, the nation mobilized for the resistance."
 SAU_events.92.t:0 "The Character of the Republic"
 SAU_events.92.d:0 "With the Shia movement ascendant, the constituent assembly must settle what kind of state the republic will be: an Islamic Republic founded on religious authority, or the secular Republic of Arabia."
 SAU_events.92.a:0 "Proclaim the Islamic Republic"
 SAU_events.92.b:0 "Keep the Republic of Arabia"
 SAU_rep_shia_iran_choice_tt:0 "A choice will be offered: join the Iranian Axis of Resistance, or forge an independent front."
 SAU_events.93.t:0 "The Axis of Resistance"
 SAU_events.93.d:0 "Tehran extends its hand to the new Shia republic. The hardliners must choose: take a place within the Iranian Axis of Resistance under the guardianship of the Supreme Leader, or forge an independent front that answers to no foreign capital."
 SAU_events.93.a:0 "Join the Iranian Axis of Resistance"
 SAU_events.93.b:0 "Forge an Independent Anti-Imperialist Front"
 SAU_axis_of_resistance_faction:0 "Axis of Resistance"
 SAU_anti_imperialist_front:0 "Anti-Imperialist Front"
 SAU_events.94.t:0 "An Invitation from Arabia"
 SAU_events.94.d:0 "The Republic of Arabia raises a rival banner to the Axis of Resistance, calling on our nation to break with Tehran and join an independent front led from Riyadh."
 SAU_events.94.a:0 "Join the front"
 SAU_events.94.b:0 "Decline the invitation"
 SAU_events.95.t:0 "The Arab Comintern"
 SAU_events.95.d:0 "Red Arabia calls on the workers and revolutionaries of the Arab world to unite under a single banner."
 SAU_events.95.a:0 "Join the Arab Comintern"
 SAU_events.95.b:0 "Stand apart"
 SAU_events.96.t:0 "The People's Republic of Arabia"
 SAU_events.96.d:0 "The red flag flies over Riyadh. The House of Saud is swept aside and the People's Republic of Arabia is proclaimed, vowing to carry the revolution across the Arab world."
 SAU_events.96.a:0 "A red dawn rises"
 SAU_events.97.t:0 "The Islamic Republic of Arabia"
 SAU_events.97.d:0 "The constituent assembly has proclaimed the Islamic Republic of Arabia, founded on the guardianship of the jurist and the rule of the faithful."
 SAU_events.97.a:0 "So it is proclaimed"
 SAU_events.98.t:0 "Schism in the Axis"
 SAU_events.98.d:0 "Arabia has broken with Tehran, rejecting Iranian tutelage to lead its own anti-imperialist front. The Shia world is split between two rival centres of resistance."
 SAU_events.98.a:0 "A dangerous rift"
 SAU_communist_state:0 "The Socialist State"
 SAU_scp_doctrine:0 "Marxist-Leninist Vanguard"
 SAU_nlf_doctrine:0 "Non-Aligned Socialism"
 SAU_rep_shia_moderate_doctrine:0 "Reformist Governance"
 SAU_rep_shia_hardline_doctrine:0 "Revolutionary Theocracy"
 SAU_events.99.t:0 "The Saudi Schism"
 SAU_events.99.d:0 "Riyadh has broken with the Axis and lured away our allies. Tehran must decide how to answer this betrayal of the resistance."
 SAU_events.99.a:0 "They will answer for this"
 SAU_events.100.t:0 "War in the Gulf"
 SAU_events.100.d:0 "Iran has gone to war against the breakaway Republic of Arabia, plunging the Gulf into open conflict between the two rival centres of Shia power."
 SAU_events.100.a:0 "The region holds its breath"
 SAU_events.101.t:0 "Tehran Seethes"
 SAU_events.101.d:0 "Tehran has stopped short of war, but its fury is plain. Iranian agents stir unrest in our cities and Iranian media brands the republic a heretic state."
 SAU_events.101.a:0 "We will endure"
 SAU_rep_shia_moderate_choice_tt:0 "A foreign-policy choice will be offered: reconcile with the Gulf monarchies, or lead the Arab democracies."
 SAU_events.102.t:0 "The Republic and the Region"
 SAU_events.102.d:0 "With a parliament seated and the republic on its feet, the question of where Arabia stands in the world can no longer be deferred. Will it make peace with the Gulf monarchies, or lead the cause of Arab democracy?"
 SAU_events.102.a:0 "Reconcile with the Gulf monarchies"
 SAU_events.102.b:0 "Champion the cause of Arab democracy"
 SAU_events.103.t:0 "A Call to the Democracies"
 SAU_events.103.d:0 "The Republic of Arabia invites our nation into a league of Arab democracies, a bloc answerable to its peoples rather than to kings or clerics."
 SAU_events.103.a:0 "Join the league"
 SAU_events.103.b:0 "Remain independent"
 SAU_arab_democratic_league:0 "League of Arab Democracies"
 SAU_rep_shia_state:0 "The Shia Republic"
 SAU_rep_shia_state_tt:0 "The institutions of the Shia republic grow stronger with each reform won and each victory taken."
 SAU_rep_shia_growth_tt:0 "Strengthens the foundations of the Shia Republic."
