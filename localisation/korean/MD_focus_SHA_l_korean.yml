l_korean:
 SHA_cross_the_sand_wall: "모래 방벽 돌파"
 SHA_cross_the_sand_wall_desc: "모로코의 서사하라 방벽은 모로코가 점령한 서사하라와 자유 지대의 경계를 따라 이어진 길이 2,700km의 모래 방벽입니다. 이 방벽은 폴리사리오 전선의 침투를 저지하기 위한 일련의 방어 시설의 일환으로 1987년에 완공되었습니다. 이러한 막대한 방어 노력에도 불구하고 우리의 노력을 막기에는 부족할 것이며, 우리는 투쟁을 계속할 것입니다."
 SHA_the_fifth_column: "제5열"
 SHA_the_fifth_column_desc: "폴리사리오 전선이 틴두프 일대의 통제권을 독점하고 있지만, 알카에다와 연계된 무장 단체의 침투를 막지는 못합니다. 이들은 해시시(마약)나 밀수품, 기타 불법 물자를 운반하기 위해 알제리를 거쳐 말리로 넘나듭니다."
 SHA_the_unthinkable_alliance: "상상할 수 없던 동맹"
 SHA_the_unthinkable_alliance_desc: "우리는 라흐비브 아유브의 선례를 따라 외국 무장 단체들과 관계를 맺어 투쟁의 병력 규모를 늘려야 합니다. 이러한 개방 정책은 전 세계적인 지하드에 호소하고 점령자들을 상대로 성전을 선포하는 데 도움이 될 것입니다."
 SHA_quash_the_bandits: "무장 강도 진압"
 SHA_quash_the_bandits_desc: "폴리사리오 전선이 틴두프 일대의 통제권을 독점하고 있지만, 알카에다와 연계된 무장 단체의 침투를 막지는 못합니다. 이들은 해시시(마약)나 밀수품, 기타 불법 물자를 운반하기 위해 알제리를 거쳐 말리로 넘나듭니다."
 SHA_establish_cross_border_bases: "국경 횡단 기지 구축"
 SHA_establish_cross_border_bases_desc: "우리 병력은 자유 지대의 특정 지역에 접근하기 위해 모리타니를 거쳐 정기적으로 침투하고 있습니다. 우리는 모리타니 정부와 협력하여 안전한 통행로를 확보하고 모로코의 표적에서 벗어난 곳에 군사 단지를 세워야 합니다."
 SHA_mauritanian_sponsorship: "모리타니의 후원"
 SHA_mauritanian_sponsorship_desc: "모리타니는 모로코를 팽창주의적 위협으로 보고 있으며, 모로코의 패권에 맞서고 우리의 독립 투쟁을 지원하기 위해 우리와 동맹을 맺을 의향이 있습니다."
 SHA_invade_mauritania: "모리타니 침공"
 SHA_invade_mauritania_desc: "모리타니가 서사하라에 대한 영유권 주장을 포기한 뒤에도 그들은 여전히 우리의 대의를 훼손하고 있습니다. 우리는 모리타니의 반체제 인사들과 동맹을 맺고 모리타니의 봉건 국가를 타도해야 합니다."
 SHA_our_sahara_is_homeland: "우리의 사하라는 조국이다"
 SHA_our_sahara_is_homeland_desc: "우리의 사하라, 우리의 조국. 우리의 땅은 마침내 자유로워졌습니다. 30여 년 전 엘우알리 무스타파 사예드가 시작한 투쟁은 결실을 맺었으며, 우리는 국가 건설과 틴두프로부터 우리 국민의 귀환을 시작할 수 있습니다."
 SHA_show_its_hand: "정체를 드러내다"
 SHA_show_its_hand_desc: "가면이 벗겨졌고, 라흐비브 아유브가 동맹인 모크타르 벨모크타르의 지원을 받아 쿠데타를 모의하면서 폴리사리오 전선 최고 지휘부는 영향력을 잃었습니다."
 SHA_incorporate_the_teknad: "테크나 편입"
 SHA_incorporate_the_teknad_desc: "테크나는 우리 북쪽에 거주하는 사흐라위계 민족입니다. 역사적으로 이곳은 스페인령 사하라의 영토였으며 우리 국가의 불가분한 일부여야 합니다."
 SHA_uphold_the_oil_contracts: "석유 계약 이행"
 SHA_uphold_the_oil_contracts_desc: "폴리사리오 전선은 언젠가 자신들의 땅이 자유로워지면 이 계약을 지켜 줄 것이라는 기대 속에서 석유 계약에 서명했습니다. 이제 그 때가 왔으니, 우리는 이 약속을 지켜야 합니다."
 SHA_the_maghreb_insurgency: "마그레브 반란"
 SHA_the_maghreb_insurgency_desc: "마그레브 전역에서 반란을 일으킬 때가 왔습니다."
 SHA_pledge_allegiance_to_alqaeda: "알카에다에 충성 서약"
 SHA_pledge_allegiance_to_alqaeda_desc: "알카에다는 오랜 동맹이었으며, 우리는 이 운동에 대한 충성을 확실히 해야 합니다."
 SHA_align_with_bandits: "무장 강도와의 제휴"
 SHA_reclaim_the_sahara_TT: "§Y[SHA.GetNameWithFlag](이)가 서사하라 주 전체를 장악하면 [MOR.GetNameWithFlag]은(는) 협상에 나서야 할 수도 있습니다.§!"
 SHA_aligns_the_banditsTT: "§Y우리를 무장 강도와 제휴시킵니다§!"
 SHA_flip_to_salafist_TT: "§Y정부 이념§!이 §H살라피 지하디즘§!으로 전환됩니다\n\n"
 SHA_auto_complete_focus_TT: "§G중점 자동 완료:§! 우리는 §Y서사하라§!에 대한 완전한 통제권을 확보했습니다."
 SHA_effect_from_evemt_TT: "§Y사건의 효과:§!"
 SHA_Cleaner_tooltip_for_MAU_investment_TT: "§Y투자 가능 대상§!\n§g-§! [SHA.GetFlag] [SHA.GetNameDefCap]과(와) [MAU.GetFlag] [MAU.GetNameDefCap]은(는) 이제 서로의 §Y투자 대상§!이 됩니다"
 SHA_sahara_offensive: "사하라 공세"
 SHA_sahara_offensive_desc: "엘우알리 무스타파 사예드의 이름으로 우리는 승리할 것입니다!"
 SHA_cross_border_bases: "국경 횡단 기지"
 SHA_reclaim_the_sahara: "사하라 수복"
 SHA_reclaim_the_sahara_desc: "'[SHA.GetLeader]의 지휘 아래 사기아 엘함라와 리오데오로의 해방이 시작된다.'"
 SHA_cross_the_sand_wall_TT: "£decision_icon_small §Y사하라 수복§! 결정을 활성화합니다"
 SHA_cross_the_sand_line_decision_cat: "모래 전선 돌파"
 SHA_cross_the_sand_line_decision_cat_desc: "모래와 돌로 이루어진 길이 2,700km의 거대한 장벽입니다. 이 '모래 방벽'이 전선을 규정합니다. 우리는 이를 침투하고 돌파하여 조국을 되찾아야 합니다."
 SHA_AUTH_SS_fascism: "알무라비툰"
 Sahrawi.1.t: "라흐비브 아유브의 이탈"
 Sahrawi.1.d: "라흐비브 아유브는 알제리에 대한 전선의 의존, 군사적 확전의 부재, 사흐라위 대의의 방향을 둘러싼 의견 차이로 모하메드 압델아지즈 대통령과 갈라섰습니다. 이탈 후 아유브는 말리로 건너가 소련-아프간 전쟁 참전 용사이자 사헬 지역 무장 단체의 지휘관인 모크타르 벨모크타르와 합류했습니다. 아유브는 폴리사리오 전선 지도부의 알제리에 대한 입장이 바뀐다면 돌아올 수도 있다는 뜻을 내비쳤습니다."
 Sahrawi.1.a: "썩은 부분을 도려내라"
 Sahrawi.1.b: "모크타르 벨모크타르와 손잡을 기회를 모색해야 한다"
 Sahrawi.2.t: "알사흐라위의 환멸"
 Sahrawi.2.d: "라윤의 부유한 상인 가문 출신인 그는 알제리의 난민촌에서 청년기를 보냈고 UN이 중재한 휴전까지 우리 군에서 복무했습니다. 그러나 약속된 국민투표가 무산되고 건강과 우울증으로 인한 개인적 고통까지 겹치면서 그는 사회 운동에서 멀어지게 되었습니다. 누악쇼트의 이븐 압바스 연구소 소속 종교 학생들과 접촉한 뒤 그는 엄격한 형태의 이슬람으로 기울었습니다."
 Sahrawi.2.a: "어머나"
 Sahrawi.3.t: "모리타니의 이탈자"
 Sahrawi.3.d: "라윤의 부유한 상인 가문 출신인 그는 알제리의 난민촌에서 청년기를 보냈고 UN이 중재한 휴전까지 우리 군에서 복무했습니다. 그러나 약속된 국민투표가 무산되고 건강과 우울증으로 인한 개인적 고통까지 겹치면서 그는 사회 운동에서 멀어지게 되었습니다. 누악쇼트의 이븐 압바스 연구소 소속 종교 학생들과 접촉한 뒤 그는 엄격한 형태의 이슬람으로 기울었습니다."
 Sahrawi.3.a: "마우위야 울드 시디 아흐메드 타야를 타도하라"
 Sahrawi.4.t: "티리스의 호소"
 Sahrawi.4.d: "폴리사리오 지도부가 남쪽으로 눈을 돌리고 있습니다. 소형 화기, 대전차 탄약, 연료 보급품을 은밀히 지원해 달라고 요청하기 위해 고위급 대표단이 누악쇼트로 파견되었습니다. 그들은 더 강한 폴리사리오가 모로코의 팽창주의에 대한 완충 역할을 함으로써 모리타니의 이익에 기여한다고 주장합니다."
 Sahrawi.4.a: "동의한다"
 Sahrawi.4.b: "거부한다"
 Sahrawi.5.t: "[MAU.GetLeader]이(가) 우리의 호소를 수락함"
 Sahrawi.5.d: "[MAU.GetLeader] 대통령은 사흐라위의 군사 장비 요청을 공식적으로 거절했습니다. 모리타니 측은 모로코의 심각한 외교적, 경제적 보복 위험을 이유로 들었으며, 모리타니는 1979년 평화 조약을 계속 준수하겠다고 밝혔습니다."
 Sahrawi.5.a: "아"
 Sahrawi.6.t: "[MAU.GetNameWithFlag]이(가) 요청을 거부함"
 Sahrawi.6.d: "[MAU.GetLeader]이(가) 잉여 군사 장비를 폴리사리오 전선에 비밀리에 이전하는 것을 승인했습니다. 새 장비가 남쪽 국경을 넘어 들어오면 우리는 이를 군에 편입할 수 있습니다."
 Sahrawi.7.t: "여기서 끝내야 하는가?"
 Sahrawi.7.d: "우리는 궤멸적인 타격을 입었으며, 이제 계속 싸울 것인지 무기를 넘기고 여기서 끝낼 것인지가 문제입니다."
 Sahrawi.7.a: "제안을 보낸다"
 Sahrawi.7.b: "아니다, 계속 싸워야 한다"
 Sahrawi.8.t: "[MOR.GetNameWithFlag]이(가) 평화를 제안함"
 Sahrawi.8.d: "모든 역경을 딛고 사흐라위 인민 해방군은 우리의 역사적 정착지를 해방하는 불가능한 일을 해냈습니다. 모로코군이 혼란 속에 국경 너머로 퇴각하면서 라바트가 외교적 제안을 보내왔습니다. 그들은 즉각적인 휴전의 대가로 적대 행위의 공식 중단과 서사하라에 대한 우리의 주권 인정을 제시하고 있습니다."
 Sahrawi.8.a: "우리는 필요한 것을 이루었다"
 Sahrawi.8.b: "아니다, 라바트까지 밀어붙인다"
 Sahrawi_news.1.t: "승리로 끝난 사흐라위 해방 전쟁"
 Sahrawi_news.1.d: "수십 년에 걸친 점령을 뒤집고 사흐라위 인민 해방군(SPLA)이 모로코 왕국에 대한 완전한 승리를 공식 선언했습니다. 모로코의 '방벽' 방어선이 붕괴하고 왕립군이 1975년 이전 국경으로 철수한 뒤, 사흐라위 아랍 민주공화국은 자국 영토에 대한 완전한 통제권을 장악했습니다. 라윤에서 다클라에 이르기까지 사흐라위 국기가 도전받지 않고 휘날리고 있습니다."
 Sahrawi_news.1.a: "사하라에서 또 하나의 전쟁이 막을 내린다..."
 Sahrawi_news.2.t: "사하라 위의 검은 깃발"
 Sahrawi_news.2.d: "무장 단체 알무라비툰이 폴리사리오 전선 지도부를 노린 동시 다발 새벽 습격을 감행했습니다. 그들은 세속적 사회주의의 실패를 이유로 들었습니다. 폴리사리오 진영 부근에서 격렬한 총성이 보고되었으며, 이전 지도부의 행방은 알려지지 않았습니다."
 Sahrawi_news.2.a: "사하라 위로 그림자가 드리운다"
 SHA_unit_leader_trait_polisario: "폴리사리오 전선 대원"
 SHA_unit_leader_trait_polisario_desc: ""
 Sahrawi.6.a: "좋은 소식이군"
 SHA_algerian_education: "알제리 교육"