 fao_alliance: "압제 대항전선"
 UAR_arab_liberation_front: "아랍 해방전선"
 taj_alliance: "TAJ 조약"
 faction_taj_alliance: "TAJ 회원국"
 faction_taj_alliance_desc: "이 나라는 TAJ 조약(왕관 조약)의 회원국입니다. 타지키스탄 정부가 설립한 이 동맹은 중앙아시아 국가들을 해치려는 세력에 대한 통합 방위를 제공하는 것을 목표로 합니다. 일각에서는 타지키스탄 정부가 러시아 정부와 거리를 두게 된 결과 러시아의 침략을 억제하기 위해 이 동맹이 만들어졌다고 추측합니다."
 faction_taj_alliance_call_ally_rule_tt: "§R TAJ 동맹 회원국은 방어 전쟁에서만 동맹을 호출할 수 있습니다!§!"
 faction_taj_alliance_join_ally_rule_tt: "§R TAJ 회원국은 방어 전쟁에서만 동맹에 참전할 수 있습니다!§!"
 faction_taj_alliance_join_faction_rule_tt: "§R중동과 중앙아시아의 일부 국가만 TAJ 조약에 가입할 수 있습니다!§!"
 faction_taj_alliance_offer_join_faction_rule_tt: "§R중동과 중앙아시아의 일부 국가만 TAJ 조약에 가입할 수 있습니다!§!"
 seato_alliance: "EAST"
 faction_seato_alliance: "EAST 회원국"
 faction_seato_alliance_desc: "EAST는 동아시아 안보 조약(East Asian Security Treaty)의 약자입니다. 이 세력은 커져 가는 중국의 영향력과 지배력에 대항하여 동아시아에서 더 강력한 민주주의 동맹을 구축하려는 미국의 지원 아래 창설되었습니다. 세력의 공식 목표는 지역의 민주주의 규범을 수호하고 회원국 간 군사 협력과 안보를 강화하는 것입니다."
 faction_seato_TT: "§R세력 특수 규칙§!:\n- 동아시아와 오세아니아의 일부 국가만 세력에 가입할 수 있습니다\n- 국가는 방어 전쟁에서만 호출될 수 있습니다"
 faction_seato_alliance_call_ally_rule_tt: "§R EAST 동맹 회원국은 방어 전쟁에서만 동맹을 호출할 수 있습니다!§!"
 faction_seato_alliance_join_ally_rule_tt: "§R EAST 회원국은 방어 전쟁에서만 동맹에 참전할 수 있습니다!§!"
 faction_seato_alliance_join_faction_rule_tt: "§R동아시아와 오세아니아의 일부 국가만 EAST에 가입할 수 있습니다!§!"
 faction_seato_alliance_offer_join_faction_rule_tt: "§R동아시아와 오세아니아의 일부 국가만 EAST에 가입할 수 있습니다!§!"
 imperial_Union: "제국 연합"
 axis_of_resistance: "저항의 축"
 SCO_name: "상하이 협력 기구"
 faction_manifest_sco_name: "유라시아 화합을 향하여"
 faction_manifest_sco_desc: "이 선언문은 포용적이고 안정적이며 주권을 가진 유라시아 공간을 위한 상하이 협력 기구(SCO) 회원국들의 공동 비전을 제시합니다. 상호 존중, 내정 불간섭, 호혜적 협력의 원칙에 뿌리를 두고 있습니다."
 faction_goal_sco_connected_capitals_name: "연결된 수도들"
 faction_goal_sco_connected_capitals_desc: "생산성과 단결을 높이기 위해 이 세력의 모든 수도를 철도로 연결해야 합니다."
 joining_rule_sco: "상하이 협력 기구 회원국만"
 joining_rule_sco_eco: "상하이 협력 기구 회원국만"
