 israel_economy.210.t: "이스라엘과의 해상 국경 분쟁!"
 israel_economy.210.d: "이스라엘이 최근 바다의 갈릴리 가스전을 더 많이 자국 것이라 주장하기 시작했으며, 심지어 우리 해안 근처까지 해군 작전을 확장했습니다. 갈등의 확대를 막기 위해 이스라엘은 우리에게 임시 석유 협정을 제안했습니다. 동의하시겠습니까?"
 israel_economy.210.a: "그래... 일단은."
 israel_economy.210.b: "갈릴리를 물에 잠기게 하라!"
 israel_economy.211.t: "헤즈볼라의 수락!"
 israel_economy.211.d: "그들이 우리의 임시 석유 협정에 동의했으며, 양측 간의 문제가 당분간 어느 정도 완화되었습니다."
 israel_economy.211.a: "좋다!"
 israel_economy.212.t: "우리를 위협하는 헤즈볼라!"
 israel_economy.212.d: "그들은 우리의 협정을 받아들이지 않았으며 전면전으로 우리를 위협합니다!"
 israel_economy.212.a: "아, 젠장..."
