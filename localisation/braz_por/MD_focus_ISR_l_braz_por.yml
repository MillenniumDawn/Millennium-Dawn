 arab_mafia_1: "Máfia Árabe §tIncontrolável§!"
 arab_mafia_1_desc: "Enquanto a Polícia Israelense iniciou um programa de dissolução gradual de todas as gangues criminosas israelenses, ele se concentrou apenas nas judaicas; enquanto isso, as taxas de crime intertribal e interfamiliar entre as populações árabes começaram a disparar, com enormes quantidades de armas vindas da Cisjordânia e da Jordânia alimentando ciclos intermináveis de violência que só acabam matando cada vez mais civis árabes israelenses inocentes.\n§W--------------§!\nEste espírito nacional irá §GMelhorar§! a cada foco que concluirmos no ramo do crime árabe, de §Y$ISR_learn_from_october_events$§! ou §Y$ISR_rely_on_gideonites$§! até §Y$ISR_storm_tuba_zangariya$§!, e será §RRemovido§! quando esse ramo estiver completo."
